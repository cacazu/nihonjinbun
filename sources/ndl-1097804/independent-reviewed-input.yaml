    - ocr: ノ佛蘭西ノ議會ガ自分ノ國王デアル所ノルイ十六世ニ對シ國民ニ對スル叛逆者トシマシテ、色々ト或處罰法ヲ考究シ、ノ議會ニ於テ七百二十一人ノ出席デ、二十六票ノ多數ヲ以テ、國王死刑ノ議案ヲ可决シタノデアリマス。愛國者ヲ以テ成立ツテ居ル議會ガ、其君主ヲ死刑ニスル議案ヲ可决シテ居ルノデハアリマセンカ。即チ彼等ニ於テハ忠君ト云フヤウナ考ヘガナイノデアリマス。亞米利加人ナドニモ、忠君ノ考ハ全クアリマセン。ソレデ我國体ノ著シイ特色ハ忠君愛國ノ其歸ヲ同ジクスルコトデアリマス、ソレカラ其次ハ+、君民-家ノ特色デアリマス。元來我國ハ立國ノ精神ガ家族主義デアリマス。御承知ノ通リ昔伊弉諸伊弉冉二尊ガ破馭虛島ニ八尋殿ヲオ建テ遊バシマシテ、其處デ御結婚ノ式ヲ擧ゲラレ、家族制度ノ基礎ヲ建テラレマシテ以來今日マデズツトソレガ國体ノ根柢ヲ爲シテ參ツテ居リマス。ソレヲ先年京都大學ニ瀧川〓授ト云フノガアツテ、我ガ家族制度ヲ攻擊致シマシテ一家族制度ト云フモノハ良風美俗ノ名ノ下ニ存スル封建制度ノ殘骸デアル』ト申シマシタ。コレデハ日本精神ハ滿足シマセン。玆ニ囂然トシテ議論ガ起リ、遂ニ瀧川〓授ハ大學ヲ罷メナケレバナラナクナリマシタ。ツマリ我國體ハ家族制度ト云フモノヲ以テ根本トシテ居リマス。其家族制度ハ家長ト云フ者ヲ立テテ、ソシテ其一家ノ秩序、統一ヲ立テルノデアリマス、一軒ノ家ニ於テ家長ガアツテ家族ノ者ガソレニ服従スル、家長ハ家族ノモノヲ自我トシテ之ヲ愛護スル。幼稚ナ時カラ、言葉モ好ク利ケナイ内カラカヽル秋序、統一ノ精神ガ養成サレテ來ル。此一軒ノ家ニ於テ此養成サレタ精神ガ、大キクナツテ日本國民トナリマスト云フト.此處ニ天皇陛下ヲ家長ト仰ギ、天皇陛下ハ國民ヲ大御實トシテ愛護セラレ、以テ君臨アラセラレ、玆ニ家族制度ニナル秩序.統一ノ世界無比ナル國體ガ出來テ來テ居ルノデアリマス、ソコデ『義ハ君臣ニシテ情ハ父子』ト仰セニナリ、或ハ罪アラバ我ヲトガメヨ天ツ神民ハ我身ノ生ミシ子ナレバトノ御製ノアリマスル通リ、臣民ハ陛下ノ御子ト申ス風ナ關係ニアルノデアリマス。デスカラ我々臣民タルモノモ君ガ世ヲ思フ心ノ一筋ニ我身アリトハ思ハサリケリ即チ臣民ガ西洋ノ個人主義ノ如ク「神ヨ私ハ私ノ義務ヲ盡シタ』ト云フヤウナ國家ノ大事件ニ際シテサヘ、私ハ、私ハト云フ其私ヲ棄テヽ『我身アリトハ思ハザリケリ」ト申スコレガ、我國體デアリマス。斯ウ云フ風ニシテ此君民一家、一ツノ家ヲナシテ居ル、即チ大日本帝國ハ一ツノ大イナル家、即チ公デアリマス。公ハ大宅又ハ大家デアリマス。次ハ十一、君民同心即チ陛下ト國民トガ同心デアルト云フノハ何ウ云フコトデアルカト申シマスト、一體我々ニハ先キニ中シタ所ノ眞心ト云フモノガアリマス。此眞心ト云フモノニヨツテ我々ハ行動スレバ間違ヒハナイノデアリマス。世ノ中ノ闇黑ニ處シテ、常ニ我々ヲ指導スルモノハコノ眞心デアリマス。眞心ハ我々ノ根本精神デアリマス。此日本國民ノ眞心ト云フモノヲ綜合シ、日本國民全体ノ眞心ヲ一ツニ綜合サレタノガ天皇陛下ノ大御心デアラセラレマス。天皇陛下ノ大御心ハ國民ノ眞心ノ綜合デアラレマス。從ツテ我々ノ眞心ト云フモノハ天皇陛下ノ大御心ニ通ズル所ノモノデアリマス。即チ目ニ見エヌ神ノ心ニ通フコソ人ノ心ノマコトナリケリトアリマスル通リデアリマス。處デコノ天皇陛下ノ大御心ハ何ニ依ツテ現ハレルカト申シマスルト國憲、國法トナツテ現ハレルノデアリマス。此國憲、國法ヲ遵守致シマスルノハ、天皇陛下ノ大御心ヲ奉戴スル所以デアリマス。其國憲、國法ニハ何ウ云フコトガ書イテアリマスカ、斯ウ考ヘテ見マスト云フト、例ヘバ憲法ニハ人ノ信書ノ秘密ヲアバク、即チ信書ヲ開ケテ見ルト云フコトハ出来ナイト云フコトガアリマス。所ガサウ云フコトハ憲法ヲ見マセンデモ、我眞心ニ聞イテ見マスルト直チニ惡イト云フコトガハツキリワカリデスカラ我々臣民タルモノモ

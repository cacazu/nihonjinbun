- id: nsk-p0004-001
  section_id: main-text
  kind: paragraph
  origin: source
  source_text: デ定メラレタ譯デアリマセンカラ、日本ト云ツテモ、日本ト云ツテモ便宜ニ從ツテ宜シイモノデアルト思ヒマス。ソコデ此日本精神ト云フモノハ何ウ云フモノデアルカ先ヅ其起源ヲ申上ゲマスト云フト、上代ニ於キマシテハ斯ウ云フ研究ハ餘リ致シマセン。何レノ國デモ致シマセンガ、特ニ我國ハ惟神コトアゲセヌ國ト云フノデアリマスカラ、斯ウ云フ問題ハ彼是レト議論シナカツタノデアリマス。然シ今日ハ色々ト理論的研究ヲ盛ンニスル時代デアリマスカラ、此、我惟神ノ道ニ對スル研究モ否認スルト云フ譯ニハ參ラナイノデアリマス。サウ云フ譯デ日本精神ト云フモノニ就イテモ深ク研究シテ見ルコトガ必要ニナツテ參ツタノデアリマス。所ガ上代ニ於キマシテハ、潜在精神ト申シマシテ、我民族ガ惟神コトアゲシナイデ生活シテ居マス內ニ一種ノ國民精神、又ハ民族精神ト云フモノガ出來テ參ツタノデアリマス。
  source_languages:
  - ja
  source_locations:
  - source_id: ndl-1097804
    precision: page
    source_sequence: 3
    url: https://dl.ndl.go.jp/pid/1097804/1/4
    printed_page: '4'
    printed_page_end: '5'
  translation_ja: '定められたものではありませんから、「ニホン」と言っても「ニッポン」と言っても、都合に従ってよいと思います。

    では、この日本精神とはどのようなものでしょうか。まずその起源をお話しします。古代には、このような研究はあまり行いませんでした。どの国もそうですが、とりわけわが国は、神の道のままにあって言葉で論じ立てない国でしたので、このような問題をあれこれ議論しなかったのです。しかし今日はいろいろなことを理論的に研究する時代ですから、惟神の道についての研究も否定するわけにはいきません。そのため、日本精神についても深く研究してみる必要が生まれました。

    古代には、潜在精神といって、わが民族が神の道に従い、言葉で論じ立てずに暮らしているうちに、一種の国民精神、または民族精神ができてきたのです。'
  translation_status: draft
  source_alignment:
  - source_id: ndl-1097804
    original_unit_id: 1097804_0000004.txt
  source_variants:
  - kind: ocr
    text: 日本ト云ツテモ便宜ニ從ツテ宜シイモノデアルト思ヒマス。デ定メラレタ譯デアリマセンカラ、日本ト云ツテモ、上代ニ於キマシテハ斯ウ云フ〓究ソコデ此日本精神ト云フモノハ何ウ云フモノデアルカ先ヅ其起源ヲ申上ゲマスト云フト、特ニ我國ハ惟神コトアゲセヌ國ト云フノデアリマスカラ、斯ウ云フ問題ハ彼ハ餘リ敢シマセン。何レノ國デモ致シマセンガ、然シ今日ハ色々ト理論的〓究ヲ盛ンニスル時代デアリマスカラ、此、我惟神ノ道ニ對ス是レト議論シナカツタノデアリマス。サウ云フ譯デ日本精神ト云フモノニ就イテモ深ク〓究シテ見ルコトガル〓究モ否認スルト云フ譯ニハ參ラナイノデアリマス。必要ニナツテ參ツタノデアリマス。所ガ上代ニ於キマシテハ、潜在精神ト申シマシテ、我民族ガ惟神コトアゲシナイデ生活シ又ハ民族精神ト云フモノガ出來テ參ツタノデアリマス。テ居マス內ニ一種ノ國民精神秩序ノ觀念第一ガ秩序ノ觀念デアリマス。日本ノ國民ニハ上代コノ國民精神ト云フモノハ、何ウ云フ風ナモノデアルカト申シマスト、ソレハ國民ガ自覺シナイデ所謂濟在精神ト何等學問モナク、〓究モシナイ時代ニ、巳ニ秩序ノ觀念ガ發達シタノデアリマス。日常ノ生活狀態ニ就秩序ノ觀念ト云フコトハモノヲキチントスルコトデアリマス。シテソノ觀念ヲ持ツテ居タノデアリマス。後世ニハ身体ト精神トヲ上代ニハ身體ト精神ト云フモノヽ區別ガ十分ニ認識セラレナカツタノデアリマス。イテ見マシテモ、上代ニハ區別シテ居リマセン。デスカラ身體ヲ淨メルト云フコトニヨ色々ト區別シテ考ヘテ居リマスガ、支那デモ我國デモ、之ガ我ガ上代ニ楔ヲ尊重セラレタ原因デアリマス。斯ウ云フウチ、其精神モキチントスルト確信セラレテ居タノデアリマス。コトハ日本國民ノ一ツノ特性デアリマス。ソレハ臺北ノ附近ニ溫泉講演ヲシテ參リマシタガ、其時ニ一ツノ事實ヲ認識シマシタ。私ハ今年ノ夏豪灣ニ賴マレマシテ、支那人ガ多數移住シテ居ツタ臺灣ハ御承知ノ通リ永イ間支那ノ領地デアリマシテ、ガアリマス。私モ一夕其處ニ泊リマシタ。ノデアリマス。ソシテ〓朝ノ支配ヲ受ケテ居マシタ。臺北ハ當時カラノ都會デアツタノデアリマス。所ガ其附近ニ溫泉ガアリマスノニ、其時代ニハ全然人ガ利用シナカツタノデアリマス。溫泉へ入ツテ居リマセス。然ルニ我ガ國ノ領土ニナリマスト云フトモウ直チニ發達女シマシテ今日デハ非常ニ立派ナ溫泉ニナツテ居リマス。サウ云フ具合デ何ウモ其處ニ日本國民ト入浴サウ云フ所ニ非常ナ深イ關係ガアルト云フコトヲ再認識致シマシタ。日本國民ハ實ニ入浴ヲ愛シマス。大分以前デアリマシタガ私ガ島取縣ノ方へ講習ニ賴マレテ行キマシタ。伯耆國ニ三朝ノ溫泉ト云フノガアリマシタ。勿論今日モアリマス。其處へ案內サレテ入浴シマシタガ、其處へ行ク途中ニ三朝川ガ流レテ居リ、其川ノ中ニ湯ガ出ル、其處へ多クノ農家ノ人達ガ入ツテ居ル。二三十年前デシタガ私ハソレヲ見テ、矢張リ上代ニハ斯ウ云フ風デアツタラウカト、ツク〓〓感ジタノデアリマス。サウ云フ工合ニ日本國民ハ、神代カラ湯ニ入ルコトヲ愛シマシタ。日本國民ガ身體ヲキチントスル、罪汚レヲ載ヒ除ク、大成ヒト云フコトヲ致シマス。祓ヒ淨メル、凡ユル罪汚レヲ祓ヒ淨メテ紳潔ナ秩序立ツタ生活ヲスルト云フノガ、所謂潜生精神デ何モサウ云フ事ヲ論理的ニ〓究シテシタノデハアリマセン。サウ云フ工合ニシテ入浴シテ身體精神ヲキチントシ、秩序立テタノデアリマス。更ニ我ガ國民ノ言葉ニ就イテ考ヘテ見マス。日々用ヒマスル日本ノ言葉ハ、又皆言葉ノ間ニ〓序ガ立ツテ居リマス。例ヘバ私トカ、貴方トカ申シマスガ、此私ト云フ言葉.西洋デハノベツニ私ト云フ字ヲ使ヒマス。西洋人ガ日本ノ言葉ヲ研究スルト非常ニ不思議ニ思フ。日本デハ私ト云フコトハ餘リ使ヒマセヌ。使ハナクトモ日本ノ言葉ハ、チヤント判リマス。『貴方オ出ニナリマスカ』『ハイ參リマス』ト云ヘバ、『私ハ參リマス』ト云フコトニナリマス。ソレガ西洋デハ一寸間單ナ言葉ニモ私ト云フ、彼ノネルソン提督ガトラフアルガルニ於キマッテ、今度ハエチオピアノ事件デ伊太利ト英吉利ノ艦隊トガ戰爭ヲ地中海上デ展開スルカモ知レナイト云フ情勢ニナツタヤウデアリマシタガ、ソンナコトモナイヤウデアリマス所ガ、ネルソンノ時ニハ佛蘭西、西班牙ノ聯合艦隊ト英吉利ノ艦隊トガ戰爭致シマシタ。トラフアルガルニ於テソノ大决戰ヲシマシタ。其時ノ提督ハ英吉利ノネルソン、東〓大將ト竝ビ稱セラレル名提督デアリマス。ソノネルソン提督ガ敵ノ彈丸ニ當ツテ戰死シマシタ。其

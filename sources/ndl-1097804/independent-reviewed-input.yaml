- id: nsk-p0002-002
  section_id: main-text
  kind: paragraph
  origin: source
  source_text: '文學博士　田中義能

    私ハ只今御紹介ニ預リマシタ田中デゴザイマス、今日當會ノ開カレマス機會ニ私ニ參ツテ御話ヲ申上ゲルヤウニト云フノデ私ハ『日本精神ト國体ノ本質』ト云フ題ヲ以テ暫ク御靜聽ヲ御願ヒシタイト考ヘテ居リマス。近來日本精神ト云フコトガ頻リト繰返ヘサレテ參リマシタガ、其本質、內容ト云フヤウナモノニ就テハ、色々意味ニトラヒマシテ雜誌ニ、新聞ニ、談話ニ種々ニ解釋サレテ居ルノデアリマス。デ此點ニ就イテ先ヅ申上ゲマシテ、サウシテ今非常ニ問題ニナツテ居リマス國体明徵ト云フヤウナコトニ論及シテ見タイト考ヘテ居ルノデアリマス。私ドモガ一般ニ精神ト云フモノヲ持ツテ居リマスト云フコトハ改メテ申ス迄モナイコトデアリマス。併シ個人々々ニ持ツテ居リマス精神ハ人ニ依ツテ夫々違フノデアリマス。所謂十人十色ト申シマス。之ハ其人ノ生レ付デアリマス。ソレカラ又境遇デアリマス。又色々受ケマスル所ノ教育デアリマス。ソウ云フモノニ依ツテ個人ノ精神ト云フモノガ成リ立ツテ來ルノデアリマス。銘々各個人特有ノ精神固有ノ精神ト云フモノヲ持ツテ居ルノデアリマスガサウ云フ人々ガ只一人デ生活シテ居リマセンデ、色々ト團体ヲ作リマス。或ハ家ヲ作リ、或ハ町村ヲ作リ、或ハ府縣ヲ作リ、サウシテ大イナル國家ト云フモノヲ作リマス。斯ウ云フ順序ニ進ンデ參ルノデアリマスガ其人間ガ一ツノ團体ヲ作ツテ、サウシテ此永久的ナ、勿論人間ハ或期限デ天壽ヲ終ルノデアリマスガ、其團体ナルモノハ、其家ナラ家ト云フモノハ、永久的ナ性質ヲ持ツテ居リマス。市町村、國家ト云フモノハ皆永久的ナ性質ヲ持ツテ居リマス。サウ云フ永久的ナ性質ヲ持ツテ居リマスト云フト、其團体ト云フモノハ一人ノ人ト同ジヤウニ、各又其特有ノ精神ヲ持ツテ來ルノデアリマス。其處デ一ツノ國家ト云フモノヲ爲シマスルナラバ、即チ其國家ノ精神、國民ノ精神ト云フモノガ'
  source_languages:
  - ja
  source_locations:
  - source_id: ndl-1097804
    precision: page
    source_sequence: 1
    url: https://dl.ndl.go.jp/pid/1097804/1/2
    printed_page: '1'
  translation_ja: '文学博士　田中義能


    ただいまご紹介いただきました田中でございます。今日、この会が開かれる機会に、私に来て話をするようにということですので、「日本精神と国体の本質」という題で、しばらくお聞きいただきたいと考えております。

    近頃、日本精神ということが盛んに繰り返し言われるようになりましたが、その本質や内容はさまざまな意味に受け取られ、雑誌や新聞、談話でいろいろに解釈されています。そこで、まずこの点をお話しし、今、非常に問題になっている国体明徴、つまり国体を明らかにするということにも論及してみたいと思います。

    私たちが精神というものを持っていることは、改めて申し上げるまでもありません。しかし、一人一人の精神は、人によってそれぞれ違います。いわゆる十人十色です。それにはその人の生まれつきがあり、境遇があり、また受けてきたさまざまな教育があります。こうしたものによって個人の精神が成り立ってくるのです。

    それぞれの人は、自分に特有の、固有の精神を持っています。しかし、その人々は一人だけで生活しているのではなく、さまざまな団体をつくります。家をつくり、町村をつくり、府県をつくり、そして大きな国家をつくる。このような順序で進んでいくのです。

    人間が一つの団体をつくると、それは永続的なものとなります。もちろん、人間はある時期に寿命を終えます。しかし団体、たとえば家には、永続的な性質があります。市町村も国家も、みな永続的な性質を持っています。そのような性質を持つ団体は、一人の人間と同じように、それぞれ特有の精神を持つようになります。そこで、一つの国家がつくられれば、その国家の精神、国民の精神というものが、'

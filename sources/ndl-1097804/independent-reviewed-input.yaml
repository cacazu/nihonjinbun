  translation_ja: 'わが国体は、神を敬い祖先を尊ぶことを国家の根底に置いています。敬神崇祖がなかったなら、わが国家は成り立ちません。わが国家は敬神崇祖によって成り立っているのです。前にも述べたとおり、天照大神の神勅に基づいて国家ができ、そこに天照大神やその他の神々への崇敬も生まれました。

    ご承知のように、聖徳太子は十七条憲法をおつくりになりましたが、その中には敬神ということがありません。そのため後世、大変な非難を受けておられます。しかし、ともかく聖徳太子ご自身が推古天皇十二年に十七条憲法をつくられ、それから三年ほどたった推古天皇十五年には、敬神の大詔が下されています。したがって、聖徳太子も敬神の意義を大いに強調されたことが分かります。

    その後、孝徳天皇も、まず神祇を祀り、その後に政治を行うべきだとおっしゃいました。順徳天皇も『禁秘抄』で、およそ宮中の作法は神事を第一とする、とお示しになっています。このように、わが国では神祇崇敬、敬神崇祖が大切であり、国体の大きな特色なのです。次は、'

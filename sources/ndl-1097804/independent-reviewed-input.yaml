  translation_ja: '最後に、わが国体の偉大な特色は、天壌無窮、天地とともに永遠に続くことです。すでに述べたように、外国はみな朝に起こり夕べに滅びるような状態ですが、その中でわが国だけは天壌無窮です。ここに日本国民の大きな理想が含まれています。

    今、イタリアではムッソリーニが頑張り、その北のドイツにはヒトラーがいます。ヒトラーは以前、日本について、「日本という国は全く模倣する国民である。まねばかりする国民である。日本が今日あるのは、全く西洋をまねたからだ。もし西洋の文明や文化を日本に入れさせなければ、日本は十年もたたないうちに、徳川時代のような野蛮国になってしまう」と言いました。

    今日、ヨーロッパで一流の人物とも言うべきヒトラーがそのように言うほど、わが国への認識不足は甚だしいのです。欧米人は日本を知っているようで、知りません。日本は決して西洋のまねばかりしているのではありません。

    もちろん、電気、汽車、飛行機などは西洋をまねていますが、それらにしても、すべてがまねではありません。そもそも、そうしたものを利用するには、発明できるだけの力がなければなりません。丹那トンネルや、馬関のトンネルをつくろうという計画などは、実に西洋人以上のものです。このように、日本国民には偉大な創造力があり、決してまねばかりではありません。

    しかし、コンクリートの家を建てたり、汽車を走らせたりするのはまねですが、そのようなことはまねても構いません。私たちが洋服を着たからといって、西洋人のように毎日洋食ばかり食べなければならないわけではありません。毎日、朝も昼も夜も洋食では、日本人はやりきれません。洋服や洋食、洋館などは、いくらまねても少しも構わないのです。そうしたことは、要するに枝葉末節です。

    しかし根本的なことには、わが国民が絶対にまねをしないものがあります。それは何でしょうか。偉大な特色を持つ、わが大皇国の国体です。これだけは西洋人のまねではなく、日本人の創造なのです。このようにめでたく貴重な国体を西洋に求めてまねようとしても、できません。

    伊藤公が西洋各国を巡り、その憲法を研究して帰国し、帝国憲法の草案を起草されたといいます。しかし、どこの憲法を見ても、その第一条にある「大日本帝国は、万世一系の天皇がこれを統治する」というような憲法があるでしょうか。世界がいかに広く、国がいかに多くても、これだけはどこにもありません。ほかにはないと、誰でも保証できます。これこそ日本国民の創造であり、決して模倣ではありません。

    このように、日本国民は人間生活で最も大切な国家をつくり、その金甌無欠の国体を、天地とともに永遠に維持し発展させていきます。この点に、日本国民は、日本国民としての意義ある生活を見いだしているのです。私たちは日本国民として、このような国家に生まれたことを光栄とし、感謝しなければならないと思います。

    私たちは朝も晩も、こうした国家の恩恵を受けながら、それを自覚していません。私たちは昼夜を問わず、寝ていても食べていても空気を呼吸していますが、そのことを意識していません。皆さんも、今朝から空気を呼吸していたことを意識しておられるでしょうか。それと同じように、この光栄ある国家の恩恵を受けながら、自覚していないのです。

    すべての物事は、自覚して行うか、せずに行うかで大きな違いが生じます。私たちは毎日食事をしますが、以前はただ好きなもの、おいしいものを食べるというありさまでした。よくできたもので、腐ったものなどはまずくて食べられません。しかし中には、口にはおいしくても有害・有毒なものや、消化の悪いものがあります。消化しなければ栄養になりません。

    今日では栄養の研究が盛んに行われ、栄養価の高いものがいろいろ調べられています。そのように食物を研究して食べれば、日頃から栄養価の高いものをとり、おのずから無病で長生きし、人生の理想を実現することができます。

    道理は全く同じです。人生で最も貴重な国体の特色と本質を十分に自覚し、その成長と発展に努めれば、国体をますます完成へと進めることができます。今、ここに一つずつ挙げましたが、挙げればまだ多くあります。主な特色を挙げ、わが国体の本質を明らかにしようとしたのです。皆さんは今日の文化の指導者でいらっしゃいますから、国民を指導するうえで、この国'

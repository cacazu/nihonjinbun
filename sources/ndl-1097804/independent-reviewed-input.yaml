    printed_page: '6'
    printed_page_end: '7'
  translation_ja: 'また、日本国民は昔から神を崇敬する観念が強いのです。これは誰かに教わったのではありません。今日、キリスト教徒も神を尊敬しますが、それはイエス・キリストという人に教わり、キリストの教えを奉じてそうするのです。わが国民は誰かに教わったのではなく、敬神の観念を潜在精神として持っていました。『古事記』や『日本書紀』を見ると、その敬神の観念がどれほど深いかが分かります。

    したがって、古代の国民は、とりわけ厳粛な生活を送りました。何かがあると神のお心を伺い、そのために占いをしました。そこで神代から、卜部が重要な役目を持ちました。神のお心がどのようであるかを知るため、鹿の肩の骨を焼き、その割れ目によってお心を知ったのです。これが占いで、古代にはこのように占いました。それで『古事記』にも「太占によって占って言う」とあります。このように、日本国民は敬神の観念に満ちた厳粛な生活を送ってきたのです。'

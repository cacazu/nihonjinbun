  source_text: 我國家ハ神樣ニ依ツテ作ラレタ。今述べマシタ通リ、天照大神ノ神勅ニ依ツテ、國家ガ作ラレタ。外國デモ神ニ依ツテ作ラレタ、神造國家、或ハ神授君權ト云フノデアルガ、サウ云フ國家モ永續キシマセン。然ルニ我國ハ初カラ神樣ニヨツテ作ラレマシタ。即チ天照大神ガ、天孫瓊々杵尊ニ天壤無窮ノ神勅ヲ下サレ、三種ノ神器ヲ授ケラレ國家建設ノ基礎ヲナサレマシタ。實ニ我ガ國家ヲ起サレタノハ神樣デアリマス。之ガ我國体ノ著シキ一ツノ特色デアリマス。

    printed_page_end: '17'
  translation_ja: であるフランス議会が、自国の王ルイ十六世を国民に対する反逆者とし、さまざまな処罰の方法を検討して、ついに七百二十一人の出席する議会で、二十六票の多数によって国王死刑の議案を可決したのです。愛国者から成る議会が、その君主を死刑にする議案を可決しているではありませんか。つまり彼らには、忠君というような考えがないのです。アメリカ人にも、忠君の考えは全くありません。そのため、わが国体の著しい特色は、忠君と愛国とが同じところに帰することにあります。次は、

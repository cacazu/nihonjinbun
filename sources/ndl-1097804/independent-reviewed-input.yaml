    - ocr: 統領ガ、亞米利加ノ兵隊ガ歐羅巴ノ戰場ニ行キマス時ニ告別ノ演說ヲシタ。其演說ニ於テ『我國家ハ建國以來未ダ甘ツテ外國ノ侵略ヲ受ケナイ、實ニ尊イ國家デアル』ト云ツタト申シマスガ、亞米利加ハ建國何年ニナルカ、ワシントンガ十三州ノ民ヲ提ゲテ英吉利ト戰爭ヲシテ獨立シタ。ソシテウイルソンニ至ルマデ二百年位、ソレヲ建國以來ト云フ。ソレニ比ベルト我國ノ建國ノ悠久デアルコトハ比較ニナラナイノデアリマス。三、神祗建國我國家ハ神樣ニ依ツテ作ラレタ。今述べマシタ通リ、天照大神ノ神勅ニ依ツテ、國家ガ作ラレタ。外國デモ神ニ依ツテ作ラレタ、神造國家、或ハ神授君權ト云フノデアルガ、サウ云フ國家モ永續キシマセン。然ルニ我國ハ初カラ神樣ニヨツテ作ラレマシタ。即チ天照大神ガ、天孫瓊々杵尊ニ天壤無窮ノ神勅ヲ下サレ、三種ノ神器ヲ授ケラレ國家建設ノ基礎ヲナサレマシタ。實ニ我ガ國家ヲ起サレタノハ神樣デアリマス。之ガ我國体ノ著シキ一ツノ特色デアリマス。四、君先民後之レモ世間デヨク云ハレテ居ル所デアリマスガ、我國ハ皇室ガ先デアラセラレル。サウシテ國民ガ後ニ成立シタノデアリマス。天孫ガ降臨遊バシタ時ハ彼方此方ニ酋長ノヤウナ者、其ノ他先住民族ハ居タガ、何等國家等ト認ムベキモノガナカツタノデアリマス。サウ云フ所へ天孫ガ降臨遊バシテ此處ニ國家ヲ建テラレ、國民ガ出來タノデアリマス。外國ハ皆國民ガ先ニアツテ、ソレガ國家ヲ建設スルコトニナツタノデアリマス。露西亞モ今カラ三百年バカリ前ニミカエル、ロマノフト云フノガ出テ露西亞帝國ヲ建テマシタ。ロマノフ王朝ト云フノガソレデアリマスガ、ソレヨリ前ニ露西亞國民ガアツテ國家ヲナシテ居タノデアリマス。今申シタ亞米利加ノ如キモ、亞米利加人ト云フ人民ガ居ツタ。即チ歐羅巴カラ澤山移住シタ者ガ居リマシテ、ソシテソレガ英吉利ト戰ヒ、遂ニワシントンヲ大統領ニ選擧シテ國家ヲ建テタノデアリマス。ダカラ外國ノハ一般ニ民先君後デアリマス。恰度我國ト反對デアリマス。五、敬神崇祖我國体ハ敬神崇祖ト云フモノヲ國家ノ根抵トシテ居リマス。敬神崇祖ト云フモノガナカツタナラパ、我國家ハ成リ立チマセス。我國家ハ敬神崇祖ニ依ツテ成立ツテ居ルノデアリマス。即チ前ニモ申上ゲマシタ通リ、天照大神ノ神勅ニ基イテ、國家ガ出來マシタ。玆ニ天照大神ノ崇敬、其他神々ノ崇敬ト云フコトモ起ツテ來タノデアリマス。其故ニ御承知ノ通リ、聖德太子ガ十七憲法ヲ御作リニナリマシタガ、其中ニ敬神ト云フコトガナイノデアリマス。デ後世大變非難ヲ受ケテ居ラレマスガ、兎じ角聖德太子御自身、推古天皇十二年二十七憲法ヲ御作リニナツテ、ソレカラ三年バカリ置イテ推古天皇十五年ニハ敬神ノ大詔ガ降ツテ居リマス。デスカラ聖德太子モ大ニ敬神ノ義ヲ高調遊バシタコトガ分リマス。ソノ後孝德天皇ノ時ニ於カレマシテモ先ヅ神祇ヲ祀ツテ然ル後政治ヲ行フベキコトヲ仰セニナツテ居リマス。順德天皇ノ時ニモ其ノ『禁秘抄』ニ於カレマシテ凡ソ禁中ノ作法ハ神事ヲ先ニスト云フコトヲ御示シニナツテ居ル、斯ウ云フ具合ニ我國ニ於テハ此神祇崇敬、敬神崇祖ト云フコトガ大切デアリマシテ、之ガ我國體ノ大ナル特色デアルノデアリマス。ソレカラ其次ハ六、神君-體神樣ト天皇陛下トハ御一體デアラセラレルコトガ亦外國ニ見ラレナイ我國體ノ特色デアリマス。:即チ天皇陛下ハ現津神ト仰セラレマシテ、天照大御神樣ト御一體デアラセラレルノデアリマス。天皇陛下ヲ皇孫命ト申シマスルノハ、皇孫ト書キマシテ孫ト云フ風ニ考ヘマスガ、孫デハアリマセン、上代孫ト申スノニハヒコト云ヒマシタ。曾孫ノコトハヒヒコト云ヒマシタ。ソコデ皇孫ト申シマスノハ天照大御神様ノ御眞子ト云フノデアリマス。天皇陛下ハ天照大御神樣ノ御眞子デアラセラルト云フノデアリマス、デスカラ歴代ノ天皇陛下ハ皇孫命現津神デ、天照大御神様ト御一體デアラセラレ.神君一體ノ國體デアリマス。t、祭政-致コレハ申上ゲルマデモナイノデアリマスガ一體何ウ云フ譯デ祭政一致デアルカト申シマスルト、天照大御神樣ガ天孫ヲ御降天照大御神樣ガ天孫ヲ御降
      corrected: '統領ガ、亞米利加ノ兵隊ガ歐羅巴ノ戰場ニ行キマス時ニ告別ノ演說ヲシタ。其演說ニ於テ『我國家ハ建國以來未ダ嘗ツテ外國ノ侵略ヲ受ケナイ、實ニ尊イ國家デアル』ト云ツタト申シマスガ、亞米利加ハ建國何年ニナルカ、ワシントンガ十三州ノ民ヲ提ゲテ英吉利ト戰爭ヲシテ獨立シタ。ソシテウイルソンニ至ルマデ二百年位、ソレヲ建國以來ト云フ。ソレニ比ベルト我國ノ建國ノ悠久デアルコトハ比較ニナラナイノデアリマス。

        三、神祇建國

        我國家ハ神樣ニ依ツテ作ラレタ。今述べマシタ通リ、天照大神ノ神勅ニ依ツテ、國家ガ作ラレタ。外國デモ神ニ依ツテ作ラレタ、神造國家、或ハ神授君權ト云フノデアルガ、サウ云フ國家モ永續キシマセン。然ルニ我國ハ初カラ神樣ニヨツテ作ラレマシタ。即チ天照大神ガ、天孫瓊々杵尊ニ天壤無窮ノ神勅ヲ下サレ、三種ノ神器ヲ授ケラレ國家建設ノ基礎ヲナサレマシタ。實ニ我ガ國家ヲ起サレタノハ神樣デアリマス。之ガ我國体ノ著シキ一ツノ特色デアリマス。

        四、君先民後

        之レモ世間デヨク云ハレテ居ル所デアリマスガ、我國ハ皇室ガ先デアラセラレル。サウシテ國民ガ後ニ成立シタノデアリマス。天孫ガ降臨遊バシタ時ハ彼方此方ニ酋長ノヤウナ者、其ノ他先住民族ハ居タガ、何等國家等ト認ムベキモノガナカツタノデアリマス。サウ云フ所へ天孫ガ降臨遊バシテ此處ニ國家ヲ建テラレ、國民ガ出來タノデアリマス。外國ハ皆國民ガ先ニアツテ、ソレガ國家ヲ建設スルコトニナツタノデアリマス。露西亞モ今カラ三百年バカリ前ニミカエル、ロマノフト云フノガ出テ露西亞帝國ヲ建テマシタ。ロマノフ王朝ト云フノガソレデアリマスガ、ソレヨリ前ニ露西亞國民ガアツテ國家ヲナシテ居タノデアリマス。今申シタ亞米利加ノ如キモ、亞米利加人ト云フ人民ガ居ツタ。即チ歐羅巴カラ澤山移住シタ者ガ居リマシテ、ソシテソレガ英吉利ト戰ヒ、遂ニワシントンヲ大統領ニ選擧シテ國家ヲ建テタノデアリマス。ダカラ外國ノハ一般ニ民先君後デアリマス。恰度我國ト反對デアリマス。

        五、敬神崇祖

        我國体ハ敬神崇祖ト云フモノヲ國家ノ根抵トシテ居リマス。敬神崇祖ト云フモノガナカツタナラパ、我國家ハ成リ立チマセス。我國家ハ敬神崇祖ニ依ツテ成立ツテ居ルノデアリマス。即チ前ニモ申上ゲマシタ通リ、天照大神ノ神勅ニ基イテ、國家ガ出來マシタ。玆ニ天照大神ノ崇敬、其他神々ノ崇敬ト云フコトモ起ツテ來タノデアリマス。其故ニ御承知ノ通リ、聖德太子ガ十七憲法ヲ御作リニナリマシタガ、其中ニ敬神ト云フコトガナイノデアリマス。デ後世大變非難ヲ受ケテ居ラレマスガ、兎ニ角聖德太子御自身、推古天皇十二年ニ十七憲法ヲ御作リニナツテ、ソレカラ三年バカリ置イテ推古天皇十五年ニハ敬神ノ大詔ガ降ツテ居リマス。デスカラ聖德太子モ大ニ敬神ノ義ヲ高調遊バシタコトガ分リマス。ソノ後孝德天皇ノ時ニ於カレマシテモ先ヅ神祇ヲ祀ツテ然ル後政治ヲ行フベキコトヲ仰セニナツテ居リマス。順德天皇ノ時ニモ其ノ『禁秘抄』ニ於カレマシテ凡ソ禁中ノ作法ハ神事ヲ先ニスト云フコトヲ御示シニナツテ居ル、斯ウ云フ具合ニ我國ニ於テハ此神祇崇敬、敬神崇祖ト云フコトガ大切デアリマシテ、之ガ我國體ノ大ナル特色デアルノデアリマス。ソレカラ其次ハ

        六、神君一體

        神樣ト天皇陛下トハ御一體デアラセラレルコトガ亦外國ニ見ラレナイ我國體ノ特色デアリマス。即チ天皇陛下ハ現津神ト仰セラレマシテ、天照大御神樣ト御一體デアラセラレルノデアリマス。天皇陛下ヲ皇孫命ト申シマスルノハ、皇孫ト書キマシテ孫ト云フ風ニ考ヘマスガ、孫デハアリマセン、上代孫ト申スノニハヒコト云ヒマシタ。曾孫ノコトハヒヒコト云ヒマシタ。ソコデ皇孫ト申シマスノハ天照大御神様ノ御眞子ト云フノデアリマス。天皇陛下ハ天照大御神樣ノ御眞子デアラセラルト云フノデアリマス、デスカラ歴代ノ天皇陛下ハ皇孫命現津神デ、天照大御神様ト御一體デアラセラレ.神君一體ノ國體デアリマス。

        七、祭政一致

        コレハ申上ゲルマデモナイノデアリマスガ一體何ウ云フ譯デ祭政一致デアルカト申シマスルト、天照大御神樣ガ天孫ヲ御降'

  translation_ja: 'です。陛下と国民とが同じ心であるとは、どういうことでしょうか。私たちには、先ほど申し上げた真心があります。この真心によって行動すれば、間違いはありません。世の暗闇の中でも、いつも私たちを導くのは真心です。真心は、私たちの根本の精神なのです。

    この日本国民の真心を総合し、国民全体の真心を一つにまとめられたものが、天皇陛下の大御心であられます。天皇陛下の大御心は、国民の真心の総合です。したがって、私たちの真心は天皇陛下の大御心に通じるものなのです。つまり、

    「目に見えない神のお心に通じるものこそ、人の心の誠なのだ」

    という御製のとおりです。

    では、その天皇陛下の大御心は、何によって現れるのでしょうか。憲法や国の法律となって現れるのです。憲法と法律を守ることは、天皇陛下の大御心を謹んでいただくことになります。

    その憲法や法律には、何が書いてあるでしょうか。たとえば憲法には、人の信書の秘密を暴くこと、つまり他人の手紙を開いて見ることはできないとあります。しかし、そのようなことは憲法を見なくても、自分の真心に尋ねれば、悪いことだとはっきり分かるの'

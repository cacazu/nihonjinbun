  source_text: 最後ニ我國体ノ偉大ナル特色ハ、即チ天壤無窮デアリマス。巳ニ述ベマシタ通リ外國ハ皆朝ニ起リタニ亡ブト云フ狀態デアリマス。ソノ中ニアツテ我國ノミ天壤無窮デアリマス。玆ニ日本國民ノ大理想ト云フモノガ包含サレテ居ルノデアリマス。今ヤ伊太利ニ於テムツソリーニガ頑張ツテ居リマシテ、北方ドイツニ於イテハヒツトラーガ居リマス。彼ヒツトラーハ嘗テ日本ヲ評シマシテ『日本ト云フ國ハマルデ模倣ノ國民デアル。眞似バカリスル國民デアル。日本ノ今日アルノハ全ク西洋ノ眞似ヲシタカラデアル。若シ西洋ノ文明、文化ヲ日本ニ入レサセナイヤウニシタナラバ、日本ハ十年經タン內ニ德川時代ノヤウナ野蠻國ニナツテ仕舞フ』ト云ヒマシタ。今日歐羅巴ニ於テ一流ノ人物トモ云フベキヒツトラーガサウ云フコトヲ云ヒマスルヤウニ、我國ニ就イテ認識不足モ甚シイノデアリマス。歐米人ハ日本ヲ知ツテ居ルヤウデアツテ、知ラナイノデアリマス。决シテ日本ハ西洋ノ眞似バカリシテ居ルノデハアリマセン。勿論、電氣、汽車、飛行機等ト云フヤウナモノハ、西洋ノ眞似ヲシテ居マスケレドモ然シ斯ウ云フモノトテモ、悉クガ眞似デハアリマセン。一體斯ウ云フモノヲ利用スルノハ發明スルダケノ力ガナケレバ利用出來マセヌ。丹那トンネルニシテモ、又馬關ノトンネルヲ作ラウト云フヤウナコトデモ、實ニ西洋人以上ノモノデアリマス。サウ云フ風ニ日本國民ニハ偉大ナ創造ノ力ガアルノデアリマス。决シテ眞似バカリデハアリマセン。然シコンクリートノ家ヲ作ルトカ、汽車ヲ走ラストカハ眞似デアリマスガ、斯ウ云フコトハ眞似シタツテ差支ヘアリマセン。洋服ヲ我々ガ着タカラツテ西洋人ノヤウニ每日洋食バカリ喰べナケレバナラナイト云フコトハアリマセン。每日々々朝モ洋食、晝モ洋食、夜モ洋食デハ日本人ハヤリキレマセン。サウ云フ工合デ洋服ヤ洋食、洋館ナド、イクラ眞似シタカラト云ツテモ少シモ差支ヘアリマセン。コンナ事ハ要スルニ枝葉末節ノ事デアリマス。併シ根本的ノ事デハ、我國民ノ絕對ニ眞似ヲシナイモノガアリマス。ソレハ何デアリマスカ。偉大ナル特色ヲ持ツテ居ル我ガ大皇國ノ國體デアリマス。コレバツカリハ西洋人ノ眞似デハアリマセンコレバツカリハ日本人ノ創造デアリマス。如何ニ斯ウ云フ目出タイ、貴重ナル國體ヲ西洋ニ求メテ眞似シヨウト思ツテモソレハ出來マセン。伊藤公ガ西洋ノ各國ヲ巡ツテ、各國ノ憲法ヲ研究シテ歸朝シ、帝國憲法ノ草案ヲ起稿セラレタト申シマスガ、何處ノ憲法ヲ見マシテモ、第一條ノ『大日本帝國ハ萬世一系ノ天皇之ヲ統治ス」トアリマスヤウナ憲法ガアリマセウカ。世界廣シト雖モ、世界國多シト雖モコレバツカリハ何處ニモアリマセン。誰デモ外ニナイト云フコトヲ保證スルコトガ出來マス。コレ即チ日本國民ノ創造デアリマス。絕對ニ模倣デアリマセン。斯ウ云フ工合デ日本國民ハ人間生活ノ最モ大切ナ國家ト云フモノヲ作ツテ、ソノ金甌無缺ノ國體ヲ天壤無窮ニ維持シ發展シテ行クノデアリマス。此ノ點ニ於テ日本國民ハ、日本國民トシテ意義アル生活ヲ發見シテ居ルノデアリマス。我々ハ日本國民トシテ、斯ウ云フ國家ニ生レタルヲ光榮トシテ、感謝シナケレバナラナイト思フノデアリマス。一體我々ハ朝ニ晩ニ斯ウ云フ國家ノ恩澤ヲ受ケテ居ルノデアリマスガソレヲ自覺シテ居ナイノデアリマス。我々ハ四六時中寢トナク、食トナク、空氣ヲ呼吸シテ居リマスガ、ソノ空氣ヲ呼吸シテ居ルコトヲ知ラナイデアリマス。諸君モ今朝カラ空氣ヲ呼吸シテオアリデアツタト云フコトヲ承知シテ居ラレルデアリマセウカ。カウ云フ風ニ此光榮アル國家ノ恩惠ヲ受ケテ居テ、ソレヲ自覺シテ居ナイノデアリマス。總ベテ物事ハ自覺シテシマスルト、自覺シナイデシマスルトハ大變ナ其處ニ相違ヲ來スノデアリマス。我々ハ每日々々食事ヲスルノデアリマスガ以前ニハ唯々スキナ物ヲ喰ベル、ウマイ物ヲ喰ベルト云フ有樣デアリマシタ。尤モヨクシタモノデ腐敗シタモノナドハマヅクテ喰ベラレマセン。ガ中ニハ口ニハウマクテモ有害有毒ナモノモアリマス。不消化ノモノモアリマス不消化デハ榮養ニナリマセン。今日ハ榮養研究ガ盛ンニ行ハレマシテ、榮養價値ノ大ナルモノヲ色々ト調査シテ居リマスガ、カウ云フ風ニ其食物ヲ研究シテ喰ベマシタナラバ、我々ハ平素非常ニ榮養價値ノアルモノヲ喰ベマシテ、自ラ無病長命シ、人生ノ理想ヲ實現スル事ガ出來ルノデアリマス。道理ハコレト全ク同ジヤウニ、我々ハコノ人生最モ貴重ナル國體ノ特色、本質ヲ十分ニ自覺シマシテ、ソノ長養發展ニ努力シマシタナラバ此國體ヲ益々完成ノ域ニ進メル事ガ出來ルノデアリマス。今此處ニ一々列擧致シマシタガ、未ダ列擧スレバ澤山アリマスガ、主ナル國體ノ特色ヲ擧ゲテ、我國體ノ本質ヲ明カニセントシタノデアリマス。諸君ハ實ニ今日ノ文化ノ指導者デアラセラレルノデアリマスカラ、國民ヲ指導セラレマスル上ニ於テ十分ニ此ノ國

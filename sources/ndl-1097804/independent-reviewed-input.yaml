  source_text: 日本ハ此民族ヲ融合調和シテ統一スルノハ先キニ述べマシタ通リデ、コノコトハ全ク上ニ萬世一系ノ皇統ヲ頂イテ居ルカラデアリマス。デスカラ此ノ多クノ異民族ヲ集合シテ純粹ナ大和民族ニスルト云フノニ中心ガ嚴トシテ存在シテ居ルカラデアリマス。外國デハソノ中心ガ一定シテ居ラヌカラ民族ノ統一ガ出來ナイノデアリマス。今之レヲ扇子ニ例ヘテ見マス。扇子ハ要ガ大事デアリマス。要ヲナクスレバ扇子ハ壞ハレテ仕舞ヒマス。外國デハソノ要ヲ民衆ガ各々自分デ取ラウトスルノデアリマス。ソシテ自分ガ要ニナラウトスル。即チ支那邊リデハ自分ガ天子ニナラウトスルノデアリマス。今デモ支那ガアノヤウニ混亂シテ居リマスノハ、アノ中ニ銘々『王侯相何ソ種アラン」ト云フ考ヲ持ツテ居ルカラデアリマス。袁世凱モ嘗テ大統領デ滿足セズ、皇帝ニナツタコトハ周知ノ事實デアリマス。サウ云フ狀態デアリマスカラ支那ハ中々統一ガ出来マセン、常ニ人民ハ困苦ヲ免レナイノデアリマス。我國ニ於キマシテハ何人モ夢ニモコノ要ヲ望ムモノハアリマセン。永イ〻歷史ノ中ニ偶々道鏡ノヤウナモノガ出マシテモ和氣淸麻呂公ノ國體ノ精華ヲ發揮スル大人物ガ出テ『無道ノモノハ速カニ掃除スペシ」ト云フ神勅ヲ絕叫シマシテ、國體ノ不淨ヲ祓ヒ淨メルノデアリマス。コウ云フ次第デ我々國民ハ色々理想ヲ抱クノデアリマスガ政治家ガ理想ヲ抱クト云ツタラ西洋ノ政治家ナラ大統領ニナルコトヲ理想トスル、皇帝ノ位ニ就クコトヲ理想トスル、ナポレオンノ如キ、匹夫カラ起ツテ遂ニ皇帝トナツタノデアリマス。所ガ我國民ノ政治的理想ハ何ダト云ヒマスト位人臣ノ榮ヲ極メルト云フノデアリマス。何處マデ行ツテモ人臣ノ榮ヲ極ム、此ノ所ハ有難イ所デアリマス。之ガ日本ノ民族ガ統一シテソシテ此優秀ナル國体ヲ爲ス所以デアリマス。

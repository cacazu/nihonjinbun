  source_text: 神樣ト天皇陛下トハ御一體デアラセラレルコトガ亦外國ニ見ラレナイ我國體ノ特色デアリマス。即チ天皇陛下ハ現津神ト仰セラレマシテ、天照大御神樣ト御一體デアラセラレルノデアリマス。天皇陛下ヲ皇孫命ト申シマスルノハ、皇孫ト書キマシテ孫ト云フ風ニ考ヘマスガ、孫デハアリマセン、上代孫ト申スノニハヒコト云ヒマシタ。曾孫ノコトハヒヒコト云ヒマシタ。ソコデ皇孫ト申シマスノハ天照大御神様ノ御眞子ト云フノデアリマス。天皇陛下ハ天照大御神樣ノ御眞子デアラセラルト云フノデアリマス、デスカラ歴代ノ天皇陛下ハ皇孫命現津神デ、天照大御神様ト御一體デアラセラレ.神君一體ノ國體デアリマス。
  source_languages:

    corrections:
    - ocr: 遲イナガラモ非常ニ結構ナコトデアリマス。或國ノ國體ニハ、西洋流ノ君主ニモナイ、人民ニモナイ國家其モノニ主權ガアルト云フ說、即チ君主ハ機關デアルト云フヤウナ西洋ノ議論ハ、我國ニハ當テ〓マラナイノデアリマス。我國ニ於テハ、國體ハ日本精神ソノモノノ表現デアリマス。日本精神ガ現ハレテ來テ、ソレガ國體トナツテ來ルノデアリマス。サキニ述ベマシタヤウニ秩序ノ觀念ト云フノガ現ハレマシテ、此處ニ萬世一系ノ皇統ト云フ目出度イ現象ガ實現サレテ來タノデアリマス。之ガ日本精神ノ現レデアリマス。外國ニハサウ云フ日本精神ノ如キ精神ガナイノデアリマス。秩序ノ根柢ト云フモノハ國家ノ中心デアリマス、國家ノ中心ハ君主ニアリマス。其君主ト云フモノヲ支那デモ西洋デモ非常ニ輕ク見テ居リマス。『孟子』中ニモ民ヲ重シトシ社稷之ニ次ギ、君ヲ輕シト爲ス』ト云フノガアリマス。民ガ一番重イ、其次ガ社稷即チ國家、最後ニ君デアルト云フ言葉ガアリマス。ソレカラ西洋ハ個人主義デアリマス。平等デアリマス。君主ガ特別ニ上ニアルト云フコトモナイ、君主モ臣民モ平等デアル皆今ノ『ユウ」デアル、然シ其皇帝ハ呈帝自身デモ西洋ノ皇帝ト云フ考ヘハ到底我國ノ皇帝陛下ニ對スル考ヘトハ全然違フ、私ノ友人ガ何時ゾヤ英吉利ヘ行ツテ來タガソレガ話スノニ『何ウモ外國ノ皇室ハ平民的ダ」ト云フ『何ウシテ平民的ダ』ト云フト『例ヘバ英吉利ノ王様等ガ其處ヲ御通リニナツテモ人民ハ極クオ側へ寄ル、ソレカラ又宮城ノ中デモ玄關ノ所迄人民ガ行ツテ今日ハ王樣ガオ出デニナルト云フノデ見ニ行ク、サウ云フ所ガ非常ニ平民的ダ』ト云ツテ居タガ獨達ノカイゼル等モ一千八百九十二年デアツタカドイツ全國ノ〓育家大會ガアツテ斯ウ云フ風ニ小學校ノ先生等ガ會議ヲシタソノ小學校ノ先生等ガ集ツタ會議ノ席へ皇帝自身ガ出テ演說ヲスル、サウ云フ譯デスカラマア平民的ダト人ガ云フノデアリマス。ソレデ又皇帝自身ガ矢張リ平民ヲ以テ任ジテ居ル、獨逸帝國ガ一千七百七十二年ニ巴里ヲ攻メタ時ニベルサイユ宮殿ニ於テ皇帝ノ位ニツイタノデアルガ其時ニ獨逸皇帝ガ勅語ヲ降シタノデアリマス『决シテ朕ハ諸侯ノ上位ニ立タナイ、獨逸ノ第一等ノ人民ヲ以テ任ズル』ト云フヤウナ工合デ人臣ダト皇帝自身ガ云ツテ居ル、ダカラ之位確カナコトハナイ、佛蘭西邊リデモルイ十七世ト云フ王樣ハ『朕ハ國家ナリ』ト云フコトヲ云ツタ、獨逸ヤ佛蘭西デハ王樣ハ皇帝ト云ハナイ、恐レ多クモ我國ニ於キマシテハ日〓戰爭ノ時等官戰ノ詔勅中ニ於テモ『天佑ヲ保有シ萬世一系ノ皇祚ヲ踐メル大日本帝國皇帝ハ忠實勇武ナル汝有衆ニ示ス」ト仰セラレテアリマス。デアルガ佛蘭西邊リデハ又獨逸デモ國ノ皇帝ト云ハナイ、佛蘭西人ノ皇帝、獨逸人ノ皇帝ト云フ實ニ面白イ、ナポレオンノヤウナ大皇帝デモ佛蘭西人ノ皇帝ト云ツテ佛蘭西國皇帝ト云ハナイ、ソレガ向フノ流儀デアル。平民的ダト云フガ實際皆平民デアツタ、ナポレオン一世モアレハ元佛蘭西ノコルシカノ辯護士ノ息子デアル。一朝風雲ニ乘ジテ皇帝トナツタノデアリマス。皆向フハソレデアル元來ガ平民デアルカラ平民的デアルノハ寧ロ當然ト云ツテ好イ。サウナクテハナラナイ、我國ノヤウニ實ニ天照大神ノ神勅ニ『葦原ノ千五百秋之瑞穗國ハ是吾子孫ノ王タルベキ地ナリ宜シク爾皇孫就イテ治ラセ。行矣、寶祚ノ隆マサンコト當ニ天壤ト倶ニ窮リナカルベシ』斯ウ云フ神勅ニ基イテ萬世ノ皇統ヲ頂イテ居ル國トハ丸デ同日ニ論ゼラレナイ、此點ヲ充分自覺シタナラバ天皇機關說等ハ毛頭起ルコトハナイノデアリマス、我國ノ國體ハソレコソ言葉通リ世界無比デアリマス、デアルカラ外國ノ法律ヤ何カヲ以テ我日本ノ國體ヲ解釋スルコトハ出來ナイ、其處デ私ハ日本ノ國體ノ特質ヲ箇條書ニシテ少シ說明ヲ申上ゲテ見タイト思ツテ居ル。皇統-系我國ハ天壤無窮ノ神勅ニ基ヅキ萬世一系ノ皇統ヲ頂イテ居リマス。コノ皇統一系ト云フノハ、世界萬國ニソノ比ヲ見ナイ所デアリマシテ、ソレガ我國體ノ根本デアルコトハ改メテ申シ上ゲル迄モナイノデアリマス。ニ、建國の悠久世界ニハ國ガ非常ニ澤山アリマス。世界萬國ト云フノデアリマスケレドモ、今日我國ノ樣ニ永ク續イテ居ル國家ハアリマセン。所謂天壤無窮ノ國家デアルノデアリマス。之レヲ世界ノ歷史ニ見マスルト、英吉利デモ、佛蘭西デモ、獨逸デモ、之等ノ國家ハ、皆朝ニ起リ、タニ滅ブト云フ風デアリマス。長クテ三百年カ五百年、アノ歐洲大戰亂ノ時ニ亞米利加ノウイルソン大寶祚ノ隆マサンコト當ニ天壤ト世界萬國ニソノ比ヲ見ナイ所

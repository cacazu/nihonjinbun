    corrections:
    - ocr: 致シマス。分ヲ十分盡サレル次第デアルト考ヘルノデアリマス。ノ點ニ十分御考慮ヲ煩ハシテコノ非常時ヲ、突破シタイモノト考へマス。ソノ實行ハ小學校ナド〓育方面ト聯絡ヲ取リ、靑年團、體ノ精華ヲ國民ニ徹底シマスルヤウニ御努力ヲ願ヒタイノデアリマス。ス。マスカラ、トデアリマス。コウ云フ基本的ノ方面ニ先ヅ御努力ヲ願ツテ、ニモカヽハラズ、今日西洋ノ平等思想ノ爲ニ、ソレデ一方ニ於イテ國體ヲ明徵ニスルト同時ニ、例ヘバ前ニ申シマシタ國體ノ根抵トナツテ居リマスル日本精神ノ秩序ノ觀念ノ如キハ、此國體ノ本質ヲ充分明カニセラレサウシテ我國運ノ發展ニ貢献寄與セラレルト云フコトハ即チ日本國民トシテノ本日ニ月ニ薄弱ニナラントスルカノ樣子ノ見エマスルノハ、實ニ憂慮ニ堪ヘナイコ大變長イ間御靜聽ヲ煩シ恐縮デアリマス。一方ニ於イテハ着々之ヲ實行セシムル方法ヲ講ズル事ガ急務ト思ヒマス處女團、國民ガ秩序ヲ尊重シ、禮儀ヲ重ンズルヤウニシタイモノデアリマ成人〓育、色々ノ方面ニ勸奬スル事ガ便宜カト思ヒマス。要スルニ今日ハ特ニ國體明徵ノ叫バレテ居ル時デアリ國體ノ據ツテ立ツ基礎デアリマスル之ヲ以テ私ノ御話ヲ終ル事ニ此等發昭和十一年四月五昭和十一年三月三十日印刷印發編印刷刷行輯日發行所人人兼靑靑森市長島三番ノ二號靑森市長島三番ノ一一號森柴田縣東奥日報社印刷部田中廳電話內吉作一〇四三番左五衛郎行印發編所印刷刷行輯靑靑森森森縣廳縣內神職五衛會郎門
      corrected: '體ノ精華ヲ國民ニ徹底シマスルヤウニ御努力ヲ願ヒタイノデアリマス。

        例ヘバ前ニ申シマシタ國體ノ根抵トナツテ居リマスル日本精神ノ秩序ノ觀念ノ如キハ、國體ノ據ツテ立ツ基礎デアリマスルニモカヽハラズ、今日西洋ノ平等思想ノ爲ニ、日ニ月ニ薄弱ニナラントスルカノ樣子ノ見エマスルノハ、實ニ憂慮ニ堪ヘナイコトデアリマス。コウ云フ基本的ノ方面ニ先ヅ御努力ヲ願ツテ、國民ガ秩序ヲ尊重シ、禮儀ヲ重ンズルヤウニシタイモノデアリマス。ソレデ一方ニ於イテ國體ヲ明徵ニスルト同時ニ、一方ニ於イテハ着々之ヲ實行セシムル方法ヲ講ズル事ガ急務ト思ヒマス、ソノ實行ハ小學校ナド教育方面ト聯絡ヲ取リ、靑年團、處女團、成人教育、色々ノ方面ニ勸奬スル事ガ便宜カト思ヒマス。此等ノ點ニ十分御考慮ヲ煩ハシテコノ非常時ヲ突破シタイモノト考ヘマス。要スルニ今日ハ特ニ國體明徵ノ叫バレテ居ル時デアリマスカラ、此國體ノ本質ヲ充分明カニセラレサウシテ我國運ノ發展ニ貢献寄與セラレルト云フコトハ即チ日本國民トシテノ本分ヲ十分盡サレル次第デアルト考ヘルノデアリマス。大變長イ間御靜聽ヲ煩シ恐縮デアリマス。之ヲ以テ私ノ御話ヲ終ル事ニ致シマス。


    printed_page: '12'
    printed_page_end: '13'
  translation_ja: わが国家は神によってつくられました。今述べたとおり、天照大神の神勅によってつくられたのです。外国でも、神につくられた国家や、神が君権を授けたということを言いますが、そのような国家も長続きしません。ところが、わが国は初めから神によってつくられました。天照大神が天孫瓊々杵尊に、天地とともに窮まりなく続くという神勅を下し、三種の神器を授け、国家建設の基礎を築かれたのです。実に、わが国家を起こされたのは神です。これが、わが国体の著しい特色の一つです。

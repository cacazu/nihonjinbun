  translation_ja: です。つまり、憲法や国の法律は、そのまま真心であり、天皇陛下の大御心に通じるものです。このように、日本国民は真心、すなわち誠によって、陛下の大御心の中に一つに帰するのです。そして、その陛下の大御心は、そのまま天照大御神の大御心であられます。ここが惟神であり、この見地から君民同心と言うことができるのです。そこで、

  source_variants:
  - kind: ocr
    text: 413日本精神と國体の本質文文學博士田中義能私ハ只今御紹介ニ預リマシタ田中デゴザイマス、今日當會ノ開カレマス機會ニ私ニ參ツテ御話ヲ申上ゲルヤウニト云フノデ私ハ『日本精神ト國体ノ本質』ト云フ題ヲ以テ暫ク御靜聽ヲ御願ヒシタイト考ヘテ居リマス。近來日本精神下云フコトガ頻リト繰返ヘサレテ參リマシタガ、共本質、內容ト云フヤウナモノニ就テハ刀〓新話ニ種々ニ解釋サレテ居ルノデアリマス。デ此點ニ就イテ先ヅ申上ゲマシテ、問題ニナツテ居リス國休明後ト云フヤウナコトニ論及シテ見タイト考ヘテ居ルノデアリマス。私ドモガモノヲ持ツテ居リマト云フコトハ改メテ申ス迄モナイコトデアリマス。併シ個人々々ニ持ツテ居リマス精神ハ人ニ依ツテ々違フノデアリマス。所謂十大十色ト申シマス。之ハ其人ノ生レ付デアリマス。ソレカラ又境遇デアリマス。又色々受ケマスル所ノ〓育デアリマス。ソウ云フモノニ依ツテ個人ノ精神ト云フモノガ成リ立ツテ來ルノデアリマス。銘々各個人特有ノ精神固有ノ精神ト云フモノヲ持ツテ居ルノデアリマスガサウ云フ人々ガ只一人デ生活シテ居リマセンデ、色々ト團体ヲ作リマス。或ハ家ヲ作リ、或ハ町村ヲ作リ、或ハ府縣ヲ作リ、サウシテ大イナル國家ト云フモノヲ作リマス。斯ウ云フ順序ニ進ンデ參ルノデアリマスガ其人間ガ一ツノ團体ヲ作ツテ、サウシテ此永久的ナ、勿論人間ハ或期限デ天壽ヲ終ルノデアリマスガ、其團体ナルモノハ、其家ナラ家ト云フモノハ、永久的ナ性質ヲ持ツテ居リマス。市町村、國家ト云フモノハ皆永久的ナ性質ヲ持ツテ居リマス。サウ云フ永久的ナ性質ヲ持ツテ居リマスト云フト、其團体ト云フモノハ一人ノ人ト同ジヤウニ、各又其特有ノ精神ヲ持ツテ來ルノデアリマス。其處デ一ツノ國家ト云フモノヲ爲シマスルナラバ、即チ其國家ノ精神、國民ノ精神ト云フモノガ學博士田中刀〓1-

        ト云フコトガ存在スルノデアリマス。即チ君民同心デ上下ノ別ガ、立タナイヤウナコトガアリハセヌカト申シマスルト、我ガ國體ニ於キマシテハ。君民ノ分ガ極メテ嚴肅ニナツテ居ルノデアリマス。此ノ點ハ十分ニ認識セラレルノデアリマス。昔、和氣淸麻呂公ハ宇佐八幡宮ノ神勅ヲ奏上シマシテ、此コトヲ最モ明確ニシテ居リマス。即チ『我國家ハ開闢以來君臣ノ分定レリ。臣ヲ以テ君ト爲スコト未ダコレアラズ。天津日嗣ハ必ズ皇緒ヲ立テヨ。無道ノ者ハ速ニ掃除スペシ』トアリマスガ、コレガ最モヨク、我ガ國體ニ於ケル君臣ノ大義名分ヲ明ラカニシテ居ルノデアリマス。カクテ君臣同心デアツテ、而シテ君臣ノ間ニ分ガ別レテ居ル、大義名分ヲハツキリシテ居ルノガ、我國体ノ特色デアリマス。ソレカラ其次ノ特色ハ

        十三、民族國家

        ト申スノデアリマス。コレハ何ウ云フコトデアルカト申シマスルト同一民族デ國家ヲナスト云フコトデ、之ガ極メテ大切デアリマス。私ハ先刻申シ上ゲマシタヤウニ臺灣ニ行キマシタ。其時モ此點ヲ高調シテ置キマシタ。ツマリ日本國民ハ一ツノ民族ヲ以テ國家ヲ建設シテ居ルト云フコトデアリマス。一體我國ニハ天孫ノ民族即チ天孫瓊々杵尊ガ澤山ノ一族ヲ御ツレ遊バシテ九州ニ御下リニナリマシタ。又饒速日命モ澤山ノ御一族ヲ御ツレニナツテ大和ノ方ニ御下リニナリマシタ。素戔鳴尊モ出雲ノ方ニ御下リニナリマシタ。カウ云フノガ皆天孫民族デアリマス。其ノ他ハ先住民族ト、國家ガ出來タ後ニデモ朝鮮カラ、又支那カラ歸化シタ人間ガ非常ニ澤山アリマス。純粹ノ天孫民族、大和民族ノ外ノ民族ガ、奈良朝頃ニハ約三分ノ一位アツタラウト思ハレマス。ソレヲ大和民族ハ長イ年月ノ間ニ融合調和シテ、今日ノ純粹ノ大和民族ニシタト云フコトガ、日本國體ノ傑イ所デアリマス。此ノ點ハ慥ニ世界無比デアリマス。即チ古代カラ色々ノ民族ガ入ツテ來テ居ツテモソレガ悉皆大和民族ニ統一セラレ純化セラレテ大和民族トナツテ居ルノデアリマス。隨分其レハ大變ナモノデアリマス。アノ九州邊リデモ熊襲族ト云フモノハ非常ナモノデアリマシタ。ソレガ皆大和民族ニナツテ居リマス。又東北ニハアイヌ族ト云フノモ、隨分多數ガ大和民族トナツテ居リマス。ソノ未ダ純化ガ出來ナイノガ、北海道ニ殘ツテ居ルノガアリマス。今日四國へ行ツテモ、九州ヘ行ツテモ自分ハ特別ノ人種ダ等ト考ヘル人ハ一人モアリマセン。今日臺灣ヤ、朝鮮ガ、我領土トナツテソノ人ガ純化シツヽアルノデアリマス。中ニハソレハ上代ニ於テハ僅カナ民族ダツタカラソレヲ純化スルコトハ出來タガ、今朝鮮一千何百萬、臺灣ノ三百萬ヲ純化スルト云フコトハ不可能ダ等ト云フ人ガアリマスガ、ソレハ見當違ヒナ議論ダト思ヒマス。ソレヲ皆純化スルノガ日本民族デアリ日本民族ノ特色デアリマス。巳ニ三分ノ一モアツタ異民族ヲ純化シテ居リマス。熊襲ヤアイヌニシテモ其當時ノ民族ハ非常ナモノデアリマシタ。大和民族ト同數マデハ行キマセンデモ、餘程近イ數デアツタニ相違アリマセン。ソレヲ皆同化シタノデアリマス。朝鮮ノ一千何百萬、臺灣ノ三百萬、ソレヲ今直グ同化スルト云フコトハ斷ジテ出來マセン。矢張リ藉スニ歲月ヲ以テスレバ朝鮮、臺灣ト云フ風ナ民族モ、熊襲、アイヌナドヽ同樣ニ同化スルノガ大和民族ノ特色デアリマス。英吉利ナド其本國ハイングランド、アイルランド、スコツトランドノ三ツカラ成ツテ居リマスガ、今日ソノ國內ノ民族ハ違ツテ居リマス。民族ニ差別ヲ立テヽ居リマス。歐羅巴各國モソノ通リデアリマス。彼等ハ融合調和ト云フコト、他ノ民族ヲ入レテ同一民族ニスルト云フ宏量ガ彼等民族ニハ缺ケテ居ルノデアリマス。獨リ我大日本帝國國民ハ民族ヲ融合調和シテサウシテ純潔ナ大和民族ニスル天才ヲ持ツテ居リマス。之ガ我國體ノ一大特色デアルノデアリマス。ソレカラ民族ノ統一ト云フコトガ亦大イナル特色デアリマス。'

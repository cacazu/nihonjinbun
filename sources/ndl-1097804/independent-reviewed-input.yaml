  source_text: ソレカラ日本國民ハ昔カラ神樣ヲ崇敬スルト云フ觀念ガ强イノデアリマス。コレハ誰カラモ教ツタノデハアリマセン。今日キリスト教徒デモ神樣ヲ尊敬シマスガ、ソレハ『イエスキリスト』ト云フ者ニ教ツタ、キリストノ教ヘヲ奉ジテ然ルノデアル我國民ハ誰カラモ教ツタト云フノデハナイ。敬神觀念ヲ潜在精神トシテ持ツテ居マシタ。我國ノ『古事記』ヤ、『日本書紀』ヲ見ルト如何ニ敬神觀念ガ深イカト云フコトガ判リマス。從ツテ國民ハ上代ハ特ニ非常ニ嚴肅ナル生活ヲシマシタ。デ何カ事ガアルト云フト神樣ノ御心ヲ伺フ。ソシテ伺フ爲メニハ占ヲシマシタ。ソレデ神代カラ卜部ト云フモノガ、重要ナ役目ヲ持ツタノデアリマス。即チ神樣ノ御心ハ何ウデアラセラレルカト云フノデ、鹿ノ肩ノ骨ヲ燒キマシテ、其割レ目ニヨリマシテ、御心ヲ知ルノデアリマス。コレガ占デアリマス。上代ニ於テハ斯クシテ占ヒマシタ。サレバ『古事記』ニモ『フトマニニヨツテウラヒテ曰ク』トアリマス。サウ云フ工合ニシテ日本國民ハ敬神觀念ニ滿チテ嚴肅ナル生活ヲシテ來タノデアリマス。
  source_languages:
  - ja
  source_locations:
  - source_id: ndl-1097804
    precision: page
    source_sequence: 4

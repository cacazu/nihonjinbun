  source_text: ソレカラ日本國民ハ至誠ノ活動、即チ眞心ヲ以テ活動シマス。コレガ亦日本國民ノ潜在的精神トナツテ居リマシタ。國民ガ皆眞心ヲ以テ活動スル、所謂至誠一貫、至誠一貫ト云フノハ漢字デアリマスガ、我國民ハ本來眞心ノ活動ヲシテ居リマス。コレハ神樣ノ所デ今大祓ヒヲ致シマス、禊祓ト云フコトガ我國デハ非常ニ重大視サレテ居リマスガ、禊祓ノ極致ト云フモノハ、ツマリ眞心ニナリマス。單純ニ只身体ヲ洗フノデハアリマセン。禊祓ノ極致ハ眞心ニ到達スルノデアリマス。世ノ宗教等デハ念佛ナドヲ唱へ、或ハ題目ヲ唱ヘ、或ハ讃美歌ヲ唱ヘマス。コレ皆眞心ニナラウト努メルノデアリマス。我國ニ於テハ禊祓ヲシテ祈禱スル、其處ニ眞心ガ表現スル。カクテ其ノ眞心ニナツテ活動スル。本居先生ガ『生レ乍ラノ眞心ゾ道ニハアリケル』ト云フコトヲ云ハレマシタ。日本精神ハ眞心ノ活動デアリマス。コレガ即チ至誠一貫、コレガ誠ト云フコトデ、コレガ神明ニ通ズルノデアリマス。明治天皇ノ御製ニ目ニ見エヌ神ノ心ニ通フコソ
  source_languages:
  - ja
  source_locations:
  - source_id: ndl-1097804
    precision: page
    source_sequence: 4
    url: https://dl.ndl.go.jp/pid/1097804/1/5
    printed_page: '6'
    printed_page_end: '7'
  translation_ja: 'さらに、日本国民は至誠の活動、つまり真心をもって活動します。これも日本国民の潜在的な精神でした。国民がみな真心をもって活動する、いわゆる至誠一貫です。「至誠一貫」は漢字による言い方ですが、わが国民は本来、真心によって活動しています。

    今も神前で大祓を行います。わが国では禊祓が非常に重んじられていますが、禊祓の行き着くところは真心なのです。単に身体を洗うのではありません。禊祓の極致は真心に到達することです。世の宗教では、念仏や題目を唱え、あるいは讃美歌を歌います。これらもみな、真心になろうと努めるのです。わが国では禊祓をして祈り、そこに真心が表れます。そして、その真心になって活動します。

    本居先生は「生まれながらの真心こそが道であった」と言われました。日本精神は真心の活動です。これが至誠一貫であり、誠ということであり、神に通じるのです。明治天皇の御製に、

    「目に見えない神のお心に通じるものこそ、」'
  translation_status: draft

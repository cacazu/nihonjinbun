  source_text: シニナリマスル時御承知ノ通リ三種ノ神器ノ鏡ヲ御授ケニナリマシテ、特ニ『此鏡ハ我靈トシテ床ヲ同クシ、殿ヲ共ニシテ齋キ祀レ』ト申サレマシタ。即チ天皇陛下ノ御座所ニ、天照大御神樣ヲ御祀リサレマス。其處ノ所ガ祭政一致ノ根本デアリマス即チ天皇陛下ニ奉仕スルト同時ニ天照大御神樣ニ奉仕サレル。天照大御神樣ニ奉仕スルト同時ニ天皇陛下ニ奉仕スル所ガ一體デアリマス。宮中ガ即チ神宮デアリマス。大神宮デアリマス。大神宮ハ即チ宮中デアリマス。玆ガ祭政一致ノ本デアリマス。祭政一致祭政一致ト云ヒマスガ、只徒ラニ祭政一致デハナイノデアリマシテ、サウ云フ所ニ祭政一致ノ根抵ガアリマス。政ト云フノハ色々ニ解釋サレテ居リマスケレドモ、奉仕事、ツマリ奉仕スルノデアリマス。天皇陛下ニ奉仕スルノデアリマス。天照大御神樣ニ奉仕スルノモ同樣デアリマス。ソレガ祭政一致デアリマス、ソレガ根本デアリマス。崇神天皇ノ時ニ神威ヲ畏マレテ大和ノ國ニ天照大御神樣ヲ御遷シニナリマシタ。然シ矢張リ宮中ニ於カレテハ別ニ御神體ヲ御作リ遊バシテ奉仕サレテ居リマス。今日デモ御承知ノ通リ宮城ノ中ニ、宮中三殿ト申スノガアリマス。賢所、皇靈殿、神殿デアリマシテ、矢張リ宮中ハ神宮デアリマス。ソシテ天皇陛下ハ現津神デアラセラレルノデアリマシテ、陛下ニ奉仕スルノハ神樣ニ奉仕スルコトデアリマス。サウ云フ譯デ我國體ハ祭政一致ト云フコトガ根本デアリマス。ソレカラ次ハ

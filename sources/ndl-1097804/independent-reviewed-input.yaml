  translation_ja: 'という特色です。もともと、わが国の建国の精神は家族主義です。ご承知のとおり、昔、伊弉諾・伊弉冉の二神が磤馭慮島に八尋殿を建てられ、そこで結婚の式を挙げ、家族制度の基礎を築かれて以来、今日までそれが国体の根底をなしてきました。

    ところが先年、京都大学に瀧川教授という人がいて、わが家族制度を攻撃し、「家族制度は良風美俗という名のもとに存在する、封建制度の残骸である」と言いました。これでは日本精神は満足しません。ここに盛んな議論が起こり、ついに瀧川教授は大学を辞めなければならなくなりました。

    つまり、わが国体は家族制度を根本としています。家族制度は家長を立て、一家の秩序と統一を確立します。一軒の家には家長がいて、家族がそれに従い、家長は家族を自分自身として愛護します。幼いときから、まだ言葉も十分に話せないうちから、このような秩序と統一の精神が養われます。

    その家で養われた精神を持つ者が成長して日本国民になると、天皇陛下を家長と仰ぎ、天皇陛下は国民を大御宝として愛護し、君臨されます。こうして家族制度による秩序と統一を持つ、世界に比べるもののない国体が成立しているのです。

    そこで「義の上では君臣、情の上では父子」と言われ、また、

    「罪があるなら、天つ神よ、私をおとがめください。民は私が生んだ子なのですから」

    という御製のとおり、臣民は陛下の御子という関係にあります。ですから、私たち臣民も、

    「君の御代を思う心一筋に、わが身があるとは思わなかった」

    というのです。

    西洋の個人主義のように「神よ、私は私の義務を果たした」と、国家の大事件に際してさえ「私は、私は」と言う、その「私」を捨て、「わが身があるとは思わなかった」と言う。これがわが国体です。

    このように君主と国民が一家をなし、大日本帝国は一つの大きな家、すなわち「公」なのです。「公」は「大宅」または「大家」です。次は、'

  translation_ja: '今、国体明徴ということが盛んに繰り返されています。しかし、国体とは何を意味するのでしょうか。国体明徴、国体明徴と言っても、「国体とは何か」と問われて、明快に答えられる人が何人いるでしょうか。「国体」という言葉をよく研究していれば、天皇機関説などということは夢にも考えられません。それを十分に理解していないから、そのような思想が起こるのです。ただ夢中になって西洋をまねるから、あのような思想が起こるのです。

    わが国の古代の『日本書紀』などにも「国体」という言葉はありますが、今の意味では使われていません。この語が盛んに使われ、その意味が今のようになったのは徳川時代からです。特に水戸の学者、会沢正志斎などの著書では、国体の思想が明確かつ適切に用いられています。

    維新後には、恐れ多くも明治天皇が、たびたび詔勅にこの言葉をお使いになりました。明治二年の詔勅には、「わが大八洲の国体を創立する」などとあります。明治四年の勅諭にも国体という文字をお使いになり、明治十五年一月四日に軍人に賜った勅諭では、「およそ七百年の間、武家による政治となった。世のありさまが移り変わってこのようになったのは、人力で取り戻すことができないとはいえ、一方ではわが国体に背き、一方ではわが祖先の定めに背き奉る、嘆かわしいことであった」とおっしゃいました。武家の政治になったことは、国体に背き、祖先の定めにも背く嘆かわしいことだと述べられたのです。

    国体という語は、このように勅語の中に数多く使われています。中でも最も著しいのは、ご承知のとおり、教育勅語の「国体の精華」という言葉です。このようにいろいろ使われているのですが、国民にはその意味がなかなかはっきり意識されません。

    そこで、先年、帝国議会で治安維持法案が議題になった際、初めはその第一条に「国体及び政体」とありました。ところが政体の字が削られ、国体だけとなったのですが、その語の解釈が上下両院でさまざまに論じられました。そのとき上院で、一人の議員が司法大臣に、この治安維持法では国体をどのような意味で用いているのか、と質問しました。当時の司法大臣は、「この国体は、帝国憲法第一条の意味である」と明確に答弁しました。帝国憲法第一条とは、「大日本帝国は、万世一系の天皇がこれを統治する」というものです。

    これはもちろん国体の重要な部分ですが、私たちが国体というときには、もう少し範囲を広くして言います。教育勅語には、「忠義と孝行をよく尽くし、すべての国民が心を一つにして、代々その美しさを成し遂げてきたことは、わが国体の精華である」とあります。つまり、忠義と孝行をよく尽くす、いわゆる忠孝一致の精神が国体の精華だとおっしゃっているのです。したがって、国体という言葉は、かなり広く用いるべきだと考えます。

    では、どのように用いればよいでしょうか。法律家などは一般に、国体を「主権の所在によって定める国家のあり方」と解釈しています。主権が君主にあるか人民にあるかによって、国家のあり方が違ってくる。君主にあれば君主国体、人民にあれば民主国体というのだと解釈しています。

    ところが別の学者は、「国体や政体を論じる必要はない。主権は常に国家にある」と言います。主権は君主にも人民にもなく、国家にあると論じ、その結果、いわゆる君主機関説、すなわち天皇機関説を唱えているのです。私は二十年以上前から、このような説はよくないと論じ、書物にも書いてきましたが、ようやく今日、それが実現してきたのは、'

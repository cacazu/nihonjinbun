    corrections:
    - ocr: ソコニ生レテ來ルノデアリマス。ソレガ以前カラ國民精神々々々々ト繰返ヘサレテ居ツタ所ノモノデアリマス。デモアリマス。アメリカハアメリカ、イギリスハイギリス、何處デモアリマス。其國民精神ヲ持ツテ居ルノデアリマスガ、近來其國民精神ト云フモノガ非常ニ我國民ニ自覺サレテ來マシタ。今迄歐米ヲ崇拜シテ常ニ眼ヲ歐米ニ向ケ、到底隊米ノ先進國我國ノ國民精神ト云フモノニ自覺ヲ來スト云フコトガニハ企テ及バナイモノデアルト云フヤウナ考ヘデアツタモノデスカラ、乏シカツタノデアリマス。一部ノモノハ盛ンニソレヲ叫ンダノデアリマスケレドモ、矢張リ歐米ニ對シテハ企テ及バズト云フヤウナ考ヘガ一般ヲ支配シテ居ツタノデアリマス。所ガ御承知ノ通リ、最近滿洲事變、上海事變ト云フヤウナモノガ續イテ起リマシテ、玆ニ我ガ國民精神トリモナホサズ日本精神ト云フモノヽ叫聲ガ熾ンニ起ツテ參リマシタ、デ今日デハモウ日本精神ト云ヘバ三才ノ童兒デモ皆知ツテ居ルト云フヤウナ狀態ニナツタノデアリマス。處ガ此日本精神、或ハ日本精神ト云ヒマスガ、先ヅ第一ニ日本、日本ト云フ何レガ正シイカト云フコトヲ一寸一言シテ置キデ一般ニ日本.日マス。近來文部省ノ國語調査會等デ此日本ノ國號ハ日本ト云フノガ宜シイト云フコトガ發表セラレマシタ、本ト云フコトニナツテ參リマシタ。然シ之ハ我國ノ古イモノヲ見マスルト云フト矢張リ日本ト云フコトハ先ツナイト云ツテ好イ位デアリマス、先ヅ日本ト云フ孝德天皇ノ時ニ朝鮮カラ使ガ來マシタ時、ソレニ詔ヲ賜リマジタ。御言葉デモ、日本ト訓マサレテ居リマス。御永知ノ『日本書紀』デモ從來日本書紀トハ申シテ居リマセン。サウ云フ譯デ者ハ一般ニ日本ト云ツテ居ツタノデアリマス。然シ日ト云フ言葉ニハ、日ト云フ音ハナイ譯デ、日トカ日トカ云フノデアリマス。デスカラ支那沈デ云ヘバ或ハ日本ト云フベキデアリマセウ。西洋人ガ「ジヤパン」ト云フノハ之ハ多分支那人ガ日本ト云ツタノヲ、西洋人ガ「ジヤバン』ト訛ツタモノト思ヒマス。何ウモ國ノ名前トカ地名等ハ好クサウ云フ風ニ訛ルモノガアリマス。「對馬」ト云フ國名等ハ御承知ノ通リ對馬ト書イテアリマス。アレ等モ昔支那ノ魏ト云フ時代ニ、日本ヲ探險ニ使ヲ寄越シマシタ。ソレガ探險シテ歸リマシテ魏志ト云フ本ノ中ニ詳シク書イテ居リマスガ、ソレニ對馬ト書イタノデアリマス。之ヲ恐ラクハ支那人ガ津島ニ來マシテ、此島ハ何ト云フ島カト日本人ニ聞イタモノト見エマス。アレハ津島、云フノデアリマス。昔カラ津々浦々ト申シテ居リマスガ、津ハモノヽ溜ルコトデ、船ガ溜ルノヲ矢張リ津ト到ル所ニ伊勢ノ津ト云フヤウナ名ガアリマス。其津ノ島デアリマス朝醉ト日本トノ往復ニ船ガ其處ニ碇泊スル島、其處デ津島ト申シマシタ。ソレヲ支那人ガ來タ時ニ津島人ガ津島ト早口ニ云ツタノヲ『ツイマ』ト聞イテ、ソレガ『對馬』ト云フ字ヲ支那人ガ當テ族メタモノデアリマス。ソシテ支那ノ本ニ書キマシタ。ソレガ日本書紀ヲ書カレル時ニ支那人ニワカルヤウニ支那流ニカヽレマシタ。考ヘラレマス。デアルカラ日本ハ『日本』ト云フカ、或ハ『日本』ト云フカ、サウ云フヤウニ訛リデ對馬トナツタノデアルト日本ヲ柔和ニシテ日本ト云フカヾ間題デアリマス。然シ音カラ云ヘパ日本ガ宜シイト思ヒマス。抑モ日本ノ國名ハ昔カラ色々アルノデアリマス。ナ國デアリマスノデ浦安國ト申シマシタ。日本ハ昔カラ心ノ安ラカ浦ト云フコトハ心デアリマス。心ハ人ニ見エマセンカラ面ニ對シテ浦(心)ト云ヒマス。或ハ又瑞穗國ト申シマス。從來コレヲオ米ガ採レルカラト云フ風ニ解釋シテ居リマスガ、云フ稱辞デアリマス。穗ハ稻ノ穗ニ限リマセヌ。上ト云フノモ『ホ」ト云フノデアリマス。瑞ト云フノハ「ミヅノ〓シイ」トテ居リマス。火ノ穂ト書イテ婚ト云ヒマス。穗ト云フノハ上ト云フゴトヲ意味シ我國ハ世界ニ澤山國ガアルガ其國ノ中ノ穗ノ國デアルト云フ意味デ瑞穗國ノト云フノデアリマス。或ハ秀眞國トモ申シマス。コレハ穗ノ御國ト云フ義デ瑞穗國ト似タ意味デアリマス。色々國名ガツイテ居リマス。ソコデ日本、聖德太子ガ支那ニ使ヲ御遺リニナツタ時ニソノ他我國ニ對シテハ日本ハ日出ル國デアルト云フノデ、『日出ル所ノ天子云々』ト云ハレタ如クサウ云フ風ニ日本ハ古來日ト云フモノト密接ナ關係ガアルノデ日本ト云フ國名ガ我國ニ適切ナ國名デアルト云フノデ廣ク川ヒラレルコトヽナツタ。即チ、天照大神ヲ日ノ神ト申シマス。云フノデ日ノ本ト云フノモ結構デアリマス。サウ云フ譯デ天照大神ノ國ト又天孫降臨遊シタ時ニ日向ノ地ヲオ選ビニナリ、宜シクナイ』ト仰セニナツタ如ク、神武天皇ハ『日ニ向ツテ戰フハ我國ハ日ニ非常ニ關係ガ多イノデ、ツクト思ヒマス。ソレデ先ヅ今日日本精神ト云フノガ宜シイカ、ソレデ日ノ本ト云フ國名ガ最モ廣ク行ハルヽコトヽナ日本精神ト云フノガ宜シイカト云フノデスガ、之ハ何モ法律

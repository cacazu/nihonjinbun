  translation_ja: 'なったとき、ご承知のように三種の神器の鏡を授けられ、特に「この鏡を私の御霊として、床を同じくし、御殿をともにして、慎んで祀りなさい」とおっしゃいました。つまり、天皇陛下のお住まいに天照大御神をお祀りするのです。そこが祭政一致の根本です。

    天皇陛下に奉仕すると同時に天照大御神に奉仕し、天照大御神に奉仕すると同時に天皇陛下に奉仕する。そのことが一体なのです。宮中はそのまま神宮であり、大神宮です。大神宮はそのまま宮中です。これが祭政一致のもとです。祭政一致、祭政一致と言いますが、ただ言うだけではなく、そのようなところに根拠があります。

    「政」はいろいろに解釈されますが、奉仕事、つまり奉仕することです。天皇陛下に奉仕するのです。天照大御神に奉仕するのも同じです。それが祭政一致であり、根本なのです。

    崇神天皇のとき、神の威厳を畏れ、天照大御神を大和の国へお遷しになりました。しかし宮中でも、別に御神体をつくられて奉仕されています。今日もご承知のとおり、宮城の中には宮中三殿があります。賢所、皇霊殿、神殿であり、やはり宮中は神宮なのです。そして天皇陛下は現津神であられるので、陛下に奉仕するのは神に奉仕することです。このように、わが国体は祭政一致を根本としています。次は、'

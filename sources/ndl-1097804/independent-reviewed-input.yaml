  translation_ja: 'この国民精神とはどのようなものかというと、第一は秩序の観念です。日本国民には古代、まだ学問も研究もない時代に、すでに秩序の観念が発達していました。国民は、それを自覚せず、いわゆる潜在精神として持っていたのです。

    秩序の観念とは、物事をきちんとすることです。日常生活について見ても、古代には身体と精神の区別が十分に認識されていませんでした。後世には身体と精神をいろいろ区別して考えますが、中国でもわが国でも、古代には区別していません。そのため、身体を清めれば精神もきちんと整うと確信されていました。これが、わが国で古代から禊が重んじられた理由です。このようなことは、日本国民の一つの特性なのです。

    私は今年の夏、台湾から招かれて講演に行きましたが、その際、一つの事実を認識しました。台北の近くには温泉があり、私も一晩そこに泊まりました。台湾はご承知のように長い間中国の領土で、多数の中国人が移住し、清朝の支配を受けていました。台北は当時からの都市でした。それなのに、近くに温泉があるにもかかわらず、その時代には全く利用されず、温泉に入っていませんでした。ところが、わが国の領土になるとすぐに発達し、今日では非常に立派な温泉になっています。こうしたことから、日本国民と入浴との間には非常に深い関係があるのだと、改めて認識しました。

    日本国民は実に入浴を好みます。かなり前のことですが、私は鳥取県へ講習に招かれて行きました。伯耆国に三朝温泉がありました。もちろん今もあります。そこへ案内されて入浴しましたが、行く途中に三朝川が流れ、その川の中から湯が出ていて、多くの農家の人たちが入っていました。二、三十年前のことですが、それを見て、古代もこのようだったのだろうかと、しみじみ感じたのです。

    このように、日本国民は神代から湯に入ることを好みました。身体をきちんとし、罪や汚れを祓い除く、大祓を行います。あらゆる罪や汚れを祓い清め、清らかで秩序立った生活をする。それがいわゆる潜在精神であって、理論的に研究して行ったのではありません。このように、入浴によって身体と精神を整え、秩序を立てたのです。

    さらに、わが国民の言葉について考えてみます。日々使う日本語も、言葉の間に秩序が立っています。たとえば「私」「あなた」と言いますが、西洋では「私」という語を絶えず使います。西洋人は日本語を研究すると非常に不思議に思います。日本では「私」をあまり使わず、使わなくても意味がきちんと分かります。「あなた、お出かけになりますか」「はい、参ります」と言えば、「私は参ります」ということになります。それが西洋では、ごく簡単な言葉にも「私」と言うのです。

    あのネルソン提督がトラファルガルで――今度のエチオピアの事件では、イタリアとイギリスの艦隊が地中海で戦争をするかもしれないという情勢になったようでしたが、そうはならないようです。ところで、ネルソンの時代には、フランス・スペイン連合艦隊とイギリス艦隊が戦い、トラファルガルで大決戦をしました。そのときのイギリスの提督がネルソンで、東郷大将と並び称される名提督です。そのネルソン提督は敵の弾丸に当たって戦死しました。その'

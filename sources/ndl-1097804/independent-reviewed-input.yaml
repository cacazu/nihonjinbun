        一、皇統一系

        我國ハ天壤無窮ノ神勅ニ基ヅキ萬世一系ノ皇統ヲ頂イテ居リマス。コノ皇統一系ト云フノハ、世界萬國ニソノ比ヲ見ナイ所デアリマシテ、ソレガ我國體ノ根本デアルコトハ改メテ申シ上ゲル迄モナイノデアリマス。


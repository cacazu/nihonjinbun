  translation_ja: 'ということが存在します。君主と国民が心を同じくすれば、上下の区別が立たなくなるのではないか、と言うなら、わが国体では君主と国民の区別は極めて厳粛です。この点を十分に認識することができます。

    昔、和気清麻呂公は宇佐八幡宮の神勅を奏上し、このことを最も明確にしました。「わが国では開闢以来、君臣の区別が定まっている。臣下を君主としたことは、まだ一度もない。皇位には必ず皇統の子孫を立てよ。道に背く者は速やかに取り除くべきである」とあります。これが、わが国体における君臣の大義名分を最もよく明らかにしています。

    このように、君主と臣下が心を同じくしながら、その間の区別が定まり、大義名分がはっきりしているのが、わが国体の特色です。次の特色は、'

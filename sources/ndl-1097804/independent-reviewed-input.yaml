  translation_ja: '遅くはありますが、大変結構なことです。

    ある国の国体には、主権は君主にも人民にもなく国家そのものにあるという西洋流の説、つまり君主は機関だという議論があるのでしょうが、わが国には当てはまりません。わが国では、国体は日本精神そのものの表れです。日本精神が現れ、それが国体になるのです。先ほど述べたように、秩序の観念が現れ、万世一系の皇統というめでたい姿が実現してきました。これが日本精神の表れです。外国には、日本精神のような精神がありません。

    秩序の根底にあるのは国家の中心であり、国家の中心は君主です。その君主を、中国でも西洋でも非常に軽く見ています。『孟子』にも「民を重んじ、社稷をその次とし、君主を軽いものとする」とあります。人民が最も重く、次が社稷、つまり国家、最後が君主だというのです。

    また西洋は個人主義であり、平等です。君主だけが特別に上にいるのではなく、君主も臣民も平等で、みな先ほどの「ユー」です。しかし皇帝自身にとっても、西洋の皇帝という考え方は、わが国の皇帝陛下に対する考え方とは全く違います。

    私の友人が以前イギリスへ行き、こう話しました。友人「どうも外国の皇室は平民的です」。私「どうして平民的なのですか」。友人「たとえばイギリスの王がそこをお通りになっても、人民はすぐそばまで寄っていきます。また宮殿の中の玄関まで人々が行き、今日は王がお出ましになるというので見に行きます。そのようなところが非常に平民的なのです」。

    ドイツのカイゼルなども、一八九二年だったでしょうか、ドイツ全国の教育家大会で、小学校の先生たちが会議をした際、その会場に皇帝自身が出向いて演説しました。そういうわけですから、人は平民的だと言うのです。

    また、皇帝自身も自分を平民と見なしています。ドイツ帝国が一七七二年にパリを攻めたとき、ヴェルサイユ宮殿で皇帝の位についたのですが、その際、ドイツ皇帝は「私は決して諸侯の上には立たない。ドイツ第一の人民をもって自任する」といった勅語を出しました。このように、皇帝自身が人臣だと言っているのですから、これほど確かなことはありません。

    フランスでも、ルイ十七世という王は「朕は国家なり」と言いました。ドイツやフランスでは、王を国の皇帝とは言いません。恐れ多くも、わが国では日清戦争の宣戦の詔勅でも、「天の助けを保ち、万世一系の皇位を継ぐ大日本帝国皇帝は、忠実で勇武なあなたたち臣民に示す」とあります。しかしフランスでもドイツでも、国の皇帝とは言わず、「フランス人の皇帝」「ドイツ人の皇帝」と言うのです。実に面白いことです。ナポレオンのような大皇帝でも、フランス人の皇帝といい、フランス国皇帝とは言いません。それが向こうの流儀です。

    平民的だと言いますが、実際みな平民でした。ナポレオン一世も、もとはフランス領コルシカの弁護士の息子です。あるとき時勢に乗って皇帝となったのです。向こうはみなそうです。もともと平民なのですから、平民的なのはむしろ当然であり、そうでなければなりません。

    わが国のように、天照大神の神勅、「葦原の、長く豊かに実る瑞穂の国は、わが子孫が王として治めるべき地である。皇孫よ、そこへ行って治めなさい。さあ行きなさい。皇位の栄えは、天地とともに窮まりなく続くであろう」という神勅に基づき、万世の皇統を戴く国とは、全く同じように論じることはできません。この点を十分に自覚すれば、天皇機関説などは少しも起こりません。わが国体は、まさしく文字どおり世界に比べるものがないのです。ですから、外国の法律などによって日本の国体を解釈することはできません。

    そこで、日本の国体の特質を箇条書きにして、少し説明したいと思います。'

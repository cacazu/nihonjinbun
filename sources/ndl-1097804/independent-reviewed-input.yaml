  source_text: ノ特色デアリマス。元來我國ハ立國ノ精神ガ家族主義デアリマス。御承知ノ通リ昔伊弉諾伊弉冉二尊ガ磤馭慮島ニ八尋殿ヲオ建テ遊バシマシテ、其處デ御結婚ノ式ヲ擧ゲラレ、家族制度ノ基礎ヲ建テラレマシテ以來今日マデズツトソレガ國体ノ根柢ヲ爲シテ參ツテ居リマス。ソレヲ先年京都大學ニ瀧川教授ト云フノガアツテ、我ガ家族制度ヲ攻擊致シマシテ『家族制度ト云フモノハ良風美俗ノ名ノ下ニ存スル封建制度ノ殘骸デアル』ト申シマシタ。コレデハ日本精神ハ滿足シマセン。玆ニ囂然トシテ議論ガ起リ、遂ニ瀧川教授ハ大學ヲ罷メナケレバナラナクナリマシタ。ツマリ我國體ハ家族制度ト云フモノヲ以テ根本トシテ居リマス。其家族制度ハ家長ト云フ者ヲ立テテ、ソシテ其一家ノ秩序、統一ヲ立テルノデアリマス、一軒ノ家ニ於テ家長ガアツテ家族ノ者ガソレニ服従スル、家長ハ家族ノモノヲ自我トシテ之ヲ愛護スル。幼稚ナ時カラ、言葉モ好ク利ケナイ内カラカヽル秩序、統一ノ精神ガ養成サレテ來ル。此一軒ノ家ニ於テ此養成サレタ精神ガ、大キクナツテ日本國民トナリマスト云フト.此處ニ天皇陛下ヲ家長ト仰ギ、天皇陛下ハ國民ヲ大御寶トシテ愛護セラレ、以テ君臨アラセラレ、玆ニ家族制度ニナル秩序.統一ノ世界無比ナル國體ガ出來テ來テ居ルノデアリマス、ソコデ『義ハ君臣ニシテ情ハ父子』ト仰セニナリ、或ハ罪アラバ我ヲトガメヨ天ツ神民ハ我身ノ生ミシ子ナレバトノ御製ノアリマスル通リ、臣民ハ陛下ノ御子ト申ス風ナ關係ニアルノデアリマス。デスカラ我々臣民タルモノモ君ガ世ヲ思フ心ノ一筋ニ我身アリトハ思ハサリケリ即チ臣民ガ西洋ノ個人主義ノ如ク「神ヨ私ハ私ノ義務ヲ盡シタ』ト云フヤウナ國家ノ大事件ニ際シテサヘ、私ハ、私ハト云フ其私ヲ棄テヽ『我身アリトハ思ハザリケリ」ト申スコレガ、我國體デアリマス。斯ウ云フ風ニシテ此君民一家、一ツノ家ヲナシテ居ル、即チ大日本帝國ハ一ツノ大イナル家、即チ公デアリマス。公ハ大宅又ハ大家デアリマス。次ハ

  translation_ja: '日本が民族を融合・調和させて統一することは、先ほど述べたとおりですが、それは全く、上に万世一系の皇統を戴いているからです。多くの異民族を集めて純粋な大和民族にするうえで、中心が厳然と存在しているからです。外国では、その中心が一定していないので民族を統一できません。

    これを扇子にたとえてみましょう。扇子には要が大切です。要をなくすと扇子は壊れてしまいます。外国では、民衆がそれぞれその要を自分で取ろうとし、自分が要になろうとします。中国では、自分が天子になろうとするのです。今も中国があれほど混乱しているのは、それぞれに「王侯や将相となる者に、特別な生まれがあるものか」という考えを持っているからです。袁世凱が大統領に満足せず、皇帝になったのも周知の事実です。そのような状態ですから、中国はなかなか統一できず、人民は常に困苦を免れません。

    わが国では、誰も夢にさえ、この要の地位を望みません。長い長い歴史の中で、たまたま道鏡のような者が現れても、和気清麻呂公のように国体の精華を発揮する大人物が現れ、「道に背く者は速やかに取り除くべきだ」という神勅を声高く唱えて、国体の不浄を祓い清めるのです。

    このように、私たち国民はいろいろな理想を抱きますが、西洋の政治家なら、大統領になることや皇帝の位に就くことを理想とします。ナポレオンも、一介の者から身を起こして、ついに皇帝となりました。ところが、わが国民の政治上の理想は何かといえば、臣下として最高の地位と栄誉を得ることです。どこまでも臣下としての栄誉を極める。この点はありがたいことです。これが、日本の民族が統一され、この優れた国体を成している理由なのです。'

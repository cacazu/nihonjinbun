  translation_ja: 'ということです。これはどういうことかといえば、わが国家は天皇陛下と一体だというのです。天皇陛下は国家を体現しておられ、国家は天皇陛下の表現であられる。そういうことなのです。つまり、国への忠義は、そのまま君主への忠義となります。

    ここが外国と違うところです。例の天皇機関説は、国家というものを立て、その国家の第一の機関が天皇であり、その下に総理大臣、大蔵大臣などのさまざまな機関がある、と組み立てていきます。しかし、わが国体はそのようなものではありません。君主と国家が一つなのです。

    法律学者によれば、国家の要素は主権・人民・領土の三つです。主権、領土、人民をみな対等に見て、この三つが集まって国家をつくるというのです。そうすると、この三つを知らなければ国家を知らないことになります。しかし、領土についていえば、わが国の面積はどれほどあるでしょうか。私たちは日本国民でありながら、日本の領土の面積を知らないのですから、あまりに無知に見えるでしょう。

    しかし、自国の面積を知らないのと同じく、アメリカやイギリスの面積も知りません。ただ大まかに、朝鮮・台湾・樺太の半分が日本の領土であることを知っている程度です。それがどれほどの面積かは、地理の試験を受ける人や、何か特別の事情のある人しか知りません。それほど国家にとって大切なものなら、知らなければならないはずです。

    人民が大切だと言っても、人口はいったいどれほどあるでしょうか。今日でも、大まかに七千万人、八千万人などと言います。七千万人と八千万人では一千万人もの違いで、大変な差です。朝鮮や台湾を入れると、今回の国勢調査でおよそ一億だそうですが、それも日々変化しますから、正確にはとても分かりません。したがって、そのような意味での国家は、きわめて大まかなものです。

    少なくともわが国では、国家といえば天皇陛下と同一の観念になります。国家すなわち天皇陛下と見られるのです。そう考えると、主権は君主にも人民にもなく国家にある、ということは全く考えられません。わが国体では、君国一如と言えるのです。そこで、わが国体には、'

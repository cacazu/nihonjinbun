  translation_ja: 'そこに生まれるのです。これが、以前から「国民精神、国民精神」と繰り返し言われてきたものです。これはどの国にもあります。アメリカにはアメリカの、イギリスにはイギリスの、それぞれの国民精神があり、どこでも同じです。

    ところが近頃、この国民精神が、私たちの国民に強く自覚されるようになりました。これまでは欧米を崇拝し、いつも欧米に目を向け、欧米の先進国にはとても及ばないという考えでいたため、自国の国民精神を自覚することが乏しかったのです。一部の人は盛んにそれを唱えていましたが、やはり欧米には及ばないという考えが一般を支配していました。

    ご承知のとおり、最近、満州事変、上海事変が相次いで起こり、ここに私たちの国民精神、すなわち日本精神を唱える声が盛んになりました。今日では、日本精神といえば三歳の子供でも知っているというほどの状態になったのです。

    さて、これを「ニホン精神」とも「ニッポン精神」とも言いますが、まず「ニホン」と「ニッポン」のどちらが正しいか、一言申し上げておきます。近頃、文部省の国語調査会などで、日本という国号は「ニッポン」とするのがよいという発表があり、一般に「ニッポン、ニッポン」と言うようになってきました。しかし、わが国の古いものを見ると、「ニッポン」という言い方はほとんどないと言ってよいほどです。孝徳天皇の時代、朝鮮から使者が来た際に賜った詔のお言葉でも、日本は「ニホン」と読まれています。ご承知の『日本書紀』も、従来「ニッポンショキ」とは言っていません。そのようなわけで、昔は一般に「ニホン」と言っていたのです。

    しかし、「日」という文字には「ニ」という音はなく、「ニチ」や「ジツ」と言います。ですから、中国風に言うなら「ジツポン」とでも言うべきでしょう。西洋人の言う「ジャパン」は、おそらく中国人が「日本」と言ったのを、西洋人が「ジャパン」となまらせたものだと思います。国名や地名には、このようになまるものがよくあります。

    「対馬」という地名も、ご承知のように「対馬」と書きます。昔、中国の魏の時代、日本を探検するために使者が送られました。その使者が帰国し、『魏志』に詳しく記しましたが、そこに「対馬」と書いたのです。おそらく中国人が津島に来て、この島は何という島かと日本人に尋ねたのでしょう。あれは「津島」です。「津」は物が集まることで、船が集まる所も津といいます。昔から「津々浦々」といい、各地に伊勢の津のような地名があります。その津の島なのです。朝鮮と日本を往復する船が停泊する島なので、津島と呼びました。中国人が来たとき、島の人が「ツシマ」と早口で言ったのを「ツイマ」と聞き、中国人が「対馬」という字を当てて中国の書物に記したのです。『日本書紀』を書く際にも、中国人に分かるよう中国風に書きました。このようになまって「対馬」となったのだと考えられます。

    ですから、日本を「ジツポン」と言うのか、「ニッポン」と言うのか、あるいは「ニッポン」を和らげて「ニホン」と言うのかが問題なのです。しかし、音からいえば「ニッポン」がよいと思います。

    そもそも、日本の国名は昔からさまざまです。昔から心の安らかな国なので、「浦安国」と呼びました。「浦」は心のことです。心は人に見えないので、表に対して裏、つまり心というのです。また「瑞穂国」とも呼びます。従来は米がとれるからだと解釈されてきましたが、「瑞」は「みずみずしい」という褒め言葉です。「穂」は稲の穂に限りません。「上」も「ホ」と言います。「穂」は上を意味するので、「火の穂」と書いて「焰」と言います。世界には多くの国がありますが、わが国はその中で最上の国である、という意味で瑞穂国と呼ぶのです。また「秀真国」とも申します。これは「穂の御国」という意味で、瑞穂国に似た意味です。そのほかにも、わが国にはいろいろな国名があります。

    そして「日本」です。聖徳太子が中国へ使者を送られたとき、「日出る所の天子……」と言われたように、日本は日の昇る国です。このように、古来、日本は日と密接な関係があるので、「日本」はわが国にふさわしい国名として広く使われるようになりました。天照大神を日の神と呼びますから、天照大神の国という意味で「日の本」というのも結構です。また天孫が降臨されたときには日向の地を選ばれ、神武天皇は「日に向かって戦うのはよくない」とおっしゃいました。このように、わが国は日と非常に関係が深いため、「日の本」という国名が最も広く行われるようになったのだと思います。

    そこで今日、「ニホン精神」と言うのがよいか、「ニッポン精神」と言うのがよいかということですが、これは法律で'

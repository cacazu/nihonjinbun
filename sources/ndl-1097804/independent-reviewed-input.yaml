  translation_ja: 'です。これは、同一の民族で国家をつくるということで、極めて大切です。先ほど申し上げたとおり、私は台湾へ行きましたが、その際にもこの点を強調しました。つまり、日本国民は一つの民族によって国家を建設しているということです。

    わが国には天孫の民族がいます。天孫瓊々杵尊が多くの一族を率いて九州へお下りになりました。饒速日命も多くの一族とともに大和へお下りになり、素戔鳴尊も出雲へお下りになりました。これらはみな天孫民族です。そのほかに先住民族がおり、国家ができてからも、朝鮮や中国から帰化した人々が非常に多くいました。純粋な天孫民族、大和民族以外の民族は、奈良時代ごろには約三分の一ほどあったと思われます。

    それを大和民族は長い年月をかけて融合し調和させ、今日の純粋な大和民族にした。そこが日本国体の優れたところです。この点は確かに世界に比べるものがありません。古代からいろいろな民族が入ってきても、すべて大和民族に統一され、「純化」されて大和民族となっているのです。これは相当なことです。

    九州でも熊襲族は非常に大きなものでしたが、今ではみな大和民族になっています。また東北のアイヌ族も、非常に多くが大和民族になっています。まだ「純化」されていない人々が北海道に残っています。今日、四国へ行っても九州へ行っても、自分は特別な人種だと考える人は一人もいません。今日、台湾や朝鮮はわが領土となり、その人々が「純化」しつつあります。

    中には、古代は少数の民族だったから「純化」できたが、今の朝鮮の一千何百万人、台湾の三百万人を「純化」するのは不可能だ、と言う人もいます。しかし、それは見当違いの議論だと思います。それらをみな「純化」するのが日本民族であり、その特色なのです。すでに三分の一もいた異民族を「純化」しています。熊襲やアイヌも、当時は大きな民族でした。大和民族と同数まではいかなくても、かなり近い数だったに違いありません。それをみな同化したのです。

    朝鮮の一千何百万人、台湾の三百万人を、今すぐ同化することは決してできません。しかし年月をかければ、朝鮮や台湾の民族も、熊襲やアイヌなどと同じように同化する。それが大和民族の特色です。

    イギリスなどは、本国がイングランド、アイルランド、スコットランドの三つから成っていますが、今も国内の民族は異なり、民族間に区別を立てています。ヨーロッパ各国も同じです。彼らには、融合・調和し、他の民族を受け入れて同一の民族にするという大きな度量が欠けています。ひとり、わが大日本帝国の国民は、民族を融合・調和させ、純潔な大和民族にする天分を持っています。これが、わが国体の一大特色です。また、民族の統一も大きな特色です。'

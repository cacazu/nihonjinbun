    printed_page_end: '13'
  translation_ja: '神と天皇陛下とが一体であられることも、外国に見られないわが国体の特色です。天皇陛下は現津神と呼ばれ、天照大御神と一体であられるのです。

    天皇陛下を「すめみまのみこと」と申し上げます。「皇孫」と書くので孫だと考えますが、孫ではありません。古代には孫を「ヒコ」、ひ孫を「ヒヒコ」と呼びました。そこで、皇孫というのは天照大御神の御真子ということなのです。天皇陛下は天照大御神の御真子であられる、というのです。したがって歴代の天皇陛下は皇孫命、現津神であり、天照大御神と一体であられます。これが神君一体の国体です。'

    - ocr: 十四、民族統日本ハ此民族ヲ酸合調和シテ統一スルノハ先キニ述べマシタ通リデ、コノコトハ全ク上ニ萬世一糸ノ皇統ヲ頂イテ居ルカラデアリマス。デスカラ此ノ多クノ異民族ヲ集合シテ純粹ナ大和民族ニスルト云フノニ中心ガ嚴トシテ存在シテ居ルカラデアリマス。外國デハソノ中心ガ一定シテ居ラヌカラ民族ノ統一ガ出來ナイノデアリマス。今之レヲ屋子ニ例ヘテ見マス。扇子ハ要ガ大事デアリマス。要ヲナクスレバ扇子ハ壞ハレテ仕舞ヒマス。外國デハソノ要ヲ民衆ガ各々自分デ取ラウトスルノデアリマス。ソシテ自分ガ要ニナラウトスル。即チ支那邊リデハ自分ガ天子ニナラウトスルノデアリマス。今デモ支那ガアノヤウニ混亂シテ居リマスノハ、アノ中ニ銘々『王侯相何ソ種アラン」ト云フ考ヲ持ツテ居ルカラデアリマス。袁世凱モ書テ大統領デ滿足セズ、皇帝ニナツタコトハ周知ノ事實デアリマス。サウ云フ狀態デアリマスカラ支那ハ中々統一ガ出来マセン、常ニ人民ハ困苦ヲ免レナイノデアリマス。我國ニ於キマシテハ何人モ夢ニモコノ要ヲ望ムモノハアリマセン。永イ〓〓歷史ノ中ニ偶々道鏡ノヤウナモノガ出マシテモ和氣〓麻呂公ノ國體ノ精華ヲ發揮スル大人物ガ出テ『無道ノモノハ速カニ掃除スペシ」ト云フ神勅ヲ絕叫シマシテ、國體ノ不淨ヲ絨ヒ淨メルノデアリマス。コウ云フ次第デ我々國民ハ色々理想ヲ抱クノデアリマスガ政治家ガ理想ヲ抱クト云ツタラ西洋ノ政治家ナラ大統領ニナルコトヲ理想トスル、皇帝ノ位ニ就クコトヲ理想トスル、ナポレオンノ如キ、匹夫カラ起ツテ遂ニ皇帝トナツタノデアリマス。所ガ我國民ノ政治的理想ハ何ダト云ヒマスト位人臣ノ榮ヲ極メルト云フノデアリマス。何處マデ行ツテモ人臣ノ榮ヲ極ム、此ノ所ハ有難イ所デアリマス。之ガ日本ノ民族ガ統一シテソシテ此優秀ナル國体ヲ爲ス所以デアリマス。十五、金〓無缺實ニ我國ハ立派ナ國體デアリマス。如何ニ立派ナ國體デモスグ破壞セラレルヤウナモノデハ何等ノ價値ガナイ。然ルニ我國體ハ金〓無缺デアリマス。萬古ニ亘ツテ變ラナイ所ノモノデアリマス。明治初年ニ矢田ト云フ油繪ノ大家ガ、亞米利加ニ留學シマシタ。ソシテ油繪ノ〓究ヲシテ居リマスルト、亞米利加人ノ友人ガ矢田サンニ『貴方ノ國デ歷史上一番尊イ事實ハ何ンデスカ」ト即キマシタ。『ソレハ萬世一系ノ皇統デアリマス』ト答ヘマシタ。スルト『ソレハ無論ソレハ尊イコトデアリマス併シ苟クモ日本ヲ知ツテ居ルモノハ皆ソレヲ知ツテ居ルノデアリマス。カヽル世界周知ノ事實ハ尋ネマセン。ソノ外ニ歷史上デ尊イモノガアリマスガ知リマセンカ』ト云フノデス。矢田サン何ウシテモ考ヘツキマセン。外國人ガ見テソンナニ感心スルモノガアルト云フノハ何デアラウト色々考へテ見マシタガ、『私ニハ解ランカラドウゾ云ツテ下サイ』『貴方ノ國ニハ弘安ノ役ト云フコトガアルデハアリマセンカ』ト云フノデス。外國人ハ兎角サウ云フ所ニヨク氣ガツク風ガアリマス。彼ノ百戰練磨ノ蒙古兵ガ西歐羅巴ヲ征服シ、南印度ヲ征伐シ、新ニ四百餘州ヲ統一シタ、其勢ヲ以テ我日本ヲ征服シヨウト云フノデス。元ノ皇帝カラ見レバ、眇タル日本、眞ニ鎧袖一觸ト考ヘタデアリマセウ。所ガ我ガ國民ハ祖國ノ爲ニ勇戰奮圖、サスガノ蒙古ノ精銳十萬、生キテ歸ル者僅カニ三人、西洋人ガ斯ウ云フ歷史ヲ見マシタナラバ驚クノハ無理ハアリマセン。矢田サンハコノ注意ヲ受ケテ後歸朝シマシテカラ、大ニ弘安ノ役ノ宣傳ヲ致シマシタ。ソレデ今日デハ子供デモコノ國難ヲ知ツテ居リマス。實我ガ歷史ノ一大光彩デアリマス。ソレガアツテ元主モ憤慨シマシタガ、再擧モナラズ間モナク其ノ國モ亡ビマシタ。ソレカラ明起リ、明亡ビ、〓起リ〓亡ビ共間幾多ノ變遷ガアリマシテ、明治二十七年ニ至ツテ李鴻章起リ一支那ノ大英雄ヲ以テ自ラ任ジ、日本ガ輓近ノ勃興ヲ見マシテ、今ノ內ニソノ勃興ヲ抑止シナケレバ、將來東洋ニ禍根ヲ貽スノ處ガアルト考へ、自ラ結ンダ天津條約ヲ無視シ、我レト干戈相見エル事トナツタノデアリマス。而カモ連戰連敗遂ニ李鴻章彼レ自ラ馬關ニ來テ馬關條約ヲ結ンダノデアリマス。或ハ又露西亞ガ東方政策ヲ立テ、アレキシーフヲ旅順ニ派シ、朝鮮ヲ併合シ、日本ヲモ攻メ取ラウト云フヤウナ考ヘヲ起シタ玆ニ三十七、八年役ガ起リ我國ハ連戰連勝遂ニ彼ニ嬉ヲ請ハシメルニ至ツタ。斯ウ云フ工合ニシテ金〓無缺ノ帝國ハ、依然トシテ萬古ニ向ツテ金甌無缺デアル。之レ又我國体ノ偉大ナル特色デハアリマセンカ。十六、天壞無窮

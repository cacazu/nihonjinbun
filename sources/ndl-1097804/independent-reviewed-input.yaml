    url: https://dl.ndl.go.jp/pid/1097804/1/14
    printed_page: '24'
  translation_ja: '体の精華を国民に十分に理解させるよう、ご尽力いただきたいと思います。

    たとえば、先ほど述べた日本精神の秩序の観念は、国体の根底となり、国体を支える基礎です。それにもかかわらず、今日、西洋の平等思想のために、日々、月々弱くなろうとしているように見えるのは、実に憂慮に堪えません。

    まず、このような基本的な方面に努め、国民が秩序を尊重し、礼儀を重んじるようにしたいものです。一方で国体を明らかにすると同時に、もう一方では、それを着実に実行させる方法を講じることが急務だと思います。実行にあたっては、小学校などの教育方面と連絡し、青年団、処女団、成人教育など、さまざまな方面に勧めるのがよいと思います。これらの点に十分にご配慮いただき、この非常時を突破したいと考えます。

    要するに、今日は特に国体明徴が叫ばれている時代です。その本質を十分に明らかにし、わが国運の発展に貢献することが、日本国民としての本分を十分に尽くすことになると考えます。

    長時間、お聞きいただき恐縮でございます。これで私の話を終わります。'

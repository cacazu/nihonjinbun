  origin: source
  source_text: ネルソン提督トモ云ハレル一代ノ提督ノ最後ノ言葉ガアル。斯ウ云フノデス。『神ヨ、私ハ私ノ義務ヲ盡シタ」死ヌル時ニモ『神ヨ私ハ私ノ義務ヲ盡シタ』トタツタソレダケノ言葉デアル。ソレダケノ內ニ私ト云フ字ガ二ツモアリマス。日本ノ軍人ノ最後ノ言葉ハ何ンナ場合ニ於テモ『天皇陛下萬歲』『大日本帝國萬歲』、誠ニ勇壯ナ言葉デアル。私ナンテ云フコトハ眼中ニナイ、ソレガ日本精神デアリマス、サウ云フ工合ニ言葉ノ上ニ於テ簡單ナ死ヌル時ノ簡單ナ言葉デモ私ト云フ言葉ガ二ツモアル。如何ニ西洋人ハ私ト云フモノヲ重ンズル、所謂個人主義デアル。ソノ私ト云フ言葉デモ、西洋ハ單數複數二種類ダケデスガ、我ガ國語デハ、キチント上下尊卑ノ秩序ノ上カラ、私、ワタシ、ワシ、手前、此方、小生、僕ナド色々ト用ヒラレテ居リマス。又第二人稱アナタト云フノデモ、西洋デハ一般ニ『ユウ』デアリマス。總理大臣ニ向ツテモ『ユウ」先生ニ向ツテモ『ユウ」友達ニ向ツテモ、同僚ニ向ツテモ皆『ユウ』デアル。總理大臣、先生、友達ニ對シテナドハ『ユウ』デモ宜シイガ、自分ノ妻ニ『アナタ御飯ヲ早ク持ツテコイ』デハ何ウモ釣合ガトレマセン。ソレヲ向フデハ平氣デ云フノデアル。向フノ人ハソレデ不思議ニ思ハナイ。女中ニ向ツテモ、下男ニ向ツテモ、平等ニ「ユウ』デアル。所ガ日本國民ニ於テハサウ云フコトハ斷然許サレナイ。或場合ニハ貴方ト云ヒマス。或場合ニハ貴方樣、御前ト云ヒ、オ前樣ト云ヒマス。君、其方、ソチオ前.サウ云フ工合ニ對象ニ依ツテ違フ。其處ガ即チ日本國民ノ秩序ヲ重ンズル精神、又潜在精神デアリマス。日本國民ガ禮儀トカ秩序トカ、云フ風ナコトヲサマデ考ヘナイ內ニチヤントサウ云フ風ニナツテ居ル。即チ上代ニ於テ潜在的ニ日本國民ガ秩序ヲ尊重スルト云フ観念ヲ持ツテ居ツタト云フコトガワカリマス。
  source_languages:
  - ja
  source_locations:
  - source_id: ndl-1097804
    precision: page
    source_sequence: 4
    url: https://dl.ndl.go.jp/pid/1097804/1/5
    printed_page: '6'
    printed_page_end: '7'
  translation_ja: 'ネルソン提督ほどの、時代を代表する提督の最期の言葉があります。こう言ったのです。ネルソン「神よ、私は私の義務を果たした」。死ぬときにも「神よ、私は私の義務を果たした」、ただそれだけです。その中に「私」という語が二つもあります。日本の軍人の最期の言葉は、どんな場合も「天皇陛下万歳」「大日本帝国万歳」という、実に勇壮な言葉です。「私」などは眼中にない。それが日本精神です。

    このように、死ぬときの短い言葉にさえ「私」という語が二つある。西洋人はいかに「私」を重んじるか、いわゆる個人主義なのです。その「私」という語も、西洋では単数と複数の二種類だけですが、日本語では上下・尊卑の秩序に従って、「わたくし」「わたし」「わし」「手前」「こちら」「小生」「僕」など、さまざまな言い方が使われています。

    また第二人称の「あなた」も、西洋では一般に「ユー」です。総理大臣にも「ユー」、先生にも「ユー」、友人にも同僚にも、みな「ユー」です。総理大臣や先生や友人に対してならそれでもよいのですが、自分の妻に「あなた、ご飯を早く持ってこい」では、どうにも釣り合いが取れません。それを向こうでは平気で言い、不思議にも思いません。女中にも下男にも等しく「ユー」です。

    ところが日本国民には、そのようなことは決して許されません。ある場合には「あなた」、また「あなた様」「お前」「お前様」と言います。「君」「そなた」「そち」「お前」と、相手によって違います。そこに、日本国民の秩序を重んじる精神、また潜在精神があります。日本国民が礼儀や秩序についてそれほど考えていないうちから、すでにこのようになっているのです。つまり、古代から日本国民は、潜在的に秩序を尊重する観念を持っていたことが分かります。'

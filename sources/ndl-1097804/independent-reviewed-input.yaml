    corrections:
    - ocr: 人ノ心ノ誠ナリケリト仰セニナツテ居リマスガ、常ニ此誠、眞心ニ達スレバ、神ト人間トガ一体ニナリマス。其處デ我々ハ直ニ神デアルノデアリマス。即チ神ト人間トガ一体ニナルノデアリマス。本來日本國民ハ生レ乍ラノ眞心ヲ以ツテ行動シテ居ルノデアリマスデスカラ惟神コトアゲシナイノデアリマス。眞心デ活動シ、神人一體トナルノデ、其處デ神國ト云フ所ノ意義ヲ十分ニ實現スルコトニナツテ來ルノデアリマス。斯ウ云フ風ニシテ〓在精神ガ段々自覺的ニ發達シテ參ツテ、サウシテ我國ノ國休ト云フモノガ完成シテ來ルノデアリマス。四、國體ノ本義今ヤ頻リニ國体明徵ト云フコトガ繰リカヘサレテ居リマス。ガ國体トハ一体何ヲ意味スルカ、國体明徵、國体明徴ト云ツテモ國体トハ何ゾヤト云フ問題ヲ出スト、果シテ明快ナ回答ヲナシ得ルモノガ幾人アリマセウカ。此國体ト云フ言葉ニ就イテ好ク〓究シテ居レバ、天皇機關說ナント云フコトハ夢ニモ考ヘラレナイノデアリマス。ソレヲ十分辨ヘテ居ナイモノデアリマスカラサウ云フ思想ガ起ルノデアリマス。只夢中ニナツテ西洋ヲ模スルカラアヽ云フ思想ガ起ルノデアリマス。我ガ國ノ上代ニ、一日本書紀」ナドニ、國体ト云フ言葉ハ見エテ居リマスガ今日ノ意味ニハ使ハレマセンデシタ。此ノ文字ガ盛ニ用ヒラレ、ソノ意味ガ今日ノヤウニナツタノハ德川時代ニナツテカラデアリマス。殊ニ水戶ノ學者ノ會澤正志齋ト云フ人ナドノ書イタ本デハ、國体ノ思想ガ明確安當ニ用ヒラレテアリマス。ソレガ維新後ニナリマスト云フト、恐レ多クモ明治天皇ハ度々御詔勅ニコノオ言葉ヲオ川ヒニナツテ居リマス。明治二年ノ御詔勅ニ『我大八洲ノ國体ヲ創立スル」云々。ト仰セラレテ居リマス。又明治四年ノ勅論ニモ國体ナル文字ヲオ用ヒニナリ、ソレカラ明治十五年一月四日軍人ニ賜ツタ勅諭ニ於テハ、『凡七百年ノ間武家ノ政治トハナリヌ。世ノ樣ノ移リ換リテ斯ナレルハ人力モテ挽回スベキニアラズトハ云ヒ年ラ、且ハ我國且ハ我國體ニ俟ツヨリ、且ハ我祖宗ノ御制ニ背キ奉リ、淺間敷次第ナリキ」ト云フ風ニ仰セラレタ。武家ノ政治トナツタノハ且ハ我國体ニ悖リ、且ハ我祖宗ノ御制ニ背キ奉リ、淺間シキ次第ナリト御述べニナツテ居リマス。國体ト云フ言葉ハコンナニ勅語ノ中ニ、澤山用ヒラレテ居リマスガ其最モ著シイノハ御承知ノ通リ、〓育勅語ノ『國休ノ精華』ト申ス言葉デアリマス。サウ云フ風ニ國體ト云フ言葉ガ色々使ハレテ居リマスガ却々其意味ガハツキリ國民ニ意識サレマセヌ。其處デ先年帝國議會ニ於キマシテ、治安維持法案ガ議題ニナツタ時ニ、アノ第一條ニ國體及政體ト云フコトガ初ニアリマス。所ガ政體ノ字ハ削ラレテ、國體丈ケトナツタノデアリマスガ、ソノ國體ト云フ言葉ノ解釋ガ上下兩院デ色々論議セラレマシタ。其時ニ上院ニ於キマシテ、一議員ガ、司法大臣ニ對シ此治安維持法ニ於テハ國體ハ如何ナル意味ニ用ヒラレテアルノカト云フコトヲ質問致シマシタ。ソレニ對シ當時ノ司法大臣ガ明確ニ答辯シマシタノハ『此國体ノ意味ハ帝國憲法第一條ノ意味デアル」ト云フノデアリマス。此帝國憲法第一條ハ即チ『大日本帝國ハ萬世一系ノ天皇之ヲ統治ス」ト云フノデアリマス。之ハ勿論國體ノ要部ヲ爲スノデアリマスガ、併シ我々ガ國體ト云フ時ニハモウ少シ範圍ヲ廣メテ云フノデアリマス。御承知ノ通リ〓育勅語ニ於キマシテハ『克ク忠ニ克ク孝ニ億兆心ヲ一ニシテ世々厭ノ美ヲ濟セルハ此レ我國體ノ精華ニシテ』ト仰セニナツテ居ル即チ『克ク忠ニ克ク孝』所謂忠孝一致ノ精神、サウ云フ所ガ國體ノ精華ト云フ工合ニ仰セニナツテ居ル。ダカラシテ國體ト云フ言葉ハ、中々廣ク用フベキデアラウト考ヘルノデアリマス。ソレデハ何ウ云フ風ニ用ヒタラ宜シイカ。法律家等ハ一般ニ國體ハ『主權ノ所在ニヨツテ定メル國家ノ體樣』ト解釋シテ居リマス。主權ガ君主ニアルカ、人民ニアルカ、ソレニヨツテ國家ノ體樣ガ違ツテ來ル。若シ主權ガ君主ニアレバ、君主國體ト云ヒ.ソレガ人民ニアレバ民主國體ト云フノデアルト解釋シテ居リマス。所ガ他ノ學者ハ「國體ダノ政體ダノヲ論ズル必要ハナイ。主權ハ常ニ國家ニアル』ノデアル。主權ハ君主ニモナイ、人民ニモナイ、主權ハ國家ニアルト論ジテ、ソノ結果所謂君主機關說即チ天皇機關說ト云フコトヲ唱ヘテ居ル。私ハ二十餘年前カラ斯ウ云フ說ハ宜シクナイト論ジテ、本ニモ書イテ居ルガ、漸ク今日ソレガ實現シテ參ツタノハ

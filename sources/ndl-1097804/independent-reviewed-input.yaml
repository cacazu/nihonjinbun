  translation_ja: 'ということがあります。つまり、君主への忠義と国への愛情とが、同じところに帰するのです。今述べたとおり、わが国では天皇陛下が国家を体現し、国家が天皇陛下の表現であられますから、忠君と愛国は決して別のものではありません。ここが、わが国体の最も大切なところです。

    外国ではそうはいきません。たとえばフランス人は、あの世界大戦でも、議員たちはみな愛国者だと、他人からも自分からも言い、国家のために命を捧げると言っていました。そして議員たちは愛国者として最前線で活動し、名誉の戦死を遂げた者も少なくありません。ところが、その愛国者の集まり'

  source_text: 實ニ我國ハ立派ナ國體デアリマス。如何ニ立派ナ國體デモスグ破壞セラレルヤウナモノデハ何等ノ價値ガナイ。然ルニ我國體ハ金甌無缺デアリマス。萬古ニ亘ツテ變ラナイ所ノモノデアリマス。明治初年ニ矢田ト云フ油繪ノ大家ガ、亞米利加ニ留學シマシタ。ソシテ油繪ノ研究ヲシテ居リマスルト、亞米利加人ノ友人ガ矢田サンニ『貴方ノ國デ歷史上一番尊イ事實ハ何ンデスカ」ト聞キマシタ。『ソレハ萬世一系ノ皇統デアリマス』ト答ヘマシタ。スルト『ソレハ無論ソレハ尊イコトデアリマス併シ苟クモ日本ヲ知ツテ居ルモノハ皆ソレヲ知ツテ居ルノデアリマス。カヽル世界周知ノ事實ハ尋ネマセン。ソノ外ニ歷史上デ尊イモノガアリマスガ知リマセンカ』ト云フノデス。矢田サン何ウシテモ考ヘツキマセン。外國人ガ見テソンナニ感心スルモノガアルト云フノハ何デアラウト色々考へテ見マシタガ、『私ニハ解ランカラドウゾ云ツテ下サイ』『貴方ノ國ニハ弘安ノ役ト云フコトガアルデハアリマセンカ』ト云フノデス。外國人ハ兎角サウ云フ所ニヨク氣ガツク風ガアリマス。彼ノ百戰練磨ノ蒙古兵ガ西歐羅巴ヲ征服シ、南印度ヲ征伐シ、新ニ四百餘州ヲ統一シタ、其勢ヲ以テ我日本ヲ征服シヨウト云フノデス。元ノ皇帝カラ見レバ、眇タル日本、眞ニ鎧袖一觸ト考ヘタデアリマセウ。所ガ我ガ國民ハ祖國ノ爲ニ勇戰奮鬪、サスガノ蒙古ノ精銳十萬、生キテ歸ル者僅カニ三人、西洋人ガ斯ウ云フ歷史ヲ見マシタナラバ驚クノハ無理ハアリマセン。矢田サンハコノ注意ヲ受ケテ後歸朝シマシテカラ、大ニ弘安ノ役ノ宣傳ヲ致シマシタ。ソレデ今日デハ子供デモコノ國難ヲ知ツテ居リマス。實ニ我ガ歷史ノ一大光彩デアリマス。ソレガアツテ元主モ憤慨シマシタガ、再擧モナラズ間モナク其ノ國モ亡ビマシタ。ソレカラ明起リ、明亡ビ、淸起リ淸亡ビ其間幾多ノ變遷ガアリマシテ、明治二十七年ニ至ツテ李鴻章起リ一支那ノ大英雄ヲ以テ自ラ任ジ、日本ガ輓近ノ勃興ヲ見マシテ、今ノ內ニソノ勃興ヲ抑止シナケレバ、將來東洋ニ禍根ヲ貽スノ虞ガアルト考へ、自ラ結ンダ天津條約ヲ無視シ、我レト干戈相見エル事トナツタノデアリマス。而カモ連戰連敗遂ニ李鴻章彼レ自ラ馬關ニ來テ馬關條約ヲ結ンダノデアリマス。或ハ又露西亞ガ東方政策ヲ立テ、アレキシーフヲ旅順ニ派シ、朝鮮ヲ併合シ、日本ヲモ攻メ取ラウト云フヤウナ考ヘヲ起シタ玆ニ三十七、八年役ガ起リ我國ハ連戰連勝遂ニ彼ニ媾ヲ請ハシメルニ至ツタ。斯ウ云フ工合ニシテ金甌無缺ノ帝國ハ、依然トシテ萬古ニ向ツテ金甌無缺デアル。之レ又我國体ノ偉大ナル特色デハアリマセンカ。

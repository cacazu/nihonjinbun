  translation_ja: 'わが国は実に立派な国体です。しかし、どれほど立派でも、すぐに破壊されるようなら何の価値もありません。わが国体は金甌無欠、つまり欠けることのない金の器のように完全であり、永遠に変わらないものなのです。

    明治初年、矢田という油絵の大家がアメリカへ留学しました。油絵を研究していると、アメリカ人の友人が尋ねました。友人「あなたの国で、歴史上最も尊い事実は何ですか」。矢田「それは万世一系の皇統です」。友人「もちろん、それは尊いことです。しかし、少しでも日本を知る人なら誰でも知っています。そのような世界中に知られた事実を尋ねているのではありません。ほかにも歴史上尊いものがありますが、ご存じありませんか」。

    矢田さんは、どうしても思いつきませんでした。外国人がそれほど感心するものとは何だろうと、いろいろ考えてみましたが、矢田「私には分かりませんので、どうぞ教えてください」。友人「あなたの国には、弘安の役があるではありませんか」。外国人は、とかくこのような点によく気づくものです。

    百戦錬磨の蒙古兵が西ヨーロッパを征服し、南インドを征伐し、新たに四百余州を統一した。その勢いで日本を征服しようとしたのです。元の皇帝から見れば、小さな日本など一撃で倒せると思ったでしょう。ところが、わが国民は祖国のために勇敢に戦い、奮闘しました。さすがの蒙古の精鋭十万人も、生きて帰ったのはわずか三人でした。西洋人がこのような歴史を見れば、驚くのも無理はありません。

    矢田さんはこの指摘を受け、帰国してから弘安の役を大いに広めました。そのため今日では、子供でもこの国難を知っています。実に、わが歴史の大きな輝きです。このことがあって元の君主も憤慨しましたが、再び攻めることもできず、まもなくその国も滅びました。その後、明が起こって滅び、清が起こって滅びるという多くの変遷がありました。

    明治二十七年になると李鴻章が現れ、中国の大英雄をもって自任し、近年の日本の勃興を見て、今のうちに抑えなければ将来の東洋に災いの根を残すおそれがある、と考えました。そして自ら結んだ天津条約を無視し、わが国と戦争をすることになったのです。ところが連戦連敗し、ついに李鴻章自身が馬関へ来て、馬関条約を結びました。

    またロシアは東方政策を立て、アレキシーフを旅順へ派遣し、朝鮮を併合し、日本まで攻め取ろうと考えました。ここに明治三十七、八年の戦争が起こり、わが国は連戦連勝して、ついに相手に講和を求めさせました。このように、金甌無欠の帝国は、永遠に向かって、依然として金甌無欠なのです。これも、わが国体の偉大な特色ではありませんか。'

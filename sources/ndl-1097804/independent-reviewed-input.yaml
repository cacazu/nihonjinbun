  source_text: 之レモ世間デヨク云ハレテ居ル所デアリマスガ、我國ハ皇室ガ先デアラセラレル。サウシテ國民ガ後ニ成立シタノデアリマス。天孫ガ降臨遊バシタ時ハ彼方此方ニ酋長ノヤウナ者、其ノ他先住民族ハ居タガ、何等國家等ト認ムベキモノガナカツタノデアリマス。サウ云フ所へ天孫ガ降臨遊バシテ此處ニ國家ヲ建テラレ、國民ガ出來タノデアリマス。外國ハ皆國民ガ先ニアツテ、ソレガ國家ヲ建設スルコトニナツタノデアリマス。露西亞モ今カラ三百年バカリ前ニミカエル、ロマノフト云フノガ出テ露西亞帝國ヲ建テマシタ。ロマノフ王朝ト云フノガソレデアリマスガ、ソレヨリ前ニ露西亞國民ガアツテ國家ヲナシテ居タノデアリマス。今申シタ亞米利加ノ如キモ、亞米利加人ト云フ人民ガ居ツタ。即チ歐羅巴カラ澤山移住シタ者ガ居リマシテ、ソシテソレガ英吉利ト戰ヒ、遂ニワシントンヲ大統領ニ選擧シテ國家ヲ建テタノデアリマス。ダカラ外國ノハ一般ニ民先君後デアリマス。恰度我國ト反對デアリマス。
  source_languages:
  - ja
  source_locations:
  - source_id: ndl-1097804
    precision: page
    source_sequence: 7
    url: https://dl.ndl.go.jp/pid/1097804/1/8
    printed_page: '12'
    printed_page_end: '13'
  translation_ja: 'これも世間でよく言われますが、わが国では皇室が先にあられ、その後に国民が成立しました。天孫が降臨されたとき、各地に酋長のような者や先住民族はいましたが、国家と認めるべきものは何もありませんでした。そのような所へ天孫が降臨して国家を建てられ、国民ができたのです。

    外国は、みな国民が先にあって、その国民が国家を建設しました。ロシアでも、今から三百年ほど前にミハイル・ロマノフが現れてロシア帝国を建てました。これがロマノフ王朝ですが、それ以前にロシア国民がいて、国家をつくっていました。

    今申し上げたアメリカでも、アメリカ人という人民がいました。つまり、ヨーロッパから移住してきた多くの人々がいて、彼らがイギリスと戦い、ついにワシントンを大統領に選んで国家を建てたのです。ですから、外国では一般に人民が先で君主が後です。ちょうどわが国と反対なのです。'
  translation_status: draft
  source_alignment:
  - source_id: ndl-1097804
    original_unit_id: 1097804_0000008.txt

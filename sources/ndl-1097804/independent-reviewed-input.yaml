- id: nsk-p0006-001
  section_id: main-text
  kind: paragraph
  origin: source
  source_text: 人ノ心ノ誠ナリケリト仰セニナツテ居リマスガ、常ニ此誠、眞心ニ達スレバ、神ト人間トガ一体ニナリマス。其處デ我々ハ直ニ神デアルノデアリマス。即チ神ト人間トガ一体ニナルノデアリマス。本來日本國民ハ生レ乍ラノ眞心ヲ以ツテ行動シテ居ルノデアリマスデスカラ惟神コトアゲシナイノデアリマス。眞心デ活動シ、神人一體トナルノデ、其處デ神國ト云フ所ノ意義ヲ十分ニ實現スルコトニナツテ來ルノデアリマス。斯ウ云フ風ニシテ潜在精神ガ段々自覺的ニ發達シテ參ツテ、サウシテ我國ノ國体ト云フモノガ完成シテ來ルノデアリマス。
  source_languages:
  - ja
  source_locations:
  - source_id: ndl-1097804
    precision: page
    source_sequence: 5
    url: https://dl.ndl.go.jp/pid/1097804/1/6
    printed_page: '8'
    printed_page_end: '9'
  translation_ja: '「人の心の誠なのだ」

    とあります。この誠、真心に達すれば、神と人間が一体になります。そこで私たちは、そのまま神なのです。つまり、神と人間が一体になるのです。

    もともと日本国民は、生まれながらの真心によって行動しています。だからこそ、神の道のままにあって、言葉で論じ立てないのです。真心で活動し、神と人とが一体になる。そこに神国という意味が十分に実現するようになります。このように潜在精神が次第に自覚的に発達して、わが国の国体が完成してくるのです。'

  source_text: マス。即チ國憲、國法ト申スモノハ、直チニ眞心デアリマス。ソシテ天皇陛下ノ大御心ニ通ズル所ノモノデアリマス。サウ云フ次第デ日本國民ハ眞心即チ誠ト申スモノデ陛下ノ大御心ノ中ニ歸一シ奉ルノデアリマス。而シテコノ、陛下ノ大御心ハ即チ天照大御神樣ノ大御心デアラセラレルノデアリマス。コヽガ惟神デアリマシテ、カヽル見地カラ君民同心ト申スコトガ、申サレルノデアリマス。其處デ

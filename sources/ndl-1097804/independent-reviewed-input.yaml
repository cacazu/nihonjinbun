  source_text: ノ佛蘭西ノ議會ガ自分ノ國王デアル所ノルイ十六世ニ對シ國民ニ對スル叛逆者トシマシテ、色々ト或處罰法ヲ考究シ、遂ニソノ議會ニ於テ七百二十一人ノ出席デ、二十六票ノ多數ヲ以テ、國王死刑ノ議案ヲ可决シタノデアリマス。愛國者ヲ以テ成立ツテ居ル議會ガ、其君主ヲ死刑ニスル議案ヲ可决シテ居ルノデハアリマセンカ。即チ彼等ニ於テハ忠君ト云フヤウナ考ヘガナイノデアリマス。亞米利加人ナドニモ、忠君ノ考ハ全クアリマセン。ソレデ我國体ノ著シイ特色ハ忠君愛國ノ其歸ヲ同ジクスルコトデアリマス、ソレカラ其次ハ

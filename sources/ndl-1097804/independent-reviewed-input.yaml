  source_text: 即チ陛下ト國民トガ同心デアルト云フノハ何ウ云フコトデアルカト申シマスト、一體我々ニハ先キニ中シタ所ノ眞心ト云フモノガアリマス。此眞心ト云フモノニヨツテ我々ハ行動スレバ間違ヒハナイノデアリマス。世ノ中ノ闇黑ニ處シテ、常ニ我々ヲ指導スルモノハコノ眞心デアリマス。眞心ハ我々ノ根本精神デアリマス。此日本國民ノ眞心ト云フモノヲ綜合シ、日本國民全体ノ眞心ヲ一ツニ綜合サレタノガ天皇陛下ノ大御心デアラセラレマス。天皇陛下ノ大御心ハ國民ノ眞心ノ綜合デアラレマス。從ツテ我々ノ眞心ト云フモノハ天皇陛下ノ大御心ニ通ズル所ノモノデアリマス。即チ目ニ見エヌ神ノ心ニ通フコソ人ノ心ノマコトナリケリトアリマスル通リデアリマス。處デコノ天皇陛下ノ大御心ハ何ニ依ツテ現ハレルカト申シマスルト國憲、國法トナツテ現ハレルノデアリマス。此國憲、國法ヲ遵守致シマスルノハ、天皇陛下ノ大御心ヲ奉戴スル所以デアリマス。其國憲、國法ニハ何ウ云フコトガ書イテアリマスカ、斯ウ考ヘテ見マスト云フト、例ヘバ憲法ニハ人ノ信書ノ秘密ヲアバク、即チ信書ヲ開ケテ見ルト云フコトハ出来ナイト云フコトガアリマス。所ガサウ云フコトハ憲法ヲ見マセンデモ、我眞心ニ聞イテ見マスルト直チニ惡イト云フコトガハツキリワカリ
  source_languages:
  - ja
  source_locations:

  source_text: 即チ忠君愛國ト云フ事ガ、其歸ヲ同ジクスルト云フ事ニナリマス。今申シタ通リ我國ニ於テハ天皇陛下ガ即チ國家ヲ表現シテオイデニナル。國家ガ即チ天皇陛下ノ表現デアラセラレルノデアリマスカラ、忠君愛國ト云フコトハ、决シテ別物デハナイノデアリマス。此所ハ我國体ノ最モ大切ナ所デアリマス。外國デハソレハサウハ行キマセヌ。佛蘭西人等ノアノ世界戰爭ニ於イテモ、佛蘭西ノ議員ハ皆愛國者デアルト、人モ自ラモ愛國者ト稱シテ國家ノ爲メニ生命ヲ捧ゲルト稱シテ居リマス。ソシテソノ議員ガ愛國者トシテ、第一線ニ活動シマシテ、名譽ノ戰死ヲ遂ゲタモノモ少クナイノデアリマス。而カモ其愛國者ノ集リ

  "translation_ja": |-
    王、ブランシュ。
    王はブランシュと二人になると、顔を隠すヴェールを上げる。

    王
    ブランシュ！

    ブランシュ
    ゴーシェ・マイエ！　ああ！

    王（大笑いして）
    貴族の名誉にかけて！
    間違いだろうと、わざとだろうと、このいたずらは大歓迎だ。
    何ということだ、私の美女、私のブランシュ、恋人よ、
    この腕へおいで！

    ブランシュ（後ずさって）
    王様！　王様！　離してください、陛下。
    ああ、もう、どう話せばいいのか、何と言えばいいのか……
    ゴーシェ・マイエ様……違う、あなたは王様……

    再びひざまずく。

    ああ、どなたであっても、私を憐れんでください。

    王
    憐れめだって、ブランシュ！　こんなに愛している私が！
    ゴーシェの言ったことは、フランソワも変わらず言う。
    あなたは私を愛し、私はあなたを愛する。二人とも幸せだ！
    王だからといって、恋人として悪くはならない。
    かわいい人、私を町人か、書生か、もっと下と思っていたのだね。
    たまたま少しよい生まれで、
    王であるからといって、それだけで
    突然、私をひどく嫌わなくてもよいではないか！
    平民である幸運には恵まれなかったが、それが何だ？

    ブランシュ（独白）
    あんなに笑っている！　神様、死んでしまいたい！

    王（微笑み、いよいよ笑いながら）
    ああ、宴、遊び、貴婦人、馬上試合、
    夕暮れの森の奥での、甘い恋の語らい、
    夜が翼で覆ってくれる、数々の楽しみ。
    それが、私の未来と結ばれる、あなたの未来だ！
    恋人同士、幸せな二人、夫婦になろう！
    いつかは年を取る。人生とは、ここだけの話、
    歳月がずたずたにしても、ところどころに
    幾瞬かの恋がきらめく布なのだ。
    その金片がなければ、ただの悲しいぼろ切れ！
    ブランシュ、私はよく、こういうことを考えた。
    そして知恵とはこうだ。父なる神を敬い、
    愛し、楽しみ、うまいものを食べよう！

    ブランシュ（打ちのめされ、後ずさって）
    ああ、私の夢！　思っていた方とは、何て違うの！

    王
    何だ、震えている恋人だと思っていたのか？
    うだつの上がらない学者、陰気で情熱もない、
    あの手の馬鹿の一人と？
    哀れっぽい顔で溜息さえつけば、
    すべての女も、魅せられた心も、
    自分の前へ降参すると考える連中に？

    ブランシュ（押し返して）
    離して！　ああ、私は不幸だわ！

    王
    私たちが何者か、わかるか？
    フランス、全国民、千五百万の人間、
    富、恐怖、楽しみ、抑えも掟もない権力、
    すべては私のため、私のものだ。私は王なのだ！
    ならば、あなたはその支配者を支配する女になれる。
    ブランシュ、私は王、あなたは女王になる！

    ブランシュ
    女王！　では、奥様は？

    王（笑って）
    何という無邪気さ、何という貞淑さ！
    妻は愛人ではないのだよ、わかるかい！

    ブランシュ
    あなたの愛人！　いや！　何て恥ずかしい！

    王
    気位が高いね！

    ブランシュ
    私はあなたのものではないわ。父の娘です！

    王
    父だと！　私の道化、私の馬鹿、私のトリブレ！
    あなたの父は私のものだ。好きなようにする！
    私が望めば、あいつも望む！

    ブランシュ（顔を手に埋め、激しく泣いて）
    神様、かわいそうなお父様！
    何もかも、あなたのものなの？

    すすり泣く。王は慰めようと足元へ身を投げる。

    王（情を込めた声で）
    ブランシュ、ああ、こんなに大切な人なのに！
    もう泣かないで！　この胸へおいで。

    ブランシュ（抵抗して）
    決していや！

    王（優しく）
    まだ、愛していると、もう一度言ってくれないのか。

    ブランシュ
    ああ、もう終わりです！

    王
    知らずに傷つけてしまった。
    捨てられた人のように、泣かないでおくれ。
    その目にこんな涙を流させるくらいなら、
    私は死んだほうがよい、ブランシュ！　それとも
    王国でも領地でも、勇気も騎士道もない王と
    呼ばれたほうがよい！
    女を泣かせる王！　ああ、なんという卑怯者だ！

    ブランシュ（途方に暮れ、泣きながら）
    ねえ、みんなただの戯れなのね？
    あなたが王様でも、私には父がいるの。泣いているわ。
    そばへ帰らせて。私の住まいは
    コセ邸の向かい。ご存じのはずだけれど。
    ああ、あなたはいったい誰？　もう何もわからない。
    あの人たちは、浮かれた叫びを上げて私を連れ去った！
    何もかも夢のように、頭の中で入り混じっている！

    泣いて。

    あんなに優しいと思ったあなたを、
    今も愛しているかさえ、もうわからない！

    恐怖に後ずさって。

    あなたが王！　あなたが怖い！

    王（抱こうとして）
    私が怖いのか、意地悪な人！

    ブランシュ（押し返して）
    ああ、離して！

    王（いっそう強く抱いて）
    何だって？
    許しの接吻を一つ！

    ブランシュ（身をよじって）
    いや！

    王（笑い、独白）
    何と変わった娘だ！

    ブランシュ（腕から逃れて）
    離して！　あの戸！

    開いている王の寝室の戸を見つけ、飛び込み、勢いよく閉める。

    王（帯から小さな金の鍵を出して）
    おや、鍵はこちらが持っている。

    鍵を開け、勢いよく戸を押して入り、後ろ手に閉める。

    マロ（少し前から奥の戸口で様子を見ていた。笑う）
    王の寝室へ逃げ込むとは！
    ああ、かわいそうな娘！

    ゴルドを呼ぶ。

    おい、伯爵。

  "source_text": "[2] La confiance de l'auteur dans le résultat de la lecture est telle, qu'il croit à peine nécessaire de faire remarquer que sa pièce est imprimée telle qu'il l'a faite, et non telle qu'on l'a jouée, c'est-à-dire qu'elle contient un assez grand nombre de détails que le livre imprimé comporte, et qu'il avait retranchés pour les susceptibilités de la scène. Ainsi, par exemple, le jour de la représentation, au lieu de ces vers:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 108
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/div[2]/ol[1]/li[2]/p[1]"
  "translation_ja": "[2] 読めばどう受け取られるか、作者は強く信じているので、戯曲が上演された形ではなく、執筆したとおりに印刷されていることを、わざわざ指摘する必要も、ほとんど感じない。つまり、印刷された本なら許されるが、舞台の繊細な感受性に配慮して削っておいた細部も、相当数収められている。たとえば上演の日には、次の詩句の代わりに、"
  "translation_status": "reviewed"

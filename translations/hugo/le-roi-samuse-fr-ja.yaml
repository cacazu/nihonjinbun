  "translation_ja": |-
    トリブレ、サルタバディル。

    サルタバディル
    ふう、重い。旦那、少しのあいだ手伝ってください。

    激しい喜びに身を震わせるトリブレが手伝い、死体の入っていそうな茶色い長袋を、舞台前方へ運ぶ。

    あんたの相手は、この袋の中です。

    トリブレ
    見せろ！　何という喜び！
    灯りを！

    サルタバディル
    とんでもない！

    トリブレ
    誰に見られるのが怖い？

    サルタバディル
    巡回の弓兵と夜警ですよ。
    畜生、灯りは駄目だ！　音だけでも十分だ！
    金を！

    トリブレ（財布を渡して）
    ほら！

    相手が金を数える間、地面の袋を調べる。

    憎しみの中にも、幸福はあるのだな！

    サルタバディル
    セーヌへ投げ込むのを、少し手伝いましょうか？

    トリブレ
    一人で十分だ。

    サルタバディル（なおも）
    二人なら早く済む。

    トリブレ
    葬る敵は、重くない。

    サルタバディル
    セーヌへ葬るのでしょう？　まあ旦那、お好きなように！

    欄干の一箇所へ行く。

    そこへは投げないでください。場所が悪い。

    欄干の崩れたところを示す。

    ここなら深い。急いでください。それじゃ、お休み。

    家へ入り、戸を閉める。

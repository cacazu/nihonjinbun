  "translation_ja": |-
    トリブレ、サルタバディル。場面の一部では、舞台奥にピエンヌ氏とゴルド氏。
    道化の身につける物を一切着けず、外套にくるまったトリブレが通りに現れ、塀の戸へ向かう。黒い服に、剣のため裾の持ち上がった外套を着た男が、後をつける。

    トリブレ（考え込みながら）
    あの老人が、俺を呪った！

    男（一礼して）
    旦那……

    トリブレ（不機嫌に振り返って）
    ああ！

    ポケットを探って。

    何も持っていないよ。

    男
    何もねだってやしませんよ、旦那。とんでもない！

    トリブレ（放っておいて立ち去れと合図して）
    わかったよ！

    ピエンヌとゴルドが入り、奥で立ち止まって様子をうかがう。

    男（一礼して）
    見当違いです、旦那。俺は剣で身を立てる男です。

    トリブレ（後ずさって）
    追い剝ぎか？

    男（猫なで声で近づいて）
    何かお悩みのご様子ですね。
    毎晩この辺りを歩いておいでだ。
    女を見張っていらっしゃる顔だ！

    トリブレ（独白）
    まずい！

    声に出して。

    自分の用を他人に話す気はない。

    通り過ぎようとするが、男が引き止める。

    男
    あなたのためを思って、お節介を焼いているんです。
    俺のことがわかれば、もっと親切にしてくださるはずだ。

    近づいて。

    奥方へ、どこかの色男が流し目を送り、
    嫉妬なさっているのでは？

    トリブレ（苛立って）
    結局、何が言いたい？

    男（愛想よく笑い、小声で早口に）
    少しばかりのお心付けで、そいつを殺して差し上げますよ。

    トリブレ（ほっとして）
    ああ、そいつは結構だ！

    男
    旦那、これでおわかりでしょう。俺は堅気の人間です。

    トリブレ
    これは驚いた！

    男
    後をつけるのも、よいお役に立つためでさ。

    トリブレ
    なるほど、役に立つ男だ！

    男（慎ましく）
    この町のご婦人方の名誉の番人です。

    トリブレ
    色男を一人殺すのに、いくら取る？

    男
    殺す色男次第です。こちらの腕前にもよります。

    トリブレ
    大貴族を片づけるなら？

    男
    ああ、それは！
    こっちの腹へ剣を食らう危険が、いくつもある。
    あの方々は武装しています。身を危険にさらすわけで、
    大貴族は高くつきます。

    トリブレ
    大貴族は高くつく！
    まさか町人同士でも、
    金を出して殺し合ったりするのか？

    男（笑って）
    ところが、やり始めていますよ！
    まあ贅沢なんです。贅沢ですからね、
    たいていは育ちのよい方々に限られる。
    それでも、大金を払って貴族ぶりたい下賤な者もいて、
    仕事を頼んでくる。
    ああいう連中は気の毒ですがね。
    代金は半分を前金、半分を後で。

    トリブレ（首を振って）
    だが、絞首台や処刑の危険はあるだろう……

    男（笑って）
    いえいえ、警察には口銭を納めています。

    トリブレ
    一人につき、いくらというわけか？

    男（うなずいて）
    ただし……何と言いますかね、
    その、殺したのが……王様でなければ！

    トリブレ
    それで、どうやるんだ？

    男
    旦那、お望み次第で、出張でも、自宅でも。

    トリブレ
    礼儀正しいやり方だね。

    男
    出張には、よく尖った刺突剣を使います。
    晩に相手を待ち伏せて……

    トリブレ
    家ではどうやる？

    男
    俺にはマグロンヌという妹がいましてね。たいそう美しい娘で、
    通りで踊りを踊り、可愛いと評判です。
    そいつがある晩、色男をうちへ誘い込み……

    トリブレ
    なるほど。

    男
    ね、音も立てずに済むでしょう。
    行儀がいいんです。旦那、ぜひご贔屓に。
    ご満足いただけますよ。店を構えるでもなく、
    騒ぎを起こすでもない。ことに俺は、
    窮屈な胴着に短剣を忍ばせ、ちょっとした仕事に
    十人も群れて出かける連中とは違う。
    剣と同じくらい肝っ玉の短い、あんな山賊どもとはね。

    外套の下から、途方もなく長い剣を抜く。

    これが俺の商売道具です。

    トリブレは恐れて後ずさる。

    お役に立ちますよ。

    トリブレ（驚いて剣を眺め）
    なるほど！
    ありがとう。今のところは、何も用はない。

    男（剣を鞘へ戻して）
    それは残念。俺に会いたくなったら、
    毎日正午、メーヌ邸の前を歩いています。
    名はサルタバディル。

    トリブレ
    ジプシーか？

    男（一礼して）
    それに、ブルゴーニュ生まれで。

    ゴルド（奥で手帳に書きつけ、ピエンヌに小声で）
    ありがたい男だ。名前を控えておこう。

    男（トリブレに）
    旦那、どうか俺を悪く思わないでください。

    トリブレ
    思わないとも。何だって、生業は必要だからな！

    男
    物乞いだの、怠け者だの、
    乞食にでもならないかぎりね。俺には子供が四人います。

    トリブレ
    そいつらを、もう育てません、というわけにもいくまい。

    帰すようにして。

    どうか、お達者で！

    ピエンヌ（奥で、トリブレを指し、ゴルドに）
    まだ明るい。見つかりそうで心配だ。

    二人は退場。

    トリブレ（男に）
    ではな！

    男（一礼して）
    さようなら。何なりと、お申しつけを。

    退場。

    トリブレ（去っていく男を見て）
    俺たちは、二人とも同じ高さにいる。
    鋭い舌と、尖った刃。
    俺は笑う男、あいつは殺す男だ。

  "translation_ja": |-
    トリブレ、ブランシュ、のちにベラルド夫人。

    トリブレ
    わが娘！

    夢中で娘を胸に抱きしめる。

    ああ、腕を父さんの首に回しておくれ！
    この胸に！　お前のそばでは、すべてが微笑み、重荷は何もない。
    父さんは幸せだ。のびのびと息ができる！

    うっとりと娘を見つめる。

    毎日きれいになる！　足りないものはないか、ねえ？
    ここは居心地がよいか？　ブランシュ、しっかり接吻しておくれ！

    ブランシュ（父の腕の中で）
    お父様は、何てお優しいの！

    トリブレ（腰を下ろして）
    いや、お前を愛している、それだけだ。
    お前は父さんの命、父さんの血そのものではないか。
    お前がいなかったら、どうすればよいのだろう。
    ああ、神様！

    ブランシュ（父の額に手を置いて）
    溜息をついていらっしゃる。何か内緒のお悩みがあるのね？
    この、つまらない娘に話してください。
    ああ、私、自分の家族がどんな人たちなのかも知らないの。

    トリブレ
    お前には、ほかに家族はいない。

    ブランシュ
    お父様のお名前も知らないわ。

    トリブレ
    名前が何だというのだ？

    ブランシュ
    私の育った小さな町、シノンのご近所の人たちは、
    お父様がいらっしゃるまで、私を孤児だと思っていました。

    トリブレ
    あそこに置いておけばよかった。そのほうが用心深かった。
    だが、あんな暮らしはもう続けられなかった。
    お前が必要だった。父さんを愛してくれる心が必要だったのだ。

    また娘を抱きしめる。

    ブランシュ
    ご自分のことを話したくないのなら……

    トリブレ
    決して外へ出てはいけない！

    ブランシュ
    ここに来て二月、
    出かけたのは、教会へ行った八回だけです。

    トリブレ
    よし。

    ブランシュ
    優しいお父様、せめて母のことを聞かせて！

    トリブレ
    ああ、苦しい思いを呼び覚まさないでおくれ。
    かつて、一人の女に出会ったことを思い出させないでおくれ。
    お前がここにいなければ、夢だったと言うところだ。
    たいていの女とは違う人だった。
    魂と魂を結ぶものなど何もないこの世で、
    一人ぼっちで、体も不自由で、貧しく、嫌われた父さんを見て、
    その惨めさと歪んだ姿ゆえに、愛してくれた。
    母さんは死んだ。あの一途な愛の、
    天使のような秘密を墓へ持っていった。
    稲妻のように父さんの上を走り去った、あの愛。
    父さんの地獄へ差し込んだ、天国の光！
    いつも私たちを迎えようと待っている土が、
    父さんの頭を休ませてくれた、あの胸に、軽くありますように！
    残されたのは、お前だけだ！

    天を見上げて。

    それでも、神よ、ありがとうございます！

    泣いて、両手に額を隠す。

    ブランシュ
    どんなにおつらいのでしょう！　そんなふうにお泣きになるのを、
    私、見ていられない。胸が張り裂けるわ！

    トリブレ
    では、父さんの笑うところを見たら、何と言うだろうな？

    ブランシュ
    お父様、どうなさったの？　お名前を教えて。
    ああ、悲しみを何もかも、私の胸へ注いでください！

    トリブレ
    いや。名前を言って、何になる？　父さんはお前の父親だ。
    いいか、ここを出れば、人は父さんを恐れているかもしれない。
    わからないが、ある者は蔑み、ある者は呪う。
    名前を教えたとして、お前はそれをどうする？
    せめてここでは、お前の前では、
    すべてが無垢な、この世でただ一つの片隅では、
    ただの父親でいたい。敬われる父親、
    聖く、尊く、神聖なものでありたいのだ！

    ブランシュ
    お父様！

    トリブレ（激しく抱きしめて）
    ほかに父さんへ応えてくれる心があるか？
    この世で憎むすべてのものの分まで、お前を愛している！
    隣にお座り。さあ、その話をしよう。
    言っておくれ、父さんが好きかい？
    こうして一緒にいて、お前の手を両手で包んでいるのに、
    なぜほかの話をしなければならない？
    わが娘、天が父さんに許してくれた、ただ一つの幸福よ。
    ほかの者には親戚、兄弟、友、
    妻、夫、家臣、ずらりと並ぶ祖先や縁者、
    何人もの子供、ほかにもいろいろあるだろう。
    父さんにはお前だけだ！　ほかの者は金持ちだが、
    父さんの宝も財産も、お前一人。
    ほかの者は神を信じる。父さんはお前の心だけを信じる！
    ほかの者には若さと女の愛があり、
    誇り、輝き、優美、健康がある。
    皆美しい。だが父さんには、お前の美しさしかない！
    いとしい子！　父さんの町、国、家族、
    妻、母、妹、娘、
    幸福、富、信仰、掟、
    世界はお前だ。いつもお前、ただお前だけだ！
    ほかのどちらへ向いても、この哀れな心は傷つけられる。
    もし、お前を失ったら！……いや、そんなことは
    一瞬だって考えるのに耐えられない！
    少し笑っておくれ。お前の笑顔は愛らしい。
    そう、まったく母さんだ。母さんも、それほど美しかった。
    お前もよく、母さんのように額へ手をやる。
    拭うようにね。清らかな心には、
    無垢そのものの額と、青空のような目が必要なのだ。
    お前は天使の炎で、父さんを照らしてくれる。
    その美しい体を透かして、父さんの魂はお前の魂を見る。
    目を閉じても同じだ、お前が見える。
    父さんの昼の光は、お前から来る。ときには
    目が見えず、深い闇に瞳を覆われたらと思う。
    この世に、お前以外の太陽を持たずに済むように！

    ブランシュ
    ああ、お父様を幸せにして差し上げたい！

    トリブレ
    誰を、父さんを？
    ここでは幸せだよ。娘よ、お前が見えるだけで、
    心がとろけてしまう。

    笑いながら娘の髪を撫でる。

    ああ、美しい黒髪！　小さいときは金髪だったのに。
    誰が信じるだろう！

    ブランシュ（甘える様子で）
    いつか、夜の消灯の鐘が鳴る前に、
    少し外へ出て、パリを見てみたいの。

    トリブレ（激しく）
    決して、決して駄目だ！　ベラルド夫人と、
    外へ出たことなどないだろうな？

    ブランシュ（震えて）
    ありません。

    トリブレ
    気をつけるんだ！

    ブランシュ
    教会へしか行きません。

    トリブレ（独白）
    ああ、見られる！　後をつけられる！
    ひょっとすれば、さらわれる！
    道化の娘など、辱めたところで、
    ただ笑って済まされるのだ！　ああ！

    声に出して。

    もう一度頼む。ここに閉じこもっていておくれ！
    この子よ、パリの空気が女にどれほど悪いか、
    放蕩者がどれほど町じゅうを走り回っているか、
    知っていたなら！　とりわけ貴族たちは……

    天を仰いで。

    神よ、この隠れ家で、御目の下に育ててください。
    ほかの花を萎らす悲しみや嵐の風からお守りください。
    夢の中でさえ、不浄な息に触れさせないでください。
    不幸な父が、休戦のひとときに、
    守られた香りを吸えるように。
    この、優美と純潔の薔薇を！

    両手に顔を隠し、泣く。

    ブランシュ
    もう外へ出たいとは言いません。だから、お願い、
    そんなふうに泣かないで！

    トリブレ
    いや、これで気が休まる。
    この前の晩には、あんなに笑ったからな。

    立ち上がって。

    だが、自分の身を忘れすぎた。
    ブランシュ、また首輪をつけに戻る時刻だ。
    さようなら。

    日が暮れていく。

    ブランシュ（父に接吻して）
    すぐ帰っていらっしゃる？　ねえ？

    トリブレ
    たぶんな。
    かわいそうな子、父さんは自分の自由にならないのだ。

    呼ぶ。

    ベラルド夫人！

    年老いた付添い女が、家の戸口に現れる。

    ベラルド
    何でしょう、旦那様。

    トリブレ
    私が来るとき、入るところを誰にも見られていないね？

    ベラルド
    大丈夫でしょう。こんなに人けがないのですもの！

    ほぼ夜になる。塀の向こうの通りに、地味な暗い色の服で変装した王が現れる。塀の高さと、閉じた戸を調べ、苛立ちと落胆の様子を示す。

    トリブレ（ブランシュを抱いて）
    さようなら、いとしい娘！

    ベラルドに。

    河岸のほうの戸も、閉めてあるね？

    ベラルドはうなずく。

    サン＝ジェルマンの裏に、もっとひっそりした家を知っている。
    明日、見てこよう。

    ブランシュ
    お父様、私はこの家が好き。露台から庭が見えるから。

    トリブレ
    頼むから、あそこへは上がらないでおくれ！

    耳を澄ます。

    外を誰か歩いていないか？

    庭の戸へ行き、開けて、不安そうに通りを見る。王は戸の近くの窪みに隠れる。トリブレは戸を少し開けたままにする。

    ブランシュ（露台を指して）
    まあ、晩にあそこで風に当たることもできないの？

    トリブレ（戻ってきて）
    気をつけるんだ。あそこなら見えてしまう。

    背を向けている隙に、王は半開きの戸から庭へ忍び込み、大きな木の陰に隠れる。

    それから、窓辺に灯りを置いては駄目だ。

    ベラルド（手を合わせて）
    いったい、どうやって男がここへ入ってこられるとお思いです？

    振り返って木の陰の王を見つけ、呆気に取られて言葉を切る。叫ぼうと口を開けた瞬間、王が胸元へ財布を投げ込む。女は受け取り、手で重さを量ると、黙ってしまう。

    ブランシュ（提灯を持って露台を調べに行ったトリブレに）
    何という用心！　お父様、教えて。
    そんなに何が怖いの？

    トリブレ
    自分には何も、お前には何もかもだ！

    もう一度、娘を抱きしめる。

    ブランシュ、娘よ、さようなら！

    ベラルドの提灯の光が、トリブレとブランシュを照らす。

    王（木の陰で独白）
    トリブレ！

    笑う。

    何とまあ！
    トリブレの娘か！　こいつは傑作だ！

    トリブレ（出かけようとして引き返す）
    そうだ、お祈りに教会へ行くとき、
    誰かに後をつけられたりは？

    ブランシュは困って目を伏せる。

    ベラルド
    一度も！

    トリブレ
    後をつけられたら、大声を上げるんだよ。

    ベラルド
    ええ、助けを呼びますとも！

    トリブレ
    それから、誰が叩いても決して戸を開けないこと。

    ベラルド（トリブレの用心に輪をかけるように）
    王様でいらしても！

    トリブレ
    王なら、なおさらだ！

    もう一度娘に接吻し、念入りに戸を閉めて出ていく。

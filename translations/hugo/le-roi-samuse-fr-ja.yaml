  "translation_ja": |-
    前場の人々、王、トリブレ。

    トリブレ（入ってきて、すでに始まった会話を続けるように）
    宮廷に学者ですって！　世にも珍しい化け物だ！

    王
    ナヴァールの姉を説得してくれ。
    私の周りに学者を集めたいと言うのだ。

    トリブレ
    ここだけの話、これだけはお認めください。
    俺は陛下ほど飲んでいない。
    つまり、物事の原因から結果まで正しく判断するには、
    俺には陛下より、ずっと大きな強みがある。いや、二つだ。
    酔っていないことと、王ではないことです。
    学者など置くくらいなら、ここへ疫病や熱病、その他もろもろを！

    王
    ずいぶん無造作な忠告だ。姉は学者を集めたいと言う！

    トリブレ
    姉君ともあろう方が、ひどいことを。
    どんな獣も、貪欲な烏も、狼も、梟も、
    雛鵞鳥も、牛も、詩人さえも、
    マホメット教徒も、神学者も、
    フランドルの参事会員も、熊も、犬も、
    学者と呼ばれる、あの荷鞍を載せた驢馬ほど、
    醜く、毛むくじゃらで、見るも嫌な姿で、
    途方もない馬鹿げた話を鎧にし、
    逆毛立ち、汚らしく、空威張りしたものはいませんよ！
    陛下には、楽しみや権力や征服が足りないのですか。
    宴を香らせる、花盛りの女たちが足りないのですか。

    王
    うむ……姉のマルグリットが、ある晩そっと言ったのだ。
    女だけでいつまでも満足はできまい、
    いずれ退屈するようになったら、と。

    トリブレ
    前代未聞の処方だ！
    退屈している人に学者を勧めるとは！
    マルグリット様は、陛下も認めるでしょうが、
    いつも最も絶望的な手をお選びになる。

    王
    では学者はよそう。だが、詩人を五、六人……

    トリブレ
    陛下のお立場なら、いつも韻まみれの詩人一人を、
    ベルゼブブが濡れた聖水撒きを怖がる以上に怖がりますね。

    王
    五、六人……

    トリブレ
    五、六人！　馬屋一軒分だ！
    学士院だ、動物小屋だ！

    マロを指して。

    ここにいるマロだけで十分でしょう。
    そのうえ詩人どもに毒されなくても！

    マロ
    これはどうも！

    独白。

    あの道化、黙っていればよかったものを！

    トリブレ
    女ですよ、陛下！　ああ、女こそ天、女こそ地、
    女こそすべて！　ところが陛下には女がいる！
    女がいるんです！　勘弁してください。
    それで学者が欲しいとは、夢でも見ておいでだ！

    王
    私は、貴族の名誉にかけて、
    魚が林檎を欲しがるほどにも欲しくはない。

    奥の一団で笑い声が上がる。トリブレに。

    ほら、あの伊達男どもがお前を笑っているぞ。

    トリブレは聞きに行き、戻る。

    トリブレ
    違います。別の馬鹿を笑っているんです。

    王
    何だと、誰を？

    トリブレ
    王を。

    王
    本当か！　何をぬかしている？

    トリブレ
    陛下はけちだと。
    金も恩賞もナヴァールへ流れて、
    自分たちには何もしてくれないと。

    王
    ああ、ここからでも三人とも見える。
    モンシュニュ、ブリオン、モンモランシー……

    トリブレ
    そのとおり。

    王
    廷臣どもめ！　忌々しい連中だ！
    一人は海軍提督、次は大元帥にし、
    もう一人のモンシュニュは王室家政長にした。
    それでも不満なのだ！　こんな話があるか？

    トリブレ
    でも、あの方々を公平に扱うなら、
    まだ何かにしてやれますよ。

    王
    何にだ？

    トリブレ
    絞首台のぶら下がりに。

    ピエンヌ（笑い、奥にいる三人の貴族に）
    諸君、トリブレの言葉が聞こえたか？

    ブリオン（道化を怒りの目で見て）
    ああ、聞こえたとも！

    モンモランシー
    ただでは済まさん！

    モンシュニュ
    卑しい下僕め！

    トリブレ（王に）
    しかし陛下、ときには心が空しくなるでしょう。
    目は「いや」と言いながら、心は「はい」と言う女が、
    おそばには一人もいないのですから！

    王
    お前に何がわかる？

    トリブレ
    王の威光に目が眩んだ心に愛されるだけでは、
    愛されているとは言えません。

    王
    この世に、私自身を愛してくれる女が
    いないとでも、お前にはわかるのか？

    トリブレ
    どなたかも知らずに？

    王
    ああ、そうだ。

    独白。

    ここでビュシーの袋小路の可愛い娘を
    危うい目に遭わせぬようにしよう。

    トリブレ
    では、町人の娘ですか？

    王
    それが悪いか？

    トリブレ（急に）
    お気をつけください。
    町人の娘！　ああ、危ない恋ですよ。
    町人は、ときには手ごわい古代ローマ人になる。
    持ち物に手を出せば、こちらの手に傷が残ります。
    道化と王なんですから、おとなしく、
    陛下の忠実な貴族どもの、妻や妹で満足しましょう。

    王
    ああ、コセの女房なら、私も異存はない。

    トリブレ
    お取りなさい。

    王（笑って）
    言うは易く、行うは難しだ。

    トリブレ
    今夜さらいましょう。

    王（コセを指して）
    伯爵はどうする？

    トリブレ
    バスティーユは何のために？

    王
    いや、それは駄目だ。

    トリブレ
    話をつけるなら、公爵にしておやりなさい。

    王
    町人のように嫉妬深い男だ。
    何をやっても断って、屋根の上からでも騒ぎ立てるぞ。

    トリブレ（考えて）
    邪魔な男だ。金をやるか、追放するか……

    少し前から、コセは王と道化の背後へ近づき、会話を聞いている。トリブレは嬉しそうに額を打つ。

    だが、手軽で、ごく簡単で、
    もっと早く思いつくべきだった方法がある。

    コセは近づいて耳を澄ます。

    コセ氏の首を刎ねさせなさい。

    コセは仰天して後ずさる。

    ……スペインかローマとの陰謀があったことにして……

    コセ（たまりかねて）
    この小悪魔め！

    王（笑ってコセの肩を叩き、トリブレに）
    おいおい、貴族の名誉にかけて、
    本気か？　この首を刎ねるのか！
    見ろよ、この頭を。わかるか？
    ここから考えが出てくれば、きっと角が生えているぞ。

    トリブレ
    考えを入れていた鋳型と同じにね。

    コセ
    私の首を刎ねるだと！

    トリブレ
    それが何か？

    王（トリブレに）
    とことん怒らせる気か？

    トリブレ
    何です、何もかも遠慮して、
    ささやかな気まぐれ一つ通せないなら、王になった甲斐がない！

    コセ
    私の首を刎ねるだと！　ああ、ぞっとする！

    トリブレ
    実に簡単な話でしょう。
    あなたの首を刎ねてはいけない理由が、どこにあるんです？

    コセ
    まったく！
    懲らしめてくれるぞ、悪党！

    トリブレ
    おお、ちっとも怖くない！
    戦いを挑んでいる権力者たちに囲まれていても、
    俺は何も怖くない。首の上にあるのは、
    失って惜しいものでもない、道化の頭だけですからね。
    ただ一つ怖いのは、背中の瘤が体の中へめり込み、
    あなたのように腹へ落ちてくることだ。
    それでは俺も醜くなります。

    コセ（剣に手をかけて）
    ならず者！

    王
    伯爵、待て。来い、道化！

    トリブレを連れ、笑いながら離れていく。

    ゴルド
    王は腹を抱えてお笑いだ！

    パルダイヤン
    ちょっとしたことにも、あんなに無邪気にお笑いになる！

    マロ
    自ら楽しむ王とは、面白いものだ！

    道化と王が離れると、廷臣たちは集まり、憎しみの目でトリブレを追う。

    ブリオン
    あの道化に仕返しだ！

    一同
    うむ！

    マロ
    だが、鎧に守られている。
    どこから捕まえる？　どこを打つ？

    ピエンヌ
    私は知っている。
    皆、それぞれに恨みがある。復讐はできる。

    皆、興味をそそられてピエンヌに近寄る。

    今晩、日暮れに、十分武装して、
    ビュシーの袋小路、コセ邸のそばへ集まれ。
    この件は、もう一言も口にするな。

    マロ
    わかったぞ。

    ピエンヌ
    決まりだな？

    一同
    決まりだ。

    ピエンヌ
    静かに、戻ってくる。

    トリブレと、女たちに囲まれた王が戻る。

    トリブレ（一人離れて、独白）
    さて、次は誰をからかってやろう。王か……おや！

    従僕（入ってきて、トリブレに小声で）
    黒ずくめの老人、サン＝ヴァリエ様が、
    王にお目にかかりたいと。

    トリブレ（手を擦り合わせて）
    こいつはいい！　サン＝ヴァリエ殿をお通ししろ。

    従僕は退場。

    すばらしい！　こいつはどうしたことだ！
    とんでもない大騒ぎになるぞ！

    奥の大扉のあたりで物音と騒ぎ。

    外の声
    王に話がある！

    王（会話を中断して）
    駄目だ！……誰が入ってきた？

    同じ声
    王に話がある！

    王（急いで）
    駄目だ、駄目だ！

    喪服の老人が人波をかき分け、王の前に立って、じっと見据える。廷臣たちは皆、驚いて道を開ける。

  "translation_ja": "サン＝ジェルマンより下流、セーヌ川沿いの人けのない河原。右にあばら屋。粗い陶器と樫の腰掛けがあるだけの粗末な室内。上階は屋根裏で、窓から粗末な寝床が見える。観客に向いた正面は、中がすべて見通せるようになっている。卓と暖炉があり、奥の急な階段が屋根裏へ通じる。演者の左側の壁には、内へ開く戸。壁の継ぎ目は悪く、割れ目や隙間があり、家の中の様子を容易に覗ける。戸には格子つきの覗き窓があり、外には庇、その上に宿屋の看板。舞台の残りは河原。左に崩れかけた古い欄干があり、その下をセーヌ川が流れる。渡し船を呼ぶ鐘の支柱が、欄干に埋め込まれている。奥、川の向こうにヴェジネの森。右では、セーヌ川の曲がる先に、サン＝ジェルマンの丘と、遠くの町と城が見える。"

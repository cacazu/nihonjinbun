  "translation_ja": |-
    貴族たち。

    ゴルド
    さて、この一件の仕上げをしよう。

    パルダイヤン
    トリブレには、悩ませ、苦しませ、
    自分の美女がここにいるとは、気づかせないことだ！

    コセ
    愛人を捜させるのは結構だが、
    夜中に連れ込むところを、門番に見られていたら？

    モンシュニュ
    ルーヴルの戸口番には全員、
    夜、女が入るのは見ていないと言えと命じてある。

    パルダイヤン
    そのうえ、悪知恵の働くうちの従僕を、
    目くらましに道化の家まで行かせた。
    夜中に、ひどく暴れる女がオートフォール邸へ
    引きずり込まれるのを見たと、何だかんだ話させてある。

    コセ（笑って）
    いいぞ、オートフォール邸ならルーヴルから遠ざかる！

    ゴルド
    目を覆う布を、しっかり締めておこう。

    マロ
    私は今朝、あいつへこんな手紙を送った。

    紙を出して読む。

    「おいトリブレ、お前の美女はさらったぞ！
    知らせてやるなら、俺はこの女を連れて
    フランスの外へ出ていく。」

    一同笑う。

    ゴルド（マロに）
    署名は？

    マロ
    「ジャン・ド・ニヴェル！」

    笑い声がいっそう高まる。

    パルダイヤン
    ああ、捜し回るだろうな！

    コセ
    見るのが楽しみだ！

    ゴルド
    あの気の毒な奴、絶望し、
    拳を握り、怒りに歯を食いしばって、
    一日で、たまった借りを返してくれるぞ！

    横の戸が開く。豪華な朝の部屋着の王が、ピエンヌを伴って入る。廷臣たちは整列し、帽子を取る。王とピエンヌは大笑いしている。

    王（奥の戸を示して）
    そこにいるのか？

    ピエンヌ
    トリブレの愛人です！

    王
    本当か！
    まったく、道化の愛人を横取りするとは！　すばらしい！

    ピエンヌ
    愛人か、女房か！

    王（独白）
    女房に娘！
    あいつが、そんな所帯持ちとは知らなかった！

    ピエンヌ
    ご覧になりますか？

    王
    もちろんだ！

    ピエンヌは出ていき、ほどなく、ヴェールをかけ、よろめくブランシュを支えて戻る。王は気楽に肘掛け椅子へ座る。

    ピエンヌ（ブランシュに）
    美女よ、お入り。
    震えるのは後で、好きなだけ震えるがよい。
    王の御前だ。

    ブランシュ（まだヴェールをかけたまま）
    王様なの、あの若い方が！

    王の足元へ駆け寄って身を投げる。
    その声に王は身を震わせ、皆に退室するよう合図する。

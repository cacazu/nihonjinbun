  "translation_ja": |-
    前場の二人、庶民の男たちと女たち。

    女
    あの言葉を聞くと、
    胸が締めつけられる！

    トリブレ（振り返って）
    ああ、来たのか！　今になって来たのか！
    ずいぶん間に合ったものだ！

    鞭を手にした荷車引きの襟首をつかんで。

    おい、田舎者、馬はあるか？
    車は？　答えろ！

    荷車引き
    あるよ。ずいぶん揺さぶるな！

    トリブレ
    あるか？　なら、俺の頭を取って、車輪の下へ置いてくれ！

    またブランシュの体へ身を投げる。

    娘よ！

    見ていた男の一人
    殺人だろう！　父親が絶望している。
    引き離そう。

    トリブレを連れていこうとする。トリブレは暴れる。

    トリブレ
    ここにいたい！　娘を見ていたい！
    俺はあんたたちに何も悪いことをしていないのに、なぜ奪う？
    知らない人たちだ。聞いてくれないか？

    女に。

    奥さん、泣いているのか？　あんたは優しい人だ！
    連れていかないように言ってくれ。

    女は取りなす。トリブレはブランシュのそばへ戻る。ひざまずいて。

    ひざまずけ！
    ひざまずけ、この惨めな奴、娘の横で死んでしまえ！

    女
    ああ、落ち着きなさい。また大声を上げるなら、
    連れていかれますよ。

    トリブレ（取り乱して）
    いや、いや、放っておいてくれ！

    娘を両腕に抱えて。

    まだ息をしていると思う！　父さんが必要なのだ！
    早く町へ、助けを呼びに行ってくれ。
    腕の中にいさせてくれ。おとなしくしているから。

    娘をすっかり抱え上げ、母親が眠る子供を整えるようにする。

    いや、死んでいない！　ああ、神が望むはずはない。
    この世にはこの子しかいないと、御存じなのだから。
    体が歪んでいると、皆に憎まれる。
    皆、逃げていく。苦しみを尋ねる人もいない。
    この子は愛してくれる！　父さんの喜びで、支えだ。
    人が父を笑えば、一緒に泣いてくれる。
    こんなに美しくて、死んだなど！　ああ、違う。
    額を拭くものを、何かくれ。

    娘の額を拭く。

    唇はまだ薔薇色だ。
    ああ、見ていただけたなら！　まだ目に浮かぶ、
    二つのころの、金色の髪！
    あのころは金髪だった。

    激しく胸へ抱きしめて。

    ああ、踏みにじられた哀れな子！
    ブランシュ、父さんの幸福、いとしい娘！
    小さいときには、こうして抱いていた。
    ちょうど今のように、父さんの上で眠っていた！
    起きると、どんな天使だったか、知っていたら！
    父さんは、あの子には変なものではなかった！
    神々しい目で微笑んでくれた。
    父さんは二つの小さな手に接吻した！
    かわいそうな仔羊！　死んだ？　いや、眠って、休んでいるのだ。
    さっきはね、皆さん、もっとひどい様子だった。
    それでも目を覚ました。ああ、待っている。
    もうすぐ、目を開けるところが見られるよ！
    ほら皆さん、今は筋道立てて話せるでしょう。
    穏やかで、おとなしく、誰も侮辱していない。
    駄目と言われたことは何もしていないのだから、
    子供を眺めていても、かまわないでしょう。

    見つめる。

    額に皺一つない！　昔からの苦しみもない！
    両手で包んで、もう手を暖めてやった。
    ほら、少し触ってみて！

    医師が入ってくる。

    女（トリブレに）
    外科医ですよ。

    トリブレ（近づく外科医に）
    さあ、診てやってくれ。邪魔はしない。
    気を失っているのだね？

    外科医（ブランシュを診て）
    亡くなっています。

    トリブレは痙攣するように立ち上がる。

    左の脇腹に、かなり深い傷があります。
    血が詰まって、窒息して亡くなったのでしょう。

    トリブレ
    俺が娘を殺した！　俺が娘を殺した！

    敷石の上へ倒れる。

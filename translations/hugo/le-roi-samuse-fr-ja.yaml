  "translation_ja": |-
    王、トリブレ、ゴルド氏、数人の貴族。貴族たちは豪奢な装い。トリブレはボニファーチョの絵に描かれた道化の衣装。
    王は、通り過ぎる女たちの一団を眺めている。

    ラ・トゥール＝ランドリ
    ヴァンドーム夫人は神のようだ！

    ゴルド
    ダルブ夫人とモンシュヴルイユ夫人も、とてもお美しい。

    王
    コセ夫人は、その三人の誰よりも美しい。

    ゴルド
    コセ夫人！　陛下、お声を低く。

    舞台奥を通るコセ氏を指す。背が低く腹の出た男。「フランスで最も太った四人の貴族の一人」とブラントームはいう。

    亭主に聞こえます。

    王
    おい、シミアーヌ、それがどうした。

    ゴルド
    ディアーヌ様に言いつけますよ。

    王
    それがどうした！

    奥へ行き、通りかかるほかの女たちと話す。

    トリブレ（ゴルドに）
    ディアーヌ・ド・ポワチエを怒らせるぞ。
    もう丸八日も、口を利いていないんだから。

    ゴルド
    夫のもとへ帰してしまうのかな。

    トリブレ
    そうはならないでほしいね。

    ゴルド
    父親の赦免の代価は払った。それでもう貸し借りなしだ。

    トリブレ
    サン＝ヴァリエ殿といえば、あの変わった老人は、
    いったい何を考えていたんだろう。
    天が地上へ授けた天使のような、透き通るほど選り抜きの美女、
    娘のディアーヌを、背に瘤のある大代官と
    ごちゃまぜに、婚礼の床へ押し込んだとはね！

    ゴルド
    あれは老いぼれの馬鹿だ。赦免が届いたとき、
    私は処刑台の上にいた。厳めしい、青白い老人だった。
    お前との距離より近くにいた。
    言ったのは、ただ「神よ、王をお守りください」だけ。
    今ではすっかり正気を失っている。

    王（コセ夫人と通りながら）
    薄情な方だ！　行ってしまうのか！

    コセ夫人（溜息をついて）
    ソワソンへ。夫が連れていきますの。

    王
    ひどい話ではないか。パリじゅうが、
    最も高貴な貴族も、最も才気ある人々も、
    恋に焦がれる目をあなたへ注いでいるというのに。
    これほど美しい生涯の、最も美しい盛りに、
    決闘をする者もソネットを書く者も、
    最高の詩と最高の剣の技をあなたのために取っておき、
    美しい目が至るところに炎を撒いて、
    女たちが皆、自分の恋人を見張らねばならない今、
    これほどの輝きで宮廷を眩ませ、
    この太陽が去れば昼かどうかもわからなくなるあなたが、
    公爵も皇帝も王も大公も顧みず、
    田舎の空で町人じみた星として輝こうとは！

    コセ夫人
    落ち着いてくださいな。

    王
    いやいや、もう何も言うまい。
    舞踏会の真っ最中にシャンデリアを消すとは、変わった気まぐれだ！

    コセ氏が入ってくる。

    コセ夫人
    陛下、嫉妬深い人が来ましたわ！

    急いで王のそばを離れる。

    王
    ああ、悪魔に魂をくれてやれ！

    トリブレに。

    それでもあの女房に四行詩を作ってやったぞ！
    マロは、私の新しい詩をお前に見せたか。

    トリブレ
    陛下の詩なんぞ読みませんよ。
    王様の詩というのは、必ずひどい出来ですから。

    王
    この悪党！

    トリブレ
    恋と日和の韻を無理やり合わせるのは、
    有象無象に任せておけばよろしい。
    美女のそばでは、それぞれの役目を守ってください。
    陛下は恋をし、マロが詩を作る。韻を踏む王は品位を落とす。

    王（熱を込めて）
    ああ、美女のために詩を作ると、心が高く舞い上がる！
    王の城の主塔にも、翼をつけたい。

    トリブレ
    風車になってしまいますな。

    王
    あそこにコワラン夫人が見えなければ、
    お前を鞭打たせるところだ。

    コワラン夫人へ駆け寄り、口説き文句をささやいている様子。

    トリブレ（独白）
    お前を運ぶ風に乗って、そっちの女へも行くがいい。

    ゴルド（トリブレに近づき、舞台奥の様子を指して）
    あっちの戸口からコセ夫人だ。賭けてもいい。
    手袋を落として、王に拾わせるぞ。

    トリブレ
    見ていよう。

    王がコワラン夫人へ気を向けるのを見て嫉妬したコセ夫人は、実際に花束を落とす。王はコワラン夫人を離れ、花束を拾い、コセ夫人といかにも親密そうな会話を始める。

    ゴルド（トリブレに）
    言ったとおりだろう？

    トリブレ
    お見事！

    ゴルド
    王はまた捕まった！

    トリブレ
    女とは、ずいぶん完成された悪魔だね。

    王はコセ夫人の腰を抱き、手に接吻する。夫人は笑い、楽しげにしゃべる。不意に奥の戸口からコセ氏が入る。ゴルドがトリブレにそれを知らせる。コセ氏は立ち止まり、王と妻の姿をじっと見つめる。

    ゴルド（トリブレに）
    亭主だ！

    コセ夫人（夫を見つけ、自分をほとんど抱きしめている王に）
    離れましょう！

    王の手をすり抜けて逃げる。

    トリブレ
    あの腹の出た嫉妬男、ここへ何しに来たんだ？

    王は奥の食卓へ近づき、酒を注がせる。

    コセ（考え込みながら前へ出て、独白）
    何を話していたのだ？

    何か話があると合図したラ・トゥール＝ランドリへ、急いで近づく。

    何だ？

    ラ・トゥール＝ランドリ（ひそめかして）
    奥様は実にお美しい！

    コセはむっとして、何か打ち明けたそうなゴルドの方へ行く。

    ゴルド（小声で）
    いったい何が頭の中を駆け回っているのです？
    なぜそう何度も脇をお眺めになる？

    コセは腹を立てて彼を離れ、トリブレと鉢合わせする。トリブレは内密そうな顔で舞台の隅へ引き寄せる。その間、ゴルドとラ・トゥール＝ランドリは大口を開けて笑う。

    トリブレ（コセに小声で）
    旦那、すっかりこんがらがった顔ですな！

    大笑いし、怒って出ていくコセに背を向ける。

    王（戻ってきて）
    ああ、私は何と幸せなのだ！　私に比べれば、
    ヘラクレスもユピテルも、滑稽な色男にすぎぬ！
    オリュンポスなどあばら屋だ！　女たちは実にすばらしい！
    私は幸せだ！　お前は？

    トリブレ
    たいそう幸せですよ。
    舞踏会も遊びも色恋も、心の中で笑っている。
    俺はけなし、陛下は楽しむ。陛下は王様のように、
    俺は背曲がりのように幸せです。

    王
    母が笑いながら私を身ごもった、めでたい日よ！

    出ていくコセを見て。

    宴を台無しにするのは、あのコセだけだ。
    どういう男だと思う？

    トリブレ
    とんでもない馬鹿です。

    王
    ああ、かまうものか！　あの嫉妬男を除けば、何もかも気に入っている。
    何でもでき、何でも望み、何でも手に入るのだ、トリブレ！
    この世にいるのは何と楽しい、生きるとは何とすばらしい！
    何という幸せ！

    トリブレ
    そりゃそうでしょう、陛下。酔っておいでだ！

    王
    だが、あそこに見えるのは……美しい目だ！　美しい腕だ！

    トリブレ
    コセ夫人ですか。

    王
    来い、見張りをしてくれ！

    歌う。

    楽しき日曜、万歳よ、
    パリの町の人々の！
    女の肌が白いとき、

    トリブレ（歌って）
    男は酔って千鳥足。

    二人は退場。数人の貴族が入ってくる。

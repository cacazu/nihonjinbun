  "translation_ja": "ビュシーの袋小路の、最もひっそりした一角。右に、目立たない小さな家。小さな庭を囲む塀が舞台の一部を占める。庭には木が数本と石の腰掛け。塀には通りに出る戸があり、塀の上の狭い回廊には、ルネサンス風のアーチで支えた屋根がかかっている。家の上階の戸は露台に通じ、そこから階段で庭へ下りられる。左は、コセ邸の庭を囲む非常に高い壁。奥には遠くの家々と、サン＝セヴランの鐘楼。"

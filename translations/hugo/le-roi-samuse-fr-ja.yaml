  "translation_ja": |-
    王――ティツィアーノの絵に描かれた姿――、ラ・トゥール＝ランドリ氏。

    王
    伯爵、この恋は最後までやり遂げたい。
    町人の娘で、生まれも卑しいのだろうが、実に愛らしい！

    ラ・トゥール＝ランドリ
    日曜ごとに教会でお会いになるのですか。

    王
    サン＝ジェルマン＝デ＝プレだ。毎週日曜に通っている。

    ラ・トゥール＝ランドリ
    それがもう二月近くも続いていると？

    王
    そうだ。

    ラ・トゥール＝ランドリ
    その美女のお住まいは？

    王
    ビュシーの袋小路だ。

    ラ・トゥール＝ランドリ
    コセ邸のお近くですか。

    王（うなずいて）
    高い塀のあるあたりだ。

    ラ・トゥール＝ランドリ
    ああ、わかりました。それで陛下、後をおつけになる？

    王
    目も口も耳も見張っている、恐ろしい婆さんが、
    いつもついているのだ。

    ラ・トゥール＝ランドリ
    何と。

    王
    しかも妙なのは、晩になると、謎めいた男が、
    真っ黒な外套と真っ暗な夜にすっぽり身を包み、
    闇に紛れて、その家へ入っていくことだ。

    ラ・トゥール＝ランドリ
    陛下もそうなされば！

    王
    何を言う！　あの家は他人には戸を閉ざし、塀で囲ってある！

    ラ・トゥール＝ランドリ
    お後をおつけになる陛下に、その方は、
    何かお気持ちを示されたことは？

    王
    まあ、あの目つきからすれば、ひどい見当違いでもあるまい。
    私をどうしても嫌だとは思っていない。

    ラ・トゥール＝ランドリ
    王に愛されているとご存じですか。

    王（首を振って）
    毛織りの仕着せと灰色の長衣で、身をやつしている。

    ラ・トゥール＝ランドリ（笑って）
    なるほど、陛下は清らかな恋をしておいでだ。
    相手はさぞ神々しいトワノン、司祭の囲い女でしょう！

    数人の貴族とトリブレが入ってくる。

    王（ラ・トゥール＝ランドリに）
    しっ、誰か来た。恋をうまく運びたければ、
    黙ることも覚えねば。

    最後の言葉を聞きながら近づいてきたトリブレに向き直る。

    そうだろう？
    秘密だけが、壊れやすい恋の企てを
    無事に包んでおけるものなのだ。

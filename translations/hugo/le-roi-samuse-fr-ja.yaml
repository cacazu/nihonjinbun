  "translation_ja": |-
    トリブレ、一人。
    外套にくるまり、舞台奥からゆっくり進んでくる。嵐は弱まり、雨はやんだ。稲光がいくつか、ときおり遠い雷鳴だけ。

    いよいよ仇を討つのだ！　ついに！　もう済んだ。
    道化であり続け、心の騒ぎを隠し、
    笑いの仮面の下で血の涙を流しながら、
    待ち、見張って、もうじき一月になる。

    家の正面の低い戸を調べる。

    この戸……ああ、復讐をこの手につかみ、触れるとは！
    きっとここから、奴を運んでくるのだろう。
    まだ時刻ではない。それでも戻ってきた。
    そう、待つ間は戸を見ていよう。
    それだけでも、ましだ。

    雷鳴。

    何という天気！　謎の夜！
    天には嵐、地には殺人！
    ここにいる俺は、何と大きい！
    燃える怒りは今夜、神の怒りと肩を並べる。
    何という王を殺すのだ！　二十人もの王を従え、
    その手から平和や戦争を流れ出させる王を！
    今、あいつは世界全体の重みを支えている。
    いなくなれば、何もかも、どう傾くことか！
    この軸を引き抜いたら、衝撃は強く恐ろしく、
    それを押し出すこの手は、涙に暮れて
    ほかに釣り合いを求めざるをえなくなったヨーロッパ全体を、
    長く揺り動かすだろう！
    明日、神が地上へ言ったと考えてみろ。
    「おお大地よ、どの火山が火口を開いたのか？
    キリスト教徒、オスマン人、
    クレメンス七世、ドーリア、カール五世、スレイマンを、
    こうも揺り動かすのは誰か？
    どのカエサル、どのイエス、どの戦士、どの使徒が、
    国々をこんなにぶつけ合わせるのか？
    何者の腕が、思いのままにお前を震わせるのか、大地よ？」
    大地は恐れながら答えるだろう、「トリブレ」と。
    ああ、卑しい道化よ、深い誇りの中で楽しめ。
    道化の復讐が、世界を揺らすのだ！

    嵐の最後の物音の中、遠くの時計が真夜中を打つ。トリブレは耳を澄ます。

    真夜中！

    家へ走り、低い戸を叩く。

    中の声
    誰だ？

    トリブレ
    俺だ。

    声
    よし。

    戸の下半分だけが開く。

    トリブレ
    早く！

    声
    入るな。

    サルタバディルが戸の下半分から這い出す。かなり狭い開口部から、重いものを引きずり出す。長細い包みのようなものが、闇の中にかすかに見える。手に灯りはなく、家の中にもない。

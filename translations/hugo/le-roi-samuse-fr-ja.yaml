  "translation_ja": |-
    ブランシュ、トリブレ。

    トリブレ（厳粛に）
    もう話してよい。

    ブランシュ（目を伏せ、嗚咽に遮られながら）
    お父様、話さなければならないの。
    昨日、あの方が家へ忍び込んで……

    泣いて、両手で目を覆う。

    恥ずかしい！

    トリブレは抱きしめ、優しく娘の額を拭く。

    ずっと前から――もっと早く話せばよかった――、
    私の後をつけていたの……

    また言葉を切る。

    もっと初めから、お話ししなくては。
    話しかけてはこなかったの。
    あの若い方は、日曜に教会へいらして……

    トリブレ
    そう、王が！

    ブランシュ（続けて）
    いつも、きっと気づいてほしくて、
    そばを通るとき、私の椅子を動かすの。

    いよいよ弱い声で。

    昨日、家へうまく入り込んで……

    トリブレ
    せめて、何もかも話す苦しみだけは免れさせてやろう！
    あとは察しがつく！

    立ち上がる。

    ああ、苦しい！　奴は恥と侮蔑を取り、
    お前の額へ刻みつけた！
    息を吹きかけ、お前の周りの清らかな空気を汚した！
    乱暴に、お前の冠の花をむしった！
    ブランシュ、こんな父さんの、ただ一つの避難所！
    奴らの夜から帰る父さんを目覚めさせた昼の光！
    父さんの魂を徳へ立ち返らせる魂！
    父さんの恥の上に広げられた尊厳のヴェール！
    何もかもに見捨てられた、呪われた者の唯一の庇護！
    神の憐れみが、わが家に置き忘れていった天使！
    ああ、この世でただ一つ信じていた聖いものが、
    失われ、あの汚らしい泥の中へ埋められた！
    この致命的な一撃を受けて、父さんはどうなる？
    悪に身を売ったこの宮廷で、
    自分の外にも内にも、この地上には、
    悪徳、厚かましさ、恥知らず、不義、
    卑劣と放蕩しか見えなかった父さんが。
    空の下、目を休められたのは、お前の純潔だけだった！
    諦めていた。不幸を受け入れていた。
    涙、深く逃れられない卑しさ、
    砕けた心の底で、いつまでも血を流す誇り、
    父さんの苦しみで鋭くされた、侮蔑の笑い。
    そう、恥の混じったそのすべての苦しみを、
    自分が受けるのはよかった、神よ、だがこの子には！
    自分が低く落ちるほど、この子を高く置きたかった。
    処刑台のそばには、祭壇が必要なのだ。
    その祭壇が倒された！　額を隠しておくれ。そう、泣くがいい。
    いとしい子、さっきは話させすぎたね。
    そうだろう？　思いきり泣くんだ。
    お前の年頃なら、悲しみのいくらかは、
    涙と一緒に流れ去ることもある。
    できるなら、何もかも父さんの心へ注いでおくれ！

    物思いに沈んで。

    ブランシュ、残された仕事を果たしたら、
    パリを出よう。父さんが生き延びられればだが！

    なお考えながら。

    たった一日で、これほど何もかも変わるものなのか？

    怒りに跳ね起きて。

    ああ、呪い！　誰がこんなことを教えてくれただろう。
    卑劣で、歯止めもなく、狂いに狂い、
    女も子供も打ち砕きながら走り回り、
    神の禁じるすべてを突っ切り、
    一つの罪を、さらに異様な罪でしか消せず、
    血と泥を遠くまで撒き散らすこの宮廷が、
    奴らの目を避けてお前が隠れた闇まで来て、
    清らかで信心深い額へ、泥を跳ねかけようとは！

    王の寝室へ向き直って。

    王フランソワ一世よ！　俺の言葉を聞く神が、
    その道ですぐにお前を躓かせるように！
    走り込む墓が、明日にでも口を開くように！

    ブランシュ（天を仰ぎ、独白）
    神様、お聞きにならないで。私はまだ、あの方を愛しています！

    奥で足音。外の回廊に、兵士と貴族の一行が現れる。先頭にはピエンヌ。

    ピエンヌ（呼ぶ）
    モンシュニュ殿、格子門を開けさせろ。
    サン＝ヴァリエ殿を、バスティーユへ連れていく。

    兵士たちは奥を二列で通る。囲まれたサン＝ヴァリエは、戸の前を通りかかると立ち止まり、王の寝室へ向き直る。

    サン＝ヴァリエ（声高に）
    お前たちの王に、これほど侮辱を浴びせられたのに、
    私の呪いへ応える声は、
    地上にも天上にも、まだ見つからない。
    空には雷一つなく、この世には人の腕一本もない。
    もはや何も望まない。この王は栄えるだろう。

    トリブレ（頭を上げ、まっすぐ見て）
    伯爵、それは違う！　誰かが、あなたの仇を討つ。

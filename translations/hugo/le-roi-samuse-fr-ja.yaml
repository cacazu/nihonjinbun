  "translation_ja": |-
    貴族たち、のちにトリブレ、ついでブランシュ。
    ブランシュが上階の戸から露台へ現れる。手にした灯火が顔を照らしている。

    ブランシュ（露台で）
    ゴーシェ・マイエ！　愛する方のお名前、
    私の心に刻まれて！

    ピエンヌ（貴族たちに）
    諸君、あれが当人だ！

    パルダイヤン
    見よう！

    ゴルド（見下した調子で）
    どうせ町人の美人だろう！

    ピエンヌに。

    平民の女を珍味にするとは、お気の毒に！

    そのときブランシュが振り向き、貴族たちに顔が見える。

    ピエンヌ（ゴルドに）
    どう思う？

    マロ
    平民の娘が美しいぞ！

    ゴルド
    妖精だ、天使だ、優美そのものだ！

    パルダイヤン
    何だと！　あれがトリブレ殿の愛人か！
    食えない奴！

    ゴルド
    卑しい奴め！

    マロ
    最も美しい女が、最も醜い男に。
    公平だ。ユピテルは血筋を交ぜるのがお好きだから。

    ブランシュは家へ入る。窓の灯りだけが残る。

    ピエンヌ
    諸君、無駄口で時間を失うのはよそう。
    トリブレを懲らしめると決めたのだ。
    今ここには、皆の恨みと、
    そのうえ梯子まで揃っている。
    塀を越えて、あいつの美女を盗み出そう。
    娘をルーヴルへ運び、明日の朝のお目覚めに、
    陛下にこの美人を見つけていただくのだ。

    コセ
    王は、さっそく手をおつけになるだろうな。

    マロ
    悪魔が、自分の流儀で話をつけるさ！

    ピエンヌ
    よく言った。さあ、仕事だ！

    ゴルド
    実際、王の御馳走にふさわしい。

    トリブレが入ってくる。

    トリブレ（奥で、考え込みながら）
    戻ってきた……何のためだ？　ああ、自分でもわからない！

    コセ（貴族たちに）
    ところで諸君、黒髪だろうと金髪だろうと、
    王が皆の女をああして奪うのを、本当によいと思うかね？
    誰かが王妃を横取りしたら、
    王は何と言うだろう、聞きたいものだ。

    トリブレ（少し前へ進み）
    ああ、俺の秘密！
    あの老人が俺を呪った！　何かが胸を騒がせる！

    夜があまりに暗く、すぐそばにいるゴルドが見えず、通りすがりにぶつかる。

    誰だ？

    ゴルド（驚いて戻り、貴族たちに小声で）
    トリブレだ、諸君！

    コセ（小声で）
    勝利が二つだ！　あの悪党を殺せ！

    ピエンヌ
    いや、いけない。

    コセ
    こっちの手の中にいる。

    ピエンヌ
    殺したら、明日笑ってやる相手がいなくなるではないか！

    ゴルド
    そうだ。殺しては、いたずらの面白さが減る。

    コセ
    だが、邪魔をされるぞ。

    マロ
    私に話させてくれ。すべてうまく運んでやる。

    トリブレ（隅にとどまり、用心して耳を澄ましていた）
    小声で話している奴がいる。

    マロ（近づいて）
    トリブレ！

    トリブレ（恐ろしい声で）
    誰だ？

    マロ
    おい、食ってかからないでくれ。私だ。

    トリブレ
    誰が「私」だ？

    マロ
    マロだ。

    トリブレ
    ああ、ひどい闇だ！

    マロ
    そう、悪魔が空を墨壺にしたのさ。

    トリブレ
    何の用だ？

    マロ
    察しなかったかね。王のために、
    コセ夫人をさらいに来た。

    トリブレ（ほっとして）
    ああ……結構だ！

    コセ（独白）
    手足の一本でも、へし折ってやりたい！

    トリブレ（マロに）
    だが、どうやって寝室へ入る？

    マロ（コセに小声で）
    鍵を貸してくれ。

    コセが鍵を渡す。マロはトリブレへ渡す。

    ほら、この鍵に触ってみろ。
    彫ってあるコセ家の紋章がわかるか？

    トリブレ（鍵を撫でて）
    三枚の鋸の刃だ、そうだな。

    独白。

    何だ、俺は馬鹿だ！

    左の壁を指して。

    あれがコセ邸だ。いったい何を考えていたんだ？

    鍵を返しながら、マロに。

    太っちょコセの女房をさらうのか？　俺も加わろう！

    マロ
    皆、仮面をつけている。

    トリブレ
    なら、仮面をくれ！

    マロは仮面をつけてやり、そのうえ布を目と耳に巻きつける。

    それから？

    マロ
    梯子を支えてくれ。

    貴族たちは露台の塀へ梯子をかける。マロはトリブレを連れていき、支えさせる。

    トリブレ（梯子を持って）
    ふむ、人数は足りているか？
    まったく見えなくなった。

    マロ
    夜が暗いからだ。

    皆に、笑いながら。

    大声でも、重い足音でも平気だ。
    あの布で、目も耳も利かなくなっている。

    貴族たちは梯子を上がり、露台に通じる上階の戸を破って家へ入る。ほどなく一人が庭へ現れ、内側から戸を開ける。やがて一同が庭へ出て、戸を通っていく。半裸で猿轡を噛まされ、身をよじるブランシュを担いでいる。

    ブランシュ（遠くで、髪を乱して）
    お父様、助けて！　ああ、お父様！

    貴族たちの声（遠くで）
    勝ったぞ！

    ブランシュを連れて姿を消す。

    トリブレ（梯子の下に一人残って）
    さて、俺にここで煉獄の務めでもさせる気か？
    まだ終わらないのか。人を馬鹿にして！

    梯子を離し、仮面へ手をやると、巻かれた布に触れる。

    目隠しをされていた！

    布と仮面を引きちぎる。地面に置き忘れられた提灯の明かりで、何か白い物が見える。拾い上げ、娘のヴェールだと気づく。振り返る。梯子は自分の露台の塀にかかり、家の戸は開いている。狂ったように駆け込み、ほどなく、猿轡を噛まされ半裸になったベラルドを引きずって戻る。呆然と女を見てから、髪をむしり、言葉にならない叫びを上げる。やがて声が戻る。

    ああ、あの呪いが！

    気を失って倒れる。

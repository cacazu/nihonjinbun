  "translation_ja": |-
    男が去ると、トリブレは庭の塀にある小戸をそっと開ける。用心深く外を見てから、鍵穴から鍵を抜き、内側から戸を念入りに閉める。気にかかることに心を奪われた様子で、庭を数歩歩く。

    トリブレ（一人で）
    あの老人は、俺を呪った……
    俺に向かって話し、「呪われろ、下僕！」と叫んでいたとき、
    俺はその悲しみをからかった。
    ああ、そうだ、卑劣だった。
    笑っていたが、心の中では恐ろしくてたまらなかった。

    石の卓のそばの小さな腰掛けに座る。

    呪われた！

    額に手を当て、深く考え込む。

    ああ、自然と人間が、俺を
    これほど意地悪く、残酷で、卑怯な男にした。
    口惜しい、道化であるとは！　口惜しい、この体であるとは！
    いつもこの思いだ。起きていても眠っていても、
    夢で世界を一巡りしたところで、
    戻ってくるのはこれだ。俺は宮廷道化だ！
    笑うことしか望めず、できず、許されず、行えない！
    何という恥辱と惨めさの極みだ！
    旗と呼ぶぼろ切れの周りに群がる兵士にも、
    スペインの乞食にも、チュニスの奴隷にも、
    牢獄の徒刑囚にも、結局は残されるもの、
    この世で息をし、動いている人間なら誰にでもあるもの、
    笑わずにいる権利、泣きたければ泣く権利を、
    俺は持たない！　神よ！
    悲しく、不機嫌で、居心地の悪い歪んだ体に閉じ込められ、
    自分の姿に吐き気を催し、
    あらゆる強さ、あらゆる美しさに嫉妬し、
    ますます心を暗くする輝かしさに囲まれて、
    ときに、荒んだ心で一人、少しばかりの物陰を探し、
    激しくすすり泣く魂を、
    一瞬でも落ち着かせようとすると、
    不意に主人が現れる、陽気な主人が。
    何でもでき、女に愛され、生きていることに満足し、
    あまりに幸せで、墓のことなど忘れている。
    背が高く、若く、健康で、フランスの王で、美しい。
    そいつが、俺の溜息をつく物陰で、俺を足で突き、
    欠伸しながら言う。「道化、俺を笑わせろ！」
    ああ、哀れな宮廷道化！　それでも人間なのだ！
    心に煮えたぎる激情、
    恨み、誇り、高慢な怒り、
    胸いっぱいの嫉妬と憤激、
    恐ろしい企みを絶えずめぐらす思案、
    心の内を食い荒らす、そうした黒い感情のすべてを、
    主人の合図一つで自分の中で擦り潰し、
    欲しがる誰にでも、笑いに変えて差し出す！
    卑しさ！　歩こうと、立とうと、座ろうと、
    足を引く糸を、いつも感じている。
    どこからも蔑み！　誰もがこの男を辱める。
    あるいは、王妃、美しい女が、
    半ば裸で愛らしく、彼だって欲しくなるような女が、
    犬のように、寝床の上で遊ばせておく！
    だからな、麗しの貴族諸君、嘲り好きの貴族諸君、
    ふん、こいつはお前たちを憎んでいるぞ！　何という敵同士だ！
    ときには、お前たちの侮蔑に、何と高い代価を払わせることか。
    何とすばやく、仕返しの一撃を見つけることか。
    主人に入れ知恵する、黒い悪魔なのだ。
    諸君、お前たちの栄達には、芽を出す暇さえない。
    美しい人生を爪でつかめば、
    楽しみながら、一枚ずつ花びらをむしり取る！
    お前たちが、こいつを悪くしたのだ！
    ああ苦しい！　こんなものが生きることか。
    他人を酔わせる酒に、胆汁を混ぜる。
    自分の中によい心が芽生えたら、消してしまう。
    考えようとする精神を、鈴の音で痺れさせる。
    自分にはただの皮肉にすぎない宴を、
    毎日、悪霊のように通り抜け、
    退屈しのぎに幸せな者の幸福を壊し、
    他人の破滅にしか望みを持たず、
    偶然どこへ置かれようと、誰に対しても、
    絶えず自分の中に持ち歩き、あらゆるものに混ぜ、
    しまい込み、嘲笑の下へ隠し続ける、
    心の奥へ溢れ出した、古い憎しみを！
    ああ、俺は不幸だ！

    座っていた石の腰掛けから立つ。

    だが、ここでそんなことが何になる？
    この戸を通れば、俺は別の人間ではないか。
    出てきた世界を、少し忘れよう。
    ここへ、外のものを持ち込んではならない。

    再び物思いに沈む。

    俺はどうかしているのか？

    家の戸へ行って叩く。戸が開き、白い服の若い娘が出てきて、嬉しそうにその胸へ飛び込む。

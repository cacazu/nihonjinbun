  "translation_ja": |-
    外にトリブレとサルタバディル。家の中にマグロンヌと王。

    トリブレ（サルタバディルの前で金貨を数えて）
    二十枚の注文だったな。まず十枚だ。

    渡しかけて止める。

    確かに、ここで夜を過ごすのだろうな？

    サルタバディル（答える前に空を見て）
    曇ってきました。

    トリブレ（独白）
    実際、いつもルーヴルで寝るわけでもないからな。

    サルタバディル
    ご安心を。一時間もしないうちに降ります。
    嵐と妹が、今夜はあいつを引き止める。

    トリブレ
    真夜中に戻る。

    サルタバディル
    ご足労には及びません。
    死体一つ、俺一人でセーヌへ投げ込めます。

    トリブレ
    いや、自分で投げ込みたい。

    サルタバディル
    お好きなように。
    袋に縫い込んで、お渡ししましょう。

    トリブレ（金を渡して）
    よし。真夜中だ！　残りの金も持ってくる。

    サルタバディル
    すべて済ませておきます。
    あの若い男は何という名で？

    トリブレ
    名だと？　俺の名も知りたいか？
    奴の名は「罪」、俺の名は「罰」だ！

    退場。

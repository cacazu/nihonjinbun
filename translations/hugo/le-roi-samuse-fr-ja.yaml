  "translation_ja": |-
    トリブレ、一人、袋を見据えて。

    ここにいる！　死んでいる！　だが、見てみたい。

    袋を探る。

    まあいい、確かにあいつだ。この覆いの下に感じる。
    ほら、拍車が布を突き抜けている。
    確かにあいつだ。

    身を起こし、袋に足を載せて。

    さあ世界よ、俺を見ろ。
    こちらが道化、こちらが王だ！
    しかも、どんな王か！　すべての王の第一、最高の王！
    それが俺の足の下だ。捕まえた。本人だ。
    墓はセーヌ、死装束はこの袋。
    誰が、こんなことをしたのだ？

    腕を組んで。

    そうだ、この俺一人だ。
    いや、勝ったことが、まだ信じられない。
    明日、人々も信じようとはしないだろう。
    未来は何と言う？　こんな出来事に、
    国々は、どれほど長く驚くことか！
    ここへ置き、またここから取り去る運命よ！
    人間の、最も高い威厳の一つ、
    何と、フランソワ・ド・ヴァロワ、火の心を持つ君主、
    カール五世の競争相手、フランスの王、神、
    ――永遠でないことを除けば――、戦の勝者、
    足取りで城壁の土台を揺らした男、

    ときおり雷鳴。

    マリニャーノの男、一晩じゅう
    大軍を轟音の中でぶつけ合い、
    夜が明けると、血まみれの手には
    三本の大剣のうち、折れた一本しか残らなかった男、
    栄光で世界の星となった、あの王！
    神よ、何とあっけなく去ってしまったことか！
    権勢のまっただ中で、名声と騒ぎと、
    香を焚くように讃える宮廷を伴ったまま、突然運び去られた。
    望まれぬ赤子のように、
    雷鳴の夜に、名も知らぬ誰かの手で！
    何だ、この宮廷、この世紀、この治世も、煙か！
    燃える夜明けに昇ったこの王が、
    消え、失せ、空に散った！
    現れて、消えた。この稲妻の一つのように！
    明日には、役にも立たない触れ役どもが、
    樽いっぱいの金を見せて町々を回り、
    驚きに茫然とする通行人へ叫ぶかもしれぬ。
    「行方不明のフランソワ一世を見つけた者へ！」
    何というすばらしさ！

    しばし黙って。

    わが娘、哀れな悲しみの娘よ、
    あいつは罰せられ、お前の仇は討たれた！
    ああ、どれほどあいつの血が欲しかったことか！
    わずかな金で、手に入った！

    怒りを込め、死体へかがみ込む。

    悪党、まだ俺の声が聞こえるか？
    お前の王冠より値打ちのある娘、
    誰にも害を加えなかった娘を、
    お前は羨み、奪った！　返すときには、
    恥と、ああ、不幸をつけてよこした！
    さて、どうだ、聞こえるか？　今度は奇妙だろう。
    そう、ここにいて笑い、復讐するのは俺だ！
    何もかも忘れたふりをしていたから、
    お前は眠り込んだ！　父親の怒りからは、
    たやすく牙を抜けると思ったのか。情けない！
    いや、違う。俺たちの間に起こったこの争い、
    弱者と強者の争いで、勝つのは弱者だ。
    お前の足を舐めていた者が、心臓を食い破る！
    捕まえたぞ。

    ますます袋へかがみ込んで。

    聞こえるか？　俺だ、貴族の王様、
    この馬鹿、この道化、この半人前の人間、
    お前が「犬！」と呼んだ、得体の知れない獣だ！

    死体を叩く。

    わかるか、復讐が心に宿ると、
    死にきった心の中にも、眠るものはなくなる。
    弱い者も大きくなり、卑しい者も姿を変え、
    奴隷は憎しみを鞘から抜き、
    猫は虎となり、道化は首斬り役となる！

    半ば身を起こして。

    ああ、動けないまま、まだ声が聞こえていたなら！

    またかがんで。

    聞こえるか？　俺はお前を憎む！
    命の終わる川底へ行って、
    サン＝ドニへ逆流する水があるか、見てくるがよい！

    立ち上がって。

    フランソワ一世、水の中へ！

    袋の端を持ち、水際へ引きずる。欄干へ載せた瞬間、家の低い戸が用心深く開く。マグロンヌが出て、不安そうに辺りを見回し、何も見えないという仕草をして戻る。ほどなく王と再び現れ、もう誰もおらず、帰ってよいと身振りで説明する。女は家へ戻り、戸を閉める。王は示された方角へ、舞台奥を横切る。ちょうどトリブレが袋をセーヌへ落とそうとするところ。

    トリブレ（袋へ手をかけ）
    さあ！

    王（舞台奥で歌う）
    女の心は、よく変わる。
    信じる奴は、大馬鹿だ！

    トリブレ（身を震わせて）
    あの声！　何だ！
    夜の幻が、俺をからかうのか？

    仰天して振り返り、耳を澄ます。王の姿は消えたが、遠くで歌が聞こえる。

    王の声
    女の心は、よく変わる。
    信じる奴は、大馬鹿だ！

    トリブレ
    ああ、呪い！　手に入れたのは、あいつではない！
    逃がしたのだ、誰かが守った。
    騙された！

    家へ走る。上の窓だけが開いている。

    悪党！

    よじ登ろうとするように、目で高さを量る。

    高すぎる、あの窓は！

    怒って袋へ戻る。

    だが、あの裏切り者は、代わりに誰を入れた？
    どんな罪もない人を？　震える……

    袋に触れて。

    そう、人間の体だ！

    短剣で袋を上から下まで裂き、不安げに中を見る。

    見えない！　この夜！

    取り乱して振り返り。

    何もないのか、この道には！
    あの家にも何も！　灯火一つ光っていない！

    絶望して体の上へ肘をついて。

    稲妻を待とう。

    半開きの袋からブランシュを半ば引き出し、しばらく目を据えたままでいる。

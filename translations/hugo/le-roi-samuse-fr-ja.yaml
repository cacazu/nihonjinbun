  "source_text": |-
    J'ai ma sœur Maguelonne, une fort belle fille
    Qui danse dans la rue et qu'on trouve gentille.
    Elle attire chez nous le galant une nuit.
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 109
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/div[2]/ol[1]/li[2]/p[2]"
  "translation_ja": |-
    俺にはマグロンヌという妹がいましてね。たいそう美しい娘で、
    通りで踊りを踊り、可愛いと評判です。
    そいつがある晩、色男をうちへ誘い込み……
  "translation_status": "reviewed"
- "id": "roi-110"
  "section_id": "notes"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Saltabadil a dit:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 110

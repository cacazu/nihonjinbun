  "translation_ja": |-
    外にトリブレとブランシュ。家の中にサルタバディル。
    この場を通じてトリブレは、邪魔され、見られ、見つかることを恐れる男の、不安に心を奪われた様子を見せる。しばしば周囲、とりわけあばら屋へ目を向けること。サルタバディルは宿の卓のそばに座り、剣帯を磨いている。すぐそばで起きていることは何も聞こえない。

    トリブレ
    それでも、愛しているのか？

    ブランシュ
    いつまでも！

    トリブレ
    その馬鹿げた恋を治す時間は、
    十分与えておいたつもりだ。

    ブランシュ
    愛しているの。

    トリブレ
    ああ、哀れな女の心！
    だが、愛する理由を説明しておくれ。

    ブランシュ
    わからないわ。

    トリブレ
    何ということだ！　おかしな話だ！

    ブランシュ
    いいえ、違うわ。それだからこそ、
    まさに愛しているの。だって、ときには
    命を救ってくれる男の人に会うでしょう。
    お金持ちにし、羨ましがられる身分にしてくれる夫にも。
    でも、いつもその人を愛するかしら？
    あの方は、たぶん、私を苦しめただけ。
    それでも愛していて、なぜだかわからない。
    私、こんなに思っているの。何も忘れてはいないけれど、
    必要なら――何て愚かでしょう！――、
    あの方は私に災いをもたらし、お父様はこんなに優しいのに、
    お父様のためと同じように、あの方のためにも死ねるわ！

    トリブレ
    赦してやろう、この子よ！

    ブランシュ
    でも、聞いて、あの方は私を愛しているの。

    トリブレ
    違う！　愚かな娘！

    ブランシュ
    そうおっしゃった！　誓ってもくださった！
    それに、何て巧みに、勝ち誇った様子で、
    心をつかむ恋の言葉をおっしゃることか！
    女に向ける目も、何て優しいのでしょう！
    勇敢で、有名で、美しい王だわ！

    トリブレ（激して）
    恥知らずなのだ！
    あの卑怯な誘惑者に、ただで幸福を奪われたままには
    しておくものか！

    ブランシュ
    お赦しになったのでは、お父様……

    トリブレ
    あの神を汚す男を！
    罠を組み立てる時間が必要だった。それだけだ。

    ブランシュ
    この一月――震えながら話すけれど――、
    お父様は王が好きなように見えたわ。

    トリブレ
    ふりをしているのだ。
    ブランシュ、仇を討ってやる！

    ブランシュ（手を合わせて）
    お父様、それだけは勘弁して！

    トリブレ
    せめて、騙されたら、
    少しは腹が立つのか？

    ブランシュ
    あの方が？　いいえ、そんなことは信じない。

    トリブレ
    その目で、じかに見たとしても？
    もう愛されなくても、まだ愛するか？

    ブランシュ
    わからない。でも、愛している、慕っているとおっしゃるの。
    昨日も、そうおっしゃったわ。

    トリブレ（苦々しく）
    何時に？

    ブランシュ
    昨日の晩。

    トリブレ
    それなら見ろ。見えるものなら、見てみるがよい！

    家の壁の割れ目を示す。ブランシュが覗く。

    ブランシュ（小声で）
    男の人が一人いるだけ。

    トリブレ（声を落として）
    少し待て。

    普通の士官の服を着た王が、宿の階下の広間に現れる。隣の部屋へ通じる小戸から入ってくる。

    ブランシュ（身を震わせて）
    お父様！

    次の場を通じて、ブランシュは壁の割れ目へ身を寄せたまま、室内の出来事をすべて見聞きする。ほかのことには何も気づかず、ときおり全身を痙攣するように震わせる。

  "translation_status": "reviewed"
- "id": "roi-111"
  "section_id": "notes"
  "kind": "note_body"
  "origin": "source"
  "source_text": |-
    J'ai ma sœur, une jeune et belle créature,
    Qui chez nous aux passants dit la bonne aventure;
    Votre homme la viendrait consulter une nuit.
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 111
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/div[2]/ol[1]/li[2]/p[4]"
  "translation_ja": |-
    俺には妹がいまして、若く美しい娘です。
    うちで、通りすがりの人の運勢を占っています。
    あんたの相手も、ある晩、占ってもらいに来るでしょう。
  "translation_status": "reviewed"

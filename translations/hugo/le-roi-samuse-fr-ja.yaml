  "translation_ja": |-
    前場の人々、王、マグロンヌ。
    王がサルタバディルの肩を叩く。仕事を不意に邪魔された男が振り向く。

    王
    二つ、すぐに用意しろ。

    サルタバディル
    何を？

    王
    妹と、私の杯だ。

    トリブレ（外で）
    これがあいつの流儀だ。神の恩寵による王は、
    しょっちゅう一人で、いかがわしい場所へ身をさらす。
    何より酔わせ、心を支配する酒は、
    酒場のヘベが注いでくれる酒なのだ。

    王（酒場の中で歌う）
    女の心は、よく変わる。
    信じる奴は、大馬鹿だ！
    女はしばしば、ただ一枚の、
    風に舞う羽根にすぎぬ！

    サルタバディルは黙って隣室へ行き、瓶と杯を持ってきて卓へ置く。それから長い剣の柄頭で、天井を二度叩く。合図に応じ、ジプシーの装いの美しい娘が、軽やかに笑いながら階段を跳ね下りる。入るなり王が接吻しようとするが、娘はすり抜ける。

    王（また生真面目に剣帯を擦り始めたサルタバディルに）
    おい、その剣帯、外の空気の中で磨いてくれば、
    もっときれいに光るだろうよ。

    サルタバディル
    わかりました。

    立ち、不器用に一礼して外の戸を開け、出てから閉める。外でトリブレを見つけ、秘密めかして近づく。二人が言葉を交わすあいだ、娘は王を焦らし、ブランシュは恐れながら見守る。家を指して、トリブレに小声で。

    生かすのか、殺すのか？
    あんたの相手は、こっちの手の中です。あそこに。

    トリブレ
    少ししたら戻ってこい。

    離れるよう合図する。サルタバディルはゆっくり、古い欄干の陰へ消える。その間、王は若いジプシー娘にじゃれつき、娘は笑って押し返す。

    マグロンヌ（接吻しようとする王に）
    いやよ。

    王
    よし。さっき抱こうとしたら、ひどく殴ったな。
    「いやよ」なら進歩だ。大進歩だ。まだ後ずさるのか！
    話をしよう。

    娘が近づく。

    八日前だ、ヘラクレス亭で、
    ――あそこへ連れていったのは誰だ、トリブレ殿だったかな――、
    初めてその美しい目を見た。
    そしてこの八日、美しい人よ、私はお前に夢中だ。
    お前だけを愛している！

    マグロンヌ（笑って）
    それと、ほかに二十人もね！
    あなた、まったく女たらしに見えるわ！

    王（一緒に笑って）
    ああ、実際、何人もの女を不幸にした。
    本当だ、私は怪物だ。

    マグロンヌ
    うぬぼれ屋！

    王
    本当だとも。
    さて、今朝お前は私をこのあばら屋へ連れてきた。
    飯はひどくまずく、葡萄酒は兄貴の作る、ろくでもない宿だ。
    あの兄貴は醜い獣で、ずいぶん凶暴な男だろう。
    お前の口のそばへ、あんな面をさらせるのだから。
    まあいい、今夜はここで過ごすつもりだ。

    マグロンヌ（独白）
    よし、ひとりでにうまく運ぶわ。

    また接吻しようとする王に。

    離して！

    王
    うるさいな！

    マグロンヌ
    お行儀よくして！

    王
    知恵というのはこうだ、かわいい人。
    愛し、楽しみ、うまいものを食べよう。
    その点は、亡きソロモンと同じ考えだ。

    マグロンヌ
    お説教を聞くより、居酒屋へ行くほうが多いのね。

    王（腕を差し伸べて）
    マグロンヌ！

    マグロンヌ（すり抜けて）
    明日ね！

    王
    もう一度その野蛮で忌々しい言葉を言ったら、
    卓をひっくり返すぞ。
    美女は決して、「明日」と言ってはいけない。

    マグロンヌ（急になつき、楽しげに王のそばの卓へ腰かける）
    じゃあ、仲直りしましょう。

    王（手を取って）
    何という美しい手！
    善人ぶらずに言うが、ほかの女の愛撫より、
    この手から平手打ちを受けたいものだ！

    マグロンヌ（喜んで）
    からかっているのね！

    王
    決して！

    マグロンヌ
    私、不器量だわ！

    王
    まさか、違う。
    神々しい魅力を、もう少し正しく見てやれ！
    私は燃えている！　無情な女の女王よ、知らないのか？
    我々軍人は、どれほど恋につかまるか、
    美しい人が受け入れてくれれば、
    ロシアの果てでも、燃える炭や炎になるのだと！

    マグロンヌ（大笑いして）
    どこかの本で読んだのね、それ！

    王（独白）
    そうかもしれん。

    声に出して。

    接吻を一つ。

    マグロンヌ
    まあ、酔ってるのね！

    王（微笑んで）
    恋に。

    マグロンヌ
    その可愛い顔で、馬鹿にしているんでしょう。
    気楽で、上機嫌な旦那様！

    王
    いや、違う！

    王は接吻する。

    マグロンヌ
    もう十分よ！

    王
    さあ、お前と結婚したい。

    マグロンヌ（笑って）
    本当に？

    王
    何て愛らしく、気まぐれな恋の娘だ！

    膝へ抱き上げ、小声で話し始める。娘は笑い、媚びる。ブランシュはこれ以上耐えられず、青ざめ、震えながらトリブレへ振り向く。

    トリブレ（しばらく黙って娘を見てから）
    さて、復讐をどう思う、わが子よ？

    ブランシュ（ほとんど声も出ず）
    ああ、裏切り！　恩知らず！　神様、心が裂ける！
    何て私を騙したのでしょう！　心のない人だったのだわ！
    ひどすぎる！　あの女へ言うことは、
    前に私へ言ったのと同じこと。

    父の胸に顔を隠して。

    あの女も、何て恥知らず！　ああ！

    トリブレ（小声で）
    黙るんだ。
    泣くな。父さんに仇を討たせてくれ！

    ブランシュ
    ああ！　どうぞ、お好きなようになさって。

    トリブレ
    ありがとう！

    ブランシュ
    神様！　お父様は恐ろしい。何をなさるおつもり？

    トリブレ
    すべて用意してある。
    取り上げないでくれ。そうしたら息が詰まってしまう！
    いいか、家へ帰り、男の服と、馬と、
    金を、いくらでもよいから持ち、
    途中で一刻も止まらず、
    エヴルーへ発つのだ。明後日、父さんも合流する。
    母さんの肖像のそばの櫃はわかるね？
    服はそこだ。前もって特別に作らせてある。
    馬には鞍を置いてある。言ったとおりにするんだ。
    行きなさい。ことに、ここへは決して戻るな。
    恐ろしいことが起こるのだから。
    行くんだ。

    ブランシュ
    優しいお父様、一緒に来て！

    トリブレ
    それはできない。

    娘に接吻する。

    ブランシュ
    ああ、震えるわ！

    トリブレ
    じきに会おう！

    もう一度接吻する。ブランシュはよろめきながら去る。

    言ったとおりにするんだよ。

    この場と次の場を通じ、階下の広間に二人きりの王とマグロンヌは、笑いながらじゃれ合い、小声で話し続ける。ブランシュが去ると、トリブレは欄干へ行って合図する。サルタバディルが再び現れる。日が暮れかけている。

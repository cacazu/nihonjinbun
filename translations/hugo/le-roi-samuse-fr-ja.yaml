  "translation_ja": |-
    前場の人々、深い喪の装いのサン＝ヴァリエ氏。髪も髭も白い。

    サン＝ヴァリエ（王に）
    いいえ、お話しします！

    王
    サン＝ヴァリエ殿！

    サン＝ヴァリエ（敷居に立ったまま）
    そう呼ばれております。

    王は怒って一歩近づく。トリブレが止める。

    トリブレ
    おお陛下、あの爺さんには俺からご挨拶を。

    芝居がかった姿勢でサン＝ヴァリエに。

    閣下！　そなたは余に対して陰謀を企てた。
    余は寛大で慈悲深い王として、そなたを赦した。
    それは結構なことだ。なのに今、何を血迷って、
    婿殿の子供を孫に持とうとなさる？
    あの婿殿はひどく醜く、格好も悪く、姿も悪い。
    鼻の真ん中に疣があり、
    片目だという者もあるし、毛深く、痩せて青白く、
    腹は、この方のように出ており、

    コセを指す。コセは反り返る。

    背中は俺のように曲がっている。
    あの横に娘さんが並べば、誰だって笑うだろう。
    王がお計らいにならなければ、あの婿は
    歪んだ孫、恐ろしい孫を作っていたはず。
    赤毛で、歯抜けで、出来損ないで、恐ろしく、滑稽で、
    腹はこの方のように出ており、

    またコセを指し、一礼する。コセは憤る。

    背中は俺のように曲がっている！
    婿殿は醜すぎる！　王にお任せなさい。
    そうすれば、いつか足腰のしっかりした孫たちが、
    髭を引っ張り、膝によじ登ってくれるでしょう。

    廷臣たちは野次と笑い声を上げ、トリブレに喝采する。

    サン＝ヴァリエ（道化には目も向けず）
    また一つ侮辱を！　陛下、あなたは私の話をお聞きください。
    王である以上、お聞きになる義務がある！
    ある日あなたは、私を裸足でグレーヴ広場へ引かせ、
    そこで夢のように赦免なさいました。
    私はあなたを祝福しました。王が赦免の奥に
    何を隠しているか、知らなかったからです。
    あなたは、私への赦免の中に、私の恥を隠していたのだ。
    そうです、陛下。古い家柄も、
    千年も高貴であったポワチエの血も顧みず、
    私がグレーヴからゆっくり帰りながら、
    心の中で勝利の神に、私に残された命の日々を
    あなたの栄光の日々として授けてほしいと祈っていたとき、
    あなた、フランソワ・ド・ヴァロワは、その日の晩、
    恐れも、憐れみも、慎みも、愛もなく、
    女の徳の墓場である寝床の中で、
    忌まわしい接吻の下に、冷酷にも、
    ブレゼ伯爵夫人ディアーヌ・ド・ポワチエを、
    曇らせ、萎れさせ、汚し、辱め、打ち砕いた！
    何ということだ！　私が有罪の宣告を待っていたとき、
    お前はルーヴルへ駆けていたのか、清らかなディアーヌ！
    そしてあの男、バイヤールから騎士に叙せられた王、
    若い身で老いぼれの享楽を求める男は、
    神だけがその数を知る、わずかな延命の日々と引き換えに、
    父を足元に置き、お前の辱めを値切っていたのか。
    考えるだに恐ろしい、あの忌まわしい台、
    ある朝、死刑執行人がグレーヴに組み立てた台は、
    その日の暮れまでに、ああ悲惨なことに、
    娘の寝床か、父の処刑台か、どちらかになるはずだった！
    私たちをお裁きになる神よ、天上で何とおっしゃったのです。
    同じあの処刑台の上で、
    陰気で、後ろ暗く、血と汚れにまみれ、
    慈悲の衣を着た王の色欲が転げ回るのを、ご覧になったとき！
    陛下、これは悪い行いです。
    老人の血で敷石を赤く染めたとしても、
    それはよい。たとえ尊敬に値する老人でも、
    大元帥の一味だったのだから、当然の報いでしょう。
    しかし老人の代わりに、その子を奪い、
    恐れやすい、泣く哀れな女を、
    勝ち誇った足で踏み砕いたこと、
    それは神に背く行いで、いずれ責任を問われます！
    あなたは権利の範囲を、大きく踏み越えた。
    父はあなたのものでも、娘は違う。
    ああ、私を赦免したと！　ああ、これを
    恩赦とお呼びになる！　ならば私は恩知らずというのでしょう！
    陛下、娘を辱めるくらいなら、なぜ御自身で
    私の牢へおいでにならなかったのです！
    私は叫んだでしょう。どうか私をお殺しください、慈悲を！
    娘に慈悲を、わが家に慈悲を！
    ああ、私を殺してください！　屈辱より墓を！
    額に汚点をつけるくらいなら、首などなくてよい！
    おお、王なる殿、そうお呼びするのですから、
    キリスト教徒、伯爵、貴族たる者が、
    頭でなく名誉を失えば、
    首を刎ねられたのと変わりがあるとお思いか。お答えください！
    私はそう言ったでしょう。そうすればその晩、教会で、
    血に染まった棺に眠る私の白い髭へ接吻し、
    清らかな心、聖らかな額を持つわがディアーヌは、
    名誉を保った娘として、名誉を保った父のため祈ったでしょう！
    陛下、娘を返せと言いに来たのではありません。
    名誉を失えば、家族も失う。
    娘が狂おしい恋であなたを愛していようと、いまいと、
    恥が通ったところに、私が取り返すものはない。
    お持ちになるがよい。ただ私は、これから
    宴のたびに、こうして邪魔をしに来ようと決めた。
    いつか父か、兄か、夫の誰かが、
    ――必ずその時は来る――あなたに私たちの仇を討つまで、
    青ざめた姿で、すべての宴へ戻ってきて告げます。
    あなたは悪いことをなさった、陛下、悪い行いをなさった！
    あなたは聞かねばならない。汚れた額を
    上げられるのは、私が話し終えたときだけだ。
    私の復讐を黙らせるため、
    また死刑執行人へ渡したくなるでしょう。いや、できまい。
    翌日には私の亡霊が、

    自分の頭を指して。

    この頭を手に持って、また話しかけに来るのが怖いからだ！

    王（怒りに息を詰まらせて）
    よくも、ここまで無礼と狂乱に我を忘れて……！

    ピエンヌに。

    公爵、この男を捕らえよ！

    ピエンヌが合図すると、槍斧を持つ兵二人がサン＝ヴァリエの両側に立つ。

    トリブレ（笑って）
    爺さんは気が触れていますよ、陛下！

    サン＝ヴァリエ（腕を上げて）
    二人とも、呪われよ！

    王に。

    陛下、それはよくない。
    死にかけた獅子へ、飼い犬をけしかけるとは！

    トリブレに。

    お前が何者であろうと、蝮の舌を持つ下僕よ、
    父の悲しみを、そうやって笑いものにする者よ、
    呪われよ！

    王に。

    私は、あなたから、王が王へするように
    遇される権利がありました。
    あなたは王、私は父。老齢は玉座に等しい。
    私たちは二人とも、額に冠を戴いている。
    誰も不遜な目を上げてはならない冠を。
    あなたのは黄金の百合、私のは白い髪だ。
    王よ、不敬な者があなたの冠を侮辱すれば、
    報復するのはあなた。もう一方に報復するのは、神だ。

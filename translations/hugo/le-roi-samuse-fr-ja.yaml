  "translation_ja": |-
    ブランシュ、ベラルド夫人、王。
    場面の前半では、王は木の陰に隠れたまま。

    ブランシュ（遠ざかる父の足音を聞き、物思いに沈んで）
    でも、後ろめたいわ！

    ベラルド
    後ろめたい？　どうして？

    ブランシュ
    ほんの小さなことにも、あんなに怯えて心配なさる。
    帰りがけ、目に涙が光るのが見えたわ。
    かわいそうなお父様！　あんなに優しいのに！
    日曜、私たちが外へ出られる時間に、
    若い方が後をつけてくることを、話すべきだった。
    ほら、あの美しい若い方よ。

    ベラルド
    なぜそんなことをお話しになるの、お嬢様。
    お父様は、少し気難しくて、変わった方ですから。
    それほどあの若い殿方がお嫌いなの？

    ブランシュ
    私が、あの方を嫌い？　いいえ！　ああ、まるで反対よ。
    お会いしてから、何をしても忘れられない。
    あの方の目が私の目へ語りかけた日から、
    ほかのことは何でもなくなり、いつも、ここにあの方が見える。
    私はあの方のもの！　ねえ、私にはこう思えるの。
    誰よりも、一キュビトも背が高いように！
    何て勇ましく、優しく、高貴で、誇らしげなのでしょう。
    ベラルド、馬にお乗りになったら、どんなにすてきかしら！

    ベラルド
    本当に魅力的な方ですわ！

    王のそばを通る。王は一握りの金貨を与え、女は懐へしまう。

    ブランシュ
    あんな方は、きっと……

    ベラルド（王へ手を出す。王はまた金を与える）
    非の打ちどころがありませんとも。

    ブランシュ
    目を見れば、心がわかるわ。大きな心が！

    ベラルド
    ええ、途方もなく大きな心！

    ベラルドは一言しゃべるたび王へ手を出し、王はそこへ金貨を満たす。

    ブランシュ
    勇敢で。

    ベラルド（同じことを続けて）
    恐ろしいほど！

    ブランシュ
    それでいて……親切。

    ベラルド（手を出して）
    情け深い！

    ブランシュ
    気前がよくて。

    ベラルド（手を出して）
    豪勢な方！

    ブランシュ（深い溜息とともに）
    好きなの！

    ベラルド（一言ごとに、なお手を出して）
    あのお姿は並ぶものもない！
    あの目！　あの額！　あの鼻！……

    王（独白）
    おやまあ、婆さん、俺を部品ごとに褒め始めた！
    身ぐるみ剝がされるぞ！

    ブランシュ
    そんなに褒めてくれるあなたが、大好きよ。

    ベラルド
    存じていますとも。

    王（独白）
    火に油だ！

    ベラルド
    親切で、情け深く、広い心！
    勇敢で、気前よく……

    王（ポケットを空にして）
    しまった、また始まった！

    ベラルド（続けて）
    たいそうお偉い貴族ですわ。身なりも優雅で、
    手袋には、何か金の刺繡がしてあります。

    手を出す。王は、もうないと合図する。

    ブランシュ
    いいえ、貴族や大公であってほしくないの。
    田舎から出てきた、貧しい学生がいい！
    そのほうが、深く愛してくれそう。

    ベラルド
    まあ、そうかもしれませんね。
    お嬢様がそうお望みなら。

    独白。

    変わった好み！
    娘の頭は、何でもあべこべだ！

    なおも王へ手を出してみる。

    あの美しい方は、夢中でお嬢様を愛していますよ。

    王は与えない。

    独白。

    もう干上がったらしい。一文もなければ、一言もなし。

    ブランシュ（まだ王には気づかず）
    日曜は、いくら早く来ても待ち遠しい。
    会えないと、本当に悲しいの。
    ああ、この前、献金のとき、
    話しかけてくださるかと思って、胸がどきどきした！
    昼も夜も考えているわ！　あの方だって、ねえ、
    私への恋に心を奪われているのよ。
    いつも心の中に、私の姿を抱いているに決まっている。
    あの方はそういう人。見ればよくわかるわ！
    ほかの女なんて、何とも思わない。
    遊びも、気晴らしも、お祭りもない。
    私のことだけを考えて……

    ベラルド（最後にもう一度、王へ手を差し出して）
    首を賭けてもよろしい！

    王（指輪を抜いて与え）
    その首に、この指輪だ！

    ブランシュ
    ああ、昼には考え、夜には夢に見て、
    何度、ここに……目の前にいてくださればと思うことか。

    王は隠れ場所を出て、娘のそばにひざまずく。娘は反対側を向いている。

    そしてご本人へ言いたいの。
    幸せになって、喜んで、ええ、私はあなたをあい……

    振り返り、ひざまずく王を見て、石のように固まる。

    王（両腕を差し伸べて）
    愛している！
    最後まで、最後まで言って！　ああ、「愛している」と！
    怖がらなくていい。そんな唇に、その言葉は何と似合う！

    ブランシュ（怯え、姿を消したベラルドを目で探して）
    ベラルド！　ああ神様、答えてくれる人がいない！
    誰もいない！

    王（ひざまずいたまま）
    幸せな恋人が二人いれば、それで一つの世界だ！

    ブランシュ（震えて）
    どこからいらしたのです？

    王
    地獄からでも天国からでも、どうでもよいではないか！
    私がサタンでもガブリエルでも、
    あなたを愛している！

    ブランシュ
    ああ、どうか、お願い……
    誰にも見られなかったでしょうね！　帰って！
    神様、もしお父様が……

    王
    帰れと、震えるあなたをこの腕に抱いているのに？
    私があなたのもの、あなたが私のものとなったのに！
    私を愛している、そう言ったね。

    ブランシュ（恥じらって）
    聞いていらしたの！

    王
    もちろん。これ以上に天の音楽らしいものを、
    ほかに何を聞けばよいのだろう？

    ブランシュ（懇願して）
    ああ、お話ししてくださったわ。
    だからもう、お願い、帰って！

    王
    帰れと、私の運命があなたの運命に結ばれ、
    二人の星が同じ空に輝き、
    娘の心を目覚めさせるため私が来て、
    まだ無垢な魂を愛へ、まぶたを光へ開くため、
    天が私を選んだというのに！
    さあ、見てごらん！　恋は魂の太陽だ！
    この優しい炎に、暖まるのを感じないか？
    死が人に与え、また取り上げる王笏、
    戦場を駆け回って拾い集める栄光、
    高い名声を得ること、広い領地を持つこと、
    皇帝や王であること、それは人間の事柄。
    何もかもが順番に過ぎ去るこの地上で、
    神に属するものは、ただ一つ、愛なのだ！
    ブランシュ、恋人が運んできたのは幸福だ。
    気おくれしながら、戸口で待っていた幸福だ！
    人生が花なら、愛はその蜜。
    空で鷲と結ばれる鳩、
    強さに身を預ける、震える優美、
    私の手の中へ、そっと預けたあなたの手……
    愛し合おう、愛し合おう！

    接吻しようとする。娘は身をよじる。

    ブランシュ
    いや！　離して！

    王は娘を抱きすくめ、接吻を奪う。

    ベラルド（奥の露台で独白）
    うまいものね！

    王（独白）
    捕まえた！

    声に出して。

    愛していると言っておくれ！

    ベラルド（奥で独白）
    悪党め！

    王
    ブランシュ、もう一度、言って！

    ブランシュ（目を伏せて）
    聞いたでしょう。ご存じのくせに。

    王（夢中でまた抱きしめる）
    私は幸せだ！

    ブランシュ
    私は、もうおしまい！

    王
    いや、私と一緒に幸せになる！

    ブランシュ（腕から身を振りほどいて）
    あなたがどなたかも知らないわ。
    お名前を教えて。

    ベラルド（奥で独白）
    今ごろ気がついたのね！

    ブランシュ
    まさか、領主様や貴族ではないでしょう？
    父はあの人たちを、あんなに恐れているの！

    王
    とんでもない、違う。私の名は……

    独白。

    さて、どうする？

    考える。

    ゴーシェ・マイエ。ひどく貧しい学生だ！

    ベラルド（ちょうど、王からもらった金を数えて）
    よくもまあ、そんな嘘を！

    外套にくるまり、光を隠せる提灯を手にしたピエンヌとパルダイヤンが通りへ入る。

    ピエンヌ（パルダイヤンに小声で）
    ここだ、騎士殿！

    ベラルド（小声で、慌てて露台から下りて）
    外に誰かいる音がします。

    ブランシュ（怯えて）
    お父様かもしれない！

    ベラルド（王に）
    お帰りください！

    王
    邪魔をする不届き者め、
    この手で捕まえられたら！

    ブランシュ（ベラルドに）
    早く河岸の戸からお通しして。

    王（ブランシュに）
    何と、もうお別れか！
    明日も愛してくれる？

    ブランシュ
    あなたは？

    王
    一生ずっと！

    ブランシュ
    ああ、あなたは私を騙すわ。私が父を騙しているのだから。

    王
    決して！　ブランシュ、美しい目へ、ただ一つ接吻を。

    ベラルド（独白）
    とことん、接吻に夢中な方ね！

    ブランシュ（少し抵抗して）
    いや、いや！

    王は娘に接吻し、ベラルドと家へ入る。
    ブランシュは、王が消えた戸口をしばらく見つめてから、自分も入る。その間、通りには、外套を着て仮面をつけた、武装した貴族たちが集まる。ゴルド、コセ、モンシュニュ、ブリオン、モンモランシー、クレマン・マロが、次々とピエンヌとパルダイヤンに合流する。ひどく暗い夜。彼らの提灯は覆いを閉じてある。互いに合図で確かめ合い、ブランシュの家を指し示す。従僕が梯子を担いでついてくる。

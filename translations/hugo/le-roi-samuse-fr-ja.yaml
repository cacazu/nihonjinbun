"segments":
- "id": "roi-001"
  "section_id": "frontmatter"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "1832"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 1
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[1]"
  "translation_ja": "一八三二年"
  "translation_status": "reviewed"
- "id": "roi-002"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'apparition de ce drame au théâtre a donné lieu à un acte ministériel inouï."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 2
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[2]"
  "translation_ja": "この戯曲が舞台に登場したことから、前代未聞の大臣命令が発せられた。"
  "translation_status": "reviewed"
- "id": "roi-003"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le lendemain de la première représentation, l'auteur reçut de monsieur Jouslin de la Salle, directeur de la scène au Théâtre-Français, le billet suivant, dont il conserve précieusement l'original:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 3
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[3]"
  "translation_ja": "初演の翌日、作者はテアトル＝フランセの舞台監督ジュスラン・ド・ラ・サル氏から、次の書状を受け取った。その原本は大切に保管している。"
  "translation_status": "reviewed"
- "id": "roi-004"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "«Il est dix heures et demie, et je reçois à l'instant l'ordre[1] de suspendre les représentations du Roi s'amuse."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 4
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[4]"
  "translation_ja": "「ただいま十時半です。たったいま、『王は楽しむ』の上演を中止せよとの命令[1]を受け取りました。"
  "translation_status": "reviewed"
- "id": "roi-005"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "«C'est monsieur Taylor qui me communique cet ordre de la part du ministre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 5
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[5]"
  "translation_ja": "「テイラー氏が、大臣からのこの命令を私に伝えてきたのです。"
  "translation_status": "reviewed"
- "id": "roi-006"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "«Ce 23 novembre.»"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 6
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[6]"
  "translation_ja": "「十一月二十三日」"
  "translation_status": "reviewed"
- "id": "roi-007"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le premier mouvement de l'auteur fut de douter. L'acte était arbitraire au point d'être incroyable."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 7
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[7]"
  "translation_ja": "作者は、まず耳を疑った。その措置は、あまりに専横で、信じがたいほどだった。"
  "translation_status": "reviewed"
- "id": "roi-008"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "En effet, ce qu'on a appelé la Charte-Vérité dit: «Les Français ont le droit de publier» Remarquez que le texte ne dit pas seulement le droit d'imprimer, mais largement et grandement le droit de publier. Or, le théâtre n'est qu'un moyen de publication comme la presse, comme la gravure, comme la lithographie. La liberté du théâtre est donc implicitement écrite dans la Charte, avec toutes les autres libertés de la pensée. La loi fondamentale ajoute: «La censure ne pourra jamais être rétablie.» Or, le texte ne dit pas la censure des journaux, la censure des livres, il dit la censure, la censure en général, toute censure, celle du théâtre comme celle des écrits. Le théâtre ne saurait donc désormais être légalement censuré."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 8
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[8]"
  "translation_ja": "実際、いわゆる「真実の憲章」には、「フランス人は公表する権利を持つ」とある。条文が単に印刷する権利と言わず、広く大きく、公表する権利と言っていることに注意してほしい。演劇も、新聞や銅版画や石版画と同じく、公表の一手段にすぎない。したがって演劇の自由も、思想に関するほかのあらゆる自由とともに、憲章に含まれているのである。この国の基本法は、さらに「検閲は、いかなる場合にも再び設けることができない」と付け加える。条文は新聞の検閲とも、書籍の検閲とも言っていない。検閲と言っているのだ。検閲一般、あらゆる検閲、文書の検閲と同じく演劇の検閲をも指す。ゆえに、今後演劇を合法的に検閲することはできない。"
  "translation_status": "reviewed"
- "id": "roi-009"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ailleurs la Charte dit: La confiscation est abolie. Or, la suppression d'une pièce de théâtre après la représentation n'est pas seulement un acte monstrueux de censure et d'arbitraire, c'est une véritable confiscation, c'est une propriété violemment dérobée au théâtre et à l'auteur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 9
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[9]"
  "translation_ja": "憲章の別の箇所には、「没収は廃止する」とある。ところが、上演された後の戯曲を禁止するのは、検閲と専横の怪物じみた行為であるばかりか、まさしく没収であり、劇場と作者から力ずくで財産を奪うことにほかならない。"
  "translation_status": "reviewed"
- "id": "roi-010"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Enfin, pour que tout soit net et clair, pour que les quatre ou cinq grands principes sociaux que la Révolution française a coulés en bronze restent intacts sur leurs piédestaux de granit, pour qu'on ne puisse attaquer sournoisement le droit commun des Français avec ces quarante mille vieilles armes ébréchées que la rouille et la désuétude dévorent dans l'arsenal de nos lois, la Charte, dans un dernier article, abolit expressément tout ce qui, dans les lois antérieures, serait contraire à son texte et à son esprit."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 10
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[10]"
  "translation_ja": "最後に、何もかもを明白にするため、フランス革命が青銅に鋳込んだ四つか五つの社会の大原則を、花崗岩の台座の上に傷つけず保つため、また、法の武器庫で錆と時代遅れに食い荒らされている四万本もの刃こぼれした古い武器を使って、フランス人に共通の権利をこっそり攻撃できないようにするため、憲章はその最終条項で、従来の法律のうち、その条文と精神に反するすべてを明文で廃止している。"
  "translation_status": "reviewed"
- "id": "roi-011"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ceci est formel. La suppression ministérielle d'une pièce de théâtre attente à la liberté par la censure, à la propriété par la confiscation. Tout notre droit public se révolte contre une pareille voie de fait."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 11
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[11]"
  "translation_ja": "これは明確である。大臣が戯曲を禁止することは、検閲によって自由を、没収によって財産を侵害する行為だ。わが国の公法の全体が、こうした不法な実力行使に抗議する。"
  "translation_status": "reviewed"
- "id": "roi-012"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'auteur, ne pouvant croire à tant d'insolence et de folie, courut au théâtre. Là, le fait lui fut confirmé de toutes parts. Le ministre avait, en effet, de son autorité privée, de son droit divin de ministre, intimé l'ordre en question. Le ministre n'avait pas de raison à donner. Le ministre avait pris sa pièce, lui avait pris son droit, lui avait pris sa chose. Il ne restait plus qu'à le mettre, lui poëte, à la Bastille."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 12
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[12]"
  "translation_ja": "これほどの傲慢と狂気を信じられず、作者は劇場へ駆けつけた。そこで誰に聞いても、事実だと確かめられた。大臣は実際に、個人の権威で、大臣の神授の権利によって、問題の命令を下していた。大臣は理由を説明する必要もなかった。大臣は作者の戯曲を奪い、その権利を奪い、その所有物を奪った。あとは詩人である彼自身を、バスティーユへ投げ込めば済むことだった。"
  "translation_status": "reviewed"
- "id": "roi-013"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous le répétons, dans le temps où nous vivons lorsqu'un pareil acte vient vous barrer le passage et vous prendre brusquement au collet, la première impression est un profond étonnement. Mille questions se pressent dans votre esprit.—Où est la loi? Où est le droit? Est-ce que cela peut se passer ainsi? Est-ce qu'il y a eu, en effet, quelque chose qu'on a appelé la Révolution de juillet? Il est évident que nous ne sommes plus à Paris. Dans quel pachalik vivons-nous?—"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 13
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[13]"
  "translation_ja": "繰り返すが、私たちの生きるこの時代に、こうした行為が道をふさぎ、不意に襟首をつかんできたとき、最初に覚えるのは深い驚きである。頭の中に無数の問いが押し寄せる。――法律はどこにある。権利はどこにある。こんなことがまかり通るのか。そもそも、七月革命と呼ばれた出来事は本当にあったのか。ここがもはやパリでないのは明らかだ。私たちは、どこの太守の領国に暮らしているのだろう。――"
  "translation_status": "reviewed"
- "id": "roi-014"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La Comédie-Française, stupéfaite et consternée, voulut essayer encore quelques démarches auprès du ministre pour obtenir la révocation de cette étrange décision; mais elle perdit sa peine. Le divan, je me trompe, le conseil des ministres s'était assemblé dans la journée. Le 23, ce n'était qu'un ordre du ministre; le 24, ce fut un ordre du ministère. Le 23, la pièce n'était que suspendue; le 24, elle fut définitivement défendue. Il fut même enjoint au théâtre de rayer de son affiche ces quatre mots redoutables: Le Roi s'amuse Il lui fut enjoint, en outre, à ce malheureux Théâtre-Français, de ne pas se plaindre et de ne souffler mot. Peut-être serait-il beau, loyal et noble de résister à un despotisme si asiatique; mais les théâtres n'osent pas. La crainte du retrait de leurs priviléges les fait serfs et sujets, taillables et corvéables à merci, eunuques et muets."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 14
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[14]"
  "translation_ja": "驚きあきれ、うちひしがれたコメディ＝フランセーズは、この奇怪な決定を撤回してもらおうと、なおも大臣に働きかけた。しかし骨折り損だった。その日のうちにディヴァン、いや、閣議が開かれていたのである。二十三日には一大臣の命令にすぎなかったものが、二十四日には内閣の命令になった。二十三日には上演停止にすぎなかったものが、二十四日には全面的な上演禁止になった。劇場は、掲示からあの恐るべき四語、Le Roi s’amuseを消せとまで命じられた。さらに、この気の毒なテアトル＝フランセは、訴えもせず、一言も漏らすなと命じられた。こうしたアジア的な専制に抵抗することは、美しく、誠実で、気高い行為だろう。しかし劇場にはその勇気がない。特許を取り消される恐怖が、彼らを農奴や臣下にし、意のままに課税され労役に駆られる者、宦官や唖者にしてしまう。"
  "translation_status": "reviewed"
- "id": "roi-015"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "L'auteur demeura et dut demeurer étranger à ces démarches du théâtre. Il ne dépend, lui poëte, d'aucun ministre. Ces prières et ces sollicitations que son intérêt mesquinement consulté lui conseillait peut-être, son devoir de libre écrivain les lui défendait. Demander grâce au pouvoir, c'est le reconnaître. La liberté et la propriété ne sont pas choses d'antichambre. Un droit ne se traite pas comme une faveur. Pour une faveur, réclamez devant le ministre; pour un droit, réclamez devant le pays."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 15
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[15]"
  "translation_ja": "作者は、劇場のこうした陳情には関わらなかったし、関わるべきでもなかった。詩人である彼は、どの大臣にも従属しない。目先の利益だけを考えれば勧められたかもしれない嘆願や懇願も、自由な作家の義務は彼に禁じていた。権力に慈悲を求めることは、その権力を認めることだ。自由や財産は、権門の控えの間で取り扱うものではない。権利を恩恵のように扱ってはならない。恩恵を求めるなら大臣に訴えよ。権利を求めるなら国民に訴えよ。"
  "translation_status": "reviewed"
- "id": "roi-016"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est donc au pays qu'il s'adresse. Il a deux voies pour obtenir justice, l'opinion publique et les tribunaux. Il les choisit toutes deux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 16
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[16]"
  "translation_ja": "それゆえ、作者は国民に訴える。正義を得る道は二つある。世論と裁判所だ。彼はその両方を選ぶ。"
  "translation_status": "reviewed"
- "id": "roi-017"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Devant l'opinion publique, le procès est déjà jugé et gagné. Et ici l'auteur doit remercier hautement toutes les personnes graves et indépendantes de la littérature et des arts, qui lui ont donné dans cette occasion tant de preuves de sympathie et de cordialité. Il comptait d'avance sur leur appui. Il sait que, lorsqu'il s'agit de lutter pour la liberté de l'intelligence et de la pensée, il n'ira pas seul au combat."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 17
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[17]"
  "translation_ja": "世論の法廷では、裁きはすでに下り、勝訴している。ここで作者は、この一件に際して数々の共感と友情を示してくれた、文学・芸術の世界の、見識ある独立したすべての人々に、心から感謝しなければならない。その支援は初めから当てにしていた。知性と思想の自由のために闘うとき、自分だけで戦場に向かうのではないと、彼は知っている。"
  "translation_status": "reviewed"
- "id": "roi-018"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et, disons-le ici en passant, le pouvoir, par un assez lâche calcul, s'était flatté d'avoir pour auxiliaires, dans cette occasion, jusque dans les rangs de l'opposition, les passions littéraires soulevées depuis si longtemps autour de l'auteur. Il avait cru les haines littéraires plus tenaces encore que les haines politiques, se fondant sur ce que les premières ont leurs racines dans les amours-propres, et les secondes seulement dans les intérêts. Le pouvoir s'est trompé. Son acte brutal a révolté les hommes honnêtes dans tous les camps. L'auteur a vu se rallier à lui, pour faire face à l'arbitraire et à l'injustice, ceux-là même qui l'attaquaient le plus violemment la veille. Si par hasard quelques haines invétérées ont persisté, elles regrettent maintenant le secours momentané qu'elles ont apporté au pouvoir. Tout ce qu'il y a d'honorable et de loyal parmi les ennemis de l'auteur est venu lui tendre la main, quitte à recommencer le combat littéraire aussitôt que le combat politique sera fini. En France, quiconque est persécuté n'a plus d'ennemis que le persécuteur."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 18
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[18]"
  "translation_ja": "ついでに述べておこう。権力は、かなり卑劣な計算から、この機会に、長年作者の周囲で燃え続けてきた文学上の敵意を、反対派の陣営からさえ味方に引き入れられると期待していた。文学上の憎悪は自尊心に根ざすが、政治上の憎悪は利害に根ざすだけだから、前者のほうがいっそう執念深いと考えたのである。権力は間違っていた。その乱暴な行為は、あらゆる陣営の誠実な人々を憤らせた。昨日まで最も激しく作者を攻撃していた人々さえ、専横と不正に立ち向かうため、彼のもとに集まった。たまたま根深い敵意を捨てなかった者がいても、権力へ一時的な助力を与えたことを、今では後悔している。作者の敵のうち、名誉と誠実さを持つ者はみな、手を差し伸べに来た。政治の闘いが終われば、また文学の闘いを始めればよいのだ。フランスでは、迫害される者にとって、もはや敵は迫害者だけである。"
  "translation_status": "reviewed"
- "id": "roi-019"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si maintenant, après avoir établi que l'acte ministériel est odieux, inqualifiable, impossible en droit, nous voulons bien descendre pour un moment à le discuter comme fait matériel et à chercher de quels éléments ce fait semble devoir être composé, la première question qui se présente est celle-ci, et il n'est personne qui ne se la soit faite:—Quel peut être le motif d'une pareille mesure?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 19
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[19]"
  "translation_ja": "さて、この大臣の行為が憎むべく、名状しがたく、法的には許されないと明らかにしたうえで、しばし、その措置を一つの事実として検討し、どのような要素でできているのか探ってみよう。まず浮かぶ問いは、誰もが一度は自らに問うた、次の問いである。――いったい、何がこのような措置の動機なのか。"
  "translation_status": "reviewed"
- "id": "roi-020"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il faut bien le dire, parce que cela est, et que, si l'avenir s'occupe un jour de nos petits hommes et de nos petites choses, cela ne sera pas le détail le moins curieux de ce curieux événement; il paraît que nos faiseurs de censure se prétendent scandalisés dans leur morale par le Roi s'amuse; cette pièce a révolté la pudeur des gendarmes; la brigade Léotaud y était et l'a trouvée obscène; le bureau des mœurs s'est voilé la face; monsieur Vidocq a rougi. Enfin le mot d'ordre que la censure a donné à la police, et que l'on balbutie depuis quelques jours autour de nous, le voici tout net: C'est que la pièce est immorale.—Holà! mes maîtres! silence sur ce point."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 20
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[20]"
  "translation_ja": "事実なのだから、はっきり言わねばならない。後世がいつかわが国の小人物や些事を取り上げるなら、この奇妙な事件の中でも、これはひときわ奇妙な細部になるだろう。検閲を仕組む方々は、『王は楽しむ』によって道徳心を傷つけられたと称しているらしい。この芝居は憲兵たちの羞恥心を逆なでした。レオトー隊は観劇して、猥褻だと判断した。風紀係は顔を覆い、ヴィドック氏は赤面した。要するに、検閲が警察に与え、ここ数日私たちの周囲で口ごもりながら繰り返されている合言葉は、率直に言えば、こういうことだ。この芝居は不道徳だ。――おい、諸君。その話については黙ってもらおう。"
  "translation_status": "reviewed"
- "id": "roi-021"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Expliquons-nous pourtant, non pas avec la police à laquelle, moi, honnête homme, je défends de parler de ces matières, mais avec le petit nombre de personnes respectables et consciencieuses qui, sur des ouï-dire ou après avoir mal entrevu la représentation, se sont laissé entraîner à partager cette opinion, pour laquelle peut-être le nom seul du poëte inculpé aurait dû être une suffisante réfutation. Le drame est imprimé aujourd'hui. Si vous n'étiez pas à la représentation, lisez; si vous y étiez, lisez encore. Souvenez-vous que cette représentation a été moins une représentation qu'une bataille, une espèce de bataille de Monthléry (qu'on nous passe cette comparaison un peu ambitieuse) où les Parisiens et les Bourguignons ont prétendu chacun de leur côté avoir empoché la victoire, comme dit Mathieu."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 21
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[21]"
  "translation_ja": "それでも説明しておこう。ただし警察にではない。私は一人の誠実な人間として、警察がこうした事柄を論じることを禁じる。相手にするのは、ごく少数の、尊敬すべき良心的な人々である。風聞を聞いたり、上演を十分に見定められなかったりして、その意見に引きずられた人々だ。非難された詩人の名だけでも、その意見への十分な反証になったはずなのだが。いま、この戯曲は刊行された。観劇していない人は読んでほしい。観劇した人も、あらためて読んでほしい。あの上演は、芝居というより戦いだったことを思い出してほしい。いささか大げさな比較を許してもらえば、一種のモンレリの戦いだった。そこではパリ側もブルゴーニュ側も、それぞれ、マチューの言葉を借りれば、勝利を懐に収めたと主張したのである。"
  "translation_status": "reviewed"
- "id": "roi-022"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La pièce est immorale? croyez-vous? Est-ce par le fond? Voici le fond. Triboulet est difforme, Triboulet est malade, Triboulet est bouffon de cour; triple misère qui le rend méchant. Triboulet hait le roi parce qu'il est le roi, les seigneurs parce qu'ils sont les seigneurs, les hommes parce qu'ils n'ont pas tous une bosse sur le dos. Son seul passe-temps est d'entre-heurter sans relâche les seigneurs contre le roi, brisant le plus faible au plus fort. Il déprave le roi, il le corrompt, il l'abrutit; il le pousse à la tyrannie, à l'ignorance, au vice; il le lâche à travers toutes les familles des gentilshommes, lui montrant sans cesse du doigt la femme à séduire, la sœur à enlever, la fille à déshonorer. Le roi dans les mains de Triboulet n'est qu'un pantin tout-puissant qui brise toutes les existences au milieu desquelles le bouffon le fait jouer. Un jour, au milieu d'une fête, au moment même où Triboulet pousse le roi à enlever la femme de monsieur de Cossé, monsieur de Saint-Vallier pénètre jusqu'au roi et lui reproche hautement le déshonneur de Diane de Poitiers. Ce père auquel le roi a pris sa fille, Triboulet le raille et l'insulte. Le père lève le bras et maudit Triboulet. De ceci découle toute la pièce. Le sujet véritable du drame, c'est la malédiction de monsieur de Saint-Vallier. Écoutez. Vous êtes au second acte. Cette malédiction, sur qui est-elle tombée? Sur Triboulet fou du roi? Non. Sur Triboulet qui est homme, qui est père, qui a un cœur, qui a une fille. Triboulet a une fille, tout est là. Triboulet n'a que sa fille au monde; il la cache à tous les yeux, dans un quartier désert, dans une maison solitaire. Plus il fait circuler dans la ville la contagion de la débauche et du vice, plus il tient sa fille isolée et murée. Il élève son enfant dans l'innocence, dans la foi et dans la pudeur. Sa plus grande crainte est qu'elle ne tombe dans le mal, car il sait, lui méchant, tout ce qu'on y souffre. Eh bien! la malédiction du vieillard atteindra Triboulet dans la seule chose qu'il aime au monde, dans sa fille. Ce même roi que Triboulet pousse au rapt, ravira sa fille, à Triboulet. Le bouffon sera frappé par la Providence exactement de la même manière que M. de Saint-Vallier. Et puis, une fois sa fille séduite et perdue, il tendra un piége au roi pour la venger; c'est sa fille qui y tombera. Ainsi Triboulet a deux élèves, le roi et sa fille, le roi qu'il dresse au vice, sa fille qu'il fait croître pour la vertu. L'un perdra l'autre. Il veut enlever pour le roi madame de Cossé, c'est sa fille qu'il enlève. Il veut assassiner le roi pour venger sa fille, c'est sa fille qu'il assassine. Le châtiment ne s'arrête pas à moitié chemin; la malédiction du père de Diane s'accomplit sur le père de Blanche."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 22
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[22]"
  "translation_ja": "この芝居は不道徳なのか。本当にそう思うのか。題材が不道徳なのか。では、その題材を述べよう。トリブレは身体に変形があり、病み、宮廷道化である。この三重の不幸が彼を悪意ある人間にしている。彼は王を、王であるという理由で憎み、貴族を、貴族であるという理由で憎み、人々を、誰もが背中に瘤を持っているわけではないという理由で憎む。唯一の慰みは、貴族たちを絶えず王にぶつけ、弱い者を強い者によって打ち砕くことだ。彼は王を堕落させ、腐敗させ、愚鈍にする。暴政と無知と悪徳へ追いやる。誘惑すべき妻、さらうべき妹、辱めるべき娘を絶えず指さしながら、貴族のあらゆる家の中へ王を放つ。トリブレの手の中にある王は、ただ全能の操り人形にすぎず、道化に操られて動き回る先で、あらゆる人生を打ち壊す。ある日、宴のさなか、まさにトリブレがコセ氏の妻をさらうよう王をそそのかしているとき、サン＝ヴァリエ氏が王の前まで進み出て、ディアーヌ・ド・ポワチエを辱めた罪を声高に責める。娘を王に奪われたこの父を、トリブレは嘲り、侮辱する。父は腕を上げてトリブレを呪う。芝居のすべては、ここから生じる。この戯曲の本当の主題は、サン＝ヴァリエ氏の呪いなのだ。聞いてほしい。第二幕である。この呪いは誰に降りかかったのか。王の道化トリブレにか。そうではない。一人の人間、一人の父、心を持ち、娘を持つトリブレに降りかかったのだ。トリブレには娘がいる。すべてはそこにある。この世で彼には娘しかいない。人目から遠ざけ、寂しい街区の、ひっそりした家に隠している。放蕩と悪徳の伝染を街じゅうに広げるほど、いっそう娘を孤立させ、壁の内に閉じ込める。わが子を、無垢と信仰と慎みの中で育てている。何より恐れているのは、娘が悪に陥ることだ。自分は悪人だからこそ、そこでどれほど苦しむかを知っている。ところが、老人の呪いは、トリブレがこの世でただ一つ愛するもの、娘を襲うのだ。彼が誘拐へと駆り立てる、その王が、トリブレの娘をさらう。摂理は道化を、サン＝ヴァリエ氏とまったく同じ仕方で打つ。さらに、娘が誘惑され、身を破滅させたのち、彼は娘の仇を討つため王に罠を仕掛ける。そこへ落ちるのも娘なのだ。こうしてトリブレには二人の教え子がいる。王と娘だ。王を悪へと仕込み、娘を徳のために育てる。一方が他方を破滅させる。王のためにコセ夫人をさらおうとすれば、自分の娘をさらってしまう。娘の仇を討つため王を殺そうとすれば、自分の娘を殺してしまう。懲罰は途中で止まらない。ディアーヌの父の呪いは、ブランシュの父の上に成就する。"
  "translation_status": "reviewed"
- "id": "roi-023"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sans doute ce n'est pas à nous de décider si c'est là une idée dramatique, mais à coup sûr c'est là une idée morale."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 23
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[23]"
  "translation_ja": "これが劇的な着想かどうかを決めるのは、むろん私たちではない。しかし、道徳的な着想であることは確かだ。"
  "translation_status": "reviewed"
- "id": "roi-024"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Au fond de l'un des autres ouvrages de l'auteur, il y a la fatalité. Au fond de celui-ci, il y a la Providence."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 24
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[24]"
  "translation_ja": "作者の別の一作品の根底には宿命がある。この作品の根底には摂理がある。"
  "translation_status": "reviewed"
- "id": "roi-025"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous le redisons expressément, ce n'est pas avec la police que nous discutons ici, nous ne lui faisons pas tant d'honneur, c'est avec la partie du public à laquelle cette discussion peut sembler nécessaire. Poursuivons."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 25
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[25]"
  "translation_ja": "明言して繰り返すが、ここで議論している相手は警察ではない。警察にそれほどの名誉を与えはしない。この議論を必要と感じるかもしれない観客の一部が相手なのである。先へ進もう。"
  "translation_status": "reviewed"
- "id": "roi-026"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Si l'ouvrage est moral par l'invention, est-ce qu'il serait immoral par l'exécution? La question ainsi posée nous paraît se détruire d'elle-même, mais voyons. Probablement rien d'immoral au premier et au second acte. Est-ce la situation du troisième qui vous choque? lisez ce troisième acte, et dites-nous, en toute probité, si l'impression qui en résulte n'est pas profondément chaste, vertueuse et honnête?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 26
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[26]"
  "translation_ja": "着想において道徳的な作品が、表現において不道徳になりうるのか。このように問えば、問いそのものが消えてしまうように思われるが、ともかく検討しよう。第一幕と第二幕には、おそらく何も不道徳なところはない。第三幕の状況が気に障るのか。それなら第三幕を読み、そこから受ける印象が、深く清らかで、善良で、誠実なものではないかどうか、良心に照らして答えてほしい。"
  "translation_status": "reviewed"
- "id": "roi-027"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Est-ce le quatrième acte? Mais depuis quand n'est-il plus permis à un roi de courtiser sur la scène une servante d'auberge? Cela n'est même nouveau ni dans l'histoire ni au théâtre. Il y a mieux, l'histoire nous permettait de vous montrer François Ier ivre dans les bouges de la rue du Pélican. Mener un roi dans un mauvais lieu, cela ne serait pas même nouveau non plus. Le théâtre grec, qui est le théâtre classique, l'a fait; Shakspeare, qui est le théâtre romantique, l'a fait; eh bien! l'auteur de ce drame ne l'a pas fait. Il sait tout ce qu'on a écrit de la maison de Saltabadil. Mais pourquoi lui faire dire ce qu'il n'a pas dit? pourquoi lui faire franchir de force une limite qui est tout en pareil cas et qu'il n'a pas franchie? Cette bohémienne Maguelonne, tant calomniée, n'est, assurément, pas plus effrontée que toutes les Lisettes et toutes les Martons du vieux théâtre. La cabane de Saltabadil est une hôtellerie, une taverne, le cabaret de la Pomme du Pin, une auberge suspecte, un coupe-gorge, soit; mais non un lupanar. C'est un lieu sinistre, terrible, horrible, effroyable, si vous voulez, ce n'est pas un lieu obscène."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 27
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[27]"
  "translation_ja": "第四幕なのか。しかし、王が舞台で宿の女中を口説いてはいけなくなったのは、いつからだろう。それは歴史にも演劇にも、何ら目新しいことではない。それどころか、歴史に従えば、ペリカン通りのいかがわしい酒場で酔うフランソワ一世をお見せすることさえできた。王をそういう場所へ連れていくのも、決して新しくはない。古典劇たるギリシア演劇はそれをした。ロマン派の演劇たるシェイクスピアもそれをした。ところが、この戯曲の作者はしていない。サルタバディルの家について書かれたことは、すべて承知している。しかし、なぜ作者が言っていないことを言わせるのか。この種の問題では決定的な意味を持つ一線を、作者は越えていないのに、なぜ無理やり越えさせるのか。あれほど中傷されたジプシーの娘マグロンヌも、昔の芝居のリゼットやマルトンたちより厚かましいわけでは、決してない。サルタバディルの小屋は宿屋であり、酒場であり、「松かさ亭」のような居酒屋であり、怪しげな旅籠であり、人殺しの巣であってもよい。しかし、売春宿ではない。不吉で、恐ろしく、おぞましく、ぞっとする場所と呼ぶのはかまわないが、猥褻な場所ではない。"
  "translation_status": "reviewed"
- "id": "roi-028"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Restent donc les détails du style. Lisez[2]. L'auteur accepte pour juges de la sévérité austère de son style les personnes mêmes qui s'effarouchent de la nourrice de Juliette et du père d'Ophélia, de Beaumarchais et de Regnard, de l'École des Femmes et d'Amphitrion, de Dandin et de Sganarelle, et de la grande scène du Tartufe, du Tartufe, accusé aussi d'immoralité dans son temps! seulement, là où il fallait être franc, il a cru devoir l'être, à ses risques et périls, mais toujours avec gravité et mesure. Il veut l'art chaste, et non l'art prude."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 28
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[28]"
  "translation_ja": "すると残るのは、文体の細部だ。読んでほしい[2]。作者は、自分の文体の厳しく慎ましい性格を裁く者として、ジュリエットの乳母やオフィーリアの父、ボーマルシェやルニャール、『女房学校』や『アンフィトリヨン』、ダンダンやスガナレル、さらには『タルチュフ』のあの大場面に眉をひそめる人々をも受け入れる。その『タルチュフ』も、当時は不道徳だと非難された作品なのだ。ただ、率直であるべき箇所では、自分の責任と危険において、率直でなければならないと考えた。しかし、つねに真剣さと節度を守っている。作者が求めるのは、清らかな芸術であり、貞淑ぶった芸術ではない。"
  "translation_status": "reviewed"
- "id": "roi-029"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "La voilà pourtant cette pièce contre laquelle le ministère cherche à soulever tant de préventions! Cette immoralité, cette obscénité, la voilà mise à nu. Quelle pitié! Le pouvoir avait ses raisons cachées, et nous les indiquerons tout à l'heure, pour ameuter contre le Roi s'amuse le plus de préjugés possible. Il aurait bien voulu que le public en vînt à étouffer cette pièce sans l'entendre pour un tort imaginaire, comme Othello étouffe Desdémona. Honest Iago!"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 29
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[29]"
  "translation_ja": "ところが、内閣がこれほど多くの偏見を煽り立てようとしているのは、この芝居なのである。問題の不道徳、問題の猥褻とは、こういうものだったのだ。なんという情けなさか。権力には、できるだけ多くの先入観を『王は楽しむ』へけしかける、隠れた理由があった。それはあとで示そう。権力は、観客が芝居を聞きもせず、架空の罪のために窒息させることを望んでいた。オセロがデズデモーナを絞め殺すように。正直者のイアーゴよ！"
  "translation_status": "reviewed"
- "id": "roi-030"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mais comme il se trouve qu'Othello n'a pas étouffé Desdémona, c'est Iago qui se démasque et qui s'en charge. Le lendemain de la représentation, la pièce est défendue par ordre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 30
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[30]"
  "translation_ja": "だが、オセロがデズデモーナを絞め殺さなかったものだから、イアーゴ自身が仮面を脱ぎ、その役を引き受けた。上演の翌日、芝居は命令によって禁止されたのである。"
  "translation_status": "reviewed"
- "id": "roi-031"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Certes, si nous daignions descendre encore un instant à accepter pour une minute cette fiction ridicule, que dans cette occasion c'est le soin de la morale publique qui émeut nos maîtres, et que, scandalisés de l'état de licence où certains théâtres sont tombés depuis deux ans, ils ont voulu à la fin, poussés à bout, faire, à travers toutes les lois et tous les droits, un exemple sur un ouvrage et sur un écrivain, certes, le choix de l'ouvrage serait singulier, il faut en convenir, mais le choix de l'écrivain ne le serait pas moins. Et, en effet, quel est l'homme auquel ce pouvoir myope s'attaque si étrangement? C'est un écrivain ainsi placé que, si son talent peut être contesté de tous, son caractère ne l'est de personne. C'est un honnête homme avéré, prouvé et constaté, chose rare et vénérable en ce temps-ci."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 31
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[31]"
  "translation_ja": "確かに、もう少しだけ身を低めて、あの馬鹿げた作り話を一分間だけ受け入れてみよう。今回、ご主人様方を動かしたのは公衆道徳への配慮で、この二年間にいくつかの劇場が陥った放縦に憤り、ついに我慢も限界に達し、法律も権利も踏みにじって一つの作品と一人の作家を見せしめにしたかった、という話だ。その場合、作品の選び方が奇妙であることは認めねばならないが、作家の選び方もそれに劣らず奇妙である。この近視眼の権力が、こんな奇妙な仕方で襲いかかる相手は、いったいどんな人間なのか。才能なら誰もが疑ってよいが、品性は誰も疑わない立場にある作家だ。誠実な人間であると認められ、証明され、確かめられた男なのである。今の時代には珍しく、尊ぶべきことだ。"
  "translation_status": "reviewed"
- "id": "roi-032"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "C'est un poëte que cette même licence des théâtres révolterait et indignerait tout le premier; qui, il y a dix-huit mois, sur le bruit que l'inquisition des théâtres allait être illégalement rétablie, est allé de sa personne, en compagnie de plusieurs autres auteurs dramatiques, avertir le ministre qu'il eût à se garder d'une pareille mesure; et qui, là, a réclamé hautement une loi répressive des excès du théâtre, tout en protestant contre la censure avec des paroles sévères que le ministre, à coup sûr, n'a pas oubliées. C'est un artiste dévoué à l'art, qui n'a jamais cherché le succès par de pauvres moyens, qui s'est habitué toute sa vie à regarder le public fixement et en face. C'est un homme sincère et modéré, qui a déjà livré plus d'un combat pour toute liberté et contre tout arbitraire, qui, en 1829, dans la dernière année de la Restauration, a repoussé tout ce que le gouvernement d'alors lui offrait pour le dédommager de l'interdit lancé sur Marion de Lorme, et qui, un an plus tard, en 1830, la Révolution de juillet étant faite, a refusé, malgré tous les conseils de son intérêt matériel, de laisser représenter cette même Marion de Lorme, tant qu'elle pourrait être une occasion d'attaque et d'insulte contre le roi tombé qui l'avait proscrite; conduite bien simple sans doute, que tout homme d'honneur eût tenue à sa place, mais qui aurait peut-être dû le rendre inviolable désormais à toute censure, et à propos de laquelle il écrivait, lui, en août 1831:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 32
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[32]"
  "translation_ja": "彼は、その同じ劇場の放縦に、誰より先に反発し、憤るはずの詩人である。十八か月前、劇場への異端審問が違法に復活するという噂を聞いたときには、ほかの数人の劇作家とともに、自ら大臣のもとへ赴き、そのような措置に手を染めないよう警告した。その席で、検閲に対して、大臣もきっと忘れていない厳しい言葉で抗議する一方、演劇の行きすぎを処罰する法律を、公然と要求したのである。彼は芸術に身を捧げる芸術家であり、卑しい手段で成功を求めたことは一度もなく、生涯、観客を正面からまっすぐ見つめることを習いとしてきた。誠実で節度ある人間であり、あらゆる自由のために、あらゆる専横に抗して、すでに幾度も闘ってきた。一八二九年、王政復古の最後の年には、『マリオン・ド・ロルム』の上演禁止を埋め合わせようと当時の政府が差し出したものを、すべて拒んだ。その一年後の一八三〇年、七月革命が成し遂げられると、同じ『マリオン・ド・ロルム』が、それを禁止した失脚した王への攻撃と侮辱の機会となりうる間は、物質的な利益がどれほど勧めようとも、上演を認めなかった。むろん、ごく当然の行いであり、その立場に置かれた名誉ある人間なら誰でもそうしただろう。しかし、それによって以後いかなる検閲にも侵されない者となってしかるべきだったかもしれない。この行いに関連して、彼は一八三一年八月に、こう書いている。"
  "translation_status": "reviewed"
- "id": "roi-033"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "«Les succès de scandale cherché et d'allusions politiques ne lui sourient guère, il l'avoue. Ces succès valent peu et durent peu. Et puis, c'est précisément quand il n'y a plus de censure qu'il faut que les auteurs se censurent eux-mêmes, honnêtement, consciencieusement, sévèrement. C'est ainsi qu'ils placeront haut la dignité de l'art. Quand on a toute liberté, il sied de garder toute mesure[3].»"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 33
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[33]"
  "translation_ja": "「告白すれば、わざと醜聞を起こしたり、政治上の当てこすりを使ったりして得る成功には、ほとんど心が動かない。そうした成功は価値も乏しく、長続きもしない。それに、検閲がなくなったときこそ、作者たちは誠実に、良心的に、厳しく、自らを検閲しなければならない。そうしてこそ、芸術の尊厳を高く保てる。自由が余すところなく与えられているなら、節度も余すところなく守るのがふさわしい[3]。」"
  "translation_status": "reviewed"
- "id": "roi-034"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Jugez maintenant. Vous avez d'un côté l'homme et son œuvre; de l'autre le ministère et ses actes."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 34
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[34]"
  "translation_ja": "さあ、判断してほしい。一方にはこの人間とその作品があり、他方には内閣とその行為がある。"
  "translation_status": "reviewed"
- "id": "roi-035"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À présent que la prétendue immoralité de ce drame est réduite à néant, à présent que tout l'échafaudage des mauvaises et honteuses raisons est là, gisant sous nos pieds, il serait temps de signaler le véritable motif de la mesure, le motif d'antichambre, le motif de cour, le motif secret, le motif qu'on ne dit pas, le motif qu'on n'ose s'avouer à soi-même, le motif qu'on avait si bien caché sous un prétexte. Ce motif a déjà transpiré dans le public, et le public a deviné juste. Nous n'en dirons pas davantage. Il est peut-être utile à notre cause que ce soit nous qui offrions à nos adversaires l'exemple de la courtoisie et de la modération. Il est bon que la leçon de dignité et de sagesse soit donnée par le particulier au gouvernement, par celui qui est persécuté à celui qui persécute. D'ailleurs nous ne sommes pas de ceux qui pensent guérir leur blessure en empoisonnant la plaie d'autrui. Il n'est que trop vrai qu'il y a au troisième acte de cette pièce un vers où la sagacité maladroite de quelques familiers du palais a découvert une allusion (je vous demande un peu, moi, une allusion!) à laquelle ni le public ni l'auteur n'avaient songé jusque-là, mais qui, une fois dénoncée de cette façon, devient la plus cruelle et la plus sanglante des injures. Il n'est que trop vrai que ce vers a suffi pour que l'affiche déconcertée du Théâtre-Français reçût l'ordre de ne plus offrir une seule fois à la curiosité du public la petite phrase séditieuse: le Roi s'amuse. Ce vers, qui est un fer rouge, nous ne le citerons pas ici; nous ne le signalerons même ailleurs qu'à la dernière extrémité, et si l'on est assez imprudent pour y acculer notre défense. Nous ne ferons pas revivre de vieux scandales historiques. Nous épargnerons autant que possible à une personne haut placée les conséquences de cette étourderie de courtisan. On peut faire, même à un roi, une guerre généreuse. Nous entendons la faire ainsi. Seulement, que les puissants méditent sur l'inconvénient d'avoir pour ami l'ours qui ne sait écraser qu'avec le pavé de la censure les allusions imperceptibles qui viennent se poser sur leur visage."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 35
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[35]"
  "translation_ja": "この戯曲のいわゆる不道徳性が跡形もなく消え、浅ましく恥ずべき口実の足場がすっかり私たちの足元へ崩れ落ちた今こそ、この措置の本当の動機を指し示すべき時だろう。控えの間の動機、宮廷の動機、秘密の動機、口には出さない動機、自分にさえ打ち明ける勇気のない動機、口実の下へあれほど巧みに隠していた動機である。その動機はすでに世間へ漏れ出し、世間は正しく察した。それ以上は言うまい。敵対者たちに礼節と節度の手本を示すのが私たちであることは、この主張にとって有益かもしれない。尊厳と分別の教えを、一私人が政府へ、迫害される者が迫害する者へ与えるのはよいことだ。それに私たちは、他人の傷口に毒を塗れば自分の傷が治ると考える者ではない。残念ながら、第三幕のある一行に、宮廷の取り巻き数人の不器用な鋭敏さが、当てこすりを見いだしたのは事実だ。私が当てこすりをしたというのか！　それまで観客も作者も思いもしなかったものだが、そう告げ口されてしまうと、それは最も残酷で血なまぐさい侮辱になる。そして、その一行だけで、うろたえたテアトル＝フランセの掲示は、あのささやかな不穏の文句、『王は楽しむ』を、二度と観客の目に触れさせぬよう命じられたのも事実なのである。その焼け火箸のような一行を、ここで引用しはしない。ほかの場でも、最後の最後まで追い詰められ、相手が無分別にもこちらの弁護をそこへ追い込んだ場合にしか、指し示さない。古い歴史上の醜聞を蒸し返しはしない。ある高位の人に対しても、廷臣のこの軽率さがもたらす結果を、できるかぎり及ぼさないようにしよう。王に対してさえ、寛大な戦いはできる。私たちはそうするつもりだ。ただ、権勢を持つ方々は、顔に止まった目にも見えぬ当てこすりを、検閲という敷石でしか叩き潰せない熊を友とすることの不都合を、よく考えるがよい。"
  "translation_status": "reviewed"
- "id": "roi-036"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nous ne savons même pas si nous n'aurons pas dans la lutte quelque indulgence pour le ministère lui-même. Tout ceci, à vrai dire, nous inspire une grande pitié. Le gouvernement de juillet est tout nouveau né, il n'a que trente-trois mois, il est encore au berceau, il a de petites fureurs d'enfant. Mérite-t-il en effet qu'on dépense contre lui beaucoup de colère virile? Quand il sera grand, nous verrons."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 36
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[36]"
  "translation_ja": "この闘いの中で、内閣そのものにさえ、多少の寛容さを持ってしまうかどうか、私たちにもわからない。正直なところ、この一件は大きな憐れみを催させる。七月政府は生まれたばかりだ。まだ三十三か月、揺りかごの中にいて、子供らしい小さな癇癪を起こしている。こんな相手に、男一人前の怒りをたっぷり使う値打ちが、本当にあるだろうか。大きくなったら考えよう。"
  "translation_status": "reviewed"
- "id": "roi-037"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cependant, à n'envisager la question, pour un instant, que sous le point de vue privé, la confiscation censoriale dont il s'agit cause encore plus de dommage peut-être à l'auteur de ce drame qu'à tout autre. En effet, depuis quatorze ans qu'il écrit, il n'est pas un de ses ouvrages qui n'ait eu l'honneur malheureux d'être choisi pour champ de bataille à son apparition, et qui n'ait disparu d'abord pendant un temps plus ou moins long sous la poussière, la fumée et le bruit. Aussi, quand il donne une pièce au théâtre, ce qui lui importe avant tout, ne pouvant espérer un auditoire calme dès la première soirée, c'est la série des représentations. S'il arrive que le premier jour sa voix soit couverte par le tumulte, que sa pensée ne soit pas comprise, les jours suivants peuvent corriger le premier jour. Hernani a eu cinquante-trois représentations; Marion de Lorme a eu soixante et une représentations; le Roi s'amuse, grâce à une violence ministérielle, n'aura eu qu'une représentation. Assurément le tort fait à l'auteur est grand. Qui lui rendra intacte et au point où elle en était cette troisième expérience si importante pour lui? Qui lui dira de quoi eût été suivie cette première représentation? Qui lui rendra le public du lendemain, ce public ordinairement impartial, ce public sans amis et sans ennemis, ce public qui enseigne le poëte et que le poëte enseigne?"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 37
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[37]"
  "translation_ja": "しかし、しばし問題を私人としての立場からだけ眺めるなら、今回の検閲による没収は、ほかの誰にも増して、この戯曲の作者に損害を与えているかもしれない。筆を執って十四年になるが、彼の作品は一つとして、世に出るときに戦場に選ばれるという不幸な名誉を受けずに済んだものはなく、多少の長短はあれ、まず埃と煙と騒音の下へ姿を消さなかったものはない。だから彼が劇場に戯曲を出すとき、初日の夜から穏やかな観客を望めない以上、何より大切なのは、その後も上演を重ねることだ。初日には声が騒ぎにかき消され、思想が理解されなくても、その後の日々が初日の誤りを正せる。『エルナニ』は五十三回上演された。『マリオン・ド・ロルム』は六十一回上演された。『王は楽しむ』は、大臣の暴力のおかげで、たった一回の上演で終わることになる。作者の被った不利益が大きいことは確かだ。彼にとってこれほど大切な三度目の試みを、誰が傷つけず、元の段階へ返してくれるのか。あの初演の後に何が起きたはずなのか、誰が教えてくれるのか。翌日の観客を誰が返してくれるのか。普通なら公平で、味方でも敵でもなく、詩人を教え、詩人に教えられる、あの観客を。"
  "translation_status": "reviewed"
- "id": "roi-038"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Le moment de transition politique où nous sommes est curieux. C'est un de ces instants de fatigue générale où tous les actes despotiques sont possibles dans la société même la plus infiltrée d'idées d'émancipation et de liberté. La France a marché vite en juillet 1830; elle a fait trois bonnes journées; elle a fait trois grandes étapes dans le champ de la civilisation et du progrès. Maintenant beaucoup sont essoufflés, beaucoup demandent à faire halte. On veut retenir les esprits généreux qui ne se lassent pas et qui vont toujours. On veut attendre les tardifs qui sont restés en arrière et leur donner le temps de rejoindre. De là une crainte singulière de tout ce qui marche, de tout ce qui remue, de tout ce qui parle, de tout ce qui pense. Situation bizarre, facile à comprendre, difficile à définir. Ce sont toutes les existences qui ont peur de toutes les idées. C'est la ligue des intérêts froissés du mouvement des théories. C'est le commerce qui s'effarouche des systèmes; c'est le marchand qui veut vendre; c'est la rue qui effraye le comptoir; c'est la boutique armée qui se défend."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 38
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[38]"
  "translation_ja": "私たちのいる政治の過渡期は、奇妙な時期だ。解放と自由の思想が最も深く浸透した社会でさえ、あらゆる専制的な行為が可能になる、全般的な疲労のひとときなのである。フランスは一八三〇年七月に速く歩いた。見事な三日間を成し遂げ、文明と進歩の野を三つの大きな行程で進んだ。今、多くの人が息を切らし、多くの人が休止を求めている。疲れを知らず進み続ける寛大な精神の持ち主を引き止めようとする。後ろに取り残された遅い者を待ち、追いつく時間を与えようとする。そこから、進むもの、動くもの、語るもの、考えるものすべてへの、奇妙な恐れが生まれる。理解しやすく、定義しにくい、異様な状況だ。あらゆる暮らしが、あらゆる思想を恐れている。理論の動きに傷つけられた利害の同盟だ。思想体系に怯える商業であり、売りたい商人であり、通りが店の勘定台を脅かすことであり、武装して身を守る店なのだ。"
  "translation_status": "reviewed"
- "id": "roi-039"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "À notre avis, le gouvernement abuse de cette disposition au repos et de cette crainte des révolutions nouvelles. Il en est venu à tyranniser petitement. Il a tort pour lui et pour nous. S'il croit qu'il y a maintenant indifférence dans les esprits pour les idées de liberté, il se trompe; il n'y a que lassitude. Il lui sera demandé sévèrement compte un jour de tous les actes illégaux que nous voyons s'accumuler depuis quelque temps. Que de chemin il nous a fait faire! Il y a deux ans on pouvait craindre pour l'ordre, on en est maintenant à trembler pour la liberté. Des questions de libre pensée, d'intelligence et d'art, sont tranchées impérialement par les vizirs du roi des barricades."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 39
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[39]"
  "translation_ja": "私たちの考えでは、政府は、この休息を求める気分と、新しい革命への恐れにつけ込んでいる。小さな暴政を振るうまでになった。政府自身のためにも、私たちのためにも、これは誤りだ。今、人々が自由の思想に無関心になっていると思うなら、間違っている。あるのは疲労だけだ。近ごろ積み重なるのを目にしているすべての違法行為について、いつか政府は厳しく責任を問われるだろう。なんという道を私たちに歩ませたことか。二年前には秩序が心配されたのに、今では自由を思って震えねばならない。思想の自由、知性、芸術に関する問題を、バリケードの王に仕える宰相たちが、皇帝のように裁断している。"
  "translation_status": "reviewed"
- "id": "roi-040"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Il est profondément triste de voir comment se termine la Révolution de juillet, mulier formosa supernè."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 40
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[40]"
  "translation_ja": "上半身は美しい女であった七月革命が、いったいどんな結末を迎えるのか。それを見るのは、このうえなく悲しい。"
  "translation_status": "reviewed"
- "id": "roi-041"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sans doute, si l'on ne considère que le peu d'importance de l'ouvrage et de l'auteur dont il est ici question, la mesure ministérielle qui les frappe n'est pas grand'chose. Ce n'est qu'un méchant petit coup d'État littéraire, qui n'a d'autre mérite que de ne pas trop dépareiller la collection d'actes arbitraires à laquelle il fait suite. Mais, si l'on s'élève plus haut, on verra qu'il ne s'agit pas seulement dans cette affaire d'un drame et d'un poëte, mais, nous l'avons dit en commençant, que la liberté et la propriété sont toutes deux, sont tout entières engagées dans la question. Ce sont là de hauts et sérieux intérêts; et, quoique l'auteur soit obligé d'entamer cette importante affaire par un simple procès commercial au Théâtre-Français, ne pouvant attaquer directement le ministère, barricadé derrière les fins de non-recevoir du conseil d'État, il espère que sa cause sera aux yeux de tous une grande cause, le jour où il se présentera à la barre du tribunal consulaire, avec la liberté à sa droite et la propriété à sa gauche. Il parlera lui-même, au besoin, pour l'indépendance de son art. Il plaidera son droit fermement, avec gravité et simplicité, sans haine des personnes et sans crainte aussi. Il compte sur le concours de tous, sur l'appui franc et cordial de la presse, sur la justice de l'opinion, sur l'équité des tribunaux. Il réussira, il n'en doute pas. L'état de siége sera levé dans la cité littéraire comme dans la cité politique."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 41
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[41]"
  "translation_ja": "確かに、ここで問題にしている作品と作者の取るに足りなさだけを考えれば、それらを打つ大臣の措置も、大したものではない。卑小で悪質な文学上のクーデターにすぎず、それに先立つ専横の行為の収集物から、さほど浮いて見えないことだけが取り柄だ。しかし、もっと高いところから見れば、この事件で問題となるのが一編の戯曲と一人の詩人だけではないことがわかる。初めに述べたように、自由と財産の双方が、その全体をかけて争われているのである。それは高く重大な利益だ。国務院の門前払いの盾に守られた内閣を直接訴えることができないため、作者は、この重大な事件を、テアトル＝フランセに対する単なる商事訴訟から始めざるをえない。それでも、右手に自由を、左手に財産を従えて商事裁判所の法廷に立つ日、自分の訴えが、誰の目にも大義として映ることを望んでいる。必要なら、自分の芸術の独立のため、自ら弁論する。人への憎しみを持たず、恐れも持たず、真剣かつ率直に、揺るがず権利を主張する。すべての人の協力、新聞の率直で温かい支援、世論の正義、裁判所の公平さを頼りにしている。成功を疑ってはいない。政治の都市と同じく、文学の都市でも戒厳令は解除されるだろう。"
  "translation_status": "reviewed"
- "id": "roi-042"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quand cela sera fait, quand il aura rapporté chez lui, intacte, inviolable et sacrée, sa liberté de poëte et de citoyen, il se remettra paisiblement à l'œuvre de sa vie dont on l'arrache violemment et qu'il eût voulu ne jamais quitter un instant. Il a sa besogne à faire, il le sait, et rien ne l'en distraira. Pour le moment un rôle politique lui vient; il ne l'a pas cherché, il l'accepte. Vraiment, le pouvoir qui s'attaque à nous n'aura pas gagné grand'chose à ce que nous, hommes d'art, nous quittions notre tâche consciencieuse, tranquille, sincère, profonde, notre tâche sainte, notre tâche du passé et de l'avenir, pour aller nous mêler, indignés, offensés et sévères, à cet auditoire irrévérent et railleur qui depuis quinze ans regarde passer, avec des huées et des sifflets, quelques pauvres diables de gâcheurs politiques, lesquels s'imaginent qu'ils bâtissent un édifice social parce qu'ils vont tous les jours à grand'peine, suant et soufflant, brouetter des tas de projets de lois des Tuileries au Palais-Bourbon et du Palais-Bourbon au Luxembourg!"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "pg-29549"
    "precision": "block"
    "source_sequence": 42
    "url": "https://www.gutenberg.org/files/29549/29549-h/29549-h.htm"
    "xpath": "/html[1]/body[1]/p[42]"
  "translation_ja": "それが成し遂げられ、詩人として、市民としての自由を、傷つかず、侵されず、神聖なまま家へ持ち帰ったら、作者は穏やかに生涯の仕事へ戻る。暴力によって引き離され、一瞬たりとも離れたくなかった仕事である。自分には果たすべき仕事があると知っている。何ものも、それから気をそらさせはしない。今は政治上の役割がめぐってきた。自ら求めたのではないが、引き受ける。実際、私たちを攻撃する権力も、大した得はしないだろう。芸術に携わる私たちが、良心的で、静かで、誠実で、深い仕事、神聖な仕事、過去と未来の仕事を離れ、憤り、侮辱を受け、厳しい顔をして、あの不敬で嘲り好きな観客席へ加わることになったとしても。その観客席は、十五年来、何人かの哀れな政治の下手な左官職人が通り過ぎるのを、野次と口笛で眺めている。彼らは毎日、汗を流し息を切らし、苦労して、チュイルリーからブルボン宮へ、ブルボン宮からリュクサンブールへと、法案の山を手押し車で運んでいる。それだけで、社会という建物を築いているつもりなのだ！"
  "translation_status": "reviewed"

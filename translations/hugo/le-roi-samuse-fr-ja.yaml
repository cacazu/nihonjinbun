  "translation_ja": |-
    前場の人々。ただしトリブレはいない。

    サルタバディル（一人残り、サン＝ジェルマンの方から雲に覆われる空を眺める。ほぼ夜。ときおり稲光）
    嵐が来る。町はもう、ほとんど雲の下だ。
    結構だ！　これで後には、河原にいっそう人けがなくなる。

    考えて。

    どう考えても、こいつら皆、
    何だかわからない事情を抱えているらしい。
    それ以上は見当がつかん、驢馬に蹴られちまえ！

    首を振りながら空を見る。その間、王はマグロンヌと戯れる。

    王（腰を抱こうとして）
    マグロンヌ！

    マグロンヌ（逃れて）
    待って！

    王
    ああ、意地悪な娘だ！

    マグロンヌ（歌う）
    四月に伸びる葡萄の芽、
    樽に満ちる酒は少ない。

    王
    何という肩、何という腕だ、愛らしい敵よ、
    何と白い！　ユピテルよ、すばらしい体だ！
    こんな美しい裸の腕を作った神が、
    なぜヴィーナスの体へ、トルコ人の心を入れたのだ？

    マグロンヌ
    ラリラ、ランラ！

    また王を押し返して。

    駄目よ。兄が来る。

    サルタバディルが入り、後ろ手に戸を閉める。

    王
    かまうものか！

    遠い雷鳴。

    マグロンヌ
    雷だわ。

    サルタバディル
    見事な降り方になりますよ。

    王（サルタバディルの肩を叩いて）
    よし、降るがいい！
    今夜はお前の部屋を宿にしよう。

    マグロンヌ
    それが御意なの？
    王様みたいな口ぶりね！　旦那、ご家族が心配するわ。

    サルタバディルは妹の腕を引き、合図する。

    王
    祖母も娘もいないし、
    何も気にかけるものはない。

    サルタバディル（独白）
    ますます結構だ！

    大粒の雨が落ち始める。真っ暗な夜。

    王（サルタバディルに）
    お前は馬小屋でも、地獄でも、
    好きなところで寝るがよい。

    サルタバディル（一礼して）
    ありがとうございます。

    マグロンヌ（灯りをともしながら、王に、ひどく小声で急いで）
    帰って！

    王（大笑いし、大声で）
    雨だぞ。詩人だって追い出せない天気に、
    出ていけと言うのか？

    窓の外を見る。

    サルタバディル（手の金を見せ、マグロンヌに小声で）
    泊まらせておけ！　金貨十枚だぞ！
    しかも真夜中に、もう十枚だ。

    王へ愛想よく。

    今夜、私の部屋を閣下にお貸しできれば、
    このうえない幸せです！

    王（笑って）
    七月には焼かれ、代わりに十二月には
    凍える部屋だろう、どうだ？

    サルタバディル
    ご覧になりますか？

    王
    見よう。

    サルタバディルは灯りを持つ。王はマグロンヌの耳へ笑いながら二言ほどささやく。それから二人は上階へ通じる梯子を上がる。サルタバディルが先に立つ。

    マグロンヌ（一人残って）
    かわいそうな若い方！

    窓へ行って。

    ああ神様、何て暗いの！

    上の天窓から、屋根裏のサルタバディルと王が見える。

    サルタバディル（王に）
    寝床はこちら、椅子はこちら、それから卓です。

    王
    脚は全部で何本ある？

    寝床、卓、椅子を順に見て。

    三、六、九……お見事！
    お前の家具はマリニャーノへ出征したのか？
    どれもこれも、びっこを引いている！

    ガラスの割れた天窓へ近づく。

    それに、寝るのは野外だ。
    ガラスも鎧戸もない。入りたい風に、
    これ以上礼儀正しいもてなしはできまい！

    卓上に常夜灯をともしたサルタバディルへ。

    では、お休み。

    サルタバディル
    神様がお守りくださるように！

    出て、戸を押しやる。ゆっくり階段を下りる音。

    王（一人で、剣帯を外しながら）
    ああ、疲れた、まったく！
    ひとまず、もっとよいことがあるまで、少し眠ろう。

    帽子と剣を椅子へ置き、長靴を脱いで、寝床へ横になる。

    あのマグロンヌは、何とみずみずしく、活発で、すばしこい！

    身を起こして。

    戸は開けていっただろうな。
    うん、よし！

    また横になると、たちまち粗末な寝床で熟睡する。その間、マグロンヌとサルタバディルは階下の部屋にいる。少し前から嵐が本格的になり、舞台を雨と稲光が覆う。絶え間なく雷鳴。マグロンヌは卓のそばへ座り、縫い物を手にしている。兄は物思いに沈んだ顔で、王の残した瓶を飲み干している。二人とも、重い考えにとらわれたように、しばらく黙る。

    マグロンヌ
    あの若い人、すてきね！

    サルタバディル
    まったくだ。
    俺の懐に金貨二十枚を入れてくれる。

    マグロンヌ
    いくら？

    サルタバディル
    二十枚。

    マグロンヌ
    あの人は、それ以上の値打ちがあったわ。

    サルタバディル
    お人形め！
    上へ行って、眠っているか見てこい。剣を持っていただろう？
    下ろしてこい。

    マグロンヌは従う。嵐は最も激しくなる。奥に、男の乗馬服、長靴、拍車をつけ、黒ずくめのブランシュが現れる。ゆっくりあばら屋へ近づく。その間、サルタバディルは飲み、マグロンヌは屋根裏で、灯りを手に眠る王を見つめる。

    マグロンヌ（涙を浮かべて）
    何て惜しいこと！

    剣を取る。

    眠っている。かわいそうな人！

    下りて、兄へ剣を持ってくる。

  "translation_ja": |-
    屋根裏で眠る王、階下の部屋のサルタバディルとマグロンヌ、外のブランシュ。

    ブランシュ（稲光を頼りに、闇の中をゆっくり進む。絶え間なく雷鳴）
    恐ろしいことが！　ああ、おかしくなってしまいそう。
    あの方は、まさにこの家で夜を過ごす。
    ああ、決定的な時が迫ってくるのを感じる。
    お父様、赦して。もうここにはいらっしゃらない。
    こうして戻ってきて、言いつけに背いている。
    でも、どうしても耐えられない。

    家に近づいて。

    いったい何をするのだろう？
    どう終わるの？　少し前まで、
    未来も、世界も、悲しみも知らず、
    花と一緒に隠れて暮らしていた、哀れな娘が、
    急にこんな暗いことの中へ投げ込まれるなんて！
    私の貞節も幸福も、ああ、みんな瓦礫！
    何もかも喪の悲しみ！　火をともした心に、
    恋は破滅しか残さないの？
    あの大火の跡には、わずかな灰だけ。
    もう愛してはくださらない！

    頭を上げて。

    さっき、物思いを通して、
    頭の上に大きな音を聞いた気がする。
    雷だったのね、きっと。恐ろしい夜！
    絶望した女に、できないことはない。
    自分の影さえ怖がっていた私なのに！

    家の灯りを見つけて。

    ああ、何が起こっているの？

    進んでから、退く。

    ここにいる間に、神様、胸が締めつけられる！
    ここで誰かが殺されたりしませんように！

    すぐそばの部屋で、マグロンヌとサルタバディルがまた話し始める。

    サルタバディル
    ひどい天気だ！

    マグロンヌ
    雨と雷。

    サルタバディル
    ああ、今ごろ天では夫婦喧嘩だ。
    片方が怒鳴り、片方が泣いている。

    ブランシュ
    今、私がどこにいるか、お父様が知ったら！

    マグロンヌ
    お兄さん！

    ブランシュ（びくりとして）
    誰かが話したみたい。

    震えながら家へ近寄り、壁の隙間に目と耳を当てる。

    マグロンヌ
    お兄さん！

    サルタバディル
    何だ？

    マグロンヌ
    ねえ、私が何を考えているか、わかる？

    サルタバディル
    いや。

    マグロンヌ
    当てて。

    サルタバディル
    知るか！

    マグロンヌ
    あの若い人、たいそう男前だわ。
    背が高く、アポロンのように誇らしげで、美しく、そのうえ色男。
    私をとても愛しているの。幼子イエスみたいに眠っている。
    殺さないでおこうよ。

    ブランシュ（すべて見聞きして）
    ああ！

    サルタバディル（櫃から古い布袋と敷石を出し、無表情に袋をマグロンヌへ差し出す）
    この古い袋を、すぐ繕ってくれ。

    マグロンヌ
    どうして？

    サルタバディル
    上でお前のアポロンを片づけたら、
    死体とこの石をさっさと入れて、
    全部、水へ投げ込むためだ。

    マグロンヌ
    でも……

    サルタバディル
    口を挟むな、マグロンヌ。

    マグロンヌ
    だけど……

    サルタバディル
    お前の言うことを聞いていたら、誰も殺せない。
    袋を直せ。

    ブランシュ
    何なの、この二人は？
    私が覗いているのは、地獄ではないの？

    マグロンヌ（袋を繕い始めて）
    従うわ。でも、話をしよう。

    サルタバディル
    いいだろう。

    マグロンヌ
    あの殿方に、恨みはないでしょう？

    サルタバディル
    俺に！　士官だぞ！
    俺も剣で身を立てているから、剣を持つ奴は好きだ。

    マグロンヌ
    ただ者ではない美男を殺すなんて、
    Ｓの字みたいな、醜い背曲がりのために！

    サルタバディル
    結局のところ、背曲がりから美男殺しを頼まれ、
    俺にはまったく同じことだが、
    まず十枚の金貨を受け取った。
    死んだ男を渡せば、もう十枚もらえる。
    渡すんだ。明快だろう。

    マグロンヌ
    小男が全額持って戻ってきたとき、
    そっちを殺せばいい。
    同じことになるわ。

    ブランシュ
    ああ、お父様！

    マグロンヌ
    決まり？

    サルタバディル（妹をまっすぐ見て）
    何だ、お前は俺を何だと思う？　山賊か？
    泥棒か？　金を払うお客を殺すだと！

    マグロンヌ（薪の束を指して）
    じゃあ、この薪束を袋へ入れなさいよ。
    暗ければ、死体だと思うでしょう。

    サルタバディル
    よく言うぜ。
    どうやって薪を死人と思わせるんだ？
    動かず、乾いて、ひと固まりで、硬くて、
    生き物じゃないんだぞ。

    ブランシュ
    雨が、何て冷たいの！

    マグロンヌ
    あの人を助けて！

    サルタバディル
    たわ言だ！

    マグロンヌ
    優しいお兄さん！

    サルタバディル
    声を落とせ！
    死んでもらうのだ！　さあ、黙れ。

    マグロンヌ
    いやよ！
    起こして、逃がすわ。

    ブランシュ
    優しい娘！

    サルタバディル
    それで、金貨十枚は？

    マグロンヌ
    そうね。

    サルタバディル
    ほら、いい子だ。
    俺に任せておけ。

    マグロンヌ
    いや。私は助けたい！

    決然と階段の前へ立ち、兄の道をふさぐ。サルタバディルは妹の抵抗に負け、舞台の前へ戻り、すべてを丸く収める手段を考える様子。

    サルタバディル
    さて。あの男は真夜中に戻ってくる。
    それまでに、誰か、旅人でも何でも、
    泊めてくれと戸を叩いたら、
    そいつを捕まえ、殺して、お前の男の代わりに
    袋へ詰める。あいつには、わからないだろう。
    暗い中では、誰かでも何かでも、
    水へ投げ込みさえすれば、同じくらい喜ぶはずだ。
    お前にしてやれるのは、それだけだ。

    マグロンヌ
    ありがとう。
    でも、いったい誰が、ここを通るというの？

    サルタバディル
    お前の男を助ける、ただ一つの手だ。

    マグロンヌ
    こんな時刻に！

    ブランシュ
    神様、私を試しておいでなのね。死ねとお望みなのね！
    あの恩知らずのために、この一歩を踏み出さなくてはならないの？
    ああ、いや、まだ若すぎる！
    神様、私を押さないで！

    雷鳴。

    マグロンヌ
    こんな晩に誰か来るなら、
    籠で海を運んでみせるわ。

    サルタバディル
    誰も来なければ、お前の美しい若者は死ぬ。

    ブランシュ（震えて）
    恐ろしい！　夜警を呼んだら！……でも駄目、皆眠っている。
    それに、この男は父を告発してしまう。
    でも、死にたくはない。もっとすることがある。
    父の世話をし、慰めなければ。それに、
    十六になる前に死ぬなんて、恐ろしい！　できない！
    神様！　刃が胸へ入るのを感じるなんて！
    ああ！

    時計が一つ鳴る。

    サルタバディル
    妹よ、近くの時計が時を打つ。

    さらに二つ鳴る。

    十一時四十五分だ。真夜中までには
    誰も来ないだろう。外には何の物音も聞こえないな？
    片づけなければ。あと十五分しかない。

    階段に足をかける。マグロンヌが泣いて引き止める。

    マグロンヌ
    お兄さん、もう少し！

    ブランシュ
    何てこと、あの女が泣いている！
    私は助けられるのに、ここで立ったまま！
    もう愛されないのだから、死ぬしかない。
    そうよ、あの方のために死のう。

    なおもためらって。

    それでも、やっぱり恐ろしい！

    サルタバディル（マグロンヌに）
    駄目だ、もう待てない。無理なものは無理だ。

    ブランシュ
    せめて、どんなふうに刺されるか、わかっていれば！
    苦しまないのなら！　でも、額を、
    顔を刺される……ああ、神様！

    サルタバディル（引き止めるマグロンヌを、なお振りほどこうとして）
    どうしろと言うんだ？
    代わりになりに、誰か来るとでも思うのか？

    ブランシュ（雨の中で震えて）
    凍えてしまった！

    戸へ向かって。

    さあ！

    立ち止まる。

    こんなに寒いまま死ぬのね！

    よろめきながら戸まで身を引きずり、弱く叩く。

    マグロンヌ
    誰か叩いてる。

    サルタバディル
    風で屋根が軋むのだ。

    ブランシュがまた叩く。

    マグロンヌ
    叩いてるわ。

    走って小窓を開け、外を見る。

    サルタバディル
    妙だな！

    マグロンヌ（ブランシュに）
    おい、何の用？

    サルタバディルに。

    若い男よ。

    ブランシュ
    今夜、泊めてください。

    サルタバディル
    たっぷり眠ることになるぜ！

    マグロンヌ
    ええ、長い夜になるわ。

    ブランシュ
    開けて！

    サルタバディル（マグロンヌに）
    待て！　まったく！
    ナイフを寄こせ。少し研ぐ。

    妹が渡したナイフを、大鎌の刃で研ぐ。

    ブランシュ
    ああ！　二人でナイフを研ぐ音が聞こえる！

    マグロンヌ
    かわいそうな若者！　自分の墓を叩いている。

    ブランシュ
    震えるわ。
    本当に、死ぬのね！

    ひざまずいて。

    神様、今、そちらへ参ります。
    私に悪くしたすべての人を、私は赦します。
    お父様も、神様も、同じようにお赦しください。
    私が憐れみ、愛する、王フランソワ一世を、
    すべての人を、悪魔さえも、
    あそこで刃を振り上げ、闇の中で待つ、あの呪われた男さえも！
    私は、恩知らずな人のために命を捧げます。
    それであの方が幸せになるなら、ああ、私を忘れてください！
    そして、何ものにも尽きることのない繁栄の中で、
    私がその人のために死のうとしている、あの方が、
    どうか、長く生きてくださいますように！

    立ち上がって。

    男の準備は、できたはず！

    また戸を叩く。

    マグロンヌ（サルタバディルに）
    ねえ、急いで。待ちくたびれてしまうわ。

    サルタバディル（卓で刃を試して）
    よし。俺が戸の後ろへ回るまで待て。

    ブランシュ
    言うことが、みんな聞こえる。ああ！

    サルタバディルは戸の後ろへ立つ。内へ開く戸が、入る人からは彼を隠すが、観客からは隠さない位置。

    マグロンヌ（サルタバディルに）
    合図を待ってるわ。

    サルタバディル（戸の後ろで、ナイフを手に）
    開けろ。

    マグロンヌ（ブランシュに開けて）
    お入り。

    ブランシュ（独白）
    神様、あの男に、ひどく痛い目に遭わされる！

    後ずさる。

    マグロンヌ
    さあ、何を待っているの？

    ブランシュ（独白）
    妹が兄を手伝っている。
    神様、お赦しください！　お父様、私を赦して！

    入る。小屋の敷居に姿を見せた瞬間、サルタバディルが短剣を振り上げるのが見える。幕。

  "translation_ja": |-
    トリブレ、ブランシュ。

    トリブレ

    稲妻が走る。立ち上がり、狂った叫びを上げて後ずさる。

    娘だ！　ああ神よ、娘だ！
    娘だ！　天地よ、今度は娘なのか！

    手に触れる。

    神様、手が濡れている！　この血は誰のだ？
    娘！　ああ、わからない、恐ろしい異変だ！
    幻だ！　いや、そんなことはありえない。
    出発して、エヴルーへ向かっているはずだ。

    体のそばにひざまずき、天を仰いで。

    神様、これは恐ろしい夢なのでしょう？
    娘を翼の下へ守ってくださったのでしょう？
    これはあの子ではない、そうでしょう、神様？

    二度目の稲妻が、ブランシュの青白い顔と閉じた目を明るく照らす。

    いや、あの子だ！
    確かにあの子だ！

    泣きながら体へ身を投げて。

    娘よ、わが子よ、返事をしておくれ！
    あいつらに殺されたのか！　ああ、答えて！　悪党ども！
    神様、ここには、あの恐ろしい一家しかいない！
    話してくれ、話してくれ、娘よ！　ああ、娘よ！

    ブランシュ（父の叫びで生き返ったように、まぶたをわずかに開き、消えそうな声で）
    誰が呼ぶの？

    トリブレ（我を忘れて）
    話した！　少し動く！
    心臓が鳴る、目が開く、生きている、神様！

    ブランシュ

    半ば身を起こす。肌着姿で、全身に血がつき、髪は乱れている。まだ服を着ている下半身は、袋の中に隠れている。

    ここはどこ？

    トリブレ（両腕で抱き起こして）
    わが子、地上でただ一つの宝よ、
    父さんの声がわかるか？　聞こえるか、ねえ？

    ブランシュ
    お父様！

    トリブレ
    ブランシュ、何をされた？　どんな地獄の仕業だ？
    触ると痛くしそうで、怖い。
    見えないんだ。娘よ、どこか怪我をしたのか？
    手を導いておくれ。

    ブランシュ（途切れ途切れの声で）
    刃が……きっと……心臓に……
    触れたの……感じたわ……

    トリブレ
    誰が、その一撃を？

    ブランシュ
    ああ、みんな私が悪いの……お父様を騙しました。
    あの方を愛しすぎた……あの方のために……死ぬの。

    トリブレ
    容赦ない運命！
    俺の復讐の罠に！　ああ、神が俺を打ちのめす！
    いったい、どうやったのだ？　娘よ、説明しておくれ。
    言っておくれ！

    ブランシュ（死にかけて）
    話させないで。

    トリブレ（接吻を浴びせて）
    赦しておくれ。
    だが、どうしてかもわからずに失うなんて！
    ああ、頭が垂れてしまう！

    ブランシュ（身を返そうと力を込め）
    ああ……反対側へ……息ができない！

    トリブレ（苦しみながら抱き上げて）
    ブランシュ！　ブランシュ！
    死なないでくれ！

    絶望して振り返り。

    助けて！　誰か！　誰もいない！
    こんなふうに娘を死なせておくのか？
    ああ、渡しの鐘が、あの壁にある。
    かわいそうな子、少し待っていられるか？
    水を取り、鐘を鳴らして人を呼んでくる。一瞬だけ！

    ブランシュは無駄だと合図する。

    いや、嫌なのか！　でも、そうしなければ！

    離れずに呼ぶ。

    誰か！

    どこも沈黙。家は闇の中で、何の反応もない。

    あの家は、神様、墓だ！

    ブランシュは息絶えようとしている。

    ああ、死なないで！　わが子、宝、鳩よ、
    ブランシュ、お前が去れば、父さんには何もなくなる。
    死なないで、お願いだ！

    ブランシュ
    ああ！

    トリブレ
    腕の置き方が悪いね？
    苦しいんだね？　待って、抱き方を変えよう。
    これで楽か？　どうか、
    誰か助けに来るまで、
    息を続けておくれ！　助けはないのか、一人も！

    ブランシュ（消える声で、力を振り絞って）
    あの方を赦して、お父様……さようなら！

    頭が垂れる。

    トリブレ（髪をむしって）
    ブランシュ！……息が絶える！

    渡しの鐘へ走り、激しく鳴らす。

    助けて！　人殺しだ！　火事だ！

    ブランシュのもとへ戻って。

    もう一度、何か言おうとしておくれ！
    一言だけでよい！　お願いだ、話しておくれ！

    抱き起こそうとして。

    なぜそんなふうに体を曲げたままでいる？
    十六歳！　いや、若すぎる！　ああ、死んでなどいない！
    ブランシュ、こんなふうに父さんを置いていけるのか！
    もうお前の声を聞けないのか？　神様、なぜ？

    物音を聞きつけ、庶民たちが灯火を持って駆けつける。

    お前を父さんへ与えた天は、無慈悲だった！
    なぜせめて、かわいそうな子よ、
    心の美しさを見せる前に、取り戻さなかったのか！
    なぜ、この宝を知ることを許したのだ？
    なぜ、ああ、まだ小さなときに死ななかったのか。
    子供たちが遊んでいて、お前に怪我をさせた、あの日に！
    わが子！　わが子！

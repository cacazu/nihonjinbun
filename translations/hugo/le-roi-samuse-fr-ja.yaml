  "translation_ja": |-
    マロ、のちに貴族たち、ついでトリブレ。

    ゴルド（マロに）
    もう入っていいのか？

    マロ
    獅子が羊を巣穴へ引き込んだ。

    パルダイヤン（喜んで跳び上がり）
    ああ、哀れなトリブレ！

    ピエンヌ（戸口に残り、外をじっと見て）
    しっ、来たぞ！

    ゴルド（貴族たちに小声で）
    静かに！
    何食わぬ顔をして、皆、しっかり振る舞おう。

    マロ
    諸君、見破られるとしたら私だけだ。
    あいつが話したのは私だけだから。

    ピエンヌ
    何も顔に出さないことだ。

    トリブレが入る。何も変わった様子はない。道化の衣装と、平然とした道化の顔。ただ、ひどく青ざめている。

    ピエンヌ（始まっていた会話を続けるように。トリブレを見て笑いを噛み殺す若い貴族たちに目配せする）
    そう、諸君、そのときに――やあ、トリブレ！――
    こんな節の歌ができたのだ。

    歌う。

    ブルボンがマルセイユを見て、
    家来に向かってこう言った。
    おお神よ、あの城内に
    どんな隊長がいるのだろう。

    トリブレ（歌を続けて）
    コロンブの山では、
    通り道が狭かった。
    皆で一緒に上っていった、
    指に息を吹きながら。

    皮肉な笑いと拍手。

    一同
    見事だ！

    トリブレ（ゆっくり前へ出て、独白）
    どこにいるのだろう？

    また口ずさむ。

    皆で一緒に上っていった、
    指に息を吹きながら。

    ゴルド（拍手して）
    ああ、トリブレ、うまいぞ！

    トリブレ（周りで笑う顔を一つずつ調べ、独白）
    皆でやったに違いない！

    コセ（大笑いし、トリブレの肩を叩いて）
    何か変わったことはないか、道化？

    トリブレ（コセを指し、皆に）
    この貴族は、笑うと陰気だね。

    コセの真似をして。

    「何か変わったことはないか、道化？」

    コセ（なお笑って）
    そう、何を話しに来た？

    トリブレ（頭から足まで見て）
    あなたが愛想まで振りまき始めたら、
    いよいようんざりする、そう言いに。

    この場の前半を通じて、トリブレは何かを捜し、調べ、嗅ぎ回る様子を見せる。たいていは目つきだけが、その心配を示す。誰にも見られていないと思うと、ときおり家具を動かし、戸の取っ手を回して、閉まっているか確かめる。ほかはいつものように、からかいながら、気楽で無頓着な調子で皆に話しかける。貴族たちも、あれこれ話しながら、互いに忍び笑いをし、合図を交わす。

    どこへ隠した？　ああ、こいつらに尋ねたら、
    笑われるだけだ！

    笑顔でマロへ話しかける。

    マロ、昨夜お前が風邪を引かなくて、嬉しいよ。

    マロ（驚いたふりで）
    昨夜？

    トリブレ（意味ありげに片目をつぶって）
    いいいたずらだった。感心したよ！

    マロ
    何のいたずら？

    トリブレ（首を振って）
    そうかい！

    マロ（無邪気な様子で）
    私の冒険といえば、
    消灯の鐘が鳴ったら布団に入り、
    起きたときには太陽が輝いていた、それだけだ。

    トリブレ
    ああ、昨夜は出なかったのか？　俺が夢を見たんだな！

    卓上の手巾を見つけ、飛びつく。

    パルダイヤン（ピエンヌに小声で）
    見ろ、公爵。私の手巾の頭文字を調べている。

    トリブレ（手巾を落とし、独白）
    違う、あの子のではない。

    ピエンヌ（奥で笑っている若者たちに）
    諸君！

    トリブレ（独白）
    どこにいるのだろう？

    ピエンヌ（ゴルドに）
    何がそんなにおかしい？

    ゴルド（マロを指して）
    こいつが笑わせるのだ！

    トリブレ（独白）
    今日は、ずいぶん楽しそうだな！

    ゴルド（笑い、マロに）
    そんな失礼な顔で見るな。
    さもないとトリブレを頭へ投げつけるぞ。

    トリブレ（ピエンヌに）
    王はまだお目覚めではない？

    ピエンヌ
    ああ、まだだ！

    トリブレ
    お部屋で、何か物音は？

    戸へ近づこうとする。パルダイヤンが止める。

    パルダイヤン
    陛下を起こすなよ！

    ゴルド（パルダイヤンに）
    子爵！
    マロの奴が、面白い話をしてくれた！
    ギー三人が、この前の晩、どこからだか帰ってきて、
    ――道化先生、どう思う？――
    三人とも女房が、ほかの男といるところを見つけた……

    マロ
    隠れていたところを。

    トリブレ
    近ごろは、道徳がずいぶん緩んでいるからね！

    コセ
    女というのは、実に裏切るものだ！

    トリブレ（コセに）
    おや、お気をつけて！

    コセ
    何を？

    トリブレ
    お気をつけて、コセ殿！

    コセ
    何だ？

    トリブレ
    恐ろしいことが、耳元にぶら下がっているぞ。

    コセ
    何だね？

    トリブレ（鼻先で笑って）
    まったく同じ目に遭うことさ！

    コセ（怒って脅し）
    ふん！

    トリブレ
    諸君、実に珍しい獣だ。
    怒ると、こんな声を出す。

    コセの真似をして。

    ふん！

    皆笑う。王妃の仕着せを着た貴族が入る。

    ピエンヌ
    何だ、ヴォードラゴン？

    貴族
    主君たる王妃様が、急ぎの御用で、
    王にお目にかかりたいとおっしゃっています。

    ピエンヌは無理だと合図する。貴族は食い下がる。

    ブレゼ夫人は、おそばにいらっしゃらないのに。

    ピエンヌ（苛立って）
    王は、まだお起きではない。

    貴族
    何ですって、公爵！　つい先ほど、
    あなたとご一緒でしたよ。

    ピエンヌ（ますます苛立ち、貴族に合図するが、通じない。トリブレはじっと見守っている）
    王は狩りだ！

    貴族
    では、小姓も勢子もお連れにならずに。
    お供は全員、ここにおりますが。

    ピエンヌ（独白）
    しまった！

    貴族の真正面から、怒って。

    言っているのだ、わかるか？
    王は誰にも会えない！

    トリブレ（突如、雷のような声で）
    ここにいる！
    王と一緒にいるのだ！

    貴族たちは驚く。

    ゴルド
    どうした？　気が触れたのか！
    誰が！

    トリブレ
    ああ、誰のことか、諸君にはわかっている！
    「帰れ」で済む話ではないぞ！
    コセ、ピエンヌ、サタン、
    ブリオン、モンモランシー……お前たちみんなで、
    昨日、俺の家から盗んだ、あの悲しい女だ。
    パルダイヤン殿、お前もいたな！
    取り返すぞ、諸君！　ここにいるのだ！

    ピエンヌ（笑って）
    トリブレが愛人をなくした！
    可愛かろうと不細工だろうと、よそで捜せ。

    トリブレ（恐ろしい様子で）
    娘を返せ！

    一同
    娘だと！

    驚きの動き。

    トリブレ（腕を組んで）
    俺の娘だ！　さあ、今なら笑ってみろ！
    ああ、黙っているな！　この道化が父親で、
    娘がいるのが、そんなに意外か？
    狼にも貴族にも、家族はあるではないか。
    俺にもあってよいだろう？　さあ、もう十分だ！

    恐ろしい声で。

    冗談だったのなら、結構だ、もう終わりにしろ！
    娘が要るのだ、わかるか！
    お前たちは話し、囁き、笑いながらこの件を語る。
    だが、勝ち誇った顔など、俺には要らない。
    お偉方、子供を返せと言っているのだ！

    王の戸へ飛びかかる。

    ここにいる！

    貴族全員が戸の前へ立ちはだかり、阻む。

    マロ
    気違いが、荒れ狂う気違いになった。

    トリブレ（絶望して後ずさり）
    廷臣ども、廷臣ども、悪魔ども、呪われた種族め！
    あの盗賊どもが娘を奪ったのは、本当だったのか！
    奴らにとって、女など何でもないのだ！
    幸いにも王が放蕩者なら、
    貴族の妻は、亭主が不器用でさえなければ、
    たいそう役に立つ。奴らにとって、処女の名誉は
    無駄な贅沢、重荷になる宝物なのだ。
    女は収穫を上げる畑、王から借地料が
    きちんと入る農場だ。
    どこからともなく降ってくる千の恩恵、
    総督職、首にかける勲章、
    次から次へと、ますます増える加増の山！

    一同の顔をまっすぐ見て。

    一人でも否定する者がいるか？
    本当だろう、お偉方？　実際……

    一人から一人へ歩み寄る。

    誰でも王に売り渡すだろう、まだ売っていないならな。
    名声、称号、その他どんな幻のためにでも、

    ブリオンに。

    お前は妻を、ブリオン！

    ゴルドに。

    お前は妹を！

    若い小姓パルダイヤンに。

    お前は母親を！

    小姓が食器棚で葡萄酒を注ぎ、飲みながら口ずさむ。

    ブルボンがマルセイユを見て、
    家来に向かってこう言った。
    おお神よ、どんな隊長が……

    トリブレ（振り向いて）
    なぜそうしないのか自分でもわからんぞ、オービュソン子爵、
    その杯と歌を、お前の歯へ叩きつけてやらないのは！

    皆に。

    誰が信じる！　公爵に貴族院議員、スペインの大公、
    ああ恥ずかしい！　シャルルマーニュの末裔ヴェルマンドワ、
    祖先がミラノ公だったブリオン、
    ゴルド＝シミアーヌ、ピエンヌ、パルダイヤン、
    そしてモンモランシー！　名高い家の名を持つお前たちが、
    この哀れな男から娘を盗んだとは！
    いや、これほど誇り高い紋章の下に、
    卑しい心を抱くのは、名門の者のすることではない！
    違う、お前たちはその家の者ではない！
    野次のただ中で、母親たちが下僕に身を売ったのだ！
    みんな私生児だ！

    ゴルド
    おい、悪党！

    トリブレ
    俺の持ち物を売るのに、王からいくらもらう？
    この仕事には金が出たのだろう、言え！

    髪をむしって。

    俺にはあの子しかいない！
    俺が望めば……そうだろう、若くて、美しい！
    きっと王は金を払うだろう！

    皆を見て。

    お前たちの王は、俺のために何かできると
    思っているのか？
    お前たちのような家名で、俺の名を覆えるのか？
    俺を美しく、姿よく、ほかの人と同じにできるか？
    地獄め！　何もかも奪われた！
    ああ、このすばらしいいたずらとは、
    何と卑劣で、残酷で、恐ろしく、卑怯に行われたことか！
    悪党、殺し屋ども！　恥知らず、
    泥棒、山賊、女を苦しめる者ども！
    お偉方、娘が要る！　娘を返せ！
    いつまで待たせる、早く返さないか！
    この手を見ろ。名誉も何もない手、
    民衆の、農奴の、田舎者の手だ。
    笑う奴らには、武器もない手に見えるだろう。
    剣はないが、爪はあるのだ、諸君！
    もうずいぶん待っているように思える！
    返せ！　戸を！　開けろ！

    また狂ったように戸へ飛びかかる。貴族全員が守る戸で、しばらくもみ合い、やがて疲れ果て、息を切らして前方へ戻り、膝から崩れる。

    皆で俺一人に！
    十人で一人に！

    涙と嗚咽に崩れて。

    そうだ、泣いている、そうだとも！

    マロに。

    マロ、俺を面白がるのは、もう十分だろう。
    その仕着せの下に、まだ魂が、霊感を受ける頭が、
    民衆の一人としての心が残っているなら、
    どこへ隠した、何をした、教えてくれ！
    そこにいるんだろう？　ああ、この呪われた奴らの中で、
    兄弟同士の俺たちは、手を結ぼう！
    あの貴族どもの中で、お前だけには知恵がある。
    マロ、親切なマロ！……黙っているのか！

    貴族たちへ這い寄って。

    ああ、ご覧ください！
    足元へ伏して、お赦しを請います、お偉方！
    病んでいるのです……どうか、憐れんでください！
    別の日なら、もっと冗談として受け取れたでしょう。
    でも、一歩歩くたびにも、口には出さない
    体の痛みが、いろいろあるのです。
    体がこんなだと、そういう悪い日もあります。
    長いあいだ、皆様の道化でした。慈悲を乞います！
    どうか、玩具をこんなふうに壊さないで！
    あれほど皆様を笑わせた、哀れなトリブレを！
    本当に、もう何と言えばよいのかわからない！
    子供を返してください。どうか、
    王の寝室へ隠された娘を、返してください！
    ただ一つの宝です！　お優しい方々、どうか！
    娘がいなくなったら、いったい
    何をすればよいのです？　ただでさえ惨めな運命なのに！
    この世で、持っていたものは、あの子だけなのです！

    皆、黙ったまま。絶望して立ち上がる。

    ああ神よ、笑うか黙るか、それしかできないのか！
    哀れな父親が胸を打ち傷め、
    こんな夜が二晩続けば白くなる髪を
    額からむしるのを見るのは、そんなに楽しいのか！

    王の寝室の戸が、不意に開く。ブランシュが飛び出す。途方に暮れ、取り乱し、身なりを乱して、恐ろしい叫びとともに父の腕へ倒れ込む。

    ブランシュ
    お父様！　ああ！

    トリブレ（抱きしめて）
    わが子！　ああ、この子だ！　ああ、娘だ！
    ああ、皆様！

    嗚咽に息を詰まらせ、その間にも笑って。

    ほら、これが家族のすべてです。
    私の天使！　この子がいなければ、家は何と暗くなることか！
    お偉方、私が正しかったでしょう？
    泣き声を上げても、責められはしないでしょう？
    こんなに愛らしく、優しく、
    見るだけで人が善くなりそうな子を、
    失って、悲鳴を上げずにいられるものですか！

    ブランシュに。

    もう何も怖がらなくていい。冗談だったんだ。
    ただの悪ふざけだ。ずいぶん怖かっただろう。
    だが、皆さんはよい人たちだ。父さんがお前を
    どんなに愛しているかわかった。もう、放っておいてくれるよ。

    貴族たちに。

    そうでしょう？

    娘を抱きしめながら。

    また会えたとは、何という幸せ！
    心が喜びでいっぱいで、今では、
    泣いていたのに笑っている父さんには、わからなくなる。
    少し失って、また取り戻すのも、幸せなのではないかと！

    不安そうに娘を見て。

    だが、お前はどうして泣く？

    ブランシュ（涙と赤みで覆われた顔を、手で隠して）
    私たちは何て不幸なの！
    恥が……

    トリブレ（身を震わせて）
    何と言った？

    ブランシュ（父の胸に顔を隠して）
    この男たちの前では、いや！
    お父様だけの前で、恥じたいの！

    トリブレ（怒りに震え、王の戸へ向き直って）
    ああ、あの恥知らずめ、この子まで！

    ブランシュ（泣きながら、父の足元へ倒れて）
    お父様と二人にして！

    トリブレ（三歩進み、たじろぐ貴族たちを手で払いのけるようにして）
    ここから出ていけ！
    万一、王フランソワが、この辺りを
    通ろうとするなら、

    ヴェルマンドワに。

    お前は護衛だな。
    入るなと伝えろ。俺がここにいるとな。

    ピエンヌ
    こんな道化は見たことがない。

    ゴルド（引き揚げるよう合図して）
    気違いにも子供にも、少しは譲るものだ。
    ただし、間違いがないよう見張っていよう。

    皆、退場。

    トリブレ（王の肘掛け椅子へ座り、娘を起こして）
    さあ、話して。何もかも聞かせておくれ。

    振り返り、残っているコセを見ると、半ば立って戸を示す。

    聞こえませんでしたか、閣下？

    コセ（道化の威に圧されたように退きながら）
    道化どもは、本当に何をしてもよいと思っている！

    退場。

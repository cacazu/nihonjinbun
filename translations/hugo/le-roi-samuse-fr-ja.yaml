  "translation_ja": |-
    ゴルド氏、金髪の若い小姓パルダイヤン氏、ヴィック氏、王の侍従の服を着たクレマン・マロ。続いてピエンヌ氏、一、二人の貴族。ときおり、考え込み、ひどく真剣な顔で歩き回るコセ氏。

    クレマン・マロ（ゴルドに挨拶して）
    今夜はどんなお噂が？

    ゴルド
    何もない。宴が見事で、王が楽しんでおいでだ。

    マロ
    ああ、それは大ニュースだ！
    王は楽しむ？　それは大変！

    コセ（二人の後ろを通りながら）
    しかも、ひどく不幸なことだ。
    楽しむ王とは、危険な王だからね。

    そのまま通り過ぎる。

    ゴルド
    あの気の毒な太っちょコセを見ると、胸が塞がるよ。

    マロ（小声で）
    王が奥方にしきりに迫っておいでだとか？

    ゴルドはうなずく。ピエンヌが入ってくる。

    ゴルド
    おや、親愛なる公爵だ！

    挨拶を交わす。

    ピエンヌ（秘密めかして）
    諸君、新しい話だ！
    どんな賢者の頭も混乱する話！
    見事な話、笑える話、
    恋の話、ありえない話だ！

    ゴルド
    何だい？

    ピエンヌ（皆を周りに集めて）
    しっ！

    隅でほかの人と話しているマロに。

    こちらへ、クレマン・マロ先生！

    マロ（近づいて）
    閣下、どんなご用です？

    ピエンヌ
    君は大馬鹿だ。

    マロ
    何にせよ、自分が「大」のつく者だとは思いませんでしたが。

    ピエンヌ
    君の書いたペスキエーラ攻囲の詩で読んだぞ、
    トリブレについての、あの句を。
    「角の欠けた頭の道化、
    三十歳でも生まれた日ほどの知恵しかない……」
    君は大馬鹿だ！

    マロ
    何のことかわかったら、キューピッドに罰してもらいますよ！

    ピエンヌ
    そうか！

    ゴルドに。

    シミアーヌ殿、

    パルダイヤンに。

    パルダイヤン殿、

    ゴルド、パルダイヤン、マロ、そして輪に加わったコセが公爵を囲む。

    さあ、当ててみてくれ。
    トリブレに、とんでもないことが起こっている。

    パルダイヤン
    背筋が伸びた？

    コセ
    大元帥にでもなったか？

    マロ
    こんがり焼かれて食卓へ出されたのでは？

    ピエンヌ
    違う、もっとおかしい。あいつには……何があるか当ててみろ。
    信じられないことだ！

    ゴルド
    ガルガンチュアとの決闘か！

    ピエンヌ
    違う。

    パルダイヤン
    自分より醜い猿か？

    ピエンヌ
    違う。

    マロ
    ポケットいっぱいの金貨？

    コセ
    串焼きの輪を回す犬の仕事か？

    マロ
    天国で聖母との逢い引きか？

    ゴルド
    ひょっとして、魂か？

    ピエンヌ
    十回考えてもわからんぞ！
    道化のトリブレ、あの不格好なトリブレに、
    何があるか、よく考えろ……途方もないものだ！

    マロ
    背中の瘤？

    ピエンヌ
    違う、あいつには……百回考えても当たるまい！
    愛人がいる！

    一同、大笑いする。

    マロ
    はっはっ、公爵は面白いことをおっしゃる。

    パルダイヤン
    いい冗談だ！

    ピエンヌ
    諸君、魂にかけて誓うよ。
    その女の家の戸口も見せてやろう。
    あいつは毎晩、茶色の外套を着て通っている。
    腹を空かせた詩人のように、陰気で怒った顔をしてね。
    からかってやるつもりだ。夜にコセ邸のそばを
    ぶらついていて発見した。秘密にしてくれ。

    マロ
    なんというロンドーの題材だ！
    何と、トリブレが夜にはキューピッドに変わるとは！

    パルダイヤン（笑って）
    トリブレ殿に女だと！

    ゴルド（笑って）
    木馬に鞍を置くようなものだ！

    マロ（笑って）
    その娘さんなら、また別のベッドフォードが
    カレーに上陸したとしても、
    イギリス軍を追い払うだけのものは、十分お持ちだろう！

    皆笑う。ヴィックが来る。ピエンヌは唇に指を当てる。

    ピエンヌ
    しっ！

    パルダイヤン（ピエンヌに）
    ところで王も、毎日、夕暮れになると一人きりで、
    獲物でも探すようにお出かけになるのは、なぜだろう？

    ピエンヌ
    ヴィックが教えてくれる。

    ヴィック
    まず知っているのは、
    陛下がたいそう楽しんでいらっしゃるということだ。

    コセ
    ああ、その話は聞かせないでくれ！

    ヴィック
    だが、気まぐれの風にどちらへ吹かれていくのか、
    なぜ晩になると冬の外套を着込み、
    服装も様子もすっかり変えて出かけるのか、
    どこかの窓を戸口代わりに使うのか、
    そんなことを気にするものか。
    諸君、私は独身なのだから、何の関係がある！

    コセ（首を振って）
    王というものは――諸君、古参の貴族なら知っている――、
    いつも誰かの家から、楽しみを奪ってくるものだ。
    誘惑されそうな妹、妻、娘を持つ者は用心しろ！
    上機嫌な権力者は、人に害をなすことしか考えない。
    そこには恐ろしいことがいくらでもある。
    笑う口からは、歯が残らず見える。

    ヴィック（ほかの者たちに小声で）
    あれほど王を恐れているとは！

    パルダイヤン
    美しい奥方のほうは、ご亭主ほど怖がっていないのに。

    マロ
    それがご亭主には怖いのさ。

    ゴルド
    コセ、考え違いだ。王には陽気で、気前よく、
    満足していていただくことが、たいへん大事なのだ。

    ピエンヌ（ゴルドに）
    同感だ、伯爵！　退屈している王は、
    黒い服の若い娘、雨ばかりの夏のようなものだ。

    パルダイヤン
    決闘のない恋だ。

    ヴィック
    水を詰めた酒瓶だ。

    マロ（小声で）
    王がトリブレ＝キューピッドと戻ってくる。

    王とトリブレが入る。廷臣たちは恭しく道を開ける。

segments:
- id: turba-title-001
  section: -1
  paragraph: 1
  kind: title
  source_language: en
  target_language: ja
  source_en: The Turba Philosophorum.
  translation_ja: 哲学者たちの集会
  source_url: https://archive.org/download/alchemyturbaphil00waitrich/alchemyturbaphil00waitrich.pdf#page=13
  notes: []
- id: turba-title-002
  section: -1
  paragraph: 2
  kind: title
  source_language: en
  target_language: ja
  source_en: Taken from an Ancient Manuscript Codex, more perfect than any edition published heretofore.
  translation_ja: これまでに刊行されたどの版よりも完全な、古い写本冊子から採られたもの。
  source_url: https://archive.org/download/alchemyturbaphil00waitrich/alchemyturbaphil00waitrich.pdf#page=13
  notes:
  - これは本文冒頭に掲げられた底本の標題句。今回の読書版が写本を独自に校訂したという意味ではない。
- id: turba-00-001
  section: 0
  paragraph: 1
  source_en: The Epistle of Arisleus, prefixed to the Words of the Sages, concerning the Purport of this
    Book, for the Benefit of Posterity, and the same being as here follows:-
  translation_ja: 本書の趣旨について、後世の人々の益のため、賢者たちの言葉に先立って置かれたアリスレウスの書簡。その文は次のとおりである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 136
  notes: []
  source_language: en
  target_language: ja
  kind: epistle
- id: turba-00-002
  section: 0
  paragraph: 2
  source_en: Arisleus, begotten of Pythagoras, a disciple of the disciples by the grace of thrice great
    Hermes, learning from the seat of knowledge, unto all who come after wisheth health and mercy. I testify
    that my master, Pythagoras, the Italian, master of the wise and chief of the Prophets, had a greater
    gift of God and of Wisdom than was granted to any one after Hermes.
  translation_ja: ピュタゴラスから生まれ、三倍に偉大なるヘルメスの恩恵によって弟子たちの弟子となり、知識の座に学ぶアリスレウスは、後に来るすべての人々に健康と慈悲を願う。私は証言する。私の師、イタリア人ピュタゴラス、賢者たちの師であり預言者たちの首長である人は、ヘルメス以後の誰に授けられたものよりも大きな神と叡智の賜物を受けた。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 137
  notes:
  - 登場人物の名・師弟関係はこの作品の文学的な設定として読む。各発言を歴史上のピュタゴラスやソクラテス等の実際の言葉と認定するものではない。
  source_language: en
  target_language: ja
  kind: epistle
- id: turba-00-003
  section: 0
  paragraph: 3
  source_en: Therefore he had a mind to assemble his disciples, who were now greatly increased, and had
    been constituted the chief persons throughout all regions for the discussion of this most precious
    Art, that their words might be a foundation for posterity. He then commanded Iximidrus, of highest
    council, to be the first speaker, who said:-
  translation_ja: そこで彼は、今や大いに数を増し、あらゆる地方で主要な人物となっていた弟子たちを、この最も貴い術について論じるために集めようと考えた。彼らの言葉が後世の人々の礎となるためである。そして、最高の評議を担うイクシミドルスに最初に語るよう命じた。彼は次のように述べた。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 138
  notes: []
  source_language: en
  target_language: ja
  kind: epistle
- id: turba-01-001
  section: 1
  paragraph: 1
  source_en: Iximidrus Saith:- I testify that the beginning of all things is a Certain Nature, which is
    perpetual, coequalling all things, and that the visible natures, with their births and decay, are
    times wherein the ends to which that nature brings them are beheld and summoned. Now, I instruct you
    that the stars are igneous, and are kept within bounds by the air. If the humidity and density of
    the air did not exist to separate the flames of the sun from living things, then the Sun would consume
    all creatures.
  translation_ja: イクシミドルスは言う。私は証言する。万物の始まりは、永続し、万物と同等に存する、ある〈自然〉である。そして、目に見える諸々の自然、その誕生と衰滅は、この自然がそれらを導く終末が眺められ、呼び集められる時である。さて、あなたがたに教えよう。星々は火性のものであり、空気によって一定の範囲に保たれている。太陽の炎を生き物から隔てる空気の湿りと密度がなかったならば、太陽はあらゆる被造物を焼き尽くすであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 140
  notes:
  - Nature は広い意味の「自然」のほか、ある物質の本性・働く力をも指す。現代科学の単一の概念へ置き換えない。冒頭の宇宙論には英訳自体に難解な構文がある。
  source_language: en
  target_language: ja
  kind: body
- id: turba-01-002
  section: 1
  paragraph: 2
  source_en: 'But God has provided the separating air, lest that which He has created should be burnt
    up. Do you not: observe that the Sun when it rises in the heaven overcomes the air by its heat, and
    that the warmth penetrates from the upper to the lower parts of the air? If, then, the air did not
    presently breathe forth those winds whereby creatures are generated, the Sun by its heat would certainly
    destroy all that lives.'
  translation_ja: しかし神は、自ら創ったものが焼き尽くされないよう、隔てる空気を備えた。太陽が天に昇ると、その熱によって空気に打ち勝ち、暖かさが空気の上部から下部へと入り込むのを、あなたがたは見ないか。もし空気が、生き物を生み出すあの風を直ちに吐き出さなければ、太陽はその熱によって、あらゆる生あるものを確実に滅ぼすであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 141
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-01-003
  section: 1
  paragraph: 3
  source_en: But the Sun is kept in check by the air, which thus conquers because it unites the heat of
    the Sun to its own heat, and the humidity of water to its own humidity. Have you not remarked how
    tenuous water is drawn up into the air by the action of the heat of the Sun, which thus helps the
    water against itself? If the water did not nourish the air by such tenuous moisture, assuredly the
    Sun would overcome the air.
  translation_ja: だが太陽は空気によって抑えられている。空気がこのように勝つのは、太陽の熱を自らの熱に、水の湿りを自らの湿りに結びつけるからである。太陽の熱の働きによって、微細な水が空気の中へ引き上げられることに気づかないか。こうして太陽は、自らに対抗する水を助けるのである。水がこの微細な湿りによって空気を養わなかったならば、太陽は確実に空気を征服するであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 142
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-01-004
  section: 1
  paragraph: 4
  source_en: The fire, therefore, extracts moisture from the water, by means of which the air conquers
    the fire itself. Thus, fire and water are enemies between which there is no consanguinity, for the
    fire is hot and dry, but the water is cold and moist. The air, which is warm and moist, joins these
    together by its concording medium; between the humidity of water and the heat of fire the air is thus
    placed to establish peace.
  translation_ja: したがって火は水から湿りを引き出し、その湿りによって空気は火そのものに打ち勝つ。このように火と水は、血縁のない敵同士である。火は熱く乾き、水は冷たく湿っているからである。暖かく湿った空気は、調和させる仲介者として両者を結びつける。水の湿りと火の熱との間に、空気は平和を築くため置かれているのである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 143
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-01-005
  section: 1
  paragraph: 5
  source_en: And look ye all how there shall arise a spirit from the tenuous vapour of the air, because
    the heat being joined to the humour, there necessarily issues something tenuous, which will become
    a wind. For the heat of the Sun extracts something tenuous out of the air, which also becomes spirit
    and life to all creatures. All this, however, is disposed in such manner by the will of God, and a
    coruscation appears when the heat of the Sun touches and breaks up a cloud.
  translation_ja: また、空気の微細な蒸気から霊が生じる様を、皆よ、見なさい。熱が水分と結ばれると、必然的に微細なものが現れ、それが風となるからである。太陽の熱は空気から微細なものを引き出すが、それはまた、あらゆる被造物にとって霊と生命となる。しかし、これらすべては神の意志によってこのように配置されている。そして太陽の熱が雲に触れてこれを砕くと、閃光が現れる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 144
  notes:
  - 公開翻刻の rind look は And look として校整した。底本の語と文脈を確認した明白な転記誤りの修正。転記段階の読みも内蔵データに保持する。
  source_language: en
  target_language: ja
  kind: body
  transcription_reading: rind look ye all how there shall arise a spirit from the tenuous vapour of the
    air, because the heat being joined to the humour, there necessarily issues something tenuous, which
    will become a wind. For the heat of the Sun extracts something tenuous out of the air, which also
    becomes spirit and life to all creatures. All this, however, is disposed in such manner by the will
    of God, and a coruscation appears when the heat of the Sun touches and breaks up a cloud.
- id: turba-01-006
  section: 1
  paragraph: 6
  source_en: The Turba saith:- Well hast thou described the fire, even as thou knowest concerning it,
    and thou hast believed the word of thy brother.
  translation_ja: 集会の人々は言う。あなたは、自分が火について知るとおりによく説明し、また兄弟の言葉を信じた。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 145
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-02-001
  section: 2
  paragraph: 1
  source_en: Exumedrus saith:- I do magnify the air according to the mighty speech of Iximidrus, for the
    work is improved thereby. The air is inspissated, and it is also made thin; it grows warm and becomes
    cold. The inspissation thereof takes place when it is divided in heaven by the elongation of the Sun;
    its rarefaction is when, by the exaltation of the Sun in heaven, the air becomes warm and is rarefied.
    It is comparable with the complexion of Spring, in the distinction of time, which is neither warm
    nor cold.
  translation_ja: エクスメドルスは言う。私はイクシミドルスの力強い言葉に従って空気を称揚する。それによって作業が改善されるからである。空気は濃厚にもなり、希薄にもなる。暖まり、また冷える。空気が濃厚になるのは、太陽の遠ざかりによって天において分けられるときである。希薄になるのは、太陽が天高く昇ることによって暖まり、薄くなるときである。それは、季節の区別において暑くも寒くもない春の性質に比べられる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 148
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-02-002
  section: 2
  paragraph: 2
  source_en: For according to the mutation of the constituted disposition with the altering distinctions
    of the soul, so is Winter altered. The air, therefore, is inspissated when the Sun is removed from
    it, and then cold supervenes upon men.
  translation_ja: というのも、定められた配置の変化と、魂の変転する区別とに従って、冬もまた変化するからである。したがって、太陽が遠ざかると空気は濃厚になり、そのとき寒さが人々を襲う。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 149
  notes:
  - 英訳の constituted disposition、distinctions of the soul は意味の取りにくい表現。季節の説明として滑らかに作り直さず、語義の不確かさを残した。
  source_language: en
  target_language: ja
  kind: body
- id: turba-02-003
  section: 2
  paragraph: 3
  source_en: Whereat the Turba said:- Excellently hast thou described the air, and given account of what
    thou knowest to be therein.
  translation_ja: そこで集会の人々は言った。あなたは空気を見事に説明し、その内にあると自分が知る事柄を述べた。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 150
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-03-001
  section: 3
  paragraph: 1
  source_en: Anaxagoras saith:- I make known that the beginning of all those things which God hath created
    is weight and proportion, for weight rules all things, and the weight and spissitude of the earth
    is manifest in proportion; but weight is not found except in body.
  translation_ja: アナクサゴラスは言う。私は明らかにする。神が創ったすべてのものの始まりは重さと割合である。重さは万物を支配し、大地の重さと濃厚さは割合のうちに明らかとなるからである。しかし重さは物体の中にしか見いだされない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 153
  notes:
  - ここから述べられる四元素の密度・上下関係は歴史的な自然哲学であり、現代の物理学ではない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-03-002
  section: 3
  paragraph: 2
  source_en: And know, all ye Turba, that the spissitude of the four elements reposes in the earth; for
    the spissitude of fire falls into air, the spissitude of air, together with the spissitude received
    from the fire, falls into water; the spissitude also of water, increased by the spissitude of fire
    and air, reposes in earth. Have you not observed how the spissitude of the four elements is conjoined
    in earth! The same, therefore, is more inspissated than all.
  translation_ja: 集会の皆よ、知りなさい。四元素の濃厚な部分は大地にとどまる。火の濃厚な部分は空気へ落ち、空気の濃厚な部分は火から受け取った濃厚な部分とともに水へ落ちる。そして水の濃厚な部分も、火と空気の濃厚な部分によって増し加えられ、大地にとどまるのである。四元素の濃厚な部分が、大地の中に結びつくことを見ていないのか。それゆえ大地は、すべてのものより濃厚なのである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 154
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-03-003
  section: 3
  paragraph: 3
  source_en: Then saith the Turba:- Thou hast well spoken. Verily the earth is more inspissated than are
    the rest. Which, therefore, is the most rare of the four elements and is most worthy to possess the
    rarity of these four?
  translation_ja: そこで集会の人々は言う。よく語った。確かに大地は残りのものより濃厚である。それでは、四元素のうち最も希薄なものはどれであり、この四つの希薄な部分を所有するに最もふさわしいものはどれか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 155
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-03-004
  section: 3
  paragraph: 4
  source_en: He answereth:- Fire is the most rare among all, and thereunto cometh what is rare of these
    four. But air is less rare than fire, because it is warm and moist, while fire is warm and dry; now
    that which is warm and dry is more rare than the warm and moist.
  translation_ja: 彼は答える。火がすべてのうちで最も希薄であり、この四つの希薄な部分はそこへ集まる。しかし空気は火ほど希薄でない。空気は暖かく湿り、火は暖かく乾いているからである。暖かく乾いたものは、暖かく湿ったものより希薄である。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 157
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-03-005
  section: 3
  paragraph: 5
  source_en: They say unto him:- The which element is of less rarity than air!
  translation_ja: 人々は彼に言う。空気より希薄さの少ない元素はどれか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 158
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-03-006
  section: 3
  paragraph: 6
  source_en: He answereth:- Water, since cold and moisture inhere therein, and every cold humid is of
    less rarity than a warm humid.
  translation_ja: 彼は答える。水である。その内には冷たさと湿りがあるからであり、冷たく湿ったものはすべて、暖かく湿ったものより希薄さが少ない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 160
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-03-007
  section: 3
  paragraph: 7
  source_en: Then do they say unto him:- Thou hast spoken truly. What, therefore, is of less rarity than
    water?
  translation_ja: そこで人々は彼に言う。あなたは真実を語った。では、水より希薄さの少ないものは何か。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 162
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-03-008
  section: 3
  paragraph: 8
  source_en: He answereth:- Earth, because it is cold and dry, and that which is cold and dry is of less
    rarity than that which is cold and moist.
  translation_ja: 彼は答える。大地である。冷たく乾いているからであり、冷たく乾いたものは、冷たく湿ったものより希薄さが少ない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 164
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-03-009
  section: 3
  paragraph: 9
  source_en: Pythagoras saith:- Well have ye provided, O Sons of the Doctrine, the description of these
    four natures, out of which God hath created all things. Blessed, therefore, is he who comprehends
    what ye have declared, for from the apex of the world he shall not find an intention greater than
    his own! Let us, therefore, make perfect our discourse.
  translation_ja: ピュタゴラスは言う。教えの子らよ、神が万物を創ったもとであるこの四つの自然について、あなたがたはよく説明を整えてくれた。ゆえに、あなたがたの述べたことを理解する者は幸いである。世界の頂に立っても、自らのものより偉大な意図を見いださないであろうからだ。それでは、われわれの論述を完成させよう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 165
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-03-010
  section: 3
  paragraph: 10
  source_en: They reply:- Direct every one to take up our speech in turn. Speak thou, O Pandolfus!
  translation_ja: 人々は答える。皆に順番にこの話を引き継ぐよう命じてください。パンドルフスよ、あなたが話しなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 167
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-04-001
  section: 4
  paragraph: 1
  source_en: 'But Pandolfus saith:- I signify to posterity that air is a tenuous matter of water, and
    that it is not: separated from it. It remains above the dry earth, to wit, the air hidden in the water,
    which is under the earth. If this air did not exist, the earth would not remain above the humid water.'
  translation_ja: そこでパンドルフスは言う。私は後世の人々に告げる。空気は水の微細な質料であり、水から分離しているのではない。それは乾いた大地の上にとどまる。すなわち、大地の下にある水に隠れた空気である。この空気が存在しなければ、大地は湿った水の上にとどまれないであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 170
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-04-002
  section: 4
  paragraph: 2
  source_en: They answer:- Thou hast said well; complete, therefore, thy speech.
  translation_ja: 人々は答える。あなたはよく語った。では話を続けて終えなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 172
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-04-003
  section: 4
  paragraph: 3
  source_en: But he continueth:- The air which is hidden in the water under the earth is that which sustains
    the earth, lest it should be plunged into the said water; and it, moreover, prevents the earth from
    being overflowed by that water. The province of the air is, therefore, to fill up and to make separation
    between diverse things, that is to say, water and earth, and it is constituted a peacemaker between
    hostile things, namely, water and fire, dividing these, lest they destroy one another.
  translation_ja: 彼は続ける。大地の下の水に隠れている空気こそが、大地がその水の中へ沈まないよう支えるものである。さらにそれは、大地がその水に覆われることを防ぐ。したがって空気の役目は、異なるもの、すなわち水と大地の間を満たし、両者を隔てることである。また空気は、敵対するもの、すなわち水と火の間で和解者となり、互いを滅ぼさぬよう両者を分けている。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 173
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-04-004
  section: 4
  paragraph: 4
  source_en: The Turba saith:- If you gave an illustration hereof, it would be clearer to those who do
    not understand.
  translation_ja: 集会の人々は言う。ここで例を示せば、理解していない者たちにもいっそう明らかになるであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 174
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-04-005
  section: 4
  paragraph: 5
  source_en: He answereth:- An egg is an illustration, for therein four things are conjoined; the visible
    cortex or shell represents the earth, and the albumen, for white part, is the water. But a very thin
    inner cortex is joined to the outer cortex, representing, as I have signified to you, the separating
    medium between earth and water, namely, that air which divides the earth from the water.
  translation_ja: 彼は答える。卵がその例である。卵では四つのものが結びついているからだ。目に見える外皮、すなわち殻は大地を表し、卵白、すなわち白い部分は水である。しかし非常に薄い内皮が外皮に接しており、これは、あなたがたに示したように、大地と水を隔てる媒介物、すなわち大地を水から分ける空気を表している。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 175
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-04-006
  section: 4
  paragraph: 6
  source_en: The yolk also of the egg represents fire; the cortex which contains the yolk corresponds
    to that other air which separates the water from the fire. But they are both one and the same air,
    namely, that which separates things frigid, the earth from the water, and that which separates the
    water from the fire. But the lower air is thicker than the upper air, and the upper air is more rare
    and subtle, being nearer to the fire than the lower air.
  translation_ja: 卵黄はまた火を表す。卵黄を包む皮は、水を火から隔てるもう一つの空気に対応する。しかし両者はともに、同一の空気である。すなわち、冷たいもの同士である大地と水とを隔てる空気と、水を火から隔てる空気である。ただし下の空気は上の空気より厚く、上の空気は下の空気より火に近いので、いっそう希薄かつ精妙である。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 176
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-04-007
  section: 4
  paragraph: 7
  source_en: In the egg, therefore, are four things- earth, water, air, and fire. But the point of the
    Sun, these four excepted, is in the centre of the yolk, and this is the chicken. Consequently, all
    philosophers in this most excellent art have described the egg as an example, which same thing they
    have set over their work.
  translation_ja: したがって卵の内には、大地、水、空気、火という四つのものがある。しかし、この四つを別にすれば、太陽の点は卵黄の中心にあり、それが雛である。それゆえ、この最も優れた術における哲学者たちは皆、卵を例として説明し、それを自らの作業の模範に据えた。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 177
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-05-001
  section: 5
  paragraph: 1
  source_en: Arisleus saith:- Know that the earth is a hill and not a plain, for which reason the Sun
    does not ascend over all the zones of the earth in a single hour; but if it were flat, the sun would
    rise in a moment over the whole earth.
  translation_ja: アリスレウスは言う。知りなさい。大地は丘であって平面ではない。それゆえ太陽は、大地のすべての地帯に同じ一時間のうちに昇るのではない。もし大地が平らなら、太陽は一瞬にして全大地の上に昇るであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 180
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-05-002
  section: 5
  paragraph: 2
  source_en: Parmenides saith:- Thou hast spoken briefly, O Arisleus!
  translation_ja: パルメニデスは言う。アリスレウスよ、あなたの話は短かった。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 182
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-05-003
  section: 5
  paragraph: 3
  source_en: 'He answereth: Is there anything the Master has left us which bears witness otherwise? Yet
    I testify that God is one, having never engendered or been begotten, and that the head of all things
    after Him is earth and fire, because fire is tenuous and light, and it rules all things on earth,
    but the earth, being ponderous and gross, sustains all things which are ruled by fire.'
  translation_ja: 彼は答える。師がわれわれに遺したもののうち、これと異なる証言をするものがあるか。だが私は証言する。神は一つであり、いまだかつて生まず、生まれたこともない。そして神に次いで万物の首位にあるのは大地と火である。火は微細で軽く、地上の万物を支配するが、大地は重く粗厚で、火に支配される万物を支えているからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 183
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-06-001
  section: 6
  paragraph: 1
  source_en: Lucas saith:- You speak only about four natures; and each one of you observes something concerning
    these. Now, I testify unto you that all things which God hath created are from these four natures,
    and the things which have been created out of them return into them, In these living creatures are
    generated and die, and all things take place as God hath predestinated.
  translation_ja: ルカスは言う。あなたがたは四つの自然についてばかり語り、それぞれがその何かを観察している。さて、私はあなたがたに証言する。神が創った万物はこの四つの自然から生じ、そこから創られたものはそこへ帰る。その内において生き物は生まれ、死に、万事は神があらかじめ定めたとおりに起こる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 186
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-06-002
  section: 6
  paragraph: 2
  source_en: Democritus, the disciple of Lucas, answereth:- Thou hast well spoken, O Lucas, when dealing
    with the four natures!
  translation_ja: ルカスの弟子デモクリトスは答える。ルカスよ、四つの自然について、あなたはよく語った。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 188
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-06-003
  section: 6
  paragraph: 3
  source_en: Then saith Arisleus:- O Democritus, since thy knowledge was derived from Lucas, it is presumption
    to speak among those who are well acquainted with thy master!
  translation_ja: するとアリスレウスは言う。デモクリトスよ、あなたの知識はルカスから来たものであるから、あなたの師をよく知る者たちの中で語るのは出過ぎたことである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 189
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-06-004
  section: 6
  paragraph: 4
  source_en: Lucas answereth:- albeit Democritus received from me the science of natural things, that
    knowledge was derived from the philosophers of the Indies and from the Babylonians; I think he surpasses
    those of his own age in this learning.
  translation_ja: ルカスは答える。デモクリトスは自然の事物についての学を私から受け取ったが、その知識はインドの哲学者たちとバビロニア人たちに由来する。この学問において、彼は同年齢の者たちを凌ぐと私は思う。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 191
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-06-005
  section: 6
  paragraph: 5
  source_en: The Turba answereth:- When he attains to that age he will give no small satisfaction, but
    being in his youth he should keep silence.
  translation_ja: 集会の人々は答える。彼がしかるべき年齢になれば、大いに満足させてくれるであろう。しかし今は若いのだから、沈黙を守るべきである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 192
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-07-001
  section: 7
  paragraph: 1
  source_en: Lucusta saith:- All those creatures which have been described by Lucas are two only, of which
    one is neither known nor expressed, except by piety, for it is not seen or felt.
  translation_ja: ルクスタは言う。ルカスが説明した被造物はすべて、ただ二つである。そのうち一つは、敬虔さによるほかは知られも表現されもしない。見えもせず、感じられもしないからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 196
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-07-002
  section: 7
  paragraph: 2
  source_en: Pythagoras saith:- Thou hast entered upon a subject which, if completed, thou wilt describe
    subtly. State, therefore, what is this thing which is neither felt, seen, nor known.
  translation_ja: ピュタゴラスは言う。あなたは、語り終えるならば精妙に説明することになる主題に入った。では、この感じられも、見られも、知られもしないものが何であるか、述べなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 198
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-07-003
  section: 7
  paragraph: 3
  source_en: Then he:- It is that which is not known, because in this world it is discerned by reason
    without the clients thereof, which are sight, hearing, taste, smell, and touch.
  translation_ja: すると彼は言う。それは知られないものである。この世においてそれは、理性に奉仕する視覚、聴覚、味覚、嗅覚、触覚によらず、理性によって認識されるからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 199
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-07-004
  section: 7
  paragraph: 4
  source_en: O Crowd of the Philosophers, know you not that it Is only sight which can distinguish white
    from black, and hearing only which can discriminate between a good and bad word! Similarly, a wholesome
    odour cannot be separated by reason from one which is fetid, except through the sense of smell, nor
    can sweetness be discriminated from bitterness save by means of taste, nor smooth from rough unless
    by touch.
  translation_ja: 哲学者たちの集いよ、白と黒を区別できるのは視覚だけであり、良い言葉と悪い言葉を判別できるのは聴覚だけであることを、知らないのか。同様に、嗅覚によらずしては、健全な香りを悪臭から理性によって区別できない。味覚によらずして甘さを苦さから分かつことはできず、触覚によらずして滑らかなものを粗いものから分かつこともできない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 200
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-07-005
  section: 7
  paragraph: 5
  source_en: The Turba answereth:- Thou hast well spoken, yet hast thou omitted to treat of that particular
    thing which is not known, or described, except by reason and piety.
  translation_ja: 集会の人々は答える。あなたはよく語った。しかし、理性と敬虔さによるほかは知られも説明されもしない、その特定のものについて語るのを抜かしている。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 201
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-07-006
  section: 7
  paragraph: 6
  source_en: Saith he:- Are ye then in such haste! Know that the creature which is cognised in none of
    these five ways is a sublime creature, and, as such, is neither seen nor felt, but is perceived by
    reason alone, of which reason Nature confesses that God is a partaker.
  translation_ja: 彼は言う。そんなに急ぐのか。知りなさい。この五つの方法のいずれによっても認識されない被造物は、崇高な被造物である。そのようなものとして、それは見えもせず、感じられもせず、ただ理性によってのみ知覚される。そして自然は、この理性を神も分かち持つことを認めている。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 203
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-07-007
  section: 7
  paragraph: 7
  source_en: They answer:- Thou hast spoken truly and excellently.
  translation_ja: 人々は答える。あなたは真実を見事に語った。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 205
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-07-008
  section: 7
  paragraph: 8
  source_en: And he:- I will now give a further explanation. Know that this creature, that is to say,
    the world, hath a light, which is the Sun, and the same is more subtle than all other natures, which
    light is so ordered that living beings may attain to vision. But if this subtle light were removed,
    they would become darkened, seeing nothing, except the light of the moon, or of the stars, or of fire,
    all which are derived from the light of the Sun, which causes all creatures to give light.
  translation_ja: 彼は言う。さらに説明しよう。知りなさい。この被造物、すなわち世界には光があり、それは太陽である。そして太陽は他のすべての自然より精妙である。この光は、生き物が見る力を得られるよう配置されている。しかしこの精妙な光が取り去られると、生き物たちは暗くされ、月、星、あるいは火の光のほか何も見えなくなるであろう。それらの光はすべて、あらゆる被造物を輝かせる太陽の光に由来している。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 206
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-07-009
  section: 7
  paragraph: 9
  source_en: For this God has appointed the Sun to be the light of the world, by reason of the attenuated
    nature of the Sun. And know that the sublime creature before mentioned has no need of the light of
    this Sun, because the Sun is beneath that creature, which is more subtle and more lucid. This light,
    which is more lucid than the light of the Sun, they have taken from the light of God, which is more
    subtle than their light.
  translation_ja: それゆえ神は、太陽の希薄な性質ゆえに、太陽を世界の光と定めた。さて、先に述べた崇高な被造物は、この太陽の光を必要としないことを知りなさい。太陽は、より精妙で、より明るいその被造物より下にあるからである。太陽の光より明るいこの光を、彼らは、自らの光よりさらに精妙な神の光から受け取ったのである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 207
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-07-010
  section: 7
  paragraph: 10
  source_en: Know also that the created world is composed of two dense things and two rare things, but
    nothing of the dense is in the sublime creature. Consequently the Sun is rarer than all inferior creatures.
  translation_ja: また知りなさい。創られた世界は二つの濃密なものと二つの希薄なものとから構成されるが、崇高な被造物のうちには濃密なものは何一つない。それゆえ太陽は、すべての下位の被造物より希薄なのである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 208
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-07-011
  section: 7
  paragraph: 11
  source_en: The Turba answereth:- Thou hast excellently described what thou hast related. And if, good
    Master, thou shalt utter anything whereby our hearts may be vivified, which now are mortified by folly,
    thou wilt confer upon us a great boon!
  translation_ja: 集会の人々は答える。あなたは、述べた事柄を見事に説明した。善き師よ、今は愚かさのため死んでいるわれわれの心を生き返らせるようなことを語ってくださるなら、われわれに大いなる恩恵を施すことになるであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 209
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-001
  section: 8
  paragraph: 1
  source_en: Pythagoras saith:- I affirm that God existed before all things, and with Him was nothing,
    as He was at first. But know, all ye Philosophers, that I declare this in order that I may fortify
    your opinion concerning these four elements and arcana, as well as in the sciences thereof, at which
    no one can arrive save by the will of God.
  translation_ja: ピュタゴラスは言う。私は断言する。神は万物に先立って存在し、初めに在ったときのように、神とともには何もなかった。しかし哲学者の皆よ、知りなさい。私がこれを述べるのは、この四元素と秘義、およびそれらについての諸学に関するあなたがたの考えを堅くするためである。神の意志によらなければ、誰もそれらに到達できない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 212
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-002
  section: 8
  paragraph: 2
  source_en: Understand, that when God was alone, He created four things- fire, air, water, and earth,
    out of which things He afterwards created all others, both the sublime and the inferior, because He
    predestinated from the beginning that all creatures extracted from water should multiply and increase,
    that they might dwell in the world and perform His judgments therein.
  translation_ja: 理解しなさい。神はただ独りであったとき、火、空気、水、大地という四つのものを創り、その後、その四つから、崇高なものも下位のものも含めて、他のすべてを創った。というのも、水から取り出されたすべての被造物が繁殖し増大し、世界に住んで、その内で神の裁きを実行するよう、神は初めから定めていたからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 213
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-003
  section: 8
  paragraph: 3
  source_en: Consequently, before all, He created the four elements, out of which He afterwards created
    what He willed, that is to say, diverse creatures, some of which were produced from a single element.
  translation_ja: したがって神は、何よりも先に四元素を創り、その後そこから、自ら望むもの、すなわち多様な被造物を創った。そのうちには、一つの元素から作られたものもある。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 214
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-004
  section: 8
  paragraph: 4
  source_en: The Turba saith:- Which are these, O Master!
  translation_ja: 集会の人々は言う。師よ、それは何でしょうか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 215
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-005
  section: 8
  paragraph: 5
  source_en: And he:- They are the angels, whom He created out of fire.
  translation_ja: 彼は言う。神が火から創った天使たちである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 217
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-006
  section: 8
  paragraph: 6
  source_en: But the Turba:- Which, then, are created out of two?
  translation_ja: だが集会の人々は言う。では、二つから創られたものは何でしょうか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 219
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-007
  section: 8
  paragraph: 7
  source_en: And he:- Out of the elements of fire and air are the sun, moon, and stars composed. Hence
    the angels are more lucid than the sun, moon, and stars, because they are created from one substance,
    which is less dense than two, while the sun and the stars are created from a composition of fire and
    air.
  translation_ja: 彼は言う。太陽、月、星々は、火と空気の元素から構成されている。それゆえ天使は、太陽、月、星々より明るい。一つの実体から創られており、それは二つの実体より密度が低いからである。一方、太陽と星々は、火と空気の複合から創られている。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 221
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-008
  section: 8
  paragraph: 8
  source_en: The Turba saith:- And what concerning the creation of Heaven?
  translation_ja: 集会の人々は言う。では、天の創造についてはいかがでしょうか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 222
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-009
  section: 8
  paragraph: 9
  source_en: Then he:- God created the Heaven out of water and air, whence this is also composed of two,
    namely, the second of the rarer things, which is air, and the second of the denser things, which is
    water.
  translation_ja: すると彼は言う。神は水と空気から天を創った。したがって、これもまた二つから構成されている。すなわち、希薄なものの第二である空気と、濃密なものの第二である水とからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 224
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-010
  section: 8
  paragraph: 10
  source_en: And they:- Master, continue thy discourse concerning these three, and rejoice our hearts
    with thy sayings, which are life to the dead.
  translation_ja: 人々は言う。師よ、この三つについて話を続け、死者にとって生命となるあなたの言葉で、われわれの心を喜ばせてください。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 226
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-011
  section: 8
  paragraph: 11
  source_en: But the other answereth:- I notify to you that God hath further made creatures out of three
    and out of four; out of three are created flying things, beasts, and vegetables; some of these are
    created out of water, air, and earth, some out of fire, air, and earth.
  translation_ja: 彼は答える。あなたがたに告げよう。神はさらに、三つから、また四つから、被造物を作った。三つから創られたものは、飛ぶもの、獣、植物である。このうちには、水、空気、大地から創られたものも、火、空気、大地から創られたものもある。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 227
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-012
  section: 8
  paragraph: 12
  source_en: But the Turba saith:- Distinguish these divers creatures one from another.
  translation_ja: しかし集会の人々は言う。それら異なる被造物を、互いに区別してください。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 229
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-013
  section: 8
  paragraph: 13
  source_en: And he:- Beasts are created out of fire, air, and earth; flying things out of fire, air,
    and water, because flying things, and all among vegetables which have a spirit, are created out of
    water, while all brute animals are from earth, air, and fire. Yet in vegetables there is no fire,
    for they are created out of earth, water, and air.
  translation_ja: 彼は言う。獣は火、空気、大地から創られ、飛ぶものは火、空気、水から創られる。飛ぶものと、植物のうち霊を持つすべてのものは水から創られ、一方、すべての理性なき動物は大地、空気、火から創られるからである。しかし植物には火がない。大地、水、空気から創られているからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 230
  notes:
  - 同じ発言中で植物の火の有無が問い直される。本文の対話と矛盾を残し、整合する説明を補わない。
  - 公開翻刻の dying things は flying things として校整した。底本の語と文脈を確認した明白な転記誤りの修正。転記段階の読みも内蔵データに保持する。
  source_language: en
  target_language: ja
  kind: body
  transcription_reading: And he:- Beasts are created out of fire, air, and earth; dying things out of
    fire, air, and water, because flying things, and all among vegetables which have a spirit, are created
    out of water, while all brute animals are from earth, air, and fire. Yet in vegetables there is no
    fire, for they are created out of earth, water, and air.
- id: turba-08-014
  section: 8
  paragraph: 14
  source_en: Whereat the Turba saith:- Let us assume that a fire, with your reverence's pardon, does reside
    in vegetables.
  translation_ja: そこで集会の人々は言う。失礼をお許しいただきたいのですが、植物の内にも火が宿ると考えてよいのではありませんか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 232
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-015
  section: 8
  paragraph: 15
  source_en: And he:- Ye have spoken the truth, and I affirm that they contain fire.
  translation_ja: 彼は言う。あなたがたは真実を語った。植物が火を含んでいることを、私は認める。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 233
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-016
  section: 8
  paragraph: 16
  source_en: And they:- Whence is that fire?
  translation_ja: 人々は言う。その火はどこから来るのでしょうか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 235
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-017
  section: 8
  paragraph: 17
  source_en: He answereth:- Out of the heat of the air which is concealed therein; for I have signified
    that a thin fire is present in the air, but the elementary fire concerning which you were in doubt
    is not produced, except in things which have spirit and soul. But out of four elements our father
    Adam and his sons were created, that is, of fire, air, water, and likewise earth. Understand, all
    ye that are wise, how everything which God hath created out of one essence dies not until the Day
    of Judgment.
  translation_ja: 彼は答える。その内に隠れた空気の熱から来る。空気の中には微細な火が存在すると、私は示したからである。しかし、あなたがたが疑問にした元素的な火は、霊と魂を持つものの内でしか生じない。さて、われわれの父アダムとその子らは、四元素、すなわち火、空気、水、そして大地から創られた。賢き者たちよ、神が一つの本質から創ったものはすべて、最後の審判の日までは死なないことを理解しなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 236
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-018
  section: 8
  paragraph: 18
  source_en: The definition of death is the disjunction of the composite, but there is no disjunction
    of that which is simple, for it is one. Death consists in the separation of the soul from the body,
    because anything formed out of two, three, or four components must disintegrate, and this is death.
    Understand, further, that no complex substance which lacks fire eats, drinks, or sleeps, because in
    all things which have a spirit fire is that which eats.
  translation_ja: 死の定義は、複合したものの解離である。しかし単純なものには解離がない。それは一つだからである。死は魂と身体の分離に存する。二つ、三つ、あるいは四つの成分から形作られたものは、必ず分解するからであり、それが死である。さらに理解しなさい。火を欠く複合実体は、食べも飲みも眠りもしない。霊を持つすべてのものにおいて、食べるものは火だからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 237
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-019
  section: 8
  paragraph: 19
  source_en: The Turba answereth:- How is it, Master, that the angels, being created of fire, do not eat,
    seeing thou assertest that fire is that which eats!
  translation_ja: 集会の人々は答える。師よ、火こそ食べるものであるとおっしゃるのに、火から創られた天使たちが食べないのは、どういうわけでしょうか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 238
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-020
  section: 8
  paragraph: 20
  source_en: 'And he: Hence ye doubt, each having his opinion, and ye are become opponents, but if ye
    truly knew the elements, ye would not deny these things. I agree with all whose judgment it is that
    simple fire eats not, but thick fire. The angels, therefore, are not created out of thick fire, but
    out of the thinnest of very thin fire; being created, then, of that which is most simple and exceedingly
    thin, they neither eat, drink, nor sleep.'
  translation_ja: 彼は言う。こうしてあなたがたは、それぞれの考えを持って疑い、反対者となった。しかし元素を真に知っていたなら、これらのことを否定しないであろう。私は、単純な火は食べず、厚い火が食べると判断するすべての者に同意する。天使は厚い火からではなく、極めて微細な火のうちでも最も微細なものから創られている。それゆえ、最も単純で、きわめて微細なものから創られた天使は、食べも飲みも眠りもしない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 239
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-021
  section: 8
  paragraph: 21
  source_en: And the Turba:- Master, our faculties are able to perceive, for by God's assistance we have
    exhausted thy sayings, but our faculties of hearing and of sight are unable to carry such great things.
    May God reward thee for the sake of thy disciples, since it is with the object of instructing future
    generations that thou hast summoned us together from our countries, the recompense of which thou wilt
    not fail to receive from the Judge to come.
  translation_ja: 集会の人々は言う。師よ、われわれの知的能力は認識できます。神の助けによって、あなたの言葉をことごとく理解したからです。しかし聴覚と視覚の能力は、それほど偉大な事柄を受け止めることができません。弟子たちのため、神があなたに報いてくださいますように。あなたは後の世代を教えるため、われわれをそれぞれの国から呼び集めたのですから、その報いを、来たるべき裁き主から必ず受けることでしょう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 240
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-022
  section: 8
  paragraph: 22
  source_en: Arisleus saith:- Seeing that thou hast gathered us together for the advantage of posterity,
    I think that no explanations will be more useful than definitions of those four elements which thou
    hast taught us to attain.
  translation_ja: アリスレウスは言う。後世の人々の益のためにわれわれを集めてくださったのですから、あなたがわれわれに理解するよう教えた四元素の定義ほど役に立つ説明はないと、私は考えます。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 241
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-023
  section: 8
  paragraph: 23
  source_en: And he:- None of you are, I suppose, ignorant that all the Wise have propounded definitions
    in God.
  translation_ja: 彼は言う。賢者たちが皆、神において定義を示したことを、あなたがたのうち誰も知らぬとは思わない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 243
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-024
  section: 8
  paragraph: 24
  source_en: The Turba answereth:- Should your disciples pass over anything, it becomes you, O Master,
    to avoid omissions for the sake of future generations.
  translation_ja: 集会の人々は答える。弟子たちが何かを飛ばすことがあっても、師よ、後の世代のために欠落を避けるのが、あなたにはふさわしいことです。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 245
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-025
  section: 8
  paragraph: 25
  source_en: And he:- If it please you, I will begin the disposition here, since envious men in their
    books have separated that, or otherwise I will put it at the end of the book.
  translation_ja: 彼は言う。あなたがたが望むなら、ここでその配剤の説明を始めよう。惜しむ者たちは、自分たちの書物の中でそれを切り離してしまったからである。あるいは、本書の末尾に置くことにしよう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 246
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-026
  section: 8
  paragraph: 26
  source_en: Whereat the Turba saith:- Place it where you think it will be dearest for future generations.
  translation_ja: そこで集会の人々は言う。後の世代にとって最も大切になると、あなたがお考えになる場所に置いてください。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 248
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-08-027
  section: 8
  paragraph: 27
  source_en: And he:- I will place it where it will not be recognised by the foolish, nor ignored by the
    Sons of the Doctrine, for it is the key, the perfection and the end.
  translation_ja: 彼は言う。愚者には見抜かれず、教えの子らには見過ごされない場所に置こう。それは鍵であり、完成であり、終わりだからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 250
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-09-001
  section: 9
  paragraph: 1
  source_en: 'Eximenus saith:- God hath created all things by his word, having said unto them: Be, and
    they were made, with the four other elements, earth, water, air, and fire, which He coagulated, and
    things contrary were commingled, for we see that fire is hostile to water, water hostile to fire,
    and both are hostile to earth and air. Yet God hath united them peacefully, so that they love one
    another.'
  translation_ja: エクシメヌスは言う。神はその言葉によって万物を創った。「在れ」と命じると、それらは作られたのである。他の四元素である大地、水、空気、火とともに、神はそれらを凝固させ、相反するものを混ぜ合わせた。われわれは、火が水に敵対し、水が火に敵対し、両者が大地と空気に敵対するのを見る。しかし神は、それらが互いに愛し合うよう、平和のうちに結びつけた。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 253
  notes:
  - 公開翻刻の and tire は and fire として校整した。底本の語と文脈を確認した明白な転記誤りの修正。転記段階の読みも内蔵データに保持する。
  source_language: en
  target_language: ja
  kind: body
  transcription_reading: 'Eximenus saith:- God hath created all things by his word, having said unto them:
    Be, and they were made, with the four other elements, earth, water, air, and tire, which He coagulated,
    and things contrary were commingled, for we see that fire is hostile to water, water hostile to fire,
    and both are hostile to earth and air. Yet God hath united them peacefully, so that they love one
    another.'
- id: turba-09-002
  section: 9
  paragraph: 2
  source_en: Out of these four elements, therefore, are all things created- heaven and the throne thereof;
    the angels; the sun, moon. and stars; earth and sea, with all things that are in the sea, which indeed
    are various, and not alike, for their natures have been made diverse by God, and also the creations.
    But the diversity is more than I have stated; each of these natures is of diverse nature, and by a
    legion of diversities is the nature of each diverse.
  translation_ja: したがって、この四元素から万物が創られた。天とその王座、天使、太陽、月、星々、大地と海、そして海の中にあるすべてのものがそうである。それらは実に多様で、互いに同じではない。神によってその自然も、創られ方も異なるものとされたからである。しかし多様性は、私が述べた以上のものである。これらの自然はそれぞれ異なる自然を持ち、無数の差異によって、各々の自然は異なるものとなっている。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 254
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-09-003
  section: 9
  paragraph: 3
  source_en: Now this diversity subsists in all creatures, because they were created out of diverse elements.
    Had they been created out of one element, they would have been agreeing natures. But diverse elements
    being here mingled, they lose their own natures, because the dry being mixed with the humid and the
    cold combined with the hot, become neither cold nor hot; so also the humid being mixed with the dry
    becomes neither dry nor humid.
  translation_ja: さて、この多様性はあらゆる被造物のうちにある。それらが異なる元素から創られたからである。もし一つの元素から創られていたなら、調和する自然であったであろう。しかしここでは異なる元素が混ぜられるため、それぞれ自身の自然を失う。乾いたものが湿ったものと混ざり、冷たいものが熱いものと結びつけば、冷たくも熱くもなくなるからである。同様に、湿ったものが乾いたものと混ざれば、乾いても湿ってもいないものとなる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 255
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-09-004
  section: 9
  paragraph: 4
  source_en: But when the four elements are commingled, they agree, and thence proceed creatures which
    never attain to perfection, except they be left by night to putrefy and become visibly corrupt. God
    further completed his creation by means of increase, food, life, and government.
  translation_ja: だが四元素が混ぜられると、それらは調和し、そこから被造物が生じる。その被造物は、夜の間置かれて腐敗し、目に見えて朽ちるのでなければ、決して完成に達しない。神はさらに、成長、食物、生命、支配によって、自らの創造を完成させた。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 256
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-09-005
  section: 9
  paragraph: 5
  source_en: Sons of the Doctrine, not without purpose have I described to you the disposition of these
    four elements, for in them is a secret arcanum; two of them are perceptible to the sense of touch
    and vision, and of these the operation and virtue are well known. These are earth and water.
  translation_ja: 教えの子らよ、私がこの四元素の配置をあなたがたに説明したのは、理由のないことではない。その内には隠された秘義があるからである。そのうち二つは触覚と視覚に感知され、その作用と力はよく知られている。それは大地と水である。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 257
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-09-006
  section: 9
  paragraph: 6
  source_en: But there are two other elements which are neither visible nor tangible, which yield naught,
    whereof the place is never seen, nor are their operations and force known, save in the former elements,
    namely, earth and water; now when the four elements are not commingled, no desire of men is accomplished.
    But being mixed, departing from their own natures, they become another thing. Over these let us meditate
    very carefully.
  translation_ja: しかし、見えも触れもせず、何も産出せず、その場所も決して見られない、別の二つの元素がある。それらの作用と力は、先の元素、すなわち大地と水の内においてしか知られない。さて、四元素が混ざり合っていないとき、人の願いは何一つ成就しない。だが混ぜられると、自らの自然を離れて別のものとなる。これらのことを、きわめて注意深く考察しよう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 258
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-09-007
  section: 9
  paragraph: 7
  source_en: And the Turba:- Master, if you speak, we will give heed to Your words.
  translation_ja: 集会の人々は言う。師よ、話してくだされば、われわれはあなたの言葉に耳を傾けます。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 259
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-09-008
  section: 9
  paragraph: 8
  source_en: 'Then he:- I have now discoursed, and that well. I will speak only useful words which ye
    will follow as spoken. Know, all present, that no true tincture is made except from our copper. Do
    not therefore, exhaust your brains and your money, lest ye fill your hearts with sorrow. I will give
    you a fundamental axiom, that unless you turn the aforesaid copper into white, and make visible coins
    and then afterwards again turn it into redness, until a Tincture: results, verily, ye accomplish nothing.'
  translation_ja: すると彼は言う。私はすでに、しかもよく論じた。あなたがたが語られたとおりに従う、有益な言葉だけを述べよう。ここにいる皆よ、知りなさい。われわれの銅によるのでなければ、真の着色剤は作られない。したがって、頭と金銭を使い果たし、心を悲しみで満たしてはならない。根本の公理を授けよう。前述の銅を白くし、目に見える貨幣にして、その後、着色剤が生じるまで再び赤へ変えないならば、まことに何一つ成し遂げられない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 260
  notes:
  - tincture は、金属を染める・変成する力またはその作用物をいう錬金術語。ここでは主に「着色剤」と訳し、現代の医薬品チンキと同一視しない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-09-009
  section: 9
  paragraph: 9
  source_en: Burn therefore the copper, break it up, deprive it of its blackness by cooking, imbuing,
    and washing, until the same becomes white. Then rule it.
  translation_ja: それゆえ銅を焼き、砕き、煮て、浸し、洗って、白くなるまで黒さを取り去りなさい。それからこれを処理しなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 261
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-10-001
  section: 10
  paragraph: 1
  source_en: Arisleus saith:- Know that the key of this work is the art of Coins. Take, therefore, the
    body which I have shewn to you and reduce it to thin tablets. Next immerse the said tablets in the
    Water of our Sea, which is permanent Water, and, after it is covered, set it over a gentle fire until
    the tablets are melted and become waters or Etheliae, which are one and the same thing. Mix, cook,
    and simmer in a gentle fire until Brodium is produced, like to Saginatum.
  translation_ja: アリスレウスは言う。知りなさい。この作業の鍵は貨幣の術である。ゆえに私が示した物体を取り、薄い板にしなさい。次に、その板を、恒久の水であるわれわれの海の水に浸しなさい。覆われたら穏やかな火にかけ、板が溶けて水、すなわちエテリアとなるまで置きなさい。水とエテリアは同じものである。混ぜ、煮て、穏やかな火で煮詰め、サギナトゥムに似たブロディウムが生じるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 263
  notes:
  - Ethelia、Brodium、Saginatum 等の語は、伝承の過程で綴りや意味が揺れる術語。確定した現代の化学物質名に置き換えず音写した。Permanent Water は「恒久の水」で統一する。
  source_language: en
  target_language: ja
  kind: body
- id: turba-10-002
  section: 10
  paragraph: 2
  source_en: Then stir in its water of Etheliae until it be coagulated, and the coins become variegated,
    which we call the Flower of Salt. Cook it, therefore, until it be deprived of blackness, and the whiteness
    appear. Then rub it, mix with the Gum of Gold, and cook until it becomes red Etheliae. Use patience
    in pounding lest you become weary. Imbue the Ethelia with its own water, which has preceded from it,
    which also is Permanent Water, until the same becomes red.
  translation_ja: 次に、そのエテリアの水を混ぜ入れ、凝固して貨幣が多彩な色を帯びるまで続けなさい。われわれはこれを塩の花と呼ぶ。黒さがなくなり、白さが現れるまで煮なさい。それからすりつぶし、金の樹脂と混ぜ、赤いエテリアとなるまで煮なさい。砕くときは忍耐し、疲れて投げ出さぬようにしなさい。エテリアを、それ自身から出た水、すなわち恒久の水で浸し、赤くなるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 264
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-10-003
  section: 10
  paragraph: 3
  source_en: This, then, is Burnt Copper, which is the Leaven of Gold and the Flower thereof. Cook the
    same with Permanent Water, which is always with it, until the water be dried up. Continue the operation
    until all the water is consumed, and it becomes a most subtle powder.
  translation_ja: これこそ焼かれた銅であり、金の酵母であり、その花である。それと常にともにある恒久の水で、水が乾ききるまでこれを煮なさい。すべての水が消費され、きわめて微細な粉末となるまで、この作業を続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 265
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-11-001
  section: 11
  paragraph: 1
  source_en: Parmenides saith:- Ye must know that envious men have dealt voluminously with several waters,
    brodiums, stones, and metals, seeking to deceive all you who aspire after knowledge. Leave, therefore,
    all these, and make the white red, out of this our copper, taking copper and lead, letting these stand
    for the grease, or blackness, and tin for the liquefaction.
  translation_ja: パルメニデスは言う。知るべきである。惜しむ者たちは、知識を求めるあなたがたを皆欺こうとして、さまざまな水、ブロディウム、石、金属について長々と論じてきた。したがってそれらをすべて捨て、このわれわれの銅から、白いものを赤くしなさい。銅と鉛を取り、それらを脂、すなわち黒さに当て、錫を液化に当てなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 267
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-11-002
  section: 11
  paragraph: 2
  source_en: Know ye, further, that unless ye rule the Nature of Truth, and harmonize well together its
    complexions and compositions, the consanguineous with the consanguineous, and the first with the first,
    ye act improperly and effect nothing, because natures will meet their natures, follow them, and rejoice.
    For in them they putrefy and are generated, because Nature is ruled by Nature, which destroys it,
    turns it into dust, reduces to nothing, and finally herself renews it, repeats, and frequently produces
    the same.
  translation_ja: さらに知りなさい。〈真実の自然〉を制御し、その性質と組成を、血縁のものを血縁のものと、第一のものを第一のものと、よく調和させなければ、あなたがたの行為は不適切で、何も成し遂げられない。自然は自らの自然と出会い、それに従い、喜ぶからである。その内で自然は腐敗し、生まれる。自然は自然によって支配され、その自然は自然を滅ぼし、塵に変え、無に帰し、ついには自らそれを更新し、反復して、たびたび同じものを産出するからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 268
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-11-003
  section: 11
  paragraph: 3
  source_en: Therefore look in books, that ye may know the Nature of Truth, what putrefies it and what
    renews, what savour it possesses, what neighbours it naturally has, and how they love each other,
    how also after love enmity and corruption intervene, and how these natures should be united one to
    another and made at peace, until they become gentle in the fire in similar fashion. Having, therefore,
    noticed the facts in this Art, set your hands to the work.
  translation_ja: それゆえ書物を調べ、〈真実の自然〉を知りなさい。何がそれを腐敗させ、何が新しくするか、どのような味を持つか、本性上どのような隣人を持つか、それらがいかに愛し合うか、また愛の後にいかに敵意と腐敗が入り込むかを知りなさい。そして、これらの自然を互いにどのように結びつけ、和解させて、同じように火の中で穏やかになるに至らせるかを知りなさい。この術の事実をよく観察したうえで、作業に手を着けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 269
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-11-004
  section: 11
  paragraph: 4
  source_en: If indeed, ye know not the Natures of Truth, do not approach the work, since there will follow
    nothing but harm, disaster, and sadness. Consider, therefore, the teaching of the Wise, how they have
    declared the whole work in this saying:- Nature rejoices in Nature, and Nature contains Nature. In
    these words there is shewn forth unto you the whole work.
  translation_ja: もし〈真実の自然〉を知らないなら、作業に近づいてはならない。害、災難、悲しみしか続かないからである。したがって賢者たちの教えを考えなさい。彼らは「自然は自然の内で喜び、自然は自然を包む」という言葉によって、作業全体をどのように言い表しているか。この言葉の内に、作業の全体があなたがたに示されているのである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 270
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-11-005
  section: 11
  paragraph: 5
  source_en: Leave, therefore, manifold and superfluous things, and take quicksilver, coagulate in the
    body of Magnesia, in Kuhul, or in Sulphur which does not burn; make the same nature white, and place
    it upon our Copper, when it becomes white. And if ye cook still more, it becomes red, when if ye proceed
    to coction, it becomes gold. I tell you that it turns the sea itself into red and the colour of gold.
  translation_ja: それゆえ、多くの余計なものを捨て、水銀を取り、マグネシアの物体、クフル、あるいは燃えない硫黄の内で凝固させなさい。その自然を白くし、白くなったらわれわれの銅の上に置きなさい。さらに煮れば赤くなる。そのとき煮ることを続ければ、金となる。それは海そのものを赤と金の色へ変えるのだと、私はあなたがたに告げる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 271
  notes:
  - Magnesia は現代の酸化マグネシウムを自動的に意味しない。Kuhul、Sulphur、Copper 等も、この作品の多義的な名称として読む必要がある。
  source_language: en
  target_language: ja
  kind: body
- id: turba-11-006
  section: 11
  paragraph: 6
  source_en: 'Know ye also that gold is not turned into redness save by Permanent Water, because Nature
    rejoices in Nature.: Reduce, therefore, the same by means of cooking into a humour, until the hidden
    nature appear. If, therefore, it be manifested externally, seven times imbue the same with water,
    cooking, imbuing, and washing, until it become red.'
  translation_ja: また知りなさい。金は恒久の水によるのでなければ赤くならない。自然は自然の内で喜ぶからである。したがってそれを煮て液状にし、隠れた自然が現れるまで続けなさい。それが外に現れたら、水で七度浸し、煮て、浸し、洗い、赤くなるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 272
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-11-007
  section: 11
  paragraph: 7
  source_en: O those celestial natures, multiplying the natures of truth by the will of God! O that potent
    Nature, which overcame and conquered natures, and caused its natures to rejoice and be glad! This,
    therefore, is that special and spiritual nature to which the God thereof can give what fire cannot.
    Consequently, we glorify and magnify that [species], than which nothing is more precious in the true
    tincture, or the like in the smallest degree to be found. This is that truth which those investigating
    wisdom love.
  translation_ja: おお、神の意志によって真実の自然を増殖させる、天上の自然よ。おお、諸々の自然に勝ち、これを征服し、自らの自然を喜ばせ、楽しませる、力ある自然よ。これこそ、その神が、火には与えられないものを与えうる、特別で霊的な自然である。それゆえわれわれは、その〔種〕を讃え、称揚する。真の着色剤の内には、これより貴いものはなく、少しでもこれに似たものも見いだされない。これこそ、叡智を探究する者たちが愛する真実である。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 273
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-11-008
  section: 11
  paragraph: 8
  source_en: For when it is liquefied with bodies, the highest operation is effected. If ye knew the truth,
    what great thanks ye would give me! Learn, therefore, that while you are tingeing the cinders, you
    must destroy those that are mixed. For it overcomes those which are mixed, and changes them to its
    own colour. And as it visibly overcame the surface, even so it mastered the interior. And if one be
    volatile but the other endure the fire, either joined to the other endures the fire.
  translation_ja: というのも、それを物体とともに液化させると、最高の作用が実現するからである。真実を知ったなら、あなたがたはどれほど私に感謝することだろう。したがって学びなさい。焼滓を染めるときには、混ざり込んだものを滅ぼさねばならない。それは混ざったものに打ち勝ち、自らの色へ変えるからである。そして目に見える表面を征服したように、内部をも支配する。もし一方が揮発し、他方が火に耐えるならば、互いに結ばれた両者はいずれも火に耐える。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 274
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-11-009
  section: 11
  paragraph: 9
  source_en: Know also, that if the vapours have whitened the surfaces, they will certainly whiten the
    interiors. Know further, all ye seekers after Wisdom, that one matter overcomes four, and our Sulphur
    alone consumes all things.
  translation_ja: また知りなさい。蒸気が表面を白くしたならば、必ず内部も白くする。さらに叡智を求める皆よ、知りなさい。一つの質料が四つに勝ち、われわれの硫黄だけが万物を食い尽くす。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 275
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-11-010
  section: 11
  paragraph: 10
  source_en: 'The Turba answereth: Thou hast spoken excellently well, O Parmenides, but thou hast not
    demonstrated the disposition of the smoke to posterity, nor how the same is whitened!'
  translation_ja: 集会の人々は答える。パルメニデスよ、あなたは実によく語った。しかし煙の処理法と、それがどのように白くされるかを、後世の人々に示していない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 276
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-12-001
  section: 12
  paragraph: 1
  source_en: 'Lucas saith: I will speak at this time, following the steps of the ancients. Know, therefore,
    all ye seekers after Wisdom, that this treatise is not from the beginning of the ruling! Take quicksilver,
    which is from the male, and coagulate according to custom. Observe that I am speaking to you in accordance
    with custom, because it has been already coagulated.'
  translation_ja: ルカスは言う。今、私は古人の足跡に従って語ろう。ゆえに叡智を求める皆よ、知りなさい。この論述は処理の最初から始まるものではない。雄から来る水銀を取り、常法に従って凝固させなさい。私が常法に従って語っていることに注意しなさい。なぜなら、それはすでに凝固されているからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 279
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-12-002
  section: 12
  paragraph: 2
  source_en: Here, therefore, is not the beginning of the ruling, but I prescribe this method, namely,
    that you shall take the quicksilver from the male, and shall either impose upon iron, tin, or governed
    copper, and it will be whitened. White Magnesia is made in the same way, and the male is converted
    with it.
  translation_ja: したがってここは処理の出発点ではないが、私は次の方法を指示する。すなわち、雄から水銀を取り、それを鉄、錫、あるいは処理された銅の上に置けば、それは白くなる。白いマグネシアも同じ仕方で作られ、雄はそれとともに変えられる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 280
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-12-003
  section: 12
  paragraph: 3
  source_en: But forasmuch as there is a certain affinity between the magnet and the iron, therefore our
    nature rejoices.) Take, then, the vapour which the Ancients commanded you to take, and cook the same
    with its own body until tin is produced. Wash away its blackness according to custom, and cleanse
    and roast at an equable fire until it be whitened. But every body is whitened with governed quicksilver,
    for Nature converts Nature.
  translation_ja: しかし磁石と鉄の間にはある親近性があるため、われわれの自然は喜ぶ。ゆえに古人たちが取るよう命じた蒸気を取り、それ自身の物体とともに煮て、錫が生じるまで続けなさい。常法に従ってその黒さを洗い去り、清め、均一な火で白くなるまで焼きなさい。すべての物体は処理された水銀によって白くなる。自然が自然を変えるからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 281
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-12-004
  section: 12
  paragraph: 4
  source_en: 'Take, therefore, Magnesia, Water of Alum, Water of Nitre, Water of the Sea, and Water of
    Iron; whiten with smoke.: Whatsoever ye desire to be whitened is whitened with this smoke, because
    it is itself white, and whitens all things. Mix, therefore, the said smoke with its faeces until it
    be coagulated and become excessively white.'
  translation_ja: それゆえマグネシア、明礬の水、硝石の水、海の水、鉄の水を取り、煙によって白くしなさい。白くしたいと思うものは何であれ、この煙によって白くなる。煙自体が白く、あらゆるものを白くするからである。ゆえに、その煙をそれ自身の滓と混ぜ、凝固して極めて白くなるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 282
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-12-005
  section: 12
  paragraph: 5
  source_en: Roast this white copper till it germinates of itself, since the Magnesia when whitened does
    not suffer the spirits to escape, or the shadow of copper to appear, because Nature contains Nature.
    Take, therefore, all ye Sons of the Doctrine, the white sulphureous nature, whiten with salt and dew,
    or with the Flower of White Salt, until it become excessively white. And know ye, that the Flower
    of White Salt is Ether from Ethelia.
  translation_ja: この白い銅を、それ自身から芽を出すまで焼きなさい。マグネシアは白くされると、霊が逃れることも、銅の影が現れることも許さない。自然は自然を包むからである。ゆえに教えの子らよ、皆、白い硫黄性の自然を取り、塩と露、あるいは白い塩の花によって、極めて白くなるまで白化させなさい。そして、白い塩の花とはエテリアからのエーテルであることを知りなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 283
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-12-006
  section: 12
  paragraph: 6
  source_en: The same must be boiled for seven days, till it shall become like gleaming marble, for when
    it has reached this condition it is a very great Arcanum, seeing that Sulphur is mixed with Sulphur,
    whence an excellent work is accomplished, by reason of the affinity between them, because natures
    rejoice in meeting their own natures. Take, therefore, Mardek and whiten the same with Gadenbe, that
    is, wine and vinegar, and Permanent Water.
  translation_ja: それを七日間煮て、輝く大理石のようにしなければならない。この状態に達すると、それは極めて偉大な秘義となる。硫黄が硫黄と混ざり、両者の親近性ゆえに、そこから優れた作業が成し遂げられるからである。自然は、自らの自然と出会うことを喜ぶ。それゆえマルデクを取り、ガデンベ、すなわち葡萄酒と酢、そして恒久の水で、これを白くしなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 284
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-12-007
  section: 12
  paragraph: 7
  source_en: Roast and coagulate until the whole does not liquefy in a fire stronger than its own, namely,
    the former fire. Cover the mouth of the vessel securely, but let it be associated with its neighbour,
    that it may kindle the whiteness thereof, and beware lest the fire blaze up, for in this case it becomes
    red prematurely, and this will profit you nothing, because in the beginning of the ruling you require
    the white. Afterwards coagulate the same until you attain the red.
  translation_ja: 焼いて凝固させ、全体がそれ自身の火、すなわち以前の火より強い火でも液化しなくなるまで続けなさい。容器の口をしっかり覆いなさい。ただし、その白さを燃え立たせるため、その隣人と結びつけなさい。そして火が燃え上がらぬよう気をつけなさい。そうなれば時期尚早に赤くなり、何の役にも立たない。処理の初めには白いものが必要だからである。その後、赤に達するまで凝固させなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 285
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-12-008
  section: 12
  paragraph: 8
  source_en: Let your fire be gentle in the whitening, until coagulation take place. Know that when it
    is coagulated we call it the Soul, and it is more quickly converted from nature into nature. This,
    therefore, is sufficient for those who deal with the Art of Coins, because one thing makes it but
    many operate therein. For ye need not a number of things, but one thing only, which in each and every
    grade of your work is changed into another nature.
  translation_ja: 白化の際には、凝固が起こるまで火を穏やかに保ちなさい。凝固したものをわれわれは〈魂〉と呼び、それは自然から自然へ、より速やかに変えられることを知りなさい。したがって、貨幣の術に携わる者たちにはこれで十分である。一つのものがそれを作るが、その内では多くのものが働くからである。必要なのは多数のものではなく、ただ一つのものだけであり、それが作業の各段階で、それぞれ別の自然へ変わるのである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 286
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-12-009
  section: 12
  paragraph: 9
  source_en: 'The Turba saith: Master, if you speak as the Wise have spoken, and that briefly, they will
    follow you who do not wish to be wholly shut in with darkness.'
  translation_ja: 集会の人々は言う。師よ、賢者たちが語ったように簡潔に話してくだされば、完全に闇の中へ閉じ込められたくないと願う者たちが、あなたに従うでしょう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 287
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-13-001
  section: 13
  paragraph: 1
  source_en: Pythagoras saith:- We posit another government which is not from another root, but it differs
    in name. And know, all ye seekers after this Science and Wisdom, that whatsoever the envious may have
    enjoined in their books concerning the composition of natures which agree together, in savour there
    is only one, albeit to sight they are as diverse as possible.
  translation_ja: ピュタゴラスは言う。別の根から出るのではなく、名だけが異なる、もう一つの処理法を示そう。この学と叡智を求める皆よ、知りなさい。相互に適合する自然の配合について、惜しむ者たちが書物で何を命じていようと、見かけがいかに多様であっても、味においてはただ一つしかない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 290
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-13-002
  section: 13
  paragraph: 2
  source_en: Know, also, that the thing which they have described in so many ways follows and attains
    its companion without fire, even as the magnet follows the iron, to which the said thing is not vainly
    compared, nor to a seed, nor to a matrix, for it is also like unto these.
  translation_ja: また知りなさい。彼らが多くの仕方で説明したものは、磁石が鉄を追うように、火なしでその伴侶を追い、これに到達する。それが磁石に、また種や母胎にたとえられるのは、理由のないことではない。それらにも似ているからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 291
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-13-003
  section: 13
  paragraph: 3
  source_en: And this same thing, which follows its companion without fire, causes many colours to appear
    when embracing it, for this reason, that the said one thing enters into every regimen, and is found
    everywhere, being a stone, and also not a stone; common and precious; hidden and concealed, yet known
    by everyone; of one name and of many names, which is the Spume of the Moon.
  translation_ja: そして火なしで伴侶を追うこの同じものは、相手を抱くとき、多くの色を現れさせる。というのも、この一つのものはあらゆる処理に入り込み、いたるところに見いだされるからである。それは石であり、石でなく、ありふれていて貴く、隠され秘められていながら誰にも知られ、一つの名と多くの名を持つ。それこそ〈月の泡〉である。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 292
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-13-004
  section: 13
  paragraph: 4
  source_en: This stone, therefore, is not a stone, because it is more precious; without it Nature never
    operates anything; its name is one, yet we have called it by many names on account of the excellence
    of its nature.
  translation_ja: したがってこの石は、石ではない。石より貴いからである。これなしには、自然は決して何も成し遂げない。その名は一つだが、われわれはその自然の優秀さゆえに、多くの名で呼んだ。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 293
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-13-005
  section: 13
  paragraph: 5
  source_en: The Turba answereth:- O! Master! wilt thou not mention some of those names for the guidance
    of seekers?
  translation_ja: 集会の人々は答える。おお、師よ。探求者たちの手引きのため、その名のいくつかを挙げてはくださいませんか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 294
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-13-006
  section: 13
  paragraph: 6
  source_en: And he:- It is called White Ethelia, White Copper, and that which flies from the fire and
    alone whitens copper. Break up, therefore, the White Stone, and afterwards coagulate it with milk.
    Then pound the calx in the mortar, taking care that the humidity does not escape from the vessel;
    but coagulate it in the vessel until it shall become a cinder. Cook also with Spume of Luna and regulate.
    For ye shall find the stone broken, and already imbued with its own water.
  translation_ja: 彼は言う。それは白いエテリア、白い銅、そして火から逃れ、ただ独り銅を白くするもの、と呼ばれる。ゆえに白い石を砕き、その後、乳とともに凝固させなさい。それから灰を乳鉢で砕き、湿りが容器から逃れないよう注意しなさい。容器の内で焼滓となるまで凝固させなさい。また月の泡とともに煮て、調節しなさい。そうすれば、石が砕かれ、すでにそれ自身の水に浸されているのを見いだすであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 295
  notes:
  - calx は煆焼された物質を指す術語。ここでは「灰」とし、現代の石灰だけに限定しない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-13-007
  section: 13
  paragraph: 7
  source_en: This, therefore, is the stone which we call by all names, which assimilates the work and
    drinks it, and is the stone out of which also all colours appear. Take, therefore, that same gum,
    which is from the scoriae, and mix with cinder of calx, which you have ruled, and with the faeces
    which you know, moistening with permanent water. Then look and see whether it has become a powder,
    but if not, roast in a fire stronger than the first fire, until it be pounded.
  translation_ja: これこそ、われわれがあらゆる名で呼ぶ石である。それは作業物を同化して飲み込み、また、あらゆる色がそこから現れる石でもある。したがって、鉱滓から生じるその樹脂を取り、あなたがたが処理した灰の焼滓と、知っている滓とに混ぜ、恒久の水で湿らせなさい。それから眺めて、粉末となったか確かめなさい。なっていなければ、最初の火より強い火で、砕かれるまで焼きなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 296
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-13-008
  section: 13
  paragraph: 8
  source_en: Then imbue with permanent water, and the more the colours vary all the more suffer them to
    be heated. Know, moreover, that if you take white quicksilver, or the Spume of Luna, and do as ye
    are bidden, breaking up with a gentle fire, the same is coagulated, and becomes a stone. Out of this
    stone, therefore, when it is broken up, many colours will appear to you.
  translation_ja: 次に恒久の水で浸しなさい。そして色が変化すればするほど、いっそう加熱に任せなさい。さらに知りなさい。白い水銀、すなわち月の泡を取り、命じられたとおりに穏やかな火で分解すれば、それは凝固して石となる。したがって、この石が砕かれると、そこから多くの色があなたがたに現れるであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 297
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-13-009
  section: 13
  paragraph: 9
  source_en: But herein, if any ambiguity occur to you in our discourse, do as ye are bidden, ruling the
    same until a white and coruscating stone shall be produced, and so ye find your purpose.
  translation_ja: しかし、この話に何か曖昧な点を感じても、命じられたとおりに行い、白く閃く石が生まれるまで処理を続けなさい。そうすれば目的を見いだすであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 298
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-14-001
  section: 14
  paragraph: 1
  source_en: Acsubofen saith:- Master, thou hast spoken without envy, even as became thee, and for the
    same may God reward thee!
  translation_ja: アクスボフェンは言う。師よ、あなたは、その立場にふさわしく、惜しまず語ってくださいました。そのために神が報いてくださいますように。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 301
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-14-002
  section: 14
  paragraph: 2
  source_en: Pythagoras saith:- May God also deliver thee, Acsubofen, from envy!
  translation_ja: ピュタゴラスは言う。アクスボフェンよ、神があなたをも惜しむ心から救ってくださるように。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 303
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-14-003
  section: 14
  paragraph: 3
  source_en: Then he:- Ye must know, O Assembly of the Wise, that sulphurs are contained in sulphurs,
    and humidity in humidity.
  translation_ja: すると彼は言う。賢者たちの集会よ、知るべきである。硫黄は硫黄の内に含まれ、湿りは湿りの内に含まれている。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 305
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-14-004
  section: 14
  paragraph: 4
  source_en: The Turba answereth:- The envious, O Acsubofen, have uttered something like unto this! Tell
    us, therefore, what is this humidity?
  translation_ja: 集会の人々は答える。アクスボフェンよ、惜しむ者たちもそれに似たことを語ってきた。では、その湿りとは何か、われわれに教えてほしい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 307
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-14-005
  section: 14
  paragraph: 5
  source_en: 'And he:- Humidity is a venom, and when venom penetrates a body, it tinges it with an invariable
    colour, and in no wise permits the soul to be separated from the body, because it is equal thereto.
    Concerning this, the envious have said: When one flies and the other pursues, then one seizes upon
    the other, and afterwards they no longer flee, because Nature has laid hold of its equal, after the
    manner of an enemy, and they destroy one another.'
  translation_ja: 彼は言う。湿りとは毒である。毒が物体の中へ入り込むと、それを変わらぬ色に染め、魂が身体から離れるのを決して許さない。毒はその身体に等しいからである。これについて惜しむ者たちは言った。一方が逃げ、他方が追うとき、一方は他方を捕らえ、その後はもう逃げない。自然が敵を捕らえるように自らと等しいものを捕らえ、両者は互いを滅ぼすからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 308
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-14-006
  section: 14
  paragraph: 6
  source_en: For this reason, out of the sulphureous mixed sulphur is produced a most precious colour,
    which varies not, nor flees from the fire, when the soul enters into the interior of the body and
    holds the body together and tinges it. I will repeat my words in Tyrian dye. Take the Animal which
    is called Kenckel, since all its water is a Tyrian colour, and rule the same with a gentle fire, as
    is customary, until it shall become earth, in which there will be a little colour.
  translation_ja: それゆえ、硫黄性の混合された硫黄から、最も貴い色が生まれる。それは、魂が身体の内部へ入り、身体を結び合わせて染めるとき、変わることも、火から逃げることもない。テュロスの染料を例に、言葉を繰り返そう。ケンケルと呼ばれる動物を取りなさい。その水はすべてテュロスの色だからである。そして常法に従い、穏やかな火で処理し、少しの色を含む土となるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 309
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-14-007
  section: 14
  paragraph: 7
  source_en: But if you wish to obtain the Tyrian tincture, take the humidity which that thing has ejected,
    and place it therewith gradually in a vessel, adding that tincture whereof the colour was disagreeable
    to you. Then cook with that same marine water until it shall become dry. Afterwards moisten with that
    humour, dry gradually, and cease not to imbue it, to cook, and to dry, until it be imbued with all
    its humour.
  translation_ja: しかしテュロスの着色剤を得たいならば、そのものが排出した湿りを取り、容器の内で少しずつそれに加え、あなたがたの気に入らなかった色の着色剤を加えなさい。次に、その同じ海の水で乾くまで煮なさい。その後、その液で湿らせ、徐々に乾かし、すべての液が浸み込むまで、浸し、煮て、乾かすことをやめてはならない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 310
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-14-008
  section: 14
  paragraph: 8
  source_en: Then leave it for several days in its own vessel, Until the most precious Tyrian colour shall
    come out from it to the surface. Observe how I describe the regimen to you! Prepare it with the urine
    of boys, with water of the sea, and with permanent clean water, so that it may be tinged, and decoct
    with a gentle fire, until the blackness altogether shall depart from it, and it be easily pounded.
    Decoct, therefore, in its own humour until it clothe itself with a red colour.
  translation_ja: それから数日間、それ自身の容器に放置し、最も貴いテュロスの色が内部から表面へ出てくるのを待ちなさい。私があなたがたに処理法をどう説明しているか、注意しなさい。少年たちの尿、海の水、清浄な恒久の水で調製して色を付け、穏やかな火で煮詰め、黒さがすっかり去って容易に砕けるようになるまで続けなさい。それゆえ、それ自身の液の内で、赤い色をまとうまで煮詰めなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 311
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-14-009
  section: 14
  paragraph: 9
  source_en: But if ye wish to bring it to the Tyrian colour, imbue the same with continual water, and
    mix, as ye know to be sufficient, according to the rule of sight; mix the same with permanent water
    sufficiently, and decoct until rust absorb the water. Then wash with the water of the sea which thou
    hast prepared, which is water of desiccated calx; cook until it imbibe its own moisture; and do this
    day by day. I tell you that a colour will thence appear to you the like of which the Tyrians have
    never made.
  translation_ja: しかしテュロスの色にしたいならば、絶えざる水で浸し、目で判断する規則に従って、十分と知れるだけ混ぜなさい。恒久の水を十分に混ぜ、錆が水を吸収するまで煮詰めなさい。それから、調製しておいた海の水、すなわち乾いた灰の水で洗い、それ自身の湿りを吸い込むまで煮なさい。これを日々行いなさい。そうすれば、テュロス人がいまだ作ったことのないような色が、そこから現れると私は告げる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 312
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-14-010
  section: 14
  paragraph: 10
  source_en: And if ye wish that it should be a still more exalted colour, place the gum in the permanent
    water, with which ye shall dye it alternately, and afterwards desiccate in the sun. Then restore to
    the aforesaid water and the black Tyrian colour is intensified. But know that ye do not tinge the
    purple colour except by cold. Take, therefore, water which is of the nature of cold, and steep wool
    therein until it extract the force of the tincture from the water.
  translation_ja: さらに高められた色にしたいならば、樹脂を恒久の水に入れ、それによって交互に染め、その後、日光の下で乾かしなさい。次に先ほどの水へ戻せば、黒いテュロスの色はいっそう強まる。しかし、冷たさによらなければ紫色に染められないことを知りなさい。ゆえに、冷たい自然を持つ水を取り、その中に羊毛を浸し、水から着色剤の力を取り出すまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 313
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-14-011
  section: 14
  paragraph: 11
  source_en: Know also that the Philosophers have called the force which proceeds from that water the
    Flower. Seek, therefore, your intent in the said water; therein place what is in the vessel for days
    and nights, until it be clothed with a most precious Tyrian colour.
  translation_ja: また知りなさい。哲学者たちは、その水から出る力を〈花〉と呼んだ。それゆえ、その水の内に目的とするものを求めなさい。容器の中にあるものをそこへ入れ、最も貴いテュロスの色をまとうまで、幾日幾夜も置きなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 314
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-15-001
  section: 15
  paragraph: 1
  source_en: Frictes saith:- O all ye seekers after Wisdom, know that the foundation of this Art, on account
    of which many have perished, is one only. There is one thing which is stronger than all natures, and
    more sublime in the opinion of philosophers, whereas with fools it is more common than anything. But
    for us it is a thing which we reverence.
  translation_ja: フリクテスは言う。叡智を求める皆よ、知りなさい。多くの者がそのために滅びたこの術の基礎は、ただ一つである。あらゆる自然より強く、哲学者たちの判断ではより崇高だが、愚者たちにとっては何よりありふれた、一つのものがある。しかし、われわれにとって、それは崇敬するものである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 316
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-15-002
  section: 15
  paragraph: 2
  source_en: Woe unto all ye fools! How ignorant are ye of this Art, for which ye would die if ye knew
    it! I swear to you that if kings were familiar with it, none of us would ever attain this thing. O
    how this nature changeth body into spirit! O how admirable is Nature, how she presides over all, and
    overcomes all!
  translation_ja: 愚者たちよ、災いあれ。あなたがたは、知ってさえいれば命をかけるであろうこの術について、何と無知であることか。私はあなたがたに誓う。王たちがこれに通じていたなら、われわれの誰もこのものに到達できないであろう。おお、この自然は何と見事に物体を霊に変えることか。自然は何と驚くべきものか。いかに万物を統べ、万物に打ち勝つことか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 317
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-15-003
  section: 15
  paragraph: 3
  source_en: Pythagoras saith:- Name this Nature, O Frictes!
  translation_ja: ピュタゴラスは言う。フリクテスよ、その自然の名を挙げなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 318
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-15-004
  section: 15
  paragraph: 4
  source_en: And he:- It is a very sharp vinegar, which makes gold into sheer spirit, without which vinegar,
    neither whiteness, nor blackness, nor redness, nor rust can be made. And know ye that when it is mixed
    with the body, it is contained therein, and becomes one therewith; it turns the same into a spirit,
    and tinges with a spiritual and invariable tincture, which is indelible. Know, also, that if ye place
    the body over the fire without vinegar, it will be burnt and corrupted.
  translation_ja: 彼は言う。それは、金を純粋な霊へ変える、非常に鋭い酢である。この酢なしには、白さも、黒さも、赤さも、錆も作れない。また知りなさい。それが物体と混ぜられると、その内に収められ、一つになる。それは物体を霊へ変え、消せない、霊的で不変の着色によって染める。また、酢なしに物体を火にかければ、焼かれて損なわれることを知りなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 319
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-15-005
  section: 15
  paragraph: 5
  source_en: 'And know, further, that the first humour is cold. Be careful, therefore, of the fire, which
    is inimical to cold. Accordingly, the Wise have said: "Rule gently until the sulphur becomes incombustible."
    The Wise men have already shewn to those who possess reason the disposition of this Art, and the best
    point of their Art, which they mentioned, is, that a little of this sulphur burns a strong body. Accordingly
    they venerate it and name it in the beginning of their book, and the son of Adam thus described it.'
  translation_ja: さらに知りなさい。最初の液は冷たい。それゆえ、冷たさに敵対する火には気をつけなさい。このため賢者たちは「硫黄が不燃性となるまで穏やかに処理せよ」と言った。賢者たちは、理性を持つ者たちに、この術の配剤をすでに示している。そして彼らが挙げた術の最良の点は、この硫黄の少量が強い物体を焼くということである。それゆえ彼らはこれを敬い、書物の冒頭で名指している。アダムの子も、こう説明した。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 320
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-15-006
  section: 15
  paragraph: 6
  source_en: For this vinegar burns the body, converts it into a cinder, and also whitens the body, which,
    if ye cook well and deprive of blackness, is changed into a stone, so that it becomes a coin of most
    intense whiteness. Cook, therefore, the stone until it be disintegrated, and then dissolve and temper
    with water of the sea.
  translation_ja: というのも、この酢は物体を焼き、焼滓に変え、また物体を白くするからである。それをよく煮て黒さを取り去れば、石に変わり、極めて白い貨幣となる。それゆえ石を分解するまで煮て、その後、海の水で溶かし、調合しなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 321
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-15-007
  section: 15
  paragraph: 7
  source_en: Know also, that the beginning of the whole work is the whitening, to which succeeds the redness,
    finally the perfection of the work; but after this, by means of vinegar, and by the will of God, there
    follows a complete perfection, Now, I have shewn to you, O disciples of this Turba, the disposition
    of the one thing, which is more perfect, more precious, and more honourable, than all natures, and
    I swear to you by God that I have searched for a long time in books so that I might arrive at the
    knowledge of this one thing, while I prayed also to God that he would teach me what it is.
  translation_ja: また知りなさい。作業全体の始まりは白化であり、これに赤化が続き、最後に作業の完成が来る。しかし、その後、酢によって、また神の意志によって、完全な完成が続く。さて、この集会の弟子たちよ、私はあなたがたに、あらゆる自然より完全で、貴く、尊ぶべき、一つのものの配剤を示した。神にかけて誓うが、私はこの一つのものの知識に達するため、長い間書物を調べ、また、それが何であるか教えてくださるよう神に祈った。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 322
  notes:
  - 公開翻刻の Gcd は God として校整した。底本の語と文脈を確認した明白な転記誤りの修正。転記段階の読みも内蔵データに保持する。
  source_language: en
  target_language: ja
  kind: body
  transcription_reading: Know also, that the beginning of the whole work is the whitening, to which succeeds
    the redness, finally the perfection of the work; but after this, by means of vinegar, and by the will
    of Gcd, there follows a complete perfection, Now, I have shewn to you, O disciples of this Turba,
    the disposition of the one thing, which is more perfect, more precious, and more honourable, than
    all natures, and I swear to you by God that I have searched for a long time in books so that I might
    arrive at the knowledge of this one thing, while I prayed also to God that he would teach me what
    it is.
- id: turba-15-008
  section: 15
  paragraph: 8
  source_en: My prayer was heard, He shewed me clean water, whereby I knew pure vinegar, and the more
    I did read books, the more was I illuminated.
  translation_ja: 私の祈りは聞き届けられた。神は清い水を示し、それによって私は純粋な酢を知った。そして書物を読めば読むほど、私はいっそう照らされた。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 323
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-16-001
  section: 16
  paragraph: 1
  source_en: Socrates saith:- Know, O crowd of those that still remain of the Sons of the Doctrine, that
    no tincture can be produced without Lead, which possesses the required virtue. Have ye not seen how
    thrice-great Hermes infused the red into the body, and it was changed into an invariable colour? Know,
    therefore, that the first virtue is vinegar, and the second is the Lead of which the Wise have spoken,
    which if it be infused into all bodies, renders all unchangeable, and tinges them with an invariable
    colour.
  translation_ja: ソクラテスは言う。なお残っている教えの子らの集いよ、知りなさい。必要な力を備える鉛なしには、着色剤を作ることはできない。三倍に偉大なヘルメスが、赤いものを物体へ注ぎ込み、それが変わらぬ色へ変じたのを見なかったか。ゆえに知りなさい。第一の力は酢であり、第二は賢者たちが語った鉛である。それをあらゆる物体へ注ぎ込めば、すべてを不変のものとし、変わらぬ色で染める。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 325
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-16-002
  section: 16
  paragraph: 2
  source_en: Take, therefore, Lead which is made out of the stone called Kuhul; let it be of the best
    quality, and let it be cooked till it becomes black. Then pound the same with Water of Nitre until
    it is thick like grease, and cook again in a very bright fire until the spissitude of the body is
    destroyed, the water being rejected. Kindle, therefore, above it until the stone becomes clean, abounding
    in precious metal, and exceedingly white.
  translation_ja: それゆえ、クフルと呼ばれる石から作られる鉛を取りなさい。最良の品質のものとし、黒くなるまで煮なさい。それから硝石の水とともに、脂のように厚くなるまで砕き、水を放出しながら物体の濃厚さが失われるまで、非常に明るい火で再び煮なさい。ゆえにその上で火を燃やし、石が清浄となり、貴金属に富み、極めて白くなるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 326
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-16-003
  section: 16
  paragraph: 3
  source_en: Pound it afterwards with dew and the sun, and with sea and rain water for 31 days, for 10
    days with salt water, and 10 days with fresh water, when ye shall find the same like to a metallic
    stone. Cook the same once more with water of nitre until it become tin by liquefaction. Again cook
    until it be deprived of moisture, and become dry. But know that when it becomes dry it drinks up what
    remains of its humour swiftly, because it is burnt lead. Take care, however, lest it be burnt.
  translation_ja: その後、露と太陽、海水と雨水で三十一日間、塩水で十日間、真水で十日間これを砕きなさい。そうすれば、金属質の石のようになったことが分かる。硝石の水で再び煮て、液化によって錫となるまで続けなさい。さらに煮て湿りを取り去り、乾かしなさい。しかし、乾くと残った液を急速に吸い込むことを知りなさい。焼かれた鉛だからである。ただし、焼き損なわないよう気をつけなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 327
  notes:
  - 日数は英訳の31日・10日・10日を保持した。これらの合計や包含関係を推測して統一しない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-16-004
  section: 16
  paragraph: 4
  source_en: Thus we call it incombustible sulphur. Pound the same with the sharpest vinegar, and cook
    till it becomes thick, taking care lest the vinegar be changed into smoke and perish; continue this
    coction for 150 days. Now, therefore, I have demonstrated the disposition of the white lead, all which
    afterwards follows being no more than women's work and child's play.
  translation_ja: このようなものを、われわれは不燃性の硫黄と呼ぶ。最も鋭い酢とともにこれを砕き、厚くなるまで煮なさい。酢が煙に変わって失われぬよう注意し、この煮る操作を百五十日間続けなさい。さて、これで白い鉛の処理を示した。その後に続くすべては、女の仕事、子供の遊びにすぎない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 328
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-16-005
  section: 16
  paragraph: 5
  source_en: Know, also, that the arcanum of the work of gold proceeds out of the male and the female,
    but I have shewn you the male in the lead, while, in like manner, I have discovered for you the female
    in orpiment. Mix, therefore, the orpiment with the lead, for the female rejoices in receiving the
    strength of the male, because she is assisted by the male. But the male receives a tingeing spirit
    from the female.
  translation_ja: また知りなさい。金の作業の秘義は、雄と雌から生じる。私は鉛の内に雄を示し、同様に、石黄の内に雌を明かした。したがって石黄を鉛と混ぜなさい。雌は雄に助けられるため、雄の力を受け取ることを喜ぶ。一方、雄は雌から染める霊を受け取る。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 329
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-16-006
  section: 16
  paragraph: 6
  source_en: Mix them, therefore, together, place in a glass vessel, and pound with Ethelia and very sharp
    vinegar; cook for seven days, taking care lest the arcanum smoke away, and leave throughout the night.
    But if ye wish it to put on mud (colour), seeing that it is already dry, again imbue with vinegar.
    Now, therefore, I have notified to you the power of orpiment, which is the woman by whom is accomplished
    the most great arcanum. Do not shew these unto the evil, for they will laugh.
  translation_ja: ゆえに両者を混ぜ合わせ、ガラスの容器に入れ、エテリアと非常に鋭い酢で砕きなさい。秘義が煙となって逃げぬよう気をつけて七日間煮て、一晩中置きなさい。しかし、すでに乾いているものに泥〔の色〕をまとわせたいなら、再び酢で浸しなさい。さて、これで石黄の力を知らせた。それは、最も偉大な秘義がそれによって達成される女である。これらを悪しき者たちに見せてはならない。彼らは嘲笑するであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 330
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-16-007
  section: 16
  paragraph: 7
  source_en: It is the Ethelia of vinegar which is placed in the preparation, by which things God perfects
    the work, whereby also spirits take possession of bodies, and they become spiritual.
  translation_ja: 調製に入れられるものは、酢のエテリアである。これらによって神は作業を完成させ、またそれによって霊は物体を占有し、物体は霊的なものとなる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 331
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-17-001
  section: 17
  paragraph: 1
  source_en: Zimon saith:- O Turba of Philosophers and disciples, now hast thou spoken about making into
    white, but it yet remains to treat concerning the reddening! Know, all ye seekers after this Art,
    that unless ye whiten, ye cannot make red, because the two natures are nothing other than red and
    white.
  translation_ja: ジモンは言う。哲学者と弟子たちの集会よ、あなたがたは今、白くすることについて語ったが、なお赤くすることを論じねばならない。この術を求める皆よ、知りなさい。白くしなければ、赤くすることはできない。二つの自然は、赤と白にほかならないからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 333
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-17-002
  section: 17
  paragraph: 2
  source_en: Whiten, therefore, the red, and redden the white! Know, also, that the year is divided into
    four seasons; the first season is of a frigid complexion, and this is Winter; the second is of the
    complexion of air, and this is Spring; then follows the third, which is summer, and is of the complexion
    of fire; lastly, there is the fourth, wherein fruits are matured, which is Autumn.
  translation_ja: それゆえ赤いものを白くし、白いものを赤くしなさい。また知りなさい。一年は四つの季節に分かれる。第一の季節は冷たい性質を持ち、これは冬である。第二は空気の性質を持ち、これは春である。続く第三は夏であり、火の性質を持つ。最後に第四があり、果実が熟す季節、すなわち秋である。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 334
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-17-003
  section: 17
  paragraph: 3
  source_en: In this manner, therefore, ye are to rule your natures, namely, to dissolve in winter, to
    cook in spring, to coagulate in summer, and to gather and tinge the fruit in autumn. Having, therefore,
    given this example, rule the tingeing natures, but if ye err, blame no one save yourselves.
  translation_ja: したがってこの仕方で、あなたがたの自然を処理しなさい。すなわち、冬には溶かし、春には煮て、夏には凝固させ、秋には果実を集め、染めなさい。ゆえに、この例に従って、染める自然を処理しなさい。しかし誤ったなら、自分自身以外の誰をも責めてはならない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 335
  notes:
  - 公開翻刻の ill winter は in winter として校整した。底本の語と文脈を確認した明白な転記誤りの修正。転記段階の読みも内蔵データに保持する。
  source_language: en
  target_language: ja
  kind: body
  transcription_reading: In this manner, therefore, ye are to rule your natures, namely, to dissolve ill
    winter, to cook in spring, to coagulate in summer, and to gather and tinge the fruit in autumn. Having,
    therefore, given this example, rule the tingeing natures, but if ye err, blame no one save yourselves.
- id: turba-17-004
  section: 17
  paragraph: 4
  source_en: The Turba answereth:- Thou hast treated the matter extremely well; add, therefore, another
    teaching of this kind for the sake of posterity.
  translation_ja: 集会の人々は答える。あなたはこの事柄を実によく論じた。したがって後世の人々のため、もう一つ同様の教えを加えてほしい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 336
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-17-005
  section: 17
  paragraph: 5
  source_en: And he:- I will speak of making lead red. Take the copper which the Master ordered you to
    take at the beginning of his book, combine lead therewith, and cook it until it becomes thick; congeal
    also and desiccate until it becomes red. Here certainly is the Red Lead of which the wise spake; copper
    and lead become a precious stone; mix them equally, let gold be roasted with them, for this, if ye
    rule well, becomes a tingeing spirit in spirits.
  translation_ja: 彼は言う。鉛を赤くすることについて話そう。師が書物の冒頭で取るよう命じた銅を取り、鉛と結び合わせ、厚くなるまで煮なさい。また、赤くなるまで凝結させ、乾かしなさい。ここにこそ、賢者たちが語った赤い鉛がある。銅と鉛は貴い石となる。それらを等量に混ぜ、金をそれらとともに焼きなさい。正しく処理すれば、これは霊の内で、染める霊となる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 337
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-17-006
  section: 17
  paragraph: 6
  source_en: So when the male and the female are conjoined there is not produced a volatile wife, but
    a spiritual composite. From the composite turned into a red spirit is produced the beginning of the
    world. Behold this is the lead which we have called Red Lead, which is of our work, and without which
    nothing is effected!
  translation_ja: このように雄と雌が結ばれると、揮発する妻ではなく、霊的な複合物が生まれる。赤い霊へ変えられた複合物から、世界の始まりが生じる。見よ、これがわれわれの〈赤い鉛〉と呼んだ鉛であり、われわれの作業に属し、これなしには何も成し遂げられない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 338
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-18-001
  section: 18
  paragraph: 1
  source_en: Mundus saith to the Turba:- The seekers after this Art must know that the Philosophers in
    their books have described gum in many ways, but it is none other than permanent water, out of which
    our precious stone is generated. O how many are the seekers after this gum, and how few there are
    who find it! Know that this gum is not ameliorated except by gold alone.
  translation_ja: ムンドゥスは集会の人々に言う。この術を求める者たちは、哲学者たちが書物の内で樹脂をさまざまに説明したが、それはわれわれの貴い石が生まれる恒久の水にほかならないと知るべきである。おお、この樹脂を求める者は何と多く、見いだす者は何と少ないことか。知りなさい。この樹脂は金だけによるのでなければ改善されない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 340
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-18-002
  section: 18
  paragraph: 2
  source_en: For there be very many who investigate these applications, and they find certain things,
    yet they cannot sustain the labours because they are diminished. But the applications which are made
    out of the gum and out of the honourable stone, which has already held the tincture, they sustain
    the labours, and are never diminished. Understand, therefore, my words, for I will explain unto you
    the applications of this gum, and the arcanum existing therein.
  translation_ja: これらの適用法を探究する者は非常に多く、何かを見いだしはする。しかし、それらは減損するため、作業に耐えられない。ところが、樹脂と、すでに着色を保ってきた尊い石とから作る適用物は、作業に耐え、決して減損しない。したがって私の言葉を理解しなさい。この樹脂の適用法と、その内に存する秘義を説明しよう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 341
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-18-003
  section: 18
  paragraph: 3
  source_en: Know ye that our gum is stronger than gold, and all those who know it do hold it more honourable
    than gold, yet gold we also honour, for without it the gum cannot be improved. Our gum, therefore,
    is for Philosophers more precious and more sublime than pearls, because out of gum with a little gold
    we buy much.
  translation_ja: 知りなさい。われわれの樹脂は金より強く、それを知るすべての者は、金より尊いと考えている。しかしわれわれは金も尊ぶ。金なしには樹脂を改善できないからである。それゆえ、われわれの樹脂は哲学者たちにとって真珠より貴く、崇高である。樹脂と少しの金によって、われわれは多くのものを買うからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 342
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-18-004
  section: 18
  paragraph: 4
  source_en: Consequently, the Philosophers, when committing these things to writing that the same might
    not perish, have not set forth in their books the manifest disposition, lest every one should become
    acquainted therewith, and having become familiar to fools, the same would not sell it at a small price.
  translation_ja: それゆえ哲学者たちは、これらが失われぬよう書き記すにあたって、その明瞭な配剤を自らの書物に示さなかった。誰もが知るようになり、愚者たちにまで知れわたって、それを安い値で売らないことになるのを避けるためである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 343
  notes:
  - 1896年版にも would not sell it at a small price とある。前後関係から読み取りにくい否定だが、安価になる等と反転させず残した。
  source_language: en
  target_language: ja
  kind: body
- id: turba-18-005
  section: 18
  paragraph: 5
  source_en: Take, therefore, one part of the most intense white gum; one part of the urine of a white
    calf; one part of the gall of a fish; and one part of the body of gum, without which it cannot be
    improved; mix these portions and cook for forty days. When these things have been done, congeal by
    the heat of the sun till they are dried. Then cook the same, mixed with milk of ferment, until the
    milk fail; afterwards extract it, and until it become dry evaporate the moisture by heat.
  translation_ja: したがって、極めて白い樹脂一部、白い仔牛の尿一部、魚の胆汁一部、そしてそれなしには樹脂が改善されない樹脂の物体一部を取り、これらを混ぜて四十日間煮なさい。これが済んだら、乾くまで太陽の熱で凝結させなさい。それから発酵種の乳を混ぜ、乳が尽きるまで煮なさい。その後取り出し、乾くまで熱によって湿りを蒸発させなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 344
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-18-006
  section: 18
  paragraph: 6
  source_en: Then mix it with milk of the fig, and cook it till that moisture be dried up in the composite,
    which afterwards mix with milk of the root of grass, and again cook until it be dry. Then moisten
    it with rainwater, then sprinkle with water of dew, and cook until it be dried. Also imbue with permanent
    water, and desiccate until it become of the most intense dryness.
  translation_ja: 次にイチジクの乳を混ぜ、複合物の中の湿りが乾くまで煮なさい。その後、草の根の乳を混ぜ、また乾くまで煮なさい。それから雨水で湿らせ、次に露の水を振りかけ、乾くまで煮なさい。また恒久の水で浸し、極度に乾燥するまで乾かしなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 345
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-18-007
  section: 18
  paragraph: 7
  source_en: 'Having done these things: mix the same with the gum which is equipped with all manner of
    colours, and cook strongly until the whole force of the water perish; and the entire body be deprived
    of its humidity, while ye imbue the same by cooking, until the dryness thereof be kindled. Then dismiss
    for forty days. Let it remain in that trituration or decocting until the spirit penetrate the body.
    For by this regimen the spirit is made corporeal, and the body is changed into a spirit.'
  translation_ja: これらを終えたら、あらゆる色を備えた樹脂と混ぜ、強く煮なさい。水の力がすっかり失われ、物体全体の湿りが取り去られるまで続け、その乾きが燃え立つまで、煮ながら浸しなさい。それから四十日間そのままにしなさい。霊が物体に浸透するまで、その粉砕または煮詰めの状態に置きなさい。この処理によって霊は物体となり、物体は霊に変えられるからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 346
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-18-008
  section: 18
  paragraph: 8
  source_en: Observe the vessel, therefore, lest the composition fly and pass off in fumes. These things
    being accomplished, open the vessel, and ye will find that which ye purposed. This, therefore, is
    the arcanum of gum, which the Philosophers have concealed in their books.
  translation_ja: したがって、配合物が飛び去り、煙となって出ていかぬよう、容器に注意しなさい。これらが完了したら容器を開きなさい。目的としたものを見いだすであろう。これこそ、哲学者たちが書物に隠した樹脂の秘義である。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 347
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-19-001
  section: 19
  paragraph: 1
  source_en: Dardaris saith:- It is common knowledge that the Masters before us have described Permanent
    Water. Now, it behoves one who is introduced to this Art to attempt nothing till he is familiar with
    the power of this Permanent Water, and in commixture, contrition, and the whole regimen, it behoves
    us to use invariably this famous Permanent Water.
  translation_ja: ダルダリスは言う。われわれ以前の師たちが恒久の水を説明したことは、よく知られている。さて、この術へ導き入れられる者は、この恒久の水の力を熟知するまで何も試みるべきではない。そして混合、粉砕、処理全体において、われわれは常にこの名高い恒久の水を用いるべきである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 349
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-19-002
  section: 19
  paragraph: 2
  source_en: He, therefore, who does not understand Permanent Water, and its indispensable regimen, may
    not enter into this Art, because nothing is effected without the Permanent Water. The force thereof
    is a spiritual blood, whence the Philosophers have called it Permanent Water, for, having pounded
    it with the body, as the Masters before me have explained to you, by the will of God it turns that
    body into spirit.
  translation_ja: したがって恒久の水と、その不可欠な処理法を理解しない者は、この術へ入ることができない。恒久の水なしには何も成し遂げられないからである。その力は霊的な血であり、それゆえ哲学者たちはこれを恒久の水と呼んだ。私以前の師たちが説明したように、物体とともに砕くと、神の意志によってその物体を霊に変えるからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 350
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-19-003
  section: 19
  paragraph: 3
  source_en: For these, being mixed together and reduced to one, transform each other; the body incorporates
    the spirit, and the spirit incorporates the body into tinged spirit, like blood. And know ye, that
    whatsoever hath spirit the same hath blood also as well. Remember, therefore, this arcanum!
  translation_ja: というのも、これらは混ぜられて一つとなると、互いを変容させるからである。物体は霊を物体化し、霊は物体を、血のように染まった霊へと取り込む。そして知りなさい。霊を持つものは何であれ、血をも持っている。したがってこの秘義を覚えておきなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 351
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-20-001
  section: 20
  paragraph: 1
  source_en: Belus saith:- O disciples, ye have discoursed excellently!
  translation_ja: ベルスは言う。弟子たちよ、あなたがたは見事に論じた。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 354
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-20-002
  section: 20
  paragraph: 2
  source_en: Pythagoras answers:- Seeing that they are philosophers, O Belus, why hast thou called them
    disciples?
  translation_ja: ピュタゴラスは答える。ベルスよ、彼らは哲学者なのに、なぜ弟子たちと呼んだのか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 356
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-20-003
  section: 20
  paragraph: 3
  source_en: He answereth:- It is in honour of their Master, lest I should make them equal with him.
  translation_ja: 彼は答える。師を敬うためです。彼らを師と等しく扱わないためです。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 358
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-20-004
  section: 20
  paragraph: 4
  source_en: Then Pythagoras saith:- Those who, in conjunction with us, have composed this book which
    is called the Turba, ought not to be termed disciples.
  translation_ja: するとピュタゴラスは言う。われわれとともに、『集会』と呼ばれるこの書物を作った者たちは、弟子と呼ばれるべきではない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 360
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-20-005
  section: 20
  paragraph: 5
  source_en: Then he:- Master, they have frequently described Permanent Water, and the making of the White
    and the Red in many ways, albeit under many names; but in the modes after which they have conjoined
    weights, compositions, and regimens, they agree with the hidden truth.
  translation_ja: そこで彼は言う。師よ、彼らは恒久の水と、白いもの、赤いものの製法を、幾度も、多くの仕方で、多くの名のもとに説明しました。しかし、重さ、配合、処理を結び合わせる方法においては、隠された真実と一致しています。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 361
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-20-006
  section: 20
  paragraph: 6
  source_en: 'Behold, what is said concerning this despised thing! A report has gone abroad that the Hidden
    Glory of the Philosophers is a stone and not a stone, and that it is called by many names, lest the
    foolish should recognise it, Certain wise men have designated it after one fashion, namely, according
    to the place where it is generated; others have adopted another, founded upon its colour, some of
    whom have termed it the Green Stone; by other some it is called the Stone of the most intense Spirit
    of Brass, not to be mixed with bodies; by yet others its description has been further varied, because
    it is sold for coins by lapidaries who are called saven; some have named it Spume of Luna; some have
    distinguished it astronomically or arithmetically; it has already received a thousand titles, of which
    the best is: "That which is produced out of metals." So also others have called it the Heart of the
    Sun, and yet others have declared it to be that which is brought forth out of quicksilver with the
    milk of volatile things.'
  translation_ja: 見よ、この軽んじられたものについて語られていることを。哲学者たちの隠された栄光は、石であって石ではなく、愚者たちに見破られぬよう多くの名で呼ばれるという話が広まっている。ある賢者たちは、それが生じる場所に従って名づけた。他の者たちは色に基づく名を採用し、そのうちには緑の石と呼ぶ者もいる。別の者たちは、物体と混ぜるべきでない、真鍮の最も強い霊の石と呼ぶ。さらに別の者たちは、それがサヴェンと呼ばれる宝石商によって貨幣と引き換えに売られるため、その説明をさらに変えた。ある者たちは月の泡と名づけ、ある者たちは天文学的または算術的に区別した。それはすでに千もの呼び名を受けているが、そのうち最良のものは「金属から生じるもの」である。同様に、他の者たちは太陽の心臓と呼び、さらに別の者たちは、水銀から揮発するものの乳とともに生み出されるものだと述べた。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 362
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-21-001
  section: 21
  paragraph: 1
  source_en: Pandolfus saith:- O Belus, thou hast said so much concerning the despised stone that thou
    hast left nothing to be added by thy brethren! Howsoever, I teach posterity that this despised stone
    is a permanent water, and know, all ye seekers after Wisdom, that permanent water is water of mundane
    life, because, verily, Philosophers have stated that Nature rejoices in Nature, Nature contains Nature,
    and Nature overcomes Nature.
  translation_ja: パンドルフスは言う。ベルスよ、あなたは軽んじられた石について多くを語り、兄弟たちが付け加えることを何も残さなかった。しかし私は後世の人々に、この軽んじられた石は恒久の水であると教える。叡智を求める皆よ、知りなさい。恒久の水は、この世の生命の水である。まことに哲学者たちは、自然は自然の内で喜び、自然は自然を包み、自然は自然に打ち勝つと述べたからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 364
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-21-002
  section: 21
  paragraph: 2
  source_en: 'The Philosophers have constituted this short dictum the principle of the work for reasonable
    persons. And know ye that no body is more precious or purer than the Sun, and that no tingeing venom:
    is generated without the Sun and its shadow. He, therefore, who attempts to make the venom of the
    Philosophers without these, already errs, and has fallen into that pit wherein his sadness remains.
    But he who has tinged the venom of the wise out of the Sun and its shadow has arrived at the highest
    Arcanum.'
  translation_ja: 哲学者たちは、理性的な人々のため、この短い格言を作業の原理とした。そして知りなさい。太陽より貴く、より純粋な物体はなく、太陽とその影なしには、染める毒は生じない。それゆえ、これらなしに哲学者たちの毒を作ろうとする者は、すでに誤り、悲しみのとどまる穴に落ちている。しかし太陽とその影から、賢者たちの毒を染め上げた者は、最高の秘義に到達している。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 365
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-21-003
  section: 21
  paragraph: 3
  source_en: Know also that our coin when it becomes red, is called gold; he, therefore, who knows the
    hidden Cambar of the Philosophers, to him is the Arcanum already revealed.
  translation_ja: また知りなさい。われわれの貨幣は、赤くなると金と呼ばれる。したがって哲学者たちの隠されたカンバルを知る者には、秘義はすでに明かされている。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 366
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-21-004
  section: 21
  paragraph: 4
  source_en: The Turba answereth:- Thou hast even now intelligibly described this stone, yet thou hast
    not narrated its regimen nor its composition. Return, therefore, to the description.
  translation_ja: 集会の人々は答える。あなたは今、この石を分かりやすく説明した。しかし、その処理法も配合も述べていない。したがって説明へ戻ってほしい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 367
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-21-005
  section: 21
  paragraph: 5
  source_en: He saith:- I direct you to take an occult and honourable arcanum, which is White Magnesia,
    and the same is mixed and pounded with wine, but take care not to make use of this except it be pure
    and clean; finally place it in its vessel, and pray God that He may grant you the sight of this very
    great stone. Then cook gradually, and, extracting, see if it has become a black stone, in which case
    ye have ruled excellently well.
  translation_ja: 彼は言う。私は、隠された尊い秘義、すなわち白いマグネシアを取るよう指示する。それを葡萄酒と混ぜ、砕きなさい。ただし純粋で清浄でないものを用いてはならない。最後にそれを容器に入れ、この極めて偉大な石を見ることを許してくださるよう神に祈りなさい。それから徐々に煮て、取り出し、黒い石となったか確かめなさい。そうなっていれば、極めてよく処理したのである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 368
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-21-006
  section: 21
  paragraph: 6
  source_en: But rule it thus for the white, which is a great arcanum, until it becomes Kuhul, closed
    up with blackness, which blackness see that it does not remain longer than forty days. Pound the same,
    therefore, with its confections, which are the said flower of copper, gold of the Indies whose root
    is one, and a certain extract of an unguent, that is, of a crocus, that is, fixed exalted alum; cook
    the four, therefore, permanently for 40 or 42 days.
  translation_ja: しかし、偉大な秘義である白いものを得るには、黒さに閉ざされたクフルとなるまで、このように処理しなさい。この黒さが四十日より長く残らぬよう見守りなさい。したがって、それをその配合材料とともに砕きなさい。それらは、前述の銅の花、根が一つであるインドの金、そしてある軟膏の抽出物、すなわちクロクス、すなわち固定され高められた明礬である。ゆえに、その四つを四十日または四十二日間、絶えず煮なさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 369
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-21-007
  section: 21
  paragraph: 7
  source_en: After these days God will show you the principle(or beginning) of this stone, which is the
    stone Atitos, of which favoured sight of God there are many accounts. Cook strongly, and imbue with
    the gum that remains. And know ye that so often as ye imbue the cinder, so often must it be desiccated
    and again humectated, until its colour turns into that which ye desire. Now, therefore, will I complete
    that which I have begun, if God will look kindly on us.
  translation_ja: その日数の後、神はこの石の原理、すなわち始まりを示すであろう。それはアティトスの石であり、神の恩恵によってこれを見ることについては、多くの記述がある。強く煮て、残った樹脂で浸しなさい。そして知りなさい。焼滓を浸すたびに、必ず乾かし、再び湿らせ、その色があなたがたの望むものへ変わるまで続けなければならない。さて、神がわれわれを慈しんでくださるなら、始めたことを完成させよう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 370
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-21-008
  section: 21
  paragraph: 8
  source_en: Know also that the perfection of the work of this precious stone is to rule it with the residue
    of the third part of the medicine, and to preserve the two other parts for imbuing and cooking alternately
    till the required colour appears. Let the fire be more intense than the former; let the matter be
    cerated, and when it is desiccated it coheres.
  translation_ja: また知りなさい。この貴い石の作業の完成は、薬の三分の一の残りでそれを処理し、他の三分の二を取っておき、求める色が現れるまで交互に浸し、煮ることである。火は以前より強くしなさい。質料を蝋状にしなさい。乾くと、それは結びつく。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 371
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-21-009
  section: 21
  paragraph: 9
  source_en: Cook, therefore, the wax until it imbibes the gluten of gold, which being desiccated, imbue
    the rest of the work seven times until the other two thirds be finished, and true earth imbibe them
    all. Finally, place the same on a hot fire until the earth extract its flower and be satisfactory.
    Blessed are ye if ye understand! But, if not, I will repeat to you the perfection of the work.
  translation_ja: それゆえ蝋を、金の膠を吸い込むまで煮なさい。乾いたら、作業物の残りを七度浸し、他の三分の二が尽き、真の土がそれらをすべて吸い込むまで続けなさい。最後に、強い火に置き、土が自らの花を取り出して満足のいく状態になるまで続けなさい。理解するなら、あなたがたは幸いである。理解しないなら、作業の完成を繰り返して説明しよう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 372
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-21-010
  section: 21
  paragraph: 10
  source_en: Take the clean white, which is a most great arcanum, wherein is the true tincture; imbue
    sand therewith, which sand is made out of the stone seven times imbued, until it drink up the whole,
    and close the mouth of the vessel effectually, as you have often been told. For that which ye seek
    of it by the favour of God, will appear to you, which is the stone of Tyrian colour.
  translation_ja: 清浄な白いものを取りなさい。それは、その内に真の着色剤を持つ、最も偉大な秘義である。それで砂を浸しなさい。その砂は七度浸された石から作られるものであり、全体を飲み込むまで続けなさい。そして、たびたび言われたとおり、容器の口を確実に閉じなさい。神の恩恵により、あなたがたがそこに求めるもの、すなわちテュロスの色の石が、現れるであろう。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 373
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-21-011
  section: 21
  paragraph: 11
  source_en: Now, therefore, I have fulfilled the truth, so do I conjure you by God and your sure Master,
    that you show not this great arcanum, and beware of the wicked!
  translation_ja: さて、これで真実を余すところなく述べた。ゆえに神と、あなたがたの確かな師にかけて願う。この偉大な秘義を明かさず、悪しき者たちに気をつけなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 374
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-001
  section: 22
  paragraph: 1
  source_en: 'Theophilus saith: Thou hast spoken intelligently and elegantly, and art held free from envy.'
  translation_ja: テオフィルスは言う。あなたは明晰かつ見事に語り、惜しむ心がないと認められる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 377
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-002
  section: 22
  paragraph: 2
  source_en: Saith the Turba:- Let your discretion, therefore, explain to us what the instructing Pandolfus
    has stated, and be not envious.
  translation_ja: 集会の人々は言う。では、あなたの分別によって、教えるパンドルフスが述べたことを説明し、惜しんではならない。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 379
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-003
  section: 22
  paragraph: 3
  source_en: Then he:- O all ye seekers after this science, the arcanum of gold and the art of the coin
    is a dark vestment, and no one knows what the Philosophers have narrated in their books without frequent
    reading, experiments, and questionings of the Wise. For that which they have concealed is more sublime
    and obscure than it is possible to make known in words, and albeit some have dealt with it intelligibly
    and well, certain others have treated it obscurely; thus some are more lucid than others.
  translation_ja: そこで彼は言う。この学を求める皆よ、金の秘義と貨幣の術は、暗い衣である。幾度も読むこと、試すこと、賢者に問うことなしには、哲学者たちが書物で語ったことを、誰も知ることはできない。彼らの隠したものは、言葉で明らかにできる以上に崇高で不明瞭だからである。また、ある者たちは分かりやすく巧みに扱ったが、他の者たちは曖昧に扱った。それゆえ、より明晰な者もいれば、そうでない者もいる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 380
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-004
  section: 22
  paragraph: 4
  source_en: 'The Turba answereth: Thou hast truly spoken.'
  translation_ja: 集会の人々は答える。あなたは真実を語った。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 381
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-005
  section: 22
  paragraph: 5
  source_en: And he:- I announce to posterity that between boritis and copper there is an affinity, because
    the boritis of the Wise liquefies; the copper, and it changes as a fluxible water.
  translation_ja: 彼は言う。私は後世の人々に告げる。ボリティスと銅の間には親近性がある。賢者たちのボリティスは銅を液化し、銅は流れる水のように変わるからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 382
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-006
  section: 22
  paragraph: 6
  source_en: Divide, therefore, the venom into two equal parts, with one of which liquefy the copper,
    but preserve the other to Pound and imbue the same, until it is drawn out into plates; cook again
    with the former part of the venom, cook two to seven in two; cook to seven in its own water for 42
    days; finally, open the vessel, and ye shall find copper turned into quicksilver; wash the same by
    cooking until it be deprived of its blackness, and become as copper without a shadow.
  translation_ja: したがって毒を二つの等しい部分に分け、一方によって銅を液化し、他方はそれを砕き、浸すため取っておき、板に引き延ばされるまで続けなさい。先の毒の部分で再び煮なさい。二つを七まで、二つの内で煮なさい。それ自身の水の内で、四十二日間、七まで煮なさい。最後に容器を開けば、銅が水銀へ変わったことが分かる。これを煮ることによって洗い、黒さを取り去り、影のない銅のようになるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 383
  notes:
  - cook two to seven in two 等の数の指示は英訳自体が不明瞭。解読した実験配合のように補訂せず、二・七・四十二の表現を保持した。
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-007
  section: 22
  paragraph: 7
  source_en: Lastly, cook it continuously until it be congealed. For when it is congealed it becomes a
    very great arcanum. Accordingly, the Philosophers have called this stone Boritis; cook, therefore,
    that coagulated stone until it becomes a matter like mucra. Then imbue it with the Permanent water
    which I directed you to reserve, that is to say, with the other portion, and cook it many times until
    its colours manifest.
  translation_ja: 最後に、凝結するまで絶えず煮なさい。凝結すれば、極めて偉大な秘義となるからである。このため哲学者たちはこの石をボリティスと呼んだ。ゆえに、その凝固した石を煮て、ムクラに似た質料となるまで続けなさい。それから、取っておくよう指示した恒久の水、すなわち他方の部分で浸し、色が現れるまで幾度も煮なさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 384
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-008
  section: 22
  paragraph: 8
  source_en: This, therefore, is the very great putrefaction which extracts (or contains in itself) the
    very great arcanum.
  translation_ja: したがって、これこそ極めて偉大な秘義を取り出す〔または自らの内に含む〕、極めて偉大な腐敗である。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 385
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-009
  section: 22
  paragraph: 9
  source_en: Saith the Turba:- Return to thine exposition, O Theophilus!
  translation_ja: 集会の人々は言う。テオフィルスよ、説明に戻りなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 386
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-010
  section: 22
  paragraph: 10
  source_en: And he:- It is to be known that the same affinity which exists between the magnet and iron,
    also exists assuredly between copper and permanent water. If, therefore, ye rule copper and permanent
    water as I have directed, there will thence result the very great arcanum in the following fashion.
    Take white Magnesia and quicksilver, mix with the male, and pound strongly by cooking, not with the
    hands, until the water become thin.
  translation_ja: 彼は言う。知るべきである。磁石と鉄の間にあるのと同じ親近性が、銅と恒久の水の間にも確実に存在する。したがって、私の指示どおりに銅と恒久の水を処理すれば、次の仕方で、極めて偉大な秘義が生じる。白いマグネシアと水銀を取り、雄と混ぜ、水が薄くなるまで、手ではなく煮ることによって、強く砕きなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 387
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-011
  section: 22
  paragraph: 11
  source_en: 'But dividing this water into two parts, in the one part of the water cook it for eleven,
    otherwise, forty days, until there be a white flower, as the flower of salt in its splendour and coruscation:
    but strongly close the mouth of the vessel, and cook for forty days, when ye will find it water whiter
    than milk; deprive it of all blackness by cooking; continue the cooking until its whole nature be
    disintegrated, until the defilement perish, until it be found clean, and is wholly broken up (or becomes
    wholly clean).'
  translation_ja: ただし、この水を二つに分け、一方の水の中で、十一日、別の読みでは四十日煮なさい。塩の花のように輝き閃く白い花が生じるまで続けなさい。しかし容器の口を強く閉じ、四十日間煮なさい。そうすれば、乳より白い水となったことが分かる。煮ることによってすべての黒さを取り去り、その自然全体が分解し、汚れが消え、清浄となり、すっかり砕ける〔またはすっかり清浄となる〕まで、煮続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 388
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-012
  section: 22
  paragraph: 12
  source_en: But if ye wish that the whole arcanum, which I have given you, be accomplished, wash the
    same with water, that is to say, the other part which I counselled you to preserve, until there appear
    a crocus, and leave in its own vessel.
  translation_ja: しかし、私が授けた秘義のすべてを成し遂げたいなら、それを水、すなわち取っておくよう勧めた他方の部分で洗い、クロクスが現れるまで続け、それ自身の容器に置きなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 389
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-22-013
  section: 22
  paragraph: 13
  source_en: For the Iksir pounds (or contains) itself; imbue also with the residue of the water, until
    by decoction and by water it be pounded and become like a syrup of pomegranates; imbue it, therefore,
    and cook, until the weight of the humidity shall fail, and the colour which the Philosophers have
    magnified shall truly appear.
  translation_ja: というのも、イクシールは自らを砕く〔または包む〕からである。また、残りの水で浸し、煮詰めと水によって砕け、ザクロのシロップのようになるまで続けなさい。したがって浸し、煮て、湿りの重さが失われ、哲学者たちが称揚した色が真に現れるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 390
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-23-001
  section: 23
  paragraph: 1
  source_en: 'Cerus saith:- Understand, all ye Sons of the Doctrine, that which Theophilus hath told you,
    namely, that there exists an affinity between the magnet and the iron, by the alliance of composite
    existing between the magnet and the iron, while the copper is fitly ruled for one hundred days: what
    statement can be more useful to you than that there is no affinity between tin and quicksilver!'
  translation_ja: ケルスは言う。教えの子らよ、皆、テオフィルスが告げたことを理解しなさい。すなわち、磁石と鉄の間にある複合の結びつきによって、磁石と鉄の間には親近性があり、一方、銅は百日間適切に処理されるということである。錫と水銀の間には親近性がない、という言葉以上に、あなたがたの役に立つ言葉があるだろうか。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 393
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-23-002
  section: 23
  paragraph: 2
  source_en: The Turba answereth:- Thou hast ill spoken, having disparaged the true disposition.
  translation_ja: 集会の人々は答える。あなたの言葉はよくない。真の配剤をおとしめたからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 395
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-23-003
  section: 23
  paragraph: 3
  source_en: And he:- I testify that I say nothing but what is true why are you incensed against me Fear
    the Lord, all ye Turba, that you Master may believe you!
  translation_ja: 彼は言う。私は真実以外は何も語らないと証言する。なぜ私に怒るのか。集会の皆よ、主を畏れなさい。あなたがたの師があなたがたを信じるために。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 396
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-23-004
  section: 23
  paragraph: 4
  source_en: The Turba answereth:- Say what you will.
  translation_ja: 集会の人々は答える。望むことを言いなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 398
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-23-005
  section: 23
  paragraph: 5
  source_en: And he:- I direct you to take quicksilver, in which is the male potency or strength; cook
    the same with its body until it becomes a fluxible water; cook the masculine together with the vapour,
    until each shall be coagulated and become a stone. Then take the water which you had divided into
    two parts, of which one is for liquefying and cooking the body, but the second is for cleansing that
    which is already burnt, and its companion, which [two] are made one.
  translation_ja: 彼は言う。雄の能力、すなわち力がその内にある水銀を取るよう、私は指示する。それ自身の物体とともに煮て、流れる水となるまで続けなさい。雄性のものを蒸気とともに煮て、各々が凝固し、石となるまで続けなさい。次に、二つの部分に分けておいた水を取りなさい。一方は物体を液化させ、煮るためのものだが、第二は、すでに焼かれたものとその伴侶、すなわち一つとされた〔二つ〕を清めるためのものである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 399
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-23-006
  section: 23
  paragraph: 6
  source_en: Imbue the stone seven times, and cleanse, until it be disintegrated, and its body be purged
    from all defilement, and become earth. Know also that in the time of forty-two days the whole is changed
    into earth; by cooking, therefore, liquefy the same until it become as true water, which is quicksilver.
    Then wash with water of nitre until it become as a liquefied coin. Then cook until it be congealed
    and become like to tin, when it is a most great arcanum; that is to say, the stone which is out of
    two things.
  translation_ja: 石を七度浸して清め、分解し、その物体があらゆる汚れから浄化され、土となるまで続けなさい。また、四十二日間で全体が土へ変わることを知りなさい。ゆえに、煮ることによって液化し、真の水、すなわち水銀のようになるまで続けなさい。それから硝石の水で洗い、溶けた貨幣のようにしなさい。次に、凝結して錫のようになるまで煮なさい。そのとき、それは最も偉大な秘義、すなわち二つのものからできた石となる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 400
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-23-007
  section: 23
  paragraph: 7
  source_en: Rule the same by cooking and pounding, until it becomes a most excellent crocus. Know also
    that unto water desiccated with its companion we have given the name of crocus. Cook it, therefore,
    and imbue with the residual water reserved by you until you attain your purpose.
  translation_ja: これを煮て砕くことによって処理し、最も優れたクロクスとなるまで続けなさい。また、われわれが、その伴侶とともに乾かした水に、クロクスという名を与えたことを知りなさい。したがって煮て、取っておいた残りの水で浸し、目的に達するまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 401
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-24-001
  section: 24
  paragraph: 1
  source_en: Bocascus saith:- Thou hast spoken well, O Belus, and therefore I follow thy steps!
  translation_ja: ボカスクスは言う。ベルスよ、あなたはよく語った。それゆえ私はあなたの歩みに従う。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 404
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-24-002
  section: 24
  paragraph: 2
  source_en: He answereth:- As it may please you, but do not become envious, for that is not the part
    of the Wise.
  translation_ja: 彼は答える。お望みのように。ただし惜しむ者となってはならない。それは賢者のすることではないからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 406
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-24-003
  section: 24
  paragraph: 3
  source_en: And Bocascus:- Thou speakest the truth, and thus, therefore, I direct the Sons of the Doctrine.
    Take lead, and, as the Philosophers have ordained, imbue, liquefy, and afterwards congeal, until a
    stone is produced; then rule the stone with gluten of gold and syrup of pomegranates until it be broken
    up.
  translation_ja: ボカスクスは言う。あなたは真実を語る。したがって私は、教えの子らにこう指示する。鉛を取り、哲学者たちが定めたとおり、浸し、液化し、その後凝結させ、石が生じるまで続けなさい。次に、金の膠とザクロのシロップで石を処理し、砕けるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 407
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-24-004
  section: 24
  paragraph: 4
  source_en: But you have already divided the water into two parts, with one of which you have liquefied
    the lead, and it has become as water; cook, therefore, the same until it be dried and have become
    earth; then pound with the water reserved until it acquire a red colour, as you have been frequently
    ordered.
  translation_ja: しかし、あなたがたはすでに水を二つに分け、その一方によって鉛を液化させ、水のようにした。したがって、それを乾いて土となるまで煮なさい。次に、たびたび命じられたとおり、取っておいた水とともに砕き、赤い色を得るまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 408
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-24-005
  section: 24
  paragraph: 5
  source_en: The Turba answereth:- Thou hast done nothing but pile up ambiguous words. Return, therefore,
    to the subject.
  translation_ja: 集会の人々は答える。あなたは曖昧な言葉を積み重ねただけである。したがって主題に戻りなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 409
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-24-006
  section: 24
  paragraph: 6
  source_en: And he:- Ye who wish to coagulate quicksilver, must mix it with its equal. Afterwards cook
    it diligently until both become permanent water, and, again, cook this water until it be coagulated.
    But let this be desiccated with its own equal vapour, because ye have found the whole quicksilver
    to be coagulated by itself. If ye understand, and place in your vessel what is necessary, cook it
    until it be coagulated, and then pound until it becomes a crocus like to the colour of gold.
  translation_ja: 彼は言う。水銀を凝固させたい者は、それと等しいものを混ぜねばならない。その後、両者が恒久の水となるまで丹念に煮て、さらにその水を凝固するまで煮なさい。しかし、それ自身と等しい蒸気とともに乾かしなさい。水銀全体がそれ自身によって凝固することを、あなたがたは見いだしたからである。理解して必要なものを容器に入れたなら、凝固するまで煮て、その後、金の色に似たクロクスとなるまで砕きなさい。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 410
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-25-001
  section: 25
  paragraph: 1
  source_en: Menabdus saith:- May God reward thee for the regimen, since thou speakest the truth! For
    thou hast illuminated thy words.
  translation_ja: メナブドゥスは言う。あなたは真実を語り、自らの言葉を明らかにした。その処理法のために、神があなたに報いてくださいますように。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 413
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-25-002
  section: 25
  paragraph: 2
  source_en: And they:- It is said because thou praisest him for his sayings, do not be inferior to him.
  translation_ja: 人々は言う。あなたが彼の言葉を称賛するのだから、彼に劣ってはならない、と言われるのである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 415
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-25-003
  section: 25
  paragraph: 3
  source_en: And he:- I know that I can utter nothing but that which he hath uttered; however, I counsel
    posterity to make bodies not bodies, but these incorporeal things bodies. For by this regimen the
    composite is prepared, and the hidden part of its nature is extracted.
  translation_ja: 彼は言う。彼の述べたこと以外に語れないことを、私は知っている。しかし後世の人々に、物体を物体でないものとし、それら非物体的なものを物体とするよう勧める。この処理によって複合物が調製され、その自然の隠れた部分が取り出されるからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 416
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-25-004
  section: 25
  paragraph: 4
  source_en: With these bodies accordingly join quicksilver and the body of Magnesia, the woman also with
    the man, and by means of this there is extracted our secret Ethelia, through which bodies are coloured;
    assuredly, if I understand this regimen, bodies become not bodies, and incorporeal things become bodies.
    If ye diligently pound the things in the fire and digest (or join to) the Ethelias, they become clean
    and fixed things.
  translation_ja: そこで、これらの物体に、水銀とマグネシアの物体を、また女を男と結びつけなさい。それによって、物体がそれで着色される、われわれの秘密のエテリアが取り出される。確かに、私がこの処理を理解するかぎり、物体は物体でないものとなり、非物体的なものは物体となる。火の中でこれらのものを丹念に砕き、エテリアを熟成させる〔またはエテリアと結びつける〕なら、それらは清浄で固定されたものとなる。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 417
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-25-005
  section: 25
  paragraph: 5
  source_en: And know ye that quicksilver is a fire burning the bodies, mortifying and breaking up, with
    one regimen, and the more it is mixed and pounded with the body, the more the body is disintegrated,
    while the quicksilver is attenuated and becomes living. For when ye shall diligently pound fiery quicksilver
    and cook it as required, ye will possess Ethel, a fixed nature and colour, subject to every tincture,
    which also overcomes, breaks, and constrains the fire.
  translation_ja: そして知りなさい。水銀は、一つの処理によって物体を焼き、死なせ、砕く火である。それが物体と混ぜられ、砕かれれば砕かれるほど、物体はいっそう分解し、一方、水銀は希薄となり、生きたものとなる。火のような水銀を丹念に砕き、必要なとおりに煮れば、あなたがたはエテル、すなわち固定した自然と色を得るからである。それはあらゆる着色に服し、また火に打ち勝ち、砕き、拘束する。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 418
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-25-006
  section: 25
  paragraph: 6
  source_en: For this reason it does not colour things unless it be coloured, and being coloured it colours.
    And know that no body can tinge itself unless its spirit be extracted from the secret belly thereof,
    when it becomes a body and soul without the spirit, which is a spiritual tincture, out of which colours
    have manifested, seeing that a dense thing does not tinge a tenuous, but a tenuous nature colours
    that which enters into a body.
  translation_ja: それゆえ、それ自身が着色されなければ物を着色せず、着色されると着色する。そして知りなさい。いかなる物体も、その隠された腹から霊が取り出されないかぎり、自らを染めることはできない。そのときそれは霊のない身体と魂となるが、霊は、そこから色々の色が現れた霊的な着色剤である。濃密なものは微細なものを染めず、微細な自然が、物体に入るものを着色するからである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 419
  notes:
  - 身体・魂・霊の関係と代名詞の係り先は難解である。本文にある区別を残し、近代的な物質論として整理しない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-25-007
  section: 25
  paragraph: 7
  source_en: When, however, ye have ruled the body of copper, and have extracted from it a most tenuous
    (subject), then the latter is changed into a tincture by which it is coloured. Hence has the wise
    man said, that copper does not tinge unless first it be tinged.
  translation_ja: しかし銅の物体を処理し、そこから極めて微細な〔対象〕を取り出したなら、後者は、それによって銅が染められる着色剤に変わる。それゆえ賢者は、銅はまず自らが染められなければ染めることができない、と言ったのである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 420
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-25-008
  section: 25
  paragraph: 8
  source_en: And know that those four bodies which you are directed to rule are this copper, and that
    the tinctures which I have signified unto you are the condensed and the humid, but the condensed is
    a conjoined vapour, and the humid is the water of sulphur, for sulphurs are contained by sulphurs,
    and rightly by these things Nature rejoices in Nature, and overcomes, and constrains.
  translation_ja: また知りなさい。処理するよう指示されたあの四つの物体は、この銅である。そして私が示した着色剤は、濃縮したものと湿ったものとである。濃縮したものは結合した蒸気であり、湿ったものは硫黄の水である。硫黄は硫黄によって包まれるからであり、まさしくこれらによって自然は自然の内で喜び、打ち勝ち、拘束するのである。
  source_url: https://sacred-texts.com/alc/turba.htm
  transcription_line: 421
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-26-001
  section: 26
  paragraph: 1
  source_en: Zenon saith:- I perceive that you, O crowd of the Wise, have conjoined two bodies, which
    your Master by no means ordered you to do!
  translation_ja: ゼノンは言う。賢者たちの集いよ、あなたがたは二つの物体を結び合わせたと私には見える。しかし、それは師が決して命じなかったことである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 136
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-26-002
  section: 26
  paragraph: 2
  source_en: The Turba answereth:- Inform us according to your own opinion, O Zenon, in this matter, and
    beware of envy! Then he:- Know that the colours which shall appear to you out of it are these. Know,
    O Sons of the Doctrine, that it behoves you to allow the composition to putrefy for forty days, and
    then to sublimate five times in a vessel.
  translation_ja: 集会の人々は答える。ゼノンよ、この件について、あなた自身の考えに従って教えてほしい。惜しむ心には気をつけなさい。すると彼は言う。そこからあなたがたに現れる色は、次のとおりであると知りなさい。教えの子らよ、配合物を四十日間腐敗させ、それから容器の内で五度昇華させるべきであると知りなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 137
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-26-003
  section: 26
  paragraph: 3
  source_en: 'Next join to a fire of dung, and cook, when these colours shall appear to you: On the first
    day black citrine, on the second black red, on the third like unto a dry crocus, finally, the purple
    colour will appear to you; the ferment and the coin of the vulgar shall be imposed; then is the Ixir
    composed out of the humid and the dry, and then it tinges with an invariable tincture. Know also that
    it is called a body wherein there is gold.'
  translation_ja: 次に糞の火に接し、煮なさい。すると次の色が現れる。第一日には黒みのある黄色、第二日には黒みのある赤、第三日には乾いたクロクスのような色、最後には紫色が現れる。発酵種と通常の貨幣を加えなさい。そのとき湿ったものと乾いたものからイクシールが構成され、変わらぬ着色によって染める。また、それは金を含む物体と呼ばれることを知りなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 138
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-26-004
  section: 26
  paragraph: 4
  source_en: 'But when ye are composing the Ixir, beware lest you extract the same hastily, for it lingers.
    Extract, therefore, the same as an Ixir. For this venom is, as it were, birth and life, because it
    is a soul extracted out of many things, and imposed upon coins: its tincture, therefore, is life to
    those things with which it is joined, from which it removes evil, but it is death to the bodies from
    which it is extracted.'
  translation_ja: しかしイクシールを調製するとき、急いで取り出さぬよう気をつけなさい。それには時間がかかるからである。したがって、イクシールとして取り出しなさい。この毒は、いわば誕生であり生命である。多くのものから取り出され、貨幣に加えられる魂だからである。それゆえその着色は、結びついたものにとって生命であり、それらから悪を取り去るが、取り出されるもとの物体にとっては死である。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 139
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-26-005
  section: 26
  paragraph: 5
  source_en: Accordingly, the Masters have said that between them there exists the same desire as between
    male and female, and if any one, being introduced to this Art, should know these natures, he would
    sustain the tediousness of cooking until he gained his purpose according to the will of God.
  translation_ja: このため師たちは、それらの間には雄と雌の間と同じ欲望が存在すると言った。そして、この術に導き入れられた誰かがこれらの自然を知るなら、神の意志に従って目的を得るまで、煮ることの退屈さに耐えるであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 140
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-27-001
  section: 27
  paragraph: 1
  source_en: Gregorius saith:- O all ye Turba, it is to be observed that the envious have called the venerable
    stone Efflucidinus, and they have ordered it to be ruled until it coruscates like marble in its splendour.
  translation_ja: グレゴリウスは言う。集会の皆よ、注意すべきである。惜しむ者たちは、この尊い石をエフルキディヌスと呼び、大理石のような輝きで閃くまで処理するよう命じた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 143
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-27-002
  section: 27
  paragraph: 2
  source_en: And they:- Show, therefore, what it is to posterity.
  translation_ja: 人々は言う。では、それが何であるかを後世の人々に示しなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 145
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-27-003
  section: 27
  paragraph: 3
  source_en: Then he:- Willingly; you must know that the copper is commingled with vinegar, and ruled
    until it becomes water. Finally, let it be congealed, and it remains a coruscating stone with a brilliancy
    like marble, which, when ye see thus, I direct you to rule until it becomes red, because when it is
    cooked till it is disintegrated and becomes earth, it is turned into a red colour. When ye see it
    thus, repeatedly cook and imbue it until it assume the aforesaid colour, and it shall become hidden
    gold.
  translation_ja: すると彼は言う。喜んでそうしよう。知るべきである。銅は酢と混ぜられ、水となるまで処理される。最後に凝結させなさい。すると大理石のような輝きを持つ、閃く石として残る。このようになったのを見たら、赤くなるまで処理するよう指示する。煮られて分解し、土となると、赤い色へ変わるからである。そのようになったのを見たら、前述の色を帯びるまで幾度も煮て浸しなさい。そうすれば隠された金となる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 146
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-27-004
  section: 27
  paragraph: 4
  source_en: Then repeat the process, when it will become gold of a Tyrian colour. It behoves you, therefore,
    O all ye investigators of this Art, when ye have observed that this Stone is coruscating, to pound
    and turn it into earth, until it acquires some degree of redness; then take the remainder of the water
    which the envious ordered you to divide into two parts, and ye shall imbibe them several times until
    the colours which are hidden by no body appear unto you.
  translation_ja: それからこの工程を繰り返せば、テュロスの色の金となる。それゆえ、この術を調べる皆よ、この石が閃くのを見たら、ある程度の赤みを得るまで砕いて土に変えるべきである。次に、惜しむ者たちが二つに分けるよう命じた水の残りを取り、どの物体にも隠されていない色が現れるまで、幾度も吸い込ませなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 147
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-27-005
  section: 27
  paragraph: 5
  source_en: Know also that if ye rule it ignorantly, ye shall see nothing of those colours. I knew a
    certain person who commenced this work, and operated the natures of truth, who, when the redness was
    somewhat slow in appearing, imagined that he had made a mistake, and so relinquished the work. Observe,
    therefore, how ye make the conjunction, for the punic dye, having embraced his spouse, passes swiftly
    into her body, liquefies, congeals, breaks up, and disintegrates the same.
  translation_ja: また知りなさい。無知なまま処理すれば、それらの色は何も見えない。私は、この作業を始め、真実の自然に働きかけたある者を知っていた。その者は、赤さが現れるのが少し遅いと、自分が誤ったと思い、作業を放棄した。したがって、どのように結合させるかに注意しなさい。プニカの染料は、その配偶者を抱くと、速やかにその身体へ入り、液化させ、凝結させ、砕き、分解するからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 148
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-27-006
  section: 27
  paragraph: 6
  source_en: Finally, the redness does not delay in coming, and if ye effect it without the weight, death
    will take place, whereupon it will be thought to be bad. Hence, I order that the fire should be gentle
    in liquefaction, but when it is turned to earth make the same intense, and imbue it until God shall
    extract the colours for us and they appear.
  translation_ja: ついに赤さは遅れることなく到来する。しかし、重さを守らずにこれを行えば死が起こり、そのため悪いものだと思われるであろう。それゆえ私は、液化の際には火を穏やかにし、土へ変わったなら強め、神がわれわれのために色を取り出し、それらが現れるまで浸すよう命じる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 149
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-28-001
  section: 28
  paragraph: 1
  source_en: Custos saith:- I am surprised, O all ye Turba! at the very great force and nature of this
    water, for when it has entered into the said body, it turns it first into earth, and next into powder,
    to test the perfection of which take in the hand, and if ye find it impalpable as water, it is then
    most excellent; otherwise, repeat the cooking until it is brought to the required condition. And know
    that if ye use any substance other than our copper, and rule with our water, it will profit you nothing.
  translation_ja: クストスは言う。集会の皆よ、私はこの水の極めて大きな力と自然に驚いている。それが前述の物体へ入ると、まず土に、次に粉末に変えるからである。その完成度を確かめるには、手に取りなさい。水のように触れても粒を感じないと分かれば、最も優れている。そうでなければ、必要な状態になるまで煮ることを繰り返しなさい。そして知りなさい。われわれの銅以外の物質を使い、われわれの水で処理しても、何の益もない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 151
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-28-002
  section: 28
  paragraph: 2
  source_en: If, on the other hand, ye rule our copper with our water, ye shall find all that has been
    promised by us.
  translation_ja: 反対に、われわれの銅をわれわれの水で処理すれば、われわれが約束したすべてを見いだすであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 152
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-28-003
  section: 28
  paragraph: 3
  source_en: But the Turba answereth:- Father, the envious created no little obscurity when they commanded
    us to take lead and white quicksilver, and to rule the same with dew and the sun till it becomes a
    coin-like stone.
  translation_ja: しかし集会の人々は答える。父よ、惜しむ者たちは、鉛と白い水銀を取り、貨幣のような石となるまで露と太陽で処理せよと命じたとき、少なからぬ曖昧さを生みました。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 153
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-28-004
  section: 28
  paragraph: 4
  source_en: Then he:- They meant our copper and our permanent water, when they thus directed you to cook
    in a gentle fire, and affirmed that there should be produced the said coin-like stone, concerning
    which the Wise have also observed, that Nature rejoices in Nature, by reason of the affinity which
    they know to exist between the two bodies, that is to say, copper and permanent water.
  translation_ja: すると彼は言う。彼らは、このように穏やかな火で煮るよう指示し、あの貨幣のような石が生じるはずだと断言したとき、われわれの銅とわれわれの恒久の水を意味していた。賢者たちはそれについて、自然は自然の内で喜ぶ、とも述べた。この二つの物体、すなわち銅と恒久の水の間に存在すると彼らが知っている、親近性のためである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 154
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-28-005
  section: 28
  paragraph: 5
  source_en: Therefore, the nature of these two is one, for between them there is a mixed affinity, without
    which they would not so swiftly unite, and be held together so that they may become one.
  translation_ja: したがって、この二つの自然は一つである。両者の間には混合の親近性があり、それなしには、かくも速やかに結びつき、一つとなるよう保たれることはないからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 155
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-28-006
  section: 28
  paragraph: 6
  source_en: Saith the Turba:- Why do the envious direct us to take the copper which we have now made,
    and roasted until it has become gold!
  translation_ja: 集会の人々は言う。では、惜しむ者たちはなぜ、われわれが今作り、金となるまで焼いた銅を取るよう指示するのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 156
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-29-001
  section: 29
  paragraph: 1
  source_en: Diamedes saith:- Thou hast spoken already, O Moses [Custos], in an ungrudging manner, as
    became thee; I will also confirm thy words, passing over the hardness of the elements which the wise
    desire to remove, this disposition being most precious in their eyes. Know, O ye seekers after this
    doctrine, that man does not proceed except from a man; that only which is like unto themselves is
    begotten from brute animals; and so also with flying creatures.
  translation_ja: ディアメデスは言う。モーセ〔クストス〕よ、あなたはすでに、その立場にふさわしく、惜しまず語った。私もあなたの言葉を確かめよう。賢者たちが取り除こうと望む元素の硬さについては、ここでは措く。その処置は彼らの目に最も貴いものだからである。この教えを求める者たちよ、知りなさい。人は人からしか生じず、理性なき動物からも、それ自身に似たものだけが生まれる。飛ぶ生き物も同様である。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 159
  notes:
  - 話者名は英文の Diamedes / Diomedes、Moses [Custos] の揺れを反映する。別名を推測で統一しない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-29-002
  section: 29
  paragraph: 2
  source_en: I have treated these matters in compendious fashion, exalting you towards the truth, who
    yourselves omit prolixity, for Nature is truly not improved by Nature, save with her own nature, seeing
    that thou thyself art not improved except in thy son, that is to say, man in man. See, therefore,
    that ye do not neglect the precepts concerning her, but make use of venerable Nature, for out of her
    Art cometh, and out of no other.
  translation_ja: 私はこれらの事柄を簡潔に扱い、自ら冗長さを避けるあなたがたを、真実へ向けて引き上げた。自然は真に、自らの自然を伴うのでなければ、自然によって改善されないからである。あなた自身が、あなたの子において、すなわち人が人においてでなければ改善されないように。それゆえ自然についての教訓をなおざりにせず、尊い自然を用いなさい。術はそこから生じ、他のいかなるものからも生じないからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 160
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-29-003
  section: 29
  paragraph: 3
  source_en: Know also that unless you seize hold of this Nature and rule it, ye will obtain nothing.
    Join, therefore, that male, who is son to the red slave, in marriage with his fragrant wife, which
    having been done, Art is produced between them; add no foreign matter unto these things, neither powder
    nor anything else; that conception is sufficient for us, for it is near, yet the son is nearer still.
    How exceeding precious is the nature of that red slave, without which the regimen cannot endure!
  translation_ja: また知りなさい。この自然を捉えて処理しなければ、何も得られない。それゆえ、赤い奴隷の息子である雄を、その香り高い妻と婚姻によって結びつけなさい。そうすれば両者の間に術が生まれる。これらに、粉末であれ他の何であれ、異質なものを加えてはならない。その受胎だけでわれわれには十分である。それは近くにあり、しかも息子はさらに近くにあるからである。その赤い奴隷の自然は、何と貴いことか。それなしには処理は成り立たない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 161
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-29-004
  section: 29
  paragraph: 4
  source_en: Bacsen saith:- O Diomedes, thou hast publicly revealed this disposition!
  translation_ja: バクセンは言う。ディオメデスよ、あなたはこの配剤を公然と明かした。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 162
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-29-005
  section: 29
  paragraph: 5
  source_en: He answereth:- I will even shed more light upon it. Woe unto you who fear not God, for He
    may deprive you of this art! Why, therefore, are you envious towards your brethren?
  translation_ja: 彼は答える。私はさらに光を当てよう。神を畏れぬあなたがたに災いあれ。神はあなたがたからこの術を取り去るかもしれない。なぜあなたがたは、兄弟たちに対して惜しむのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 164
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-29-006
  section: 29
  paragraph: 6
  source_en: They answer:- We do not flee except from fools; tell us, therefore, what is thy will?
  translation_ja: 人々は答える。われわれは愚者以外から逃げない。したがって、あなたの望みを告げてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 166
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-29-007
  section: 29
  paragraph: 7
  source_en: And he:- Place Citrine with his wife after the conjunction into the bath; do not kindle the
    bath excessively, lest they be deprived of sense and motion; cause them to remain in the bath until
    their body, and the colour thereof, shall become a certain unity, whereupon restore unto it the sweat
    thereof; again suffer it to die; then give it rest, and beware lest ye evaporate them by burning them
    in too strong a fire.
  translation_ja: 彼は言う。結合の後、黄色の者を妻とともに浴に入れなさい。知覚と運動を奪わぬよう、浴を過度に熱してはならない。その身体と色がある一体性を得るまで浴の中にとどめ、それからその汗を戻しなさい。再び死なせ、それから休ませなさい。そして、強すぎる火で焼いて蒸発させぬよう注意しなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 167
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-29-008
  section: 29
  paragraph: 8
  source_en: Venerate the king and his wife, and do not burn them, since you know not when you may have
    need of these things, which improve the king and his wife. Cook them, therefore, until they become
    black, then white, afterwards red, and finally until a tingeing venom is produced.
  translation_ja: 王とその妻を敬い、焼き損なってはならない。王と妻を改善するこれらのものが、いつ必要になるか、あなたがたには分からないからである。したがって、黒くなり、次に白く、その後赤くなり、最後に染める毒が生じるまで煮なさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 168
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-29-009
  section: 29
  paragraph: 9
  source_en: O seekers after this Science, happy are ye, if ye understand, but if not, I have still performed
    my duty, and that briefly, so that if ye, remain ignorant, it is God who hath concealed the truth
    from you! Blame not, therefore, the Wise, but yourselves, for if God knew that ye possessed a faithful
    mind, most certainly he would reveal unto you the truth. Behold, I have established you therein, and
    have extricated you from error!
  translation_ja: この学を求める者たちよ、理解するなら、あなたがたは幸いである。理解しなくても、私は自分の務めを、しかも簡潔に果たした。ゆえに、なお無知であるなら、あなたがたから真実を隠したのは神である。したがって賢者たちではなく、自分自身を責めなさい。神があなたがたに忠実な心があると知ったなら、確かに真実を明かしたはずだからである。見よ、私はあなたがたを真実の内に据え、誤りから救い出した。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 169
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-30-001
  section: 30
  paragraph: 1
  source_en: Bacsen saith:- Thou hast spoken well, O Diomedes, but I do not see that thou hast demonstrated
    the disposition of Corsufle to posterity! Of this same Corsufle the envious have spoken in many ways,
    and have confused it with all manner of names.
  translation_ja: バクセンは言う。ディオメデスよ、あなたはよく語った。しかしコルスフレの処理を後世に示したとは、私には思えない。この同じコルスフレについて、惜しむ者たちは多くの仕方で語り、あらゆる種類の名によって混乱させてきた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 172
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-30-002
  section: 30
  paragraph: 2
  source_en: Then he:- Tell me, therefore, O Bacsen, according to thy opinion in these matters, and I
    swear by thy father that this is the head of the work, for the true beginning hereof cometh after
    the completion.
  translation_ja: すると彼は言う。ではバクセンよ、これらの事柄について、あなた自身の考えに従って教えてほしい。あなたの父にかけて誓うが、これこそ作業の首位である。その真の始まりは、完成の後に来るからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 174
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-30-003
  section: 30
  paragraph: 3
  source_en: Bacsen saith:- I give notice, therefore, to future seekers after this Art, that Corsufle
    is a composite, and that it must be roasted seven times, because when it arrives at perfection it
    tinges the whole body.
  translation_ja: バクセンは言う。それゆえ私は、この術を将来求める者たちに知らせる。コルスフレは複合物であり、七度焼かねばならない。完成に達すると、物体全体を染めるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 175
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-30-004
  section: 30
  paragraph: 4
  source_en: The Turba answereth:- Thou hast spoken the truth, O Bacsen!
  translation_ja: 集会の人々は答える。バクセンよ、あなたは真実を語った。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 177
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-31-001
  section: 31
  paragraph: 1
  source_en: Pythagoras Saith:- How does the discourse of Bacsen appear to you, since he has omitted to
    name the substance by its artificial names?
  translation_ja: ピュタゴラスは言う。バクセンの話をどう思うか。彼はその物質を、術上の名で呼ぶことを省いた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 181
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-31-002
  section: 31
  paragraph: 2
  source_en: And they:- Name it, therefore, oh Pythagoras!
  translation_ja: 人々は言う。では、ピュタゴラスよ、その名を挙げてください。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 183
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-31-003
  section: 31
  paragraph: 3
  source_en: And he:- Corsufle being its composition, they have applied to it all the names of bodies
    in the world, as, for example, those of coin, copper, tin, gold, iron, and also the name of lead,
    until it be deprived of that colour and become Ixir.
  translation_ja: 彼は言う。その配合物がコルスフレであるため、彼らはそれに、世界のあらゆる物体の名を当てた。たとえば貨幣、銅、錫、金、鉄の名、また鉛の名も、その色を奪われてイクシールとなるまで当てたのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 184
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-31-004
  section: 31
  paragraph: 4
  source_en: The Turba answereth:- Thou hast spoken well, O Pythagoras!
  translation_ja: 集会の人々は答える。ピュタゴラスよ、あなたはよく語った。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 186
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-31-005
  section: 31
  paragraph: 5
  source_en: And he:- Ye have also spoken well, and some among the others may discourse concerning the
    residual matters.
  translation_ja: 彼は言う。あなたがたもよく語った。ほかの者たちの中から、残った事柄について論じる者があってよい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 188
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-32-001
  section: 32
  paragraph: 1
  source_en: 'Bonellus saith: According to thee, O Pythagoras, all things die and live by the will of
    God, because that nature from which the humidity is removed, that nature which is left by nights,
    does indeed seem like unto something that is dead; it is then turned and (again) left for certain
    nights, as a man is left in his tomb, when it becomes a powder.'
  translation_ja: ボネルスは言う。ピュタゴラスよ、あなたによれば、万物は神の意志によって死に、生きる。湿りを取り去られ、幾夜も置かれた自然は、確かに死んだもののように見えるからである。それから向きを変えられ、人が墓の中に置かれるように、〔再び〕幾夜か置かれると、粉末となる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 191
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-32-002
  section: 32
  paragraph: 2
  source_en: These things being done, God will restore unto it both the soul and the spirit thereof, and
    the weakness being taken away, that matter will be made strong, and after corruption will be improved,
    even as a man becomes stronger after resurrection and younger than he was in this world.
  translation_ja: これらが済むと、神はその魂と霊の両方を戻す。そして弱さが取り去られ、その質料は強くされ、腐敗の後に改善される。ちょうど、人が復活の後、この世にいたときより強く、若くなるように。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 192
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-32-003
  section: 32
  paragraph: 3
  source_en: Therefore it behoves you, O ye Sons of the Doctrine, to consume that matter with fire boldly
    until it shall become a cinder, when know that ye have mixed it excellently well, for that cinder
    receives the spirit, and is imbued with the humour until it assumes a fairer colour than it previously
    possessed.
  translation_ja: それゆえ教えの子らよ、その質料が焼滓となるまで、大胆に火で焼き尽くすべきである。そのとき、極めてよく混ぜたことを知りなさい。その焼滓は霊を受け取り、以前より美しい色を帯びるまで、液で浸されるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 193
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-32-004
  section: 32
  paragraph: 4
  source_en: Consider, therefore, O ye Sons of the Doctrine, that artists are unable to paint with their
    own tinctures until they convert them into a powder; similarly, the philosophers cannot combine medicines
    for the sick slaves until they also turn them into powder, cooking some of them to a cinder, while
    others they grind with their hands. The case is the same with those who compose the images of the
    ancients.
  translation_ja: したがって教えの子らよ、考えなさい。画家たちは、自らの顔料を粉末に変えるまでは、それで描けない。同様に哲学者たちも、あるものは焼滓となるまで煮て、他のものは手ですりつぶして、同じく粉末に変えるまでは、病む奴隷たちの薬を配合できない。古人たちの像を作る者たちについても、事情は同じである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 194
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-32-005
  section: 32
  paragraph: 5
  source_en: But if ye understand what has already been said, ye will know that I speak the truth, and
    hence I have ordered you to burn up the body and turn it into a cinder, for if ye rule it subtly many
    things will proceed from it, even as much proceeds from the smallest things in the world.
  translation_ja: しかし、すでに述べられたことを理解するなら、私が真実を語ることが分かるであろう。それゆえ私は、物体を焼き尽くして焼滓に変えるよう命じた。精妙に処理すれば、世界の最小のものから多くが生じるように、そこから多くのものが生じるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 195
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-32-006
  section: 32
  paragraph: 6
  source_en: It is thus because copper like man, has a body and a soul, for the inspiration of men cometh
    from the air, which after God is their life, and similarly the copper is inspired by the humour from
    which that same copper receiving strength is multiplied and augmented like other things. Hence, the
    philosophers add, that when copper is consumed with fire and iterated several times, it becomes better
    than it was.
  translation_ja: それは、銅も人と同じく身体と魂を持つからである。人の吸う息は空気から来て、空気は神に次いで人の生命である。同様に銅も液によって息を与えられ、そこから力を受け取り、他のものと同じく増殖し、増大する。それゆえ哲学者たちは、銅は火で焼き尽くされ、それが幾度も繰り返されると、以前より良くなると付け加える。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 196
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-32-007
  section: 32
  paragraph: 7
  source_en: The Turba answereth:- Show, therefore, O Bonellus, to future generations after what manner
    it becometh better than it was!
  translation_ja: 集会の人々は答える。ではボネルスよ、どのようにして以前より良くなるのか、後の世代に示してほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 197
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-32-008
  section: 32
  paragraph: 8
  source_en: And he:- I will do so willingly; it is because it is augmented and multiplied, and because
    God extracts many things out of one thing, since He hath created nothing which wants its own regimen,
    and those qualities by which its healing must be effected. Similarly, our copper, when it is first
    cooked, becomes water; then the more it is cooked, the more is it thickened until it becomes a stone,
    as the envious have termed it, but it is really an egg tending to become a metal.
  translation_ja: 彼は言う。喜んでそうしよう。それは増大し、増殖するからであり、また神が一つのものから多くのものを取り出すからである。神は、それ自身の処理法と、それによって癒されねばならない性質とを欠くものを、何一つ創らなかった。同様に、われわれの銅は、初めて煮ると水となる。それから、煮れば煮るほど厚くなり、ついには惜しむ者たちが呼んだとおり、石となる。しかし実際には、金属になろうとする卵なのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 198
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-32-009
  section: 32
  paragraph: 9
  source_en: It is afterwards broken and imbued, when ye must roast it in a fire more intense than the
    former, until it shall be coloured and shall become like blood in combustion, when it is placed on
    coins and changes them into gold, according to the Divine pleasure.
  translation_ja: その後、それは砕かれ、浸される。そのとき、以前より強い火で焼いて、色を帯び、燃焼の際に血のようになるまで続けねばならない。その段階で貨幣に加えられると、神の御心に従って、それを金へ変える。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 199
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-32-010
  section: 32
  paragraph: 10
  source_en: Do you not see that sperm is not produced from the blood unless it be diligently cooked in
    the liver till it has acquired an intense red colour, after which no change takes place in that sperm?
    It is the same with our work, for unless it be cooked diligently until it shall become a powder, and
    afterwards be putrefied until it shall become a spiritual sperm, there will in no wise proceed from
    it that colour which ye desire.
  translation_ja: 精液は、肝臓の内で濃い赤色を得るまで丹念に煮られなければ、血から生じないことが分からないか。その後、その精液には変化が起こらない。われわれの作業も同じである。粉末となるまで丹念に煮られ、その後、霊的な精液となるまで腐敗させられなければ、あなたがたが望む色は決してそこから生じないからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 200
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-32-011
  section: 32
  paragraph: 11
  source_en: But if ye arrive at the conclusion of this regimen, and so obtain your purpose, ye shall
    be princes among the People of your time.
  translation_ja: しかし、この処理の終わりに到達して目的を得たなら、あなたがたは同時代の人々の間で君主となるであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 201
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-33-001
  section: 33
  paragraph: 1
  source_en: Nicarus saith:- Now ye have made this arcanum public.
  translation_ja: ニカルスは言う。今、あなたがたはこの秘義を公にした。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 204
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-33-002
  section: 33
  paragraph: 2
  source_en: The Turba answereth:- Thus did the Master order.
  translation_ja: 集会の人々は答える。師がそのように命じたのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 206
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-33-003
  section: 33
  paragraph: 3
  source_en: And he:- Not the whole, nevertheless.
  translation_ja: 彼は言う。それでも、全部ではない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 208
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-33-004
  section: 33
  paragraph: 4
  source_en: But they:- He ordered us to clear away the darkness therefrom; do thou, therefore, tell us.
  translation_ja: しかし人々は言う。師は、そこから闇を取り除くよう命じた。したがって、あなたが教えてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 210
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-33-005
  section: 33
  paragraph: 5
  source_en: And he:- I counsel posterity to take the gold which they wish to multiply and renovate, then
    to divide the water into two parts.
  translation_ja: 彼は言う。私は後世の人々に、増殖させ、新しくしたい金を取り、それから水を二つの部分に分けるよう勧める。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 212
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-33-006
  section: 33
  paragraph: 6
  source_en: And they:- Distinguish, therefore, when they divide the water.
  translation_ja: 人々は言う。では、水を分けるときについて、はっきり説明してほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 214
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-33-007
  section: 33
  paragraph: 7
  source_en: But he:- It behoves them to burn up our copper with one part. For the said copper, dissolved
    in that water, is called the ferment of Gold, if ye rule well. For the same in like manner are cooked
    and liquefy as water; finally, by cooking they are congealed, crumble, and the red appears.
  translation_ja: 彼は言う。一方の部分で、われわれの銅を焼き尽くすべきである。その水に溶かされた銅は、正しく処理されれば、金の発酵種と呼ばれるからである。それらは同じように煮られ、水のように液化する。最後には、煮ることによって凝結し、崩れ、赤いものが現れる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 215
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-33-008
  section: 33
  paragraph: 8
  source_en: But then it behoves you to imbue seven times with the residual water, until they absorb all
    the water, and, all the moisture being dried up, they are turned into dry earth; then kindle a fire
    and place therein for forty days until the whole shall putrefy, and its colours appear.
  translation_ja: しかしその後、残りの水で七度浸し、すべての水を吸収し、あらゆる湿りが乾いて、乾いた土に変わるまで続けるべきである。それから火を燃やし、そこへ四十日間置いて、全体が腐敗し、その色が現れるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 216
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-34-001
  section: 34
  paragraph: 1
  source_en: Bacsen saith:- On account of thy dicta the Philosophers said beware. Take the regal Corsufle,
    which is like to the redness of copper, and pound in the urine of a calf until the nature of the Corsufle
    is converted, for the true nature has been hidden in the belly of the Corsufle.
  translation_ja: バクセンは言う。あなたの言葉のために、哲学者たちは「注意せよ」と言った。銅の赤さに似た、王なるコルスフレを取り、仔牛の尿の中で、コルスフレの自然が変わるまで砕きなさい。真の自然は、コルスフレの腹の中に隠されているからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 219
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-34-002
  section: 34
  paragraph: 2
  source_en: The Turba saith:- Explain to posterity what the nature is.
  translation_ja: 集会の人々は言う。その自然が何であるか、後世の人々に説明してほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 221
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-34-003
  section: 34
  paragraph: 3
  source_en: And he:- A tingeing spirit which it hath from permanent water, which is coin-like, and coruscates.
  translation_ja: 彼は言う。恒久の水から得る、染める霊である。それは貨幣のようであり、閃く。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 223
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-34-004
  section: 34
  paragraph: 4
  source_en: And they:- Shew, therefore, how it is extracted.
  translation_ja: 人々は言う。では、どのように取り出されるかを示してほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 224
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-34-005
  section: 34
  paragraph: 5
  source_en: And he:- It is pounded, and water is poured upon it seven times until it absorbs the whole
    humour, and receives a force which is equal to the hostility of the fire; then it is called rust.
    Putrefy the same diligently until it becomes a spiritual powder, of a colour like burnt blood, which
    the fire overcoming hath introduced into the receptive belly of Nature, and hath coloured with an
    indelible colour. This, therefore, have kings sought, but not found, save only to whom God has granted
    it.
  translation_ja: 彼は言う。それを砕き、水を七度注いで、すべての液を吸い込み、火の敵意に匹敵する力を受け取るまで続ける。そのとき、それは錆と呼ばれる。これを丹念に腐敗させ、焼けた血のような色の霊的な粉末となるまで続けなさい。打ち勝つ火がそれを、自然の受け入れる腹へ導き入れ、消えない色で染めたのである。したがって、王たちはこれを求めたが、神が授けた者以外には見いだせなかった。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 225
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-34-006
  section: 34
  paragraph: 6
  source_en: But the Turba saith:- Finish your speech, O Bacsen.
  translation_ja: しかし集会の人々は言う。バクセンよ、話を終えなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 226
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-34-007
  section: 34
  paragraph: 7
  source_en: And he:- I direct them to whiten copper with white water, by which also they make red. Be
    careful not to introduce any foreign matter.
  translation_ja: 彼は言う。私は、銅を白い水で白くするよう指示する。その水でまた赤くもする。異質なものを何一つ入れぬよう気をつけなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 228
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-34-008
  section: 34
  paragraph: 8
  source_en: And the Turba:- Well hast thou spoken, O Bacsen, and Nictimerus also has spoken well!
  translation_ja: 集会の人々は言う。バクセンよ、あなたはよく語った。ニクティメルスもまた、よく語った。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 230
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-34-009
  section: 34
  paragraph: 9
  source_en: Then he:- If I have spoken well, do one of you continue.
  translation_ja: すると彼は言う。私がよく語ったなら、あなたがたの一人が続けなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 232
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-001
  section: 35
  paragraph: 1
  source_en: But Zimon saith:- Hast thou left anything to be said by another?
  translation_ja: しかしジモンは言う。あなたは、ほかの者が言うべきことを何か残しただろうか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 236
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-002
  section: 35
  paragraph: 2
  source_en: And the Turba:- Since the words of Nicarus and Bacsen are of little good to those who seek
    after this Art, tell us, therefore, what thou knowest, according as we have said.
  translation_ja: 集会の人々は言う。ニカルスとバクセンの言葉は、この術を求める者たちにあまり役立たない。したがって、われわれが言ったように、あなたの知っていることを語ってほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 237
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-003
  section: 35
  paragraph: 3
  source_en: And he:- Ye speak the truth, O all ye seekers after this Art! Nothing else has led you into
    error but the sayings of the envious, because what ye seek is sold at the smallest possible price.
    If men knew this, and how great was the thing they held in their hands, they would in no wise sell
    it.
  translation_ja: 彼は言う。この術を求める皆よ、あなたがたは真実を語る。あなたがたを誤りへ導いたのは、惜しむ者たちの言葉にほかならない。あなたがたの求めるものは、できるかぎり安い値で売られているからである。人々がこれを知り、手に持つものがいかに偉大か知っていれば、決して売らないであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 238
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-004
  section: 35
  paragraph: 4
  source_en: 'Therefore, the Philosophers have glorified that venom, have treated of it variously, and
    in many ways, have taken and applied to it all manner of names, wherefore, certain envious persons
    have said: It is a stone and not a stone, but a gum of Ascotia, consequently, the Philosophers have
    concealed the power thereof. For this spirit which ye seek, that ye may tinge therewith, is concealed
    in the body, and hidden away from sight, even as the soul in the human body.'
  translation_ja: それゆえ哲学者たちはその毒を讃え、さまざまに、多くの仕方で扱い、あらゆる種類の名を取り、それに当てた。それゆえ、ある惜しむ者たちは「これは石であり、石ではなく、アスコティアの樹脂である」と言い、そのため哲学者たちはその力を隠した。あなたがたが、それで染めるために求めるこの霊は、物体の内に隠され、人の身体の内の魂のように、目から隠されているからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 239
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-005
  section: 35
  paragraph: 5
  source_en: 'But ye seekers after the Art, unless ye disintegrate this body, imbue and pound both cautiously
    and diligently, until ye extract it from its grossness (or grease), and turn it into a tenuous and
    impalpable spirit, have your labour in vain. Wherefore the Philosophers have said: Except ye turn
    bodies into not bodies, and incorporeal things into bodies, ye have not yet discovered the rule of
    operation.'
  translation_ja: しかし術を求める者たちよ、この物体を分解し、慎重かつ丹念に浸し、砕いて、その粗厚さ〔または脂〕から取り出し、微細で手に感じられない霊へ変えなければ、労苦は無駄となる。それゆえ哲学者たちは言った。物体を物体でないものへ、非物体的なものを物体へ変えなければ、まだ操作の規則を発見していない、と。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 240
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-006
  section: 35
  paragraph: 6
  source_en: But the Turba saith:- Tell, therefore, posterity how bodies are turned into not-bodies.
  translation_ja: しかし集会の人々は言う。それなら、物体がどのように物体でないものへ変えられるか、後世の人々に告げてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 241
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-007
  section: 35
  paragraph: 7
  source_en: And he:- They are pounded with fire and Ethelia till they become a powder. And know that
    this does not take place except by an exceedingly strong decoction, and continuous contrition, performed
    with a moderate fire, not with hands, with imbibition and putrefaction, with exposure to the sun and
    to Ethelia. The envious caused the vulgar to err in this Art when they stated that the thing is common
    in its nature and is sold at a small price.
  translation_ja: 彼は言う。それらは火とエテリアによって、粉末となるまで砕かれる。そして知りなさい。これは、非常に強い煮詰めと絶えざる粉砕によるのでなければ起こらない。それは手ではなく、適度な火によって、浸すことと腐敗によって、太陽とエテリアにさらすことによって行われる。惜しむ者たちは、このものはその自然においてありふれ、安く売られていると述べたとき、この術において俗人を誤らせた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 242
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-008
  section: 35
  paragraph: 8
  source_en: They further said that the nature was more precious than all natures, wherefore they deceived
    those who had recourse to their books. At the same time they spoke the truth, and therefore doubt
    not these things.
  translation_ja: 彼らはさらに、その自然はあらゆる自然より貴いと言った。それゆえ、自分たちの書物に頼った者たちを欺いた。しかし同時に、彼らは真実を語っていた。したがって、これらのことを疑ってはならない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 243
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-009
  section: 35
  paragraph: 9
  source_en: But the Turba answereth:- Seeing that thou believest the sayings of the envious, explain,
    therefore, to posterity the disposition of the two natures.
  translation_ja: しかし集会の人々は答える。あなたは惜しむ者たちの言葉を信じているのだから、後世の人々に二つの自然の配剤を説明してほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 244
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-010
  section: 35
  paragraph: 10
  source_en: 'And he:- I testify to you that Art requires two natures, for the precious is not produced
    without the common, nor the common without the precious. It behoves you, therefore, O all ye Investigators
    of this Art, to follow the sayings of Victimerus, when he said to his disciples: Nothing else helps
    you save to sublimate water and vapour.'
  translation_ja: 彼は言う。術には二つの自然が必要であると、私はあなたがたに証言する。貴いものはありふれたものなしには生じず、ありふれたものも貴いものなしには生じないからである。したがって、この術を探究する皆よ、ヴィクティメルスが弟子たちに「水と蒸気を昇華させること以外、何も役に立たない」と言った、その言葉に従うべきである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 246
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-011
  section: 35
  paragraph: 11
  source_en: And the Turba:- The whole work is in the vapour and the sublimation of water. Demonstrate,
    therefore, to them the disposition of the vapour.
  translation_ja: 集会の人々は言う。作業全体は蒸気と水の昇華の内にある。したがって、蒸気の処理を彼らに示してほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 247
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-012
  section: 35
  paragraph: 12
  source_en: And he:- When ye shall perceive that the natures have become water by reason of the heat
    of the fire, and that they have been purified, and that the whole body of Magnesia is liquefied as
    water; then all things have been made vapour, and rightly, for then the vapour contains its own equal,
    wherefore the envious call either vapour, because both are joined in decoctions, and one contains
    the other. Thus our stag finds no path to escape, although flight be essential to it.
  translation_ja: 彼は言う。火の熱によって諸々の自然が水となり、浄化され、マグネシアの物体全体が水のように液化したことを認めたなら、そのときすべては蒸気となっている。それは正しい。蒸気はそのとき、自らと等しいものを含むからである。それゆえ惜しむ者たちは、いずれをも蒸気と呼ぶ。両者は煮詰めの内で結びつき、一方が他方を包むからである。このように、われわれの牡鹿は、逃走が本性であっても、逃げ道を見いださない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 248
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-013
  section: 35
  paragraph: 13
  source_en: The one keeps back the other, so that it has no opportunity to fly, and it finds no place
    to escape; hence all are made permanent, for when the one falls, being hidden in the body, it is congealed
    with it, and its colour varies, and it extracts its nature from the properties which God has infused
    into His elect, and it alienates it, lest it flee.
  translation_ja: 一方が他方を引き止めるため、逃げる機会がなく、脱出する場所も見つからない。こうしてすべてが恒久的となる。一方が落ち、物体の内に隠れると、物体とともに凝結し、その色が変わり、神が選ばれたものに注いだ性質から自らの自然を取り出し、それを変質させて、逃れないようにするからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 249
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-014
  section: 35
  paragraph: 14
  source_en: But the blackness and redness appear, and it falls into sickness, and dies by rust and putrefaction;
    properly speaking, then, it has not a flight, although it is desirous to escape servitude; then when
    it is free it follows its spouse, that a favourable colour may befall itself and its spouse; its beauty
    is not as it was, but when it is placed with coins, it makes them gold. For this reason, therefore,
    the Philosophers have called the spirit and the soul vapour.
  translation_ja: しかし黒さと赤さが現れ、それは病にかかり、錆と腐敗によって死ぬ。したがって厳密に言えば、それは隷属から逃れたいと願っても、逃走を持たない。やがて自由になると、自らと配偶者によい色が生じるよう、配偶者に従う。その美しさは以前のままではないが、貨幣とともに置かれると、それを金にする。それゆえ哲学者たちは、霊と魂を蒸気と呼んだのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 250
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-015
  section: 35
  paragraph: 15
  source_en: They have also called it the black humid wanting perlution; and forasmuch as in man there
    are both humidity and dryness, thus our work, which the envious have concealed, is nothing else but
    vapour and water.
  translation_ja: また彼らはそれを、洗浄を要する黒い湿りと呼んだ。そして人の内に湿りと乾きの両方があるように、惜しむ者たちが隠したわれわれの作業は、蒸気と水にほかならない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 251
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-016
  section: 35
  paragraph: 16
  source_en: The Turba answereth:- Demonstrate vapour and water!
  translation_ja: 集会の人々は答える。蒸気と水を説明してほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 252
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-017
  section: 35
  paragraph: 17
  source_en: And he:- I say that the work is out of two; the envious have called it composed out of two,
    because these two become four, wherein are dryness and humidity, spirit and vapour.
  translation_ja: 彼は言う。作業は二つから成ると、私は言う。惜しむ者たちは、それを二つから構成されたものと呼んだ。この二つが四つとなり、その内に乾きと湿り、霊と蒸気があるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 254
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-35-018
  section: 35
  paragraph: 18
  source_en: The Turba answereth:- Thou hast spoken excellently, and without envy. Let Zimon next follow.
  translation_ja: 集会の人々は答える。あなたは見事に、惜しまず語った。次にジモンが続けなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 256
  notes:
  - 冒頭の話者も Zimon だが、末尾でも次の発言者として Zimon を指名する。伝承本文の不整合として保持した。
  source_language: en
  target_language: ja
  kind: body
- id: turba-36-001
  section: 36
  paragraph: 1
  source_en: Afflontus, the Philosopher, saith:- I notify to you all, O ye investigators of this Art,
    that unless ye sublime the substances at the commencement by cooking, without contrition of hands,
    until the whole become water, ye have not yet found the work. And know ye, that the copper was formerly
    called sand, but by others stone, and, indeed, the names vary in every regimen.
  translation_ja: 哲学者アフロントゥスは言う。この術を探究する皆よ、あなたがたすべてに告げる。始めに、手で砕くことなしに、煮ることによって物質を昇華させ、全体が水となるまで続けなければ、まだ作業を見いだしていない。また知りなさい。銅は以前、砂と呼ばれ、他の者たちには石と呼ばれた。実際、その名は各々の処理において変わる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 259
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-36-002
  section: 36
  paragraph: 2
  source_en: Know further, that the nature and humidity become water, then a stone, if ye cause them to
    be well complexionated, and if ye are acquainted with the natures, because the part which is light
    and spiritual rises to the top, but that which is thick and heavy remains below in the vessel. Now
    this is the contrition of the Philosophers, namely, that which is not sublimated sinks down, but that
    which becomes a spiritual powder rises to the top of the vessel, and this is the contrition of decoction,
    not of hands.
  translation_ja: さらに知りなさい。自然と湿りをよく調合し、諸々の自然を熟知していれば、それらは水となり、その後、石となる。軽く霊的な部分は上に昇り、厚く重いものは容器の底に残るからである。さて、これが哲学者たちの粉砕である。すなわち、昇華しないものは沈み、霊的な粉末となったものは容器の上に昇る。これは煮詰めによる粉砕であり、手によるものではない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 260
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-36-003
  section: 36
  paragraph: 3
  source_en: Know also, that unless ye have turned all into powder, ye have not yet pounded them completely.
    Cook them, therefore, successively until they become converted, and a powder. Wherefore Agadaimon
    saith:- Cook the copper until it become a gentle and impalpable body, and impose in its own vessel;
    then sublimate the same six or seven times until the water shall descend. And know that when the water
    has become powder then has it been ground diligently.
  translation_ja: また知りなさい。すべてを粉末に変えていなければ、まだ完全には砕いていない。したがって順次煮て、変化して粉末となるまで続けなさい。それゆえアガダイモンは言う。銅を穏やかで手に粒を感じない物体となるまで煮て、それ自身の容器に入れ、それから六度または七度、水が降りるまで昇華させよ。そして、水が粉末となったとき、それは丹念にすりつぶされたのであると知りなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 261
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-36-004
  section: 36
  paragraph: 4
  source_en: But if ye ask, how is the water made a powder? note that the intention of the Philosophers
    is that the body before which before it falls into the water is not water may become water; the said
    water is mixed with the other water, and they become one water. It is to be stated, therefore, that
    unless ye turn the thing mentioned into water, ye shall not attain to the work.
  translation_ja: しかし、水はいかに粉末にされるのかと問うなら、哲学者たちの意図は、水に入る前には水でなかった物体が、水となることにあると注意しなさい。その水はもう一つの水と混ぜられ、一つの水となる。したがって、述べたものを水へ変えなければ、作業に到達しないと言わねばならない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 262
  notes:
  - 1896年版にも the body before which before it falls … という重複した構文がある。英語欄は保持し、訳では「水に入る前には水でなかった物体」を主旨として読んだ。
  source_language: en
  target_language: ja
  kind: body
- id: turba-36-005
  section: 36
  paragraph: 5
  source_en: It is, therefore, necessary for the body to be so possessed by the flame of the fire that
    it is disintegrated and becomes weak with the water, when the water has been added to the water, until
    the whole becomes water. But fools, hearing of water, think that this is water of the clouds. Had
    they read our books they would know that it is permanent water, which cannot become permanent without
    its companion, wherewith it is made one.
  translation_ja: それゆえ、水が水へ加えられて全体が水となるまで、物体は火の炎にすっかり捉えられ、分解して水とともに弱くならねばならない。しかし愚者たちは水と聞くと、雲の水だと思う。われわれの書物を読んでいたなら、恒久の水であると知るであろう。それは、一つとなる相手の伴侶なしには、恒久的となれない水である。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 263
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-36-006
  section: 36
  paragraph: 6
  source_en: But this is the water which the Philosophers have called Water of Gold, the Igneous, Good
    Venom, and that Sand of Many Names which Hermes ordered to be washed frequently, so that the blackness
    of the Sun might be removed, which he introduced in the solution of the body. And know, all ye seekers
    after this Art, that unless ye take this pure body, that is, our copper without the spirit, ye will
    by no means see what ye desire, because no foreign thing enters therein, nor does anything enter unless
    it be pure.
  translation_ja: だが、これこそ哲学者たちが、金の水、火性のもの、善き毒、また、多くの名を持つ砂と呼んだ水である。ヘルメスは、物体の溶解の際に導入した太陽の黒さを取り去るため、この砂を頻繁に洗うよう命じた。そしてこの術を求める皆よ、知りなさい。この純粋な物体、すなわち霊を伴わないわれわれの銅を取らなければ、望むものは決して見られない。そこには異質なものは何も入らず、純粋でないものも何一つ入らないからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 264
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-36-007
  section: 36
  paragraph: 7
  source_en: Therefore, all ye seekers after this Art, dismiss the multitude of obscure names, for the
    nature is one water; if anyone err, he draws nigh to destruction, and loses his life. Therefore, keep
    this one nature, but dismiss what is foreign.
  translation_ja: したがってこの術を求める皆よ、多くの曖昧な名を捨てなさい。自然は一つの水だからである。誤る者は破滅に近づき、生命を失う。それゆえ、この一つの自然を保ち、異質なものを捨てなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 265
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-001
  section: 37
  paragraph: 1
  source_en: Bonellus saith:- I will speak a little concerning Magnesia.
  translation_ja: ボネルスは言う。マグネシアについて少し話そう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 268
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-002
  section: 37
  paragraph: 2
  source_en: The Turba answereth:- Speak.
  translation_ja: 集会の人々は答える。話しなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 270
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-003
  section: 37
  paragraph: 3
  source_en: And he:- O all ye Sons of the Doctrine, when mixing Magnesia, place it in its vessel, the
    mouth of which close carefully, and cook with a gentle fire until it liquefy, and all become water
    therein! For the heat of the water acting thereupon, it becomes water by the will of God. When ye
    see that the said water is about to become black, ye know that the body is already liquefied. Place
    again in its vessel, and cook for forty days, until it drink up the moisture of the vinegar and honey.
  translation_ja: 彼は言う。教えの子らよ、皆、マグネシアを混ぜるときは、それ自身の容器に入れ、口を注意深く閉じ、液化して、内にあるすべてが水となるまで、穏やかな火で煮なさい。水の熱がそれに作用すると、神の意志によって水となるからである。その水が黒くなりかけたのを見たら、物体がすでに液化していると分かる。再び容器に入れ、酢と蜂蜜の湿りを飲み尽くすまで、四十日間煮なさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 271
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-004
  section: 37
  paragraph: 4
  source_en: But certain persons uncover it, say, once in each week, or once in every ten nights; in either
    case, the ultimate perfection of pure water appears at the end of forty days, for then it completely
    absorbs the humour of the decoction. Therefore, wash the same, and deprive of its blackness, until,
    the blackness being removed, the stone becomes dry to the touch. Hence the envious have said:- Wash
    the Magnesia with soft water, and cook diligently, until it become earth, and the humour perish.
  translation_ja: しかしある者たちは、たとえば週に一度、あるいは十夜ごとに一度、覆いを開く。いずれの場合にも、四十日の終わりに純粋な水の究極の完成が現れる。そのとき、煮詰めた液を完全に吸収するからである。それゆえこれを洗い、黒さを取り去り、黒さが除かれて石が触ると乾いている状態になるまで続けなさい。それゆえ惜しむ者たちは言った。マグネシアを柔らかな水で洗い、土となって液が失われるまで丹念に煮よ、と。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 272
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-005
  section: 37
  paragraph: 5
  source_en: 'Then it is called copper. Subsequently, pour very sharp vinegar upon it, and leave it to
    be soaked therein. But this is our copper, which the Philosophers have ordained should be washed with
    permanent water, wherefore they have said: Let the venom be divided into two parts, with one of which
    burn up the body, and with the other putrefy.'
  translation_ja: そのとき、それは銅と呼ばれる。その後、非常に鋭い酢を注ぎ、そこへ浸しておきなさい。しかしこれは、哲学者たちが恒久の水で洗うよう定めた、われわれの銅である。それゆえ彼らは、毒を二つに分け、一方で物体を焼き尽くし、他方で腐敗させよ、と言った。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 273
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-006
  section: 37
  paragraph: 6
  source_en: And know, all ye seekers after this Science, that the whole work and regimen does not take
    place except by water, wherefore, they say that the thing which ye seek is one, and, unless that which
    improves it be present in the said thing, what ye look for shall in no wise take place. Therefore,
    it behoves you to add those .things which are needful, that ye may thereby obtain that which you purpose.
  translation_ja: そしてこの学を求める皆よ、作業と処理の全体は水によるのでなければ起こらないことを知りなさい。それゆえ彼らは、求めるものは一つであり、それを改善するものがそのものの内に存在しなければ、探していることは決して起こらないと言う。したがって、それによって目的を得られるよう、必要なものを加えるべきである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 274
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-007
  section: 37
  paragraph: 7
  source_en: The Turba answereth:- Thou has spoken excellently, O Bonellus! If it please thee, therefore,
    finish that which thou art saying; otherwise repeat it a second time.
  translation_ja: 集会の人々は答える。ボネルスよ、あなたは見事に語った。したがって、よければ話していることを終えるか、さもなければもう一度繰り返してほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 275
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-008
  section: 37
  paragraph: 8
  source_en: But he:- Shall I indeed repeat these and like things? O all ye investigators of this Art,
    take our copper; place with the first part of the water in the vessel; cook for forty days; purify
    from all uncleanliness; cook further until its days be accomplished, and it become a stone having
    no moisture. Then cook until nothing remains except faeces. This done, cleanse seven times, wash with
    water, and when the water is used up leave it to putrefy in its vessel, so long as may seem desirable
    to your purpose.
  translation_ja: 彼は言う。本当に、これや同様のことを繰り返すべきだろうか。この術を探究する皆よ、われわれの銅を取り、水の第一の部分とともに容器へ入れ、四十日間煮て、すべての不浄から清め、さらに定められた日数が満ち、湿りのない石となるまで煮なさい。それから滓以外に何も残らなくなるまで煮なさい。それが済んだら七度清め、水で洗い、水が尽きたら、それ自身の容器の内で、目的にとって望ましいと思えるだけの間、腐敗するに任せなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 276
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-009
  section: 37
  paragraph: 9
  source_en: 'But the envious called this composition when it is turned into blackness that which is sufficiently
    black, and have said: Rule the same with vinegar and nitre. But that which remained when it had been
    whitened they called sufficiently white, and ordained that it should be ruled with permanent water.
    Again, when they called the same sufficiently red, they ordained that it should be ruled with water
    and fire until it became red.'
  translation_ja: しかし惜しむ者たちは、この配合物が黒さへ変わったとき、それを十分に黒いものと呼び、酢と硝石で処理せよと言った。だが白くされたときに残ったものを、十分に白いものと呼び、恒久の水で処理するよう定めた。また、同じものを十分に赤いものと呼んだときには、赤くなるまで水と火で処理するよう定めた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 277
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-010
  section: 37
  paragraph: 10
  source_en: The Turba answereth:- Show forth unto posterity what they intended by these things.
  translation_ja: 集会の人々は答える。彼らがこれらによって何を意図したのか、後世の人々に示してほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 278
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-011
  section: 37
  paragraph: 11
  source_en: And he:- They called it Ixir satis, by reason of the variation of its colours. In the work,
    however, there is neither variety, multiplicity, nor opposition of substances; it is necessary only
    to make the black copper white and then red. However, the truth-speaking Philosophers had no other
    intention than that of liquefying, pounding, and cooking Ixir until the stone should become like unto
    marble in its splendour.
  translation_ja: 彼は言う。彼らは、色が変化するため、これをイクシール・サティスと呼んだ。しかし作業の内には、物質の多様さ、多数性、対立はない。必要なのは、黒い銅を白くし、その後赤くすることだけである。だが真実を語る哲学者たちは、イクシールを液化し、砕き、石が大理石のような輝きを持つまで煮ること以外、何も意図しなかった。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 279
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-012
  section: 37
  paragraph: 12
  source_en: 'Accordingly, the envious again said: Cook the same with vapour until the stone becomes coruscating
    by reason of its brilliancy. But when ye see it thus, it is, indeed, the most great Arcanum. Notwithstanding,
    ye must then pound and wash it seven times with permanent water; finally, again pound and congeal
    in its own water, until ye extract its own concealed nature.'
  translation_ja: そこで惜しむ者たちは再び言った。蒸気とともに煮て、石がその輝きゆえに閃くまで続けよ。しかしそのような姿を見たなら、それはまさしく最も偉大な秘義である。それでも、その後、恒久の水で七度砕いて洗わねばならない。最後に、それ自身の水の内で再び砕いて凝結させ、それ自身の隠れた自然を取り出すまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 280
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-013
  section: 37
  paragraph: 13
  source_en: Wherefore, saith Maria, sulphurs are contained in sulphurs, but humour in like humour, and
    out of sulphur mixed with sulphur, there comes forth a great work. But I ordain that you rule the
    same with dew and the sun, until your purpose appear to you. For I signify unto you that there are
    two kinds of whitening and of making red, of which one consists in rust and the other in contrition
    and decoction. But ye do not need any contrition of hands.
  translation_ja: それゆえマリアは言う。硫黄は硫黄の内に、液は同じような液の内に含まれ、硫黄と混ざった硫黄から偉大な作業が生じる。しかし私は、目的が現れるまで、露と太陽によってこれを処理するよう定める。というのも、白くすることと赤くすることには二種類あり、一方は錆に、他方は粉砕と煮詰めに存すると、あなたがたに示すからである。だが手による粉砕は一切必要ない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 281
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-37-014
  section: 37
  paragraph: 14
  source_en: Beware, however, of making a separation from the waters lest the poisons get at You, and
    the body perish with the other things which are in the vessel.
  translation_ja: ただし、水から分離することには注意しなさい。毒があなたがたに及び、物体が容器にある他のものとともに滅びることのないように。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 282
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-38-001
  section: 38
  paragraph: 1
  source_en: Effistus saith:- Thou hast spoken most excellently, O Bonellus, and I bear witness to all
    thy words!
  translation_ja: エフィストゥスは言う。ボネルスよ、あなたは実に見事に語った。私はあなたのすべての言葉に証しする。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 285
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-38-002
  section: 38
  paragraph: 2
  source_en: The Turba saith:- Tell us if there be any service in the speech of Bonellus, so that those
    initiated in this disposition may be more bold and certain.
  translation_ja: 集会の人々は言う。この配剤を授けられた者たちが、さらに大胆で確信ある者となれるよう、ボネルスの話にどのような助けがあるか教えてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 287
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-38-003
  section: 38
  paragraph: 3
  source_en: Effistus saith:- Consider, all ye investigators of this Art, how Hermes, chief of the Philosophers,
    spoke and demonstrated when he wished to mix the natures. Take, he tells us, the stone of gold, combine
    with humour which is permanent water, set in its vessel, over a gentle fire until liquefaction takes
    place. Then leave it until the water dries, and the sand and water are combined, one with another;
    then let the fire be more intense than before, until it again becomes dry, and is made earth.
  translation_ja: エフィストゥスは言う。この術を探究する皆よ、哲学者たちの首長ヘルメスが、諸々の自然を混ぜようとしたとき、どのように語り、示したかを考えなさい。彼はわれわれに告げる。金の石を取り、恒久の水である液と結びつけ、それ自身の容器に入れ、液化が起こるまで穏やかな火にかけよ。それから水が乾き、砂と水が互いに結びつくまで置け。次に以前より火を強くし、再び乾いて土となるまで続けよ、と。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 288
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-38-004
  section: 38
  paragraph: 4
  source_en: When this is done, understand that here is the beginning of the arcanum; but do this many
    times, until two-thirds of the water perish, and colours manifest unto you.
  translation_ja: これが済んだら、ここに秘義の始まりがあると理解しなさい。しかしこれを何度も行い、水の三分の二が失われ、色が現れるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 289
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-38-005
  section: 38
  paragraph: 5
  source_en: The Turba answereth:- Thou hast spoken excellently, O Effistus! Yet, briefly inform us further.
  translation_ja: 集会の人々は答える。エフィストゥスよ、あなたは見事に語った。だが、さらに手短に教えてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 290
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-38-006
  section: 38
  paragraph: 6
  source_en: And he:- I testify to Posterity that the dealbation doth not take place save by decoction.
    Consequently, Agadaimon has very properly treated of cooking, of pounding, and of imbuing, ethelia.
    Yet I direct you not to pour on the whole of the water at one time, lest the Ixir be submerged, but
    pour it in gradually, pound and dessicate, and do this several times until the water be exhausted.
  translation_ja: 彼は言う。私は後世の人々に証言する。白化は煮詰めによるのでなければ起こらない。それゆえアガダイモンは、エテリアを煮ること、砕くこと、浸すことについて、極めて適切に扱った。しかし私は、イクシールが水没しないよう、一度にすべての水を注がず、少しずつ注いで、砕き、乾かし、水が尽きるまでこれを数度行うよう指示する。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 291
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-38-007
  section: 38
  paragraph: 7
  source_en: 'Now concerning this the envious have said: Leave the water when it has all been poured in,
    and it will sink to the bottom. But their intention is this, that while the humour is drying, and
    when it has been turned into powder, leave it in its glass vessel for forty days, until it passes
    through various colours, which the Philosophers have described. By this method of cooking the bodies
    put on their spirits and spiritual tinctures, and become warm.'
  translation_ja: さて、これについて惜しむ者たちは言った。水をすべて注いだらそのまま置け。そうすれば底へ沈む、と。しかし彼らの意図はこうである。液が乾いている間、そして粉末に変わったら、ガラス容器に四十日間置き、哲学者たちが説明したさまざまな色を経るまで待て、ということである。この煮る方法によって、物体は自らの霊と霊的な着色剤をまとい、暖かくなる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 292
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-38-008
  section: 38
  paragraph: 8
  source_en: The Turba answereth:- Thou hast given light to us, O Effistus, and hast done excellently!
    Truly art thou cleared from envy; wherefore, let one of you others speak as he pleases.
  translation_ja: 集会の人々は答える。エフィストゥスよ、あなたはわれわれに光を与え、見事に行った。まことに、あなたに惜しむ心はないと認められる。それゆえ、ほかの誰かが望むとおりに語りなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 293
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-39-001
  section: 39
  paragraph: 1
  source_en: Bacsen saith:- O all ye seekers after this Art, ye can reach no useful result without a patient,
    laborious, and solicitous soul, persevering courage, and continuous regimen. He, therefore, who is
    willing to Persevere in this disposition, and would enjoy the result, may enter upon it, but he who
    desires to learn over speedily, must not have recourse to our books, for they impose great labour
    before they are read in their higher sense, once, twice, or thrice.
  translation_ja: バクセンは言う。この術を求める皆よ、忍耐強く、骨を惜しまず、細心な魂、たゆまぬ勇気、連続した処理なしには、有用な結果へ到達できない。したがって、この配剤を辛抱強く続ける意志があり、結果を享受したい者は、これを始めてよい。しかし、あまりに速く学ぼうとする者は、われわれの書物に頼ってはならない。高い意味で一度、二度、三度と読めるようになるまで、それらは大いなる労苦を課すからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 296
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-39-002
  section: 39
  paragraph: 2
  source_en: Therefore, the Master saith:- Whosoever bends his back over the study of our books, devoting
    his leisure thereto, is not occupied with vain thoughts, but fears God, and shall reign in the Kingdom
    without fail until he die. For what ye seek is not of small price.
  translation_ja: それゆえ師は言う。われわれの書物を学ぶために身をかがめ、余暇を捧げる者は誰であれ、空しい思いにふけるのではなく、神を畏れ、死ぬまで必ず王国に君臨するであろう。あなたがたの求めるものは、安い価値のものではないからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 297
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-39-003
  section: 39
  paragraph: 3
  source_en: Woe unto you who seek the very great and compensating treasure of God! Know ye not that for
    the smallest Purpose in the world, earthly men will give themselves to death, and what, therefore,
    ought they to do for this most excellent and almost impossible offering? Now, the regimen is greater
    than is perceived by reason, except through divine inspiration.
  translation_ja: 神の、極めて偉大で報いる宝を求めるあなたがたに、災いあれ。この世の人々は、世界のごく小さな目的のためにも、死に身を委ねることを知らないのか。ならば、この最も優れ、ほとんど不可能な捧げ物のためには、何をなすべきであろうか。さて、この処理は、神の霊感によるのでなければ、理性で把握できるものを超えている。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 298
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-39-004
  section: 39
  paragraph: 4
  source_en: I once met with a person who was as well acquainted with the elements as I myself, but when
    he proceeded to rule this disposition, he attained not to the joy thereof by reason of his sadness
    and ignorance in ruling, and excessive eagerness, desire, and haste concerning the purpose. Woe unto
    you, sons of the Doctrine! For one who plants trees does not look for fruit, save in due season; he
    also who sows seeds does not expect to reap, except at harvest time.
  translation_ja: かつて私は、私自身と同じほど元素に通じた人に会った。しかしその人がこの配剤の処理に進んだとき、悲しみと処理の無知、そして目的への過剰な熱心さ、欲望、性急さのため、その喜びに達しなかった。教えの子らよ、災いあれ。木を植える者は、しかるべき季節以外に果実を求めず、種を蒔く者も、収穫の時以外に刈り取ることを期待しない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 299
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-39-005
  section: 39
  paragraph: 5
  source_en: How, then, should ye desire to attain this offering when ye have read but a single book,
    or have adventured only the first regimen? But the Philosophers have plainly stated that the truth
    is not to be discerned except after error, and nothing creates greater pain at heart than error in
    this Art, while each imagines that he has almost the whole world, and yet finds nothing in his hands.
  translation_ja: では、一冊の書物を読んだだけ、あるいは最初の処理を試みただけで、どうしてこの捧げ物に達したいと願うべきだろうか。哲学者たちは、真実は誤りの後でなければ見分けられないとはっきり述べた。そしてこの術における誤りほど、心に大きな苦痛を生むものはない。各人はほとんど世界全体を手にしたと想像するのに、手の内には何も見いださないのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 300
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-39-006
  section: 39
  paragraph: 6
  source_en: Woe unto you! Understand the dictum of the Philosopher, and how he divided the work when
    he said- pound, cook, reiterate, and be thou not weary. But when thus he divided the work, he signified
    commingling, cooking, assimilating, roasting, heating, whitening, pounding, cooking Ethelia, making
    rust or redness, and tingeing. Here, therefore, are there many names, and yet there is one regimen.
  translation_ja: あなたがたに災いあれ。哲学者の言葉を理解しなさい。彼が「砕け、煮よ、繰り返せ、倦むな」と言ったとき、どのように作業を分けたかを理解しなさい。しかしそのように作業を分けたとき、彼は混合、煮ること、同化、焙焼、加熱、白化、粉砕、エテリアを煮ること、錆すなわち赤さを作ること、染めることを意味していた。したがってここには多くの名があるが、処理は一つなのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 301
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-39-007
  section: 39
  paragraph: 7
  source_en: And if men knew that one decoction and one contrition would suffice them, they would not
    so often repeat their words, as they have done, and in order that the mixed body may be pounded and
    cooked diligently, have admonished you not to be weary thereof. Having darkened the matter to you
    with their words, it suffices me to speak in this manner. It is needful to complexionate the venom
    rightly, then cook many times, and do not grow tired of the decoction.
  translation_ja: もし人々が、一度煮詰め、一度砕くだけで十分だと知っていたなら、実際にしたように、かくもたびたび言葉を繰り返すことはなかったであろう。そして、混合された物体を丹念に砕き、煮るために、それに倦んではならないと戒めたのである。彼らが言葉によって事柄をあなたがたに暗くした以上、私にはこのように語ることで十分である。毒を正しく調合し、それから幾度も煮て、煮詰めることに倦まぬようにしなければならない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 302
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-39-008
  section: 39
  paragraph: 8
  source_en: Imbue and cook it until it shall become as I have ordained that it should be ruled by you-
    namely, impalpable spirits, and until ye perceive that the Ixir is clad in the garment of the Kingdom.
    For when ye behold the Ixir turned into Tyrian colour, then have ye found that which the Philosophers
    discovered before you. If ye understand my words (and although my words be dead, yet is there life
    therein for those who understand themselves), they will forthwith explain any ambiguity occurring
    herein.
  translation_ja: それを浸し、煮て、私が処理するよう定めた状態、すなわち手に感じられない霊となり、イクシールが王国の衣をまとっていると認めるまで続けなさい。イクシールがテュロスの色に変わったのを見たとき、あなたがた以前の哲学者たちが発見したものを、あなたがたも見いだしたのである。私の言葉を理解するなら、ここに生じるどの曖昧さも、直ちに説明されるであろう。私の言葉は死んでいても、自らを理解する者にとっては、その内に生命がある。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 303
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-39-009
  section: 39
  paragraph: 9
  source_en: Read, therefore, repeatedly, for reading is a dead speech, but that which is uttered with
    the lips the same is living speech. Hence we have ordered you to read frequently, and, moreover, ponder
    diligently over the things which we have narrated.
  translation_ja: したがって繰り返し読みなさい。読むものは死んだ言葉だが、唇から発せられるものは生きた言葉だからである。それゆえ、われわれは頻繁に読むよう命じ、さらに、語ってきた事柄を丹念に考察するよう命じたのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 304
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-40-001
  section: 40
  paragraph: 1
  source_en: Jargus saith:- Thou hast left obscure a part of thy discourse, O Bacsen!
  translation_ja: ヤルグスは言う。バクセンよ、あなたの話には、曖昧なまま残された部分がある。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 307
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-40-002
  section: 40
  paragraph: 2
  source_en: And he:- Do thou, therefore, Jargus, in thy clemency shew forth the same!
  translation_ja: 彼は言う。ではヤルグスよ、あなたの寛大さによって、それを明らかにしてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 309
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-40-003
  section: 40
  paragraph: 3
  source_en: And he answereth:- The copper of which thou hast before spoken is not copper, nor is it the
    tin of the vulgar; it is our true work (or body) which must be combined with the body of Magnesia,
    that it may be cooked and pounded without wearying until the stone is made. Afterwards, that stone
    must be pounded in its vessel with the water of nitre, and, subsequently, placed in liquefaction until
    it is destroyed.
  translation_ja: 彼は答える。あなたが前に語った銅は、銅ではなく、通常の錫でもない。それはわれわれの真の作業物〔または物体〕であり、マグネシアの物体と結び合わせ、石が作られるまで倦むことなく煮て砕かねばならない。その後、その石を、それ自身の容器の内で硝石の水とともに砕き、続いて、それが壊れるまで液化の状態に置かねばならない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 310
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-40-004
  section: 40
  paragraph: 4
  source_en: But, all ye investigators of this art, it is necessary to have a water by which the more
    you cook, so much the more you sprinkle, until the said copper shall put on rust, which is the foundation
    of our work. Cook, therefore, and pound with Egyptian vinegar.
  translation_ja: しかし、この術を探究する皆よ、必要なのは、煮れば煮るほど、それだけ多く振りかける水である。われわれの作業の基礎である錆を、その銅がまとうまで続けなさい。したがって、エジプトの酢で煮て、砕きなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 311
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-41-001
  section: 41
  paragraph: 1
  source_en: Zimon saith:- Whatsoever thou hast uttered, O Jargos, is true, yet I do not see that the
    whole Turba hath spoken concerning the rotundum.
  translation_ja: ジモンは言う。ヤルゴスよ、あなたが語ったことはすべて真実だ。しかし集会全体がロトゥンドゥムについて語ったとは、私には思えない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 314
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-41-002
  section: 41
  paragraph: 2
  source_en: Then he:- Speak, therefore, thine opinion concerning it, O Zimon!
  translation_ja: すると彼は言う。ではジモンよ、それについてあなたの考えを述べなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 316
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-41-003
  section: 41
  paragraph: 3
  source_en: Zimon saith:- I notify to Posterity that the rotundum turns into four elements, and is derived
    out of one thing.
  translation_ja: ジモンは言う。私は後世の人々に知らせる。ロトゥンドゥムは四元素へ変わり、一つのものから生じる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 318
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-41-004
  section: 41
  paragraph: 4
  source_en: The Turba answereth:- Inasmuch as thou art speaking, explain for future generations the method
    of ruling.
  translation_ja: 集会の人々は答える。あなたが話しているのだから、後の世代のために処理の方法を説明してほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 320
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-41-005
  section: 41
  paragraph: 5
  source_en: 'And he:- Willingly: it is necessary to take one part of our copper, but of Permanent Water
    three parts; then let them be mixed and cooked until they be thickened and become one stone, concerning
    which the envious have said: Take one part of the pure body, but three parts of copper of Magnesia;
    then commingle with rectified vinegar, mixed with male of earth; close the vessel, observe what is
    in it, and cook continuously until it becomes earth.'
  translation_ja: 彼は言う。喜んでそうしよう。われわれの銅を一部、恒久の水を三部取る必要がある。それから混ぜて煮て、厚くなり、一つの石となるまで続けなさい。それについて惜しむ者たちは言った。純粋な物体を一部、マグネシアの銅を三部取り、土の雄を混ぜた精製酢と混ぜ合わせよ。容器を閉じ、その内にあるものを観察し、土となるまで絶えず煮よ、と。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 321
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-42-001
  section: 42
  paragraph: 1
  source_en: 'Ascanius saith:- Too much talking, O all ye Sons of the Doctrine, leads this subject further
    into error! But when ye read in the books of the Philosophers that Nature is one only, and that she
    overcomes all things: Know that they are one thing and one composite.'
  translation_ja: アスカニウスは言う。教えの子らよ、皆、語りすぎることは、この主題をさらに誤りへ導く。しかし哲学者たちの書物に、自然はただ一つであり、万物に打ち勝つと読むとき、それらは一つのもの、一つの複合物であると知りなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 324
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-42-002
  section: 42
  paragraph: 2
  source_en: Do ye not see that the complexion of a man is formed out of a soul and body; thus, also,
    must ye conjoin these, because the Philosophers, when they prepared the matters and conjoined spouses
    mutually in love with each other, behold there ascended from them a golden water!
  translation_ja: 人の構成が魂と身体から形作られることが分からないか。同じように、あなたがたもこれらを結び合わせねばならない。哲学者たちが質料を調製し、互いを愛する配偶者たちを結び合わせたとき、見よ、そこから黄金の水が昇ったからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 325
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-42-003
  section: 42
  paragraph: 3
  source_en: The Turba answereth:- When thou wast treating of the first work, lo! thou didst turn unto
    the second! How ambiguous hast thou made thy book, and how obscure are thy words!
  translation_ja: 集会の人々は答える。第一の作業を扱っていたのに、何と、第二へ移ってしまった。あなたは書物を何と曖昧にし、言葉を何と不明瞭にしたことか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 326
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-42-004
  section: 42
  paragraph: 4
  source_en: Then he:- I will perform the disposition of the first work.
  translation_ja: すると彼は言う。第一の作業の配剤を述べよう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 328
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-42-005
  section: 42
  paragraph: 5
  source_en: The Turba answereth:- Do this.
  translation_ja: 集会の人々は答える。そうしなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 330
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-42-006
  section: 42
  paragraph: 6
  source_en: And he:- Stir up war between copper and quicksilver, until they go to destruction and are
    corrupted, because when the copper conceives the quicksilver it coagulates it, but when the quicksilver
    conceives the copper, the copper is congealed into earth; stir up, therefore, a fight between them;
    destroy the body of the copper until it becomes a powder.
  translation_ja: 彼は言う。銅と水銀の間に戦争を起こし、両者が破壊され、腐敗するまで続けなさい。銅が水銀を宿すと、水銀を凝固させるが、水銀が銅を宿すと、銅は土へ凝結するからである。したがって両者の間に争いを起こし、銅の物体を、粉末となるまで破壊しなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 331
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-42-007
  section: 42
  paragraph: 7
  source_en: But conjoin the male to the female, which are vapour and quicksilver, until the male and
    the female become Ethel, for he who changes them into spirit by means of Ethel, and next makes them
    red, tinges every body, because, when by diligent cooking ye pound the body, ye extract a pure, spiritual,
    and sublime soul therefrom, which tinges every body.
  translation_ja: しかし、雄と雌、すなわち蒸気と水銀を結び合わせ、雄と雌がエテルとなるまで続けなさい。エテルによってそれらを霊に変え、次に赤くする者は、あらゆる物体を染めるからである。丹念に煮ることによって物体を砕くと、そこから、あらゆる物体を染める、純粋で霊的で崇高な魂を取り出すのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 332
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-42-008
  section: 42
  paragraph: 8
  source_en: The Turba answereth:- Inform, therefore, posterity what is that body.
  translation_ja: 集会の人々は答える。では、その物体が何であるか、後世の人々に知らせてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 333
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-42-009
  section: 42
  paragraph: 9
  source_en: And he:- It is a natural sulphureous thing which is called by the names of all bodies.
  translation_ja: 彼は言う。それは自然の硫黄性のものであり、あらゆる物体の名で呼ばれる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 335
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-43-001
  section: 43
  paragraph: 1
  source_en: Dardaris saith:- Ye have frequently treated of the regimen, and have introduced the conjunction,
    yet I proclaim to posterity that they cannot extract the now hidden soul except by Ethelia, by which
    bodies become not bodies through continual cooking, and by sublimation of Ethelia. Know also that
    quicksilver is fiery, burning every body more than does fire, also mortifying bodies, and that every
    body which is mingled with it is ground and delivered over to be destroyed.
  translation_ja: ダルダリスは言う。あなたがたは処理についてたびたび論じ、結合を導入した。しかし私は後世の人々に宣言する。今は隠された魂を取り出すには、絶えず煮ることによって物体を物体でないものにするエテリアと、エテリアの昇華によるほかはない。また知りなさい。水銀は火性で、火よりも強くあらゆる物体を焼き、また物体を死なせる。そしてそれと混ぜられたすべての物体は砕かれ、破壊へ引き渡される。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 338
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-43-002
  section: 43
  paragraph: 2
  source_en: When, therefore, ye have diligently pounded the bodies, and have exalted them as required,
    therefrom is produced that Ethel nature, and a colour which is tingeing and not volatile, and it tinges
    the copper which the Turba said did not tinge until it is tinged, because that which is tinged tinges.
  translation_ja: したがって物体を丹念に砕き、必要なとおりに高めたなら、そこから、あのエテルの自然と、揮発せず染める色が生じる。そしてそれは、集会の人々が、染められるまでは染めないと言った銅を染める。染められたものが染めるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 339
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-43-003
  section: 43
  paragraph: 3
  source_en: Know also that the body of the copper is ruled by Magnesia, and that quicksilver is four
    bodies, also that the matter has no being except by humidity, because it is the water of sulphur,
    for sulphurs are contained in sulphurs.
  translation_ja: また知りなさい。銅の物体はマグネシアによって処理され、水銀は四つの物体であり、また質料は湿りによるのでなければ存在しない。それは硫黄の水だからであり、硫黄は硫黄の内に含まれるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 340
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-43-004
  section: 43
  paragraph: 4
  source_en: The Turba saith:- O Dardaris, inform posterity what sulphurs are!
  translation_ja: 集会の人々は言う。ダルダリスよ、硫黄とは何であるか、後世の人々に知らせてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 341
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-43-005
  section: 43
  paragraph: 5
  source_en: And he:- Sulphurs are souls which are hidden in four bodies, and, extracted by themselves,
    do contain one another, and are naturally conjoined. For if ye rule that which is hidden in the belly
    of sulphur with water, and cleanse well that which is hidden, then nature rejoices, meeting with nature,
    and water similarly with its equal. Know ye also that the four bodies are not tinged but tinge.
  translation_ja: 彼は言う。硫黄とは四つの物体の内に隠された魂であり、それ自体で取り出されると互いを包み、自然に結びつく。硫黄の腹に隠されたものを水で処理し、隠されたものをよく清めれば、自然は自然と出会って喜び、水も同様に自らと等しいものと出会って喜ぶからである。また知りなさい。四つの物体は染められるのではなく、染めるのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 343
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-43-006
  section: 43
  paragraph: 6
  source_en: And the Turba:- Why dost thou not say like the ancients that when they are tinged, they tinge?
  translation_ja: 集会の人々は言う。なぜ古人たちのように、それらは染められると染める、と言わないのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 344
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-43-007
  section: 43
  paragraph: 7
  source_en: And he:- I state that the four coins of the vulgar populace are not tinged, but they tinge
    copper, and when that copper is tinged, it tinges the coins of the populace.
  translation_ja: 彼は言う。私は、俗人の四つの貨幣は染められず、銅を染めると述べる。そしてその銅が染められると、俗人の貨幣を染めるのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 346
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-44-001
  section: 44
  paragraph: 1
  source_en: Moyses saith:- This one thing of which thou hast told us, O Dardaris, the Philosophers have
    called by many names, sometimes by two and sometimes by three names!
  translation_ja: モイセスは言う。ダルダリスよ、あなたがわれわれに語ったこの一つのものを、哲学者たちは多くの名で、ときには二つ、ときには三つの名で呼んだ。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 350
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-44-002
  section: 44
  paragraph: 2
  source_en: Dardaris answereth:- Name it, therefore, for posterity, setting aside envy.
  translation_ja: ダルダリスは答える。では、惜しむ心を捨て、後世の人々のために名を挙げてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 351
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-44-003
  section: 44
  paragraph: 3
  source_en: And he:- The one is that which is fiery, the two is the body composed in it, the three is
    the water of sulphur, with which also it is washed and ruled until it be perfected. Do ye not see
    what the Philosopher affirms, that the quicksilver which tinges gold is quicksilver out of Cambar?
  translation_ja: 彼は言う。一つは火性のものであり、二つはその内で構成された物体であり、三つは硫黄の水である。それによって洗われ、完成するまで処理される。哲学者が、金を染める水銀はカンバルからの水銀であると断言するのを、あなたがたは見ないのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 353
  notes:
  - 一・二・三は本文の区分をそのまま訳した。近代化学の物質数や比率へ確定しない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-44-004
  section: 44
  paragraph: 4
  source_en: 'Dardaris answereth:- What dost thou mean by this? For the Philosopher says: sometimes from
    Cambar and sometimes from Orpiment.'
  translation_ja: ダルダリスは答える。それによって何を言おうとするのか。哲学者は、ときにはカンバルから、ときには石黄から、と言うからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 357
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-44-005
  section: 44
  paragraph: 5
  source_en: And he:- Quicksilver of orpiment is Cambar of Magnesia, but quicksilver is sulphur ascending
    from the mixed composite. Ye must, therefore, mix that thick thing with fiery venom, putrefy, and
    diligently pound until a spirit be produced, which is hidden in that other spirit; then is made the
    tincture which is desired of you all.
  translation_ja: 彼は言う。石黄の水銀はマグネシアのカンバルである。しかし水銀は、混合された複合物から昇る硫黄である。それゆえ、あの厚いものを火性の毒と混ぜ、腐敗させ、丹念に砕き、もう一つの霊に隠された霊が生じるまで続けねばならない。そのとき、あなたがたすべてが望む着色剤が作られる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 358
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-45-001
  section: 45
  paragraph: 1
  source_en: 'But Plato saith: It behoves you all, O Masters, when those bodies are being dissolved, to
    take care lest they be burnt up, as also to wash them with sea water, until all their salt be turned
    into sweetness, clarifies, tinges, becomes tincture of copper, and then goes off in flight! Because
    it was necessary that one should become tingeing, and that the other should be tinged, for the spirit
    being separated from the body and hidden in the other spirit, both become volatile.'
  translation_ja: しかしプラトンは言う。師たちよ、皆、これらの物体を溶かすときは、焼き尽くされぬよう注意し、また海の水で洗うべきである。その塩がすべて甘さへ変わり、澄み、染め、銅の着色剤となり、それから飛び去るまで続けなさい。一方は染めるものとなり、他方は染められるものとなる必要があったからである。物体から分離され、もう一つの霊に隠れた霊によって、両者は揮発するものとなる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 361
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-45-002
  section: 45
  paragraph: 2
  source_en: Therefore the Wise have said that the gate of flight must not be opened for that which would
    flee, (or that which does not flee), by whose flight death is occasioned, for by the conversion of
    the sulphureous thing into a spirit like unto itself, either becomes volatile, since they are made
    aeriform spirits prone to ascend in the air.
  translation_ja: それゆえ賢者たちは、逃げようとするもの〔または逃げないもの〕に、逃走の門を開いてはならないと言った。その逃走によって死が生じるからである。硫黄性のものが自らに似た霊へ変わることによって、両者は揮発するようになる。空気中へ昇りやすい、空気状の霊とされるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 362
  notes:
  - 丸括弧の別読はWaite英訳に付随する本文中の補足である。〔または…〕として区別した。
  source_language: en
  target_language: ja
  kind: body
- id: turba-45-003
  section: 45
  paragraph: 3
  source_en: But the Philosophers seeing that which was not volatile made volatile with the volatiles,
    iterated these to a body like to the non-volatiles, and put them into that from which they could not
    escape. They iterated them to a body like unto the bodies from which they were extracted, and the
    same were then digested. But as for the statement of the Philosopher that the tingeing agent and that
    which is to be tinged are made one tincture, it refers to a spirit concealed in another humid spirit.
  translation_ja: しかし哲学者たちは、揮発しなかったものが揮発するものとともに揮発するようになったのを見て、これらを揮発しないものに似た物体へ戻し、逃げられないものの内へ入れた。彼らは、それらが取り出された元の物体に似た物体へ戻し、そして熟成させた。しかし、染める作用者と染められるものが一つの着色剤となるという哲学者の言葉は、別の湿った霊の内に隠された霊を指している。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 363
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-45-004
  section: 45
  paragraph: 4
  source_en: Know also that one of the humid spirits is cold, but the other is hot, and although the cold
    humid is not adapted to the warm humid, nevertheless they are made one. Therefore, we prefer these
    two bodies, because by them we rule the whole work, namely, bodies by not-bodies, until incorporeals
    become bodies, steadfast in the fire, because they are conjoined with volatiles, which is not possible
    in any body, these excepted. For spirits in every wise avoid bodies, but fugitives are restrained
    by incorporeals.
  translation_ja: また知りなさい。湿った霊の一方は冷たく、他方は熱い。そして冷たく湿ったものは、暖かく湿ったものに適していないにもかかわらず、両者は一つとなる。それゆえ、われわれはこの二つの物体を選ぶ。それらによって作業全体、すなわち物体を物体でないものによって処理し、非物体的なものが、火の中で不動の物体となるまで続けるからである。それらは揮発するものと結ばれており、この二つ以外のいかなる物体にも、それは不可能である。霊はいかなる仕方でも物体を避けるが、逃げるものは非物体的なものによって抑えられるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 364
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-45-005
  section: 45
  paragraph: 5
  source_en: Incorporeals, therefore, similarly flee from bodies; those, consequently, which do not flee
    are better and more precious than all bodies.
  translation_ja: したがって非物体的なものも、同様に物体から逃れる。それゆえ、逃れないものは、あらゆる物体より良く、貴いのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 365
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-45-006
  section: 45
  paragraph: 6
  source_en: These things, therefore, being done, take those which are not volatile and join them; wash
    the body with the incorporeal until the incorporeal receives a non-volatile body; convert the earth
    into water, water into fire, fire into air, and conceal the fire in the depths of the water, but the
    earth in the belly of the air, mingling the hot with the humid, and the cold with the dry. Know, also,
    that Nature overcomes Nature, Nature rejoices in Nature, Nature contains Nature.
  translation_ja: したがって、これらを終えたら、揮発しないものを取って結びつけなさい。非物体的なものが揮発しない物体を受け取るまで、非物体的なもので物体を洗いなさい。土を水に、水を火に、火を空気に変えなさい。そして火を水の深みに、土を空気の腹に隠し、熱いものを湿ったものと、冷たいものを乾いたものと混ぜなさい。また知りなさい。自然は自然に打ち勝ち、自然は自然の内で喜び、自然は自然を包む。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 366
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-46-001
  section: 46
  paragraph: 1
  source_en: Attamus saith:- It is to be noted that the whole assembly of the Philosophers have frequently
    treated concerning Rubigo. Rubigo, however, is a fictitious and not a true name.
  translation_ja: アッタムスは言う。哲学者たちの集会全体が、たびたびルビゴについて論じたことに注意すべきである。しかしルビゴは、仮の名であって真の名ではない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 369
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-46-002
  section: 46
  paragraph: 2
  source_en: The Turba answereth:- Name, therefore, Rubigo by its true name, for by this it is not calumniated.
  translation_ja: 集会の人々は答える。では、ルビゴを真の名で呼んでほしい。それによって、そしられることはない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 373
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-46-003
  section: 46
  paragraph: 3
  source_en: And he:- Rubigo is according to the work, because it is from gold alone.
  translation_ja: 彼は言う。ルビゴは作業に応じたものである。金だけから生じるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 375
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-46-004
  section: 46
  paragraph: 4
  source_en: The Turba answereth:- Why, then, have the Philosophers referred it to the leech?
  translation_ja: 集会の人々は答える。では、なぜ哲学者たちはそれを蛭に関係づけたのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 377
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-46-005
  section: 46
  paragraph: 5
  source_en: He answereth:- Because water is hidden in sulphureous gold as the leech is in water; rubigo,
    therefore, is rubefaction in the second work, but to make rubigo is to whiten in the former work,
    in which the Philosophers ordained that the flower of gold should be taken and a proportion of gold
    equally.
  translation_ja: 彼は答える。蛭が水の中にいるように、水は硫黄性の金に隠されているからである。したがってルビゴは第二の作業では赤化だが、前の作業でルビゴを作るとは白くすることである。その作業において哲学者たちは、金の花と、それに等しい割合の金を取るよう定めた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 378
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-47-001
  section: 47
  paragraph: 1
  source_en: Mundus saith:- Thou hast already treated sufficiently of Rubigo, O Attamus! I will speak,
    therefore, of venom, and will instruct future generations that venom is not a body, because subtle
    spirits have made it into a tenuous spirit, have tinged the body and burned it with venom, which venom
    the Philosopher asserts will tinge every body. But the Ancient Philosophers thought that he who turned
    gold into venom had arrived at the purpose, but he who can do not this profiteth nothing.
  translation_ja: ムンドゥスは言う。アッタムスよ、あなたはルビゴについてすでに十分論じた。それゆえ私は毒について語り、後の世代に、毒は物体ではないと教えよう。精妙な霊がそれを微細な霊へ変え、物体を染め、毒で焼いたからである。哲学者は、その毒があらゆる物体を染めると断言している。しかし古代の哲学者たちは、金を毒に変えた者は目的に到達したが、それのできない者は何も得ないと考えた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 381
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-47-002
  section: 47
  paragraph: 2
  source_en: 'Now I say unto you, all ye Sons of the Doctrine, that unless ye reduce the thing by fire
    until those things ascend like a spirit, ye effect nought. This, therefore, is a spirit avoiding the
    fire and a ponderous smoke, which when it enters the body penetrates it entirely, and makes the body
    rejoice. The Philosophers have all said: Take a black and conjoining spirit; therewith break up the
    bodies and torture them till they be altered.'
  translation_ja: さて教えの子らよ、皆、私は告げる。それらが霊のように昇るまで、そのものを火によって還元しなければ、何も成し遂げられない。したがってこれは、火を避ける霊であり、重い煙である。それは物体へ入ると、その全体に浸透し、物体を喜ばせる。哲学者たちは皆、黒く、結びつける霊を取り、それによって物体を砕き、変化するまで苦しめよ、と言った。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 382
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-48-001
  section: 48
  paragraph: 1
  source_en: Pythagoras saith:- We must affirm unto all you seekers after this Art that the Philosophers
    have treated of conjunction (or continuation) in various ways. But I enjoin upon you to make quicksilver
    constrain the body of Magnesia, or the body Kuhul, or the Spume of Luna, or incombustible sulphur,
    or roasted calx, or alum which is out of apples, as ye know. But if there was any singular regimen
    for any of these, a Philosopher would not say so, as ye know.
  translation_ja: ピュタゴラスは言う。この術を求めるあなたがたすべてに、哲学者たちは結合〔または連続〕を多様な仕方で扱った、と断言しなければならない。しかし私は、水銀によってマグネシアの物体、あるいはクフルの物体、月の泡、不燃性の硫黄、焼いた灰、または、あなたがたの知る、リンゴからの明礬を拘束するよう命じる。しかし、これらのいずれかに固有の処理法があるなら、哲学者はそのようには語らないであろう。あなたがたも知るとおりである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 384
  notes:
  - 公開翻刻の con strain は constrain として校整した。底本の語と文脈を確認した明白な転記誤りの修正。転記段階の読みも内蔵データに保持する。
  source_language: en
  target_language: ja
  kind: body
  transcription_reading: Pythagoras saith:- We must affirm unto all you seekers after this Art that the
    Philosophers have treated of conjunction (or continuation) in various ways. But I enjoin upon you
    to make quicksilver con strain the body of Magnesia, or the body Kuhul, or the Spume of Luna, or incombustible
    sulphur, or roasted calx, or alum which is out of apples, as ye know. But if there was any singular
    regimen for any of these, a Philosopher would not say so, as ye know.
- id: turba-48-002
  section: 48
  paragraph: 2
  source_en: Understand, therefore, that sulphur, calx, and alum which is from apples, and Kuhul, are
    all nothing else but water of sulphur. Know ye also that Magnesia, being mixed with quicksilver and
    sulphur, they pursue one another. Hence you must not dismiss that Magnesia without the quicksilver,
    for when it is composed it is called an exceeding strong composition, which is one of the ten regimens
    established by the Philosophers.
  translation_ja: したがって理解しなさい。硫黄、灰、リンゴからの明礬、クフルは、すべて硫黄の水にほかならない。また知りなさい。マグネシアが水銀と硫黄に混ぜられると、それらは互いを追う。それゆえ、水銀なしにそのマグネシアを放っておいてはならない。それは配合されると、極めて強い配合物と呼ばれ、哲学者たちが定めた十の処理法の一つだからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 385
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-48-003
  section: 48
  paragraph: 3
  source_en: Know, also, that when Magnesia is whitened with quicksilver, you must congeal white water
    therein, but when it is reddened you must congeal red water, for, as the Philosophers have observed
    in their books, the regimen is not one. Accordingly, the first congelation is of tin, copper, and
    lead. But the second is composed with water of sulphur. Some, however, reading this book, think that
    the composition can be bought.
  translation_ja: また知りなさい。マグネシアが水銀によって白くされたとき、その内で白い水を凝結させねばならない。しかし赤くされたときは、赤い水を凝結させねばならない。哲学者たちが書物で述べたように、処理は一つではないからである。したがって第一の凝結は、錫、銅、鉛のものである。しかし第二は、硫黄の水とともに構成される。ところがこの書を読むある者たちは、配合物を買えると思っている。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 386
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-48-004
  section: 48
  paragraph: 4
  source_en: It must be known for certain that nothing of the work can be bought, and that the science
    of this Art is nothing else than vapour and the sublimation of water, with the conjunction, also,
    of quicksilver in the body of Magnesia; but, heretofore, the Philosophers have demonstrated in their
    books that the impure water of sulphur is from sulphur only, and no sulphur is produced without the
    water of its calx, and of quicksilver, and of sulphur.
  translation_ja: 作業に属するものは何一つ買えないこと、そしてこの術の学は、マグネシアの物体の内での水銀の結合とともに、蒸気と水の昇華にほかならないことを、確実に知らねばならない。しかし哲学者たちはこれまで書物の中で、硫黄の不純な水は硫黄だけから生じ、また、その灰の水と水銀と硫黄なしには、いかなる硫黄も生じないと示してきた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 387
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-49-001
  section: 49
  paragraph: 1
  source_en: Belus saith:- O all ye Philosophers, ye have not dealt sparingly concerning composition and
    contact, but composition, contact, and congelation are one thing! Take, therefore, a part From the
    one composition and a part out of ferment of gold, and on these impose pure water of sulphur. This,
    then, is the potent (or revealed) arcanum which tinges every body.
  translation_ja: ベルスは言う。哲学者たちよ、皆、あなたがたは配合と接触について惜しみなく論じた。しかし配合、接触、凝結は一つのことである。それゆえ、一つの配合物から一部、金の発酵種から一部を取り、その上に硫黄の純粋な水を加えなさい。これこそ、あらゆる物体を染める、力ある〔または明かされた〕秘義である。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 390
  notes:
  - 公開翻刻の cornposition は composition として校整した。底本の語と文脈を確認した明白な転記誤りの修正。転記段階の読みも内蔵データに保持する。
  source_language: en
  target_language: ja
  kind: body
  transcription_reading: Belus saith:- O all ye Philosophers, ye have not dealt sparingly concerning composition
    and contact, but cornposition, contact, and congelation are one thing! Take, therefore, a part From
    the one composition and a part out of ferment of gold, and on these impose pure water of sulphur.
    This, then, is the potent (or revealed) arcanum which tinges every body.
- id: turba-49-002
  section: 49
  paragraph: 2
  source_en: Pythagoras answereth:- O Belus, why hast thou called it a potent arcanum, yet hast not shown
    its work!
  translation_ja: ピュタゴラスは答える。ベルスよ、なぜそれを力ある秘義と呼びながら、その作業を示さなかったのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 392
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-49-003
  section: 49
  paragraph: 3
  source_en: And he:- In our books, O Master, we have found the same which thou hast received from the
    ancients!
  translation_ja: 彼は言う。師よ、われわれは書物の内に、あなたが古人たちから受け取ったものと同じものを見いだしました。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 393
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-49-004
  section: 49
  paragraph: 4
  source_en: And Pythagoras:- Therefore have I assembled you together, that you might remove any obscurities
    which are in any books.
  translation_ja: ピュタゴラスは言う。それゆえ私は、どの書物にある曖昧さも取り除けるよう、あなたがたを集めたのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 395
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-49-005
  section: 49
  paragraph: 5
  source_en: And he:- Willingly, O Master! It is to be noted that pure water which is from sulphur is
    not composed of sulphur alone, but is composed of several things, for the one sulphur is made out
    of several sulphurs. How, therefore, O Master, shall I compose these things that they may become one!
  translation_ja: 彼は言う。師よ、喜んでそうしましょう。注意すべきことは、硫黄から来る純粋な水は、硫黄だけで構成されるのではなく、いくつかのものから構成されるということです。一つの硫黄は、いくつかの硫黄から作られるからです。では師よ、これらが一つとなるよう、どのように配合すればよいのでしょうか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 397
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-49-006
  section: 49
  paragraph: 6
  source_en: And he:- Mix, O Belus, that which strives with the fire with that which does not strive,
    for things which are conjoined in a fire suitable to the same contend, because the warm venoms of
    the physician are cooked in a gentle, incomburent fire! Surely ye perceive what the Philosophers have
    stated concerning decoction, that a little sulphur burns many strong things, and the humour which
    remains is called humid pitch, balsam of gum, and other like things.
  translation_ja: 彼は言う。ベルスよ、火と争うものと争わないものとを混ぜなさい。医師の暖かい毒が、焼き尽くさない穏やかな火で煮られるため、適切な火の中で結び合わされるものたちは争うからである。あなたがたは確かに、哲学者たちが煮詰めについて、小量の硫黄が多くの強いものを焼き、残る液は湿った瀝青、樹脂のバルサム、その他それに似たものと呼ばれる、と述べたことを理解しているはずである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 398
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-49-007
  section: 49
  paragraph: 7
  source_en: Therefore our Philosophers are made like to the physicians, notwithstanding that the tests
    of the physicians are more intense than those of the Philosophers.
  translation_ja: それゆえ、医師たちの試験は哲学者たちのものより厳しいにもかかわらず、われわれの哲学者たちは医師たちに似た者となる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 399
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-49-008
  section: 49
  paragraph: 8
  source_en: The Turba answereth:- I wish, O Belus, that you would also shew the disposition of this potent
    arcanum!
  translation_ja: 集会の人々は答える。ベルスよ、あなたには、この力ある秘義の配剤も示してもらいたい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 400
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-49-009
  section: 49
  paragraph: 9
  source_en: And he:- I proclaim to future generations that this arcanum proceeds from two compositions,
    that is to say, sulphur and magnesia. But after it is reduced and conjoined into one, the Philosophers
    have called it water, spume of Boletus (i.e., a species of fungus), and the thickness of gold.
  translation_ja: 彼は言う。私は後の世代に宣言する。この秘義は二つの配合物、すなわち硫黄とマグネシアから生じる。しかし還元されて一つに結びつくと、哲学者たちはそれを水、ボレトゥス〔すなわち菌類の一種〕の泡、金の厚みと呼んだ。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 401
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-49-010
  section: 49
  paragraph: 10
  source_en: When, however, it has been reduced into quicksilver, they call it sulphur of water; sulphur
    also, when it contains sulphur, they term a fiery venom, because it is a potent (or open) arcanum
    which ascends from those things ye know.
  translation_ja: しかし水銀へ還元されると、彼らはそれを水の硫黄と呼ぶ。また硫黄が硫黄を含むとき、それを火性の毒と呼ぶ。あなたがたの知るものから昇る、力ある〔または開かれた〕秘義だからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 402
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-50-001
  section: 50
  paragraph: 1
  source_en: Pandolphus saith:- If, O Belus, thou dost describe the sublimation of sulphur for future
    generations, thou wilt accomplish an excellent thing!
  translation_ja: パンドルフスは言う。ベルスよ、後の世代のため硫黄の昇華を説明するなら、あなたは優れたことを成し遂げるであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 405
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-50-002
  section: 50
  paragraph: 2
  source_en: And the Turba:- Do thou show it forth, therefore, O Pandolphus!
  translation_ja: 集会の人々は言う。ではパンドルフスよ、あなたが明らかにしてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 407
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-50-003
  section: 50
  paragraph: 3
  source_en: And he:- The philosophers have ordered that quicksilver should be taken out of Cambar, and
    albeit they spoke truly, yet in these words there is a little ambiguity, the obscurity of which I
    will remove. See then that the quicksilver is sublimed in tabernacles, and extract the same from Cambar,
    but there is another Cambar in sulphur which Belus hath demonstrated to you, for out of sulphur mixed
    with sulphur, many works proceed.
  translation_ja: 彼は言う。哲学者たちは、水銀をカンバルから取り出すよう命じた。彼らは真実を語ったが、この言葉には少し曖昧なところがある。その不明瞭さを私が取り除こう。では、水銀が小室の内で昇華されるようにし、これをカンバルから取り出しなさい。しかし、ベルスが示した硫黄の内には、もう一つのカンバルがある。硫黄と混ざった硫黄から、多くの作業が生じるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 408
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-50-004
  section: 50
  paragraph: 4
  source_en: When the same has been sublimed, there proceeds from the Cambar that quicksilver which is
    called Ethelia, Orpiment, Zendrio, or Sanderich, Ebsemich, Magnesia, Kuhul, or Chuhul, and many other
    names. Concerning this, philosophers have said that, being ruled by its regimen (for ten is the perfection
    of all things), its white nature appears, nor is there any shadow therein. Then the envious have called
    it lead from Ebmich, Magnesia, Marteck, White Copper.
  translation_ja: それが昇華されると、カンバルから、エテリア、石黄、ゼンドリオまたはサンデリク、エブセミク、マグネシア、クフルまたはクフル〔Chuhul〕、その他多くの名で呼ばれる、あの水銀が生じる。これについて哲学者たちは、定められた処理で扱われると、白い自然が現れ、その内には影が全くない、と言った。十は万物の完成だからである。そのとき惜しむ者たちは、それをエブミクからの鉛、マグネシア、マルテク、白い銅と呼んだ。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 409
  notes:
  - Kuhul と Chuhul は英文では異綴りとして併記される。日本語では同様の音写になるため、後者に原綴りを添えた。
  source_language: en
  target_language: ja
  kind: body
- id: turba-50-005
  section: 50
  paragraph: 5
  source_en: For, when truly whitened, it is devoid of shadow and blackness, it has left its thickened
    ponderous bodies, and therewith a clean humid spirit has ascended, which spirit is tincture. Accordingly,
    the wise have said that copper has a soul and a body. Now, its soul is spirit, and its body is thick.
    Therefore, it behoves you to destroy the thick body until ye extract a tingeing spirit from the same.
  translation_ja: というのも、真に白くされると影も黒さもなく、厚く重い物体を離れ、それとともに清浄で湿った霊が昇るからである。その霊は着色剤である。それゆえ賢者たちは、銅には魂と身体があると言った。さて、その魂は霊であり、その身体は厚い。したがって、その厚い身体を破壊し、そこから染める霊を取り出すべきである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 410
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-50-006
  section: 50
  paragraph: 6
  source_en: Mix, also, the spirit extracted therefrom with light sulphur until you, investigators, find
    your design accomplished.
  translation_ja: また、そこから取り出した霊を軽い硫黄と混ぜ、探求者たちよ、あなたがたの計画が達成されたと認めるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 411
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-51-001
  section: 51
  paragraph: 1
  source_en: Horfolcos saith:- Thou hast narrated nothing, O Pandolphus, save the last regimen of this
    body! Thou hast, therefore, composed an ambiguous description for readers. But if its regimen were
    commenced from the beginning, you would destroy this obscurity.
  translation_ja: ホルフォルコスは言う。パンドルフスよ、あなたはこの物体の最後の処理以外、何も語らなかった。それゆえ読者のために、曖昧な説明を作ってしまった。しかし、その処理を初めから始めていれば、この不明瞭さを取り除けたであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 414
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-51-002
  section: 51
  paragraph: 2
  source_en: Saith the Turba:- Speak, therefore, concerning this to posterity, so far as it may please
    you.
  translation_ja: 集会の人々は言う。では、望むだけ、後世の人々にこれについて語ってほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 416
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-51-003
  section: 51
  paragraph: 3
  source_en: And he:- It behoves you, investigators of this Art, first to burn copper in a gentle fire,
    like that required in the hatching of eggs.
  translation_ja: 彼は言う。この術を探究する者たちよ、まず卵を孵すのに必要なような穏やかな火で、銅を焼くべきである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 417
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-51-004
  section: 51
  paragraph: 4
  source_en: 'For it behoves you to burn it with its humidity lest its spirit be burnt, and let the vessel
    be closed on all sides, so that its colour [heat] may be increased, the body of copper be destroyed,
    and its tingeing spirit be extracted, concerning which the envious have said: Take quicksilver out
    of the Flower of Copper, which also they have called the water of our copper, a fiery venom, and a
    substance extracted from all things, which further they have termed Ethelia, extracted out of many
    things.'
  translation_ja: その霊が焼かれぬよう、自らの湿りとともに焼くべきだからである。そして、その色〔熱〕が増し、銅の物体が破壊され、染める霊が取り出されるよう、容器を四方から閉じなさい。この霊について惜しむ者たちは、銅の花から水銀を取り出せと言った。またこれを、われわれの銅の水、火性の毒、万物から取り出された実体と呼び、さらに、多くのものから取り出されたエテリアとも呼んだ。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 418
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-51-005
  section: 51
  paragraph: 5
  source_en: Again, some have said that when all things become one, bodies are made not-bodies, but not-bodies
    bodies. And know, all ye investigators of this Art, that every body is dissolved with the spirit with
    which it is mixed, with which without doubt it becomes a similar spiritual thing, and that every spirit
    which has a tingeing colour of spirits, and is constant against fire, is altered and coloured by bodies.
  translation_ja: またある者たちは、万物が一つとなると、物体は物体でないものとなり、物体でないものは物体となると言った。そしてこの術を探究する皆よ、知りなさい。すべての物体は、混ぜられた霊によって溶かされ、それとともに、疑いなく似た霊的なものとなる。また、諸霊の染める色を持ち、火に対して不変であるすべての霊は、物体によって変えられ、着色される。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 419
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-51-006
  section: 51
  paragraph: 6
  source_en: Blessed then be the name of Him who hath inspired the Wise with the idea of turning a body
    into a spirit having strength and colour, unalterable and incorruptible, so that what formerly was
    volatile sulphur is now made sulphur not-volatile, and incombustible! Know, also, all ye sons of learning,
    that he who is able to make your fugitive spirit red by the body mixed with it, and then from that
    body and that spirit can extract the tenuous nature hidden in the belly thereof, by a most subtle
    regimen, tinges every body, if only he is patient in spite of the tedium of extracting.
  translation_ja: それゆえ、物体を、力と色を備え、変化せず損なわれない霊へ変えるという考えを賢者たちに授けた方の名は、祝福されよ。こうして、以前は揮発する硫黄だったものが、今や揮発せず、燃えない硫黄とされる。学びの子らよ、皆、さらに知りなさい。あなたがたの逃げやすい霊を、それと混ぜられた物体によって赤くし、それから、その物体と霊から、その腹に隠れた微細な自然を、極めて精妙な処理によって取り出せる者は、あらゆる物体を染める。ただし、取り出すことの退屈さにもかかわらず、忍耐するならばである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 420
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-51-007
  section: 51
  paragraph: 7
  source_en: 'Wherefore the envious have said: Know that out of copper, after it is humectated by the
    moisture thereof, is pounded in its water, and is cooked in sulphur, if ye extract a body having Ethelia,
    ye will find that which is suitable as a tincture for anything. Therefore the envious have said: Things
    that are diligently pounded in the fire, with sublimation of the Ethelia, become fixed tinctures.'
  translation_ja: それゆえ惜しむ者たちは言った。知れ。銅が自らの湿りで湿らされ、その水の中で砕かれ、硫黄の内で煮られた後、そこからエテリアを持つ物体を取り出すなら、何にでも着色剤として適するものを見いだすであろう、と。したがって惜しむ者たちは、エテリアの昇華とともに、火の中で丹念に砕かれたものは、固定した着色剤となると言った。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 421
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-51-008
  section: 51
  paragraph: 8
  source_en: For whatsoever words ye find in any man's book signify quicksilver, which we call water of
    sulphur, which also we sometimes say is lead and copper and copulated coin.
  translation_ja: 誰の書物であれ、あなたがたが見いだす言葉はすべて、水銀を意味するからである。われわれはそれを硫黄の水と呼び、ときには鉛、銅、結び合わされた貨幣とも言う。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 422
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-52-001
  section: 52
  paragraph: 1
  source_en: Ixumdrus saith:- You will have treated most excellently, O Horfolcus, concerning the regimen
    of copper and the humid spirit, provided you proceed therewith.
  translation_ja: イクスムドルスは言う。ホルフォルクスよ、そのまま続けるなら、あなたは銅と湿った霊の処理について、極めて見事に論じたことになるであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 425
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-52-002
  section: 52
  paragraph: 2
  source_en: And he:- Perfect, therefore, what I have omitted, O Ixumdrus!
  translation_ja: 彼は言う。ではイクスムドルスよ、私が省いたところを完成させてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 427
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-52-003
  section: 52
  paragraph: 3
  source_en: Ixumdrus saith:- You must know that this Ethelia which you have previously mentioned and
    notified, which also the envious have called by many names, doth whiten, and tinge when it is whitened;
    then truly the Philosophers have called it the Flower of Gold, because it is a certain natural thing.
    Do you not remember what the Philosophers have said, that before it arrives at this terminus, copper
    does not tinge? But when it is tinged it tinges, because quicksilver tinges when it is combined with
    its tincture.
  translation_ja: イクスムドルスは言う。知るべきである。あなたが以前に言及し、知らせたこのエテリア、惜しむ者たちも多くの名で呼んだこのものは、白くし、白くされると染める。そのとき哲学者たちは、まことにこれを金の花と呼んだ。ある自然のものだからである。哲学者たちが、この終点へ到達する前には銅は染めないと言ったことを、覚えていないのか。しかし染められると染める。水銀は自らの着色剤と結びつくと染めるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 428
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-52-004
  section: 52
  paragraph: 4
  source_en: But when it is mixed with those ten things which the Philosophers have denominated fermented
    urines, then have they called all these things Multiplication. But some have termed their mixed bodies
    Corsufle and Gum of Gold. Therefore, those names which are found in the books of the Philosophers,
    and are thought superfluous and vain, are true and yet are fictitious, because they are one thing,
    one opinion, and one way.
  translation_ja: しかし、哲学者たちが発酵した尿と名づけたあの十のものと混ぜられると、彼らはこれらすべてを〈増殖〉と呼んだ。一方、ある者たちは、その混合された物体をコルスフレ、金の樹脂と呼んだ。したがって、哲学者たちの書物に見いだされ、余計で無駄だと思われるそれらの名は、真実でありながら仮の名である。それらは一つのもの、一つの考え、一つの道だからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 429
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-52-005
  section: 52
  paragraph: 5
  source_en: This is the quicksilver which is indeed extracted from all things, out of which all things
    are produced, which also is pure water that destroys the shade of copper.
  translation_ja: これこそ、実際に万物から取り出され、そこから万物が生じる水銀であり、また銅の影を滅ぼす純粋な水である。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 430
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-52-006
  section: 52
  paragraph: 6
  source_en: And know ye that this quicksilver, when it is whitened, becomes a sulphur which contains
    sulphur, and is a venom that has a brilliance like marble; this the envious call Ethelia, orpiment
    and sandarac, out of which a tincture and pure spirit ascends with a mild fire, and the whole pure
    flower is sublimated, which flower becomes wholly quicksilver. It is, therefore, a most great arcanum
    which the Philosophers have thus described, because sulphur alone whitens copper.
  translation_ja: そして知りなさい。この水銀は白くされると、硫黄を含む硫黄となり、大理石のような輝きを持つ毒となる。惜しむ者たちはこれをエテリア、石黄、サンダラクと呼ぶ。そこから穏やかな火によって着色剤と純粋な霊が昇り、純粋な花の全体が昇華され、その花はすっかり水銀となる。したがって、哲学者たちがこう説明したものは、最も偉大な秘義である。硫黄だけが銅を白くするからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 431
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-52-007
  section: 52
  paragraph: 7
  source_en: Ye, O investigators of this Art, must know that the said sulphur cannot whiten copper until
    it is whitened in the work! And know ye also that it is the habit of this sulphur to escape. When,
    therefore, it flees from its own thick bodies, and is sublimated as a vapour, then it behoves you
    to retain it otherwise with quicksilver of its own kind, lest it vanish altogether. Wherefore the
    Philosophers have said, that sulphurs are contained by sulphurs.
  translation_ja: この術を探究するあなたがたは、その硫黄も、作業の内で白くされるまでは銅を白くできないと知らねばならない。また、逃れることがこの硫黄の性向であるとも知りなさい。したがって、それが自らの厚い物体から逃れ、蒸気として昇華されるときは、すっかり消え去らないよう、別の仕方で、同種の水銀によって引き止めるべきである。それゆえ哲学者たちは、硫黄は硫黄によって包まれると言った。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 432
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-52-008
  section: 52
  paragraph: 8
  source_en: Know, further, that sulphurs tinge, and then are they certain to escape unless they are united
    to quicksilver of its own kind. Do not, therefore, think that because it tinges and afterwards escapes,
    it is the coin of the Vulgar, for what the Philosophers are seeking is the coin of the Philosophers,
    which, unless it be mixed with white or red, which is quicksilver of its own kind, would doubtless
    escape.
  translation_ja: さらに知りなさい。硫黄は染めるが、その後は、同種の水銀と結びつけられなければ、必ず逃れる。それゆえ、それが染めてから逃れるという理由で、俗人の貨幣だと思ってはならない。哲学者たちが求めているのは哲学者たちの貨幣であり、白または赤、すなわち同種の水銀と混ぜられなければ、疑いなく逃れるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 433
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-52-009
  section: 52
  paragraph: 9
  source_en: I direct you, therefore, to mix quicksilver with quicksilver (of its kind) until together
    they become one clean water composed out of two. This is, therefore, the great arcanum, the confection
    of which is with its own gum; it is cooked with flowers in a gentle fire and with earth; it is made
    red with mucra and with vinegar, salt, and nitre, and with mutal is turned into rubigo, or by any
    of the select tingeing agents existing in our coin.
  translation_ja: それゆえ私は、水銀を〔同種の〕水銀と混ぜ、両者が一緒に、二つから構成された一つの清い水となるまで続けるよう指示する。したがって、これが偉大な秘義であり、その調製はそれ自身の樹脂によって行われる。それは花とともに穏やかな火で、また土とともに煮られ、ムクラ、酢、塩、硝石で赤くされ、ムタルによってルビゴへ変えられる。あるいは、われわれの貨幣にある選ばれた着色剤のいずれによってもそうされる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 434
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-53-001
  section: 53
  paragraph: 1
  source_en: Exumenus saith:- The envious have laid waste the whole Art with the multiplicity of names,
    but the entire work must be the Art of the Coin. For the Philosophers have ordered the doctors of
    this art to make coin-like gold, which also the same Philosophers have called by all manner of names.
  translation_ja: エクスメヌスは言う。惜しむ者たちは多くの名によって術全体を荒廃させた。しかし作業全体は貨幣の術でなければならない。哲学者たちは、この術の師たちに、貨幣のような金を作るよう命じたからであり、その同じ哲学者たちが、それをあらゆる種類の名で呼んだのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 437
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-53-002
  section: 53
  paragraph: 2
  source_en: The Turba answereth:- Inform, therefore, posterity, O Exumenus, concerning a few of these
    names, that they may take warning!
  translation_ja: 集会の人々は答える。それではエクスメヌスよ、後世の人々が警戒できるよう、それらの名のいくつかを教えてほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 439
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-53-003
  section: 53
  paragraph: 3
  source_en: And he:- They have named it salting, sublimating, washing, and pounding Ethelias, whitening
    in the fire, frequently cooking vapour and coagulating, turning into rubigo, the confection of Ethel,
    the art of the water of sulphur and coagula. By all these names is that operation called which has
    pounded and whitened copper. And know ye, that quicksilver is white to the sight, but when it is possessed
    by the smoke of sulphur, it reddens and becomes Cambar.
  translation_ja: 彼は言う。彼らはそれを、塩を加えること、エテリアを昇華させ、洗い、砕くこと、火の中で白くすること、蒸気を幾度も煮て凝固させること、ルビゴへ変えること、エテルの調製、硫黄の水と凝固物の術、と名づけた。銅を砕き、白くした操作は、これらすべての名で呼ばれる。そして知りなさい。水銀は見た目には白いが、硫黄の煙に捉えられると、赤くなってカンバルとなる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 440
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-53-004
  section: 53
  paragraph: 4
  source_en: Therefore, when quicksilver is cooked with its confections it is turned into red, and hence
    the Philosopher saith that the nature of lead is swiftly converted. Do you not see that the Philosophers
    have spoken without envy! Hence we deal in many ways with pounding and reiteration, that ye may extract
    the spirits existing in the vessel, which the fire did not cease to burn continuously.
  translation_ja: したがって水銀がその配合材料とともに煮られると、赤へ変わる。それゆえ哲学者は、鉛の自然は速やかに変えられると言う。哲学者たちが惜しまず語ったことが分からないか。それゆえわれわれは、容器に存在し、火が絶えず焼くことをやめなかった霊をあなたがたが取り出せるよう、多くの仕方で粉砕と反復を扱うのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 441
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-53-005
  section: 53
  paragraph: 5
  source_en: But the water placed with those things prevents the fire from burning, and it befalls those
    things that the more they are possessed by the flame of fire, the more they are hidden in the depths
    of the water, lest they should be injured by the heat of the fire; but the water receives them in
    its belly and repels the flame of fire from them.
  translation_ja: しかし、それらとともに置かれた水は、火が焼くことを防ぐ。そしてそれらは、火の炎に捉えられれば捉えられるほど、火の熱で傷つかないよう、いっそう水の深みに隠れることになる。水はそれらを腹の内に受け入れ、火の炎を遠ざけるのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 442
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-53-006
  section: 53
  paragraph: 6
  source_en: 'The Turba answereth:- Unless ye make bodies not-bodies ye achieve nothing. But concerning
    the sublimation of water the Philosophers have treated not a little. And know that unless ye diligently
    pound the thing in the fire, the Ethelia does not ascend, but when that does not ascend ye achieve
    nothing. When, however, it ascends it is an instrument for the intended tincture with which ye tinge,
    and concerning this Ethelia Hermes saith: Sift the things which ye know; but another: Liquefy the
    things.'
  translation_ja: 集会の人々は答える。物体を物体でないものにしなければ、何も成し遂げられない。しかし水の昇華について、哲学者たちは少なからず論じてきた。そして、そのものを火の中で丹念に砕かなければ、エテリアは昇らず、それが昇らなければ何も成し遂げられないと知りなさい。しかし昇れば、それは、あなたがたが染めるために意図した着色の道具となる。このエテリアについて、ヘルメスは「知っているものを篩にかけよ」と言い、別の者は「それらを液化せよ」と言う。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 443
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-53-007
  section: 53
  paragraph: 7
  source_en: 'Therefore, Arras saith: Unless ye pound the thing diligently in the fire, Ethelia does not
    ascend. The Master hath put forth a view which I shall now explain to the reasoners. Know ye that
    a very great wind of the south, when it is stirred up, sublimates clouds and elevates the vapours
    of the sea.'
  translation_ja: それゆえアラスは言う。そのものを火の中で丹念に砕かなければ、エテリアは昇らない。師は一つの見解を提示した。私は今、それを理性的に考える者たちに説明しよう。知りなさい。極めて大きな南風は、吹き起こると、雲を昇華させ、海の蒸気を高める。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 444
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-53-008
  section: 53
  paragraph: 8
  source_en: The Turba answereth:- Thou hast dealt obscurely.
  translation_ja: 集会の人々は答える。あなたの扱いは不明瞭であった。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 445
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-53-009
  section: 53
  paragraph: 9
  source_en: And he:- I will explain the testa, and the vessel wherein is incombustible sulphur. But I
    order you to congeal fluxible quicksilver out of many things, that two may be made three, and four
    one, and two one.
  translation_ja: 彼は言う。私はテスタと、その内に不燃性の硫黄がある容器を説明しよう。しかし私は、多くのものから流動する水銀を凝結させ、二つが三つとなり、四つが一つとなり、二つが一つとなるようにせよと命じる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 447
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-54-001
  section: 54
  paragraph: 1
  source_en: Anaxagoras saith:- Take the volatile burnt thing which lacks a body, and incorporate it.
    Then take the ponderous thing, having smoke, and thirsting to imbibe.
  translation_ja: アナクサゴラスは言う。物体を欠く、揮発する焼かれたものを取り、物体化しなさい。それから、煙を持ち、吸い込むことを渇望する、重いものを取りなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 451
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-54-002
  section: 54
  paragraph: 2
  source_en: The Turba answereth:- Explain, O Anaxagoras, what is this obscurity which you expound, and
    beware of being envious!
  translation_ja: 集会の人々は答える。アナクサゴラスよ、あなたが説くこの曖昧なものは何か、説明しなさい。そして惜しむ者とならぬよう気をつけなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 452
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-54-003
  section: 54
  paragraph: 3
  source_en: And he:- I testify to you that this volatile burnt thing, and this other which thirsts, are
    Ethelia, which has been conjoined with sulphur. Therefore, place these in a glass vessel over the
    fire, and cook until the whole becomes Cambar. Then God will accomplish the arcanum ye seek. But I
    direct you to cook continuously, and not to grow tired of repeating the process.
  translation_ja: 彼は言う。私はあなたがたに証言する。この揮発する焼かれたものと、渇望するもう一つのものは、硫黄と結びついたエテリアである。それゆえこれらをガラス容器に入れて火にかけ、全体がカンバルとなるまで煮なさい。そうすれば神は、求める秘義を成就するであろう。しかし私は、絶えず煮て、その過程の反復に倦まぬよう指示する。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 453
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-54-004
  section: 54
  paragraph: 4
  source_en: 'And know ye that the perfection of this work is the confection of water of sulphur with
    tabula; finally, it is cooked until it becomes Rubigo, for all the Philosophers have said: He who
    is able to turn Rubigo into golden venom has already achieved the desired work, but otherwise his
    labour is vain.'
  translation_ja: そして知りなさい。この作業の完成は、硫黄の水とタブラの調製である。最後に、ルビゴとなるまで煮られる。哲学者たちは皆、ルビゴを黄金の毒へ変えられる者は、すでに望んだ作業を成し遂げたが、そうでなければ、その労苦は無駄であると言ったからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 454
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-55-001
  section: 55
  paragraph: 1
  source_en: Zenon saith:- Pythagoras hath treated concerning the water, which the envious have called
    by all names. Finally, at the end of his book he has treated of the ferment of gold, ordaining that
    thereon should be imposed clean water of sulphur, and a small quantity of its gum. I am astonished,
    O all ye Turba, how the envious have in this work discoursed of the perfection rather than the commencement
    of the same!
  translation_ja: ゼノンは言う。ピュタゴラスは、惜しむ者たちがあらゆる名で呼んだ水について論じた。最後に、書物の末尾で金の発酵種について論じ、その上に清い硫黄の水と、その樹脂の少量を加えるよう定めた。集会の皆よ、私は驚く。惜しむ者たちは、この作業の始まりよりも完成について、何と多く語ってきたことか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 457
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-55-002
  section: 55
  paragraph: 2
  source_en: The Turba answereth:- Why, therefore, have you left it to putrefy?
  translation_ja: 集会の人々は答える。では、なぜ腐敗するに任せておいたのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 459
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-55-003
  section: 55
  paragraph: 3
  source_en: And he:- Thou hast spoken truly; putrefaction does not take place without the dry and the
    humid. But the vulgar putrefy with the humid. Thus the humid is merely coagulated with the dry. But
    out of both is the beginning of the work. Notwithstanding, the envious have divided this work into
    three parts, asserting that one quickly flees, but the other is fixed and immovable.
  translation_ja: 彼は言う。あなたは真実を語った。乾いたものと湿ったものなしには、腐敗は起こらない。しかし俗人たちは湿ったものによって腐敗させる。このように湿ったものは、乾いたものによって凝固させられるだけである。だが作業の始まりは両者から成る。それにもかかわらず、惜しむ者たちはこの作業を三つに分け、一方は速やかに逃れ、他方は固定され動かないと断言した。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 460
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-56-001
  section: 56
  paragraph: 1
  source_en: Constans saith:- What have you to do with the treatises of the envious, for it is necessary
    that this work should deal with four things?
  translation_ja: コンスタンスは言う。この作業は四つのものを扱う必要があるのに、あなたがたは惜しむ者たちの論書に何の用があるのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 463
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-56-002
  section: 56
  paragraph: 2
  source_en: They answer:- Demonstrate, therefore, what are those four?
  translation_ja: 人々は答える。では、その四つが何かを示してほしい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 465
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-56-003
  section: 56
  paragraph: 3
  source_en: And he:- Earth, water, air, and fire. Ye have then those four elements without which nothing
    is ever generated, nor is anything absolved in the Art. Mix, therefore, the dry with the humid, which
    are earth and water, and cook in the fire and in the air, whence the spirit and the soul are dessicated.
  translation_ja: 彼は言う。土、水、空気、火である。こうしてあなたがたは、それなしには何も生まれず、術の内で何も完成しない四元素を持つ。したがって、乾いたものと湿ったもの、すなわち土と水を混ぜ、火と空気の内で煮なさい。それによって霊と魂は乾かされる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 466
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-56-004
  section: 56
  paragraph: 4
  source_en: And know ye that the tenuous tingeing agent takes its power out of the tenuous part of the
    earth, out of the tenuous part of the fire and of the air, while out of the tenuous part of the water,
    a tenuous spirit has been dessicated. This, therefore, is the process of our work, namely, that everything
    may be turned into earth when the tenuous parts of these things are extracted, because a body is then
    composed which is a kind of atmospheric thing, and thereafter tinges the imposed body of coins.
  translation_ja: そして知りなさい。微細な染める作用者は、土の微細な部分、火と空気の微細な部分から力を取り、一方、水の微細な部分からは、微細な霊が乾かされる。したがって、これがわれわれの作業の過程である。すなわち、これらの微細な部分が取り出されたとき、すべてが土へ変えられることである。そのとき、ある種の大気的なものである物体が構成され、その後、加えられた貨幣の物体を染めるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 467
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-56-005
  section: 56
  paragraph: 5
  source_en: Beware, however, O all ye investigators of this art, lest ye multiply things, for the envious
    have multiplied and destroyed for you! They have also described various regimens that they might deceive;
    they have further called it (or have likened it to) the humid with all the humid, and the dry with
    all the dry, by the name of every stone and metal, gall of animals of the sea, the winged things of
    heaven and reptiles of the earth. But do ye who would tinge observe that bodies are tinged with bodies.
  translation_ja: しかし、この術を探究する皆よ、ものを増やしすぎないよう気をつけなさい。惜しむ者たちは増やして、あなたがたのために台なしにしたからである。彼らは欺くため、さまざまな処理法も説明した。さらに、あらゆる石と金属、海の動物の胆汁、天の翼あるもの、地上の這うものの名で、それを、すべての湿ったものを伴う湿ったもの、すべての乾いたものを伴う乾いたものと呼んだ〔またはそれらにたとえた〕。しかし染めようとするあなたがたは、物体が物体によって染められることに注意しなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 468
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-56-006
  section: 56
  paragraph: 6
  source_en: For I say to you what the Philosopher said briefly and truly at the beginning of his book.
    In the art of gold is the quicksilver from Cambar, and in coins is the quicksilver from the Male.
    In nothing, however, look beyond this, since the two quicksilvers are also one.
  translation_ja: というのも私は、哲学者が書物の冒頭で簡潔かつ真実に述べたことを告げるからである。金の術の内には、カンバルからの水銀があり、貨幣の内には、雄からの水銀がある。しかし、どの点においても、これを超えて求めてはならない。二つの水銀もまた一つだからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 469
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-001
  section: 57
  paragraph: 1
  source_en: Acratus saith:- I signify to posterity that I make philosophy near to the Sun and Moon. He,
    therefore, that will attain to the truth let him take the moisture of the Sun and the Spume of the
    Moon.
  translation_ja: アクラトゥスは言う。私は後世の人々に、太陽と月の近くで哲学を行うと告げる。したがって真実に達したい者は、太陽の湿りと月の泡を取りなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 472
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-002
  section: 57
  paragraph: 2
  source_en: The Turba answereth:- Why are you made an adversary to your brethren?
  translation_ja: 集会の人々は答える。なぜ兄弟たちに敵対する者となったのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 474
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-003
  section: 57
  paragraph: 3
  source_en: And he:- I have spoken nothing but the truth.
  translation_ja: 彼は言う。私は真実以外に何も語っていない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 476
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-004
  section: 57
  paragraph: 4
  source_en: But they:- Take what the Turba hath taken.
  translation_ja: しかし人々は言う。集会が取ったものを取りなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 478
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-005
  section: 57
  paragraph: 5
  source_en: And he:- I was so intending, yet, if you are willing, I direct posterity to take a part of
    the coins which the Philosophers have ordered, which also Hermes has adapted to the true tingeing,
    and a part of the copper of the Philosophers, to mix the same with the coins, and place all the four
    bodies in the vessel, the mouth of which must be carefully closed, lest the water escape. Cooking
    must proceed for seven days, when the copper, already pounded with the coins, is found turned into
    water.
  translation_ja: 彼は言う。私もそうするつもりであった。しかし、あなたがたがよければ、後世の人々にこう指示する。哲学者たちが定め、ヘルメスも真の着色に適用した貨幣を一部、哲学者たちの銅を一部取り、銅を貨幣と混ぜ、四つの物体すべてを容器へ入れ、水が逃れないよう口を注意深く閉じなさい。七日間煮ることを続けるべきである。そのとき、すでに貨幣とともに砕かれた銅は、水へ変わっていることが分かる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 479
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-006
  section: 57
  paragraph: 6
  source_en: Let both be again slowly cooked, and fear nothing. Then let the vessel be opened, and a blackness
    will appear above. Repeat the process, cook continually until the blackness of Kuhul, which is from
    the blackness of coins, be consumed. For when that is consumed a precious whiteness will appear on
    them; finally, being returned to their place, they are cooked until the whole is dried and is turned
    into stone.
  translation_ja: 両者を再びゆっくり煮なさい。そして何も恐れてはならない。それから容器を開けば、上に黒さが現れる。この工程を繰り返し、貨幣の黒さから生じるクフルの黒さが消費されるまで、絶えず煮なさい。それが消費されると、それらに貴い白さが現れるからである。最後に元の場所へ戻し、全体が乾いて石へ変わるまで煮なさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 480
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-007
  section: 57
  paragraph: 7
  source_en: Also repeatedly and continuously cook that stone born of copper and coins with a fire sharper
    than the former, until the stone is destroyed, broken up, and turned into cinder, which is a precious
    cinder. Alas, O ye sons of the Doctrine, how precious is that which is produced from it! Mixing, therefore,
    the cinder with water, cook again, until that cinder liquefy therewith, and then cook and imbue with
    permanent water, until the composition becomes sweet and mild and red. Imbue until it becomes humid.
  translation_ja: また、銅と貨幣から生まれたその石を、以前より鋭い火で、幾度も絶えず煮なさい。石が壊れ、砕け、貴い焼滓へ変わるまで続けなさい。ああ、教えの子らよ、そこから生じるものは何と貴いことか。したがって焼滓を水と混ぜ、焼滓が水とともに液化するまで再び煮なさい。それから恒久の水で煮て浸し、配合物が甘く、穏やかで、赤くなるまで続けなさい。湿るまで浸しなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 481
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-008
  section: 57
  paragraph: 8
  source_en: Cook in a still hotter fire, and carefully close the mouth of the vessel, for by this regimen
    fugitive bodies become not-fugitive, spirits are turned into bodies, bodies into spirits, and both
    are connected together. Then are spirits made bodies having a tingeing and germinating soul.
  translation_ja: さらに熱い火で煮て、容器の口を注意深く閉じなさい。この処理によって、逃げる物体は逃げないものとなり、霊は物体に、物体は霊に変わり、両者が結びつくからである。そのとき霊は、染め、芽吹く魂を持った物体となる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 482
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-009
  section: 57
  paragraph: 9
  source_en: The Turba answereth:- Now hast thou notified to posterity that Rubigo attaches itself to
    copper after the blackness is washed off with permanent water. Then it is congealed and becomes a
    body of Magnesia. Finally, it is cooked until the whole body is broken up. Afterwards the volatile
    is turned into a cinder and becomes copper without its shadow. Attrition also truly takes place.
  translation_ja: 集会の人々は答える。今あなたは後世の人々に、恒久の水で黒さが洗い落とされた後、ルビゴが銅に付着することを知らせた。それからそれは凝結し、マグネシアの物体となる。最後に、物体全体が砕けるまで煮られる。その後、揮発するものは焼滓へ変えられ、影のない銅となる。摩砕もまた、真に起こる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 483
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-010
  section: 57
  paragraph: 10
  source_en: Concerning, therefore, the work of the Philosophers, what hast thou delivered to posterity,
    seeing that thou hast by no means called things by their proper names!
  translation_ja: したがって、哲学者たちの作業について、あなたは後世の人々に何を伝えたのか。ものをその正しい名で一向に呼んでいないのだから。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 484
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-011
  section: 57
  paragraph: 11
  source_en: And he:- Following your own footsteps, I have discoursed even as have you.
  translation_ja: 彼は言う。あなたがた自身の足跡に従い、あなたがたと同じように論じたのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 485
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-57-012
  section: 57
  paragraph: 12
  source_en: Bonellus answereth:- You speak truly, for if you did otherwise we should not order your sayings
    to be written in our books.
  translation_ja: ボネルスは答える。あなたは真実を語る。もし別のようにしていたなら、われわれはあなたの言葉を自らの書物に記すよう命じなかったであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 487
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-001
  section: 58
  paragraph: 1
  source_en: Balgus saith:- The whole Turba, O Acratus, has already spoken, as you have seen, but a benefactor
    sometimes deceives, though his intention is to do good.
  translation_ja: バルグスは言う。アクラトゥスよ、あなたが見たように、集会全体はすでに語った。しかし善をなそうと意図していても、恩人がときに欺くことがある。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 491
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-002
  section: 58
  paragraph: 2
  source_en: And they:- Thou speakest truly. Proceed, therefore, according to thy opinion, and beware
    of envy!
  translation_ja: 人々は言う。あなたは真実を語る。したがって自らの考えに従って進め、惜しむ心には気をつけなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 493
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-003
  section: 58
  paragraph: 3
  source_en: Then he:- You must know that the envious have described this arcanum in the shade; in physical
    reasoning and astronomy, and the art of images; they have also likened it to trees; they have ambiguously
    concealed it by the names of metals, vapours, and reptiles; as is generally perceived in all their
    work.
  translation_ja: すると彼は言う。知るべきである。惜しむ者たちは、この秘義を陰に、自然学的推論、天文学、像の術の内に説明した。また木にたとえ、金属、蒸気、這うものの名によって曖昧に隠した。彼らの作業全体に、一般に見て取れるとおりである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 494
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-004
  section: 58
  paragraph: 4
  source_en: I, nevertheless, direct you, investigators of this science, to take iron and draw it into
    plates; finally, mix (or sprinkle) it with venom, and place it in its vessel, the mouth of which must
    be closed most carefully, and beware lest ye too much increase the humour, or, on the other hand,
    lest it be too dry, but stir it vigorously as a mass, because, if the water be in excess, it will
    not be contained in the chimney, while, if it be too dry, it will neither be conjoined nor cooked
    in the chimney; hence I direct you to confect it diligently; finally, place it in its vessel, the
    mouth of which must be closed internally and externally with clay, and, having kindled coals above
    it, after some days ye shall open it, and there shall ye find the iron plates already liquefied; while
    on the lid of the vessel ye shall find globules.
  translation_ja: それでも、この学を探究するあなたがたに私は指示する。鉄を取り、板に延ばしなさい。最後に毒と混ぜ〔または毒を振りかけ〕、それ自身の容器に入れ、その口を極めて注意深く閉じなさい。そして液を増やしすぎることにも、逆に乾きすぎることにも気をつけ、塊として力強くかき混ぜなさい。水が多すぎれば炉の内に収まらず、乾きすぎれば炉の内で結合も煮ることもできないからである。それゆえ私は、丹念に調製するよう指示する。最後に容器へ入れ、その口を内側と外側から粘土で閉じ、上で炭を燃やし、数日後に開きなさい。そこには鉄の板がすでに液化しており、容器の蓋には小球が見つかるであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 495
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-005
  section: 58
  paragraph: 5
  source_en: For when the fire is kindled the vinegar ascends, because its spiritual nature passes into
    the air, wherefore, I direct you to keep that part separately. Ye must also know that by multiplied
    decoctions and attritions it is congealed and coloured by the fire, and its nature is changed. By
    a similar decoction and liquefaction Cambar is not disjoined.
  translation_ja: 火をつけると酢が昇る。その霊的な自然が空気へ移るからである。それゆえ私は、その部分を別に保管するよう指示する。また知るべきである。煮詰めと摩砕を繰り返すことによって、それは凝結し、火によって着色され、その自然が変わる。同じような煮詰めと液化によって、カンバルは分離されない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 496
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-006
  section: 58
  paragraph: 6
  source_en: I notify to you that by the said frequent decoction the weight of a third part of the water
    is consumed, but the residue becomes a wind in the Cambar of the second spirit. And know ye that nothing
    is more precious or more excellent than the red sand of the sea, for the Sputum of Luna is united
    with the light of the Sun's rays. Luna is perfected by the coming on of night, and by the heat of
    the Sun the dew is congealed.
  translation_ja: 私はあなたがたに知らせる。前述の頻繁な煮詰めによって、水の三分の一の重さが消費されるが、残りは第二の霊のカンバルの内で風となる。そして知りなさい。海の赤い砂より貴く優れたものはない。月の唾が太陽の光線の光と結ばれるからである。月は夜の到来によって完成し、太陽の熱によって露は凝結する。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 497
  notes:
  - ここは Spume（泡）ではなく Sputum（唾）。英文の語の違いを反映した。
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-007
  section: 58
  paragraph: 7
  source_en: Then, that being wounded, the dew of the death dealer is joined, and the more the days pass
    on the more intensely is it congealed, and is not burned. For he who cooks with the Sun is himself
    congealed, and that signal whiteness causes it to overcome the terrene fire.
  translation_ja: 次に、それが傷つけられると、死をもたらす者の露が結びつく。そして日が経つほど強く凝結し、焼かれない。太陽とともに煮る者は、自らも凝結するからであり、その際立った白さによって、地上の火に打ち勝つのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 498
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-008
  section: 58
  paragraph: 8
  source_en: Then saith Bonites:- Do you not know, O Balgus, that the Spume of Luna tinges nothing except
    our copper?
  translation_ja: するとボニテスは言う。バルグスよ、月の泡は、われわれの銅以外、何も染めないことを知らないのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 499
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-009
  section: 58
  paragraph: 9
  source_en: And Balgus:- Thou speakest truly.
  translation_ja: バルグスは言う。あなたは真実を語る。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 501
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-010
  section: 58
  paragraph: 10
  source_en: And he:- Why, therefore, hast thou omitted to describe that tree, of the fruit whereof whosoever
    eateth shall hunger nevermore?
  translation_ja: 彼は言う。では、なぜ、その実を食べる者は誰も二度と飢えない、あの木を説明することを省いたのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 503
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-011
  section: 58
  paragraph: 11
  source_en: And Balgus:- A certain person, who has followed science, has notified to me after what manner
    he discovered this same tree, and appropriately operating, did extract the fruit and eat of it. But
    when I inquired of him concerning the growth and the increment, he described that pure whiteness,
    thinking that the same is found without any laborious disposition. Then its Perfection is the fruit
    thereof.
  translation_ja: バルグスは言う。学を追求したある人が、この同じ木をどのように発見し、適切に操作して果実を取り出し、食べたかを、私に知らせた。しかし私が成長と増大について尋ねると、その人はあの純粋な白さを説明し、手間のかかる配剤なしに見いだされると思っていた。そのとき、その完成こそが、その果実なのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 504
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-012
  section: 58
  paragraph: 12
  source_en: 'But when I further asked how it is nourished with food until it fructifies, he said: Take
    that tree, and build a house about it, which shall wholly surround the same, which shall also be circular,
    dark, encircled by dew, and shall have placed on it a man of a hundred years; shut and secure the
    door lest dust or wind should reach them. Then in the time of 180 days send them away to their homes.'
  translation_ja: しかし私がさらに、実を結ぶまでどのように食物で養われるのかと尋ねると、その人は言った。その木を取り、周囲に家を建てて、すっかり囲みなさい。その家はまた、円く、暗く、露に囲まれ、その上に百歳の男が置かれていなければならない。塵や風が届かぬよう、戸を閉じて固く守りなさい。それから百八十日が経ったら、彼らをそれぞれの家へ帰しなさい、と。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 505
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-58-013
  section: 58
  paragraph: 13
  source_en: I say that man shall not cease to eat of the fruit of that tree to the perfection of the
    number [of the days] until the old man shall become young. O what marvellous natures, which have transformed
    the soul of that old man into a juvenile body, and the father is made into the son! Blessed be thou,
    O most excellent God!
  translation_ja: 私は言う。老人が若くなるまで、その男は、〔日数の〕数が満ちるまで、その木の実を食べることをやめないであろう。おお、その老人の魂を若い身体へ変え、父を息子とした、何と驚くべき自然よ。最も優れた神よ、あなたは祝福されよ。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 506
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-001
  section: 59
  paragraph: 1
  source_en: Theophilus saith:- I propose to speak further concerning those things which Bonites hath
    narrated.
  translation_ja: テオフィルスは言う。ボニテスが語った事柄について、さらに話そうと思う。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 509
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-002
  section: 59
  paragraph: 2
  source_en: And the Turba:- Speak, Brother, for thy brother hath discoursed elegantly.
  translation_ja: 集会の人々は言う。兄弟よ、話しなさい。あなたの兄弟は見事に論じた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 511
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-003
  section: 59
  paragraph: 3
  source_en: And he:- Following in the steps of Bonites I will make perfect his sayings. It should be
    known that all the Philosophers, while they have concealed this disposition, yet spoke the truth in
    their treatises when they named water of life, for this reason, that whatsoever is mixed with the
    said water first dies, then lives and becomes young.
  translation_ja: 彼は言う。ボニテスの足跡に従い、その言葉を完成させよう。知るべきである。すべての哲学者たちは、この配剤を隠しながらも、論書の内で生命の水と名づけたときには、真実を語った。その水と混ぜられるものは何であれ、まず死に、それから生き、若くなるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 512
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-004
  section: 59
  paragraph: 4
  source_en: And know, all ye disciples, that iron does not become rusty except by reason of this water,
    because it tinges the plates; it is then placed in the sun till it liquefies and is imbued, after
    which it is congealed. In these days it becomes rusty, but silence is better than this illumination.
  translation_ja: そして弟子たちよ、皆、鉄はこの水によるのでなければ錆びないと知りなさい。水が板を染めるからである。それから、液化して浸されるまで太陽の下に置かれ、その後凝結する。その日々の間に錆びる。しかし、このように明らかにするより、沈黙するほうがよい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 513
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-005
  section: 59
  paragraph: 5
  source_en: The Turba answereth:- O Theophilus, beware of becoming envious, and complete thy speech!
  translation_ja: 集会の人々は答える。テオフィルスよ、惜しむ者とならぬよう気をつけ、話を完成させなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 514
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-006
  section: 59
  paragraph: 6
  source_en: And he:- Would that I might repeat the like thing!
  translation_ja: 彼は言う。同じようなことを、もう一度語れたらよいのだが。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 516
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-007
  section: 59
  paragraph: 7
  source_en: And they:- What is thy will?
  translation_ja: 人々は言う。あなたの望みは何か。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 518
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-008
  section: 59
  paragraph: 8
  source_en: Then he:- Certain fruits, which proceed first from that perfect tree, do flourish in the
    beginning of the summer, and the more they are multiplied the more are they adorned, until they are
    perfected, and being mature become sweet.
  translation_ja: すると彼は言う。あの完全な木から最初に生じるある果実は、夏の初めに花開き、増えれば増えるほど飾られ、ついに完成し、熟して甘くなる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 519
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-009
  section: 59
  paragraph: 9
  source_en: In the same way that woman, fleeing from her own children, with whom she lives, although
    partly angry, yet does not brook being overcome, nor that her husband should possess her beauty, who
    furiously loves her, and keeps awake contending with her, till he shall have carnal intercourse with
    her, and God make perfect the foetus, when he multiplies children to himself according to his pleasure.
    His beauty, therefore, is consumed by fire who does not approach his wife except by reason of lust.
  translation_ja: 同じように、その女は、ともに住む自分の子らから逃れ、一部は怒っていても、征服されることも、夫が自分の美しさを所有することも耐え忍ばない。夫は激しく彼女を愛し、眠らずに争い続け、ついに肉体的に交わり、神が胎児を完成させると、自分の望みのままに子らを増やす。したがって、欲情だけのために妻へ近づく者の美しさは、火によって消費される。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 520
  notes:
  - 婚姻・性交・受胎・身体の解体は本文の錬金術的比喩として訳した。人や生物に対する実行手順ではない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-010
  section: 59
  paragraph: 10
  source_en: For when the term is finished he turns to her. I also make known to you that the dragon never
    dies, but the Philosophers have put to death the woman who slays her spouses. For the belly of that
    woman is full of weapons and venom.
  translation_ja: 定められた期間が終わると、彼は彼女のほうへ向くからである。また私は、竜は決して死なないが、哲学者たちは、配偶者たちを殺す女を死なせたと、あなたがたに知らせる。その女の腹は、武器と毒で満ちているからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 521
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-011
  section: 59
  paragraph: 11
  source_en: Let, therefore, a sepulchre be dug for the dragon, and let that woman be buried with him,
    who being strongly joined with that woman, the more he clasps her and is entwined with her, the more
    his body, by the creation of female weapons in the body of the woman, is cut up into parts. For perceiving
    him mixed with the limbs of a woman he becomes secure from death, and the whole is turned into blood.
  translation_ja: したがって竜のために墓を掘り、その女を竜とともに埋めなさい。竜はその女と強く結びつき、抱き締め、絡み合えば合うほど、女の身体の内に女の武器が作られるため、その身体が細かく切り裂かれる。女の肢体と混ざった彼を認めることで、彼は死から安全となり、全体が血へ変わるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 522
  notes:
  - 代名詞の指示と「死から安全になる」という因果は英訳の段階でも不明瞭。誰を指すかを断定して補わない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-59-012
  section: 59
  paragraph: 12
  source_en: But the Philosophers, beholding him turned into blood, leave him in the sun for certain days,
    until the lenitude is consumed, the blood dries up, and they find that venom which now is manifest.
    Then the wind is hidden.
  translation_ja: しかし哲学者たちは、彼が血に変わるのを見て、柔らかさが消費され、血が乾き、今や明らかとなった毒を見いだすまで、幾日か太陽の下へ置く。そのとき風は隠される。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 523
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-60-001
  section: 60
  paragraph: 1
  source_en: Bonellus saith:- Know, all ye disciples, that out of the elect things nothing becomes useful
    without conjunction and regimen, because sperma is generated out of blood and desire. For the man
    mingling with the woman, the sperm is nourished by the humour of the womb, and by the moistening blood,
    and by heat, and when forty nights have elapsed the sperm is formed. But if the humidity of the blood
    and of the womb were not heat, the sperm would not be dissolved, nor the foetus be procreated.
  translation_ja: ボネルスは言う。弟子たちよ、皆、知りなさい。選ばれたもののうち、結合と処理なしに有用となるものは何もない。精液は血と欲望から生じるからである。男が女と交わると、精液は子宮の液、湿らせる血、そして熱によって養われ、四十夜が過ぎると形作られる。しかし血と子宮の湿りが熱でなかったなら、精液は溶けず、胎児も生じないであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 525
  notes:
  - were not heat は1896年版の読みを保持した。この発言の受胎・精液・胎児に関する説明は前近代の生理観であり、医学的事実や健康上の助言ではない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-60-002
  section: 60
  paragraph: 2
  source_en: But God has constituted that heat and blood for the nourishment of the sperm until the foetus
    is brought forth, after which it is not nourished, save by milk and fire, sparingly and gradually,
    while it is dust, and the more it burns the more, the bones being strengthened, it is led towards
    youth, arriving at which it is independent. Thus it behoves you also to act in this Art. Know ye that
    without heat nothing is ever generated, and that the bath causes the matter to perish by means of
    intense heat.
  translation_ja: しかし神は、胎児が生まれるまで精液を養うため、その熱と血を設けた。生まれた後は、それが塵である間、乳と火によって、控えめに、少しずつ養われるほかはない。そして燃えれば燃えるほど、骨が強められ、青年期へ導かれ、そこへ達すると自立する。この術においても、あなたがたはそのように行うべきである。熱なしには何も生まれず、浴は激しい熱によって質料を滅ぼすと知りなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 526
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-60-003
  section: 60
  paragraph: 3
  source_en: If, indeed, it be frigid, it puts to flight and disperses, but if it have been tempered,
    it is convenient and sweet to the body, wherefore the veins become smooth and the flesh is augmented.
    Behold it has been demonstrated to you, all ye disciples! Understand, therefore, and in all things
    which ye attempt to rule, fear God.
  translation_ja: 実際、冷たければ追い散らし、分散させるが、適温に調整されていれば、身体に適し、心地よい。それゆえ血管は滑らかになり、肉は増える。見よ、弟子たちよ、皆、あなたがたに示された。したがって理解し、処理しようとするすべてのものにおいて、神を畏れなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 527
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-61-001
  section: 61
  paragraph: 1
  source_en: Moses saith:- It is to be observed that the envious have named lead of copper instruments
    of formation, simulating, deceiving posterity, to whom I give notice that there are no instruments
    except from our own white, strong, and splendid powder, and from our concave stone and marble, to
    the whole work whereof there is no more suitable powder, nor one more conjoined to our composition,
    than the powder of Alociae, out of which are produced instruments of formation.
  translation_ja: モーセは言う。注意すべきである。惜しむ者たちは、銅の鉛を形成の道具と名づけ、装って後世の人々を欺いた。その人々に私は知らせる。道具は、われわれ自身の白く、強く、輝く粉末と、われわれのくぼんだ石および大理石から来るもの以外にはない。その作業全体にとって、アロキアエの粉末以上に適した粉末、われわれの配合物とよく結びつく粉末はなく、そこから形成の道具が作られるのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 529
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-61-002
  section: 61
  paragraph: 2
  source_en: 'Further, the Philosophers have already said: Take instruments out of the egg. Yet they have
    not said what the egg is, nor of what bird. And know ye that the regimen of these things is more difficult
    than the entire work, because, if the composition be ruled more than it should be, its light is taken
    and extinguished by the sea. Wherefore the Philosophers have ordered that it should be ruled with
    profound judgment. The moon, therefore, being at the full, take this and place in sand till it be
    dissolved.'
  translation_ja: さらに哲学者たちはすでに、卵から道具を取れと言った。しかし卵が何か、どの鳥の卵かは言わなかった。そして知りなさい。これらの処理は、作業全体より難しい。配合物を必要以上に処理すれば、その光は海に奪われ、消されるからである。それゆえ哲学者たちは、深い判断力によって処理するよう命じた。したがって月が満ちたとき、これを取り、溶けるまで砂の中へ置きなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 530
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-61-003
  section: 61
  paragraph: 3
  source_en: And know ye that while ye are placing the same in sand and repeating the process, unless
    ye have patience, ye err in ruling, and corrupt the work. Cook, therefore, the same in a gentle fire
    until ye see that it is dissolved. Then extinguish with vinegar, and ye shall find one thing separated
    from three companions. And know ye that the first, Ixir, commingles, the second burns, while the third
    liquefies.
  translation_ja: そして知りなさい。砂の中へ置き、工程を繰り返している間、忍耐がなければ、処理を誤り、作業物を損なう。それゆえ穏やかな火で、溶けたことを認めるまで煮なさい。それから酢で火を止めなさい。すると、一つのものが三つの伴侶から分離しているのを見いだすであろう。そして知りなさい。第一のイクシールは混ぜ合わせ、第二は焼き、第三は液化する。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 531
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-61-004
  section: 61
  paragraph: 4
  source_en: In the first place, therefore, impose nine ounces of vinegar twice - first while the vessel
    is being made hot, and second when it is heated.
  translation_ja: したがって最初に、九オンスの酢を二度加えなさい。第一は容器が熱くされつつある間に、第二は熱くなったときにである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 532
  notes:
  - ounce は底本の重量単位。制度や対象の特定なしに現代のグラムへ換算しない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-62-001
  section: 62
  paragraph: 1
  source_en: Mundus saith:- It behoves you, O all ye seekers after this Art, to know that whatsoever the
    Philosophers have narrated or ordained, Kenckel, herbs, geldum, and carmen, are one thing! Do not,
    therefore, trouble about a plurality of things, for there is one Tyrian tincture of the Philosophers
    to which they have given names at will, and having abolished the proper name, they have called it
    black, because it has been extracted from our sea.
  translation_ja: ムンドゥスは言う。この術を求める皆よ、哲学者たちが何を語り、定めたにせよ、ケンケル、草、ゲルドゥム、カルメンは一つのものであると知るべきである。したがって、ものの多さに悩んではならない。哲学者たちのテュロスの着色剤は一つであり、彼らは好きな名を与え、固有の名を消して、われわれの海から取り出されたため、それを黒いものと呼んだ。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 534
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-62-002
  section: 62
  paragraph: 2
  source_en: And know that the ancient priests did not condescend to wear artificial garments, whence,
    for purifying altars, and lest they should introduce into them anything sordid or impure, they tinged
    Kenckel with a Tyrian colour; but our Tyrian colour, which they placed in their altars and treasuries,
    was more clean and fragrant than can be described by me, which also has been extracted from our red
    and most pure sea, which is sweet and of a pleasant odour, and is neither sordid nor impure in putrefaction.
  translation_ja: そして知りなさい。古代の祭司たちは人工の衣を着ることをよしとしなかった。それゆえ祭壇を清め、そこへ汚れたものや不純なものを持ち込まないために、ケンケルをテュロスの色に染めた。しかし、彼らが祭壇と宝庫に置いたわれわれのテュロスの色は、私には説明できないほど清浄で香り高かった。それもまた、われわれの赤く、最も純粋な海から取り出されたものである。その海は甘く、心地よい香りがあり、腐敗の内でも汚れず、不純でもない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 535
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-62-003
  section: 62
  paragraph: 3
  source_en: And know ye that we have given many names to it. which are all true - an example of which,
    for those that possess understanding, is to be traced in corn that is being ground. For after grinding
    it is called by another name, and after it has been passed through the sieve, and the various substances
    have been separated one from another, each of these has its own name, and yet fundamentally there
    is but one name, to wit, corn, from which many names are distinguished.
  translation_ja: そして知りなさい。われわれはそれに多くの名を与えたが、それらはすべて真実である。理解力のある者のため、その例は、挽かれる穀物に見て取ることができる。挽いた後には別の名で呼ばれ、篩を通され、さまざまな物質が互いに分けられた後には、各々が自らの名を持つからである。しかし根本には、穀物というただ一つの名があり、そこから多くの名が区別されるのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 536
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-62-004
  section: 62
  paragraph: 4
  source_en: Thus we call the purple in each grade of its regimen by the name of its own colour.
  translation_ja: このようにわれわれは、紫色のものを、その処理の各段階で、それ自身の色の名によって呼ぶ。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 537
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-63-001
  section: 63
  paragraph: 1
  source_en: Philosophus saith:- I notify to posterity that the nature is male and female, wherefore the
    envious have called it the body of Magnesia, because therein is the most great arcanum! Accordingly,
    O all ye seekers after this Art, place Magnesia in its vessel, and cook diligently! Then, opening
    it after some days, ye shall find the whole changed into water. Cook further until it be coagulated,
    and contain itself.
  translation_ja: フィロソフスは言う。私は後世の人々に、自然は雄と雌であると知らせる。それゆえ惜しむ者たちは、それをマグネシアの物体と呼んだ。その内に最も偉大な秘義があるからである。したがってこの術を求める皆よ、マグネシアをそれ自身の容器へ入れ、丹念に煮なさい。それから数日後に開くと、全体が水へ変わっていることが分かるであろう。さらに煮て、凝固し、自らを保つまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 539
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-63-002
  section: 63
  paragraph: 2
  source_en: 'But, when ye hear of the sea in the books of the envious, know that they signify humour,
    while by the basket they signify the vessel, and by the medicines they mean Nature, because it germinates
    and flowers. But when the envious say: Wash until the blackness of the copper passes away, certain
    people name this blackness coins. But Agadimon has clearly demonstrated when he boldly put forth these
    words: It is to be noted, O all ye demonstrators of this art, that the things [or the copper] being
    first mixed and cooked once, ye shall find the prescribed blackness! That is to say, they all become
    black.'
  translation_ja: しかし、惜しむ者たちの書物で海について聞いたなら、それは液を意味すると知りなさい。一方、籠とは容器を意味し、薬とは自然を意味する。自然は芽を出し、花を咲かせるからである。しかし惜しむ者たちが、銅の黒さが去るまで洗えと言うとき、ある人々はこの黒さを貨幣と名づける。だがアガディモンは、次の言葉を大胆に示したとき、明瞭に説明した。この術を示す皆よ、注意すべきである。これらのもの〔または銅〕を初めに混ぜ、一度煮ると、定められた黒さが見いだされる。すなわち、すべてが黒くなるのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 540
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-63-003
  section: 63
  paragraph: 3
  source_en: This, therefore, is the lead of the Wise, concerning which they have treated very frequently
    in their books. Some also call it [the lead] of our black coins.
  translation_ja: したがって、これが賢者たちの鉛であり、彼らは書物でそれについて非常に頻繁に論じた。ある者たちは、われわれの黒い貨幣の〔鉛〕とも呼ぶ。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 542
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-64-001
  section: 64
  paragraph: 1
  source_en: Pythagoras saith:- How marvellous is the diversity of the Philosophers in those things which
    they formerly asserted, and in their coming together [or agreement], in respect of this small and
    most common thing, wherein the precious thing is concealed! And if the vulgar knew, O all ye investigators
    of this art, the same small and vile thing, they would deem it a lie! Yet, if they knew its efficacy,
    they would not vilify it, but God hath concealed this from the crowd lest the world should be devastated.
  translation_ja: ピュタゴラスは言う。貴いものがその内に隠された、この小さく、最もありふれたものについて、哲学者たちが以前に主張したことと、彼らの集まり〔または一致〕における多様さは、何と驚くべきものか。この術を探究する皆よ、俗人たちが、この同じ小さく卑しいものを知ったなら、嘘だと思うであろう。しかし、その効力を知ったなら、軽蔑しないであろう。だが神は、世界が荒廃しないよう、群衆からこれを隠したのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 544
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-65-001
  section: 65
  paragraph: 1
  source_en: Horfolcus saith:- You must know, O all ye who love wisdom, that whereas Mundus hath been
    teaching this Art, and placing before you most lucid syllogisms, he that does not understand what
    he has said is a brute animal! But I will explain the regimen of this small thing, in order that any
    one, being introduced into this Art, may become bolder, may, more assuredly consider it, and although
    it be small, may compose the common with that which is dear, and the dear with that which is common.
  translation_ja: ホルフォルクスは言う。叡智を愛する皆よ、知るべきである。ムンドゥスはこの術を教え、最も明晰な三段論法を示してきたのだから、その言ったことを理解しない者は、理性のない獣である。しかし私は、この小さなものの処理を説明しよう。この術へ導き入れられた誰もが、いっそう大胆になり、確信をもってこれを考察し、それが小さなものであっても、ありふれたものを貴いものと、貴いものをありふれたものと配合できるようにするためである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 546
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-65-002
  section: 65
  paragraph: 2
  source_en: Know ye that in the beginning of the mixing, it behoves you to commingle elements which are
    crude, gentle, sincere, and not cooked or governed, over a gentle fire. Beware of intensifying the
    fire until the elements are conjoined, for these should follow one another, and be embraced in a complexion,
    whereby they are gradually burnt, until they be dessicated in the said gentle fire.
  translation_ja: 知りなさい。混合の初めには、生の、穏やかで、純粋な、まだ煮られも処理されもしていない元素を、穏やかな火の上で混ぜ合わせるべきである。元素が結びつくまでは、火を強めないよう注意しなさい。それらは互いに従い、一つの組成の内に抱き合い、それによって徐々に焼かれ、その穏やかな火の中で乾くべきだからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 547
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-65-003
  section: 65
  paragraph: 3
  source_en: And know that one spirit burns one thing and destroys one thing, and one body strengthens
    one spirit, and teaches the same to contend with the fire. But, after the first combustion, it is
    necessary that it should be washed, cleansed, and dealbated on the fire until all things become one
    colour; with which, afterwards, it behoves you to mix the residuum of the whole humour, and then its
    colour will be exalted.
  translation_ja: そして知りなさい。一つの霊が一つのものを焼き、一つのものを破壊する。そして一つの物体が一つの霊を強め、火と争うことを教える。しかし最初の燃焼の後には、火の上で洗い、清め、白くし、すべてが一つの色となるまで続ける必要がある。その後、液全体の残りをそれに混ぜるべきであり、そうすれば、その色は高められる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 548
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-65-004
  section: 65
  paragraph: 4
  source_en: 'For the elements, being diligently cooked in the fire, rejoice, and are changed into different
    natures, because the liquefied, which is the lead, becomes not-liquefied, the humid becomes dry, the
    thick body becomes a spirit, and the fleeing spirit becomes strong and fit to do battle against the
    fire. Whence the Philosopher saith: Convert the elements and thou shalt find what thou seekest. But
    to convert the elements is to make the moist dry and the fugitive fixed.'
  translation_ja: 元素は火の中で丹念に煮られると喜び、異なる自然へ変わる。液化したもの、すなわち鉛は液化しないものとなり、湿ったものは乾き、厚い物体は霊となり、逃げる霊は強くなって、火と戦うにふさわしくなるからである。それゆえ哲学者は、元素を変換せよ、そうすれば求めるものを見いだす、と言う。しかし元素を変換するとは、湿ったものを乾かし、逃げるものを固定することである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 549
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-65-005
  section: 65
  paragraph: 5
  source_en: These things being accomplished by the disposition, let the operator leave it in the fire
    until the gross be made subtle, and the subtle remain as a tingeing spirit. Know ye, also, that the
    death and life of the elements proceed from fire, and that the composite germinates itself, and produces
    that which ye desire, God favouring. But when the colours begin ye shall behold the miracles of the
    wisdom of God, until the Tyrian colour be accomplished.
  translation_ja: 配剤によってこれらが達成されたら、作業者はそれを火の中に置き、粗厚なものが精妙となり、精妙なものが染める霊として残るまで続けなさい。また知りなさい。元素の死と生命は火から生じ、複合物は自ら芽吹き、神の助けによって、あなたがたの望むものを生む。しかし色が現れ始めたら、テュロスの色が完成するまで、神の叡智の奇跡を見るであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 550
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-65-006
  section: 65
  paragraph: 6
  source_en: O wonder-working Nature, tingeing other natures! O heavenly Nature, separating and converting
    the elements by regimen! Nothing, therefore, is more precious than these Natures in that Nature which
    multiplies the composite, and makes fixed and scarlet.
  translation_ja: おお、他の自然を染める、奇跡をなす自然よ。おお、処理によって元素を分け、変える、天上の自然よ。それゆえ、複合物を増殖させ、固定し、緋色にするかの自然の内にある、これらの自然より貴いものは何もない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 551
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-66-001
  section: 66
  paragraph: 1
  source_en: 'Exemiganus saith:- Thou hast already treated, O Lucas, concerning living and concealed silver,
    which is Magnesia, as it behoves thee, and thou hast commanded posterity to prove [or to experiment]
    and to read the books, knowing what the Philosophers have said: Search the latent spirit and disesteem
    it not, seeing that when it remains it is a great arcanum and effects many good things.'
  translation_ja: エクセミガヌスは言う。ルカスよ、あなたは生きた隠された銀、すなわちマグネシアについて、ふさわしい仕方ですでに論じた。そして哲学者たちが「潜む霊を探し、軽んじるな。それがとどまるとき、偉大な秘義となり、多くの良いことを成し遂げるからである」と言ったことを知って、後世の人々に確かめること〔または実験すること〕と、書物を読むことを命じた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 554
  notes:
  - 直前の話者名と呼びかける相手の名の連続性には揺れがある。英文の Lucas をそのまま残した。
  source_language: en
  target_language: ja
  kind: body
- id: turba-67-001
  section: 67
  paragraph: 1
  source_en: 'Lucas saith:- I testify to posterity, and what I set forth is more lucid than are your words,
    that the Philosopher saith: Burn the copper, burn the silver, burn the gold.'
  translation_ja: ルカスは言う。私は後世の人々に証言する。私が述べることは、あなたがたの言葉より明晰である。哲学者は、銅を焼け、銀を焼け、金を焼け、と言う。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 557
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-67-002
  section: 67
  paragraph: 2
  source_en: Hermiganus replies:- Behold something more dark than ever!
  translation_ja: ヘルミガヌスは答える。見よ、以前にも増して暗いものが現れた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 559
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-67-003
  section: 67
  paragraph: 3
  source_en: The Turba answereth:- Illumine, therefore, that which is dark.
  translation_ja: 集会の人々は答える。では、暗いものを明るくしなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 561
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-67-004
  section: 67
  paragraph: 4
  source_en: And he:- As to that which he said - Burn, burn, burn, the diversity is only in the names,
    for they are one and the same thing.
  translation_ja: 彼は言う。彼が「焼け、焼け、焼け」と言ったことについては、相違は名だけにある。それらは一つの同じものだからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 563
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-67-005
  section: 67
  paragraph: 5
  source_en: And they:- Woe unto you! how shortly hast thou dealt with it! why art thou Poisoned with
    jealousy!
  translation_ja: 人々は言う。あなたに災いあれ。何と短く扱ったことか。なぜ嫉妬の毒に冒されているのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 564
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-67-006
  section: 67
  paragraph: 6
  source_en: And he:- Is it desirable that I should speak more clearly?
  translation_ja: 彼は言う。もっと明確に話すことが望ましいのか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 566
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-67-007
  section: 67
  paragraph: 7
  source_en: And they:- Do so.
  translation_ja: 人々は言う。そうしなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 568
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-67-008
  section: 67
  paragraph: 8
  source_en: And he:- I signify that to whiten is to burn, but to make red is life. For the envious have
    multiplied many names that they might lead posterity astray, to whom I testify that the definition
    of this Art is the liquefaction of the body and the separation of the soul from the body, seeing that
    copper, like a man, has a soul and a body.
  translation_ja: 彼は言う。私は、白くすることは焼くことであり、赤くすることは生命であると告げる。惜しむ者たちは、後世の人々を道に迷わせるため、多くの名を増やしたからである。その人々に私は証言する。この術の定義は、物体の液化と、身体からの魂の分離である。銅は人と同じく、魂と身体を持つからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 569
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-67-009
  section: 67
  paragraph: 9
  source_en: Therefore, it behoves you, 0 all ye Sons of the Doctrine, to destroy the body and extract
    the soul therefrom! Wherefore the Philosophers said that the body does not penetrate the body, but
    that there is a subtle nature, which is the soul, and it is this which tinges and penetrates the body.
    In nature, therefore, there is a body and there is a soul.
  translation_ja: したがって教えの子らよ、皆、身体を破壊し、そこから魂を取り出すべきである。それゆえ哲学者たちは、物体は物体を貫かないが、魂という精妙な自然があり、それこそが物体を染め、貫くと言った。したがって自然の内には身体があり、魂がある。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 570
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-67-010
  section: 67
  paragraph: 10
  source_en: The Turba answereth:- Despite your desire to explain, you have put forth dark words.
  translation_ja: 集会の人々は答える。説明したいと望みながらも、あなたは暗い言葉を述べた。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 571
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-67-011
  section: 67
  paragraph: 11
  source_en: And he:- I signify that the envious have narrated and said that the splendour of Saturn does
    not appear unless it perchance be dark when it ascends in the air, that Mercury is hidden by the rays
    of the Sun, that quicksilver vivifies the body by its fiery strength, and thus the work is accomplished.
    But Venus, when she becomes oriental, precedes the Sun.
  translation_ja: 彼は言う。私は告げる。惜しむ者たちは、土星の輝きは、空中へ昇るときに暗くならなければ現れないこと、水星は太陽の光線に隠されること、水銀はその火性の力によって物体を生かし、こうして作業が完成することを語り、述べた。しかし金星は、東方に現れるとき、太陽に先立つ。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 573
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-68-001
  section: 68
  paragraph: 1
  source_en: Attamus saith:- Know, O all ye investigators of this Art, that our work, of which ye have
    been inquiring, is produced by the generation of the sea, by which and with which, after God, the
    work is completed! Take, therefore, Halsut and old sea stones, and boil with coals until they become
    white. Then extinguish in white vinegar.
  translation_ja: アッタムスは言う。この術を探究する皆よ、知りなさい。あなたがたが尋ねてきたわれわれの作業は、海の生成によって生じる。神に次いで、それによって、またそれとともに、作業は完成する。それゆえハルストと古い海の石を取り、炭で白くなるまで煮なさい。それから白い酢で火を止めなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 576
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-68-002
  section: 68
  paragraph: 2
  source_en: If 24 ounces thereof have been boiled, let the heat be extinguished with a third part of
    the vinegar, that is, 8 ounces; pound with white vinegar, and cook in the sun and black earth for
    42 days. But the second work is performed from the tenth day of the month of September to the tenth
    day [or grade] of Libra. Do not impose the vinegar a second time in this work, but leave the same
    to be cooked until all its vinegar be dried up and it becomes a fixed earth, like Egyptian earth.
  translation_ja: その二十四オンスを煮たなら、三分の一の酢、すなわち八オンスで熱を消しなさい。白い酢で砕き、太陽と黒い土の内で四十二日間煮なさい。しかし第二の作業は、九月十日から天秤宮の第十日〔または第十度〕まで行われる。この作業では酢を二度加えてはならない。そのまま煮られるに任せ、酢がすべて乾き、エジプトの土のような固定した土となるまで続けなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 577
  notes:
  - Libra の day / grade はWaite英訳の別読。暦日か黄道上の度数かを確定せず併記した。
  source_language: en
  target_language: ja
  kind: body
- id: turba-68-003
  section: 68
  paragraph: 3
  source_en: And the fact that one work is congealed more quickly and another more slowly, arises from
    the diversity of cooking. But if the place where it is cooked be humid and dewy it is congealed more
    quickly, while if it be dry it is congealed more slowly.
  translation_ja: 一つの作業物は速く凝結し、別のものは遅く凝結するという事実は、煮方の違いから生じる。しかし、煮られる場所が湿って露に富んでいれば速く凝結し、乾いていれば遅く凝結する。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 578
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-69-001
  section: 69
  paragraph: 1
  source_en: Florus saith:- I am thinking of perfecting thy treatise, O Mundus, for thou has not accomplished
    the disposition of the cooking!
  translation_ja: フロルスは言う。ムンドゥスよ、私はあなたの論述を完成させようと思う。あなたは煮ることの処理を十分に述べていないからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 581
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-69-002
  section: 69
  paragraph: 2
  source_en: And he:- Proceed, O Philosopher!
  translation_ja: 彼は言う。哲学者よ、続けなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 583
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-69-003
  section: 69
  paragraph: 3
  source_en: And Florus:- I teach you, O Sons of the Doctrine, that the sign of the goodness of the first
    decoction is the extraction of its redness!
  translation_ja: フロルスは言う。教えの子らよ、私は教える。最初の煮詰めが良好であるしるしは、その赤さが取り出されることである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 585
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-69-004
  section: 69
  paragraph: 4
  source_en: And he:- Describe what is redness.
  translation_ja: 彼は言う。赤さとは何か、説明しなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 587
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-69-005
  section: 69
  paragraph: 5
  source_en: And Florus:- When ye see that the matter is entirely black, know that whiteness has been
    hidden in the belly of that blackness. Then it behoves you to extract that whiteness most subtly from
    that blackness, for ye know how to discern between them. But in the second decoction let that whiteness
    be placed in a vessel with its instruments, and let it be cooked gently until it become completely
    white.
  translation_ja: フロルスは言う。質料が完全に黒くなったのを見たら、その黒さの腹の内に白さが隠されたと知りなさい。それから、その黒さから白さを、極めて精妙に取り出すべきである。両者をどう見分けるか、あなたがたは知っているからである。しかし第二の煮詰めでは、その白さをその道具とともに容器へ入れ、完全に白くなるまで穏やかに煮なさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 588
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-69-006
  section: 69
  paragraph: 6
  source_en: But when, O all ye seekers after this Art, ye shall perceive that whiteness appear and flowing
    over all, be certain that redness is hid in that whiteness! However, it does not behove you to extract
    it, but rather to cook it until the whole become a most deep red, with which nothing can compare.
  translation_ja: しかし、この術を求める皆よ、白さが現れ、全体を覆って流れるのを認めたなら、その白さの内に赤さが隠れていると確信しなさい。ただし、それを取り出すべきではなく、むしろ全体が比べるもののない最も深い赤となるまで、煮るべきである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 589
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-69-007
  section: 69
  paragraph: 7
  source_en: Know also that the first blackness is produced out of the nature of Marteck, and that redness
    is extracted from that blackness, which red has improved the black, and has made peace between the
    fugitive and the non-fugitive, reducing the two into one.
  translation_ja: また知りなさい。最初の黒さはマルテクの自然から生じ、赤さはその黒さから取り出される。その赤は黒を改善し、逃げるものと逃げないものを和解させ、二つを一つにする。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 590
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-69-008
  section: 69
  paragraph: 8
  source_en: The Turba answereth:- And why was this?
  translation_ja: 集会の人々は答える。それはなぜか。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 591
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-69-009
  section: 69
  paragraph: 9
  source_en: And he:- Because the cruciated matter when it is submerged in the body, changes it into an
    unalterable and indelible nature. It behoves you, therefore, to know this sulphur which blackens the
    body. And know ye that the same sulphur cannot be handled, but it cruciates and tinges. And the sulphur
    which blackens is that which does not open the door to the fugitive and turns into the fugitive with
    the fugitive.
  translation_ja: 彼は言う。苦しめられた質料は、物体の内へ沈められると、物体を変化せず消えない自然へ変えるからである。したがって、物体を黒くするこの硫黄を知るべきである。そして知りなさい。同じ硫黄は手で扱えないが、苦しめ、染める。そして黒くする硫黄は、逃げるものに門を開かず、逃げるものとともに逃げるものとなる硫黄である。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 592
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-69-010
  section: 69
  paragraph: 10
  source_en: Do you not see that the cruciating does not cruciate with harm or corruption, but by co-adunation
    and utility of things? For if its victim were noxious and inconvenient, it would not be embraced thereby
    until its colours were extracted from it unalterable and indelible.
  translation_ja: 苦しめるものが、害や腐敗によってではなく、ものの結合と有用性によって苦しめることが分からないか。その犠牲となるものが有害で不適切なら、その変わらず消えない色が取り出されるまで、抱きとめられることはないからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 593
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-69-011
  section: 69
  paragraph: 11
  source_en: This we have called water of sulphur, which water we have prepared for the red tinctures;
    for the rest it does not blacken; but that which does blacken, and this does not come to pass without
    blackness, I have testified to be the key of the work.
  translation_ja: われわれはこれを硫黄の水と呼び、この水を赤い着色剤のために調製した。それ以外については、これは黒くしない。しかし黒くするもの、そしてこれは黒さなしには起こらないが、それこそ作業の鍵であると、私は証言した。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 594
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-70-001
  section: 70
  paragraph: 1
  source_en: Mundus saith:- Know, all ye investigators of this Art, that the head is all things, which
    if it hath not, all that it imposes profits nothing. Accordingly, the Masters have said that what
    is perfected is one, and a diversity of natures does not improve that thing, but one and a suitable
    nature, which it behoves you to rule carefully, for by ignorance of ruling some have erred.
  translation_ja: ムンドゥスは言う。この術を探究する皆よ、知りなさい。首位はすべてであり、それを持たなければ、何を加えても何の役にも立たない。それゆえ師たちは、完成されるものは一つであり、多様な自然がそのものを改善するのではなく、一つの適切な自然が改善する、と言った。それを注意深く処理すべきである。処理を知らないため、誤った者がいるからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 596
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-70-002
  section: 70
  paragraph: 2
  source_en: Do not heed, therefore, the plurality of these compositions, nor those things which the philosophers
    have enumerated in their books. For the nature of truth is one, and the followers of Nature have termed
    it that one thing in the belly whereof is concealed the natural arcanum. This arcanum is neither seen
    nor known except by the Wise.
  translation_ja: したがって、これら配合物の多さや、哲学者たちが書物に列挙したものに気を取られてはならない。真実の自然は一つであり、自然に従う者たちはそれを、その腹の内に自然の秘義が隠された、かの一つのものと呼んだからである。この秘義は、賢者たち以外には見られも知られもしない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 597
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-70-003
  section: 70
  paragraph: 3
  source_en: He, therefore, who knows how to extract its complexion and rules equably, for him shall a
    nature rise forth therefrom which shall conquer all natures, and then shall that word be fulfilled
    which was written by the Masters, namely, that Nature rejoices in Nature, Nature overcomes Nature,
    and Nature contains Nature; at the same time there are not many or diverse Natures, but one having
    in itself its own natures and properties, by which it prevails over other things.
  translation_ja: したがって、その組成の取り出し方を知り、均等に処理する者には、そこから、あらゆる自然を征服する自然が立ち現れるであろう。そのとき、師たちが書いた言葉、すなわち「自然は自然の内で喜び、自然は自然に打ち勝ち、自然は自然を包む」が成就する。同時に、多数の、あるいは多様な自然があるのではなく、自らの自然と性質を内に持ち、それによって他のものに勝る一つの自然があるのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 598
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-70-004
  section: 70
  paragraph: 4
  source_en: Do you not see that the Master has begun with one and finished one? Hence has he called those
    unities Sulphureous Water, conquering all Nature.
  translation_ja: 師が一つから始め、一つを完成させたことが分からないか。それゆえ彼は、それらの一なるものを、すべての自然を征服する〈硫黄性の水〉と呼んだのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 599
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-71-001
  section: 71
  paragraph: 1
  source_en: Bracus saith:- How elegantly Mundus hath described this sulphureous water! For unless solid
    bodies are destroyed by a nature wanting a body, until the bodies become not-bodies, and even as a
    most tenuous spirit, ye cannot [attain] that most tenuous and tingeing soul, which is hidden in the
    natural belly. And know that unless the body be withered up and so destroyed that it dies, and unless
    ye extract from it its soul, which is a tingeing spirit, ye are unable to tinge a body therewith.
  translation_ja: ブラクスは言う。ムンドゥスは、この硫黄性の水を何と見事に説明したことか。固体が、物体を欠く自然によって破壊され、物体でないものとなり、極めて微細な霊のようになるまでは、自然の腹に隠された、あの極めて微細で染める魂に〔到達〕できないからである。そして知りなさい。物体が干からび、死ぬほど破壊され、そこから、染める霊である魂を取り出さなければ、それによって物体を染めることはできない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 601
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-72-001
  section: 72
  paragraph: 1
  source_en: Philosophus saith:- The first composition, that is, the body of Magnesia, is made out of
    several things, although they become one, and are called by one name, which the ancients have termed
    Albar of copper. But when it is ruled it is called by ten names, taken from the colours which appear
    in the regimen of the body of this Magnesia.
  translation_ja: フィロソフスは言う。第一の配合物、すなわちマグネシアの物体は、いくつかのものから作られる。ただし、それらは一つとなり、古人たちが銅のアルバルと名づけた一つの名で呼ばれる。しかし処理されると、このマグネシアの物体を処理する間に現れる色から取られた、十の名で呼ばれる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 603
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-72-002
  section: 72
  paragraph: 2
  source_en: It is necessary, therefore, that the lead be turned into blackness; then the ten aforesaid
    shall appear in the ferment of gold, with sericon, which is a composition called by ten names. When
    all these things have been said, we mean nothing more by these names than Albar of copper, because
    it tinges every body which has entered into the composition. But composition is twofold - one is humid,
    the other is dry. When they are cooked prudently they become one, and are called the good thing of
    several names.
  translation_ja: したがって、鉛を黒さへ変える必要がある。そのとき、前述の十のものが、金の発酵種の内に、セリコンとともに現れるであろう。セリコンは、十の名で呼ばれる配合物である。これらすべてが語られたとき、われわれがこれらの名で意味するのは、銅のアルバルにほかならない。それは配合物に入ったあらゆる物体を染めるからである。しかし配合物には二つあり、一方は湿り、他方は乾いている。注意深く煮ると一つとなり、いくつかの名を持つ善きものと呼ばれる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 604
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-72-003
  section: 72
  paragraph: 3
  source_en: But when it becomes red it is called Flower of Gold, Ferment of Gold, Gold of Coral, Gold
    of the Beak. It is also called redundant red sulphur and red orpiment. But while it remains crude
    lead of copper, it is called bars and plates of metal. Behold I have revealed its names when it is
    raw, which also we should distinguish from the names when it has been cooked. Let it therefore be
    pondered over.
  translation_ja: だが赤くなると、金の花、金の発酵種、珊瑚の金、嘴の金と呼ばれる。また、過剰な赤い硫黄、赤い石黄とも呼ばれる。しかし生の銅の鉛のままである間は、金属の棒と板と呼ばれる。見よ、生のときの名を明かした。われわれはそれを、煮られたときの名と区別すべきでもある。それゆえ、よく考察しなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 605
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-72-004
  section: 72
  paragraph: 4
  source_en: It behoves me now to exhibit to you the quantity of the fire, and the numbers of its days,
    and the diversity of intensity thereof in every grade, so that he who shall possess this book may
    belong unto himself, and be freed from poverty, so that he shall remain secure in that middle way
    which is closed to those who are deficient in this most precious art. I have seen, therefore, many
    kinds of fire. One is made out of straw and cinder, coals and flame, but one without flame.
  translation_ja: 今、私は火の量、その日数、そして各段階における強さの違いを示すべきである。この書を持つ者が自立し、貧困から解放され、この最も貴い術に欠ける者には閉ざされた中道に、安全にとどまれるようにするためである。さて、私は多くの種類の火を見た。一つは藁と焼滓、炭と炎から作られるが、炎のないものもある。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 606
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-72-005
  section: 72
  paragraph: 5
  source_en: Experiment shows that there are intermediate grades between these kinds. But lead is lead
    of copper, in which is the whole arcanum. Now, concerning the days of the night in which will be the
    perfection of the most great arcanum, I will treat in its Proper place in what follows. And know most
    assuredly that if a little gold be placed in the composition, there will result a patent and white
    tincture. Wherefore also a sublime gold and a patent gold is found in the treasuries of the former
    philosophers.
  translation_ja: 経験は、これらの種類の間に中間の段階があることを示す。しかし鉛は銅の鉛であり、その内に秘義全体がある。さて、最も偉大な秘義の完成がある夜の日数については、この後の適切な箇所で論じよう。そして、配合物に少しの金を入れると、明らかな白い着色剤が生じることを、最も確かに知りなさい。それゆえ、以前の哲学者たちの宝庫には、高められた金も、明らかな金も見いだされるのである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 607
  notes:
  - この後の適切な箇所で論じるという予告は、本文のまま残す。後続内容を補作しない。
  source_language: en
  target_language: ja
  kind: body
- id: turba-72-006
  section: 72
  paragraph: 6
  source_en: Wherefore those things are unequal which they introduce into their composition. Inasmuch
    as the elements are commingled and are turned into lead of copper, coming out of their own former
    natures, they are turned into a new nature. Then they are called one nature and one genus. These things
    being accomplished, it is placed in a glass vessel, unless in a certain way the composition drinks
    the water and is altered in its colours. In every grade it is beheld, when it is coloured by a venerable
    redness.
  translation_ja: それゆえ、彼らが配合物へ導入するものは不等である。元素は混ざり合って銅の鉛へ変わり、それぞれ以前の自然を離れて、新しい自然へ変えられる。そのとき、一つの自然、一つの類と呼ばれる。これらが達成されると、それはガラス容器に置かれる。ただし、ある仕方で配合物が水を飲み、その色を変える場合は別である。尊い赤さに染められるとき、あらゆる段階においてそれは見られる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 608
  notes:
  - unless in a certain way … は1896年版にもある難解な接続。until 等への無断訂正はせず、意味の不確かさを残した。
  source_language: en
  target_language: ja
  kind: body
- id: turba-72-007
  section: 72
  paragraph: 7
  source_en: 'Although concerning this elixir we read in the sayings of the philosophers: Take gold, occurring
    frequently, it is only needful to do so once. Wishing, therefore, to know the certitude of the adversary,
    consider what Democritus saith, how he begins speaking from bottom to top, then reversing matters
    he proceeds from top to bottom.'
  translation_ja: このエリクシルについて、哲学者たちの言葉の内に「金を取れ」がたびたび現れるのを読むが、そうする必要があるのは一度だけである。したがって、反対者について確かなことを知りたいなら、デモクリトスが何を言うか、どのように下から上へ語り始め、それから順序を逆にして上から下へ進むかを考えなさい。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 609
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-72-008
  section: 72
  paragraph: 8
  source_en: 'For, he said: Take iron, lead, and albar for copper, which reversing, he again says: And
    our copper for coins, lead for gold, gold for gold of coral, and gold of coral for gold of crocus.
    Again, in the second place, when he begins from the top to the bottom, he saith: Take gold, coin,
    copper, lead, and iron; he shews, therefore, by his sayings that only semi-gold is taken.'
  translation_ja: というのも彼は、銅の代わりに鉄、鉛、アルバルを取れと言い、それを逆にして、再びこう言うからである。貨幣の代わりにわれわれの銅を、金の代わりに鉛を、珊瑚の金の代わりに金を、クロクスの金の代わりに珊瑚の金を取れ、と。また第二に、上から下へ始めるとき、金、貨幣、銅、鉛、鉄を取れと言う。したがって、その言葉によって、半ばの金だけが取られることを示している。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 610
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-72-009
  section: 72
  paragraph: 9
  source_en: 'And without doubt gold is not changed into rust without lead and copper, and unless it be
    imbued with vinegar known by the wise, until, being cooked, it is turned into redness. This, therefore,
    is the redness which all the Philosophers signified, because, how ever they said: Take gold and it
    becomes gold of coral; Take gold of coral and it becomes purple gold - all these things are only names
    of those colours, for it behoves them that vinegar be placed in it, because these colours come from
    it.'
  translation_ja: そして疑いなく、金は鉛と銅なしには錆へ変わらず、また、賢者たちの知る酢で浸され、煮られて赤さへ変わるのでなければ、錆へ変わらない。したがって、これこそすべての哲学者たちが意味した赤さである。彼らがどのように「金を取れ、すると珊瑚の金となる」「珊瑚の金を取れ、すると紫の金となる」と言ったにせよ、これらすべては、それらの色の名にすぎないからである。その内に酢を入れねばならない。これらの色はそこから来るからである。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 611
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-72-010
  section: 72
  paragraph: 10
  source_en: But by these things which the Philosophers have mentioned under various names, they have
    signified stronger bodies and forces. It is taken, therefore, once, that it may become rubigo and
    then vinegar is imposed on it. For when the said colours appear, it is necessary that each be decocted
    in forty days, so that it may be desiccated, the water being consumed; finally being imbued and placed
    in the vessel, it is cooked until its utility appear.
  translation_ja: しかし哲学者たちは、さまざまな名で言及したこれらのものによって、より強い物体と力を意味した。したがって、それはルビゴとなるために一度取られ、それから酢を加えられる。その色が現れると、水が消費されて乾くよう、各々を四十日間煮詰める必要があるからである。最後に浸され、容器に置かれ、その有用性が現れるまで煮られる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 612
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-72-011
  section: 72
  paragraph: 11
  source_en: Its first grade becomes as a citrine mucra, the second as red, the third as the dry pounded
    crocus of the vulgar. So is it imposed upon coin.
  translation_ja: 第一の段階は黄色のムクラのように、第二は赤いもののように、第三は通常の乾いた、砕かれたクロクスのようになる。そのようにして、貨幣に加えられる。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 613
  notes: []
  source_language: en
  target_language: ja
  kind: body
- id: turba-73-001
  section: 73
  paragraph: 1
  source_en: Agmon saith:- I will add the following by way of a corollary. Whosoever does not liquefy
    and coagulate errs greatly. Therefore, make the earth black; separate the soul and the water thereof,
    afterwards whiten; so shall ye find what ye seek. I say unto you that whoso makes earth black and
    then dissolves with fire, till it becomes even like unto a naked sword, who also fixes the whole with
    consuming fire, deserves to be called happy, and shall be exalted above the circle of the world.
  translation_ja: アグモンは言う。結びとして、次のことを付け加えよう。液化と凝固を行わない者は、大いに誤る。したがって土を黒くし、その魂と水を分離し、その後白くしなさい。そうすれば、求めるものを見いだすであろう。私はあなたがたに告げる。土を黒くし、それから抜き身の剣そのもののようになるまで火で溶かし、さらに焼き尽くす火で全体を固定する者は、幸いな者と呼ばれるに値し、世界の円環を超えて高められるであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 615
  notes: []
  source_language: en
  target_language: ja
  kind: conclusion
- id: turba-73-002
  section: 73
  paragraph: 2
  source_en: This much concerning the revelation of our stone, is, we doubt not, enough for the Sons of
    the Doctrine. The strength thereof, shall never become corrupted, but the same, when it is placed
    in the fire, shall be increased. If you seek to dissolve, it shall be dissolved; but if you would
    coagulate, it shall be coagulated. Behold, no one is without it, and yet all do need it! There are
    many names given to it, and yet it is called by one only, while, if need be, it is concealed.
  translation_ja: われわれの石を明かすことについて、これだけ述べれば、教えの子らには十分であると、われわれは疑わない。その力は決して損なわれず、火に置かれると増す。溶かそうとすれば溶け、凝固させようとすれば凝固するであろう。見よ、誰もこれを持たない者はいない。それでも皆がこれを必要とする。多くの名が与えられていながら、ただ一つの名で呼ばれ、必要とあれば隠される。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 616
  notes: []
  source_language: en
  target_language: ja
  kind: conclusion
- id: turba-73-003
  section: 73
  paragraph: 3
  source_en: It is also a stone and not a stone, spirit, soul, and body; it is white, volatile, concave,
    hairless, cold, and yet no one can apply the tongue with impunity to its surface. If you wish that
    it should fly, it flies; if you say that it is water, you Speak the truth; if you say that it is not
    water, you speak falsely. Do not then be deceived by the multiplicity of names, but rest assured that
    it is one thing, unto which nothing alien is added. Investigate the place thereof, and add nothing
    that is foreign.
  translation_ja: またそれは、石であり石でなく、霊、魂、身体である。それは白く、揮発し、くぼみ、毛がなく、冷たいが、誰もその表面に舌を当てて無事ではいられない。飛ぶことを望めば飛ぶ。水であると言えば真実を語り、水でないと言えば偽りを語る。したがって多くの名に欺かれず、異質なものは何一つ加えられない一つのものであると確信しなさい。その場所を探究し、異質なものを何も加えてはならない。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 617
  notes:
  - 表面へ舌を当てる記述も歴史的本文の翻訳である。物質の味見や本文の加熱・薬品操作を実行しないこと。
  source_language: en
  target_language: ja
  kind: conclusion
- id: turba-73-004
  section: 73
  paragraph: 4
  source_en: Unless the names were multiplied, so that the vulgar might be deceived, many would deride
    our wisdom.
  translation_ja: 俗人を欺くために名が増やされていなかったなら、多くの者がわれわれの叡智を嘲笑するであろう。
  source_url: https://sacred-texts.com/alc/turba2.htm
  transcription_line: 618
  notes: []
  source_language: en
  target_language: ja
  kind: conclusion

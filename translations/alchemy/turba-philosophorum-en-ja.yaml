schema_version: '1.0'
work_id: turba-philosophorum-waite-1896-en-ja
title_ja: 哲学者たちの集会
title_original: Turba Philosophorum
source_language: en
target_language: ja
source_translator: Arthur Edward Waite
source_translation_year: 1896
translation_route: 1896年A. E. Waite英訳 → 日本語。ラテン語からの直接訳ではない。
edition_status: 全72発言・序書簡・結語の全文対訳読書版。専門家による批判校訂版ではない。
scope:
  included: 1896年版の印刷1〜207頁にある作品本文：冒頭標題、アリスレウスの書簡、全72発言、結語。
  excluded: Waiteによる近代の編集序文（ローマ数字i〜iv頁）、脚注の異本校合・解説、巻末索引、およびWebサイトの現代の案内・重複掲載。
  clarification: 作品本文の全訳であり、Waite版の編集装置まで含む全巻翻訳ではない。本文内の括弧・角括弧によるWaiteの別読は残した。
transcription_policy: Internet Sacred Text Archiveの二部から全本文を取得し、同ページ内の重複掲載を除去。1896年版のPDF/OCRで書誌、72発言の見出し、本文の始終、曖昧箇所を照合した。すべての印字を画像で再校訂した版ではない。文中改行3か所を結合し、明白な転記誤り7か所を注記して校整。段落区分と固定IDは本読書版のもの。
translation_policy: 各英語段落に全文日本語訳を対応させた新訳。反復や対話を省略せず、要約へ置き換えない。錬金術語・固有名の揺れや難解な構文を保持し、確定できない物質名や数値関係を補わない。
safety_note: 歴史的文献を読むための版。金属・水銀・鉛・石黄等の加熱、密閉容器の操作、味見、服用を実行するための手引きではない。自然哲学・医学・物質変成に関する主張は歴史的記述であり、現代科学による裏付けを意味しない。
id_policy: turba-title-001〜002、および turba-SS-PPP。SS=00は書簡、01〜72は各発言、73は結語。PPPは段落順。HTML、内蔵JSON、YAMLで同じIDを共有する。

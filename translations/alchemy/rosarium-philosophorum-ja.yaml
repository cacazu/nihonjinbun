  "translation_ja": "真に清められたのち、その大部分が水銀であると認める。だからそれは付帯的にしか燃えない。この言葉はきわめて貴い。しかし、これはすべて自然によってなされたものであり、ある愚者たちが昔も今も考えるように、何らかの技巧で作れると信じてはならない。賢者の石は、自然によってすでに作られたものとして見つかるからである。いと高き神にかけて、そのうちの余剰物を取り除く以外には、何も必要としない。ゆえにその質料を調製し、純粋なものを取り出し、土的で汚れたものを除け。そこで哲学者トゥディアヌス。「知れ。私たちの石は、顕れた面では空気的で揮発性、冷たく湿っており、隠れた面では熱く乾いている。顕れた面にあるその冷たさと湿りは、水性の蒸気であり、自らとあらゆるものを腐らせ、黒くし、破壊し、火から逃れる。隠れた面にある熱と乾きは金、熱く乾いた金であり、最も清浄な油である。それは身体へ浸透し、逃げない。錬金術の熱と乾きこそが染め、ほかのものは染めないからである。それゆえ、顕れた面にある冷たさと水性の湿りを、隠れた面にある熱と乾きの対とせよ。そうして両者がともに適合し、結合し、一つになって浸透し、染め、深く」"

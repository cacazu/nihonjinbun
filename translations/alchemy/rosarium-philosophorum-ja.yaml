  "source_text": |-
    Scire debes quod ex plumbo philosophorum extrahitur quoddam oleum aurei coloris, vel quasi, cum quo si lapidem mineralem, vegetabilem vel animalem, vel mixtum post fixionem primam sublimaveris tribus aut quatuor vicibus, excusabit te ab omni labore solutionum & coagulationum.
    Ratio est, quia hoc est oleum occultum quod facit medicinam penetrabilem, amicabilem & coniungibilem omnibus corporibus, & augmentabit eius effectum ultra modum, sic quod in mundo non est eo secretius.
    Unde mirabilia dico, quae omnibus antiquis philosophis incredibilia forent, scilicet quod si sciveris oleum hoc bene ab aqueitate separare, et laboraveris in modo mixtionis iam dicto, poteris in triginta diebus lapidem componere.
    Hoc autem non est necessarium per se, quoniam solutiones & coagulationes illius (ut dictum est) cito fiunt.
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"

    Modo sequitur quartum verbum, et est, quod aqua quae cum terra fuerit, inspissata & coagulata ascendat sublimatione. Sic habes terram, aquam, & aërem. Et hoc est quod dicit Philosophus: Ipsum dealbate, & cito igne sublimate, quousque ex eo exeat spiritus quem in eo invenies, qui dicitur avis aut cinis Hermetis. Unde & Morienes ait: Cinerem ne vilipendas, nam ipse est diadema cordis tui, & permanentium cinis. Et in libro turbae dicitur: Ignis regimen augmentate, quia post albedinem pervenitur ad cinerationem, quae dicitur terra calcinata. Unde dicit Morienes: In fundo remanet terra calcinata, quae est naturae igneae. Et sic habes in praedictis proportionibus quatuor elementa, puto aquam dissolutam, terram dealbatam, aërem sublimatum, & ignem calcinatum.
    De istis quatuor elementis dicit Aristoteles, in libro de regimine principiorum. Cum habueris aquam ex aëre, & aërem ex igne, & ignem ex terra, tunc plenam habebis artem philosophiae. Et hic est finis primae compositionis, ut Morienes dicit.
    Pacientia & mora sunt necessariae in nostro magisterio. Festinantia quidem ex parte diaboli est in hoc magisterio.

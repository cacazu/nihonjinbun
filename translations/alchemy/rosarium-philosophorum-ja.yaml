  "translation_status": "draft"
- "id": "ROS-139-T03"
  "section_id": "section-4"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Differentia est inter tincturam aquae et olei, quia aqua abluit tantum et mundat, oleum vero tingit & colorat. Exemplum autem huius est quia si pannus mergatur in aquam, mundatur ab ea, & quando desiccatur, aqua recedit, & pannus manet in statu suo, & in colore suo in quo prius erat, nisi quod est magis mundus. Econtra est in oleo quia si intingatur pannus in eo non separatur ab eo per calorem ignis vel aeris, nisi ex toto id destruat"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 139
  - "source_id": "source-1"
    "precision": "page"

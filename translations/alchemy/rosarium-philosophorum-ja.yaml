  "translation_ja": |-
    ここに、富める高貴な女帝が生まれた。
    哲学者たちは皆、彼女を自分たちの娘のように呼ぶ。
    彼女は増え、数知れぬ子を生む。
    その子らは不死で、清らかで、どんな汚れもない。
    彼女は死を追い払い、貧しさを憎む。
    富、健康、名誉、財を与える。
    金、銀、貴い宝石にも、
    大小すべての薬にもまさる。
    地上に彼女と等しいものはない。
    このことに、私たちは天国の神へ感謝する。
  "translation_status": "draft"

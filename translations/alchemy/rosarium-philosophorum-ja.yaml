    Argentum vivum adustionem non habet. Est ergo eius depuratio terrestreitatis et aquositatis remotio per ingenium, quod si fuerit purum coagulabit illud vis sulphuris albi non urentis in argentum, & illa est res optima ut per artificium ex eo fiat elixir ad argentum. Si autem fuerit sulphur rubeum optimum naturae non urentis erit res optima, ut fiat ex eo elixir ad aurum. Tale sulphur est sulphur nostrum & sapientum, & non reperitur super terram nisi quod ex illis corporibus extrahitur. Arnoldus: Sulphur quod est occultum in argento vivo est, dans formam auream ipsi argento vivo per virtutem coloris sulphuris mineralis eius extrinseci. Avicenna: Tale sulphur non reperitur super terram, nisi illud quod est in corporibus. Ideo corpora illa subtiliter praeparentur ut sulphur habeamus super terram. Nam corpus perfectum per nostrum magisterium iuvat et perficit imperfectum, sine mixtione alicuius rei extraneae. Alias sulphur cuiuscunque generis fuerit, fusionem rectam impedit, ut patet in ferro, quia non funditur, quia sulphur fixum in se habere dinoscitur. Si vero fixum non fuerit fusionem rectam anticipans, impeditur ab igne et comburitur & evaporat, ut patet in plumbo & in alijs corporibus infirmis. Ideo sulphur vulgare non est de

    Primo quod habeat terram subtilissimam in se, & incombustibilem, aptamque ad figendum omnimode fixam cum suo proprio radicali humore.
    Secundo: humiditatem aëream et igneam, uniformiter coniunctam, sic quod si unum fuerit volatile quod et reliquum. Et quod ipsa humiditas est super omnes humiditates, expectans ignis calorem usque ad sui sufficientis inspissationis cineris complementum quoad indigentiam ipsius cum permanentia inseparabili, terrae scilicet annexae sine evaporatione.
    Tertio, quod humiditatis dispositio naturalis sit talis, quod per beneficium suae homogeneitatis, in omnibus suarum proprietatum differentijs, terram habet annexam conversione utriusque, quia in alterutris homogeneitate sit contemperatum virtuose et unione totali, et vinculo connexionis inseparabilis aequaliter post finalis praeparationis gradum fusionem bonam praestet.
    Quarto, quod haec homogeneitas sit tantae puritatis essentiae, et ab omni re combustibili seu urente artificialiter emundata, quod omnia cum quibus coniungitur per minima non comburat sed a combustione praeservet. Quinto, quod claram et splendidam habeat tincturam in se albam vel rubeam, mundam, et incombustibilem, stabilem et fixam, quod ignis nequaquam valeat ipsam permutare,

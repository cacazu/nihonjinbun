    Unde Hali: Solutio corporis & coagulatio sunt duo, sed habent unam operationem. Quia spiritus non coagulatur, nisi cum solutione corporis. Nec corpus solvitur, nisi cum coagulatione spiritus, & corpus & anima quando coniunguntur agit utrumque in suum simile. Exemplum, cum aqua coniungitur terrae, aqua cum sua humiditate & virtute conatur eam dissolvere, Nam facit eam subtiliorem quam prius erat, & reddit eam consimilem sibi, quia aqua est subtilior terra, similiter facit anima in corpore. Et

  "translation_ja": "〔前頁から続く〕持つ金属であり、鉱物的な部分とはメルクリウスに起源を持たないものである。金属の例は太陽、月、ユピテル、マルス。エレクトルムも含まれる。鉱物の例は塩類、アトラメントゥム類、明礬類、ヴィトリオル、砒素、雄黄である。メルクリウスに由来する金属はすべて展延性と融解性を持つ。その質料は水的実体と土的実体が強く混合したもので、一方を他方から分離できないからである。その水的実体は、熱が作用した後、冷気によってさらに凝結する。それゆえ展延でき、加工できる。水だけで凝結するのではなく、水性を変える土的乾燥を伴う。その中には油状の湿りがなく、凝結は土的乾燥から成るので、強く混じり合った度合いに応じた激しい熱の作用によらなければ容易には融けない。一方、すでに述べたように、メルクリウスに由来しないものが下位または中間の鉱物である。そのうちには湿りによって容易に溶ける塩があり、明礬、普通の塩、サル・アルモニアク、岩塩、あらゆる種類の塩がこれである。また、力を帯び、湿りだけでは容易に溶けないものもあり、雄黄、砒素、硫黄がこれである。硫黄質の物体の水性は、粘る土と強く混じり、熱の沸騰によって……〔次頁へ〕"

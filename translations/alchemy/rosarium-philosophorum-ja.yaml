  "translation_ja": |-
    セニオル、『太陽と月の書簡』。
    「私が述べた水は、天から降りてくる物である。土は自らの湿りとともにそれを受け入れ、天の水は土の水とともに保持される。土の水は、自らの奉仕と砂によってそれを尊ぶ。水が水へ集められ、水が水を保持し、アルビラはアストゥナとともに白くなる。」
    ヘルメス。「霊は、清浄な身体にしか入り込まない。」アルフィディウス。「白さを取り、黒さを捨てよ。」デモクリトス。「特別な洗浄で錫を清め、その黒さと暗さを取り除け。そうすれば、その輝く白さが現れる。」ソリンの著作。「白い火で、抜き身の剣のように見えるまで溶かし、白化によって身体を白く輝かせよ。」ラーシー。「水が銅と混ざると、銅を内側から白くする。この白化を懐胎と呼ぶ者たちもいる。土が白くなるからである。水が支配すると、土は成長して増殖し、そこから新しい子の増大が生じる。」アルフィディウス。「そのとき、黒い土を洗い、熱い火で白くしなければならない。」

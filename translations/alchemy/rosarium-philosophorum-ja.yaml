  "source_text": |-
    ut docet experientia, & continet in se sulphur bonum, maturum, & mundum, tunc possibile est ex eo particulariter fieri solem & lunam.
    Philosophus: admisceatur per artificium alijs metallicis corporibus quia est de natura eorum, & ipsa generata sunt ab eo, & ideo per artificium fieri potest, & imitetur digestam naturam in illud ut cum eis perficiatur & sic quibus complectitur metallis fit simile illis sine aliqua admixtione extranea, cum simpliciter natura gaudet suae naturae & non per aliquod extraneum, sed cum sole fit sol cum luna luna, cum venere venus, &c. cum unumquodque mitit in illud vim suam, & etiam quia in se continet suum sulphur bonum sed immaturum, quod per artem maturatur. Quare alia metalla coagulata & infecta per sulphur adustibile particulariter sicut ipsum, sol & luna fieri non possunt.
    Prima ratio: Si enim in mercurium transformarentur, & admiscerentur cum Sole & Luna tunc ipsorum Mercurius haberet in se illud praehabitum sulphur malum.
    Et si purgaretur, tunc in tantum purgari non posset quod reduceret in Mercurium sicut ante talem simplicitatem. Nec etiam posset corpus per mercurium in eo dissolvi, et cum dissolvi non posset tunc etiam vim seratam in illud mittere non posset.

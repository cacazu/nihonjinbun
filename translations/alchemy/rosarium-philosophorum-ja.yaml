  "translation_ja": "身体の第一質料は、普通のメルクリウスではなく、油性で湿った蒸気である。湿ったものから鉱物の石ができ、油性のものから金属の身体ができるからである。身体はこのような油性の蒸気へ変えられなければならない。この変換において身体は殺され、身体の粒は死へと打ち倒され、完全に死なされる。これは私たちの白と赤の水を仲立ちとしてなされる。そして「麦の一粒が」、つまり身体の粒が、「地に投じられなければ」とは、このように理解せよ。それ自身の第一質料、つまり油性の蒸気、あるいは哲学者たちと賢者たちのメルクリウスへ、ということである、云々。このような蒸気は、書物の諸章で知られる石、私たちの操作における質料の原理、油性の硫黄と呼ばれる。それから、完成において第五精髄、すなわちメルクリウスが取り出され、石が最終的にどのように調製されたかに応じて、あらゆる身体を太陽または月へ染め変える。また注意せよ。古の錬金術の賢者たちは、ほとんどみな多くを述べた末、塩について結論する。それを賢者の石鹸、閉じては開き、また閉じれば誰にも開けられない小さな鍵と呼ぶ。その鍵なしには、誰もこの世でこの学の完成に達しえないと彼らは言う。すなわち、調製した後に塩を焼成する方法を知らなければ、達しえないのである。また彼らは、穏やかな場所に三日間置き、火の熱と"

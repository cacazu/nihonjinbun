  "translation_ja": "その霊が初めにそこから調製された身体とともに捕らえられなければ、それらの何ものも固定してとどまることはない。永続する水、絶えることのない水、あるいは燃える葡萄酒は、身体の水と呼ばれる。すなわち、身体がメルクリウスへ戻された状態である。また、永続する水なしには何もなされず、それは生命の水とも呼ばれる。ゆえに哲学者。「天の神に誓う。この術は、石を絶えず溶解し凝固させること以外の何ものでもない。」また。「燃える葡萄酒だけで、完全なエリクシルを完成することができる。」哲学者たちの水はヘルメスの器と呼ばれ、それについて哲学者たちはこう書いた。「私たちの水のうちで、あらゆる操作、すなわち昇華、蒸留、溶解、焼成、固定が行われる。それらは、人工の器の中で行うかのように、この水のうちで行われる。これこそ最大の秘密である。」水は賢者たちの重さである。それゆえ仕事の全体には、水と火があれば足りる。私たちの水は火より強い。火にはできない、金の身体から純粋な霊を作ることができるからである。それに比べれば火は、普通の火に対する水のようなものである。ゆえに哲学者たちは言う。「私たちの銅を最も強い火で焼け。」アリストテレスは『君主の統治』で、四元素についてアレクサンドロスに言う。「空気、すなわち太陽から水、すなわちメルクリウスを得、火から空気、すなわちメルクリウスの霊を得、土、すなわち月のものから火、すなわちメルクリウスを得たなら、そのときおまえは完全に術を持つ。」そこで哲学者。「私たちの石は土へ移り、土は水へ、水は空気へ、空気は火へ移る。そこに」"

  "source_text": "Solvere grossum in simplum & subtiliare, abluere obscurum in lucidum, reducere humidum in siccum, figere volatile supra corpus fixum. Solvere est dividere corpora & materiam vel naturam primam facere, abluere est inhumare distillare & calcinare. Reducere est impinguare, incerare vel impraegnare, subtiliare. Figere est desponsare, resolvere, & coagulare. Per primum mutatur natura interius, per secundum exterius, per tertium superius, per quartum inferius."

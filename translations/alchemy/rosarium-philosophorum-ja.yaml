    intrabit in artem, quia unum tantum est recipe, unum corpus non intrat alterum. Gratianus, Accipe hoc & hoc, & fac sic & sic, & habebis hoc, & illud est verum apud omnes Philosophos. Unde Philosophus: Primum verbum recipe recipe, multos errores fecit. Ideo primum opus est dissolvere rem lapidis, id est, Mercurium non vulgi. Arnoldus: Fatui autem intelligentes ad literam dicta philosophorum cecutiunt, et non invenerunt nisi mendatium & tunc dicunt: falsa est scientia, quia tentavimus et nihil invenimus. Et tunc sunt sicut desperati, & vilipendunt libros & scientiam: Et ideo scientia vilipendit eos quia scientia nostra de occultis naturae, non habet inimicum nisi ignorantem. Versus:
    Hic lapis exilis extat precio quoque vilis,
    Spernitur a stultis amatur plus ab edoctis.
    Sicut & Alphidius dicit: Scito quod hunc lapidem, de quo hoc arcanum agitur, Deus non posuit magno precio emendum, quoniam in via eiectus invenitur, quatenus tam a paupere quam a divite haberi possit, ut ratione & scientia ad eum quisque possit leviter pervenire. Argentum vivum non est lapis. Unde Constantinus: quia fusibilis ergo non est lapis. Argentum vivum est ignis, unde Philosophus: Scitote ergo, quod argentum vivum est ignis, corpora comburens magis quam ignis.

    Sed quid dicitis de hoc quod dicunt Philosophi, scilicet: Aurum nostrum non est aurum vulgi, & argentum nostrum non est argentum vulgi. Dico quod ipsi dicunt aquam aurum, id quod virtute ignis ad superiora ascendit. Et vere istud aurum non est aurum vulgi, vulgus namque non crederet ipsum posse ascendere ad superiora propter suam fixionem. Scias insuper quod talis per deum consuevit esse modus Philosophorum, semper scilicet, quod in passu certissimo claudicare, et rem quasi dictam quandoque per typos et figuras, & quandoque per verba methaphorica, et quandoque per falsam et alienam practicam occultare, et ubi se verum dixisse sentiebant, se tunc similitudinarie locutos fuisse dicebant. Unde Geber dicit: Ubicunque aperte locuti sumus ibi nihil diximus. Sed ubi sub aenigmate aliquid posuimus et

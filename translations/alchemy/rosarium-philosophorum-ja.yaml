  "origin": "source"
  "source_text": "per ignem fortissimum, intellige ignem putrefactionis, & mercurij nostri, quo tantummodo corpus elevatur, id est in spiritum convertitur, cum ergo levata fuerit, reiteretur eius sublimatio, quousque administratione reiterationis figatur totum. Et fixum solutum, id est ad acetum pone ut supra, quater omnia reiterando, ut habes satis supra declaratum. Et solutum volatile, quasi dicat, quod per solutionem lapis fit volatilis. Et iterum, volatile fixum facias, sic enim continuat se philosophus, haec in capite quinquagesimo septimo, &c. quousque fusionem praestet vel fluat. Capitulum decimum: Opus hoc ne est ad album vel ad rubeum? Respondet Adamarus: Ad utrunque, sic enim scribitur in capitulo sexagesimo sexto, quod lapis lunaris & solaris, sunt idem in essentia, quia ex solo mercurio perficitur uterque est etiam una via in modo agendi, quia per easdem operationes & eodem ordine operatur, est ergo una medicina secundum omnes philosophos, differunt tamen fermentatione."

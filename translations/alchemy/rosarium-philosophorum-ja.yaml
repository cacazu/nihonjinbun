    tertij, in medicina resultat bonitatis alterationis multiplicatio. Ex diversitate igitur reiterationis operis super lapidem in gradibus suis resultat multiplicationis bonitatis alterationis diversitas, ut ex medicinis quaedam quidem septuplum, quaedam vero decuplum, & quaedam centuplum, quaedam vero millesimum & quaedam in infinitum solificum, et verum perfectionis lunificum transmutet corpus. Ab hinc igitur & ultimo tentetur, utrum in perfectione consistat magisterium.
    Attendat ergo quis proprietates actionis seu modos compositionis elixir maioris, nos enim quaerimus substantiam unam facere, tamen ex pluribus aggregatam, coadunatam, fixam, quae super ignem posita ignis eam non exprimat, & liquatis permisceatur & liquescat cum ipsis, cum eo quod est in ea de substantia ingressibili, & permisceatur cum eo quod est de substantia permiscibili, et consolidetur cum eo quod est de substantia consolidativa, & figatur cum eo, quod est de substantia fixativa, & non comburatur ab his quae comburunt aurum & argentum, et afferat consolidationes cum ignitione debita et perfecta.

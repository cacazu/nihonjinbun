    Nota, omne sal bene praeparatum, redit ad naturam salis armoniaci, & totum secretum est in sale comuni praeparato. Nota: Vitriolum Romanum habet naturam lapidis metallorum, & est calidum et siccum. Item: Alumen videtur esse Mercurius coagulatus, sed deficit a suo complemento, calidum & humidum, & dicitur compar unius, id est Mercurius. Qui ergo scit salem & eius solutionem, ille scit secretum occultum Antiquorum Sapientum. Pone ergo mentem tuam super salem nec cogites de alijs. Nam in ipsa sola occultatur scientia & arcanum praecipuum, & secretissimum omnium Antiquorum Philosophorum.

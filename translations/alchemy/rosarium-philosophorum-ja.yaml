    tionem fit vera medicina uniformis, & propter hoc illa copulatio causatur a subtilibus partibus transmutatis & alteratis in formam & essentiam spiritualem, quia scriptum est quod corpus grossum cum simplici, & simplex cum grosso propter earum contrarietatem se coniungere non possunt, nisi grossum convertatur in subtilitatem suam per suum simplicem spiritum, & tunc sint commiscibilia simul, & hoc notificant philosophi declarando cuidam filio veritatis, & dicunt quod perfecta mixtura est commiscibilium alteratorum corporum per indivisibilia sibi iunctorum unio, quia illa hic requiruntur per patentem rationem, quod mixtio sive unio non potest fieri sine alteratione, quae est subtiliatio corporis & reductio in formam spiritualem.
    Et de illa parte dicunt Philosophi, quod iam medicina completa est ab una manerie in aliam maneriem cristallinam, & tunc apparebit quod illa lamina composita est de subtilibus partibus naturalibus, per naturale ingenium uniformiter coniuncta, sine divisione illarum partium, per modicum & iterum modicum, quia talis causa non potest fieri sine subtiliatione & homogeneitate naturae. Et propter hoc convenit quod veniat illa materia ita subtilis quod omnes partes in natura aequales sint mixtae cum aqua. Et

    Sales & alumina non sunt lapis sed adiutores lapidis. Qui non gustaverit saporem salium nunquam veniet ad optatum. Fermentum fermenti, fermentat etenim finitum per excellentiam. Tale superius quale inferius. Combure in aqua, lava in igne. Coque & recoque, & iterum coque. Saepissime humare & semper coagulare. Interfice vivum & resuscita mortuum. Et hoc septena vice. Et habebis vere quod quaeris, si scis regimen ignis. Sufficit tibi Mercurius & ignis. Versus. Aes nostrum si bene scis sufficit si caetera nescis.

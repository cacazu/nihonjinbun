  "translation_ja": |-
    その後、溶解力のあるものによって溶かす。この水は私たちの石であり、水銀からの水銀、硫黄からの硫黄、霊的な物体から取り出され微細化、すなわち希薄化されたものだからである。その同じ類から作られた他の調製物を用いて元素的な力を強め、色、固定、重量、純粋さ、融解、その他、完全なエリクシルに属するすべてを増すことで、これは改善できる。これが、私たちだけによって探り当てられた、鉱物的物体一般の調製、精製、微細化、改善の方法である。
    エリクシルの増殖は二つの方法で行われる。一つは石の溶解と凝結の反復によって。第二は、最初の石であるエリクシルを白または赤の物体の上に、その物体自身も薬へ変わるだけの量、投射することによってである。その後、それらを一緒に、それ自身の水と溶媒の中へ溶解のために入れる。こうして最初のエリクシルが、そのティンクトゥラの発酵素となる。パンを焼く女たちも、このようにする。

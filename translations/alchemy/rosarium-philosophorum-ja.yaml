    Unde Maria soror Moysi dicit. Matrimonifica gummi cum gummi, vero matrimonio, & fac illa sicut aquam torrentem. Astanus: Spiritus non coniunguntur corporibus donec perfecte fuerint depurati. Et in hora coniunctionis maxima apparent miracula. Tunc enim corpus imperfectum coloratione firma coloratur fermento mediante, quod fermentum est anima corporis imperfecti. Et spiritus mediante anima cum corpore coniungitur & ligatur, & cum ea simul in colorem fermenti convertitur, et fit unum cum eis. Basius dicit: In perfecto magisterio lapides non recipiunt se adinvicem, nisi utrique prius fuerint mundati. Non enim recipit corpus spiritum, neque spiritus corpus, ita quod spirituale fiat corporeum, vel corporeum spirituale, nisi prius fuerint ab omni sorde depurati perfectissime. Senior: O Sol tu mei indiges sicut gallus gallina indiget & ego indigeo opere tuo.
    Alexander in secretis naturae. Scias quod nullus natus nascitur, nisi ex viro & muliere.

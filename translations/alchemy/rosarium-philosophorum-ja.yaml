  "translation_ja": |-
    男と女が完全に結合し、一方が他方を受け入れるまでは、起こってはならない。そのしるしは、工夫によって完全に溶解したものの表面にある。最初の混合または結合において、女がその色で優勢となるため、アゾートが白く見えるとしても、腐敗においては火の恩恵によって両者とも黒くなる。湿ったものの中の熱を増す火によって黒いものが腐敗する。それこそティンクトゥラであるから、保存すべきである。大いなる秘密。強水の中で腐敗した金の本性は、あらゆる本性にまさる。ゆえに石の組成においては、いかなる石も力において鉱物の石にまさらないと注意すべきである。哲学者。「男と女から円を作り、そこから四角形を取り出し、四角形から三角形を取り出し、円を作れ。そうすれば賢者の石を得る。」
    ゲベルは『試験の書』で、太陽と月を術によって一緒に身体化すれば、容易には分かれないと証明している。このように一方は他方を求める。一方が乾き、他方が湿っているからである。そして一方が他方を得ると、きわめて強い絆で互いを抱き、互いを保持するため、一方を他方から容易には引き離せなくなる。一方が霊的、すなわち薬的であり、その霊性によって染色にかかわるものであれば、この結合はいっそう強くなる。金は現実態において金であり、質料そのものである。

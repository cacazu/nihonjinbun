  "source_text": "sive effectus per distillationem melioratur, de eorum mundatione & depuratione sufficienter tractavimus, cum quibus corpora imperfecta praeparari possunt, & depurari, & meliorari, & subtiliari igneque semper debito mediante, praeparantur enim & depurantur per ista, ad intentionem ignis per hunc modum. Habent enim haec corpora imperfecta humiditates superfluas, & sulphureitatem adustibilem nigredinem in ipsis admiscendis generantem, ipsa praedicta corpora corrumpentem. Habent enim terrestreitatem immundam feculentem, et combustibilem, nimis grossam, ingressionem impedientem, et fusionem, ista et talia sunt superflua in his corporibus praedictis, quae in ipsis nostra experientia et investigatione, certa & ingeniosa sunt inventa, & quia haec superflua, accidentaliter his superveniunt corporibus, & non radicaliter, ergo et spoliatio accidentalium possibilis est, oportet ergo nos cum igne artificiali, his praedictis mundandis & superflua demere accidentia cuncta, sola substantia argenti vivi, & sulphuris radicalis permanente, & haec est integra praeparatio imperfectorum & depuratio perfecta, melioratio, depuratio, & subtiliatio horum vel huius substantiae purae remanentis fit multis modis secundum quod indiget elixir praeparationis, ergo & depurationis"

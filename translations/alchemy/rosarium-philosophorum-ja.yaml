    Phisicorum: ridiculum est ex perfecto facere imperfectum melius.
    Bonellus philosophus: Aes quod praedixi non est Aes neque stannum vulgi, sed est verum opus nostrum. Quia oportet corpori magnesiae misceri ut coquatur & teratur cum aqua vitae, donec diruatur. Habere autem vos oportet huius filij artis aquam multam, & hoc continuo, donec per partes aquae apposuisti, et maxima pars terrae fuerit soluta. Avicenna, Quod fit spirituale in vase sursum ascendit. Quod vero spissum et grossum in vase remanet deorsum. Et nisi corpus ita denigraveris & destruxeris, donec aqua non vult misceri ei, vel recipi a terra nihil consequeris. Nam quando fit pulvis spiritualis in vase manet deorsum. Ideo nisi omnia vertas in pulverem spiritualem nondum eam contrivisti. Et quod facis in albo corpore fac et in rubeo, quia haec medicina est in essentia una, & in modo agendi similiter una.

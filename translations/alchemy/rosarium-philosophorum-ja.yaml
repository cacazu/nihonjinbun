  "translation_ja": "「自らのうちに身体、霊、魂を持つ。』同じ箇所に、『理由はこのようである。男と女を一緒に煮て、凝固し石となるまで続けよ』とある。また、私たちのエリクシルは鉱物からしか作られないと注意すべきである。さらに告げる。竜は兄弟と姉妹とともに殺されなければ死なない。一方だけではなく、両者が同時に必要である。兄弟は太陽、姉妹は月である。最後にアルノルドゥスは言う。『哲学者たちが石について語ったことは、何であれ真実だった。言葉の力については、ふさわしくない者から隠すために語った。しかし意図の力については、ふさわしい者に語り、つねに真実を語った。哲学者たちは、このような事柄が神秘的に伝えられるべきだと知っている。詩が物語や寓言を通じて伝えられるように。そしてマクロビウスが言うように、哲学者たちが大いなる事柄を語るとき、譬え話や物語は混ぜない。』」"

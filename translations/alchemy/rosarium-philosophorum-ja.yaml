  "translation_ja": |-
    〔前頁から続く〕そして非物体的な復活によってである。その後はもう死ぬことができないからである。復活の後には永遠の栄光と力を持つ。そのとき、私たちの歩みを知るすべての者は、大きな繁栄のうちに喜ぶであろう。
    ここに神の貴い賜物が完成する。それは世のあらゆる学問の奥義にまさり、比類のない宝の中の宝である。プラトンのいうとおり、この神の賜物を持つ者は世界の支配権を持つ。富の極みに至り、自然の縛めを断ち切ったからである。ただし、それはあらゆる不完全な物体を最も純粋な太陽または月に転じる力を持つからだけではない。むしろ、人間とあらゆる動物の健康を守り保つからである。白いエリクシルである水晶状の薄板は、芥子一粒ほどを熱病の者に与えるなら、その者を治す。また、癩病の者も、一年の四季を通じて同じ薄板によって浄められ、さらに金を生む赤い粉で年に二度、三月と九月に浄められるなら、治癒する。白い粉と赤い粉の双方は、死の危険にある坐骨神経痛の者を治し、麻痺をも治す。また出産に苦しむ者の鼻のところに粉を保てば、その者は解放される。ヘルメスはこのようにいう。ゲベルもいう。赤いエリクシルは医師が絶望したあらゆる慢性病を治し、人を鷲のように若返らせ、五百年にわたり生きさせる。〔次頁へ〕
  "translation_status": "draft"
  "source_kind": "prose"

  "source_text": "album reddit ipsum, postea rubeum. Unde scias quod nulla fit tinctura vera nisi ex Aere nostro. Coque ergo ipsum cum sua anima, tere, coque, reitera donec spiritus coniungatur cum suo corpore, et unum fiant & habebis intentum. Sapientes autem multa nomina illi imposuerunt, sed tu considera illam solam rem quae argento vivo & corporibus adhaeret, & habebis scientiam veram. Sed ut non erres, scias quid sit adhaerere in corporibus. Aliqui dixerunt, quod argentum vivum vulgi adhaeret in corporibus, quod est falsum. Putant enim se intelligere capitulum Gebris de argento vivo, ubi dicit: Cum in rebus caeteris exquaerentes, non invenimus inventione nostra rem aliam magis quam argentum vivum corporum naturis amicari etc. Hoc autem totum intelligendum est de argento vivo philosophico, Ipsum enim solum adhaeret in corporibus, et nullam aliam rem invenire potuerunt Philosophi antiqui, nec Moderni invenient aliam rem quae corporibus adhaeret nisi argentum vivum philosophicum. Quoniam argentum vulgare non adhaeret in corporibus, imo corpora adhaerent ipso argento vivo. Et hoc est verum per experientiam, quia si coniungitur argentum vivum vulgi cum aliquo corpore, argentum vivum manet in natura propria, aut recedit et non vertit corpus in"

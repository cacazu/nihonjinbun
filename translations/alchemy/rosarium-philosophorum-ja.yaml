    霊的な精妙さである。それは溶融すると水のように細微で流動し、変化させる物の深部まで浸透する。第二段階として、薬の溶融の直後には、その侵入が必要だからである。
    第三はエリクシルと変成される物との親和性、すなわち近接性である。それは自らに似たものと出会う際に密着と保持を与える。第三段階として、薬の侵入の直後には、適切な付着が必要だからである。
    第四は根源的で火的な湿りである。それは、類似したものの付着と、互いに似たすべての部分の結合によって、保持された部分を凝結し、永久に分かれぬよう固める。第四段階として、付着ののちには、粘り気のある根源的な湿りによって諸部分を固めることが適切かつ必要だからである。
    第五は純粋さ、すなわち清められた明澄さであり、燃焼のうちにあるものへ際立った輝きを与える。凝固ののち、残された腐敗した部分は結合しない。現実に作用する火が、凝固していない外来の余剰物をすべて焼き尽くすためである。したがって腐敗がただちに続き、それは必要である。
    第六は固定する土である。それはほどよく調整され、細微かつ精妙で、固定され、不燃性であり、固定の永続性を与える。溶解の際にも付着し、対象とともにとどまり、火に抗して存続する。第六段階として、浄化ののちの固定が必要かつ適切だからである。

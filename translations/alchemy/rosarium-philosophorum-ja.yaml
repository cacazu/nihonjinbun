    Item, Cum dicitur quod apparent omnes colores. Verum est, quia ante fermentationem in calcinationibus dissolutionibus et fixationibus apparent omnes colores. Item lumen luminum sic ait: Et scitote quod eadem sunt, quae dealbant et rubificant intrinsecus & extrinsecus, scilicet sol, luna, Mercurius. Quae tria dissoluta & fermentata appellat argentum vivum, dicens argentum

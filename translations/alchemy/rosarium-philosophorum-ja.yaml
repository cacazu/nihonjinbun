  "translation_ja": "火にはさまざまな種類があり、その性質も異なり、いくつかの段階によって区別される。ある火は第一度に熱く、第二度に湿っている。すなわち馬の腹の火である。その特性は、油を破壊せず、その湿りによって増大させることにある。ほかの火は乾きによって破壊するからである。この火に似るものは、健全な人間の身体の物質的な火のほかには、この世界にない。太陽の火も同じ度合いに熱いが、乾いている。この火は物を従わせ、生ある物から生じ、養われる。"
  "translation_status": "draft"
  "source_kind": "prose"

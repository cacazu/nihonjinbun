  "translation_ja": "すでに、金が赤い硫黄を含むように月は白い硫黄を含むと述べた。しかしその中の火の姿は白さの下に覆われている。そのためすべての銀は金になりうる。そこで哲学者は、以前に銀でなかったものは金ではないという。銀には未熟な性質がいくつか含まれ、それらは術で除くことができる。こうして個別的に固定したメルクリウスへ、また金に最も近い本性へ移る。そのとき金の持つものをすべて含むからである。哲学者たちの赤い硫黄を加えるとさらに熟成し、完全な物体と結合することで黄化が起こる。それらは単純に一つの本性だからである。しかし他の物体ではこれは不可能である。銀ほど完全な本性に近くないからだ。生成の際、燃えやすく臭い硫黄によってそれが妨げられたのである。またそれらは、哲学者が語るメルクリウスではない。極端から極端へは、中間を通らなければ移れない。すなわちメルクリウスから金は、まず銀にならなければ生じない。またそれらは、燃やさない単純な火の硫黄ではなく、焼損させる硫黄を持つ。それゆえ個別的に固定したメルクリウスへ変成できない。上でアリストテレスの「術者は知れ」という言葉で述べたとおりである。しかし似たものを作り、染めることはできる。〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

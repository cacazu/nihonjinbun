  "translation_ja": "粗大なものを単純なものへ溶かし、微細化すること。暗いものを洗って明るくすること。湿ったものを乾いたものへ戻すこと。揮発するものを固定した物体の上に固定すること。溶解とは物体を分け、第一質料または第一の本性にすることである。洗浄とは埋め置き、蒸留し、焼成することである。還元とは肥やし、蝋状化し、または孕ませ、微細化することである。固定とは婚約させ、溶かし、凝結することである。第一によって本性は内側で変わり、第二によって外側で、第三によって上方で、第四によって下方で変わる。"

"segments":
- "id": "ROS-001-T01"
  "section_id": "section-1"
  "kind": "heading"
  "origin": "source"
  "source_text": "ROSARIUM PHILOSOPHORUM. SECUNDA PARS ALCHIMIAE DE LAPIDE PHILOSOPHICO VERO MODO praeparando, continens exactam eius scientiae progressionem. Cum Figuris rei perfectionem ostendentibus."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 1
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720808"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720808"
  "translation_ja": "哲学者たちの薔薇園。錬金術第二部。賢者の石を正しい方法で調製することについて。この学の進行を厳密に収め、事業の完成を示す図を付す。"
  "translation_status": "draft"
- "id": "ROS-001-T02"
  "section_id": "section-1"
  "kind": "figure_text"
  "origin": "source"
  "source_text": "Lapis noster habet spiritum, corpus & animam."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 1
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720808"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720808"
  "translation_ja": "私たちの石は、霊、身体、魂を持つ。"
  "translation_status": "draft"
  "source_kind": "figure_inscription"
- "id": "ROS-001-T02-tn-001-text"
  "section_id": "section-1"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "左側の人物の巻物。noster、habet、spiritum、corpus、animam の略記を展開。"
  "translation_status": "draft"
- "id": "ROS-001-T03"
  "section_id": "section-1"
  "kind": "figure_text"
  "origin": "source"
  "source_text": "Coniunge nos, & quod quaeris invenies."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 1
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720808"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720808"
  "translation_ja": "私たちを結び合わせよ。そうすれば、おまえの求めるものを見出すだろう。"
  "translation_status": "draft"
  "source_kind": "figure_inscription"
- "id": "ROS-001-T03-tn-001-text"
  "section_id": "section-1"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []

  "translation_ja": "消え去らず、硫黄が燃えたり損なわれたりしないようにするのである。私たちの水銀は、私たちの最も澄んだ水だからである。例として普通の水を見れば分かる。それで煮られるものは、水そのものが尽きるまでは、どれほど火が強くても、決して焼けない。水が尽きると、器の中にあるものが焼ける。だから哲学者たちは、私たちの祝福された水が蒸散せず、器の中のものを燃焼から守るよう、器の口を閉じるよう命じたのである。それらの物とともに置かれた水は、火が焼き尽くすのを妨げた。それらの物は、炎に包まれるほど、ますます水がその最も内側に隠れ、火の熱に傷つけられないようになった。水はそれらを自分の腹に受け入れ、火の炎をそれらから追い払う。私は、この術を探究するすべての者に、初めは弱い火を用い、水と火の間に忍耐が生じるまでそうするよう命じる。そして水がまったく上昇せず、固定されたと認めたなら、火がどのようなものであるかを気にしなくてよい。しかし霊と身体が一つになるまでは、忍耐をもって管理するのがよい。そうして身体的なものが非身体的になり、非身体的なものが身体的となる。したがって、白くし、赤くする物こそ水である。殺し、蘇らせるのは水である。焼き、白く輝かせるのは水である。溶かし、凝らせるのは水である。腐敗し、そののち、新しいさまざまな"

- "id": "ROS-129-T02"
  "section_id": "section-4"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cum supradictum est quod luna contineat in se sulphur album sicut aurum rubeum, tamen ignis species sub albedine in eo est obtecta, ideo omne argentum possibile est fieri aurum, unde philosophus, non est aurum nisi prius fuit argentum, sic argentum continet in se aliquas qualitates indigestas, quae possunt ab eo purgari per artem ita quod particulariter transit in mercurium fixum, & in vicinissimam naturam auri, quia omne tunc continet in se quod & aurum, per appositionem sulphuris rubei philosophorum, quo plus digeritur, & citrinatio in eo causatur in adiunctione corporis perfecti, cum sint simpliciter unius naturae, hoc autem in alijs corporibus fieri est impossibile, cum tantam vicinitatem naturae perfectae non habeant sicut ipsum, quod est impeditum in generatione ipsorum, per sulphur adustibile & foetidum, nec ipsa sunt mercurij de quo loquitur philosophus non fit transitus ab extremo ad extremum, nisi per medium id est, ex mercurio non generatur aurum nisi prius fuerit argentum, nec in se habet sulphur ignis simplicis non urentis, sed sulphur adurens, & ideo in mercurium fixum particulariter transformari non possunt, ut supra dictum est per Aristotelem: Sciant artifices, sed similia illis facere possunt, & tingere"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 129
  - "source_id": "source-1"

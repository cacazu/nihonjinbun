- "id": "ROS-102-T01"
  "section_id": "section-4"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "depuratum. Unde Avicenna: Tale sulphur non reperitur super terram, nisi in quantum existit in istis corporibus, sole & luna, & in alio quidem est illud quod nulli dicitur nisi ex parte dei sibi reveletur. In sole perfectius quia magis est digestum & decoctum, philosophi enim subtiliter sunt imaginati quomodo in istis corporibus perfectioribus sulphura illa elicere posset, & ipsorum qualitates per artem purgare ut hoc haberent in arte mediante natura, quod in ipsis antea non apparuit quamvis plenarie & occulte prius habuerunt, & hoc nequaquam fieri concedunt sine corporis solutione & in primam materiam reductione quod est argentum vivum ex quo facta sunt ab initio, & hoc absque ulla permixtione rerum extranearum, quae extraneae naturae lapidem nostrum non emendant quoniam nihil convenit rei, nisi quod propinquum est ei, cum sit medicina simplicis ac virtualis naturae ex aqua mercuriali producta, in qua aurum & argentum prius sunt soluta. Verbi gratia, si glacies ponitur in aquam simplicem, solvitur in ea per calorem, & redit in primam substantiam aqueam & sic aqua tingitur ex virtute etiam occulta quae fuit in glatie, si autem glaties non resolvitur per calorem in aquam, non coniungitur aquae tur in aqua iacet, nec illam aquam tingit sua virtute quae in ea antea coagulata fuit ex parte specierum, sic eodem modo si corpus non resolveris in mercurium cum mercurio"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 102
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720911"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720911"
  "translation_ja": "〔前頁から続く〕精製されるからである。そこでアヴィセンナはいう。そのような硫黄は、太陽と月というこれらの物体の中にあるものを除けば、地上には見出されない。ほかのあるものの中にもそれはあるが、神から啓示されるのでなければ、誰にも語られない。太陽の中では、より熟成し煮られているため、いっそう完全である。哲学者たちは、これらのより完全な物体からその硫黄を取り出し、術によってその性質を浄める方法を、精妙に考案した。自然を介する術の中で、以前は物体に現れなかったものを得るためである。もっとも、それらは以前から完全に、隠れた仕方でそれを持っていた。彼らは、物体を溶解し、その最初の由来である水銀という第一質料に還元しなければ、これが起こるとは認めない。また、異質なものを何も混ぜずに行う。異質な本性は私たちの石を改善しない。ものに適合するのは、それに近いものだけだからである。この薬は単純で力ある本性を持ち、あらかじめ金銀を溶かしたメルクリウスの水から生じる。たとえば氷を普通の水に入れると、熱によって溶け、最初の水的実体へ戻る。こうして水は、氷の中に隠れていた力によって染められる。しかし氷が熱によって水に溶けなければ、水の中に横たわっていても水と結合せず、その種の側から以前に凝結していた力によって水を染めることもない。同様に、物体をメルクリウスとともにメルクリウスへ溶かさなければ……〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "ROS-102-T01-tn-001-text"

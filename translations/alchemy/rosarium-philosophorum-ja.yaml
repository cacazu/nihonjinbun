  "translation_ja": "白くなり、そののち赤くなるからである。それゆえ、真のティンクトゥラは私たちの銅からしかできないことを知れ。ゆえにそれを、その魂とともに煮よ。磨り、煮て、霊が自らの身体と結合し、一つとなるまで繰り返せ。そうすれば目指すものを得る。賢者たちはそれに多くの名前を付けたが、おまえは水銀と身体とに付着する、その唯一の物を考察せよ。そうすれば真の知を得る。だが誤らぬために、身体に付着するとはどういうことかを知れ。普通の水銀が身体に付着すると言う者たちもいるが、それは誤りである。彼らはゲベルの水銀についての章を理解しているつもりでいる。そこにはこうある。「ほかの諸物を探求したが、私たちの発見において、水銀よりもいっそう身体の本性に親しい物は見いださなかった」云々。しかし、これはすべて哲学的な水銀について理解されなければならない。それのみが身体に付着するからである。古代の哲学者たちはほかの物を見いだせず、近代の者たちも、哲学的な水銀以外に身体へ付着する物を見いだすことはない。普通の水銀は身体に付着せず、むしろ身体がその水銀に付着するのである。このことは経験によって真実と分かる。普通の水銀をある身体と結びつけても、水銀は自らの本性にとどまるか、離れ去るだけで、身体を自分自身の"

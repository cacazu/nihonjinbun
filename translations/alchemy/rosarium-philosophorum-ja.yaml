    Si vis Fili ut corpus illud revivificetur, redde sibi animam suam, & statim vivit.
    O Magister non intelligo?
    Fili tibi dico expressius: Unus Lapis sive una res tantum, quia corpus in suam naturam est redactum, videlicet in aquam suam, id est in primam suam materiam, quia prima materia corporum, est aqua unctuosa, & tunc primum dicitur una res, cum corporis substantia & aqua unionis per partes minimas indivisive uniuntur, & lapis Philosophicus ex quo rami infiniti multiplicantur. Et hoc dicitur Lapis in libris Philosophorum notus. Ideo Fili ab illo Lapide extrahitur aqua sua propria, & in spiritu per modum separationis.
    Sublimatio nostra est partium non fixarum elevatio a partibus fixis. Partes vero non fixae elevantur per fumum & ventum.
    Sed volumus ut haec duo simul fixentur, & praestent fusionem facilem. Et sic intelligas nostram sublimationem veram & certam. Et lapis quem nemo potest tangere sua lingua. Hermes dicit: Divide subtile a grosso etc. Terra

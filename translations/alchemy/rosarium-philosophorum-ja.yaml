  "translation_ja": |-
    〔前頁から続く〕また自然の真実の働きと比べても、この作業はより速く終わるという意味である。それゆえ哲学者は、薬とは長い時間の経過を先取りしたものだと言った。だから汝らにいう。辛抱強く待て。遅れるかもしれないからである。性急さは悪魔に属する。それゆえ忍耐を持たぬ者は作業から手を引け。軽信が急ぐ者を妨げるからだ。
    どんな作用にも自然に固有の方法と一定の時があり、その長短の期間のうちに完成する。
    このために必要なものは三つ、忍耐、待つこと、器具の調整である。これらについては『完成した奥義の大全』のさまざまな章で術者に語った。私たちの言葉を十分に探究したなら、そこで試すことができる。その中で私たちは、明白で開かれた証明によって、石は臭い霊と生きた水以外の何ものでもないと結論した。その水を乾いた水とも呼んだ。それらは自然な比率で清められ、互いに離れることのできない結合で一つにされる。作業を短縮するためには第三のもの、すなわち希薄化された完全な物体を加えなければならない。
    したがって以上によって、真実が近くにあり、作業そのものを完成させるものが明らかである。

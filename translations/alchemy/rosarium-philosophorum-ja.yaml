    & est res calida & humida, aquosa & adustiva, et est oleum vivum, & tinctura viva, lapis mineralis, & aqua vitae mirae efficaciae. Aristoteles: Nullum tingens venenum generatur absque Sole & eius umbra, id est uxore.
    Sublimatio est duplex: Prima est remotio superfluitatis, ut remaneant partes purissimae a fecibus elementaribus segregatae, sicque virtutem quintae essentiae possideant. Et haec Sublimatio est corporum in spiritum reductio, cum scilicet corporalis densitas transit in spiritus subtilitatem.
    Secunda Sublimatio est extractio, quod in ipsa est de natura quintae essentiae, a fecibus elementaribus separata. Dico autem quintam essentiam animam tingentem, ad quam necessaria est ablutio, ut per eam extrahatur unctuositas arsenici, sive natura oleaginosa, purissimae unctuositatis, quae ligata est cum fecibus suis, quae feces non permittunt ipsam sublimari.

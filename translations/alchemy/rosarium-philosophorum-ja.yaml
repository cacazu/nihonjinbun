  "kind": "paragraph"
  "origin": "source"
  "source_text": "in generali modus hic est, primo enim elevanda est cum igne proportionali tota humiditas superflua & corrupta, in illorum essentia, etiamque superfluitas subtilis & comburens, & hoc calcinando, deinde totalis substantia remanens corrupta, in illorum calce superfluae humiditatis comburentis & nigredinis, corrodenda est cum his mundatis praedictis corrosivis, acutis seu acerbis, donec calx fuerit alba, sive rubea, aut secundum corpus, naturam & proprietatem colorata & munda, et pura ab omni superfluitate seu corruptione praenarratis, & haec cum his corrosivis mundantur, terendo imbibendo, & lavando, postea vero delenda seu deponenda est totalis terrestreitas immunda, & foetulentia combustibilis & grossa, cum rebus praedictis, mundatis, vel puris, fusionem metallicam non habentibus, cum calce praedicta, modo praedicto depurata, commixtis & bene tritis, quae in fusione seu calcis reductione retinebunt secum terrestreitatem grossam & immundam, remanente corpore puro, ex omni superfluitate corrumpente mundato. Ex hoc totum descendendo, meliorationis, & subtiliationis horum substantiae purae, in generali modus hic est. Primo hoc corpus purgatum & redactum est iterum calcinandum cum igne et adiutorio mundativis praedictis."

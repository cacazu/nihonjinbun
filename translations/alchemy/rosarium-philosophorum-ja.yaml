  "source_text": "Et iterato volatile fixum, et in hoc ordine completur arcanum preciosissimum quod est super omne huius mundi scientiarum arcanum, & thesaurus incomparabilis, et tu quidem exerciteris ad illum cum laboris instantia maxima, & cum diuturnitate meditationis immensae, cum illa enim invenies et sine illa non, et huic quidem medicinae reiteratio bonitatis administrationis, cum talis cautelae industria potest in praeparatione lapidis evenire, quousque argentum vivum mutet in infinitum solificum et verum lunificum, et non dependet nisi in multiplicatione illius, iam enim laudetur sublimis naturarum deus benedictus, & gloriosus qui nobis omnium medicinarum revelavit seriem cum illius experientia, quam illius investigationis bonitate, et nostri laboris instantia perquisivimus, et oculo vidimus, & manu tetigimus, complementum illius nostro magisterio indagatum, sed etsi quidem hanc palliavimus, non miretur doctrinae filius, non enim illi palliavimus, sed malis et improbis, eam tali sermone tradidimus, quam latere insipientem necessario accidit, & eodem ad illius inventionis perquisitionem prudentes allici possint. Filij ergo doctrinae perquirite, & hoc excellentissimum dei donum vobis solis servatum, filij insipientes nequitiae, et malevoli pravitatis immensae, ab hac scientia fugite, quoniam vobis est inimica & adversa, et vos"

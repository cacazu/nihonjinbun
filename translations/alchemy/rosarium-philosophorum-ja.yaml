    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720946"
  "translation_ja": "〔前頁から続く〕同様に再び溶かし、その作業を繰り返して全体が溶けるまで続ける。水の沸騰による方法はより速い。焼成物を酢とともに同じように瓶へ入れ、気が漏れぬよう穴を塞ぐ。それを水と藁で満たした釜の中に埋める。水による蒸留法で順を追って教えたとおりである。その後下に火をつけ、一時間沸騰させる。次いで溶けたものを滴下して別に保存する、など、以上と同様である。浸入をもたらす火を介した融解は、完成の最後のものである。ゲベルが第七書第十七章でいうように、溶けたすべてのものは、固く閉じた器の中で、火だけの助けによって凝結する。この秘密を私から受け取れ。適切な加熱で流れ、火の試験に耐えるものこそ、完全に凝結したものである。そうでなければ作業を繰り返せ。神の助けによって、反復の末に目的へ至るであろう。ライムンドゥスはいう。私たちの幼子には二人の父と二人の母がいる。全実体から火の中で大切に養われるため、決して死なない。蝋状化とは、火を介して土の上に湿りを戻すことである。焼成によって湿りを失って乾いた土が柔らかくなり、流動性を取り戻し、その結果浸入するようにする。これは、俗人が火で融かす普通の液化によってではなく……〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

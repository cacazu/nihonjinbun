  "source_text": "Est autem Ignis multiplex, & eius qualitas diversa, per quosdam gradus distincta. Quidam enim in primo gradu est calidus ignis, & humidus in secundo, scilicet ventris equi, cuius proprietas est quod non destruit oleum, sed augmentat propter suam humiditatem. Nam alij destruunt propter siccitatem. Huic ergo non assimilatur alius in mundo nisi materialis ignis corporis hominis sani. Ignis quidem Solis calidus est in eodem gradu, sed siccus est. Hic autem est qui domat rem, & de re animata fit, ac nutritur,"
  "source_languages":

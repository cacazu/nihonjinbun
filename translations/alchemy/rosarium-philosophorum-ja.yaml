  "translation_ja": "〔前頁から続く〕最も強い火によってである。これは腐敗の火、また私たちのメルクリウスの火と理解せよ。それによってのみ物体は上昇し、すなわち霊に変わる。上昇したなら、反復操作によって全体が固定するまで昇華を繰り返す。そして固定したものを溶解したものにせよ。つまり、上にあるように酢のところに置き、すでに十分説明したとおり、すべてを四度繰り返す。また溶解したものを揮発性のものにせよ。これは、溶解によって石が揮発性になると言わんばかりである。さらに揮発性のものを固定したものにせよ。哲学者はこのように言い続ける。これは第五十七章にある、など。融解を示すまで、あるいは流れるまで行う。第十章。この作業は白のためか、赤のためか。アダマルスは答える。両方のためである。第六十六章には、月の石と太陽の石とは本質において同じだと書かれる。どちらもメルクリウスだけから完成されるからだ。処理の仕方においても道は一つである。同じ操作を同じ順番で行うからである。それゆえすべての哲学者によれば薬は一つである。ただし発酵の点で異なる。"

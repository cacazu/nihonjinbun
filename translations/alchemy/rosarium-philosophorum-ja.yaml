  "translation_ja": "〔前頁から続く〕その実体は少なく、メルクリウスの実体は多く、その力は少ない。それゆえメルクリウスによって極めて重く、硫黄の力によって甚だ赤い。銀はすべてにおいて逆である。硫黄の実体を多く、その力を少なく、メルクリウスの実体を少なく、その力を多く持つので、白い。色は力の多さに従い、力は蒸気の中に置かれているからである。その質料は、他のどの金属よりも金の質料に近いため、容易に金へ変わる。色を変え、重さを与える以外の労働を必要としない。"

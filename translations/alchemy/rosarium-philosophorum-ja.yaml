  "translation_ja": "太陽の本性へ変えなければならない。それは発酵素が生地全体を発酵素の本性へ変えるようなものであり、その逆ではない。支配されるものは、つねに支配するものへ移されるからである。私たちの石は、すべての哲学者たちのもとでメルクリウスと名付けられる。それは多くの者が考えるように生まれたものではなく、身体から取り出されたものである。賢者の石は、太陽、月、メルクリウスという三つからできる。すなわち、普通のメルクリウスを用いず、哲学的な道によって、太陽と月から、それ自身の存在におけるメルクリウスを作れ。注意せよ。この石は全世界に一つである。仕事の初めにこの一つからそれる者は、むなしく労する。全世界において、私たちの仕事に必要なのは、私たち子らだけに与えられたこの石のほかにはない。アルノルドゥス。「私たちの石のうちには、太陽と月が、力と可能性において、また本性においても存在する。もしそうであれば、そこから太陽も月も生じないことになる。私たちの石のうちの太陽と月は、その本性において普通のものより優れているからである。私たちの石の太陽と月は生きており、普通のものは、私たちの石の太陽と月に比べれば死んでいる。それゆえ哲学者たちは、その石を、太陽とも月とも交互に呼んだ。石のうちにはそれらが潜在的にあり、目に見えるのではなく、力と本質において存在するからである。」そこでヘルメスは言う。「私たちの石は、息子よ、私を助けよ、私もおまえを助けよう、と叫ぶ。」"

  "translation_ja": "〔前頁から続く〕それは、星々における太陽のように、惑星の中の最初にして最後のものだからである。天空の天文学において、太陽がすべての惑星の主であり、すべての惑星がその光を必要とすることを見る。太陽は上へは土星まで、下へは月まで光を与え、上なるものも下なるものもすべてを見渡すからである。アリストテレスはいう。子よ、より脂の多い肉から取らなければならない。子よ、どの種も自らの芽生えに対応すると知れ。汝が播くものを、汝は刈り取るからである。"

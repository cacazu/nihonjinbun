  "translation_ja": "〔前頁から続く〕しかし下に残るものは灰の灰、下方の卑しめられ、退けられた灰、滓、鉱滓である。ゆえにその明るく清澄な部分を区別せよ。雪のように真っ白になって昇るとき、完成するからである。煙となって飛び去らぬよう、注意して集めよ。それこそ求めていた善きもの、白い葉状の土、凝結すべきものを凝結させるもの、砒素を清めるもの、白い硫黄である。アリストテレスはこれについて、錬金術者が銀を作るために受け取りうる最良のものだという。土を偽術者の仕事のために昇華してはならず、私たちの完全なエリクシルのために昇華しなければならない。昇華するものは二通りに昇華する。一つは霊であるため自ら昇華し、もう一つは霊と一体化するため他のものとともに昇華する。メルクリウスは霊なので自ら昇華するが、私たちの土は焼灰なので、メルクリウスと一体化するのでなければ昇華しない。ゆえに焼灰を転じ、メルクリウスを吸わせ、一つの物体となるまで煮よ。これを何度も繰り返すことを厭うな。物体はメルクリウスと一体化しなければ上に昇らないからである。そのため、できるだけその本性を微細化し、メルクリウスとともに、一つになるまで強く搗き砕かねばならない。私たちが昇華するのは、物体を微細な質料に還元し、すなわち霊にし、物体を扱いやすくするためにほかならない。〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

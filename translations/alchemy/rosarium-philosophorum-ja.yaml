    同じ仕方で、水は土とともに濃くなり、凝縮した土に似たものとなる。土は水より濃いからである。それゆえ身体の溶解と霊の凝固の間には相違がなく、一方だけが他方なしに行われるような、別々の仕事もない。水と土の結合でも、その働きにおいて、一方を他方から見分け、あるいは分けられるような異なる時間の部分は存在しない。交合の時に男の種子が女の種子から分離されないように、両者の終わりは一つ、出来事は一つであり、一つの同じ操作が、その二つに同時に認められる。
    だからメルクリヌスは詠う。
    諸物の混合を、彼は交合と生成と呼ぶ。
    種子は混ざり、混ざったものは乳のように見える。
    第二は受胎である。土が黒い粉へ溶け、少量のメルクリウスを自らとともに保持し始めるときである。そのとき男が女に、すなわちアゾートが土に作用する。ゆえにアリスレウスは言う。「男同士は生まず、女同士も孕まない。生成は男と女から、特にその複合から生じるからである。男が女を迎えると自然は喜び、真の生成が生じる。しかし自然が、異質で適合しない本性と結びつくと、真の種子はまったく生じない。」
    これがメルクリヌスの次の言葉の意味である。

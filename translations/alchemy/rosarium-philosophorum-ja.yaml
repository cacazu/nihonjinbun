    -fundans. Has autem humiditates oportet destrui per ignem et gradus ignis, cum molli temperamento & congrua ac moderata digestione. Putrefactio Philosophicalis nil aliud est nisi corporum corruptio sive destructio. Una enim forma destructa statim introducit sibi natura aliam formam, meliorem et subtiliorem. Putrefactio idem est quod fractio putridi. Nam per putrefactionem omnis res digeritur, & fit fractio inter putridum, id est foetidum & mundum. Mundum enim corpus putrefactum immediate crescit, & multiplicatur in suo simili, ut patet in grano, quod postquam stetit per multos dies sub calore terrae, tumescit ut & quod mundum est ex eo crescat & multiplicetur, foetidum vero evanescat, necessaria est ergo etiam in opere nostro propter praedictas causas putrefactio.
    Conceptio & desponsatio fit in putredine in fundo vasis, & generatio genitorum fiet in aëre scilicet in capite vasis, id est alembici. Corpus nihil facit nisi putrefiat & non potest putrefieri nisi cum Mercurio, pro una parte corporis videntur accipiendae propter putrefactionem trigesimae sextae partes aquae. Putrefactio fiat igne lentissimo fimi calidi & humidi, & nequaquam alio, ita quod nihil ascendat, quia si aliquid ascenderet fieret separatio partium, quae fieri non debet do-

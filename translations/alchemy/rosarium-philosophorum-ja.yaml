  "translation_ja": "人工の連続する火であり、炭をむき出しにしないかぎり、望む同じ度合いを一か月、二か月、あるいは三か月保つ。したがって炭はつねに覆っておかなければならない。燃えている炭を多くまたは少なく加えることで、意のままに熱を増減できる。まず、ネズの木だけから作った灰を十分に用意する。次に大きな土製の鉢を用意し、その中央に小さい鉢、または坩堝を置く。灰を入れながら、大鉢を火の熱の上に置き、灰が温まるようにする。そして小鉢の周囲の灰の上に、やはり先のネズの木だけから作った炭を置く。さらに同じ木の温めた灰を、もっと用意し、"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "ROS-094-T01"
  "section_id": "section-3"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    eiusdem ligni quos supersperges praedictis carbonibus, & cooperies eos suo cinere calido peroptime. Et in illam minorem ollam sive vitrum habeas tuam materiam digerendam, & desuper maiorem ollam coopertorium pones, & in stubam pones subter scamnum, vel supra, super lapidem, tamen ne forte damnum inferatur: poteris tali practica plures huiusmodi praeparare ignes. Poteris etiam in minorem ollam ponere aquam calidam vel ventrem equi humidum, & in illum fiolam materiae.
    Carbones praedictos facies in hunc modum: Secabis lignum Iuniperi in parvas particulas, ad grossitudinem duorum digitorum, vel maiores, illos pones in magnam ollam bene undique clausam & per lutatam & repletam, illam ollam pones per integrum diem in ignem fortem furni venti, vel flammae lignorum. Deinde permittas per se infrigidari, aperi ollam, & habebis quod optas. Cineres autem comuni modo combures. Hic ignis potest esse ignis primi vel secundi gradus fixionis spirituum.
  "source_languages":
  - "la"
  "source_locations":

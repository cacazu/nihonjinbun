  "source_text": "ulterius resolvebat se in aquam, nec in fumum, dixerunt quod vere erat fixata, quia eandem congelationem & inspissationem seu fixionem, propter maiorem decoctionem caloris viderunt venire ad perfectam desiccationem & dealbationem, & quod ista albedo erat super omnes albedines, dixerunt quod haec erat perfecta calcinatio, videntes hanc materiam ad suum colorem stare, & coloribus infinitis mutari, quia hoc fieri non poterit, nisi per materiae resolutionem, ideo hanc resolutionem dixerunt solutionem, nam ipsa resolutione discontinuantur elementa vicissim, agunt & patiuntur, & ideo philosophi dicta elementa coniuges vocant, quare turpiter errant insipientes qui credunt medicinam philosophicam creari ex alia re, cum tamen dicant philosophi: Filij alchimici ac credentes suis cunctis dissolutionibus, sublimationibus, coniunctionibus separationibus, congelationibus praeparationibus contritionibus, alijsque insistunt deceptionibus, et sileant praedicantes aliud aurum a nostro, aliam aquam a nostra, quae etiam dicitur acetum acerrimum, aliam dissolutionem & congelationem a nostra, quae fit igne levi, aliam putrefactionem a nostra, &c. Plato in summa: Tuum quaesitum itaque sit de genere amborum luminum mundi, nam aurum circundat partem superiorem, argentum vero inferiorem lunarem. Aristoteles: Nullum tin-"

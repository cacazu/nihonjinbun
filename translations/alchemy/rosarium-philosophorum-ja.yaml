  "translation_ja": "〔前頁から続く〕私とともに酔い、その寝床で私と愛情深く交わり、私への愛のうちにその精液が私の小室に入るなら、私は身ごもり、懐妊し、時が来れば、この地上のあらゆる王や君主にまさって支配し統治する、最も力ある子を生むであろう。その子は、世々に生き統べる至高の神によって、あらゆることに勝利する黄金の冠を授けられる。『哲学者たちの集会』はいう。この術を探究する者たちよ、器の中の何よりも際立つあの白さが現れるのを見たとき、その白さの内に赤さが隠れていると心得よ。そのとき取り出してはならず、全体が赤くなるまで煮なければならない。哲学者セニオルはいう。黒いものを白くし、白いものすべてを赤くせよ。水は白くし、火は照らすからである。それは火の力によって得た染める魂により、ルビーのような色に輝く。ヘルメスはいう。第七の操作は月の操作であり、すなわち二十五日間、焙り、赤くし、熱し、炒ることである。こうして作業の完遂を得る。同じ著者はいう。魂の色は赤い。またいう。白いものは赤くされることを欲する。また、白さこそ私たちの赤さである。また、私たちのこの石は火から創られた火であり、火へと変わり、その魂は火の中にとどまる。赤いティンクトゥラについてのヘルメスの謎。私は冠を戴き、王冠で飾られ、王の衣を着る。私が物体の中に喜びを入り込ませるからである。"

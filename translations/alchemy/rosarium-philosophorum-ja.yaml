  "translation_ja": "〔スキャン190から続く〕さらに損傷から守る。そして総じて、熱性の病も冷性の病も、乾性の病も湿性の病も、医師の他のあらゆる薬にまさって、確実に治癒する。一年の病なら十二日で治し、古く長年にわたる病なら一か月で治すからである。要するに、悪い体液をすべて追い払い、良い体液をもたらす。これを携える者に愛と名誉、安全と勇気、戦場での勝利を与える。ここに自然の最大の秘密が完成する。それはどんな価格にもまさって貴い秘密、比類なく極めて貴重な宝である。神が、それを持つ者の心の中に秘めておき、愚かな者に明かされることのないようにされんことを。生きとし生けるものは皆、アーメンと唱えよ。"

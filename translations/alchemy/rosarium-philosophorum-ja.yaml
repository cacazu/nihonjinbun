  "translation_ja": "〔前頁から続く〕もはや水にも煙にも戻らないのを見て、彼らは真に固定されたと言った。そして、その同じ凝結と濃縮、すなわち固定が、熱によるいっそうの煮沸によって完全な乾燥と白化に至り、その白さがあらゆる白さにまさるのを見て、これを完全な焼成と呼んだ。この質料が自らの色にとどまり、また無数の色へ変わるのを見て、これは質料の分解なしには起こりえないゆえに、この分解を溶解と呼んだ。その分解によって元素は互いに離れ、作用し、作用を受ける。それゆえ哲学者はこれらの元素を夫婦と呼ぶ。だから哲学的な薬が別のものから作られると思う愚者は、ひどく誤っている。哲学者たちはいう。錬金術の子らとその信奉者は、自分たちのあらゆる溶解、昇華、結合、分離、凝結、調製、粉砕、その他の欺きに固執する。私たちの金とは別の金、私たちの水、すなわち極めて鋭い酢とも呼ばれる水とは別の水、弱い火で行う私たちの溶解と凝結とは別の溶解と凝結、私たちの腐敗とは別の腐敗などを説く者は、黙るがよい。プラトンは『大全』でいう。ゆえにおまえの求めるものは、世界の二つの光体と同じ類であれ。金は上方の部分を取り巻き、銀は下方の月の部分を取り巻くからである。アリストテレスはいう。いかなる染める……〔次頁へ〕"

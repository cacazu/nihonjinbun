  "translation_ja": "到達することができる。熟考と火の助け、そして豊かな労力に相当する工夫によってである。アルベルトゥス。ここから、身体のうちに水銀が大量にあることが完成の原因であると明らかになる。一方で、多量の硫黄性、すなわち不浄な硫黄性は、完成と腐敗の原因である。きわめて賢いエウクレイデスは、同時に結びつけられた太陽とメルクリウス以外のものに働きかけないよう、私たちに勧めた。賢者の石はそれらのうちに成り立つからである。完全なものからは何も生じない。それはすでに完全だからである。この自然あるいは技巧について、パンに例がある。発酵し焼かれたパンは、その状態または存在において完成し、その究極の目的へ達している。それからさらに発酵させることはできない。金も同じである。純金は火の試験によって堅く固定した身体へ導かれている。哲学者たちによれば、それを用いてさらに発酵させることはまったく不可能である。ただし、金属の第一質料を得て、そのうちで金を第一質料と混和可能な元素へ溶解するなら別である。ゆえに、金がそこから生じる質料を取ろう。それは技巧を仲立ちとして、哲学者たちの真の発酵素へ導かれる。そして工夫により、それを完全な質料、あるいは完全な身体の霊へ変えよう。それゆえ近代に働く多くの者は、哲学者たちでさえ欺かれる。本来始めるべきところで仕事を放棄するからである。災いだ、学びの子らよ。果実が熟す前に摘み、収穫期の前に刈り取ろうと望む者たちよ。別の哲学者。「完全なものからは何も作れない。物の種が自らの自然において完全なら、それは変わらず、むしろ」"

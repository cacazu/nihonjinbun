    Democritus, Non sis piger nec velox multum in putrefaciendo calculos, & corpora collocata et coniuncta attende in opere tuo, et proficies. Rosinus ad Euthesiam. Accipe animal marinum desicca & putrefac. Morienes, Nullum crescens & nascens fit nisi post putrefactionem. Si autem

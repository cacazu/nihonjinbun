  "translation_ja": "〔前頁から続く〕また、洗浄と火による乾燥なしに、その布から油を分離することはできない。水はこの魂を物体から取り出す霊である。魂が物体から取り出されると、染物師の染料が水によって布へ運ばれるように、その霊の中に運ばれて留まる。その後、水は乾燥によって去り、染料はその油性ゆえに布へ固定されて残る。したがって水は、空気のティンクトゥラを運ぶ霊である。それが白い葉状の土の上へ戻されると、霊的な水はただちに乾き、身体には魂、すなわち空気のティンクトゥラが残る。それゆえ霊は魂を保持し、魂は身体を保持する。魂は霊を介さずに身体の中へ留まれないからである。しかし結ばれると決して離れない。霊が魂を保持し、魂が土を保持するからである。それゆえヘルメスは、石の中の魂を尊べと命じる。それらの住まいは石の中にあり、ともにある逃れゆくものを引き留める。これが私たちの凝結である。逃れるものを留めるからである。ゆえに白い葉状の土の中に魂を播け。土が魂を保持するからである。それは地から天へ昇り、再び地へ降りるとき、下なるものと上なるものの力を受け取る、など。"
  "translation_status": "draft"
  "source_kind": "prose"

  "source_text": "in rebus vegetabilibus & sensibilibus siccorum et humore carentium combustibilium & corruptibilium, in quibus quaesierunt tincturam quam non habent. Hij vero damnificati sunt damno apparenti et istae sunt rationes, capilli humani cerebrum sputum humanum, lac mulierum, cruor humanus, urina, stercus humanum, embrio, menstruum, et sperma, ossa mortuorum, ova gallinarum, et simpliciter in omnibus animalibus, brutis, piscibus, & volatilibus, vermibus, scorpionibus, bufonibus, basilisco naturali et artificiali in quo maxima trufa est, in testudinibus & succis quarundam herbarum & floribus arborum, & specialiter in his, videlicet herba lunari & solari quae dicitur toxicum, et in omnibus in quibus finxerunt nomina ad placitum suum secundum metalla, decipientes se & alios, volentes cum pessimis rebus optima facere & naturae defectum cum talibus adimplere, sed quia in his nullam virtutem imaginantes veraciter nec scrutantes, volentes stercus seminare & metere triticum quod usui videtur impossibile, unde dicitur si quis homo seminaverit hic & metet, ergo si stercus seminas, merdam et metes. Quare non est mirum, quod vix unus inter mille aut nullus de talibus perficit. Semina aurum & argentum & affert tibi fructum millesimum, cum labore tuo, mediante natura, quia ipsum solum habet quod"

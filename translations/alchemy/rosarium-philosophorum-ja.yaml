  "source_text": "quaeris, & nulla alia res mundi, cum alia omnia sint foetida, & naturae cedunt per ignis assiduitatem & examen. Sunt et alij Alchimistae in minoribus mineralibus laborantes, scilicet in quatuor spiritibus, ut in sulphure vulgi, arsenico, auripigmento et sale armoniaco, volentes ex his tincturam perficere, sed hoc facere non possunt, ut patet per definitionem tincturae, quia tingere non est aliud quam tingendo tinctum in naturam suam transformare, & secum sine ulla transformatione permanere, et docens natura naturam contra ignem praeliari, nam tingentis et tincti natura concordat. Verbi gratia: si ex auro vel argento tinxeris plumbum vel stannum, vel aliquod aliud tale, hoc concordat in naturis, quia originem ex utraque parte ex mercurio duxerunt, maturum immaturo coniungitur, ut immaturum secum in tali via perficiatur. Sed cum isti quatuor spiritus sint alterius naturae cum metallis, ut sufficienter prius dictum est: Ideo si tingere debent, quaero an debeant convertere vel converti? Si converti, tunc tinctura non est, ut patet per eius definitionem. Si convertere, ergo tingendo convertit in suam naturam quae est terrea, naturae metallicae extranea. Ideo metallum tingendo facere non possunt. Quod autem tingendo convertit in suam naturam probatur, quia omne generans generat sibi simile. Sed quia haec tinctura quatuor spirituum generans est ter-"

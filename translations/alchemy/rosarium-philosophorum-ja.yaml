    火の暗さを取り去る。
    死化とは、身体から硬さを分離することである。そのとき魂は死んでいるが、身体は熱と乾きゆえに生きているからである。熱を持つものはすべて生命を持つ。このため錬金術の焼灰は、生命を持つと言われる。哲学者たちは、それらの不完全な生命を殺し、永続する生命を与えようと努めたからである。
    再生とは、栄養、すなわちその完全な湿りと、整える湿りによる回復であり、それ自身の不完全な湿りを除去することでなされる。

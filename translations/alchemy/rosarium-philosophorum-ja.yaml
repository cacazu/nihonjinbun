    「作業に適した哲学的な湿りを分離する。それは涙のように澄んでおり、そのうちに金属の第五精髄が住む。それは従順な金属であり、硫黄の本性と水銀の本性を持つため、ティンクトゥラを結びつける媒介がそのうちにある。」ゲベル。「おお、この物は何と有用であろう。私たちはこの生の薬を用いるが、それは煮られ、熟成されると、あらゆる毒を超える最大の毒となる。」哲学者グラティアヌス。「錬金術には、一人の主人から別の主人へ移る、ある高貴な身体がある。その初めには酢とともに苦難があるが、終わりには喜びと楽しみがある。」『集会』のアスタヌス。
    「その黒く焼くことのない霊を取り、それで身体を溶かし、分けよ。」同じ著者。「それは全体が火的であり、その火性によって溶かし、あらゆる身体を、それらに等しいものとともに分ける。」『ロサリウス』。「私たちの錠を開くかの卑しい物なしに、私たちの薔薇園へ入り、そこで白と赤の薔薇を見て得ようとする者は、足なしに歩こうとする人に似ている。この卑しい物のうちに、七つの金属の門を開く鍵があるからである。この卑しい物なしには、貴いものは決して完成しない。」洗浄とは、黒さを終わらせること、あるいは白いものが完全に白く、赤いものが十分に赤くなるまで清めることである。アゾートと火は、

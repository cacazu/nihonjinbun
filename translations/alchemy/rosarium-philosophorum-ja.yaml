    oleum & aqua. Arnoldus: Ordines inter quantitatem ignis experimentum demonstrat mediocrem. Quoniam in solutione ignis semper erit lenis, in sublimatione mediocris, in coagulatione temperatus, in dealbatione continuus, in rubificatione fortis. Si vero istis nescienter erraveris, casum saepissime et laborem deflebis. Oportet ergo ut sedulus operi insistas quoniam ars ab ingenio iuvatur, et ingenium ab arte similiter. Sed & soli complemento intendas alia praetermittas. Sanctus Thomas de Aquino: Est autem materia lapidis aqua grossa. Agens autem est calor aut frigus, congelans illam aquam. Idem et credas preciosiores esse lapides qui procedunt ab animalibus quam alij.
    Lumen luminum: Nullum tamen genus lapidum poteris praeparare, absque duenech viridi et liquido quod valet, et in mineris nostris nascitur. Rasis:
    Fili contemplare altissima mundana, quae sunt a dextris et a sinistris, & ascende illuc ubi lapis noster invenitur, et in illo monte qui fert omne genus pigmentorum et specierum similiter et minera.
    Malchamech: Lapis qui est in hoc opere necessarius de re animata est. Hunc invenies ubique in planitie, in montibus et aquis, & habent eum tam divites quam pauperes. Estque vilissimus atque carissimus, crescit ex carne & sanguine, quam preciosus homini scienti illum. Ex thesauro philo-

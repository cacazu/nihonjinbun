  "translation_ja": "したがって賢い術者は私たちの書物を学び、各所に散らされた意図を集めなければならない。悪意ある者や無知な者へ公開されぬよう、さまざまな箇所にそれを記したのである。集めたものを試し、工夫ある労働に根気よく励みながら学び実験し、完全な認識に至るまで続けよ。術者は訓練せよ。そうすれば見出すであろう。ただし妬む者に中傷されぬよう、次のことを述べておく。私たちは知を連続した叙述で伝えず、諸章に散らした。もし連続して伝えていたら、善人も悪人も不相応にそれを横取りしたであろうからだ。同じく、最も明らかに語った場所でそれを隠した。しかし術者には謎ではなく、平易な言葉の連なりで語りかけた。そして、至高にして祝福され、高く栄光ある神の知性と、それを書いた私たちの知性、または神の善の恩恵を注がれた者の知性だけが、それを再び集められるような語り方で書き添えた。神は望む者に与え、また取り去るのである。したがって学びの子は絶望するな。求めれば見出すからである。教えによってではなく、自らの動きによって自然を探究することによって。自身の勤勉さの良さによって自ら求める者は知を見出すが、本を追いかけて求める者がこの最も貴い術に至るのは、極めて遅い。私たちだけで探究した術を、私たちだけのために著したからである。〔次頁へ〕"

  "source_text": "mecum inebriatus fuerit, & in lecto suo mihi amicabiliter concubuerit, & in amore meo sperma suum cellulam meam subintraverit, concipiam, & ero praegnans, & tempore meo pariam filium potentissimum, dominantem & regnantem prae cunctis regibus & principibus terrae, coronatum aurea corona victoriae, ad omnia a deo altissimo, qui vivit & regnat in seculorum secula. Turba philosophorum: Videntes autem huius artis investigatores illam albedinem apparentem, in omnibus supereminentem in vase, rati estote, quod rubedo in albedine illa occultata est, et tunc non oportet illam extrahere, sed quousque totum rubeum fiat coquere. Senior philosophus: Facite nigrum album, & omne album rubeum, quia aqua dealbat & ignis illuminat. Nam lucet in colore ut rubinus, per animam tingentem, quam acquisivit virtute ignis. Hermes: Regimen septimum est lunae, videlicet assare, rubificare, calefacere & frixare per 25 dies. Et sic habes operis peractionem. Idem: Animae color rubeus est. Item: Album vult rubificari. Item: Albedo est rubedo nostra. Item: Lapis noster hic est ignis ex igne creatus, & in ignem vertitur, & anima eius in igne moratur. Aenigma Hermetis de tinctura rubea: Ego coronor, & diademate ornor, & regijs vestibus induor, quia corporibus laeticiam ingredi facio."

    「結びつかなければならず、それに加えて種子が必要である。したがって発酵の前に受胎と懐胎が起こらなければならない。質料が増殖するときには、幼子が母の胎内で成長すると言われる。また発酵させられるとき、オルトラヌスとアルノルドゥスは、魂が身体へ注がれ、冠を戴いた王が生まれると言う。また『哲学者たちの集会』にはこの教えがある。『身体を溶かし、霊を飲み込ませよ。』彼らが身体を複数形で言うのは、少なくとも二つなければならないからである。霊は単数形で言い、そのように、一つでなければならない。メルクリウス以外には、身体の質料なしの種子はない。そして『霊を飲み込ませよ』と言うとき、メルクリウスを固定する操作を意味し、石は増殖される。増殖されるとは、繰り返されるということである。
    また、メルクリウスが太陽と月の質料を死なせると、質料は灰のように残り、哲学者たちはそれらの篩い分けと粉砕と呼ぶ。その灰について、『集会』とアルノルドゥスの書は、『この灰を軽蔑するな』と言う。また、その三つからなる灰は、哲学者たちによって不浄な身体と呼ばれる。白くなるまで煮られ、焼成されなければならないからである。それゆえモリエネスは『集会』で言う。『不浄な身体を清め、白くし、そのうちに魂を送り込まなければ、この奥義において何も正しく行ったとはいえない。』こうして二つ、すなわち石そのものの焼成と、」

  "translation_ja": "〔前頁から続く〕そのまま転じさせるほどには分離できない。最初の自然が一つの性質を他の性質へ変えたからである。術は湿りを乾きから、冷たさを熱さから、このように分けることはできる。しかし自然な混合によって、一つの性質はなお他の本性をある程度持っている。そのため、分けたものを術によって逆に再び結合できるのである。もし一つの性質が他の本性に参与しないなら、すなわち水が冷たさにおいて土の本性を、空気が湿りにおいて水の本性を共有する等のことがなければ、自然の仕事は完全に壊されたことになる。元素は、メルクリウスの生成以前のように最も単純なものとなり、術は頭から、すなわち金銀から始め、原理たる水銀まで、さらにその先の、メルクリウス生成以前にあった単純な元素の原理まで、自然を破壊したことになるからである。そこまで遠く進むことは術には不可能である。もし可能なら、術は金属の第一質料の外で新たに元素を組み立て、メルクリウスを壊したように逆に生み出せることになるが、これは人為的には不可能である。確かに術は頭から足、すなわちメルクリウスまで壊し、足から頭へ、より微細な形で組み上げる。術は以前からあった自然の実体を認めるのである。このように事物の種は、以前とは別の形に変成されるとき、分けられる。"

  "source_text": |-
    Alphidius: Argentum autem vivum, quod ab eo corpore nigro extrahitur est humidum album & a corticibus mundum ne opus pereat. Morienes: Scire te convenit, quod fumus albus est anima & spiritus illorum corporum solutorum, & certe si fumus albus non fuisset aurum, ibi alchimia non fuisset. Rosarius: Hic est mercurius noster nobilissimus, & deus nunquam creavit rem nobiliorem sub coelo, praeter animam rationabilem.
    Hermes rex graecorum: Corpus solutum est aqua perhennis, congelans mercurium perpetua coagulatione. Hipocras: Corpora ubi quis vult purgare oportet fluxa facere, nigredo putrefactionis durat secundum quosdam quarto diebus vel quinto. Senior: Prima clavis est humorum extractio & pinguedinis, cuius sunt haec signa scilicet nigredo superabundans, qua consumpta iam anima est in aqua. Albertus: Nisi anima corpus suum exierit, & in coelum sursum ascenderit, nihil proficies in hac arte. Parabola senioris de tinctura alba: Si parentes dilecti mei de vita gustaverint & lacte meo lactati fuerint, & mero albo inebriati fuerint, & in lectulo meo nupserint, generabunt filium lunae qui totam parentelam suam praevalebit, & si dilectus meus de tumulo rubeo petrae potaverit, et fontem matris suae gustaverit, & inde copulatus fuerit, et vino meo rubeo et me

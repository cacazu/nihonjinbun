  "source_text": "parum de substantia eius, & multum de substantia mercurij & parum de virtute eius, propter quod ratione mercurij est maxime ponderosum, & ratione virtutis sulphureae multum est rubeum, argentum autem per omnia contrario modo se habet, quia habet de substantia sulphuris multum et de virtute eius parum, & de substantia mercurij parum, et de virtute eius multum, ideo est album, quia color sequitur multitudinem virtutis, virtus vero in vapore locata est, materia eius vicinius est materiae auri quam aliquod aliud metallum, ideo faciliter vertitur in aurum, non indiget alio labore nisi transmutando colorem & dando pondus."

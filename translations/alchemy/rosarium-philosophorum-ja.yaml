  "translation_ja": "労苦を重ねた末、惨めな成果しか得られないのである。だから私は、熟練者も未熟な者もこの教示から秘密を理解できるよう、明瞭に、率直に語る。誰も正当な理由をもって私を罵ることはできないはずである。古の哲学者たちは、きわめて曖昧かつ混乱した書き方をした。そのため理解できないばかりか、互いに一致しているようにさえ見えない。そうして、このきわめて貴い術を求める者を欺くか、志から引き離そうとした。私はあらゆる欺きと曖昧さを除き、最も確かな実験の全体を、はっきりとあなたがたの眼前に置こう。同時に、問題にふさわしく引用され、そこに最もよく役立つ哲学者たちの言葉も添え、扱う事柄がいっそう明らかになり、より明瞭に理解されるようにする。そこでまず告げる。自然の外で働く者はすべて欺く者であり、取り組むべきでない事柄に労を費やしている。人間からは人間しか、獣からは獣しか生まれず、いかなるものも自分に似たものしか生み出さない。したがって、自分自身に由来するものを持たない者が、他に由来するものから思いどおりに得ることはできない。私たちがこう言うのは、誰も金銭を失わないようにするためである。理解力の鈍さによって欺かれ、貧窮に陥った者のなかには、さらに他人を誘惑し、惨めな境遇に追い込もうとする者がいる。そこで私は勧める。誰も、"
  "translation_status": "draft"
  "source_kind": "prose"

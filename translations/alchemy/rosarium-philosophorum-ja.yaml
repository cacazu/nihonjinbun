    「水銀には焼灼性がない。したがってその浄化とは、工夫によって土性と水性を除くことである。それが純粋であれば、白く焼くことのない硫黄の力が、それを銀へ凝固させる。それは、技巧によってそこから銀へのエリクシルを作るのに最良の物である。他方、最良の、焼くことのない本性の赤い硫黄であれば、そこから金へのエリクシルを作るのに最良の物となる。このような硫黄こそ、私たちと賢者たちの硫黄であり、それらの身体から取り出されるもの以外には、地上で見いだされない。」アルノルドゥス。「水銀のうちに隠された硫黄こそ、その外側の鉱物的な硫黄の色の力によって、水銀そのものに金の形を与えるものである。」アウィケンナ。「このような硫黄は、身体のうちにあるもの以外には地上で見いだされない。それゆえ、地上で硫黄を得られるよう、それらの身体を精妙に調製せよ。完全な身体は、私たちの奥義によって、いかなる外来物も混ぜずに、不完全なものを助け、完成させるからである。そうでなければ、硫黄はどの種類であっても正しい溶融を妨げる。鉄で明らかなように、鉄は溶けない。その内部に固定された硫黄を持つと分かるからである。他方、固定されていなければ、正しい溶融に先行して、火によって妨げられ、燃え、蒸発する。鉛やほかの弱い身体で明らかなとおりである。」したがって普通の硫黄は、

  "source_text": "-venire quidem posset cum meditatione, suffragio ignis, et ingenio, quod laboris est copia. Albertus. Unde patet quod multa quantitas argenti vivi est causa perfectionis in corporibus. Multa vero sulphureitas, scilicet immunda, est causa perfectionis & corruptionis. Euclides, vir sapientissimus nobis consuluit ut nihil operemur nisi in sole et Mercurio simul iunctis, in quibus lapis philosophorum consistit. Ex perfecto nihil fit quia iam perfectum est, prout ista natura seu artificium, habemus exemplum in pane. Panis fermentatus et coctus, est perfectus in suo statu seu esse, et ad suum ultimum finem pervenit, nec ex eo plus poterit fermentari sicut est in auro, aurum purum deductum est per examen ignis in corpus firmum et fixum, et cum eo amplius fermentare omnino impossibile est apud Philosophos, nisi habeatur materia prima metallorum, in qua resolvatur aurum in primam materiam, et in elementa miscibilia. Recipiamus ergo illam materiam, unde erit aurum, et mediante artificio, deducitur in verum fermentum philosophorum. Et mutemus hoc cum ingenio in materiam perfectam, vel in spiritum corporum perfectorum. Quare multi inter modernos laborantes etiam Philosophi sunt decepti, quia opus dimittunt ubi esset incipiendum. Heu vobis doctrinae filij, qui speratis fructum colligere antequam maturi sunt, et speratis metere ante messem. Alius Philosophus: Ex perfecto nihil fieri potest quoniam rerum species perfecta in sua natura non mutatur sed potius"

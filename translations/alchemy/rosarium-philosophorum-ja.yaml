  "translation_ja": |-
    最初の仕事では、白い灰の上で物体を溶解しなければならない。また粉砕は水とともにのみ行わなければならない。アヴィセンナはいう。作業の第一は、石をその第一質料へと溶解することである。セニオルとヘルメスはいう。身体を溶かして水にせよ。プラトンは『大全』でいう。汝には物体の溶解に取り組む必要がある。ゆえに全体が溶けるまで、その上で緩やかな火を持続させよ。作業はその火によって成就する。注意せよ。循環するすべてのものの循環的な復帰は、第一質料に還元されるまで決して完成しない。ラシスはいう。物体を溶かさなければ、汝らの労働は無駄である。アルベルトゥス・マグヌスはいう。いかなる物体の霊も、まず溶解されなければ染めることができないと、確実に知れ。
    モリエヌスはいう。あらゆる自然物がその本性を通じて蒸気へ移らなければ、この術の操作は無益である。溶解されれば錬金術の作業は準備できている。それが増殖されれば、ともに喜ぶであろう。
    ここでは自然学の諸学が従属的に結ばれる。共に操作することにおいて、それが溶解に存するからである。ソリン、第十一の区分にいう。操作の始まりは完全な溶解である。物体を希薄にし、霊のように極めて微細にするには、それらを溶かさなければならない。先に述べたように、物体の操作とは溶かされたものである。

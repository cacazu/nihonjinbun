    「後の者たちに命じる。溶解によって身体を非身体とし、穏やかな煮熟によって非身体的なものを身体的なものとせよ。その際、過度の火によって霊が煙へ変わり、消え去らないように、最大限注意すべきである。」そこでマリアは言う。「それを守り、何ものも煙となって逃げないように注意せよ。火の程度は七月の太陽の熱とし、穏やかで長い煮熟によって水が濃くなり、黒い土となるようにせよ。」このようにして、別の元素である土を得る。黒化については、ひとまずこれで十分であろう。
    哲学者ステファヌス。「おまえの目と心を開け。聞いて理解せよ。私は理解できる言葉をおまえに示し、告げる。理解する者の一人であるなら、知ることができるだろう。人間からは人間しか出ないことを知れ。同じように、どの動物からも自らに似たものが生まれる。それでも私たちは、その根とは似ていないものが生まれるのを見る。翼のないものから、翼のあるものが生じるのを見るからである。また私たちは、人々が知らないある物を見て、知っている。それらから、私たちに十分だと知る本性が出てくる。それは深遠な事柄なので、知られていない。それらがどこかと尋ねるなら、おそらく地下にある。そして知れ。この術は、その鉱物的本性からなされ、ほかのものからではない。」
    アウィケンナ。「それゆえ鉱物の根を知り、それらからおまえの仕事を行え。」

    羽根が入るようにする。器全体の意図は、技術者の意のままにその蓋を取り外せ、また継ぎ目を巧妙なものとすることにある。それによって、何も封泥を用いずに、霊、すなわちメルクリウスとラズマルに出口が開かないようにする。特に意図するのは、下の鉢がその胴の中ほどまで蓋の内側へ入ることである。
    ヘルメス。「竜は兄弟と姉妹とともに殺されなければ死なない。一方だけでなく、両方が同時に、すなわち太陽と月が必要である。」哲学者。「メルクリウスは自分の姉妹とともに殺されなければ決して死なない。すなわち、月または太陽とともに凝結させねばならない。」注意せよ。竜は身体から取り出された水銀であり、自らのうちに身体、魂、霊を持つ。これについてこう言われる。「竜は兄弟と姉妹、すなわち太陽と月とともにでなければ死なない。」すなわち、月ゆえに湿りと冷たさの本性を自らのうちに持つ、抽出された硫黄とともにである。それらとともに竜は死ぬ。つまり、初めに同じ身体から取り出された水銀が死ぬ。それは哲学者たちの永続する水であり、腐敗ののち、元素の分離ののちにできる。この水は、別の名で悪臭を放つ水と呼ばれる。そこで哲学者。「この水は胎児に必要なすべてを自らとともに運ぶ。」アリストテレス、『自然学』第二巻。

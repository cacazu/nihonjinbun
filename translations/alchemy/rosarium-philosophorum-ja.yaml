  "translation_ja": "自然の進行に従う金の構成も、必然的に知らないことになる。したがって金は、破壊するより構成するほうが容易である。」これらなしでティンクトゥラを作れると信じる者は、宴へ向かう驢馬のように、盲目的に実践へ進む。身体は身体に作用せず、霊は霊に作用しない。形相は形相から刻印を受けず、質料は質料から受けないからである。似たものは自分に似たものに対して作用や受動を持たない。どちらも他方より優越せず、同等のものは同等のものを支配しないからである。そこでアリストテレス。「自然において適合するものからでなければ、真の生成はない。」物はその自然に従ってしか生じない。ニワトコは決して梨を生まず、茨はザクロを生まず、悪い木はよい実を結べない。また哲学者は言う。「私たちのメルクリウスは、それと結合され、あるいは分離された、あらゆる本性または諸本性へ変わる。」哲学者。「金がもはや金でなくなるように破壊する方法を知る者は、最大の秘密へ達している。」別の哲学者は言う。「金を破壊するのは難しく、構成するのはきわめて難しい。付帯的なものを壊すほうが、本質的なものを壊すより容易である。」金はすべてメルクリウスである。それはその重さと、メルクリウスが容易に結合することから明らかである。したがって、そのうちに哲学者たちの意図と志向の全体と根がある。金は天の熱と惑星の運動によって、これらの力と卓越性を獲得した。それらをそれ自体で創造することは不可能であり、付帯的にしかなされない。しかし技術者がメルクリウスにおいて仕事を始めれば、これらすべてへ"

    Scias ergo quod Aes, quod est philosophorum aurum, est aurum eorum. Dixit autem Senior: Aurum nostrum non est aurum vulgi. Quaesivisti autem de viriditate, putans quod Aes esset corpus leprosum propter illam viriditatem quam habet. Unde enim tibi dico quod totum illud, quod est perfectum in Aere, est illa sola viriditas quae in ipso est, quia illa viriditas per nostrum magisterium vertitur cito in verissimum aurum nostrum, & hoc experti sumus. Nullo tamen modo poteris lapidem praeparare absque duenech viridi & liquido, quod videtur in mineris nostris nasci. O benedicta viriditas, quae cunctas res generas, unde noscas quod nullum vegetabile atque fructus nullus apparet germinando, quin sit ibi viridis color. Similiter scias, quod huius rei generatio viridis est, quare philosophi germen ipsum appellaverunt. Et similiter eam aquam vocaverunt suae purificationis seu putrefactionis, & veritatem dixerunt, quia cum sua aqua putrificatur seu purificatur a sua nigredine, abluitur

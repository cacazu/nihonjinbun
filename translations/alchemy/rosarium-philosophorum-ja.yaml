  "translation_ja": |-
    〔前頁から続く〕赤い黄色によって金のように見せ、白いものを白で染めて銀に非常に似せることができる。また鉛や他の病んだ物体の汚れを取り去り、金銀のように見せることもできる。しかし鉛は常に鉛のままである。すでに述べたように、金銀の熟成した性質を持たないからである。たとえば人を欺くために塩化アンモニウム〔サル・アルモニアク〕や他の下位の鉱物を取り、銅や錫をメルクリウスと結合して、人々に銀のように見せる者たちがいる。火に熟達した者の判断でも、ある程度加工でき、火で試験できるように見える。しかしその判断者も欺かれている。色や試験に現れるような真の銀の本性を、その中に持たないからである。
    第一の理由は次のとおり。銅は、その外面が硫黄による部分を除けば、ある程度清浄なメルクリウスを含む。しかし臭く燃えやすい硫黄がそれを焼き、その赤さは十分に熟成したものではなく、赤く不潔な硫黄による。メルクリウスの実体が硫黄に優勢なので、鉛や錫よりも火の中で失われるのが遅い。混じった硫黄から強制を受ける分を除き、メルクリウスが抵抗するからである。しかし鉛がより速く燃えるのは、汚れたメルクリウスのためである。鉛のように、汚れたメルクリウスが汚れた硫黄とともにあると……〔次頁へ〕

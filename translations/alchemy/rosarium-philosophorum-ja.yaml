  "source_text": "-sophiae. Dixerunt Philosophi, quod lapis noster est ex spiritu corpore et anima, et verum dicunt. Nam corpus imperfectum dixerunt corpus, fermentum animam, et aquam spiritum, et bene quidem. Nam corpus imperfectum per se est corpus grave et infirmum et mortuum. Aqua est spiritus, corpus purgans, subtilians et dealbans. Fermentum est anima quae corpori imperfecto vitam tribuit, quam prius non habebat, et in meliorem formam perducit, corpus est venus et foemina, spiritus est Mercurius et masculus, anima est sol et luna. Corpus habet liquefieri in primam materiam suam, quae est Mercurius, ut dicit Morienes: Mercurius noster non habetur nisi ex corporibus liquefactis liquefactione non vulgari, sed ea tantum quae durat donec coniuges viro matrimonio sociantur et uniuntur, et hoc est usque ad albedinem. Morienes dicit Accipe flegmaticum et colericum, et terite sanguineum cum eis donec sanguineum fiat coelum tingens. Hermes: Intelligite filij sapientum, quod hic lapis preciosissimus clamet, Protege me protegam te largire mihi ius meum ut te adiuvem. Sol enim meus et radij mei intimi sunt in me. Luna vero mihi propria est, et lumen meum omne lumen superat, ac mea bona, omnibus bonis sunt sublimiora. Gaudia et laetitiam et divitias et delitias optantibus, largior multas, et cum quid inquiro agnoscunt, eos intelligere facio, et divinam vim possidere facio."

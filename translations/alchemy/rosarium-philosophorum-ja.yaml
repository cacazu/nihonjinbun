    〔前頁から続く〕このことは、おまえの理解によって見て取れるだろう。多数の部分が、分割・不連続・境界なしに結合または混合し、一つの透明な物体、一つに連続した密度と、すべての部分が透ける形になったときである。子よ、汝はいま、小さくない秘密を得た。ゆえに魂を置く前に、まず身体を明るくせよ。そうでなければ霊を受け取ることも、自らの中に保持することも決してできない。以上はライムンドゥス。哲学者カリディウスはいう。金による以外に葉状の土を染めることのできた者はなく、今後もない。それゆえヘルメスは命じていう。
    汝らの金を、焼成によって火的・微細・空気的になった、白い葉状の土に播け。
    ゆえに金のティンクトゥラをこの土に置くとき、私たちはそこに金を播くのである。しかし金は、自分以外の物体を決して完全には染められない。確かに、術によって完成されるのでなければ、これをなしえない。
    金は作業の発酵素であり、これなしに作業は成就しない。それは生地の発酵素、チーズ作りで乳を固める凝乳剤、良い香料における麝香のようなものである。これとともに大いなるエリクシルの組成が成る。明るくし、焼損から守るからであり、それが完成の徴である。そして知れ、〔次頁へ〕

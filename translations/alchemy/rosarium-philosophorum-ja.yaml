  "translation_ja": "〔前頁から続く〕乾いて湿りを欠き、燃えて腐る、植物的・感覚的な物の中に。それらが持っていないティンクトゥラを、そこに求めたのである。彼らは明白な損害を受けた。その対象は、人の髪、脳、人の唾液、女の乳、人の血、尿、人糞、胎児、月経血、精液、死者の骨、鶏卵、さらにはあらゆる動物、獣、魚、鳥、虫、蠍、蟇、天然または人工のバジリスク〔これには最大の欺きがある〕、亀、ある種の草の汁、木の花であった。とりわけ月の草と、毒と呼ばれる太陽の草、さらに金属に合わせて自分勝手な名を作ったあらゆるものである。彼らは自分と他人を欺き、最悪の物から最良の物を作り、それらで自然の欠陥を埋めようとする。しかしその中の力を真に思い描くことも調べることもなく、糞を播いて小麦を刈ろうとする。これは経験上不可能に見える。それゆえ、人は播いたものを刈ると言われる。糞を播けば、糞を刈るのである。したがって、このような者が千人に一人、あるいは誰一人完成しないのは驚くことではない。金銀を播け。おまえの労働と自然の仲介によって、千倍の実りをもたらす。それだけがおまえの求めるものを持ち、〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

    Arnoldus: Quicunque color post nigredinem apparebit laudabilis est in turba Philosophorum. Et cum videris materiam tuam denigrari gaude quia principium est operis.
    Arnoldus: Combure ergo Aes nostrum igne levi, sicut ovorum nutrix, donec corpus constituatur & tinctura extrahatur. Non autem extrahas eam totam simul, sed per parum & parum egrediatur omni die, donec in longo compleatur tempore.
    Ego sum nigrum albi & rubeus albi & citrinus rubei, & certe veridicus sum & non mentiens. Et scitote quod caput artis est corvus qui in nigredine noctis & diei claritate sine alis volat. Ex amaritudine namque in suo gutture existente, coloratio accipitur, a suo vero corpore rubor, ac a suo dorso mera aqua accipitur. Intelligite ergo donum Dei & recipite et ab omnibus celate insipientibus.

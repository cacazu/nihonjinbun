  "translation_ja": "次に、底に輝いて見出される水晶状の薄板から取り出し、まず擦り砕いて最後の蝋状化を施せ。弱い火にかけた坩堝の中で、すでに述べたその白い空気を一滴ずつその上に滴らせ、煙を出さず蝋のように融けるまで続ける。次に赤熱した板の上で試し、蝋のように極めて速く溶ければ蝋状化している。そうでなければ、その白い油を一滴ずつ加えて再び蝋状化し、煙を出さず蝋のように融けるまで続ける。これこそすべての哲学者の教えである。昇華した部分を固定したなら、土の最も純粋な部分において、その固定したものの上に、残りの固定していない部分の昇華を繰り返し、それも同じく固定するまで続けよ。その後火の上で試し、よい融解を示せば、十分に昇華を反復したのである。そうでなければ、煙を出さず蝋のように速く融けるまで、固定していない部分をその上へ何度も昇華させよ。そのとき取り出し、冷めるに任せる。今述べた章で、著者が蝋状化の方法を何度も繰り返す、その熱心な意図に注意せよ。一度繰り返すだけでも足りたかもしれない。しかし、倦まずに蝋状化を増し重ねることの必要性を、読者の理解へより強く、より堅固に刻み込むために、彼は……〔次頁へ〕"

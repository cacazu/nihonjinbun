    〔前頁から続く〕この土は水とともに腐敗し、万物を統べる方の助けで浄化されたとき、奥義全体は完成する。さらに、土がその水と混ざり、穏やかな煮沸によって水が次第に減り、土が増えるのを見て、彼らは皆、これが完全な蝋状化だと言った。それゆえ哲学者は、土は水によって蝋状化され、液を吸わされ、太陽、すなわち熱による穏やかな煮沸で乾かされ、質料全体が土へ転じるという。同じ著者はいう。この力は、土に転じるなら完全となる。
    最後に、質料全体がある散逸に至り、やがて固い実体に戻って、流れずにしっかりと留まるのを見て、これを完全な凝結と呼んだ。それゆえプラトンはいう。私たちの石を溶かし、その後、示されたように十分注意して凝結させよ。そうすれば奥義のほぼすべてを得る。同じ著者は別のところでいう。私たちの石を取り、器に入れ、砕けるまで弱い火で焙れ。その後、凝結するまで太陽の熱で煮よ。奥義全体は、真の溶解と、完全で自然な凝結を行うことにほかならないと知れ。以上はプラトンの言葉である。また彼はいう。溶かせ、そして凝結させよ。そうすれば奥義全体を知る。同じく、上述の質料が完全に凝結し濃くなり、いかなる仕方でも……〔次頁へ〕

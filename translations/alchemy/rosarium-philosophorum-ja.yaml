  "translation_ja": |-
    『愚者の矯正』と呼ばれる、ある権威ある小論より
    普通の硫黄と、哲学者たちの単純で燃やさない硫黄との相違について
  "translation_status": "draft"
- "id": "ROS-101-T02"
  "section_id": "section-4"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cum generaliter philosophus loquatur, quod sulphur coagulat, dicendum quod non, quia omne sulphur vulgi secundum philosophum metallis est extraneum & contrarium. Avicenna: Non intrat in magisterium, quod non est ortum ab eo quia semper inficit & denigrat, & corrumpit quocunque modo per artificium praeparetur. Est enim ipsum ignis infectus, ergo fusionem impedit. Si vero calcinatur, in terream redit substantiam ut pulvis mortuus. Quo ergo modo potest alijs vitam inspirare. Habet enim duplicem superfluitatem, scilicet inflammabilem substantiam & terream faeculentiam. Igitur per haec considera sulphura vulgi non philosophorum esse, cum sulphur philosophorum sit simplex ignis vivus, vivificans alia corpora mortua & maturans ea, ita quod naturae defectum supplet, cum ipsum sit superfluae maturitatis, secundum quod in natura sua sit perfectum, ac per artificium magis ac magis"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 101
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720910"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720910"
  "translation_ja": "哲学者は一般に硫黄が凝結させると語るが、そうではないと答えねばならない。哲学者によれば、普通の硫黄はすべて金属に異質で、相反するからである。アヴィセンナはいう。そこから生じていないものは奥義に入らない。術によってどのように調製されても、それは常に汚し、黒くし、損なうからである。それは汚れた火であり、ゆえに融解を妨げる。焼成すれば、死んだ粉のような土の実体へ戻る。それならどうして他のものに命を吹き込めるだろうか。それは二つの余剰物、すなわち燃えやすい実体と土の滓を持つ。したがって、普通の硫黄は哲学者たちの硫黄ではないと考えよ。哲学者たちの硫黄は、単純で生きた火であり、他の死んだ物体を生かし成熟させ、自然の欠陥を補うからである。それ自体が満ち余る成熟を持ち、その本性で完全であり、さらに術によってますます……〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

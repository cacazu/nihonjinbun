  "translation_ja": |-
    哲学者たちの鉛から、黄金色、あるいはそれに近い色の油が取り出されることを知るべきである。鉱物的、植物的、動物的、または混合された石を、最初の固定の後、この油とともに三度か四度昇華するなら、それは溶解と凝結のあらゆる労苦を汝に免れさせる。
    その理由は、これが隠された油であり、薬を浸透しうるもの、すべての物体と親和し結合しうるものにし、その効力を限りなく増大させるからである。世界にこれ以上秘密なものはないほどだ。
    それゆえ、私は古代のどの哲学者にも信じられないような驚異を語る。すなわち、この油を水性からよく分離することを知り、すでに述べた混合の方法で働くなら、三十日のうちに石を組成できる。
    ただしこれはそれ自体として必須ではない。すでに述べたように、その溶解と凝結は速やかに行われるからである。

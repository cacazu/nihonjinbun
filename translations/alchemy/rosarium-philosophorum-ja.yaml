  "translation_ja": |-
    隠された石があり、泉の底に埋められている。
    卑しく、捨てられ、糞や汚物に覆われている。
    この一つの石は、一つなるもののあらゆる名を持つ。
    それゆえ神に満たされた賢者モリエヌスは言った。
    この石は石ではない。生み出すことを許された生き物である。
    またこの石は鳥であり、石でも鳥でもない。
    この石は塊、根株、サトゥルヌスの子である。
    この石はユピテル、マルス、太陽、ウェヌスであり、
    翼ある者と月である。ただ一つで、すべてより明るい。
    あるときは銀、あるときは金、あるときは元素、
    あるときは水、葡萄酒、血、クリソリヌム、
    あるときは処女たちの乳、海の泡、または酢、
    あるときは悪臭を放つ汚水溜めに滴る尿、
    またあるときは岩塩、アルミサディル、普遍の塩、
    あるときは雄黄を第一の元素と定め、
    あるときは硫黄とともに浄化された清い海とする。
    愚者に明かしたくないものを、彼らはこうして言い換える。
    賢者が欺かれぬよう、このように形象化され、
    論じられるものが愚者へ分け与えられぬようにされる。

  "source_text": "Ab hinc ergo extrahe de lamina cristallina, quam in fundo reperies lucidam, & primo tere et cera inceratione ultima, guttando super ipsum guttam ad guttam interim crusibulo, super ignem levem de suo aere albo iam dicto donec fundatur sicut cera sine fumo, tunc proba super laminam ignitam si se resolverit velocissime sicut cera cerata est, si vero non, reduc ipsam ad cerandam, guttam ad guttam, de oleo suo albo donec fundatur ut cera sine fumo, et hoc quidem est praeceptum omnium philosophorum, ut cum partes sublimatas fixaveris, mundissimam terrae partem reiteres sublimationem residuae partis non fixae super eam fixam, donec ipsa similiter figatur, hinc tenta super ignem, si bonam dederit fusionem, tunc sufficienter sublimationem reiterasti. Si vero non, reitera super illam vice post vicem non fixae partis sublimationem, donec fundatur cito sicut cera sine fumo, tunc extrahe et infrigidari permitte. Ex iam dicto capitulo, nota attente intentionem zelosam authoris in eo quod toties reiterat modum incerationis, forte suffecisset semel illud repetisset, sed ut fortius & tenacius imprimeret lectoris intellectum de necessaria infatigabili incerationis multiplicatione ideo"

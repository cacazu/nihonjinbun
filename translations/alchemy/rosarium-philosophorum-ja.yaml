  "source_text": "quaerit aliquod vicinatum suae imperfectionis, & cum argentum & cuprum commixta sunt in argento, non invenit quam rem infectam, sed in cupro invenit primo sulphur adurens cui citius admiscetur, & in commixtione universali mercurius cupro magis inficitur, cum plumbum sit ex utraque parte scilicet mercurij & sulphuris infectum. Etiam quia plus malum citius adhaeret malo, in tantum debilius & peius erit, & ideo citius adhaeret cupro vel argento, inficiens & comburens illud, cum natura cupri & argenti ut audisti ex utraque parte sit serata, peiori subvenire non potest, & sic plumbum comburit cuprum ab argento, quod tardius separatur sine plumbo, quoniam in quantum magis imperfectius est, tanto debilius erit & combustibile. Sed in coniunctione statim cum cupro & mercurio aliquo modo aperit naturas, & coniungit haec duo, scilicet stannum & cuprum, mercurium ex utraque parte aliquo modo mundum, cum stannum habet Mercurium mundum & sulphur malum debiliter commixtum, coniungitur Mercurius Mercurio. Et Mercurius semper habet potentiam sulphuris, variando colorem cupri quae existit in sulphure, ita quod nova forma appareat et etiam ita cito sulphur comburere non potest, sicut antea ipsum mercurium, & cum mercurius crudus coagulatur per ipsum, alteratur cum eis in natura sicut aliquo modo appareat argentum"

  "translation_ja": "ゲベルは第二書第五章でいう。私たちはいう。あらゆる溶解の完成は、微細で、とりわけ鋭く刺激的で渋みがあり、滓をまったく持たない水によってもたらされる。たとえば蒸留した酢、酸い葡萄、強い酸味の梨、同様に蒸留した石榴、またそれらに似たものである。この方法の発見の理由は、融解も浸入もしないもの、すなわち固定された霊とその類のものを微細化することにあった。それらから得られる大きな利益が失われていたからである。溶けるものはすべて、塩、明礬、あるいはそれらに似たものの本性を持たなければならない。その本性は、ガラス化する前に融解することである。したがって溶解した霊も同じような融解を示す。その本性によって物体と、また互い同士とも大いに適合するので、融解を得ればそれによって物体へ浸透し、浸透して変成させるはずである。しかし奥義なしにはここへ至らない。すなわち、その溶解と凝結の後、精製されているが固定していない霊を施し、それがともに残り、より速い融解を与えるまで、何度もそこから昇華させる。そしてそれを、融解の際に……〔次頁へ〕"

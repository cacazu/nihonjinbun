  "source_text": |-
    Hi autem sunt modi operationis istius lapidis, quibus mediantibus haec res quam nos quaerimus generatur, & in esse actuale deducitur.
    Et est unus modus sublimatio, Alter descensio, Tertius distillatio, Quartus Calcinatio, Quintus solutio, Sextus congelatio, Septimus fixio, Octavus iteratio, Nonus ceratio. Et his similibus dicunt infinita, qui quidem modi, licet sint ad invicem ratione diversi, sunt tamen idem in re. Aliquando enim philosophi considerantes materiam eorum, quae quando in vase est & sentit solem & calorem in continenti exhalat, seu evaporat in speciem fumi subtilissimi, & ascendit in altum in capite vasis, vocaverunt talem ascensionem sublimationem. Videntes postea talem materiam, quae ascenderat descendere ad fundum vasis, vocaverunt distillationem seu descensionem: Adhuc videntes inspissari istam materiam & denigrari, & foetorem malum dare, vocaverunt putrefactionem. Videntes colorem nigrum, seu fuscum, & foetorem malum post longum tempus dimittere, & albedinem aliqualem ad modum cineris coloris venire, vocaverunt incinerationem seu dealbationem. Ideo Morienes ait: Totum magisterium nihil aliud est nisi extractio aquae ex terra, & aquae super terram dimissio donec putrefiat ipsa,
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 178
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720987"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720987"
  "translation_ja": |-
    この石の操作には次のような方法があり、それらによって私たちの求めるものが生まれ、現実の存在へともたらされる。
    第一は昇華、第二は下降、第三は蒸留、第四は焼成、第五は溶解、第六は凝結、第七は固定、第八は反復、第九は蝋状化である。さらにこれらに似た無数の名を語る。これらの方法は概念の上では互いに異なるが、実際には同じである。哲学者たちは、自分たちの質料が器の中にあり、太陽と熱を受けると、ただちに極めて微細な煙の形で発散し、蒸発して、器の頭の高みに昇るのを観察して、この上昇を昇華と呼んだ。その後、上昇した質料が器の底に下降するのを見て、蒸留または下降と呼んだ。さらに、その質料が濃くなり黒くなり、悪い臭いを放つのを見て、腐敗と呼んだ。長い時を経て黒い、または褐色の色と悪臭を失い、灰の色のようなある白さが現れるのを見て、灰化または白化と呼んだ。それゆえモリエヌスはいう。奥義の全体は、土から水を取り出し、それが腐敗するまで水を土の上に下ろすこと以外の何ものでもない。〔次頁へ〕
  "translation_status": "draft"
  "source_kind": "prose"

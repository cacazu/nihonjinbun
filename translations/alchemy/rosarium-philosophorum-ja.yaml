  "source_text": "quamvis vere non est argentum, cum in eo non fuerit debita digestio et decoctio, & sulphur ignis non simplicis & virtualis naturae, sicut ipsum argentum vivum, ex quo aurum & argentum ex utraque parte, scilicet mercurij et sulphuris sufficienter sunt digesta & bonae maturitatis, & in omni digestione perfecta, sic habes argentum sophysticum ex cupro, stanno & mercurio, & si tunc admiscueris aliquos pulveres minorum mineralium, non est impossibile si mercurius super potentiam agat, sed semper cum adhuc sit imperfectum in fine diminuitur & comburitur in igne, cum sulphur non sit virtualis naturae, sicut ipse mercurius sed semper obnoxius occulte, & inficiens mercurium, quamvis bene mercurius sit suppeditatus, & sic postmodum in stercus redibit sicut antea fuit, sic ergo intellige quomodo verum aurum & argentum differunt a sophystico, licet plures sophysticationes fiant eodem modo per alia metalla in rubeum & album, adiunctis minoribus mineralibus vel aliquo ipsorum, sunt autem illi laborantes delusi cum aestimant se bonam invenisse apparentiam hoc facit eorum ignorantia quia naturas metallorum non cognoscunt &c."
  "source_languages":
  - "la"
  "source_locations":

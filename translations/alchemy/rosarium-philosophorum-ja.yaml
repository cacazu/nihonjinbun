  "translation_ja": "〔前頁から続く〕すべてを高め、また低める。私の下僕の誰も私に勝てない。ただ一人、私と対立することを授けられた者を除いては。その者は私を破壊するが、私の本性までは破壊しない。それはサトゥルヌスであり、私のすべての肢体を引き離す。その後、私は母のもとへ行く。母は分割され隔てられた私のすべての肢体を集める。私は私に属するすべてを照らし、わが父サトゥルヌスから、さらに私に敵対する母からの道程で、光を明らかに現れさせる。しかしこれが起こらなければ、私は動物や植物の魂から飲むことができない。だが私は火の熱とともに来て、彼らの力と害を私から追い払う。私は鉱床の表面に住み、私の末端のものを下僕に分け与える。私の名は偉大な名々で呼ばれる。私を研究する者は他の何ものにも心を煩わせないが、私によって満ち足りることもない。私は海を渡る船を運び、密集した都市を築く。しかしそこに私の偉大さを求めるな。そこで、すべての賢者たる汝らに告げる。私を殺さなければ、汝らの理解は完全にならない。汝らの知恵の階梯は、私の姉妹たる月において高まり、他のどの下僕によっても高まらない。もし私の秘密を知るなら、私は清らかな土地に播かれた穀物であり、生じて成長し、増え、播いた者に実りをもたらす。なぜなら、すべて生むものは自らの類に従って生み、どの個体も……〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

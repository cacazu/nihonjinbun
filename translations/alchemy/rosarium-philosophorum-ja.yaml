  "source_text": "-versas res. Unde fili moneo te quod totum intentum tuum sit in decoctione aquae, & ne taedeat te si vis habere fructum, & non cures de alijs rebus vanis nisi de sola aqua. Coque ipsam paulatim putrefaciendo donec mutetur de colore ad colorem perfectum. Et cave quod in principio non combures suos flores, nec suam viriditatem & noli cito perficere opus tuum, & nota quod ianua tua bene et firmiter sit clausa, ut ille qui est intus evolare non possit, et deo concedente, ita pervenies ad effectum. Natura facit suam operationem paulative. Ego vero volo quod tu ita facias, imo secundum naturam tua sit imaginatio. Et vide secundum naturam, de qua regenerantur corpora in visceribus terrae. Et hoc imaginare per veram imaginationem et non fantasticam. Et vide similiter quo calore fit decoctio eorum si est violentus vel suavis."

  "source_text": "suo omnia animalia, & ignis perdit ipsum, & disperdit tempore brevi propter argentum vivum, non enim potest super ipsum, nec commedit, sed fugit ab ipso. Ingeniaverunt autem ei sapientes primi philosophi modos ingeniorum, donec paulatim factum est expectans ignem, non ergo cessat gradari super pugnamentum ignis, & cibatur eo, ita quod quando ei figitur aliqua fixio, perveniunt mirabilia & mutationes, quoniam cum ipse mutatur mutat, & apparet nigredo eius, & sonitus eius & splendor eius, cum ergo tingitur est tinctum & tingit, cum coagulatur, coagulatum est et coagulat, cum solvitur solutum est et solvit, & ipsum albificat in visione oculi, & rubificat in successione, & est aqua congregans, & lac & urina fortis, & oleum mollificans, & pater mirabilium omnium, & est caligo & nubes & servus fugitivus, & mercurius occidentalis, qui praetulit se auro & vicit illud, dicit ergo ei aurum, an praefers te mihi & ego sum dominus lapidum expectans ignem, dicit ei noster mercurius, utique sed ego genui te & ex me natus es, & una pars ex me vivificat multas partes de te, sed tu es avarus, & non das aliquid in comparatione ad me, & qui ligaverit me cum fratre meo et sorore mea vivit et gaudet et sufficit ei in vita sua et si viveret mille milibus annis et si reficeret omni die septem millia hominum, non egeret,"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 175
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720984"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720984"
  "translation_ja": "〔前頁から続く〕すべての動物を殺す竜である。火はそれを滅ぼし、水銀のために短時間で散らしてしまう。それは火に勝つことも、火を食べることもできず、火から逃れるからである。しかし最初の賢明な哲学者たちは、そのためにさまざまな工夫を考案し、少しずつ火に耐えるものにした。それゆえ火との戦いにおいて絶えず前進し、火を食物とする。それにある固定が施されると、驚異と変化が生じる。自らが変わるとき、他のものを変えるからである。そしてその黒さ、音、輝きが現れる。染められれば、染められたものとなって染める。凝結すれば、凝結したものとなって凝結させる。溶解すれば、溶解したものとなって溶かす。それは眼に見える仕方で白くし、続いて赤くする。それは集める水、乳、強い尿、柔らかくする油、あらゆる驚異の父であり、暗霧、雲、逃亡する奴隷、西方のメルクリウスである。それは金よりも自らを高く置き、金に勝った。そこで金はいう。私は火に耐える石々の主なのに、お前は私より優れているというのか。私たちのメルクリウスは答える。まことにそうだ。私がお前を生み、お前は私から生まれた。私の一部分がお前の多くの部分を生かす。しかしお前はけちで、私に比べれば何も与えない。私を私の兄弟と姉妹とに結びつける者は、生きて喜び、その生涯に十分なものを得る。たとえ百万年生き、毎日七千人を養ったとしても、欠乏することがない。〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

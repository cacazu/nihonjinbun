  "translation_ja": "ライムンドゥス。私たちのこの石は、すでに自然にティンクトゥラを含む。マグネシアの身体に完全に造られているからである。しかし術と操作によって完成されなければ、自ら動くことはない。ゲベルは根源の操作においていう。作業が行われるのは、金の中の金のティンクトゥラを、その本性にある以上に良くし、さらに賢者たちの寓意に従って組成されたエリクシルを作るためである、など。しかし、必要なのは金だけで、他の物体は不要なのだろうか。ヘルメスの言葉を聞け。その父、すなわち最初の組成の父は太陽、その母は月である。父は熱く乾き、ティンクトゥラを生む。母は冷たく湿り、生まれたものを養う。それゆえ、石にその片方しかなければ、薬は決して容易に流れず、ティンクトゥラを与えない。与えたとしても、他方がある程度にしか染めず、メルクリウスは煙となって飛び去る。そこにティンクトゥラの受け容れがないからである。しかし、私たちの最終の秘密は、メルクリウスが逃げるより先に流れる薬を持つことである。したがってこの二つの結合は、私たちの作業に必須である。ゲベルは完全な奥義においていう。金属の最も貴いものは金である。それは霊を不完全な身体と結びつける魂だからである。人間の身体が魂なしには死んで動かないように、不浄な物体も、その魂である発酵素なしには、土的で……〔次頁へ〕"

  "source_text": "Prima materia corporum non est Mercurius vulgi, sed est vapor unctuosus et humidus. Nam ex humido fit lapis mineralis, & ex unctuoso fit corpus metallicum. In talem namque vaporem unctuosum oportet ut corpora convertantur, et in conversione corpora interimuntur, & granum corporis in mortem prosternitur, et totaliter mortificatur. Et hoc fit mediante nostra aqua alba et rubea. Et sic intellige, nisi granum frumenti, id est granum corporis proiectum fuerit in terram, id est in suam primam materiam, id est in unctuosum vaporem vel Mercurium Philosophorum et sapientum etc. Et talis vapor dicitur lapis in capitulis librorum notus, & principium materiae nostrae operationis, & sulphur unctuosum, ex quo in complemento extrahitur quinta essentia, Mercurius, tingens omne corpus in Solem vel Lunam, secundum quod lapis fuit finaliter praeparatus. Item nota, quod quasi omnes Alchimiae Sapientes Antiqui quoniam multa dixerunt concludunt de sale, quod dicunt saponem Sapientum, et claviculam quae claudit & aperit, et iterum claudit et nemo aperit, sine qua clavicula dicunt neminem in hoc seculo posse pervenire ad perfectionem huius scientiae, id est, nisi sciat salem post suam praeparationem calcinare. Et dicunt quod debet esse in loco temperato per tres dies, ut calor"

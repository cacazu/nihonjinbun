    Geber libro tertio capite nonagesimo. Epilogatio totius. Quia pertractavimus huius magisterij causarum sufficientiae experientias notas, secundum nostri propositi sermonis exigentiam restat nos ad complementum totius operis divini pervenire in capitulo uno, & in summam contrahere sermonis abbreviati in capitulis dispersum magisterium. Dicimus igitur quoniam totius operis intentionis summa non est nisi ut sumatur lapis in capitulis notus, deinde vero cum operis instantia assiduetur super illum opus sublimationis primi gradus, & per hoc mundatur a corrumpente impuritate. Et est scilicet sublimationis perfectio, & cum ea subtilietur lapis donec in ultimam subtilitatis puritatem deveniat, & ultimo volatilis fiat, ab hinc vero cum fixionis modis figatur, donec in ignis asperitate quiescat, & hic secundi praeparationis gradus meta consistit.
    Sed & tertio similiter lapis administratur gradu, qui in ultimo constat praeparationis complemento, scilicet ut iam fixum lapidem cum modis sublimationis volatilem facias, et volatilem fixum & fixum solutum, & solutum iterato volatilem, & iterato volatilem fixum, quousque fluat & alteret in complemento solifico & lunifico certo. Ex reiteratione igitur praeparationis huius gradus

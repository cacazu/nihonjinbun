  "translation_ja": |-
    アルフィディウスはいう。その黒い物体から取り出される水銀は、白く湿ったものであり、作業を損なわぬよう、皮殻から清められている。モリエヌスはいう。白い煙は、溶解されたそれらの物体の魂であり霊であることを知らねばならない。確かに、白い煙が金でなかったなら、そこに錬金術はなかったであろう。『ロサリウス』はいう。これこそ私たちの最も高貴なメルクリウスである。神は理性的な魂を除いて、天の下にこれより高貴なものを造ったことがない。
    ギリシア人の王ヘルメスはいう。溶解した物体は永続する水であって、メルクリウスを永久の凝結で固める。ヒポクラテスはいう。物体を清めようとする者は、それを流動するものにしなければならない。腐敗の黒さは、ある人々によれば四日か五日続く。セニオルはいう。第一の鍵は液と脂を取り出すことである。その徴は、すなわち過剰な黒さであり、それが消費されれば魂はすでに水の中にある。アルベルトゥスはいう。魂が自らの身体を出て、上方の天に昇らなければ、この術において何も達成できない。白いティンクトゥラについてのセニオルの譬え。私の愛しい両親が生命を味わい、私の乳を飲まされ、白い純粋な葡萄酒に酔い、私の小さな寝床で結婚すれば、彼らは自らの一族すべてに勝る月の子を生むであろう。そして私の恋人が岩の赤い丘から飲み、母の泉を味わい、それによって結合し、私の赤い葡萄酒と、私と……〔次頁へ〕

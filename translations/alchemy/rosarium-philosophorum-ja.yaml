    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720813"
  "translation_ja": "真の自然の根源とその扱い方を知らずに、発見を求めてこの術に手を出してはならない。それを知れば、多くの物は必要なく、ただ一つで足り、大きな出費も要しない。石は一つ、薬は一つ、器は一つ、管理法は一つ、配列も一つだからである。この術がきわめて真実なものであることを知れ。哲学者たちは、自ら見たり触れたりしていなければ、あれほど多くの色の相違やその順序を言い表そうとはしなかったはずである。だから重ねて言う。自然の外で労する者はみな、欺かれる者でもあり、欺く者でもある。それゆえ、私たちの実践と熱心な奉仕を自然のうちに置こう。私たちの石は動物的、植物的、鉱物的なものに由来するからである。自然の仕事においては、一つの意志を保て。あるときはこれ、あるときはあれを試そうとしてはならない。私たちの術は、多数の物を用いて完成するものではない。その名称がどれほどさまざまでも、つねにただ一つの物であり、同じ物に由来する。自然のうちにその本性から存在しないものが、自然へ導き入れられることはない。したがって、作用するものと作用を受けるものは、類においては同一の物であり、種においては別で異なるものでなければならない。メルクリウスによれば、それは女と男が異なるのと同じである。両者は一つの類において一致していても、質料と形相が異なるように、互いに明確な差を持つ。質料は作用を受けるが、形相は働きかけ、質料を自らに"
  "translation_status": "draft"
  "source_kind": "prose"

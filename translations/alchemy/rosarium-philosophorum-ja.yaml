  "source_text": "in omnes res sive in solem, sive in lunam, & hanc sublimationem facimus ut corpora redigamus in suam primam materiam, scilicet in mercurium et sulphur. Facimus ergo hanc sublimationem tribus de causis, una est quod corpus sit spiritus, de subtili materia et natura, secunda est quod mercurius se bene incorporet cum calce, tertia est quod totum sumat colorem album vel rubeum. Idcirco quando calx sublimatur ad lunam, debet esse alba, et mercurius similiter albus, et calx quando sublimatur ad solem debet esse rubea, et mercurius similiter rubeus igne calefactus, et debet esse pulvis inceratus, non mittas mercurium rubeum ad album nec album ad rubeum, sed pone unamquamque speciem cum sua specie et pone ad ignem accensum et sublima totum, et non misceas illud quod remanet deorsum cum illo quod ascendit sursum, quoniam quod in fundo remanet reiterabis ad sublimandum per mercurij incorporamentum donec ascenderit totum, alioquin non ponas ipsum in magisterium, alembicum in quo sublimas mercurium sit vitreum et cucurbita terrea, vitreata cuius os fundi sit amplum quod possit mercurius ascendere liberius. Alembicum vero cum cucurbita debet iungi ita quod mercurius non possit exire seu evaporare ne depereat magisterium &c."

- "id": "ROS-140-T01"
  "section_id": "section-4"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "nec poterit separari oleum ab ipso panno, nisi per ablutionem & ignis desiccationem, aqua autem est spiritus, extrahens hanc animam a corporibus, cum vero extrahitur anima ab ipsis corporibus, remanet in ipso spiritu deportata, sicut deportatur tinctura tinctorum per aquam super pannum, deinde recedit aqua per desiccationem, & remanet tinctura in panno fixa propter oleoginositatem, sic ergo aqua est spiritus, in quo portatur tinctura aeris, quae cum reducitur super terram albam foliatam, statim siccatur aqua spiritualis, & remanet in corpore anima, quae est tinctura aeris, spiritus ergo retinet animam, sicut anima retinet corpus, quoniam anima non moratur in corpore nisi mediante spiritu, cum vero coniunguntur nunquam separantur, quia spiritus retinet animam, sicut anima retinet terram. Unde praecipit Hermes, animas venerari in lapidibus, est enim mansio eorum in ipsis, sunt autem retentivae fugitivarum cum eis, ergo est coagulatio nostra, quoniam retinent fugientem, seminate ergo animam in terram albam foliatam, quoniam ipsa retinet eam, quoniam cum ascenderit a terra in coelum, iterumque descenderit in terram, recipiet vim inferiorum & superiorum. &c."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"

    NOMINATI ARTIFICES huius artis fuerunt, ut refert Vincentius in Speculo Naturali.
    Adam. Noe. Idrid. Squilia. Chora. Moyses. Et soror eius Maria. Catho. Vergilius. Aristoteles. Alexander. Geber. Iahie. Rasi. Abimazar. Maurienus sive Morienes. Iohannes Evangelista. Garsias, et Gilbertus Cardinales. Gvuilhelmus Episcopus Huck appellatus. Aegidius magister hospitalis, qui extraxit librum de 125. lapidibus. Androicus etiam Episcopus, & Apostolicus dominicus. Et Iacob Aranicus Iudeus, qui me in ista arte non pauca docuerunt. Petrus quoque & Dirandus Monachi. Avicenna. Arnoldus de nova Villa. Et Reymundus qui nostris ultimis temporibus floruerunt.

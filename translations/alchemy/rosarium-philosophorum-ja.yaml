    油と水だということである。アルノルドゥス。「火の強さの諸段階の間で、経験が適度なものを示す。溶解では火はつねに弱く、昇華では中くらい、凝固では穏やか、白化では絶え間なく、赤化では強くなければならない。これらを知らずに誤れば、失敗と労苦を幾度も嘆くことになるだろう。ゆえに熱心に仕事へ取り組め。術は才知に助けられ、才知も同じく術に助けられるからである。また、完成だけを目指し、ほかのことは捨て置け。」聖トマス・デ・アクィノ。「石の質料は粗い水である。作用するものは、その水を凝結させる熱または冷気である。また同様に、動物から出る石は、ほかの石より貴いと信じよ。」
    『光の光』。「効力を持ち、私たちの鉱山に生じる緑色で液状のドゥエネクなしには、どの種類の石も調製できない。」ラーシー。
    「息子よ、右と左にある、世界の最も高いものを観照せよ。そして私たちの石が見つかる所へ、あらゆる種類の色材と香料、同じく鉱物を産するあの山へ上れ。」
    マルカメク。「この仕事に必要な石は、生気ある物に由来する。平地にも山にも水の中にも、至るところで見つかり、富める者も貧しい者も持っている。それはきわめて卑しく、またきわめて貴い。肉と血から成長する。それを知る者にとって、何と貴重なものだろう。」『哲学の宝庫』より。

  "source_text": "Fiat concha vitrea rotunda, cuius fundus parvae sit quantitatis ad modum parapsidis. Et in medium eius spondilium formetur zona vitrea circundans eam, Et super illam zonam paries fundetur rotundus aeque distans a conchae pariete ad grossitiem cooperculi ipsius conchae, ita quod in distantia hac cadet paries coopertorij large sine pressura. Altitudo vero parietis huius sit ad mensuram altitudinis parietis conchae, aut parum plus aut parum minus. Formentur vero duo coopertoria ad mensuram huius concavitatis duorum parietum aequalia, quorum longitudo sit aequalis, & sit quaelibet duarum magnarum palmarum, & figura eorum una scilicet piramidalis, In quorum capitibus duo aequalia sint foramina, unum videlicet in uno, & alterum in altero, in quibus ambobus possit cadere una gallinae"

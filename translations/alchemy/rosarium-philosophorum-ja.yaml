    & vegetabile, ipsum enim est tinctura rubedinis transformans omne corpus, ipsum est fermentum totam massam convertens ad suam naturam, quia sicut sol & luna caeteris planetis dominantur, sic ista duo corpora dominantur alijs corporibus metallorum quae ad naturam praedictorum corporum duorum conformiter convertuntur, & ideo fermentum dicitur, nam sine ipso germina non emendantur, & sicut modicum fermenti totam massam corrumpit, id est transmutat & elevat, sic & in nostro quoque lapide accidit: Unde Hermes dicit.
    Fili extrahe a radio suam umbram, accipe ergo quartam partem sui, hoc est unam partem de fermento & tres partes de corpore imperfecto, dissolve fermentum in aequale sui aquae mercurij coque insimul lentissimo igne, & coagula illud fermentum, ut fiat sicut corpus imperfectum & orificio vasis clauso, eodem modo & ordine ut dictum est fit per omnia praeparatum. Aristoteles: Elige tibi pro lapide per quem reges venerantur in Diadematibus suis, & per quem physici habent curare aegrotos suos, quia ille est propinquus igni.
    Fili recipe de simplicissimo & de rotundo corpore, & noli recipere de triangulo vel quadrangulo sed de rotundo, quia rotundum est propinquius simplicitati quam triangulus. Notandum est ergo quod corpus simplum nullum habens angulum

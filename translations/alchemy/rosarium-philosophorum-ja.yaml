    そこで知れ。哲学者たちの金である銅こそ、彼らの金である。セニオルは言った。「私たちの金は、世間一般の金ではない。」おまえは緑について問い、銅にその緑があるため、銅は癩を病んだ身体なのだと考えた。そこでおまえに言おう。銅のうちにある完全なものは、ただそこにあるその緑だけである。その緑は私たちの奥義によって、すみやかに私たちの最も真実な金へ変わるからである。私たちはこれを経験している。しかし私たちの鉱山に生じると思われる、緑色で液状のドゥエネクなしには、決して石を調製できない。おお、すべての物を生む、祝福された緑よ。それゆえ知れ。植物も果実も、芽生えるとき、そこに緑色がなくて姿を現すことはない。同様に、この物の生成は緑色であることを知れ。このため哲学者たちは、それを芽そのものと呼んだ。また彼らはそれを、自らの浄化または腐敗の水とも呼んだ。それは真実である。それ自身の水によって腐敗し、あるいは黒さから浄化され、洗われて、

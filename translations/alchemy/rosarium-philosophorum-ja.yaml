  "translation_ja": |-
    〔前頁から続く〕経験が教えるとおりである。その中に善く成熟した清い硫黄を含むなら、それから個別的に太陽と月ができる。
    哲学者はいう。術によってこれを他の金属的物体と混ぜよ。それはそれらと同じ本性を持ち、それらはそれから生じたからである。それゆえ術によって可能であり、熟成した本性をそこに模倣させ、それらとともに完成させよ。こうして結びつく金属に似たものとなり、異質なものを何も混ぜる必要がない。自然は単純に自らの本性を喜び、異質なものを喜ばないからである。太陽とともには太陽、月とともには月、ウェヌスとともにはウェヌスとなる、など。各々がその力をそこへ送り込むからであり、またそれ自身が善いが未熟な硫黄を含み、その硫黄が術によって成熟するからである。したがって、燃えやすい硫黄によって凝結し汚された他の金属は、これと同じように個別的に太陽と月になることはできない。
    第一の理由。もしそれらをメルクリウスに変え、太陽と月と混ぜても、そのメルクリウスは以前持っていた悪い硫黄をなお含むからである。
    また浄化しても、以前のような単純さのメルクリウスへ戻せるほどには浄化できない。そのメルクリウスによって物体をその中へ溶かすこともできず、溶かせなければ、閉じ込められた力をそこへ送り込むこともできない。

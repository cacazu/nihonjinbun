  "kind": "paragraph"
  "origin": "source"
  "source_text": "Filij philosophorum corpora sunt septem, quorum primum est aurum eorum optimum, rex & caput, quod nec terra corrumpit nec res comburentes comburunt, nec aqua alterat, eo quod eius complexio est temperata et natura directa in caliditate & frigiditate & humiditate & siccitate, nec in eo est quod superfluum nec minus, quare ipsum praetulerunt philosophi magnificaverunt, & dixerunt quod aurum sic se habet in corporibus, quemadmodum sol in stellis suo lumine & splendore, eo namque vegetabilia germinant in terra, & omnis fructus perficitur nutu dei. Similiter aurum in corporibus omne corpus secum continet & vivificat, quod elixir fermentum est, sine quo nequaquam peragitur quemadmodum pasta absque fermento non fermentatur nec elevatur, sic cum corpora dealbas sublimas, mundificas, & ex eis fecem & turpitudinem extrahis, deinde volens ea coadunare, coniungere, & simul miscere, impone fermentum eis, inspice qualiter pastae fermentum nihil aliud est quam fermentum, meditare igitur & contemplare utrum rei fermentum sit nisi etiam ex sua natura. Haec est clavis omnium philosophorum, & notandum quod fermentum confectionem dealbat, combustionem inhibet, & tincturam continet ne fugiat, corpora lenificat & se invicem ingredi facit & coniungit,"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 108
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720917"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720917"
  "translation_ja": "哲学者たちの子らよ、物体は七つある。その第一は金、それらの最良のもの、王であり頭である。土もそれを腐敗させず、燃やすものも焼かず、水も変えない。その体質は調和し、その本性は熱・冷・湿・乾において正しく整い、過剰も不足もないからである。ゆえに哲学者たちは金を優先し、称え、金が物体の間で占める位置は、光と輝きによって太陽が星々の間で占める位置と同じだと言った。太陽によって植物は地に芽生え、神の意志によってすべての実りが完成する。同様に金は物体の中で、あらゆる物体を自らとともに保ち、生かす。それはエリクシルの発酵素であり、それなしには作業が成就しない。発酵素なしの生地が発酵せず膨らまないのと同様である。物体を白くし、昇華し、清め、滓と汚れを取り去った後、それらを一つに集め、結び、ともに混ぜようとするなら、発酵素を加えよ。生地の発酵素が発酵素以外の何ものでもないことを見よ。ゆえに、あるものの発酵素は、そのものの本性から来る以外にありうるか、熟考し観想せよ。これがすべての哲学者の鍵である。また、発酵素は調製物を白くし、燃焼を抑え、ティンクトゥラが逃げぬよう保持し、物体を柔らかくし、互いに浸入させ、結合させることに注意せよ。〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

  "translation_ja": "〔前頁から続く〕それが作業者の目的である。その知によって物体は清められ、神が許すならその作業は成就する。ライムンドゥスは『開示書』でいう。第二の部分によって石は色づき、固定され、発酵する。哲学者たちが示すように、白の石の発酵素は銀、赤の石の発酵素は金である。発酵素なしには太陽も月も、その本性に属する他の何ものも現れないからである。ゆえに発酵素を自らの硫黄と結べ。その色を生み、さらにその本性、重量、味、音に至らせるためである。似たものは皆、自らに似たものを生むからだ。太陽のような発酵素は、その硫黄を染め、永続して浸透する薬に変える。それゆえ哲学者はいう。硫黄と水銀を染めることを知る者は、最大の奥義に至る。このため太陽と月は、かの霊と水銀の永続する水のティンクトゥラおよび発酵素でなければならない。その水によって、それらの本性を自然の熱で固定し養い、完全な固定と融解を得るまで続けよ。その後、石とその発酵素を結合する操作を行い、作業が完成に至るまで続ける。これは一度に起こるのではない。それは自然の意図するところではないからである。むしろ結合によって、すなわち少し、また少しと進み、さらに凝結によって……〔次頁へ〕"

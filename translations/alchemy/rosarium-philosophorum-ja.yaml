  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720948"
  "translation_ja": "水と油の染める働きには相違がある。水はただ洗い清めるが、油は染め、色を与える。その例として、布を水に浸せば水によって清められるが、乾くと水は去り、布は前と同じ状態、同じ色のままで、ただいっそう清潔になっている。油では逆である。布を油に浸すと、火や空気の熱では、布をまったく破壊しないかぎり、油は布から離れない。〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "ROS-139-T04"

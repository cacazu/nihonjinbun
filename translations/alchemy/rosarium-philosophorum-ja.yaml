  "translation_ja": "〔前頁から続く〕常に水とともに行われる。ゆえに水が清澄であるとおりに、土も清澄となる。土は多く洗われるほど、いっそう白くなる。したがって強い粉砕と頻繁な焙焼を伴う吸液を何度も繰り返すことで、メルクリウスの水性の大部分が取り除かれる。すなわち水性であり、その残りも同じく昇華の反復によって除かれる。以上はアルノルドゥスの『ロサリウス』から、一語一語そのまま引いた。"

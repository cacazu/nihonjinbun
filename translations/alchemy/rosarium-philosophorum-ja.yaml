    「図像に託したところに、真実を隠した」云々。
    そこである詩作者は言う。
    「塩と明礬は石そのものではなく、石の助け手である。塩の味を味わったことのない者は、決して望みに達しない。発酵素の発酵素は、その卓越性によって、仕上がったものさえ発酵させる。上なるものは下なるもののようである。水の中で焼き、火の中で洗え。煮よ、再び煮よ、また煮よ。幾度も埋め、つねに凝固させよ。生きたものを殺し、死んだものを蘇らせよ。これを七度行え。火の扱いを知るなら、求めるものを真に得るだろう。メルクリウスと火があれば十分である。」詩句。「私たちの銅をよく知るなら、ほかを知らなくても十分である。」
    古い小書より。オルトラヌスは『ヘルメスの書簡』について言う。
    「賢者の石の作り方を知る者だけが、石についての彼らの言葉を理解する。哲学者たちは、この術を、ふさわしい者には明白に示し、ふさわしくない者には隠そうと努めた。したがって意図の力においてはつねに真実を語ったが、言葉の表面の力においてはそうではなかった。それで賢者の石が卵からできると言った。卵のうちには、石を完成させる三つのものに似た三つのものがあるからである。ヘルメスは言う。『その父は太陽、その母は月である。』このように、ここですでに二つのものが石の組成へ入ることを示唆する。オルトラヌスもこれを証明する。太陽の水は揮発性であり、」

  "source_text": "et non alijs, verissimam tamen et omnino certam, solum igitur prudentes ad artem alicuius, & per ingenia nobis tradita viam investigationis eisdem exposuimus, non autem eam inventam nisi solis nobis scripsimus, sed & inventionis modum & modorum ingenia, per ea igitur quae tradidimus exerceat se bonae mentis artifex, & dei donum altissimi se adinvenisse laetabitur, ad artis igitur excelsae perquisitionem haec dicta sufficiant. Haec Geber. Geber in summa sua, capite decimo sexto de naturalibus principijs sic dicit: Notandum est enim quod postquam lapis fuerit purificatus, atque perfecte mundatus ab omni re corrumpente, & postea fuerit fermentatus, non indiges amplius mutare vas nec ipsum aperire, sed solummodo quod deus custodiat ipsum ne frangatur et propter hoc dixerunt philosophi, quod in uno vase conficitur totum magisterium, et est sciendum quod in quadraginta diebus & noctibus completur opus ad album, post veram purificationem lapidis, quia in purificatione non potest esse tempus determinatum, nisi secundum quod artifex bene laboret, & in nonaginta diebus et noctibus completur opus ad rubeum, & isti sunt veri termini ad totam perfectionem, hoc intellige de coagulatione, quae fit post purificationem, quae purificatio non habet aliter fieri nisi in putrefactione & conversione corporis"

  "translation_ja": "さらに石は第三段階で処理される。これは調製の最後の完成に存する。すなわち、すでに固定した石を昇華の方法で揮発性にし、固定していない霊とともに昇華させるのである。固定したものが昇華されるとは、身体が霊に変えられることにほかならない。この秘密は、哲学者の言葉から次のように引き出される。第三十七章には、物体、すなわち固定した実体が何であれ、術による前処理なしには霊はそれに混ざらないとある。つまり、石はまず溶解し凝結されなければならない。しかし石をどう溶かすのかと問うなら、渋みと鋭さを持ち、滓を含まない鋭い水、たとえば葡萄酒の酢などによって、と答える。なぜ石を溶かすのかと問うなら、第三十七章にあるように、溶けるものはすべて塩と明礬の本性を得るからである。塩だけがガラス化する前に融け、またその本性に従って、それら、すなわち塩だけが溶解するからである。したがって、私たちの石が溶解すれば、塩の本性を得る。しかし融けるものは浸入し、浸入するものは何であれ変成をもたらす、など。第五十七章には、物体は最高度の火によって、固定したものと固定していないものが完全に上昇するまで昇華されるとある。第十二章にあるように、全体が昇華しなければ、固定していない部分を再び加え、完全な上昇に十分となるまで続ける。〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

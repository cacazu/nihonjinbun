    〔前頁から続く〕力を帯びるまでになり、その後冷気によって凝結したからである。アトラメントゥム類は塩、硫黄、石から組成され、そこにはカルカントゥムやオロカリのように、それらから成る融けうる物体の鉱物的な力があると考えられる。しかし、それらから人為的に金属的物体を作ることはできない。別の本性であり、金属と同じ近接した第一質料、すなわちメルクリウス、水銀に由来しないからである。それらによって金属を浄化または溶解できること、人を欺くために偽の形を与えられることは否定しない、など。
    硫黄は二つ、生きた硫黄と燃やす硫黄である。生きたものが金属を生む。ただし土の粘りによってどれほど汚れているかに応じ、金属は互いに大きく異なる。金銀を生む単純で生きた硫黄は、最も純粋な土的乾燥から生じた熱く乾いた蒸気にほかならない。そこではあらゆる点で火が優勢であり、これはメルクリウスとともに金属の元素と呼ばれる、など。硫黄については上で明らかにした。

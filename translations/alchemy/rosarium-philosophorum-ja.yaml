  "translation_ja": "煙気が蒸散するようにすべきだと言う。そこで私は、これからこう結論する。良好で完全な錬金術の薬、エリクシル、あるいは粉は、すべて塩のようであり、塩であって、塩の力を持ち、溶けた、あるいは赤熱した金属の身体に投射されたとき、きわめてゆるやかに溶融し浸透するものでなければならない。ゲベルも次のように言って、このことを戒める。「薬はメルクリウスより速く溶けなければならず、メルクリウスが逃げる前にすみやかに流れなければならない。また火もそれを消耗させたり破壊したりできないものであるべきだ。」そのとき、それは可融性の塩、不燃性の油、賢者たちの石鹸と呼ばれる。また注意せよ。金属の塩はメルクリウスを真の太陽と月へ変成させる。同じように動物の塩は、いかなる動物も真に調和した状態と最良の体質へ変える。糞の火は私たちの石の熟成における作用因であり、たとえ最も穏やかなものであっても、マリアの浴の火はその代わりにはならない。そこでアルフィディウスは言う。「私が示す火で煮るとは、湿った馬糞の中に隠れることである。これが賢者たちの火であり、湿って暗く、熱は第二度、湿りは第一度である。この火の特性は、油すなわち質料を破壊せず、その穏やかな湿りによって増大させることである。この熱だけが均一で穏やかであり、そのような熱こそ、この物の生成にはどうしても必要なのである。」そこでゲベルは言う。「それらは最も精妙な蒸気なので、穏やかな煮熟を必要とする。それによって自らのうちで」"

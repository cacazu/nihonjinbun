  "translation_ja": "ゲベルはいう。私たちが確信を持つ探究によって、また明白な経験によって、私たち自身が著書の中に記したすべての言葉が真であることを確かめた。それらは実験と理性を通じて私たちが見たことに従い、これらの書にまとめられている。自らの経験によって指で取り出し、眼で見て、手で触れたものを、私たちは『奥義の完成の大全』に書いたのである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "ROS-168-T01"
  "section_id": "section-4"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sapiens ergo artifex in nostris studeat voluminibus, colligendo nostram dispersam intentionem, quam in diversis locis proposuimus, ne malignis seu ignaris publicetur, & collectam probet donec ad cognitionem studendo & experimentando cum laboris instantia ingeniosi pervenerit totalem, exerceat ergo se artifex & inveniet. Sed ne nos quidem mordeamur ab invidis, narramus quoniam non tradidimus scientiam nostram, sermonis continuatione, sed eam sparsimus in diversis capitulis, & hoc ideo, quoniam tam probus quam improbus, si continuatim fuisset tradita, usurpasset indigne, & eam similiter occultavimus ubi magis aperte locuti fuimus, non tamen sub aenigmate sed sub plana sermonis serie artificem allocuti fuimus, & sermonis modo eam ascripsimus, quam solius dei altissimi & benedicti, sublimis & gloriosi, & nostrae qui illam scripsimus menti recolligi accidit, aut divinae gratia bonitatis infusi, qui cui vult largitur & subtrahit. Non desperet igitur doctrinae filius, quoniam si illam quaesierit, eam inveniet, non doctrinae, sed proprij motus indagatione naturae, quoniam qui per se suae industriae bonitate quaesierit, scientiam inveniet, qui vero per librorum insecutionem quaesierit, tardissime ad hanc perveniet artem preciosissimam, quia nobis solis artem per nos solos investigatam aedidimus,"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 168
  - "source_id": "source-1"

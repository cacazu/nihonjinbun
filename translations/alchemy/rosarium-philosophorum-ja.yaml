    ゲベル第三書第九十章。全体の総括。私たちは、意図した叙述の要求に応じて、この奥義の原因の十分さについて知られた経験を論じてきた。残るのは、この神的な作業全体の完成へ一章のうちに達し、各章に散らされた奥義を、短くまとめた叙述へ収めることである。ゆえにいう。作業全体の意図の要は、各章で知られた石を取り、その上に第一段階の昇華を、根気ある労働によって絶えず施すことである。これによって腐敗させる不純物から清められる。これが昇華の完成である。これをもって石を微細化し、微細さの究極の純粋さに至らせ、最後には揮発性にする。その後、固定の方法によって固定し、火の苛烈さの中に安らぐまで続ける。ここに調製の第二段階の到達点がある。
    さらに石は第三段階でも同様に処理される。これは調製の最後の完成である。すなわち、すでに固定した石を昇華の方法によって揮発性にし、揮発性のものを固定し、固定したものを溶かし、溶けたものを再び揮発性にし、揮発性のものを再び固定する。流動し、確実に太陽と月を生む完成へ変成をもたらすまで行う。したがって、この段階の調製を繰り返すことから……〔次頁へ〕

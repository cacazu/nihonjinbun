    eodem modo inspissatur aqua cum terra, & fit consimilis terrae condensatae quia terra spissior est aqua. Ideo inter solutionem corporis & coagulationem spiritus non est differentia, nec diversum opus in aliquo, ita quod fiat unum sine alio, sicut non est inter aquam & terram in sua coniunctione diversa pars temporis, quod cognoscitur vel separatur una ab alia in earum operationibus. Sicut sperma viri non separatur a spermate mulieris in hora sui coitus, sic & earum unus est terminus, unum factum & una & eadem operatio insimul cernit super ipsa duo.
    Ideo dicit Merculinus: Versus.
    Rerum mixturam coitum vocat & genituram,
    Semina miscentur quasi lac quae mixta videntur.
    Secundum est conceptio, cum terra in nigrum solvitur pulverem, & incipit aliquantulum de Mercurio secum retinere, tunc enim agit masculus in foeminam, id est azot in terram. Ideo dicit Arisleus: Masculi ad invicem non gignunt nec mulieres concipiunt. Generatio enim est ex maribus & foeminis, & maxime ex composito. Maribus namque ducentibus foeminas natura gaudet & fit generatio vera, natura autem alienae naturae ineptae coniuncta, nullam veritatem gignit spermatis.
    Hoc est quod Merculinus dicit.

    in merum spiritum, et cum hoc habueris lauda deum. Senior: Ego sum luna crescens humida et frigida et tu sol calidus et humidus (alias siccus) quando copulati fuerimus in aequitate status in mansione quae non fit alias nisi igne levi, habens secum gravem, in quo vacabimus, & erimus, sicut vacat mulier, et vir eius generosi partus, hoc est verum ex locutione, & ego & sol cum coniuncti fuerimus, vacaturi in ventre domus clausae recipiam a te animam adulando, si abstuleris pulchritudinem meam, & decoram figuram ex propinquitate tua, gaudebimus & exultatione spirituum exaltabimur, quando ascenderimus ordinem seniorum, tunc lucerna lucis tuae infundetur lucernae meae, & ex te & me fit commixtio vini et aquae dulcis, & prohibeo fluxum meum, postquam fueris indutus nigredinem meo colore, qui fit velut atramentum post solutionem meam & coagulationem, cum intraverimus domum amoris, coagulabitur corpus meum, & ero in vacuitate mea. Respondit sol lunae dicens.
    Si feceris hoc, & non inferes mihi o luna nocumentum, revertetur corpus meum, & postea dabo tibi novam virtutem penetrationis, per quam potens eris in praelio ignis liquefactionis & purgationis, ex qua exibis sine diminutione & tenebris, sicut aes & plumbum, & non impugnaberis

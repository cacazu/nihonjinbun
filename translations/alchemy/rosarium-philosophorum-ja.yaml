  "translation_ja": |-
    土が自身の五十分の一の水を飲み尽くしたなら、できるだけ強い火で速やかに昇華させ、最も白い粉のように上へ昇るまで続けよ。
    土が雪のように真っ白で、死んだ粉のようになり、アルデル器の縁と側面に付着するのを見たなら、下に残る滓を除いて、それについて昇華を繰り返せ。その固定部分が付着しており、滓とともに固定してしまうと、どんな工夫によってもそこから分離できなくなるからである。
    滓から上へ昇る粉は、灰と土から取り出された灰、昇華されて高められたものなのである。〔次頁へ〕

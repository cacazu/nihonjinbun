  "source_text": "multiplicat formam suae speciei, et non alterius, quemadmodum ex frumento nascitur, et sic de alijs, et in hoc exposui vobis omnes figuras. Cum itaque egero cum uxore mea alba, pura & humida & munda tactu, addo pulchritudini faciei suae, bonitati & virtuti suae, ipsa enim est obediens mihi, unde cum fuero iunctus cum ea nihil melius in mundo nec aequipollens, ipsa enim impraegnabitur & germinabit, & erit sicut ego sum, in substantia & colore, quoniam hoc magisterio multiplicatur semen, ex me enim simile nascitur, sicut quando seminatur unum granum frumenti, nascitur, multiplicatur, teritur, cribellatur, & fit panis ex quo vivit totus mundus, et fabricatur minera terrae ex me nec deficit, quia donum dei est. Ego illumino aerem lumine meo, & calefacio terram calore meo, genero & nutrio naturalia, plantas et lapides, & demo tenebras noctis cum potentia mea, et facio permanere dies seculi, et illumino omnia luminaria lumine meo, & etiam in quibus non est splendor et magnitudo, quae quidem omnia ex meo opere sunt cum induor vestimentis meis, et qui quaerunt me faciant pacem inter me et uxorem meam. Itaque nisi separetur a me et misceatur mixtione inseparabili, & hoc fiat quando extraxeris me partim a natura mea, et partim uxorem meam a natura sua, et postea occidatis naturas, et suscitamur resurrexione nova"

- "id": "ROS-138-T03"
  "section_id": "section-4"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Rerum omnium liquefactibilium natura ex argento vivo est et sui substantia, eo quod proprium est argentum vivum, quod coagulatur ex vapore sive calore sulphuris albi vel rubei non urentis, unde Aristoteles quarto metheororum, si fuerit sulphur album non urens, congelat mercurium in argentum bonum, si vero sulphur fuerit purum, cum rubore claro & in eo fuerit vis igneitatis simpliciter non urentis, congelat in aurum purissimum melius quam minera produxit, quia omne siccum naturaliter ebibit suum humidum ut in suis partibus sit continuatum. Vapor ergo sulphuris argenti vivi coagulandus est ex substantia terrea subtili, aerea, decocta & indigesta a commixtione prima sibi unita actione caloris, postea elevata, decocta, & digesta donec habeat vim sulphuream coagulandi argentum vivum in corpora metallica, aurum habet multum de virtute sulphuris et"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 138
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720947"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720947"
  "translation_ja": "融けうるすべてのものの本性と実体は、水銀から成る。水銀には、燃やさない白または赤の硫黄の蒸気ないし熱によって凝結するという固有性があるからである。そこでアリストテレスは『気象論』第四書でいう。硫黄が白く、燃やさないなら、メルクリウスを良い銀に凝結させる。硫黄が純粋で、明るい赤さを持ち、単純にして燃やさない火性の力があるなら、鉱床が産出したものより良い、最も純粋な金に凝結させる。あらゆる乾いたものは、自らの諸部分を連続させるため、自然に自らの湿りを飲むからである。したがって水銀を凝結させる硫黄の蒸気は、微細で空気的な土の実体から成り、最初の混合から熱の作用によって結ばれ、煮られてはいるが未熟である。その後、上昇し、煮られ、熟成し、水銀を金属的物体へ凝結させる硫黄の力を得る。金は硫黄の力を多く持ち、〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

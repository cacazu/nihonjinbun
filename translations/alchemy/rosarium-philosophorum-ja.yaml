  "source_text": "qui exalto, & deprimo cuncta, & nullus servorum meorum potest super me, nisi unus, cui datum est, quod contrarius est mihi. Et ipse destruit me, non tamen destruit naturam meam. Et ipse est Saturnus, qui separat omnia mea membra. Postea vado ad matrem meam, quae congregat omnia membra mea divisa & separata. Ego sum illuminans omnia mea, & facio lumen apparere patenter in itinere de patre meo Saturno, & etiam de matre mea, quae mihi inimicatur. Veruntamen nisi hoc fieret non possem bibere de animabus animalium & plantarum. Sed ego venio cum calore ignis, ad expellendam virtutem & iniquitatem eorum a me. Ego sum habitans super faciem minerae, & tribuo servis meis de extremitatibus meis, & nomen meum vocatur nominibus magnis, & qui studet in me non curat de aliquo, sed non saturatur ex me. Ego defero naves per mare, et fabrico civitates densas. Non quaeratis in eis magnitudinem meam. Nuncio ergo vobis omnibus sapientibus, quod nisi me interfeceritis, intellectus vester non erit perfectus, & in sorore mea luna crescit gradus sapientiae vestrae, & non cum alio ex servis meis, & si sciretis secretum meum, ego sum frumentum seminatum in terram puram, quod nascens crescit & multiplicatur, & adfert fructum seminanti quia omne quod generat genere suo, & quodlibet individuum"

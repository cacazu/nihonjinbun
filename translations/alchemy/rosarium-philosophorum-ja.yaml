    adiecit, et imbibendo dissolvas, quantum assando defecit. Ideo omni vice post calcinationem terrae superfunde aquam temperate, nec multum videlicet neque parum, quia si multum fuerit fiet pelagus conturbationis, si vero parum comburitur in favillam, quare suaviter & non festinanter de octo in octo diebus terram irrigabis, decoquas in fimo, & calcinabis donec de aqua biberit quinquagesimam partem sui. Et nota quod post imbibitionem debet inhumari per septem dies.
    Itera ergo opus multis vicibus, quanquam sit longum, quoniam non videbis tincturam, neque proficuum profectum, donec sit completum, studeas ergo cum in omni fueris opere, omnia signa quae in qualibet decoctione apparent, in mente tua recordari, & eorum causas investigare.
    Tres quippe sunt colores, niger, albus, & citrinus, cum terra egreditur nigredo imperfecta est, & nigredo completa.
    Qualibet ergo vice paulatim & paulatim vigora ignem in calcinatione, quousque terra egrediatur alba, ex ignis fortitudine. Nam sicut calor agens in humido, praestat nigredinem, ita agens in sicco praestat albedinem. Idcirco si terra non fuerit alba, tere eam cum aqua, & postea calcina iterato, quoniam Azot & ignis latonem abluunt & obscuritatem ab eo auferunt, nam praeparatio

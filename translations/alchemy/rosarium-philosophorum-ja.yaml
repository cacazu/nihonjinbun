    彼はこの知を光として持とうとし、あらゆる美と健康より上に置いた。この貴い石と比べて、何もそれに並ぶものとしなかった。その眼前では、あらゆる金もわずかな砂のようであり、銀も泥のように見なされるからである。それを得ることは、銀や純金、最も純粋な金を商うことよりもよい。その実りは、この世のすべての財宝より貴く、世界で望まれる何ものも、それに比べることはできない。その右手には長寿と健康、左手には栄光と無限の富がある。その道は美しく称賛すべき働きであり、軽蔑されるものではない。その小道は節度があり、性急ではなく、長い労働の不断の努力を伴う。それをつかむ者にとって、命の木であり、尽きない光である。それを保つ者は幸いである。神の知は決して滅びないからである。アルフィディウスが「この知を見いだす者の食物は、正当で永遠のものとなる」と証言するとおりである。

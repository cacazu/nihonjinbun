  "source_text": "non possunt, quia corpora metallica imperfecta quae non conveniunt cum auro & argento ex parte mercurij maturi, tingere non possunt, nec naturam auri vel argenti infundere. Et ideo non est tingendum nisi cum illis quibus inest virtus tingendi, tinge ergo cum auro & argento, quia aurum aureum tribuit colorem & naturam, & argentum argenteam. Quare omnia alia despicias quibus non inest virtualiter seu naturaliter virtus tingendi, cum in ipsis nullus sit fructus, sed solum perditio rerum & stridor dentium."

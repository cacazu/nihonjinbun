    1550年原刊のデジタル画像を底本とする新規日本語訳。機関提供OCRを照合し、近現代の翻訳を底本としていない。
    長いs・合字・主要な略記を読みやすく展開し、行末の分割を整理。u/v、i/j等の綴りは完全統一していない。改頁をまたぐ語は分割保持と結合の両方があり、日本語は隣接単位へ続く。
    判読に不確実さがある略記、文意が不整な印本文は注に明示。原典の矛盾や数の違いを黙って整えない。

  "source_text": "-onem. Ego non dixi omnia apparentia et necessaria in hoc opere quia sunt aliqua quae non licet homini loqui. Depinxi tamen usque ad complementum licet non viderim. Scio quia de necessitate opus ad talem perveniat naturam. Et impossibile est hoc sciri, nisi a deo sciatur, aut a magistro qui eum doceat. Et scias quod haec est longissima via, ergo patientia et mora sunt necessariae in nostro magisterio. Argentum vivum est sal comune, unde Rosarius dicit: Sal comune aurum et argentum solvit, & auget in auro rubedinem et in argento albedinem, et mutat Aes a corporalitate ad spiritualitatem, et cum ea re calcinantur corpora. Unde lumen luminum: Si hoc sal omnipotens deus non creasset non perficeretur elixir et vanum esset studium Alchimicum. Nota, quatuor sunt Mercurij, videlicet Mercurius crudus, Mercurius sublimatus, Mercurius Magnesiae, & Mercurius unctuosus. Sed magnesia est luna plena, Mercurius Philosophorum, id est materia in qua continetur Mercurius Philosophorum. Et est ille quem natura paululum operata est, et in metallicam formam formavit tamen imperfectum reliquit. Haec ille: Notandum quod talis res quae dicitur medium ingressionis, quae neque est perfecta, neque ex toto imperfecta. Quia ex nihilo nihil fieri potest, et quod natura non perfecit in ipsa, ipse artifex adiuvando naturam ipsam potest reducere de imperfectione ad perfectionem. Et ille dicitur lapis"

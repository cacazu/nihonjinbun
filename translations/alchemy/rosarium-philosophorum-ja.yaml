- "id": "ROS-104-T01"
  "section_id": "section-4"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Unde aliquae res extraneae hoc in corporibus non possunt causare, cum ars non est aliud mediante natura, nisi decoctio & digestio illius naturae per simplicem laborem, verbi gratia, mane cum surgo, & video urinam meam albam, iudico me parum dormivisse, tunc repono me iterum ad dormiendum, & accepto somno urina citrinatur, & hoc propter maiorem digestionem caloris naturalis in me existentem. Sic sequere naturam per artem similiter decoquere, digerere, maturare, sublimare, cum iam actu natura contineat in se ignem naturalem, quo maturatur, hoc illae res non habent ideo dare non possunt. In luna vero non est nisi sulphur album, simplex, non tamen digestum sicut rubeum, nec sic a nigredine purgatum per actionem caloris, quam in se naturaliter continet, sed ignis species est obtecta et occulta, agens eam in arte quam in natura & econverso, & ideo non est impossibile, ut ars mediante natura. Hic nota mediantem naturam sive mediam naturam, quod plus digerat et perficiat, cum naturaliter intendit perfici, sed per se non potest, nisi moveatur arte & operatione, sed isti labores ut credo non pervenient ad hominem durae cervicis, & ideo non fit verum aurum, nisi fiat ita digestum & decoctum, ut melius melioret peius. Quia omnium philosophorum intentio est cum meliore peius perficere."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 104
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720913"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720913"
  "translation_ja": "それゆえ異質なものは、物体の中にこれを引き起こせない。自然を介した術は、単純な労働によってその本性を煮て熟成させることにほかならないからである。たとえば朝起きて自分の尿が白いのを見れば、あまり眠らなかったと判断し、再び横たわって眠る。眠りを取ると尿は黄色くなる。私の中にある自然の熱によって、消化がいっそう進んだからである。このように自然に従い、術を通じて同様に煮、熟成させ、成熟させ、昇華せよ。自然はすでに現実に、自らを成熟させる自然の火を内に持つ。それを持たないものは、与えることもできない。月の中には単純な白い硫黄だけがあり、赤い硫黄ほど熟成せず、自然に含む熱の作用によって黒さから同じように清められてもいない。しかし火の姿は覆われ隠れていて、自然におけるように術の中でも、また逆にも作用する。したがって自然を介する術が、さらに熟成し完成させるのは不可能ではない。ここで、仲介する自然、あるいは中間の自然に注意せよ。それは自然に完成を目指すが、術と操作に動かされなければ自らではできない。ただし、この労働は頑迷な者には達成できないだろうと私は思う。ゆえに、より善いものがより悪いものを改善するほどに熟成し煮られなければ、真の金は作られない。すべての哲学者の意図は、より善いものによって、より悪いものを完成させることだからである。"
  "translation_status": "draft"
  "source_kind": "prose"

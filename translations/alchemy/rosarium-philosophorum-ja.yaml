  "translation_ja": |-
    似せるのである。そのため質料は本性上、形相を求める。それは女が男を求め、醜いものが美しいものを求めるのと同じである。同様に、身体は自らの完成へ達するため、いっそう自発的に霊を抱きしめる。
    したがって自然の根を知ることによって、それらを用いてあなたの仕事をいっそうよく行える。私たちの石を、私はほかの仕方で言い表すことも、ほかの名前で呼ぶこともできない。以上から、私たちの石が四元素からなることは明らかである。富める者も貧しい者もそれを持ち、それは至るところに見いだされ、あらゆる物に似ている。それは身体、魂、霊から構成され、ある本性から別の本性へと変わり、ついには自らの完成の最終段階へ至る。
    また彼らは、私たちの石は一つの物からできると言った。それは真実である。奥義の仕事のすべては私たちの水によってなされるからである。その水はあらゆる金属の種子であり、すでに示されたように、すべての金属はそれへと溶解される。
    さらに、金属の塩は賢者の石である。私たちの石は金と銀のうちに凝結した水であり、火に抗し、それ自身の水に溶ける。その水から、石はその類において組み立てられる。したがって、身体を第一質料、すなわち水銀へ戻すことは、

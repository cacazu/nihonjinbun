  "origin": "source"
  "source_text": |-
    & amplius, ut aliqui philosophi fecerunt, qui usi fuerunt eo tribus vicibus in hebdomada quantum granum sinapis. Est herba quae vocatur saturnus de canalibus, de qua fit talis medicina, quare nota quod omnes infirmitates quae a vertice capitis usque ad plantam pedis generantur, si fuerint unius mensis, in die, si unius anni in duodecim diebus, si ex longo tempore, in mense curantur, quia sicut curat omnia metalla infecta ab omni infirmitate, sic & humana corpora. Quapropter noster benedictus lapis non immerito Tiriacus maior tam corporum humanorum quam metallorum dicitur, de quo Hermes rex Graecorum et pater philosophorum ait: Si de elixir nostro omni die usque ad septem dies sumpseris pondus carrobiarum, capilli tui cani de capite tuo cadent, & renascentur nigri, & ita de sene fies iuvenis & fortis.
    Arnoldus dicit: Hic lapis noster virtutem habet efficacem omnem sanandi infirmitatem super omnes alias medicinas medicorum. Nam animam laetificat, virtutem augmentat, conservat iuventutem, & removet senectutem. Non enim permittit sanguinem putrefieri, nec flegma superdominari, nec choleram aduri, nec melancholiam superexaltari, imo sanguinem supra modum multiplicat & mundificat, contenta in spiritualibus purgat, et omnia corporea membra efficaciter restaurat
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 190
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720999"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720999"
  "translation_ja": |-
    〔前頁から続く〕それ以上にも生きさせる。実際、ある哲学者たちは週三度、芥子一粒ほどを服用して、そのようにした。「溝のサトゥルヌス」と呼ばれる草があり、このような薬はそこから作られる。したがって、頭の頂から足の裏までに生じるあらゆる病は、一か月の病なら一日で、一年の病なら十二日で、長年の病なら一か月で治ることに注意せよ。あらゆる病から、侵されたすべての金属を治すように、人間の身体も治すからである。それゆえ、私たちの祝福された石は、人間の身体と金属の双方にとっての「大いなる解毒薬」と呼ばれるにふさわしい。これについてギリシア人の王、哲学者たちの父ヘルメスはいう。私たちのエリクシルを、七日間、毎日カロブの重量だけ服用すれば、おまえの頭の白髪は抜け落ち、黒髪が生え直す。こうして老人から若く強い者となる。
    アルノルドゥスはいう。私たちのこの石は、医師の他のあらゆる薬にまさって、どんな病をも治す有効な力を持つ。魂を喜ばせ、力を増し、若さを保ち、老いを除くからである。血液の腐敗、粘液の優勢、胆汁の焼け、黒胆汁の過剰を許さない。むしろ血液を非常に増やして清め、霊的な〔器官〕の中身を浄化し、身体のあらゆる部分を効果的に回復させる。〔次頁へ〕
  "translation_status": "draft"
  "source_kind": "prose"

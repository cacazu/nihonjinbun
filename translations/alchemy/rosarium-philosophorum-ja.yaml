  "kind": "paragraph"
  "origin": "source"
  "source_text": "Qui desiderant artis Philosophicae scientiae maioris cognitionem verissimam habere, libellum hunc diligentius inspiciant, & saepissime perlegant, & optatum prosperum consequentur. Audite haec filij priscorum Philosophorum, quam altissima possum voce libet proclamare. Venio namque vobis praecipuum humanarum rerum statum aperire, secretissimum omnium secretorum totius mundi thesaurum, non ficte nec irrisorie, sed certissime & humanissime palam ipsum efficiam. Quapropter vos mihi talem exhibeatis audiendi devotionem, quale vobis afferam doctrinae magisterium: nempe eorum quae vidi proprijs oculis & manibus meis palpavi, aliquod nunc possum vobis rectius testimonium perhibere. Quidam & confidentius quam fallaces multi Iactatores, qui post multas tandem expen-"
  "source_languages":

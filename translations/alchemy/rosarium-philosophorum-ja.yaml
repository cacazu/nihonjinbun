    では、哲学者たちが言う「私たちの金は普通の金ではなく、私たちの銀は普通の銀ではない」という言葉を、どう考えるか。私は答える。彼らは水、すなわち火の力で上方へ昇るものを金と呼ぶ。実際、この金は普通の金ではない。世間の者は、金が固定されているため、それが上方へ昇れるとは信じないからである。さらに知れ。神にかけて、哲学者たちの習慣はこのようなものだった。つねに最も確かな箇所で足を引きずり、ほとんど語り終えた事柄を、あるときは型や図像によって、あるときは比喩的な言葉によって、あるときは偽りの、関係のない実践によって隠す。そして真実を言ったと感じたところでは、そのとき自分たちは比喩で語ったのだと言うのである。それゆえゲベルは言う。「私たちが明白に語ったところでは、何も語らなかった。しかし謎の下に何かを置き、」

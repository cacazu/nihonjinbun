  "origin": "source"
  "source_text": "quae fuerunt transmutentur, cum prima natura unam qualitatem mutavit in aliam, taliter ars bene separare potest, ut humidum a sicco, frigidum a calido, sed tamen una qualitas adhuc de naturali commixtione possidet naturam alterius in aliqua parte, per haec possunt per artem viceversa coniungi sicut divisa sunt, si illud non esset quod una qualitas participaret naturam alterius, scilicet aqua naturam terrae in frigiditate, & aer naturam aquae in humiditate & caeteris tunc sequeretur, quod naturale opus esset totaliter destructum, cum simplicissima essent elementa sicut antea fuerunt ante mercurij generationem, ars destruxisset naturam a capite incipiens scilicet ab auro & argento usque ad principium id est ad argentum vivum, & ultra ista principia simplicium elementorum, secundum quod antea fuerunt ante mercurij generationem ita remote in arte est impossibile. Si esset possibile tunc sequeretur quod de novo extra primam materiam metallorum ars componeret elementa, & viceversa ars generaret Mercurium sicut destruxit, quod impossibile est artificialiter fieri, bene quidem ars destruitur a capite usque ad pedes id est Mercurium a pede aedificans usque ad caput in subtiliori forma, cum substantia naturae quae antea fuit ars concedit: Sic dividuntur species rerum, cum in aliam formam transmutantur quam antea fuerunt."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 127
  - "source_id": "source-1"
    "precision": "page"

  "translation_ja": "この言葉が届くすべての読者に、一般的に明らかにする。術全体の系列には、哲学者と自然に従って個別的に完成されるものは二つしかない。第一の個別的なものは、白についても赤についてもメルクリウスにあり、完全な薬を施さずに成る。ただしそれを完成させる物体は、自然が要求するとおり、そのティンクトゥラを自らの中に隠して持っている。二種のものの双方に関して、個別的にはまずこのことがある。メルクリウスは、すべての金属の第一質料、すなわち極めて硫黄性の白い土と清い水から組成される。そのため土の白さが水の清澄さを透かして見え、その色は最も白い。〔次頁へ〕"

  "translation_ja": "〔前頁から続く〕自らの種の形を増やし、他の種の形を増やさないからである。穀物から〔穀物が〕生まれ、ほかのものも同様である。このことによって私は汝らにすべての形象を説明した。そこで、私が白く、純粋で湿り、触れて清らかなわが妻と交わるとき、その顔の美しさ、善さ、力を増し加える。彼女は私に従順だからである。私が彼女と結ばれるなら、世界にこれより良いものも、これに匹敵するものもない。彼女は身ごもって芽を生じ、実体と色において私と同じものになる。この奥義によって種は増えるからである。私からは私に似たものが生じる。一粒の穀物が播かれると生えて増え、挽かれ、篩われて、全世界を養うパンとなるようにである。地の鉱物も私から作られ、尽きることがない。これは神の賜物だからである。私は自らの光で空気を照らし、自らの熱で大地を温め、自然物、植物、石を生み養う。私の力で夜の闇を取り去り、世の昼を存続させ、あらゆる光るものを私の光で照らす。また輝きも大きさもないものをも照らす。それらすべては、私が自分の衣を着るとき、私の働きによって成る。私を求める者は、私と妻との間に平和をもたらせ。したがって、彼女が私から分離され、分けることのできない混合によって混ざらねばならない。これは汝が私を、ある部分について私の本性から取り出し、また妻を、ある部分について彼女の本性から取り出すときに起こる。その後、それらの本性を殺せ。そうすれば私たちは新しい復活によって甦らされる。〔次頁へ〕"

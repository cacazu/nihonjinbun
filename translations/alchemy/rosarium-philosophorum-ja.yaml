    Hermes: Draco non moritur nisi cum fratre et sorore sua interficiatur, non per unum solum, sed per ambo simul, scilicet per Solem & Lunam. Philosophus: Mercurius nunquam moritur nisi cum sua sorore interficiatur, id est, cum luna vel sole illum congelare oportet. Nota, quod Draco est argentum vivum, extractum a corporibus, habens in se corpus, animam & spiritum, super quo dicit: Draco non moritur nisi cum fratre suo & sorore sua, id est Sole & Luna, id est, sulphure extracto habente in se naturam humiditatis & frigiditatis ratione Lunae, cum illis Draco moritur, id est argentum vivum ab eisdem corporibus extractum a primordio, quae est aqua permanens Philosophorum, quae fit post putrefactionem, et post separationem elementorum, & aqua illa alio nomine dicitur aqua foetida. Unde Philosophus: Omnia fert secum quae indiget haec aqua foetum. Aristoteles secundo

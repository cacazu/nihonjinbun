  "source_text": "non fuisset, aurum albi alchimiae non fuisset. Rosarius: Hic est mercurius noster nobilissimus, & deus nunquam creavit rem nobiliorem sub coelo praeter animam rationalem. Plato. Haec est materia nostra & secretum nostrum. Ortulanus: Sic habes verum Mercurium extractum ab istis duobus corporibus praenotatis, & est bene lotus & digestus, & iuro per deum quod nullus alius Mercurius est in via universali, nisi iam declaratus, in quo dependet tota philosophia, qui aliter dicit falsum dicit. Parmenides in turba: Quidam audientes aquam a philosophis nominare, putant aquam nubis esse, certe non, sed si haberent rationem, scirent utique aquam esse permanentem, quae quidem aqua permanens esse non potest absque suo corpore cum quo soluta est. Alphidius: Istam medicinam vocant philosophi omnibus nominibus, quia tot nomina sunt huic mercurio imposita, quod vix aut nunquam possit aliquis nova ratione vocabula inponere, & dicit Plato philosophus: Nos omnia revelavimus excepto secreto artis quod nemini licitum est revelare, sed attribuimus illud deo glorioso, qui cui vult inspirat, & cui vult aufert. Salomon rex: Haec est filia ob quam regina austri ab oriente dicitur venisse, ut aurora, consurgens audire & intelligere & videre sapientiam Salomonis, & data est in manu eius potestas, honor, virtus, &"

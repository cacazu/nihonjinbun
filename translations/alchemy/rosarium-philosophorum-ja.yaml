  "source_text": "Universaliter omnibus intuentibus ad quos praesentes sermones devenerint declaro, quod in totius artis serie non sunt nisi duo particularia, quae particulariter perficiuntur secundum philosophos & naturam, primum particulare tam in albo quam in rubeo existit in mercurio, sine administratione medicinae perfectae quamvis bene corpus cum quo perficitur in se occulte ipsius tincturam continet, veluti natura requirit, primumque in eo particulariter ex utraque specie rerum est illud, cum Mercurius sit ex prima materia omnium metallorum compositus, ex terra alba nimium sulphurea & aqua clara, & ideo albedo terrae transparet limpiditatem aquae, & est color in eo albissimus"

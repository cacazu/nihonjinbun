    むしろ彼らには敵である。哲学者は『政治学』第二巻で述べている。「困窮した者が哲学することは不可能である。」
    哲学者たちによれば、この術には二つの道がある。すなわち普遍的な道と個別的な道である。
    普遍的な道は容易だが稀である。それは真実で自然な諸原理から導かれる道であり、これらの原理によって、種子的で再形成する力がただちに、一瞬にしてメルクリウスを固める。そして適切に調製されたどの金属も、真の金または銀へ染め変える。これは能動的なものと受動的なものとの結合によって、その力がもともといずれの目的へ向けられていたかに従う。
    第二の道は個別的な道と呼ばれ、困難で労苦が多い。注意せよ。普遍的な道の錬金術は、一部は自然によるもので、一部は人為によるものであるが、それでも自然によるところが大きい。真の錬金術の道では、異質なものや外来のものが自然に導き入れられることはないからである。自然は働きかける対象を備えている。能動的なものは適切な結合または適用によって受動的なものと結びつけられ、残りは自然がひとりでに行う。プラトン。「私たちの石は火が触れたことのない物であり、それから私たちのメルクリウスが立ち現れる。」
    錬金術に取り組む者には三種類ある。すなわちアルキミスタ、ラウキミスタ、ラクリミスタである。「取れ、取れ」と言う者がみな、

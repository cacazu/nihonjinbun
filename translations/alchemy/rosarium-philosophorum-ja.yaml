    Succus lunariae, Aqua vitae, Quinta essentia, Ardens vinum, Mercurius vegetabilis omnia idem sunt: Succus lunariae fit ex vino nostro, quod paucis filijs nostris notum est, & cum illo fit solutio nostra, et fit aurum potabile nostrum mediante illo, & sine illo nequaquam.
    Corpus namque imperfectum conversum est in primam materiam, et istae aquae coniunctae cum aqua nostra faciunt unam aquam mundam, claram omnia mundans, omnia tamen necessaria in se continens, & ista est chara et vilis, de qua et cum qua perficitur nostrum magisterium. Nam corpora solvit non solutione vulgari, prout tradunt ignorantes, qui convertunt corpus in aquam nubis, sed solutione vera philosophica, in qua convertitur corpus in aquam primam, ex qua fuit ab initio, ipsa eadem aqua corpora in cinerem transformat.
    Scias autem quod ars Alchimiae est donum spiritus sancti. Et scias quod diebus nostris habuimus magistrum, Arnoldum de nova Villa, in Curia Romana, summum medicum & Theologum, qui etiam magnus Alchimista fuit, qui etiam virgulas auri faciebat, quas consentiebat omni probationi submitti.

  "source_text": "calcinationem iterato similiter solvatur donec per reiterationem operis super illud totum solvatur, modus vero qui per bullitionem aquae fit, velocior est, & est, ut calcinatum in ampullam similiter ordinetur, cum aceto, obturato foramine ne respiret, quae in caldario pleno aqua & stramine sepelietur ut in distillationis modo per aquam praeceptum attulimus per ordinem, et postea accendatur sub ea ignis donec per horam ferveat, post hoc vero solutum distilletur, & seorsum servetur &c. ut supra. Fusio media igne qua fit ingressio, est perfectionum ultima, ut dicit Geber, libro septimo capite decimo septimo, coagulantur cuncta resoluta cum solo adiutorio ignis, & hoc in vasis firmiter clausis, & hoc a me tene secretum quod res perfecte coagulata est, quae fluit cum ignitione convenienti & cum expectatione examinis ignis, sin autem reitera opus, & pervenies per reiterationem ad propositum deo adiuvante. Reymundus: Noster infans habet duos patres & duas matres, & quia ipse chare nutritus est ex tota substantia in igne, propter quod nunquam moritur. Ceratio est reductio humoris super terram, igne mediante, ut ipsa per calcinationem privata humore & arefacta mollescat, & ad fluiditatem reducatur & per consequens habeat ingressum, non autem liquefactione communi quae vulgus per ignem liquefacit, sed"

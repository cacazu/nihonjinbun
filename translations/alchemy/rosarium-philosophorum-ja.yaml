    dominari te faciet. Aristoteles: O si deus sciret fidelem mentem in homine, utique revelaret sibi arcanum.
    Corrector Fatuorum: Unicuique arti scoriam imitari necesse est, illius naturae cognoscere cuius rei sit natura, & sic ars imitatur suam naturam. Scias fatue per artem ipsa dinoscitur natura, nec emendari potest, nam naturae non imitatori impossibile esset Philosophorum secreta ad perfectum finem pervenire.
    Hermes & Geber.
    Qui hanc artem semel perfecerit, si deberet vivere mille millibus annis, et singulis diebus nutrire quatuor milia hominum non egeret, hoc confirmat Senior dicens: Est ita dives habens lapidem de quo elixir fit, sicut qui habet ignem potest dare ignem cui vult et quando vult, & quantum vult sine suo periculo & defectu. Aristoteles vigesimo de anima: Naturalissimum & perfectissimum opus est generare tale quale ipsum est.

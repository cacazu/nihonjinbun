    〔前頁から続く〕金なしには作業は完成も改善もされない。金は水銀の手綱であり、水銀を凝結させるには、マグネシアの身体の中で行うほかない。その中には燃やすものと逃げるものとがあり、金そのものは第三のものとして両者のティンクトゥラを受け取る。それは赤いティンクトゥラであり、水銀はそれとともにあらゆる物体を変成する。それゆえある者は、金を金の中に置かなければ何もしていない、という。
    アリスレウスはいう。組成に少量の金を入れれば、明らかな白いティンクトゥラが現れると、確実に知れ。太陽の発酵素は男の種、月の発酵素は女の種を意味する。両者からまず交合が生じ、その後、真実で清らかな生成が起こる。パンの発酵素がパンであるように、金の発酵素は金である。『ロサリウス』はいう。パン作りで少量の発酵素が大量の生地を膨らませ発酵させるように、この石が含む少量の土も、石全体を養うのに十分である。

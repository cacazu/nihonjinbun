  "translation_ja": "〔前頁から続く〕これらの反対の本性が、一つの本性として結ばれ留まるよう、人為的に結合することは決してできない。水は確かに土を洗い清められる。しかし土が水で濡れても、その乾きが人為的に水の湿りへ変わると思ってはならない。同様に下位の鉱物を金属と結合し、浄化し、ある程度新しい形を与えることはできるが、金属とともに永続し、未熟なものを成熟させることを自然は許さない。それゆえ愚者は、人を欺くさまざまな仕事や偽術を持ち込み、釣り合わない物、質料を与えも受け取りもしない物を用いる。すなわち胎盤、動物の眼、卵の殻、髪、赤毛の人間の血、虫、草、根、人糞である。多くの愚者がこれらの植物的・感覚的な物で働き、今も働いている。しかしそこには真実を何も見出さず、ある卑しいものだけを見出した。私たちは無知な者が欺きを避けられるよう、これらを示す。彼らは後で述べる物から、長い時間をかけ、人工の水銀と呼ぶもの、油、水を抽出した。それらを四元素、すなわち水・空気・土・火と呼び、またサル・アルモニアク、砒素、硫黄、雄黄と呼んだ。そんなものは市場でより良いものを買えば、もっと早く済んだはずである。また彼らは探した、〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

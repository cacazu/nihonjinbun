  "origin": "source"
  "source_text": "& ego sum secretum totum, & in me occultatur scientia, quia converto omnia corpora in solem & lunam, cum natura mea talis sit quod durum mollifico, et molle induro, et ideo nota quod lapis philosophicus ad ipsam alchimiam veraciter procreandam, est unus in toto mundo, et qui ab hoc uno errat, in praecipitium abisse credatur, non tamen est perfectus in sua natura, ad quam perduxit ipsum minera sed ad quod perducit ipsum artificium. nam sine magisterio nihil valet nobis nec alicuius utilitatis est, nec perfecte praestat quicquam, sed potius corrumpit, & hoc ideo dico, quatenus eo utaris cum magisterio, quia ipsum est flegma purum, philosophi quandoque vocant ipsum sulphur & melancolicum citrinum propter suae mirabilis virtutis effectum, ut enim quidam voluerunt, ex ipso creavit deus omnes gentes, & earum statuit originem. Hunc etiam lapidem nostrum, aliqui aes album vocaverunt. Unde Lucas & Eximeus. Scitote omnes scientiam quaerentes, quod nulla fit tinctura nisi ex aere nostro albo, aes enim nostrum non est aes vulgi, aes vulgi corrumpitur & inficit omne cui imponitur, aes vero philosophorum perficit & dealbat cui associatur. Ideo dicit Plato: Omne aurum est aes, sed non omne aes est aurum, itaque aes nostrum habet corpus, animam & spiritum, & illa tria sunt unum, quia ipsa omnia sunt ex uno &"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 176
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720985"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720985"
  "translation_ja": "〔前頁から続く〕私は秘密のすべてであり、私の中には知が隠されている。私はあらゆる物体を太陽と月に変えるからである。私の本性は、硬いものを柔らかくし、柔らかいものを硬くするものなのだ。ゆえに、錬金術そのものを真に生み出す哲学者の石は全世界に一つであり、この一つから外れる者は深淵へ落ちたと思うべきだと知れ。しかしそれは、鉱床がもたらした自然の状態で完成しているのではなく、術が導く状態において完成する。奥義なしには私たちに何の役にも立たず、有用でなく、何一つ完全には成し遂げず、むしろ損なう。私がこういうのは、汝がそれを奥義とともに用いるためである。それは純粋な粘液である。哲学者は時に、その驚くべき力の効果ゆえに、それを硫黄、黄色い黒胆汁質と呼ぶ。ある人々の考えによれば、神はそこからすべての民を造り、その起源を定めたのである。また、ある人々は私たちのこの石を白い銅と呼んだ。そこでルカスとエクシメウスはいう。知を求める者たちよ、私たちの白い銅による以外にティンクトゥラは作られないと知れ。私たちの銅は普通の銅ではない。普通の銅は腐敗し、それを置かれるものすべてを汚すが、哲学者たちの銅は、結ばれるものを完成させ白くする。それゆえプラトンはいう。すべての金は銅であるが、すべての銅が金なのではない。したがって私たちの銅には身体・魂・霊があり、この三つは一つである。それらすべては一つから生じ、そして……〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

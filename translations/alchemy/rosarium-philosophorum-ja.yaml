    -tum curari. Idem: Oportet te corpus & animam coniungere, contritione in Sole.
    Idem: Seminate aurum vestrum in terram albam foliatam. Senior: Descendet fumus superior ad inferiorem, & concipit fumus a fumo. Idem: Haec aqua divina est rex de coelo descendens. Idem: Ipse est reductor animae ad corpus suum, quod vivificat post mortem suam, & per eum vita est, postquam non erit mors.
    Rosinus: Corpus enim laetatur cum anima in ipsum ingreditur.
    Idem: Corpus vero occupat animam, & omne corpus quod animam invenit, facile eam occupat. Et notum habeas quod cum anima punitur cum corpore, & cum eo incarceratur, & ab eo in corpus vertitur. Hermes: Ipse spiritus est extractor animae, & reductor & totius operis reformator, & omnia quae quaerimus sunt in eo. Senior: Nihil eo aspectu vilius, & nihil eo in natura preciosius, & eum Deus precio emendum non posuit.
    Senior: Praeparatio nostra natura surgit per seras aperientes seraturas.

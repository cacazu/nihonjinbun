  "origin": "source"
  "source_text": "Ignis artificialis continuus, durans in eodem gradu quo volueris per unum, aut duos aut tres menses, donec nudes carbones, ideo semper coopertos debes servare, & potes augmentare vel diminuere calorem pro beneplacito tuo, & hoc secundum additionem plurium vel pauciorum carbonum incensorum. Inprimis habeas cineres sufficientes, & solum factas de ligno Iuniperi. Tunc habeas ollam magnam fictilem, in cuius medio sit alia minor olla sive crusibulum, & inponendo cineres magna olla stet super calorem ignis, quatenus ipse cinis calescat, & sic circumquaque ollam minorem super cineres pones carbones etiam de praedicto ligno Iuniperi tantum factos. Habeas denique adhuc plures cineres calefactos"
  "source_languages":

    Cum autem terra exhauserit de aqua quinquagesimam partem sui, cito illam sublima fortiori igne, quo poteris, donec ascendat sursum ad modum albissimi pulveris.
    Cum autem videris terram sicut nivem albissimam, & quasi pulverem mortuum, Aludel spondilibus & ad latera adhaerere, tunc super eum reitera sublimationem, sine fecibus inferius remanentibus, quoniam adhaeret pars illius fixa & fixaretur cum fecibus, & nunquam per aliquod ingeniorum genus posset separari ab eis.
    Pulvis autem ascendens a fecibus superius est cinis a cinere et terra extractus, sublimatus honoratus,

  "source_text": |-
    Solaris medicinae praeparationi, non adurentis sit additamentum sulphuris, per modum figentem & calcinantem cum astutiae industria, administrati perfecte, atque solutionis modum multiplicem, cum reiteratione multa quousque mundum fiat, his quidem administratione perfecta perveniente quae per sublimationem perficitur, & est huius scilicet additamenti modus, per reiterationem partis, non fixi lapidis sublimationis, cum ingenio coniungendi quousque elevetur cum ea, et iterato figatur cum illa ut stet, & quando huius complementi exuberantiae ordo reiteratur pluries, tanto & huius exuberantia medicinae multiplicatur magis, & illius magis augetur bonitas, et multiplicatur illius augmentum perfectionis maxime.
    Et nos quidem ne mordeamur ab impijs, complementum narramus totum huius magisterij, sub brevi sermone, completo & noto.
    Et est illius intentio, ut per sublimationis modum mundetur perfectissime lapis, & illius additamentum.
    Et ab hinc quidem cum ingeniorum modo volativum ex eis figatur. De hinc vero fixum volatile fiat,
  "source_languages":
  - "la"
  "source_locations":

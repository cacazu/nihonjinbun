    "editorial_policy":
      "scope": "1550年刊『Rosarium philosophorum』の全192印刷頁。ラテン語本文、ドイツ語詩、見出し、印刷傍注、木版の銘文、刊記を日本語に訳す。木版全20図と扉図を収録。"
      "basis": "1550年原刊のデジタル画像を底本とする新規日本語訳。機関提供OCRを照合し、近現代の翻訳を底本としていない。"
      "transcription": "長いs・合字・主要な略記を読みやすく展開し、行末の分割を整理。u/v、i/j等の綴りは完全統一していない。改頁をまたぐ語は分割保持と結合の両方があり、日本語は隣接単位へ続く。"
      "uncertainty": "判読に不確実さがある略記、文意が不整な印本文は注に明示。原典の矛盾や数の違いを黙って整えない。"
      "excluded": "反復する柱、折丁記号、次頁への受け語、後世の所有者による手書き、白紙、装丁。"
      "image_policy": "原刊画像の木版領域を切り出しWebPに変換。加筆・再描画なし。図名と代替テキストは読者のための編集上の説明であり、原典の図題ではない場合がある。"
      "historical_notice": "本書は歴史資料。物質名、金属変成、治療、延命、毒性などの記述は当時の主張を翻訳したもので、現代の科学的・医学的有効性や実施安全性を示さない。記載の操作や服用を実行するための手引きではない。"

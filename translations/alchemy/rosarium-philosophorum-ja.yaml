    est sublimatio nostra per quam terrea foetulentia et partes sulphuris cum fecibus in fundo remanet, et in ea natura eius purificatur, et ab hinc cum fixionis modo figatur id est fermentetur, quia quod fixum est figit id est fermentum, deinde ad fimum ponatur. sequitur, donec in ignis asperitate quiescat, & hic secundus praeparationis id est sublimationis gradus appellatur. Si autem quaeratur, quo modo mercurius subtiliari potest, cum in actu habeat subtilissimam substantiam ut habetur capite trigesimo nono, dicendum quod in capite septuagesimo tertio dicitur, quod per sublimationis vel subtiliationis modum, id est cum sublimatione primi gradus mundetur & subtilietur, ergo & ultimo volatilis fiat, id est sublimetur cum ignitione, ita ut de fecibus ad vasis spondilia cristallo nitidior ascendat.
    Geber: Dealbate latonem id est terram, & libros reponite ne corda vestra rumpantur, et alibi, ignis & aqua latonem abluunt, & eius nigredinem abstergunt. sequitur, recipe ergo ipsum sublimatum in vase aludel, reitera vice una, id est sublimando, fixa sicut dicit capite sexagesimo secundo circa medium, quod plusquam fulgidissima, & cum cautela in administratione ignis, ut ipsius humiditas in tantum deleatur, quod sufficiat ad fusionem perfectam complendam, quia ignis lentus ut dicit ibidem

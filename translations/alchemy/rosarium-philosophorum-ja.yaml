  "translation_ja": |-
    だが霊化されるなら、現実態から可能態、質料から形相、作用を受けたものから作用者、女から男、生まれた物から生み出す物になる。したがって、哲学者が言うように、金の質料はなく、以前に銀でなかった金はない。このような形相がその質料、すなわち月と結合すれば、確かに両者はきわめて熱心に抱き合う。より大きく完全なものが、より小さく完全なものを完成させる。それは自然に、親しく行われる。あらゆる本性は、自ら完成することを求め、破壊されることを本性上嫌うからである。
    隠された事柄についてハセンに宛てた書簡のアウィケンナによれば、次のことを知るべきである。この術に取り組む者たちの意図、むしろこの術そのものの意図は、諸物の自然が可能とするかぎり、一つの物の質料に、別の物の形相と本性を着せることにある。たとえば、銅に銀の形相と本性を、鉛に金のものを着せることであり、ほかのものも同様である。『自然学』第二巻にあるように、形相は各々の物の本性だからである。ある物からその形相を取り去り、別の形相をその上に与えれば、疑いなくその本性も、もとの種から変成している。したがって私たちは、アルキミアという語はギリシア語で「変成」を意味すると言う。それゆえ錬金術とは、諸物の形相が区別される仕方に応じて、物をその形相と種から変成させる学である、と私たちは言う。

  "translation_ja": |-
    そこでハーリーは言う。「器の底へ降りたものを取り、熱い火で洗い、その黒さが除かれ、濃密さが去るまで続けよ。余分な湿りを飛び去らせ、染み一つない、きわめて白い焼灰となるまで行え。そのとき土は、魂を受け入れるのに適し、準備が整う。」
    そこでメルクリヌスは言う。「懐胎は変わったものを確かにし、開きを約束する。」
    詩句。「よく孕んだものは、一致する平和によって結ばれる。」
    モリエネスは言う。「この土は自らの水とともに腐敗し、清められる。それが清められると、神の助けによって奥義の全体が導かれる。」ヘルメスも言う。「アゾートと火はラトンを洗い、それから黒さを取り去る。」
    それゆえ哲学者は言う。「ラトンを白くし、書物を破れ。あなたがたの心が破れないためである。」これはあらゆる賢者の配合であり、仕事全体の第三部でもある。ゆえに『集会』で言われるように、乾いたものを湿ったものへ、すなわち黒い土をその水へ結びつけ、白くなるまで煮よ。このようにして、水と土をそれぞれに持ち、さらに水によって白くされた土を持つ。この白さが空気と呼ばれる。

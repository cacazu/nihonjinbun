  "translation_ja": |-
    先の炭の上に振りかけ、温かい灰で十分によく覆う。小さい鉢またはガラス器の中には熟成すべき質料を置き、大鉢には上から蓋をする。それを室内の腰掛けの下か上に、石の上へ置く。ただし損害を生じさせないようにせよ。この方法で、そのような火をいくつも用意できる。また小鉢に温水、あるいは湿った馬の腹のものを入れ、その中へ質料の小瓶を置くこともできる。
    先の炭は、次のように作る。ネズの木を指二本ほどの厚さ、あるいはそれより大きな小片に切る。大きな鉢にいっぱいに入れ、あらゆる側をよく閉じ、封泥する。その鉢を風炉の強火、あるいは薪の炎に丸一日置く。それからひとりでに冷えるのを待ち、鉢を開ければ、望むものを得る。灰は普通の方法で焼いて作る。この火は、霊を固定する第一または第二の度の火となりうる。

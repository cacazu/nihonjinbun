    さて第四の言葉が続く。それは、土とともにあった水が、濃化し凝固したのち、昇華によって上昇することである。このようにして土、水、空気を得る。これこそ哲学者の言うことである。「それを白くし、すみやかに火で昇華せよ。その中に見いだす霊が外へ出るまで続けよ。それはヘルメスの鳥、あるいは灰と呼ばれる。」そこでモリエネスも言う。「灰を軽蔑するな。それはおまえの心の王冠であり、永続するものの灰だからである。」『集会』には言われる。「火の扱いを強めよ。白化ののちには灰化へ達し、それは焼成された土と呼ばれるからである。」ゆえにモリエネスは言う。「底には火的な本性の、焼成された土が残る。」このようにして、前述の比率における四元素、すなわち溶解した水、白くされた土、昇華した空気、焼成された火を得る。
    これらの四元素について、アリストテレスは『諸原理の統治について』の書で言う。「空気から水を、火から空気を、土から火を得たとき、そのときおまえは哲学の術を完全に持つ。」モリエネスが言うように、これが第一の配合の終わりである。
    私たちの奥義には忍耐と待機が必要である。この奥義における性急さは、まさしく悪魔の側から来る。

  "translation_ja": "〔前頁から続く〕白い土の中で持っていた硫黄の未熟さによる。それは初めにその土と清い水とから作られた。この未熟なものは、自らの本性に最も近いもの、第一に金、第二に銀などを、常に腐食しようとするからである。しかし物体から凝結したもう一方のメルクリウスは、それができない。凝結によって、それ以前にあった未熟な硫黄の本性が変化したからである。そのため初めのもののようには腐食せず、閉ざされたものを開かない。それゆえ一つの力は他へ送られず、各々は別々に留まる。流動的には結ばれていても、本性では両側とも閉じられているので、火の試験と苛烈さによって不完全なものは焼け、完全なものは残る。一つの本性が他を助けられないからである。しかし未熟な水銀をもってすれば、本性の閂を外して開き、近縁のものが各々その本性を助けることができる。したがって銀を溶かせば銀の本性を、金なら金の、鉛なら鉛の本性を見出す、など。それらの硫黄によって凝結する。そこで哲学者はいう。もし、汝が多くの臭く不潔なものに求めるのと同じように、自らの本性を共有するこれらの物体を〔求めるなら〕。したがってそれからは両方について個別的に金銀を作れるが、すでに聞いたように、他の物体ではできない。注意せよ。物体の溶解には二つある。メルクリウスによってメルクリウスにすることと、メルクリウスの水にすることである。第一の溶解は個別的作業のために必要であり、第二は……〔次頁へ〕"

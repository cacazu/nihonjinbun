  "source_text": "ducunt, & in partem mineralem quae originem ex mercurio non ducunt. De metallis exemplum Sol, Luna, Iuppiter, Mars. Habet et electrum. De mineralibus exemplum, sales, atramenta, alumina, vitriolum, arsenicum, auripigmentum. Sunt autem ductibilia, & liquabilia omnia metalla quae originem ex mercurio duxerunt, quia materia eorum est substantia aquea mixta cum substantia terrea commixtione forti ut unum ab altero separari non potest, quare congelatur substantia aquea illa cum frigore magis post actionem caloris, & erunt ideo ductibilia seu fabrilia, & non congelatur sola aqua nisi cum siccitate terrestri, quae alterat aqueitatem cum in ipsis non est humor unctuosus, quia congelatio eorum est ex siccitate terrestri, ideo faciliter non solvuntur nisi per actionem caloris vehementem in ipsis, secundum quod sunt fortius & fortiter commixta. Sunt autem minora seu media mineralia secundum quod dictum est quae originem ex mercurio non ducunt, & horum quidam sunt sales qui liquefiunt humido faciliter ut alumen, sal simplex, sal armoniacum, sal lapideum et omnia genera salium, et quidem virtuosa sunt nec liquefiunt solo humore faciliter ut auripigmentum, arsenicum, sulphur, cum aqueitas sulphureorum corporum est commixta cum terra viscosa, commixtione forti cum ferventia caloris"

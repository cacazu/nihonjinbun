  "source_text": |-
    Hye ist geboren die eddel keyserin reich /
    Alle philosophi nennen sie jhrer dochter gleich.
    Die mehret sich vnd gebürt kinder on zal /
    Die seind vntödlich / reyn on alles mal.
    Sie vertreybt den todt vnd haßt armut /
    Sie gibt reichtumb / gesundheit / ehr / vnd gut.
    Vnd vbertrifft gold / silber / vnd eddelgesteyn /
    Alle ärtzney groß vnd kleyn.
    Nichts ist auff erdrich jhr geleich /
    Des sagen wir danck got von himelreych.
  "source_languages":
  - "de"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"

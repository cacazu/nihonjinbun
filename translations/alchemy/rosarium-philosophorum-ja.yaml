    哲学者パルメニデス。「身体が壊され、砕かれ、腐敗し、実体的な実体へ変わらなければ、かの隠された力は取り出せず、身体に混ぜることもできない。」
    哲学者バクス。「諸本性が壊れ、腐敗するとき、それらは生む。」哲学者プラトン。「卵に例がある。卵はまず腐敗し、そののち雛が生まれる。全体が腐敗したのち、それは生きた動物となる。」

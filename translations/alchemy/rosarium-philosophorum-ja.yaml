    「熱く湿った物、水性で焼灼性の物であり、生きた油、生きたティンクトゥラ、鉱物の石、驚くべき効能を持つ生命の水である。」アリストテレス。「太陽とその影、すなわち妻なしには、染める毒はまったく生じない。」
    昇華には二つある。第一は余剰物の除去であり、最も純粋な部分が元素的な滓から分離して残り、第五精髄の力を持つようにする。この昇華は身体を霊へ戻すこと、すなわち身体の濃密さが霊の精妙さへ移ることである。
    第二の昇華は、元素的な滓から分離された、そのうちの第五精髄の本性に属するものを抽出することである。私が第五精髄と言うのは、染める魂である。それには洗浄が必要であり、それによって砒素の油性、すなわち最も純粋な油性を持つ油的な本性が抽出される。それは自らの滓と結びついており、その滓が昇華するのを妨げるのである。

    modernorum respectu etiam naturae operationis veritatis, haec vero citius terminatur. Unde dixit philosophus: medicina est cuius temporis longum spatium anticipavit. Quare vobis dico, quod sustineatis patienter, quia forte moratur, & festinantia quidem ex parte diaboli est, ergo qui patientiam non habet ab opere manum suspendat, quia impedit eum festinantem credulitas.
    Omnis enim actio naturaliter suum habet modum, & tempus determinatum, in quo maiori & minori spatio terminatur.
    Ad haec tria necessaria sunt scilicet patientia, mora, & instrumentorum aptatio, de quibus in summa nostri magisterij perfecti artificem allocuti sumus, in capitulis diversis, in quibus experiri potest, si in nostris dictis fuerit sufficienter investigatus, in quibus manifesta probatione & aperta concludimus, lapidem nostrum nihil aliud esse, quam spiritum foetentem, & aquam vivam, quam & siccam aquam nominavimus, & per naturalem proportionem mundatam, & unitam unione tali, quod sibi nec abesse potest, quibus addi debet & tertium, ad opus abbreviandum, hoc est corpus perfectum attenuatum.
    Ex praemissis igitur patent res in quibus veritas est propinqua, & perficientes ipsum opus,

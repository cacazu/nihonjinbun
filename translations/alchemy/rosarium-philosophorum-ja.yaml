  "translation_ja": |-
    ルナリアの汁、生命の水、第五精髄、燃える葡萄酒、植物的メルクリウスは、すべて同じものである。ルナリアの汁は、私たちの子らのうちわずかな者にしか知られていない、私たちの葡萄酒から作られる。それによって私たちの溶解がなされ、それを仲立ちとして私たちの飲用金もできる。それなしには決してできない。
    なぜなら不完全な身体は第一質料へと変えられ、これらの水は私たちの水と結合して、ただ一つの清浄で澄んだ水となるからである。それはあらゆるものを清める一方で、必要なものをすべて自分のうちに含んでいる。それは貴くも卑しくもあり、それから、それによって、私たちの奥義の仕事は完成する。それが身体を溶かすのは、身体を雲の水へ変える無知な者たちが教えるような通常の溶解によるのではない。真に哲学的な溶解によってである。そこでは身体は、初めにそこから生じた第一の水へと変えられる。この同じ水が身体を灰に変えるのである。
    また、錬金術は聖霊の賜物であると知れ。そして私たちの時代には、ローマ教皇庁に、最高の医師であり神学者でもあった師アルノルドゥス・デ・ノウァ・ウィラがいたことを知れ。彼はまた偉大な錬金術師であり、金の小棒を作り、それをどのような試験にかけることにも同意したのである。

    Tamen si fieret sublimatio illius, credo tincturam lapidis multum ampliari, elige ergo ex his intentum tuum. Galeni ratio unde fiat yccir, vel elixir, & dicit quod diversi doctores ponunt diversas medicinas. Aliqui dicunt yccir esse de mineribus montium, alij de herbis, alij de bestijs & urina, &c. Fit tamen de una istarum rerum, quae ponitur in ymbic, et primo exit aqua in fumo, id est spiritus, secundo oleum in liquore id est anima, tertium vero quod in vase remanet, terreum est & vocatur corpus, ex his enim tribus, spiritu, anima, et corpore, ita coctus ut commisceri & fundi possit fit yccir, alij dicunt quod sulphur & argentum vivum, si quis ea fusibilia faciat fit yccir.
    Nota quod nulla aqua aut oleum aut ignis, habet suam ad tingendum efficatiam, quin prius rectificetur per reiterationem reductionis ad feces & distillationes, addimus usque octies vel decies, in omnibus igitur tam solvendis quam figendis, quam tingendis perficiendisque tenendus est modus, eo quod intentio debito modo rem ornet et compleat, scilicet quod corpora imperfecta calcinentur debite, laventur subtiliter, & mollificentur, imbibantur, sive cerentur, foecundentur, & ad solutionem modo praedicto ponantur, spiritus vero subtiliter laventur & depurentur, disponantur ad mollificationem & humiliationem, quae calida sunt

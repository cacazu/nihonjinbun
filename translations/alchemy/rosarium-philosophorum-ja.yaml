    videlicet pondus, ignis, corpus & spiritus.
    Decimum, quod omnes receptae sunt spernendae in arte.
    Undecimum, quod rebus praeparatis in vase positis, erit ludus puerorum, et quod in uno vase potest magisterium adimpleri. Item quicunque habet Mercurium verum, habet elixir, & quod elixir est Mercurius, mortificatus seu fixus cum odore corporis, quia draco non moritur nisi cum fratre & sorore sua. Item, nota quod oportet omnino, quod de corpore fiat Mercurius, id est, quod fixum fiat volatile cum volatili, id est, cum Mercurio mundo, & est necesse quod plus sit de volatili quam de fixo, a duplo usque ad quintuplum vel sextuplum usque ad decimum et non ultra. Et quanto plures sunt partes volatiles, tanto tardius fixantur, & fixum fit volatile in spatio unius mensis. Et nota quod non potest esse elixir, nisi corpus & spiritus transeant per omnia elementa, id est, per naturas omnium elementorum, ut prius fiant terra, postea aër, id est vapor, tertio aqua, quarto ignis, infixa quod fugiat ab igne. Nam ignis vocatur omne illud quod non fugit ignem, & quod in igne non marcescit nec consumitur.
    Qui vult investigare huius artis secretum, cognoscere eum oportet materiam primam nostrorum corporum, alioquin labore suo frustrabitur.

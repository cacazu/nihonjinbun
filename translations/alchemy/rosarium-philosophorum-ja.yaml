    王ヘルメス、第二論考。「息子よ、知れ。この多くの名前とさまざまな色を持つ私たちの石は、四元素から整えられ、構成されている。私たちはそれを分け、諸肢に切り分け、厳密に隔て、諸部分を死なせ、そのうちにある本性へ変えなければならない。その中に住む水と火を守らねばならない。それは四元素からなり、その水によってそれらの水を保持する。もし水でないものがあるなら、真の水の火的形である。それらを自分の器で昇らせよ。それらは自らの身体に霊を含み、染めるもの、永続するものとなる。」ソリヌスの技巧、第一の区分。「それから少しずつ取り、全体を分け、順々に磨れ。黒さが強まって粉のようになり、死に捕らえられるまで行え。これは大いなるしるしであり、それを探究する中で少なからぬ者が滅びた。そののち、各々を識別し、別々に、順に磨れ。」

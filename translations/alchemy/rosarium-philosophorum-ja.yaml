  "translation_ja": "〔前頁から続く〕できないと明らかである。成熟したメルクリウスの点で金銀と一致しない不完全な金属的物体は、染めることも、金や銀の本性を注ぎ込むこともできないからである。したがって染める力を持つもの以外で染めてはならない。金銀で染めよ。金は金の色と本性を与え、銀は銀の色と本性を与えるからである。力として、または自然に染める力を持たない他のすべてのものは捨てよ。そこには実りがなく、物資の損失と歯ぎしりしかない。"

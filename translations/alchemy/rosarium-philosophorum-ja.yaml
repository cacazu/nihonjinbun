  "source_text": "Septima est tinctura dans colorem splendidum et perfectum, album et citrinum intensum, dans lunificationem & solificationem rerum transmutabilium. Quia septimo post fixionem necessarius est & ultimus color tingens seu tinctura, colorans materiam convertibilem in verum aurum vel argentum cum omnibus suis differentijs certis et notis. Calidius Philosophus de aqua nostra dicit: Est enim ignis quia omnia comburit & terit, argentum vivum est acetum. Unde Socrates in turba dicit: Prima vis est acetum, id est argentum vivum. Unde Turba: Si corpus absque aceto super ignem ponatis comburetur, id est, absque argento vivo. Turba dicit: Est acetum acerrimum quod facit corpus merum sine quo nullus color venit."

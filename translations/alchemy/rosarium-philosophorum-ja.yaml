  "translation_ja": "〔前頁から続く〕しかし実際には銀ではない。そこには適切な熟成と煮沸がなく、火の硫黄も、水銀そのもののような単純で力のある本性を持たないからである。これに対して金と銀は、メルクリウスと硫黄という両方の側で十分に熟成され、よく成熟し、あらゆる熟成において完全である。こうして銅、錫、メルクリウスから偽の銀を得る。そのとき下位の鉱物の粉をいくつか混ぜれば、メルクリウスがその力を超えて作用することも不可能ではない。しかしそれは依然として不完全なので、結局は火の中で減り、燃える。硫黄がメルクリウスのように力のある本性を持たず、常に密かに害を帯びてメルクリウスを汚すからである。たとえメルクリウスが十分に与えられていても、後には以前のように糞へ戻る。それゆえ真の金銀が偽のものとどう違うかを理解せよ。同様の仕方で、他の金属に下位の鉱物またはその一部を加え、赤と白の偽造が多く行われるとはいえ、良い見かけを見出したと思う作業者たちは欺かれている。その原因は無知であり、金属の本性を知らないからである、など。"

    Beya quae est puella fulgida, suavis et tenera: Gabricus est masculus et Beya foemina, quae ipsi dat omne quod ex ipsa est.
    O natura benedicta, & benedicta est tua operatio, quia de imperfecto facis perfectum. Idcirco non assumas ipsam naturam nisi puram, mundam crudam, amoenam, terream et rectam. Si vero secus feceris non proderit quicquam. Vide quod nil contrarium intret cum lapide nostro, nisi ipsum solum pone. Coniunge ergo servum nostrum sorori suae odoriferae & inter se filium gignent, qui non assimilabitur parentibus. Et quamvis Gabricus sit charior Beye, tamen non fit generatio sine gabrico. Gabrici enim cum Beya concubium protinus mortuum est. Nam Beya ascendit super Gabricum, & includit eum in suo utero, quod nil penitus videri potest de eo. Tantoque amore amplexata est Gabricum, quod ipsum totum in sui naturam concepit, & in partes indivisibiles divisit. Unde Masculinus ait:

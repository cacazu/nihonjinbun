    et incorporali, eo quod postea mori non possumus. Nam post resurrexionem habebimus gloriam et fortitudinem sempiternam, tunc gaudebunt omnes in prosperitate magna, qui sciunt nostrum progressum.
    Et in hoc completur preciosum dei donum, quod est super omne mundi scientiarum arcanum, et incomparabilis thesaurus thesaurorum. Quia ut dicit Plato: Qui habet istud dei donum mundi habet dominium, quoniam ad finem divitiarum pervenit et naturae vinculum confregit, non tamen ex eo quod habet potestatem convertendi omnia corpora imperfecta in purissimum solem vel lunam: Sed magis ex eo, quod hominem et quodlibet animal praeservat in conservatione sanitatis. Lamina vero cristallina quae est elixir album si detur in quantum granum sinapis febricitanti, curat ipsum. Etiam leprosus si per quatuor anni tempora de eadem lamina purgatus fuerit cum pulvere rubeo, unde fit sol bis in anno, in Martio et Septembri, curatur. Et uterque pulvis albus et rubeus sanat sciaticos in periculo mortis, sanat etiam paralysim. Item, si pulvis teneatur ad nares in partu laborantium liberantur. Hoc dicit Hermes. Geber quoque dicit, quod elixir rubeum curat omnes infirmitates cronicas, de quibus medici desperaverunt, & facit hominem iuvenescere, ut aquila, & per quingentos annos vivere

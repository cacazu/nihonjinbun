  "translation_ja": "見た。この仕事で現れ、必要となるものを、私はすべて述べたわけではない。人間に語ることが許されない事柄があるからである。それでも、見てはいないが、完成に至るまで描き出した。仕事が必然的にそのような本性に達すると知っているからである。これは神から知るか、それを教える師から知るのでなければ、知ることは不可能である。また、これはきわめて長い道だと知れ。ゆえに、私たちの奥義には忍耐と長い待機が必要である。水銀は普通の塩である。ゆえに『ロサリウス』は言う。「普通の塩は金と銀を溶かし、金の赤さと銀の白さを増し、銅を身体性から霊性へ変える。そしてこの物によって身体が焼成される。」そこで『光の光』。「全能の神がこの塩を創造していなければ、エリクシルは完成されず、錬金術の研究は空しいものであったろう。」注意せよ。メルクリウスには四つある。生のメルクリウス、昇華したメルクリウス、マグネシアのメルクリウス、油性のメルクリウスである。マグネシアは満月であり、哲学者たちのメルクリウス、すなわち哲学者たちのメルクリウスを含む質料である。それは、自然が少し働きかけ、金属の形に形作ったが、なお不完全なまま残したものである。以上が彼の言葉である。注意すべきは、「侵入の媒介」と呼ばれるこのような物は、完全でもなければ、まったく不完全でもないということだ。無からは何も生じず、自然がそのうちに完成しなかったものを、技術者自身が自然を助けることによって、不完全から完全へ導くことができるからである。そしてそれは、不可視の石、"

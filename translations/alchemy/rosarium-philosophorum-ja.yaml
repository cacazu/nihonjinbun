  "source_text": "Octavus est qui fundit & calcinat, & est flammalis, quia in eo sola flamma operatur. Substantia ignis carbones & flamma, & in ista sola flamma lignorum, hic etiam est in eodem quoque gradu cum praecedentibus. In eodem quoque gradu est nonus, scilicet qui omnibus est magister: ut ignis officiationis, id est examinationis, hic fundit & comburit, & dissipat & dispergit malum, salvat & rectificat bonum, & est quasi iudex discernens iustum ab iniusto."

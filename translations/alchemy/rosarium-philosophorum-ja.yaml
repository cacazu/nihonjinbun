    Sed potius est illis inimica. Secundo politicorum dicit Philosophus: Impossibile est indigentem philosophare.
    Duplex est via in ista arte secundum Philosophos: scilicet universalis & particularis.
    Via universalis est facilis et rara, Et est talis quae ex principijs veris & naturalibus educitur, quibus virtus seminaria & reformativa statim, & in momento indurat Mercurium, & quodlibet metallum debite praeparatum, tingit in verum aurum vel argentum, secundum quod talis virtus primordialiter ad suum finem fuerit, activorum ad passiva coniunctione.
    Secunda vero via dicitur particularis, & est difficilis & laboriosa. Nota, licet Alchimia in via universali partim sit naturalis, partimque artificialis, magis tamen est naturalis, quia natura in via verae Alchimiae nil alienum vel extraneum introducitur, quia natura habet in quod operatur, eo quod activa iunguntur passivis per competentem unionem seu applicationem, caetera vero natura per se operatur. Plato, lapis noster est res quam ignis non tetigit, a qua noster Mercurius surgit.
    Tria sunt genera laborantium artem Alchimicam, scilicet Alchimista, Lauchimista & Lachrimista. Non omnis qui dicit, recipe, recipe,

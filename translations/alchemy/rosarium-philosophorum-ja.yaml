  "translation_ja": "身体が哲学者たちの水銀、すなわち私たちのメルクリウスの水へいかに溶解され、一つの新しい身体となるかが示される。第四には、私たちの時代にかつて見られたことのなかった哲学者たちの腐敗が示される。それは硫黄と呼ばれる。第五には、この水の大部分が、あらゆる哲学者たちの語る、黒く汚れた土にいかに変わるかが示される。第六には、この黒い土が初めは水の上にあり、少しずつ器の底へ沈むさまが示される。第七には、この土が再び水へ溶け、油の色になるさまが示される。そのときそれは哲学者たちの油と呼ばれる。第八には、竜が黒さの中で生まれ、自分のメルクリウスで養われ、自分自身を殺し、その中へ沈み、水が少し白くなるさまが示される。これがエリクシルである。第九には、水が黒さからすっかり清められ、乳の色にとどまるさま、また黒さの中に多くの色が現れるさまが示される。第十には、器の中で水の上にあった黒い霧が、自分の出てきた身体へ降り戻るさまが示される。第十一には、その灰が輝く大理石のように最も白くなるさまが示される。これが白へのエリクシルであり、生まれたものは灰である。第十二には、その白さがルビーのように透明な赤さへ変わるさまが示される。これが赤へのエリクシルである。仕事の全体をよく理解したければ、部分から部分へと読み進めよ。そうすれば驚異を見るだろう。私はこれらすべてを、私たちの時代に、獅子に至るまで"

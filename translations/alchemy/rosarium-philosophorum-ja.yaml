  "source_text": "Mercurius est ille: Et scias, quod ipse est frigidus & humidus, & ex eo creavit deus omnes mineras. Nam ipsum est elementum et aereum, fugiens ab igne. Cum ergo figitur ei aliqua pars, efficit opem sublimem, et est spiritus utilis, & non est aliquod in mundo nisi ipsum, nec est aliud quod stet loco eius, & est profundans solum in omni corpore, erigens ipsum. Cum ergo miscetur corpori vivificat ipsum, & illuminat & convertit de dispositione in dispositionem, & de colore in colorem. Est ergo totum elixir albedinis & rubedinis, & est aqua permanens, & aqua vitae & mortis, & lac virginis, herba ablutionis, & est fons animalis de quo qui bibit non moritur & est susceptivum coloris & medicina eorum, & faciens acquirere colores, & est illud quod mortificat, siccat & humectat, calefacit & infrigidat, & facit contraria secundum mensuram regiminis eius. Et sunt ei quando est vivum operationes aliae, & quando est mortuum, aliae operationes ab alijs: Et quando est sublimatum, aliae operationes, & quando est solutum, aliae operationes. Et ipse est Draco, qui maricat seipsum, & impregnat seipsum, & parit in die suo, et interficit ex veneno"

    ゆえに大いなるエリクシルの作用の固有性、またその組成の方法に注意せよ。私たちは一つの実体を作ろうとする。しかしそれは多くのものを集め、一つにし、固定したものである。火の上に置いても火がそれを追い出せず、融けたものと混ざり、それらとともに融ける。その中にある浸入しうる実体によって浸入し、混和しうる実体によって混ざり、固結させる実体によって固まり、固定させる実体によって固定する。金銀を焼くものによっても焼けず、適切で完全な加熱によって固結をもたらすものである。

    et est acutior omnibus salibus in suo genere quia est minera et cum eo calcinantur corpora et spiritus, et cum eo fiunt resolutiones et coagulationes elixir. Geber: Nota, quod nullum argentum potest fieri nisi omnia prius solvantur. Secundo, quod nulla solutio debet fieri, nisi in sanguine proprio vel appropriato, id est in aqua Mercurij quae dicitur aqua draconis. Tertio, quod illa aqua draconis debet fieri per alembicum sine omni alia re addita. Et quod in faciendo ipsum est maximus foetor. Quarto, quod cum illa aqua potest solvi amalgama, corpus et spiritus cinobrij et breviter omnia et singula quae sunt de natura ipsius. Quinto, quod illa aqua debet esse munda. Et ergo non debet fieri, nisi de dracone purgato, purgatur autem draco ipsum ter elevando, et inde ipsum vivificando. Sexto, quod oportet ut solutum putrefiat in calido et humido, id est in fimo equino. Ex hac oritur una nigredo. Septimo quod coaguletur in sicco solis in humido, id est in balneo Mariae. Octavo, quod tempus perfectionis elixir est ad minus unus annus. Est tamen videre, quod debet esse tempus foetus humani in utero matris. Nono, quod Mercurius nullo modo interficitur, nisi cum odore corporis perfecti rubei ad rubeum, et albi ad album, & quod corpus potest dare pondus suo pondere remanente.
    Quatuor sunt quibus opus nostrum completur,

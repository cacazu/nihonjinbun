  "source_text": "Omnis res de eo est in quod resolvitur nam glacies convertitur in aquam calore mediante, necesse est ergo ipsam prius aquam fuisse quam glaciem. Sic omnia metalla prius fuerunt argentum vivum quod patet, quia cum in igne liquescunt, convertuntur in ipsum, hic nota quod philosophus liquatum metallum etiam vocat mercurium sive argentum vivum, ergo reductio metallorum in argentum vivum isto modo dicitur liquatio ista, quamvis fiat per violentiam ignis, tamen quia in liquatione illa forti tenet speciem argenti vivi, ideo etiam nominat ipsum argentum vivum. Sed non est ista solutio philosophicalis sed laicalis, ergo ad particulare tibi notum, aliquo modo correspondet dictis philosophiae."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 99
  - "source_id": "source-1"
    "precision": "page"

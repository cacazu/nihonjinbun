  "source_text": "-ctionem eius ex cursu naturae necessario habet ignorare, facilius itaque est aurum construere quam destruere. Qui vero sine his tincturam efficere credit, caecus procedit ad practicam, sicut asinus ad coenam. Quia corpus non agit in corpus nec spiritus in spiritum, eo quod forma non recipit impressionem a forma, nec materia a materia, quia simile in suo simili non habet actionem et passionem, cum neutrum eorum sit dignius altero, quia par in parem non habet imperium. Unde Aristoteles: nulla est generatio vera nisi ex convenientibus in natura. Quoniam res non fiunt nisi secundum earum naturam. Nunquam enim sambucus profert pira, nec rubus mala granata, Nec arbor mala bonos potest facere fructus. Item dicit Philosophus, Mercurius noster convertitur in omnem naturam vel naturas, cum quibus iunctus fuerit vel divisus. Philosophus: Qui aurum scit destruere quod per amplius non erit aurum ille ad maximum arcanum pervenit. Alius dicit Philosophus: Difficile est aurum destrui, difficillime construi, facilius est destruere accidentale quam essentiale. Aurum est totum Mercurius, quod patet ex ipsius pondere: et ex ipsius Mercurij facili combinatione, ergo in ipso est totalis et radicalis philosophorum intentio et voluntas. Has enim virtutes et excellentias acquisivit mediante calore coeli et planetarum motu quas per se creare est impossibile nisi per accidens. Ad haec autem omnia in Mercurio, si artifex opus incipit per-"

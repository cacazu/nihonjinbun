  "translation_ja": "〔前頁から続く〕……染める毒は、太陽とその影、すなわち妻なしには生じない。ヘルメスはその秘説でいう。その父は太陽、その母は月である。『ロサリウス』はいう。太陽と月を離れて別のティンクトゥラを探そうとする者は、段のない梯子を登ろうとする人に似ている。したがって、私たちにはティンクトゥラに適した受け容れが必要である。それは父にある程度似ていて、父と調和するものでなければならず、この受け容れは月そのものでなければならない。太陽はそれだけでは融解・液化することが甚だ難しく、月もそれだけでは同じである。しかし両者が結び合わされれば、ともに甚だ容易に流れ、液化する。それゆえ金細工師はこの仕方で接合材を作る。哲学者はいう。女は男の種を受け容れる一種の器であり、自らの小室と子宮の中に種を保ち、そこで種は養われ、成熟の時まで芽生え育つ。だからいま彼に配偶者を選び、彼の種を受け容れるものを与えよう。妻として選ぶべきなのは、単純さと純粋さにおいて彼に最も近いものである。同じ類である夫と妻ほど近いものはないからだ。ヘルメスは寓意の中でいう。月は夜の灯であり、夜は闇の誕生であって、神は世界を統べるためにこれを造った。月は太陽から光を受け、その中に太陽の光があるゆえに愛される。それは太陽の本性が月の本性に勝るからである。私たちのメルクリウスは鉱物的なものと植物的なものとから作られる。〔次頁へ〕"

    est humiditatis conservativus & fusionis perfectivus. Item capite vigesimo nono dicitur, quod argentum vivum primo debet sublimari, postea figi.
    Item capite vigesimo octavo dicitur quod mercurius figitur per successivam illius iterata vice sublimationem, ita ut fusionem det metallicam, hoc idem saepe in dictis suis reperies, haec omnia praedicta intelligi debent de praeparatione primi lapidis et dealbatione eius, ante impositionem ipsius in fimum, quod scilicet toties debet incerari aquis acutis, et solvi et coagulari super cineres, donec nimium mollescat, dealbescat, & tandem fluat ut luna splendida, &c. Haec est enim sublimatio eius, scilicet in altiorem dignitatem et virtutem et eius vera purificatio. &c.
    Sequitur capitulum septimum: Sed consulo quod hoc opus imperfectis lapidibus inchoes, hoc enim fuit de principali & occulto ipsius Gebri intellectu, sic habes in capitulo decimo septimo, quod natura mercurij est ita in corporibus sicut est in mercurio, imo in lapidibus notis est perfectissimus. Item in capitulo tertio dicitur, quod in marcasita est natura mercurij mortificati & mediocriter praeparati qui melius valet. Iste philosophus in suis operibus solum vult naturam mercurij, sed tota solis natura est ex mercurio ut dicitur capite octavo.
    Item philosophus iste vult istam substantiam mercurij mortificatam, sed naturaliter mercurius

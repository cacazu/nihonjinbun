  "translation_ja": "他の病んだ物体から、メルクリウスを染めるための白と赤の硫黄を取り出せるか、と問うのはもっともである。私は、できないと答える。先に述べたように、染める光線を内に持つこの二つの物体に見出されるほど、よく調和したものは他にないからである。また、病んだ物体は臭く燃えやすい硫黄を含み、この二つの中にあるような力ある本性の硫黄を含まないと、すでに述べた。術は、その従うべき自然が先に存在しなければ何の力も持たない。下位の鉱物で金属を清めることはできるが、清められてもなお、その中に金銀の本性を持たない。金の熟成と煮沸が、他方のようには行われておらず、硫黄もそこまで成熟していないからである。だから未熟なものを成熟させるには、成熟したもので助けなければならない。それゆえそれらは染めるのでなく、染められる。金銀のティンクトゥラは、それら未熟または不完全なものと釣り合う本性を持つ。ともにメルクリウスから起源を引くからである。以上から、下位の鉱物は染めることが……〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

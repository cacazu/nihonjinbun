  "translation_ja": "〔前頁から続く〕愚者たちはこれを逆に理解し、より悪いものによってより善いものを完成させようと努める。そして、もともとその中に一度もなかったもの、すなわち金銀を、燃えやすいものの中に求める。以前説明したとおりである。"

  "translation_ja": |-
    ウィンケンティウスが『自然の鏡』で述べるところによれば、この術の名高い技術者は以下の者たちであった。
    アダム、ノア、イドリド、スクイリア、コラ、モーセとその姉妹マリア、カトー、ウェルギリウス、アリストテレス、アレクサンドロス、ゲベル、ヤヒエ、ラーシー、アビマザル、マウリエヌスすなわちモリエネス、福音記者ヨハネ、枢機卿ガルシアスとギルベルトゥス、フックと呼ばれた司教グウィルヘルムス、百二十五の石についての書を編み出した施療院長アエギディウス。また司教アンドロイクスと教皇使節ドミニクス、それにユダヤ人ヤコブ・アラニクス。彼らはこの術について少なからぬことを私に教えてくれた。さらに修道士ペトルスとディランドゥス、アウィケンナ、アルノルドゥス・デ・ノウァ・ウィラ、そして近年の私たちの時代に活躍したレイムンドゥスである。

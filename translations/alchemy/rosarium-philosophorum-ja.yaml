  "translation_ja": "〔前頁から続く〕普遍的作業のためである。第一の、物体をメルクリウスにする溶解は、単なる解離にすぎない。つまり一方の本性が他方へ浸入するために、解離だけによって閉ざされたものが開くことであり、この解離は個別的作業に属する。第二の溶解はメルクリウスの水への溶解で、普遍的に行われる。それは未熟な硫黄をメルクリウスの中で溶かすだけではなく、身体と霊を湿りの中で腐敗させることによって行われる。腐敗は、互いに結ばれたあらゆる本性の溶解と分離であり、結ばれた部分が互いに、各部分が他の部分から分かれるからである。これは、メルクリウスの生成の際に結ばれた元素、すなわち水と土を分離し溶解することによって行う。同じ部分がその本性において清められると、転換を通じて結ばれ、浄化によって、以前自然にあったときよりも互いを愛する。この分離は、物体の中では霊によるのでなければできない。こうして術は一つの道において自然を超える。自然では以前長時間かかったことも、人工的なものでは速やかに行われうる。これらが普通の元素、たとえば雲の水やそれに似たものだと思うな。冷たく乾いたものが土、冷たく湿ったものが水、湿って熱いものが空気、熱く乾いたものが火である。このように元素の本性にある。しかし術は、生成の際に結ばれた部分を、かつての元素そのものへ……〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

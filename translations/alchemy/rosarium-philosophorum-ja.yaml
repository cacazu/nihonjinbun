  "translation_ja": "〔前頁から続く〕自らの不完全さに近いものを求める。銀と銅が混じっていると、銀の中には汚れたものを見出さないが、銅の中にはまず焼損させる硫黄を見出し、そこへいっそう速く混ざる。全体が混ざる中でメルクリウスは銅によっていっそう汚される。鉛は、メルクリウスと硫黄という両方の側で汚れているからである。また、より悪いものは悪いものへいっそう速く付着し、それだけ弱く悪くなる。そのため銅または銀にいっそう速く付着し、それを汚し焼く。すでに聞いたように、銅と銀の本性は両側で閉じられているので、より悪いものを助けられない。こうして鉛は銅を焼いて銀から除く。鉛がなければその分離は遅い。不完全であればあるほど弱く、燃えやすいからである。しかし銅とメルクリウスとの結合では、ただちに本性をある程度開き、この二つ、すなわち錫と銅を結び合わせ、両方の側のある程度清浄なメルクリウスを結合する。錫には清浄なメルクリウスと悪い硫黄が弱く混じっているので、メルクリウスがメルクリウスに結ばれるのである。そしてメルクリウスは常に硫黄に対する力を持ち、硫黄の中にある銅の色を変えて、新たな形を現れさせる。また硫黄は、それ以前のメルクリウスに対するようには速く燃やせなくなる。未熟なメルクリウスがそれによって凝結すると、それらとともに本性を変え、ある程度銀のように見える。〔次頁へ〕"

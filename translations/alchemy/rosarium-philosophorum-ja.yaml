    Salomon, Sapientiae Septimo.
    Hanc scientiam pro luce habere proposuit, et super omnem pulchritudinem & salutem. In comparatione illius lapidis preciosi non comparavit illum, Quoniam omne aurum tanquam arena exigua est, veluti lutum aestimabitur argentum in conspectu illius. Melior est enim acquisitio eius negociatione argenti & auri puri & purissimi. Fructus illius preciosior est cunctis opibus huius mundi, & omnia quae in mundo desiderantur huic non valent comparari. Longitudo dierum & sanitas in dextera eius, in sinistra vero eius gloria & divitiae infinitae. Viae eius operationes pulchrae & laudabiles, non despectae, & semitae eius moderatae & non festinae, sed cum laboris diuturni instantia, lignum vitae est his qui apprehendunt eam, et lumen indeficiens, beati qui tenuerint eam: quia scientia dei nunquam peribit ut Alphydius testatur, dicens: Qui hanc scientiam invenerit, cibus eius legittimus erit & sempiternus.
    Aristoteles: O quam mirabilis est illa res, habet enim in se omnia quae quaerimus, cui nihil addimus vel diminuimus, sed in sola praeparatione superflua removemus.

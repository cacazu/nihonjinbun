  "translation_ja": "蝋状化、すなわち水を土の上へ戻す方法について。アルノルドゥス。"
  "translation_status": "draft"
- "id": "ROS-141-T02"
  "section_id": "section-4"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Infunde ergo primo aquam per vices conterendo & post leniter calcinando quousque ipsa terra biberit de sua aqua quinquagesimam partem sui, sciens quod oportet primo terram nutriri modica aqua, & post maiori, sicut est videre in infantis educatione, idcirco multum contere terram paulatim imbibendo cum aqua, de octo in octo dies, decoque in fimo, quia per inhumationem adustio tollitur, & res in primam suam materiam redigitur, & postea mediocriter calcina in igne, & non tedeat te multoties hoc reiterare, quoniam terra fructum non gerit absque frequenti irrigatione, et si trituratio non fuerit bona, donec aqua unum fiat cum terra corpus nihil proficit, non ergo suspendas manum a tribulatione triturationis vel a trituratione & assatione, quia terram facit albam, caveas tamen ne imbibas terram, nisi paulatim et paulatim cum longa trituratione, supple post exiccationem terrae, deinde est pondus in hoc ubique notandum, ne scilicet nimia siccitas aut superfluus humor administrando corrumpant, ut videlicet tantum assando decoquas quantum dissolutio"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 141
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720950"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720950"
  "translation_ja": "まず水を、擦り砕きながら何回かに分けて注ぎ、その後穏やかに焼成せよ。土が自分の水を、自身の五十分の一だけ飲むまで行う。幼児を育てるときに見られるように、土は初め少量の水で養われ、その後より多くの水で養われなければならないと知れ。だから水を少しずつ吸わせながら土をよく擦り砕き、八日ごとに糞の中で煮よ。埋め置くことによって焼損が取り除かれ、物はその第一質料に戻されるからである。その後、火でほどよく焼成し、これを何度も繰り返すことを厭うな。しばしば水を与えなければ、土は実を結ばないからである。また、水が土と一つの物体になるまで十分に粉砕しなければ、何も進まない。ゆえに粉砕の苦労から、あるいは粉砕と焙焼から手を止めるな。それは土を白くするからである。ただし長い粉砕を伴い、少しずつでなければ、土に液を吸わせないように注意せよ。土が乾いた後に補え。そしてこの作業では至るところ重量に注意しなければならない。過度の乾燥や余分な湿りが、操作によって物を損なわぬためである。すなわち、溶解によって加わっただけを焙焼によって煮去り……〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

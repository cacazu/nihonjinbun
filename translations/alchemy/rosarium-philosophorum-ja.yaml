  "translation_ja": |-
    すなわち重さ、火、身体、霊である。
    第十に、この術では、あらゆる処方を軽蔑すべきである。
    第十一に、調製された物を器に入れれば、それは子供の遊びとなり、一つの器の中で奥義を成し遂げられる。また、真のメルクリウスを持つ者は誰でもエリクシルを持つ。エリクシルは、身体の匂いによって死なされ、あるいは固定されたメルクリウスである。竜は自分の兄弟と姉妹とともにでなければ死なないからである。また注意せよ。身体からメルクリウスが生じなければならない。すなわち、固定されたものが、揮発するもの、つまり清浄なメルクリウスによって揮発性にならなければならない。そして揮発するものは固定されたものより多くなければならず、二倍から五倍、あるいは六倍から十倍までであって、それを超えてはならない。揮発する部分が多いほど、その固定は遅くなる。また固定物は、一か月の間に揮発性となる。注意せよ。身体と霊がすべての元素、すなわちあらゆる元素の本性を通過しなければ、エリクシルにはなりえない。まず土となり、次に空気、すなわち蒸気となり、第三に水、第四に火となる。固定されていないものは火から逃れる。火と呼ばれるのは、火から逃げず、火の中で衰えも消耗もしないものすべてだからである。
    この術の秘密を探究したい者は、私たちの身体の第一質料を知らなければならない。そうでなければ、その労苦は空しくなる。

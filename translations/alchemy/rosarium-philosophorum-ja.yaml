    calcinatur, aqua sublimatur, terra manet deorsum, aqua ascendit sursum, terra purgatur per calcinationem, aqua per sublimationem, ambo per putrefactionem. Aqua defendit terram ne comburatur, terra ligat aquam ne fugiat, ambobus sufficienter purgatis, fiunt unum ultra non separabilia, quia unum sine alio non potest esse, cuius prima pars proiecta super centum argenti vivi, in verum argentum tingit. Et si talis tinctura fuerit, una pars in rubeum versa, tingit tot partes in verum aurum, quo auro melius non reperitur, & hoc ex natura occulta, & acquisita per calorem ignis. etc.
    Nota. Spiritus domini ferebatur super aquas ante coeli & terrae creationem, Genesis primo.
    Videndum ergo quod omnia ex aqua creata sunt. Hanc aquam deus divisit cum dixit, & praecepit aquae partem in ariditatem, & illam vocavit terram, & aquam non conversam pro terra conservavit irrigandam & humectandam, quia terra sicca non multum fructum facit, nisi aqua sua pluviali de sursum humectetur saepius, & sine aqua vix, aut nunquam.

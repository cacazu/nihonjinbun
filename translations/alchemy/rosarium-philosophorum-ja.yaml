    注意せよ。よく調製された塩は、すべて塩化アンモニウムの本性へ戻り、秘密のすべては調製された普通の塩のうちにある。注意せよ。ローマの礬は金属の石の本性を持ち、熱く乾いている。また明礬は凝固したメルクリウスと思われるが、その完成には達していない。熱く湿っており、一なるものの伴侶、すなわちメルクリウスと呼ばれる。ゆえに、塩とその溶解を知る者は、古の賢者たちの隠された秘密を知る。だから心を塩へ向け、ほかのものを考えるな。そのもののうちにのみ、あらゆる古の哲学者たちの知と、最も重要で、最も秘められた奥義が隠されているのである。

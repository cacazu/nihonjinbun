  "translation_ja": |-
    アルノルドゥス。「錬金術の技術者は知るべきである。金属の種は、第一質料へ戻されないかぎり、変成させられない。だがそうしたときには、それまでとは異なる種に変わる。人工のものでも自然のものでも、一つのものの消滅は他のものの生成であるからだ。術は自然を模倣し、ある点では自然を正し、自然を超える。それは病人の自然が医師たちの熟練によって助けられるのと同じである。」
    『鏡』。「それゆえ尊ぶべき自然を用いよ。自然は、その自身の自然のうちでしか改善されないからである。そこへ異質なものを導き入れてはならない。粉であれ、ほかの何物であれ、そうしてはならない。異なる本性は私たちの石を改善せず、石そのものから生じたのではないものは、そのうちに入らないからである。何か外来のものをそれに加えると、ただちに損なわれ、求めるものはそこから生じない。」
    『鏡』。「そこで告げる。煮る初めに互いに似た物を取り、手で磨り潰すことなしに精妙にして、すべてが水となるまでにしなければ、まだその仕事を見いだしたとはいえない。それゆえ学ぶ者たちに、無益に疲れないように、きわめて貴い秘密を知らせよう。この奥義は、水銀と硫黄とを、ただ一つの水銀となるまで煮ることにほかならない。それは硫黄を燃焼から守る。器が十分に閉じられ、水銀が

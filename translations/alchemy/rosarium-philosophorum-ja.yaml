  "source_text": "in miseriam paupertatis constituet, quoniam vobis penitus hoc dei donum divina providentia est occultatum iudicio, et denegatum omnino: Haec Geber. Idem dicit libro primo capite vigesimo sexto: Innuimus ergo tibi secundum antiquorum opinionem, qui fuerunt de secta nostra, artem imitantium, quod principalia naturalia in opere naturae sunt spiritus foetens id est sulphur & aqua viva, quam & siccam aquam nominari concedimus. Spiritum autem foetentem divisimus, est enim albus in occulto, & rubeus & niger uterque in magisterio huius operis, in manifesto autem uterque tendens ad rubeum. Idem libro secundo capite trigesimo nono: Consideratio autem rerum iuvantium perfectionem est consideratio naturarum illarum rerum quae corporibus sine artificio videmus adhaerere, & mutationem facere, ut sunt Margesita, magnesia, tutia, anthimonium, et lapis lazuli, et consideratio illorum quae sine adhaerentia corpora mundificant, & sunt, scilicet, Sal & alumina, nitrum & Boracia, & quae suae naturae sunt, & quae consideratio vitrificationis mundantis per consimilem naturam."

  "translation_ja": "水は人間とほかのものの栄養を受け入れ、水のうちに最大の秘密がある。しかし、誤りを少なくするために、次のことを知るべきである。私たちの「昇華する」とは、身体を高めること、すなわち霊へ導くことにほかならず、それは穏やかな火によってしかなされない。私たちが「あの人は司教に昇げられた」、すなわち「高められた」と言うのと同じである。それゆえ普通の昇華は、ただ結果のしるしにすぎない。昇華すべき身体が、すでに昇華しうるほど霊的になったというしるしである。それは私たちの仕事には何も寄与せず、第一の石の調製ののちには、それ以上必要とされない。そのような昇華は霊化せず、ただ霊性の効果を示すだけだからである。それゆえ王たる哲学者ゲベルは適切に言う。「私たちの奥義の仕事には、唯一の器、一つの炉、一つの配置しか必要ない。」これは第一の石の調製ののちについて理解せよ。『創世記』。「すべては水から作られ、神の霊は水の上を動き、人間の生成の始まりも水からである。」ヘルメス。「おお力ある自然、諸本性に勝ち、超え、自らの諸本性を喜ばせるものよ。」ゲベル。「この術の原理と、仕事の存在に属する主要な根を知らずにいてはならない。」バシウス。「私たちの硫黄はあらゆる火より強い。」哲学者アラヌス。「あらゆる物のうちから一つを選べ。それは青鉛色で、澄んだ液状の金属的な外観を持ち、」"

    第二に、空気的かつ火的な湿りを持ち、それらが一様に結合し、一方が揮発するなら他方も揮発するようであること。この湿りは、あらゆる湿りにまさり、必要に応じて十分に濃化し、灰として完成するまで火の熱に耐え、結びついた土と分離することなく、蒸発せずに存続するものであること。
    第三に、その湿りの自然な配置が次のようであること。すなわち、同質性の恩恵によって、あらゆる異なる性質のうちに、両者の変換によって土を結びつけていること。両者の同質性のうちで力強く調和し、完全な合一と分離しえない結合の絆によって、最終的な調製の段階ののち、均等によい溶融を示すこと。
    第四に、この同質性が本質のきわめて高い純粋さを持ち、燃えやすいものや焼くものをすべて技術によって除かれているため、最も微小な部分に至るまで結びつくあらゆるものを焼かず、かえって燃焼から守ること。第五に、澄み輝く、白または赤のティンクトゥラを自らのうちに持つこと。それは清浄で、不燃性で、安定し、固定され、火もそれを少しも変えられず、

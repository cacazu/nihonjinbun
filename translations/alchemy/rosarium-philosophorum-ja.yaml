    「発酵とが得られる。焼成とは、霊の作用によって白い灰、土、または白い焼灰の状態へ戻すことであり、私たちの火、すなわち私たちのメルクリウスの水によってなされる。また『染められたものが染める』と言うとき、この焼成され、溶解され、凝固した薬を白に向けて発酵させれば月となり、太陽とともに行えば太陽となる、という意味である。またゲベルは、第三階級の薬について証明し、文字どおりに述べる。白にも赤にも、太陽と月を用いる同じ一つの道がある。ただし発酵において異なる。この第三階級の薬は、太陽的なものと月的なものの二つであるが、本質において一つであり、作用の仕方も一つである。ただし黄色、すなわち黄色い色の付加があり、それによって薬は固定された硫黄の実体から完成される。つまり両方の薬は太陽と月から始められるが、赤へ向けるときの発酵素は太陽で、白へ向けるときは月で作られる。太陽は二つの意味で取られる。一つは太陽の水、もう一つは太陽の身体であり、前述のとおりである。
    また『すべての色が現れる』と言うのは真実である。発酵以前、焼成、溶解、固定の中で、すべての色が現れるからである。また『光の光』はこう言う。『知れ。内側も外側も白くし、赤くするのは同じもの、すなわち太陽、月、メルクリウスである。』この三つが溶解され、発酵させられたものを、彼は水銀と呼び、こう言う。『水銀は、」

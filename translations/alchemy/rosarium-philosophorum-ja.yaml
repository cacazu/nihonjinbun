    〔前頁から続く〕焙焼で失われた分だけを、吸液によって溶かせ。したがって土を焼成した後には毎回、水をほどよく注げ。多すぎも少なすぎもせぬように。多すぎれば混乱の海となり、少なすぎれば燃えて灰となる。それゆえ八日ごとに、穏やかに、急がずに土へ水を与え、糞の中で煮て、土が自身の五十分の一の水を飲むまで焼成せよ。また、液を吸わせた後には七日間埋め置くべきことを知れ。
    長い仕事であっても、何度も繰り返せ。完成するまでティンクトゥラも有益な進歩も見られないからである。ゆえにどの作業にあるときも、それぞれの煮沸で現れるすべての徴を心に記憶し、その原因を探るよう努めよ。
    色は三つ、黒、白、黄である。土が出てくるとき、黒化は不完全であり、また完成した黒化がある。
    それゆえ毎回、焼成の火を少しずつ強め、火の力によって土が白く現れるまで続けよ。熱は湿ったものに作用すると黒さを与えるが、乾いたものに作用すると白さを与えるからである。したがって土が白くなければ、水とともに擦り砕き、その後ふたたび焼成せよ。アゾートと火はラトンを洗い、その暗さを取り去るからである。調製は……〔次頁へ〕

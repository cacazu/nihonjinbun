  "translation_ja": |-
    〔前頁から続く〕そして植物的なものである。それはあらゆる物体を変える赤いティンクトゥラであり、全塊を自らの本性へ転じる発酵素である。太陽と月が他の惑星を支配するように、この二つの物体は他の金属の物体を支配し、それらはこの二つの本性に一致するように転じる。それゆえ発酵素と呼ばれる。それなしには芽生えは改良されないからである。少量の発酵素が塊全体を変質させる、すなわち変成し膨らませるように、私たちの石にも同じことが起こる。そこでヘルメスはいう。
    子よ、光線からその影を取り出せ。それゆえその四分の一を取れ。すなわち発酵素を一部、不完全な物体を三部取るのである。発酵素をそれと等量のメルクリウスの水に溶かし、ごく弱い火で一緒に煮て、その発酵素を凝結させ、不完全な物体のようにせよ。そして器の口を閉じ、すでに述べたのと同じ方法と順序によって、すべての点で調製される。アリストテレスはいう。石として、王たちが王冠に用いて敬われるもの、医師たちが患者を治すために用いるものを選べ。それは火に近いからである。
    子よ、最も単純で丸い物体から取れ。三角や四角から取らず、丸いものから取れ。丸いものは三角よりも単純さに近いからである。したがって、角のない単純な物体に注意せよ。〔次頁へ〕

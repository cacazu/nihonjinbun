    しかし、それを昇華するなら、石のティンクトゥラは大いに増すと思う。ゆえに、これらの中からおまえの意図するものを選べ。イキシル、すなわちエリクシルが何から作られるかについてのガレノスの論。彼は、学者によって異なる薬を立てるという。ある者はイキシルが山の鉱物から成るといい、他の者は草から、また他の者は獣と尿などから成るという。それはこれらのものの一つから作られ、アレンビックの中に置かれる。初めに水が煙となって出る。これが霊である。第二に油が液体として出る。これが魂である。第三に、器の中に残るものは土的であって、身体と呼ばれる。この三つ、霊・魂・身体から、混ざり融けることのできるまで煮られて、イキシルができる。他の者は、硫黄と水銀を融けうるものにすればイキシルができるという。
    注意せよ。どんな水も油も火も、まず滓へ戻すことと蒸留を反復して精留されなければ、染める力を持たない。私たちは八度か十度までと付け加える。それゆえ、溶解、固定、染色、完成のすべてにおいて方法を守らなければならない。意図が適切な方法によって物を整え完成させるためである。すなわち、不完全な物体を正しく焼成し、精細に洗い、柔らかくし、液を吸わせ、あるいは蝋状化し、孕ませ、上記の方法で溶解に付す。霊は精細に洗って清め、柔軟化と低下へ向けて整える。熱いものは……〔次頁へ〕

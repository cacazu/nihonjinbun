  "translation_ja": "乾いたものはみな、その諸部分が連続するよう、自らの湿りを飲むことを本性上求める。ここで、あらゆる溶融可能なものの根源的な湿りが何であるかを心に留めよ。そして過度に乾いたものに、そのような湿りを養分として与えよ。そうすればほどよく調整されるであろう、云々。このようにして、おまえは望むものを得る。"

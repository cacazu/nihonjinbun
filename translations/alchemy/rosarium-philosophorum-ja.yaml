  "translation_ja": |-
    〔前頁から続く〕純粋な霊へ転じることによってしか起こらない。これを得たなら神を讃えよ。セニオルはいう。私は満ちてゆく月、湿って冷たい者であり、あなたは太陽、熱く湿った者〔別の読みでは、乾いた者〕である。穏やかな火によってしか成らない住まいで、釣り合った状態のもとに結ばれるとき、その穏やかな火は強い火を伴う。そこで私たちは身を空しくし、女とその夫が高貴な子の誕生のために身を空しくするようになる。この言葉は真実である。私と太陽とが結ばれ、閉ざされた家の腹の中で身を空しくするとき、私は親しくあなたから魂を受け取ろう。あなたの近さによって私の美しさと麗しい姿を取り去るなら、私たちは喜び、霊の歓喜によって高められる。年長者たちの位へ昇るとき、あなたの光の灯は私の灯へ注がれ、あなたと私から葡萄酒と甘い水との混合ができる。あなたが私の色である黒さをまとった後、私は自らの流れを抑える。それは私の溶解と凝結の後、墨のようになる。私たちが愛の家に入るとき、私の身体は凝結し、私は自らの空虚の中にいる。太陽は月に答えていう。
    月よ、あなたがこれを行い、私に害を与えないなら、私の身体は戻り、その後私はあなたに浸透の新たな力を与えよう。それによってあなたは融解と浄化の火との戦いで強くなり、銅や鉛のように減損し暗くされることなく、そこから出るであろう。そしてあなたは攻められない。〔次頁へ〕

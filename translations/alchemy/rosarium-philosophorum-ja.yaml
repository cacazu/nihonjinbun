    Sequuntur nunc aliqua notabiliora ex libello cuiusdam dicti Ademarus super Gebrum regem Persarum, capitulo quarto ubi dicit.
    Quantumcunque lapis sit mundatus per sublimationem, & eius adustio sit deleta, per eius olei extractionem, & eius fuga sit destructa per eius fixionem, nihilominus non funditur nec ingreditur, nec permiscetur sed vitrificatur, ut habetur capitulo decimo Gebri, circa medium, imo oportet ipsum in aquarum acumine dissolvi & calcinari multis vicibus, ut habetur capitulo sexagesimo septimo & primo capitulo & septimo & septuagesimo tertio Gebri. Idem capite sexto dicit.
    Quod ex multiplici reiteratione imbibitionis cum contritione & leni assatione aqueitatis eius maior pars deletur, haec est ergo sublimatio primi gradus, per quam aqueum mercurij deletur, postea in aludel vase, quod describitur in capitulo vigesimo octavo, ista tota substantia spergatur, in ipsius fundo, deinde ignis augeatur, ut dicitur in capitulo tertio, circa medium, donec ipsius pars, albissimam praecellens nivem, sua albedine quasi mortua, spondilibus aludel adhaereat, & haec

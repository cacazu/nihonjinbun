    受胎と婚約は、器の底の腐敗のうちに起こり、生まれるものの生成は空気のうち、すなわち器の頭、つまりアランビックの頭で起こる。身体は腐敗しなければ何もなさず、メルクリウスとともにでなければ腐敗できない。身体一部に対し、腐敗のためには水三十六部を取るべきと思われる。温かく湿った糞の最も弱い火で腐敗を行い、決してほかの火を用いてはならない。何も上昇しないようにせよ。何かが昇れば諸部分が分離するからである。それは、

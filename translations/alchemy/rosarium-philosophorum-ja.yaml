    eis elixir, & dicitur lapis non lapis, lapis quia teritur, non lapis, quia funditur. Et currit absque evaporatione, sicut aurum, nec est alia res cui proprietas illa conveniat. Avicen: Elixir ergo est res quae proiicitur super maius corpus, & mutat rem a natura sua in aliam. Fit autem quando miscetur corpus minus & spiritus & elementa & fermentum, fitque de omnibus una confectio. Et est Elixir verbum graecum, quod sonat magnum thesaurum, vel meliorem de thesauris. Et Elixir quidem quod se cum corpore miscet, est quasi Tutia cum Cupro. Sed augmentatur vel crescit Cuprum de illa Tutia, cuius ratio est, quia Tutia res terrenalis est, Elixir autem res spiritualis, & revertitur natura sui generis ad aliud genus.
    Alchimista: Fit autem Elixir duobus modis. Uno modo, ex spiritibus mineralibus & corporibus mundis praeparatis. Alio modo ex quibusdam rebus provenientibus ex animatis, scilicet ex capillo vel ovo vel sanguine, etc.
    Primo modo sic: Mortificantur quidam spiritus, & sublimantur, donec mundi fiant. Post hoc, unum de corporibus a natura generatis comburitur, donec possit teri, deinde calcinatur donec in modum calcis mundum efficiatur.
    Tandem vero spiritus & corpora sic praeparata teruntur & inbibuntur cum aquis acutis distillatis.

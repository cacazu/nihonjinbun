  "translation_ja": |-
    〔前頁から続く〕質料、すなわちメルクリウスから生じていない。それらの生成は、メルクリウスの生成と、形・本性・組成において根本から異なるからである。ゆえに金属にもなれない。一つの種に属するものは、それを生む第一質料と種も一つだからである。前提の第一部分、下位の鉱物はメルクリウスから生じないことは明らかである。メルクリウスは常に金属の第一質料にとどまり、異質な硫黄がそうなのではないからである。
    そこでアリストテレスとアヴィセンナはいう。それらが金属になるには、まず金属の第一質料に移らなければならない。しかしこれは人為的にはできないので、そこから金属を作ることはできない。こうして前提の第一部分は十分明らかになった。第二も同じ結論を示す。下位の鉱物は人為的に金属の原理、すなわちメルクリウスになれないので、中間と終点である金属とティンクトゥラにも至らない。これは、人間の養分がまず精液へ変わらなければ、生殖によって人間になれないのと同じである。それが同類に加えられて初めて、新しい人間が生まれる。しかし下位の鉱物は、ある鉱物的な力を共有するとはいえ、金属に対して異質な本性であり、力は弱く、焼けやすい。それゆえ金属の本性はそれを喜ばず、拒み、自分と同じ本性のものを保つ。たとえば水を土に混ぜても互いに分かれる。土は重く乾いているため底を求め、水は表面を求める。〔次頁へ〕
  "translation_status": "draft"
  "source_kind": "prose"

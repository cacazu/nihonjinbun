  "source_text": "ad universalia. Prima solutio corporum in mercurium non est nisi resolutio id est quod per solam resolutionem seratum aperitur, propter ingressum naturae unius in aliam, & ista resolutio est in particularibus. Secunda solutio est in aquam mercurialem & fit universaliter, & illa fit non per solam dissolutionem sulphuris immaturi in mercurium, sed per putrefactionem corporis & spiritus in humido, cum putrefactio omnium naturarum ad invicem ligatarum est solutio & separatio, & sic partes ligatae ab invicem separantur, & unaquaeque pars ab alia, & hoc fit per separationem & solutionem elementorum, quae in generatione mercurij sunt connexa, scilicet aquae & terrae & eaedem partes dum purgantur in natura per conversionem coniunguntur & plus se diligunt propter eorum mundificationem quam antea in natura, & haec separatio fieri non potest in corporibus nisi per spiritum. Sic ars transcendit naturam in una via, licet artificialia bene subito fiant quae tamen antea naturaliter prolixa fuerunt. Non credas quod haec sint elementa vulgaria scilicet aqua nubis vel consimilia, sed frigidum & siccum terra, frigidum & humidum aqua, humidum & calidum aer, calidum & siccum ignis. Et sic sunt in naturis elementorum, tamen nequaquam ars potest partes connexas in generatione ita separare, quod simpliciter in elementa"
  "source_languages":
  - "la"
  "source_locations":

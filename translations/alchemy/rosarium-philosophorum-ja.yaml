  "source_text": "post veram mundificationem, maior pars est argentum vivum. Et propter hoc non comburitur nisi per accidens. Et est illud verbum preciosissimum, hoc autem totum factum est a natura, & non est credendum quod hoc facere sit possibile, per aliquod artificium, sicut quidam fatui putaverunt & putant. Lapis enim philosophicus creatus invenitur a natura, & per Deum altissimum nihil plus indiget nisi quod removeatur quod est superfluum in eo. Ergo ipsa praeparetur materia ut ex eo eliciatur quod est purum, terreum autem & foeculentum removeatur. Unde Tudianus Philosophus: Scias quod lapis noster aëreus & volatilis est in suo manifesto, frigidus & humidus, & in suo occulto calidus & siccus est. Et illa frigiditas & humiditas quae est in manifesto fumus aquosus, corrumpens, denigrans & destruens se & omnia, fugit ab igne. Et caliditas & siccitas quae est in occulto est aurum, aurum calidum & siccum, & est oleum mundissimum, penetrativum in corporibus & non fugitivum, quia caliditas & siccitas alchimiae tingit & non aliud. Fac ergo quod frigiditas & humiditas aquosa, quae est in manifesto sit compar caliditati & siccitati, quae est in occulto, ita ut insimul conveniant & coniungantur, & fiant insimul una penetrans, tingens & profun-"

    術のうちへ入れるわけではない。「取れ」と言うべきものはただ一つであり、一つの身体が別の身体に入り込むことはないからである。グラティアヌス。「これとこれを取り、このように、またこのように行え。そうすればこれを得る。」このことはすべての哲学者のもとで真実である。それゆえ哲学者。「最初の言葉である『取れ、取れ』は多くの誤りを生んだ。」ゆえに最初の仕事は石の物質を溶解すること、すなわち通俗的なものではないメルクリウスを溶解することである。アルノルドゥス。「哲学者たちの言葉を文字どおりに理解する愚者は目がくらみ、偽りしか見いださない。そして『私たちは試みたが何も見いだせなかった。だからこの学は偽りだ』と言う。そのとき彼らは絶望した者のようになり、書物と学を軽蔑する。それゆえ学も彼らを軽蔑する。自然の秘密についての私たちの学には、無知な者以外に敵はいないからである。」詩句。
    この石は小さく、値も安い。
    愚者には蔑まれるが、学んだ者にはいっそう愛される。
    アルフィディウスも言う。「この秘事で問題となる石を、神は高い代価で買うものとはされなかったと知れ。それは道に捨てられて見つかる。貧しい者も富める者も得られ、各人が理性と知識によって容易にそれへ到達できるためである。」水銀は石ではない。そこでコンスタンティヌス。「溶融できるものであるから、石ではない。」水銀は火である。ゆえに哲学者。「したがって知れ。水銀は火であり、火よりも強く身体を焼き尽くす。」

    -gatur foeminae, & ultra hoc requiritur semen, et sic ante fermentationem debet fieri conceptio & impraegnatio, & cum multiplicatur materia dicitur quod infans crescit in utero matris, et cum fermentatur. Ortulanus & Arnoldus: quod infundatur anima corpori, & nascitur rex coronatus. Item in libro turbae Philosophorum habetur haec doctrina: Solvite corpora & inbibite spiritum. Et dicunt corpora in plurali, quoniam oportet quod ad minus sint duo. Et dicunt Spiritum in singulari, & sic oportet, quod sit unus. Et nullum est sperma sine materia corporum nisi Mercurius. Et cum dicitur inbibite spiritum, intelligitur operatio ea, quae fixat Mercurium & multiplicatur lapis, multiplicatur, id est reiteratur.
    Item, quando materiam solis & lunae mortificat Mercurius, remanet materia sicut cinis, & vocatur a Philosophis cribratio & contritio eorum. De quo cinere dicitur in libro turbae & Arnoldi, cinerem hunc ne vilipendas. Item, Praedictus cinis qui est illis tribus appellatur a philosophis corpus immundum, quia oportet decoqui & calcinari usque ad albedinem. Ideo dicit Morienes in libro turbae: Nisi corpus immundum mundaveris, & ipsum dealbatum reddideris, & in ipsum animam miseris nihil in hoc magisterio direxisti. Et sic habentur duo scilicet, calcinatio ipsius lapidis & fer-

  "translation_ja": "〔前頁から続く〕すなわち効能は、蒸留によって改善される。それらの浄化と精製についてはすでに十分に論じた。それらによって不完全な物体は調製され、精製され、改善され、微細化されうる。常に適切な火を仲介とする。それらによって火の目的に沿うよう、次の方法で調製し精製するのである。不完全な物体は余分な湿りと、焼けやすい硫黄性を持つ。それは混ぜられるものに黒さを生み、上述の物体を損なう。また不潔で滓の多い、燃えやすく、甚だ粗大な土性を持ち、浸入と融解を妨げる。これらおよびこれに類するものが、上述の物体の余分なものであり、私たちの確実で工夫ある経験と探究によって、その中に見出された。それらは物体に偶有的に加わり、根本的なものではないので、偶有物を取り去ることは可能である。したがって、人工の火を用いて上述のものを清め、余分な偶有物をすべて除き、水銀と根本的な硫黄の実体だけを残さなければならない。これが不完全なものの全き調製と完全な精製である。これら、あるいは残ったこの純粋な実体の改善、精製、微細化は、エリクシルが必要とするところに従って多くの方法で行われる。したがって調製および精製について……〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

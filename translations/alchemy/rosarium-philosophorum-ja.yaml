    息子よ、その身体が再び生かされることを望むなら、それに自らの魂を戻せ。そうすればただちに生きる。
    「ああ師よ、私には分かりません。」
    息子よ、より明瞭に言おう。ただ一つの石、あるいは一つの物である。身体は自らの本性、すなわち自らの水、つまり自らの第一質料へ戻されたからである。身体の第一質料は油性の水である。そして身体の実体と結合の水が、最も微小な部分まで分かたれず一つになったとき、初めて一つの物と呼ばれ、無限の枝が増殖する賢者の石となる。これが、哲学者たちの書物に知られる石と呼ばれるものである。ゆえに息子よ、その石からそれ固有の水が、分離の仕方によって霊として取り出される。
    私たちの昇華は、固定していない部分を固定した部分から持ち上げることである。固定していない部分は、煙と風によって持ち上げられる。

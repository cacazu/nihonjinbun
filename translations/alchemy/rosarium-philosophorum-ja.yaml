  "source_text": "& nequaquam artificialiter sic possunt coniungi quod istae naturae contrariae steterint in una natura coniunctim, bene quidem aqua potest abluere & mundare terram, sed quod siccitas terrae artificialiter mutetur in aqueum humidum credi non debet, licet terra madefiat aqua, sic minora mineralia possunt quidem coniungi cum metallis & ea purgare & aliquomodo novam formam introducere, sed cum ipsis permanere & illud immaturum maturare natura non concedit. Quare fatui ut diversa negotia & sophistica ad decipiendum homines adducunt, scilicet res improportionabiles, quae nec materiam dant nec eam etiam recipiunt, scilicet secundinas, oculos animalium, testas ovorum, crines, sanguinem hominis rufi, vermes, herbas, radices, stercus humanum. Multi enim fatui laboraverunt & adhuc laborant in his rebus vegetabilibus & sensibilibus ubi tamen nihil invenerunt veritatis sed quasdam humilitates de quibus indicamus inscijs, ut evitare possint deceptiones, nam ex his rebus postea dicendis longo tempore extraxerunt quod appellabant argentum vivum artificiale & olea & aquas quas nominaverunt quatuor elementa, videlicet aquam aerem terram et ignem et salem armoniacum arsenicum et sulphur & auripigmentum, quod emissent melius in foro et citius perfecissent. Quaesierunt etiam"
  "source_languages":
  - "la"
  "source_locations":

  "translation_ja": "物を芽生えさせるのは水である。それゆえ息子よ、私はおまえに忠告する。おまえの注意のすべてを水の煮熟へ向けよ。成果を得たいなら飽きてはならず、むなしいほかの物事を気にせず、ただ水だけを心にかけよ。それを少しずつ腐敗させながら煮て、一つの色から完全な色へ変わるまで続けよ。初めにその花やその緑を焼いてしまわないように気をつけ、仕事を急いで仕上げようとするな。また、中にいるものが飛び去れないよう、おまえの扉がよく堅く閉じられているか注意せよ。神が許したもうなら、そのようにして成果へ達するだろう。自然は自分の働きを少しずつ行う。私は、おまえにもそのようにしてほしい。むしろ、おまえの想像が自然に従うものであるようにせよ。大地の腹の中で身体が再生する、その自然に即して観察せよ。そしてこれを、幻想的な想像ではなく真実な想像によって思い描け。同様に、それらがどのような熱で煮熟されるか、それが激しいのか穏やかなのかを見よ。」"

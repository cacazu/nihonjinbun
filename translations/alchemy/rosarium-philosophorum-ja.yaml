  "kind": "paragraph"
  "origin": "source"
  "source_text": "et a laesione custodit, et generaliter omnes tam calidas quam frigidas, tam siccas quam humidas infirmitates arctissime sanat prae omnibus alijs medicinis medicorum, quoniam si aegritudo fuerit unius anni, sanat in duodecim diebus, si vero antiqua fuerit, ex multo tempore, sanabit in uno mense. Et breviter omnes malos expellit humores bonosque inducit, confert amorem et honorem, ipsum deferentibus securitatem et audatiam, et in praelio victoriam. Et in hoc completur secretum naturae maximum, quod est super omne precium preciosissimum secretum, thesaurus incomparabilis et preciosissimus, quem habentibus deus in sua mente recondat, ne insipientibus patefiat. Amen dicat omnis vivens."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"

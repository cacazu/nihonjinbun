  "translation_ja": |-
    〔前頁から続く〕かの尊ぶべき石の中にある。誰にも明らかなとおりである。したがって、云々。また、この哲学者がメルクリウスのこの実体を固定したものにしようと望むのは明白である。彼は多くの注意と工夫を添えて、固定の技法を教えるからだ。しかし、この貴い石の実体が最も強く固定していることを、誰が疑うだろうか。それを知る者なら、誰も疑わない。したがって、云々。
    また哲学者は、湿りを保つため、火に注意して石を固定することを望む。しかし地の内臓よりも調和した熱が、どこにあろうか。したがって、云々。また哲学者は自分の石が融けることを望む。ゆえに石こそ哲学者たちの師であることが明らかだ。石はなすべきことを、自然に、おのずからさえ行う、と言わんばかりである。こうして哲学者は石の主人ではなく、むしろその奉仕者である。
    したがって、自然を離れた術と細工によって、あるものに本来ないものを持ち込もうとする者は誤っており、自分の誤りを嘆くことになろう。
    赤い作業の原理は太陽であり、白い作業の原理は、燃やし燃えうる硫黄から浄められた月である。
    それにそのような実体があることは第四十七章に見られる。また、月が白い作業の石であることは第十八章にある。それゆえ霊、身体、魂を持つこの貴い石を取り、その湿り、またはメルクリウスとともに焼成せよ。そこに触れて感じられるものがなくなるように。

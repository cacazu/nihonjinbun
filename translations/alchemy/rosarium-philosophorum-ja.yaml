  "source_text": "Sed naturis ex utraque parte seratis unumquodque in examine ab altero separaretur, cum in se non haberet naturam perfectam occulte, cum qua prope per ipsorum solutionem perficere possent, sed cum semper ipsis necessarium sit mediante arte ut alia corpora perfecta ipsis subvenirent cum sua natura quae naturaliter est perfecta. Secundo si insoluta adiungerentur corporibus perfectis minus aurum & argentum fieri posset, cum naturaliter per congelationem ex utraque parte naturae eorum seratae sunt, & cum non est medium aperiens illas naturas ad mittendum unam vim in aliam, tunc coniungi non possunt coniunctione naturali, ita ut redeant in mercurium, unde ex utraque parte originem duxerunt, & ideo per vehementiam ignis ab invicem separarentur, per combustionem naturae imperfectae ut bene cernitur, sed cum coniungere volueris, facias mercurium per mercurium qui dissolvit & aperit naturas seratas, ut simpliciter unum possit transire in aliud, & perfectum mittere vim in imperfectum ut secum perficiatur. Et isti sunt labores viae particularis, & sic particulariter aurum & argentum fieri possunt. Nota quod mercurius crudus dissolvit corpora & reducit ea in primam materiam suam sive naturam, sed mercurius corporum hoc facere non potest, hoc est propter cruditatem sui sulphuris, quod in prima"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 124
  - "source_id": "source-1"

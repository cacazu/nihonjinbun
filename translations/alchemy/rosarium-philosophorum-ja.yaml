  "origin": "source"
  "source_text": "suam naturam, et ideo non adhaeret corporibus, sed corpora adhaerent sibi. Et propter hoc multi sunt decepti in operando in illo argento vivo vulgi. Quia lapis noster scilicet argentum vivum occidentale quod praetulit se auro & vicit illud, est illud quod occidit & vivere facit. Scias ergo quod argentum vivum coagulatum, mortificatum propria natura, est pater mirabilium omnium huius magisterij nostri, et est spiritus et corpus, id est spirituale corpus, quia sublimatione ascendit. Et hoc est quod Geber dixit: Consideratio verae rei quae omnia perficit est consideratio electorum purae substantiae argenti vivi. Sed ex quibus maxime haec argenti vivi substantia elici possit solet quaeri: Et nos respondentes dicimus, quod in his in quibus est, ex illis elicitur. Ergo fili considera, et vide ubi sit illa substantia, et istam accipe et non aliam, si pervenire desideras ad verum intellectum etc. Dico tibi in charitate Christi, quod nullo modo invenire potuimus, nec Philosophi similiter invenire potuerunt aliquam rem perseverantem in igne, nisi solam illam unctuosam humiditatem perfectam non cremabilem. Et illa quando est praeparata ut oportet, omnia corpora quae tangit, ducit ad verissimum solare complementum, et super omnia corpora et maxime Lunam. Radix artis, est sapo sapientum et est minera omnium salium, et dicitur sal amarum quia oritur de minera maris,"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 22
  - "source_id": "source-1"
    "precision": "page"

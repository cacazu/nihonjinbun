  "translation_ja": |-
    神の助けなしには、誰もこれを作れない、
    自分自身を見通せる者のほかは。
    私の土から泉が湧き、
    そこから二筋の流れが走る。
    一つは東へ流れ、
    もう一つは西へ流れる。
    そこから二羽の鷲が飛び、羽を焼き、
    裸となって地へ落ちる。
    そして再び美しい羽を得る。
    それに太陽と月が従う。
    おお主イエス・キリストよ。
    あなたこそ賜物を与えるお方。
    あなたのかくもよき聖霊によって。
    聖霊はそれらすべてを守っている。
    まことに、それを与えられた者は、
    師たちの言葉をことごとく理解する。
    その者が来たるべき生命を思うように。
    身体と魂が正しく結びつけられ、
    父の王国に漂う、その生命を。
    地上の術も、このように成り立つ。

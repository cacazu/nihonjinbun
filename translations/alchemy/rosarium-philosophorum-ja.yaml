  "source_text": |-
    hoc videre poteris per tuum intellectum cum factum sit unum corpus transparens, et in unum continuatum per coniunctionem aut commixtionem multarum partium sine divisione discontinuatione & terminatione in unam spissitudinem & figuram transparentem per omnes partes suas. Iam fili tu modo habes non modicum secretum, illumina igitur primo corpus antequam imponas animam, quia alias nunquam posset suscipere aut in se retinere spiritum: Haec Reymundus. Calidius Philosophus: Nemo unquam potuit vel postea poterit tingere terram foliatam, nisi cum auro. Ideo praecipit Hermes dicens.
    Seminate aurum vestrum in terram albam, foliatam, quae per calcinationem facta est ignea subtilis & aerea.
    In istam ergo terram aurum seminamus cum tincturam auri illi imponimus. Sed nunquam aurum potest perfecte aliud corpus tingere, quam seipsum. Certe hoc non potest nisi perficiatur arte.
    Aurum est fermentum operis, sine quo nequaquam peragitur, quia est sicut fermentum pastae, coagulum lactis in caseo, & sicut muscus in aromatibus bonis, & cum eo fit compositio maioris elixir, quia illustrat & ab adustione conservat, quod est signum perfectionis. Et scias quod

    Senior in epistola Solis & Lunae.
    Aqua vero quam memoravi, est res de coelo descendens, & terra cum humore suo suscipit eam & retinetur aqua coeli cum aqua terrae, & aqua terrae propter servitium suum & arenam suam honorat eam, et congregatur aqua in aquam, & retinebit aqua aquam, & dealbabitur albira cum astuna.
    Hermes: Spiritus non ingredietur corpora, nisi munda. Alphidius: Accipe albedinem & nigredinem dimitte. Democritus: Mundifica stannum cum praecipua ablutione, extrahe ab eo nigredinem eius, & obscuritatem eius, & apparebit candor eius. In opere Sorin. Dissolve albo igne quousque videatur ut gladius denudatus, & fac dealbando corpus esse candidum. Rasis: Aqua cum miscetur Aeri, ipsum interius dealbat, haec dealbatio dicitur a quibusdam impraegnatio, quia terra dealbatur. Dominante namque aqua, terra crescit & multiplicatur, & augmentatio novae prolis inde generatur. Alphidius: Tunc oportet te terram nigram abluere, & igne calido dealbare.

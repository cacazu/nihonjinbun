    また先の石はレビスと呼ばれる。二つの物、すなわち身体と霊、あるいは太陽と月から、清められ発酵させられた身体からできる一つの物、という意味である。また真の組成のため、至るところに見つかる石と呼ばれる。太陽、月、メルクリウスの三つが一緒に結合すると、石の力は全体に行きわたり、山にも平地にも、つまり身体とメルクリウスにも、海、つまり溶解した水にもあるからである。そして飛ぶものたちは、そこから助けを得る。飛ぶものとは、生きたメルクリウスと、太陽や月へ変わる不完全な身体である。またそれは蠍、すなわち毒と呼ばれる。自らを殺し、自らを生かすからである。この三重の物を生きたメルクリウスの上へ投射すると、それを生かす。真の身体にするからである。このように、すべての哲学者たちの言葉を、さらに説明することができる。それでも哲学者たちはこれを鉱物の水銀と呼ぶ。しかし賢者の石の質料は水であり、オルトラヌスが証明するように、この三つの水を意味する。これより多くも少なくもあってはならない。そして彼は、太陽は男、月は女、メルクリウスは種子だと言う。しかし生成と受胎が起こるためには、男が女と」

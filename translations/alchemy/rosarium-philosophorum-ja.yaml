  "translation_ja": "アウィケンナ、ハセンに宛てた書簡。「エリクシルは自らのティンクトゥラで染め、自らの油で沈み、自らの焼灰で固定される。白いものは火を含まない三つで完成するが、黄色いものは四つすべてで完成する。」注釈。「白いエリクシルに必要なのは三つ、すなわち油、ティンクトゥラ、焼灰だけだというのは真実である。しかし赤には四つ、油、焼灰、ティンクトゥラ、さらに火と呼ばれるティンクトゥラが必要である。それゆえアウィケンナは『そのうちに火はない』と付け加えるのである。」"

  "source_text": |-
    Keyn höher mag vber in geboren werden.
    Mit kunst odder durch die natur /
    Von keyner lebendigen creatur.
    Die philosophi heyßen ihn jhren son /
    Er vermag alles was sie thun.
    Was der mensch von jhm begeren ist /
    Er gibt gesundheyt mit starcker frist.
    Goldt silber vnd eddel gestein /
    Sterck / junckheyt schön vnd reyn.
    Zorn / trawren / armut / kranckeyt er verkert /
    Selig ist der mensch dem es gott beschert.
  "source_languages":
  - "de"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 167
  - "source_id": "source-1"
    "precision": "page"

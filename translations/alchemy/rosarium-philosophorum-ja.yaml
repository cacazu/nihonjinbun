  "origin": "source"
  "source_text": "terra alba habuit, cum qua ex aqua clara factum est ab initio, quia illud crudum semper appetit corrodere quod suae naturae vicinius est, primo aurum secundo argentum &c. Sed alter mercurius ex corporibus congelatus hoc facere non potest, quia per congelationem illud crudum sulphur quod antea fuit in eo, est alteratum in natura, ideo non corrodit sicut primum nec seratum aperit, & ideo una vis non mittitur in aliam, sed unumquodque per se manet unde quidem fluctualiter sunt coniuncta, sed naturaliter ex utraque parte sunt serata, quare per examen & asperitatem ignis imperfectum comburitur perfecto manente, quia una natura alteri succurrere non potest, sed cum argento vivo crudo hoc facere potest, scilicet naturas reserare et aperire, ut unaquaeque res vicina sit suae naturae adiuvamen, ideo si dissolvitur argentum inveniet argenteam naturam, & si aurum auream, si plumbum plumbeam &c. Per ipsorum sulphur congelatur, unde philosophus: Si vero ista corpora quae suam naturam participant, sicut tu quaeris in multis rebus foetidis & immundis, & ideo est particulariter possibile ex utraque parte ex eo fieri aurum & argentum, & in alijs corporibus non ut audivisti. Nota duplex est solutio corporum in mercurium per mercurium, et in aquam mercurialem. Prima solutio requiritur ad particularia, Secunda"

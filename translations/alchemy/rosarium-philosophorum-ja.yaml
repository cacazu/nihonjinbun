  "translation_ja": "それはメルクリウスである。それが冷たく湿り、神がそこからあらゆる鉱物を造ったことを知れ。それは元素であり、空気的で、火から逃れる。その一部が固定されると、高貴な働きをなし、有用な霊となる。世界にそれ以外のものはなく、それに代わりうるものもない。それだけがあらゆる物体の深みに入り、その物体を起き上がらせる。物体と混じれば、それを生かし、照らし、一つの状態から別の状態へ、一つの色から別の色へと転じる。したがって、それは白と赤のエリクシルのすべてであり、永続する水、生命と死の水、処女の乳、洗浄の草である。また、それから飲む者は死なない生命の泉であり、色を受け容れるもの、それらの薬であり、色を獲得させるものである。それは殺し、乾かし、湿らせ、温め、冷やし、その操作の度合いに従って反対の作用を行う。それが生きているときにはある働きがあり、死んでいるときにはそれとは異なる働きがある。昇華されたときには別の働きがあり、溶解されたときにはまた別の働きがある。それは自らと結婚し、自らを孕ませ、定められた日に産み、自らの毒によって……〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"

  "translation_ja": |-
    ここに高貴で豊かな女帝が生まれた。
    師たちは彼女を自分たちの娘と呼ぶ。
    彼女は増え、数えきれぬ子を生む。
    その子らは不死で清らか、いかなる汚れもない。

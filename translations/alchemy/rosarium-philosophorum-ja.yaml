  "source_text": "ignis et fumositates evaporent. Et ergo ex hoc concludo, quod omnis bona et perfecta medicina Alchimiae et elixir seu pulvis oportet quod sit in modum salis & sit sal, et habeat virtutem salis, et sit lentissimae fusionis et penetrationis, proiecta super corpora metallorum, fusa vel ignita. Et hoc Geber etiam monet, cum dicit: Oportet quod medicina sit velocioris fusionis quam Mercurius, ita quod citius fluat ante Mercurij fugam. Et quod ignis ipsum consumere nec destruere possit. Et tunc dicitur sal fusibile et oleum incombustibile, et sapo sapientum. Item, Nota, sal metallorum transmutat Mercurium in verum solem et lunam. Et sic sal animalium transmutat quodlibet animalium in veram temperantiam et optimam complexionem. Ignis fimi est causa agens in opere digestionis lapidis nostri, nec valet ignis balnei Mariae quivis etiam temperatissimus sit loco illius. Unde Alphidius dicit: Igne coquere quem tibi ostendam est se abscondere in equorum stercore humido, quod est sapientum ignis, humidus et obscurus, et est calidus in secundo et humidus in primo gradu. Cuius ignis proprietas est non destruere oleum, id est materiam, sed augmentat propter suam temperatam humiditatem. Solus enim ille calor est aequalis et temperatus, et talis est summe necessarius in generatione istius rei. Unde Geber dicit: Quia sunt fumi subtilissimi, & temperata indigent decoctione ut in"

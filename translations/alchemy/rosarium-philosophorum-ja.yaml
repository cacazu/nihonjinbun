    焼成され、水は昇華される。土は下にとどまり、水は上に昇る。土は焼成によって、水は昇華によって、両者は腐敗によって清められる。水は土が燃えるのを防ぎ、土は水を縛って逃がさない。両者が十分に清められると、一つとなり、それ以上分離できなくなる。一方は他方なしに存在できないからである。その一部を百部の水銀に投射すれば、真の銀へ染め変える。またそのようなティンクトゥラが赤へ転じれば、その一部は同じ部数を真の金へ染め変える。それよりよい金は見いだされない。これは、隠された本性と、火の熱によって獲得された本性による、云々。
    注意せよ。天と地が創られる前、主の霊は水の上を動いていた。『創世記』第一章。
    したがって、すべてが水から創られたことを見なければならない。神は語り、水の一部に乾いたものとなれと命じたとき、この水を分け、それを地と呼んだ。そして変えられなかった水は、地を潤し湿らせるために残した。乾いた土は、上から降る自らの雨水によってしばしば湿らされなければ、多くの実を結ばず、水なしではほとんど、あるいは決して実を結ばないからである。

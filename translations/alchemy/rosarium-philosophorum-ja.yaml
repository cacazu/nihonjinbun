  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Die Königin hasset den todt vnd armuth.
    Sie vbertriffet goldt silber eddel gesteyn /
    Alle Artzeneie / groß vnnd klein.
    Nichts ist auff erden ihr geleich /
    Des sagen wir danck Gott von Himmelreich.
    O gewalt zwingt mich nackendes weib /
    Dann vnsälig was mein erster leib.
    Vnnd noch nie mutter was ich worden /
    Biß ich zum andern mahl ward geboren.
    Da gewan ich aller wurtz vnnd kreutter krafft /
    Inn aller kranckheyt ward ich sighafft.
    Meines Sones nam ich da wahr /
    Vnnd kam mit jhm selbannder dar.
    Da ich seiner wardt schwanger /
    Vnnd gebäret vff ein vnfruchtbarn anger.
    Ich wardt Mutter / vnnd bleib doch Magt /
    Vnnd wardt in meinem wesen angelagt.
    Das mein Son mein Vatter wardt /
    Wie das Gott geschickt hat wesentlicher arth.
    Die Mutter die mich hat gebäret /
    Durch mich wardt sie geborn auff erdt.
    Eins zubetrachten / natürlichen verbunden /
    Das hat das gebirg meisterlich verschlunden.
    Dar auß kommen vier inn eyn /
    Inn vnserm meisterlichen stein.
    Vnnd Sechs / inn dreifalt bedacht /
    Vnnd in ein wesentlich arth gebracht.
    Wer das bedencken kann eben /
    Dem ist von Gott der gewalt gegeben.
    Das ehr alle kranckheyt thut verdreiben /
    An metallen / vnnd menschen leyben.
  "source_languages":
  - "de"
  "source_locations":

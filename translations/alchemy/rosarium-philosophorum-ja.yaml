  "translation_ja": "あらゆる物は、溶解して帰着するものからできている。氷は熱を仲立ちとして水へ変わるので、氷である前には水だったはずである。同じように、あらゆる金属は以前には水銀だった。それは、火の中で溶けると水銀へ変わることから明らかである。ここで注意せよ。哲学者は溶融した金属も、メルクリウスすなわち水銀と呼ぶ。したがって、この仕方で金属を水銀へ戻すことは、この溶融と呼ばれる。それは激しい火によってなされるが、その強い溶融において水銀の外観を保つので、水銀とも名付けられる。しかしこの溶解は哲学的ではなく、通俗的である。ゆえに、おまえに知られた個別の操作に関しては、ある意味で哲学の言葉に対応するのである。"
  "translation_status": "draft"
  "source_kind": "prose"

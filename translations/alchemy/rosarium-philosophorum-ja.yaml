    -nec masculus & foemina sint perfecte coniuncti, & unum recipit aliud, cuius signum est in superficie ingenio perfectae solutionis. Et licet azot appareat in prima mixtione seu coniunctione albus, pro eo quod foemina vincit suo colore. Nihilominus in putrefactione per ignis beneficium denigrantur ambo, per ignem augentem in humido calorem putrescit nigrum, quae est tinctura & ideo servanda est. Secretum magnum. Natura auri in aqua forti putrefacta, excellit omnes naturas. Ideo in compositione lapidis est notandum, quod nullus lapis excellit lapidem mineralem in virtute. Philosophus: Fac de masculo & foemina circulum rotundum, & de eo extrahe quadrangulum, & quadrangulo triangulum, fac circulum rotundum & habebis lapidem Philosophorum.
    Geber probat in libro examinum, quod si Sol et Luna in simul incorporentur cum arte, non separantur de facili. Et sic unum appetit reliquum, eo quod unum siccum sit & aliud humidum. Et postquam unum adeptum est aliud, adeo se forti nexu complectuntur, & se invicem continent quod unum ab altero de facili avelli non possit. Multo fortius hoc erit si alterum illorum sit spirituale, id est, medicinale et sic tingibile ratione suae spiritualitatis. Aurum est aurum actu, & ipsa materia,

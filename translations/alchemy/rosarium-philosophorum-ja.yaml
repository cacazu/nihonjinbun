    ここに、アデマルスと呼ばれる者の、ペルシア人の王ゲベルについての小書から、さらに注目すべき事柄を続ける。第四章で彼はいう。
    石が昇華によってどれほど清められ、油を取り出すことでその焼損性が除かれ、固定によって逃亡性が破壊されても、それでもなお融けず、浸入せず、混ざらず、ガラス化する。ゲベルの第十章の中ほどにあるとおりである。それどころか、鋭い水の中で溶解し焼成することを、幾度も行わなければならない。これはゲベルの第六十七章、第一章、第七章、第七十三章にある。同じ著者は第六章でいう。
    粉砕と穏やかな焙焼を伴う吸液を何度も繰り返すことで、その水性の大部分が取り去られる。これが第一段階の昇華であり、それによってメルクリウスの水的な部分が除かれる。その後、第二十八章に記されるアルデル器の底に、この実体全体を撒け。それから第三章の中ほどにいうように火を強め、その一部が最も白い雪にもまさる白さとなり、死んだもののようにアルデル器の縁へ付着するまで続けよ。これが……〔次頁へ〕

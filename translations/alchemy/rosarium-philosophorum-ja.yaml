  "source_text": "Avicenna in epistola ad Hasen: Elixir itaque tinctura sua tingit, & oleo suo submergitur & calce sua figitur, & album quidem completur tribus, in quibus non est ignis. Citrinum vero completur quatuor totis. Glosa: Verum est quod Elixir album non indiget nisi tribus, scilicet oleo, tinctura & calce. Sed rubeum quatuor, scilicet oleo, calce, tinctura, & iterum tinctura quae dicitur ignis. Et ideo subdit Avicenna, in quibus non est ignis."

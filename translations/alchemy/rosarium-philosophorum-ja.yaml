    「癒されることを望む。」同じ著者。「太陽のうちで磨り合わせることにより、身体と魂を結びつけなければならない。」
    同じ著者。「おまえたちの金を、白い葉状の土に蒔け。」セニオル。「上の煙は下の煙へ降り、煙は煙によって孕む。」同じ著者。「この神的な水は、天から降りる王である。」同じ著者。「それは魂を自らの身体へ戻すもの。その死ののちに身体を生かす。その者によって生命があり、その後にはもはや死はない。」
    ロシヌス。「魂が身体のうちに入るとき、身体は喜ぶ。」
    同じ著者。「身体は魂を捕らえ、魂を見いだす身体は、どれも容易にそれを捕らえる。そして知れ。魂は身体とともに苦しめられ、身体とともに閉じ込められ、身体によって身体へ変えられる。」ヘルメス。「霊そのものが魂の抽出者、還元者、仕事全体の再形成者であり、私たちの求めるすべてがそのうちにある。」セニオル。「見た目にこれより卑しいものはなく、本性においてこれより貴いものはない。神は、それを代価で買うものとはされなかった。」
    セニオル。「私たちの調製は、錠を開く仕掛けによって、自然から生じる。」
    ヘルメス。「自然のものも人工のものも、その始まりを知る知識を持たねばならない。始まりを知らない者は、終わりに至らないからである。」同じ著者。「この秘密はあらゆる物の生命であり、水である。」

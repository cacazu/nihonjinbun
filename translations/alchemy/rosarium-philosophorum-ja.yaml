  "source_text": "vivum habet in se corpus, spiritum & animam. Ibidem, talis est causa, coquite masculum & foeminam simul quousque coaguletur, & fiat lapis. Item Notandum quod nostrum elixir, non fit nisi ex mineralibus. Et amplius notifico quod draco non moritur nisi cum fratre & sorore sua interficiatur, Et non per unum tantum, sed per duo simul. Frater est sol, soror est luna. Ultimo ait Arnoldus, Quia philosophi dixerunt verum de lapide quicquid dixerunt. Quia de virtute sermonis loquebantur, indignis ad celandum. De virtute autem intentionis loquebantur dignis & semper verum, & philosophi sciunt quod talis materia debet tradi mistice, sicut poesis fabulose & parabolice. Et cum philosophi loquuntur de magnis rebus non admiscent parabolas, nec fabulas, Ut dicit Macrobius."

  "translation_ja": "そして再び、揮発性のものを固定せよ。この順序によって、世界のあらゆる学問の奥義にまさる最も貴い奥義、比類なき宝が完成する。汝は最大の根気をもって働き、長い、限りない熟考をもって、それへ向けて訓練せよ。それがあれば見出せるが、なければ見出せない。このような用心深い工夫で、薬の良き処理を反復することは、石の調製において可能であり、水銀を際限なく太陽を作るもの、真に月を作るものに変えるまで行える。それはただ、その増殖にのみかかっている。いまや、祝福され栄光ある高き自然の神を讃えよ。神は私たちに、あらゆる薬の系列を、その経験とともに明らかにしてくださった。私たちは良き探究と根気ある労働によってそれを求め、自らの奥義で探り当てたその完成を、眼で見て手で触れた。たとえ私たちがこれを覆い隠したとしても、学びの子は驚くな。汝に対して隠したのではなく、悪人と不正な者に対して隠したのである。愚者には必然的に隠れ、同時に賢者はその発見の探究へ誘われるような言葉で伝えた。それゆえ学びの子らよ、汝らだけのために保たれた、この最も優れた神の賜物を探せ。無知なる悪徳の子ら、限りない邪悪に満ちた悪意ある者どもよ、この知から逃げ去れ。それは汝らに敵対し、逆らい、汝らを……〔次頁へ〕"

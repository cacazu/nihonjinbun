  "translation_ja": |-
    その類におけるすべての塩より鋭い。鉱床であるからであり、それによって身体と霊が焼成され、エリクシルの溶解と凝固もなされる。ゲベル。「注意せよ。すべてをまず溶解しなければ、銀はまったく作れない。第二に、どのような溶解も、それ自身の血、または適合する血の中でなすべきである。すなわち竜の水と呼ばれるメルクリウスの水の中である。第三に、その竜の水は、ほかの何物も加えずにアランビックで作るべきである。それを作る際には、きわめて強い悪臭がする。第四に、その水によってアマルガム、辰砂の身体と霊、要するにそれ自身の本性に属するありとあらゆるものを溶かすことができる。第五に、その水は清浄でなければならない。それゆえ清められた竜からのみ作られるべきである。竜は三度上昇させ、そののち再び生かすことによって清められる。第六に、溶解したものは温かく湿った場所、すなわち馬糞の中で腐敗しなければならない。これから一つの黒さが生じる。第七に、湿りの中で太陽の乾きにより、すなわちマリアの浴で凝固させること。第八に、エリクシルが完成するには少なくとも一年かかる。しかしその期間は、人間の胎児が母胎内にいる期間であるべきだという見方もある。第九に、メルクリウスは、赤を目指すなら完全な赤い身体の匂い、白を目指すなら白い身体の匂いによってしか殺されない。そして身体は、自分の重さを保ったまま重さを与えることができる。
    私たちの仕事を完成させるものは四つある。

    illius est in illo venerabili lapide, ut omnibus est manifestum, ergo, &c. Item iste philosophus vult istam substantiam mercurij esse fixam ut patet, quia ingenia fixandi docet cum cautelis multis & ingenijs, sed quis dubitet substantiam istius lapidis preciosi esse fixissimam, certe nullus qui cognoscit eum, igitur, &c.
    Item philosophus vult suum lapidem figi, cum cautela ignis, ut eius humiditas conservetur, sed ubi temperantior calor quam in terrae visceribus, ergo &c. Item philosophus vult suum lapidem fundi ergo, patet ergo quod philosophorum magister lapis est, quasi diceret quod naturaliter etiam per se facit quod tenetur facere, & sic philosophus non est magister lapidis sed potius minister.
    Ergo qui quaerit per artem extra naturam per artificium inducere aliquid in rem quod in ea naturaliter non est, errat, et errorem suum deflebit.
    Sol principium pro opere rubeo, luna pro albo a suo sulphure comburente & combustibili purgata.
    Quod autem in ipso sit talis substantia, habes capite quadragesimo septimo. Quod autem luna sit lapis pro opere albo habet capite decimo octavo. Recipe ergo hunc lapidem preciosum, habentem spiritum, corpus et animam, & calcina cum suo humido vel cum mercurio ita quod non sit in eo tactus.

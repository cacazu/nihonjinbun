  "source_text": "-gentum vivum convertat in naturam solis, sicut fermentum totam pastam convertit in fermenti naturam non autem econverso quia semper dominatum transfertur ad dominans. Lapis noster apud omnes Philosophos nominatur Mercurius qui non est natus, ut multi putant, sed de corpore extractus. Lapis Philosophorum ex tribus, scilicet sole luna & Mercurio, id est, fac Mercurium ex sole & luna in suo esse sine Mercurio vulgi, sed per viam philosophicam. Nota: Hic lapis est unus in toto mundo, & qui ab hoc uno in principio operis erraverit in vanum laborat. In toto mundo non est alia res necessaria in opere nostro nisi iste lapis nobis solis filijs datus. Arnoldus: In nostro lapide sunt sol et luna in virtute et potentia ac etiam in natura. Si hoc esset non fieret inde sol neque luna, quia sol & luna in nostro lapide sunt meliores quam vulgaris in ipsorum natura, eo quod sol & luna in nostro lapide sunt vivi & vulgares, sunt mortui respectu solis & lunae in nostro lapide. Ideo philosophi nominaverunt ipsum lapidem solem & lunam invicem quia in ipso sunt potentialiter & non visibiliter sed in virtute & in essentia. Quare dicit Hermes: Quia lapis noster clamat, dicens, fili adiuva me & ego adiuvabo te."

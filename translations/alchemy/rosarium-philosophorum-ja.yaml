  "translation_ja": "ライムンドゥスはいう。今から、ティンクトゥラ、すなわちその中にティンクトゥラを運ぶ空気の固定を述べよう、など。それは焼成によって生じるが、その方法については今は措く。哲学者リリウスはいう。最後に、王冠を戴き、太陽のように輝き、紅玉のように明るい王が、おまえの前に現れる。外へは蝋のように流れ、火の中では耐え、水銀に浸透してそれを保持する。アルノルドゥスはいう。赤い色は熟成の完成から生じる。人の血も、まず肝臓で十分に煮られなければ生じない。同様に、朝、尿が白いのを見れば、睡眠が少なかったと知り、寝床へ戻る。眠りを取れば消化が完成し、尿は黄色くなる。このように、煮沸だけで白さは赤さへ至りうる。火をこのように持続させ、私たちの白い銅をよく煮れば、最もよく赤くなる。したがって乾いた火と乾いた焼成によって、辰砂のように赤くなるまで煮よ。それ以後、完全な赤に煮上がるまでは、水も他のものも決して加えてはならない。"

  "translation_ja": |-
    〔前頁から続く〕真に均一な薬ができる。それゆえこの結合は、霊的な形と本質へ変成・変質した微細な部分から生じる。粗大な物体と単純なもの、単純なものと粗大なものは、相反するために結合できず、粗大なものが自らの単純な霊を通じてその微細さへ変わる必要がある、と書かれている。そのとき両者はともに混ざりうる。哲学者たちはある真理の子にこれを説明して知らせ、完全な混合とは、混和できるよう変質した物体が、分けられない部分において互いに結びつく統一であるという。ここにそれが必要なのは、混合または統一は変質なしには成りえず、その変質が物体の微細化と霊的な形への還元だからである。これは明らかな理による。
    この部分について哲学者たちは、薬はすでに一つのあり方から別の水晶状のあり方へ完成したという。そのとき、その薄板が自然の微細な部分から組成され、自然の工夫によって、部分の分割なしに、少しずつ、また少しずつ均一に結ばれたことが明らかになる。そのようなことは微細化と本性の均質さなしには起こりえない。したがって、その質料は、水と混ざるすべての部分が本性において等しくなるほど微細にならなければならない。そして……〔次頁へ〕

  "origin": "source"
  "source_text": "Reymundus: Nunc dicam fixationem tincturae sive aeris qui portat in se tincturam &c. qui fit calcinatione, de quo modo supersedebo. Lilius philosophus: In fine exibit tibi rex suo diademate coronatus, fulgens ut sol, clarus ut carbunculus foris effluens ut cera perseverans in igne, penetrans & retinens argentum vivum. Arnoldus: Color namque rubedinis creatur ex complemento digestionis, quoniam sanguis non generatur in homine nisi prius diligenter coquatur in epate, sic nos cum videmus de mane nostram urinam albam, scimus nos parum dormivisse, redimus ad lectum somno autem recepto, completur digestio, et nostra citrinatur urina, sic per solam decoctionem potest albedo devenire ad rubedinem, ignem sic continuando, aes nostrum album si diligenter coquatur, optime rubificatur, igne ergo sicco, & calcinatione sicca decoquatur, donec rubeat ut cinobrium, cui de caetero nequaquam impones aquam neque aliam rem quousque ad complementum decoquatur rubeum."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"

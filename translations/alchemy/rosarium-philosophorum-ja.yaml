  "translation_ja": "他の病んだ物体の中にこの硫黄を求めても無益である。そこにはないからである。"
  "translation_status": "draft"
- "id": "ROS-105-T03"
  "section_id": "section-4"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quaeri non immerito potest, utrum ex alijs aegris corporibus hoc sulphur album & rubeum ad tingendum mercurium elici possit. Dico quod non, quia prius dictum est, quod non est aliqua res maioris temperantiae quam in istis duobus corporibus reperitur, quibus insunt radij tingentes, cum prius dictum est quod aegra corpora in se contineant sulphur foetidum et adustibile, & non virtualis naturae sicut in istis, &c. Cum omnis ars non valeat, nisi praehabita natura quam sequatur, posses tamen cum minoribus mineralibus purgare metalla, quibus purgatis, tamen adhuc non haberent auream & argenteam naturam in se, quia digestio & decoctio aurea non fuit in illis, sicut in alijs, nec sulphur ita maturum, & ideo ipsis immaturis succurrendum est cum maturis ut maturentur: Igitur non tingunt sed tinguntur, quia tinctura auri & argenti proportionabilem naturam habet cum ipsis, scilicet immaturis vel imperfectis, quia originem ex mercurio traxerunt: Ex his manifeste patet quod minora mineralia tingere"
  "source_languages":
  - "la"

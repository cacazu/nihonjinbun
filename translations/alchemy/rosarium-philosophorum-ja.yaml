  "translation_ja": |-
    「支配させるだろう。」アリストテレス。「おお、神が人間のうちに忠実な心を見いだしたもうなら、きっとその者に秘密を明かされるであろう。」
    『愚者の矯正者』。「いかなる術にも、滓を模倣し、その本性について、それがいかなる物の本性であるかを知ることが必要である。そのようにして術は自らの自然を模倣する。愚者よ、知れ。術によって自然そのものは見分けられるが、改めることはできない。自然を模倣しない者には、哲学者たちの秘密を完全な終わりへ到達させることは不可能だからである。」
    ヘルメスとゲベル。
    「この術を一度完成した者は、たとえ百万年生き、毎日四千人の人を養うとしても、欠乏しないであろう。」セニオルはこれを確証して言う。「エリクシルを作る石を持つ者は、このように富んでいる。火を持つ者が、自分に危険も不足もなく、望む相手に、望むときに、望むだけ火を与えられるのと同じである。」アリストテレス、『魂について』第二十。「最も自然で、最も完全な働きは、自分自身と同じようなものを生むことである。」

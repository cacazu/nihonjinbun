    alia nisi congelatae materiae resolutio, per quam seratura aperitur per ingressionem unius naturae in aliam.
    Unde Philosophi dixere, Solem nihil aliud esse, quam maturum argentum vivum. Nam in Mercurio sunt solum duo elementa actu, scilicet Terra & Aqua, quae sunt passiva. Elementa autem activa, ut Aer & Ignis sunt in ea in potentia solum. Sed quoniam ista in Mercurio mundo, deducuntur de pura potentia ad actum, secundum debitam digestionem, & proportionalem decoctionem tunc fit aurum. Quare in auro sunt quatuor elementa in aequali proportione actata. Et ideo ibi est sulfur maturum & activum, Ars autem nostra iuvat naturam, super administrando Mercurio: Aurum maturum, in quo (ut dictum est) est sulphur maturum & optime digestum, a natura autem per opus naturae.
    Arnoldus, Quicunque velit ad hanc scientiam pervenire, et non est Philosophus fatuus est, quia haec scientia non est, nisi de occultis Philosophorum.
    Senior, Ars enim illa in Dei potentia reservata, quae Laycis est inimica.
    Unde Geber, Non ergo haec scientia pauperi & egenti convenit.

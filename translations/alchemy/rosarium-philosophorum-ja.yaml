    toties illam repetit, quia in illa tota vis elixiris dependet &c. Etiam considera quod idem sunt ceratio, fixio, & sublimatio, & sunt idem actus, inceratione enim figitur spiritus & sublimatur corpus. Idem Arnoldus capite priori ait. Aqua vero septies distillata serva eam ad partem, quoniam ipsa est mercurius philosophorum solutivus, faciens matrimonium, & aqua vitae abluens latonem, & sic fecisti de alba aqua, ita facies de rubea, quoniam unum & eundem modum habent ablutionis, & consimilem effectum, nisi quod aqua alba est ad albificandum & aqua rubea ad rubificandum, non ergo misceas unam cum alia, quoniam errabis si secus feceris. Idem Arnoldus alio capitulo dicit.
    Si autem fundatur gravius quod est ex defectu cerationis, succurre ei cum oleo id est aere, guttando guttam ad guttam super ignem levem donec fundatur ut cera, quoniam quando inceras misces de re calida & humida magis quam de frigida & sicca, & quando figis, misces magis de re frigida et sicca quam de calida et humida, ergo intellige quae dico, quoniam huius operis perfectio est naturae permutatio. Ex supra dictis nota quod aqua, aer, & oleum idem sunt, id est spiritus mercurij mineralis, &c. Idem alio capitulo: Modi regiminis ad invicem convertentes sunt quatuor principales, scilicet solvere, abluere, reducere & figere.

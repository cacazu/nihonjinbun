  "translation_ja": "哲学の術という大いなる学について、最も確かな知識を得たいと願う者は、この小書をいっそう注意深く調べ、幾度も読み通すがよい。そうすれば、願いどおりのよい結果を得るだろう。古の哲学者たちの子らよ、これを聞け。私はできるかぎり声を高くして告げたい。人間にかかわる事柄の最も重要なあり方を、全世界のあらゆる秘密のうち最も秘められた宝を、あなたがたに明らかにしに来たのである。偽りとしてでも、嘲りとしてでもなく、きわめて確実に、心から親切に、それを公にしよう。それゆえ、私があなたがたに伝える教えの奥義にふさわしい熱意をもって、私の言葉に耳を傾けてほしい。すなわち私は、自分の目で見、自分の手で触れた事柄について、いまいっそう確かな証しをあなたがたに示すことができる。多くの虚偽に満ちた自慢屋たちよりも、さらに確信をもってそうできる。彼らはついに多大の費用を費やし、"
  "translation_status": "draft"
  "source_kind": "prose"

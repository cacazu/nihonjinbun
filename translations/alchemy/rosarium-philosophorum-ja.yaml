    Arisleus: Scias firmissime quod si parum aurum in compositione ponatur, exiet tinctura patens candida, per fermentum solis intelligitur sperma viri & per fermentum lunae sperma foeminae, ex illis fit primo coitus, postea fit generatio vera & casta, fermentum auri aurum est, sicut fermentum panis panis est: Rosarius: Sicut in operatione panis modicum fermenti levat & fermentat magnam copiam pastae, ita & illud modicum terrae quod continet iste lapis sufficit ad nutrimentum totius lapidis.

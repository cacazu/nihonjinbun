  "translation_ja": "哲学者たちは、私たちの石は霊、身体、魂からなると言った。それは真実である。彼らは不完全な身体を身体、発酵素を魂、水を霊と呼んだ。まことに適切である。不完全な身体はそれ自体では重く、弱く、死んだ身体だからである。水は霊であり、身体を清め、精妙にし、白くする。発酵素は魂であり、不完全な身体に、それまでなかった生命を与え、よりよい形へ導く。身体はウェヌスであり女、霊はメルクリウスであり男、魂は太陽と月である。身体は、それ自身の第一質料であるメルクリウスへ溶かされなければならない。モリエネスは言う。「私たちのメルクリウスは、通常の溶融で溶かされた身体からは得られない。夫婦が婚姻によって結びつけられ、一つになるまで続く溶融によってのみ得られる。それは白化に至るまでである。」モリエネスは言う。「粘液質と胆汁質のものを取り、それらとともに血質のものを磨れ。血質のものが、染める天となるまでそうせよ。」ヘルメス。「賢者の子らよ、理解せよ。この最も貴い石は叫んでいる。『私を守れ。私もあなたを守ろう。私の権利を私に与えよ。そうすればあなたを助けよう。私の太陽と私の最も内なる光線は、私のうちにある。月も私に固有のものであり、私の光はあらゆる光にまさり、私のよきものは、すべてのよきものより高い。喜び、楽しみ、富、歓楽を望む者たちに、私はそれらを豊かに与える。そして私が何を求めているかを彼らが認めれば、彼らに理解させ、神的な力を持たせる。』」"

  "translation_ja": "〔前頁から続く〕世の他の何ものも持たないからである。他のものはすべて臭く、持続する火の試験によってその本性が屈する。また、下位の鉱物、すなわち四つの霊、普通の硫黄、砒素、雄黄、サル・アルモニアクに取り組み、そこからティンクトゥラを完成しようとする錬金術者もいる。しかしそれはできない。ティンクトゥラの定義から明らかである。染めるとは、染められるものを自らの本性へ変え、その後は変化せず自らとともに留まらせることだからである。一つの本性が他の本性に、火に抗して戦うことを教える。染めるものと染められるものの本性は調和するからである。たとえば金または銀で鉛、錫、その他同類のものを染めれば、本性が調和する。両側がメルクリウスに由来するからである。成熟したものが未熟なものと結ばれ、その道で未熟なものを自らとともに完成させる。しかしこの四つの霊は、すでに十分述べたように、金属とは別の本性である。ゆえにそれらが染めるとすれば、変えるのか、変えられるのかを問う。変えられるなら、定義からしてティンクトゥラではない。変えるなら、染めることによって自分の本性、すなわち金属に異質な土の本性へ変える。したがって染めて金属を作ることはできない。染めることで自らの本性へ変えることは、生むものが皆自分に似たものを生むことによって証明される。しかし、この四つの霊の、生むティンクトゥラは土的なので……〔次頁へ〕"

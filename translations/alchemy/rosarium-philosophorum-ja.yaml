  "source_text": "evanescere, nec sulphur possit comburi nec devastari, quia argentum vivum nostrum est aqua clarissima nostra. Et videmus per exemplum in aqua comuni, quod omne quod cum ea coquitur nunquam comburitur donec ipsa aqua consumatur, quantumcunque etiam ipse ignis sit fortis. Et quando aqua consumpta est, hoc quod in vase est comburitur, & ideo philosophi iusserunt claudere os vasis, ut aqua benedicta nostra non exhalaret, sed defenderet a combustione, hoc quod in vase est: Aqua vero cum illis posita rebus, prohibuit ne ignis combureret, et factae sunt illae res, quanto magis flamma occupatur, tanto magis aqua in intimis absconditur, ne ignis calore laedatur, aqua vero in suo ventre eas recipit, & ignis flammam ab eis repellit. Iubeo autem omnes investigatores huius artis, in principio facere ignem levem, donec facta sit patientia inter aquam et ignem. Et postquam videris aquam fixam sine ascensione aliqua, non cures, qualis sit ignis, sed bonum est regere cum pacientia, donec spiritus et corpus unum fiant, ita quod corporea fiant incorporea, et incorporea corporea. Ergo aqua est illa res quae dealbat et rubere facit, Aqua est quae occidit et vivificat, Aqua est quae comburit et candidat, Aqua est, quae dissolvit & congelat, Aqua est quae putrescit & postea facit germinare novas & di-"

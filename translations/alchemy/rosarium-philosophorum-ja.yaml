  "source_text": "gens venenum generatur absque sole & eius umbra, id est uxore. Hermes in suis secretis, pater eius est sol, mater eius luna. Rosarius: Quicunque conatur aliam tincturam quaerere, absque sole & luna, ille assimilatur homini volenti scalam ascendere absque gradibus, oportet ergo ut habeamus receptaculum nostrum tincturae idoneum, quod est sibi consonans cum quadam similitudine ad patrem, & hoc receptaculum debet esse ipsa luna, quia sol per se est valde difficilis fusionis, & liquefactionis similiter & luna per se, dum autem simul coniunguntur, tunc valde faciliter simul fluunt & liquefiunt, & ideo aurifabri sic faciunt eorum consolidaturas. Philosophus: mulier est quoddam receptaculum virili seminis, quia ipsa conservat semen in suis cellulis & matrice, & ibi nutritur, & pullulat usque ad tempus maturitatis, ideo eligamus sibi nunc coniugem, ut receptivum sui seminis habeat, quam possumus sic eligere in uxorem, quae propinquior est sibi in simplicitate & puritate, quia nihil propinquius viro quam uxor, quae sunt homogenea. Hermes in allegorijs: Luna est lucerna noctis, nox est nativitas tenebrarum, quam deus creavit pro mundo regendo, luna autem a sole lumen recipit & est dilecta eo, quod solis lumen in ea est. ideo quod solis natura lunae naturam superat. Mercurius noster fit ex minerali & vegetabili"

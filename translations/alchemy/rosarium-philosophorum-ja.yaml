  "source_text": "Sed & tertio lapis administratur gradu, qui in ultimo consistit praeparationis complemento & est scilicet ut iam fixum lapidem cum modis sublimationis volatilem facias, & cum spiritibus non fixis sublima. Fixum sublimari, nihil aliud est quam corpus in spiritum converti, quod secretum ex dictis philosophi sic extrahitur, in capitulo namque trigesimo septimo habetur, quod corpori id est substantiae fixae, quaecunque sit illa, non commiscetur spiritus nisi prius cum magisterio, id est lapis prius solvatur et coaguletur, sed quaeris, quomodo lapis solvatur, dicendum quod cum aquis acutis ponticitatem habentibus, et acredinem sine fecibus existentibus, ut est acetum vini, &c. Si autem quaeras cur lapis solvatur, dicendum ut habetur capite trigesimo septimo, quod omne quod solvitur, acquirit naturam salium & aluminum, quia soli sales prius funduntur quam vitrificantur, & similiter secundum suam naturam, ipsi soli scilicet sales solvuntur, si ergo lapis noster solvitur, salium naturam acquiret. Sed quod funditur ingreditur, et quicquid ingreditur transmutat, &c. Capite quinquagesimo septimo habetur, quod corpora sublimantur, per excellentissimum ignis gradum, quousque fixum cum non fixo levetur totaliter, ut capite duodecimo, quod si totum non fuerit sublimatum addatur illi non fixae partis quantitas iterato, quousque ad totalem elevationem sufficiat"

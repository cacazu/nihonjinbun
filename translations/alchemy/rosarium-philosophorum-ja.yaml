    Unde Hali dicit: Accipe quod ad fundum vasis descendit, & ablue istud cum igne calido, quousque auferatur eius nigredo & recedat eius spissitudo, & fac ab eo evolare additiones humiditatum, donec deveniat calx nimis alba, in qua non erit macula. Tunc enim terra ad recipiendam animam est habilis & parata.
    Unde dicit Merculinus: Firmans mutatum praegnatio, spondet hiatum.
    Versus. Quae bene praegnantur, concordi pace ligantur.
    Unde dicit Morienes: Haec terra cum aqua sua putrefit & mundificatur, quae cum mundata fuerit, auxilio dei totum magisterium dirigetur. Hermes quoque ait: Azoth & ignis latonem abluunt & nigredinem ab eo auferunt.
    Ideo dicit Philosophus: Dealbate latonem, & libros rumpite, ne corda vestra rumpantur. Haec est enim compositio omnium Sapientum, & etiam tertia pars totius operis. Iungite ergo ut dicitur in turba, siccum humido, id est terram nigram cum aqua sua, & coquite donec dealbetur. Sic habes aquam & terram per se, & terram cum aqua dealbatam, illa albedo dicitur aër.
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"

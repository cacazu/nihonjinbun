  "source_text": |-
    per rubeum citrinum, ut videatur aurum, & album tingere albo, donec sit multum simile argento, possunt quoque plumbi immunditiam abstergere, vel aliorum corporum aegrorum ut videantur aurum & argentum, verumtamen plumbum manet semper plumbum, quia in se non habet qualitates digestas auri & argenti, ut dictum est supra, ut hij qui accipiunt salem armoniacum, vel alia minora mineralia ad illudendum homines, & coniungunt cuprum vel stannum cum mercurio, ut appareat hominibus argentum, & aliquo modo fabricabile & in igne examinabile secundum eos qui in igne experti sunt, qui tamen in hoc illuduntur, quia veram naturam argenteam in se non habet sicut apparet in colore & examinatione.
    Prima ratio est: Cuprum continet in se mercurium aliqualiter mundum, nisi in quantum ex sulphure existit de foris, sed sulphur foetidum & adustibile quod ipsum comburit, & rubedinem non bene digestam habet, sed ratione sulphuris rubei & immundi, cum mercurius praehabet substantiam prae sulphure, & ideo tardius deficit in igne quam plumbum vel stannum, quia mercurius resistit, nisi quantum violentiam patitur a sulphure sibi commixto, sed quod plumbum citius comburitur hoc est ratione mercurij infecti, quia infectus mercurius cum infecto sulphure sicut plumbum est,
  "source_languages":

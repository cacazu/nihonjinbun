  "kind": "paragraph"
  "origin": "source"
  "source_text": "fusione a vitrificatione conservet, de natura enim spirituum & corporum est non vitrificari, & a vitrificatione commixtum salvare, donec in eo fuerint spiritus, ergo qui magis naturam servat spiritus, magis a vitrificatione defendit, magis autem servavit spiritus solummodo purificatus, quam purificatus, fixus, calcinatus atque solutus, ideo necesse est illi admisceri, resultat enim in his bona fusio, & ingressio & fixio stans, ex operibus ergo naturae probare possumus sola salium & aluminum & similium naturam servantia solubilia esse, non enim in operibus illius omnibus considerantes invenimus alia solvi praeter illa, igitur quaecunque solvuntur necesse est per illorum naturam solvi per reiterationem calcinationis & solutionis, ideoque probamus per illud, omnia calcinata ad salium vel aluminum naturam approximare, ideo sese in proprietatibus necesse est concomitari. Modus vero solutionis duplex est, scilicet per fimum calidum & per ferventem aquam, quorum est una intentio & unus effectus. Modus ergo per fimum est, ut ponatur calcinatum in ampullam vitream, & super illud fundatur quantitas aceti distillati vel consimilis dupli eius, & obstruetur caput suum ne respiret & sub fimo tepido triduo dimittatur, & postea per distillationem philtri solutum removeatur, non solutum vero iterato calcinetur, & post"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 136
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720945"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720945"
  "translation_ja": "〔前頁から続く〕ガラス化から守る。霊と物体の本性はガラス化しないことであり、その中に霊がいるかぎり、混合物をガラス化から守ることだからである。ゆえに霊の本性をより多く保つものほど、ガラス化からよく守る。ただ精製されただけの霊は、精製され、固定され、焼成され、溶解されたものより、その本性を多く保つ。したがって前者を混ぜなければならない。そこにはよい融解、浸入、永続する固定が生じる。自然の働きから、塩、明礬、それらに似たものの本性を保つものだけが溶解しうると証明できる。自然のすべての働きを考察しても、それら以外に溶けるものを見出さないからである。したがって溶けるものは何であれ、焼成と溶解の反復によって、それらの本性を通じて溶けるのでなければならない。これにより、すべての焼成物が塩や明礬の本性に近づくと証明されるので、その性質も互いに伴わなければならない。溶解の方法は二つ、温かい糞によるものと、沸騰する水によるもので、意図も効果も一つである。糞による方法では、焼成物をガラス瓶に入れ、その二倍の量の蒸留酢または類似物を注ぎ、気が漏れぬよう口を塞ぎ、ぬるい糞の下に三日置く。その後、濾過の滴下によって溶けたものを取り除き、溶けないものを再び焼成し、その焼成の後……〔次頁へ〕"

  "translation_ja": "第七はティンクトゥラであり、輝かしく完全な色、白と濃い黄を与え、変成可能な物を月化し、太陽化する。第七段階として、固定ののちには、染める最後の色、すなわちティンクトゥラが必要だからである。それは変換可能な質料を染め、真の金または銀とし、それぞれの確かで既知の相違をすべて備えさせる。哲学者カリディウスは私たちの水について述べる。「それはあらゆるものを焼き、砕くゆえに火である。水銀は酢である。」そこでソクラテスは『集会』で述べる。「第一の力は酢、すなわち水銀である。」また『集会』。「身体を酢なしで火の上に置けば焼ける。」すなわち水銀なしで置けば、ということである。『集会』は言う。「身体を純粋にするのは最も鋭い酢である。それなしにはいかなる色も現れない。」"

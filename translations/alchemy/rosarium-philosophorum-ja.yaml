    Hermes Tractatu tertio: Venite filij sapientum ex nunc gaudebimus, & delectemur simul, quia mors consumpta est, & filius noster iam regnat: ac rubeo armamento & carne indutus est. Iam filius noster genitus rex sumit tincturam ab igne, illum vero mors mare & tenebrae fugiunt, & solis radios Draco fugit, qui foramina observabat, filiusque noster mortuus vivit, & rex ab igne venit, ac coniugio gaudebit, & occulta apparebunt, filiusque noster iam vivificatus fit igne bellator et tincturis supereminens.
    Metaphora Belini Philosophi de Sole: Scito te quod Pater meus Sol dedit mihi potestatem super omnem potentiam, & induit me vestimento gloriae, & totus mundus me quaerit, & currit post me. Ego enim sum maximus, iam sciverunt virtutem meam & altitudinem, ego enim unicus sum, & assimilor patri meo, qui unicus est, qui dedit mihi virtutem istam ex gracia sua, & homines quaerunt a servis meis fustibus id quod quaeritur a me & non pervenerunt ad id nisi per me, & terra cum omnibus viribus suis me humiliare non potest, imo ego sum super eam, & super servos meos, donec humiliem eos, & extraho de potentia & natura eorum, & induo eos de splendore & lumine meo pulchro, quem dedit mihi pater meus, in omnibus operibus eorum. Ego enim sum excellens,

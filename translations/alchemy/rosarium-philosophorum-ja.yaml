  "source_text": |-
    Deinde cum his quae sunt solutiva solvendum, haec enim aqua lapis noster est et argentum vivum de argento vivo, et sulphur de sulphure ex corpore spirituali extractum & subtiliatum sive attenuatum, quae meliorari potest confortando in ipsum virtutes elementales, cum alijs praeparatis, quae fiunt ex genere sui generis, & augmentando colorem, fixionem, pondus, puritatem, fusionem, & alia, & omnia quae pertinent ad elixir perfectum, & iste est modus, per solos nos investigatus praeparationis, depurationis, subtiliationis, & meliorationis corporum mineralium in generali.
    Multiplicatio elixir fit duobus modis, una per reiterariam solutionem & coagulationem lapidis secunda per proiectionem primi lapidis elixir super corpus, aut album aut rubeum tali quantitate quod idem corpus, etiam convertetur in medicinam, & tunc simul imponentur haec ad solvendum in sua aqua & menstruo, & sic elixir primum est fermentum talis tincturae et sic mulieres pistrices faciunt.
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"

  "source_text": |-
    Oportet te ut in primo negocio dissoluas corpora super cinerem candidum, & non fiat tritura nisi cum aqua. Avicenna: Primum quoque in opere est dissolvere lapidem in suam primam materiam. Senior & Hermes: Solvite corpora in aquas. Plato in summa: Tu indiges quod in corporum solutione labores, ideo oportet ignem lentum continuare super ipsum donec solvatur totum hoc, et per eum efficitur opus. Nota, omnium rerum circularium reversio circularia nequaquam perficitur, donec in primam deducantur materiam. Rasis: nisi corpora solveritis in vanum laboratis. Albertus magnus: Scias pro certo, quod nullus corporum spiritus tingi potest nisi prius solvatur.
    Morienes: Nisi in vaporem cuncta transeant naturalia per suam naturam, alias frustra fit operatio in hac arte: et si solutum fuerit, praeparatum est opus alchimicum, multiplicetur, congaudebit.
    Hic subalterantur scientiae naturales quod in solutione consistit pariter operando. Sorin. Distinctione undecima: Regiminis initium est perfecta solutio, ut autem corpus rarescat & sicut spiritus tenuissimum fiat, oportet eos dissolvere, corporis autem regimen ut praedixi est solutum.
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 183
  - "source_id": "source-1"

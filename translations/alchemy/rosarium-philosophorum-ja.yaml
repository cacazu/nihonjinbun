  "translation_ja": "〔前頁から続く〕貧窮の悲惨に陥れるであろう。この神の賜物は、神の摂理の裁きによって、汝らには完全に隠され、まったく拒まれているからである。以上はゲベル。同じ著者は第一書第二十六章でいう。私たちの学派に属し術を模倣した古人の考えに従って示すなら、自然の働きにおける主要な自然的原理は、臭い霊、すなわち硫黄と、生きた水である。この水を乾いた水と名づけることも認める。臭い霊は区分した。それは隠れた状態では白く、この作業の奥義においては赤と黒の双方であるが、現れた状態では双方とも赤に向かう。同じ著者は第二書第三十九章でいう。完成を助けるものを考察するとは、細工なしに物体へ付着し変化を起こすのが見られるものの本性を考察することである。たとえばマルゲシタ、マグネシア、トゥティア、アンチモン、ラピスラズリである。また、付着せずに物体を清めるもの、すなわち塩、明礬、硝、ホウ砂、およびそれと同じ本性を持つものを考察することであり、類似の本性によって浄化するガラス化を考察することである。"

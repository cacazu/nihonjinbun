  "translation_ja": "ある術の中で働く、より劣ったものはみな、その自然な悪さによって、より優れたものを破壊しようとする。また、ある術の中で働く、より優れたものはみな、劣ったものを完成しようとする。それゆえ、まず諸物の本性を知るべきである。何が本性にとってよりよく、より悪いか、何によって完成され、何によって妨げられるかを見分けられるようにするためである。また劣ったものの量が優れたものの量を超えないようにせよ。そうでなければ、甚だしく誤るだろう。"

  "source_text": "Omne peius laborans in aliqua arte, de sua naturali malitia nititur melius destruere, Et omne melius laborans in aliqua arte, conatur peius perficere, ergo inprimis tibi sciendum erit naturas rerum, ut scias discernere quid sit melius aut peius naturae & unde perficiatur & unde prohibeatur, & quod quantitas peioris non excedat quantitatem melioris, alioquin maxime errabis."

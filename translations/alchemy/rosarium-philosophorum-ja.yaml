  "source_text": "aqua suscipit nutrimentum hominum & aliorum & in aqua est maximum secretum. Sed ut minus erres scire te convenit, quod nostrum sublimare nihil aliud est quam corpora exaltare, id est in spiritum ducere, quod non fit nisi igne leni. Sic enim dicimus, ille sublimatus est in Episcopum, id est, exaltatus. Et ideo vulgaris sublimatio, quae tantum est signum effectus, scilicet, quod iam corpus sublimandum, sit ita spirituale factum, quod possit sublimari. Nihil confert operi nostro, nec ultra requiritur post praeparationem primi lapidis, quia talis sublimatio non spiritualizat, sed tantum effectum spiritualitatis ostendit. Ideo bene dicit ille Regalis Philosophus Geber: Quia in opere magisterij nostri non egemus nisi unico vase, uno fornace, unaque dispositione, quod intellige post praeparationem primi lapidis. Genesis. Ex aqua omnia facta sunt, & super aquam ferebatur spiritus dei, & principium generationis hominis ex ea. Hermes, O natura fortis, naturas vincens, & superans, suasque naturas gaudere faciens. Geber. Expedit huius artis principia et radices principales, quae sunt de esse operis non ignorare. Basius: Sulphur nostrum fortius est omni igne. Alanus Philosophus. Una res ex omnibus est eligenda, quae est lividi coloris, habens speciem metallicam limpideam & liquidam,"

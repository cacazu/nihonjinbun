    quod si spiritualicetur, factum est ex actu potentia, & ex materia forma, & ex acto agens, & ex foemina vir, & ex re nata res naturans. Ergo cum nulla sit materia auri nullum aurum quod non fuerit prius argentum ut dicit Philosophus: Si ergo talis forma coniungatur suae materiae, id est lunae, certe avidissime se amplectentur, & perfectum maius perficit perfectum minus, & hoc naturaliter & amicabiliter, quia omnis natura perfici appetit & destrui abhorret naturaliter.
    Sciendum quod secundum Avicennam in epistola ad Hasen de re tecta. Intentio operantium in hac arte, imo potius intentio ipsius artis, secundum possibilitatem naturae rerum, est materiam unius induere formam et naturam alterius. Verbi gratia. Cuprum induere formam et naturam argenti vel plumbum auri, & sic de caeteris similiter. Cum enim forma sit natura rei uniuscuiusque ut habetur secundo Phisicorum. Spoliata aliqua re a forma sua & alia superinducta eidem, procul dubio & natura ipsius transmutata est a sua specie. Dicimus itaque quod nomen alkimia in graeco sonat transmutatio. Et inde alkimiam dicimus scientiam esse transmutationis rerum a suis formis & speciebus secundum quod formae rerum divisae sunt.

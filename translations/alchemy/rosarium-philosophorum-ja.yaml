  "translation_ja": "なければ、白の錬金術の金もなかったであろう。」『ロサリウス』。「これが私たちの最も高貴なメルクリウスであり、神は理性的魂を除けば、天の下にこれより高貴な物を創造しなかった。」プラトン。「これが私たちの質料であり、私たちの秘密である。」オルトラヌス。「このようにして、前述の二つの身体から取り出された真のメルクリウスを得る。それはよく洗われ、熟成されている。神に誓う。普遍の道には、すでに明らかにしたもののほかにメルクリウスはない。哲学の全体はそのうちに懸かっている。異なることを言う者は、偽りを言っている。」『集会』のパルメニデス。「哲学者が水と言うのを聞いて、雲の水だと思う者がいる。決してそうではない。理性があるなら、永続する水であると知るはずである。この水は、ともに溶解された自らの身体なしには、永続する水ではありえない。」アルフィディウス。「哲学者たちはこの薬をあらゆる名前で呼ぶ。このメルクリウスには非常に多くの名が付いているので、新しい仕方で名称を付けることは、ほとんど、あるいはまったくできないほどである。」哲学者プラトンは言う。「私たちは、誰にも明かすことが許されない術の秘密を除き、すべてを明らかにした。その秘密は栄光ある神に委ねる。神は望む者にそれを吹き込み、望む者から取り去る。」王ソロモン。「これが、そのために南の女王が東方から来たと語られる娘である。曙のように立ち上がり、ソロモンの知恵を聞き、理解し、見るためである。彼女の手には、権力、栄誉、徳、そして」"

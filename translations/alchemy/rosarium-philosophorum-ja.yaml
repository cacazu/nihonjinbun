    「完全なものから、不完全でよりよいものを作るとは、滑稽なことである。」
    哲学者ボネルルス。「私が先に述べた銅は、普通の銅でも錫でもなく、私たちの真の仕事である。それはマグネシアの身体に混ぜられ、生命の水とともに煮られ、磨られて、崩されなければならないからである。この術の子らよ、あなたがたは多くの水を持たなければならない。そして絶えず、少しずつ水を加え、土の大部分が溶けるまで続けなければならない。」アウィケンナ。「器の中で霊的となるものは上へ昇る。濃く粗いものは器の下方に残る。そして水がそれと混ざろうとせず、また土に受け入れられなくなるまで、身体をそのように黒くし、破壊しなければ、何も得られない。霊的な粉となるとき、それは器の下方にとどまるからである。ゆえに、すべてを霊的な粉へ変えなければ、まだ磨り終えたとはいえない。白い身体に行うことは赤い身体にも行え。この薬は本質において一つであり、作用の仕方においても同じく一つだからである。」

  "translation_ja": "アリストテレス、『魂について』第二巻。「最も自然で、最も完全な働きは、自分と同じようなものを生むことである。植物が植物を、山羊が山羊を生むように。」同じ著者。「錬金術の仕事は、現れる本性を誤りなく知るのでなければ、そこに何の進歩ももたらさない。」ヘルメス。「おお水よ、永続する形よ、王たる元素を生むものよ。おお最大の自然、諸本性を生むものよ。あなたは自然を含み、ほどよく自然にまさる。それは光とともに来たり、光とともに生まれたのである。」"

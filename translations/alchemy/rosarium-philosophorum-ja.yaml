  "translation_ja": "〔前頁から続く〕一つに由来し、その根である一つとともにあるからである。それゆえ哲学者たちの銅は彼らのエリクシルであり、霊・身体・魂から整えられ完成したものである。このように哲学者たちは、賢者には明らかで、愚者には隠されているように、石をさまざまな名で呼んだ。しかし何という名で呼ばれても、それは常に同じ一つのもので、同じものから生じる。そこでメルクリヌスはいう。"

  "translation_ja": |-
    ヘルメス、『諸論考』第四書。
    「この術と秘められた叡智への導入を望む者は、傲慢という悪徳を自分から退け、敬虔で誠実であり、深い理性を持ち、人に対して親切で、穏やかな顔つきの快活な者でなければならない。丁重に挨拶し、自らに明かされた恒久的な秘密を守る者でなければならない。息子よ、何より先に私は、神を畏れよとおまえに勧める。神のうちにこそ、おまえのあり方を見通す眼と、隔てられたあらゆる者への助けがある。」
    ゲベル、『完全な奥義』の書。
    「この学の技術者は、きわめて鋭敏な才知を持たなければならない。この術へ達する前に、金属の本性、その生成、鉱床における病と不完全さを知り、認識していなければならない。鈍く硬い知性で満ちた技術者は、その探究へ近づくべきではない。費用や支出について欲深く、吝嗇であってもならない。また二心のある者、胆力と気骨を欠く者、心変わりする者、過度にせっかちな者や頑固な者でもあってはならない。学びの子であれ。最も鋭敏な知性で飾られ、十分な富を持ち、気前よく、健全で、目的を堅く保って変わらず、忍耐強く、温和で、気長で、節度ある者であれ。」アルフィディウス。「息子よ、知れ。おまえの心を神に向けて清め、おまえが確固として正しい心を持つと神が知りたもうまでは、この学を持つことはできない。そのとき神は、おまえに世界を」

  "source_text": |-
    sicut puer cui datur in principio lac. Nam puer ex calido & humido nutritur & augmentatur, sic & ignis equi augmentat oleum sua humiditate, figit autem lapidem suo calore temperando. Est inter hos duos & alius, qui est calidus & siccus in secundo gradu, ut ignis furni, post panis extractionem, hic fundit leniter, & non comburit, quia non est in eo flamma, nec fortitudo caloris. Calor enim paulatim declinando recedit, sed si staret, spiritum figeret in corpore vel extra corpus. Ignis autem equi nec fundit nec comburit, sed domat, et humidum augmentat. Est & quartus furni fixionis ignis, hic fundit & figit, non autem comburit, quia flammalis non est, nec differt a praecedenti, nisi quod in hoc est calor continuus, in illo non.
    Quintus dicitur flammalis, & est calidus & siccus in tertio gradu, hic calcinat tantum, & non fundit, scilicet ad comparationem auri & argenti & aliorum corporum in eodem gradu vel ultra, et est hic ignis in furno calcinationis.
    Sextus est calidus & siccus in quarto gradu, & hic fundit & figit fortiter, mollificando corpora suaviter, nec dissipat ea vel dispergit. Hic est ignis furni fusionis in eodem gradu.
    Est & ignis follium qui corpora dissipat & dispergit & fundit, & hic est septimus.
  "source_languages":
  - "la"
  "source_locations":

  "translation_ja": "〔前頁から続く〕他の者のためではない。しかしその術は真実であり、まったく確実である。ゆえに私たちは、術に賢く近づく者にだけ、伝えられた工夫を通じて探究の道を説明した。発見された術そのものは私たち自身のためにしか書かなかったが、発見の方法とその方法の工夫をも書いた。したがって善い心を持つ術者は、私たちの伝えたことによって訓練せよ。そうすれば至高の神の賜物を見出したことを喜ぶであろう。高貴な術を探究するためには、以上の言葉で十分であろう。ここまでゲベルの言葉である。ゲベルは『大全』第十六章、自然の原理について、次のようにいう。石が浄化され、腐敗させるあらゆるものから完全に清められ、その後で発酵させられたなら、もはや器を替える必要も、開く必要もない。神がそれを守って割れないようにしてくださることだけが必要である。それゆえ哲学者たちは、奥義全体が一つの器の中で作り上げられると言った。そして石の真の浄化の後、白への作業は四十日四十夜で完成すると知らねばならない。浄化については、術者がどれほどよく作業するかによるほか、一定の期間を定められない。赤への作業は九十日九十夜で完成する。これらが完全な完成に至る真の期限である。これは浄化の後に行われる凝結について理解せよ。その浄化は腐敗と、身体を……〔次頁へ〕"

  "source_text": "quod vero remanet inferius est cinis cinerum, & cinis inferior vituperatus, damnatus, fex et scoria, fac ergo differentiam inter clarum & limpidum eius, quoniam cum albissimum ut nix ascenderit completum erit, colliges ergo eum caute ne evolet in fumum, quoniam ipsum est quaesitum bonum, terra alba foliata, congelans congelandum, & mundificans arsenicum, & sulphur album, de quo Aristoteles dicit quod est res optima, quam recipere possunt alchimistae ut de ea faciant argentum. Nullus debet sublimare terram, ad opera sophysticorum, sed debet sublimare ad elixir nostrum perfectum, & illa quae sublimantur, duobus modis sublimantur, aut per se quia spiritus sunt, aut cum alijs quia se incorporant cum spiritibus, mercurius enim cum sit spiritus, sublimatur per se, terra vero nostra cum sit calx non sublimatur nisi quia se incorporat cum mercurio, converte ergo calcem & imbibe mercurium & decoque donec fiat corpus unum, & non tedeat te hoc ipsum multoties iterare, quia corpus nisi cum mercurio sit incorporatum, non ascendet sursum, ideo necesse est ut in quantum poteris naturam suam subtilies & cum mercurio fortiter pistes, quousque fiat unum, quia sublimationem non facimus nisi ut reducantur corpora ad subtilem materiam, scilicet ut sint spiritus, & quod corpus sit leve ad regendum"

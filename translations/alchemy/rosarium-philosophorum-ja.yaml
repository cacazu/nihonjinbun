    〔前頁から続く〕これが私たちの昇華であり、それによって土的な汚れと硫黄の部分は滓とともに底に残る。その中でその本性は清められる。その後、固定の方法によって固定され、すなわち発酵させられなければならない。固定しているもの、すなわち発酵素が固定するからである。それから糞のところに置く。続いて「火の苛烈さのうちに安らぐまで」とある。これは調製の、すなわち昇華の第二段階と呼ばれる。第三十九章にあるとおり、メルクリウスが現に極めて微細な実体を持つのなら、どうしてさらに微細化できるのかと問うなら、次のように答える。第七十三章には、昇華または微細化の方法、すなわち第一段階の昇華によって清め、微細化するとある。したがって最後には揮発性にする。すなわち灼熱を伴って昇華し、滓から器の縁へ、水晶よりも輝いて上昇させるのである。
    ゲベルはいう。ラトン、すなわち土を白くせよ。汝らの心が破れぬよう、本をしまえ。また別の箇所で、火と水はラトンを洗い、その黒さを拭い去るという。続いて、昇華したものをアルデル器に取り、一度反復せよ、すなわち昇華によって固定せよ、とある。第六十二章の中ほどには「最も輝くもの以上に」とあり、また火の扱いに注意して、その湿りを、完全な融解を成し遂げるのに十分な程度だけ取り去るようにとある。同じ箇所でいうように、緩やかな火は……〔次頁へ〕

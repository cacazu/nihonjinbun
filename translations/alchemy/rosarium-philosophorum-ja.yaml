  "translation_ja": "しかし両側の本性が閉じられているため、試験では各々が他から分離する。その中には、溶解によって完成へ近づけるような、隠れた完全な本性がないからである。むしろ常に、術を介して他の完全な物体が、自然に完全なその本性によって助ける必要がある。第二に、溶かさずに完全な物体へ加えるなら、金銀を作ることはいっそう難しい。凝結によって両側の本性が自然に閉じられているからである。その本性を開いて一方の力を他方へ送り込む媒介がなければ、両者は自然な結合で結ばれず、双方の起源であるメルクリウスへ戻れない。それゆえ、明らかに見られるように、不完全な本性の燃焼によって、火の激しさのうちに互いから分かれる。結合しようとするなら、閉じた本性を溶かし開くメルクリウスによって、メルクリウスを作れ。そうすれば一つは単純に他へ移り、完全なものが不完全なものへ力を送り、それを自らとともに完成させられる。これが個別的な道の労働であり、このように個別的に金銀は作られる。注意せよ。未熟なメルクリウスは物体を溶解し、その第一質料または本性へ戻すが、物体のメルクリウスにはそれができない。この働きは、それが最初の……〔次頁へ〕"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "ROS-125-T01"

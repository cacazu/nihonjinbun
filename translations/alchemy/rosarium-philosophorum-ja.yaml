  "source_text": "-sas & labores, nullum sibi nisi miserabilem inveniunt effectum. Clare ergo vobis loquor & aperte, quatenus tam periti quam etiam imperiti valeant ex hoc magisterio, secretum intelligere. Nec merito poterit me quisquam blasphemijs afficere: Nam cum antiqui Philosophi tam obscure quam et confuse scripserunt, ita ut nedum intelligantur, sed nec convenire videantur, quatenus praeciosissimam artem hanc inquirentes, aut fallerent, aut a proposito deterrerent. Ego quidem remota omni fallatia & obscuritate, vobis plane experimentum omne ante oculos apponam verissimum, simul & cum Philosophorum sententijs, ad propositum adductis ipsum quam optime facientibus, quatenus res de qua agitur, eo apertior fiat & clarius intelligatur. Unde primo notum facimus, omnes extra naturam operantes, deceptores esse, & in re non debita laborare. Porro ex homine non nascitur nisi homo, et ex bruto non nisi brutum, et omne simile profert non nisi suum simile. Quapropter qui de proprio non habet de alieno ad libitum suum habere non potest. Hoc autem dicimus, ut nemo amittat suam pecuniam. Nam cum quidam decepti sint ingenij sui tarditate, & ad inopiam deducti, alios tentant etiam seducere, et ad miseriam compellere. Consulo autem ut ne-"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 4
  - "source_id": "source-1"

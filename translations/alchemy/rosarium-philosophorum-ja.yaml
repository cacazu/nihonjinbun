  "translation_ja": "石は三つ、塩も三つある。それらから奥義の全体が成り立つ。すなわち鉱物的、植物的、動物的なものである。また水も三つあり、太陽の水、月の水、メルクリウスの水である。メルクリウスは鉱物、月は植物である。月は白さと赤さの二色を自らのうちに受け入れるからである。太陽は動物的である。締まり、白さ、赤さという三つを受け入れ、大いなる動物と呼ばれる。そしてそれから塩化アンモニウムができる。月は植物と呼ばれ、それからアルカリ塩ができる。メルクリウスは鉱物の石と呼ばれ、それから普通の塩ができる。また、哲学者たちは、この術の物が溶解するのを見ると、それを塩化アンモニウムと呼んだ。腐敗したときには、「私たちの石は卑しく、糞山に見つかる」と言った。多くの者が掘り、糞の中で作業したが、何も見つけなかった。それが水へ変わったときには、富者も貧者も持ち、あらゆる場所、いかなる時にも、あらゆる物のもとに見つかる。ただし探索は探す者を苦しめる。それが白くなると、彼らはそれを砒素と呼び、あらゆる白い物の名で呼び、処女の乳とも呼んだ。そして、"

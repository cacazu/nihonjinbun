  "translation_ja": |-
    初めに乳を与えられる幼子のように。幼子は熱と湿りから養われ、成長する。同じように、馬の火もその湿りで油を増し、その熱をほどよく保つことで石を固定する。この二つの間に、さらに別の火があり、第二度に熱く乾いている。パンを取り出した後の竈の火のようなものである。それは穏やかに溶かし、焼き尽くさない。そこには炎も強い熱もないからである。熱は少しずつ弱まり、去っていく。しかし持続するなら、身体の中または身体の外で霊を固定するであろう。一方、馬の火は溶かしも焼きもせず、従わせ、湿りを増す。また第四の火、固定炉の火がある。それは溶かし、固定するが、焼き尽くさない。炎の火ではないからである。前の火と違うのは、この火の熱は持続するが、前のものはそうではないという点だけである。
    第五は炎の火と呼ばれ、第三度に熱く乾いている。それは焼成するだけで溶かさない。すなわち同じかそれ以上の度にある金、銀、ほかの身体に対してそうである。これは焼成炉の火である。
    第六は第四度に熱く乾いており、身体を穏やかに軟らかくしつつ、強く溶かし、固定するが、散逸させたり散らしたりしない。これはその度にある溶融炉の火である。
    また鞴の火があり、身体を散逸させ、散らし、溶かす。これが第七である。
  "translation_status": "draft"

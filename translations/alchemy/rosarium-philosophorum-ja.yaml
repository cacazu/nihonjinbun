  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720830"
  "translation_ja": "本性へ変えることはない。それゆえ水銀が身体に付着するのでなく、身体が水銀に付着する。このため、多くの者が普通の水銀を使って仕事をし、欺かれてきた。私たちの石、すなわち金にまさり、これに打ち勝った西方の水銀こそ、殺し、また生かすものだからである。ゆえに知れ。それ自身の本性によって凝固し、死なされた水銀は、私たちのこの奥義に属するあらゆる驚異の父であり、霊であると同時に身体、つまり霊的身体である。それは昇華によって上昇するからである。これこそゲベルの言ったことである。「すべてを完成する真の物の考察とは、水銀の純粋な実体から選ばれたものの考察である。」では、その水銀の実体は、特にどのようなものから取り出せるのか、とよく問われる。私たちは答える。それが存在する物から取り出されるのである。ゆえに息子よ、考察し、その実体がどこにあるかを見よ。真の理解へ達したいなら、その実体を取り、ほかの物を取るな、云々。キリストの愛によっておまえに言う。私たちも哲学者たちも、その完全で不燃性の油性の湿りのほかに、火の中で持続する物を、決して見いだせなかった。そして、それが適切に調製されると、触れたすべての身体を、最も真の太陽的完成へ導く。あらゆる身体に、特に月に対してそうする。術の根は賢者たちの石鹸であり、あらゆる塩の鉱床である。それは海の鉱床から生じるため、苦い塩と呼ばれる。"

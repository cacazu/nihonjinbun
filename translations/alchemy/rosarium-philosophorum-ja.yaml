  "translation_ja": "「支配が与えられた。頭には王国の花咲く冠、七つの輝く星の光線がある。夫のために装った花嫁のように、衣にはギリシア語、異邦の言語、ラテン語の黄金の文字でこう記されている。『私は賢者たちの唯一の娘、愚者にはまったく知られぬ者。』」ヘルメス。「星々における太陽のように、金属においては金がある。太陽は星々に光を与え、すべての実りを含む。同様に、金もすべての実りを含む。また昼は光の誕生であり、太陽は昼の灯である。神は私たちの仕事のため、すなわち世界を統べるためにそれを創られた。またティンクトゥラは身体的でなければならず、鉱物の助けと媒介によって、完全な金属の身体から抽出されるものでなければならない。」"

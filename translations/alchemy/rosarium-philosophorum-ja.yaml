    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720976"
  "translation_ja": |-
    彼より高い者は、生まれることがない。
    術によっても、自然によっても、
    いかなる生きた被造物からも。
    哲学者たちは彼を自分たちの子と呼ぶ。
    彼らのすることは、彼にもすべてできる。
    人が彼に何を望もうとも、
    彼は長く確かな健康を与える。
    金、銀、貴い宝石、
    力、そして美しく清らかな若さを。
    怒り、悲しみ、貧しさ、病を取り除く。
    神からこれを授けられる人は幸いである。
  "translation_status": "draft"

  "source_text": "Geber: Investigatione vero nostra qua certi sumus et per experientiam manifestam consideravimus omnia verba vera esse quae iam per nos solos in nostris voluminibus scripta sunt secundum quod vidimus per experimentum & rationem in voluminibus istis redacta, ea vero quae per nostram experientiam digitis extraximus et vidimus oculis, et manibus tetigimus scripsimus in summa nostri perfectionis magisterij."

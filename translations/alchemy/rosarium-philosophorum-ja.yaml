  "source_text": "Reymundus. Quamvis hic lapis noster iam in se tincturam naturaliter contineat, nam in corpus magnesiae est creatus perfecte, per se tamen motum non habet, nisi perficiatur arte & operatione. Geber dicit in operatione radicum: ad hoc fit operatio ut melioretur tinctura auri in auro plus quam est in sua natura, & etiam ut fiat elixir iuxta sapientum allegoriam compositum &c. Sed nunquid solo auro & non alio corpore indigemus? Audi Hermetem dicentem. Pater eius id est primae compositionis est sol. Mater eius luna, pater est calidus & siccus tincturam generans, Mater eius est frigida & humida genitum nutriens, igitur si in lapide nostro esset tantum alterum ipsorum, nunquam facile flueret medicina, neque tincturam daret, & si daret non tingeret nisi in quantum esset & reliquum, & mercurius in fumo evolaret quia non esset in eo receptaculum tincturae, sed nostrum finale secretum est habere medicinam quae fluit ante fugam mercurij, istorum ergo duorum coniunctio est necessaria in opere nostro. Dicit enim Geber in perfecto magisterio: Preciosius metallorum est aurum. Ipsum enim est anima coniungens spiritum cum corpore scilicet imperfecto, quia sicut corpus humanum sine anima est mortuum & immobile, sic & corpus immundum sine fermento quod eius est anima, terreum"
  "source_languages":
  - "la"
  "source_locations":

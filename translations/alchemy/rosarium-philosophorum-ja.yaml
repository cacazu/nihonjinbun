  "origin": "source"
  "source_text": "quod est finis operantis, & sua scientia corpora mundantur & earum opus deo annuente peragitur. Raymundus in apertorio: Nunc per secundam partem colorabit se lapis, fixatur & fermentatur, fermentum autem lapidis ad album est argentum, & ad rubeum est aurum, sicut philosophi demonstrant, quia sine fermento non venit sol neque luna, nec aliquid aliud quod sit suae naturae, coniunge ergo fermentum cum sulphure suo ut generare poterit suum colorem, et etiam ad suam naturam & ad pondus nec non ad saporem & sonum suum, quia quodlibet simile generat suum simile, quia fermentum ut sol tingit & mutat suum sulphur in medicinam permanentem & penetrantem. Ideo dicit philosophus: Qui noverit sulphur & argentum vivum tingere, ille pervenit ad maximum arcanum, propter hoc oportet quod sol & luna sit in tinctura & fermentum ipsius spiritus, & aquae permanentis argenti vivi, & per illam aquam illae naturae debent fixari & nutriri cum naturali calore tam diu usquequo habebunt suam fixationem & fusionem perfectam, post hoc fit regimen coniunctionis lapidis cum suo fermento, scilicet usque donec ad complementum suum opus perventum sit, & hoc non fit una vice simul, quia hoc de intentione naturae non est, sed bene per copulationem, scilicet parum & iterum parum, & etiam per coagula-"
  "source_languages":
  - "la"
  "source_locations":

  "translation_ja": |-
    太陽の薬を調製するには、焼き損なわない硫黄を加えよ。それを固定し焼成する方法を、巧みな工夫をもって完全に施し、幾度もの溶解と多数の反復によって清らかになるまで続ける。これらには昇華によって完成する完全な処理がもたらされる。この添加の方法とは、石の固定していない部分の昇華を繰り返し、巧みに結合して、その部分とともに昇り、さらにそれとともに再び固定されて留まるようにすることである。この豊かな完成の順序を多く繰り返すほど、薬の豊かさはいっそう増し、その良さも増し、その完成の増大も極めて大きくなる。
    また、私たちが不敬な者に非難されぬよう、この奥義の全完成を、短く、完全で明らかな言葉で述べる。
    その意図は、昇華の方法によって石とその添加物を最も完全に清めることである。
    次いで、巧みな方法によって、それらの揮発性のものを固定せよ。その後、固定したものを揮発性にせよ。〔次頁へ〕

  "source_text": "Tres sunt lapides, & tres sales sunt, Ex quibus totum magisterium consistit: Scilicet mineralis, plantalis, & animalis. Et sunt tres aquae, scilicet Solaris, Lunaris, & Mercurialis, Mercurius est minera, Luna planta, quia recipit in se duos colores, albedinem & rubedinem. Et Sol est animalis, quia recipit tria, scilicet constrictionem, albedinem & rubedinem, & vocatur animal magnum. Et Sal armoniacus fit ex eo. Et Luna vocatur planta, & sal alkali fit ex ea. Mercurius vero vocatur lapis mineralis, et fit sal comune de eo. Item: Quando Philosophi viderunt rem huius artis dissolutam, vocaverunt eam salem armoniacum. Et quando fuit putrefactum, tunc dixerunt lapis noster est vilis et in sterquilinio invenitur. Et multi foderunt, & in stercore operati sunt, & nil invenerunt. Et quando fuit in aquam conversus habent eum tam divites quam pauperes, & invenitur in omni loco, & in quolibet tempore, & apud omnem rem, cum inquisitio aggravat inquirentem. Et quando fuit dealbatus vocaverunt eum arsenicum & nomine omnis rei albae, & lac virginis. Et quando"

    materia, quae est mercurius non sunt generata, quia generatio eorum cum generatione mercurij in primis differunt in forma, in natura, in compositione, ideo etiam fieri metalla non possunt quia rerum unius speciei, una est materia prima & sperma ex quibus generatur, prima pars antecedentis patet quod minora metalla non sunt generativa ex mercurio quod est causa quia semper manet in prima materia metallorum & non extranea sulphura.
    Unde Aristoteles & Avicenna: Ideo si deberent fieri metalla, oporteret quod primo transirent in primam materiam metallorum, sed quia artificialiter hoc fieri non potest ideo minime metalla ex eis fieri possunt sic patet prima pars antecedentis satis declarata. Secundo ad idem quod minora mineralia principium metallorum artificialiter fieri non possunt, quod est mercurius ideo etiam medium & finem non pertingunt quae sunt metallum & tinctura quod tenet quia nutrimentum in homine per generationem non potest fieri homo nisi prius convertatur in sperma, & sic additum suo simili novus generatur homo, sed quia minora metalla a metallis extraneae sunt naturae quamvis bene in aliqua vi minerali participant et debilioris sunt virtutis et adustibilia ideo natura metallica eo non gaudet sed respuit et servat ea quae sunt suae naturae, verbi gratia: si aqua misceretur terrae separantur ab invicem, quia terra petit fundum cum sit gravis et sicca aqua superficiem

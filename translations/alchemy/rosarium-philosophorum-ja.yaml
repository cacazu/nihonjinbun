  "source_text": "semper fit cum aqua. Ideo qualis limpida aqua, talis limpida terra. Et quanto magis fuerit abluta terra, tanto magis alba: Ex multiplici ergo reiteratione imbibitionis cum forti contritione & frequenti assatione aqueitatis Mercurij maior pars deletur, scilicet aqueitatis, cuius residuum per sublimationis reiterationem similiter removetur. Haec Arnoldus in suo Rosario de verbo ad verbum."

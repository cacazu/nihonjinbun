  "kind": "paragraph"
  "origin": "source"
  "source_text": "-mo se arti huic intromittat ad inveniendum, nisi principium verae naturae & eius regimen agnoscat, qua cognita pluribus non indiget rebus, nisi una, nec magnas requirit expensas, quoniam unus est lapis, una medicina, unum vas, unum regimen, unaque dispositio. Et scias quod ars est verissima. Porro Philosophi nunquam studuissent tot colorum diversitates, & ordinem exprimere, nisi vidissent & tetigissent. Quare illud repetimus, omnes extra naturam laborantes deceptos esse ac deceptores. Igitur in natura nostrum sit exercitium, & intentum obsequium: Quia lapis noster est de re animali, vegetabili et minerali. Unius ergo esto voluntatis in opere naturae, nec modo hoc, modo illud attentare praesumas, quia in rerum multitudine ars nostra non perficitur. Quantumcunque enim diversificetur eius nomina: tamen semper una sola res est, et de eadem re, non enim introducitur in naturam, quod in ea non est de sua natura. Quare oportet esse necessarium, ut agens & patiens sint in genere res una & eadem, In specie autem altera & diversa, secundum Mercurium, quod diversificatur mulier a viro, quia licet in uno genere conveniant, tamen inter se habent differentiam distinctam, ut differunt materia & forma. Materia namque patitur actionem, Forma vero agit sibi"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"

    subtilitas spiritualis, tenuis sive fluens in fusione ad instar aquae, penetrans in profundum rei alterabilis. Quia secundo post fusionem medicinae, necessaria est ingressio eius immediate.
    Tertia est affinitas sive vicinitas, inter elixir & rem transmutandam, dans inhaerentiam in obviationem sui similis & retentionem. Quia tertio post medicinae ingressionem, immediate adhaerentia conveniens est & necessaria.
    Quarta est radicalis humiditas & ignea, congelans et consolidans partes retentas cum adhaerentia sui similis, & unione omnium partium consimilium inseparabiliter in aeternum. Quia quarto post adhaerentiam, oportuna est partium consolidatio sua radicali humiditate viscosa et necessaria.
    Quinta est puritas claritas mundificata, dans splendorem eminentem in combustione existenti, non adiunctis post consolidationem partium putrificatarum quae relinquuntur, quod ignis agens actualis, habeat comburere omnes superfluitates extraneas non consolidatas, quare sequitur putrefactio immediate, & est necessaria.
    Sexta est terra figens, temperata, tenuis subtilis fixa incombustibilis, dans fixionis permanentiam, in solutione adhaerens, secum stans & perseverans contra ignem. Quia sexto necessaria est fixio post purificationem & oportuna.

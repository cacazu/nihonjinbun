  "source_text": "Geber libro secundo capite quinto dicit. Dicimus quoniam omnis solutionis perfectio adducitur cum aquis subtilibus, et maxime acutis et acribus, & ponticibus fecem nullam habentibus, sicut est acetum distillatum & uva acerba, & pira multae acritudinis, & mala granata, similiter distillata & his similia. Fuit autem causa inventionis eius subtiliatio eorum qui nec fusionem nec ingressionem habent, de quibus magna utilitas amittebatur spirituum fixorum et eorum quae suae naturae sunt, nam omne quod solvitur necesse est salis aut aluminis vel eorum consimilium habere naturam. Est autem natura eorum quoniam fusionem dant ante illorum vitrificationem. Ergo & spiritus soluti fusionem praestabunt similiter similem, cum ergo multum ex natura sua corporibus & sibi invicem conveniant habita fusione necesse est per illam corpora penetrare, & penetrando transmutare. Ad hoc vero sine magisterio non pervenitur, quod est scilicet, ut post solutionem & coagulationem illius, administretur illi aliquis ex spiritibus purificatus non fixus, et totiens ab illo sublimetur quousque secum maneat & illi velociorem praestet fusionem, & ipsum in"
  "source_languages":
  - "la"
  "source_locations":

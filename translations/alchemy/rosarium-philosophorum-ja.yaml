    Arnoldus: Sciant artifices Alchimiae species metallorum transmutari non posse, nisi forte in primam materiam reducantur, & tunc quidem transmutantur in aliam quam prius erant speciem. Et hoc ideo, quia corruptio unius est generatio alterius, tam in artificialibus quam in naturalibus. Ars enim imitatur naturam, & in quibusdam corrigit et superat eam, sicut iuvatur natura infirmi medicorum industria.
    Speculum: Venerabili ergo utimini natura, quoniam non emendatur natura, nisi in sua natura. Cui alienum nolite introducere, nec pulverem, nec aliquam aliam rem. Quippe quia diversae naturae lapidem nostrum non emendant, nec intrat in eum quod non sit ortum ex eo, quoniam si aliquid extranei sibi apponatur, statim corrumpitur, & non fit ex eo quod quaeritur.
    Speculum: Unde notifico, quod nisi similes res in initio coquendi receperis, & absque manuum contritione subtiliaveris, donec omnia aqua fiant, nondum opus invenisti. Quare scire facio preciosissimum arcanum studentibus, ut non fatigentur in vanum, quia hoc magisterium nihil aliud est, quam coquere argentum vivum, & sulphur, donec unum fiat argentum vivum, quod defendit sulphur a combustione, si fuerit vas bene clausum, ita quod argentum vivum non possit

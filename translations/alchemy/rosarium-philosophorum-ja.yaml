  "translation_ja": |-
    〔前頁から続く〕それを幾度も繰り返すのである。エリクシルの力はすべて、そこにかかっているからだ、など。また蝋状化、固定、昇華は同じであり、同じ行為であることを考えよ。蝋状化によって霊が固定され、身体が昇華するからである。同じアルノルドゥスは前の章でいう。七度蒸留した水は別に保存せよ。それは溶解する哲学者たちのメルクリウスであり、婚姻を生じさせ、ラトンを洗う生命の水である。白い水に行ったように、赤い水にも行え。洗浄の方法は同じ一つで、効果も似ているからである。ただし白い水は白くするため、赤い水は赤くするためである。それゆえ両者を混ぜてはならない。そうでなければ誤るであろう。同じアルノルドゥスは別の章でいう。
    融けにくいなら、それは蝋状化の不足からであるから、油、すなわち空気で助けよ。弱い火の上で一滴ずつ滴らせ、蝋のように融けるまで続ける。蝋状化するときは、冷たく乾いたものよりも、熱く湿ったものを多く混ぜる。固定するときは、熱く湿ったものよりも、冷たく乾いたものを多く混ぜる。ゆえに私のいうことを理解せよ。この作業の完成は、本性の交換にあるからである。以上から、水・空気・油は同じもの、すなわち鉱物的なメルクリウスの霊であると知れ、など。同じ著者は別の章でいう。互いに転じ合わせる主要な操作法は四つである。すなわち溶解、洗浄、還元、固定である。

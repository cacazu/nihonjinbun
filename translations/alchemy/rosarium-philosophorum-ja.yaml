  "source_text": "QUOMODO sulphur rubeum est in sole, & album in luna."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 103
  - "source_id": "source-1"

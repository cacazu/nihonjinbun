    Hermes libro quarto Tractatuum.
    Oportet illum qui introduci vult in hanc artem & sapientiam occultam, arrogantiae vicium a se repellere, et pium esse ac probum, & profundum rationis, hominibus humanum, et sereni vultus & hilarem, Salutare diligenter, ac arcanorum permanentium, sibi patentium observatorem. Fili prius ante omnia moneo te deum timere in quo dispositionis tuae visus est & adiuvatio cuiuslibet sequestrati.
    Geber libro perfecti magisterij.
    Artificem huius scientiae, oportet esse subtilissimi ingenij, et naturas metallorum et eorum generationes, infirmitates & inperfectiones in suis mineris scire et cognoscere, antequam perveniat ad hanc artem. Non autem ad ipsam indagandam accedat artifex grosso ingenio et duro repletus, nec cupidus nec avarus, in sumptibus vel expensis. Nec vir duplex animo, sine felle et cervice, vel mente variabilis, nec nimis festinus aut capitosus: Sed doctrinae filius, vir subtilissimo ingenio decoratus, sufficienter locuples, largus, sanus, firmus in proposito et constans, patiens, mitis, longanimis & temperatus. Alphidius: Scito fili, quod istam scientiam habere non potes, quousque mentem tuam deo purifices, et sciat te deus habere certum animum ac rectum, & tunc mundo

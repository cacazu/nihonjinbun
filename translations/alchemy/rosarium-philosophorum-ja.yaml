    assimilans materiam. Ideo materia naturaliter appetit formam, sicut mulier virum, & turpe pulchrum. Sic liberius complectitur corpus spiritum, ut ad suam perveniat perfectionem.
    Cognoscendo ergo radices naturales, melius facies ex eis opus tuum, quia non possum alio modo lapidem nostrum exprimere, nec alio nomine nominare. Patet ergo ex praemissis, quod lapis noster est ex quatuor elementis: Et habent eum tam divites quam pauperes, & invenitur ubique, & assimilatur omnibus rebus, & est compositus ex corpore, anima, & spiritu, & convertitur de natura in naturam, usque ad ultimum suae perfectionis gradum.
    Dixerunt etiam quod lapis noster sit ex una re, & verum est. Nam totum magisterium fit cum aqua nostra, ipsa namque est sperma omnium metallorum, & omnia metalla resolvuntur in ipsam, ut est ostensum.
    Item, Sal metallorum est lapis Philosophorum, lapis enim noster est aqua congelata in auro & argento, & repugnat igni, & resolvitur in aqua sua, ex qua componitur in genere suo. Ergo reductio corporum in primam materiam, seu in argentum vivum, non est
  "source_languages":

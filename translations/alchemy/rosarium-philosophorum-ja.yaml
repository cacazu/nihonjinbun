  "translation_ja": |-
    ヘルメスは第三の論考でいう。来たれ、賢者たちの子らよ。今から私たちは喜び、ともに楽しもう。死は呑み尽くされ、私たちの子はすでに王として治め、赤い武装と肉を身につけている。生まれた私たちの子は、今や王となり、火からティンクトゥラを受け取る。死と海と闇は彼から逃げ、穴を見張っていた竜も太陽の光から逃げる。死んでいた私たちの子は生き、王は火から来て、婚姻を喜び、隠れたものが現れる。今や生命を与えられた私たちの子は、火によって戦士となり、あらゆるティンクトゥラにまさる者となる。
    太陽についての哲学者ベリヌスの比喩。わが父太陽は、あらゆる力にまさる権能を私に与え、栄光の衣を着せたことを知れ。全世界は私を求め、私を追って走る。私は最も大きく、すでに人々は私の力と高さを知った。私は唯一であり、唯一なるわが父に似ている。父はその恩恵によってこの力を私に与えた。人々は、私に求められるべきものを、私の下僕である棒どもに求めるが、私によるのでなければ、それに至った者はいない。大地はあらゆる力を尽くしても私を屈服させることができない。むしろ私は大地と私の下僕たちの上に立ち、彼らを低くする。そして彼らの力と本性から〔あるものを〕取り出し、父が私に与えた私の美しい輝きと光を、そのすべての働きにおいて彼らに着せる。私は卓越した者であり、〔次頁へ〕

  "translation_ja": "〔前頁から続く〕一般的な方法は次のとおりである。まず適度な火によって、その実体の中にある余分で腐敗した湿りをすべて、また微細で焼損させる余剰物を、焼成によって上昇させて除く。その後、その焼灰の中に残る、余分な焼損性の湿りと黒さからなる腐敗した実体全体を、上述の浄化した鋭い、あるいは酸い腐食剤で腐食させねばならない。焼灰が白、赤、またはその物体の本性・固有性に応じた色となり、清浄で、すでに述べたすべての余剰物と腐敗から純化されるまで行う。これらはその腐食剤で、擦り砕き、液を吸わせ、洗うことによって浄化される。次に、不潔な土性と、燃えやすく粗大な汚れをすべて消し去り、取り除く。それには上述の清められた、または純粋な、金属的融解を持たない物を、前述の方法で精製した焼灰と混ぜ、十分に擦り砕く。それらは融解または焼灰の還元の際に、粗大で不潔な土性を自らの側にとどめ、物体は純粋で、腐敗させるあらゆる余剰物から浄められて残る。ここから全体を辿って、これらの純粋な実体を改善し微細化する一般的方法は次のようになる。まず、この浄められ還元された物体を、火と上述の浄化剤の助けで、再び焼成しなければならない。"

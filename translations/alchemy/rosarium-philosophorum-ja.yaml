    & haec terra cum aqua putrefit, & cum mundificata fuerit auxilio cuncta regentis, totum magisterium perficitur. Adhuc videntes terram cum aqua sua commisceri, et aquam paulatim propter temperatam decoctionem diminui et terram crescere, dixerunt omnes quod haec erat ceratio perfecta, unde ait philosophus, quod terra cum aqua ceratur, imbibitur, & temperata decoctione solis, id est caloris desiccatur & in terram vertitur tota materia. Unde idem: Haec vis integra si versa fuerit in terram.
    Denique videntes quod tota materia veniebat in quandam dissipationem, & quod modo reducebat se ad solidam substantiam, et quia non fluebat imo stabat stricte, dixerunt quod haec esset perfecta congelatio. Unde ait Plato: Solvite lapidem nostrum & postea congelate cum magna cautela sicut vobis est demonstratum, & habetis quasi totum magisterium. Idem alubi: Accipe lapidem nostrum, et pone in vase & assa igne levi, donec confringatur, & postea coquite ad calorem solis, donec congeletur, & scitote quod totum magisterium nihil aliud est nisi facere veram solutionem, et perfectam et naturalem congelationem. Haec Plato: Idem dicit solvite et congelate & sic scietis totum magisterium. Item videntes materiam praedictam, perfecte congelatam et inspissatam ita quod nullo modo

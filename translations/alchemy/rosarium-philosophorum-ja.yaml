    そこでモーセの姉妹マリアは言う。「ゴムをゴムと真の婚姻によって結婚させ、それらを奔流の水のようにせよ。」アスタヌス。「霊は完全に浄化されるまで、身体と結合しない。結合の時には、最大の驚異が現れる。不完全な身体が、発酵素を仲立ちとして、確固とした色に染まるからである。この発酵素は、不完全な身体の魂である。そして霊は魂を仲立ちとして身体と結合し、縛られ、魂とともに発酵素の色へ変わり、それらと一つになる。」バシウスは言う。「完全な奥義において、石は両者ともあらかじめ清められていなければ、互いを受け入れない。身体が霊を受け入れ、霊が身体を受け入れて、霊的なものが身体的になり、身体的なものが霊的になるには、あらかじめあらゆる汚れから最も完全に浄化されていなければならない。」セニオル。「おお太陽よ、雄鶏が雌鶏を要するように、あなたは私を必要とし、私もあなたの働きを必要とする。」

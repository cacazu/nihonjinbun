  "translation_ja": "〔前頁から続く〕あらゆるもの、太陽にも月にも〔転じるように扱いやすくするためである〕。この昇華は、物体をその第一質料、すなわちメルクリウスと硫黄へ戻すために行う。したがって三つの理由から昇華を行う。第一は、物体を微細な質料と本性からなる霊にするため。第二は、メルクリウスを焼灰と十分に一体化するため。第三は、全体に白または赤の色を帯びさせるためである。それゆえ月を得るために昇華するとき、焼灰は白く、メルクリウスも白くなければならない。太陽を得るために昇華するとき、焼灰は赤く、メルクリウスも同じく火で熱せられて赤くなければならず、それは蝋状化した粉でなければならない。白いものに赤いメルクリウスを、赤いものに白いメルクリウスを加えるな。それぞれの種を同じ種とともに置き、燃え立つ火にかけ、すべてを昇華せよ。下に残るものを上に昇るものと混ぜてはならない。底に残るものは、メルクリウスとの一体化によって再び昇華し、すべてが昇るまで続けよ。それ以外は奥義に入れるな。メルクリウスを昇華するアレンビックはガラス製にし、瓢形の容器は釉をかけた土器とせよ。その下器の口は、メルクリウスがより自由に昇れるよう広くせよ。アレンビックと瓢形容器は、メルクリウスが漏れ出たり蒸発したりできぬように接合し、奥義が失われないようにしなければならない、など。"

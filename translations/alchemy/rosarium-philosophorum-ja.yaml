    〔前頁から続く〕湿りを保存し、融解を完成させる。また第二十九章には、水銀はまず昇華され、その後で固定されるべきだとある。
    第二十八章には、メルクリウスは連続して繰り返される昇華によって固定され、金属的な融解を与えるようになるとある。このことは彼の言葉の中にしばしば見出される。これらすべては、最初の石の調製と、糞の中に置く前のその白化について理解しなければならない。すなわち鋭い水で蝋状化し、灰の上で溶解・凝結することを、甚だ柔らかくなり、白くなり、ついに輝く月のように流れるまで、何度も繰り返すべきなのである。これが石の昇華、すなわちより高い尊厳と力への上昇であり、その真の浄化である、など。
    第七章には続いていう。しかし私はこの作業を不完全な石から始めるよう勧める。これがゲベル自身の主要な、隠された意図だったのである。第十七章には、メルクリウスの本性は、メルクリウスそのものの中にあるのと同じく物体の中にもある、むしろ知られた石々の中で最も完全である、とある。また第三章には、マルカサイトの中には殺され、ほどよく調製されたメルクリウスの本性があり、それはいっそう有用だとある。この哲学者はその作業にメルクリウスの本性だけを求める。しかし第八章にいうように、太陽の本性全体はメルクリウスから成る。
    またこの哲学者はメルクリウスの実体が殺されたものであることを求める。しかし自然のうちでは、そのメルクリウスは……〔次頁へ〕

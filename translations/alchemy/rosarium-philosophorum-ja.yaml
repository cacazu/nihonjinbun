  "translation_ja": |-
    女王は死と貧しさを憎む。
    彼女は金、銀、宝石を超え、
    大小すべての薬を超える。
    地上に彼女に等しいものはない。
    それゆえ私たちは天国の神に感謝する。
    おお、力が裸の女である私を迫る。
    私の最初の身体は不幸だったから。
    私はまだ母となったことがなかった、
    二度目に生まれるまでは。
    そのとき私はあらゆる根と草の力を得、
    どの病に対しても勝つ者となった。
    そこで私は自分の息子に気づき、
    彼と二人で、そこへ来た。
    私は彼を身ごもり、
    実りのない野に産み落とした。
    私は母となったが、それでも乙女のままであり、
    私の存在のうちに定められた。
    私の息子が私の父となることが。
    神が本質のあり方として、そのように取り計らわれた。
    私を産んだ母も、
    私によって地上に生まれた。
    自然に結ばれた一つのものを考えること。
    山はそれを巧みに飲み込んだ。
    そこから四つが一つへと来る、
    私たちの巧みな石のうちに。
    そして六つは三重に考えられ、
    一つの本質的なあり方へ導かれる。
    これを正しく考えられる者には、
    神から力が与えられる。
    金属と人間の身体の、
    あらゆる病を追い払う力が。

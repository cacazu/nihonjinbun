    凝結した質料の溶解にほかならない。それによって、一つの本性が別の本性へ入り込むことで錠が開かれる。
    このため哲学者たちは、太陽とは成熟した水銀にほかならないと言った。メルクリウスのうちには、現実態にある元素は土と水という受動的な二つだけである。空気と火のような能動的な元素は、可能態としてのみそのうちにある。しかし純粋なメルクリウスのうちで、これらが適切な熟成と釣り合いのとれた煮熟によって純粋な可能態から現実態へ導かれるとき、金が生じる。したがって金のうちでは、四元素は等しい比率で現実化している。それゆえ、そこには成熟した能動的な硫黄がある。私たちの術は、メルクリウスに成熟した金を加えて供することにより自然を助ける。その金のうちには、すでに述べたように、成熟して十分に熟成した硫黄がある。それは自然の働きによって自然から生じたものである。
    アルノルドゥス。「哲学者ではないのにこの学へ達しようとする者は愚かである。この学は哲学者たちの秘事に属するからである。」
    セニオル。「この術は神の権能のうちに保留されており、無学の者には敵となる。」
    それゆえゲベル。「この学は貧しく困窮した者にはふさわしくない。」

  "source_text": "qualiter corpora solvuntur in argentum vivum Philosophorum, id est in aquam Mercurij nostri et fit unum corpus novum. In quarto, habetur putrefactio Philosophorum, quae nunquam fuit visa diebus nostris et vocatur sulphur. In quinto, habetur qualiter maior pars istius aquae, facta est terra nigra et feculenta, de qua loquuntur omnes Philosophi. In sexto, habetur qualiter ista terra nigra in principio stabat super aquam, et paulative submersa est in fundo vasis. In septimo, habetur qualiter ista terra soluta est in aquam iterum in colore olei, et tunc vocatur oleum Philosophorum. In octavo habetur, qualiter natus est draco in nigredine et pascitur Mercurio suo, et interficit seipsum, et submersus est in eo, et aqua aliquantulum dealbatur et istud est elixir. In Nono habetur, qualiter aqua mundatur totaliter a nigredine et remanet in colore lactis, et multi colores apparent in nigredine. In Decimo habetur, qualiter illae nebulae nigrae quae erant in vase supra aquam descenderunt in corpus suum unde exierunt. In Undecimo habetur, qualiter ille cinis factus est albissimus, ut marmor coruscans, et illud est elixir ad album et foetus est cinis. In Duodecimo habetur, qualiter illa albedo conversa est in rubedinem transparentem ut rubinus et istud est elixir ad rubeum. Et si vis bene intelligere totum opus lege de parte in partem, et videbis mirabilia. Haec omnia vidi in diebus nostris usque ad le-"

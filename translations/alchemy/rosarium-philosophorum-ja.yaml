    -beo posteros facere corpora non corpora per dissolutionem, & incorporea corporea per suavem decoctionem, in qua summe cavendum est ne spiritus convertatur in fumum & evanescat per nimium ignem. Unde Maria dicit: Custodi ipsum & cave ne fugiat aliquid in fumum. Et sit mensura ignis caliditas solis Iulij, quatenus ex suavi & longa decoctione inspissetur aqua & fiat terra nigra. Sic ergo habes aliud elementum quod est terra. Et tantum de nigredine pro modo sufficiat.
    Steffanus Philosophus: Aperi oculos tuos & cor tuum, audi & intellige, ostendo & dicam tibi verba intelligibilia, quae scire poteris si fueris de intelligentibus. Scias quod ex homine non exit nisi homo. Sic ex quolibet animali sibi nascitur simile. Videmus tamen aliquas res natas a radicibus suis dissimiles, quia videmus res habentes alas generatas ex non habentibus alas. Videmus etiam & scimus res aliquas, quas homines nesciunt, de quibus egreditur natura quam scimus quod sufficit nobis, & ignoratur, quia sunt res profundae. Et si quaeris de eis, forsitan subtus terram sunt. Et scias quod de ista natura minerali fit ars non de alio.
    Avicenna: Cognosce ergo radices minerales faciens ex eis opus tuum.

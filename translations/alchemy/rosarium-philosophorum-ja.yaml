    ベヤと結びつけよ。彼女は輝かしく、愛らしく、柔らかな乙女である。ガブリクスは男であり、ベヤは女である。彼女は自らに由来するすべてを彼に与える。
    おお、祝福された自然よ。あなたの働きも祝福されている。あなたは不完全なものから完全なものを作るからである。それゆえ、その自然を、純粋で清浄で、生のままで、快く、土的で、正しい状態においてのみ取れ。別のようにすれば何の役にも立たない。私たちの石とともに、相反するものが何も入らないように注意し、それだけを置け。それゆえ私たちの僕を、その芳しい姉妹と結びつけよ。両者の間に息子が生まれるが、その子は親に似ないだろう。ガブリクスがベヤより貴くても、ガブリクスなしには生成は起こらない。ガブリクスとベヤの交わりは、ただちに死となった。ベヤはガブリクスの上に昇り、彼を自分の胎内に閉じ込めたので、彼の姿はまったく見えなくなったからである。彼女はそれほどの愛でガブリクスを抱きしめ、彼のすべてを自らの本性のうちへ受胎し、分割不可能な諸部分にまで分けた。そこでマスクリヌスは詠う。

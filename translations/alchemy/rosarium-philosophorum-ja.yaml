  "translation_ja": "赤い硫黄が太陽に、白い硫黄が月にあるのはどのようにか"
  "translation_status": "draft"
- "id": "ROS-103-T03"
  "section_id": "section-4"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Cum sit dictum quod sulphur philosophorum rubeum existat in sole per maiorem digestionem, & sulphur album in luna per minorem digestionem, unde philosophus: citrinatio non est aliud quam completa digestio, nam calor agens in humidum primo generat nigredinem & agens in siccum causat albedinem quia ignis si transcendit, agens in eo mutat in citrinitatem purissimam haec omnia in calcinatione plumbi attendi possunt. Et dicit philosophus, quod iam actu unumquodque perfectorum corporum suum bonum sulphur cum mercurio contineat, scilicet aurum aureum, argentum argenteum, ideo sulphur album per citrinum est aurum, quamobrem sulphur in eo est sulphur rubeum, ignis substantia, qui hoc album plus digessit, & sic sulphur album & rubeum ex utraque parte existit in sole, quare ignis est perfectio eius et in igne generatum est et ideo amicabiliter gaudet natura suae igneae naturae."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 103
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/download/webcache/1000/10720912"
  - "source_id": "source-1"
    "precision": "page"
    "url": "https://www.e-rara.ch/i3f/v20/10720807/canvas/10720912"
  "translation_ja": "哲学者たちの赤い硫黄は、より大きな熟成によって太陽にあり、白い硫黄は、より小さな熟成によって月にあると述べた。そこで哲学者はいう。黄化は完全な熟成にほかならない。熱は湿ったものに働くと、初めに黒さを生み、乾いたものに働くと白さを生む。火がさらに進んでそれに働けば、最も純粋な黄色へ変える。これらすべては鉛の焼成で観察できる。また哲学者はいう。完全な物体は各々、すでに現実に、メルクリウスとともに自らの善い硫黄を含む。すなわち金は金の硫黄を、銀は銀の硫黄を含む。そのため白い硫黄は黄色を経て金である。したがって、その中の硫黄は赤い硫黄、すなわちこの白いものをいっそう熟成させた火の実体である。こうして白と赤の両方の硫黄が太陽に存在する。それゆえ火はその完成であり、太陽は火の中で生まれたので、その本性は自らの火的な本性を親しく喜ぶ。"
  "translation_status": "draft"
  "source_kind": "prose"

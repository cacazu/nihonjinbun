  "translation_ja": |-
    エリクシルと呼ぶ。また「石ではない石」とも呼ばれる。磨り砕けるので石であり、溶融するので石ではない。それは金のように、蒸発することなく流れる。この特性が当てはまる別の物はない。アウィケンナ。「エリクシルとは、より大きな身体の上に投射され、その物を自らの本性から別の本性へ変えるものである。より小さい身体と霊、諸元素、発酵素が混ざり、すべてから一つの調製物ができるときに生じる。エリクシルはギリシア語で、大いなる宝、あるいは宝のうち最良のものを意味する語である。身体と混ざるエリクシルは、銅に混ざるトゥティアのようなものである。しかし銅はそのトゥティアによって増大し、成長する。その理由は、トゥティアが土的な物であるのに対し、エリクシルは霊的な物であり、その類の本性が別の類へ移るからである。」
    錬金術師。「エリクシルは二つの方法で作られる。一つは、鉱物の霊と、清められ調製された身体から。もう一つは、生あるものから来る物、すなわち毛髪、卵、血などからである。
    第一の方法はこうである。ある霊を死化し、清くなるまで昇華する。そののち、自然に生じた身体の一つを、磨り砕けるまで焼き、それから焼灰のように清浄になるまで焼成する。
    最後に、そのように調製した霊と身体を磨り合わせ、蒸留した鋭い水を吸わせる。」
  "translation_status": "draft"
  "source_kind": "prose"

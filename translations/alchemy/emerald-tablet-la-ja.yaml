"segments":
- "id": "emerald-title"
  "section_id": "body"
  "kind": "heading"
  "origin": "source"
  "source_text": "Tabula Smaragdina Hermetis Trismegisti περὶ χημείας. Incerto interprete."
  "source_languages":
  - "la-Grek"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "ヘルメス・トリスメギストスのエメラルド板――錬金術について。訳者不詳。"
  "translation_status": "draft"
  "source_kind": "title"
- "id": "emerald-title-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "表題中のギリシア語 περὶ χημείας は「錬金術について」。Incerto interprete は、このラテン語訳の訳者が不詳であるという底本の表示。"
  "translation_status": "draft"
- "id": "emerald-preface"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Verba Secretorum Hermetis, quae scripta erant in tabula Smaragdi, inter manus eius inventa, in obscuro antro, in quo humatum corpus eius repertum est."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "ヘルメスの秘義の言葉。それらはエメラルドの板に記されていた。その板は、彼の埋葬された身体が見つかった暗い洞穴で、彼の両手の間から発見された。"
  "translation_status": "draft"
  "source_kind": "preface"
- "id": "emerald-preface-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "これは底本が伝える発見伝説であり、実在する古代の遺物の発掘報告として扱うものではない。"
  "translation_status": "draft"
- "id": "emerald-001"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Verum sine mendacio, certum et verissimum."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "偽りのない真実であり、確実で、このうえなく真実である。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-002"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quod est inferius, est sicut quod est superius. Et quod est superius, est sicut quod est inferius, ad perpetranda miracula rei unius."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "下にあるものは、上にあるもののようである。そして上にあるものは、下にあるもののようである。それは、一なるものの驚くべき業を成し遂げるためである。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-002-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "res una は「一なるもの」。何を指すかを、この短い本文だけから特定の物質や現代科学上の概念に限定しない。"
  "translation_status": "draft"
- "id": "emerald-003"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et sicut omnes res fuerunt ab uno, meditatione unius. Sic omnes res natae fuerunt ab hac una re, adaptatione."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "そして、すべてのものが、一なるものから、一なるものの思考によって生じたように、すべてのものは、この一なるものから、適合によって生まれた。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-003-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の語は meditatione（思考・思索によって）。mediatione（媒介によって）へは改めない。adaptatione は「適合・調整によって」の意で、ここでは「適合」とした。"
  "translation_status": "draft"
- "id": "emerald-004"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pater eius est Sol, mater eius Luna. Portavit illud ventus in ventre suo. Nutrix eius terra est."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "その父は太陽、その母は月である。風はそれを自らの腹の内に運んだ。その乳母は大地である。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-004-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "太陽・月・風・大地は原文の象徴語として訳した。特定の金属や化学物質への置き換えはしない。"
  "translation_status": "draft"
- "id": "emerald-005"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pater omnis telesmi totius mundi est hic."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "全世界のあらゆるテレスムの父は、これである。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-005-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "telesmi（テレスムの）は解釈の難しい語。「完成」「完成をもたらす働き」などと理解されるが、単一の意味に確定せず音写を残した。"
  "translation_status": "draft"
- "id": "emerald-006"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Vis eius integra est, si versa fuerit in terram."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "その力は、土へと変えられるならば、完全なものとなる。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-006-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "terra は前の単位では宇宙的な「大地」、ここでは変成の行き先である「土」と訳した。versa の対象は文面上必ずしも明瞭ではないため、訳でも特定の物質名を補っていない。"
  "translation_status": "draft"
- "id": "emerald-007"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Separabis terram ab igne, subtile a spisso, suaviter cum magno ingenio."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "土を火から、精妙なものを粗厚なものから分かちなさい。穏やかに、深い工夫をもって。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-007-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "subtile / spissum は精妙なものと、厚く密なものとの対。ingenium は知恵・才知・巧みさも含み、ここでは作業上の「工夫」と訳した。"
  "translation_status": "draft"
- "id": "emerald-008"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ascendit a terra in coelum, iterumque descendit in terram, et recipit vim superiorum et inferiorum. Sic habebis gloriam totius mundi. Ideo fugiet a te omnis obscuritas."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "それは地から天へと昇り、ふたたび地へと降り、上なるものと下なるものの力を受け取る。こうして、あなたは全世界の栄光を得るだろう。それゆえ、あらゆる闇はあなたから逃れ去るだろう。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-008-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "Ascendit / descendit / recipit は底本では三人称。「昇れ、降れ」とする命令形への読み替えは行わない。"
  "translation_status": "draft"
- "id": "emerald-009"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Hic est totius fortitudinis fortitudo fortis, quia vincet omnem rem subtilem, omnemque solidam penetrabit."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "これは、あらゆる力のうちでも強き力である。あらゆる精妙なものに打ち勝ち、あらゆる固いものを貫くからである。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-010"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sic mundus creatus est."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "このようにして、世界は創造された。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-011"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Hinc erunt adaptationes mirabiles, quarum modus hic est."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "ここから、驚くべき適合が生じるだろう。その方法は、ここにある。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-011-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "adaptationes は 003 の adaptatione と同じ語に由来する。配合・調整・応用などの含みがある。hic は「ここに」または「このように」とも読める。"
  "translation_status": "draft"
- "id": "emerald-012"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Itaque vocatus sum Hermes Trismegistus, habens tres partes philosophiae totius mundi."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "それゆえ私は、ヘルメス・トリスメギストスと呼ばれた。全世界の哲学の三つの部分を備えているからである。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-012-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "Trismegistus は「三倍に偉大な者」の意。本文は「哲学の三つの部分」が何であるかを列挙していない。実在の特定個人による自署であると断定しない。"
  "translation_status": "draft"
- "id": "emerald-013"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Completum est, quod dixi de operatione Solis."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "petreius-1541-commons"
    "precision": "page"
    "printed_page": "363"
    "pdf_page": 383
    "url": "https://upload.wikimedia.org/wikipedia/commons/1/1e/In_hoc_volumine_De_alchemia_continentur_haec%2C_Gebri...De_inuestigatio%28n%29e_p_..._%28IA_inhocvoluminede00garlgoog%29.pdf#page=383"
  "translation_ja": "太陽の働きについて、私が述べることはこれで尽きている。"
  "translation_status": "draft"
  "source_kind": "body"
- "id": "emerald-013-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "operatio は働き・作用・作業。「太陽の働き」とし、本文にない実験手順を補わない。"
  "translation_status": "draft"
"notes":
- "id": "emerald-title-tn-001"

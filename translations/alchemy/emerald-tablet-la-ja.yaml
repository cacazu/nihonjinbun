schema_version: '1.0'
work_id: emerald-tablet-1541-la-ja
title_ja: エメラルド板
title_la: Tabula Smaragdina
attribution: ヘルメス・トリスメギストスに帰される。歴史上の著者は未詳。
edition_status: 1541年刊本に基づく全訳・注記付き読書版。専門家による批判校訂版ではない。
source_language: la
target_language: ja
alignment_unit: 見出し・序文・意味のまとまりによる本文13単位
scope:
  included: 1541年版の印刷363頁に載る『Tabula Smaragdina』の見出し、発見伝説の序文、本文のすべて。
  excluded: 同巻所収の他の錬金術文献、および次の印刷364頁以降に始まるホルトゥラヌスの注解。柱、丁付、折丁記号、次頁の予告語は本文に含めない。
  clarification: 短篇『エメラルド板』の全訳であり、論集 De alchemia 全巻の訳ではない。本文13単位の番号・区分は読書版のために付したもので、1541年版にはない。
transcription_policy: 1541年の印刷363頁を画像から翻刻。略号は展開し、長い s は s、合字は通常の文字、子音の u は v に整理。& は et、語中の i/j は読みやすい形に統一。大文字の使い方・句読点・分かち書き・改行を整理した。語を補訂した批判版ではなく、meditatione、telesmi、Hic
  など底本の読みを保持した。
translation_policy: 底本から新たに作成した日本語訳。象徴語・多義語を安易に現代の科学概念へ置き換えない。補足説明は訳文と分け、各単位の訳注に記す。歴史的な錬金術文献として読むための版で、実験や治療の手引きではない。
id_policy: emerald-title、emerald-preface、emerald-001〜emerald-013を固定IDとする。HTMLの対応単位、アンカー、内蔵JSON、YAMLで共通。

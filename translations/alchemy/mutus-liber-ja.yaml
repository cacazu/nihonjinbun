  "translation_status": "draft"
- "id": "mutus-plate14-motto"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ora. Lege Lege Lege Relege labora et Invenies."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 36
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=36"
  "translation_ja": "祈れ。読め、読め、読め、読み返せ。働け、そうすれば見いだすだろう。"
  "translation_status": "draft"
- "id": "mutus-plate14-motto-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "読みやすく句点を補った。labora は「働け・努力せよ」の意。具体的な操作方法は言葉としては記されていない。"
  "translation_status": "draft"
- "id": "mutus-plate15-motto"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Oculatus abis. [bis]"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 38
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=38"
  "translation_ja": "見る目を得て、あなたは去る。〔左右に反復〕"
  "translation_status": "draft"
- "id": "mutus-plate15-motto-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "Oculatus は「目を持つ・よく見える」の意。二人の口元から伸びる帯に同じ句がある。[bis] と訳文の〔左右に反復〕は配置を示す編者の補足。"
  "translation_status": "draft"

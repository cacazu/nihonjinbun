  "source_text": "Privilège du Roy."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "国王の出版特許"
  "translation_status": "draft"
- "id": "mutus-privilege-01"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "LOUIS PAR LA GRACE DE DIEU ROY DE FRANCE ET DE NAVARRE: A nos amez & feaux Conseillers les Gens tenans nos Cours de Parlement, Maîtres des Requêtes ordinaires de nôtre Hôtel, grand Conseil, Prévost de Paris, Baillifs, Seneschaux, Prevosts, leurs Lieutenans, & autres Juges qu’il appartiendra; SALUT."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "神の恩寵によりフランスおよびナヴァールの王たるルイより、わが愛する忠実な顧問、高等法院の構成員、王室の通常請願審査官、大評議会、パリの奉行、バイイ、セネシャル、各地の奉行、その代理、および関係するその他の裁判官に、挨拶する。"
  "translation_status": "draft"
- "id": "mutus-privilege-01-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "当時の司法官職名の一部は音写した。Parlement は近代的な議会ではなく高等法院。"
  "translation_status": "draft"
- "id": "mutus-privilege-02"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nostre bien amé Jacob Saulat, Sieur des Marez, Nous a fait remontrer qu’il luy est tombé entre les mains un Livre de la haute Chimie d’Hermes, intitulé: Mutus Liber, in quo tamen tota Philosophia Hermetica Figuris hierogliphicis depingitur, ter optimo, maximo Deo misericordi consecratus, solisque Filiis Artis dedicatus, Authore cujus nomen est Altus; lequel il desireroit donner au Public. Mais il craint qu’aprés que luy, ou tel Libraire ou Imprimeur qu’il aura choisi, en aura fait la dépense, d’autres n’entreprennent de l’imprimer, s’il n’a sur ce nos Lettres nécessaires."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "わが愛するジャコブ・ソーラ、デ・マレ領主は、ヘルメスの高次の錬金術に関する一冊が自分の手に入ったと申し立てた。その表題は「沈黙の書。されど、その中にはヘルメスの哲学のすべてが象形の図によって描かれる。三重に至善・至大なる慈悲深い神に聖別され、この術の子らだけに献じられたもの。著者の名はアルトゥス」であり、彼はそれを公にしたいと望んでいる。しかし、彼自身、または彼の選んだ書籍商か印刷業者が費用を負担した後、必要な王の証書を得ていなければ、他人がその印刷に着手するのではないかと恐れている。"
  "translation_status": "draft"
- "id": "mutus-privilege-03"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A CES CAUSES, voulant gratifier ledit Exposant, Nous luy avons permis & accordé, permettons & accordons par ces Présentes, de faire imprimer ledit Livre en telle manière que bon luy semblera, pendant le temps & espace de dix années consécutives, à commencer du jour qu’il sera achevé d’imprimer pour la première fois; iceluy vendre & debiter par tout nostre Royaume."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "これらの理由により、前記申立人に恩恵を与えようと望み、われらは次のことを許可し、認めてきたのであり、この証書をもって許可し、認める。すなわち、彼が適当と考える方法で前記書物を印刷させ、最初の印刷を完了した日から連続する十年間、これをわが王国全域で販売し、流通させることである。"
  "translation_status": "draft"
- "id": "mutus-privilege-04"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Faisons défenses à tous Libraires, Imprimeurs & autres, d’imprimer, faire imprimer, vendre ni debiter ledit Livre, sous prétexte d’augmentation, correction, changement de titre, d’impression étrangère, ni autrement en quelque sorte & manière que ce soit, ni mesme en extraire quelque chose, sans le consentement de l’Exposant ou ses ayans cause, sur peine de confiscation des Exemplaires contrefaits, de deux mille livres d’amende, & de tous dépens, dommages & interests; Et en cas de contravention, Nous nous en réservons la connoissance & à nostre Conseil."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "すべての書籍商、印刷業者その他の者に対し、増補、訂正、改題、外国での印刷を口実として、またはその他いかなる形や方法によっても、申立人またはその権利承継人の同意なく、前記書物を印刷し、印刷させ、販売し、流通させることを禁ずる。一部を抜き出すことも同様に禁ずる。違反した場合は、偽造した部数の没収、二千リーヴルの罰金、ならびにすべての訴訟費用と損害賠償を科する。違反事件の審理は、われらおよびわが評議会に留保する。"
  "translation_status": "draft"
- "id": "mutus-privilege-05"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A la charge d’en mettre deux exemplaires en nostre Bibliothèque publique, un en nostre Cabinet des Livres de nostre Château du Louvre, & un en celle de nostre très-cher & feal le Sieur d’Aligre, Chancelier & Garde des Sceaux de France, & de faire registrer ces Présentes és Registres de la Communauté des Libraires de Paris, à peine de nullité des Présentes:"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "ただし、二部をわが公立図書館に、一部をルーヴル城のわが蔵書室に、さらに一部を、わが親愛かつ忠実なるフランス大法官・国璽尚書ダリグル殿の図書館に納め、この証書をパリ書籍商組合の帳簿に登録させなければならない。これを怠れば、この証書は無効となる。"
  "translation_status": "draft"
- "id": "mutus-privilege-06"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Du contenu desquelles vous mandons & enjoignons faire jouir l’Exposant & ses ayans cause, pleinement & paisiblement, cessant & faisant cesser tous troubles & empêchemens au contraire. Voulons qu’en mettant au commencement ou à la fin desdits Livres, l’extrait des Présentes, elles soient tenues pour deuëment signifiées; & qu’aux copies collationnées par un de nos amez & feaux Conseillers & Secrétaires, foy soit ajoutée comme à l’Original."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "この証書に定めた利益を、申立人およびその権利承継人が十分かつ平穏に享受できるよう、各位に命令し、申しつける。これに反する妨害や障害は、やめ、またやめさせなければならない。前記書物の巻頭または巻末にこの証書の抄録を置くことにより、適法な通知がなされたものとみなすことを望む。また、わが愛する忠実な顧問・秘書官の一人が照合した写しには、原本と同じ信を置くものとする。"
  "translation_status": "draft"
- "id": "mutus-privilege-07"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mandons au premier nostre Huissier ou Sergent sur ce requis, faire pour l’exécution des Présentes, toutes significations, défenses, saisies & autres Actes requis & nécessaires, sans demander autre permission; nonobstant Clameur de Haro, Chartre Normande, ou autres Lettres à ce contraires: Car tel est nostre plaisir."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "この件につき要請を受ける最初のわが執行官または役吏に命ずる。この証書を執行するため、あらためて許可を求めることなく、必要なすべての通知、禁止、差押えその他の行為を行うこと。「ハロ」の抗議、ノルマンディー憲章、またはこれに反するその他の証書にもかかわらず、これを行うこと。これが、われらの意志だからである。"
  "translation_status": "draft"
- "id": "mutus-privilege-07-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "Clameur de Haro はノルマンディーの法慣行における抗議・救済請求の呼び声。ここでは執行を妨げ得る特別の法手続として挙げられている。"
  "translation_status": "draft"
- "id": "mutus-privilege-08"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Donné à S. Germain le vingt-troisième jour de Novembre, l’an de grace mil six cens soixante-seize, & de nostre regne le trente-quatrième. Signé, Par le Roy en son Conseil: DESVIEUX."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "恩寵の年1676年11月23日、わが治世の第34年、サン＝ジェルマンにて授与した。評議会における国王の命により署名、デヴュー。"
  "translation_status": "draft"
- "id": "mutus-privilege-09"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ledit Sieur Saulat a permis à Pierre Savouret, Marchand Libraire à la Rochelle, d’imprimer, vendre & debiter ledit Livre, suivant l’accord fait entr’eux."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "前記ソーラ殿は、両者の間に結ばれた合意に従い、ラ・ロシェルの書籍商ピエール・サヴレに、前記書物の印刷、販売および流通を許可した。"
  "translation_status": "draft"
- "id": "mutus-colophon"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Achevé d’imprimer pour la première fois, le 1. Fevrier 1677."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "初回の印刷を1677年2月1日に完了した。"
  "translation_status": "draft"
- "id": "mutus-registration"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Registré sur le Livre de la Communauté des Libraires & Imprimeurs de Paris, le 28. Novembre 1676. suivant l’Arrest du Parlement du 8. Avril 1653. & celuy du Conseil Privé du Roy du 27. Février 1665. Thierry, Syndic."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "1653年4月8日の高等法院の決定、および1665年2月27日の国王枢密評議会の決定に従い、1676年11月28日、パリ書籍商・印刷業者組合の帳簿に登録した。組合代表、ティエリ。"
  "translation_status": "draft"
- "id": "mutus-deposit"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Les Exemplaires ont esté fournis."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 40
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=40"
  "translation_ja": "所定の部数は納められた。"
  "translation_status": "draft"

"segments":
- "id": "mutus-title"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mutus liber, in quo tamen tota Philosophia hermetica, figuris hieroglyphicis depingitur, ter optimo maximo Deo misericordi consecratus, solisque filiis artis dedicatus, authore cujus nomen est Altus."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 8
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=8"
  "translation_ja": "沈黙の書。されど、その中にはヘルメスの哲学のすべてが象形の図によって描かれる。三重に至善・至大なる慈悲深い神に聖別され、この術の子らだけに献じられたもの。著者の名はアルトゥス。"
  "translation_status": "draft"
- "id": "mutus-title-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "「この術の子ら」は錬金術の道を学ぶ者たちを指す伝統的な表現。Altus は底本に示された著者名であり、ここでは実名の同定を行わない。"
  "translation_status": "draft"
- "id": "mutus-title-tn-002-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "ter は「三たび・三重に」。ここでは神への賛称にかかるものとして訳した。"
  "translation_status": "draft"
- "id": "mutus-references"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "21.11.82. Neg. / 93.82.72. Neg. / 82.81.33. Tued."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 8
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=8"
  "translation_ja": "創世記28章11・12節／創世記27章28・39節／申命記33章18・28節"
  "translation_status": "draft"
- "id": "mutus-references-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の数字と書名略記は右から左へ読むように並べられている。原文欄は目に見える左から右の順序を活字化し、日本語欄は逆向きに読んだ聖書参照を示す。聖書本文の引用は底本にないため補っていない。"
  "translation_status": "draft"
- "id": "mutus-imprint"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Rupellae, apud Petrum Savouret, cum Privilegio Regis. M.DC.LXXVII."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 8
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=8"
  "translation_ja": "ラ・ロシェル、ピエール・サヴレのもとにて。国王の出版特許を得て。1677年。"
  "translation_status": "draft"
- "id": "mutus-reader-heading"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "AU LECTEUR"
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 10
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=10"
  "translation_ja": "読者へ"
  "translation_status": "draft"
- "id": "mutus-reader-01"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quoy-que celuy qui a fait les frais de l’Impression de ce Livre, n’ait voulu mettre à la teste ni Lettre dedicatoire, ni Préface, pour des raisons qu’il a pardevers luy; j’ay cru, pourtant, qu’il ne trouveroit pas mauvais que je vous disse, que cet Ouvrage est admirable en cecy: C’est qu’encore qu’il soit intitulé, Livre Muët; néanmoins toutes les Nations du monde, les Hébreux, les Grecs, les Latins, les François, les Italiens, les Espagnols, les Allemans, &c. peuvent le lire & l’entendre."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 10
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=10"
  "translation_ja": "この書の印刷費を出した人は、自分なりの理由から、巻頭に献辞も序文も置こうとはしませんでした。それでも、私が次のことを皆さんにお伝えするのを、その人も悪くは思わないだろうと考えました。この作品には、驚くべき点があります。「沈黙の書」と題されているにもかかわらず、世界のあらゆる国の人々、ヘブライ人、ギリシア人、ラテン人、フランス人、イタリア人、スペイン人、ドイツ人などが、これを読み、理解できるのです。"
  "translation_status": "draft"
- "id": "mutus-reader-02"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Aussi est-ce le plus beau Livre qui ait jamais esté imprimé sur ce sujet, à ce que disent les Savans, y ayant-là des choses qui n’ont jamais esté dites par personne. Il ne faut qu’estre un véritable Enfant de l’Art, pour le connoître d’abord. Voilà (cher Lecteur) ce que j’ay cru devoir vous dire."
  "source_languages":
  - "fr"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 10
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=10"
  "translation_ja": "また、学識ある人々がいうところでは、これはこの主題についてこれまで印刷された最も美しい書物です。そこには、誰もかつて語ったことのない事柄があるからです。この術の真の子でさえあれば、それはすぐにわかるでしょう。親愛なる読者よ、以上が、私からお伝えしておくべきだと考えたことです。"
  "translation_status": "draft"
- "id": "mutus-plate13-numerals"
  "section_id": "body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "100 · 1000 / 10000 · &c. [bis]"
  "source_languages":
  - "und"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 34
    "url": "https://www.e-rara.ch/cgj/download/pdf/1350330#page=34"
  "translation_ja": "100、1000、10000、等々。〔左右に反復〕"
  "translation_status": "draft"
- "id": "mutus-plate13-numerals-tn-001-text"
  "section_id": "body"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "数列は下段の二人の人物のそばに一組ずつある。&c. は et cetera（等々）の略。[bis] と訳文の〔左右に反復〕は配置を示す編者の補足。数値の象徴的意味は確定しない。"
  "translation_status": "draft"

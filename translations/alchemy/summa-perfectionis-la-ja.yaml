- id: geber-summa-b01-c003-title
  section_id: geber-summa
  book: 1
  chapter: 3
  kind: heading
  source_la: Divisio impedimentorum. Caput III.
  translation_ja: 第3章　障害の分類。
  notes: *id001
  source_printed_page: 23
  source_pdf_page: 45
  source_erara_pdf_page: 50
- id: geber-summa-b01-c003-001
  section_id: geber-summa
  book: 1
  chapter: 3
  kind: body
  source_la: 'Sunt ergo impedimenta huic operi supervenientia, duo generaliter: Naturalis scilicet impotentia,
    et necessariae impensae defectus, vel occupationes et labores. Naturalem tamen impotentiam multiplicem
    esse dicimus. Ex parte scilicet organi artificis, et ex parte animae. Ex parte etiam organi artificis
    multipliciter. Vel quia organum sit debile, vel ex toto corruptum. Ex animae denique impotentiis multipliciter,
    vel quia sit anima perversa in organis, propter organa nil rectitudinis, vel rationis in se habens,
    sicut anima insani, vel fatui. Vel quia sit fantastica, contrariarum facile formarum susceptiva indebite,
    et de uno scibili ad eius oppositum extensiva subito, et de uno velle ad eius oppositum similiter.'
  translation_ja: この作業に加わる障害は、大別して二つある。すなわち、自然的な能力の不足と、必要な費用の不足、あるいは他の用事や労働である。ただし、自然的な能力の不足にも多くの種類がある。術者の身体器官の側のものと、魂の側のものがある。身体器官の側にもさまざまなものがあり、器官が弱い場合も、完全に損なわれている場合もある。魂の能力の不足もさまざまである。器官の状態によって魂が歪められ、正しさや理性をまったく持たない場合があり、著者のいう「狂人」や「愚鈍な者」の魂がこれに当たる。また、空想に支配され、相反する形象を不適切に容易に受け入れ、一つの認識からその反対へと突然移り、意志も同じように反対へ転じる場合がある。
  notes:
  - 本章以下には、身体・精神の障害や病気に対する歴史的な差別的判断が含まれる。原文の意味を示すために訳しており、現代の能力評価や医学的判断として是認するものではない。
  source_printed_page: 23
  source_pdf_page: 45
  source_erara_pdf_page: 50
- id: geber-summa-b01-c004-title
  section_id: geber-summa
  book: 1
  chapter: 4
  kind: heading
  source_la: De impedimentis huius operis, ex parte corporis artificis. Caput IIII.
  translation_ja: 第4章　術者の身体の側から、この作業を妨げる障害について。
  notes: *id001
  source_printed_page: 23
  source_pdf_page: 45
  source_erara_pdf_page: 50
- id: geber-summa-b01-c004-001
  section_id: geber-summa
  book: 1
  chapter: 4
  kind: body
  source_la: 'Iam tibi generaliter determinavimus huius operis impedimenta. Nunc vero specialiori sermone
    te alloquemur in hoc capitulo, et magis aperte narrabimus tibi omnia illa impedimenta plenissime,
    seriatim. Dicimus igitur: quod si quis non habuerit sua completa organa, non poterit ad huius operis
    complementum pervenire per se, velut si caecus fuerit, vel extremis truncatus, quoniam non iuvatur
    a membris, quibus mediantibus, ars haec perficitur, tanquam naturae ministrantibus. Si vero fuerit
    artificis corpus debile et aegrotum, sicut febrientium, vel leprosorum corpora, quibus membra cadunt,
    et in extremis vitae laborantium, et iam aetatis decrepitae senium, ad artis complementum non perveniet.
    His igitur naturalibus corporis impotentiis impeditur artifex in intentione sua.'
  translation_ja: すでに、この作業の障害を一般的に定めた。本章では、さらに個別的に語り、それらの障害をすべて、いっそう明瞭に、十分に、順序立てて述べよう。私たちはこう言う。身体器官が完全にそろっていない者は、たとえば目が見えず、あるいは手足を失っているなら、自力でこの作業の完成に到達できない。この術を完成させる媒介となり、自然に奉仕する身体の諸部分の助けを得られないからである。また、術者の身体が弱く病んでいるなら、たとえば発熱する者や、四肢が脱落する癩病の者、命の終わりに苦しむ者、あるいは衰弱した高齢の者の身体であるなら、術の完成には至らない。したがって、これらの自然的な身体能力の不足によって、術者はその目的を妨げられる。
  notes:
  - 病名・身体観は底本の歴史的なもの。leprosus を含め、現代の診断や当事者の能力の記述に置き換えない。
  source_printed_pages:
  - 23
  - 24
  source_pdf_pages:
  - 45
  - 46
  source_erara_pdf_pages:
  - 50
  - 51
- id: geber-summa-b01-c005-title
  section_id: geber-summa
  book: 1
  chapter: 5
  kind: heading
  source_la: De impedimentis ex parte animae artificis. Caput V.
  translation_ja: 第5章　術者の魂の側の障害について。
  notes: *id001
  source_printed_page: 24
  source_pdf_page: 46
  source_erara_pdf_page: 51
- id: geber-summa-b01-c005-001
  section_id: geber-summa
  book: 1
  chapter: 5
  kind: body
  source_la: Praemisimus tibi capitulum unum, in quo narravimus sermone absoluto et manifesto impedimenta,
    ex parte corporis artificis dependentia. Restat nobis narrare breviter impedimenta ex parte ipsius
    animae, quae maxime impediunt huius operis complementum. Dicimus igitur, quod qui non habuerit ingenium
    naturale, et animam perscrutantem subtiliter principia naturalia, et naturae fundamenta, et artificia,
    quae consequi naturam possint in suae actionis proprietatibus, non inveniet huius preciosissimae scientiae
    veram radicem. Sicut sunt multi, qui duram habent cervicem, in omni perscrutatione vacuam ingenio,
    qui et vix communem intelligere queunt sermonem, et opera similiter cum difficultate discunt vulgo
    communia.
  translation_ja: 前の一章では、術者の身体に由来する障害を、明確で完結した言葉で述べた。残るのは、作業の完成を大いに妨げる、魂の側の障害を短く語ることである。私たちはこう言う。生来の才知と、自然の原理、自然の基礎、自然の作用の性質に追随し得る技法を微細に調べる魂を持たない者は、この最も貴重な学知の真の根を発見しない。あらゆる探究において才知を欠き、頑なで、普通の言葉さえほとんど理解できず、一般的な作業を習うことにも苦労する者が多くいるのが、その例である。
  notes:
  - 原刊正誤表（24頁・25行）に従い、「huius preciosissimae scientiae」と読む。
  - 原刊正誤表（25頁・2行）に従い、「sermonem, et opera」と読む。
  source_printed_pages:
  - 24
  - 25
  source_pdf_pages:
  - 46
  - 47
  source_erara_pdf_pages:
  - 51
  - 52
- id: geber-summa-b01-c005-002
  section_id: geber-summa
  book: 1
  chapter: 5
  kind: body
  source_la: Praeter hos etiam multos invenimus animam habere facile opinantem fantasiam quamlibet, sed
    quod credunt se verum invenisse, fantasticum est totum, et a ratione devium, et errore plenum, et
    semotum a principiis naturalibus, quoniam eorum cerebrum, multis repletum fumositatibus, non potest
    recipere veram rerum naturalium intentionem. Sunt etiam praeter istos alii, qui mobilem habent animam,
    de opinione in opiniones, et de voluntate in voluntates, sicut qui modo credunt hoc, et idem volunt,
    sine ratione ullius fundamento. Paululum vero post illud, et aliud credunt similiter, et aliud volunt.
    Et hi tam mobiles sunt, ut vix minimum eius ad quod intendunt, possint consummare, sed diminutum potius
    illud relinquunt.
  translation_ja: このほかにも、どんな空想でも容易に信じる魂を持つ者を、多く見いだす。しかし、自分が真実を見つけたと思っているものは、すべて空想であり、理性から逸れ、誤りに満ち、自然の原理から遠く隔たっている。彼らの脳は多くの煙状のものに満たされ、自然の事物の真の意味を受け取れないからである。またこのほかに、考えから考えへ、意志から意志へと移りやすい魂を持つ者がいる。いまは何かを信じ、それを望むが、理性的な根拠がない。少し経つと、同じように別のことを信じ、別のことを望む。その変わりやすさのため、目指したことの最小の部分さえほとんど完成できず、むしろ未完のまま放置してしまう。
  notes:
  - 脳の「煙状のもの」による説明は歴史的な生理説。現代医学の説明ではない。
  - 原刊正誤表（25頁・12行）に従い、「ratione ullius」と読む。訂正後にも格の不整合が残るが、刊本の訂正指示を保持した。
  source_printed_page: 25
  source_pdf_page: 47
  source_erara_pdf_page: 52
- id: geber-summa-b01-c005-003
  section_id: geber-summa
  book: 1
  chapter: 5
  kind: body
  source_la: 'Sunt similiter et alii, qui non possunt videre veritatem aliquam ex rebus naturalibus, non
    magis quam bestiae, velut mente capti, insani, et pueri. Sunt et alii, qui contemnunt scientiam, et
    ipsam non putant esse: quos similiter haec scientia contemnit, ipsosque ab huius preciosissimi operis
    fine repellit. Et sunt, qui servi sunt, pecuniae deservientes, hanc scientiam mirabilem et ipsi affirmantes,
    sed ipsa dispendia interponere timent: ideoque licet ipsam affirment, et secundum rationem ipsam investigent,
    tamen ad operis experientiam non perveniunt, propter pecuniae avariciam. Ad hos igitur non pervenit
    haec scientia nostra. Qualiter enim qui ignorans fuerit, vel scientiam investigare neglexerit, faciliter
    ad ipsam perveniret?'
  translation_ja: 同じように、自然の事物から何らの真理も見いだせず、獣と変わらない者たちもいる、と著者はいう。精神を損なった者、狂気の者、子どもなどである。また、学知を軽蔑し、その存在を認めない者もいる。この学知も彼らを同様に軽蔑し、この最も貴重な作業の目的から遠ざける。さらに、金銭に仕える奴隷となっている者もいる。彼ら自身も、この驚くべき学知を認めてはいるが、そのために費用を出すことを恐れる。それゆえ、この学知を認め、理性に従って探究していても、金銭への執着のため、実際の作業経験には到達しない。したがって、私たちの学知は彼らには届かない。無知である者、あるいは学知の探究を怠った者が、どうして容易にそれを得られようか。
  notes: *id001
  source_printed_pages:
  - 25
  - 26
  source_pdf_pages:
  - 47
  - 48
  source_erara_pdf_pages:
  - 52
  - 53
- id: geber-summa-b01-c006-title
  section_id: geber-summa
  book: 1
  chapter: 6
  kind: heading
  source_la: De impedimentis externis, huius artis opus impedientibus. Caput VI.
  translation_ja: 第6章　この術の作業を妨げる、外的な障害について。
  notes: *id001
  source_printed_page: 26
  source_pdf_page: 48
  source_erara_pdf_page: 53
- id: geber-summa-b01-c006-001
  section_id: geber-summa
  book: 1
  chapter: 6
  kind: body
  source_la: Reduximus ad duo capitula, omnia impedimenta, huius artis finem retardantia, quae sunt ex
    principiis radicalibus, secundum naturam artificis huius preciosissimi negotii. Expedit ergo nos tandem
    narrare impedimenta exterius supervenientia, ex contingentibus fortunis et casibus, quibus impeditur
    hoc opus gloriosissimum. Videmus ergo quosdam astutos et ingeniosos, minime ignorantes opera naturae,
    et ipsius, in quibus est possibile, sequaces principiis et operibus, quibus est etiam investigatio
    non fantastica, in omnibus rebus, quae naturae regulantur motibus et actionibus infra lunarem circulum.
    Hi tamen ultima paupertate oppressi, ex dispensationis indigentia, hoc tam excellens magisterium coguntur
    postponere. Sunt et multi alii praeter nunc dictos, curiosi, variis huius mundi curis, et solicitudinibus
    detenti, se omni negocio seculari totos occupantes, a quibus haec nostra scientia preciosa prorsus
    refugit. Iam ergo tibi satis ex praemissis capitulis patet, quae sint ab hac arte distrahentia impedimenta.
  translation_ja: 私たちは、この最も貴重な営みの術者の本性に従い、根源的な原理から生じて術の目的を遅らせる障害を、すべて二つの章にまとめた。そこで最後に、偶然の運命や出来事から外的に加わり、この最も輝かしい作業を妨げる障害を語るのが適切である。私たちは、鋭敏で才知に富み、自然の働きに決して無知ではなく、可能な範囲で自然の原理と働きに従う者たちを見る。彼らはまた、月の圏内で自然の運動と作用によって秩序づけられるすべての事物について、空想に陥らない探究を行う。しかし、極度の貧困に圧迫され、支出の手段を欠くため、この卓越した術を後回しにせざるを得ない。このほかにも、この世のさまざまな心配や懸念にとらわれ、あらゆる世俗の用事に自分をすっかり費やす、多忙な者が多くいる。私たちの貴重な学知は、彼らからまったく逃れ去る。したがって、先の諸章によって、この術から人を引き離す障害が何であるかは、十分明らかになった。
  notes:
  - 「月の圏内」は、月より下の生成変化する領域をいう当時の宇宙論上の区分。
  - 原刊正誤表（26頁・21行）に従い、「variis huius mundi curis」と読む。
  source_printed_page: 26
  source_pdf_page: 48
  source_erara_pdf_page: 53
- id: geber-summa-b01-c007-title
  section_id: geber-summa
  book: 1
  chapter: 7
  kind: heading
  source_la: Epilogus huius primae partis, qualem oporteat esse artificem. Caput VII.
  translation_ja: 第7章　第1部の結語。術者はどのような者であるべきか。
  notes: *id001
  source_printed_page: 27
  source_pdf_page: 49
  source_erara_pdf_page: 54
- id: geber-summa-b01-c007-001
  section_id: geber-summa
  book: 1
  chapter: 7
  kind: body
  source_la: 'Concludimus igitur ex iam dictis, quod oportet artificem huius operis in scientiis philosophiae
    naturalis eruditum et perfectum esse, quia quantamcunque pecuniam, et ingenium naturaliter profundum
    habuerit, et desiderium in hoc artificio, non tamen ipsius finem acquiret, nisi ex doctrina philosophiam
    naturalem adeptus fuerit, quia quod per ingenium naturale non adipiscitur, huius defectui per doctrinam
    subvenitur. Oportet igitur altissima perscrutatione et industria naturali artificem iuvari. Propter
    doctrinam enim, quantamcunque scientiam acquisiverit, nisi ab industria etiam iuvetur naturali, ad
    epulas tam preciosi non invitabitur. In puncto enim errorem suum emendaret, per suam industriam: cui
    remedium ignoraret adhibere, si sola doctrina fundatus foret: et errori similiter subveniret in puncto
    ex acquisita scientia per doctrinam naturalem, quem per solam industriam evitare non posset: quoniam
    ars ab ingenio iuvatur, et ingenium ab arte similiter.'
  translation_ja: 以上から、私たちはこう結論する。この作業の術者は、自然哲学の諸学に通じ、十分に熟達していなければならない。どれほどの金銭、生来の深い才知、この技への欲求を持っていても、学習によって自然哲学を獲得していなければ、その目的を得られない。生来の才知によって得られないものの不足は、学習によって補われるからである。したがって術者には、深い精査と生来の工夫の助けが必要である。学習によってどれほど多くの知識を得ても、生来の工夫にも助けられなければ、この貴重なものの饗宴には招かれない。工夫によってただちに訂正できる誤りも、学習だけに頼っていたなら、その治し方が分からないだろう。同じように、工夫だけでは避けられない誤りも、自然についての学習で得た知識によって、ただちに補うことができる。技術は才知によって助けられ、才知もまた技術によって助けられるのである。
  notes:
  - 原刊正誤表（27頁・25行）に従い、「preciosi」と読む。
  source_printed_page: 27
  source_pdf_page: 49
  source_erara_pdf_page: 54
- id: geber-summa-b01-c007-002
  section_id: geber-summa
  book: 1
  chapter: 7
  kind: body
  source_la: 'Et ipsum similiter necessarium est constantis voluntatis in opere fore, ut non modo hoc
    modo illud attentare praesumat: quia in rerum multitudine ars nostra non consistit, nec perficitur.
    Est enim lapis unus, medicina una, in quo magisterium consistit, cui non addimus rem extraneam aliquam,
    nec minuimus, nisi quod in praeparatione superflua removemus. Oportet etiam ipsum sedulum operi usque
    ad consummationem ipsius insistere: ut non opus detruncatum dimittat, quia nec scientiam, nec proficuum
    ex opere diminuto acquireret, sed potius desperationem, et damnum. Expedit etiam ipsum huius artis
    principia et radices principales, quae sunt de esse operis, non ignorare: quoniam qui principium ignorat,
    finem non invenit. Et nos dicemus tibi principia illa omnia sermone completo, necnon et prudentibus
    sufficienter aperto et manifesto, secundum huius nostrae artis exigentiam.'
  translation_ja: また、作業において意志を一定に保ち、あるときはこれ、あるときはあれと、むやみに試みないことも必要である。私たちの術は、多くの物の中に成立するものではなく、それらによって完成するものでもない。術が成り立つのは、一つの石、一つの薬においてである。それに異質なものを加えることはなく、減らすこともない。ただし、調製において余分なものを除くことは別である。また、完成するまで熱心に作業に取り組み、途中で切り上げた作業を放置してはならない。不完全な作業からは学知も実りも得られず、むしろ絶望と損失が得られるからである。また、作業の成立に関わる、この術の原理と主要な根を知らなければならない。原理を知らない者は、終極を見いださないからである。私たちは、この術に必要なところに従い、それらの原理をすべて、十分な言葉で、分別ある人々には十分に開かれた明瞭な言葉で、あなたに語ろう。
  notes:
  - 原刊正誤表（28頁・11行）に従い、「sufficienter」と読む。
  source_printed_pages:
  - 27
  - 28
  source_pdf_pages:
  - 49
  - 50
  source_erara_pdf_pages:
  - 54
  - 55
- id: geber-summa-b01-c007-003
  section_id: geber-summa
  book: 1
  chapter: 7
  kind: body
  source_la: 'Expedit similiter artificem temperatum et tardum ad iram esse, ne subito propter irae impetum,
    iam incepta dissipet et destruat. Similiter et pecuniam suam custodiat, nec praesumptuosus eam vane
    distribuat, ne si forte artem non invenerit, relinquatur in miseria, et desperatione paupertatis:
    vel ne forte, cum iam ad finem huius magisterii per suam indagationem approximaverit, consumpta sint
    ipsius impendia, et verum finem miser violenter ob paupertatem relinquat. Sicut cum in principio,
    qui ignorant, prodigaliter suum thesaurum totum exterminant, cum autem huic affines fuerint, non habent
    ulterius ex quo laborent. Unde dupliciter hi tales in moerore sepeliuntur: et quia pecuniam suam dissipaverunt
    in rebus inutilibus, et quia scientiam, quam protinus indagassent nobilissimam amittunt.'
  translation_ja: 同じように術者は節度を保ち、怒ることに慎重であるべきである。怒りの衝動のために、始めたものを突然壊し、台無しにしないためである。また、自らの金銭を守り、自信過剰になって無駄に費やしてはならない。術を発見できなかった場合、貧困の惨めさと絶望の中に取り残されるからである。あるいは、探究によって術の目的に近づいたころには費用を使い果たし、不幸にも貧困のために、真の目的を無理に断念しなければならなくなるかもしれない。初めのうち無知な者が、全財産を浪費してしまい、術に近づいたときには、もはや作業を続ける資金がない、ということが起こる。このような者は二重の悲しみに埋もれる。無益なことに金銭を散らしたためであり、また、ほどなく探り当てたはずの最も高貴な学知を失うためである。
  notes:
  - 原刊正誤表（28頁・15行）に従い、「nec praesumptuosus」と読む。
  - 原刊正誤表（28頁・16行）に従い、「distribuat, ne si forte」と読む。
  source_printed_page: 28
  source_pdf_page: 50
  source_erara_pdf_page: 55
- id: geber-summa-b01-c007-004
  section_id: geber-summa
  book: 1
  chapter: 7
  kind: body
  source_la: Non enim oportet tua bona consumere, quoniam vili precio (si artis principia non ignoraveris,
    et ea quae tibi tradidimus, recte intellexeris) ad complementum magisterii pervenies. Si ergo aes
    tuum perdideris, non attendendo nostra monita, quae tibi in hoc libello scripsimus aperta et manifesta,
    nos non inique corrodas, nec nobis blasphemias iniungas, sed tuae imputa ignorantiae et praesumptioni.
    Igitur haec scientia non bene convenit pauperi vel indigenti, sed potius est ei inimica et adversaria.
  translation_ja: あなたの財産を使い尽くす必要はない。この術の原理を理解し、私たちが伝えたことを正しく理解するなら、わずかな費用で術の完成に至るからである。それゆえ、本書で明瞭に書いた私たちの忠告を顧みず、金銭を失ったとしても、私たちを不当に責め、罵ってはならない。自らの無知と過信に責任を帰しなさい。したがって、この学知は貧しい者や困窮した者にあまり適さず、むしろその敵となり、対立するものとなる。
  notes:
  - 費用や成功可能性についての記述は著者の主張であり、経済的助言ではない。
  source_printed_pages:
  - 28
  - 29
  source_pdf_pages:

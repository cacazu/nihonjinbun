- id: geber-summa-b02-c084-002
  section_id: geber-summa
  book: 2
  chapter: 84
  kind: body
  source_la: 'Et hos gradus omnes narrabimus, cum complemento sermonis, et praeparationis modum complete
    cum causis suis, et experientiis manifestis: et modorum gradus administrationis pluris huius tertii
    ordinis. Alio etenim gradu eget Solaris medicina in pigmentorum praeparatione completa, alio vero
    Lunaris. Haec quidem Sulphuris administratione tingentis eam: illa vero non.'
  translation_ja: これらの全段階を十分に説明し、調製方法を、その原因と明白な経験とともに完全に述べ、さらにこの第三位の、より多くの処置に属する方法の段階を述べよう。着色剤の完全な調製において、金化薬の必要とする段階と、銀化薬の必要とする段階とは異なる。一方は薬を染める硫黄の処置を必要とし、もう一方は必要としない。
  notes: []
  source_printed_page: 183
  source_pdf_page: 203
  source_erara_pdf_page: 208
- id: geber-summa-b02-c085-title
  section_id: geber-summa
  book: 2
  chapter: 85
  kind: heading
  source_la: De medicina Lunari tertii ordinis. Cap. LXXXV.
  translation_ja: 第85章　第三位の銀化薬について。
  notes: []
  source_printed_page: 183
  source_pdf_page: 203
  source_erara_pdf_page: 208
- id: geber-summa-b02-c085-001
  section_id: geber-summa
  book: 2
  chapter: 85
  kind: body
  source_la: 'Primo igitur administrationis modum Lunaris medicinae narremus. Et est, ut accipias lapidem
    illius notum, et per separationis modum illius purissimam partem dividas, et seorsum ponas. Dehinc
    vero eius quae purissima est partis aliquid figas, et aliquid ex illa relinquas: et cum fixa fuerit,
    solve quod ex illa solubile fuerit: quod vero non fuerit solubile ad calcinationem mittas, ab hinc
    super idem solutionem reitera donec iterum quod ex ea solubile est, solvatur omnimode. Sic igitur
    ordo iste servetur, quousque maior solvatur quantitas. Post haec vero solutiones omnes simul commisce,
    et coagula. Dehinc vero leviter assando, in ignis temperamento conserva, quousque illi maior ad illius
    exigentiam ignis ministrari possit. Post hoc vero primum solutionis ordinem serva, quousque iterato
    totum solvatur quod ex eo est solubile, et iterato coagula, et iterato in ignis temperamento conserva,
    quousque iterato illi possit ignis maior ad eius perfectionem administrari. Omnes igitur hos ordines
    praeparationis super illa quater reitera, et ultimo calcina per modum suum: et sic preciosissimam
    lapidis terram sufficienter administrando rexisti.'
  translation_ja: まず銀化薬の処置方法を述べよう。すでに知られたその石を取り、分離の方法によって最も純粋な部分を分け、別に置く。次に、その最も純粋な部分の一部を固定し、一部を残す。固定したら、そのうち溶解するものを溶解し、溶解しないものは焼成に付す。それから、その同じものに溶解を繰り返し、その中の可溶部分が再びすべて溶けるまで続ける。この順序を守り、大部分が溶けるまで行う。その後、すべての溶液を合わせ、凝固させる。続いて、軽く焙焼しながら適度な火に保ち、その必要に応じて、さらに強い火を加えられるようにする。次に最初の溶解の順序を守り、可溶部分を再び全部溶かし、再び凝固させ、再び適度な火に保ち、完全化のため、さらに強い火をまた加えられるようにする。これらの調製の全手順を四回繰り返し、最後に固有の方法で焼成する。こうして、石の最も貴重な土を、十分な処置によって整えたことになる。
  notes: []
  source_printed_pages:
  - 183
  - 184
  source_pdf_pages:
  - 203
  - 204
  source_erara_pdf_pages:
  - 208
  - 209
- id: geber-summa-b02-c085-002
  section_id: geber-summa
  book: 2
  chapter: 85
  kind: body
  source_la: Deinde vero servatae partis non fixae cum hac terrae parte administratae quantitatem per
    ingeniorum subtilem coniunge modum per minima. Et sit ingenium hoc intentionis levationis eius per
    modum sublimationis dictum, quousque fixum cum non fixo levetur totaliter. Quod si non eveniat, addatur
    illi iterato vicissim non fixae partis quantitas, quousque ad elevationem illius sufficiat. Cum igitur
    elevata fuerit, reiteretur illius sublimatio, quousque per hanc administrationis reiterationem figatur
    totum. Cum igitur totum fixum fuerit, iterato cum non fixae partis quantitate post quantitatem combibe,
    per ingenium tibi notum, quousque totum iterato levetur. Igitur iterato figatur, quousque fusionem
    praestet facilem, cum ignitione sua. Haec enim medicina est, quae omne perfectione diminutum corpus,
    omneque cuiuscunque argentum vivum generis, in Lunare perfectissimum transformat corpus.
  translation_ja: 次に、保存しておいた未固定部分の一定量を、この処置済みの土の部分へ、精妙な工夫によって最小部分まで結合させる。この工夫の目的は、前述の昇華法によって上昇させ、固定部分が未固定部分とともに全体として上昇するようにすることである。そうならなければ、未固定部分を一定量ずつ再び加え、上昇させるのに十分となるまで続ける。上昇したら、その昇華を繰り返し、この反復処置によって全体が固定されるまで続ける。全体が固定されたら、あなたの知る工夫によって、未固定部分を一量ずつ再び含ませ、全体が再び上昇するまで行う。それから再び固定し、赤熱を伴って容易に溶融するようにする。これこそ、完全さを欠くあらゆる金属体と、いかなる種類の水銀をも、最も完全な銀の金属体へ変える薬である。
  notes: []
  source_printed_page: 184
  source_pdf_page: 204
  source_erara_pdf_page: 209
- id: geber-summa-b02-c086-title
  section_id: geber-summa
  book: 2
  chapter: 86
  kind: heading
  source_la: De medicina Solari tertii ordinis. Cap. LXXXVI.
  translation_ja: 第86章　第三位の金化薬について。
  notes: []
  source_printed_page: 185
  source_pdf_page: 205
  source_erara_pdf_page: 210
- id: geber-summa-b02-c086-001
  section_id: geber-summa
  book: 2
  chapter: 86
  kind: body
  source_la: 'Solaris igitur huius medicinae praeparationi, non adurentis fiat additamentum Sulphuris,
    per modum figentem et calcinantem, cum astutiae industria administrati perfecte, atque solutionis
    modum multiplicem, cum reiteratione multa, quousque mundum fiat: his quidem administratione perfecta
    praeveniente, quae per sublimationem perficitur. Et est huius scilicet additamenti modus, per reiterationem
    partis non fixi lapidis, sublimationis, cum ingenio coniungendi quousque elevetur cum ea, et iterato
    cum illa figatur ut stet, et quanto huius complementi exuberantiae ordo reiteratur pluries, tanto
    et huius exuberantia medicinae multiplicatur magis, et illius magis augetur bonitas, et multiplicatur
    illius augmentum perfectionis maxime.'
  translation_ja: この金化薬の調製には、焼損させない硫黄を加える。その硫黄は、固定と焼成の方法、さらに幾度も繰り返す多重の溶解法によって、清らかになるまで、巧妙な手際で十分に処置したものでなければならない。これらに先立って、昇華によって達成される完全な処置を施す。この添加の方法は、未固定の石の部分の昇華を、結合の工夫とともに繰り返し、硫黄がその部分とともに上昇し、さらにそれとともに再び固定されて、とどまるようにすることである。この豊かな完成の手順を繰り返すほど、薬の豊かな効力はさらに増し、その良さは増大し、完成を増進させる力がきわめて大きくなる。
  notes: []
  source_printed_page: 185
  source_pdf_page: 205
  source_erara_pdf_page: 210
- id: geber-summa-b02-c086-002
  section_id: geber-summa
  book: 2
  chapter: 86
  kind: body
  source_la: 'Et nos quidem, ne mordeamur ab impiis, complementum narramus totum huius magisterii, sub
    brevi sermone completo et noto. Et est illius intentio, ut per sublimationis modum mundetur perfectissime
    lapis et illius additamentum: et ab hinc quidem cum ingeniorum modo volatile ex eis figatur. Dehinc
    vero fixum volatile fiat, et iterato volatile fixum. Et in hoc ordine completur arcanum preciosissimum,
    quod est super omne huius mundi scientiarum arcanum, et thesaurus incomparabilis. Et tu quidem exerciteris
    ad illum, cum laboris instantia maxima, et diuturnitate meditationis immensae. Cum illa enim invenies,
    et sine illa non. Et huic quidem medicinae reiteratio bonitatis administrationis, cum talis cautelae
    industria potest in praeparatione lapidis evenire, quousque argentum vivum mutet in infinitum Solificum
    verum et Lunificum, et non dependet nisi in multiplicatione illius.'
  translation_ja: 私たちは不敬な者に非難されないよう、この秘術の完成のすべてを、短く、十分で明瞭な説明にまとめよう。その目的は、昇華によって石とその添加物を最も完全に清め、次に工夫によって、それらの揮発するものを固定することである。その後、固定したものを揮発性にし、再び揮発性のものを固定する。この順序によって、この世のあらゆる学知の秘奥に優る最も貴重な秘奥、比類のない宝が完成する。最大限に不断の労苦を払い、計り知れないほど長く思索しながら、それに習熟せよ。それによってこそ見いだせるのであり、それなしには見いだせない。この薬に対し、そのような慎重な工夫を伴う良い処置を反復して石を調製すれば、水銀を無限に真の金または銀へ変えるまでに至りうる。それは、この薬を増強することだけにかかっている。
  notes:
  - 186頁1行は巻末正誤表に従い invenies とした。
  source_printed_pages:
  - 185
  - 186
  source_pdf_pages:
  - 205
  - 206

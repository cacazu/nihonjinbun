- id: geber-summa-b02-c065-003
  section_id: geber-summa
  book: 2
  chapter: 65
  kind: body
  source_la: 'Quid igitur sit quod post remotionem duorum non fixorum ex Iove, scilicet sulphuris et argenti
    vivi remansit, te certum reddere nos expedit: ut complete cognoscas ipsius Iovis compositionem. Est
    igitur illud lividum, ponderosum, ut plumbum: maiori tamen albedine plumbo participans. Est igitur
    plumbum purissimum. Et est in ipso aequalitas fixionis duorum componentium, argenti vivi scilicet,
    et sulphuris. Non autem aequalitas quantitatis: quoniam in commixtione vincit argentum vivum: cuius
    signum est facilitas ingressionis in illud argenti vivi in natura sua. Igitur si non maioris argenti
    vivi in illo esset quantitas, non adhaereret illi in natura sua sumptum de facili. Ideoque non adhaeret
    Marti, nisi subtilissimo ingenio: nec Veneri propter paucitatem argenti vivi in illa in commixtione
    sua. Ex hoc igitur patet, quia difficillime Marti adhaeret. Veneri vero facilius, propter maiorem
    copiam argenti vivi in ea: cuius signum est fusio illius facilis, Martis vero difficillima.'
  translation_ja: 錫から固定されない二つのもの、すなわち硫黄と水銀を除いた後に残るものが何であるかを、あなたに確実に知らせる必要がある。それによって、錫の組成を完全に知ることができるからである。残るものは鉛のように鉛色で重いが、鉛より白さを多く備える。したがって、それはきわめて純粋な鉛である。その中では、二つの構成要素である水銀と硫黄の固定度は等しい。しかし量は等しくない。混合物では水銀が優勢だからである。その証拠は、自然の状態の水銀が、容易にそこへ入り込むことである。もし内部の水銀の量が多くなければ、自然の状態で加えた水銀は容易には付着しない。だから水銀は、きわめて精妙な工夫をしなければ鉄には付着せず、銅にも、その混合物に水銀が少ないため、付着しない。したがって、鉄へ付着するのは最も困難である。銅へは、それより水銀が多いため、いっそう容易に付着する。その証拠は、銅が容易に溶融し、鉄は非常に溶けにくいことである。
  notes: []
  source_printed_pages:
  - 144
  - 145
  source_pdf_pages:
  - 164
  - 165

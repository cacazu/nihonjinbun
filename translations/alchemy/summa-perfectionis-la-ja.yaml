- id: geber-summa-b02-c059-002
  section_id: geber-summa
  book: 2
  chapter: 59
  kind: body
  source_la: Probamus itaque perfectivum esse illud manifestis experientiis. Nam videmus argentum vivum,
    argento vivo magis adhaerere, et eidem magis amicari, post illud vero aurum, et post haec argentum.
    Ideo ex hoc relinquitur, ipsum esse suae naturae magis. Alia vero corpora videmus non ad illa tantam
    conformitatem habere, et ideo ipsa veridice invenimus minus de illius natura participare. Et quaecunque
    videmus plus ab adustione salvare, illa consideramus plus illius naturae possidere. Ideoque relinquitur,
    ipsum argentum vivum esse perfectivum, et adustionis salvativum, quod est perfectionis ultimum.
  translation_ja: それが完全化する力を持つことを、明白な実験によって証明しよう。水銀は何より水銀に付着し、それと最もよく親和し、その次に金、続いて銀に親和することが観察できる。したがって、それ自体が、その本性をいっそう多く持つと結論される。他の金属体は、それほどの類似性を持たず、したがって水銀の本性への参与が少ないことが、確かに認められる。また、焼損からいっそうよく保護されるものほど、水銀の本性を多く持つと判断する。ゆえに水銀は、完全化する力を持ち、焼損から守るものである。これこそ完全性の究極である。
  notes:
  - 原刊正誤表の130頁20行「plus illius naturae」、22行「perfectivum」を採用。本文の「plus suam naturam」「perfectissimum」を訂正した。
  source_printed_page: 130
  source_pdf_page: 150
  source_erara_pdf_page: 155
- id: geber-summa-b02-c059-003
  section_id: geber-summa
  book: 2
  chapter: 59
  kind: body
  source_la: 'Secundus vero mundationis gradus est ad ipsius coagulationem. Et est ut sufficiat illi solummodo
    lavatio suae terreitatis per unam diem. Cuius modus hic est: Sumatur patella terrea, et in ea mittatur
    argentum vivum, super quod fundatur aceti fortissimi pauca quantitas, vel alterius rei consimilis,
    quae sufficiat ad cooperiendum illud. Post immittatur ad ignem lentum, ne ferveat, et agitetur continue
    cum digitis super fundum patellae, ut dividatur argentum vivum in similitudinem subtilissimi pulveris
    albi, donec totum acetum evaporaverit, et ipsum argentum vivum redeat. Postea vero quod feculentum
    et nigrum videris ex illo emanasse lava et abiice. Et haec iterata vice multiplica, quousque videris
    colorem suae terreitatis in clarum, mixtum albo et coelestino colore perfecte mutari, quod perfectae
    lavationis est signum. Cum igitur pervenerit ad illud, proiiciatur super ipsum medicina suae coagulationis,
    et coagulabitur in solificum, et lunificum secundum quod ipsa praeparata extiterit. Et ipsius narrationem
    in sequentibus ponemus.'
  translation_ja: 第二の浄化段階は、水銀を凝固させるためのものである。この場合は、一日かけてその土性を洗い流すだけで十分である。その方法は次のとおりである。土製の浅皿を取り、水銀を入れ、その上に、全体を覆うのに足りるだけの少量のきわめて強い酢、あるいはそれと同様の物を注ぐ。次に、煮立たないよう弱火にかけ、皿の底で指を用いて絶えずかき混ぜ、水銀をきわめて細かい白い粉に似た状態へ分ける。酢がすべて蒸発し、水銀そのものが再び現れるまで続ける。その後、そこから出た滓状の黒いものを洗い流し、捨てる。この操作を繰り返し、その土性の色が、白と空色の混じる明るい色へ完全に変わるまで続ける。これが完全な洗浄のしるしである。その状態になったら、凝固のための薬を水銀に投射する。すると、薬の調製のされ方に応じ、金の性質を持つもの、または銀の性質を持つものへ凝固する。その薬については、後で説明しよう。
  notes:
  - 原刊正誤表の131頁14行に従い「extiterint」を「extiterit」とした。指で扱う等の記述は歴史的原文の翻訳であり、現代の実施手順を勧めるものではない。
  source_printed_pages:

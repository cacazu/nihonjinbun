- id: geber-summa-b01-c051-title
  section_id: geber-summa
  book: 1
  chapter: 51
  kind: heading
  source_la: De Calcinatione, tam corporum, quam spirituum, cum causis et modis suis. Caput LI.
  translation_ja: 第51章　金属体と精気の焼成、およびその原因と方法について。
  notes: []
  source_printed_page: 105
  source_pdf_page: 125
  source_erara_pdf_page: 130
- id: geber-summa-b01-c051-001
  section_id: geber-summa
  book: 1
  chapter: 51
  kind: body
  source_la: Post igitur distillationis narrationem, sermonem nostrum tradamus de calcinatione. Est ergo
    calcinatio, rei per ignem pulverisatio, per privationem humiditatis partes consolidantis. Causa inventionis
    eius est, ut sulphureitas adustiva corrumpens et defoedans, per ignem deleatur. Diversificatur vero
    secundum diversitatem rerum calcinandarum.
  translation_ja: 蒸留について述べた後は、焼成について説明しよう。焼成とは、諸部分を固く結びつけている湿りを取り去ることにより、火によって物を粉末にすることである。それが発見された原因は、物を損ない汚す焼損性の硫黄性を、火によって除くことにある。焼成には、焼成する物の相違に応じた違いがある。
  notes: []
  source_printed_page: 105
  source_pdf_page: 125
  source_erara_pdf_page: 130
- id: geber-summa-b01-c051-002
  section_id: geber-summa
  book: 1
  chapter: 51
  kind: body
  source_la: Calcinantur igitur corpora, et calcinantur spiritus, et res aliae extraneae a natura horum,
    diversa tamen intentione. Quia igitur sunt corpora imperfecta, duorum scilicet generum. Dura videlicet,
    ut Venus et Mars. Mollia vero, ut Iuppiter et Saturnus, quae omnia calcinantur. Necesse fuit illa
    diversa intentione calcinari, generali scilicet, et speciali. Generali attamen una intentione calcinantur.
    Et est, ut sulphureitas illa corrumpens et defoedans deleatur per ignem. Sic enim comburitur omnis
    ex quacunque re sulphureitas adustiva, quae sine calcinatione deleri non potest. Quoniam ipsum corpus
    solidum est, et propter soliditatem et latitationem occultatae sulphureitatis in continuitate substantiae
    argenti vivi defenditur per illud ab adustione. Ideoque necesse fuit continuitatem eius separare,
    ut ignis liberius ad quamcunque minimam eius partem perveniens, sulphureitatem ex eo comburere possit,
    et non defendat ipsum continuitas argenti vivi in illo. Et est communis intentio similiter in illa
    depuratio terreitatis. Inventum est enim, quod corpora per reiterationem calcinationis et reductionis
    mundantur, ut monstrabimus in sequentibus.
  translation_ja: したがって、金属体も、精気も、これらと本性を異にする他の物も焼成されるが、その目的は異なる。不完全な金属体には二種がある。一つはウェヌスとマルスのような硬いもの、もう一つはユピテルとサトゥルヌスのような柔らかいものであり、どれも焼成される。これらは、共通の目的と、個別の目的という、異なる意図に従って焼成する必要があった。ただし、一つの共通の目的によっても焼成される。それは、物を損ない汚すあの硫黄性を、火によって取り除くことである。このようにして、どのような物からも、焼成なしでは除けない焼損性の硫黄性を、ことごとく燃やし去る。金属体は固体であり、その堅さと、水銀の実体の連続した内部に硫黄性が隠れていることのために、硫黄性は水銀によって焼損から守られている。それゆえ、その連続性を断ち、火がどのように小さな部分にもいっそう自由に届き、そこから硫黄性を燃やし去れるようにしなければならなかった。内部の水銀の連続性が、それを守らないようにするためである。同様に、土性を除いて精製することも、焼成の共通の目的である。後で示すように、焼成と金属体へ戻す操作を繰り返すことで、金属体が清められることが見いだされたからである。
  notes:
  - ウェヌスは銅、マルスは鉄、ユピテルは錫、サトゥルヌスは鉛の錬金術的名称。以下も同様。
  source_printed_pages:
  - 105
  - 106
  source_pdf_pages:
  - 125
  - 126
  source_erara_pdf_pages:
  - 130
  - 131
- id: geber-summa-b01-c051-003
  section_id: geber-summa
  book: 1
  chapter: 51
  kind: body
  source_la: Specialis vero calcinatio corporum mollium est, ut cum his duabus intentionibus sit intentio
    per eam illa indurare et ignire, ad quod pervenitur cum ingeniosa reiteratione calcinationis super
    illa. De qua in sequenti traditione determinare nos expedit. Invenimus enim per id ingenium manifeste
    ipsa indurari. Sed manifestius et citius Iuppiter induratur. Causa vero inventionis calcinationis
    spirituum est, ut ipsi melius figantur, et facilius solvantur in aquam. Quoniam omne calcinati genus
    fixius est, quam non calcinati, et facilioris solutionis. Quia partes calcinati magis subtiliatae
    per ignem, facilius cum aquis commiscentur, et in aquam convertuntur. Et hoc si expertus fueris, sic
    invenies se habere. Calcinatio vero aliarum rerum, facit ad exigentiam praeparationis spirituum et
    corporum. De qua latius a nobis determinabitur in sequentibus. Non autem est de perfectione harum
    aliquid talium.
  translation_ja: 柔らかい金属体に特有の焼成は、これら二つの目的とともに、それらを硬くし、赤熱させることを目的とする。それは、それらに対して工夫を凝らして焼成を繰り返すことによって達成される。この点は、後の説明で定める必要がある。私たちは、この工夫によって、それらが明らかに硬くなることを見いだした。ただし、ユピテルのほうが、いっそう明瞭に、より速く硬くなる。精気の焼成が発見された原因は、それらをよりよく固定し、より容易に水へ溶解させるためである。どの種類でも、焼成された物は、焼成されていない物より固定されていて、溶解しやすい。焼成された物の諸部分は、火によっていっそう微細になり、水と混ざりやすく、水へ変わりやすいからである。経験すれば、実際にそうなることが分かるであろう。他の物の焼成は、精気と金属体の調製に必要なことに役立つ。それについては、後で私たちがいっそう詳しく説明する。しかし、そのような他の物のいずれも、これらの完全化そのものを構成するのではない。
  notes: []
  source_printed_page: 106
  source_pdf_page: 126
  source_erara_pdf_page: 131
- id: geber-summa-b01-c051-004
  section_id: geber-summa
  book: 1
  chapter: 51
  kind: body
  source_la: Modus igitur ipsius calcinationis est diversus, propter diversitatem calcinandorum. Calcinantur
    enim corpora aliter, quam spiritus vel aliae res. Et corpora a se invicem diversa, similiter diversimode
    calcinantur. Corpora enim mollia unum modum habent generalem ad calcinationis intentionem, scilicet,
    quod ambo per solum possunt calcinari ignem, et per salis acuitatem, praeparati vel non praeparati
    ambo similiter.
  translation_ja: したがって、焼成する物が異なるため、焼成の方法も異なる。金属体は、精気や他の物とは別の方法で焼成される。また、互いに異なる金属体も、それぞれ異なる方法で焼成される。柔らかい金属体には、焼成の目的に向けた一つの共通の方法がある。すなわち、両者とも火だけで焼成でき、同様に、調製した塩でも、調製していない塩でも、その鋭さによって焼成できる。
  notes: []
  source_printed_pages:
  - 106
  - 107
  source_pdf_pages:
  - 126
  - 127
  source_erara_pdf_pages:
  - 131
  - 132
- id: geber-summa-b01-c051-005
  section_id: geber-summa
  book: 1
  chapter: 51
  kind: body
  source_la: Primus igitur modus per ignem solum sic perficitur, ut sumatur vas ferreum, vel terreum ad
    similitudinem parapsidis formatum, cuius structura sit firma, et coaptetur ad furnum calcinationis
    horum, taliter, quod sub illo possint carbones proiici et sufflari. Proiiciatur vero in fundum vasis
    illius plumbum vel stannum, quod super tripodem ferreum, vel tres lapideas columnas sedeat firmiter,
    et ad furni sui parietes similiter firmetur, quatuor vel tribus lapidibus coartantibus illud ad eos,
    ne vas moveri possit. Furni vero figura eadem sit cum forma furni magnae ignitionis, de quo narratum
    est iam, et narrabitur similiter sermone completiori. Accendatur igitur in illo furno ignis sub vase
    calcinationis, ad ipsius calcinandi corporis fusionem potens. Et cum ipsum corpus cutem nigram super
    se creaverit ignis calore, subtrahatur illa ab eo cum pala ferrea vel lapidea, quae se non permittit
    comburi ad infectionem calcis. Haec autem excoriatio tam diu continuetur, quousque ipsum corpus in
    pulverem convertatur. Quod si Saturnus fuerit, ad maiorem ponatur ignem, quousque in citrinissimum
    mutetur colorem calx eius. Si vero Iuppiter, similiter exponatur, et dimittatur, quousque in albedinem
    mutetur completam.
  translation_ja: 第一の、火だけを使う方法は、次のように行う。皿の形をした、丈夫な構造の鉄製または土製の容器を取り、これらを焼成する炉へ、その下に炭を投じ、風を吹き込めるように据える。その容器の底に鉛または錫を入れる。容器は鉄製の三脚、または三本の石柱の上にしっかり載せ、さらに三つか四つの石で炉壁へ押し付けるように固定し、動かないようにする。炉の形は、すでに述べ、後でもいっそう十分に説明する強熱炉と同じとする。その炉で、焼成容器の下に、焼成する金属体を溶かすのに十分な火を起こす。火の熱によって、金属体が表面に黒い皮を生じたら、燃えて灰を汚すことのない鉄製または石製の箆で、その皮を取り除く。金属体が粉末に変わるまで、この皮を剝ぐ操作を続ける。それがサトゥルヌスなら、さらに強い火にかけ、その灰がきわめて黄いろい色へ変わるまで加熱する。ユピテルの場合も同様に火にさらし、完全な白さへ変わるまで置いておく。
  notes: []
  source_printed_page: 107
  source_pdf_page: 127
  source_erara_pdf_page: 132
- id: geber-summa-b01-c051-006
  section_id: geber-summa
  book: 1
  chapter: 51
  kind: body
  source_la: In hoc tamen sollicitum reddimus artificem, quod Saturnus de facili a calce sua redit ad
    corpus. Iuppiter vero difficillime. Ideoque ne contingat illum errare in expositione Saturni, post
    primam eius pulverisationem, ad maiorem ignem, ne illius calx prius redeat in corpus, quam perficiatur,
    quoniam temperantia ignis indiget, et successione augmenti illius paulatim, cum cautela, quousque
    in calce firmetur sua, ne de facili redeat in corpus, ut possit illi maior ignis administrari, ad
    suae calcis perfectionem. Similiter ne contingat errare in Iove, propter difficilem eius reductionem,
    ut si quando posuerit in reductionem calcem eius, eveniat ei, quod non reducat, sed inveniat eam prioris
    dispositionis aut in vitrum redactam, et aestimet reductionem eius impossibilem. Dicimus enim, quod
    si in Iovis reductione magnum non adhibuerit ignem, non reducet. Si vero magnum, non necessario illum
    reducere contingit, sed possibile est illum in vitrificationem reducere. Et illud ideo, quia Iuppiter
    in profundo suae naturae argenti vivi fugitivam inclusam habet substantiam. Quae si longam in igne
    traxerit moram, fugiet, et corpus privatum humiditate relinquet, ita ut potius aptum ad vitrificationem,
    quam ad corporis metallici fusionem converti reperiatur. Omne enim propria privatum humiditate, nullam
    nisi vitrificatoriam dat fusionem. Ideo necessario relinquitur, ut cum ignis impetu maxime veloci,
    reducere celeriter festinet. Aliter enim non reducitur. Exercitetur ergo ad illud, et sciet.
  translation_ja: ただし、ここで術者に注意を促しておく。サトゥルヌスは、その灰から容易に金属体へ戻るが、ユピテルは非常に戻りにくい。したがって、サトゥルヌスを最初に粉末にした後、より強い火にさらす際に誤り、その灰が完成する前に金属体へ戻ってしまうことがあってはならない。火を加減し、注意しながら徐々に強め、その灰の状態で安定させる必要がある。そうすれば、容易に金属体へ戻らなくなり、その灰を完成するため、より強い火を加えられる。同様に、ユピテルを戻すことが難しいために、誤りが生じてはならない。その灰を金属体へ戻そうとして戻らず、以前のままであったり、ガラスになったりしたものを見て、戻すことは不可能だと考えることである。私たちはこう言う。ユピテルを戻すとき、強い火を用いなければ戻らない。しかし、強い火を用いても、必ず戻るわけではなく、ガラス化させることもありうる。それは、ユピテルが本性の奥に、逃散性の水銀の実体を閉じ込めているからである。それが火の中に長く留まれば、逃げ去り、湿りを奪われた金属体を残す。その結果、金属として溶融するより、ガラス化へ変わるのに適した状態となる。本来の湿りを失った物は、何であれ、ガラス化する以外の溶融を示さない。したがって、必然的に、きわめて急激な火の作用によって、速やかに戻すことを急がなければならない。それ以外の方法では戻らない。そこで、実習すれば分かるであろう。
  notes: []

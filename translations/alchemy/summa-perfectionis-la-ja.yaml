- id: geber-summa-b02-c080-003
  section_id: geber-summa
  book: 2
  chapter: 80
  kind: body
  source_la: Non autem diversificatur haec medicina a tertii ordinis medicina, nisi per minoris praeparationis
    imperfectionem. Et non diversificatur a se, quod in diversorum corporum proiectione et pigmentorum
    acceptatione constat, sed in modo praeparationis. Similiter et alia eget praeparationis industria
    corporum mollium medicina tenuitatem inspissans, alia vero durorum attenuans spissitudinem. Haec quidem
    ignis consumptivi modo, illa vero humiditatis conservationis administratione eget.
  translation_ja: この薬が第三位の薬と異なるのは、調製が少ないための不完全さだけである。また、異なる金属体への投与や着色剤の選択にあるものは、薬そのものの違いではなく、調製方法の違いである。同様に、軟らかい金属体の希薄さを濃くする薬と、硬い金属体の濃密さを薄める薬とでは、必要な調製の工夫が異なる。こちらは消耗させる火の方法を、あちらは湿気を保持する処置を必要とする。
  notes:
  - 末文の haec／illa（こちら／あちら）の対応は原文の指示語を保持した。直前の議論および第75章との関係から推定して入れ替えていない。
  source_printed_page: 177
  source_pdf_page: 197
  source_erara_pdf_page: 202
- id: geber-summa-b02-c081-title
  section_id: geber-summa
  book: 2
  chapter: 81
  kind: heading
  source_la: De medicina Lunari et Solari pro corporibus imperfectis. Caput LXXXI.
  translation_ja: 第81章　不完全な金属体のための銀化薬と金化薬について。
  notes: []
  source_printed_page: 177
  source_pdf_page: 197
  source_erara_pdf_page: 202
- id: geber-summa-b02-c081-001
  section_id: geber-summa
  book: 2
  chapter: 81
  kind: body
  source_la: 'Afferamus igitur sermonem universalem de medicinis huius secundi ordinis completum, cum
    determinatione certa et vera, et prius omnes Lunares omnium a perfectione diminutorum corporum cum
    differentiis praeparationis eorum. Dehinc vero Solares, cum propriis similiter differentiis. Probavimus
    autem iam ex nostris sermonibus, sulphur cuiuscunque generis perfectionis esse corruptivum. Argentum
    quippe vivum perfectivum est in operibus naturae completis regiminibus. Igitur et naturam mutantes
    minime, sed imitantes, in quibus nos sequi est possibile operibus. Et argentum similiter in huius
    operis magisterio vivum assumimus, in cuiuscunque perfectionis medicina, lunari scilicet et solari
    tam quidem imperfectorum quam et ipsius argenti vivi coagulabilis. Cum autem iam ex novissime dictis
    sermonibus duplicem medicinae differentiam diximus: aliam quidem corporum, aliam vero argenti vivi
    vere coagulabilis. Hinc quidem corporum prius, deinde vero argenti vivi narrationem medicinae tradamus
    certam.'
  translation_ja: 第二位の薬について、確実で真実な区分による全般的で十分な説明をしよう。まず、完全さを欠くすべての金属体に対する銀化薬を、調製上の相違とともに、次いで金化薬を、同じく固有の相違とともに述べる。すでに私たちの説明で、あらゆる種類の硫黄が完成を損なうことを示した。一方、水銀は、十分に整えられた自然の働きにおいて、完成をもたらすものである。ゆえに私たちは自然を変えず、追随できる操作において自然を模倣する。この秘術においても、水銀を、あらゆる完全化の薬、すなわち不完全な金属体と凝固しうる水銀そのものに対する銀化薬および金化薬に用いる。直前に薬を、金属体の薬と、水銀を真に凝固させる薬とに二分したので、ここではまず金属体の薬、次に水銀の薬について確かな説明を伝えよう。
  notes: []
  source_printed_pages:
  - 177
  - 178
  source_pdf_pages:
  - 197
  - 198
  source_erara_pdf_pages:
  - 202
  - 203
- id: geber-summa-b02-c081-002
  section_id: geber-summa
  book: 2
  chapter: 81
  kind: body
  source_la: 'Est igitur per se huius medicinae materia cuiuscunque generis unica: et est, quod iam sufficienter
    notum est. Assume igitur illud, et si vis ad Lunarem, secundum ordinem tibi promissum, exercitatum
    te redde, et praeparato illud cum modis huius magisterii notis. Quorum intentio est, ut puram ex illo
    substantiam dividas, et partem quidem figas, partem vero ad cerandum omittas: et sic totum magisterium
    prosequendo, donec compleas tentatam illius fusionem. Quod si se subito fuderit in duris, perfecta
    est: in mollibus vero e contra. Haec enim medicina super imperfectorum unumquodque proiecta, in Lunare
    perfectum mutat corpus, si quidem praeveniant huic medicinae praeparationes notae. Si vero non, diminutum
    relinquit: sed perficit in altera perfectionis differentia tantum, quantum ex huius generis medicinae
    ordinis administratione dependet. Quantum vero ex tertii, non praeveniente administratione aliqua,
    perficit in proiectione sola.'
  translation_ja: この薬の材料は、どの類のものでも、それ自体としてただ一つであり、すでに十分知られたものである。それを取り、銀化薬を望むなら、約束した順序に従って熟練し、この秘術の既知の方法で調製せよ。その目的は、そこから純粋な実体を分け、一部を固定し、別の一部を蝋化のために残すことである。こうして秘術の全工程を進め、溶融を試みて、それを完成するまで続ける。硬い金属体において速やかに溶けるなら、その薬は完成しているが、軟らかい金属体では逆である。この薬を不完全な金属体のいずれに投じても、既知の調製が薬に先立って行われていれば、完全な銀の金属体に変える。そうでなければ、不完全さを残し、この位の薬の処置に依存する範囲で、完成の一つの特性だけを整える。第三位に属するものは、前もって何の処置もなく、ただ投与するだけで完成させる。
  notes: []
  source_printed_pages:
  - 178
  - 179
  source_pdf_pages:
  - 198
  - 199
  source_erara_pdf_pages:
  - 203
  - 204
- id: geber-summa-b02-c081-003
  section_id: geber-summa
  book: 2
  chapter: 81
  kind: body
  source_la: Solaris vero huius secundi ordinis medicina imperfectorum cuiuscunque corporum est eadem
    materia, et administrationis eodem regimine communicans. In hoc tamen differentiam habet, scilicet
    in maiore partium per modos proprios digestionis subtiliatione atque Sulphuris subtili praeparationis
    regimine administrati commixtione, cum materia modo nota additio. Et est regimen scilicet ipsius,
    purissimi Sulphuris fixio, et solutio eius per modum. Cum hoc enim tingitur medicina, et cum hoc proiecta
    super unumquodque a perfectione diminutorum, complet in complemento solari, quantum ex huius secundi
    ordinis medicinae praeparatione dependet, administratione praeveniente nota et certa ipsius a perfectione
    diminuti corporis. Et super Lunam quoque proiecta, perficit eam in complemento solari peculioso multum.
  translation_ja: 一方、第二位に属し、いずれの不完全な金属体にも用いる金化薬は、材料が同じで、処置の運用も共通している。ただし、固有の消化の方法によって諸部分をさらに微細にすること、精妙な調製の運用を受けた硫黄を混ぜ、いま知られた材料に加えることの点で異なる。その硫黄の処置とは、最も純粋な硫黄を固定し、適切な方法で溶解することである。これによって薬は染められ、これとともに不完全な金属体へ投じられると、その金属体に既知で確かな前処置がなされていれば、第二位の薬の調製が及ぶ限り、金の完成へと仕上げる。また銀へ投じても、きわめて有益な金の完成へと仕上げる。
  notes: []
  source_printed_page: 179
  source_pdf_page: 199
  source_erara_pdf_page: 204
- id: geber-summa-b02-c082-title
  section_id: geber-summa
  book: 2
  chapter: 82
  kind: heading
  source_la: De medicina coagulante Argentum vivum. Cap. LXXXII.
  translation_ja: 第82章　水銀を凝固させる薬について。
  notes: []
  source_printed_page: 179
  source_pdf_page: 199
  source_erara_pdf_page: 204
- id: geber-summa-b02-c082-001
  section_id: geber-summa
  book: 2
  chapter: 82
  kind: body
  source_la: Secundum igitur praemissorum ordinem restat ex operis complemento, quod in primis nos determinaturos
    exhibuimus, ad medicinae Argenti vivi coagulantis ipsum narrationem transire. Dicimus igitur, quod
    ex eiusdem illius elicitur materia, scilicet ex noto in capitulis huius operis multiplicibus. Et illud
    ideo, quia cum fugitivum sit Argentum vivum de facili, absque inflammatione aliqua, medicina eget,
    quae subito ante fugam eius in profundo illi adhaereat, et illi per minima coniungatur, et illud inspisset,
    et sua fixione illud in igne conservet, quousque adveniat illi maioris ignis tolerantia, eius humiditatem
    consumentis, et convertat illud per hoc beneficium in momento in Solificum et Lunificum verum, secundum
    illud ad quod medicina fuerit praeparata. Cum igitur non inveniamus aliquid magis illi convenire,
    quam ipsum, quia suae naturae est, ideo propter hoc aestimavimus cum eo medicinam illius posse compleri,
    et ingeniati sumus formam medicinae illi per ingenia praestare.
  translation_ja: 前述の順序に従い、初めに定めると示した操作を完結するため、次は水銀を凝固させる薬の説明へ移る。この薬は、同じ材料、すなわち本書の多くの章ですでに知られたものから取り出される。その理由は、水銀が炎を上げることもなく容易に逃散するので、逃散する前にただちにその深部に付着し、最小の部分まで結合し、それを濃くし、自らの固定性によって火中に保つ薬を必要とするからである。それによって水銀は、湿気を消耗するより強い火に耐えられるようになり、薬が調製された目的に応じて、その恩恵により一瞬のうちに真の金または銀へ変わる。水銀そのものより水銀に適合するものは見いだされず、それは同じ本性をもつからである。そこで私たちは、水銀によってその薬を完成できると考え、工夫によって、それに薬としての形を与えたのである。
  notes: []
  source_printed_pages:
  - 179
  - 180
  source_pdf_pages:
  - 199
  - 200
  source_erara_pdf_pages:
  - 204
  - 205
- id: geber-summa-b02-c082-002
  section_id: geber-summa
  book: 2
  chapter: 82
  kind: body
  source_la: 'Et est scilicet, ut praeparetur cum modis suis iam dictis cum diuturnitatis laboris instantia,
    qua omnis illius subtilis substantia et purissima, alba quidem in Luna, citrina vero intensa in Sole
    perhibeatur perfecte. Et hoc quidem non completur ut citrinum creet, sine mixtione rei tingentis illud,
    quae suae est naturae. Dehinc vero cum hac purissima Argenti vivi substantia, perficiatur cum huius
    magisterii operis ingeniis, medicina, quae maxime Argento vivo adhaereat, et fundatur facillime, et
    illud coagulet. Convertet enim hoc in Solificum et Lunificum verum, cum praeparatione illius praehabita.
    Sed ex quibus maxime haec Argenti vivi substantia elici possit, solet quaeri. Et nos quidem respondentes
    narramus, quod in quibus est, ex illis elicitur. Est autem tam quidem in corporibus, quam et in ipso
    Argento vivo secundum naturam, cum unius sint reperta naturae. Sed in corporibus difficilius: in vivo
    autem argento propinquius, non autem perfectius. Igitur cuiuscunque generis sit medicina, tam quidem
    in corporibus, quam in ipsius Argenti vivi substantia lapidis preciosi indagatur medicina.'
  translation_ja: すなわち、すでに述べた方法を用い、長期にわたり不断の労苦で調製し、その微細で最も純粋な実体のすべてが、銀化の場合は白く、金化の場合は濃い黄色として完全に現れるようにする。ただし黄色を作るには、同じ本性に属し、それを染める物を混ぜなければならない。その後、この最も純粋な水銀の実体から、この秘術の工夫により、水銀へ非常によく付着し、きわめて容易に溶け、それを凝固させる薬を完成させる。必要な前調製があれば、これを真の金または銀に変えるからである。ところで、この水銀の実体は主に何から取り出せるのかと、よく問われる。私たちは、それが存在するものから取り出されると答える。それは自然に、金属体にも水銀そのものにも存在する。これらが一つの本性をもつことが見いだされるからである。ただし金属体ではより難しく、水銀ではより近道であるが、より完全というわけではない。したがって、薬がどの種類であれ、貴重な石の薬は、金属体にも、水銀そのものの実体にも探し求められる。
  notes:
  - 181頁5行の ipsius は巻末正誤表に従った。
  source_printed_pages:
  - 180
  - 181

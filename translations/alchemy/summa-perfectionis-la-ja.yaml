- id: geber-summa-b02-c091-title
  section_id: geber-summa
  book: 2
  chapter: 91
  kind: heading
  source_la: Cementi examen quomodo sit componendum et exercendum. Caput XCI.
  translation_ja: 第91章　セメント試験をどのように準備し、実施するか。
  notes: []
  source_printed_page: 193
  source_pdf_page: 213
  source_erara_pdf_page: 218
- id: geber-summa-b02-c091-001
  section_id: geber-summa
  book: 2
  chapter: 91
  kind: body
  source_la: 'Narremus igitur Cementi modum. Cumque cognitum nobis sit maxime necessarius in perfectionis
    examine, dicimus quod illius compositio est cum inflammabilibus rebus. Et sunt huius generis res omnes
    denigrantes, et fugientes, et penetrantes, et comburentes: sicut est vitriolum, sal ammoniacum, et
    aeris flos, et lapis fictilis antiqui contriti, et sulphuris minima quantitas, aut nihil, et virilis
    urina, cum similibus acutis, et penetrantibus. Incementantur igitur haec omnia cum urina virili, et
    super corporis illius tabulas tenues ponuntur, de cuius intentione sit probationis examinari iudicio.
    Dehinc vero tabulae conclusae in fictili vase extendantur super cratem ferream, ita tamen, quod una
    ex eis alteram non tangat, ut libere ignis virtus ad illas percurrat aequaliter, et sic triduo in
    igne forti conservetur fictile. Cautela tamen adhibeatur, ut igniantur tabellae, sed non fundantur.
    Post tertiam autem diem tabellas omni impuritate mundas invenies, si in perfectione illarum extiterit
    corpus. Si vero non, corruptas omnino et calcinatione combustas.'
  translation_ja: セメントの方法を述べよう。これは完成の試験に最も必要だと知られている。その組成には発火性の物を用いる。この類には、黒くし、逃散し、浸透し、焼損させるすべての物が属する。たとえば礬類、塩化アンモニウム、銅の花、古い陶器を砕いた石質、微量の硫黄、または硫黄を加えないもの、男の尿、その他同様に刺激性と浸透性をもつ物である。これらをすべて男の尿で練り固め、試験によって判定しようとする金属体の薄板の上に置く。次に、板を土器の中に収め、鉄格子の上に並べる。ただし互いに触れないようにし、火の力が自由に均等に届くようにする。こうして土器を強火に三日間保つ。その際、板を赤熱させても溶かさないように注意する。三日目の後、金属体が完全なものなら、板はあらゆる不純物を除かれている。そうでなければ、全面的に損なわれ、焼成によって焼き尽くされている。
  notes:
  - aeris flos（銅の花）は歴史的製剤名として直訳。sal ammoniacum は慣用に従い「塩化アンモニウム」としたが、原刊薬材の純度・組成を保証するものではない。
  source_printed_pages:
  - 193
  - 194
  source_pdf_pages:
  - 213
  - 214
  source_erara_pdf_pages:
  - 218
  - 219
- id: geber-summa-b02-c091-002
  section_id: geber-summa
  book: 2
  chapter: 91
  kind: body
  source_la: 'Quidam tamen ponunt ad inflammationem tabellas, absque compositionum cemento, et depurantur
    similiter, si perfectionis sint corpora. Si vero non, comburuntur omnino. Longiori tamen combustionis
    spatio in hoc ultimo egent examine, quod sola ignis inflammatione perficitur, quam quae cementi examinantur
    iudicio. Sed cum Luna quidem a Solis natura non multa distet differentia, pauco administrationis modo
    in iudicio cum illo quiescit: et neque separatio corporum fit ab invicem in his duobus examinis generibus,
    nisi propter diversitatem compositionis substantiarum eorum: quia ex eo resultat fusionis diversitas,
    et spissitudo et raritas: quae quidem separationis sunt causae, quia propter fortem illorum compositionem
    non corrumpitur illorum substantia a substantia corporis extranei, cum non fiat illorum per minima
    mixtio. Et ideo necesse est, illa de commixto a se invicem separari, sine corruptione totali illorum
    essentiae. Quamobrem administratio corporum imperfectorum completa, dignoscitur, cum eiusdem fusionis,
    et ignitionis, et soliditatis, administrationis reperta sunt ingenio.'
  translation_ja: しかし、配合したセメントを使わず、板を直接炎にさらす者もいる。完全な金属体なら、これも同様に精製される。そうでなければ、すっかり焼損する。ただし、この最後の試験は火の炎だけで行うので、セメントによる試験より長い燃焼時間を要する。銀の本性は金から大きく隔たっていないため、わずかな処置で、試験の際に金とともに残る。これら二種の試験で金属体が互いに分離するのは、その実体の組成が異なるからにほかならない。そこから溶融の相違、濃密さ、疎らさが生じ、これらが分離の原因となる。組成が強固であるため、最小部分まで混じらない異質な金属体の実体によって、その実体が壊されることはない。それゆえ、本質を全面的に損なわず、混合物から互いに分離せざるをえない。したがって、不完全な金属体への処置が完成したと分かるのは、処置の工夫によって、溶融、赤熱、堅固さが同じになったと認められるときである。
  notes: []
  source_printed_page: 194
  source_pdf_page: 214
  source_erara_pdf_page: 219
- id: geber-summa-b02-c092-title
  section_id: geber-summa
  book: 2
  chapter: 92
  kind: heading
  source_la: De Ignitione. Caput XCII.
  translation_ja: 第92章　赤熱について。
  notes: []
  source_printed_page: 194
  source_pdf_page: 214
  source_erara_pdf_page: 219
- id: geber-summa-b02-c092-001
  section_id: geber-summa
  book: 2
  chapter: 92
  kind: body
  source_la: Restat igitur ut capitulum de Ignitione tradamus. Dicimus igitur, quoniam corpora maximae
    perfectionis cum ignitione determinata, reperta sunt ignem suscipere, ante fusionem illorum. Et ideo
    dicimus, si alterationem illorum completam adinvenire conamur, necesse est ad fusionem illorum corpora
    administrata redigere. Et est scilicet, ut priusquam fundantur perfectionis corpora, ignitionem suscipiant
    cum inflammatione, coelestini coloris amoenitatis, priusquam perveniat illorum ignitio ad albedinem
    ignis, quam oculus nequaquam possit conspicere. Patet igitur ignitionem illorum perfectam compleri
    ante fusionem, cum rubore intenso, et non cum albedine, quam non possit conspicere oculus. Si enim
    priusquam igniantur administrata fundantur corpora, in complemento non sunt. Si vero et igniantur
    cum labore et ignis expressione forti, non est illorum administratio vera. Et hoc quidem in mollibus.
    Idem vero in solo Marte contingit colligi. Non enim non ignibilia de facili ignitionem praeparationis
    modo suscipiunt, neque non fusibilia fusionem rectam, quam in perfectis secundum naturam invenimus.
  translation_ja: 次に、赤熱についての章を示そう。最も完全な金属体は、溶融に先立って、定まった赤熱の仕方で火を受け入れることが見いだされる。したがって、完全な変成を見いだそうとするなら、処置した金属体を、それらと同じ溶融状態へ導かなければならない。すなわち、完全な金属体は、溶ける前に、美しい空色の炎を伴って赤熱する。その赤熱は、目で見ることのできないほどの火の白さへ達するより前に起こる。ゆえに、その完全な赤熱は溶融に先立って、強い赤さをもって完成し、目に耐えない白さをもって完成するのではない。処置した金属体が赤熱する前に溶けるなら、完成していない。また、労苦と強い火の圧力を要して赤熱する場合も、処置は真正ではない。これは軟らかい金属体についてである。同じことは、鉄だけについても認められる。赤熱しにくいものは、調製によって容易に赤熱を受け入れるわけではなく、溶けにくいものも、自然に完全な金属体に見いだされる正しい溶融を容易に受け入れるわけではない。
  notes: []
  source_printed_page: 195
  source_pdf_page: 215
  source_erara_pdf_page: 220
- id: geber-summa-b02-c092-002
  section_id: geber-summa
  book: 2
  chapter: 92
  kind: body
  source_la: Et si cum ignitione flammam amoenitate coelestini coloris non praetendant administrata, non
    est illorum completa administratio. Et si minuitur aliquid ponderis, coloris, pulchritudinis, ignitionis,
    et similium ex praeparamenti differentiarum bonitatis inventum astutia, non fuit sufficiens artificis
    indagatio. Reiterato igitur inquirat, donec inveniat cum modis divina bonitate collatis.
  translation_ja: また、処置したものが赤熱とともに美しい空色の炎を示さなければ、その処置は完成していない。工夫によって得た調製物の良い特性、すなわち重さ、色、美しさ、赤熱性などが少しでも減るなら、術者の探究は十分ではなかったのである。ゆえに、神の善意によって授けられた方法により見いだすまで、改めて探究せよ。
  notes: []
  source_printed_pages:
  - 195
  - 196
  source_pdf_pages:
  - 215
  - 216
  source_erara_pdf_pages:
  - 220
  - 221
- id: geber-summa-b02-c093-title
  section_id: geber-summa
  book: 2
  chapter: 93
  kind: heading
  source_la: De fusione. Cap. XCIII.
  translation_ja: 第93章　溶融について。
  notes: []
  source_printed_page: 196
  source_pdf_page: 216
  source_erara_pdf_page: 221
- id: geber-summa-b02-c093-001
  section_id: geber-summa
  book: 2
  chapter: 93
  kind: body
  source_la: In fusionis igitur narratione sufficientiam tradamus, secundum quod examen est corporum omnium
    ad ignitionem illorum certam. Dicimus igitur quod unica est perfectionis fusio cum ignitione, sed
    non cum cuiuscunque ignitionis genere, sed cum ignitione in qua non albescit omnino corpus, et cum
    ignitione in qua non sit fuscedo igni adveniens, et in qua non subito post ignitionem fundatur, et
    liquescat corpus ut fluat. Igitur cum se fuderit corpus ex minima ignis pressione debilis, aut sine
    ignitione, aut cum ignitione fusca, huius praeparationis necesse est corpus imperfectionis esse, unumquodque
    imperfectorum corporum, in artificio diminuto. Et si post fusionem infrigidari omittatur, et omnino
    subito in nigredinem illius vertatur ignitio, et ob hoc quidem prius quam durescat, ignitionem perdat,
    non est in complemento corpus, cuiuscunque generis illud extiterit. Sed iudicari quidem expedit mollitiei
    hoc corpus existere ex imperfectionis corporum generibus.
  translation_ja: 溶融について、すべての金属体をその確かな赤熱に照らして試験するものとして、十分に述べよう。完全な溶融はただ一つで、赤熱を伴う。しかし、どんな赤熱でもよいのではない。金属体が完全に白熱する赤熱でもなく、火に暗さを生じさせる赤熱でもなく、赤熱の直後にただちに溶けて流れるほど液化するものでもない。したがって、弱い火のごくわずかな圧力だけで、あるいは赤熱せず、または暗い赤熱をもって溶けるなら、その調製物は、不十分な技法による不完全な金属体の一つでなければならない。また、溶融後に冷えるままにして、その赤熱がただちに黒さへ変わり、固まる前に赤熱を失うなら、どの種類の金属体であっても完成していない。これは、不完全な金属体の類のうち、軟らかいものに属すると判断すべきである。
  notes: []
  source_printed_page: 196
  source_pdf_page: 216
  source_erara_pdf_page: 221
- id: geber-summa-b02-c093-002
  section_id: geber-summa
  book: 2
  chapter: 93
  kind: body
  source_la: 'Et si quidem cum ignis laboriosa expressione fortis et violenti fiat illius ante fusionem
    ignitio et radio fulgoris inaestimabilis albescentis omnino, iam non perfectionis, sed duritiei alteratum
    est corpus. Et ob hoc quidem si post illius fusionem ab igne tollatur, et subito indurescat ut non
    fluat manente illius ignitione fulgida, iam non Lunaris aut Solaris perfectionis corpus existit, cuiuscunque
    generis et praeparationis corpus fuerit administratum, sed sub Martis differentiarum natura ponatur.
    Patet igitur ex iam dictis, triplicem in fusibilibus ignitionem ante liquefactionem substantiarum
    illorum experimento recolligi: unam scilicet fuscam, alteram vero rubeam et claram, albissimam vero
    tertiam, radio fulgentem. Prima quidem est mollium: secunda perfectorum: tertia vero durorum corporum
    ratione et experimento probatur.'
  translation_ja: 一方、強烈で激しい火を労苦して加えることによって、溶融前の赤熱が起こり、測り知れない輝きの光線によって完全に白くなるなら、その金属体は完成したものではなく、硬いものへ変成したのである。したがって、溶融後に火から取り出して、明るい赤熱が残るのに、流れないほどただちに硬くなるなら、処置した金属体の種類や調製が何であっても、銀や金の完全さを備えたものではなく、鉄に特有の性質に属するとすべきである。以上から、溶融しうる物は、その実体が液化する前に、三種の赤熱を示すことが経験によって分かる。一つは暗いもの、次は赤く明るいもの、第三は最も白く、光線を発して輝くものである。第一は軟らかい金属体、第二は完全な金属体、第三は硬い金属体のものだと、理性と経験によって証明される。
  notes: []
  source_printed_pages:
  - 196
  - 197
  source_pdf_pages:
  - 216
  - 217
  source_erara_pdf_pages:
  - 221
  - 222
- id: geber-summa-b02-c093-003
  section_id: geber-summa
  book: 2
  chapter: 93
  kind: body
  source_la: 'Sed et qui harum omnium ignitionum desiderat gradum perquirere, omnia fusibilia conflet
    corpora, et ignis consideret sufficientiam ad fusionis perfectionem completam, et considerando recolligat
    omnium signorum fusionis gradus differentiam: et sic quidem inveniet: aliter vero non. Et hoc quidem
    tibi adducatur exemplar in omnibus a nobis determinatis atque determinandis examinationis maneriebus.
    Et haec itaque de fusione dicta sufficiant.'
  translation_ja: これらすべての赤熱の程度を究めたい者は、溶融しうるすべての金属体を溶かし、溶融を完全に達成するのに必要な火の強さを考察し、その観察から、溶融の程度を示すすべての徴候の相違をまとめよ。こうすれば見いだせるが、ほかの方法では見いだせない。これは、私たちが定めた、また今後定める、すべての試験方法についての手本とせよ。溶融については、以上で十分である。
  notes: []
  source_printed_page: 197
  source_pdf_page: 217
  source_erara_pdf_page: 222
- id: geber-summa-b02-c094-title
  section_id: geber-summa
  book: 2
  chapter: 94
  kind: heading
  source_la: De expositione corporum super vapores acutorum. Cap. XCIIII.
  translation_ja: 第94章　金属体を刺激性物質の蒸気にさらすことについて。
  notes: []
  source_printed_page: 197
  source_pdf_page: 217
  source_erara_pdf_page: 222
- id: geber-summa-b02-c094-001
  section_id: geber-summa
  book: 2
  chapter: 94
  kind: body
  source_la: 'Prosequentes igitur sermonis complementum, de corporum expositione super acutorum vapores
    narremus. Dicimus igitur, quod perfectionis videmus corpora super acutorum vaporem exposita, acrium
    videlicet, ponticorum et acetosorum, similiter omnino aut nihil florere, aut amoenissimum coelestinum
    florem emittere. Sed Solem purissimum non florere: Lunam vero, aut Solem non purum, super acutorum
    vapores exposita, florere comperimus, et coelestinum amoenissimum, amoenius Solem quam Lunam. Et ob
    hoc igitur naturam imitantes, et nos similiter in praeparatis colorem coelestinum creemus corporibus,
    qui per argenti vivi bonitatem perficitur, ut sufficienter a nobis narratum est in praecedentibus
    nostri sermonis. Quaecunque igitur praeparata corpora super vapores acutorum extiterint, et coelestinum
    non creaverint amoenitatis colorem, non sunt in praeparationis complemento totali.'
  translation_ja: 説明を完結するため、金属体を刺激性物質の蒸気にさらすことを述べよう。完全な金属体を、辛辣なもの、渋いもの、酢性のものといった刺激性物質の蒸気にさらすと、同様に、まったく花を生じないか、非常に美しい空色の花を生じることが観察される。最も純粋な金は花を生じないが、銀や純粋でない金は、刺激性物質の蒸気にさらすと、非常に美しい空色の花を生じ、金のほうが銀より美しいことが分かった。したがって、自然を模倣して、私たちも同様に、調製した金属体に空色を生じさせよう。それは水銀の良さによって達成されることを、前の説明ですでに十分述べた。ゆえに、調製した金属体が刺激性物質の蒸気にさらされても、美しい空色を生じなければ、調製は全面的には完成していない。
  notes:
  - flos／florere の「花」は金属表面に生じる着色物・析出物を指す当時の表現であり、その化学種は断定しない。
  source_printed_pages:
  - 197
  - 198
  source_pdf_pages:
  - 217
  - 218
  source_erara_pdf_pages:
  - 222
  - 223
- id: geber-summa-b02-c094-002
  section_id: geber-summa
  book: 2
  chapter: 94
  kind: body
  source_la: 'Itaque est ex corporibus quoddam, quod rubeum fuscum, aut citrinum fuscum viriditati admixtum
    colorem in examine ponticorum floret in superficie sua, ut huius generis est Mars. Quoddam vero viride
    fuscum in superficie floret, coelestino admixtum turbido, et huius generis est Venus. Quoddam vero
    album fuscum, et huius generis Saturnus comperitur. Quoddam vero album clarum, et huius generis est
    Iupiter. Quia igitur maxime perfectum corpus, minime floret, aut nihil: et si quid floret, tardissimo
    temporis floret spatio: et Iupiter quidem omnium tardissime inter diminuta a perfectionis complemento
    corpora gummositatem suam floret. Ideo per huius magisterii examen consideramus Iovem, maxime perfectioni
    approximare in opere maioris ordinis. Per hoc igitur examen perquiri poterit, in quo pertractati temperamenti
    genere consistat corpus, si recte horum consideraveris ordinem, quae narravimus in hoc capitulo. Sin
    autem non, tuae imputa temeritatis insipientiae.'
  translation_ja: 金属体の中には、渋い物による試験で、表面に暗赤色、または緑を帯びた暗黄色の花を生じるものがあり、鉄がこの類である。暗緑色に濁った空色が混じる花を表面に生じるものもあり、銅がこの類である。暗い白色を生じるものは鉛、明るい白色を生じるものは錫である。最も完全な金属体は、ごくわずかしか花を生じないか、まったく生じず、生じる場合も、非常に長い時間を要する。一方、錫は、完全さを欠く金属体のうち、樹脂状物の花を生じるのが最も遅い。このため、この秘術の試験によって、錫は上位の仕事において完成に最も近いと判断する。この章で述べた事柄の順序を正しく考察すれば、この試験によって、処理した金属体がどの混和性状に属するかを究められる。そうでなければ、自分の軽率な愚かさを責めよ。
  notes: []
  source_printed_pages:
  - 198
  - 199
  source_pdf_pages:
  - 218
  - 219
  source_erara_pdf_pages:
  - 223
  - 224
- id: geber-summa-b02-c095-title
  section_id: geber-summa
  book: 2
  chapter: 95
  kind: heading
  source_la: De Extinctione ignitorum. Caput XCV.
  translation_ja: 第95章　赤熱物の急冷について。
  notes: []
  source_printed_page: 199
  source_pdf_page: 219
  source_erara_pdf_page: 224
- id: geber-summa-b02-c095-001
  section_id: geber-summa
  book: 2
  chapter: 95
  kind: body
  source_la: 'In extinctionis igitur examine narrationem adducamus totalem. Est tamen multiplex illius
    experientia, in qua cognoscitur utrum in perfectione magisterium consistat. Primum igitur, si ignitum
    corpus in liquore extinguatur, et Lunare quidem album non fiat, et Solare citrinum fulgidum, sed in
    alienum mutetur colorem, non est in complemento alteratio magisterii. Ut si quidem in reiteratione
    suae ignitionis et extinctionis in aquis salium aut aluminum cuiuscunque generis administratione creatis,
    scoriam nigredini affinem in sua superficie pretenderit: aut extinctione illius in Sulphuribus, et
    ab extinctione, ignitionis reiteratione multa, evanuerit: aut nigredine foeda se infecerit: aut omnino
    per mallei compulsionem se confregerit, fallax est operis artificium.'
  translation_ja: 急冷試験について、十分に述べよう。この試験には多くの経験的な方法があり、秘術が完成に達しているかどうかを知ることができる。まず、赤熱した金属体を液中で急冷して、銀化したものが白くならず、金化したものが輝く黄色にならず、別の色に変わるなら、秘術による変成は完成していない。たとえば、いずれかの塩類や明礬類を処置して作った水の中で、赤熱と急冷を繰り返し、その表面に黒さに近い滓が現れる場合である。あるいは硫黄中で急冷し、その後何度も赤熱を繰り返すと消失する場合、醜い黒さで汚れる場合、または槌で打つとすっかり砕ける場合も、その技法は偽りである。
  notes:
  - 199頁14行は巻末正誤表に従い pretenderit とした。
  source_printed_page: 199
  source_pdf_page: 219
  source_erara_pdf_page: 224
- id: geber-summa-b02-c095-002
  section_id: geber-summa
  book: 2
  chapter: 95
  kind: body
  source_la: 'Aut si ex Salis ammoniaci, et viridis aeris, et puerilis urinae mixtionis cementatione,
    aut in natura consimilium, et ad ignitionem positum, et post ignitionem et extinctionem sui, ad extensionem
    similiter Lunare vel Solare ex toto colorem amiserit proprium, aut scoriam creaverit, in corruptione
    constat corpus adhuc permanere Sophistica. Unam tamen generaliter tibi tradimus regulam certam, quod
    tam in dictis quam a nobis dicendis examinibus, si quid ex perfectionis differentiis alteratum commutaverit
    corpus, ponderis videlicet aut coloris, non recte, sed fantastice indagavit artifex opus: quod non
    peculiosum, sed perditionis est potius.'
  translation_ja: あるいは、塩化アンモニウム、緑青、子供の尿の混合物、または同じ本性をもつものによるセメント処理の後、赤熱させ、続いて急冷し、同様に展延させたとき、銀化したものや金化したものが、本来の色を完全に失うか、滓を生じるなら、その金属体はまだ、見せかけによる不完全さにとどまっている。ただし、確実な一般則を一つ伝えよう。すでに述べた試験でも、これから述べる試験でも、変成した金属体が、重さや色など、完成の特性の何かを変えてしまうなら、術者は操作を正しくではなく、空想的に探究したのである。それは利益をもたらす仕事ではなく、むしろ破滅をもたらす仕事である。
  notes:
  - 199頁22行は巻末正誤表に従い similiter とした。
  source_printed_pages:
  - 199
  - 200
  source_pdf_pages:
  - 219
  - 220
  source_erara_pdf_pages:
  - 224
  - 225
- id: geber-summa-b02-c096-title
  section_id: geber-summa
  book: 2
  chapter: 96
  kind: heading
  source_la: De adurentis Sulphuris admixtione. Cap. XCVI.
  translation_ja: 第96章　焼損させる硫黄の混合について。
  notes: []
  source_printed_page: 200
  source_pdf_page: 220
  source_erara_pdf_page: 225
- id: geber-summa-b02-c096-001
  section_id: geber-summa
  book: 2
  chapter: 96
  kind: body
  source_la: 'Ex sulphuris igitur mixtione, utrum in perfectione consistat magisterium, approbatur similiter,
    quia experientia nostra invenimus sulphur corporibus commixtum, quaedam magis, quaedam vero minus
    comburere: et quaedam a combustione illius redire: quaedam vero non, nostro comperimus artificio.
    Et ex hoc itaque differentia notari potest inter ipsa a perfectione diminuta corpora praeparata in
    complemento sophistico. Igitur cum inter caetera corpora cuiuscunque invenimus generis, Solem minime
    per Sulphur comburi. Ab hinc vero et postea Iupiter, deinde vero Luna, post hoc Saturnus, et facilius
    quidem his omnibus Venus: facillime Mars per Sulphuris oleaginitatem comburitur. Ideo per hoc notatur
    quod magis, quod minus naturae perfecti approximat.'
  translation_ja: 硫黄との混合からも同じく、秘術が完成しているかどうかを確かめられる。私たちの経験では、金属体に混ぜた硫黄は、あるものを強く、あるものを弱く焼損させる。また、私たちの技法によって、その焼損から戻るものと、戻らないものとが見いだされる。これによって、見せかけの完成へ調製された、不完全な金属体同士の相違を認めることができる。あらゆる種類の金属体の中で、硫黄による焼損が最も少ないのは金である。その次が錫、次が銀、その後が鉛であり、銅はこれらすべてより容易に焼損する。鉄は硫黄の油性によって最も容易に焼損する。このことから、どれが完全なものの本性により近く、どれが遠いかが分かる。
  notes: []
  source_printed_page: 200
  source_pdf_page: 220
  source_erara_pdf_page: 225
- id: geber-summa-b02-c096-002
  section_id: geber-summa
  book: 2
  chapter: 96
  kind: body
  source_la: 'Et ex diversitate colorum post corporum combustionem perquiri potest, in quo alteratum genere
    ex suae naturae radice corpus consistat: quoniam Sol quidem citrinum intensum, aut rubeum clarum,
    Luna vero nigrum coelestino admixtum, Iupiter vero nigrum, modica rubedinis tinctura admixtum, Saturnus
    vero nigrum fuscum, multo rubori et lividitati admixtum, Venus vero nigrum, lividitati admixtum, multa
    praeexistente combustione Sulphuris, pauca vero praeexistente combustione nitidissime, et amoenum
    violaceum protendit ex Sulphuris commixtione colorem. Mars vero in omni combustionis genere nigerrimum
    fuscum colorem creat.'
  translation_ja: また、金属体を焼損させた後の色の違いから、変成した金属体が、その本性の根においてどの種類に属するかを究められる。金は濃い黄色または明るい赤、銀は空色を混じえた黒、錫はわずかな赤い染まりを帯びた黒、鉛は多くの赤みと青黒さを混じえた暗い黒を示す。銅は、硫黄による燃焼が多く先行していれば青黒さを帯びた黒を、燃焼が少しだけなら、硫黄との混合によって、非常に光沢のある美しい紫色を示す。鉄は、どのような燃焼でも、きわめて黒い暗色を生じる。
  notes: []
  source_printed_pages:
  - 200
  - 201
  source_pdf_pages:
  - 220
  - 221
  source_erara_pdf_pages:
  - 225
  - 226
- id: geber-summa-b02-c096-003
  section_id: geber-summa
  book: 2
  chapter: 96
  kind: body
  source_la: 'Ex reductione autem a Sulphuris combustione notatur similiter diversitas in corporibus.
    Quaedam vero redeunt, quaedam vero ignis expressione a reductione cum sulphure recedunt, aut totaliter,
    aut eorum quantitas maior: quaedam vero in suae naturae corpora, quaedam vero in aliud quam suae naturae
    redeunt a combustione ad corpus. Redeunt ad proprii naturam corporis, a Sulphuris combustione Sol
    et Luna, recedunt autem Iupiter et Saturnus. Iupiter autem aut totaliter, aut secundum sui maiorem
    partem. Saturnus vero non ex toto recedit, sed quandoque maior, quandoque vero minor illius deletur
    pars. Horum autem contingit diversitatem existere propter naturam rerum et corporum, et administrationis
    eorum in opere praeparationis differentiam, quia scilicet ex subita ignis expressione de reductione
    Iovem deleri contingit. Ex successiva vero et paulativa, et Saturnum et Iovem salvari. Eorum tamen
    reductio in alieni corporis potius quam proprii naturam vergit. In clarum quidem videlicet antimonium
    Iovis, in fuscum vero Saturni converti reductionem repertum experientia nostra extitit.'
  translation_ja: 硫黄による焼損から還元する際にも、金属体の相違が認められる。あるものは戻り、あるものは火の圧力によって、硫黄とともに還元から逃れ、全体またはその大部分が失われる。また、焼損から金属体へ戻るとき、本来の本性の金属体へ戻るものと、本来とは異なるものへ戻るものがある。金と銀は硫黄による焼損から本来の金属体の本性へ戻るが、錫と鉛は逃れる。錫は全部または大部分が逃れる。鉛は全部ではなく、ときには多く、ときには少なく失われる。この相違は、物と金属体の本性、さらに調製操作における処置の相違によって生じる。すなわち、急に火の圧力を加えると、錫は還元から失われるが、連続的に少しずつ加えると、鉛も錫も保たれる。しかし、その還元は、本来の金属体より、異なる金属体の本性へ向かう。私たちの経験では、錫の還元は明るいアンチモンへ、鉛の還元は暗いアンチモンへ変わることが見いだされた。
  notes:
  - antimonium は原刊の物質同定として訳した。現代化学上の元素変換を確認した記述ではない。
  source_printed_page: 201
  source_pdf_page: 221
  source_erara_pdf_page: 226
- id: geber-summa-b02-c096-004
  section_id: geber-summa
  book: 2
  chapter: 96
  kind: body
  source_la: 'Venerem vero minui, in ignis reductionis impressione: Martem vero magis contingit. Sed Veneris
    quidem est reductio ponderosa, et citrina fusca, et mollis, nigredinem participans, cum sui augmento
    ponderis corporis. Ex his igitur perquiri poterit omnium alteratorum natura corporum.'
  translation_ja: 還元の火の作用において銅は減少し、鉄はさらに多く減少する。しかし銅の還元物は重く、暗黄色で、軟らかく、黒さを帯び、その金属体の重さは増している。以上によって、変成されたすべての金属体の本性を究めることができる。
  notes: []
  source_printed_pages:
  - 201
  - 202
  source_pdf_pages:
  - 221
  - 222

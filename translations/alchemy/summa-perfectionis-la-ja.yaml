- id: geber-summa-b02-c066-title
  section_id: geber-summa
  book: 2
  chapter: 66
  kind: heading
  source_la: De natura Saturni, sive Plumbi. Cap. LXVI.
  translation_ja: 第66章　土星、すなわち鉛の本性について。
  notes: []
  source_printed_page: 146
  source_pdf_page: 166
  source_erara_pdf_page: 171
- id: geber-summa-b02-c066-001
  section_id: geber-summa
  book: 2
  chapter: 66
  kind: body
  source_la: Restat nos igitur de Saturno descriptionem ponere. Et dicimus, quod non diversificatur a
    Iove post calcinationis reiterationem, ad illius naturam reducto, nisi quod immundiorem habet substantiam
    a duabus substantiis commixtam grossioribus, sulphure scilicet et argento vivo. Et quod sulphur in
    illo comburens, est sui argenti vivi substantiae magis adhaesivum, et quod plus habet de substantia
    sulphuris fixi ad compositionem suam, quam Iupiter. Et harum probationes per experientias manifestas
    adducemus. Quod igitur ipsum sit maioris terreae feculentiae, quam Iupiter manifestatur per visum,
    et per lavacrum eius ab argento vivo, in hoc, quod plus per lavacrum emanat feculentiae ab eo, quam
    a Iove, et quod primum gradum calcinationis suscipit facilius quam Iupiter, quod est signum multae
    terreitatis. Nam corpora pluris terreitatis facilioris invenimus calcinationis, et terreitatis paucae
    difficilioris calcinationis. Et huius est probatio, difficillima Solis calcinatio completa. Et quod
    non rectificatur eius foeditas per calcinationis reiterationem sicut in Iove, quod est signum maioris
    foeditatis in principiis eius ex natura sua, quam Iovis.
  translation_ja: 残るのは、鉛の記述である。鉛は、焼成を繰り返して鉛の本性へ戻した錫とは、次の点を除いて異ならない。すなわち、硫黄と水銀という、より粗い二つの実体が混ざっており、その実体がいっそう不純であること、内部の燃焼する硫黄が水銀の実体にいっそう強く付着すること、そして組成の中に、錫より多くの固定された硫黄の実体を持つことである。これらの証拠を、明白な実験によって示そう。鉛が錫より多くの土性の滓を持つことは、外観と、水銀による洗浄から明らかになる。洗浄によって出る滓は錫より多く、また、焼成の第一段階を錫より容易に受け入れる。これは土性が多いしるしである。土性を多く持つ金属体は焼成されやすく、少なく持つものは焼成されにくいと認められる。その証拠が、金を完全に焼成することのきわめて大きな困難である。また、鉛の汚さは、錫の場合と違って、焼成を繰り返しても改善されない。これは、その原理に本性上備わる汚さが、錫より多いことのしるしである。
  notes: []
  source_printed_pages:
  - 146
  - 147
  source_pdf_pages:
  - 166
  - 167

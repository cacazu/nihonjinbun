- id: geber-summa-b01-c009-007
  section_id: geber-summa
  book: 1
  chapter: 9
  kind: body
  source_la: 'Similiter etiam in rebus naturalibus iste est ordo: quod facilius est eas destruere, quam
    construere. Sed vix aurum possumus destruere, quomodo igitur et construere praesumimus? Propter has
    igitur rationes sophisticas, et alias his minus apparentes, credunt hanc se artem divinam interimere.
    Hae omnes sunt persuasiones sophistarum, artem nostram simpliciter esse negantium. Rationes vero eorum,
    qui ex suppositione negant artem, ponam cum destructionibus illarum in sequentibus. Ab hinc vero ad
    harum interemptiones nunc positarum, transeundum a nobis est: prius ponentibus nobis super has veram
    intentionem, ad operis complementum.'
  translation_ja: 同じように、彼らはいう。「自然の事物には、作るより壊すほうが容易だという順序がある。しかし私たちは、金を壊すことさえほとんどできない。ならば、どうして作ろうとまで思うのか。」こうした詭弁的な論拠や、それよりもっと見かけ上の説得力に乏しい論拠によって、彼らはこの神的な術を打ち消したと信じる。以上が、私たちの術の存在を無条件に否定する詭弁家たちの説得のすべてである。ある仮定に基づいて術を否定する者たちの論拠は、後でその反駁とともに示す。ここからは、いま挙げた論拠の反駁に進む。ただし、その前に、作業の完成に関わる真の意図を、これらの問題について示しておかなければならない。
  notes: *id002
  source_printed_page: 34
  source_pdf_page: 56
  source_erara_pdf_page: 61
- id: geber-summa-b01-c010-title
  section_id: geber-summa
  book: 1
  chapter: 10
  kind: heading
  source_la: Occupatio, fieri nec posse, nec debere, quod ars naturam in omnibus differentiis proprietatum
    actionis imitetur, et quaedam de principiis metallorum erudita. Caput X.
  translation_ja: 第10章　予想される異論への先回り。技術は自然の作用の性質をあらゆる相違にわたって模倣できず、また模倣すべきでもないこと、および金属の原理についてのいくつかの教説。
  notes: *id002
  source_printed_page: 34
  source_pdf_page: 56
  source_erara_pdf_page: 61
- id: geber-summa-b01-c010-001
  section_id: geber-summa
  book: 1
  chapter: 10
  kind: body
  source_la: 'Dicimus itaque, quod principia, super quae actionem suam natura fundat, sunt durissimae
    compositionis, atque fortissimae: et sunt sulphur et argentum vivum, ut dicunt quidam philosophi.
    Igitur quia durissimae et fortissimae compositionis, difficillimae sunt etiam resolutionis, sed ut
    fiat inspissatio eorum ad invicem et induratio, taliter, quod fiat in eis contusio et extensio per
    mallei compulsionem, et non confractio: non est nisi per hoc, quod humidum viscosum in eorum ad invicem
    commixtione, salvatur per successivam in minera decoctionem.'
  translation_ja: そこで私たちはいう。自然が自らの作用の基礎とする原理は、きわめて硬く強固な組成を持つ。それらは、一部の哲学者によれば、硫黄と水銀である。きわめて硬く強固な組成を持つので、その分離も非常に難しい。しかし、それらが相互に濃密化・硬化し、槌打ちによって砕けるのではなく、打撃を受けて延びるようになるのは、混合中の粘りある湿りが、鉱脈内の連続的な煮熟によって保たれるためにほかならない。
  notes:
  - 原刊正誤表（35頁・5行）に従い、「contusio et extensio」と読む。
  source_printed_pages:
  - 34
  - 35
  source_pdf_pages:
  - 56
  - 57
  source_erara_pdf_pages:
  - 61
  - 62
- id: geber-summa-b01-c010-002
  section_id: geber-summa
  book: 1
  chapter: 10
  kind: body
  source_la: 'Sed regulam tibi tradimus, charissime fili, generalem: quod non fit inspissatio alicuius
    humidi, nisi prius fiat ex humido partium subtilissimarum exhalatio, et conservatio ex humido partium
    magis grossarum, si sit humidum in commixtione superans siccum, et vera mixtio sicci et humidi: ut
    humidum contemperetur a sicco, et siccum ab humido, et fiat haec substantia una in suis partibus homoeomera,
    et temperata inter durum et molle, et extensiva in contusione. Sed hoc non fit, nisi per diuturnam
    mixtionem humidi viscosi, et subtilis terrei per minima, quousque humidum idem cum sicco, et siccum
    cum humido fiat.'
  translation_ja: だが、最も愛するわが子よ、一般的な規則を伝えよう。湿ったものが濃密化するには、まず湿りのなかの最も微細な部分が蒸散し、より粗大な部分が保たれなければならない。混合において湿が乾に勝り、乾と湿が真に混合されているなら、湿は乾によって、乾は湿によって調和させられる。そしてこの実体は、その諸部分が同質の一つのものとなり、硬さと柔らかさの間に適度に調和し、打撃によって延びるものとなる。しかし、これが起こるには、粘りある湿と微細な土性のものが、ごく小さな部分に至るまで、長く混合されなければならない。湿が乾と同じになり、乾が湿と同じになるまでである。
  notes:
  - homoeomera は諸部分が同種・同質であることを指す。
  - 原刊正誤表（35頁・17行）に従い、「in contusione」と読む。
  source_printed_page: 35
  source_pdf_page: 57
  source_erara_pdf_page: 62
- id: geber-summa-b01-c010-003
  section_id: geber-summa
  book: 1
  chapter: 10
  kind: body
  source_la: 'Et huiusmodi subtilis vaporis non fit resolutio subito: imo paulatim, et in millibus annorum,
    et illud ideo, quia uniformis est substantia principiorum naturae, ergo si subito fieret ab eis superflui
    humidi resolutio, cum non differat humidum a sicco, propter fortem mixtionem, quam habent, huius utique
    rei solveretur humidum cum sicco, quare totum in fumum evanesceret, nec separari posset humidum a
    sicco in resolutione, propter fortem unionem, quam habent ad invicem. Huius itaque videmus manifestam
    experientiam in spirituum sublimatione, quia cum in eis per sublimationem fiat subita resolutio, non
    separatur humidum a sicco, nec siccum ab humido, ita ut dividantur in partes totaliter mixtiones eorum,
    sed tota ascendit eorum substantia, aut parum ex eorum componentibus dissolvitur.'
  translation_ja: このような微細な蒸気の分離は、突然には起こらず、徐々に、数千年をかけて起こる。その理由は、自然の原理の実体が均一だからである。もし、それらから余分な湿りを突然分離しようとすれば、その強い混合のために湿と乾が分かれていないので、その物の湿は乾とともに解放され、すべてが煙となって消えるだろう。相互の結合が強いため、分離において湿を乾から切り離せないのである。このことは、精気の昇華において明白に経験される。昇華によって突然の分離が起こるとき、湿は乾からも、乾は湿からも切り離されず、その混合が完全に部分へ分かれることはない。むしろ実体全体が昇るか、その構成成分のわずかな部分だけが解け離れるのである。
  notes: *id002
  source_printed_pages:
  - 35
  - 36
  source_pdf_pages:
  - 57
  - 58
  source_erara_pdf_pages:
  - 62
  - 63
- id: geber-summa-b01-c010-004
  section_id: geber-summa
  book: 1
  chapter: 10
  kind: body
  source_la: Resolutio ergo humidi subtilis fumosi, successiva, et diuturna et aequalis, est causa inspissationis
    metallorum. Hanc quoque facere non possumus inspissationem per hunc modum. Ergo in hac sequi naturam
    non valemus. Non enim possumus naturam in omnibus differentiis proprietatum actionis imitari. Nostra
    igitur intentio non est, in principiis naturam sequi, nec in proportione miscibilium elementorum,
    nec in modo mixtionis ipsorum adinvicem, nec in aequatione caloris inspissantis. Cum haec omnia sint
    nobis impossibilia, et penitus ignota. Restat ergo rationes sophistarum interimere, hanc excellentissimam
    scientiam per ignorantiam negantium.
  translation_ja: したがって、微細で煙状の湿りが、順次、長く、均等に分離されることが、金属の濃密化の原因である。しかし私たちは、この方法で濃密化を行うことはできない。したがって、この点では自然に従うことができない。自然の作用の性質を、そのあらゆる相違にわたって模倣することはできないのである。ゆえに、私たちの意図は、原理そのものにおいても、混合される元素の比率においても、それらの相互混合の仕方においても、濃密化する熱の均衡においても、自然にそのまま従うことではない。これらはすべて私たちには不可能であり、まったく未知だからである。残るのは、この最も優れた学知を無知ゆえに否定する詭弁家の論拠を打ち破ることである。
  notes: *id002
  source_printed_page: 36
  source_pdf_page: 58
  source_erara_pdf_page: 63

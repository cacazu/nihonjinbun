- id: geber-summa-b01-c011-001
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: Si dixerint ergo nos proportionem elementorum, et modum mixtionis eorum adinvicem, aequationem
    caloris metalla inspissantis, causas alias multas, et accidentia naturae actionem consequentia, ignorare.
    Concedimus eis utique, sed non propter hoc nostram scientiam divinam interimunt, quia nec scire volumus
    illa, nec possumus, nec ad opus nostrum possunt pervenire. Sed aliud ad hoc nobis principium assumimus,
    aliumque generationis metallorum modum, in quibus sequi naturam possimus.
  translation_ja: もし彼らが、私たちは元素の比率、それらの相互混合の方法、金属を濃密化する熱の均衡、その他多くの原因、自然の作用に伴う付帯的な事柄を知らない、と言うなら、私たちは確かにそれを認める。しかし、それによって私たちの神的な学知が打ち消されるわけではない。私たちは、それらを知ろうとも思わず、知ることもできず、それらを私たちの作業に持ち込むこともできないからである。その代わりに、別の原理と、別の金属生成の方法、すなわち私たちが自然に従うことのできるものを採用する。
  notes:
  - 原刊正誤表（36頁・22行）に従い、「Si dixerint ergo」と読む。
  source_printed_pages:
  - 36
  - 37
  source_pdf_pages:

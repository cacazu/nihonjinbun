- id: geber-summa-b02-c068-002
  section_id: geber-summa
  book: 2
  chapter: 68
  kind: body
  source_la: 'Sunt itaque unius generis transformanda imperfectionis corpora duo necessario: plumbum scilicet,
    quod μέλαν id est nigrum dicitur, et per artem Saturnus: et plumbum stridens, quod λευκόν id est album
    dicitur. Et in hac sententia Iupiter, quae a se invicem sunt diversa in sui occulti profundo ex radice
    suae naturae innata, et in manifesto similiter: quia Saturnus fuscus, lividus, ponderosus, et niger,
    sine stridore totaliter mutus. Iupiter autem albus, livens parum, multum vero stridens, et modico
    sono tinnitum adducens: quorum differentiam in profundo illorum tibi cum manifestis experientiis monstrabimus
    ex illarum causis necessariis. Ex quibus secundum magis et minus, praeparationis ordinem colligere
    bonae mentis artificem contingit.'
  translation_ja: したがって、一方の種類には、変成すべき不完全な金属体が、必ず二つある。すなわち、メラン、つまり黒いものと呼ばれ、この術では土星と呼ばれる鉛と、レウコン、つまり白いものと呼ばれ、ここでいう木星に当たる、きしむ鉛である。両者は、その本性の生来の根源に由来する隠れた深部においても、表面に現れる状態においても異なる。鉛は暗く、鉛色で重く、黒く、きしむ音もなく完全に無音である。これに対して錫は白く、わずかに鉛色がかり、大きくきしむ音を立て、小さな響きも生じる。両者の深部の相違は、その必然的原因から、明白な実験とともに示そう。それらから、健全な知性を持つ術者は、程度の大小に応じた調製の順序を導き出すことができる。
  notes:
  - ギリシア語の色名は原刊画像に従い μέλαν（黒）、λευκόν（白）と転記した。
  source_printed_page: 154
  source_pdf_page: 174
  source_erara_pdf_page: 179
- id: geber-summa-b02-c068-003
  section_id: geber-summa
  book: 2
  chapter: 68
  kind: body
  source_la: 'Primo igitur secundum ordinem corporum praeparationem narremus: postea vero et ipsius argenti
    vivi coagulabilis. Sed et primo unius generis, mollitiei scilicet, post hoc vero et alterius. Primi
    quidem generis corporum ponatur Saturni praeparatio et Iovis: postea vero et aliorum, secundum suum
    ordinem determinatum. Quia in praeparatione corporum nihil superfluum ex profundo ipsius removendum:
    sed ex manifesto potius.'
  translation_ja: そこで、まず金属体の調製を順序に従って述べ、次に凝固させうる水銀そのものの調製を述べよう。金属体でも、まず柔らかい種類を、その後に他の種類を取り上げる。第一の種類として、鉛と錫の調製を示し、その後、定めた順序に従って他の金属体を取り上げる。金属体の調製では、その深部から余分なものを除くのではなく、むしろ表に現れる部分から除かなければならないからである。
  notes: []
  source_printed_page: 154
  source_pdf_page: 174
  source_erara_pdf_page: 179
- id: geber-summa-b02-c069-title
  section_id: geber-summa
  book: 2
  chapter: 69
  kind: heading
  source_la: Imperfectorum metallorum defectum, medicina suppleri, superfluum vero praeparatione tolli
    oportere. Cap. LXIX.
  translation_ja: 第69章　不完全な金属の不足は薬によって補い、余分なものは調製によって除くべきこと。
  notes: []
  source_printed_page: 155
  source_pdf_page: 175
  source_erara_pdf_page: 180
- id: geber-summa-b02-c069-001
  section_id: geber-summa
  book: 2
  chapter: 69
  kind: body
  source_la: 'Saturni vero praeparatio multiplex adhibetur essentiae, et Iovis similiter, secundum ipsorum
    multiplicis perfectioni approximationis, aut elongationis ab ea gradum. Cum sit igitur aliud ex corrumpentibus
    quidem illorum profundo adveniens ex ipsorum naturae radice innata, sulphureitatis scilicet terreitas,
    atque impuritas terrae argenti vivi, illorum creationis principiis essentiali natura commixta. Aliud
    vero superveniens post primam illorum mixtionem corruptionem adducens, et sunt primi generis sulphureitas
    comburens, et illius impuritas, et argenti vivi substantia foeda: quae omnia sunt Saturni et Iovis
    perfectionis substantiam corrumpentia. Sed horum quidem alterum impossibile est removeri per alicuius
    industriae medicinam, primi ordinis. Alterum vero parvo adminiculo removeri contingit. Hoc quidem
    removendum esse impossibile advenit, propter hoc, quod in principiis naturae propriae huius generis
    corporum in veram essentiam commixta fuerunt, et vera essentia facta sunt. Ideoque cum non sit possibile
    veram rei cuiusque in natura removere essentiam, re permanente, non fuit possibile ab eis haec corrumpentia
    delere. Quamobrem igitur putaverunt quidam Philosophorum, per hoc ad artem non posse perveniri.'
  translation_ja: 鉛の実体にも、同じく錫にも、その完全性への近さ、あるいは完全性からの遠さのさまざまな度合いに応じて、複数の調製を施す。腐敗をもたらすものには、一方では、その本性の生来の根源から深部へ入り込むものがある。すなわち、硫黄性の土性と、水銀の土の不純さであり、生成の原理に本質的な本性として混ざっている。他方には、最初の混合の後に加わって腐敗をもたらすものがある。第一の種類に属するのは、燃焼する硫黄性、その不純さ、そして水銀の汚れた実体であり、これらはすべて、鉛と錫の完全性の実体を損なう。だが、その一方は、第一階級のいかなる技法の薬によっても除くことができず、他方は、わずかな助けによって除ける。除去が不可能であるのは、この種類の金属体の固有の本性の原理において、それらが真の本質へと混ざり合い、真の本質そのものとなったためである。どの物でも、その物を存続させたまま、自然における真の本質を取り除くことはできない。したがって、これらの腐敗要因を金属体から除くこともできなかった。そのため、ある哲学者たちは、この事情から、術を成し遂げることは不可能だと考えた。
  notes: []
  source_printed_page: 155
  source_pdf_page: 175
  source_erara_pdf_page: 180
- id: geber-summa-b02-c069-002
  section_id: geber-summa
  book: 2
  chapter: 69
  kind: body
  source_la: Sed nos quidem et nostro tempore hanc inquirentes scientiam, pervenimus ad hoc idem quod
    et similiter nullo ingeniorum praeparationis modo potuimus corpora illustrare, cum complemento sui
    fulgoris lucidi, quin contingeret illa ex toto infici, et denigrari potius. Propter hoc igitur et
    nos similiter in stupore adducti, multi temporis spacio sub desperationis umbraculo delituimus. Redeuntes
    tamen in nos ipsos, et nos ipsos torquentes immensae cogitationum meditationis afflictionibus, respeximus
    a perfectione corpora diminuta in profundo suae naturae foeda existere, et nihil ex eis fulgidum inveniri,
    cum in eis secundum naturam non sit. Non enim invenit in re quod in illa non est. Cum igitur nihil
    perfecti in illis inveniatur, necessario et in eisdem nihil superfluum inveniri relinquitur in diversarum
    substantiarum separatione in illis, et in profundo suae naturae. Ideoque per hoc invenimus aliquid
    diminutum in illis fuisse, quod compleri necessario accidit per materiam sibi convenientem, et diminutum
    complentem.
  translation_ja: 私たちも自分たちの時代に、この学知を探究して、同じ結論に到達した。どのような調製の工夫によっても、金属体を明るい光沢の完全な状態へ輝かせることはできず、むしろ全体が汚れ、黒くなってしまったのである。そのため私たちも当惑し、長いあいだ絶望の陰に身を隠していた。しかし、我に返り、果てしない思索と熟考の苦しみに自らをさらしながら、不完全な金属体は、その本性の深部で汚れており、自然には輝くものが内部に存在しないので、そこから輝くものを見いだせないと気付いた。ある物の中に存在しないものを、その物の中で見いだすことはできないからである。したがって、金属体の中に完全なものが見いだされない以上、その内部、その本性の深部で異なる実体を分離しても、余分なものは見いだされないと、必然的に結論される。こうして私たちは、金属体には何かが不足していること、そして、それに適合し、不足を補う材料によって、その不足を満たさなければならないことを見いだした。
  notes: []
  source_printed_page: 156
  source_pdf_page: 176
  source_erara_pdf_page: 181
- id: geber-summa-b02-c069-003
  section_id: geber-summa
  book: 2
  chapter: 69
  kind: body
  source_la: Est igitur diminutum in illis scilicet paucitas argenti vivi, et non recta spissatio eiusdem.
    Igitur complementum erit in illis argenti vivi multiplicatio, et spissatio bona, et fixio permanens.
    Hoc autem per medicinam ex illo creatam perficitur. Haec enim cum ex argento vivo sit in esse deducta,
    per beneficium illius luciditatis et splendoris, illorum fuscedinem palliando celat et tegit, et splendorem
    educit, et in fulgorem convertit. Cum enim argentum vivum in medicina praeparatum per nostrum artificium
    sit mundatum, et in substantiam purissimam et fulgidissimam redactum, proiectum super diminuta a perfectione
    illustrabit, et sua fixione perficiet. Hanc vero medicinam in sua narrabimus oratione. Relinquitur
    itaque ex praeiacentibus necessario, duplicem fore perfectionis inventionem necessariam, unam quidem
    per materiam quae de mixto substantiam foedam separat, alteram vero per medicinam quae illam sui fulgoris
    splendore palliando tegat, et illustrando decoret.
  translation_ja: その不足とは、すなわち水銀の少なさと、その濃密化が適切でないことである。したがって、それを補うのは、水銀を増やし、よく濃密化し、永続的に固定することである。これは、水銀から作られる薬によって達成される。この薬は水銀から存在へ導かれるため、その明るさと輝きの恩恵によって、金属体の暗い色を覆い隠し、輝きを引き出し、光沢へ変える。薬として調製された水銀は、私たちの技術で清められ、きわめて純粋で輝く実体に変えられているので、不完全なものへ投射すると、それを明るくし、自らの固定性によって完全化する。この薬については、その専用の説明の中で述べよう。以上から、完全性を見いだすためには、二つの方法が必要だと必然的に結論される。一つは、混合物から汚れた実体を分離する材料による方法であり、もう一つは、自らの光沢の輝きで汚れを覆い、明るくして美しくする薬による方法である。
  notes: []
  source_printed_pages:
  - 156
  - 157
  source_pdf_pages:
  - 176
  - 177
  source_erara_pdf_pages:
  - 181
  - 182
- id: geber-summa-b02-c069-004
  section_id: geber-summa
  book: 2
  chapter: 69
  kind: body
  source_la: 'Cum nihil igitur superfluum, sed potius diminutum, in profundo corporum contingat reperiri:
    si quid omnino superflui removeri expedit, necesse est id ex manifesto suae naturae superveniens,
    et tolli et moveri, diversis cum praeparationibus, quas in hac oratione nos expedit enarrare: primum
    quidem in eadem oratione Iovis et Saturni, ultimo vero et aliorum secundum ordinem.'
  translation_ja: 金属体の深部に見いだされるのは余剰ではなく、むしろ不足なので、もし何か余分なものを除く必要があるなら、それは本性の表に現れる部分へ後から加わったものであり、さまざまな調製によって取り除かなければならない。その調製を、ここで説明する。まず錫と鉛を同じ説明の中で取り上げ、最後に他の金属体を順に取り上げよう。
  notes: []
  source_printed_page: 157
  source_pdf_page: 177
  source_erara_pdf_page: 182
- id: geber-summa-b02-c070-title
  section_id: geber-summa
  book: 2
  chapter: 70
  kind: heading
  source_la: De praeparatione Saturni et Iovis. Cap. LXX.
  translation_ja: 第70章　鉛と錫の調製について。
  notes: []
  source_printed_page: 157
  source_pdf_page: 177
  source_erara_pdf_page: 182
- id: geber-summa-b02-c070-001
  section_id: geber-summa
  book: 2
  chapter: 70
  kind: body
  source_la: 'Praeparantur igitur Saturnus et Iupiter praeparationibus multiplicibus secundum maioris
    perfectioni approximationis necessitatem, communi scilicet, et speciali praeparationis modo. Communis
    quidem est, per gradus approximationis ad perfectionem multiplices. Est enim unus gradus approximationis
    scilicet fulgor ex substantia munda: alter vero durities, cum suae fusionis ignitione: tertio vero
    fixio, per remotionem suae fugitivae substantiae. Mundificantur igitur et fulgida fiunt tripliciter:
    aut per res mundificantes, aut per calcinationis modum et reductionis, aut per solutionem.'
  translation_ja: 鉛と錫は、完全性へいっそう近づける必要に応じ、共通の方法と固有の方法という、複数の調製によって調えられる。共通の方法には、完全性へ近づくいくつかの段階がある。第一は、清浄な実体から生じる光沢であり、第二は、溶融の際に赤熱を伴う硬さであり、第三は、揮発性の実体を除くことによる固定である。清めて輝かせる方法は三つある。すなわち、浄化する物を用いる方法、焼成と還元の方法、溶解の方法である。
  notes: []
  source_printed_pages:
  - 157
  - 158
  source_pdf_pages:
  - 177
  - 178
  source_erara_pdf_pages:
  - 182
  - 183
- id: geber-summa-b02-c070-002
  section_id: geber-summa
  book: 2
  chapter: 70
  kind: body
  source_la: 'Per res igitur depurantes mundantur dupliciter: aut in calcem redacta, aut in natura corporum.
    In calcem vero redacta purificantur in hunc modum: aut per sales, aut per alumina, aut per vitrum.
    Et est, ut cum corpus calcinatum extiterit, tunc infundatur super eorum calcem aluminum aut salium
    aqua, aut commisceatur cum ea vitrum, et reducatur in corpus. Hoc igitur toties super haec corpora
    alternata vice reiteretur, quousque munda complete se ostendant. Nam cum sales et alumina et vitrum
    fundantur fusione alia quam corpora, ideo ab illis separantur, et secum terream substantiam ducunt,
    relicta sola corporum puritate. In natura vero corporum similiter, et per eundem depurantur modum.
    Et est ut limentur subtilissime haec duo corpora: post hoc vero cum eisdem administrentur aluminibus,
    salibus, et vitro videlicet, et postea in corpus reducantur. Et sic alternata vice reiteretur, quousque
    mundiora appareant. Mundantur et per argenti vivi lavacrum, cuius modum attulimus.'
  translation_ja: 浄化する物を用いる場合には、灰にして清める方法と、金属体の状態で清める方法の二つがある。灰にしたものは、塩類、明礬類、またはガラスによって精製する。金属体を焼成したら、その灰へ明礬や塩の水を注ぐか、ガラスを混ぜ、その後、金属体へ還元する。この操作を交互に幾度も繰り返し、完全に清浄な状態を示すまで続ける。塩、明礬、ガラスは、金属体とは異なる仕方で溶けるため、金属体から分離し、土性の実体を伴い去り、金属体の純粋な部分だけを残すからである。金属体のままでも、同様の方法で精製する。二つの金属体をきわめて細かくやすりで削り、同じ物、すなわち明礬、塩、ガラスで処置し、その後、金属体へ戻す。この操作を交互に繰り返し、より清浄に見えるまで続ける。また、すでに方法を示した、水銀による洗浄でも清められる。
  notes: []
  source_printed_page: 158
  source_pdf_page: 178
  source_erara_pdf_page: 183
- id: geber-summa-b02-c070-003
  section_id: geber-summa
  book: 2
  chapter: 70
  kind: body
  source_la: 'Mundificantur et haec similiter utriusque generis corpora per reiterationis vicem calcinationis
    ad illa, et reductionis similiter, cum sufficientia sui ignis, quousque mundiora appareant. Per hanc
    enim mundantur a perfectione haec diminuta corpora, a duplici corrumpente substantia, hac quidem inflammabili
    et fugitiva, illa vero terrea feculentia. Et illud ideo, quia ignis omnem fugitivam substantiam elevat
    et consumit. Et idem ignis similiter in reductionis modo omnem substantiam terrae dividit cum proportione
    sua. Et hanc proportionem in alio nostro volumine, quod de perfectionis investigatione intitulatur
    conscripsimus: quod secundum ordinem hunc praecedit librum. In illo enim quaecunque investigavimus,
    secundum nostrae mentis rationem scripsimus, hic vero quod vidimus et tetigimus complete, secundum
    scientiae ordinem determinavimus.'
  translation_ja: これら二種類の金属体は、十分な火を用いて焼成と還元を交互に繰り返し、より清浄な姿になるまで続けることによっても、同様に清められる。この方法によって、不完全な金属体は、二つの腐敗要因、すなわち可燃性・揮発性の実体と、土性の滓から清められる。火は揮発する実体をすべて上昇させ、消耗させるからである。また、同じ火は、還元の際、適切な割合を保って、土の実体をすべて分離する。その割合は、順序として本書に先立つ、別著『完全性の探究について』に記した。そこには、精神の推論に従って探究したことをすべて書いたが、本書では、見て触れたことを、学知の順序に従って完全に明確化したのである。
  notes: []
  source_printed_pages:
  - 158
  - 159
  source_pdf_pages:
  - 178
  - 179
  source_erara_pdf_pages:
  - 183
  - 184
- id: geber-summa-b02-c070-004
  section_id: geber-summa
  book: 2
  chapter: 70
  kind: body
  source_la: 'Mundificantur et haec utique similiter per solutionem suae substantiae, cuius modum iam
    diximus, et per reductionem similiter eius, quod ex eis dissolutum extiterit. Invenitur enim illud
    mundius et perfectius quam alio quopiam praeparationis genere, hoc eodem praeparationis modo. Et huic
    modo non comparatur modus, nisi qui per sublimationem perficitur, et ideo huic aequipollet. Est et
    similiter praeparatio illis, induratio suae mollis substantiae, cum ignitione suae fusionis, et est,
    ut ingeniemur illis permiscere argenti vivi substantiam fixam in profundo illorum: aut sulphuris fixi,
    aut sui comparis, aut cum rebus duris, et non fusibilibus, sicut est calx Marchesitae et Tutiae. Haec
    etenim cum illis uniuntur et amicantur, et illa indurant, quousque non fundantur, antequam igniantur.
    Et per medicinam perficientem hoc idem completur similiter, cuius narrationem ponemus.'
  translation_ja: さらに、すでに方法を述べた、その実体の溶解と、そこから溶解したものを還元することによっても、同じく清められる。この調製方法によるものは、他のどの種類の調製によるものよりも清浄で完全であると認められる。この方法に比べられるのは、昇華によって行う方法だけであり、それはこの方法と同等の力を持つ。また、柔らかい実体を硬化させ、溶融時に赤熱を伴わせることも、これらの調製である。そのためには、固定された水銀の実体、あるいは固定された硫黄やその同類の実体を、金属体の深部へ混ぜ込む工夫をする。あるいは、マルカシータやトゥティアの灰のような、硬く溶けないものと混ぜる。これらは金属体と結合し、親和し、赤熱するまでは溶けないようになるまで硬化させる。同じことは、後で説明する完全化の薬によっても達成される。
  notes: []
  source_printed_page: 159
  source_pdf_page: 179
  source_erara_pdf_page: 184
- id: geber-summa-b02-c070-005
  section_id: geber-summa
  book: 2
  chapter: 70
  kind: body
  source_la: Et est similiter alius praeparationis modus, per remotionem suae fugitivae substantiae. Et
    hic quidem perficitur per conservationem illorum, post primum calcinationis gradum, in igne illis
    proportionali. Et quia ordo in modis praeparationis contingit necessario, ideo ponemus ordinem completum
    ex illis. Primo igitur mundetur ex eis omnis substantia fugitiva et adustiva corrumpens. Dehinc vero
    terrea superfluitas deleatur. Post hoc solvantur et reducantur, aut per lavacrum argenti vivi laventur
    complete. Et hic ordo utilis et necessarius est.
  translation_ja: もう一つの調製方法は、揮発性の実体を取り除くことである。これは、焼成の第一段階の後、それらに見合った火の中へ保つことで達成される。調製方法には必ず順序があるので、その完全な順序を示そう。まず、腐敗をもたらす揮発性・焼損性の実体をすべて除いて清める。次に、余分な土性を除く。その後、溶解して還元するか、水銀による洗浄で十分に洗う。この順序は有用であり、必要である。
  notes: []
  source_printed_pages:
  - 159
  - 160
  source_pdf_pages:
  - 179
  - 180
  source_erara_pdf_pages:
  - 184
  - 185
- id: geber-summa-b02-c070-006
  section_id: geber-summa
  book: 2
  chapter: 70
  kind: body
  source_la: 'Specialis attamen horum corporum praeparatio, primum quidem Iovis est multiplex. Una quidem
    per calcinationem: et per hanc induratur eius substantia magis, quod Saturno non evenit. Etiam per
    alumina similiter: haec enim proprie Iovem indurant. Altera vero per conservationem eius in igne suae
    calcinationis. Per hanc enim stridorem amittit, et corporum similiter fractionem: quod Saturno similiter
    non contingit, quia stridorem non habet, nec corpora frangit, et per calcinationis reiterationem similiter
    ab acuitate salis stridorem amittit. Saturni vero secundario est praeparatio specialis, scilicet per
    calcinationem a salis acuitate: per hanc enim induratur, et per talck specialiter dealbatur, et per
    Marchesitam et Tutiam. Modos vero omnes praeparationum determinavimus completius, in libro qui de
    perfectionis inventione intitulatur, quoniam in hoc abbreviavimus summas illarum.'
  translation_ja: ただし、これらの金属体に固有の調製もある。まず錫には、いくつかの方法がある。一つは焼成であり、これによってその実体はいっそう硬くなるが、鉛ではそうならない。明礬によっても同様であり、明礬はとくに錫を硬化させる。もう一つは、焼成用の火の中へ錫を保つことである。これによって、きしむ音と、他の金属体を脆くする性質を失う。鉛にはもともと、きしむ音も金属体を脆くする性質もないので、このことは起こらない。また、塩の鋭い作用による焼成を繰り返すことによっても、錫はきしむ音を失う。次に、鉛に固有の調製は、塩の鋭い作用による焼成であり、これによって硬くなる。また、タルクによって特によく白くされ、マルカシータとトゥティアによっても白くされる。調製のすべての方法は、『完全性の発見について』と題する書物で、さらに詳しく定めた。本書では、それらの要点を簡潔にまとめたからである。
  notes: []
  source_printed_page: 160
  source_pdf_page: 180
  source_erara_pdf_page: 185
- id: geber-summa-b02-c071-title
  section_id: geber-summa
  book: 2
  chapter: 71
  kind: heading
  source_la: De praeparatione Veneris. Cap. LXXI.
  translation_ja: 第71章　銅の調製について。
  notes: []
  source_printed_page: 160
  source_pdf_page: 180
  source_erara_pdf_page: 185
- id: geber-summa-b02-c071-001
  section_id: geber-summa
  book: 2
  chapter: 71
  kind: body
  source_la: 'Imitantes igitur praemissorum ordinem, durorum corporum praeparationes narremus. Primo igitur
    Veneris, deinde vero Martis. Est igitur Veneris multiplex praeparationis modus. Alius quidem per elevationem:
    alius vero sine elevatione perficitur. Per elevationem vero est modus, scilicet, ut accipiatur tutia,
    cum qua Venus magis convenit, et cum ea per ingenia uniatur. Deinde vero in suo sublimationis vase
    ponatur ad sublimandum, et per excellentissimum gradum ignis, eius elevetur pars subtilior, quae fulgidissimi
    splendoris inventa est. Vel cum sulphure misceatur per minima, et postea elevetur per modum suum elevationis
    iam dictum.'
  translation_ja: 前に示した順序に従い、硬い金属体の調製を述べよう。まず銅、次に鉄を取り上げる。銅の調製には複数の方法があり、一つは上昇によって、もう一つは上昇させずに行われる。上昇による方法は次のとおりである。銅がよく適合するトゥティアを取り、工夫を用いて銅と結合させる。次に、昇華用の容器へ入れ、最高度の火によって、そのいっそう精妙な部分を上昇させる。その部分は、きわめて明るい光沢を持つと認められた。あるいは、銅を硫黄と最小の部分に至るまで混ぜ、前に述べた上昇の方法によって上昇させる。
  notes: []
  source_printed_page: 161
  source_pdf_page: 181
  source_erara_pdf_page: 186
- id: geber-summa-b02-c071-002
  section_id: geber-summa
  book: 2
  chapter: 71
  kind: body
  source_la: 'Sine sublimatione vero praeparatur, aut per res mundificationem facientes, aut in calce
    sua, aut in corpore, velut tutia, sales, et alumina: aut per argenti vivi lavacrum, cuius modum attulimus:
    aut per calcinationes et reductiones, ut in aliis narratum est: aut per solutiones et reductiones
    eius quod solutum est ad naturam corporis: aut per argenti vivi lavacrum mundificatur, sicut et corpora
    reliqua a perfectione diminuta.'
  translation_ja: 昇華を用いない場合は、灰の状態、あるいは金属体の状態で、トゥティア、塩類、明礬類などの浄化する物によって調製する。また、すでに方法を示した水銀による洗浄、他の金属体について述べた焼成と還元、あるいは溶解と、溶解したものを金属体の本性へ戻す還元によっても調製する。あるいは、他の不完全な金属体と同様に、水銀による洗浄で清める。
  notes:
  - 水銀洗浄への言及は原刊で二度現れるため、反復も保持した。
  source_printed_page: 161
  source_pdf_page: 181
  source_erara_pdf_page: 186
- id: geber-summa-b02-c072-title
  section_id: geber-summa
  book: 2
  chapter: 72
  kind: heading
  source_la: De praeparatione Martis. Cap. LXXII.
  translation_ja: 第72章　鉄の調製について。
  notes: []
  source_printed_page: 161
  source_pdf_page: 181
  source_erara_pdf_page: 186
- id: geber-summa-b02-c072-001
  section_id: geber-summa
  book: 2
  chapter: 72
  kind: body
  source_la: 'Martis vero praeparatio est similiter multiplex. Quaedam enim per sublimationem est: quaedam
    vero sine sublimatione completur, quae vero per sublimationem fit cum arsenico, cuius modus hic est.
    Ingeniemur quam profundius possumus eidem arsenicum non fixum unire, ut cum fusione cum eo liquescat.
    Postea vero sublimetur in vase propriae sublimationis. Et haec praeparatio melior et perfectior inter
    caeteras reperitur. Est et alia praeparatio ipsius Martis per arsenicum, sublimatum ab eo multoties,
    quousque maneat quantitas aliqua ipsius arsenici. Hoc enim si reductum fuerit, emanabit album fusibile
    mundum praeparatum. Est et similiter modus tertius praeparationis eiusdem per fusionem illius cum
    plumbo et tutia. Ab his enim fluit mundum et album.'
  translation_ja: 鉄の調製も同じく複数ある。昇華によるものと、昇華なしで行うものがあり、昇華によるものは砒素を用いる。その方法は次のとおりである。固定されていない砒素を、できるかぎり深く鉄へ結合させ、溶融の際、砒素とともに液化するよう工夫する。次に、専用の昇華容器で昇華させる。この調製は、他の方法に比べて、よりよく、より完全であると認められる。また、砒素を鉄から幾度も昇華させ、砒素の一定量が残るまで続ける、別の調製もある。これを還元すると、白く、溶融性があり、清浄に調製されたものが流れ出る。さらに第三の方法として、鉛とトゥティアとともに鉄を溶融する調製がある。これらから、清浄で白いものが流れ出る。
  notes: []
  source_printed_pages:
  - 161
  - 162
  source_pdf_pages:
  - 181
  - 182
  source_erara_pdf_pages:
  - 186
  - 187
- id: geber-summa-b02-c072-002
  section_id: geber-summa
  book: 2
  chapter: 72
  kind: body
  source_la: 'Sed quoniam ne minus sufficienter dixisse videamur, cum nos determinaturos esse promisimus
    de duorum corporum ingeniosa mollificatione, atque mollium induratione, per calcinationis modum, ideo
    illum non omittamus: sed mollium quidem primo, durorum vero postea. Et est scilicet, ut solvatur argentum
    vivum praecipitatum, et solvatur corpus calcinatum, de cuius intentione sit indurari. Et hae ambae
    solutiones misceantur, et ex eis alternata vice calcinatum corpus misceatur, terendo, et imbibendo,
    et calcinando, et reducendo, quousque durum fiat et cum ignitione fusibile. Hoc idem et cum corporum
    calce, et tutia et marchesita calcinatis, solutis, et imbibitis, perfici complete contingit. Et quanto
    quidem haec mundiora, tanto et perfectius mutant.'
  translation_ja: しかし、私たちは、焼成によって二つの金属体を巧みに柔らかくし、また柔らかい金属体を硬くすることについて詳しく述べると約束したので、説明が不十分と思われないよう、その方法を省かないでおこう。まず柔らかいもの、次に硬いものを取り上げる。沈降させた水銀を溶解し、硬くしようとする焼成済みの金属体も溶解する。この二つの溶液を混ぜ、これらを用いて、焼成した金属体に交互に混ぜ合わせ、すり潰し、湿潤させ、焼成し、還元する。硬くなり、赤熱とともに溶融するようになるまで続ける。同じことは、金属体の灰と、焼成・溶解・湿潤処理したトゥティアやマルカシータによっても、完全に達成できる。これらが清浄であるほど、変化もいっそう完全になる。
  notes: []
  source_printed_page: 162
  source_pdf_page: 182
  source_erara_pdf_page: 187
- id: geber-summa-b02-c072-003
  section_id: geber-summa
  book: 2
  chapter: 72
  kind: body
  source_la: Mollificantur similiter et dura corpora cum ingenio consimili. Et est scilicet, ut cum arsenico
    toties coniungantur et sublimentur, et post arsenici sublimationem assentur cum proportione sui ignis,
    cuius modum narravimus in libro fornacum. Et ultimo reducantur cum expressione sui ignis, in oratione
    sua dicti, quousque in fusione mollescant, secundum exigentiam duritiei corporis. Et hae quidem alterationes
    omnes sunt primi ordinis, sine quibus non perficitur magisterium.
  translation_ja: 硬い金属体も、同様の工夫によって柔らかくされる。砒素と結合させて昇華させることを繰り返し、砒素の昇華後は、『炉の書』でその方法を述べた、適切な度合いの火で焙る。そして最後に、その箇所で説明した火の強制作用によって還元する。金属体の硬さに応じ、溶融の際に柔らかくなるまで続ける。これらの変化はすべて第一階級のものであり、これらなしには秘術は完成しない。
  notes: []
  source_printed_pages:
  - 162
  - 163
  source_pdf_pages:
  - 182
  - 183
  source_erara_pdf_pages:
  - 187
  - 188
- id: geber-summa-b02-c073-title
  section_id: geber-summa
  book: 2
  chapter: 73
  kind: heading
  source_la: De mundificatione Argenti vivi. Cap. LXXIII.
  translation_ja: 第73章　水銀の浄化について。
  notes: []
  source_printed_page: 163
  source_pdf_page: 183
  source_erara_pdf_page: 188
- id: geber-summa-b02-c073-001
  section_id: geber-summa
  book: 2
  chapter: 73
  kind: body
  source_la: 'Igitur ex praemissis necesse est argenti vivi mundificationem complete narrare. Dicimus
    igitur quod Argentum vivum mundatur dupliciter. Aut per sublimationem, cuius attulimus modum. Aut
    per lavacrum, cuius modus hic est. Fundatur argentum vivum in patella vitrea vel lapidea, et super
    ipsum aceti quantitas superfundatur, quae sufficiat ad illud cooperiendum. Dehinc vero super lentum
    ignem ponatur, et calefieri permittatur, in tantum, ut digitis tractari patiatur. Deinde vero digitis
    agitetur, quousque in partes minutissimas dividatur, in pulveris similitudinem: et tam diu agitetur,
    quousque aceti totum quod in illo infusum est consumetur omnino. Deinde vero quod in eo terreitatis
    inventum sit, lavetur cum aceto, et abiiciatur. Toties igitur super illud opus reiteretur, quousque
    terreitas illius in coelestinum mutetur colorem perfectissimum, quod perfectae lavationis est signum.
    Ab his igitur ad medicinas est transeundum.'
  translation_ja: 以上を受け、水銀の浄化を完全に述べる必要がある。水銀は二通りに清められる。一つは、すでに方法を示した昇華によるもの、もう一つは洗浄によるものである。洗浄の方法は次のとおりである。ガラスまたは石の浅皿に水銀を注ぎ、その上に、水銀を覆うだけの量の酢を注ぐ。次に弱火にかけ、指で扱える程度まで温める。その後、指でかき混ぜ、粉のような非常に小さい部分へ分かれるまで続ける。注いだ酢がすべて完全に消費されるまで、かき混ぜ続ける。そして、そこに認められる土性のものを酢で洗い、捨てる。この操作を繰り返し、その土性が最も完全な空色へ変わるまで続ける。これが完全な洗浄のしるしである。それでは、これらから薬へと進もう。
  notes:
  - 水銀に指で触れる記述は歴史的原文の忠実な訳であり、現代の安全な取扱方法を示すものではない。
  source_printed_page: 163
  source_pdf_page: 183
  source_erara_pdf_page: 188
- id: geber-summa-b02-c074-title
  section_id: geber-summa
  book: 2
  chapter: 74
  kind: heading
  source_la: Quinque differentes proprietates perfectionis necessario afferre medicinam perfectissimam,
    scilicet munditiem, colorem, fusionem, perpetuitatem, et pondus, unde coniectura sumenda sit, ex quibus
    rebus eliciatur. Cap. LXXIIII.
  translation_ja: 第74章　最も完全な薬は、清浄さ、色、溶融、永続性、重さという、完全性の五つの異なる特性を必ずもたらすこと、そして、そこから何を材料として薬を取り出すかを推定すべきこと。
  notes: []
  source_printed_page: 163
  source_pdf_page: 183
  source_erara_pdf_page: 188
- id: geber-summa-b02-c074-001
  section_id: geber-summa
  book: 2
  chapter: 74
  kind: body
  source_la: Afferamus igitur in primis sermonem universalem de medicinis, cum causis suis, et experientiis
    manifestis. Innuimus igitur, quod nisi quidem omne superfluum sive per medicinam, sive per praeparationis
    modum auferatur ab imperfectis, scilicet ut ab illis tollatur omnis superflua sulphureitas, omnisque
    terreitas immunda, non perficiuntur ita scilicet, quod de commixto non separantur in fusione, post
    proiectionem medicinae alterantis illa. Cum hoc quidem inveneris, iam ex perfectionis differentiis,
    unam habes. Similiter utique nisi et medicina illustret, et alteret in colorem album aut citrinum,
    secundum intentionem quam quaeris, quae fulgoris splendorem, et amoenitatis luciditatem adducat, non
    perficiuntur a perfectione corpora diminuta in complemento totaliter.
  translation_ja: まず薬一般について、その原因と明白な実験を伴う説明を示そう。不完全なものから、薬によって、あるいは調製の方法によって、余分なものすべて、すなわち、余分な硫黄性と不純な土性がすべて取り除かれなければ、完全化は達成されない。ここでいう完全化とは、変化を与える薬の投射後、溶融させても混合物から分離しないことである。これを見いだしたなら、完全性を区別する特徴の一つを、すでに得たことになる。同様に、薬が明るくし、求める目的に応じて白または黄色へ変え、光沢の輝きと美しい明るさをもたらさなければ、不完全な金属体は全面的かつ完全には完成しない。
  notes: []
  source_printed_page: 164
  source_pdf_page: 184
  source_erara_pdf_page: 189
- id: geber-summa-b02-c074-002
  section_id: geber-summa
  book: 2
  chapter: 74
  kind: body
  source_la: Amplius autem, nisi fusionem Lunarem aut Solarem determinate adducat, non est in complemento
    alterabile, quia in iudiciis non quiescit, sed de commixto separatur omnino, et recedit. Hoc autem
    a nobis latius determinatum in sequentibus demonstratur in capitulo de cineritio. Amplius autem, et
    nisi perpetuet medicina cum impressionis alteratione firma, non valet ipsius mutatio, quia non permanet,
    sed evanescit impressio. Amplius autem, et nisi pondera perfectionis adducat, non mutat sub complemento
    naturae firmo et vero, cui non sit fraus per credulitatis errorem. Est enim pondus naturae unum ex
    perfectionis signis. Patet igitur, quod cum perfectionis differentiae quinque sint, necesse est et
    medicinam nostri magisterii has scilicet adducere in proiectione differentias.
  translation_ja: さらに、銀または金の溶融の性質を明確にもたらさなければ、完全に変化させることはできない。試験の際に留まらず、混合物から完全に分離して去るからである。この点は、後の灰吹きについての章で、いっそう詳しく示す。また、薬が、その作用による変化を堅固にして永続させなければ、変化には価値がない。作用の痕跡が持続せず、消えてしまうからである。さらに、完全性にふさわしい重量をもたらさなければ、思い込みの誤りによる欺きのない、確実で真実な本性の完成として変化させることはできない。本性に固有の重さは、完全性のしるしの一つだからである。したがって、完全性を区別する特徴が五つある以上、私たちの秘術の薬も、投射の際に、この五つの特徴をもたらさなければならないことが明らかである。
  notes: []
  source_printed_page: 164
  source_pdf_page: 184
  source_erara_pdf_page: 189
- id: geber-summa-b02-c074-003
  section_id: geber-summa
  book: 2
  chapter: 74
  kind: body
  source_la: Per hoc igitur patet, ex quibus medicina nostra eliciatur. Nam per ea elicitur, quae maxime
    corporibus adiunguntur, et amicabiliter eisdem in profundo adhaerent alterantia. Ideoque cum in rebus
    caeteris exquirentes, non invenimus inventione nostra rem aliam magis quam argentum vivum corporum
    naturis amicari, per hoc opus nostrum in illo impendentes, reperimus ipsum esse veram alterabilium
    medicinam in complemento, cum alteratione vera, et non modice peculiosa.
  translation_ja: このことから、私たちの薬を何から取り出すかが明らかとなる。それは、金属体と最もよく結び付き、その深部に親和的に付着して変化を与えるものから取り出される。そこで他の物を探究したが、私たちの発見では、水銀ほど金属体の本性と親和する物は見いだされなかった。したがって、水銀に私たちの作業を注いだ結果、水銀こそ、変化可能なものを完成へ至らせる真の薬であり、その変化は真実で、しかも少なからぬ利益をもたらすと認めた。
  notes: []
  source_printed_page: 165
  source_pdf_page: 185
  source_erara_pdf_page: 190
- id: geber-summa-b02-c075-title
  section_id: geber-summa
  book: 2
  chapter: 75
  kind: heading
  source_la: De praeparationibus medicinae adhibendis, ut differentias proprietatum debitas acquirat.
    Cap. LXXV.
  translation_ja: 第75章　薬が所要の特性を得るために施すべき調製について。
  notes: []
  source_printed_page: 165
  source_pdf_page: 185
  source_erara_pdf_page: 190
- id: geber-summa-b02-c075-001
  section_id: geber-summa
  book: 2
  chapter: 75
  kind: body
  source_la: 'Restat igitur nos substantiam ipsius et proprietatis substantiae differentias determinate
    adscribere. Et cum non invenerimus ipsum sine alterationis naturae illius administratione mutare,
    invenimus et similiter ipsum praeparari debere necessario, cum non permisceat in profundo, absque
    illius praeparationis modo. Et est scilicet, ut talis fiat illius substantia, quod permisceat in profundo,
    usque ad profundum corporis alterabilis, sine separatione in aeternum. Hoc autem non fit, nisi subtilietur
    valde cum praeparatione certa et determinata in capitulo sublimationis. Et non permanet eius impressio
    similiter, nisi figatur: nec illustrat, nisi fulgidissima ex illo eliciatur substantia, cum sui modi
    ingenio, et modo suae operationis per ignem congruum. Ea non praestat fusionem perfectam, nisi in
    illius fixione adhibeatur cautela, cum hac dura remollire, et mollia indurare. Est tamen talis, ut
    cum sufficientia servet suae humiditatis proportionatae, secundum exigentiam eius quae quaeritur fusionis.'
  translation_ja: そこで、その実体と、その実体に固有な性質の相違を明確に記さなければならない。その本性を変える処置なしには変成を起こさないことが分かった。また、調製という方法なしには深部で混じり合わないため、必ず調製しなければならないことも分かった。つまり、その実体を、変成される金属体の奥底まで深く混じり合い、永遠に分離しないものにするのである。これは、昇華の章で定めた確実な調製によって、きわめて微細にしなければ実現しない。同じく、固定されなければ、その作用は持続しない。また、適切な工夫と、ふさわしい火による操作によって、そこから最も輝かしい実体を取り出さなければ、光沢を与えない。それによって硬いものを軟らかくし、軟らかいものを硬くするよう、固定の際に注意を払わなければ、完全な溶融ももたらさない。ただしその処置は、求める溶融の必要に応じて調整された湿気を、十分に保つものでなければならない。
  notes: []
  source_printed_pages:
  - 165
  - 166
  source_pdf_pages:
  - 185
  - 186
  source_erara_pdf_pages:
  - 190
  - 191
- id: geber-summa-b02-c075-002
  section_id: geber-summa
  book: 2
  chapter: 75
  kind: body
  source_la: Per hoc ergo patet, quod ipsius talis praeparetur et administretur praeparatio, qua fulgidissima
    et mundissima substantia ex illo creetur. Deinde vero figatur, et cautela eidem exhibeatur, ut scilicet
    exercitetur artifex in administratione ignis, in modo suae fixionis, quod possit ex illo deleri humiditas
    in tantum, quod sufficiat ad fusionem perfectam complendam. Et est scilicet, ut si quaeris per hanc
    corpora fusionis dura mollificari, in principio suae creationis lentus adhibeatur ignis. Ignis enim
    lentus humiditatis est conservativus, et fusionis perfectivus. Si vero mollia indurare, ipsius componatur
    ignis vehemens. Talis enim ignis humiditatis est consumptivus, et fusionis turbativus. Et has quidem
    regulas omnes in omni medicina bonae mentis artificem necessario considerare expedit.
  translation_ja: したがって、そこから最も輝かしく清浄な実体が生まれるような調製を行い、施すべきことは明らかである。その後に固定する。このとき、術者は固定の方法における火の扱いに習熟し、完全な溶融を達成するのに足りる程度まで湿気を除けるよう、注意しなければならない。すなわち、この薬によって溶けにくい金属体を軟らかくしたいなら、薬を作り始める際に弱火を用いる。弱火は湿気を保ち、溶融を完成させるからである。逆に、軟らかいものを硬くするなら、強い火を設ける。そのような火は湿気を消耗させ、溶融を妨げるからである。良識ある術者は、いかなる薬についても、これらの規則をすべて必ず考慮すべきである。
  notes: []
  source_printed_page: 166
  source_pdf_page: 186
  source_erara_pdf_page: 191
- id: geber-summa-b02-c075-003
  section_id: geber-summa
  book: 2
  chapter: 75
  kind: body
  source_la: Et multas similiter alias in ponderis mutatione considerationes adducere necesse est, cum
    causis suis et ordine congruo. Est igitur causa ponderis magni, subtilitas substantiae corporum, et
    uniformitas in essentia. Per hoc enim tantum illorum possunt densari partes, ut nihil intercidat,
    et partium densatio ponderis est adductio, et illius perfectio.
  translation_ja: 重さの変化についても、原因と適切な順序とともに、ほかの多くの点を考慮する必要がある。大きな重さの原因は、金属体の実体の微細さと、本質の均一さである。これらによってのみ、その諸部分は、間に何も入り込まないほど密集できる。諸部分が密になることが、重さをもたらし、それを完成させるのである。
  notes: []
  source_printed_page: 166
  source_pdf_page: 186
  source_erara_pdf_page: 191
- id: geber-summa-b02-c076-title
  section_id: geber-summa
  book: 2
  chapter: 76
  kind: heading
  source_la: De differentiis medicinarum, scilicet quod quaedam sunt primi ordinis, quaedam secundi, quaedam
    vero tertii. Cap. LXXVI.
  translation_ja: 第76章　薬の相違、すなわち第一位・第二位・第三位の薬があることについて。
  notes: []
  source_printed_page: 166
  source_pdf_page: 186
  source_erara_pdf_page: 191
- id: geber-summa-b02-c076-001
  section_id: geber-summa
  book: 2
  chapter: 76
  kind: body
  source_la: Patet igitur, quod tam in corporum administrationis praeparatione, quam ipsius perficientis
    medicinae modo per operis artificia subtilitatem perquirere necessario contingit. Quia quanto maioris
    ponderis sunt corpora transmutata, tanto et maioris sunt perfectionis inventa, investigatione per
    artem. Completur igitur sermo utilis de medicinis, si omnium medicinarum differentias narremus. Innuimus
    quidem, quod medicinarum triplicem differentiam esse necessario accidit. Alia est primi ordinis, alia
    vero secundi, alia vero tertii.
  translation_ja: したがって、金属体に処置を施すための調製でも、それを完成させる薬の方法でも、操作の技法によって微細さを求めなければならないことは明らかである。術による探究では、変成された金属体は、重さが大きいほど、より完全であることが見いだされるからである。そこで、あらゆる薬の相違を述べれば、薬についての有益な説明が完結する。薬には必然的に三つの区別がある。一つは第一位、別のものは第二位、さらに別のものは第三位である。
  notes: []
  source_printed_pages:
  - 166
  - 167
  source_pdf_pages:
  - 186
  - 187
  source_erara_pdf_pages:
  - 191
  - 192
- id: geber-summa-b02-c076-002
  section_id: geber-summa
  book: 2
  chapter: 76
  kind: body
  source_la: 'Dico autem primi ordinis medicinam, omnem praeparationem mineralium, quae super diminuta
    a perfectione corpora proiecta, alterationem imprimit: quae non adducit complementum sufficiens, quin
    contingat alteratum mutari et corrumpi, cum evaporatione impressionis medicinae illius totali. Sicut
    est omnis sublimatio dealbativa Veneris, aut Martis, quae fixionem non suscepit. Et huiusmodi est
    omne additamentum coloris Solis, et Lunae, aut Veneri commixtorum, super furnum cementi positum, ut
    ziniar, et similium. Hoc enim mutat immutatione non stante, sed potius diminuente se per exhalationem.'
  translation_ja: 第一位の薬と呼ぶのは、鉱物のあらゆる調製物のうち、完全さを欠く金属体へ投じると変化を刻み込むが、十分な完成を与えず、薬の作用がすっかり蒸散するにつれて、変成物がまた変わり、損なわれてしまうものである。たとえば、固定を受けていない、銅または鉄を白くするあらゆる昇華物がこれに当たる。また、セメント炉上に置かれる、金・銀の色を増す添加物や、銅に混ぜる添加物、すなわちジニアルなども同類である。これによる変化は持続せず、むしろ蒸発によって減少していくからである。
  notes:
  - ziniar（ジニアル）は歴史的薬材名として原語を保持した。
  source_printed_page: 167
  source_pdf_page: 187
  source_erara_pdf_page: 192
- id: geber-summa-b02-c076-003
  section_id: geber-summa
  book: 2
  chapter: 76
  kind: body
  source_la: 'Secundi vero ordinis medicinam dicimus omnem praeparationem, quae quando super diminuta
    a perfectione corpora proiecta est, alterat in differentiam aliquam complementi, relictis differentiis
    aliquibus corruptionis omnino, velut est calcinatio corporum, qua omne fugitivum deletur. Et est huius
    generis medicina perpetue Lunam citrinans, aut perpetue Venerem dealbans, relictis aliis in eis corruptionis
    differentiis. Tertii vero ordinis medicinam appello, omnem praeparationem, quae quando corporibus
    advenit, omnem corruptionem cum proiectione sua tollit, et cum omnis complementi differentia perficit.
    Haec autem est unica sola. Et ideo per illam excusamur a laboribus inventionis decem medicinarum secundi
    ordinis. Primi igitur ordinis opus minus appellatur: secundi vero medium: tertii tandem maius. Et
    haec est omnium medicinarum differentia sufficiens.'
  translation_ja: 第二位の薬とは、完全さを欠く金属体へ投じると、完成のある一つの特性へ変える一方、腐敗に属するほかの特性をいくつか、そっくり残す調製物である。たとえば、揮発するものをすべて除く金属体の焼成がそれである。銀を永続的に黄色くする薬、または銅を永続的に白くする薬も、この類に入るが、これらはほかの欠陥を残している。第三位の薬とは、金属体に加わると、その投与によってあらゆる欠陥を取り除き、完成に属するすべての特性を備えさせる調製物である。これはただ一つしかない。それによって、第二位の十種の薬を発見する労苦を免れる。ゆえに、第一位の仕事は小なる仕事、第二位は中なる仕事、第三位は大なる仕事と呼ばれる。以上で、すべての薬の相違を十分に示した。
  notes: []
  source_printed_pages:
  - 167
  - 168
  source_pdf_pages:
  - 187
  - 188
  source_erara_pdf_pages:
  - 192
  - 193
- id: geber-summa-b02-c077-title
  section_id: geber-summa
  book: 2
  chapter: 77
  kind: heading
  source_la: De medicinis primi ordinis Venerem dealbantibus. Cap. LXXVII.
  translation_ja: 第77章　銅を白くする第一位の薬について。
  notes: []
  source_printed_page: 168
  source_pdf_page: 188
  source_erara_pdf_page: 193
- id: geber-summa-b02-c077-001
  section_id: geber-summa
  book: 2
  chapter: 77
  kind: body
  source_la: 'Ex ordinis igitur determinati promissione secuta (cum quidem alia sit medicina corporum,
    alia vero Argenti vivi, et corporum quidem alia primi ordinis, alia vero secundi, alia vero tertii,
    et Argenti vivi consimiliter) narremus omnium medicinarum differentias, primo primi ordinis, deinde
    vero secundi, postremo tandem tertii: et corporum quidem primo, postea vero Argenti vivi medicinam,
    cum sermone completo et ordine congruo, narratione tradamus. Dicimus igitur, quod primi ordinis medicina
    corporum, alia est durorum corporum, alia mollium. Durorum quidem corporum alia Veneris, alia Martis,
    alia vero Lunae. Veneris quidem et Martis, est pura illorum substantiae dealbatio, Lunae vero rubificatio,
    cum citrinitate fulgoris amoeni. Quia Veneri et Marti rubificatio non adducitur primi ordinis medicina
    cum fulgoris apparatione, quia ex toto immunda sunt, non apta rubedinis fulgorem recipere, priusquam
    illis adveniat praeparatio fulgorem adducens. Narremus igitur in primis Veneris medicinas omnes: postea
    vero Martis quae cadunt in ordine primo.'
  translation_ja: 定めた順序についての約束に従おう。金属体の薬と水銀の薬とは別であり、金属体の薬には第一位、第二位、第三位があり、水銀についても同様である。そこで、薬のすべての相違を、まず第一位、次に第二位、最後に第三位の順に述べる。また、まず金属体の薬、次に水銀の薬を、十分な説明と適切な順序をもって伝える。第一位の金属体の薬には、硬い金属体のためのものと、軟らかい金属体のためのものとがある。硬い金属体のためのものには、銅用、鉄用、銀用がある。銅と鉄の場合は、その実体を清らかに白くすることであり、銀の場合は、快い輝きをもつ黄色を伴って赤くすることである。第一位の薬によって銅と鉄を赤くしても、輝きは現れない。これらは全体に不浄であり、輝きをもたらす調製が先行しなければ、赤色の輝きを受け入れられないからである。そこで、最初に銅のすべての薬を、次に第一位に属する鉄の薬を述べよう。
  notes: []
  source_printed_pages:
  - 168
  - 169
  source_pdf_pages:
  - 188
  - 189
  source_erara_pdf_pages:
  - 193
  - 194
- id: geber-summa-b02-c077-002
  section_id: geber-summa
  book: 2
  chapter: 77
  kind: body
  source_la: 'Est igitur medicina Venerem dealbans, alia per Argentum vivum, alia per Arsenicum. Per Argentum
    vivum quippe sic completur medicina dealbans illam. Solvitur etenim primo Argentum vivum praecipitatum,
    et solvitur similiter Veneris calcinatio, et hae ambae solutiones commiscentur in unum. Dehinc vero
    coagulantur, et super ipsius corpus proiicitur eorum medicina, haec enim dealbat et mundat. Amplius
    autem et aliter. Solvitur Argentum vivum praecipitatum, et solvitur litargirium, et hae ambae solutiones
    coniunguntur in unum, et solvitur corporis calcinatio, de cuius intentione sit dealbari, et coniungitur
    cum praedictis solutionibus, et deinde coagulantur: dehinc vero super illius corpus proiiciuntur,
    dealbatur enim per hanc.'
  translation_ja: 銅を白くする薬には、水銀によるものと、砒素によるものとがある。水銀によって銅を白くする薬は、次のように完成する。まず沈降させた水銀を溶解し、同じく銅の焼成物を溶解する。この二つの溶液を一つに混ぜ、その後凝固させる。それから、それらによる薬を銅の金属体へ投じる。この薬は白化し、浄化する。また、別の方法もある。沈降させた水銀を溶解し、密陀僧を溶解し、両溶液を合わせる。さらに、白くしようとする金属体の焼成物を溶解し、前述の溶液と合わせ、凝固させる。その後、それを当の金属体に投じれば、これによって白くなる。
  notes: []
  source_printed_page: 169
  source_pdf_page: 189
  source_erara_pdf_page: 194
- id: geber-summa-b02-c077-003
  section_id: geber-summa
  book: 2
  chapter: 77
  kind: body
  source_la: Aliter autem. Sublimatur alternata vice ex illius corpore Argenti vivi quantitas, quousque
    cum illa permaneat Argenti vivi pars, cum ignitione completa. Dehinc vero ex aceto distillato saepissime
    imbibendo teritur, ut in profundo illius melius commisceatur, ab hinc vero assetur, et ultimo consimiliter
    ab eo Argentum vivum sublimetur, et iterato imbibatur et assetur. Et sic totiens reiteretur opus super
    illa, quousque multa Argenti vivi quantitas in eo cum ignitione completa quiescat. Haec enim primi
    ordinis bona est dealbatio. Aliter autem, super argentum vivum praecipitatum toties sublimetur argentum
    vivum in natura propria, quousque in illo figatur et fusionem praestet. Dehinc vero super Veneris
    substantiam proiiciatur, et dealbatur peculiose. Aliter autem solvitur Luna, et solvitur litargirium,
    et coniunguntur solutiones. Ex his Veneris substantia dealbatur. Sed et melius quidem dealbatur, si
    in omnibus medicinis perpetuetur argentum vivum.
  translation_ja: また別法として、銅の金属体から、ある量の水銀を交互に昇華させ、十分に赤熱させても水銀の一部が銅とともに残るまで行う。その後、蒸留酢を何度も含ませながらすり潰し、深部でいっそうよく混合させる。続いて焙焼し、最後に同じように水銀をそこから昇華させ、再び含浸し、焙焼する。この操作を繰り返し、多量の水銀が、完全な赤熱のもとでもその中にとどまるようにする。これは第一位の優れた白化法である。また別法として、沈降させた水銀の上で、本来の状態の水銀を何度も昇華させ、その中で固定し、溶融するようになるまで続ける。その後、銅の実体へ投じれば、有益な仕方で白くなる。さらに別法として、銀と密陀僧とを溶解し、溶液を合わせる。これらによって銅の実体は白くなる。ただし、どの薬においても水銀を永続するものにすれば、さらによく白くなる。
  notes: []
  source_printed_pages:
  - 169

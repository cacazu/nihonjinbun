- id: geber-summa-b02-c066-005
  section_id: geber-summa
  book: 2
  chapter: 66
  kind: body
  source_la: Per hoc itaque maximum poteris elicere secretum. Quod cum plurimae argenti vivi quantitatis
    corpora maximae perfectionis sint inventa, pluris utique quantitatis argenti vivi corpora a perfectione
    diminuta perfecto magis approximare necesse est. Itaque et multae sulphureitatis corpora plurimae
    corruptionis esse contingit. Quam ob rem igitur ex iam dictis patet, Iovem maxime perfecto approximare,
    cum perfectionis plus participet, Saturnum vero minus, minus vero adhuc Venerem, minime vero Martem,
    eo ex quo perfectio dependet. Aliter autem ex medicina complente, et defectum supplente, et perfectius
    attenuante ad profundum, corporum spissitudinem, et sub splendentis fulgoris substantia eorundem palliante
    fuscedinem, se habere contingit. Ex hac enim maxime perfectibilis Venus existit, minus vero Mars,
    adhuc minus Iupiter, minime vero Saturnus. Ex his igitur repertum est laboris investigatione veridica,
    ex corporum diversitate, diversas inveniri cum praeparatione medicinas. Alia enim eget medicina, durum
    ignibile, alia vero molle et non ignibile corpus. Hoc quidem mollificante, et ad profundum attenuante,
    et in sua aequante substantia. Illud vero indurante et inspissante occultum eius. Ex his igitur nos
    expedit ad medicinas transire, cum manifestis experientiis, ponentibus nobis causas inventionis diversarum
    medicinarum, et quod diminutum relinquant, et quod ad complementum deducant.
  translation_ja: ここから、最大の秘奥を引き出すことができる。水銀を最も多く持つ金属体が最も完全だと認められる以上、不完全な金属体の中でも、水銀を多く持つものほど、完全なものへ近いはずである。また、硫黄性の多い金属体ほど、腐敗も大きい。したがって、完全性が依存するものに関しては、錫が完全性を最も多く備えるため、完全なものに最も近く、鉛はそれより遠く、銅はさらに遠く、鉄が最も遠いことが、以上から明らかである。しかし、欠陥を補って完成させ、金属体の密質性を深部までいっそう完全に薄め、輝く光沢を持つ実体の下に、その暗い色を覆い隠す薬という観点では、事情は異なる。この薬によっては、銅が最も完全化されやすく、鉄はそれに次ぎ、錫はさらに劣り、鉛が最も劣る。したがって、真実に即した労苦と探究によって、金属体の相違に応じ、調製を伴う異なる薬が見いだされると分かった。赤熱する硬い金属体には一つの薬が、赤熱せず柔らかい金属体には別の薬が必要である。前者には、柔らかくし、深部まで精妙にし、その実体を均一にする薬が必要であり、後者には、硬くし、その隠れた内部を濃密にする薬が必要である。そこで、いまから薬へと移り、異なる薬を見いだす理由、それが何を不完全なまま残し、何を完成へ導くかを、明白な実験とともに示すことにしよう。
  notes:
  - 原刊「Hoc quidem…Illud vero…」の指示関係は作用内容に即して、硬い金属体には軟化、柔らかい金属体には硬化と訳した。

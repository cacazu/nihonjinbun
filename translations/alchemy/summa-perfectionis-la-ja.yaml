  kind: heading
  source_la: De Cineritio, quare quaedam corpora in eo perdurent, quaedam non. Cap. LXXXVIII.
  translation_ja: 第88章　灰吹きについて、ある金属体はそれに耐え、あるものは耐えないのはなぜか。
  notes: []
  source_printed_page: 187
  source_pdf_page: 207
  source_erara_pdf_page: 212
- id: geber-summa-b02-c088-001
  section_id: geber-summa
  book: 2
  chapter: 88
  kind: body
  source_la: Dicamus igitur sermonem de Cineritio, cum suis omnibus causis manifestis, et suae confectionis
    modo. Est autem sola Solaris et Lunaris substantia, in cineritii perdurans examine. Perquirentes igitur
    horum corporum perfectorum veras substantiae differentias, et causas similiter cineritii, quare quaedam
    magis, quaedam vero minus in huius magisterii examine a perfectione diminutorum perdurent, percunctabimur.
    Est tamen a nobis sufficienter narratum horum duorum secretum corporum in profundo illorum substantiae.
    Et est scilicet, quod illorum prima radix multa fuit Argenti vivi quantitas, et purissima illius essentia,
    et subtilissima prius, postea vero inspissata, donec cum ignitione fusionem suscipiat.
  translation_ja: 灰吹きについて、そのすべての明白な原因と、調製方法とともに述べよう。灰吹きの試験に耐えて残るのは、金と銀の実体だけである。そこで、これらの完全な金属体の実体上の真の相違を探究し、不完全なもののうち、あるものがこの秘術の試験により長く耐え、あるものがより短くしか耐えない理由も調べよう。この二つの金属体の実体の深部にある秘密は、すでに十分述べた。すなわち、その最初の根は多量の水銀であり、その本質は最も純粋で、初めはきわめて微細であり、その後、赤熱を伴って溶融するようになるまで濃くされたということである。
  notes:
  - 187頁22行は巻末正誤表に従い et suae confectionis とした。cineritium は灰を用いる試金法として「灰吹き」と訳す。
  source_printed_pages:
  - 187
  - 188
  source_pdf_pages:
  - 207
  - 208
  source_erara_pdf_pages:
  - 212
  - 213
- id: geber-summa-b02-c088-002
  section_id: geber-summa
  book: 2
  chapter: 88
  kind: body
  source_la: 'Quaecunque igitur a perfectione diminuta plus terreitatis habent, minus in hoc perdurant
    examine: quaecunque vero minus, plus. Quoniam haec quidem magis adhaerent, propter eorum partium subtilitatem,
    maxime se permiscentem et unientem. Et similiter quae maioris tenuitatis sunt corpora, aut e contra
    quidem, quae maioris spissitudinis corpora, quam quae in perfectione consistunt, necesse est de commixto
    separari omnino, quia non sunt eiusdem fusionis, et ideo separantur. Et quidem quae minoris sunt Argenti
    vivi quantitate participantia, facilius de commixto separantur. Patet igitur, quod cum sit multae
    terreitatis Saturnus, paucaeque Argenti vivi quantitatis, facilisque tenuitatis liquefactionis, quae
    maxime perfectioni examinis cineritii sunt opposita, ideo inter caetera corpora minime in cineritii
    artificio in commixto perdurat, imo citissime separatur et cedit. Ideoque cum inter caetera a perfectione
    diminuta corpora magis cedat, per hoc magis proprius est huius magisterii examini, et illud ideo,
    quia citius cedit, et citius imperfectorum unumquodque secum de commixto trahit.'
  translation_ja: ゆえに、不完全なものは、土性が多いほどこの試験に耐えず、少ないほど長く耐える。土性の少ないものは、その諸部分が微細で、きわめてよく混じり結合するため、いっそう強く付着するからである。同様に、完全な金属体より希薄なもの、または逆に、より濃密なものは、溶融が同一でないため、混合物から完全に分離せざるをえず、そのため分離する。また、水銀を含む量の少ないものは、混合物からより容易に分離する。鉛には多くの土性があり、水銀の量は少なく、希薄で容易に液化する。これらは灰吹き試験での完全さに最も反する性質であるから、鉛はほかの金属体よりも、灰吹き操作の混合物中に残らず、最も速やかに分離して退く。不完全な金属体の中で最もよく退くので、この秘術の試験に最も適している。早く退くとともに、不完全なものを各々、混合物から一緒に早く引き去るからである。
  notes: []
  source_printed_pages:
  - 188
  - 189
  source_pdf_pages:

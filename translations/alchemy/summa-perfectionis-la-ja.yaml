- id: geber-summa-b02-c067-002
  section_id: geber-summa
  book: 2
  chapter: 67
  kind: body
  source_la: 'Alia etenim eget argentum vivum materia perficiente, alia vero corpora transformanda. Quinetiam
    alia eget dura ignibilia, ut Venus et Mars, alia vero mollia non ignibilia, ut Saturnus et Iupiter.
    Et haec utraque utriusque generis cum ad se invicem differant in natura, similiter diversam ea egere
    medicinam necessario accidit. Unius etenim generis sunt Mars et Venus, sed in speciali quadam proprietate
    differunt. Etenim hic non fusibilis: illa vero fusibilis. Ideoque alia quidem Mars, alia vero Venus
    medicina perficitur: et hic quidem ex toto immundus est, illa vero non. Et hic quidem quadam albedine
    fusca, illa vero rubedine et viriditate participat: quae in medicina diversitatis necessitatem imponunt
    consimiliter. Alterius etiam generis mollitiei corpora, scilicet Iupiter et Saturnus, cum hic et similiter
    differant, diversa medicina ea similiter egere necesse est. Est enim hic quidem mundus, scilicet Iupiter:
    ille vero non.'
  translation_ja: 水銀に必要な完全化の材料と、変成させる金属体に必要な材料は異なる。さらに、銅や鉄のように硬く赤熱するものと、鉛や錫のように柔らかく赤熱しないものとでも、必要な材料は異なる。それぞれの種類に属する二つの金属体も、本性が互いに異なるので、異なる薬が必要となる。鉄と銅は同じ種類に属するが、ある特定の性質で相違する。鉄は溶けず、銅は溶ける。したがって、鉄と銅はそれぞれ別の薬によって完全化される。また、鉄は全体が不純であるが、銅はそうではない。鉄は暗い白さを帯び、銅は赤さと緑色を帯びる。こうしたことも、同じく薬を異ならせる必要を課す。もう一方の、柔らかい種類に属する錫と鉛も、同様に違うので、異なる薬が必要である。錫は清浄であるが、鉛はそうではないからである。
  notes: []

- id: geber-summa-b02-c067-003
  section_id: geber-summa
  book: 2
  chapter: 67
  kind: body
  source_la: 'At vero et haec quidem mutabilia omnia, nunc Lunaria, nunc Solaria efficiuntur corpora:
    ideoque necesse est uniuscuiusque duplicem materiam fore. Unam quidem citrinam, in citrinum mutantem
    solare corpus: alteram vero albam in album Lunare corpus mutantem similiter. Cum ex quatuor igitur
    imperfectorum corporum unicuique duplex materia adinveniat, Solaris videlicet et Lunaris, octo in
    summa erunt medicinae omnes corpora perficientes, in forma bona. Perficitur et similiter argentum
    vivum in Solare et Lunare: ideoque et medicinae alterantis illud duplicem differentiam esse contingit.
    Decem igitur erunt omnes medicinae, quas invenimus cum totalitate sua ad cuiuslibet imperfecti alterationem
    completam. Verum utique cum diuturni laboris instantia, et magnae indagationis industria excusari
    volumus ab inventionis labore harum decem medicinarum per unius beneficium medicinae: et invenimus
    inquisitione longa, necnon et laboriosa maxime, et cum experientia certa, medicinam unam, qua quidem
    durum mollescit, et molle induratur corpus, et fugitivum figitur, et illustratur foedum splendore
    inenarrabili, et eo qui supra naturam consistit.'
  translation_ja: しかし、これらの変化可能なものはすべて、あるときは銀の金属体となり、あるときは金の金属体となるので、それぞれに二つの材料が必要である。一つは黄色い材料で、黄色い金の金属体へ変え、もう一つは白い材料で、同様に白い銀の金属体へ変える。四つの不完全な金属体それぞれに、金化用と銀化用という二つの材料があるので、金属体を良い形へ完全化する薬は、合計八つとなる。水銀も同じく金または銀へ完全化されるため、水銀を変化させる薬にも二種類ある。したがって、あらゆる不完全なものを完全に変化させるため、私たちが全体として見いだした薬は、全部で十となる。だが、私たちは長年の労苦に励み、徹底した探究に努め、この十の薬を見いだす苦労を、ただ一つの薬の恩恵によって免れようとした。そして、長く、きわめて骨の折れる探究と、確実な実験を通じて、一つの薬を見いだした。その薬によって、硬い金属体は柔らかく、柔らかいものは硬くなり、揮発するものは固定され、汚れたものは、言葉では表せず自然を超える輝きによって、明るくなる。
  notes: []
  source_printed_page: 152
  source_pdf_page: 172
  source_erara_pdf_page: 177
- id: geber-summa-b02-c067-004
  section_id: geber-summa
  book: 2
  chapter: 67
  kind: body
  source_la: Ideoque omnium harum medicinarum expedit singulum sermonem adducere, cum causis suis, et
    manifestis probationum experientiis. Primum igitur medicinarum decem seriem, et dehinc quidem corporum
    omnium, deinde vero argenti vivi, dehinc vero et ultimo ad perficientis magisterii medicinam transeundum,
    cum tamen praeparatione indigeant imperfecta. Ideo ne propter insufficientiam traditionis artis mordeamur
    ab invidis, afferamus in primis narrationem de imperfectorum praeparationibus, earum inventionis causae
    necessitatem ponentes, quibus quidem in nostro artificio efficiantur congrua, perfectionis albedinis
    et rubedinis in unoquoque gradu medicinam suscipere, et ab eadem perfici. Dehinc vero addendum medicinarum
    omnium narrationem sufficientem et congruam.
  translation_ja: したがって、これらすべての薬について、それぞれ、その原因と、明白に証明する実験とを伴う説明を示す必要がある。まず十の薬の系列を取り上げ、そこで全金属体の薬、次に水銀の薬へ進み、その後、最後に、完成をもたらす秘術の薬へ移る。ただし、不完全なものには調製が必要である。そこで、術の伝授が不十分だとして、嫉妬深い者たちに非難されないよう、まず不完全なものの調製を説明し、その方法が見いだされる必要な理由を示そう。それによって、私たちの技術の中で、不完全なものが、それぞれの段階の白化・赤化の完全性の薬を受け入れ、その薬によって完全化されるのに適した状態になるようにする。その後、すべての薬について、十分かつ適切な説明を加えよう。
  notes: []
  source_printed_pages:
  - 152
  - 153
  source_pdf_pages:
  - 172
  - 173
  source_erara_pdf_pages:
  - 177
  - 178
- id: geber-summa-b02-c068-title
  section_id: geber-summa
  book: 2
  chapter: 68
  kind: heading
  source_la: Unicuique imperfectorum corporum suam praeparationem esse adhibendam. Caput LXVIII.
  translation_ja: 第68章　それぞれの不完全な金属体に、それに固有の調製を施すべきこと。
  notes: []
  source_printed_page: 153
  source_pdf_page: 173
  source_erara_pdf_page: 178
- id: geber-summa-b02-c068-001
  section_id: geber-summa
  book: 2
  chapter: 68
  kind: body
  source_la: 'Ex iam ergo a nobis narratis sermonibus apparet quid superfluum quidve diminutum ex operibus
    naturae relinquatur in unoquoque eorum, quae imperfecta sunt corpora, secundum sufficientem partem:
    secundum vero complementum quae in superioribus omisimus, hic complebimus sufficienti sermone. Primum
    igitur, cum corpora imperfectionis mutabilia duplicis generis esse contingat, mollia scilicet, et
    ignibilia, ut Saturnus et Iupiter. Dura et non fusibilia, aut cum ignitione fusibilia, ut Mars et
    Venus: hic quidem non fusibilis, illa vero cum ignitione: necessario nos natura informando edocuit,
    ex illorum diversitate essentiarum, in radice naturae diversas praeparationes secundum exigentiam
    illis administrare.'
  translation_ja: これまでの説明によって、それぞれの不完全な金属体に、自然の働きから何が余分なものとして残り、何が不足しているかが、おおむね十分に明らかとなった。完全にするために、前に省いたことは、ここで十分な説明によって補おう。まず、変化可能な不完全な金属体は二種類である。すなわち、鉛や錫のように柔らかく赤熱するものと、鉄や銅のように硬く、溶けないもの、あるいは赤熱して溶けるものである。鉄は溶けず、銅は赤熱して溶ける。それらの本性の根源にある本質の相違から、自然は私たちに、必要に応じた異なる調製を施すべきことを、必然的に教えた。
  notes:
  - 153頁原刊は「mollia scilicet, et ignibilia」と印刷する。直前の第67章等では鉛・錫を「non ignibilia」とするが、ここでは否定語を無断で補わず原文どおり訳した。
  source_printed_pages:
  - 153
  - 154
  source_pdf_pages:

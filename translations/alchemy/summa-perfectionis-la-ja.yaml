- id: geber-summa-b01-c048-title
  section_id: geber-summa
  book: 1
  chapter: 48
  kind: heading
  source_la: De sublimatione Magnesiae et Tutiae, item corporum imperfectorum, et de additione materiae
    sublevantis ea. Caput XLVIII.
  translation_ja: 第48章　マグネシアとトゥティア、および不完全な金属体の昇華について。また、それらを昇らせる材料の添加について。
  notes: *id015
  source_printed_page: 95
  source_pdf_page: 115
  source_erara_pdf_page: 120
- id: geber-summa-b01-c048-001
  section_id: geber-summa
  book: 1
  chapter: 48
  kind: body
  source_la: Sublimationis vero Magnesiae et Tutiae est eadem intentio cum intentione ultimae sublimationis
    Marchesitae. Non enim possunt haec omnia sine ignitione sublimari, ideoque omnia unam intentionem
    habent cum causis eisdem et experientiis eisdem, et habent unum ordinem generalem. Quia sine fecibus
    sublimari debent, quaecunque sublimari cum ignitione necessario contigerit, quia in seipsis feces
    habent sufficientes, imo superfluas, et huius signum est difficultas sublimationis ipsorum. Sublimantur
    etiam similiter omnia corpora a perfectione diminuta hoc eodem ordine, et non cadit diversitas aliqua,
    nisi quia ignis sublimationis vehementior est in corporibus, quam in Magnesia, Marchesita, et Tutia.
    Et non diversificantur similiter corpora in sublimationibus suis, nisi quod quaedam indigent admixtione
    rei sublevantis ea, quaedam vero non, ut facilior fiat eorum elevatio.
  translation_ja: マグネシアとトゥティアの昇華の目的は、マルカシータの最後の昇華と同じである。これらはみな、赤熱なしには昇華できない。それゆえ、同じ目的、原因、試しを持ち、一般的な手順も同じである。赤熱を必要とする昇華は、すべて滓を加えずに行うべきである。材料自体が十分な、むしろ余分な滓を持つからであり、その証拠は昇華の難しさである。完全性を欠くすべての金属体も、同じ順序で昇華させる。違うのは、金属体の昇華の火が、マグネシア、マルカシータ、トゥティアの場合より強いことだけである。また、金属体どうしの昇華にも違いはない。ただし、あるものは昇りやすくする物の混合を必要とし、他のものは必要としない、という違いはある。
  notes: *id015
  source_printed_pages:
  - 95
  - 96
  source_pdf_pages:
  - 115
  - 116
  source_erara_pdf_pages:
  - 120
  - 121
- id: geber-summa-b01-c048-002
  section_id: geber-summa
  book: 1
  chapter: 48
  kind: body
  source_la: Sed una tamen specialis in corporum sublimatione considerationis experientia reperta est
    bona, videlicet ut in fundo aludelis non sit multa corporis sublimandi quantitas, quia multitudo sublimationem
    impedit. Et planicies sit in fundo aludelis sublimationis, et non concavitas, ut possit aequaliter
    et tenuiter super fundum sparsum corpus aequaliter et multum in omnibus suis partibus elevari. Corpora
    vero indigentia admixtione rei elevantis, sunt scilicet Venus et Mars, propter suae fusionis tarditatem.
    Venus itaque Tutia indiget, Mars vero Arsenico, et cum his elevantur de facili, quoniam cum eis maxime
    conveniunt. Fiat igitur post illorum considerationem sublimatio, ut in Tutia, et illi similibus in
    sublimatione, et disponatur eorum sublimatio hoc eodem ordine cum causis suis et experientiis.
  translation_ja: ただし、金属体の昇華では、一つの特別な配慮がよいことが経験上見いだされた。アルデルの底に、昇華すべき金属体を多量に置かないことである。量が多いと昇華を妨げるからである。また、昇華用アルデルの底は、くぼみではなく平らにする。底に均一に薄く撒かれた金属体が、そのすべての部分で均等に、十分に昇れるようにするためである。昇らせる物の混合を必要とする金属体は、溶融の遅いウェヌスとマルスである。ウェヌスにはトゥティア、マルスには砒素性物質が必要であり、それらと非常によく適合するので、容易に昇る。これらを考慮した後、トゥティアおよび昇華においてそれと類似する物と同じように昇華させ、同じ順序に従って、その原因と試しを踏まえ、操作を整える。
  notes: *id015
  source_printed_page: 96
  source_pdf_page: 116
  source_erara_pdf_page: 121
- id: geber-summa-b01-c049-title
  section_id: geber-summa
  book: 1
  chapter: 49
  kind: heading
  source_la: De Descensione, et modo purificandi per pastillos. Caput XLIX.
  translation_ja: 第49章　下降と、練塊による精製の方法について。
  notes: &id016 []
  source_printed_page: 97
  source_pdf_page: 117
  source_erara_pdf_page: 122
- id: geber-summa-b01-c049-001
  section_id: geber-summa
  book: 1
  chapter: 49
  kind: body
  source_la: Narratis itaque sublimationis intentionibus cum causis suis omnibus, restat nos Descensionis
    modum monstrare, cum causis suis similiter et suo ordine determinato, et completo. Fuit ergo inventionis
    illius causa triplex. Una scilicet ut cum materia aliqua inclusa est in illo vase quod vocatur descensorium
    Chemiae, post fusionem suam descendat per foramen illius, et per eius descensionem simus certi, fusionem
    suscepisse. Alia, ut corpora debilia per eam a combustione praeserventur post reductionem a calcibus
    eorum. Nam cum a calcibus corpora debilia tentamus reducere, non omnem illorum partem tempore uno
    reducere possumus. Si igitur pars illa, quae primo in corpus reducta est, reductionem totius expectaret,
    per ignem evanesceret maior illius quantitas. Necesse igitur fuit ingeniari, ut statim cum reducta
    est pars, ab igne deponatur. Hoc autem per descensorium fit. Est et tertia causa inventionis illius
    corporum depuratio ab omni re extranea. Descendit enim corpus fusum mundum, et omnem rem extraneam
    in concavitate illius dimittit.
  translation_ja: 昇華の目的とそのすべての原因を述べたので、今度は下降の方法を、同じくその原因と、定まった完全な手順とともに示すことが残されている。その発見の原因は三つあった。一つは、錬金術の下降器と呼ばれる容器に材料を収め、溶けた後にその穴から下降させることで、溶融したことを確かめるためである。もう一つは、弱い金属体をその灰から戻した後、焼損から守るためである。弱い金属体を灰から戻そうとするとき、すべての部分を同時に戻すことはできない。最初に金属体へ戻った部分が、全体が戻るまで待てば、その大部分が火によって消えてしまう。そこで、戻った部分をただちに火から離す工夫が必要であり、それが下降器によって行われる。第三の原因は、金属体からあらゆる異質な物を精製によって除くことである。清浄な溶融金属が下降し、異質な物はすべて容器のくぼみに残されるからである。
  notes: *id016
  source_printed_page: 97
  source_pdf_page: 117
  source_erara_pdf_page: 122
- id: geber-summa-b01-c049-002
  section_id: geber-summa
  book: 1
  chapter: 49
  kind: body
  source_la: His itaque tribus necessitatibus inventa descensione, determinetur modus illius cum instrumento
    suo prius notificato cum causis suis. Dicimus igitur, quod forma eius talis erit, ut fundus illius
    sit acutus, et parietes illius sine scrupulo aequaliter sint terminantes in fundi acuitatem, ut possit
    unumquodque fusibilium libere sine adhaerentia ad fundi illius foramen descendere, et coopertorium
    eius (si necesse sit) ad similitudinem planae parapsidis, et bene conveniat illi, et sint de bona
    et firma terra, et non de facili per ignis pressuram findente.
  translation_ja: 以上の三つの必要から下降が発見されたので、その方法を定めよう。まず、その器具と原因を明らかにする。器具は底を尖らせ、側壁が凹凸なく、均等に底の尖端へつながる形とする。どの溶融物も付着せず、自由に底の穴へ下降できるようにするためである。必要なら、平皿のような形で、よく合う蓋を付ける。どちらも良質で堅固な土を用い、火の圧力によって容易に割れないものとする。
  notes: *id016
  source_printed_pages:
  - 97
  - 98
  source_pdf_pages:
  - 117
  - 118
  source_erara_pdf_pages:
  - 122
  - 123
- id: geber-summa-b01-c049-003
  section_id: geber-summa
  book: 1
  chapter: 49
  kind: body
  source_la: Mittatur igitur res, cuius intentio fit descendere, in illud, super baculos rotundos ex terra
    factos, ut magis fundo superiori approximent, et cooperiatur cum eo, et iunctura firmetur, et in igne
    de carbonibus ponatur, et super ipsum suffletur, quousque tota res descendat in vas sibi suppositum.
    Potest tamen (si res fuerit difficilis fusionis) poni super tabulam planam, vel parvae concavitatis,
    a qua possit de facili descendere cum inclinatione capitis descensorii, si fusa fuerit. Purificantur
    enim per hoc corpora.
  translation_ja: 下降させる物を器具に入れ、土製の丸棒の上に置き、上側の底へ近づくようにする。そして蓋をし、継ぎ目を固め、炭火に置き、空気を吹き付け、すべてが下に置いた容器へ下降するまで続ける。ただし、溶けにくい物なら、平らか、わずかにくぼんだ板の上に置いてもよい。下降器の頭を傾けたとき、溶けた物がそこから容易に下降できるようにする。これによって金属体が精製される。
  notes:
  - 上側の底（fundus superior）の表現は、原刊の器具記述に従う。構造を推測して書き直してはいない。
  source_printed_page: 98
  source_pdf_page: 118
  source_erara_pdf_page: 123
- id: geber-summa-b01-c049-004
  section_id: geber-summa
  book: 1
  chapter: 49
  kind: body
  source_la: Sed per pastillum melius purificantur, cuius modus purificationis est idem cum modo purificationis
    descensorii. Et ideo per illum excusamur ab eo. Tenet enim feces corporum, ut descensorium, et melius,
    et ideo narramus modum illius. Dicimus igitur quod accipimus corpus, de cuius intentione est mundari,
    et illud in grana minutissima, vel limaturam, vel in calcem (quod perfectius est) redigimus, et ei
    commiscemus calcem aliquam de cuius intentione non sit fundi, et postea illud fundimus. Invenimus
    enim per illud corpora mundari multa iteratione, sed non mundificatione perfecta, quam perfectionem
    scimus esse, sed mundificatione utili, ut medicina perfectionis suscepta, melius et perfectius per
    eam transformentur corpora. Est enim administratio praecedens eam, omnem autem administrationem sufficienter
    in sequentibus tibi narrabimus. Nunc vero Descensorii ponamus descriptionem.
  translation_ja: しかし、練塊によるほうが、いっそうよく精製できる。その精製方法は下降器の場合と同じであり、練塊によって下降器を使わずに済む。下降器と同様に金属体の滓を保持し、しかもそれよりよく保持するからである。そこで、その方法を述べよう。浄化すべき金属体を取り、非常に小さな粒、やすり屑、あるいは、より完全な仕方として灰へとする。それに溶けないことを意図する何らかの灰を混ぜ、その後、金属体を溶かす。これを幾度も繰り返すことで、金属体が浄化されることを見いだした。ただし、私たちが完成と認める完全な浄化ではなく、有益な浄化である。完全化の薬を受け入れたとき、その薬によって金属体が、よりよく、いっそう完全に変成されるためのものである。これは、その薬に先立つ処置である。すべての処置については後で十分説明しよう。いまは下降器の図を示す。
  notes: *id016
  source_printed_pages:
  - 98
  - 99
  source_pdf_pages:
  - 118
  - 119
  source_erara_pdf_pages:
  - 123
  - 124

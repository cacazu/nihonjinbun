- id: geber-summa-b01-c000-title
  section_id: geber-summa
  book: 1
  chapter: 0
  kind: title
  source_la: 'Gebri Arabis philosophi solertissimi, rerumque naturalium (praecipue metallicarum) peritissimi,
    περὶ χημείας libri duo, quibus titulum fecit: Summa perfectionis, sive perfecti magisterii. Ex Arabico
    in Latinum translati, incerto interprete. Summae perfectionis Gebri liber primus.'
  translation_ja: アラビア人ゲベル、きわめて才知に富む哲学者にして自然の事物、とりわけ金属に精通した者の、錬金術についての二巻。著者が『完全性、すなわち完成した術の大全』と題したもの。アラビア語からラテン語への翻訳。訳者不詳。ゲベル『完全性の大全』第1巻。
  notes:
  - 著者帰属と翻訳経路は1541年刊本の表示を訳した。現代研究でいうラテン語系ゲベル文献の成立事情と同一視しない。
  source_printed_page: 20
  source_pdf_page: 42
  source_erara_pdf_page: 47
- id: geber-summa-b01-c001-title
  section_id: geber-summa
  book: 1
  chapter: 1
  kind: heading
  source_la: Praefatio de modo tradendi huius artis, et de idoneis discipulis. Caput I.
  translation_ja: 第1章　この術の伝え方と、適した弟子たちについての序文。
  notes: &id001 []
  source_printed_page: 20
  source_pdf_page: 42
  source_erara_pdf_page: 47
- id: geber-summa-b01-c001-001
  section_id: geber-summa
  book: 1
  chapter: 1
  kind: body
  source_la: Totam nostram περὶ χημείας scientiam, quam ex libris antiquorum compilatione diversa in nostris
    voluminibus abbreviavimus, hic redegimus in summam unam. Et quod in aliis libris a nobis scriptis
    est diminutum, id sufficienter in hac traditione huius nostri libri compensavimus, et ipsorum defectum
    supplevimus sermone brevi. Et quod occultatum fuit a nobis in parte una, manifestum fecimus illud
    in parte eadem, in hoc nostro volumine, ut sapientibus patefiat complementum tam excellentis, nobilisque
    partis philosophiae. Scias ergo charissime fili, in hoc opere totam eius artis operationem in capitulis
    generalibus, universali disputatione, sine diminutione aliqua sufficienter contineri. Per Deum, qui
    secundum hunc librum operatus fuerit, verum finem huius artis se adinvenisse laetabitur.
  translation_ja: 私たちが古人の書物からさまざまに集成し、自らの諸巻で簡約してきた錬金術の学知全体を、ここで一つの大全にまとめた。私たちが著した他の書で不十分だったことは、本書での伝授によって十分に補い、それらの欠落を短い言葉で満たした。また、ある部分で隠していたことを、本巻のその同じ部分において明らかにした。それは、これほど優れ、高貴な哲学の一部の完成が、賢者たちに開かれるためである。だから、最も愛するわが子よ、知りなさい。本書には、この術の操作全体が、一般的な諸章と包括的な論述によって、何一つ欠くことなく、十分に含まれている。神にかけて、本書に従って作業した者は、この術の真の目的を発見したことを喜ぶであろう。
  notes: *id001
  source_printed_pages:

- id: geber-summa-b02-c083-title
  section_id: geber-summa
  book: 2
  chapter: 83
  kind: heading
  source_la: Quomodo medicinis ingressio per artificium concilietur. Cap. LXXXIII.
  translation_ja: 第83章　技法によって薬に浸入性を与えるにはどうするか。
  notes: []
  source_printed_page: 181
  source_pdf_page: 201
  source_erara_pdf_page: 206
- id: geber-summa-b02-c083-001
  section_id: geber-summa
  book: 2
  chapter: 83
  kind: body
  source_la: 'Sed quoniam contingit quandoque medicinam commisceri, quandoque vero non, ideo modum permiscendi
    narrabimus, scilicet qualiter unaquaeque res in corpus profundissime ingressum acquirat, aut unaquaeque
    medicina non intrans. Et est modus per dissolutionem eius quod ingreditur, et per dissolutionem eius
    quod non ingreditur, et per commixtionem ambarum solutionum. Facit enim ingressivum esse omne illud
    cuiusvis generis, quod illi per minima coniungitur. Hoc autem per solutionem completur, et completur
    per solutionem fusio in rebus non fusibilibus: et ideo magis apta sunt ingredi et alterare. Et haec
    est causa, quare quasdam res calcinamus, quae non sunt de natura harum, scilicet ut melius solvantur,
    et ob hoc solvantur, ut melius ab eis corpora impressionem suscipiant, et ab eis similiter per haec
    praeparentur et mundentur. Aut ingressum damus his quae sua spissitudine ingredi non permittuntur,
    cum multiplici sublimationis reiteratione spirituum non inflammabilium super illa, Arsenici videlicet,
    et Argenti vivi non fixorum, aut cum multiplici reiteratione solutionis eius, quod ingressum non habet.'
  translation_ja: 薬が混ざる場合と混ざらない場合とがあるため、混合の方法、すなわち各々の物、または浸入しない薬が、いかにして金属体の最深部へ入る力を得るかを述べよう。その方法は、浸入するものを溶解し、浸入しないものも溶解し、両溶液を混ぜることである。浸入するものは、最小の部分までそれと結合するあらゆる種類のものに、浸入性を与える。この結合は溶解によって達成され、また、溶けない物にも溶解によって溶融性が与えられるので、浸入し変成するのに、さらに適するようになる。これらと同じ本性に属さない物を焼成するのも、よりよく溶解させるためであり、溶解させるのは、金属体がその作用をよりよく受け、同じくそれによって調製され、浄化されるためである。また、濃密さによって浸入を妨げられている物には、その上で非可燃性の霊的物質、すなわち未固定の砒素や水銀の昇華を幾度も繰り返すことによって、あるいは浸入性をもたない物の溶解を何度も繰り返すことによって、浸入性を与える。
  notes: []
  source_printed_pages:
  - 181
  - 182
  source_pdf_pages:
  - 201
  - 202
  source_erara_pdf_pages:
  - 206
  - 207
- id: geber-summa-b02-c083-002
  section_id: geber-summa
  book: 2
  chapter: 83
  kind: body
  source_la: 'Est tamen bona cautela ad ingressum rebus impermiscibilibus dandum, ut solvatur corpus,
    de cuius sit intentione per has mutari et alterari, et solvantur res, quarum intentionis sit ingredi
    cum alteratione. Non fiat tamen omnium partium solutio, sed quarundam: dehinc illud et non aliud imbibatur
    corpus vice post vicem. Per hoc enim beneficium in id solum ingressum habet necessario, non autem
    in quocunque alio corpore necessario hoc contingit. Ex his igitur modorum ingeniis, necesse est rem
    quamlibet ingressum, quo ex illius naturae pendet beneficio habere, et alterare cum permixtione inventa.
    Per hunc igitur sermonem, decem medicinarum completur numerus, cum sua traditionis sufficientia.'
  translation_ja: ただし、混ざり合わない物に浸入性を与えるには、次の注意が有効である。これらによって変成しようとする金属体を溶解し、変成作用を伴って浸入させようとする物も溶解する。しかし、すべての部分を溶解するのではなく、一部分だけとし、その後、ほかならぬ当の金属体へ、繰り返し含浸させる。こうすれば、それだけには必ず浸入するが、ほかのどの金属体にも必ず浸入するとは限らない。以上の方法上の工夫により、どの物も、その本性の恩恵に応じた浸入性をもち、得られた混合によって変成させることになる。この説明によって、十種の薬は、その伝授に必要な説明とともに完結する。
  notes: []
  source_printed_page: 182
  source_pdf_page: 202
  source_erara_pdf_page: 207
- id: geber-summa-b02-c084-title
  section_id: geber-summa
  book: 2
  chapter: 84
  kind: heading
  source_la: De medicina tertii ordinis in genere. Cap. LXXXIIII.
  translation_ja: 第84章　第三位の薬の総論。
  notes: []
  source_printed_page: 182

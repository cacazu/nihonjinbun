  - 172
  - 173
- id: geber-summa-b02-c066-003
  section_id: geber-summa
  book: 2
  chapter: 66
  kind: body
  source_la: Et ideo in hoc nobis aperta est via causae investigationis huius operis, per quod in calcinatione
    mutatur Iupiter facilius in durum quam Saturnus, non autem in tarditatem liquefactionis velocius quam
    Saturnus. Et illud ideo, quoniam causa duritiei naturae est sulphur, et argentum vivum fixum. Causa
    vero liquefactionis est duplex, argentum vivum scilicet, et sulphur combustibile, quorum alterum,
    quo ad fusionis perfectionem, sufficit in unoquoque gradu eius, cum ignitione scilicet, et sine ignitione,
    scilicet argentum vivum. Quia igitur in Iove est multa argenti vivi quantitas non vere fixi, remanet
    in illo multa liquefactionis velocitas, et non removetur ab illo faciliter. Causa vero mollificationis
    est duplex, argentum scilicet vivum, et sulphur combustibile. Quia igitur removetur sulphureitas comburens
    ex Iove facilius quam ex Saturno, ideo ex eo altera causarum molliciei remota, necesse est illud indurari
    calcinatum. Saturnus vero quia utriusque mollitiei causas fortiter habet coniunctas, non facile induratur.
  translation_ja: これによって、次の操作の原因を探究する道が開けた。焼成すると、錫は鉛より容易に硬くなるが、液化の遅い状態になる速さは、鉛を上回らない。その理由は、本性上の硬さの原因が、固定された硫黄と水銀にあるからである。一方、液化の原因は二つ、すなわち水銀と可燃性の硫黄である。その一方である水銀は、赤熱を伴う場合も伴わない場合も、溶融のどの段階を完成させるにも十分である。錫には、真に固定されていない水銀が多量にあるため、液化の速さが大きく残り、容易には除かれない。また、軟化の原因も、水銀と可燃性の硫黄の二つである。燃焼する硫黄性は、鉛からより錫からのほうが容易に除かれるので、錫では柔らかさの原因の一つが除かれ、焼成によって必然的に硬くなる。これに対して鉛は、柔らかさの二つの原因が強く結合しているため、容易に硬くならない。
  notes: []
  source_printed_page: 148
  source_pdf_page: 168
  source_erara_pdf_page: 173
- id: geber-summa-b02-c066-004
  section_id: geber-summa
  book: 2
  chapter: 66
  kind: body
  source_la: 'Est tamen diversitas in mollitie per argentum vivum, et mollitie per sulphur: quia mollities
    per sulphur est cessiva, mollities vero per argentum vivum extensiva est. Et hoc necessario probatur
    per hoc, quod videmus corpora multi argenti vivi multae extensionis esse, corpora vero pauci, paucae.
    Et ideo Iupiter facilius et subtilius extenditur quam Saturnus, Saturnus facilius quam Venus, Venus
    quam Mars, Luna subtilius quam Iupiter, Sol vero quam Luna subtilius. Patet igitur, quod causa indurationis
    est argentum vivum fixum, aut sulphur fixum. Causa vero molliciei est opposita. Causa vero fusionis
    est duplex, sulphur non fixum, et argentum vivum cuiuscunque generis. Sed sulphur non fixum necessario
    est causa fusionis sine ignitione. Et manifeste vides huius rei experientiam, per proiectionem arsenici
    super corpora difficilis fusionis: facit enim ea facilis fusionis, et sine ignitione. Causa vero fusionis
    facilis est et similiter argentum vivum. Causa vero fusionis cum ignitione est argentum vivum fixum.
    Causa igitur impedimenti fusionis cuiuscunque est sulphur fixum.'
  translation_ja: ただし、水銀による柔らかさと硫黄による柔らかさには違いがある。硫黄による柔らかさは圧力に屈する性質であり、水銀による柔らかさは引き延ばされる性質である。このことは、水銀を多く持つ金属体はよく延び、少ないものはあまり延びないという観察によって、必然的に証明される。したがって、錫は鉛より容易に薄く延び、鉛は銅より、銅は鉄より容易に延びる。銀は錫より薄く延び、金は銀より薄く延びる。それゆえ、硬化の原因は固定された水銀か硫黄であり、柔らかさの原因はその反対だと分かる。溶融の原因は、固定されない硫黄と、どの種類であれ水銀という二つである。しかし、固定されない硫黄は、必然的に赤熱を伴わない溶融の原因となる。この実験は、溶けにくい金属体に砒素を投射すれば、明白に観察できる。砒素はそれを、赤熱せず容易に溶けるものにするからである。容易な溶融の原因には、水銀も同じく含まれる。一方、赤熱を伴う溶融の原因は固定された水銀である。したがって、あらゆる溶融を妨げる原因は、固定された硫黄である。
  notes: []
  source_printed_pages:

- id: geber-summa-b01-c051-007
  section_id: geber-summa
  book: 1
  chapter: 51
  kind: body
  source_la: Modus vero calcinationis horum duorum corporum quae a salis acuitate perficitur, est ut proiiciatur
    super faciem illorum salis quantitas, post quantitatem saepissime in fusione sua, et permisceatur
    agitatione multa per baculum ferreum, super ignem, quousque per salis mixtionem in cinerem vertantur.
    Et postea per eundem modum perfectionis perficiatur illorum calx, cum suis considerationibus. Sed
    in hoc est etiam differentia in horum duorum corporum calcinatione. Quia plumbum ex primis calcinationis
    laboribus ad pulverem convertitur facilius quam Iuppiter, non tamen perficitur illius calx facilius
    quam Iovis. Dependet autem huius causa ex eo, quod Saturnus humiditatem magis fixam habeat, quam Iuppiter.
  translation_ja: 塩の鋭さによって行う、この二つの金属体の焼成法は、溶融しているそれらの表面に、塩を少しずつ、何度も投じるというものである。火の上で鉄の棒を使い、よく攪拌して混ぜ、塩の混合によって灰へ変わるまで続ける。その後、それぞれに必要な注意を払いながら、先と同じ完成の方法によって、それらの灰を完成させる。ただし、ここでも両金属体の焼成には違いがある。鉛は、焼成の最初の作業から、ユピテルより容易に粉末へ変わるが、その灰は、ユピテルの灰より容易に完成するわけではない。この原因は、サトゥルヌスが、ユピテルより固定された湿りをもっていることにある。
  notes: []
  source_printed_pages:
  - 108
  - 109
  source_pdf_pages:
  - 128
  - 129
  source_erara_pdf_pages:
  - 133
  - 134
- id: geber-summa-b01-c051-008
  section_id: geber-summa
  book: 1
  chapter: 51
  kind: body
  source_la: Veneris vero et Martis est idem modus, diversus tamen a primis, et illud propter liquefactionis
    eorum difficultatem. Et est, ut laminati ponantur ad fortem ignitionem, de cuius intentione non sit
    fundere. Propter multam enim terreitatis eorum in illis quantitatem, et multam sulphureitatis adustivae
    et fugientis mensuram, de facili per hunc modum adducuntur in calcem. Et illud ideo, quia ex multa
    terreitate argenti vivi substantiae intermixta, turbatur argenti vivi debita continuatio. Et ideo
    porositas in eis causatur, per quam et sulphureitas transiens evolare potest, et ignis ex causa illa
    ad ea accedens, comburere, et eam elevare potest. Per hoc igitur relinquitur, et partes rariores fieri,
    et in cinerem per discontinuitatem raritatis converti. Manifesta igitur experientia huius est, quia
    exposita ad ignitionem lamina Veneris, flammam dabit sulphuream, et squamam in superficie sua causabit
    pulverisabilem. Et illud ideo, quia ex propinquioribus partibus necesse est faciliorem sulphuris combustionem
    fieri.
  translation_ja: ウェヌスとマルスの方法は互いに同じだが、先の二つの金属体とは異なる。それらは溶けにくいからである。方法は、薄板にして、溶かすことを目的としない強い赤熱にさらすというものである。それらの中には土性が多く、焼損性と逃散性をもつ硫黄性も多いので、この方法で容易に灰へ導かれる。水銀の実体に多くの土性が混じるため、水銀が本来もつ連続性が乱されるからである。その結果、それらに多孔性が生じ、硫黄性がその孔を通って飛び去ることができ、火も、そのために内部へ入り、硫黄性を燃やし、上昇させることができる。こうして、諸部分はいっそう疎となり、その疎性がもたらす不連続によって灰へ変わることになる。このことの明らかな経験的証しは、ウェヌスの薄板を赤熱させると、硫黄の炎を発し、表面に粉末にできる鱗片を生じることである。それは、表面に近い部分では、硫黄がより容易に燃えるはずだからである。
  notes: []

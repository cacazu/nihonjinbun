  kind: heading
  source_la: Divisio dicendorum in hac parte, cum insinuatione perfectionis, in secundo libro tradendae.
    Caput XXXVIII.
  translation_ja: 第38章　本部の論述の区分。第2巻で教える完成についても示唆する。

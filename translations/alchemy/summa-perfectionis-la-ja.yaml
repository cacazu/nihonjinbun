- id: geber-summa-b01-c038-001
  section_id: geber-summa
  book: 1
  chapter: 38
  kind: body
  source_la: Sunt duo quae determinanda sunt. Principia scilicet huius magisterii, et perfectio eiusdem.
    Sunt itaque huius artis principia modi operationum ipsius, quibus applicatur artifex ad hoc magisterium.
    Qui quidem a se invicem sunt diversi. Est enim unus modus Sublimatio, et Descensio alter, et unus
    etiam Distillatio, et unus ex modis est Calcinatio, et alius Solutio, et alius Coagulatio. Septimus
    vero modus est Fixatio, Octavus vero Ceratio. De quibus singulis singulas narrationes faciemus.
  translation_ja: 定めるべきことは二つある。すなわち、この術の原理と、その完成である。この術の原理とは、術者がこの術に取り組むための、操作の諸方法である。それらは互いに異なる。一つは昇華、別の一つは下降、また一つは蒸留であり、さらに焼成、溶解、凝結がある。第七は固定、第八は蝋化である。それぞれについて、一つずつ説明しよう。
  notes: *id010
  source_printed_pages:

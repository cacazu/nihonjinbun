  kind: heading
  source_la: De Coagulatione et eius causis, deque diversis modis coagulandi Mercurii, et medicinarum
    solutarum. Caput LIII.
  translation_ja: 第53章　凝結とその原因、およびメルクリウスと溶解した薬を凝結させる種々の方法について。
  notes: []
  source_printed_page: 114

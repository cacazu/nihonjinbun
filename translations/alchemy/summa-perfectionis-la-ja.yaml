  kind: heading
  source_la: Secunda pars huius secundi libri, de medicinis in genere, et de necessitate perfectionis
    medicinae, omnia imperfecta perficiente, atque ex qua re melius et propinquius eliciatur.
  translation_ja: この第二巻の第二部。薬一般、および、すべての不完全なものを完成させる完全化の薬の必要性と、それを何から取り出すのが最もよく、最も直接的であるかについて。
  notes: []

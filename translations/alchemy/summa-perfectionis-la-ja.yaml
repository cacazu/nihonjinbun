  image_alt_ja: 二重の縁を持つガラスの鉢状容器と、その横に置かれた先細りの蓋の1541年木版図
- id: geber-summa-b01-c045-title
  section_id: geber-summa
  book: 1
  chapter: 45
  kind: heading
  source_la: De sublimatione Mercurii sive Argenti vivi. Caput XLV.
  translation_ja: 第45章　メルクリウス、すなわち水銀の昇華について。
  notes: &id014 []
  source_printed_page: 88
  source_pdf_page: 108
  source_erara_pdf_page: 113
- id: geber-summa-b01-c045-001
  section_id: geber-summa
  book: 1
  chapter: 45
  kind: body
  source_la: Nunc vero totam intentionem sublimationis argenti vivi determinemus. Est igitur completa
    summa illius depuratio terreitatis, et remotio aqueitatis illius. Excusamur enim a labore remotionis
    adustionis eius, quoniam eam non habet. Dicimus igitur, quod ingenium separationis superfluae terrae
    ipsius est, ipsum commiscere rebus, cum quibus affinitatem non habet, et sublimationem eius reiterare
    ab eis multoties. Et harum genus est talk, et calx corticum ovorum, et marmoris albi. Similiter et
    vitrum minutissime tritum, et salis omne genus praeparati. Ab istis enim mundatur.
  translation_ja: いま、水銀の昇華の目的全体を定めよう。その全体を成すのは、土性の精製と水性の除去である。焼損性は持たないため、それを除く労苦は不要である。余分な土を分離する工夫は、水銀を、それと類縁性のない物と混ぜ、それらから幾度も昇華を繰り返すことである。その種類にはタルク、卵殻の灰、白大理石の灰がある。同じく、きわめて細かく砕いたガラスや、あらゆる種類の調製済みの塩もある。これらによって水銀は浄化される。
  notes: *id014
  source_printed_pages:
  - 88
  - 89
  source_pdf_pages:
  - 108
  - 109
  source_erara_pdf_pages:
  - 113
  - 114
- id: geber-summa-b01-c045-002
  section_id: geber-summa
  book: 1
  chapter: 45
  kind: body
  source_la: Ab aliis vero rebus habentibus affinitatem cum eo, nisi sint perfectionis corpora, corrumpitur
    potius, quia sulphureitatem habent omnia talia, quae ascendens cum eo in sublimatione ipsum corrumpit.
    Et in hoc experientiam vides, quia si sublimas illud a stanno, vel a plumbo, ipsum post sublimationem
    infectum conspicies nigredine. Ergo melior est eius sublimatio per ea cum quibus non convenit. Cum
    quibus autem convenit melior esset, si sulphureitatem non haberent. Ideo a calce melior est sublimatio,
    quam a rebus omnibus, quoniam illa parum convenit, et sulphureitatem non habet.
  translation_ja: しかし、水銀と類縁性のある他の物によっては、それが完全な金属体でないかぎり、むしろ損なわれる。それらはみな硫黄性を持ち、昇華の際にそれが水銀とともに昇って、水銀を損なうからである。これは、錫または鉛から水銀を昇華させると、昇華後に黒く汚れていることを観察すれば分かる。したがって、適合しない物を用いた昇華のほうがよい。適合する物も、硫黄性を持たなければ、そちらのほうがよいであろう。それゆえ、石灰からの昇華は、他のすべての物からよりも優れる。石灰はわずかな適合性しか持たず、硫黄性を持たないからである。
  notes: *id014
  source_printed_page: 89
  source_pdf_page: 109
  source_erara_pdf_page: 114
- id: geber-summa-b01-c045-003
  section_id: geber-summa
  book: 1
  chapter: 45
  kind: body
  source_la: Modus vero remotionis aqueitatis ipsius superfluae est, ut quando commiscetur calcibus, a
    quibus sublimari debet, teratur et commisceatur illis cum imbibitione, quousque de illo nihil appareat,
    et postea super ignem lentissimum aqueitas imbibitionis removeatur. Qua recedente, etiam argenti vivi
    aqueitas cum ea recedit. Sit tamen ignis tam lenis, ut per eum argenti vivi tota substantia non ascendat.
    Ex multiplici igitur reiteratione imbibitionis cum contritione, et leni assatione, aqueitas illius
    maior deletur, cuius residuum per sublimationis reiterationem removetur.
  translation_ja: 余分な水性を除く方法は、昇華に用いる灰と混ぜる際、浸潤を伴ってすり合わせ、水銀が見えなくなるまで混合し、その後、ごく弱い火で、浸潤に由来する水性を除くことである。それが去ると、水銀の水性も一緒に去る。ただし、火は水銀の実体全体が昇らないほど弱くする。こうして、浸潤と粉砕、穏やかな焙焼を幾度も繰り返すと、水性の大部分が除かれ、残りは昇華の反復によって取り除かれる。
  notes:
  - 原刊正誤表90頁1行に従い、imbitionis を imbibitionis とした。
  source_printed_pages:
  - 89
  - 90
  source_pdf_pages:
  - 109
  - 110
  source_erara_pdf_pages:
  - 114
  - 115
- id: geber-summa-b01-c045-004
  section_id: geber-summa
  book: 1
  chapter: 45
  kind: body
  source_la: 'Et cum videris illud albissimum, excellens nivem albedine sua, et quasi mortuum aludelis
    spondilibus adhaerere, tunc super ipsum reitera sublimationem eius sine fecibus. Quoniam adhaeret
    pars illius fixa cum fecibus, et nunquam per ingeniorum genus aliquod ab illis separari posset. Aut
    post illud figas partem illius, et modum fixionis eius in sequentibus narratum tibi expresse trademus.
    Et cum fixeris illam, tunc reitera sublimationem residuae partis super eam, ut illa similiter figatur,
    et serva, quod tentabis super ignem. Si fusionem bonam dederit, tunc sufficientem sublimationem illi
    administrasti. Si vero non, adde illi de argento vivo sublimato partem aliquam, et reitera sublimationem,
    donec fiat. Quod si lucidum et albissimum habuerit colorem, et pervium, tunc bene mundasti: si non,
    non.'
  translation_ja: それが雪に勝る白さで、死んだもののようにアルデルの側壁に付着するのを見たら、滓なしで再び昇華を繰り返す。固定された部分が滓に付着すると、どんな工夫でも分離できなくなるからである。あるいは、その後で一部を固定する。その固定方法は、後で明瞭に説明しよう。その部分を固定したら、残りの部分をその上で繰り返し昇華させ、同様に固定されるようにする。保存しておき、火の上で試す。よく溶けるなら、十分に昇華したのである。そうでなければ、昇華した水銀をいくらか加え、そうなるまで昇華を繰り返す。明るく、非常に白く、透ける色を持つなら、よく浄化できている。そうでなければ、できていない。
  notes: *id014
  source_printed_page: 90
  source_pdf_page: 110
  source_erara_pdf_page: 115
- id: geber-summa-b01-c045-005
  section_id: geber-summa
  book: 1
  chapter: 45
  kind: body
  source_la: Igitur ne sis in praeparatione illius quae per sublimationem fit, negligens, quia qualis
    erit mundatio, talis et perfectio per illud sequitur, in proiectione illius super unumquodque imperfectorum
    corporum, et super ipsum vivum non praeparatum. Unde et quosdam contingit ferrum, quosdam vero plumbum,
    et quosdam per illud venerem, et quosdam stannum formare. Quod contingit propter purificationis negligentiam,
    quandoque illius solius, quandoque in sulphuris sibi admixti, vel eius comparis. Si igitur directe
    sublimando mundaveris, et illud perfeceris, erit albedinis tinctura firma et perfecta, cui non est
    par.
  translation_ja: したがって、昇華による調製を怠ってはならない。不完全な各金属体や、未調製の生の水銀そのものに投射したとき、それによって生じる完成は、浄化の程度に応じるからである。そのため、ある者は鉄を、別の者は鉛を、また別の者はウェヌスや錫を、それによって作ることになる。これは精製の怠慢による。水銀そのものの場合も、それに混ぜた硫黄またはその類似物の場合もある。したがって、正しく昇華して浄化し、完成させるなら、それは比べるもののない、確実で完全な白の染色力となる。
  notes: *id014
  source_printed_pages:
  - 90
  - 91
  source_pdf_pages:
  - 110
  - 111
  source_erara_pdf_pages:
  - 115
  - 116
- id: geber-summa-b01-c046-title
  section_id: geber-summa
  book: 1
  chapter: 46
  kind: heading
  source_la: De sublimatione Marchesitae. Caput XLVI.
  translation_ja: 第46章　マルカシータの昇華について。
  notes: *id014
  source_printed_page: 91
  source_pdf_page: 111
  source_erara_pdf_page: 116
- id: geber-summa-b01-c046-001
  section_id: geber-summa
  book: 1
  chapter: 46
  kind: body
  source_la: 'Sufficienter igitur sublimationis argenti vivi summa intentionis tradita, nunc ad ipsius
    Marchesitae sublimationem accedamus. Duae autem sunt illius sublimationes. Prima quidem sine ignitione
    perficitur, alia cum ignitione. Et illud ideo: habet enim duplicem substantiam. Unam, scilicet sulphur
    purum in natura sua, aliam vero argentum vivum mortificatum. Prima utilis est, sicut sulphur. Secunda
    vero utilis, ut argentum vivum mortificatum, et mediocriter praeparatum. Assumamus igitur hanc ultimam,
    quia per illam excusamur a superiore argento vivo et a labore mortificationis eius.'
  translation_ja: 水銀の昇華の目的全体を十分に伝えたので、いまマルカシータの昇華へ進もう。その昇華は二つある。第一は赤熱なしに行い、他方は赤熱して行う。これは、二つの実体を持つためである。一つは本来の状態の純粋な硫黄、他方は死化された水銀である。第一は硫黄として役立つ。第二は、死化され、ある程度調製された水銀として役立つ。したがって、後者を取ろう。これによって、前述の水銀を使うことと、それを死化する労苦を免れるからである。
  notes:
  - 原刊正誤表91頁14行に従い、argenti vivi を argento vivo とした。
  - mortificatio（死化）はこの文献の操作概念であり、微生物の殺菌等の現代概念には置き換えない。
  source_printed_page: 91
  source_pdf_page: 111
  source_erara_pdf_page: 116
- id: geber-summa-b01-c046-002
  section_id: geber-summa
  book: 1
  chapter: 46
  kind: body
  source_la: Est igitur totus modus sublimationis illius, ut teratur, et in aludele ponatur, et sublimetur
    sine ignitione sulphur eius, semper removendo quod ex illo sublimatur, saepissime propter causam dictam,
    et augendo ignis vigorem usque ad ignitionem aludelis. Et prima sublimatio Marchesitae debet fieri
    in vase sublimationis, quousque sulphur recesserit, et postea in isto successive et ordinate procedere,
    quousque totum quod in ea de sulphure constat, exierit. Quod probare poteris his manifestis experientiis.
    Nam cum totum illius sulphur fuerit elevatum, videbis colorem eius, quod post illud sublimabitur,
    mutari in albissimum, mixto caelestino eidem colore clarissimo et amoeno. Aliter etiam, quia quod
    erit de sulphuris natura comburetur, et flammam dabit ut sulphur. Quod vero secundo post illud sublimatum
    fuerit, nec inflammabit, nec proprietates sulphuris ostendet aliquas, sed vivi argenti mortificati
    in sublimationis reiteratione.
  translation_ja: その昇華の方法全体はこうである。すり潰してアルデルに入れ、赤熱させずに硫黄を昇華させる。先に述べた理由から、昇華したものは非常に頻繁に取り除き、火を次第に強め、アルデルが赤熱するまで進める。マルカシータの最初の昇華は、硫黄が去るまで昇華容器で行い、その後、この容器で順次、秩序立てて進め、含まれる硫黄がすべて出るまで続ける。これは次の明白な試しで確かめられる。硫黄がすべて昇った後には、次に昇華するものの色が非常に白くなり、きわめて明るく美しい空色が混じるのが見える。また、硫黄の本性を持つものは燃え、硫黄のように炎を上げる。これに対し、その後、第二に昇華するものは炎を上げず、硫黄の性質を示さず、昇華を繰り返す際、死化された水銀の性質を示す。
  notes:
  - 原刊正誤表91頁18行の saepissime を採用した。
  source_printed_pages:
  - 91
  - 92
  source_pdf_pages:
  - 111
  - 112
  source_erara_pdf_pages:
  - 116
  - 117
- id: geber-summa-b01-c047-title
  section_id: geber-summa
  book: 1
  chapter: 47
  kind: heading
  source_la: De vase, in quo Marchesita recte possit sublimari. Caput XLVII.
  translation_ja: 第47章　マルカシータを正しく昇華できる容器について。
  notes: &id015 []
  source_printed_page: 92
  source_pdf_page: 112
  source_erara_pdf_page: 117
- id: geber-summa-b01-c047-001
  section_id: geber-summa
  book: 1
  chapter: 47
  kind: body
  source_la: Illud ergo colligamus per sui sublimationis modum, qui est, ut fiat vas terreum solidissimum,
    et bene coctum, ad longitudinem mediae staturae virilis. Ad latitudinem vero, per quam manus subintrare
    possit. Et fiat fundus eius qui separari et coniungi possit ad similitudinem unius planae parapsidis
    profundum multum. Et mensuretur ab orificio illius vasis, usque prope fundum, ad mensuram longitudinis
    unius manus cum digitis suis. Et de illo loco usque ad caput eius vitrificetur interius vas vitrificatione
    spissa multum. Et super caput illius ponatur alembicus cum laxo naso. In tali enim vase sublimatur
    illud.
  translation_ja: それゆえ、次の昇華の方法でこれを集めよう。非常に堅固で、よく焼いた土製の容器を作る。長さは成人男性の身長の半分、幅は手が入る程度とする。底は、深い平皿のような形で、取り外しと接合ができるように作る。容器の口から底近くまで測り、底から指を含む手一つ分の長さに当たるところを定める。その位置から頭部まで、容器の内側に非常に厚くガラス質の釉を施す。頭部には、広い嘴管のあるアランビックを置く。このような容器の中で、それは昇華される。
  notes:
  - 寸法の説明は原刊の身体尺度に従う。曖昧な設計記述を現代的な工作図へ補完していない。
  source_printed_page: 92
  source_pdf_page: 112
  source_erara_pdf_page: 117
- id: geber-summa-b01-c047-002
  section_id: geber-summa
  book: 1
  chapter: 47
  kind: body
  source_la: Coniungatur igitur fundus vasi suo per lutum firmae tenacitatis, et super ipsum fundum spargatur
    Marchesita, et super caput vasis alembicus laxi nasi, et ponatur in furnum, de cuius proprietate sit
    fortem ignitionem dare, fusionis scilicet argenti, vel veneris, si artifex indiguerit, quem in summa
    nostri operis, ubi diversitates omnium instrumentorum narrabimus, tibi sufficienter trademus, et caput
    furni circunda cum rota habente foramen in medio sui, ad magnitudinem vasis, per quod illud vas intrare
    possit, et luta iuncturas in circuitu vasis et furni, ne ignis exiens impediat te in sublimationis
    adhaerentia, relictis tantum quatuor fenestris parvis in rota, quae claudi et aperiri possint, per
    quas mittantur carbones in furnum, et in lateribus fornacis similiter aliae quatuor sub illis intermediae,
    per quas et similiter carbones mittantur, et sex vel octo foraminibus ad magnitudinem digiti minoris,
    quae nunquam claudantur, ut per illa furnus a fumositatibus se libere possit expedire. Et sint foramina
    illa in iunctura furni cum rota sua.
  translation_ja: 底を強く粘着する泥で容器に接合し、その上にマルカシータを撒く。容器の頭には広い嘴管のアランビックを置き、強く赤熱させられる炉に据える。必要なら銀やウェヌスを溶かせるほどの炉であり、すべての器具の違いを述べる本書の総括部分で、十分に説明する。炉の上部を円板で囲み、その中央に容器の大きさに合った、容器を通せる穴を設ける。容器と炉の周りの継ぎ目を泥で封じ、外へ出る火が昇華物の付着を妨げないようにする。ただし円板には、開閉できる小窓を四つ残し、そこから炭を炉に入れる。また炉の側面にも、その下の間の位置に四つの窓を設け、同じく炭を入れる。さらに小指ほどの穴を六つか八つ設け、これは決して閉じず、煙がそこから自由に抜けるようにする。それらの穴は、炉と円板の接合部に設ける。
  notes: *id015
  source_printed_pages:
  - 92
  - 93
  source_pdf_pages:
  - 112
  - 113
  source_erara_pdf_pages:
  - 117
  - 118
- id: geber-summa-b01-c047-003
  section_id: geber-summa
  book: 1
  chapter: 47
  kind: body
  source_la: Furnus vero magnae ignitionis est, cuius spondilia sunt ad altitudinem cubitorum duorum.
    In medio sit rota, minutissimis et creberrimis perforata foraminibus, cum luto fortiter annexa. Capita
    foraminum superius sint stricta, inferius vero laxa, ut cinis vel carbones possint liberius ex illis
    cadere, et relinquat ipsa continue ad susceptionem aeris liberius aperta. Nam aeris libera et multa
    susceptio per inferiora foramina, est causa una magnae ignitionis per furnum. Exerciteris ergo in
    eo, et ipsum invenies.
  translation_ja: 強い赤熱を与える炉は、側壁の高さを二クビトゥスとする。中央には、非常に小さく密な穴を多数あけた円板を置き、泥で強く固定する。穴は上を狭く、下を広くし、灰や炭が自由に落ちて、空気を取り入れるために、常に開いた状態が保たれるようにする。下の穴から空気を自由かつ多量に受け入れることは、炉が強い赤熱を与える一つの原因である。これに習熟しなさい。そうすれば見いだせるだろう。
  notes:
  - 原刊正誤表93頁17行の vero laxa を採用した。クビトゥスは肘から手先までに由来する原文の尺度。
  source_printed_page: 93
  source_pdf_page: 113
  source_erara_pdf_page: 118
- id: geber-summa-b01-c047-004
  section_id: geber-summa
  book: 1
  chapter: 47
  kind: body
  source_la: Causa vero longitudinis vasis est, ut extra ignem multa quantitas eius extendatur, et infrigidetur,
    ut fumi sublimationis locum refrigerii inveniant et adhaereant, et non inveniant viam fugae, et suae
    exterminationis. Hoc autem novit ille, qui dum sublimasset in brevibus aludelibus, nihil ex sublimato
    invenit, quoniam propter brevitatem aludelis aequalis fuit per totum ipsum ignis. Ideoque semper in
    fumi substantiam conversum sublimandum stetit, et non alicubi adhaesit, sed successive per poros vasis
    evanuit. Vas ergo in omnibus sublimandis ad maiorem sui partem in loco sui refrigerii extendatur.
  translation_ja: 容器を長くする理由は、その大部分を火の外へ延ばして冷やし、昇華の煙が冷却される場所を見いだして付着し、逃げて失われる道を見いださないようにすることである。短いアルデルで昇華させ、昇華物を何も得られなかった者は、このことを知っている。アルデルが短いため、全体に同じ火の熱が及び、昇華すべきものは常に煙状のまま、どこにも付着せず、容器の孔から徐々に消え去ったからである。それゆえ、何を昇華させる場合でも、容器の大部分を冷却される場所へ延ばす。
  notes: *id015
  source_printed_pages:
  - 93
  - 94
  source_pdf_pages:
  - 113
  - 114
  source_erara_pdf_pages:
  - 118
  - 119
- id: geber-summa-b01-c047-005
  section_id: geber-summa
  book: 1
  chapter: 47
  kind: body
  source_la: Causa vero vitrificationis vasis est, ne fumi ascendentes in loco suae ascensionis, porosum
    inveniant aludelis parietem, et illum penetrantes aufugiant. Vitrificatur ergo locus ascensionis illorum,
    ut obstrueretur illis via fugae, fundus vero aludelis non, quoniam ipsius fundus in igne consistit,
    qui vitrificationem ipsius funderet, qua fusa et fundus eius, et similiter sublimandum funderetur,
    et vitrum fieret. Est enim vitri proprietas, omnia vincere, et ad se convertere.
  translation_ja: 容器にガラス質の釉を施す理由は、昇る煙が、その上昇する場所でアルデルの多孔な壁を見つけ、浸透して逃れないようにするためである。それゆえ、煙の昇る部分をガラス質にして、逃げ道を塞ぐ。しかし、アルデルの底には施さない。底は火の中にあり、その火は釉を溶かしてしまうからである。釉が溶けると、底も、昇華すべきものも、ともに溶けてガラスになる。すべてを支配し、自らに変えるのがガラスの性質だからである。
  notes: *id015
  source_printed_page: 94
  source_pdf_page: 114
  source_erara_pdf_page: 119
- id: geber-summa-b01-c047-006
  section_id: geber-summa
  book: 1
  chapter: 47
  kind: body
  source_la: His igitur omnibus consideratis cum causis eorum, fiat ignis sub aludele quousque certificatus
    fueris experientia veridica, illud totum ascendisse. Est autem experientia, intromissio baculi terrei
    bene cocti, habentis foramen parvum in capite suo, usque ad medium eius veniens, ad quantitatem digiti
    minoris prope ipsam rem a qua fit sublimatio. Et si foramini aliquid adhaeserit ex sublimando, non
    est totum sublimatum, si vero non, tunc sublimatum est. Et hac eadem exercitatione in omnibus sublimandis
    certificari poteris. Descriptio vero vasis aludelis sublimationis Marchesitae ultimae, et cum fornace
    et baculo suae experientiae haec est.
  translation_ja: これらすべてとその原因を考慮したうえで、アルデルの下に火を置き、すべてが昇ったことを確かな試しで確認するまで続ける。その試しは、よく焼いた土製の棒を、昇華の生じる材料の近くへ差し入れることである。棒は小指ほどの太さで、その先から中央まで小さな穴が通っている。その穴に昇華物が付着すれば、まだすべては昇華していない。付着しなければ、昇華したのである。この同じ試しによって、どの昇華でも確かめられる。マルカシータの最後の昇華に用いるアルデルと、炉、および検査用の棒の図は、次のとおりである。
  notes: *id015
  source_printed_page: 94
  source_pdf_page: 114
  source_erara_pdf_page: 119

- id: geber-summa-b01-c053-001
  section_id: geber-summa
  book: 1
  chapter: 53
  kind: body
  source_la: Coagulatio vero est rei liquorosae ad solidam substantiam, per humidi privationem reductio.
    Est autem duplex causa inventionis illius. Una scilicet argenti vivi induratio. Altera vero inventionis
    causa est, medicinarum solutarum ab aqueitate illis admixta absolutio. Diversificatur ergo secundum
    ipsorum coagulandorum multiplicitatem. Alia enim argentum vivum coagulatione indiget, alia vero solutae
    medicinae. Est tamen ipsius argenti vivi duplex coagulatio. Una quidem per ablationem totius ab illo
    humidi innati. Alia vero per inspissationem ipsius humidi, quousque induretur. Congelare attamen illud
    difficillime atque laboriose accidet, cum profunditate perspicacis industriae, et nos narrabimus omne
    ingenium coagulationis illius.
  translation_ja: 凝結とは、液状の物から湿りを取り去り、固い実体へ戻すことである。その発見の原因には二つある。一つは水銀を硬くすること、もう一つは、溶解した薬から、混じっている水性を取り除くことである。したがって、凝結させる物の種類に応じて、方法も異なる。水銀に必要な凝結と、溶解した薬に必要な凝結とは異なる。ただし、水銀そのものの凝結にも二つある。一つは、その生来の湿りをすべて取り去ることによるもの、もう一つは、その湿り自体を濃密化し、硬くすることによるものである。しかし、水銀を凝固させるのは非常に難しく、骨の折れることであり、深く鋭い工夫を要する。私たちは、水銀を凝結させるための、あらゆる工夫を述べることにしよう。
  notes: []
  source_printed_pages:
  - 114
  - 115
  source_pdf_pages:
  - 134
  - 135
  source_erara_pdf_pages:

- id: geber-summa-b01-c038-002
  section_id: geber-summa
  book: 1
  chapter: 38
  kind: body
  source_la: Perfectio vero consistit ex consideratione eorum, quibus pervenitur ad eam, et ex consideratione
    rerum iuvantium, et ex consideratione ipsius rei, quae ultimo perficit, et ex qua cognoscitur, an
    in perfectione fuerit magisterium, vel non. Consideratio eorum, quibus pervenitur ad operis complementum,
    est consideratio substantiae manifestae, et colorum manifestorum, et ponderis in unoquoque corporum
    mutandorum, et eorum corporum, quae non mutanda sunt ex radice suae naturae absque illo artificio,
    et consideratio illorum similiter in radice sua cum artificio, et consideratio principiorum corporum,
    secundum suum profundum, occultum et manifestum, secundum naturam suam, sine artificio, et eorum similiter
    cum artificio. Quoniam si non cognoscerentur corpora et illorum principia in profundo suae naturae
    et manifesto, cum artificio, et sine, nesciretur quod superfluum in eis, et quod diminutum, qua ratione
    necesse foret nos nunquam ad perfectionem transmutationis illorum pervenire.
  translation_ja: 完成には、それへ到達させるものの考察、助けとなるものの考察、最終的に完成させるもの自体の考察、そして術が完成したかどうかを知るためのものの考察が必要である。作業の完成へ到達させるものを考察するとは、変えるべき各金属体と、その技なしには本性の根から変えるべきでない金属体について、明らかな実体、色、重さを考えることである。また同様に、技を施したときの根源的な状態を考え、金属体の原理について、その深部、隠されたものと明らかなものを、本来の状態と技を施した状態の双方で考えることである。金属体とその原理を、本性の深部と表面において、技の有無の双方から知らなければ、何が余分で何が不足かも分からない。そのため、私たちはそれらの変成の完成には、決して到達できないことになる。
  notes: *id010
  source_printed_page: 73
  source_pdf_page: 93
  source_erara_pdf_page: 98
- id: geber-summa-b01-c038-003
  section_id: geber-summa
  book: 1
  chapter: 38
  kind: body
  source_la: Consideratio autem rerum iuvantium perfectionem, est consideratio naturarum, illarum rerum,
    quae corporibus sine artificio videmus adhaerere et mutationem facere. Et sunt Marchesita, Magnesia,
    Tutia, Antimonium, et lapis Lazuli, et consideratio eorum, quae sine adhaerentia corpora mundificant,
    et sunt scilicet sal et alumina, nitra et boracia, et quae illorum naturae sunt, atque consideratio
    vitrificationis mundantis per consimilem naturam.
  translation_ja: 完成を助ける物の考察とは、技を加えなくても金属体に付着し、変化をもたらすと見られる物の本性を考えることである。それらは、マルカシータ、マグネシア、トゥティア、アンティモニウム、ラピス・ラズリである。また、付着せずに金属体を浄化するもの、すなわち塩、明礬、ニトル、ボラクス類、およびそれらと同じ本性のものを考えることでもある。さらに、類似した本性によって浄化するガラス化を考えることでもある。
  notes:
  - Lazuli は原刊正誤表73頁26行の指定に従う。物質名は歴史的な用法の範囲で読む。
  source_printed_pages:
  - 73
  - 74
  source_pdf_pages:
  - 93
  - 94
  source_erara_pdf_pages:
  - 98
  - 99
- id: geber-summa-b01-c038-004
  section_id: geber-summa
  book: 1
  chapter: 38
  kind: body
  source_la: 'Consideratio vero rei quae perficit, est consideratio electionis purae substantiae argenti
    vivi, et est materia, quae ex materia illius assumpsit originem, et ex illa creata est. Non est autem
    ista materia argentum vivum in natura sua, nec in tota sua substantia, sed est pars illius, non est
    autem nunc, sed cum lapis noster factus est: ipse enim illustrat, et ab adustione conservat, quod
    perfectionis significatio est. Consideratio vero rei ex qua cognoscitur, utrum magisterium sit in
    perfectione, vel non, est consideratio cinericii, cementi, ignitionis, expositionis super vapores
    acutorum, extinctionis, commixtionis sulphuris adurentis corpora, reductionis post calcinationem,
    et susceptionis argenti vivi. Haec autem omnia deinceps narrabimus cum causis suis, et cum experientiis
    facilibus, quibus poteris manifeste cognoscere, sermones non errasse nostros. Et haec experimenta
    erunt tibi penitus nota.'
  translation_ja: 完成させるものを考察するとは、水銀の純粋な実体を選ぶことを考察することである。それは、水銀の材料から起源を得て、そこから作られた材料である。しかし、この材料は、本来の状態の水銀でも、その実体全体でもなく、その一部分である。しかも、いまそのままでそうなのではなく、私たちの石となったときにそうなのである。その石は輝かせ、焼損から保つ。それが完成を示す徴である。術が完成しているかどうかを知るためのものを考察するとは、灰吹き、セメント処理、赤熱、鋭い物の蒸気への暴露、焼入れ、金属体を焼損する硫黄との混合、焼成後に金属体へ戻すこと、水銀の受容を考えることである。これらすべてを、今後、その原因と容易な試験とともに説明しよう。それによって、私たちの言葉が誤っていないことを明白に知ることができる。そして、それらの試験を、あなたは十分に理解するだろう。
  notes:
  - 本書の「試験」は歴史的な試金・錬金術操作をいう。本対訳が家庭等での実験を勧めているわけではない。
  source_printed_page: 74
  source_pdf_page: 94
  source_erara_pdf_page: 99
- id: geber-summa-b01-c039-title
  section_id: geber-summa
  book: 1
  chapter: 39
  kind: heading
  source_la: De Sublimatione, cur sit inventa. Caput XXXIX.
  translation_ja: 第39章　昇華について。なぜ発見されたか。
  notes: *id010
  source_printed_page: 74
  source_pdf_page: 94
  source_erara_pdf_page: 99
- id: geber-summa-b01-c039-001
  section_id: geber-summa
  book: 1
  chapter: 39
  kind: body
  source_la: Prosequentes igitur nostrum propositum, dicimus de sublimatione. Et fuit causa inventionis
    eius, quia non invenerunt antiqui nostri, nec nos, nec qui post nos erunt aliquid, quod uniretur corporibus,
    nisi spiritus solos, vel aliquod, quod naturam corporis et spiritus in se contineret, et hos proiectos
    super corpora sine illorum mundatione, viderunt vel non perfectos colores dare, vel ex toto corrumpere,
    adurere, denigrare et defoedare. Et hoc secundum diversitatem ipsorum spirituum. Quaedam enim sunt
    adurentes, ut sulphur et arsenicum et Marchesita, et hi quidem corrumpunt ex toto. Alii vero non adurunt,
    ut omne genus tutiae, et hi quidem imperfectos colores dant, et illud ideo, quia quae adurunt, et
    denigrant et foedant.
  translation_ja: 予定した論述を続け、昇華について述べよう。その発見の理由は、私たちの古人も、私たちも、後に来る者も、金属体と結合するものとして、精気だけ、あるいは金属体と精気の本性をあわせ持つもの以外を見いださないことにある。そして、それらを浄化せずに金属体へ投射すると、完全な色を与えないか、まったく損ない、焼き、黒くし、汚すのを見た。これは精気の違いに応じて異なる。硫黄、砒素性物質、マルカシータのように焼損をもたらすものがあり、これらは完全に損なう。他方、あらゆるトゥティア類のように焼損しないものは、不完全な色を与える。そして、焼損させるものは、同時に黒くし、汚すのである。
  notes:
  - quia quae は原刊正誤表75頁8行の指定に従う。
  source_printed_pages:
  - 74
  - 75
  source_pdf_pages:
  - 94
  - 95
  source_erara_pdf_pages:
  - 99
  - 100
- id: geber-summa-b01-c039-002
  section_id: geber-summa
  book: 1
  chapter: 39
  kind: body
  source_la: Duplici de causa haec faciunt. Una, quia unctuositas adustiva sulphuris, de cuius proprietate
    est, de facili inflammari, et per inflammationem denigrari, et per consequens denigrare, ab eis non
    est ablata. Altera vero causa est terreitas, quae ab eis similiter ablata non fuit. In his autem,
    in quibus non datur perfectus color, est causa terreitas, lividum faciens eum. Potest etiam adustio
    lividum creare colorem. Ideoque ingeniati fuimus hos mundare ab unctuositate videlicet adurente, eam
    habentes scilicet, et a terrea superfluitate omnes. Et ad hoc per nullum magisterium potuimus pervenire,
    nisi per solam sublimationem. Ignis enim cum elevat, subtiliores partes semper elevat, ergo dimittit
    grossiores. Ex hoc patet, per sublimationem spiritus a terreitate mundari, quae et ingressionem impediebat,
    et colorem immundum dabat. Experientia vero notum tibi facit satis per visum tuum, illos ab ea absolutos
    esse. Vides enim eos splendidiores et magis pervios, et eos facilius corporum densitatem subintrare
    et penetrare, et non foedum ut prius, colorem facere.
  translation_ja: その原因は二つある。一つは、硫黄の焼損をもたらす油性が取り除かれていないことにある。その性質は容易に燃え、燃えることで黒くなり、その結果、他を黒くすることである。もう一つは、土性も取り除かれていなかったことである。完全な色を与えないものでは、土性が色を青黒くする原因である。焼損もまた、青黒い色を生じさせ得る。そのため私たちは、その油性を持つものからは焼損をもたらす油性を取り除き、すべてのものからは余分な土性を取り除くよう工夫した。これは昇華以外のいかなる術によっても達成できなかった。火が昇らせるときには、常により微細な部分を昇らせ、より粗大な部分を残すからである。これによって、昇華は、浸透を妨げ、不浄な色を与えていた土性から精気を浄化することが分かる。経験は、それらが土性から解放されたことを、自分の目によって十分に明らかにしてくれる。それらがより輝き、より透過しやすくなり、金属体の緻密さの内部へ容易に入り込んで貫き、以前のように汚い色を作らないのが見えるからである。
  notes: *id010
  source_printed_pages:
  - 75
  - 76
  source_pdf_pages:
  - 95
  - 96
  source_erara_pdf_pages:

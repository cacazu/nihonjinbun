- id: geber-summa-b02-c084-001
  section_id: geber-summa
  book: 2
  chapter: 84
  kind: body
  source_la: 'Restat igitur nos ad tertii ordinis medicinam transire. Est autem huius ordinis medicina
    duplex, scilicet Solaris et Lunaris. Et est tamen in essentia una, et agendi modo similiter: et ideo
    unica medicina nuncupatur a nostris veteribus, quorum scripta perlegimus. Est tamen additamenti citrinantis
    coloris, qui a Sulphuris fixi mundissima perficitur substantia. Differentia inter hanc et illam, Lunarem
    scilicet et Solarem, haec quidem id in se continet, illa vero non. Est tamen hic ordo tertius maioris
    operis ordo appellatus: et illud ideo, quia maioris sagacitatis industria in illius administratione,
    et perfectionis praeparatione est, et labore longiori ad veritatis complementum indiget. Et ideo non
    diversificatur huius ordinis medicina a secundi ordinis in essentia ullatenus nisi per subtilissimos
    praeparationis gradus in creatione illius, et per diuturniorem laboris instantiam.'
  translation_ja: 次に第三位の薬へ進もう。この位の薬には、金化薬と銀化薬の二つがある。しかし本質において一つであり、作用の仕方も同様である。そこで、私たちが著作を通読した古人たちは、唯一の薬と呼んだ。ただし、最も清浄な固定硫黄の実体によって作られる、黄色を与える添加物がある。この二つ、すなわち銀化薬と金化薬との差は、後者がこれを含み、前者が含まないことである。この第三位は、大なる仕事の位と呼ばれる。それは、その処置と完全化のための調製に、より鋭い洞察力と技巧を要し、真の完成に達するには、より長い労苦を必要とするからである。したがって、この位の薬は本質上、第二位の薬と少しも違わず、製造時の調製がきわめて精妙な段階に達することと、より長く不断の労苦を重ねることだけが異なる。
  notes: []
  source_printed_pages:
  - 182
  - 183
  source_pdf_pages:
  - 202
  - 203

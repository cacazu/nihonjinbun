- id: geber-summa-b02-c059-004
  section_id: geber-summa
  book: 2
  chapter: 59
  kind: body
  source_la: Ex iam igitur dictis patet similiter argentum vivum non esse perfectum in natura sua, sed
    illud quod ex ipso producitur per artificium nostrum. Et similiter in sulphure et eius compari est
    inducere. Non ergo in his possibile est naturaliter naturam sequi, sed per nostrum artificium naturale.
  translation_ja: 以上から、水銀も、そのままの本性において完全なのではなく、私たちの技術によって水銀から作り出されるものが完全であることが明らかとなる。硫黄とその同類についても同じことがいえる。したがって、これらについては、自然のままに自然に従うことはできず、自然に即した私たちの技術を通じて従うのである。
  notes: []
  source_printed_page: 131
  source_pdf_page: 151
  source_erara_pdf_page: 156
- id: geber-summa-b02-c060-title
  section_id: geber-summa
  book: 2
  chapter: 60
  kind: heading
  source_la: De natura Marchesitae, Magnesiae, et Tutiae. Cap. LX.
  translation_ja: 第60章　マルカシータ、マグネシア、トゥティアの本性について。
  notes: []
  source_printed_page: 131
  source_pdf_page: 151
  source_erara_pdf_page: 156
- id: geber-summa-b02-c060-001
  section_id: geber-summa
  book: 2
  chapter: 60
  kind: body
  source_la: De aliis autem spiritibus naturalem necesse est nos facere traditionem, qui sunt scilicet
    Marchesita, Magnesia, et Tutia, impressionem magnam in corporibus facientes. Et ideo dicamus quid
    sint cum probationibus suis in hoc capitulo.
  translation_ja: 他の精気、すなわち金属体に強い作用を与えるマルカシータ、マグネシア、トゥティアについても、その本性に関する説明が必要である。そこで本章では、それぞれが何であるかを、その証拠とともに述べよう。
  notes: []
  source_printed_page: 131
  source_pdf_page: 151
  source_erara_pdf_page: 156
- id: geber-summa-b02-c060-002
  section_id: geber-summa
  book: 2
  chapter: 60
  kind: body
  source_la: Dicimus igitur, quod Marchesita duplicem habet in sui creatione substantiam, argenti vivi
    scilicet mortificati, et ad fixionem approximantis, et sulphuris adurentis. Ipsam autem habere sulphureitatem
    comperimus manifesta experientia. Nam cum sublimatur, ex illa emanat substantia sulphurea manifesta,
    comburens. Et sine sublimatione similiter perpenditur illius sulphureitas. Nam si ponatur ad ignitionem,
    non suscipit illam priusquam inflammatione sulphuris inflammetur et ardeat. Ipsam vero argenti vivi
    substantiam manifestatur habere sensibiliter. Nam albedinem praestat Veneri meri argenti, quemadmodum
    et ipsum argentum vivum, et colorem in illius sublimatione coelestini praestare, et luciditatem manifestam
    metallicam habere videmus, quae certum reddunt artificem, illam has substantias continere in radice
    sua. Magnesia vero sulphur plus turbidum, et argentum vivum magis terreum et feculentum, et ipsum
    sulphur similiter magis fixum et minus inflammabile habere, per easdem probare experientias manifeste
    poteris, et ipsam magis naturae Martis approximare.
  translation_ja: マルカシータは生成の際、二つの実体を持つ。すなわち、死化され、固定に近づいた水銀と、焼損をもたらす硫黄である。それが硫黄性を持つことは、明白な実験から分かる。昇華させると、そこから明らかに硫黄性で燃焼する実体が出てくるからである。昇華しなくても、その硫黄性は確認できる。赤熱させようとしても、その前に硫黄の発火によって燃え立ち、燃焼するからである。水銀の実体を持つことも感覚によって明らかとなる。水銀と同じく、銅に純銀の白さを与え、昇華の際には空色を示し、明白な金属光沢を持つのが観察できる。これらによって術者は、マルカシータが根源にこれらの実体を含むことを確信する。マグネシアについては、いっそう濁った硫黄と、いっそう土性で滓の多い水銀を持ち、その硫黄も、より固定され、燃えにくいことを、同じ実験によって明白に証明できる。また、それが鉄の本性にいっそう近いことも証明できる。
  notes:
  - Marchesita・Magnesiaは原著の鉱物分類による名称。現代の単一物質への断定は避けた。
  source_printed_page: 132
  source_pdf_page: 152
  source_erara_pdf_page: 157
- id: geber-summa-b02-c060-003
  section_id: geber-summa
  book: 2
  chapter: 60
  kind: body
  source_la: Tutia vero, est fumus ipsorum corporum alborum, et hoc manifesta probatione perpenditur.
    Nam proiecto fumo mixtionis Iovis et Veneris, adhaerente in spodilibus fabricae fabrorum, eandem impressionem
    facit cum ea. Et quod fumus Metallicus non redit, nec ipsa similiter sine alicuius corporis admixtione.
    Ideo cum fumus ipsa sit alborum corporum, alba non citrinat corpora, sed rubea. Nam citrinitas non
    est aliud, quam rubei et albi determinata proportio. Ideoque ipsa propter sui subtilitatem magis ad
    profundum corporis penetrat. Et ideo magis alterat quam suum corpus, et magis adhaeret in examine
    pauco artificio, quod iam tibi narratum est. Quaecunque igitur alterantur, per argenti vivi virtutem,
    vel sulphuris, aut horum similium necesse est alterari, quoniam haec sola communicant in natura ad
    ipsa corpora.
  translation_ja: トゥティアは白い金属体の煙であり、これは明白な証拠によって確認できる。鍛冶場の灰受けに付着した、錫と銅の混合物から出る煙を投射すると、トゥティアと同じ作用を生じる。また、この金属の煙は、何らかの金属体を混ぜなければ金属に戻らず、トゥティアも同様である。トゥティアは白い金属体の煙であるため、白い金属体を黄色にするのではなく、赤い金属体を黄色にする。黄色とは、赤と白が一定の比率で混ざったものにほかならないからである。その精妙さによって、元の金属体よりも深く金属体の内部へ浸透する。したがって、元の金属体より強く変化を与え、すでに説明したわずかな技術によって、試験に際しても、いっそう強く付着する。ゆえに、変化させられるものはすべて、水銀、硫黄、またはそれらに類するものの力によって変化しなければならない。これらだけが、金属体と本性を共有するからである。
  notes: []
  source_printed_pages:
  - 132
  - 133
  source_pdf_pages:
  - 152
  - 153
  source_erara_pdf_pages:
  - 157
  - 158
- id: geber-summa-b02-c061-title
  section_id: geber-summa
  book: 2
  chapter: 61
  kind: heading
  source_la: De natura Solis, sive Auri. Cap. LXI.
  translation_ja: 第61章　太陽、すなわち金の本性について。
  notes: []
  source_printed_page: 133
  source_pdf_page: 153
  source_erara_pdf_page: 158
- id: geber-summa-b02-c061-001
  section_id: geber-summa
  book: 2
  chapter: 61
  kind: body
  source_la: 'De corporibus nunc, ampliato sermone eorum intimam narremus essentiam. Et primo de Sole,
    postea de Luna, ultimo vero de aliis, secundum quod videbitur expedire cum suis probationibus, quae
    per experimentum habentur. Est igitur Sol creatus ex subtilissima substantia argenti vivi, et clarissima
    fixura: et ex substantia pauca sulphuris mundi, et purae rubedinis, fixi, clari, et a natura sua mutati,
    tingentis illam. Et ideo, quia contingit diversitas in coloribus ipsius sulphuris, necesse est et
    auri citrinitatem diversitatem habere similiter. Est enim quoddam magis, quoddam vero minus in citrinitate
    intensum. Quod autem sit ex subtilissima argenti vivi substantia, perpenditur et ipsum, quia argentum
    vivum de facili illud suscipit. Non enim argentum vivum aliud quam suae naturae suscipit. Quod vero
    claram et mundam illius substantiam habuit, per splendentem eius fulgorem et radiantem manifestat,
    non solum in die, verum etiam in nocte se manifestantem.'
  translation_ja: 今度は金属体について、説明を広げ、その最も内奥の本質を述べよう。まず金、次に銀、最後に他の金属体を、必要と思われる順に、実験による証拠とともに取り上げる。金は、水銀のきわめて精妙で、きわめて明るく固定された実体と、それを染める少量の硫黄の実体から作られる。その硫黄は清浄で、純粋な赤さを持ち、固定され、明るく、自らの元の本性から変化している。硫黄の色には相違が生じるので、金の黄色にも同じく相違があるはずである。ある金は黄色が濃く、別の金は薄い。金が水銀のきわめて精妙な実体からなることは、水銀が容易に金を受け入れることによって分かる。水銀は、自らと同じ本性のもの以外を受け入れないからである。明るく清浄な実体を持つことは、昼だけでなく夜にも現れる、輝き、光を放つ光沢が示している。
  notes: []
  source_printed_pages:
  - 133
  - 134
  source_pdf_pages:
  - 153
  - 154
  source_erara_pdf_pages:
  - 158
  - 159
- id: geber-summa-b02-c061-002
  section_id: geber-summa
  book: 2
  chapter: 61
  kind: body
  source_la: 'Quod vero fixam et sine sulphureitate comburente habeat, patet per omnem operationem illius
    ad ignem: nam nec minuitur, nec inflammatur. Quod vero ipsum sit sulphur tingens, patet per hoc, quod
    admixtum argento vivo, ipsum in colorem transformat rubeum: et quod sublimatum forti ignitione de
    corporibus, ita quod illorum ascendat subtilitas, cum ea citrinissimum creat colorem. Patet igitur,
    quod cum pura eius substantia purum colorem generat, cum non pura non purum. Qui vero probationis
    suae citrinitatis ostensione indiget, sensum non habet: quia per visum percipitur. Subtilissima igitur
    argenti vivi substantia ad fixionem deducta, et puritas eiusdem, et subtilissima sulphuris materia
    fixa, et non adurens, tota ipsius auri materia est essentialis. Maior vero argenti vivi, quam sulphuris
    in illo probatur quantitas, ideo maiorem argentum vivum habet ingressionem in illud. Igitur quaecunque
    volueris alterare, ad huius exemplar altera, ut ipsa ad aequalitatem eius perducas. Et modum iam ad
    illud nos dedimus.'
  translation_ja: 金が固定され、燃焼する硫黄性を持たないことは、火に対するあらゆる操作から明らかである。金は減少せず、発火もしないからである。また、その硫黄が染色するものであることは、それを水銀と混ぜると赤く変色させること、さらに金属体から強い赤熱によって、その精妙な部分が昇るように昇華させると、その部分とともにきわめて黄色い色を生じることから明らかである。したがって、純粋な実体とともにあれば純粋な色を、純粋でない実体とともにあれば純粋でない色を作る。その黄色について証拠を示してもらう必要がある者には、感覚がない。目で知覚されることだからである。ゆえに、固定へ導かれた水銀のきわめて精妙な実体とその純粋さ、そして固定され、焼損をもたらさない硫黄のきわめて精妙な材料が、金の本質的材料のすべてである。金の中では硫黄より水銀の量が多いことが示されるので、水銀は金へいっそう深く入り込む。したがって、何を変化させようとする場合も、金を手本にして変化させ、金と等しいものへ導きなさい。そのための方法は、すでに示した。
  notes: []
  source_printed_page: 134
  source_pdf_page: 154
  source_erara_pdf_page: 159
- id: geber-summa-b02-c061-003
  section_id: geber-summa
  book: 2
  chapter: 61
  kind: body
  source_la: 'Et quia subtiles et fixas habuit partes, ideo potuerunt partes eius multum densari. Et haec
    fuit causa ipsius magni ponderis. Per multam vero operatam a natura decoctionem, facta est ex illo
    paulativa resolutio, et inspissatio bona, et ultima mixtio, ut cum ignitione liquescat. Ex praecedentibus
    igitur patet, quod multa quantitas argenti vivi est causa perfectionis: multa vero sulphuris causa
    corruptionis. Et uniformitas in substantia, quae per mixtionem fit in decoctione naturali. Diversitas
    vero in substantia, est causa corruptionis. Et induratio et inspissatio, quae per longam et temperatam
    perficitur decoctionem, est causa perfectionis, oppositum vero corruptionis. Igitur si ceciderit super
    ipsum argentum vivum sulphur non debite, necesse est secundum diversitatem illius diversas corruptiones
    adduci. Potest enim sulphur quod super illud cadit, fixum, non adustibile esse totum, aut totum adustibile,
    et fugiens in natura sulphuris: aut fugiens, et non in natura sulphuris, aut partem fugientis, partem
    vero fixi tenere: sed in parte naturam sulphuris tenere, in parte vero non: aut totum mundum, aut
    medium immundum: aut multae quantitatis, aut paucae, superans in commixto: aut paucae quantitatis
    superatum in illo, aut nec superans nec superatum: aut album, aut rubeum, aut mediocre. Ex his itaque
    omnibus diversitatibus necesse fuit in natura diversa creari corpora, et his similia: quas omnes oportet
    narrare nos cum probationibus manifestis.'
  translation_ja: 金の部分は精妙で固定されているため、非常に密に集まることができた。これが大きな重量の原因である。自然が多くの煮熟を行ったことによって、徐々に解きほぐされ、十分に濃密となり、究極の混合が生じたため、赤熱とともに溶融する。以上から、水銀の量が多いことは完全性の原因であり、硫黄の量が多いことは腐敗の原因であると分かる。また、自然の煮熟の中で混合によって生じる実体の均一性も、完全性の原因である。一方、実体の不均一性は腐敗の原因となる。長く穏やかな煮熟によって成し遂げられる硬化と濃密化は完全性の原因であり、その反対は腐敗の原因である。したがって、水銀に硫黄が適切でない仕方で加われば、その相違に応じて、異なる腐敗がもたらされるはずである。そこへ加わる硫黄は、全体が固定されて焼損しない場合も、全体が焼損性で硫黄の本性のまま揮散する場合も、揮散するが硫黄の本性を持たない場合も、一部が揮散性で一部が固定される場合もある。また、一部が硫黄の本性を持ち、他の部分は持たない場合、全部が清浄な場合、半ば不純な場合、量が多いか少ないかにかかわらず混合物の中で優勢な場合、量が少なく劣勢な場合、優勢でも劣勢でもない場合もある。白い場合、赤い場合、その中間の場合もある。これらすべての相違から、自然において異なる金属体やその類似物が生じなければならなかった。私たちはこれらの相違をすべて、明白な証拠とともに述べなければならない。
  notes: []

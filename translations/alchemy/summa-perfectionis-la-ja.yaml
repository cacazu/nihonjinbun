- id: geber-summa-b02-c064-004
  section_id: geber-summa
  book: 2
  chapter: 64
  kind: body
  source_la: Ex praecedentibus itaque sermonibus relinquitur, duplicem esse in corporibus sulphureitatem.
    Unam quidem in profunditate argenti vivi conclusam, in principio suae mixtionis, alteram vero supervenientem.
    Quarum altera cum labore tollitur, alteram vero nullo artificiorum ingenio, quod per ignem perficitur,
    possibile est tolli, ad quod possit nostra operatio congrue ac utiliter pervenire, cum iam cum eo
    ad eandem cerationem unitum factum est. Et hoc experimento probatur, quod sulphureitatem adustibilem
    videmus per ignem deleri, sulphureitatem vero fixam minime. Si igitur dixerimus corpora calcinatione
    mundari, intelligas utique a terrea substantia, quae non in radice suae naturae unita est. Quoniam
    unitam mundare per ignis ingenium non est possibile, nisi adveniat argenti vivi medicina occultans
    et contemperans illam, aut illam de commixto separans.
  translation_ja: 以上の説明から、金属体には二種類の硫黄性があると結論される。一つは、混合が始まるときに水銀の奥深くへ閉じ込められたものであり、もう一つは、後から加わったものである。その一方は苦労して取り除けるが、他方は、すでに水銀と結び付き、同じ蝋状軟化の状態をなしているため、私たちの操作が適切かつ有益に達成しうる、火によるどのような技法によっても取り除けない。このことは、焼損性の硫黄性は火によって除かれるが、固定された硫黄性はまったく除かれないという実験によって証明される。したがって、金属体が焼成によって清められるといった場合、その本性の根源で結合していない土性の実体から清められると理解しなさい。根源で結合したものは、水銀の薬が加わってそれを覆い隠し、適度に和らげるか、混合物から分離しないかぎり、火の技法によって清めることはできないからである。
  notes: []
  source_printed_page: 142
  source_pdf_page: 162
  source_erara_pdf_page: 167
- id: geber-summa-b02-c064-005
  section_id: geber-summa
  book: 2
  chapter: 64
  kind: body
  source_la: Separatio autem terreae substantiae in radice naturae metallo unitae ab eius commixto fit.
    Aut per elevationem cum rebus substantiam argenti vivi elevantibus, et sulphureitatem dimittentibus,
    propter convenientiam cum eis, ut est Tutia et Marchesita, quoniam fumi sunt, quorum maior pars argenti
    vivi est quantitas, quam sulphuris. Et huius experientiam vides, quoniam si forti et subita fusione
    haec coniunxeris cum corporibus, spiritus secum adducent corpora in fuga sua. Ideoque cum eis elevare
    poteris. Aut cum lavatione per argenti vivi commixtionem, quam narravimus. Argentum enim vivum tenet
    quod suae naturae est, alienum vero respuit.
  translation_ja: 本性の根源で金属と結合した土性の実体を、その混合物から分離するには、二つの方法がある。一つは、水銀の実体を上昇させ、硫黄性を残す物とともに上昇させる方法である。そのような物とは、親和性を持つトゥティアやマルカシータである。これらは、硫黄より水銀の量が多い煙だからである。これらを強く急激な溶融によって金属体と結び付けると、精気は揮散する際、金属体を伴って行く。この実験によってそれが分かり、したがって、これらとともに金属体を上昇させることができる。もう一つは、すでに述べた、水銀を混ぜ合わせる洗浄による方法である。水銀は、自らの本性に属するものを保持し、異質なものを退けるからである。

- id: geber-summa-b01-c039-003
  section_id: geber-summa
  book: 1
  chapter: 39
  kind: body
  source_la: Quod vero per sublimationem adustio removeatur, patet experimento, quoniam arsenicum, quod
    prius ante sui sublimationem, impium et pronum erat ad adustionem, post eius sublimationem inflammari
    se non permittit, sed solummodo sine inflammatione recedit, et hoc idem in sulphure (si experieris)
    invenies. Quia autem in nullis aliis quam in spiritibus vidimus adhaerentiam ad corpora cum alteratione,
    per nullam aliam causam fuimus ab eis excusati, quin necessarium fuerit, illos praeparasse, cum mundatione
    illorum, quae est per sublimationem, ideo huius fuit causa necessaria inventionis. Sublimationis igitur
    narremus ordinem totum sine diminutione, et ipsius causam.
  translation_ja: 昇華によって焼損性が取り除かれることは、試験から分かる。昇華前には激しく焼損へ向かいやすかった砒素性物質も、昇華後には炎を上げず、ただ燃えずに逃れ去るからである。試せば、硫黄にも同じことを見いだすだろう。また、変質を伴って金属体に付着するものを、精気以外には見いださなかった。そのため、精気を用いなくてよい別の理由はなく、昇華による浄化を伴う調製が必要であった。これが、昇華の発見を必要とした原因である。そこで、昇華の手順全体とその原因を、何も省かずに語ろう。
  notes: *id010
  source_printed_page: 76
  source_pdf_page: 96
  source_erara_pdf_page: 101
- id: geber-summa-b01-c040-title
  section_id: geber-summa
  book: 1
  chapter: 40
  kind: heading
  source_la: Quid sit sublimatio, et de tribus gradibus ignis in ea observandis. Caput XL.
  translation_ja: 第40章　昇華とは何か。その際に守るべき火の三段階について。
  notes: &id011 []
  source_printed_page: 76
  source_pdf_page: 96
  source_erara_pdf_page: 101
- id: geber-summa-b01-c040-001
  section_id: geber-summa
  book: 1
  chapter: 40
  kind: body
  source_la: Dicimus igitur, Sublimatio est rei siccae per ignem elevatio, cum adhaerentia sui vasis.
    Sublimatio vero diversificatur propter diversitatem spirituum sublimandorum. Quaedam enim fit cum
    forti ignitione, quaedam vero cum mediocri, quaedam vero cum igne remisso. Si igitur sublimetur arsenicum
    vel sulphur, necesse est illa per remissum ignem sublimari, quoniam cum habeant partes subtilissimas
    coniunctas uniformiter grossis, ascenderet utique illorum tota substantia sine purificatione aliqua,
    imo denigrata et combusta. Ut igitur separet quis immundam terream substantiam, necesse est ingenia
    duorum invenire generum, proportionem scilicet ignis, et mundificationem cum commixtione fecum, quoniam
    commixtio cum fecibus partes comprehendit grossas, et tenet illas in aludelis fundo depressas, nec
    eas scandere permittit.
  translation_ja: 昇華とは、乾いた物が火によって昇り、その容器に付着することである。昇華は、昇華すべき精気の違いに応じて異なる。強い加熱によるもの、中程度のもの、弱い火によるものがある。砒素性物質または硫黄を昇華させるなら、弱い火による必要がある。これらは非常に微細な部分が粗大な部分と均一に結合しているため、そうしなければ、実体全体が何ら浄化されずに昇り、むしろ黒く焼けたものになるからである。不浄な土性の実体を分けるには、二種類の工夫が必要である。すなわち、火の適度な強さと、滓を混ぜることによる浄化である。滓との混合は粗大な部分を捕らえ、アルデルの底に押しとどめ、昇るのを許さない。
  notes: *id011
  source_printed_pages:
  - 76
  - 77
  source_pdf_pages:
  - 96
  - 97
  source_erara_pdf_pages:
  - 101
  - 102
- id: geber-summa-b01-c040-002
  section_id: geber-summa
  book: 1
  chapter: 40
  kind: body
  source_la: Unde et necesse est artificem triplicem ignis gradum sublimationi applicare. Unum proportionatum
    taliter, quod per eum ascendant alterata tantum et mundiora et lucidiora, donec per hoc manifeste
    viderit ipsa mundari a terrea feculentia. Alter vero gradus est, ut quod in fecibus remansit de pura
    illorum essentia, sublimetur cum maiori expressione ignis, videlicet cum ignitione aludelis et ipsarum
    fecum, quam videre poterit oculis suis. Tertius vero gradus est, ut administretur ignis debilissimus
    sine fecibus, ei quod sublimatum a fecibus, et iam depuratum est, ita ut vix aliquid de illo ascendat,
    et quod ascendet de illo sit res subtilissima, quae in hoc opere nihil valet, quia illa est res, mediante
    qua adustio fit in sulphuribus.
  translation_ja: それゆえ、術者は昇華に三段階の火を用いる必要がある。第一は、変化し、より清浄で明るくなった部分だけが昇るよう調整した火であり、土性の滓から浄化されるのが明らかに見えるまで用いる。第二の段階では、滓に残った純粋な実体を、より強い火力で昇華させる。すなわち、アルデルと滓自体が赤熱し、その様子を目で見られる程度である。第三の段階では、滓から昇華してすでに精製されたものに、滓を加えず、きわめて弱い火を用いる。そこからほとんど何も昇らず、昇るものは、この作業で何の役にも立たない、きわめて微細なものとなるようにする。その物が、硫黄類において焼損を生じさせる媒介だからである。
  notes: *id011
  source_printed_page: 77
  source_pdf_page: 97
  source_erara_pdf_page: 102
- id: geber-summa-b01-c040-003
  section_id: geber-summa
  book: 1
  chapter: 40
  kind: body
  source_la: Est igitur tota sublimationis intentio haec, ut remota terreitate illius per ignis administrationem
    debitam, et abiecta similiter ex ea subtilissima et fumosa illius parte, quae adustionem cum corruptione
    adducit, relinquatur nobis pars illa, quae in aequalitate consistit, quae simplicem fusionem super
    ignem facit, sine adustione aliqua de igne fugiente sine inflammatione illius. Quod vero subtilissimum
    sit adustivum, manifestissimis argumentationibus probatur. Quia ignis ad suam convertit naturam unumquodque
    eorum quod magis affine illi est, quia ex unaquaque re adustibili magis affine est, quod ex illa est
    subtile, et adhuc magis affine est, quod subtilius est. Ergo et maxime affine quod subtilissimum est.
    Ab experientia similiter, quoniam sulphur vel arsenicum non sublimatum velocissime inflammatur, Sulphur
    vero facilius. Sublimatum vero directe non inflammatur, sed evolat et extenuatur sine inflammatione,
    praecedente tamen fusione. His itaque patet, sermonem nostrum veridicum esse.
  translation_ja: したがって、昇華の目的全体はこうである。適切な火の操作によって土性を除き、同じように、損壊を伴う焼損を起こす最も微細で煙状の部分を取り去り、均衡のとれた部分が残るようにする。その部分は火の上で単純に溶け、焼損も炎も伴わず火から逃れる。最も微細なものが焼損をもたらすことは、きわめて明白な議論によって証明される。火は、自分により近い本性のものを、自分の本性へと変える。燃え得るそれぞれの物では、微細な部分がより火に近く、さらに微細なものは、いっそう近い。したがって最も微細なものが、最も近い。また経験からも、昇華されていない硫黄や砒素性物質は非常に速く燃え、硫黄はいっそう容易に燃える。正しく昇華されたものは炎を上げず、まず溶けてから、燃えずに飛び去り希薄になる。これらによって、私たちの言葉が真実であることが分かる。
  notes:
  - affine は原刊正誤表78頁2行の指定に従った。
  source_printed_pages:
  - 77
  - 78
  source_pdf_pages:
  - 97
  - 98
  source_erara_pdf_pages:
  - 102
  - 103
- id: geber-summa-b01-c041-title
  section_id: geber-summa
  book: 1
  chapter: 41
  kind: heading
  source_la: De fecibus corporum metallorum, spiritibus in sublimatione addendis, et earum quantitate
    ac qualitate. Caput XLI.
  translation_ja: 第41章　昇華の際、精気に加える金属体の滓と、その量および性質について。
  notes: *id011
  source_printed_page: 78
  source_pdf_page: 98
  source_erara_pdf_page: 103
- id: geber-summa-b01-c041-001
  section_id: geber-summa
  book: 1
  chapter: 41
  kind: body
  source_la: Probatio vero administrationis fecum, cum proportione sua est, ut eligatur materia illa cum
    qua plus conveniant spiritus sublimandi, et cui permisceantur profundius, quoniam illa cui magis uniuntur,
    potentior est in retentione fecum sublimandorum, quam cui non. Huius rationabilis satis est et manifesta
    probatio. Probatio vero quod necessaria sit fecum administratio, est, quia si non coniungerentur sulphur
    vel arsenicum sublimandum cum fece de aliqua re fixa, tunc necesse esset ea cum tota sui substantia
    ascendere, non mundata. Experientia vero sciunt, nos verum dicere, qui in sublimationibus exercitati
    sunt.
  translation_ja: 滓を適切な割合で加えることの根拠は、昇華すべき精気がよりよく適合し、より深く混じる材料を選ぶことにある。精気が強く結合する材料のほうが、そうでない材料より、昇華されるものの滓を保持する力が強いからである。この論証は十分に理にかなって明白である。滓を加えることが必要な証明は、もし昇華すべき硫黄や砒素性物質を、何らかの固定された物の滓と結合させなければ、実体全体が浄化されずに昇ってしまう、ということである。昇華に習熟した者は、私たちが真実を述べていることを経験から知っている。
  notes: *id011
  source_printed_page: 78
  source_pdf_page: 98
  source_erara_pdf_page: 103
- id: geber-summa-b01-c041-002
  section_id: geber-summa
  book: 1
  chapter: 41
  kind: body
  source_la: Probatio vero, quod necessaria sit talium fecum administratio, quibus sublimanda conveniant
    et uniantur in profundo suo, quia si feces non permiscerentur per minima, tunc idem contingeret, sicut
    si fecem non haberent, scilicet ut ascenderet tota illorum essentia sine mundatione aliqua, sicut
    ascendunt sine fecibus cum tota substantia, ergo et similiter a fecibus sublimata quibus non uniuntur,
    accidere necesse est. Experientia scit verum hoc esse, qui hoc vidit et novit, quia cum sublimavit
    a re extranea a corporum natura, sublimavit in vanum, ut nullo modo depurata post ascensionem illorum
    inveniret. Si vero cum calce alicuius corporis sublimavit, tunc bene sublimavit et perfecte mundare
    potuit, cum facilitate.
  translation_ja: 昇華すべきものが深部で適合・結合するような滓を加える必要があることの証明はこうである。滓がごく小さな部分まで混じらなければ、滓がない場合と同じことが起こる。すなわち、実体全体が何ら浄化されずに昇る。滓がなければ全実体とともに昇るのだから、結合しない滓から昇華させても、同じことが起こるはずである。これを見て知った者は、経験からその真実を知っている。金属体の本性に異質な物から昇華させたときには、作業は空しく、昇った後もまったく精製されたものを見いだせなかったからである。しかし何らかの金属体の灰とともに昇華させたなら、正しく昇華させ、容易に完全に浄化できた。
  notes: *id011
  source_printed_pages:
  - 78
  - 79
  source_pdf_pages:
  - 98
  - 99
  source_erara_pdf_pages:
  - 103
  - 104
- id: geber-summa-b01-c041-003
  section_id: geber-summa
  book: 1
  chapter: 41
  kind: body
  source_la: Est ergo intentio fecum, ut administrentur de calcibus metallorum. Est enim in illis facilis
    operationis sublimatio, cum rebus autem aliis difficillima. Non est ergo aliquid, quod locum illorum
    possit obtinere. Non autem dicimus sublimationem impossibilem sine calcibus corporum, sed eam difficillimam
    et longissimi laboris et protelationis usque in desperationem. Sed in hoc tamen aliquid bonitatis
    habet, quia quod sublimatur absque fecibus, vel sine corporum calcibus, est quantitatis multae, quod
    vero cum fecibus, minoris. Adhuc vero et quod cum corporum calcibus, minimae est quantitatis, sed
    facillimi laboris et brevissimi. Illud vero quod plus nos excusat a fecibus de corporibus, est omne
    genus salis praeparati, et huius consimilium in natura. Et est nobis cum eis sublimatio multae quantitatis
    etiam possibilis, quia facilis fit ab eis sublimandarum fecum separatio per salium solutionem, quod
    in nullis aliis rebus esse contingit.
  translation_ja: したがって、滓を用いる意図は、金属の灰からなるものを加えることにある。それらでは昇華の操作が容易であり、他の物では非常に難しい。その代わりとなれるものはない。ただし、金属体の灰なしでは昇華が不可能だというのではない。きわめて難しく、非常に長い労苦を要し、絶望するほど長引くのである。しかし、その方法にも一つの利点はある。滓なし、あるいは金属体の灰なしで昇華させるものは量が多く、滓とともに行うものはより少ない。金属体の灰とともに行うものはさらに少量だが、作業は最も容易で短い。金属体由来の滓を使う必要を最もよく軽減してくれるのは、あらゆる種類の調製された塩と、それと本性の類似するものである。それらを用いれば、多量の昇華も可能である。塩を溶かすことで、昇華すべきものの滓を容易に分離できるからであり、これは他の物には見られない。
  notes: *id011
  source_printed_pages:
  - 79
  - 80
  source_pdf_pages:
  - 99
  - 100
  source_erara_pdf_pages:
  - 104
  - 105
- id: geber-summa-b01-c041-004
  section_id: geber-summa
  book: 1
  chapter: 41
  kind: body
  source_la: Proportio vero fecum est, ut quantitas fecum quantitati sublimandorum aequetur. In hoc enim
    etiam rudis artifex errare non poterit. Mediocrem vero artificem, ponere medietatem ponderis sublimandorum
    ex fecibus, sufficiens esse contingit, et in hoc errare non debet. Exercitato vero et maxime experto,
    minima illarum pars sufficit. Quanto enim minores fecum sunt quantitates, tanto et maioris exuberantiae
    sublimationem necesse est esse, dummodo et secundum diversitatem subtractionis fecum, fiat proportionalis
    illi subtractio ignis. In parva enim quantitate, parvus ad perfectionem ignis eliciatur, in magna
    magnus, in maiori maior.
  translation_ja: 滓の割合は、昇華すべきものの量と等しくなるようにする。これなら未熟な術者でも誤ることはない。中程度に熟達した術者なら、昇華すべきものの重さの半分の滓を置けば十分であり、誤るべきではない。熟練し、非常に経験豊かな者なら、ごく少量で足りる。滓の量が少ないほど、昇華の収量は多くなるはずである。ただし、滓を減らした割合に応じて、火も比例して弱めることが条件である。少量には小さな火、大量には大きな火、さらに多ければさらに強い火を用い、完成へ導くのである。
  notes: *id011
  source_printed_page: 80
  source_pdf_page: 100
  source_erara_pdf_page: 105
- id: geber-summa-b01-c042-title
  section_id: geber-summa
  book: 1
  chapter: 42
  kind: heading
  source_la: De moderando igne in Sublimatione. Caput XLII.
  translation_ja: 第42章　昇華における火の調節について。
  notes: &id012 []
  source_printed_page: 80
  source_pdf_page: 100
  source_erara_pdf_page: 105
- id: geber-summa-b01-c042-001
  section_id: geber-summa
  book: 1
  chapter: 42
  kind: body
  source_la: Sed quoniam ignis non est res quae mensurari possit, ideo contingit in illo errare saepissime,
    cum quis exercitatus non est, tam ex diversitate fornacum et lignorum adurendorum, quam vasorum et
    coaptationis illorum. De quibus omnibus expedit artificem attentum solicitare. Sed communem adducimus
    regulam. Quod in primis expedit cum parvitate ignis, solam aqueitatem ex sublimandis exprimere, qua
    remota, si quid ascendit per illum, tunc in principio hic non augeatur ignis, ut per debilissimum
    ignem subtilissima pars tollatur, et seorsum ponatur, quae est causa adustionis.
  translation_ja: 火は測り得る物ではないため、習熟していない者は、しばしばその扱いを誤る。炉や燃やす木材の違いだけでなく、容器とその据え方の違いも原因となる。術者は、これらすべてを注意深く気にかけなければならない。しかし一般的な規則を示そう。初めは弱い火で、昇華すべき物から水性だけを追い出すのがよい。それを除いた後、その火によって何かが昇るなら、その初めには火を強めない。最も弱い火で、焼損の原因である最も微細な部分を取り出し、別に置くためである。
  notes:
  - 温度を数値で測定する近代的手法以前の記述である。現代の実験条件へ換算していない。
  source_printed_pages:
  - 80
  - 81
  source_pdf_pages:
  - 100
  - 101
  source_erara_pdf_pages:
  - 105
  - 106
- id: geber-summa-b01-c042-002
  section_id: geber-summa
  book: 1
  chapter: 42
  kind: body
  source_la: Cum autem iam nihil vel modicum ascenderit (quod experiri poteris cum intromissione bombicis
    lycinii in superius foramen aludelis) vigoretur ignis sub eo, et quantum vigoris debeat esse ignis,
    tibi experientia lycinii ostendet. Si enim parum de sublimando vel mundum exierit, adhuc parvus erit
    ignis, augeatur igitur. Si vero multum et immundum, tunc superfluus est, subtrahatur igitur. Si vero
    mundum et multum, proportio iam inventa est. Immundum autem vel mundum per extractionem lycinii, quod
    in foramine aludelis positum est, cognoscetur. Secundum enim quam quantitatem mundiciem vel immundiciem
    ex sublimando respexerit artifex adhaesisse lycinio, syllogisare poterit, et in tota sublimatione
    necessario proportionalem ignem, et ex hoc ignis rectificationem inveniet sine fallacia.
  translation_ja: もはや何も、あるいはわずかしか昇らなくなったら、下の火を強める。これは、アルデルの上の穴に綿の灯芯を差し入れて確かめられる。火をどれほど強めるべきかは、灯芯による試しで分かる。昇華すべき物から出るものが、清浄であってもわずかなら、火はまだ弱いので強める。多量で不浄なら、火は過剰なので弱める。清浄で多量なら、適度な強さが得られた。不浄か清浄かは、アルデルの穴に置いた灯芯を抜いて知る。術者は、昇華する物が灯芯に付着した量と、その清浄さ、不浄さを見て、昇華全体に必要な火の適度な強さを推し量り、それによって誤りなく火を正す方法を見いだせる。
  notes:
  - 原刊正誤表81頁4行に従い、bombacis を bombicis とした。
  source_printed_page: 81
  source_pdf_page: 101
  source_erara_pdf_page: 106
- id: geber-summa-b01-c042-003
  section_id: geber-summa
  book: 1
  chapter: 42
  kind: body
  source_la: Melior vero modus fecum est, ut sumantur ferri squamae, vel aeris combusti. Et haec quidem
    propter privationem malae humiditatis, de facili sulphur aut arsenicum sibi imbibunt, et secum uniunt.
    Huius autem viam scit exercitatus solus.
  translation_ja: 滓としてよりよいのは、鉄の鱗片、あるいは焼いた銅の鱗片を取る方法である。これらは有害な湿りを欠いているため、硫黄や砒素性物質を容易に吸い込み、自らと結びつける。ただし、その方法を知るのは熟練した者だけである。
  notes: *id012
  source_printed_page: 81
  source_pdf_page: 101
  source_erara_pdf_page: 106
- id: geber-summa-b01-c043-title
  section_id: geber-summa
  book: 1
  chapter: 43
  kind: heading
  source_la: De erroribus circa quantitatem fecum et dispositionem fornacis in sublimando sulphure et
    arsenico vitandis, item de Fornace construendo, et lignis eligendis. Caput XLIII.
  translation_ja: 第43章　硫黄と砒素性物質の昇華で、滓の量と炉の配置に関して避けるべき誤り。また炉の建造と木材の選択について。
  notes: *id012
  source_printed_page: 81
  source_pdf_page: 101
  source_erara_pdf_page: 106
- id: geber-summa-b01-c043-001
  section_id: geber-summa
  book: 1
  chapter: 43
  kind: body
  source_la: Expedit ergo nos rectificare artificem in omnibus, in quibus contingit errare ignoranter,
    in horum duorum spirituum sublimatione. Narremus igitur primo, quod si multas feces posuerit, tunc
    si non augmentaverit ignem proportionalem, nihil ex sublimando ascendet. Quomodo autem illum inveniat,
    iam ei sufficienter narratum est. Et si paucam fecum quantitatem, vel non ex corporum calce posuerit,
    tunc si illius proportionem non invenerit, ascendet sublimandum cum tota substantia. Et huius tradidi
    similiter inventionem sufficientem.
  translation_ja: それゆえ、この二つの精気の昇華において、無知によって誤り得るすべての点で、術者を正すのが適切である。まず述べよう。滓を多く置いたとき、それに比例して火を強めなければ、昇華すべき物から何も昇らない。適度な火をどう見いだすかは、すでに十分説明した。また、滓を少量しか置かなかったり、金属体の灰でないものを置いたりした場合、その割合に適した火を見いださなければ、昇華すべき物は全実体とともに昇ってしまう。この適度を見いだす方法も、同様に十分伝えた。
  notes: *id012
  source_printed_pages:
  - 81
  - 82
  source_pdf_pages:
  - 101
  - 102
  source_erara_pdf_pages:
  - 106
  - 107
- id: geber-summa-b01-c043-002
  section_id: geber-summa
  book: 1
  chapter: 43
  kind: body
  source_la: Ex fornace vero similiter contingit errare, nam magna fornax magnum dat ignem, parvum vero
    parva, si ligna et foramina auricularum eius proportionantur. Si igitur posuerit multam rei sublimandae
    quantitatem in parvam fornacem, ignem elevationis sufficientem non poterit exhibere. Si vero paucam
    quantitatem in magnam fornacem, sublimationem exterminabit propter ignis excessum. Similiter vero
    spissa fornax condensatum et fortem dat ignem, tenuis vero rarum et debilem, in quibus similiter errare
    contingit. Similiter vero cum spaciosis auriculis furnus, et clarum et magnum dat ignem, cum strictis
    vero debilem. Item si maior fuerit vasis in coaptatione ad furnum distantia a spondilibus eius, magnum
    dabit ignem, si vero minor, minorem. In quibus omnibus contingit errare maxime.
  translation_ja: 炉によっても同じく誤りが起こる。木材と通気孔が適度に整えられているなら、大きな炉は大きな火、小さな炉は小さな火を与える。小さな炉に多量の昇華材料を置けば、昇らせるのに十分な火を与えられない。大きな炉に少量しか置かなければ、火の過剰によって昇華を台無しにする。また厚い炉は密で強い火を、薄い炉は疎で弱い火を与え、ここでも誤りが起こる。広い通気孔を持つ炉は明るく大きな火を、狭い通気孔の炉は弱い火を与える。さらに、容器を据えたとき、炉壁との距離が大きければ大きな火、小さければ小さな火を与える。これらすべてで、大きな誤りが起こり得る。
  notes: *id012
  source_printed_page: 82
  source_pdf_page: 102
  source_erara_pdf_page: 107
- id: geber-summa-b01-c043-003
  section_id: geber-summa
  book: 1
  chapter: 43
  kind: body
  source_la: 'Rectificatio ergo horum est, ut furnus scilicet construatur secundum intentionem ignis quam
    quaerit, spissus scilicet cum liberis auriculis, cum distantia vasis aludelis multa a spondilibus
    furni, si magnum quaerit ignem. Si vero mediocrem, mediocrem in his omnibus inveniat proportionem:
    si vero debilem, proportionem in his eandem inveniat. Et has proportiones omnes docebimus te invenire
    cum praeparatione vera et experientia determinata.'
  translation_ja: これらを正すには、求める火の目的に従って炉を造る。大きな火を求めるなら、炉を厚くし、通気孔をよく開き、アルデル容器を炉壁から十分離す。中程度の火を求めるなら、これらすべてを中程度に調整する。弱い火なら、それに応じた割合を見いだす。これらの割合をすべて、正しい調製と定まった経験によって見いだす方法を、あなたに教えよう。
  notes:
  - 原刊正誤表83頁2行に従い、proportione vera を praeparatione vera とした。
  source_printed_pages:
  - 82
  - 83
  source_pdf_pages:
  - 102
  - 103
  source_erara_pdf_pages:
  - 107
  - 108
- id: geber-summa-b01-c043-004
  section_id: geber-summa
  book: 1
  chapter: 43
  kind: body
  source_la: Si igitur volueris multam sublimationis quantitatem elevare, tunc vas aludel tantae capacitatis
    invenias, quod illam suscipiat super fundum, ad elevationem unius palmae. Ad illud coaptes furnum
    ut suscipiat aludel in medio sui cum distantia parietum suorum per duos digitos. Et furno facto, facies
    illi decem auriculas aeque distantes proportione una, ut una aequalitas sit ignis ad omnes partes
    illius. Tunc vero stipite ferreo in medio fornacis ex transverso in spondilibus eius firmato, qui
    a fundo fornacis distet ad extensionem unius palmae cum pollice suo, et ad spissitudinem unius digiti,
    super eo firmetur vas aludel, et circumlinatur ad furnum, quem sequens demonstrat descriptio.
  translation_ja: 多量の昇華物を昇らせたいなら、その材料を底から一パルマの高さまで収められる容量のアルデルを用意する。それに合わせて炉を造り、中央にアルデルを収め、炉壁との間を二指分あける。炉ができたら、同じ大きさの通気孔を十個、等間隔に設け、すべての部分に火が均等に行き渡るようにする。次に、炉の中央を横断する鉄棒を炉壁に固定する。棒は、炉底から親指を含めた一パルマの幅ほど離し、太さは一指分とする。その上にアルデル容器を固定し、炉との周囲を塗り固める。続く図がこれを示す。
  notes:
  - palma と digitus は身体寸法に基づく原文の尺度をそのまま保持した。現代の安全な設計寸法へ換算していない。
  source_printed_page: 83
  source_pdf_page: 103
  source_erara_pdf_page: 108
- id: geber-summa-b01-c043-005
  section_id: geber-summa
  book: 1
  chapter: 43
  kind: body
  source_la: Tunc vero adverte, si bene et libere se expediverit de fumositatibus, et flamma libere per
    totum furnum transiverit in circuitu aludelis, tunc bene proportionatum est, si vero non, non. Et
    tunc dilata eius auriculas, et si emendatur, bene quidem, si vero non, tunc necessario relinquitur,
    quod distantia aludelis a parietibus nimis parva est, radantur ergo tunc parietes, et amplietur distantia,
    et postea tentetur. Reiteretur ergo ampliatio auricularum et rasura spondilium, quousque libere se
    absolvat a fumo, et flamma in circuitu aludelis sit lucida, et fumus libere per auriculas exeat. Ista
    est sufficiens experientia ad omnem sublimationis quantitatem de inventione magnitudinis furni, et
    dilatationis auricularum, et distantiae aludelis a parietibus eius.
  translation_ja: そして観察しなさい。煙を十分かつ自由に排出し、炎がアルデルの周囲を、炉全体にわたって自由に通るなら、割合は適切である。そうでなければ、適切ではない。その場合、通気孔を広げる。それで改善するならよい。そうでなければ、アルデルと炉壁の距離が小さすぎることになる。そこで炉壁を削り、間隔を広げ、再び試す。煙が自由に抜け、アルデルの周囲の炎が明るく、通気孔から煙が自由に出るまで、通気孔の拡張と炉壁の削りを繰り返す。これは、どの量の昇華に対しても、炉の大きさ、通気孔の広さ、アルデルと炉壁の間隔を見いだすのに十分な試しである。
  notes: *id012
  source_printed_pages:
  - 83
  - 84
  source_pdf_pages:
  - 103
  - 104
  source_erara_pdf_pages:
  - 108
  - 109
- id: geber-summa-b01-c043-006
  section_id: geber-summa
  book: 1
  chapter: 43
  kind: body
  source_la: Inventio vero spissitudinis furni est, quod si quaesieris magnum ignem, maior spissitudo
    illius sit, ad mensuram extensionis palmae cum pollice suo. Si vero mediocrem, ad mensuram unius palmae.
    Si vero minorem, ad spissitudinem duorum digitorum formetur.
  translation_ja: 炉の厚さを決めるには、大きな火を求めるなら、厚くし、親指を含めた一パルマの幅を尺度とする。中程度なら一パルマ、小さな火なら二指分の厚さに造る。
  notes: *id012
  source_printed_page: 84
  source_pdf_page: 104
  source_erara_pdf_page: 109

- id: geber-summa-b02-c056-001
  section_id: geber-summa
  book: 2
  chapter: 56
  kind: body
  source_la: Principiorum itaque huius magisterii discussione tradita, necesse est ex promissione nostra
    intentum huius artis complete prosequi, sermone illi conveniente. Et est scilicet consideratio omnis
    rei, per quam perfectio huius operis apertius ostendatur. Et consideratio necessitatis perfectionis
    medicinae, scilicet ut discutiatur, ex qua re melius vel propinquius eliciatur illa, ad omnem imperfecti
    perfectionem. Et consideratio similiter artificiorum, per quae cognoscamus, an perfectio sit completa.
    His tribus itaque traditis, et tota erit perfectionis tradita cognitio, secundum nostrae artis indigentiam.
  translation_ja: さて、この秘術の原理についての検討を伝え終えたので、約束に従い、この術の目的を、それにふさわしい言葉で最後まで論じなければならない。すなわち、この作業の完成をいっそう明らかに示す、あらゆる物についての考察である。また、完全化の薬に必要な条件について考察し、あらゆる不完全な物を完成させるため、その薬を何から取り出すのが最もよく、最も直接的であるかを検討する。さらに、完成が成し遂げられたかを知るための技法について考察する。この三つを伝えれば、私たちの術に必要な限りで、完全性についての知識はすべて伝えられることになる。
  notes: []
  source_printed_page: 126
  source_pdf_page: 146
  source_erara_pdf_page: 151

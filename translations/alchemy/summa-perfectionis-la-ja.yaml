scope:
  included: 1541年『De alchemia』所収『Summa perfectionis』全二巻、第1–100章（原刊20–205頁）。第1巻は第1–55章、第2巻は第56–100章。原刊の見出し、本文、結び、図版9点をすべて含む。他年刊本の同名書とは区別する。

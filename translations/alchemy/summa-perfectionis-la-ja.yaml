- id: geber-summa-b02-c080-002
  section_id: geber-summa
  book: 2
  chapter: 80
  kind: body
  source_la: 'Quia igitur corporum est aliquid impermutabile, quod in corporum radice innatum est, quod
    per secundi ordinis medicinam tolli non potest: ideo omnis illa medicina quae illud de commixto tollit,
    non secundi ordinis, sed tertii, et maioris ordinis appellatur medicina. Et quia superfluitates fugientium
    invenimus per calcinationis modum tolli, et per reductionis reiterationem terreitatem non innatam:
    ideo necesse fuit medicinam secundi ordinis invenire, quae quidem innatum palliet, et durum remolliat,
    et molle induret, in duris scilicet et mollibus, secundum complementum non Sophisticum, sed Solificum,
    aut Lunificum verum imperfectorum corporum, perfecte constituat. Cum pateat igitur in corporibus solis
    quidem mollibus per ingenia artificiorum huius operis non posse liquefactionis festinantiam tolli,
    nec impuritatem in principiorum sui radice innatam, necessario evenit medicinam percunctari, quae
    quidem in proiectione illorum tenuitatem inspisset, et inspissando ad suae liquefactionis ignitionis
    sufficientiam induret, in duris spissitudinem attenuet, et attenuando ad fusionis velocitatem sufficientem
    cum proprietate ignitionis adducat, et utriusque generis corporum fuscedinem palliando decoret: et
    hoc in album, illud vero in citrinum transformet perfectissimum.'
  translation_ja: 金属体には、その根に生来備わり、第二位の薬では除けない不変のものがある。したがって、それを混合物から取り去る薬は、第二位ではなく、第三位すなわち上位の薬と呼ばれる。また、逃散する物の過剰分は焼成によって、先天的でない土性は還元の反復によって除けることを見いだした。そこで、生来のものを覆い、硬いものを軟らかく、軟らかいものを硬くし、硬軟いずれの不完全な金属体にも、見せかけではなく、真に金または銀の完成をもたらす第二位の薬を見いだす必要があった。軟らかい金属体だけについていえば、この操作の技法を工夫しても、溶ける速さや、その構成原理の根に生来備わる不純さを取り除けないことは明らかである。ゆえに、投与によって希薄なものを濃くし、濃くすることにより、溶融に先立つ十分な赤熱に耐えるまで硬くし、硬いものでは濃密さを薄め、薄めることによって赤熱の性質を保ちながら十分に速く溶けるようにし、両類の暗い色を覆って美しくし、一方を完全な白、他方を完全な黄色へ変える薬を探究しなければならない。
  notes: []
  source_printed_pages:
  - 176
  - 177

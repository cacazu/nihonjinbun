- id: geber-summa-b01-c036-001
  section_id: geber-summa
  book: 1
  chapter: 36
  kind: body
  source_la: De Venere vero sermo noster sit ad praesens. Et est corpus metallicum, lividum, rubedine
    fusca participans, ignibile, fusibile, sub malleo extensibile, cineritium et cementum refugiens. Venus
    itaque (ut narratum est) in profundo suae substantiae colorem et essentiam auri praetendit, malleatur
    vero et ignitur ut argentum et aurum. Ideoque secretum ex ea assumas, quia est medium Solis et Lunae,
    et facile ad utrumque convertere naturam illius accidit, et est bonae conversionis, et pauci laboris.
    Convenit cum tutia vehementer, quae illam citrinat citrinitate bona, et ex hoc proficuum elicias.
    Excusamur itaque per eam a laboribus indurationis et ignitionis illius. Assumas igitur eam prae caeteris
    imperfectis in opere minori et medio, in maiori vero minime. Hoc tamen prae Iove vitium habet, quod
    livescit de facili, et infectionem ex acribus et acutis suscipit, et eradicare illud non est facile
    artificium, imo profundum.
  translation_ja: いまはウェヌスについて語ろう。それは青黒さと暗い赤みを帯び、赤熱し、溶融し、槌の下で延び、灰吹きとセメント処理を逃れる金属体である。すでに述べたように、ウェヌスは実体の深部に、金の色と本質を示し、銀や金と同じように槌打ちされ、赤熱する。それゆえ、そこから秘密を得なさい。それは太陽と月の中間にあり、その本性をどちらへ変えることも容易だからである。変成しやすく、労力も少ない。トゥティアと強く適合し、トゥティアはそれを良好な黄色にする。ここから実りを引き出しなさい。それゆえ、ウェヌスによって、硬化や赤熱を得るための労力を免れる。小さな作業と中間の作業では、他の不完全な金属体よりこれを選びなさい。ただし、大きな作業ではそうではない。しかしユピテルに比べ、容易に青黒くなり、鋭く酸いものから汚染を受けるという欠点がある。これを根絶するのは容易な技ではなく、深い技である。
  notes: *id009

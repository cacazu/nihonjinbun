- id: geber-summa-b01-c011-008
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: 'Et si dicant, quod a situ unius vel plurium stellarum datur metallis perfectio, quam ignoramus:
    Dicimus hunc situm nos scire non oportere, quia non est species generabilium et corruptibilium, quin
    ex individuis eius alicuius fiat generatio, et corruptio omni die, per quod patet utique situm stellarum
    esse omni die perfectivum cuiuslibet speciei individuorum et corruptivum. Non igitur necessarium est
    stellarum situm expectare, esset tamen utile, sed sufficit solum naturae disponere, ut et ipsa, quae
    sagax est, disponat sitibus convenientibus, mobilium corporum. Non enim suum motum potest natura perficere
    sine motu et situ mobilium. Unde si naturae artificium disposueris, et consideraveris, quaecunque
    ex contingentibus huius magisterii fuerint debite, perficietur sub debito situ per naturam sibi convenientem,
    absque consideratione illius.'
  translation_ja: もし、私たちには知られない、一つまたは複数の星の配置によって金属の完全性が与えられる、と言うなら、私たちは、その配置を知る必要はない、と言う。生成・消滅し得るものの種で、その何らかの個体の生成や消滅が毎日起こらないものはないからである。それによって、星の配置は毎日、いずれの種の個体をも完成・消滅させ得ることが明らかである。したがって、星の配置を待つ必要はない。有益ではあろうが、必要なのは自然のために準備することだけである。そうすれば、巧みな自然自体が、動く天体の適切な配置に合わせて整える。自然は、動くものの運動と配置なしに、自らの運動を完成できないからである。それゆえ、技の作業を自然に適うように整え、この術に付随するものをすべて適切に考慮したなら、その配置自体を考慮しなくても、自然によって、それにふさわしい配置のもとで完成する。
  notes: *id003
  source_printed_pages:
  - 40
  - 41
  source_pdf_pages:
  - 62
  - 63
  source_erara_pdf_pages:
  - 67
  - 68
- id: geber-summa-b01-c011-009
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: Cum enim videmus vermem ex cane vel alio animali putrescibili deductum in esse, non consideramus
    immediate situm stellarum, sed dispositiones aeris circumstantis, et alias causas putrefactionis perfectivas,
    praeter illum. Et ex tali consideratione sufficienter scimus, vermes secundum naturam in esse producere.
    Natura enim sibi invenit convenientem situm, licet a nobis ignoretur.
  translation_ja: 犬や他の腐敗し得る動物から虫が生じるのを見るとき、私たちは直接に星の配置を考慮せず、周囲の空気の状態や、その配置以外の、腐敗を完成させる諸原因を考慮する。この考慮によって、自然に従って虫を生じさせる方法を十分に知る。私たちに知られなくても、自然は自らに適した配置を見いだすからである。
  notes:
  - 自然発生説に基づく歴史的な説明をそのまま訳した。
  source_printed_page: 41
  source_pdf_page: 63
  source_erara_pdf_page: 68
- id: geber-summa-b01-c011-010
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: Et si dicant, perfectionem in instanti dari, et praeparationem nostram non in instanti fieri,
    et concludunt ex hoc, non perficietur per artificium, ergo nec ars. Dicimus capita illorum fatua,
    vacuaque esse ratione humana, eosque magis bestiis, quam hominibus assimilari. Concludunt enim ex
    praemissis, nulla se habentibus habitudine ad id quod illatum est. Tantum ergo tenet haec argumentatio,
    Asinus currit, ergo tu es capra, quantum et ipsorum. Et hoc ideo, quoniam etsi non fiat praeparatio
    in instanti, non prohibetur tamen hoc, quod forma vel perfectio non possit praeparato dari in instanti.
    Non enim praeparatio est perfectio, sed habilitatio ad suscipiendam formam.
  translation_ja: もし、完全性は一瞬に与えられるが、私たちの調製は一瞬では行われない、と言い、そこから、技によっては完成せず、したがって術も存在しない、と結論するなら、私たちは、彼らの頭は愚かで、人間の理性を欠き、人間より獣に似ている、と言う。彼らは、導いた結論と何の関係もない前提から結論しているからである。その推論は、「ロバが走る、ゆえにあなたは山羊である」という推論と同程度にしか成り立たない。調製が一瞬に起こらなくても、調製されたものに形相あるいは完全性が一瞬で与えられることは、妨げられないからである。調製は完全性そのものではなく、形相を受け入れるのに適した状態へ整えることなのである。
  notes: *id003
  source_printed_page: 41
  source_pdf_page: 63
  source_erara_pdf_page: 68
- id: geber-summa-b01-c011-011
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: 'Sed si dicant etiam, quod facilius est, res naturales destruere, quam construere illas per
    artificium, et vix aurum possumus destruere, et concludant, impossibile esse, construere illud. Respondemus
    eis taliter: quod non concludunt de necessitate, qua coartemur concedere aurum non posse construi.
    Nam cum difficulter destruitur, difficilius construitur, non autem impossibile est, illud posse construi,
    huius autem assignamus causam, quia fortem habuit compositionem, ideoque difficiliorem habuit resolutionem,
    ideoque difficulter destruitur. Ex hoc est, quod facit eos opinari, impossibile esse illius constructionem,
    quia destructionem artificialem ex cursu naturae ignorant. Attentaverunt forte, quod sit fortis compositionis,
    sed quam fortis compositionis sit, non attentaverunt.'
  translation_ja: もしさらに、自然のものを壊すのは技術で作るより容易であり、私たちは金を壊すことさえほとんどできないのだから、作るのは不可能だ、と結論するなら、こう答える。その結論には、金を作れないと認めざるを得ないほどの必然性はない。壊すのが難しいものは、作るのはいっそう難しい。しかし、作ることが不可能なのではない。その理由を示そう。金は強い組成を持つため、分離がいっそう難しく、したがって壊すことも難しい。彼らが金の形成は不可能だと考えるのは、自然の過程に従って技術で分解する方法を知らないためである。おそらく金の組成が強いことは確かめたが、どの程度強いのかは確かめなかったのである。
  notes: *id003
  source_printed_pages:
  - 41
  - 42
  source_pdf_pages:
  - 63
  - 64
  source_erara_pdf_pages:
  - 68
  - 69
- id: geber-summa-b01-c011-012
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: Sufficienter itaque tibi charissime fili sophistarum fantasias attulimus. Restat ergo, ex
    quo te attentum promissione fecimus, secundum illam promissionem ad ea quae determinanda sunt, ex
    rationibus artem negantium, a datis transire. Quae cum debite determinata fuerint, tum ad ea venire
    determinanda, quae sunt principia de intentione naturae, quorum essentiam nos oportet disputare sufficientius
    in insequentibus. Post illam vero determinationem, etiam de ipsis sermonem faciemus, quae sunt principia
    nostri magisterii. In prima tamen traditione universalem, in sequenti vero singularem de unoquoque
    principiorum faciemus sermonem. Nunc vero ad praesens rationes negantium a datis, et ipsarum interemptiones
    in primis afferamus.
  translation_ja: 最も愛するわが子よ、これで詭弁家たちの空想を十分に示した。私たちは約束によってあなたの注意を引いてきたのだから、残るのは、その約束に従い、与えられた仮定から術を否定する者たちの論拠を検討することへ進むことである。それらを適切に定めたのち、自然の意図に属する原理を定めることへ進む。その実体については、後でいっそう十分に論じなければならない。その検討の後には、私たちの術の原理であるものについても語る。ただし、最初の説明は一般的に行い、その次には、一つ一つの原理を個別に論じる。いまはまず、仮定から否定する者たちの論拠と、その反駁を示そう。
  notes: *id003
  source_printed_page: 42
  source_pdf_page: 64
  source_erara_pdf_page: 69
- id: geber-summa-b01-c012-title
  section_id: geber-summa
  book: 1
  chapter: 12
  kind: heading
  source_la: Diversae opiniones eorum, qui artem esse supponunt. Caput XII.
  translation_ja: 第12章　この術が存在すると仮定する者たちの、さまざまな意見。
  notes: &id004 []
  source_printed_page: 42
  source_pdf_page: 64
  source_erara_pdf_page: 69
- id: geber-summa-b01-c012-001
  section_id: geber-summa
  book: 1
  chapter: 12
  kind: body
  source_la: Hanc itaque artem supponentes, multiplices ex intentione diversa esse comperimus. Alii quidem
    in spiritibus, alii vero in corporibus, alii in salibus, et aluminibus, nitris et boracibus, alii
    vero in omnibus rebus vegetabilibus hanc inveniri artem et magisterium affirmant. Ex his autem omnibus,
    hi quidem secundum partem bene, et secundum partem male, hi vero secundum totum male, hoc divinum
    magisterium aestimantes illud tradiderunt posteris. Ex ipsorum autem errorum multiplicitatibus veritatem
    nos collegisse, difficilis et laboriosa cautelae coniectura, longaque et taediosa experientia, multorumque
    sumptuum interpositione contigit, et illorum error per nostrae mentis dispositionem, et rationem saepissime
    militavit, et quasi desperationem adduxit.
  translation_ja: この術を認める者にも、その考えの相違に従い、多くの種類があることを私たちは見いだした。ある者は精気の中に、別の者は金属体の中に、また別の者は塩、明礬、ニトル、ボラクス類の中に、さらに別の者はあらゆる植物性の物の中に、この術と奥義が見いだされると主張する。これらの人々は、一部は正しく一部は誤って、あるいは全体にわたって誤って、この神的な術を評価し、後世へ伝えた。その多様な誤りの中から私たちが真理を集め得たのは、難しく骨の折れる慎重な推測と、長く退屈な経験、多大な費用を投じることによってであった。彼らの誤りは、私たちの精神の働きと理性に幾度も争いを起こし、ほとんど絶望へと導いた。
  notes:
  - 原刊正誤表（42頁・ultimo行）に従い、「ex intentione diversa」と読む。
  source_printed_pages:
  - 42
  - 43
  source_pdf_pages:
  - 64
  - 65
  source_erara_pdf_pages:
  - 69
  - 70
- id: geber-summa-b01-c012-002
  section_id: geber-summa
  book: 1
  chapter: 12
  kind: body
  source_la: 'Blasphemati sint ergo in aeternum, quia blasphemias et maledictionem posteris reliquerunt,
    et ex errore suo super philosophantes perfuderunt, non veritatem, sed diabolicam instigationem potius
    post mortem suam dimiserunt. Et ego blasphemandus sim, nisi errores illorum corrigam, et veritatem
    tradam in hac scientia, prout melius exigit haec ars vera. Hoc enim magisterium occulto sermone non
    indiget, nec manifesto penitus. Trademus igitur eam sermone tali, quem latere prudentes non accidit:
    hic autem mediocribus profundissimus erit, fatuis autem utrosque terminos irreserabiliter concludet
    in hac una, et eadem nostra traditione.'
  translation_ja: それゆえ彼らは、永遠に非難されよ。彼らは後世に罵りと呪いを残し、自らの誤りによって、それを哲学する者たちに浴びせた。死後に残したのは、真理ではなく、むしろ悪魔的な誘惑であった。もし私が彼らの誤りを訂正せず、この真なる術が最も適切に要求するとおり、この学知における真理を伝えないなら、私も非難されるべきである。この術には、隠された言葉も、完全にあからさまな言葉も必要ない。そこで、分別ある者には隠れたままにならないような言葉で、それを伝えよう。ただし、その言葉は凡庸な者にはきわめて深遠であり、愚かな者には、その両端を開けられないよう閉ざす。同じ一つの私たちの伝授のうちで、そうなるのである。
  notes:
  - 「両端」は底本の utrosque terminos に従った。何を二つの端とするか、本文だけから一義的に限定していない。
  source_printed_page: 43
  source_pdf_page: 65
  source_erara_pdf_page: 70
- id: geber-summa-b01-c012-003
  section_id: geber-summa
  book: 1
  chapter: 12
  kind: body
  source_la: 'Redeuntes igitur ad propositum, dicimus eos, qui in spiritibus eam esse ponunt, diversos
    esse multipliciter. Alii quidem ex argento vivo, alii autem ex sulphure, et huic affini arsenico,
    lapidem philosophorum perquiri asserunt necesse esse. Et alii quidam ex Marchesita, quidam ex Tutia
    et Magnesia, et ex sale Ammoniaco quidam. Qui vero in corporibus, alii quidam in Plumbo, alii in quolibet
    aliorum corporum esse dicunt, alii utique in Vitro, et quidam in Gemmis, et alii in diversitatibus
    salium et aluminum, et nitrorum et boracium: et alii in omni genere rerum vegetabilium. Et illorum
    unicuique supponenti alius est adversarius, secundum suam suppositionem. Et his adversans credit se
    arti simpliciter adversari. Et secundum plurimum utriusque sectam invenimus rationibus vacuam.'
  translation_ja: 本題に戻ろう。この術が精気の中にあるとする者も、多様に分かれる。ある者は水銀から、別の者は硫黄と、それに類する砒素性物質から、賢者の石を求めるべきだと主張する。またある者はマルカシータから、別の者はトゥティアやマグネシアから、さらに別の者はアンモニアク塩から求める。金属体の中にあるとする者は、ある者は鉛に、別の者は他のいずれかの金属体にあると言う。またガラスに、宝石に、さまざまな塩、明礬、ニトル、ボラクス類に、あるいはあらゆる種類の植物性の物にあるとする者もいる。こうした仮定を立てる者には、それぞれ、その仮定に応じた反対者がいる。そして彼らに反対する者は、この術自体に無条件に反対していると思っている。多くの場合、私たちは両者の学派ともに、理性的な根拠を欠くことを見いだした。
  notes:
  - Marchesita、Tutia、Magnesia、nitrum などは歴史的物質名として訳す。現代の黄鉄鉱・酸化亜鉛・マグネシウム化合物・硝酸塩の純物質へ無条件に同定しない。
  source_printed_pages:
  - 43
  - 44
  source_pdf_pages:
  - 65
  - 66
  source_erara_pdf_pages:
  - 70
  - 71
- id: geber-summa-b01-c013-title
  section_id: geber-summa
  book: 1
  chapter: 13
  kind: heading
  source_la: Rationes negantium artem in sulphure suppositam. Caput XIII.
  translation_ja: 第13章　硫黄に基礎を置くと仮定した術を否定する者たちの論拠。
  notes: *id004
  source_printed_page: 44
  source_pdf_page: 66
  source_erara_pdf_page: 71
- id: geber-summa-b01-c013-001
  section_id: geber-summa
  book: 1
  chapter: 13
  kind: body
  source_la: 'Quidam igitur in sulphure supponentes eam inveniri, in sulphure laborem impenderunt, et
    ignorantes eius praeparationis perfectionem, ipsam praeparationem diminutam reliquerunt. Crediderunt
    enim solam mundationem, et purificationem, praeparationem perfectionis fore, haec autem per sublimationem
    fit, ideoque adductum est intentioni eorum, ut existimarent, quod sola sublimatio in sulphure, sit
    perfectio praeparationis ipsius, et similiter in suo compari videlicet in arsenico autumantes induxerunt.
    Venientes igitur ad proiectionem, quae est ad intentionem alterationis, viderunt illud aduri, et evanescere,
    et non longam in corporibus moram trahere, et corpora relinqui ab eis magis immunda, quam prius fuerunt
    ante proiectionem illius: quia ergo viderunt hanc delusionem in operis sui complemento, et longissimis
    fuit temporibus revolutum in illorum pectoribus, ex solo sulphure hanc scientiam reperiri, et in illo
    non invenissent, arguunt, non posse in alio hanc inveniri, quare cum nec in hoc, nec in alio inveniatur,
    arguunt nusquam inveniri.'
  translation_ja: この術が硫黄に見いだされると仮定した者たちは、硫黄に労力を注いだ。しかし、その調製の完成を知らず、調製を不十分なままにしていた。彼らは、浄化と精製だけで完全化のための調製になると思った。そして浄化は昇華によって行われるため、硫黄では昇華だけで調製が完成すると考えた。類似の物、すなわち砒素性物質についても、同様に思い込んだ。そこで変質を目的とする投射に進むと、それが焼けて消え去り、金属体の中に長くとどまらず、金属体は投射する以前より不浄な状態で残されるのを見た。作業の仕上げでこの失敗を見た一方、この学知は硫黄だけから見いだされるという考えを、非常に長いあいだ心に抱いていた。そして硫黄の中に見いだせなかったため、他のものにも見いだせない、と論じる。こうして、それにも他のものにも見いだされない以上、どこにも見いだされない、と論じるのである。
  notes: *id004
  source_printed_pages:
  - 44
  - 45
  source_pdf_pages:
  - 66
  - 67
  source_erara_pdf_pages:
  - 71
  - 72
- id: geber-summa-b01-c014-title
  section_id: geber-summa
  book: 1
  chapter: 14
  kind: heading
  source_la: Confutatio rationum praecedentium. Caput XIIII.
  translation_ja: 第14章　前述の論拠への反駁。
  notes: *id004
  source_printed_page: 45
  source_pdf_page: 67
  source_erara_pdf_page: 72
- id: geber-summa-b01-c014-001
  section_id: geber-summa
  book: 1
  chapter: 14
  kind: body
  source_la: 'Respondemus eis itaque breviter, et dicimus eos in hoc parum intelligere, et minime sapere,
    quia supponunt solum sulphur esse materiam nostram. Et si vera haec esset suppositio, tamen in modo
    utique praeparationis decipiuntur, quia solam sublimationem credunt sufficientem esse. Sunt enim tanquam
    puer, qui ex principio nativitatis suae usque ad senectutem in domo concluditur, non putans mundi
    latitudinem extendi, ultra suae domus latitudinem, vel ultra, quam oculo possit in domo conspicere.
    Non enim hi in multis lapidibus laborem suum adhibuerunt, non igitur potuerunt sentire, ex quo medicina
    nostra eliciatur, et ex quo non, ex quo manus suas etiam a laborum copia excusaverunt: quis ergo laborum
    perfectius sit vel non, merito ignorare debuerunt. Sed quare fuerit opus illorum diminutum, dicimus,
    quia adurentiam in sulphure dimiserunt et fugam, quae non solum non perficiunt, verum etiam dissipant
    et destruunt.'
  translation_ja: 短く答えよう。彼らはこの点をほとんど理解せず、まったく分別を欠いている。私たちの材料が硫黄だけだと仮定しているからである。仮にその仮定が正しくても、調製の仕方では欺かれている。昇華だけで十分だと思っているからである。彼らは、生まれたときから老年まで家に閉じ込められ、世界の広がりが自分の家の広さ、あるいは家の中で目に見える範囲を超えているとは思わない子どものようなものである。多くの石に労力を費やしてこなかったので、私たちの薬が何から取り出せ、何からは取り出せないかを知ることができなかった。多くの作業から手を引いていたため、どの作業がより完全か、そうでないかを知らないのは当然である。しかし、彼らの作業が不十分だった理由を言おう。硫黄のうちに、焼損をもたらす性質と逃散性を残していたからである。これらは完全にしないばかりか、散逸させ、破壊するのである。
  notes: *id004
  source_printed_pages:
  - 45
  - 46
  source_pdf_pages:
  - 67
  - 68
  source_erara_pdf_pages:
  - 72
  - 73
- id: geber-summa-b01-c015-title
  section_id: geber-summa
  book: 1
  chapter: 15
  kind: heading
  source_la: Rationes negantium artem in Arsenico suppositam, earumque confutatio. Caput XV.
  translation_ja: 第15章　砒素性物質に基礎を置くと仮定した術を否定する論拠と、その反駁。
  notes: *id004
  source_printed_page: 46
  source_pdf_page: 68
  source_erara_pdf_page: 73
- id: geber-summa-b01-c015-001
  section_id: geber-summa
  book: 1
  chapter: 15
  kind: body
  source_la: Alii vero in eodem et suo compari Arsenico hunc lapidem inveniri existimantes necesse esse,
    et profundius ad operis consummationem attendentes, non solum per sublimationem mundaverunt adurentem
    sulphureitatem, verum etiam removere conati sunt terrestreitatem, relicta in illo fuga. Ad quorum
    proiectionem similiter delusio supervenit, quia non adhaesit stabiliter in his ipsis corporibus, sed
    successive et paulatim evanuit, relicto tali corpore in priori sua dispositione. Qui et similiter
    arguerunt interimentes ut primi, et eisdem ut primis respondentes, artem affirmamus, et eam scimus
    esse, quia vidimus, et veritatem tetigimus.
  translation_ja: 別の者たちは、同じ硫黄と、それに類する砒素性物質にこの石が見いだされるはずだと考え、作業の完成をさらに深く検討した。そして、昇華によって焼損をもたらす硫黄性を浄化しただけでなく、土性をも除こうとしたが、逃散性は残した。彼らの投射にも同じように失敗が生じた。その物質が金属体の中にしっかり付着せず、徐々に少しずつ消え去り、金属体が以前の状態のまま残ったからである。彼らも最初の者たちと同じように論じ、術を否定した。私たちは彼らにも最初の者たちと同じように答え、術を肯定する。その存在を知っている。私たちは見て、真実に触れたからである。
  notes: *id004
  source_printed_page: 46
  source_pdf_page: 68
  source_erara_pdf_page: 73
- id: geber-summa-b01-c016-title
  section_id: geber-summa
  book: 1
  chapter: 16
  kind: heading
  source_la: Rationes negantium artem suppositam in Sulphure, Argento vivo, Tutia, Magnesia, Marchesita,
    et sale Ammoniaco, eorumque confutatio. Caput XVI.
  translation_ja: 第16章　硫黄、水銀、トゥティア、マグネシア、マルカシータ、アンモニアク塩に基礎を置くと仮定した術を否定する者たちの論拠と、その反駁。
  notes: *id004
  source_printed_page: 46
  source_pdf_page: 68
  source_erara_pdf_page: 73
- id: geber-summa-b01-c016-001
  section_id: geber-summa
  book: 1
  chapter: 16
  kind: body
  source_la: Alii quidam profundius in ipso viderunt, et mundaverunt illud, et fugam et adustionem abstulerunt,
    et factum est eis fixum et terreum, nullam dans in ignis calore fusionem bonam, sed solam vitrificatoriam,
    et ideo non potuerunt in proiectione corporibus permiscere, ideoque arguunt ut primi, et eisdem respondemus
    sicut primis, quia opus diminutum dimiserunt, nec illud complere sciverunt. Ingressionem enim, quae
    est perfectivum ultimum, inquirere ignoraverunt.
  translation_ja: ある者たちは、さらに深くそれを調べ、浄化し、逃散性と焼損性を取り除いた。すると、それは固定された土性のものとなったが、火の熱の中で良好に溶融せず、ガラス化する溶融しか示さなかった。そのため、投射において金属体と混ぜ合わせられなかった。そこで、最初の者たちと同じように論じる。私たちも最初の者たちと同じように答える。彼らは作業を不十分なままにし、完成させる方法を知らなかったのである。最終的に完成を与えるものである浸透性を、探究することを知らなかったからである。
  notes: *id004
  source_printed_pages:
  - 46
  - 47
  source_pdf_pages:
  - 68
  - 69
  source_erara_pdf_pages:
  - 73
  - 74
- id: geber-summa-b01-c016-002
  section_id: geber-summa
  book: 1
  chapter: 16
  kind: body
  source_la: 'In omnibus similiter spiritibus aliis est idem modus praeparationis, nisi quod in argento
    vivo et Tutiis excusamur a maiori labore, qui est ex remotione adustionis, haec enim sulphureitatem
    adustibilem et inflammabilem non habent, sed solam fugam. Magnesiae vero et Marchesitae omne genus
    sulphureitatis habent, plus Marchesita, minus vero Magnesia, fugam tamen omnes habent, plus argentum
    vivum et sal ammoniacum, minus vero sulphur, adhuc vero minus compar illius, quarto vero adhuc minus
    Marchesita: quinto vero Magnesia minus illa, sexto vero et ultimo, minime omnium Tutia. Utraque autem
    fuga participans est, alia tamen plus, alia vero minus, et ideo propter illorum fugam quibusdam experimentatoribus
    supervenit delusio vehemens in operationibus praeparationum illorum, et ipsorum proiectionibus similiter.
    Ideoque et ipsi arguunt, et interimunt ut in sulphure supponentes, et eisdem, ut in sulphure supponentibus,
    respondemus.'
  translation_ja: 他のすべての精気についても、調製の方法は同じである。ただし、水銀とトゥティア類については、焼損性を除くという大きな労苦を免れる。これらは、焼けやすく燃えやすい硫黄性を持たず、逃散性だけを持つからである。他方、マグネシアとマルカシータはあらゆる種類の硫黄性を持ち、マルカシータには多く、マグネシアには少ない。しかし、逃散性はすべてにある。水銀とアンモニアク塩では多く、硫黄ではより少なく、その類似物ではさらに少ない。第四にマルカシータはさらに少なく、第五にマグネシアはそれより少なく、第六、最後のトゥティアは、すべての中で最も少ない。いずれも逃散性を分け持つが、あるものは多く、あるものは少ない。そのため、それらの逃散性によって、一部の実験者は調製の操作でも投射でも、大きく期待を裏切られた。彼らもまた、硫黄を仮定した者たちと同じように論じ、術を否定する。私たちは彼らにも、硫黄を仮定した者たちと同じように答える。
  notes:
  - 比較の順序と性質は著者の歴史的物質論として訳した。現代の揮発性・燃焼性の比較表ではない。
  source_printed_page: 47
  source_pdf_page: 69
  source_erara_pdf_page: 74
- id: geber-summa-b01-c017-title
  section_id: geber-summa
  book: 1
  chapter: 17
  kind: heading
  source_la: Rationes negantium artem suppositam in spiritibus, una cum corporibus figendis, et eorum
    confutatio. Caput XVII.
  translation_ja: 第17章　金属体とともに固定される精気に基礎を置くと仮定した術を否定する者たちの論拠と、その反駁。
  notes: &id005 []
  source_printed_page: 47
  source_pdf_page: 69
  source_erara_pdf_page: 74
- id: geber-summa-b01-c017-001
  section_id: geber-summa
  book: 1
  chapter: 17
  kind: body
  source_la: Sunt et alii nitentes spiritus in corporibus figere, nulla alia praeparatione huic praeveniente,
    sed eisdem delusio angarians similiter moerorem attulit et desperationem, et coacti sunt ex ea, non
    esse hanc scientiam credere, et contra ipsam arguere. Est enim turbationis illorum causa ac incredulitatis
    haec, quod in fusione corporum spiritus illa dimittunt, nec eis adhaerent, imo asperitatem ignis refugiunt,
    permanentibus in ea solis corporibus, quoniam pressuram impietatis ignis illi compati propter fugam
    non possunt, quae ab eis non est ablata. Accidit similiter quandoque delusio, quia et cum eisdem corpora
    ignem effugiunt, et hoc est, cum non fixi spiritus corporibus in profundo inseparabiliter adhaeserunt,
    quoniam volatilis summa, summam fixi superat. Unde et similiter ut primi arguunt, et similiter ut
    primis eis respondeamus.
  translation_ja: ほかに、何の予備調製もせず、精気を金属体の中に固定しようとする者たちがいる。しかし彼らも、失敗に苦しめられ、悲しみと絶望を味わい、そのため、この学知は存在しないと信じ、反論するに至った。混乱と不信の原因は、金属体が溶融すると、精気がそれを離れ、付着せず、むしろ火の苛烈さを避けて逃れ、金属体だけがその中に残ることにある。精気には除かれていない逃散性があるため、火の残酷な圧力を金属体とともに耐えられないのである。また、ときには金属体まで精気とともに火から逃れ、失敗することがある。固定されていない精気が、金属体の深部に分離できないほど付着している場合である。揮発するものの総量が、固定されたものの総量に勝るからである。そこで彼らも、最初の者たちと同じように論じる。私たちも、最初の者たちと同じように答えよう。
  notes: *id005
  source_printed_page: 48
  source_pdf_page: 70
  source_erara_pdf_page: 75
- id: geber-summa-b01-c017-002
  section_id: geber-summa
  book: 1
  chapter: 17
  kind: body
  source_la: 'Tota ergo illorum reprobatio haec est: Si corpora filii doctrinae vultis convertere, tunc
    si per aliquam materiam fieri hoc possibile sit, per spiritus ipsos utique fieri necesse est: sed
    ipsos non fixos corporibus utiliter adhaerere non est possibile, imo fugiunt, et immunda relinquunt
    illa, ipsos autem fixos non est possibile ingredi, cum terra facti sint, quae non funditur: et cum
    inclusi corporibus fixi apparent, non tamen sunt, aut ab eis recedunt ipsis manentibus, aut ambo simul
    aufugiunt. Cum igitur in materia magis affini nullis modis hanc artem invenire sit possibile, in magis
    remota non invenietur, ergo nusquam. Responsio utique nostra haec est, quod quicquid scibile circa
    hoc est, non totum sciunt, ideo nec operatum ex eo totum inveniunt, consequentis igitur vitium per
    insufficientiam ponunt ipsorum robur.'
  translation_ja: 彼らの否定論の全体はこうである。「教えの子らよ、金属体を変成しようとするなら、何らかの材料によってそれが可能である以上、精気そのものによって行われるはずである。しかし、固定されていない精気は、金属体に有益に付着できず、むしろ逃れ、金属体を不浄なまま残す。他方、固定された精気は、溶けない土となっているため、浸透できない。また、金属体に包まれて固定されたように見えても、実際にはそうではなく、金属体が残って精気だけが離れるか、両方とも一緒に逃れ去る。それゆえ、より類縁性の高い材料においてさえ、いかなる方法でもこの術を見いだせないのなら、より遠い材料にも見いだされず、したがってどこにも見いだされない。」私たちの答えはこうである。彼らはこの問題について知り得ることをすべて知っているわけではない。それゆえ、そこから得られる作業の成果も、すべてを見いだしてはいない。自分たちの不十分さから生じた結果の欠陥を、自分たちの主張の強みとしているのである。
  notes: *id005
  source_printed_pages:
  - 48
  - 49
  source_pdf_pages:
  - 70
  - 71
  source_erara_pdf_pages:
  - 75
  - 76
- id: geber-summa-b01-c018-title
  section_id: geber-summa
  book: 1
  chapter: 18
  kind: heading
  source_la: Rationes negantium artem in corporibus suppositam, et primo in plumbo albo, id est stanno,
    seu Iove, et earum confutatio. Caput XVIII.
  translation_ja: 第18章　金属体に、とくに白い鉛、すなわち錫またはユピテルに基礎を置くと仮定した術を否定する論拠と、その反駁。
  notes: *id005
  source_printed_page: 49
  source_pdf_page: 71
  source_erara_pdf_page: 76
- id: geber-summa-b01-c018-001
  section_id: geber-summa
  book: 1
  chapter: 18
  kind: body
  source_la: 'Quidam autem posuerunt in corporibus illam. Cum tamen ad opus pervenerunt, illusi sunt,
    ut existimantes Plumbum utrumque, lividum scilicet et album, albedine non pura, multum naturae Solis
    et Lunae assimilari et approximare: lividum quidem multum Soli, Lunae vero parum: album vero Lunae
    multum, Soli vero parum. Propterea horum aliqui autumantes stannum, seu Iovem multum Lunae assimilari,
    et stridore, mollicie, et liquefactionis velocitate solummodo differentem, credentes ex superfluitate
    suae humiditatis, liquefactu esse facile, et molle similiter, ex substantia vero fugitiva argenti
    vivi in illo intercidente partes stridorem possidere, exposuerunt illud igni, et calcinantes ipsum
    tenuerunt in igne, quem potuit tolerare, quousque album factum est in calce sua, quem postea volentes
    reducere non potuerunt, sed aestimaverunt impossibile fore.'
  translation_ja: ある者たちは、この術を金属体に基礎づけた。しかし、実際の作業に進むと期待を裏切られた。彼らは二種類の鉛、すなわち青黒いものと、純白ではない白いものが、太陽と月の本性によく似て近づいていると思った。青黒いものは太陽に大いに似て月にはあまり似ず、白いものは月によく似て太陽にはあまり似ないと考えた。それゆえ彼らの一部は、錫、すなわちユピテルは月とよく似ており、軋む音、柔らかさ、溶融の速さだけが異なると考えた。そして、余分な湿りのために溶けやすく柔らかく、内部の諸部分の間に逃散性の水銀実体が入り込んでいるために軋むのだと信じた。そこで火にさらし、耐えられる火の中で焼成し、その灰が白くなるまで保った。その後、金属体へ戻そうとしたができず、不可能だと判断した。
  notes:
  - 原刊正誤表（49頁・19行）に従い、「liquefactu esse facile」と読む。
  source_printed_page: 49
  source_pdf_page: 71
  source_erara_pdf_page: 76
- id: geber-summa-b01-c018-002
  section_id: geber-summa
  book: 1
  chapter: 18
  kind: body
  source_la: 'Et horum aliqui reduxerunt ex illo aliquid, et stridorem, ut prius, et mollitiem in illo
    invenerunt, atque liquefactionis velocitatem. Ideoque crediderunt hoc impossibile per viam hanc, et
    adducti sunt in incredulitatem, ut putarent artem indurationis illius inveniri non posse. Horum vero
    aliqui calcinaverunt, et reduxerunt, et iterum scoriam illius subtrahendo cum maioris ignis expressione
    calcinaverunt et reduxerunt, et sic saepe reiterantes opus ad illud viderunt iam illud induratum,
    atque sine stridore: quia vero velocitatem liquefactionis non omnino removerunt, erravit mens illorum,
    et existimaverunt ad illud non posse perveniri.'
  translation_ja: その一部は、いくらかを金属体へ戻したが、以前と同じ軋む音、柔らかさ、溶融の速さを見いだした。それゆえ、この道による達成は不可能だと信じ、硬化させる術は見いだせないという不信に至った。他の者は、焼成して戻し、鉱滓を取り去りながら、さらに強い火力によって再び焼成して戻した。この作業を幾度も繰り返し、それが硬化し、軋む音もなくなったのを見た。しかし溶融の速さを完全に除けなかったので、その考えは誤りに陥り、目的には到達できないと思った。
  notes: *id005
  source_printed_pages:
  - 49
  - 50
  source_pdf_pages:
  - 71
  - 72
  source_erara_pdf_pages:
  - 76
  - 77
- id: geber-summa-b01-c018-003
  section_id: geber-summa
  book: 1
  chapter: 18
  kind: body
  source_la: Horum itaque et alii volentes eidem duriciem et retardationem liquefactionis cum administratione
    durorum corporum praestare, in delusionem ceciderunt, ut frangeret illis quodcunque durorum corporum
    admixtum ei fuerit, nec iuvit in hoc eos ulla praeparatio. Ideoque cum nec duris, nec igne illum praeparare
    potuerunt, excusaverunt se de longa mora inventionis artis, quia eam impossibilem crediderunt et dixerunt,
    per hoc et contra artem arguentes instanter, posuerunt illam non esse. Praeterea, et alii quidam addentes
    multa medicamina, viderunt illa nullam immutationem facientia, nec ei convenientia, sed potius corrumpentia,
    et contra illorum propositum agentia, et ideo libros abiecerunt, et capita retorserunt, et artem veram
    et divinam frivolam esse dixerunt. Quibus obviantes respondemus responsione prima.
  translation_ja: また別の者は、硬い金属体を加えることによって、硬さと溶融の遅さを与えようとしたが、失敗した。どの硬い金属体を混ぜても、それを脆くしてしまい、どのような調製も役立たなかったからである。硬い金属体によっても火によっても調製できなかったため、彼らは術の発見のために長く待つことをやめた。それを不可能だと信じ、そう述べ、このことによって術を執拗に否定し、その存在を認めなかった。さらに別の者は、多くの薬剤を加えたが、それらが何の変化ももたらさず、材料に適合せず、むしろ損壊させ、自分たちの目的に反して働くのを見た。そのため書物を投げ捨て、顔を背け、真に神的な術を空しいものと呼んだ。これらの者に対しても、私たちは初めと同じ答えを与える。
  notes: *id005
  source_printed_page: 50
  source_pdf_page: 72
  source_erara_pdf_page: 77
- id: geber-summa-b01-c019-title
  section_id: geber-summa
  book: 1
  chapter: 19
  kind: heading
  source_la: Rationes negantium artem in plumbo nigro suppositam. Caput XIX.
  translation_ja: 第19章　黒い鉛に基礎を置くと仮定した術を否定する者たちの論拠。
  notes: *id005
  source_printed_page: 51
  source_pdf_page: 73
  source_erara_pdf_page: 78
- id: geber-summa-b01-c019-001
  section_id: geber-summa
  book: 1
  chapter: 19
  kind: body
  source_la: Eundem etiam est in Plumbo nigro reperire illusionis modum, solo excepto, quod corpora non
    frangit, et quod citius redit a calce sua, quam Iupiter, lividitatem vero eius removere non possunt,
    quia ignorant, ideo per illud dealbare non possunt dealbatione bona, nec per suam fantasiam potuerunt
    illud stabilibus corporibus tam stabiliter associare, quin contingat illud per fortem ignis expressionem
    recedere a commixto. Et illud quidem maxime decipit illos, in huius praeparatione supponentes, in
    nullo posse scientiam inveniri, nisi in ipso, quia post duas reductiones a calce sua nullam duriciem
    suscipit, sed maiorem potius mollitiem quam prius habuerat, et in aliis similiter non viderunt illud
    emendari differentiis. Et ideo cum in ipso putantes propinquius et melius inveniri, non invenerunt,
    coguntur per hoc credere et argumentari, scientiam non esse, sed delusionem, et ideo peccant hi ut
    priores.
  translation_ja: 黒い鉛においても、同じ種類の失敗が見いだされる。ただし、これが金属体を脆くせず、その灰からユピテルより速く金属体へ戻ることだけが異なる。彼らは知識を欠くため、その青黒さを取り除けない。そのため、それによって良好な白化を行えず、自分たちの空想によって、それを安定した金属体に、強い火力でも混合物から離れないほど確実に結びつけることもできなかった。この調製において、学知はそれ以外のどこにも見いだせないと思い込む者たちは、とくに次の点で期待を裏切られる。灰から二度金属体へ戻しても、何の硬さも得ず、むしろ以前より柔らかくなることである。他の性質についても改善を見いだせなかった。それゆえ、この物質において、より近く、よりよく見いだせると思ったのに発見できなかったため、この学知は存在せず、欺きにすぎない、と信じ、論じるよう強いられる。こうして彼らも、前の者たちと同じ誤りを犯すのである。
  notes: *id005
  source_printed_page: 51
  source_pdf_page: 73
  source_erara_pdf_page: 78
- id: geber-summa-b01-c020-title
  section_id: geber-summa
  book: 1
  chapter: 20
  kind: heading
  source_la: Rationes negantium artem in mixtione durorum cum duris, et mollium cum mollibus corporibus
    suppositam. Caput XX.
  translation_ja: 第20章　硬い金属体どうし、柔らかい金属体どうしの混合に基礎を置くと仮定した術を否定する論拠。
  notes: &id006 []
  source_printed_page: 51
  source_pdf_page: 73
  source_erara_pdf_page: 78
- id: geber-summa-b01-c020-001
  section_id: geber-summa
  book: 1
  chapter: 20
  kind: body
  source_la: Alii vero componentes dura cum duris, et mollia cum mollibus, propter convenientiam voluerunt
    corpora sese invicem transmutari, et transmutare, et illud non potuerunt, propter suam ignorantiam,
    ut permiscentes Solem vel Lunam cum Venere, vel alio quocunque metallorum, non transmutant illa in
    Solem, vel Lunam transmutatione firma, quin experiantur ignis expressione forti unumquodque illorum
    a commixtione separari, et comburi, vel ad priorem sui naturam redire. Quaedam vero ex eis plus durant
    in commixtione, quaedam vero minus, ut a nobis sufficienter determinatum est. Hae itaque delusiones
    supervenientes propter ignorantiam, faciunt hos tales de hac diffidere arte, et illam arguere non
    esse.
  translation_ja: 別の者たちは、硬いものを硬いものに、柔らかいものを柔らかいものに組み合わせ、両者が適合するため、金属体が相互に変成し合うことを望んだ。しかし無知のため、それはできなかった。たとえば太陽や月をウェヌス、あるいは他のいずれかの金属と混ぜても、それらを確実な変成によって太陽や月にはできない。強い火力のもとでは、それぞれが混合物から分離し、焼け、あるいは元の本性へ戻るのを経験する。混合の中で、より長くとどまるものも、そうでないものもある。これはすでに十分に説明した。このような無知に由来する失敗が、彼らにこの術を疑わせ、その存在を否定させるのである。
  notes: *id006
  source_printed_pages:
  - 51
  - 52
  source_pdf_pages:
  - 73
  - 74
  source_erara_pdf_pages:
  - 78
  - 79
- id: geber-summa-b01-c021-title
  section_id: geber-summa
  book: 1
  chapter: 21
  kind: heading
  source_la: Rationes negantium artem in mixtione durorum cum mollibus, et perfectorum cum imperfectis
    suppositam. Caput XXI.
  translation_ja: 第21章　硬いものと柔らかいもの、完全なものと不完全なものの混合に基礎を置くと仮定した術を否定する論拠。
  notes: *id006
  source_printed_page: 52
  source_pdf_page: 74
  source_erara_pdf_page: 79
- id: geber-summa-b01-c021-001
  section_id: geber-summa
  book: 1
  chapter: 21
  kind: body
  source_la: Alii autem intimius et profundius super hoc inquirentes, cogitaverunt et ingeniati sunt,
    et viam voluerunt invenire, ut dura mollibus unita, ea stabiliter indurarent, et perfecta imperfectis,
    ad perfectionem ea reducerent, et generaliter a se invicem transmutarentur et transmutarent, transmutatione
    firma. Et ideo voluerunt similitudinem et affinitatem illorum invenire, tum quidem per medicinas,
    tum vero per ignis administrationem attenuando grossa, sicut Venerem et Martem, et inspissando subtilia,
    sicut est Iupiter, et similia illi. Et aliqui eorum credentes hanc administrationem perficere, delusi
    sunt in commixtione horum durorum corporum, vel quia frangibile fecerunt omnino, vel omnino nimis
    molle non alteratum a duro, vel nimis durum non alteratum a molli. Et sic convenientiam non invenerunt,
    et ideo artem esse negaverunt.
  translation_ja: 別の者たちは、この問題をさらに内へ深く探究し、考え、工夫し、次の方法を見つけようとした。硬いものを柔らかいものに結びつければ、柔らかいものを安定して硬くでき、完全なものを不完全なものに結びつければ、それを完全性へ導き、一般に双方が確実に変成し合う、という方法である。そのため、あるときは薬によって、あるときは火の操作によって、両者の類似と類縁性を見いだそうとした。ウェヌスやマルスのような粗大なものを希薄化し、ユピテルやそれに類する微細なものを濃密化したのである。その一部は、この操作を完成させたと思ったが、これらの硬い金属体を混合すると期待を裏切られた。できたものがまったく脆かったり、硬いものによって変化せず柔らかすぎたり、柔らかいものによって変化せず硬すぎたりしたからである。こうして適合を見いだせず、この術の存在を否定した。
  notes: *id006
  source_printed_pages:
  - 52
  - 53
  source_pdf_pages:
  - 74
  - 75
  source_erara_pdf_pages:
  - 79
  - 80
- id: geber-summa-b01-c022-title
  section_id: geber-summa
  book: 1
  chapter: 22
  kind: heading
  source_la: Rationes negantium artem in extractione animae, vel ignis regimine suppositam. Caput XXII.
  translation_ja: 第22章　魂の抽出、あるいは火の調節に基礎を置くと仮定した術を否定する論拠。
  notes: *id006
  source_printed_page: 53
  source_pdf_page: 75
  source_erara_pdf_page: 80
- id: geber-summa-b01-c022-001
  section_id: geber-summa
  book: 1
  chapter: 22
  kind: body
  source_la: Alii vero adhuc intimius et profundius inspicientes alterare voluerunt corpora cum animarum
    suarum extractione, et cum extracta anima omnia alia similiter. Et ad id non potuit eorum experientia
    pervenire, sed delusi fuerunt in intentione sua, per hoc aestimantes artem non posse inveniri. Alii
    vero solo igne ipsa perficere conantes delusi in opinione sua fuerunt, quia ad illud pervenire nescierunt.
    Et hi eam ex hoc non esse putaverunt. Quibus omnibus obviamus ut primis.
  translation_ja: さらに内へ深く調べる者たちは、金属体自身の魂を抽出することで金属体を変え、その抽出した魂で他のすべてを同様に変えようとした。しかし、その経験は目的に到達できず、企ては失敗した。そのため、術は見いだせないと判断した。また、火だけで金属体を完成させようとする者たちも、そこへ達する方法を知らず、自分たちの見込みを裏切られた。そして、このことから術は存在しないと思った。私たちは、これらすべてに対し、最初の者たちと同じように答える。
  notes:
  - 「魂」は、金属から取り出される変成力などを表す文献内の術語。人間の魂の抽出を論じたものではない。
  source_printed_page: 53
  source_pdf_page: 75
  source_erara_pdf_page: 80
- id: geber-summa-b01-c023-title
  section_id: geber-summa
  book: 1
  chapter: 23
  kind: heading
  source_la: Rationes negantium artem in vitro, et gemmis suppositam, et earum confutatio. Caput XXIII.
  translation_ja: 第23章　ガラスと宝石に基礎を置くと仮定した術を否定する論拠と、その反駁。
  notes: *id006
  source_printed_page: 53
  source_pdf_page: 75
  source_erara_pdf_page: 80
- id: geber-summa-b01-c023-001
  section_id: geber-summa
  book: 1
  chapter: 23
  kind: body
  source_la: Qui vero in Vitro, et Gemmis illam posuerunt, experti sunt, per Vitrum et Gemmas in corporibus
    alterationes fieri non posse, quia non alterat quod non ingreditur, at nec Vitrum quidem, nec Gemmae
    ingrediuntur, ideoque non alterant. Sed et si conati sunt Vitrum cum illis unire, cum tamen vix hoc
    fieri possit, non tamen propositum habent, quoniam Vitrum ex corporibus faciunt, et propter hoc aestimant
    hunc errorem super totam artem cadere, et sic eam arguunt non esse. Quibus respondemus, eos operari
    in non debita materia, ideoque indebite terminantes, non possunt hanc ex suis erroribus interimere.
  translation_ja: この術をガラスと宝石に基礎づけた者たちは、それらによって金属体に変質を起こせないことを経験した。浸透しないものは変質させず、ガラスも宝石も浸透しないため、変質させないからである。また、ガラスを金属体に結びつけようとしても、それはほとんどできず、しかも目的を達成しない。金属体からガラスを作ってしまうからである。このため、彼らは自分たちの誤りが術全体に当てはまると思い、術は存在しないと論じる。私たちは、彼らは適切でない材料で作業し、不適切な結果に至ったのだから、自分たちの誤りによってこの術を打ち消すことはできない、と答える。
  notes: *id006
  source_printed_pages:
  - 53
  - 54
  source_pdf_pages:
  - 75
  - 76
  source_erara_pdf_pages:
  - 80
  - 81
- id: geber-summa-b01-c024-title
  section_id: geber-summa
  book: 1
  chapter: 24
  kind: heading
  source_la: Rationes negantium artem in mediis mineralibus, vel vegetalibus, vel quarumcunque rerum commixtione
    suppositam. Caput XXIIII.
  translation_ja: 第24章　中間的鉱物、植物性のもの、あるいは何らかの物の混合に基礎を置くと仮定した術を否定する論拠。
  notes:
  - 底本見出しには cap. Cap. と重複がある。意味に影響しない重複した章表示は読書用転記で一つに整理した。
  source_printed_page: 54
  source_pdf_page: 76
  source_erara_pdf_page: 81
- id: geber-summa-b01-c024-001
  section_id: geber-summa
  book: 1
  chapter: 24
  kind: body
  source_la: Sunt et alii supponentes eam artem inveniri in Salibus et Aluminibus, Nitris et Boracibus,
    qui possunt quidem in his experiri, sed eam inveniri minime putamus in eis. Ideoque si post suam experientiam
    paucam utilitatem transmutationis inveniunt, scilicet solvendo, coagulando, et assando, tamen non
    interimant hanc artem divinam, cum necessaria sit et scita. Possibile est tamen in his omnibus aliquam
    alterationem inveniri, sed remota est valde, et maxime laboriosa. Adhuc vero et in aliis crescentibus
    omnibus supponentibus, magis laboriosa fore probatur. Ideoque qui eam in omnibus vegetabilibus ponunt,
    possibile quidem ponunt, sed non eis, quoniam prius deficerent in labore, quam laboratum perfici sit
    possibile, ideoque si tales artem non inveniunt suis laboribus, artem nullis laboribus inveniri posse
    argumentari non licet.
  translation_ja: また、塩、明礬、ニトル、ボラクス類の中にこの術が見いだされると仮定する者たちがいる。彼らは確かにそれらを試すことはできるが、私たちはその中に術が見いだされるとは考えない。それゆえ、溶解、凝結、焙焼を試した後、変成にわずかな効用しか見いだせなくても、必然性があり知られているこの神的な術を否定してはならない。ただし、これらすべてにおいて何らかの変質を見いだすことは可能である。しかし、それは非常に遠い道で、大変な労力を要する。さらに、他のすべての成長するものに基礎を置くと仮定する者にとっては、いっそう労力を要することが明らかである。したがって、この術をあらゆる植物性のものに置く者は、可能なことを仮定してはいるが、自分たちに可能なことではない。作業を完成できるより先に、労苦に尽き果てるからである。それゆえ、自分たちの作業で術を見いだせなくても、いかなる作業によっても術を見いだせない、と論じることは許されない。
  notes: *id006
  source_printed_pages:
  - 54
  - 55
  source_pdf_pages:
  - 76
  - 77
  source_erara_pdf_pages:
  - 81
  - 82
- id: geber-summa-b01-c024-002
  section_id: geber-summa
  book: 1
  chapter: 24
  kind: body
  source_la: Omnes autem prius dicti, errantes, unam materiam suam posuerunt, et nullam aliam superposuerunt
    praeter illam. Et hi quidem iam redarguti sunt omnes. Alii vero multi, et quasi infiniti, harum rerum
    omnium compositionem, aut quarundam sub diversa proportione facientes, ignoranter et inscienter incedunt,
    et error illorum in infinitum extenditur, quoniam infinita est diversitas proportionis rerum miscibilium,
    et infinita est diversitas materierum miscibilium, et in his ambabus infinitatibus infinite contingit
    errare, aliquando ex superabundantia, aliquando ex diminutione, et in his possibilis est correctio.
    Sed nos quidem longitudini et prolixitati sermonum parcentes, super infinitis insistere nolumus, quoniam
    scientiam universalem trademus brevibus locutionibus, qua evidenter infinitatem suorum errorum emendare
    potuerint, et illos corrigere. Nunc vero prius naturalia principia disseramus, secundum eorum causas,
    ut ex principio te attentum fecimus ex commemoratione illorum.
  translation_ja: 先に述べた誤る者たちは、みな一つの材料だけを立て、それ以外のものを置かなかった。これらの者は、すでにすべて反駁された。他方、多数、ほとんど無数の者たちは、これらすべての物、あるいはその一部をさまざまな比率で組み合わせ、無知のまま進む。その誤りは無限に広がる。混合され得る物の比率の違いは無限であり、混合され得る材料の種類も無限だからである。この二つの無限性の中では、あるときは過剰によって、あるときは不足によって、無限に誤り得る。そして、こうした誤りは訂正できる。しかし私たちは、説明が長大になることを避け、無限の事例にとどまりたくはない。短い言葉で普遍的な学知を伝えるつもりだからである。それによって彼らは、無限の誤りを明瞭に改め、正すことができるだろう。さて、まず自然の原理を、その原因に従って論じよう。初めにそれらへ言及し、あなたの注意を引いておいたとおりである。
  notes:
  - 原刊正誤表（55頁・17行）に従い、「emendare potuerint」と読む。
  source_printed_page: 55
  source_pdf_page: 77
  source_erara_pdf_page: 82
- id: geber-summa-b01-c025-part-title
  section_id: geber-summa
  book: 1
  chapter: 25
  kind: heading
  source_la: Sequitur tertia pars huius libri primi, de principiis naturalibus, et eorum effectu.
  translation_ja: 以下、第1巻第3部。自然的原理と、その結果について。
  notes: &id007 []
  source_printed_page: 55
  source_pdf_page: 77
  source_erara_pdf_page: 82
- id: geber-summa-b01-c025-title
  section_id: geber-summa
  book: 1
  chapter: 25
  kind: heading
  source_la: De principiis naturalibus corporum metallicorum, secundum opinionem antiquorum. Caput XXV.
  translation_ja: 第25章　古人の見解に従った、金属体の自然的原理について。
  notes: *id007
  source_printed_page: 55
  source_pdf_page: 77
  source_erara_pdf_page: 82
- id: geber-summa-b01-c025-001
  section_id: geber-summa
  book: 1
  chapter: 25
  kind: body
  source_la: Innuimus ergo tibi secundum antiquorum opinionem, qui fuerunt de secta nostra artem imitantium,
    quod principia naturalia in opere naturae sunt spiritus foetens, et aqua viva, quam et siccam aquam
    nominari concedimus. Spiritum autem fetentem divisimus, est enim albus in occulto et rubeus et niger
    uterque, in magisterio huius operis. In manifesto autem, uterque tendens ad rubedinem. Dicemus igitur
    sermone brevi, necnon et similiter completo et sufficienti generationem uniuscuiusque istorum, et
    modum similiter generationis. Expedit igitur nos ampliare sermonem nostrum, et dilatare, et singulum
    capitulum de singulo naturali principio tradere.
  translation_ja: そこで、私たちの学派に属し、この術に倣った古人の見解に従い、あなたに示そう。自然の働きにおける自然的原理は、臭気をもつ精気と、生きた水である。この水を「乾いた水」と呼ぶことも認める。臭気をもつ精気は二つに分けた。その隠れた状態では白いものと赤いものがあり、この術の作業においては、両方とも黒い。明らかな状態では、どちらも赤に向かう。それゆえ私たちは、それぞれの生成と、その生成の仕方を、短く、しかも完結し十分な言葉で述べよう。説明を広げ、展開し、それぞれの自然的原理に一章ずつを割り当てるのが適切である。
  notes: *id007
  source_printed_pages:
  - 55
  - 56
  source_pdf_pages:
  - 77
  - 78
  source_erara_pdf_pages:
  - 82
  - 83
- id: geber-summa-b01-c025-002
  section_id: geber-summa
  book: 1
  chapter: 25
  kind: body
  source_la: In genere tamen dicimus, quod unumquodque ipsorum est fortissimae compositionis, et uniformis
    substantiae, et illud ideo, quod in eis partes terrae taliter partibus aeriis, aqueis et igneis per
    minima sunt unitae, ut nulla ipsarum alteram in resolutione possit dimittere, imo quaelibet cum qualibet
    resolvitur, propter fortem unionem, quam habuerunt ad invicem per minima, et paulatim a calore naturali
    et aequali in mineralibus in terrae visceribus condensato, multiplicato, et aequato secundum debitum
    cursum naturae, ad exigentiam illorum essentiae, secundum opinionem quorundam antiquorum philosophorum.
  translation_ja: ただし一般にいうなら、それぞれは非常に強固な組成と、均一な実体を持つ。その理由は、土の部分が、空気、水、火の部分と、きわめて小さな部分に至るまで結合し、分解において一つが他を離れられず、どの部分も他の部分とともに分解されるからである。相互の結合が微小な部分まで強固であり、地中の鉱物における自然で均等な熱によって、徐々に凝集・増大・均衡化されてきたためである。その過程は、ある古代の哲学者たちの見解によれば、自然の適切な道筋に従い、それらの本質が求めるところに応じて進む。
  notes:
  - Commonsの印刷56頁画像は右端が欠けるため、この頁は完全なe-raraの同年刊本画像を用いて校合した。
  source_printed_page: 56
  source_pdf_page: 78
  source_erara_pdf_page: 83
- id: geber-summa-b01-c026-title
  section_id: geber-summa
  book: 1
  chapter: 26
  kind: heading
  source_la: De principiis naturalibus metallorum, secundum opinionem recentiorum, et authoris. Caput
    XXVI.
  translation_ja: 第26章　後代の人々と著者の見解に従った、金属の自然的原理について。
  notes: *id007
  source_printed_page: 56
  source_pdf_page: 78
  source_erara_pdf_page: 83
- id: geber-summa-b01-c026-001
  section_id: geber-summa
  book: 1
  chapter: 26
  kind: body
  source_la: Alii autem aliter dixerunt, quod principium non fuerit argentum vivum in natura sua, sed
    alteratum et conversum in terram suam, et sulphur similiter alteratum, et in terram mutatum. Unde
    dixerunt quod aliud fuerit principium, quam spiritus foetens, et spiritus fugitivus in intentione
    naturae. Et ratio qua moti sunt, ea fuit, quia non inveniunt in mineris argenteis, vel aliorum metallorum
    aliquid quod sit argentum vivum in natura sua, et aliquid quod sit sulphur similiter, immo per se
    inveniunt unumquodque illorum separatum in propria sua minera in sua natura.
  translation_ja: 他の人々は異なる説を述べた。原理は本来の状態の水銀ではなく、変質し、自らの土に転じた水銀であり、硫黄も同じように変質して土へ変わったものである、というのである。それゆえ彼らは、自然の意図における原理は、臭気をもつ精気や逃散する精気とは別のものだ、と述べた。そう考えた理由は、銀や他の金属の鉱脈で、本来の状態の水銀や硫黄を見いださないからである。むしろ、それぞれが別々に、自ら固有の鉱脈に、本来の状態で存在しているのを見いだす。
  notes:
  - 原刊では頁数が56から59へ飛ぶ。独立した二つの同年刊本で本文と予告語の連続を確認できるため、57–58頁分の本文欠落とは扱わない。
  source_printed_pages:
  - 56
  - 59
  source_pdf_pages:
  - 78
  - 79
  source_erara_pdf_pages:
  - 83
  - 84
- id: geber-summa-b01-c026-002
  section_id: geber-summa
  book: 1
  chapter: 26
  kind: body
  source_la: 'Et similiter per aliam rationem hoc quoque affirmant. Non est transitus inquiunt, a contrario
    in contrarium, nisi per dispositionem mediam. Ergo cum sic sit, coguntur confiteri et credere, quod
    non sit transitus a mollicie argenti vivi ad duriciem alicuius metallorum, nisi per dispositionem,
    quae est inter duriciem et mollitiem illorum: sed in mineris non inveniunt aliquid, in quo salvetur
    haec media dispositio, ideo hac ratione compelluntur credere, argentum vivum, et sulphur in sua natura
    non esse principium de intentione naturae, imo aliud quod sequitur ex illorum essentiarum alteratione,
    in radice naturae ad terream substantiam.'
  translation_ja: 彼らはまた別の理由によっても、この説を主張する。対立するものから反対のものへ移るには、中間の状態を経なければならない、というのである。そうであれば、水銀の柔らかさから、いずれかの金属の硬さへ移るには、その硬さと柔らかさの間の状態を経なければならない、と認め、信じざるを得ない。しかし鉱脈には、その中間の状態を保つ何ものも見いだされない。そのため、この論拠によって、自然の意図における原理は、本来の状態の水銀と硫黄ではなく、自然の根において、それらの本質が土性の実体へと変質した結果生じる、別のものであると信じるようになる。
  notes: *id007
  source_printed_page: 59
  source_pdf_page: 79
  source_erara_pdf_page: 84
- id: geber-summa-b01-c026-003
  section_id: geber-summa
  book: 1
  chapter: 26
  kind: body
  source_la: Et est iste modus, quod prius unumquodque eorum convertitur ad terream naturam, et ex his
    ambabus terreis naturis resolvitur fumus tenuissimus a calore multiplicato in viscere terrae, et hic
    duplex fumus est materia metallorum immediata. Hic fumus cum a calore temperato minerae decoctus erit,
    convertitur in naturam cuiusdam terrae, ideoque fixionem quandam suscipit, quam deinde fluens aqua
    per viscera minerae, et terrae spongiositatem dissoluit, et ei uniformiter unitur unione naturali
    et firma.
  translation_ja: その仕方はこうである。まず両者がそれぞれ土性の本性に変わり、地中で増した熱によって、この二つの土性の本性から、きわめて微細な煙が分離する。この二重の煙が金属の直接の材料となる。この煙は、鉱脈の穏やかな熱で煮熟されると、ある種の土の本性へ変わり、それによって一定の固定性を得る。その後、鉱脈の内部と土の海綿状の隙間を流れる水が、その土を溶かし、自然で強固な結合によって、均一に一つになる。
  notes:
  - 印刷59頁には tenuissimus に付された印刷の異読注 alias emissus（別読み「放出された」）がある。主本文には tenuissimus を保持した。
  - 原刊正誤表（59頁・25行）に従い、「in」を削除した。
  source_printed_pages:
  - 59
  - 60
  source_pdf_pages:
  - 79
  - 80
  source_erara_pdf_pages:
  - 84
  - 85
- id: geber-summa-b01-c026-004
  section_id: geber-summa
  book: 1
  chapter: 26
  kind: body
  source_la: Ideoque sic dixerunt sic opinantes, quod aqua fluens per meatus terrae invenit substantiam
    dissolubilem ex substantia terrae in visceribus illius, et illam solvit, et uniformiter cum illa unitur,
    quousque et substantia terrae in visceribus dissoluta, et aqua fluens dissolvens, unum fuerint unione
    naturali, et ad talem mixtionem veniunt omnia elementa secundum debitam naturalem proportionem, et
    miscentur per minima, quousque faciant uniformem mixtionem. Et haec mixtio per successivam decoctionem
    in minera inspissatur et induratur, et fit metallum. Et hi quidem quamvis sint affines veritati, non
    tamen veritatem coniiciunt puram.
  translation_ja: したがって、こう考える者たちは次のように述べる。土の通路を流れる水は、その内部で土の実体から生じた溶解可能な実体を見いだし、それを溶かして均一に結合する。内部で溶けた土の実体と、それを溶かす流水とが、自然な結合によって一つになるまで続く。この混合には、すべての元素が適切な自然の比率に従って集まり、ごく小さな部分に至るまで混合し、均一な混合物を作る。そして、その混合物は、鉱脈内の連続的な煮熟によって濃密化し、硬化し、金属となる。これらの人々は真理に近づいているとはいえ、純粋な真理を捉えているわけではない。
  notes: *id007
  source_printed_page: 60
  source_pdf_page: 80
  source_erara_pdf_page: 85
- id: geber-summa-b01-c027-title
  section_id: geber-summa
  book: 1
  chapter: 27
  kind: heading
  source_la: Divisio dicendorum de tribus principiis, Sulphure scilicet, Arsenico, et Argento vivo. Caput
    XXVII.
  translation_ja: 第27章　三つの原理、すなわち硫黄、砒素性物質、水銀についての論述の区分。
  notes: *id007
  source_printed_page: 60
  source_pdf_page: 80
  source_erara_pdf_page: 85
- id: geber-summa-b01-c027-001
  section_id: geber-summa
  book: 1
  chapter: 27
  kind: body
  source_la: Iam sermone universali determinavimus de metallorum principiis naturalibus. Restat igitur
    ut nunc ponamus uniuscuiusque principii capitulum. Cum ergo tria sint, Sulphur, Arsenicum, et Argentum
    vivum. Primo ascribemus capitulum de Sulphure. Secundo de Arsenico. Tertio de Argento vivo. Deinde
    uniuscuiusque metallorum, quae sunt effectus eorum, ponemus capitulum determinatum, secundum quod
    est ex opere naturae. Dehinc ad ea quae huius magisterii sunt fundamenta, et illorum operationes transeundo,
    horum omnium causas assignabimus.
  translation_ja: 金属の自然的原理について、一般的な言葉で論じた。そこで、いま、それぞれの原理の章を設けることが残されている。原理は硫黄、砒素性物質、水銀の三つであるから、第一に硫黄、第二に砒素性物質、第三に水銀についての章を書く。次いで、それらの結果である各金属について、自然の働きによって存在するあり方に従い、それぞれ特定の章を設ける。その後、この術の基礎と、その操作へ進み、これらすべての原因を示そう。
  notes: *id007
  source_printed_pages:
  - 60
  - 61
  source_pdf_pages:
  - 80
  - 81
  source_erara_pdf_pages:
  - 85
  - 86
- id: geber-summa-b01-c028-title
  section_id: geber-summa
  book: 1
  chapter: 28
  kind: heading
  source_la: De Sulphure. Caput XXVIII.
  translation_ja: 第28章　硫黄について。
  notes: &id008 []
  source_printed_page: 61
  source_pdf_page: 81
  source_erara_pdf_page: 86
- id: geber-summa-b01-c028-001
  section_id: geber-summa
  book: 1
  chapter: 28
  kind: body
  source_la: Dicimus igitur quod Sulphur est pinguedo terrae, in minera terrae per temperatam decoctionem
    inspissata, quousque induretur, et sicca fiat, et cum indurata fuerit, Sulphur vocatur. Habet siquidem
    sulphur homogeniam et fortissimam compositionem, et est uniformis substantiae in suis partibus homoeomera,
    quia homogenium est. Ideoque non auferetur eius oleum ab ipso per distillationem, sicut ab aliis rebus
    oleum habentibus. Qui ergo quaerunt ipsum calcinare non perdendo de illius substantia aliquid, de
    quo sit curandum, in vanum laborent, quoniam non calcinatur nisi per magnam industriam, et multum
    de illius substantia dissipando. Ex centum enim partibus vix tibi tres sufficienter reservabis post
    calcinationem.
  translation_ja: 硫黄は土の脂であり、土の鉱脈内で穏やかな煮熟によって濃密化し、硬く乾いたものになったものである。硬くなったとき、硫黄と呼ばれる。硫黄は同質で非常に強固な組成を持ち、その実体は均一で、各部分も同質である。それゆえ、油を含む他の物のように、蒸留によってその油を取り去ることはできない。したがって、実体を気にするほど失わずに焼成しようとする者は、無駄に労することになる。大きな工夫と、多くの実体を散逸させることなしには、焼成できないからである。百の部分があっても、焼成ののちに十分残せるのは、わずか三部分ほどである。
  notes: *id008
  source_printed_page: 61
  source_pdf_page: 81
  source_erara_pdf_page: 86
- id: geber-summa-b01-c028-002
  section_id: geber-summa
  book: 1
  chapter: 28
  kind: body
  source_la: Figi similiter non potest nisi calcinetur prius, commisceri attamen, et aliquantulum illius
    fuga retardari, et illius potest adustio reprimi, et cum commixto facilius calcinatur. Qui ergo quaerit
    ex eo opus elicere, illud per se praeparando non eliciat, quoniam cum mixto perficitur, et sine illo
    protelatur magisterium usque ad desperationem. Et cum suo compari fit tinctura, et dat pondus completum
    unicuique metallorum, et ipsum a foeditate depurat et illustrat, et perficitur cum magisterio, sine
    quo nihil horum praestat, sed potius corrumpit et denigrat, non igitur sine magisterio ipso utaris.
    Qui etiam in praeparatione ipsum commiscere et amicari corporibus noverit, sciet unum de secretis
    naturae maximum, et viam perfectionis unam, cum multae sint viae ad unum effectum, et unum intentum.
  translation_ja: 同じく、あらかじめ焼成しなければ固定できない。ただし他のものと混ぜれば、その逃散をいくらか遅らせ、焼損性を抑えることができ、混合したものとともになら、より容易に焼成される。それゆえ、それから作業の成果を引き出そうとする者は、それだけを調製して引き出そうとしてはならない。混合物とともに完成するのであり、それなしには術は絶望するほど引き延ばされるからである。類似のものとともにすると、それは染める力となり、それぞれの金属に十分な重さを与え、汚れから浄化して輝かせる。これは術によって完成するのであり、術なしには、これらを何一つ行わず、むしろ損ない、黒くする。だから、術を施さずに用いてはならない。また、調製においてそれを混ぜ、金属体に親和させる方法を知る者は、自然の最大の秘密の一つと、完全性への一つの道を知るだろう。一つの結果、一つの目的に至る道は、多数あるのである。
  notes: *id008
  source_printed_pages:
  - 61
  - 62
  source_pdf_pages:
  - 81
  - 82
  source_erara_pdf_pages:
  - 86
  - 87
- id: geber-summa-b01-c028-003
  section_id: geber-summa
  book: 1
  chapter: 28
  kind: body
  source_la: Et quodcunque corpus ex ipso calcinatur, acquirit pondus sine dubio. Aes quoque assumit ex
    eo Solis effigiem. Mercurio quoque associatur, et per sublimationem fit Usfur. Calcinantur denique
    omnia corpora ex eo facile, praeterquam Sol et Iupiter. Sol vero difficillime. Et non coagulatur argentum
    vivum ex eo in Solem vel Lunam, in quibus sit utilitas per artificium debile, sicut Philosophorum
    quidam fatui putaverunt. Et ita dicimus, quod quaecunque corpora minus habent de humiditate, facilius
    per sulphur calcinantur, quam quae multam. Per Deum altissimum, ipsum illuminat omne corpus, quoniam
    est alumen et tinctura.
  translation_ja: それによって焼成される金属体は、どれも確実に重さを得る。銅もそれによって太陽の姿を帯びる。またメルクリウスと結びつき、昇華によってウスフルとなる。最後に、太陽とユピテル以外のすべての金属体は、それによって容易に焼成される。太陽は非常に難しい。しかし、一部の愚かな哲学者が考えたように、不十分な技によって、それが水銀を有益な太陽や月へと凝結させるわけではない。こうも言おう。湿りの少ない金属体は、湿りの多いものよりも、硫黄によって容易に焼成される。至高の神にかけて、それはあらゆる金属体を明るくする。それが明礬であり、染める力だからである。
  notes:
  - 原刊の正誤表62頁19行の指示に従い、aliud in tinctura を削除した。印刷本文は quoniam est aliud in tinctura alumen et tinctura。
  - Usfur は原文の物質名を音写。ここでは水銀との化合物を指す文脈だが、確実でない現代の純物質名には置き換えない。
  source_printed_page: 62
  source_pdf_page: 82
  source_erara_pdf_page: 87
- id: geber-summa-b01-c028-004
  section_id: geber-summa
  book: 1
  chapter: 28
  kind: body
  source_la: Difficillime quoque solvitur, quia non habet partes salsuginosas, sed oleagineas, quae non
    facile in aquam solvuntur. Quae autem facile vel difficile solvuntur in aquam, in capitulo solutionis
    monstrabimus satis aperte. Sublimatur vero, quia spiritus est. Et si commiscetur Veneri, et adunatur
    secum, fit mirabile violaceum. Cum Mercurio quoque miscetur similiter, et fit ex eis per decoctionem
    caelestinus color et delectabilis. Non putet tamen quis, quod sulphur per se opus compleat Alchimiae,
    non enim esset hoc nisi vanum credere, hoc autem satis lucide probabimus in sequentibus. Eligitur
    autem crassum et lucidum. Et de Sulphure haec dicta sufficiant.
  translation_ja: また、溶解も非常に難しい。塩気のある部分ではなく、水に溶けにくい油性の部分を持つからである。何が水に容易に、あるいは難しく溶けるかは、溶解の章で十分明らかに示そう。一方、精気なので昇華する。ウェヌスと混ぜ、結合させると、驚くべき紫色を生じる。同じようにメルクリウスとも混じり、それらを煮熟すると、美しい空色が生じる。しかし硫黄だけで錬金術の作業が完成すると思ってはならない。それを信じるのは空しいことにすぎない。これは後で十分明瞭に証明しよう。選ぶべき硫黄は、厚く、輝きのあるものである。硫黄については、以上で十分としよう。
  notes: *id008
  source_printed_pages:
  - 62
  - 63
  source_pdf_pages:
  - 82
  - 83
  source_erara_pdf_pages:
  - 87
  - 88
- id: geber-summa-b01-c029-title
  section_id: geber-summa
  book: 1
  chapter: 29
  kind: heading
  source_la: De Arsenico. Caput XXIX.
  translation_ja: 第29章　砒素性物質について。
  notes: *id008
  source_printed_page: 63
  source_pdf_page: 83
  source_erara_pdf_page: 88
- id: geber-summa-b01-c029-001
  section_id: geber-summa
  book: 1
  chapter: 29
  kind: body
  source_la: 'Restat nos de Arsenico determinare ad praesens. Dicimus igitur quod est de subtili materia,
    et simile cum sulphure, iccirco non oportet illud aliter diffiniri, quam sulphur: in hoc autem diversificatur
    a sulphure, quia est albedinis tinctura de facili, rubedinis autem difficillime: sulphur vero rubedinis
    de facili, albedinis autem difficillime. Est autem sulphuris et Arsenici duplex genus, citrinum scilicet,
    et rubeum, quae sunt huic arti utilia, reliqua autem multa genera non. Figitur autem Arsenicum sicut
    sulphur. Utriusque vero sublimatio ex metallorum calcibus melior est. Non sunt autem sulphur et Arsenicum
    materia perfectiva huius operis. Non enim completa sunt ad perfectionem, habent autem adminiculum
    perfectionis in casu. Eligitur autem lucidum, et squamosum, et scissile.'
  translation_ja: いまは砒素性物質について論じることが残されている。それは微細な材料から成り、硫黄に類似するので、硫黄と異なる定義をする必要はない。ただし、次の点で硫黄と異なる。白く染める力は容易に示すが、赤く染める力を示すのは非常に難しい。他方、硫黄は赤く染めるのが容易で、白く染めるのは非常に難しい。硫黄と砒素性物質には、この術に役立つものとして、黄色と赤の二種類がある。その他多くの種類は役立たない。砒素性物質は硫黄と同じように固定される。両者とも、金属の灰から昇華させるのが、よりよい。ただし、硫黄と砒素性物質は、この作業を完成させる材料ではない。完成に必要なものを十分に備えていないからである。しかし、場合によっては完成を助ける働きを持つ。選ぶべきものは、輝きがあり、鱗片状で、割れやすいものである。
  notes:
  - 原刊正誤表63頁11・15行に従い、二つの difficillimae を副詞 difficillime とした。
  - ここでの Arsenicum は歴史的な砒素性物質名。現代の元素ヒ素の単体だけを意味するものではない。
  source_printed_page: 63
  source_pdf_page: 83
  source_erara_pdf_page: 88
- id: geber-summa-b01-c030-title
  section_id: geber-summa
  book: 1
  chapter: 30
  kind: heading
  source_la: De Argento vivo, seu Mercurio. Caput XXX.
  translation_ja: 第30章　生きた銀、すなわちメルクリウスについて。
  notes: *id008
  source_printed_page: 63
  source_pdf_page: 83
  source_erara_pdf_page: 88
- id: geber-summa-b01-c030-001
  section_id: geber-summa
  book: 1
  chapter: 30
  kind: body
  source_la: Argentum autem vivum, quod etiam Mercurius appellatur antiquorum usu, est aqua viscosa in
    visceribus terrae, substantiae subtilis albae terrae per calorem temperatissimum unita totali unione
    per minima, quousque humidum contemperetur a sicco, et siccum ab humido aequaliter. Ideoque fugit
    superficiem planam de facili, propter suae aquae humiditatem. Non autem adhaeret, viscosam licet habeat
    humiditatem, propter siccitatem illius, quae illam contemperat, et non adhaerere permittit. Est etiam
    (ut quidam dicunt) materia metallorum cum sulphure.
  translation_ja: 生きた銀、すなわち古人の用法ではメルクリウスとも呼ばれるものは、大地の内部にある粘りある水である。それは、ごく穏やかな熱によって、微細な白い土の実体と、ごく小さな部分に至るまで完全に結合している。そして、湿は乾によって、乾は湿によって、均等に調和される。それゆえ、その水の湿りのため、平らな表面を容易に逃れ動く。しかし粘りある湿りを持ちながら付着しないのは、その乾性が湿りを調和させ、付着を許さないからである。また、ある人々によれば、それは硫黄とともに金属の材料である。
  notes: *id008
  source_printed_pages:
  - 63
  - 64
  source_pdf_pages:
  - 83
  - 84
  source_erara_pdf_pages:
  - 88
  - 89
- id: geber-summa-b01-c030-002
  section_id: geber-summa
  book: 1
  chapter: 30
  kind: body
  source_la: Adhaeret quoque tribus mineralibus de facili, Saturno videlicet, et Iovi, et Soli, Lunae
    autem magis difficulter. Veneri vero difficilius quam Lunae, Marti autem nullo modo, nisi per artificium.
    Ex hoc itaque maximum elicias secretum. Est enim amicabilis, et metallis placabilis, et medium coniungendi
    tincturas, et non submergitur aliquid in Argento vivo, nisi Sol. Solvuntur tamen Iupiter et Saturnus,
    Luna et Venus ab eo, et commiscentur, et sine ipso aliquod metallorum deaurari non potest. Figitur
    et est tinctura rubedinis exuberantissimae refectionis, et fulgidi splendoris, et non recedit a commixto,
    donec est in natura sua. Non est tamen medicina nostra in natura sua, sed iuvare quandoque potest
    similiter in casu.
  translation_ja: また、それは三つの鉱物、すなわちサトゥルヌス、ユピテル、太陽に容易に付着するが、月にはより難しい。ウェヌスには月よりさらに難しく、マルスには技を用いなければ、まったく付着しない。ここから、きわめて大きな秘密を汲み取りなさい。それは金属に親和し、なじみやすく、染める力を結合する媒介だからである。また、水銀の中に沈むのは太陽だけである。ただしユピテル、サトゥルヌス、月、ウェヌスは、それによって溶かされ、混じり合う。また、それなしには、どの金属にも金を被せられない。それは固定されると、きわめて豊かな回復力と、まばゆい輝きをもつ赤の染色力となる。そして本来の本性にあるあいだは、混合したものから離れない。ただし、本来の状態のままでは私たちの薬ではなく、場合によっては同じように助けとなり得るものである。
  notes:
  - 金属の付着、沈み方、鍍金についての記述も、原文の歴史的主張を訳したもの。現代的な物性や作業安全性の保証ではない。
  source_printed_page: 64
  source_pdf_page: 84
  source_erara_pdf_page: 89
- id: geber-summa-b01-c031-title
  section_id: geber-summa
  book: 1
  chapter: 31
  kind: heading
  source_la: De effectibus principiorum naturae, quae sunt corpora metallica. Caput XXXI.
  translation_ja: 第31章　自然の原理の結果である、金属体について。
  notes: *id008
  source_printed_page: 64
  source_pdf_page: 84
  source_erara_pdf_page: 89
- id: geber-summa-b01-c031-001
  section_id: geber-summa
  book: 1
  chapter: 31
  kind: body
  source_la: Dicamus de metallicis corporibus, quae sunt effectus horum naturae principiorum. Sunt autem
    sex numero. Aurum, Argentum, Plumbum, Stannum, Aes et Ferrum. Dicimus igitur quod metallum est corpus
    minerale fusibile, sub malleo ex omni dimensione extensibile. Est autem metallum (ut diximus) densae
    substantiae, et fortissimae compositionis et firmae. Habent autem affinitatem magnam metalla adinvicem,
    non tamen perfectum diminutum perficit per eius commixtionem. Si enim aurum cum plumbo admisceatur
    fusione, non fit ex hoc plumbo aurum, sed evanescit plumbum ab admixtione, et aduritur, Aurum autem
    in examinatione remanet. Similiter in reliquis inducendo cadit secundum communem cursum.
  translation_ja: これらの自然の原理の結果である金属体について語ろう。数は六つで、金、銀、鉛、錫、銅、鉄である。金属とは、溶融し得て、槌の下であらゆる方向に延び得る鉱物体である。すでに述べたように、金属は濃密な実体と、きわめて強固で安定した組成を持つ。金属どうしは強い類縁性を持つが、完全なものが不完全なものと混じるだけで、それを完全にするわけではない。金を鉛と溶融して混ぜても、鉛が金になるのではなく、鉛は混合物から消え、焼け去り、金だけが検査に残る。他の金属についても、通常の過程では、同じように推論できる。
  notes:
  - 原刊正誤表65頁3行に従い、extendibile を extensibile とした。
  source_printed_pages:
  - 64
  - 65
  source_pdf_pages:
  - 84
  - 85
  source_erara_pdf_pages:
  - 89
  - 90
- id: geber-summa-b01-c031-002
  section_id: geber-summa
  book: 1
  chapter: 31
  kind: body
  source_la: Secundum vero nostrum magisterium perfectum imperfectum adiuvat, et imperfectum in nostro
    magisterio per se perficitur sine administratione alicuius rei extraneae, et imperfectum hoc eodem
    magisterio perficitur. Et per Deum, se invicem alterant et alterantur, et se invicem perficiunt et
    perficiuntur, et per se tantum unumquodque perficitur, sine alicuius adminiculo.
  translation_ja: しかし、私たちの術に従えば、完全なものは不完全なものを助ける。また私たちの術では、不完全なものは異質な物を何も加えず、それ自身によって完全にされる。不完全なものは、この同じ術によって完成されるのである。神にかけて、それらは互いに変え、変えられ、互いに完成させ、完成させられる。そして、それぞれは他の何ものの助けも借りず、それ自身だけによって完全にされる。
  notes: *id008
  source_printed_page: 65
  source_pdf_page: 85
  source_erara_pdf_page: 90
- id: geber-summa-b01-c032-title
  section_id: geber-summa
  book: 1
  chapter: 32
  kind: heading
  source_la: De Sole, sive Auro. Caput XXXII.
  translation_ja: 第32章　太陽、すなわち金について。
  notes: &id009 []
  source_printed_page: 65
  source_pdf_page: 85
  source_erara_pdf_page: 90
- id: geber-summa-b01-c032-001
  section_id: geber-summa
  book: 1
  chapter: 32
  kind: body
  source_la: Attulimus tibi in generali capitulo summam de intentionibus metallorum, specialem tibi tamen
    faciemus de unoquoque sermonem. Et primo de Auro. Dicimus ergo quod Aurum est corpus metallicum, citrinum,
    ponderosum, mutum, fulgidum, aequaliter in ventre terrae digestum, aqua minerali diutissime lavatum,
    sub malleo extensibile, fusibile, examinationem cineritii et cementi tolerans. Ex hac diffinitione
    itaque elicias, quod aliquid non est aurum, nisi causas diffinitionis et differentias omnes habeat
    auri. Quicquid tamen metallum radicitus citrinat, et ad aequalitatem perducit et mundat, ex omni genere
    metallorum aurum facit.
  translation_ja: 一般的な章で、金属についての考えの要点を述べた。しかし、それぞれについて個別にも語ろう。まず金についてである。金とは、黄色で重く、鈍い音を持ち、輝き、大地の腹の中で均等に熟成され、鉱水によって非常に長く洗われ、槌の下で延び、溶融し、灰吹きとセメント処理による試験に耐える金属体である。この定義から、定義の原因と、金に属するあらゆる区別的性質を持たなければ、何ものも金ではない、と理解しなさい。ただし、金属を根底から黄色にし、均衡へ導き、浄化するものは、いかなる種類の金属からも金を作る。
  notes:
  - cineritium は灰吹きによる試験、cementum は粉体などとの加熱による試金・精錬の歴史的操作。建築用セメントではない。
  source_printed_pages:
  - 65
  - 66
  source_pdf_pages:
  - 85
  - 86
  source_erara_pdf_pages:
  - 90
  - 91
- id: geber-summa-b01-c032-002
  section_id: geber-summa
  book: 1
  chapter: 32
  kind: body
  source_la: Ideoque per opus naturae perpendimus, et artificio aes in aurum mutari posse. Vidimus nanque
    in mineris aeris, a quibus emanabat aqua, secum adducens aeris squamas tenuissimas. Ipsasque diuturno
    et continuo lapsu lavit et mundavit. Deinde vero aqua cessante fluere, vidimus cum sicca arena has
    squamas per triennium in solis calore excoqui, inter quas est inventum aurum verissimum. Aestimavimus
    itaque per aquae beneficium illas mundatas fuisse, per Solis autem calorem in arenae siccitate aequaliter
    digestum, et ad aequalitatem pervenisse. Imitantes autem naturam cum possumus, similiter alteramus,
    non tamen in hoc sequi naturam valemus.
  translation_ja: それゆえ、自然の働きを観察して、技によっても銅を金に変え得ると私たちは判断する。私たちは、銅の鉱脈から水が流れ出て、非常に薄い銅の鱗片を運び、長く絶えず流れ続けて、それらを洗い清めたのを見た。その後、水が流れなくなると、その鱗片が乾いた砂とともに、太陽の熱で三年間煮熟されるのを見た。そして、その中に真の金が発見された。そこで私たちは、水の助けによって鱗片が浄化され、砂の乾燥の中で太陽の熱によって均等に熟成され、均衡に達したと判断した。私たちは、可能なときには自然を模倣して同様に変質させるが、この過程そのものにおいて自然に従うことはできない。
  notes:
  - 観察とその解釈は著者の報告として訳した。銅が自然に金へ変わることの現代的な実証とするものではない。
  source_printed_page: 66
  source_pdf_page: 86
  source_erara_pdf_page: 91
- id: geber-summa-b01-c032-003
  section_id: geber-summa
  book: 1
  chapter: 32
  kind: body
  source_la: Aurum quoque est preciosissimum metallorum, et est tinctura rubedinis, quia tingit ac transformat
    omne corpus. Calcinatur autem et solvitur sine utilitate, et est medicina laetificans, et in iuventute
    corpus conservans. Frangitur facillime cum Mercurio, et odore plumbi teritur. Non est autem in actu
    aliquid quod magis in substantia illi conveniat, quam Iupiter et Luna. In pondere autem et surditate,
    et putrescibilitate Saturnus, in colore autem Venus, in potentia quidem magis Venus, deinde Luna,
    deinde Iupiter, et deinde Saturnus, ultimo vero Mars. Et hoc est unum de secretis naturae. Cum ipso
    similiter commiscentur spiritus, et figuntur per ipsum maximo ingenio, quod non pervenit ad artificem
    durae cervicis et pectoris.
  translation_ja: 金はまた、金属の中で最も貴重であり、あらゆる金属体を染め、変成するため、赤の染色力である。しかし、それを焼成・溶解しても益はない。またそれは、喜びをもたらし、身体を若さのうちに保つ薬である。メルクリウスとともにすると非常に容易に砕け、鉛の気によって粉砕される。現実の実体において、ユピテルと月ほど金に適合するものはない。重さ、音の鈍さ、腐敗性についてはサトゥルヌス、色についてはウェヌスが対応する。可能性においては、まずウェヌス、次いで月、ユピテル、サトゥルヌス、最後にマルスである。これも自然の秘密の一つである。同様に、精気は金と混合され、きわめて優れた工夫によって金により固定される。その工夫は、頑なで心の鈍い術者には得られない。
  notes:
  - 金の治療・若さ保持の効能は歴史的主張であり、服用や実践の推奨ではない。
  source_printed_pages:
  - 66
  - 67
  source_pdf_pages:
  - 86
  - 87
  source_erara_pdf_pages:
  - 91
  - 92
- id: geber-summa-b01-c033-title
  section_id: geber-summa
  book: 1
  chapter: 33
  kind: heading
  source_la: De Luna, sive Argento. Caput XXXIII.
  translation_ja: 第33章　月、すなわち銀について。
  notes: *id009
  source_printed_page: 67
  source_pdf_page: 87
  source_erara_pdf_page: 92
- id: geber-summa-b01-c033-001
  section_id: geber-summa
  book: 1
  chapter: 33
  kind: body
  source_la: Solis itaque capitulo praemisso, dicamus sermonem nostrum de Luna, communi vocabulo argento.
    Dicimus igitur quod argentum est corpus metallicum, album albedine pura, mundum, durum, sonans, perdurans
    in cinericio, sub malleo extensibile, ignibile, fusibile. Est itaque albedinis tinctura, et indurat
    Iovem per artificium, et convertit ad se, et commiscetur Soli, et non frangit, sed in examinatione
    sine artificio cum eo non perseverat. Qui novit ipsum magis subtiliare, et post subtiliationem inspissare
    et figere cum auro associatum, cum eo manet in pugna, et ipsum non dimittit penitus.
  translation_ja: 太陽の章を終えたので、月、通常の名でいう銀について語ろう。銀は、純粋な白さで白く、清浄で硬く、響き、灰吹きに耐え、槌の下で延び、赤熱し、溶融する金属体である。それゆえ白の染色力であり、技によってユピテルを硬くし、自らと同じものに変える。また太陽と混じり、それを脆くしない。しかし、技を施さなければ、試験の際に太陽とともに残らない。銀をいっそう微細にし、その後、金と結びつけて濃密化・固定することを知る者にとっては、それは闘いにおいて金とともに残り、決して金を離れない。
  notes:
  - 原刊正誤表67頁11行に従い、extendibile を extensibile とした。
  source_printed_page: 67
  source_pdf_page: 87
  source_erara_pdf_page: 92
- id: geber-summa-b01-c033-002
  section_id: geber-summa
  book: 1
  chapter: 33
  kind: body
  source_la: Positum super fumum acutorum, sicut aceti, salis Ammoniaci, et agrestae, fit caelestinus
    color mirabilis. Et est nobile corpus, sed diminutum a nobilitate auri, et invenitur eius minera determinata,
    et aliquoties habet confusam mineram cum aliis corporibus, et illud non est ita nobile. Calcinatur
    autem similiter, et solvitur labore magno cum nulla utilitate.
  translation_ja: 酢、アンモニアク塩、未熟な葡萄の汁など、鋭い物の蒸気の上に置くと、驚くべき空色を生じる。銀は高貴な金属体だが、金の高貴さには劣る。銀には固有の鉱脈が見いだされるが、ときには他の金属体と混ざった鉱脈にもあり、その銀はそれほど高貴ではない。同じように焼成も溶解もされるが、多大な労力を費やしても、何の益もない。
  notes: *id009
  source_printed_page: 67
  source_pdf_page: 87
  source_erara_pdf_page: 92
- id: geber-summa-b01-c034-title
  section_id: geber-summa
  book: 1
  chapter: 34
  kind: heading
  source_la: De Saturno, sive Plumbo. Caput XXXIIII.
  translation_ja: 第34章　サトゥルヌス、すなわち鉛について。
  notes: *id009
  source_printed_page: 67
  source_pdf_page: 87
  source_erara_pdf_page: 92
- id: geber-summa-b01-c034-001
  section_id: geber-summa
  book: 1
  chapter: 34
  kind: body
  source_la: De Plumbo similiter tradamus capitulum, et dicamus, quod plumbum est corpus metallicum, lividum,
    terreum, ponderosum, mutum, parva participans albedine, cum lividitate multa, cinericium et cementum
    refugiens, molle, facile omni sua dimensione parva compressione extensibile, et facile fusibile sine
    ignitione. Plumbum autem quidam fatui putant, et dicunt multum in natura sua auro approximare. Sed
    quia sunt durae cervicis, omni ratione vacui, nullam veritatem coniicere, quantum in se est, ex subtilissimis
    rebus queunt, sed de eis secundum sensum iudicant. Et quia vident illud ponderosum, et mutum, et non
    putrescere, credunt illud Soli multum approximare, sed hoc totum est erroneum, ut latius a nobis in
    sequenti negocio probatur aperte.
  translation_ja: 鉛についても同様に一章を設けよう。鉛は、青黒く、土性で、重く、音が鈍く、白さをわずかに、大きな青黒さを多く帯びる金属体である。灰吹きとセメント処理を逃れ、柔らかく、わずかな圧力で容易にあらゆる方向へ延び、赤熱せずに容易に溶ける。ところが、ある愚かな者たちは、鉛は本性において金に非常に近いと思い、そう述べる。しかし彼らは頑なで、理性的根拠を欠き、微妙な事柄から真理を推し量れず、感覚によって判断する。鉛が重く、音が鈍く、腐敗しないのを見て、太陽に非常に近いと信じるのである。しかし、これはすべて誤りであり、後の論述でさらに詳しく明白に証明する。
  notes: *id009
  source_printed_page: 68
  source_pdf_page: 88
  source_erara_pdf_page: 93
- id: geber-summa-b01-c034-002
  section_id: geber-summa
  book: 1
  chapter: 34
  kind: body
  source_la: Plumbum quoque multum habet de substantia terrea, ideo lavatur, et in stagnum per lavacrum
    vertitur. Per hoc ergo patet stagnum magis perfecto assimilari. Et plumbum similiter aduritur, et
    fit minium, et ponitur super vapores aceti, et fit cerussa. Et licet non multum perfectioni approximet,
    ex eo tamen per nostrum artificium de facili argentum facimus, et non servat pondus proprium in transmutatione,
    sed mutatur in novum pondus. Et hoc totum in magisterio acquirit. Est etiam Plumbum argenti examen
    in cineritio, cuius causas dicemus.
  translation_ja: 鉛は土性の実体を多く持つので、洗われ、その洗浄によって錫へ変わる。したがって錫のほうが、完全なものによく似ていることが明らかである。また鉛は焼かれるとミニウムとなり、酢の蒸気の上に置かれるとケルッサとなる。完全性にさほど近くなくても、私たちは自らの技によって、そこから容易に銀を作る。また、変成の際には元の重さを保たず、新しい重さへ変わる。こうしたことはすべて、術の中で獲得される。鉛はまた、灰吹きにおける銀の試験に用いられる。その原因は後で述べよう。
  notes:
  - minium は鉛丹、cerussa は鉛白に当たる歴史的な顔料名。これらを含む処理は有害物を伴う。本文は実践の手引きではない。
  source_printed_page: 68
  source_pdf_page: 88
  source_erara_pdf_page: 93
- id: geber-summa-b01-c035-title
  section_id: geber-summa
  book: 1
  chapter: 35
  kind: heading
  source_la: De Iove, sive Stanno. Caput XXXV.
  translation_ja: 第35章　ユピテル、すなわち錫について。
  notes: *id009
  source_printed_page: 69
  source_pdf_page: 89
  source_erara_pdf_page: 94
- id: geber-summa-b01-c035-001
  section_id: geber-summa
  book: 1
  chapter: 35
  kind: body
  source_la: Iovis ergo traditione non omissa, significamus filiis doctrinae, quod est corpus metallicum,
    album, non purum, lividum, et sonans parum, terreitate pauca participans, stridorem, mollicie liquefactionis
    sine ignitione, velocitatem in radice possidens, cinericium et cementum non expectans, sub malleo
    extensibile. Est ergo Iupiter inter diminuta a perfectione corpora, magis perfecto in radice suae
    naturae affinis, Soli scilicet et Lunae, Lunae magis, Soli vero minus. Hoc itaque in sequentibus lucide
    narrabitur.
  translation_ja: ユピテルについての教えも省かず、教えの子らに示そう。それは白いが純白ではなく、青黒さがあり、あまり響かず、土性を少し含む金属体である。軋む音と柔らかさを持ち、赤熱せずに速く溶ける性質を根源から備え、灰吹きとセメント処理にとどまらず、槌の下で延びる。それゆえユピテルは、完全性を欠く金属体の中では、その本性の根底において、完全なもの、すなわち太陽と月により近い。月にはより近く、太陽にはそれほど近くない。これは後で明瞭に述べる。
  notes:
  - 原刊正誤表69頁6・9行に従い、molliciem を mollicie、corpore を corpora とし、指示された句点を整理した。残る構文の不整合は、性質の列挙として訳した。
  source_printed_page: 69
  source_pdf_page: 89
  source_erara_pdf_page: 94
- id: geber-summa-b01-c035-002
  section_id: geber-summa
  book: 1
  chapter: 35
  kind: body
  source_la: Iupiter quia albedinem multam ex radice suae generationis suscepit, ideo omnia non alba corpora
    dealbat. Vitium est tamen ei, quod omne corpus frangit praeter Saturnum, et purissimum Solem. Et Iupiter
    multum Soli et Lunae adhaeret, et ideo ab eis per examina non de facili recedit. Suscipit tincturam
    rubedinis, et splendet in eo fulgore inaestimabili, et pondus acquirit in magisterio huius artis.
    Induratur vero et mundatur facilius quam Saturnus. Et qui sciverit eius vitium fractionis auferre,
    subito ex eius proficuo perfrui laetabitur. Convenit enim Soli et Lunae, nec separabitur ab eis unquam.
  translation_ja: ユピテルは生成の根から多くの白さを得ているため、白くないすべての金属体を白くする。ただし、サトゥルヌスと最も純粋な太陽以外のあらゆる金属体を脆くするという欠点がある。また、太陽と月に強く付着するため、試験によっても容易には離れない。赤の染色力を受け入れると、測り知れない輝きを放ち、この術の操作によって重さを得る。硬化と浄化は、サトゥルヌスより容易である。脆くする欠点を取り去る方法を知る者は、その実りをすぐに享受して喜ぶだろう。太陽と月に適合し、決してそれらから分離されないからである。
  notes:
  - 原刊正誤表69頁12行に従い、albidinem を albedinem とした。
  source_printed_page: 69
  source_pdf_page: 89
  source_erara_pdf_page: 94
- id: geber-summa-b01-c036-title
  section_id: geber-summa
  book: 1
  chapter: 36
  kind: heading
  source_la: De Venere, sive Aere. Caput XXXI.
  translation_ja: 第36章〔底本の表示は第31章〕　ウェヌス、すなわち銅について。
  notes:
  - 第35章に続き、第37章の直前にある章。印刷見出しの番号 XXXI は保持し、配列に従う第36章として固定IDを付した。
  source_printed_page: 69

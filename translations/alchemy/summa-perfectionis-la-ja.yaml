- id: geber-summa-b01-c054-001
  section_id: geber-summa
  book: 1
  chapter: 54
  kind: body
  source_la: Fixio vero, est rei fugientis ab igne conveniens ad tolerantiam eiusdem adaptatio. Causa
    vero inventionis ipsius fixionis est, ut omnis tinctura, omnisque alteratio, perpetuetur in alterato,
    et non mutetur. Diversificatur vero et ipsa secundum rerum figendarum multiplicitatem, quae sunt videlicet
    corpora quaedam a perfectione diminuta, sicut Saturnus, Iuppiter, Mars, et Venus. Et secundum diversitatem
    ipsorum spirituum, qui sunt scilicet sulphur et arsenicum, in gradu uno, et argentum vivum in alio,
    in tertio vero marchesita, magnesia, et tutia, et horum similia. Figuntur igitur corpora haec a perfectione
    diminuta per suam calcinationem, eo quod absolvuntur per eam a sulphureitate volativa et corrumpente.
    Et hanc sufficienter in sua narravimus oratione, scilicet in capitulo calcinationis.
  translation_ja: 固定とは、火から逃げる物を、その火に耐えられるよう適切に整えることである。固定が発見された原因は、すべての染色作用と、すべての変質が、変えられた物の中で永続し、変わらないようにすることにある。固定もまた、固定する物の種類に応じて異なる。それらは、サトゥルヌス、ユピテル、マルス、ウェヌスのような、完全性を欠く若干の金属体である。また、精気の相違によっても異なる。精気は、硫黄と砒素性物質が一つの区分、水銀が別の区分、マルカシータ、マグネシア、トゥティア、およびそれらに似た物が第三の区分に属する。完全性を欠くこれらの金属体は、焼成によって固定される。焼成によって、揮発性で物を損なう硫黄性から解き放たれるからである。その焼成については、それを扱う説明、すなわち焼成の章で十分に述べた。
  notes:
  - マグネシア（magnesia）とトゥティア（tutia）は歴史的鉱物名として保ち、近代の同名物質と一律に同定しない。
  source_printed_page: 121
  source_pdf_page: 141
  source_erara_pdf_page: 146
- id: geber-summa-b01-c054-002
  section_id: geber-summa
  book: 1
  chapter: 54
  kind: body
  source_la: Figuntur vero sulphur et arsenicum duobus modis, scilicet per reiterationem sublimationis
    super illa in vase aludele, quousque stent. Est igitur ex hoc intentio festinationis fixionis illorum,
    ut ingenieris ad inventionem reiterationis multiplicis sublimationis in brevi tempore, quod per duo
    fit aludela, cum duplicibus suis cooperculis, hoc ordine scilicet, ut nunquam ab actu sublimationis
    desistas, donec fixa fuerint. Proiiciantur ergo cum in uno ascenderunt, in aliud aludel, et sic alternata
    vice fiat. Et nunquam otiosa permittantur aludelis spondilibus adhaerere, quin in continua sint ignis
    elevatione, quousque cesset illorum elevatio. Quantocunque enim in breviori tempore poteris multiplices
    sublimationis reiterationes multiplicare, tanto celerius et melius continget ipsius fixionis tempus
    abbreviare.
  translation_ja: 硫黄と砒素性物質は、二つの方法で固定される。一つは、それらが留まるようになるまで、アルデル容器の中で昇華を繰り返すことである。したがって、その固定を速めるための狙いは、短時間に何度も昇華を繰り返せる仕組みを工夫することである。これは、二つのアルデルと、それぞれの蓋を使い、固定されるまで昇華の操作をまったく止めないようにして行う。一方の容器で上昇したら、もう一方のアルデルへ投じ、このように交互に行う。昇華物を、アルデルの壁に何もせず付着させたままにしておいてはならず、その上昇が止まるまで、絶えず火によって上昇させる。短時間に昇華の反復を多く重ねられるほど、固定に要する時間を、より速く、よりよく短縮できる。
  notes:
  - アルデル（aludel）は昇華に用いる器具。
  source_printed_pages:
  - 121
  - 122
  source_pdf_pages:
  - 141
  - 142
  source_erara_pdf_pages:
  - 146
  - 147
- id: geber-summa-b01-c054-003
  section_id: geber-summa
  book: 1
  chapter: 54
  kind: body
  source_la: Ideoque fuit secundus fixionis modus inventus, qui est per ipsius sublimandi praecipitationem,
    ad calorem, ut continuo in illo sit, donec figatur. Et hoc fit per longum vas vitreum, cuius fundus
    sit terreus, et non vitreus (quia scinderetur in partes) illi artificialiter cum clausura bona connexus,
    et per spatulam ferream, vel lapideam, cum ad spondilia eius adhaeserit, deiiciatur ad ima, caloris
    continue, per alternas vices, quousque figatur.
  translation_ja: そこで、固定の第二の方法が見いだされた。それは、昇華させる物を熱の中へ落とし、固定されるまで、絶えずそこに置く方法である。これは長いガラス容器を用いて行う。その底は土製とし、ガラス製にはしない。ガラスでは割れてしまうからである。土製の底は、うまく工夫して、よく閉じるように容器へ接続する。昇華物が容器の壁に付着したら、鉄または石の箆で、熱のある最下部へ落とし、固定されるまで絶えず交互に繰り返す。
  notes: []
  source_printed_pages:
  - 122
  - 123
  source_pdf_pages:
  - 142
  - 143
  source_erara_pdf_pages:

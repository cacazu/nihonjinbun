- id: geber-summa-b01-c001-002
  section_id: geber-summa
  book: 1
  chapter: 1
  kind: body
  source_la: Sed scias charissime, quod qui principia naturalia in seipso ignoraverit, hic iam multum
    remotus est ab arte nostra, quoniam non habet radicem veram, supra quam intentionem suam fundet. Et
    qui principia sua sciverit naturalia, et causas mineralium omnes, nondum tamen adeptus est verum finem
    et proficuum huius artis occultissimae, habet vero faciliorem aditum ad artis huius principia, quam
    cui ignorantia cadit super intentione eius de modo huius nostri operis, et hic parum remotus est ab
    artis introitu. Qui vero sciverit omnium principia, et causas mineralium, et generationis modum, qui
    ex intentione naturae consistit, parum quidem aufertur ab eo de operis complemento, sine quo tamen
    non potest scientia nostra perfici, quoniam ars imitari non potest naturam in omnibus operibus, sed
    imitatur eam sicut rite potest.
  translation_ja: しかし、愛する者よ、知りなさい。自然の原理を自ら理解していない者は、すでに私たちの術から大きく隔たっている。自分の考えを据える真の根を持たないからである。自然の原理と、鉱物のあらゆる原因を知った者も、この最も隠された術の真の目的と実りを、まだ得たわけではない。ただし、私たちの作業の仕方について理解を欠いている者より、この術の原理への入口は容易であり、術の入口からそれほど遠くない。あらゆる原理、鉱物の原因、そして自然の意図に基づく生成の仕方を知る者には、作業の完成まで、なおわずかなものが残される。しかし、その残されたものなしには、私たちの学知は完成できない。技術は、自然のあらゆる働きを模倣できるわけではなく、適切に可能な範囲で自然を模倣するからである。
  notes:
  - 原刊正誤表（21頁・17行）に従い、行末の in- と訂正語 tētione を合わせ、intentione と展開した。
  source_printed_page: 21
  source_pdf_page: 43
  source_erara_pdf_page: 48
- id: geber-summa-b01-c001-003
  section_id: geber-summa
  book: 1
  chapter: 1
  kind: body
  source_la: Charissime igitur fili, secretum tibi pandimus, quod in hoc artifices errant, quod naturam
    in omnibus differentiis proprietatum actionis imitari desiderant. Labora itaque studere in nostris
    voluminibus, et ea saepissime in mente tua revolvere nitaris, ut intentionem ex nostrae loquelae modo
    veram acquiras, quia in eis invenies, super quod mentem tuam fundare debeas, et scies ex eis errores
    a te repellere, et in quibus imitari naturam possis in tui operis artificio.
  translation_ja: それゆえ、最も愛するわが子よ、秘密を明かそう。自然の作用の性質を、あらゆる相違にわたって模倣しようとする術者は、この点で誤っている。だから私たちの諸巻を熱心に学び、幾度も心の中で繰り返し考え、私たちの語り方から真の意図を得るよう努めなさい。そこには、自らの考えを据えるべき基礎が見いだされる。また、それらによって誤りを退ける方法と、自らの作業の技において、どの点で自然を模倣できるかを知るだろう。
  notes:
  - 原刊正誤表（21頁・22行）に従い、「quod naturam in omnibus」と読む。
  - 原刊正誤表（21頁・24行）に従い、「et ea saepissime」と読む。
  source_printed_pages:
  - 21
  - 22
  source_pdf_pages:

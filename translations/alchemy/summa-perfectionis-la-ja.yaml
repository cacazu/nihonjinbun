  - 172
- id: geber-summa-b02-c066-002
  section_id: geber-summa
  book: 2
  chapter: 66
  kind: body
  source_la: Quod vero sulphuris quantitas combustibilis magis sit argenti vivi substantiae adhaesiva
    in eo quam in Iove, significatur per hoc, quod non separatur de eo in fumum quantitas notanda, quin
    sit citrini coloris multae citrinitatis, cuius similiter est quod in fundo inferiori ex eo remansit,
    id quod necessario unius trium horum esse signum relinquitur, aut nullius quantitatis sulphuris combustibilis
    in eo, aut paucissimae, aut multum coniunctae, in principiorum propinquitate ad radicem commixtionis.
    Sed certificati sumus per illius odorem, ipsum alicuius esse quantitatis, et non paucae, imo multae,
    quia non removetur ab eo odor sulphureitatis in brevi tempore. Ideo consideravimus consideratione
    qua certi sumus, sulphur comburens illius sulphuri non comburenti ad naturam fixi approximanti, in
    argenti vivi substantia uniformiter esse commixtum. Ideo cum scandit fumus eius, necessario cum sulphure
    non comburente scandit, de cuius proprietate est citrinitatem creare. Quod vero maior quantitas sulphuris
    non adurentis sit in ipso quam in Iove, a nobis adductum est cum veritate, per hoc quod videmus totum
    colorem ipsius in citrinum mutari, Iovis vero in album, in calcinationibus suis.
  translation_ja: 可燃性の硫黄が、錫の場合よりも鉛の水銀の実体に強く付着していることは、次の事実から示される。鉛から目立つ量の煙を分離すると、それは必ず濃い黄色を帯び、下の底に残ったものも同じ色を持つ。このことは、次の三つのうち、必ず一つを示すと結論される。すなわち、可燃性の硫黄がまったくないか、ごく少量しかないか、あるいは、混合の根源で原理が近接しているために、強く結び付いているかである。しかし、その臭いによって、硫黄は確かに含まれ、しかも少量ではなく多量であると確証した。硫黄性の臭いは短時間には消えないからである。そこで私たちは、確実な考察によって、鉛の燃焼する硫黄が、固定の本性に近づいた燃焼しない硫黄と、水銀の実体の中で均一に混ざっていると考えた。したがって、煙が上昇するときは、黄色を作る特性を持つ、燃焼しない硫黄とともに、必ず上昇する。鉛にある焼損をもたらさない硫黄の量が錫より多いことは、焼成の際、鉛は全体の色が黄色に変わるのに対し、錫は白に変わるのを観察することによって、真実として示された。
  notes: []
  source_printed_pages:
  - 147
  - 148
  source_pdf_pages:
  - 167
  - 168

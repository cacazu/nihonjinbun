- id: geber-summa-b01-c037-002
  section_id: geber-summa
  book: 1
  chapter: 37
  kind: body
  source_la: 'Inter omnia igitur corpora Iupiter in splendidius, et lucidius, fulgidius et perfectius
    in solare et lunare transformatur corpus. Sed in eo est opus facilis tractationis, et longi laboris.
    Post illum vero Venus minus perfectae mutationis eligitur, difficilioris tractationis, brevioris vero
    quam Iupiter laboris. Saturnus vero post Venerem perfectionem in transmutatione ab illa diminutam
    habet, facilis tractationis, longissimi vero laboris. Mars vero inter caetera minimae perfectionis
    in transmutatione consistit, tractationis utique difficillimae, et laboris longissimi. Quaecunque
    igitur a velocitate liquefactionis corpora remotiora sunt, difficilioris inveniuntur in transmutationis
    opere tractationis. Et sunt huiusmodi Venus et Mars. Quae vero magis, magis: et quae maxime, maxime.
    Quaecunque vero maioris lividitatis et infectionis de terra sunt participantia, et haec laboris maioris
    inveniuntur, et minoris perfectionis.'
  translation_ja: したがって、すべての金属体の中でユピテルは、より光沢があり、明るく、輝かしく、完全な太陽と月の金属体へと変成される。しかし、その作業は扱いやすい一方、長い労力を要する。その次に選ばれるのはウェヌスで、変成の完全性はより低く、扱いは難しいが、ユピテルより労力の期間は短い。サトゥルヌスはウェヌスの次で、それより変成の完全性が低く、扱いやすいが、非常に長い労力を要する。マルスは、他のものの中でも変成の完全性が最も低く、きわめて扱いにくく、非常に長い労力を要する。それゆえ、速やかに溶ける性質から遠い金属体ほど、変成作業において扱いにくい。ウェヌスとマルスがそれに当たる。その隔たりが大きいほど難しさも増し、最大なら難しさも最大である。また、土からの青黒さと汚染を多く持つものほど、多くの労力を要し、完全性は低い。
  notes: *id009
  source_printed_page: 71
  source_pdf_page: 91
  source_erara_pdf_page: 96
- id: geber-summa-b01-c037-003
  section_id: geber-summa
  book: 1
  chapter: 37
  kind: body
  source_la: Quaecunque autem perfectionum diversitates paulo prius a nobis determinatae sunt, in minoris
    et medii operis artificio repertae sunt, in maiori vero unius perfectionis sunt omnia, non autem unius
    tractationis aut laboris sunt. Remanet enim dicere, et quae tractationis facilitas et difficultas,
    et quae brevitas laboris, et longitudo, in radice in natura corporum inventa sunt. Iam ergo principia
    naturalia ipsorum corporum, traditione vera quae est ex intentione naturae perscripsimus, et ipsorum
    corporum similiter determinatos sermones in singulis capitulis veraciter exposuimus, et secundum sententiam
    eorum, qui intima naturae videre potuerunt, et secundum nostram, qui ad ea pervenimus cum instantia
    laboris. Nunc vero secundum quod innuimus, expedit huius artis defectum supplere, et principia omnia
    huius magisterii tradere in huius nostri sermonis ultima parte, et perfectionem quam vidimus, secundum
    eius exigentiam, cum causis suis monstrare.
  translation_ja: ただし、いま述べた完全性の相違は、小さな作業と中間の作業の技において見いだされたものである。大きな作業では、すべてが同じ完全性を持つ。しかし、扱い方や労力まで同じなのではない。というのも、扱いやすさと難しさ、労力の短さと長さが、金属体の本性の根底にどのように見いだされるかを述べることが、なお残されているからである。さて、私たちは金属体の自然的原理を、自然の意図に由来する真の教えによって書き記した。また、各金属体の説明を、それぞれの章で正しく述べた。それは、自然の内奥を見通した人々の見解と、たゆまぬ労苦によってそこへ達した私たち自身の見解に従ったものである。いまは、すでに示したとおり、この術の説明の不足を補い、本論述の最後の部で、この術のすべての原理を伝え、私たちが見た完全性を、その要請に応じて、その原因とともに示すのが適切である。
  notes: *id009
  source_printed_pages:

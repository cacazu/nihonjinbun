  - 136
  - 137
- id: geber-summa-b01-c052-002
  section_id: geber-summa
  book: 1
  chapter: 52
  kind: body
  source_la: Ad hoc vero ut penetrent et transmutent, sine magisterio non pervenitur, quod est scilicet,
    ut post solutionem et coagulationem illius administretur illi aliquis ex spiritibus purificatus, non
    fixus. Et totiens ab illo sublimetur, quousque secum maneat, et illi velociorem praestet fusionem,
    et ipsum in fusione a vitrificatione conservet. De natura enim spirituum est, non vitrificari, et
    a vitrificatione commixtum salvare, donec in eo fuerint. Spiritus ergo qui magis naturam servavit
    spiritus, magis a vitrificatione defendet. Magis autem servavit spiritus, solummodo purificatus, quam
    purificatus, fixus, calcinatus, atque solutus, ideo necesse est talem illi admisceri. Resultat enim
    ex his bona fusio, et ingressio, et fixio stans.
  translation_ja: しかし、浸透し変成することは、術を施さずには達成されない。その術とは、すなわち、対象を溶解し凝結させた後、それに、精製はされているが固定されていない精気を何か一つ加えることである。そして、その精気が対象とともに留まり、より速い溶融をもたらし、溶融中のガラス化を防ぐようになるまで、対象から何度も昇華させる。精気は、その本性としてガラス化せず、混ぜられた物の中に留まっているかぎり、それもガラス化から守る。したがって、精気の本性をより多く保っている精気ほど、ガラス化をよく防ぐ。単に精製しただけの精気は、精製、固定、焼成、溶解を施した精気より、その本性をよく保つ。それゆえ、そのような精気を対象に混ぜる必要がある。これらから、良好な溶融、浸透、そして持続する固定が生じるからである。
  notes: []
  source_printed_page: 112
  source_pdf_page: 132
  source_erara_pdf_page: 137
- id: geber-summa-b01-c052-003
  section_id: geber-summa
  book: 1
  chapter: 52
  kind: body
  source_la: Ex operibus autem naturae probare possumus, sola salium et aluminum, et similium naturam
    servantia, solubilia esse. Non enim in operibus illius omnibus considerantes, invenimus alia solvi,
    praeter illa. Igitur quaecunque solvuntur, necesse est per illorum naturam solvi. Sed quia videmus
    omnia vere calcinata solvi per reiterationem calcinationis et solutionis, ideoque probamus per illud,
    omnia calcinata ad salium vel aluminum naturam approximare, ideo sese in proprietatibus necesse est
    concomitari.
  translation_ja: 自然の働きから、塩、明礬、およびそれらに似た物の本性を保つ物だけが、溶解可能であることを証明できる。自然のすべての働きを考察しても、それら以外の物が溶解するのは見いだされないからである。したがって、何であれ溶解する物は、それらの本性によって溶解するはずである。しかし、真に焼成されたすべての物が、焼成と溶解の反復によって溶けることを私たちは見る。このことによって、焼成されたすべての物が、塩または明礬の本性に近づくことを証明する。したがって、それらは性質の点でも互いに伴い合わなければならない。
  notes: []
  source_printed_pages:
  - 112
  - 113
  source_pdf_pages:
  - 132
  - 133
  source_erara_pdf_pages:
  - 137
  - 138
- id: geber-summa-b01-c052-004
  section_id: geber-summa
  book: 1
  chapter: 52
  kind: body
  source_la: Modus vero solutionis duplex est, scilicet per fimum calidum, et per ferventem aquam. Quorum
    est una intentio, et unus effectus. Modus ergo per fimum est, ut ponatur calcinatum in ampullam vitream,
    et super illud fundatur quantitas aceti distillati, vel consimilis, duplum eius, et obturetur caput
    ipsius bene, ne respiret, et sub fimo tepido solvi dimittatur, et postea per distillationem filtri
    solutum removeatur. Non solutum vero iterato calcinetur, et post calcinationem iterato similiter solvatur,
    donec per reiterationem operis super illud, totum solvatur.
  translation_ja: 溶解の方法には二つある。温かい堆肥によるものと、沸騰する水によるものである。両者の目的と効果は一つである。堆肥による方法は、焼成した物をガラス瓶に入れ、その上から、蒸留した酢または同様の液を、その物の二倍量注ぐというものである。空気が通らないよう瓶の口をよく塞ぎ、温かい堆肥の下で溶解するにまかせる。その後、濾布による滴下で、溶解した部分を取り分ける。溶解しなかった部分は、再び焼成し、焼成の後、同じようにまた溶解させる。その物に対して作業を繰り返し、すべてが溶けるまで続ける。
  notes: []
  source_printed_page: 113
  source_pdf_page: 133
  source_erara_pdf_page: 138
- id: geber-summa-b01-c052-005
  section_id: geber-summa
  book: 1
  chapter: 52
  kind: body
  source_la: Modus vero qui per bullientem aquam fit, velocior est. Et est ut calcinatum in ampullam similiter
    ordinetur cum aceto, obturato foramine, ne respiret, quae in caldario pleno aqua et stramine sepeliatur,
    ut in distillationis modo per aquam praeceptum attulimus per ordinem, et postea succendatur sub ea
    ignis, donec aqua per horam ferveat. Post hoc vero solutum distilletur, et seorsum servetur. Non solutum
    vero iterato calcinetur, et iterato eodem ordine solvatur, donec per reiterationem totum solvatur.
    Descriptio vero eius, quod nunc dictum est, haec est.
  translation_ja: 沸騰する水による方法のほうが速い。その方法は、同様に焼成した物を酢とともに瓶へ入れ、空気が通らないよう口を塞ぐというものである。水を用いる蒸留法で順序を追って指示したように、その瓶を、水と藁で満たした釜に埋める。その後、下から火を起こし、水が一時間沸騰するようにする。その後、溶解した部分を滴下させて取り、別に保存する。溶解しなかった部分は再び焼成し、同じ手順でまた溶解させ、反復によってすべてが溶けるまで続ける。いま述べたものの図は、次のとおりである。
  notes: []

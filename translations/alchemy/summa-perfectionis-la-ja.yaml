- id: geber-summa-b02-c064-003
  section_id: geber-summa
  book: 2
  chapter: 64
  kind: body
  source_la: 'Nigredo vero in utroque horum duorum corporum ad ignem creatur propter sulphur non fixum,
    quod in illis concluditur: multum quidem in Venere, parum vero in Marte, et ad naturam fixi approximans.
    Ideoque non de facili talis impressio de Marte removeri est possibile. Iam igitur patuit, ex sulphure
    non fixo fusionem fieri, et fusionem adiuvari: ex fixo vero fusionem non fieri, et fusionem impediri.
    Ex argento vero vivo fixo non est necesse fusionem non fieri, et fusionem impediri. Illud scit necessario
    verum esse, qui nullo ingeniorum fusionis, sulphur potuit conservare in fusione post illius fixionem.
    Argentum vero vivum figere potuit per frequentem sublimationis reiterationem ad illud, eo bonam fusionem
    suscipiente. Ex hoc itaque manifestum est, corpora esse maioris perfectionis, quae plus argenti vivi
    sunt continentia: quae vero minus, minoris perfectionis. Studeas igitur in omnibus tuis operibus,
    ut argentum vivum in commixtione superet. Et si per solum argentum vivum perficere poteris, preciosissimae
    perfectionis indagator eris, et eius perfectionis, quae naturae vincit opus. Mundare enim poteris
    intime, ad quod natura non pervenit. Probatio vero eius, quod ea quae maioris argenti vivi quantitatem
    sunt continentia, maioris sint perfectionis, est scilicet facilis susceptio argenti vivi. Videmus
    enim corpora perfectionis amicabiliter argentum vivum suscipere.'
  translation_ja: この二つの金属体が火で黒くなるのは、内部に含まれる固定されない硫黄のためである。それは銅には多く、鉄には少なく、鉄では固定されたものの本性に近づいている。したがって、このような作用の痕跡を鉄から容易に取り除くことはできない。いまや、固定されない硫黄によって溶融が生じ、促進される一方、固定された硫黄からは溶融が生じず、妨げられることが明らかになった。しかし、固定された水銀からは、必ずしも溶融が生じなくなったり、妨げられたりするわけではない。硫黄を固定した後、どのような溶融の工夫を用いても、その溶融性を保つことができなかった人は、これが必然的に真であると知っている。その人も、水銀なら昇華を幾度も繰り返すことによって、良好な溶融性を保ったまま固定できたからである。したがって、水銀を多く含む金属体ほど完全性が高く、少なく含むものほど完全性が低いことが明らかである。あらゆる操作において、水銀が混合物の中で優勢になるよう努めなさい。水銀だけで完全化できるなら、あなたは最も貴重な完全性、自然の働きに打ち勝つ完全性の探究者となる。自然が到達しないほど深く清めることができるからである。水銀をより多く含むものほど完全性が高いことの証拠は、水銀を容易に受け入れることである。完全な金属体は、水銀を親和的に受け入れるのが観察される。

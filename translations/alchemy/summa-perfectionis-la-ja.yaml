  - 51
  source_erara_pdf_pages:
  - 55
  - 56
- id: geber-summa-b01-c007-005
  section_id: geber-summa
  book: 1
  chapter: 7
  kind: body
  source_la: 'Nec etiam adinvenire nitatur sophistici metam operis, sed soli sit complemento intentus,
    quoniam ars nostra in potentia divina servatur, et cui vult, elargitur et subtrahit, qui est gloriosus,
    et sublimis, et omni iusticia et bonitate repletus, forte enim ex sophistici vindicta operis, tibi
    artem denegaret, et in devium erroris te crudeliter detruderet, et ex errore in infoelicitatem, et
    miseriam perpetuam. Miserrimus enim et infoelix est, cui Deus semper post operis sui atque laboris
    finem, veritatem denegat conspicere: quoniam vitae suae spacium semper in errore concludit et terminat,
    hic enim in labore constitutus, perpetuo omnique infortunio, et infoelicitate obsessus, tota huius
    seculi consolatione, gaudio, et delectationem amittit, et vitam suam in moerore sine proficuo consumit.'
  translation_ja: また、偽りの作業の成果を求めようとしてはならず、ひたすら完全な完成を目指すべきである。私たちの術は神の力のうちに保たれており、栄光に満ち、崇高で、あらゆる正義と善に満ちる方が、望む者に与え、あるいは取り去るからである。偽りの作業への報いとして、神はあなたにこの術を拒み、誤りの道へと厳しく突き落とし、誤りから不幸と永遠の惨めさへ導くかもしれない。作業と労苦の終わりに、神からいつも真理を見ることを拒まれる者は、最も惨めで不幸である。生涯をつねに誤りの中で閉ざし、終えるからである。その者は労苦の中に置かれ、あらゆる尽きない不運と不幸に囲まれ、この世の慰め、喜び、楽しみをすべて失い、実りのない悲しみのうちに生を費やすのである。
  notes: *id001
  source_printed_page: 29
  source_pdf_page: 51
  source_erara_pdf_page: 56
- id: geber-summa-b01-c007-006
  section_id: geber-summa
  book: 1
  chapter: 7
  kind: body
  source_la: Studeat similiter, cum in opere fuerit, omnia signa, quae in qualibet decoctione apparent,
    in mentem sigillare, et illorum causas inquirere. Haec itaque sunt, quae necessaria sunt artifici,
    ad artem nostram idoneo. Si vero alterum eorum, quae narravimus, eidem defuerit, huic arti non adhaereat.
  translation_ja: また、作業の際には、それぞれの煮熟に現れるすべての徴候を心に刻み、その原因を探究するよう努めるべきである。以上が、私たちの術に適した術者に必要な条件である。もし、述べた事柄のどれかを欠いているなら、この術に取りついてはならない。
  notes: *id001
  source_printed_page: 29
  source_pdf_page: 51
  source_erara_pdf_page: 56

- id: geber-summa-b02-c059-title
  section_id: geber-summa
  book: 2
  chapter: 59
  kind: heading
  source_la: De natura Mercurii, sive Argenti vivi. Cap. LIX.
  translation_ja: 第59章　メルクリウス、すなわち水銀の本性について。
  notes: []
  source_printed_page: 129
  source_pdf_page: 149
  source_erara_pdf_page: 154
- id: geber-summa-b02-c059-001
  section_id: geber-summa
  book: 2
  chapter: 59
  kind: body
  source_la: In argento vivo similiter necesse est superflua demere. Habet enim corruptionis causas, videlicet
    terream, et adustibilis absque inflammatione aqueitatis substantiam. Putaverunt tamen aliqui illud
    non superfluam habere terram, vel immunditiam. Sed vanum est quod cogitatur ab eisdem. Videmus enim
    ipsum multae lividitatis, et non albedinis. Et similiter per leve artificium videmus ex illo terram
    nigram et feculentam emanare, per lavationem videlicet, cuius modum narrabimus. Sed quia duplicem
    est per illud perfectionem elicere, medicinam scilicet ex eo facere, et illud perficere, ideoque necesse
    est ipsum duplicis mundationis gradu praeparare, propterea duae mundationes Mercurii necessariae.
    Una per sublimationem ad medicinam, et haec hic innuitur. Alia per lavacrum ad coagulationem, et illa
    innuetur. Si enim volumus medicinam ex illo creare, tunc necesse est eam a feculentia suae terreitatis
    mundare per sublimationem, ne in proiectione creet colorem lividum, et ipsius aqueitatem fugitivam
    delere, ne totam medicinam fugitivam in proiectione faciat, et mediocrem illius substantiam salvare
    pro medicina. De cuius est proprietate non aduri, et ab adustione defendere, et quae non fugit, et
    fixum facit.
  translation_ja: 水銀についても、余分なものを取り除く必要がある。水銀には腐敗の原因、すなわち土性の実体と、発火せずに焼損する水性の実体があるからである。しかし、水銀には余分な土や不純物がないと考えた人々もいた。その考えは根拠がない。水銀には白さよりも、鉛色の暗さが多いことが見て取れる。また、簡単な操作、すなわち後でその方法を述べる洗浄によって、そこから黒く滓を含む土が出てくるのを観察できる。水銀からは二通りの完全化、すなわち水銀から薬を作ることと、水銀自体を完全化することが得られるため、二種類の浄化の段階によって調製しなければならない。したがって、水銀には二種類の浄化が必要となる。一つは薬を作るための昇華によるものであり、ここで示している。もう一つは凝固させるための洗浄によるもので、これから示す。水銀から薬を作ろうとするなら、投射の際に鉛色を生じないよう、昇華によって土性の滓を除いて清め、投射の際に薬全体を揮発性にしないよう、その揮発する水性を除き、中間の実体を薬のために残さなければならない。この実体には、焼損せず、焼損から守り、揮散せず、固定するという特性がある。
  notes: []
  source_printed_pages:
  - 129
  - 130
  source_pdf_pages:

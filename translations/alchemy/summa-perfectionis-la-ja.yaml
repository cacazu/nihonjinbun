- id: geber-summa-b02-c087-001
  section_id: geber-summa
  book: 2
  chapter: 87
  kind: body
  source_la: 'Praetermissis igitur manifestis experientiis, de quibus narrationem non facimus, cum omnibus
    sint notae et certae absque ullius sagacitatis ingenio, ponderis scilicet, et coloris, et extensionis
    per malleum: artificiorum experientias tentemus, cum cautela, an sit huius artis administrationis
    proiectio, complementum cum veritate adducens, quae sunt scilicet Cineritium, Cementum, Ignitio, Fusio,
    Super vapores acutorum expositio, Adurentis Sulphuris mixtione probatio, Extinctio, Calcinationis
    et reductionis reiteratio, et Argenti vivi facilis aut difficilis susceptio. Primum igitur secundum
    ordinem inchoandum: dehinc vero secundum eundem ad alia, secundum promissionem perfecte curramus cum
    causis eorum notis.'
  translation_ja: 明白な検査、すなわち重さ、色、槌による展延の検査は、洞察の工夫を要さず、誰にも知られ確実であるから、ここでは説明を省く。そこで、この術の処置による投与が真の完成をもたらすかどうか、技法による検査を慎重に試みよう。それらは、灰吹き、セメント処理、赤熱、溶融、刺激性物質の蒸気への曝露、焼損させる硫黄との混合による試験、急冷、焼成と還元の反復、水銀を容易に、または困難に受け入れることの検査である。まず順序に従って第一のものから始め、次いで同じ順序に従い、約束どおり、既知の原因とともにほかのものも完全に述べよう。
  notes: []
  source_printed_page: 187
  source_pdf_page: 207
  source_erara_pdf_page: 212
- id: geber-summa-b02-c088-title
  section_id: geber-summa
  book: 2

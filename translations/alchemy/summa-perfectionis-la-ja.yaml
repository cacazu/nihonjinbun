- id: geber-summa-b01-c009-006
  section_id: geber-summa
  book: 1
  chapter: 9
  kind: body
  source_la: 'Similiter etiam, esse et perfectio datur a stellis, tanquam a primis perficientibus, et
    moventibus naturam generationis et corruptionis ad esse et non esse specierum. Hoc autem fit subito,
    et in instanti, cum pervenit una stella aut plures ex motibus, ad situm determinatum in firmamento,
    a quo datur perfectionis esse: quia unaquaeque res ex certo situ stellarum acquirit sibi esse in momento.
    Et non est solum unus situs, imo plures, et sibi invicem diversi, quemadmodum ipsorum effectus sunt
    diversi. Et horum diversitatem, et distinctionem ab invicem pernotare non possumus, cum nobis sint
    incogniti et infiniti. Quomodo ergo supplebis defectum in opere tuo, ex ignorantia diversitatum situum
    stellarum, ex motu earum? Et tamen si situm unius, aut plurium stellarum certum, quo datur in metallis
    perfectio, scires, non tamen opus ad intentum tuum perficeres. Non est enim alicuius operis praeparatio
    ad suscipiendum formam per artificium in instanti, sed successiva. Ergo operi forma non dabitur, cum
    praeparatio non sit in instanti.'
  translation_ja: 同じように、こう論じる。「存在と完全性は、星々によって与えられる。星々は第一の完成因であり、生成と消滅の自然を動かして、種を存在または非存在へと導く。この作用は、一つまたは複数の星が運動によって天の定まった配置へ到達したとき、突然、一瞬に起こる。その配置から、完全な存在が与えられるのである。個々の事物は、一定の星の配置から、一瞬に存在を獲得する。この配置は一つだけではなく、多数あり、その結果が異なるように、相互にも異なる。それらは私たちに未知で、無数であるから、その相違と区別を詳しく知ることはできない。それゆえ、星々の運動による位置の相違を知らないことから生じる、作業の不足を、どう補えるのか。また、金属に完全性を与える一つまたは複数の星の一定の配置を知っていても、作業を目的どおりに完成できない。技術によって何かを形相の受容へ調製することは、一瞬に行われず、順次行われるからである。調製が一瞬でなければ、作業対象には形相が与えられない。」
  notes:
  - 星の配置による生成論は、この章で紹介される反対論の一部。現代の天文学的説明ではない。
  source_printed_pages:

  - 210
  - 211
- id: geber-summa-b02-c086-003
  section_id: geber-summa
  book: 2
  chapter: 86
  kind: body
  source_la: 'Iam igitur laudetur sublimis naturarum Deus benedictus et gloriosus, qui nobis omnium medicinarum
    revelavit seriem, cum illarum experientia, quam illius instigationis bonitate, et nostri laboris instantia
    perquisivimus, et oculis vidimus, et manu tetigimus complementum illius nostro magisterio indagatum.
    Sed et si quidem hanc palliavimus, non miretur doctrinae filius. Non enim illi palliavimus, sed malis
    et improbis eam tali sermone tradidimus, quem latere insipientem necessario accidit: et eodem ad illius
    inventionis perquisitionem prudentes allicio. Filii igitur doctrinae perquirite, et hoc excellentissimum
    Dei donum vobis solis servatum invenietis. Filii insipientes nequitiae et malivolae pravitatis, immense
    ab hac scientia fugite, quoniam est vobis inimica et adversa, et vos in miseriam paupertatis constituet:
    quoniam a vobis penitus hoc Dei donum divinae providentiae iudicio est occultum, et denegatum omnino.
    Perquisitis ergo omnium medicinarum modis, nostri propositi prosequentes intentum, ad eas quae huius
    magisterii perfectionem notificant, cum probationum causis ab hinc transeundum est.'
  translation_ja: いまこそ、祝福され栄光に輝く、万物の本性を司る高き神を讃えよう。神は、あらゆる薬の系列を、その経験とともに私たちに啓示された。私たちは、神の善き促しと不断の労苦によってそれを探究し、この秘術により究明した完成を目で見、手で触れた。私たちがこれを覆い隠していても、学びの子は不思議に思ってはならない。彼に対して隠したのではなく、悪人や不正な者に対して、愚者には必ず意味が隠される言葉で伝えたのである。同じ言葉によって、思慮ある者をその発見の探究へと誘う。ゆえに学びの子らよ、探究せよ。あなたたちのためだけに取っておかれた、この卓越した神の賜物を見いだすだろう。悪徳と悪意ある邪悪の愚かな子らよ、この学知から遠く逃れよ。それはあなたたちの敵であり、逆らうものであり、あなたたちを貧窮の悲惨へ陥れるからである。神の摂理の裁きにより、この神の賜物はあなたたちから完全に隠され、全面的に拒まれている。さて、あらゆる薬の方法を探究したので、所期の目的を追い、この秘術の完成を明らかにする試験と、その理由へ進まなければならない。
  notes:
  - 186頁24行は巻末正誤表に従い prosequentes intentum とした。
  source_printed_page: 186
  source_pdf_page: 206
  source_erara_pdf_page: 211

- id: geber-summa-b01-c053-002
  section_id: geber-summa
  book: 1
  chapter: 53
  kind: body
  source_la: Ingenium vero coagulationis illius cogitaverunt quidam fore per conservationem illius in
    ignis temperamento. Qui cum illud putassent se coagulasse, post remotionem eius ab igne, invenerunt
    illud fluere sicut prius. Per hoc igitur in stuporem et in admirationem adducti sunt, vehementer arguentes,
    ad hoc perveniri non posse. Alii vero, necessario ex principiis naturalibus supponentes, humidum quodlibet
    ab ignis calore in siccitatem converti, conati sunt cum perseverantiae instantia continuare illius
    conservationem in igne, et per hanc continuationem ad hoc devenerunt, ut ex eis aliqui in album, aliqui
    vero in rubeum converterent lapidem, aliqui vero in citrinum, cui non fuit fusio nec ingressio. Et
    harum diversitatum causam non potuerunt aestimare, ideoque illud abiecerunt.
  translation_ja: ある者たちは、水銀を凝結させる工夫とは、加減した火の中に保つことだと考えた。ところが、凝結させたと思って火から取り出すと、以前と同じように流れることが分かった。そこで呆然とし、驚き、これは達成できないと強く主張した。他の者たちは、自然の原理から、どのような湿りも、火の熱によって必ず乾きへ変わると考え、忍耐強く力を尽くして、水銀を火の中に保ち続けようとした。その継続によって、ある者は白い石へ、別の者は赤い石へ、さらに別の者は黄色い石へと変えるに至った。しかし、それらには溶融性も浸透性もなかった。彼らは、こうした相違の原因を理解できず、その作業を放棄した。
  notes:
  - 巻末正誤表（115頁24行）に従い、本文の converterunt を converterent に訂正した。
  source_printed_page: 115
  source_pdf_page: 135
  source_erara_pdf_page: 140
- id: geber-summa-b01-c053-003
  section_id: geber-summa
  book: 1
  chapter: 53
  kind: body
  source_la: Alii vero cum medicinis illud coagulare conati sunt, et ad hoc non pervenerunt, sed accidit
    eis illusio, aut quia non coagulaverunt, aut quia insensibiliter extenuatum est, aut coagulatio eorum
    non fuit in forma alicuius corporis. Et horum diversitatis causam ignoraverunt. Alii medicinas artificiosas
    componentes, illud in proiectione coagulaverunt. Sed eorum non fuit coagulatio utilis, quoniam ad
    imperfectum corpus illud converterunt. Et causam huius similiter videre non potuerunt. Horum igitur
    nos narrare causas expedit ut ad coagulationis illius magisterium artifex perveniat.
  translation_ja: また別の者たちは、薬を使って水銀を凝結させようとしたが、達成できず、期待を裏切られた。凝結しなかったり、気づかぬうちに量が減ったり、凝結しても、いずれの金属体の形にもならなかったりしたのである。彼らは、これらの相違の原因を知らなかった。別の者たちは、技巧を凝らした薬を調合し、投射によって水銀を凝結させた。しかし、それを不完全な金属体へ変えたので、その凝結は有益ではなかった。この原因も、彼らには同様に分からなかった。そこで、術者が水銀の凝結の術に達するため、私たちはこれらの原因を述べる必要がある。
  notes: []
  source_printed_pages:
  - 115
  - 116
  source_pdf_pages:
  - 135
  - 136
  source_erara_pdf_pages:
  - 140
  - 141
- id: geber-summa-b01-c053-004
  section_id: geber-summa
  book: 1
  chapter: 53
  kind: body
  source_la: Ut autem iam a nobis sufficienter narratum est, uniformis est substantia argenti vivi. Quare
    non est possibile in brevi spatio temporis per conservationem illius in igne, aqueitatem removere
    illius. Nimia igitur festinatio, causa fuit primi erroris. Cum vero subtilis sit substantiae, ab igne
    recedit. Ignis igitur excessus, est causa erroris illorum, quibus fugit. Commiscetur cum sulphure,
    arsenico, et marchesita de facili, propter communitatem in natura sua. Ideoque per illa apparet coagulatum
    non in forma corporis, sed argenti vivi cum plumbo mixti. Non enim haec cum fugitiva sint, possunt
    illud in ignis pugna tenere, quousque ad corporis naturam perveniat. Sed fugiunt cum eo per ignis
    incussionem, et ideo illud est causa erroris eorum, qui sic coagulant.
  translation_ja: すでに私たちが十分に述べたように、水銀の実体は均一である。したがって、短時間、火の中に保つだけで、その水性を取り除くことはできない。最初の誤りの原因は、急ぎすぎることであった。他方、水銀は微細な実体であるため、火から退いて逃げる。ゆえに、水銀を逃がした者たちの誤りの原因は、火が過度であることにある。水銀は、本性に共通するものがあるため、硫黄、砒素性物質、マルカシータと容易に混ざる。それゆえ、これらによって凝結したように見えても、金属体の形にはならず、鉛を混ぜた水銀の形になる。これらは逃散性であるため、水銀が金属体の本性へ達するまで、火との闘いの中にそれを保持できない。むしろ、火の衝撃によって、水銀と一緒に逃げるのである。これが、そのように凝結させる者たちの誤りの原因である。
  notes:
  - マルカシータ（marchesita）などの鉱物名は、近代の化学組成を一義的に割り当てず、歴史的名称として保った。
  source_printed_page: 116
  source_pdf_page: 136
  source_erara_pdf_page: 141
- id: geber-summa-b01-c053-005
  section_id: geber-summa
  book: 1
  chapter: 53
  kind: body
  source_la: Habet similiter argentum vivum humiditatem multam sibi unitam, quam ab illo separari non
    est possibile, nisi per ignis cautam violentiam, per conservationem eius in suo igne. Et est suus
    ignis, quem illi augmentando, secundum exigentiam suae tolerantiae, illius humiditatem tollunt, non
    relicta sibi parte ad fusionem metallicam sufficiente, qua remota non funditur. Et haec est causa
    erroris illorum, qui in lapidem illud coagulant non fusibilem.
  translation_ja: 同様に、水銀には多くの湿りが結びついている。それは、水銀をそれに適した火の中に保ち、注意深く火の強い作用を加える以外には分離できない。この適した火を、水銀が耐えられる程度に応じて強めていくと、彼らは、その湿りを取り去り、金属として溶融するのに十分な部分を残さない。湿りが取り去られると、それは溶けなくなる。これが、水銀を溶けない石へ凝結させる者たちの誤りの原因である。
  notes: []
  source_printed_pages:
  - 116
  - 117
  source_pdf_pages:
  - 136
  - 137
  source_erara_pdf_pages:
  - 141
  - 142
- id: geber-summa-b01-c053-006
  section_id: geber-summa
  book: 1
  chapter: 53
  kind: body
  source_la: Habet similiter partes sulphuris naturaliter sibi admixtas, quoddam tamen plus, quoddam vero
    minus, quod removere per artificium contingit esse possibile. Cum igitur sit sulphuris proprietas,
    cum argento vivo rubeum vel citrinum colorem (secundum mensuram suae quantitatis) creare, eius ablatione
    proprietas argenti vivi erit, albedinem dare per ignem. Haec igitur est causa varietatis colorum illius
    post coagulationem eius in lapidem. Habet similiter terreitatem sulphuris admixtam, qua quidem infici
    omnes suas coagulationes necesse est. Et haec est causa erroris illorum, qui illud in corpus imperfectum
    coagulant.
  translation_ja: 同様に、水銀には硫黄の部分が自然に混じっている。ただし、多く含むものと、少なく含むものがあり、技術によって、それを取り除くことは可能である。硫黄には、水銀とともに、その分量に応じて赤色または黄色を生じる性質がある。したがって、硫黄を除いたときの水銀の性質は、火によって白さを示すことである。これが、水銀を石へ凝結させた後、その色がさまざまになる原因である。同様に、水銀には硫黄の土性も混じっており、その凝結物はすべて、この土性によって汚されるはずである。これが、水銀を不完全な金属体へ凝結させる者たちの誤りの原因である。
  notes: []
  source_printed_page: 117
  source_pdf_page: 137
  source_erara_pdf_page: 142
- id: geber-summa-b01-c053-007
  section_id: geber-summa
  book: 1
  chapter: 53
  kind: body
  source_la: Ex diversitate igitur medicinarum illius coagulationis accidit, diversa in coagulatione illius
    creari corpora, et ex diversitate illius similiter quod coagulandum est. Nam si medicina, vel illud,
    habuerint sulphur non fixum, necesse est corpus molle ex illo creari. Si vero fixum, necesse est durum.
    Et si album, album. Si vero rubeum, rubeum. Et si remissum ab albo vel rubeo, remissum similiter necesse
    est fieri. Et si terreum, imperfectum. Si vero non, non. Et omne similiter non fixum, lividum creat,
    fixum vero non, quantum in illo est. Pura vero illius substantia purum creat corpus, non pura vero
    e contra. Accidit autem et similiter in solo argento vivo, absque sulphuris commixtione, diversitas
    eadem propter diversitatem mundationis, et praeparationis illius in medicinis. Ideoque contingit ex
    parte medicinae diversitatis illusio, ut quandoque in coagulatione illius plumbum, quandoque vero
    Iuppiter, quandoque autem Venus, et quandoque Mars fiat, quod propter impuritatem accidit. Quandoque
    vero Sol, quandoque Luna, quod ex puritate venire necesse est, et consideratione coloris.
  translation_ja: したがって、水銀を凝結させる薬の違いによって、また凝結させる水銀そのものの違いによっても、その凝結の際に、異なる金属体が生じる。薬または水銀が、固定されていない硫黄を含めば、それから柔らかい金属体が生じるはずであり、固定された硫黄を含めば、硬い金属体が生じるはずである。白ければ白いものが、赤ければ赤いものが生じる。白色または赤色が弱ければ、同様に弱い色のものが生じるはずである。土性であれば不完全なものとなり、そうでなければ、そうはならない。同様に、固定されていない物はどれも青黒い色を生じるが、固定された物は、それ自体の働きに関するかぎり、青黒い色を生じない。純粋な実体は純粋な金属体を生じ、不純な実体はその反対を生じる。硫黄を混ぜない水銀だけの場合にも、薬へとする際の浄化と調製の相違によって、同じ違いが生じる。したがって、薬の側の相違によって、期待を裏切る結果が起こる。水銀を凝結させると、ときには鉛、ときにはユピテル、ときにはウェヌス、ときにはマルスとなるが、これは不純さのためである。他方、ときには太陽、ときには月となる。これは純粋さと、色への配慮から生じるはずである。
  notes:
  - 太陽（Sol）は金、月（Luna）は銀の錬金術的名称。条件文は原刊の省略的な表現を保って訳した。
  source_printed_pages:
  - 117
  - 118
  source_pdf_pages:
  - 137
  - 138
  source_erara_pdf_pages:
  - 142
  - 143
- id: geber-summa-b01-c053-008
  section_id: geber-summa
  book: 1
  chapter: 53
  kind: body
  source_la: Coagulatur igitur ex frequenti illius praecipitatione cum violentia ad ignis asperitatem.
    Asperitas enim ignis aqueitatem illius de facili removet. Hoc enim fit per vas, cuius figura sit multae
    longitudinis, in quo inveniat loci refrigerii, adhaerentiae, et quietis in eius spondilibus, propter
    suam longitudinem, et non fugae viam, quousque iterata vice ad illius fundum praecipitetur multa caliditate
    ignitionis, cum reiteratione multa, quousque fiat fixum. Coagulatur similiter ex diuturna retentione
    in suo igne, in vase vitreo, cuius collum sit multae longitudinis, et in ventre figuram ampullae habeat,
    cum continua colli eius apertione, ut per illam possit humiditas eius evanescere.
  translation_ja: したがって、水銀は、厳しい火の中へ強く何度も落とすことで凝結する。火の厳しさは、その水性を容易に取り除くからである。この操作は、非常に長い形の容器で行う。その長さのため、水銀は容器の壁に冷却、付着、静止の場所を見いだし、逃げ道を見いださないようにする。そして、強い加熱のもと、再び容器の底へ落とし、固定されるまで何度も繰り返す。また、水銀に適した火の中に長時間保つことによっても凝結する。その際は、首が非常に長く、胴が瓶の形をしたガラス容器を使い、首を絶えず開けておき、そこから湿りが消え去ることができるようにする。
  notes:
  - praecipitatio はここでは上昇・付着した物を下へ落とす操作であり、現代化学の溶液からの「沈殿」に限定しない。
  source_printed_page: 118
  source_pdf_page: 138
  source_erara_pdf_page: 143
- id: geber-summa-b01-c053-009
  section_id: geber-summa
  book: 1
  chapter: 53
  kind: body
  source_la: Coagulatur vero per medicinam illi convenientem. Et nos illam tibi narrabimus in sequentibus
    apertius. Hic vero similiter, ut intentionem nostram super illo narremus completam, secundum quod
    per nostrum invenimus experimentum. Et est medicina illius, quae maxime illi in profundo eius adhaeret,
    et ei per minima commiscetur ante illius fugam. Ex rebus ergo ei convenientibus, necesse est illam
    colligere. Sunt autem huiusmodi corpora omnia, et sulphur, et arsenicum. Sed quia non videmus corporum
    aliquod in natura sua illud coagulare, sed ab eis ipsum fugere, quantumcunque fuerint suae convenientiae,
    ideoque consideravimus, nullum corpus illi in profundo adhaerere. Subtilioris ergo substantiae et
    liquidioris fusionis necesse est medicinam illam esse, quam ipsa corpora. Ex spiritibus etiam non
    videmus, illis in natura sua manentibus, firmam et stabilem coagulationem fieri illius, sed fugitivam,
    et multae infectionis. Quod quidem contingit, alterum propter spirituum fugam, alterum vero ex terreae
    et adustibilis substantiae illorum commixtione.
  translation_ja: また、水銀に適合する薬によっても凝結する。その薬については、後であなたにいっそう明らかに述べよう。ここでも、私たち自身の実験によって見いだしたところに従い、この件に関する考えを十分に述べておく。その薬とは、水銀の奥深くにきわめてよく付着し、水銀が逃げる前に、その最小の部分にまで混じり合うものである。したがって、水銀に適合する物から、その薬を集めなければならない。それに当たるものは、あらゆる金属体、硫黄、砒素性物質である。しかし、どの金属体も、その本来の状態で水銀を凝結させることはなく、どれほど水銀と親和性があっても、水銀がそれらから逃げるのが見られる。したがって、私たちは、どの金属体も水銀の奥深くには付着しないと考えた。ゆえに、その薬は、金属体そのものより微細な実体をもち、いっそう流動的に溶融するものでなければならない。また、精気が本来の状態にあるかぎり、それらによって水銀に堅固で安定した凝結が生じることもなく、逃散性で、非常に汚れた凝結しか生じない。一方の原因は精気が逃げることであり、もう一方の原因は、それらの土性で焼損しやすい実体が混じることである。
  notes: []
  source_printed_pages:
  - 118
  - 119
  source_pdf_pages:
  - 138
  - 139
  source_erara_pdf_pages:
  - 143
  - 144
- id: geber-summa-b01-c053-010
  section_id: geber-summa
  book: 1
  chapter: 53
  kind: body
  source_la: Ideoque ex hoc manifeste relinquitur, ex quacunque re medicina illius eliciatur, ipsam necessario
    debere esse subtilissimae et purissimae substantiae, illi adhaerentis ex natura sua, et facillimae
    liquefactionis, et tenuissimae ad modum aquae, et fixae super ignis pugnam. Haec enim ipsum coagulabit,
    et in naturam solarem vel lunarem convertet. Modos ingeniorum medicinae tibi dedimus, ad quam per
    illos pervenire potes, et ipsam sermone sibi proprio determinavimus. Sollicite igitur ad illam exerciteris,
    et eam invenies. Sed ut nos non increpare possis ex eius insufficientia, dicimus quod ex ipsis corporibus
    metallicis cum suo sulphure vel arsenico praeparatis, haec medicina elicitur, similiter ex solo sulphure,
    vel arsenico praeparatis, et ex solis similiter corporibus elici potest. Ex solo vero vivo argento
    facilius, et propinquius, et perfectius invenitur. Quoniam natura propriam naturam amplectitur amicabilius,
    et ea gaudet magis, quam extranea. Et est in ipso facilitas extractionis illius substantiae subtilis,
    cum iam in actu subtilem habeat substantiam.
  translation_ja: したがって、ここから明らかになるのは、何から水銀の薬を取り出すにしても、その薬は、きわめて微細で純粋な実体をもち、本性によって水銀に付着し、きわめて容易に液化し、水のようにきわめて薄く流れ、火との闘いにも固定されている必要があるということである。このような薬は、水銀を凝結させ、太陽または月の本性へ変えるであろう。私たちは、あなたがその薬へ到達するための工夫の方法を示し、その薬を、それに固有の説明の中で定めた。ゆえに、注意深くそれを目指して実習すれば、見いだすであろう。しかし、説明が不十分だと私たちを責めることができないように、こう言っておく。この薬は、硫黄または砒素性物質とともに調製した金属体そのものから取り出される。同様に、調製した硫黄だけ、または砒素性物質だけからも、また金属体だけからも取り出せる。しかし、水銀だけからなら、いっそう容易に、いっそう直接に、いっそう完全に見いだされる。自然は、異質な本性より、自らと同じ本性を親しく抱き、いっそう喜ぶからである。また、水銀はすでに現実に微細な実体をもつため、その微細な実体を取り出すことも容易である。
  notes: []
  source_printed_pages:
  - 119
  - 120
  source_pdf_pages:
  - 139
  - 140
  source_erara_pdf_pages:
  - 144
  - 145
- id: geber-summa-b01-c053-011
  section_id: geber-summa
  book: 1
  chapter: 53
  kind: body
  source_la: Modi vero inventionis huius medicinae sunt per sublimationem, ut a nobis narratum est sufficienter.
    Modus vero fixionis illius in capitulo suo similiter narratus est. Coagulationis vero solutorum modus
    est, per ampullam in cineribus usque ad collum cum temperato igne, quousque aqueitas evanescat. Descriptio
    vero longorum vasorum, et eorum in quibus fit omnis coagulatio haec est.
  translation_ja: この薬を得る方法は、私たちが十分に述べたように、昇華による。その固定の方法も、それを扱う章で同様に述べられている。溶解した物を凝結させる方法は、瓶を首まで灰に埋め、加減した火を用い、水性が消え去るまで加熱するというものである。長い容器と、あらゆる凝結を行う容器の図は、次のとおりである。

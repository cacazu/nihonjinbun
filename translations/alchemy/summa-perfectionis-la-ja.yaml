- id: geber-summa-b01-c011-006
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: Si autem aliter arguant, quod non mutetur species in speciem. Dicimus eos mentiri iterum,
    sicut consueverunt potius, quam verum dicere super his, quoniam et species mutatur in speciem, secundum
    hanc viam, cum individuum speciei unius in alterius mutatur speciei. Videmus nanque vermem, et naturaliter,
    et per artificium naturale, in muscam verti, quae ab eo differt specie, et vitulum strangulatum in
    apes, et frumentum in lolium, et canem strangulatum in vermes per ebulitionis putrefactionem. Sed
    hoc non facimus nos, facit autem natura, cui administramus. Similiter et metalla non mutamus, sed
    natura, cui secundum artificium illam materiam praeparamus, quia ipsa per se agit, non nos. Nos vero
    administratores illius sumus.
  translation_ja: もし別の仕方で、一つの種は他の種に変わらないと論じるなら、私たちは、彼らはまたも虚偽を述べている、と言う。これらのことについて真理を語るより、そうするのが彼らの常だからである。ある種の個体が別の種の個体に変わるとき、その道筋において種は種へ変わる。私たちは、虫が自然にも、自然に従う技によっても、それとは種を異にする蝿へ変わるのを見る。また、窒息させた子牛が蜂に、穀物がドクムギに、窒息させた犬が沸き立つような腐敗によって虫へ変わるのを見る。しかし、これを行うのは私たちではなく、私たちが奉仕する自然である。同じように、金属を変えるのも私たちではなく、自然である。私たちはそのために、技に従って材料を調製する。作用するのは自然そのものであり、私たちではない。私たちは、その奉仕者なのである。
  notes:
  - 本段の動物・植物の変化には、歴史的な自然発生説と現代では否定される説明が含まれる。動物を傷つける実践を勧めるものではない。
  source_printed_page: 39
  source_pdf_page: 61
  source_erara_pdf_page: 66
- id: geber-summa-b01-c011-007
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: Et, si per aliam rationem similiter taliter arguunt, et suam corroborant sophistice opinionem,
    quod in millibus annorum natura metalla perficit, tu vero millibus perdurare non potes. Dicimus quod
    natura super principia sua secundum opinionem antiquorum philosophorum agens perficit in millibus
    annorum, sed quia principia illa sequi non valemus, ideoque sive in millibus annorum, sive in pluribus,
    sive in paucioribus, vel momento, haec natura perficiat, non tenet illorum persuasio. Quod autem in
    principiis imitari naturam non possumus, iam ex praecedenti negativo sermone satis abbreviato determinavimus,
    et completiore sermone in subsequentibus demonstrabimus. Secundum tamen opinionem aliquorum prudentium
    et perspicacium, intentum suum subito natura perficit, scilicet una die, vel breviori tempore. Et
    si hoc verum sit, non tamen valemus in principiis naturam imitari, id quod manifestius ostensione
    sufficiente probavimus, residuum tamen huius quaestionis confitemur, quia totum verum concedimus esse.
  translation_ja: また別の論拠によって、自然は数千年で金属を完成させるが、人は数千年生き続けられない、と同じように論じ、詭弁で自説を補強するなら、私たちはこう言う。古代の哲学者の見解によれば、自然は自らの原理に働きかけ、数千年で完成させる。しかし私たちは、それらの原理に従うことはできない。だから、自然が数千年、さらに多くの年、より少ない年、あるいは一瞬で完成させるとしても、彼らの主張は成り立たない。原理において自然を模倣できないことは、前の否定的な説明で十分簡潔に定めたし、後ではさらに詳しく論証する。ただし、分別と洞察に富むある人々の見解によれば、自然は目的を突然、すなわち一日か、それより短い時間で完成させる。これが真実であっても、私たちは原理において自然を模倣できない。このことは十分な説明によって明瞭に証明した。しかし、この問いの残りの部分は認める。そこに述べられたことはすべて真実だと認めるからである。
  notes: *id003
  source_printed_pages:
  - 39
  - 40

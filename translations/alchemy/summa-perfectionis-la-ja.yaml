- id: geber-summa-b01-c011-002
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: Si dixerint etiam philosophos et Principes huius mundi hanc desiderasse scientiam, et ipsam
    non invenisse. Respondemus, eos mentiri, quoniam et quosdam Principes (licet paucos) et maxime antiquos,
    et sapientes, nostro tempore repertos, iam ex sua industria hanc constat indagasse scientiam, sed
    talibus, nec ore, nec scripturis eam tradere voluerunt, cum indigni sint eius. Ergo cum non viderunt
    aliquos hanc scientiam possidere, cecidit super mentes illorum error, ut aestiment nullos hanc invenisse.
  translation_ja: もし、この世の哲学者や君主たちはこの学知を望んだが、発見できなかった、と言うなら、私たちは、彼らは虚偽を述べている、と答える。少数ながら、とくに古代の君主の一部や、私たちの時代にも見いだされる賢者が、自らの工夫によって、すでにこの学知を探り当てたことは明らかだからである。ただし、そうした批判者たちはそれに値しないため、口頭でも書面でも伝えようとしなかった。それゆえ彼らは、この学知を持つ者を見なかったことから、誰も発見しなかったと考える誤りに陥ったのである。
  notes: *id003
  source_printed_page: 37
  source_pdf_page: 59
  source_erara_pdf_page: 64
- id: geber-summa-b01-c011-003
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: 'Ad hoc etiam si arguant fantastice, asserentes impotentiam nostram non posse saltem in debilibus
    mixtionibus naturam imitari, sicut in mixtione asini vel bovis, ergo nec in fortibus: detegimus eis
    errorem suum multiplicem, quod in arguendi modo non cadat necessitas, qua coartemur artem nostram
    non esse concedere, quia a simili, vel a maiori ad minus, suam corroborant fantasiam et errorem, in
    quibus non continetur necessitas, sed contingentia, ut in pluribus. Ostendemus quoque per aliam viam,
    demonstrando illos nullam assignare apparentem similitudinem, inter debilem commixtionem, et compositionem
    animalium, et mineralium firmam et fortem.'
  translation_ja: さらに、空想的な議論によって、私たちはロバや牛の混合のような弱い結合においてさえ自然を模倣できないのだから、強い結合ではなおさらできない、と主張するなら、その多重の誤りを示そう。この論証方法には、私たちに術の否定を強いる必然性がない。彼らは類似、あるいは大から小への推論によって、自らの空想と誤りを補強しているが、そこに含まれるのは必然性ではなく、多くの場合そうなるという偶然的な関係だからである。また別の仕方でも示そう。彼らは、動物の弱い混合・組成と、鉱物の堅固で強い組成の間に、見かけ上でさえ成り立つ類似を何も示していないのである。
  notes:
  - 原刊正誤表（37頁・15行）に従い、「Ad hoc etiam」と読む。
  - 原刊正誤表（37頁・19行）に従い、「esse」を削除した。
  - 原刊正誤表（37頁・20行）に従い、「artem nostram non esse concedere」と読む。
  source_printed_page: 37
  source_pdf_page: 59
  source_erara_pdf_page: 64
- id: geber-summa-b01-c011-004
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: Et hoc ideo, quia in animalibus et aliis viventibus, in quibus compositio est debilis, non
    est perficiens solum proportio, nec miscibilia proportionis, nec qualitates miscibilium, nec commixtio,
    quae sequitur ex illarum actione adinvicem et passione, quae est ex aggregatione illarum primarum
    qualitatum, sed est anima secundum opinionem plurium, quae est ex occultis naturae, sicut ab essentia
    quinta, vel a primo motore, et hoc etiam secundum sententiam plurium dicimus, et huius occultum ignoramus.
    Ideo haec talia licet in eis sit debilis mixtio, perficere nescimus, quia perfectivum, quod est anima,
    infundere ignoramus.
  translation_ja: その理由はこうである。組成の弱い動物やその他の生物を完成させるのは、比率だけでも、その比率に従う混合成分だけでも、その成分の性質だけでも、また、それらの第一の性質の集まりから生じる相互作用と受容に続く混合だけでもない。多くの人々の見解によれば、それは魂である。魂は、第五の実体、あるいは第一動者に由来するような、自然の隠されたものに属する。これも多くの人々の見解に従って述べるのであり、その秘密を私たちは知らない。したがって、そうしたものは混合の結びつきが弱くても、私たちは完成させる方法を知らない。完成をもたらす魂を注ぎ込む方法を知らないからである。
  notes: *id003
  source_printed_pages:
  - 37
  - 38
  source_pdf_pages:
  - 59
  - 60
  source_erara_pdf_pages:
  - 64
  - 65
- id: geber-summa-b01-c011-005
  section_id: geber-summa
  book: 1
  chapter: 11
  kind: body
  source_la: 'Per hoc utique patet, quod non est defectus ex parte mixtionis, quod non perficiamus bovem
    vel capram, sed ex defectu infusionis animae: quoniam sicut debilem et magis debilem, sic etiam fortem
    et magis fortem compositionem facere, viam et cursum naturalem imitantes, secundum artificium nostrum
    sciremus. In metallis igitur perfectio minor est, quam in eis, et versatur illorum perfectio magis
    circa proportionem et compositionem, quam circa aliud. Ideo cum in eis minor sit perfectio, quam in
    aliis, quae iam narravimus, liberius ipsa perficere possumus, illa vero non. Diversificavit ergo Deus
    altissimus et gloriosus perfectiones ab invicem multiformiter. Nam in quibus compositio, quae est
    secundum naturam fuit debilis, in illis maiorem et nobiliorem perfectionem posuit, scilicet eam, quae
    est secundum animam. Sed quaedam fortioris condidit compositionis et firmioris, sicut lapides et mineralia,
    sed in eis posuit minorem perfectionem et ignobiliorem, et quae est ex mixtionis modo. Patet itaque,
    quod non est eorum similitudo bona, quia non ignoramus bovem vel capram formare ratione compositionis,
    sed formae perfectivae, quoniam perfectio in bove vel in capra nobilior est, et magis occultata, quam
    quae in metallo consistit.'
  translation_ja: このことから明らかなように、私たちが牛や山羊を完成させられないのは、混合の側の不足ではなく、魂を注ぎ込めないためである。弱い、あるいはさらに弱い組成を作るのと同様に、強い、あるいはいっそう強い組成を作ることも、自然の道筋と過程を模倣する私たちの技によって、知り得るからである。金属における完全性は、生物におけるものより低い。金属の完全性は、他のことよりも比率と組成に関わる。それゆえ、すでに述べた他のものより完全性が低い金属は、私たちにも比較的容易に完成させられるが、生物はそうではない。至高で栄光ある神は、完全性を相互にさまざまな形で区別した。自然による組成が弱いものには、より大きく高貴な完全性、すなわち魂による完全性を置いた。他方、石や鉱物のように、より強く堅固な組成のものも作ったが、それらには、混合の仕方から生じる、より小さく低い完全性を置いた。したがって、彼らの類比が適切でないことは明らかである。私たちが牛や山羊を作れないのは、組成のためではなく、完成を与える形相のためだからである。牛や山羊の完全性は、金属の完全性よりも高貴であり、いっそう隠されているのである。
  notes:
  - 原刊正誤表（38頁・12行）に従い、「Per hoc utique patet, quod non」と読む。
  source_printed_pages:

- id: geber-summa-b02-c077-004
  section_id: geber-summa
  book: 2
  chapter: 77
  kind: body
  source_la: 'Dealbatur vero per arsenicum sublimatum: ut si accipiatur calcinatio Veneris, et super illam
    iteretur eiusdem sublimatio, quousque cum eo maneat, et illam dealbet. Sed nisi exercueris teipsum
    cum modis sublimationum, non perseverabit in ea arsenicum alteratione aliqua. Et est scilicet, ut
    post primum sublimationis gradum secundario reiteres, quem narravimus in marchefitae sublimatione.
    Dealbatur vero et aliter, ut sublimatum arsenicum in Lunam proiicias: dehinc vero hoc totum super
    Venerem, dealbat enim peculiose. Aut commisce prius litargirium, vel plumbum ustum solutum cum Luna:
    deinde vero super hoc arsenicum superiactes, et hoc totum super Venerem proiectum dealbat, et est
    primi ordinis bona dealbatio. Aut solum super litargirium solutum et reductum, proiiciatur arsenicum
    sublimatum, et hoc totum super Veneris fusionem, quoniam dealbat eam cum curialitatis aspectu.'
  translation_ja: また、昇華した砒素によっても白くなる。銅の焼成物を取り、その上で砒素の昇華を繰り返し、砒素が銅とともに残って、これを白くするまで続ける。ただし、昇華の諸方法に熟練していなければ、砒素はいかなる変成状態でも銅の中に持続しない。つまり、昇華の第一段階の後、マルカサイトの昇華について説明した第二段階を繰り返すのである。別法では、昇華した砒素を銀へ投じ、それからその全体を銅へ投じる。これは有益な白化をもたらす。また、まず密陀僧、あるいは焼いて溶解した鉛を銀に混ぜ、その上に砒素を投じてもよい。その全体を銅へ投じれば白くなり、これは第一位の優れた白化法である。あるいは、溶解して還元した密陀僧だけに昇華砒素を投じ、その全体を溶融銅に加える。それは銅を、優美な外観をもって白くするからである。
  notes: []
  source_printed_page: 170
  source_pdf_page: 190
  source_erara_pdf_page: 195
- id: geber-summa-b02-c077-005
  section_id: geber-summa
  book: 2
  chapter: 77
  kind: body
  source_la: 'Aut commisceantur Luna et Venus, et super has proiiciatur omnis medicina dealbativa. Luna
    etenim amica est arsenici magis quam corporum aliquod, et ideo fractionem ab eo tollit. Secundario
    vero Saturnus, et ideo cum illis eum commiscemus. Aliter autem Arsenicum fundimus sublimatum, quousque
    fiant frusta: deinde vero frustum post frustum super Venerem proiicimus. Iubemus etenim in frustis
    potius quam in pulvere proiici, quoniam facilius inflammatur pulvis quam frustum: et ideo facilius
    evanescit quam frustum, et consumitur prius quam super corpus cadat ignitum.'
  translation_ja: あるいは、銀と銅とを混ぜ、その上に白化する薬を投じる。銀は、どの金属体よりも砒素と親和するので、砒素による脆さを取り除く。次に親和するのは鉛であるから、私たちはそれをこれらに混ぜる。また別法として、昇華した砒素を溶かして塊にし、一塊ずつ銅へ投じる。粉末より塊で投じるよう勧めるのは、粉末のほうが塊より燃えやすく、したがって消えやすく、赤熱した金属体に落ちるより先に消耗してしまうからである。
  notes: []
  source_printed_pages:
  - 170
  - 171
  source_pdf_pages:
  - 190
  - 191
  source_erara_pdf_pages:
  - 195
  - 196
- id: geber-summa-b02-c077-006
  section_id: geber-summa
  book: 2
  chapter: 77
  kind: body
  source_la: 'Tollitur autem et aliter rubedo illius cum tutia videlicet, et dealbatur. Sed quia Tutiae
    dealbatio non sufficit, ideo solum citrinat. Et citrinatio quaelibet albedini est affinis. Et est
    modus huius scilicet, ut solvatur et calcinetur omne genus Tutiae, deinde vero Venus: et hae ambae
    coniungantur solutiones, et cum his citrinetur Veneris substantia, et cum Tutia si exercueris, proficuum
    invenies. Dealbatur vero per sublimatam Marchefitam, quemadmodum cum sublimato Argento vivo, et est
    modus idem.'
  translation_ja: さらに別法として、トゥティアによって銅の赤みを取り除き、白くする。しかしトゥティアの白化力は十分ではなく、黄色くするだけである。とはいえ、あらゆる黄化は白さに近縁である。その方法は、いずれの種類のトゥティアでも、溶解し、焼成し、次いで銅も同様に処理する。この二つの溶液を合わせ、それらで銅の実体を黄色くする。トゥティアを使って習熟すれば、その有用さを見いだすだろう。また、昇華水銀の場合と同じように、昇華したマルカサイトによっても白くなる。方法は同一である。
  notes: []
  source_printed_page: 171
  source_pdf_page: 191
  source_erara_pdf_page: 196
- id: geber-summa-b02-c078-title
  section_id: geber-summa
  book: 2
  chapter: 78
  kind: heading
  source_la: De medicinis Martem dealbantibus. Cap. LXXVIII.
  translation_ja: 第78章　鉄を白くする薬について。
  notes: []
  source_printed_page: 171
  source_pdf_page: 191
  source_erara_pdf_page: 196
- id: geber-summa-b02-c078-001
  section_id: geber-summa
  book: 2
  chapter: 78
  kind: body
  source_la: Restat ergo, et dealbationes Martis ex medicinis sibi propriis creatas narrare, quae sunt
    secundum essentiam primi ordinis, secundum quem fusionem non habet rectam, ideo expedit nos cum medicina
    fundente illam dealbare. Est igitur omnis medicina Veneris dealbativa, et Martis similiter, cum eiusdem
    ordinis praeparatione. Sed fusiva illius specialis, est Arsenicum cuiuscunque generis. Cum quocunque
    igitur dealbatur et funditur, expedit quod cum Argento vivo coniungatur et lavetur, quousque omnis
    impuritas tollatur ab illo, et fiat album et fusibile, aut calefiat cum ignitionis vehementia, et
    super ipsum proiiciatur Arsenicum, et cum fusum fuerit super illum proiice Lunae quantitatem. Quia
    quando cum eo unitur, non separatur ab eo per leve artificium.
  translation_ja: 次に、鉄に固有の薬によって生じる白化を述べなければならない。これらは本質的に第一位のものである。鉄はこの段階では正しい溶融性をもたないから、溶かす薬によって白くする必要がある。銅を白くする薬は、同じ位の調製を施せば、どれも同様に鉄を白くする。ただし鉄に特有の融剤は、あらゆる種類の砒素である。したがって、どの砒素で白化し、溶融させるにせよ、水銀と合わせて洗い、すべての不純物を取り除き、白く溶けやすくするとよい。あるいは、激しい赤熱をもって加熱し、その上に砒素を投じ、溶けたら銀をある量投じる。銀は、一度鉄と結合すれば、容易な技法では分離しないからである。
  notes: []
  source_printed_pages:
  - 171
  - 172
  source_pdf_pages:
  - 191
  - 192
  source_erara_pdf_pages:
  - 196
  - 197
- id: geber-summa-b02-c078-002
  section_id: geber-summa
  book: 2
  chapter: 78
  kind: body
  source_la: Aut calcinetur et lavetur omnis ex ipso solubilis aluminositas, corruptionis infectionem
    adducens, per modum solutionis iam dictum. Dehinc vero ab illo sublimetur Arsenicum mundatum per sublimationem
    aliquam, et reiteretur multoties, quousque cum eo aliquid ex illo figatur. Dehinc vero cum solutione
    litargirii alterna vice imbibatur, commiscendo, et agitando, et assando alterna vice, et ultimo reducendo
    cum igne, quem docuimus in Iovis reductione a calce sua. Ex hac enim exibit albus, mundus, et fusibilis.
    Aut solum cum Arsenico sublimato in calce sua reducatur, et exibit albus, mundus, et fusibilis. Sed
    eandem artificem expedit adhibere cautelam, quemadmodum in Veneris reiteratione sublimationis ab ea
    Arsenici figentis se in illius profundo docuimus. Dealbatur et similiter per Marchefitam et Tutiam,
    cum ingenio et industria, quae tibi narravimus. Sed horum dealbatio aut mundatio non est sufficiens.
  translation_ja: あるいは、鉄を焼成し、すでに述べた溶解法によって、腐敗の汚染をもたらす可溶性の明礬質をすべて洗い去る。その後、何らかの昇華によって清めた砒素を鉄から昇華させ、幾度も繰り返し、砒素の一部が鉄とともに固定されるまで続ける。次いで、密陀僧の溶液を交互に含浸させ、混合し、攪拌し、交互に焙焼する。最後に、錫をその灰から還元する際に教えた火を用いて還元する。これによって、白く清らかで溶けやすい鉄が得られる。あるいは、灰の状態の鉄を、昇華した砒素だけとともに還元しても、白く清らかで溶けやすくなる。ただし、砒素が銅の深部に固定されるように、その銅から昇華を繰り返す際に教えたのと同じ注意を、術者は払うべきである。また、すでに述べた工夫と手際により、マルカサイトとトゥティアによっても同様に白くなる。しかし、これらによる白化または浄化は十分ではない。
  notes: []
  source_printed_page: 172
  source_pdf_page: 192
  source_erara_pdf_page: 197
- id: geber-summa-b02-c079-title
  section_id: geber-summa
  book: 2
  chapter: 79
  kind: heading
  source_la: De medicinis Lunam citrinantibus. Cap. LXXIX.
  translation_ja: 第79章　銀を黄色くする薬について。
  notes: []
  source_printed_page: 173
  source_pdf_page: 193
  source_erara_pdf_page: 198
- id: geber-summa-b02-c079-001
  section_id: geber-summa
  book: 2
  chapter: 79
  kind: body
  source_la: Prosequentes igitur praemissorum ordinem, Medicinam Lunae substantiam citrinantem in ordine
    primi generis narremus cum veritate certa. Et est scilicet medicina, quae eidem in profundo adhaeret,
    et adhaerendo colorat, sive per naturam propriam, sive per artificium huius magisterii. Narremus igitur
    medicinam, quae ex sua radice innata illi adhaeret. Deinde vero artificia, per quae facimus rem cuiuscunque
    generis adhaerere, cum ingressione firma. Elicimus autem illam aut ex Sulphure, aut ex Argento vivo,
    aut ex amborum commixtione. Sed per Sulphur diminute quidem magis, per Argentum vero vivum perfectius.
    Elicitur autem et similiter per quasdam res minerales, quae non sunt huius generis, quemadmodum est
    Vitriolum et cuperosa, quod et guma Cupri, aut eiusdem stillicidium nuncupatur. Afferamus igitur in
    proximis modos omnes medicinarum, quae ex Argento vivo consurgunt. Deinde vero quae ex Sulphure, aut
    ex amborum commixtione. Ultimo vero et eam quae ex guma Cupri, aut similium.
  translation_ja: 前述の順序に従い、第一の類に属し、銀の実体を黄色くする薬を、確実な真理とともに述べよう。それは、銀の深部に付着し、付着することによって、本来の性質から、またはこの秘術の技法によって、色を与える薬である。まず、その根に生来備わるものによって銀に付着する薬を述べ、次に、どんな種類の物でも、確実に浸入し付着するようにする技法を述べる。この薬は、硫黄、水銀、あるいは両者の混合物から取り出す。ただし、硫黄によるものはより不完全であり、水銀によるものはより完全である。また、これらの類に属さない鉱物、たとえば礬類や、銅の樹脂または滴出物とも呼ばれるクペローサからも、同様に取り出される。そこで、まず水銀から生じる薬のすべての方法、次に硫黄または両者の混合物から生じるもの、最後に銅の樹脂などから生じるものを述べよう。
  notes:
  - vitriolum・cuperosa・guma Cupri は当時の鉱物・薬材名であり、現代の単一化学物質へ断定的に置き換えていない。
  source_printed_page: 173
  source_pdf_page: 193
  source_erara_pdf_page: 198
- id: geber-summa-b02-c079-002
  section_id: geber-summa
  book: 2
  chapter: 79
  kind: body
  source_la: Est igitur modus eius quae per Argentum vivum fit talis. Sumatur praecipitatum, per praecipitationem
    mortificatum et fixum. Deinde vero ponatur in furnum magnae ignitionis, ad modum conservationis calcium,
    quem docuimus, donec rubescat in similitudinem usifur. Si vero non rubuerit, tolle Argenti vivi non
    mortificati partem, et cum Sulphure reitera sublimationem illius. Sit tamen Sulphur ab omni impuritate
    mundatum, et Argentum vivum similiter. Et postquam vigesies illius sublimationem reiteraveris super
    ipsum praecipitatum, illud dissolve cum aquarum acumine dissolvente, et iterato illud calcina, et
    iterato dissolve, donec exuberanter sufficiat. Post hoc Lunae partem dissolve, et cum soluta fuerit,
    solutiones commisce et coagula, et super Lunae fusionem proiicias. Citrinabit enim citrinitate multum
    peculiosa. Si vero Argentum vivum in praecipitatione rubuerit, ad proiectionem suae perfectionis,
    sufficit administratio dicta sine commixtione rei tingentis illud.
  translation_ja: 水銀による薬の方法は次のとおりである。沈降によって死滅させ、固定した沈降物を取る。次に、すでに教えた灰の保持法に従い、強く赤熱する炉に置き、ウシフルに似て赤くなるまで続ける。もし赤くならなければ、死滅させていない水銀を一部取り、硫黄とともにその昇華を繰り返す。ただし、硫黄も水銀も、あらゆる不純物から清めておく。この沈降物の上でその昇華を二十回繰り返したら、溶解力のある水の鋭さによってそれを溶解し、再び焼成し、再び溶解し、十分すぎるほどになるまで続ける。その後、銀を一部溶解する。溶けたら両溶液を混ぜ、凝固させ、溶融した銀へ投じる。非常に有益な黄色を与えるからである。水銀が沈降の際に赤くなっていたなら、それを着色する物を混ぜなくとも、述べた処置だけで、その完成した薬を投与するのに十分である。
  notes:
  - 174頁9行の重複する末尾の multum を巻末正誤表に従って削除した。usifur は原刊の歴史的薬材名を音写した。
  source_printed_pages:
  - 173
  - 174
  source_pdf_pages:
  - 193
  - 194
  source_erara_pdf_pages:
  - 198
  - 199
- id: geber-summa-b02-c079-003
  section_id: geber-summa
  book: 2
  chapter: 79
  kind: body
  source_la: Per Sulphur vero rubificatur, sed illius est rubificatio difficilis, et laboriosa immense.
    Citrinatur vero et Luna cum Martis solutione similiter. Ad hoc autem nos inducit operis necessitas,
    ut prius calcinemus illum et figamus, quod laboris est copia. Dehinc vero hac eadem praeparatione
    administremus, et eadem proiectione super Lunae substantiam infundamus. Et tamen non resultat eius
    citrinatio fulgens, imo fusca et livens, citrinitate mortifera.
  translation_ja: 硫黄によっても赤くなるが、その赤化は難しく、途方もない労苦を要する。同様に、鉄の溶液によっても銀は黄色くなる。しかしこの操作の必要から、まず鉄を焼成し固定しなければならず、それは大きな労働である。その後、同じ調製によって処置し、同じ投与法で銀の実体へ注ぐ。それでも、生じる黄色は輝かしくなく、むしろ暗く青黒く、生気のない黄色となる。
  notes: []
  source_printed_page: 174
  source_pdf_page: 194
  source_erara_pdf_page: 199
- id: geber-summa-b02-c079-004
  section_id: geber-summa
  book: 2
  chapter: 79
  kind: body
  source_la: 'Eius vero quae per Vitriolum aut cuperosam perficitur, citrinationis modus est talis. Tollatur
    illorum uniuscuiusque quantitas certa, et illius sublimetur pars quae sublimari potest, donec cum
    expressione sublimetur totali. Post hoc vero iterato quod sublimatum est, sublimetur cum modo ignis
    illi appropriati, ut ex eo figatur pars post partem, donec maior illius figatur pars. Postea vero
    calcinetur cum ignis cautelae intentione, ut possit illi maior ignis ad perfectionem administrari.
    Post hoc vero solvatur in aquam rubicundissimam, cui non est par. Dehinc vero ingenieris, ut illi
    ingressum in Lunare corpus exhibeas. Et haec ingenia tibi sufficienter monstrata sunt, si perfecti
    fueris operis exquisitor, quod scripsimus. Et quia res huius videmus Lunae profunde et amicabiliter
    adhaerere, consideravimus, et est certum, has esse de illorum radice: et ideo per illas alterari contingit.'
  translation_ja: 礬類またはクペローサによってなされる黄化の方法は次のとおりである。それぞれを一定量取り、昇華できる部分を、完全な駆出によってすべて昇華させる。その後、昇華物を、それに適した火の方法によって再び昇華させ、一部分ずつ固定させ、その大部分が固定されるまで続ける。次に、完成のためさらに強い火を加えられるよう、火に注意を払って焼成する。その後、比類のない鮮紅色の水に溶解する。続いて、それが銀の金属体へ浸入するように工夫せよ。私たちの書いた完全な操作を探究する者なら、その工夫はすでに十分示されている。この種の物が銀の深部に親和的に付着するのを見たので、私たちは考察し、これらが金属体の根に由来することを確実に知った。それゆえ、これらによって変成が起こるのである。
  notes: []
  source_printed_pages:
  - 174
  - 175
  source_pdf_pages:
  - 194
  - 195
  source_erara_pdf_pages:
  - 199
  - 200
- id: geber-summa-b02-c079-005
  section_id: geber-summa
  book: 2
  chapter: 79
  kind: body
  source_la: 'Hae utique sunt medicinae omnes primi ordinis quas attulimus. Possunt tamen illarum plures
    multiplicari modi, salva pigmentalium rerum in modorum varietatis essentia. Argenti quippe vivi non
    est medicina in hoc ordine primo, cum non sit medicina ipsum alterans unica differentia: imo in complemento
    totali omnino. Quidam vero plures invenerunt medicinas, sed unum ex duobus necessario evenire contingit.
    Quod aut ex eisdem, aut ex eandem naturam habentibus, illos medicinam creare necessarium est. Aut
    medicinam componunt, quae ei quod non est, aequipollet cum alteratione sua, et quae nec mundo confert,
    nec mundi partibus, donec motor in sublimi naturae mobili quieverit incorruptus.'
  translation_ja: 以上が、私たちの示した第一位の薬のすべてである。ただし、着色用物質の本質を保ちながら、方法の多様さによって、それらの手法をさらに増やすことはできる。水銀については、この第一位の薬はない。水銀をただ一つの特性において変える薬はなく、全面的な完成へと変えるものしかないからである。多くの薬を見いだした者もいるが、必然的に次の二つのいずれかになる。同じ物、あるいは同じ本性をもつ物から薬を作らなければならないか、さもなくば、その変成作用を含めて無に等しく、可動的自然の高みにある不滅の動者が静止する時まで、世界にもその諸部分にも何の益ももたらさない薬を作るのである。
  notes:
  - 末尾は天体運動をもたらす動者を引き合いに出す原文の表現を保持した。
  source_printed_page: 175
  source_pdf_page: 195
  source_erara_pdf_page: 200
- id: geber-summa-b02-c080-title
  section_id: geber-summa
  book: 2
  chapter: 80
  kind: heading
  source_la: De differentiis proprietatum medicinae secundi ordinis. Caput LXXX.
  translation_ja: 第80章　第二位の薬の特性の相違について。
  notes: []
  source_printed_page: 175
  source_pdf_page: 195
  source_erara_pdf_page: 200
- id: geber-summa-b02-c080-001
  section_id: geber-summa
  book: 2
  chapter: 80
  kind: body
  source_la: 'Restat igitur ad secundi ordinis medicinas transire, cum sermonis sui exigentiae sufficientia
    vera, et manifestis probationibus, cum experientia vera. Cum sit igitur medicina alia corporum mutandorum,
    alia vero argenti vivi perfecte coagulabilis: prius omnium medicinas corporum narremus complete. Dehinc
    vero ad ipsius eiusdem argenti vivi medicinam coagulabilis in Solificum Lunificumque verum. Est igitur
    secundi ordinis medicina, quae quidem imperfecta sola perfectionis unica differentia complet. Verum
    cum multae sint corruptionis causae in unoquoque imperfectorum corporum, videlicet in Saturno quidem
    sulphureitas volativa, et argenti vivi fuga, per quae corruptionem adduci necessario accidit, et illius
    terreitas. Fiat medicina, quae quidem alterum eorum aut ex toto tollat, aut palliando decoret, relictis
    solis aliis imperfectionis causis.'
  translation_ja: 次に第二位の薬へ移り、その主題に必要なことを真に十分に、明白な証明と確かな経験とともに述べよう。変成される金属体の薬と、完全に凝固させられる水銀の薬とは別であるから、まず金属体のあらゆる薬を十分に述べる。その後で、水銀そのものを真の金または銀へ凝固させる薬へ進む。第二位の薬は、不完全なものを、完成に属するただ一つの特性によって完成させる。しかし、各々の不完全な金属体には、多くの腐敗原因がある。たとえば鉛には、必然的に腐敗をもたらす揮発性の硫黄質と水銀の逃散、さらに土性がある。そこで、その一つを完全に除去するか、覆い隠して美しくし、ほかの不完全さの原因だけを残す薬を作るのである。
  notes: []
  source_printed_pages:
  - 175
  - 176
  source_pdf_pages:
  - 195
  - 196

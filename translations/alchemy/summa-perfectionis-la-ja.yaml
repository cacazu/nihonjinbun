- id: geber-summa-b01-c050-title
  section_id: geber-summa
  book: 1
  chapter: 50
  kind: heading
  source_la: De Distillatione et causis eius, ac de tribus eiusdem generibus, scilicet per alembicum,
    descensorium, et per filtrum. Cap. L.
  translation_ja: 第50章　蒸留とその原因、およびその三種、すなわちアランビック、下降器、濾布によるものについて。
  notes: []
  source_printed_page: 100
  source_pdf_page: 120
  source_erara_pdf_page: 125
- id: geber-summa-b01-c050-001
  section_id: geber-summa
  book: 1
  chapter: 50
  kind: body
  source_la: Conveniens est igitur, ut sequentes propositum nostrum, sermonem de distillatione tradamus
    cum causis suis. Est igitur distillatio vaporum aqueorum in suo vase elevatio. Diversificatur itaque
    distillatio. Nam quaedam est per ignem, quaedam vero sine igne. Quae vero per ignem fit, duorum generum
    invenitur. Quaedam est per elevationem in alembicum, quaedam per descensum Chemiae, qua mediante oleum
    ex vegetabilibus elicitur. Causa quare inventa sit distillatio, et causa generalis inventionis cuiuslibet
    distillationis est purificatio liquorosi a fece suae turbulentiae, et conservatio illius a putrefactione.
    Videmus enim rem distillatam quocunque distillationis genere puriorem effici, et melius a putrefactione
    custodiri. Causa vero specialis inventionis illius, quae per ascensum fit in alembicum, est inquisitio
    aquae purae sine terra. Cuius experientia est, quod videmus aquam sic distillatam, nullam fecem habere.
    Causa inventionis aquae purae, fuit imbitio spirituum et medicinam mundare, ut si quando scilicet
    indigemus imbibitione, aquam puram habeamus, quae fecem post ipsius resolutionem non dimittat, qua
    fece medicinae nostrae et spiritus mundati possint infici et corrumpi.
  translation_ja: そこで私たちの意図に従い、蒸留について、その原因とともに述べるのが適切である。蒸留とは、水性の蒸気を、その容器の中で上昇させることである。蒸留には相違があり、火によるものと、火を用いないものとがある。火によるものには二種が認められる。一つはアランビックへ上昇させるもので、もう一つは錬金術の下降によるものであり、これによって植物から油を取り出す。蒸留が発見された理由、また、あらゆる蒸留の発見に共通する原因は、液状の物を、その濁りの滓から精製し、腐敗から守ることである。どの種類の蒸留でも、蒸留された物がいっそう純粋になり、腐敗からいっそうよく守られるのが見られる。アランビックへ上昇させる蒸留の発見に特有の原因は、土を含まない純粋な水を求めることであった。その経験的な証しは、このように蒸留した水に滓がないことである。純水を見いだした原因は、精気に含浸させ、薬を清めるためであった。すなわち、含浸が必要なとき、蒸発した後に滓を残さない純水を得るためである。そうした滓によって、私たちの薬や清められた精気が汚され、損なわれるおそれがあるからである。
  notes:
  - 原刊の imbitio はそのまま転記し、続く imbibitione と同じ含浸の意味で訳した。精気（spiritus）は揮発性の錬金術的物質を指す。
  source_printed_page: 100
  source_pdf_page: 120
  source_erara_pdf_page: 125
- id: geber-summa-b01-c050-002
  section_id: geber-summa
  book: 1
  chapter: 50
  kind: body
  source_la: Causa vero inventionis eius, quae per descensum fit, fuit olei puri in natura sua extractio,
    quia per ascensum oleum in natura sua combustibili haberi non poterat, et huiusmodi inquisitio fuit
    scilicet, ut color eius, qui cum substantia sua permixtus est habeatur. Hic enim iuvare potest in
    casu. Distillationis vero quae per filtrum sine ignitione perficitur, causa inventionis, fuit aquae
    sola serenitas.
  translation_ja: 下降による蒸留の発見の原因は、油をその本来の性質のまま純粋に取り出すことであった。上昇によっては、燃えるという本来の性質をもつ油を得られなかったからである。この探究は、油の実体と混じり合っている色を得るためであった。その色が役立つ場合があるからである。他方、火で熱せず濾布によって行う蒸留が発見された原因は、ただ水を澄ませることにあった。
  notes: []
  source_printed_pages:
  - 100
  - 101
  source_pdf_pages:
  - 120
  - 121
  source_erara_pdf_pages:
  - 125
  - 126
- id: geber-summa-b01-c050-003
  section_id: geber-summa
  book: 1
  chapter: 50
  kind: body
  source_la: Dicamus igitur nunc omnium distillationum modos, cum causis suis. Eius itaque quae per ascensum
    fit, est duplex modus. Alia enim fictili olla cineribus plena perficitur. Alia autem cum aqua in vase
    suo cum graminibus vel lanositate, ordine suo disposita, ne cucurbita vel distillatorius alembicus
    rumpantur, antequam ad perfectionem deducatur. Ea vero quae cum cineribus, maiori, et fortiori, et
    acutiori perficitur igne, quae autem cum aqua, mansueto igne et aequali. Aqua enim acuitatem ignitionis
    non suscipit, quemadmodum cineres. Ideo per eam quae cum cineribus fit, colores et grossiores terrae
    partes elevari solent. Cum ea vero quae cum aqua fit, subtiliores et sine colore, et ad naturam aqueitatis
    simplicis approximantes magis elevari contingit. Subtilior ergo fit separatio per eam quae aqua perficitur,
    quam per eam, quae cineribus elicitur.
  translation_ja: そこで、すべての蒸留の方法を、その原因とともに述べよう。上昇によるものには二つの方法がある。一つは灰を満たした土鍋の中で行う。もう一つは水を使い、その容器に草や羊毛のような物を順序よく配置して行う。作業が完成する前に、ククルビタや蒸留用アランビックが割れないようにするためである。灰を使う方法は、より大きく、強く、鋭い火によって行い、水を使うものは穏やかで均等な火によって行う。水は灰のようには加熱の鋭さを受け入れないからである。したがって、灰を使う方法では色と土の粗い部分が上昇しやすい。他方、水を使う方法では、より微細で、無色で、単純な水性の本性にいっそう近い部分が上昇する。ゆえに、水によって行うほうが、灰によるよりも微細な分離となる。
  notes:
  - ククルビタ（cucurbita）は蒸留の下部容器、アランビック（alembicus）は通常その上部の頭部を指すが、本章には装置全体にも用いる表現がある。
  source_printed_page: 101
  source_pdf_page: 121
  source_erara_pdf_page: 126
- id: geber-summa-b01-c050-004
  section_id: geber-summa
  book: 1
  chapter: 50
  kind: body
  source_la: Experientia hoc novit vere esse, qui cum distillasset oleum per cineres, oleum vix alteratum
    suscepit in recipiente. Volens vero partes eius separare, ad id necessitate pervenit, ut contingeret
    per aquam distillare. Et tunc per eius reiterationem separavit oleum in partes suas elementales, ut
    albissimam et serenissimam aquam ex rubicundissimo extraxerit oleo, remanente in fundo alembici totaliter
    illius rubore. Per hoc ergo magisterium ad omnis rei vegetabilis, et eius quae ex vegetabili processit
    in esse, et omnis rei consimilis, ad omnium determinatam elementorum separationem pervenire necesse
    est.
  translation_ja: これが真実であることは、次の経験によって知られる。ある者が灰を使って油を蒸留したところ、受器には、ほとんど変化していない油が得られた。その部分を分離しようと望むと、必要に迫られて、水を使って蒸留することになった。これを繰り返して油をその元素的な部分へと分離し、非常に赤い油から、きわめて白く澄んだ水を取り出した。その赤色は、すべてアランビックの底に残ったのである。したがって、この術によって、あらゆる植物性の物、植物性の物から生じた物、そしてそれに似たあらゆる物について、そのすべての元素を明確に分離することへ至るはずである。
  notes: []
  source_printed_pages:
  - 101
  - 102
  source_pdf_pages:
  - 121
  - 122
  source_erara_pdf_pages:
  - 126
  - 127
- id: geber-summa-b01-c050-005
  section_id: geber-summa
  book: 1
  chapter: 50
  kind: body
  source_la: Per eam vero quae per descensum fit, ad cuiuslibet rei oleum perveniri determinate potest,
    scilicet vegetabilium omnium, et eorum consimilium. Per eam vero quae per filtrum fit, ad cuiuslibet
    liquorosi serenitatem perveniri potest. Haec autem omnia etiam parum vel minimum scientibus sunt manifesta
    et nota, qui vero haec ignorat, nihil ex hoc novit magisterio. Exercitetur igitur, et de facili ea
    investigabit.
  translation_ja: 下降による方法では、どの物からも確実に油を得ることができる。すなわち、すべての植物性の物、およびそれらに似た物からである。濾布による方法では、どの液状の物も澄ませることができる。これらはすべて、わずかな知識しかない者、あるいはごく初歩の知識しかない者にも明らかで、よく知られている。これらを知らない者は、この術を何も知らない。そこで実習すれば、容易に探り当てるであろう。
  notes: []
  source_printed_page: 102
  source_pdf_page: 122
  source_erara_pdf_page: 127
- id: geber-summa-b01-c050-006
  section_id: geber-summa
  book: 1
  chapter: 50
  kind: body
  source_la: Dispositio igitur eius quae per cineres fit est ut sumatur olla fortis ex terra, et coaptetur
    in furno, simili sublimationis furno praefato, cum eadem distantia a furni spondilibus, per eandem
    investigationem, et similibus auriculis, super cuius fundum ponantur cineres cribellati ad digiti
    spissitudinem, et super ipsos cineres ponatur vas distillationis, et cooperiatur in circuitu eius
    cum eisdem, usque prope collum alembici, postea vero infundatur in illud res, de cuius intentione
    sit sic distillari. Ultimo vero cooperiatur illud cum alembico, cuius collum suscipiat collum cucurbitae
    inferioris intra se, usque ad curvitatem cannalis ipsius alembici, ne viam fugae inveniat distillandum.
    Et postea lutetur alembicus cum cucurbita sua, et firmetur eorum iunctura, et supponatur ignis quousque
    distillet. Alembicus vero et eius cucurbita de vitro sint. Ignis vero illius augeatur ei secundum
    exigentiam distillationis, quousque videatur totum distillandum cum magna ignis expressione distillatum
    esse.
  translation_ja: 灰による方法の配置は次のとおりである。丈夫な土鍋を取り、前述の昇華炉と同様の炉に据える。炉壁からの距離は同じとし、同じ工夫を用い、同様の耳を付ける。その底に、篩にかけた灰を指一本分の厚さに敷き、その灰の上に蒸留容器を置く。その周囲を、アランビックの首近くまで、同じ灰で覆う。その後、このように蒸留しようとする物を容器へ注ぐ。最後にアランビックをかぶせる。その首が、下部ククルビタの首を、アランビックの管の曲がりに達するまで内側に受け入れるようにして、蒸留する物が逃げ道を見いださないようにする。その後、アランビックとククルビタを封泥で封じ、両者の継ぎ目を固め、蒸留するまで下から火を加える。アランビックとククルビタはガラス製とする。蒸留の必要に応じて火を強め、火の大きな作用によって、蒸留すべき物がすべて蒸留されたと認められるまで続ける。
  notes: []
  source_printed_pages:
  - 102
  - 103
  source_pdf_pages:
  - 122
  - 123
  source_erara_pdf_pages:
  - 127
  - 128
- id: geber-summa-b01-c050-007
  section_id: geber-summa
  book: 1
  chapter: 50
  kind: body
  source_la: Secundae vero intentionis distillationis dispositio, quae per aquam fit, est similis huic
    in vase et alembico. Differt tamen ab ea in hoc, quod in hac sumitur olla ferrea vel aenea, et coaptatur
    ad furnum, ut dictum est. Postea super fundum illius ollae stratum de graminibus, vel lana, vel re
    consimili construatur, ad spissitudinem trium digitorum, ne cucurbita frangatur, et eisdem graminibus,
    vel rebus consimilibus cooperiatur in circuitu cucurbita, usque prope collum alembici, et super ipsa
    stramina virgae subtilis superspargantur, et super virgas ponantur lapides ponderosi, qui suo pondere
    cucurbitam, et alembicum, et ipsa stramina deprimant, et depressa firmiter et stabiliter teneant super
    ollae fundum, ne natent levata per ipsam aquam, et sit levatio haec causa fracturae vasis, et distillandae
    rei perditio. Postea vero super stramina fundatur aqua usque ad ollae plenitudinem, et supponatur
    ignis, quousque distilletur totum.
  translation_ja: 第二の目的をもつ、水による蒸留の配置は、容器とアランビックの点では前のものと同じである。ただし、この方法では鉄か銅の鍋を取り、述べたように炉に据える点が異なる。次に、その鍋の底に、草、羊毛、またはそれに似た物を指三本分の厚さに敷き、ククルビタが割れないようにする。同じ草や、それに似た物で、ククルビタの周囲をアランビックの首近くまで覆う。その敷き物の上に細い枝を散らし、枝の上に重い石を置く。石の重さでククルビタ、アランビック、敷き物を押さえ、鍋の底にしっかり安定して保持し、水によって浮き上がらないようにする。浮き上がることが、容器の破損と蒸留する物の損失の原因となるからである。その後、敷き物の上から鍋が満ちるまで水を注ぎ、すべてが蒸留されるまで下から火を加える。
  notes:
  - 原刊の virgae subtilis は語形をそのまま保ち、文脈に従って「細い枝」と訳した。
  source_printed_page: 103
  source_pdf_page: 123
  source_erara_pdf_page: 128
- id: geber-summa-b01-c050-008
  section_id: geber-summa
  book: 1
  chapter: 50
  kind: body
  source_la: Dispositio vero eius quae per descensum fit, est, ut fiat descensorium vitreum, cum coopertorio
    eius, et lutetur utrunque, et intromittatur quod sic distillari quis intendit. Et fiat super caput
    illius ignis. Descendet enim distillatio eius.
  translation_ja: 下降による蒸留の配置は、蓋を備えたガラス製の下降器を作り、両方を封泥で覆い、この方法で蒸留したい物を中へ入れるというものである。そして、その上部に火を設ける。蒸留された物は下降するであろう。
  notes: []
  source_printed_page: 103
  source_pdf_page: 123
  source_erara_pdf_page: 128
- id: geber-summa-b01-c050-009
  section_id: geber-summa
  book: 1
  chapter: 50
  kind: body
  source_la: Dispositio vero eius quae per filtrum fit, est, ut ponatur liquor distillandus in concham
    lapideam, et filtri bene abluti et madidi, ponatur pars latior in dictum liquorem usque ad fundum
    conchae. Pendeat vero exilior pars eius ab orificio conchae extra. Et sub capite illius filtri ponatur
    vas recipiens distillationem. Cum ergo distillare ipsum filtrum incipiet, primo aqua distillabit,
    qua madidum fuit, qua cessante, succedit illi liquor distillandus. Qui si nondum serenus fuerit, toties
    ad concham revertatur, quousque serenissimus distillet. Haec autem quia facilia sunt omnia, magna
    probatione non indigent, ideoque eorum probationem siluimus. Descriptio vero omnium vasorum distillationis
    cuiuslibet, a nobis nunc traditae, est haec.
  translation_ja: 濾布による蒸留の配置は次のとおりである。蒸留する液を石製の鉢へ入れ、よく洗って湿らせた濾布の幅の広い側を、その液の中へ、鉢の底まで入れる。細い側は、鉢の口から外へ垂らす。濾布の先端の下に、滴下物を受ける容器を置く。濾布が滴らせ始めると、まず、それを湿らせていた水が滴り、その水が尽きると、蒸留すべき液がそれに続く。その液がまだ澄んでいなければ、きわめて澄んだ状態で滴るまで、何度でも鉢へ戻す。これらはすべて容易であり、大きな証明を必要としないので、証明については述べなかった。いま説明した各種の蒸留に用いる、すべての容器の図は次のとおりである。
  notes:
  - distillatio は本章では加熱蒸留だけでなく、濾布を伝って液を滴下させる操作にも用いられる。
  source_printed_pages:
  - 103
  - 104
  source_pdf_pages:
  - 123
  - 124
  source_erara_pdf_pages:
  - 128
  - 129

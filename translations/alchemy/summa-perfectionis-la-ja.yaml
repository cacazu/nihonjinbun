- id: geber-summa-b02-c097-title
  section_id: geber-summa
  book: 2
  chapter: 97
  kind: heading
  source_la: De Calcinatione et reductione. Cap. XCVII.
  translation_ja: 第97章　焼成と還元について。
  notes: []
  source_printed_page: 202
  source_pdf_page: 222
  source_erara_pdf_page: 227
- id: geber-summa-b02-c097-001
  section_id: geber-summa
  book: 2
  chapter: 97
  kind: body
  source_la: 'De calcinationis igitur et reductionis reiterationis examine dehinc perquirendum. Innuimus
    igitur, quod perfectionis reperta sunt corpora in calcinationis et reductionis reiteratione ex bonitatis
    differentiis, nihil coloris, ponderis, aut quantitatis, de qua curandum sit nimium: aut fulgoris perdere,
    quantumcunque reiteretur ad illa operationis illarum multiplicitas. Et ideo, si per reiterationem
    modorum calcinationis et reductionis a calce, ex omni metallorum alteratorum genere, bonitatis differentiis
    perdat aliquid, aestimandum putes sophistice perquisitionem artificem indagasse. Quamobrem igitur
    ad illas exerciteris, ut eas cognoscas.'
  translation_ja: 続いて、焼成と還元を繰り返す試験を探究しなければならない。完全な金属体は、焼成と還元をいかに幾度も反復しても、その良い特性のうち、色、重さ、量、輝きについて、大きく気にかけるべき損失を何も被らないことが見いだされる。したがって、変成されたあらゆる種類の金属のうち、焼成と灰からの還元の諸方法を繰り返すことで、その良い特性を何か失うなら、術者は見せかけの探究を行ったと判断すべきである。ゆえに、それらを知るために、それらに習熟せよ。
  notes: []
  source_printed_page: 202
  source_pdf_page: 222
  source_erara_pdf_page: 227
- id: geber-summa-b02-c098-title
  section_id: geber-summa
  book: 2
  chapter: 98
  kind: heading
  source_la: De facili susceptione Argenti vivi. Caput XCVIII.
  translation_ja: 第98章　水銀を容易に受け入れることについて。
  notes: []
  source_printed_page: 202
  source_pdf_page: 222
  source_erara_pdf_page: 227
- id: geber-summa-b02-c098-001
  section_id: geber-summa
  book: 2
  chapter: 98
  kind: body
  source_la: 'Iam igitur vobis patuit veridice, maximam argenti vivi quantitatem continentia perfectionis
    existere corpora: et ideo maxime argento vivo amicari. Quamobrem autumandum, corpora magis perfectioni
    approximare, quae magis amicabiliter argentum vivum combibunt. Et huius est signum argenti vivi facilis
    susceptio a Solari aut Lunari perfectionis corpore. Ob huius igitur rationis causam, si quidem alteratum
    corpus de facili in sui substantiam Argentum vivum non suscipiat, a perfectionis maxime complemento
    distare necesse est.'
  translation_ja: 完全な金属体は非常に多量の水銀を含み、そのため水銀ときわめてよく親和することが、すでに真実として明らかになった。したがって、より親和的に水銀を吸収する金属体ほど、完成に近いと考えるべきである。その徴候は、完全な金または銀の金属体が、水銀を容易に受け入れることである。この理由により、変成した金属体が、その実体の中へ水銀を容易に受け入れないなら、完全な完成からは大きく隔たっているに違いない。
  notes: []
  source_printed_pages:

- id: geber-summa-b02-c057-title
  section_id: geber-summa
  book: 2
  chapter: 57
  kind: heading
  source_la: Quod cognitio perfectionis huius artis, a cognitione naturae spirituum, et corporum dependeat,
    et quod de utrisque copiose velit tradere. Caput LVII.
  translation_ja: 第57章　この術の完全性の認識は、精気と金属体の本性の認識に依存すること、そして両者について詳しく述べようとすること。
  notes: []
  source_printed_page: 127
  source_pdf_page: 147
  source_erara_pdf_page: 152
- id: geber-summa-b02-c057-001
  section_id: geber-summa
  book: 2
  chapter: 57
  kind: body
  source_la: Cognoscere vero non est possibile transmutationes corporum vel ipsius argenti vivi, nisi
    super mentem artificis deveniat vera cognitio illorum naturae, secundum suas radices. Prius igitur
    corporum principia notificabimus, quid scilicet sint secundum causas suas, et quid boni vel mali in
    se contineant. Postea vero ipsorum omnium corporum naturas, cum suis omnibus proprietatibus monstrabimus,
    quae videlicet sint causae corruptionis illorum, cum suis experientiis comprobantes.
  translation_ja: 金属体や水銀そのものの変成を知るには、術者の精神に、それらの根源に即した本性の真の認識が生じなければならない。そこで、まず金属体の原理を明らかにし、それらがその原因に即して何であり、どのような善いもの、悪いものを内に含むかを示そう。その後、すべての金属体の本性を、あらゆる特性とともに示す。すなわち、それらの腐敗の原因が何であるかを、それぞれの実験によって確かめるのである。
  notes: []
  source_printed_page: 127
  source_pdf_page: 147
  source_erara_pdf_page: 152
- id: geber-summa-b02-c058-title
  section_id: geber-summa
  book: 2
  chapter: 58
  kind: heading
  source_la: De natura Sulphuris, et Arsenici. Cap. LVIII.
  translation_ja: 第58章　硫黄と砒素の本性について。
  notes: []
  source_printed_page: 127
  source_pdf_page: 147
  source_erara_pdf_page: 152
- id: geber-summa-b02-c058-001
  section_id: geber-summa
  book: 2
  chapter: 58
  kind: body
  source_la: Ergo in primis spirituum naturam, qui ipsorum corporum sunt principia, afferentes, quae sunt
    videlicet Sulphur, et eius compar, et argentum vivum, dicimus quod Sulphur et arsenicum pinguedo sunt
    terrae, ut a nobis narratum est. Cuius experientiam et manifestam probationem elicias per illius facilem
    inflammationem, et facilem eius liquefactionem, per calidum. Non enim inflammatur, nisi quod oleaginum
    est, nec liquescit per calidum facile, nisi quod illius naturam habet. Sulphur itaque et illius compar,
    causam corruptionis habent, inflammabilem substantiam, et terream feculentiam. Causam vero perficientem
    habent mediam, inter hanc videlicet et illam.
  translation_ja: まず金属体の原理である精気、すなわち硫黄とその同類、および水銀の本性を取り上げる。すでに述べたように、硫黄と砒素は土の脂肪である。その実験的で明白な証拠は、それが容易に発火し、熱によって容易に液化することから得られる。油性のものでなければ発火せず、その本性を持つものでなければ熱によって容易に溶けないからである。したがって、硫黄とその同類は、可燃性の実体と土性の滓を、腐敗の原因として持つ。一方、完全化をもたらす原因は、この二つの中間にある。
  notes: []
  source_printed_pages:
  - 127
  - 128
  source_pdf_pages:
  - 147
  - 148
  source_erara_pdf_pages:
  - 152
  - 153
- id: geber-summa-b02-c058-002
  section_id: geber-summa
  book: 2
  chapter: 58
  kind: body
  source_la: Est igitur causa corruptionis in illo terreitas, per hoc, quod neque fusionem, neque ingressionem
    habet. Et similiter inflammabilis substantia, quia neque stat, neque stare facit, et quod nigredinem
    ex omni genere eius praestat. Causa igitur perfectionis in illis est mediocris illarum substantia,
    quia per illius terreitatem non turbatur ab ingressione, quae per fusionem bonam perficitur. Et per
    illius subtilitatem non removetur eius impressio de facili propter fugam. Non est autem mediocris
    illorum substantia perfectionis causa corporum vel argenti vivi, nisi figatur. Quae cum non fixa sit,
    licet eius impressio non removeatur de facili, non tamen stabiliter perpetuatur. Ex his itaque elicitur
    illius mediocrem substantiam artificem dividere, necesse esse.
  translation_ja: 土性がその腐敗の原因であるのは、溶融も浸透もしないからである。可燃性の実体も同様に原因となる。それ自体が留まらず、ほかの物を留まらせることもなく、また、そのどの種類も黒さを与えるからである。したがって、これらの完全化の原因は、中間の実体である。その土性によって、良好な溶融で成し遂げられる浸透が妨げられることはなく、その精妙さのために揮散が生じても、その作用の痕跡が容易に失われることはない。ただし、この中間の実体も、固定されなければ、金属体や水銀を完全化する原因とはならない。固定されていなければ、その作用の痕跡は容易に失われないとしても、確実に永続するわけではない。したがって、術者はその中間の実体を分離しなければならない。
  notes: []
  source_printed_page: 128
  source_pdf_page: 148
  source_erara_pdf_page: 153
- id: geber-summa-b02-c058-003
  section_id: geber-summa
  book: 2
  chapter: 58
  kind: body
  source_la: Dividere autem putaverunt quidam impossibile esse, propter fortem illius mixtionem. Et illi
    quidem suis operibus manifestis adversi sunt. Nam ipsum sulphur calcinaverunt, licet non multum, quod
    nullam fusionem nec inflammationem dedit. Sed illud per divisionem necesse est evenisse, quia sulphur
    in sua naturali commixtione permanens, necesse est inflammari et comburi. Ergo per divisionem diversarum
    substantiarum in illo, relinquitur, partem in ipso magis inflammabilem, a partibus non inflammabilibus
    seorsum in artificio separari. Nam si possibile est, per calcinationem ad remotionem omnium inflammabilium
    partium in illo perveniri, necesse est ex eorum naturalibus operibus, eos confiteri, ad omnem partium
    divisionem posse perveniri. Sed quia hoc dependet ex subtilissimo artificio, cogitaverunt fore impossibile.
    Patet itaque ex praemissis in capitulo, quod non est sulphur de veritate nostrae artis, sed pars eius.
    Et nos iam deduximus te in cognitionem artificii, per quod ad illius divisionem possibile est devenire.
    In arsenico vero, quia in radice suae minerae, per actionem naturae resolutae sunt multae illius partes
    inflammabiles, ideo artificium separationis eius est facile. Sed ipsum est albedinis tinctura, sulphur
    vero rubedinis. In sulphuris igitur divisione magnam adhibere cautelam, necesse est.
  translation_ja: ある人々は、それが強固に混ざり合っているため、分離は不可能だと考えた。しかし、その人々自身の明白な操作が、その考えに反している。彼らは、わずかな量ではあるが、硫黄そのものを焼成し、もはや溶融も発火もしない物を作ったからである。これは分離によって起こったに違いない。硫黄が自然の混合状態に留まるかぎり、発火し、燃焼するはずだからである。したがって、硫黄の異なる実体を分けることによって、その中のいっそう燃えやすい部分が、燃えない部分から、技術によって別々に分離されると結論される。焼成によって、そこにある可燃性の部分をすべて除くことが可能なら、彼らは自らの自然に即した操作に基づき、あらゆる部分の分離が可能だと認めなければならない。だが、これはきわめて精妙な技術に依存するため、彼らは不可能だと考えた。本章で述べたことから、私たちの術の真実に属するのは硫黄全体ではなく、その一部分であることが明らかである。私たちはすでに、その分離を可能にする技術の認識へとあなたを導いた。砒素では、鉱床における根源の段階で、自然の働きによって可燃性の部分の多くが解き放たれているので、分離の技術は容易である。ただし砒素は白さの染薬であり、硫黄は赤さの染薬である。したがって、硫黄の分離には、大いなる慎重さが必要である。
  notes: []

- id: geber-summa-b02-c064-001
  section_id: geber-summa
  book: 2
  chapter: 64
  kind: body
  source_la: 'Redeuntes igitur ad propositum, dicimus, quod si fuerit sulphur immundum, grossum, fixum
    secundum sui maiorem partem: secundum vero sui minorem non fixum, rubeum, lividum, secundum totum
    non superans neque superatum, et ceciderit super argentum vivum grossum, ex eo aes creari necesse
    est. Horum itaque omnium probationem adducere per data ex natura illorum contingit. Nam cum illud
    ad inflammationem deponitur, flammam ex eo sulphuream discernere poteris, quae sulphuris non fixi
    est signum. Et deperditio quantitatis eius per exhalationem, per frequentem eius combustionem, sulphur
    illud fixum habere significat. Nam ex ea, fit illius fusionis retardatio, et induratio substantiae
    ipsius, quae signa sunt multitudinis fixi sulphuris ipsius. Quod illud autem sit rubeum immundum,
    adiunctum argento vivo immundo, significat per sensum: unde alia probatione non indiget.'
  translation_ja: 本題に戻ると、不純で粗い硫黄が、その大部分では固定され、小部分では固定されず、赤く鉛色がかり、全体として優勢でも劣勢でもない状態で、粗い水銀に加われば、必然的に銅が生成するといえる。これらすべての証拠は、それらの本性が示す事柄から得られる。銅を発火させようとすると、そこから硫黄性の炎が出るのを認めることができる。これは固定されない硫黄のしるしである。また、繰り返し燃焼させると、蒸散によって量が失われることは、固定された硫黄を持つことを示す。その結果、溶融が遅くなり、実体が硬くなるからであり、これらは固定された硫黄が多量にあるしるしである。硫黄が赤く不純で、不純な水銀と結び付いていることは、感覚によって示されるので、他の証明を必要としない。
  notes: []

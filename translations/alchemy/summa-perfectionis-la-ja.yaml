- id: geber-summa-b02-c099-title
  section_id: geber-summa
  book: 2
  chapter: 99
  kind: heading
  source_la: Recapitulatio totius artis. Caput XCIX.
  translation_ja: 第99章　術全体の要約。
  notes: []
  source_printed_page: 203
  source_pdf_page: 223
  source_erara_pdf_page: 228
- id: geber-summa-b02-c099-001
  section_id: geber-summa
  book: 2
  chapter: 99
  kind: body
  source_la: 'Quia pertractavimus huius magisterii causarum sufficientiae experientias notas, secundum
    nostri propositi sermonis exigentiam, restat nos ad complementum totius operis divini pervenire in
    capitulo uno, et in summam contrahere sermonis abbreviati in Capitulis dispersum magisterium. Dicimus
    igitur, quod totius operis intentionis summa non est, nisi ut sumatur lapis, in Capitulis notus: deinde
    vero cum operis instantia assiduetur super illum opus sublimationis primi gradus: et per hoc mundatur
    a corrumpente impuritate, et est scilicet sublimationis perfectio, ut cum ea subtilietur lapis, donec
    in ultimam subtilitatis puritatem deveniat, et ultimo volatilis fiat. Ab hinc vero cum fixionis modis
    figatur, donec in ignis asperitate quiescat. Et hic secundi praeparationis gradus meta consistit.
    Sed tertio similiter lapis administratur gradu, qui in ultimo consistit praeparationis complemento,
    scilicet ut iam fixum lapidem cum modis sublimationis volatilem facias, et volatilem fixum, et fixum
    solutum, et solutum iterato volatilem, et iterato volatilem fixum, quousque fluet et alteret in complemento
    Solifico et Lunifico certo.'
  translation_ja: 所期の説明に必要な範囲で、この秘術の原因を十分に示す既知の経験を論じたので、残るのは、一章で神的な仕事全体の完成へ到達し、各章に分散した秘術を、簡潔な説明にまとめることである。操作全体の目的は、結局、諸章ですでに知られた石を取ることにほかならない。次に不断の努力をもって、その石に第一段階の昇華を絶えず施す。これによって腐敗をもたらす不純さから清められる。昇華の完成とは、それによって石を微細にし、微細さの究極の純粋さへ至らせ、最後に揮発性とすることである。その後、固定の諸方法によって、激しい火の中でもとどまるまで固定する。ここが調製の第二段階の到達点である。同じく第三段階でも石を処置し、調製の究極の完成へ至らせる。すなわち、すでに固定した石を昇華の諸方法で揮発性にし、揮発性のものを固定し、固定したものを溶解し、溶解したものを再び揮発性にし、また揮発性のものを固定する。石が流動し、確かな金または銀の完成へ変成させるまで続ける。
  notes: []
  source_printed_pages:
  - 203
  - 204
  source_pdf_pages:
  - 223
  - 224
  source_erara_pdf_pages:
  - 228
  - 229
- id: geber-summa-b02-c099-002
  section_id: geber-summa
  book: 2
  chapter: 99
  kind: body
  source_la: Ex reiteratione igitur praeparationis huius gradus tertii in medicina, resultat bonitatis
    alterationis multiplicatio. Ex diversitate igitur reiterationis operis super lapidem in gradibus suis
    resultat multiplicationis bonitatis alterationis diversitas, ut ex medicinis quaedam quidem sui centuplum,
    quaedam vero ducentuplum, quaedam trecentuplum, quaedam vero millecuplum, quaedam vero infinitum Solificum
    et verum perfectionis Lunificum transmutet corpus. Ab hinc igitur et ultimo tentetur, utrum in perfectione
    consistat magisterium.
  translation_ja: したがって、薬にこの第三段階の調製を繰り返すと、良い変成作用が増大する。石にその各段階の操作を繰り返す仕方が異なるため、変成作用の良さの増大にも相違が生じる。ある薬は自重の百倍、別の薬は二百倍、三百倍、千倍、さらに別の薬は無限の量の金属体を、完全な金および真正な銀へ変成する。その後、最後に、その秘術が完成しているかどうかを試せ。
  notes: []
  source_printed_page: 204
  source_pdf_page: 224
  source_erara_pdf_page: 229
- id: geber-summa-b02-c100-title
  section_id: geber-summa
  book: 2
  chapter: 100
  kind: heading
  source_la: Quem modum Author in arte tradenda servaverit. Cap. C.
  translation_ja: 第100章　著者が術を伝える際に守った方法について。
  notes: []
  source_printed_page: 204
  source_pdf_page: 224
  source_erara_pdf_page: 229
- id: geber-summa-b02-c100-001
  section_id: geber-summa
  book: 2
  chapter: 100
  kind: body
  source_la: 'Sed ne nos quidem mordeamur ab invidis, narramus quod non tradidimus scientiam nostram sermonis
    continuatione, sed eam sparsimus in diversis capitulis. Et hoc ideo, quod eam tam probus quam improbus,
    si continue fuisset tradita, usurpasset indigne. Et eam similiter occultavimus, ubi magis aperte locuti
    fuimus, non tamen sub aenigmate, sed sub plana sermonis serie artificem allocuti fuimus, et tali sermonis
    modo eam ascripsimus, quam solius Dei altissimi, benedicti, sublimis et gloriosi, et nostrae, qui
    illam scripsimus, menti recolligi accidet: aut divinae gratiae bonitatis perfusi, quae cui vult largitur,
    et subtrahit.'
  translation_ja: 妬む者から非難されないように述べておく。私たちは、この学知を連続した説明として伝えず、別々の章へ散りばめた。連続して伝えていたなら、善人も悪人も、それを不相応に我が物としてしまっただろうからである。同じく、いっそう明白に語ったところでこそ、それを隠した。しかし謎の形ではなく、平明な言葉の連なりによって術者に語りかけた。そして、いと高く、祝福され、高邁で栄光ある神だけと、これを書いた私たちの精神だけが、あるいは、望む者に授け、また取り去る神の恵みの善に満たされた者の精神が、まとめ直すことのできる言い方で記したのである。
  notes: []
  source_printed_pages:
  - 204
  - 205
  source_pdf_pages:
  - 224
  - 225
  source_erara_pdf_pages:
  - 229
  - 230
- id: geber-summa-b02-c100-002
  section_id: geber-summa
  book: 2
  chapter: 100
  kind: body
  source_la: 'Non desperet igitur doctrinae filius, quia si illam quaeret, eam inveniet: non doctrinae,
    sed proprii motus indagatione naturae. Quia qui per suae industriae bonitatem quaeret, scientiam inveniet.
    Qui vero per librorum insecutionem quaesiverit, tardissime ad hanc perveniet artem preciosissimam.
    Quia nobis solis, artem per nos solos investigatam aedidimus, et non aliis, verissimam tamen et omnino
    certam. Solum igitur prudentes ad artem allicuimus, et per ingenia a nobis tradita viam investigationis
    eisdem exposuimus. Non autem eam inventam nisi solis nobis scripsimus, sed et inventionis modum et
    modorum ingenia. Per ea igitur quae tradidimus, exerceat se bonae mentis artifex, et Dei donum altissimi
    se adinvenisse laetabitur. Ad artis igitur excelsae perquisitionem haec dicta sufficiant.'
  translation_ja: ゆえに、学びの子は絶望してはならない。求めるなら見いだすからである。ただし、教えを追うことによってではなく、自ら動いて自然を探究することによってである。自らの手腕の良さによって求める者は、学知を見いだす。一方、書物を追い求めることによって探す者が、この最も貴重な術に至るのは、きわめて遅い。私たちは、自分たちだけで探究した術を、他人のためではなく、自分たちだけのために公にしたのである。それでも、それは最も真実で、まったく確実である。したがって、思慮ある者だけを術へ誘い、私たちの伝えた工夫によって、探究の道を示した。発見済みの術そのものを記したのは、自分たちだけのためであったが、発見の方法と、その方法に属する工夫も記した。ゆえに、良識ある術者は、私たちの伝えたことによって鍛錬せよ。そうすれば、いと高き神の賜物を見いだしたことを喜ぶだろう。この高貴な術の探究については、以上で十分としよう。
  notes: []
  source_printed_page: 205
  source_pdf_page: 225
  source_erara_pdf_page: 230

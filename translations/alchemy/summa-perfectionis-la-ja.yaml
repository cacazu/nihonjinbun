- id: geber-summa-b02-c088-003
  section_id: geber-summa
  book: 2
  chapter: 88
  kind: body
  source_la: 'Et propter hoc salvatur maior perfecti quantitas ab ignis examinis combustione forti, quia
    non quiescit spatio temporis longo perfectum in consumptione examinis: et ideo ex eo per Plumbi examen
    minus comburitur, et facilius depuratur. Quia vero Iovis substantia, pluris Argenti vivi capax extitit,
    et minore terreitatis quantitate, maioreque puritate illius, atque subtiliore substantia participans,
    ideo magis in commixto salvatur quam Saturnus et Venus, quia magis commixto in profundo adhaeret.
    Et haec est causa, quare multa perfecti deletur quantitas, priusquam ab illo separetur coniunctus.
    Venus vero fusionem cum ignitione praestat. Sed quia tardior est illius quam perfecti fusio, ideo
    separatur de commixto: tardius tamen quam Saturnus, propter ignitionem substantiae suae fusibilis.
    Quia vero minoris est Argenti vivi quantitatis quam Iupiter, et maioris terreitatis, et substantiae
    spissioris, ideo facilius quam Iupiter de commixto tollitur, quoniam in profundo magis Iupiter quam
    Venus adhaeret.'
  translation_ja: そのため、試験の火の強い焼損から、より多量の完全な金属が守られる。完全な金属が、消耗を伴う試験に長時間置かれないからであり、鉛による試験では、それだけ焼損が少なく、容易に精製される。一方、錫の実体は、より多くの水銀を含み、土性が少なく、より純粋で微細な実体にあずかるので、鉛や銅よりも混合物中によく残る。深部で混合物に強く付着するからである。これが、結合した錫を分離する前に、完全な金属の多くが失われる理由である。銅は赤熱を伴って溶融する。しかし、完全な金属より溶融が遅いため、混合物から分離する。ただし、溶ける実体が赤熱するため、鉛よりは遅い。また、錫より水銀が少なく、土性が多く、実体が濃密であるから、錫より容易に混合物から取り除かれる。錫のほうが銅より深部に強く付着するからである。
  notes: []
  source_printed_page: 189
  source_pdf_page: 209
  source_erara_pdf_page: 214
- id: geber-summa-b02-c088-004
  section_id: geber-summa
  book: 2
  chapter: 88
  kind: body
  source_la: Mars vero fusionem non habet, et ideo non permiscetur, quod propter suae humiditatis privationem
    contingit. Sed et si propter ignis vehementiam illum permisceri contingat, quia humiditatem non habet,
    Lunae aut Solis humiditatem combibendo, ei per minima unitur, ideo licet terreitatem multam, et Argenti
    vivi paucitatem, et fusionis carentiam habeat, non separatur ab eis per artificium leve. Per hoc igitur
    artificis dilatatur industria, ad cuiusque corporis rectificationem veram, si recte eius quod scripsimus
    efficaciam noverit. Si vero fantastice super illud intellectum contraxerit, nihil ex eo veritatis
    cognoscet. Sunt autem duo in huius examine perdurantia perfectionis corpora, Sol scilicet et Luna,
    propter bonam compositionem, quae per bonam mixtionem resultat, et illorum puram substantiam.
  translation_ja: 鉄は溶融性をもたず、そのため混じらない。これは湿気を欠くために起こる。仮に火の激しさによって混じることがあっても、湿気をもたないので、銀や金の湿気を吸い込み、それらと最小部分まで結合する。したがって、多量の土性、水銀の少なさ、溶融性の欠如があっても、容易な技法ではそれらから分離しない。私たちの書いたことの効力を正しく知れば、これによって術者の手腕は、あらゆる金属体を真に整えるために広がる。しかし、空想的にしか理解しなければ、そこから何の真理も知ることはできない。この試験に耐えて残る完全な金属体は、金と銀の二つである。良好な混合から生じる良好な組成と、その純粋な実体によるのである。
  notes: []
  source_printed_pages:
  - 189
  - 190
  source_pdf_pages:
  - 209
  - 210
  source_erara_pdf_pages:
  - 214
  - 215
- id: geber-summa-b02-c089-title
  section_id: geber-summa
  book: 2
  chapter: 89
  kind: heading
  source_la: Cineritii examen, quomodo sit componendum et exercendum. Cap. LXXXIX.
  translation_ja: 第89章　灰吹き試験をどのように準備し、実施するか。
  notes: []
  source_printed_page: 190
  source_pdf_page: 210
  source_erara_pdf_page: 215
- id: geber-summa-b02-c089-001
  section_id: geber-summa
  book: 2
  chapter: 89
  kind: body
  source_la: Narremus igitur modum illius. Et est ut tollatur cinis cribellatus, aut calx, aut pulvis
    ossium animalium combustorum, aut horum omnium commixtio, aut quorundam. Dehinc itaque cum aqua madefiat,
    et super illud prematur manus, et fiat stratum firmum et solidum, et in medio strati fiat rotunda
    fovea et solida, et super illius fundum spargatur vitri triti quantitas aliqua. Deinde vero exsiccari
    permittatur, et cum sicca fuerit, ponatur illud de cuius intentione sit tollerare huius examen, in
    foveam dictam, et super illam carbonum ignis fortis succendantur, et super faciem examinabilis suffletur
    corporis, donec fundatur. Quo fuso, Saturni partem post partem proiiciamus in illud, et super illud
    suffletur cum flamma fortis ignitionis. Et dum videris illud agitari, et moveri motu concussionis
    forti, non est purum. Expecta igitur donec totum evanescat plumbum. Quod si evanuerit, et non cessat
    illius motus, non est depuratum.
  translation_ja: その方法を述べよう。篩にかけた灰、石灰、焼いた動物の骨の粉、あるいはこれら全部またはいくつかの混合物を取る。それを水で湿らせ、手で押して、堅く締まった床を作る。その中央に丸く堅いくぼみを作り、その底に砕いたガラスをいくらか撒く。その後、乾燥させる。乾いたら、試験に耐えるか確かめたい物をそのくぼみに置き、その上に強い炭火を起こし、試験する金属体の表面へ送風して、溶けるまで続ける。溶けたら、鉛を一部ずつ投じ、強く赤熱させる炎を伴って送風する。激しく攪拌され、強い揺動によって動くのが見えるうちは、純粋ではない。鉛がすべて消えるまで待て。鉛が消えてもその動きが止まらないなら、精製されていない。
  notes: []
  source_printed_pages:
  - 190
  - 191
  source_pdf_pages:
  - 210
  - 211
  source_erara_pdf_pages:
  - 215
  - 216
- id: geber-summa-b02-c089-002
  section_id: geber-summa
  book: 2
  chapter: 89
  kind: body
  source_la: 'Iterato igitur super illud plumbum proiice, et super illius faciem iterato suffla, donec
    plumbum separetur. Quod si non quieverit, iterato post plumbi proiectionem, sufflationem in illius
    faciem procura, quousque quiescat, et videas illud mundum et clarum in superficie sua. Post hoc vero
    carbones aperi, et ignem dissipa, et in faciem eius aquam perfunde: hoc enim perfecte examinatum invenies.
    Et si quandoque in sufflatione huius examinis vitrum proieceris, melius et perfectius depurabitur:
    quoniam sordes tollit, et illas infiscat. Potest tamen loco vitri sal proiici, aut borax, aut alumen
    aliquod. Similiter et confici potest huius examen cineritii in crucibulo terreo, et in circuitu illius
    sufflari, et super faciem eius similiter, ut citius confletur examinandum. His igitur sufficienter
    narratis, ad cementi examen transeamus cum causis suis, et suis experientiis manifestis et notis.'
  translation_ja: そこで再び鉛を投じ、鉛が分離するまで、表面へ再び送風せよ。静まらなければ、また鉛を投じてから表面へ送風し、静まって、その表面が清らかに輝いて見えるまで続ける。その後、炭を開き、火を散らし、表面に水を注ぐ。こうすれば、完全に試験されたものが得られる。この試験の送風中、ときどきガラスを投じれば、いっそうよく、より完全に精製される。ガラスが汚れを取り除き、それを捕らえるからである。ただし、ガラスの代わりに塩、硼砂、あるいは何らかの明礬を投じてもよい。同じ灰吹き試験は、土製の坩堝でも行える。その周囲と表面へ送風し、試料をより速く溶かす。これで十分に説明したので、次にセメント試験へ移り、その原因と、明白で既知の経験を述べよう。
  notes: []
  source_printed_page: 191
  source_pdf_page: 211
  source_erara_pdf_page: 216
- id: geber-summa-b02-c090-title
  section_id: geber-summa
  book: 2
  chapter: 90
  kind: heading
  source_la: De Cemento, quare quaedam corpora plus, quaedam vero minus illud perferant. Cap. XC.
  translation_ja: 第90章　セメントについて、ある金属体はそれによく耐え、あるものはあまり耐えないのはなぜか。
  notes: []
  source_printed_page: 191
  source_pdf_page: 211
  source_erara_pdf_page: 216
- id: geber-summa-b02-c090-001
  section_id: geber-summa
  book: 2
  chapter: 90
  kind: body
  source_la: 'Diximus autem, quod corpora quaedam magis, quaedam vero minus, per ignis comburuntur calcinationis
    modum: ut quae pluris sunt Sulphuris quantitatem combustibilis continentia, magis: quae vero minus,
    minus. Quia igitur Sol inter caetera corpora minoris est Sulphuris quantitatis: ideo inter caetera
    omnium mineralium corporum minime per ignis inflammationem comburitur. Luna vero post Solem inter
    omnia corpora reliqua minus est Sulphuris quantitatis participans, pluris autem quam Sol. Igitur minus
    potest secundum hoc inflammationis ignitionem temporis spatio longo tollerare quam Sol, et res per
    consimilem comburentes naturam. Minus Venus, quia Sole et Luna pluris est Sulphuris, et terreitatis
    maioris, ideo minus inflammationem ignis tollerat. Iupiter vero minus Venere, plus vero Sole et Luna
    sulphureitatis et terreitatis participat, et ideo minus per inflammationem Venere comburitur, plus
    vero Sole et Luna. Saturnus vero plus terreitatis et sulphureitatis per naturam in commixtione servavit,
    quam nunc dicta corpora: et ideo citius et facilius omnibus dictis inflammatur corporibus, et per
    inflammationem comburitur velocius, propter hoc, quod sulphureitatem maxime habet coniunctam et Iove
    magis fixam.'
  translation_ja: すでに述べたように、金属体には、火による焼成で強く焼損するものと、あまり焼損しないものとがある。可燃性硫黄を多く含むものほど強く焼損し、少ないものほど焼損が少ない。金は、ほかの金属体より硫黄の量が少ないため、すべての鉱物性金属体のうち、火の炎による焼損が最も少ない。銀は金に次いで、ほかの金属体すべてより硫黄が少ないが、金よりは多い。したがって、炎による赤熱や、それと似た本性によって焼損させる物に、金ほど長時間は耐えられない。銅はさらに耐えにくい。金や銀より硫黄と土性が多く、そのため火の炎に耐える力が弱い。錫の硫黄質と土性は銅より少なく、金や銀より多いので、炎による焼損も銅より少なく、金や銀より多い。鉛は、いま述べた金属体より多くの土性と硫黄質を、本性上その混合物中に保っている。そのため、これらすべてより速やかに容易に発火し、炎によってさらに速く焼損する。硫黄質がきわめて強く結合し、錫より固定されているからである。
  notes: []
  source_printed_pages:
  - 191
  - 192
  source_pdf_pages:
  - 211
  - 212
  source_erara_pdf_pages:
  - 216
  - 217
- id: geber-summa-b02-c090-002
  section_id: geber-summa
  book: 2
  chapter: 90
  kind: body
  source_la: 'Mars vero non per se sed per accidens non comburitur. Cum enim cum multae humiditatis commiscetur
    corporibus, combibit illam, propter suae humiditatis carentiam: et ideo coniunctus non inflammatur,
    nec comburitur, si non inflammabilia nec combustibilia sint corpora sibi unita. Si vero combustibilia
    sint illi commixta corpora, secundum naturam suae combustionis, necessario evenit Martem comburi et
    inflammari. Cum igitur ex rebus constituatur inflammabilibus cementum, patet causa illius inventionis
    necessaria: et fuit, ut omnia combustibilia adurerentur. Cum igitur unum solum sit corpus incombustibile:
    solum illud, aut ad illius naturam praeparatum, in cemento salvatur. Durant tamen quaedam magis, quaedam
    vero minus in cemento. Quae vero magis, et quae minus, nota sunt cum causis dictis. Durant igitur
    plus Luna, minus vero Mars, adhuc vero et minus Iupiter, minus vero et adhuc Venus, minime vero Saturnus.'
  translation_ja: 一方、鉄が焼損しないのは、それ自体によってではなく、付帯的な事情による。鉄は多くの湿気をもつ金属体と混ざると、自ら湿気を欠くため、それを吸い込む。したがって、結合した金属体が非発火性で非可燃性なら、鉄も結合した状態では発火せず、焼損しない。反対に、混合した金属体が可燃性なら、その燃焼の本性に従い、鉄も必ず焼損し発火する。セメントは発火性の物からなるので、その発明に必要だった理由は明らかである。それは、すべての可燃性物を焼き尽くすためであった。不燃性の金属体はただ一つであるから、それだけ、あるいはそれと同じ本性に調製されたものだけが、セメントの中で保たれる。ただし、セメントに長く耐えるものも、短くしか耐えないものもある。どれが長く、どれが短く耐えるかは、述べた原因から明らかである。銀が最もよく耐え、鉄はそれより劣り、錫はさらに劣り、銅はなお劣り、鉛が最も耐えない。
  notes:
  - 193頁3行は巻末正誤表に従い salvatur とした。
  source_printed_pages:
  - 192
  - 193

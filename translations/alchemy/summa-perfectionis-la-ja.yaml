- id: geber-summa-b01-c051-009
  section_id: geber-summa
  book: 1
  chapter: 51
  kind: body
  source_la: Modus vero furni calcinationis huius, est idem cum modo furni distillationis, nisi quod foramen
    solummodo unum magnum debet super caput suum habere, unde a fumositatibus se libere absolvat. Et situs
    calcinandorum in medio furni sit, ut in circuitu libere ignem suscipiant. Vas vero eius sit terreum,
    ad formam parapsidis factum.
  translation_ja: この焼成に用いる炉の構造は蒸留炉と同じである。ただし、上部に一つだけ大きな穴を設け、そこから煙を自由に排出できるようにする。焼成する物は炉の中央に置き、周囲から自由に火を受けるようにする。その容器は、皿の形をした土製のものとする。
  notes: []
  source_printed_page: 110
  source_pdf_page: 130
  source_erara_pdf_page: 135
- id: geber-summa-b01-c051-010
  section_id: geber-summa
  book: 1
  chapter: 51
  kind: body
  source_la: Modus autem calcinationis spirituum est, ut eis ad fixionem approximantibus, administretur
    ignis, successive et paulatim, illum augendo, ne fugiant, quousque maximum eos tolerare ignem contingat.
    Et vas eorum sit rotundum, undique clausum, et furnus idem cum novissime dicto. Cum consimili autem
    furno, et consimili vase, omnis similiter res calcinatur. Excusamur tamen a maiori labore, quam qui
    adhibetur in custodia fugae. Quoniam alia res non fugit, nisi spiritus, et quod spirituum naturae
    approximat. Descriptio vero omnium, quae narrata sunt novissime est haec.
  translation_ja: 精気を焼成する方法は、それらが固定へ近づくにつれて火を加え、逃げないよう、順を追って少しずつ火を強め、きわめて強い火にも耐えるようになるまで続けるというものである。その容器は丸く、どの側も閉じられたものとし、炉は直前に述べたものと同じとする。同様の炉と同様の容器によって、他のどの物も焼成される。ただし、その場合には、逃散を防ぐために費やす、あの大きな労力を省ける。精気と、精気の本性に近い物以外は逃げないからである。直前に述べたすべての器具の図は、次のとおりである。
  notes: []
  source_printed_page: 110
  source_pdf_page: 130
  source_erara_pdf_page: 135

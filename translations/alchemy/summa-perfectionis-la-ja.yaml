- id: geber-summa-b02-c062-title
  section_id: geber-summa
  book: 2
  chapter: 62
  kind: heading
  source_la: De natura Lunae, sive Argenti. Cap. LXII.
  translation_ja: 第62章　月、すなわち銀の本性について。
  notes: []
  source_printed_page: 135
  source_pdf_page: 155
  source_erara_pdf_page: 160
- id: geber-summa-b02-c062-001
  section_id: geber-summa
  book: 2
  chapter: 62
  kind: body
  source_la: Iam ergo patet ex praecedentibus, quod si ceciderit sulphur mundum, fixum, rubeum, clarum,
    super substantiam argenti vivi puram, non superans, imo paucae quantitatis, et superatum, creatur
    ex hoc aurum purum. Si vero fuerit sulphur mundum, fixum, album, clarum, quod ceciderit super substantiam
    argenti vivi, fit argentum purum, si in quantitate non superet, diminutam tamen habet puritatem ab
    auri puritate, et spissitudinem grossiorem, quam aurum. Cuius signum est, quod non densantur partes
    eius, in tantum ut auro componderet, nec ita fixam substantiam habet, ut illud. Signum est diminutio
    eius per ignem, et sulphur eius, quod non est fixum, nec incombustibile, causa est illius. Et quod
    sulphur in illo huius sit dispositionis, per illius paululam inflammationem probatur. Idem autem fixum
    et non fixum ad aliud quidem et ad aliud relatum esse, impossibile non est autumandum. Lunae enim
    sulphureitas ad auri sulphureitatem relata, non fixa, et comburens est. Ad aliorum vero sulphur corporum
    fixa, et non comburens.
  translation_ja: 以上から、清浄で固定され、赤く明るい硫黄が、純粋な水銀の実体に、優勢にならず、むしろ少量で劣勢となるように加われば、純金が生じることが、すでに明らかである。一方、水銀の実体へ加わる硫黄が、清浄で固定され、白く明るいものであり、その量が優勢でなければ、純銀が生じる。ただし、その純粋さは金より劣り、その密質性は金より粗い。そのしるしは、部分が金と同じ重さになるほどには密集しておらず、実体も金ほど固定されていないことである。火によって減少することがそのしるしであり、その原因は、銀の硫黄が固定されておらず、不燃性でもないことにある。その硫黄がこのような状態にあることは、わずかに発火することによって証明される。同じものが、比較する相手に応じ、固定されているとも、固定されていないともいわれることは、不可能と考えるべきではない。銀の硫黄性は、金の硫黄性と比べれば固定されず、燃焼する。しかし、他の金属体の硫黄と比べれば固定され、燃焼しない。
  notes:
  - 原刊正誤表の136頁2行「si」を採用し、句切りを「fit argentum purum, si in quantitate non superet」と整理した。同頁14行の「non」も正誤表に従い採用。
  source_printed_pages:
  - 135
  - 136

- id: geber-summa-b01-c054-004
  section_id: geber-summa
  book: 1
  chapter: 54
  kind: body
  source_la: Fixionis vero modus argenti vivi, est idem cum modo fixionis sulphuris et arsenici, et non
    diversificantur inter se, nisi in hoc, quod non possunt sulphur et arsenicum figi, nisi prius eorum
    partes inflammabiles tenuissimae, subtili divisionis artificio ab eis separentur, per hunc ultimum
    fixionis modum. Argentum vero vivum hanc considerationem non habet, et ad hoc similiter temperatiori
    calore, quam argentum vivum indigent in hoc modo. Similiter diversificantur, quia in longiori figuntur
    tempore, quam argentum vivum. In eo similiter, quoniam altius elevantur propter suam tarditatem, quam
    argentum vivum. Ideoque longiori vase indigent quam argentum vivum ad suam fixionem.
  translation_ja: 水銀の固定法は、硫黄と砒素性物質の固定法と同じであり、次の点を除けば違いはない。硫黄と砒素性物質は、この最後に述べた固定法を用い、精妙な分離の技によって、まず、きわめて薄い可燃性の部分を取り除かなければ固定できない。水銀では、この配慮は必要ない。また、この方法で硫黄と砒素性物質を扱うときには、水銀よりも穏やかな熱が必要である。さらに、硫黄と砒素性物質の固定には、水銀より長い時間がかかる点も異なる。同様に、それらは、その遅さのため、水銀より高く上昇するという点でも異なる。それゆえ、固定するために、水銀より長い容器が必要となる。
  notes:
  - 原刊の tarditatem（遅さ）は画像で確認し、そのまま訳した。上昇の高さの理由を別の物性語に置き換えてはいない。
  source_printed_page: 123
  source_pdf_page: 143
  source_erara_pdf_page: 148
- id: geber-summa-b01-c054-005
  section_id: geber-summa
  book: 1
  chapter: 54
  kind: body
  source_la: Fixio vero marchesitae, Magnesiae, et tutiae est, ut cum post primam illorum sublimationem
    acquisiverimus quod ex eis volumus, abiectis illorum fecibus, reiteremus super ea sublimationem, totiens
    convertendo quod superius ascendit ad id quod inferius remansit, ex unoquoque illorum, quousque figantur.
    Horum vero descriptio vasorum iam tradita est.
  translation_ja: マルカシータ、マグネシア、トゥティアの固定は、次のように行う。最初の昇華の後、それらから望むものを得て、滓を捨てたら、それらに対して昇華を繰り返す。そのそれぞれについて、上へ昇った物を、下に残った物へ何度も戻し、固定されるまで続ける。これらの容器の図は、すでに示した。
  notes:
  - 巻末正誤表（123頁19行）に従い、本文の magnisiae を Magnesiae に訂正した。
  source_printed_page: 123
  source_pdf_page: 143
  source_erara_pdf_page: 148
- id: geber-summa-b01-c055-title
  section_id: geber-summa
  book: 1
  chapter: 55
  kind: heading
  source_la: De Ceratione. Caput LV.
  translation_ja: 第55章　蝋化について。
  notes: []
  source_printed_page: 124
  source_pdf_page: 144
  source_erara_pdf_page: 149
- id: geber-summa-b01-c055-001
  section_id: geber-summa
  book: 1
  chapter: 55
  kind: body
  source_la: Ceratio, est durae rei non fusibilis mollificatio ad liquefactionem. Ex hoc igitur manifestum
    est, quod causa inventionis huius fuit, ut quod ingressionem ex privatione suae liquefactionis non
    habebat in corpus, ad alterationem mollificaretur ut flueret, et ingressionem haberet. Ideo putaverunt
    aliqui, cerationem debere de oleis liquidis et aquis fieri. Sed erroneum est illud, et a principiis
    huius magisterii naturalis semotum penitus, et ex manifestis naturae operibus reprobatum. Naturam
    enim non videmus in ipsis corporibus metallicis humiditatem cito terminabilem, imo diu durabilem,
    ad illorum fusionis et mollificationis necessitatem posuisse. Si enim talem illis posuisset, relinqueretur
    necessario, ut citissime scilicet ignitione una, corpora totaliter humiditate privari contingeret.
    Quare ex illo sequeretur, post unam ignitionem corpus quodlibet nec malleari, nec fundi posse.
  translation_ja: 蝋化とは、硬く溶融しない物を、液化へ向けて柔らかくすることである。したがって、その発見の原因は明らかである。液化できないため金属体へ浸透できなかった物を、変質を起こすために柔らかくし、流動して浸透できるようにすることにあった。それゆえ、ある者たちは、蝋化は液状の油と水を使って行うべきだと考えた。しかし、これは誤りであり、この自然の術の原理からまったく離れ、自然の明らかな働きによって否定される。自然が金属体に、それらの溶融と軟化のために必要な湿りを与えるとき、すぐに尽きる湿りを置いたとは見られず、むしろ長く持続する湿りを置いているからである。もし、すぐに尽きるような湿りを置いていたなら、金属体はきわめて速く、すなわち一度の赤熱で、湿りを完全に奪われることになる。そうなれば、一度赤熱させた後は、どの金属体も鍛打できず、溶融もできないという結果になる。
  notes: []
  source_printed_page: 124
  source_pdf_page: 144
  source_erara_pdf_page: 149
- id: geber-summa-b01-c055-002
  section_id: geber-summa
  book: 1
  chapter: 55
  kind: body
  source_la: Quamobrem imitantes naturae opera in quantum possumus, necesse est nos modum naturae in cerando
    sequi. Cerat autem ipsa in radice cerationis fusibilium humiditate, quae super omnes est humiditates,
    expectans ignis calorem. Igitur etiam nos consimili cerare humiditate necessario expedit. In nullis
    autem rebus melius et possibilius, et propinquius haec humiditas cerativa invenitur, quam in his,
    videlicet sulphure et arsenico propinque, propinquius autem et melius in argento vivo. Horum igitur
    humiditatem non videmus terram illorum relinquere, propter fortem unionem, quam in opere mixtionis
    naturae habuerunt. In omnibus autem rebus aliis humiditatem habentibus, experimento invenies, eam
    in resolutione a terrea sua substantia separari, et post illius separationem omni humiditate privari.
    In spiritibus autem praedictis hoc minime contingit. Ideoque non est aliud, per quod ab illorum in
    cerando, acceptione excusari possimus.
  translation_ja: それゆえ、できるかぎり自然の働きに倣う私たちは、蝋化においても自然の方法に従わなければならない。自然は、溶融する物の蝋化の根底で、あらゆる湿りのうち最も火の熱に耐える湿りによって蝋化する。したがって、私たちも、同様の湿りによって蝋化する必要がある。この蝋化する湿りは、次の物のうちに、最もよく、最も可能に、最も直接に見いだされる。すなわち、硫黄と砒素性物質のうちに近く見いだされるが、水銀のうちには、さらに直接に、よりよく見いだされる。これらの湿りが、その土を離れることは見られない。自然の混合の働きにおいて得た結合が、強いからである。湿りをもつ他のすべての物では、分解する際に、その湿りが土的実体から分離し、分離の後、その実体があらゆる湿りを奪われることが、経験によって分かるであろう。しかし、前述の精気では、こうしたことは起こらない。したがって、蝋化において、それらを用いずに済ませられるような、別の物はない。
  notes:
  - expectans ignis calorem は、湿りが火の熱に持ちこたえるという本章の文脈に従って訳した。
  source_printed_pages:
  - 124
  - 125
  source_pdf_pages:
  - 144
  - 145
  source_erara_pdf_pages:
  - 149
  - 150
- id: geber-summa-b01-c055-003
  section_id: geber-summa
  book: 1
  chapter: 55
  kind: body
  source_la: Modus ergo Cerationis est per illos, ut totiens super rem cerandam multiplicetur eorum sublimatio,
    quousque in illa cum humiditate sua manentes, fusionem bonam praestent. Hoc autem non fiet ante illorum
    perfectam mundationem, ab omni re corrumpente. Sed mihi melius videtur, ut eorum olea prius figantur,
    per oleum tartari, et cum illis fiat omnis ceratio competens, et necessaria ad hanc artem.
  translation_ja: したがって、それらを使う蝋化の方法は、蝋化する物に対して、それらの昇華を何度も繰り返すことである。それらが、自らの湿りとともに対象の中に留まり、良好な溶融をもたらすまで続ける。ただし、それらから、物を損なうあらゆるものを完全に取り除くまでは、これは起こらない。しかし私には、まずそれらの油を酒石油によって固定し、その油を用いて、この術に適合し、必要となるすべての蝋化を行うほうがよいと思われる。
  notes:
  - 酒石油（oleum tartari）は歴史的調製物名であり、現代的な油脂の意味に限定しない。
  source_printed_page: 125
  source_pdf_page: 145
  source_erara_pdf_page: 150

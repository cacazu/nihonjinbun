- id: geber-summa-b02-c065-004
  section_id: geber-summa
  book: 2
  chapter: 65
  kind: body
  source_la: 'Fixio vero harum duarum substantiarum, ad firmam approximat fixionem: non autem fixa propterea
    est perpetuo. Et huius est probatio, ipsius corporis calcinatio: et post calcinationem ad fortissimum
    ignem expositio. Nam per eum non fiet divisio, sed tota ascendet substantia: purificata tamen magis.
    Videmus ergo substantiam sulphuris in stanno adurentem facilius separari, quam in plumbo. Et huius
    experimentum vides per facilem Iovis indurationem, calcinationem, et meliorationem sui fulgoris. Ideoque
    consideravimus haec corrumpentia in radice illius non fuisse, sed ei postea advenerunt. Et quia in
    prima commixtione non fuerunt illi multum coniuncta, ideo facile possunt separari. Ideoque alterationes
    in eo sunt velocis operis, mundificatio videlicet, induratio, et illius fixio. Et harum causas per
    ea quae iam a nobis tradita sunt, manifeste considerare potes. Et quia post has operationes, calcinationem
    scilicet et reductionem, consideravimus in fumo suo per magnam elevationem, et ignis expressionem,
    et vidimus illum ad citrinitatem pertingere, cum hoc sit de proprietate Sulphuris calcinati, estimavimus
    estimatione vera, in qua fuimus certificati, sulphuris fixi naturam illud secum multam continere.
    Qui igitur voluerint in hac nostra scientia videre veritatem, investigationem horum omnium perstudeant
    cum sedulitate operis, donec per eam principia ipsorum corporum, et proprietatem spirituum inveniant
    inventione certa non coniecturali: quam tradidimus, in hoc nostro volumine sufficienter ad artis exigentiam.'
  translation_ja: この二つの実体の固定は、堅固な固定に近いが、それによって永久に固定されたわけではない。その証拠は、金属体そのものを焼成し、その後、きわめて強い火にさらすことで得られる。その火によって分離は起こらず、実体全体が上昇するが、いっそう精製される。したがって、焼損をもたらす硫黄の実体は、鉛からより錫からのほうが容易に分離されることが分かる。その実験的な証拠は、錫が容易に硬化し、焼成され、光沢が改善することである。そこで私たちは、これらの腐敗をもたらすものは、錫の根源にはなく、後から加わったと考えた。最初の混合のときに、錫と強く結合していなかったので、容易に分離できるのである。そのため、錫の変化、すなわち浄化、硬化、固定は、速やかな操作で生じる。その原因は、すでに述べたことから、明白に考察できる。また、焼成と還元というこれらの操作の後、強い上昇と火の強制作用によって生じる煙を観察すると、黄色に達するのを見た。これは焼成された硫黄の特性なので、錫が固定された硫黄の本性を多く含むと、真実の判断を下し、その判断を確証した。したがって、この私たちの学知において真実を見ようとする人々は、勤勉に操作しながら、これらすべてを熱心に探究しなさい。そして、推測ではなく確かな発見によって、金属体の原理と精気の特性を見いだすまで続けなさい。私たちは、この書物において、術の必要に十分なだけ、それを伝えた。

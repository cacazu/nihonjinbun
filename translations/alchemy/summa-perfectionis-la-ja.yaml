- id: geber-summa-b01-c052-001
  section_id: geber-summa
  book: 1
  chapter: 52
  kind: body
  source_la: De Solutione sermo noster ampliatus innuit, solutionem rei siccae in aquam esse reductionem.
    Dicimus igitur, quod omnis solutionis perfectio adducitur cum aquis subtilibus, et maxime acutis,
    et acribus, et ponticibus, fecem nullam habentibus, sicut est acetum distillatum, et uva acerba, et
    pira multae acritudinis, et mala Granata similiter distillata, et his similia. Fuit autem causa inventionis
    eius subtiliatio eorum, quae nec fusionem nec ingressionem habent, de quibus magna utilitas amittebatur
    spirituum fixorum, et eorum, quae ipsorum naturae sunt. Nam omne quod solvitur, necesse est salis,
    aut aluminis, vel eorum consimilium naturam habere. Est autem natura eorum, quod fusionem dant, ante
    illorum vitrificationem. Ergo et spiritus soluti fusionem praestabunt similiter similem. Cum ergo
    multum ex natura sua corporibus et sibi invicem conveniant, habita fusione, necesse est per illam
    corpora penetrare, et penetrando transmutare.
  translation_ja: 溶解について詳しく述べるなら、溶解とは乾いた物を水へ戻すことである。そこで私たちはこう言う。すべての溶解の完成は、微細で、きわめて鋭く、刺激が強く、渋味をもち、滓のまったくない水によってもたらされる。たとえば蒸留した酢、未熟な葡萄、非常に酸っぱい梨、同様に蒸留した柘榴、およびこれらに似た物である。溶解の発見の原因は、溶融する力も浸透する力もない物を微細にすることにあった。これらの力がなければ、固定された精気と、それと同じ本性をもつ物から得られる大きな効用が失われてしまう。溶解する物はすべて、塩、明礬、あるいはそれらに似た物の本性をもたなければならない。それらは、ガラス化する前に溶融する本性をもっている。したがって、溶解された精気も、同じような溶融を示すであろう。精気は、その本性上、金属体と、また互いに非常によく適合しているので、溶融性を得れば、それによって金属体へ浸透し、浸透することで変成するはずである。
  notes:
  - aquis はここでは単なる水だけでなく、酢や果実由来の液など、操作に用いる液体を含む。
  source_printed_pages:
  - 111
  - 112
  source_pdf_pages:
  - 131
  - 132

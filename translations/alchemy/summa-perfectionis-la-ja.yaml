transcription_policy: 原刊画像と照合した読書用ラテン語転記。長いs、合字、u/v・i/j、略号、行末分割、句読点は読みやすく整理した。原刊の正誤表に従う修正は該当単位に注記した。難読語、原文の不整合、解釈に幅のある箇所は訳注で明示し、別版から無断で本文を補わない。
translation_policy: この版のために新たに作成した日本語の全文訳。要約に置き換えない。惑星名による金属の呼称、歴史的鉱物名、象徴語は安易に現代化学の単一物質へ同定しない。単位や操作は歴史的記述の翻訳であり、実験・医療の実行を勧めるものではない。

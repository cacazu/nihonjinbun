- id: geber-summa-b02-c067-title
  section_id: geber-summa
  book: 2
  chapter: 67
  kind: heading
  source_la: Uniuscuiusque corporis imperfecti, similiter et argenti vivi necessario fore duplicem medicinam,
    unam scilicet ad album, alteram vero ad rubeum, quibus tamen omnibus excusamur per unicam perfectissimam.
    Cap. LXVII.
  translation_ja: 第67章　各々の不完全な金属体にも、水銀にも、白化用と赤化用の二つの薬が必ず必要となるが、ただ一つの最も完全な薬が、それらすべての代わりを果たすこと。
  notes: []
  source_printed_page: 150
  source_pdf_page: 170
  source_erara_pdf_page: 175
- id: geber-summa-b02-c067-001
  section_id: geber-summa
  book: 2
  chapter: 67
  kind: body
  source_la: Probamus igitur, spiritus corporibus magis assimilari, per hoc, quod magis corporibus uniuntur
    et amicabilius, quam alia in natura. Per hoc ergo adductum est nobis inventione prima, hos esse corporum
    alterationis medicinam veram. Ideoque omni quo potuimus ingeniorum genere nos ipsos exercuimus, ut
    per illos, imperfectorum unumquodque corporum, mutatione firma in perfectum lunare et solare transformaremus
    corpus. Quamobrem ex eisdem medicinam diversam ex diversa alterandorum intentione creari necesse accidit.
    Cum sint igitur duplicis generis metalla alterationis, argentum vivum scilicet perfectione coagulabile,
    et a perfectione diminuta corpora, et haec iterum multiplicia, alia quidem dura ignibilia, alia vero
    mollia non ignibilia, dura quidem ignibilia, ut Mars et Venus, mollia vero, ut Iupiter et Saturnus,
    necesse est et materiam similiter perfectivam multiplicem esse.
  translation_ja: 精気が金属体にいっそうよく似ていることは、自然にある他のものよりも、金属体と強く、親和的に結び付くことによって証明される。したがって、私たちの最初の発見によって、これらの精気が金属体を変化させる真の薬であることが示された。そこで私たちは、可能なあらゆる工夫を尽くして、精気によって、各々の不完全な金属体を、確かな変化によって完全な銀または金の金属体へ変成させようと努めた。そのため、変化させる対象についての異なる目的に応じて、精気から異なる薬を作る必要が生じた。変化の対象となる金属は、完全化によって凝固させられる水銀と、不完全な金属体との二種類である。後者はさらに分かれ、鉄や銅のように硬く赤熱するものと、錫や鉛のように柔らかく赤熱しないものとがある。したがって、完全化する材料も、同じく複数でなければならない。
  notes:
  - 原刊正誤表151頁2行に従い「hoc esse」を「hos esse」とし、精気を指す複数形として訳した。
  source_printed_pages:
  - 150
  - 151
  source_pdf_pages:
  - 170
  - 171
  source_erara_pdf_pages:

- id: geber-summa-b01-c002-title
  section_id: geber-summa
  book: 1
  chapter: 2
  kind: heading
  source_la: Divisio huius libri primi in quatuor partes. Caput II.
  translation_ja: 第2章　この第1巻の四部への区分。
  notes: *id001
  source_printed_page: 22
  source_pdf_page: 44
  source_erara_pdf_page: 49
- id: geber-summa-b01-c002-001
  section_id: geber-summa
  book: 1
  chapter: 2
  kind: body
  source_la: 'Ponemus igitur tibi breviter primo impedimenta omnia, quibus in opere impeditur artifex,
    ne verum finem adipiscatur, dicemus etiam conditiones artificis huius artis. Secundo vero disputabimus
    contra ignorantes et sophistas, qui propter suam ignorantiam et imperitiam, huius artis magisterium
    et proficuum inquirendo, artem interimunt, et eam nullam esse contendunt. Ponemus autem omnes rationes
    illorum, et postea ipsas destruemus evidentissime: ita ut prudentibus satis aperte patefiat, nullam
    illorum sophismata veritatem continere. Tertio disputabimus super principiis naturalibus, quae sunt
    de intentione naturae: et ibidem super modo generationis et mixtionis eorum adinvicem ab opere naturae,
    et super eorum effectu, secundum antiquorum philosophorum sententiam. Quarto vero monstrabimus principia,
    quae sunt ad intentionem huius nostri operis, in quibus imitari naturam possumus, et modum miscendi,
    et alterandi, scilicet congrua naturae cum causis suis, ad intentum nostri operis reducendis.'
  translation_ja: そこで、まず術者が作業において妨げられ、真の目的を得られなくなるすべての障害を、短く示そう。また、この術の術者に必要な条件を述べる。第二に、無知な者や詭弁家に反論する。彼らは、この術の奥義と実りを求めながら、自らの無知と未熟のために、この術を否定し、そんなものは存在しないと主張する。私たちは彼らのあらゆる論拠を示し、その後、それをきわめて明確に論破する。そうすれば、彼らの詭弁には真理が一つも含まれていないことが、分別ある人々に十分明らかになる。第三に、自然の意図に属する自然的原理を論じ、同じ箇所で、自然の働きによるそれらの生成と相互混合の仕方、またその結果を、古代の哲学者たちの見解に従って論じる。第四に、私たちの作業の目的に属する原理、すなわち私たちが自然を模倣できる原理を示す。また、自然にかなうものをその原因とともに私たちの作業の目的へと導く、混合と変質の方法を示す。
  notes: *id001
  source_printed_page: 22
  source_pdf_page: 44
  source_erara_pdf_page: 49

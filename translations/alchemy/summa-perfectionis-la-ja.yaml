- id: geber-summa-b02-c065-title
  section_id: geber-summa
  book: 2
  chapter: 65
  kind: heading
  source_la: De natura Iovis, sive Stanni. Caput LXV.
  translation_ja: 第65章　木星、すなわち錫の本性について。
  notes: []
  source_printed_page: 143
  source_pdf_page: 163
  source_erara_pdf_page: 168
- id: geber-summa-b02-c065-001
  section_id: geber-summa
  book: 2
  chapter: 65
  kind: body
  source_la: 'Hac igitur investigatione proposita, nostrum propositum sequentes innuimus, quod si sulphur
    fuerit in radice commixtionis, fixione pauca participans, album albedine non pura, non superans, sed
    superatum, cum argento vivo secundum partem fixo, secundum partem vero non fixo, albo non puro commixto,
    sequetur ex eo stannum. Et horum probationem per praeparationem invenies. Quia si stannum calcinaveris,
    senties ex illo sulphuris foetorem: quod signum est sulphuris non fixi. Et quia flammam non dat, ne
    putes illud fixum. Quia non propter fixionem, sed propter superantiam argenti vivi, in commixtione
    salvantis a combustione flammam non dat. Probatur itaque duplex in stanno sulphureitas: duplex item
    argenti vivi substantia. Una quidem sulphureitas quae est minus fixa, quia cum calcinatur foetet ut
    sulphur. Per primam probatur mixtionis experientia. Altera per continuationem illius in calce sua
    ad ignem, quam habet, quia magis fixa non foetet.'
  translation_ja: 以上の探究を踏まえ、本来の目的に従って述べよう。混合の根源にある硫黄が、わずかな固定を備え、不純な白さを持ち、優勢でなく劣勢であり、一部が固定され、一部が固定されていない、不純な白い水銀と混ざるなら、そこから錫が生じる。その証拠は、調製操作によって見いだせる。錫を焼成すると硫黄の悪臭が感じられ、これは固定されない硫黄のしるしである。炎が出ないからといって、それが固定されていると思ってはならない。炎が出ないのは固定のためではなく、混合物の中で水銀が優勢で、燃焼から保護するためだからである。したがって、錫には二種類の硫黄性と、二種類の水銀の実体があると示される。一方の硫黄性は固定の程度が低く、焼成すると硫黄のような悪臭を放つ。最初の混合についての実験がこれを示す。他方は、その灰のまま火中に保ち続けることによって示される。それは、より固定されているため、悪臭を放たない。
  notes:
  - 原刊正誤表143頁21行に従い「qui cum」を「quia cum」とした。続く「Per primam probatur mixtionis experientia」は原刊の語順が難解であり、直前の実験による第一の硫黄性の証明として訳した。
  source_printed_page: 143
  source_pdf_page: 163
  source_erara_pdf_page: 168
- id: geber-summa-b02-c065-002
  section_id: geber-summa
  book: 2
  chapter: 65
  kind: body
  source_la: 'Probatur vero duplex argenti vivi substantia in illo, quarum una est non fixa, altera fixa:
    quia ante illius calcinationem stridet, post vero triplicem ipsius calcinationem non stridet, quod
    est, quia eius argenti vivi fugitivi substantia stridorem faciens evolavit. Quod vero argenti vivi
    substantia fugitiva sit causa stridorem faciens, probatur per lavationem plumbi cum argento vivo.
    Quia si cum argento vivo plumbum lavetur, et post lavacrum eius illud fuderis cum igne, non superante
    suae fusionis ignem, remanebit cum eo argenti vivi pars, quae plumbo stridorem adducit, et illud in
    stannum convertet. E converso vero, per mutationem stanni in plumbum illud considerare potes. Nam
    per multiplicem calcinationis reiterationem ad illud, et ignis illi magis convenientis ad reductionis
    administrationem, in plumbum convertitur, maxime vero cum per subtractionem suae scoriae cum magno
    calcinatur igne. Et de harum substantiarum diversitatibus certificari poteris per ingenia conservationis
    illarum in instrumentis propriis, et ignis modo eas dividentis: ad quem nos pervenimus cum instantia,
    et vidimus cum certificatione nostra, nos verum per illud estimasse.'
  translation_ja: 錫の中に、固定されないものと固定されたものという、二種類の水銀の実体があることも証明される。焼成前にはきしむ音を立てるが、三度焼成した後には音を立てないからである。それは、音を生じさせていた揮発性の水銀の実体が飛び去ったためである。揮発性の水銀の実体が音の原因であることは、鉛を水銀で洗浄することによって証明される。鉛を水銀で洗い、その後、鉛が溶ける以上に強くない火で溶融すると、水銀の一部が鉛とともに残り、鉛にきしむ音を与え、それを錫へ変える。逆に、錫を鉛へ変化させることからも、このことが考察できる。錫に焼成を幾度も繰り返し、還元操作にいっそう適した火を施すと、鉛へ変わる。とりわけ、滓を取り除きながら強火で焼成した場合にそうなる。これらの実体の相違は、それぞれに適した器具の中で保持する工夫と、それらを分ける火の扱いによって、確かめることができる。私たちは熱心な努力によってその方法に到達し、それによる判断が真実であったことを、自ら確証した。
  notes: []
  source_printed_pages:
  - 143
  - 144
  source_pdf_pages:

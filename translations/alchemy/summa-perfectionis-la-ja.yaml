- id: geber-summa-b01-c008-001
  section_id: geber-summa
  book: 1
  chapter: 8
  kind: body
  source_la: Quoniam summa una huius libelli nostri iam praemisimus tibi omnia huius operis impedimenta,
    et doctrinam tibi dedimus ad artis huius adhaerentiam sufficientem, expedit modo secundum nostri propositi
    intentionem contra sophisticos et ignorantes disputare. Primo ipsorum rationes ponentes, secundum
    quod promisimus a principio nos determinaturos esse. Ultimo vero eas omnes interimemus, ut manifesta
    demonstratione sapientibus patefiat, nihil veritatis illas continere.
  translation_ja: 本書の第一のまとまりにおいて、この作業の障害をすべてあらかじめ示し、この術に取り組むための十分な教えを与えた。そこでいま、予定した意図に従い、詭弁家と無知な者たちに反論するのが適切である。初めに約束したとおり、まず彼らの論拠を示す。その後、それらをすべて打ち破り、そこには真理が何も含まれないことを、明白な論証によって賢明な人々に明らかにする。
  notes: *id002
  source_printed_page: 30
  source_pdf_page: 52
  source_erara_pdf_page: 57
- id: geber-summa-b01-c009-title
  section_id: geber-summa
  book: 1
  chapter: 9
  kind: heading
  source_la: Rationes variae, artem simpliciter negantium. Caput IX.
  translation_ja: 第9章　この術を無条件に否定する者たちの、さまざまな論拠。
  notes: *id002
  source_printed_page: 30
  source_pdf_page: 52
  source_erara_pdf_page: 57
- id: geber-summa-b01-c009-001
  section_id: geber-summa
  book: 1
  chapter: 9
  kind: body
  source_la: 'Sunt autem diversi, qui eam negant et destruunt. Alii enim simpliciter, alii vero ex dictis
    a supponente eam esse. Sunt enim aliqui asserentes artem non esse simpliciter, suam opinionem sophistice
    taliter corroborantes, dicunt enim: Distinctae sunt rerum species et diversitates, quia diversae sunt
    et distinctae elementorum adinvicem in commixtione proportiones. Est enim asinus diversus ab homine
    in specie, quia multo diversam habuit elementorum in sui compositione proportionem: sic et in caeteris
    rerum diversitatibus est inducere, ergo et in mineralibus. Ignota igitur miscibilium proportione,
    qua adipiscitur forma, et rei perfectio, quomodo et mixtum et miscendum formare sciemus? Sed ignoramus
    Solis et Lunae veram elementorum proportionem, ergo et formare ipsa ignorare debemus. Ex his itaque
    concludunt: Igitur inutilis est ars ista et impossibilis.'
  translation_ja: この術を否定し、退ける者には、さまざまな者がいる。無条件に否定する者も、この術が存在すると仮定する者の発言に基づいて否定する者もいる。無条件に術の不在を主張する者は、次のような詭弁によって自説を補強する。彼らはいう。「事物の種と相違が区別されるのは、混合における元素相互の比率が、異なり、区別されているからである。ロバが人間と種において異なるのは、その組成における元素の比率が大きく異なるからである。他の事物の相違についても同じように推論でき、したがって鉱物についても同様である。それゆえ、形相と事物の完全性が得られる混合成分の比率を知らないなら、混合されたもの、また混合すべきものを、どう形成すればよいと分かるだろうか。しかし私たちは、太陽と月における元素の真の比率を知らない。したがって、それらの形成方法も知らないはずである。」以上から、彼らは「ゆえに、この術は無益で不可能である」と結論する。
  notes:
  - 本章の否定論は、著者が後で反駁するために列挙する議論。
  source_printed_pages:
  - 30
  - 31
  source_pdf_pages:
  - 52
  - 53
  source_erara_pdf_pages:
  - 57
  - 58
- id: geber-summa-b01-c009-002
  section_id: geber-summa
  book: 1
  chapter: 9
  kind: body
  source_la: 'Similiter etiam aliter arguunt, magisterium nostrum interimentes. Dicunt enim: Etsi proportionem
    elementorum scires, modum tamen mixtionis adinvicem eorum ignorares, quoniam in cavernis, et mineris,
    et absconsis locis haec natura procreat, ergo cum modum mixtionis eorum ignoras, et haec facere similiter
    ignoras. Similiter iterum arguunt: Etiamsi hoc debite scires, attamen in mixtionis actione ignorares
    calorem aequare agentem, quo mediante res ita perficitur. Certam enim habet natura caloris quantitatem,
    qua metalla in esse deducit, cuius mensuram ignoras. Similiter et alias naturae causarum differentias
    agentium ignoras, sine quibus non posset natura veraciter intentum perficere: his ergo ignoratis,
    et totus similiter agendi modus huius artis ignorabitur.'
  translation_ja: 同じように、別の仕方でも論じ、私たちの術を退ける。彼らはいう。「たとえ元素の比率を知っていても、その相互混合の仕方は知らないだろう。自然は、洞穴、鉱脈、隠れた場所でこれらを生み出すからである。したがって、その混合の仕方を知らない以上、それを行う方法も同様に知らない。」さらにこう論じる。「仮にそれを正しく知っていても、混合の働きにおいて、事物の完成を媒介する作用熱を、適切に均衡させることは知らないだろう。自然には金属を存在へ導く一定量の熱があるが、あなたはその尺度を知らない。また、自然に働く諸原因の、ほかの相違も知らない。それらがなければ、自然はその意図を真に完成できない。これらを知らない以上、この術の操作法全体も同様に知らないことになる。」
  notes:
  - 原刊正誤表（31頁・15行）に従い、「et haec facere」と読む。
  source_printed_page: 31
  source_pdf_page: 53
  source_erara_pdf_page: 58
- id: geber-summa-b01-c009-003
  section_id: geber-summa
  book: 1
  chapter: 9
  kind: body
  source_la: Praeterea etiam rationem et experientiam tibi adducunt. Tam diu enim, inquiunt, est a viris
    sapientibus haec perquisita scientia, ut si possibile esset ad eam per aliquam viam perveniri, iam
    eam millies complevissent. Similiter etiam, Cum philosophi visi sint in suis voluminibus eam tradere,
    nec tamen in eis veritatem reperiamus, manifestum satis per hoc est, et probabile, hanc scientiam
    non esse. Similiter et multi huius mundi Principes et Reges, thesaurum infinitum, et philosophorum
    copiam habentes, hanc artem adinvenire desideraverunt, non tamen ad hunc preciosissimae artis fructum
    pertingere potuerunt. Hoc utique satis sufficiens est argumentum, quod ars sit frivola probatione.
  translation_ja: さらに彼らは、理屈と経験も挙げる。「賢明な人々は、これほど長いあいだこの学知を探し求めてきた。もし何らかの道で到達できるなら、すでに千回も完成させていただろう」と彼らはいう。また、「哲学者たちは諸巻の中でそれを伝えているように見えるが、そこに真理を見いだせない。これによって、この学知が存在しないことは十分明白であり、もっともらしい。また、この世の多くの君主や王たちは、無尽蔵の財宝と多数の哲学者を持ち、この術の発見を望んだが、最も貴重な術の実りに到達できなかった。これは、この術が試してみれば空しいものであることを示す、十分な証拠である。」
  notes: *id002
  source_printed_pages:
  - 31
  - 32
  source_pdf_pages:
  - 53
  - 54
  source_erara_pdf_pages:
  - 58
  - 59
- id: geber-summa-b01-c009-004
  section_id: geber-summa
  book: 1
  chapter: 9
  kind: body
  source_la: 'Similiter etiam in debilibus mixtionibus specierum, sequi naturam non valemus. Asinum enim
    fingere ignoramus, et caetera similia, quarum mixtiones sunt debiles, et manifestae quasi sensibus.
    Quare et multo magis metallorum mixtionem (quae est fortissima) fingere ignorabimus: quae est etiam
    nostris sensibus et experientiis occultata penitus. Cuius signum est difficultas resolutionis elementorum
    ex ipsis. Similiter etiam non videmus bovem in capram transformari, nec aliquam aliam speciem, in
    aliam transmutari, vel per aliquod aliud artificium reduci. Quomodo igitur cum metalla differant specie,
    niteris invicem secundum speciem transformare, ut de tali specie talem speciem facias? Absurdum satis
    hoc nobis videtur, et a veritate illata ex principiis naturalibus semotum.'
  translation_ja: また、こういう。「私たちは、結びつきの弱い種類の混合においてさえ、自然に従うことができない。ロバを作る方法も、その混合が弱く、感覚にもほぼ明らかな他の類似のものを作る方法も、知らないのである。ならば、きわめて強い金属の混合を作る方法は、なおさら知らないであろう。しかも、それは私たちの感覚と経験から、すっかり隠されている。その証拠は、金属から元素を分離することの難しさである。また、牛が山羊に変成されたり、他の種が別の種に変えられたり、何らかの技によって別種へ導かれたりするのを、私たちは見ない。それゆえ、金属が種において異なるのに、どうして一方の種から他方の種を作るよう、相互に種を変成しようとするのか。これは私たちにはまったく不合理で、自然の原理から導かれる真理から離れているように見える。」
  notes: *id002
  source_printed_page: 32
  source_pdf_page: 54
  source_erara_pdf_page: 59
- id: geber-summa-b01-c009-005
  section_id: geber-summa
  book: 1
  chapter: 9
  kind: body
  source_la: 'Similiter etiam, in millibus annorum natura metalla perficit: quomodo autem tu in artificio
    transmutationis per annorum millia durare poteris? cum vix annorum centum metam pertingere valeas?
    Si tamen ad hoc ita responderetur: Quod non potest natura perficere in maximo temporis spacio, id
    in brevi per artificium nostrum implemus: quoniam artificium in multis naturae defectum complet. Dicimus
    iterum, quod et hoc impossibile est, et in metallis specialiter, cum sint fumi subtilissimi, qui temperata
    decoctione indigent, ut in seipsis secundum aequalitatem inspissetur humiditas propria, et non fugiat
    ab eis, et relinquat ipsa omni humiditate privata, qua contusionem et extensionem suscipiunt. Si igitur
    per artificium tuum volueris tempus decoctionis naturae in mineralibus, et metallicis corporibus abbreviare,
    oportebit per excessum caloris hoc facere, qui non adaequabit, sed potius humiditatem dissolvendo
    ex eorum corporibus dissipabit et destruet. Solus enim temperatus calor humiditatis est spissativus,
    et mixtionis perfectivus, non ignis excedens.'
  translation_ja: さらにこういう。「自然は数千年かけて金属を完成させる。百年にさえほとんど届かないあなたが、どうして変成の技を数千年続けられるのか。」これに対して、「自然が非常に長い時間をかけても完成できないことを、私たちの技によって短期間に成し遂げる。技術は多くの場合、自然の不足を補うからである」と答えたとしても、彼らは再びいう。「それも不可能であり、とくに金属についてそうである。金属はきわめて微細な煙から成り、適度の煮熟を要する。その固有の湿りが内部で均衡を保って濃密となり、逃げ去らず、打撃と延展を受け入れさせる湿りをすべて失うことがないようにするためである。もし技術によって、鉱物や金属体における自然の煮熟時間を短縮しようとすれば、過度の熱によって行うほかない。しかしそれは均衡させるのではなく、むしろ金属体から湿りを解放し、散逸させ、破壊する。湿りを濃密にし、混合を完成させるのは、穏やかな熱だけであり、過度の火ではない。」
  notes:
  - 原刊正誤表（33頁・9行）に従い、「qua contusionem et extensionem」と読む。
  source_printed_pages:

- id: geber-summa-b02-c064-002
  section_id: geber-summa
  book: 2
  chapter: 64
  kind: body
  source_la: 'Experimento itaque elicias secretum. Vides enim omnem rem caloris actione in terram mutatam,
    facilitate solvi, et ad aquae naturam redigi. Hoc autem contingit propter partium subtiliationem ab
    igne. Res igitur magis subtilis in natura propria ad hanc terream naturam reducta, magis subtiliatur.
    Igitur magis solvitur: ita et quae maxime, maxime. Ex his igitur patet causa corruptionis, et infectionis
    horum duorum corporum, Martis scilicet et Veneris: quia est per sulphur multae quantitatis fixum,
    et non fixum paucae in Venere, minimae vero in Marte. Cum igitur sulphur fixum in fixionem devenit
    per calorem ignis, eius partes subtiliantur: sed pars illa quae est in aptitudine solutionis suae
    substantiae solvitur: cuius signum est expositio horum duorum corporum ad vaporem aceti. Nam per illud
    floret in superficie illorum sulphuris eorum aluminositas, per calorem in illo creata subtiliativum.
    Et si posueris haec duo corpora in liquorem ponticum, solventur de facili per ebullitionem multae
    illorum partes. Et si respexeris in mineris horum duorum, manifesta invenies ex eis solutam aluminositatis
    substantiam distillare, et in illis adhaerere: quae aluminositas per ponticitatem et facilem solutionem
    in aquam mutatur. Non enim ponticum, et facile solubile reperitur aliud quam alumen, et quod illius
    naturae est.'
  translation_ja: そこで実験から秘奥を取り出しなさい。熱の作用によって土に変わったものはすべて、容易に溶解し、水の本性へ戻るのが見られる。これは、火によって各部分が精妙化するためである。したがって、元の本性において精妙なものほど、この土性の状態へ戻されると、いっそう精妙になる。それゆえ、いっそうよく溶解し、最も精妙なものは、最もよく溶解する。ここから、鉄と銅という二つの金属体の腐敗と汚染の原因が明らかになる。それは、多量の固定された硫黄と、銅では少量、鉄ではごく少量の固定されない硫黄による。固定された硫黄が火の熱によって固定に至ると、その部分は精妙化されるが、その実体のうち溶解に適した部分は溶解する。その証拠は、この二つの金属体を酢の蒸気にさらすことである。すると、その表面に硫黄の明礬性が花を吹くように現れる。この明礬性は、精妙化する熱によって生じたものである。また、この二つの金属体を渋味のある液に入れると、煮立てることにより、その多くの部分が容易に溶解する。両者の鉱床を調べれば、溶解した明礬性の実体がそこから滴り出て付着しているのを、明白に見いだせる。その明礬性の物は、渋味と容易な溶解性を備え、水へ変わる。渋味があり容易に溶けるものは、明礬と、その本性を持つ物以外には見いだされないからである。
  notes: []

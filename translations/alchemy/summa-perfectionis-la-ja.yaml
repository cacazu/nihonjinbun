- id: geber-summa-b01-c037-001
  section_id: geber-summa
  book: 1
  chapter: 37
  kind: body
  source_la: Martis vero narratio, et secretum illius totum est ex opere naturae, quia est corpus metallicum
    lividum multum, parum vero rubeum, albedine non pura participans, durum, ignibile, fusibile fusione
    non recta, sub malleo extensibile, et multum sonans. Est autem Mars durae tractationis, propter impotentiam
    suae fusionis, qui si medicina illius naturam immutante fundatur, coniungitur Soli et Lunae, et non
    separatur per examen, sine magna industria, sed si praeparatur, coniungitur, et non separatur per
    aliquod artificium, si eius natura fixionis non immutetur ab eo, sola remota immundicie illius. Est
    ergo tinctura rubedinis de facili, albedinis vero difficulter. Et cum coniungitur non alteratus, non
    immutat colorem commixti, sed auget illud in quantitate.
  translation_ja: マルスについての説明とその秘密全体は、自然の働きに由来する。それは青黒さが強く、赤さは少なく、純粋でない白さを帯び、硬く、赤熱し、適切とはいえない溶け方で溶融し、槌の下で延び、よく響く金属体だからである。溶融しにくいため、マルスは扱いが難しい。しかし、その本性を変える薬によって溶かすと、太陽と月に結合し、多大な工夫なしには試験でも分離されない。また、その固定性の本性を変えず、不純物だけを取り除くように調製すれば、結合した後、いかなる技によっても分離されない。それゆえ、赤の染色力には容易になるが、白の染色力にはなりにくい。変質させずに結合すると、混合物の色を変えず、ただ量を増す。
  notes: *id009
  source_printed_pages:
  - 70
  - 71
  source_pdf_pages:

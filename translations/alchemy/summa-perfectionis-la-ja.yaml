  image_path: figures/summa-p084-furnace.png
  image_alt_ja: 円筒形の炉、側面の通気孔と開口、穴のあいた蓋、および二つの容器を示す1541年刊本の木版図
- id: geber-summa-b01-c043-007
  section_id: geber-summa
  book: 1
  chapter: 43
  kind: body
  source_la: Similiter vero ex lignis eliciatur proportio, quoniam ligna solida fortem dant ignem, spongiosa
    vero debilem, sicca magnum et cito terminabilem, viridia parvum et multum durantem, et similiter solida
    multum durantem, spongiosa vero de facili terminabilem dant ignem. Consideratione ergo distantiae
    aludelis et magnitudinis et parvitatis auricularum, et spissitudinis et tenuitatis furni, et diversitatis
    lignorum praemissis, accidet omnium ignium diversitates perquiri, cum experientia sua vera. Ex conclusione
    vero maiore vel minore auricularum, vel fenestrae furni, per quam ligna intromittuntur, et administratione
    diversitatis lignorum, et additione et subtractione illorum, accidet inveniri determinatum spacium
    temporis durationis ignis, scilicet ut scientia determinata sciatur, quantum unusquisque ignis in
    suo gradu perdurare poterit in aequalitate. Et haec investigatio est maxime tibi utilis et necessaria,
    quoniam per eam excusaberis a multitudine laboris immensi. Exerciteris igitur in ea et in omnibus
    nobis nunc novissime determinatis, quia qui se exercuerit, inveniet, qui vero non, non.
  translation_ja: 同じように木材からも適度を見いだす。密な木は強い火を、海綿状の木は弱い火を与える。乾いた木は大きいが速く終わる火を、生木は小さいが長く続く火を与える。また密な木は長く、海綿状の木は短く燃える。それゆえ、前述のアルデルとの距離、通気孔の大小、炉壁の厚薄、木材の違いを考慮すれば、真の経験によって、あらゆる火の違いを探究できる。通気孔や薪を入れる炉の窓をどれほど閉じるか、種類の異なる木材をどう用いるか、その追加と減少をどう行うかによって、火の持続時間を定められる。それによって、各段階の火を、どれほどの時間、均等に保てるかを、明確に知ることができる。この探究は非常に有益で必要である。それによって、膨大な労力を免れるからである。だから、これと、いま最後に述べたすべてについて修練しなさい。修練する者は見いだし、しない者は見いださないのである。
  notes: *id012
  source_printed_pages:
  - 84
  - 85
  source_pdf_pages:
  - 104
  - 105
  source_erara_pdf_pages:
  - 109
  - 110
- id: geber-summa-b01-c044-title
  section_id: geber-summa
  book: 1
  chapter: 44
  kind: heading
  source_la: Ex qua materia et qua forma vas Aludel sit faciendum. Caput XLIIII.
  translation_ja: 第44章　アルデル容器を、どの材料と形で作るべきか。
  notes: &id013 []
  source_printed_page: 85
  source_pdf_page: 105
  source_erara_pdf_page: 110
- id: geber-summa-b01-c044-001
  section_id: geber-summa
  book: 1
  chapter: 44
  kind: body
  source_la: Intentio vero vasis Aludelis est, ut fingatur vas de vitro spissum. De alia enim materia
    non valet, nisi forte similis esset substantiae cum vitro spissum. Solum enim vitrum et ei simile,
    cum poris careat, potens est spiritus tenere ne fugiant et exterminentur ab igne. Alia autem materia
    nulla, quia per poros eorum successive diminuuntur et evanescunt spiritus. Nec metalla in hoc valent,
    quoniam spiritus propter amicitiam eorum et convenientiam illa penetrant et cum illis uniuntur, quare
    per illa transeuntes evanescunt, quod per ea, quae a nobis determinata sunt, aperte probatur. Necessario
    et experientia repertum est, hoc nos verum dixisse, ergo per aliquod non excusamur a susceptione vitri
    in compositione Aludelis.
  translation_ja: アルデル容器についての意図は、厚いガラスで容器を作ることである。他の材料では、ガラスと同じような実体を持ち、厚くできるものでないかぎり役に立たない。ガラスとそれに類するものだけが、孔を欠くため、精気が逃れ、火によって失われないよう保持できる。他の材料では、その孔を通して精気が徐々に減り、消え去るため、それはできない。金属も役立たない。精気は金属との親和性と適合性のため、それに浸透して結合し、通り抜けて消えるからである。これは、すでに定めた事柄によって明らかに証明される。経験によっても、私たちの言葉が真実であることが必然的に見いだされた。それゆえ、アルデルを作る際には、ガラスの使用を他の何かで代えることはできない。
  notes: *id013
  source_printed_pages:
  - 85
  - 86
  source_pdf_pages:
  - 105
  - 106
  source_erara_pdf_pages:
  - 110
  - 111
- id: geber-summa-b01-c044-002
  section_id: geber-summa
  book: 1
  chapter: 44
  kind: body
  source_la: Fingatur ergo concha vitrea rotunda, cuius fundus sit parvae curvitatis, et in medio spondilium
    eius formetur zona vitrea circundans eam, et super illam zonam fundetur paries rotundus aeque distans
    a conchae pariete ad grossitudinem cooperculi ipsius conchae, ita ut in distantia hac cadat paries
    coopertorii large sine pressura. Altitudo vero huius parietis sit ad mensuram altitudinis parietis
    conchae, aut paulo plus, aut paulo minus. Formetur vero duo coopertoria ad mensuram huius concavitatis
    duorum parietum, aequalia, quorum longitudo sit aequalis, et sit unius spannae, et figura eorum figura
    una, scilicet pyramidalis, in quorum capitibus duo aequalia sint foramina, unum scilicet in uno, alterum
    in altero, in quibus ambobus possit cadere maior gallinae penna, ut hic paulo post clarius cernere
    licebit.
  translation_ja: そこで、底がわずかに曲がった丸いガラスの鉢を作る。その側壁の中ほどに、周囲を取り巻くガラスの帯を設け、その帯の上に、鉢の壁から蓋の厚さだけ等しく離れた、円い外壁を立てる。この間隔に、蓋の壁が圧迫されず、ゆとりをもって入るようにする。この外壁の高さは、鉢の壁の高さと同じか、わずかに高いか低い程度とする。二つの壁の間のくぼみに合わせ、同じ大きさの蓋を二つ作る。高さはどちらも一スパンナ、形も同じ先細りの形とする。それぞれの頂部に同じ大きさの穴を一つずつ設け、どちらにも大きな鶏の羽軸が入るようにする。少し後の図で、さらに明らかに見ることができる。
  notes:
  - spanna は手を広げた幅に由来する歴史的尺度。本版は製作用の現代寸法に換算しない。
  source_printed_page: 86
  source_pdf_page: 106
  source_erara_pdf_page: 111
- id: geber-summa-b01-c044-003
  section_id: geber-summa
  book: 1
  chapter: 44
  kind: body
  source_la: Est ergo conchae vasis intentio, ut possit moveri secundum artificis voluntatem coopertorium
    illius, et quod iunctura sit ingeniosa, per quam sine lutatione aliqua non pateat spiritibus egressio.
    Qui ergo in hoc potest magis ingeniari, non excuset se ab hoc per nostram traditionem. Et est specialis
    intentio super hoc, scilicet ut concha interior cum spondilibus suis usque ad medium subintret coopertorium
    suum. Cum enim fumorum sit ascendere et non descendere, per hoc invenimus inventione prima, spiritus
    non habere ad consumptionem exitum, et propter hoc excellit modos alios, quos inventione nostra quaesivimus.
    Et hoc experiendo, videbit nos verum aestimasse de illo.
  translation_ja: 鉢形の容器の意図は、術者の望むままに蓋を動かせ、しかも巧みな継ぎ目によって、泥で封じなくても精気の出口が開かないようにすることである。この点でさらによい工夫のできる者は、私たちの教えを口実に、それを怠ってはならない。とくに重要なのは、内側の鉢がその側壁とともに、蓋の中ほどまで入り込むことである。煙は昇り、下らないので、この最初の工夫によって、精気が失われる出口を持たないことを見いだした。それゆえ、私たちが探究した他の方法より優れている。これを試す者は、この容器についての私たちの判断が正しかったことを知るだろう。
  notes: *id013
  source_printed_pages:
  - 86
  - 87
  source_pdf_pages:
  - 106
  - 107
  source_erara_pdf_pages:
  - 111
  - 112
- id: geber-summa-b01-c044-004
  section_id: geber-summa
  book: 1
  chapter: 44
  kind: body
  source_la: Intentio vero et una est, ut saepissime evacuetur aludelis caput, ne prae nimia sublimandorum
    multiplicatione in illud, cadat ad illius fundum, et detineat multitudo reiterationis sublimationis
    occupatum longo tempore. Est et similiter intentio altera, ut semper seorsum separetur, quod sursum
    ad propinquitatem foraminis capitis aludel ascendit in pulvere, ab eo quod fusum et densum in frustis,
    et apud fundum illius, pervium et clarum, cum adhaerentia ad vasis spondilia conscendisse invenitur,
    quoniam hoc minus habet de adustione, quam quod prope foramen reperitur scandisse. Hoc autem in superioribus
    aperta probatur ratione videlicet, et experimento.
  translation_ja: もう一つの意図は、アルデルの頭部を頻繁に空にすることである。昇華物が頭部に過度にたまると、底へ落ち、昇華を何度も繰り返すために長時間を費やすことになるからである。また別の意図は、頭部の穴の近くまで粉として昇ったものを、溶けて濃密な塊となり、頭部の下方に、透けて明るく、容器の側壁に付着しているものから、常に別々に分けることである。後者は、穴の近くへ昇ったものより焼損性が少ない。このことは、先の箇所で、明白な理由と試験によって証明されている。
  notes: *id013
  source_printed_page: 87
  source_pdf_page: 107
  source_erara_pdf_page: 112
- id: geber-summa-b01-c044-005
  section_id: geber-summa
  book: 1
  chapter: 44
  kind: body
  source_la: Probatio vero bonitatis et perfectionis sublimationis est iam dicta. Et est, ut inveniatur
    clara et lucida, et non aduratur cum inflammatione. Haec est ergo perfectio intentionum sublimationis,
    sulphuris videlicet et arsenici. Et si non inventa est sic, reiteretur opus super illa, cum consideratione
    omnium suarum intentionum, quousque sic inveniatur.
  translation_ja: 昇華の良否と完成を調べる方法は、すでに述べた。それは、明るく輝き、炎を上げて焼けないことを確かめることである。これが、硫黄と砒素性物質の昇華の目的の完成である。そうした状態が得られていなければ、そのすべての目的を考慮しながら、得られるまで作業を繰り返す。
  notes: *id013
  source_printed_page: 87
  source_pdf_page: 107
  source_erara_pdf_page: 112

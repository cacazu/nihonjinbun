- id: geber-summa-b02-c063-title
  section_id: geber-summa
  book: 2
  chapter: 63
  kind: heading
  source_la: De natura Martis, sive Ferri. Item de effectibus Sulphuris, et Mercurii, deque causis corruptionis,
    et perfectionis. Cap. LXIII.
  translation_ja: 第63章　火星、すなわち鉄の本性について。また硫黄と水銀の作用、および腐敗と完全性の原因について。
  notes: []
  source_printed_page: 136
  source_pdf_page: 156
  source_erara_pdf_page: 161
- id: geber-summa-b02-c063-001
  section_id: geber-summa
  book: 2
  chapter: 63
  kind: body
  source_la: Si vero fuerit sulphur fixum terreum, argento vivo fixo terreo commixtum, et haec ambo non
    purae, sed lividae albedinis fuerint, cuius superantiae quantitas sit sulphuris fixi summe, fit ex
    his ferrum. Quoniam superantia sulphuris fixi fusionem prohibet. Ideoque ex hoc relinquitur, sulphur
    velocius liquefactionis festinantiam per opus fixionis perdere, quam argentum vivum. Non fixum vero
    videmus citius quam argentum vivum liquescere. Ex his vero manifestatur causa velocitatis fusionis
    et tarditatis in corporum unoquoque. Nam quod plus de fixo habet sulphure, tardius, quod vero plus
    de adurente, facilius et citius fusionem suscipit. Quod satis aperte relinquitur a nobis esse monstrandum.
  translation_ja: 土性の固定された硫黄が、同じく土性の固定された水銀と混ざり、両者とも純白ではなく鉛色がかった白さを持ち、その中で非常に強く固定された硫黄の量が優勢であるなら、鉄が生じる。固定された硫黄の優勢は溶融を妨げるからである。したがって、硫黄は固定の操作によって、水銀より早く、速やかに液化する性質を失うと結論される。固定されていない硫黄は、水銀より速く溶けるのが見られる。ここから、それぞれの金属体で溶融の速さと遅さが生じる原因が明らかになる。固定された硫黄を多く持つものは遅く溶け、焼損をもたらす硫黄を多く持つものは、より容易に、より速く溶ける。これを、十分に明らかに示すことが、私たちに残されている。
  notes: []
  source_printed_pages:
  - 136
  - 137
  source_pdf_pages:
  - 156
  - 157
  source_erara_pdf_pages:
  - 161
  - 162
- id: geber-summa-b02-c063-002
  section_id: geber-summa
  book: 2
  chapter: 63
  kind: body
  source_la: Quod vero ipsum fixum tardiorem faciat fusionem, manifestatur per hoc, quod ipsum nunquam,
    nisi calcinetur, figitur, et calcinatum nullam dat fusionem. Ergo in omnibus illam impedire debet.
    Quod vero nisi calcinetur non figatur, patet experimento illius, qui illud figit non calcinatum, quoniam
    ipsum invenit semper fugere, donec in terram vertatur. Cuius similitudo est calcis naturae. Hoc autem
    minime in argento vivo contingit, quoniam figi potest absque hoc, quod in terram vertatur, et figi
    similiter cum conversione illius in terram potest. Nam per festinationem ad eius fixionem, quae per
    praecipitationem perficitur, figitur, et in terram mutatur. Per successivam vero illius iterata vice
    sublimationem figitur similiter, et non in terram vertitur, imo fusionem dat metallicam. Hoc autem
    manifestum est, et illi probatum, qui utrasque fixiones illius expertus est, usque in illius consummationem
    per festinam praecipitationem, et tardam, per successivas sublimationes. Vidit enim et invenit sic,
    ut a nobis scriptum suscepit.
  translation_ja: 固定された硫黄が溶融を遅くすることは、硫黄が焼成されなければ決して固定されず、焼成されるとまったく溶融しないことから明らかである。したがって、どの物の中でも溶融を妨げるはずである。焼成しなければ固定されないことは、焼成せずに固定しようとした人の実験から分かる。土に変わるまでは、絶えず揮散するのが認められるからである。その土は、石灰の本性に似ている。しかし水銀では、これはまったく同じではない。水銀は土に変えなくても固定でき、土へ変えながら固定することもできる。沈降によって達成される急速な固定では、固定されるとともに土へ変わる。これに対して、次々と昇華を繰り返す方法でも同様に固定されるが、土へは変わらず、むしろ金属的な溶融を示す。このことは、急速な沈降と、連続する昇華による緩やかな方法という、二通りの固定を完成に至るまで試した人には、明白であり、確証されている。その人は、私たちの記述のとおりに観察し、見いだしたからである。
  notes: []
  source_printed_page: 137
  source_pdf_page: 157
  source_erara_pdf_page: 162
- id: geber-summa-b02-c063-003
  section_id: geber-summa
  book: 2
  chapter: 63
  kind: body
  source_la: 'Et illud ideo, quoniam viscosam et densam habet substantiam: cuius signum est contritio
    illius, cum imbibitione et mixtione cum rebus aliis. Sentitur enim in illo manifeste viscositas illius
    per multam adhaerentiam. Densam autem substantiam illud habere, manifeste videt monoculus per illius
    aspectum, et per ponderationem sui immensi ponderis. Auro enim praeponderat, cum in natura sua est,
    et est similiter fortissimae compositionis, ut narratum est. His igitur relinquitur, ipsum posse figi
    sine illius humiditatis consumptione, et absque in terram conversione. Propter enim bonam partium
    adhaerentiam, et fortitudinem suae mixtionis, si quo modo partes illius inspissentur per ignem, ulterius
    non permittit se corrumpi, neque per ingressionem fumosae flammae in illud se in fumum ulterius elevari
    permittit: quoniam rarefactionem sui non patitur, propter suam densitatem et carentiam adustionis,
    quae per sulphureitatem combustibilem, quam non habet, perficitur.'
  translation_ja: その理由は、水銀が粘り気のある緻密な実体を持つことにある。その証拠は、他の物と湿潤混合しながらすり潰す際に見られる。強く付着することによって、その粘性が明白に感じられるからである。また、その外観と莫大な重さを量ることによって、片目しかない者にも、緻密な実体を持つことは明らかである。水銀は、その本来の状態では金より重く、また、述べたように、きわめて強固な組成を持つ。したがって、水銀は湿り気を消費せず、土へ変えることもなく、固定できると結論される。その各部分がよく付着し、混合が強固なので、何らかの仕方で火により部分が濃密になると、それ以上は腐敗せず、煙を含む炎が内部へ入っても、もはや煙として上昇することを許さない。その緻密さのために希薄化を受けず、また、水銀にはない可燃性の硫黄性によって生じる焼損を持たないからである。
  notes:
  - 「水銀は金より重い」は原文の主張をそのまま訳したもので、現代の密度比較へ訂正していない。
  source_printed_pages:
  - 137
  - 138
  source_pdf_pages:
  - 157
  - 158
  source_erara_pdf_pages:
  - 162
  - 163
- id: geber-summa-b02-c063-004
  section_id: geber-summa
  book: 2
  chapter: 63
  kind: body
  source_la: 'Per hoc igitur inventum est inventione veridica duorum secretorum genus mirabile duplex.
    Unum scilicet, Causae corruptionis uniuscuiusque metallorum per ignem: quarum una est inclusio adurentis
    sulphureitatis in illorum substantiae profundo, per inflammationem illa diminuentis, et exterminantis
    in fumum ultima consumptione, quantumcunque in illis argentum vivum bonae fixionis extiterit. Altera
    vero est multiplicatio flammae exterioris super illa penetrantis, et secum in fumum resolventis, cuiuscunque
    fixionis in eis ipsum sit. Tertia vero est rarificatio ipsorum per calcinationem. Tunc enim flamma
    vel ignis in illa penetrare potest, et ipsa exterminare. Si igitur omnes corruptionis causae conveniant,
    maxime corpora corrumpi necesse est. Si vero non omnes, remittitur corruptionis velocitas uniuscuiusque
    corporis, secundum remissionem illarum.'
  translation_ja: こうして、真実の発見によって、驚くべき二種の秘奥が見いだされた。一つは、各金属が火によって腐敗する原因である。その第一は、金属の実体の奥深くに焼損をもたらす硫黄性が含まれることである。それは発火によって金属を減少させ、最終的に煙へと消耗させ、消し去る。内部にどれほどよく固定された水銀があっても同じである。第二は、外部の炎が増大し、金属へ浸透し、水銀がどの程度固定されていようとも、金属を自らとともに煙へと解きほぐすことである。第三は、焼成によって金属体が希薄になることである。そうなれば、炎や火が内部へ浸透して、金属を消し去ることができる。したがって、すべての腐敗の原因がそろえば、金属体は最大限に腐敗するはずである。全部がそろわなければ、それらの原因が弱まる度合いに応じて、各金属体の腐敗速度も低下する。
  notes: []
  source_printed_pages:
  - 138
  - 139
  source_pdf_pages:
  - 158
  - 159
  source_erara_pdf_pages:
  - 163
  - 164
- id: geber-summa-b02-c063-005
  section_id: geber-summa
  book: 2
  chapter: 63
  kind: body
  source_la: 'Secundum genus est bonitas, quae per ipsum consideratur in corporibus. Quia igitur argentum
    vivum propter nullas causas exterminationis, se in partes compositionis suae dividi permittit (quia
    aut cum tota sua substantia ex igne recedit, aut cum tota in illo permanens stat) notatur in eo necessario
    perfectionis causa. Laudetur igitur benedictus et gloriosus Altissimus: qui creavit illud: deditque
    illi substantiam, et substantiae proprietates, quas non contingit ex rebus ullam in natura possidere,
    ut in illa possit inveniri haec perfectio, per artificium aliquod, quod in illo invenimus potentia
    propinqua. Ipsum enim est, quod ignem superat, et ab igne non superatur: sed in illo amicabiliter
    requiescit, eo gaudens.'
  translation_ja: 第二の秘奥は、水銀を通して金属体の中に認められる優良さである。水銀は、いかなる消滅の原因によっても、自らの組成を部分に分けることを許さない。実体全体を伴って火から去るか、実体全体を伴って火中に留まるか、そのいずれかだからである。したがって、水銀の中には、必然的に完全性の原因が認められる。水銀を創造し、実体と、その実体に固有の特性を与えた、祝福され栄光ある至高者を讃えよう。そのような特性は、他のいかなる物も自然には持たず、そこに何らかの技術によって、この完全性が見いだされることもない。水銀の中には、それを近い可能性として見いだすのである。水銀こそ、火に打ち勝ち、火に打ち負かされず、むしろ火の中で親しく憩い、火を喜ぶものである。
  notes: []
  source_printed_page: 139
  source_pdf_page: 159
  source_erara_pdf_page: 164
- id: geber-summa-b02-c064-title
  section_id: geber-summa
  book: 2
  chapter: 64
  kind: heading
  source_la: De natura Veneris, sive aeris. Cap. LXIIII.
  translation_ja: 第64章　金星、すなわち銅の本性について。
  notes: []
  source_printed_page: 139
  source_pdf_page: 159

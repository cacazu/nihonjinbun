    "printed_page": "105"
    "pdf_page": 125
  "translation_ja": "そこで私は白化を表すために、この二つの図を示した。まさにこの箇所で大きな助けを必要とする。ここでは誰もが欺かれるからである。この操作は、実際に迷宮である。一瞬に千の道が現れるうえ、終わりへ進むには、始めと正反対のことをしなければならない。先に溶かしたものを凝固させ、先に水にしたものを土にするのである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-126-01"
  "section_id": "FL-CH05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When thou hast made it white, then hast thou overcome the enchanted Bulles, that cast fire and smoake out of their nostrils. Hercules hath clensed the stable full of ordure, of rottennesse, and of blackenesse. Jason hath powred the decoction or broath, upon the Dragons of Colchos; and thou hast in thy power the horne of Amalthea, which (although it bee white) may fill thee all the rest of thy life with glory, honour, and riches. To have the which, it hath behoved thee to fight valiantly, and in manner of an Hercules; for this Achelous, this moist river, is indewed with a most mighty force, besides that hee often transfigures himselfe from one forme to another. Thus hast thou done all, because the rest is without difficultie:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "106"
    "pdf_page": 126
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "106"
    "pdf_page": 126
  "translation_ja": "これを白くしたなら、鼻から火と煙を吐く魔法の雄牛を征服したのである。ヘラクレスは、汚物と腐敗と黒さで満ちた厩を清めた。イアソンは、コルキスの竜へ煎じ汁、あるいは煮汁を注いだ。そしてあなたはアマルテイアの角を手にした。それは白いにもかかわらず、残りの生涯を栄光と名誉と富で満たしうる。これを得るには、ヘラクレスのように勇敢に戦わなければならなかった。このアケロオス、この湿った川は、きわめて強い力をもち、そのうえ、しばしば姿を変えるからである。こうしてあなたはすべてを行った。残りに困難はないからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-127-01"
  "section_id": "FL-CH05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These transfigurations are particularly described in the Booke of the seven Egyptian seales, where it is said (as also by all Authors) that the Stone, before it will wholly forsake his blackenesse, and become white in the fashion of a most shining marble, and of a naked flaming sword, will put on all the colours that thou canst possibly imagine, often will it melt, and often coagulate it selfe, and amidst these divers and contrary operations, (which the vegetable soule which is in it makes it performe at one and the same time) it will grow Citrine, greene, red, (but not of a true red) it will become yellow, blew, and orange colour, untill that being wholly overcome by drynesse and heate, all these infinite colours will end in this admirable Citrine whitenesse, of the colour of Saint Pauls garments, which in a short time will become like the colour of the naked sword; afterwards by the meanes of a more strong and long decoction, it will take in the end a red Citrine colour, and afterward the perfect redde of the vermillion, where it will repose it selfe for ever."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "107"
    "pdf_page": 127

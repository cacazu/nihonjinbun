- "id": "FL-049-02"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I may speake it with truth, I haue made it three times, with the helpe of Perrenelle, who vnderstood it as well as I, because she helped mee in my operations, and without doubt, if shee would haue enterprised to haue done it alone, shee had attained to the end and perfection thereof. I had indeed enough when I had once done it, but I found exceeding great pleasure and delight, in seeing and contemplating the Admirable workes of Nature, within the Vessels. To signifie vnto thee then, how I haue done it three times, thou shalt see in this Arch, if thou haue any skil to know them, three furnaces, like vnto them which serue for our opperations:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "29"
    "pdf_page": 49
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "29"
    "pdf_page": 49
  "translation_ja": "私は真実として言える。ペルネルの助けを借りて、これを三度行った。妻は作業を手伝っていたので、私と同じほどよく理解していた。独力で行おうと決意していれば、疑いなく完成に至ったであろう。一度成し遂げれば、私には実際それで十分であった。しかし容器の中で、自然の驚嘆すべき働きを見つめ、観想することに、このうえない喜びと楽しみを見いだしたのである。そこで私がそれを三度行ったことをあなたに示すため、このアーチには三つの炉が見えるはずである。それを見分けるだけの知識があるなら分かるが、われらの操作に用いるものと同じ炉である。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-050-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I was afraid a long time, that Perrenelle could not hide the extreme ioy of her felicitie, which I measured by mine owne, and lest shee should let fall some word amongst her Kindred, of the great treasures which wee possessed: for extreme ioy takes away the vnderstanding, as well as great heauinesse; but the goodnesse of the most great God, had not onely filled mee with this blessing, to giue mee a wife chaste and sage, for she was moreouer, not onely capeable of reason, but also to doe all that was reasonable, and more discreet and secret, than ordinarily other women are. Aboue all, shee was exceeding deuout, and therefore seeing her selfe without hope of children, and now well stricken in yeeres, shee began as I did, to thinke of God, and to giue or selues to the workes of mercy."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "30"
    "pdf_page": 50
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "30"
    "pdf_page": 50
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "30"
    "pdf_page": 50
  "translation_ja": "私は長い間、ペルネルが自分の幸福のあまりの喜びを隠しきれないのではないかと恐れていた。その喜びの大きさは、自分のそれから推し量っていた。また、われわれの持つ大いなる宝について、親族の間で何か口を滑らせないかと案じてもいた。極度の喜びは、深い悲しみと同じように判断力を奪うからである。しかし、至高の神の善意は、貞淑で賢い妻を与えるという祝福だけで私を満たしたのではなかった。妻はそのうえ、理を理解するだけでなく、理にかなうことをすべて実行でき、普通の女性たちよりも慎み深く、秘密を守ることのできる人であった。何よりきわめて信心深かった。それゆえ、子どもを持つ望みがなく、すでに年を重ねていることを知ると、私と同じように神に心を向け始め、二人で慈悲の業に身を捧げるようになった。"
  "translation_status": "draft"
  "source_kind": "prose"

  "translation_ja": "talentには、貨幣単位タラントンと神から託された賜物の両義があり、福音書の「タラントンの譬え」を踏まえる。"
  "translation_status": "draft"
- "id": "FL-057-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let him therefore, which hauing well weighed my words, and well knowne and vnderstood my figures, hath first gotten elsewhere the knowledge of the first beginnings and Agents, (for certainely in these Figures and Commentaries, he shall not finde any step or information thereof) perfect to the glory of God the Maistery of Hermes, remembring himself of the Church Catholike, Apostolike, and Romane, and of all other Churches, Churchyards, and Hospitals; and aboue all, of the Church of the Innocents in this Citie, (in the Churchyard whereof hee shall haue contemplated these true demonstrations) opening bounteously his purse, to them that are secretly poore, honest people desolate, weake women, widdowes, and forlorne orphanes. So be it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "37"
    "pdf_page": 57
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "37"
    "pdf_page": 57
  "translation_ja": "したがって、私の言葉をよく吟味し、図像をよく知って理解し、第一の始原と作用体についての知識をまずほかで得た者は、神の栄光のためにヘルメスの大業を完成させてほしい。この図像と注解の中には、それらについての手がかりも説明も、確かに見つからないからである。その際には、カトリックの、使徒継承の、ローマの教会をはじめ、ほかのすべての教会、墓地、救護院を忘れず、とりわけこの町の幼子殉教者の教会を思い起こしてほしい。その墓地で、彼はこれらの真実の実証を観想したはずだからである。そして、人知れず貧窮している者、見捨てられた正直な人々、弱い立場の女性、寡婦、身寄りのない孤児たちのために、惜しみなく財布を開いてほしい。そうありますように。"
  "translation_status": "draft"
  "source_kind": "prose"

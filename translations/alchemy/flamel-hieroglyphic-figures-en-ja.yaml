- "id": "FL-112-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is written in their Rowles, Homo veniet ad judicium Dei, that is, Man shall come to the Judgement of God: Verè (saith the woman) illa dies terribilis erit, that is, Truly that will be a terrible day. These are not passages of holy Scripture, but onely sayings which speake according to the Theologicall sence, of the Judgement to come."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "92"
    "pdf_page": 112
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "92"
    "pdf_page": 112
  "translation_ja": "二人の巻紙には「Homo veniet ad judicium Dei」、すなわち「人は神の裁きへ来る」と書かれている。女は「Verè illa dies terribilis erit」、すなわち「まことに、その日は恐るべき日となる」と語る。これらは聖書からの一節ではなく、来たる裁きについて、神学的な意味に従って語る言葉にすぎない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-113-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have put them there, to serve my selfe of them towards him, that beholds onely the grosse outward, and most naturall Artifice, taking the interpretation thereof to concerne onely the Resurrection; and also it may serve for them, that gathering together the Parables of the Science, take to them the eyes of Lynceus, to pierce deeper then the visible objects. There is then, Man shall come to the judgement of God: Certainly that day shall be terrible. That is as if I should have said; It behoves that this come to the colour of perfection, to bee judged & clensed from all his blacknesse and filth, and to be spiritualized and whitened."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "93"
    "pdf_page": 113
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "93"
    "pdf_page": 113
  "translation_ja": "私がその言葉を置いたのは、目に見える粗い外形と、ごく自然な技巧だけを見る人に対して用いるためである。そのような人は、意味を復活だけに関するものと解するだろう。同時に、この学の譬えを集め、リュンケウスの眼を得て、見える対象より深く見通す人にも役立つようにした。したがって、「人は神の裁きへ来る。確かに、その日は恐るべき日となる」とある。これは、こう述べたのと同じである。「これは完全の色に至り、裁かれて、その黒さと汚れをすべて取り除かれ、霊化され、白くされなければならない。」"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-114-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Surely that day will be terrible, yet certainly, as you shall find in the Allegory of Aristeus, Horror holds us in prison by the space of fourescore dayes, in the darknesse of the waters, in the extreme heate of the Summer, and in the troubles of the Sea. All which things ought first to passe, before our King can become white, comming from death to life, to overcome afterwards all his enemies. To make thee understand yet somewhat better this Albification, which is harder and more difficult then all the rest, (for till that time thou mayest erre at every steppe, but afterwards thou canst not except thou break thy vessels) I have also made for thee this Table following."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "94"
    "pdf_page": 114
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "94"
    "pdf_page": 114
  "translation_ja": "まことに、その日は恐るべき日となる。しかし確かに、『アリステウスの寓意』に見いだすとおり、「恐怖は八十日のあいだ、水の闇の中、夏の極暑の中、海の苦難の中で、私たちを牢に閉じ込める」。私たちの王が白くなり、死から生へ戻り、その後すべての敵を征服するには、まずこれらすべてが過ぎ去らなければならない。この白化は、ほかのすべてよりも困難である。それまでは一歩ごとに誤りうるが、その後は器を壊さないかぎり、誤ることはない。この白化をもう少しよく理解してもらうために、続く図もあなたのために作った。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-115-01"
  "section_id": "FL-CH05"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAP. V. The figure of a man, like that of Saint Paul, cloathed with a robe white and yellow, bordered with gold, holding a naked Sword, having at his feet a man on his knees, clad in a robe of orange colour, blacke and white, holding a roule."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "95"
    "pdf_page": 115
  "translation_ja": "第五章　金で縁取られた白と黄色の衣を着て、抜き身の剣を持つ、聖パウロに似た男の像。その足元には、橙色と黒と白の衣を着て、巻紙を持ち、跪く男がいる。"
  "translation_status": "draft"
- "id": "FL-116-01"
  "section_id": "FL-CH05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Marke well this man in the forme of Saint Paul, cloathed in a robe entirely of a yellowish white. If thou consider him well, he turnes his body in such a posture, as shewes that he would take the naked Sword, either to cut off the head, or to doe some other thing, to that man which is on his knees at his feete, cloathed in a robe of orange colour, white and blacke, which saith in his roule, DELE MALA QVÆ FECI, that is, Blot out all the evill which I have done; as if hee should say, TOLLE NIGREDINEM, Take away from me my blacknesse; A term of Art: for Evill signifieth in the Allegory, Blacknesse, as it is often found in Turba Phylosophorum: Seethe it untill it come to blackenesse, which will be thought Evill."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "96"
    "pdf_page": 116
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "96"
    "pdf_page": 116
  "translation_ja": "全身を黄みがかった白の衣で包み、聖パウロの姿をした、この男によく注意しなさい。よく見ると、彼は体をひねり、抜き身の剣を取り、足元に跪く男の首を切るか、何か別のことをしようとしている。跪く男は橙と白と黒の衣を着て、巻紙に「DELE MALA QVÆ FECI」、すなわち「私が行った悪をすべて消してください」と語る。これは「TOLLE NIGREDINEM」、すなわち「私から黒さを取り去ってください」といったのと同じであり、この術の用語である。寓意では「悪」が「黒さ」を意味するからである。『哲学者たちの集会』にも、「黒さに至るまで煮よ。それは悪と思われるだろう」という言い方がしばしば見られる。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-117-01"
  "section_id": "FL-CH05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But wouldest thou know what is meant by this man, that taketh the Sword? It signifies that thou must cut off the head of the Crow, that is to say, of the man cloathed in divers Colours, which is on his knees. I have taken this pourtrait and figure out of Hermes Trismegistus, in his Booke of the Secret Art, where he saith, Take away the head of this blacke man, cut off the head of the Crow, that is to say, Whiten our blacke."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "97"
    "pdf_page": 117
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "97"
    "pdf_page": 117
  "translation_ja": "では、剣を取るこの男が何を意味するか知りたいだろうか。それは、烏の頭、すなわち多くの色の衣を着て跪く男の頭を、切り落とさなければならないことを表す。この姿と図は、ヘルメス・トリスメギストスの『秘密の術の書』から取った。そこには、「この黒い男の頭を取り去れ。烏の頭を切り落とせ」とある。つまり、「私たちの黒いものを白くせよ」ということである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-118-01"
  "section_id": "FL-CH05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lambspringk that noble Germane, hath also used it in the Commentary of his Hieroglyphicks, saying, In this wood there is a Beast all covered with black, if any man cut off his head, he will loose his blacknesse, and put on a most white colour. Will you understand what that is? The blacknesse is called the head of the Crow, the which being taken away, at the instant comes the white colour: Then that is to say, when the Cloud appeares no more, this body is said to bee without a head. These are his proper words."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "98"
    "pdf_page": 118
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "98"
    "pdf_page": 118
  "translation_ja": "高名なドイツ人ラムスプリングも、『象形図の注解』でこれを用い、こう述べている。「この森には全身を黒く覆われた獣がいる。誰かがその頭を切り落とせば、獣は黒さを失って、きわめて白い色をまとうだろう。それが何を意味するか理解したいか。黒さは烏の頭と呼ばれ、それが取り除かれると、その瞬間に白い色が来る。つまり、もはや雲が現れなくなれば、この体は頭がないといわれるのである。」これが彼の実際の言葉である。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-119-01"
  "section_id": "FL-CH05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In the same sence, the Sages have also said in other places, Take the Viper which is called, De rexa, cut off his head, &c. that is to say, Take away from him his blacknesse. They have also used this Periphrasis, when to signifie the multiplication of the Stone, they have fained a Serpent Hydra, whereof, if one cut off one head, there wil spring in the place thereof ten; for the stone augments tenfold, every time that they cut off this head of the Crow, that they make it blacke, and afterwards white; that is to say, that they dissolve it anew, and afterward coagulate it againe."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "99"
    "pdf_page": 119
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "99"
    "pdf_page": 119
  "translation_ja": "賢者たちはほかの箇所でも、同じ意味で、「デ・レクサと呼ばれる毒蛇を取り、その頭を切り落とせ」などと述べた。すなわち、黒さを取り去れということである。また石の増殖を表す際にも、このような迂言を用いた。ヒュドラという蛇を物語り、頭を一つ切り落とすと、その場所から十の頭が生じるとしたのである。石は、この烏の頭を切り落とすたび、つまり黒くしてから白くするたび、言い換えれば、新たに溶かして再び凝固させるたびに、十倍へ増えるからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-120-01"
  "section_id": "FL-CH05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Marke how this naked Sword is wreathed about with a blacke girdle, and that the ends thereof are not so wreathed at all. This naked shining Sword, is the stone for the white, or the white stone, so often by the Phylosophers described under this forme. To come then to this perfect and sparkling whitenesse, thou must understand the wreathings of this blacke girdle, and follow that which they teach, which is the quantity of the imbibitions."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "100"
    "pdf_page": 120
  "translation_ja": "この抜き身の剣に黒い帯が巻きつけられ、その両端にはまったく巻かれていないことに注意しなさい。この輝く抜き身の剣は、白のための石、あるいは白い石であり、哲学者たちは幾度も、この姿で表してきた。したがって、この完全で輝く白さへ到達するには、黒い帯の巻き方を理解し、それが教えること、すなわち吸液の分量に従わなければならない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-120-01-tn-001-text"
  "section_id": "FL-CH05"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "imbibition は液を与え吸収させる操作を意味し、本版では「吸液」と訳す。"
  "translation_status": "draft"
- "id": "FL-120-02"
  "section_id": "FL-CH05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The two ends, which are not wreathed about at all, represent the beginning and the ending: for the beginning it teacheth that you must imbibe it at the first time gently and scarcely, giving it then a little milke, as to a little Child new borne, to the intent that Isir, (as the Authors say) be not drowned: The like must we doe at the end, when we see that our King is full, and will have no more."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "100"
    "pdf_page": 120
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "100"
    "pdf_page": 120
  "translation_ja": "何も巻かれていない両端は、始まりと終わりを表す。始まりについては、初回の吸液を静かに、ごく少量だけ行い、生まれたばかりの幼子に与えるように、少しの乳を与えるべきことを教える。著者たちのいうイシルを溺れさせないためである。終わりでも、王が満ち足り、もう欲しがらないことが分かったら、同様にしなければならない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-120-02-tn-001-text"
  "section_id": "FL-CH05"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "Isir は刊本の字形。エリクシルを指す異形と考えられるが、固有の語形を保った。"
  "translation_status": "draft"
- "id": "FL-121-01"
  "section_id": "FL-CH05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The middle of these operations is painted by the five whole wreathes, or rounds, of the blacke girdle, at what time (because our Salamander lives of the fire, and in the middest of the fire, and indeed is a fire, and an Argent vive, or quicksilver, that runnes in the middest of the fire, fearing nothing) thou must give him abundantly, in such sort that the Virgins milke compasse all the matter round about."
  "source_languages":
  - "en"

  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 16
  "translation_ja": "私たちの神、主の輝きが、私たちの上にありますように。私たちの手の業を、私たちの上に導いてください。私たちの手の業を導いてください。詩篇90・19。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-016-01-tn-001-text"
  "section_id": "FL-FRONT"
  "kind": "note_body"

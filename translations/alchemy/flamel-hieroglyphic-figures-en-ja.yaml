    "precision": "page"
    "printed_page": "103"
    "pdf_page": 123
  "translation_ja": "そこで、最も秘密を惜しむ者の一人は、こう述べた。「私たちの烏の頭は癩に冒されている。だから、それを清めようとする者は、再生の川ヨルダンへ七度沈めなければならない。預言者が、癩に冒されたシリア人ナアマンに命じたように。」ここには、わずか数日の始め、中ほど、そして同じくごく短い終わりが含まれている。"
  "translation_status": "draft"
  "source_kind": "prose"

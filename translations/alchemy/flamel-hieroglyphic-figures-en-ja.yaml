"segments":
- "id": "FL-008-01"
  "section_id": "FL-FRONT"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    Nicholas Flammel, His Exposition of the Hieroglyphicall Figures which he caused to bee painted upon an Arch in St. Innocents Church-yard, in Paris.
    Together with The secret Booke of Artephius, And The Epistle of John Pontanus: Concerning both the Theoricke and the Practicke of the Philosophers Stone.
    Faithfully, and (as the Majesty of the thing requireth) religiously done into English out of the French and Latine Copies.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 8
  "translation_ja": |-
    ニコラ・フラメルが、パリのサン・ティノサン墓地のアーチに描かせた象形図像についての、その解説。
    これにアルテフィウスの『秘密の書』、およびヨハネス・ポンタヌスの『書簡』を併せる。賢者の石の理論と実践の双方について。
    フランス語とラテン語の本から、忠実に、また、この事柄の威厳が求めるとおり敬虔に、英語へ訳したもの。
  "translation_status": "draft"

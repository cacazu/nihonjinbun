  "translation_ja": "これらこそ、古代エジプト人が、頭で尾を噛む円形に描いた蛇や竜である。同じ一つのものから出て、そのものだけで十分であり、その回転と循環のうちに自らを完成させることを示すためであった。また、古代の詩人たちが、ヘスペリデスの乙女たちの園にある黄金の林檎を、眠らずに守り見張ったと物語った竜も、これらである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-086-02"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These are they upon whom Jason in his adventure for the Golden Fleece, powred the brothe or liquor prepared by the faire Medea, of the discourse of whom the Books of the Phylosophers are so full, that there is no Phylosopher that ever was, but he hath written of it, from the time of the truth-telling Hermes Trismegistus, Orpheus, Pythagoras, Artephius, Morienus, and the other following, even unto my selfe."
  "source_languages":

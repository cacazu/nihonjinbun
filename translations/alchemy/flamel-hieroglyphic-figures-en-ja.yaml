  "translation_status": "draft"
- "id": "FL-100-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A while after, the water beginneth to thicken and coagulate somewhat more, growing very blacke, like unto pitch, and finally comes the Body and earth, which the envious have called Terra fœtida, that is, stinking earth: for then because of the perfect putrefaction, which is as naturall as any other can be, this earth stincks, and gives a smell like the odour of graves filled with rottennesse, and with bodies as yet charged with their naturall moysture."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "80"
    "pdf_page": 100
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "80"
    "pdf_page": 100
  "translation_ja": "しばらくすると、水はさらに濃くなって凝固し始め、瀝青のように真っ黒になる。そして最後には物体と土が現れる。秘密を惜しむ人々はこれを「テラ・フェティダ」、すなわち「臭い土」と呼んだ。このとき、どの自然な腐敗にも劣らず自然な完全な腐敗によって、この土は臭くなり、腐ったものや、まだ本来の湿気を含む死体で満たされた墓のような臭いを発するからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-101-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This earth was by Hermes called Terra foliata, or the Earth of leaves, yet his true & proper name is Leton, which must afterward bee whitened. The Ancient Sages that were Cabalists, have described it in their Metamorphoses, under the History of the Serpent of Mars, which had devoured the companions of Cadmus, who slew him, piercing him with his lance against a hollow Oake. Note this Oake."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "81"
    "pdf_page": 101
  "translation_ja": "この土をヘルメスは「テラ・フォリアタ」、すなわち「葉の土」と呼んだ。しかし本当の固有名はレトンであり、これは後に白くしなければならない。カバラの徒でもあった古代の賢者たちは、『変身譚』において、カドモスの仲間を呑み込んだマルスの蛇の物語でこれを描いた。カドモスは槍で蛇を刺し、空洞のある樫の木に縫いとめて殺した。この樫の木に注意しなさい。"
  "translation_status": "draft"
  "source_kind": "prose"

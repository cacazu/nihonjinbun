  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 16
  "translation_ja": "私たちの神である主の、輝く美しさが私たちの上にありますように。私たちの手の業を、私たちの上に導いてください。私たちの手の業を、どうか導いてください。詩篇90・19。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-016-03"
  "section_id": "FL-FRONT"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Quis enim despexit dies parvos? & lætabuntur, & videbunt lapidem stanneum in manu Zorobabel. Septem isti, Oculi sunt Domini, qui discurrunt in universam terram. Zech. 4.10."
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 16
  "translation_ja": "いったい誰が、小さな日々を侮ったのか。彼らは喜び、ゼルバベルの手にある錫の石を見るだろう。この七つは、全地を行き巡る主の眼である。ゼカリヤ4・10。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-016-03-tn-001-text"
  "section_id": "FL-FRONT"

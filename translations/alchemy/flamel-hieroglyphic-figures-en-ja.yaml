- "id": "FL-019-03"
  "section_id": "FL-FRONT"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Fortuna vices lubrica versat
    Varias docilis sumere formas.
    Inopina Dei plurima peragunt;
    Non succedunt quæ fore speras,
    Quæ fore nemo posse putaret,
    Sæpe expediunt numina. Qualem
    Hæc sortita est res mihi finem.
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 19
  "translation_ja": |-
    移ろう運命は巡りを変え、
    さまざまな姿を取ることをよく心得ている。
    神々は、思いがけぬ多くのことを成し遂げる。
    実現すると望むことは成らず、
    誰も可能だとは思わぬことを、
    神意はしばしば成就させる。このことも
    私にとって、そのような結末を得た。
  "translation_status": "draft"
  "source_kind": "poetry"
- "id": "FL-019-04"
  "section_id": "FL-FRONT"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Many shapes of Fate there bee
    Much done beyond our hope, we see:
    What we thinke sure, God often stayes,
    And findes, for things undream’t-of, wayes:
    For so did this succeed to mee,
    And so I wish it may to thee.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 19
  "translation_ja": |-
    運命には多くの姿がある。
    私たちは、望みを超える多くのことが成るのを見る。
    確かと思うことを、神はしばしば押しとどめ、
    夢にも思わぬことには、道を見いだされる。
    このことも、私にはそのように運んだ。
    お前にもそうなるよう、私は願う。
  "translation_status": "draft"
  "source_kind": "poetry"

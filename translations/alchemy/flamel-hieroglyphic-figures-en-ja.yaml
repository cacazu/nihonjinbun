  "translation_ja": "一方、図像の右手にある土製の容器を神学的意味で解釈する必要はないと思う。その中にはペンとインク壺があるが、紐を取り除き、ペン入れとインク壺を合わせれば、むしろ哲学の容器となる。聖ペトロと聖パウロの像の両脇にある、それに似たほかの二つも同様である。その一つにはニコラを表すN、もう一つにはフラメルを表すFが入っている。これらの容器は、これと同じような容器の中で、私が大業を三度成し遂げたということ以外には何も意味しない。さらに、このペンとインク壺、そして私の名の頭文字を表すために、容器を盾形紋章の形に置いたと考えたい者は、そう考えてもよい。どちらの解釈も正しいからである。"
  "translation_status": "draft"
  "source_kind": "prose"

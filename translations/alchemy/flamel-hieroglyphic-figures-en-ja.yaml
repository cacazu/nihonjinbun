  "translation_ja": "Chollerは胆汁と怒りを掛けた語で、乾燥という体液論的性質も含む。"
  "translation_status": "draft"
- "id": "FL-082-02"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Besides this, thou must entertain them in this temperate heate perpetually, that is to say, night and day, vntill the time that Winter, the time of the moisture of the matters, be passed; because they make their peace, and ioyne hands in being heated together, whereas should these natures finde themselues but one onely half houre without fire, they would become for euer irreconcileable. See therefore the reason why it is said in the Book of the seuenty precepts, Looke that their heate continue indefatigably without ceasing, and that none of their dayes bee forgotten. And Rasis, the haste, saith hee, that brings with it too much fire, is alwaies followed by the Diuell, and Errour."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "62"
    "pdf_page": 82
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "62"
    "pdf_page": 82
  "translation_ja": "それに加えて、あなたはそれらを、この穏やかな熱の中に絶えず、すなわち昼も夜も保たなければならない。冬、つまり諸物質が湿っている時期が過ぎるまでである。それらは一緒に温められることによって和解し、手を結ぶからである。もしこれらの本性が、たった半時間でも火のない状態に置かれたなら、永遠に和解できなくなってしまうだろう。ゆえに、『七十の教訓の書』に「その熱が休みなく、途絶えず持続するよう注意し、一日たりとも忘れることのないようにせよ」とある理由が分かる。そしてラーシスは言う。「過度の火をもたらす性急さには、いつも悪魔と誤謬が付き従う」と。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-083-01"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When the golden Bird, saith Diomedes, shall be come iust to Cancer, and that from thence it shall runne toward Libra, then thou maist augment the fire a little: And in like manner, when this faire Bird, shall fly from Libra towards Capricorne, which is the desired Autumne, the time of haruest, and of the fruits that are now ripe."
  "source_languages":
  - "en"
  "source_locations":

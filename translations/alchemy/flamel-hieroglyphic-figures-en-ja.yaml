- "id": "FL-052-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "At that time when I wrote this Commentarie, in the yeere one thousand foure hundred and thirteene, in the end of the yeere, after the decease of my faithfull companion, which I shall lament all the dayes of my life: she and I had already founded, and endued with reuenewes 14. Hospitals in this Citie of Paris, wee had new built from the ground three Chappels, we had inriched with great gifts and good rents, seuen Churches, with many reparations in their Church-yards, besides that which we haue done at Boloigne, which is not much lesse than that which wee haue done heere. I will not speake of the good which both of vs haue done to particular poore folkes, principally to widdowes and poore Orphans, whose names if I should tel, and how I did it, besides that my reward should be giuen mee in this World, I should likewise doe displeasure to those good persons, whom I pray God blesse, which I would not doe for any thing in the World."
  "source_languages":
  - "en"
  "source_locations":

    "printed_page": "32"
    "pdf_page": 52
  "translation_ja": "私がこの注解を記したのは、千四百十三年の年末であり、忠実な伴侶が亡くなった後のことである。その死を、私は生涯嘆き続けるであろう。この時までに、妻と私はすでにパリの町に十四の救護院を設立して収入を付与し、三つの礼拝堂を基礎から新築し、七つの教会に多額の寄付と十分な地代収入を与え、その墓地の多くの修繕も行っていた。ブローニュで行ったことはこのほかにあり、そちらもここで行ったことにさほど劣らない。私たち二人が個々の貧しい人々、とりわけ寡婦や貧しい孤児に施した善行については語るまい。その人々の名と、どのように施したかを述べるなら、私の報いがこの世で与えられてしまうだけでなく、それらの善良な人々にも迷惑をかけるだろう。私は神が彼らを祝福されるよう祈っており、この世の何と引き換えでも、そのようなことはしたくない。"
  "translation_status": "draft"
  "source_kind": "prose"

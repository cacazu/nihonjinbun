    "printed_page": "67"
    "pdf_page": 87
  "translation_ja": "これらはユノー、すなわち金属的自然が与え、送り込んだ二匹の蛇である。強いヘラクレス、つまり賢く知恵ある人は、仕事の始まりに、揺り籠の中でこれらを絞め殺さなければならない。すなわち征服して殺し、腐敗し、朽ち、生み出すようにするのである。また、メルクリウスのカドゥケウス、すなわち杖に巻きつき、絡みついた二匹の蛇もこれらである。彼はその杖で大きな力を行い、望むままに姿を変える。「一方を殺す者は他方も殺す」とハリはいう。一方はその兄弟とともでなければ死ねないからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-088-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These two then, (which Avicen calleth the Corassene bitch, and the Armenian dogge) these two I say, being put together in the vessell of the Sepulcher, doe bite one another cruelly, and by their great poyson, and furious rage, they never leave one another, from the moment that they have seized on one another (if the cold hinder them not) till both of them by their slavering venome, and mortall hurts, be all of a goarebloud over all the parts of their bodies; and finally, killing one another, be stewed in their proper venome, which after their death, changeth them into living and permanent water; before which time, they loose in their corruption and putrifaction, their first naturall formes, to take afterwards one onely new, more noble, and better forme."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "68"
    "pdf_page": 88
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "68"
    "pdf_page": 88
  "translation_ja": "さてこの二つを、アヴィセンナはホラーサーンの雌犬とアルメニアの雄犬と呼ぶ。この二つを一緒に墓の器へ入れると、互いを激しく噛む。その強い毒と猛り狂う怒りのため、いったん相手に噛みついてからは、寒さに妨げられないかぎり決して離れない。ついには、垂れる毒と致命傷によって、双方とも体のあらゆる部分が血まみれになる。そして最後には互いを殺し、自分たちの毒液の中で煮込まれる。その毒は死後の両者を、生きた恒久の水へ変える。それに先立って、両者は腐朽と腐敗のうちに最初の自然な形を失い、その後にただ一つの、より高貴で、よりよい新しい形を取るのである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-089-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These are the two Spermes, masculine and feminine, described at the beginning of my Abridgement of Phylosophy, which are engendred (say Rasis, Avicen, and Abraham the Jew) within the Reynes, and entrails, and of the operations of the foure Elements. These are the radicall moysture of mettalls, Sulphur, and Argent vive, not vulgar, and such as are sold by the Merchants and Apothecaries, but those which give us those two faire & deare bodies which wee love so much."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "69"
    "pdf_page": 89
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "69"
    "pdf_page": 89
  "translation_ja": "これらは、私の『哲学摘要』の冒頭に記した雄と雌の二つの種子である。ラーシス、アヴィセンナ、ユダヤ人アブラハムによれば、腎臓と内臓の中で、四元素の働きから生じるという。これらは金属の根源的な湿気、硫黄と生ける銀である。ただし商人や薬屋が売る通常の品ではなく、私たちがあれほど愛する、美しく貴い二つの物体を与えてくれるものをいう。"
  "translation_status": "draft"
  "source_kind": "prose"

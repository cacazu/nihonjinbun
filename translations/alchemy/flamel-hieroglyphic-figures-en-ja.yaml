- "id": "FL-040-02"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In the end hauing lost all hope of euer vnderstanding those figures, for my last refuge, I made a vow to God, and St. Iames of Gallicia, to demand the interpretation of them, at some Iewish Priest, in some Synagogue of Spaine: whereupon with the consent of Perrenelle, carrying with me the Extract of the Pictures, hauing taken the Pilgrims habit and staffe, in the same fashion as you may see me, without this same Arch in the Church-yard, in the which I put these hyeroglyphicall figures, where I haue also set against the wall, on the one and the other side, a Procession, in which are represented by order all the colours of the stone, so as they come & goe, with this writing in French."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "20"

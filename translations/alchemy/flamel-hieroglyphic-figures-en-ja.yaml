- "id": "FL-111-02"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The woman hath a white circle in forme of a rowle round about her body, to shew thee, that Rebis will beginne to become white in that very fashion, beginning first at the extremities, round about this white circle. Scala Phylosophorum, that is, the Booke entituled, The Phylosophers Ladder, saith thus; The signe of the first perfect whitenesse, is the manifestation of a certaine little circle of haire, that is passing over the head, which will appeare on the sides of the vessels round about the matter, in a kind of a citrine or yellowish colour."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "91"
    "pdf_page": 111
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "91"
    "pdf_page": 111
  "translation_ja": "女の体の周囲には、巻紙の形をした白い輪がある。レビスがまさにそのように白くなり始めること、まずこの白い輪に沿って、外縁から始まることを教えるためである。『スカラ・フィロソフォルム』、すなわち『哲学者たちの梯子』という書は、こういう。「最初の完全な白さのしるしは、頭の上を横切る髪の小さな輪が現れることである。それは質料を囲んで、器の側面に、ある種の柑橘色、あるいは黄みがかった色で現れる。」"
  "translation_status": "draft"
  "source_kind": "prose"

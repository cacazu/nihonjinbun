    "printed_page": "16"
    "pdf_page": 36
  "translation_ja": "ついに私は、第四葉と第五葉の図像と絵姿をすべて、できるだけ忠実に住まいの中へ描かせ、パリで最も学識のある人々に見せた。しかし彼らも私以上には理解しなかった。賢者の石を教える本にある図だと説明すると、大多数は私もその祝福された石も嘲笑した。ただ一人、医学の学位を持ち、この学問を熱心に研究していた、アンセルム先生と呼ばれる人物だけが例外であった。先生は私の本をぜひ見たいと望み、それを見るためなら、この世で何でもしたであろう。しかし私はいつも、本は持っていないと言い、ただその方法を詳しく説明した。先生は、最初の絵姿が、すべてを呑み込む「時」を表していること、文字のある六葉の数に従えば、石を完成させるには六年が必要であることを私に教えた。それが済んだら砂時計をひっくり返し、もはや煮てはならない、と言った。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-038-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And when I told him that this was not painted, but onely to shew and teach the first Agent, (as was said in the Booke) hee answered me, that this decoction for sixe yeeres space, was, as it were, a second Agent; and that certainely the first Agent was there painted, which was the white and heauy water, which without doubt was Argent viue, which they could not fixe, nor cut off his feete, that is to say, take away his volatility, saue by that long decoction in the purest bloud of young Infants; for in that, this Argent viue being ioined with gold and siluer, was first turned with them into an herb like that which was there painted, and afterwards by corruption, into Serpents; which Serpents being then wholly dried, and decocted by fire, were reduced into powder of gold, which should be the stone."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "18"
    "pdf_page": 38
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "18"
    "pdf_page": 38
  "translation_ja": "しかし私は、本に述べてあるとおり、この絵は第一の作用体を示し教えるためだけに描かれたのだと伝えた。すると先生は、六年間に及ぶこの煮熟は、いわば第二の作用体なのであって、第一の作用体も確かにそこに描かれている、それは白く重い水であり、疑いなく水銀である、と答えた。そしてそれを固定することも、その足を切り落とすこと、すなわち揮発性を取り去ることも、幼い子どもの最も純粋な血の中で長く煮熟しなければできない、と言った。というのも、その中でこの水銀を金と銀に結びつけると、まずそれらとともに絵にあるような草となり、その後、腐敗によって蛇となるからである。その蛇をすっかり乾かして火で煮熟すると、金の粉末となり、それが石になるというのであった。"
  "translation_status": "draft"
  "source_kind": "prose"

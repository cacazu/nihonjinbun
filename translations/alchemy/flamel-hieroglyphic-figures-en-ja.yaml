  "translation_ja": "これをさらに明瞭に示すため、体は、閉じ込められていた墓の石を持ち上げる姿に描かせた。魂は土に埋められるものではないため、墓からは出て来ない。髪を乱した女の姿で、墓のあいだにいて、自分の体を捜すように描かせただけである。同じく墓に入れられない霊は、墓からでなく、土から出て来る男の姿に描かせた。三者はすべて白い。こうして黒さ、すなわち死は征服され、白くなった三者は、それ以後、朽ちることがない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-136-01"
  "section_id": "FL-CH06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now lift up thine eyes on high, and see our King comming, crowned and raised againe, which hath overcome Death, the darkenesses, and moistures; behold him in the forme wherein our Saviour shall come, who shall eternally unite unto him all pure and cleane soules, and will drive away all impurity and uncleannesse, as being unworthy to be united to his divine Body. So by comparison (but first asking leave of the Catholicke, Apostolicke, and Romane Church, to speake in this manner, and praying every debonaire soule to permit me to use this similitude) see heere our white Elixir, which from henceforward will inseparably unite unto himselfe every pure Mettallicke nature, changing it into his owne most fine silvery nature, rejecting all that is impure, strange, and Heterogeneall, or of another kind."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "116"
    "pdf_page": 136
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "116"
    "pdf_page": 136
  "translation_ja": "いま眼を上へ向け、冠を戴き、蘇り、やって来る王を見なさい。彼は死と闇と湿気に勝った。私たちの救い主が来るときの姿で、その王を見なさい。救い主は清く純粋な魂を永遠にご自分へ結びつけ、不純と汚れは、ご自身の神聖な体に結びつくにふさわしくないものとして、すべて退けるだろう。同じように、ここに私たちの白いエリクシルを見なさい。ただし、このように語ることについて、まずカトリック的、使徒的、ローマ的教会に許しを願い、善良な魂のすべてに、この譬えを使うことを許してほしいと願う。この白いエリクシルは、今後すべての純粋な金属的性質を、離れないように自らへ結びつけ、自己の最も精良な銀の性質へ変え、不純なもの、異物、異質なもの、つまり別種のものをすべて退ける。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-137-01"
  "section_id": "FL-CH06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Blessed be God, which of his goodnesse gives us grace to bee able to consider this sparkling white, more perfect and shining than any compound nature, and more noble next after the immortall soule, than any substance having life, or not having life; for it is a quintessence, a most pure silver that hath passed the Coppell, and is seven times refined, saith the royall Prophet David."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "117"
    "pdf_page": 137
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "117"
    "pdf_page": 137
  "translation_ja": "神に祝福あれ。その善意によって、私たちがこの輝く白さを見つめられる恵みを与えてくださる。それは、どんな複合された自然よりも完全で輝かしく、不滅の魂に次いで、生ある物質、生なき物質のすべてより高貴である。なぜならそれは第五精質であり、王なる預言者ダビデのいうとおり、灰吹き皿を通り、七度精錬された、最も純粋な銀だからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-138-01"
  "section_id": "FL-CH06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is not needfull to interprete what the two Angels signifie, that play on Instruments over the heads of them which are raised againe: These are rather divine spirits, singing the mervailes of God in this miraculous operation, than Angels that call to judgement: To make an expresse difference betweene these and them, I have given the one of them a Lute, the other a hautboy, but none of them trumpets, which yet are wont to be given to them that are to call us to Judgement. The like may be said of the three Angels, which are over the head of our Saviour, whereof the one crowneth him, and the other two assisting, say in their Rowles, O PATER OMNIPOTENS, O JESU BONE, that is, o Almighty Father, o good Jesu, in rendring unto him eternall thanks."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "118"
    "pdf_page": 138
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "118"
    "pdf_page": 138
  "translation_ja": "復活した者たちの頭上で楽器を奏でる二天使が何を意味するか、解釈する必要はない。この奇跡的な働きにおける神の驚くべき業を歌う神的な霊であり、裁きへ呼び出す天使というより、むしろそのような存在である。両者をはっきり区別するため、一方にはリュート、他方にはオーボエを与えた。私たちを裁きへ呼ぶ天使に通常与えられるトランペットは、どちらにも与えなかった。救い主の頭上にいる三天使についても、同じことがいえる。一人は彼に冠を戴かせ、ほかの二人は付き添い、巻紙に「O PATER OMNIPOTENS, O JESU BONE」、すなわち「おお、全能の父よ。おお、善きイエスよ」と記して、永遠の感謝を捧げている。"
  "translation_status": "draft"
  "source_kind": "prose"

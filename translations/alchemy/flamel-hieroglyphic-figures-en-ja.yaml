- "id": "FL-042-02"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This done, in Leon at my returne I met with a Merchant of Boloyn, which made me knowne to a Physician, a Iew by Nation, and as then a Christian, dwelling in Leon aforesaid, who was very skillfull in sublime Sciences, called Master Canches. Assoone as I had showen him the figures of my Extraict, hee being rauished with great astonishment and ioy, demanded of me incontinently, if I could tell him any newes of the Booke, from whence they were drawne? I answered him in Latine (wherein hee asked me the question) that I hoped to haue some good newes of the Book, if any body could decipher vnto me the Enigmaes: All at that instant transported with great Ardor and ioy, he began to decipher vnto mee the beginning: But to be short, hee wel content to learn newes where this Book should be, and I to heare him speake, and certainly he had heard much discourse of the Booke, but (as he said) as of a thing which was beleeued to be vtterly lost, we resolued of our voyage, and from Leon wee passed to Ouiedo, and from thence to Sanson, where wee put our selues to Sea to come into France."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "22"
    "pdf_page": 42
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "22"
    "pdf_page": 42
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "22"
    "pdf_page": 42
  "translation_ja": "それを済ませた帰途、レオンで私はブローニュの商人に出会い、その人から一人の医師を紹介された。医師はユダヤ人の出で、そのころはキリスト教徒となり、先に述べたレオンに住んでいた。高い学問に非常に通じた人で、カンチェス先生と呼ばれていた。写しの図を見せるやいなや、先生は大いなる驚きと喜びに心を奪われ、それが写されたもとの本について、何か消息を知らせられないかと、すぐに尋ねた。私は、先生が質問に用いたラテン語で、誰かがこの謎を解いてくれるなら、本について良い知らせを伝えられるだろうと答えた。先生はたちまち熱意と喜びに満ち、その冒頭を解き明かし始めた。手短に言えば、先生はこの本のありかを知ることを喜び、私はその話を聞くことを喜んだ。先生は確かにこの本について多くの話を聞いていたが、先生によれば、それは完全に失われたと信じられていたものだった。そこでわれわれは旅の計画を決め、レオンからオビエドへ、そこからサンソンへ進み、フランスへ向かって船出した。"
  "translation_status": "draft"
  "source_kind": "prose"

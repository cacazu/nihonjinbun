  "translation_ja": "lapidem stanneum は直訳して「錫の石」。文脈上は建築に用いる下げ振りのおもりだが、後世の聖書訳へ置き換えない。"
  "translation_status": "draft"
- "id": "FL-016-04"
  "section_id": "FL-FRONT"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For who hath despised the day of little things? for they shall rejoyce, and shall see the stone of Tinne in the hand of Zerubbabel, with those seven; they are the Eyes of the Lord, which run too & fro through the whole earth. Zech. 4.10."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 16
  "translation_ja": "誰が、小さな事柄の日を侮ったのか。彼らは喜び、ゼルバベルの手の錫の石を見るだろう。その七つとともに。それらは主の眼であり、全地をあちらへこちらへと走り巡る。ゼカリヤ4・10。"
  "translation_status": "draft"
  "source_kind": "prose"

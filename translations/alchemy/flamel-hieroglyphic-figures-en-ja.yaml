  "translation_ja": "原文 a stinking は名詞の省略を含む不規則な表現。「悪臭」と解した。"
  "translation_status": "draft"
- "id": "FL-091-02"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The cause why I have painted these two spermes in the forme of Dragons, is because their stinch is exceeding great, and like the stinch of them, and the exhalations which arise within the glasse, are darke, blacke, blew, and yellowish, (like as these two Dragons are painted) the force of which, and of the bodies dissolved, is so venomous, that truely there is not in the world a ranker poyson; for it is able by the force and stench thereof to mortifie and kill every thing living: The Philosopher never feeles this stinch, if he breake not his vessels, but only he judgeth it to be such, by the sight, and the changing of colours, proceeding from the rottennesse of his confections."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "71"
    "pdf_page": 91
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "71"
    "pdf_page": 91
  "translation_ja": "この二つの種子を竜の姿に描いた理由は、その臭気がきわめて強烈で、竜の臭気に似ているからである。またガラス器の中に立ち上る蒸気は、この二匹の竜を描いた色と同じく、暗く、黒く、青く、黄みがかっている。この蒸気と溶かされた物体の力は、実にこの世にそれ以上のものはないほど毒性が強い。その力と悪臭によって、生きているものをすべて死なせ、殺すことができるからである。哲学者は器を壊さないかぎり、この臭気を感じない。配合物の腐敗から生じる外観と色の変化を見ることによってのみ、そのようなものだと判断する。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-092-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These colours then signifie the putrifaction and generation which is given us, by the biting and dissolution of our perfect bodies, which dissolution proceedeth from externall heate ayding, and from the Pontique fierienesse, and admirable sharpe vertue of the poyson of our Mercurie, which maketh and resolveth into a pure cloud, that is, into impalpable powder, all that which it finds to resist it: So the heate working upon and against the radicall, mettallicke, viscous, or oyly moisture, ingendreth upon the subject, blackenesse."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "72"
    "pdf_page": 92
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "72"
    "pdf_page": 92
  "translation_ja": "したがってこれらの色は、私たちの完全な物体が噛まれ、溶解することによって与えられる腐敗と生成を表す。この溶解は、助けとなる外部の熱、そして私たちのメルクリウスの毒がもつ、ポントス的な火の性と、驚くほど鋭い力から生じる。その力は、抵抗するものをすべて純粋な雲、すなわち指にも感じられない粉へ変え、解きほぐす。こうして熱が、根源的で金属的な、粘りのある、あるいは油のような湿気に作用し、これと抗争すると、基体に黒さを生じさせる。"
  "translation_status": "draft"
  "source_kind": "prose"

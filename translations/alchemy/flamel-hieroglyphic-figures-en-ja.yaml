  "origin": "source"
  "source_text": "The vestments of the figure of Saint Paul are bordered largely with a golden and red citrine colour. O my Sonne, praise God, if ever thou seest this, for now hast thou obtained mercy from Heaven; Imbibe it then, and teine it till such time as the little Infant be hardy and strong, to combate against the water and the fire. In accomplishing the which, thou shalt doe that which Demagoras, Senior, and Haly have called, The putting of the Mother into the Infants belly, which Infant the Mother had but lately brought forth; for they call the Mother, the Mercury of Phylosophers, wherewith they make their imbibitions and fermentations, and the Infant they call the Body, to teine or colour the which this Mercury is gone out:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "104"

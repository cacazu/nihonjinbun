  "source_text": "Of these two Dragons, or Principles Mettallicke, I have said in my fore-alledged Summarie, that the Enemy would by his heate inflame his enemy, and that then if they take not heed, they should see in the ayre a venomous fume & a stinking, worse in flame, and in poyson, than the envenomed head of a Serpent, and Babylonian Dragon."
  "source_languages":

  "kind": "paragraph"
  "origin": "source"
  "source_text": "Gouern therefore sweetly with equality and proportion, thy proud and haughty natures, for feare lest if thou fauour one more than another, they which naturally are enemies, doe grow angry against thee through Iealousy, and dry Choller, and make thee sigh for it a long time after:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "62"
    "pdf_page": 82
  "translation_ja": "ゆえに、あなたの誇り高く気位の高い諸本性を、均等と釣り合いを保ちながら、穏やかに治めなさい。一方を他方よりも優遇すれば、本来敵同士であるそれらが、嫉妬と乾いた胆汁の怒りによってあなたに腹を立て、その後長くため息をつかせることになりかねないからである。"
  "translation_status": "draft"
  "source_kind": "prose"

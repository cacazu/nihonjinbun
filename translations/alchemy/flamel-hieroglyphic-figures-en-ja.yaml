  "source_text": "Therefore I have given thee these two figures, to signifie the Albification; for in this place it is, that thou hast need of great helpe, for here all the World is deceived. This operation is indeed a Labyrinth, for here there present themselves a thousand wayes at the same instant, besides that, thou must goe to the end of it, directly contrary to the beginning, in coagulating that which before thou dissolvedst, and in making earth that which before thou madest water."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "105"
    "pdf_page": 125

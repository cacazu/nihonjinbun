  "translation_ja": "flegmeは体液論的な粘液。Winter、Aries、Cancerなどはここでは作業の時期と火度を表す象徴として語られる。Sulphurは近代化学の単体硫黄と単純に同一視しない。"
  "translation_status": "draft"
- "id": "FL-082-01"

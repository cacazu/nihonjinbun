  "translation_ja": "第一章　著者である私の意図に従って、これらの象形図像に与えうる神学的解釈について"
  "translation_status": "draft"
- "id": "FL-059-02"
  "section_id": "FL-CH01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I Haue giuen to this Churchyard, a Charnell-house, which is right ouer against this fourth Arch, in the middest of the Churchyard, and against one of the Pillers of this Charnell house, I haue made bee drawne with a coale, and grosely painted, a man all blacke, which lookes straight vpon these Hieroglyphickes, about whom there is written in French; Ie voy merueille done moult Ie m'esbahi: that is, I see a marueile, whereat I am much amazed: This, as also three plates of Iron and Copper gilt, on the East, West, and South of the Arch, where these Hieroglyphickes are, in the middest of the Churchyard, representing the holy Passion and Resurrection of the Sonne of God; this ought not to be otherwise interpreted, than according to the common Theologicall sence, sauing that this black man, may as well proclaime it a wonder to see the admirable workes of God in the transmutation of Mettals, which is figured in these Hieroglyphicks, which he so attentiuelly lookes vpon, as to see buried so many bodies, which shall rise againe out of their Tombes at the feareful day of iudgement."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "39"
    "pdf_page": 59
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "39"
    "pdf_page": 59
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "39"
    "pdf_page": 59
  "translation_ja": "私はこの墓地に納骨堂を寄進した。それは墓地の中央、この第四のアーチの真向かいにある。その納骨堂の柱の一つに、私は炭で輪郭を描かせ、粗く彩色して、全身が黒い一人の男を描かせた。男はこれらの象形図像をまっすぐに見つめ、その周りにはフランス語で「Ie voy merueille done moult Ie m'esbahi」、すなわち「私は驚異を見て、たいそう驚いている」と記してある。この像も、墓地の中央の図像のあるアーチの東・西・南側に置かれ、神の御子の聖なる受難と復活を表す、金箔を施した鉄と銅の三枚の板も、通常の神学的意味によるほかには解釈すべきではない。ただし、この黒い男は、自分が注意深く見つめる象形図像に示された金属変成の中に、神の驚嘆すべき御業を見ることを、驚異と呼んでいるとも言える。恐ろしい審判の日に墓から甦るはずの、これほど多くの遺体が葬られているのを見ることを、驚異と呼んでいるのと同様である。"
  "translation_status": "draft"
  "source_kind": "prose"

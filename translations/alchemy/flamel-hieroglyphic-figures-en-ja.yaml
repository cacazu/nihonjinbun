- "id": "FL-010-01-tn-001-text"
  "section_id": "FL-FRONT"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "献呈先の固有名はこの所蔵本の印刷では空欄。推測で補わない。"
  "translation_status": "draft"
- "id": "FL-010-02"
  "section_id": "FL-FRONT"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Because there are not many worthy such Epithets, therfore amongst so few, and those so dispersed, it is not hard for any man to know you, as well by your just titles as by your Name. Pardon my boldnesse, who owing my best service unto your vertues, though not knowing your person, nor knowne unto you, unlesse peradventure the report of my disasters have come unto your eares; doe humbly offer unto you, what I am assured, when you understand, (if ever God incline your heart to the search, and open your eyes to the sight thereof) you wil esteeme as the greatest and most unvaluable secret, which amongst all under-Moone things, was ever imparted and communicated to man."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 10
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 10
  "translation_ja": "このような賛辞にふさわしい方は多くありません。その少数の方々も遠く散らばっていますので、お名前だけでなく、当然受けるべき称号によっても、誰もがあなたを知るのは難しくありません。どうか私の大胆さをお許しください。私はあなたにお目にかかったことがなく、あなたも私をご存じありません。あるいは私の不運の噂がお耳に届いたことがあるかもしれませんが、それでも私は、あなたの美徳に最善の奉仕を捧げる義務を感じ、ここに謹んでこのものをお献げします。もし神があなたの心を探求へ向け、眼を開いてそれを見ることを許され、あなたが理解なさったなら、月下のあらゆる事物のうち、人間にかつて伝えられ、分かち与えられた、最大で値のつけられない秘密であると評価なさるに違いない、と私は確信しております。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-011-01"
  "section_id": "FL-FRONT"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Your Piety and Almes-deedes, proceeding from that boundlesse fountaine of burning Charity, which disperseth it selfe in all formes, according to the necessities of the poore, have inforced mee to tell the world, that for you, and such as you are, I have caused these little Bookes to bee published in our vulgar English, custome excusing the most of your sexe from the knowledge of the learned Tongues, in which Cabinets, those secrets are ordinarily locked up, though there want not examples of many women, who, by the impartiall grace of God, have attained to the thing it selfe."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 11
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 11
  "translation_ja": "燃える慈愛の限りない泉から出る、あなたの敬虔さと施しの行いは、貧しい人の必要に応じ、あらゆる形で広がっています。そのため私は、あなたと、あなたのような方々のために、これらの小さな書物を私たちの日常の英語で刊行させたのだと、世に告げずにはいられませんでした。こうした秘密は通常、学問の言語という小箱の中に閉じ込められていますが、慣習は、女性の大部分にそれらの言語を学ぶことを求めません。とはいえ、分け隔てのない神の恵みによって、その事柄自体へ到達した、多くの女性の例がないわけではありません。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-012-01"
  "section_id": "FL-FRONT"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But it is not my purpose to flatter any body with the hope of that, which I well know how rare and reserved a blessing of the Almighty it is: Onely, if you will bee but pleased, by this occasion, to cast your eyes upon that triumphant Chariot, wherein Nature rideth through her Minerall and under-earth kingdome, you will easily see what difference there is, betweene the plenteous vertues of heaven, there thrust and crowded up together, (as lines though farre distant in their first setting foorth from the Circumference, yet touching one another when they come neere the Center) and the loose and weake composition of Vegetables, which being of another imposition of Nature, are not able either to receive or to hold such plentie of those heavenly Spirits, which are the life of every Elementary body, no where idle, and there most abounding where it seemes most to bee hidden."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 12
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 12
  "translation_ja": "しかし、全能者から授かるそれが、どれほど稀で、限られた者のために留め置かれた祝福か、私はよく知っています。その希望で誰かをおだてるつもりはありません。ただ、この機会に、自然がその鉱物と地下の王国を巡る凱旋の戦車へ眼を向けていただけるなら、容易に違いが分かるでしょう。一方には、そこへ押し込められ、密集した天の豊かな力があります。それは、円周から出発したときには遠く離れていた線が、中心へ近づくと互いに触れ合うようなものです。他方には、植物の緩く弱い構成があります。植物は自然の別の配列のもとにあり、天の霊をそれほど豊かに受け取ることも、保つこともできません。この天の霊は、あらゆる元素的物体の生命であり、どこでも働かずにいることはなく、最も隠れて見えるところにこそ、最も豊かにあります。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-013-01"
  "section_id": "FL-FRONT"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For the rest, if any of my busie unletter'd Countrey-men, who are in great numbers as bold pretenders to this blessed Science, as they are blinde practitioners therein, shall by the reading of these Treatises bee perswaded (as I wish they may) to forbeare the losse of their time, and the expence of their moneyes, untill they be taught by the one of them, the true matter to worke on, and by the other, the true manner of proceeding therewith, let them in their hearts blesse God for you, to whose noble deserts (that chalenge a due acknowledgement from all good men) I have paid this small tribute of my labours."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 13
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 13
  "translation_ja": "そのほか、忙しく立ち働く、学問のない同国人たちの中には、この祝福された学を大胆に標榜する一方、その実践では眼の見えない者が、大勢おります。もし彼らの誰かが、私の願うとおり、これらの論書を読んで納得し、一方の書から取り組むべき真の質料を、他方からそれを扱う正しい進み方を教えられるまで、時間を失い、金を費やすことを差し控えるなら、あなたのために心から神を讃えるがよいのです。すべての善人から正当な評価を受けるべきあなたの高貴な功徳へ、私は自分の労苦という、このささやかな貢物を捧げました。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-014-01"
  "section_id": "FL-FRONT"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    For mine owne part, the helpe and comfort which I have so plenteously reaped from these studies, in the middest of many pressures, which without the extraordinary assistance of God, had beene insupportable, hath already made light and easie in my resolution, whatsoever I shall either doe, or suffer, for God, or good men, or the trueth. The father of the fatherlesse, the Judge of the widdowes, and the hope of the helpelesse, bee to you and yours ALL THINGS. So prayeth,
    Your humble servant,
    Eirenæus Orandus.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 14
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 14
  "translation_ja": |-
    私自身についていえば、数々の苦難のただ中で、これらの研究から、実に豊かな助けと慰めを得ました。神の特別な助けがなければ、その苦難は耐えがたいものでした。この助けと慰めによって、神、善人、真理のために、これから何をし、何を忍ぶことになろうとも、すでに私の決意において、それらは軽く、容易なものとなっています。父なき者の父、寡婦の裁き手、助けなき者の希望である方が、あなたとあなたの方々にとって、すべてであられますように。そう祈る者、
    あなたの謙虚な僕、
    エイレナエウス・オランドゥス。
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-016-01"
  "section_id": "FL-FRONT"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Et sit splendor Domini Dei nostri super nos, & opera manuum nostrarum dirige super nos; & opus manuum nostrarum dirige. Psal. 90.19."

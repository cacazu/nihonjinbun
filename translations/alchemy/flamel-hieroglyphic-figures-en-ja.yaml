  "source_locations": []
  "translation_ja": "Reynes は腎臓。種子や体液の語彙は本文の自然哲学の比喩として訳す。"
  "translation_status": "draft"
- "id": "FL-090-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These two spermes, saith Democritus, are not found upon the earth of the living: The same, saith Avicen, but he addeth, that they gather them from the dung, ordure, and rottennesse of the Sunne and Moone. O happy are they that know how to gather them, for of them they afterwards make a triacle, which hath power over all griefes, maladies, sorrowes, infirmities, and weaknesses, and which fighteth puissantly against death, lengthening the life, according to the permission of God, even to the time determined, triumphing over the miseries of this world, and filling a man with the riches thereof."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "70"
    "pdf_page": 90
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "70"
    "pdf_page": 90
  "translation_ja": "この二つの種子は、生ける者たちの地には見いだされない、とデモクリトスはいう。アヴィセンナも同じことをいうが、太陽と月の糞、汚物、腐ったものから集めるのだ、と付け加える。ああ、これらを集めるすべを知る者は幸いである。後にそこから、あらゆる苦痛、病、悲しみ、疾患、衰弱を制する力をもつ霊薬を作るからである。それは死と力強く戦い、神の許しに従って定められた時まで生命を延ばし、この世の惨めさに勝ち、人をこの世の富で満たす。"
  "translation_status": "draft"
  "source_kind": "prose"

    "pdf_page": 53
  "translation_ja": "この町にこれらの教会、墓地、救護院を建てるにあたり、私は、幼子殉教者の墓地の第四のアーチ、すなわちサン・ドニ通りの大門から入り、右手の道を進んだところに、この術の最も真実で本質的な徴を描かせようと決意した。ただし、ユダヤ人アブラハムの金装の書にある図をまね、覆いと象形的な外皮の下に置くこととした。図は、それを見る者の能力と理解に応じて、二つのことを表しうる。第一に、審判の日と善きイエスの到来に際して起こる、将来の、疑いないわれらの復活の奥義である。イエスがわれらを憐れんでくださいますように。これは墓地にふさわしい物語である。第二に、自然哲学に通じた人々に対しては、大業の主要で不可欠なすべての操作を意味しうる。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-055-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These Hieroglyphicke figures shall serue as two wayes to leade vnto the heauenly life: the first and most open sence, teaching the sacred Mysteries of our saluation; (as I will shew hereafter) the other teaching euery man, that hath any small vnderstanding in the Stone, the lineary way of the worke; which being perfected by any one, the change of euill into good, takes away from him the roote of all sinne (which is couetousnesse) making him liberall, gentle, pious, religious, and fearing God, how euill soeuer hee was before, for from thence forward, hee is continually rauished, with the great grace and mercy which hee hath obtained from God, and with the profoundnesse of his Diuine & admirable works."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "35"
    "pdf_page": 55
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "35"
    "pdf_page": 55
  "translation_ja": "これらの象形図像は、天上の生命へと導く二つの道として役立つであろう。第一の、最も明らかな意味では、後に示すとおり、われらの救済の聖なる奥義を教える。もう一方では、石について少しでも理解のある者すべてに、作業を順にたどる道を教える。誰であれこれを完成させれば、悪から善への変化によって、あらゆる罪の根である貪欲がその人から取り除かれる。そして以前どれほど悪しき者であったとしても、気前がよく、穏やかで、敬虔で、信心深く、神を畏れる者となる。それ以後は、神から得た大いなる恵みと憐れみ、そして神の驚嘆すべき御業の深さに、絶えず心を奪われているからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-056-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These are the reasons which haue mooued mee to set these formes in this fashion, and in this place which is a Churchyard, to the end that if any man obtaine this inestimable good, to conquere this rich golden Fleece, he may thinke with himselfe (as I did) not to keepe the talent of God digged in the Earth, buying Lands and Possessions, which are the vanities of this world: but rather to worke charitably towards his brethren, remembring himselfe that hee learned this secret amongst the bones of the dead, in whose number hee shall shortly be found; and that after this life, hee must render an account, before a iust and redoubtable Iudge, which will censure euen to an idle and vaine word."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "36"
    "pdf_page": 56
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "36"
    "pdf_page": 56
  "translation_ja": "以上が、これらの形をこのような姿で、この墓地という場所に置くよう私を促した理由である。もし誰かがこの計り知れない恵みを得、この豊かな金羊毛を獲得したなら、私がそうしたように、こう考えてほしいのである。この世の空しいものにすぎない土地や財産を買い、神から授かったタラントンを地中に埋めたままにしてはならない。むしろ兄弟たちに慈愛の業を行うべきである、と。そして、自分がこの秘密を死者の骨の間で学んだこと、自分も間もなくその死者の数に入ること、この生の後には、無益で空しい一言に至るまで裁く、正しく畏るべき裁判官の前で申し開きをしなければならないことを、忘れないでほしい。"
  "translation_status": "draft"
  "source_kind": "prose"

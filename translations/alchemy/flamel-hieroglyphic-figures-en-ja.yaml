    "precision": "page"
    "printed_page": "63"
    "pdf_page": 83
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "63"
    "pdf_page": 83
  "translation_ja": "ディオメデスは言う。「黄金の鳥がちょうど巨蟹宮に達し、そこから天秤宮へと進むとき、火を少し強めてもよい。同じように、この美しい鳥が天秤宮から磨羯宮へ飛ぶときもそうである。それこそ待ち望まれた秋、収穫の時であり、いまや熟した果実の時なのだ。」"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-084-01"
  "section_id": "FL-CH03"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAP. III. The two Dragons of colour yellowish, blew, and black like the field."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "64"
    "pdf_page": 84
  "translation_ja": "第三章　地と同じく、黄みがかり、青く、黒い色をした二匹の竜"
  "translation_status": "draft"
- "id": "FL-084-02"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Looke well upon these two Dragons, for they are the true principles or beginnings of this Phylosophy, which the Sages have not dared to shew to their owne Children. Hee which is undermost, without wings, hee is the fixed, or the male; that which is uppermost, is the volatile, or the female, blacke and obscure, which goes about to get the domination for many moneths. The first is called Sulphur, or heat and drinesse, and the latter Argent vive, or cold, and moisture."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "64"
    "pdf_page": 84
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "64"
    "pdf_page": 84
  "translation_ja": "この二匹の竜をよく見なさい。これらはこの哲学の真の原理、すなわち始原であり、賢者たちは自分の子供にさえ、あえて示さなかった。下にいる翼のないものは、固定したもの、すなわち雄である。上にいるものは、揮発するもの、すなわち雌で、黒く暗く、何か月ものあいだ支配を得ようとする。前者は硫黄、すなわち熱と乾燥と呼ばれ、後者は生ける銀、すなわち冷と湿と呼ばれる。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-084-02-tn-001-text"
  "section_id": "FL-CH03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "固定性・揮発性、硫黄・水銀は本文の錬金術的な対概念。「生ける銀」は Argent vive（水銀）。"
  "translation_status": "draft"
- "id": "FL-085-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These are the Sunne and Moone of the Mercuriall source, and sulphurous originall, which by continuall fire are adorned with royall habiliments, that being united, and afterward changed into a quintessence, they may overcome every thing Mettallick, how solid hard and strong soever it bee."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "65"
    "pdf_page": 85
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "65"
    "pdf_page": 85
  "translation_ja": "これらは水銀的な源、硫黄的な起源に属する太陽と月であり、絶え間ない火によって王の衣をまとわされる。それは両者が結ばれ、その後に第五精質へ変わり、どれほど緻密で硬く強固であろうとも、金属に属するあらゆるものを打ち負かせるようになるためである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-086-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These are the Serpents and Dragons which the ancient Ægyptians have painted in a Circle, the head biting the tayle, to signifie that they proceeded from one and the same thing, and that it alone was sufficient, and that in the turning and circulation thereof, it made it selfe perfect. These are the Dragons which the ancient Poets have fained did without sleeping keepe & watch the golden Apples of the Gardens of the Virgins Hesperides."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"

- "id": "FL-061-01"
  "section_id": "FL-CH01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On the other part I doe not thinke it needfull to interpret in a Theologicall sence, that vessell of Earth on the right hand of these figures, within the which there is a Pen and Inkhorne, or rather a vessell of Phylosophy, if thou take away the strings, and ioyne the Penner to the Inkhorne: nor the other two like it, which are on the two sides of the figures of Saint Peter, and Saint Paul, within one of the which, there is an N. which signifieth Nicholas, and within the other an F. which signifieth Flammell. For these vessels signifie nothing else, but that in the like of them, I haue done the Maistery three times: Moreouer, he that will also beleeue, that I haue put these vessels in forme of Scutchions, to represent this Pen and Inkhorne, and the capitall letters of my name, let him beleeue it if he will, because both these interpretations are true."
  "source_languages":
  - "en"
  "source_locations":

  "translation_ja": "黄金の羊毛を求めて冒険したイアソンが、美しいメデイアの調えた煎じ汁、あるいは液を注いだ相手もこれらである。この物語は哲学者たちの書に満ちあふれ、真実を語るヘルメス・トリスメギストス、オルフェウス、ピュタゴラス、アルテフィウス、モリエヌスから、その後の人々、そして私に至るまで、これを書かなかった哲学者は一人もいない。"

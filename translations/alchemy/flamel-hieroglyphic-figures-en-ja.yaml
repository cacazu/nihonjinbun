    "printed_page": "24"
    "pdf_page": 44
  "translation_ja": "旅はかなり順調であった。この王国に入って以来、先生はすでに図像の大部分を、このうえなく正しく私に解き明かしてくれていた。点や細かな印に至るまで大いなる奥義を見いだし、私には驚異と思われた。ところがオルレアンに着くと、この学識ある人は重い病に倒れた。船上で苦しんだ激しい嘔吐が、その後も続いていたのである。先生は私に見捨てられることを絶えず恐れ、その恐怖に比べられるものはないほどだった。私はいつも傍らにいたが、それでも先生は絶え間なく私を呼んだ。結局、発病の第七日が終わるころ、先生は亡くなった。私はひどく悲しんだが、できる限りのことをして、オルレアンの聖十字架教会に埋葬してもらった。先生はいまもそこに眠っている。神がその魂をお受け入れくださいますように。先生は善きキリスト教徒として死んだのである。私自身が死に妨げられないかぎり、必ずその教会にいくらかの収入を寄進し、先生の魂のために毎日ミサが唱えられるようにしたい。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-046-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He that would see the manner of my arriuall, and the ioy of Perenelle, let him looke vpon vs two, in this City of Paris, vpon the doore of the Chappell of St. Iames of the Bouchery, close by the one side of my house, where wee are both painted, my selfe giuing thankes at the feet of Saint Iames of Gallicia, and Perrenelle at the feet of St. Iohn, whom shee had so often called vpon."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "26"
    "pdf_page": 46
  "translation_ja": "私が帰り着いたときの様子とペルネルの喜びを見たい者は、このパリの町で、私の家のすぐ脇にあるサン・ジャック・ド・ラ・ブーシュリー礼拝堂の扉に描かれた、私たち二人を見てほしい。そこでは私はガリシアの聖ヤコブの足もとで感謝を捧げ、ペルネルは、自分が幾度となく祈り求めた聖ヨハネの足もとに描かれている。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-046-02"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "So it was, that by the grace of God, and the intercession of the happy and holy Virgin, and the blessed Saints Iames and Iohn, I knew all that I desired, that is to say, The first Principles, yet not their first preparation, which is a thing most difficult, aboue all the things in the world: But in the end I had that also, after long errours of three yeeres, or thereabouts; during which time, I did nothing but study and labour, so as you may see me without this Arch, where I haue placed my Processions against the two Pillars of it, vnder the feet of St. Iames and St. Iohn, praying alwayes to God, with my Beades in my hand, reading attentiuelly within a Booke, and poysing the words of the Philosophers: and afterwards trying and proouing the diuerse operations, which I imagined to my selfe, by their onely words. Finally, I found that which I desired, which I also soone knew by the strong sent and odour thereof."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "26"
    "pdf_page": 46
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "26"
    "pdf_page": 46
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "26"
    "pdf_page": 46
  "translation_ja": "こうして神の恵みと、幸いなる聖処女、および福なる聖ヤコブと聖ヨハネの執り成しにより、私は望んでいたすべて、すなわち第一の諸原理を知った。ただし、その最初の調製法はまだ知らなかった。それはこの世の何にもまして難しいことだからである。しかし三年ほどの長い試行錯誤の末、ついにそれも手に入れた。その間、私は研究と作業以外には何もしなかった。アーチの外側、その二本の柱に沿って行列を置いた場所で、聖ヤコブと聖ヨハネの足もとに私の姿が見えるとおりである。私は手に数珠を持って絶えず神に祈り、本を注意深く読み、哲学者たちの言葉を吟味しては、その言葉だけから思い描いたさまざまな操作を試し、検証していた。そしてついに望んでいたものを見いだし、その強い匂いと香りによって、すぐにそれと分かった。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-048-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Hauing this, I easily accomplished the Mastery, for knowing the preparation of the first Agents, and after following my Booke according to the letter, I could not haue missed it, though I would. Then the first time that I made projection, was vpon Mercurie, whereof I turned halfe a pound, or thereabouts, into pure Siluer, better than that of the Mine, as I my selfe assayed, and made others assay many times. This was vpon a Munday, the 17. of Ianuary about noone, in my house, Perrenelle onely being present; in the yeere of the restoring of mankind, 1382."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "28"
    "pdf_page": 48
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "28"
    "pdf_page": 48
  "translation_ja": "これを得ると、私は容易に大業を成就した。第一の作用体の調製法を知り、その後は本の字句どおりに従ったので、望んだとしても失敗しようがなかったからである。最初に投射を行った相手は水銀で、その半ポンドほどを、鉱山から得られるものより優れた純銀に変えた。これは自分で試金し、ほかの者にも何度も試金させた。時は、人類が救済されてから一三八二年、一月十七日の月曜日、正午ごろで、私の家において、ペルネルだけが立ち会っていた。"
  "translation_status": "draft"
  "source_kind": "prose"

  "translation_ja": "Clibanicallyはclibanus（窯・炉）に由来する副詞として「窯にふさわしく」と訳した。三人の権威を連ねる原文の条件節の切れ目は、そのままの修辞として保持。"
  "translation_status": "draft"
- "id": "FL-081-01"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The heate then of thy fire in this vessell, shall be (as saith Hermes and Rosinus) according to the Winter; or rather, as saith Diomedes, according to the heate of a Bird, which beginnes to flie so softly from the signe of Aries to that of Cancer: for know that the Infant at the beginning is full of cold flegme and of milke, and that too vehement heate is an enemy of the cold and moisture of our Embrion, and that the two enemies, that is to say, our two elements of cold and heate will neuer perfectly imbrace one another, but by litle and litle, hauing first long dwelt together, in the middest of the temperate heate of their bath, and being changed by long decoction, into Sulphur incombustible."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "61"
    "pdf_page": 81
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "61"
    "pdf_page": 81
  "translation_ja": "したがって、この容器の中のあなたの火の熱は、ヘルメスとロシヌスの言うように、冬に応じたものでなければならない。いやむしろ、ディオメデスが言うように、白羊宮から巨蟹宮へ、とても静かに飛び始める鳥の熱に応じたものでなければならない。知っておきなさい。幼子は初め、冷たい粘液と乳に満ちている。あまりに激しい熱は、われらの胎児の冷たさと湿り気の敵である。また、この二つの敵、すなわち冷と熱というわれらの二つの元素は、少しずつでなければ、決して完全には抱き合わない。まず浴の穏やかな熱の中で長く一緒に暮らし、長い煮熟によって不燃性の硫黄へ変えられて初めて、それが可能になるのである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-081-01-tn-001-text"

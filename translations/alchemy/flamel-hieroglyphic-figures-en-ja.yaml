  "section_id": "FL-FRONT"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Πολλαὶ μορφαὶ τῶν δαιμονίων,
    Πολλὰ δ’ ἀέλπτως κραίνουσι Θεοί,
    καὶ τὰ δοκηθέντ’ οὐκ ἐτελέσθη·
    τῶν δ’ ἀδοκήτων πόρον ηὗρε Θεός.
    τοιόνδ’ ἀπέβη τόδε πρᾶγμα.
  "source_languages":
  - "grc"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "pdf_page": 19
  "translation_ja": |-
    神意の姿はさまざまであり、
    神々は、思いもよらぬ多くのことを成し遂げる。
    期待されたことは実現せず、
    期待されぬことには、神が道を見いだした。
    この出来事も、このような結末となった。
  "translation_status": "draft"
  "source_kind": "poetry"

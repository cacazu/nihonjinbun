  "source_text": "CHAP. VI. Upon a greene field, three resuscitants, or which rise againe, two men and one woman, altogether white: Two Angels beneath, and over the Angels the figure of our Saviour comming to judge the world, clothed with a robe which is perfectly Citrine white."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "110"
    "pdf_page": 130
  "translation_ja": "第六章　緑の地の上に、全身白い三人の復活者、すなわち蘇る者たち、二人の男と一人の女。下方に二天使、その天使の上に、世界を裁くために来る救い主の像があり、完全に柑橘色を帯びた白い衣を着ている。"
  "translation_status": "draft"
- "id": "FL-132-01"
  "section_id": "FL-CH06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have so made to bee painted for thee a field vert, because that in this decoction the confections become greene, and keepe this colour longer than any other after the blacke. This greenesse shewes particularly that our Stone hath a vegetable soule, and that by the Industrie of Art it is turned into a true and pure tree, to bud abundantly, and afterwards to bring foorth infinite little sprigs and branches. O happy greene (saith the Rosary) which dost produce all things, without thee nothing can increase, vegetate, nor multiply."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "112"
    "pdf_page": 132
  "translation_ja": "このように緑の地を描かせたのは、この煮熟において配合物が緑になり、黒の後に現れるほかのどの色よりも長く、この色を保つからである。この緑は、とりわけ、私たちの石が植物的な魂をもち、術の巧みな働きによって真の純粋な樹木へ変わり、豊かに芽吹き、その後に無数の小枝や枝を伸ばすことを示す。『薔薇園』はいう。「ああ、幸いなる緑よ、お前はすべてを生み出す。お前なしには、何ものも増大し、生長し、増殖できない。」"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-132-02"
  "section_id": "FL-CH06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The three folke rising againe, clothed in sparkling white, represent the Body, Soule, and Spirit, of our white Stone. The Philosophers doe ordinarily use these termes of Art to hide the secret from evill men. They call the Body that blacke earth, obscure and darke, which wee make white. They call the Soule the other halfe divided from the Body, which by the will of God, and power of nature, gives to the body by his imbibitions and fermentations a vegetable soule, that is to say, power and vertue to bud, encrease, multiply, and to become white, as a naked shining sword: They call the Spirit, the tincture & drynesse, which as a Spirit hath power to pierce all Mettallick things;"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "112"
    "pdf_page": 132
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "112"
    "pdf_page": 132
  "translation_ja": "輝く白をまとって蘇る三人は、私たちの白い石の体、魂、霊を表す。哲学者たちは、悪人から秘密を隠すため、こうした術語を通常用いる。彼らが体と呼ぶのは、私たちが白くする、黒く、暗く、闇に包まれた土である。魂と呼ぶのは、体から分けたもう半分であり、神の意志と自然の力によって、その吸液と発酵を通じ、体へ植物的な魂を与えるものである。すなわち、芽を出し、増大し、増殖し、輝く抜き身の剣のように白くなる力と効力である。霊と呼ぶのは、染める力と乾燥であり、霊のように、あらゆる金属的なものへ浸透する力をもつ。"
  "translation_status": "draft"
  "source_kind": "prose"

  "translation_ja": "Boloynは原綴。ここではフランスのブローニュを指すものとして訳した。Sansonも原綴を保ち、現代の港名へ推定置換しない。"
  "translation_status": "draft"
- "id": "FL-044-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Our voyage had beene fortunate enough, & all ready, since we were entred into this Kingdome, he had most truly interpreted vnto mee the greatest part of my figures, where euen vnto the very points and prickes, he found great misteries, which seemed vnto mee wonderfull, when arriuing at Orleans, this learned man fell extreamely sicke, being afflicted with excessiue vomitings, which remained still with him of those he had suffered at Sea, and he was in such a continuall feare of my forsaking him, that hee could imagine nothing like vnto it. And although I was alwayes by his side, yet would he incessantly call for mee, but in summe hee dyed, at the end of the seuenth day of his sicknesse, by reason whereof I was much grieued, yet as well as I could, I caused him to be buried in the Church of the holy Crosse at Orleans, where hee yet resteth: God haue his soule, for hee dyed a good Christian: And surely, if I be not hindered by death, I will giue vnto that Church some reuenew, to cause some Masses to bee said for his soule euery day."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "24"
    "pdf_page": 44
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "24"
    "pdf_page": 44
  - "source_id": "source-1"

    "printed_page": "109"
    "pdf_page": 129
  "translation_ja": "ついでに、忘れず注意しておこう。月の乳は、太陽の処女の乳と同じではない。したがって白化の吸液には、黄金の赤のための吸液よりも白い乳が必要だと考えなさい。この移行で、私は失敗するかと思った。ユダヤ人アブラハムがいなければ、実際に失敗していただろう。このため、抜き身の剣を取る像を、あなたに必要な色で描かせた。それは白くするものの像だからである。"
  "translation_status": "draft"
  "source_kind": "prose"

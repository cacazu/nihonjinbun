- "id": "FL-053-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Building therefore, these Churches, Churchyards, and Hospitals in this City, I resolued my selfe, to cause to be painted in the fourth Arch of the Church-yard of the Innocents, as you enter in by the great gate in St. Dennis street, and taking the way on the right hand, the most true and essentiall markes of the Arte, yet vnder vailes, and Hieroglyphicall couertures, in imitation of those which are in the gilded Booke of Abraham the Iew, which may represent two things, according to the capacity and vnderstanding of them that behold them: First, the mysteries of our future and vndoubted Resurrection, at the day of Iudgement, and comming of good Iesus, (whom may it please to haue mercy vpon vs) a Historie which is well agreeing to a Churchyard. And secondly, they may signifie to them, which are skilled in Naturall Philosophy, all the principal and necessary operations of the Maistery."
  "source_languages":
  - "en"
  "source_locations":

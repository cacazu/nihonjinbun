  "source_locations": []
  "translation_ja": "enuiousはここでは単なる妬みではなく、秘術の知識を他者に明かすのを惜しむ姿勢を指す。"
  "translation_status": "draft"
- "id": "FL-077-01"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now then, my Sonne, let mee so call thee, both because I am now come to a great age, and also for that, it may be, thou art otherwise a child of this knowledge, (God inable thee to learne, and after to worke to his glory) Hearken vnto mee then attentiuelly, but passe no further if thou bee ignorant of the foresaid Principles."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "57"
    "pdf_page": 77
  "translation_ja": "さて、わが子よ、このように呼ばせてほしい。私がすでに高齢に達したこともあり、また別の意味でも、あなたがこの知の子弟であるかもしれないからである。神が、あなたに学ぶ力を、そして後には神の栄光のために働く力を与えてくださいますように。では、注意深く私の言葉を聞きなさい。ただし、先に述べた諸原理を知らないなら、この先へ進んではならない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-078-01"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This Vessell of earth, in this forme, is called by the Philosophers, their triple Vessell, for within it, there is in the middest a Stage, or a floore, and vpon that a dish or a platter full of lue-warme ashes, within the which is set the Philosophicall Egge, that is, a viall of glasse full of confections of Art (as of the scumme of the red Sea, and the fat of the Mercuriall winde:) which thou seest painted in forme of a Penner and Inkehorne. Now this Vessell of earth is open aboue, to put in the dish and the viall, vnder which by the open gate, is put in the Philosophicall fire, as thou knowest. So thou hast three vessels, and the threefold vessell:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "58"
    "pdf_page": 78
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "58"
    "pdf_page": 78
  "translation_ja": "この形をした土製の容器を、哲学者たちは自分たちの「三重の容器」と呼ぶ。その内部の中央には段、あるいは床があり、その上には生温かい灰で満たした皿が置かれている。その灰の中に、哲学の卵が据えられる。すなわち、術によって調えたもの、たとえば紅海の泡や水銀の風の脂で満たされたガラス瓶である。あなたがペン入れとインク壺の形に描かれているのを見るのは、これである。この土製の容器は、皿と瓶を入れるために上部が開いている。その下には、あなたが知るとおり、開口部から哲学の火が入れられる。このようにして、三つの容器と、三重の容器があることになる。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-078-01-tn-001-text"
  "section_id": "FL-CH02"

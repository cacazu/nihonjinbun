    "printed_page": "4"
    "pdf_page": 24
  "translation_ja": "私ニコラ・フラメルは公証人であり、この千三百九十九年、パリに住み、サン・ジャック・ド・ラ・ブーシュリー礼拝堂の近く、公証人通りにある自分の家で暮らしている。私の両親は、私を最も妬む者からさえ正直な人々と認められていたが、その資力が乏しかったため、私はラテン語をわずかしか学ばなかった。それにもかかわらず、神の恵みと、天国の男女の福なる聖人たち、とりわけガリシアの聖ヤコブの執り成しによって、哲学者たちの書物を理解する力には事欠かず、そこに深く秘められた秘密を学んだ。それゆえ、この大いなる恵みを思い起こすときには、生涯のどの瞬間にも、その場所が許すなら膝をつき、そうでなければ心の中で全霊をこめて、このうえなく慈しみ深い神に感謝を捧げずにはいられない。神は正しい者の子が戸ごとに物乞いして歩くのを決してお許しにならず、その祝福を全面的に信頼する者たちを欺くこともない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-024-02-tn-001-text"
  "section_id": "FL-INTRO"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "語り手の1399年という自己記述は、偽フラメル文書内の主張であり、歴史的自伝としての真正性を保証しない。"
  "translation_status": "draft"
- "id": "FL-025-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Whilest therefore, I Nicholas Flammel, Notary, after the decease of my Parents, got my liuing in our Art of Writing, by making Inuentories, dressing accounts, and summing vp the Expences of Tutors and Pupils, there fell into my hands, for the sum of two Florens, a guilded Booke, very old and large; It was not of Paper, nor Parchment, as other Bookes bee, but was onely made of delicate Rindes (as it seemed vnto me) of tender yong trees: The couer of it was of brasse, well bound, all engrauen with letters, or strange figures; and for my part, I thinke they might well be Greeke Characters, or some such like ancient language: Sure I am, I could not reade them, and I know well they were not notes nor letters of the Latine nor of the Gaule, for of them wee vnderstand a little. As for that which was within it, the leaues of barke or rinde, were ingrauen, and with admirable diligence written, with a point of Iron, in faire and neate Latine letters coloured."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "5"
    "pdf_page": 25
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "5"
    "pdf_page": 25
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "5"
    "pdf_page": 25
  "translation_ja": "さて、私ニコラ・フラメルは、両親の死後、公証人として、財産目録を作成し、勘定を整え、後見人と被後見人の支出を合計するという、われらの書記の仕事で生計を立てていた。そのころ、二フロリンで、非常に古く大きな、金で飾られた一冊の本を手に入れた。それはほかの本のように紙や羊皮紙でできておらず、私の見たところ、柔らかい若木の薄い樹皮だけでできていた。表紙は真鍮で、しっかりと製本され、全面に文字、あるいは奇妙な図形が刻まれていた。私には、それがギリシア文字か、それに似た何か古代の言語であろうと思われた。確かなのは、それを私には読めなかったということである。また、それがラテン語でもガリア語でもないことはよく分かった。これらの言語なら、われらも少しは理解するからである。中身については、樹皮の葉に刻みが施され、鉄の尖筆を用いて、見事な丹念さで、美しく整った彩色のラテン文字が書き込まれていた。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-027-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It contained thrice seuen leaues, for so were they counted in the top of the leaues, and alwayes euery seuenth leafe was without any writing, but in stead thereof, vpon the first seuenth leafe, there was painted a Virgin, and Serpents swallowing her vp; In the second seuenth, a Crosse where a Serpent was crucified; and in the last seuenth there were painted Desarts, or Wildernesses, in the middest whereof ran many faire fountaines, from whence there issued out a number of Serpents, which ran vp and downe here and there."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "7"
    "pdf_page": 27
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "7"
    "pdf_page": 27
  "translation_ja": "その本は七葉を三組、合わせて二十一葉から成っていた。各葉の上部にそのように番号が付されていたのである。そして七葉目ごとに、必ず文字がなく、その代わり、最初の七葉目には一人の処女と、彼女を呑み込む蛇たちが描かれていた。次の七葉目には、蛇が磔にされた十字架があり、最後の七葉目には砂漠、すなわち荒野が描かれ、そのただ中を多くの美しい泉が流れ、そこから無数の蛇が現れて、あちらこちらを行き来していた。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-027-01-tn-001-text"
  "section_id": "FL-INTRO"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "1624年版の画像は明瞭に「a Virgin, and Serpents swallowing her vp」とする。参照用のウェブ転写にある「a Rod ... it up」は採らない。"
  "translation_status": "draft"
- "id": "FL-028-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Vpon the first of the leaues, was written in great Capitall Letters of gold, ABRAHAM THE IEW, PRINCE, PRIEST, LEVITE, ASTROLOGER, AND PHILOSOPHER, TO THE NATION OF THE IEWES, BY THE WRATH OF GOD DISPERSED AMONG THE GAVLES, SENDETH HEALTH. After this it was filled with great execrations and curses (with this word MARANATHA, which was often repeated there) against euery person that should cast his eyes vpon it, if hee were not Sacrificer or Scribe."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "8"
    "pdf_page": 28
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "8"
    "pdf_page": 28
  "translation_ja": "最初の葉には、金色の大きな頭文字でこう記されていた。「ユダヤ人アブラハム、君主、祭司、レビ人、占星術師にして哲学者より、神の怒りによってガリア人の間に散らされたユダヤ民族に、平安を送る。」その後には、祭司あるいは書記でもないのにこの本に目を注ぐすべての者に対する激しい呪詛と呪いが満ちており、「マラナタ」という語が何度も繰り返されていた。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-029-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Hee that sold mee this Booke, knew not what it was worth, no more than I when I bought it; I beleeue it had beene stolne or taken from the miserable Iewes; or found hid in some part of the ancient place of their abode. Within the Booke, in the second leafe, hee comforted his Nation, councelling them to flie vices, and aboue all, Idolatry, attending with sweete patience the comming of the Messias, which should vanquish all the Kings of the Earth, and should raigne with his people in glory eternally. Without doubt this had beene some very wise and vnderstanding man."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "9"
    "pdf_page": 29
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "9"
    "pdf_page": 29
  "translation_ja": "この本を私に売った者は、その価値を知らなかった。買ったときの私も同様であった。この本は、不幸なユダヤ人たちから盗まれたか奪われたか、あるいは彼らが古く住んでいた場所のどこかに隠されているのが発見されたのだろうと私は思う。本の第二葉では、著者は同胞を慰め、悪徳、とりわけ偶像崇拝を避け、地上のすべての王に打ち勝ち、ご自身の民とともに永遠に栄光のうちに統治するメシアの到来を、穏やかな忍耐をもって待つよう勧めていた。疑いなく、これはたいへん賢明で理解力に富む人物であったに違いない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-030-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In the third leafe, and in all the other writings that followed, to helpe his Captiue nation to pay their tributes vnto the Romane Emperours, and to doe other things, which I will not speake of, he taught them in common words the transmutation of Mettalls; hee painted the Vessels by the sides, and hee aduertised them of the colours, and of all the rest, sauing of the first Agent, of the which hee spake not a word, but onely (as hee said) in the fourth and fifth leaues entire hee painted it, and figured it with very great cunning and workemanship: for although it was well and intelligibly figured and painted, yet no man could euer haue beene able to vnderstand it, without being well skilled in their Cabala, which goeth by tradition, and without hauing well studied their bookes."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "10"
    "pdf_page": 30
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "10"
    "pdf_page": 30
  "translation_ja": "第三葉とそれ以後のすべての記述では、囚われの同胞がローマ皇帝への貢税を払い、また私がここでは語らないほかのことを行えるよう助けるため、著者は平明な言葉で金属の変成を教えていた。傍らには容器を描き、色とそのほかの一切について知らせていたが、第一の作用体についてだけは一言も語らなかった。ただし本人の言うところでは、第四葉と第五葉の全面にわたり、きわめて巧妙で優れた技術によって、それを絵と図に示したのである。とはいえ、よく分かるように巧みに図示され彩色されていても、伝承によって伝えられる彼らのカバラに熟達し、彼らの書物をよく研究していなければ、誰一人それを理解できなかったであろう。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-030-01-tn-001-text"
  "section_id": "FL-INTRO"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "Agentは錬金術的に作用を及ぼすものを指し、ここでは「作用体」と訳す。"
  "translation_status": "draft"
- "id": "FL-031-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The fourth and fifth leafe therefore, was without any writing, all full of faire figures enlightened, or as it were enlightened: for the worke was very exquisite. First he painted a young man, with wings at his anckles, hauing in his hand a Caducean rodde, writhen about with two Serpents, wherewith hee strooke vpon a helmet which couered his head; he seemed to my small iudgement, to be the God Mercury of the Pagans: against him there came running and flying with open wings, a great old man, who vpon his head had an houre-glasse fastened, and in his hands a hooke (or sithe) like Death, with the which, in terrible and furious manner, hee would haue cut off the feet of Mercury."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "11"
    "pdf_page": 31
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "11"
    "pdf_page": 31
  "translation_ja": "したがって第四葉と第五葉には文章がなく、彩色された、あるいは彩色されたかのような美しい図像が一面に描かれていた。それほど仕事が精緻だったのである。まず、足首に翼を持つ若者が描かれていた。手には二匹の蛇が巻きついたカドゥケウスの杖を持ち、それで自分の頭を覆う兜を打っていた。乏しい私の判断では、それは異教徒の神メルクリウスに見えた。その若者に向かって、大きな老人が翼を広げて駆け、かつ飛んできた。頭には砂時計を取り付け、手には死神のように鎌を持ち、それを用いて恐ろしく激しい様子でメルクリウスの足を切り落とそうとしていた。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-032-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On the other side of the fourth leafe, hee painted a faire flowre on the top of a very high mountaine, which was sore shaken with the North wind; it had the foot blew, the flowres white and red, the leaues shining like fine gold: And round about it the Dragons and Griffons of the North made their nests and abode. On the fifth leafe there was a faire Rose-tree flowred in the middest of a sweet Garden, climbing vp against a hollow Oake; at the foot whereof boyled a fountaine of most white water, which ranne head-long downe into the depths, notwithstanding it first passed among the hands of infinite people, which digged in the Earth seeking for it; but because they were blinde, none of them knew it, except here and there one which considered the weight."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "12"
    "pdf_page": 32
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "12"
    "pdf_page": 32
  "translation_ja": "第四葉の裏面には、非常に高い山の頂に、美しい花が描かれていた。その花は北風に激しく揺さぶられ、根もとは青く、花は白と赤、葉は純金のように輝いていた。周囲には北方の竜とグリフォンが巣を作り、棲みついていた。第五葉には、香りよい庭園の中央で花咲く美しい薔薇の木があり、うろのある樫に沿って這い上がっていた。その根もとでは、きわめて白い水の泉が沸き立ち、深みへとまっしぐらに流れ落ちていた。ただし水はまず、それを求めて大地を掘る無数の人々の手の間を通っていた。彼らは盲目だったため、それに気づく者はいなかった。ただ、ときおりその重さに注意を向けた者だけが、それを知ったのである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-033-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On the last side of the fift leafe, there was a King with a great Fauchion, who made to be killed in his presence by some Souldiers a great multitude of little Infants, whose Mothers wept at the feet of the vnpittifull Souldiers: the bloud of which Infants was afterwards by other Souldiers gathered vp, and put in a great vessell, wherein the Sunne and the Moone came to bathe themselues. And because that this History did represent the more part of that of the Innocents slaine by Herod, and that in this Booke I learned the greatest part of the Art, this was one of the causes, why I placed in their Churchyard these Hieroglyphick Symbols of this secret science. And thus you see that which was in the first fiue leaues."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "13"
    "pdf_page": 33
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "13"
    "pdf_page": 33
  "translation_ja": "第五葉の最後の面には、大きな湾刀を持つ王が描かれていた。王は自分の面前で、兵士たちに大勢の幼い子どもを殺させ、その母親たちは、情け容赦のない兵士たちの足もとで泣いていた。幼子たちの血は、その後ほかの兵士によって集められて大きな容器に入れられ、太陽と月がそこへ水浴びに来た。この物語は、ヘロデに殺された幼子殉教者の物語と大部分で重なっていた。また私は、この本から術の大半を学んだ。そのため、この秘められた学問の象形的な象徴を彼らの墓地に置いたのである。それが理由の一つであった。以上が最初の五葉に記されていた事柄である。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-034-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I will not represent vnto you that which was written in good and intelligible Latine in all the other written leaues, for God would punish me, because I should commit a greater wickednesse, then he who (as it is said) wished that all the men of the World had but one head that hee might cut it off at one blow."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "14"
    "pdf_page": 34
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "14"
    "pdf_page": 34
  "translation_ja": "ほかの文字のある葉のすべてに、明瞭な良いラテン語で何が書かれていたかは、あなたがたに示さない。示せば神は私を罰されるであろう。なぜなら、それは、この世の人間すべての頭が一つだけであれば、それを一撃で切り落とせるのに、と願ったというあの男よりも、さらに大きな悪を犯すことになるからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-035-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Hauing with me therefore this faire Booke, I did nothing else day nor night, but study vpon it, vnderstanding very well all the operations that it shewed, but not knowing with what matter I should beginne, which made me very heauy and sollitary, and caused me to fetch many a sigh. My wife Perrenelle, whom I loued as my selfe, and had lately married, was much astonished at this, comforting mee, and earnestly demanding, if shee could by any meanes deliuer mee from this trouble: I could not possibly hold my tongue, but told her all, and shewed her this faire Booke, whereof at the same instant that shee saw it, shee became as much enamored as my selfe, taking extreame pleasure to behold the faire couer, grauings, images, and portraicts, whereof notwithstanding shee vnderstood as little as I: yet it was a great comfort to mee to talke with her, and to entertaine my selfe, what wee should doe to haue the interpretation of them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "15"
    "pdf_page": 35
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "15"
    "pdf_page": 35
  "translation_ja": "こうしてこの美しい本を手元に置いた私は、昼も夜も、その研究以外には何もしなかった。そこに示された操作はすべてよく理解できたが、どの物質から始めればよいのか分からず、そのためひどく気が沈んで孤独になり、何度もため息をついた。つい先ごろ結婚し、わが身のように愛していた妻ペルネルは、これにたいへん驚き、私を慰め、何とかしてこの苦悩から私を救うことはできないかと熱心に尋ねた。私はどうしても黙っていられず、すべてを話し、この美しい本を妻に見せた。妻はそれを目にした瞬間、私と同じほど魅了され、美しい表紙や彫刻、図像や絵姿を眺めることに、このうえない喜びを覚えた。とはいえ、その意味については私と同じくほとんど理解できなかった。それでも妻と語り合い、それらの解釈を得るにはどうすればよいかと思いを巡らすことは、私にとって大きな慰めであった。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-036-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In the end I caused to bee painted within my Lodging, as naturally as I could, all the figures and portraicts of the fourth and fifth leafe, which I shewed to the greatest Clerkes in Paris, who vnderstood thereof no more then my selfe: I told them they were found in a Booke that taught the Phylosophers stone, but the greatest part of them made a mocke both of me, and of that blessed Stone, excepting one called Master Anselme, which was a Licentiate in Physick, and studied hard in this Science: He had a great desire to haue seene my Book, and there was nothing in the world, which he would not haue done for a sight of it: but I alwayes told him, that I had it not; onely I made him a large description of the Method. He told mee that the first portraict represented Time, which deuoured all; and that according to the number of the sixe written leaues, there was required the space of sixe yeeres, to perfect the stone; and then he said, wee must turne the glasse, and seeth it no more."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "16"

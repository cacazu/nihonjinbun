  "translation_ja": "第七章　紫と青の地の上にいる、橙色の二天使、およびその巻紙"
  "translation_status": "draft"
- "id": "FL-140-02"
  "section_id": "FL-CH07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This violet and blew field sheweth, that being to passe from the white Stone to the red, thou must imbibe it with a little virgins milke of the Sun, and that these colours come out of the Mercuriall moysture which thou hast dried upon the Stone. In this operation of rubifying, although thou doe imbibe, thou shalt not have much blacke, but of violet, blew, and of the colour of the Peacocks taile: For our Stone is so triumphant in drynesse, that assoone as thy Mercury toucheth it, the nature thereof rejoycing in his like nature, it is joyned unto it, and drinketh it greedily, and therefore the blacke that comes of moysture, can shew it selfe but a little, and that under these colours violet and blew, because that drynesse (as is said) doth by and by governe absolutely."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "120"
    "pdf_page": 140
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "120"
    "pdf_page": 140
  "translation_ja": "この紫と青の地は、白い石から赤い石へ移るとき、太陽の処女の乳を少し吸わせなければならないこと、そしてこれらの色が、石の上で乾かした水銀的な湿気から出て来ることを示す。この赤化の操作では、吸液させても黒はあまり現れず、紫、青、そして孔雀の尾の色が現れる。私たちの石は乾燥においてたいへん強く、メルクリウスが触れるやいなや、その自然は似た自然を喜んで結びつき、貪るように飲み込む。だから湿気から生じる黒さは、ほんの少ししか姿を見せず、しかも紫と青の色の下に隠れる。すでに述べたように、乾燥がすぐさま絶対的に支配するからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-141-01"
  "section_id": "FL-CH07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have also made to be painted for thee, these two Angels with wings, to represent unto thee, that the two substances of thy confections, the Mercuriall, and the sulphurous substance, the fixed as well as the volatile, being perfectly fixed together, do also flie together within thy vessell: for in this operation, the fixed body wil gently mount to heaven, being all spirituall, and from thence it will descend unto the earth, and whether so ever thou wilt, following every where the Spirit, which is alwayes mooved upon the fire: Inasmuch as they are made one selfe same nature, and the compound is all spirituall, and the spirituall all corporall, so much hath it beene subtilized upon our Marble, by the precedent operations. The natures then are heere transmuted into Angels, that is to say, are made spirituall and most subtle, so are they now the true tinctures."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "121"
    "pdf_page": 141
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "121"
    "pdf_page": 141
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "121"
    "pdf_page": 141
  "translation_ja": "また、あなたのために、この二天使には翼を描かせた。配合物の二つの実体、水銀的なものと硫黄的なもの、固定的なものと揮発的なものが、完全に一緒に固定され、器の中でも一緒に飛ぶことを示すためである。この操作では、固定した体が、すべて霊的となって穏やかに天へ昇り、そこから土へ、またあなたが望むあらゆる場所へ下る。火の上で常に動く霊に、どこまでも従うのである。両者は一つの同じ自然となり、複合物はすべて霊的、霊的なものはすべて物体的となった。先行する操作によって、私たちの大理石の上で、これほど精微にされたのだ。したがって、ここで諸自然は天使へ変成する。つまり霊的で、きわめて精妙なものとなり、いまや真の染める力となるのである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-143-01"
  "section_id": "FL-CH07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now remember thee to begin the rubifying, by the apposition of Mercury Citrine red, but thou must not powre on much, and onely once or twice, according as thou shalt see occasion; for this operation ought to bee done by a dry fire, and by a dry sublimation and calcination."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "123"
    "pdf_page": 143
  "translation_ja": "いま、柑橘色を帯びた赤いメルクリウスを加えて赤化を始めることを忘れてはならない。しかし多く注いではならず、状況に応じ、一度か二度だけにする。この操作は、乾いた火、乾いた昇華と焼成によって行われるべきだからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-143-02"
  "section_id": "FL-CH07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And truely I tell thee heere a secret which thou shalt very seldome finde written, so farre am I from being envious, that would to God every man knew how to make gold to his owne will, that they might live, and leade foorth to pasture their faire flocks, without Usury or going to Law, in imitation of the holy Patriarks, using onely (as our first Fathers did) to exchange one thing for another; and yet to have that, they must labour as well as now. Howbeit for feare to offend God, and to be the instrument of such a change, which peradventure would proove evill, I must take heed to represent or write where it is that wee hide the keyes, which can open all the doores of the secrets of nature, or to open or cast up the earth in that place, contenting my selfe to shew the things which will teach every one to whom God shall give permission to know, what property the signe of the Balance or Libra hath, when it is inlightned by the Sunne and Mercury in the moneth of October."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "123"
    "pdf_page": 143
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "123"
    "pdf_page": 143
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "123"
    "pdf_page": 143
  "translation_ja": "実に私はここで、書かれたものとしてはめったに見いだせない秘密を告げている。それほど、秘密を惜しむ心から遠いのである。神の御心ならば、誰もが思いのままに金を作る方法を知ればよいと思う。そうすれば、高利貸しや訴訟に頼らず、聖なる族長たちに倣って暮らし、美しい家畜の群れを牧場へ導けるだろう。最初の父祖たちがしたように、一つのものを別のものと交換するだけでよい。ただし、それを得るためには、いまと同じく働かなければならない。それでも、神を怒らせ、ことによると悪い結果をもたらす変化の道具となることを恐れ、自然の秘密のすべての扉を開ける鍵をどこへ隠したか、描いたり書いたりしないよう用心しなければならない。その場所の土を開いたり掘り返したりすることも避ける。ただ、神が知ることを許したすべての人に、十月、太陽とメルクリウスに照らされる天秤の宮、すなわち天秤座がどのような性質をもつかを教える事柄を、示すだけで満足しよう。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-145-01"
  "section_id": "FL-CH07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These Angels are painted of an orange colour, to let thee know, that thy white confections have beene a little more digested, or boyled, and that the blacke of the violet and blew hath beene already chased away by the fire: for this orange colour is compounded of the faire golden Citrine red (which thou hast so long waited for) and of the remainder of this violet and blew, which thou hast already in part, banished and undone. Furthermore this orange colour sheweth, that the natures are digested, and by little and little perfected by the grace of God."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "125"
    "pdf_page": 145
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "125"
    "pdf_page": 145
  "translation_ja": "天使たちを橙色に描いたのは、白い配合物がもう少し熟成、あるいは煮沸され、紫と青のうちの黒さが、すでに火で追い払われたことを知らせるためである。この橙色は、長く待ち望んだ美しい黄金の柑橘赤と、すでに一部を追い払い消し去った紫と青の残りとの、混合だからである。さらにこの橙色は、諸自然が熟成し、神の恵みによって少しずつ完成されていることを示す。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-146-01"
  "section_id": "FL-CH07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As for their Rowle, which saith, SVRGITE MORTVI, VENITE AD JVDICIVM DOMINI MEI, that is, Arise you dead, and come unto the judgement of God my Lord; I have made it be put there, onely for the Theologicall sence, rather than any other: It ends in the throate of a Lyon which is all red, to teach that this operation must not bee discontinued untill they see the true red purple, wholly like unto the Poppy of the Hermitage, and the vermillion of the painted Lyon, saving for multiplying."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "126"
    "pdf_page": 146
  "translation_ja": "「SVRGITE MORTVI, VENITE AD JVDICIVM DOMINI MEI」、すなわち「死者たちよ、起きよ。私の主なる神の裁きへ来れ」と記した巻紙は、ほかの意味よりも、ただ神学的な意味のために置かせた。それは全身赤い獅子の喉で終わる。増殖の場合を除いて、この操作は、隠修庵のケシの花と、描かれた獅子の朱色にそっくりな、真の赤紫を見るまで中断してはならないことを教えるためである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-146-01-tn-001-text"
  "section_id": "FL-CH07"
  "kind": "note_body"

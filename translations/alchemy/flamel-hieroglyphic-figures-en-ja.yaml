  "translation_ja": "Argent viueは水銀。ここは物語内のアンセルムによる誤った解釈であり、次段で血の使用を明確に否定する。"
  "translation_status": "draft"
- "id": "FL-039-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This was the cause, that during the space of one and twenty yeeres, I tryed a thousand broulleryes, yet neuer with bloud, for that was wicked and villanous: for I found in my Booke, that the Phylosophers called Bloud, the minerall spirit, which is in the Mettals, principally in the Sunne, Moone, and Mercury, to the assembling whereof, I alwayes tended; yet these interpretations for the most part were more subtile then true. Not seeing therefore in my workes the signes, at the time written in my Booke, I was alwayes to beginne againe."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "19"
    "pdf_page": 39
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "19"
    "pdf_page": 39
  "translation_ja": "これがもとで、私は二十一年もの間、千通りもの混ぜ合わせを試みた。しかし血は一度も使わなかった。それは邪悪で卑劣なことだからである。私の本には、哲学者たちが「血」と呼ぶのは金属の中にある鉱物の霊であり、とりわけ太陽、月、水星の中にあるものだと書かれていたので、私はつねにそれらを結び合わせることを目指していた。それでも、これらの解釈は大部分、真実というより巧妙な思弁であった。そのため、本に記された時期に、私の作業の中で所定の徴が現れず、いつも初めからやり直さなければならなかった。"
  "translation_status": "draft"
  "source_kind": "prose"

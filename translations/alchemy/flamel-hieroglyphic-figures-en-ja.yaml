    "printed_page": "104"
    "pdf_page": 124
  "translation_ja": "聖パウロの像の衣には、金色と赤い柑橘色の幅広い縁取りがある。ああ、わが子よ、もしこれを見るなら神を讃えなさい。いまや天からの慈悲を得たのだから。そこで吸液させ、染めなさい。幼子がたくましく強くなり、水と火を相手に戦えるようになるまで続けるのである。これを成し遂げれば、デマゴラス、セニオル、ハリが「母がつい先ごろ産んだ幼子の腹へ、その母を入れる」と呼んだことを行うことになる。彼らが母と呼ぶのは、吸液と発酵に用いる哲学者たちのメルクリウスであり、幼子と呼ぶのは体である。このメルクリウスは、その体を染め、色づけるために出ていったのである。"
  "translation_status": "draft"
  "source_kind": "prose"

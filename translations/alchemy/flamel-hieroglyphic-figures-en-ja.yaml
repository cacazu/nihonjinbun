  "translation_ja": "その後も常に本の一語一語に従い、同じ量の水銀に赤い石を投射した。これも同じ家でペルネルだけが立ち会い、同年、続く四月二十五日の夕方五時ごろのことであった。その水銀を、私は実際に、ほぼ同量の純金へと変成させた。それは確かに普通の金より優れ、より柔らかく、より展性に富んでいた。"

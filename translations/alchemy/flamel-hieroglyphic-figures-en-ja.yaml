  "source_text": "I have then given thee this Table, to tell thee that thou must whiten my body, which is upon the knees, and demandeth no other thing: for Nature alwayes tends to perfection, which thou shalt accomplish by the apposition of Virgins milke, and by the decoction of the matters which thou shalt make with this milke, which being dryed upon this body, wil colour it into this same white yellow, which he who takes the Sword, is clothed withall, in which colour thou must make thy Corsufle to come."
  "source_languages":

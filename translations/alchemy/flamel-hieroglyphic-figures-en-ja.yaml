  "translation_ja": "Pontique は「ポントスの」のほか、渋み・鋭さ・腐食性を示す錬金術的用語として用いられる。特定の現代物質へは同定しない。"
  "translation_status": "draft"
- "id": "FL-093-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For at the same time the Matter is dissolved, is corrupted, groweth blacke, and conceiveth to ingender; for all corruption is generation, and therefore ought blackenesse to be much desired; for that is the blacke saile with the which the Ship of Theseus came backe victorious from Crete, which was the cause of the death of his Father; so must this father die, to the intent, that from the ashes of this Phœnix another may spring, and that the sonne may bee King."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "73"
    "pdf_page": 93
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "73"
    "pdf_page": 93
  "translation_ja": "というのも質料は、溶けると同時に腐り、黒くなり、孕んで生み出そうとするからである。あらゆる腐敗は生成である。だから黒さは大いに望まれるべきものなのだ。それは、テセウスの船がクレタから勝利して戻った際の黒い帆であり、彼の父の死を招いたものである。この父も同じように死ななければならない。この不死鳥の灰から別の不死鳥が生まれ、息子が王となるためである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-094-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Assuredly hee that seeth not this blackenesse at the beginning of his operations, during the dayes of the Stone; what other colour soever hee see, hee shall altogether fayle in the Maisterie, and can doe no more with that Chaos: for he workes not well, if he putrifie not; because if he doe not putrifie, he doeth not corrupt, nor ingender, and by consequent, the Stone cannot take vegetative life to increase and multiply."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "74"
    "pdf_page": 94
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "74"
    "pdf_page": 94
  "translation_ja": "確かに、作業の始まり、石の時期にこの黒さを見ない者は、ほかにどんな色を見ようとも、この術にまったく失敗し、その混沌からはもう何もできない。腐敗させなければ、正しく働かせたことにならないからである。腐敗しなければ朽ちず、生成もせず、したがって石は、生長し増殖するための植物的生命を受け取れない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-095-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And in all truth, I tell thee againe, that though thou work upon the true matter, if at the beginning, after thou hast put thy Confections in the Philosophers Egge, that is to say, sometime after the fire have stirred them up, if then, I say, thou seest not this head of the Crow, the blacke of the blackest blacke, thou must begin againe, for this fault is irreparable, and not to be amended; especially the Orange colour, or halfe red, is to be feared, for if at the beginning thou see that in thine Egge, without doubt, thou burnest, or hast burnt the verdure and juelinesse of thy Stone."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "75"
    "pdf_page": 95
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "75"
    "pdf_page": 95
  "translation_ja": "私はもう一度、まったく真実のことを告げる。たとえ真の質料を用いていても、始めに配合物を哲学者の卵へ入れ、すなわち火がそれらを動かしてからしばらくたったとき、この烏の頭、最も黒い黒のうちの黒を見なければ、初めからやり直さなければならない。この誤りは回復不能で、修正できないからである。とりわけ橙色、あるいは半ば赤い色を恐れなければならない。始めに卵の中でその色を見れば、間違いなく石の瑞々しさとみずみずしい汁気を焼いているか、すでに焼き尽くしたのである。"
  "translation_status": "draft"
  "source_kind": "prose"

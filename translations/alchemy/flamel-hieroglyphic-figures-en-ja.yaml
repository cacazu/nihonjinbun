- "id": "FL-096-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The colour which thou must have, ought to be intirely perfected in Blacknesse, like to that of these Dragons in the space of fortie dayes: Let them therefore which shall not have these essentiall marks, retire themselves betimes from their operations, that they may redeeme themselves from assured losse."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "76"
    "pdf_page": 96
  "translation_ja": "得るべき色は、四十日のあいだに、この竜たちの黒さと同じく、完全な黒へ仕上がらなければならない。したがって、これらの本質的なしるしを得られない者は、時機を失しないうちに作業から退き、確実な損失から自分を救うがよい。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-096-02"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Know also, and note it well, that in this Art it is but nothing to have this blacknesse, there is nothing more easie to come by: for from almost all things in the world, mixed with moisture, thou mayest have a blacknesse by the fire: but thou must have a blacknesse which comes of the perfect Mettallicke bodies, which lasts a long space of time, and is not destroyed in lesse than five moneths, after the which followeth immediately the desired whitenesse. If thou hast this, thou hast enough, but not all."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "76"
    "pdf_page": 96
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "76"
    "pdf_page": 96
  "translation_ja": "また、よく心に留めて知りなさい。この術では、単に黒さを得ただけでは何にもならない。それほど容易に得られるものはないからである。世のほとんどすべてのものは、湿り気と混ぜれば、火によって黒くできる。しかし必要なのは、完全な金属的物体から生じる黒さであり、長いあいだ続き、五か月未満では消えず、その後ただちに望まれた白さが続くものである。これを得れば十分ではあるが、まだすべてではない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-097-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As for the colour blewish and yellowish, that signifieth that Solution and Putrefaction is not yet finished, and that the colours of our Mercury are not as yet well mingled, and rotten with the rest. Then this blacknesse, and these colours, teach plainely, that in this beginning the matter, and compound begins to rotten and dissolve into powder, lesse than the Atomes of the Sunne, the which afterwards are changed into water permanent."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "77"
    "pdf_page": 97
  "translation_ja": "青みと黄みを帯びた色は、溶解と腐敗がまだ終わらず、私たちのメルクリウスの色も、ほかのものと十分に混ざり合って腐っていないことを表す。したがって、この黒さとこれらの色は、この初期段階で、質料と混合物が腐り始め、日光の中に見える塵の粒よりも小さな粉に解け始めていることを、明らかに教えている。この粉は、後に恒久の水へ変わる。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-098-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And this dissolution is by the envious Philosophers called Death, Destruction, and Perdition, because that the natures change their forme, and from hence are proceeded so many Allegories of dead men, tombes, and sepulchres. Others have called it Calcination, Denudation, Separation, Erituration, and Assation, because the Confections are changed and reduced into most small pieces and parts. Others have called it Reduction into the first matter, Mollification, Extraction, Commixtion, Liquefaction, Conversion of Elements, Subtiliation, Division, Humation, Impastation, and Distillation, because that the Confections are melted, brought backe into seed, softened, and circulated within the glasse."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "78"
    "pdf_page": 98
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "78"
    "pdf_page": 98
  "translation_ja": "この溶解を、秘密を惜しむ哲学者たちは「死」「破壊」「滅亡」と呼ぶ。自然の諸性がその形を変えるからであり、死者、墓、埋葬所についての多くの寓意もここから生じた。ほかの人々は「焼成」「裸化」「分離」「粉砕」「焙焼」と呼ぶ。配合物が変わり、ごく小さい破片と部分へ分けられるからである。また別の人々は「第一質料への還元」「軟化」「抽出」「混合」「液化」「元素の転換」「精微化」「分割」「埋葬」「練和」「蒸留」と呼ぶ。配合物が融け、種子へ戻され、柔らかくなり、ガラス器の中で循環するからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-098-01-tn-001-text"
  "section_id": "FL-CH03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "Erituration は刊本の語形を保つ。文脈上 trituration（粉砕・磨砕）に相当する。envious は知識を他者に明かすことを惜しむという含み。"
  "translation_status": "draft"
- "id": "FL-099-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Others have called it Xir, or Iris, Putrefaction, Corruption, Cymmerian darkenesse, a gulfe, Hell, Dragons, Generation, Ingression, Submersion, Completion, Conjunction, and Impregnation, because that the matter is black & waterish, and that the natures are perfectly mingled, and hold one of another."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "79"
    "pdf_page": 99
  "translation_ja": "さらに「クシル」あるいは「イリス」「腐敗」「腐朽」「キンメリアの闇」「深淵」「地獄」「竜」「生成」「進入」「沈水」「完成」「結合」「受胎」とも呼ばれる。質料が黒く水っぽくなり、自然の諸性が完全に混ざって互いに結びつくからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-099-02"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For when the heate of the Sunne worketh upon them, they are changed, first into powder, or fat and glutinous water, which feeling the heate, flyeth on high to the Poulets head, with the smoake, that is to say, with the wind and ayre; from thence this water melted, and drawne out of the confections, goeth downe againe, and in descending reduceth, and resolveth, as much as it can, the rest of the Aromaticall confections, alwayes doing so, untill the whole bee like a blacke broath somewhat fat. Now you see, why they call this sublimation, and volatization, because it flyeth on high, and Ascension and Descension, because it mounteth, & descendeth within the glasse."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "79"
    "pdf_page": 99
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "79"
    "pdf_page": 99
  "translation_ja": "太陽の熱がこれらに働くと、まず粉、あるいは脂っこく粘る水へ変わる。その水は熱を感じると、煙とともに、つまり風と空気とともに、若鶏の頭へ向かって高く飛び上がる。配合物から融け出して引き出されたこの水は、そこから再び下り、下る際に残りの芳香ある配合物を、できるかぎり分解し、溶かす。全体がやや脂っこい黒い煮汁のようになるまで、いつもこのことを繰り返す。これをなぜ「昇華」「揮発」と呼ぶのか、いまや分かるだろう。高く飛び上がるからである。「上昇」「下降」と呼ぶのは、ガラス器の中で上り、下るからである。"
  "translation_status": "draft"
  "source_kind": "prose"

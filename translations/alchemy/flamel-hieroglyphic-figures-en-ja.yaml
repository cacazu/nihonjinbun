  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "91"
    "pdf_page": 111
  "translation_ja": "秘密を惜しむ者たちは、この操作の配合物を、ヌンムス、エテリア、アレナ、ボリティス、コルスフレ、カンバル、アルバル・アエリス、ドゥエネク、ランデリク、ククル、タブリキス、エビセメク、イクシルなどとも呼び、これらを白くするよう命じた。"
  "translation_status": "draft"
  "source_kind": "prose"

    "precision": "page"
    "printed_page": "71"
    "pdf_page": 91
  "translation_ja": "この二匹の竜、すなわち金属の原理について、先に引いた私の『摘要』では、敵がその熱によって相手の敵を燃え立たせ、その際に注意しなければ、空中に毒の煙と悪臭を見るだろう、と述べた。それは炎においても毒においても、蛇やバビロニアの竜の毒ある頭より、なお恐ろしいものなのである。"
  "translation_status": "draft"
  "source_kind": "prose"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "Whereupon one of the most envious hath said, Our head of the Crow is leprous, and therefore he that would clense it, hee must make it goe downe seven times into the River of regeneration of Jordan, as the Prophet commanded the leprous Naaman the Syrian. Comprehending herein the beginning, which is but of a few dayes, the middle, and the end, which is also very short."
  "source_languages":
  - "en"
  "source_locations":

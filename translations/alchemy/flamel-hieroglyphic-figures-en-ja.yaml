  "translation_ja": "これらの変身は『エジプトの七つの封印の書』に詳しく記されている。そこには、すべての著者も同じく述べるとおり、石は黒さを完全に捨て、最も輝く大理石や、炎を上げる抜き身の剣のように白くなるまでに、想像しうるあらゆる色をまとう、とある。たびたび融け、たびたび自ら凝固する。内にある植物的な魂が、同じ時に行わせるこれら多様で相反する操作のうちに、柑橘色、緑、赤となる。ただし真の赤ではない。黄、青、橙にもなる。ついには乾燥と熱に完全に征服され、無数の色はすべて、聖パウロの衣の色である、驚くべき柑橘色を帯びた白さへ終着する。それはほどなく抜き身の剣の色となる。その後、より強く長い煮熟によって、ついに赤い柑橘色を取り、さらに完全な朱の赤となって、永遠にそこへ安らう。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-129-01"
  "section_id": "FL-CH05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I will not forget, by the way, to advertise thee, that the milke of the Moone, is not as the Virgins milke of the Sunne; thinke then that the imbibitions of whitenesse, require a more white milke, than those of a golden rednesse; for in this passage I had thought I should have missed, and so I had done indeed had it not beene for Abraham the Jew; for this reason I have made to bee painted for thee, the Figure which taketh the naked sword, in the colour which is necessary for thee; for it is the Figure of that which whiteneth."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"

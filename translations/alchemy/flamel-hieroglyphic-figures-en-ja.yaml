  "translation_ja": "そこで私はこの図を与えた。跪き、ほかの何も求めていない私の体を白くしなければならない、と告げるためである。自然は常に完成へ向かう。それをあなたは、処女の乳を加え、その乳によって質料を煮熟することによって成し遂げる。この乳は体の上で乾くと、剣を取る者の衣と同じ黄白色に、体を染める。あなたのコルスフレも、この色に至らせなければならない。"
  "translation_status": "draft"
  "source_kind": "prose"

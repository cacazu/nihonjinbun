  "source_languages": []
  "source_locations": []
  "translation_ja": "PDF78の冒頭に、この節の容器を表す木版図がある。Philosophicall Eggeは錬金術の密閉容器を示す伝統的比喩。「紅海の泡」「水銀の風の脂」は原文の象徴語として保持した。"
  "translation_status": "draft"
- "id": "FL-079-01"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The enuious haue called an Athanor, a siue, dung, Balneum Mariæ, a Furnace, a Sphere, the greene Lyon, a prison, a graue, a vrinall, a phioll, and a Bolts-head: I my selfe in my Summarie or Abridgement of Philosophy, which I composed foure yeeres and two moneths past, in the end thereof named it the house and habitation of the Poulet, and the ashes of the Platter, the chaffe of the Poulet; The common name is an Ouen, which I should neuer haue found, if Abraham the Iew had not painted it, together with the fire proportionable, wherein consists a great part of the secret."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "59"
    "pdf_page": 79
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "59"
    "pdf_page": 79
  "translation_ja": "秘密を惜しむ者たちは、これをアタノール、篩、糞、マリアの浴、炉、球、緑の獅子、牢獄、墓、尿瓶、小瓶、そして丸底の長頸瓶と呼んできた。私自身も、四年二か月前に書いた『哲学の梗概、あるいは摘要』の末尾で、それを若鶏の家、住まいと呼び、皿の灰を若鶏の籾殻と呼んだ。普通の名はオーブン、すなわち焼き窯である。ユダヤ人アブラハムが、釣り合いの取れた火とともにそれを描いていなければ、私は決して見つけられなかったであろう。秘密の大部分は、その火の釣り合いに存するからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-079-01-tn-001-text"
  "section_id": "FL-CH02"

  "translation_ja": "この操作の中ほどは、黒い帯を完全に五巻き、五周させることで描いた。この時期には、豊富に与えなければならず、処女の乳が質料全体を取り囲むほどにする。私たちのサラマンダーは火を糧にし、火の中に生き、実際に火そのものであり、何ものをも恐れず火の中を走る生ける銀、すなわち水銀だからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-122-01"
  "section_id": "FL-CH05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have made to be painted blacke all these wreaths or rounds of the girdle, because these are the imbibitions, and by consequent, blacknesses: for the fire with the moisture (as it hath been often said) causeth blacknesse. And as these five whole wreathes or rounds shew that you must doe this five times wholly, so likewise they let you know, that you must doe this in five whole moneths, a moneth to every imbibition: See here the reason why Haly Abenragel said, The Coction or boiling of the things is done in three times fifty dayes: It is true, that if thou count these little imbibitions at the beginning and at the end, there are seven."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "102"
    "pdf_page": 122
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "102"
    "pdf_page": 122
  "translation_ja": "この帯の巻き、あるいは周回をすべて黒く描かせたのは、それらが吸液を、したがって黒化を表すからである。しばしば述べたように、火は湿気とともに黒さを生む。この完全な五巻き、五周は、この操作を完全に五度行うべきことを示すと同時に、一度の吸液に一か月ずつ、満五か月で行うべきことも教える。ハリ・アベンラゲルが「物の煮熟、あるいは煮沸は、五十日の三倍で行われる」といった理由はここにある。ただし、始めと終わりの少量の吸液を数えれば、七度になることは確かである。"
  "translation_status": "draft"
  "source_kind": "prose"

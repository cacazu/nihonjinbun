  "kind": "paragraph"
  "origin": "source"
  "source_text": "Neither must you interpret in a Theological sence, that writing which followeth, in these termes, NICHOLAS FLAMMEL, ET PERRENELLE SA FEMME, that is, Nicholas Flammel, and Perrenelle his wife, in as much as that signifieth nothing, but that I and my wife haue giuen that Arche."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "42"
    "pdf_page": 62
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "42"
    "pdf_page": 62
  "translation_ja": "次の「NICHOLAS FLAMMEL, ET PERRENELLE SA FEMME」、すなわち「ニコラ・フラメルと、その妻ペルネル」という銘文も、神学的意味で解釈してはならない。それは、私と妻がそのアーチを寄進したということしか意味しないからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-063-01"
  "section_id": "FL-CH01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As to the third, fourth, and fifth Tables following, by the sides whereof is written, COMMENT LES INNOCENTS FVRENT OCCIS PAR LE COMMANDEMENT DV ROY HERODES, that is, How the Innocents were killed by the commandement of King Herod. The theologicall sence is well enough vnderstood by the writing, we must onely speake of the rest, which is aboue."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "43"
    "pdf_page": 63
  "translation_ja": "その後の第三、第四、第五の画面については、傍らに「COMMENT LES INNOCENTS FVRENT OCCIS PAR LE COMMANDEMENT DV ROY HERODES」、すなわち「ヘロデ王の命によって、幼子たちがどのように殺されたか」と記してある。神学的意味はその銘文によって十分に分かるので、われわれは上方にある残りのものについてだけ語ればよい。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-063-02"
  "section_id": "FL-CH01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The two Dragons vnited together the one within the other, of colour blacke and blew, in a field sable, that is to say, blacke, whereof the one hath the wings gilded, and the other hath none at all, are the sinnes which naturally are enterchayned, for the one hath his originall and birth from another: Of them some may be easily chased away, as they come easily, for they flie towards vs euery houre; and those which haue no wings can neuer be chased away, such as is the sinne against the holy Ghost. The gold which is in the wings, signifieth that the greatest part of sinnes commeth from the vnholy hunger after gold, which makes so many people diligently to hearken from whence they may haue it: and the colour blacke and blew, sheweth that these are the desires that come out of the darke pits of hell, which we ought wholly to flye from. These two Dragons may also morally represent vnto vs the Legions of euill spirits which are alwayes about vs, and which will accuse vs before the iust Iudge, at the fearefull day of iudgement, which doe aske, nor seeke nothing else but to sift vs."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "43"
    "pdf_page": 63
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "43"
    "pdf_page": 63
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "43"
    "pdf_page": 63
  "translation_ja": "セーブル、すなわち黒い地に、黒と青で描かれ、互いの中へ絡み合う二匹の竜がある。一匹には金色の翼があり、もう一匹には翼がまったくない。これらは、本性として鎖のようにつながる罪を表す。一つの罪は別の罪から起こり、生まれるからである。そのうちには、やすやすと来るのと同じく、やすやすと追い払えるものもある。それらは毎時われらに向かって飛んでくる。しかし翼を持たない罪は決して追い払えない。聖霊に対する罪がそれに当たる。翼の金色は、罪の大部分が、金への不浄な渇望から来ることを表している。この渇望によって、多くの者がどこから金を得られるかと懸命に聞き耳を立てるのである。また黒と青は、これらが地獄の暗い穴から出てくる欲望であり、われらは徹底してそれを避けなければならないことを示す。この二匹の竜は、道徳的意味では、いつもわれらの周りにいて、恐ろしい審判の日に正しい裁判官の前でわれらを告発する悪霊の軍勢を表すとも考えられる。彼らが願い求めるのは、われらを篩にかけることだけである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-065-01"
  "section_id": "FL-CH01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The man and the woman which are next them, of an orange colour, vpon a field azure and blew, signifie that men and women ought not to haue their hope in this World, for the orange colour intimates despaire, or the letting goe of hope, as here; and the colour azure and blew, vpon the which they are painted, shewes vs that we must thinke of heauenly things to come, and say as the roule of the man doth, HOMO VENIET AD IVDICIVM DEI, that is, Man must come to the iudgement of God, or as that of the woman, VERE ILLA DIES TERRIBILIS ERIT, that is, That day will be terrible indeed, to the end that keeping our selues from the Dragons, which are sinnes, God may shew mercy vnto vs."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "45"
    "pdf_page": 65
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "45"
    "pdf_page": 65
  "translation_ja": "その隣には、紺青と青の地に橙色の男と女が描かれている。これは男女がこの世に希望を置くべきではないことを意味する。橙色は絶望、あるいはこの場合のように希望を手放すことを示すからである。また、二人の背景である紺青と青は、われらが来るべき天上の事柄に思いを向け、男の帯状の銘文にある「HOMO VENIET AD IVDICIVM DEI」、すなわち「人は神の審判に来なければならない」、あるいは女の銘文にある「VERE ILLA DIES TERRIBILIS ERIT」、すなわち「その日はまことに恐ろしい日となるであろう」と言うべきことを示している。こうして、罪である竜たちから身を守ることで、神がわれらを憐れんでくださるようにするのである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-065-01-tn-001-text"
  "section_id": "FL-CH01"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "女性の銘文VERE ILLA DIES TERRIBILIS ERITとその英訳は1624年版にあるが、参照ウェブ転写では脱落している。"
  "translation_status": "draft"
- "id": "FL-066-01"
  "section_id": "FL-CH01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Next after this, in a field of Synople, that is greene, are painted two men and one woman rising againe, of the which one comes out of a Sepulchre, the other two out of the Earth, all three of colour exceeding white and pure, lifting their hands towards their eyes, & their eyes towards Heauen on high: Aboue these three bodies there are two Angels sounding musicall Instruments, as if they had called these dead to the day of iudgement; for ouer these two Angels is the figure of our Lord Iesus Christ, holding the world in his hand, vpon whose head an Angell setteth a Crowne, assisted by two others, which say in their roules, O pater Omnipotens, ô Iesu bone, that is, O Father Almighty, ô good Iesu."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "46"
    "pdf_page": 66
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "46"
    "pdf_page": 66
  "translation_ja": "その次には、シノープル、すなわち緑の地に、甦る二人の男と一人の女が描かれている。一人は墓から、ほかの二人は大地から出てきており、三人ともきわめて白く清らかな色をしている。手を目の方へ上げ、目は高い天へ向けている。この三つの身体の上には、楽器を鳴らす二人の天使がいて、あたかもこれらの死者を審判の日へ呼び出したかのようである。というのも、その二人の天使のさらに上には、手に世界を持つわれらの主イエス・キリストの像があり、一人の天使がその頭上に冠を置いているからである。その天使をほかの二人が助け、それぞれの銘文で「O pater Omnipotens」「ô Iesu bone」、すなわち「おお、全能の父よ」「おお、善きイエスよ」と述べている。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-066-01-tn-001-text"
  "section_id": "FL-CH01"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "Synopleは紋章学の緑色を表す語。rouleは巻物状・帯状の銘文欄。"
  "translation_status": "draft"
- "id": "FL-067-01"
  "section_id": "FL-CH01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On the right side of this Sauiour is painted St. Paul, clothed with white & yellow, with a Sword, at whose feete there is a man clothed in a gowne of orange colour, in which there appeared pleights or folds of blacke and white, (which picture resembleth mee to the life) and demandeth pardon of his sinnes, holding his hands ioined together, from betweene which proceed these words written in a roule, DELE MALA QVÆ FECI, that is to say, Blot out the euils that I haue done:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "47"
    "pdf_page": 67
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "47"
    "pdf_page": 67
  "translation_ja": "この救い主の右側には、白と黄色の衣服をまとい、剣を持つ聖パウロが描かれている。その足もとには、黒と白の襞あるいは折り目の見える橙色の長衣を着た男がいる。この像は私を生き写しにしたものである。男は両手を合わせて罪の赦しを求め、その手の間から伸びる帯には「DELE MALA QVÆ FECI」、すなわち「私が犯した悪を拭い去ってください」と記されている。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-068-01"
  "section_id": "FL-CH01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On the other side on the left hand, is Saint Peter with his Key, clothed in reddish yellow, holding his hand vpon a woman clad in a gowne of orange colour, which is on her knees, representing to the life Perrenelle, which holdeth her hands ioyned together, hauing a roule where is written, CHRISTE PRECOR ESTO PIVS, that is, Christ I beseech thee be pittifull: Behind whom there is an Angell on his knees, with a roule, that saith, SALVE DOMINE ANGELORVM, that is, All haile thou Lord of Angels: There is also another Angell on his knees, behind my Image, on the same side that St. Paul is on, which likewise holdeth a roule, saying, O REX SEMPITERNE, that is, O King euerlasting:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "48"
    "pdf_page": 68
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "48"
    "pdf_page": 68
  "translation_ja": "反対の左側には、赤みがかった黄色を着た聖ペトロが鍵を持って立ち、橙色の長衣をまとって跪く女に手を置いている。その女はペルネルを生き写しにしたもので、両手を合わせ、「CHRISTE PRECOR ESTO PIVS」、すなわち「キリストよ、どうか憐れみ深くあってください」と記した帯を持っている。その後ろには一人の天使が跪き、帯に「SALVE DOMINE ANGELORVM」、すなわち「天使たちの主よ、御身に挨拶を捧げます」と記している。聖パウロのいる側、私の像の後ろにも、もう一人の跪く天使がいて、同じように帯を持ち、「O REX SEMPITERNE」、すなわち「おお、永遠の王よ」と述べている。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-069-01"
  "section_id": "FL-CH01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "All this is so cleere, according to the explication of the Resurrection and future iudgement, that it may easily be fitted thereto. So it seemes this Arch was not painted for any other purpose, but to represent this. And therefore we neede not stay any longer vpon it, considering that the least and most ignorant, may well know how to giue it this interpretation."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "49"
    "pdf_page": 69
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "49"
    "pdf_page": 69
  "translation_ja": "これらすべては、復活と将来の審判という説明に照らしてあまりにも明らかであり、容易にその解釈に当てはめられる。そのため、このアーチはそれを表す以外の目的では描かれていないように見える。したがって、これについてこれ以上長く留まる必要はない。最も未熟で無学な者でも、この解釈を与える方法は十分に分かるからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-070-01"
  "section_id": "FL-CH01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Next after the three that are rising againe, come two Angels more of an Orange colour vpon a blew field, saying in their rowles, SVRGITE MORTVI, VENITE AD IVDICIVM DOMINI MEI, that is, Arise you dead, come to the Iudgement of my Lord. This also serues to the interpretation of the Resurrection:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "50"
    "pdf_page": 70
  "translation_ja": "甦る三人に続いて、青い地に、さらに橙色の二人の天使がいる。その帯には「SVRGITE MORTVI, VENITE AD IVDICIVM DOMINI MEI」、すなわち「死者たちよ、起き上がれ。わが主の審判へ来たれ」とある。これも復活という解釈に役立つ。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-070-02"
  "section_id": "FL-CH01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As also the last Figures following, which are, A man red vermillion, vpon a field of Violet colour, who holdeth the foot of a winged Lyon, painted of red vermilion also, opening his throate, as it were to deuoure the man: For one may say that this is the Figure of an vnhappy sinner, who sleeping in a Lethargy of his corruption and vices, dieth without repentance and confession; who without doubt, in this terrible Day shall bee deliuered to the Deuill, heere painted in forme of a red roaring Lyon, which will swallow and deuoure him."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "50"
    "pdf_page": 70
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "50"
    "pdf_page": 70
  "translation_ja": "その後に続く最後の図像も同様である。それは、紫の地に描かれた朱色の男で、やはり朱色に描かれた、有翼の獅子の足をつかんでいる。獅子は、男を喰らおうとするかのように喉を開いている。これは不幸な罪人の像であると言える。その者は、自らの腐敗と悪徳の昏睡の中に眠り、悔悛も告解もせずに死ぬ。そして疑いなく、この恐ろしい日に悪魔へ引き渡される。悪魔はここでは、咆哮する赤い獅子の姿に描かれ、その者を呑み込み、喰らい尽くすのである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-072-01"
  "section_id": "FL-CH02"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAP. II. The interpretations Philosophicall, according to the Maistery of Hermes."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "52"
    "pdf_page": 72
  "translation_ja": "第二章　ヘルメスの大業に従う哲学的解釈"
  "translation_status": "draft"
- "id": "FL-072-02"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I Desire with all my heart, that he who searcheth the secrets of the Sages, hauing in his Spirit passed ouer these Idæa's of the life and resurrection to come, should first make his profit of them: And in the second place, that hee bee more aduised than before, that hee sound and search the depth of my Figures, colours, and rowles, principally of my rowles, because that in this Art they speake not vulgarly."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "52"
    "pdf_page": 72
  "translation_ja": "私は心から望む。賢者たちの秘密を探し求める者が、来るべき生命と復活についてのこれらの観念を精神の中でたどったなら、まずそこから自分のためになるものを得てほしい。次には、以前よりも慎重になり、私の図像、色、帯状の銘文の深みを測り、探り、とりわけ銘文を探究してほしい。この術において、銘文は日常の意味で語っているのではないからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-072-03"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Afterward let him aske of himselfe, why the Figure of Saint Paul is on the right hand, in the place where the custome is to paint S. Peter? And on the other side that of Saint Peter, in the place of the figure of Saint Paul? Why the Figure of Saint Paul is clothed in colours white and yellow, and that of S. Peter in yellow and red? Why also the man and the woman which are at the feet of these two Saints, praying to God, as if it were at the Day of iudgement, are apparelled in diuers colours, and not naked, or else nothing but bones, like them that are rising againe? Why in this Day of iudgement they haue painted this man and this woman at the feet of the Saints? for they ought to haue beene more low on earth, and not in heauen."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "52"
    "pdf_page": 72
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "52"
    "pdf_page": 72
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "52"
    "pdf_page": 72
  "translation_ja": "その後は、自問してほしい。なぜ聖パウロの像が、普通は聖ペトロを描く右側の場所にあり、反対側では、聖ペトロの像が聖パウロの像の位置にあるのか。なぜ聖パウロの像は白と黄色をまとい、聖ペトロの像は黄色と赤をまとっているのか。また、二人の聖人の足もとで、あたかも審判の日にいるように神へ祈る男と女は、なぜさまざまな色の衣服を着ており、甦る者たちのように裸でも、骨ばかりでもないのか。なぜ、この審判の日の図の中で、この男と女を聖人たちの足もとに描いたのか。本来なら、天にではなく、もっと低い地上にいるべきではないか。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-074-01"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Why also the two Angels in Orange colour, which say in their rowles, SVRGITE MORTVI, VENITE AD IVDICIVM DOMINI MEI, that is, Arise you dead, come vnto the Iudgement of my Lord, are clad in this colour, and out of their place, for they ought to bee on high in heauen, with the two other which play vpon the Instruments? Why they haue a field Violet and blew? but principally why their roule, which speaks to the dead, ends in the open throate of the red and flying Lyon?"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "54"
    "pdf_page": 74
  "translation_ja": "また、帯の銘文で「SVRGITE MORTVI, VENITE AD IVDICIVM DOMINI MEI」、すなわち「死者たちよ、起き上がれ。わが主の審判へ来たれ」と言う橙色の二人の天使は、なぜこの色を着て、しかも本来の場所から外れているのか。楽器を奏でるほかの二人と一緒に、天の高いところにいるべきではないか。なぜその背景は紫と青なのか。そして何より、死者に語りかけるその帯が、なぜ赤い飛翔する獅子の、開いた喉の中で終わっているのか。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-074-02"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I would then, that after these, and many other questions which may iustly bee made, opening wide the eyes of his spirit, he come to conclude, that all this, not hauing beene done without cause, there must bee represented vnder this barke, some great secrets, which hee ought to pray God to discouer vnto him."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "54"
    "pdf_page": 74
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "54"
    "pdf_page": 74
  "translation_ja": "こうした問いや、そのほか当然に問いうる数々の問いを経た後、精神の目を大きく開き、次の結論に至ってほしい。これらすべては理由なく行われたのではなく、この外皮の下には何か大いなる秘密が表されているに違いない。だから、その秘密を自分に明かしてくださるよう、神に祈るべきである、と。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-075-01"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Hauing then brought his beliefe by degrees to this passe, I wish also that he would farther beleeue, that these figures and explications are not made for them that haue neuer seene the Bookes of the Philosophers, and who not knowing the Mettallicke principles, cannot bee named Children of this Science: for if they thinke to vnderstand perfectly these figures, being ignorant of the first Agent, they will vndoubtedly deceiue themselues, and neuer bee able to know any thing at all."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "55"
    "pdf_page": 75
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "55"
    "pdf_page": 75
  "translation_ja": "このように段階を踏んで信念がそこへ至ったなら、さらに次のことも信じてほしい。これらの図像と解説は、哲学者たちの書物を一度も見たことがなく、金属の諸原理を知らないため、この学問の子弟と呼ぶことのできない者たちのために作られたのではない。第一の作用体を知らないまま、これらの図像を完全に理解できると思うなら、疑いなく自らを欺き、何一つ知ることができないだろうからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-076-01"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let no man therefore blame me, if he doe not easily vnderstand mee, for hee will be more blame-worthy than I, inasmuch as not being initiated into these sacred and secret interpretations of the first Agent, (which is the key opening the gates of all Sciences) he would notwithstanding, comprehend the most subtile conceptions of the enuious Philosophers, which are not written but for them who already know these principles, which are neuer found in any booke, because they leaue them vnto God, who reuealeth them to whom he please, or else causeth them to bee taught by the liuing voyce of a Maister, by Cabalisticall tradition, which happeneth very seldome."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "56"
    "pdf_page": 76
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "56"
    "pdf_page": 76
  "translation_ja": "したがって、私の言葉が容易には理解できなくても、誰も私を責めてはならない。責められるべきは私よりもその人である。あらゆる学問の門を開く鍵である第一の作用体について、この神聖で秘められた解釈の手ほどきを受けてもいないのに、なおも秘密を惜しむ哲学者たちの、最も精妙な観念を理解しようとするからである。それらはすでにこれらの原理を知る者のためにしか書かれていない。そして、その原理はどんな本にも決して見つからない。哲学者たちはそれを神に委ねており、神が望む者にそれを啓示されるか、さもなければ師の生きた声を通じ、カバラ的な伝承によって教えさせるからである。そうしたことは、ごくまれにしか起こらない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-076-01-tn-001-text"
  "section_id": "FL-CH02"

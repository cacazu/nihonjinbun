  "section_id": "FL-INTRO"
  "kind": "heading"
  "origin": "source"
  "source_text": "THE BOOKE of the HIEROGLYPHICALL Figures of Nicholas Flammel."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "1"
    "pdf_page": 21
  "translation_ja": "ニコラ・フラメルの象形図像の書"
  "translation_status": "draft"
- "id": "FL-021-02"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Eternally praised be the Lord my God, which lifteth the humble from the base dust, and maketh the hearts of such as hope in him to reioyce: which of his grace openeth to them that beleeue, the Springs of his bountie, and putteth vnder their feet the worldly Sphaeres (or circles) of all earthly happinesse: In him bee alwayes our trust; in his feare, our felicitie; in his mercy, the glory of the reparation of our nature; and in our prayers, our vnshaken assurance. And thou, ô God Almighty, as thy benignity hath vouchsafed to open vpon earth before me (thy vnworthy seruant) all the treasures of the riches of the world; so may it please thy great Clemencie, then when I shall be no more in the number of the liuing, to open vnto me the treasures of heauen, and to let me behold thy Diuine face, the Maiestie whereof, is a delight vnspeakeable, and the rauishing ioy whereof, neuer ascended into the heart of liuing man. I aske it of thee, for our Lord Iesus Christ thy welbeloued Son his sake, who in the vnity of the holy Spirit, liueth with thee world without end. Amen."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "1"
    "pdf_page": 21
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "1"
    "pdf_page": 21
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "1"
    "pdf_page": 21
  "translation_ja": "わが神なる主が永遠に讃えられますように。主はへりくだる者を卑しい塵から引き上げ、ご自身に望みを置く者たちの心を喜ばせ、その恵みによって信じる者たちに慈しみの泉を開き、地上のあらゆる幸福をめぐるこの世の天球、すなわち円環を、その足もとに置かれます。われらの信頼が常に主のうちにあり、われらの幸福が主への畏れのうちにあり、われらの本性を回復する栄光が主の憐れみのうちにあり、われらの揺るぎない確信が祈りのうちにありますように。そして全能の神よ、あなたは慈しみによって、この地上で、あなたの取るに足りない僕である私の前に、この世の富の宝をことごとく開いてくださいました。同じように、その大いなる寛大さによって、私がもはや生きる者の数に入らなくなったときには、天の宝を私に開き、あなたの神聖な御顔を仰がせてくださいますように。その威厳は言葉に尽くせぬ喜びであり、それに心奪われる歓喜は、生きている人間の心にはかつて思い浮かびもしなかったものです。あなたの愛する御子、われらの主イエス・キリストのために、これを願います。主は聖霊との一致のうちに、あなたとともに世々限りなく生きておられます。アーメン。"
  "translation_status": "draft"
  "source_kind": "prose"

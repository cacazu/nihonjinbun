  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "saving for multiplying は、完成後に増殖のため操作を再び行う場合を別にする、という留保として訳した。"
  "translation_status": "draft"
- "id": "FL-147-01"
  "section_id": "FL-CH08"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAP. VIII. The figure of a man, like unto Saint Peter, cloathed in a robe Citrine red, holding a key in his right hand, and laying his left hand upon a woman, in an orange coloured robe, which is on her knees at his feete, holding a Rowle."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "127"
    "pdf_page": 147
  "translation_ja": "第八章　柑橘赤の衣を着て、右手に鍵を持つ、聖ペトロに似た男の像。左手は、足元に跪いて巻紙を持つ、橙色の衣の女の上に置かれている。"
  "translation_status": "draft"
- "id": "FL-148-01"
  "section_id": "FL-CH08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Looke upon this woman clothed in a robe of orange colour, which doth so naturally resemble Perrenelle as she was in her youth; Shee is painted in the fashion of a suppliant upon her knees, her hands joyned together, at the feete of a man which hath a key in his right hand, which heares her graciously, and afterwards stretcheth out his left hand upon her. Wouldest thou know what this meaneth? This is the Stone, which in this operation demandeth two things, of the Mercury of the Sunne, of the Philosophers, (painted under the forme of a man) that is to say Multiplication, and a more rich Accoustrement; which at this time it is needfull for her to obtaine, and therefore the man so laying his hand upon her shoulder accords & grants it unto her."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "128"
    "pdf_page": 148
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "128"
    "pdf_page": 148
  "translation_ja": "橙色の衣を着たこの女を見なさい。若いころのペルネルに、まことに自然によく似ている。女は、右手に鍵を持つ男の足元に、両手を合わせ、跪いて願う姿で描かれる。男は慈悲深く願いを聞き、その後、左手を彼女へ伸ばす。これが何を意味するか知りたいだろうか。女は石であり、この操作で、男の姿に描かれた哲学者たちの太陽のメルクリウスへ、二つのもの、すなわち増殖と、より豪華な装いを求める。いまこそ、それを得る必要があるため、男はその肩へ手を置き、願いを聞き入れて与えるのである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-150-01"
  "section_id": "FL-CH08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But why have I made to bee painted a woman? I could as well have made to bee painted a man, as a woman, or an Angell rather, (for the whole natures are now spirituall and corporall, masculine and feminine): But I have rather chosen to cause paint a woman, to the end that thou mayest judge, that shee demands rather this, than any other thing, because these are the most naturall and proper desires of a woman."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "130"
    "pdf_page": 150
  "translation_ja": "しかし、なぜ女を描かせたのか。女でなく男を描かせても、あるいはむしろ天使を描かせてもよかった。いまや諸自然はすべて、霊的でも物体的でもあり、男性的でも女性的でもあるからである。それでも女を描くことを選んだのは、女がほかの何よりも、これらを望んでいると分かるようにするためである。これらこそ女にとって、最も自然で固有の願いだからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-150-01-tn-001-text"
  "section_id": "FL-CH08"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "女性の欲望を一般化する記述は、原著の時代的な比喩であり、本版がその見方を支持するものではない。"
  "translation_status": "draft"
- "id": "FL-150-02"
  "section_id": "FL-CH08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "To shew further unto thee, that shee demandeth Multiplication, I have made paint the man, unto whom shee addresseth her prayers in the forme of Saint Peter, holding a key, having power to open and to shut, to binde and to loose, because the envious Phylosophers have never spoken of Multiplication, but under these common termes of Art, APERI, CLAVDE, SOLVE, LIGA, that is, Open, shut, binde, loose; opening and loosing, they have called the making of the Body (which is alwayes hard and fixt) soft, fluid, and running like water: To shut and to bind, is with them afterwards by a more strong decoction to coagulate it, and to bring it backe againe into the forme of a body."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "130"
    "pdf_page": 150
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "130"
    "pdf_page": 150
  "translation_ja": "さらに女が増殖を求めていると示すため、祈りを向ける相手の男を、聖ペトロの姿で描かせた。彼は鍵を持ち、開閉し、縛り、解く力をもつ。秘密を惜しむ哲学者たちは、増殖について、「APERI, CLAVDE, SOLVE, LIGA」、すなわち「開け、閉じよ、縛れ、解け」という、ありふれた術語以外では決して語らなかったからである。「開く」「解く」とは、常に硬く固定している体を、柔らかく、流動的で、水のように流れるものにすることである。「閉じる」「縛る」とは、その後、より強い煮熟によって凝固させ、再び体の形へ戻すことである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-150-02-tn-001-text"
  "section_id": "FL-CH08"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "ラテン語の順序では SOLVE＝解け、LIGA＝縛れとなる。英語本文は最後の二語を binde, loose の順で訳しているため、その逆転を本文に保持した。"
  "translation_status": "draft"
- "id": "FL-151-01"
  "section_id": "FL-CH08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It behoved mee then, in this place to represent a man with a key, to teach thee that thou must now open and shut, that is to say, Multiply the budding and encreasing natures: for look how often thou shalt dissolve and fixe, so often will these natures multiply, in quantity, quality, and vertue, according to the multiplication of ten; comming from this number to an hundred, from an hundred to a thousand, from a thousand to ten thousand, from ten thousand to an hundred thousand, from an hundred thousand to a million, and from thence by the same operation to Infinity, as I have done threetimes, praised be God."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "131"
    "pdf_page": 151
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "131"
    "pdf_page": 151
  "translation_ja": "そこでこの場所には、鍵を持つ男を表す必要があった。いまあなたは、開き、閉じ、すなわち芽吹き増大する諸自然を増殖させなければならない、と教えるためである。溶かして固定するたびに、これらの自然は量、質、効力において十倍ずつ増える。この数から百へ、百から千へ、千から万へ、万から十万へ、十万から百万へ、そこから同じ操作によって無限へ至る。私も三度そうした。神に讃美あれ。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-152-01"
  "section_id": "FL-CH08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And when thy Elixir is so brought unto Infinity, one graine thereof falling upon a quantity of molten mettall as deepe and vaste as the Ocean, it will teine it, and convert it into most perfect mettall, that is to say into silver or gold, according as it shall have been imbibed and fermented, expelling & driving out farre from himself all the impure and strange matter, which was joyned with the mettall in the first coagulation;"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "132"
    "pdf_page": 152
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "132"
    "pdf_page": 152
  "translation_ja": "こうしてエリクシルが無限へ至るなら、その一粒が、大洋のように深く広大な量の溶融金属へ落ちただけで、その金属を染め、最も完全な金属へ変える。すなわち、吸液と発酵をどのように受けたかに従って、銀または金へ変えるのである。その際、最初の凝固において金属と結びついた不純なものと異物は、ことごとく排除され、はるか遠くへ追い出される。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-153-01"
  "section_id": "FL-CH08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "for this reason therefore have I made to bee painted a Key in the hand of the man, which is in the forme of Saint Peter, to signifie that the stone desireth to be opened and shut for multiplication; and likewise to shew thee with what Mercury thou oughtest to doe this, & when; I have given the man a garment Citrine red, and the woman one of orange colour. Let this suffice, lest I transgresse the silence of Pythagoras, to teach thee that the woman, that is, our stone, asketh to have the rich Accoustrements and colour of Saint Peter."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "133"
    "pdf_page": 153
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "133"
    "pdf_page": 153
  "translation_ja": "このため、聖ペトロの姿をした男の手に鍵を描かせた。石が増殖のために開かれ閉じられることを望んでいる、と示すためである。また、どのメルクリウスを用い、いつ行うべきかを示すため、男には柑橘赤の衣を、女には橙色の衣を与えた。ピュタゴラスの沈黙を破らぬよう、これで十分としよう。女、すなわち私たちの石が、聖ペトロの豪華な装いと色を求めている、と教えるには、これで足りる。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-154-01"
  "section_id": "FL-CH08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Shee hath written in her Rowle, CHRISTE PRECOR ESTO PIVS, that is, Jesu Christ be pittifull unto mee, as if shee said, Lord be good unto mee, and suffer not that hee that shall be come thus farre, should spoile all with too much fire: It is true, that from henceforward I shall no more feare mine enemies, and that all fire shall be alike unto me, yet the vessell that containes me, is alwaies brittle and easie to be broken: For if they exalt the fire overmuch, it will cracke, and flying a pieces, will carry mee, and sow mee unfortunately amongst the ashes."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "134"
    "pdf_page": 154
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "134"
    "pdf_page": 154
  "translation_ja": "女の巻紙には「CHRISTE PRECOR ESTO PIVS」、すなわち「イエス・キリストよ、私を憐れんでください」とある。これはこういったのと同じである。「主よ、私に恵み深くあってください。ここまで来た人が、強すぎる火ですべてを台無しにしないようにしてください。確かに、いまから私は敵を恐れることがなく、どんな火も私には同じです。それでも、私を入れる器は常にもろく、壊れやすいのです。火を上げすぎれば器は割れ、砕け散って私を運び、不幸にも灰の中へ撒き散らすでしょう。」"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-155-01"
  "section_id": "FL-CH08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Take heed therefore to thy fire in this place, and governe sweetly with patience, this admirable quintessence, for the fire must be augmented unto it, but not too much. And pray the soveraigne Goodnesse, that it will not suffer the evill spirits, which keepe the Mines and Treasures, to destroy thy worke, or to bewitch thy sight, when thou considerest these incomprehensible motions of this Quintessence within thy vessell."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "135"
    "pdf_page": 155
  "translation_ja": "だから、ここでは火に注意し、この驚くべき第五精質を、忍耐をもって穏やかに治めなさい。火は強める必要があるが、強めすぎてはならない。そして至高の善に祈りなさい。鉱山と宝物を守る悪霊が、あなたの仕事を壊したり、器の中にある第五精質の理解しがたい動きを見つめるとき、あなたの眼を惑わせたりすることを、許さないでくださるように。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-156-01"
  "section_id": "FL-CH09"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAP. IX. Upon a darke violet field, a man red purple, holding the foote of a Lyon red as vermillion, which hath wings, & it seemes would ravish and carry away the man."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "136"
    "pdf_page": 156
  "translation_ja": "第九章　暗い紫の地の上にいる赤紫の男。朱のように赤い、翼のある獅子の足をつかんでいる。獅子は男を奪い、運び去ろうとしているように見える。"
  "translation_status": "draft"
- "id": "FL-156-02"
  "section_id": "FL-CH09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This field violet and darke, tels us that the stone hath obtained by her full decoction, the faire Garments that are wholly Citrine and red, which shee demanded of Saint Peter, who was cloathed therewith, and that her compleat and perfect digestion (signified by the entire Citrinity) hath made her leave her old robe of orange colour. The vermillion red colour of this flying Lyon, like the pure & cleere skarlet in graine, which is of the true Granadored, demonstrates that it is now accomplished in all right and equality."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "136"
    "pdf_page": 156
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "136"
    "pdf_page": 156
  "translation_ja": "この紫で暗い地は、石が十分な煮熟によって、すべて柑橘色と赤である美しい衣を得たことを告げる。それは、同じ衣を着た聖ペトロへ、女が願い求めたものである。また、完全な柑橘色で示される十分で完璧な熟成によって、古い橙色の衣を脱ぎ捨てたことを告げる。この飛ぶ獅子の朱赤は、純粋で鮮明な粒染めの緋、真のザクロの赤に似ており、いまやすべてが正しく均整のとれた完成へ達したことを示す。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-156-02-tn-001-text"
  "section_id": "FL-CH09"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "skarlet in graine はケルメス等による堅牢な緋染めをいう歴史的な表現。Granadored はザクロの赤と解した。"
  "translation_status": "draft"
- "id": "FL-157-01"
  "section_id": "FL-CH09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And that hee is now like a Lyon, devouring every pure mettallicke nature, and changing it into her true substance, into true & pure gold, more fine then that of the best mines. Also shee now carrieth this man out of this vale of miseries, that is to say, out of the discommodities of poverty & infirmity, and with her wings gloriously lifts him up, out of the dead and standing waters of Ægypt, (which are the ordinary thoughts of mortall men) making him despise this life and the riches thereof, and causing him night and day to meditate on God, and his Saints, to dwell in the Emperiall Heaven, and to drinke the sweet springs of the Fountaines of everlasting hope."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "137"
    "pdf_page": 157
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "137"
    "pdf_page": 157
  "translation_ja": "そしていまや、それは獅子のようになり、純粋な金属的自然をすべて呑み込み、自らの真の実体、すなわち最良の鉱山のものよりも精良な、真で純粋な金へ変える。また、石はこの男を、惨めさの谷、すなわち貧困と病弱の不便から運び出す。その翼によって、エジプトの死んで淀んだ水、すなわち死すべき人間のありふれた思いから、栄光のうちに引き上げる。この生とその富を軽んじさせ、昼も夜も神と聖人たちを思い、至高天に住み、永遠の希望の泉から甘い湧き水を飲むようにさせるのである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-157-01-tn-001-text"
  "section_id": "FL-CH09"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "英文では獅子・石を受ける he/she が交替する。日本語では指示対象に応じて訳した。Emperiall Heaven は文脈上、最高天・至高天を意味する。"
  "translation_status": "draft"
- "id": "FL-158-01"
  "section_id": "FL-CH09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Praised be God æternally, which hath given us grace to see this most fair & all-perfect purple colour; this pleasant colour of the wilde poppy of the Rocke, this Tyrian, sparkling and flaming colour, which is incapable of Alteration or change, over which the heaven it selfe, nor his Zodiacke can have no more domination nor power, whose bright shining rayes, that dazle the eyes, seeme as though they did communicate unto a man some supercelestiall thing, making him (when he beholds and knowes it) to be astonisht, to tremble, and to be afraid at the same time."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "138"
    "pdf_page": 158
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "138"
    "pdf_page": 158
  "translation_ja": "神に永遠の讃美あれ。神は私たちに、この最も美しく、あらゆる点で完全な紫を見る恵みを与えてくださった。この、岩に生える野のケシの快い色、このティルスの、輝き炎を上げる色は、変質も変化も受けない。天そのものも、その黄道も、もはやこれを支配する力をもたない。その、眼をくらませる明るい光線は、天上を超える何かを人間へ伝えるかのように見える。それを見る者、知る者を、同時に驚嘆させ、震えさせ、畏れさせるのである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-159-01"
  "section_id": "FL-CH09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "O Lord, give us grace to use it well, to the augmentation of the Faith, to the profit of our Soules, and to the encrease of the glory of this noble Realme. Amen. FINIS."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "139"
    "pdf_page": 159
  "translation_ja": "おお主よ、これを正しく用いる恵みをお与えください。信仰を広め、私たちの魂の益となり、この高貴な王国の栄光が増すように。アーメン。終。"
  "translation_status": "draft"
  "source_kind": "prose"

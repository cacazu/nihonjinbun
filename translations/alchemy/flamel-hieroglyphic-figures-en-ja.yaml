- "id": "FL-049-01"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And afterwards, following alwayes my Booke, from word to word, I made projection of the Red stone vpon the like quantity of Mercurie, in the presence likewise of Perrenelle onely, in the same house, the fiue and twentieth day of Aprill following, the same yeere, about fiue a clocke in the Euening; which I transmuted truely into almost as much pure Gold, better assuredly than common Golde, more soft, and more plyable."
  "source_languages":

  "translation_ja": "Athanorは錬金術炉、Balneum Mariæは「マリアの浴」（湯浴）、Pouletは若鶏。Bolts-headは丸い胴と長い頸を持つ錬金術用容器。siueは長いsを正規化した読みで、ウェブ転写のfiueは採らない。"
  "translation_status": "draft"
- "id": "FL-080-01"
  "section_id": "FL-CH02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For it is as it were the belly, or the wombe, containing the true naturall heate to animate our yong King: If this fire be not measured Clibanically, saith Calid the Persian, sonne of Iasichus; If it be kindled with a sword, saith Pithagoras: If thou fire thy Vessell, saith Morien, and makest it feele the heate of the fire, it will giue thee a box on the eare, and burne his flowres before they be risen from the depth of his Marrow, making them come out red, rather than white, and then thy worke is spoiled; as also if thou make too little fire, for then thou shalt neuer see the end, because of the coldnesse of the natures, which shall not haue had motion sufficient to digest them together."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "60"
    "pdf_page": 80
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "60"
    "pdf_page": 80
  "translation_ja": "それは、われらの若い王に生命を与える真の自然的な熱を含む、いわば腹、あるいは子宮だからである。「この火が窯にふさわしく量られていなければ」と、イアシクスの子、ペルシア人カリドは言う。「それが剣で点火されるなら」とピタゴラスは言う。「容器を火にかけ、火の熱を感じさせるなら、それはおまえの耳を平手打ちし、その髄の奥から花が立ち昇る前に焼いてしまい、白ではなく赤い色で出現させるだろう。そうなれば、おまえの作業は台無しになる」とモリエンは言う。火が小さすぎても同様である。その場合、諸本性は冷たいため、互いを一緒に熟成させるだけの運動を得られず、あなたは決して終わりを見ることができない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-080-01-tn-001-text"
  "section_id": "FL-CH02"

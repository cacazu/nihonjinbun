- "id": "FL-024-02"
  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Although that I Nicholas Flammel, Notary, and abiding in Paris, in this yeere one thousand three hundred fourescore and nineteene, and dwelling in my house in the street of Notaries, neere vnto the Chappell of St. Iames of the Bouchery; although, I say, that I learned but a little Latine, because of the small meanes of my Parents, which neuerthelesse were by them that enuie me the most, accounted honest people; yet by the grace of God, and the intercession of the blessed Saints in Paradise of both sexes, and principally of Saint Iames of Gallicia, I haue not wanted the vnderstanding of the Bookes of the Philosophers, and in them learned their so hidden secrets. And for this cause, there shall neuer bee any moment of my life, when I remember this high good, wherein vpon my knees (if the place will giue me leaue) or otherwise, in my heart with all my affection, I shall not render thanks to this most benigne God, which neuer suffereth the child of the Iust to beg from doore to doore, and deceiueth not them which wholly trust in his blessing."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "4"
    "pdf_page": 24

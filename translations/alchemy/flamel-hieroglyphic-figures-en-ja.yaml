  "source_locations": []
  "translation_ja": "tincture は染める性質・変成力を指す歴史用語であり、現代の「チンキ剤」と同一視しない。"
  "translation_status": "draft"
- "id": "FL-133-01"
  "section_id": "FL-CH06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I should be too tedious, if I should shew thee how good reason they had to say alwayes and in all places, our Stone hath semblably to a man, a Body, Soule, and Spirit: I would onely that thou note well, that as a man indewed with Body, Soule, and Spirit, is notwithstanding but one; so likewise thou hast now, but one onely white confection, in the which neverthelesse there are a Body, a Soule, and a Spirit, which are inseparably united. I could easily give very cleare comparisons and expositions of this Body, Soule, and Spirit; but to explicate them, I must of necessitie, speake things, which God reserves to reveale unto them that feare and love him, and consequently ought not to bee written."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "113"
    "pdf_page": 133
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "113"
    "pdf_page": 133
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "113"
    "pdf_page": 133
  "translation_ja": "私たちの石には人間と同じく体、魂、霊がある、と彼らがいつでもどこでも述べる十分な理由を示そうとすれば、あまりに長くなる。ただ、体と魂と霊を備える人間が、それでも一人であるように、いまやあなたがもつのも、ただ一つの白い配合物であることに、よく注意してもらいたい。それにもかかわらず、その中には体と魂と霊があり、切り離せないように結ばれている。この体、魂、霊について、明瞭な比較や説明を与えるのは容易である。しかし解き明かすには、神が、ご自身を畏れ愛する者への啓示として留めている事柄を、どうしても語らねばならない。したがって、それらは書かれるべきではない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-135-01"
  "section_id": "FL-CH06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have then made to bee painted heere, a Body, a Soule, and a Spirit, all white, as if they were rising againe, to shew thee, that the Sun, and Moone, and Mercurie, are raised againe in this operation, that is to say, are made Elements of ayre, and whitened: for wee have heretofore called the Blacknesse, Death; and so continuing the Metaphor, wee may call Whitenesse, Life; which commeth not, but with, and by a Resurrection:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "115"
    "pdf_page": 135
  "translation_ja": "そこでここには、体と魂と霊を、すべて白く、蘇るかのように描かせた。この操作で太陽と月とメルクリウスが蘇ること、つまり空気の元素となり、白くされることを示すためである。これまでは黒さを死と呼んだ。同じ比喩を続ければ、白さを生命と呼ぶことができる。生命は、復活とともに、復活によってしか来ない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-135-02"
  "section_id": "FL-CH06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The Body, to shew this more plainely, I have made to be painted lifting up the stone of his tombe, wherein it was inclosed: The Soule, because it cannot bee put into the earth, it comes not out of a tombe, but onely I have made it bee painted amongst the Tombs, seeking its body, in forme of a woman, having her haire dischevelled; The Spirit which likewise cannot bee put in a grave, I have made to bee painted in fashion of a man comming out of the earth, not from a Tombe. They are all white; so the blacknesse, that is, death is vanquished, and they being whitened, are from henceforward incorruptible."
  "source_languages":
  - "en"
  "source_locations":

  "section_id": "FL-INTRO"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "which is as it were the beginning of King Hercules his Book, which entreateth of the colours of the stone, entituled Iris, or the Rainebow, in these termes, Operis processio multum naturæ placet, that is, The procession of the worke is very pleasant vnto Nature: the which I haue put there expressly for the great Clerkes, who shall vnderstand the Allusion. In this same fashion, I say, I put my selfe vpon my way; and so much I did, that I arriued at Montioy, and afterwards at Saint Iames, where with great deuotion I accomplished my vow."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "22"
    "pdf_page": 42
  "translation_ja": "これは、石の色を論じたヘルクレス王の書、『イリス、すなわち虹』の書き出しに、いわば相当する。その言葉は「Operis processio multum naturæ placet」、すなわち「作業の進行は自然を大いに喜ばせる」である。この暗示を理解するであろう大学者たちのために、私は特にそこへこの言葉を置いた。さて、そのような姿で私は旅に出た。歩み続けてモンジョワに着き、次いで聖ヤコブの聖地に達し、深い信心をもって誓願を果たした。"
  "translation_status": "draft"
  "source_kind": "prose"

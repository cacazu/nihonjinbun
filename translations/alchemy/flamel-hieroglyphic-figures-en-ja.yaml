  "translation_ja": "刊本は Theseus（テセウス）。一般的な神話に合わせてカドモスまたはイアソンへ置き換えない。"
  "translation_status": "draft"
- "id": "FL-110-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have made their field be painted azure and blew, to shew that I doe but now beginne to get out from the most blacke blacknesse, for the azure and blew, is one of the first colours, that the darke woman lets us see, that is to say, moisture giving place a little to heate and drinesse: The man and woman are almost all orange-coloured, to shew that our Bodies, (or our body, which the wise men here call Rebis) hath not as yet digestion enough, and that the moisture from whence comes the blacke blew and azure, is but halfe vanquished by the drinesse. For when drinesse beares rule, all will be white, and when it fighteth with, or is equall to the moisture, all will be in part according to these present colours."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "90"
    "pdf_page": 110
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "90"
    "pdf_page": 110
  "translation_ja": "二人の背景を紺碧と青に描かせたのは、私が、最も黒い黒さからようやく抜け出し始めたことを示すためである。紺碧と青は、暗い女が私たちに初めて見せる色の一つであり、湿気が熱と乾燥に少し場所を譲ることを意味する。男と女がほぼ全身橙色なのは、私たちの諸物体、あるいは賢者たちがここでレビスと呼ぶ私たちの一つの体が、まだ十分に熟成しておらず、黒、青、紺碧の生じるもとである湿気が、乾燥によって半ばしか征服されていないことを示す。乾燥が支配すれば、すべては白くなる。乾燥が湿気と戦い、または釣り合っているときには、すべてが部分的に、いま述べた色になる。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-111-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The envious have also called these confections in this operation, Nummus, Ethelia, Arena, Boritis, Corsufle, Cambar, Albar æris, Duenech, Randeric, Kukul, Thabricis, Ebisemech, Ixir, &c. which they have commanded to make white."
  "source_languages":

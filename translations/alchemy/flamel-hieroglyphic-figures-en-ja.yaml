  "source_languages": []
  "source_locations": []
  "translation_ja": "Leton は錬金術文献の laton／laiton に連なる名称。ここでは合金を現代化学的に確定せず、音写する。"
  "translation_status": "draft"
- "id": "FL-102-01"
  "section_id": "FL-CH04"
  "kind": "heading"
  "origin": "source"
  "source_text": "CHAP. IIII. Of the man and the woman clothed in a gowne of Orange colour upon a field azure and blew, and of their rowles."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "82"
    "pdf_page": 102
  "translation_ja": "第四章　紺碧と青の地の上に橙色の長衣を着た男と女、および二人の巻紙について"
  "translation_status": "draft"
- "id": "FL-102-02"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The man painted here doth expressly resemble my selfe to the naturall, as the woman doth lively figure Perrenelle: The cause why wee are painted to the life, is not particular to this purpose, for it needed but to represent a male and a female, to the which our two particular resemblance was not necessarily required, but it pleased the Painter to put us there, just as hee hath done higher in this Arch, at the feet of the Figure of Saint Paul and Saint Peter, according to that wee were in our youth; as hee hath likewise done in other places, as over the doore of the Chappell of Saint James in the Bouchery neere to my house, (although that for this last there is a particular cause) as also over the doore of Saincte Geneviesve des Ardans, where thou maist see me."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "82"
    "pdf_page": 102
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "82"
    "pdf_page": 102
  "translation_ja": "ここに描かれた男は私自身に生き写しであり、女はペルネルを生き生きと表している。私たちが実物どおり描かれたことに、この目的のための特別な理由があるわけではない。必要なのは雄と雌を表すことだけで、私たち二人に似せる必要はなかった。しかし画家は、ここに私たちを置くことを望んだ。ちょうどこのアーチの上の方、聖パウロと聖ペトロの像の足元に、若いころの私たちを描いたようにである。また別の場所、私の家の近くのサン・ジャック・ド・ラ・ブーシュリー礼拝堂の扉の上にも、同様に描いた。ただし、そこには特別な理由がある。サント・ジュヌヴィエーヴ・デ・ザルダンの扉の上にも私が描かれており、そこで見ることができる。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-103-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I made then to bee painted heere two bodies, one of a Male, and another of a Female, to teach thee, that in this second operation, thou hast truely, but yet not perfectly, two natures conjoyned and married together, the Masculine and the Feminine; or rather the foure Elements; and that the foure naturall enemies, the hote and cold, dry and moist, begin to approach amiably one towards another, and by meanes of the Mediators and Peace-makers, lay downe by little and little, the ancient enmity of the old Chaos."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "83"
    "pdf_page": 103
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "83"
    "pdf_page": 103
  "translation_ja": "そこで私は、一つは雄、もう一つは雌という二つの物体を、ここに描かせた。この第二の操作では、まだ完全ではないものの、男性的なものと女性的なものという二つの自然、あるいはむしろ四元素が、真に結びつき、婚姻していることを教えるためである。また、熱と冷、乾と湿という、生まれつき敵同士である四者が、親しく互いへ近づき始め、仲介者と和解者の働きによって、古い混沌以来の敵意を少しずつ捨て始めることを示すためでもある。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-104-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thou knowest well enough who these Mediators and Peace-makers are, betweene the hote and the cold there is moisture, for he is kinsman and allyed to them both; to hote by his heate, and to cold by his moisture: And this is the reason, why to begin to make this peace, thou hast already in the precedent operation, converted all the confections into water by dissolution. And afterward thou hast made to coagulate the water, which is turned into this Earth, blacke of the blacke most blacke, wholly to accomplish this peace; for the Earth, which is cold and dry, finding himselfe of kindred and allyance with the dry and moist, which are enemies, will wholly appease and accord them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "84"
    "pdf_page": 104
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "84"
    "pdf_page": 104
  "translation_ja": "この仲介者、和解者が何であるか、あなたは十分に知っている。熱いものと冷たいもののあいだには湿気がある。湿気は、その熱によって熱いものに、その湿りによって冷たいものに、双方と血縁・姻戚関係をもつからである。だから、この和解を始めるために、先行する操作では、すでに配合物すべてを溶解によって水へ変えたのである。そしてその後、この和解を完全に成し遂げるため、水を凝固させ、黒のうちでも最も黒い、この土へ変えた。冷たく乾いた土は、敵同士である乾と湿に自分が縁をもつと認め、両者を完全に鎮め、和解させるからである。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-104-01-tn-001-text"
  "section_id": "FL-CH04"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "湿気が「その熱」によって熱に通じるという叙述は刊本のまま訳した。通常の四元素説へ合わせて本文を修正しない。"
  "translation_status": "draft"
- "id": "FL-105-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Doest thou not then consider a most perfect mixture of all the foure Elements, having first turned them into water, and now into Earth? I will also teach thee hereafter the other conversions, into ayer when it shall be all white, and into fire, when it shall bee of a most perfect purple. Then thou hast heere two natures married together, whereof the one hath conceived by the other, and by this conception it is turned into the body of the Male, and the Male into that of the Female; that is to say, they are made one onely body, which is the Androgyne, or Hermaphrodite of the Ancients, which they have also called otherwise, the head of the Crow, or natures converted."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "85"
    "pdf_page": 105
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "85"
    "pdf_page": 105
  "translation_ja": "それならば、初めは水、いまは土へと変えたことによって、四元素すべての最も完全な混合を見ているのではないか。今後、ほかの変換についても教えよう。すべてが白くなれば空気へ、完全きわまる紫になれば火へ変わるのである。したがって、ここでは二つの自然が婚姻し、一方が他方によって孕んでいる。この受胎によって、一方は雄の体へ、雄は雌の体へ変わる。つまり、ただ一つの体となる。これが古人のいうアンドロギュノス、またはヘルマフロディトスであり、彼らはまた「烏の頭」あるいは「変換された自然」とも呼んだ。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-105-01-tn-001-text"
  "section_id": "FL-CH04"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "Androgyne／Hermaphrodite は、ここでは錬金術的な両性の結合体を表す象徴語。"
  "translation_status": "draft"
- "id": "FL-106-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In this fashion I paint them heere, because thou hast two natures reconciled, which (if they be guided and governed wisely) can forme an Embrion in the wombe of the Vessell, and afterwards bring foorth a most puissant King, invincible and incorruptible, because it will bee an admirable quintessence. Thus thou seest the principall and most necessary reason of this representation."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "86"
    "pdf_page": 106
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "86"
    "pdf_page": 106
  "translation_ja": "私がここにこのような姿で描くのは、あなたが和解した二つの自然を得ているからである。賢く導き、治めれば、それらは器の子宮に胎児を形作り、後には無敵で不朽の、きわめて力強い王を生み出せる。それは驚くべき第五精質となるからである。これで、この表現の主たる、最も欠かせない理由が分かるだろう。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-107-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The second cause (which is also well to bee noted) was because I must of necessity paint two bodies, because in this operation it behoveth that thou divide that which hath beene coagulated, to give afterwards nourishment, which is milke of life, to the little Infant when he is borne, which is endued (by the living God) with a vegetable soule. This is a secret most admirable and secret, which for want of understanding, it hath made fooles of all those that have sought it without finding it, and hath made every man wise, that beholds it with the eyes of his body, or of his spirit."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "87"
    "pdf_page": 107
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "87"
    "pdf_page": 107
  "translation_ja": "よく注意すべき第二の理由は、どうしても二つの物体を描かなければならなかったことである。この操作では、凝固したものを分ける必要がある。生ける神によって植物的な魂を授けられた幼子が生まれたとき、後に生命の乳という養いを与えるためである。これは最も驚くべき、秘められた秘密である。理解を欠いたために、これを求めても見いだせなかった者をみな愚者にし、肉体の眼、あるいは精神の眼でこれを見た者をすべて賢者にした。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-108-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thou must then make two parts and portions of this coagulated body; the one of which shall serve for Azoth, to wash and clense the other, which is called Leton, which must be whitened: He which is washed, is the Serpent Python, which (having taken his being from the corruption of the slime of the Earth gathered together by the waters of the deluge, when all the confections were water) must be killed and overcome by the arrowes of the God Apollo, by the yellow Sunne, that is to say, by our fire, equall to that of the Sunne."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "88"
    "pdf_page": 108
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "88"
    "pdf_page": 108
  "translation_ja": "そこで、この凝固した体を二つの部分、二つの分量に分けなければならない。一方はアゾートとして働き、もう一方、白くすべきレトンと呼ばれるものを洗い清める。洗われる方は蛇ピュトンである。すべての配合物が水であったとき、大洪水の水が集めた土の泥が腐ったところから生じたこの蛇は、アポロン神の矢、黄色い太陽、すなわち太陽と同等の私たちの火によって、殺され、征服されなければならない。"
  "translation_status": "draft"
  "source_kind": "prose"
- "id": "FL-109-01"
  "section_id": "FL-CH04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He which washeth, or rather the washings, which must be continued with the other moity; these are the teeth of that Serpent, which the sage workeman, the valiant Theseus, wil sow in the same Earth, from whence there shall spring up armed Souldiers, which shall in the end discomfit themselves, suffering themselves by opposition to resolve into the same nature of the Earth, and the workman to beare away his deserved conquests. It is of this, that the Phylosophers have written so often, and so often repeated it, It dissolves it selfe, it congeales it selfe, it makes it selfe blacke, it makes it selfe white, it kils it selfe, and it quickens it selfe."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "89"
    "pdf_page": 109
  - "source_id": "source-1"
    "precision": "page"
    "printed_page": "89"
    "pdf_page": 109
  "translation_ja": "洗うもの、あるいはむしろ、もう半分によって繰り返すべき洗浄は、かの蛇の歯である。賢い仕事師、勇敢なテセウスは、その歯を同じ土へ播く。そこから武装した兵士たちが生まれるが、彼らは最後には互いを打ち破り、対立によって、自らを同じ土の性質へと解体させ、仕事師には正当に獲得した勝利を持ち帰らせる。哲学者たちが幾度も書き、繰り返したのは、このことである。「それは自らを溶かし、自らを凝らせ、自らを黒くし、自らを白くし、自らを殺し、自らを生かす。」"
  "translation_status": "draft"
  "source_kind": "prose"

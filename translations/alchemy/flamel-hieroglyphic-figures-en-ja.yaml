    "printed_page": "20"
    "pdf_page": 40
  "translation_ja": "とうとう、これらの図像を理解する望みをすべて失った私は、最後の頼みとして、スペインのどこかの会堂でユダヤ人の祭司にその解釈を求めると、神とガリシアの聖ヤコブに誓願を立てた。そこでペルネルの同意を得て、図像の写しを携え、巡礼者の服を着て杖を取った。その姿は、私がこれらの象形図像を置いた墓地の、まさにそのアーチの外側で見ることができる。そこでは、壁に沿って両側に行列も置き、石のあらゆる色が現れては消えていく順序を表し、次のフランス語の言葉を添えた。"
  "translation_status": "draft"
  "source_kind": "prose"

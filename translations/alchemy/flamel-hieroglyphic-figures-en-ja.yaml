  "translation_status": "draft"
- "id": "FL-087-01"
  "section_id": "FL-CH03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These are the two Serpents, given and sent by Juno, (that is, the nature Mettallicke) the which the strong Hercules, that is to say, the sage and wise man must strangle in his cradle, that is, overcome and kill them, to make them putrifie, corrupt, and ingender, at the beginning of his Worke. These are the two Serpents, wrapped and twisted round about the Caduceus or rod of Mercury, with the which hee exerciseth his great power, and transformeth himselfe as he listeth. He, saith Haly, that shall kill the one, shall also kill the other, because the one cannot die, but with his brother."
  "source_languages":
  - "en"
  "source_locations":

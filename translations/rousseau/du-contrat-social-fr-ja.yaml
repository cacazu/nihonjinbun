    translation_ja: 法律の区分
    translation_status: reviewed
  - id: rsc-b2-c12-001
    section_id: rsc-b2-c12
    kind: paragraph
    origin: source
    source_text: Pour ordonner le tout, ou donner la meilleure forme possible à la chose publique, il y a diverses rélations à considérer. Premierement l’action du corps entier agissant sur lui-même, c’est-à-dire le rapport du tout au tout, ou du Souverain à l’État, & ce rapport est composé de celui des termes intermédiaires, comme nous le verrons ci-après.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '117'
        source_sequence: 206
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/129
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c12-001-print
    translation_ja: 全体の秩序を定める、すなわち公共の事柄に最善の形を与えるには、いくつかの関係を考えなければならない。第一は、団体全体が自分自身に対してはたらく関係、つまり、全体と全体、あるいは主権者と国家との関係である。この関係は、後に見るように、両者の間にあるものの関係から成り立つ。
    translation_status: reviewed
  - id: rsc-b2-c12-002
    section_id: rsc-b2-c12
    kind: paragraph
    origin: source
    source_text: 'Les loix qui reglent ce rapport portent le nom de loix politiques, & s’appellent aussi loix fondamentales, non sans quelque raison si ces loix sont sages. Car s’il n’y a dans chaque État qu’une bonne maniere de l’ordonner, le peuple qui l’a trouvée doit s’y tenir : mais si l’ordre établi est mauvais, pourquoi prendroit-on pour fondamentales des loix qui l’empêchent d’être bon ? D’ailleurs, en tout état de cause, un peuple est toujours le maitre de changer ses loix, mêmes les meilleures ; car s’il lui plait de se faire mal à lui-même, qui est-ce qui a droit de l’en empêcher ?'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '117'
        source_sequence: 207
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/129
        printed_page_end: '118'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c12-002-print
    translation_ja: この関係を定める法律は政治法と呼ばれ、また根本法とも呼ばれる。法律が賢明であれば、そう呼ぶのももっともである。どの国家にも秩序を与えるよい方法が一つしかないのなら、それを見つけた人民は守り続けるべきだ。だが、定まった秩序が悪いのなら、その秩序がよくなるのを妨げる法律を、なぜ根本法と考えるのか。それに、どんな事情であれ、人民はつねに自らの法律を、最善のものさえ変えられる。自分自身を傷つけたいと思っているのなら、いったい誰にそれを妨げる権利があろう。
    translation_status: reviewed
  - id: rsc-b2-c12-003
    section_id: rsc-b2-c12
    kind: paragraph
    origin: source
    source_text: 'La seconde rélation est celle des membres entre-eux, ou avec le corps entier, & ce rapport doit être au premier égard aussi petit & au second aussi grand qu’il est possible : en sorte que chaque Citoyen soit dans une parfaite indépendance de tous les autres, & dans une excessive dépendance de la Cité ; ce qui se fait toujours par les mêmes moyens ; car il n’y a que la force de l’Etat qui fasse la liberté de ses membres. C’est de ce deuxieme rapport que naissent les loix civiles.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '118'
        source_sequence: 208
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/130
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c12-003-print
    translation_ja: 第二は、構成員同士の関係、または各構成員と団体全体との関係である。前者はできるかぎり小さく、後者はできるかぎり大きくあるべきだ。そうして、市民一人ひとりがほかの市民すべてから完全に独立し、市民共同体には徹底して依存するようにする。この二つを実現する手段は、つねに同じである。国家の力だけが、その構成員を自由にするからだ。この第二の関係から、民法が生まれる。
    translation_status: reviewed
  - id: rsc-b2-c12-004
    section_id: rsc-b2-c12
    kind: paragraph
    origin: source
    source_text: On peut considérer une troisieme sorte de rélation entre l’homme & la loi, savoir celle de la désobéissance à la peine, & celle-ci donne lieu à l’établissement des loix criminelles, qui dans le fond sont moins une espece particuliere de loix, que la sanction de toutes les autres.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '118'
        source_sequence: 209
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/130
        printed_page_end: '119'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c12-004-print
    translation_ja: 人と法律のあいだには、第三の関係を考えられる。違反と刑罰の関係である。ここから刑法が設けられる。刑法は、つまるところ、独立した一種の法というより、ほかのすべての法に強制力を与えるものだ。
    translation_status: reviewed
  - id: rsc-b2-c12-005
    section_id: rsc-b2-c12
    kind: paragraph
    origin: source
    source_text: 'A ces trois sortes de loix, il s’en joint une quatrieme, la plus importante de toutes ; qui ne se grave ni sur le marbre ni sur l’airain, mais dans les cœurs des citoyens ; qui fait la véritable constitution de l’Etat ; qui prend tous les jours de nouvelles forces ; qui, lorsque les autres loix vieillissent ou s’éteignent, les ranime ou les supplée, conserve un peuple dans l’esprit de son institution, & substitue insensiblement la force de l’habitude à celle de l’autorité. Je parle des mœurs, des coutumes, & sur-tout de l’opinion ; partie inconnue à nos politiques, mais de laquelle dépend le succès de toutes les autres : partie dont le grand Législateur s’occupe en secret, tandis qu’il paroit se borner à des réglemens particuliers qui ne sont que le ceintre de la voûte, dont les mœurs, plus lentes à naitre, forment enfin l’inébranlable Clef.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '119'
        source_sequence: 210
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/131
        printed_page_end: '120'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c12-005-print
    translation_ja: この三種類に、すべてのうちで最も大切な第四の法が加わる。それは大理石にも青銅にも刻まれず、市民の心に刻まれる。これが国家の真の体制をつくる。日に日に力を増し、ほかの法律が古びたり消えたりするときに、よみがえらせたり、代わりを務めたりする。人民に、その制度を立てた精神を保たせ、知らぬうちに、権威の力を習慣の力に替える。私が言うのは、風俗、慣習、そしてとりわけ世論である。われわれの政治論者には知られていないが、ほかのすべての成否がここにかかっている。偉大な立法者は、個々の規定だけを考えているように見えて、ひそかにこの部分に力を注ぐ。規定はアーチを建てるための仮の支えにすぎず、芽生えるのに時間のかかる風俗が、やがて揺るがぬかなめ石となる。
    translation_status: reviewed
  - id: rsc-b2-c12-006
    section_id: rsc-b2-c12
    kind: paragraph
    origin: source
    source_text: Entre ces diverses Classes, les loix politiques, qui constituent la forme du Gouvernement, sont la seule relative à mon sujet.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '120'
        source_sequence: 211
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/132
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c12-006-print
    translation_ja: これらのさまざまな種類のうち、私の主題に関わるのは、政府の形を成り立たせる政治法だけである。
    translation_status: reviewed

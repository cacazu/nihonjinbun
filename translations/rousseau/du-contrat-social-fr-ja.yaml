    translation_ja: 第八章
    translation_status: reviewed
  - id: rsc-b4-c08-title
    section_id: rsc-b4-c08
    kind: heading
    origin: source
    source_text: De la Religion Civile.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '296'
        source_sequence: 557
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/308
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-title-print
    translation_ja: 市民宗教について
    translation_status: reviewed
  - id: rsc-b4-c08-001
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Les hommes n’eurent point d’abord d’autres Rois que les Dieux, ni d’autre Gouvernement que le Théocratique. Ils firent le raisonnement de Caligula, & alors ils raisonnoient juste. Il faut une longue altération de sentimens & d’idées pour qu’on puisse se résoudre à prendre son semblable pour maitre, & se flater qu’on s’en trouvera bien.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '296'
        source_sequence: 558
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/308
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-001-print
    translation_ja: はじめ、人間には神々のほかに王はおらず、神権政治のほかに政府はなかった。人々はカリグラと同じ推論をし、そのときにはその推論は正しかった。自分と同じ人間を主人にし、それでうまくいくと思えるようになるには、感情と考えが長いこと変わり続けなければならない。
    translation_status: reviewed
  - id: rsc-b4-c08-002
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: De cela seul qu’on mettroit Dieu à la tête de chaque société politique, il s’ensuivit qu’il y eut autant de Dieux que de peuples. Deux peuples étrangers l’un à l’autre, & presque toujours ennemis, ne purent longtems reconnoitre un même maitre ; Deux armées se livrant bataille ne sauroient obéir au même chef. Ainsi des divisions nationales resulta le polythéisme, & delà l’intolérance théologique & civile qui naturellement est la même, comme il sera dit ci-après.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '296'
        source_sequence: 559
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/308
        printed_page_end: '297'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-002-print
    translation_ja: それぞれの政治社会の長に神を置けば、それだけで、人民の数と同じ数だけ神々がいることになる。互いに異国の人であり、たいてい敵同士である二つの人民は、長く同じ主人を認めてはいられない。戦い合う二つの軍隊が同じ長に従うことはできない。こうして国々が分かれたことから多神教が生じ、そこから神学上と市民生活上の不寛容が生まれた。この二つは本来同じものである。後で述べるとおりだ。
    translation_status: reviewed
  - id: rsc-b4-c08-003
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: La fantaisie qu’eurent les Grecs de retrouver leurs Dieux chez les peuples barbares, vint de celle qu’ils avoient aussi de se regarder comme les Souverains naturels de ces peuples. Mais c’est de nos jours une érudition bien ridicule que celle qui roule sur l’identité des Dieux de diverses nations ; comme si Moloch, Saturne, & Chronos pouvoient être le même Dieu ; comme si le Baal des Phéniciens, le Zeus des Grecs & le Jupiter des Latins pouvoient être le même ; comme s’il pouvoit rester quelque chose commune à des Etres chimériques portans des noms différens !
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '297'
        source_sequence: 560
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/309
        printed_page_end: '298'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-003-print
    translation_ja: ギリシア人が、未開と見なされた人民のなかに自分たちの神々を見いだそうとした気まぐれは、自分たちをその人民の生まれながらの主権者と見た気まぐれに由来する。だが、異なる国々の神々が同じかどうかを論じるのは、今日では実にばかげた学問である。まるでモロク、サトゥルヌス、クロノスが同じ神でありうるように。フェニキア人のバアル、ギリシア人のゼウス、ラテン人のユピテルが同じ神でありうるように。別の名前を持つ空想上の存在のあいだに、何か共通のものが残りうるかのように。
    translation_status: reviewed
  - id: rsc-b4-c08-004
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'Que si l’on demande comment dans le paganisme où chaque État avoit son culte & ses Dieux il n’y avoit point de guerres de Religion ? Je réponds que c’étoit par cela-même que chaque État ayant son culte propre aussi bien que son Gouvernement, ne distingoit point ses Dieux de ses loix. La guerre politique étoit aussi Théologique : les départemens des Dieux étoient, pour ainsi dire, fixés par les bornes des Nations. Le Dieu d’un peuple n’avoit aucun droit sur les autres peuples. Les Dieux des Payens n’étoient point des Dieux jaloux ; ils partageoient entre eux l’empire du monde : Moyse même & le Peuple Hébreu se prétoient quelquefois à cette idée en parlant du Dieu d’Israël. Ils regardoient, il est vrai, comme nuls les Dieux des Cananéens, peuples proscrits, voués à la destruction, & dont ils devoient occuper la place ; mais voyez comment ils parloient des divinités des peuples voisins qu’il leur étoit défendu d’attaquer ! La possession de ce qui appartient à Chamos votre Dieu, disoit Jephté aux Ammonites, ne vous est-elle pas légitimement due ? Nous possédons au même titre les terres que notre Dieu vainqueur s’est acquises. C’étoit là, ce me semble, une parité bien reconnue entre les droits de Chamos & ceux du Dieu d’Israël.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '298'
        source_sequence: 561
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/310
        printed_page_end: '299'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-004-print
    translation_ja: では、どの国家にも固有の信仰と神々があった異教の世界で、どうして宗教戦争がなかったのか、と問われたら、こう答える。それぞれの国家が、固有の政府と同様、固有の信仰を持っていたので、自分たちの神々を自分たちの法律から区別しなかった。まさにそれゆえである。政治の戦争は神々の戦争でもあり、神々の管轄は、いわば国々の境によって定まっていた。ある人民の神は、ほかの人民に何の権利も持たなかった。異教徒の神々は嫉妬深い神々ではなく、世界の支配を分かち合っていた。モーセとヘブライの人民さえ、イスラエルの神について語るとき、この考えを受け入れることがあった。確かに、追放と滅亡を定められた人民で、彼らが後にその地に住むことになっていたカナン人の神々を、無と見なした。だが、攻めてはならない近隣の人民の神々について、どう語ったかを見よ。エフタはアンモン人にこう言った。「あなたがたの神ケモシュに属するものが、あなたがたに正当に帰するのではないか。われわれも同じ権利で、勝利したわれわれの神が得た土地を持っている。」これは、ケモシュとイスラエルの神の権利が対等だと、はっきり認めたものだと私には思われる。
    translation_status: reviewed
  - id: rsc-note-42-text
    section_id: rsc-b4-c08
    kind: note_body
    origin: source
    source_text: Nonne ea quæ possidet Chamos deus tuus tibi jure debentur ? Tel est le texte de la vulgate. Le P. de Carrieres a traduit. Ne croyez-vous pas avoir droit de posséder ce qui appartient à Chamos votre Dieu ? J’ignore la force du texte hébreu ; mais je vois que dans la vulgate Jephté reconnoit positivement le droit du Dieu Chamos, & que le Traducteur françois affoiblit cette reconnoissance par un selon vous qui n’est pas dans le Latin.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '299'
        source_sequence: 562
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/311
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-42-text-print
    translation_ja: 「あなたの神ケモシュが持つものは、当然あなたに帰するのではないか。」ウルガタ訳聖書にはこうある。カリエール神父は、「あなたの神ケモシュに属するものを所有する権利があると、あなたは思わないのか」と訳した。ヘブライ語の原文がどれだけ強く言っているのかは知らないが、ウルガタ訳でエフタが神ケモシュの権利を明確に認めているのに、フランス語の訳者は、ラテン語にはない「あなたが思うには」によって、その承認を弱めていることがわかる。
    translation_status: reviewed
  - id: rsc-b4-c08-005
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Mais quand les Juifs, soumis aux Rois de Babilone & dans la suite aux Rois de Sirie, voulurent s’obstiner à ne reconnoitre aucun autre Dieu que le leur, ce refus, regardé comme une rebellion contre le vainqueur, leur attira les persécutions qu’on lit dans leur histoire, & dont on ne voit aucun autre exemple avant le Christianisme.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '299'
        source_sequence: 563
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/311
        printed_page_end: '300'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-005-print
    translation_ja: ところが、バビロンの王たちに従い、後にシリアの王たちに従ったユダヤ人が、自分たちの神以外の神を認めないと言い張ったとき、その拒絶は勝者への反抗と考えられ、彼らの歴史に記された迫害を招いた。それと同じものは、キリスト教以前にはほかに一つも見られない。
    translation_status: reviewed
  - id: rsc-note-43-text
    section_id: rsc-b4-c08
    kind: note_body
    origin: source
    source_text: Il est de la derniere évidence que la guerre des Phociens appellée guerre sacrée n’étoit point une guerre de Religion. Elle avoit pour objet de punir des sacrileges & non de soumettre des mécréans
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '300'
        source_sequence: 564
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/312
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-43-text-print
    translation_ja: 神聖戦争と呼ばれたフォキス人の戦争が、宗教戦争でなかったことは、このうえなく明らかである。その目的は、不信心な者を服従させることではなく、神聖なものを汚した者を罰することだった。
    translation_status: reviewed
  - id: rsc-b4-c08-006
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'Chaque Religion étant donc uniquement attachée aux loix de l’Etat qui la prescrivoit, il n’y avoit point d’autre maniere de convertir un peuple que de l’asservir, ni d’autres missionnaires que les conquérans, & l’obligation de changer de culte étant la loi des vaincus, il faloit commencer par vaincre avant d’en parler. Loin que les hommes combattissent pour les Dieux, c’étoient, comme dans Homere, les Dieux qui combattoient pour les hommes ; chacun demandoit au sien la victoire, & la payoit par de nouveaux autels. Les Romains avant de prendre une place, sommoient ses Dieux de l’abandonner, & quand ils laissoient aux Tarentins leurs Dieux irrités, c’est qu’ils regardoient alors ces Dieux comme soumis aux leurs & forcés de leur faire hommage : Ils laissoient aux vaincus leurs Dieux comme ils leur laissoient leurs loix. Une couronne au Jupiter du capitole étoit souvent le seul tribut qu’ils imposoient.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '300'
        source_sequence: 565
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/312
        printed_page_end: '301'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-006-print
    translation_ja: だから、それぞれの宗教は、それを定めた国家の法だけに結びついていたので、人民を改宗させるには、従属させるほかなく、征服者以外に宣教師はいなかった。信仰を変える義務は敗者の法だったから、その話をする前にまず勝たなければならなかった。人間が神々のために戦うどころか、ホメロスにあるように、神々が人間のために戦った。各人は自分の神に勝利を願い、新たな祭壇で見返りを与えた。ローマ人は、ある土地を取る前に、その神々に、その土地から去れと命じた。タレントゥムの人々に、怒ったままの彼らの神々を残したときは、この神々がローマの神々に従い、敬意を表さざるをえないと考えたからだった。敗者に法を残すのと同じように、その神々を残した。カピトリウムのユピテルに捧げる冠一つが、彼らの課すただ一つの貢ぎ物であることもしばしばだった。
    translation_status: reviewed
  - id: rsc-b4-c08-007
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Enfin les Romains ayant étendu avec leur empire leur culte & leurs Dieux, & ayant souvent eux-mêmes adopté ceux des vaincus en accordant aux uns & aux autres le droit de Cité, les peuples de ce vaste empire se trouverent insensiblement avoir des multitudes de Dieux & de cultes, à peu près les mêmes par-tout ; & voilà comment le paganisme ne fut enfin dans le monde connu qu’une seule & même Religion.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '301'
        source_sequence: 566
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/313
        printed_page_end: '302'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-007-print
    translation_ja: ついにはローマ人が帝国とともに宗教と神々を広げ、自らも敗者の神々をしばしば取り入れ、両方に市民権を与えた。すると、この広大な帝国の諸民族は、いつのまにか、どこでもほぼ同じ、多数の神々と信仰を持つことになった。こうして異教はついに、知られている世界で、一つの同じ宗教になった。
    translation_status: reviewed
  - id: rsc-b4-c08-008
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Ce fut dans ces circonstances que Jésus vint établir sur la terre un royaume Spirituel ; ce qui, séparant le sistême théologique du sistême politique, fit que l’Etat cessa d’être un, & causa les divisions intestines qui n’ont jamais cessé d’agiter les peuples chrétiens. Or cette idée nouvelle d’un royaume de l’autre monde n’ayant pu jamais entrer dans la tête des payens, ils regarderent toujours les Chrétiens comme de vrais rebelles qui, sous une hypocrite soumission, ne cherchoient que le moment de se rendre indépendans & maitres, & d’usurper adroitement l’autorité qu’ils feignoient de respecter dans leur foiblesse. Telle fut la cause des persécutions.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '302'
        source_sequence: 567
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/314
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-008-print
    translation_ja: こうした事情のもとで、イエスが地上に来て、霊的な王国を建てたのである。神学の仕組みを政治の仕組みから分けたので、国家は一つでなくなった。そしてキリスト教徒の人民を揺るがし続ける内輪の分裂を招いた。ところで、あの世の王国という新しい考えは、異教徒の頭には決して入らなかった。そこでキリスト教徒を、本当の反逆者といつも見なした。従っているように見せかけながら、独立して主人となる時をうかがい、弱いうちは尊重するふりをしている権威を、抜け目なく奪おうとする者たちだと考えたのである。これが迫害の原因だった。
    translation_status: reviewed
  - id: rsc-b4-c08-009
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Ce que les payens avoient craint est arrivé ; alors tout a changé de face, les humbles Chrétiens ont changé de langage, & bientôt on a vu ce prétendu royaume de l’autre monde devenir sous un chef visible le plus violent despotisme dans celui-ci.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '302'
        source_sequence: 568
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/314
        printed_page_end: '303'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-009-print
    translation_ja: 異教徒が恐れていたことは起こった。そのとき一切は様子を変え、へりくだっていたキリスト教徒はものの言い方を変えた。まもなくこの、あの世の王国と称するものは、目に見える長のもとで、この世の最も激烈な専制となった。
    translation_status: reviewed
  - id: rsc-b4-c08-010
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Cependant comme il y a toujours eu un Prince & des loix civiles, il a résulté de cette double puissance un perpétuel conflict de jurisdiction qui a rendu toute bonne politie impossible dans les États chrétiens, & l’on n’a jamais pu venir à bout de savoir auquel du maitre ou du prêtre on étoit obligé d’obéir.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '303'
        source_sequence: 569
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/315
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-010-print
    translation_ja: だが、つねに統治者と民の法もあったので、この二つの権力から、管轄をめぐる果てしのない争いが生じた。そのためキリスト教国では、どんなよい政治秩序も不可能になった。世俗の主人と聖職者とでは、どちらに従う義務があるのか、ついに決められなかった。
    translation_status: reviewed
  - id: rsc-b4-c08-011
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Plusieurs peuples cependant, même dans l’Europe ou à son voisinage, ont voulu conserver ou rétablir l’ancien sistême, mais sans succès ; l’esprit du christianisme a tout gagné. Le culte sacré est toujours resté ou redevenu indépendant du Souverain, & sans liaison nécessaire avec le corps de l’État. Mahomet eut des vues très saines, il lia bien son sistême politique, & tant que la forme de son Gouvernement subsista sous les Caliphes ses successeurs, ce Gouvernement fut exactement un, & bon en cela. Mais les Arabes devenus florissans, lettrés, polis, mous & lâches, furent subjugués par des barbares ; alors la division entre les deux puissances recommença ; quoiqu’elle soit moins apparente chez les mahométans que chez les Chrétiens, elle y est pourtant, sur-tout dans la secte d’Ali, & il y a des États, tels que la Perse, où elle ne cesse de se faire sentir.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '303'
        source_sequence: 570
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/315
        printed_page_end: '304'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-011-print
    translation_ja: とはいえ、ヨーロッパの内部でも、その近くでも、多くの人民が旧来の仕組みを保つか、立て直そうとした。だが成功せず、キリスト教の精神がすべてを覆った。神聖な礼拝はつねに、主権者から独立したままであるか、再び独立し、国家という団体とは必要なつながりを持たなかった。ムハンマドはたいへん健全な考えを持ち、政治の仕組みをうまく一つに結んだ。後継者のカリフたちのもとでその政府の形が保たれた間は、政府はまったく一つで、この点ではよかった。だがアラブ人は栄え、学識を得、洗練され、安逸に流れ、気弱になって、未開とされた人々に征服された。そのとき二つの権力のあいだの分裂がまた始まった。イスラム教徒のもとでは、キリスト教徒のもとほど明らかではないが、分裂は確かにあり、とりわけアリーの宗派に見られる。ペルシアのように、それを感じないときがない国々もある。
    translation_status: reviewed
  - id: rsc-b4-c08-012
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Parmi nous, les Rois d’Angleterre se sont établis chefs de l’Eglise, autant en ont fait les Czars ; mais par ce titre ils s’en sont moins rendus les maitres que les Ministres ; ils ont moins acquis le droit de la changer que le pouvoir de la maintenir ; Ils n’y sont pas législateurs, ils n’y sont que Princes. Par tout où le Clergé fait un corps il est maitre & législateur dans sa patrie. Il y a donc deux puissances, deux Souverains, en Angleterre & en Russie, tout comme ailleurs.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '304'
        source_sequence: 571
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/316
        printed_page_end: '305'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-012-print
    translation_ja: われわれのところでは、イングランド王たちは自らを教会の長とし、ロシア皇帝も同じことをした。だがこの称号で、教会の主人となったというより、教会に仕える者となった。教会を変える権利を手に入れたというより、教会を維持する力を手に入れた。そこでは、彼らは立法者ではなく、統治者でしかない。聖職者が一つの団体をつくるところではどこでも、聖職者が、自分たちの国で主人であり立法者となる。だから、イングランドでもロシアでも、ほかとまったく同じように、二つの権力と二つの主権者がいる。
    translation_status: reviewed
  - id: rsc-note-44-text
    section_id: rsc-b4-c08
    kind: note_body
    origin: source
    source_text: Il faut bien remarquer que ce ne sont pas tant des assemblées formelles, comme celles de France, qui lient le clergé en un corps, que la communion des Eglises. La communion & l’excommunication sont le pacte social du clergé, pacte avec lequel il sera toujours le maitre des peuples & des Rois. Tous les prêtres qui communiquent ensemble sont concitoyens, fussent-ils des deux bouts du monde. Cette invention est un chef-d’œuvre en politique. Il n’y avoit rien de semblable parmi les Prêtres payens ; aussi n’ont-ils jamais fait un corps de Clergé.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '305'
        source_sequence: 572
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/317
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-44-text-print
    translation_ja: 聖職者を一つの団体に結ぶのは、フランスのもののような正式の集会というより、諸教会の交わりであることに、よく注意しなければならない。交わりと破門が聖職者の社会盟約であり、この盟約によって、聖職者はつねに、人民と王たちの主人でいられる。交わりをともにする聖職者は、世界の両端にいようとも、同じ市民である。この発明は、政治の傑作だ。異教の祭司にはこれに似たものは何もなかった。したがって、彼らは一つの聖職団体をつくったことがなかった。
    translation_status: reviewed
  - id: rsc-b4-c08-013
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: De tous les Auteurs Chrétiens le philosophe Hobbes est le seul qui ait bien vû le mal & le remede, qui ait osé proposer de réunir les deux têtes de l’aigle, & de tout ramener à l’unité politique, sans laquelle jamais État ni Gouvernement ne sera bien constitué. Mais il a dû voir que l’esprit dominateur du Christianisme étoit incompatible avec son sistême, & que l’intérêt du Prêtre seroit toujours plus fort que celui de l’Etat. Ce n’est pas tant ce qu’il y a d’horrible & de faux dans sa politique que ce qu’il y a de juste & de vrai qui l’a rendue odieuse.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '305'
        source_sequence: 573
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/317
        printed_page_end: '306'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-013-print
    translation_ja: キリスト教徒の著述家のなかで、哲学者ホッブズだけが、弊害と対処法をよく見抜いた。鷲の二つの頭を結び、すべてを政治の一体性に戻すことを、あえて提案した。一体性がなければ、国家も政府も決してうまく成り立たない。だが、キリスト教の支配しようとする精神は自分の仕組みと相いれず、聖職者の利益は国家の利益より、つねに強いことを、彼も見抜くべきだった。彼の政治論を忌まわしいものにしたのは、そこにある恐ろしい誤りというより、その正しさと真実であった。
    translation_status: reviewed
  - id: rsc-note-45-text
    section_id: rsc-b4-c08
    kind: note_body
    origin: source
    source_text: Voyez entre autres dans une Lettre de Grotius à son frere du 11 avril 1643, ce que ce savant homme approuve & ce qu’il blâme dans le livre de Cive. Il est vrai que, porté à l’indulgence, il paroit pardonner à l’auteur le bien en faveur du mal ; mais tout le monde n’est pas si clément.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '306'
        source_sequence: 574
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/318
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-45-text-print
    translation_ja: たとえば一六四三年四月十一日付の、グロティウスから弟への手紙で、この博学な人が『市民論』の何を認め、何を非難したかを見てほしい。寛大に流れがちな彼は、悪いところに免じて、よいところを著者に許してやるように見えるが、誰もがこれほど寛容ではない。
    translation_status: reviewed
  - id: rsc-b4-c08-014
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Je crois qu’en développant sous ce point de vue les faits historiques on réfuteroit aisément les sentimens opposés de Baile & de Warburton, dont l’un prétend que nulle Religion n’est utile au corps politique, & dont l’autre soutient au contraire que le Christianisme en est le plus ferme appui. On prouveroit au premier que jamais État ne fut fondé que la Religion ne lui servit de base, & au second que la loi Chrétienne est au fond plus nuisible qu’utile à la forte constitution de l’État. Pour achever de me faire entendre, il ne faut que donner un peu plus de précision aux idées trop vagues de Religion rélatives à mon sujet.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '306'
        source_sequence: 575
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/318
        printed_page_end: '307'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-014-print
    translation_ja: 歴史上の事実をこの観点から詳しく見れば、ベールとウォーバートンの相反する意見を、容易に退けられると思う。一方は、どんな宗教も政治体の役に立たないと言い、もう一方は、反対に、キリスト教が政治体の最も強い支えだと言い張る。前者には、これまでどの国の建国にも、宗教がその土台となったことを証明できるだろう。後者には、キリスト教の法はそもそも、国家の体制を強固にするには益よりも害が多いと証明できるだろう。私の言いたいことを十分にわかってもらうには、主題に関わる宗教の観念があまりに曖昧なので、もう少しはっきりさせるだけでよい。
    translation_status: reviewed
  - id: rsc-b4-c08-015
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'La Religion considérée par rapport à la société, qui est ou générale ou particuliere, peut aussi se diviser en deux especes, savoir, la Religion de l’homme & celle du Citoyen. La premiere, sans Temples, sans autels, sans rites, bornée au culte purement intérieur du Dieu Suprême & aux devoirs éternels de la morale, est la pure & simple Religion de l’Evangile, le vrai Théïsme, & ce qu’on peut appeller le droit divin naturel. L’autre, inscritte dans un seul pays, lui donne ses Dieux, ses Patrons propres & tutelaires : elle a ses dogmes, ses rites, son culte extérieur prescrit par des loix ; hors la seule Nation qui la suit, tout est pour elle infidele, étranger, barbare ; elle n’étend les devoirs & les droits de l’homme qu’aussi loin que ses autels. Telles furent toutes les Religions des premiers peuples, auxquelles on peut donner le nom de droit divin civil ou positif.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '307'
        source_sequence: 576
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/319
        printed_page_end: '308'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-015-print
    translation_ja: 社会に対する関係から見れば、社会が一般的なものか個別のものかによって、宗教もまた二つの種類に分けられる。人間の宗教と市民の宗教である。第一の宗教には神殿も祭壇も儀礼もなく、最高の神をまったく内面的に礼拝することと、永遠の道徳の義務とに限られる。これが純粋で何も加えられていない福音の宗教であり、真の有神論であって、自然の神法とも呼びうる。もう一方は、一つの国に限られ、その国に神々、その国に固有の守り神を与える。教義と儀礼があり、法律に定められた外面的な礼拝がある。自分に従う唯一の国の外では、すべてが不信心で、よそのもので、野蛮である。人の義務と権利を広げるのは、自分の祭壇が及ぶところまでに限られる。初めの人民の宗教はどれもこのようなもので、市民の神法、あるいは実定の神法と名づけられる。
    translation_status: reviewed
  - id: rsc-b4-c08-016
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Il y a une troisieme sorte de Religion plus bizarre, qui donnant aux hommes deux législations, deux chefs, deux patries, les soumet à des devoirs contradictoires & les empêche de pouvoir être à la fois dévots & Citoyens. Telle est la Religion des Lamas, telle est celle des Japonais, tel est le christianisme Romain. On peut appeller celui-ci la religion du Prêtre. Il en résulte une sorte du droit mixte & insociable qui n’a point de nom.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '308'
        source_sequence: 577
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/320
        printed_page_end: '309'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-016-print
    translation_ja: さらに、もっと奇妙な第三の種類の宗教がある。人々に二つの立法、二人の長、二つの祖国を与え、互いに矛盾する義務に服させ、信心深い者でありながら市民でもあることを不可能にする。ラマ僧の宗教や日本人の宗教がそうであり、ローマ・カトリックもそうである。最後のものを聖職者の宗教と呼んでよい。そこから、名のつけようのない、混合した、非社会的な法の一種が生まれる。
    translation_status: reviewed
  - id: rsc-b4-c08-017
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'A considerer politiquement ces trois sortes de religions, elles ont toutes leurs défauts. La troisieme est si évidemment mauvaise que c’est perdre le tems de s’amuser à le démontrer. Tout ce qui rompt l’unité sociale ne vaut rien : Toutes les institutions qui mettent l’homme en contradiction avec lui-même ne valent rien.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '309'
        source_sequence: 578
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/321
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-017-print
    translation_ja: 政治の側から見れば、この三種類の宗教にはどれも欠点がある。第三の宗教が悪いことはあまりに明らかで、その証明にかかりきりになれば時間の無駄である。社会の一体性を壊すものはすべて無価値だ。人間を自分自身と矛盾させる制度は、どれも無価値である。
    translation_status: reviewed
  - id: rsc-b4-c08-018
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: La seconde est bonne en ce qu’elle réunit le culte divin & l’amour des loix, & que faisant de la patrie l’objet de l’adoration des Citoyens, elle leur apprend que servir l’Etat c’est en servir le Dieu tutelaire. C’est une espece de Théocratie, dans laquelle on ne doit point avoir d’autre pontife que le Prince, ni d’autres prêtres que les magistrats. Alors mourir pour son pays c’est aller au martire, violer les loix c’est être impie, & soumettre un coupable à l’exécration publique c’est le dévouer au courroux des Dieux ; sacer estod.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '309'
        source_sequence: 579
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/321
        printed_page_end: '310'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-018-print
    translation_ja: 第二の宗教は、神への礼拝と法への愛とを結ぶ点がよい。祖国を市民の崇拝の対象とすることで、国家に仕えることは、その守り神に仕えることだと教える。これは一種の神権政治であって、統治者のほかに最高の祭司を、行政官のほかに祭司を持ってはならない。このとき祖国のために死ぬのは殉教であり、法律を破るのは不敬であり、罪人を公の呪いに服させるのは、その人を神々の怒りに委ねることになる。「神への供物とせよ。」
    translation_status: reviewed
  - id: rsc-b4-c08-019
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Mais elle est mauvaise en ce qu’étant fondée sur l’erreur & sur le mensonge elle trompe les hommes, les rend crédules superstitieux, & noye le vrai culte de la divinité dans un vain cérémonial. Elle est mauvaise encore quand, devenant exclusive & tirannique, elle rend un peuple sanguinaire & intolérant ; en sorte qu’il ne respire que meurtre & massacre, & croit faire une action sainte en tuant quiconque n’admet pas ses Dieux. Cela met un tel peuple dans un état naturel de guerre avec tous les autres, très nuisible à sa propre sûreté.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '310'
        source_sequence: 580
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/322
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-019-print
    translation_ja: しかし、誤りと偽りを土台とするため、人間をだまし、何でも信じ、迷信にとらわれるようにして、神への真の礼拝をむなしい儀式に沈める点で悪い。また、排他的で圧制的となって、人民を血に飢えた不寛容なものにする点でも悪い。殺し合いと虐殺ばかり求め、自分たちの神々を認めない者なら誰を殺しても、神聖なことをしたと思うようになるからだ。そのような人民は、ほかのすべての人民と自然に戦争状態となり、自らの安全を大きく損なう。
    translation_status: reviewed
  - id: rsc-b4-c08-020
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Reste donc la Religion de l’homme ou le Christianisme, non pas celui d’aujourd’hui, mais celui de l’Evangile, qui en est tout-à-fait différent. Par cette Religion sainte, sublime, véritable, les hommes, enfans du même Dieu, se reconnoissent tous pour freres, & la société qui les unit ne se dissout pas même à la mort.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '310'
        source_sequence: 581
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/322
        printed_page_end: '311'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-020-print
    translation_ja: そこで残るのは人間の宗教、すなわちキリスト教である。ただし今日のキリスト教ではなく、それとはまったく違う、福音のキリスト教である。この神聖で気高い真の宗教によって、同じ神の子である人間は、互いにみな兄弟と認め合う。彼らを結ぶ社会は、死によってさえ解体しない。
    translation_status: reviewed
  - id: rsc-b4-c08-021
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'Mais cette Religion n’ayant nulle rélation particuliere avec le corps politique laisse aux loix la seule force qu’elles tirent d’elles-mêmes sans leur en ajouter aucune autre, & par-là un des grands liens de la société particuliere reste sans effet. Bien plus ; loin d’attacher les cœurs des Citoyens à l’Etat, elle les en détache comme de toutes les choses de la terre : je ne connois rien de plus contraire à l’esprit social.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '311'
        source_sequence: 582
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/323
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-021-print
    translation_ja: しかしこの宗教は、政治体と特別な関わりを持たず、法律には、法律それ自体が持つ力だけを残して、それ以外の力を何も加えない。こうして、個別の社会を結ぶ大きな絆の一つが、何の役にも立たないままになる。それだけでなく、市民の心を国につなぐどころか、地上のすべての物事から引き離すように、国からも引き離す。社会の精神にこれほど反するものを、私は知らない。
    translation_status: reviewed
  - id: rsc-b4-c08-022
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: On nous dit qu’un peuple de vrais Chrétiens formeroit la plus parfaite société que l’on puisse imaginer. Je ne vois à cette supposition qu’une grande difficulté ; c’est qu’une société de vrais chrétiens ne seroit plus une société d’hommes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '311'
        source_sequence: 583
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/323
        printed_page_end: '312'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-022-print
    translation_ja: 真のキリスト教徒の人民がつくる社会こそ、考えられる最も完全な社会になる、と言われる。この仮定には、一つ大きな難点しか見当たらない。真のキリスト教徒の社会は、もはや人間の社会ではないだろうということだ。
    translation_status: reviewed
  - id: rsc-b4-c08-023
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'Je dis même que cette société supposée ne seroit avec toute sa perfection ni la plus forte ni la plus durable : A force d’être parfaite, elle manqueroit de liaison ; son vice destructeur seroit dans sa perfection même.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '312'
        source_sequence: 584
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/324
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-023-print
    translation_ja: それどころか、仮にそういう社会があっても、いかに完全であろうと、最も強い社会にも、最も長く続く社会にもならない、と私は言う。完全でありすぎるあまり、結びつきを欠く。これを滅ぼす欠陥が、その完全さ自体のうちにあるだろう。
    translation_status: reviewed
  - id: rsc-b4-c08-024
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Chacun rempliroit son devoir ; le peuple seroit soumis aux loix, les chefs seroient justes & modérés, les magistrats integres incorruptibles, les soldats mépriseroient la mort, il n’y auroit ni vanité ni luxe ; tout cela est fort bien, mais voyons plus loin.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '312'
        source_sequence: 585
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/324
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-024-print
    translation_ja: 誰もが義務を果たす。人民は法に従い、長は公正で節度を守る。行政官は誠実で買収されず、兵士は死を軽く見る。虚栄も奢侈もない。どれもたいへん立派だが、もう少し先を見よう。
    translation_status: reviewed
  - id: rsc-b4-c08-025
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'Le Christianisme est une religion toute spirituelle, occupée uniquement des choses du Ciel : la patrie du Chrétien n’est pas de ce monde. Il fait son devoir, il est vrai, mais il le fait avec une profonde indifférence sur le bon ou mauvais succès de ses soins. Pourvu qu’il n’ait rien à se reprocher, peu lui importe que tout aille bien ou mal ici bas. Si l’Etat est florissant, à peine ose-t-il jouïr de la félicité publique, il craint de s’enorgueillir de la gloire de son pays ; si l’Etat dépérit, il bénit la main de Dieu qui s’appésantit sur son peuple.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '312'
        source_sequence: 586
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/324
        printed_page_end: '313'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-025-print
    translation_ja: キリスト教は、天上の事柄だけに心を向ける、まったく霊的な宗教である。キリスト教徒の祖国はこの世にはない。たしかに義務は果たすが、自分が努めた結果がよいか悪いかは、いっこうに気にしない。自らを責めることが何もなければ、この世で万事がうまくいこうといくまいと、さほど気にならない。国が栄えていれば、公の幸福を喜ぶことさえほとんどせず、祖国の栄光を誇ることを恐れる。国が衰えれば、自分たちの人民の上に重くのしかかる神の手を祝福する。
    translation_status: reviewed
  - id: rsc-b4-c08-026
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'Pour que la société fut paisible & que l’harmonie se maintint, il faudroit que tous les Citoyens sans exception fussent également bons Chrétiens : Mais si malheureusement il s’y trouve un seul ambitieux, un seul hypocrite, un Catilina, par exemple, un Cromwel, celui-là très certainement aura bon marché de ses pieux compatriotes. La charité chrétienne ne permet pas aisément de penser mal de son prochain. Dès qu’il aura trouvé par quelque ruse l’art de leur en imposer & de s’emparer d’une partie de l’autorité publique, voilà un homme constitué en dignité ; Dieu veut qu’on le respecte ; bientôt voilà une puissance ; Dieu veut qu’on lui obéisse ; le dépositaire de cette puissance en abuse-t-il ? C’est la verge dont Dieu punit ses enfans. On se feroit conscience de chasser l’usurpateur ; il faudroit troubler le repos public, user de violence, verser du sang ; tout cela s’accorde mal avec la douceur du Chrétien ; & après tout, qu’importe qu’on soit libre ou serf dans cette vallée de miseres ? l’essenciel est d’aller en paradis, & la résignation n’est qu’un moyen de plus pour cela.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '313'
        source_sequence: 587
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/325
        printed_page_end: '314'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-026-print
    translation_ja: 社会が平穏で、調和が保たれるには、例外なくすべての市民が、等しく善良なキリスト教徒でなければならない。だが、不幸にも一人だけ野心家、一人だけ偽善者がいて、たとえばカティリナやクロムウェルのような人がいれば、敬虔な同胞を手玉に取るのは間違いないだろう。キリスト教の愛は、隣人をたやすく悪く考えることを許さない。何かの策略でその人たちを欺き、公の権威の一部を奪うすべを見つけたとたん、高い地位にある人の出来上がりである。神はその人を尊重せよと望む。まもなく一つの権力ができ、神はそれに従えと望む。権力を預かった者がそれを濫用するか。それは神がその子らを罰するための鞭なのだ。簒奪者を追い出すには気が引ける。公の平穏を破り、暴力を用い、血を流さねばならない。それはどれも、キリスト教徒の温和さとは折り合わない。それに、この苦しみの谷間で、自由であろうと隷属していようと、何だというのか。大切なのは天国へ行くことであり、忍従はそのための手段が一つ増えただけである。
    translation_status: reviewed
  - id: rsc-b4-c08-027
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'Survient-il quelque guerre étrangère ? Les Citoyens marchent sans peine au combat ; nul d’entre eux ne songe à fuir ; ils font leur devoir, mais sans passion pour la victoire ; ils savent plutôt mourir que vaincre. Qu’ils soient vainqueurs ou vaincus, qu’importe ? La providence ne sait-elle pas mieux qu’eux ce qu’il leur faut ? Qu’on imagine quel parti un ennemi fier impétueux passionné peut tirer de leur stoïcisme ! Mettez vis-à-vis d’eux ces peuples généreux que dévoroit l’ardent amour de la gloire & de la patrie, supposez votre république chrétienne vis-à-vis de Sparte ou de Rome ; les pieux chrétiens seront battus, écrasés, détruits avant d’avoir eu le tems de se reconnoitre, ou ne devront leur salut qu’au mépris que leur ennemi concevra pour eux. C’étoit un beau serment à mon gré que celui des soldats de Fabius ; ils ne jurerent pas de mourir ou de vaincre, ils jurerent de revenir vainqueurs, & tinrent leur serment : Jamais des Chrétiens n’en eussent fait un pareil ; ils auroient cru tenter Dieu.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '314'
        source_sequence: 588
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/326
        printed_page_end: '315'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-027-print
    translation_ja: 外国との戦争が起きたとしよう。市民はためらわず戦いに出かける。逃げようと思う者はいない。義務は果たすが、勝利に熱を上げはしない。勝つよりも、むしろ死ぬことを心得ている。勝とうが負けようが、何だというのか。摂理は、彼らが何を必要とするかを、彼ら自身よりよく知ってはいないか。誇り高く、激しく、情熱に駆られた敵が、彼らの禁欲的な落ち着きから、どれほど利益を引き出せるか、想像してほしい。栄光と祖国への激しい愛に燃えた、気高い人民を相手にし、あなたがたのキリスト教共和国を、スパルタかローマと向かい合わせてみよ。敬虔なキリスト教徒たちは、何が起こったかを知る暇もなく、敗れ、押しつぶされ、滅ぼされよう。助かるとしても、敵が軽蔑して相手にしなくなったおかげにすぎまい。ファビウスの兵士たちの誓いは、私には立派に思える。彼らは死ぬか勝つかを誓わず、勝って帰ることを誓い、その誓いを守った。キリスト教徒なら決してそんな誓いは立てなかっただろう。神を試すことになると思っただろうからだ。
    translation_status: reviewed
  - id: rsc-b4-c08-028
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Mais je me trompe en disant une République Chrétienne ; chacun de ces deux mots exclud l’autre. Le Christianisme ne prêche que servitude & dépendance. Son esprit est trop favorable à la tirannie pour qu’elle n’en profite pas toujours. Les vrais Chrétiens sont faits pour être esclaves ; ils le savent & ne s’en émeuvent gueres ; cette courte vie a trop peu de prix à leurs yeux.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '315'
        source_sequence: 589
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/327
        printed_page_end: '316'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-028-print
    translation_ja: だが、キリスト教共和国と言うのは、私の誤りである。この二つの言葉は互いを排除する。キリスト教は隷属と依存しか説かない。その精神は圧制にあまりにも都合がよいので、圧制がこれを利用しないことはない。真のキリスト教徒たちは、奴隷になるようにできている。彼らはそれを承知していて、あまり動じない。この短い生涯は、彼らの目にはほとんど値打ちがないからだ。
    translation_status: reviewed
  - id: rsc-b4-c08-029
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Les troupes chrétiennes sont excellentes, nous dit-on. Je le nie. Qu’on m’en montre de telles ? Quant-à-moi, je ne connois point de Troupes chrétiennes. On me citera les croisades. Sans disputer sur la valeur des Croisés, je remarquerai que, bien loin d’être des Chrétiens, c’étoient des soldats du prêtre, c’étoient des Citoyens de l’Eglise ; ils se battoient pour son pays Spirituel, qu’elle avoit rendu temporel on ne sait comment. A le bien prendre, ceci rentre sous le paganisme ; comme l’Evangile n’établit point une Religion nationale, toute guerre sacrée est impossible parmi les Chrétiens.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '316'
        source_sequence: 590
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/328
        printed_page_end: '317'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-029-print
    translation_ja: キリスト教徒の軍隊は優秀だ、と言われる。私は否定する。そのような軍隊を見せてくれないか。私はキリスト教徒の軍隊を知らない。十字軍を挙げる人がいるだろう。十字軍の人々の勇気を論じるまでもなく、彼らはキリスト教徒というより、聖職者の兵士、教会の市民だったと言っておきたい。彼らは、教会が何かのやり方でこの世のものにした、教会の霊的な祖国のために戦った。よく考えれば、これは異教に属する。福音は国の宗教を立てないのだから、キリスト教徒のあいだに神聖戦争はありえない。
    translation_status: reviewed
  - id: rsc-b4-c08-030
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'Sous les Empereurs payens les soldats Chrétiens étoient braves ; tous les Auteurs Chrétiens l’assûrent, & je le crois : c’étoit une émulation d’honneur contre les Troupes payennes. Dès que les Empereurs furent chrétiens cette émulation ne subsista plus, & quand la croix eut chassé l’aigle, toute la valeur romaine disparut.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '317'
        source_sequence: 591
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/329
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-030-print
    translation_ja: 異教の皇帝のもとでは、キリスト教徒の兵士は勇敢だった。キリスト教徒の著述家はすべてそう言い、私もそう信じる。それは異教徒の兵士たちと、名誉を競ったからだ。皇帝たちがキリスト教徒になるとすぐに、この競い合いはなくなった。十字架が鷲を追い出すと、ローマの勇気はすべて消えた。
    translation_status: reviewed
  - id: rsc-b4-c08-031
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'Mais laissant à part les considérations politiques, revenons au droit, & fixons les principes sur ce point important. Le droit que le pacte social donne au Souverain sur les sujets ne passe point, comme je l’ai dit, les bornes de l’utilité publique. Les sujets ne doivent donc compte au Souverain de leurs opinions qu’autant que ces opinions importent à la communauté. Or il importe bien à l’Etat que chaque Citoyen ait une Religion qui lui fasse aimer ses devoirs ; mais les dogmes de cette Religion n’intéressent ni l’Etat ni ses membres qu’autant que ces dogmes se rapportent à la morale, & aux devoirs que celui qui la professe est tenu de remplir envers autrui. Chacun peut avoir au surplus telles opinions qu’il lui plait, sans qu’il appartienne au Souverain d’en connoitre : Car comme il n’a point de compétence dans l’autre monde, quel que soit le sort des sujets dans la vie à venir ce n’est pas son affaire, pourvu qu’ils soient bons citoyens dans celle-ci.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '317'
        source_sequence: 592
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/329
        printed_page_end: '319'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-031-print
    translation_ja: だが政治上の考察は脇に置き、権利に戻って、この重要な点の原則を定めよう。すでに述べたように、社会盟約が臣民に対して主権者に与える権利は、公益の範囲を越えない。したがって臣民が自分の意見について主権者に説明する義務を負うのは、その意見が共同体にとって重要であるかぎりにおいてである。もっとも、義務を愛するようにしてくれる宗教を市民が持つことは、国家にとって大いに重要だ。しかしその教義が国家やその構成員に関係するのは、道徳や、信仰する者が他人に対して果たす義務にかかわるかぎりである。それ以外では、誰もが思いのままに意見を持つことができ、それを調べるのは主権者の役目ではない。主権者はあの世について何の権限も持たないのだから、臣民がこの世でよい市民であるかぎり、来世でどうなろうと、主権者の関わることではない。
    translation_status: reviewed
  - id: rsc-note-46-text
    section_id: rsc-b4-c08
    kind: note_body
    origin: source
    source_text: Dans la République, dit le M. d’A., chacun est parfaitement libre en ce qui ne nuit pas aux autres. Voilà la borne invariable ; on ne peut la poser plus exactement. Je n’ai pu me refuser au plaisir de citer quelque fois ce manuscrit quoique non connu du public, pour rendre honneur à la mémoire d’un homme illustre & respectable, qui avoit conservé jusques dans le Ministere le cœur d’un vrai citoyen, & des vues droites & saines sur le gouvernement de son pays.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '317'
        source_sequence: 593
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/329
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-46-text-print
    translation_ja: 「共和国では、ほかの人に害を与えないことについて、誰もが完全に自由である」とダルジャンソン侯爵は言う。これこそ変わることのない限界であり、これ以上正確に引くことはできない。この写本は公には知られていないが、私はこれをときどき引く喜びを抑えられなかった。閣僚でありながら、真の市民の心と、自国の政府についてのまっすぐで健全な考えを保った、名高く尊敬に値するこの人の記憶に、敬意を表したかったからだ。
    translation_status: reviewed
  - id: rsc-b4-c08-032
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Il y a donc une profession de foi purement civile dont il appartient au Souverain de fixer les articles, non pas précisément comme dogmes de Religion, mais comme sentimens de sociabilité, sans lesquels il est impossible d’être bon Citoyen ni sujet fidele. Sans pouvoir obliger personne à les croire, il peut bannir de l’Etat quiconque ne les croit pas ; il peut le bannir, non comme impie, mais comme insociable, comme incapable d’aimer sincerement les loix la justice, & d’immoler au besoin sa vie à son devoir. Que si quelqu’un, après avoir reconnu publiquement ces mêmes dogmes, se conduit comme ne les croyant pas, qu’il soit puni de mort ; il a commis le plus grand des crimes, il a menti devant les loix.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '319'
        source_sequence: 594
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/331
        printed_page_end: '320'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-032-print
    translation_ja: ゆえに、純粋に市民としての信仰告白があって、その条項を定めるのは主権者の務めである。厳密には宗教の教義としてではなく、共に暮らす心構えとして定める。それがなければ、よい市民にも忠実な臣民にもなれないからだ。主権者は、それを信じよと誰かに強いることはできない。だが信じない者は誰であれ国から追放できる。不敬な者としてでなく、共に暮らすことのできない者、すなわち、法と正義を心から愛し、必要とあれば義務に命を捧げることのできない者として追放するのである。しかし、その同じ教義を公然と認めたあと、信じていないかのようにふるまう者があれば、死刑に処せよ。その人は最も大きな罪を犯し、法の前でうそをついたのである。
    translation_status: reviewed
  - id: rsc-note-47-text
    section_id: rsc-b4-c08
    kind: note_body
    origin: source
    source_text: 'Cesar plaidant pour Catilina tachoit d’établir le dogme de la mortalité de l’ame ; Caton et Ciceron pour le réfuter ne s’amuserent point à philosopher : il se contenterent de montrer que Cesar parloit en mauvais Citoyen & avançoit une doctrine pernicieuse à l’Etat. En effet voilà dequoi devoit juger le Sénat de Rome, & non d’une question de théologie.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '319'
        source_sequence: 595
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/331
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-47-text-print
    translation_ja: カティリナを擁護したカエサルは、魂は死ぬという教義を立てようとした。カトーとキケロは、これに反論するために哲学の議論にふけったのではない。カエサルが悪い市民として語り、国家に害のある説を進めていることを示しただけだ。事実、ローマの元老院が判断すべきことはそれであって、神学の問いではなかった。
    translation_status: reviewed
  - id: rsc-b4-c08-033
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: 'Les dogmes de la Religion civile doivent être simples, en petit nombre, énoncés avec précision sans explications ni commentaires. L’existence de la Divinité puissante, intelligente, bienfaisante, prévoyante & pourvoyante, la vie à venir, le bonheur des justes, le châtiment des méchans, la sainteté du Contract social & des Loix ; voilà les dogmes positifs. Quant aux dogmes négatifs, je les borne à un seul ; c’est l’intolérance : elle rentre dans les cultes que nous avons excluds.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '320'
        source_sequence: 596
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/332
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-033-print
    translation_ja: 市民宗教の教義は、単純で少数であり、説明や注釈なしに正確な言葉で示されなければならない。力があり、知性があり、恵み深く、先を見通し、必要を満たす神の存在、来世、正しい人の幸福、悪い人への罰、社会契約と法律の神聖さ。これが肯定的な教義である。否定の対象とするのはただ一つ、不寛容である。それは、われわれがすでに排除した宗教に見られるものだ。
    translation_status: reviewed
  - id: rsc-b4-c08-034
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Ceux qui distinguent l’intolérance civile & l’intolérance théologique se trompent, à mon avis. Ces deux intolérances sont inséparables. Il est impossible de vivre en paix avec des gens qu’on croit dannés ; les aimer seroit haïr Dieu qui les punit ; il faut absolument qu’on les ramene ou qu’on les tourmente. Par tout où l’intolérance théologique est admise, il est impossible qu’elle n’ait pas quelque effet civil, & sitot qu’elle en a, le Souverain n’est plus Souverain, même au temporel ; dès lors les Prêtres sont les vrais maitres ; les Rois ne sont que leurs officiers.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '320'
        source_sequence: 597
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/332
        printed_page_end: '322'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-034-print
    translation_ja: 市民生活上の不寛容と神学上の不寛容を区別する人は、私の考えでは間違っている。この二つは切り離せない。地獄に落ちると信じている人々と、平和に暮らすことはできない。彼らを愛するのは、彼らを罰する神を憎むことになるからだ。どうしても、彼らを改めさせるか、苦しめるかしなければならない。神学上の不寛容が認められるところでは、市民生活に何の結果も及ぼさないはずがない。その影響が出たとたん、主権者は世俗の事柄においても、もはや主権者ではない。それ以降は聖職者が真の主人であり、王たちはその役人にすぎない。
    translation_status: reviewed
  - id: rsc-note-48-text
    section_id: rsc-b4-c08
    kind: note_body
    origin: source
    source_text: Le mariage, par exemple, étant un contract civil, a des effets civils sans lesquels il est même impossible que la société subsiste. Supposons donc qu’un Clergé vienne à bout de s’attribuer à lui seul le droit de passer cet acte ; droit qu’il doit nécessairement usurper dans toute Religion intolérante. Alors n’est-il pas clair qu’en faisant valoir à propos l’autorité de l’Eglise il rendra vaine celle du Prince, qui n’aura plus de sujets que ceux que le Clergé voudra bien lui donner. Maitre de marier ou de ne pas marier les gens selon qu’ils auront ou n’auront pas telle ou telle doctrine, selon qu’ils admettront ou rejetteront tel ou tel formulaire, selon qu’ils lui seront plus ou moins dévoués, en se conduisant prudemment & tenant ferme, n’est-il pas clair qu’il disposera seul des héritages, des charges, des Citoyens, de l’Etat même, qui ne sauroit subsister n’étant plus composé que des bâtards. Mais, dira-t-on, l’on appellera comme d’abus, on ajournera, décrétera, saisira le temporel. Quelle pitié ! Le Clergé, pour peu qu’il ait, je ne dis pas de courage, mais de bon sens, laissera faire & ira son train ; il laissera tranquillement appeller, ajourner, décréter, saisir, & finira par rester le maitre. Ce n’est pas, ce me semble, un grand sacrifice d’abandoner une partie, quand on est sûr de s’emparer du tout.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '321'
        source_sequence: 598
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/333
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-48-text-print
    translation_ja: たとえば結婚は市民としての契約であり、市民生活にかかわる効果を持つ。その効果なしには、社会の存続さえ不可能である。そこで、ある聖職団体がこの行為を取り結ぶ権利を独占できたとしよう。不寛容な宗教では、必ずこの権利を奪わざるをえない。そのとき、教会の権威を都合よく持ち出して統治者の権威を無にし、聖職者が与えようとする者のほかには、統治者に臣民がいなくなるのは明らかではないか。人々がある教義を信じるか信じないか、ある信条を認めるか退けるか、聖職者にどれほど献身するかに応じて、結婚させたりさせなかったりする権限を握る。慎重に動きながら譲らずにいれば、相続も官職も市民も、国家そのものさえ、聖職者だけが思いのままにするのは明らかではないか。正式な婚姻で生まれたと認められない子ばかりになれば、国家は存続できないのだから。だが、権限の濫用を理由に訴え、召喚し、命令を出し、教会財産を差し押さえればよい、と言う者もいよう。なんと気の毒な考えだろう。聖職者に、勇気とは言わず、わずかばかりの分別でもあれば、好きにさせておいて、自分の道を進むだろう。訴えさせ、召喚させ、命令を出させ、差し押さえさせて平然としており、最後にはやはり主人である。すべてを奪えることが確かなら、一部を手放しても、大きな犠牲ではないと私には思われる。
    translation_status: reviewed
  - id: rsc-b4-c08-035
    section_id: rsc-b4-c08
    kind: paragraph
    origin: source
    source_text: Maintenant qu’il n’y a plus & qu’il ne peut plus y avoir de Religion nationale exclusive, on doit tolérer toutes celles qui tolerent les autres, autant que leurs dogmes n’ont rien de contraire aux devoirs du Citoyen. Mais quiconque ose dire, hors de l’Eglise point de Salut, doit être chassé de l’Etat ; à moins que l’Etat ne soit l’Eglise, & que le Prince ne soit le Pontife. Un tel dogme n’est bon que dans un Gouvernement Théocratique, dans tout autre il est pernicieux. La raison sur laquelle on dit qu’Henri IV. embrassa la Religion romaine la devroit faire quiter à tout honnête homme, & sur-tout à tout Prince qui sauroit raisonner.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: (321)
        source_sequence: 599
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/335
        printed_page_end: (323)
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c08-035-print
    translation_ja: いまはすでに、排他的な国の宗教はなく、もはやありえない。だから、ほかの宗教を寛容に扱う宗教は、その教義が市民の義務に反しないかぎり、すべて容認するべきである。しかし、「教会の外に救いはない」と平気で言う者は誰であれ、国家から追い出されなければならない。ただし、国家が教会そのもので、統治者が最高の祭司である場合を除く。このような教義は神権政治でしか役に立たず、ほかのあらゆる政府では有害である。アンリ四世がローマ・カトリックを受け入れたとされる理由こそ、良識ある人なら誰でも、とりわけ理屈のわかる君主なら誰でも、その宗教を離れる理由とするべきだ。
    translation_status: reviewed
  - id: rsc-b4-c09-heading
    section_id: rsc-b4-c09
    kind: heading
    origin: source
    source_text: CHAPITRE IX.

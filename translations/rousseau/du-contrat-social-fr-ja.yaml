  - id: rsc-b2-c10-001
    section_id: rsc-b2-c10
    kind: paragraph
    origin: source
    source_text: 'On peut mésurer un corps politique de deux manieres ; savoir, par l’étendue du territoire, & par le nombre du peuple, & il y a, entre l’une & l’autre de ces mésures, un rapport convenable pour donner à l’Etat sa véritable grandeur : Ce sont les hommes qui font l’Etat, & c’est le terrain qui nourrit les hommes ; ce rapport est donc que la terre suffise à l’entretien de ses habitans, & qu’il y ait autant d’habitans que la terre en peut nourrir. C’est dans cette proportion que se trouve le maximum de force d’un nombre donné de peuple ; car s’il y a du terrein de trop, la garde en est onéreuse, la culture insuffisante, le produit superflu ; c’est la cause prochaine des guerres deffensives ; s’il n’y en a pas assés, l’Etat se trouve pour le supplément à la discretion de ses voisins ; c’est la cause prochaine des guerres offensives. Tout peuple qui n’a par sa position que l’alternative entre le commerce ou la guerre, est foible en lui-même ; il dépend de ses voisins, il dépend des événemens ; il n’a jamais qu’une existence incertaine & courte. Il subjugue & change de situation, ou il est subjugué & n’est rien. Il ne peut se conserver libre qu’à force de petitesse ou de grandeur.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '103'
        source_sequence: 188
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/115
        printed_page_end: '104'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c10-001-print
    translation_ja: 政治体の規模には、領土の広さと、人民の数という二つの測り方がある。そして国家を真にふさわしい大きさにするには、この二つのあいだに適切な釣り合いがある。人々が国家をつくり、土地が人々を養うのだから、その釣り合いとは、土地が住民を養うのに足り、土地が養えるだけの住民がいることである。一定の数の人民が最大の力を持つのは、この割合においてである。土地が余れば、守る費用が重く、耕作が足りず、産物が余る。これが防衛戦争の直接の原因である。土地が足りなければ、その不足を補うのに国家は隣国の意のままになる。これが攻撃戦争の直接の原因である。置かれた状況から貿易か戦争かしか選べない人民は、それ自体では弱い。隣国に左右され、成り行きに左右され、あやうい短い存続しか望めない。相手を征服して境遇を変えるか、征服されて無に帰するかである。このうえなく小さいか、このうえなく大きいかしなければ、自由を保てない。
    translation_status: reviewed
  - id: rsc-b2-c10-002
    section_id: rsc-b2-c10
    kind: paragraph
    origin: source
    source_text: On ne peut donner en calcul un rapport fixe entre l’étendue de terre & le nombre d’hommes qui se suffisent l’un à l’autre ; tant à cause des différences qui se trouvent dans les qualités du terrein, dans ses dégrés de fertilité, dans la nature de ses productions, dans l’influence des climats, que de celles qu’on remarque dans les tempéramens des hommes qui les habitent, dont les uns consomment peu dans un pays fertile, les autres beaucoup sur un sol ingrat. Il faut encore avoir égard à la plus grande ou moindre fécondité des femmes, à ce que le pays peut avoir de plus ou moins favorable à la population, à la quantité dont le législateur peut espérer d’y concourir par ses établissemens ; de sorte qu’il ne doit pas fonder son jugement sur ce qu’il voit mais sur ce qu’il prévoit, ni s’arrêter autant à l’état actuel de la population qu’à celui où elle doit naturellement parvenir. Enfin il y a mille occasions où les accidens particuliers du lieu exigent ou permettent qu’on embrasse plus de terrein qu’il ne paroit nécessaire. Ainsi l’on s’étendra beaucoup dans un pays de montagnes, où les productions naturelles, savoir les bois, les paturages, demandent moins de travail, où l’expérience apprend que les femmes sont plus fécondes que dans les plaines, & où un grand sol incliné ne donne qu’une petite base horisontale, la seule qu’il faut compter pour la végétation. Au contraire, on peut se resserrer au bord de la mer, même dans des rochers & des sables presque stériles ; parce que la pêche y peut suppléer en grande partie aux productions de la terre, que les hommes doivent être plus rassemblés pour répousser les pyrates, & qu’on a d’ailleurs plus de facilité pour délivrer le pays par les colonies, des habitans dont il est surchargé.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '104'
        source_sequence: 189
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/116
        printed_page_end: '106'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c10-002-print
    translation_ja: 土地の広さと、その土地で互いに不足なく暮らせる人数とのあいだに、一定の比率を数字で示すことはできない。地質、肥沃さの程度、産物の種類、気候の影響に差があるだけでなく、住民の気質にも差があるからだ。肥沃な土地でも消費が少ない人々がいる一方、やせた土地でも消費が多い人々がいる。さらに、女性の子を産む力の強弱、国が人口の増加にどれほど好都合か、立法者が制度によってその増加にどれほど寄与できると期待してよいかを考えなくてはならない。だから立法者は、いま見えるものではなく、これから見込まれるものに基づいて判断し、人口の現在よりも、自然に行き着く先を重く見る必要がある。最後に、土地それぞれの事情によって、必要と思われる以上の広さを取らなければならない、または取ってもよい場合が無数にある。たとえば山国では広い土地を取る。森林や牧草地という自然の産物にはあまり人手がかからず、経験上、平地よりも女性が多く子を産み、広い斜面も水平に測れば小さい面積にしかならず、植物を育てるにはこの面積だけを数えるべきだからである。反対に海辺では、岩と砂ばかりでほとんど作物が育たなくても、狭い土地に収まることができる。漁業で陸の産物の多くを補え、海賊を追い返すには人々が集まって住んだほうがよく、また住民が多すぎれば植民によって送り出しやすいからである。
    translation_status: reviewed
  - id: rsc-b2-c10-003
    section_id: rsc-b2-c10
    kind: paragraph
    origin: source
    source_text: A ces conditions pour instituer un peuple, il en faut ajouter une qui ne peut suppléer à nulle autre, mais sans laquelle elles sont toutes inutiles ; c’est qu’on jouisse de l’abondance & de la paix ; car le tems où s’ordonne un État est, comme celui où se forme un bataillon, l’instant où le corps est le moins capable de résistance & le plus facile à détruire. On résisteroit mieux dans un désordre absolu que dans un moment de fermentation, où chacun s’occupe de son rang & non du péril. Qu’une guerre une famine une sédition survienne en ce tems de crise, l’État est infailliblement renversé.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '106'
        source_sequence: 190
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/118
        printed_page_end: '107'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c10-003-print
    translation_ja: 一つの人民に制度を立てるためのこれらの条件には、ほかの条件のどれにも代われないが、これがなければすべてが無駄になる一つを加えねばならない。豊かさと平和に恵まれていることだ。国家を組織する時期は、大隊を編成する時と同様、団体が最も抵抗できず、最も壊されやすい時だからである。誰もが危険よりも自分の持ち場を気にかける混乱期に抵抗するより、いっそ完全に混乱しているほうが、よく抵抗できるだろう。この危機の時に戦争、飢饉、反乱のいずれかが来れば、国家は必ず覆る。
    translation_status: reviewed
  - id: rsc-b2-c10-004
    section_id: rsc-b2-c10
    kind: paragraph
    origin: source
    source_text: Ce n’est pas qu’il n’y ait beaucoup de gouvernemens établis durant ces orages ; mais alors ce sont ces gouvernemens-mêmes qui détruisent l’État. Les usurpateurs amenent ou choisissent toujours ces tems de trouble pour faire passer, à la faveur de l’effroi public, des loix destructives que le peuple n’adopteroit jamais de sang-froid. Le choix du moment de l’institution est un des caracteres les plus surs par lesquels on peut distinguer l’œuvre du Législateur d’avec celle du Tiran.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '107'
        source_sequence: 191
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/119
        printed_page_end: '108'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c10-004-print
    translation_ja: このような嵐のさなかに成立した政府が、多数ないわけではない。ただし、そういう場合には、その政府そのものが国家を破壊する。権力を横取りする者は決まって、こうした混乱の時をつくるか選ぶかして、人民の恐怖に乗じ、冷静であれば決して受け入れない破壊的な法を通す。制度を立てる時をどう選ぶかは、立法者の仕事と暴君の仕事を区別できる、最も確かな目印の一つである。
    translation_status: reviewed
  - id: rsc-b2-c10-005
    section_id: rsc-b2-c10
    kind: paragraph
    origin: source
    source_text: Quel peuple est donc propre à la législation ? Celui qui, se trouvant déjà lié par quelque union d’origine d’intérêt ou de convention, n’a point encore porté le vrai joug des loix ; celui qui n’a ni coutumes ni superstitions bien enracinées ; celui qui ne craint pas d’être accablé par une invasion subite, qui, sans entrer dans les querelles de ses voisins, peut résister seul à chacun d’eux, ou s’aider de l’un pour repousser l’autre ; celui dont chaque membre peut être connu de tous, & où l’on n’est point forcé de charger un homme d’un plus grand fardeau qu’un homme ne peut porter ; celui qui peut se passer des autres peuples & dont tout autre peuple peut se passer ; Celui qui n’est ni riche ni pauvre & peut se suffire à lui-même ; enfin celui qui réunit la consistance d’un ancien peuple avec la docilité d’un peuple nouveau. Ce qui rend pénible l’ouvrage de la législation, est moins ce qu’il faut établir que ce qu’il faut détruire ; & ce qui rend le succès si rare, c’est l’impossibilité de trouver la simplicité de la nature jointe aux besoins de la société. Toutes ces conditions, il est vrai, se trouvent difficilement rassemblées. Aussi voit-on peu d’États bien constitués.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '108'
        source_sequence: 192
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/120
        printed_page_end: '109'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c10-005-print
    translation_ja: では、どのような人民が立法にふさわしいのか。出自、利益、または合意から何らかの絆ですでに結ばれながら、まだ本当には法律のくびきに服したことのない人民。深く根を張った慣習も迷信も持たない人民。不意の侵攻で押しつぶされる心配がなく、隣国の争いに巻き込まれず、どの隣国にも単独で持ちこたえるか、一方の力を借りて他方を退けられる人民。誰もが一人ひとりの成員を知りうるほどで、一人で背負える以上の負担を誰かに負わせずにすむ人民。他の人民を頼らずにすみ、他のどの人民も、その人民を頼りにせずにすむような人民。富みも貧しくもなく、自分で自分を養える人民。最後に、古い人民のしっかりしたまとまりと、新しい人民の素直さとを兼ね備える人民である。立法の仕事がむずかしいのは、何を築くかというより何を壊すかにあり、成功がこれほどまれなのは、自然のままの素朴さと、社会の必要とが一緒には見いだせないからだ。確かにこれらの条件がそろうことはめったにない。よい体制の国家が少ないのは、したがって当然である。
    translation_status: reviewed
  - id: rsc-note-13-text
    section_id: rsc-b2-c10
    kind: note_body
    origin: source
    source_text: Si de deux peuples voisins l’un ne pouvoit se passer de l’autre, ce seroit une situation très dure pour le premier & très dangereuse pour le second. Toute nation sage, en pareil cas, s’efforcera bien vîte de délivrer l’autre de cette dépendance. La République de Thlascala enclavée dans l’Empire du Méxique aima mieux se passer de sel, que d’en acheter des Méxicains, & même que d’en accepter gratuitement. Les sages Thlascalans virent le piege caché sous cette libéralité. Ils se conserverent libres, & ce petit État, enfermé dans ce grand Empire, fut enfin l’instrument de sa ruine.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '108'
        source_sequence: 193
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/120
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-13-text-print
    translation_ja: 隣り合う二つの人民のうち、一方が他方を頼らずにいられないとすれば、頼る側にはとても苦しく、頼られる側にはとても危険な状況であろう。そのようなとき、賢明な国なら、相手をこの従属からできるかぎり早く解き放とうとするだろう。メキシコ帝国のなかに囲い込まれたトラスカラ共和国は、メキシコ人から塩を買うことも、ただでもらうことさえもせず、むしろ塩なしで暮らすほうを選んだ。賢明なトラスカラ人には、この気前よさにひそむ罠が見えたのだ。彼らは自由を保ち、この大帝国のなかに囲まれた小国は、最後には帝国を滅ぼす手段となった。
    translation_status: reviewed
  - id: rsc-b2-c10-006
    section_id: rsc-b2-c10
    kind: paragraph
    origin: source
    source_text: Il est encore en Europe un pays capable de législation ; c’est l’Isle de Corse. La valeur & la constance avec laquelle ce brave peuple a su recouvrer & défendre sa liberté, mériteroit bien que quelque homme sage lui apprit à la conserver. J’ai quelque pressentiment qu’un jour cette petite Isle étonnera l’Europe.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '109'
        source_sequence: 194
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/121
        printed_page_end: '111'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c10-006-print
    translation_ja: ヨーロッパにはまだ、立法にふさわしい国が一つある。コルシカ島だ。この勇敢な人民が、勇気と粘り強さによって自由を取り戻し、守ってきたのだから、どこかの賢人が、これを保つすべを教えてやってよいはずだ。いつの日かこの小さな島がヨーロッパを驚かせるような気がしている。
    translation_status: reviewed
  - id: rsc-b2-c11-heading
    section_id: rsc-b2-c11
    kind: heading
    origin: source
    source_text: CHAPITRE XI.
    source_languages:

    translation_status: reviewed
  - id: rsc-b3-c14-title
    section_id: rsc-b3-c14
    kind: heading
    origin: source
    source_text: Suite.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '209'
        source_sequence: 383
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/221
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c14-title-print
    translation_ja: 続き
    translation_status: reviewed
  - id: rsc-b3-c14-001
    section_id: rsc-b3-c14
    kind: paragraph
    origin: source
    source_text: A l’instant que le Peuple est légitimement assemblé en corps Souverain, toute jurisdiction du Gouvernement cesse, la puissance exécutive est suspendue, & la personne du dernier Citoyen est aussi sacrée & inviolable que celle du premier Magistrat, parce qu’où se trouve le Représenté, il n’y a plus de Représentant. La plupart des tumultes qui s’éleverent à Rome dans les comices vinrent d’avoir ignoré ou négligé cette regle. Les Consuls alors n’étoient que les Présidens du Peuple, les Tribuns de simples Orateurs, le Sénat n’étoit rien du tout.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '209'
        source_sequence: 384
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/221
        printed_page_end: '210'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c14-001-print
    translation_ja: 人民が正当に集まり、一つの主権者を成した瞬間、政府の管轄はすべて終わり、行政権は停止する。どれほど地位の低い市民の身も、最高の行政官の身と同じように神聖で不可侵である。代表される本人がそこにいれば、代表者はもはやいないからだ。ローマの民会で起きた騒ぎの大半は、この規則を知らないか、軽んじたためだった。そのとき、執政官は人民の議長でしかなく、護民官は単なる発言者、元老院はまったく何の役割も持たなかった。
    translation_status: reviewed
  - id: rsc-note-26-text
    section_id: rsc-b3-c14
    kind: note_body
    origin: source
    source_text: A peu près selon le sens qu’on donne à ce nom dans le Parlement d’Angleterre. La ressemblance de ces emplois eut mis en conflit les Consuls & les Tribuns, quand même toute juridiction eut été suspendue.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '209'
        source_sequence: 385
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/221
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-26-text-print
    translation_ja: イングランド議会でこの名称に与える意味と、ほぼ同じである。管轄がすべて停止していたとしても、これらの役目が似ているために、執政官と護民官は衝突しただろう。
    translation_status: reviewed
  - id: rsc-b3-c14-002
    section_id: rsc-b3-c14
    kind: paragraph
    origin: source
    source_text: 'Ces intervalles de suspension où le Prince reconnoit ou doit reconnoitre un supérieur actuel, lui ont toujours été redoutables, & ces assemblées du peuple, qui sont l’égide du corps politique & le frein du Gouvernement, ont été de tout tems l’horreur des chefs : aussi n’épargnent-ils jamais ni soins, ni objections, ni difficultés, ni promesses, pour en rebuter les Citoyens. Quand ceux-ci sont avares, lâches, pussillanimes, plus amoureux du repos que de la liberté, ils ne tiennent pas longtems contre les efforts redoublés du Gouvernement ; c’est ainsi que la force résistante augmentant sans cesse, l’autorité Souveraine s’évanouit à la fin, & que la plupart des cités tombent & périssent avant le tems.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '210'
        source_sequence: 386
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/222
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c14-002-print
    translation_ja: 統治者が現に自分より上に立つ者を認め、あるいは認めねばならない権限停止の時期は、いつも統治者にとって恐ろしいものだった。政治体の盾であり、政府の手綱でもある人民集会は、どんな時代でも、長たちにとって恐怖の種だった。だから長たちは、市民にいや気を起こさせるため、手回し、反論、妨害、約束のどれをも惜しまない。市民が欲深く、臆病で、気弱で、自由より安らぎを愛するなら、政府が力を振り絞ってかかってくるのに、長くは耐えられない。こうして抵抗する力が絶えず強まり、ついには主権者の権威が消え、市民共同体の大半は、時ならぬうちに倒れて滅びる。
    translation_status: reviewed
  - id: rsc-b3-c14-003
    section_id: rsc-b3-c14
    kind: paragraph
    origin: source
    source_text: Mais entre l’autorité Souveraine & le Gouvernement arbitraire, il s’introduit quelquefois un pouvoir moyen dont il faut parler.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '210'
        source_sequence: 387
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/222
        printed_page_end: '211'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c14-003-print
    translation_ja: しかし、主権者の権威と恣意的な政府とのあいだに、ときに中間の権力が入り込む。これについて論じなければならない。
    translation_status: reviewed
  - id: rsc-b3-c15-heading
    section_id: rsc-b3-c15
    kind: heading
    origin: source
    source_text: CHAPITRE XV.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '211'
        source_sequence: 388
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/223
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-heading-print
    translation_ja: 第十五章
    translation_status: reviewed
  - id: rsc-b3-c15-title
    section_id: rsc-b3-c15
    kind: heading
    origin: source
    source_text: Des Députés ou Réprésentans.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '211'
        source_sequence: 389
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/223
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-title-print
    translation_ja: 代議員、あるいは代表者について
    translation_status: reviewed
  - id: rsc-b3-c15-001
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: Sitôt que le service public cesse d’être la principale affaire des Citoyens, & qu’ils aiment mieux servir de leur bourse que de leur personne, l’Etat est déjà près de sa ruine. Faut-il marcher au combat ? ils payent des troupes & restent chez eux ; faut-il aller au Conseil ? ils nomment des Députés & restent chez eux. A force de paresse & d’argent ils ont enfin des soldats pour asservir la patrie & des réprésentans pour la vendre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '211'
        source_sequence: 390
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/223
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-001-print
    translation_ja: 公の務めが市民にとって第一の仕事でなくなり、自分の体を使うよりも財布で務めを果たしたいと願うとたん、国家はすでに滅亡に近い。戦いに行かねばならないか。ならば彼らは兵隊を雇い、家に残る。評議会に行かねばならないか。ならば代議員を選び、家に残る。怠けて金を払いつづけたあげく、彼らには、祖国を隷属させる兵隊と、祖国を売り渡す代表者ができる。
    translation_status: reviewed
  - id: rsc-b3-c15-002
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: 'C’est le tracas du commerce & des arts, c’est l’avide intérêt du gain, c’est la mollesse & l’amour des comodités, qui changent les services personnels en argent. On cede une partie de son profit pour l’augmenter à son aise. Donnez de l’argent, & bientôt vous aurez des fers. Ce mot de finance est un mot d’esclave ; il est inconnu dans la Cité. Dans un État vraiment libre les citoyens font tout avec leurs bras & rien avec de l’argent : Loin de payer pour s’exempter de leurs devoirs, ils payeroient pour les remplir eux-mêmes. Je suis bien loin des idées communes ; je crois les corvées moins contraires à la liberté que les taxes.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '211'
        source_sequence: 391
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/223
        printed_page_end: '212'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-002-print
    translation_ja: 貿易や技芸の忙しさ、利益を得たいという貪欲さ、安逸や便利さを好むことが、自分の体で果たす務めを金に替える。安心して利益を増やすために、利益の一部を手放すのである。金を渡してみよ。まもなく鎖を手にするだろう。「財政」という言葉は奴隷の言葉で、市民共同体では知られていない。真に自由な国家では、市民は何でも自分の手で行い、金では何もしない。金を払って義務を免れるどころか、金を払ってでも自分で義務を果たすだろう。私は世間の考え方とはずいぶん離れている。税を課すほうが、労働を課すよりも、自由に反すると思っているのだ。
    translation_status: reviewed
  - id: rsc-b3-c15-003
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: Mieux l’État est constitué, plus les affaires publiques l’emportent sur les privées dans l’esprit des Citoyens. Il y a même beaucoup moins d’affaires privées, parce que la somme du bonheur commun fournissant une portion plus considérable à celui de chaque individu, il lui en reste moins à chercher dans les soins particuliers. Dans une cité bien conduite chacun vole aux assemblées ; sous un mauvais Gouvernement nul n’aime à faire un pas pour s’y rendre ; parce que nul ne prend intérêt à ce qui s’y fait, qu’on prévoit que la volonté générale n’y dominera pas, & qu’enfin les soins domestiques absorbent tout. Les bonnes loix en font faire de meilleures, les mauvaises en amenent de pires. Sitôt que quelqu’un dit des affaires de l’État, que m’importe ? on doit compter que l’État est perdu.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '212'
        source_sequence: 392
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/224
        printed_page_end: '213'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-003-print
    translation_ja: 国家の体制がよければよいほど、市民の心では、公の事柄が私の事柄より大切になる。それどころか、私の事柄そのものがもっと少なくなる。共通の幸福の総量が、各人の幸福に大きく寄与するので、自分の世話で探し求める幸福は少なくてすむからである。よく治められた市民共同体では、誰もが集会に飛んで行く。悪い政府のもとでは、そこへ喜んで一歩を踏み出す人もいない。そこでなされることに誰も関心を持たず、一般意志が優位に立たないことは目に見え、それに家のことで手いっぱいだからだ。よい法は、さらによい法をつくらせ、悪い法は、もっと悪い法をもたらす。国家の事柄を気にして何になる、と誰かが言いだしたら、その国家はもう終わりだと思うべきである。
    translation_status: reviewed
  - id: rsc-b3-c15-004
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: L’attiedissement de l’amour de la patrie, l’activité de l’intérêt privé, l’immensité des États, les conquêtes, l’abus du Gouvernement ont fait imaginer la voye des Députés ou Réprésentans du peuple dans les assemblées de la Nation. C’est ce qu’en certains pays on ose appeller le Tiers-État. Ainsi l’intérêt particulier de deux ordres est mis au premier & second rang, l’intérêt public n’est qu’au troisieme.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '213'
        source_sequence: 393
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/225
        printed_page_end: '214'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-004-print
    translation_ja: 祖国への愛が冷めること、私益のための活動、国家の巨大さ、征服、政府の濫用から、国の会議に人民の代議員または代表者を置く方法が考え出された。ある国々では、これをあえて第三身分と呼ぶ。こうして二つの身分の私益が一番と二番になり、公益は三番目にすぎない。
    translation_status: reviewed
  - id: rsc-b3-c15-005
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: 'La Souveraineté ne peut être réprésentée, par la même raison qu’elle ne peut être aliénée ; elle consiste essentiellement dans la volonté générale, & la volonté ne se réprésente point : elle est la même, ou elle est autre ; il n’y a point de milieu. Les députés du peuple ne sont donc ni ne peuvent être ses réprésentans, ils ne sont que ses commissaires ; ils ne peuvent rien conclure définitivement. Toute loi que le Peuple en personne n’a pas ratifiée est nulle ; ce n’est point une loi. Le peuple Anglois pense être libre ; il se trompe fort, il ne l’est que durant l’élection des membres du Parlement ; sitôt qu’ils sont élus, il est esclave, il n’est rien. Dans les courts momens de sa liberté, l’usage qu’il en fait mérite bien qu’il la perde.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '214'
        source_sequence: 394
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/226
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-005-print
    translation_ja: 主権が譲り渡せないのと同じ理由で、主権は代表させることもできない。その本質は一般意志にあり、意志を代表させることはできない。意志は同一であるか別のものであるかで、どちらでもない場合はない。したがって、人民の代議員は人民の代表者ではなく、そうなることもできない。ただの受託者であって、何事も最終的に決めることはできない。人民が自身で承認していない法はすべて無効であり、法律ではない。イングランドの人民は自分たちが自由だと思っているが、大きな間違いである。自由なのは議会の議員を選ぶあいだだけで、選び終わったとたん、奴隷となり、何者でもなくなる。彼らは短い自由のあいだに、自由を失って当然の使い方をしている。
    translation_status: reviewed
  - id: rsc-b3-c15-006
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: 'L’idée des Réprésentans est moderne : elle nous vient du Gouvernement féodal, de cet inique & absurde Gouvernement dans lequel l’espece humaine est dégradée, & où le nom d’homme est en deshonneur. Dans les anciennes Républiques & même dans les monarchies, jamais le Peuple n’eut des réprésentans ; on ne connoissoit pas ce mot-là. Il est très singulier qu’à Rome où les Tribuns étoient si sacrés on n’ait pas même imaginé qu’ils pussent usurper les fonctions du peuple, & qu’au milieu d’une si grande multitude, ils n’aient jamais tenté de passer de leur chef un seul Plebiscite. Qu’on juge cependant de l’embarras que causoit quelquefois la foule, par ce qui arriva du tems des Gracques, où une partie des Citoyens donnoit son suffrage de dessus les toits.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '214'
        source_sequence: 395
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/226
        printed_page_end: '215'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-006-print
    translation_ja: 代表者という発想は近代のものである。人類をおとしめ、人間という名を恥辱に落とす、あの不正でばかげた政府、つまり封建政府から来た。古代の共和国で、君主国でさえ、人民が代表者を持ったことは一度もない。そんな言葉は知られていなかった。ローマでは、護民官の地位はあれほど神聖だったにもかかわらず、人民の役目を奪うなどとは考えられなかった。また、あれほど大勢の人々がいながら、護民官は独断で民会の決議を一つでも通そうとしたことがない。もっとも、大勢が集まることが、時にどれほど面倒だったかは、グラックス兄弟の時代に、市民の一部が屋根の上から票を投じたことから考えてほしい。
    translation_status: reviewed
  - id: rsc-b3-c15-007
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: 'Où le droit & la liberté sont toutes choses, les inconvéniens ne sont rien. Chez ce sage peuple tout étoit mis à sa juste mésure : il laissoit faire à ses Licteurs ce que ses Tribuns n’eussent osé faire ; il ne craignoit pas que ses Licteurs voulussent le réprésenter.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '215'
        source_sequence: 396
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/227
        printed_page_end: '216'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-007-print
    translation_ja: 権利と自由がすべてであるところでは、不便は何でもない。賢明なこの人民のもとでは、あらゆることがふさわしい程度にとどめられた。護民官がとてもできないことを、衛士にさせた。それで衛士が自分たちを代表したがるのでは、と恐れはしなかったのである。
    translation_status: reviewed
  - id: rsc-b3-c15-008
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: Pour expliquer cependant comment les Tribuns le réprésentoient quelquefois, il suffit de concevoir comment le Gouvernement réprésente le Souverain. La Loi n’étant que la déclaration de la volonté générale, il est clair que dans la puissance Législative le Peuple ne peut être réprésenté ; mais il peut & doit l’être dans la puissance exécutive, qui n’est que la force appliquée à la Loi. Ceci fait voir qu’en examinant bien les choses on trouveroit que très peu de Nations ont des loix. Quoi qu’il en soit, il est sûr que les Tribuns, n’ayant aucune partie du pouvoir exécutif, ne purent jamais réprésenter le Peuple romain par les droits de leurs charges, mais seulement en usurpant sur ceux du Sénat.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '216'
        source_sequence: 397
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/228
        printed_page_end: '217'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-008-print
    translation_ja: ただし、護民官が人民を代表することがときにあったのはなぜか。これを説明するには、政府が主権者をどう代表するかを理解するだけでよい。法は一般意志の宣言にすぎないのだから、立法権において人民を代表できないのは明らかだ。だが行政権とは法を執行するために力を用いるだけのものなので、そこでは人民を代表できるし、代表しなければならない。このことから、よく調べてみれば、法を持つ国はごくわずかだとわかるだろう。いずれにせよ、護民官は行政権を分け持つことがなかったので、自分たちの職に付随する権利によっては決してローマの人民を代表できず、ただ元老院の権利を横取りすることによってだけ、代表できた。
    translation_status: reviewed
  - id: rsc-b3-c15-009
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: Chez les Grecs, tout ce que le Peuple avoit à faire il le faisoit par lui-même ; il étoit sans cesse assemblé sur la place. Il habitoit un climat doux, il n’étoit point avide, des esclaves faisoient ses travaux, sa grande affaire étoit sa liberté. N’ayant plus les mêmes avantages, comment conserver les mêmes droits ? Vos climats plus durs vous donnent plus de besoins, six mois de l’année la place publique n’est pas tenable, vos langues sourdes ne peuvent se faire entendre en plein air, vous donnez plus à votre gain qu’à votre liberté, & vous craignez bien moins l’esclavage que la misere.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '217'
        source_sequence: 398
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/229
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-009-print
    translation_ja: ギリシアでは、人民がすべきことは何でも自分たちで行った。人民は絶えず広場に集まっていた。おだやかな気候の土地に住み、貪欲ではなく、奴隷たちが労働をし、最も大切な仕事は自分たちの自由だった。同じ利点がなくなったいま、どうやって同じ権利を保てよう。もっと厳しい気候に住むあなたがたには、もっと必要なものが多く、一年のうち半年は広場にいられず、あなたがたの響かない言葉は、戸外では聞き取れない。あなたがたは自分の稼ぎを自由より大事にし、貧しさほどには隷属を恐れない。
    translation_status: reviewed
  - id: rsc-note-27-text
    section_id: rsc-b3-c15
    kind: note_body
    origin: source
    source_text: Adopter dans les pays froids le luxe & la mollesse des orientaux, c’est vouloir se donner leurs chaines ; c’est s’y soumettre encore plus nécessairement qu’eux.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '217'
        source_sequence: 399
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/229
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-27-text-print
    translation_ja: 寒い土地で東方のぜいたくと安逸を採り入れるのは、東方の人々と同じ鎖を、自ら欲しがることである。彼ら自身よりも、さらに避けがたく、それに服することになる。
    translation_status: reviewed
  - id: rsc-b3-c15-010
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: Quoi ! la liberté ne se maintient qu’à l’appui de la servitude ? Peut-être. Les deux excès se touchent. Tout ce qui n’est point dans la nature a ses inconvéniens, & la société civile plus que tout le reste. Il y a telles positions malheureuses où l’on ne peut conserver sa liberté qu’aux dépens de celle d’autrui, & où le Citoyen ne peut être parfaitement libre que l’esclave ne soit extrêmement esclave. Telle étoit la position de Sparte. Pour vous, peuples modernes, vous n’avez point d’esclaves, mais vous l’êtes ; vous payez leur liberté de la vôtre. Vous avez beau vanter cette préférence ; j’y trouve plus de lâcheté que d’humanité.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '217'
        source_sequence: 400
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/229
        printed_page_end: '218'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-010-print
    translation_ja: 何だと。自由が保たれるには、隷属に支えられるしかないのか。そうかもしれない。二つの極端は接する。自然のままでないものにはどれも不都合があり、市民社会にはほかの何よりも不都合が多い。他人の自由を犠牲にしてしか自分の自由を保てず、奴隷が徹底して奴隷でないかぎり、市民も完全には自由ではありえない、不幸な境遇がある。スパルタがそうだった。近代の人民であるあなたがたは、奴隷を持っていないが、自分たちが奴隷なのだ。自分たちの自由を代償にして、奴隷だった人々の自由を買う。その選択をどれだけ自慢しても、私には、人間愛よりも臆病さのほうが多く見える。
    translation_status: reviewed
  - id: rsc-b3-c15-011
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: Je n’entens point par tout cela qu’il faille avoir des esclaves ni que le droit d’esclavage soit légitime, puisque j’ai prouvé le contraire. Je dis seulement les raisons pourquoi les peuples modernes qui se croyent libres ont des Réprésentans, & pourquoi les peuples anciens n’en avoient pas. Quoi qu’il en soit, à l’instant qu’un Peuple se donne des Réprésentans, il n’est plus libre ; il n’est plus.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '218'
        source_sequence: 401
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/230
        printed_page_end: '219'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-011-print
    translation_ja: 以上は、奴隷を持てとか、奴隷にする権利は正当だとかいう意味ではない。私はその反対を証明したのだから。私はただ、自分たちは自由だと思っている近代の人民がなぜ代表者を持ち、古代の人民はなぜそれを持たなかったのか、その理由を説明している。いずれにせよ、人民が代表者を置いた瞬間、人民はもはや自由ではない。人民として、もはや存在しない。
    translation_status: reviewed
  - id: rsc-b3-c15-012
    section_id: rsc-b3-c15
    kind: paragraph
    origin: source
    source_text: Tout bien examiné, je ne vois pas qu’il soit désormais possible au Souverain de conserver parmi nous l’exercice de ses droits si la Cité n’est très petite. Mais si elle est très petite elle sera subjuguée ? Non. Je ferai voir ci-après comment on peut réunir la puissance extérieure d’un grand Peuple avec la police aisée & le bon ordre d’un petit État.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '219'
        source_sequence: 402
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/231
        printed_page_end: '220'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c15-012-print
    translation_ja: よくよく考えてみると、市民共同体がごく小さくないかぎり、主権者がその権利の行使を、われわれのあいだでこれからも保てるとは思えない。だが、ごく小さければ征服されるのではないか。いや、そうではない。大国の対外的な力を、小国の容易な統治とよい秩序とに、どうすれば結びつけられるのか、後で明らかにしよう。
    translation_status: reviewed
  - id: rsc-note-28-text
    section_id: rsc-b3-c15
    kind: note_body
    origin: source
    source_text: C’est ce que je m’étois proposé de faire dans la suite de cet ouvrage, lorsqu’en traitant des rélations externes j’en serois venu aux confédérations. Matiere toute neuve & où les principes sont encore à établir.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '219'
        source_sequence: 403
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/231
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-28-text-print
    translation_ja: この著作の続きを書き、対外関係を扱って、連合の問題に行き着いたところで、その説明をするつもりだった。まったく新しい題目であり、いまだその原理は立てられていない。
    translation_status: reviewed
  - id: rsc-b3-c16-heading
    section_id: rsc-b3-c16
    kind: heading
    origin: source
    source_text: CHAPITRE XVI.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '220'
        source_sequence: 404
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/232
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c16-heading-print
    translation_ja: 第十六章
    translation_status: reviewed
  - id: rsc-b3-c16-title
    section_id: rsc-b3-c16
    kind: heading
    origin: source
    source_text: Que l’institution du Gouvernement n’est point un contract.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '220'
        source_sequence: 405
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/232
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c16-title-print
    translation_ja: 政府を設けることは契約ではない
    translation_status: reviewed
  - id: rsc-b3-c16-001
    section_id: rsc-b3-c16
    kind: paragraph
    origin: source
    source_text: Le pouvoir Législatif une fois bien établi, il s’agit d’établir de même le pouvoir exécutif ; car ce dernier, qui n’opere que par des actes particuliers, n’étant pas de l’essence de l’autre, en est naturellement séparé. S’il étoit possible que le Souverain, considéré comme tel, eut la puissance exécutive, le droit & le fait seroient tellement confondus qu’on ne sauroit plus ce qui est loi & ce qui ne l’est pas, & le corps politique ainsi dénaturé seroit bien-tôt en proye à la violence contre laquelle il fut institué.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '220'
        source_sequence: 406
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/232
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c16-001-print
    translation_ja: 立法権をきちんと設けたら、同じように行政権を設けなければならない。というのも、行政権は個別の行為によってしか働かず、立法権の本質には属さないため、自然にこれと切り離されているからである。主権者が主権者として行政権を持つことができたなら、権利と事実は完全に混ざりあい、何が法律で、何が法律でないかも、もはやわからなくなる。こうして本来の性質を失った政治体は、もともと暴力を防ぐためにつくられたのに、たちまち暴力の餌食になるだろう。
    translation_status: reviewed
  - id: rsc-b3-c16-002
    section_id: rsc-b3-c16
    kind: paragraph
    origin: source
    source_text: Les Citoyens étant tous égaux par le contract social, ce que tous doivent faire tous peuvent le prescrire, au lieu que nul n’a droit d’exiger qu’un autre fasse ce qu’il ne fait pas lui-même. Or c’est proprement ce droit, indispensable pour faire vivre & mouvoir le corps politique, que le Souverain donne au Prince en instituant le Gouvernement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '220'
        source_sequence: 407
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/232
        printed_page_end: '221'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c16-002-print
    translation_ja: 市民はみな社会契約によって平等なのだから、みなが行うべきことを、みなが定めることができる。一方で、自分がしないことを他人にせよと求める権利は誰にもない。ところで、政治体に生命と動きを与えるのに欠かせないその権利こそ、主権者が政府を設けるときに統治者へ与える権利である。
    translation_status: reviewed
  - id: rsc-b3-c16-003
    section_id: rsc-b3-c16
    kind: paragraph
    origin: source
    source_text: Plusieurs ont prétendu que l’acte de cet établissement étoit un contract entre le Peuple & les chefs qu’il se donne ; contract par lequel on stipuloit entre les deux parties les conditions sous lesquelles l’une s’obligeoit à commander & l’autre à obéir. On conviendra, je m’assure, que voilà une étrange maniere de contracter ! Mais voyons si cette opinion est soutenable.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '221'
        source_sequence: 408
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/233
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c16-003-print
    translation_ja: 政府を設ける行為は、人民と、人民が自分たちのために選んだ長たちとの契約だと、多くの人が主張してきた。片方は命令し、もう片方は従うと約束する条件を、当事者間で取り決める契約だという。これが奇妙な契約の仕方だということは、きっと納得してもらえるだろう。だが、この意見が成り立つかどうか、見てみよう。
    translation_status: reviewed
  - id: rsc-b3-c16-004
    section_id: rsc-b3-c16
    kind: paragraph
    origin: source
    source_text: Premierement, l’autorité suprême ne peut pas plus se modifier que s’aliéner, la limiter c’est la détruire. Il est absurde & contradictoire que le Souverain se donne un supérieur ; s’obliger d’obéir à un maitre c’est se remettre en pleine liberté.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '221'
        source_sequence: 409
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/233
        printed_page_end: '222'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c16-004-print
    translation_ja: 第一に、至上の権威は、譲り渡せないのと同じように、変えることもできない。制限するのは、破壊することだ。主権者が自分より上の者を置くのは、筋が通らず矛盾している。主人に従う義務を自分に課すのは、自らをもとの完全な自由に戻すことである。
    translation_status: reviewed
  - id: rsc-b3-c16-005
    section_id: rsc-b3-c16
    kind: paragraph
    origin: source
    source_text: De plus, il est évident que ce contract du peuple avec telles ou telles personnes seroit un acte particulier. D’où il suit que ce contract ne sauroit être une loi ni un acte de souveraineté, & que par conséquent il seroit illégitime.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '222'
        source_sequence: 410
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/234
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c16-005-print
    translation_ja: さらに、人民が誰それと結ぶこの契約が、個別の行為となることは明らかである。したがって、この契約は法でも主権の行為でもありえず、ゆえに正当ではない。
    translation_status: reviewed
  - id: rsc-b3-c16-006
    section_id: rsc-b3-c16
    kind: paragraph
    origin: source
    source_text: 'On voit encore que les parties contractantes seroient entre elles sous la seule loi de nature & sans aucun garant de leurs engagemens réciproques, ce qui répugne de toutes manieres à l’état civil : Celui qui a la force en main étant toujours le maitre de l’exécution, autant vaudroit donner le nom de contract à l’acte d’un homme qui diroit à un autre ; „je vous donne tout mon bien, à condition que vous m’en rendrez ce qu’il vous plaira”.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '222'
        source_sequence: 411
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/234
        printed_page_end: '223'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c16-006-print
    translation_ja: また、契約の当事者は、互いのあいだでは自然の法にしか服さず、互いに交わした約束には何の保証もないことになる。これはまったく市民状態に反する。力を握る者がつねに実行を左右する以上、この行為を契約と呼ぶなら、人が他の人にこう言う行為を契約と呼ぶのと同じだ。「私の財産をすべてあなたにあげましょう。ただし、あなたが返したいと思った分を、その中から返すことが条件です。」
    translation_status: reviewed
  - id: rsc-b3-c16-007
    section_id: rsc-b3-c16
    kind: paragraph
    origin: source
    source_text: Il n’y a qu’un contract dans l’Etat, c’est celui de l’association ; & celui-là seul en exclut tout autre. On ne sauroit imaginer aucun Contract public, qui ne fut une violation du premier.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '223'
        source_sequence: 412
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/235
        printed_page_end: '224'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c16-007-print
    translation_ja: 国家には一つの契約しかない。人々が結びつく契約である。それだけで、ほかのどの契約をも排除する。この最初の契約を侵さない公の契約は、一つも思いつかない。
    translation_status: reviewed
  - id: rsc-b3-c17-heading
    section_id: rsc-b3-c17
    kind: heading
    origin: source
    source_text: CHAPITRE XVII.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '224'
        source_sequence: 413
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/236
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c17-heading-print
    translation_ja: 第十七章
    translation_status: reviewed
  - id: rsc-b3-c17-title
    section_id: rsc-b3-c17
    kind: heading
    origin: source
    source_text: De l’institution du Gouvernement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '224'
        source_sequence: 414
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/236
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c17-title-print
    translation_ja: 政府の設立について
    translation_status: reviewed
  - id: rsc-b3-c17-001
    section_id: rsc-b3-c17
    kind: paragraph
    origin: source
    source_text: Sous quelle idée faut-il donc concevoir l’acte par lequel le Gouvernement est institué ? Je remarquerai d’abord que cet acte est complexe ou composé de deux autres, savoir l’établissement de la loi, & l’exécution de la loi.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '224'
        source_sequence: 415
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/236
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c17-001-print
    translation_ja: では、政府を設ける行為を、どのようなものと考えればよいのか。まず、この行為は複合的で、二つの行為、すなわち法を定める行為と、法を執行する行為から成る、と指摘しておこう。
    translation_status: reviewed
  - id: rsc-b3-c17-002
    section_id: rsc-b3-c17
    kind: paragraph
    origin: source
    source_text: Par le premier, le Souverain statue qu’il y aura un corps de Gouvernement établi sous telle ou telle forme ; & il est clair que cet acte est une loi.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '224'
        source_sequence: 416
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/236
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c17-002-print
    translation_ja: 第一の行為で、主権者は、しかじかの形の政府という団体をつくると定める。この行為が法律であることは、明らかである。
    translation_status: reviewed
  - id: rsc-b3-c17-003
    section_id: rsc-b3-c17
    kind: paragraph
    origin: source
    source_text: Par le second, le Peuple nomme les chefs qui seront chargés du Gouvernement établi. Or cette nomination étant un acte particulier n’est pas une seconde loi, mais seulement une suite de la premiere & une fonction du Gouvernement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '224'
        source_sequence: 417
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/236
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c17-003-print
    translation_ja: 第二の行為で、人民は、設けられた政府を任される長たちを任命する。この任命は個別の行為なので、二つ目の法律ではない。最初の法律の結果であり、政府の働きにすぎない。
    translation_status: reviewed
  - id: rsc-b3-c17-004
    section_id: rsc-b3-c17
    kind: paragraph
    origin: source
    source_text: La difficulté est d’entendre comment on peut avoir un acte de Gouvernement avant que le Gouvernement existe, & comment le Peuple, qui n’est que Souverain ou sujet, peut devenir Prince ou Magistrat dans certaines circonstances.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '224'
        source_sequence: 418
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/236
        printed_page_end: '225'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c17-004-print
    translation_ja: 難しいのは、政府ができる前に、どうして政府の行為がありうるのか、また、主権者か臣民でしかない人民が、ある場合、どうすれば統治者や行政官になれるのかを理解することだ。
    translation_status: reviewed
  - id: rsc-b3-c17-005
    section_id: rsc-b3-c17
    kind: paragraph
    origin: source
    source_text: C’est encore ici que se découvre une de ces étonnantes propriétés du corps politique, par lesquelles il concilie des opérations contradictoires en apparence. Car celle-ci se fait par une conversion subite de la Souveraineté en Démocratie ; en sorte que, sans aucun changement sensible, & seulement par une nouvelle rélation de tous à tous, les Citoyens devenus Magistrats passent des actes généraux aux actes particuliers, & de la loi à l’exécution.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '225'
        source_sequence: 419
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/237
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c17-005-print
    translation_ja: ここでも、表面上は矛盾する働きを一つにできる、政治体の驚くべき性質が一つ現れる。主権を担う人民が、たちまち民主政の政府へと姿を変えることによって、このことは行われる。見た目には何も変わらず、全員と全員の関係が新しくなっただけで、行政官となった市民が、一般的な行為から個別の行為へ、法から執行へ移るのである。
    translation_status: reviewed
  - id: rsc-b3-c17-006
    section_id: rsc-b3-c17
    kind: paragraph
    origin: source
    source_text: 'Ce changement de rélation n’est point une subtilité de spéculation sans exemple dans la pratique : Il a lieu tous les jours dans le Parlement d’Angleterre, où la Chambre-basse en certaines occasions se tourne en grand Commité, pour mieux discuter les affaires, & devient ainsi simple commission, de Cour Souveraine qu’elle étoit l’instant précédent ; en telle sorte qu’elle se fait ensuite rapport à elle-même comme chambre des Communes de ce qu’elle vient de regler en grand-Commité, & délibere de nouveau sous un titre de ce qu’elle a déjà résolu sous un autre.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '225'
        source_sequence: 420
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/237
        printed_page_end: '226'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c17-006-print
    translation_ja: この関係の変化は、現実に例のない理屈のこね回しではない。イングランドの議会では日々起きている。庶民院は、事柄をよりよく審議するため、場合によっては全院委員会となり、直前まで最高の議会だったものが、ただの委員会になる。そのあと、全院委員会としてたった今決めたことを、庶民院である自分自身に報告し、別の名目で決議したことを、新しい名目であらためて審議する。
    translation_status: reviewed
  - id: rsc-b3-c17-007
    section_id: rsc-b3-c17
    kind: paragraph
    origin: source
    source_text: Tel est l’avantage propre au Gouvernement Démocratique de pouvoir être établi dans le fait par un simple acte de la volonté générale. Après quoi, ce Gouvernement provisionnel reste en possession si telle est la forme adoptée, ou établit au nom du Souverain le Gouvernement prescrit par la loi, & tout se trouve ainsi dans la regle. Il n’est pas possible d’instituer le Gouvernement d’aucune autre maniere légitime, & sans renoncer aux principes ci-devant établis.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '226'
        source_sequence: 421
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/238
        printed_page_end: '227'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c17-007-print
    translation_ja: 一般意志の単純な一行為で、実際につくることができるというのが、民主政に固有の利点である。それから、採用される形が民主政なら、この仮の政府がそのままとどまる。そうでなければ、主権者の名において、法が定めた政府を設ける。こうしてすべてが規則どおりに整う。すでに立てた原理を捨てることなく、ほかの正当な仕方で政府を設けることはできない。
    translation_status: reviewed
  - id: rsc-b3-c18-heading
    section_id: rsc-b3-c18
    kind: heading
    origin: source
    source_text: CHAPITRE XVIII.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '227'
        source_sequence: 422
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/239
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c18-heading-print
    translation_ja: 第十八章
    translation_status: reviewed
  - id: rsc-b3-c18-title
    section_id: rsc-b3-c18
    kind: heading
    origin: source
    source_text: Moyen de prévenir les usurpations du Gouvernement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '227'
        source_sequence: 423
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/239
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c18-title-print
    translation_ja: 政府による権力の横取りを防ぐ方法
    translation_status: reviewed
  - id: rsc-b3-c18-001
    section_id: rsc-b3-c18
    kind: paragraph
    origin: source
    source_text: De ces éclaircissemens il résulte en confirmation du chapitre XVI. que l’acte qui institue le Gouvernement n’est point un contract mais une Loi, que les dépositaires de la puissance exécutive ne sont point les maitres du peuple mais ses officiers, qu’il peut les établir & les destituer quand il lui plait, qu’il n’est point question pour eux de contracter mais d’obéir, & qu’en se chargeant des fonctions que l’Etat leur impose ils ne font que remplir leur devoir de Citoyens, sans avoir en aucune sorte le droit de disputer sur les conditions.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '227'
        source_sequence: 424
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/239
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c18-001-print
    translation_ja: 以上の説明から、第十六章を裏づけることがわかる。政府を設ける行為は契約ではなく法律であり、行政権を預かる人々は人民の主人ではなく、人民の役人である。人民は望むときに彼らを任免できる。彼らにとって問題なのは契約することではなく、従うことである。国家から課された仕事を引き受けるときには、市民の義務を果たすだけで、条件を争う権利は何一つない。
    translation_status: reviewed
  - id: rsc-b3-c18-002
    section_id: rsc-b3-c18
    kind: paragraph
    origin: source
    source_text: Quand donc il arrive que le Peuple institue un Gouvernement héréditaire, soit monarchique dans une famille, soit aristocratique dans un ordre de Citoyens, ce n’est point un engagement qu’il prend ; c’est une forme provisionnelle qu’il donne à l’administration, jusqu’à ce qu’il lui plaise d’en ordonner autrement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '227'
        source_sequence: 425
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/239
        printed_page_end: '228'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c18-002-print
    translation_ja: したがって人民が、一つの家系に委ねる君主政であれ、ある市民の身分に委ねる貴族政であれ、世襲の政府を設ける場合、それは人民が約束をすることではない。別の定めをしたいと思う時まで、行政に仮の形を与えるだけである。
    translation_status: reviewed
  - id: rsc-b3-c18-003
    section_id: rsc-b3-c18
    kind: paragraph
    origin: source
    source_text: Il est vrai que ces changemens sont toujours dangereux, & qu’il ne faut jamais toucher au Gouvernement établi que lors qu’il devient incompatible avec le bien public ; mais cette circonspection est une maxime de politique & non pas une regle de droit, & l’Etat n’est pas plus tenu de laisser l’autorité civile à ses chefs, que l’autorité militaire à ses Généraux.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '228'
        source_sequence: 426
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/240
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c18-003-print
    translation_ja: 確かに、こうした変更にはつねに危険がある。公益と両立しなくなったときでなければ、設けられた政府に手を加えてはならない。しかしこの慎重さは、政治の格言であって、権利の規則ではない。国が政府の長たちに民政の権威を任せ続ける義務は、将軍たちに軍事の権威を任せ続ける義務と同様、ないのである。
    translation_status: reviewed
  - id: rsc-b3-c18-004
    section_id: rsc-b3-c18
    kind: paragraph
    origin: source
    source_text: 'Il est vrai encore qu’on ne sauroit en pareil cas observer avec trop de soin toutes les formalités requises pour distinguer un acte régulier & légitime d’un tumulte séditieux, & la volonté de tout un peuple des clameurs d’une faction. C’est ici sur-tout qu’il ne faut donner au cas odieux que ce qu’on ne peut lui refuser dans toute la rigueur du droit, & c’est aussi de cette obligation que le Prince tire un grand avantage pour conserver sa puissance malgré le peuple, sans qu’on puisse dire qu’il l’ait usurpée : Car en paroissant n’user que de ses droits il lui est fort aisé de les étendre, & d’empêcher sous le prétexte du repos public les assemblées destinées à rétablir le bon ordre ; de sorte qu’il se prévaut d’un silence qu’il empêche de rompre, ou des irrégularités qu’il fait commettre, pour supposer en sa faveur l’aveu de ceux que la crainte fait taire, & pour punir ceux qui osent parler. C’est ainsi que les Décemvirs ayant été d’abord élus pour un an, puis continués pour une autre année, tenterent de retenir à perpétuité leur pouvoir, en ne permettant plus aux comices de s’assembler ; & c’est par ce facile moyen que tous les gouvernemens du monde, une fois revétus de la force publique, usurpent tôt ou tard l’autorité Souveraine.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '228'
        source_sequence: 427
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/240
        printed_page_end: '230'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c18-004-print
    translation_ja: また、こうした場合に、正規の正当な行為を反乱の騒ぎから、人民全体の意志を派閥の喚声から区別するため、必要な手続をどれほど慎重に守っても、守りすぎにはならない。とりわけこの場合、忌まわしい事態に際しても、厳密な権利に照らして拒めないものだけは認めねばならない。この義務を大いに利用し、統治者は人民に逆らっても、権力を横取りしたと言われずに支配を保つ。自分の権利しか使っていないように見せれば、その権利を広げるのはたやすく、公の平穏を口実に、よい秩序を回復するための集会を妨げられる。こうして、破らせない沈黙や、自ら起こさせた手続違反を利用して、恐怖のため黙る者が自分に同意したと考え、口を開く勇気を持つ者を罰する。こうして十人委員は、はじめ一年だけ選ばれ、次の一年も職にとどまったあと、民会が集まるのを許さず、自分たちの権力を永久に保とうとした。このたやすい手段によって、世界の政府はどれも、ひとたび公の実力を手にすると、遅かれ早かれ主権者の権威を奪う。
    translation_status: reviewed
  - id: rsc-b3-c18-005
    section_id: rsc-b3-c18
    kind: paragraph
    origin: source
    source_text: 'Les assemblées périodiques dont j’ai parlé ci-devant sont propres à prévenir ou différer ce malheur, sur-tout quand elles n’ont pas besoin de convocation formelle : car alors le Prince ne sauroit les empêcher sans se déclarer ouvertement infracteur des loix & ennemi de l’Etat.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '230'
        source_sequence: 428
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/242
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c18-005-print
    translation_ja: 先に述べた定期集会は、この不幸を防ぐか、遅らせるのにふさわしい。とりわけ、正式の召集を必要としないのであれば、なおよい。その場合、統治者は、公然と法を破り、国家の敵だと名乗らないかぎり、集会を妨げられないからだ。
    translation_status: reviewed
  - id: rsc-b3-c18-006
    section_id: rsc-b3-c18
    kind: paragraph
    origin: source
    source_text: L’ouverture de ces assemblées qui n’ont pour objet que le maintien du traité social, doit toujours se faire par deux propositions qu’on ne puisse jamais supprimer, & qui passent separément par les suffrages.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '230'
        source_sequence: 429
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/242
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c18-006-print
    translation_ja: 社会の取り決めを守ることだけを目的とするこの集会は、必ず二つの提案で始めなければならない。その提案は決して取り下げられず、別々に投票にかけられる。
    translation_status: reviewed
  - id: rsc-b3-c18-007
    section_id: rsc-b3-c18
    kind: paragraph
    origin: source
    source_text: La premiere ; s’il plait au Souverain de conserver la présente forme de Gouvernement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '230'
        source_sequence: 430
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/242
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c18-007-print
    translation_ja: 第一は、現在の政府の形を保つことを、主権者が望むかどうか。
    translation_status: reviewed
  - id: rsc-b3-c18-008
    section_id: rsc-b3-c18
    kind: paragraph
    origin: source
    source_text: La seconde ; s’il plait au Peuple d’en laisser l’administration à ceux qui en sont actuellement chargés.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '230'
        source_sequence: 431
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/242
        printed_page_end: '231'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c18-008-print
    translation_ja: 第二は、現在これを任されている人々に、その行政を委ね続けることを、人民が望むかどうかである。
    translation_status: reviewed
  - id: rsc-b3-c18-009
    section_id: rsc-b3-c18
    kind: paragraph
    origin: source
    source_text: Je suppose ici ce que je crois avoir démontré, savoir qu’il n’y a dans l’Etat aucune loi fondamentale qui ne se puisse révoquer, non pas même le pacte social ; car si tous les Citoyens s’assembloient pour rompre ce pacte d’un commun accord, on ne peut douter qu’il ne fût très-légitimement rompu. Grotius pense même que chacun peut renoncer à l’Etat dont il est membre, & reprendre sa liberté naturelle & ses biens en sortant du pays. Or il seroit absurde que tous les Citoyens réunis ne pussent pas ce que peut séparément chacun d’eux.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '231'
        source_sequence: 432
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/243
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c18-009-print
    translation_ja: 私はここで、証明したと思っていることを前提にする。すなわち、国家には取り消せない根本法はなく、社会盟約でさえ取り消せるということだ。すべての市民が集まり、同じ意見でこの盟約を破るなら、まったく正当に破られたことを疑う余地はないからだ。グロティウスはさらに、誰でも、自分が一員である国を捨て、その国を出ることで、自然の自由と自分の財産を取り戻せると考えている。では一人ひとりが別々にできることを、すべての市民が一緒になればできない、というのはばかげている。
    translation_status: reviewed
  - id: rsc-note-29-text
    section_id: rsc-b3-c18
    kind: note_body
    origin: source
    source_text: Bien entendu qu’on ne quite point pour éluder son devoir & se dispenser de servir la patrie au moment qu’elle a besoin de nous. La fuite alors seroit criminelle & punissable ; ce ne seroit plus retraite, mais désertion.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '231'
        source_sequence: 433
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/243
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-29-text-print
    translation_ja: 言うまでもなく、義務を避け、祖国がわれわれを必要としているときに、これに仕えることを免れるために去るのではない。そのとき逃げれば罪であり、罰せられる。それはもはや引退でなく、脱走だ。
    translation_status: reviewed
  - id: rsc-b3-end
    section_id: rsc-b3-c18
    kind: paragraph
    origin: source
    source_text: Fin du Livre Troisieme.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '231'
        source_sequence: 434
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/243
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-end-print
    translation_ja: 第三編　終わり
    translation_status: reviewed
  - id: rsc-b4-title
    section_id: rsc-b4
    kind: paragraph
    origin: source
    source_text: DU CONTRACT SOCIAL ; OU, PRINCIPES DU DROIT POLITIQUE.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '232'
        source_sequence: 435
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/244
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-title-print
    translation_ja: 社会契約論、あるいは政治的権利の原理
    translation_status: reviewed
  - id: rsc-b4-heading
    section_id: rsc-b4
    kind: heading
    origin: source
    source_text: LIVRE IV.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page

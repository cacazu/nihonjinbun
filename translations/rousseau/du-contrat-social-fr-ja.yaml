  - id: rsc-b1-c08-title
    section_id: rsc-b1-c08
    kind: heading
    origin: source
    source_text: De l’état civil.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '37'
        source_sequence: 79
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/49
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c08-title-print
    translation_ja: 市民状態について
    translation_status: reviewed
  - id: rsc-b1-c08-001
    section_id: rsc-b1-c08
    kind: paragraph
    origin: source
    source_text: Ce passage de l’état de nature à l’état civil produit dans l’homme un changement très rémarquable, en substituant dans sa conduite la justice à l’instinct, & donnant à ses actions la moralité qui leur manquoit auparavant. C’est alors seulement que la voix du devoir succédant à l’impulsion physique & le droit à l’appetit, l’homme, qui jusque là n’avoit regardé que lui-même, se voit forcé d’agir sur d’autres principes, & de consulter sa raison avant d’écouter ses penchans. Quoiqu’il se prive dans cet état de plusieurs avantages qu’il tient de la nature, il en regagne de si grands, ses facultés s’exercent & se développent, ses idées s’étendent, ses sentimens s’ennoblissent, son ame tout entiere s’éleve à tel point, que si les abus de cette nouvelle condition ne le dégradoient souvent au dessous de celle dont il est sorti, il devroit bénir sans cesse l’instant heureux qui l’en arracha pour jamais, & qui, d’un animal stupide & borné, fit un être intelligent & un homme.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '37'
        source_sequence: 80
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/49
        printed_page_end: '38'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c08-001-print
    translation_ja: 自然状態から市民状態への移行は、人間にまことに目を引く変化をもたらす。行いのなかで本能に代わって正義が働き、それまでなかった道徳的な意味が行為に備わる。身体の衝動に代わって義務の声が、欲望に代わって権利が働くようになると、それまで自分のことしか目に入らなかった人間も、別の原則に従って行動し、自分の欲求に耳を傾ける前に、理性に問わざるをえなくなる。この新しい状態では、自然から得ていた利点をいくつも失うが、それに代わって得るものは、それほどにも大きい。諸能力を働かせ、伸ばし、考えを広げ、感情を気高くし、心のすべてを高めてゆく。新しい境遇の濫用によって、出てきたもとの境遇よりもしばしば低いところに落ちるのでなければ、もとの境遇から永遠に引き離し、愚鈍で視野の狭い動物を、知性ある存在、人間にしたこの幸いな瞬間を、絶えず祝福してしかるべきであろう。
    translation_status: reviewed
  - id: rsc-b1-c08-002
    section_id: rsc-b1-c08
    kind: paragraph
    origin: source
    source_text: Reduisons toute cette balance à des termes faciles à comparer. Ce que l’homme perd par le contract social, c’est sa liberté naturelle & un droit illimité à tout ce qui le tente & qu’il peut atteindre ; ce qu’il gagne, c’est la liberté civile & la propriété de tout ce qu’il possede. Pour ne pas se tromper dans ces compensations, il faut bien distinguer la liberté naturelle qui n’a pour bornes que les forces de l’individu, de la liberté civile qui est limitée par la volonté générale, & la possession qui n’est que l’effet de la force ou le droit du premier occupant, de la propriété qui ne peut être fondée que sur un titre positif.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '38'
        source_sequence: 81
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/50
        printed_page_end: '39'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c08-002-print
    translation_ja: 何を得て何を失うか、比べやすい言葉にまとめよう。社会契約によって人が失うのは、自然の自由と、欲しくて手の届くものなら何にでも及ぶ無制限の権利である。得るのは、市民の自由と、占有しているものすべてについての所有権である。この差し引きを取り違えないためには、個人の力だけが限界となる自然の自由と、一般意志によって限られる市民の自由を、よく区別しなければならない。同じように、力の結果か、最初に占有した者の権利にすぎない占有と、明確な権原にしか基づきえない所有を区別しなければならない。
    translation_status: reviewed
  - id: rsc-b1-c08-003
    section_id: rsc-b1-c08
    kind: paragraph
    origin: source
    source_text: On pourroit sur ce qui précede ajouter à l’acquis de l’état civil la liberté morale, qui seule rend l’homme vraiment maitre de lui ; car l’impulsion du seul appetit est esclavage, & l’obéissance à la loi qu’on s’est prescrite est liberté. Mais je n’en ai déjà que trop dit sur cet article, & le sens philosophique du mot liberté n’est pas ici de mon sujet.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '39'
        source_sequence: 82
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/51
        printed_page_end: '40'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c08-003-print
    translation_ja: ここまでの話に加えると、市民状態で得るもののうちには、道徳的な自由も挙げられる。これだけが、人を真に自分自身の主人にする。欲望の衝動だけに従うのは奴隷であることであり、自分に課した法に従うことが自由だからだ。だが、この点はもう十分すぎるほどに述べた。「自由」という語の哲学的な意味は、ここでの主題ではない。
    translation_status: reviewed
  - id: rsc-b1-c09-heading
    section_id: rsc-b1-c09

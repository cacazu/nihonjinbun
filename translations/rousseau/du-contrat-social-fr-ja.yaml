  - id: rsc-b4-c06-title
    section_id: rsc-b4-c06
    kind: heading
    origin: source
    source_text: De la Dictature.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '283'
        source_sequence: 531
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/295
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-title-print
    translation_ja: 独裁官制について
    translation_status: reviewed
  - id: rsc-b4-c06-001
    section_id: rsc-b4-c06
    kind: paragraph
    origin: source
    source_text: L’inflexibilité des loix, qui les empêche de se plier aux événemens, peut en certains cas les rendre pernicieuses, & causer par elles la perte de l’Etat dans sa crise. L’ordre & la lenteur des formes demandent un espace de tems que les circonstances refusent quelquefois. Il peut se présenter mille cas auxquels le Législateur n’a point pourvu, & c’est une prévoyance très-nécessaire de sentir qu’on ne peut tout prévoir.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '283'
        source_sequence: 532
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/295
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-001-print
    translation_ja: 法律は融通がきかず、出来事に合わせて変わることができない。場合によっては、そのために有害となり、危機にある国家を滅ぼしかねない。手続に秩序があり、ゆっくりしていると、それだけ時間が要るが、事情がそれを許さないこともある。立法者の備えがない事態が、いくらでも起こりうる。すべてを予想することはできないと知ることが、欠くことのできない先見である。
    translation_status: reviewed
  - id: rsc-b4-c06-002
    section_id: rsc-b4-c06
    kind: paragraph
    origin: source
    source_text: Il ne faut donc pas vouloir affermir les institutions politiques jusqu’à s’ôter le pouvoir d’en suspendre l’effet. Sparte elle-même a laissé dormir ses loix.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '283'
        source_sequence: 533
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/295
        printed_page_end: '284'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-002-print
    translation_ja: だから政治の制度を強固にしようとして、その効力を休止させる力まで失ってはならない。スパルタでさえ、自らの法律を眠らせたことがある。
    translation_status: reviewed
  - id: rsc-b4-c06-003
    section_id: rsc-b4-c06
    kind: paragraph
    origin: source
    source_text: Mais il n’y a que les plus grands dangers qui puissent balancer celui d’altérer l’ordre public, & l’on ne doit jamais arrêter le pouvoir sacré des loix que quand il s’agit du salut de la patrie. Dans ces cas rares & manifestes on pourvoit à la sûreté publique par un acte particulier qui en remet la charge au plus digne. Cette commission peut se donner de deux manieres selon l’espece du danger.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '284'
        source_sequence: 534
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/296
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-003-print
    translation_ja: ただし、公の秩序を変える危険と釣り合うのは、このうえなく重大な危険だけである。祖国の存亡が懸かっているときでなければ、神聖な法の力を止めるべきではない。そのような、まれで明白な事態には、特別の行為によって、公の安全を守る責めを、最もふさわしい人に預ける。この委任には、危険の種類に応じて二通りの仕方がある。
    translation_status: reviewed
  - id: rsc-b4-c06-004
    section_id: rsc-b4-c06
    kind: paragraph
    origin: source
    source_text: Si pour y remédier il suffit d’augmenter l’activité du gouvernement, on le concentre dans un ou deux de ses membres ; Ainsi ce n’est pas l’autorité des loix qu’on altere mais seulement la forme de leur administration. Que si le péril est tel que l’appareil des loix soit un obstacle à s’en garantir, alors on nomme un chef suprême qui fasse taire toutes les loix & suspende un moment l’autorité Souveraine ; en pareil cas la volonté générale n’est pas douteuse, & il est évident que la premiere intention du peuple est que l’Etat ne périsse pas. De cette maniere la suspension de l’autorité législative ne l’abolit point ; le magistrat qui la fait taire ne peut la faire parler, il la domine sans pouvoir la représenter ; il peut tout faire, excepté des loix.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '284'
        source_sequence: 535
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/296
        printed_page_end: '285'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-004-print
    translation_ja: 政府がより機敏に動けば危険を除けるなら、政府を、その構成員一人か二人の手に集める。こうして変わるのは法の権威ではなく、法の執行の形だけである。ところが法律の仕組みが危険を免れる妨げになるほどの危機であれば、最高の長を任命して、すべての法を黙らせ、主権者の権威をひととき休止させる。そのような場合、一般意志に疑いはなく、国家が滅びないことが人民の第一の意図であるのは明らかだ。このように、立法の権威を休止することは、廃止することではない。立法の権威を黙らせる行政官も、立法の権威に語らせることはできない。それを抑えるだけで、代表はできない。何でもできるが、法をつくることだけはできないのである。
    translation_status: reviewed
  - id: rsc-b4-c06-005
    section_id: rsc-b4-c06
    kind: paragraph
    origin: source
    source_text: Le premier moyen s’employoit par le Sénat Romain quand il chargeoit les Consuls par une formule consacrée de pourvoir au salut de la République ; le second avoit lieu quand un des deux Consuls nommoit un Dictateur ; usage dont Albe avoit donné l’exemple à Rome.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '285'
        source_sequence: 536
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/297
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-005-print
    translation_ja: 第一の方法は、ローマの元老院が、伝統ある決まり文句によって、共和国を守るよう執政官に命じるときに用いられた。第二の方法は、二人の執政官のうち一人が独裁官を任命するときのものだった。これはアルバがローマに手本を示した慣行である。
    translation_status: reviewed
  - id: rsc-note-39-text
    section_id: rsc-b4-c06
    kind: note_body
    origin: source
    source_text: Cette nomination se faisoit de nuit & en secret, comme si l’on avoit eu honte de mettre un homme au dessus des loix.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '285'
        source_sequence: 537
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/297
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-39-text-print
    translation_ja: この任命は、法の上に一人の人間を置くことを恥じるかのように、夜のうちに、ひそかに行われた。
    translation_status: reviewed
  - id: rsc-b4-c06-006
    section_id: rsc-b4-c06
    kind: paragraph
    origin: source
    source_text: Dans les commencemens de la République on eut très souvent recours à la Dictature, parce que l’Etat n’avoit pas encore une assiette assez fixe pour pouvoir se soutenir par la seule force de sa constitution. Les mœurs rendant alors superflues bien des précautions qui eussent été nécessaires dans un autre tems, on ne craignoit ni qu’un Dictateur abusât de son autorité, ni qu’il tentât de la garder au delà du terme. Il sembloit, au contraire, qu’un si grand pouvoir fut à charge à celui qui en étoit revêtu, tant il se hâtoit de s’en défaire ; comme si c’eut été un poste trop pénible & trop périlleux de tenir la place des loix !
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '285'
        source_sequence: 538
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/297
        printed_page_end: '286'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-006-print
    translation_ja: 共和国の初めには独裁官制にしばしば頼った。国家の土台はまだ十分に固くなく、自らの体制の力だけで存続できなかったからだ。当時の風俗のおかげで、別の時代なら必要だった多くの用心も無用だった。独裁官が権威を濫用しようとか、任期を越えてこれを保持しようとかする恐れはなかった。反対に、これほど大きな権力は授けられた者には重荷らしく、実に急いで手放した。法律の代わりをするのは、あまりにつらく、あまりに危険な地位とでもいうように。
    translation_status: reviewed
  - id: rsc-b4-c06-007
    section_id: rsc-b4-c06
    kind: paragraph
    origin: source
    source_text: Aussi n’est-ce pas le danger de l’abus mais celui de l’avilissement qui me fait blâmer l’usage indiscret de cette suprême magistrature dans les premiers tems. Car tandis qu’on la prodigoit à des Elections, à des Dédicaces, à des choses de pure formalité, il étoit à craindre qu’elle ne devînt moins redoutable au besoin, & qu’on ne s’accoutumât à regarder comme un vain titre celui qu’on n’employoit qu’à de vaines cérémonies.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '286'
        source_sequence: 539
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/298
        printed_page_end: '287'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-007-print
    translation_ja: だから、初期にこの最高の官職を軽々しく用いたことを私が責めるのは、濫用の危険からではなく、地位が低くなる危険からである。選挙や奉献式など、ただの形式ごとにこれを惜しみなく使っていれば、いざというときに恐れられなくなるおそれがあった。むなしい儀式にしか使わないのなら、むなしい称号だと見なすのにも慣れかねなかった。
    translation_status: reviewed
  - id: rsc-b4-c06-008
    section_id: rsc-b4-c06
    kind: paragraph
    origin: source
    source_text: 'Vers la fin de la République, les Romains, devenus plus circonspects, ménagerent la Dictature avec aussi peu de raison qu’ils l’avoient prodiguée autrefois. Il étoit aisé de voir que leur crainte étoit mal fondée, que la foiblesse de la capitale faisoit alors sa sûreté contre les Magistrats qu’elle avoit dans son sein, qu’un Dictateur pouvoit en certains cas défendre la liberté publique sans jamais y pouvoir attenter, & que les fers de Rome ne seroient point forgés dans Rome même, mais dans ses armées : le peu de résistance que firent Marius à Sylla, & Pompée à César, montra bien ce qu’on pouvoit attendre de l’autorité du dedans contre la force du dehors.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '287'
        source_sequence: 540
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/299
        printed_page_end: '288'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-008-print
    translation_ja: 共和国の末期になると、用心深くなったローマ人は、昔気前よく使いすぎたのと同じくらい、理由もなく独裁官制を出し惜しみした。彼らの恐れには根拠がないことは、容易にわかった。当時は首都が弱かったからこそ、首都の内の行政官に対して安全だった。独裁官は場合によって公の自由を守れたが、それに手をかけることは決してできなかった。ローマを縛る鎖は、ローマそのものではなく、ローマの軍隊で鍛えられるはずだったからだ。マリウスがスッラに、ポンペイウスがカエサルにどれほどわずかしか抵抗できなかったかを見れば、外から来る力に対して、内の権威に何が期待できるか、よくわかる。
    translation_status: reviewed
  - id: rsc-b4-c06-009
    section_id: rsc-b4-c06
    kind: paragraph
    origin: source
    source_text: Cette erreur leur fit faire de grandes fautes. Telle, par exemple, fut celle de n’avoir pas nommé un Dictateur dans l’affaire de Catilina ; car comme il n’étoit question que du dedans de la ville, & tout au plus, de quelque province d’Italie, avec l’autorité sans bornes que les Loix donnoient au Dictateur il eut facilement dissipé la conjuration, qui ne fut étouffée que par un concours d’heureux hazards que jamais la prudence humaine ne devoit attendre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '288'
        source_sequence: 541
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/300
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-009-print
    translation_ja: この誤りは、彼らに大きな過ちを犯させた。たとえばカティリナ事件で独裁官を任命しなかったのがそうだ。問題になったのは市の内部と、せいぜいイタリアのどこか一つの地方だけであった。独裁官なら、法律の与える無制限の権威によって、陰謀をたやすく散らしただろう。この陰謀を鎮めたのは、いくつもの幸運がたまたま重なったからで、人間の思慮をもって当てにしてはならないようなものだった。
    translation_status: reviewed
  - id: rsc-b4-c06-010
    section_id: rsc-b4-c06
    kind: paragraph
    origin: source
    source_text: Au lieu de cela, le Sénat se contenta de remettre tout son pouvoir aux Consuls ; d’où il arriva que Ciceron, pour agir efficacement, fut contraint de passer ce pouvoir dans un point capital, & que, si les premiers transports de joye firent approuver sa conduite, ce fut avec justice que dans la suite on lui demanda compte du sang des Citoyens versé contre les loix ; reproche qu’on n’eut pu faire à un Dictateur. Mais l’éloquence du Consul entraîna tout ; & lui-même, quoique Romain, aimant mieux sa gloire que sa patrie, ne cherchoit pas tant le moyen le plus légitime & le plus sûr de sauver l’Etat, que celui d’avoir tout l’honneur de cette affaire. Aussi fut-il honoré justement comme libérateur de Rome, & justement puni comme infracteur des loix. Quelque brillant qu’ait été son rappel, il est certain que ce fut une grace.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '288'
        source_sequence: 542
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/300
        printed_page_end: '289'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-010-print
    translation_ja: ところが元老院は、すべての権力を執政官に預けただけだった。その結果、実効を上げるため、キケロは決定的な一点で、その権力を越えざるをえなくなった。最初の歓喜に人々はその行いを認めたものの、後になって、法に反して市民の血を流した責任を問うたのは正当だった。独裁官ならこの非難を浴びることはなかっただろう。だが執政官は弁舌ですべてを押し切った。キケロ自身もローマ人でありながら、祖国より自分の栄光を愛し、最も正当で確かな方法で国を救うより、その一件の名誉を一人で手にする方法を探していた。だからローマの解放者として名誉を与えられたのも、法を破った者として罰せられたのも、正当だった。華々しく呼び戻されたとしても、それが恩赦であったのは確かである。
    translation_status: reviewed
  - id: rsc-note-40-text
    section_id: rsc-b4-c06
    kind: note_body
    origin: source
    source_text: C’est ce dont il ne pouvoit se répondre en proposant un Dictateur, n’osant se nommer lui-même & ne pouvant s’assurer que son collegue le nommeroit.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '289'
        source_sequence: 543
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/301
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-40-text-print
    translation_ja: 独裁官を提案したら、その名誉が自分のものになるとは、保証できなかった。自分を任命するわけにはいかず、もう一人の執政官が自分を任命してくれる確証もなかったからだ。
    translation_status: reviewed
  - id: rsc-b4-c06-011
    section_id: rsc-b4-c06
    kind: paragraph
    origin: source
    source_text: Au reste, de quelque maniere que cette importante commission soit conférée, il importe d’en fixer la durée à un terme très court qui jamais ne puisse être prolongé ; dans les crises qui la font établir l’Etat est bientôt détruit ou sauvé, &, passé le besoin pressant, la Dictature devient tirannique ou vaine. A Rome les Dictateurs ne l’étant que pour six mois, la plupart abdiquerent avant ce terme. Si le terme eut été plus long, peut-être eussent-ils été tentés de le prolonger encore, comme firent les Décemvirs celui d’une année. Le Dictateur n’avoit que le tems de pourvoir au besoin qui l’avoit fait élire, il n’avoit pas celui de songer à d’autres projets.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '289'
        source_sequence: 544
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/301
        printed_page_end: '291'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c06-011-print
    translation_ja: いずれにせよ、この重大な委任をどのように与えるにせよ、その期間を短く定め、決して延ばせないようにすることが大切だ。これを設けるような危機では、国家はまもなく滅びるか、救われるかする。差し迫った必要が過ぎれば、独裁は圧制になるか、無意味になるかだ。ローマの独裁官の任期は六か月だけだったが、大半はそれより早く退いた。任期がもっと長ければ、十人委員が一年の任期を延ばしたように、さらに延ばしたい誘惑に駆られたかもしれない。独裁官には、自分が選ばれるに至った必要に応じるだけの時間しかなく、ほかの計画を考える時間はなかった。
    translation_status: reviewed
  - id: rsc-b4-c07-heading
    section_id: rsc-b4-c07
    kind: heading
    origin: source
    source_text: CHAPITRE VII.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '291'
        source_sequence: 545
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/303
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c07-heading-print
    translation_ja: 第七章
    translation_status: reviewed
  - id: rsc-b4-c07-title
    section_id: rsc-b4-c07
    kind: heading
    origin: source
    source_text: De la Censure.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '291'
        source_sequence: 546
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/303
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c07-title-print
    translation_ja: 風俗の監察について
    translation_status: reviewed
  - id: rsc-b4-c07-001
    section_id: rsc-b4-c07
    kind: paragraph
    origin: source
    source_text: De meme que la déclaration de la volonté générale se fait par la loi, la déclaration du jugement public se fait par la censure ; l’opinion publique est l’espece de loi dont le Censeur est le Ministre, & qu’il ne fait qu’appliquer aux cas particuliers, à l’exemple du Prince.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '291'
        source_sequence: 547
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/303
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c07-001-print
    translation_ja: 一般意志が法律によって宣言されるように、公の判断は監察によって宣言される。世論は一種の法であり、監察官はそれに仕える。統治者にならって、それを個別の事例にあてはめるだけである。
    translation_status: reviewed
  - id: rsc-b4-c07-002
    section_id: rsc-b4-c07
    kind: paragraph
    origin: source
    source_text: Loin donc que le tribunal censorial soit l’arbitre de l’opinion du peuple, il n’en est que le déclarateur, & sitôt qu’il s’en écarte, ses décisions sont vaines & sans effet.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '291'
        source_sequence: 548
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/303
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c07-002-print
    translation_ja: したがって、監察機関は人民の意見を決めるどころか、人民の意見を宣言するだけである。その意見から離れれば、決定は空しく、何の効力もない。
    translation_status: reviewed
  - id: rsc-b4-c07-003
    section_id: rsc-b4-c07
    kind: paragraph
    origin: source
    source_text: Il est inutile de distinguer les mœurs d’une nation des objets de son estime ; car tout cela tient au même principe & se confond nécessairement. Chez tous les peuples du monde, ce n’est point la nature mais l’opinion qui décide du choix de leurs plaisirs. Redressez les opinions des hommes & leurs mœurs s’épureront d’elles mêmes. On aime toujours ce qui est beau ou ce qu’on trouve tel, mais c’est sur ce jugement qu’on se trompe ; c’est donc ce jugement qu’il s’agit de regler. Qui juge des mœurs juge de l’honneur, & qui juge de l’honneur prend sa loi de l’opinion.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '291'
        source_sequence: 549
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/303
        printed_page_end: '292'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c07-003-print
    translation_ja: ある国の風俗と、その国が何を尊ぶかを、分けても無駄である。どちらも同じ原理に従い、必ず一つになるからだ。世界のどの人民も、何を楽しむかを決めるのは自然ではなく、意見である。人の意見を正せば、風俗はひとりでにきれいになる。美しいもの、あるいは美しいと見えるものは、つねに愛される。だが、その判断についてこそ、人は間違う。だから正さなければならないのは、その判断である。風俗について判断する者は名誉について判断し、名誉について判断する者は世論から法を受け取る。
    translation_status: reviewed
  - id: rsc-b4-c07-004
    section_id: rsc-b4-c07
    kind: paragraph
    origin: source
    source_text: Les opinions d’un peuple naissent de sa constitution ; quoique la loi ne regle pas les mœurs, c’est la législation qui les fait naitre ; quand la législation s’affoiblit les mœurs dégénerent, mais alors le jugement des Censeurs ne fera pas ce que la force des loix n’aura pas fait.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '292'
        source_sequence: 550
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/304
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c07-004-print
    translation_ja: 人民の意見はその体制から生まれる。法は風俗を定めないが、風俗を生み出すのは立法の仕組みである。立法が弱まると風俗は堕落する。そのとき、法の力でできなかったことが、監察官の判断でできるわけではない。
    translation_status: reviewed
  - id: rsc-b4-c07-005
    section_id: rsc-b4-c07
    kind: paragraph
    origin: source
    source_text: Il suit de-là que la Censure peut être utile pour conserver les mœurs, jamais pour les rétablir. Etablissez des Censeurs durant la vigueur des Loix ; sitôt qu’elles l’ont perdue, tout est désespéré ; rien de légitime n’a plus de force lorsque les loix n’en ont plus.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '292'
        source_sequence: 551
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/304
        printed_page_end: '293'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c07-005-print
    translation_ja: したがって、監察は風俗を守る役に立っても、立て直す役には決して立たない。法律の力が強いうちに監察官を立てよ。その力を失えば、もう望みはない。法律に力がないときには、正当なもののどれにも力はない。
    translation_status: reviewed
  - id: rsc-b4-c07-006
    section_id: rsc-b4-c07
    kind: paragraph
    origin: source
    source_text: La Censure maintient les mœurs en empêchant les opinions de se corrompre, en conservant leur droiture par de sages applications, quelquefois même en les fixant lorsqu’elles sont encore incertaines. L’usage des seconds dans les duels, porté jusqu’à la fureur dans le Royaume de France, y fut aboli par ces seuls mots d’un Edit du Roi ; quant à ceux qui ont la lâcheté d’appeller des Seconds. Ce jugement prevenant celui du public le détermina tout d’un coup. Mais quand les mêmes Edits voulurent prononcer que c’étoit aussi une lâcheté de se battre en duel ; ce qui est très-vrai, mais contraire à l’opinion commune ; le public se moqua de cette décision sur laquelle son jugement étoit déjà porté.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '293'
        source_sequence: 552
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/305
        printed_page_end: '294'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c07-006-print
    translation_ja: 監察は、意見が腐るのを防ぎ、賢く適用してその正しさを保ち、意見がまだ定まっていないときにはそれを定めることさえして、風俗を保つ。フランス王国で熱狂にまでなった、決闘に介添人を呼ぶならわしは、王の勅令のわずかな言葉で廃れた。「介添人を呼ぶほど臆病な者については」と書いたのである。この判断は世間の判断に先回りし、ただちにそれを決めた。ところが同じ勅令で、決闘すること自体も臆病だと言おうとしたら、世間はこの決定をあざ笑った。その判断はたいへん正しいが世間一般の意見に反し、世間の判断はすでに決まっていたからだ。
    translation_status: reviewed
  - id: rsc-b4-c07-007
    section_id: rsc-b4-c07
    kind: paragraph
    origin: source
    source_text: J’ai dit ailleurs que l’opinion publique n’étant point soumise à la contrainte, il n’en faloit aucun vestige dans le tribunal établi pour la représenter. On ne peut trop admirer avec quel art ce ressort, entierement perdu chez les modernes, étoit mis en œuvre chez les Romains & mieux chez les Lacédémoniens.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '294'
        source_sequence: 553
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/306
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c07-007-print
    translation_ja: 世論は強制されないので、それを代表するために設けた機関に、強制の影があってはならないと、別のところで述べた。近代ではすっかり失われたこの仕掛けが、ローマ人のもとでどんなに巧みに用いられ、スパルタ人のもとではさらに巧みに用いられたかには、いくら感嘆しても足りない。
    translation_status: reviewed
  - id: rsc-note-41-text
    section_id: rsc-b4-c07
    kind: note_body
    origin: source
    source_text: Je ne fais qu’indiquer dans ce chapitre ce que j’ai traité plus au long dans la Lettre à M. d’Alembert.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '294'
        source_sequence: 554
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/306
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-41-text-print
    translation_ja: この章では、私が『ダランベール氏への手紙』でより詳しく論じたことの要点を示すだけである。
    translation_status: reviewed
  - id: rsc-b4-c07-008
    section_id: rsc-b4-c07
    kind: paragraph
    origin: source
    source_text: 'Un homme de mauvaises mœurs ayant ouvert un bon avis dans le conseil de Sparte, les Ephores sans en tenir compte firent proposer le même avis par un Citoyen vertueux. Quel honneur pour l’un, quelle note pour l’autre, sans avoir donné ni louange ni blâme à aucun des deux ! Certains ivrognes de Samos souillerent le Tribunal des Ephores : le lendemain par Edit public il fut permis aux Samiens d’être des vilains. Un vrai châtiment eut été moins severe qu’une pareille impunité ? Quand Sparte a prononcé sur ce qui est ou n’est pas honnête, la Grèce n’appelle pas de ses jugemens.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '294'
        source_sequence: 555
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/306
        printed_page_end: '296'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c07-008-print
    translation_ja: 素行の悪い男がスパルタの評議会でよい案を出したとき、監督官はこれを取り上げず、徳ある市民に同じ案を出させた。一人にはなんという名誉、もう一人にはなんという不名誉だったことか。しかもどちらにも、ほめ言葉も非難も一つとして与えなかったのである。サモスの酔っぱらいたちが監督官の法廷を汚した。翌日、公の布告で、サモス人には卑劣であることが許された。実際に刑を科すほうが、こうして何の罰も与えないより軽かったのではないか。何がりっぱで、何がそうでないかをスパルタが言い渡せば、ギリシアはその判決に異議を申し立てなかった。
    translation_status: reviewed
  - id: rsc-b4-c08-heading
    section_id: rsc-b4-c08
    kind: heading
    origin: source
    source_text: CHAPITRE VIII.
    source_languages:
      - fr
    source_locations:

    source_text: Du peuple.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '92'
        source_sequence: 172
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/104
    source_alignment:
      - source_id: rey-amsterdam-1762

    translation_ja: 人民について
    translation_status: reviewed
  - id: rsc-b2-c08-001
    section_id: rsc-b2-c08
    kind: paragraph
    origin: source
    source_text: 'Comme avant d’élever un grand édifice l’architecte observe & sonde le sol, pour voir s’il en peut soutenir le poids, le sage instituteur ne commence pas par rédiger de bonnes loix elles-mêmes, mais il examine auparavant si le peuple auquel il les destine est propre à les supporter. C’est pour cela que Platon refusa de donner des loix aux Arcadiens & aux Cyréniens, sachant que ces deux peuples étoient riches & ne pouvoient souffrir l’égalité : c’est pour cela qu’on vit en Crete de bonnes loix & de méchans hommes, parce que Minos n’avoit discipliné qu’un peuple chargé de vices.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '92'
        source_sequence: 173
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/104
        printed_page_end: '93'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c08-001-print
    translation_ja: 建築家は大きな建物を建てる前に、地面を観察し、探って、その重さに耐えられるかを調べる。これと同じように、賢明な建国者は、まずよい法そのものを書き起こすのではなく、その法を与えようとする人民が、法を支えるのにふさわしいかを先に調べる。プラトンがアルカディア人とキュレネの人々に法を与えることを断ったのも、それゆえだ。二つの人民が富み、平等に耐えられないと知っていたのである。クレタ島で、よい法と悪い人間が並び立ったのもそれゆえだ。ミノスが秩序を与えたのは、すでに悪徳だらけの人民にすぎなかった。
    translation_status: reviewed
  - id: rsc-b2-c08-002
    section_id: rsc-b2-c08
    kind: paragraph
    origin: source
    source_text: Mille nations ont brillé sur la terre qui n’auroient jamais pu souffrir de bonnes loix, & celles mêmes qui l’auroient pu n’ont eu dans toute leur durée qu’un tems fort court pour cela. Les Peuples ainsi que les hommes ne sont dociles que dans leur jeunesse, ils deviennent incorrigibles en vieillissant ; quand une fois les coutumes sont établies & les préjugés enracinés, c’est une entreprise dangereuse & vaine de vouloir les réformer ; le peuple ne peut pas même souffrir qu’on touche à ses maux pour les détruire, semblable à ces malades stupides & sans courage qui frémissent à l’aspect du médecin.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '93'
        source_sequence: 174
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/105
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c08-002-print
    translation_ja: 地上で華々しく栄えながら、よい法には決して耐えられなかったであろう国々がいくらでもあった。耐えられたであろう国々でさえ、その長い歴史のうち、そうできた時期はほんのわずかである。人と同様、人民も若いうちだけ素直で、年を取ると手がつけられなくなる。慣習がひとたび固まり、偏見が根を下ろすと、これを改めようとするのは危険でむなしい事業だ。人民は、自分を苦しめるものを取り除くためでも、それに手を触れられることさえ我慢できない。医者を見ただけで震え上がる、分別も勇気もない病人と同じだ。
    translation_status: reviewed
  - id: rsc-b2-c08-003
    section_id: rsc-b2-c08
    kind: paragraph
    origin: source
    source_text: Ce n’est pas que, comme quelques maladies bouleversent la tête des hommes & leur ôtent le souvenir du passé, il ne se trouve quelquefois dans la durée des États des époques violentes où les révolutions font sur les peuples ce que certaines crises font sur les individus, où l’horreur du passé tient lieu d’oubli, & où l’Etat, embrasé par les guerres civiles, renait pour ainsi dire de sa cendre & reprend la vigueur de la jeunesse en sortant des bras de la mort. Telle fut Sparte au tems de Lycurgue, telle fut Rome après les Tarquins ; & telles ont été parmi nous la Hollande & la Suisse après l’expulsion des Tirans.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '93'
        source_sequence: 175
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/105
        printed_page_end: '94'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c08-003-print
    translation_ja: とはいえ、病気によって人は頭が混乱し、過去の記憶を失うことがあるように、国家の歴史にも、ときに激動の時代がある。革命は人民に対して、ある種の急病が個人に対してするのと同じ働きをする。過去への嫌悪が忘却の代わりをし、内戦の火に包まれた国家が、いわば灰からよみがえり、死の腕から逃れ出て若さの勢いを取り戻す。リュクルゴスの頃のスパルタ、タルクィニウス家の後のローマがそうだった。現在に近いところでは、暴君を追放したあとのオランダとスイスがそうだった。
    translation_status: reviewed
  - id: rsc-b2-c08-004
    section_id: rsc-b2-c08
    kind: paragraph
    origin: source
    source_text: 'Mais ces événemens sont rares ; ce sont des exceptions dont la raison se trouve toujours dans la constitution particuliere de l’Etat excepté. Elles ne sauroient même avoir lieu deux fois pour le même peuple, car il peut se rendre libre tant qu’il n’est que barbare, mais il ne le peut plus quand le ressort civil est usé. Alors les troubles peuvent le détruire sans que les révolutions puissent le rétablir, & sitôt que ses fers sont brisés, il tombe épars & n’existe plus : Il lui faut désormais un maitre & non pas un libérateur. Peuples libres, souvenez-vous de cette maxime : On peut acquérir la liberté ; mais on ne la recouvre jamais.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '94'
        source_sequence: 176
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/106
        printed_page_end: '95'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c08-004-print
    translation_ja: だが、これはまれである。どれも例外であり、その理由はつねに、例外になった国に特有の体制にある。同じ人民に二度起こることさえありえない。まだ野蛮であるだけなら、自由になることはできる。だが市民生活を支える力がすり減ったあとでは、もう自由になれない。すると騒乱は人民を滅ぼしうるのに、革命は人民を立て直せない。鎖が砕けたとたん、人民はばらばらになり、存在しなくなる。そのあと必要なのは、解放者ではなく主人だ。自由な人民よ、この格言を忘れるな。自由は手に入れられるが、いったん失えば二度と取り戻せない。
    translation_status: reviewed
  - id: rsc-b2-c08-005
    section_id: rsc-b2-c08
    kind: paragraph
    origin: source
    source_text: 'Il est pour les Nations comme pour les hommes un tems de maturité qu’il faut attendre avant de les soumettre à des loix ; mais la maturité d’un peuple n’est pas toujours facile à connoitre, & si on la prévient l’ouvrage est manqué. Tel peuple est disciplinable en naissant, tel autre ne l’est pas au bout de dix siecles. Les Russes ne seront jamais vraiment policés, parce qu’ils l’ont été trop tôt. Pierre avoit le génie imitatif ; il n’avoit pas le vrai génie, celui qui crée & fait tout de rien. Quelques unes des choses qu’il fit étoient bien, la plupart étoient déplacées. Il a vu que son peuple étoit barbare, il n’a point vu qu’il n’étoit pas mur pour la police ; il l’a voulu civiliser quand il ne faloit que l’agguerrir. Il a d’abord voulu faire des Allemands, des Anglois, quand il faloit commencer par faire des Russes ; il a empêché ses sujets de jamais devenir ce qu’ils pourroient être, en leur persuadant qu’ils étoient ce qu’ils ne sont pas. C’est ainsi qu’un Précepteur françois forme son éleve pour briller un moment dans son enfance, & puis n’être jamais rien. L’Empire de Russie voudra subjuguer l’Europe & sera subjugué lui-même. Les Tartares ses sujets ou ses voisins, deviendront ses maitres & les notres : Cette révolution me paroit infaillible. Tous les Rois de l’Europe travaillent de concert à l’accélérer.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '95'
        source_sequence: 177
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/107
        printed_page_end: '97'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c08-005-print
    translation_ja: 人々を法律に従わせる前に待たなくてはならない成熟期は、人間にも国々にもある。だが、人民がいつ成熟するかを知るのは、必ずしも容易でない。機が熟す前に始めれば、仕事は失敗する。生まれてすぐ規律を受け入れられる人民もあれば、十世紀を経ても受け入れられない人民もいる。ロシア人はあまりに早く文明化されたので、真の意味で文明化されることはないだろう。ピョートルには模倣の才があった。だが、無からすべてをつくり出す真の才能はなかった。彼のしたことのいくつかはよかったが、大半は場違いだった。彼には人民が野蛮なのは見えたが、まだ文明を受け入れるほど熟していないことは見えなかった。戦いに慣れさせればよいときに、文明化しようとしたのである。まずロシア人にしなければならないときに、最初からドイツ人、イギリス人にしようとした。臣民に、実際にはなっていないものにもうなったと信じ込ませ、やがてなりえたものになる道を永遠に塞いだ。フランスの家庭教師もこうして、生徒が子どものうちのひとときは目立つが、そのあとは何者にもならないように育てる。ロシア帝国はヨーロッパを征服しようとして、自身が征服されるであろう。ロシアの臣民か隣人であるタタール人が、彼らとわれわれの主人になる。この大変動は、私には避けられないように見える。ヨーロッパの王たちはみな足並みをそろえて、その到来を急がせようとしている。
    translation_status: reviewed

  - id: rsc-b3-c09-title
    section_id: rsc-b3-c09
    kind: heading
    origin: source
    source_text: Des signes d’un bon Gouvernement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '188'
        source_sequence: 338
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/200
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c09-title-print
    translation_ja: よい政府のしるし
    translation_status: reviewed
  - id: rsc-b3-c09-001
    section_id: rsc-b3-c09
    kind: paragraph
    origin: source
    source_text: Quand donc on demande absolument quel est le meilleur Gouvernement, on fait une question insoluble comme indéterminée ; ou si l’on veut, elle a autant de bonnes solutions qu’il y a de combinaisons possibles dans les positions absolues & rélatives des peuples.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '188'
        source_sequence: 339
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/200
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c09-001-print
    translation_ja: だから、いかなる場合にも最善の政府は何かと問うなら、それは何を問うかが定まらず、したがって解きようのない問いである。あるいは、人民のそれぞれの境遇や、互いの関係の組み合わせがありうるだけ、正しい答えもある、と言ってよい。
    translation_status: reviewed
  - id: rsc-b3-c09-002
    section_id: rsc-b3-c09
    kind: paragraph
    origin: source
    source_text: Mais si l’on demandoit à quel signe on peut connoitre qu’un peuple donné est bien ou mal gouverné, ce seroit autre chose, & la question de fait pourroit se résoudre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '188'
        source_sequence: 340
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/200
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c09-002-print
    translation_ja: だが、どんなしるしから、ある人民の治められ方がよいか悪いかがわかるか、と尋ねるなら、別の話である。事実についての問いなので、答えうるだろう。
    translation_status: reviewed
  - id: rsc-b3-c09-003
    section_id: rsc-b3-c09
    kind: paragraph
    origin: source
    source_text: Cependant on ne la résout point, parce que chacun veut la résoudre à sa maniere. Les sujets vantent la tranquillité publique, les Citoyens la liberté des particuliers ; l’un préfere la sureté des possessions, & l’autre celle des personnes ; l’un veut que le meilleur Gouvernement soit le plus sévère, l’autre soutient que c’est le plus doux ; celui-ci veut qu’on punisse les crimes, & celui-là qu’on les prévienne ; l’un trouve beau qu’on soit craint des voisins, l’autre aime mieux qu’on en soit ignoré ; l’un est content quand l’argent circule, l’autre exige que le peuple ait du pain. Quand-même on conviendroit sur ces points & d’autres semblables, en seroit-on plus avancé ? Les qualités morales manquant de mesure précise, fut-on d’accord sur le signe, comment l’être sur l’estimation ?
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '188'
        source_sequence: 341
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/200
        printed_page_end: '189'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c09-003-print
    translation_ja: それでも答えは出ていない。誰もが自分の流儀で答えようとするからだ。臣民は公の平穏を褒め、市民は個人の自由を褒める。一方は財産の安全を、もう一方は人の身の安全を大切にする。ある者は最も厳しい政府を最善とし、別の者は最も穏やかな政府だと言い張る。一方は犯罪を罰することを、他方は犯罪を防ぐことを望む。ある人は隣国に恐れられればすばらしいと思うが、別の人は隣国に知られないほうを好む。金が出回れば満足する人がいる一方、人民にパンがなくてはならないと求める人がいる。たとえこうした点や、それに類する点で一致したとして、どれほど先へ進むだろうか。人の行いにかかわる性質には正確な尺度がないのだから、しるしに同意したところで、そのしるしをどう評価するかについて、どうすれば一致できるのか。
    translation_status: reviewed
  - id: rsc-b3-c09-004
    section_id: rsc-b3-c09
    kind: paragraph
    origin: source
    source_text: 'Pour moi, je m’étonne toujours qu’on méconnoisse un signe aussi simple, ou qu’on ait la mauvaise foi de n’en pas convenir. Quelle est la fin de l’association politique ? C’est la conservation & la prospérité de ses membres. Et quel est le signe le plus sûr qu’ils se conservent & prospérent ? C’est leur nombre & leur population. N’allez donc pas chercher ailleurs ce signe si disputé. Toute chose d’ailleurs égale, le Gouvernement sous lequel, sans moyens étrangers sans naturalisations sans colonies les Citoyens peuplent & multiplient davantage, est infailliblement le meilleur : celui sous lequel un peuple diminue & dépérit est le pire. Calculateurs, c’est maintenant votre affaire ; comptez, mesurez, comparez.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '189'
        source_sequence: 342
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/201
        printed_page_end: '192'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c09-004-print
    translation_ja: 私はいつも驚く。これほど単純なしるしが見過ごされ、あるいは不誠実にも認められないとは。政治的な結合の目的は何か。構成員の生存と繁栄である。では、彼らが生き延び、繁栄していることを示す最も確かなしるしは何か。人の数と、人口の増加である。これほど議論されてきたしるしを、ほかに探しに行くことはない。ほかの条件が同じなら、外からの手段や帰化による人口増、植民なしに、市民がより多く子をもうけ、数を増やす政府が、間違いなく最善である。人民の数が減り、衰える政府は最悪だ。計算する人たちよ、今度はあなたがたの仕事だ。数え、測り、比べてみよ。
    translation_status: reviewed
  - id: rsc-note-23-text
    section_id: rsc-b3-c09
    kind: note_body
    origin: source
    source_text: On doit juger sur le même principe des siècles qui méritent la préférence pour la prospérité du genre humain. On a trop admiré ceux où l’on a vu fleurir les lettres & les arts, sans pénétrer l’objet secret de leur culture, sans en considérer le funeste effet, idque apud imperitos humanitas vocabatur, cum pars servitutis esset. Ne verrons-nous jamais dans les maximes des livres l’intérêt grossier qui fait parler les Auteurs ? Non, quoiqu’ils en puissent dire, quand malgré son éclat un pays se dépeuple, il n’est pas vrai que tout aille bien, & il ne suffit pas qu’un poëte ait cent mille livres de rente pour que son siecle soit le meilleur de tous. Il faut moins regarder au repos apparent, & à la tranquillité des chefs, qu’au bien être des nations entiéres & sur-tout des états les plus nombreux. La grêle désole quelques cantons, mais elle fait rarement disette. Les émeutes, les guerres civiles effarouchent beaucoup les chefs, mais elles ne font pas les vrais malheurs des peuples, qui peuvent même avoir du relâche tandis qu’on dispute à qui les tirannisera. C’est de leur état permanent que naissent leurs prospérités ou leurs calamités réelles ; quand tout reste écrasé sous le joug, c’est alors que tout dépérit ; c’est alors que les chefs les détruisant à leur aise, ubi solitudinem faciunt, pacem appellant. Quand les tracasseries des Grands agitoient le royaume de France, & que le Coadjuteur de Paris portoit au Parlement un poignard dans sa poche, cela n’empêchoit pas que le peuple François ne vécut heureux & nombreux dans une honnête & libre aisance. Autrefois la Grece fleurissoit au sein des plus cruelles guerres ; le sang y couloit à flots, & tout le pays étoit couvert d’hommes. Il sembloit, dit Machiavel, qu’au milieu des meurtres, des proscriptions, des guerres civiles, notre République en devint plus puissante ; la vertu de ses citoyens, leurs mœurs, leur indépendance avoient plus d’effet pour la renforcer, que toutes ses dissencions n’en avoient pour l’affoiblir. Un peu d’agitation donne du ressort aux ames, & ce qui fait vraiment prospérer l’espèce est moins la paix que la liberté.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '190'
        source_sequence: 343
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/202
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-23-text-print
    translation_ja: 人類が栄えた時代としてどの世紀を高く評価すべきかも、同じ原理から判断すべきだ。文芸と技芸が栄えた時代を、人々はあまりにたたえてきた。それらを育てた隠れた目的を見抜かず、有害な結果も考えなかった。「事情を知らない者は、それを文明と呼んだが、それは隷属の一部だったのに。」本に書かれた格言のうちに、著者にものを言わせるむき出しの利害を、われわれはいつまでも見抜けないのか。いや、著者が何と言おうと、華やかさにもかかわらず国の人口が減るなら、万事がうまくいっていることにはならない。また、一人の詩人に十万リーヴルもの年収があるというだけで、その世紀が最善になるわけではない。表面的な安らぎや長たちの平穏より、国全体、とりわけ人口の多い国々の人々の暮らしぶりを見るべきだ。雹がいくつかの地方を荒らしても、食糧難になることはめったにない。暴動や内戦は長たちを大いにおびえさせるが、人民に真の不幸をもたらすわけではない。誰が自分たちを虐げるかで争いが起こっているあいだに、人民は息をつけることさえある。人民にとって本当の繁栄も災いも、長く続く境遇から生まれる。すべてがくびきの下に押しつぶされているとき、すべてが衰える。長たちは心おきなく人々を滅ぼし、「荒れ地をつくって、それを平和と呼ぶ」のである。貴顕の争いがフランス王国を揺るがし、パリの大司教補佐が短剣をポケットに入れて高等法院に出た頃にも、フランスの人民は幸福で、数も多く、つつましく自由に、ゆとりを持って暮らしていた。昔のギリシアは、最も苛酷な戦争のただなかに栄えた。血は滝のように流れたのに、国土は人で満ちていた。「殺し合い、追放、内戦のただなかで、われらの共和国はかえって強くなったようである」とマキアヴェッリは言う。「市民の徳、風俗、独立心が共和国を強める力は、あらゆる不和が共和国を弱める力よりも大きかった。」多少の動揺は人々の心に活力を与える。人類を真に栄えさせるのは、平和というより自由である。
    translation_status: reviewed

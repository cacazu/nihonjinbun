    translation_status: reviewed
  - id: rsc-note-35-text
    section_id: rsc-b4-c04
    kind: note_body
    origin: source
    source_text: (c) Luceres.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '253'
        source_sequence: 483
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/265
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-35-text-print
    translation_ja: （c）ルケレス。
    translation_status: reviewed
  - id: rsc-b4-c04-006
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Il doubla aussi les trois anciennes centuries de Cavalerie & y en ajouta douze autres, mais toujours sous les anciens noms ; moyen simple & judicieux par lequel il acheva de distinguer le corps des Chevaliers de celui du Peuple, sans faire murmurer ce dernier.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '254'
        source_sequence: 484
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/266
        printed_page_end: '255'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-006-print
    translation_ja: また、彼は騎兵の古い三つのケントゥリアを二倍にし、さらに十二を加えたが、古くからの名称はそのままにした。こうして、人民に不平を言わせずに、騎士の団体を人民の団体から区別し終えた。簡単で賢明な手段だった。
    translation_status: reviewed
  - id: rsc-b4-c04-007
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: A ces quatre Tribus urbaines Servius en ajouta quinze autres appellées Tribus rustiques, parce qu’elles étoient formées des habitans de la campagne, partagés en autant de cantons. Dans la suite on en fit autant de nouvelles, & le Peuple romain se trouva enfin divisé en trente-cinq Tribus ; nombre auquel elles resterent fixées jusqu’à la fin de la République.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '255'
        source_sequence: 485
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/267
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-007-print
    translation_ja: 都市の四つのトリブスに加え、セルウィウスは、農村トリブスと呼ばれる十五をつくった。農村の住人を同じ数の地区に分けてつくったからである。後に同じ数が新たにつくられ、ローマの人民は最終的に三十五のトリブスに分けられた。この数は共和国の終わりまで変わらなかった。
    translation_status: reviewed
  - id: rsc-b4-c04-008
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: De cette distinction des Tribus de la Ville & des Tribus de la campagne resulta un effet digne d’être observé, parce qu’il n’y en a point d’autre exemple, & que Rome lui dût à la fois la conservation de ses mœurs & l’accroissement de son empire. On croiroit que les Tribus urbaines s’arrogerent bientôt la puissance & les honneurs, & ne tarderent pas d’avilir les Tribus rustiques ; ce fut tout le contraire. On connoit le goût des premiers Romains pour la vie champêtre. Ce goût leur venoit du sage instituteur qui unit à la liberté les travaux rustiques & militaires, & reléga pour ainsi dire à la ville les arts, les métiers, l’intrigue, la fortune & l’esclavage.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '255'
        source_sequence: 486
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/267
        printed_page_end: '256'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-008-print
    translation_ja: 都市トリブスと農村トリブスとの区別は、注目すべき結果を生んだ。ほかに例がなく、ローマが風俗を保ちながら領土を広げられたのも、この結果のおかげだったからだ。都市トリブスはまもなく権力と名誉を独り占めし、農村トリブスをおとしめたと思われるかもしれない。実際には正反対だった。初期のローマ人が田園生活を好んだのは、よく知られている。それは、自由を農耕や兵役と結びつけ、技芸、職人仕事、策謀、金もうけ、隷属を、いわば都市に追いやった賢明な建国者に始まる。
    translation_status: reviewed
  - id: rsc-b4-c04-009
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: 'Ainsi tout ce que Rome avoit d’illustre vivant aux champs & cultivant les terres, on s’accoutuma à ne chercher que là les soutiens de la République. Cet état étant celui des plus dignes Patriciens fut honoré de tout le monde : la vie simple & laborieuse des Villageois fut préférée à la vie oisive & lâche des Bourgeois de Rome, & tel n’eut été qu’un malheureux prolétaire à la ville, qui, laboureur aux champs, devint un Citoyen respecté. Ce n’est pas sans raison, disoit Varron, que nos magnanimes ancêtres établirent au Village la pépiniere de ces robustes & vaillans hommes qui les défendoient en tems de guerre & les nourrissoient en tems de paix. Pline dit positivement que les Tribus des champs étoient honorées à cause des hommes qui les composoient ; au lieu qu’on transferoit par ignominie dans celles de la Ville les lâches qu’on vouloit avilir. Le Sabin Appius Claudius étant venu s’établir à Rome y fut comblé d’honneurs & inscrit dans une Tribu rustique qui prit dans la suite le nom de sa famille. Enfin les affranchis entroient tous dans les Tribus urbaines, jamais dans les rurales ; & il n’y a pas durant toute la République un seul exemple d’aucun de ces affranchis parvenu à aucune magistrature, quoique devenu Citoyen.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '256'
        source_sequence: 487
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/268
        printed_page_end: '257'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-009-print
    translation_ja: そこでローマの名だたる人々はみな農村で暮らし、土地を耕したので、共和国を支える人を、農村だけに求める習わしができた。田園生活は最も尊敬される門閥の人々の暮らしだったので、誰からも重んじられた。村人の質素で勤勉な暮らしが、ローマの町人の怠惰で気力のない暮らしより好まれた。都市ではみじめな無産者にすぎなかったであろう者が、農村では耕作者として尊敬すべき市民となった。「われらの気高い祖先が村に、戦時には自分たちを守り、平時には自分たちを養う、あの丈夫で勇敢な人々の育つ苗床を設けたのも、理由のないことではない」とウァロは言った。プリニウスは、農村トリブスはその構成員のために尊ばれ、おとしめたい卑怯者は、恥を与えるために、都市トリブスへ移されたとはっきり述べる。サビニ人のアッピウス・クラウディウスは、ローマに移り住んだとき、数々の名誉を受け、後に彼の一族の名を取る農村トリブスに登録された。解放奴隷はすべて都市トリブスに属し、農村トリブスに入ることは決してなかった。共和国の全時代を通じて、解放奴隷が市民となっても、何らかの行政官の職に就いた例は一つもない。
    translation_status: reviewed
  - id: rsc-b4-c04-010
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Cette maxime étoit excellente ; mais elle fut poussée si loin, qu’il en résulta enfin un changement & certainement un abus dans la police.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '257'
        source_sequence: 488
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/269
        printed_page_end: '258'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-010-print
    translation_ja: この原則は優れたものだったが、あまりに行きすぎたので、ついには制度の変質を、しかも明らかな弊害を招いた。
    translation_status: reviewed
  - id: rsc-b4-c04-011
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Premierement, les Censeurs, après s’être arrogés longtems le droit de transférer arbitrairement les citoyens d’une Tribu à l’autre, permirent à la plupart de se faire inscrire dans celle qui leur plaisoit ; permission qui surement n’étoit bonne à rien, & ôtoit un des grands ressorts de la censure. De plus, les Grands & les puissans se faisant tous inscrire dans les Tribus de la campagne, & les affranchis devenus Citoyens restant avec la populace dans celles de la ville, les Tribus en général n’eurent plus de lieu ni de territoire ; mais toutes se trouverent tellement mêlées qu’on ne pouvoit plus discerner les membres de chacune que par les registres, en sorte que l’idée du mot Tribu passa ainsi du réel au personnel, ou plutôt, devint presque une chimere.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '258'
        source_sequence: 489
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/270
        printed_page_end: '259'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-011-print
    translation_ja: 第一に、監察官は、市民を勝手にあるトリブスから別のトリブスへ移す権利を、長いこと独占したあと、大半の市民に好きなトリブスに登録することを許した。この許可は確かに何の役にも立たず、監察を支える大きな手段を一つ奪った。さらに、有力者と権勢ある者はこぞって農村トリブスに登録し、市民となった解放奴隷は、雑多な人々とともに都市トリブスに残ったので、トリブスは全体として場所も領域も持たなくなった。どれもあまりに入り混じったため、どの組の成員かは、登録簿を見なければ区別できなかった。こうして、トリブスという言葉の意味は、土地に属するものから個人に属するものに移り、むしろほとんど架空のものになった。
    translation_status: reviewed
  - id: rsc-b4-c04-012
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Il arriva encore que les Tribus de la ville, étant plus à portée, se trouverent souvent les plus fortes dans les comices, & vendirent l’Etat à ceux qui daignoient acheter les suffrages de la canaille qui les composoit.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '259'
        source_sequence: 490
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/271
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-012-print
    translation_ja: さらに、都市トリブスは会場に近いので、しばしば民会で最も強くなり、その構成員である下層の人々の票を買おうという者に、国家を売り渡した。
    translation_status: reviewed
  - id: rsc-b4-c04-013
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: A l’égard des Curies, l’instituteur en ayant fait dix en chaque Tribu, tout le peuple romain alors renfermé dans les murs de la ville se trouva composé de trente Curies, dont chacune avoit ses temples ses Dieux ses officiers ses prêtres, & ses fêtes appellées compitalia, semblables aux Paganalia qu’eurent dans la suite les Tribus rustiques.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '259'
        source_sequence: 491
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/271
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-013-print
    translation_ja: クリアに関しては、建国者が各トリブスに十ずつ設けたので、当時すべて都市の城壁内にいたローマの人民は、三十のクリアから成ることになった。それぞれに神殿、神々、役人、祭司があり、後の農村トリブスのパガナリアと似た、コンピタリアという祭りがあった。
    translation_status: reviewed
  - id: rsc-b4-c04-014
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: 'Au nouveau partage de Servius ce nombre de trente ne pouvant se répartir également, dans ses quatre Tribus, il n’y voulut point toucher, & les Curies indépendantes des Tribus devinrent une autre division des habitans de Rome : Mais il ne fut point question de Curies ni dans les Tribus rustiques ni dans le peuple qui les composoit, parce que les Tribus étant devenues un établissement purement civil, & une autre police ayant été introduite pour la levée des troupes, les divisions militaires de Romulus se trouverent superflues. Ainsi, quoique tout Citoyen fut inscrit dans une Tribu, il s’en faloit de beaucoup que chacun ne le fut dans une Curie.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '259'
        source_sequence: 492
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/271
        printed_page_end: '260'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-014-print
    translation_ja: セルウィウスの区分では、三十を四つのトリブスに等しく分けられなかったので、彼はそこに手をつけなかった。トリブスから切り離されたクリアは、ローマの住人のもう一つの区分になった。だが、農村トリブスにも、これを構成する人民にも、クリアは設けられなかった。トリブスは純粋に民事の制度となり、兵の召集には別の制度が導入されたため、ロムルスによる軍事上の区分は余分になったからだ。ゆえに、どの市民もトリブスには登録されたとはいえ、全員がクリアに登録されたわけでは、とてもなかった。
    translation_status: reviewed
  - id: rsc-b4-c04-015
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: 'Servius fit encore une troisieme division qui n’avoit aucun rapport aux deux précédentes, & devint par ses effets la plus importante de toutes. Il distribua tout le peuple romain en six classes, qu’il ne distingua ni par le lieu ni par les hommes, mais par les biens : En sorte que les premieres classes étoient remplies par les riches, les dernieres par les pauvres, & les moyennes par ceux qui jouïssoient d’une fortune médiocre. Ces six classes étoient subdivisées en 193 autres corps appellés centuries, & ces corps étoient tellement distribués que la premiere Classe en comprenoit seule plus de la moitié, & la derniere n’en formoit qu’un seul. Il se trouva ainsi que la Classe la moins nombreuse en hommes l’étoit le plus en centuries, & que la derniere classe entiere n’étoit comptée que pour une subdivision, bien qu’elle contint seule plus de la moitié des habitans de Rome.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '260'
        source_sequence: 493
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/272
        printed_page_end: '261'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-015-print
    translation_ja: セルウィウスは、前の二つとは無関係な第三の区分もつくった。その結果から見れば、これが最も重要だった。ローマの全人民を六つの階級に分け、住む場所や人の出自でなく、財産によって区別した。上の階級には富者、下には貧者、中ほどにはほどほどの財産を持つ者が入った。この六階級は、さらにケントゥリアと呼ばれる百九十三の団体に分けられた。団体の配分は、第一の階級だけでその半数を超え、最後の階級は一団体しかつくらない、というものだった。こうして最も人数の少ない階級が、ケントゥリアの数では最も多く、最後の階級はそれだけでローマの住人の半数を超えながら、ただ一つの区分にしか数えられなかった。
    translation_status: reviewed
  - id: rsc-b4-c04-016
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: 'Afin que le peuple penétrât moins les conséquences de cette derniere forme, Servius affecta de lui donner un air militaire : il insera dans la seconde classe deux centuries d’armuriers, & deux d’instrumens de guerre dans la quatrieme : Dans chaque Classe, excepté la derniere, il distinga les jeunes & les vieux, c’est-à-dire ceux qui étoient obligés de porter les armes, & ceux que leur âge en exemptoit par les loix ; distinction qui plus que celle des biens produisit la nécessité de recommencer souvent le cens ou denombrement : Enfin il voulut que l’assemblée se tint au champ de Mars, & que tous ceux qui étoient en âge de servir y vinssent avec leurs armes.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '261'
        source_sequence: 494
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/273
        printed_page_end: '262'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-016-print
    translation_ja: この最後の区分の結果を人民に悟られにくくするため、セルウィウスは、わざと軍の編成らしい外見を与えた。第二の階級には武具職人のケントゥリアを二つ、第四の階級には軍楽器を扱うケントゥリアを二つ組み込んだ。最下層を除く各階級では、若者と年長者、すなわち兵役に就く義務がある者と、年齢により法律で義務を免除された者とを分けた。この区別は、財産の区別よりも、しばしば市民調査、つまり人口の数え直しをする必要を生んだ。最後に、集会はマルスの野で開き、兵役の年齢にある者は全員、武器を携えて来ることにした。
    translation_status: reviewed
  - id: rsc-b4-c04-017
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: La raison pour laquelle il ne suivit pas dans la derniere classe cette même division des jeunes & des vieux, c’est qu’on n’accordoit point à la populace dont elle étoit composée l’honneur de porter les armes pour la patrie ; il faloit avoir des foyers pour obtenir le droit de les défendre, & de ces innombrables troupes de gueux dont brillent aujourd’hui les armées des Rois, il n’y en a pas un, peut-être, qui n’eut été chassé avec dédain d’une cohorte romaine, quand les soldats étoient les défenseurs de la liberté.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '262'
        source_sequence: 495
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/274
        printed_page_end: '263'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-017-print
    translation_ja: 最下層では同じように若者と年長者を分けなかった。その階級を成す下層の人々には、祖国のために武器を取る名誉が認められなかったからだ。自分の家を持たなければ、それを守る権利は得られなかった。今日の王たちの軍隊が華やかに見えるのは、数知れない貧民の群れのおかげだが、兵士が自由を守っていたころのローマの歩兵隊なら、蔑まれて追い出されない者は、おそらく一人もいないだろう。
    translation_status: reviewed
  - id: rsc-b4-c04-018
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: On distinga pourtant encore dans la derniere classe les prolétaires de ceux qu’on appelloit capite censi. Les premiers, non tout à fait réduits à rien, donnoient au moins des Citoyens à l’Etat, quelquefois même des soldats dans les besoins pressans. Pour ceux qui n’avoient rien du tout & qu’on ne pouvoit dénombrer que par leurs têtes, ils étoient tout à fait regardés comme nuls, & Marius fut le premier qui daigna les enroller.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '263'
        source_sequence: 496
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/275
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-018-print
    translation_ja: とはいえ最下層のなかでも、プロレタリイと、カピテ・ケンシと呼ばれた者とは区別された。前者は何もかも失ったわけではなく、少なくとも国家に市民を、差し迫ったときには時に兵士までも供給した。まったく何も持たず、頭数でしか数えられなかった人々は、まったく取るに足らないと見なされた。彼らを募って軍に入れようとした最初の人はマリウスだった。
    translation_status: reviewed
  - id: rsc-b4-c04-019
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Sans décider ici si ce troisieme denombrement étoit bon ou mauvais en lui-même, je crois pouvoir affirmer qu’il n’y avoit que les mœurs simples des premiers Romains, leur désintéressement, leur goût pour l’agriculture, leur mépris pour le commerce & pour l’ardeur du gain, qui pussent le rendre praticable. Où est le peuple moderne chez lequel la dévorante avidité, l’esprit inquiet, l’intrigue, les déplacemens continuels, les perpétuelles révolutions des fortunes pussent laisser durer vingt ans un pareil établissement sans bouleverser tout l’Etat ? Il faut même bien remarquer que les mœurs & la censure plus fortes que cette institution en corrigerent le vice à Rome, & que tel riche se vit relegué dans la classe des pauvres, pour avoir trop étalé sa richesse.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '263'
        source_sequence: 497
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/275
        printed_page_end: '264'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-019-print
    translation_ja: この第三の人口調査の仕組みがそれ自体よいか悪いかは、ここでは決めない。ただ、質素な風俗、私欲のなさ、農耕を好み、貿易や金もうけへの熱を低く見る、初期のローマ人にしか、この制度は実行できなかったと断言してよいと思う。欲が何でも食い尽くし、気が休まらず、策謀があり、人は絶えず住む場所を変え、財産はひっきりなしに持ち主を替える。そんな近代の人民のどこで、国家全体をひっくり返さずに、こんな制度を二十年も続けられるのか。さらに、ローマでは風俗と監察がこの制度より強く、制度の欠点を直したことに注意すべきである。富を見せびらかしすぎたために、貧しい階級へ移された富者もいた。
    translation_status: reviewed
  - id: rsc-b4-c04-020
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: De tout ceci l’on peut comprendre aisément pourquoi il n’est presque jamais fait mention que de cinq classes, quoiqu’il y en eut réellement six. La sixieme, ne fournissant ni soldats à l’armée ni votans au champ de Mars & n’étant presque d’aucun usage dans la République, étoit rarement comptée pour quelque chose.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '264'
        source_sequence: 498
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/276
        printed_page_end: '265'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-020-print
    translation_ja: こう考えれば、実際は六階級だったのに、五階級としか言われないことが多い理由は、たやすくわかる。第六の階級からは軍に兵士も出ず、マルスの野に投票者も出ず、共和国でほとんど役割がなかったので、何かの数に入れられることがめったになかった。
    translation_status: reviewed
  - id: rsc-note-36-text
    section_id: rsc-b4-c04
    kind: note_body
    origin: source
    source_text: Je dis au champ de mars, parce que c’étoit là que s’assembloient les Comices par centuries ; dans les deux autres formes le peuple s’assembloit au forum ou ailleurs, & alors les Capite censi avoient autant d’influence & d’autorité que les premiers Citoyens.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '264'
        source_sequence: 499
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/276
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-36-text-print
    translation_ja: マルスの野で、と私が言うのは、ケントゥリア民会がそこに集まっていたからだ。ほかの二つの形では、人民はフォルムや別のところに集まった。そのときカピテ・ケンシは、第一級の市民と同じだけの影響と権威を持った。
    translation_status: reviewed
  - id: rsc-b4-c04-021
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: 'Telles furent les différentes divisions du peuple Romain. Voyons à présent l’effet qu’elles produisoient dans les assemblées. Ces assemblées légitimement convoquées s’appelloient Comices ; elles se tenoient ordinairement dans la place de Rome ou au champ de Mars, & se distingoient en comices par Curies, Comices par Centuries, & Comices par Tribus, selon celle de ces trois formes sur laquelle elles étaient ordonnées : les comices par Curies étoient de l’institution de Romulus, ceux par Centuries de Servius, ceux par Tribus des Tribuns du peuple. Aucune loi ne recevoit la sanction, aucun magistrat n’étoit élu que dans les Comices, & comme il n’y avoit aucun Citoyen qui ne fut inscrit dans une Curie, dans une Centurie, ou dans une Tribu, il s’ensuit qu’aucun Citoyen n’étoit exclud du droit de suffrage, & que le Peuple Romain étoit véritablement Souverain de droit & de fait.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '265'
        source_sequence: 500
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/277
        printed_page_end: '266'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-021-print
    translation_ja: これがローマの人民を分けるさまざまな区分だった。さて、集会でどんな結果を生んだかを見よう。正当に召集された集会は民会と呼ばれ、たいていローマの広場かマルスの野で開かれた。三つの形のどれに従って組織されたかによって、クリア民会、ケントゥリア民会、トリブス民会に分けられた。クリア民会はロムルスの、ケントゥリア民会はセルウィウスの、トリブス民会は護民官たちの設けたものだった。法が承認され、行政官が選ばれるのは、民会においてだけである。どの市民も、クリア、ケントゥリア、トリブスのいずれかに登録されたので、投票する権利から除外された市民は一人もおらず、ローマの人民は、権利でも事実でも、真に主権者だった。
    translation_status: reviewed
  - id: rsc-b4-c04-022
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: 'Pour que les Comices fussent légitimement assemblés & que ce qui s’y faisoit eut force de loi il faloit trois conditions : la premiere que le corps ou le Magistrat qui les convoquoit fut revêtu pour cela de l’autorité nécessaire ; la seconde que l’assemblée se fit un des jours permis par la loi ; la troisieme que les augures fussent favorables.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '266'
        source_sequence: 501
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/278
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-022-print
    translation_ja: 民会が正当に開かれ、そこでなされたことが法律の力を持つには、三つの条件が必要だった。第一に、それを召集する団体または行政官が、そのための権威を備えていること。第二に、法律が許した日の一つに集会を開くこと。第三に、占いの兆しがよいことである。
    translation_status: reviewed
  - id: rsc-b4-c04-023
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: La raison du premier reglement n’a pas besoin d’être expliquée. Le second est une affaire de police ; ainsi il n’étoit pas permis de tenir les Comices les jours de férie & de marché, où les gens de la campagne venant à Rome pour leurs affaires n’avoient pas le tems de passer la journée dans la place publique. Par le troisieme le Sénat tenoit en bride un peuple fier & remuant, & tempéroit à propos l’ardeur des Tribuns séditieux ; mais ceux-ci trouverent plus d’un moyen de se délivrer de cette gêne.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '266'
        source_sequence: 502
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/278
        printed_page_end: '267'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-023-print
    translation_ja: 第一の規則の理由は、説明するまでもない。第二は、秩序を保つためである。したがって、祭日や市の立つ日に民会を開くことは許されなかった。用事でローマへやって来る農村の住人には、一日を公の広場で過ごす時間がないからだ。第三の規則によって元老院は、誇り高く騒がしい人民を抑え、反乱をあおる護民官たちの熱を、折を見て冷ました。だが護民官たちは、この窮屈さから逃れる方法をいくつも見いだした。
    translation_status: reviewed
  - id: rsc-b4-c04-024
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: 'Les loix & l’élection des chefs n’étoient pas les seuls points soumis au jugement des Comices : Le Peuple romain ayant usurpé les plus importantes fonctions du Gouvernement, on peut dire que le sort de l’Europe étoit réglé dans ses assemblées. Cette variété d’objets donnoit lieu aux diverses formes que prenoient ces assemblées selon les matieres sur lesquelles il avoit à prononcer.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '267'
        source_sequence: 503
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/279
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-024-print
    translation_ja: 法律と長の選挙だけが、民会の判断に委ねられたわけではなかった。ローマの人民は政府の最も重要な働きを奪っていたので、その集会でヨーロッパの行く末が決まったと言ってよい。このように扱う事柄が多様だったため、判断すべき事柄に応じて、集会の形もさまざまになった。
    translation_status: reviewed
  - id: rsc-b4-c04-025
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Pour juger de ces diverses formes il suffit de les comparer. Romulus en instituant les Curies avoit en vue de contenir le Sénat par le peuple & le Peuple par le Sénat, en dominant également sur tous. Il donna donc au peuple par cette forme toute l’autorité du nombre pour balancer celle de la puissance & des richesses qu’il laissoit aux Patriciens. Mais selon l’esprit de la Monarchie, il laissa cependant plus d’avantage aux Patriciens par l’influence de leurs Cliens sur la pluralité des suffrages. Cette admirable institution des Patrons & des Cliens fut un chef-d’œuvre de politique & d’humanité, sans lequel le Patriciat, si contraire à l’esprit de la République, n’eut pu subsister. Rome seule a eu l’honneur de donner au monde ce bel exemple, duquel il ne résulta jamais d’abus, & qui pourtant n’a jamais été suivi.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '267'
        source_sequence: 504
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/279
        printed_page_end: '268'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-025-print
    translation_ja: これらの形を評価するには、互いに比べるだけでよい。ロムルスがクリアを設けたのは、人民によって元老院を抑え、元老院によって人民を抑えながら、どちらにも等しく君臨しようとしたからだ。そこでこの形により、門閥に残した権勢と富の権威と釣り合うよう、数の力をすべて人民に与えた。しかし君主政の精神に従い、庇護下の人々の票が多数決に及ぼす影響を通じて、門閥には、より大きな有利さを残した。庇護者と被庇護者のこの見事な制度は、政治と人間愛の傑作だった。これがなければ、共和国の精神にこれほど反する門閥制度は存続できなかっただろう。ローマだけが世界にこの見事な実例を示した名誉を持つ。そこから弊害は一つも生まれなかったのに、これにならった国はない。
    translation_status: reviewed
  - id: rsc-b4-c04-026
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Cette même forme des Curies ayant subsisté sous les Rois jusqu’à Servius, & le regne du dernier Tarquin n’étant point compté pour légitime, cela fit distinguer généralement les loix royales par le nom de leges curiatæ.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '268'
        source_sequence: 505
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/280
        printed_page_end: '269'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-026-print
    translation_ja: このクリアの形が、王たちのもとでセルウィウスまで続き、最後のタルクィニウスの治世が正当とは数えられなかったため、王の法は一般に「クリアの法」として区別された。
    translation_status: reviewed
  - id: rsc-b4-c04-027
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Sous la République les Curies, toujours bornées aux quatre Tribus urbaines, & ne contenant plus que la populace de Rome, ne pouvoient convenir ni au Sénat qui étoit à la tête des Patriciens, ni aux Tribuns qui, quoique plebeyens, étoient à la tête des Citoyens aisés. Elles tomberent donc dans le discrédit, & leur avilissement fut tel, que leurs trente Licteurs assemblés faisoient ce que les comices par Curies auroient dû faire.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '269'
        source_sequence: 506
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/281
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-027-print
    translation_ja: 共和国のもとでは、クリアは依然として都市の四トリブスに限られ、もはやローマの下層の人々しか含まなかった。そのため、門閥を率いる元老院の役にも、平民の出ではあっても裕福な市民を率いる護民官の役にも立たなかった。こうして信用を失い、その地位はあまりにも低くなって、三十人の衛士が集まり、クリア民会がするはずだったことを行うようになった。
    translation_status: reviewed
  - id: rsc-b4-c04-028
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: La division par Centuries étoit si favorable à l’Aristocratie, qu’on ne voit pas d’abord comment le Sénat ne l’emportoit pas toujours dans les Comices qui portoient ce nom, & par lesquels étoient élus les Consuls, les Censeurs, & les autres Magistrats curules. En effet de cent quatre-vingt-treize centuries qui formoient les six Classes de tout le Peuple romain, la premiere Classe en comprenant quatre vingt dix huit, & les voix ne se comptant que par Centuries, cette seule premiere Classe l’emportoit en nombre de voix sur toutes les autres. Quand toutes ses Centuries étoient d’accord on ne continuoit pas même à recueillir les suffrages ; ce qu’avoit décidé le plus petit nombre passoit pour une décision de la multitude, & l’on peut dire que dans les Comices par Centuries les affaires se regloient à la pluralité des écus bien plus qu’à celle des voix.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '269'
        source_sequence: 507
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/281
        printed_page_end: '270'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-028-print
    translation_ja: ケントゥリアによる区分は貴族政にこれほど有利だったので、この名を持ち、執政官、監察官、その他の上級行政官を選んだ民会で、元老院がなぜつねに優位を占めなかったか、初めにはわからない。たしかに、ローマの全人民を六階級に分けた百九十三のケントゥリアのうち、第一の階級には九十八があり、票はケントゥリアごとにしか数えられなかったので、この第一の階級だけで、ほかのすべてより票が多かった。第一の階級のすべてのケントゥリアの意見が一致すれば、投票を続けて集めさえしなかった。少人数が決めたことが、大多数の決定として通ったのだ。ケントゥリア民会では、票の多数よりも財布の金の多数によって物事が決まった、と言ってよい。
    translation_status: reviewed
  - id: rsc-b4-c04-029
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Mais cette extrême autorité se tempéroit par deux moyens. Premierement les Tribuns pour l’ordinaire, & toujours un grand nombre de Plebeyens, étant dans la classe des riches balançoient le crédit des Patriciens dans cette premiere classe.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '270'
        source_sequence: 508
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/282
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-029-print
    translation_ja: しかし、この並外れた権威は二つの方法で抑えられた。第一に、ふつう護民官は富裕な階級に属し、また多くの平民がつねにこの階級にいた。そのため第一の階級のなかで、彼らは門閥の影響と釣り合った。
    translation_status: reviewed
  - id: rsc-b4-c04-030
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Le second moyen consistoit en ceci, qu’au lieu de faire d’abord voter les Centuries selon leur ordre, ce qui auroit toujours fait commencer par la premiere, on en tiroit une au sort, & celle-là procédoit seule à l’élection ; après quoi toutes les Centuries appellées un autre jour selon leur rang répétoient la même élection & la confirmoit ordinairement. On ôtoit ainsi l’autorité de l’exemple au rang pour la donner au sort selon le principe de la Démocratie.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '270'
        source_sequence: 509
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/282
        printed_page_end: '271'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-030-print
    translation_ja: 第二の方法は、まずケントゥリアを順に投票させれば、いつも初めの階級からになってしまうので、一つをくじで引き、そのケントゥリアだけで選挙を行うことであった。そのあと、別の日にすべてのケントゥリアを順位に従って呼び、同じ選挙を繰り返して、ふつうは結果を承認した。こうして、民主政の原理に従い、最初の例が後に及ぼす権威を、順位から取り上げ、くじに与えたのである。
    translation_status: reviewed
  - id: rsc-note-37-text
    section_id: rsc-b4-c04
    kind: note_body
    origin: source
    source_text: Cette centurie ainsi tirée au sort s’appelloit præ rogativa, à cause qu’elle étoit la premiere à qui l’on demandoit son suffrage, & c’est delà qu’est venu le mot de prérogative.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '271'
        source_sequence: 510
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/283
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-37-text-print
    translation_ja: このようにくじで選ばれたケントゥリアは、真っ先に票を求められるので、プラエロガティワと呼ばれた。「特権（プレロガティヴ）」という語はここから来ている。
    translation_status: reviewed
  - id: rsc-b4-c04-031
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Il resultoit de cet usage un autre avantage encore ; c’est que les Citoyens de la campagne avoient le tems entre les deux élections de s’informer du mérite du Candidat provisionnellement nommé, afin de ne donner leur voix qu’avec connoissance de cause. Mais sous prétexte de célérité l’on vint à bout d’abolir cet usage, & les deux élections se firent le même jour.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '271'
        source_sequence: 511
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/283
        printed_page_end: '272'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-031-print
    translation_ja: この慣行には、もう一つ利点があった。農村の市民には、二度の選挙のあいだに、いったん選ばれた候補の力量を調べる時間があり、事情を知ったうえで票を投じられた。だが、速さを口実に、ついにはこの慣行が廃止され、二度の選挙は同じ日に行われた。
    translation_status: reviewed
  - id: rsc-b4-c04-032
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Les Comices par Tribus étoient proprement le Conseil du peuple romain. Ils ne se convoquoient que par les Tribuns ; les Tribuns y étoient élus & y passoient leurs plebiscites. Non seulement le Sénat n’y avoit point de rang, il n’avoit pas même le droit d’y assister, & forcés d’obéir à des loix sur lesquelles ils n’avoient pû vôter, les Sénateurs à cet égard étoient moins libres que les derniers Citoyens. Cette injustice étoit tout-à-fait mal entendue, & suffisoit seule pour invalider les décrets d’un corps où tous ses membres n’étoient pas admis. Quand tous les Patriciens eussent assisté à ces Comices selon le droit qu’ils en avoient comme Citoyens, devenus alors simples particuliers ils n’eussent guere influé sur une forme de suffrages qui se recueilloient par tête, & où le moindre prolétaire pouvoit autant que le Prince du Sénat.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '272'
        source_sequence: 512
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/284
        printed_page_end: '273'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-032-print
    translation_ja: トリブス民会は、まさにローマの人民の評議会だった。召集するのは護民官だけであり、そこで護民官が選ばれ、平民の決議が通った。元老院にはそこに地位がないだけでなく、出席する権利すらなかった。票を投じられなかった法に従わざるをえないので、元老たちはこの点で、最も地位の低い市民よりも自由がなかった。この不公正は、まったく思慮を欠いていたし、その団体に属する者がすべて受け入れられないのだから、その団体の決議を無効にするに足りた。とはいえ、すべての門閥の人々が、市民として持つ権利に従って民会に出席したとしても、彼らもその場で普通の個人になる。票が一人ずつ集められ、ごく貧しいプロレタリイも元老院の首席と同じ力を持つところでは、さほど影響できなかっただろう。
    translation_status: reviewed
  - id: rsc-b4-c04-033
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: On voit donc qu’outre l’ordre qui résultoit de ces diverses distributions pour le recueillement des suffrages d’un si grand Peuple, ces distributions ne se réduisoient pas à des formes indifférentes en elles-mêmes, mais que chacune avoit des effets rélatifs aux vues qui la faisoient préférer.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '273'
        source_sequence: 513
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/285
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-033-print
    translation_ja: だから、これらの区分は、これほど大きな人民の票を集めるために秩序を与えるだけではなかった。どれを選んでもかまわない単なる形式ではなく、それぞれを選ばせた目的に応じて、それぞれ異なる結果を生んだのである。
    translation_status: reviewed
  - id: rsc-b4-c04-034
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Sans entrer là dessus en de plus longs détails, il résulte des éclaircissemens précédens que les Comices par Tribus étoient les plus favorables au Gouvernement populaire, & les Comices par Centuries à l’Aristocratie. A l’égard des Comices par Curies où la seule populace de Rome formoit la pluralité, comme ils n’étoient bons qu’à favoriser la tirannie & les mauvais desseins, ils durent tomber dans le décri, les séditieux eux-mêmes s’abstenant d’un moyen qui mettoit trop à découvert leurs projets. Il est certain que toute la majesté du Peuple Romain ne se trouvoit que dans les Comices par Centuries, qui seuls étoient complets ; attendu que dans les Comices par Curies manquoient les Tribus rustiques, & dans les Comices par Tribus le Sénat & les Patriciens.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '273'
        source_sequence: 514
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/285
        printed_page_end: '274'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-034-print
    translation_ja: これ以上立ち入らなくても、以上の説明から、トリブス民会は人民による政府に、ケントゥリア民会は貴族政に、最も有利だったとわかる。ローマの下層の人々だけで多数を占めたクリア民会は、専制や悪い企てを助ける以外には役に立たなかったので、評判を失って当然だった。反乱を望む者さえ、自分たちのもくろみがあまりにも見えすいてしまうので、この手段の利用を控えた。ローマの人民の威厳がすべて現れたのは、ケントゥリア民会だけだったことは確かだ。それだけが完全だったからである。クリア民会には農村トリブスが、トリブス民会には元老院と門閥が欠けていた。
    translation_status: reviewed
  - id: rsc-b4-c04-035
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Quant à la maniere de recueillir les suffrages, elle étoit chez les premiers Romains aussi simple que leurs mœurs, quoique moins simple encore qu’à Sparte. Chacun donnoit son suffrage à haute voix, un Greffier les écrivoit à mésure ; pluralité de voix dans chaque Tribu déterminoit le suffrage de la Tribu, pluralité des voix entre les Tribus déterminoit le suffrage du peuple, & ainsi des Curies & des Centuries. Cet usage étoit bon tant que l’honnêteté régnoit entre les Citoyens & que chacun avoit honte de donner publiquement son suffrage à un avis injuste ou à un sujet indigne ; mais quand le peuple se corrompit & qu’on acheta les voix, il convint qu’elles se donnassent en secret pour contenir les acheteurs par la défiance, & fournir aux fripons le moyen de n’être pas des traitres.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '274'
        source_sequence: 515
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/286
        printed_page_end: '275'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-035-print
    translation_ja: 票を集める方法は、初期のローマ人のもとでは、スパルタほどではないにしても、風俗に劣らず素朴だった。各人は大声で票を述べ、そのつど書記が書きとめた。各トリブスのなかでの多数が、そのトリブスの票を決め、トリブス間での多数が人民の票を決めた。クリアとケントゥリアでも同じだった。市民のあいだに正直さが支配し、不正な案やふさわしくない人物に公然と票を投じるのを、みなが恥じていた間は、これでうまくいった。だが人民が腐り、票が買われるようになると、秘密投票がふさわしくなった。票を買う者は、買った票が入るかどうか不確かなので抑えられ、不正に手を染めた者にも裏切り者にならずにすむ道が開かれるからだ。
    translation_status: reviewed
  - id: rsc-b4-c04-036
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Je sais que Ciceron blâme ce changement & lui attribue en partie la ruine de la République. Mais quoi que je sente le poids que doit avoir ici l’autorité de Ciceron, je ne puis être de son avis. Je pense, au contraire, que pour n’avoir pas fait assez de changemens semblables on accélera la perte de l’Etat. Comme le régime des gens sains n’est pas propre aux malades, il ne faut pas vouloir gouverner un peuple corrompu par les mêmes Loix qui conviennent à un bon peuple. Rien ne prouve mieux cette maxime que la durée de la République de Venise, dont le simulacre existe encore, uniquement parce que ses loix ne conviennent qu’à de méchans hommes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '275'
        source_sequence: 516
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/287
        printed_page_end: '276'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-036-print
    translation_ja: キケロがこの変更を責め、共和国が滅びた原因の一部だと考えたことは知っている。この点についてキケロの権威が持つ重みはわかるが、同意はできない。むしろ、こうした変更を十分に行わなかったために、国家の滅亡を早めたと思う。健康な人の養生法は病人には向かないように、腐敗した人民を、健全な人民にふさわしいのと同じ法で治めてはいけない。これを最もよく証明するのは、ヴェネツィア共和国が続いていることである。その外見がなお残るのは、ひとえに、その法律が悪い人間にしかふさわしくないからである。
    translation_status: reviewed
  - id: rsc-b4-c04-037
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: On distribua donc aux Citoyens des tabletes par lesquelles chacun pouvoit voter sans qu’on sût quel étoit son avis. On établit aussi de nouvelles formalités pour le recueillement des tablettes, le compte des voix, la comparaison des nombres &c. Ce qui n’empêcha pas que la fidélité des Officiers chargés de ces fonctions ne fut souvent suspectée. On fit enfin, pour empêcher la brigue & le trafic des suffrages, des Edits dont la multitude montre l’inutilité.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '276'
        source_sequence: 517
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/288
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-037-print
    translation_ja: そこで、一人ひとりが意見を知られずに投票できるよう、市民に小さな札を配った。札を受け取ること、票を数えること、数を比べることなどについて、新しい手続も設けた。それでも、この仕事を任された役人たちの誠実さは、しばしば疑われた。最後に、党派の画策と票の売買を防ぐ法令を出したが、その数の多さが、役に立たなかったことを示している。
    translation_status: reviewed
  - id: rsc-note-38-text
    section_id: rsc-b4-c04
    kind: note_body
    origin: source
    source_text: Custodes, Diribitores, Rogatores suffragiorum.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '276'
        source_sequence: 518
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/288
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-38-text-print
    translation_ja: 投票の監視役、票の仕分け係、票の取りまとめ役（クストデス、ディリビトレス、ロガトレス・スッフラギオルム）。
    translation_status: reviewed
  - id: rsc-b4-c04-038
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: 'Vers les derniers tems, on étoit souvent contraint de recourir à des expédiens extraordinaires pour suppléer à l’insuffisance des loix. Tantôt on supposoit des prodiges ; mais ce moyen qui pouvoit en imposer au peuple n’en imposoit pas à ceux qui le gouvernoient ; tantôt on convoquoit brusquement une assemblée avant que les Candidats eussent eu le tems de faire leurs brigues ; tantôt on consumoit toute une séance à parler quand on voyoit le peuple gagné prêt à prendre un mauvais parti : Mais enfin l’ambition éluda tout ; & ce qu’il y a d’incroyable, c’est qu’au milieu de tant d’abus, ce peuple immense, à la faveur de ses anciens réglemens, ne laissoit pas d’élire les Magistrats, de passer les loix, de juger les causes, d’expédier les affaires particulieres & publiques, presque avec autant de facilité qu’eut pu faire le Sénat lui-même.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '276'
        source_sequence: 519
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/288
        printed_page_end: '278'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-038-print
    translation_ja: 末期には、法の不十分さを補うために、通常ではない手段に頼るほかないことが多かった。ときには、不思議な兆しがあったと言い立てた。この手は人民をだませても、人民を治める人々には通じなかった。ときには、候補者が根回しする暇のないうち、急に集会を召集した。ときには、人民が買収されて悪い選択をしそうになると、会議を丸ごと一回、話だけで使い果たした。しかし、ついには野心がすべてをすり抜けた。そして信じがたいのは、これだけ濫用があっても、この膨大な人民が、昔からの規則のおかげで、行政官を選び、法律を通し、裁判をし、個人や公の案件を片づけることを、元老院それ自体にできたのとほとんど同じように、たやすく続けていたことである。
    translation_status: reviewed
  - id: rsc-b4-c05-heading
    section_id: rsc-b4-c05

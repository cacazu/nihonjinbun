  - id: rsc-b3-c01-001
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: J’avertis le lecteur que ce chapitre doit être lû posément, & que je ne sais pas l’art d’être clair pour qui ne veut pas être attentif.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '122'
        source_sequence: 218
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/134
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-001-print
    translation_ja: この章はじっくり読んでいただきたい。注意を向けようとしない人にもはっきりわかるような書き方を、私は知らないからだ。
    translation_status: reviewed
  - id: rsc-b3-c01-002
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Toute action libre a deux causes qui concourent à la produire, l’une morale, savoir la volonté qui détermine l’acte, l’autre physique, savoir la puissance qui l’exécute. Quand je marche vers un objet, il faut premierement que j’y veuille aller ; en second lieu, que mes pieds m’y portent. Qu’un paralytique veuille courir, qu’un homme agile ne le veuille pas, tous deux resteront en place. Le corps politique a les mêmes mobiles ; on y distingue de même la force & la volonté ; Celle-ci sous le nom de puissance législative, l’autre sous le nom de puissance exécutive. Rien ne s’y fait ou ne s’y doit faire sans leur concours.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '122'
        source_sequence: 219
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/134
        printed_page_end: '123'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-002-print
    translation_ja: 自由な行為にはすべて、力を合わせてその行為を生む二つの原因がある。一つは精神に属する原因、すなわち行為を決める意志であり、もう一つは身体に属する原因、すなわち行為を実行する力である。ある場所へ歩くには、第一にそこへ行こうと思い、第二に足が私をそこへ運ばなければならない。身体の麻痺した人が走ろうとし、身軽な人が走ろうとしなければ、二人ともその場にとどまる。政治体にも同じような原動力があり、同じように、力と意志が区別される。意志は立法権、力は行政権という名で呼ばれる。政治体では、二つが力を合わせなければ、何事も行われず、行われるべきでもない。
    translation_status: reviewed
  - id: rsc-b3-c01-003
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Nous avons vu que la puissance législative appartient au peuple, & ne peut appartenir qu’à lui. Il est aisé de voir au contraire, par les principes ci-devant établis, que la puissance exécutive ne peut appartenir à la généralité comme Législatrice ou Souveraine ; parce que cette puissance ne consiste qu’en des actes particuliers qui ne sont point du ressort de la loi, ni par conséquent de celui du Souverain, dont tous les actes ne peuvent être que des loix.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '123'
        source_sequence: 220
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/135
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-003-print
    translation_ja: 立法権が人民に属し、人民にしか属しえないことは、すでに見た。反対に、先に立てた原則から、行政権は立法者ないし主権者としての人民全体には属しえないことが、たやすくわかる。行政権は個別の行為からしか成らず、そうした行為は法律の管轄にない。したがって、そのすべての行為が法律でしかありえない主権者の管轄にもないからである。
    translation_status: reviewed
  - id: rsc-b3-c01-004
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Il faut donc à la force publique un agent propre qui la réunisse & la mette en œuvre selon les directions de la volonté générale, qui serve à la communication de l’Etat & du Souverain, qui fasse en quelque sorte dans la personne publique ce que fait dans l’homme l’union de l’ame & du corps. Voilà quelle est dans l’Etat la raison du Gouvernement, confondu mal à propos avec le Souverain, dont il n’est que le ministre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '123'
        source_sequence: 221
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/135
        printed_page_end: '124'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-004-print
    translation_ja: したがって、公の実力を集め、一般意志の指図に沿って用い、国家と主権者の橋渡しをする、固有の働き手が必要である。人間において魂と身体の結合が果たす働きを、公の人格において、いわばこの働き手が果たす。国家に政府がある理由はここにあり、政府を主権者と混同するのは誤りだ。政府はただ主権者に仕えるだけである。
    translation_status: reviewed
  - id: rsc-b3-c01-005
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Qu’est-ce donc que le Gouvernement ? Un corps intermédiaire établi entre les sujets & le Souverain pour leur mutuelle correspondance, chargé de l’exécution des loix, & du maintien de la liberté, tant civile que politique.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '124'
        source_sequence: 222
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/136
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-005-print
    translation_ja: では、政府とは何か。互いの意思が通じるように、臣民と主権者のあいだに設けられた中間の団体であり、法の執行と、市民の自由および政治の自由を守ることを任されている。
    translation_status: reviewed
  - id: rsc-b3-c01-006
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Les membres de ce corps s’appellent Magistrats ou Rois, c’est-à-dire Gouverneurs, & le corps entier porte le nom de Prince. Ainsi ceux qui prétendent que l’acte par lequel un peuple se soumet à des chefs n’est point un contract, ont grande raison. Ce n’est absolument qu’une commission, un emploi dans lequel, simples officiers du Souverain, ils exercent en son nom le pouvoir dont il les a faits dépositaires, & qu’il peut limiter, modifier & reprendre quand il lui plait, l’aliénation d’un tel droit étant incompatible avec la nature du corps social, & contraire au but de l’association.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '124'
        source_sequence: 223
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/136
        printed_page_end: '125'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-006-print
    translation_ja: この団体の構成員は行政官あるいは王、つまり統治する者たちと呼ばれ、団体全体は統治者と呼ばれる。だから人民が長たちに従う行為は契約ではない、と主張する人たちには、まことに理がある。それは、まったくの委任、一つの職分にすぎない。この職分にあって、長たちは主権者の一介の役人として、主権者から預かった権力を、その名において行使する。主権者はその権力を、思うときに制限し、改め、取り戻すことができる。そのような権利を譲り渡すことは社会という団体の本性と相いれず、結びつきの目的に反するからである。
    translation_status: reviewed
  - id: rsc-note-16-text
    section_id: rsc-b3-c01
    kind: note_body
    origin: source
    source_text: C’est ainsi qu’à Venise on donne au college le nom de sérénissime Prince, même quand le Doge n’y assiste pas.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '124'
        source_sequence: 224
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/136
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-16-text-print
    translation_ja: ヴェネツィアでは、このようにして、元首が出席していない場合でも、評議会に「いとも高貴なる統治者」の名を与える。
    translation_status: reviewed
  - id: rsc-b3-c01-007
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: J’appelle donc Gouvernement ou suprême administration l’exercice légitime de la puissance exécutive, & Prince ou magistrat l’homme ou le corps chargé de cette administration.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '125'
        source_sequence: 225
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/137
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-007-print
    translation_ja: そこで私は、行政権を正当に行使することを政府、または最高の行政と呼び、その行政を任された人または団体を統治者、あるいは行政官と呼ぶ。
    translation_status: reviewed
  - id: rsc-b3-c01-008
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: C’est dans le Gouvernement que se trouvent les forces intermédiaires, dont les rapports composent celui du tout au tout ou du Souverain à l’Etat. On peut réprésenter ce dernier rapport par celui des extrêmes d’une proportion continue, dont la moyenne proportionnelle est le Gouvernement. Le Gouvernement reçoit du Souverain les ordres qu’il donne au peuple, & pour que l’Etat soit dans un bon équilibre il faut, tout compensé, qu’il y ait égalité entre le produit ou la puissance du Gouvernement pris en lui-même & le produit ou la puissance des citoyens, qui sont souverains d’un côté & sujets de l’autre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '125'
        source_sequence: 226
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/137
        printed_page_end: '126'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-008-print
    translation_ja: 全体と全体、すなわち主権者と国家の関係を成り立たせる間の力は、政府のなかにある。この最後の関係は、連比における二つの外項の比で示すことができる。その比例中項が政府である。政府は、人民に伝える指図を主権者から受け取る。国家がよい均衡にあるには、すべてを差し引いたところで、それ自体として見た政府の積、すなわち力と、一方では主権者、他方では臣民である市民の積、すなわち力とが、等しくなければならない。
    translation_status: reviewed
  - id: rsc-b3-c01-009
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: 'De plus, on ne sauroit altérer aucun des trois termes sans rompre à l’instant la proportion. Si le Souverain veut gouverner, ou si le magistrat veut donner des loix, ou si les sujets refusent d’obéir, le désordre succede à la regle, la force & la volonté n’agissent plus de concert, & l’Etat dissout tombe ainsi dans le despotisme ou dans l’anarchie. Enfin comme il n’y a qu’une moyenne proportionnelle entre chaque rapport, il n’y a non plus qu’un bon gouvernement possible dans un État : Mais comme mille événemens peuvent changer les rapports d’un peuple, non seulement différens Gouvernemens peuvent être bons à divers peuples, mais au même peuple en différens tems.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '126'
        source_sequence: 227
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/138
        printed_page_end: '127'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-009-print
    translation_ja: さらに、三項のうちどれか一つを変えれば、たちまち比例が崩れる。主権者が統治しようとし、あるいは行政官が法を与えようとし、あるいは臣民が従うことを拒めば、秩序に代わって混乱が生じる。力と意志はもはやそろって働かず、国家は解体して、専制か無政府状態に陥る。最後に、それぞれの比に対して比例中項は一つしかないように、一つの国家にふさわしい政府も一つしかない。しかし、数かぎりない出来事によって人民の諸関係は変わりうるのだから、さまざまな人民にさまざまな政府がよいだけでなく、同じ人民にとっても、時代が変われば別の政府がよいことがある。
    translation_status: reviewed
  - id: rsc-b3-c01-010
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Pour tâcher de donner une idée des divers rapports qui peuvent regner entre ces deux extrêmes, je prendrai pour exemple le nombre du peuple, comme un rapport plus facile à exprimer.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '127'
        source_sequence: 228
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/139
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-010-print
    translation_ja: この二つの外項のあいだにありうるさまざまな比を、できるだけわかるように説明するために、示しやすい例として、人民の数を取り上げよう。
    translation_status: reviewed
  - id: rsc-b3-c01-011
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: 'Supposons que l’État soit composé de dix-mille Citoyens. Le Souverain ne peut être considéré que collectivement & en corps : Mais chaque particulier en qualité de sujet est considéré comme individu : Ainsi le Souverain est au sujet comme dix-mille est à un : C’est-à-dire que chaque membre de l’Etat n’a pour sa part que la dix-millieme partie de l’autorité souveraine, quoi qu’il lui soit soumis tout entier. Que le peuple soit composé de cent-mille hommes, l’état des sujets ne change pas, & chacun porte également tout l’empire des loix, tandis que son suffrage, réduit à un cent-millieme, a dix fois moins d’influence dans leur rédaction. Alors le sujet restant toujours un, le rapport du Souverain augmente en raison du nombre des Citoyens. D’où il suit que plus l’Etat s’agrandit, plus la liberté diminue.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '127'
        source_sequence: 229
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/139
        printed_page_end: '128'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-011-print
    translation_ja: 国家が一万人の市民から成ると仮定しよう。主権者は、集合として、一団としてしか考えられない。しかし臣民としての一人ひとりは、個人として考えられる。だから、主権者と臣民の比は一万対一である。つまり、国家の構成員は一人ひとり、その全身で主権に服するのに、自分の取り分として持つのは主権者の権威の一万分の一だけだ。人民が十万人から成るとしても、臣民の立場は変わらず、誰もが同じように、法律の支配を全部引き受ける。それに対して、その票は十万分の一に減って、法律の起草への影響は十分の一になる。この場合、臣民の側は一のままで、主権者の側の比は市民の数に応じて大きくなる。だから国家が大きくなればなるほど、自由は小さくなる。
    translation_status: reviewed
  - id: rsc-b3-c01-012
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Quand je dis que le rapport augmente, j’entends qu’il s’éloigne de l’égalité. Ainsi plus le rapport est grand dans l’acception des Géometres, moins il y a de rapport dans l’acception commune ; dans la premiere le rapport considéré selon la quantité se mésure par l’exposant, & dans l’autre, considéré selon l’identité, il s’estime par la similitude.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '128'
        source_sequence: 230
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/140
        printed_page_end: '129'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-012-print
    translation_ja: 比が大きくなるというのは、一対一から離れるという意味だ。だから、幾何学者のいう意味で比が大きいほど、日常の意味での関係、つまり似通ったところは小さい。第一の意味では、数量から見た比を、その比の値で測り、第二の意味では、同じところに注目した関係を、その類似性で見積もる。
    translation_status: reviewed
  - id: rsc-b3-c01-013
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Or moins les volontés particulieres se rapportent à la volonté générale, c’est-à-dire les mœurs aux loix, plus la force réprimante doit augmenter. Donc le Gouvernement, pour être bon, doit être rélativement plus fort à mésure que le peuple est plus nombreux.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '129'
        source_sequence: 231
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/141
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-013-print
    translation_ja: ところで、個別の意志が一般意志に、つまり風俗が法律にそぐわなければそぐわないほど、抑える力を増さなければならない。それゆえ、よい政府であるためには、人民の数が多くなるほど、政府が相対的に強くならなければならない。
    translation_status: reviewed
  - id: rsc-b3-c01-014
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: D’un autre côté, l’aggrandissement de l’Etat donnant aux dépositaires de l’autorité publique plus de tentations & de moyens d’abuser de leur pouvoir, plus le Gouvernement doit avoir de force pour contenir le peuple, plus le Souverain doit en avoir à son tour pour contenir le Gouvernement. Je ne parle pas ici d’une force absolue, mais de la force rélative des diverses parties de l’Etat.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '129'
        source_sequence: 232
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/141
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-014-print
    translation_ja: 他方、国家が大きくなるにつれて、公の権威を預かる人々には、権力を濫用する誘惑も手段も増える。だから政府が人民を抑えるために、より大きな力を持たなければならないほど、主権者もまた政府を抑えるために、より大きな力を持たなければならない。ここで私が言うのは絶対的な力ではなく、国家を構成するさまざまな部分の相対的な力である。
    translation_status: reviewed
  - id: rsc-b3-c01-015
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Il suit de ce double rapport que la proportion continue entre le Souverain le Prince & le peuple, n’est point une idée arbitraire, mais une conséquence nécessaire de la nature du corps politique. Il suit encore que l’un des extrêmes, savoir le peuple comme sujet, étant fixe & représenté par l’unité, toutes les fois que la raison doublée augmente ou diminue, la raison simple augmente ou diminue semblablement, & que par conséquent le moyen terme est changé. Ce qui fait voir qu’il n’y a pas une constitution de Gouvernement unique & absolue, mais qu’il peut y avoir autant de Gouvernemens différens en nature que d’Etats différens en grandeur.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '129'
        source_sequence: 233
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/141
        printed_page_end: '130'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-015-print
    translation_ja: この二重の関係からわかるのは、主権者、統治者、人民のあいだの連比は、恣意的な考えでなく、政治体の本性から必ず生まれるということだ。また、一方の外項、すなわち臣民としての人民は固定され、一で表されるのだから、二つの外項の比が増減するたび、その平方根にあたる隣接項の比も同じ方向に変わり、したがって中項が変わる。これで、政府の体制に唯一絶対のものはなく、規模の違う国家の数だけ、性質の異なる政府がありうるとわかる。
    translation_status: reviewed
  - id: rsc-b3-c01-016
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Si, tournant ce sistême en ridicule, on disoit que pour trouver cette moyenne proportionnelle & former le corps du Gouvernement il ne faut, selon moi, que tirer la racine quarrée du nombre du peuple ; je répondrois que je ne prends ici ce nombre que pour un exemple, que les rapports dont je parle ne se mésurent pas seulement par le nombre des hommes, mais en général par la quantité d’action, laquelle se combine par des multitudes de causes, qu’au reste si, pour m’exprimer en moins de paroles, j’emprunte un moment des termes de géométrie, je n’ignore pas, cependant, que la précision géométrique n’a point lieu dans les quantités morales.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '130'
        source_sequence: 234
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/142
        printed_page_end: '131'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-016-print
    translation_ja: この考えをばかにして、私によれば、比例中項を見つけて政府という団体をつくるには、人民の数の平方根を取るだけでよいのだ、と言う人がいたら、私はこう答えよう。ここでこの数を使ったのはただの例である。私が語っている比は、人間の数だけでは測れず、広く、さまざまな原因が組み合わさって生じる働きの大きさで測るのである。それに、簡潔に言うために幾何学の用語をひととき借りても、人間の意志や行いにかかわる量に、幾何学の厳密さがあてはまらないことを、知らないわけではない。
    translation_status: reviewed
  - id: rsc-b3-c01-017
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Le Gouvernement est en petit ce que le corps politique qui le renferme est en grand. C’est une personne morale douée de certaines facultés, active comme le Souverain, passive comme l’Etat, & qu’on peut décomposer en d’autres rapports semblables, d’où nait par conséquent une nouvelle proportion, une autre encore dans celle-ci selon l’ordre des tribunaux, jusqu’à ce qu’on arrive à un moyen terme indivisible, c’est-à-dire à un seul chef ou magistrat suprême, qu’on peut se représenter au milieu de cette progression, comme l’unité entre la série des fractions & celles des nombres.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '131'
        source_sequence: 235
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/143
        printed_page_end: '132'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-017-print
    translation_ja: 政府は、これを内に含む政治体を、小さくしたようなものである。政府は、一定の能力を備えた道徳的人格であり、主権者のように能動的で、国家のように受動的である。これを、同じようなほかの関係に分けることもできる。そうすれば、新しい比例が生じ、その中にも、諸機関の順序に沿って、また別の比例が生じる。ついには分けることのできない比例中項に、すなわち単独の長、または最高の行政官に行き着く。この等比数列のまんなかにいるこの人を、分数の列と整数の列のあいだの一として思い描ける。
    translation_status: reviewed
  - id: rsc-b3-c01-018
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Sans nous embarrasser dans cette multiplication de termes, contentons-nous de considérer le Gouvernement comme un nouveau corps dans l’Etat, distinct du peuple & du Souverain, & intermédiaire entre l’un & l’autre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '132'
        source_sequence: 236
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/144
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-018-print
    translation_ja: これ以上多くの項を並べて話をややこしくせず、政府を国家のなかのもう一つの団体と見なし、人民とも主権者とも異なり、両者を仲立ちするものと考えるだけにしよう。
    translation_status: reviewed
  - id: rsc-b3-c01-019
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Il y a cette différence essentielle entre ces deux corps, que l’Etat existe par lui-même, & que le Gouvernement n’existe que par le Souverain. Ainsi la volonté dominante du Prince n’est ou ne doit être que la volonté générale ou la loi, sa force n’est que la force publique concentrée en lui, sitôt qu’il veut tirer de lui-même quelque acte absolu & indépendant, la liaison du tout commence à se relâcher. S’il arrivoit enfin que le Prince eut une volonté particuliere plus active que celle du Souverain, & qu’il usât pour obéir à cette volonté particuliere de la force publique qui est dans ses mains, en sorte qu’on eut, pour ainsi dire, deux Souverains, l’un de droit & l’autre de fait ; à l’instant l’union sociale s’évanouiroit, & le corps politique seroit dissout.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '132'
        source_sequence: 237
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/144
        printed_page_end: '133'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-019-print
    translation_ja: この二つの団体には、国家はそれ自体で存在し、政府は主権者によってしか存在しないという本質的な違いがある。だから、統治者を導く意志は、一般意志、すなわち法律でしかない、あるいはそうでなければならない。統治者の力は、そのもとに集められた公の実力にすぎず、自らの裁量だけで、他に縛られない行為をしようとしたとたん、全体の結びつきがゆるみはじめる。もしついに、統治者が主権者の意志よりも活発な個別の意志を持ち、手中の公の実力をその個別の意志に従うために使うなら、いわば二つの主権者、権利上の主権者と事実上の主権者がいることになり、その瞬間に社会の結びつきは消え、政治体は解体するだろう。
    translation_status: reviewed
  - id: rsc-b3-c01-020
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: Cependant pour que le corps du Gouvernement ait une existence une vie réelle qui le distingue du corps de l’Etat, pour que tous ses membres puissent agir de concert & répondre à la fin pour laquelle il est institué, il lui faut un moi particulier, une sensibilité commune à ses membres, une force une volonté propre qui tende à sa conservation. Cette existence particuliere suppose des assemblées, des conseils, un pouvoir de délibérer de résoudre, des droits, des titres, des privileges qui appartiennent au Prince exclusivement, & qui rendent la condition du magistrat plus honorable à proportion qu’elle est plus pénible. Les difficultés sont dans la maniere d’ordonner dans le tout ce tout subalterne, de sorte qu’il n’altere point la constitution générale en affermissant la sienne, qu’il distingue toujours sa force particuliere destinée à sa propre conservation de la force publique destinée à la conservation de l’Etat, & qu’en un mot il soit toujours prêt à sacrifier le Gouvernement au peuple & non le peuple au Gouvernement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '133'
        source_sequence: 238
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/145
        printed_page_end: '134'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-020-print
    translation_ja: それでも、政府という団体が、国家という団体とは異なる現実の存在と生命を持ち、そのすべての成員が協力して、政府の設けられた目的にかなう行動をするためには、政府独自の自我、成員に共通の感覚、自らを維持しようとする固有の力と意志が必要である。この固有の存在は、集会、評議会、審議して決める力、そして統治者だけに属する権利、称号、特権を前提とする。それらによって、行政官の立場は、重い仕事に見合って名誉あるものになる。難しいのは、全体のなかに、この従属するもう一つの全体をどう組みこむかということだ。自らの仕組みを強くするあまり全体の仕組みを損なわないようにし、自らの維持に向けた固有の力と、国家の維持に向けた公の実力とをつねに区別させる。要するに、政府のために人民を犠牲にするのではなく、人民のために政府をつねに犠牲にできるようにしなければならない。
    translation_status: reviewed
  - id: rsc-b3-c01-021
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: D’ailleurs, bien que le corps artificiel du Gouvernement soit l’ouvrage d’un autre corps artificiel, & qu’il n’ait en quelque sorte qu’une vie empruntée & subordonnée, cela n’empêche pas qu’il ne puisse agir avec plus ou moins de vigueur ou de célérité, jouir, pour ainsi dire d’une santé plus ou moins robuste. Enfin, sans s’éloigner directement du but de son institution, il peut s’en écarter plus ou moins, selon la maniere dont il est constitué.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '134'
        source_sequence: 239
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/146
        printed_page_end: '135'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-021-print
    translation_ja: また、人工の団体である政府は、ほかの人工の団体がつくったもので、いわば借り物の、従属した生命しか持たない。とはいえ、それは、政府がどれほど力強く、あるいは迅速に働くか、いわばどれほど丈夫な体でいられるかに、違いが出ることを妨げない。さらに、政府の組織のされ方によっては、設けられた目的から真っ向から離れずとも、いくらかは離れることがありうる。
    translation_status: reviewed
  - id: rsc-b3-c01-022
    section_id: rsc-b3-c01
    kind: paragraph
    origin: source
    source_text: C’est de toutes ces différences que naissent les rapports divers que le Gouvernement doit avoir avec le corps de l’État, selon les rapports accidentels & particuliers par lesquels ce même État est modifié. Car souvent le Gouvernement le meilleur en soi deviendra le plus vicieux, si ses rapports ne sont altérés selon les défauts du corps politique auquel il appartient.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '135'
        source_sequence: 240
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/147
        printed_page_end: '136'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c01-022-print
    translation_ja: これらすべての違いから、政府が国家という団体と結ぶべきさまざまな関係が生まれる。それぞれの国家は、たまたま生じた、その国に固有の事情によって異なるからだ。どれほどそれ自体としては最善の政府も、その属する政治体の欠点に応じて関係を調整しなければ、しばしば最悪の政府になってしまう。
    translation_status: reviewed
  - id: rsc-b3-c02-heading
    section_id: rsc-b3-c02
    kind: heading
    origin: source
    source_text: CHAPITRE II.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '136'
        source_sequence: 241
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/148
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-heading-print
    translation_ja: 第二章
    translation_status: reviewed
  - id: rsc-b3-c02-title
    section_id: rsc-b3-c02
    kind: heading
    origin: source
    source_text: Du principe qui constitue les diverses formes de Gouvernement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '136'
        source_sequence: 242
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/148
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-title-print
    translation_ja: 政府のさまざまな形を成り立たせる原理について
    translation_status: reviewed
  - id: rsc-b3-c02-001
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: Pour exposer la cause générale de ces différences, il faut distinguer ici le Prince & le Gouvernement, comme j’ai distingué ci-devant l’Etat & le Souverain.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '136'
        source_sequence: 243
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/148
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-001-print
    translation_ja: このような違いの一般的な原因を述べるには、先に国家と主権者を区別したように、ここで統治者と政府を区別する必要がある。
    translation_status: reviewed
  - id: rsc-b3-c02-002
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: Le corps du magistrat peut être composé d’un plus grand ou moindre nombre de membres. Nous avons dit que le rapport du Souverain aux sujets étoit d’autant plus grand que le peuple étoit plus nombreux, & par une évidente analogie nous en pouvons dire autant du Gouvernement à l’égard des Magistrats.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '136'
        source_sequence: 244
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/148
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-002-print
    translation_ja: 行政官の団体を構成する人数は、多くも少なくもなりうる。人民の数が多いほど、臣民に対する主権者の比は大きくなる、と述べた。同じことが、明らかな類似によって、行政官たちに対する政府についても言える。
    translation_status: reviewed
  - id: rsc-b3-c02-003
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: 'Or la force totale du Gouvernement étant toujours celle de l’Etat, ne varie point : d’où il suit que plus il use de cette force sur ses propres membres, moins il lui en reste pour agir sur tout le peuple.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '136'
        source_sequence: 245
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/148
        printed_page_end: '137'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-003-print
    translation_ja: 政府の総力はつねに国家の力であり、変わらない。したがって、自分自身の構成員にこの力を使えば使うほど、人民全体に働きかけるための力は少なくなる。
    translation_status: reviewed
  - id: rsc-b3-c02-004
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: Donc plus les Magistrats sont nombreux, plus le Gouvernement est foible. Comme cette maxime est fondamentale, appliquons-nous à la mieux éclaircir.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '137'
        source_sequence: 246
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/149
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-004-print
    translation_ja: だから、行政官の人数が多いほど、政府は弱い。これは根本の格言なので、もっとはっきりさせるよう努めよう。
    translation_status: reviewed
  - id: rsc-b3-c02-005
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: Nous pouvons distinguer dans la personne du magistrat trois volontés essentiellement différentes. Premierement la volonté propre de l’individu, qui ne tend qu’à son avantage particulier ; secondement la volonté commune des magistrats, qui se rapporte uniquement à l’avantage du Prince, & qu’on peut appeller volonté de corps, laquelle est générale par rapport au Gouvernement, & particuliere par rapport à l’Etat, dont le Gouvernement fait partie ; en troisieme lieu la volonté du peuple ou la volonté souveraine, laquelle est générale, tant par rapport à l’Etat considéré comme le tout, que par rapport au Gouvernement considéré comme partie du tout.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '137'
        source_sequence: 247
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/149
        printed_page_end: '138'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-005-print
    translation_ja: 行政官という人格のなかに、本質的に異なる三つの意志を区別できる。第一は個人に固有の意志で、その人の私的な利益だけをめざす。第二は行政官たちの共通の意志で、統治者の利益だけにかかわる。これを団体の意志と呼んでもよい。この意志は、政府との関係では一般的であり、政府がその一部である国家との関係では個別的だ。第三は人民の意志、すなわち主権の意志で、国家を全体と考えたとき、その国家に対して一般的であり、政府を全体の一部と考えたとき、その政府に対しても一般的である。
    translation_status: reviewed
  - id: rsc-b3-c02-006
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: Dans une législation parfaite, la volonté particuliere ou individuelle doit être nulle, la volonté de corps propre au Gouvernement très subordonnée, & par conséquent la volonté générale ou souveraine toujours dominante & la regle unique de toutes les autres.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '138'
        source_sequence: 248
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/150
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-006-print
    translation_ja: 完全な立法制度では、個別の意志、すなわち個人の意志は、何の力も持たないはずである。政府に固有の団体の意志は、上の意志に大きく従属するはずである。したがって、一般意志すなわち主権の意志がつねに優位にあり、ほかのすべての意志の唯一の規則でなければならない。
    translation_status: reviewed
  - id: rsc-b3-c02-007
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: 'Selon l’ordre naturel, au contraire, ces différentes volontés deviennent plus actives à mesure qu’elles se concentrent. Ainsi la volonté générale est toujours la plus foible, la volonté de corps a le second rang, & la volonté particuliere le premier de tous : de sorte que dans le Gouvernement, chaque membre est premierement soi-même, & puis Magistrat, & puis citoyen. Gradation directement opposée à celle qu’exige l’ordre social.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '138'
        source_sequence: 249
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/150
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-007-print
    translation_ja: しかし自然の成り行きでは、逆に、これらの意志は集中するほど活発になる。だから、一般意志はつねに最も弱く、団体の意志が二番目で、個別の意志がいちばん強い。政府にあっては、各成員は第一に自分自身、次に行政官、その次に市民というわけだ。社会の秩序が求める順番とは、正反対である。
    translation_status: reviewed
  - id: rsc-b3-c02-008
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: 'Cela posé : que tout le Gouvernement soit entre les mains d’un seul homme. Voilà la volonté particuliere & la volonté de corps parfaitement réunies, & par conséquent celle-ci au plus haut dégré d’intensité qu’elle puisse avoir. Or comme c’est du dégré de la volonté que dépend l’usage de la force, & que la force absolue du Gouvernement ne varie point, il s’ensuit que le plus actif des Gouvernemens est celui d’un seul.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '138'
        source_sequence: 250
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/150
        printed_page_end: '139'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-008-print
    translation_ja: こう考えたうえで、政府全体がただ一人の手にあるとしよう。このとき個別の意志と団体の意志は完全に一つになり、したがって団体の意志は、ありうる最大の強さを持つ。ところで、力をどれだけ使うかは意志の強さによって決まり、政府の絶対的な力は変わらない。ゆえに、最も活動的な政府は、一人の政府である。
    translation_status: reviewed
  - id: rsc-b3-c02-009
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: 'Au contraire, unissons le Gouvernement à l’autorité législative ; faisons le Prince du Souverain, & de tous les Citoyens autant de magistrats : Alors la volonté de corps, confondue avec la volonté générale, n’aura pas plus d’activité qu’elle, & laissera la volonté particuliere dans toute sa force. Ainsi le Gouvernement, toujours avec la même force absolue, sera dans son minimum de force rélative ou d’activité.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '139'
        source_sequence: 251
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/151
        printed_page_end: '140'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-009-print
    translation_ja: 反対に、政府を立法の権威と一つにし、主権者を統治者に、市民全員を行政官にしてみよう。そうなると、団体の意志は一般意志と区別がつかず、一般意志以上に活発になることはない。それに対して個別の意志は、そのままの力を保つ。こうして政府は、絶対的な力は相変わらず同じだが、相対的な力、つまり活動力は最小になる。
    translation_status: reviewed
  - id: rsc-b3-c02-010
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: 'Ces rapports sont incontestables, & d’autres considérations servent encore à les confirmer. On voit, par exemple, que chaque magistrat est plus actif dans son corps que chaque citoyen dans le sien, & que par conséquent la volonté particuliere a beaucoup plus d’influence dans les actes du Gouvernement que dans ceux du Souverain ; car chaque magistrat est presque toujours chargé de quelque fonction du Gouvernement, au lieu que chaque citoyen pris à part n’a aucune fonction de la souveraineté. D’ailleurs, plus l’Etat s’étend, plus sa force réelle augmente, quoiqu’elle n’augmente pas en raison de son étendue : mais l’Etat restant le même, les magistrats ont beau se multiplier, le Gouvernement n’en acquiert pas une plus grande force réelle, parce que cette force est celle de l’Etat, dont la mésure est toujours égale. Ainsi la force rélative ou l’activité du Gouvernement diminue, sans que sa force absolue ou réelle puisse augmenter.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '140'
        source_sequence: 252
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/152
        printed_page_end: '141'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-010-print
    translation_ja: こうした関係に争う余地はなく、ほかにもそれを確かめる考察がある。たとえば、一人の行政官は自分の属する団体のなかで、一人の市民が自分の属する団体のなかでするより、活発に働く。したがって、個別の意志は、主権者の行為よりも政府の行為に、はるかに大きく影響する。各行政官はほとんどいつも政府の何かの役目を託されているが、各市民は、単独では主権について、どんな役目も持たないからだ。また、国家が広がるにつれて、国家が現に持つ力は増すが、その広さに比例して増すわけではない。しかし国家が同じ大きさのままなら、どれほど行政官を増やしても、政府が現に持つ力は増えない。それは国家の力であり、その量はつねに変わらないからだ。したがって、政府の相対的な力、あるいは活動力は低下するが、その絶対的な力、すなわち現に持つ力は増えようがない。
    translation_status: reviewed
  - id: rsc-b3-c02-011
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: Il est sûr encore que l’expédition des affaires devient plus lente à mésure que plus de gens en sont chargés, qu’en donnant trop à la prudence on ne donne pas assez à la fortune, qu’on laisse échapper l’occasion, & qu’à force de délibérer on perd souvent le fruit de la délibération.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '141'
        source_sequence: 253
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/153
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-011-print
    translation_ja: 仕事を任される人が多くなるほど、処理が遅くなることも確かだ。用心に重きを置きすぎれば、運に任せるべきところを任せなくなり、好機を逃し、審議しすぎて、しばしば審議の実りを失う。
    translation_status: reviewed
  - id: rsc-b3-c02-012
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: 'Je viens de prouver que le Gouvernement se relâche à mésure que les magistrats se multiplient, & j’ai prouvé ci-devant que plus le peuple est nombreux, plus la force réprimante doit augmenter. D’où il suit que le rapport des magistrats au Gouvernement doit être inverse du rapport des sujets au Souverain : C’est-à-dire que, plus l’Etat s’aggrandit, plus le Gouvernement doit se resserrer ; tellement que le nombre des chefs diminue en raison de l’augmentation du peuple.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '141'
        source_sequence: 254
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/153
        printed_page_end: '142'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-012-print
    translation_ja: いま、行政官が増えるほど政府がゆるむことを証明した。先には、人民の数が多いほど、抑える力が増さなければならないことを証明した。そこから、政府に対する行政官の比は、主権者に対する臣民の比の逆でなければならないことがわかる。つまり、国家が大きくなればなるほど、政府は少人数に絞られなければならず、人民が増えるのに応じて、長たちの数は減るのである。
    translation_status: reviewed
  - id: rsc-b3-c02-013
    section_id: rsc-b3-c02
    kind: paragraph
    origin: source
    source_text: 'Au reste je ne parle ici que de la force rélative du Gouvernement, & non de sa rectitude : Car, au contraire, plus le magistrat est nombreux, plus la volonté de corps se rapproche de la volonté générale ; au lieu que, sous un magistrat unique cette même volonté de corps n’est, comme je l’ai dit, qu’une volonté particuliere. Ainsi l’on perd d’un côté ce qu’on peut gagner de l’autre, & l’art du Législateur est de savoir fixer le point où la force & la volonté du Gouvernement, toujours en proportion réciproque, se combinent dans le rapport le plus avantageux à l’Etat.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '142'
        source_sequence: 255
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/154
        printed_page_end: '143'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c02-013-print
    translation_ja: なお、ここで言うのは、政府の相対的な力だけで、その正しさのことではない。正しさの点では、むしろ行政官が多いほど、団体の意志は一般意志に近づく。単独の行政官のもとでは、先に述べたとおり、団体の意志も個別の意志にすぎない。このように、一方で得られるものを、他方では失う。立法者の技量とは、政府の力と意志がつねに反対の割合で動くなかで、国家にとって最も有利な比で両者が組み合わさる点を、見定めることにある。
    translation_status: reviewed
  - id: rsc-b3-c03-heading
    section_id: rsc-b3-c03
    kind: heading
    origin: source
    source_text: CHAPITRE III.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '143'
        source_sequence: 256
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/155
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c03-heading-print
    translation_ja: 第三章
    translation_status: reviewed
  - id: rsc-b3-c03-title
    section_id: rsc-b3-c03
    kind: heading
    origin: source
    source_text: Division des Gouvernemens.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '143'
        source_sequence: 257
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/155
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c03-title-print
    translation_ja: 政府の区分
    translation_status: reviewed
  - id: rsc-b3-c03-001
    section_id: rsc-b3-c03
    kind: paragraph
    origin: source
    source_text: On a vu dans le chapitre précédent pourquoi l’on distingue les diverses especes ou formes de Gouvernemens par le nombre des membres qui les composent ; il reste à voir dans celui-ci comment se fait cette division.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '143'
        source_sequence: 258
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/155
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c03-001-print
    translation_ja: 前章で、政府の種類、あるいは形を、それを構成する成員の数によって区別するのはなぜかを見た。この章では、その区分がどうなされるかを見る。
    translation_status: reviewed
  - id: rsc-b3-c03-002
    section_id: rsc-b3-c03
    kind: paragraph
    origin: source
    source_text: Le Souverain peut, en premier lieu, commettre le dépôt du Gouvernement à tout le peuple ou à la plus grande partie du peuple, en sorte qu’il y ait plus de citoyens magistrats que de citoyens simples particuliers. On donne à cette forme de Gouvernement le nom de Démocratie.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '143'
        source_sequence: 259
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/155
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c03-002-print
    translation_ja: 第一に、主権者は、政治を行う仕事を人民全体、あるいは人民の大部分に預けることができる。そうすると、行政官である市民が、ただの一個人である市民より多くなる。この形の政府を民主政と呼ぶ。
    translation_status: reviewed
  - id: rsc-b3-c03-003
    section_id: rsc-b3-c03
    kind: paragraph
    origin: source
    source_text: Ou bien il peut resserrer le Gouvernement entre les mains d’un petit nombre, en sorte qu’il y ait plus de simples Citoyens que de magistrats, & cette forme porte le nom d’Aristocratie.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '143'
        source_sequence: 260
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/155
        printed_page_end: '144'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c03-003-print
    translation_ja: または、政府を少数の手にしぼり、行政官よりも普通の市民のほうを多くすることができる。この形を貴族政と呼ぶ。
    translation_status: reviewed
  - id: rsc-b3-c03-004
    section_id: rsc-b3-c03
    kind: paragraph
    origin: source
    source_text: Enfin il peut concentrer tout le Gouvernement dans les mains d’un magistrat unique dont tous les autres tiennent leur pouvoir. Cette troisieme forme est la plus commune, & s’appelle Monarchie ou Gouvernement royal.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '144'
        source_sequence: 261
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/156
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c03-004-print
    translation_ja: 最後に、政府全体をただ一人の行政官の手に集め、ほかの行政官はみな、その人から権力を受けるようにすることができる。この第三の形が最も普及しており、君主政、あるいは王政と呼ぶ。
    translation_status: reviewed
  - id: rsc-b3-c03-005
    section_id: rsc-b3-c03
    kind: paragraph
    origin: source
    source_text: On doit remarquer que toutes ces formes ou du moins les deux premieres sont susceptibles de plus ou de moins, & ont même une assez grande latitude ; car la Démocratie peut embrasser tout le peuple ou se resserrer jusqu’à la moitié. L’Aristocratie à son tour peut de la moitié du peuple se resserrer jusqu’au plus petit nombre indéterminément. La Royauté même est susceptible de quelque partage. Sparte eut constamment deux Rois par sa constitution, & l’on a vu dans l’empire romain jusqu’à huit Empereurs à la fois, sans qu’on pût dire que l’Empire fut divisé. Ainsi il y a un point où chaque forme de Gouvernement se confond avec la suivante, & l’on voit, que sous trois seules dénominations, le Gouvernement est réellement susceptible d’autant de formes diverses que l’Etat a de Citoyens.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '144'
        source_sequence: 262
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/156
        printed_page_end: '145'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c03-005-print
    translation_ja: これらすべての形、少なくとも初めの二つに、人数の多少がありうること、しかもその幅がかなり大きいことに注意しよう。民主政は人民全体を含んでもよいし、半分まで絞ってもよい。その次の貴族政も、人民の半分から、定まった数を置かず、ごく少人数まで絞ることができる。王政にすら、いくらか分かれる余地がある。スパルタの体制では、つねに王が二人いた。そして、ローマ帝国では、帝国が分かれたとは言えないのに、同時に八人もの皇帝がいたことがある。だから、それぞれの形の政府には、次の形と重なり合う点がある。名前はわずか三つでも、実際には、国家にいる市民の数だけ異なる形を取りうるとわかる。
    translation_status: reviewed
  - id: rsc-b3-c03-006
    section_id: rsc-b3-c03
    kind: paragraph
    origin: source
    source_text: 'Il y a plus : Ce même Gouvernement pouvant à certains égards se subdiviser en d’autres parties, l’une administrée d’une maniere & l’autre d’une autre, il peut résulter de ces trois formes combinées une multitude de formes mixtes, dont chacune est multipliable par toutes les formes simples.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '145'
        source_sequence: 263
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/157
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c03-006-print
    translation_ja: さらに、同じ政府が、ある点ではいくつかの部分に分かれ、一方がある仕方で、他方が別の仕方で治められることもある。この三つの形の組み合わせから、数多くの混合形態が生まれうる。その一つひとつも、単純な形態を組み合わせて、いっそう増やせる。
    translation_status: reviewed
  - id: rsc-b3-c03-007
    section_id: rsc-b3-c03
    kind: paragraph
    origin: source
    source_text: On a de tous tems beaucoup disputé sur la meilleure forme de Gouvernement, sans considérer que chacune d’elles est la meilleure en certains cas, & la pire en d’autres.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '145'
        source_sequence: 264
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/157
        printed_page_end: '146'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c03-007-print
    translation_ja: どの形の政府が最善か、昔から大いに論じられてきた。だが、どの形もある場合には最善で、別の場合には最悪になることは顧みられなかった。
    translation_status: reviewed
  - id: rsc-b3-c03-008
    section_id: rsc-b3-c03
    kind: paragraph
    origin: source
    source_text: Si dans les différens États le nombre des magistrats suprêmes doit être en raison inverse de celui des Citoyens, il s’ensuit qu’en général le Gouvernement Démocratique convient aux petits États, l’Aristocratique aux médiocres, & le Monarchique aux grands. Cette regle se tire immédiatement du principe ; mais comment compter la multitude de circonstances qui peuvent fournir des exceptions ?
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '146'
        source_sequence: 265
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/158
        printed_page_end: '147'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c03-008-print
    translation_ja: さまざまな国家において、最高の行政官の数が、市民の数に反比例しなければならないなら、一般に、民主政は小国に、貴族政は中くらいの国に、君主政は大国にふさわしいことになる。この規則は原理からそのまま出てくる。だが、例外が生まれる事情は、あまりに多くて数えきれない。
    translation_status: reviewed
  - id: rsc-b3-c04-heading
    section_id: rsc-b3-c04
    kind: heading
    origin: source
    source_text: CHAPITRE IV.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '147'
        source_sequence: 266
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/159
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c04-heading-print
    translation_ja: 第四章
    translation_status: reviewed
  - id: rsc-b3-c04-title
    section_id: rsc-b3-c04
    kind: heading
    origin: source
    source_text: De la Démocratie.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '147'
        source_sequence: 267
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/159
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c04-title-print
    translation_ja: 民主政について
    translation_status: reviewed
  - id: rsc-b3-c04-001
    section_id: rsc-b3-c04
    kind: paragraph
    origin: source
    source_text: 'Celui qui fait la loi sait mieux que personne comment elle doit être éxecutée & interprêtée. Il semble donc qu’on ne sauroit avoir une meilleure constitution que celle où le pouvoir exécutif est joint au législatif : Mais c’est cela même qui rend ce Gouvernement insuffisant à certains égards, parce que les choses qui doivent être distinguées ne le sont pas, & que le Prince & le Souverain n’étant que la même personne, ne forment, pour ainsi dire, qu’un Gouvernement sans Gouvernement.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '147'
        source_sequence: 268
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/159
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c04-001-print
    translation_ja: 法律をつくる者が、どう実行し、解釈すべきかを誰よりもよく知っている。だから、行政権と立法権が結びついた体制よりよいものはないように見える。だがまさにそれが、ある点でこの政府を不十分なものにする。区別しなければならないものが区別されず、統治者と主権者が同じ一つの人格にすぎないので、いわば政府のない政府しかつくらないからだ。
    translation_status: reviewed
  - id: rsc-b3-c04-002
    section_id: rsc-b3-c04
    kind: paragraph
    origin: source
    source_text: Il n’est pas bon que celui qui fait les loix les éxécute, ni que le corps du peuple détourne son attention des vues générales, pour les donner aux objets particuliers. Rien n’est plus dangereux que l’influence des intérêts privés dans les affaires publiques, & l’abus des loix par le Gouvernement est un mal moindre que la corruption du Législateur, suite infaillible des vues particulieres. Alors l’Etat étant altéré dans sa substance, toute réforme devient impossible. Un peuple qui n’abuseroit jamais du Gouvernement n’abuseroit pas non plus de l’indépendance ; un peuple qui gouverneroit toujours bien n’auroit pas besoin d’être gouverné.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '147'
        source_sequence: 269
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/159
        printed_page_end: '148'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c04-002-print
    translation_ja: 法をつくる者が法を執行するのはよくない。また、人民全体が一般的な事柄から目をそらして、個別の事柄に気を取られるのもよくない。公の事柄に私益が及ぼす影響ほど危険なものはない。政府が法を濫用するのは、私的な思惑から必ず生まれる立法者の腐敗に比べれば、まだ害が少ない。後者では、国家の実質そのものが損なわれ、いかなる改革も不可能になる。統治を決して濫用しない人民なら、独立をも濫用しない。つねによく統治する人民だったら、統治される必要はないのである。
    translation_status: reviewed
  - id: rsc-b3-c04-003
    section_id: rsc-b3-c04
    kind: paragraph
    origin: source
    source_text: A prendre le terme dans la rigueur de l’acception, il n’a jamais existé de véritable Démocratie, & il n’en existera jamais. Il est contre l’ordre naturel que le grand nombre gouverne & que le petit soit gouverné. On ne peut imaginer que le peuple reste incessamment assemblé pour vaquer aux affaires publiques, & l’on voit aisément qu’il ne sauroit établir pour cela des commissions sans que la forme de l’administration change.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '148'
        source_sequence: 270
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/160
        printed_page_end: '149'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c04-003-print
    translation_ja: 言葉を厳密な意味で取れば、真の民主政はこれまで一度もなく、これからも決してない。多数が統治し、少数が統治されるのは、自然の秩序に反する。人民が休みなく集まって公の事柄にあたるとは考えられない。また、そのための委員会を設ければ、行政の形は変わらざるをえないことも、容易にわかる。
    translation_status: reviewed
  - id: rsc-b3-c04-004
    section_id: rsc-b3-c04
    kind: paragraph
    origin: source
    source_text: En effet, je crois pouvoir poser en principes que quand les fonctions du Gouvernement sont partagées entre plusieurs tribunaux, les moins nombreux acquierent tôt ou tard la plus grande autorité ; ne fut-ce qu’à cause de la facilité d’expédier les affaires, qui les y amene naturellement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '149'
        source_sequence: 271
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/161
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c04-004-print
    translation_ja: 実際、政府の働きがいくつもの機関に分けられているとき、人数の少ない機関が遅かれ早かれ最も大きな権威を得る。これを原則としてよいと思う。単に人数が少なければ仕事を処理しやすいというだけでも、自然にそうなるからだ。
    translation_status: reviewed
  - id: rsc-b3-c04-005
    section_id: rsc-b3-c04
    kind: paragraph
    origin: source
    source_text: 'D’ailleurs que de choses difficiles à réunir ne suppose pas ce Gouvernement ? Premierement, un État très petit où le peuple soit facile à rassembler & où chaque citoyen puisse aisément connoitre tous les autres : secondement, une grande simplicité de mœurs qui prévienne la multitude d’affaires & les discussions épineuses : Ensuite beaucoup d’égalité dans les rangs & dans les fortunes, sans quoi l’égalité ne sauroit subsister longtems dans les droits & l’autorité : Enfin peu ou point de luxe ; car, ou le luxe est l’effet des richesses, ou il les rend nécessaires ; il corrompt à la fois le riche & le pauvre, l’un par la possession l’autre par la convoitise ; il vend la patrie à la molesse à la vanité ; il ôte à l’État tous ses Citoyens pour les asservir les uns aux autres, & tous à l’opinion.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '149'
        source_sequence: 272
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/161
        printed_page_end: '150'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c04-005-print
    translation_ja: そのうえ、この政府は、そろえるのが難しい条件をどれほど多く前提にしていることか。第一に、人民が集まりやすく、各市民がほかのすべての市民を容易に知ることができる、ごく小さな国家。第二に、仕事の多さや厄介な論争を防ぐ、たいへん質素な風俗。次に、地位と財産の大幅な平等。これがなければ、権利と権威における平等も、長くは存続できない。そして最後に、奢侈が少ないか、まったくないことである。奢侈は富の結果であるか、富を必要なものにするか、そのどちらかだ。それは、持つことによって富者を、欲しがることによって貧者を、ともに腐らせる。祖国を安逸と虚栄に売り渡し、国家から市民を残らず奪う。彼らを互いの奴隷にし、また全員を世評の奴隷にするのである。
    translation_status: reviewed
  - id: rsc-b3-c04-006
    section_id: rsc-b3-c04
    kind: paragraph
    origin: source
    source_text: 'Voilà pourquoi un Auteur célebre a donné la vertu pour principe à la République ; car toutes ces conditions ne sauroient subsister sans la vertu : mais, faute d’avoir fait les distinctions nécessaires, ce beau génie a manqué souvent de justesse, quelquefois de clarté, & n’a pas vu que l’autorité Souveraine étant par tout la même, le même principe doit avoir lieu dans tout État bien constitué, plus ou moins, il est vrai, selon la forme du Gouvernement.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '150'
        source_sequence: 273
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/162
        printed_page_end: '151'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c04-006-print
    translation_ja: 有名な著述家が徳を共和国の原理としたのは、このためである。実際、これらの条件は、徳なしでは存続しえない。だが必要な区別をしなかったので、この傑出した人も、しばしば正確さを欠き、ときには明晰さを欠いた。主権者の権威はどこでも同じなのだから、よい体制を持つ国家であれば、どこでも同じ原理がはたらかなければならない。もっとも政府の形によって、その程度に差がある。彼にはこのことが見えなかったのだ。
    translation_status: reviewed
  - id: rsc-b3-c04-007
    section_id: rsc-b3-c04
    kind: paragraph
    origin: source
    source_text: 'Ajoutons qu’il n’y a pas de Gouvernement si sujet aux guerres civiles & aux agitations intestines que le Démocratique ou populaire, parce qu’il n’y en a aucun qui tende si fortement & si continuellement à changer de forme, ni qui demande plus de vigilance & de courage pour être maintenu dans la sienne. C’est sur-tout dans cette constitution que le Citoyen doit s’armer de force & de constance, & dire chaque jour de sa vie au fond de son cœur ce que disoit un vertueux Palatin dans la Diete de Pologne : Malo periculosam libertatem quam quietum servitium.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '151'
        source_sequence: 274
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/163
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c04-007-print
    translation_ja: さらに言えば、民主政、すなわち人民による政府ほど、内戦や内部の騒乱にさらされやすい政府はない。これほど強く、絶えず形を変えようとする政府も、元の形に保つため、これほど警戒と勇気を必要とする政府もないからである。とりわけこの体制では、市民は強さと粘りを身につけ、生涯の一日一日、かつて徳ある県知事がポーランドの議会で言ったことを、心の底で唱えなければならない。「安穏な隷属より、危険な自由を選ぶ。」
    translation_status: reviewed
  - id: rsc-note-17-text
    section_id: rsc-b3-c04
    kind: note_body
    origin: source
    source_text: Le Palatin de Posnanie pere du Roi de Pologne Duc de Lorraine.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '151'
        source_sequence: 275
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/163
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-17-text-print
    translation_ja: ポズナン県知事。ポーランド王にしてロレーヌ公となった人の父である。
    translation_status: reviewed
  - id: rsc-b3-c04-008
    section_id: rsc-b3-c04
    kind: paragraph
    origin: source
    source_text: S’il y avoit un peuple de Dieux, il se gouverneroit Démocratiquement. Un Gouvernement si parfait ne convient pas à des hommes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '151'
        source_sequence: 276
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/163
        printed_page_end: '152'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c04-008-print
    translation_ja: もし神々だけの人民があったなら、民主政によって自らを治めるだろう。それほど完全な政府は、人間にはふさわしくない。
    translation_status: reviewed
  - id: rsc-b3-c05-heading
    section_id: rsc-b3-c05
    kind: heading
    origin: source
    source_text: CHAPITRE V.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '152'
        source_sequence: 277
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/164
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-heading-print
    translation_ja: 第五章
    translation_status: reviewed
  - id: rsc-b3-c05-title
    section_id: rsc-b3-c05
    kind: heading
    origin: source
    source_text: De l’Aristocratie.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '152'
        source_sequence: 278
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/164
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-title-print
    translation_ja: 貴族政について
    translation_status: reviewed
  - id: rsc-b3-c05-001
    section_id: rsc-b3-c05
    kind: paragraph
    origin: source
    source_text: Nous avons ici deux personnes morales très distinctes, savoir le Gouvernement & le Souverain, & par conséquent deux volontés générales, l’une par rapport à tous les citoyens, l’autre seulement pour les membres de l’administration. Ainsi, bien que le Gouvernement puisse régler sa police intérieure comme il lui plait, il ne peut jamais parler au peuple qu’au nom du Souverain, c’est-à-dire au nom du peuple même ; ce qu’il ne faut jamais oublier.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '152'
        source_sequence: 279
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/164
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-001-print
    translation_ja: ここでは、政府と主権者という、まったく異なる二つの道徳的人格があり、したがって、二つの一般意志がある。一つは市民全員に対して一般的であり、もう一つは、行政の構成員だけに対して一般的である。だから、政府は自らの内部の規律を好きなように定められるが、人民に語りかけることができるのは、つねに主権者の名において、すなわち人民自身の名においてだけである。このことを決して忘れてはならない。
    translation_status: reviewed
  - id: rsc-b3-c05-002
    section_id: rsc-b3-c05
    kind: paragraph
    origin: source
    source_text: Les premieres sociétés se gouvernerent aristocratiquement. Les chefs des familles délibéroient entre eux des affaires publiques ; Les jeunes gens cédoient sans peine à l’autorité de l’expérience. Delà les noms de Prêtres, d’anciens, de sénat, de Gérontes.. Les sauvages de l’amérique septentrionale se gouvernent encore ainsi de nos jours, & sont très bien gouvernés.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '152'
        source_sequence: 280
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/164
        printed_page_end: '153'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-002-print
    translation_ja: 初めの社会は、貴族政によって自らを治めていた。家族の長たちが公の事柄を相談し、若者たちは経験の権威にたやすく従った。祭司、長老、元老院、ゲロンテスといった名は、ここから来ている。北アメリカの未開とされる人々は、今でもこのように自らを治めており、まことによく治められている。
    translation_status: reviewed
  - id: rsc-b3-c05-003
    section_id: rsc-b3-c05
    kind: paragraph
    origin: source
    source_text: Mais à mésure que l’inégalité d’institution l’emporta sur l’inégalité naturelle, la richesse ou la puissance fut préférée à l’âge, & l’Aristocratie devint élective. Enfin la puissance transmise avec les biens du pere aux enfans, rendant les familles patriciennes, rendit le Gouvernement héréditaire, & l’on vit des Sénateurs de vingt ans.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '153'
        source_sequence: 281
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/165
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-003-print
    translation_ja: だが制度の生んだ不平等が自然の不平等を上回るにつれて、年齢より富や権勢が重んじられ、貴族政は選挙制となった。最後には、権勢が財産とともに父から子へと受け継がれ、門閥の家ができて、政府も世襲になった。二十歳の元老院議員が現れたのである。
    translation_status: reviewed
  - id: rsc-note-18-text
    section_id: rsc-b3-c05
    kind: note_body
    origin: source
    source_text: Il est clair que le mot Optimates chez les anciens ne veut pas dire les meilleurs, mais, les plus puissans.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '153'
        source_sequence: 282
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/165
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-18-text-print
    translation_ja: 古代の「オプティマテス」という言葉が「最善の者たち」でなく「最も力のある者たち」を意味するのは明らかである。
    translation_status: reviewed
  - id: rsc-b3-c05-004
    section_id: rsc-b3-c05
    kind: paragraph
    origin: source
    source_text: 'Il y a donc trois sortes d’Aristocratie ; naturelle, élective, héréditaire. La premiere ne convient qu’à des peuples simples ; la troisieme est le pire de tous les Gouvernemens. La deuxieme est le meilleur : c’est l’Aristocratie proprement dite.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '153'
        source_sequence: 283
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/165
        printed_page_end: '154'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-004-print
    translation_ja: だから貴族政には、自然のもの、選挙によるもの、世襲のものの三種類がある。第一は素朴な人民にしかふさわしくなく、第三はあらゆる政府のなかで最悪である。第二は最善であり、これこそ本来の意味での貴族政である。
    translation_status: reviewed
  - id: rsc-b3-c05-005
    section_id: rsc-b3-c05
    kind: paragraph
    origin: source
    source_text: Outre l’avantage de la distinction des deux pouvoirs, elle a celui du choix de ses membres ; car dans le Gouvernement populaire tous les Citoyens naissent magistrats, mais celui-ci les borne à un petit nombre, & ils ne le deviennent que par élection ; moyen par lequel la probité, les lumieres, l’expérience, & toutes les autres raisons de préférence & d’estime publique, sont autant de nouveaux garants qu’on sera sagement gouverné.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '154'
        source_sequence: 284
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/166
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-005-print
    translation_ja: 二つの権力が区別される利点のほかに、構成員を選べる利点がある。人民による政府では、すべての市民が生まれながらに行政官だが、こちらは少人数に限り、選挙によってしか行政官になれないからだ。この方法なら、誠実さ、知識、経験、そのほか人に優先され、公に評価される理由がすべて、賢明に治められるための、新たな保証になる。
    translation_status: reviewed
  - id: rsc-note-19-text
    section_id: rsc-b3-c05
    kind: note_body
    origin: source
    source_text: 'Il importe beaucoup de regler par des loix la forme de l’élection des magistrats : car en l’abandonnant à la volonté du Prince on ne peut éviter de tomber dans l’Aristocratie héréditaire, comme il est arrivé aux Républiques de Venise & de Berne. Aussi la premiere est-elle depuis longtemps un État dissout, mais la seconde se maintient par l’extrême sagesse de son Sénat ; c’est une exception bien honorable & bien dangereuse.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '154'
        source_sequence: 285
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/166
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-19-text-print
    translation_ja: 行政官を選ぶ方法を法律で定めるのは、たいへん重要だ。統治者の意志に任せておくと、ヴェネツィア共和国やベルン共和国で起こったように、世襲の貴族政へ陥るのは避けられない。ヴェネツィアはとうの昔に事実上解体した国家だが、ベルンは、元老院の並外れた賢明さによって保っている。たいへん名誉で、たいへん危うい例外である。
    translation_status: reviewed
  - id: rsc-b3-c05-006
    section_id: rsc-b3-c05
    kind: paragraph
    origin: source
    source_text: De plus, les assemblées se font plus comodément, les affaires se discutent mieux s’expédient avec plus d’ordre & de diligence, le crédit de l’État est mieux soutenu chez l’étranger par de vénérables sénateurs que par une multitude inconnue ou méprisée.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '154'
        source_sequence: 286
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/166
        printed_page_end: '155'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-006-print
    translation_ja: さらに、集会を開くにも都合がよく、仕事をいっそうよく審議でき、秩序立てて素早く片づけられる。外国における国家の信用も、知られていないか軽く見られている大勢の者より、尊敬に値する元老たちのほうがよく支えられる。
    translation_status: reviewed
  - id: rsc-b3-c05-007
    section_id: rsc-b3-c05
    kind: paragraph
    origin: source
    source_text: En un mot, c’est l’ordre le meilleur & le plus naturel que les plus sages gouvernent la multitude, quand on est sûr qu’ils la gouverneront pour son profit & non pour le leur ; il ne faut point multiplier en vain les ressorts, ni faire avec vingt mille hommes ce que cent hommes choisis peuvent encore mieux. Mais il faut remarquer que l’intérêt de corps commence à moins diriger ici la force publique — sur la regle de la volonté générale, & qu’une autre pente inévitable enlêve aux loix une partie de la puissance exécutive.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '155'
        source_sequence: 287
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/167
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-007-print
    translation_ja: 要するに、最も賢明な者たちが、自分たちの利益でなく、大勢の人々の利益のために治めるのが確かなら、彼らに大勢を治めさせるのが、最もよく、自然な秩序である。むやみに仕掛けを増やし、選び抜いた百人がもっとよくできることを、二万人でするには及ばない。ただし、この場合には、団体の利害が、公の実力を一般意志の規則に沿って導く度合いが減ってくることに、注意しなければならない。また別の避けがたい傾向が、法律から行政権の一部を奪うことにも注意が要る。
    translation_status: reviewed
  - id: rsc-b3-c05-008
    section_id: rsc-b3-c05
    kind: paragraph
    origin: source
    source_text: À l’egard des convenances particulieres, il ne faut ni un État si petit ni un peuple si simple & si droit que l’exécution des loix suive immédiatement de la volonté publique, comme dans une bonne Démocratie. Il ne faut pas non plus une si grande nation que les chefs épars pour la gouverner puissent trancher du Souverain chacun dans son département, & commencer par se rendre indépendans pour devenir enfin les maitres.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '155'
        source_sequence: 288
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/167
        printed_page_end: '156'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-008-print
    translation_ja: 個々の条件でいえば、よい民主政でそうなるように、公の意志から直ちに法の執行が生まれるほど、小さな国であったり、単純でまっすぐな人民であったりしてはならない。逆に国が大きすぎて、各地に散って治める長たちが、管轄内で主権者気取りになり、はじめは独立し、しまいには主人になれるようであってもならない。
    translation_status: reviewed
  - id: rsc-b3-c05-009
    section_id: rsc-b3-c05
    kind: paragraph
    origin: source
    source_text: Mais si l’Aristocratie exige quelques vertus de moins que le Gouvernement populaire, elle en exige aussi d’autres qui lui sont propres ; comme la modération dans les riches & le contentement dans les pauvres ; car il semble qu’une égalité rigoureuse y seroit déplacée ; elle ne fut pas même observée à Sparte.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '156'
        source_sequence: 289
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/168
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-009-print
    translation_ja: 貴族政は人民による政府ほど多くの徳を求めないとしても、独自の別の徳を求める。たとえば富者の節度、貧者の足るを知る心である。厳格な平等は、どうやらここでは場違いで、スパルタでさえ守られなかった。
    translation_status: reviewed
  - id: rsc-b3-c05-010
    section_id: rsc-b3-c05
    kind: paragraph
    origin: source
    source_text: Au reste, si cette forme comporte une certaine inégalité de fortune, c’est bien pour qu’en général l’administration des affaires publiques soit confiée à ceux qui peuvent les mieux y donner tout leur tems, mais non pas, comme prétend Aristote, pour que les riches soient toujours préférés. Au contraire, il importe qu’un choix opposé apprenne quelquefois au peuple qu’il y a dans le mérite des hommes des raisons de préférence plus importantes que la richesse.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '156'
        source_sequence: 290
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/168
        printed_page_end: '158'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c05-010-print
    translation_ja: また、この形がある程度の財産の不平等を許すとしても、それは一般に、公の事柄の処理を、全時間を最もよくそのために使える人たちに任せるためである。アリストテレスが言うように、富者をつねに優先するためではない。むしろ、ときには逆の選択をして、人の価値には、富よりも大切な選択の理由があることを人民に教えるのが大切である。
    translation_status: reviewed
  - id: rsc-b3-c06-heading
    section_id: rsc-b3-c06
    kind: heading
    origin: source
    source_text: CHAPITRE VI.

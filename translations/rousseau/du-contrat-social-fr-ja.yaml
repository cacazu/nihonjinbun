    translation_status: reviewed
  - id: rsc-b2-c05-001
    section_id: rsc-b2-c05
    kind: paragraph
    origin: source
    source_text: On demande comment les particuliers n’ayant point droit de disposer de leur propre vie peuvent transmettre au Souverain ce même droit qu’ils n’ont pas ? Cette question ne paroit difficile à résoudre que parce qu’elle est mal posée. Tout homme a droit de risquer sa propre vie pour la conserver. A-t-on jamais dit que celui qui se jette par une fenêtre pour échapper à un incendie, soit coupable de suicide ? A-t-on même jamais imputé ce crime à celui qui périt dans une tempête dont en s’embarquant il n’ignoroit pas le danger ?
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '69'
        source_sequence: 134
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/81
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c05-001-print
    translation_ja: 個人に自分の命を思いのままにする権利がないなら、そもそも持たないこの権利を、どのように主権者へ譲り渡せるというのか、と問われる。この問いが難しく見えるのは、問いの立て方が悪いからにすぎない。人には誰でも、自分の命を守るために、その命を危険にさらす権利がある。火事を逃れるために窓から飛び降りた人を、自殺の罪に問えると言った者が、かつていただろうか。危険を承知で船に乗り、暴風雨で命を失った人にさえ、その罪を負わせた者はいるだろうか。
    translation_status: reviewed
  - id: rsc-b2-c05-002
    section_id: rsc-b2-c05
    kind: paragraph
    origin: source
    source_text: Le traité social a pour fin la conservation des contractans. Qui veut la fin veut aussi les moyens, & ces moyens sont inséparables de quelques risques, même de quelques pertes. Qui veut conserver sa vie aux dépends des autres, doit la donner aussi pour eux quand il faut. Or le Citoyen n’est plus juge du péril auquel la loi veut qu’il s’expose, & quand le Prince lui a dit, il est expédient à l’Etat que tu meures, il doit mourir ; puisque ce n’est qu’à cette condition qu’il a vécu en sureté jusqu’alors, & que sa vie n’est plus seulement un bienfait de la nature, mais un don conditionnel de l’Etat.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '69'
        source_sequence: 135
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/81
        printed_page_end: '70'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c05-002-print
    translation_ja: 社会の取り決めの目的は、契約する者の命を守ることにある。目的を望むなら、手段もまた望むのであり、その手段は若干の危険、場合によっては若干の犠牲さえ伴わずにはいない。他人に負担をかけて自分の命を守りたい者は、必要なときには、自分の命を彼らのために差し出さなければならない。さて、法がどの危険に身をさらせと命じているかは、もはや市民自身が判断することではない。国家のためには、おまえが死ぬのがよい、と統治者に言われれば、死ななければならない。その条件でのみ、それまで無事に生きてこられたのであり、その命はもはや自然だけが恵んだものではなく、国家が条件つきで与えたものだからだ。
    translation_status: reviewed
  - id: rsc-b2-c05-003
    section_id: rsc-b2-c05
    kind: paragraph
    origin: source
    source_text: 'La peine de mort infligée aux criminels peut être envisagée à peu près sous le même point de vue : c’est pour n’être pas la victime d’un assassin que l’on consent à mourir si on le devient. Dans ce traité, loin de disposer de sa propre vie on ne songe qu’à la garantir, & il n’est pas à présumer qu’aucun des contractans prémédite alors de se faire pendre.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '70'
        source_sequence: 136
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/82
        printed_page_end: '71'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c05-003-print
    translation_ja: 犯罪者に科される死刑も、ほぼ同じ見方ができる。人殺しの犠牲にならないために、自分が人殺しになれば死ぬことに同意するのである。この取り決めでは、自分の命を思いのままにするどころか、命を守ることしか考えていない。契約するときに、誰かがあらかじめ絞首刑になるつもりだと考えるべきでもない。
    translation_status: reviewed
  - id: rsc-b2-c05-004
    section_id: rsc-b2-c05
    kind: paragraph
    origin: source
    source_text: D’ailleurs tout malfaiteur attaquant le droit social devient par ses forfaits rebelle & traître à la patrie, il cesse d’en être membre en violant ses loix, & même il lui fait la guerre. Alors la conservation de l’Etat est incompatible avec la sienne, il faut qu’un des deux périsse, & quand on fait mourir le coupable, c’est moins comme Citoyen que comme ennemi. Les procédures, le jugement, sont les preuves & la déclaration qu’il a rompu le traité social, & par conséquent qu’il n’est plus membre de l’Etat. Or comme il s’est reconnu tel, tout au moins par son séjour, il en doit être retranché par l’exil comme infracteur du pacte, ou par la mort comme ennemi public ; car un tel ennemi n’est pas une personne morale, c’est un homme, & c’est alors que le droit de la guerre est de tuer le vaincu.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '71'
        source_sequence: 137
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/83
        printed_page_end: '72'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c05-004-print
    translation_ja: さらに、社会の権利を侵す悪事を働いた者は、その犯罪によって祖国への反逆者、裏切り者となる。国の法律を破ってその構成員ではなくなり、国に対して戦争さえ起こすのだ。そのときは、国家の存続とその者の生存は両立しない。どちらか一方が滅びなければならない。そこで罪人を死に至らせるのは、市民としてというより敵としてである。手続と判決は、その人が社会の取り決めを破った、したがってもはや国家の構成員ではないということの証明であり宣言である。だがその人は、少なくともそこに暮らすということで、自分を国家の構成員だと認めていた。だから、盟約を破った者として追放するか、公の敵として死をもって排除しなければならない。そのような敵は道徳的人格ではなく、一人の人間であり、この場合には戦争の権利は敗者を殺すことにあるからだ。
    translation_status: reviewed
  - id: rsc-b2-c05-005
    section_id: rsc-b2-c05
    kind: paragraph
    origin: source
    source_text: Mais dira-t-on, la condannation d’un Criminel est un acte particulier. D’accord ; aussi cette condannation n’appartient-elle point au Souverain ; c’est un droit qu’il peut conférer sans pouvoir l’exercer lui-même. Toutes mes idées se tiennent, mais je ne saurois les exposer toutes à la fois.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '72'
        source_sequence: 138
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/84
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c05-005-print
    translation_ja: だが、犯罪者に刑を宣告するのは個別の行為だと言われよう。そのとおりであって、この宣告は主権者に属さない。それは主権者が与えることはできても、自分では行使できない権利である。私の考えはすべてつながっているが、一度にすべてを述べることはできない。
    translation_status: reviewed
  - id: rsc-b2-c05-006
    section_id: rsc-b2-c05
    kind: paragraph
    origin: source
    source_text: Au reste la fréquence des supplices est toujours un signe de foiblesse ou de paresse dans le Gouvernement. Il n’y a point de méchant qu’on ne pût rendre bon à quelque chose. On n’a droit de faire mourir, même pour l’exemple, que celui qu’on ne peut conserver sans danger.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '72'
        source_sequence: 139
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/84
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c05-006-print
    translation_ja: なお、処刑が頻繁なのは、つねに政府が弱いか怠慢であるしるしだ。どんな悪人でも、何かの役に立つようにできない者はいない。見せしめのためであっても、死なせる権利があるのは、危険なしに生かしておけない者についてだけだ。
    translation_status: reviewed
  - id: rsc-b2-c05-007
    section_id: rsc-b2-c05
    kind: paragraph
    origin: source
    source_text: 'A l’egard du droit de faire grace, ou d’exempter un coupable de la peine portée par la loi & prononcée par le juge, il n’appartient qu’à celui qui est au dessus du juge & de la loi, c’est-à-dire au Souverain : Encore son droit en ceci n’est-il pas bien net, & les cas d’en user sont-ils très rares. Dans un État bien gouverné il y a peu de punitions, non parce qu’on fait beaucoup de graces, mais parce qu’il y a peu de criminels : la multitude des crimes en assure l’impunité lorsque l’État dépérit. Sous la République Romaine jamais le Sénat ni les Consuls ne tenterent de faire grace ; le peuple même n’en faisoit pas, quoiqu’il révocât quelquefois son propre jugement. Les fréquentes graces annoncent que bientôt les forfaits n’en auront plus besoin, & chacun voit où cela mene. Mais je sens que mon cœur murmure & retient ma plume ; laissons discuter ces questions à l’homme juste qui n’a point failli, & qui jamais n’eût lui-même besoin de grace.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '72'
        source_sequence: 140
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/84
        printed_page_end: '74'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c05-007-print
    translation_ja: 恩赦を与える権利、すなわち法律の定め、裁判官の宣告した刑を免除する権利は、裁判官と法律の上に立つ者、すなわち主権者だけに属する。それでも、この点での主権者の権利はさほど明確ではなく、行使すべき場合はごくわずかだ。よく治められた国に刑罰が少ないのは、恩赦が多いからでなく、犯罪者が少ないからである。国家が衰えると、犯罪の多さが、犯罪が罰せられないことの保証となる。ローマ共和国では、元老院も執政官も、恩赦を試みたことは一度もない。人民でさえ、自らの判決を撤回することはあっても、恩赦は与えなかった。頻繁な恩赦は、じきに犯罪が恩赦すら必要としなくなることを告げる。どこへ行き着くかは、誰にも見えるだろう。だが、心のうちに不満の声が起こって、筆を止めさせるのを感じる。こうした問題を論じるのは、過ちを犯さず、自分が恩赦を必要としたこともない正しい人に任せよう。
    translation_status: reviewed
  - id: rsc-b2-c06-heading
    section_id: rsc-b2-c06
    kind: heading
    origin: source
    source_text: CHAPITRE VI.
    source_languages:

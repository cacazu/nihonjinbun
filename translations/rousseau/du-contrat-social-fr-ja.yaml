  - id: rsc-b3-c10-title
    section_id: rsc-b3-c10
    kind: heading
    origin: source
    source_text: De l’abus du Gouvernement, & de sa pente à dégénérer.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '192'
        source_sequence: 345
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/204
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c10-title-print
    translation_ja: 政府の濫用と、その堕落への傾き
    translation_status: reviewed
  - id: rsc-b3-c10-001
    section_id: rsc-b3-c10
    kind: paragraph
    origin: source
    source_text: Comme la volonté particuliere agit sans cesse contre la volonté générale, ainsi le Gouvernement fait un effort continuel contre la Souveraineté. Plus cet effort augmente, plus la constitution s’altere, & comme il n’y a point ici d’autre volonté de corps qui résistant à celle du Prince fasse équilibre avec elle, il doit arriver tôt ou tard que le Prince opprime enfin le Souverain & rompe le traité Social. C’est-là le vice inhérent & inévitable qui dès la naissance du corps politique tend sans relàche à le détruire, de même que la vieillesse & la mort détruisent enfin le corps de l’homme.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '192'
        source_sequence: 346
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/204
        printed_page_end: '193'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c10-001-print
    translation_ja: 個別の意志が絶えず一般意志に逆らってはたらくように、政府は絶えず主権に逆らおうとする。この力が大きくなるほど、体制は損なわれる。ここには統治者の意志に抵抗し、これと釣り合う、別の団体の意志がない。だから遅かれ早かれ、統治者はついに主権者を抑圧し、社会の取り決めを破る。老いと死がついには人間の体を壊すように、これは政治体に固有で避けがたく、その誕生以来、絶えずそれを壊そうとする欠陥である。
    translation_status: reviewed
  - id: rsc-b3-c10-002
    section_id: rsc-b3-c10
    kind: paragraph
    origin: source
    source_text: Il y a deux voyes générales par lesquelles un Gouvernement dégénere ; savoir, quand il se resserre, ou quand l’Etat se dissoût.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '193'
        source_sequence: 347
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/205
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c10-002-print
    translation_ja: 政府が堕落するおもな道筋は二つある。政府が少人数に狭められる場合と、国家が解体する場合である。
    translation_status: reviewed
  - id: rsc-b3-c10-003
    section_id: rsc-b3-c10
    kind: paragraph
    origin: source
    source_text: Le Gouvernement se resserre quand il passe du grand nombre au petit, c’est-à-dire de la Démocratie à l’Aristocratie, & de l’Aristocratie à la Royauté. C’est-là son inclinaison naturelle. S’il rétrogradoit du petit nombre au grand, on pourroit dire qu’il se relâche, mais ce progrès inverse est impossible.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '193'
        source_sequence: 348
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/205
        printed_page_end: '194'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c10-003-print
    translation_ja: 政府が狭まるのは、多数から少数へ、すなわち民主政から貴族政へ、貴族政から王政へ移るときである。これが自然の傾向だ。少数から多数へと逆戻りするなら、政府はゆるむと言えるが、この逆の推移は起こりえない。
    translation_status: reviewed
  - id: rsc-note-24-text
    section_id: rsc-b3-c10
    kind: note_body
    origin: source
    source_text: 'La formation lente & le progrès de la République de Venise dans ses lagunes offre un exemple notable de cette succession ; & il est bien étonnant que depuis plus de douze cens ans les Vénitiens semblent n’en être encore qu’au second terme, lequel commença au Serrar di Consiglio en 1198. Quant aux anciens Ducs qu’on leur reproche, quoi qu’en puisse dire le squitinio della libertà veneta, il est prouvé qu’ils n’ont point été leurs Souverains. On ne manquera pas de m’objecter la République Romaine, qui suivit, dira-t-on, un progrès tout contraire, passant de la monarchie à l’Aristocratie, & de l’Aristocratie à la Démocratie. Je suis bien éloigné d’en penser ainsi. Le premier établissement de Romulus fut un Gouvernement mixte qui dégénéra promptement en Despotisme. Par des causes particulieres l’Etat périt avant le tems, comme on voit mourir un nouveau-né avant d’avoir atteint l’âge d’homme. L’expulsion des Tarquins fut la véritable époque de la naissance de la République. Mais elle ne prit pas d’abord une forme constante, parce qu’on ne fit que la moitié de l’ouvrage en n’abolissant pas le patriciat. Car de cette maniere l’Aristocratie héréditaire, qui est la pire des administrations légitimes, restant en conflit avec la Démocratie, la forme du Gouvernement toujours incertaine & flotante ne fut fixée, comme l’a prouvé Machiavel, qu’à l’établissement des Tribuns ; alors seulement il y eut un vrai Gouvernement & une véritable Démocratie. En effet le peuple alors n’étoit pas seulement Souverain mais aussi magistrat & juge, le Sénat n’étoit qu’un tribunal en sous-ordre, pour tempérer ou concentrer le Gouvernement, & les Consuls eux-mêmes, bien que Patriciens, bien que premiers Magistrats, bien que Généraux absolus à la guerre, n’étoient à Rome que les présidens du peuple. Dès lors, on vit aussi le Gouvernement prendre sa pente naturelle & tendre fortement à l’Aristocratie. Le Patriciat s’abolissant comme de lui-même, l’Aristocratie n’étoit plus dans le corps des Patriciens comme elle est à Venise & à Genes, mais dans le corps du Sénat composé de Patriciens & de Plebeyens, même dans le corps des Tribuns quand ils commencerent d’usurper une puissance active : car les mots ne font rien aux choses, & quand le peuple a des chefs qui gouvernent pour lui, quelque nom que portent ces chefs, c’est toujours une Aristocratie. De l’abus de l’Aristocratie naquirent les guerres civiles & le Triumvirat. Sylla, Jules-Cesar, Auguste devinrent dans le fait de véritables Monarques, & enfin, sous le Despotisme de Tibere, l’Etat fut dissout. L’histoire Romaine ne dément donc pas mon principe ; elle le confirme.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '193'
        source_sequence: 349
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/205
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-24-text-print
    translation_ja: 潟におけるヴェネツィア共和国のゆっくりした形成と発展は、この変化の目を引く例である。千二百年以上がたっても、なお第二段階にとどまっているように見えるのは、まことに驚くべきことだ。その段階は一一九八年の大評議会の閉鎖に始まった。それ以前の総督を挙げて共和国の例ではないと異議を唱える人もいるが、『ヴェネツィアの自由の検討』が何と言おうと、総督たちが主権者ではなかったことは立証されている。ローマ共和国を引き合いに出す人もきっといるだろう。君主政から貴族政、そして貴族政から民主政へと、正反対の道をたどったというのである。私はまったくそう思わない。ロムルスが初めに立てたのは、すぐに専制となった混合政府だった。特別の原因により、新生児が大人になる前に死ぬように、国家は時を待たずに滅びた。タルクィニウス家の追放が、共和国の真の誕生だった。しかし門閥の制度を廃止せず、仕事が半分しかなされなかったために、初めから定まった形を取ったわけではなかった。こうして、正当な行政のうちで最悪の世襲貴族政と、民主政との対立が続き、政府の形はつねに不確かで揺れ動いた。マキアヴェッリが示したように、これが定まったのは、護民官が設けられたときになってからだ。そのときはじめて、真の政府、真の民主政があった。実際、そのときの人民は、主権者であるばかりでなく、行政官でも裁判官でもあった。元老院は政府を調整したり集中させたりする下位の機関にすぎなかった。執政官自身も、門閥の一員で、第一の行政官であり、戦場では絶対の将軍でありながら、ローマでは人民の議長にすぎなかった。それ以後、政府は自然の傾向を取り、貴族政へ強く傾いた。門閥の特権がひとりでに消えてゆくと、貴族政を担ったのは、ヴェネツィアやジェノヴァのような門閥の団体ではなく、門閥と平民からなる元老院であった。それどころか護民官が能動的な力を横取りしはじめると、護民官団もこれを担った。名前では物事は変わらず、人民が自分に代わって統治する長たちを持てば、その長たちが何と呼ばれようと、つねに貴族政だからだ。貴族政の濫用から内戦と三頭政治が生まれた。スッラ、ユリウス・カエサル、アウグストゥスは事実上の君主となり、ついにはティベリウスの専制のもとで国家は解体した。だからローマの歴史は私の原理を否定するどころか、裏づけるのである。
    translation_status: reviewed
  - id: rsc-b3-c10-004
    section_id: rsc-b3-c10
    kind: paragraph
    origin: source
    source_text: En effet, jamais le Gouvernement ne change de forme que quand son ressort usé le laisse trop affoibli pour pouvoir conserver la sienne. Or s’il se relâchoit encore en s’étendant, sa force deviendroit tout-à-fait nulle, & il subsisteroit encore moins. Il faut donc remonter & serrer le ressort à mesure qu’il cede, autrement l’Etat qu’il soutient tomberoit en ruine.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '194'
        source_sequence: 350
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/206
        printed_page_end: '195'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c10-004-print
    translation_ja: 実際、政府が形を変えるのは、ばねがすり減り、今の形を保てないほど弱ったときだけだ。ところが、広がることでさらにゆるむなら、力はすっかりなくなり、ますます存続できない。だから、ばねがゆるむにつれて巻き直し、しめ直さなくてはならない。そうでなければ、そのばねに支えられた国家は崩れ落ちるだろう。
    translation_status: reviewed
  - id: rsc-b3-c10-005
    section_id: rsc-b3-c10
    kind: paragraph
    origin: source
    source_text: Le cas de la dissolution de l’Etat peut arriver de deux manieres.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '195'
        source_sequence: 351
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/207
        printed_page_end: '196'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c10-005-print
    translation_ja: 国家の解体は、二通りの仕方で起こりうる。
    translation_status: reviewed
  - id: rsc-b3-c10-006
    section_id: rsc-b3-c10
    kind: paragraph
    origin: source
    source_text: Premierement quand le Prince n’administre plus l’État selon les loix & qu’il usurpe le pouvoir souverain. Alors il se fait un changement remarquable ; c’est que, non pas le Gouvernement, mais l’État se resserre ; je veux dire que le grand État se dissout & qu’il s’en forme un autre dans celui-là, composé seulement des membres du Gouvernement, & qui n’est plus rien au reste du Peuple que son maitre & son tiran. De sorte qu’à l’instant que le Gouvernement usurpe la souveraineté, le pacte social est rompu, & tous les simples Citoyens, rentrés de droit dans leur liberté naturelle, sont forcés mais non pas obligés d’obéir.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '196'
        source_sequence: 352
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/208
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c10-006-print
    translation_ja: 第一に、統治者がもはや法に従って国家を治めず、主権を横取りするときである。そのとき、目を引く変化が起きる。狭まるのは政府ではなく、国家である。つまり、大きな国家が解体して、その内に、政府の成員だけからなる別の国家ができる。それは残りの人民にとって、主人、暴君でしかない。だから政府が主権を横取りした瞬間、社会盟約は破られ、普通の市民はすべて、権利の上ではもとの自然の自由に戻る。彼らは従うことを強いられはするが、従う義務はない。
    translation_status: reviewed
  - id: rsc-b3-c10-007
    section_id: rsc-b3-c10
    kind: paragraph
    origin: source
    source_text: Le meme cas arrive aussi quand les membres du Gouvernement usurpent séparément le pouvoir qu’ils ne doivent exercer qu’en corps ; ce qui n’est pas une moindre infraction des loix, & produit encore un plus grand désordre. Alors on a, pour ainsi dire, autant de Princes que de Magistrats, & l’Etat, non moins divisé que le Gouvernement, périt ou change de forme.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '196'
        source_sequence: 353
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/208
        printed_page_end: '197'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c10-007-print
    translation_ja: 政府の成員が、一団としてしか使うべきでない権力を、ばらばらに横取りする場合にも、同じことが起こる。これは劣らず重大な法律違反で、むしろいっそう大きな混乱を生む。そのとき、いわば行政官の数だけ統治者がいることになり、政府と同じほど割れた国家は、滅びるか形を変えるかする。
    translation_status: reviewed
  - id: rsc-b3-c10-008
    section_id: rsc-b3-c10
    kind: paragraph
    origin: source
    source_text: Quand l’Etat se dissout, l’abus du Gouvernement quel qu’il soit prend le nom commun d’anarchie. En distingant, la Démocratie dégénere en Ochlocratie, l’Aristocratie en Olygarchie ; j’ajoûterois que la Royauté dégénere en Tyrannie, mais ce dernier mot est équivoque & demande explication.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '197'
        source_sequence: 354
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/209
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c10-008-print
    translation_ja: 国家が解体すると、どの政府の濫用にも、無政府状態という共通の名がつく。区別して言えば、民主政は衆愚政に、貴族政は寡頭政に堕落する。王政は僭主政に堕落する、とつけ加えたいが、この最後の語にはいくつかの意味があるので、説明が必要だ。
    translation_status: reviewed
  - id: rsc-b3-c10-009
    section_id: rsc-b3-c10
    kind: paragraph
    origin: source
    source_text: 'Dans le sens vulgaire un Tyran est un Roi qui gouverne avec violence & sans égard à la justice & aux loix. Dans le sens précis un Tyran est un particulier qui s’arroge l’autorité royale sans y avoir droit. C’est ainsi que les Grecs entendoient ce mot de Tyran : Ils le donnoient indifféremment aux bons & aux mauvais Princes dont l’autorité n’étoit pas légitime. Ainsi Tyran & usurpateur sont deux mots parfaitement synonimes.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '197'
        source_sequence: 355
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/209
        printed_page_end: '198'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c10-009-print
    translation_ja: 普通の意味で僭主とは、暴力を用い、正義も法も顧みずに治める王である。厳密な意味では、その権利を持たずに、王の権威を専有する一私人である。ギリシア人が僭主という語を理解したのは、この意味だった。権威が正当でなければ、統治者の善悪を問わず、この名を与えた。したがって、僭主と簒奪者は、まったく同じ意味の言葉である。
    translation_status: reviewed
  - id: rsc-note-25-text
    section_id: rsc-b3-c10
    kind: note_body
    origin: source
    source_text: 'Omnes enim & habentur & dicuntur Tyranni qui potestate utuntur perpetua, in eà Civitate quæ libertate usa est. Corn. Nep. in Miltiad : Il est vrai qu’Aristote Mor : Nicom. L. VIII, c. 10 distingue le Tyran du Roi, en ce que le premier gouverne pour sa propre utilité & le second seulement pour l’utilité de ses sujets ; mais outre que généralement tous les auteurs grecs ont pris le mot Tyran dans un autre sens, comme il paroit sur-tout par le Hieron de Xenophon, il s’en suivroit de la distinction d’Aristote que depuis le commencement du monde il n’auroit pas encore existé un seul Roi.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '198'
        source_sequence: 356
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/210
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-25-text-print
    translation_ja: 「自由を享受してきた市民共同体で、永続する権力を行使する者は、すべて僭主と見なされ、そう呼ばれる。」コルネリウス・ネポス『ミルティアデス伝』。確かにアリストテレスは『ニコマコス倫理学』第八巻第十章で、前者は自分の利益のために、後者は臣民の利益のためだけに統治するという点で、僭主と王を区別した。しかし、クセノポンの『ヒエロン』でとりわけ明らかなように、ギリシアの著述家はおおむね僭主の語を別の意味で取った。それだけでなく、アリストテレスの区別によれば、世界が始まって以来、一人の王もまだ存在しないことになる。
    translation_status: reviewed
  - id: rsc-b3-c10-010
    section_id: rsc-b3-c10
    kind: paragraph
    origin: source
    source_text: Pour donner différens noms à différentes choses, j’appelle Tyran l’usurpateur de l’autorité royale, & Despote l’usurpateur du pouvoir Souverain. Le Tyran est celui qui s’ingere contre les loix à gouverner selon les loix ; le Despote est celui qui se met au dessus des loix-mêmes. Ainsi le Tyran peut n’être pas Despote, mais le Despote est toujours Tyran.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '198'
        source_sequence: 357
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/210
        printed_page_end: '199'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c10-010-print
    translation_ja: 違うものには違う名を与えるため、私は王の権威を奪う者を僭主、主権を奪う者を専制君主と呼ぶ。僭主は法に逆らって統治に割り込み、法に従って治める者であり、専制君主は自分を法そのものの上に置く者である。したがって、僭主は専制君主とは限らないが、専制君主はつねに僭主である。
    translation_status: reviewed
  - id: rsc-b3-c11-heading
    section_id: rsc-b3-c11
    kind: heading
    origin: source
    source_text: CHAPITRE XI.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '199'
        source_sequence: 358
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/211
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c11-heading-print
    translation_ja: 第十一章
    translation_status: reviewed
  - id: rsc-b3-c11-title
    section_id: rsc-b3-c11
    kind: heading
    origin: source
    source_text: De la mort du corps politique.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '199'
        source_sequence: 359
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/211
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c11-title-print
    translation_ja: 政治体の死について
    translation_status: reviewed
  - id: rsc-b3-c11-001
    section_id: rsc-b3-c11
    kind: paragraph
    origin: source
    source_text: Telle est la pente naturelle & inévitable des Gouvernemens les mieux constitués. Si Sparte & Rome ont péri, quel État peut espérer de durer toujours ? Si nous voulons former un établissement durable, ne songeons donc point à le rendre éternel. Pour réussir il ne faut pas tenter l’impossible, ni se flater de donner à l’ouvrage des hommes une solidité que les choses humaines ne comportent pas.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '199'
        source_sequence: 360
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/211
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c11-001-print
    translation_ja: これが、最もよく組み立てられた政府にもある、自然で避けがたい傾向である。スパルタもローマも滅びたのに、どの国家がいつまでも続く望みを持てようか。長続きする制度をつくろうとするなら、それを永遠にしようなどとは考えないことだ。成功したいなら、できないことを試みたり、人間のつくるものには備わりえない堅固さを、人間の仕事に与えられるとうぬぼれたりしてはならない。
    translation_status: reviewed
  - id: rsc-b3-c11-002
    section_id: rsc-b3-c11
    kind: paragraph
    origin: source
    source_text: Le corps politique, aussi bien que le corps de l’homme, commence à mourir dès sa naissance & porte en lui-même les causes de sa déstruction. Mais l’un & l’autre peut avoir une constitution plus ou moins robuste & propre à le conserver plus ou moins longtems. La constitution de l’homme est l’ouvrage de la nature, celle de l’Etat est l’ouvrage de l’art. Il ne dépend pas des hommes de prolonger leur vie, il depend d’eux de prolonger celle de l’Etat aussi loin qu’il est possible, en lui donnant la meilleure constitution qu’il puisse avoir. Le mieux constitué finira, mais plus tard qu’un autre, si nul accident imprévu n’amene sa perte avant le tems.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '199'
        source_sequence: 361
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/211
        printed_page_end: '200'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c11-002-print
    translation_ja: 人間の体と同様に、政治体も生まれたときから死にはじめ、その中に自らの破滅の原因を抱えている。しかし、どちらもかなり丈夫なことも、そうでないこともあり、それに応じて長くも短くも存続する。人間の体のつくりは自然の作品であり、国家の体制は人の技の作品である。自分の命を延ばすのは人間の力ではどうにもならないが、国家に最善の体制を与えて、国家の命をできるだけ延ばすのは、人間にかかっている。最善の体制でも終わりは来る。だが、不測の出来事が時ならぬ破滅を呼ばなければ、ほかの体制より終わりは遅く来る。
    translation_status: reviewed
  - id: rsc-b3-c11-003
    section_id: rsc-b3-c11
    kind: paragraph
    origin: source
    source_text: 'Le principe de la vie politique est dans l’autorité Souveraine. La puissance législative est le cœur de l’Etat, la puissance exécutive en est le cerveau, qui donne le mouvement à toutes les parties. Le cerveau peut tomber en paralysie & l’individu vivre encore. Un homme reste imbécile & vit : mais sitôt que le cœur a cessé ses fonctions, l’animal est mort.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '200'
        source_sequence: 362
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/212
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c11-003-print
    translation_ja: 政治の生命の原理は、主権者の権威にある。立法権は国家の心臓であり、行政権はその脳で、あらゆる部分に動きを与える。脳が麻痺しても、個体はまだ生きられる。判断力を失っても人は生きている。しかし、心臓がはたらくのをやめると、その生き物は死ぬ。
    translation_status: reviewed
  - id: rsc-b3-c11-004
    section_id: rsc-b3-c11
    kind: paragraph
    origin: source
    source_text: Ce n’est point par les loix que l’Etat subsiste, c’est par le pouvoir législatif. La loi d’hier n’oblige pas aujourd’hui, mais le consentement tacite est présumé du silence, & le Souverain est censé confirmer incessamment les loix qu’il n’abroge pas, pouvant le faire. Tout ce qu’il a déclaré vouloir une fois il le veut toujours, à moins qu’il ne le révoque.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '200'
        source_sequence: 363
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/212
        printed_page_end: '201'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c11-004-print
    translation_ja: 国家は法律によって存続するのではない。立法する力によって存続する。昨日の法律そのものが、今日も人を拘束するのではない。沈黙から黙示の同意が推定されるのであり、主権者は廃止できるのに廃止しない法を、たえず承認していると見なされる。一度望むと宣言したことは、撤回しないかぎり、すべて望み続けているのである。
    translation_status: reviewed
  - id: rsc-b3-c11-005
    section_id: rsc-b3-c11
    kind: paragraph
    origin: source
    source_text: Pourquoi donc porte-t-on tant de respect aux anciennes loix ? C’est pour cela même. On doit croire qu’il n’y a que l’excellence des volontés antiques qui les ait pu conserver si longtems ; si le Souverain ne les eut reconnu constamment salutaires il les eut mille fois révoquées. Voilà pourquoi loin de s’affoiblir les loix acquierent sans cesse une force nouvelle dans tout État bien constitué ; le préjugé de l’antiquité les rend chaque jour plus vénérables ; au lieu que par-tout où les loix s’affoiblissent en vieillissant, cela prouve qu’il n’y a plus de pouvoir législatif, & que l’État ne vit plus.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '201'
        source_sequence: 364
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/213
        printed_page_end: '202'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c11-005-print
    translation_ja: それなら、古くからの法律をなぜこれほど尊重するのか。まさにそれゆえである。昔の意志が優れていたからこそ、これらの法はそれほど長く保たれた、と考えなければならない。主権者が変わらず有益だと認めてこなかったなら、とうに、何度も取り消したはずだ。だから、よい体制の国家では、法律は衰えるどころか、絶えず新たな力を得る。古いものを尊ぶ心が、日に日にそれをいっそう尊いものにする。反対に、法律が年とともに弱るところでは、立法権がもはやなく、国家がもはや生きていないことを示している。
    translation_status: reviewed
  - id: rsc-b3-c12-heading
    section_id: rsc-b3-c12
    kind: heading
    origin: source
    source_text: CHAPITRE XII.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '202'
        source_sequence: 365
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/214
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c12-heading-print
    translation_ja: 第十二章
    translation_status: reviewed
  - id: rsc-b3-c12-title
    section_id: rsc-b3-c12
    kind: heading
    origin: source
    source_text: Comment se maintient l’autorité Souveraine.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '202'
        source_sequence: 366
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/214
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c12-title-print
    translation_ja: 主権者の権威はどう保たれるか
    translation_status: reviewed
  - id: rsc-b3-c12-001
    section_id: rsc-b3-c12
    kind: paragraph
    origin: source
    source_text: 'Le Souverain n’ayant d’autre force que la puissance législative n’agit que par des loix, & les loix n’étant que des actes authentiques de la volonté générale, le Souverain ne sauroit agir que quand le peuple est assemblé. Le peuple assemblé, dira-t-on ! Quelle chimere ! C’est une chimere aujourd’hui, mais ce n’en étoit pas une il y a deux mille ans : Les hommes ont-ils changé de nature ?'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '202'
        source_sequence: 367
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/214
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c12-001-print
    translation_ja: 主権者は立法権以外の力を持たず、法律によってしか行動しない。法律は一般意志の真正な行為にほかならない。したがって主権者が行動できるのは、人民が集まったときだけである。人民が集まるだと、なんという夢物語だ、と言われよう。今日こそ夢物語だが、二千年前にはそうではなかった。人間の本性は変わったとでもいうのか。
    translation_status: reviewed
  - id: rsc-b3-c12-002
    section_id: rsc-b3-c12
    kind: paragraph
    origin: source
    source_text: 'Les bornes du possible dans les choses morales sont moins étroites que nous ne pensons : Ce sont nos foiblesses, nos vices, nos préjugés qui les rétrécissent. Les ames basses ne croyent point aux grands hommes : de vils esclaves sourient d’un air moqueur à ce mot de liberté.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '202'
        source_sequence: 368
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/214
        printed_page_end: '203'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c12-002-print
    translation_ja: 人の行いにかかわる事柄で、可能なことの範囲は、思っているほど狭くない。狭くしているのは、われわれの弱さ、悪徳、偏見である。心の卑しい者は偉大な人間を信じない。卑屈な奴隷は、自由という言葉を聞いて、あざ笑うようにほほえむ。
    translation_status: reviewed
  - id: rsc-b3-c12-003
    section_id: rsc-b3-c12
    kind: paragraph
    origin: source
    source_text: Par ce qui s’est fait considérons ce qui se peut faire ; je ne parlerai pas des anciennes républiques de la Grece, mais la République romaine étoit, ce me semble, un grand État, & la ville de Rome une grande ville. Le dernier Cens donna dans Rome quatre cent mille Citoyens portans armes, & le dernier dénombrement de l’Empire plus de quatre millions de Citoyens sans compter les sujets, les étrangers, les femmes, les enfans, les esclaves.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '203'
        source_sequence: 369
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/215
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c12-003-print
    translation_ja: 現に行われたことから何ができるかを考えよう。古代ギリシアの共和国については語るまい。だがローマ共和国は大国であり、ローマ市は大都市だったと私には思われる。最後の市民調査では、ローマ市に武器を取れる市民が四十万人おり、帝国の最後の調査では、臣民、外国人、女性、子ども、奴隷を数えなくとも、市民が四百万人を超えた。
    translation_status: reviewed
  - id: rsc-b3-c12-004
    section_id: rsc-b3-c12
    kind: paragraph
    origin: source
    source_text: Quelle difficulté n’imagineroit-on pas d’assembler fréquemment le peuple immense de cette capitale & de ces environs ? Cependant il se passoit peu de semaines que le peuple romain ne fut assemblé, & même plusieurs fois. Non seulement il exerceoit les droit de la souveraineté, mais une partie de ceux du Gouvernement. Il traittoit certaines affaires, il jugeoit certaines causes, & tout ce peuple étoit sur la place publique presque aussi souvent magistrat que Citoyen.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '203'
        source_sequence: 370
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/215
        printed_page_end: '204'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c12-004-print
    translation_ja: この首都やその近辺の、膨大な数の人民をしばしば集めるのに、どんな難しさがあると想像されるだろう。ところがローマの人民が集まらない週はほとんどなく、一週間に何度も集まることさえあった。主権の権利を行使したばかりでなく、政府の権利も一部分行使した。特定の案件を処理し、特定の訴訟を裁き、この人民全体が公の広場で、市民として振る舞うのとほとんど同じくらいしばしば、行政官として振る舞ったのである。
    translation_status: reviewed
  - id: rsc-b3-c12-005
    section_id: rsc-b3-c12
    kind: paragraph
    origin: source
    source_text: 'En remontant aux premiers tems des Nations on trouveroit que la plupart des anciens gouvernemens, même monarchiques tels que ceux des Macédoniens & des Francs, avoient de semblables Conseils. Quoi qu’il en soit, ce seul fait incontestable répond à toutes les difficultés : De l’existant au possible la conséquence me paroit bonne.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '204'
        source_sequence: 371
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/216
        printed_page_end: '205'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c12-005-print
    translation_ja: 諸国のはじまりまでさかのぼれば、マケドニアやフランクのような君主国を含めて、古い政府の多くにこれと似た評議会があったとわかるだろう。いずれにせよ、争う余地のないこの一つの事実が、すべての難問に答える。現にあったことから、ありうることを導くのは、筋の通った推論だと思う。
    translation_status: reviewed
  - id: rsc-b3-c13-heading
    section_id: rsc-b3-c13
    kind: heading
    origin: source
    source_text: CHAPITRE XIII.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '205'
        source_sequence: 372
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/217
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c13-heading-print
    translation_ja: 第十三章
    translation_status: reviewed
  - id: rsc-b3-c13-title
    section_id: rsc-b3-c13
    kind: heading
    origin: source
    source_text: Suite.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '205'
        source_sequence: 373
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/217
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c13-title-print
    translation_ja: 続き
    translation_status: reviewed
  - id: rsc-b3-c13-001
    section_id: rsc-b3-c13
    kind: paragraph
    origin: source
    source_text: 'Il ne suffit pas que le peuple assemblé ait une fois fixé la constitution de l’Etat en donnant la sanction à un corps de loix : il ne suffit pas qu’il ait établi un Gouvernement perpétuel ou qu’il ait pourvu une fois pour toutes à l’élection des magistrats. Outre les assemblées extraordinaires que des cas imprévus peuvent exiger, il faut qu’il y en ait de fixes & de périodiques que rien ne puisse abolir ni proroger, tellement qu’au jour marqué le peuple soit légitimement convoqué par la loi, sans qu’il soit besoin pour cela d’aucune autre convocation formelle.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '205'
        source_sequence: 374
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/217
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c13-001-print
    translation_ja: 集まった人民が、ひとたび一連の法律を承認して国家の体制を定めただけでは足りない。恒久的な政府をつくっただけでも、行政官を選ぶ方法を一度で決めたというだけでも足りない。予想できない場合に開く臨時の集会とは別に、日を決めて定期的に開く集会が必要である。その集会は、どんなことがあっても廃止したり延期したりできないようにする。決められた日には、法が人民を正当に召集するので、それ以外に正式の召集を一切必要としないほどでなければならない。
    translation_status: reviewed
  - id: rsc-b3-c13-002
    section_id: rsc-b3-c13
    kind: paragraph
    origin: source
    source_text: Mais hors de ces assemblées juridiques par leur seule date, toute assemblée du Peuple qui n’aura pas été convoquée par les magistrats préposés à cet effet & selon les formes prescrites doit être tenue pour illégitime & tout ce qui s’y fait pour nul ; parce que l’ordre même de s’assembler doit émaner de la loi.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '205'
        source_sequence: 375
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/217
        printed_page_end: '206'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c13-002-print
    translation_ja: しかし、日付だけで合法となるこの集会のほかは、担当の行政官が定められた方式で召集しなかった人民集会は、どれも正当でないと見なされなければならない。そこでなされたことも、すべて無効である。集まれという命令そのものが、法律から出なければならないからだ。
    translation_status: reviewed
  - id: rsc-b3-c13-003
    section_id: rsc-b3-c13
    kind: paragraph
    origin: source
    source_text: Quant aux retours plus ou moins fréquens des assemblées légitimes, ils dépendent de tant de considérations qu’on ne sauroit donner là-dessus de regles précises. Seulement on peut dire en général que plus le Gouvernement a de force, plus le Souverain doit se montrer fréquemment.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '206'
        source_sequence: 376
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/218
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c13-003-print
    translation_ja: 正当な集会をどのくらいの間隔で開くべきかは、あまりに多くの事情にかかっていて、この点について厳密な規則は与えられない。ただ一般には、政府が強いほど、主権者はより頻繁に姿を現すべきだと言える。
    translation_status: reviewed
  - id: rsc-b3-c13-004
    section_id: rsc-b3-c13
    kind: paragraph
    origin: source
    source_text: Ceci me dira-t-on, peut être bon pour une seule ville ; mais que faire quand l’Etat en comprend plusieurs ? Partagera-t-on l’autorité Souveraine, ou bien doit-on la concentrer dans une seule ville & assujetir tout le reste ?
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '206'
        source_sequence: 377
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/218
        printed_page_end: '207'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c13-004-print
    translation_ja: これは都市が一つならよいかもしれないが、国家がいくつもの都市を含むときは、どうするのか、と言われよう。主権者の権威を分けるのか、それとも一つの都市に集めて、残りをすべて従わせるべきなのか。
    translation_status: reviewed
  - id: rsc-b3-c13-005
    section_id: rsc-b3-c13
    kind: paragraph
    origin: source
    source_text: Je reponds qu’on ne doit faire ni l’un ni l’autre. Premierement, l’autorité souveraine est simple & une, & l’on ne peut la diviser sans la détruire. En second lieu, une ville non plus qu’une Nation ne peut être légitimement sujette d’une autre, parce que l’essence du corps politique est dans l’accord de l’obéissance & de la liberté, & que ces mots de sujet & de souverain sont des corrélations identiques dont l’idée se réunit sous le seul mot de Citoyen.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '207'
        source_sequence: 378
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/219
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c13-005-print
    translation_ja: どちらもすべきではない、と答えよう。第一に、主権者の権威は単一で一つであり、壊さずに分けることはできない。第二に、国がそうであるように、都市も、他の都市の正当な臣民となることはできない。政治体の本質は、服従と自由が一つに合うところにあり、「臣民」と「主権者」は、互いに対応しながら同じものを指す語で、その二つの観念が、「市民」という一つの言葉に集まるからである。
    translation_status: reviewed
  - id: rsc-b3-c13-006
    section_id: rsc-b3-c13
    kind: paragraph
    origin: source
    source_text: 'Je reponds encore que c’est toujours un mal d’unir plusieurs villes en une seule cité, & que, voulant faire cette union, l’on ne doit pas se flater d’en éviter les inconvéniens naturels. Il ne faut point objecter l’abus des grands États à celui qui n’en veut que de petits : mais comment donner aux petits États assez de force pour résister aux grands ? Comme jadis les villes grecques résisterent au grand Roi, & comme plus récemment la Hollande & la Suisse ont resisté à la maison d’Autriche.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '207'
        source_sequence: 379
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/219
        printed_page_end: '208'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c13-006-print
    translation_ja: さらにいくつもの都市を一つの市民共同体に結ぶことは、つねに害をもたらす、と答えよう。この結合を望んでおきながら、それに自然についてくる不都合を避けられると、思い上がってはならない。小国しか望まない人に、大国の弊害を持ち出しても仕方がない。だが、小国に大国へ対抗するだけの力をどう与えるのか。昔、ギリシアの都市がペルシアの大王に抵抗したように、そしてより近く、オランダとスイスがオーストリアのハプスブルク家に抵抗したようにすればよい。
    translation_status: reviewed
  - id: rsc-b3-c13-007
    section_id: rsc-b3-c13
    kind: paragraph
    origin: source
    source_text: Toutefois si l’on ne peut réduire l’État à de justes bornes, il reste encore une ressource ; c’est de n’y point souffrir de capitale, de faire siéger le Gouvernement alternativement dans chaque ville, & d’y rassembler aussi tour-à-tour les États du pays.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '208'
        source_sequence: 380
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/220
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c13-007-print
    translation_ja: とはいえ、国家をふさわしい大きさまで縮められないなら、なお一つの手立てがある。首都を置かず、政府を各都市に順に置き、国の諸身分の会議もそれぞれの都市で順に開くことである。
    translation_status: reviewed
  - id: rsc-b3-c13-008
    section_id: rsc-b3-c13
    kind: paragraph
    origin: source
    source_text: Peuplez également le territoire, étendez-y par tout les mêmes droits, portez-y par-tout l’abondance & la vie, c’est ainsi que l’État deviendra tout à la fois le plus fort & le mieux gouverné qu’il soit possible. Souvenez-vous que les murs des villes ne se forment que du débris des maisons des champs. À chaque Palais que je vois élever dans la capitale, je crois voir mettre en mazures tout un pays.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '208'
        source_sequence: 381
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/220
        printed_page_end: '209'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c13-008-print
    translation_ja: 領土のどこにも等しく住民を置き、どこにも等しい権利を広げ、どこにも豊かさと活気をもたらせ。こうして、国家は同時に、できうるかぎり強く、よく治まる。都市の城壁は、農村の家のがれきでしかつくられないことを、忘れないでほしい。首都で宮殿が建つのを見るたび、国じゅうが廃屋に変わっていくのを見るような気がする。
    translation_status: reviewed
  - id: rsc-b3-c14-heading
    section_id: rsc-b3-c14
    kind: heading
    origin: source
    source_text: CHAPITRE XIV.
    source_languages:

  - id: rsc-b3-001
    section_id: rsc-b3
    kind: paragraph
    origin: source
    source_text: Avant de parler des diverses formes de Gouvernement, tâchons de fixer le sens précis de ce mot, qui n’a pas encore été fort bien expliqué.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762

    translation_status: reviewed
  - id: rsc-b1-c03-title
    section_id: rsc-b1-c03
    kind: heading
    origin: source
    source_text: Du droit du plus fort.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '10'
        source_sequence: 29
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/22
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c03-title-print
    translation_ja: 最も強い者の権利について
    translation_status: reviewed
  - id: rsc-b1-c03-001
    section_id: rsc-b1-c03
    kind: paragraph
    origin: source
    source_text: 'Le plus fort n’est jamais assez fort pour être toujours le maitre, s’il ne transforme sa force en droit & l’obéïssance en devoir. De-là le droit du plus fort ; droit pris ironiquement en apparence, & réellement établi en principe : Mais ne nous expliquera-t-on jamais ce mot ? La force est une puissance phisique ; je ne vois point quelle moralité peut résulter de ses effets. Céder à la force est un acte de nécessité, non de volonté ; c’est tout au plus un acte de prudence. En quel sens pourra-ce être un devoir ?'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '10'
        source_sequence: 30
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/22
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c03-001-print
    translation_ja: 最も強い者でさえ、力を権利に、服従を義務に変えなければ、いつまでも主人でいられるほどには強くない。そこから「最も強い者の権利」が出てくる。見かけは皮肉めいているが、実際には原理として通用している権利だ。しかし、この言葉の意味はいったい誰が説明してくれるのか。力は物理的な作用を及ぼすものだ。その作用から、どんな道徳的な意味が生まれるのか、私には見えない。力に屈するのは、やむをえずすることであって、自分の意志ですることではない。せいぜい用心からすることだ。どういう意味でそれが義務になりうるというのか。
    translation_status: reviewed
  - id: rsc-b1-c03-002
    section_id: rsc-b1-c03
    kind: paragraph
    origin: source
    source_text: Supposons un moment ce prétendu droit. Je dis qu’il n’en résulte qu’un galimathias inexplicable. Car sitôt que c’est la force qui fait le droit, l’effet change avec la cause ; toute force qui surmonte la premiere succéde à son droit. Sitôt qu’on peut désobéir impunément on le peut légitimement, & puisque le plus fort a toujours raison, il ne s’agit que de faire en sorte qu’on soit le plus fort. Or qu’est-ce qu’un droit qui périt quand la force cesse ? S’il faut obéir par force on n’a pas besoin d’obéir par devoir, & si l’on n’est plus forcé d’obéir on n’y est plus obligé. On voit donc que ce mot de droit n’ajoûte rien à la force ; il ne signifie ici rien du tout.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '10'
        source_sequence: 31
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/22
        printed_page_end: '11'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c03-002-print
    translation_ja: この権利とやらがあると、ひとまず仮定してみよう。そこから出てくるのは、どうにもつじつまの合わない話だけだ。力が権利をつくるなら、原因が変われば結果も変わる。もとの力に勝る力なら、何でもその権利を受け継ぐ。罰を受けずに背けるようになったとたん、背くのは正当になる。最も強い者がつねに正しいのなら、ただ最も強くなればよいことになる。しかし、力が尽きれば滅びるような権利とは何だろう。力ずくで従わなければならないなら、義務で従う必要はない。従うことを強いられなくなれば、従う義務もなくなる。結局、権利という語は、力に何一つ付け加えない。ここではまったく何も意味しないのだ。
    translation_status: reviewed
  - id: rsc-b1-c03-003
    section_id: rsc-b1-c03
    kind: paragraph
    origin: source
    source_text: 'Obeissez aux puissances. Si cela veut dire, cédez à la force, le précepte est bon mais superflu, je réponds qu’il ne sera jamais violé. Toute puissance vient de Dieu, je l’avoüe ; mais toute maladie en vient aussi. Est-ce à dire qu’il soit défendu d’appeller le médecin ? Qu’un brigand me surprenne au coin d’un bois : non seulement il faut par force donner la bourse, mais quand je pourrois la soustraire suis-je en conscience obligé de la donner ? car enfin le pistolet qu’il tient est aussi une puissance.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '11'
        source_sequence: 32
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/23
        printed_page_end: '12'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c03-003-print
    translation_ja: 「権威に従え」。それが「力に屈しろ」という意味なら、もっともだが余計な教えである。破られる心配などないからだ。あらゆる力は神から来ると認めよう。だが、あらゆる病も神から来る。ならば医者を呼ぶのは禁じられているのか。林のかたわらで追いはぎに襲われたとする。力ずくで財布を差し出すほかないとしても、隠しておけるときまで、良心にかけて差し出す義務があるのか。ともかく、相手の手にある短銃も一つの力なのだから。
    translation_status: reviewed
  - id: rsc-b1-c03-004
    section_id: rsc-b1-c03
    kind: paragraph
    origin: source
    source_text: Convenons donc que force ne fait pas droit, & qu’on n’est obligé d’obéir qu’aux puissances légitimes. Ainsi ma question primitive revient toujours.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '12'
        source_sequence: 33
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/24
        printed_page_end: '13'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c03-004-print
    translation_ja: だから、力は権利を生まず、従う義務があるのは正当な権力に対してだけだと認めよう。すると、もとの問いがやはり戻ってくる。
    translation_status: reviewed
  - id: rsc-b1-c04-heading
    section_id: rsc-b1-c04
    kind: heading
    origin: source
    source_text: CHAPITRE IV.
    source_languages:

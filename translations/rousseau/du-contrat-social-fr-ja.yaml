  - id: rsc-b1-c09-title
    section_id: rsc-b1-c09
    kind: heading
    origin: source
    source_text: Du domaine réel.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '40'
        source_sequence: 84
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/52
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c09-title-print
    translation_ja: 財産の支配について
    translation_status: reviewed
  - id: rsc-b1-c09-001
    section_id: rsc-b1-c09
    kind: paragraph
    origin: source
    source_text: 'Chaque membre de la communauté se donne à elle au moment qu’elle se forme, tel qu’il se trouve actuellement, lui & toutes ses forces, dont les biens qu’il possede font partie. Ce n’est pas que par cet acte la possession change de nature en changeant de mains, & devienne propriété dans celles du Souverain : Mais comme les forces de la Cité sont incomparablement plus grandes que celles d’un particulier, la possession publique est aussi dans le fait plus forte & plus irrévocable, sans être plus légitime, au moins pour les étrangers. Car l’Etat à l’égard de ses membres est maitre de tous leurs biens par le contract social, qui dans l’Etat sert de base à tous les droits ; mais il ne l’est à l’égard des autres Puissances que par le droit de premier occupant qu’il tient des particuliers.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '40'
        source_sequence: 85
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/52
        printed_page_end: '41'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c09-001-print
    translation_ja: 共同体の一員は、共同体ができるとき、自分の身と自分の力のすべてを、そのときのまま共同体に渡す。力のなかには、手元にある財産も含まれる。この行為によって占有が持ち主を替えること自体は、占有の性質を変えず、主権者の手で所有権に変わるわけでもない。しかし、市民共同体の力は一個人の力よりも比べものにならないほど大きいので、公の占有は、事実上より強固で、くつがえしにくい。ただし、少なくとも外部の者に対しては、より正当になるわけではない。国家は、その構成員に対しては、国家内のすべての権利の土台である社会契約によって、構成員の財産すべての主人である。だが他国に対しては、個々人から引き継いだ先占の権利によってのみ、その主人である。
    translation_status: reviewed
  - id: rsc-b1-c09-002
    section_id: rsc-b1-c09
    kind: paragraph
    origin: source
    source_text: Le droit de premier occupant, quoique plus réel que celui du plus fort, ne devient un vrai droit qu’après l’établissement de celui de propriété. Tout homme a naturellement droit à tout ce qui lui est nécessaire ; mais l’acte positif qui le rend propriétaire de quelque bien l’exclud de tout le reste. Sa part étant faite il doit s’y borner, & n’a plus aucun droit à la communauté. Voilà pourquoi le droit de premier occupant, si foible dans l’état de nature, est respectable à tout homme civil. On respecte moins dans ce droit ce qui est à autrui que ce qui n’est pas à soi.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '41'
        source_sequence: 86
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/53
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c09-002-print
    translation_ja: 先占の権利は、最も強い者の権利よりは実体があるが、所有権が確立されて初めて、真の権利になる。どんな人にも、生きるために必要なすべてのものに対して自然の権利がある。だが、ある財産の所有者となる明確な行為によって、それ以外のすべてのものからその人は除かれる。自分の取り分が定まれば、そこにとどまるべきであり、共有のものにもはや何の権利も持たない。だから自然状態ではたいへん弱い先占の権利も、市民社会の人はみな尊重する。この権利ゆえに尊重するのは、他人のものであること以上に、自分のものではないことだ。
    translation_status: reviewed
  - id: rsc-b1-c09-003
    section_id: rsc-b1-c09
    kind: paragraph
    origin: source
    source_text: 'En general, pour autoriser sur un terrain quelconque le droit de premier occupant, il faut les conditions suivantes. Premierement que ce terrain ne soit encore habité par personne ; secondement, qu’on n’en occupe que la quantité dont on a besoin pour subsister : En troisieme lieu qu’on en prenne possession, non par une vaine cérémonie, mais par le travail & la culture, seul signe de propriété qui au défaut de titres juridiques doive être respecté d’autrui.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '41'
        source_sequence: 87
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/53
        printed_page_end: '42'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c09-003-print
    translation_ja: およそ、ある土地について先占の権利が認められるには、次の条件が要る。第一に、まだ誰もその土地に住んでいないこと。第二に、暮らしに必要な広さ以上を占めないこと。第三に、形ばかりの儀式ではなく、労働と耕作によってそこを占有すること。法律上の権原がなければ、労働と耕作だけが、他者が尊重すべき所有のしるしである。
    translation_status: reviewed
  - id: rsc-b1-c09-004
    section_id: rsc-b1-c09
    kind: paragraph
    origin: source
    source_text: En effet, accorder au besoin & au travail le droit de premier occupant, n’est-ce pas l’étendre aussi loin qu’il peut aller ? Peut-on ne pas donner des bornes à ce droit ? Suffira-t-il de mettre le pied sur un terrain commun pour s’en prétendre aussi-tôt le maitre ? Suffira-t-il d’avoir la force d’en écarter un moment les autres hommes pour leur ôter le droit d’y jamais revenir ? Comment un homme ou un peuple peut-il s’emparer d’un territoire immense & en priver tout le genre humain autrement que par une usurpation punissable, puisqu’elle ôte au reste des hommes le séjour & les alimens que la nature leur donne en commun ? Quand Nuñez Balbao prenoit sur le rivage possession de la mer du sud & de toute l’Amérique méridionale au nom de la couronne de Castille, étoit-ce assez pour en déposséder tous les habitans & en exclurre tous les Princes du monde ? Sur ce pied-là ces cérémonies se multiplioient assez vainement, & le Roi catholique n’avoit tout d’un coup qu’à prendre de son cabinet possession de tout l’univers ; sauf à retrancher ensuite de son empire ce qui étoit auparavant possédé par les autres Princes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '42'
        source_sequence: 88
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/54
        printed_page_end: '43'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c09-004-print
    translation_ja: たしかに、必要と労働を根拠として先占の権利を認めるなら、この権利を及ぼせるぎりぎりまで広げたことになるのではないか。この権利に限界を与えずにいられるだろうか。共同の土地に足を踏み入れただけで、ただちにその主人だと名乗ってよいのか。その土地から他の者をしばらく追い払えるだけの力があれば、二度と戻るなと権利を奪ってよいのか。一人の人間や一つの人民が広大な土地を奪い、残るすべての人類をそこから締め出すのは、罰せられるべき横取り以外の何だろう。自然が皆に等しく与えた住みかと食糧を、他の人々から奪うのだから。ヌニェス・バルボアが岸辺に立ち、カスティーリャ王権の名で南の海と南アメリカ全土を領有すると宣言した。そんなことで、住んでいる人々すべてから土地を奪い、世界のあらゆる君主をそこから排除できたのか。その理屈でいくと、こうした儀式を何度も行うのは、まったく無駄であろう。カトリック王は自分の執務室から一度に全世界を領有し、他の君主たちが先に持っていた地域だけを、あとで自分の帝国から除けばよいことになる。
    translation_status: reviewed
  - id: rsc-b1-c09-005
    section_id: rsc-b1-c09
    kind: paragraph
    origin: source
    source_text: On conçoit comment les terres des particuliers réunies & contigues deviennent le territoire public, & comment le droit de souveraineté s’étendant des sujets au terrain qu’ils occupent, devient à la fois réel & personnel ; ce qui met les possesseurs dans une plus grande dépendance, & fait de leurs forces mêmes les garants de leur fidélité. Avantage qui ne paroît pas avoir été bien senti des anciens monarques qui ne s’appellant que Rois des Perses, des Scithes, des Macédoniens, sembloient se regarder comme les chefs des hommes plutôt que comme les maitres du pays. Ceux d’aujourd’hui s’appellent plus habilement Rois de France, d’Espagne, d’Angleterre, &c. En tenant ainsi le terrain, ils sont bien sûrs d’en tenir les habitans.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '43'
        source_sequence: 89
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/55
        printed_page_end: '44'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c09-005-print
    translation_ja: 個人の土地がまとまって隣り合えば、公の領土になる。また、主権の権利が臣民の身から、その人たちの占める土地にまで及ぶと、人に対しても物に対しても及ぶようになる。こう考えれば、土地を占有する者の従属が強まり、彼ら自身の力が、彼らの忠実さの保証になるわけもわかる。古代の君主はこの利点をよくわかっていなかったらしい。「ペルシア人の王」「スキタイ人の王」「マケドニア人の王」としか名乗らず、土地の主人というより、人々の長だと自分を考えていたように見える。今日の王たちはもっと巧みに、「フランス王」「スペイン王」「イングランド王」などと名乗る。土地を押さえておけば、住民もしっかり押さえられるというわけだ。
    translation_status: reviewed
  - id: rsc-b1-c09-006
    section_id: rsc-b1-c09
    kind: paragraph
    origin: source
    source_text: 'Ce qu’il y a de singulier dans cette aliénation, c’est que, loin qu’en acceptant les biens des particuliers la communauté les en dépouille, elle ne fait que leur en assurer la légitime possession, changer l’usurpation en un véritable droit, & la jouissance en propriété. Alors les possesseurs étant considérés comme dépositaires du bien public, leurs droits étant respectés de tous les membres de l’Etat & maintenus de toutes ses forces contre l’étranger, par une cession avantageuse au public & plus encore à eux-mêmes, ils ont, pour ainsi dire, acquis tout ce qu’ils ont donné : Paradoxe qui s’explique aisément par la distinction des droits que le souverain & le propriétaire ont sur le même fond, comme on verra ci-après.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '44'
        source_sequence: 90
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/56
        printed_page_end: '45'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c09-006-print
    translation_ja: この譲渡で珍しいのは、共同体が個人の財産を受け取って、彼らから奪い取るどころか、彼らの正当な占有を確かなものにし、横取りを真の権利に、実際に使っている状態を所有に変えるだけだということだ。占有者は公の財産を預かる人と見なされ、国家の全構成員がその権利を尊重し、国家はそのすべての力で、外部の者に対してその権利を守る。公にとって有利であり、本人たちにはなお有利な譲渡によって、いわば渡したものすべてを手に入れたのである。逆説のようだが、主権者と所有者が同じ土地に対して持つ権利を区別すれば、容易に説明できる。後に見るとおりである。
    translation_status: reviewed
  - id: rsc-b1-c09-007
    section_id: rsc-b1-c09
    kind: paragraph
    origin: source
    source_text: Il peut arriver aussi que les hommes commencent à s’unir avant que de rien posséder, & que, s’emparant ensuite d’un terrain suffisant pour tous, ils en jouissent en commun, ou qu’ils le partagent entre eux, soit également soit selon des proportions établies par le Souverain. De quelque maniere que se fasse cette acquisition, le droit que chaque particulier a sur son propre fond est toujours subordonné au droit que la communauté a sur tous, sans quoi il n’y auroit ni solidité dans le lien social, ni force réelle dans l’exercice de la Souveraineté.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '45'
        source_sequence: 91
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/57
        printed_page_end: '46'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c09-007-print
    translation_ja: 人々がまだ何も占有しないうちに結びつき、それから全員に足りる土地を得て、共同でこれを使うか、あるいは平等に、もしくは主権者が定めた割合で、互いに分け合うこともありうる。どうやって土地を取得したにせよ、各人が自分の土地に持つ権利は、共同体がすべての土地に持つ権利に、つねに従属する。そうでなければ、社会の絆は強固でなく、主権の行使には実際の力もないだろう。
    translation_status: reviewed
  - id: rsc-b1-c09-008
    section_id: rsc-b1-c09
    kind: paragraph
    origin: source
    source_text: Je terminerai ce chapitre & ce livre par une remarque qui doit servir de base à tout sistême social ; c’est qu’au lieu de détruire l’égalité naturelle, le pacte fondamental substitue au contraire une égalité morale & légitime à ce que la nature avoit pu mettre d’inégalité physique entre les hommes, & que, pouvant être inégaux en force ou en génie, ils deviennent tous égaux par convention & de droit.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '46'
        source_sequence: 92
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/58
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c09-008-print
    translation_ja: あらゆる社会制度の土台とすべき点に触れて、この章とこの編を終えよう。根本の盟約は、自然の平等を破壊するどころか、自然が人間同士にもたらしえた身体上の不平等に代えて、道徳上の、正当な平等をもたらす。人々は力や才能に違いがあっても、合意によって、権利のうえでは誰もが平等となるのである。
    translation_status: reviewed
  - id: rsc-note-04-text
    section_id: rsc-b1-c09
    kind: note_body
    origin: source
    source_text: 'Sous les mauvais gouvernemens cette égalité n’est qu’apparente et illusoire ; elle ne sert qu’à maintenir le pauvre dans sa misere & le riche dans son usurpation. Dans le fait les loix sont toujours utiles à ceux qui possedent & nuisibles à ceux qui n’ont rien : D’où il suit que l’état social n’est avantageux aux hommes qu’autant qu’ils ont tous quelque chose & qu’aucun d’eux n’a rien de trop.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '46'
        source_sequence: 93
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/58
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-04-text-print
    translation_ja: 悪い政府のもとで、この平等は見せかけにすぎず、人を欺くものだ。貧しい者を悲惨な境遇に、富める者を横取りした地位に、とどめておくだけである。現実には、法律はつねに財産のある者の益になり、何もない者には害となる。したがって、社会状態が人間の益となるのは、誰もが何がしかを持ち、多すぎるほど持つ者は誰もいない場合に限られる。
    translation_status: reviewed
  - id: rsc-b1-end
    section_id: rsc-b1-c09
    kind: paragraph
    origin: source
    source_text: Fin du Livre premier.

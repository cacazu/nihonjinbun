    translation_status: reviewed
  - id: rsc-b4-c05-title
    section_id: rsc-b4-c05
    kind: heading
    origin: source
    source_text: Du Tribunat.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '278'
        source_sequence: 521
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/290
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c05-title-print
    translation_ja: 護民官制について
    translation_status: reviewed
  - id: rsc-b4-c05-001
    section_id: rsc-b4-c05
    kind: paragraph
    origin: source
    source_text: Quand on ne peut établir une exacte proportion entre les parties constitutives de l’Etat, ou que des causes indestructibles en alterent sans cesse les rapports, alors on institue une magistrature particuliere qui ne fait point corps avec les autres, qui replace chaque terme dans son vrai rapport, & qui fait une liaison ou un moyen terme soit entre le Prince & le Peuple, soit entre le Prince & le Souverain, soit à la fois des deux côtés s’il est nécessaire.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '278'
        source_sequence: 522
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/290
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c05-001-print
    translation_ja: 国家をつくる諸部分のあいだに正確な比例を立てられないとき、あるいは除きがたい原因でその関係がたえず変わるときには、ほかの行政官と一体でない、特別の官職を置く。これは各項が正しい関係を取り戻すようにするもので、統治者と人民、あるいは統治者と主権者のあいだのつながり、すなわち中間項となる。必要なら、両方のあいだを一度につなぐ。
    translation_status: reviewed
  - id: rsc-b4-c05-002
    section_id: rsc-b4-c05
    kind: paragraph
    origin: source
    source_text: Ce corps, que j’appellerai Tribunat, est le conservateur des loix & du pouvoir législatif. Il sert quelquefois à protéger le Souverain contre le Gouvernement, comme faisoient à Rome les Tribuns du peuple, quelquefois à soutenir le Gouvernement contre le Peuple, comme fait maintenant à Venise le conseil des Dix, & quelquefois à maintenir l’équilibre de part & d’autre, comme faisoient les Ephores à Sparte.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '278'
        source_sequence: 523
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/290
        printed_page_end: '279'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c05-002-print
    translation_ja: 私が護民官制と呼ぶこの団体は、法律と立法権を守る。ローマで人民の護民官がしたように、政府から主権者を守ることもある。現にヴェネツィアの十人評議会がしているように、人民に対して政府を支えることもある。また、スパルタの監督官がしたように、両側の均衡を保つこともある。
    translation_status: reviewed
  - id: rsc-b4-c05-003
    section_id: rsc-b4-c05
    kind: paragraph
    origin: source
    source_text: 'Le Tribunat n’est point une partie constitutive de la Cité, & ne doit avoir aucune portion de la puissance législative ni de l’exécutive, mais c’est en cela même que la sienne est plus grande : car ne pouvant rien faire il peut tout empêcher. Il est plus sacré & plus révéré comme défenseur des Loix, que le Prince qui les exécute & que le Souverain qui les donne. C’est ce qu’on vit bien clairement à Rome quand ces fiers Patriciens, qui mépriserent toujours le peuple entier, furent forcés de fléchir devant un simple officier du peuple, qui n’avoit ni auspices ni juridiction.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '279'
        source_sequence: 524
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/291
        printed_page_end: '280'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c05-003-print
    translation_ja: 護民官制は、市民共同体をつくる一部分ではない。立法権も行政権もいささかも持つべきでない。だがまさにそのため、その力はもっと大きい。何も実行できない代わりに、すべてを止められるからである。法を守る者として、法を執行する統治者よりも、法を与える主権者よりも、神聖で尊敬される。ローマでは、このことがはっきり見られた。人民全体をいつも軽蔑した、あの誇り高い門閥が、神意を占う権限も裁く権限もない、ただ一人の人民の役人の前に、膝を屈するほかなかったのである。
    translation_status: reviewed
  - id: rsc-b4-c05-004
    section_id: rsc-b4-c05
    kind: paragraph
    origin: source
    source_text: 'Le tribunat sagement tempéré est le plus ferme appui d’une bonne constitution ; mais pour peu de force qu’il ait de trop il renverse tout : A l’égard de la foiblesse, elle n’est pas dans sa nature, & pourvu qu’il soit quelque chose, il n’est jamais moins qu’il ne faut.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '280'
        source_sequence: 525
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/292
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c05-004-print
    translation_ja: よく加減された護民官制は、よい体制の最も強い支えである。だが、少しでも余分な力を持てば、すべてをひっくり返す。弱さは、この制度の本性にはない。少しでも力を持ってさえいれば、必要な力に満たないことは決してない。
    translation_status: reviewed
  - id: rsc-b4-c05-005
    section_id: rsc-b4-c05
    kind: paragraph
    origin: source
    source_text: 'Il degenere en tirannie quand il usurpe la puissance exécutive dont il n’est que le modérateur, & qu’il veut dispenser des loix qu’il ne doit que protéger. L’énorme pouvoir des Ephores qui fut sans danger tant que Sparte conserva ses mœurs, en accélera la corruption commencée. Le sang d’Agis égorgé par ces tirans fut vengé par son successeur : le crime & le châtiment des Ephores hâterent également la perte de la République, & après Cléomene Sparte ne fut plus rien. Rome périt encore par la même voye, & le pouvoir excessif des Tribuns usurpé par degrés servit enfin, à l’aide des loix faites pour la liberté, de sauvegarde aux Empereurs qui la détruisirent. Quant au Conseil des Dix à Venise ; c’est un Tribunal de sang, horrible également aux Patriciens & au Peuple, & qui, loin de protéger hautement les loix, ne sert plus, après leur avilissement, qu’à porter dans les ténebres des coups qu’on n’ose appercevoir.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '280'
        source_sequence: 526
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/292
        printed_page_end: '281'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c05-005-print
    translation_ja: 調整するだけのはずの行政権を奪い、守るだけのはずの法を免除しようとするとき、護民官制は圧制に堕落する。スパルタが風俗を保つあいだは危険でなかった監督官たちの途方もない力は、すでに始まった腐敗を早めた。この暴君たちの手にかかったアギスの血の報復を、その後継者が果たした。監督官の罪も、その処罰も、等しく共和国の滅亡を早め、クレオメネスの後、スパルタは無に帰した。ローマも同じ道で滅びた。護民官が徐々に奪っていった過大な権力は、自由のためにつくられた法の助けを借り、しまいには、その自由を滅ぼした皇帝たちを守った。ヴェネツィアの十人評議会はといえば、門閥にも人民にも、等しく恐ろしい血の法廷である。公然と法を守るどころか、これをおとしめたあとでは、誰も気づくことさえ恐れる一撃を、闇のうちに下すだけである。
    translation_status: reviewed
  - id: rsc-b4-c05-006
    section_id: rsc-b4-c05
    kind: paragraph
    origin: source
    source_text: Le Tribunat s’affoiblit comme le Gouvernement par la multiplication de ses membres. Quand les Tribuns du peuple romain, d’abord au nombre de deux, puis de cinq, voulurent doubler ce nombre, le Sénat les laissa faire, bien sûr de contenir les uns par les autres ; ce qui ne manqua pas d’arriver.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '281'
        source_sequence: 527
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/293
        printed_page_end: '282'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c05-006-print
    translation_ja: 護民官制は、政府と同様、構成員が増えると弱まる。ローマの人民の護民官は、はじめ二人、次に五人となり、さらに数を倍にしようとした。元老院は、彼らを互いに抑えさせることができると確信し、好きにさせた。そして案の定、そのとおりになった。
    translation_status: reviewed
  - id: rsc-b4-c05-007
    section_id: rsc-b4-c05
    kind: paragraph
    origin: source
    source_text: Le meilleur moyen de prevenir les usurpations d’un si redoutable corps, moyen dont nul Gouvernement ne s’est avisé jusqu’ici, seroit de ne pas rendre ce corps permanent, mais de regler les intervalles durant lesquels il resteroit supprimé. Ces intervalles qui ne doivent pas être assez grands pour laisser aux abus le tems de s’affermir, peuvent être fixés par la loi, de maniere qu’il soit aisé de les abréger au besoin par des commissions extraordinaires.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '282'
        source_sequence: 528
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/294
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c05-007-print
    translation_ja: この恐ろしい団体が権力を奪うのを防ぐ最善の方法は、まだどの政府も思いついていない。それはこれを常設せず、廃止されたままでいる期間を定めることだ。その期間は、濫用が根を下ろす暇を与えるほど長くしてはならない。必要なときは臨時の委任によってたやすく縮められるように、法律で定められる。
    translation_status: reviewed
  - id: rsc-b4-c05-008
    section_id: rsc-b4-c05
    kind: paragraph
    origin: source
    source_text: Ce moyen me paroit sans inconvénient, parce que, comme je l’ai dit, le Tribunat ne faisant point partie de la constitution peut être ôté sans qu’elle en souffre ; & il me paroit efficace, parce qu’un magistrat nouvellement rétabli ne part point du pouvoir qu’avoit son prédecesseur, mais de celui que la loi lui donne.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '282'
        source_sequence: 529
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/294
        printed_page_end: '283'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c05-008-print
    translation_ja: この方法には不都合がなく、効き目があると思う。不都合がないのは、述べたように、護民官制は体制の一部ではなく、体制を苦しめずに、そこから取り外せるからだ。効き目があるのは、再設置された行政官が出発点とするのは、前任者が持っていた権力ではなく、法から与えられた権力だからだ。
    translation_status: reviewed
  - id: rsc-b4-c06-heading
    section_id: rsc-b4-c06
    kind: heading
    origin: source
    source_text: CHAPITRE VI.

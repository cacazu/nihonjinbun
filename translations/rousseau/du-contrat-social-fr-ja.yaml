    translation_ja: 第六章
    translation_status: reviewed
  - id: rsc-b3-c06-title
    section_id: rsc-b3-c06
    kind: heading
    origin: source
    source_text: De la Monarchie.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '158'
        source_sequence: 292
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/170
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-title-print
    translation_ja: 君主政について
    translation_status: reviewed
  - id: rsc-b3-c06-001
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: Jusqu’ici nous avons considéré le Prince comme une personne morale & collective, unie par la force des loix, & dépositaire dans l’Etat de la puissance exécutive. Nous avons maintenant à considérer cette puissance réunie entre les mains d’une personne naturelle, d’un homme réel, qui seul ait droit d’en disposer selon les loix. C’est ce qu’on appelle un Monarque ou un Roi.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '158'
        source_sequence: 293
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/170
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-001-print
    translation_ja: これまでは統治者を、法の力で結ばれ、国家で行政権を預かる、集合的な道徳的人格として考えてきた。今度はこの権力が、一人の自然人、ただ一人、法律に従ってその権力を使う権利を持つ実在の人間の手に、集まっている場合を考えなければならない。これが君主、あるいは王と呼ばれる者である。
    translation_status: reviewed
  - id: rsc-b3-c06-002
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: Tout au contraire des autres administrations, où un être collectif représente un individu, dans celle-ci un individu représente un être collectif ; en sorte que l’unité morale qui constitue le Prince est en même tems une unité physique, dans laquelle toutes les facultés que la loi réunit dans l’autre avec tant d’effort se trouvent naturellement réunies.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '158'
        source_sequence: 294
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/170
        printed_page_end: '159'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-002-print
    translation_ja: ほかの行政では、集合的な存在が一個人を代表するが、この行政では、正反対に、個人が集合的な存在を代表する。だから統治者をつくる道徳上の一体性は、同時に身体上の一体性でもある。ほかの統治では法がたいへんな苦労をして集める力が、ここでは自然に集まっている。
    translation_status: reviewed
  - id: rsc-b3-c06-003
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: Ainsi la volonté du peuple, & la volonté du Prince, & la force publique de l’État, & la force particuliere du Gouvernement, tout répond au même mobile, tous les ressorts de la machine sont dans la même main, tout marche au même but, il n’y a point de mouvemens opposés qui s’entredétruisent, & l’on ne peut imaginer aucune sorte de constitution dans laquelle un moindre effort produise une action plus considérable. Archimede assis tranquilement sur le rivage & tirant sans peine à flot un grand Vaisseau, me représente un monarque habile gouvernant de son cabinet ses vastes États, & faisant tout mouvoir en paroissant immobile.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '159'
        source_sequence: 295
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/171
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-003-print
    translation_ja: こうして人民の意志、統治者の意志、国家の公の実力、政府に固有の力が、すべて同じ原動力に応じる。機械のばねはすべて同じ手の中にあり、すべてが同じ目的に向かい、打ち消し合う反対の動きがない。これほど小さな努力で、これほど大きな働きを起こせるような体制は、ほかに考えられない。岸に悠然と座り、大きな船を難なく浮かべたアルキメデスの姿は、執務室から広大な国を治め、自分では動かないように見えてすべてを動かす、腕のよい君主を私に思い起こさせる。
    translation_status: reviewed
  - id: rsc-b3-c06-004
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: Mais s’il n’y a point de Gouvernement qui ait plus de vigueur, il n’y en a point où la volonté particuliere ait plus d’empire & domine plus aisément les autres ; tout marche au même but, il est vrai ; mais ce but n’est point celui de la félicité publique, & la force même de l’Administration tourne sans cesse au préjudice de l’Etat.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '159'
        source_sequence: 296
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/171
        printed_page_end: '160'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-004-print
    translation_ja: しかし、これより力強い政府がないとすれば、個人の意志がこれほど力を振るい、ほかの意志をたやすく圧倒する政府もない。確かに、すべては同じ目的へ向かう。だが、その目的は公共の幸福ではない。行政の力そのものが、絶えず国家に害をなすほうへと向かう。
    translation_status: reviewed
  - id: rsc-b3-c06-005
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: 'Les Rois veulent être absolus, & de loin on leur crie que le meilleur moyen de l’être est de se faire aimer de leurs peuples. Cette maxime est très belle, & même très vraye à certains égards. Malheureusement on s’en moquera toujours dans les Cours. La puissance qui vient de l’amour des peuples est sans doute la plus grande ; mais elle est précaire & conditionnelle, jamais les Princes ne s’en contenteront. Les meilleurs Rois veulent pouvoir être méchans s’il leur plait, sans cesser d’être les maitres : Un sermoneur politique aura beau leur dire que la force du peuple étant la leur, leur plus grand intérêt est que le peuple soit florissant, nombreux, redoutable : ils savent très bien que cela n’est pas vrai. Leur intérêt personnel est premierement que le Peuple soit foible, misérable, & qu’il ne puisse jamais leur résister. J’avoue que, supposant les sujets toujours parfaitement soumis, l’intérêt du Prince seroit alors que le peuple fut puissant, afin que cette puissance étant sienne le rendit rédoutable à ses voisins ; mais comme cet intérêt n’est que secondaire & subordonné, & que les deux suppositions sont incompatibles, il est naturel que les Princes donnent toujours la préférence à la maxime qui leur est le plus immédiatement utile. C’est ce que Samuël représentoit fortement aux Hébreux ; c’est ce que Machiavel a fait voir avec évidence. En feignant de donner des leçons aux Rois il en a donné de grandes aux peuples. Le Prince de Machiavel est le livre des républicains.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '160'
        source_sequence: 297
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/172
        printed_page_end: '162'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-005-print
    translation_ja: 王は絶対の力を持ちたがる。遠くからは、その最善の方法は人民に愛されることだ、と呼びかける声がする。これはたいへん立派な格言で、ある点ではまことに正しい。不幸にも宮廷では、いつでも笑いものにされるだろう。人民の愛から来る力が、最も大きいのは疑いない。だが、それは不確かで、条件つきの力であり、君主たちがそれで満足することは決してない。どんなに立派な王でも、好きなら悪人になれて、しかも主人のままでいられることを望む。説教好きの政治論者が、人民の力は王自身の力なのだから、人民が栄え、数が多く、侮られないことこそ王の最大の利益だと言っても、王たちは、そんなことは本当ではないとよく知っている。彼ら自身の利益は、何より人民が弱く、惨めで、決して自分たちに逆らえないことだ。臣民がつねに完全に従うと仮定すれば、人民が強く、その力が君主のものとなり、隣国に恐れられることは、君主の利益になると認めよう。だが、それは第二の、従属した利益にすぎない。二つの仮定は両立しないのだから、君主が自分に最も直接役に立つ格言をつねに優先するのは自然だ。サムエルがヘブライ人に力をこめて説いたのも、このことだ。マキアヴェッリはこれをはっきり示した。王たちに教えを授けるふりをしながら、人民に大きな教えを授けたのである。マキアヴェッリの『君主論』は共和主義者の書物である。
    translation_status: reviewed
  - id: rsc-b3-c06-006
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: 'Nous avons trouvé, par les rapports généraux que la monarchie n’est convenable qu’aux grands États, & nous le trouvons encore en l’examinant en elle-même. Plus l’administration publique est nombreuse, plus le rapport du Prince aux sujets diminue & s’approche de l’égalité, en sorte que ce rapport est un ou l’égalité-même dans la Démocratie. Ce même rapport augmente à mésure que le Gouvernement se resserre, & il est dans son maximum quand le Gouvernement est dans les mains d’un seul. Alors il se trouve une trop grande distance entre le Prince & le Peuple, & l’État manque de liaison. Pour la former il faut donc des ordres intermédiaires : Il faut des Princes, des Grands, de la noblesse pour les remplir. Or rien de tout cela ne convient à un petit État, que ruinent tous ces degrés.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '162'
        source_sequence: 298
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/174
        printed_page_end: '163'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-006-print
    translation_ja: 一般的な関係から見て、君主政が大きな国家にしか適さないことがわかった。その内実を調べても、同じことがわかる。公の行政に携わる人が多いほど、臣民に対する統治者の比は小さくなり、等しさに近づく。そのため民主政では、この比は一、すなわち完全な等しさである。反対に政府が少人数になるにつれてこの比は大きくなり、政府が一人の手にあるとき、最大になる。その場合、統治者と人民の距離は大きすぎ、国家にはつながりが足りなくなる。それをつくるには、中間にいくつもの階層が要る。その位置を埋める諸侯、貴顕、貴族が必要になる。だが、このどれも小国にはふさわしくない。段階がいくつもあれば、小国は滅びてしまう。
    translation_status: reviewed
  - id: rsc-b3-c06-007
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: Mais s’il est difficile qu’un grand État soit bien gouverné, il l’est beaucoup plus qu’il soit bien gouverné par un seul homme, & chacun sait ce qu’il arrive quand le Roi se donne des substituts.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '163'
        source_sequence: 299
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/175
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-007-print
    translation_ja: しかし、大国をよく治めることが難しいのなら、ただ一人でよく治めるのは、もっと難しい。王が代わりを立てるとどうなるかは、誰もが知っている。
    translation_status: reviewed
  - id: rsc-b3-c06-008
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: 'Un defaut essenciel & inévitable, qui mettra toujours le gouvernement monarchique au dessous du républicain, est que dans celui-ci la voix publique n’éleve presque jamais aux premieres places que des hommes éclairés & capables, qui les remplissent avec honneur : au lieu que ceux qui parviennent dans les monarchies ne sont le plus souvent que de petits brouillons, de petits fripons, de petits intrigans, à qui les petits talens qui font dans les Cours parvenir aux grandes places, ne servent qu’à montrer au public leur ineptie aussi-tôt qu’ils y sont parvenus. Le peuple se trompe bien moins sur ce choix que le Prince, & un homme d’un vrai mérite est presque aussi rare dans le ministere, qu’un sot à la tête d’un gouvernement républicain. Aussi, quand par quelque heureux hazard un de ces hommes nés pour gouverner prend le timon des affaires dans une Monarchie presque abimée par ces tas de jolis régisseurs, on est tout surpris des ressources qu’il trouve, & cela fait époque dans un pays.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '163'
        source_sequence: 300
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/175
        printed_page_end: '164'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-008-print
    translation_ja: 君主政を共和政よりつねに劣ったものにする、本質的で避けがたい欠点がある。共和政では、公の声によって最高の地位に上がるのは、ほとんどいつも、事情に明るく有能で、その地位を立派に務める人々だ。これに対して君主政で出世するのは、たいてい何かと騒ぐ小者、小悪党、小さな策士にすぎない。宮廷で立派な地位に上がるのに役立った小才は、上がったとたん、自分が無能だと世間に見せるのにしか役に立たない。この人選について、人民は統治者ほどには間違わない。閣僚のなかに真に優れた人がいるのは、共和政の頂点に愚か者がいるのと、ほとんど同じくらい珍しい。だから幸運にも、統治するために生まれたような人が、あの立派な管理人ぞろいのせいでほとんど滅びかけた君主国で、舵を取ることがあると、その人が見いだす手立てに皆が驚き、国の歴史の一時期を画する出来事となる。
    translation_status: reviewed
  - id: rsc-b3-c06-009
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: Pour qu’un État monarchique put être bien gouverné, il faudroit que sa grandeur ou son étendue fut mésurée aux facultés de celui qui gouverne. Il est plus aisé de conquérir que de régir. Avec un levier suffisant, d’un doigt on peut ébranler le monde, mais pour le soutenir il faut les épaules d’Hercule. Pour peu qu’un État soit grand, le Prince est presque toujours trop petit. Quand, au contraire il arrive que l’État est trop petit pour son chef, ce qui est très rare, il est encore mal gouverné, parce que le chef, suivant toujours la grandeur de ses vues, oublie les intérêts des peuples, & ne les rend pas moins malheureux par l’abus des talens qu’il a de trop, qu’un chef borné par le défaut de ceux qui lui manquent. Il faudroit, pour ainsi dire, qu’un royaume s’étendit ou se resserrât à chaque regne selon la portée du Prince ; au lieu que les talens d’un Sénat ayant des mésures plus fixes, l’État peut avoir des bornes constantes & l’administration n’aller pas moins bien.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '164'
        source_sequence: 301
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/176
        printed_page_end: '165'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-009-print
    translation_ja: 君主国がよく治められるには、その大きさ、あるいは広さが、治める人の力量に見合っていなければならない。征服するほうが、治めるよりたやすい。十分なてこがあれば、指一本で世界を揺り動かせるが、世界を支えるには、ヘラクレスの肩が要る。国がいくらか大きくなれば、統治者はほとんどいつでも小さすぎる。反対に、まれではあるが、国がその長に対して小さすぎるときにも、やはり統治はうまくいかない。長は自分の構想の大きさを追い続けるあまり、人民の利益を忘れ、足りない才能のせいで視野の狭い長と同じくらい、余りある才能を誤って使うことで人民を不幸にする。いわば、統治者の力量に合わせて、その治世ごとに王国を広げたり狭めたりしなければならないだろう。元老院全体の力量は、これに比べて揺れが少ないので、国家の境は一定のままでよく、行政もうまくいく。
    translation_status: reviewed
  - id: rsc-b3-c06-010
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: Le plus sensible inconvénient du Gouvernement d’un seul est le défaut de cette succession continuelle qui forme dans les deux autres une liaison non interrompue. Un Roi mort, il en faut un autre ; les élections laissent des intervalles dangereux, elles sont orageuses, & à moins que les Citoyens ne soient d’un désintéressement, d’une intégrité que ce Gouvernement ne comporte gueres, la brigue & la corruption s’en mêlent. Il est difficile que celui à qui l’Etat s’est vendu ne le vende pas à son tour, & ne se dédommage pas sur les foibles de l’argent que les puissans lui ont extorqué. Tôt ou tard tout devient venal sous une pareille administration, & la paix dont on jouit alors sous les rois, est pire que le désordre des interregnes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '165'
        source_sequence: 302
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/177
        printed_page_end: '166'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-010-print
    translation_ja: 一人の政府で最も身にしみる不都合は、ほかの二つの形にあっては絶えずつながりを保つ、連続した継承がないことだ。王が死ねば、次の王が要る。選挙は危険な空白を残し、荒れる。市民が、この政府ではとても望めないほど私欲を捨て、誠実に行動しないかぎり、派閥争いと腐敗が入り込む。国家が自らを売った相手が、今度は国家を売らず、権力者にむしり取られた金を弱い人々から取り戻さずにいるのは、難しい。遅かれ早かれ、この種の行政では、すべてが売り買いされるようになる。そのとき王のもとで享受する平和は、王位の空白期の混乱よりも悪い。
    translation_status: reviewed
  - id: rsc-b3-c06-011
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: 'Qu’a-t-on fait pour prévenir ces maux ? On a rendu les Couronnes héréditaires dans certaines familles, & l’on a établi un ordre de Succession qui prévient toute dispute à la mort des Rois : C’est-à-dire que, substituant l’inconvénient des régences à celui des élections, on a préféré une apparente tranquillité à une administration sage, & qu’on a mieux aimé risquer d’avoir pour chefs des enfans, des monstres, des imbéciles, que d’avoir à disputer sur le choix des bons Rois ; on n’a pas considéré qu’en s’exposant ainsi aux risques de l’alternative on met presque toutes les chances contre soi. C’étoit un mot très-sensé que celui du jeune Denis, à qui son pere en lui reprochant une action honteuse, disoit, t’en ai-je donné l’exemple ? Ah, répondit le fils, votre pere n’étoit pas roi !'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '166'
        source_sequence: 303
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/178
        printed_page_end: '167'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-011-print
    translation_ja: こうした害を防ぐために、何がなされたか。王冠を特定の家系の世襲とし、王が死んだときに争いを未然に防ぐ継承順位を定めた。つまり、選挙の面倒を摂政政治の面倒に替え、賢明な行政より見かけの平穏を選んだのである。よい王の選び方を争うくらいなら、子どもや怪物や愚か者を長とする危険を冒すほうがよいと考えた。こうした選択に伴う危険を冒せば、ほとんどすべての見込みが不利になることを、考えなかったのだ。父親から恥ずべき振る舞いを責められ、「私がお手本を見せたか」と言われた若いディオニュシオスの答えは、まことにもっともだった。「お父上の父は、王ではなかったではありませんか。」
    translation_status: reviewed
  - id: rsc-b3-c06-012
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: Tout concourt à priver de justice & de raison un homme élevé pour commander aux autres. On prend beaucoup de peine, à ce qu’on dit, pour enseigner aux jeunes Princes l’art de regner ; il ne paroit pas que cette éducation leur profite. On feroit mieux de commencer par leur enseigner l’art d’obéir. Les plus grands rois qu’ait célébrés l’histoire n’ont point été élevés pour regner ; c’est une science qu’on ne possede jamais moins qu’après l’avoir trop apprise, & qu’on acquiert mieux en obéissant qu’en commandant. Nam utilissimus idem ac brevissimus bonarum malarumque rerum delectus, cogitare quid aut nolueris sub alio Principe aut volueris.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '167'
        source_sequence: 304
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/179
        printed_page_end: '168'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-012-print
    translation_ja: 人に命令するために育てられた者から、正義と理性を奪うように、何もかもがはたらく。若い王子に王として治める術を教えるのに大いに苦労するそうだが、その教育が役に立っている様子はない。まず、従う術を教えたほうがよい。歴史にたたえられた最も偉大な王たちは、王になるために育てられたわけではない。統治とは、教わりすぎたあとほど身についていない技芸であり、命令するより従うことでよく身につく。「何が善く何が悪いかを見分けるのにいちばん役立つ、そしていちばん手短な方法は、別の君主のもとに自分がいたとしたら、何を望まず、何を望んだかを考えることである。」
    translation_status: reviewed
  - id: rsc-note-20-text
    section_id: rsc-b3-c06
    kind: note_body
    origin: source
    source_text: 'Tacit : hist. L. I.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '168'
        source_sequence: 305
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/180
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-20-text-print
    translation_ja: タキトゥス『同時代史』第一巻。
    translation_status: reviewed
  - id: rsc-b3-c06-013
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: 'Une suite de ce défaut de cohérence est l’inconstance du gouvernement royal qui, se réglant tantôt sur un plan & tantôt sur un autre selon le caractere du Prince qui regne ou des gens qui regnent pour lui, ne peut avoir longtems un objet fixe ni une conduite conséquente : variation qui rend toujours l’Etat flottant de maxime en maxime, de projet en projet, & qui n’a pas lieu dans les autres Gouvernemens où le Prince est toujours le même. Aussi voit-on qu’en général, s’il y a plus de ruse dans une Cour, il y a plus de sagesse dans un Sénat, & que les Républiques vont à leurs fins par des vues plus constantes & mieux suivies, au lieu que chaque révolution dans le Ministere en produit une dans l’Etat ; la maxime commune à tous les Ministres, & presque à tous les Rois, étant de prendre en toute chose le contrepied de leur prédécesseur.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '168'
        source_sequence: 306
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/180
        printed_page_end: '169'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-013-print
    translation_ja: この一貫性のなさがもたらす結果の一つは、王政の移り気である。治世にある王、または王に代わって支配する人々の性格によって、あるときは一つの方針に、あるときは別の方針に従い、長く一つの目的を持ち、筋の通った行動を続けることができない。この変わりやすさのせいで、国家は格言から格言へ、計画から計画へと、いつも漂う。統治者がつねに同じであるほかの政府では、このことは起きない。一般に、宮廷には抜け目のなさが多く、元老院には知恵が多い。共和国は、考えがより変わらず、一貫しているので、目的に到達する。他方で王政では、大臣の入れ替わりのたびに、国家にも変革が起きる。どの大臣にも、そしてほとんどどの王にも、何事につけ前任者の逆を行く、という共通の格言があるからだ。
    translation_status: reviewed
  - id: rsc-b3-c06-014
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: 'De cette même incohérence se tire encore la solution d’un sophisme très familier aux politiques royaux ; c’est, non seulement de comparer le Gouvernement civil au Gouvernement domestique & le prince au pere de famille, erreur déjà réfutée, mais encore de donner libéralement à ce magistrat toutes les vertus dont il auroit besoin, & de supposer toujours que le Prince est ce qu’il devroit être : supposition à l’aide de laquelle le Gouvernement royal est évidemment préférable à tout autre, parce qu’il est incontestablement le plus fort, & que pour être aussi le meilleur il ne lui manque qu’une volonté du corps plus conforme à la volonté générale.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '169'
        source_sequence: 307
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/181
        printed_page_end: '170'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-014-print
    translation_ja: この同じ一貫性のなさから、王政を説く人々におなじみの詭弁も解ける。彼らは、市民の政府を家の取り仕切りと、統治者を家族の父と比べる。この誤りはすでに論駁した。さらに彼らは、この行政官に、必要な美徳を気前よくすべて与え、統治者がいつもあるべき姿をしていると仮定する。この仮定があれば、王政がほかの政府よりよいことは明らかである。王政は争いようもなく最も強く、最善でもあるために足りないのは、一般意志にもっとよくかなう団体の意志だけなのだから。
    translation_status: reviewed
  - id: rsc-b3-c06-015
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: Mais si selon Platon le roi par nature est un personnage si rare, combien de fois la nature & la fortune concourront-elles à le couronner, & si l’éducation royale corrompt nécessairement ceux qui la reçoivent, que doit-on espérer d’une suite d’hommes élevés pour regner ? C’est donc bien vouloir s’abuser que de confondre le Gouvernement royal avec celui d’un bon Roi. Pour voir ce qu’est ce Gouvernement en lui-même, il faut le considérer sous des Princes bornés ou méchans ; car ils arriveront tels au Trône, ou le Trône les rendra tels.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '170'
        source_sequence: 308
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/182
        printed_page_end: '171'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-015-print
    translation_ja: しかしプラトンの言うように、生まれついての王がそれほどまれな人物なら、自然と運が力を合わせて、その人に王冠を授けることは、いったい何度あるだろう。また、王の教育が、それを受ける者を必ず腐らせるなら、治めるために育てられた者が次々に現れて、何を期待できるだろう。したがって、王政をよい王の統治と混同するのは、自らあざむかれようとするに等しい。この政府が実際に何であるかを見るには、分別の乏しい、あるいは悪意のある君主のもとで考えなければならない。君主はそのような姿で王座につくか、王座が君主をそういう者にするからだ。
    translation_status: reviewed
  - id: rsc-note-21-text
    section_id: rsc-b3-c06
    kind: note_body
    origin: source
    source_text: In Civili.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '170'
        source_sequence: 309
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/182
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-21-text-print
    translation_ja: 『政治家』。
    translation_status: reviewed
  - id: rsc-b3-c06-016
    section_id: rsc-b3-c06
    kind: paragraph
    origin: source
    source_text: Ces difficultés n’ont pas échappé à nos Auteurs, mais ils n’en sont point embarrassés. Le remede est, disent-ils, d’obéir sans murmure. Dieu donne les mauvais Rois dans sa colére, & il les faut supporter comme des châtimens du Ciel. Ce discours est édifiant, sans doute ; mais je ne sais s’il ne conviendroit pas mieux en chaire que dans un livre de politique. Que dire d’un Medecin qui promet des miracles, & dont tout l’art est d’exhorter son malade à la patience ? On sait bien qu’il faut souffrir un mauvais Gouvernement quand on l’a ; la question seroit d’en trouver un bon.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '171'
        source_sequence: 310
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/183
        printed_page_end: '172'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c06-016-print
    translation_ja: われわれの著述家も、これらの難点を見落としはしなかった。だが困る様子もない。彼らが言うには、対処法は文句を言わずに従うことだ。神は怒りのうちに悪い王を与えるので、天の罰として我慢しなければならない。まことにありがたいお説教だが、政治の本に載せるより、説教壇のほうがふさわしいのではないか。奇跡を約束しながら、忍耐を説くだけが腕前の医者を、どう思うだろう。悪い政府のもとにいるなら、悪い政府に耐えるほかないことは、よくわかっている。問題は、よい政府を見つけることだ。
    translation_status: reviewed
  - id: rsc-b3-c07-heading
    section_id: rsc-b3-c07
    kind: heading
    origin: source
    source_text: CHAPITRE VII.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '172'
        source_sequence: 311
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/184
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c07-heading-print
    translation_ja: 第七章
    translation_status: reviewed
  - id: rsc-b3-c07-title
    section_id: rsc-b3-c07
    kind: heading
    origin: source
    source_text: Des Gouvernemens mixtes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '172'
        source_sequence: 312
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/184
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c07-title-print
    translation_ja: 混合政府について
    translation_status: reviewed
  - id: rsc-b3-c07-001
    section_id: rsc-b3-c07
    kind: paragraph
    origin: source
    source_text: A proprement parler il n’y a point de Gouvernement simple. Il faut qu’un Chef unique ait des magistrats subalternes ; il faut qu’un Gouvernement populaire ait un Chef. Ainsi dans le partage de la puissance exécutive il y a toujours gradation du grand nombre au moindre, avec cette différence que tantôt le grand nombre dépend du petit, & tantôt le petit du grand.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '172'
        source_sequence: 313
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/184
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c07-001-print
    translation_ja: 厳密に言えば、単一の構成しか持たない政府はない。長が一人でも、その下には行政官が必要であり、人民が政府を担っても、長が必要である。だから行政権の配分には、多数から少数へ向かう段階がつねにある。ただし、多数が少数に従うこともあれば、少数が多数に従うこともある。
    translation_status: reviewed
  - id: rsc-b3-c07-002
    section_id: rsc-b3-c07
    kind: paragraph
    origin: source
    source_text: Quelquefois il y a partage égal ; soit quand les parties constitutives sont dans une dépendance mutuelle, comme dans le Gouvernement d’Angleterre ; soit quand l’autorité de chaque partie est indépendante mais imparfaite, comme en Pologne. Cette derniere forme est mauvaise, parce qu’il n’y a point d’unité dans le Gouvernement, & que l’Etat manque de liaison.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '172'
        source_sequence: 314
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/184
        printed_page_end: '173'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c07-002-print
    translation_ja: ときには等しく分けられる。イングランドの政府のように、構成部分が互いに依存する場合もあれば、ポーランドのように、それぞれの権威が独立してはいるが、不完全である場合もある。後の形はよくない。政府に一体性がなく、国家の結びつきも足りないからである。
    translation_status: reviewed
  - id: rsc-b3-c07-003
    section_id: rsc-b3-c07
    kind: paragraph
    origin: source
    source_text: Lequel vaut le mieux, d’un Gouvernement simple ou d’un Gouvernement mixte ? Question fort agitée chez les politiques, & à laquelle il faut faire la même réponse que j’ai faite ci-devant sur toute forme de Gouvernement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '173'
        source_sequence: 315
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/185
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c07-003-print
    translation_ja: 単一の政府と混合政府のどちらがよいのか。政治論者が大いに論じてきた問いだが、これには、すべての政府の形について先に答えたのと、同じ答えをしなければならない。
    translation_status: reviewed
  - id: rsc-b3-c07-004
    section_id: rsc-b3-c07
    kind: paragraph
    origin: source
    source_text: Le Gouvernement simple est le meilleur en soi, par cela seul qu’il est simple. Mais quand la Puissance exécutive ne dépend pas assez de la législative, c’est-à-dire, quand il y a plus de rapport du Prince au Souverain que du Peuple au Prince, il faut remédier à ce défaut de proportion en divisant le Gouvernement ; car alors toutes ses parties n’ont pas moins d’autorité sur les sujets, & leur division les rend toutes ensemble moins fortes contre le Souverain.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '173'
        source_sequence: 316
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/185
        printed_page_end: '174'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c07-004-print
    translation_ja: 単一の政府は、単一であるというだけで、それ自体としては最善である。だが、行政権が立法権に十分従っていないとき、すなわち主権者に対する統治者の比が、統治者に対する人民の比より大きいときには、政府を分けて、この不均衡を正す必要がある。その場合、分けられた部分が臣民に対して持つ権威は少しも減らないのに、主権者に対しては、分けられた全体として弱くなるからだ。
    translation_status: reviewed
  - id: rsc-b3-c07-005
    section_id: rsc-b3-c07
    kind: paragraph
    origin: source
    source_text: On previent encore le même inconvénient en établissant des magistrats intermédiaires, qui, laissant le Gouvernement en son entier, servent seulement à balancer les deux Puissances & à maintenir leurs droits respectifs. Alors le Gouvernement n’est pas mixte, il est tempéré.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '174'
        source_sequence: 317
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/186
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c07-005-print
    translation_ja: 中間に行政官を設けても、同じ不都合を防げる。この行政官は政府には手を加えず、二つの権力を釣り合わせ、それぞれの権利を保つためだけに働く。このとき政府は混合されているのではなく、度を越えないよう調整されている。
    translation_status: reviewed
  - id: rsc-b3-c07-006
    section_id: rsc-b3-c07
    kind: paragraph
    origin: source
    source_text: On peut remédier par des moyens semblables à l’inconvénient opposé, & quand le Gouvernement est trop lâche, ériger des Tribunaux pour le concentrer. Cela se pratique dans toutes les Démocraties. Dans le premier cas on divise le Gouvernement pour l’affoiblir, & dans le second pour le renforcer ; car les maximum de force & de foiblesse se trouvent également dans les Gouvernemens simples, au lieu que les formes mixtes donnent une force moyenne.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '174'
        source_sequence: 318
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/186
        printed_page_end: '175'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c07-006-print
    translation_ja: 同じような手段で、反対の不都合も正せる。政府のまとまりが弱すぎるときには、機関を設けて力を集中させる。あらゆる民主政でこのやり方がとられる。前の場合には、政府を弱めるために分け、後の場合には、強めるために分ける。単一の政府には最大の強さも最大の弱さもあるが、混合の形は中程度の力をもたらすからである。
    translation_status: reviewed
  - id: rsc-b3-c08-heading
    section_id: rsc-b3-c08
    kind: heading
    origin: source
    source_text: CHAPITRE VIII.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '175'
        source_sequence: 319
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/187
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-heading-print
    translation_ja: 第八章
    translation_status: reviewed
  - id: rsc-b3-c08-title
    section_id: rsc-b3-c08
    kind: heading
    origin: source
    source_text: Que toute forme de Gouvernement n’est pas propre à tout pays.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '175'
        source_sequence: 320
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/187
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-title-print
    translation_ja: どの政府の形も、どの国にもふさわしいわけではない
    translation_status: reviewed
  - id: rsc-b3-c08-001
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: La liberté n’étant pas un fruit de tous les Climats n’est pas à la portée de tous les peuples. Plus on médite ce principe établi par Montesquieu, plus on en sent la vérité. Plus on le conteste, plus on donne occasion de l’établir par de nouvelles preuves.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '175'
        source_sequence: 321
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/187
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-001-print
    translation_ja: 自由はどんな気候にも実るものではないから、どの人民の手にも届くわけではない。モンテスキューが立てたこの原理は、考えれば考えるほど、本当だと感じられる。反論すればするほど、この原理を立てる新しい証拠を挙げる機会が増える。
    translation_status: reviewed
  - id: rsc-b3-c08-002
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: Dans tous les Gouvernemens du monde la personne publique consomme & ne produit rien. D’où lui vient donc la substance consommée ? Du travail de ses membres. C’est le superflu des particuliers qui produit le nécessaire du public. D’où il suit que l’état civil ne peut subsister qu’autant que le travail des hommes rend au delà de leurs besoins.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '175'
        source_sequence: 322
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/187
        printed_page_end: '176'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-002-print
    translation_ja: 世界のどの政府でも、公の人格は消費するだけで、何も生産しない。では、消費する物資はどこから来るのか。構成員の労働からである。個人の余りが、公に必要なものを生み出す。したがって、人々の労働が、生活に必要な以上のものを生むかぎりでしか、市民状態は存続できない。
    translation_status: reviewed
  - id: rsc-b3-c08-003
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: Or cet excédent n’est pas le même dans tous les pays du monde. Dans plusieurs il est considérable, dans d’autres médiocres, dans d’autres nul, dans d’autres négatif. Ce rapport dépend de la fertilité du climat, de la sorte de travail que la terre exige, de la nature de ses productions, de la force de ses habitans, de la plus ou moins grande consommation qui leur est nécessaire, & de plusieurs autres rapports semblables desquels il est composé.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '176'
        source_sequence: 323
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/188
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-003-print
    translation_ja: ところがこの余りは、世界のどの国でも同じというわけではない。かなり多い国もあれば、ほどほどの国もあり、ない国もあり、反対に不足する国もある。この割合は、気候がどれほど土地を肥やすか、土地が求める労働の種類、産物の性質、住民の力、生きるための消費の多寡にかかっている。そのほか似たようないくつもの関係も合わさって、この割合を成り立たせる。
    translation_status: reviewed
  - id: rsc-b3-c08-004
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: D’autre part, tous les Gouvernemens ne sont pas de même nature ; il y en a de plus ou moins dévorans, & les différences sont fondées sur cet autre principe que, plus les contributions publiques s’éloignent de leur source, & plus elles sont onéreuses. Ce n’est pas sur la quantité des impositions qu’il faut mésurer cette charge, mais sur le chemin qu’elles ont à faire pour retourner dans les mains dont elles sont sorties ; quand cette circulation est prompte & bien établie, qu’on paye peu ou beaucoup, il n’importe ; le peuple est toujours riche & les finances vont toujours bien. Au contraire, quelque peu que le Peuple donne, quand ce peu ne lui revient point, en donnant toujours bientôt il s’épuise ; l’État n’est jamais riche, & le peuple est toujours gueux.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '176'
        source_sequence: 324
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/188
        printed_page_end: '177'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-004-print
    translation_ja: 他方、政府の性質も同じではない。多く食い尽くす政府も、そうでない政府もある。この違いは次の原則による。公の負担が、これを出すところから遠ざかれば遠ざかるほど、重くなる。負担は税の額ではなく、税を出した人のもとへ戻るまでの道のりで測らなくてはならない。この循環が速く、うまく成り立っていれば、払う額の多少は問題でない。人民はつねに豊かで、財政はつねに健全である。反対に、人民がどれほどわずかしか納めなくても、それが戻ってこないなら、納め続けるうちに、じきに力尽きる。国家は決して豊かにならず、人民はいつまでも物乞いのような暮らしである。
    translation_status: reviewed
  - id: rsc-b3-c08-005
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: Il suit de-là que plus la distance du peuple au Gouvernement augmente, & plus les tributs deviennent onéreux ; ainsi dans la Démocratie le peuple est le moins chargé, dans l’Aristocratie il l’est davantage, dans la Monarchie il porte le plus grand poids. La Monarchie ne convient donc qu’aux nations opulentes, l’Aristocratie aux États médiocres en richesse ainsi qu’en grandeur, la Démocratie aux États petits & pauvres.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '177'
        source_sequence: 325
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/189
        printed_page_end: '178'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-005-print
    translation_ja: こうして人民と政府の距離が広がるほど、税の負担は重くなる。ゆえに、民主政では人民の負担が最も軽く、貴族政ではそれより重く、君主政では最も重い。したがって君主政は富んだ国々にしか、貴族政は富と大きさが中くらいの国々にしか、民主政は小さく貧しい国々にしかふさわしくない。
    translation_status: reviewed
  - id: rsc-b3-c08-006
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: En effet, plus on y réfléchit, plus on trouve en ceci de différence entre les États libres & les monarchiques ; dans les premiers tout s’emploie à l’utilité commune ; dans les autres les forces publiques & particulieres sont réciproques, & l’une s’augmente par l’affoiblissement de l’autre. Enfin au lieu de gouverner les sujets pour les rendre heureux, le despotisme les rend misérables pour les gouverner.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '178'
        source_sequence: 326
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/190
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-006-print
    translation_ja: 実際、この点では、考えれば考えるほど、自由な国家と君主国の違いがわかる。前者では、すべてが共通の利益のために用いられる。後者では、公の力と私人の力は、一方が弱くなることで、もう一方が強くなる関係にある。つまるところ、専制は臣民を幸福にするために治めるのではなく、治めるために臣民を不幸にするのである。
    translation_status: reviewed
  - id: rsc-b3-c08-007
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: 'Voila donc dans chaque climat des causes naturelles sur lesquelles on peut assigner la forme de Gouvernement à laquelle la force du climat l’entraîne, & dire même quelle espece d’habitans il doit avoir. Les lieux ingrats & stériles où le produit ne vaut pas le travail doivent rester incultes & deserts, ou seulement peuplés de Sauvages : Les lieux où le travail des hommes ne rend exactement que le nécessaire doivent être habités par des peuples barbares, toute politie y seroit impossible : les lieux où l’excès du produit sur le travail est médiocre conviennent aux peuples libres ; ceux où le terroir abondant & fertile donne beaucoup de produit pour peu de travail veulent être gouvernés monarchiquement, pour consumer par le luxe du Prince l’excès du superflu des sujets ; car il vaut mieux que cet excès soit absorbé par le gouvernement que dissipé par les particuliers. Il y a des exceptions, je le sais ; mais ces exceptions-mêmes confirment la regle, en ce qu’elles produisent tôt ou tard des révolutions qui ramenent les choses dans l’ordre de la nature.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '178'
        source_sequence: 327
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/190
        printed_page_end: '179'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-007-print
    translation_ja: こうして、どの気候にも自然の原因があり、それに基づいて、その気候が国を向かわせる政府の形を、さらには、そこにどんな人々が住むはずかを示すことができる。収穫が労働に見合わないやせた不毛の土地は、耕作されず無人のままか、未開の人々だけが住むはずだ。人々の労働が生きるのに必要なものだけを生む土地には、未開の人民が住むはずである。そこではいかなる政治の秩序も成り立たない。労働に対する産物の余りがほどほどのところは、自由な人民にふさわしい。豊かで肥沃な土がわずかな労働から多くの産物を与えるところは、君主政で治められるべきだ。臣民の余剰のさらに余った分を、統治者の奢侈で使い果たすためである。余りが私人に浪費されるよりは、政府に吸い上げられるほうがよい。例外があることは承知している。だがその例外さえ、遅かれ早かれ革命を生み、物事を自然の秩序へと引き戻す点で、原則を裏づけている。
    translation_status: reviewed
  - id: rsc-b3-c08-008
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: 'Distingons toujours les loix générales des causes particulieres qui peuvent en modifier l’effet. Quand tout le midi seroit couvert de Républiques & tout le nord d’Etats despotiques il n’en seroit pas moins vrai que par l’effet du climat le despotisme convient aux pays chauds, la barbarie aux pays froids, & la bonne politie aux régions intermédiaires. Je vois encore qu’en accordant le principe on pourra disputer sur l’application : on pourra dire qu’il y a des pays froids très-fertiles & des méridionaux très-ingrats. Mais cette difficulté n’en est une que pour ceux qui n’examinent pas la chose dans tous ses rapports. Il faut, comme je l’ai déjà dit, compter ceux des travaux, des forces, de la consommation, &c.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '179'
        source_sequence: 328
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/191
        printed_page_end: '180'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-008-print
    translation_ja: 一般の法則と、その作用を変えうる個別の原因とは、つねに区別しよう。たとえ南のすべてが共和国でおおわれ、北のすべてが専制国でおおわれても、気候の作用によって、専制は暑い国に、未開は寒い国に、よい政治秩序はその中間にふさわしいということは、やはり真実だろう。原理を認めても、そのあてはめ方は争えるだろうと、私にもわかる。たいへん肥沃な寒国と、たいへん不毛な南国がある、と言えるだろう。しかしこれは、物事をあらゆる関係から調べない人にとってしか、難点ではない。すでに述べたように、労働の関係、力の関係、消費の関係などを数に入れなければならない。
    translation_status: reviewed
  - id: rsc-b3-c08-009
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: Supposons que de deux terreins égaux l’un rapporte cinq & l’autre dix. Si les habitans du premier consomment quatre & ceux du dernier neuf, l’excès du premier produit sera 1/5. & celui du second 1/10. Le rapport de ces deux excès étant donc inverse de celui des produits, le terrein qui ne produira que cinq donnera un superflu double de celui du terrein qui produira dix.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '180'
        source_sequence: 329
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/192
        printed_page_end: '181'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-009-print
    translation_ja: 同じ広さの二つの土地があり、一方が五、もう一方が十を産するとしよう。第一の土地の住民が四を、第二の土地の住民が九を消費すれば、余りはそれぞれ産物の五分の一と十分の一となる。余りの割合の比は、産物の比とは逆なので、五しか産まない土地の余りの割合は、十を産む土地の二倍となる。
    translation_status: reviewed
  - id: rsc-b3-c08-010
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: Mais il n’est pas question d’un produit double, & je ne crois pas que personne ose mettre en général la fertilité des pays froids en égalité même avec celle des pays chauds. Toutefois supposons cette égalité ; laissons, si l’on veut, en balance l’Angleterre avec la Sicile, & la Pologne avec l’Egypte. Plus au midi nous n’aurons l’Affrique & les Indes, plus au nord nous n’aurons plus rien. Pour cette égalité de produit, quelle différence dans la culture ? En Sicile il ne faut que grater la terre ; en Angleterre que de soins pour la labourer ! Or là où il faut plus de bras pour donner le même produit, le superflu doit être nécessairement moindre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '181'
        source_sequence: 330
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/193
        printed_page_end: '182'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-010-print
    translation_ja: しかし、産物が二倍になることを論じているのではない。一般に、寒国の肥沃さを暑い国と同等とさえ見なす勇気がある人は、まずいないと思う。それでも、等しいと仮定しよう。イングランドとシチリア、ポーランドとエジプトを、釣り合いが取れていると見なしてよい。さらに南にはアフリカとインドがあるが、さらに北にはもう何もない。同じ産物を得るために、耕作の手間はどれほど違うか。シチリアでは土の表面をかくだけでよい。イングランドでは土を耕すのに、どれほど手間がかかることか。ところで、同じ産物を得るのに手数が多く必要なところでは、余りは必ず少なくなる。
    translation_status: reviewed
  - id: rsc-b3-c08-011
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: 'Considerez, outre cela, que la même quantité d’hommes consomme beaucoup moins dans les pays chauds. Le climat demande qu’on y soit sobre pour se porter bien : les Européens qui veulent y vivre comme chez eux périssent tous de disserenterie & d’indigestions. Nous sommes, dit Chardin, des bêtes carnacieres, des loups, en comparaison des Asiatiques. Quelques-uns attribuent la sobriété des Persans à ce que leur pays est moins cultivé, & moi je crois au contraire que leur pays abonde moins en denrées parce qu’il en faut moins aux habitans. Si leur frugalité, continue-t-il, étoit un effet de la disette du pays, il n’y auroit que les pauvres qui mangeroient peu, au lieu que c’est généralement tout le monde, & on mangeroit plus ou moins en chaque province selon la fertilité du pays, au lieu que la même sobriété se trouve par tout le royaume. Ils se louent fort de leur maniere de vivre, disant qu’il ne faut que regarder leur teint pour reconnoitre combien elle est plus excellente que celle des chrétiens. En effet le teint des Persans est uni ; ils ont la peau belle fine & polie, au lieu que le teint des Arméniens leurs sujets qui vivent à l’Européenne est rude, couperosé, & que leurs corps sont gros & pesants.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '182'
        source_sequence: 331
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/194
        printed_page_end: '183'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-011-print
    translation_ja: さらに、暑い国では、同じ人数でも消費がずっと少ないことを考えてほしい。その気候では、健康でいるには節食が必要である。自国と同じように暮らそうとするヨーロッパ人は、赤痢や消化不良でことごとく命を落とす。「アジアの人々に比べれば、われわれは肉食獣で、オオカミだ」とシャルダンは言う。「ペルシア人がつつましく食べるのは、土地があまり耕されていないからだという人もいる。しかし逆に、住民に要る食べ物が少ないから、国の食べ物がそれほど豊かではないのだ、と私は思う。もし彼らの質素さが国の不足の結果なら、食が細いのは貧しい人だけだろう。実際には誰もがそうだ。また、土地の肥沃さに応じて、州ごとに食べる量は違うはずだが、実際には王国中に同じ節食の習慣がある。彼らは自分たちの暮らし方を大いに褒め、キリスト教徒の暮らし方よりどれほど優れているかは、顔色を見ればわかると言う。」実際、ペルシア人は顔の色にむらがなく、肌は美しく、きめ細かく、なめらかだ。その臣民で、ヨーロッパ風に暮らすアルメニア人は、顔の肌が荒れて赤ら顔で、体は太く重い。
    translation_status: reviewed
  - id: rsc-b3-c08-012
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: Plus on approche de la ligne, plus les peuples vivent de peu. Ils ne mangent presque pas de viande ; le ris, le mays, le cuzcuz, le mil, la cassave, sont leurs alimens ordinaires. Il y a aux Indes des millions d’hommes dont la nourriture ne coute pas un sol par jour. Nous voyons en Europe-même des différences sensibles pour l’appetit entre les peuples du nord & ceux du midi. Un Espagnol vivra huit jours du diner d’un Allemand. Dans les pays où les hommes sont plus voraces le luxe se tourne aussi vers les choses de consommation. En Angleterre, il se montre sur une table chargée de viandes ; en Italie on vous régale de sucre & de fleurs.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '183'
        source_sequence: 332
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/195
        printed_page_end: '184'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-012-print
    translation_ja: 赤道に近づくにつれ、人民はますます少ないもので暮らす。肉はほとんど食べない。米、トウモロコシ、クスクス、雑穀、キャッサバがふだんの食べ物だ。インドには、食費が一日一スーもかからない人が、何百万人といる。ヨーロッパでも、北と南の人民の食欲には、はっきり違いがある。ドイツ人の一回の食事で、スペイン人は八日暮らすだろう。人々がよく食べる国では、ぜいたくも食べ物に向かう。イングランドでは肉でいっぱいの食卓にそれが現れ、イタリアでは砂糖菓子と花が客にふるまわれる。
    translation_status: reviewed
  - id: rsc-b3-c08-013
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: Le luxe des vêtemens offre encore de semblables différences. Dans les climats où les changemens des saisons sont prompts & violens, on a des habits meilleurs & plus simples, dans ceux où l’on ne s’habille que pour la parure on y cherche plus d’éclat que d’utilité, les habits eux-mêmes y sont un luxe. A Naples vous verrez tous les jours se promener au Pausylippe des hommes en veste dorée & point de bas. C’est la même chose pour les bâtimens ; on donne tout à la magnificence quand on n’a rien à craindre des injures de l’air. A Paris à Londres on veut être logé chaudement & commodément. A Madrid on a des salons superbes, mais point de fénêtres qui ferment, & l’on couche dans des nids-à-rats.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '184'
        source_sequence: 333
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/196
        printed_page_end: '185'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-013-print
    translation_ja: 衣服のぜいたくにも、同じような違いがある。季節の移り変わりが速く激しい気候では、衣服は質がよく、簡素である。装いのためだけに服を着るところでは、用に立つことより華やかさが求められ、服を着ること自体がぜいたくなのだ。ナポリのポジリポを毎日散歩する人々を見れば、金の飾りのついた上着を着ているのに、靴下ははいていない。建物も同じである。風雨の害を恐れなくてよいところでは、立派に見せることにすべてを注ぐ。パリやロンドンでは、暖かく居心地のよい家に住もうとする。マドリードの家には見事な客間はあるが、きちんと閉まる窓はなく、ネズミの巣のようなところで寝る。
    translation_status: reviewed
  - id: rsc-b3-c08-014
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: 'Les alimens sont beaucoup plus substanciels & succulens dans les pays chauds ; c’est une troisieme différence qui ne peut manquer d’influer sur la seconde. Pourquoi mange-t-on tant de légumes en Italie ? parce qu’ils y sont bons, nourrissans, d’excellent goût : En France où ils ne sont nourris que d’eau ils ne nourrissent point, & sont presque comptés pour rien sur les tables. Ils n’occupent pourtant pas moins de terrein & coûtent du moins autant de peine à cultiver. C’est une expérience faite que les bleds de Barbarie, d’ailleurs inférieurs à ceux de France, rendent beaucoup plus en farine, & que ceux de France à leur tour rendent plus que les bleds du Nord. D’où l’on peut inférer qu’une gradation semblable s’observe généralement dans la même direction de la ligne au pole. Or n’est-ce pas un desavantage visible d’avoir dans un produit égal une moindre quantité d’aliment ?'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '185'
        source_sequence: 334
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/197
        printed_page_end: '186'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-014-print
    translation_ja: 暑い国の食べ物は、ずっと滋養があり、おいしい。これが第三の違いで、第二の違いに影響しないはずはない。イタリアではなぜ野菜をあれほど食べるのか。おいしく、滋養があり、味がすばらしいからだ。フランスの野菜は、水で養われているだけなので、人を養う力がなく、食卓では、ほとんど取るに足らないものとされる。それでも、使う土地は少なくないし、育てる手間も少なくとも同じだけかかる。北アフリカの小麦は品質ではフランスの小麦に劣るが、ひけばずっと多くの粉になり、フランスの小麦は、今度は北の国々の小麦より多くの粉になる。これは実際に確認されている。こうして、赤道から極に向かう同じ方向に、一般にも同じような段階が見られると推測できる。ところで、同じ量を作っても得られる食べ物が少ないのは、明らかに不利ではないか。
    translation_status: reviewed
  - id: rsc-b3-c08-015
    section_id: rsc-b3-c08
    kind: paragraph
    origin: source
    source_text: 'A toutes ces différentes considérations j’en puis ajoûter une qui en découle & qui les fortifie ; c’est que les pays chauds ont moins besoins d’habitans que les pays froids, & pourroient en nourrir davantage ; ce qui produit un double superflu toujours à l’avantage du despotisme. Plus le même nombre d’habitans occupe une grande surface, plus les révoltes deviennent difficiles ; parce qu’on ne peut se concerter ni promptement ni secretement, & qu’il est toujours facile au Gouvernement d’éventer les projets & de couper les communications ; mais plus un peuple nombreux se rapproche, moins le Gouvernement peut usurper sur le Souverain ; les chefs déliberent aussi surement dans leurs chambres que le Prince dans son conseil, & la foule s’assemble aussi-tôt dans les places que les troupes dans leurs quartiers. L’avantage d’un Gouvernement tirannique est donc en ceci d’agir à grandes distances. À l’aide des points d’appui qu’il se donne sa force augmente au loin comme celle des léviers. Celle du peuple au contraire n’agit que concentrée, elle s’évapore & se perd en s’étendant, comme l’effet de la poudre éparse à terre & qui ne prend feu que grain à grain. Les pays les moins peuplés sont ainsi les plus propres à la Tirannie : les bêtes féroces ne regnent que dans les déserts.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '186'
        source_sequence: 335
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/198
        printed_page_end: '188'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b3-c08-015-print
    translation_ja: 以上の考察から生まれ、それを強める、もう一つのことをつけ加えられる。暑い国では寒い国より住民を必要とせず、その一方で、より多くの住民を養える。そこから二重の余剰が生まれ、つねに専制に有利にはたらく。同じ人数の住民が広い土地に住むほど、反乱は難しくなる。すばやく内密に申し合わせることができず、政府には計画をかぎつけて連絡を断つことがつねに容易だからだ。だが、大勢の人民が近くに暮らすほど、政府には主権者の権利を横取りしにくくなる。指導者は、統治者が評議会で審議するのと同じように、自分の部屋で安全に審議でき、人々は、兵隊が兵舎に集まるのと同じように、すぐ広場に集まる。したがって、圧制政府は、遠くまで力を及ぼせる点で有利である。足場を設ければ、てこと同じように、遠くまで力を増す。反対に人民の力は、集まったときだけはたらき、広がると消えてなくなる。地面に散った火薬は一粒ずつしか燃えず、効き目がなくなるのと同じだ。だから、最も人口の少ない国々が、最も圧制に向く。猛獣が君臨するのは、人のいないところだけである。
    translation_status: reviewed
  - id: rsc-note-22-text
    section_id: rsc-b3-c08
    kind: note_body
    origin: source
    source_text: 'Ceci ne contredit pas ce que j’ai dit ci-devant L. II. Chap. IX. Sur les inconvéniens des grands États : car il s’agissoit-là de l’autorité du Gouvernement sur ses membres, & il s’agit ici de sa force contre les sujets. Ses membres épars lui servent de point d’appui pour agir au loin sur le peuple, mais il n’a nul point d’appui pour agir directement sur ses membres-mêmes. Ainsi dans l’un des cas la longueur du lévier en fait la foiblesse, & la force dans l’autre cas.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '187'
        source_sequence: 336
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/199
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-22-text-print
    translation_ja: これは、大国の不都合について先に第二編第九章で述べたことと矛盾しない。そこで問題にしたのは、政府が自らの構成員に対して持つ権威であり、ここで問題にしているのは、政府が臣民に対して使う力である。各地に散った構成員は、政府が遠くの人民に力を及ぼすための足場となる。しかし政府が構成員そのものに直接働きかけるための足場はない。だから、てこが長いことで、一方では弱くなり、もう一方では強くなるのである。
    translation_status: reviewed

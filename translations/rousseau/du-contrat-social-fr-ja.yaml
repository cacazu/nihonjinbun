    translation_status: reviewed
  - id: rsc-b1-c04-title
    section_id: rsc-b1-c04
    kind: heading
    origin: source
    source_text: De l’esclavage.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '13'
        source_sequence: 35
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/25
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-title-print
    translation_ja: 奴隷制について
    translation_status: reviewed
  - id: rsc-b1-c04-001
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: Puis qu’aucun homme n’a une autorité naturelle sur son semblable, & puisque la force ne produit aucun droit, restent donc les conventions pour base de toute autorité légitime parmi les hommes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '13'
        source_sequence: 36
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/25
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-001-print
    translation_ja: どんな人間にも同類を支配する生まれながらの権威はなく、力もいかなる権利をも生まないのだから、人間のあいだの正当な権威の土台として残るのは、合意だけである。
    translation_status: reviewed
  - id: rsc-b1-c04-002
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: 'Si un particulier, dit Grotius, peut aliéner sa liberté & se rendre esclave d’un maitre, pourquoi tout un peuple ne pourroit-il pas aliéner la sienne & se rendre sujet d’un roi ? Il y a là bien des mots équivoques qui auroient besoin d’explication, mais tenons-nous en à celui d’aliéner. Aliéner c’est donner ou vendre. Or un homme qui se fait esclave d’un autre ne se donne pas, il se vend, tout au moins pour sa subsistance : mais un peuple pour quoi se vend-il ? Bien loin qu’un roi fournisse à ses sujets leur subsistance il ne tire la sienne que d’eux, & selon Rabelais un roi ne vit pas de peu. Les sujets donnent donc leur personne à condition qu’on prendra aussi leur bien ? Je ne vois pas ce qu’il leur reste à conserver.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '13'
        source_sequence: 37
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/25
        printed_page_end: '14'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-002-print
    translation_ja: 一個人が自由を手放し、誰かの奴隷になれるのなら、人民全体にも自由を手放して王の臣民となれないはずがあろうか、とグロティウスは言う。ここには説明を要する曖昧な言葉がいくつもあるが、「手放す」という一語にしぼろう。手放すとは、与えるか売るかだ。ある人が他人の奴隷になるのは、自分を与えるのではなく、せめて暮らしを立てるため、自分を売るのである。だが、人民は何を目当てに自分を売るのか。王は臣民を養うどころか、彼らに養われるほかなく、ラブレーに言わせれば、王はわずかなものでは暮らせない。それでは、臣民は財産までも取ってもらうという条件で、自分の身を差し出すのか。彼らには何を守る余地が残るのか、私にはわからない。
    translation_status: reviewed
  - id: rsc-b1-c04-003
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: On dira que le despote assure à ses sujets la tranquillité civile. Soit ; mais qu’y gagnent-ils, si les guerres que son ambition leur attire, si son insatiable avidité, si les vexations de son ministere les désolent plus que ne feroient leurs dissentions ? Qu’y gagnent-ils, si cette tranquillité-même est une de leurs miseres ? On vit tranquille aussi dans les cachots ; en est-ce assez pour s’y trouver bien ? Les Grecs enfermés dans l’antre du Cyclope y vivoient tranquilles, en attendant que leur tour vint d’être dévorés.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '14'
        source_sequence: 38
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/26
        printed_page_end: '15'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-003-print
    translation_ja: 専制君主が臣民に国内の平穏を保障するという人もいるだろう。それはそうかもしれない。しかし、君主の野心が招く戦争、その飽くことのない貪欲、役人たちの横暴が、内輪もめをするより大きな災いをもたらすなら、臣民に何の得があるのか。その平穏そのものが苦しみの一つなら、何の得になるのか。牢獄でも平穏には暮らせるが、それだけで居心地がよいといえるか。キュクロプスの洞窟に閉じ込められたギリシア人たちも、自分が食われる番を待つあいだ、平穏に暮らしていた。
    translation_status: reviewed
  - id: rsc-b1-c04-004
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: 'Dire qu’un homme se donne gratuitement, c’est dire une chose absurde & inconcevable ; un tel acte est illégitime & nul, par cela seul que celui qui le fait n’est pas dans son bon sens. Dire la même chose de tout un peuple, c’est supposer un peuple de foux : la folie ne fait pas droit.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '15'
        source_sequence: 39
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/27
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-004-print
    translation_ja: 人が何の見返りもなく身を差し出すというのは、でたらめで、理解できない話である。そんなことをする人が正気ではないというだけで、その行為は正当性を欠き、無効となる。人民全体について同じことを言うなら、正気でない者ばかりの人民を仮定することになる。狂気に権利を生む力はない。
    translation_status: reviewed
  - id: rsc-b1-c04-005
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: 'Quand chacun pourroit s’aliéner lui-même il ne peut aliéner ses enfans ; ils naissent hommes & libres ; leur liberté leur appartient, nul n’a droit d’en disposer qu’eux. Avant qu’ils soient en âge de raison, le pere peut en leur nom stipuler des conditions pour leur conservation, pour leur bien être ; mais non les donner irrévocablement & sans condition ; car un tel don est contraire aux fins de la nature, & passe les droits de la paternité. Il faudroit donc, pour qu’un gouvernement arbitraire fut légitime, qu’à chaque génération le peuple fut le maitre de l’admettre ou de le rejetter : mais alors ce gouvernement ne seroit plus arbitraire.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '15'
        source_sequence: 40
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/27
        printed_page_end: '16'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-005-print
    translation_ja: 誰もが自分の身を譲り渡せるとしても、子どもを譲り渡すことはできない。子どもは自由な人間として生まれる。その自由は本人のもので、本人以外にどうこうする権利はない。分別のつく歳に達するまでは、父親は子どもの名で、その身を守り、その幸福をはかるために条件を取り決めることができる。だが、取り消しもできない無条件の形で子どもを引き渡すことはできない。そんな譲渡は自然の目的に背き、父親の権利を越えている。したがって、恣意的な政府が正当であるには、世代が変わるたびに、その政府を受け入れるか退けるかを人民が自由に決められなければならない。ところがそうなれば、その政府はもはや恣意的ではない。
    translation_status: reviewed
  - id: rsc-b1-c04-006
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: Renoncer à sa liberté c’est renoncer à sa qualité d’homme, aux droits de l’humanité, même à ses devoirs. Il n’y a nul dédommagement possible pour quiconque renonce à tout. Une telle renonciation est incompatible avec la nature de l’homme, & c’est ôter toute moralité à ses actions que d’ôter toute liberté à sa volonté. Enfin c’est une convention vaine & contradictoire de stipuler d’une part une autorité absolue & de l’autre une obéissance sans bornes. N’est-il pas clair qu’on n’est engagé à rien envers celui dont on a droit de tout éxiger, & cette seule condition sans équivalent sans échange n’entraîne-t-elle pas la nullité de l’acte ? Car quel droit mon esclave auroit-il contre moi, puisque tout ce qu’il a m’appartient, & que son droit étant le mien, ce droit de moi contre moi-même est un mot qui n’a aucun sens ?
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '16'
        source_sequence: 41
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/28
        printed_page_end: '17'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-006-print
    translation_ja: 自由を捨てるとは、人間であることを捨て、人間の権利を捨て、さらには人間の義務まで捨てることだ。すべてを捨てる者には、どんな埋め合わせもありえない。そんな放棄は人間の本性と相いれない。人の意志から自由をすべて奪うのは、その行為から道徳的な意味をすべて奪うに等しい。つまるところ、一方に絶対的な権威を、他方に際限のない服従を定めるのは、無意味で矛盾した合意である。何でも要求できる相手に対しては、こちらは何一つ約束を負わないことは明らかではないか。釣り合いも見返りもないというこの一点だけで、その取り決めは無効になるのではないか。というのも、奴隷の持つものがことごとく私に属するなら、奴隷が私に対してどんな権利を持ちえよう。その権利が私のものである以上、私が私自身に対して持つ権利など、意味をなさない言葉ではないか。
    translation_status: reviewed
  - id: rsc-b1-c04-007
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: Grotius & les autres tirent de la guerre une autre origine du prétendu droit d’esclavage. Le vainqueur ayant, selon eux, le droit de tuer le vaincu, celui-ci peut racheter sa vie aux dépens de sa liberté ; convention d’autant plus légitime qu’elle tourne au profit de tous deux.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '17'
        source_sequence: 42
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/29
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-007-print
    translation_ja: グロティウスらは、奴隷とする権利と称するもののもう一つの起源を、戦争に求める。彼らによれば、勝者には敗者を殺す権利があるので、敗者は自由を代償にして命を買い戻すことができる。双方の利益になる以上、その合意はいっそう正当だというのである。
    translation_status: reviewed
  - id: rsc-b1-c04-008
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: Mais il est clair que ce prétendu droit de tuer les vaincus ne résulte en aucune maniere de l’état de guerre. Par cela seul que les hommes vivant dans leur primitive indépendance n’ont point entre eux de rapport assez constant pour constituer ni l’état de paix ni l’état de guerre, ils ne sont point naturellement ennemis. C’est le rapport des choses & non des hommes qui constitue la guerre, & l’état de guerre ne pouvant naitre des simples rélations personnelles, mais seulement des rélations réelles, la guerre privée ou d’homme à homme ne peut exister, ni dans l’état de nature où il n’y a point de propriété constante, ni dans l’état social où tout est sous l’autorité des loix.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '17'
        source_sequence: 43
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/29
        printed_page_end: '18'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-008-print
    translation_ja: だが、敗者を殺すこの権利とやらは、戦争状態から決して生まれない。人間は、もともとの独立した暮らしにおいては、平和状態も戦争状態も成り立たせられるほど持続した関係を互いに持たない。このことだけでも、もとから互いの敵なのではないとわかる。戦争を成り立たせるのは人のあいだの関係でなく、物のあいだの関係である。単なる人と人との関わりからは戦争状態は生まれず、物にかかわる関係からしか生まれないのだから、私的な戦争、すなわち人と人との戦争はありえない。恒常的な所有がない自然状態にも、すべてが法の権威のもとにある社会状態にも、ありえないのである。
    translation_status: reviewed
  - id: rsc-b1-c04-009
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: Les combats particuliers, les duels, les rencontres sont des actes qui ne constituent point un état ; & à l’égard des guerres privées, autorisées par les établissemens de Louis IX roi de France & suspendues par la paix de Dieu, ce sont des abus du gouvernement féodal, systême absurde s’il en fut jamais, contraire aux principes du droit naturel, & à toute bonne politie.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '18'
        source_sequence: 44
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/30
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-009-print
    translation_ja: 個人の争い、決闘、衝突はいずれも一時の行為であり、一つの状態を成り立たせるものではない。フランス王ルイ九世の法令で認められ、神の平和で停止された私戦にしても、封建政治の弊害である。封建政治ほど筋の通らない仕組みはまずなく、自然法の原則にも、どんなまっとうな政治のあり方にも背く。
    translation_status: reviewed
  - id: rsc-b1-c04-010
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: La guerre n’est donc point une rélation d’homme à homme, mais une rélation d’État à État, dans laquelle les particuliers ne sont ennemis qu’accidentellement, non point comme hommes ni même comme citoyens, mais comme soldats ; non point comme membres de la patrie, mais comme ses défenseurs. Enfin chaque État ne peut avoir pour ennemis que d’autres États & non pas des hommes, attendu qu’entre choses de diverses natures on ne peut fixer aucun vrai rapport.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '18'
        source_sequence: 45
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/30
        printed_page_end: '19'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-010-print
    translation_ja: したがって戦争は、一人の人間ともう一人の関係ではなく、国家と国家の関係である。そこにいる個人は、たまたま敵になるにすぎない。人間としてでも、市民としてでさえなく、兵士としてである。祖国の一員としてではなく、その守り手としてなのだ。結局、国家が敵としうるのは他の国家だけで、人間ではない。性質の異なるもの同士には、真の関係を定められないからである。
    translation_status: reviewed
  - id: rsc-b1-c04-011
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: 'Ce principe est même conforme aux maximes établies de tous les tems & à la pratique constante de tous les peuples policés. Les déclarations de guerre sont moins des avertissemens aux puissances qu’à leurs sujets. L’étranger, soit roi, soit particulier, soit peuple, qui vole tüe ou détient les sujets sans déclarer la guerre au prince, n’est pas un ennemi, c’est un brigand. Même en pleine guerre un prince juste s’empare bien en pays ennemi de tout ce qui appartient au public, mais il respecte la personne & les biens des particuliers ; il respecte des droits sur lesquels sont fondés les siens. La fin de la guerre étant la destruction de l’Etat ennemi, on a droit d’en tuer les défenseurs tant qu’ils ont les armes à la main ; mais sitôt qu’ils les posent & se rendent, cessant d’être ennemis ou instrumens de l’ennemi, ils redeviennent simplement hommes & l’on n’a plus de droit sur leur vie. Quelquefois, on peut tuer l’Etat sans tuer un seul de ses membres : Or la guerre ne donne aucun droit qui ne soit nécessaire à sa fin. Ces principes ne sont pas ceux de Grotius ; ils ne sont pas fondés sur des autorités de poëtes, mais ils dérivent de la nature des choses, & sont fondés sur la raison.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '19'
        source_sequence: 46
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/31
        printed_page_end: '20'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-011-print
    translation_ja: この原則は、どの時代にも通用する原則と、政治社会を営むあらゆる人民の変わらぬ慣行にもかなっている。宣戦の布告は、相手国に向けた警告というより、その臣民に向けた警告である。外国の者が、王であれ、個人であれ、人民であれ、君主に宣戦せずにその臣民から奪い、殺し、拘禁するなら、それは敵ではなく、盗賊である。戦争のさなかでも、公正な君主は敵地で公の所有に属するものを押さえるが、私人の身と財産は尊重する。自身の権利の土台となる権利を尊重するのである。戦争の目的は敵国を滅ぼすことなので、その守り手が武器を手にしているあいだは、これを殺す権利がある。だが武器を置いて降伏すれば、彼らは敵でも敵の手先でもなくなり、ただの人間に戻る。もはやその命に対する権利はない。一人の構成員も殺さず、国家だけを滅ぼせることもある。およそ戦争は、その目的に必要でない権利を生まない。これはグロティウスの原則ではない。詩人の権威にではなく、物事の本性に由来し、理性に根ざしている。
    translation_status: reviewed
  - id: rsc-b1-c04-012
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: 'A l’egard du droit de conquête, il n’a d’autre fondement que la loi du plus fort. Si la guerre ne donne point au vainqueur le droit de massacrer les peuples vaincus, ce droit qu’il n’a pas ne peut fonder celui de les asservir. On n’a le droit de tuer l’ennemi que quand on ne peut le faire esclave ; le droit de le faire esclave ne vient donc pas du droit de le tuer : C’est donc un échange inique de lui faire acheter au prix de sa liberté sa vie sur laquelle on n’a aucun droit. En établissant le droit de vie & de mort sur le droit d’esclavage, & le droit d’esclavage sur le droit de vie & de mort, n’est-il pas clair qu’on tombe dans le cercle vicieux ?'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '20'
        source_sequence: 47
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/32
        printed_page_end: '21'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-012-print
    translation_ja: 征服の権利にしても、最も強い者の法以外に土台はない。戦争が勝者に、敗れた人民を皆殺しにする権利を与えないなら、存在しないその権利を、彼らを隷属させる権利の土台にはできない。敵を殺す権利があるのは、奴隷にすることができないときだけである。したがって、奴隷にする権利が、殺す権利から来るのではない。相手の命に何の権利もないのに、その命を自由と引き換えに買い取らせるのは、不正な取引なのである。生殺の権利を奴隷とする権利に基づけ、その奴隷とする権利を生殺の権利に基づけるなら、悪循環に陥るのは明らかではないか。
    translation_status: reviewed
  - id: rsc-b1-c04-013
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: 'En supposant même ce terrible droit de tout tuer, je dis qu’un esclave fait à la guerre ou un peuple conquis n’est tenu à rien du tout envers son maitre, qu’à lui obéir autant qu’il y est forcé. En prenant un équivalent à sa vie le vainqueur ne lui en a point fait grace : au lieu de le tuer sans fruit il l’a tué utilement. Loin donc qu’il ait acquis sur lui nulle autorité jointe à la force, l’état de guerre subsiste entre eux comme auparavant, leur rélation même en est l’effet, & l’usage du droit de la guerre ne suppose aucun traité de paix. Ils ont fait une convention ; soit : mais cette convention, loin de détruire l’état de guerre, en suppose la continuité.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '21'
        source_sequence: 48
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/33
        printed_page_end: '22'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-013-print
    translation_ja: 仮に、誰もが殺されうるという恐ろしい権利を認めても、戦争で奴隷にされた者や征服された人民は、強いられたかぎりで従うほか、主人に対していかなる義務も負わない、と私は言う。勝者は命と同等のものを取り上げたのであって、命を惜しんでやったのではない。何の益もなく殺す代わりに、益になるように殺したのだ。したがって、勝者は力に加えて何か権威を得たどころか、両者のあいだには前と変わらず戦争状態が続いている。その関係そのものが戦争の結果であり、戦争の権利を行使しただけでは、講和条約が結ばれたことにはならない。彼らは合意した。それはそうだろう。だがその合意は戦争状態を消し去るどころか、戦争状態の継続を当然の前提にしている。
    translation_status: reviewed
  - id: rsc-b1-c04-014
    section_id: rsc-b1-c04
    kind: paragraph
    origin: source
    source_text: Ainsi, de quelque sens qu’on envisage les choses, le droit d’esclavage est nul, non seulement parce qu’il est illégitime, mais parce qu’il est absurde & ne signifie rien. Ces mots, esclave, &, droit sont contradictoires ; ils s’excluent mutuellement. Soit d’un homme à un homme, soit d’un homme à un peuple, ce discours sera toujours également insensé. Je fais avec toi une convention toute à ta charge & toute à mon profit, que j’observerai tant qu’il me plaira, & que tu observeras tant qu’il me plaira.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '22'
        source_sequence: 49
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/34
        printed_page_end: '23'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c04-014-print
    translation_ja: だから、どちらから眺めても、奴隷とする権利は無効である。正当でないばかりか、筋が通らず、何も意味しないからだ。「奴隷」と「権利」は相矛盾し、互いを排除する言葉だ。一人が一人に対して言うのであれ、一人が人民に対して言うのであれ、次の口上は同じようにばかげている。「私はおまえと合意する。負担はすべておまえ持ち、得はすべて私のものだ。私は好きなあいだだけこれを守り、おまえには、私の気のすむまでこれを守ってもらう。」
    translation_status: reviewed
  - id: rsc-b1-c05-heading
    section_id: rsc-b1-c05
    kind: heading
    origin: source
    source_text: CHAPITRE V.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '23'
        source_sequence: 50
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/35
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c05-heading-print
    translation_ja: 第五章
    translation_status: reviewed
  - id: rsc-b1-c05-title
    section_id: rsc-b1-c05
    kind: heading
    origin: source
    source_text: Qu’il faut toujours remonter à une premiere convention.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '23'
        source_sequence: 51
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/35
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c05-title-print
    translation_ja: つねに最初の合意までさかのぼる必要がある
    translation_status: reviewed
  - id: rsc-b1-c05-001
    section_id: rsc-b1-c05
    kind: paragraph
    origin: source
    source_text: Quand j’accorderois tout ce que j’ai réfuté jusqu’ici, les fauteurs du despotisme n’en seroient pas plus avancés. Il y aura toujours une grande différence entre soumettre une multitude, & régir une société. Que des hommes épars soient successivement asservis à un seul, en quelque nombre qu’ils puissent être, je ne vois là qu’un maitre & des esclaves, je n’y vois point un peuple & son chef ; c’est si l’on veut une agrégation, mais non pas une association ; il n’y a là ni bien public ni corps politique. Cet homme, eut-il asservi la moitié du monde, n’est toujours qu’un particulier ; son intérêt, séparé de celui des autres, n’est toujours qu’un intérêt privé. Si ce même homme vient à périr, son empire après lui reste épars & sans liaison, comme un chêne se dissout & tombe en un tas de cendres, après que le feu l’a consumé.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '23'
        source_sequence: 52
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/35
        printed_page_end: '24'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c05-001-print
    translation_ja: これまで退けてきたことをすべて認めても、専制の擁護者は少しも先へ進めない。大勢を服従させることと、社会を治めることには、どうしても大きな違いがある。ばらばらだった者たちが一人ずつ、ただ一人の下に隷属したとしよう。その人数がどれほど多かろうと、私に見えるのは主人と奴隷だけで、人民とその長は見えない。寄せ集めとは言えても、結び合った団体ではない。そこには公益も政治体もない。その一人が世界の半分を隷属させていたにせよ、やはり一私人にすぎず、その利益が他人の利益と切り離されているかぎり、やはり私益にすぎない。その者が死ぬと、後には一つにつながらない帝国がばらばらに残る。樫の木が火に焼き尽くされて、崩れ落ち、灰の山になるようなものだ。
    translation_status: reviewed
  - id: rsc-b1-c05-002
    section_id: rsc-b1-c05
    kind: paragraph
    origin: source
    source_text: Un peuple, dit Grotius, peut se donner à un roi. Selon Grotius un peuple est donc un peuple avant de se donner à un roi. Ce don même est un acte civil, il suppose une délibération publique. Avant donc que d’examiner l’acte par lequel un peuple élit un roi, il seroit bon d’examiner l’acte par lequel un peuple est un peuple. Car cet acte étant nécessairement antérieur à l’autre est le vrai fondement de la société.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '24'
        source_sequence: 53
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/36
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c05-002-print
    translation_ja: 一つの人民が自らを王に差し出すことができる、とグロティウスは言う。だとすると、グロティウスによっても、王に身を差し出す前から、人民は一つの人民なのである。身を差し出す行為そのものが市民としての行為であり、公の審議を前提としている。だから、人民が王を選ぶ行為を検討するに先だって、人民が一つの人民となる行為を検討したほうがよい。あとの行為に必ず先立つこの行為こそ、社会の真の土台なのだから。
    translation_status: reviewed
  - id: rsc-b1-c05-003
    section_id: rsc-b1-c05
    kind: paragraph
    origin: source
    source_text: En effet, s’il n’y avoit point de convention antérieure, où seroit, à moins que l’élection ne fut unanime, l’obligation pour le petit nombre de se soumettre au choix du grand, & d’où cent qui veulent un maitre ont-ils le droit de vôter pour dix qui n’en veulent point ? La loi de la pluralité des suffrages est elle-même un établissement de convention, & suppose au moins une fois l’unanimité.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '24'
        source_sequence: 54
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/36
        printed_page_end: '26'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c05-003-print
    translation_ja: たしかに、前もって何の合意もないとすれば、選挙が全員一致でないかぎり、少数が多数の選択に従う義務はどこから来るのか。主人を欲する百人は、欲しがらない十人に代わって票を投じる権利を、どこから得たというのか。多数決の規則そのものが合意による取り決めであり、少なくとも一度は全員一致があったことを前提にしている。
    translation_status: reviewed
  - id: rsc-b1-c06-heading
    section_id: rsc-b1-c06
    kind: heading
    origin: source
    source_text: CHAPITRE VI.
    source_languages:

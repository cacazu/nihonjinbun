    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '253'
        source_sequence: 482
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/265
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-34-text-print

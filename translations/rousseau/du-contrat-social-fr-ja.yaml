    translation_status: reviewed
  - id: rsc-b4-c01-title
    section_id: rsc-b4-c01
    kind: heading
    origin: source
    source_text: Que la volonté générale est indestructible.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '232'
        source_sequence: 438
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/244
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c01-title-print
    translation_ja: 一般意志は滅ぼせない
    translation_status: reviewed
  - id: rsc-b4-c01-001
    section_id: rsc-b4-c01
    kind: paragraph
    origin: source
    source_text: Tant que plusieurs hommes réunis se considerent comme un seul corps, ils n’ont qu’une seule volonté, qui se rapporte à la commune conservation, & au bien-être général. Alors tous les ressorts de l’Etat sont vigoureux & simples, ses maximes sont claires & lumineuses, il n’a point d’intérêts embrouillés, contradictoires, le bien commun se montre par tout avec évidence, & ne demande que du bon sens pour être apperçu. La paix l’union l’égalité sont ennemies des subtilités politiques. Les hommes droits & simples sont difficiles à tromper à cause de leur simplicité, les leurres les prétextes rafinés ne leur en imposent point ; ils ne sont pas même assez fins pour être dupes. Quand on voit chez le plus heureux peuple du monde des troupes de paysans regler les affaires de l’Etat sous un chêne & se conduire toujours sagement, peut-on s’empêcher de mépriser les rafinemens des autres nations, qui se rendent illustres & misérables avec tant d’art & de misteres ?
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '232'
        source_sequence: 439
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/244
        printed_page_end: '234'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c01-001-print
    translation_ja: いく人もの人間が結ばれ、自分たちを一つの団体と見なすかぎり、彼らの意志は一つであり、みなで生き延びることと、全体の幸福にかかわる。そのとき、国家の仕組みはどれも力強く単純であり、その格言は明らかで、曇りがない。絡みあい矛盾する利害はなく、共通の善はどこでも明らかに姿を現し、これを見抜くのに分別さえあればよい。平和、団結、平等は政治の小細工の敵である。まっすぐで素朴な人々は、その素朴さゆえにだましにくい。おとりや巧みな口実に乗せられず、そもそもだまされるほど小賢しくない。世界で最も幸福な人民のもとで、農民が何人も樫の木の下に集まり、国の事柄を決め、つねに賢明にふるまうのを見れば、あれほど手を尽くし、秘密を重ねて、名声と不幸を得るほかの国々の凝った手口を、軽蔑せずにいられるだろうか。
    translation_status: reviewed
  - id: rsc-b4-c01-002
    section_id: rsc-b4-c01
    kind: paragraph
    origin: source
    source_text: Un État ainsi gouverné a besoin de très peu de Loix, & à mésure qu’il devient nécessaire d’en promulguer de nouvelles, cette nécessité se voit universellement. Le premier qui les propose ne fait que dire ce que tous ont déjà senti, & il n’est question ni de brigues ni d’éloquence pour faire passer en loi ce que chacun a déjà résolu de faire, sitôt qu’il sera sûr que les autres le feront comme lui.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '234'
        source_sequence: 440
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/246
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c01-002-print
    translation_ja: このように治められた国家は、ほんのわずかな法律しか必要としない。新しい法律の公布が必要になるに応じて、その必要は誰の目にもわかる。最初に提案する人は、すでに誰もが感じていたことを口にするだけである。ほかの人たちも同じことをするのが確かなら自分もやると、誰もがすでに決めていたことを法として通すのに、派閥工作も雄弁術も問題にならない。
    translation_status: reviewed
  - id: rsc-b4-c01-003
    section_id: rsc-b4-c01
    kind: paragraph
    origin: source
    source_text: Ce qui trompe les raisonneurs c’est que ne voyant que des États mal constitués dès leur origine, ils sont frappés de l’impossibilité d’y maintenir une semblable police. Ils rient d’imaginer toutes les sotises qu’un fourbe adroit, un parleur insinuant pourroit persuader au peuple de Paris ou de Londres. Ils ne savent pas que Cromwel eut été mis aux sonnêtes par le peuple de Berne, & le Duc de Beaufort à la discipline par les Génevois.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '234'
        source_sequence: 441
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/246
        printed_page_end: '235'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c01-003-print
    translation_ja: 理屈を言う人たちが誤るのは、初めから体制の悪い国しか見ていないので、そこではそんな秩序を保てないことにばかり気を取られるからである。彼らは、抜け目のない悪党や人を丸め込む話し手なら、パリやロンドンの人民にどんな愚かなことでも信じ込ませられる、と想像して笑う。クロムウェルならベルンの人民に鈴をつけられてさらし者にされ、ボーフォール公ならジュネーヴの人々に懲らしめられたはずだとは、知らないのである。
    translation_status: reviewed
  - id: rsc-b4-c01-004
    section_id: rsc-b4-c01
    kind: paragraph
    origin: source
    source_text: Mais quand le nœud social commence à se relâcher & l’Etat à s’affoiblir ; quand les intérêts particuliers commencent à se faire sentir & les petites sociétés à influer sur la grande, l’intérêt commun s’altere & trouve des opposans, l’unanimité ne regne plus dans les voix, la volonté générale n’est plus la volonté de tous, il s’élêve des contradictions des débats, & le meilleur avis ne passe point sans disputes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '235'
        source_sequence: 442
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/247
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c01-004-print
    translation_ja: しかし、社会の結び目がゆるみ、国家が弱りはじめ、個別の利害が感じられるようになり、小さな団体が大きな社会に影響を及ぼしはじめると、共通の利益は変質し、反対する者が出る。投票はもはや全員一致ではなく、一般意志はもはや全員の意志ではない。異論や論争が起き、最善の意見でさえ、争いなしには通らない。
    translation_status: reviewed
  - id: rsc-b4-c01-005
    section_id: rsc-b4-c01
    kind: paragraph
    origin: source
    source_text: Enfin quand l’Etat, près de sa ruine ne subsiste plus que par une forme illusoire & vaine, que le lien social est rompu dans tous les cœurs, que le plus vil intérêt se pare effrontément du nom sacré du bien public ; alors la volonté générale devient muette, tous guidés par des motifs secrets n’opinent pas plus comme Citoyens que si l’Etat n’eut jamais existé, & l’on fait passer faussement sous le nom de Loix des décrets iniques qui n’ont pour but que l’intérêt particulier.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '235'
        source_sequence: 443
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/247
        printed_page_end: '236'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c01-005-print
    translation_ja: ついには、滅びかけた国家が空虚な見せかけだけで存続し、社会の絆がすべての人の心で断たれ、ごく卑しい利害が、公の善という神聖な名で厚かましく身を飾る。そのとき、一般意志は口を閉ざす。誰もがひそかな動機に導かれ、国家など一度も存在しなかったかのように、市民として意見を出さなくなる。個別の利益しか目的としない不正な命令を、偽って法律の名で通すのである。
    translation_status: reviewed
  - id: rsc-b4-c01-006
    section_id: rsc-b4-c01
    kind: paragraph
    origin: source
    source_text: 'S’ensuit-il de-là que la volonté générale soit anéantie ou corrompue ? Non, elle est toujours constante, inaltérable & pure ; mais elle est subordonnée à d’autres qui l’emportent sur elle. Chacun, détachant son intérêt de l’intérêt commun, voit bien qu’il ne peut l’en séparer tout-à-fait, mais sa part du mal public ne lui paroit rien, auprès du bien exclusif qu’il prétend s’approprier. Ce bien particulier excepté, il veut le bien général pour son propre intérêt tout aussi fortement qu’aucun autre. Même en vendant son suffrage à prix d’argent il n’éteint pas en lui la volonté générale, il l’élude. La faute qu’il commet est de changer l’état de la question & de répondre autre chose que ce qu’on lui demande : En sorte qu’au lieu de dire par son suffrage, il est avantageux à l’Etat, il dit, il est avantageux à tel homme ou à tel parti que tel ou tel avis passe. Ainsi la loi de l’ordre public dans les assemblées n’est pas tant d’y maintenir la volonté générale, que de faire qu’elle soit toujours interrogée & qu’elle réponde toujours.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '236'
        source_sequence: 444
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/248
        printed_page_end: '237'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c01-006-print
    translation_ja: だからといって、一般意志は消滅したか、腐敗したのか。いや、つねに変わらず、変えられない、純粋なものだ。ただ、より強いほかの意志の下に置かれている。誰もが、自分の利益を共通の利益から引き離しても、まったく切り離せるわけではないと、よくわかっている。だが、自分だけのものにしようとする利益に比べれば、公の損害のうち自分が引き受ける分は、取るに足らないように見える。この自分だけの利益を除けば、他の誰にも劣らず、自分自身の利益のために全体の善を強く望んでいる。金で票を売るときでさえ、自分の中の一般意志を消すのではなく、それをよけて通るのである。その人の誤りは、問いをすり替え、問われたことと違うことに答えることだ。投票で「国家にとって有利である」と言うかわりに、「この意見が通れば、あの人や、あの党派のためになる」と言う。したがって、集会における公の秩序の決まりは、一般意志を保つことにあるというより、一般意志に必ず尋ね、必ず答えるようにすることにある。
    translation_status: reviewed
  - id: rsc-b4-c01-007
    section_id: rsc-b4-c01
    kind: paragraph
    origin: source
    source_text: J’aurois ici bien des réflexions à faire sur le simple droit de voter dans tout acte de souveraineté ; droit que rien ne peut ôter aux Citoyens ; & sur celui d’opiner, de proposer, de diviser, de discuter, que le Gouvernement a toujours grand soin de ne laisser qu’à ses membres ; mais cette importante matiere demanderoit un traité à part, & je ne puis tout dire dans celui-ci.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '237'
        source_sequence: 445
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/249
        printed_page_end: '238'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c01-007-print
    translation_ja: 主権のあらゆる行為において、ただ票を投じる権利、つまり何ものも市民から奪えない権利について、ここで考えるべきことは多い。また、意見を述べ、提案し、議題を分け、討議する権利についても、考えるべきことは多い。政府はいつも、これらの権利を自分の成員だけに残そうと熱心だからだ。しかしこの重要な題目には別の論考が必要であり、この論考ですべては語れない。
    translation_status: reviewed
  - id: rsc-b4-c02-heading
    section_id: rsc-b4-c02
    kind: heading
    origin: source
    source_text: CHAPITRE II.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '238'
        source_sequence: 446
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/250
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-heading-print
    translation_ja: 第二章
    translation_status: reviewed
  - id: rsc-b4-c02-title
    section_id: rsc-b4-c02
    kind: heading
    origin: source
    source_text: Des Suffrages.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '238'
        source_sequence: 447
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/250
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-title-print
    translation_ja: 投票について
    translation_status: reviewed
  - id: rsc-b4-c02-001
    section_id: rsc-b4-c02
    kind: paragraph
    origin: source
    source_text: On voit par le chapitre précédent que la maniere dont se traittent les affaires générales peut donner un indice assez sûr de l’état actuel des mœurs, & de la santé du corps politique. Plus le concert regne dans les assemblées, c’est-à-dire plus les avis approchent de l’unanimité, plus aussi la volonté générale est dominante ; mais les longs débats, les dissentions, le tumulte, annoncent l’ascendant des intérêts particuliers & le déclin de l’Etat.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '238'
        source_sequence: 448
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/250
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-001-print
    translation_ja: 前章からわかるように、一般にかかわる事柄の扱い方は、その時々の風俗と政治体の健全さを知る、かなり確かな手がかりとなる。集会で調和が大きく、意見が全員一致に近いほど、一般意志が優位にある。だが、長い議論、不和、騒ぎは、個別の利害の勢いと国家の衰えを告げる。
    translation_status: reviewed
  - id: rsc-b4-c02-002
    section_id: rsc-b4-c02
    kind: paragraph
    origin: source
    source_text: 'Ceci paroit moins évident quand deux ou plusieurs ordres entrent dans sa constitution, comme à Rome les Patriciens & les Plébeyens, dont les querelles troublerent souvent les comices, même dans les plus beaux tems de la République ; mais cette exception est plus apparente que réelle ; car alors par le vice inhérent au corps politique on a, pour ainsi dire, deux États en un ; ce qui n’est pas vrai des deux ensemble est vrai de chacun séparément. Et en effet dans les tems mêmes les plus orageux les plébiscites du peuple, quand le Sénat ne s’en mêloit pas, passoient toujours tranquillement & à la grande pluralité des suffrages : Les Citoyens n’ayant qu’un intérêt, le peuple n’avoit qu’une volonté.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '238'
        source_sequence: 449
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/250
        printed_page_end: '239'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-002-print
    translation_ja: 国家の体制に二つ以上の身分があるときには、このことはそれほど明らかに見えない。たとえばローマでは、門閥と平民の争いが、共和国の最も栄えた時代にも、しばしば民会を乱した。だが、この例外は実際にあるというより、そう見えるだけだ。その場合、政治体に固有の欠陥によって、いわば一つのうちに二つの国家ができている。二つを合わせれば当てはまらないことも、一つひとつには当てはまる。実際、最も荒れた時期でさえ、元老院が口を出さなければ、人民の決議はつねに穏やかに、大多数を得て通った。市民の利害が一つしかなく、人民には意志が一つしかなかったからだ。
    translation_status: reviewed
  - id: rsc-b4-c02-003
    section_id: rsc-b4-c02
    kind: paragraph
    origin: source
    source_text: 'A l’autre extrémité du cercle l’unanimité revient. C’est quand les citoyens tombés dans la servitude n’ont plus ni liberté ni volonté. Alors la crainte & la flaterie changent en acclamations les suffrages ; on ne délibere plus, on adore ou l’on maudit. Telle étoit la vile maniere d’opiner du Sénat sous les Empereurs. Quelquefois cela se faisoit avec des précautions ridicules : Tacite observe que sous Othon les Sénateurs accablant Vitellius d’exécrations, affectoient de faire en même tems un bruit épouvantable, afin que, si par hazard il devenoit le maitre, il ne put savoir ce que chacun d’eux avoit dit.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '239'
        source_sequence: 450
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/251
        printed_page_end: '240'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-003-print
    translation_ja: ぐるりと回った反対の端では、全員一致が戻ってくる。市民が隷属に陥り、自由も意志も失ったときである。そのとき、恐怖とへつらいが、投票を歓声に変える。人々はもはや審議せず、崇めるか、ののしるだけである。皇帝のもとで元老院が意見を示す、卑しいやり方がそうだった。ときには、ばかげた用心もともなった。タキトゥスによれば、オトの時代、元老たちはウィテリウスをさんざんののしると同時に、わざと恐ろしいほどの騒音を立てた。万が一ウィテリウスが主人になっても、一人ひとりが何と言ったか、わからないようにするためである。
    translation_status: reviewed
  - id: rsc-b4-c02-004
    section_id: rsc-b4-c02
    kind: paragraph
    origin: source
    source_text: De ces diverses considérations naissent les maximes sur lesquelles on doit regler la maniere de compter les voix & de comparer les avis, selon que la volonté générale est plus ou moins facile à connoitre, & l’Etat plus ou moins déclinant.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '240'
        source_sequence: 451
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/252
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-004-print
    translation_ja: 以上の考察から、票を数え、意見を比較する方法を定める原則が出てくる。一般意志をどれほど容易に知りうるか、国家がどれほど衰えているかによって、その定め方は違う。
    translation_status: reviewed
  - id: rsc-b4-c02-005
    section_id: rsc-b4-c02
    kind: paragraph
    origin: source
    source_text: 'Il n’y a qu’une seule loi qui par sa nature exige un consentement unanime. C’est le pacte social : car l’association civile est l’acte du monde le plus volontaire ; tout homme étant né libre & maitre de lui-même, nul ne peut, sous quelque prétexte que ce puisse être, l’assujettir sans son aveu. Décider que le fils d’une esclave nait esclave, c’est décider qu’il ne nait pas homme.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '240'
        source_sequence: 452
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/252
        printed_page_end: '241'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-005-print
    translation_ja: その本性から全員一致の同意を必要とする法律は、一つしかない。社会盟約である。市民として結びつくのは、世の中で最も自発的な行為だからだ。誰もが自由で、自分自身の主人として生まれた以上、どんな口実があろうと、本人の承認なしに従属させられる者はいない。奴隷の子は生まれながらの奴隷だと決めることは、その子は生まれながらの人間ではないと決めることである。
    translation_status: reviewed
  - id: rsc-b4-c02-006
    section_id: rsc-b4-c02
    kind: paragraph
    origin: source
    source_text: Si donc lors du pacte social il s’y trouve des opposans, leur opposition n’invalide pas le contract, elle empêche seulement qu’ils n’y soient compris ; ce sont des étrangers parmi les Citoyens. Quand l’État est institué le consentement est dans la résidence ; habiter le territoire c’est se soumettre à la souveraineté.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '241'
        source_sequence: 453
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/253
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-006-print
    translation_ja: したがって社会盟約を結ぶときに反対する者がいても、その反対によって契約が無効になるわけではない。ただ、反対する者は契約に含まれない。市民のなかの外国人となる。国家が設立された後では、住み続けることが同意となる。その領土に住むことは、主権に従うことだからだ。
    translation_status: reviewed
  - id: rsc-note-30-text
    section_id: rsc-b4-c02
    kind: note_body
    origin: source
    source_text: Ceci doit toujours s’entendre d’un État libre ; car d’ailleurs la famille, les biens, le défaut d’azile, la nécessité, la violence, peuvent retenir un habitant dans le pays malgré lui, & alors son séjour seul ne suppose plus son consentement au contract ou à la violation du contract.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '241'
        source_sequence: 454
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/253
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-30-text-print
    translation_ja: これはつねに、自由な国家について考えなければならない。それ以外の国では、家族や財産、逃れる場所がないこと、必要に迫られること、暴力などが、住民の意に反してその人をその国に引きとめうる。その場合、そこにいるというだけでは、契約に同意したとも、契約が破られることに同意したともいえない。
    translation_status: reviewed
  - id: rsc-b4-c02-007
    section_id: rsc-b4-c02
    kind: paragraph
    origin: source
    source_text: Hors ce contract primitif, la voix du plus grand nombre oblige toujours tous les autres ; c’est une suite du contract même. Mais on demande comment un homme peut être libre, & forcé de se conformer à des volontés qui ne sont pas les siennes. Comment les opposans sont-ils libres & soumis à des loix auxquelles ils n’ont pas consenti ?
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '241'
        source_sequence: 455
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/253
        printed_page_end: '242'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-007-print
    translation_ja: この最初の契約を除けば、多数の票はつねにほかのすべての人を拘束する。これは契約そのものの結果である。だが、自分の意志でない意志に従うことを強いられて、どうして人は自由でいられるのか、と問われる。反対した人たちは、どうして、同意していない法律に従いながら自由でいられるのか。
    translation_status: reviewed
  - id: rsc-b4-c02-008
    section_id: rsc-b4-c02
    kind: paragraph
    origin: source
    source_text: Je reponds que la question est mal posée. Le Citoyen consent à toutes les loix, même à celles qu’on passe malgré lui, & même à celles qui le punissent quand il ose en violer quelqu’une. La volonté constante de tous les membres de l’Etat est la volonté générale ; c’est par elle qu’ils sont citoyens & libres. Quand on propose une loi dans l’assemblée du Peuple, ce qu’on leur demande n’est pas précisément s’ils approuvent la proposition ou s’ils la rejettent, mais si elle est conforme ou non à la volonté générale qui est la leur ; chacun en donnant son suffrage dit son avis là-dessus, & du calcul des voix se tire la déclaration de la volonté générale. Quand donc l’avis contraire au mien l’emporte, cela ne prouve autre chose sinon que je m’étois trompé, & que ce que j’estimois être la volonté générale ne l’étoit pas. Si mon avis particulier l’eut emporté, j’aurois fait autre chose que ce que j’avois voulu, c’est alors que je n’aurois pas été libre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '242'
        source_sequence: 456
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/254
        printed_page_end: '243'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-008-print
    translation_ja: 問いの立て方が悪い、と私は答える。市民は、自分の意に反して通ったものにも、自分が法を破るときに自分を罰するものにも、すべての法に同意している。国家の全構成員の変わらぬ意志が、一般意志である。その意志によって、彼らは市民であり自由なのだ。人民の集会で法律が提案されるとき、厳密には、その提案を認めるか退けるかと尋ねられるのではない。その提案が、自分たちの一般意志にかなうかどうかと尋ねられる。各人は票を投じることで、その点についての見解を述べ、票の集計から一般意志が明らかになる。だから、私と反対の意見が勝った場合、証明されたのは、私の見当が違い、一般意志だと思ったものが、そうでなかったことだけだ。もし私の個別の意見が勝っていたなら、私は自分が望んだのとは別のことをしていただろう。実はそのときこそ、私は自由でなかったのである。
    translation_status: reviewed
  - id: rsc-note-31-text
    section_id: rsc-b4-c02
    kind: note_body
    origin: source
    source_text: A Genes on lit au devant des prisons & sur les fers des galériens ce mot Libertas. Cette application de la devise est belle & juste. En effet il n’y a que les malfaiteurs de tous états qui empêchent le Citoyen d’être libre. Dans un pays où tous ces gens-là seroient aux Galeres, on jouiroit de la plus parfaite liberté.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '242'
        source_sequence: 457
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/254
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-31-text-print
    translation_ja: ジェノヴァでは、牢獄の正面と、ガレー船の囚人をつなぐ鎖に、「リベルタス（自由）」という語が見える。この標語の使い方は見事で、正しい。実際、どの身分であれ、犯罪をなす者だけが、市民の自由を妨げる。彼らがみなガレー船にいる国なら、このうえなく完全な自由を享受するだろう。
    translation_status: reviewed
  - id: rsc-b4-c02-009
    section_id: rsc-b4-c02
    kind: paragraph
    origin: source
    source_text: 'Ceci suppose, il est vrai, que tous les caracteres de la volonté générale sont encore dans la pluralité : quand ils cessent d’y être, quelque parti qu’on prenne il n’y a plus de liberté.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '243'
        source_sequence: 458
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/255
        printed_page_end: '244'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-009-print
    translation_ja: もっとも、これは、一般意志が持つ特徴がすべて、まだ多数のうちに見られることを前提とする。多数にそうした性質がなくなれば、どの側を選んでも、自由はもはやない。
    translation_status: reviewed
  - id: rsc-b4-c02-010
    section_id: rsc-b4-c02
    kind: paragraph
    origin: source
    source_text: En montrant ci-devant comment on substituoit des volontés particulieres à la volonté générale dans les délibérations publiques, j’ai suffisamment indiqué les moyens praticables de prévenir cet abus ; j’en parlerai encore ci-après. A l’égard du nombre proportionnel des suffrages pour déclarer cette volonté, j’ai aussi donné les principes sur lesquels on peut le déterminer. La différence d’une seule voix rompt l’égalité, un seul opposant rompt l’unanimité ; mais entre l’unanimité & l’égalité il y a plusieurs partages inégaux, à chacun desquels on peut fixer ce nombre selon l’état & les besoins du corps politique.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '244'
        source_sequence: 459
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/256
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-010-print
    translation_ja: 公の審議で個別の意志が一般意志に取って代わる仕方を先に示したとき、私はこの濫用を防ぐために、現実に使える手立てを十分に示した。後でもまた述べよう。一般意志を宣言するためにどのくらいの割合の票を必要とするかについても、すでにその割合を定める原則を挙げた。たった一票の差が同数を破り、たった一人の反対が全員一致を破る。だが全員一致と同数のあいだには、不均等な分かれ方がいくつもある。政治体の状態や必要に応じて、そのどこかに、必要な票の数を定めることができる。
    translation_status: reviewed
  - id: rsc-b4-c02-011
    section_id: rsc-b4-c02
    kind: paragraph
    origin: source
    source_text: 'Deux maximes générales peuvent servir à regler ces rapports : l’une, que plus les délibérations sont importantes & graves, plus l’avis qui l’emporte doit approcher de l’unanimité : l’autre, que plus l’affaire agitée exige de célérité, plus on doit resserrer la différence prescritte dans le partage des avis ; dans les délibérations qu’il faut terminer sur le champ l’excédant d’une seule voix doit suffire. La premiere de ces maximes paroit plus convenable aux loix, & la seconde aux affaires. Quoiqu’il en soit, c’est sur leur combinaison que s’établissent les meilleurs rapports qu’on peut donner à la pluralité pour prononcer.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '244'
        source_sequence: 460
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/256
        printed_page_end: '246'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c02-011-print
    translation_ja: この割合を決めるには、二つの一般的な格言が役立つ。一つは、審議が重要で重大であるほど、勝つ意見は全会一致に近くなければならないということ。もう一つは、議題の処理を急ぐほど、票を分けるときに必要とされる差を小さくするべきだということだ。即座に決着させなければならない審議なら、一票多いだけで十分でなければならない。第一の格言は法律に、第二は個別の仕事に、より適するように見える。いずれにせよ、多数決で結論を出すために定めうる最善の票の割合は、この二つを組み合わせて決められる。
    translation_status: reviewed
  - id: rsc-b4-c03-heading
    section_id: rsc-b4-c03
    kind: heading
    origin: source
    source_text: CHAPITRE III.
    source_languages:
      - fr

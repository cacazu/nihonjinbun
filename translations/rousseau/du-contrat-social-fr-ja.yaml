        precision: page
        printed_page: '69'
        source_sequence: 133
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/81
    source_alignment:
      - source_id: rey-amsterdam-1762

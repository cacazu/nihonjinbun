        printed_page: '246'
        source_sequence: 461
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/258
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-heading-print
    translation_ja: 第三章
    translation_status: reviewed
  - id: rsc-b4-c03-title
    section_id: rsc-b4-c03
    kind: heading
    origin: source
    source_text: Des Elections.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '246'
        source_sequence: 462
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/258
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-title-print
    translation_ja: 選出について
    translation_status: reviewed
  - id: rsc-b4-c03-001
    section_id: rsc-b4-c03
    kind: paragraph
    origin: source
    source_text: A l’egard des élections du Prince & des Magistrats, qui sont, comme je l’ai dit, des actes complexes, il y a deux voyes pour y proceder ; savoir, le choix & le sort. L’une & l’autre ont été employées en diverses Republiques, & l’on voit encore actuellement un melange très compliqué des deux dans l’election du Doge de Venise.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '246'
        source_sequence: 463
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/258
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-001-print
    translation_ja: 統治者や行政官の選出は、先に述べたように、複合的な行為である。これを行う方法には、人が選ぶ方法と、くじによる方法とがある。どちらもさまざまな共和国で用いられてきた。現在でも、ヴェネツィアの元首を選ぶのに、両方がたいへん複雑な形で組み合わされているのを見ることができる。
    translation_status: reviewed
  - id: rsc-b4-c03-002
    section_id: rsc-b4-c03
    kind: paragraph
    origin: source
    source_text: Le suffrage par le sort, dit Montesquieu, est de la nature de la Démocratie. J’en conviens, mais comment cela ? Le sort, continue-t-il, est une façon d’élire qui n’afflige personne ; il laisse à chaque Citoyen une espérance raisonnable de servir la patrie. Ce ne sont pas-là des raisons.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '246'
        source_sequence: 464
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/258
        printed_page_end: '247'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-002-print
    translation_ja: くじによる選出は、民主政の本性にかなう、とモンテスキューは言う。私もそう思う。だが、なぜそうなのか。くじは誰をも苦しめない選出方法で、祖国に仕えられるだけの妥当な期待を、すべての市民に残す、と彼は続ける。だが、それは理由ではない。
    translation_status: reviewed
  - id: rsc-b4-c03-003
    section_id: rsc-b4-c03
    kind: paragraph
    origin: source
    source_text: Si l’on fait attention que l’élection des chefs est une fonction du Gouvernement & non de la Souveraineté, on verra pourquoi la voye du sort est plus dans la nature de la Démocratie, où l’administration est d’autant meilleure que les actes en sont moins multipliés.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '247'
        source_sequence: 465
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/259
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-003-print
    translation_ja: 長を選ぶことは、政府の働きであって、主権の働きではない。これに注意すれば、なぜくじの方法のほうが、民主政の本性によくかなうかがわかる。民主政では、行政の行為が少なければ少ないほど、行政はよく行われるからだ。
    translation_status: reviewed
  - id: rsc-b4-c03-004
    section_id: rsc-b4-c03
    kind: paragraph
    origin: source
    source_text: Dans toute véritable Démocratie la magistrature n’est pas un avantage mais une charge onéreuse, qu’on ne peut justement imposer à un particulier plutôt qu’à un autre. La loi seule peut imposer cette charge à celui sur qui le sort tombera. Car alors la condition étant égale pour tous, & le choix ne dépendant d’aucune volonté humaine, il n’y a point d’application particuliere qui altere l’universalité de la loi.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '247'
        source_sequence: 466
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/259
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-004-print
    translation_ja: 真の民主政ではどこでも、行政官の職は利益でなく、重荷である。ある個人だけを他の人よりも先に選んで、その重荷を負わせる正当な理由はない。くじに当たった者にこの職を負わせられるのは、法律だけである。その場合、条件はすべての人に等しく、選択は人間のどの意志にもよらないので、法律の普遍性を損なう個別の適用はない。
    translation_status: reviewed
  - id: rsc-b4-c03-005
    section_id: rsc-b4-c03
    kind: paragraph
    origin: source
    source_text: Dans l’Aristocratie le Prince choisit le Prince, le Gouvernement se conserve par lui-même, & c’est là que les suffrages sont bien placés.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '247'
        source_sequence: 467
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/259
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-005-print
    translation_ja: 貴族政では、統治者が次の統治者を選び、政府は自らを維持する。ここでは投票にふさわしい出番がある。
    translation_status: reviewed
  - id: rsc-b4-c03-006
    section_id: rsc-b4-c03
    kind: paragraph
    origin: source
    source_text: 'L’exemple de l’élection du Doge de Venise confirme cette distinction loin de la détruire : Cette forme mêlée convient dans un Gouvernement mixte. Car c’est une erreur de prendre le Gouvernement de Venise pour une véritable Aristocratie. Si le Peuple n’y a nulle part au Gouvernement, la noblesse y est peuple elle-même. Une multitude de pauvres Barnabotes n’approcha jamais d’aucune magistrature, & n’a de sa noblesse que le vain titre d’Excellence & le droit d’assister au grand Conseil. Ce grand Conseil étant aussi nombreux que notre Conseil général à Genève, ses illustres membres n’ont pas plus de privileges que nos simples Citoyens. Il est certain qu’ôtant l’extrême disparité des deux Républiques, la bourgeoisie de Genève représente exactement le Patriciat Vénitien, nos natifs & habitans représentent les Citadins & le peuple de Venise, nos paysans représentent les sujets de terre-ferme : enfin de quelque maniere que l’on considère cette République, abstraction faite de sa grandeur, son Gouvernement n’est pas plus aristocratique que le notre. Toute la différence est que n’ayant aucun chef à vie, nous n’avons pas le même besoin du sort.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '247'
        source_sequence: 468
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/259
        printed_page_end: '249'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-006-print
    translation_ja: ヴェネツィアの元首を選ぶ例は、この区別を壊すどころか、裏づける。混合政府には、この混合した方法がふさわしいからだ。ヴェネツィアの政府を真の貴族政と見なすのは誤りだ。人民が政府にまったく関わらなくても、そこでは貴族自身が人民なのである。多くの貧しいバルナボッティは、行政官の職に近づいたこともなく、貴族として持つのは「閣下」というむなしい称号と、大評議会に出席する権利だけである。その大評議会には、われわれのジュネーヴの総会と同じほど人が多いので、その名だたる構成員の特権は、われわれの普通の市民が持つ以上ではない。二つの共和国の大きな違いを除けば、ジュネーヴのブルジョワ身分はヴェネツィアの門閥に、われわれの土着民と居住者はヴェネツィアの町人と人民に、われわれの農民はヴェネツィアの本土の臣民に、それぞれ確かに当たる。この共和国をどう考えようと、その大きさを除けば、その政府はわれわれの政府より貴族政的ではない。唯一の違いは、われわれには終身の長が一人もいないので、同じようにはくじを必要としないことだ。
    translation_status: reviewed
  - id: rsc-b4-c03-007
    section_id: rsc-b4-c03
    kind: paragraph
    origin: source
    source_text: Les élections par le sort auroient peu d’inconvénient dans une véritable Démocratie où tout étant égal, aussi bien par les mœurs & par les talens que par les maximes & par la fortune, le choix deviendroit presque indifférent. Mais j’ai déjà dit qu’il n’y avoit point de véritable Démocratie.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '249'
        source_sequence: 469
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/261
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-007-print
    translation_ja: 風俗、才能、格言、財産の点で、すべてが等しく、誰を選んでもほとんど違いがない真の民主政では、くじによる選出にはほとんど不都合がないだろう。だが、真の民主政は存在しないと、すでに述べた。
    translation_status: reviewed
  - id: rsc-b4-c03-008
    section_id: rsc-b4-c03
    kind: paragraph
    origin: source
    source_text: Quand le choix & le sort se trouvent mêlés, le premier doit remplir les places qui demandent des talens propres, telles que les emplois militaires ; l’autre convient à celles où suffisent le bon-sens, la justice, l’intégrité, telles que les charges de judicature ; parce que dans un état bien constitué ces qualités sont communes à tous les Citoyens.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '249'
        source_sequence: 470
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/261
        printed_page_end: '250'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-008-print
    translation_ja: 人が選ぶ方法とくじとが混ざるときには、軍の職など、特別な才能を要する地位は、人が選んで埋めるべきである。裁判官の職のように、分別、正義、誠実さだけで十分な地位には、くじがふさわしい。よい体制の国では、このようなものはすべての市民に共通して備わっているからだ。
    translation_status: reviewed
  - id: rsc-b4-c03-009
    section_id: rsc-b4-c03
    kind: paragraph
    origin: source
    source_text: Le sort ni les suffrages n’ont aucun lieu dans le Gouvernement monarchique. Le Monarque étant de droit seul Prince & Magistrat unique, le choix de ses lieutenans n’appartient qu’à lui. Quand l’Abbé de St. Pierre proposoit de multiplier les Conseils du Roi de France & d’en élire les membres par Scrutin, il ne voyoit pas qu’il proposoit de changer la forme du Gouvernement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '250'
        source_sequence: 471
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/262
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-009-print
    translation_ja: 君主政では、くじにも投票にも、出番がまったくない。君主が権利のうえでただ一人の統治者、唯一の行政官なのであるから、代理を選ぶのは君主一人の権限である。サン＝ピエール師がフランス王の評議会を増やし、委員を投票で選ぶことを提案したとき、政府の形を変える提案をしているのだとは、わかっていなかった。
    translation_status: reviewed
  - id: rsc-b4-c03-010
    section_id: rsc-b4-c03
    kind: paragraph
    origin: source
    source_text: Il me resteroit à parler de la maniere de donner & de recueillir les voix dans l’assemblée du peuple ; mais peut-être l’historique de la police Romaine à cet égard expliquera-t-il plus sensiblement toutes les maximes que je pourrois établir. Il n’est pas indigne d’un lecteur judicieux de voir un peu en détail comment se traittoient les affaires publiques & particulieres dans un Conseil de deux-cent mille hommes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '250'
        source_sequence: 472
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/262
        printed_page_end: '251'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c03-010-print
    translation_ja: あとは、人民の集会で、どのように票を投じ、集めるかについて話さなければならない。だが、私が立てうるどんな格言も、この点に関するローマの制度の歴史のほうが、もっと実感をもって説明してくれるかもしれない。二十万人の会議で、公の事柄や個別の事柄がどのように扱われたか、少し詳しく見ることは、判断力のある読者にふさわしくないことではなかろう。
    translation_status: reviewed
  - id: rsc-b4-c04-heading
    section_id: rsc-b4-c04
    kind: heading
    origin: source
    source_text: CHAPITRE IV.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '251'
        source_sequence: 473
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/263
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-heading-print
    translation_ja: 第四章
    translation_status: reviewed
  - id: rsc-b4-c04-title
    section_id: rsc-b4-c04
    kind: heading
    origin: source
    source_text: Des Comices romains.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '251'
        source_sequence: 474
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/263
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-title-print
    translation_ja: ローマの民会について
    translation_status: reviewed
  - id: rsc-b4-c04-001
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Nous n’avons nuls monumens bien assurés des premiers tems de Rome ; il y a même grande apparence que la plupart des choses qu’on en débite sont des fables ; & en général la partie la plus instructive des annales des peuples, qui est l’histoire de leur établissement, est celle qui nous manque le plus. L’expérience nous apprend tous les jours de quelles causes naissent les révolutions des empires ; mais comme il ne se forme plus de peuples, nous n’avons gueres que des conjectures pour expliquer comment ils se sont formés.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '251'
        source_sequence: 475
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/263
        printed_page_end: '252'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-001-print
    translation_ja: ローマの初期の時代について、確かな史料は何もない。その時代について語られる事柄の大半は、作り話らしい。一般に、諸国の記録のなかで最も学ぶことが多いのは、国々がつくられた経緯なのだが、まさにそれが最も手に入らない。帝国の大変動を何が引き起こすかは、日々の経験が教えてくれる。だが、もはや新たに人民が形づくられることはないので、人民がどうやって形づくられたのかを説明するには、推測に頼るほかほとんどない。
    translation_status: reviewed
  - id: rsc-note-32-text
    section_id: rsc-b4-c04
    kind: note_body
    origin: source
    source_text: Le nom de Rome qu’on prétend venir de Romulus est Grec, & signifie force ; le nom de Numa est grec aussi, & signifie Loi. Quelle apparence que les deux premiers Rois de cette ville aient porté d’avance des noms si bien rélatifs à ce qu’ils ont fait ?
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '251'
        source_sequence: 476
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/263
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-32-text-print
    translation_ja: ロムルスに由来するとされるローマの名は、ギリシア語で「力」を意味し、ヌマの名もギリシア語で「法」を意味する。この都市の最初の二人の王が、自分たちのしたことにこれほどぴったりの名を、あらかじめ持っていたなどということが、どれほどありそうだろうか。
    translation_status: reviewed
  - id: rsc-b4-c04-002
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Les usages qu’on trouve établis attestent au moins qu’il y eut une origine à ces usages. Des traditions qui remontent à ces origines, celles qu’appuyent les plus grandes autorités & que de plus fortes raisons confirment doivent passer pour les plus certaines. Voilà les maximes que j’ai tâché de suivre en recherchant comment le plus libre & le plus puissant peuple de la terre exerceoit son pouvoir suprême.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '252'
        source_sequence: 477
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/264
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-002-print
    translation_ja: 確立された慣習を見つけたとすれば、その慣習がどこかから始まったことは、少なくともわかる。その始まりにまでさかのぼる伝承のうち、最も権威ある史料に支えられ、最も確かな理由によって裏づけられるものを、最も確かと見なすべきである。地上で最も自由で強力な人民が、どのように最高の権力を行使したかを調べるにあたり、従うよう努めた格言はこれである。
    translation_status: reviewed
  - id: rsc-b4-c04-003
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: Après la fondation de Rome la République naissante, c’est-à-dire, l’armée du fondateur, composée d’Albains, de Sabins, & d’étrangers, fut divisée en trois classes, qui de cette division prirent le nom de Tribus. Chacune de ces Tribus fut subdivisée en dix Curies, & chaque Curie en Décuries, à la tête desquelles on mit des chefs appellés Curions & Décurions.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '252'
        source_sequence: 478
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/264
        printed_page_end: '253'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-003-print
    translation_ja: ローマの建設後、生まれたばかりの共和国、すなわちアルバ人、サビニ人、外国人からなる建設者の軍隊は、三つの組に分けられ、この区分からトリブスと呼ばれた。各トリブスは、さらに十のクリアに分けられ、各クリアはデクリアに分けられ、そのそれぞれの先頭には、クリオやデクリオと呼ばれる長が置かれた。
    translation_status: reviewed
  - id: rsc-b4-c04-004
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: 'Outre cela on tira de chaque Tribu un corps de cent Cavaliers ou Chevaliers, appellé Centurie : par où l’on voit que ces divisions, peu nécessaires dans un bourg, n’étoient d’abord que militaires. Mais il semble qu’un instinct de grandeur portoit la petite ville de Rome à se donner d’avance une police convenable à la capitale du monde.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '253'
        source_sequence: 479
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/265
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-004-print
    translation_ja: それだけでなく、各トリブスから百人の騎兵、すなわち騎士を取り出して、ケントゥリアと呼ぶ一隊をつくった。小さな町でほとんど必要のないこれらの区分は、はじめは軍事のためにすぎなかったことが、ここからわかる。しかし、小さな町ローマは、偉大になろうとする本能に押され、世界の首都にふさわしい制度を、前もって持とうとしたように見える。
    translation_status: reviewed
  - id: rsc-b4-c04-005
    section_id: rsc-b4-c04
    kind: paragraph
    origin: source
    source_text: De ce premier partage resulta bientôt un inconvénient. C’est que la Tribu des Albains & celle des Sabins restant toujours au même état, tandis que celle des étrangers croissoit sans cesse par le concours perpétuel de ceux-ci, cette derniere ne tarda pas à surpasser les deux autres. Le remede que Servius trouva à ce dangereux abus fut de changer la division, & à celle des races, qu’il abolit, d’en substituer une autre tirée des lieux de la ville occupés par chaque Tribu. Au lieu de trois Tribus il en fit quatre ; chacune desquelles occupoit une des collines de Rome & en portoit le nom. Ainsi remédiant à l’inégalité présente il la prévint encore pour l’avenir ; & afin que cette division ne fût pas seulement de lieux mais d’hommes, il défendit aux habitans d’un quartier de passer dans un autre, ce qui empêcha les races de se confondre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '253'
        source_sequence: 480
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/265
        printed_page_end: '254'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c04-005-print
    translation_ja: この最初の区分から、じきに不都合が生まれた。アルバ人とサビニ人のトリブスがもとのままだったのに、外国人のトリブスは、新来者が絶えず加わることで増え続け、まもなくほかの二つをしのいだ。セルウィウスがこの危険な不都合を正すために見いだした方法は、区分を改めることだった。出自による区分を廃止し、トリブスごとに占める市内の場所による区分に替えた。トリブスは三つでなく四つとし、それぞれローマの丘の一つを占め、その丘の名で呼ばれた。こうして当面の不平等を正し、将来の不平等も未然に防いだ。そしてこの区分を場所だけでなく人にも適用するために、ある地区の住人が別の地区に移るのを禁じた。それによって出自の異なる組が混ざるのを防いだのである。
    translation_status: reviewed
  - id: rsc-note-33-text
    section_id: rsc-b4-c04
    kind: note_body
    origin: source
    source_text: (a) Ramnenses.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762

  - id: rsc-b2-c01-title
    section_id: rsc-b2-c01
    kind: heading
    origin: source
    source_text: Que la souveraineté est inaliénable
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '47'
        source_sequence: 98
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/59
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c01-title-print
    translation_ja: 主権は譲り渡せない
    translation_status: reviewed
  - id: rsc-b2-c01-001
    section_id: rsc-b2-c01
    kind: paragraph
    origin: source
    source_text: 'La premiere & la plus importante conséquence des principes ci-devant établis est que la volonté générale peut seule diriger les forces de l’Etat selon la fin de son institution, qui est le bien commun : car si l’opposition des intérêts particuliers a rendu nécessaire l’établissement des sociétés, c’est l’accord de ces mêmes intérêts qui l’a rendu possible. C’est ce qu’il y a de commun dans ces différens intérêts qui forme le lien social, & s’il n’y avoit pas quelque point dans lequel tous les intérêts s’accordent, nulle société ne sauroit exister. Or c’est uniquement sur cet intérêt commun que la société doit être gouvernée.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '47'
        source_sequence: 99
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/59
        printed_page_end: '48'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c01-001-print
    translation_ja: これまでに立てた原則からまず導かれる最も大切な帰結は、一般意志だけが、国家の力を、その設立の目的、すなわち共通の善に向けられるということだ。個々の利害の対立が社会をつくる必要を生んだとするなら、その同じ利害が一致するところがあったからこそ、社会をつくることができた。さまざまな利害に共通するものが、社会の絆を成り立たせる。すべての利害が一致する点が何一つなければ、どんな社会も成り立ちえない。ところで、社会は、この共通の利益だけに基づいて治められなければならない。
    translation_status: reviewed
  - id: rsc-b2-c01-002
    section_id: rsc-b2-c01
    kind: paragraph
    origin: source
    source_text: Je dis donc que la souveraineté n’étant que l’exercice de la volonté générale ne peut jamais s’aliéner, & que le souverain, qui n’est qu’un être collectif, ne peut être représenté que par lui-même ; le pouvoir peut bien se transmettre, mais non pas la volonté.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '48'
        source_sequence: 100
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/60
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c01-002-print
    translation_ja: したがって私はこう言う。主権とは一般意志の行使にほかならないから、決して譲り渡すことはできない。主権者は集合的な存在にほかならず、自分自身のほかにそれを代表できる者はいない。権力は引き渡せても、意志は引き渡せない。
    translation_status: reviewed
  - id: rsc-b2-c01-003
    section_id: rsc-b2-c01
    kind: paragraph
    origin: source
    source_text: En effet, s’il n’est pas impossible qu’une volonté particuliere s’accorde sur quelque point avec la volonté générale ; il est impossible au moins que cet accord soit durable & constant ; car la volonté particuliere tend par sa nature aux préférences, & la volonté générale à l’égalité. Il est plus impossible encore qu’on ait un garant de cet accord quand même il devroit toujours exister ; ce ne seroit pas un effet de l’art mais du hazard. Le Souverain peut bien dire, je veux actuellement ce que veut un tel homme ou du moins ce qu’il dit vouloir ; mais il ne peut pas dire ; ce que cet homme voudra demain, je le voudrai encore ; puisqu’il est absurde que la volonté se donne des chaines pour l’avenir, & puisqu’il ne dépend d’aucune volonté de consentir à rien de contraire au bien de l’être qui veut. Si donc le peuple promet simplement d’obéir, il se dissout par cet acte, il perd sa qualité de peuple ; à l’instant qu’il y a un maitre il n’y a plus de Souverain, & dès lors le corps politique est détruit.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '48'
        source_sequence: 101
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/60
        printed_page_end: '50'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c01-003-print
    translation_ja: たしかに、個人の意志がある点で一般意志と一致することは、ありえなくはない。しかしその一致が長もちし、変わらずにいることは少なくとも不可能だ。個人の意志はその本性からえこひいきに傾くが、一般意志は平等に向かうからである。たとえ一致がずっと続くとしても、それを保証する手立てがあるというのは、もっとありえない。それは工夫の成果ではなく、偶然の結果なのだ。主権者は、「私が今望むのは、あの人が望んでいること、少なくとも、あの人が望むと言っていることだ」と言うことはできる。しかし「あの人が明日望むことを、私も望むだろう」とは言えない。意志が未来のために自分に鎖をかけるのは、ばかげているし、意志を持つ者自身の善に反することに同意することは、どんな意志の力にも及ばないからだ。したがって、人民がただ従うことだけを約束するなら、その行為によって解体し、人民である資格を失う。主人ができた瞬間に主権者はなくなり、その時点で政治体は壊れるのである。
    translation_status: reviewed
  - id: rsc-b2-c01-004
    section_id: rsc-b2-c01
    kind: paragraph
    origin: source
    source_text: Ce n’est point à dire que les ordres des chefs ne puissent passer pour des volontés générales, tant que le Souverain libre de s’y opposer ne le fait pas. En pareil cas, du silence universel on doit présumer le consentement du peuple. Ceci s’expliquera plus au long.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '50'
        source_sequence: 102
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/62
        printed_page_end: '51'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c01-004-print
    translation_ja: といっても、主権者が長たちの命令に反対する自由を持ちながら反対しないかぎり、その命令を一般意志と見なしてもよい。そういうときは、誰も口を開かないことから、人民の同意を推し量るべきである。この点は後で詳しく説明する。
    translation_status: reviewed
  - id: rsc-b2-c02-heading
    section_id: rsc-b2-c02
    kind: heading
    origin: source
    source_text: CHAPITRE II.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '51'
        source_sequence: 103
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/63
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c02-heading-print
    translation_ja: 第二章
    translation_status: reviewed
  - id: rsc-b2-c02-title
    section_id: rsc-b2-c02
    kind: heading
    origin: source
    source_text: Que la souveraineté est indivisible.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '51'
        source_sequence: 104
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/63
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c02-title-print
    translation_ja: 主権は分けられない
    translation_status: reviewed
  - id: rsc-b2-c02-001
    section_id: rsc-b2-c02
    kind: paragraph
    origin: source
    source_text: 'Par la même raison que la souveraineté est inaliénable, elle est indivisible. Car la volonté est générale, ou elle ne l’est pas ; elle est celle du corps du peuple, ou seulement d’une partie. Dans le premier cas cette volonté déclarée est un acte de souveraineté & fait loi : Dans le second, ce n’est qu’une volonté particuliere, ou un acte de magistrature ; c’est un décret tout au plus.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '51'
        source_sequence: 105
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/63
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c02-001-print
    translation_ja: 主権は譲り渡せないのと同じ理由で、分けることもできない。意志は一般的であるか、そうでないかであって、人民全体の意志であるか、一部だけの意志であるかのどちらかだ。前者では、この意志が表明されれば、それは主権の行為であり、法となる。後者では、個別の意志、あるいは行政官の行為にすぎず、せいぜい命令である。
    translation_status: reviewed
  - id: rsc-note-05-text
    section_id: rsc-b2-c02
    kind: note_body
    origin: source
    source_text: Pour qu’une volonté soit générale il n’est pas toujours nécessaire qu’elle soit unanime, mais il est nécessaire que toutes les voix soient comptées ; toute exclusion formelle rompt la généralité.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '51'
        source_sequence: 106
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/63
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-05-text-print
    translation_ja: 意志が一般的であるために、つねに全員一致が必要なわけではない。しかし、すべての票が数えられることは必要である。誰かを明示的に除外すれば、一般性は失われる。
    translation_status: reviewed
  - id: rsc-b2-c02-002
    section_id: rsc-b2-c02
    kind: paragraph
    origin: source
    source_text: 'Mais nos politiques ne pouvant diviser la souveraineté dans son principe, la divisent dans son objet ; ils la divisent en force & en volonté, en puissance législative & en puissance exécutive, en droits d’impôts, de justice, & de guerre, en administration intérieure & en pouvoir de traitter avec l’étranger : tantôt ils confondent toutes ces parties & tantôt ils les séparent ; ils font du Souverain un être fantastique & formé de pieces rapportées ; c’est comme s’ils composoient l’homme de plusieurs corps dont l’un auroit des yeux, l’autre des bras, l’autre des pieds, & rien de plus. Les charlatans du Japon depécent, dit-on, un enfant aux yeux des spectateurs, puis jettant en l’air tous ses membres l’un après l’autre, ils font retomber l’enfant vivant & tout rassemblé. Tels sont à peu près les tours de gobelets de nos politiques ; après avoir démembré le corps social par un prestige digne de la foire, ils rassemblent les pieces on ne sait comment.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '51'
        source_sequence: 107
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/63
        printed_page_end: '53'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c02-002-print
    translation_ja: ところが、われわれの政治論者は主権を原理において分けられないので、その対象を分けてしまう。力と意志、立法権と行政権、課税・裁判・戦争の権利、内政の管理と外国と条約を結ぶ権限に分ける。そうして、あるときはこれらを混同し、あるときは切り離す。主権者を、寄せ集めの部品でできた架空の存在にしてしまうのだ。それは、目しかない体と腕しかない体、足しかない体とをつなぎ合わせて一人の人間をつくるようなものだ。日本の手品師は観客の目の前で子どもをばらばらにし、その手足を次々と空に投げると、子どもが元どおりの姿で生きて落ちてくるという。われわれの政治論者の手品も似たようなものだ。縁日の見せ物さながらに社会の体をばらばらにしておいて、どんな手を使ったものか、また一つに組み直す。
    translation_status: reviewed
  - id: rsc-b2-c02-003
    section_id: rsc-b2-c02
    kind: paragraph
    origin: source
    source_text: Cette erreur vient de ne s’être pas fait des notions exactes de l’autorité souveraine, & d’avoir pris pour des parties de cette autorité ce qui n’en étoit que des émanations. Ainsi, par exemple, on a regardé l’acte de déclarer la guerre & celui de faire la paix comme des actes de souveraineté, ce qui n’est pas ; puisque chacun de ces actes n’est point une loi mais seulement une application de la loi, un acte particulier qui détermine le cas de la loi, comme on le verra clairement quand l’idée attachée au mot loi sera fixée.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '53'
        source_sequence: 108
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/65
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c02-003-print
    translation_ja: この誤りが生じるのは、主権の権威について正確な考えを持たず、その権威の現れにすぎないものを、権威そのものの部分だと取り違えるからである。たとえば、戦争を宣言する行為や和平を結ぶ行為が、主権の行為だとされてきたが、そうではない。どちらの行為も法律ではなく、法律を適用しただけで、法律の適用される事例を定める個別の行為なのだ。「法律」という語の意味が明らかになれば、このこともはっきりする。
    translation_status: reviewed
  - id: rsc-b2-c02-004
    section_id: rsc-b2-c02
    kind: paragraph
    origin: source
    source_text: En suivant de même les autres divisions on trouveroit que toutes les fois qu’on croit voir la souveraineté partagée on se trompe, que les droits qu’on prend pour des parties de cette souveraineté lui sont tous subordonnés, & supposent toujours des volontés suprêmes dont ces droits ne donnent que l’exécution.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '53'
        source_sequence: 109
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/65
        printed_page_end: '54'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c02-004-print
    translation_ja: 同じようにほかの分割についても調べてみれば、主権が分かれて見えるときは、いつでも見間違いだとわかるだろう。主権の一部とされる諸権利はことごとく主権の下にあり、つねに至上の意志を前提とし、その意志を実行に移すだけなのである。
    translation_status: reviewed
  - id: rsc-b2-c02-005
    section_id: rsc-b2-c02
    kind: paragraph
    origin: source
    source_text: On ne sauroit dire combien ce défaut d’exactitude a jetté d’obscurité sur les décisions des auteurs en matiere de droit politique, quand ils ont voulu juger des droits respectifs des rois & des peuples, sur les principes qu’ils avoient établis. Chacun peut voir dans les chapitres III & IV du premier livre de Grotius comment ce savant homme & son traducteur Barbeyrac s’enchevêtrent s’embarrassent dans leurs sophismes, crainte d’en dire trop ou de n’en dire pas assez selon leurs vues, & de choquer les intérêts qu’ils avoient à concilier. Grotius, refugié en France, mécontent de sa patrie, & voulant faire sa cour à Louis XIII à qui son livre est dédié, n’épargne rien pour dépouiller les peuples de tous leurs droits & pour en revétir les rois avec tout l’art possible. C’eut bien été aussi le goût de Barbeyrac, qui dédioit sa traduction au Roi d’Angleterre Georges I. Mais malheureusement l’expulsion de Jacques II qu’il appelle abdication, le forçoit à se tenir sur la reserve, à gauchir à tergiverser pour ne pas faire de Guillaume un usurpateur. Si ces deux écrivains avoient adopté les vrais principes, toutes les difficultés étoient levées, & ils eussent été toujours conséquents ; mais ils auroient tristement dit la vérité & n’auroient fait leur cour qu’au peuple. Or la vérité ne mene point à la fortune, & le peuple ne donne ni ambassades, ni chaires, ni pensions.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '54'
        source_sequence: 110
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/66
        printed_page_end: '56'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c02-005-print
    translation_ja: この不正確さのため、政治的な権利を論じる著述家が、自分たちの立てた原理で王と人民それぞれの権利を判定しようとして、どれほど議論をわかりにくくしたことか。グロティウスの著作の第一巻第三章と第四章を見れば、この学識ある人とその翻訳者バルベイラックが、自分の思惑に照らして言いすぎはしないか、言い足りなくはないか、また両立させる必要のある利害を損ねはしないかと恐れて、いかに詭弁のなかでもつれ、立ち往生しているかが、誰にでもわかる。フランスに亡命したグロティウスは、自国に不満を抱き、本を献呈したルイ十三世の歓心を買おうとした。そこで、人民から一切の権利をはぎ取り、ありとあらゆる技巧を使って王にまとわせようと、手を尽くした。イギリス王ジョージ一世に訳書を捧げたバルベイラックも、同じことを好んだはずだ。しかし不運なことに、彼が退位と呼ぶジェームズ二世の追放のために、ウィリアムを王位簒奪者に仕立てないよう、用心し、話をそらし、言を左右しなければならなかった。この二人が真の原理を採用していたなら、難点はすべて消え、終始一貫していただろう。だがあいにく、そうすれば真実を語ることになり、歓心を買えるのは人民だけだったはずだ。真実は出世につながらず、人民は大使の職も、大学の椅子も、年金もくれない。
    translation_status: reviewed
  - id: rsc-b2-c03-heading
    section_id: rsc-b2-c03
    kind: heading
    origin: source
    source_text: CHAPITRE III.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '56'
        source_sequence: 111
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/68
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c03-heading-print
    translation_ja: 第三章
    translation_status: reviewed
  - id: rsc-b2-c03-title
    section_id: rsc-b2-c03
    kind: heading
    origin: source
    source_text: Si la volonté générale peut errer.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '56'
        source_sequence: 112
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/68
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c03-title-print
    translation_ja: 一般意志は誤りうるか
    translation_status: reviewed
  - id: rsc-b2-c03-001
    section_id: rsc-b2-c03
    kind: paragraph
    origin: source
    source_text: 'Il s’ensuit de ce qui précede que la volonté générale est toujours droite & tend toujours à l’utilité publique : mais il ne s’ensuit pas que les déliberations du peuple aient toujours la même rectitude. On veut toujours son bien, mais on ne le voit pas toujours : Jamais on ne corrompt le peuple, mais souvent on le trompe, & c’est alors seulement qu’il paroit vouloir ce qui est mal.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '56'
        source_sequence: 113
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/68
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c03-001-print
    translation_ja: 以上から、一般意志はつねに正しく、つねに公益をめざすことがわかる。しかし人民の審議が、つねに同じように正しいということにはならない。人はつねに自分のためになることを望むが、それが何かをつねに見抜けるわけではない。人民を堕落させることはできないが、だますことはよくある。そのときにしか、人民は自分のためにならないものを望んでいるようには見えない。
    translation_status: reviewed
  - id: rsc-b2-c03-002
    section_id: rsc-b2-c03
    kind: paragraph
    origin: source
    source_text: Il y a souvent bien de la différence entre la volonté de tous & la volonté générale ; celle-ci ne regarde qu’à l’intérêt commun, l’autre regarde à l’intérêt privé, & n’est qu’une somme de volontés particulieres ; mais ôtez de ces mêmes volontés les plus & les moins qui s’entredétruisent, reste pour somme des différences la volonté générale.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '56'
        source_sequence: 114
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/68
        printed_page_end: '57'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c03-002-print
    translation_ja: 全員の意志と一般意志のあいだには、しばしば大きな違いがある。一般意志が共通の利益だけを見るのに対し、全員の意志は私益に目を向け、個々の意志を足しただけのものだ。しかし、それらの意志から、互いに打ち消し合うプラスとマイナスを除くと、その差を足したものが一般意志として残る。
    translation_status: reviewed
  - id: rsc-note-06-text
    section_id: rsc-b2-c03
    kind: note_body
    origin: source
    source_text: 'Chaque intérêt, dit le M. d’A. a des principes différents. L’accord de deux intérêts particuliers se forme par opposition à celui d’un tiers. Il eut pu ajouter que l’accord de tous les intérêts se forme par opposition à celui de chacun. S’il n’y avoit point d’intérêts différens, à peine sentiroit-on l’intérêt commun qui ne trouveroit jamais d’obstacle : tout iroit de lui-même, & la politique cesseroit d’être un art.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '57'
        source_sequence: 115
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/69
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-06-text-print
    translation_ja: それぞれの利害は異なる原理を持つ、とダルジャンソン侯爵は言う。二つの個別の利害が一致するのは、第三の利害に対立するからだ。侯爵はこうつけ加えることもできただろう。すべての利害が一致するのは、一つひとつの利害と対立するからだ。異なる利害がなければ、共通の利益は決して障害にぶつからないから、ほとんど意識されないだろう。万事はひとりでに進み、政治は技術であることをやめるだろう。
    translation_status: reviewed
  - id: rsc-b2-c03-003
    section_id: rsc-b2-c03
    kind: paragraph
    origin: source
    source_text: Si, quand le peuple suffisamment informé délibére, les Citoyens n’avoient aucune communication entre eux, du grand nombre de petites différences résulteroit toujours la volonté générale, & la délibération seroit toujours bonne. Mais quand il se fait des brigues, des associations partielles aux dépends de la grande, la volonté de chacune de ces associations devient générale par rapport à ses membres, & particuliere par rapport à l’Etat ; on peut dire alors qu’il n’y a plus autant de votans que d’hommes, mais seulement autant que d’associations. Les différences deviennent moins nombreuses & donnent un résultat moins général. Enfin quand une de ces associations est si grande qu’elle l’emporte sur toutes les autres, vous n’avez plus pour résultat une somme de petites différences, mais une différence unique ; alors il n’y a plus de volonté générale, & l’avis qui l’emporte n’est qu’un avis particulier.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '57'
        source_sequence: 116
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/69
        printed_page_end: '58'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c03-003-print
    translation_ja: 人民が十分に事情を知ったうえで審議するときに、市民同士で何のやりとりもなければ、多くの小さな違いから、つねに一般意志が生まれ、審議はつねにうまくいくだろう。しかし派閥が生じ、大きな社会を犠牲にして部分的な結社ができると、それぞれの結社の意志は、その結社の成員に対しては一般的であり、国家に対しては個別的になる。このとき票を投じる者の数は、もはや人の数と等しくなく、結社の数と等しいだけだと言える。違いの数は減り、結果もそれだけ一般性を失う。ついに一つの結社が、ほかのすべてをしのぐほど大きくなると、得られる結果は、もはや小さな違いの総和ではなく、一つだけの違いになる。もはや一般意志はなく、勝った意見は単に一つの個別意見である。
    translation_status: reviewed
  - id: rsc-b2-c03-004
    section_id: rsc-b2-c03
    kind: paragraph
    origin: source
    source_text: Il importe donc pour avoir bien l’énoncé de la volonté générale qu’il n’y ait pas de société partielle dans l’Etat & que chaque Citoyen n’opine que d’après lui. Telle fut l’unique & sublime institution du grand Lycurgue. Que s’il y a des sociétés partielles, il en faut multiplier le nombre & en prévenir l’inégalité, comme firent Solon, Numa, Servius. Ces précautions sont les seules bonnes pour que la volonté générale soit toujours éclairée, & que le peuple ne se trompe point.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '58'
        source_sequence: 117
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/70
        printed_page_end: '60'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c03-004-print
    translation_ja: したがって、一般意志を正しく表明させるには、国家の中には部分的な団体がなく、市民の誰もが自分自身の考えだけで意見を述べることが肝心である。それが偉大なリュクルゴスの、比類なく高邁な制度であった。もし部分的な団体があるなら、ソロン、ヌマ、セルウィウスがしたように、団体の数を増やし、その不平等を防ぐ必要がある。一般意志がつねに事情に通じ、人民が誤らないためには、こうした配慮だけが役に立つ。
    translation_status: reviewed
  - id: rsc-note-07-text
    section_id: rsc-b2-c03
    kind: note_body
    origin: source
    source_text: 'Vera cosa è, dit Machiavel, che alcuni divisioni nuocono alle Republiche, e alcune giovano : quelle nuocono che sono dalle sette e da partigiani accompagnate : quelle giovano che senza sette, senza partigiani si mantengono. Non potendo adunque provedere un fundatore d’una Republica che non siano nimicizie in quella, hà da proveder almeno che non vi siano sette. Hist. Fiorent. L. VII.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '58'
        source_sequence: 118
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/70
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-07-text-print
    translation_ja: 「分裂には共和国を害するものも、益するものもあるのは確かだ」とマキアヴェッリは言う。「党派とその一味をともなう分裂は害となる。党派や一味なしにとどまる分裂は益となる。ゆえに、共和国の創設者が国内の敵対を防げないなら、せめて党派ができることは防がなければならない。」『フィレンツェ史』第七巻。
    translation_status: reviewed
  - id: rsc-b2-c04-heading
    section_id: rsc-b2-c04
    kind: heading
    origin: source
    source_text: CHAPITRE IV.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '60'
        source_sequence: 119
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/72
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-heading-print
    translation_ja: 第四章
    translation_status: reviewed
  - id: rsc-b2-c04-title
    section_id: rsc-b2-c04
    kind: heading
    origin: source
    source_text: Des bornes du pouvoir Souverain.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '60'
        source_sequence: 120
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/72
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-title-print
    translation_ja: 主権の限界について
    translation_status: reviewed
  - id: rsc-b2-c04-001
    section_id: rsc-b2-c04
    kind: paragraph
    origin: source
    source_text: Si l’Etat ou la Cité n’est qu’une personne morale dont la vie consiste dans l’union de ses membres, & si le plus important de ses soins est celui de sa propre conservation, il lui faut une force universelle & compulsive pour mouvoir & disposer chaque partie de la maniere la plus convenable au tout. Comme la nature donne à chaque homme un pouvoir absolu sur tous ses membres, le pacte social donne au corps politique un pouvoir absolu sur tous les siens, & c’est ce même pouvoir, qui, dirigé par la volonté générale porte, comme j’ai dit, le nom de souveraineté.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '60'
        source_sequence: 121
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/72
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-001-print
    translation_ja: 国家、あるいは市民共同体が、それを構成する人々の結合によって生きる道徳的人格にほかならず、その最大の関心が自らの存続にあるのなら、各部分を動かし、全体に最もふさわしいように配置するために、全体に及ぶ強制力が必要である。自然が人間一人ひとりに、手足をはじめとする身体のあらゆる部分に対する絶対的な力を与えるように、社会盟約は、政治体にそのすべての構成員に対する絶対的な力を与える。この力が一般意志によって導かれたときに、先に述べたとおり、主権と呼ばれるのである。
    translation_status: reviewed
  - id: rsc-b2-c04-002
    section_id: rsc-b2-c04
    kind: paragraph
    origin: source
    source_text: Mais outre la personne publique, nous avons à considérer les personnes privées qui la composent, & dont la vie & la liberté sont naturellement indépendantes d’elle. Il s’agit donc de bien distinguer les droits respectifs des Citoyens & du Souverain, & les devoirs qu’ont à remplir les premiers en qualité de sujets, du droit naturel dont ils doivent jouir en qualité d’hommes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '60'
        source_sequence: 122
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/72
        printed_page_end: '61'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-002-print
    translation_ja: しかし、公の人格だけでなく、それを構成しながらも、その生と自由が本来は公の人格から独立している、私人のことも考えなければならない。したがって、市民と主権者それぞれの権利をよく区別し、さらに、市民が臣民として果たすべき義務と、人間として享受すべき自然の権利をも、よく区別する必要がある。
    translation_status: reviewed
  - id: rsc-note-08-text
    section_id: rsc-b2-c04
    kind: note_body
    origin: source
    source_text: Lecteurs attentifs, ne vous pressez pas, je vous prie, de m’accuser ici de contradiction. Je n’ai pu l’éviter dans les termes, vû la pauvreté de la langue ; mais attendez.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '61'
        source_sequence: 123
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/73
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-08-text-print
    translation_ja: 注意深い読者のみなさん、どうかここで私の矛盾を責めるのを急がないでいただきたい。言葉が乏しいので、表現のうえで矛盾を避けられなかったのだが、しばらくお待ち願いたい。
    translation_status: reviewed
  - id: rsc-b2-c04-003
    section_id: rsc-b2-c04
    kind: paragraph
    origin: source
    source_text: On convient que tout ce que chacun aliéne par le pacte social de sa puissance de ses biens de sa liberté, c’est seulement la partie de tout cela dont l’usage importe à la communauté, mais il faut convenir aussi que le Souverain seul est juge de cette importance.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '61'
        source_sequence: 124
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/73
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-003-print
    translation_ja: 誰もが社会盟約によって譲り渡す自分の力、財産、自由は、それらのうち、共同体にとって使い道のある部分だけだ、ということは認められている。だが、どの部分が共同体にとって重要かは、主権者だけが判断するということも、認めなければならない。
    translation_status: reviewed
  - id: rsc-b2-c04-004
    section_id: rsc-b2-c04
    kind: paragraph
    origin: source
    source_text: 'Tous les services qu’un citoyen peut rendre à l’Etat, il les lui doit sitôt que le Souverain les demande ; mais le Souverain de son côté ne peut charger les sujets d’aucune chaine inutile à la communauté ; il ne peut pas même le vouloir : car sous la loi de raison rien ne se fait sans cause, non plus que sous la loi de nature.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '61'
        source_sequence: 125
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/73
        printed_page_end: '62'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-004-print
    translation_ja: 市民が国家に対してなしうる奉仕は、主権者が求めたときには、すべて果たす義務がある。しかし一方で主権者は、共同体の役に立たないくびきは、一つとして臣民に負わせることができない。負わせようと望むことさえできない。自然の法のもとと同じく、理性の法のもとでも、理由なしには何もなされないからだ。
    translation_status: reviewed
  - id: rsc-b2-c04-005
    section_id: rsc-b2-c04
    kind: paragraph
    origin: source
    source_text: Les engagemens qui nous lient au corps social ne sont obligatoires que parce qu’ils sont mutuels, & leur nature est telle qu’en les remplissant on ne peut travailler pour autrui sans travailler aussi pour soi. Pourquoi la volonté générale est elle toujours droite, & pourquoi tous veulent-ils constamment le bonheur de chacun d’eux, si ce n’est parce qu’il n’y a personne qui ne s’approprie ce mot chacun, & qui ne songe à lui-même en votant pour tous ? Ce qui prouve que l’égalité de droit & la notion de justice qu’elle produit dérivent de la préférence que chacun se donne & par conséquent de la nature de l’homme, que la volonté générale pour être vraîment telle doit l’être dans son objet ainsi que dans son essence, qu’elle doit partir de tous pour s’appliquer à tous, & qu’elle perd sa rectitude naturelle lorsqu’elle tend à quelque objet individuel & déterminé ; parce qu’alors jugeant de ce qui nous est étranger nous n’avons aucun vrai principe d’équité qui nous guide.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '62'
        source_sequence: 126
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/74
        printed_page_end: '63'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-005-print
    translation_ja: われわれを社会という団体につなぎとめる約束に拘束力があるのは、それが相互の約束だからである。その性質上、約束を果たすときには、他人のために働きながら自分のためにも働かないということはありえない。一般意志はなぜつねに正しいのか。誰もが仲間一人ひとりの幸福を絶えず望むのはなぜか。それは、「一人ひとり」のなかに自分を含めない人も、みなのために票を投じながら自分のことを考えない人もいないからではないか。このことからわかるのは、権利における平等と、そこから生まれる正義の観念は、各人が自分を優先する心、したがって人間の本性から来ること、そして一般意志が真に一般的であるには、本質だけでなく対象においても一般的でなければならないことだ。一般意志は全員から出て、全員にあてはまらなければならない。ある特定の一個人や個別の事柄を対象にすれば、一般意志は本来の正しさを失う。自分には関わりのないことを裁くとき、何を公平とすべきか、われわれには確かな手がかりがないからだ。
    translation_status: reviewed
  - id: rsc-b2-c04-006
    section_id: rsc-b2-c04
    kind: paragraph
    origin: source
    source_text: En effet, sitôt qu’il s’agit d’un fait ou d’un droit particulier sur un point qui n’a pas été réglé par une convention générale & antérieure, l’affaire devient contentieuse. C’est un procès où les particuliers intéressés sont une des parties & le public l’autre, mais où je ne vois ni la loi qu’il faut suivre, ni le juge qui doit prononcer. Il seroit ridicule de vouloir alors s’en rapporter à une expresse décision de la volonté générale, qui ne peut être que la conclusion de l’une des parties, & qui par conséquent n’est pour l’autre qu’une volonté étrangere, particuliere, portée en cette occasion à l’injustice & sujette à l’erreur. Ainsi de même qu’une volonté particuliere ne peut représenter la volonté générale, la volonté générale à son tour change de nature ayant un objet particulier, & ne peut comme générale prononcer ni sur un homme ni sur un fait. Quand le peuple d’Athenes, par exemple, nommoit ou cassoit ses chefs, décernoit des honneurs à l’un, imposoit des peines à l’autre, & par des multitudes de décrets particuliers exerçoit indistinctement tous les actes du Gouvernement, le peuple alors n’avoit plus de volonté générale proprement dite ; il n’agissoit plus comme Souverain mais comme magistrat. Ceci paroitra contraire aux idées communes, mais il faut me laisser le tems d’exposer les miennes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '63'
        source_sequence: 127
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/75
        printed_page_end: '64'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-006-print
    translation_ja: 実際、一般的であらかじめ交わされた合意によって規定されていない点について、個別の事実や権利が問題になると、係争が生じる。それは関係する私人が一方の当事者、公がもう一方の当事者となる裁判だが、従うべき法も判決を下すべき裁判官も、私には見当たらない。そんなとき、一般意志のはっきりした決定に従おうとするのはばかげている。それは一方の当事者が出した結論でしかありえず、もう一方からすれば、相手方の個別の意志であり、この場合、不正に傾き、誤りやすいものだからだ。個別の意志が一般意志を代表できないのと同じく、一般意志のほうも、個別のものを対象にすればその性質が変わり、一般的な意志としては人一人についても個別の事実についても判断できない。たとえば、アテナイの人民は、長を任免し、ある者には名誉を与え、別の者には刑を科し、無数の個別命令でおよそ政府の行為という行為を区別なく実行した。だが、そのときの人民には厳密な意味での一般意志はなく、主権者ではなく行政官として行動していた。これは普通の考え方に反するように見えるだろうが、私の考えを明らかにするまで、しばらく時間をいただきたい。
    translation_status: reviewed
  - id: rsc-b2-c04-007
    section_id: rsc-b2-c04
    kind: paragraph
    origin: source
    source_text: 'On doit concevoir par là, que ce qui généralise la volonté est moins le nombre des voix, que l’intérêt commun qui les unit : car dans cette institution chacun se soumet nécessairement aux conditions qu’il impose aux autres ; accord admirable de l’intérêt & de la justice qui donne aux délibérations communes un caractere d’équité qu’on voit évanouir dans la discussion de toute affaire particuliere, faute d’un intérêt commun qui unisse & identifie la regle du juge avec celle de la partie.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '64'
        source_sequence: 128
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/76
        printed_page_end: '65'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-007-print
    translation_ja: 以上から、意志を一般的にするのは、票の数よりも、票をまとめる共通の利益であるとわかる。なぜなら、この仕組みでは、誰もが、他人に課す条件に必ず自分も従うことになるからだ。利益と正義とが見事に一致することで、共同の審議は公平な性質を帯びる。どんな個別案件でも、議論のなかでは、その公平さは消えうせる。裁く側と当事者が同じ基準を持つように両者を結びつける、共通の利害がないからだ。
    translation_status: reviewed
  - id: rsc-b2-c04-008
    section_id: rsc-b2-c04
    kind: paragraph
    origin: source
    source_text: 'Par quelque côté qu’on remonte au principe, on arrive toujours à la même conclusion ; savoir, que le pacte social établit entre les citoyens une telle égalité qu’ils s’engagent tous sous les mêmes conditions, & doivent jouir tous des mêmes droits. Ainsi par la nature du pacte, tout acte de souveraineté, c’est-à-dire tout acte authentique de la volonté générale oblige ou favorise également tous les Citoyens, en sorte que le Souverain connoit seulement le corps de la nation & ne distingue aucun de ceux qui la composent. Qu’est-ce donc proprement qu’un acte de souveraineté ? Ce n’est pas une convention du supérieur avec l’inférieur, mais une convention du corps avec chacun de ses membres : Convention légitime, parce qu’elle a pour base le contract social, équitable, parce qu’elle est commune à tous, utile, parce qu’elle ne peut avoir d’autre objet que le bien général, & solide, parce qu’elle a pour garant la force publique & le pouvoir suprême. Tant que les sujets ne sont soumis qu’à de telles conventions, ils n’obéissent à personne, mais seulement à leur propre volonté ; & demander jusqu’où s’étendent les droits respectifs du Souverain & des Citoyens, c’est demander jusqu’à quel point ceux-ci peuvent s’engager avec eux-mêmes, chacun envers tous & tous envers chacun d’eux.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '65'
        source_sequence: 129
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/77
        printed_page_end: '67'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-008-print
    translation_ja: どちらから原理にさかのぼっても、行き着く結論はつねに同じだ。すなわち、社会盟約は市民のあいだに、すべての人が同じ条件で約束を負い、すべての人が同じ権利を享受すべきだという平等をつくり出す。こうして盟約の本性から、主権の行為、つまり一般意志の真正な行為はどれも、すべての市民を等しく拘束し、または益する。だから主権者が目を向けるのは人民全体であって、それを構成する者の誰をも区別しない。では、正確には、主権の行為とは何か。それは上位の者と下位の者との取り決めではなく、団体と、団体を構成する一人ひとりとの取り決めである。社会契約を土台とするから正当であり、すべての者に共通だから公平であり、全体の善以外を目的にしえないから有益であり、公の実力と至上の権力が保証するから確かである。臣民がこうした取り決めにしか従わないかぎり、誰かにではなく、ただ自らの意志に従っている。主権者と市民それぞれの権利はどこまで及ぶのか、と問うことは、市民がどこまで自分たち自身と、つまり各人が全員に対して、全員が各人に対して約束を交わせるか、と問うことなのである。
    translation_status: reviewed
  - id: rsc-b2-c04-009
    section_id: rsc-b2-c04
    kind: paragraph
    origin: source
    source_text: On voit par-là que le pouvoir Souverain, tout absolu, tout sacré, tout inviolable qu’il est, ne passe ni ne peut passer les bornes des conventions générales, & que tout homme peut disposer pleinement de ce qui lui a été laissé de ses biens & de sa liberté par ces conventions ; de sorte que le Souverain n’est jamais en droit de charger un sujet plus qu’un autre, parce qu’alors, l’affaire devenant particuliere, son pouvoir n’est plus compétent.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '67'
        source_sequence: 130
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/79
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-009-print
    translation_ja: こうして、主権は、どれほど絶対的で、神聖で、侵しえないものであっても、一般的な合意の限界を越えず、また越えることもできない。各人は、そうした合意によって手元に残された財産や自由を、思うままに用いることができる。したがって、主権者はある臣民に別の臣民より重い負担を負わせる権利を決して持たない。そのときには個別の案件となり、もはや主権の権限の外にあるからだ。
    translation_status: reviewed
  - id: rsc-b2-c04-010
    section_id: rsc-b2-c04
    kind: paragraph
    origin: source
    source_text: Ces distinctions une fois admises, il est si faux que dans le contract social il y ait de la part des particuliers aucune renonciation véritable, que leur situation, par l’effet de ce contract se trouve réellement préférable à ce qu’elle étoit auparavant, & qu’au lieu d’une aliénation, ils n’ont fait qu’un échange avantageux d’une maniere d’être incertaine & précaire contre une autre meilleure & plus sûre, de l’indépendance naturelle contre la liberté, du pouvoir de nuire à autrui contre leur propre sureté, & de leur force que d’autres pouvoient surmonter contre un droit que l’union sociale rend invincible. Leur vie même qu’ils ont dévouée à l’Etat en est continuellement protégée, & lorsqu’ils l’exposent pour sa défense que font-ils alors que lui rendre ce qu’ils ont reçu de lui ? Que font-ils qu’ils ne fissent plus fréquemment & avec plus de danger dans l’état de nature, lorsque livrant des combats inévitables, ils défendroient au péril de leur vie ce qui leur sert à la conserver ? Tous ont à combattre au besoin pour la patrie, il est vrai ; mais aussi nul n’a jamais à combattre pour soi. Ne gagne-t-on pas encore à courir pour ce qui fait notre sureté une partie des risques qu’il faudroit courir pour nous-mêmes sitôt qu’elle nous seroit ôtée ?
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '67'
        source_sequence: 131
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/79
        printed_page_end: '69'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c04-010-print
    translation_ja: この区別を認めてみれば、社会契約において個々人が真に何かを手放したと考えるのは、まことに誤っている。契約によって、人々の境遇は実際に以前よりよくなった。彼らがしたのは譲渡ではなく、有利な交換にすぎない。不確かであやうい生き方を、もっとよい確かな生き方と、自然の独立を自由と、他人を害する力を自分の安全と、他人に打ち負かされうる自分の力を、社会の結合が無敵にする権利と、それぞれ引き換えたのである。国家に捧げた命さえ、たえず国家に守られている。国家を守るために命を危険にさらすとき、人々がするのは、国家から受け取ったものを返すことにほかならない。自然状態にあって、戦いを避けられず、命を賭けて命を支えるものを守るときには、同じことをもっとひんぱんに、もっと危険な形でしたはずだ。必要とあれば、誰もが祖国のために戦わなければならない。それは確かだ。だが、その代わり、誰も自分のために戦わなくてよい。自分の安全を支えるもののために負う危険は、その安全を奪われたとたん自分一人で負わねばならなくなる危険の一部でしかない。これでもまだ得をしているのではないか。
    translation_status: reviewed

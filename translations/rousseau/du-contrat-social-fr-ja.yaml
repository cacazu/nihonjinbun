    translation_status: reviewed
  - id: rsc-b4-c09-001
    section_id: rsc-b4-c09
    kind: paragraph
    origin: source
    source_text: APrès avoir posé les vrais principes du droit politique & tâché de fonder l’Etat sur sa base, il resteroit à l’appuyer par ses rélations externes ; ce qui comprendroit le droit des gens, le commerce, le droit de la guerre & les conquêtes, le droit public, les ligues les négociations les traités &c. Mais tout cela forme un nouvel objet trop vaste pour ma courte vue ; j’aurois dû la fixer toujours plus près de moi.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: (323)
        source_sequence: 602
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/337
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b4-c09-001-print
    translation_ja: 政治的権利の真の原理を立て、国家をその土台のうえに据えようと努めたあと、まだ残っているのは、外部との関係によって国家を支えることである。その中には、諸国民の法、貿易、戦争と征服の権利、公法、同盟、交渉、条約などが含まれるだろう。だが、これはどれも新しい題目をつくり、私に見通せる範囲には広すぎる。私はつねに、もっと近いところに目を向けるべきだったのだ。
    translation_status: reviewed
  - id: rsc-b4-end
    section_id: rsc-b4-c09

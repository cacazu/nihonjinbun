segments:
  - id: rsc-front-heading
    section_id: rsc-front
    kind: heading
    origin: source
    source_text: AVERTISSEMENT.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: i
        source_sequence: 0
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/5
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-front-heading-print
    translation_ja: まえがき
    translation_status: reviewed
  - id: rsc-front-001
    section_id: rsc-front
    kind: paragraph
    origin: source
    source_text: Ce petit traité est extrait d’un ouvrage plus étendu, entrepris autrefois sans avoir consulté mes forces, & abandonné depuis long-tems. Des divers morceaux qu’on pouvoit tirer de ce qui étoit fait, celui-ci est le plus considérable, & m’a paru le moins indigne d’être offert au public. Le reste n’est déja plus.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: i
        source_sequence: 1
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/5
        printed_page_end: ii
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-front-001-print
    translation_ja: この小論は、かつて自分の力量も顧みずに手をつけ、とうに放棄してしまった、もっと大きな著作から抜き出したものである。書き上げたところから取り出せそうないくつかの部分のうち、これは最もまとまっており、世に問うのにもいくらかふさわしいと思われた。残りは、もうない。
    translation_status: reviewed
  - id: rsc-front-book1
    section_id: rsc-front
    kind: paragraph
    origin: source
    source_text: Où l’on recherche comment l’homme passe de l’Etat de nature à l’état civil, & quelles sont les conditions essencielles du pacte.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: ii
        source_sequence: 2
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/6
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-front-book1-print
    translation_ja: 第一編　人がどのように自然状態から市民状態へ移るのか、またその盟約の不可欠な条件は何かを探る。
    translation_status: reviewed
  - id: rsc-front-book2
    section_id: rsc-front
    kind: paragraph
    origin: source
    source_text: Où il est traité de la Législation.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: iii
        source_sequence: 3
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/7
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-front-book2-print
    translation_ja: 第二編　立法を論じる。
    translation_status: reviewed
  - id: rsc-front-book3
    section_id: rsc-front
    kind: paragraph
    origin: source
    source_text: Où il est traité des loix politiques, c’est-à-dire, de la forme du Gouvernement.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: v
        source_sequence: 4
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/9
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-front-book3-print
    translation_ja: 第三編　政治法、すなわち政府の形態を論じる。
    translation_status: reviewed
  - id: rsc-front-book4
    section_id: rsc-front
    kind: paragraph
    origin: source
    source_text: Où continuant de traiter des loix politiques on expose les moyens d’affermir la constitution de l’Etat.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: vii
        source_sequence: 5
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/11
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-front-book4-print
    translation_ja: 第四編　引き続き政治法を論じ、国家の体制を強固にする方法を明らかにする。
    translation_status: reviewed
  - id: rsc-b1-title
    section_id: rsc-b1
    kind: paragraph
    origin: source
    source_text: DU CONTRACT SOCIAL ; OU, PRINCIPES DU DROIT POLITIQUE.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '1'
        source_sequence: 6
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/13
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-title-print
    translation_ja: 社会契約論、あるいは政治的権利の原理
    translation_status: reviewed
  - id: rsc-b1-heading
    section_id: rsc-b1
    kind: heading
    origin: source
    source_text: LIVRE I.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '1'
        source_sequence: 7
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/13
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-heading-print
    translation_ja: 第一編
    translation_status: reviewed
  - id: rsc-b1-001
    section_id: rsc-b1
    kind: paragraph
    origin: source
    source_text: 'Je veux chercher si dans l’ordre civil il peut y avoir quelque regle d’administration légitime & sûre, en prenant les hommes tels qu’ils sont, & les loix telles qu’elles peuvent être : Je tâcherai d’allier toujours dans cette recherche ce que le droit permet avec ce que l’intérêt prescrit, afin que la justice & l’utilité ne se trouvent point divisées.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '1'
        source_sequence: 8
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/13
        printed_page_end: '2'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-001-print
    translation_ja: 私が探りたいのは、人間を現にあるがままに、法律をありうるがままにとらえるとき、市民社会の秩序において、正当で確かな統治の原則がありうるかどうかである。その探究にあたっては、正義と実益が引き離されないよう、権利が許すことと、利益が求めることとを、つねに結びつけようと努めるつもりだ。
    translation_status: reviewed
  - id: rsc-b1-002
    section_id: rsc-b1
    kind: paragraph
    origin: source
    source_text: J’entre en matiere sans prouver l’importance de mon sujet. On me demandera si je suis prince ou législateur pour écrire sur la Politique ? Je réponds que non, & que c’est pour cela que j’écris sur la Politique. Si j’étois prince ou législateur, je ne perdrois pas mon tems à dire ce qu’il faut faire ; je le ferois, ou je me tairois.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '2'
        source_sequence: 9
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/14
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-002-print
    translation_ja: この題目が大切であることを証明せずに、本題へ入ろう。政治を論じるとは、おまえは君主か立法者か、と問われるだろう。私はこう答える。どちらでもない、だからこそ政治について書くのだ。もし君主か立法者なら、何をすべきか語ることに時間を費やしはしない。実際にそれをするか、さもなければ黙っているだろう。
    translation_status: reviewed
  - id: rsc-b1-003
    section_id: rsc-b1
    kind: paragraph
    origin: source
    source_text: Né citoyen d’un État libre, & membre du souverain, quelque foible influence que puisse avoir ma voix dans les affaires publiques, le droit d’y voter suffit pour m’imposer le devoir de m’en instruire. Heureux, toutes les fois que je médite sur les Gouvernemens, de trouver toujours dans mes recherches de nouvelles raisons d’aimer celui de mon pays !
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '2'
        source_sequence: 10
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/14
        printed_page_end: '3'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-003-print
    translation_ja: 自由な国家の市民に生まれ、主権者の一員である以上、公の事柄に私の声が及ぼしうる力がどれほど小さくとも、そこで票を投じる権利だけで、私にはそれについて学ぶ義務がある。政府について思いをめぐらすたびに、わが国の政府を愛する新しい理由を、その探究のうちにつねに見いだせるのは幸いである。
    translation_status: reviewed
  - id: rsc-b1-c01-heading
    section_id: rsc-b1-c01
    kind: heading
    origin: source
    source_text: CHAPITRE I.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '3'
        source_sequence: 11
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/15
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c01-heading-print
    translation_ja: 第一章
    translation_status: reviewed
  - id: rsc-b1-c01-title
    section_id: rsc-b1-c01
    kind: heading
    origin: source
    source_text: Sujet de ce premier Livre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '3'
        source_sequence: 12
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/15
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c01-title-print
    translation_ja: 第一編の主題
    translation_status: reviewed
  - id: rsc-b1-c01-001
    section_id: rsc-b1-c01
    kind: paragraph
    origin: source
    source_text: L’homme est né libre, & par-tout il est dans les fers. Tel se croit le maître des autres, qui ne laisse pas d’être plus esclave qu’eux. Comment ce changement s’est-il fait ? Je l’ignore. Qu’est-ce qui peut le rendre légitime ? Je crois pouvoir résoudre cette question.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '3'
        source_sequence: 13
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/15
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c01-001-print
    translation_ja: 人は自由な者として生まれた。それなのに、いたるところで鎖につながれている。他人の主人だと思っている者も、その人たち以上に奴隷であることを免れない。この変化はどのように起こったのか。私にはわからない。何がこの変化を正当なものにしうるのか。この問いには答えられると思う。
    translation_status: reviewed
  - id: rsc-b1-c01-002
    section_id: rsc-b1-c01
    kind: paragraph
    origin: source
    source_text: Si je ne considérois que la force, & l’effet qui en dérive, je dirois ; tant qu’un Peuple est contraint d’obéir & qu’il obéït, il fait bien ; sitôt qu’il peut secouer le joug & qu’il le secoüe, il fait encore mieux ; car, recouvrant sa liberté par le même droit qui la lui a ravie, ou il est fondé à la reprendre, ou l’on ne l’étoit point à la lui ôter. Mais l’ordre social est un droit sacré, qui sert de base à tous les autres. Cependant ce droit ne vient point de la nature ; il est donc fondé sur des conventions. Il s’agit de savoir quelles sont ces conventions. Avant d’en venir-là je dois établir ce que je viens d’avancer.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '3'
        source_sequence: 14
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/15
        printed_page_end: '5'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c01-002-print
    translation_ja: もし力と、それが生む結果だけを考えるなら、私はこう言うだろう。ある人民が従うことを強いられて従うあいだは、それでよい。だが、くびきを振り払えるようになって、それを振り払うなら、なおよい。自由を奪ったのと同じ権利によって自由を取り返すのだから、取り返すのが正当であるか、さもなければ、そもそも奪うのが正当でなかったかの、どちらかなのである。ところが、社会の秩序は、ほかのすべての権利の土台となる神聖な権利である。ただしこの権利は自然に由来しない。したがって、合意に基づく。その合意とは何なのかが問題だが、そこへ進む前に、いま述べたことを確かめておかねばならない。
    translation_status: reviewed
  - id: rsc-b1-c02-heading
    section_id: rsc-b1-c02
    kind: heading
    origin: source
    source_text: CHAPITRE II.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '5'
        source_sequence: 15
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/17
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c02-heading-print
    translation_ja: 第二章
    translation_status: reviewed
  - id: rsc-b1-c02-title
    section_id: rsc-b1-c02
    kind: heading
    origin: source
    source_text: Des premieres Sociétés.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '5'
        source_sequence: 16
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/17
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c02-title-print
    translation_ja: 最初の社会について
    translation_status: reviewed
  - id: rsc-b1-c02-001
    section_id: rsc-b1-c02
    kind: paragraph
    origin: source
    source_text: La plus ancienne de toutes les sociétés & la seule naturelle est celle de la famille. Encore les enfans ne restent-ils liés au pere qu’aussi longtems qu’ils ont besoin de lui pour se conserver. Sitôt que ce besoin cesse, le lien naturel se dissout. Les enfans, exempts de l’obéïssance qu’ils devoient au pere, le pere exempt des soins qu’il devoit aux enfans, rentrent tous également dans l’indépendance. S’ils continuent de rester unis ce n’est plus naturellement c’est volontairement, & la famille elle-même ne se maintient que par convention.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '5'
        source_sequence: 17
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/17
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c02-001-print
    translation_ja: あらゆる社会のなかで最も古く、しかも唯一自然に成り立つのが家族である。とはいえ、子どもが父親と結びついているのは、生きていくのに父親を必要とするあいだだけだ。その必要がなくなると、自然の絆はほどける。子どもは父親に従わなくてよくなり、父親は子どもの世話をしなくてよくなり、どちらも等しく独立に戻る。それでも結びついたままでいるなら、もはや自然によってではなく、自分たちでそう望んでのことであり、家族そのものも合意によってはじめて存続する。
    translation_status: reviewed
  - id: rsc-b1-c02-002
    section_id: rsc-b1-c02
    kind: paragraph
    origin: source
    source_text: Cette liberté commune est une conséquence de la nature de l’homme. Sa premiere loi est de veiller à sa propre conservation, ses premiers soins sont ceux qu’il se doit à lui-même, &, sitôt qu’il est en âge de raison, lui seul étant juge des moyens propres à le conserver devient par-là son propre maitre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '5'
        source_sequence: 18
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/17
        printed_page_end: '6'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c02-002-print
    translation_ja: この共通の自由は、人間の本性から生じる。人の第一の掟は、自分の身を守ることだ。第一に気を配るべき相手は、自分自身である。物の分別がつく歳になれば、自分を守るのにふさわしい手段を判断するのは自分一人であり、それによって自分で自分を治めるようになる。
    translation_status: reviewed
  - id: rsc-b1-c02-003
    section_id: rsc-b1-c02
    kind: paragraph
    origin: source
    source_text: La famille est donc si l’on veut le premier modéle des sociétés politiques ; le chef est l’image du pere, le peuple est l’image des enfans, & tous étant nés égaux & libres n’aliénent leur liberté que pour leur utilité. Toute la différence est que dans la famille l’amour du pere pour ses enfans le paye des soins qu’il leur rend, & que dans l’Etat le plaisir de commander supplée à cet amour que le chef n’a pas pour ses peuples.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '6'
        source_sequence: 19
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/18
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c02-003-print
    translation_ja: だから、言ってみれば家族は、政治社会の最初のひな型である。長は父親に、人民は子どもにあたる。誰もが平等かつ自由な者として生まれたのだから、自分の利益のためでなければ、その自由を手放さない。違いはこうだ。家族では、子どもへの愛が、父親の世話への報いとなる。国家では、長は人民にそのような愛を抱かず、その代わりに命令する快さを味わう。
    translation_status: reviewed
  - id: rsc-b1-c02-004
    section_id: rsc-b1-c02
    kind: paragraph
    origin: source
    source_text: 'Grotius nie que tout pouvoir humain soit établi en faveur de ceux qui sont gouvernés : Il cite l’esclavage en exemple. Sa plus constante maniere de raisonner est d’établir toujours le droit par le fait. On pourroit employer une méthode plus conséquente, mais non pas plus favorable aux Tirans.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '6'
        source_sequence: 20
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/18
        printed_page_end: '7'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c02-004-print
    translation_ja: グロティウスは、人間に対する権力がどれも治められる者の利益のために設けられたとは認めない。その例に挙げるのは奴隷制だ。事実から権利を導くのが、彼の一貫した論法である。もっと筋の通った方法はありうるが、暴君にこれ以上有利な方法はあるまい。
    translation_status: reviewed
  - id: rsc-note-01-text
    section_id: rsc-b1-c02
    kind: note_body
    origin: source
    source_text: '„Les savantes recherches sur le droit public ne sont souvent que l’histoire des anciens abus, & on s’est entêté mal-à-propos quand on s’est donné la peine de les trop étudier.” Traité manuscrit des intérêts de la Fr : avec ses voisins ; par M. L. A. d’A. Voilà précisément ce qu’a fait Grotius.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '7'
        source_sequence: 21
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/19
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-01-text-print
    translation_ja: 「公法をめぐる学問的な研究は、往々にして古くからの弊害の歴史にすぎない。わざわざそれを調べすぎるのは、見当違いなことにこだわるというものだ。」ダルジャンソン侯爵の未刊稿『隣国との関係におけるフランスの利益について』。グロティウスがしたのは、まさにこのことだ。
    translation_status: reviewed
  - id: rsc-b1-c02-005
    section_id: rsc-b1-c02
    kind: paragraph
    origin: source
    source_text: 'Il est donc douteux, selon Grotius, si le genre humain appartient à une centaine d’hommes, ou si cette centaine d’hommes appartient au genre humain, & il paroit dans tout son livre pancher pour le premier avis : c’est aussi le sentiment de Hobbes. Ainsi voilà l’espece humaine divisée en troupeaux de bétail, dont chacun a son chef, qui le garde pour le dévorer.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '7'
        source_sequence: 22
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/19
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c02-005-print
    translation_ja: したがってグロティウスに言わせれば、人類が百人ばかりの人間のものなのか、その百人ばかりが人類のものなのか、はっきりしない。彼は著書の全体を通じて前の見方に傾いているようであり、ホッブズも同意見だ。こうして人類は家畜の群れに分けられ、どの群れにも長がいて、食ってしまうために番をすることになる。
    translation_status: reviewed
  - id: rsc-b1-c02-006
    section_id: rsc-b1-c02
    kind: paragraph
    origin: source
    source_text: Comme un pâtre est d’une nature supérieure à celle de son troupeau, les pasteurs d’hommes, qui sont leurs chefs, sont aussi d’une nature supérieure à celle de leurs peuples. Ainsi raisonnoit, au raport de Philon, l’Empereur Caligula ; concluant assez bien de cette analogie que les rois étoient des Dieux, ou que les peuples étoient des bêtes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '7'
        source_sequence: 23
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/19
        printed_page_end: '8'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c02-006-print
    translation_ja: 羊飼いがその群れよりも上等な本性を持つのなら、人間の羊飼い、すなわちその長たちも、人民より上等な本性を持つはずだ。フィロンによると、皇帝カリグラはこのように推論し、このたとえから、王は神であるか、さもなければ人民は獣であるかのどちらかだと、なかなかうまく結論したそうだ。
    translation_status: reviewed
  - id: rsc-b1-c02-007
    section_id: rsc-b1-c02
    kind: paragraph
    origin: source
    source_text: Le raisonnement de ce Caligula revient à celui d’Hobbes & de Grotius. Aristote avant eux tous avoit dit aussi que les hommes ne sont point naturellement égaux, mais que les uns naissent pour l’esclavage & les autres pour la domination.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '8'
        source_sequence: 24
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/20
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c02-007-print
    translation_ja: このカリグラの論法は、ホッブズやグロティウスの論法と同じところへ行き着く。誰よりも先にアリストテレスも、人は生まれながらに平等ではなく、ある者は奴隷になるために、別の者は支配するために生まれる、と言っていた。
    translation_status: reviewed
  - id: rsc-b1-c02-008
    section_id: rsc-b1-c02
    kind: paragraph
    origin: source
    source_text: 'Aristote avoit raison, mais il prenoit l’effet pour la cause. Tout homme né dans l’esclavage nait pour l’esclavage, rien n’est plus certain. Les esclaves perdent tout dans leurs fers, jusqu’au désir d’en sortir : ils aiment leur servitude comme les compagnons d’Ulisse aimoient leur abrutissement. S’il y a donc des esclaves par nature, c’est parce qu’il y a eu des esclaves contre nature. La force a fait les premiers esclaves, leur lâcheté les a perpétués.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '8'
        source_sequence: 25
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/20
        printed_page_end: '9'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c02-008-print
    translation_ja: アリストテレスは正しかったが、結果を原因に取り違えた。奴隷制のなかに生まれた人間は、奴隷になるために生まれてくる。これほど確かなことはない。奴隷は鎖につながれているうちに、そこから逃れたいという望みまですっかり失う。オデュッセウスの仲間たちが獣になったのを気に入ったように、自分の隷属を愛するようになる。だから、生まれつきの奴隷がいるのは、自然に逆らって奴隷にされた人々がいたからだ。最初の奴隷をつくったのは力であり、奴隷を絶やさなかったのは、彼らのおじけだった。
    translation_status: reviewed
  - id: rsc-note-02-text
    section_id: rsc-b1-c02
    kind: note_body
    origin: source
    source_text: 'Voyez un petit traité de Plutarque intitulé : Que les bêtes usent de la raison.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '8'
        source_sequence: 26
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/20
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-02-text-print
    translation_ja: プルタルコスの小論『獣も理性を用いる』を参照。
    translation_status: reviewed
  - id: rsc-b1-c02-009
    section_id: rsc-b1-c02
    kind: paragraph
    origin: source
    source_text: Je n’ai rien dit du roi Adam, ni de l’empereur Noé pere de trois grands Monarques qui se partagerent l’univers, comme firent les enfans de Saturne, qu’on a cru reconnoître en eux. J’espere qu’on me saura gré de cette modération ; car, descendant directement de l’un de ces Princes, & peut-être de la branche aînée, que sais-je si par la vérification des titres je ne me trouverois point le légitime roi du genre humain ? Quoi qu’il en soit, on ne peut disconvenir qu’Adam n’ait été Souverain du monde comme Robinson de son isle, tant qu’il en fut le seul habitant ; & ce qu’il y avoit de commode dans cet empire étoit que le monarque assuré sur son trône n’avoit à craindre ni rébellion ni guerres ni conspirateurs.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '9'
        source_sequence: 27
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/21
        printed_page_end: '10'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c02-009-print
    translation_ja: 王アダムのことも、皇帝ノアのことも、私はまだ何も言っていない。ノアは三人の大君主の父で、三人はサトゥルヌスの子らがしたように世界を分け合った。人々は彼らにサトゥルヌスの子らの姿を見たらしい。この私の慎み深さには感謝してもらいたい。私もこの君主たちの誰かの直系で、ひょっとすると長子の家系かもしれない。系譜を調べたら、私こそ人類の正統な王だとわからないものでもないではないか。いずれにせよ、ロビンソンが島の唯一の住人であったあいだその島の主権者だったように、アダムが世界のただ一人の住人であったあいだ、世界の主権者だったことは否定できまい。この帝国で都合がよかったのは、王座が安泰で、反乱も戦争も陰謀家も恐れる必要がなかったことだ。
    translation_status: reviewed
  - id: rsc-b1-c03-heading
    section_id: rsc-b1-c03

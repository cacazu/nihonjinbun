  - id: rsc-b2-c09-001
    section_id: rsc-b2-c09
    kind: paragraph
    origin: source
    source_text: Comme la nature a donné des termes à la stature d’un homme bien conformé, passé lesquels elle ne fait plus que des Géants ou des Nains, il y a de même, eu égard à la meilleure constitution d’un État, des bornes à l’étendue qu’il peut avoir, afin qu’il ne soit ni trop grand pour pouvoir être bien gouverné, ni trop petit pour pouvoir se maintenir par lui-même. Il y a dans tout corps politique un maximum de force qu’il ne sauroit passer, & duquel souvent il s’éloigne à force de s’aggrandir. Plus le lien social s’étend, plus il se relâche, & en général un petit État est proportionnellement plus fort qu’un grand.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '97'
        source_sequence: 180
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/109
        printed_page_end: '98'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c09-001-print
    translation_ja: 自然は、つり合いの取れた人間の背丈に限界を与え、それを越えるところには、巨人か小人しかつくらない。同じように、国家の最良の体制を考えるなら、国家が取りうる広さにも限界がある。大きすぎてよく治められないことも、小さすぎて自力で存続できないこともないためだ。どの政治体にも、それ以上は増やせない力の上限がある。国を大きくしすぎて、かえってその上限に届かなくなることも多い。社会の絆が広がれば広がるほど、それはゆるみ、一般に小国は、その規模のわりには、大国よりも強い。
    translation_status: reviewed
  - id: rsc-b2-c09-002
    section_id: rsc-b2-c09
    kind: paragraph
    origin: source
    source_text: Mille raisons démontrent cette maxime. Premierement l’administration devient plus pénible dans les grandes distances, comme un poids devient plus lourd au bout d’un plus grand lévier. Elle devient aussi plus onéreuse à mesure que les degrés se multiplient ; car chaque ville a d’abord la sienne que le peuple paye, chaque district la sienne encore payée par le peuple, ensuite chaque province, puis les grands gouvernemens, les Satrapies, les Viceroyautés qu’il faut toujours payer plus cher à mesure qu’on monte, & toujours aux dépends du malheureux peuple ; enfin vient l’administration suprême qui écrase tout. Tant de surcharges épuisent continuellement les sujets ; loin d’être mieux gouvernés par tous ces différens ordres, ils le sont bien moins que s’il n’y en avoit qu’un seul au dessus d’eux. Cependant à peine reste-t-il des ressources pour les cas extraordinaires, & quand il y faut recourir l’Etat est toujours à la veille de sa ruine.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '98'
        source_sequence: 181
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/110
        printed_page_end: '99'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c09-002-print
    translation_ja: この格言を証明する理由は、いくらでもある。第一に、てこの腕が長いほど先端の重りが重く感じられるように、距離が大きくなるほど行政は難しくなる。さらに、段階が増すにつれて、行政はますます費用がかかる。まず都市ごとに行政があり、その費用は人民が払う。地区ごとの行政も人民が払う。その上に州ごとの行政、大きな地方の総督府、サトラップの管区、副王の管区があり、上へ行くほど高くつき、いつも気の毒な人民の負担となる。しまいには中央の行政が来て、すべてを押しつぶす。こうした重荷は臣民を絶えずすり減らす。多くの段階によって、よく治められるどころか、上に一つしかない場合より、ずっと悪く治められる。それなのに、非常時のための備えはほとんど残らない。その備えが要るとき、国家はいつも破滅寸前である。
    translation_status: reviewed
  - id: rsc-b2-c09-003
    section_id: rsc-b2-c09
    kind: paragraph
    origin: source
    source_text: Ce n’est pas tout ; non seulement le Gouvernement a moins de vigueur & de célérité pour faire observer les loix, empêcher les véxations, corriger les abus, prévenir les entreprises séditieuses qui peuvent se faire dans des lieux éloignés ; mais le peuple a moins d’affection pour ses chefs qu’il ne voit jamais, pour la patrie qui est à ses yeux comme le monde, & pour ses concitoyens dont la plus-part lui sont étrangers. Les mêmes loix ne peuvent convenir à tant de provinces diverses qui ont des mœurs différentes, qui vivent sous des climats opposés, & qui ne peuvent souffrir la même forme de gouvernement. Des loix différentes n’engendrent que trouble & confusion parmi des peuples qui, vivant sous les mêmes chefs & dans une communication continuelle, passent ou se marient les uns chez les autres &, soumis à d’autres coutumes, ne savent jamais si leur patrimoine est bien à eux. Les talens sont enfouis, les vertus ignorées, les vices impunis, dans cette multitude d’hommes inconnus les uns aux autres, que le siege de l’administration suprême rassemble dans un même lieu. Les Chefs accablés d’affaires ne voyent rien par eux-mêmes, des commis gouvernent l’Etat. Enfin les mesures qu’il faut prendre pour maintenir l’autorité générale, à laquelle tant d’Officiers éloignés veulent se soustraire ou en imposer, absorbe tous les soins publics, il n’en reste plus pour le bonheur du peuple, à peine en reste-t-il pour sa défense au besoin, & c’est ainsi qu’un corps trop grand pour sa constitution s’affaisse & périt écrasé sous son propre poids.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '99'
        source_sequence: 182
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/111
        printed_page_end: '101'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c09-003-print
    translation_ja: それだけではない。政府は、法律を守らせ、横暴を防ぎ、弊害を正し、遠くで起こりうる反乱の企てを防ぐための力も速さも失う。人民も、一度も見たことのない長たちに、世界のように広く感じられる祖国に、大半が見知らぬ同胞に、あまり愛情を抱かなくなる。風俗が異なり、気候が正反対で、同じ形の政府には耐えられないほど多くの州に、同じ法律はふさわしくない。かといって、別々の法律は、同じ長たちのもとでたえず交流し、互いの土地を行き来したり縁組みしたりし、別々の慣習に従う人々に、混乱しかもたらさない。自分の受け継いだ財産が、本当に自分のものか、いつまでもわからないのだ。中央行政の所在地に集められ、互いを知らない大勢の人のなかで、才能は埋もれ、徳は顧みられず、悪徳は罰せられない。長たちは仕事に追われ、自分の目では何も見られず、役人が国家を治める。ついには遠くの多くの官吏が、全体の権威から逃れたり、権威の目をごまかしたりしようとするので、その権威を保つための対策が、公の関心を独占する。人民の幸福への関心は何一つ残らず、いざというとき人民を守るための関心さえ、ほとんど残らない。こうして、その体制に対して大きくなりすぎた体は沈み込み、自らの重さに押しつぶされて滅びる。
    translation_status: reviewed
  - id: rsc-b2-c09-004
    section_id: rsc-b2-c09
    kind: paragraph
    origin: source
    source_text: 'D’un autre côté, l’Etat doit se donner une certaine base pour avoir de la solidité, pour résister aux secousses qu’il ne manquera pas d’éprouver & aux efforts qu’il sera contraint de faire pour se soutenir : car tous les peuples ont une espece de force centrifuge, par laquelle ils agissent continuellement les uns contre les autres & tendent à s’aggrandir aux dépens de leurs voisins, comme les tourbillons de Descartes. Ainsi les foibles risquent d’être bientôt engloutis, & nul ne peut gueres se conserver qu’en se mettant avec tous dans une espece d’équilibre, qui rende la compression par-tout à peu près égale.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '101'
        source_sequence: 183
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/113
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c09-004-print
    translation_ja: 他方、国家は、しっかりしたものとなるために、また必ず受ける衝撃と、自らを保つため余儀なくされる努力に耐えるために、ある程度の基盤を持たなければならない。人民にはいずれも一種の遠心力があり、デカルトの渦のように、絶えず互いに押し合い、隣国を犠牲にして大きくなろうとするからだ。だから弱い国はすぐに呑み込まれかねない。各方面から受ける圧力をほぼ等しくする一種の均衡に、すべての国との間で自らを置くのでなければ、どの国もほとんど存続できない。
    translation_status: reviewed
  - id: rsc-b2-c09-005
    section_id: rsc-b2-c09
    kind: paragraph
    origin: source
    source_text: On voit par-là qu’il y a des raisons de s’étendre & des raisons de se resserrer, & ce n’est pas le moindre talent du politique de trouver, entre les unes & les autres, la proportion la plus avantageuse à la conservation de l’État. On peut dire en général que les premieres, n’étant qu’extérieures & rélatives, doivent être subordonnées aux autres, qui sont internes & absolues ; une saine & forte constitution est la premiere chose qu’il faut rechercher, & l’on doit plus compter sur la vigueur qui nait d’un bon gouvernement, que sur les ressources que fournit un grand territoire.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '101'
        source_sequence: 184
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/113
        printed_page_end: '102'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c09-005-print
    translation_ja: こうして国を広げる理由も、狭める理由もあるとわかる。この両者のあいだで、国家の存続に最も有利な割合を見つけることは、政治家の才覚のうちでも決して小さくない。一般に、広げる理由は外的で相対的にすぎないから、内的で絶対的な、狭める理由に従うべきである。第一に求めるべきは健全で強固な体制であって、広大な領土がもたらす資源より、よい政府から生まれる強さを頼みにすべきだ。
    translation_status: reviewed
  - id: rsc-b2-c09-006
    section_id: rsc-b2-c09
    kind: paragraph
    origin: source
    source_text: Au reste, on a vu des États tellement constitués, que la nécessité des conquêtes entroit dans leur constitution même, & que pour se maintenir, ils étoient forcés de s’aggrandir sans cesse. Peut-être se félicitoient-ils beaucoup de cette heureuse nécessité, qui leur montroit pourtant, avec le terme de leur grandeur, l’inévitable moment de leur chute.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '102'
        source_sequence: 185
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/114
        printed_page_end: '103'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c09-006-print
    translation_ja: なお、征服の必要が体制それ自体に組み込まれ、存続するために絶えず大きくならざるをえなかった国家もあった。彼らはこの幸いな必要を、大いに喜んでいたのかもしれない。だがそれは、国を大きくできる限界とともに、必ず没落する時をも示していたのである。
    translation_status: reviewed

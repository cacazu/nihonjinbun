        printed_page: '74'
        source_sequence: 141
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/86
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-heading-print
    translation_ja: 第六章
    translation_status: reviewed
  - id: rsc-b2-c06-title
    section_id: rsc-b2-c06
    kind: heading
    origin: source
    source_text: De la loi.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '74'
        source_sequence: 142
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/86
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-title-print
    translation_ja: 法について
    translation_status: reviewed
  - id: rsc-b2-c06-001
    section_id: rsc-b2-c06
    kind: paragraph
    origin: source
    source_text: 'Par le pacte social nous avons donné l’existence & la vie au corps politique : il s’agit maintenant de lui donner le mouvement & la volonté par la législation. Car l’acte primitif par lequel ce corps se forme & s’unit ne détermine rien encore de ce qu’il doit faire pour se conserver.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '74'
        source_sequence: 143
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/86
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-001-print
    translation_ja: 社会盟約によって、われわれは政治体に存在と生命を与えた。今度は立法によって、これに運動と意志を与えなければならない。この団体をつくって一つに結ぶ最初の行為は、その団体が自分を保つために何をすべきか、まだ何一つ定めていないからだ。
    translation_status: reviewed
  - id: rsc-b2-c06-002
    section_id: rsc-b2-c06
    kind: paragraph
    origin: source
    source_text: Ce qui est bien & conforme à l’ordre est tel par la nature des choses & indépendamment des conventions humaines. Toute justice vient de Dieu, lui seul en est la source ; mais si nous savions la recevoir de si haut nous n’aurions besoin ni de gouvernement ni de loix. Sans doute il est une justice universelle émanée de la raison seule ; mais cette justice pour être admise entre nous doit être réciproque. A considérer humainement les choses, faute de sanction naturelle les loix de la justice sont vaines parmi les hommes ; elles ne font que le bien du méchant & le mal du juste, quand celui-ci les observe avec tout le monde sans que personne les observe avec lui. Il faut donc des conventions & des loix pour unir les droits aux devoirs & ramener la justice à son objet. Dans l’état de nature, où tout est commun, je ne dois rien à ceux à qui je n’ai rien promis, je ne reconnois pour être à autrui que ce qui m’est inutile. Il n’en est pas ainsi dans l’état civil où tous les droits sont fixés par la loi.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '74'
        source_sequence: 144
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/86
        printed_page_end: '75'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-002-print
    translation_ja: 善であり秩序にかなうものは、物事の本性によってそうなのであり、人間の取り決めにはよらない。あらゆる正義は神から来る。神だけがその源である。だが、もしわれわれがそれほど高いところから正義を受け取るすべを知っていたなら、政府も法律も必要としなかっただろう。理性だけから出る普遍的な正義は、確かにある。しかしわれわれのあいだで認められるには、その正義は互いに守られなければならない。人間の側から物を見ると、自然に備わった制裁がないため、正義の法は、人間のあいだでは役に立たない。正しい者が誰に対しても正義の法を守り、誰もその人に対しては守らないなら、それは悪人を益し、正しい人に害を与えるだけだ。したがって、権利を義務に結びつけ、正義を本来の目的に引き戻すには、取り決めと法律が必要である。すべてが共有されている自然状態では、約束しなかった人々に対して私は何の義務も負わず、自分には役に立たないものだけを他人のものと認める。市民状態では、すべての権利が法律によって定められるので、そうではない。
    translation_status: reviewed
  - id: rsc-b2-c06-003
    section_id: rsc-b2-c06
    kind: paragraph
    origin: source
    source_text: Mais qu’est-ce donc enfin qu’une loi ? Tant qu’on se contentera de n’attacher à ce mot que des idées métaphysiques, on continuera de raisonner sans s’entendre, & quand on aura dit ce que c’est qu’une loi de la nature on n’en saura pas mieux ce que c’est qu’une loi de l’Etat.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '75'
        source_sequence: 145
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/87
        printed_page_end: '76'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-003-print
    translation_ja: しかし、そもそも法とは何か。この語に形而上学的な考えを結びつけるだけで満足しているかぎり、互いに理解しないまま議論を続けることになる。自然の法とは何かを言えたとしても、国家の法が何かは、それで少しもよくわかるようにはならない。
    translation_status: reviewed
  - id: rsc-b2-c06-004
    section_id: rsc-b2-c06
    kind: paragraph
    origin: source
    source_text: 'J’ai déjà dit qu’il n’y avoit point de volonté générale sur un objet particulier. En effet cet objet particulier est dans l’Etat ou hors de l’Etat. S’il est hors de l’Etat, une volonté qui lui est étrangere n’est point générale par rapport à lui ; & si cet objet est dans l’Etat, il en fait partie : Alors il se forme entre le tout & sa partie une rélation qui en fait deux êtres séparés, dont la partie est l’un, & le tout moins cette même partie est l’autre. Mais le tout moins une partie n’est point le tout, & tant que ce rapport subsiste il n’y a plus de tout mais deux parties inégales ; d’où il suit que la volonté de l’une n’est point non plus générale par rapport à l’autre.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '76'
        source_sequence: 146
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/88
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-004-print
    translation_ja: 個別の対象に対する一般意志はない、と私はすでに述べた。たしかにその個別の対象は、国家の内にあるか外にあるかのどちらかだ。国家の外にあるなら、その対象にとって外部の意志は、対象に対して一般的なものではない。対象が国家の内にあるなら、それは国家の一部である。すると、全体と部分とのあいだに関係が生まれ、別々の二つのものができる。一つはその部分であり、もう一つは同じ部分を除いた全体である。ところが、一部分を除いた全体は、全体ではない。この関係があるかぎり、もう全体はなく、等しくない二つの部分があるだけだ。したがって、一方の意志は他方に対して一般的ではない。
    translation_status: reviewed
  - id: rsc-b2-c06-005
    section_id: rsc-b2-c06
    kind: paragraph
    origin: source
    source_text: Mais quand tout le peuple statue sur tout le peuple il ne considere que lui-même, & s’il se forme alors un rapport, c’est de l’objet entier sous un point-de-vue à l’objet entier sous un autre point de vue, sans aucune division du tout. Alors la matiere sur laquelle on statue est générale comme la volonté qui statue. C’est cet acte que j’appelle une loi.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '76'
        source_sequence: 147
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/88
        printed_page_end: '77'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-005-print
    translation_ja: しかし、人民全体が人民全体について定めるとき、人民はただ自分自身だけを考えている。そこで何か関係が生じるとすれば、それは一つの見方からとらえた対象の全体と、もう一つの見方からとらえた対象の全体との関係であって、全体が何らかの形で分割されることはない。すると、決められる事柄は、それを決める意志と同じように一般的である。この行為を、私は法律と呼ぶ。
    translation_status: reviewed
  - id: rsc-b2-c06-006
    section_id: rsc-b2-c06
    kind: paragraph
    origin: source
    source_text: Quand je dis que l’objet des loix est toujours général, j’entends que la loi considere les sujets en corps & les actions comme abstraites, jamais un homme comme individu ni une action particuliére. Ainsi la loi peut bien statuer qu’il y aura des privileges, mais elle n’en peut donner nommément à personne ; la loi peut faire plusieurs Classes de Citoyens, assigner même les qualités qui donneront droit à ces classes, mais elle ne peut nommer tels & tels pour y être admis ; elle peut établir un Gouvernement royal & une succession héréditaire, mais elle ne peut élire un roi ni nommer une famille royale ; en un mot toute fonction qui se rapporte à un objet individuel n’appartient point à la puissance législative.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '77'
        source_sequence: 148
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/89
        printed_page_end: '78'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-006-print
    translation_ja: 法律の対象はつねに一般的だというとき、私が言うのは、法律は臣民を一団として、行為を抽象的に考え、ある人を個人として考えたり、ある特定の行為を考えたりは決してしない、ということだ。このように、法律は特権があると定められるが、名指しで誰かに授けることはできない。市民をいくつもの階級に分け、それぞれに属する権利を与える資格を定めることさえできるが、誰それをその階級に入れると名指しはできない。王政と世襲制を定められるが、王を選んだり、王家を指名したりはできない。要するに、個別の対象にかかわる機能は、立法権に属さない。
    translation_status: reviewed
  - id: rsc-b2-c06-007
    section_id: rsc-b2-c06
    kind: paragraph
    origin: source
    source_text: Sur cette idée on voit à l’instant qu’il ne faut plus demander à qui il appartient de faire des loix, puisqu’elles sont des actes de la volonté générale ; ni si le Prince est au dessus des loix, puisqu’il est membre de l’Etat ; ni si la loi peut être injuste, puisque nul n’est injuste envers lui-même ; ni comment on est libre & soumis aux loix, puisqu’elles ne sont que des régistres de nos volontés.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '78'
        source_sequence: 149
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/90
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-007-print
    translation_ja: こう考えれば、法律は一般意志の行為だから、誰が法律をつくるのかを尋ねる必要はもはやないと、すぐわかる。統治者は国家の一員だから、法律より上かどうかも問うに及ばない。誰も自分自身に対して不正をはたらかないから、法律は不正でありうるかも問うに及ばない。法律はわれわれの意志を書きとめたものにすぎないから、どうして法律に従いながら自由でいられるのかも問うに及ばない。
    translation_status: reviewed
  - id: rsc-b2-c06-008
    section_id: rsc-b2-c06
    kind: paragraph
    origin: source
    source_text: On voit encore que la loi réunissant l’universalité de la volonté & celle de l’objet, ce qu’un homme, quel qu’il puisse être, ordonne de son chef n’est point une loi ; ce qu’ordonne même le Souverain sur un objet particulier n’est pas non plus une loi mais un décret, ni un acte de souveraineté mais de magistrature.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '78'
        source_sequence: 150
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/90
        printed_page_end: '79'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-008-print
    translation_ja: また法律は意志の普遍性と対象の普遍性を結びつけるのだから、どんな人物であろうと、自分一人で命じることは法律ではないとわかる。主権者でさえ、個別の事柄について命じることは、法律でなく命令であり、主権の行為でなく行政官の行為である。
    translation_status: reviewed
  - id: rsc-b2-c06-009
    section_id: rsc-b2-c06
    kind: paragraph
    origin: source
    source_text: 'J’appelle donc République tout État régi par des loix, sous quelque forme d’administration que ce puisse être : car alors seulement l’intérêt public gouverne, & la chose publique est quelque chose. Tout Gouvernement légitime est républicain : j’expliquerai ci-après ce que c’est que Gouvernement.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '79'
        source_sequence: 151
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/91
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-009-print
    translation_ja: そこで私は、統治の形が何であろうと、法律によって治められるすべての国家を共和国と呼ぶ。そのときにはじめて、公益が治め、公の事柄は意味を持つからだ。正当な政府はどれも共和的である。政府とは何かは、後で説明する。
    translation_status: reviewed
  - id: rsc-note-09-text
    section_id: rsc-b2-c06
    kind: note_body
    origin: source
    source_text: 'Je n’entends pas seulement par ce mot une Aristocratie ou une Démocratie, mais en général tout gouvernement guidé par la volonté générale, qui est la loi. Pour être légitime il ne faut pas que le Gouvernement se confonde avec le Souverain, mais qu’il en soit le ministre : alors la monarchie elle-même est république. Ceci s’éclaircira dans le livre suivant.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '79'
        source_sequence: 152
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/91
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-09-text-print
    translation_ja: この語で指すのは貴族政や民主政だけではない。広く、法律である一般意志に導かれる、あらゆる政府を指す。政府が正当であるには、主権者と一体になるのではなく、主権者に仕えるものでなければならない。そうであれば、君主政そのものも共和国である。次の編で、このことはもっとはっきりするだろう。
    translation_status: reviewed
  - id: rsc-b2-c06-010
    section_id: rsc-b2-c06
    kind: paragraph
    origin: source
    source_text: 'Les loix ne sont proprement que les conditions de l’association civile. Le Peuple soumis aux loix en doit être l’auteur ; il n’appartient qu’à ceux qui s’associent de regler les conditions de la société : mais comment les régleront-ils ? Sera-ce d’un commun accord, par une inspiration subite ? Le corps politique a-t-il un organe pour énoncer ses volontés ? Qui lui donnera la prévoyance nécessaire pour en former les actes & les publier d’avance, ou comment les prononcera-t-il au moment du besoin ? Comment une multitude aveugle qui souvent ne sait ce qu’elle veut, parce qu’elle sait rarement ce qui lui est bon, exécuteroit-elle d’elle-même une entreprise aussi grande aussi difficile qu’un sistême de législation ? De lui-même le peuple veut toujours le bien, mais de lui-même il ne le voit pas toujours. La volonté générale est toujours droite, mais le jugement qui la guide n’est pas toujours éclairé. Il faut lui faire voir les objets tels qu’ils sont, quelquefois tels qu’ils doivent lui paroitre, lui montrer le bon chemin qu’elle cherche, la garantir de la séduction des volontés particulieres, rapprocher à ses yeux les lieux & les tems, balancer l’attrait des avantages présens & sensibles, par le danger des maux éloignés & cachés. Les particuliers voyent le bien qu’ils rejettent : le public veut le bien qu’il ne voit pas. Tous ont également besoin de guides : Il faut obliger les uns à conformer leurs volontés à leur raison ; il faut apprendre à l’autre à connoitre ce qu’il veut. Alors des lumieres publiques résulte l’union de l’entendement & de la volonté dans le corps social, de-là l’exact concours des parties, & enfin la plus grande force du tout. Voilà d’où naît la nécessité d’un Législateur.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '79'
        source_sequence: 153
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/91
        printed_page_end: '82'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c06-010-print
    translation_ja: 厳密にいえば、法律は市民として結びつくための条件にほかならない。法律に従う人民が、その作り手でなければならない。社会の条件を決めるのは、その社会に結びつく者たちだけの務めである。だが、どうやってそれを決めるのか。みなが突然ひらめいて、一致して決めるのか。政治体には、その意志を言い表す器官があるのか。誰が政治体に、意志を行為として形にして前もって公布するための先見を与えるのか。それとも、必要に迫られたその場で、どうやって意志を告げるのか。自分にとって何がよいかをめったに知らず、そのため何が欲しいかさえしばしばわからない、目の見えぬ大勢の人々が、立法の体系を築くほど大きく難しい事業を、どうして独力で成し遂げられよう。人民は自分からつねに善を望むが、自分の力でいつでも善を見抜けるわけではない。一般意志はつねに正しいが、それを導く判断は、つねに事情に通じているわけではない。物事をありのままに、時には一般意志に見えるべき姿で示し、自ら求めている正しい道を示し、個々の意志の誘惑から守り、遠い場所や時代も身近に見せて、今すぐ得られる目に見える利益の魅力に対し、遠くにひそむ害の危険を釣り合わせてやらねばならない。個々人は退ける善が見えている。公は見えない善を望んでいる。どちらも同じように導き手を必要とする。一方には意志を理性に合わせるよう求め、もう一方には、自分が望むものを知るよう教えなければならない。こうして公に理解が行き渡ると、社会という団体のなかで理解と意志が結びつき、各部分は過不足なく協力し、ついに全体の力が最も大きくなる。立法者が必要になるのは、こういう理由からである。
    translation_status: reviewed
  - id: rsc-b2-c07-heading

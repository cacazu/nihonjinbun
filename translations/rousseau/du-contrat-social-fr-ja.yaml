    source_text: Du Législateur.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '82'
        source_sequence: 155
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/94
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-title-print
    translation_ja: 立法者について
    translation_status: reviewed
  - id: rsc-b2-c07-001
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: Pour découvrir les meilleures regles de société qui conviennent aux Nations, il faudroit une intelligence supérieure, qui vit toutes les passions des hommes & qui n’en éprouvât aucune, qui n’eut aucun rapport avec notre nature & qui la connût à fond, dont le bonheur fût indépendant de nous & qui pourtant voulut bien s’occuper du nôtre ; enfin qui, dans le progrès des tems se ménageant une gloire éloignée, put travailler dans un siecle & jouir dans un autre. Il faudroit des Dieux pour donner des loix aux hommes.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '82'
        source_sequence: 156
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/94
        printed_page_end: '83'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-001-print
    translation_ja: それぞれの人民にふさわしい最善の社会の規則を見いだすには、並外れた知性が要る。人間のあらゆる情念が見えながら、それを一つも感じない知性。われわれの本性とは何の関わりも持たないのに、それをすみずみまで知る知性。自分の幸福をわれわれに頼らず、それでもわれわれの幸福を気にかけてくれる知性。そして時代が移っても遠い将来に栄光を得られるように備え、ある時代に働いて、別の時代にその実りを楽しめる知性である。人間に法を与えるには、神々が必要なのだ。
    translation_status: reviewed
  - id: rsc-note-10-text
    section_id: rsc-b2-c07
    kind: note_body
    origin: source
    source_text: Un peuple ne devient célebre que quand sa législation commence à décliner. On ignore durant combien de siecles l’institution de Lycurgue fit le bonheur des Spartiates avant qu’il fût question d’eux dans le reste de la Grece.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '82'
        source_sequence: 157
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/94
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-10-text-print
    translation_ja: 人民が名を知られるのは、その立法の仕組みが衰えはじめてからにすぎない。スパルタのことがほかのギリシアの地で話題になるまで、リュクルゴスの制度は何世紀にわたってスパルタ人を幸福にしてきたのか、誰も知らない。
    translation_status: reviewed
  - id: rsc-b2-c07-002
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: Le meme raisonnement que faisoit Caligula quant au fait, Platon le faisoit quant au droit pour définir l’homme civil ou royal qu’il cherche dans son livre du regne ; mais s’il est vrai qu’un grand Prince est un homme rare, que sera-ce d’un grand Législateur ? Le premier n’a qu’à suivre le modele que l’autre doit proposer. Celui-ci est le méchanicien qui invente la machine, celui-là n’est que l’ouvrier qui la monte & la fait marcher. Dans la naissance des sociétés, dit Montesquieu, ce sont les chefs des républiques qui font l’institution, & c’est ensuite l’institution qui forme les chefs des républiques.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '83'
        source_sequence: 158
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/95
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-002-print
    translation_ja: カリグラが事実についてしたのと同じ推論を、プラトンは権利について行い、統治を論じる著書で、探し求める政治家、あるいは王たる人を定義した。だが、偉大な君主がめったにいない人間だというなら、偉大な立法者はどれほどまれだろう。君主は、立法者が示すべき手本に従うだけでよい。立法者は機械を考案する技師であり、君主はそれを組み立て、動かす職人にすぎない。「社会が生まれるときには、共和国の長が制度をつくるが、そのあとは制度が共和国の長をつくる」と、モンテスキューは言う。
    translation_status: reviewed
  - id: rsc-b2-c07-003
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: 'Celui qui ose entreprendre d’instituer un peuple doit se sentir en état de changer, pour ainsi dire, la nature humaine ; de transformer chaque individu, qui par lui-même est un tout parfait & solitaire, en partie d’un plus grand tout dont cet individu reçoive en quelque sorte sa vie & son être ; d’altérer la constitution de l’homme pour la renforcer ; de substituer une existence partielle & morale à l’existence physique & indépendante que nous avons tous reçue de la nature. Il faut, en un mot, qu’il ôte à l’homme ses forces propres pour lui en donner qui lui soient étrangeres & dont il ne puisse faire usage sans le secours d’autrui. Plus ces forces naturelles sont mortes & anéanties, plus les acquises sont grandes & durables, plus aussi l’institution est solide & parfaite : En sorte que si chaque Citoyen n’est rien, ne peut rien, que par tous les autres, & que la force acquise par le tout soit égale ou supérieure à la somme des forces naturelles de tous les individus, on peut dire que la législation est au plus haut point de perfection qu’elle puisse atteindre.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '83'
        source_sequence: 159
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/95
        printed_page_end: '85'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-003-print
    translation_ja: あえて一つの人民を組織しようとする者は、いわば人間の本性を変えられると自分で確信していなければならない。それだけで完全な、孤立した全体である一人ひとりを、より大きな全体の部分に変え、各人がその全体からいわば生命と存在を受け取るようにしなければならない。人間の成り立ちに手を加え、これを強くする。誰もが自然から受け取った、身体に基づく独立した存在を、全体の一部としての、道徳的な存在に替える。要するに、人から持ち前の力を奪い、それに代えて、自分の外から来て、他人の助けがなければ使えない力を与えなければならない。自然の力が失われて無に帰するほど、得られた力は大きく長もちし、制度も強固で完全になる。したがって、一人ひとりの市民が他の全員によってのみ何者かになり、何事かをなし、全体が得た力が、全個人の自然の力の総和に等しいか、それを上回るなら、立法は達しうる最高の完成に達したと言ってよい。
    translation_status: reviewed
  - id: rsc-b2-c07-004
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: 'Le legislateur est à tous égards un homme extraordinaire dans l’Etat. S’il doit l’être par son génie, il ne l’est pas moins par son emploi. Ce n’est point magistrature, ce n’est point souveraineté. Cet emploi, qui constitue la république, n’entre point dans sa constitution : C’est une fonction particuliere & supérieure qui n’a rien de commun avec l’empire humain ; car si celui qui commande aux hommes ne doit pas commander aux loix, celui qui commande aux loix ne doit pas non plus commander aux hommes ; autrement ses loix, ministres de ses passions, ne feroient souvent que perpétuer ses injustices, & jamais il ne pourroit éviter que des vues particulieres n’altérassent la sainteté de son ouvrage.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '85'
        source_sequence: 160
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/97
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-004-print
    translation_ja: 立法者は、あらゆる点で国家のなかの並外れた人物である。その才能が並外れていなければならないとすれば、その職分もそれに劣らず並外れている。それは行政官の職ではなく、主権でもない。その職分が共和国をつくるのに、その職分は共和国の制度の一部ではない。人間に対する支配とは何の関わりもない、独自の、この上位に立つ役目である。人間に命令する者が法律に命令すべきでないとすれば、法律に命令する者も、人間には命令すべきでないからだ。さもなければ、法律を情念の手先にして、しばしば自らの不正を長引かせるだけとなり、自分の事業の神聖さが私的な思惑で損なわれることを、決して防げないだろう。
    translation_status: reviewed
  - id: rsc-b2-c07-005
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: Quand Lycurgue donna des loix à sa patrie, il commença par abdiquer la Royauté. C’étoit la coutume de la plupart des villes grecques de confier à des étrangers l’établissement des leurs. Les Républiques modernes de l’Italie imiterent souvent cet usage ; celle de Genève en fit autant & s’en trouva bien. Rome dans son plus bel âge vit renaitre en son sein tous les crimes de la Tirannie, & se vit prête à périr, pour avoir réuni sur les mêmes têtes l’autorité législative & le pouvoir souverain.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '85'
        source_sequence: 161
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/97
        printed_page_end: '86'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-005-print
    translation_ja: リュクルゴスは祖国に法を与えたとき、まず王位を退いた。ギリシアの都市ではたいてい、自分たちの法を立てることを外国人に任せるのがしきたりだった。近代イタリアの共和国もこの習わしにならうことが多かった。ジュネーヴ共和国もそうして、よい結果を得た。ローマは最も栄えた時代に、同じ者たちに立法の権威と主権を集中させたため、暴政のあらゆる罪が内部によみがえり、滅びかけた。
    translation_status: reviewed
  - id: rsc-note-11-text
    section_id: rsc-b2-c07
    kind: note_body
    origin: source
    source_text: Ceux qui ne considerent Calvin que comme théologien connoissent mal l’étendue de son génie. La redaction de nos sages Edits, à laquelle il eut beaucoup de part, lui fait autant d’honneur que son institution. Quelque révolution que le tems puisse amener dans notre culte, tant que l’amour de la patrie & de la liberté ne sera pas éteint parmi nous, jamais la mémoire de ce grand homme ne cessera d’y être en bénédiction.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '86'
        source_sequence: 162
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/98
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-11-text-print
    translation_ja: カルヴァンを神学者としか見ない者には、その才能の広さがよくわかっていない。われわれの賢明な法令の起草に大いに関わったことは、彼の立てた宗教制度に劣らぬ名誉である。時の流れがわれわれの信仰にどんな大きな変化をもたらそうとも、祖国と自由への愛がわれわれのあいだで絶えないかぎり、この偉人の記憶が祝福されなくなることは決してない。
    translation_status: reviewed
  - id: rsc-b2-c07-006
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: Cependant les Décemvirs eux-mêmes ne s’arrogerent jamais le droit de faire passer aucune loi de leur seule autorité. Rien de ce que nous vous proposons, disoient-ils au peuple, ne peut passer en loi sans votre consentement. Romains, soyez vous-mêmes les auteurs des loix qui doivent faire votre bonheur.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '86'
        source_sequence: 163
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/98
        printed_page_end: '87'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-006-print
    translation_ja: しかし十人委員たちでさえ、自分たちの権威だけで何かを法律として成立させる権利を、奪い取ったことはない。「われわれが提案することは何一つ、あなたがたの同意なしには法にならない」と、彼らは人民に言った。「ローマ人よ、あなたがたの幸福をもたらす法は、あなたがた自身でつくれ。」
    translation_status: reviewed
  - id: rsc-b2-c07-007
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: 'Celui qui rédige les loix n’a donc ou ne doit avoir aucun droit législatif, & le peuple même ne peut, quand il le voudroit, se dépouiller de ce droit incommunicable ; parce que selon le pacte fondamental il n’y a que la volonté générale qui oblige les particuliers, & qu’on ne peut jamais s’assurer qu’une volonté particuliere est conforme à la volonté générale, qu’après l’avoir soumise aux suffrages libres du peuple : j’ai déjà dit cela, mais il n’est pas inutile de le répéter.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '87'
        source_sequence: 164
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/99
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-007-print
    translation_ja: したがって、法を起草する人は、立法権をまったく持たないか、持つべきではない。人民でさえ、そう望んだからといって、この譲り渡せない権利を放棄することはできない。根本の盟約によれば、個人を拘束できるのは一般意志だけであり、個別の意志が一般意志にかなっていると確かめられるのは、人民の自由な投票にかけたあとでしかないからだ。すでに述べたことだが、繰り返しても無駄ではない。
    translation_status: reviewed
  - id: rsc-b2-c07-008
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: 'Ainsi l’on trouve à la fois dans l’ouvrage de la législation deux choses qui semblent incompatibles : une entreprise au dessus de la force humaine, & pour l’exécuter, une autorité qui n’est rien.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '87'
        source_sequence: 165
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/99
        printed_page_end: '88'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-008-print
    translation_ja: このように、立法という仕事には、一見両立しない二つのことが同時にある。人間の力を越える事業でありながら、それを実行に移す権威は無に等しい。
    translation_status: reviewed
  - id: rsc-b2-c07-009
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: Autre difficulté qui mérite attention. Les sages qui veulent parler au vulgaire leur langage au lieu du sien n’en sauroient être entendus. Or il y a mille sortes d’idées qu’il est impossible de traduire dans la langue du peuple. Les vues trop générales & les objets trop éloignés sont également hors de sa portée ; chaque individu ne goûtant d’autre plan de gouvernement que celui qui se rapporte à son intérêt particulier, apperçoit difficilement les avantages qu’il doit retirer des privations continuelles qu’imposent les bonnes loix. Pour qu’un peuple naissant put goûter les saines maximes de la politique & suivre les regles fondamentales de la raison d’Etat, il faudroit que l’effet put devenir la cause, que l’esprit social qui doit être l’ouvrage de l’institution présidât à l’institution même, & que les hommes fussent avant les loix ce qu’ils doivent devenir par elles. Ainsi donc le Législateur ne pouvant employer ni la force ni le raisonnement, c’est une nécessité qu’il recoure à une autorité d’un autre ordre, qui puisse entraîner sans violence & persuader sans convaincre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '88'
        source_sequence: 166
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/100
        printed_page_end: '89'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-009-print
    translation_ja: 注意すべき別の難点がある。物のわかった人たちは、ふつうの人の言葉でなく、自分たちの言葉でふつうの人に語りかけようとするなら、理解してもらえない。ところが、人民の言葉には置き換えようのない考えが、いくらでもある。あまりに一般的な見通しも、あまりに遠い目的も、人民の手には届かない。一人ひとりが自分の利益にかなう政治の構想しか好まないので、よい法が日々求める我慢から、どんな利益を得られるか、なかなかわからない。生まれたばかりの人民が、健全な政治の格言を理解し、国家を治める理性の根本の規則に従うには、結果が原因になりえなければならない。制度を立てた結果として生まれるはずの社会的な精神が、制度を立てることそのものを導き、法が人を変えてはじめてなるはずのものに、人々は法ができる前からなっていなければならない。こうして立法者は、力も理屈も使えないので、別種の権威に頼るほかない。その権威は、強制せずに人を動かし、論証せずに人を納得させるものでなければならない。
    translation_status: reviewed
  - id: rsc-b2-c07-010
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: Voila ce qui força de tous tems les peres des nations de recourir à l’intervention du ciel & d’honorer les Dieux de leur propre sagesse, afin que les peuples, soumis aux loix de l’Etat comme à celles de la nature, & reconnoissant le même pouvoir dans la formation de l’homme & dans celle de la cité, obéissent avec liberté & portassent docilement le joug de la félicité publique.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '89'
        source_sequence: 167
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/101
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-010-print
    translation_ja: だから、古くから国々の父と呼ばれる人たちは、天に介入を求め、自らの知恵を神々の手柄としてきた。そうすれば、人民は自然の法に服するように国家の法律に服し、人間をつくったのも市民共同体をつくったのも同じ力だと認め、自由なまま従い、公共の幸福というくびきを素直に担うだろうからだ。
    translation_status: reviewed
  - id: rsc-b2-c07-011
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: Cette raison sublime qui s’éleve au dessus de la portée des hommes vulgaires est celle dont le législateur met les décisions dans la bouche des immortels, pour entraîner par l’autorité divine ceux que ne pourroit ébranler la prudence humaine. Mais il n’appartient pas à tout homme de faire parler les Dieux, ni d’en être cru quand il s’annonce pour être leur interprête. La grande ame du Législateur est le vrai miracle qui doit prouver sa mission. Tout homme peut graver des tables de pierre, ou acheter un oracle, ou feindre un secret commerce avec quelque divinité, ou dresser un oiseau pour lui parler à l’oreille, ou trouver d’autres moyens grossiers d’en imposer au peuple. Celui qui ne saura que cela pourra même assembler par hazard une troupe d’insensés, mais il ne fondera jamais un empire, & son extravagant ouvrage périra bientôt avec lui. De vains prestiges forment un lien passager, il n’y a que la sagesse qui le rende durable. La loi judaïque, toujours subsistante, celle de l’enfant d’Ismaël qui depuis dix siecles régit la moitié du monde, annoncent encore aujourd’hui les grands hommes qui les ont dictées ; & tandis que l’orgueilleuse philosophie ou l’aveugle esprit de parti ne voit en eux que d’heureux imposteurs, le vrai politique admire dans leurs institutions ce grand & puissant génie qui préside aux établissemens durables.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '89'
        source_sequence: 168
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/101
        printed_page_end: '91'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-011-print
    translation_ja: ふつうの人の理解を越えるこの高い理性の判断を、立法者は不死の神々の口にのせる。人間の思慮では動かせない人々を、神の権威によって動かすためだ。といっても、誰にも神々を語らせられるわけではなく、自分を神々の代弁者だと名乗って信じてもらえるわけでもない。立法者の偉大な魂こそ、その使命を証明すべき真の奇跡である。石板に文字を刻むこと、神託を買うこと、何かの神とひそかに交わっているふりをすること、耳元で語るように鳥を仕込むこと、ほかにも人民をだます粗雑な手を考えつくことなら、誰にでもできる。それしか知らない者も、運がよければ向こう見ずの一群を集められるかもしれない。だが決して国は創れず、途方もない事業は間もなく本人とともに滅びる。空しい幻術がつくるのは一時の絆だけで、絆を長もちさせるのは知恵だけである。今日もなお存続するユダヤの法、十世紀にわたって世界の半分を治めてきたイシュマエルの子の法は、今日もなお、それを告げた偉大な人々を物語っている。思い上がった哲学や盲目の党派心は彼らを運のよいぺてん師としか見ないが、真の政治家は、彼らの制度に、長く続く仕組みをつかさどる、かの偉大で力強い才能を見て感嘆する。
    translation_status: reviewed
  - id: rsc-note-12-text
    section_id: rsc-b2-c07
    kind: note_body
    origin: source
    source_text: E veramente, dit Machiavel, mai non fù alcuno ordinatore di leggi straordinarie in un popolo, che non ricorresse a Dio, perche altrimenti non sarebbero accettate ; perche sono molti beni conosciuti da uno prudente, i quali non banno in se raggioni evidenti da potergli persuadere ad altrui. Discorsi sopra Tito Livio. L. I. c. XI.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '90'
        source_sequence: 169
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/102
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-12-text-print
    translation_ja: 「実際、ある人民に並外れた法を立てた人で、神に頼らなかった人など、これまで一人もいなかった。そうしなければ法は受け入れられないからだ。思慮深い者が知っている多くの有益なことには、人を説得できるほど明らかな理由が、必ずしも備わっていないのである」とマキアヴェッリは言う。『ティトゥス・リウィウス論』第一巻、第十一章。
    translation_status: reviewed
  - id: rsc-b2-c07-012
    section_id: rsc-b2-c07
    kind: paragraph
    origin: source
    source_text: Il ne faut pas, de tout ceci conclure avec Warburton que la politique & la religion aient parmi nous un objet commun, mais que dans l’origine des nations l’une sert d’instrument à l’autre.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '91'
        source_sequence: 170
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/103
        printed_page_end: '92'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c07-012-print
    translation_ja: 以上から、ウォーバートンとともに、われわれのあいだで政治と宗教は同じ目的を持つと結論すべきではない。国々が始まるとき、一方が他方の道具になる、と結論すべきなのだ。
    translation_status: reviewed
  - id: rsc-b2-c08-heading
    section_id: rsc-b2-c08

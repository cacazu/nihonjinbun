    translation_status: reviewed
  - id: rsc-b4-c01-heading
    section_id: rsc-b4-c01
    kind: heading
    origin: source
    source_text: CHAPITRE I.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '232'
        source_sequence: 437
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/244
    source_alignment:
      - source_id: rey-amsterdam-1762

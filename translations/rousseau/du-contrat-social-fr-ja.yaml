    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-heading-print
    translation_ja: 第六章
    translation_status: reviewed
  - id: rsc-b1-c06-title
    section_id: rsc-b1-c06
    kind: heading
    origin: source
    source_text: Du pacte Social.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '26'
        source_sequence: 56
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/38
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-title-print
    translation_ja: 社会盟約について
    translation_status: reviewed
  - id: rsc-b1-c06-001
    section_id: rsc-b1-c06
    kind: paragraph
    origin: source
    source_text: Je suppose les hommes parvenus à ce point où les obstacles qui nuisent à leur conservation dans l’état de nature, l’emportent par leur résistance sur les forces que chaque individu peut employer pour se maintenir dans cet état. Alors cet état primitif ne peut plus subsister, & le genre humain périroit s’il ne changeoit sa maniere d’être.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '26'
        source_sequence: 57
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/38
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-001-print
    translation_ja: 人間が次の段階に達したと仮定しよう。自然状態で生き延びようとするとき、妨げとなる障害の抵抗が、一人ひとりがその状態を保つために使える力を上回る。こうなると原初の状態は存続できず、人類は生き方を変えなければ滅びてしまうだろう。
    translation_status: reviewed
  - id: rsc-b1-c06-002
    section_id: rsc-b1-c06
    kind: paragraph
    origin: source
    source_text: Or comme les hommes ne peuvent engendrer de nouvelles forces, mais seulement unir & diriger celles qui existent, ils n’ont plus d’autre moyen pour se conserver, que de former par aggrégation une somme de forces qui puisse l’emporter sur la résistance, de les mettre en jeu par un seul mobile & de les faire agir de concert.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '26'
        source_sequence: 58
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/38
        printed_page_end: '27'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-002-print
    translation_ja: ところで、人間は新しい力を生み出せず、ある力を合わせて導くことしかできない。だから生き延びるには、力を集めて障害を上回るだけの総力をつくり、一つの原動力でこれを動かし、そろって働かせるほかはない。
    translation_status: reviewed
  - id: rsc-b1-c06-003
    section_id: rsc-b1-c06
    kind: paragraph
    origin: source
    source_text: 'Cette somme de forces ne peut naitre que du concours de plusieurs : mais la force & la liberté de chaque homme étant les premiers instrumens de sa conservation, comment les engagera-t-il sans se nuire, & sans négliger les soins qu’il se doit ? Cette difficulté ramenée à mon sujet peut s’énoncer en ces termes.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '27'
        source_sequence: 59
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/39
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-003-print
    translation_ja: この総力は、何人もの協力からしか生まれない。だが、各人の力と自由は、自分の身を守るための第一の手段である。どうすれば、自分を害することも、自分のことをないがしろにすることもなく、これを差し出せるだろう。この難問を、ここでの主題に引き寄せて言えば、次のようになる。
    translation_status: reviewed
  - id: rsc-b1-c06-004
    section_id: rsc-b1-c06
    kind: paragraph
    origin: source
    source_text: « Trouver une forme d’association qui défende & protege de toute la force commune la personne & les biens de chaque associé, & par laquelle chacun s’unissant à tous n’obéisse pourtant qu’à lui-même & reste aussi libre qu’auparavant ? » Tel est le problême fondamental dont le contract social donne la solution.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '27'
        source_sequence: 60
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/39
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-004-print
    translation_ja: 「共通の力をすべて用いて、結びついた者それぞれの身と財産を守り、しかも各人が全員と結びつきながら、自分自身にしか従わず、前と同じように自由でいられる、そのような結びつきの形を見いだすにはどうすればよいか。」これが、社会契約が答えを与える根本の問題である。
    translation_status: reviewed
  - id: rsc-b1-c06-005
    section_id: rsc-b1-c06
    kind: paragraph
    origin: source
    source_text: Les clauses de ce contract sont tellement déterminées par la nature de l’acte, que la moindre modification les rendroit vaines & de nul effet ; en sorte que, bien qu’elles n’aient peut-être jamais été formellement énoncées, elles sont par-tout les mêmes, par-tout tacitement admises & reconnües ; jusqu’à ce que, le pacte social étant violé, chacun rentre alors dans ses premiers droits & reprenne sa liberté naturelle, en perdant la liberté conventionnelle pour laquelle il y renonça.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '27'
        source_sequence: 61
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/39
        printed_page_end: '28'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-005-print
    translation_ja: この契約の条項は、この行為そのものの本性によって厳密に定まっており、少しでも変更すると効力を失い、無意味になる。だから、正式な言葉で述べられたことは、ひょっとすると一度もないかもしれないが、どこでも同じで、どこでも黙って受け入れられ、認められている。それは社会盟約が破られ、各人が、自然の自由と引き換えに得た合意上の自由を失って、はじめの権利に戻り、自然の自由を取り戻すまで続く。
    translation_status: reviewed
  - id: rsc-b1-c06-006
    section_id: rsc-b1-c06
    kind: paragraph
    origin: source
    source_text: 'Ces clauses bien entendues se réduisent toutes à une seule, savoir l’aliénation totale de chaque associé avec tous ses droits à toute la communauté : Car premierement, chacun se donnant tout entier, la condition est égale pour tous, & la condition étant égale pour tous, nul n’a intérêt de la rendre onéreuse aux autres.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '28'
        source_sequence: 62
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/40
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-006-print
    translation_ja: この条項はよく理解すればすべて一つに帰する。すなわち、結びついた者がそれぞれ、自分と自分のあらゆる権利を共同体全体にそっくり譲り渡すことだ。第一に、誰もが自分のすべてを差し出すのだから、条件は誰にとっても等しい。そして、条件が誰にとっても等しければ、他人に重い負担を負わせても誰の得にもならない。
    translation_status: reviewed
  - id: rsc-b1-c06-007
    section_id: rsc-b1-c06
    kind: paragraph
    origin: source
    source_text: 'De plus, l’aliénation se faisant sans reserve, l’union est aussi parfaite qu’elle peut l’être & nul associé n’a plus rien à réclamer : Car s’il restoit quelques droits aux particuliers, comme il n’y auroit aucun supérieur commun qui put prononcer entre eux & le public, chacun étant en quelque point son propre juge prétendroit bientôt l’être en tous, l’état de nature subsisteroit, & l’association deviendroit nécessairement tyrannique ou vaine.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '28'
        source_sequence: 63
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/40
        printed_page_end: '29'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-007-print
    translation_ja: さらに、何も留保せずに譲り渡すのだから、結びつきは望みうるかぎり完全になり、構成員にはもはや請求すべきものはない。というのも、もし個人の手元に何らかの権利が残れば、個人と公とのあいだを裁く共通の上位者はいないのだから、各人は、ある点で自分自身の裁判官であることを足場に、じきにすべての点でもそうであろうとする。自然状態はそのまま続き、結びつきは必ず圧政になるか、無意味になるかのどちらかだ。
    translation_status: reviewed
  - id: rsc-b1-c06-008
    section_id: rsc-b1-c06
    kind: paragraph
    origin: source
    source_text: Enfin chacun se donnant à tous ne se donne à personne, & comme il n’y a pas un associé sur lequel on n’acquiere le même droit qu’on lui cede sur soi, on gagne l’équivalent de tout ce qu’on perd, & plus de force pour conserver ce qu’on a.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '29'
        source_sequence: 64
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/41
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-008-print
    translation_ja: 最後に、自分を全員に渡すのは、誰一人にも自分を渡さないことである。しかも、他の構成員に対しては、どの人についても、自分についてその人に譲るのと同じ権利を得る。したがって、失うすべてに見合うものを得たうえに、持っているものを守るための力も増す。
    translation_status: reviewed
  - id: rsc-b1-c06-009
    section_id: rsc-b1-c06
    kind: paragraph
    origin: source
    source_text: Si donc on écarte du pacte social ce qui n’est pas de son essence, on trouvera qu’il se réduit aux termes suivans. Chacun de nous met en commun sa personne & toute sa puissance sous la suprême direction de la volonté générale ; & nous recevons en corps chaque membre comme partie indivisible du tout.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '29'
        source_sequence: 65
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/41
        printed_page_end: '30'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-009-print
    translation_ja: そこで社会盟約から本質的でないものを除けば、次の言葉に行き着く。われわれ一人ひとりは、一般意志の最高の指揮のもとに、自分の身とあらゆる力を共同のものとする。そしてわれわれは一つの団体として、構成員一人ひとりを、全体から切り離せない部分として受け入れる。
    translation_status: reviewed
  - id: rsc-b1-c06-010
    section_id: rsc-b1-c06
    kind: paragraph
    origin: source
    source_text: A l’instant, au lieu de la personne particuliere de chaque contractant, cet acte d’association produit un corps moral & collectif composé d’autant de membres que l’assemblée a de voix, lequel reçoit de ce même acte son unité, son moi commun, sa vie & sa volonté. Cette personne publique qui se forme ainsi par l’union de toutes les autres prenoit autrefois le nom de Cité, & prend maintenant celui de République ou de corps politique, lequel est appelé par ses membres État quand il est passif, Souverain quand il est actif, Puissance en le comparant à ses semblables. À l’égard des associés ils prennent collectivement le nom de peuple, & s’appellent en particulier Citoyens comme participans à l’autorité souveraine, & Sujets comme soumis aux loix de l’Etat. Mais ces termes se confondent souvent & se prennent l’un pour l’autre ; il suffit de les savoir distinguer quand ils sont employés dans toute leur précision.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '30'
        source_sequence: 66
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/42
        printed_page_end: '32'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c06-010-print
    translation_ja: たちまち、この結合行為は、契約するめいめいの個人的な人格に代えて、集会の票の数だけ構成員を持つ、一つの道徳的人格をなす集合体を生む。この団体は、同じ行為から、統一性、共通の自我、生命、意志を受け取る。こうして、ほかのすべての人格が結び合ってできるこの公の人格は、かつては市民共同体と呼ばれたが、いまは共和国、または政治体と呼ばれる。構成員は、それが受動的なときは国家と呼び、能動的なときは主権者と呼び、同じような他の国家との関係では一つの勢力と呼ぶ。一方、結び合った人々をひとまとめにすれば人民であり、一人ひとりは、主権に携わる点からは市民、国家の法に従う点からは臣民と呼ばれる。ただし、これらの言葉はしばしば混同され、互いの代わりに用いられる。本来の厳密な意味で用いられるときに区別できさえすればよい。
    translation_status: reviewed
  - id: rsc-note-03-text
    section_id: rsc-b1-c06
    kind: note_body
    origin: source
    source_text: 'Le vrai sens de ce mot s’est presque entierement effacé chez les modernes ; la plupart prennent une ville pour une Cité & un bourgeois pour un Citoyen. Ils ne savent pas que les maisons font la ville mais que les Citoyens font la Cité. Cette même erreur coûta cher autrefois aux Carthaginois. Je n’ai pas lû que le titre de Cives ait jamais été donné aux sujets d’aucun Prince, pas même anciennement aux Macédoniens, ni de nos jours aux Anglois, quoique plus près de la liberté que tous les autres. Les seuls François prennent tout familièrement ce nom de Citoyens, parce qu’ils n’en ont aucune véritable idée, comme on peut le voir dans leurs Dictionnaires, sans quoi ils tomberoient en l’usurpant dans le crime de Léze-Majesté : ce nom chez eux exprime une vertu & non pas un droit. Quand Bodin a voulu parler de nos Citoyens & Bourgeois, il a fait une lourde bévüe en prenant les uns pour les autres. M. d’Alembert ne s’y est pas trompé, & a bien distingué dans son article Genève les quatre ordres d’hommes (même cinq en y comptant les simples étrangers, ) qui sont dans nôtre ville, & dont deux seulement composent la République. Nul autre auteur François, que je sache, n’a compris le vrai sens du mot Citoyen.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '30'
        source_sequence: 67
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/42
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-03-text-print
    translation_ja: この言葉の本当の意味は、近代の人々のあいだではほとんど失われた。大半の人は都市を市民共同体と、町の住人を市民と思い違いしている。家々がつくるのは都市だが、市民共同体をつくるのは市民であることを知らないのだ。かつてカルタゴの人々は、この同じ誤りのために高い代償を払った。どの君主の臣民に対しても「市民（キウェス）」の名が与えられたとは、読んだ覚えがない。古代のマケドニア人にさえ、今日、他のどの人民より自由に近いイギリス人にさえ、それはない。ひとりフランス人だけが「市民」の名を気軽に名乗る。辞書を見ればわかるように、その名の本当の意味を何も知らないからである。そうでなければ、名をかたることで大逆罪を犯していることになる。彼らにとってこの名が示すのは、一つの徳であって、権利ではない。ボダンがわれわれの市民と町の住人を論じようとしたとき、両者を取り違えて大きなへまをした。ダランベール氏は間違わなかった。『ジュネーヴ』の項で、わが市にいる四つの身分、ただの外国人を数えれば五つの身分を、きちんと区別した。このうち共和国を構成するのは二つだけだ。ほかのフランスの著述家で、「市民」の本当の意味を理解した者を、私は知らない。
    translation_status: reviewed
  - id: rsc-b1-c07-heading
    section_id: rsc-b1-c07
    kind: heading
    origin: source
    source_text: CHAPITRE VII.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '32'
        source_sequence: 68
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/44
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c07-heading-print
    translation_ja: 第七章
    translation_status: reviewed
  - id: rsc-b1-c07-title
    section_id: rsc-b1-c07
    kind: heading
    origin: source
    source_text: Du Souverain.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '32'
        source_sequence: 69
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/44
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c07-title-print
    translation_ja: 主権者について
    translation_status: reviewed
  - id: rsc-b1-c07-001
    section_id: rsc-b1-c07
    kind: paragraph
    origin: source
    source_text: On voit par cette formule que l’acte d’association renferme un engagement réciproque du public avec les particuliers, & que chaque individu, contractant, pour ainsi dire, avec lui-même, se trouve engagé sous un double rapport ; savoir, comme membre du Souverain envers les particuliers, & comme membre de l’Etat envers le Souverain. Mais on ne peut appliquer ici la maxime du droit civil que nul n’est tenu aux engagemens pris avec lui-même ; car il y a bien de la différence entre s’obliger envers soi, ou envers un tout dont on fait partie.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '32'
        source_sequence: 70
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/44
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c07-001-print
    translation_ja: この定式からわかるように、結合行為には、公と個々人とのあいだの相互の約束が含まれる。各人はいわば自分自身と契約し、二重の関係で義務を負う。すなわち、主権者の一員としては個々人に対して、国家の一員としては主権者に対して義務を負う。だが、誰も自分自身と交わした約束には拘束されないという民法の格言は、ここにはあてはまらない。自分自身に対して義務を負うのと、自分がその一部である全体に対して義務を負うのとでは、大きな違いがあるからだ。
    translation_status: reviewed
  - id: rsc-b1-c07-002
    section_id: rsc-b1-c07
    kind: paragraph
    origin: source
    source_text: 'Il faut remarquer encore que la délibération publique, qui peut obliger tous les sujets envers le Souverain, à cause des deux différens rapports sous lesquels chacun d’eux est envisagé, ne peut, par la raison contraire, obliger le Souverain envers lui-même, & que, par conséquent, il est contre la nature du corps politique que le Souverain s’impose une loi qu’il ne puisse enfreindre. Ne pouvant se considérer que sous un seul & même rapport il est alors dans le cas d’un particulier contractant avec soi-même : par où l’on voit qu’il n’y a ni ne peut y avoir nulle espece de loi fondamentale obligatoire pour le corps du peuple, pas même le contract social. Ce qui ne signifie pas que ce corps ne puisse fort bien s’engager envers autrui en ce qui ne déroge point à ce contract ; car à l’égard de l’étranger, il devient un être simple, un individu.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '32'
        source_sequence: 71
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/44
        printed_page_end: '33'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c07-002-print
    translation_ja: もう一つ注意すべきことがある。公の審議は、各人が二つの異なる関係においてとらえられるため、すべての臣民を主権者に対して拘束できる。だが、まさに逆の理由によって、主権者を主権者自身に対して拘束することはできない。したがって、主権者が自分で破ることのできない法律を自らに課すのは、政治体の本性に反する。主権者はただ一つの同じ関係からしか自分をとらえられないのだから、この場合は自分自身と契約を結ぶ一個人と同じ立場にある。したがって、人民という団体を拘束する根本法は、どんな種類のものもなく、またありえない。社会契約でさえそうである。といっても、その契約に反しないことで、他者に対して約束をすることまでできないわけではない。外部の者に対しては、一つの単一な存在、一個の主体となるからだ。
    translation_status: reviewed
  - id: rsc-b1-c07-003
    section_id: rsc-b1-c07
    kind: paragraph
    origin: source
    source_text: Mais le corps politique ou le Souverain ne tirant son être que de la sainteté du contract ne peut jamais s’obliger, même envers autrui, à rien qui déroge à cet acte primitif, comme d’aliéner quelque portion de lui-même ou de se soumettre à un autre Souverain. Violer l’acte par lequel il existe seroit s’anéantir, & ce qui n’est rien ne produit rien.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '33'
        source_sequence: 72
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/45
        printed_page_end: '34'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c07-003-print
    translation_ja: しかし政治体、すなわち主権者は、契約の神聖さによってのみ存在するのだから、他者に対してであっても、この最初の行為に反することを約束することはできない。たとえば、自分の一部を譲り渡すこと、別の主権者に従うことなどである。自らを存在させる行為を破るのは、自らを無に帰することだ。そして存在しないものは何も生まない。
    translation_status: reviewed
  - id: rsc-b1-c07-004
    section_id: rsc-b1-c07
    kind: paragraph
    origin: source
    source_text: Sitot que cette multitude est ainsi réunie en un corps, on ne peut offenser un des membres sans attaquer le corps ; encore moins offenser le corps sans que les membres s’en ressentent. Ainsi le devoir & l’intérêt obligent également les deux parties contractantes à s’entre-aider mutuellement, & les mêmes hommes doivent chercher à réunir sous ce double rapport tous les avantages qui en dépendent.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '34'
        source_sequence: 73
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/46
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c07-004-print
    translation_ja: このように大勢が一つの団体に結ばれると、構成員一人を傷つけることは、団体全体への攻撃となる。まして、団体を傷つければ、その構成員が影響を受けないはずがない。だから、義務と利益のどちらから見ても、契約の両当事者には互いに助け合う義務がある。そして同じ人々が、この二重の関係に由来する利益をすべて合わせて得られるようにすべきである。
    translation_status: reviewed
  - id: rsc-b1-c07-005
    section_id: rsc-b1-c07
    kind: paragraph
    origin: source
    source_text: Or le Souverain n’étant formé que des particuliers qui le composent n’a ni ne peut avoir d’intérêt contraire au leur ; par conséquent la puissance Souveraine n’a nul besoin de garant envers les sujets, parce qu’il est impossible que le corps veuille nuire à tous ses membres, & nous verrons ci-après qu’il ne peut nuire à aucun en particulier. Le Souverain, par cela seul qu’il est, est toujours ce qu’il doit être.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '34'
        source_sequence: 74
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/46
        printed_page_end: '35'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c07-005-print
    translation_ja: さて、主権者をつくるのはそれを構成する個々人だけであるから、主権者にはその人々の利益に反する利益はなく、ありえない。それゆえ、主権を行使する力には、臣民に対して何らの保証も必要ない。団体がすべての構成員を害しようとすることはありえず、また後に見るように、そのうちの誰か一人だけを害することもできないからだ。主権者は存在するというだけで、つねにあるべきとおりのものである。
    translation_status: reviewed
  - id: rsc-b1-c07-006
    section_id: rsc-b1-c07
    kind: paragraph
    origin: source
    source_text: Mais il n’en est pas ainsi des sujets envers le Souverain, auquel malgré l’intérêt commun, rien ne répondroit de leurs engagemens s’il ne trouvoit des moyens de s’assurer de leur fidélité.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '35'
        source_sequence: 75
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/47
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c07-006-print
    translation_ja: しかし、主権者に対する臣民についてはそうではない。共通の利益があっても、主権者が彼らの忠実さを確かなものにする手段を見いだせなければ、彼らが約束を守る保証は何もない。
    translation_status: reviewed
  - id: rsc-b1-c07-007
    section_id: rsc-b1-c07
    kind: paragraph
    origin: source
    source_text: En effet chaque individu peut comme homme avoir une volonté particuliere contraire ou dissemblable à la volonté générale qu’il a comme Citoyen. Son intérêt particulier peut lui parler tout autrement que l’intérêt commun ; son existence absolue & naturellement indépendante peut lui faire envisager ce qu’il doit à la cause commune comme une contribution gratuite, dont la perte sera moins nuisible aux autres que le payement n’en sera onéreux pour lui, & regardant la personne morale qui constitue l’Etat comme un être de raison parce que ce n’est pas un homme, il jouiroit des droits du citoyen sans vouloir remplir les devoirs du sujet ; injustice dont le progrès causeroit la ruine du corps politique.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '35'
        source_sequence: 76
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/47
        printed_page_end: '36'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c07-007-print
    translation_ja: 実際、誰もが、一人の人間としては、市民として持つ一般意志に反する、あるいはそれとは別の、個人としての意志を持ちうる。私益は、共通の利益とはまるで違うことを本人に告げうる。人はもともと他者に依存せず、それ自体で存在するため、共通の営みに対して果たすべき負担を、任意の寄付のように考えることがある。自分が負担する重さに比べれば、自分が負担しないことで他の人が受ける損害など、たいしたものではないと考えるのである。そして国家を成り立たせる道徳的人格を、実際の人間ではないからと、単なる考えの産物と見なし、臣民の義務は果たさずに、市民の権利だけを享受しようとするだろう。この不正が広まれば、政治体は滅びる。
    translation_status: reviewed
  - id: rsc-b1-c07-008
    section_id: rsc-b1-c07
    kind: paragraph
    origin: source
    source_text: 'Afin donc que ce pacte social ne soit pas un vain formulaire, il renferme tacitement cet engagement qui seul peut donner de la force aux autres, que quiconque refusera d’obéir à la volonté générale, y sera contraint par tout le corps : ce qui ne signifie autre chose sinon qu’on le forcera d’être libre ; car telle est la condition qui donnant chaque Citoyen à la Patrie le garantit de toute dépendance personnelle ; condition qui fait l’artifice & le jeu de la machine politique, & qui seule rend légitimes les engagemens civils, lesquels, sans cela seroient absurdes, tyranniques, & sujets aux plus énormes abus.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '36'
        source_sequence: 77
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/48
        printed_page_end: '37'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b1-c07-008-print
    translation_ja: したがって社会盟約が空文句にならないため、そこには、ほかのすべての約束に力を与えられる唯一の約束が暗黙に含まれている。一般意志に従うことを拒む者は、誰であれ、団体全体によって従わされるという約束である。それは、その人が自由であることを強いられるということにほかならない。なぜなら、すべての市民を祖国に結びつけながら、どんな個人にも従属させないのが、この条件だからである。この条件が政治の仕組みを成り立たせ、動かしている。またこの条件だけが、市民としての約束を正当なものにする。これがなければ、それらの約束は無意味で、圧制的で、このうえもない濫用を許すものとなるだろう。
    translation_status: reviewed
  - id: rsc-b1-c08-heading

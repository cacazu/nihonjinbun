    translation_ja: 第十一章
    translation_status: reviewed
  - id: rsc-b2-c11-title
    section_id: rsc-b2-c11
    kind: heading
    origin: source
    source_text: Des divers sistêmes de Législation.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '111'
        source_sequence: 196
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/123
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c11-title-print
    translation_ja: さまざまな立法の体系
    translation_status: reviewed
  - id: rsc-b2-c11-001
    section_id: rsc-b2-c11
    kind: paragraph
    origin: source
    source_text: Si l’on recherche en quoi consiste précisément le plus grand bien de tous, qui doit être la fin de tout sistême de législation, on trouvera qu’il se réduit à ces deux objets principaux, la liberté, & l’égalité. La liberté, parce que toute dépendance particuliere est autant de force ôtée au corps de l’Etat ; l’égalité, parce que la liberté ne peut subsister sans elle.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '111'
        source_sequence: 197
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/123
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c11-001-print
    translation_ja: あらゆる立法の体系が目的とすべき、すべての人にとって最大の善とは、正確には何か。探ってみれば、自由と平等という二つの主な目的に行き着く。自由が必要なのは、個人への従属があるたびに、それだけ国家という団体の力が奪われるからだ。平等が必要なのは、それなしでは、自由を保てないからだ。
    translation_status: reviewed
  - id: rsc-b2-c11-002
    section_id: rsc-b2-c11
    kind: paragraph
    origin: source
    source_text: 'J’ai déjà dit ce que c’est que la liberté civile ; à l’égard de l’égalité, il ne faut pas entendre par ce mot que les degrés de puissance & de richesse soient absolument les mêmes, mais que, quant à la puissance, elle soit au dessous de toute violence & ne s’exerce jamais qu’en vertu du rang & des loix, & quant à la richesse, que nul citoyen ne soit assez opulent pour en pouvoir acheter un autre, & nul assez pauvre pour être contraint de se vendre : Ce qui suppose du côté des grands modération de biens & de crédit, & du côté des petits, modération d’avarice & de convoitise.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '111'
        source_sequence: 198
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/123
        printed_page_end: '112'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c11-002-print
    translation_ja: 市民の自由とは何かはすでに述べた。平等については、力や富の程度がまったく同じであることと考えてはならない。力についていえば、それが暴力をふるうほど強くならず、地位と法律に基づく場合にしか用いられないことだ。富についていえば、ほかの市民を買えるほど富んだ市民も、自分を売らねばならないほど貧しい市民もいないことだ。そのためには、上に立つ者が財産と影響力をほどほどに抑え、下にいる者が物を惜しむ心と欲深さを抑える必要がある。
    translation_status: reviewed
  - id: rsc-note-14-text
    section_id: rsc-b2-c11
    kind: note_body
    origin: source
    source_text: 'Voulez-vous donc donner à l’Etat de la consistance ? rapprochez les degrés extrêmes autant qu’il est possible : ne souffrez ni des gens opulens ni des gueux. Ces deux états, naturellement inséparables, sont également funestes au bien commun ; de l’un sortent les fauteurs de la tirannie & de l’autre les tirans ; C’est toujours entre eux que se fait le trafic de la liberté publique ; l’un l’achete & l’autre la vend.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '112'
        source_sequence: 199
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/124
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-14-text-print
    translation_ja: 国家をしっかりしたものにしたいか。それなら、両極端にある者同士を、できるかぎり近づけよ。大金持ちも物乞いも許してはならない。この二つの境遇はもともと切っても切れず、どちらも等しく共通の善にとって有害だ。一方から暴政に手を貸す者が、もう一方から暴君が生まれる。公の自由が取引されるのは、つねにこの両者のあいだである。一方が買い、もう一方が売る。
    translation_status: reviewed
  - id: rsc-b2-c11-003
    section_id: rsc-b2-c11
    kind: paragraph
    origin: source
    source_text: 'Cette égalité, disent-ils, est une chimere de spéculation qui ne peut exister dans la pratique : Mais si l’abus est inévitable, s’ensuit-il qu’il ne faille pas au moins le regler ? C’est précisément parce que la force des choses tend toujours à détruire l’égalité, que la force de la législation doit toujours tendre à la maintenir.'
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '112'
        source_sequence: 200
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/124
        printed_page_end: '113'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c11-003-print
    translation_ja: この平等は、考えのうえだけの夢物語で、実際にはありえないと、人は言う。だが、弊害が避けられないからといって、せめて抑える必要もないということになるのか。物事の成り行きがつねに平等を壊そうとするからこそ、立法の力はつねに平等を保とうとしなければならないのである。
    translation_status: reviewed
  - id: rsc-b2-c11-004
    section_id: rsc-b2-c11
    kind: paragraph
    origin: source
    source_text: Mais ces objets généraux de toute bonne institution doivent être modifiés en chaque pays par les rapports qui naissent, tant de la situation locale, que du caractere des habitans, & c’est sur ces rapports qu’il faut assigner à chaque peuple un sistême particulier d’institution, qui soit le meilleur, non peut-être en lui-même, mais pour l’Etat auquel il est destiné. Par exemple le sol est-il ingrat & stérile, ou le pays trop serré pour les habitans ? Tournez-vous du côté de l’industrie & des arts, dont vous échangerez les productions contre les denrées qui vous manquent. Au contraire, occupez-vous de riches plaines & des côteaux fertiles ? Dans un bon terrain, manquez-vous d’habitans ? Donnez tous vos soins à l’agriculture qui multiplie les hommes, & chassez les arts qui ne feroient qu’achever de dépeupler le pays, en attroupant sur quelques points du territoire le peu d’habitans qu’il a. Occupez-vous des rivages étendus & comodes ? Couvrez la mer de vaisseaux, cultivez le commerce & la navigation ; vous aurez une existence brillante & courte. La mer ne baigne-t-elle sur vos côtes que des rochers presque inaccessibles ? Restez barbares & Ichtyophages ; vous en vivrez plus tranquilles, meilleurs peut-être, & surement plus heureux. En un mot, outre les maximes communes à tous, chaque Peuple renferme en lui quelque cause qui les ordonne d’une maniere particuliere & rend sa législation propre à lui seul. C’est ainsi qu’autrefois les Hébreux & recemment les Arabes ont eu pour principal objet la Religion, les Athéniens les lettres, Carthage & Tyr le commerce, Rhodes la marine, Sparte la guerre, & Rome la vertu. L’Auteur de l’esprit des loix a montré dans des foules d’exemples par quel art le législateur dirige l’institution vers chacun de ces objets.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '113'
        source_sequence: 201
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/125
        printed_page_end: '115'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c11-004-print
    translation_ja: ただし、よい制度に共通するこれらの目的は、国ごとに、土地のありようや住民の気質から生まれる事情に応じて変えるべきである。その事情に基づいて、一つひとつの人民にふさわしい固有の制度を定めるべきだ。それ自体において最善でなくても、それが与えられる国家にとって最善でなければならない。たとえば土地がやせて作物がとれないか、住民に対して国が狭すぎるか。それなら産業や技芸に力を向け、そこでつくったものと、足りない食糧を交換せよ。反対に、豊かな平野と肥沃な丘を占めているか。よい土地なのに、住民が足りないか。それなら、人を増やす農業に力を尽くし、技芸を追い払え。そうした技芸は、わずかな住民を領土の数か所に集め、ただでさえ人の少ない国を、さらに人のいない国にするだけだろう。広く使い勝手のよい海岸を占めているか。ならば海を船でおおい、貿易と航海を盛んにせよ。華やかではあるが、短い命を得るだろう。海岸で波に洗われるのは、ほとんど近づけない岩ばかりか。それなら、野蛮なまま魚を食べて暮らせ。そのほうが平穏に、おそらくはより善良に、そしてまちがいなく、より幸福に暮らせる。要するに、すべてに共通する格言のほかに、それぞれの人民のうちには、格言を独自の仕方で組み立て、その人民だけにふさわしい立法をつくる何かがある。こうして、昔のヘブライ人と、より新しい時代のアラブ人の主な目的は宗教であり、アテナイ人では文芸、カルタゴとテュロスでは貿易、ロドスでは海運、スパルタでは戦争、ローマでは徳だった。『法の精神』の著者は、立法者がどうやって制度をこうした一つひとつの目的へと導くのか、数多くの例で示した。
    translation_status: reviewed
  - id: rsc-note-15-text
    section_id: rsc-b2-c11
    kind: note_body
    origin: source
    source_text: Quelque branche de commerce extérieur, dit M. d’A., ne répand gueres qu’une fausse utilité pour un royaume en général ; elle peut enrichir quelques particuliers, même quelques villes, mais la nation entiere n’y gagne rien, & le peuple n’en est pas mieux.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '114'
        source_sequence: 202
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/126
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-note-15-text-print
    translation_ja: 対外貿易のある分野が王国全体にもたらすのは、たいてい見せかけの利益にすぎない、とダルジャンソン侯爵は言う。一部の個人や、いくつかの都市を富ませることはあっても、国全体は何も得ず、人民の暮らしもよくならない。
    translation_status: reviewed
  - id: rsc-b2-c11-005
    section_id: rsc-b2-c11
    kind: paragraph
    origin: source
    source_text: Ce qui rend la constitution d’un État véritablement solide & durable, c’est quand les convenances sont tellement observées que les rapports naturels & les loix tombent toujours de concert sur les mêmes points, & que celles-ci ne font, pour ainsi dire, qu’assurer accompagner rectifier les autres. Mais si le Législateur, se trompant dans son objet, prend un principe différent de celui qui nait de la nature des choses, que l’un tende à la servitude & l’autre à la liberté, l’un aux richesses l’autre à la population, l’un à la paix l’autre aux conquêtes, on verra les loix s’affoiblir insensiblement, la constitution s’altérer, & l’Etat ne cessera d’être agité jusqu’à ce qu’il soit détruit ou changé, & que l’invincible nature ait repris son empire.
    source_languages:
      - fr
    source_locations:
      - source_id: rey-amsterdam-1762
        precision: page
        printed_page: '115'
        source_sequence: 203
        url: https://fr.wikisource.org/wiki/Page:Rousseau_-_Du_contrat_social_1762a.djvu/127
        printed_page_end: '117'
    source_alignment:
      - source_id: rey-amsterdam-1762
        original_unit_id: rsc-b2-c11-005-print
    translation_ja: 国家の体制を真に強固で長もちするものにするのは、事情への配慮が行き届き、自然な関係と法律がつねに足並みをそろえ、同じ目的へ向かうときである。法律は、いわばその自然な関係を確かなものにし、それに寄り添い、矯正するだけである。だが立法者が目的を取り違え、物事の本性から生まれる原理とは別の原理を採用すると、一方が隷属に向かい、もう一方が自由に向かう。一方が富に、もう一方が人口の増加に向かう。一方が平和に、もう一方が征服に向かう。こうなると、法は知らぬまに力を失い、体制が変質し、国家は動揺をやめない。ついに国家が滅びるか、別のものとなって、打ち負かしようのない自然がその支配を取り戻すまでである。
    translation_status: reviewed

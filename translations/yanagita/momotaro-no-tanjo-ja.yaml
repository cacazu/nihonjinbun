  section: 繪姿女房
  original: に兩界の曼陀羅二十尋に七流れ、蜀紅の錦を以て織りつけて參らせよとの仰せがある。れそを內山の聖觀音が、假に織女と現じて一夜の程に織らせたまふとあつて、それから始めて山路の君の、笛の妻間ひは必要になつて來るのである。豐後と周防と相對する雙方の海岸には、更に御歸路の船中に於て、異國の兇徒が攻め寄せたといふ逃竄說話も、尙幾通りか傳はつて居るのである。是をある貴き賢太子の外傳と信じ、乃至は或佛閣の創立史と見る時代はとくに過ぎた。もしも根無し草の波のまにまに、流れつゝ花咲く姿と考へるならば、たとへ奧州と筑紫と、西東千里の江山を隔てて居らうとも、この四つの點の類似は只に看過すことが出來ぬ。さうして又同じ話の種の排列の順序如何によつて、大よそどの形のものが先に行はれて居たかを、判別する材料も無いわけでは無いのである。相州小田原在の小賀沼村といふのは、今の足柄上下郡の何村の內になるのか、私にはまだ搜し出せない。「話の世界」の大正八年三月號に、此里の舊姓筑井氏、虎杖の名笛といふものを家寶とし、雨乞の折には巫女が其笛の由來を語る例になつて居たことを、山本芦水君が報じて居る。其話の大筋は昔此家の先祖に笛の上手があつて、大蛇之を慕うて美女に化けて來て此人の妻となつた。やがて一子をまうけて產の紐を解く折に、必ず產屋の中を覗くなと戒めたにも拘らず、竊かに隙見をした爲に蛇體を現じて還り去つた。其時一人子の爲に千兩箱を殘して置いたのを、成人する迄に人に盗まれた。それで海の邊に出て母を喚んでもう一度それを乞ふと、あの千兩箱こそは實は私の片眼だ。今一つをやれば私は盲になるが、我子の爲ならばそれも惜しくは無い。たゞ目の見えぬ母の手引きに、一つの釣鐘を鑄て鳴らしてくれと言つて歸つたといふのである。此話の草子になつて居ることは私はまだ知らぬけれども、所謂口承文藝としては旣に全日本に分布して居る。たゞ大蛇の遺產を千兩箱とした例を、この土地以外では聽いたことが無いだけである。さしあたり知つて居る幾つかを擧げるならば、先づ高木敏雄氏の日本傳說集に二つ。その一つは天龍河畔の巖水寺の子安尊の緣起として傳ふるもの、是は遠江風土記傳にも夙く見えて、綠兒の父を田村將軍とするもの、卽ち立烏帽子の舞や惡玉御前の物語と、系統を引く傳へごとであつた。他の一つは遠く津輕の大鰐あたりに行はれて居たもので、是はまだ傳說として土着もせず、たゞ近江の三井寺の鐘の由來を說く昔話であつた。蛇が或人
  translation: 'に、両界の曼荼羅を二十尋の長さで七流れ、蜀紅の錦で織り付けて献上せよという命令がある。それを内山の聖観音が、仮に機織りの女となって現れ、一夜のうちに織らせてくださるとあって、その後で初めて山路の君が笛によって妻を求めることが必要になるのである。豊後と周防の向かい合う両岸には、さらに帰路の船の中で異国の悪者たちが襲いかかってきたという逃避説話も、なお何通りか伝わっている。これを高貴で賢明なある皇太子の外伝だと信じたり、ある仏閣の創建史とみなしたりする時代は、とっくに過ぎた。もしこれを、根なし草が波に任せて流れながら花を咲かせる姿だと考えるなら、たとえ奥州と筑紫が東西千里の山河を隔てていても、この四点の類似をただ見過ごすことはできない。そして同じ話の要素の並べ方によって、おおよそどの形が先に伝わっていたかを見分ける材料も、ないわけではないのである。

    相州小田原近在の小賀沼村というのは、今の足柄上郡・下郡のどの村に含まれるのか、私はまだ探し出せない。『話の世界』大正八年三月号に山本芦水君が、この里の旧家筑井氏は「虎杖の名笛」というものを家宝にしており、雨乞いの際には巫女がその笛の由来を語る習わしだったと報告している。その話の大筋は、昔この家の先祖に笛の名手がいて、大蛇が慕って美女に化け、その妻になったというものだ。やがて一人の子をもうけ、出産の際には必ず産屋の中をのぞくなと戒めたにもかかわらず、ひそかに隙間から見たため、蛇の姿を現して去ってしまった。そのとき一人子のために千両箱を残したが、成人するまでに人に盗まれた。そこで海辺へ出て母を呼び、もう一度それを求めると、「あの千両箱は実は私の片目なのだ。もう一つをやれば私は目が見えなくなるが、わが子のためなら惜しくはない。ただ、目の見えない母の手引きになるよう、一つの釣り鐘を鋳造して鳴らしておくれ」と言って帰ったというのである。

    この話が草子になっているかどうか、私はまだ知らない。しかし、いわゆる口承文芸としてはすでに日本全土に分布している。ただ、大蛇の遺産を千両箱とした例を、この土地以外では聞いたことがないだけである。差し当たり知っている例をいくつか挙げると、まず高木敏雄氏の『日本伝説集』に二つある。一つは天竜川のほとりの巌水寺の子安尊の縁起として伝えるもの。これは『遠江風土記伝』にも早くから見え、幼児の父を田村将軍とする、つまり「立烏帽子」の舞や悪玉御前の物語と同じ系統の伝承であった。もう一つは遠く津軽の大鰐あたりで伝わっていたもので、こちらはまだ土地の伝説として定着しておらず、ただ近江の三井寺の鐘の由来を説明する昔話だった。蛇がある人'
  notes:
  - 原文の「れそ」は、そのまま保存し、訳では文意から「それ」とした。
  - 「尋」「流れ」は長さ・垂れ下がる布などを数える古い単位。地名「小賀沼」は原画像どおり。

  original: 今ある葛の葉狐の幾つかの院本を始とし、鳥にも魚にも命を救はれた報恩に、女房になつて來て家を富ませてくれた話は數あるが、是は恐らくは後代の複合であつた。恩に對する報謝は異種間の交誼であり、血を合はせ緣を繫ぎ新たに榮ゆる家を立てることは、又一つの別の制度であつたからである。是には正直にして親孝行なる者、又は朴訥單純で一見魯鈍にさへ見える者が、不思議に神靈の目には悅ばれた例もあり、又は田村利仁や小野賴風のやうに、器量武勇の拔群であつた者が、自然に幽界の戀を引付けた物語も傳はつて居るが、尙その以外に特に笛の曲に精妙であつた若者が、かゝる超凡の婚姻に成功し得るものの如く、以前想像せられて居た時代が有つたやうに思はれる。この問題の奥行きは際限も無く深い。我々の祖先が曾て龍蛇の幻しを友としなかつた北種であつたならば、斯ういふ昔話の種は恐らく國內には萠芽し得なかつたらう。しかも口を以て吹く大小の樂器によつて、周圍の自然を制御する技術は古く存し、今も亦弘く利用せられて居る。琵琶の此國に運び入れられ、更に民間に流布する以前にも、盲といふ不幸な者は尙生きなければならなかつた。彼等が笛を吹いたといふことは史書にこそ見る所は無いが、その管理に屬した語りものには痕跡を留めて居るかと思ふ。勿論是から多くの資料を集めて、追々と此假定を確かめて行かねばならぬが、少なくとも眼を失うた水の母が、最初に笛の音に誘はれて、遠く塵界の人に嫁いで來たといふ傳承は、私に取つては大いなる興味がある。笛を神降の曲に用ゐた習慣は、近代に於ては其範圍が至つて弘い。それが一つの信仰又は經驗の擴張であるか、はた又最初から此通り多元のものであつたかは、輕々しく斷定してはならぬが、山路の物語だけは兎に角に水の神と緣があつた。卽ち是が背景になつて居る宇佐八幡の神傳には、龍女婚約の記事が殘り、更に大隅の正八幡に在つては、素女の日光の箭に身ごもつた物語、及びうつぼ舟に載せられて海から漂着した母子のそれがあつた。されば幽かにその遠き神話の日の感動を記憶して居た民人が、所謂大和竹に目をあけた草苅笛の或一つの調べに由つて、そゞろに十六歲の少壯天子、遠く稀世の美女を訪ひ寄りたまふ昔語りを思ひ浮べ、もしくは之を以て深祕極まり無き其夜の歡びを語るものと解したとしても、それも亦至つて自然なる海の國の居住者の、幻覺であつたといふことが出來るのである。(昭和七年八月、岩波版文學)
  translation: '現在ある葛の葉狐のいくつかの浄瑠璃の台本をはじめとして、鳥や魚が命を救われた恩返しに妻となってやって来て、家を豊かにしてくれた話は数多い。しかし、これはおそらく後世に話を組み合わせたものだった。恩への返礼は異種のもの同士の交わりであり、血を合わせて縁を結び、新たに栄える家を築くことは、また別の制度だったからである。こうした婚姻には、正直で親孝行な人や、飾り気がなく単純で、一見すると鈍くさえ見える人が、不思議に神霊の目には好ましく映った例もある。また田村利仁や小野頼風のように、容貌や武勇の抜きんでた人が自然に異界の恋を引き寄せた物語も伝わっている。しかしそれ以外にも、とくに笛の演奏に巧みな若者はこのような超凡の婚姻を成し遂げられると、かつて考えられていた時代があったように思う。

    この問題の奥行きは限りなく深い。私たちの祖先が、かつて竜や蛇の幻を友としなかった北方の種族だったなら、このような昔話の種はおそらく国内では芽生えなかっただろう。しかも、口で吹く大小の楽器によって周囲の自然を制御する技術は古くからあり、今も広く用いられている。琵琶がこの国へ運び込まれ、さらに民間へ広まる以前にも、目の見えないという不幸を負った人々は生きていかなければならなかった。彼らが笛を吹いたことは歴史書にこそ見えないが、彼らの管轄していた語り物には、その痕跡が残っているのではないかと思う。もちろん、これから多くの資料を集め、しだいにこの仮説を確かめていかなければならない。しかし少なくとも、目を失った水の母が、最初は笛の音に誘われ、遠く人間界の男に嫁いできたという伝承は、私には大いに興味深い。笛を神を迎え降ろす曲に用いる習慣は、近代ではきわめて広い範囲に及ぶ。それが一つの信仰や経験が広まったものなのか、それとも初めからこのように起源が多元的だったのか、軽々しく断定してはならないが、山路の物語だけは、ともかく水の神と縁があった。すなわち背景となる宇佐八幡の神の伝承には竜女との婚約の記事が残り、さらに大隅の正八幡には、まだ男を知らない女性が日光の矢によって身ごもった物語や、うつぼ舟に乗せられ海から漂着した母子の物語があった。だから、遠い神話の時代の感動をかすかに記憶していた民衆が、いわゆる大和竹に穴を開けた草刈笛のある調べによって、おのずと十六歳の若い天子が遠く類まれな美女を訪ねたという昔語りを思い浮かべたとしても、またその曲が、限りなく神秘的なあの夜の喜びを語るものだと理解したとしても、それもやはり海の国に住む人々の、ごく自然な幻覚だったと言えるのである。

    （昭和七年八月、岩波版『文学』）'
  notes:
  - 「北種」や視覚障害を「不幸」とする表現は、著者の当時の見解として保持したもので、現代の科学的・社会的評価を示すものではない。
  - 「うつぼ舟」は中が空洞の舟を指す。

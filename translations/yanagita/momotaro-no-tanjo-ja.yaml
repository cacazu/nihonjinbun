  section: 海神少童
  original: 'つたのである。

    次に江刺郡の方には今一つ、是と半分以上同じ話があつた。是は自分の舊著「雪國の春」に

    も揭げて置いたから知つて居る人もあらうが、舞臺は右の二つの如く渦まく谷川の淵では無

    かつた。

    昔爺は山へ柴苅りに行つて、谷に大きな洞穴を一つ見つけた。斯ういふ穴にはえて惡い

    物が住むものだ。塞いで置いた方がよいと思つて、一束の柴を押込むと、柴は穴の栓には

    ならずに、ずる〴〵と穴の中へ入つて行つた。又一束押込んで見たがそれも其通りで、

    それからもう一束もう一束と思ふうちに、三月の間苅りためてあつた柴を、悉くその穴

    の中へ入れてしまつた。其時に穴の中から、美しい女が出て來て、澤山柴を貰つた禮を

    言ひ、一度穴の中へ來てくれといふ。あまり勸められるので爺はつい入つて見る氣にな

    つて附いて行くと、中には目の醒めるやうな立派な家があり、其家の側には爺が三月も

    かゝつて苅つた柴の束が、ちやんと積重ねてあつた云々(江刺郡昔話一三頁)。

    斯ういふ風に、柴刈る翁が柴を投込んだことは同じでも、それを投込む氣になつた理由は

    一つの郡に於てすらもう區々になつて居る。さうしてどの話も皆尤もらしく無いのは、更に

    今一つ以前の別な語り傳へがあつて、しかも其動機がもはや通用し難くなつて居たことを想

    像せしめるのである。

    四龍宮の女性

    柴を水底に送り屆けた動機は、今は此通り色々に話されて居る。併し本來はそれが慰みで

    も無く、又不用になつたからでも無くて、實は貧しい老爺の好意に出でたらしいことは、若

    い上臈が水の中から出て來て、禮を叙べたといふのからも察せられる。或は當人にはそれだ

    けの考へも無くてした事が、偶然に水の神の悅びたまふ贈與となつたといふ風に、夙くから

    語らうとして居たものかも知れない。とにかくにそれは非常な善事であつたことだけは疑ひ

    が無いのだが、肥後のハナタレ小僧樣の話などでは、もう其點が不明になつてしまつて、爺

    が平生よく働くから龍神が感心して御出でるなどと謂つて居たのである。

    しかも女性が現れて水の都の居住者の滿足を語つたといふ點のみは、上に列擧した南北五'
  translation: 'ったのである。

    次に、江刺郡にはもう一つ、これと半分以上同じ話があった。これは私の旧著『雪国の春』にも載せておいたので、知っている人もあるだろうが、舞台は前の二例のような、渦巻く谷川の淵ではなかった。

    昔、おじいさんは山へ柴刈りに行き、谷に大きな洞穴を一つ見つけた。こういう穴には、とかく悪いものが住むものだ。ふさいでおいたほうがよいと思い、一束の柴を押し込むと、柴は穴をふさがずに、ずるずると中へ入っていった。もう一束押し込んでみても同じだった。それから、もう一束、もう一束と思ううちに、三か月の間に刈りためていた柴を、すべてその穴へ入れてしまった。そのとき、穴の中から美しい女が現れ、たくさん柴をもらった礼を言って、一度穴の中へ来てくれと言う。あまりに勧められるので、おじいさんもつい入ってみる気になってついていくと、中には目の覚めるような立派な家があり、そのそばには、おじいさんが三か月もかかって刈った柴の束が、きちんと積み重ねてあった、という（『江刺郡昔話』一三頁）。

    このように、柴を刈る老人が柴を投げ込んだという点は同じでも、投げ込む気になった理由は、一つの郡の中でさえすでにまちまちになっている。そして、どの話ももっともらしくないことから、さらにそれ以前に別の語り伝えがあり、しかも、そこで語られていた動機がもはや理解されにくくなっていたのではないか、と想像される。

    四　竜宮の女性

    柴を水底へ送り届けた動機は、今ではこのようにさまざまに語られている。しかし本来は、遊びのためでも、不要になったからでもなく、実は貧しい老人の好意から出たらしいことは、若い身分の高い女性が水の中から出てきて礼を述べたということからも推察できる。あるいは、本人にはそこまでの考えもなくしたことが、偶然、水の神がお喜びになる贈り物になった、と早くから語ろうとしていたのかもしれない。いずれにしても、それが非常によい行いだったことだけは疑いがない。それなのに、肥後のハナタレ小僧様の話などでは、すでにその点がわからなくなり、おじいさんが日頃よく働くから竜神が感心しておられる、などと言っていたのである。

    それでも、女性が現れ、水の都の住人が喜んでいることを語ったという点だけは、上に挙げた南北五'
  notes:
  - 画像をまたぐ文は前後のunitと接続する。

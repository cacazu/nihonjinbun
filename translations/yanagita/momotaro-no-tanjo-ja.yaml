  section: 瓜子織姫／三 瓜と桃
  original: 前に算へた十一の昔話の中で、婆が洗濯に行かぬのは二つしか例が無い。しかも其中でも膽澤郡の一話(六)は、爺と婆とが二人で瓜を食ふべと思つて、二つに割つて見たらメンコイオボコ(かはいゝ赤んぼ)が出たといふので、瓜子姫子を爺婆の實の子の如くに話すのは(四)だけである。水の流れを下つて來たといふことが、元は缺くべからざる要件であつたことは大よそ推定して差支が無からうと思ふ。卽ち此綠兒は授かつた兒であつたのである。現存の昔話に於ては、桃太郞以外には無いやうに思ふが、この川上の未知數といふことは、山の多い日本の島では今でも考へられることだと見えて、藁が流れて來たので谷の奧に里あるを知り、木の椀を拾ひ上げて落人の隱れ家を尋ねあてたといふ類の趣向は、くりかへして後代の小說にも思ひ浮べられて居る。古代の言ひ傳へとしては山城賀茂の瀨見小河の神話、それと必ず一系であらうと思ふ大和の方の物語にも、流れて來たものは美しい箭であつて、少女が是に感動して身ごもつたことに歸着して居る。出雲風土記の加賀神崎の傳說に於ては、御子旣に產れて後に其母がますらを神の驗を求めたまふことになつて居るが、やはり窟の奥から水に沿うて、父の御弓箭が流れ出たことは同じである。さうして其弓箭が金色に照り耀いたといふのは、賀茂で語り傳へた丹塗矢と等しく、所謂ダナエ神話の此島に來てからの變化かと想像せられる。卽ち我日本に於ては、人間の少女を母にする異常の力が、特に川上の清く
  translation: '先に数えた十一の昔話のうち、お婆さんが洗濯に行かない例は、二つしかない。しかも、そのうち胆沢郡の一例（六）は、お爺さんとお婆さんが二人で瓜を食べようと思い、二つに割ってみると、メンコイオボコ（かわいい赤ん坊）が出てきたというものだ。瓜子姫子を、爺婆の実の子のように語るのは、（四）だけなのである。水の流れを下ってきたことが、もとは欠かせない条件だったと考えて、まず差し支えないだろう。つまり、この赤ん坊は、授かった子だったのである。

    現存する昔話では、桃太郎以外にはないように思うが、この「川上にある未知のもの」という発想は、山の多い日本では、今も考えられるものらしい。藁が流れてきたので谷の奥に里があると知ったとか、木の椀を拾い上げて落人の隠れ家を探し当てたとかいう趣向が、後世の小説にも繰り返し現れている。

    古代の伝承では、山城賀茂の瀬見小河の神話、また、それと必ず同じ系統だと思われる大和の物語において、流れてきたものは美しい矢であり、少女がそれに感応して身ごもった、ということに帰着する。『出雲風土記』の加賀神崎の伝説では、すでに御子が生まれた後で、その母が、父なる男神のしるしを求めたことになっている。しかし、やはり洞窟の奥から、水に沿って父の弓矢が流れ出てきたことは同じである。

    その弓矢が金色に輝いていたというのは、賀茂に伝わる丹塗りの矢と同じく、いわゆるダナエ神話が、この島に来てから変化した姿かと推測される。つまり日本では、人間の少女を母にする不思議な力が、特に川上の清らかで'

  section: 海神少童
  original: 'つたので、必ずしも鼻息の吐入に由らねばならぬ理由は無く、此點後代の說話傳承者、殊に

    其運送と分配とを職務とする者どもの、次々に智能辯舌を揮ふべき餘地の存する所であつ

    た。それ故にこそ地方每に其叙述の樣式を異にし、從うて聽く者の興味を之に集注させて、

    追々と我々の昔話を愉快極まるものにしたのであつた。一例をいふと或動物が金を糞する話、

    是などは旣に寛永年間の醒睡笑に於て、猾智ある弟の田九郞が、鈍にして家富みたる兄の旦

    九郎を、欺く手段として用ゐられて居り、爰では既に金ひり馬の話に化して居るのである。

    尾崎紅葉の所謂二人椋助は、外國でも既に人望多き笑話になつて居て、其中にも黃金の卵を

    生むといふ鵝鳥の話はある。だから又彼を知り是を知らざる人々には、忽ちにして文化拜借

    の一例證を供するかも知らぬが、兄弟の境遇氣質のちがひから、貧しくて正しい者が後に幸

    福を得たといふ、眞面目な話ならば却つて日本に多く、それが變化して行つておどけ話にな

    つた順序は、寧ろ此方に於てこそ精密に跡付けられるので、しかも一方が他を學んだといふ

    ことも、實はまだ些しでも明かでは無いのである。只今我々が略、安心して言へることは、

    血を分けた兄弟、緣有つて連れ添ふ爺と婆、もしくは軒を並べて住む二組の老夫婦の間に、

    是ほどまで裏表のはつきりした心掛の善し惡しと、それに伴ふ運不運とがあつたといふのは、

    なんぼ素朴な昔の人たちにも、高笑ひせずには聽かれない誇張であつて、從つて後來話者の

    空想の赴くまゝに、次第に笑話化して行くべき傾向を、特に此部分が夙くから具へて居たと

    いふことである。笑話は近代に入つては其數が非常に多く、中には實際の經驗から生れたも

    のもあるやうに考へられて居るが、よく見ると大抵は古い根株の存するものばかりで、其役

    者の數も僅かであり、變化はたゞ優れたる者の成功と、劣れる者の失敗とを幾らでも耳新ら

    しく、話しかへて來たといふに過ぎなかつた樣である。しかもその新趣向とても、必ずしも

    每回の創意に成るものとは限らず、中には今まで有るものを轉用しもしくは繼合せた場合も

    あつたことは、黄金を糞する黑猫の話などが之を推測せしめる。所謂金卵傳說は旣に我邦に

    は痕跡を留めないが、それと獨立しては此空想は恐らくは生れなかつた。だから今日は元の

    生眞面目な形が假に無くなつて居らうとも、又稀には外國にも同じ型が傳はつて居らうと

    も、尙笑話が最初から笑話として、此世に現はれたと見ることの出來ないのは、童話の場合

    も全く同じことである。つまり說話といふものは成長したのである。成長したればこそいつ'
  translation: 'ったのである。必ずしも鼻で息を吐いたり吸ったりするのでなくてはならない理由はなく、この点こそ、後世の物語の伝承者、とりわけ話を運び広めることを職とする者たちが、次々と知恵や弁舌を発揮できる余地だった。だからこそ土地ごとに語り方が異なり、聞き手の関心をそこへ集め、次第に私たちの昔話を、きわめて愉快なものにしていったのである。

    一例を挙げれば、ある動物が金の糞をするという話がある。こうした話は、すでに寛永年間の『醒睡笑』で、ずる賢い弟の田九郎が、鈍くて裕福な兄の旦九郎をだます手段として用いられており、ここではすでに、金をひり出す馬の話になっている。尾崎紅葉のいう『二人椋助』は、外国でもすでに人気のある笑い話になっていて、その中にも黄金の卵を産むガチョウの話がある。そのため、外国のものを知り、日本のものを知らない人には、たちまち文化を借りた証拠の一つを提供するかもしれない。しかし、兄弟の境遇や気質の違いから、貧しく正しい者が後に幸せになるという、まじめな話なら、かえって日本のほうに多い。それが変わって滑稽な話になった順序も、むしろこちらでこそ詳しくたどることができる。しかも、一方が他方を学んだということは、実はまだ少しも明らかではない。

    今のところ、私たちがほぼ安心して言えるのは、次のことである。血を分けた兄弟、縁があって連れ添うおじいさんとおばあさん、あるいは家を並べて住む二組の老夫婦の間に、これほど裏表のはっきりした心がけの善悪と、それに伴う運不運があったというのは、いくら素朴な昔の人々でも、大笑いせずには聞けないほどの誇張である。したがって、この部分はとくに早くから、後世の語り手の空想のままに、次第に笑い話へ変わっていく傾向を備えていた。

    笑い話は近代になって非常に数が増え、中には実際の経験から生まれたものもあるように考えられている。しかし、よく見ると、たいていは古い根を持つものばかりで、登場人物の数も少ない。変化といっても、優れた者の成功と劣った者の失敗とを、いくらでも耳新しく語り替えてきたにすぎなかったようである。しかも、その新しい趣向さえ、必ずしも毎回独創されたとは限らず、中には、すでにあるものを転用したり、つなぎ合わせたりした場合もあったことを、黄金の糞をする黒猫の話などが推測させる。いわゆる金の卵の伝説は、もはや日本には痕跡を残していないが、その伝説と無関係に、この空想はおそらく生まれなかっただろう。だから今日、もとの大まじめな形が仮になくなっていても、また、まれに外国にも同じ型が伝わっていても、なお、笑い話が最初から笑い話としてこの世に現れたとは考えられない。それは童話の場合もまったく同じである。つまり、物語というものは成長したのである。成長したからこそ、いつ'

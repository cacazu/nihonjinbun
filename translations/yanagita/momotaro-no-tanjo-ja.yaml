  section: 隣の寝太郎／山田の露・妻に助けられて
  original: 姫も亦優れた歌人であつて、後に山田村の大旱りの時に、歌を詠じて雨を降らせたことがあるといふから、卽ち亦梅雨井の口碑を背景として、成長した說話であつたことがわかるのである。說話文學の系統同異に關しては、從來人によつて思ひ〳〵の意見が立てられて居る。私は力めてさういふ水掛論の連衆に加はることを避けて居るが、この山田白瀧の一例に至つては、たとへ人の名や歌の文句が是だけちがつて居らうとも、それだから別種のものだと言ひ得る人は無く、又はくそ鳥やもくぞの下の方が、古くから有つたのだといふ者もよもやあるまい。だから我々の採集は常に斯ういふ辯證を絕する境まで、事實の確認を持つて來る必要があると思つて居る。但し話法の新たな變化といふことは、必ずしも其中に保存せられる古い分子の減少の度とは、比例しなかつたことも考へて置かねばならぬ。三人の下男が三段に其望みを語つて、その最後のものが殊に重要であり又適切であつたといふ點は、兵庫踊の「山田の露」からは旣に落ちて居たやうだが、是などは確かに古い形である。息子が三人あつて末の子のした事は最も大きく、姉仲二人の娘は蛇の聟入を拒絕して、末の娘のみが父の教へに從うたといふ類の話は、我々の昔話には數限りも無くくり返され、たとへば米倉法師のやうなおどけ切つた笑話にも、尙三つの願ひ事は興味を濃かにする手段として利用せられて居る。是が年久しい慣例のまゝに、後に山田男の妻問にも應用せられたか。もしくは以前には聽衆の心を統一する爲に、あらゆる說話の主人公は、常に二人の介添を前に立てて出て來たものか。はた又水の神の處女を妻とする此說話が、特に斯ういふ形を以て語らるゝを習ひとしたのが、偶然に閑の多い田舍の夜話だけに、以前の面影を留めることになつたものか。遠く離れた奧羽九州の實例が、尙數多く集積せられた上で無いと、我々は三者何れとも之を斷定することを許されぬのである。人が幸ひに信じてくれる故に、勝手放題な現在の見込を言つて聽かせ、後で誤つて居ると知つても知らぬ顏をして居るといふことは、私などにはとても出來ない藝當である。妻に助けられて丹生山田の千年家の家傳には、又天國の寶劍の話があつた。近世の歌舞伎の聯想からいふ
  translation: '……姫もまた優れた歌人で、後に山田村が大干ばつに襲われたとき、歌を詠んで雨を降らせたことがあるという。したがって、これも梅雨井の言い伝えを背景に成長した説話だった、とわかるのである。説話文学の系統が同じか違うかについては、従来、人によって思い思いの意見が立てられている。私はできるだけ、そうした水掛け論の仲間に入るのを避けている。しかし、この山田白瀧の例については、たとえ人名や歌の言葉がこれほど違っていても、それを理由に別種だといえる人はいないだろう。また、「くそ鳥」や「もくぞの下」のほうが昔からあったという人も、まさかいないだろう。だから私たちの採集は、いつも、こうした議論の余地がなくなるところまで、事実の確認を進める必要があると思っている。

    ただし、語り方の新しい変化は、必ずしも、その中に保存された古い要素がどれだけ減ったかということと、比例してはいなかったことも考えなければならない。三人の下男が三段階で願いを語り、最後の願いがとりわけ重要で適切だった、という点は、兵庫踊の「山田の露」からはすでに抜けていたようだが、これは確かに古い形である。息子が三人いて、末の子のしたことがいちばん大きかったとか、上と真ん中の娘は蛇の婿入りを断り、末の娘だけが父の教えに従った、といった話は、私たちの昔話に数えきれないほど繰り返されている。たとえば米倉法師のように、徹底しておどけた笑い話でも、三つの願いごとは、面白さを深める手段として使われている。

    これが長年の慣例のまま、後から山田男の求婚にも応用されたのだろうか。それとも以前は、聴衆の心を一つにするため、あらゆる説話の主人公が、いつも二人の付き添いを先に立てて登場したのだろうか。あるいは、水の神の乙女を妻にするこの説話が、とくにこうした形で語られる習わしだったものが、たまたま、時間にゆとりのある田舎の夜話にだけ、昔の面影を残したのだろうか。遠く隔たった奥羽や九州の実例が、もっと数多く集まらないかぎり、私たちは、この三つのどれだとも断定できない。人がありがたいことに信じてくれるからといって、今の勝手な見込みを好き放題に語り、後で誤りだとわかっても知らん顔をしている、などという芸当は、私にはとてもできないのである。

    妻に助けられて

    丹生山田の千年家の伝承には、天国の宝剣の話もあった。近世の歌舞伎から連想すると、……'
  notes:
  - 末尾はscan170冒頭に続く。
  - 天国は刀に関わる固有名で、次scanの「アマグニ」に合わせて理解する。

  section: 瓜子織姫／七 瓜子姬の敵
  original: ることが困難ではあるが、少なくとも近い我々の祖先が是をどう考へて居たかといふ迄は、今後の採集によつて尋ね知ることが出來る。然らば其アマノジヤクは何者であつたらうか。我々の同志者には、之について豫め學者の說明を聽かうといふやうな希望もあるらしいが、それは不用心なことだから是非諫止したい。アマノジヤクを知らうと思へば、アマノジヤクの口碑を集積し、比較して見るより他の途は無い。現在でも旣に大分明らかになつて居ると思ふが、要するにアマノジヤクは斯んな處へ出て來さうな魔物であつた。意地が惡くて常に神に逆らふとはいふものの、固より神に敵する迄の力は無く、しかも常に負ける者の憎らしさと可笑味とを具へて居た。恐らくは善神惡神の二元觀から出たもので無く、寧ろ灰蒔き話の鄰の爺などと同じく、神の正しさと最後の勝利とを鮮明に理解せしめる爲に、假設せられたる對立者であつて、神を神人が扮裝して說明した時代には、是も今一人のワキ役によつて代表せられ、それ故に人は漸次に其實在を感じ始めたのであらう。諸國の古い神社の言ひ傳へを見ると、神の事蹟は大抵は征服であつた。其敵を普通には鬼と謂ひ、鬼も亦後には其御社に仕へて居る。卽ち大昔火闌降命が契約せられし如く、永く俳優の技を以て、其屈從の狀態を公示しようとしたことを意味するのであつた。アマノジヤクが庚申樣の足の下に踏まれて居るなども、其起原は亦是と一つであつて、謂はば瓜子姫の苦心經營を細叙する爲に、特に作り設けられる相手の名と考へてよかつたのである。我々の集めて見た十一の例の中で、奧州の三話(二、三、四)は是を山母と謂ひ、又他の一つ(七)では山姥がやつて來たことになつて居る。同じ陸中でも和賀膽澤の三話(一、五、六)は、出雲石見と同樣に何れも是をアマノジヤクと謂ひ、信州下水內の例は次の樣になつて居る。瓜姫は段々成長して、非常に機を織ることが上手になつた。每日チンカラコンカラヒツピヨンスと、拍子よく機を織つて居た。丁度其裏の家に、意地の惡いアマンジヤクといふ女の兒があつた。爺と媼との出た留守に、瓜姫をだまして其家に入つて、出居の脇の梨の木の所まで連れ出し、自分の汚れた衣裳を瓜姫に着せて、梨の木の下に縛り付け、自分は(瓜姫の)美しい衣裳を着て居た云々。ところが爰にたつた一つ非常にをかしいのは、國民童話に載せた日向國の例で、是だけは「村で惡まれ者の無理助といふ男」となり、さうして只梨の木から落ちて死んだことになつて
  translation: 'るのは難しい。しかし、少なくとも、そう遠くない時代の祖先が、これをどう考えていたかというところまでは、今後の採集によって尋ね知ることができる。

    では、そのアマノジャクとは何者だったのだろうか。私たちの仲間には、この点について、あらかじめ学者の説明を聞きたいという希望もあるらしい。しかし、それは不用意なことだから、ぜひ思いとどまってほしい。アマノジャクを知ろうとするなら、その伝承を集め、比較するほかに道はない。

    すでにかなり明らかになっていると思うが、要するに、アマノジャクは、こういう場所へ出てきそうな魔物だった。意地悪で、いつも神に逆らうとはいっても、もちろん神に対抗できるほどの力はない。しかも、いつも負ける者の、憎らしさとおかしみを備えていた。おそらく善神と悪神という二元的な観念から出たものではなく、むしろ灰蒔きの話の隣のお爺さんなどと同じく、神の正しさと最後の勝利を、鮮やかに理解させるため、仮に設けられた対立者だった。神に仕える人が神の姿に扮して、その事績を説明した時代には、これも、もう一人の脇役によって表され、そのため人々は次第に、その実在を感じ始めたのだろう。

    諸国の古い神社の伝承を見ると、神の事績は、たいてい征服である。その敵を普通は鬼と呼び、その鬼も、後にはその神社に仕えている。つまり、大昔、火闌降命が約束したように、末長く俳優のわざによって、服従する姿を人々に示そうとしたことを意味していたのである。アマノジャクが庚申様の足の下に踏まれているのも、その起源は同じである。いわば瓜子姫の苦心の過程を詳しく語るために、特に作り設けられた相手の名と考えてよいのである。

    私たちが集めた十一例のうち、奥州の三話（二、三、四）は、これを「山母」といい、ほかの一例（七）では「山姥」が来たことになっている。同じ陸中でも和賀・胆沢の三話（一、五、六）は、出雲・石見と同様、いずれもアマノジャクと呼ぶ。信州下水内の例は、次のようになっている。

    瓜姫は次第に成長し、たいへん機織りが上手になった。毎日、チンカラコンカラヒッピョンスと、調子よく機を織っていた。ちょうど、その裏の家に、意地の悪いアマンジャクという女の子がいた。爺婆が出かけた留守に、瓜姫をだまして家に入り、居間の脇の梨の木のところまで連れ出した。自分の汚れた衣装を瓜姫に着せて梨の木の下に縛りつけ、自分は瓜姫の美しい衣装を着ていた、というのである。

    ところが、ここにたった一つ、非常に奇妙なのが、『国民童話』に載る日向国の例だ。これだけは、「村で嫌われ者の無理助という男」となっており、しかも、ただ梨の木から落ちて死んだことになって'

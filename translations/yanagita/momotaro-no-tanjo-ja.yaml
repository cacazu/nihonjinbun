  section: 狼と鍛冶屋の姥
  original: 釜の蓋が見えなくなる。それから山に入つて怪物に出逢ひ、鐵砲を打つたがはね返るばかりで、終に有るだけの丸を皆使つてしまつたら、何やらちやりんと音がして地に投棄てたものがある。そこで取つて置きの護身の丸をこめて改めて打つと、そこには昨夜の飼猫が殪れて居り、又紛失した茶釜の蓋も落ちて居た。丸めた彈の數を算へて置いて、それだけを打たせてしまつてから飛掛らうとして居たのであつた。早川孝太郞君の「猪·鹿·狸」には、三河にあつたこととして此話を傳へて居るが、是と略、似た例は甲斐昔話集にもある。二十歲になる古猫が片眼を潰されて主人を怨み、彈丸を作つて居るのを見て居て一度每にうなづいて居る。是も十三の用意の丸を打放すと、もう安心して居るので別の護り彈を以て射倒した。死骸の脇に我家の茶釜の蓋が轉がつて居たといふのである。能登の八ヶ崎のどうの川のちつきん被りといふ怪物の話は、鹿島郡誌にも詳しくは載せて居らず、又チツキンといふのはどんな物であつたかわからぬが、與助惣左衞門の拔いた刀鞘は竹でも身は本ものやといふ偶謠が傳はつて居るから、是だけは別にもう一本の刀を隱して置いて斬つたといふ樣な話があつたのかと思ふ。九州では近頃出た梅林君の豐前民話集に、釣鐘を冠つて銃丸を防いだ狸の話といふのが是であつた。讃岐では佛生山の町の傳說に、昔關の池の大蛇を退治に行く勇士が、矢の根鍛冶に矢を誂へると、大蛇が美しい女になつて其矢の數を聞きに來たといふのは、熊野の一本だたらが鳥に化けて飛んで來て、刑部左衛門の箭を算へたといふ話と似て居る。是も釣鐘を冠つて八十八本までは箭を防いだが、いよ〳〵それを脫いで飛掛らうとした時に、金銀の隱し矢といふので射取られた。それで國分寺の鐘には鏃の痕が有るのだとも謂つて居る。果然この失敗した策略は土佐の狼婆の發明では無く、寧ろ此方は脇差で斬下されて尙疵を負うたといふ點に、幾分か取つて付けたやうな不細工ささへ目に著くのである。四　猫と狐と狼しかも麓の佐喜濱の町に、もしも鍛冶屋の古屋敷と稱するものが無かつたら、果して此挿
  translation: '釜のふたが見当たらなくなる。その後、山へ入って怪物に出会い、鉄砲を撃ってもはね返されるばかりで、とうとう持っている弾を全部使ってしまった。すると、何かをちゃりんという音とともに地面へ投げ捨てた。そこで取っておいた護身用の弾を込め、改めて撃つと、昨夜の飼い猫が倒れており、なくなった茶釜のふたも落ちていた。猫は丸めた弾の数を数えておき、その数だけ撃たせてから飛びかかるつもりだったのである。

    早川孝太郎君の『猪・鹿・狸』では、三河であったこととしてこの話を伝えているが、ほぼ同じ例が『甲斐昔話集』にもある。二十歳になる老猫が、片目をつぶされて主人を恨み、弾丸を作るのを見ながら、一回ごとにうなずいている。これも用意した十三発を撃ち終えると猫はもう安心していたので、別のお守りの弾で撃ち倒した。死骸のそばに、自分の家の茶釜のふたが転がっていたというのである。能登の八ヶ崎のどうの川にいた「ちつきん被り」という怪物の話は、『鹿島郡誌』にも詳しく載っておらず、チツキンがどのような物かもわからない。ただ、

    与助惣左衛門の抜いた刀、

    鞘は竹でも刃は本物だ、

    という歌が伝わっているので、この例だけは別にもう一本の刀を隠しておいて斬ったというような話があったのかと思う。九州では、近ごろ出た梅林君の『豊前民話集』にある、釣り鐘をかぶって銃弾を防いだ狸の話が、この型に当たる。讃岐の仏生山の町の伝説には、昔、関の池の大蛇を退治しに行く勇士が、鏃を作る鍛冶屋に矢を注文すると、大蛇が美しい女になって矢の数を聞きに来たという。これは熊野の一本だたらが鳥に化けて飛んで来て、刑部左衛門の矢を数えた話に似ている。この大蛇も釣り鐘をかぶり、八十八本までの矢を防いだが、いよいよ脱いで飛びかかろうとしたときに、「金銀の隠し矢」で射止められた。そのため国分寺の鐘には鏃の跡があるともいう。やはり、この失敗した策略は土佐の狼婆が考え出したものではない。むしろ土佐の話は、脇差で斬り下ろされてなお傷を負ったという点に、いくらか取って付けたような不器用ささえ目につくのである。

    四　猫と狐と狼

    しかし、ふもとの佐喜浜の町に、もし鍛冶屋の古屋敷と呼ばれるものがなかったなら、果たしてこの挿'
  notes:
  - 「ちつきん被り」「どうの川」は原文の表記を保持。著者自身も「チツキン」の意味は不明と述べる。

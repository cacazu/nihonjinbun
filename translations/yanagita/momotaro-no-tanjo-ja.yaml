  section: 狼と鍛冶屋の姥
  original: は喉の骨を拔いて遣つたといふ例であつた。日本では不思議にそれが家々の傳說に化さうとして居る。澤山の例は記憶して居ないが、近頃出版せられた飛驒風物記の中にも、益田郡竹原村御厩野の今井彌左衞門方で、延寶元年の出來事であつたといふ。或朝下女が水を汲みに出ると、一疋の老いたる狼が現はれて頻りに憐みを乞ふ樣子をする。主人立出でて之を見るに、喉に何かの骨を立てて苦しむらしい。仍て手拭を手に卷いて口中に入れ、之を除いて遣つたら還つて行つた。それから十數日後の夜、門口に不思議な音がするので出て見たところ、先日の狼が轡を前に置いて額づいて居る。あの時の禮であらうがそれにも及ばぬにと言へば、程無く何れへか姿を隱したと謂つて、今に此家には其轡を持傅へて居るとある。同郡中原村の燒石與五郞が妻は、同じ樣な事で狼を救うたところが、其禮に六尺餘りの鐵の鎖を殘して行つたとは妙な音物である。兎に角に今から二百五六十年前までの狼は、是ほどにも律義懇切なものとして信用せられて居た土地があつた。私は土佐の產杉の化け狼の傳說を、案外新らしい變化の如く考へようとする理由は、こんな所にもあるのである。以前「山の人生」と題する小著に於て、旣に片端は述べたこともあるが、人と狼との昔の交際は、必ずしもこわもてとか機嫌取りとかいふ程度の、輕薄なものでは無かつたのである。其中でも興味のある古い仕來りは、狼の產見舞と名けて、一年に一度食物を器に入れて、山に持つて行つて狼の居りさうな處に置いて來ることであつた。是が狼に逢って手渡しするのでも無ければ、又實際に安產のあることを確かめての上でも無かつたのは、少しく其言ひ傳へを注意して見ればわかる。東京の近くで有名なものは、武州秩父の三峯さんであるが、是は三峰山誌にも、又十方菴遊歷雜記三篇中卷にも詳しく出て居て、近頃まで行はれて居た式であつた。或夜狼の異樣に吠える聲を聞くと、それで御產の有つたことを知つて、翌日は見舞ひに行くのだといひ、又山中に特に淸淨に草木を除いた一地の有るを見付けて、そこに注連を張つて、酒と食物を供して來るともいひ、是を又御產立の神事とも謂つて居た。新篇武藏風土記稿卷八十、三峰村大木の行屋堂の條には、是を御犬祭と名けて每月十九日に行ふともある。十九日は知つて居る人も有らうが、子安講とも又十九夜講とも謂つて、村々の女人が子安神を祀る日であつた。是が後には一年に一度になつただけである。西國の方では如何であるかまだ聽いて居ないが、狼の產見舞は東日本では普通であつた。
  translation: 'は、喉の骨を抜いてやったという例だった。日本では不思議なことに、それが家々の伝説になろうとしている。たくさんの例は記憶していないが、近ごろ出版された『飛驒風物記』にも、益田郡竹原村御厩野の今井弥左衛門の家で、延宝元年にあったという出来事が載っている。ある朝、下女が水くみに出ると、一匹の老狼が現れ、しきりに哀れみを求める様子をする。主人が出て見ると、喉に何かの骨を立てて苦しんでいるらしい。そこで手に手ぬぐいを巻き、口の中へ入れて取り除いてやると、狼は帰っていった。十数日後の夜、入口で不思議な音がするので出てみると、先日の狼が轡を前に置いて頭を下げていた。「あのときのお礼だろうが、そんなことをしなくてもよいのに」と言うと、ほどなくどこかへ姿を消したという。今もこの家にはその轡が伝わっているとある。同じ郡の中原村の焼石与五郎の妻も、同じようなことで狼を助けたところ、お礼に六尺余りの鉄の鎖を置いていったというのは、妙な贈り物である。ともかく今から二百五、六十年前まで、狼がこれほど律義で親切なものとして信頼されていた土地があった。私が土佐の産杉の化け狼伝説を、案外新しい変化ではないかと考える理由は、このような点にもある。

    以前、『山の人生』という小著でも、すでに一端を述べたことがあるが、昔の人と狼の交わりは、必ずしも強面で威圧したり機嫌を取ったりする程度の、浅いものではなかった。その中でも興味深い古い習わしは、「狼の産見舞」と呼び、年に一度、器に食べ物を入れて山へ持って行き、狼のいそうな場所に置いてくることだった。狼に会って手渡すわけでもなければ、実際に無事な出産があったと確認して行うわけでもなかったことは、伝承に少し注意すればわかる。東京の近くで有名なのは武蔵秩父の三峰様で、『三峰山誌』にも『十方庵遊歴雑記』三篇中巻にも詳しく載っており、近ごろまで行われていた儀礼だった。ある夜、狼の異様な吠え声を聞くと、それで出産があったと知って翌日見舞いに行くともいい、また山中で、特別に清らかに草木を取り除いた場所を見つけ、そこへ注連縄を張り、酒と食べ物を供えてくるともいう。これを「御産立の神事」とも呼んでいた。『新篇武蔵風土記稿』巻八十、三峰村大木の行屋堂の条には、「御犬祭」と称して毎月十九日に行うともある。知っている人もあるだろうが、十九日は「子安講」あるいは「十九夜講」と呼び、村々の女性が子安神を祭る日だった。これが後に、年一回になっただけなのである。

    西日本ではどうだったかまだ聞いていないが、狼の産見舞は東日本では一般的だった。'
  notes:
  - 延宝元年は1673年。「今から二百五、六十年前」は著者執筆時を基準とする。
  - 「轡」は馬の口に装着する馬具。「下女」は当時の女性奉公人の呼称。

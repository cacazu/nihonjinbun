- id: mmt-053-01
  scan: 53
  section: 海神少童
  original: '長して行つたのである。俵藤太が龍宮に行つて、貰つて來たといふ二人の心得童子の如き

    も、留まつて秀鄕の後裔たる野州の佐野氏に仕へ、龍二龍三郞と稱したといふ話がある。其

    子孫だといふ者が永く佐野の町に住し、家傳のひび藥を賣り又紙漉を業として居つた。先祖

    が龍宮の子供だから水を冷たがらず、寒中手足を水に浸して紙を漉いても平氣であつたとい

    ふわけである。是などは無論新らしい敷衍であり、又昔話の二度目の土着であつたが、兎に

    角に我邦古來の神子譚が、單に一身の榮達を說くに止まらず、いつも或家の歷史と結び付け

    て、語り傳ふることを特徴としなかつたならば、斯うした空想も突如としては生れなかつた

    らう。卽ち變化は旣に始まつて居るにしても、まだ此部分に於ては若干の昔の姿を留めて居

    るのである。

    それから尙一つ、是も消えなんとして僅かに殘つて居るものは、神に愛せられる者の約束

    とも名くべき點であつた。何故に或家或一人の單純な親爺だけが、異常なる童兒又は稀有の

    珍寶を獲て、忽ち長者となることが出來、他の者はすべて失敗してしまつたか。もとは此部

    分が說話の特に大切なる骨子、卽ち最も牢く記憶して自分も實行しなければならぬ教訓であ

    つたらうと思ふが、今日はもうそれが如何にも合點の行かぬ話になつて居る。桃太郞その他

    の著名な童話には、既に其點を脫落したものもある。我々研究者に取つては、實にあぶない

    瀨戶際であつた。是を忘れてしまつて居たならば、今よりももつと勝手放題な解釋が成立ち、

    又盲從せられて居たかも知れぬのだが、この辛うじて殘り傳はつて居た要點が、一見不可解

    に見えるといふことも、寧ろ疑惑を刺戟する便りとなつて居る。前に列記した五つの昔話に

    も見える如く、曾ては普通の人ならば格別重きを置かぬこと、どうだつてもよかりさうに思

    はれることを、殆と馬鹿正直に守つて居た老翁だけが惠まれ、それに銘々の私心を挾んだ者

    は皆疎外せられたことになつて居た。しかも世の中が進むといふのは、さういふ人間の智慮

    分別が働くことであつた故に、年を經るまゝにいよ〳〵昔話は解し難い教訓となり、末には

    たゞ滑稽なる意外とさへなつて、略してしまはなければ之を面白く改めようとしたのである。

    ハナタレ小僧樣の例でいふならば、爺は每日々々海老の膾を買求めて、上げて居ればよかつ

    たのであり、黑猫の話でいふと小豆の分量は五合よりも多からず、又少なからずであればそ

    れでよかつたのであるが、神の指圖に素直で無い者に、何故さうしなければならぬのか疑は'
  translation: 'がっていったのである。俵藤太が竜宮へ行ってもらってきたという二人の心得童子にも、秀郷の子孫である野州の佐野氏のもとにとどまって仕え、竜二・竜三郎と名乗ったという話がある。その子孫だという人々が長く佐野の町に住み、家伝のひび薬を売るとともに、紙すきを仕事としていた。先祖が竜宮の子供なので水を冷たがらず、寒中に手足を水へ浸して紙をすいても平気だった、というのである。もちろん、これは新たに話を広げたものであり、また、昔話が二度目に土地へ根づいた例でもあった。しかし、日本に古くからある神の子の物語が、ただ一人の立身出世を語るだけでなく、いつもある家の歴史と結び付けて語り伝えられることを特徴としていなかったなら、こうした空想も突然には生まれなかっただろう。つまり、変化はすでに始まっていても、この部分には、まだいくらか昔の姿が残っているのである。

    さらにもう一つ、これも消えかけながら、わずかに残っているものがある。それは、神に愛される者が守るべき約束とでも呼ぶべき点だった。なぜ、ある家のある一人の素朴なおじいさんだけが、不思議な子供やめったにない珍しい宝を得て、たちまち長者になることができ、ほかの者は皆失敗してしまったのか。もとはこの部分が、物語の中でもとくに大切な骨組み、すなわち、最もしっかり記憶して、自分でも実行しなければならない教訓だったのだと思う。しかし今日では、これはいかにも納得のいかない話になっている。桃太郎などの有名な童話には、すでにこの点の抜け落ちたものもある。私たち研究者にとっては、実に危うい瀬戸際だった。これが忘れ去られていたなら、今よりもっと勝手気ままな解釈が成立し、また人々がそれに盲従していたかもしれない。だが、辛うじて伝わり残ったこの要点が、一見不可解に見えることも、むしろ疑問を呼び起こす手がかりになっている。

    前に挙げた五つの昔話にも見えるように、かつては、普通の人ならとくに重視しない、どうでもよさそうに思われることを、ほとんど馬鹿正直に守っていた老人だけが恵まれ、そこへ自分の都合や欲を持ち込んだ者は皆、恵みから遠ざけられたことになっていた。しかし、世の中が進むというのは、そうした人間の知恵や分別が働くことでもあった。そのため、年月がたつにつれて、昔話はいよいよ理解しにくい教訓となり、最後には、ただ滑稽な意外事にさえなった。それで、省いてしまうのでなければ、おもしろく作り替えようとしたのである。ハナタレ小僧様の例なら、おじいさんは毎日海老のなますを買い求めて差し上げていればよかった。黒猫の話なら、小豆の量は五合より多くも少なくもなければ、それでよかった。しかし、神の指図に素直に従わない人からは、なぜそうしなければならないのかと疑わ'

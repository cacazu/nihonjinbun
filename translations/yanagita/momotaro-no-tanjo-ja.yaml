  sequence: 114
- id: mmt-110-01
  scan: 110
  section: 瓜子織姫／黃金の瓜
  original: '歸つて男兒を生んだ。其子がわけを聞いてから一心に學問をする。さうして或日色々の色紙

    を買つて來て、綺麗な花を吹いて殿樣の御殿に行き、黃金の生る吹花を賣らうと呼んだ。是

    も殿樣がをかしなことを言ふと思つて念を押すと、はい屁をひらない人が手に持てば、必ず

    此花に黃金がなりますと答へた。殿樣は笑つて、人間に屁をひらぬ者もあるまいと言ふ。然

    らばどうして私の母親ばかり、そんな道理の無い御咎めを蒙つたかと言ふので、如何にも尤

    もなことであり、それで又我子であることを知つて、ちやうど世繼が無いのですぐに母子を

    召出して、跡目に直したといふことになつて居る(紫波郡昔話一七五頁)。

    (七)最後に尙一つ、是は沖繩で昔あつた史實として傳へられたものであるが、それを略

    記錄のまゝに爰に引用して見ると、久高の島の外間根人の二女思樽、巫女となつて禁中に召

    され、容色佳麗なるが故に內宮に入つて王夫人となる。諸妾嫉忌して敢て語を交へず、たま

    たま思樽が王の御前に於て謬つて放屁したのを知つて、相集まつて常に笑ひ事にしたので、

    懷胎の身ながら王宮にも居り難く、暇を告げて島に還つて來た。巳に產月に臨んで意に思へ

    らく、是は聖王の胤なれば穢れたる處に產むは恐れありと、別に一座を設けてそこに一男を

    降誕し、名けて思金松兼と曰つた。長成すること七歲、屢、母に向つて父は何人ぞと問ふの

    で、包む能はずして事の由を語り、汝は海島に生れて衣服容貌も京師に像ざれば、假令天顏

    を拜睹せんと願ふとも、志を遂ぐる能はじと告げたれば、思金松兼は之を聽き終つて、卽ち

    伊敷泊といふ濱に出て、東方に仰ぎ向うて深く祈誓を籠むること七日であつた。その七日目

    の明方に當つて、黄金の一物あつて大なる光輝を發し、波のまに〳〵浮び來る。衣の袖を展

    べて之を撈へばそれは黄金の瓜であつた。そこで大歡喜して其瓜を懷に收め、直ちに母に告

    げて都に上り禁城の門に立つて謁を乞うた。役人等は彼が髪赤く衣粗なるを見て、恠み且つ

    制したけれども、思金松兼は何の憚る所無く威儀蕩々として進み入り、終に御前に召出され

    て懷の瓜を取出して獻上した。曰く此瓜は國家の至寶、世界稀有の物なり。けだし天甘雨を

    降らし肥土已に濕ふの時、特に未だ屁を放たざる女をして此種を播かしめたまはば、則ち蕃

    衍茂盛して實を結ぶこと甚だ夥しからんと。王聽いて大に笑ひたまひ、人の此世に生るゝ誰

    か屁を放たざらんやとありければ、思金兼松は其言葉に附いて、人屁を放つあるも何の咎か

    有るべきと奏上した。王は其語によつて心を動かされ、更に内院に呼入れて備さに事の由を'
  translation: '帰って男の子を産んだ。その子は事情を聞くと、一心に学問をした。そしてある日、さまざまな色紙を買ってきて、美しい吹花を作り、殿様の御殿へ行って、「黄金のなる吹花を売ります」と呼ばわった。これも殿様が変なことを言うと思い、念を押すと、「はい、おならをしない人が手に持てば、必ずこの花に黄金がなります」と答えた。殿様は笑って、「人間におならをしない者などいないだろう」と言う。「それなら、どうして私の母だけが、そのような理不尽なおとがめを受けたのでしょう」と言ったので、もっともなことだと納得した。また自分の子だともわかったので、ちょうど世継ぎがなかったこともあり、すぐ母子を呼び出して跡継ぎにした、と語られている（『紫波郡昔話』一七五ページ）。

    （七）最後にもう一つ。これは沖縄で昔実際にあったこととして伝えられたものだが、ほぼ記録のとおりにここへ引いてみる。

    久高島の外間根人の次女、思樽は、巫女となって王宮へ召された。美しい容貌のため後宮に入り、王夫人となった。他の妾たちは嫉妬し、まったく口をきかなかった。たまたま思樽が王の前でうっかりおならをしたことを知ると、集まってはいつも笑いものにしたので、身ごもっていたが王宮にも居づらくなり、暇を告げて島へ帰ってきた。出産の月が近づき、「これは尊い王の子だから、汚れた場所で産むのは恐れ多い」と考えて、別に産所を設け、そこで男の子を産み、思金松兼と名づけた。

    七歳に育つと、しきりに母へ「父は誰ですか」と尋ねた。母は隠しきれず事情を語り、「おまえは海の島で生まれ、服装も見た目も都の人とは違う。たとえ王のお顔を拝みたいと願っても、思いを遂げられないだろう」と告げた。思金松兼は聞き終えると、すぐ伊敷泊という浜へ出て、東を仰ぎ、七日間、深く祈った。七日目の明け方、金色のものが大きく光を放ち、波に漂ってきた。袖を広げてすくい上げると、それは黄金の瓜だった。大喜びで瓜を懐に収め、すぐ母に告げて都へ上り、宮城の門に立って面会を願った。役人たちは、赤い髪と粗末な衣服を見て怪しみ、止めようとした。しかし思金松兼は何もはばからず、威儀堂々と進み、ついに王の前に召し出され、懐の瓜を取り出して献上した。

    「この瓜は国の宝、世にもまれなものです。天から恵みの雨が降り、肥えた土が潤ったとき、まだおならをしたことのない女に種をまかせれば、盛んに茂り、たいへん多くの実を結ぶでしょう。」

    王は聞いて大笑いし、「この世に生まれた人で、おならをしない者などいるだろうか」と言った。すると思金兼松はその言葉を受け、「人がおならをしても、何の罪がありましょう」と申し上げた。王はその言葉に心を動かされ、さらに奥へ呼び入れて、詳しく事情を'

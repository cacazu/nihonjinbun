  original: 複雜にして長くする爲に、追々に鄰の領分に在るものを採入れたか。細かく比較して行くうちには、三つの原因の何れが主であつたかを、やがて明かにし得る時が來ることと思ふ。何にもせよ我々の神子信仰を基礎とした一つの說話が、至つて僅かしか外國の影響は受けずに、過去千數百年の間國民の眼の前に於て、成長し分化し且つ互ひに著しい差異を生じつゝありしことは事實であつて、それを促したる最も大いなる動力は、特に職分として之に參與した者の氣質教養、乃至は生活の必要如何であつたらしいのである。斯ういふ事情は形こそちがヘ、何れの民族の何れの說話にも、當然に有つた筈である。それを省みないで出し拔けに末と末とを比べて見ようとすれば、其結論の屢々空中樓閣に歸し、何度でも顛覆すべきは無論である。然るにその外國に於ける學說の競爭を後生大事と觀望して、少しでも目下羽振りのよささうな者の後に附かうとするなどは、誠にはや氣の知れぬ筒井順慶である。八信州の信の宮そこで立戾つてもう一度、「物草太郞」の原の形といふことを考へて見よう。私がこの草子の筆者の文藝能力を大割引して、それが主として信州出の法師ばらの口傳に成るものの如く推測したのは、理由は無論最後の一節に穗高大明神の示現を說いて居る點に存するが、さりとて此說話の故鄕が必ず有明山麓の村であり、若くは發源がこの舊社の信仰であると見たのでは無かつた。それよりも寧ろ此異常童子が、善光寺如來の申し兒であつたといふ條に、眼を著けなければならなかつたかも知れぬのである。といふわけは單に其點が話の芽であつたといふのみで無く、夙に色々の旅の法師、殊に盲人が此大寺の下に、庇護せられて居た形跡があるからであつて、諏訪と善光寺との年久しい對立なども、中間に多數の宗教的漂泊者を置いて考へて見ないと、所謂地理と歷史だけでは說明することが六つかしいと思ふ。尤も此關係は必ずしも同國たるを要せず、或は江州大岡寺の觀音堂の爲に、甲賀三郞が諏訪の明神と示現したことを說いたやうな例もあるが、普通には遠く他國に出て居る職業的話し家の方が、どうしても故鄕の著明なる神々を引合ひに出す場合が多かつたことと思はれるのである。兎に角に說話がもと京都其他の遠國に發生したものであつたら、善光寺の如來の申し兒とまでは空想し得たか知らぬが、筑摩の郡あたらしやの鄕や、穗高明神を說き立てることは出
  translation: '……複雑にして長くするため、次第に隣の分野のものを取り込んだのだろうか。細かく比較していくうちに、この三つの原因のどれが主だったのかを、やがて明らかにできる時が来ると思う。いずれにせよ、私たちの神の子への信仰を基礎にした一つの説話が、外国の影響をほんのわずかしか受けず、過去千数百年のあいだ、国民の目の前で成長し、分かれ、互いに著しく違う姿になってきたことは事実である。それを促した最大の力は、とくに職業としてそれに関わった人々の気質や教養、あるいは暮らしのために何を必要としたか、ということだったらしい。こうした事情は、形こそ違っても、どの民族のどの説話にも当然あったはずである。それを考えず、いきなり枝分かれした末端同士を比べれば、その結論がしばしば根拠のない空論になり、何度でもひっくり返されるのは当然だ。ところが、外国での学説の競争を後生大事に眺め、少しでも今は勢いがありそうな者についていこうとするなど、まったく、何を考えているのかわからない筒井順慶である。

    八　信州の信の宮

    そこで戻って、もう一度『物草太郎』のもとの形を考えてみよう。私がこの草子の作者の文芸的能力を大きく割り引いて、主として信州出身の法師たちの口伝からできたものらしいと推測したのは、もちろん、最後の一節で穂高大明神としての出現を語っているからである。しかしそれでも、この説話の故郷が必ず有明山麓の村で、あるいは起源がこの古い神社の信仰だと見たわけではなかった。それよりもむしろ、この異常な子どもが、善光寺の如来に祈って授かった子だった、という点に目を向けるべきだったのかもしれない。というのは、単にその点が話の芽だっただけでなく、早くからさまざまな旅の法師、とくに盲人が、この大寺院に保護されていた跡があるからだ。諏訪と善光寺の長年の対立なども、両者のあいだに大勢の旅をする宗教者を置いて考えなければ、いわゆる地理と歴史だけでは説明しにくいと思う。

    もっとも、この関係は必ずしも同じ国の中である必要はない。たとえば江州の大岡寺の観音堂のために、甲賀三郎が諏訪明神として現れたことを語った例もある。しかし普通には、遠い他国へ出ている職業的な語り手のほうが、どうしても故郷の有名な神々を話に持ち出すことが多かったのだろう。ともかく、この説話がもと京都など遠方で生まれたものだったら、善光寺如来に祈って授かった子だというところまでは空想できたかもしれないが、筑摩郡の「あたらしやの郷」や穂高明神を持ち出して語ることは、……'
  notes:
  - 冒頭はscan159末尾、末尾はscan161冒頭に続く。
  - 筒井順慶はここでは日和見のたとえとして使われている。申し児は祈願によって授かった子をいう。

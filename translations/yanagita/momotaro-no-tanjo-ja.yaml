  section: 海神少童
  original: れが此方面にばかり、たまさかに保存せられて居たのかも知れぬのである。犬が岩穴の奥から出て來たといふ口碑は、數多く諸國に分布して居る。其中でも是まで最も發生の理由を知るに苦しんだのは、犬に教へられて清き泉を發見したといふ話の、そちこちに傳はつて居ることであつた。沖繩では南山王國の城山の北麓に、嘉手志川といふ有名な大清水がある。昔此土地の人々が飮料の得がたきによつて、何れへか退轉しようと決意して居た時に、岡の茂みの奥から沾れて一疋の犬が飛出したので、そこに泉のあることを始めて知り、永く安住の計を立つるを得たと稱して、今も井の上に在る一つの石を、其犬の靈の宿りとして拜して居る。嘉手志川は卽ち語り井の意であると、解說したものが古い記錄にもある。黄金小犬が金を糞するやうになる以前から、もしくは桃太郞の桃·瓜子姫の瓜が漂うて來るよりもずつと以前から、旣に語り井の清水は湧いて流れて居た。現世の我々はたゞこの一筋の流れを溯つて、遠く人世の水上に尋ね入らうとして居たのである。それが末濁つて徒渉の人ばかり多くなつたことも、亦この學問の實狀とよく似て居る。
  translation: 'れが、この方面にだけ、たまたま保存されていたのかもしれない。

    犬が岩穴の奥から出てきたという伝承は、諸国に数多く分布している。その中でも、これまで、その成り立ちの理由を最も理解しにくかったのは、犬に教えられて清らかな泉を発見したという話が、あちこちに伝わっていることだった。沖縄では、南山王国の城山の北麓に、嘉手志川という有名な大きな湧き水がある。昔、この土地の人々が飲み水を得にくいため、どこかへ移り住もうと決意していたとき、丘の茂みの奥から、体の濡れた犬が一匹飛び出してきた。そのため初めて、そこに泉があると知り、末長く安心して住める見通しを立てられたという。今でも井戸の上にある一つの石を、その犬の霊が宿るものとして拝んでいる。嘉手志川とは、すなわち「語り井」の意味だと解説した古い記録もある。

    黄金小犬が金を糞として出すようになる以前から、あるいは桃太郎の桃や瓜子姫の瓜が流れてくるよりも、ずっと以前から、すでに語り井の清水は湧き、流れていた。今の世に生きる私たちは、ただ、この一筋の流れをさかのぼり、はるか遠い人間社会の源流を尋ねようとしていたのである。その流れが下流で濁り、浅瀬を歩いて渡る人ばかり多くなったことも、また、この学問の実情によく似ている。'
  notes:
  - 冒頭はscan65からの継続。
  - 前のスキャンからの続き

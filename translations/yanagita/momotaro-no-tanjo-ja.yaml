  original: だが、或程度の假定は今だつて成立たぬことは無い。たとへば老媼夜譚(一一三頁)に採錄して居る雀の仇討などは、實は我々の猿蟹合戰と比べて、どちらが轉用だといふことが容易に言へない程に、自然なる話の運び方を示して居る。昔一羽の雀が竹籔に巢をかけて卵を溫めて居た。そこへ奧山の山母が來て、雀雀その卵を一つくれといふ。雀は怖ろしいので一つ遣ると、又一つ又一つと卵をねだつて、最後には其親雀まで引裂いて食つてしまつた。其時たつた一つの卵が巢から轉げ落ちて、籔の中で孵つて大きくなつた。それが何とかして親の讐を取らうと思つて、あつちの稻架から一穗、こつちの稻架から一穗の稻を集めて來て、それで團子をこしらへて脊に負うて、「米の團子の本團子」とふれてあるく。そこへ向ふの方から栃の實が轉がつて來る。それから又針と蟹と牛の糞と臼とが順々に遣つて來て、何れも問答をして雀の企てを聞き、團子を貰つて味方になる。さうして山母の屋形に忍び入つて、敵を打つ手續きは蟹の昔話と全く同じである。此話に對する我々の興味は、第一に蟹が討入の連中に加はつて居ることである。普通の猿蟹合戰では、蟹は一役を分擔して居るだけであるが、こゝの雀は却つて戰闘員を統括して居るのである。第二にはたつた一つの卵の中から生れたといふ點が、古くある竹取翁の一異傳と似通つて居ることである。雀では無いけれども卵から英雄が生れたといふ言ひ傳へは尙他にもある。第三には山母の無法なる誅求と殘虐とが、所謂牛方山姥などと一致した話の型であつて、しかも其山母は留守のうちに敵の忍び込んで居るのも知らず、こゝでも寒い〳〵と謂つて圍爐裏に踏跨がつてあたつて居た。是が又普通の牛方山姥と、猿蟹合戰との共通した點でもあつた。牛を食つた山姥の退治譚は、前にもいふ通り親の讐では無く、其日のうちに被害者の牛方が報復することになつて居るのだが、奥州の三戶郡には又次のやうな一例もあつた。八戶市の奧南新報の昭和七年新年號に、小笠原梅軒氏の踵太郞の童話といふのが出て居る。少し文飾が過ぎて居るが要點だけを抄すると、身持ちの女房が一人で留守をして居る處へ、山姥がやつて來て酒を出せ肴を出せといひ、色々亂暴したあげくに、その女を頭から食つてしまつて歸つて行く。其跡へ夫が戾つて來て見ると、爐のわきに山姥の食ひ剩した女房の踵が落ちて居る。それを大切に紙の袋に入れて引掛けて置くと、或日その袋がかさこそと動くので、怪しんで卸して見たら踵
  translation: '……だが、ある程度の仮説は、今でも立てられないわけではない。たとえば『老媼夜譚』（百十三頁）に採録された「雀の仇討ち」などは、日本の「猿蟹合戦」と比べて、どちらがどちらを転用したのか簡単にはいえないほど、自然な話の運び方をしている。昔、一羽の雀が竹やぶに巣をかけ、卵を温めていた。そこへ奥山の山母が来て、「雀、雀、その卵を一つくれ」という。雀は恐ろしいので一つ与えると、さらに一つ、また一つと卵をねだり、最後には親雀まで引き裂いて食べてしまった。そのとき、たった一つの卵が巣から転がり落ち、やぶの中でかえって大きくなった。その雀は何とか親の仇を討とうと思い、あちらの稲架から一穂、こちらの稲架から一穂と稲を集め、それで団子を作って背負い、「米の団子の本団子」と触れ歩く。すると向こうから栃の実が転がってくる。それから針、蟹、牛の糞、臼が順にやってきて、どれも問答して雀の計画を聞き、団子をもらって味方になる。そして山母の屋敷に忍び込み、敵を討つ手順は、蟹の昔話とまったく同じである。

    この話で私たちが興味を引かれるのは、第一に、蟹が討ち入りの仲間に加わっていることである。普通の「猿蟹合戦」では、蟹は一つの役目を分担しているだけだが、こちらの雀は、むしろ戦闘員を統率している。第二に、ただ一つの卵から生まれたという点が、古くからある竹取の翁の異伝の一つに似ていることである。雀ではないが、卵から英雄が生まれたという言い伝えは、ほかにもある。第三に、山母の無法な取り立てと残虐さが、いわゆる「牛方山姥」などと共通する話の型である。しかも、その山母は留守中に敵が忍び込んでいるのも知らず、ここでも「寒い寒い」といい、囲炉裏をまたぐようにして暖まっていた。これもまた、普通の「牛方山姥」と「猿蟹合戦」に共通する点だった。牛を食べた山姥を退治する話は、前に述べたように親の仇ではなく、その日のうちに被害者の牛方が仕返しすることになっている。ところが、奥州三戸郡には次のような例もあった。八戸市の『奥南新報』昭和七年〔1932年〕新年号に、小笠原梅軒氏の「踵太郎の童話」というものが出ている。文章を飾りすぎているところはあるが、要点だけを抜き出すと、

    「妊娠した女房が一人で留守番をしているところへ山姥がやって来て、『酒を出せ、肴を出せ』といい、さんざん乱暴したあげく、女を頭から食べて帰っていく。そのあと夫が戻ってみると、炉のそばに山姥の食べ残した女房のかかとが落ちている。それを大切に紙の袋に入れ、掛けておくと、ある日その袋がかさこそと動く。不思議に思って下ろしてみると、かかと……'

  sequence: 77
- id: mmt-079-01
  scan: 79
  section: 瓜子織姫／五 驚くべき成長
  original: である爲に、却つて成人のやうには此事實に興味を持ち得なかつたのであらうが、それよりも更に大きな理由は、彼等には旣に其信仰が失はれて居たことであると思ふ。從うて採集童話が今日の如く、自由に編纂者の手に由つて改竄せられる世の中では、古い傳承の中に在る斯ういふ幽かな痕跡は、行く行く飛び散つてしまはぬとも限らぬ。だから自分等は世の多くの昔話に無關心な者よりも、寧ろ作書の才分ある童話作家と呼ばるゝ人々を、常に警戒し且つ疾視せざるを得ないのである。但しこの種の改作によつて、新らしい聽き手の意に投じようとする試みは、必ずしも今日に始まつたことでは無い。以前は大方無意識にではあつたが、それでも折々は可なり大きな變更を加へて居たらしい。幸ひに其事業が地方的であり個人的であつて、今の圓本の如く全國を風靡しなかつた故に、たまたま地を隔てた幾つかの採集を比較して見れば、まだ其間から若干の消え殘りを、拾ひ出すことも出來る次第である。今後の研究者の爲に採集の殊に必要であるのは、全くこの心無き統一事業に對抗しなければならぬからである。實例は是から尙追々に出て來るが、瓜子姫の場合でいふと、第一に瓜を谷川から拾つて來て、爺と二人で庖丁を以て割つて見たといふこと、是などは小さな點だが元は決して斯うは語られなかつたと思ふ。岩手縣の六つの例のうちでは、たゞ紫波郡の一つ(七)と、西は日向の例(九)とが庖丁を用ゐたとあり、其他は(六)と(一〇)とが「割つて見ると」とあるだけで、殘りの六つは何れも自然の出現であつた。殊にこの石州の話などは、「庖丁で切らうとすると獨りでに瓜が割れて」とさへ謂つて居るのである。斯ういふ我々から見ると大切な個條でも、人は何心無く變化を加へて見ようとした。さうして若し假に爺が刃物を手に持つた畫でも本にならうものなら、恐らくはこの申し兒の推定などは成立たなくなるかも知れぬのである。次には其瓜をどうして置いたかといふ點も、桃太郞の桃の方はもう普通には何とも言つて居らぬに反して、奥州の五つの例(一、二、三、五、七)では戶棚の中に入れて置いたと謂ひ、其四つは戶棚を開けて見たら其瓜の中から、美しい女の兒が生れて居たといふのである。此點も曾ては至つて重要であつたのでは無いかと思ふが、急いで話をする人は何と無く省略しようとして居た。たゞ幸ひに石見の例に於て、櫃の中に入れて置いたと謂ひ、信州下水內郡の話(八)では、重箱の中に入つて川上から瓜が流れて來たとある爲に、それが本來は常陸風土記の蛇體神子、
  translation: 'だから、かえって大人ほどには、この事実に興味を持てなかったのだろう。しかし、もっと大きな理由は、子供たちには、すでにその信仰が失われていたことだと思う。

    したがって、採集された童話が、今日のように編者の手で自由に書き換えられる世の中では、古い伝承に残る、こうしたかすかな痕跡は、やがて散り散りに消えてしまわないとも限らない。だから私たちは、世間の多くの、昔話に無関心な人々よりも、むしろ創作の才能を持つ童話作家と呼ばれる人々を、いつも警戒し、うとまずにはいられないのである。

    もっとも、このような改作によって新しい聞き手の好みに合わせようとする試みは、決して今日始まったことではない。以前はおおむね無意識だったが、それでも、ときにはかなり大きな変更を加えていたらしい。幸い、その作業は地方的・個人的なもので、現在の円本のように全国を席巻することがなかった。そのため、遠く離れた土地の採集例をいくつか比べれば、まだその間から、多少の消え残りを拾い出せるのである。将来の研究者のために採集がとりわけ必要なのは、まさしく、この無自覚な統一の動きに対抗しなければならないからだ。

    実例は、この後も順に出てくるが、瓜子姫の場合でいえば、第一に、瓜を谷川から拾ってきて、お爺さんと二人で包丁で割ってみたという点がある。これは小さな点だが、もとは決してこのようには語られなかったと思う。岩手県の六例のうち、紫波郡の一例（七）と、西のほうでは日向の例（九）だけが、包丁を使ったとしている。そのほかは、（六）と（十）に「割ってみると」とあるだけで、残る六例はいずれも、ひとりでに現れたことになっている。とりわけ石見の話では、「包丁で切ろうとすると、ひとりでに瓜が割れて」とさえ言っている。

    このように、私たちから見ると大切な事項にも、人は何気なく変更を加えようとした。そして、もし、お爺さんが刃物を持った絵が絵本にでもなるようなら、おそらく、この申し児という推定などは、成り立たなくなるかもしれないのである。

    次に、瓜をどのように置いておいたかという点もある。桃太郎の桃については、もう普通は何も言わない。それに対して奥州の五例（一、二、三、五、七）では、戸棚に入れておいたといい、そのうち四例は、戸棚を開けてみたら、瓜の中から美しい女の子が生まれていた、という。この点も、かつてはたいへん重要だったのではないかと思うが、急いで話す人は、何となく省略しようとしていた。

    ただ幸い、石見の例では櫃に入れておいたといい、信州下水内郡の話（八）では、瓜が重箱に入って川上から流れてきたとしている。そのため、それがもともとは『常陸風土記』の蛇の姿の神の子、'

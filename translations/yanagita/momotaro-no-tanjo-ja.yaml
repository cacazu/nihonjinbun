  section: 米倉法師／一 盲と文芸・二 笑話の分布
  original: れが民族によつて濃淡の差等あり、我々日本人は殊に其願が切である爲に、幾分か安物の笑を高く購はうとした癖のあつたことなどを說かなければならぬが、そんな堅苦しい議論はまだ私には準備が足りない。それで差當りは過去の盲の事業の中で、今日まだ埋もれずに傳はつて居るものを拾ひ上げて、少しづつ其發生の源を尋ね、又その感化の及ぶ所を、考へて見る資料に供したいと思ふのである。御斷りをする迄も無いことかは知らぬが、假に現代流行の大衆文藝なるものに、以前盲が設定した窮屈なる約束の、尙若干は殘つて居るものがあらうとも、私には近世の史論家の或人々のやうに、其發頭人ばかりを責める氣は全く無い。彼等の追隨者が無意識に、たゞ文藝とは斯んなものと心得て居たと同じく、盲人も亦此途しかあるいて行くことが出來なかつたのである。彼等の杖としたものは生存であつた。島國の文藝が盲などを手引と賴んだ爲に、つい〳〵斯んな方角に深入りをして居たといふ事實は、ただ我々に向つて別に幾つかの異なる道が、今尙開かれずにあるといふことを敎へる迄であつて、企てては到底出來なかつたこの珍らしい我國の實驗の如きは、悔いる理由も無ければ又その利益も無いのであつた。ニ笑話の分布盲の道化といふものは全體にいつも稍、技巧に過ぎて居た。彼等自身は鏡といふものを知らず、人の笑ひ顏を見て參考にすることが出來ぬ爲であらうか、今でも彼等の愛矯笑ひには努力の痕が見え、何か一抹の苦味とも名くべきものの漂うて居るのが感じられる。それと同樣に笑の手ごたへを、常に聽衆の聲だけから探り出さうとする結果、自然に其手段の幾分か叮嚀に過ぎる嫌ひがあるのであつた。目に見えぬ者から笑はせて貰はうとした我々の失策は、可なりよく出來て居るといふ作り話の中からでも、尙之を覺ることが出來るのである。桃太郞童話の一つの傍系として、私の集めて見た米倉法師の話なども、やはりよく見て居ると只の人の趣向には浮んで來ぬものであつた。昔々或一人の心素直なる親爺、水の神の御意に叶うて靈妙不可思議のみどり兒を授かり、又は黄金を降下する小さな動物、もしくは打出の小槌の類の寶物を拜領して戾つて來る。それを慾深な鄰家の爺が羨んで眞似そこなひ、或は我家の女房が心得ちがひをして、誠に飛んでも無いことになつてしまつたといふ話。是等は
  translation: '〔前のスキャンから続く〕民族によって程度の違いがあり、日本人はとくにその願望が強いため、いくらか安っぽい笑いを高く買おうとする癖があったことなどを論じなければならない。しかし、そのような堅苦しい議論をするには、私にはまだ準備が足りない。そこで当面は、過去の目の見えない人々の仕事のうち、今日なお埋もれずに伝わるものを拾い上げ、その発生の源を少しずつ尋ね、またその影響の及ぶ範囲を考える資料にしたいと思う。断るまでもないことかもしれないが、仮に現在流行している大衆文芸というものに、かつて目の見えない人たちが定めた窮屈な約束事が、いくらか残っていようとも、私は近世の歴史論者の一部の人々のように、その始めた者ばかりを責める気はまったくない。後に従った者が、無意識に文芸とはこういうものだと思っていたのと同様、目の見えない人にも、この道しか歩くことができなかったのである。彼らが杖として頼ったものは、生きていくことだった。島国の文芸が目の見えない人などを案内役として頼ったため、ついこうした方向へ深く入り込んでいたという事実は、ただ私たちに対して、別のいくつかの異なる道が、今なお開かれずにあることを教えるだけである。意図しては到底できなかった、この珍しい日本の実験については、悔やむ理由もなければ、その利益もないのだった。

    二　笑い話の分布

    目の見えない人の道化は、全体にいつも少し技巧に走りすぎていた。彼ら自身は鏡というものを知らず、人の笑顔を見て参考にすることができないためだろうか。今でも彼らの愛想笑いには努力の跡が見え、何か一抹の苦みとでも呼ぶべきものが漂っているように感じられる。それと同じく、笑いの手応えを、いつも聴衆の声だけから探り出そうとする結果、その手段がいくらか丁寧すぎる嫌いが自然に生じたのだった。目の見えない者に笑わせてもらおうとした私たちの失敗は、かなりよくできているといわれる作り話からさえ、なお感じ取ることができる。桃太郎の童話の一つの傍系として私が集めてみた、米倉法師の話なども、よく見ると、通常の人の発想には浮かんでこないものだった。昔々、一人の心の素直な老人が、水の神のお気に入りとなり、霊妙で不思議な赤ん坊を授かる。または黄金を降らせる小さな動物、あるいは打ち出の小槌の類の宝物を頂いて帰る。それを欲深い隣家の老人がうらやんで、まねそこなったり、自分の妻が心得違いをして、実にとんでもないことになってしまったりするという話である。これらは、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン264）と本文OCRを照合。
  - 画像で「源を尋ね」「敎へる」を確認してOCRを訂正。

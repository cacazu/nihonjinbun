  section: 和泉式部の足袋／六 誓願寺と鳳来寺
  original: 田舎者にはやゝ六つかしい藝であつた。或は現代の文化何々と謂つた商品と同樣に、都で改良を加へて再び原產地へ、逆輸出したものかも知れない。兎に角に足袋の由來と云ひ、みのかさの歌と云ひ、三河の鳳來寺を一つの起點として居るらしいのは、私には意味のあることに考へられる。さうして其二つが共に和泉式部の逸話として傳へられて居る理由も、今少しく心がけて居たらやがて明かになるやうな氣がする。南無藥師の說話の最も古い記錄は、前にも雨乞の歌に引用した醒睡笑卷六であつた。是には元和九年の自序があるから、一休關東咄よりは五十年古い。たゞ文筆に表はれる以前、どの位久しく行はれて居たかが不明だが、是は此老僧が小僧の時からの話を、聽いて覺えて居て書集めたものだと言つて居る。山門北谷に兒あり。惡瘡の至りに根本中堂へ參籠す。七日濟すれども敢て效無し。うち恨みて下向に、短册を內陣に投入れ參らせたり。南無藥師衆病悉除の願ならば身より佛の名こそ惜しけれ卽ち内に御聲ありて村雨の降るとは見えて晴れにけりそのみのかさをそこにぬぎおけ本坊に還れば瘡みな痕無し。この說話集は編者が僧であつただけに、殆とその半分近くが兒と法師との話であり、且つその大部分が叡山での出來事になつて居る。だから謠曲の歌藥師と半分ばかり似て居ても、彼が是を採り若くは此方が彼を燒直したとは言へないことは、あちらには「みのかさ」の返歌の無いのを見ても明かである。文獻上の證據として認め得ることは、今から三百何十年の前に、旣に京都にも此話があつたといふだけで、是が九州四國等の各處の藥師に、女歌人の傳說として存するものの、原の形であつたとすらも言ひ切れないのである。三河では鳳來寺の峯の藥師を中心にして、一群の說話業の久しく繁榮して居たらしきことは、此頃早川君などの骨折によつて、追々に判明しようとして居る。曾て淨瑠璃の名を以て全國を席卷した語りものの、玆が最初の發祥地であつたのみならず、その藥師如來の申し子なる姫の傳記は、記錄以後更に幾段かの展開を遂げて、今も此地方に色々の斷片となつて傳はり、又その或ものは傳說に化して土着して居る。海道往還の便宜を利用して、是が東西に分散したことも想
  translation: '田舎の人にはやや難しい芸当だった。あるいは、現代の「文化何々」と名づけられた商品と同じように、都で改良してから再び原産地へ逆輸出したものなのかもしれない。

    足袋の由来も「みのかさ」の歌も、三河の鳳来寺を一つの出発点としているらしいことは、ともかく私には意味のあることと思われる。そして、その二つがともに和泉式部の逸話として伝わっている理由も、もう少し注意していれば、いずれ明らかになるように思う。「南無薬師」の説話の最も古い記録は、先に雨乞いの歌のところでも引用した『醒睡笑』巻六だった。これには元和九年の自序があるから、『一休関東咄』より五十年古い。ただし、文章に記される以前にどれほど長く伝えられていたかは不明である。この老僧は、小僧のころから聞いて覚えていた話を書き集めたものだと述べている。

    「比叡山の北谷に一人の稚児がいた。ひどいできものを患い、根本中堂にこもって祈った。七日過ぎてもまったく効き目がない。恨めしく思い、帰るときに短冊を内陣に投げ入れた。

    『南無薬師、すべての病を除くというお誓いならば、私の身よりも、仏様のご名声に傷がつくことが惜しまれます。』

    すると内からお声がした。

    『にわか雨が降ると見えたが、もう晴れた。その蓑笠をそこに脱いでおきなさい。』

    もとの寺坊に帰ると、できものはすべて跡形もなくなっていた。」

    この説話集は編者が僧であっただけに、ほぼ半分近くが稚児と法師の話であり、その大部分は比叡山での出来事になっている。だから、謡曲『歌薬師』と半分ほど似ていても、あちらがこちらを採用したとか、こちらがあちらを作り直したとかはいえない。あちらに「みのかさ」の返歌がないことからも明らかである。文献の証拠として認められるのは、今から三百何十年も前に、すでに京都にもこの話があったということだけである。九州・四国など各地の薬師に女性歌人の伝説として残る話の原形だったとさえ、断言できない。三河では、鳳来寺の峰の薬師を中心として、説話を生業とする一群の人々が長く栄えていたらしいことが、近ごろ早川君らの尽力により、次第に明らかになろうとしている。ここは、かつて浄瑠璃の名で全国を席巻した語り物の最初の発祥地であったばかりではない。薬師如来に祈って授かった姫の伝記も、記録されてからさらに幾段階かの展開を遂げ、今もこの地方にさまざまな断片となって伝わり、その一部は伝説となって土地に定着している。街道の往来の便利さを利用して、これが東西に広まったことも想像できるが、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン256）と本文OCRを照合。
  - 「みのかさ」は「蓑笠」と「身の瘡（体のできもの）」との掛詞。稚児は当時の寺院に属する少年。冒頭は255、末尾は257に続く。

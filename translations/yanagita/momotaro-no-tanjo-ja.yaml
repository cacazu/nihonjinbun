  section: 田螺の長者／四 タミナの婿とツブの長者
  original: 'と謂つたり、溝や小橋に來るとどうどうと聲を掛けたりして、丸で人間の通りに上手に

    馬をぼつて行つた。やがて街道の松並木にさしかゝると、佳い聲を張りあげて馬方節な

    どをとろとろうと歌つて通つた。さうすると馬も勇んで、鈴がころりんころりんと鳴る

    し鳴輪もじやがじやが鳴つた。田圃や往來の人達はそれを見て、不思議な事もあればあ

    るもんだ。此馬は田の尻の誰それ爺樣のとこのだが、あの聲は誰だか知らない。それに

    又姿も見えない。ほんとうに是は何たらいふことだべと謂つて、總立ちになつて之を見

    て居た。ツブの息子はそんな事には頓着無しに、どんどん馬を追うて長者どんの玄關ま

    で行つて、大きな聲で申し申しと謂つた。長者どんの下男共は、そら又年貢米が來たぞ

    と出て見ると、荷を附けた馬ばかりが三疋立つて居る。あれあ、見れば田の尻の爺樣と

    この馬だが、何して馬ばかりよこしたべや。それでも今確かに申し申しと謂つたやうだ

    つたと騒いで居ると、中荷の上からおら田の尻の爺とこのツブの息子だ。馬はぼつて來

    たども俵を卸すことが出來ない。申しわけ無いが手傳つておくれやと言つた。下男ども

    は驚いて其聲のする處を覗いて見ると、如何にもぺあこ(小さ)な田螺が中荷の上に威張

    りかへつて居る。魂消てやいやい皆出て見ろであといふと、奥から旦那樣だのかゞ樣だ

    の娘だのが、どれどれと總出で出て來てそれを見た。其うちにツブの息子は指圖をして、

    米の俵を殘らず馬から卸してそこへ積み重ねた。長者どんでは珍らしがつて、先づ先づ

    晝時にもなつたからと、ツブの息子を臺所に入れて膳を出すと、食ふのは見えないが、

    いつの間にか椀の中の物が無くなる。さうすると御代りを出し、しまひにははい御湯つ

    こをけてがんせなどと謂つた。それを皆が面白がつて、めいめい手のひらに載せて見た

    り、つまんで見たりして喜んだ。長者どんの旦那樣も脇からそれを見て居て、つくづく

    希代なことだと思つた。ツブどんどんお前は幾つになる。はい取つて十八になりました。

    それを聽いて旦那樣が、是は愈々不思議なことだ。御水神樣の申し兒だといふことは聞

    いて居たが、それが馬を牽いたり物を言つたり、又斯んなにも發明だ。是ほどの器量持

    ちなら今にどんな事でも出來るだらう。是は家の寶にしたいものだと思つて、ツブ殿ツ

    ブ殿、お前の家とおら家とは、祖父樣の代からの出入の中だ。おれには今娘二人あるが、

    其どつちかを嫁に貰つてくれないかと言つた。さうするとツブの息子も大喜びで、それ'
  translation: '――と言ったり、溝や小橋に来ると「どうどう」と声をかけたりして、まるで人間のように上手に馬を追っていった。やがて街道の松並木に差しかかると、よい声を張り上げ、馬方節などを朗々と歌いながら通った。すると馬も勇み、鈴がころりんころりんと鳴り、鳴輪もじゃがじゃが鳴った。田畑や往来の人々はそれを見て、「不思議なこともあるものだ。この馬は田の尻の誰それじいさんの家の馬だが、あの声は誰だかわからない。それに姿も見えない。本当に、これはいったいどういうことだろう」と言い、皆立ち上がって見ていた。


    ツブの息子はそんなことを気にせず、どんどん馬を追って長者どんの玄関まで行き、大声で「もしもし」と言った。長者どんの下男たちは、「そら、また年貢米が来たぞ」と出てみた。すると、荷を積んだ馬だけが三頭立っている。「おや、見れば田の尻のじいさんの家の馬だが、どうして馬だけよこしたのだろう。それでも、今、確かに『もしもし』と言ったようだったが」と騒いでいると、荷の上から、「おれは田の尻のじいさんの家のツブの息子だ。馬は追ってきたが、俵を下ろせない。申し訳ないが手伝っておくれ」と言った。下男たちは驚き、声のするところをのぞくと、確かに小さな田螺が荷の上で威張り返っている。仰天して「おいおい、みんな出て見ろ」と言うと、奥から旦那様や奥様や娘が「どれどれ」と、そろって出てきて見た。その間にツブの息子は指図して、米俵を残らず馬から下ろし、そこへ積み上げさせた。


    長者どんの家では珍しがり、「まあまあ、昼時にもなったから」と、ツブの息子を台所へ入れて膳を出した。食べるところは見えないが、いつの間にか椀の中身がなくなる。そこでお代わりを出すと、しまいには「はい、お湯をください」などと言った。皆は面白がり、代わる代わる手のひらに乗せたり、つまんでみたりして喜んだ。長者どんの旦那様も横から見ていて、つくづく、めったにないことだと思った。「ツブどん、ツブどん、お前はいくつになる」「はい、数えで十八になりました」。それを聞いて旦那様は、ますます不思議なことだ、水神様の申し子とは聞いていたが、馬を引き、物を言い、しかもこんなに賢い。これほど才能があれば、いずれどんなことでもできるだろう、ぜひ家の宝にしたいものだと思った。そして、「ツブ殿、ツブ殿、お前の家とうちとは、祖父様の代から取引のある仲だ。おれには今、娘が二人いるが、どちらかを嫁にもらってくれないか」と言った。するとツブの息子も大喜びして、「それ――'
  notes:
  - スキャン127から続く引用。末尾はスキャン129へ続く。
  - 「発明」はここでは聡明で機転が利くこと。鳴輪は音を鳴らす馬具。

  section: 桃太郎の誕生／一 知られざる日本・二 民譚二種
  original: '無い。是からもどんな變つた標本が出て來ぬとは限らぬが、兎に角に日本での採集によつて知れて來たことは、この世界的に著名なる一つの昔話が、我邦に於てもまだ比較的まとまつた形で保存せられて居たことと、それが繼母話の稍、殘虐に過ぎたる一種を發生せしめた以外には、特に他の多くの說話の上に、是といふ影響感化を與へては居なかつたらしいといふこととである。

    二民譚二種

    それから今一つ、歐羅巴では可なりもてはやされて居る昔話に、古風なる死人感謝譚(ルモールルコンネッサン)といふのがある。或は又歌うたふ骸骨とも謂つて、其死人が髑髏になつて歌つたり過去を語つたりしたといふ話が多い。是なども日本靈異記の昔から、よく纏まつた形で久しい間、弘く我々の中には傳承せられて居た。私は此事實を解して、此種の說話が夙く神話信仰の時代を去り、一個言語の藝術となつてしまつてから後に、この日本民族の間に運び込まれたことを、意味するものであらうかと思つて居る。勿論それを斷定する爲には、まだ〳〵數多くの類例を集積して見なければ安全で無いが、少なくとも今日御互ひが一括して昔話、もしくは民間說話と名けて居るものの中に、斯ういふ國際的類似の著しい若干がある以外、是と對立して國內限りで、思ひ切つて變化をして居るものがあることは事實である。是は一般の藝術發生の法則とも關聯して居るものであらうが、說話には兎に角其成熟期とも名くべきものがあつて、個々の風土環境と社會生活の段階により、乃至は說話そのものの各自の性質から、國每にちがつた年齢をもち、ちがつた經歷を持ち、從つて其傳播の樣式にも、幾通りかの差異が有り得たのである。大體に是を輸入の時代の前後と言つてしまへば解りはよいだらうが、中には遲く持つて來ても尙藝術となり切つて居ない方面から來たものもあらうし、他の一方には早く入つたものにも旣にこの成熟期を過ぎて、熟した果實として受用せられたものも有り得るのである。我々の灰娘や歌うたふ骸骨などは、ちやうど此第二の場合に屬して居た故に、その渡來後の變化が案外に少なかつたのでは無いかと思ふ。是とは反對に、西洋でも數多く知られて居る異類求婚譚(ラベルエラベット)、卽ち人間の美女又は美男と、鳥獸草木などの人で無いものとが緣を結んだといふ昔話などは、日本一國の'
  translation: '……ない。これからも、どんな変わった例が出てこないとも限らない。だが、ともかく日本での採集からわかってきたのは、世界的に有名なこの昔話が、日本でもまだ比較的まとまった形で保存されていたこと、そして、やや残虐すぎる一種の継母の話を生み出した以外には、ほかの多くの説話に目立った影響を与えてはいなかったらしい、ということである。

    二　民譚二種

    もう一つ、ヨーロッパでかなり人気のある昔話に、古風な「死人感謝譚（ルモールルコンネッサン）」というものがある。また「歌うたう骸骨」ともいい、その死者が骸骨になって歌ったり、過去を語ったりする話が多い。これなども、『日本霊異記』の時代から、よくまとまった形で、長い間、広く私たちの間に伝えられてきた。私はこの事実を、この種の説話が早くに神話や信仰の段階を離れ、一つの言葉の芸術となったあとで、日本民族の間に運び込まれたことを示すのではないかと考えている。もちろん、そう断定するには、まだまだ多くの似た例を集めてみなければ確かではない。それでも少なくとも、今日私たちがまとめて昔話、あるいは民間説話と呼んでいるものの中に、このように国際的な類似が著しいいくつかの話がある一方、それと対照的に、国内だけで大胆に変化しているものがあることは事実である。これは芸術が生まれる一般的な法則にも関係するのだろうが、説話にはともかく、成熟期とでも呼ぶべき時期がある。個々の土地の自然環境や社会生活の段階、あるいは説話そのもののそれぞれの性質によって、国ごとに違った年齢をもち、違った経歴をもち、そのため伝わり方にも何通りかの違いがありえたのである。大ざっぱには、輸入された時代の早い遅いといえばわかりやすいだろう。だが、遅く持ち込まれていても、まだ芸術になりきっていない地域から来たものもあるだろうし、反対に、早く入ったものの中にも、すでに成熟期を過ぎ、熟した果実として受け取られたものがありうる。日本の「灰娘」や「歌うたう骸骨」などは、ちょうどこの第二の場合に属していたため、渡来後の変化が意外に少なかったのではないかと思う。

    これとは反対に、西洋にも多く知られている「異類求婚譚（ラベルエラベット）」、すなわち美しい女性や男性が、鳥獣や草木など人間以外のものと結ばれたという昔話などは、日本一国の……'

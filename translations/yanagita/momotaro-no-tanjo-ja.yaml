  original: 來の考察に委ねられて居るだけである。九州では豐前築上郡上城井の山奥に、寒田といふ部落があつて古くから知られて居たが、そこの住民を主人公とした一團のおどけ話が、寒田噺と呼ばれて周圍の平原に流布して居る。勿論其大部分は寒田の人たちが、聽いたら怒るやうな失禮な話であつて、寧ろ傳承者の彼等で無かつたことを示すのであるが、少なくとも此地を熟知する區域以內に、昔話を統一して管理しようとした機關の、曾てあつたことだけは推測し得られるのである。寢太郞聟入譚は此中にも一つあつて、それが沖繩の遺老說傳とよく似て居た(國學院雜誌三卷四號、坂根道治郞氏)。昔寢太郞といふ男は、明けても暮れても寢てばかり居て、三年にたつた一度しか目を醒まさなかつた。或時起きて見たら年の暮であつた。母が正月のお醬油を買つて來いと言つて、金を持たせて町へ使に遣ると、醤油は買はずに其金で野鳩を一羽と鈴を一つと買つて歸つた。母がそれを見て小言を言つたが、彼は只默つて笑つて居た。寢太郞の鄰は大きな財產家で、美しい一人娘があつた。正月元日の明け方に、寢太郞は其野鳩に鈴をゆはへ付けて、鄰の屋敷の境の大きな椋の樹の梢に登つて隱れて居た。其うちに長者の主人が起き出して、顏を洗ひに椋の樹の下へ遣つて來た。さうすると樹の上の寢太郞は作り聲をして、おれは此地の氏神である。娘には必ず鄰の寢太郞を聟に取れ。さうすれば此家が一層繁昌するぞと言つて、抱へて居た野鳩を放すと、鳩は鈴の音をさせながら空を舞つて、やがて鎭守の森をさして飛んで行つた。長者は之を見て驚き且つ喜んだ。さうして寢太郞がそしらぬ顏をして居る處へ、俄かに澤山の米や餅を持參して、聟入の相談に遣つて來た。この相談は無論直ぐにまとまり、それからは寢太郞も一生懸命に働く人になつた。從來の所謂傳播論者は、傳播は只何でも無いことの樣に考へて居たが、斯ういふ實例になるとさう簡單には說明が出來ず、しかも旅行をしなかつたものとすると、到底是だけの一致は有り得ない。私は此話の運搬者の誰であつたかを尋ねて見る前に、先づ白鷺と野鳩と、二者何れが元の形、何れが後に改まつたものかを決したいと思ふ。古い記錄には鳩も鷺も、共に神の使として信ぜられたことが見えて居るが、片方はわざ〳〵鈴を付けないと通用しなかつたのだから、簡單な方が前だと見てよからう。白鷺は人を見ても直ぐに遁げず、如何にも
  translation: '……考察に委ねられているのである。九州では、豊前の築上郡上城井の山奥に、寒田という集落があり、古くから知られていた。そこの住民を主人公にした一群のおどけ話が、寒田噺と呼ばれて、周囲の平野に広まっている。もちろん、その大部分は寒田の人たちが聞けば怒るような失礼な話で、むしろ彼らがその伝承者ではなかったことを示している。しかし、少なくともこの土地をよく知る範囲には、かつて昔話をまとめて管理しようとする仕組みがあった、ということだけは推測できる。この中にも寝太郎の婿入りの話が一つあり、それが沖縄の『遺老説伝』によく似ていた（『国学院雑誌』三巻四号、坂根道治郎氏）。

    昔、寝太郎という男は、明けても暮れても寝てばかりいて、三年に一度しか目を覚まさなかった。あるとき起きてみると、年の暮れだった。母が、正月用の醤油を買っておいでと金を持たせて町へ使いにやると、醤油は買わず、その金で野鳩を一羽と、鈴を一つ買って帰った。母はそれを見て小言をいったが、寝太郎はただ黙って笑っていた。隣の家はたいへんな資産家で、美しい一人娘がいた。元日の明け方、寝太郎はその野鳩に鈴を結びつけ、隣の屋敷との境にある大きな椋の木の梢に登って隠れていた。そのうち長者の主人が起き出し、顔を洗いに椋の木の下へやってきた。そこで木の上の寝太郎は声色を変え、「おれはこの土地の氏神だ。娘には必ず隣の寝太郎を婿に取れ。そうすれば、この家はいっそう栄えるぞ」といい、抱いていた野鳩を放した。鳩は鈴の音を鳴らしながら空を舞い、やがて鎮守の森を目指して飛んでいった。長者はこれを見て驚き、そして喜んだ。そうして、寝太郎が知らん顔をしているところへ、急にたくさんの米や餅を持参し、婿入りの相談にやってきた。もちろん話はすぐにまとまり、それから寝太郎も、一生懸命に働く人になった。

    従来の、いわゆる伝播論者は、話が伝わり広がることを、ただ何でもないことのように考えていた。しかしこうした実例になると、そう簡単には説明できない。しかも、話が旅をしなかったとすれば、これほどの一致は到底ありえない。私はこの話を運んだ人が誰だったかを調べる前に、まず、白鷺と野鳩のどちらがもとの形で、どちらが後から変わったものかを決めたいと思う。古い記録には、鳩も鷺も、ともに神の使いと信じられたことが見える。しかし、一方はわざわざ鈴をつけなければ通用しなかったのだから、単純なほうが先だったと見てよいだろう。白鷺は人を見てもすぐには逃げず、いかにも……'
  notes:
  - 冒頭はscan150末尾、末尾はscan152冒頭に続く。
  - 寒田は地名で、保存画像の振り仮名は「さわだ」。

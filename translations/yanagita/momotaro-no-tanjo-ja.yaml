  section: 桃太郎の誕生／二 民譚二種・三 童話の起り
  original: 'る爲に、婚姻慣習といふ一つの物差しをあてて見ようとして居るが、同時に又その多くの類型の比較は、我々の婚姻制の變遷を解說せんとする者に、幾つかの暗示を投げてくれる樣である。

    三童話の起り

    桃太郞の昔話なども、日本に根を生じてからよほど年久しいと見えて、其樹は何代と無く生ひ代つて、もう本の株は枯れて居る。從うて神話時代の桃太郞原型は、蛇聟入譚の如くには我々の目に觸れる處に殘つて居ない。其代りには又一方の糠福米福などともちがつて、近世に入つてからの變化が最も著しく、その色々の形が鄰を接して併存するが爲に、之に基づいて此口碑の永年に亘つた經過を、大體は推測することを許されて居るのである。私などの見た所では、この昔話成長の三つの變化、卽ち一、說話が上代に於て夙く藝術化し、そのやゝ成熟した形に於て弘く流傳して居たもの、たとへば死人感謝譚や紅皿缺皿話二、說話の信仰上の基礎が全く崩壞せず、從つて之を支持した傳說は素より、その正式の語りごとが尙幽かながら殘つて居たもの、たとへば蛇聟入の如き一部の異類求婚譚三、最後に說話が近世に入つて急に成熟し、元の樹の所在は不明になつたが、まだ其果實の新鮮味を失はぬもの、たとへば桃太郞瓜子姫說話の類斯ういふ三種類三樣式の說話が、入りまじつて共に行はれて居るといふことは、比較研究者にとつて此上も無く便利なことである。グリムも傳說の若干は集めて居るが、それはもう痕跡であり、又彼の家庭童話とは關係の無いものであつた。說話が近い頃まで信じられて居た島々はあるが、それも白人が近よつて來た頃から、一時に悉く娛樂用のものにならうとして居る。斯んな色々の標本の揃つて居た國は、日本以外に決してさう多くは無いといふことは、やがて世人が心付く時が來るであらう。日本は果してさういふ國であつた。殊に近世の二百年ばかりの文明が、さういふ狀態を作り上げるのに適して居た。江戶期から明治の中頃までにかけて、都市の生活のみが獨り大いに進んだのみならず、又其中でも一部の者と、村に住するごく〳〵の少數だけが文字を知つ'
  translation: '……るために、婚姻の慣習という一つの物差しを当ててみようとしている。同時に、数多くの類型を比較することは、日本の婚姻制度の変遷を説明しようとする人にも、いくつかの手がかりを与えてくれるようである。

    三　童話の起こり

    桃太郎の昔話も、日本に根づいてからよほど長い年月がたっているらしい。その木は何代となく生え代わり、もう元の株は枯れている。したがって、神話時代の桃太郎の原型は、「蛇婿入り」の話のようには、私たちの目に触れるところに残っていない。その代わり、一方の「糠福米福」などとも違い、近世に入ってからの変化が最も著しい。そのさまざまな形が隣り合う土地に共存しているため、それをもとに、この口伝えの話が長年たどってきた道筋を、おおよそ推測できるのである。私の見るところでは、昔話の成長には三つの変化がある。すなわち、

    一、説話が古代に早くから芸術化し、やや成熟した形で広く伝わっていたもの。たとえば「死人感謝譚」や「紅皿欠皿」の話。

    二、説話を支える信仰の基盤が完全には崩れておらず、したがって、それを支えた伝説はもちろん、その正式な語りの形式も、かすかながら残っていたもの。たとえば「蛇婿入り」のような、一部の異類求婚譚。

    三、最後に、説話が近世に入って急に成熟し、元の木の所在はわからなくなったが、まだ果実の新鮮さを失っていないもの。たとえば桃太郎や瓜子姫の説話の類。

    このような三種類、三つの様式の説話が混じり合って伝えられていることは、比較研究者にとって、このうえなく便利である。グリムもいくつかの伝説を集めているが、それはもう痕跡であり、彼の家庭童話とは関係のないものだった。近ごろまで説話が信じられていた島々はあるが、それも白人が近づいてきたころから、一度にすべて娯楽のためのものになろうとしている。これほどいろいろな標本がそろっていた国は、日本以外には決して多くないということに、やがて世の人々が気づくときが来るだろう。

    日本は確かにそのような国だった。特に近世の約二百年の文明は、そうした状態を作り出すのに適していた。江戸時代から明治の中ごろまで、都市の生活だけが大きく進歩したばかりでなく、その都市でも一部の人と、村に住むごくごく少数の人だけが、文字を知っ……'

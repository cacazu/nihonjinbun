  section: 瓜子織姫／九 瓜子姫の復活
  original: 我々の昔話は必ずしも世間で想像して居る如く、各個孤立して成長したものでは無かつた。獨り瓜姫桃太郞が一對であつたのみならず、他の幾つかの有名なる說話も、常に提携し聯絡して居た事實がある。たとへば石見のアマンジヤクが柿の樹に登つて、靑い澁い柿の實を採つて、下に待つて居る瓜姫に打付けたといふ點は、現行の猿蟹合戰の序幕の通りであるが、一方には柿の種と握飯との交易談の元の形として、猿と蟹とが餅臼を山から轉がして競走して食つたといふ話もあり、それは地方によつて猿と蝦蟆との爭ひにもなつて居る。其一部分が紛れて瓜子姫の方に入つたものとしても、それは固より近い頃に始まつたので無かつた。梨の木柿の木は懸離れた四箇處の地に共に有り(八、九、一〇、一一)、それが又奥州の方の鳥の知らせとも繫がつて居る。私にはまだ說明し得ないが、何か早くから斯ういふ樹のことを說く理由があつたのである。それから東北の方の山母が、瓜子姫を爼で切つて、小豆餅にして爺婆に食はせたといふ點、是なども「かちかち山」の第二段とよく似て居ることは、わざとでは無いかと思ふ程であるが、さりとて一方から切拔いて、此方へ取つて附けたとも思はれぬのは、此「かちかち山」が又寄せ集め物で、到底最初から斯ういふ形で流布して居たらしく無いからである。是は結局するところ說話の變化が、單なるそれ自身の成長又は改訂に止まらず、時としては隣の話との複合若くは混同、進んでは更に相互の間に、融通してもよい樣な部分の蓄積までを、含んで居たことを意味するのかも知れぬ。實際話の上手といふことは、いつの時代にも之を長く、新らしく且つ複雜に話すことであつた。しかも定まつたテキストが印刷せられて居たわけでも無いのだから、澤山の昔話を覺えてゐる女や年寄が、それを一つ一つ語り分け得たことを、寧ろ不思議と認めなければならぬ。それで私などは遠く離れた土地々々に於て、他には類を見ない幾つかの一致の、偶然に保存せられて居ることを重要視し、特に其部分に基づいて說話の成立を考へて見ようとするのである。但しこの「かちかち山」式の子供らしい慘虐によつて、直ちに瓜子姫の殺戮といふ點を近代の改作と見ることは速斷であらうも知れぬ。靈魂の輪廻を完全に信じ得た人々には、死と生
  translation: '私たちの昔話は、世間で想像されているように、一つ一つが孤立して成長したものとは限らない。瓜姫と桃太郎が一対だっただけでなく、ほかのいくつかの有名な説話も、常に結びつき、連絡し合っていたという事実がある。

    たとえば石見のアマンジャクが柿の木に登り、青く渋い柿の実を取って、下で待つ瓜姫にぶつけたという点は、今の「猿蟹合戦」の序幕と同じである。一方には、柿の種と握り飯の交換話の、もとの形として、猿と蟹が餅臼を山から転がし、競争して餅を食べたという話もあり、土地によっては猿と蝦蟇の争いにもなっている。その一部が紛れ込んで瓜子姫の話に入ったのだとしても、それはもちろん、近頃始まったことではない。

    梨の木や柿の木は、遠く離れた四か所（八、九、十、十一）の話に共通して現れ、また奥州の鳥が知らせる話にもつながっている。私にはまだ説明できないが、早くから、こうした木のことを語る何らかの理由があったのである。

    また、東北の山母が瓜子姫をまな板で切り、小豆餅にして爺婆に食べさせたという点も、「かちかち山」の第二段とよく似ていて、わざとそうしたのではないかと思うほどだ。しかし、だからといって、一方から切り取って、こちらへ継ぎ足したとも思えない。「かちかち山」自体も寄せ集めで、到底、最初からこの形で広まっていたとは思われないからである。

    結局、これは、説話の変化が、単なるそれ自身の成長や改訂だけではなく、ときには隣の話との結合や混同、さらには互いに融通してよいような部品の蓄積まで含んでいたことを、意味するのかもしれない。実際、話が上手だということは、いつの時代でも、それを長く、新しく、複雑に語ることだった。しかも、決まった本文が印刷されていたわけでもない。多くの昔話を覚えている女や年寄りが、それを一つずつ区別して語れたことのほうを、むしろ不思議と認めなければならない。

    それで私は、遠く離れた各地に、ほかには類のない一致がいくつも偶然保存されていることを重く見て、とりわけ、その部分に基づいて説話の成立を考えようとするのである。

    ただし、この「かちかち山」式の、子供じみた残虐さだけから、瓜子姫が殺されるという点を、すぐに近代の改作と見るのは、早まった判断かもしれない。霊魂の輪廻を完全に信じられた人々にとって、死と生'

  section: 桃太郎の誕生／犬子噺・あくと太郎
  original: 'れて來て其中から出た雀が、舌切雀になるといふ込入つた筋もあるといふ(郷土研究一卷二七六頁)。是が込入つたもののやうに考へられたのは、寧ろ今日の五大噺なるものが公認せられた結果では無いかと私は思つて居る。阿波には通例の桃太郞はもとは無くて、黍團子を半分遣つて栗·鋏·臼などを家來とし、猿が島を征伐に往つたのは蟹の子であつた。能登でも島渡りの童話はやはり「猿が島の敵討」であつて、桃太郞は單に川上から幾つもの桃が流れて來て、其一つの中から桃太郞が生れたといふ處を以て終り、其後の立志談は無かつたと、尾佐竹猛君などは言つて居られる(同上五〇四頁)。狸のかち〳〵山の中段が「瓜子姫」であつたと同じく、花咲爺の犬子噺が桃の實と結び付くことになつたのも、其川上を求むれば必ずしも偶然であつたとは言へない如く、雀も猿蟹も實は或一つの肝要なる昔話の、流れて推移した種々の形相であつた。强ひてこの五つを對立せしめようとした歷代の碩學たちは、實は此問題を難解に持つて行つた功勞しか無かつたのである。

    あくと太郎

    猿蟹合戰では、今ある親の讐を討つたといふ話よりも、猿にいぢめられた弱い蟹が、多くの友の援助を受けて、相手を擊退したといふ方が古くは無いかと思ふ。二つの動物が田を作り餅をつき、又は人の家から餅臼を取つて來て、分けて食はうといふ段になつて爭ひをする。無理を言つた方が結局は負けると言ふ話は、猿と蟇蛙について最も多く語られて居るが、その蟇蛙が蟹になり、餅が握飯から柿の種と變つて行くのは順序が自然であつて、此方には又猿が腹を立てて蟹を嚇し、蟹が困つて泣いて居ると、臼や牛糞などが寄つて來て力を附けるといふ、後日譚も續き易いのであつた。昔話の爭鬪は、出來るだけ善惡勝敗のけぢめをはつきりとさせてある。强くして暴虐なる者が眼前に攻め滅されるといふ個條は、聽手が子供で無くとも最も愉快なる大團圓であつたに相違ない。それを親が殺されて敵が勝ち、子供が大きくなつてから仇を復へすといふことにしても、尙辛抱して人が聽いて居るやうにな'
  translation: '……れてきて、その中から出た雀が舌切り雀になる、という入り組んだ筋もあるそうである（『郷土研究』一巻二百七十六頁）。これが入り組んだもののように思われたのは、むしろ今日の「五大話」というものが、公認された結果ではないかと私は思っている。阿波には、普通の桃太郎はもともとなく、きび団子を半分与えて、栗・はさみ・臼などを家来にし、猿が島の征伐にいったのは、蟹の子だった。能登でも、島へ渡る童話はやはり「猿が島の敵討ち」であり、桃太郎はただ、川上からいくつもの桃が流れてきて、その一つの中から桃太郎が生まれたところで終わり、その後の立志物語はなかった、と尾佐竹猛君などはいっている（同誌五百四頁）。タヌキの「かちかち山」の中段が「瓜子姫」だったのと同じく、花咲か爺の犬の子の話が桃の実と結びついたことも、その源をたどれば、必ずしも偶然とはいえない。それと同様に、雀も猿蟹も、実はある一つの重要な昔話が流れ、移り変わったさまざまな姿だったのである。あえてこの五つを別々に対立させようとした歴代の碩学たちは、実際には、この問題を難しくした功績しかなかったのである。

    あくと太郎

    「猿蟹合戦」では、今ある親の仇を討ったという話より、猿にいじめられた弱い蟹が、多くの友の助けを受けて相手を撃退したという話のほうが、古いのではないかと思う。二匹の動物が田を作り、餅をつき、あるいは人の家から餅臼を持ってきて、分けて食べようとする段になって争いになる。無理をいったほうが結局負けるという話は、猿とヒキガエルについて最も多く語られている。そのヒキガエルが蟹になり、餅が握り飯を経て柿の種へと変わっていくのは、自然な順序である。こちらにはまた、猿が腹を立てて蟹を脅し、蟹が困って泣いていると、臼や牛の糞などが寄ってきて励ますという後日談も、続けやすかった。昔話の争いは、できるだけ善悪と勝敗の区別をはっきりさせてある。強く乱暴な者が目の前で攻め滅ぼされるというくだりは、聞き手が子どもでなくても、最も愉快な大団円に違いない。それを、親が殺されて敵が勝ち、子どもが大きくなってから仇を討つということにしても、なお人が辛抱して聞くようになっ……'
  notes:
  - 冒頭・末尾は前後のスキャンへ続く。
  - 「あくと」は、かかとの方言名。

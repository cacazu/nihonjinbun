  section: 桃太郎の誕生／あくと太郎
  original: 'が二つに割れて、中から男の兒が生れて居た。それをあくと太郞と名けて大事に育てると、一杯食はせると一杯だけ、二杯食はせると二杯だけ大きくなつて、後に逞ましい男になつた。母が山姥に食はれた話を聞いて口惜しく思ひ、寒い冬の日に山姥の小屋を尋ねて行き、騙してその惡婆を殺してしまふ點は、大體に他の地方の「牛方山姥」の話に似て居る。

    此話の中でも珍らしく思はれる點は、石を爐の火で燒いて餅だと謂つて山姥に食はせること、是は多くの山村の山人口碑に、最も多く傳はつて居る人間の計略であつた。それが此話の中にも挿話風に利用せられて居るのは、是に無名の作者があつた證據である。第二には女房の踵だけが、しなくて食はれないので食ひ殘されて居たといふこと、隨分殺風景な滑稽ではあるが、是も屢〻、灰まきの雁取爺などに用ゐられて居る。隣の慾深爺が灰を播くと、雁の眼には入らずに自分の眼に入つて、雪隱の屋根から轉がり落ちる。それを雁かと思つて婆樣が棒で打殺して、雁汁をこしらへて食つてしまふ。其中にしなくてしなくて噛みきれないものがあるから、何だと思ふと爺樣の耳であつた。又は今一つのものであつたともいふ。是も座頭の坊などの惡い趣味かと思ふが、たゞ其中から强い赤子が生れたといふだけは、他にはまだ聞いたことが無いのである。

    故高木敏雄君はその桃太郞新論に於て、今から二十年も前に旣にモヽ太郞のもとは、人間の股では無かつたかと說いて居る(日本神話傳說の研究五五五頁)。しかしあの時分はまだそれを裏書するだけのごく確かな資料といふものは無かつたのであるが、それから十幾年を過ぎて紫波郡昔話が公けにせられ、其中には花見をして居る女房の腰のもとに、桃の實が一つ轉がつて來て、それを持歸つて綿にくるんで寢室に置くと、桃が二つに割れて其中から生れたといふ桃の子太郞の話がある。それから子を禱る女房の脛に孕まれ、生れた時には小指ほどの大きさであつたといふ「スネコタンパコ」の話もあつて、兩者は共に不可能に近い妻問ひをして成功して居る。桃が單なる言葉の誤解であつたといふ證據にはまだ不充分であるが、少なくとも神童が尋常を超越した狀況の下に、此世に現はれ出たといふ語りごとの一つに、股から生れた股太郞もあつたといふだけは認め得られる。又以前吉田巖氏が報告した十勝アイヌの昔話に、オムタロ・シタロなどといふはまさしく是であつた(郷土研究一卷七號)。オムは'
  translation: '……が二つに割れて、中から男の子が生まれていた。その子をあくと太郎と名づけ、大事に育てると、一杯食べさせれば一杯分、二杯食べさせれば二杯分大きくなり、後にはたくましい男になった。母が山姥に食べられた話を聞いて悔しがり、寒い冬の日に山姥の小屋を訪ね、だましてその悪い婆を殺してしまう点は、だいたい、ほかの地方の『牛方山姥』の話に似ている。」

    この話の中でも珍しく思われるのは、石を炉の火で焼き、餅だといって山姥に食べさせることだ。これは多くの山村の山人に関する口伝えに、最も多く伝わる人間の策略だった。それがこの話でも挿話のように利用されているのは、名も知られない作者がいた証拠である。第二は、女房のかかとだけが、硬くて食べられないために食べ残されていたということだ。ずいぶん殺伐とした笑いではあるが、これも灰をまく「雁取り爺」などで、しばしば使われている。隣の欲深い爺が灰をまくと、雁の目には入らず、自分の目に入って、便所の屋根から転がり落ちる。それを雁と思った婆が棒で殴り殺し、雁汁を作って食べてしまう。その中に、硬くてどうしてもかみ切れないものがあるので、何かと思うと爺の耳だった。あるいは、もう一つのものだったともいう。これも座頭の坊などの悪趣味かと思うが、ただ、その中から強い赤ん坊が生まれたということだけは、ほかではまだ聞いたことがないのである。

    故・高木敏雄君は、その『桃太郎新論』で、今から二十年も前にすでに、モモ太郎の元は、人間の股だったのではないかと説いている（『日本神話伝説の研究』五百五十五頁）。しかし、当時はまだ、それを裏づける十分確かな資料はなかった。それから十数年たって『紫波郡昔話』が出版され、その中には、花見をしている女房の腰のもとへ桃の実が一つ転がってきて、それを持ち帰り、綿でくるんで寝室に置くと、桃が二つに割れ、中から生まれたという「桃の子太郎」の話がある。また、子を授かりたいと祈る女房のすねに宿り、生まれたときには小指ほどの大きさだったという「スネコタンパコ」の話もある。どちらも、不可能に近い妻問いをして成功している。桃が単なる言葉の取り違えだったという証拠としては、まだ不十分である。しかし少なくとも、神童が普通を超えた状況のもとでこの世に現れたという語りの一つに、股から生まれた「股太郎」もあったことだけは認められる。また、以前吉田巌氏が報告した十勝アイヌの昔話で、「オムタロ・シタロ」などというのは、まさにこれだった（『郷土研究』一巻七号）。「オム」は……'
  notes:
  - 冒頭は前スキャンの引用から続き、末尾は次スキャンへ続く。
  - 座頭は歴史的に盲人や盲人の芸能者を指した呼称。「悪い趣味」という評価は著者のもの。
  - 「もう一つのもの」は原文の婉曲表現をそのまま保った。

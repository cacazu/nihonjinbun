  section: 狼と鍛冶屋の姥
  original: 社人かの繋ぎたる鎖を解いて其願にまかす。然して歸れば猪鹿の荒るゝこと無し。斯くして後又御供神酒を奉りて禮參す。誠に珍らしき事也。養父の五社大明神と妙見山との關係は、此記事の中にも少しも說いて居ない。現在は勿論二處の信仰は分立して居るから、各その社傳緣起の文字によつて、聯絡を見出すことは不可能であらう。斯ういふ問題こそはもう一度、土地人の感覺に就いて今のうちに尋ねて置く必要があるのである。水谷神社や夜夫坐神社五座は、假に延喜式以來の故跡のまゝとしても、狼に關する信仰までが、爰に居付きのものとは考へ難い。もしも他から移つて來たとするならば、私は或は妙見山の方からかと想像して居る。中國地方の靈山崇拜は、妙見樣になつて居るものが數多く、其中でも養父と城崎の兩郡の境に在る妙見山は、自分の故鄕あたりでも信徒が多かつた。是に關東の三峯出流山、又は遠江の山住や春野山と、同種の信仰が有つたか無かつたかは、調べて見ても判らぬといふことはあるまい。他日之によつて私の假定の、當れるや否やを試驗して見たい。何にもせよ高木加門の女房が狼であつたといふ話には、土地の舊傳を下染にして居たことは考へられる。所謂加門塚の所在は養父の狼の宮から、川と小山を隔てて西北に二里ばかりの處であるが、是も宿南の本村から、三谷といふ部落へ越える山路の傍で、或は妙見山への一筋の登路では無かつたらうかと思ふ。三谷は現在はミタニと謂つて居るが、式內の水谷神社はこゝであつたかも知れぬ。もしも山奥の傳說が旅人に珍重せられて、追々に平地の往還のほとりへ、出て來る傾向が普通であるとしたら、獨り山口の狼神社だけで無く、又其近くにお猫樣の宮があつて、其地が加地屋敷であつたといふことも、注意をしなければならぬ一つの事實である。それを地方の人たちが現今はどう說明して居るか。仔細に比べて見た上で無いと、土佐の野根山だけを斷定することは出來ないだらう。六　朝比奈氏の先祖狼を單に山の神の使令とするだけで無く、直接に祀つて居る社も但馬以外に多い。さうして其中には小兒の保護者として拜まれて居る例もあるのだから、愈〻以て加門女房の物語が、たゞ一度きりの趣向では無く、由つて來る所あることを察するのである。たとへば駿州志太郡の假宿村、東海道の岡部驛から十六町ほど離れた岡の上に、內宮權現といふ社があつた。
  translation: '社の人がその鎖を解いて願いに任せる。そうして帰ると、猪や鹿が荒らすことはなくなる。その後、再び供物や神酒を奉納し、お礼の参詣をする。まことに珍しいことである。

    養父の五社大明神と妙見山との関係は、この記事にもまったく説明されていない。現在はもちろん二か所の信仰は別々に成り立っているので、それぞれの社伝や縁起の文章からつながりを見いだすのは不可能だろう。このような問題こそ、地元の人々の感覚について、今のうちにもう一度尋ねておく必要がある。水谷神社や夜夫坐神社五座が、仮に『延喜式』以来の旧跡のままだとしても、狼に関する信仰までが、ここに初めから根付いていたとは考えにくい。もし他所から移ってきたのなら、私は妙見山のほうからかもしれないと想像している。中国地方の霊山信仰には「妙見様」となっているものが多く、中でも養父・城崎両郡の境にある妙見山は、私の故郷あたりにも信徒が多かった。ここに、関東の三峰や出流山、または遠江の山住や春野山と同じ種類の信仰があったかどうかは、調べてもわからないということはないだろう。いつかそれによって私の仮説が当たっているかどうか、確かめたい。いずれにせよ、高木加門の妻が狼だったという話には、その土地の古い伝承が下地になっていたことが考えられる。加門塚と呼ばれる場所は、養父の狼の宮から川と小山を隔て、西北へ二里ほど行った所である。ここも宿南の本村から三谷という集落へ越える山道のそばで、もしかすると妙見山への一つの登山道だったのではないかと思う。三谷は現在ミタニと呼ばれているが、式内の水谷神社はここだったかもしれない。もし山奥の伝説が旅人に珍重され、しだいに平地の往来のほとりへ出てくる傾向が一般的なのだとすれば、山口の狼神社だけでなく、その近くにお猫様の宮があり、その場所が加地屋敷だったということも、注意すべき事実である。それを今、土地の人々はどう説明しているのか。詳しく比較してみたうえでなければ、土佐の野根山だけについて断定することはできないだろう。

    六　朝比奈氏の先祖

    狼を単に山の神の使いとするだけでなく、直接祭っている社も、但馬以外に多くある。そして中には、子供の保護者として拝んでいる例もあるので、加門の妻の物語が一度きりの思い付きではなく、由来のあるものだと、いっそう推察される。たとえば駿河志太郡の仮宿村には、東海道の岡部宿から十六町ほど離れた丘の上に、「内宮権現」という社があった。'

  section: 海神少童／龍宮小僧
  original: 此話も土地の人は知らなかつたが、やはり川の童と關係があるのであつた。北肥戰志の載する所に依れば、橘諸兄の孫兵部大輔島田丸、春日神宮造營の命を拜した時、內匠頭某といふ者九十九の人形を作り、匠道の祕密を以て加持するに、忽ちかの人形に火たより風寄りて童の形に化し、或時は水底に入り或時は山上に到り、神力を播し精力を勵まし召仕はれける間、思ひの外大營の功早く成就す。よつてかの人形を川中に捨てけるに、動くこと尙前の如く、人馬家畜を侵して甚だ世の禍となる。此事遙かに叡聞あつて、其時の奉行人なれば、兵部大輔島田丸、急ぎかの化人の禍を鎭め申すべしと詔を下さるゝ。乃ち其趣を河中水邊に觸れまはりしかば、其後は河伯の禍なかりけりとある。是よりしてかの河伯を兵主部(ヘウスべ)と名く。主は兵部といふ心なるべし。それより兵主部を橘氏の眷屬とは申す也とも謂つて居る。是は誠に取止めも無い空想のやうであるが、同じ由來談はミツチの古名と共に、旣に年久しくアイヌの間にも知られて居り、內地の方でも河太郞はもとは人形であつた故に、左右の腕が一本の棒の樣に拔け通つて居るのだと謂ふ處は少なくない。だから北肥戰誌が肥前潮見の城主澁江家の歷史として、斯ういふ俗說を敍べたのも作り事では無くて、少なくとも此書編修の當時の、肥前の澁江一族にはもうこの傳說が附いて居たのである。澁江といふ苗字は肥後にも筑後にもあるが、此家と河童との關係は深いものであつた。近世九州の各地で水難除けの護符を出し、若くは河童の祟りを攘ふ祈禱をしたといふ家は、尋ねて見ると多くは澁江氏であつた。前に掲げた橘島田丸の河伯統御なども、その一つの說明であつたかと思はれる。肥前の潮見では今でも河童は大工の弟子だと謂ひ、土地の風習として水難を除ける爲に大工の墨打ちをする器の絲を貰ひ受けて、小兒の足に纏ひ附けることがあるといふ(鄕土研究二卷七號)。河童が水の神信仰の零落の姿であるらしいことは、ずつと以前に私も山島民譚集に於て之を說いたことがあり、其後更に精細に論究して見ようとした人もある。遠州湖北の行基菩薩傳說が、我々に暗示する一つの點は、新宗教の干與がいつの場合にも、在來の信仰を出來るだけちつぽけな、且つ低級なるものに解釋せんとしつゝも、尙全然之を承認せずには居られなかつたといふことである。日本に妖怪變化の種類が多く、概して其根原の推測し難いものばかりであつたのは、一言でいふならば國教紛亂の永い歷史を反映するものに他ならぬのであつた。
  translation: '土地の人々は気づいていなかったが、この話もやはり川の童と関係していた。『北肥戦志』に記されているところでは、橘諸兄の孫、兵部大輔島田丸が春日神宮造営の命を受けたとき、内匠頭の某が九十九体の人形を作り、建築の秘術によって加持した。すると、たちまちその人形に火と風が寄り集まり、童の姿となった。あるときは水底に入り、あるときは山上へ登り、神力をふるい、精力を尽くして働いたので、思いのほか早く大工事が完成した。そこで、その人形を川に捨てたところ、以前と同じように動き、人や馬、家畜を襲って、大いに世を苦しめた。このことが遠く天皇のお耳に達し、「当時の工事責任者である兵部大輔島田丸は、急いで、あの化人の災いを鎮めよ」との勅命が下った。その趣旨を川中や水辺へ触れ回ると、それからは河伯の災いがなくなった、とある。

    さらに、これによって、その河伯を兵主部（ヘウスベ）と名づけた、「主」は兵部という意味であろう、それ以来、兵主部を橘氏の眷属というのだ、とも述べている。これはまことにとりとめのない空想のようだが、同じ由来話は「ミツチ」という古い名とともに、ずいぶん昔からアイヌの間にも知られていた。また内地にも、河太郎はもともと人形だったので、左右の腕が一本の棒のように抜け通っているのだ、という土地は少なくない。

    したがって、『北肥戦誌』が肥前潮見の城主渋江家の歴史として、こうした俗説を述べているのも、単なる創作ではない。少なくとも、この本が編まれた当時には、肥前の渋江一族に、すでにこの伝説が結びついていたのである。渋江という名字は肥後にも筑後にもあるが、この家と河童との関係は深かった。近世の九州各地で、水難よけの護符を出したり、河童のたたりを払う祈祷をしたりした家は、調べてみると多くが渋江氏だった。先に挙げた橘島田丸が河伯を統御した話なども、その説明の一つだったと思われる。

    肥前の潮見では、今も河童は大工の弟子だといい、土地の習わしとして、水難を避けるために、大工が墨打ちに使う道具の糸を譲り受け、幼い子の足に巻きつけることがあるという（『郷土研究』二巻七号）。河童が水神信仰の衰えた姿らしいということは、ずっと以前に私も『山島民譚集』で述べたことがあり、その後さらに詳しく論じようとした人もいる。

    遠江の浜名湖北岸に伝わる行基菩薩の伝説が、私たちに示唆するのは、新しい宗教の介入が、いつの場合にも、それまでの信仰を、できるだけちっぽけで低級なものとして解釈しようとしながらも、その存在をまったく認めずにはいられなかった、ということである。日本に妖怪変化の種類が多く、概して、その起源を推測しにくいものばかりだったのは、一言でいえば、この国の宗教が入り乱れてきた長い歴史を反映するものにほかならなかったのである。'
  notes:
  - 書名の「北肥戰志」「北肥戰誌」は本文の表記に従う。

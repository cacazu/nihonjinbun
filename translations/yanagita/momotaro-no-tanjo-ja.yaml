  section: 海神少童
  original: '中心を移さんとし、從つて以前の話の種は、必ずしも元通りの待遇を受けて居ないが、其爲

    に古く有つたものが悉く埋もれ、又は代られて居るとはきめられぬといふことである。近世

    は笑話と退治譚とが殊に數多く分化した時代であり、又若干の輸入說話のもてはやされた時

    代でもあつたが、前者は主として固有の「話の種」に據つて展開し、後者も亦今まで傳はつて

    居たものと結合調和して、實は追々に今日の基礎を作つたのであつた。だからさういふ新た

    に附加したことの判るものを取除いて行けば、跡には自然に我々の祖先の聽いて居た話の種

    の、濃厚に交つて居るものが殘る筈である。然るに日本で說話を研究して居るといふ者は、多

    くは外國の學者の言ふことに感心して、考へても見ずに昔話の國際的一致を信ぜんとし、中

    には自分の僅か知つた例だけによつて、忽ちそこの國から教へてでも貰つた樣なことをいふ

    者がある。是は其他のまだ調べて無い諸民族が、全部日本とちがつた說話しか持たぬときま

    つても、尙容易に推斷の出來ぬことであるのに、實際は盲蛇にそんな事をいつて居るのであ

    る。國々の昔話に意外な弘い一致のあること位は、學者などを賴まずとも書物は幾らも來て

    居り、索引も附いて居る。讀めば誰にでもすぐわかる。それよりも必要なのは、もつと有效

    にそれ等の索引類を利用して、明瞭なる共通分子を片脇に整理し、さて殘りの日本國內の生

    成發達の跡を視ることである。何等の改良も時代適應も考へずに、借りたら後生大事にいつ

    迄もそつと抱へて居ること、恰も當世の輸入學者の如きなまけ者は、我々の先祖の中には幸

    ひにして居なかつた。卽ち日本の昔話は、何千年かの昔から引續いて成長して居たのである。

    我々の昔話に對する深い興味は、主として其分布が何を語るかを知らうとするに在る。從

    つて經典から譯され、說教聖に學ばれて、支那天竺から來たといふだけならば、特に事新ら

    しく立證して貰はずともよいのである。寧ろ何でもかでも輸入だ舶來だと、概括せられるこ

    とを警戒する方が必要であつた。水の神の信仰を暗示するかと思ふ說話は、他の多くの國に

    も有るけれども、日本に傳はつたものだけは著しく型が違つて居る。少なくとも或特殊の部

    分が異常に行き進んで居る。たとへば小兒の誕生を水の神の靈威に托するといふだけの信仰

    ならば、偶合であれ、はた傳播であれ、異なる多くの民族にも共通であつたらう。たゞ日本

    は海の國、さうして又山川のたぎち流るゝ國であつたが故に、海には「うつぼ舟」の漂着した

    話、川には瓜子姫桃太郞の話などが、他には類の無い發達をしたのである。それから其小兒'
  translation: '中心を移そうとする。そのため、以前からの話の種は、必ずしも元どおりの扱いを受けていないが、だからといって、古くからあったものがすべて埋もれ、あるいは別のものに置き換えられたとは決められない、ということである。近世は、とくに笑い話や退治の話が数多く枝分かれした時代であり、また、いくつかの外国から入った物語がもてはやされた時代でもあった。しかし前者は、主に固有の「話の種」に基づいて展開し、後者も、それまで伝わっていたものと結び付き、調和することで、次第に今日の基礎を作ったのである。だから、そうした新たに加わったとわかるものを取り除いていけば、後には自然と、私たちの祖先が聞いていた話の種が、濃く交じったものが残るはずである。

    ところが、日本で物語を研究しているという人々の多くは、外国の学者の言うことに感心し、自分で考えてもみずに昔話の国際的な一致を信じようとする。中には、自分がわずかに知る例だけによって、たちまち、その国から教えてもらったかのように言う者もある。これは、まだ調べていないほかの諸民族が、すべて日本とは違う物語しか持たないと確定したとしても、なお簡単に推断できないことなのに、実際には、やみくもにそんなことを言っている。各国の昔話に意外なほど広い一致があることぐらいは、学者などに頼まなくても、本はいくらでも来ているし、索引もついている。読めば誰でもすぐわかる。それより必要なのは、そうした索引類をもっと有効に使い、明らかな共通要素を一方へ整理したうえで、残りのものが日本国内で生まれ発達した跡を調べることである。改良も時代への適応も考えず、借りてくればいつまでも後生大事に抱えておく、まるで今どきの学説輸入に頼る学者のような怠け者は、幸い私たちの祖先の中にはいなかった。つまり、日本の昔話は、何千年もの昔から成長し続けていたのである。

    私たちが昔話に深い関心を持つのは、主に、その分布が何を語るのかを知ろうとするからである。したがって、経典から翻訳され、説教をする聖たちが学び、中国やインドから来た、というだけなら、改めてことさら証明してもらう必要はない。むしろ何でも輸入だ、舶来だと、一括して片づけられることに警戒するほうが必要だった。水の神への信仰を示唆すると思われる物語は、ほかの多くの国にもある。しかし、日本に伝わったものは、ひときわ型が違う。少なくとも、ある特殊な部分が著しく発達している。たとえば、子供の誕生を水の神の霊力によるものとする信仰だけなら、偶然の一致であれ、伝播によるものであれ、多くの異なる民族にも共通していただろう。ただ、日本は海の国であり、また山々の川が激しく流れる国だったため、海には「うつぼ舟」が漂着した話、川には瓜子姫や桃太郎の話などが、ほかに例のない発達を遂げた。それから、その子供'

  section: 絵姿女房／七 殿様の無理難題・八 白介の翁
  original: '買つて來たといふ話がある。我々には一向をかしくも何とも無いが、斯ういふ判じ物や言

    葉の綾といふことには、聽き手の能力がすぐに反映する爲か、昔の村の人は多大の興味を持

    つて聽いて居た。だから時としては山寺の妖怪退治といふ樣な、九死一生の際にすら尙此種

    の問答の話があつた。それを段々と手輕にして、和尙と小僧の話に引直したか。但しは又其

    方から借りて來て、之を眞面目な話に挿入することになつたものか。何れにしても昔話が民

    間の娯樂になつてから、追々と其流行が廣まつたことは事實である。自分等の解する所では、

    此語りが說話の最も自由な部分で、寧ろ時には何か珍らしいものと入替へて、注意を新たに

    する必要があつた故に、末には此樣なる滑稽が全體の眞面目さを損ふやうになつたものと思

    ふ。同じ老媼夜譚の笛吹藤平の話などでも、美しい女房を殿樣が取上げようとして、色々の

    難題を言ひかけることになつて居る。それは灰繩を千把に打たぬ太鼓、天の雷神九つの頭を

    差出せといふのだが、是も女房が天に登つて、一人で才覺して來て殿樣をへこませる。紫波

    郡昔話第九五話では、美しい女房は天人の御姫樣であつたと謂つて居るが、羽衣を隱されて

    還れなくなつたといふ點は無い。是も笛吹藤平と同じ樣に、夫が殿樣の無體な命令に弱つて

    居ると、それをいと容易に其女房が解決してくれる。最初はやはり灰繩千把の獻上、次には

    天の雷神を連れ來れとの仰せで、よもや今度は降參したらうと思つて居ると、豈に圖らんや

    天上が御里であるので、早速箱に入れてその雷神を持參する。細目に箱の蓋をあけるとカラ

    カラコロコロこいつは面白いともう少し開くと、ガラガラピカピカといつて小雨が降つて

    來る。もう此以上は開いてはいけないといふのに、强ひて蓋を取放させたら雷が御殿中を暴

    れまはつた。流石の殿も是には恐れを爲し、以來は難題を申付ぬから、どうか連れて歸つて

    くれとあつて、それで夫婦の者も安堵したことになつて居る。卽ち單に繪姿飛來の中間の一

    節を除けば、話は著しく九州の西端にある「龍宮女房」と似て來るのみならず、一方には亦正

    史に採錄せられた、小子部栖輕の家の傳へとも、一線の脈絡を引いて居ることが知れるので

    ある。鳩が二つで一石六斗などの惡謔は、たしかに後代の笑話化ではあるが、何にせよ話は

    そもそもの最初から、爰を或種の空想の遊び場としてあつたのである。

    八白介の翁'
  translation: '買ってきたという話がある。私たちには少しもおかしくないが、こうしたなぞ解きや言葉のあやには、聞き手の理解力がすぐに表れるためだろうか、昔の村人はたいへん興味を持って聞いていた。だから、ときには山寺の妖怪退治のような、生きるか死ぬかという場面にも、この種の問答があった。それをだんだん気軽なものにして和尚と小僧の話に仕立て直したのか、それとも、そちらから借りてきて真面目な話に差し込むようになったのか。どちらにせよ、昔話が民間の娯楽となってから、その流行が次第に広まったことは事実である。

    私たちの理解では、このくだりは説話の中で最も自由な部分で、むしろ、ときには何か珍しいものと入れ替えて、聞き手の注意を新たにする必要があった。そのため、しまいには、このような滑稽さが全体の真面目さを損なうようになったのだと思う。

    同じ『老媼夜譚』の笛吹藤平の話などでも、殿様が美しい妻を取り上げようとして、いろいろな難題を言いつける。灰の縄を千把、打たない太鼓、天の雷神の九つの頭を差し出せ、というのだが、これも妻が天に昇り、一人で工面してきて、殿様をへこませる。

    『紫波郡昔話』第九五話では、美しい妻は天人のお姫様だったというが、羽衣を隠されて帰れなくなったという点はない。これも笛吹藤平と同じように、夫が殿様の無理な命令に困っていると、妻がとても簡単に解決してくれる。最初は、やはり灰の縄千把の献上、次には天の雷神を連れてこいとの命令である。さすがに今度は降参しただろうと思っていると、予想に反して、妻の実家は天上なので、さっそくその雷神を箱に入れて持ってくる。

    箱のふたを少し開けると、カラカラコロコロ。これは面白いともう少し開けると、ガラガラピカピカと鳴って、小雨が降ってくる。「もう、これ以上開けてはいけない」と言うのに、無理にふたを取り外させると、雷が御殿じゅうを暴れ回った。さすがの殿様も恐ろしくなり、「これからは難題を言いつけないから、どうか連れて帰ってくれ」と言い、夫婦も安心したということになっている。

    つまり、間に入る姿絵が飛んでくる一節を除けば、話は著しく九州の西端にある「竜宮女房」に似てくるだけでなく、他方では、正史に採られた小子部栖軽の家の伝承とも、一本のつながりを持つことが分かる。「鳩が二つで一石六斗」といった悪ふざけは、確かに後の時代に笑い話へ変わったものである。しかし、いずれにしても、この話はそもそもの初めから、この部分をある種の空想の遊び場としていたのである。

    八　白介の翁'
  notes:
  - 「灰の縄」は灰でできた縄という難題。「打たぬ太鼓」は原文どおりの難題名として訳した。
  - 「白介」の字形を原画像で確認。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。

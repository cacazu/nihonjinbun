  section: 隣の寝太郎／七 せやみ太郎兵衛
  original: たのを、一葉づつ缺いては食つて居た。段々に菜の葉が無くなつて、おしまひに引拔いて見たところが、其根の穴の中から酒の泉が湧き出した。せやみ太郞兵衞は之に由つて、忽ちにして大金持になつたといふ話。莊內では或はもう「是でどん〳〵拂ひ」であつたのかも知れぬが、此話は元は尙複雜であり、又弘く行はれて居たかと思ふ痕跡がある。たとへば老媼夜譚の山の神が赤子の運を定める話にも、後に長者になる女房が畠の大根を拔いて食ふと、其穴から泉酒が湧いたといふ一條がある。以前中道等君が報告した南部の豐川村の蕪燒笹四郞の話(旅と傳說二卷一〇號)なども、今になつて考へて見ると、やはり亦一つのセヤミ太郞兵衞であつた。笹四郞は親讓りの畠の蕪ばかりを燒いて食つて、米の飯を羨まうとしなかつたといふことになつて居るが、自身農作に働かなかつたは同じである。さうして中道君の記述には見えないが、爰でも其畠の蕪の穴から、酒が涌いたと語る人もある樣に聽いて居る。しかも似た點は單にそればかりで無く、此笹四郞も亦一種の智術を以て、長者の聟になつて居るのであつた。豐川村の若い者共は、蕪燒に一つ好い嫁を見つけて遣らうと言つて、每日山から白土を掘つて來て、之を大川に流し入れた。さうすると終に大川の水の色が白く濁つて、川下の湊の町の人が不審をする。湊一番の金持に娘があつて、それを笹四郎の嫁に貰ひに來た。若人たちが大川の水の色の急に白くなつたのは、今年始めて酒を造る笹四郞の酒倉で、數多の下女下男が米を磨いだ水だといふので、それに騙されて緣談を結んだと傳へて居る。是もちやうど又閉伊郡のならず者の友人等が、砂を俵につめて米俵と稱して運んだといふのと同じである。卽ち蕪を食つて日を送るやうな生活から、突如として酒屋になるといふ段は偶合では無ささうである。但し此話も前の大根畠の話も、共に花嫁の助言が緣となつて、不意に黃金を發見したといふ炭燒長者譚の系統に屬して居る。「炭燒長者」は普通には女性の管理する語り物となつて居た。寢太郎物草太郞のやゝ皮肉なる滑稽を以て、中古の盲法師若くは少なくとも男藝人の所業と想像して居る私には、是は又非常に興味深き新問題と言はなければならぬ。卽ら此等の說話を今日まで保存して居てくれた村々の傳承者には、能くこの男女二種の話術者の說く所を調合して、一つの話とするだけの力を持つて居たか。さうで無ければ同じ一つの題材を、最初からボサマもイタコも共に利用して居たものか、或は又雙方各自の語り物を
  translation: '……一枚ずつ葉を欠いては食べていた。だんだん菜の葉がなくなり、最後に引き抜いてみると、その根の穴から酒の泉が湧き出した。せやみ太郎兵衛は、そのおかげで、たちまち大金持ちになったという話である。

    庄内では、もう「これでどんどん払い」と話を終えていたのかもしれない。しかし、この話はもと、もっと複雑で、また広く行われていたのではないかと思わせる跡がある。たとえば『老媼夜譚』の、山の神が赤子の運命を定める話にも、後に長者になる妻が畑の大根を抜いて食べると、その穴から酒の泉が湧いた、という一節がある。以前、中道等君が報告した、南部の豊川村の蕪焼笹四郎の話（『旅と伝説』二巻十号）なども、今考えてみると、やはり一つのせやみ太郎兵衛だった。笹四郎は、親から譲られた畑の蕪ばかり焼いて食べ、米の飯を欲しがりもしなかったということになっているが、自分では農作業をしなかった点は同じである。そして中道君の記述には見えないが、ここでも、その畑の蕪を抜いた穴から酒が湧いたと語る人がいる、と聞いている。

    しかも似ているのはそれだけではなく、この笹四郎もまた、一種の策略によって長者の婿になった。豊川村の若者たちは、「蕪焼にひとつ、よい嫁を見つけてやろう」といって、毎日山から白土を掘ってきて、大川に流し込んだ。するとついに川の水が白く濁り、下流の湊の町の人々が不審に思った。湊一番の金持ちに娘がいて、その娘を笹四郎の嫁にもらいたいと申し込みにきた。若者たちは、川の水が急に白くなったのは、今年初めて酒を造る笹四郎の酒蔵で、たくさんの下女・下男が米をといだ水のせいだといった。その言葉にだまされて縁談を結んだ、と伝えている。これもちょうど、閉伊郡のならず者の友人たちが、砂を俵に詰め、米俵だといって運んだ話と同じである。

    つまり、蕪を食べて日を送る暮らしから、突然酒屋になるというくだりは、偶然の一致ではなさそうだ。ただし、この話も、前の大根畑の話も、ともに花嫁の助言をきっかけに思いがけず黄金を発見した、という炭焼長者の話の系統に属している。「炭焼長者」は普通、女性が保ち伝える語り物になっていた。寝太郎や物草太郎の、やや皮肉な滑稽さを、中古の盲法師、あるいは少なくとも男性芸人の仕事だと想像している私には、これはまた、非常に興味深い新たな問題だといわなければならない。すなわち、これらの説話を今日まで保存してくれた村々の伝承者には、男女二種類の語り手が語る内容をうまく混ぜ合わせ、一つの話にするだけの力があったのだろうか。そうでなければ、同じ一つの題材を、初めからボサマもイタコもともに利用していたのか。それとも、双方がそれぞれの語り物を……'
  notes:
  - 冒頭はscan158の引用の続き。末尾はscan160冒頭に続く。
  - どんどん払いは話を締めくくる定型句。ボサマは男性の盲人芸能者、イタコは女性の口寄せなどの宗教者を指す、原文の地域的呼称。

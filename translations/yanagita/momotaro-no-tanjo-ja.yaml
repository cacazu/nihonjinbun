  section: 田螺の長者／生きて居る小太郎
  original: 'ようとして居たのである。信府統記第十七には二つの異說を併せ錄して居るが、その一つに

    は東高梨の池の白龍王、犀龍と交はりて一子を生む。八峯瀨山にて誕生、日光泉小太郞と稱

    すとあり、他の一つには鉢伏山の權現、人倫と現はれて丸山に居住したまふ。そこに不思議

    の泉湧き出で、味ひ酒の如くにして人の饑を助け疲を養へり。誠に不老不死の泉とも云ひつ

    べし。國人悅ぶこと限りなし。かの權現の御子を泉小次郞と號す。生れながら常の人に非ず

    云々とあつて、今でも土地の者は小太郞でも小次郞でも、何れでもよい位に思つてゐる。

    私は是がどういふ機會に際して、鎌倉時代の勇士泉親衡の生ひ立ちの如く、解せらるゝに

    至つたかを知りたいと願つて居る。この誤解にも相應な理由は有つた筈で、それがわかつて

    來ると自然に或一つの說話の、流傳の實狀をも推測し得るからである。榊巷談苑は今から二

    百年餘り前の人の隨筆であるが、其中には次のやうな一節がある。

    信濃國犀川に犀のすみけるを、賴朝泉小二郞に命じて取らしめたりと東鑑に見えたり。

    昔はこの國に犀のありけるにや。又はことものを誤りて犀といひけるにや。

    ところが自分の捜して見た限りでは、吾妻鏡の中にはさういふ記事は見えない。吾妻鏡の泉

    小二郎親平は、信州の人であつただけは想像し得られるが、

    和田合戰の前つ方にちよいと現

    はれて、隱れてしまつたきりで更に消息を傳へて居ない。しかし此時代の人物と事蹟とは、

    曾我の兄弟は申すに及ばず、朝比奈三郞でも五十嵐小豐治でも、永く民間に記憶せられて、

    後益々その勇名を成長させた例が多いのである。歷史の泉小二郞がもし我々の想像の通り、

    信州の鄕土の英雄であつたとすれば、殊に越後の五十嵐小豐治と、其形蹟がよく似て居る。

    越後でも五十嵐川の上流に入つて見れば、今尙小文治の母の出たといふ村があり、父の大蛇

    の住んで居た池もあつて、豐後の緒形氏と略々同樣の口碑が、爰でもとぐろを卷いてその靈妙

    なる幼兒を、抱へ守り又大きくして居るのである。超凡の偉人と奇跡の信仰を結び付けるこ

    とは、東西古今を一貫する人類の慣習であつた。相異はたゞ之を疑はざる者の群落の大小だ

    けであつて、この筑摩の泉小次郞の如きは、たまたま統一の力の特に微弱な一例であつた。

    私は此事實の背後から、夙に小太郞說話が此地方に普及して、羽翼すでに成るといふ狀況に

    在つたことを推定する。親衡が幕府の命を受けて、犀川の犀を退治したといふ記事は、

    たとへ東鑑には無くとも盛長私記といふ類の、演義の小說の中には出て居たのかも知れない。而'
  translation: '――ようとしていたのである。『信府統記』第十七には二つの異説が併記されている。その一つには、「東高梨の池の白竜王が犀竜と交わって一子を産む。八峯瀬山で誕生し、日光泉小太郎と称する」とある。もう一つには、「鉢伏山の権現が人の姿で現れ、丸山に住まわれた。そこに不思議な泉が湧き出し、味は酒のようで、人の飢えを満たし、疲れを癒した。まことに不老不死の泉といってもよい。国の人々は限りなく喜んだ。その権現の御子を泉小次郎という。生まれながら普通の人ではなく……」とある。今でも土地の人は、小太郎でも小次郎でも、どちらでもよいくらいに思っている。


    私はこれが、どういう機会に、鎌倉時代の勇士、泉親衡の生い立ちのように解されるに至ったかを知りたいと思っている。この誤解にも相応の理由があったはずで、それがわかれば、自然に、ある一つの説話が広まり伝わった実情も推測できるからである。『榊巷談苑』は今から二百年余り前の人の随筆だが、そこには次の一節がある。


    「信濃国の犀川に犀が住んでいたのを、頼朝が泉小二郎に命じて捕らせたと『東鑑』にある。昔はこの国に犀がいたのだろうか。それとも、別のものを誤って犀といったのだろうか」。


    ところが私が探した限りでは、『吾妻鏡』にそのような記事は見当たらない。『吾妻鏡』の泉小二郎親平は、信州の人だったことだけは推測できるが、和田合戦の少し前にちょっと現れ、隠れてしまったきり、その後の消息は伝えられていない。しかし、この時代の人物と事績は、曾我兄弟はもちろん、朝比奈三郎でも五十嵐小豊治でも、長く民間で記憶され、後にはますます武勇の名声を大きくした例が多い。歴史上の泉小二郎が、私たちの想像どおり信州の郷土の英雄だったとすれば、特に越後の五十嵐小豊治と、そのあり方がよく似ている。


    越後でも五十嵐川の上流へ入ってみると、今も小文治の母の出身地という村があり、父の大蛇の住んでいた池もある。豊後の緒形氏とほぼ同じ口伝が、ここでもとぐろを巻き、その霊妙な幼児を抱いて守り、育てているのである。並外れた偉人と奇跡への信仰を結びつけることは、東西古今に共通する人類の習慣だった。違うのは、それを疑わない人々の集まりの大小だけで、この筑摩の泉小次郎などは、たまたま、話を一つにまとめる力が特に弱かった一例である。私はこの事実の背後に、早くから小太郎説話がこの地方に広まり、すでに十分な勢力を得ていた状況を推定する。親衡が幕府の命令を受け、犀川の犀を退治したという記事は、たとえ『東鑑』にはなくとも、『盛長私記』といった歴史を物語化した小説には出ていたのかもしれない。しかし――'
  notes:
  - 冒頭はスキャン132の続き。末尾はスキャン134へ続く。
  - 「親平」は底本の文字を拡大画像で確認し、そのまま残した。前後では「親衡」とある。
  - 小豊治・小文治、緒形の表記は底本に従う。
  - 書名「榊巷談苑」は原画像および国会図書館書誌で確認：https://ndlsearch.ndl.go.jp/books/R100000136-I1971993809696696711

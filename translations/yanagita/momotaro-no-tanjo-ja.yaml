  sequence: 239
- id: mmt-235-01
  scan: 235
  section: 狼と鍛冶屋の姥／古屋の漏り
  original: '歸つたで、今日は鬼の腕を取つて來たといふと、奧の間でうん〱唸つて居た婆が、どれどれ早う持つて來て見せろといふから、その針金のやうな毛の生えた腕を、婆さんの寢て居る所へ持つて行くと、婆さんは忽ち鬼婆の姿になり、いきなり其腕を引つたくつて是は俺の腕にちがひないと言ひながら、それを血がだら〱流れて居る自分の腕の切り口にくつつけて逃げて行つた。

    鬼婆が彌三郞の婆さを食つて化けて居たのであつた。

    床の下をめくつて見ると、鳥獸や人間の骨が積み重ねてあつた。

    今昔物語卷二七の獵師母成鬼擬瞰子語に於てば、難に遭うたのは兄と弟の二人、母の手は雁俣を以て射切つたことになつて居るだけで、母の寢所に其手を投込み、此は御手かと言つたとある點まで似て居るが、たゞ狼の群のみは參加して居ない。

    さうして話の繫ぎ目もこの「おいぬ繫ぎ」のやうに、まだ滿足には繫がつて居ないのである。

    私の所謂話の種の複合は、昔話全盛の世には決して珍らしいことで無かつた。

    たゞそれが或職業者の作爲でなく、普通家庭内の自然の變化であつた場合に、そこに興味ある前代人心理の史料を見出すのである。

    津村正恭の譚海といふ隨筆は、彼が天明八年の秋田旅行の後に成つたものと思はれるが、其中には可なり珍らしいあの地方の見聞が錄せられて居る。

    同書卷九にある次の一節などは、亦一つの稍々意外なる暗示であつた。

    仙北郡の人、薪を伐りて山より歸るとき、夕になり雨降り出でたれば、辻堂の椽に雨やどりせしが、堂の中に人聲きこえて賑はしく、暫しありて太郞婆未だ來らず、こたびの踊出來難からんなどいふ聲せしに、又暫しありて婆來れるとて踊りはじめんといふ。

    婆のいふやう、暫し待ちたまへ人やあるとて、堂の格子の穴より尾を出しかきまはしたるを、此男尾をとらへて外より引きたるに、內には引入れんとこずむに合せて、尾を引切りてもたりければ、怖ろしくなりて雨の霽るゝをば待たず、家に還りて此尾をば深く藏し置きたり。

    其後鄰家の太郞平なる者の母、痔起りたりとて打臥してある由、此男見舞ひに行きて見れば、誠に心わろく見えける。

    如何にといへば痔の痛む由をいふ。

    恠しくて夕に又件の尾を懷に匿して見舞ひに行きてければ、尙心あしとて居たりしかば、それは此樣なことの煩ひにては無きやと、尾を引出して見せければ、此母尾をかなぐり取りて、母屋を蹴破りてうせぬ。

    猫の化けたるにてぞありける。

    その母の骨は年經たるさま'
  translation: '――帰ったぞ。今日は鬼の腕を取ってきた」というと、奥の間でうんうんうなっていた婆が、「どれどれ、早く持ってきて見せろ」という。そこで、針金のような毛が生えた腕を、婆さんの寝ているところへ持っていくと、婆さんはたちまち鬼婆の姿になり、いきなりその腕をひったくって、「これは確かに私の腕だ」といいながら、血がだらだら流れる自分の腕の切り口につけ、逃げていった。鬼婆が弥三郎の婆さを食べて、化けていたのである。床をめくってみると、鳥や獣や人間の骨が積み重ねてあった。『今昔物語』巻二十七の「猟師の母、鬼と成りて子を食らおうとする話」では、災難に遭ったのが兄弟二人であり、母の手を雁股の矢で射切ったことになっているだけで、母の寝所へその手を投げ込み、「これはあなたの手ですか」といった点まで似ている。ただし、狼の群れだけは登場しない。そして話のつなぎ目も、この「おいぬ繋ぎ」のように、まだ十分うまくつながってはいないのである。

    私のいう「話の種の複合」は、昔話が盛んだった時代には、決して珍しくなかった。ただ、それがある職業人の作為ではなく、普通の家庭内で自然に起きた変化だった場合に、そこに昔の人々の心理についての興味深い資料を見いだすのである。津村正恭の『譚海』という随筆は、彼が天明八年に秋田を旅した後にできたものと思われるが、その中には、あの地方のかなり珍しい見聞が記されている。同書巻九の次の一節なども、また一つの、いくらか意外な示唆を与えてくれる。

    「仙北郡の人が薪を切って山から帰るとき、夕方になって雨が降り出したので、辻堂の縁で雨宿りしていた。堂の中には人声がしてにぎやかで、しばらくすると、『太郎婆はまだ来ない。今度は踊りができないだろう』などという声がした。またしばらくすると、『婆が来た』といって、踊りを始めようとした。婆は、『しばらくお待ちください。人がいはしないか』といって、堂の格子の穴から尾を出し、かき回した。この男がその尾をつかんで外から引くと、中では引き入れようとする。その動きに合わせて尾を引きちぎり、手に持ったところ、恐ろしくなって、雨がやむのも待たず家へ帰り、尾を奥深く隠しておいた。その後、隣家の太郎平という者の母が、痔を患ったといって寝込んでいるという。男が見舞いに行くと、いかにも具合が悪そうだった。どうしたのかと尋ねると、痔が痛むという。不審に思い、夕方、例の尾を懐に隠してまた見舞いに行くと、まだ具合が悪いといっていた。そこで、『それは、こういうことで起きた病気ではありませんか』と尾を取り出して見せると、この母は尾をひったくり、母屋を蹴破って消えた。猫が化けていたのだ。その母の骨は、長い年月がたった様子で――'
  notes:
  - 冒頭は234、引用の末尾は236へ続く。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第35頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。
  sequence: 240
- id: mmt-236-01
  scan: 236
  section: 狼と鍛冶屋の姥／古屋の漏り
  original: 'にて天井にありけるとぞ。

    以上の話を聽いて直ぐに思ひ出すのは、今も不思議に全國に行渡つて居る「古屋の漏り」といふ寓話めいた一篇である。

    私の日本昔話集にも其例を載せて置いたが、是が土地によつて詳略の二種になつて居る。

    雨の降る晩に虎狼といふ獸が、人を食はうと思つてとある古屋の軒に立聽きすると、內では老二人が寢もやらず話をして居る。

    「虎狼よりはモリ殿こそこはけれ」と言ふのを聽いて、さては此世の中には自分よりも强いモリといふ者が居るのかと、俄かに怖ろしくなつて逃げ去つたといふ話。

    私などが幼年の頃に聽いて居たのは、もう是だけを以て終つて居た。

    ところが九州でも又奥羽の遠い田舍でも、話は更に其後段があつて、此方に小兒は心を惹かれて居たのである。

    ちやうど其晩に馬盜人があつて、たつた一疋ある此家の瘦馬を盜まうとして忍び込んで居た。

    それが狼の足音を聞いて、馬が離れたと思つていきなり狼の背に飛乘る。

    狼の方ではそれを「古屋の漏り」といふ恠物だと心得て、足を限りに遁げ走つて行く。

    さうして空井戶に落ち、又は路傍の辻堂の前で乘手を落して、其まゝ辻堂の中に飛び込む。

    そのあとが話は又二通りにわかれて居て、狼が尻尾を盜人に把へられ、怖ろしさに夢中になつて尾を引切つて遁げたといふものが一つ、今一つは其場へ猿が來合せて、狼々そこで何をして居る。

    いやモリといふ天下一怖ろしい獸が、今おれに乘りかゝつて來て此中に飛込んで居るといふ。

    何が其樣なものが此世には有らうぞ。

    どれ私が見て遣らうと小賢しい猿は、長い〱尻尾を其中に差入れて探つて見る。

    空井戶の盜人は上りたい爲に、又辻堂の中の盜人なら怖ろしさの餘りに、格子の目から入つた尻尾をしかと摑んで放さない。

    猿は苦しがつて强く引くうちに、其尾が根元からぷつりと切れて、今の樣な形の尾になつてしまつた。

    卽ち又猿の尻尾はなぜ短かいかの、所謂なぜ話の一つの形になつてゐるのである。

    所謂古屋の漏りが狼よりもおつかない話などは、禪家か心學の說教にでもありさうな話で、其思ひ付きから見て少しも古いものでは無い。

    殊に小兒輩には貧窮の味などは解らぬから、そんな皮肉な寓意に悅喜する筈は無かつた。

    それで是非無く後段の魯かしい葛藤は附添へられたものと思ふが、しかも昔話らしく談る爲には、やはり古來の格調を踏襲しなければならなかつたのである。

    猿の尾はなぜ短かいの本筋の話といふのは、誰でも知つて居るやうに狐に欺かれて、寒中氷の底で魚を釣らうとした話である。

    是も猿の少ない北の方の田舎に行く'
  translation: '――天井裏にあったという。」

    以上の話を聞いてすぐ思い出すのは、今も不思議なほど全国に広まっている「古屋の漏り」という、寓話めいた一編である。私の『日本昔話集』にも例を載せておいたが、これは土地によって、詳しいものと短いものの二種類に分かれている。雨の降る晩、虎狼という獣が人を食おうと思い、ある古い家の軒先で立ち聞きすると、中では老人二人が眠りもせず話をしている。「虎狼よりもモリ殿の方が怖い」といっているのを聞いて、「さてはこの世には、自分より強いモリという者がいるのか」と、急に恐ろしくなって逃げ去ったという話である。私などが幼いころに聞いたものは、これだけで終わっていた。ところが、九州でも奥羽の遠い田舎でも、話にはさらに後半があり、子どもたちはそちらに心を引かれていたのである。ちょうどその晩、馬泥棒が、この家に一頭だけいる痩せ馬を盗もうと忍び込んでいた。泥棒は狼の足音を聞くと、馬が離れたのだと思って、いきなり狼の背へ飛び乗った。狼の方は、それを「古屋の漏り」という怪物だと思い、全速力で逃げ走っていく。そして空井戸に落ち、あるいは道端の辻堂の前で乗っていた者を振り落とし、そのまま辻堂の中へ飛び込む。その後は、話がまた二通りに分かれる。一つは、狼が泥棒に尻尾をつかまれ、恐ろしさのあまり夢中になって尾を引きちぎって逃げた、というもの。もう一つは、その場に猿がやって来て、「狼、狼、そこで何をしている」と尋ねると、「いや、モリという天下一恐ろしい獣が、今、俺に乗りかかってきて、この中へ飛び込んでいる」という。「なに、そんなものがこの世にいるものか。どれ、私が見てやろう」と、こざかしい猿は、長い長い尻尾を中へ差し入れて探ってみる。空井戸の中の泥棒は上りたいために、また辻堂の中の泥棒なら恐ろしさのあまりに、格子の目から入った尻尾をしっかりつかんで離さない。猿は苦しがって強く引くうちに、尾が根元からぷつりと切れ、今のような形の尾になってしまった。つまり、これも「猿の尻尾はなぜ短いか」という、いわゆる「なぜ話」の一つの形になっているのである。

    いわゆる古屋の漏りが狼より恐ろしいという話などは、禅宗か心学の説教にでもありそうな話で、その着想から見て、少しも古いものではない。ことに子どもたちは貧乏の苦しみなどわからないのだから、そのような皮肉な寓意に喜ぶはずはなかった。そこでやむなく、後半の愚かしい騒動が付け加えられたのだと思う。しかし、昔話らしく語るためには、やはり昔からの型を受け継がなければならなかった。「猿の尾はなぜ短い」の本筋の話とは、誰も知っているように、狐にだまされて、真冬に氷の下で魚を釣ろうとした話である。これも猿の少ない北方の田舎へ行く――'
  notes:
  - 冒頭は235の引用の続き、末尾は237へ続く。
  - 原文内では辻堂に飛び込む主体の叙述に揺れがあるため、訳で筋を補正せず、そのまま残した。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第36頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

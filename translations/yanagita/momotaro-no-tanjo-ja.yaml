- id: mmt-253-01
  scan: 253
  section: 和泉式部の足袋／五 雨乞小町など
  original: '次には美濃山縣郡嚴美村大字岩井の藥師堂、本尊を鹽藥師と稱し、因幡の岩井山の湯の藥師爰に飛來したまふと緣起に見え、現在は國寶に編せられて居る。

    一名を俗に瘡神と謂ひ、小町夢の御告を受けて、堂の東三町ばかりに在る名水に浴して瘡の疾を治したと傳へ、今尙婦人の疾を禱り又此泉に汲む者が多い。

    しかも小町が祈願中に、不平を訴へた歌として南無藥師衆病悉除の願しめて佛を祈る身こそつらけれ之に對して如來の御返歌村雨はしばしばかりのものなるにおのがみのかさそこに脫ぎおけといふ二首を傅へて居る。

    次に今一つ、上州北甘樂郡小野村大字後賀の鹽藥師堂、小野小町此地に居住し鹽を奉納したと言ひ傅へ、其他小町に因みある口碑が色々とある。

    文政十三年の二月、此村の住人塚本忠右衞門、之を再興して記念の石碑を建てた。

    さうして其石の面に次のやうな二首を刻んで居る。

    南無藥師先づは諸願の叶はずば身より佛の名こそ惜しけれむらさめは只一時のものぞかしおのがみのかさこゝにぬぎおけ同じ話は他の地誌にもあつたやうに思ふが、私は是を北甘樂郡史から抄錄した。

    五國五箇所の藥師のうちで、四つまでが小野小町といふことになつて居るが、それは單にこの二人の女詩人が紛れやすく、且つ小町の方がより多く有名であつた爲かも知らぬ。

    少なくともそれだから實は小町の逸話だつたといふことも出來ぬやうである。

    江戶には其角の「田を三圍りの神ならば」の句もあつて、小町の雨乞の歌はよく人に知られて居るが、是が亦以前は和泉式部の名吟として語られたこともあつた。

    たとへば安樂菴策傳の醒睡笑卷八に、勅によつて和泉式部雨請日の本の名に合ふとてや照すらん降らざらば又あめが下かは日の本といふから照るのであらうが、そんなら又あめが下といふのだから降るのが當り前だといふ意味で、滑稽としても下品であることは同じだが、是を一方の「さりとては又あめが下とは」に比べると、所謂文法の誤つて居ないだけでも優つて居る。

    しかも尋常の聽衆には前の方の歌は意味が取りにくくて、後の「ことわりや」の方がよく解つたといふ時代もあつた'
  translation: '次は、美濃山県郡厳美村大字岩井の薬師堂である。本尊を塩薬師と称し、因幡の岩井山の湯の薬師がここへ飛んで来られたと縁起にあり、現在は国宝に指定されている。俗に瘡神ともいい、小町が夢のお告げを受け、堂から東へ三町ほどのところにある名水で身を洗い、瘡の病を治したと伝えられる。今も、女性の病の平癒を祈り、またこの泉の水をくむ者が多い。しかも、小町が祈願中に不平を訴えた歌として、

    『南無薬師。あらゆる病を取り除くという誓いを示しておられるのに、その仏に祈る私の身は、なんとつらいことか。』

    これに対する如来の返歌として、

    『村雨はほんのしばらくのものなのに。自分の蓑と笠を、そこへ脱いで置きなさい。』

    という二首を伝えている。

    次にもう一つ、上州北甘楽郡小野村大字後賀の塩薬師堂がある。小野小町がこの土地に住み、塩を奉納したといい、そのほか、小町にちなむ言い伝えがいろいろある。文政十三年二月、この村の住人、塚本忠右衛門がこれを再興し、記念碑を建てた。そして石の面に、次のような二首を刻んでいる。

    『南無薬師。もしもさまざまな願いがかなわないのなら、私の命よりも、仏の名声が損なわれるのが惜しいことです。』

    『村雨はほんの一時のもの。自分の蓑と笠を、ここへ脱いで置きなさい。』

    同じ話はほかの地誌にもあったと思うが、私はこれを『北甘楽郡史』から抜き出した。

    五つの国の五か所の薬師のうち、四か所までが小野小町の話になっている。しかしそれは、単にこの二人の女性歌人が混同されやすく、小町の方がもっと有名だったためかもしれない。少なくとも、それを理由に、もともと小町の逸話だったとはいえないようである。江戸には其角の「田を三囲りの神ならば」という句もあり、小町の雨乞いの歌はよく知られているが、これもまた、以前には和泉式部の名吟として語られたことがあった。たとえば安楽庵策伝の『醒睡笑』巻八には、

    勅命により、和泉式部が雨乞いをする。

    『「日の本」という名に合わせて太陽は照るのだろうか。だが雨が降らないのなら、ここは「天が下」、つまり「雨が下」ではないのか。』

    とある。「日の本」というから照るのだろうが、それなら「天が下」ともいうのだから、雨が降って当然だ、という意味で、滑稽としても品がよくないのは同じである。ただ、これをもう一方の「そうはいっても、また天が下とは」という歌に比べれば、いわゆる文法を間違えていないだけでも優れている。しかし、普通の聞き手には、前の歌は意味を取りにくく、後の「ことわりや」で始まる歌の方がよくわかった、という時代もあった――'
  notes:
  - 末尾は254へ続く。
  - 『現在は國寶』などは昭和17年版本文が述べる当時の状態であり、現在の指定状況を確認したものではない。
  - 其角の句は原文が部分引用のため、訳でも全句を補わず部分だけを示した。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第53頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

  section: 田螺の長者／四 タミナの婿とツブの長者
  original: '島を征伐に出かけることになつて、縫針の劒に麥稈の柄鞘をこしらへて腰に佩き、笹舟

    に帆をかけて海に乘出した。鬼が島では鬼が晝寢をして居る所を見すまして、鼻の穴か

    ら飛び込んで中で大いにあばれ、忽ち鬼を殺して寶物を分捕して來た。その色々の寶物

    の中に打出小槌がある。それを打つて願ひ事をすれば何でもかなふから、先づ最初にそ

    れを手に執つて、「立派な男になれ」と言つて打つと、果して長者の美しい娘にも、過ぎ

    る位の立派な花聟になつた(榊木敏君報)。

    今一つの話は陸中の中部で採集せられたもので、此地方では田螺をツブと謂つて居る。東

    北の採集事業は旣に進んで居るから、一番早く此例も手に入つたのではあるが、勿論分布は

    決して是だけに止まらぬことと信ずる。

    昔ある處に長者どんの田を作つて、貧乏な暮しをする百姓、貧乏は仕方が無いが四十を

    越すまで子の無いのが淋しいと歎いて居ると、女房もそれを悲しがつて、御水神樣に願

    掛をした。やがて姙娠して生れたのが小さなツブ(田螺)の子であつた。夫婦は驚いたが

    是は御水神樣に授かつた子供だと、缺椀に水と砂とを入れて其田螺の子を中に入れ、大

    事に神棚に上げて置いた。斯うしてざつと二十年も經つたが、ツブの子はちつとも大き

    くならず、いつも缺椀の中で遊んで居た。さうして父と母とは其間にすつかり年を取つ

    た。秋になつて年貢米を馬に附けて長者どんへ持つて行かうとして、爺は獨り言を言つ

    た。折角御水神樣から授つた子供は、何といふ事だかあんな小蟲の田螺だ。あれが當り

    前の人間であつたら、斯ういふ時に俵でも附けて助けてくれるだらうにと謂ふと、婆も

    本當にあんな子供をなして、おら父さ申譯が無いと、共々に不運を悲しんで居た。さう

    すると不意に神棚の缺椀の中から、とゞもかゞもさう歎くな。おれもはあ缺椀の中に居

    るのがとつくりと厭になつた。是から一つ椀から出て、うんと働いてやるべ。どれどれ

    今日は旦那樣の處さはおれが行くべえや。おれを其馬の中荷の上へ載せておくれあれと、

    つぶの息子が言ひ出した。夫婦は之を聽いて魂消たけれども、とにかく斯んな子が物を

    言ふやうになつたのは嬉しいと思つた。それに御水神樣の申し兒だから、どんな事をする

    か知れない。物は試しだと思つて、つぶを缺椀の中から拾ひ上げて、三疋の馬の先立ち

    馬の中荷の上に乘せて遣つた。ツブの息子は馬の背から、はいはいと謂つたりしつしつ'
  translation: '――島を征伐しに出かけることになり、縫い針の剣に麦わらの柄と鞘をつけて腰に差し、笹舟に帆を張って海へ乗り出した。鬼ヶ島では、鬼が昼寝をしているところを見定め、鼻の穴から飛び込んで中で大暴れし、たちまち鬼を殺して宝物を奪ってきた。さまざまな宝物の中に、打ち出の小槌がある。それを振って願いごとをすると何でもかなうので、まず最初に手に取り、「立派な男になれ」と言って振ると、果たして、長者の美しい娘にももったいないほど立派な花婿になった。（榊木敏君の報告）


    もう一つは、陸中の中部で採集された話で、この地方では田螺をツブと言っている。東北の採集事業はすでに進んでいるため、この例もいちばん早く手に入ったのだが、もちろん分布は決してこれだけにとどまらないと信じている。


    昔あるところに、長者どんの田を作り、貧しい暮らしをしている百姓がいた。「貧乏は仕方がないが、四十を過ぎるまで子どもがいないのは寂しい」と嘆いていると、妻も悲しんで、水神様に願掛けをした。やがて身ごもり、生まれたのは小さなツブ、田螺の子だった。夫婦は驚いたが、水神様から授かった子どもだと、欠けた椀に水と砂を入れ、その中に田螺の子を入れ、大切に神棚へ上げておいた。こうして、およそ二十年がたったが、ツブの子は少しも大きくならず、いつも欠け椀の中で遊んでいた。その間に父と母はすっかり年を取った。


    秋になり、年貢米を馬に積んで長者どんのところへ持っていこうとして、おじいさんは独り言を言った。「せっかく水神様から授かった子が、どうしたことか、あんな小さな虫の田螺だ。あれが普通の人間なら、こんな時には俵を積むのでも手伝ってくれるだろうに」。おばあさんも「本当に、あんな子を産んで、私はお父さんに申し訳ない」と、二人で不運を悲しんでいた。すると突然、神棚の欠け椀の中から、ツブの息子が言い出した。「父さんも母さんも、そんなに嘆くな。おれも、もう欠け椀の中にいるのはすっかり嫌になった。これからひとつ椀から出て、うんと働いてやろう。どれどれ、今日は旦那様のところへ、おれが行こう。おれをその馬の、真ん中の荷の上へ乗せておくれ」。夫婦はこれを聞いて仰天したが、ともかく、こんな子が口をきくようになったのはうれしいと思った。それに水神様の申し子なのだから、どんなことをするかわからない。物は試しと、ツブを欠け椀から拾い上げ、三頭のうち先頭の馬の、真ん中の荷の上へ乗せてやった。ツブの息子は馬の背から「はいはい」と言ったり、「しっしっ」――'
  notes:
  - 冒頭はスキャン126の引用の続き。末尾はスキャン128へ続く。
  - 引用の「約二十年」と後の「十八歳」の不一致は原文のまま。報告者名「榊木敏」は拡大画像で確認した。

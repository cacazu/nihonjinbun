- id: mmt-102-01
  scan: 102
  section: 瓜子織姫／天之探女
  original: 'と思ふと、又山姥がそれを言ひあてる。これは喰殺されるこつたと思つて居ると、それも亦

    圖星をさゝれる。途法にくれてしまつて默つて箕の輪を曲げて火にあぶつて居たところが、

    その輪に火がついて彈けてしたゝかに灰を山姥にふりかけた。是は不覺をしたと叫んで外に

    飛出し、笹原にころげ込んでうん〳〵と唸つて居たといふ點は、白い石を火に燒いて、餅と見

    せかけて食はせたといふ話も同じ結末である。是を或は桶屋が竹を伐りに山に入つてとも、

    炭燒が炭俵の輪を曲げて居たらともいふ人があるさうだが(昔話號三五頁)、尙私たちには小赤

    阪の彥太郞がといふ方を、話の成立ちも判つて面白く感じられる。彥といふ名の親爺は、屢

    斯ういふ飛んでも無い話の主人公になつて居る。玆でも恐らくは世間師の桶屋と同じく、昔

    話を自分の經歷の樣に誠しやかに話すことによつて、彥太郞の名を得た一人の話好きがあつ

    たのであらう。

    羽後の角館にも五右衞門といふ樏造りがあつて、曲げて居た小柴の手を放して、狢を彈

    き殺したといふ話が傳はつて居る(聽耳草紙一〇五頁)。信州でも北安曇郡の山村に、飛驒とよ

    く似た例が二つある。其一つは竹取り男と山男の問答(小谷口碑集一四七頁)、今一つは狸が美

    しい女に化けて炭燒の小屋に現はれ、是もかんじきを造る爲に炙つて居たヂシヤの木が、片

    方の手から離れて圍爐裏の火をはね掛けたことになつて居るが(鄕土誌稿一卷八九頁)、狸も山

    男も共に人の意中を洞察しながら、何心無くした事には嚇かされて、敗亡したといふだけは

    どれも同じで、成るほど後に道話にでもなりさうな、ちよつと考へさせられる面白い思ひ付

    きではあつた。しかも此話の變化と分布の狀態とを見ると、何か都會の心學以外に、之を普及

    せしめた動機のあつたことはほゞ確かで、それを私などは山彥やアマノジヤクの、人の言葉

    に口返しするといふ、經驗に出でたものかと想像して居るのである。今まで此昔話が採集せ

    られたのは、大體に山に寄つた地方が多かつた。甲斐昔話集には、是をオモヒといふ山中の

    魔物と誌して居る。樵夫が割つて居る木のこつぱが飛んで眼に當り、「思ふ事よりも思はぬこ

    との方が怖い」と言つて、どん〳〵向ふの山へ遁げて行つたなどといふ話があるから、オモヒ

    といふ名前は多分それに基づいて居るのである。三河の北設樂から信州伊那の谷にかけては、

    是をサトリ男と謂つて山男の一種のやうに考へて居た。是も人間に近よつて其心の中を覺る

    が、時々は人の無心の所行に驚かされて、其方は誠に覺りきれぬことをする奴ぢやと言つて、'
  translation: 'と思うと、また山姥がそれを言い当てる。これは食い殺されるぞと思っていると、それも図星をさされる。途方に暮れ、黙って箕の輪を曲げながら火にあぶっていたところ、輪に火がついてはじけ、山姥に大量の灰を浴びせた。「これは油断した」と叫んで外へ飛び出し、笹原へ転がり込んで、うんうんうなっていたという。この点は、白い石を火で焼いて餅に見せかけ、食べさせたという話でも同じ結末になっている。これを、桶屋が竹を切りに山へ入ったときのこととも、炭焼きが炭俵の輪を曲げていたときのこととも話す人があるそうだが（『昔話号』三五ページ）、私たちには、やはり小赤阪の彦太郎の話だという方が、話の成り立ちもわかって面白く感じられる。彦という名のおやじは、しばしばこのようなとんでもない話の主人公になっている。ここでもおそらく、世間慣れした桶屋と同じように、昔話を自分の経験らしく、まことしやかに語るために、「彦太郎」の名を得た話好きの人が一人いたのだろう。

    羽後の角館にも、五右衛門というかんじき作りがいて、曲げていた細い柴を手放し、狢をはね飛ばして殺したという話が伝わっている（『聴耳草紙』一〇五ページ）。信州でも、北安曇郡の山村に、飛騨の話によく似た例が二つある。一つは竹取り男と山男の問答（『小谷口碑集』一四七ページ）、もう一つは狸が美しい女に化け、炭焼き小屋に現れる話だ。こちらも、かんじきを作るため火にあぶっていたヂシャの木が片方の手から離れ、囲炉裏の火をはねかけたことになっている（『郷土誌稿』一巻八九ページ）。狸も山男も人の胸の内を見通しながら、何気なくしたことには驚かされて敗れる、という点はどれも同じだ。なるほど、のちに道徳的な説話にもなりそうな、少し考えさせられる面白い着想ではあった。

    しかも、この話の変化と分布を見ると、都市の心学とは別に、これを広めた動機が何かあったことは、ほぼ確かだ。私はそれを、山彦やアマノジャクが人の言葉に口答えするという経験から生まれたものではないかと想像している。これまでこの昔話が採集されたのは、だいたい山に近い地方が多かった。『甲斐昔話集』には、これをオモヒという山中の魔物として記している。木こりが割っている木の木っ端が飛んで目に当たり、「思ってすることより、思わずにすることの方が怖い」と言って、どんどん向こうの山へ逃げていったという話があるから、オモヒという名は、おそらくそれに由来する。三河の北設楽から信州の伊那谷にかけては、これをサトリ男といい、山男の一種のように考えていた。これも人間に近づいて心の中を読み取るが、時には人の何気ない行動に驚かされ、「おまえは本当に読み切れないことをするやつだ」と言って、'
  notes:
  - 冒頭はscan101、末尾はscan103へ続く。
  - 樏造りには「かんじきつくり」の振り仮名。かんじきは雪上などを歩くため履物につける輪形の道具。
  - 狢（むじな）と狸は原文で区別されているため、その区別を保持。心学は近世の庶民向け倫理教育を指す。

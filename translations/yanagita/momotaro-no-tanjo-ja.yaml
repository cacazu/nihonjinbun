  original: 童話集一六八頁に「三人男の望み」と題した一話は、石井氏の國民童話を轉載したものであつて、しかも肝腎な點を誤つて寫して居る。昔丹波國の大百姓の下男が三人集まつて、各身の望みを言ひ合つた。一人は三日でよいから旦那のやうな暮しがしたいと言ひ、今一人は籠に三杯の銀がほしいと言つた。三人目の下男は杢藏といふ名であつたが、これは主人の娘の櫻花を女房にしたいと言つた。旦那はそれを聞いて前の二人には望みを叶へてやり、次に杢藏の望みを娘の櫻花に話してきかせると、娘はおこつて斯ういふ歌を詠んだ。天より高い櫻の花を心がけなよこら杢藏そこで杢藏は其返歌として、越後で言つて居るのと同樣の歌を詠み、それに主人が感心してしまつて、早速に娘の聟としたといふので、判りきつたことだがモクゾとは塵芥のことであつた。それを杢藏といふ男の名に引掛けたところが、下品ながらも此昔話の山であり、又聽衆の興を催す點であつた。然るに松村君の童話集の如きは、わざ〳〵男の名だけをかへて末藏として居る。それでは何に感心したやら、話の筋は一向に通らぬわけである。此種の昔話は昔とても、實は決して童話では無かつた。たゞ或時代の村々の杢藏階級に取つて、所謂高根の花が散つてモクゾの下になるといふことが、可なり愉快なる空想であつた爲に、遠くは北國の田舍までも、此形を以て行渡つて居たのである。播州の加東郡などにも是と同樣な杢藏求婚談は行はれて居るさうだが(旅と傳說四卷三號)、別に尙それと併行して、攝州山田村の源右衞門の話といふものもあつた(同誌三卷七號)。源右は京に上つて或貴族の家に仲間奉公をして居た際に、庭掃除をしながら二人の朋輩と願ひごとを語り合つた。それを殿樣が立聽きして居て、一人には一樽の白味噌を、今一人には笊一ぱいの小判を望みの通りに取らせ、此家の御姫樣を女房に欲しいと言つた山田村の源右衞門には、姫と歌合戰をして勝つたなら願ひをかなへようと仰せられた。其時の名歌といふのが亦超越しきつたもので、內容はほゞ能登國の例と似て居た。なにをくそ、くそがらす、高きの空に目をかけるな是が先づ姫御前の方の歌であり、源右はその返歌として、くそ鳥とて空飛ぶときは九重の塔も下に見るといふ一首を詠じ、首尾よく姫を伴なうて在所に還つたといふのだが、此勝負には負けても
  translation: '……童話集』百六十八頁の「三人男の望み」という一話は、石井氏の『国民童話』を転載したもので、しかも肝心な点を間違えて写している。昔、丹波国の大百姓の下男三人が集まり、それぞれの望みを語り合った。一人は、「三日でいいから旦那のような暮らしをしたい」といい、もう一人は「籠に三杯の銀が欲しい」といった。三人目の下男は杢蔵という名で、「主人の娘の桜花を妻にしたい」といった。旦那はそれを聞いて、前の二人の願いをかなえてやった。次に杢蔵の願いを娘の桜花に話すと、娘は怒って、こういう歌を詠んだ。

    「天よりも高い桜の花を、望んだりするな、おい杢蔵」

    そこで杢蔵は、その返歌として越後の話と同じような歌を詠んだ。それに主人が感心して、すぐに娘の婿にした、というのである。わかりきったことだが、「モクゾ」は塵やごみをいう。それを杢蔵という男の名に掛けたところが、下品ではあっても、この昔話の山場であり、聴衆を面白がらせる点だった。ところが松村君の童話集では、わざわざ男の名だけを変えて「末蔵」にしている。それでは、何に感心したのかわからず、話の筋がまったく通らない。

    この種の昔話は、昔でも、実は決して子ども向けの話ではなかった。ただ、ある時代の村々の杢蔵のような階層にとって、いわゆる高嶺の花が散って塵の下になる、ということが、かなり愉快な空想だったため、遠く北国の田舎まで、この形で行き渡っていたのである。播州の加東郡などにも、同じような杢蔵の求婚の話が伝わっているそうだ（『旅と伝説』四巻三号）。しかし、それと並んで別に、摂州山田村の源右衛門の話もあった（同誌三巻七号）。源右は京都へ上って、ある貴族の家で下働きの奉公をしていたとき、庭掃除をしながら二人の仲間と願いごとを語り合った。殿様がそれを立ち聞きしていて、一人には一樽の白味噌を、もう一人には笊いっぱいの小判を、望みどおりに与えた。この家のお姫様を妻にしたいといった山田村の源右衛門には、姫と歌合戦をして勝ったら、願いをかなえよう、とおっしゃった。

    そのときの名歌というのが、また途方もないもので、内容はほぼ能登の例に似ていた。

    「何を、くそめ、くそ烏め。高い空を狙ったりするな」

    これがまず姫御前の歌で、源右は返歌として、

    「くそ鳥だって、空を飛ぶときには、九重の塔さえ下に見る」

    という一首を詠み、うまく姫を連れて故郷へ帰ったという。この勝負には負けても、……'
  notes:
  - 冒頭はscan167末尾の書名の続き。末尾はscan169冒頭に続く。
  - 杢蔵・末蔵、モクゾ・もくずの違いは著者の論証の対象なので保持した。九重には高い塔と宮中を連想させる働きがある。

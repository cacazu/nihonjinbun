  section: 田螺の長者／かしこ淵
  original: 'るに至つたのである。

    新井白石の折焚く柴の記に、誰でも覺えて居る一つの昔話がある。河村某といふ富人が彼

    を聟にとり、三千兩の黄金を與へて學問の料となさんと言つた時に、譬を設けて之を辭した

    といふ條である。

    我むかし或人の申せしことを聞きしに、夏の頃靈山とかに遊びし者どもの中、池に足浸

    し居けるに、小なる蛇の來りて其足の大指を舐しきるあるが、忽ちに去りては又忽ちに

    來りて舐る。かくするがうちに其蛇漸うに大きくなりしにや。後には其大指を呑むばか

    りになりしかば、腰より小刀を取出して刃の方を上になして大指の上に當てゝ待つ。又

    來りて大指を呑まんとする所を、あげざまにさし斬りたりければ、うしろざまに飛去る

    ほどに、家にかけ入りて障子をさす。伴なひし者ども何事にやといふ程こそあれ、石走

    り木倒れて地震ふこと半時ばかり過ぎて後に、障子を細めにあけて見けるに、一丈餘の

    大蛇の、唇の上より頭のかた迄一尺餘り切られたるが、斃れ死したりといふことあり。

    その事のありや無しやは未だ知らねど、今のたまふことに似たる所の侍るなり云々。

    此話は最初才藻に富みたる若き白石が、

    作り設けた譬へごとの樣にも思はれ、さも無くば

    支那の書物に出て居たのを、

    靈山の池の夕涼みに托したもの位に我々も想像して居たが、實

    際は其頃旣に知られて居た語り草であつたらしいのである。

    殊に東京の周圍の地では、今で

    も知つて居る人が折々あつて、

    たとへば私の住所から程遠からぬ北澤村などでは、是を或一

    つの小池の傳說として語り傳へて居る。昔この池の畔で、

    農夫が一疋の蛇を見て、鎌をつき

    つけて嚇したところが、

    其蛇忽ち形相憤怒して見て居るうちに大きな蛇になつた。農夫夢中

    になつて鎌をふりまはし、大蛇の腮の骨を切落したといふのは、

    どうやら話の順序が逆にな

    つて居るやうな氣がする。

    大蛇になつてしまつてから腮を斬放すなどは容易な仕事で無いか

    らである。兎に角にこの北澤村の小池が、

    井の頭の辨天の御池と、地下に通うて居ることは

    此時にわかつたのださうである。腮を斬られた大蛇は、

    その水路を潜つて井の頭へ遁げ還つ

    て死んだ。其爲に此池の淸水が三日三夜の間、

    眞赤に色を變じたといふ話である。新宿の町

    に接した柏木の村にも、之と全然同じ話があつて、

    柏木と中野との境を流るゝ小川の岸、

    立間山といふ處で此事が有つたといふ。立間は今ちやうど東中野の電車驛の有る邊であつた。'
  translation: '――ことになったのである。


    新井白石の『折たく柴の記』には、誰もが覚えている一つの昔話がある。河村という富豪が白石を婿にし、黄金三千両を与えて学問の費用にしようと言った時、たとえ話を持ち出して断った、というくだりである。


    「私は昔、ある人からこんな話を聞いた。夏ごろ、霊山とかいうところへ遊びに行った人々のうち、一人が池へ足を浸していた。小さな蛇が来て、その足の親指をしきりになめ、さっと去っては、またすぐ来てなめる。そうするうち、その蛇が次第に大きくなったのだろうか、後には親指をのみ込むほどになった。そこで腰から小刀を出し、刃を上にして親指に当て、待っていた。また来て親指をのもうとしたところを、上へ向かって突き切ると、蛇は後ろへ飛びのいた。その間に家へ駆け入り、障子を閉めた。同行者たちが、何ごとかと言う間もなく、石が飛び、木が倒れ、地面が震えること半時ほど続いた。後で障子を細く開けてみると、一丈余りの大蛇が、唇の上から頭の方まで一尺余り切られて、倒れて死んでいたという。このことがあったのかなかったのか、まだわからないが、今おっしゃることには、それに似たところがございます」などというのである。


    この話は初め、文才豊かな若い白石が作ったたとえ話のようにも思われた。そうでなければ、中国の書物に出ていたものを、霊山の池での夕涼みという設定に置き換えた程度に、私たちも想像していた。しかし実際には、そのころすでに知られていた語り草だったらしい。特に東京周辺では、今でも知っている人が時々いる。例えば、私の家からそう遠くない北沢村などでは、これをある小さな池の伝説として語り伝えている。


    昔、この池のほとりで、農夫が一匹の蛇を見つけ、鎌を突きつけて脅すと、蛇はたちまち怒りの形相を示し、見ているうちに大蛇になった。農夫は夢中で鎌を振り回し、大蛇の顎の骨を切り落としたというが、これはどうやら話の順序が逆になっているように思う。大蛇になってから顎を切り離すのは、容易な仕事ではないからである。とにかく、この北沢村の小池が、井の頭の弁天の御池と地下で通じていることは、この時にわかったのだそうだ。顎を切られた大蛇は、その水路を潜って井の頭へ逃げ帰り、死んだ。そのため、この池の澄んだ水が三日三晩、真っ赤に変わったという話である。新宿の町に接する柏木村にも、これとまったく同じ話がある。柏木と中野の境を流れる小川の岸の、立間山というところで、この出来事があったという。立間は、今のちょうど東中野の電車駅があるあたりだった。'
  notes:
  - 冒頭はスキャン140の続き。
  - Wikimedia Commonsの同一版正規ミラー画像141で全文・行順を照合。OCR崩壊の末尾一文および「清水」を復元した。
  - 「支那」は当時の中国の呼称で、訳では中国とした。
  - 「今」は著者の執筆当時を指す。

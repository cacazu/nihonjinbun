  original: 谷を通らうか、梨の木谷を通らうか」。アマンジヤクの姫は梨の木谷の方をといふ。いやいや柿の木谷の方がよいと言つて、其方を通つて行つた。柿の木谷の高い柿の樹の上で、本當の姫が之を見て泣いた。「吾が乘りて行くのに、アマンジヤクこそ乘りて行くかや、ピーロロロロ」と泣いた。それではおのれはアマンジヤクであつたかと、駕籠舁きは駕籠からアマンジヤクを引きずり出し、姫を木の上から助けおろした。其アマンジヤクを三つに切つて、粟の根へ一切れ、蕎麥の根へ一切れ、黍の根へ一切れとその體を埋めた。粟と蕎麥と黍の根の赤いのは、其時アマンジヤクの血に染まつたからだといふ話。
  translation: '谷を通ろうか、それとも梨の木谷を通ろうか」。アマンジャクの姫は、梨の木谷のほうがよいと言った。

    しかし、「いやいや、柿の木谷のほうがよい」と言って、そちらを通っていった。

    柿の木谷の高い柿の木の上で、本当の姫がそれを見て泣いた。「私が乗っていくはずなのに、アマンジャクが乗っていくのかい、ピーロロロロ」と泣いた。

    「それでは、おまえはアマンジャクだったのか」と、駕籠かきはアマンジャクを駕籠から引きずり出し、姫を木の上から助け下ろした。

    そのアマンジャクを三つに切り、粟の根元に一切れ、蕎麦の根元に一切れ、黍の根元に一切れと、その体を埋めた。粟と蕎麦と黍の根が赤いのは、そのときアマンジャクの血に染まったからだ、という話である。'

  section: 海神少童／龍宮小僧
  original: 諸國の谷川の地名に小僧淵といふのが幾らもあつて、中には河童といふ妖怪が現はれ、人を捕つたといふ類の口碑を傳へて居るのも有るが、その多くはもう由來不明になつて居る。私はわざと此書に說く所を匿して置いて、もう一度親しく其土地の故老から、幽かに殘つて居る斷片を聞出したいものだと思つて居る。近年刊行せられた引佐郡誌に依ると、この郡鎭玉村には久留女木の大淵といふ淵があつて、昔龍宮から小僧が出て來たといふ話が殘つて居るさうである。此小僧は村の家々を巡つて、農事の忙しい頃には田植などの手傳ひをして助け、夏の頃俄雨の降る頃には直ぐに出て來て干し物を片付けてくれる。土地の者の大仕合せであつたので、行く先々でも悅んで御馳走をした。たゞ蓼汁だけは決して食はせてくれるなと、常々固く賴んで居たにも拘らず、或日或家でつい忘れてそれを出した爲に、龍宮小僧はその蓼汁を食べて死んでしまつた。村の中シゲといふ字の奥に、大きな榎木があつてそこに
  translation: '諸国の谷川には「小僧淵」という地名がいくつもあり、中には河童という妖怪が現れて人を捕らえた、といった伝承を残すところもある。しかし、その多くは、もう由来がわからなくなっている。私は、この本で述べている考えをわざと伏せておいて、もう一度、土地の古老から直接、かすかに残っている断片を聞き出してみたいと思っている。

    近年刊行された『引佐郡誌』によると、この郡の鎮玉村には久留女木の大淵という淵があり、昔、竜宮から小僧が出てきた、という話が残っているそうだ。この小僧は村の家々を回り、農作業の忙しい時期には田植えなどを手伝って助け、夏に急な雨が降ると、すぐに出てきて干し物を片づけてくれた。土地の人々にとってたいへんありがたい存在だったので、行く先々で喜んで御馳走をした。ただし、蓼の汁だけは決して食べさせないでほしいと、日頃から固く頼んでいた。それなのに、ある日、ある家でつい忘れて出してしまい、竜宮小僧はその蓼汁を食べて死んでしまった。村の中シゲという小字の奥に、大きな榎があり、そこに'

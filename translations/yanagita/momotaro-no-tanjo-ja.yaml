- id: mmt-197-01
  scan: 197
  section: 絵姿女房／髪長媛
  original: 'によれば、此毛は元祿十六年の洪水に流れ、社殿のみ數町の川上に逆流して今の地に止まつ

    た。神寶の毛存せし間は神威最も嚴かであつて、他所の人を忌むこと甚だしく、殊に下日向

    の者は一歩も神領に入ることが出來なかつた。祭神は岩長媛と御父山神を祀るといふが、媛

    が瞋恚の末に此地の淵に入りたまふと傳へたのは、恐らくは亦水の神であつたらう。中央部

    の大和國にも、以前此物語を傳へた社寺が多かつたことは注意に値する。布瑠の御社にも大

    いなる髪毛一筋、其名をソヽゲといふものが有つたと、前に引用した阿波の式社略考には見

    え、天野氏の鹽尻卷二には、興福寺の寶藏に光明后の髪といふもの長さ一丈餘、吉野天の川

    とかやの辨才天祠に八尺ばかりの髪、白拍子靜の髪といふ。又此外に五丈もある毛、七難が

    陰毛といふ。熱田社にも此類の物ありとある。扶桑略記治安三年十月十九日の條に、藤原道

    長高野詣での途次、本元興寺に立寄つて寶倉を開き覽たといふ此和子の陰毛といふものも、

    恐らくは又同日の談であつて、白拍子靜などよりは尙何百年も前の頃から、種々の俗說を伴

    なうた長い毛が、旣に珍重せられる風だけはあつたらしいのである。

    是が果して如何なる事實の誤聞であつたか、物がもう無いのだから之を考へて見ることは

    六つかしいが、是だけ多くの場合に共通して殘つて居る七難又は悉難といふ言葉には意味が

    有らうと思ふ。京都西郊の吉祥院村に、菅公の遺址と傳ふる七難田(近畿遊覽記)、越前の平

    泉寺村の泰澄大師の母の故事を說いて居る七難の窟(大野郡誌)、美濃の根尾川の水中に在つ

    て、能郷白山の登路に當る七難岩、さては東海道蒲原驛の少し東に在つて、淨瑠璃御前の塚

    處と稱する七難阪の如き、何れも或は巫女と因みのある地名であつて、かの「往古に異婦あ

    り七難と名く云々」といふ記事を、幾分か形跡のあるものと推測せしめるのではあるまいか。

    伊豆の大島にはシツナ樣、又はシツナ神といふ信仰があつたさうだが、今では其名殘が餘り

    に幽かであつて、是と髪の毛との關係などは尋ね究めることが出來ない。しかも私は尙手が

    かりは此方面に在るやうに思つて居る。

    喪葬令の集解には遊部の君の初祖、手足の毛の八束毛を成すまで遊べとの仰せを被つた記

    事がある。三十三尋といふが如き長い毛はうそだとしても、神に仕ふる者には時あつて異

    常に長い毛をもつ女性があつたといふ語り草があり、又其特徴によつて資格を認められたと

    いふ類の說話が、曾ては繪姿に先だつて流布して居たのではあるまいか。現代も尙各地に流'
  translation: 'によれば、この毛は元禄十六年の洪水で流され、社殿だけが川を数町さかのぼって、現在の場所に止まった。神宝の毛があった間は神威がきわめて厳しく、よその人をたいそう嫌い、とくに下日向の者は、一歩も神領へ入れなかった。祭神は岩長媛と、その父である山神だというが、姫が怒りの末、この土地の淵へ入ったと伝えるのは、おそらく、やはり水の神だったのだろう。

    中央部の大和国にも、以前この物語を伝えた社寺が多かったことは、注目に値する。布瑠の神社にも、大きな髪の毛が一本あり、その名をソソゲといったことが、先に引用した阿波の『式社略考』に見える。天野氏の『塩尻』巻二には、興福寺の宝蔵に光明皇后の髪という、長さ一丈余りのものがあり、吉野の天の川とかいう所の弁才天の祠には、八尺ほどの髪があって、白拍子の静の髪だといい、さらに別に五丈もある毛を「七難が陰毛」と呼ぶ、とある。熱田社にも、このようなものがあるという。

    『扶桑略記』の治安三年十月十九日の条で、藤原道長が高野山へ参詣する途中、本元興寺に立ち寄って宝倉を開いて見たという「此和子の陰毛」も、おそらくこれと同じ類いの話であろう。白拍子の静よりも何百年も前から、さまざまな俗説を伴った長い毛を、すでに珍重する風があったらしいのである。

    これが実際にはどのような事実を聞き違えたものだったのか、物がもうない以上、考えることは難しい。しかし、これほど多くの場合に共通して残る「七難」や「悉難」という言葉には、意味があると思う。京都西郊の吉祥院村にあり、菅公のゆかりの地と伝わる七難田（『近畿遊覧記』）、越前の平泉寺村で泰澄大師の母の故事を伝える七難の窟（『大野郡誌』）、美濃の根尾川の中にあって、能郷白山への登り口に当たる七難岩、そして東海道の蒲原宿の少し東にあり、浄瑠璃御前の墓所とされる七難坂などは、いずれも、あるいは巫女と関係のある地名であろう。そうであれば、あの「昔、不思議な女がいて七難と名乗った」などという記事にも、多少は裏づけがあると考えられるのではないか。

    伊豆大島には、シツナ様、あるいはシツナ神という信仰があったそうだが、今では名残があまりにかすかで、髪の毛との関係などを突き止めることはできない。それでも私は、なお、この方面に手がかりがあるように思っている。

    喪葬令の『集解』には、遊部君の祖先が、「手足の毛が八束の長さになるまで遊べ」との命令を受けたという記事がある。三十三尋というような長い毛はうそだとしても、神に仕える者の中に、ときに異常に長い毛を持つ女性がいたという語りがあり、また、その特徴によって資格を認められたという類いの説話が、かつては絵姿の話より前に流布していたのではないだろうか。現在もなお、各地に流'
  notes:
  - 冒頭はscan196から、末尾はscan198に続く。
  - 「此和子」「能郷」の字形を原画像で確認。
  - 「同日の談」は同じ類いの話の意として訳した。
  - 「遊べ」は原文の語を保持して訳した。遊部の儀礼に関する表現で、現代の娯楽一般の意味に限定しない。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。

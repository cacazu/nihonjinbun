  section: 絵姿女房／五 般若寺の磐若姫
  original: 'つたる其凧には美しい女の姿が畫かれてある。斯樣な美人も此世にはあるかと、早速國

    國を御尋ねなされると、それは豐後國の滿能長者といふ者の一人娘であつた。御召しに

    なるけれども長者夫婦、惜んで姫を差上げようとしない。太子は戀慕の餘り御姿を賤の

    夫にやつしたまひ、其名も草刈三藏と改めて遙々と西國に下り、滿能長者の家に入つて

    さまざまの御艱難の後、めでたく其姫を娶つて都に御還りにならうとしたところが、ち

    やうど此山の麓の大畠の瀨戶、一名を小鳴戶ともいふ難處に於て、姫は龍神に見入られ

    て乘船が覆へり、辛うじて此地に上陸して命絕えた。其追善の爲に箕山に寺を建て、

    姫の名に因んで其寺を般若寺と號した。豐後の見ゆる處に埋めよといふ遺言によつて、

    山の頂上に磐若姫の塚があり、後には用明天皇の御陵をも爰に遷したとさへ言つて居る

    (同上、井上弘氏報)。

    この豐後の滿能長者は、記錄には又眞野長者とも書いてあつて、卽ち亦一個の「物草太郞」、

    炭燒小五郞の立身した後の名であつた。周防般若寺の緣起を始として、海の此方に傳はつて

    居る幾つかの傳說には、すべて此長者の由來記を認めて居るばかりか、後に發明せられた誇

    張までが對岸と一致して居る。例へば豐後の方には眞野長者一代記と題して、長者の傳記を

    完全に軍書化したものがあるが、周防にあるものも些少の相違があるだけで、やはり百濟國

    の軍師が出て來たり、海賊が貴人の船に攻寄せたりして居て、たゞ其末に磐若姫臨終の哀話

    が附け加へられて居るだけである。磐若姫といふ名も實は寺の名の方が元であつて、周防で

    言ひ始めたことかと思ふが、近頃豐後で出た炭燒小五郞傳記といふ一書にも、やはり姫の名

    をさう呼んで居るのである。この兩岸の一致を說明する一つの材料は、草苅氏の移住といふ

    ことであつた。炭燒小五郞の後裔は苗字を草苅と稱して、近世まで豐後の海岸近くに居住

    し、家傅の花炭といふものを燒いて居た。ところが周防の方にも一時は可なり勢力のあつた

    草苅といふ舊族があつて、それが對岸の豐後地から、分れて來たやうに傳へて居るのであ

    る。此家と箕山の般若寺、乃至は其周圍に住む傳承保管者と、果して關係があつたかどうか

    は私にはまだ言ふことが出來ない。しかも彼等自身の說く所に由つても、少なくとも爰では

    九州の說話が、此路を通つて本州に持込まれたことだけは認めて居るのである。

    草苅氏の子孫は今でも兩國に分布して、相應なる門地を保持して居る。それが歌物語の流'
  translation: 'た。その凧には美しい女の姿が描いてあった。「このような美人も世にいるのか」と、さっそく国々を捜させると、それは豊後国の満能長者という者の一人娘だった。召し出そうとしたが、長者夫婦は惜しんで姫を差し出そうとしない。太子は恋慕のあまり、身分の低い男の姿に身をやつし、名も草刈三蔵と改め、はるばる西国へ下った。そして満能長者の家に入り、さまざまな苦難を経た末、めでたくその姫を妻に迎え、都へ帰ろうとした。

    ところが、ちょうどこの山のふもと、大畠の瀬戸、別名を小鳴戸という難所で、姫は竜神に魅入られて乗っていた船が転覆した。かろうじてこの地に上陸したものの、そこで命を落とした。その冥福を祈るために箕山に寺を建て、姫の名にちなんで般若寺と名づけた。「豊後の見える所に埋めてほしい」という遺言によって、山頂に磐若姫の塚があり、のちには用明天皇の御陵もここへ移したとまでいわれている（同前、井上弘氏の報告）。

    この豊後の満能長者は、記録では真野長者とも書かれている。すなわち、これも一人の「物草太郎」である炭焼小五郎が出世した後の名だった。周防の般若寺の縁起をはじめ、海のこちら側に伝わるいくつかの伝説は、どれもこの長者の由来を認めているばかりか、後に作られた誇張まで対岸と一致している。例えば豊後には『真野長者一代記』と題し、長者の伝記をすっかり軍記物に作り替えたものがある。周防のものにも、わずかな違いはあるが、やはり百済国の軍師が登場したり、海賊が貴人の船に襲いかかったりしていて、ただ最後に磐若姫の臨終の悲話が付け加えられているだけである。

    磐若姫という名も、実は寺の名のほうが先で、周防で言い始めたのだと思うが、近ごろ豊後で出た『炭焼小五郎伝記』という本でも、やはり姫をそう呼んでいる。この両岸の一致を説明する材料の一つが、草苅氏の移住である。炭焼小五郎の子孫は、草苅を名字として近世まで豊後の海岸近くに住み、家に伝わる花炭というものを焼いていた。ところが周防にも、かつてかなりの勢力を持った草苅という旧家があり、それは対岸の豊後から分かれて来たと伝えられている。

    この家と箕山の般若寺、あるいはその周辺に住む伝承の担い手たちとが、実際に関係があったかどうかは、私にはまだ言えない。それでも、彼ら自身の語るところによっても、少なくともここでは、九州の説話がこの道を通って本州へ持ち込まれたことだけは認めているのである。

    草苅氏の子孫は今も両国に分布し、それなりの家柄を保っている。それを、歌物語の流'
  notes:
  - 冒頭はscan181から、末尾はscan183に続く。
  - 「賤の夫」は当時の身分意識に基づく表現で、「身分の低い男」と訳した。
  - 磐若姫の読みは原文の振り仮名により「はんにゃひめ」。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。
  sequence: 187
- id: mmt-183-01
  scan: 183
  section: 絵姿女房／五 般若寺の磐若姫・六 六十六本の扇
  original: '傳に參與した比丘尼座頭の一類であつたかの如く想像することは、到底我慢の出來ぬことで

    あらうが、飜つて其家號の由つて來たる所を尋ぬれば、是は天皇潛幸の昔語り、笛吹く山路

    童の草苅りといふことを、曾て信じて居た結果といふの他は無い。さうなると直接此家が說

    話の保存と運搬とに任じなかつた迄も、少なくとも是を傳說化する最も熱心な聽き手の方の

    側に立つて居ただけは否み得ないであらう。別の言葉でいふと、山口縣東部の海岸には、そ

    れが草苅家の門統であつたか否かは別として、兎に角に豐後の炭燒長者一生の奇跡を、詳し

    く知る者が來て住んだだけは事實である。問題として殘るのは、美人の姿を繪に描いた大き

    な凧の話が、彼等が周防國に渡つてから後に出來たものか、但しは又是も本國からの持越し

    であつたかといふことであるが、それには九州に現存する前掲の二つの例の異同が、或は若

    干の暗示では無かつたらうかと思ふ。

    六六十六本の扇

    眞野長者の物語は、無論追々に語り添へられたものに相違ないが、大別して之を前後の二

    期とすることが出來る。前半は卽ち貧しい炭燒靑年の婚姻を中心として、長者發祥の因緣を

    語るものであり、後半はその長者のまな娘、後の玉世の姫の都登りを、專ら叙述せんとして

    居たものである。此兩部はもと同系の神話の二樣の說き方であつて、共に女性の力を以て能

    く尊神を顯はし祀つたことを傳へたものらしいが、それが重複して何人も異としなかつたの

    は、つまり一方が旣に廢れて後に、他の一方が嗣いで起つたからで、其發生の順序としては、

    前の炭燒小五郞の方が一つ古いかと思はれることは、曾て公表して置いた私の意見であつた。

    ところが近世の民間說話に於ては、此方が却つて分布弘く、國の南北の果にまで行亙つて居

    るに反して、記錄の上に於ては新しい。第二の部分卽ち用明天皇が草苅童となつて、姫を迎

    へに御下りなされたといふ方の話は、是よりもずつと古くから有るのであつて、卽ち同じ一

    つの故郷を前後して旅立つたかと思ふ說話が、一度も廻り合はずに離れ離れの境遇に飄泊し

    て居たのである。

    たとへば東北では氣仙高田の武日の長者、又は二戶郡の田山の長者などが、絕世の美女を

    娘に持つて、後に禁裡に召されたといふ物語を傳へて居る。柴田郡田邑の白鳥明神、又は亘'
  translation: '布に関わった比丘尼や座頭と同じ仲間だったかのように考えられるのは、到底我慢できないことだろう。しかし、振り返ってその家の呼び名の由来を尋ねれば、それは、天皇がお忍びで旅したという昔語り、笛を吹く山路童が草を刈ったという話を、かつて信じていた結果にほかならない。そうなると、この家が直接、説話の保存や運搬を担わなかったとしても、少なくとも、それを伝説にしていく最も熱心な聞き手の側にいたことだけは否定できないだろう。

    別の言い方をすれば、山口県東部の海岸には、それが草苅家の一族だったかどうかは別にして、ともかく豊後の炭焼長者の一生の奇跡を詳しく知る者が、移ってきて住んだことだけは事実である。問題として残るのは、美人の姿を描いた大きな凧の話が、彼らが周防国へ渡った後に生まれたのか、それとも、それも故国から持ち越したものだったのかということである。この点については、九州に今もある、先に挙げた二つの例の共通点と相違点が、いくらかの示唆を与えているのではないかと思う。

    六　六十六本の扇

    真野長者の物語は、もちろん、少しずつ語り足されていったものに違いないが、大きく前後の二つに分けることができる。前半は、貧しい炭焼きの青年の結婚を中心に、長者の家が始まるいきさつを語る。後半は、その長者の愛娘、のちの玉世の姫の都入りを、もっぱら語ろうとするものである。

    この二つの部分は、もとは同じ系統の神話の二通りの語り方で、どちらも女性の力によって尊い神を現し、祭ることができたと伝えるものらしい。それが重なっても誰も不思議に思わなかったのは、一方がすでに廃れた後に、もう一方が続いて起こったためである。その成立の順序からいえば、前の炭焼小五郎のほうが一段古いのではないか、というのが、以前に公表した私の意見だった。

    ところが近世の民間説話では、こちらのほうがかえって広く分布し、国の南北の端まで行き渡っているのに、記録の上では新しい。第二の部分、すなわち用明天皇が草刈りの童となって、姫を迎えに下っていったという話のほうが、ずっと古くからあるのである。つまり、同じ故郷から前後して旅立ったと思われる説話が、一度も出会わず、互いに離れた境遇でさすらっていたのである。

    例えば東北では、気仙高田の武日の長者、あるいは二戸郡の田山の長者などが、世に並ぶもののない美女を娘に持ち、その娘がのちに宮中へ召されたという物語を伝えている。柴田郡田邑の白鳥明神や、亘'
  notes:
  - 冒頭はscan182から、末尾「亘」はscan184「理郡」に続く。
  - 「比丘尼」「座頭」は当時の宗教者・芸能者の呼称。座頭には盲人の身分・職業称号としての用法がある。
  - OCRで行順が乱れた「山路童の草苅り」付近の復元を原画像でも確認。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。

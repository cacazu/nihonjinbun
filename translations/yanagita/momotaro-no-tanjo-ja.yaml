  section: 隣の寝太郎／八 信州の信の宮
  original: 來なかつた筈である。さうすると第二段に問題となるのは、この申し兒奇瑞の最も奇拔なる種、卽ち物草太郞立身の話などは、是も亦信濃國の土產であつたか、但しは又入用に臨んでの輸入品であつたかといふことである。神佛に授けられたたつた一人の兒が、異形異類であつたり、極端に小さかつたりする以外に、到底見込の無い役に立たずであつたといふ話は、固より他の地方にも行はれて居た。現に奥州のツブ聟入譚に於ても、十八になるまで神棚の缺椀の中で、たゞ遊んで居たといふ話になつて居る。併し私の想像が當つて居るならば、信州は特にあの草子の世に出る以前から、旣に物草太郞の昔話が流布して居た國であつて、それは必ずしも善光寺ばかりに固定した口碑でも無かつた。前に引用した小縣郡の小泉小太郞も、十六の歲まで大飯を食つて、每日々々遊んでばかり居たといふが、彼は大蛇の生み殘した子であつて、其後裔には代々橫腹に蛇の斑があつた。是から尋ねて見たらまだ方々に似た話があるのかも知れぬが、現に穗高大明神の信仰圈內にも、其實例は一つ殘つて居るのである。最近に世に出た北安曇郡鄕土誌稿、口碑傳說篇の第一册に、次のやうな一條が採集せられて居る。此郡會染村林中區の南部を、今でも久兵衞分と謂つて居るが、昔此地には久兵衞といふ金持が住んで居た。其總領(又は一人息子ともいふ)に信太郞といふ若者があつて、やはり有名な惰け者であつた。或日松川村の多羅尾の山中に笹刈りに行つて、笹は刈らずに晝寢をして居るうちに、頭に二本の角が生えたので姿を隱してしまつた。一說には信太郞は自分の姿の醜きを恥ぢて、山に隱れたとも天狗になつたともいふ。さうして三年の間夜は歸つて來て、一人で自分の家の田植田業を一晩のうちに片付けてくれた。或時家に來て又晝寢をして居るのを女房が見て、うちの仕事はもういゝから、そんな姿で來てくれるなと謂つてから、ふつつりと來なくなつてしまつた。是と同じ話が又鄰郡の南安曇郡誌にも出て居る。但し場處だけは有明山の東麓馬羅尾谷といふことになつて居て、そこには此若者を祀つたといふ信の宮が、山に正面し里に背を向けて立つて居る。この信太郞は或時友だちと笹刈りに入つて來て、不意に巨人に化して此谷を一跨ぎにして何處へか行つてしまつたと言ひ傳へ、それから三年の間夜中に戾つて來て、一夜の中に家の田殘らずを、植ゑたり刈つたりしてくれたといふ迄は同じで、晝寢をしたと
  translation: '……できなかったはずである。そうなると第二に問題になるのは、祈って授かった子の奇跡のうち、最も奇抜な一種である物草太郎の出世話なども、やはり信濃で生まれたものなのか、それとも必要に応じてよそから取り入れたものなのか、ということである。神仏から授かったたった一人の子が、異様な姿や人間以外のものであったり、極端に小さかったりするだけでなく、まるで見込みのない役立たずだった、という話は、もちろんほかの地方にも伝わっていた。実際、奥州のツブの婿入りの話でも、十八歳になるまで神棚の欠けた椀の中で、ただ遊んでいたことになっている。

    しかし私の想像が当たっていれば、信州は、あの草子が世に出る以前から、すでに物草太郎の昔話が広まっていた国だった。そして、それは必ずしも善光寺だけに結びついた言い伝えではなかった。前に引用した小県郡の小泉小太郎も、十六歳まで大飯を食べ、毎日遊んでばかりいたというが、彼は大蛇が生み残した子で、その子孫には代々、脇腹に蛇の斑があった。これから尋ねてみれば、まだあちこちに似た話があるかもしれないが、実際、穂高大明神の信仰の及ぶ範囲にも、一つ実例が残っている。最近刊行された『北安曇郡郷土誌稿』口碑伝説篇第一冊には、次の一節が採集されている。

    この郡の会染村林中区の南部を、今でも久兵衛分というが、昔ここには久兵衛という金持ちが住んでいた。その跡取り――一人息子ともいう――に信太郎という若者がいて、やはり有名な怠け者だった。ある日、松川村の多羅尾の山中へ笹刈りに行ったが、笹も刈らずに昼寝をしているうち、頭に二本の角が生えたので、姿を隠してしまった。一説には、信太郎は自分の醜い姿を恥じて山へ隠れたとも、天狗になったともいう。そうして三年のあいだ、夜になると帰ってきて、自分の家の田植えや田仕事を、一人で一晩のうちに片づけてくれた。あるとき、家に来てまた昼寝をしているのを妻が見て、「うちの仕事はもういいから、そんな姿で来ないでくれ」といった。それからは、ぷっつり来なくなってしまった。

    同じ話は、隣の郡の『南安曇郡誌』にも出ている。ただし場所は、有明山の東麓にある馬羅尾谷となっていて、そこには、この若者を祭ったという信の宮が、山を正面にし、里に背を向けて立っている。この信太郎は、あるとき友人と笹刈りに入り、突然巨人に変わって、この谷をひとまたぎにし、どこかへ行ってしまったと伝えている。それから三年のあいだ、夜中に戻ってきて、一晩のうちに家の田全部を植えたり刈ったりしてくれた、というところまでは同じで、昼寝をしたという……'
  notes:
  - 冒頭はscan160末尾、末尾はscan162冒頭に続く。
  - ツブは田螺などの貝を指す地方の呼称。多羅尾・馬羅尾は各引用の表記を保持した。

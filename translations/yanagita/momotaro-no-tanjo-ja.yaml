  section: 瓜子織姫／七 瓜子姬の敵
  original: ことにもなつて居る。石見國の例も此點は全く同じで、やはり何の爲に留守になつたかは說明せずに、唯歸つて來てから姫を嫁に遣ると言つて、駕籠に乘せて柿の木谷を通つたとあるのだが、其隣國の出雲松江の例(一〇)に在つては、姫を鎭守樣に參詣させるつもりで、爺婆は駕籠を買ひに、町へ行つたといふ話になつて居る。何でも無いことの樣ではあるが、是だけの一致は偶然には起り得ない。察する所、以前には御駕籠の用意といふことが、意味は解らぬながら必ず附け加へられて居て、それは織姫が祭の式に參與することを、具體化したものであつたのである。實際又我々の年久しい信仰に於ては、神の御衣を織り成したる處女は、當然に神の御妻と解せられて居たらしいのである。瓜子姫の害敵は、ちやうどこの最も大切な時刻に出現して、殆と姫の事業の根本を覆へさうとしたのであつた。我々の社會康寧の爲に、所謂神衣祭の如何に必要であるかを解して居た人々には、是も戰場の物語と同じ程度に、手に汗を握らしめるやうな感奮であつた。從うて是にも八島や高館などと匹敵するやうな、種々なる語り草が附加はつたとしても不思議は無い。ところが實際はさう複雜なる地方的變化は無く、殆と十一箇處の昔話に共通して、强ひて織殿に闖入して姫を押除け、自身其姿を裝うて人を騙さうとした者が、最後に見顯されて失敗したことになつて居る。更に興味があるのは、西洋でも著名な「狼と七匹の小羊」、若くは赤頭巾などにも使はれて居る一挿話、卽ち作り聲をして戶を開けさせる一條が、爰でも僅かな相異を以て一樣に採用せられて居ることであつた。此種の國際一致は恐らくは瓜子姫の說話の、非常に古いといふことを旁證するものと思ふが、それは單にこの話し方の技術に輸入の痕があるといふまでで、說話其のものが此國特有で無いか有るかは、別に又論究せられなければならぬ。何となれば如何に古くから忠實に傳へられて居らうとも、欺いて戶を開かせたといふ一條だけを說く爲に、この一つの昔話が發生したと思ふ者は無いからである。日本の昔話として我々の最も注意するのは、瓜子姫の敵の名がアマノジヤクであつたといふ點である。アマノジヤクが神の計畫の妨碍者であり、しかも通例は「負ける敵」であつたことは、弘く他の民間傳承にも認められて居る。是が果して神代史の天の探女の元の姿であるか、或は又今に承繼いだのは其名前ばかりであつたか。記錄の資料の方が乏しいので確かめ
  translation: 'ことにもなっている。石見国の例も、この点はまったく同じで、留守にした理由は説明せず、帰ってきてから姫を嫁入りさせると言って駕籠に乗せ、柿の木谷を通ったとしている。しかし隣国、出雲松江の例（十）では、姫を鎮守様へ参詣させるつもりで、爺婆は駕籠を買いに町へ行った、という話になっている。

    何でもないことのようだが、これほどの一致が偶然に生じることはありえない。推測すると、以前には「駕籠を用意する」ということが、意味はわからなくても必ず付け加えられていた。それは、織姫が祭りの儀式に加わることを、具体的な形で示したものだったのである。実際、私たちの古くからの信仰では、神の衣を織り上げた処女は、当然、神の妻と理解されていたらしい。

    瓜子姫を害する敵は、ちょうど、この最も大切な時に現れ、姫の事業を根本から覆そうとした。社会の安寧のため、いわゆる神衣祭がどれほど必要かを理解していた人々には、これも戦場の物語と同じくらい、手に汗を握る興奮を与えたのである。したがって、屋島や高館などに匹敵するような、さまざまな語り草が、この話にも付け加わったとして、不思議はない。

    ところが、実際にはそれほど複雑な地方ごとの違いはなく、ほぼ十一か所の昔話に共通して、無理に機織りの殿に入り込み、姫を押しのけ、自分がその姿を装って人を欺こうとした者が、最後には見破られて失敗したことになっている。

    さらに興味深いのは、西洋でも有名な「狼と七匹の小羊」や「赤頭巾」などで使われる一つの挿話、すなわち、声色を使って戸を開けさせる一節が、ここでも多少の違いを伴いながら、一様に採用されていることだ。この種の国境を越えた一致は、おそらく、瓜子姫の話が非常に古いことの傍証になると思う。しかし、それはただ、語り方の技法に輸入の跡があるというだけで、説話そのものが、この国独自のものかどうかは、別に検討しなければならない。なぜなら、どれほど古くから忠実に伝えられてきたとしても、だまして戸を開けさせたという一節だけを語るために、この一つの昔話が生まれた、と考える人はいないからである。

    日本の昔話として、私たちが最も注目するのは、瓜子姫の敵の名がアマノジャクだったという点である。アマノジャクが神の計画を妨げる者で、しかも通常は「負ける敵」だったことは、ほかの民間伝承にも広く認められている。これは果たして、神代の歴史に出てくる天の探女の、もとの姿なのか。それとも、今に伝わったのは、その名だけだったのか。記録資料が少ないので、確かめ'

  original: 口取り諸共に大急ぎで遁げ去つたといふのは、是も亦誰が聽いても笑はずには居られない面白い光景であつた。卽ち話は狼の尻尾のみに附いて生れたものでは無かつたのである。それからもう一つ、是は全國によく行渡つて居る話だが、やはり中古の改作に過ぎなかつたと思ふのは、是も牡鹿郡の狐退治の樣に、それに携はつた座頭が其場で命を喪つたといふ悲壯なる結末を告げて居るからである。越後岩船郡の關谷から、羽前の小國へ越える織峠といふのが、其中でも最も著名であつたが、同じ峠の裏と表とで話が早既に異なるのみか、越後で近頃出た二つの傳說集にも、亦別々の言ひ傅へを載せ、其一方は話の主人公を瞽女だと記して居る。越後野志卷九に見えて居るのが古いから之を引くと、昔一人の座頭此峠の頂上に宿して、深山の寂寞に堪へず、獨り琵琶を彈じて心を慰めて居る折柄、忽然として美しい女性現はれ來つて、頻りに感歎し且つ曰く、御坊麓の里に下るとも必ず長居するなかれ。我は此山に年久しく住む大蛇なるが、時至つて近々に海に入るので、行きがけに此下の一谷を淵にする。今宵一曲のよしみに由つてそなたにのみは告げるが、人に之を言ふならば卽座に命を取るぞと言つた。座頭は之を聞いて急いで村里に下り、身命を無きものにして村人に其危險を敎へ、術を構へて大蛇は退治したが、彼も亦立ちどころに死んでしまつた。それを神に祭つたのが大倉權現、大蛇も大利大明神と稱へ今に其祠が頂上に在る。或は神寶として其折の琵琶が置いてあるといふかと思ふと、出羽の方の傳へでは之を三味線堂といひ、峠の名も座頭峠又蛇骨峠と呼ぶともあつて(行脚隨筆卷上)、其大蛇が元は人間の女性であつたことまで、雙方で之を說くが其話はちつとも一致して居ない。つまり次々の演義が際限も無く展開して行つただけで、單に蛇骨だと稱する一種の鑛物が、此山上から採取せられることのみが事實であつたらしい。八水の神に仕ふる者ところが是と同樣の口碑は、同じ越後でも小千谷の町はづれの茄子崎の地藏堂を中心としで行はれて居た外に、山形縣の方でも大石田越の森明神の社にも傳はつて居たことが、黑甜瑣語卷二に見えて居る。福島縣に於ては相馬郡の耳谷角落などといふ土地にからんで、是とよく似た口碑が又一つあつた。堂房の藥師堂に參籠して目明きを祈願して居た若い男が、日
  translation: '〔前のスキャンから続く〕馬を引く者と一緒に大急ぎで逃げ去ったというのは、誰が聞いても笑わずにはいられない、面白い光景だった。つまり、この話は狼の尻尾だけをきっかけに生まれたものではなかったのである。

    それからもう一つ、全国に広く伝わっている話があるが、やはり途中の時代の改作にすぎないと思う。それは、これも牡鹿郡の狐退治のように、関わった座頭がその場で命を失うという、悲壮な結末を伝えているからである。越後岩船郡の関谷から羽前の小国へ越える織峠という所が、その中でも最も有名だった。しかし同じ峠の裏と表とで、すでに話が違うばかりか、越後で近ごろ出た二つの伝説集にも、それぞれ異なる言い伝えが載り、一方は主人公を瞽女と記している。『越後野志』巻九のものが古いので、これを引く。

    昔、一人の座頭がこの峠の頂上で宿を取り、深山の静けさに耐えられず、一人で琵琶を弾いて心を慰めていた。すると突然、美しい女性が現れ、しきりに感嘆しながら言った。「お坊様、麓の里へ下りても、決して長居してはいけません。私はこの山に長年住む大蛇ですが、時が来て、近いうちに海へ入ります。その途中で、この下の谷一つを淵にするのです。今夜一曲聞かせてもらったよしみで、あなただけには告げますが、人にこのことを言えば、即座に命を取りますよ。」座頭はこれを聞いて急いで村里に下り、自分の命を捨てる覚悟で村人に危険を知らせた。策を設けて大蛇は退治したが、彼もまた、たちどころに死んでしまった。それを神として祭ったのが大倉権現である。大蛇も大利大明神と呼び、今も頂上に祠がある。神宝としてそのときの琵琶が置かれているという一方、出羽側の伝承では、これを三味線堂といい、峠の名も座頭峠、また蛇骨峠と呼ぶともある（『行脚随筆』巻上）。その大蛇がもとは人間の女性だったというところまで、双方とも語るが、話は少しも一致しない。つまり、次々と話の膨らましが際限なく展開しただけで、「蛇骨」と呼ぶ一種の鉱物がこの山上から採れるということだけが、事実だったらしい。

    八　水の神に仕える者

    ところが、これと同じ口伝は、同じ越後でも小千谷の町外れの茄子崎の地蔵堂を中心に伝わっていたほか、山形県の大石田越の森明神の社にも伝わっていたことが、『黒甜瑣語』巻二に見える。福島県にも、相馬郡の「耳谷角落」などという土地に結びついて、よく似た口伝がもう一つあった。堂房の薬師堂にこもって、目が見えるように祈っていた若い男が、ふだん、'

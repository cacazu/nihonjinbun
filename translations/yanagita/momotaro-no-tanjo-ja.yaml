  section: 和泉式部の足袋／一 熊の子鹿の娘・二 淨瑠璃御前の生ひ立ち
  original: '彼子を大黑丸に與ふ。

    是を和泉式部と名く。

    九歲の時都に登りて宮仕へして終に歸らず。

    里人の語り傳へに、かの式部錦の浦を思ひ出でて、都より歌をよみて送れり。

    其歌に古鄕にかへる衣の色くちてにしきのうらやきしまなるらん大正年間に編纂せられた寺社綜覽を見ると、此寺の所在は佐賀縣杵島郡錦江村大字田野上字泉、本尊は藥師如來、長者大黑丸が信心によつて一子を得たこと、及び和泉式部の自筆の短册を傳ふることを記して、やはり和泉は白鹿の子であつたと謂つて居る。

    獸類を一般にシシと謂つた古語の痕跡は、今でも九州の田舎にはまだ時々見出される。

    町に居た學者が耳で此話を聽いたとすれば、猪と間違へたのも有りさうなことだが、前の一文をよく讀んで見ると、鹿なら其擧動が目に浮ぶが、猪としてはよほど格好がをかしい。

    併しそれは何れであつても私の意見には變りは無いので、寧ろ猪の異例もあつた方が面白い位だから、斯んな點では別に論證の必要を認めないのである。


    二淨瑠璃御前の生ひ立ち

    それよりも是非知りたいと思つて居たのは、現在かの地方民間の口碑が、果して類聚名物考の時の如く、又この福泉寺緣起の通りであるか否かといふことであつたが、是にも幸ひにして一つの實例を接手することが出來た。

    もとはあの地方一帶に可なり弘く知られて居た話であるらしい。

    捜したら尙比較の資料の見付からぬこともあるまいと思ふ。

    馬場武彥氏の若い頃に書き留めて置かれたものに依ると、昔この鄰郡藤津郡五町田村に、老いたる夫婦の者子の無いことを悲しんで、村の觀音堂に祈願を籠めると、杵島山の中腹に在る福泉寺の藥師如來に參詣して、寺の和尙に貰へとの御告げであつた。

    早速行つて賴んで見たが、和尙樣も一向心當りが無い。

    其夜御寺に一泊して居ると、更けて赤子の啼く聲が聞える。

    其聲を尋ねて見れば、一頭の牝鹿が小さな兒に乳を呑ませて居たといふ。

    悅んで其子を乞受けて家に歸り、育てて見ると玉のやうな美女になつた。

    只足の趾のみが二つに分れて人間のやうで無かつたが、讀書きにすぐれ歌に巧みであつた故に、六歲にして其名都に聞え、遙々召出されて後に和泉式部となつた。

    和泉式部は其足のゆびを隱す爲に、常に足袋といふものをはいて居たさうである。

    この福泉寺は前には眞言宗であつたが、再興以後は臨濟禪宗となり、今でも'
  translation: '――その子を大黒丸に与えた。これを和泉式部と名づけた。九歳のとき都へ上って宮仕えをし、ついに帰らなかった。里人の語り伝えによれば、式部は錦の浦を思い出し、都から歌を詠んで送った。その歌は、

    『故郷へ帰る衣は色あせて、錦の裏も「きしま」、黄縞になっているのだろうか。』」

    大正年間に編纂された『寺社綜覧』を見ると、この寺は佐賀県杵島郡錦江村大字田野上字泉にあり、本尊は薬師如来で、長者の大黒丸が信仰によって子を得たことと、和泉式部の自筆の短冊が伝わることを記して、やはり和泉は白鹿の子だったといっている。獣類一般をシシと呼んだ古語の痕跡は、今でも九州の田舎では時々見いだされる。町にいた学者が耳でこの話を聞いたのなら、猪と取り違えたのもありそうなことだ。しかし先の文章をよく読むと、鹿ならその動きが目に浮かぶが、猪としてはかなり不格好である。とはいえ、どちらであっても私の意見は変わらない。むしろ猪という異例もあった方が面白いほどだから、こうした点を特に論証する必要は認めないのである。

    二　浄瑠璃御前の生い立ち

    それよりも、ぜひ知りたかったのは、現在のあの地方の民間の言い伝えが、果たして『類聚名物考』のときと同じであり、またこの福泉寺縁起のとおりなのか、ということだった。これについても幸い、一つの実例を手に入れることができた。もとはあの地方一帯で、かなり広く知られていた話らしい。探せば、さらに比較できる資料が見つからないこともないと思う。馬場武彦氏が若いころに書き留めたものによると、昔、この隣の藤津郡五町田村で、老夫婦が子のないことを悲しみ、村の観音堂に祈願をこめると、杵島山の中腹にある福泉寺の薬師如来に参詣し、寺の和尚にもらえ、というお告げがあった。さっそく行って頼んでみたが、和尚にもまったく心当たりがない。その夜、寺に一泊していると、夜更けに赤ん坊の泣き声が聞こえた。その声のする方を探すと、一頭の雌鹿が小さな子に乳を飲ませていたという。喜んでその子をもらい受け、家へ帰って育てると、玉のような美女になった。ただ、足の指だけが二つに分かれ、人間のようではなかった。しかし、読み書きに優れ、歌が上手だったので、六歳でその名が都に聞こえ、はるばる召し出されて、のちに和泉式部となった。和泉式部は足の指を隠すために、いつも足袋というものを履いていたそうである。この福泉寺は以前は真言宗だったが、再興後は臨済禅宗となり、今でも――'
  notes:
  - 冒頭は243の引用を受け、末尾は245へ続く。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第44頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。
  - 和歌の冒頭は原版で「古鄕」と確認。「錦の浦／錦の裏」「杵島／黄縞」を掛けた歌として訳した。

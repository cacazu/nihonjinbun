  section: 狼と鍛冶屋の姥／九 良辨僧正の杉
  original: 'の場處も鎌倉であつたやうにいふ。

    ところが良辨僧正の異常誕生と母子再會は、古いといふのみで、又一種の戀衣物語に過ぎなかつた。

    臺本を持たない以前の語り手は、行く先々で有りさうな近くの地名に挿しかへて居たので、其殘形は今でもまだ口傳へに傳はつて居る。

    甲斐昔話集では場處は駿河國、茶摘みの時に畠の畔に置いて居たらといひ、其子は大和國の東願寺の小僧になつて居たと謂つて居る。

    聽耳草紙の長須田まんこの話は、飛んでも陸中國より外へは行かず、やはり又十三年目に墓峠の地獄山といふ所で再會して居るが、其子がやはり名僧の未成品であつた(序だからたつた一言、この話の母の名をマンコと謂つて居るのは、曾我物語に對する有力な暗示である)。

    それから此話の前半だけならば、內田氏の「南總の俚俗」にも、クラッコ鳥の由來として、鷲に取られた兒の母の悲しみを說いて居る。

    それは普通の聽衆に此部分が殊に印象深く、たま〱鳥前生の說話と結合して再現しただけで、別に其樣な傳へが獨立してあつたので無いことは明かである。

    奈良の良辨僧正は之に比べると、たゞ幾分か改訂が少なく、人望が遙かに多くて、より弘く行はれて居たといふ迄である。

    氣仙郡誌に採錄せられて居る竹駒村の羽繩氏の家傅では、牧場の牛を襲ふ大鷲を防ぐ爲に、主人が牛の皮を身に纏うて居ると、鷲が抓んで遠くの離れ島へ持つて行つて落したとなつて居り、鮭の魚の背に扶け乘せられて、再び家に戾つて來たと謂つて、寧ろ鮭を家の神とした說明に附隨した形であるが、是にも家々の少しづつの變化があつて、中には鷲にさらはれたのは娘であり、其鮭の大助にかたられて女房になつたといふ話もあるさうだ(聽耳草紙三五〇頁)。

    伴蒿溪翁の閑田次筆には、攝州高槻の藩士鷲津見某、鷲につまれて助かつた兒を祖先とする。

    今ある鷲見七郞太夫は其子孫らしい。

    泉州堺の旭蓮社の開祖玄恕上人も、鷲にとられて助かりし人なり。

    たぐひ有る事にこそなどと言つて居るが、此比類は遠く日本靈異記の世に始まつて居たことには心付かなかつた。

    靈異記の「汝鷲瞰殘云々」は、今昔物語二六には「己は鷲の食ひ殘しぞかし」と出てゐるから、地名は僅か違ふが同じ話の和譯なることは疑ひ無く、水鏡の皇極天皇の條にも同じ話が轉載せられて居る。

    どうして一つの傳へのみが斯う永く珍重せられたらうかは、文獻の系統を調べただけでは多分解し得まい。

    恐らく是があの時代久しい間の、かなり有名なる民間說話の一つであつた爲に、却つて此樣に記錄の根據を大切にしたのであつたらう。

    良辨僧正の傳說が起つて後も、'
  translation: '――が起きた場所も鎌倉だったかのようにいう。ところが、良弁僧正の普通でない誕生と母子の再会は、古いというだけで、これも一種の『恋衣物語』にすぎなかった。台本を持たなかったころの語り手は、行く先々で、ありそうな近くの地名に差し替えていたので、その名残は今でもまだ口伝えに残っている。『甲斐昔話集』では、場所は駿河国で、茶摘みのとき畑のあぜに置いていたら、といい、その子は大和国の東願寺の小僧になっていたという。『聴耳草紙』の「長須田まんこ」の話では、飛んでも陸中国の外には行かず、やはり十三年目に墓峠の地獄山というところで再会しているが、その子もやはり、のちに名僧となる途中の人物だった。ついでなので一言だけ付け加えると、この話で母の名をマンコというのは、『曽我物語』との関連を強く示唆する。それから、この話の前半だけなら、内田氏の『南総の俚俗』にも、クラッコ鳥の由来として、鷲に子を奪われた母の悲しみが説かれている。それは普通の聞き手にこの部分が特に深い印象を与え、たまたま鳥の前世を語る説話と結びついて再び現れただけで、別にそのような伝えが独立して存在していたのではないことは明らかだ。

    奈良の良弁僧正の話も、これに比べると、ただいくらか改変が少なく、人気がはるかに高く、もっと広く行われていたというだけである。『気仙郡誌』に採録された竹駒村の羽縄氏の家伝では、牧場の牛を襲う大鷲を防ぐために、主人が牛の皮を身にまとっていると、鷲がつかんで遠い離れ島へ運び、落としたとなっており、鮭に助けられてその背に乗り、再び家へ戻ってきたという。むしろ鮭を家の神にした理由の説明に付随した形である。しかしこれにも家ごとの小さな違いがあって、中には、鷲にさらわれたのは娘で、鮭の大助に口説かれてその妻になったという話もあるそうだ（『聴耳草紙』三五〇頁）。伴蒿蹊翁の『閑田次筆』には、「摂津高槻の藩士鷲津見某は、鷲につかまれて助かった子を祖先とする。今いる鷲見七郎太夫はその子孫らしい。和泉堺の旭蓮社の開祖玄恕上人も、鷲に取られて助かった人である。同じようなこともあるものだ」などといっている。しかし、この類の話が遠く『日本霊異記』の時代に始まっていたことには気づかなかった。『霊異記』の「汝鷲瞰残云々」は、『今昔物語』巻二十六には「おまえは鷲の食い残しだぞ」と出ているから、地名はわずかに違うものの、同じ話の和訳であることは疑いなく、『水鏡』の皇極天皇の項にも、同じ話が転載されている。なぜ一つの伝えだけがこれほど長く大切にされたのかは、文献の系統を調べただけでは、おそらく理解できないだろう。きっと、その時代の長い間、これがかなり有名な民間説話の一つだったために、かえってこのように記録による裏づけを重んじたのだろう。良弁僧正の伝説が生まれた後も、――'
  notes:
  - 冒頭は230、末尾は232に続く。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第31頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

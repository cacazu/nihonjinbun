  section: 隣の寝太郎／四 沖縄の睡虫・五 物草太郎の草子
  original: 落著いて居て其上に怖い眼をして居る。さうして夜の明け方に茂つた樹の中から、ふわりと飛んで行く擧動なり羽の色なりが、特に靈異の感を抱かせたものと思はれ、人が此鳥の來集に驚いて、祈禱や占ひをしたといふ話は多いのである。果して若し私の想像して居る樣に、鷺が前だとすれば沖繩へはよほど早くから、寢太郞の話が渡つて行つたのである。或はあべこべに向ふの群島から、渡つて來たとも言へさうなものだが、實際はさういふ場合が想像し得られず、又他に類例も無いばかりか、話の本州に於ける分布と變化とは、到底其樣な一隅の根原を想像することを許さぬほど、弘く久しく又細かいのであつた。五物草太郞の草子其變化の實例としては、幸ひに玆に物草太郞の一卷がある。この有名な御伽の草子と、我我の民間說話との關係は、固より遺老說傳が島人の口碑を拾載したやうな簡單なものでは無かつた。第一に是には話を長く且つ面白くする試みがあつた。さうして首尾の形を整へ、又恐らくは之を上品なものとする爲に、舞臺を花の都に移すといふ類の、幾つかの小さき改定を加へたことは、ちやうど今日の地方の才人が、昔話を所謂コントたらしめんとするのと、同じやうな苦心であつたらうと思ふ。併し二三の文學史家が臆斷した如く、是を或時代の文藝の創作とし、他の幾つかの民間說話は卽ち粉本を是に採つたものとすることは、聊かも根據の無いことである。草子の物草太郞に若し何等かの新し味があつたとすれば、それは昔の物語繪に做うて、話を一卷の眼で看るものにしたこと、及び今まで行はれて居た色々の話し方を寄せ集め、それに筆者の思ひ付きを以て、尙幾つかの文句を附け添へたらしきことで、話そのものは突如として考案せられる程の筋でも無く、又前々から聽いて親しみを持つ者だけが、格別面白さを感ずるやうな潤色と誇張とに充ちて居る。物語の骨子は依然として、誰にも認められなかつた大なまけ者の器量才覺が、不思議の良緣に成功して、始めて世に現れたといふだけの簡單なもので、それを餘計な滑稽が幾分か引きゆがめて居ることは事實であるが、尙今までの一寸法師、乃至は蛙蛇田螺の出世譚と一貫して、優れた聟殿は往々人間の侮り輕しむる者の形を假りて、通うて來るものだといふ古代人の信仰の、痕跡だけは留めて居るのである。
  translation: '……落ち着いていて、そのうえ怖い目をしている。そして夜明けに、茂った木の中からふわりと飛んでいく様子や羽の色が、とりわけ霊妙で不思議な感じを抱かせたものと思われる。この鳥が集まってくるのに驚いて、人が祈祷や占いをしたという話は多い。もし本当に、私の想像どおり鷺のほうが先だったとすれば、沖縄へはずいぶん早くから寝太郎の話が渡っていったことになる。逆に、あちらの島々から渡ってきたともいえそうだが、実際にはそうした場合を想像できず、ほかに類例もない。そればかりか、本州でのこの話の分布と変化は、そんな一隅を起源と考えることを到底許さないほど、広い範囲にわたり、長い歴史を持ち、また細かく枝分かれしていたのである。

    五　物草太郎の草子

    その変化の実例として、幸いここには『物草太郎』という一巻がある。この有名なお伽草子と私たちの民間説話との関係は、もちろん、『遺老説伝』が島の人の言い伝えを拾って載せたような、単純なものではなかった。第一に、そこには話を長く、面白くしようという試みがあった。そして、始めから終わりまでの形を整え、またおそらく上品なものにするために、舞台を華やかな都へ移すといった、小さな改定をいくつか加えている。これは、今日、地方の才人が昔話を、いわゆるコントに仕立てようとするのと同じような苦心だったのだろうと思う。しかし、二、三の文学史家が根拠もなく判断したように、これをある時代の文芸的創作とし、ほかのいくつかの民間説話はこの本を下敷きにしたものだ、とするのは、まったく根拠がない。草子の『物草太郎』に何か新しさがあったとすれば、それは昔の物語絵にならい、話を一巻の、目で見るものにしたことと、それまで行われていたさまざまな語り方を寄せ集め、書き手の思いつきで、さらにいくつかの文句を添えたらしい、ということである。話そのものは、突然思いつけるような筋ではない。また、以前から聞いて親しんでいた人だけが、とりわけ面白く感じるような脚色と誇張に満ちている。物語の骨組みは、相変わらず単純なものだ。誰にも認められなかった大怠け者の能力と才覚が、不思議なよい縁組に成功して初めて世に現れた、というだけである。余計な滑稽さがそれをいくらか歪めているのは確かだが、これまでの一寸法師や、蛙・蛇・田螺の出世話と一つにつながって、優れた婿殿はしばしば、人間が侮り軽んじるものの姿を借りて訪ねてくる、という古代人の信仰の跡だけは残しているのである。'

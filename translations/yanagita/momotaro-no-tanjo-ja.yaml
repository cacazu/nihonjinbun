- id: mmt-059-01
  scan: 59
  section: 海神少童
  original: 'が大きくなつて、如何なる影響をある優れて古い家に及ぼしたかといふ點も、亦此一章に於

    て我々が發見したやうに、可なり著しい國民的特徴を示して居るのである。斯ういふ幾つか

    の實例を記述することによつて、當然に今日の神話に關する學說は改まらねばならぬ。卽ち

    民間說話の信仰的背景には、往々にして各民族每に獨立したものがあつたこと、それが外部

    からの刺衝の少なかつた日本の田舎などでは、存外に近い頃まで其痕跡を保存して居たとい

    ふことは、外國にはまだ知らぬ人も多いのである。場處や時刻や話し手の條件を完備せぬ故

    に、之を純然たる神話とは區別せねばなるまいが、少なくとも說話が一種の宗教力を以て、

    支持し傳承せられて居た時代は新らしかつた。傳說と說話との分界が我邦ではやゝ明瞭を缺

    くのも、私には是が原因であつた樣に思はれる。

    是を他の一面からいふと、昔話の宗教史々料としての價値は、日本に於ては他の邦よりも

    高いといふことにもなる。實例でいふならば何故に龍王龍神が、今でも此樣に尊信せられて

    居るかといふ疑問には、佛者漢學者の答へ得る以上に、「ハナタレ小僧樣」が一段と明確に說

    明してくれるかも知れぬ。水の中から至つて小さな童兒が送られて、まのあたり人類を富貴

    安樂にしたといふ昔話が、此通り弘く又久しく傳はつて居るからである。飜つて他の一方に

    は神代の正史といふものに、二代までも引續いて海の神と御緣組なされたと云ひ、更に宇佐

    八幡の別傳には龍女を御妃となされたと記して居るのも、或は又中國の廣い山地に亘つて、

    田の神が日天と龍女との結婚によつて、每年誕生して嶺より降り給ふといふ田植唄が行はれ

    て居るのも、共に斯ういふたゞ一種の昔話を透して、それ〴〵の時代の感覺を窺ひ知ること

    が出來るのである。少なくとも今日の雨を乞ひ堤の守護を期待する信仰以上に、遙かに廣汎

    の交涉ある水神樣を、以前の日本人は渴仰して居たのであつた。それは島國の水田を耕す人

    民として、素より當然のことと言ふべきであるが、多くの昔話の如く具體的に、其事實を理

    解させる材料は、他にはちよつと見つけることが出來なかつた。故に私たちは大人になつて

    から、もう一度御伽話を考へて見るのである。(昭和五年四月、旅と傳說)'
  translation: 'が成長して、あるとくに古い家にどのような影響を与えたか、という点も、この章で私たちが発見したように、かなり顕著な国民的特徴を示している。こうしたいくつかの実例を記述すれば、当然、今日の神話に関する学説も改められなければならない。つまり、民間の物語の信仰的背景には、しばしば民族ごとに独自のものがあり、外部からの刺激の少なかった日本の田舎などでは、意外なほど最近まで、その痕跡が保存されていたということである。外国には、まだこれを知らない人が多い。場所や時刻、語り手についての条件がすべてそろっていないので、これを純粋な神話とは区別しなくてはなるまい。しかし少なくとも、物語が一種の宗教的な力によって支えられ、伝承されていた時代は、そう古くない。日本で伝説と物語との境がやや不明瞭なのも、私にはこれが原因だったように思われる。

    別の面から言えば、昔話の宗教史の資料としての価値は、日本ではほかの国より高い、ということにもなる。実例を挙げれば、なぜ竜王や竜神が今でもこれほど尊び信じられているのかという疑問には、仏教者や漢学者が答えられる以上に、「ハナタレ小僧様」が、いっそう明確な説明を与えてくれるかもしれない。水の中からごく小さい子供が送り出され、目の前で人々を豊かにし、安楽にしたという昔話が、これほど広く、長く伝わっているからである。一方で、神代の正史といわれるものには、二代続けて海の神と縁組されたとあり、さらに宇佐八幡の別の伝えには、竜女を妃とされたと記されている。また、中国地方の広い山地には、田の神が日天と竜女との結婚によって毎年生まれ、峰から下りてこられる、という田植え歌が伝わっている。これらもすべて、こうしたたった一種類の昔話を通して、それぞれの時代の感覚をうかがい知ることができる。

    少なくとも、今日の雨乞いや堤の守護を願う信仰よりも、はるかに幅広い関わりを持つ水神様を、昔の日本人は切に仰ぎ求めていた。それは、島国で水田を耕す人々として、もとより当然のことというべきだろう。しかし、多くの昔話ほど具体的に、その事実を理解させてくれる資料は、ほかには簡単に見つからなかった。だから私たちは、大人になってから、もう一度おとぎ話を考えてみるのである。（昭和五年四月、『旅と伝説』）'
  notes:
  - 「中國の廣い山地」は日本の中国地方を指す。初出年月の昭和五年は1930年。
  sequence: 53
- id: mmt-060-01
  scan: 60
  section: 海神少童／延命小槌
  original: '延命小槌

    水の神に木を奉る功德は、曾て此上も無く重大なものと、考へて居た時代があつた樣であ

    る。今日は單に一つの說明せられざる樣式と化して、それを守らぬと何やら氣になるといふ

    に止まるほどのものでも、尙その古い信仰の痕跡と認められる例が、算へて見ると幾つも有

    るのである。例へば田植の代搔きの日、苗代の種下しの際、又は正月十一日の田祭の日など

    に、水口に三本の栗の小枝を挿すなどは其一つである。楊は時々は折口から根をさすことが

    あつた。是が此木をめでたいものにした理由かとも思はれる。稻妻といふ歌言葉も以前は現

    實の信仰であつた。それで靑田の雷に見舞はれた箇處に、靑竹を立てて日水二神の婚姻を記

    念する風習も起つたらしいのである。泉の神をオスヅサマといふ地方は廣く、其祭は多くは

    夏の盛りに營まれ、是にも木の串を水の滸に立てるのを通例として居た。其串のシデに白い

    紙を剪つて附けるのが目に立つ樣になつてから、行事の中心は僅かばかり移つたかと思ふが、

    百姓が白紙を用ひ得なかつた時代は、隨分久しく續いて居たのであつた。清水の湧く土地に

    は必ず一本の神木があつた。それが自然に生ひ茂つたものである場合にも、特にそのうちの

    或木を保存して、神の憑りたまふものとして崇敬して居た。井の傍に栽ゑる木は今でも略、

    定まつて居るが、是も恐らくは風景の宗教的起原とも名くべきものであらう。

    或はそれ等の樹の美しく榮えて居る場處に、屢、清き泉を見付けたといふ經驗が最初であ

    つたかも知れぬ。兎に角に水の神は樹を愛したまふといふ信仰が底になかつたならば、柴苅

    爺の所行があれ程までに、神の御氣に叶うたといふ昔話は起らなかつた筈である。その至つ

    て大切な理由が、世と共に漸く朧ろになつて來て、各地の靈童譚は童話らしく、輕くその發

    端を取扱ふ樣になつた。同じ熊本縣でも南の八代郡に殘つて居た一例などは、此點に關して

    は幾分か北のハナタレ小僧樣を補充して居る。濱田隆一君の採錄に依れば(昔話號七七頁)、あ

    の地方の昔話には次の如き形で始まつて居るものがある。

    むかし或處に一人の爺さんがあつた。或年の暮に門松を賣りに町へ出たが、どうしたこ

    とか一本も賣れぬので、其まゝ擔いで家に歸つて來る途で、ふと思ひ付いて是は川の神'
  translation: '延命小槌

    水の神に木をささげる功徳が、この上なく重要なものと考えられていた時代が、かつてあったようである。今では、ただ説明のつかない形式になり、守らないと何となく気になる、という程度のものであっても、なお古い信仰の痕跡と認められる例は、数えてみればいくつもある。たとえば、田植えの代搔きの日、苗代に種をまくとき、あるいは正月十一日の田祭りの日などに、田の水口へ栗の小枝を三本挿すのは、その一つである。ヤナギは、ときには折った切り口から根を出すことがあった。これが、この木をめでたいものとした理由なのかとも思われる。「稲妻」という歌の言葉も、以前は実際の信仰だった。それで、青田に雷が落ちた場所に青竹を立て、日の神と水の神の婚姻を記念する習慣も起こったらしい。泉の神をオスヅサマと呼ぶ地方は広く、その祭りは多くが夏の盛りに行われ、ここでも木の串を水際に立てるのが普通だった。その串に、幣として白い紙を切ってつけることが目立つようになってから、行事の中心は少し移ったのかと思う。しかし、農民が白紙を使えなかった時代は、ずいぶん長く続いていた。

    清水の湧く土地には、必ず一本の神木があった。それが自然に生い茂った木である場合にも、とくにその中のある木を残し、神が宿るものとしてあがめていた。井戸のそばに植える木は今でもほぼ決まっているが、これもおそらく、風景の宗教的起源とでも呼ぶべきものだろう。

    あるいは、そうした木が美しく茂る場所で、しばしば清い泉を発見したという経験が、始まりだったのかもしれない。ともかく、水の神は木を愛されるという信仰が根底になければ、柴刈りのおじいさんの行いが、あれほど神のお気に召したという昔話は生まれなかったはずである。その非常に大切な理由が、時代とともにだんだん曖昧になり、各地の不思議な子供の物語は、童話らしく、その発端を軽く扱うようになった。同じ熊本県でも、南の八代郡に残っていた一例などは、この点について、北のハナタレ小僧様をいくらか補っている。濱田隆一君の採録によれば（『昔話号』七七頁）、あの地方の昔話には、次のような形で始まるものがある。

    昔、あるところに一人のおじいさんがいた。ある年の暮れ、門松を売りに町へ出たが、どうしたことか一本も売れないので、そのまま担いで家へ帰る途中、ふと思いつき、これは川の神'
  notes:
  - 画像をまたぐ文は前後のunitと接続する。
  - 原文は水口に挿す枝を「栗」とし、次の文で「楊」に話を移す。樹種を勝手に統一せず、そのまま訳した。

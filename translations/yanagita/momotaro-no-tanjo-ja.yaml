  section: 海神少童／龍宮小僧
  original: 終りに尙一つ心付いたことを言ふと、久留女木といふ村の名は、行基の人形が反轉して流れたから起つたといふのはこぢつけだとしても、兎に角にもとは大淵の名であつたものが、轉じて民居の稱呼となつたことは疑はれぬ。今でも格別珍らしい地名で無いから、實地に當つた人は多いことと思ふが、私の知る限りではクルメキは必ず水邊の字名で、水のくるくるとまはる特徴に由つて生じたことは、他の百女木·澤目木·柄目木なども同じであつた。そのクルメキの名ある淵から、龍宮小僧が出て來たといふことは、卽ち紫波江刺の二郡昔話に、ある谷川の渦を卷く淵より、水界に往來して醜い童子を貰つて來たとあるのと、同日の談でなければならぬのである。但し地形は變り易く水の姿は常住で無いから、渦は卷かなくなつて地名のみが、傳はつて居る場合も有り得るのである。諸國に數多く分布する和泉式部の誕生地の中で、恐らく北の端かと思ふのは陸中和賀郡の橫川目村であるが、爰でも其地名をグルメキと謂ひ、しかも故跡の名木笠松は汽車の窓からも見えながら、もう其あたりには渦卷く淵は無く、從うて別の傳說が地名を說明するやうになつて居る。和賀稗貫郡村誌に、此笠松の下に一つの古碑があつて、それが太陽に向つて廻轉した故にグルメキと謂つたとある。そんな向日葵のやうな石塔といふものが、有り得るか否かは問題で無い。それよりも考へて見たいのは、この全國に數箇所の誕生地をもつて居る傳說の和泉式部が、或は亦一箇の龍宮小僧、もしくは之と對立すべき水の少女では無かつたかといふことである。決斷は素より容易で無い。しかしそれに進んで行く飛石だけは散らばつて居る。龍神の黑猫や木の根株から出た白犬を見た我々は、更に中間の異なる例を比較した上で、もう一度肥前福泉寺の鹿の娘のことを考へて見なければならぬのである。
  translation: '最後に、もう一つ気づいたことを述べる。久留女木という村名が、行基の人形が向きを変えて流れたことに由来するというのは、こじつけだとしても、もとは大淵の名だったものが、転じて人々の住む集落の名になったことは疑えない。今でも、それほど珍しい地名ではないので、実際に現地を見た人は多いだろう。私の知るかぎりでは、クルメキは必ず水辺の小字名であり、水がくるくる回る特徴から生まれたものであることは、ほかの百女木・沢目木・柄目木なども同じであった。

    そのクルメキという名の淵から竜宮小僧が出てきたという話は、つまり、紫波・江刺の二郡の昔話で、ある谷川の渦巻く淵から水の世界へ行き来し、醜い童子をもらってきたという話と、同じものと見なすべきなのである。ただし、地形は変わりやすく、水の様子も一定していないので、渦が巻かなくなり、地名だけが残っている場合もありうる。

    諸国に数多く分布している和泉式部の誕生地のうち、おそらく最北と思われるのは陸中和賀郡の横川目村である。ここでも、その場所をグルメキと呼び、ゆかりの名木である笠松は汽車の窓からも見えるが、もう、そのあたりには渦巻く淵はない。そのため別の伝説で地名を説明するようになっている。『和賀稗貫郡村誌』には、この笠松の下に一つの古碑があり、それが太陽の方向へ回転したのでグルメキと呼んだ、とある。

    ひまわりのような、そんな石塔がありうるかどうかは、問題ではない。それより考えてみたいのは、全国に何か所も誕生地を持つ、この伝説上の和泉式部が、やはり一人の竜宮小僧、あるいは、その女性の対になる水の少女ではなかったか、ということである。もちろん、断定は容易ではない。しかし、その結論へ進むための飛び石だけは、あちこちにある。竜神の黒猫や、木の切り株から出た白犬を見てきた私たちは、さらに、その間にあるさまざまな例を比較したうえで、もう一度、肥前福泉寺の鹿の娘について考えてみなければならない。'

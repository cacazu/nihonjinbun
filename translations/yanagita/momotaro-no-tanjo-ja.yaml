- id: mmt-108-01
  scan: 108
  section: 瓜子織姫／黃金の瓜
  original: '著く。島の漁師が見つけて開けて見ると、美しいお姫樣が居られるので、家へ連れて歸つて

    親切に世話をした。そのうちにお姫樣は男の子を生む。其子が大きくなつてから、茄子の苗

    を持つて殿樣の御殿へ賣りに行く。それは何茄子かと殿樣が御尋ねなさると、是は屁ひらぬ

    女の作つた苗ですと子供が答へる。それを聽いて殿樣は、おならをせぬ女が有るものかと言

    ふと、そこで其子供が、それでは何故に私の御母さんは、屁をひつた位にうつろ舟で流され

    ましたかと言つた。殿樣ははつと昔の事を思ひ當つて深く後悔し、母子二人を城の中へ呼び

    戾すことにした(壹岐島昔話集、昔話號八三頁)。

    (二)むかし殿樣の奧方が御客の前で、どうした機でかおならをした。殿樣は腹を立てて

    獨木舟に其奥方を入れて海に流した。泣きながら段々流されて行く中に、舟は或島に流れ著

    く。濱を通りかゝつた尼樣が助けて自分の寺に連れて行つて世話をして居るうちに、玉のや

    うな男の子が生れる。其子が十歲になつて母から此話をきいて、獨木舟に乘つて殿樣の國に

    行つて、山から椿の木を一本掘つて來て、「金のなる木やー」と殿樣の屋敷近くをふれてある

    いた。殿樣がそれを喚び留めて買つて見ると、たゞの椿の木だからどうして是に金が生るか

    と尋ねる。おならをせぬ人が栽ゑるならばお金がなりますと其子が答へる。

    馬鹿者め、世の

    中に屁をせぬ者が有るかと叱られて、其子は淚を流し、そんなら何故にお母樣は流されまし

    たかと言つた。それを聽いて驚いて殿樣は其子の顏を見ると、昔の奥方によく似て居た。

    す

    ぐに家來を遣つて島に船橋を架け、奧方を呼戾した。さうして今までの島の子供は、忽ち若

    殿樣になつて親に孝行をした(豐後南海部郡童話、日本神話傳說の研究四〇六)。

    (三)是と非常によく似た昔話が朝鮮にもあつた。昔ある花嫁が新枕の夜屁をした爲に、

    聟は緣を切つて再び訪れなかつた。其花嫁が身持になつて、玉の男の子を生んで其名を無心

    出とつける。無心出は大きくなつて通學をするやうになつたが、友だちが侮り嘲るので不審

    して母に問ひ、仔細に父に見棄てられたわけを語つて聽かされた。そこで外に出て一升の瓜

    の種を買ひ、それを携へて父親の家に行き、朝種ゑて夕に食べられる瓜の種を買うてくれと

    言つた。父親が出て來てそれは本當かと聞くと、本當だ、

    しかし屁を出さぬ人が栽ゑなくて

    は、私の言ふ通りには出來ぬと答へた。どこに屁をひらぬ人が有るものかと主人がいふ。

    そ

    んなら何故にあなたは私の母樣を、婚禮の晩に棄てなされたかと言つたので、主人は初めて'
  translation: '着いた。島の漁師が見つけて開けると、美しいお姫様がいたので、家へ連れ帰り親切に世話をした。そのうち、お姫様は男の子を産む。その子が大きくなり、茄子の苗を持って殿様の御殿へ売りに行く。殿様が「それは何という茄子か」と尋ねると、子供は「これは、おならをしない女が作った苗です」と答える。それを聞き、殿様が「おならをしない女などいるものか」と言うと、子供は「それなら、なぜ私のお母さんは、おならをしたくらいのことで、うつろ舟に入れて流されたのですか」と言った。殿様ははっと昔のことを思い当たり、深く後悔して、母子を城へ呼び戻すことにした（『壱岐島昔話集』、『昔話号』八三ページ）。

    （二）昔、殿様の奥方が客の前で、どうしたはずみか、おならをした。殿様は怒り、奥方を丸木舟に入れて海へ流した。泣きながらだんだん流されていくうちに、舟はある島へ着いた。浜を通りかかった尼さんが助け、自分の寺へ連れていって世話をしていると、玉のような男の子が生まれた。十歳になったその子は、母からこの話を聞き、丸木舟に乗って殿様の国へ行った。そして山で椿の木を一本掘り、「金のなる木ですよー」と殿様の屋敷の近くを触れて歩いた。殿様が呼び止めて買うと、ただの椿なので、「どうしてこれに金がなるのか」と尋ねる。「おならをしない人が植えれば、お金がなります」と子供は答えた。「馬鹿者、世の中におならをしない人間がいるか」と叱られ、子供は涙を流して、「それなら、なぜお母様は流されたのですか」と言った。殿様は驚いてその顔を見ると、昔の奥方によく似ていた。すぐに家来をやって島へ船橋を架け、奥方を呼び戻した。こうして、今まで島にいた子供は、たちまち若殿様になり、親孝行をした（『豊後南海部郡童話』、『日本神話伝説の研究』四〇六ページ）。

    （三）これに非常によく似た昔話が、朝鮮にもあった。昔、ある花嫁が初夜におならをしたため、婿は縁を切り、二度と訪ねてこなかった。花嫁は身ごもって、玉のような男の子を産み、「無心出」と名づけた。無心出は成長して学校へ通うようになったが、友達に侮られ、からかわれるのを不審に思って母に尋ね、父に捨てられたいきさつを詳しく聞かされた。そこで外へ出て瓜の種を一升買い、父親の家へ持っていって、「朝まいて夕方には食べられる瓜の種を買ってください」と言った。父親が出てきて、本当かと聞くと、「本当です。ただし、おならをしない人が植えなければ、私の言うとおりにはなりません」と答えた。主人は「おならをしない人など、どこにいるものか」と言う。「それなら、なぜあなたは私のお母様を、婚礼の晩にお捨てになったのですか」と言ったので、主人は初めて'
  notes:
  - 冒頭はscan107、末尾はscan109へ続く。
  - 「無心出」は原話の人名。「朝鮮」は原文の歴史的地域名を保持。
  - 船橋は、舟をつないで架ける橋。
  - 前のスキャンからの続き
  - 次のスキャンへ続く
  sequence: 113
- id: mmt-109-01
  scan: 109
  section: 瓜子織姫／黃金の瓜
  original: '心付いて少年に一部始終を尋ね、我子だとわかつたから直ちにその離緣した女房を喚び迎へ

    た(淸水兵三君譯、右同書四〇八頁、但し出處を詳にせず)。

    (四)同じ豐後國でも吉吾噺といふ笑話群の中に、主人公の吉吾が「金のなる木は要りませ

    んか」と言つて、たゞの椿の木を賣りに行つた話がある。主人との問答は全く(二)と同じで、

    それで遣込めて屁故に離緣した花嫁を喚戾させたといひ、おまけに其嫁が客來の席で屁をひ

    つたから怒つて追出したと言ふのだから、愈以て前の話の轉用であることは明かである。

    但しその奇拔な掛引をした者が、十歲の童兒で無くては感動は無いのだが、大體に笑話は皆

    斯くの如く、一部の興味に走つて行くのが常であつた(中田千畝君集、旅と傳說一卷四號)。

    (五)ところが一方には遠く奧州の岩手山の麓に、是がまだ幾分か信じ易い傳說の形で保

    存せられて居たのである。むかし此土地には野菊といふ美人があつて、二度まで雫石の殿樣

    のオキサキに上がつた。雫石の村では野菊井戶といふのが、その野菊の化粧の水であつた。

    そこで面を洗へば今でもえゝをなごになると言つて居る。故老の記憶して居た話に、この野菊

    といふのは何處にも無いといふ位の好い女で、雫石の殿樣手塚左衞門尉といふ人のオキサキ

    に上がつた。或日殿樣の前で少し粗相なことをした爲に、御咎めを受けて暇を出されて、此

    井戶の脇に住んで居た。何年かの後に殿樣は鷹狩の歸りに、雫石の町で不思議な童子が、黃

    金のなるふくべの種と、ふれてあるいて居るのに出逢つた。本當に黃金が生るかときくと、

    黃金は本當になるが屁をせぬ人が蒔かねばならぬと答へた。屁をしない人が有るものかと殿

    樣が言ふと、それなら何故に私の母ばかり、御咎めを受けて出されましたかと言つたので、

    始めて其少年の我子であることが判り、母の野菊と共に再び御城へ上がることになつた。今

    でも此地方の御祝ひといふ酒盛歌に、

    雫石はめいしようどこ

    野菊の花は二度ひらく

    といふ章句があるのは、此時から始まつたものであるといふ(田中喜多美君、民族一卷一號)。

    (六)右の傳說の主要部が、もとは此地方でも流行の說話であつたことは證據がある。し

    かも今日行はれて居る昔話は、早又少しばかり變化して居る樣子で、現に鄰の紫波郡では、

    之を黄金のなる吹花と謂つて居る。むかし殿樣の奥方が同じ理由によつて追出され、里方に'
  translation: '気づいて、少年に一部始終を尋ねた。自分の子だとわかったので、ただちに離縁した妻を呼び迎えた（清水兵三君訳、同書四〇八ページ。ただし出典は詳しく示されていない）。

    （四）同じ豊後国でも、「吉吾噺」という笑い話の一群に、主人公の吉吾が「金のなる木はいりませんか」と言って、普通の椿の木を売りに行った話がある。主人との問答は（二）とまったく同じで、それで主人を言い負かし、おならのために離縁した花嫁を呼び戻させたという。しかも、その嫁が来客の席でおならをしたので、怒って追い出したというのだから、ますます、前の話を転用したものだと明らかになる。ただ、その奇抜な駆け引きをしたのが十歳の子供でなければ感動は生まれない。しかし、笑い話は一般にこのように、一部分の面白さへ走っていくのが常だった（中田千畝君採集、『旅と伝説』一巻四号）。

    （五）ところが一方、遠い奥州の岩手山の麓には、この話が、まだいくらか信じやすい伝説の形で残っていた。昔この土地には、野菊という美人がいて、二度、雫石の殿様のお后に上がった。雫石村の「野菊井戸」は、その野菊が化粧に使った水の井戸で、そこで顔を洗うと、今でもいい女になるといわれている。古老が覚えていた話では、この野菊はほかにはいないほど美しい女で、雫石の殿様、手塚左衛門尉のお后になった。ある日、殿様の前で少し粗相をしたため、とがめを受けて暇を出され、この井戸のそばに住んでいた。何年か後、殿様が鷹狩りから帰る途中、雫石の町で、「黄金のなるふくべの種」と触れて歩く不思議な子供に出会った。本当に黄金がなるのかと聞くと、「黄金は本当になりますが、おならをしない人がまかなければなりません」と答えた。「おならをしない者などいるものか」と殿様が言うと、「それなら、なぜ私の母だけが、おとがめを受けて追い出されたのですか」と言った。そこで初めて、その少年が自分の子だとわかり、母の野菊とともに、再び城へ上がることになった。今でもこの地方の「御祝い」という酒盛り歌に、

    「雫石は名所どころ、

    野菊の花は二度開く」

    という歌詞があるのは、このときから始まったものだという（田中喜多美君、『民族』一巻一号）。

    （六）この伝説の主な部分が、もとはこの地方でも広く語られた説話だったことには証拠がある。しかも、今語られている昔話は、すでにまた少し変わっているようで、実際、隣の紫波郡では、これを「黄金のなる吹花」と呼んでいる。昔、殿様の奥方が同じ理由で追い出され、実家に'

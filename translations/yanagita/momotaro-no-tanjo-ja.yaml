  original: した爲であらう。それには又周圍の俗衆が、雅語と律語とに對しては完全に無抵抗で、如何に凡庸陳腐なる思想でも、之を三十一文字にして見せると感心するといふ、宿命的なる習癖も便宜を供して居た。たとへばかの西行法師が吟と傳ふる野糞の歌のやうなものから、宗祇が閉口して遁げて戾つたといふ童兒老女の問答の類まで、我々の家庭の昔話の中には、歌を中心とした說話が無數に發達して居るのは、よその民族には見られない奇現象であつた。此種の昔話は其中心を爲す歌が拙なければ、話にならぬのは當り前のことだが、正直な所十中の九まで、その歌はあきれ返るほどまづいものである。だから少しばかり其方面の鑑賞が進むと、人が相手にしなくなるのも致し方は無いので、不幸なる我邦の前代の盲人は、斯んな未來の無い仕事に、文字通りうき身をやつして居たのである。目の明いた人たちならば、他にもまだ色々の笑話の種を見つけることが出來た筈である。だから所謂狂歌咄の大多數は、座頭の原作であらうと私は思つて居るのであるが、是にはまだ證據とても無い故に、强ひて水掛論を主張しようとはしない。さし當りは明白に彼等で無ければ考へ出せさうに思はれぬものだけを、もう少し玆に拾つて見ようとするのである。餅と座頭との交渉は、大分久しい前から笑話の有力なる題材の一つとなつて居た。私は是を以て餅の日が座頭の來る日、餅を食ふべき宵が又彼等のおどけ話を、集まつて聽かうとした機會であつたことを、意味するものと解して居る。安樂庵策傳の醒睡笑卷二には可なり此系統中の優秀なる一例が載せられて居る。座頭の出居に宿を借りていねたるを打忘れ、呼びも出さず、搗きたる餅のあたゝかなるを、家内の人ばかり食ふ座敷へ、餅つくと目にはさやかに見えねども杵の音にぞ驚かれぬる是などはどうやら歌が先づ出來て、後に小話の方は取つて附けたやうにも思はれるが、兎に角に作者は盲であり、又敎養のある盲でもあつたことがわかる。風雅なる京都の社交界に出入して、本歌の取沙汰を專らとした人々と接して居たればこそ、斯ういふ話を出しても高笑ひせられたであらうが、是がもし古今集も知らない百姓の家であつたならば、聽衆は默つてたゞまじ〳〵と彼の顏を見守つたことであらう。だからさういふ田舍の用途に對しては、別に又色々のもつと安直なるものが出來て居た。昭和の今日でも東北地方などに行くと、實
  translation: '〔前のスキャンから続く〕ためだろう。それにはまた、周囲の一般の人々が、優美な言葉や韻律ある言葉に対してはまったく抵抗がなく、どんなに平凡で陳腐な考えでも、三十一文字の歌にして見せれば感心する、という宿命的な習慣も都合よく働いていた。たとえば西行法師が詠んだと伝える野糞の歌のようなものから、宗祇が困り果てて逃げ帰ったという子どもや老女との問答の類まで、家庭で語る昔話の中に、歌を中心とした説話が無数に発達しているのは、よその民族には見られない不思議な現象だった。この種の昔話は、中心となる歌が下手なら話にならないのは当然だが、正直なところ十のうち九までは、歌はあきれ返るほど下手なのである。だから、その方面の鑑賞眼が少しでも進めば、人が相手にしなくなるのも仕方がない。日本の前の時代の不幸な目の見えない人々は、こんな将来のない仕事に、文字どおり身を削っていたのである。目の見える人なら、ほかにもさまざまな笑い話の種を見つけられたはずである。だから、いわゆる狂歌咄の大多数は座頭の原作だろうと私は考えている。ただし、これにはまだ証拠もないので、無理に結論の出ない議論を押し通そうとはしない。さしあたり、明らかに彼らでなければ思いつきそうにないものだけを、もう少しここに拾ってみようと思う。

    餅と座頭との関わりは、ずいぶん以前から笑い話の有力な題材の一つだった。私はこれを、餅の日が座頭の来る日であり、餅を食べる晩がまた、人々が集まって彼らのおどけ話を聞こうとする機会だったことを意味すると理解している。安楽庵策伝の『醒睡笑』巻二には、この系統の中でもかなり優れた例が載っている。

    「座頭が居間に宿を借りて寝ていたのをすっかり忘れ、呼び出しもせず、家の者だけでつきたての温かい餅を食べている座敷へ、座頭が歌を詠んだ。

    『餅をついていると、目にははっきり見えないけれども、杵の音で気づかされたことだ。』」

    これなどはどうやら歌が先にできて、後から小話を付け加えたようにも思われる。しかし、ともかく作者は目が見えず、しかも教養があったことがわかる。風雅な京都の社交界に出入りし、もとの歌を話題にすることに熱心な人々と接していたからこそ、こんな話をしても大笑いされたのだろう。これがもし『古今集』も知らない農家だったなら、聴衆は黙って、ただじっとその顔を見つめたにちがいない。そこで、そういう田舎向けには、別にさまざまな、もっと手軽な話ができていた。昭和の今日でも東北地方などへ行くと、実に、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン273）と本文OCRを照合。
  - 引用歌は『古今和歌集』の秋の訪れを詠む歌の替え歌。「目にはさやかに見えねども」を座頭の境遇と重ねている。

  section: 狼と鍛冶屋の姥／九 良辨僧正の杉
  original: 'て飮むと下りると謂つて居た。

    今は其風も絕えたであらうし、他の內陸の方にはまだ類例を探し當てぬが、是はもう少し根氣よく、又稍々まはり遠い方法を以て、追々に尋ね近よるべき問題であると思つて居る。

    だから現在の所では、まだ至つて心もと無い假定ではあるが、私は逆に土佐の東境のやうな傳說の存するを見て、鍛冶の母なるものが今日の產婆の前身、卽ち半ば信仰の助けを借りて、婦女產褥の惱み憂ひを、輕くする役目を持つて居たのでは無いかと考へて居る。

    さうして其祭式に伴なふ語りごとの中に、山の神が丈夫な且つ幸運の赤兒を授けたといふ、古い傳承を繰返して居たのが、彼等の零落と共に、其內容も亦次第に荒唐無稽に堕したのでは無いかとも思つて居る。

    兎に角に此場合ばかりは、山中の御產は安產であり、又特に男の子が生れたと傳へて居るのである。

    さうして其婆の子孫に狼の驗しがあつたといふことも、古い話の名殘としてならば存在し得るのである。

    丹後の由良の長者を山莊(產所)太夫と呼んだやうに、話の主人公と話し手とはよく混同せられる。

    卽ち極端なる汚名を後に留めた佐喜濱の狼婆なども、實は狼の話をする只の婆であり、又一種の權齋遊士であつたかも知れぬのである。

    狼が子を咥へて來たといふ話は、狼に拾はれて其乳で育つたといふ話と共に、どうしても今一つ以前の形が、無くてはならぬやうな奇瑞である。

    人間が鳥獸の腹から產れる筈も無く、又一旦動物の形を以て世に出たものが、中途から並の人に變れるもので無いといふ考へが起つて、日本でも早期に此口碑は改定を受けて居るらしいのである。

    昔話は誰だつて信じて聽いた者が無いから、それが分立して流布するまで殘つて居たならば、田螺息子や蛇太郞の說話のやうに保存せられたかも知れぬが、我々の信仰はそれよりも前に改まつて、少なくとも中央の社會では、狼は人間の子を生まぬことになつて居たのである。

    別の語でいへば葛の葉や龍宮女房の話と手を分つて居たのである。

    鷲が人間に子供を供給した話は外國にもあるといふことで、ボルテ·マッケンゼンの昔話辭彙にも例を竝べて居るが、我邦では又別種獨立の發展を遂げて居る。

    たとへば南都東大寺の良辨杉は一本しか無いのに、鷲に抓まれて來た赤兒の產地は、山城の多賀に江州の志賀、又は相州などと數處に有る。

    その又相州といふものも新編風土記には阿布利山の傳說を採用し、今日は是が一番によく知られて居るが、新編鎌倉志や鎌倉舊蹟地誌では、由井長者の染屋太郞太夫時忠の子であつたと謂ひ、其出來事'
  translation: '――て飲むと流れるといっていた。今ではその風習も絶えただろうし、ほかの内陸地方ではまだ類例を探し当てていないが、これはもう少し根気よく、また多少回り道になる方法も用いながら、徐々に迫るべき問題だと思っている。

    だから現在のところでは、まだ非常に心もとない仮説ではあるが、私は逆に、土佐の東の境のような場所に伝説が存在することから、鍛冶屋の母というものが、今日の産婆の前身、つまり半ば信仰の力を借りて、女性の産褥期の苦しみや心配を軽くする役目を持っていたのではないかと考えている。そして、その祭式に伴う語り物の中で、山の神が丈夫で、しかも幸運な赤ん坊を授けたという古い伝承を繰り返していたものが、彼らの没落とともに、内容もしだいに荒唐無稽なものへ落ちていったのではないか、とも思っている。ともかく、この場合だけは、山中の出産は安産であり、また特に男の子が生まれたと伝えられている。そして、その婆の子孫に狼のしるしがあったということも、古い話の名残なら存在しうる。丹後の由良の長者を山荘、すなわち産所太夫と呼んだように、話の主人公と語り手とはよく混同される。つまり、ひどい汚名を後世に残した佐喜浜の狼婆なども、実際は狼の話をするただの婆であり、また一種の権斎遊士だったのかもしれない。

    狼が子をくわえて来たという話は、狼に拾われ、その乳で育ったという話とともに、どうしてもさらに一つ前の形がなければならないと思わせる、不思議なめでたい出来事である。人間が鳥や獣の腹から生まれるはずはなく、また、いったん動物の姿でこの世に現れたものが、途中から普通の人に変われるものではない、という考えが起こって、日本でも早くからこの言い伝えは改められていたらしい。昔話は、誰も事実だと信じて聞いてはいなかったから、それが独立して広まる時代まで元の形が残っていたなら、「田螺息子」や「蛇太郎」の説話のように保存されたかもしれない。しかし私たちの信仰は、それより前に変わり、少なくとも中央の社会では、狼は人間の子を産まないことになっていた。別の言い方をすれば、葛の葉や龍宮女房の話とは道を分けていたのである。鷲が人間に子どもをもたらした話は外国にもあるそうで、ボルテ・マッケンゼンの昔話辞彙にも例が並べられているが、日本ではまた独立した別種の発展を遂げている。たとえば、南都東大寺の良弁杉は一本しかないのに、鷲につかまれて来た赤ん坊の出身地は、山城の多賀、近江の志賀、あるいは相模など、数か所ある。その相模というのも、『新編風土記』は阿夫利山の伝説を採用し、今日ではこれが最もよく知られているが、『新編鎌倉志』や『鎌倉旧蹟地誌』では、由井長者の染屋太郎太夫時忠の子だったといい、その出来事――'
  notes:
  - 冒頭は229、末尾は231に続く。
  - 原文の『產婆』は当時の職名として保持。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第30頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

  section: 狼と鍛冶屋の姥／八 荒血山の物語・九 良辨僧正の杉
  original: 'の代りに夜啼石がある。

    今でも夜深けに通ると赤子の啼聲を聞くと謂つたのは、是も亦元からの子安神の靈地であつた爲かも知らぬが、是は野根山のやうに所謂ハツピーエンドを持たなかつた。

    何にもせよ此說話は久しく週遊して居たのである。

    それが一地に土著して第二次の傳說と爲つたことは、ちやうど花粉が蝶鳥の翼に乘つて、次の叢に來てやすらふのと同じであつたらう。

    乃ち其果實はこゝに結んだのだから、此地の產と謂つても固より不可は無い。


    九良辨僧正の杉

    樹木の傳說は夜啼石などに比べると、遙かに其歷史が辿り易いかと思ふ。

    石だと神代の頃から此通りと言はれても致し方が無いが、產の杉ならば根株からでも年輪は算へられる。

    何ほど畸形の樹でも、それがまだ森の陰の若木であつた時代には、まさか其上で產をしたといふ傳說は伴なはなかつたらう。

    さうすると起りは先づ新らしいので、從うて其一つ以前は何も無かつたか、若しくは何が有つたかといふことが、當然の問題になつて來るのである。

    私は古來有名なる昔話が、二種以上も爰に落合つて念入りに結び付いて居るのを見て、是には何かそれだけの因緣が、特に此地には備はつて居たものと想像する。

    此際新たに起つたので無からうと思ふのは、佐喜濱の鍛冶屋の遺跡と、山中の安產の信仰とである。

    此信仰がもし狼を伴なひ、又或一人の姥を參與せしめて居たのであつたら、地味は斯ういふ傳說の根付いて成育する爲に、十分に肥沃であつたと言ひ得るのである。

    鍛冶は元來木炭を利用する關係から、最も山奥の生活に親しんで居た。

    さうして彼等獨自の信仰があつて、曾ては其職業の便宜の爲に、計畫的にも之を常民の間に宣傳したと見えて、幽かながら其痕跡は今に遺つて居る。

    それが如何樣なる信仰であつたかといふことは、以前「炭燒小五郞」の研究に於て、之を證明して見ようとしたことがある。

    鐵の呪力はたしかに其一つの支援であつた。

    婦女が齒黑めを始めてする際には、先づ金屋神の神威を認めなければならなかつたから、是が生殖育兒の上に、交涉を持つて居たことも推測し得られる。

    屋久島の鍛冶屋が村一般から尊重せられて居ることは、たしか古い人類學會雜誌にも出て居た。

    若い女が魔物の種を孕んだと迷信して不安を感ずる場合には、この鍛冶屋に賴んで鐵滓を貰ひ受け、それを柳の葉と共に煎じ'
  translation: '――の代わりに夜啼石があるということだ。今でも夜更けに通ると赤ん坊の泣き声が聞こえるといったのは、ここもまた、もともと子安神の霊地だったからかもしれないが、この話には野根山のような、いわゆるハッピーエンドはなかった。ともかく、この説話は長い間各地を巡っていたのである。それがある土地に定着して二次的な伝説となったのは、ちょうど花粉が蝶や鳥の翼に乗り、次の草むらへ来て落ち着くのと同じだったのだろう。つまり、その実はここで結んだのだから、この土地の産物といっても、もちろん差し支えない。

    九　良弁僧正の杉

    樹木の伝説は、夜啼石などに比べると、はるかに歴史をたどりやすいと思う。石なら、神代のころからこのとおりだったといわれても仕方がないが、産の杉なら切り株からでも年輪を数えられる。どれほど奇妙な形の木でも、それがまだ森の陰の若木だった時代には、まさかその上で出産したという伝説はついていなかっただろう。そうすると、成立はまず比較的新しいことになり、その一段前には何もなかったのか、それとも何があったのか、ということが当然問題になる。私は、古くから有名な昔話が二種類以上もここで落ち合い、念入りに結びついているのを見て、この土地にはそれだけの何らかの因縁が、特に備わっていたのだろうと想像する。このとき新しく生じたものではないだろうと思うのは、佐喜浜の鍛冶屋の遺跡と、山中での安産の信仰である。もしその信仰に狼が伴い、また一人の姥が関与していたとすれば、このような伝説が根づいて育つのに、土壌は十分に肥沃だったといえる。鍛冶屋はもともと木炭を使う関係から、最も山奥の生活に親しんでいた。そして彼ら独自の信仰があり、かつては仕事の便宜のために、計画的に一般の人々の間へも広めたらしく、かすかながら今もその痕跡が残っている。それがどのような信仰だったかは、以前『炭焼小五郎』の研究で証明してみようとしたことがある。鉄の呪力は、確かにその支えの一つだった。女性がお歯黒を初めてつけるときには、まず金屋神の神威を認めなければならなかったから、それが生殖や育児にかかわりを持っていたことも推測できる。屋久島の鍛冶屋が村全体から尊重されていることは、確か古い『人類学会雑誌』にも出ていた。若い女性が、魔物の子を身ごもったと迷信して不安を覚えると、この鍛冶屋に頼んで鉄滓、つまり鉄を加工した際に出るかすをもらい、それを柳の葉とともに煎じ――'
  notes:
  - 冒頭は228、末尾は230へ続く。
  - 鉄滓などを服用する記述は歴史的信仰の紹介であり、現代の医療上の助言ではない。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第29頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

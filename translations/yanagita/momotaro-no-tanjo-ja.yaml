  original: 此地もと岡部の御厨の域內であつて、乃ち神明の社なるべしといふ學說あるにも拘らず、俗には狼明神と稱し、狼を神に祭るとも傳へて居た。是にも街道筋の表向きの話と、在所での話と少なくとも二通り以上あつたが、岡部の宿の若宮八幡の社傳かと思はれるのは、昔中納言兼輔卿罪を被つて此國に流寓し、朝比奈川の邊、松山の麓に年を送る。一子無きことを憂ひて八幡宮に祈願を籠め、通夜滿願の歸るさに小阪を過ぐるとき、狼あつて錦の衣を纏へる赤兒を咥へ來り、此卿の前に置いて去る。是を抱き上ぐるに肩に狼の齒の痕がある。奇として之を館の內に養育したまひ、後歸京の際に其兒を朝比奈の鄕に殘し止めらる。成長して吉泰と名のり、武勇俊傑の人也。彼狼を祭つて內宮權現と崇め奉り、或は狼明神と號すとある。此條は阿部正信の駿國雜志から轉載したものであるが、同じ書には又今一つ別の話を錄して居る。朝比奈氏の本貫は此郡の朝比奈村で、殿といふ大字が其故居だといふことになつて居るが、そこに代々朝比奈三郞左衞門といふ舊家があつて、自ら朝比奈三郞義秀の後胤と稱して居た。しかも是にも同種の家傅があつたと見えて、家督の男子には必ず背に犬の齒痕が三つあつたといふことは、豐後の緒形氏などとも相類する風說であつた。家が分れれば言ひ傳へも亦少しづつ違つて行くのは當然で、其何れが正しく何れが誤つて居るかは、今日ではもう問題で無い。我々は單に一門の各家に共通して、永く狼を尊崇する習慣のあつたことを認むれば卽ち足るのである。右の假宿村の狼明神に奉仕した遊行派の萬福寺は、後に大名になつた朝比奈家の菩提所でもあつた。中納言兼輔卿の拾ひ兒といふことは信じ難くとも、此家が狼の德を感じて之を祀つたことだけは想像し得られ、從うて「狼」は「岡部」の轉訛だらうといふ新風土記の說は、こぢつけだといふことになると思ふ。此點は今日各地に分散して居る朝比奈といふ舊家の、傳承を尋ねて見たら尙確かになるであらうが、出羽の莊內藩でも朝比奈忠三郞といふ大力の武士があつた。其家の先祖、或時狼が喉に骨を立てて困つて居るのを見て、勇敢に口の中へ手を差入れて拔いて遣つたところが、後に其御禮に赤兒を蘆の葉に包んで持つて來た。それから子孫繁昌したと言つて、家には狼の祠が祭つてあつたことが、鶴ヶ岡の舊事を錄した柳塘緝譚といふ書にも見えて居る。秦の大津父の出世譚以來、狼が人の恩に報いた話は算へ切れぬほどあるが、中でも多いの
  translation: 'この土地はもと岡部の御厨の中にあり、したがって神明の社だろうという学説があるにもかかわらず、一般には「狼明神」と呼び、狼を神として祭っているとも伝えていた。ここにも街道沿いで表向きに語られる話と、地元での話が、少なくとも二通り以上あった。岡部宿の若宮八幡の社伝かと思われるものは、次のような話である。

    昔、中納言兼輔卿が罪を受けてこの国に流寓し、朝比奈川のほとり、松山のふもとで年月を送っていた。一人の子もないことを憂え、八幡宮に祈願をこめた。夜を徹して祈り、満願となった帰り、小さな坂を通ったとき、狼が錦の衣をまとった赤ん坊をくわえて来て、卿の前に置いて去った。抱き上げると、肩に狼の歯の跡があった。不思議に思って館の中で養育したが、後に都へ帰る際、その子を朝比奈の郷に残した。成長した子は吉泰と名乗り、武勇に優れた人物となった。その狼を祭り、内宮権現とあがめ、あるいは狼明神と呼んだ。

    この条は阿部正信の『駿国雑志』から転載したものだが、同じ本にはもう一つ別の話も記されている。朝比奈氏の本拠はこの郡の朝比奈村で、「殿」という大字が旧居とされている。そこには代々、朝比奈三郎左衛門という旧家があり、自ら朝比奈三郎義秀の子孫と称していた。しかもこの家にも同種の伝承があったらしく、家を継ぐ男子には必ず背中に犬の歯形が三つあったというのは、豊後の緒形氏などとも似たうわさだった。家が分かれれば言い伝えも少しずつ違っていくのは当然で、どちらが正しく、どちらが誤りかは、今ではもう問題ではない。私たちはただ、一族の各家に共通して、長く狼を尊び祭る習慣があったと認めれば、それでよいのである。先の仮宿村の狼明神に仕えた遊行派の万福寺は、後に大名となった朝比奈家の菩提寺でもあった。中納言兼輔卿の拾い子という話は信じがたくても、この家が狼の恩徳を感じて祭ったことだけは想像できる。したがって「狼」は「岡部」のなまりだろうという『新風土記』の説は、こじつけだということになると思う。この点は、今、各地に分かれている朝比奈という旧家の伝承を尋ねれば、さらに確かになるだろう。出羽の庄内藩にも、朝比奈忠三郎という力の強い武士がいた。その家の先祖が、あるとき喉に骨を立てて困っている狼を見て、勇敢に口の中へ手を入れ、抜いてやった。すると後に、狼はお礼として、赤ん坊を葦の葉に包んで持ってきた。それ以来子孫が栄えたといい、家には狼の祠が祭ってあったと、鶴ヶ岡の昔の出来事を記した『柳塘緝譚』という本にもある。

    秦の大津父の出世物語以来、狼が人の恩に報いた話は数え切れないほどあるが、中でも多いの'
  notes:
  - 「御厨」は神社に供え物を納める領地。「神明」はここでは伊勢神宮系の神を指す。
  - 引用書名のOCR「駿國離志」は原画像の「駿國雜志」に修正。

  section: 海神少童
  original: 'て來た。是だから昔話の採集は、今後も尙大いに努めなければならないのである。

    それから此序に今一つ言つて置きたいことは、私が最初に聽いた方の江刺郡の昔話で、柴

    を投込んだのは淵の渦卷で無く、山中の穴といふことになつて居るので、何だか水の神との

    緣は乏しい樣にも見えるが、是も決して別口では無かつたといふことである。人のよくいふ

    椀貸し傳說を始とし、岩屋に水の神の信仰の移つて居る例は他にもある。谷の奥などの岩穴

    にも水の流れ出すものがあれば、人は其底が龍宮に通ふと言ひ傳へて居ることがあつた。さ

    うして土地の表に顯はれた流よりも、却つて此の如き地下泉の露頭を、神祕なものの樣に想

    像し、之を水の神の神座と繋がるかの如く、考へる傾向があつたらしいのである。此點は淵

    の渦卷のよく物を吸ひ込む所から、之を水底に入つて行く門口の如く看做したのと、或は根

    元に於て一つであつたらうかと思ふのである。

    六しこ名と醜い容

    次には水から出て來た少童の、普通で無い名を以て呼ばれて居たこと、此點も水の神の昔

    話の特に大切な部分であつたやうに思ふが、是が亦互ひによく似通うて居るのである。肥後

    のハナタレ小僧樣などは、單に「小さな誠に小さな子供」であつたといふが、それにしても其

    名前が非常に粗末であつた。紫波郡昔話では、柴苅りの爺が水中の屋形へ遊びに行つて貰つ

    て來たのは、一人の見にくいカブキレワラシ、卽ちおかつぱの男の子であつた。爺は案内の

    美女に路で教へてもらつて、何だか知らずにヨケナイといふものを下さいと言ふと、其ヨケ

    ナイが此子供のことであつた。迷惑には思つたが今更致し方が無いので、連れて戾つて來て

    可愛がつて居たといふ。江刺郡の第一話に於ては、爺が欲しいとも何とも言はぬのに、一人

    の醜い小兒をくれる〳〵と言つて、無理に押付けた。それを連れて歸つて來ると、爺よ、お

    れはウントクといふ者だと其の小兒が自ら名乘つた。第二の話でも强ひて與へたといふ點は

    同じで、たゞ子供の名前はヒヨウトクと謂つたさうだと、話者が話の終りに附加へて居る。

    ヨケナイとウントクとは其意味不明であるが、何れさう結構な名で無いことは察しがつく。

    ヒヨウトクの方は終りに其童兒が死んで後に夢の告があつて、その醜い顏に似た面を、竈の

    前の柱に掛けて置くと家が繁昌すると教へたと謂ひ、現に今日でも岩手縣下の農村では、鬼'
  translation: 'てきた。だからこそ、昔話の採集には、これからも大いに力を尽くさなければならないのである。

    それから、このついでにもう一つ言っておきたい。私が最初に聞いたほうの江刺郡の昔話では、柴を投げ込んだのが淵の渦ではなく、山中の穴ということになっているため、何となく水の神との関係が薄いようにも見える。しかし、これも決して別系統の話ではなかったのである。よく言われる椀貸し伝説をはじめ、岩屋に水の神への信仰が移っている例はほかにもある。谷の奥などの岩穴でも、水の流れ出すものがあれば、その底は竜宮へ通じていると言い伝えられることがあった。そして、地表に現れる流れよりも、かえってこうした地下の泉が顔を出す場所を神秘的なものと想像し、水の神のいる場所へつながっているかのように考える傾向があったらしい。この点は、淵の渦がよく物を吸い込むことから、そこを水底へ入っていく入り口と見なしたことと、あるいは根本で同じだったのではないかと思う。

    六　卑しい名と醜い姿

    次に、水から現れた幼い子が、普通ではない名で呼ばれていたこと。この点も、水の神の昔話でとくに大切な部分だったように思うが、これもまた、互いによく似ている。肥後のハナタレ小僧様などは、ただ「小さな、本当に小さな子供」だったというが、それにしても名前は非常に粗末なものだった。『紫波郡昔話』では、柴刈りのおじいさんが水中の屋敷へ遊びに行ってもらってきたのは、一人の醜いカブキレワラシ、つまりおかっぱ頭の男の子だった。おじいさんは案内の美女に道中で教わり、何かもわからずにヨケナイというものをくださいと言うと、そのヨケナイとはこの子供のことだった。迷惑には思ったが、いまさらどうしようもないので連れて帰り、かわいがっていたという。江刺郡の第一の話では、おじいさんが欲しいとも何とも言わないのに、醜い子供を一人、やる、やると言って無理に押し付けた。それを連れて帰ると、「おじいさん、おれはウントクという者だ」と、その子供が自分から名乗った。第二の話も無理に与えた点は同じだが、子供の名前はヒヨウトクといったそうだと、語り手が話の終わりに付け加えている。ヨケナイとウントクは意味がわからないが、いずれにしても、そう立派な名前ではないと推察できる。ヒヨウトクのほうは、最後にその子供が死んだ後、夢でお告げがあり、その醜い顔に似た面を竈の前の柱に掛けておくと、家が栄えると教えたという。実際、今日でも岩手県下の農村には、鬼'
  notes:
  - 画像をまたぐ文は前後のunitと接続する。

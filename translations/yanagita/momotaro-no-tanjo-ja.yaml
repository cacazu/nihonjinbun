  section: 絵姿女房／三 エンブの果報・四 安積山の糠次郎
  original: 'つて、面白いことにはそれは「ハナタレ小僧樣」の前段と複合して居た。詳しく引用する必要

    も無いが、肝要な部分だけはやはり竝べて置いた方がよい。

    昔貧乏な男が年の暮に、讓葉と裏白とを賣りに出たがちつとも賣れない。歸りにそれを

    海の中へ投げ込むと、翌日龍宮から御使が來て、招かれて龍宮に行つて美しい御姫樣を

    嫁に貰つて來る。その嫁女があんまり美しいので、働きに出ることがもういやになつた。

    それでも働きに出ぬわけにも行かぬから、繪師に似顔を描かせて、それを竹に挿んで畑

    の脇に立てて置いて、一鍬切つては一目づつ見て樂んで居た。それが大風に吹揚げられ

    て、殿樣の御庭に落ちる迄は例の如く、それから後が丸で別で、殿樣は色々難題を言ひ

    かけて、それが出來なければ女房を差出せといふのだが、其度每に女房の智慧才覺をも

    つて、其難題を解くのでどうすることも出來ず、夫婦は仲よくいつ迄も共に暮すことが

    出來た。

    私は最初莊內黑川村の「瓜子姫」が、如何にして外國の輸入らしい繪姿女房說話と、結合す

    ることになつたのかを知らうとして居たのだが、それより前に又一つ、是と栗賣や菖蒲賣の

    話とが、やはり繼合せであることを發見したのである。さうして後にもう一度說明するが、

    日本の記錄に現れたのは、却つてこの「殿の難題」の方が古かつたのである。從うて國の南北

    の三處に分布する三つの昔話は、何れもそれよりは後の形、卽ち貧しき農夫が殿と衣裳を換

    へて著るといふ、一種の衣裳哲學觀の如きものが採用せられてから、新たにその國內の旅行

    を始めたものと想像し得られるのである。

    四安積山の糠次郞

    ところが一方には土地で昔話を獨占しようとする傾向、他處の類例を以て模倣と爲し、若

    くは冒瀆と見ようとする態度も古くからあつた故に、中々容易には其本源を突留めることが

    出來ない。昔話の傳說化に付いては、旣に白米城の例に就いて自分の意見を述べて置いたが、

    手短かに言ふと聽き手と話し手との、說話に對する考へ方が喰ひ違つて居たのである。話し

    手には學んで外國の例をさへ活用しようといふ程の文藝心があつたに反して、聽き手は何處

    までも「語りはまこと」とする古風な好意を抱いて居た故に、出來るだけ近くの地に其記念物'
  translation: 'て、面白いことに、それは「ハナタレ小僧様」の前半と組み合わさっていた。詳しく引用する必要はないが、肝心な部分だけは、やはり並べておいたほうがよい。

    昔、貧乏な男が年の暮れに、譲葉と裏白を売りに出たが、少しも売れなかった。帰りにそれを海へ投げ込むと、翌日、竜宮から使いが来た。男は招かれて竜宮へ行き、美しいお姫様を妻にもらってきた。その妻があまりに美しいので、もう働きに出るのが嫌になった。それでも働かずにはいられないので、絵師に似顔絵を描かせ、竹に挟んで畑の脇に立てておき、鍬を一度入れるたびにひと目ずつ見て楽しんでいた。

    それが大風に吹き上げられ、殿様の庭に落ちるところまでは、いつものとおりである。しかし、その後は全く違い、殿様はいろいろな難題を言いつけ、それができなければ妻を差し出せと言う。けれども、そのたびに妻の知恵と工夫で難題を解いてしまうので、どうすることもできず、夫婦は仲よく、いつまでも一緒に暮らすことができた。

    私は初め、庄内の黒川村の「瓜子姫」が、どうして外国から入ってきたらしい絵姿女房の説話と結び付くことになったのかを知ろうとしていた。しかし、その前にもう一つ、この話と栗売りや菖蒲売りの話との間にも、つなぎ合わせがあったことを発見したのである。後でもう一度説明するが、日本の記録に現れたのは、むしろこの「殿の難題」のほうが古かった。したがって、国内の南北三か所に分布する三つの昔話は、いずれもそれより後の形と考えられる。つまり、貧しい農夫が殿様と衣装を取り替えて着るという、一種の「衣装哲学」とでもいうべき考え方が採り入れられてから、新たに国内を旅し始めたものだと想像できるのである。

    四　安積山の糠次郎

    ところが一方には、自分たちの土地で昔話を独占しようとする傾向、ほかの土地の似た話を、まね、あるいは冒瀆と見なす態度も、古くからあった。そのため、話の本当の源を突き止めることは、なかなか容易ではない。昔話が伝説になっていくことについては、すでに白米城の例をもとに私の意見を述べておいた。手短に言えば、聞き手と語り手とでは、説話に対する考え方が食い違っていたのである。

    語り手には、学んで外国の例まで活用しようとするほどの文学的な意欲があった。それに対して聞き手は、どこまでも「語られることは真実だ」とする、昔ながらの好意的な受け止め方をしていた。そのため、できるだけ近い土地にその記念物'

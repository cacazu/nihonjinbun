  original: 'るだけと、賺して戶を開けさせて家の中へ入つてしまふ。さうして瓜姫を誘うて裏の畠へ梨

    を取りにつれ出す。始は瓜姫は拾ひ役で下に待つて居ると、上から喰ひかけや、唾や小便を

    かけた梨を投げ下す。次に役を代つて瓜姫が梨の木に登ると、襟を木にゆはへて下りて來ら

    れぬ樣にして置いて、自分が姫に化けて機屋で機を織つて居る。それを知らずに化けた瓜姫

    を馬に乘せて、爺婆が嫁入させようとして居ると、木の上の姫は泣きながら

    瓜姫の乘る馬に

    アマノジヤクが打乘つた

    と言ふ。これを聽いて早速馬から叩き落して、殺して萱原へ棄てた。それ故に今でも萱の根

    はアマノジヤクの血に染まつて赤い。

    (下水內郡の話では爺婆が歸つて來て、見つけたと云ふことになつて居るが、梨の木登りと

    萱原に棄てたといふ點とは、二つながら是と一致して居る。しかしそれだから之を信州型だ

    などとは、まだ容易に速斷することを許されない。嬉遊笑覽卷九は私などの知る限に於て最

    も古い瓜姫咄の記錄であるが、是には信濃の人の語るを聽いたとあつて、次のやうな形の

    ものを記して居る。

    姫生ひ立ちて機織ることをよくして、常に一間の外に出でず。或時庭の木に鳥の聲して、

    瓜姫の織りたる機のこしに、アマノジヤクが乘りたりけりと聞えければ、夫婦恠しと思ひ

    て一間の內に入つて見るに、アマノジヤクの瓜姫を繩にて縛りたり。夫婦驚きて之を助

    け、アマノジヤクを縛り、此女薄の葉にてひかんとて、薄の葉にて挽きて切殺しぬ。す

    すきの葉のもとに赤く色つきたるは、其血の痕なりといふ物語、田舍には今も語れり。

    此書の著者が色々の事を聞いた信濃の人は、上田附近の者であつたやうに他の條には見え

    て居る。さうすると嫁入の話はもう脫落して、輿を機のこしの樣に解して居た例が、同じ土

    地にも旣にあつたのである。松本市の周圍でも今から三十年前迄は、瓜姫が機を織つて居て

    アマノジヤクに誘拐される話の方が、桃太郞よりは勢力があつたと胡桃澤氏などは言つて居

    る。話す人が多かつただけに、變化は恐らくは部落每に、又は家庭每にもあつたものと思は

    れる。今まで集まつた資料によつて、强ひて一つの傾向を求め出すならば、奧州の瓜子姫は

    大抵は食はれてしまつて居るに反して、信州以西の瓜姫は皆助かつて居る。是などは同時併'
  translation: 'るだけ」と言葉巧みに戸を開けさせ、家の中へ入ってしまう。そして瓜姫を誘い、裏の畑へ梨を取りに連れ出す。最初は瓜姫が拾う役になって下で待っていると、上から食いかけの梨や、唾や小便をかけた梨を投げ落とす。次に役を交代し、瓜姫が梨の木に登ると、襟を木に結びつけて下りられなくしておき、自分が姫に化けて機屋で機を織っていた。それを知らず、爺婆が偽の瓜姫を馬に乗せて嫁入りさせようとすると、木の上の姫が泣きながら、

    「瓜姫が乗る馬に、

    アマノジャクが乗った」

    と言う。これを聞き、さっそく馬から叩き落として殺し、萱原へ捨てた。そのため、今でも萱の根はアマノジャクの血に染まって赤い。

    （下水内郡の話では、爺婆が帰ってきて見つけたことになっているが、梨の木に登る点と、萱原へ捨てたという点は、どちらもこの話と一致する。しかし、だからといって、これを「信州型」などと簡単に決めつけることはまだできない。『嬉遊笑覧』巻九は、私たちの知るかぎり、最も古い瓜姫の話の記録だが、信濃の人が語るのを聞いたとして、次のような話を記している。

    「姫は成長すると機織りが得意になり、いつも一つの部屋から出ずにいた。あるとき庭の木から鳥の声がして、『瓜姫の織っていた機のこしに、アマノジャクが乗った』と聞こえた。夫婦が怪しく思って部屋へ入ってみると、アマノジャクが瓜姫を縄で縛っていた。夫婦は驚いて姫を助け、アマノジャクを縛った。娘が、薄の葉で挽き切ってやろうと言い、薄の葉で挽いて切り殺した。薄の葉の根元が赤く色づいているのは、その血の痕だという物語は、田舎では今も語られている。」

    この本の著者がさまざまなことを聞いた信濃の人は、別の箇所を見ると、上田付近の人だったらしい。そうすると、嫁入りの話がすでに抜け落ち、「輿」を機の「こし」のように解釈していた例が、同じ土地にもすでにあったのである。松本市の周辺でも、今から三十年前までは、瓜姫が機を織っていてアマノジャクにさらわれる話の方が、桃太郎より広く行われていた、と胡桃沢氏などは言っている。語る人が多かっただけに、おそらく集落ごと、あるいは家庭ごとに違いがあったのだろう。これまで集まった資料から、あえて一つの傾向を引き出すなら、奥州の瓜子姫はたいてい食べられてしまうのに対し、信州以西の瓜姫はみな助かっている。こうした点は、同時に並び'
  notes:
  - 冒頭はscan98、末尾はscan100へ続く。
  - 引用中の「機のこし」は、乗り物の「輿」と機織りに関する「こし」との取り違えとして著者が論じる語なので、そのまま残した。
  - 「今から三十年前」は著者の執筆当時から数えた年数。

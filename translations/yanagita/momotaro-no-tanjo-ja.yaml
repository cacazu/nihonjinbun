- id: mmt-054-01
  scan: 54
  section: 海神少童
  original: 'れて來たのは、是非も無い社會の成行きであつた。開けて見るなといふ玉手箱を開けて見ただけで、浦島太郞は白髪になつてしまふ。覗いてはならぬ產屋の戶を覗いて、海の姫神は還つて行かれる。初期の人類は他の何れの民族でも、常に人生の不如意の原因を、或一つの隱れたる法則を守り得なかつた罰の如く解して、改めて神に向つて其法則のどんなものであつたかを問はうとして居たのである。其答がかの失樂園の物語でもあれば、又この海老膾の一挿話でもあつた。說話は決してたゞ我々の笑を催すが爲に、最初から存在したものでは無かつたのである。

    九善玉惡玉

    右の問題は、更に進んで柴苅の翁の失脚談を、他の諸國の例と比べて見るとよくわかる。熊本縣の話は同じ一人の老爺の心變り、卽ち後に海老の膾を求めに行くのが面倒になつて、海の少童神を追出したことになつて居る。丹波の比沼山の天眞名井の少女の話も是と同じであつたが、說話の單純さを保つ爲、又は原因と結果とを力强く繫いで見せる爲には、その善い行ひと惡い行ひを、それ〴〵別の人に分擔させた方が都合がよかつた。それ故に舌切雀に於ては爺と婆、花咲爺ではもう一人、同じ年輩の鄰の爺をつれて來て、甲には甲の賞、乙には乙の罰があつたやうに話すのが、相應に古くからの說話法であつたらしい。奧州紫波郡のヨケナイ話は、此點では最もハナタレ小僧と近い。爺は正直者の條件通り、每日一度づつ奥座敷に入つて、その見にくい童子の無事な顏をながめ、頭を撫でてやつてにかつと笑つて出て來る。それを老婆が不審に思うて、留守中に入つて見るとをかしな子供が居る。箒でうんと叩いて追出すと、ヨケナイは泣きながら山の方へ行つてしまふ。それから忽ち米櫃の米は減りはじめ、財布の錢も無くなつて來たので、始めて此童子の福の神であつたことに氣がつくのである。

    次には江刺郡のウントクの話でも、是と同樣に婆が變に氣をまはして、そつと奥の間を見ると、何ともかとも言へない樣な子供が、物蔭からちよこ〳〵と出て來た。一目見るといやで〳〵堪らぬので、箒で引つぱたいて泣かせ〳〵追出してしまつて、其日から又貧乏になつたと云つて居る。第三のヒヨウトクの話だけは、是とは少しばかり事情がちがつて、婆が慾'
  translation: 'れるようになった。それは、避けられない社会の成り行きだった。「開けて見てはならない」という玉手箱を開けて見ただけで、浦島太郎は白髪になってしまう。のぞいてはならない産屋の戸をのぞいたために、海の女神は帰っていかれる。初期の人類は、ほかのどの民族でも、人生が思うようにいかない原因を、ある隠れた法則を守れなかった罰のように理解し、改めて神に、その法則とはどんなものだったかを尋ねようとしていた。その答えが、あの失楽園の物語でもあり、また、この海老のなますの一挿話でもあった。物語は、決してただ私たちを笑わせるために、最初から存在したのではなかったのである。

    九　善玉と悪玉

    この問題は、さらに進んで、柴刈りのおじいさんが恵みを失う話を、ほかの土地の例と比べてみると、よくわかる。熊本県の話は、同じ一人のおじいさんの心変わり、すなわち、後になって海老のなますを買いに行くのが面倒になり、海の幼い神を追い出したことになっている。丹波の比沼山の天真名井の少女の話も、これと同じだった。しかし、物語を単純に保つため、あるいは原因と結果を強く結び付けて見せるためには、よい行いと悪い行いを、それぞれ別の人物に受け持たせたほうが都合がよかった。それで、舌切り雀ではおじいさんとおばあさん、花咲か爺ではもう一人、同じ年頃の隣のおじいさんを登場させ、一方にはその人の褒美、他方にはその人の罰があったと語るのが、かなり古くからの語り方だったらしい。

    奥州紫波郡のヨケナイの話は、この点で、最もハナタレ小僧に近い。おじいさんは正直者としての条件を守り、毎日一度ずつ奥座敷へ入って、その醜い子供が無事でいる顔を眺め、頭をなでてやり、にかっと笑って出てくる。それをおばあさんが不思議に思い、留守中に入ってみると、おかしな子供がいる。ほうきで力いっぱいたたいて追い出すと、ヨケナイは泣きながら山のほうへ行ってしまう。それからたちまち米櫃の米は減り始め、財布の銭もなくなってきたので、初めて、この子供が福の神だったと気づくのである。

    次に、江刺郡のウントクの話でも、これと同じように、おばあさんが変に疑って、そっと奥の部屋をのぞくと、何とも言いようのない姿の子供が、物陰からちょこちょこと出てきた。一目見ると嫌で嫌でたまらないので、ほうきでひっぱたき、泣かせながら追い出してしまい、その日からまた貧乏になったという。第三のヒヨウトクの話だけは、少し事情が違って、おばあさんが欲'

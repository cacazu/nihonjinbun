  section: 米倉法師／四 盲をからかう話・五 餅と座頭
  original: どい酒落に落ちて行つたのも無理は無いと思ふ。右の百物語の一話なども、言はば座頭の自身に對する殘忍性であつて、下人等の巧みを知りつゝもわざと腹を立てず、たゞ頓狂なる口答へを以て、暗々裡に復讐をしたといふ點に、一種のをかしみは有るけれども、其笑たるや純粹では無かつた。「八つのかしら」の口合ひの意味がもう不可解になつて後まで、久しく斯んな話を蒸し返して居た者は論外であるが、それを合點しつゝも尙げら〳〵と笑つて聽いて居たのは、是も亦よい程の馬鹿大名等であつた。それでこの座頭の坊の御得意とする者が、大部分が今の我々のやうなエリットで無かつたことも考へて見ねばならぬ。殊に何の話でも信じようとする田舎の人に、前以て是は戯れ言だといふことを承知させる爲には、まはりくどい事は絕對に禁物と言つてよかつた。しかもどの邊が丁度よい加減かといふことを、每回測量してかゝるのも容易で無く、且つ又出來るならば滿座の者が、一度にどつと笑ふことを心がけて居た故に、どうしても話は聽衆の最も鈍感なる者の、理解を目標に取る樣な傾きがあつた。是と同じ事情は現代でもやはり笑の文學の發達を阻碍して居る。よもや自身は斯んな事を、をかしいとは思つて居るまいと思ふ作者が、賣れる本の爲には實に下らぬことを言つて笑はせて居る。當人はをかしく無いのに聽く者だけを笑はせようとすれば、當然に言語の正しい機能を殺して、面を被せ御化粧をさせなければならぬ。さうして又少しばかりは下がかつたことを說く必要さへあつたのである。歷代の盲は技藝として其術を弟子に傳へた。その盲の文藝が今もなほ大いに學ばれて居る。助からないわけである。五餅と座頭この座頭の口傳の中で、今日の人々が餘り珍重しなくなつたものが一つある。それは歌言葉を挿んで談話の效果を擧げ、同時に其內容が現世の實事で無いから、信用するに足らぬことを暗示する方法であつた。斯うした話術の起原は勿論古いが、之を踏襲して最もよぐ利用し、殊に無害なる多くの笑話を、作り出した者は盲であつたやうに思ふ。是は一つには彼等に觀察の機會が惠まれず、自身の經驗の中から話題を見付け出すことが難かつた爲に、努めて言葉のあやに由つて其弱點を補强すべく、やゝ濫用の程度にまでもこの古來の樣式を使役
  translation: '〔前のスキャンから続く〕しゃれに陥っていったのも、無理はないと思う。先ほどの『百物語』の一話なども、いわば座頭が自分自身に向ける残忍さである。召使いたちの仕掛けを知りながら、わざと腹を立てず、ただとぼけた返答によって、ひそかに復讐したという点に、一種のおかしさはあるが、その笑いは純粋ではなかった。「八つのかしら」の語呂合わせの意味がもうわからなくなってからも、長くこんな話を蒸し返した者は論外である。しかし、それを理解しながらも、なおげらげら笑って聞いていたのは、これまた相当な愚かな大名たちだった。

    だから、この座頭の坊の得意客の大部分が、今の私たちのような知識人ではなかったことも、考えてみなければならない。とくに何の話でも信じようとする田舎の人に、これは冗談だと前もってわからせるには、回りくどい言い方は絶対に禁物だったといってよい。しかも、どの程度がちょうどよいのか、毎回測ってから始めることも容易ではない。そのうえ、できれば座中の全員が一度にどっと笑うようにと心掛けていたので、どうしても話は、聴衆のうちで最も鈍感な者の理解を目標にする傾向があった。これと同じ事情は、現代でもやはり笑いの文学の発達を妨げている。まさか自身ではこんなことを面白いと思ってはいないだろうと思われる作者が、売れる本のためには、実にくだらないことを言って笑わせている。当人はおかしくないのに、聞く者だけを笑わせようとすれば、当然、言葉の正しい働きを殺し、仮面をかぶせ、化粧をさせなければならない。そして少しばかりは、下がかったことを話す必要さえあったのである。代々の目の見えない人たちは、技芸としてその方法を弟子に伝えた。その文芸が今もなお盛んに学ばれている。これでは救いようがない。

    五　餅と座頭

    この座頭の口伝の中に、今日の人々があまり重んじなくなったものが一つある。それは歌の言葉を挟んで話の効果を高め、同時に、内容が現実の出来事ではなく、信じるには足りないことを暗に示す方法だった。このような話術の起源はもちろん古いが、それを受け継いで最もよく利用し、とくに人を傷つけない数多くの笑い話を作り出した者は、目の見えない人だったように思う。これは一つには、彼らが観察の機会に恵まれず、自分の経験から話題を見つけることが難しかったため、言葉のあやによって努めてその弱点を補おうと、いくらか濫用に至るほど、この古くからの形式を使った、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン272）と本文OCRを照合。
  - 「エリット」はエリートの意。文脈から知識人と訳した。
  - 原文の歴史的差別語は文脈を保持し、通常は「目の見えない人」等と訳した。障害者の性質を一括りにする評価は著者の当時の見解であり、現代の事実認定ではない。

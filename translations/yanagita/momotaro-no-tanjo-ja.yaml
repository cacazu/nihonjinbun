  section: 瓜子織姫／諸國の瓜子姫
  original: 'て

    おりかは姫の乘る輿に

    アマンギヤクが乘つたいや

    と何度も啼いたので、さてはアマンギヤクが姫に化けて居たかと、駕籠の中から引出したら

    尻尾を出した。それを皆寄つて殺してしまつた。

    (尻尾を出したといふことは鹿角郡の一例の他に、和賀郡の話でも機を織つて居る贋の瓜子

    姫子が、後から覗いて見ると尻尾をだらりと垂らして居たと謂つて、幼ない聽き手の想像力

    をそゝつて居る。しかも膽澤郡の例(五)では、そのアマノジヤクが飛んではね釣瓶の橫木の

    上にとまつたとも謂つて居るので、定まつた形はもう無かつたのである。是が此話の山姥だ

    の狼だのに、變つて行かねばならなかつた原因では無いかと思ふ。)

    二〇富山縣下新川郡(旅と傳說三卷六號、竹內正氏)

    是は僅かに一部分が記憶せられて居る。織姫樣が機を織つて居る處へ、アマノジヤクが來て

    姫を引裂いて柿の樹に掛ける。さうして自分が姫に化けて機を織りつゝ、

    おり姫様こそ木の上に

    アマノジヤクこそ機織れ

    とんとんからい、とんからい

    と言つて居たといふだけで、其他はまだ採集せられて居らぬ。

    二一長野縣小縣郡(郡史餘篇)

    爺は山へ柴苅りに、婆は川へ洗濯に行くと、川上から瓜が二つ流れて來る。

    大きな瓜こつちへ來い

    小さな瓜そつちへ行け

    と言つて、大きな瓜を拾つて家に還り、庖丁で切らうとすると自然に其瓜が二つに割れ、中

    から可愛らしい女の兒が生れた。瓜の中から生れたから瓜姫と名を付け、大悅びで育てた。

    瓜姫がもう十六になつたので、嫁入支度を買ひに爺婆は町へ行く。誰が來ても戶を開けるな

    と言ひ付けられて、瓜姫はたつた一人、ちやんちやんころりんと機を織つて居た。そこヘア

    マノジヤクといふ毛だらけの肥えた男が來て、手のはいるだけ、頭のはいるだけ、胸のはい'
  translation: 'て、

    「おりかは姫が乗る輿に、

    アマンギャクが乗ったよ」

    と何度も鳴いた。それで、さてはアマンギャクが姫に化けていたのか、と駕籠から引き出すと、尻尾を出した。みんなで寄って、それを殺してしまった。

    （尻尾を出したという点は、鹿角郡の一例のほかに、和賀郡の話でも、機を織っている偽の瓜子姫子を後ろからのぞくと、尻尾をだらりと垂らしていた、と語り、幼い聞き手の想像力をかき立てている。しかも胆沢郡の例（五）では、そのアマノジャクが飛んで、はね釣瓶の横木の上に止まったともいう。つまり、もう決まった姿はなくなっていたのである。これが、この話の中で山姥や狼などに変わらなければならなかった原因ではないかと思う。）

    二十　富山県下新川郡（『旅と伝説』三巻六号、竹内正氏）

    これは、ごく一部分しか記憶されていない。織姫様が機を織っているところへアマノジャクが来て、姫を引き裂いて柿の木に掛ける。そして自分が姫に化け、機を織りながら、

    「おり姫様こそ木の上に、

    アマノジャクこそ機を織れ。

    とんとんからい、とんからい」

    と言っていたというだけで、それ以外の部分はまだ採集されていない。

    二十一　長野県小県郡（『郡史余篇』）

    お爺さんは山へ柴刈りに、お婆さんは川へ洗濯に行くと、川上から瓜が二つ流れてくる。

    「大きな瓜、こっちへおいで。

    小さな瓜、そっちへ行け」

    と言って、大きな瓜を拾って家に帰り、包丁で切ろうとすると、自然に瓜が二つに割れ、中からかわいい女の子が生まれた。瓜から生まれたので瓜姫と名づけ、大喜びで育てた。瓜姫がもう十六になったので、爺婆は嫁入りの支度の品を買いに町へ行く。誰が来ても戸を開けるなと言いつけられ、瓜姫はたった一人、ちゃんちゃんころりんと機を織っていた。そこへアマノジャクという毛だらけの太った男が来て、「手が入るだけ、頭が入るだけ、胸が入'
  notes:

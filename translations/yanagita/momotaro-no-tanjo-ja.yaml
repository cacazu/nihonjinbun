  original: 一四盛岡市附近(旅と傳說三ノ七、橘正一氏)爺は山さ薪を採りに、婆は川さ洗濯に行く。川上から瓜が流れて來る。瓜こ、こっちゃ寄れ瓜こ、こっちゃ寄れといふと寄つて來た。それを爺樣が山から戾つて來たら一しよに食ふべと思つて、綿にくるんで戶棚の中さ入れて置いた。爺は歸つて來て戶棚を開けて見ると、瓜の中から女の兒が生れて居た。瓜の中から生れたから瓜子姫子と名をつけて、爺と婆とで大事に育てて段々に大きくなつた。春が來た。爺と婆とは畠さ稼ぎに出かける。瓜子姫子、鬼が來ても戶あけるなよと云つて出て行つた。其留守に鬼が來て、戶あけろ戶あけろと謂つた。叱られるからいやだといふと、すこうし、爪の立つだけあけろといふので、爪の立つ程あけて遣ると、今度はもすこうし、指のはえるだけあけろと謂つて、指の入る程あけてやつたら、鬼は(家に入つて)がり〳〵と瓜子姫子を食つてしま
  translation: '十四　盛岡市付近（『旅と伝説』三巻七号、橘正一氏）

    お爺さんは山へ薪を取りに、お婆さんは川へ洗濯に行く。川上から瓜が流れてくる。

    瓜よ、こっちへおいで

    瓜よ、こっちへおいで

    と言うと、近くへ流れ寄ってきた。お爺さんが山から戻ったら一緒に食べようと思い、綿に包んで戸棚へ入れておいた。お爺さんが帰って戸棚を開けると、瓜から女の子が生まれていた。瓜から生まれたので瓜子姫子と名づけ、爺婆が大切に育てると、だんだん大きくなった。

    春が来た。爺婆は畑仕事に出かける。「瓜子姫子、鬼が来ても戸を開けるんじゃないよ」と言って出ていった。その留守に鬼が来て、「戸を開けろ、戸を開けろ」と言った。「叱られるからいやだ」と言うと、「ほんの少し、爪がかかるだけ開けろ」と言う。爪がかかるほど開けてやると、今度は「もう少し、指が入るだけ開けろ」と言い、指が入るほど開けてやると、鬼は家へ入り、がりがりと瓜子姫子を食べてしま'

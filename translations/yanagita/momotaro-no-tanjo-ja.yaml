  original: '一三秋田縣鹿角郡の例(內田武志氏)婆が川さ洗濯に行くと、きれいな箱が流れて來た。開けて見ると其中に瓜が一つ入つて居る。綿にくるんで戶棚さ大事にしまつて置き、爺が歸つてから庖丁で切つて見ると、中からめんこい女の子が出て來た。それで瓜子姫子と名を付けて育てて居た。瓜子姫子は大きくなると、機を織ることが大好きで、每日每日きちんこたんのきんぎりや

    くだこア無くてからんころんと機ばかり織つて居た。或日爺と婆はよそへ行つて、瓜子姫子が一人で留守居して居る所へ、アマノシヤグが來て機ア織るのが上手だぢやなんたて見せでけろと、無理に家の中へ入つて來た。さうしてしゃばん(爼板)と庖丁を持つて來させて、其しゃばんに瓜子姫子を載せて、庖丁で切つて食つてしまつた。それからアマノシヤグは瓜子姫子の胴がらに入つて、瓜子姫子に化けて機を織つて居た。するとそこへ鄰の人が、瓜子姫子を嫁にほしいと言つて貰ひに來た。爺と婆とは大喜びで承知して、駕籠に乘せてアマノシヤグの瓜子姫子を嫁入させる。其途中で路の傍の木の上から、'
  translation: '十三　秋田県鹿角郡の例（内田武志氏）

    お婆さんが川へ洗濯に行くと、きれいな箱が流れてきた。開けてみると、中に瓜が一つ入っていた。綿に包み、戸棚へ大切にしまっておいた。お爺さんが帰ってから包丁で切ってみると、中からかわいい女の子が出てきた。それで、瓜子姫子と名づけて育てた。

    瓜子姫子は大きくなると、機を織ることが大好きで、毎日毎日、

    きちんこたんのきんぎりや

    管がなくて、からんころん

    と、機ばかり織っていた。ある日、爺婆がよそへ出かけ、瓜子姫子が一人で留守番をしているところへ、アマノシャグが来て、

    機を織るのが上手だね

    どうか見せておくれ

    と言い、無理に家へ入ってきた。そして、しゃばん（まな板）と包丁を持ってこさせ、瓜子姫子をそのまな板に乗せ、包丁で切って食べてしまった。

    それからアマノシャグは瓜子姫子の体の殻へ入り、その姿に化けて機を織っていた。すると、隣の人が、瓜子姫子を嫁に欲しいと申し込みに来た。爺婆は大喜びで承知し、瓜子姫子に化けたアマノシャグを駕籠に乗せて嫁入りさせた。その途中、道端の木の上から、'
  notes:

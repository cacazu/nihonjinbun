  section: 桃太郎の誕生／三 童話の起り
  original: て居た。讀書階級は殆と別種族の觀があり、新たなる普通教育は單に其生活を、成るべく多數の者に模倣せしめようとしたに過ぎなかつた。事實大部分の俗衆は殘されたる者として生活して居た。文藝に對する態度も明かに二樣あつた。たとへば演劇の歷史として今傳はつて居るものは、僅かばかりの所謂見巧者の記錄であつて、此以外に別に舞臺に躍り上つて、赤面の役者を斬らうとした田舎武士の逸話さへあつた。町にも亦最初から泣くつもりで、鼻紙を多量に用意して行く芝居見物人が居た。井澤蟠龍軒の廣益俗說辯などは、中古以來の語り物や說話を多く揭げて、悉く是れ小說なり信ずべからずと辯じて居る。卽ちさう訓戒しないと信ずる人が多かつたのである。或は是が足利時代からの、諸道の職人と百姓との別れ目であつたのかも知れぬが、兎に角我々の一つ前迄の社會には、何でも茶にしたり趣味にしたがる人々と、たゞ生眞面目にしか物の見えぬ人々とが、相對立して生を營んで居たので、今日は唯其一方からの觀察だけが、文獻として傳はつて居るので、農民藝術は全く別の足取りを以て進んで居た。此二種のものの融合が、珍らしい世相の混亂を生じたことは、ちやうど冷溫二つの潮流の行き逢ふ海に、ガスが立つのも同じわけであつた。其中でもたゞ名前ばかりでは見當の付かぬものに、此頃よく使用せられて居る「童話」といふ語がある。日本では口承文藝の童話化といふことは、どう考へて見ても古いことでは無い。少なくとも子供の爲の話又は子供に向く文藝、そんなものは元は村には無かつたと思ふ。子供の遊びは本來が自治であつた。彼等自身の能力にかなふ發明と保存、それよりも盛んであつたのは模倣である。前代の大衆教育は一般に、ちやうど今日とは正反對の傍觀傍聽主義であつた。成人の言ふことする事の中から、各自の年齡に應じて學び得るものだけを汲んで居た。だから又今よりも早く一人前になり得たのである。併し幾ら昔だつても子供は話をせがんだであらう。だゝを揑ねれば爺婆はすかさうとしたであらう。彼等ばかりとの會話は平易であつたらうといふ人が有ると思ふが、それは其通りとした所で、其爲に話は作ることが出來ない。何となれば話は話す人の持つて居るものだけ、曾て自分も聽いたことのあるものより他には、話すことが出來ないのが普通人の技能であつたからである。童話の根原は要するに選擇より以上の何物でも無かつた。澤山ある昔話の中から、比較的子供に似合はしいものを先づ話すといふのが精々で、それも效果の利不利よりは、寧ろ理解の容易なものを
  translation: '……ていた。読書をする階層は、ほとんど別の民族のように見え、新しい普通教育も、ただその生活をできるだけ多くの人にまねさせようとしたにすぎなかった。実際、大部分の一般の人々は、取り残された者として暮らしていた。文芸に対する態度も、明らかに二通りあった。たとえば、演劇の歴史として今伝わっているのは、わずかな、いわゆる芝居通の記録である。それとは別に、舞台に飛び上がって、赤い顔をした役者を斬ろうとした田舎武士の逸話さえあった。町にも、初めから泣くつもりで鼻紙をたくさん用意していく芝居見物人がいた。井沢蟠龍軒の『広益俗説弁』などは、中古以来の語り物や説話を多く挙げ、そのすべてについて、これは作り話であって信じてはいけないと論じている。つまり、そう戒めなければ信じる人が多かったのである。あるいはこれが、足利時代以来の、さまざまな専門職の人と百姓との分かれ目だったのかもしれない。ともかく、私たちの一つ前の社会には、何でも茶化したり趣味にしたがる人々と、ただ生真面目にしか物事を見られない人々とが、向かい合って生活していた。今日では、その片方からの観察だけが文献として伝わっているのであって、農民の芸術はまったく別の歩み方で進んでいた。この二種類のものが混じり合って、珍しい社会の混乱を生んだことは、ちょうど冷たい潮と温かい潮が出会う海に霧が立つのと、同じ理屈だった。

    その中でも、名前だけでは実態がわからないものに、近ごろよく使われている「童話」という言葉がある。日本で口承文芸が童話になったのは、どう考えても古いことではない。少なくとも、子どものための話や子どもに向く文芸は、もともと村にはなかったと思う。子どもの遊びは本来、子ども自身が運営するものだった。自分たちの能力に合うものを考え出し、受け継いでいたが、それ以上に盛んだったのは模倣である。昔の大衆教育は全般に、今日とはまったく反対の、そばで見聞きする方式だった。大人のいうことやすることから、それぞれの年齢に応じて学べるものだけを吸収していた。だから、今よりも早く一人前になれたのである。しかし、いくら昔でも子どもは話をせがんだだろう、駄々をこねれば祖父母はなだめようとしただろう、子どもだけを相手にするときは、会話もわかりやすかっただろう、という人がいると思う。それがそのとおりだとしても、そのために話を作ることはできない。なぜなら普通の人の技能では、語れるのは自分の持っている話だけ、かつて自分も聞いたことのある話だけだったからである。童話の起源は、要するに選び取ること以上の何ものでもなかった。たくさんある昔話の中から、比較的子どもにふさわしいものをまず話すのが精いっぱいで、それも子どもへの影響のよしあしより、むしろ理解しやすいものを……'

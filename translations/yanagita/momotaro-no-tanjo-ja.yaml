- id: mmt-122-01
  scan: 122
  section: 田螺の長者／三 小泉小太郎と泉小次郎
  original: '近頃聞き知つた實例の一つは、佐賀縣藤津郡の五町田といふ村に、旣に傳說の形になつて保

    存せられて居るものである。

    昔此村の喜左衞門谷といふ地には、喜左衞門といふ貧しい百姓が住んで居た。夫婦の中

    に子無きを悲しんで、籾岳の大神に願を掛けたところ、二十一日目の滿願の日に御告げ

    があつて、おまへたちにはどうしても子は出來ない。今日の歸り路に最初に足にさは

    つたものを、拾ひ上げて子にするがよいとのことであつた。それで喜んで歸つて來る途

    中、第一番に小さな蛇が足にさはつた。驚きながらも神の教へだから、連れて戾つて大

    切に愛育して居ると、人間の物を食ふ爲に急に大きくなつて、四五年の後には一丈四五

    尺にもなつた。さうして親の後から何處へでも附いて行くので、村人も怖ろしがつて喜

    左衞門とはつき合はなくなつた。折角我子として今迄は育てたけれども、あの通り村で

    こはがるから、何處へでも身を隱してくれと夫婦がいふと、大蛇はよく聽き分けて、別

    を惜みつゝ出て行つた。それから又十何年も經つて、二人は年を取り働く力が無く、い

    よいよ貧しくなつて困つて居ると、ちやうど其頃鹽田川の水を引いた井手が破損して、

    何度修繕しても又崩れ、附近の村里は水が不足で田植をすることが出來ない。村々の庄

    屋が心痛して、易者に賴んで占なはせたところが、是は以前人に養はれて居た大蛇の仕

    業である。大蛇は養育の恩を返す爲に村々の人に、少しづつの物を出し合せて親を養は

    せようと、望んで居るのだと占なつてくれた。蛇を子にして居たのは喜左衞門の家より

    他には無いので、一同相談をして每年村々から井手米を集めて、此老人の家に遣ること

    にすると、其後は井手も崩れず豐作が續き、喜左衞門の家も富裕になつた。今ある井手

    の神樣は其大蛇を祀つたもので、今でも每年秋の彼岸の中日には、村々から鉦浮立をし

    て參拜することになつて居る(藤井利作君報)。

    傳說は通例昔話の最も主要なる部分だけを保存するものだから、之に由つて元の形を推す

    ことは出來ないが、それでも高山の神に子を禱り、其子は水を統御するの力を具へて居ると

    信ずるのが、此話の骨子であつたことだけは想像せられる。曾て石見國の田植唄に付いても

    考へて見たことであるが(民族二卷八七六頁其他)、我々の田の神は太陽を父とし、龍女を母と

    して靈山の頂に生れるといふ風に、語り傳へられた例が民間には多い。卽ち主たる穀物の栽'
  translation: '近ごろ聞いて知った実例の一つは、佐賀県藤津郡の五町田という村に、すでに伝説の形で残っているものである。


    昔、この村の喜左衛門谷という土地には、喜左衛門という貧しい百姓が住んでいた。夫婦の間に子どもがいないのを悲しみ、籾岳の大神に願を掛けたところ、二十一日目、満願の日にお告げがあった。「お前たちには、どうしても子どもはできない。今日の帰り道で最初に足に触れたものを拾い上げ、子どもにするがよい」というのである。そこで喜んで帰る途中、真っ先に小さな蛇が足に触れた。驚いたものの神の教えだからと、連れ帰って大切に育てていると、人間の食べ物を食べるため急に大きくなり、四、五年後には一丈四、五尺にもなった。しかも親の後についてどこへでも行くので、村人も恐ろしがり、喜左衛門とは付き合わなくなった。「せっかくわが子としてこれまで育ててきたが、あのとおり村で怖がるから、どこかへ身を隠してくれ」と夫婦が言うと、大蛇はよく聞き分け、別れを惜しみながら出ていった。


    それからさらに十何年もたち、二人は年を取り、働く力もなく、ますます貧しくなって困っていた。ちょうどそのころ、塩田川の水を引いた井手が壊れ、何度直してもまた崩れるので、近隣の村々は水が足りず、田植えができない。村々の庄屋が心配し、易者に頼んで占ってもらうと、「これは以前、人に養われていた大蛇の仕業だ。大蛇は養ってもらった恩を返すため、村々の人に少しずつ物を出し合って親を養ってもらおうと望んでいるのだ」と言った。蛇を子にしていたのは喜左衛門の家のほかにはないので、皆で相談し、毎年村々から井手米を集め、この老人の家へ贈ることにした。すると、その後は井手も崩れず、豊作が続き、喜左衛門の家も裕福になった。今ある井手の神様はその大蛇をまつったもので、今でも毎年、秋の彼岸の中日には、村々から鉦浮立をして参拝することになっている。（藤井利作君の報告）


    伝説は普通、昔話の最も主要な部分だけを残すものなので、これによって元の形を推定することはできない。それでも、高い山の神に子どもを祈り求め、その子には水を支配する力があると信じることが、この話の骨組みだったということだけは想像できる。以前、石見国の田植え歌についても考えたことがあるが（『民族』二巻八七六ページほか）、私たちの田の神は、太陽を父、竜女を母として霊山の頂に生まれるというふうに語り伝えた例が、民間には多い。つまり、主な穀物の栽培のために――'
  notes:
  - 末尾の議論はスキャン123へ続く。
  - 井手は農業用水を取るための堰など。鉦浮立（かねふりゅう）は鉦などを伴う民俗芸能。

- id: mmt-139-01
  scan: 139
  section: 田螺の長者／かしこ淵
  original: '蛛が入つて來たので、早速その左の腋を打つて殺したといふ昔話がある(鄕土研究二卷六號)。

    三河の山村に在る話も、女房では無いが、どこから來たとも知れない一人の作男が、長らく

    よく働いてさて歸りがけに、給金はいりませぬから家で一ばん大きな籠を下さいと云ひ、

    それを貰ふと早速旦那を其籠の中に押入れて、背に引かついですたすた山奥へ入つて行く。

    幸ひ路傍へ樹の大きな枝が出て居るので、それを捉へて辛うじて籠から出る。すると何處か

    らか聲がして、おい人を捕つて來たか。うんたつた一疋だけ捕つて來た。今見せて遣るぞと

    言つて籠を下すともう居ない。あゝしまつた遁がしてしまつた。よし今夜又蜘蛛に化けて行

    つて捕つてやると言つたので、旦那は急いで還つて澤山の松明を用意し、その大蜘蛛の入つ

    て來るのを待伏せして燒殺した。夜の蜘蛛は親に似て居ても殺せといふ諺は、此時から言ひ

    始めたものだといふ(昔話號五六頁)。蛇の聟入が段々に忌むべく恐るべきものと解せられ、

    末には相手の滅亡を以てめでたしめでたしとしたと同樣に、曾ては異常の靈兒を人界に留めて

    去つたことを、骨子として居た龍宮女房の說話も、或は零落して斯んな物凄い形にまでなつ

    て居たのである。是を山姥の化けて來たものとしたのは、多分は後代の變更であらうと思ふ

    が、蜘蛛といふ方だけは新たに入つて來る理由が考へ難い故に、尙私は其原因を古い處に求

    めようとして居るのである。水の神の元の姿は、今とても實は瞭然としては居ない。之をオ

    ロチと呼び又はミヅチと謂つたところで、果して陸に棲む蛇類と同じものかどうかも確かで

    無い。單に外國の感化が次第に我々の空想を、さういふ方へ導いて行つたといふのみであ

    る。蜘蛛は事によるとその一つ以前の、我々の迷信の名殘であつたかも知れない。

    それには今一つの手掛りとして、かしこ淵の傳說といふものが注意せられる。此傳說も分

    布は極めて弘く、殆と國の南北の端々にまで及んで居る。むかし或人が大淵に臨んで釣を垂

    れて居ると、至つて小さな蜘蛛が度々水の上に往來して、自分の足に絲を引掛けて去る。そ

    れを恠しんで絲を傍の大きな柳の木などに移して置くと、やがて水底から其絲を牽く者があ

    つて、見る見るその木が根株から拔けて、淵の中へ陷沒してしまつたといふのが普通であ

    る。九州では阿蘇の大谷川のおとろしが淵、こゝでは草履の緒に絲を搦め附けたと謂ひ、

    今

    でも釣に行く者は必ず角結びの草履をはき、草鞋や素足で行くのはあぶないと謂つて居る

    (鄕土研究一卷五號)。四國では阿波名西郡鬼籠野村の女郞淵も其一つであり(名西郡誌一六頁)、'
  translation: '――蛛が入ってきたので、さっそく左の脇を打って殺した、という昔話がある（『郷土研究』二巻六号）。


    三河の山村にも、妻の話ではないが、どこから来たかわからない作男が、長い間よく働き、さて帰る時、「給金はいりませんから、家でいちばん大きい籠をください」と言う話がある。それをもらうと、すぐ主人を籠へ押し込み、背負ってすたすたと山奥へ入っていく。幸い道端に大きな木の枝が出ていたので、主人はつかまって、かろうじて籠から脱け出す。すると、どこからか「おい、人を捕ってきたか」という声がする。「うん、一匹だけ捕ってきた。今、見せてやる」と籠を下ろすと、もういない。「ああ、しまった、逃がしてしまった。よし、今夜また蜘蛛に化けて行って捕ってやる」と言ったので、主人は急いで帰り、たくさんのたいまつを用意して、大蜘蛛が入ってくるのを待ち伏せし、焼き殺した。「夜の蜘蛛は親に似ていても殺せ」ということわざは、この時から言い始めたのだという（『昔話号』五十六ページ）。


    蛇の婿入りが、次第に忌まわしく恐ろしいものと解され、しまいには相手が滅びることを「めでたし、めでたし」としたのと同じように、かつては特別な霊力を持つ子を人間の世界に残して去ったことを骨組みにしていた竜宮女房の説話も、衰えて、このように恐ろしい形にまでなったのかもしれない。これを山姥が化けてきたものとしたのは、おそらく後代の変更だろう。しかし、蜘蛛という点だけは、新しく入り込んだ理由が考えにくいため、私はなお、その原因を古いところに求めようとしている。


    水の神のもとの姿は、今でも実ははっきりしていない。オロチやミヅチと呼んだところで、陸にすむ蛇類と同じものだったかどうかも確かでない。ただ、外国の影響が次第に私たちの想像をそちらへ導いた、というだけである。蜘蛛は、ひょっとすると、それより一段古い私たちの迷信の名残だったのかもしれない。


    そのもう一つの手がかりとして、かしこ淵の伝説が注目される。この伝説も非常に広く分布し、ほぼ国の南北の端々にまで及んでいる。昔、ある人が大きな淵に向かって釣り糸を垂れていると、ごく小さな蜘蛛が何度も水上を行き来し、その人の足に糸をかけては去る。怪しく思い、その糸をそばの大きな柳などへ移しておくと、やがて水底から糸を引く者がいて、見る見るうちに木は根元から抜け、淵の中に沈んでしまった、というのが普通である。九州では阿蘇の大谷川の「おとろしが淵」の話があり、ここでは草履の緒に糸をからめたという。今でも釣りに行く人は必ず角結びの草履を履き、わらじや素足で行くのは危ないと言われている（『郷土研究』一巻五号）。四国では、阿波名西郡鬼籠野村の女郎淵も、その一つである（『名西郡誌』十六ページ）。'
  notes:
  - 冒頭はスキャン138の続き。末尾に列挙する類例はスキャン140へ続く。
  sequence: 144
- id: mmt-140-01
  scan: 140
  section: 田螺の長者／かしこ淵
  original: '中國では伯耆小鹿村の彌六淵、足の拇指にかけられた蜘蛛の絲を、外して大木の根に卷付け

    て置くとも知らず、彌六覺悟といふ聲と共に、その大木を碧潭に引込んだと謂つて居る(地方

    叢談)。攝陽群談に有馬湯山の蜘蛛瀧の話、高原舊事に飛驒下之本村の木數淵の話、裏見寒

    話に甲州國中の某淵の話として、古く書殘されて居るのも皆同じ例であつた。近江の湖北地

    方では池の堤に晝寢をすると、ガワタ卽ち河童が蜘蛛に化けて足に絲を卷附け、水中に引込

    むといふ俗信を傳へ(民族と歷史七卷五號)、武藏の秩父山村でも洪水の際などに、川端に休ん

    で居ると蜘蛛に絲をかけられ、其絲が見るうちに荷繩の如く太くなる。それを鎌で打切つて、

    辛うじて命を全うしたといふ話もあつて、それを又河童の所行と謂つて居る(外秩父槻川村)。

    東三河大荷場川の瀨戶ケ淵でも、赤い蜘蛛が來て絲をかけたといふ話があり、やがて淵の底

    でやあといふ掛聲がしたかと思ふと、絲を移して置いた樹の株が引倒されたといひ(三州橫山

    話一〇五頁)、甲州蘆川の岩桶といふ淵でも、やはり釣人の草履の鼻緒に絲をからんだのを、

    蜘蛛が水底に入つて居るうちに、そつと傍の木の根に移して置いたら云々といふ話がある

    (甲斐昔話集一二二頁)。奧州の方としては花卷の附近、北上川の尼平の淵で、中村紋右衞門な

    る者が釣をして居ると、小蜘蛛が水から出ては編笠へはひ上り、

    次にちよん髷に絲を掛け

    る。それを不審に思つてはづして柳の枝に繫ぐと、

    忽ちにしてそれが細引ほどの太さになつ

    た云々と、八角翁の塵袋には記して居る。

    伊達の半田沼の話は信達民譚集一一〇頁に出て居

    るが、是は傳說といふよりも大分昔話に近く、

    蜘蛛が足の指に絲をかけて行くと、やがて水

    の底で次郞も太郞も皆來い來い。えんとえんやらさアといふかと思ふと、

    大きな株根つこは

    ぽきんと折れたなどと傳へて居る。仙臺のかしこ淵の話は高木氏の傳說集一二四頁にある

    が、是などもよほど亦形が整うて居る。

    小さな蜘蛛が何か黑い物をくはへて、淵から出て來

    ては度々釣する者の足の先に付ける。汚いと思つて之を取つて傍の柳の根にこすりつけて置

    く。暫らくするとえらい音がして、その柳の大木は水底に引込まれる。

    男が驚いて居ると淵

    の中から、賢い賢いといふ聲がした。

    それで此淵の名を賢淵と謂ふのだと結んで居る。妖恠

    の國語は別だといへばそれ迄だが、今だつて智慮のあることをカシコイといふ者は少ない。

    以前は尙更さういふ意味を持たなかつた。仙臺のかしこ淵は卽ち肥後のおとろし淵である。

    畏怖し謹愼すべき靈ある淵といふ言葉が、いつしか此樣な愉快なる說明說話を、

    發生せしむ'
  translation: '中国地方では、伯耆小鹿村の弥六淵がある。足の親指にかけられた蜘蛛の糸を外し、大木の根に巻きつけておいたとも知らず、「弥六、覚悟」という声とともに、その大木を青い淵へ引き込んだという（『地方叢談』）。『摂陽群談』にある有馬湯山の蜘蛛滝の話、『高原旧事』にある飛騨下之本村の木数淵の話、『裏見寒話』にある甲州国中のある淵の話など、古くから書き残されたものも、みな同じ例だった。


    近江の湖北地方では、池の土手で昼寝をすると、ガワタ、つまり河童が蜘蛛に化けて足へ糸を巻きつけ、水中に引き込むという俗信が伝わっている（『民族と歴史』七巻五号）。武蔵の秩父山村でも、洪水の際などに川辺で休んでいると、蜘蛛に糸をかけられ、その糸が見るうちに荷縄のように太くなり、鎌で切ってかろうじて命を守ったという話がある。それも河童の仕業とされている（外秩父槻川村）。東三河、大荷場川の瀬戸ヶ淵でも、赤い蜘蛛が来て糸をかけたという話があり、やがて淵の底で「やあ」という掛け声がしたかと思うと、糸を移しておいた木の株が引き倒されたという（『三州横山話』一〇五ページ）。甲州蘆川の岩桶という淵にも、やはり釣り人の草履の鼻緒に糸をからめたのを、蜘蛛が水底に入っている間に、そっとそばの木の根へ移しておいたところ……、という話がある（『甲斐昔話集』一二二ページ）。


    奥州では花巻の近く、北上川の尼平の淵で、中村紋右衛門という人が釣りをしていると、小蜘蛛が水から出ては編笠へはい上がり、次にちょんまげに糸をかける。不審に思って外し、柳の枝につなぐと、たちまち細引きの縄ほどの太さになった、などと、八角翁の『塵袋』に記されている。伊達の半田沼の話は『信達民譚集』一一〇ページに出ているが、これは伝説というより、かなり昔話に近い。蜘蛛が足の指に糸をかけていくと、やがて水底で「次郎も太郎も、みな来い、来い。えんと、えんやらさあ」と言ったかと思うと、大きな根株がぽきんと折れた、などと伝えている。


    仙台のかしこ淵の話は、高木氏の『伝説集』一二四ページにあるが、これもずいぶん形が整っている。小さな蜘蛛が何か黒いものをくわえて淵から出てきては、何度も釣り人の足先につける。汚いと思って取り除き、そばの柳の根へこすりつけておく。しばらくすると、大きな音がして、柳の大木が水底へ引き込まれる。男が驚いていると、淵の中から「賢い、賢い」という声がした。そのため、この淵を賢淵と呼ぶのだ、と結んでいる。


    妖怪の言葉は別なのだと言えばそれまでだが、今でも、思慮深いことを「カシコイ」と言う人は少ない。以前なら、なおさら、そのような意味はなかった。仙台のかしこ淵は、つまり肥後のおとろし淵なのである。恐れ敬い、慎むべき霊のいる淵、という言葉が、いつしか、こうした愉快な由来を説明する説話を生み出す――'
  notes:
  - 冒頭はスキャン139から続く類例。末尾はスキャン141へ続く。
  - 「今でも……カシコイと言う人は少ない」は著者の執筆当時の言語観察。現代標準語の用法についての説明ではない。

- id: mmt-254-01
  scan: 254
  section: 和泉式部の足袋／五 雨乞小町など・六 誓願寺と鳳來寺
  original: 'らしいのである。

    說話の人物の固有名詞の如きは、決してさう固有のものでは無かつた。

    單に昔々歌の上手な上臈があつてと、話して居たものの引續きに過ぎなかつたのが、何か因緣があつて小野村なら小野小町、泉といふ部落なら和泉式部と、一旦具體化してしまふともう變へられなかつた。

    さうして我々のやうにそれを昔話だといふ者を憎んで見たり、若くは傳說とは歷史のことだと、考へたりするやうにもなつたのである。

    實際斯ういふ場合で無いと誰にも心付かぬ一事は、記錄文字といふものが持つて居る本當の意義である。

    私たちに取つては金石文の存在といふ現前の事實は、たゞ單にそれが此世に出顯した或時點に、それに書表はしたやうなことを信じて居る者が、若干有つたといふことだけしか意味して居ないのであるが、今までの學者は是に其何倍かのものを認めようとして居た。

    上州小野村の文政十三年の石碑なども、あれがもう三四百年も古く、且つ他に法華嶽寺などの類例が見つからなかつたならば、石に刻して世に傳へる位だから、南無藥師の歌は小町の作に違ひないといふ者が、決して群馬縣の考古家だけでは無かつたらう。

    誠にあぶない話であつた。

    熊野本宮路の伏拜の石塔なども、路傍ではあり苔深く古びて居たから、殆と信じない者の通行を許さぬ位であつたが、式部が月の障りの歌を詠み權現が塵にまじはるの御返歌をなされたといふことが、始めて記錄せられたのは元應三年の續千載集である。

    彼女が世盛りであつたらうと思ふ頃から、もう三百年の月日は經過して居る。

    江戶では太田蜀山在世のうちから、あの有名な「蚊ほどうるさきものは無し」の狂歌を、斯翁の作だと信じて居た人が多かつた。

    なんぼ中世の無事な社會でも、三百年の間には如何なる噂だつて發生し得る。

    ましてや歌を中心にした色々の說話、說話を語りやすく又記憶し易くした和歌の、あの通り流行した時代である。

    古いからとて片端から、記錄を丸呑みにすることは到底出來ない。

    然るに斯ういふものばかりを資料にして、和泉式部の傳を書いた文人がつい此頃もあつたのである。

    御序にこの南無藥師などもよろしく願ひたいものである。

    又御伽草紙といふ一つの記錄には、「昔和泉式部と申してやさしき遊女ありけり」と、書いてあることも知らせてやりたいものだ。


    六誓願寺と鳳來寺'
  translation: '――らしいのである。説話の登場人物の固有名詞などは、決してそれほど固定したものではなかった。単に、「昔々、歌の上手な身分の高い女性がいて」と話していた、その延長にすぎなかったものが、何かの因縁で、小野村なら小野小町、泉という集落なら和泉式部、といったように一度具体化すると、もう変えられなくなった。そして、私たちのようにそれを昔話だという者を憎んだり、伝説とは歴史のことだと思ったりするようにもなったのである。

    実際、こうした場合でなければ誰も気づかないことの一つに、文字による記録の本当の意味がある。私たちにとって、金石文が目の前に存在するという事実は、ただ、それがこの世に現れたある時点で、そこに書かれたようなことを信じる人がいくらかいた、というだけの意味しかない。しかし従来の学者は、その何倍ものことを認めようとしていた。上州小野村の文政十三年の石碑でも、あれがさらに三、四百年古く、しかも法華嶽寺などの類例が見つからなかったなら、石に刻んで後世へ伝えるほどなのだから、南無薬師の歌は小町の作に違いない、という者は、決して群馬県の考古研究家だけではなかっただろう。本当に危ない話だった。熊野本宮への道にある伏拝の石塔なども、道端にあり、苔深く古びていたから、信じない者はほとんど通れないと思わせるほどだった。しかし、式部が月経のための障りを詠み、権現が「塵にまじわる」という返歌をなさったということが、初めて記録されたのは、元応三年の『続千載集』である。彼女の盛時だったと思われるころから、すでに三百年が過ぎている。江戸では太田蜀山が生きているうちから、あの有名な「蚊ほどうるさきものは無し」という狂歌を、彼の作だと信じる人が多かった。いくら中世の変化の少ない社会でも、三百年の間には、どんな噂でも生じうる。まして、歌を中心とするさまざまな説話や、説話を語りやすく覚えやすくする和歌が、あれほど流行した時代である。古いからといって、記録を片端からうのみにすることは、とてもできない。ところが、こうしたものばかりを資料にして和泉式部の伝記を書いた文人が、つい最近もいたのである。ついでに、この南無薬師の話なども、よろしく取り上げていただきたいものだ。また『御伽草紙』という一つの記録には、「昔、和泉式部といって、優美な遊女がいた」と書かれていることも、知らせてやりたいものだ。

    六　誓願寺と鳳来寺'
  notes:
  - 冒頭は253からの続き。
  - 『上臈』『遊女』は原文の歴史的な身分・職業の呼称であり、和泉式部本人の史実として訳者が認定したものではない。
  - 部分引用の歌句は、原文が与えていない全歌を補わず訳出。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第54頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

  section: 田螺の長者／三 小泉小太郎と泉小次郎・四 タミナの婿とツブの長者
  original: '其樣な空想は起らぬ筈であるのに、今日の說話は大よそ先づ、此程度にまでも誤傳せられて

    居るのである。桃太郎の誕生地が大和と尾張と讃岐の島に、同時に顯彰せられんとして居る

    のも不思議は無いが、たゞ不思議なのはこの變化の極に在る現今の昔話を以て、直ちに異民

    族の所傳と、比較し得べしとする人々の心持であつた。

    四 タミナの聟とツブの長者

    桃太郞は日本の理想の若武者である。それが時あつて蛇蛙、乃至は雀の姿を假りて出現し

    たこともあるといふのは、無法な推斷だと怒るでもあらう人の爲に、私は默つてたゞ今一つ

    の更に奇拔なる昔話を示して置かうと思ふ。我々の祖先の神から授かる兒には、曾ては又

    田螺の形をして居た者さへあつた。しかもそれが堂々として長者の愛娘の聟となり、最後に

    花の如き若夫婦となることは、一寸法師も物草太郞も皆同じである。此話は國の南北に一つ

    づつあるが、最初には肥前島原半島の小濱村に行はるゝものを略述する。

    昔老いたる夫婦が神に禱つて、たとへ如何なる物でも子といふものがほしいと念ずる。

    さうすると歸りに田の畔の小路に於ておぢいさんおばあさん、私は爰に居るといふ者が

    ある。

    不思議に思つてよく見ると、それは一つの田蜷(田螺)であつた。田蜷では仕樣

    が無いとは思つたが、授かつた兒だから連れて還つて大事に育てる。漸く年頃にもなつ

    て親たちは、嫁が貰ひたいが斯う小さくては來てくれる人もあるまいと歎くと、其樣に

    心配しなさるな、私が行つて連れて來るから、辨當に握飯を二つこしらへて下さい。さ

    うしてハツタイ(麥粉)を附けて下さいと言ふから、其通りにして遣つた。或村の長者に

    二人の娘があつて、妹の方が殊に美しい。田蜷は其家へ訪ねて行つて、玄關から今日

    は今日はといふ。主人が出て見ると人の姿は見えず、聲のする所を氣をつけて見たら、

    一つの田蜷が下駄の齒の間に挾まつて居た。それより色々の問答があつて、其晩は長者

    の家に泊めてもらふことになり、大事な握飯を預けて、若し之を食べたものがあつたら

    私の嫁にすると言ふ。さうして夜竊かに妹娘の口の脇にハツタイの粉を塗り、握飯は自

    分が食べてしまふ。翌日は約束だから仕方無しに、長者の美しい娘は田蜷の嫁に貰はれ

    て行く。田蜷は花嫁の袂の中から、道を教へながら家に還つて來た。それから愈、鬼が'
  translation: 'そのような空想は起こらないはずなのに、今日の説話は、まずこの程度にまで誤って伝えられているのである。桃太郎の誕生地が、大和、尾張、讃岐の島で、同時に顕彰されようとしているのも不思議はない。ただ不思議なのは、これほど変わり果てた現代の昔話を、そのまま異民族に伝わる話と比較できると考える人々の気持ちだった。


    四　タミナの婿とツブの長者


    桃太郎は日本の理想的な若武者である。それが時には、蛇や蛙、さらには雀の姿を借りて現れたこともあるというのを、無茶な推断だと怒るかもしれない人のために、私は黙って、もう一つ、さらに奇抜な昔話を示しておこうと思う。私たちの祖先が神から授かった子には、かつて田螺の姿をした者さえいた。しかも、その子が堂々と長者の愛娘の婿になり、最後には花のような若夫婦になることは、一寸法師も物草太郎も、みな同じである。この話は国の南北に一つずつあるが、初めに肥前、島原半島の小浜村に伝わるものを略述する。


    昔、年老いた夫婦が神に祈り、たとえどんなものでも、子どもというものが欲しいと願う。すると帰り道、田の畔の小道で、「おじいさん、おばあさん、私はここにいます」と言う者がある。不思議に思ってよく見ると、それは一つの田蜷、つまり田螺だった。田蜷では仕方がないと思ったが、授かった子だからと連れ帰り、大事に育てる。ようやく年頃になり、親たちが「嫁をもらってやりたいが、こんなに小さくては来てくれる人もいないだろう」と嘆くと、「そんなに心配しないでください。私が出かけて連れてきますから、お弁当に握り飯を二つ作ってください。ハッタイ、つまり麦粉をつけてください」と言うので、そのとおりにしてやった。ある村の長者に娘が二人いて、妹は特に美しかった。田蜷がその家を訪ね、玄関から「こんにちは、こんにちは」と言う。主人が出てみても人の姿は見えず、声のするところを注意して見ると、一つの田蜷が下駄の歯の間に挟まっていた。そこからいろいろな問答があり、その晩は長者の家に泊めてもらうことになった。大事な握り飯を預けて、「もしこれを食べた者があったら、私の嫁にする」と言う。そして夜、ひそかに妹娘の口元へハッタイの粉を塗り、握り飯は自分で食べてしまった。翌日、約束だから仕方なく、長者の美しい娘は田蜷の嫁にもらわれていく。田蜷は花嫁のたもとの中から道を教えながら帰ってきた。それから、いよいよ鬼ヶ――'
  notes:
  - 冒頭はスキャン125の議論の続き。末尾の引用はスキャン127へ続く。

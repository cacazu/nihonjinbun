  sequence: 237
- id: mmt-233-01
  scan: 233
  section: 狼と鍛冶屋の姥／古屋の漏り
  original: '古屋の漏り

    猫から狼への話の移りかはりは、どう考へて見ても珍らしい事であつた。

    將來この問題を解かうとする人の爲に、もう少し材料を寄せ集めて、豫め二重の勞力を省いて置くことも必要であらう。

    姥が狼であつたといふ例は越中にまで及んで居た。

    肯構泉達錄卷一五、婦負郡駒見村の條に云ふ。

    昔此村にヨウユウといへる者あり。

    其家に久しく使ひし姥、狼の化けて人となりをりしと也。

    或時山伏の夜ふけて吳服山古阪を過ぎ來りしに、狼の群來り山伏を纏はしければ、山伏怖れて喬木に攀ぢ上りけるを、狼あまた重なり、其上に姥跨がりて山伏を引下さんとす。

    時に山伏短刀を拔きて、姥が肘を打落しければ、重なりたる狼ちり〱になり遁失せたり。

    夜明けて山伏樹より下り、駒見村を見かけ暫く休らはんと立寄り、ヨウユウが家に入りけるが、彼姥傷の痛みけるにや、呻き號び打臥し居たりしが、山伏を見るや否逃げ出し、それより行方知れずとなる。

    是れ御郡の舊記に在り云々。

    腕を斬られたといふ點は羅城門などにも似て居るが、話がたゞ是だけであつたならば、姥が狼であつたといふことも知れない筈であつた。

    何か此以外にも云ひ傳へはあつたのである。

    同じ事實を越中舊事記には、又次のやうにも記して居る。

    駒見村、此里にユウユウといふ老尼あり。

    夜は犬となりさま〱妖恠をなしけるが、或時山伏に足を切られそれより此里に住まず。

    其後三年ほど經て、射水郡あら山と云ふ所より、駒見の八右衞門といふ人の方へ書狀をこしたり。

    犬の手跡なりとて人皆之を見たりとなりとある。

    二書は共に百數十年前の舊著であるが、其頃旣に此樣に漠とした話であつたのである。

    磐城刈田郡七ケ宿村は、伊達から米澤へ越える通路であつた。

    信達民譚集九六頁に、昔この村湯の原の峠に、一人の鬼婆が多くの狼を手下にして住んで居た。

    旅人が通りかゝると先づ狼を出して襲ひ殺させ、己はその衣類所持品を奪ひ取つて居た。

    或日旅商人が日の暮に此峠で狼に襲はれ、急いで側の大木に攀ぢ登つて難を避けると、狼は肩から肩に乘つて段々と迫つて來たが、旅人が木の頂上まで登つたので、狼は數が足りない爲に屆かなかつた。

    其'
  translation: '古屋の漏り

    猫の話から狼の話への移り変わりは、どう考えても珍しいことだった。将来この問題を解こうとする人のために、もう少し資料を集めて、同じ労力を二度かけずにすむよう、あらかじめ備えておくことも必要だろう。

    姥が狼だったという例は、越中にまで及んでいた。『肯構泉達録』巻十五、婦負郡駒見村の項には、次のようにある。「昔、この村にヨウユウという者がいた。その家で長年使っていた姥は、狼が化けて人になっていたのだという。あるとき、山伏が夜更けに呉服山の古坂を通って来ると、狼の群れが来て山伏を取り囲んだので、山伏は恐れて高い木によじ登った。すると多くの狼が重なり、その上に姥がまたがって、山伏を引き下ろそうとした。そのとき山伏が短刀を抜いて姥の肘を斬り落とすと、重なっていた狼は散り散りになって逃げ去った。夜が明けて山伏は木から下り、駒見村を見つけ、しばらく休もうと立ち寄ってヨウユウの家に入った。あの姥は傷が痛むのか、うめき叫んで横になっていたが、山伏を見るなり逃げ出し、それから行方がわからなくなった。これは御郡の古い記録にある……。」腕を斬られたという点は「羅城門」などにも似ているが、話がこれだけだったなら、姥が狼だったということもわからないはずである。何か、このほかにも言い伝えがあったのだ。同じことを『越中旧事記』は、また次のように記している。「駒見村。この村にはユウユウという老尼がいた。夜は犬になってさまざまな怪異をなしていたが、あるとき山伏に足を斬られ、それからこの村には住まなくなった。その後三年ほどたって、射水郡のあら山というところから、駒見の八右衛門という人のところへ手紙をよこした。犬の筆跡だといって、人々は皆これを見たという。」二書はともに百数十年前の古い著作だが、そのころすでに、このようにぼんやりした話だったのである。

    磐城国刈田郡七ヶ宿村は、伊達から米沢へ越える通り道だった。『信達民譚集』九六頁には、昔、この村の湯の原の峠に、一人の鬼婆が多くの狼を手下にして住んでいた、とある。旅人が通りかかると、まず狼を出して襲い殺させ、自分はその衣類や持ち物を奪い取っていた。ある日、旅商人が夕暮れにこの峠で狼に襲われ、急いでそばの大木によじ登って難を避けると、狼は肩から肩へ乗ってしだいに迫ってきた。しかし旅人が木のてっぺんまで登ったので、狼の数が足りず、届かなかった。その――'
  notes:
  - 末尾は234へ続く。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第33頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。
  sequence: 238
- id: mmt-234-01
  scan: 234
  section: 狼と鍛冶屋の姥／古屋の漏り
  original: '時何處からか白髪の老婆が走つて來て、狼の頭に足を掛けて梢に達し、商人を捕へようとしたので、商人は刀を拔いて上から斬り下すと、老婆は眞逆樣に落ちて死し、狼の群は逃げ去つたとある。

    是も老婆が山賊の頭であることを知る迄には、まだ此記事以外の言ひ傳へを必要とした筈である。

    安藝の可部峠の七つぎの松の由來談は、鄰國石見の昔話として傳はつて居た(旅と傳說四卷七號)。

    むかし江戶飛脚が朝早く此峠の辻の宿屋を立ち、少し峠を降りかゝつた時に、後から七疋の大きな猫が追掛けて來る。

    驚いて傍の松の大木に登ると、七つの猫はつぎ〱をして手を延ばして來た。

    刀を拔いて其手を斬り落すと、七疋は皆遁げてしまつた。

    飛脚は其手を風呂敷包に入れたまゝ江戶に行き、返りに又同じ峠の宿屋に泊つて、是非とも家のお婆さんに逢はせてくれと言つて、强ひて寢間に行つて逢つた(といふのは何か心當りがあつたのであらうが、其事は話の中には無い)。

    それからどうしても手を出さぬのを無理に出させて見ると、片手は無くて自分の包の中の手とぴたりと合ふ。

    そこで卽座に婆を斬殺すと猫の正體を顯はした。

    三年以前にこの茶屋の婆を喰ひ殺して、自分が婆に化けて居たのであつた。

    此事あつて以來その旅人の攀ぢ登つた松の木を、可部峠の七つぎ松と呼ぶやうになつた。

    安佐山縣二郡の境に在る峠である。

    親方も子分も全部猫であつた例が、斯うして奥州以外にも存して居るのであつた。

    越後彌彥の彌三郞が母の話なども、通例は空から襲撃をしたことになつて居るのだが、それにも亦狼と結托したものがあつた。

    加無波良夜譚第四八話なとは、其點を除くと他は全く今までの彌三郞婆の通りである。

    彌三郞は網使ひ、卽ち田圃に出て鳥を捕るを業とする者であつた。

    或日四頭の狼に襲はれて松の木に逃げ上ると、狼はおいぬ繋ぎをして次々に肩の上に乘つて來たが、一番下の狼が腰が弱くて、何度でもおいぬ繫ぎが崩れるので、今日はだめだ、彌三郞婆さんを賴まうと、一疋の狼が走つて行く。

    はて彌三郞婆さんと云つたらうちの婆さだがと思つて居るうちに、俄かに西の空が大荒れして黑い雲が蔽ひかゝり、其雲の中から大きな手を出して、彌三郞の首筋を摑む。

    やけになつて其手を押へて、腰の鉈を出して力まかせにぶつたぎると、血がだち〱と流れる。

    おいぬはそれを見て叶はん〱と遁げて行く。

    そして大荒れも止んだので、彌三郞は斬り落した腕をかゝへて家に還つて來た。

    婆さ今'
  translation: '――とき、どこからか白髪の老婆が走って来て、狼の頭に足をかけて梢まで達し、商人を捕らえようとした。そこで商人が刀を抜いて上から斬り下ろすと、老婆はまっさかさまに落ちて死に、狼の群れは逃げ去ったという。これも、老婆が山賊の頭だったと知るには、まだこの記事以外の言い伝えが必要だったはずだ。

    安芸の可部峠の「七つぎの松」の由来話は、隣国石見の昔話として伝わっていた（『旅と伝説』四巻七号）。昔、江戸飛脚が朝早く、この峠の辻の宿屋を出て、少し峠を下りかけたとき、後ろから七匹の大きな猫が追いかけてきた。驚いてそばの松の大木に登ると、七匹の猫は次々に重なって手を伸ばしてきた。刀を抜いてその手を斬り落とすと、七匹とも逃げてしまった。飛脚はその手を風呂敷包みに入れたまま江戸へ行き、帰りにまた同じ峠の宿屋に泊まって、ぜひとも家のお婆さんに会わせてくれといい、無理に寝間へ行って会った。というのは、何か心当たりがあったのだろうが、そのことは話の中にはない。それから、どうしても手を出さないのを無理に出させて見ると、片手がなく、自分の包みの中の手とぴったり合う。そこで、その場で婆を斬り殺すと、猫の正体を現した。三年前にこの茶屋の婆を食い殺し、自分が婆に化けていたのである。この事件以来、旅人がよじ登った松を、可部峠の七つぎ松と呼ぶようになった。安佐郡と山県郡の境にある峠である。このように、親分も子分もすべて猫だった例が、奥州以外にもあったのだ。

    越後弥彦の弥三郎の母の話なども、普通は空から襲いかかったことになっているが、その中にも狼と結託したものがあった。『加無波良夜譚』第四十八話などは、その点を除けば、ほかはまったく従来の弥三郎婆の話のとおりである。弥三郎は網使い、つまり田んぼに出て鳥を捕るのを仕事にする者だった。ある日、四頭の狼に襲われて松の木に逃げ登ると、狼は「おいぬ繋ぎ」をして、次々に肩の上に乗ってきた。しかし一番下の狼は腰が弱く、何度やってもおいぬ繋ぎが崩れるので、「今日はだめだ、弥三郎婆さんを頼もう」と、一匹の狼が走っていった。「はて、弥三郎婆さんといったら、うちの婆さだが」と思っているうちに、突然、西の空が大荒れになって黒い雲が覆いかぶさり、その雲の中から大きな手が出て、弥三郎の首筋をつかんだ。やけになってその手を押さえ、腰の鉈を出して力任せにぶった斬ると、血がだらだらと流れた。おいぬたちはそれを見て、「かなわない、かなわない」と逃げていった。そして大荒れの天気も収まったので、弥三郎は斬り落とした腕を抱えて家へ帰ってきた。「婆さ、今――'
  notes:
  - 冒頭は233、末尾は235へ続く。

  section: 米倉法師／一 盲と文芸
  original: 一 盲と文藝盲が我邦の民間文藝の展開に、よかれ惡しかれ些しでも關係をもつて居たらうといふことは、もし證據が無かつたならば今はもう之を想像する者も有るまい。文學は旣によく〳〵上品なものになり切つて居る。さうしてこの至つて謙遜なる以前の參加者は、最初より他人の剽竊を豫期して、署名を以て其著作權を確保しようとはしなかつたのである。彼等の遺產の片端が尙傳はつて居るのは、一つには盲人の趣味氣質の一くねりくねつて居て、容易に門外漢の占有に向かなかつた爲、今一つは人に幼なき日の悅樂を保存する念慮があつて、何でも古い形のまゝで記憶することを心掛けた爲に、自然に幾分か現代と調和せぬものが、殘つて目に立つことになつたのでは無いかと思ふ。私が此頃問題にして居るのは、何故に盲が日本の中世に於て、斯樣にまで活潑に文藝に働きかけることになつたかといふ點が一つ、是には瞽女と座頭との智能境涯の相異を區分して考へて見なければならぬが、大體に信仰は彼等の最初の庇護者であつたのみならず、又彼等を支援し激勵して、その隱れたる才分を發揮させた樣である。第二には斯ういふ竝で無い人たちの影響が、果して一國文藝の主流を變化せしめること無く、たとへば水に木葉などの散り浮くが如く、痕形も無く過ぎ去つてしまふものかも問題であるが、是はどうやら其反對の事實が認められるやうである。一番に氣になるのは笑の文學のやうに、言葉の自然の力と群共同の作用とによつて、效果を思慮の外に於て收めんとするものが、盲の如き自分は笑ひ能はざる不幸なる傭兵から、代を拂つて笑を買取つて居たことであつた。是で我々の滑稽が時勢にもおくれず、又人情の要求にも戻ること無しに、すら〳〵と成長して來たらうといふことは、何としても樂觀することが六つかしいのである。しかし此點を深く考へて見ようとすると、豫め先づ人間の無暗に笑ひたがる習性とか、そ
  translation: '一　目の見えない人と文芸

    目の見えない人々が、よいにつけ悪いにつけ、日本の民間文芸の展開に少しでも関係していただろうということは、証拠がなければ、今ではもう想像する人もいないだろう。文学はすでに、すっかり上品なものになりきっている。そして、このきわめて控えめなかつての担い手たちは、最初から他人が自分たちの作品を盗用することを見越して、署名によって著作権を確保しようとはしなかった。彼らの遺産の一端が今も伝わっているのは、一つには、目の見えない人の趣味や気質がひとひねりしていて、部外者が容易に自分のものにはできなかったためであろう。もう一つには、人には幼い日の楽しみを保存したいという思いがあり、何でも昔の形のまま記憶しようと努めたため、自然といくらか現代にはそぐわないものが残って目立つようになったのではないかと思う。

    私が近ごろ問題にしている点の一つは、なぜ目の見えない人々が日本の中世に、これほど活発に文芸に働きかけるようになったか、ということである。これについては、瞽女と座頭との知的能力や境遇の違いを分けて考えなければならないが、おおむね信仰は彼らの最初の保護者だっただけでなく、彼らを支え励まし、隠れた才能を発揮させたようである。第二には、このような通常とは異なる境遇の人々の影響が、はたして一国の文芸の主流を変えることなく、たとえば水に木の葉が散り浮かぶように、跡形もなく過ぎ去るものなのかという問題がある。しかし、どうやらその反対の事実が認められるようだ。いちばん気になるのは、笑いの文学のように、言葉の自然な力と集団の共同作用によって、意図した以上の効果を上げようとするものが、自分では笑うことのできない不幸な雇われ兵ともいうべき、目の見えない人から、代金を払って笑いを買っていたことだった。これで私たちの滑稽が、時代にも遅れず、人情の要求にも背かず、すんなり成長してきただろうと楽観することは、どうしても難しい。

    しかし、この点を深く考えようとすると、まずあらかじめ、人間がむやみに笑いたがる習性や、それが、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン263）と本文OCRを照合。
  - 画像で「瞽女」を確認。瞽女は主に三味線や歌で生計を立てた盲目の女性芸能者、座頭は盲人芸能者等の歴史的呼称。
  - 原文の歴史的差別語は文脈を保持し、通常は「目の見えない人」等と訳した。障害者の性質を一括りにする評価は著者の当時の見解であり、現代の事実認定ではない。

- id: mmt-048-01
  scan: 48
  section: 海神少童
  original: '肥後のハナタレ小僧樣は、成長したといふことは無いが、前には抱かれて來り後には歩し

    て去つた。さうして又神棚の側に安置してあつたといふことは、右に引く常陸の舊話とも同

    じである。此點が或は今幽かになつた神話期の要件で無かつたかと思ふ。白人諸國の間に於

    ても、又は他の異民族の說話でも、非凡の英雄の最初の出現は多くは是であつた。或は小動

    物の形を假り、或は人であつても非常に魯かであり惰け者であり、或は貧しく且つ醜い姿を

    して居て、親と神靈とを除くの外は、誰あつて之を省みる者も無かつたといふのが普通であ

    る。たゞ其形が極度に小さかつたといふ點のみは、歐羅巴にも指太郞などの話は無いでも無

    いが、特に我邦のやうには古くから發達して居なかつたに反して、日本では現に少名御神の

    神代から、斯ういふ說話が流傳し、又記錄せられて居た。たゞそれが神話の側から見て、淺

    ましいばかりに零落して居ただけである。岩手の昔話のヨケナイやウントクなども、元は何

    かもう少し意味のある名前であつたのが、後々話し手の空想によつて、いつと無く取替へら

    れたものかと思はれる。兎に角に話としてはたゞ惡いつまらぬ名でさへあればよかつたので

    ある。名前や外形ばかりでは人の本當の力を推量することが出來ぬといふ趣意を、寓して居

    りさへすれば十分であつたのである。ハナタレ小僧に樣の字を附けて呼ぶなども、よく考へ

    て見ると凡人にはむつかしい修行であつた。それを何とも思はぬ程に敬虔な老爺のみが、特

    殊の恩惠を受け得たのは理由がある。是も恐らくは隱れたる神の試みの一つで、最初は江刺

    郡のヒヨウトク童子が、臍ばかりいぢくつて居る見たくないワラシであつたといふと同樣

    に、海の少童が御姿の小さかつただけで無く、いつも鼻汁を垂らした甚だ汚らしい小僧で

    あつた故に、侮蔑せられて居たやうに語り傳へられてあつた痕跡かと思はれる。從うて小僧

    が鼻息を以て財寶を出し入れしたといふことは、同じ鼻でも此呼名とは丸で關係が無いか、

    もしくは之に基づいて後に言ひ始めたかの、二つに一つであらうと私は考へてゐる。

    七說話の成長素

    神話が經典で無かつた最も重要なる相異は、實際は此方面に於て求め出すべきものでは無

    かつたらうか。當初我々が信じ傳へて居た上代の事蹟が、一句一字の末まで守るべく改むべ

    からざるものであつたならば、其大部分は現在に到達する以前に、倦まれ輕んぜられて夙に'
  translation: '肥後のハナタレ小僧様には、成長したという話はない。しかし、来るときには抱かれて来て、去るときには歩いていった。また、神棚のそばに安置されていたというのは、前に引用した常陸の古い話とも同じである。この点こそ、今ではかすかになった神話の時代の重要な要素だったのではないかと思う。白人の諸国でも、またほかの異民族の物語でも、非凡な英雄の最初の登場は、多くがこのようなものだった。あるいは小動物の姿を借り、あるいは人間であっても非常に愚かで怠け者だったり、貧しく醜い姿だったりして、親と神霊を除けば、誰も振り向いてくれる者がいなかったというのが普通である。ただ、姿が極端に小さかったという点だけは、ヨーロッパにも指太郎などの話がないわけではないが、とりわけ日本のように古くから発達していたわけではない。それに対して日本では、現に少名御神の神代から、こうした物語が伝わり、記録されていた。ただそれが、神話の側から見れば、情けないほどに零落していただけである。

    岩手の昔話のヨケナイやウントクなども、もとはもう少し意味のある名前だったのが、後々の語り手の空想によって、いつの間にか取り替えられたものかと思われる。ともかく、話としては、ただ悪い、つまらない名前でさえあればよかった。名前や外見だけでは、その人の本当の力は推し量れない、という趣旨を含んでいれば、それで十分だったのである。ハナタレ小僧に「様」の字をつけて呼ぶことなども、よく考えれば、普通の人には難しい修行だった。それを何とも思わないほど敬虔なおじいさんだけが、特別な恵みを受けられたのには理由がある。これもおそらくは、姿を隠した神による試練の一つだった。初めは、江刺郡のヒヨウトク童子が、へそばかりいじっている見苦しい子供だったというのと同じように、海の幼い子も、体が小さいだけでなく、いつも鼻水を垂らしているとても汚い小僧だったために軽蔑された、と語り伝えられていた、その痕跡なのだと思われる。したがって、小僧が鼻息で財宝を出し入れしたという話は、同じ鼻ではあっても、この呼び名とはまったく関係がないか、あるいは、この呼び名をもとに後から言い始めたか、そのどちらかだと私は考えている。

    七　物語を成長させる要素

    神話が経典ではなかったことの、最も重要な違いは、実はこの方面に見いだすべきではないだろうか。当初、私たちが信じ伝えていた古代の出来事が、一句一字の細部まで守り、改めてはならないものだったなら、その大部分は現在に伝わる前に、飽きられ、軽んじられて、とっくに'
  notes:
  - 画像をまたぐ文は前後のunitと接続する。
  - 「白人諸國」「異民族」は著者の時代の分類語を保ち、著者の比較の枠組みとして訳した。少名御神はスクナミカミ。
  sequence: 42
- id: mmt-049-01
  scan: 49
  section: 海神少童
  original: '消えて居たかも知れなかつた。それが尙若干の古意を包容して、兎に角に今日まで保存して

    來られたのは、寧ろ其內容の片端に、自由に世と共に推移することを許された區域があつた

    からで、所謂說話文藝の如何にして起つたかを問はうとする者は、是非とも前以てこの土地

    每に變化するものを、調べて置く必要があつたのである。勿論此區域は時代により、又は社

    會の事情によつて一定せず、曾ては大切であつた不變分子が、次第に改まつて行く力に捲込

    まれた場合もあつたらうが、大體に變へてよろしいと認められたものが古くからもあつた。

    さうして小さな所ではウントク、ヨケナイなどの童兒の名前、大きな點では爺が其神童の御

    蔭を以て、富貴を獲たといふ手續又は方法などが、是に屬して居たことは比較によつて明か

    になるのである。ハナタレ小僧樣が鼻ひ鼻吸ひを以て、金銀米倉を出したり無くしたりした

    例は、肥後より他には聞いたことは無いが、他國の之に該當する部分も亦思ひ思ひに變つて

    居る。たとへば紫波郡昔話ではヨケナイは爺に向つて、俺をどこか人の目に付かぬ處に置け

    といふので、家の一番奥のデコに入れて匿して置いたとある。デコは正しく書けば出居子で

    あつて、出居といふのは接客室のことである。現在でも奧州各地の多くの舊家に於て、座敷

    ワラシといふ童形の守り神が居ると傳へられるが、それが多くは亦此座敷に居るのである。

    卽ち珍客同樣の待遇を受けつゝ、このヨケナイ童子は非常によく働いてくれて、忽ちに柴苅

    爺の家では財布に錢がぢやぐめき、又米が溢れて飯米櫃の蓋が合はなくなつた程に富んで來

    たとある。江刺郡の第一話でも話は大よそ同樣で、やはり奥座敷に匿して置くと、朝晩よく

    働いてまたゝく內に家を富貴にしてくれたといふのみで、それが如何なる働きであつたか迄

    は說いて居ない。ところが同じ郡でも今一つの方の話では、もう少し要領よく筋が運んで居

    て、地の底から連れて來た見苦しい子供は、いつも臍ばかりいぢくつて居るので、爺もあき

    れてしまつて、或日試みに火箸でちよいと其臍を突いて見ると、そこからぷつりと金の小粒

    が飛出した。それから後は一日に三度づつ、火箸で臍を突きつゝ長者になつてしまつた。そ

    れを慾張りの婆が一度に多くの黄金を出させようとして、ぐんと火箸で突いた爲にヒヨウト

    クは死んだとある。是と同斷の話は前にも引いた肥前島原の黑猫で、此方は每日五合づつの

    黃金をひり出したといふが、大變な糞もあつたものだ。

    要するに此は是れ富貴自在の法、何でも手輕に又奇拔に、爺を大金持にしさへすればよか'
  translation: '消えていたかもしれない。それがなお、いくらかの古い意味を含んだまま、ともかく今日まで保存されてきたのは、むしろ内容の一部に、時代とともに自由に移り変わることを許された領域があったからである。いわゆる説話文芸がどうして生まれたのかを問おうとする者は、ぜひとも先に、土地ごとに変化しているこの部分を調べておく必要があった。もちろん、その領域は時代や社会事情によって一定せず、かつては大切だった不変の要素が、次第に変わっていく力に巻き込まれた場合もあっただろう。しかし、おおむね変えてよいと認められるものが、古くから存在した。そして、小さなところではウントク、ヨケナイなどという子供の名前、大きなところでは、おじいさんが神童のおかげで富や栄えを得た手順や方法などが、そこに属していたことは、比較によって明らかになる。ハナタレ小僧様が、鼻で息を吐いたり吸ったりして金銀や米倉を出し入れしたという例は、肥後以外では聞いたことがない。しかし、ほかの土地のそれに当たる部分も、それぞれ思い思いに変わっている。

    たとえば『紫波郡昔話』では、ヨケナイがおじいさんに、「おれをどこか人目につかないところへ置け」と言うので、家のいちばん奥のデコへ入れて隠しておいたという。デコは正しく書けば「出居子」であり、「出居」とは客を迎える部屋のことである。現在でも奥州各地の多くの旧家では、座敷ワラシという子供の姿をした守り神がいると伝えられるが、それも多くはこの座敷にいる。つまり、貴重な客と同じ扱いを受けながら、このヨケナイ童子は実によく働いてくれた。その結果、柴刈りのおじいさんの家では、たちまち財布の中で銭がじゃらじゃら鳴り、また米があふれて飯米櫃の蓋が閉まらなくなるほど豊かになったという。江刺郡の第一の話もほぼ同じで、やはり奥座敷に隠しておくと、朝晩よく働き、あっという間に家を豊かにしてくれたというだけで、どんな働きだったかまでは説明していない。

    ところが、同じ郡のもう一つの話では、筋がもう少し具体的に運んでいる。地下から連れてきた見苦しい子供は、いつもへそばかりいじっているので、おじいさんもあきれてしまった。ある日、試しに火箸でちょっとそのへそを突くと、そこからぷつりと金の小粒が飛び出した。それからは、一日に三度ずつ火箸でへそを突き、ついに長者になった。ところが欲張りのおばあさんが、一度にたくさんの黄金を出させようとして火箸でぐっと突いたため、ヒヨウトクは死んだという。これと同じような話が、前にも引用した肥前島原の黒猫である。こちらは毎日五合ずつ黄金の糞をしたというが、ずいぶん大変な糞もあったものだ。

    要するに、これは思いどおりに金持ちになる方法の話であって、どんな方法でも、手軽で奇抜におじいさんを大金持ちにしさえすればよか'

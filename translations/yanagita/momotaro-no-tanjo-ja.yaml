- id: mmt-267-01
  scan: 267
  section: 米倉法師／三 蚯蚓の歌
  original: 三蚯蚓の歌前代の笑は、通例はそこに居合はす誰人かを傷けるものであつた。强ひて一座の中から笑はれる人を見出さうとして、ひどい闘爭に陷つたことは、獨り戰國殺伐の時代だけの歷史では無かつた。だから其間に或一人の自ら嘲る者が罷り出でて、甘んじて人に笑はれようとずる場合に、笑は始めて價値のある商品となり得たのである。盲人の生計などは誠に賴りないものであつて、斯うでもしなければ奉公の出來ぬ場合が、以前は氣の毒にも相應に多かつた。さうして大名が必ずしもさういふ專門家を召し抱へて置く必要を認めなくなつて、彼等は四散して市坊に其藝を販ぐことになつたのである。今から百五十年ほども前に、出羽と越後との境で或旅人の採集した三味線唄が一つある。採集者は之をくどき唄と呼んで居るから、卽ち亦語りものの新たなる變形であつたのであらう。ちつと讀みにくいから振假名のまゝで次に轉載する。越後國ぶりくとき唄新發田御領內の戶頭組の名主助市の高田の内の一枚田二枚田三枚田四枚田五枚目の三角田の一本眞菰にしかとくつついたる小蝦どのゝ願ひ事聞きやれ米が七八合に錢が四五十欲しや溫海湯治して腰を伸そに。なした小蝦どのゝ無理な事言やる孫子傳はるその腰が伸るならわしも願ひ事がござる錢が七八文米が四五合ほしや蚯蚓も湯治して目を明けよ。或は今日でもまだ此歌は傳はつて居るかも知らぬが、自分はこの蚯蚓の二字に「はし」と傍
  translation: '三　ミミズの歌

    前の時代の笑いは、通常、その場にいる誰かを傷つけるものだった。無理に一座の中から笑われる者を探し出そうとして、激しい争いに陥ったのは、戦国の殺伐とした時代だけの歴史ではない。だから、その間に誰か一人、自分をあざける者が進み出て、甘んじて人に笑われようとしたとき、笑いは初めて価値のある商品になりえたのである。目の見えない人の暮らしは実に頼りないもので、こうでもしなければ奉公できない場合が、以前は気の毒にも相当多かった。そして、大名が必ずしもそのような専門家を抱えておく必要を認めなくなると、彼らは各地に散り、市中で芸を売るようになった。今から百五十年ほど前、出羽と越後との境で、ある旅人が採集した三味線歌が一つある。採集者はこれを「くどき唄」と呼んでいるので、これも語り物の新しい変形だったのだろう。少し読みにくいので、振り仮名のとおりに次に転載する。

    「越後国ぶり・くどき唄」

    新発田御領内の戸頭組の、

    名主助市の高田のうち、

    一枚田、二枚田、三枚田、四枚田、

    五枚目の三角田の一本のマコモに、

    しっかりくっついた小海老どのの願い事をお聞きなさい。

    米が七、八合に、銭が四、五十文欲しい。

    温海へ湯治に行って、腰を伸ばそうよ。

    何とまあ、小海老どの、無理なことをおっしゃる。

    孫子の代まで伝わるその腰が伸びるというなら、

    私にも願い事がございます。

    銭が七、八文、米が四、五合欲しい。

    ミミズも湯治して、目を開けよう。

    もしかすると、今日でもまだこの歌は伝わっているかもしれないが、私はこの「蚯蚓」の二字に「はし」と、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン267）と本文OCRを照合。
  - 引用歌の「戸頭組」「名主助市」「高田」を画像照合。末尾の「はし」は次スキャンで著者が「私」の意味と解している。

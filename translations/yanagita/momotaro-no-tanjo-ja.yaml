  section: 狼と鍛冶屋の姥／八 荒血山の物語
  original: '向つまらぬが、狼の祕密を見たといふ話にまで此箇條が延長して居るだけは意味がある。

    岡山文化資料二ノ六の故島村君の報告にも、或人が是を見てから遁げ還つて、土藏の二階に潛んで居ると、狼の群が下からカタクマ(肩車)をして登つて來た。

    窓の鐵格子の御蔭に命を助かつたといふ話を載せ、だから狼のつぼんで居るのを見た者は、早速あたりの棒切れを杖に突いて、盲人を裝うて何も見えなかつたことを示さなければならぬさうだと言つて居る。

    甲斐昔話集には左甚五郞が山犬のつるんで居るのを見て、山犬に襲はれて宿屋に飛込み、亭主に教へられて疊を高々と積重ね、其上に登つて刀を拔いて振廻はし、やつと追拂つたとあるのがこの類例であるが、どれにも是にも「何屋の婆殿」は喚んで來て居ない。

    左甚五郞は此名匠が微行をしたといふ話が、ちやうど他の地方の宗祇法師のやうに、連鎖譚として行はれて居る爲で、格別狼といふこととは關係が無いらしい。

    我々にも心付かれるのは山の奥の誕生といふことが、特に日本の前代國民には忌々しき大事件であつて、それがいつの間にか山の犬によつて代表せられ、一旦信仰がやゝ衰へると、次第に此種の興味を目途とした說話に展開して、終には此樣な珍らしい形態をも、普及せしむるに至つたらしきことである。

    勿論材料がまだ不足だから、精細に變化の過程を究めることは難いが、少なくとも是が荒血の穢れある者を送つたといふ土佐などの口碑と、無關係に發生したものと言ふ人は無いだらう。

    是も「山の人生」に一應は說いて置いたが、昔は愛發の二字を宛てた越前のアラチ山の峠路に、神祕なる神の誕生があつたことは義經記の流布本と、淨瑠璃の十二段草子と双方に出て居て、二書の筆錄には何程の年處を隔てたか知らぬが、其間の改訂には旣に驚くべきものが認められる。

    要するに物語は古きを厭ひ意外を專らとして、しかも今日の如く丸々新らしいものを、持つて來ては聽く人が承知しなかつたのである。

    奇拔ではあるけれども野根山の產の杉は、やはり亦この荒血といふ印象深き語に誘はれて、古來幾多の歌比丘尼等に、弄ばれて居た空想の糟であつた。

    近い例としては東北の地方學者が、時々問題にする寫本の戀衣物語.江戶でも種に困つた作者たちが、何度か借用して居ると思ふが、臨月の妻を連れた旅の武士が、知らずして惡婆の家に宿を借り、慘虐に母子を殺されてしまふ話などは、京都では旣に今昔物語の頃から、之を小說化しようといふ努力は開始して居たのである。

    中央の文人が田舍にある物を町に持つて來たがるのは、決して今に始まつたことでは無い。

    是だけは肝'
  translation: '――つまらないことだが、狼の秘密を見たという話にまで、この要素が広がっていることには意味がある。『岡山文化資料』二巻六号の故島村君の報告にも、ある人がこれを見てから逃げ帰り、土蔵の二階に隠れていると、狼の群れが下からカタクマ、つまり肩車をして登ってきたが、窓の鉄格子のおかげで命が助かった、という話が載っている。だから、狼が交尾しているのを見た者は、すぐに周囲の棒切れを杖にして、盲人を装い、何も見えなかったことを示さなければならないそうだ、と述べている。『甲斐昔話集』には、左甚五郎が山犬の交尾を見て襲われ、宿屋に飛び込んで、主人に教えられたとおり畳を高く積み重ね、その上に登って刀を抜いて振り回し、やっと追い払った、という話がある。これも同類の話だが、どの話にも「何屋の婆殿」を呼んでくる場面はない。左甚五郎が登場するのは、この名工がお忍びで旅をしたという話が、ちょうど他の地方の宗祇法師のように、一連の話として伝わっているためで、狼とは特に関係がないらしい。私たちにも気づけるのは、山奥での誕生ということが、特に日本の昔の人々にとって畏れ慎むべき大事件であり、それがいつの間にか山犬によって代表されるようになり、いったん信仰がいくらか衰えると、しだいにこうした興味を目当てとする説話へと展開して、ついにはこのような珍しい形まで広く行き渡らせたらしい、ということである。もちろん、まだ資料が足りないから、変化の過程を細かく究めるのは難しい。しかし少なくとも、これが、出産の血のけがれのある者を狼が送ったという土佐などの言い伝えと、無関係に生まれたものだという人はいないだろう。

    これも『山の人生』で一通り述べておいたが、昔は「愛発」の二字を当てた越前のアラチ山の峠道で、神秘的な神の誕生があったことは、『義経記』の流布本と、浄瑠璃の『十二段草子』の両方に出ている。二書が書き留められた時期にどれほどの隔たりがあるかは知らないが、その間の改変にはすでに驚くべきものが認められる。つまり、物語は古いものを嫌って意外さを重んじながら、それでも今日のようにまったく新しいものを持ってきたのでは、聞く人が承知しなかったのである。奇抜ではあるが、野根山の産の杉も、やはりこの「荒血」という印象の強い言葉に誘われて、古くから大勢の歌比丘尼などが取り扱ってきた空想の残りかすだった。身近な例としては、東北の郷土研究者が時折取り上げる写本の『恋衣物語』がある。江戸でも題材に困った作者たちが何度か借用していると思うが、臨月の妻を連れた旅の武士が、そうとは知らず悪い老婆の家に泊まり、残虐な仕方で妻子を殺されてしまう話などは、京都ではすでに『今昔物語』のころから、小説にしようという試みが始まっていた。中央の文人が田舎にあるものを町へ持ってこようとするのは、決して今に始まったことではない。この話だけは、肝心な――'
  notes:
  - 冒頭は226の文を受け、末尾の文は228へ続く。
  - 「盲人」は目の見えない人を指す当時の用語。原文の歴史的表現として残した。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第27頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

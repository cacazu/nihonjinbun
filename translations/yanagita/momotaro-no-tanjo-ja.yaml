  section: 瓜子織姫／八 動物の援助
  original: 山はゝ載せたケケロと鳴く聲に心付き、直ぐに山母を馬より引下して、殺してしまつたとも謂つて居るのである。人間には神祕に通ぜぬといふ大きな弱點がある故に、屢、眼前の危難をも知らずに居ることがある。だから平生より他の形を借りて居る靈魂の、指導に注意をしなければならぬといふ教訓は、恐らくは多くの動物報恩譚よりも今一つ前のものであつた。鷄や犬は家と因緣が深い故に、進んで親切なる暗示を與へると、解することが出來た人々でも、只の野の鳥の言葉の中に、さういふ交通があらうと迄は想像しないやうになつて、無意味に石見の鳶の聲は殘つたのであつた。陸中膽澤郡の一つの話(六)では、うその瓜子姫をお駕籠に乘せて、城下へ嫁入をさせようとすると、路筋の雀どもはそれを知つて、次のやうな歌をうたつた。瓜子姫のお駕籠さアマノジヤク乘さつたアマノジヤク乘さつた併し行列の人はそれがわからぬから、何も知らないでしやんしやんと路を急いだと謂つて居る。更に同郡の今一つの例(五)の如きは、化の皮の顯れたアマノジヤクが、飛んで遁げて釣瓶の橫木の上にとまり、瓜子姫の乘掛さアマノジヤク乘つた、ぶん乘つたと自ら鳴いて、其まゝ天上に飛び還つたとさへ謂つて居るのである。この雀鳥等を桃太郞の犬猿雉と比べると、今では働きぶりに雲泥の差はあるが、此方も最初は鳥の聲に由つて、誤つたる祭典の大危險を覺知し、一方も別に黍團子の契約といふ挿話の起る以前から、動物の援助を必要としたわけが有つたものとすれば、兩者の類似は是よりも遙かに密接であつたので、現に紫波郡昔話の桃の子太郞などでは、地獄からお姫樣を助け出す爲に、黍團子を持つて早く來いといふ手紙が來る。其使をしたのは鳥であつた。其黍團子は一つも半分も遣らず、鬼に食はせて醉ひつぶれさす爲に持つて行つたとあつて、その御使の鳥の如きは、全く報酬無しで主人公を助けて居たのである。
  translation: '山母乗せた、ケケロ」と鳴く声に気づき、すぐに山母を馬から引きずり下ろして殺した、ともいうのである。

    人間には神秘を理解できないという大きな弱点があるため、しばしば、目の前の危険にさえ気づかずにいることがある。だから、日頃から、別の姿を借りている霊魂の導きに注意しなければならない、という教えは、おそらく多くの動物報恩譚より、さらに一段古いものだった。

    鶏や犬は家と深い縁があるので、進んで親切な知らせを与えてくれるのだと理解できた人々でさえ、ただの野鳥の言葉にも、そのような心の通い合いがあるとまでは想像しなくなった。その結果、石見の鳶の声だけが、意味を失ったまま残ったのである。

    陸中胆沢郡の一つの話（六）では、偽物の瓜子姫を駕籠に乗せ、城下へ嫁入りさせようとすると、道沿いの雀たちは、それを知って、次のように歌った。

    瓜子姫の駕籠に

    アマノジャクが乗った

    アマノジャクが乗った

    しかし、行列の人々にはそれがわからないので、何も知らず、しゃんしゃんと道を急いだという。

    さらに同じ郡のもう一つの例（五）では、化けの皮のはがれたアマノジャクが、飛んで逃げて井戸の釣瓶の横木に止まり、

    瓜子姫の乗掛に

    アマノジャク乗った、ぶん乗った

    と自分で鳴いて、そのまま天上へ飛び帰ったとさえいうのである。

    これらの雀などを、桃太郎の犬・猿・雉と比べると、今では働きぶりに雲泥の差がある。しかし、こちらも初めは鳥の声によって、誤った祭りを行うという大きな危険に気づいたのだとし、一方にも、黍団子を与える契約という挿話ができる以前から、動物の援助を必要とする理由があったとすれば、両者の類似は、今よりはるかに密接だったのである。

    実際、『紫波郡昔話』の「桃の子太郎」などでは、地獄からお姫様を助け出すために、黍団子を持って早く来てほしいという手紙が来る。その使いを務めたのは鳥だった。黍団子は一つも半分も鳥には与えず、鬼に食べさせて酔いつぶれさせるために持っていったとしている。つまり、この使いの鳥などは、まったく報酬なしで、主人公を助けていたのである。'

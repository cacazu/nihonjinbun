- id: mmt-061-01
  scan: 61
  section: 海神少童／延命小槌・嘉手志川
  original: '樣に上げた方がよいと、途中の橋の上から其松を水へ投入れた。暫らくすると其川の中

    から、龍宮の御使が現はれて、迎へに來たから一しよに龍宮へ行かうと言つて爺は龍宮

    へ連れて行かれ、大變な御馳走になつた。さうして其歸りに、小さな打出の小槌といふ

    ものを貰つて來た。……

    是から後は「米倉と小盲」の話になつて行くので、其事はもう一度說くつもりだから爰では

    略して置く。爺が欲しいといふ物は何でも出してくれたといふ迄は、小槌も小僧も全く同じ

    であつた。甲斐昔話集では此槌が延命小槌、奥州三戶郡ではエメ小袋とエメ小槌と、二つの

    寶物にして居るのである。豐前民話集は或貧乏な男が、子供の殺さうとする龜を助け、後に

    其龜が美女に化けて、小槌を携へて來てくれたことになつて居り、今ある浦島太郞の話や今

    昔物語にある小蛇救助の話とも近いが、壹岐の島では次の節にて說く如く、小さい龜が直接

    に小僧の代りをして居るのであつた。小僧と黑猫と寶物の打出小槌とでは、あんまり話が變

    化して居るやうに見えるが、どういふわけかは知らず、筋だけは何れも共通して居る。

    嘉手志川

    壹岐の昔話には、水の神に木を獻じたといふ點は全く落ちて居て、其代りによほど花咲爺

    の方へ近くなつて居るものがある。山口麻太郞君の昔話集中、此島田川村の例として記載し

    たものは、

    昔ある處に貧乏な爺と婆があり、又その隣に金持の爺と婆とが住んで居た。正月が近く

    なつて、隣の金持の家では餅を搗いて居る。こちらは貧乏で餅も搗かれぬので、

    隣の餅つき音高い。音は高うとも口にやはいらん

    と謂つて、二人で正月の飾柴を賣りに町へ出た。賣つてしまつてから海邊の岩の上に腰

    かけて煙草を吸うて居ると、海の中から乙姫樣が現れて、龍宮へ連れて行くから來いと

    いはれる。二人は喜んで連れられて行くと、目も眩しい程の立派な御殿で、何日も御馳

    走になつた。歸る時に乙姫樣が土產に一疋の龜を下さる。それを貰つて來て教へられた'
  translation: '様へ差し上げたほうがよいと、途中の橋の上から、その松を水へ投げ入れた。しばらくすると川の中から竜宮の使いが現れ、「迎えに来たから、一緒に竜宮へ行こう」と言うので、おじいさんは竜宮へ連れていかれ、大変なごちそうになった。そして帰りに、小さな「打ち出の小槌」というものをもらって帰った。……

    この後は「米倉と小盲」の話へ進むので、それについては改めて説明するつもりだから、ここでは省いておく。おじいさんが欲しいと言うものを何でも出してくれた、というところまでは、小槌も小僧もまったく同じだった。『甲斐昔話集』ではこの槌は「延命小槌」で、奥州三戸郡では「エメ小袋」と「エメ小槌」という、二つの宝物になっている。『豊前民話集』では、ある貧乏な男が、子供が殺そうとしていた亀を助けると、後にその亀が美女に変身して小槌を持ってきてくれたことになっている。現在の浦島太郎の話や、『今昔物語』の小蛇を助ける話にも近いが、壱岐の島では、次の節で述べるように、小さな亀が直接、小僧の代わりをしている。小僧と黒猫と、宝物の打ち出の小槌では、あまりにも話が変化しているように見える。しかし、どういうわけかはわからないが、筋だけはどれも共通しているのである。

    嘉手志川

    壱岐の昔話には、水の神に木をささげたという点がすっかり抜け落ち、代わりに、ずっと花咲か爺に近くなっているものがある。山口麻太郎君の昔話集で、この島の田川村の例として記されたものは、次のとおりである。

    昔、あるところに貧乏なおじいさんとおばあさんがいて、その隣には金持ちのおじいさんとおばあさんが住んでいた。正月が近づき、隣の金持ちの家では餅をついている。こちらは貧乏で、餅もつけないので、

    隣の餅つき、音高い。音は高くても、口には入らぬ。

    と言いながら、二人で正月の飾りの柴を売りに町へ出た。全部売ってから、海辺の岩に腰かけて煙草を吸っていると、海の中から乙姫様が現れ、竜宮へ連れていくからおいでと言われる。二人は喜んで連れられていくと、目もくらむほど立派な御殿で、何日もごちそうになった。帰るとき、乙姫様が土産に一匹の亀をくださる。それをもらって帰り、教えられた'
  notes:
  - 画像をまたぐ文は前後のunitと接続する。
  - 冒頭の「……」は著者自身が原文の引用につけた省略符号であり、この訳での省略ではない。
  - 「米倉と小盲」は後で扱われる話の名称として原表記を保持。

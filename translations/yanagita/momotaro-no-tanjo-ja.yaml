  original: 頃修練の笛を吹いて居ると、やはり美人が現はれて此あたりを泥海とする祕密の企てを語つたので、それを城中に注進して鐵の杭を打込んで其大蛇を殺させたが、男も亦歸り途に黑雲蔽ひかゝつて行方知れずになつたといひ、今一人の採集者の報告では、男は琵琶一といふ盲であつて、其藝の上達を禱る爲に藥師堂に籠り、蛇女に行逢うたのだと謂つて居る。內田邦彥氏の津輕口碑集に依れば、津輕にも是と近い話があつたといふが何れの峠であるかを傳へず、又少しばかり要點が壞れて居る。しかしちよつと珍らしいのは其三味線彈きの盲が峠で出逢つた女性が、我は此山中に住むタコといふものだと言つて居ることである。座頭は峠を下つて麓の村の酒屋に來て、其話をすると直ぐに死んでしまつた。そこへ又其女が出て來て顚末を語つたといふのはをかしいやうだが、座頭が祕密を漏せば卽座に命を失ふ約束であつた故に、さう詳しい事情までを說明する暇が無かつたらうといふ心遣ひからであらう。兎に角に村人は大急ぎで銕の棒を立て廻したので、タコは歸ることを得ずして蛇體となつて死んだ。其タコと盲人とを合せ祀つたのが、今のオシラ神であるといふのは、態以て珍らしい傳承であつた。タコといふ名の起りは是非考へて見なければならぬ。魚を食つて水の神になつたといふ田澤湖の女性も、其名が「たつ子」であつたことは之と關係があるかも知れない。それから西日本では備後の双三郡作木村にも同じやうな話はあるが、是は座頭では無く山臥だといふから、少しく聯絡を見出すのに面倒である。三重縣では河藝郡上野村、靈現堂の森といふ處に傳はつて居るのは、是も主人公が琵琶一といふ盲で、話は最も福島縣のものと近いが、更に一段と人を感動せしめる箇條は、ちやうど祈願が叶うて兩眼の明を得た晩に、村を湖水にしようといふ神靈の秘密を聽いて、尙且つ一命を棄てて之を里人に敎へたといふ所に在つた。この裏切られたる大蛇こそは、卽ち琵琶一の禱つて居た靈現堂の神であつたといふのである。單に一夜の宿の行きずりの友では無くして、現に我眼を開けて下された守り神であつたのに、それをしも尙農民の危難を免れしめんが爲に、銕の材を打込んで殺戮せしめたといふ點に、この一種の說話の神祕なる歷史は潜んで居るかと思ふ。東京の近くでは箱根の木賀温泉のあたりに、又一つの蛇骨山の話があつた。石井硏堂氏の國民童話に、昔伊豆三島の宿の按摩の家へ、每夜遊びに來る小僧が有つで、しまひに祕密を告げたといふのがそ
  translation: '〔前のスキャンから続く〕練習を重ねている笛を吹いていると、やはり美女が現れ、このあたりを泥の海にする秘密の計画を話した。そこで城へ急いで知らせ、鉄の杭を打ち込んでその大蛇を殺させた。しかし男も、帰り道に黒雲に覆われ、行方不明になったという。別の採集者の報告では、男は琵琶一という目の見えない者で、芸の上達を祈るため薬師堂にこもり、蛇の女に出会ったのだという。内田邦彦氏の『津軽口碑集』によれば、津軽にもこれに近い話があったそうだが、どこの峠かは伝わらず、要点も少し崩れている。ただし、少し珍しいのは、三味線を弾く目の見えない男が峠で出会った女性が、「私はこの山に住むタコというものだ」と言うことである。座頭は峠を下り、麓の村の酒屋に来て、その話をするとすぐ死んでしまった。そこへまたその女が現れ、いきさつを話したというのはおかしなようだ。しかし座頭は、秘密を漏らせば即座に命を失う約束だったので、そこまで詳しい事情を説明する暇はなかっただろう、という配慮からなのだろう。ともかく村人は大急ぎで鉄の棒を周囲に立てたので、タコは帰れず、蛇の姿になって死んだ。そのタコと目の見えない人とを合わせて祭ったのが、今のオシラ神だというのは、いっそう珍しい伝承だった。「タコ」という名の起こりは、ぜひ考えてみなければならない。魚を食べて水の神になったという田沢湖の女性も、「たつ子」という名だったことは、これと関係があるかもしれない。

    それから西日本では、備後の双三郡作木村にも同じような話があるが、これは座頭ではなく山伏だというので、つながりを見いだすには少し手間がかかる。三重県河芸郡上野村の「霊現堂の森」という所に伝わるものは、これも主人公が琵琶一という目の見えない男で、話は福島県のものに最も近い。ただし、さらに一段と人を感動させるのは、ちょうど願いがかなって両目が見えるようになった晩に、村を湖にしようという神霊の秘密を聞き、それでも命を捨てて村人へ知らせた、という点だった。裏切られたこの大蛇は、琵琶一が祈っていた霊現堂の神だったというのである。ただ一晩の宿で通り合わせた友ではなく、現に自分の目を開けてくださった守り神だった。それでもなお、農民を危難から救うために、鉄の棒を打ち込んで殺させたという点に、この種の説話の神秘的な歴史が潜んでいるのではないかと思う。東京近くでは箱根の木賀温泉あたりに、もう一つ蛇骨山の話があった。石井研堂氏の『国民童話』にある、昔、伊豆三島の宿の按摩の家へ、毎夜遊びに来る小僧がいて、ついには秘密を告げたという話が、その、'

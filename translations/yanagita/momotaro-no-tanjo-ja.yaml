  section: 隣の寝太郎／妻に助けられて
  original: と、是こそはまさしく遊行文藝の潤色であつたやうに見えるが、其實は却つて芝居の方が、趣向を民間の信仰から導いて居たらしいのである。駿河遠江の山村をあるいて居ると、今でも時々はアマグニのツルギと稱して、鎗の穗のやうな物を持傳へて居た話を耳にする。其家寶の威德と傳來とに就いては、極めて茫漠たる解說を存するのみであるが、少なくとも目に見え形を留むる或物體によつて、家の古さとその主張の正しさとを證明せんとした點は、塚や神木などと趣意を同じうして居たかと思はれる。天國といふ名も今日の鑑定家の言ふやうな、此世の刀鍛冶の通稱では無かつたのかも知れない。兎に角に山田白瀧譚の本元に於ては、名劒は姫が故鄕の地から携へて來たものであつた。さうしてこの稀世の寶を永く傳へたといふことと、姫の福分が夫の家業を支持して、子孫繁昌の基を築いたといふこととは、曾ては相結んで家の傳說の本體を爲して居たのである。だから桃太郞がたゞ鬼ケ島の財寶のみを運搬して、御姫樣を連れて來たとは言つて居らぬのも、私には童話化時代の脫落としか考へられぬのであつた。それと同樣に近頃漸く人に知られ、始めて記錄に上つた民間の說話でも、この二つの要素の組合せ、もしくは其取扱ひ方のどうあるかによつて、意外に成立の古かつたことを推定せしむるものが有ることと思つて居る。中古の讀み物であつた御曹司の島渡りは、姫と寶物とを併せて得たことになつて居り、同じく一寸法師は先づ打出小槌の力を其身に試みて、愈,婚姻を幸福ならしめたとは云ふのだが、是ではまだ女性の働いた部分が少ない。グリム童話の愚か者ハンス、もしくはペンタメローネのうつぼ舟の話などのやうに、或は炭燒長者の黄金發見の如く、妻に教へられ又は導かれて、新たに運命を開拓したのでは無かつた。ところが奧州で採集せられた蛇の聟田螺の聟、及び奄美大島の蛙の聟などでは、この花嫁の參與が絕對に必要であつた。說話はたゞ單によき女房を得たことを以てめでたしとはせずに、更に其力によつて始めて三國一の聟殿は出來上るのであつた。勿論此變化の段階を以て、直ちに說話分立の順序とは認められぬが、少なくとも後に口頭の傳承から採集した文藝にも、尙數百年の齡をもつ記錄より、より古い多くの要素を含むものが有るとだけは言へる。一つの思ひ切つて新らしい例を擧げると、今でも話し家が笑はせて居る王子の狐、狐や天狗の類をあべこべに誑かして利益をしめたといふ話などは、同じ征服談の中でもよく〳〵相
  translation: '……これこそ、旅をする芸能者の文芸による脚色だったように見える。しかし実際には、むしろ芝居のほうが、民間の信仰から趣向を導いていたらしい。駿河・遠江の山村を歩いていると、今でもときどき、「アマグニのツルギ」といって、槍の穂先のようなものを代々伝えていた話を耳にする。その家宝の霊威や伝来については、ひどく漠然とした説明しか残っていない。しかし少なくとも、目に見え、形のある物によって、家の古さと、その主張の正しさを証明しようとした点は、塚や神木などと同じ趣旨だったと思われる。天国という名も、現在の鑑定家がいうように、現実の刀鍛冶の通称ではなかったのかもしれない。

    ともかく、山田白瀧の話のもとでは、名剣は姫が故郷から携えてきたものだった。そして、この世にも珍しい宝を長く伝えたことと、姫の持つ幸運が夫の家業を支え、子孫繁栄の基礎を築いたこととは、かつて結びついて、家の伝説の中心になっていたのである。だから、桃太郎が鬼ヶ島の財宝だけを運び、お姫様を連れてきたとは語っていないことも、私には、子ども向けの話になった時代に抜け落ちた部分としか考えられなかった。それと同じように、近ごろようやく人に知られ、初めて記録された民間の説話でも、この二つの要素の組み合わせや扱い方によって、意外に古く成立したことを推定できるものがあるだろうと思っている。

    中古の読み物だった『御曹司の島渡り』では、姫と宝物をともに得たことになっている。同じく一寸法師は、まず打出の小槌の力を自分の体に試し、いっそう幸せな結婚をしたという。しかし、それではまだ女性が働いた部分が少ない。グリム童話の愚か者ハンスや、『ペンタメローネ』のうつぼ舟の話、あるいは炭焼長者の黄金発見のように、妻に教えられたり導かれたりして、新しい運命を切り開いたのではないからだ。ところが、奥州で採集された蛇の婿・田螺の婿や、奄美大島の蛙の婿などでは、この花嫁の参加が絶対に必要だった。説話は、ただよい妻を得ただけでめでたしとはせず、さらにその妻の力によって、初めて三国一の婿殿ができあがるのであった。もちろん、これらの変化の段階を、そのまま説話が分かれた順序だとは認められない。しかし少なくとも、後から口頭伝承を採集した文芸にも、数百年を経た記録より、さらに古い要素を多く含むものがある、とだけはいえる。

    思い切り新しい例を一つ挙げると、今も噺家が笑わせている「王子の狐」のように、狐や天狗などを逆にだまして利益を得た話は、同じ征服の話の中でも、とことん相手を……'

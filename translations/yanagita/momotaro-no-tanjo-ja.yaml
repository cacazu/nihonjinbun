  original: 戶の盲巫女は、曾て私の家に來てオシラ神を遊ばせ申してくれた時に、殆と手を休める間も無く煙草を吸ひつゞけて居た。是もどうして其樣に煙草が好きになつたかを尋ねて見ると、私は十三で眼を病み出した頃には、もう米の飯よりも煙草が好きでありました。煙草を斷つて心願を掛けるならば、その眼はなほして遣らうと法印樣は言つてくれましたが、いゝえ眼は見えなくとも煙草は止めませんと謂つて、今でも斯うしてのんで居りますと答へた。是が後々考へ直しても取返しのつかぬものだけに、その言ふことが私には悲しく聞きなされた。しかし煙草の方は最初から吸はれる爲のものだからよいが、蚯蚓などは斯うした說明の昔話が出來たばつかりに、今でもまだ聲の藥だなどと言つて、捕つて煎じて飮む者が絕えないのである。座頭は蚯蚓に取つては實は有難い知音では無かつた。それから此序にもう一つ言つて見たいことがある。ジュデオン·ユエの民間說話論を讀んで見ると、この我邦の蚯蚓の由來と、半分以上似た昔話が佛蘭西にもあつた。orvetと稱する一種の小さな蛇は、やはり日本の蚯蚓と同じやうに、眼をもたぬ蛇だと傳へられて居る。それが我々の鶯と譯して居るロシニオールと、やはり目と聲との交換を約したのださうである。ところが此話では相手方が不正直なやつで、眼を取つてしまつて好い聲は渡さなかつた。それ故に兩者は今も甚だ仲が惡く、盲のオルべは默つて憤つて居るといふのである。何か奥深い理由の有ることと私は思ふが、世界の多くの民族を通じて、動物の說話といふものは其大部分が、詭詐と背約との逸事を以て組み立てられて居るのである。日本でも「猿の尻尾はなぜ短い」のやうに、歐羅巴の獸界奇譚と全く共通のものもあれば、或は又百舌の沓作りや雲雀の借金、梟紺屋だの鳶酒屋だのの如く、此國に於て格別の發達を遂げたかと思はれるものもあるが、その大部分が前生の不義理を、今でも覺えて居て怒つたり詫びたりして居るといふのは、珍らしい事實であると思ふ。蛇と鶯とが取引をしたといふ說話なども、果して中間に尙幾つかの類例が分布して居て、彼から是に傳播した經路を示し、單なる偶然の一致では無かつたことを、證據立て得るか否かは未定であるが、假に歐羅巴のものが移つて爰に來り、又はどこかの第三の起點から、東西に別れて出たものと決しても、まだ日本の蚯蚓の昔話が、盲の考案になつたといふ私の想像は動かぬのである。以前騙されて眼を奪はれたといふ古い說話が有つたのを、改めて交易
  translation: '〔前のスキャンから続く〕目の見えない巫女のことである。以前、私の家に来てオシラ神を遊ばせてくれたとき、ほとんど手を休める間もなく、煙草を吸い続けていた。この人にも、どうしてそれほど煙草が好きになったのかと尋ねてみると、「私は十三歳で目を患い始めたころには、もう米の飯より煙草が好きでした。煙草を断って願を掛けるなら、その目は治してやろうと法印様は言ってくださいましたが、『いいえ、目が見えなくても煙草はやめません』と言って、今でもこうして吸っています」と答えた。これが後から考え直しても取り返しのつかないことだけに、その言葉は私には悲しく聞こえた。しかし煙草は最初から吸われるためのものなのでよいが、ミミズなどは、このような由来を説明する昔話ができたばかりに、今も声によい薬だなどといって、捕って煎じて飲む人が絶えない。座頭は、ミミズにとっては実はありがたい理解者ではなかった。

    それから、このついでにもう一つ述べておきたいことがある。ジュデオン・ユエの民間説話論を読むと、日本のミミズの由来と半分以上似た昔話が、フランスにもあった。orvetという一種の小さな蛇は、やはり日本のミミズと同じく、目を持たない蛇だと伝えられている。それが、私たちが「鶯」と訳しているロシニオールと、やはり目と声を交換する約束をしたのだそうである。ところがこの話では、相手が不正直なやつで、目を取ってしまって、よい声を渡さなかった。そのため両者は今もひどく仲が悪く、目の見えないオルベは黙って怒っているという。何か深い理由があるのだろうと私は思うが、世界の多くの民族を通じ、動物の説話は大部分が、だまし合いや約束破りの逸話によって組み立てられている。日本でも「猿の尻尾はなぜ短い」のように、ヨーロッパの動物の奇談と完全に共通するものもあれば、「百舌の沓作り」「雲雀の借金」「梟紺屋」「鳶酒屋」など、この国でとくに発達したかと思われるものもある。その大部分で、前世の不義理を今も覚えていて怒ったり謝ったりしているというのは、珍しい事実だと思う。

    蛇と鶯が取引をしたという説話についても、中間の地域になおいくつかの類例が分布していて、あちらからこちらへ伝わった経路を示し、単なる偶然の一致でなかったことを証明できるかどうかは、まだ定まらない。しかし、仮にヨーロッパの話が移ってここへ来た、またはどこか第三の出発点から東西に分かれた、と確定しても、日本のミミズの昔話は目の見えない人の考案によるものだという私の想像は、なお動かない。かつてだまされて目を奪われたという古い説話があったのを、改めて交換が、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン269）と本文OCRを照合。
  - 画像で「蛇と鶯」を確認。オシラ神を遊ばせるとは、東北の神体を用いる祭祀・語りの実演。orvet・ロシニオールの生物名や分類は著者の記述を保持。
  - ミミズの薬効や禁煙による視力回復を本訳が保証するものではない。

- id: mmt-082-02
  scan: 82
  section: 瓜子織姫／七 瓜子姬の敵
  original: 姫の事業が旣に完成に近くなつて居たことは、以前には恐らく爺と婆との留守にした理由から、說明せられて居たのだらうと思ふ。陸中の例では四つまでも(一、二、三、七)山へいつもの通り仕事に行つたことになつて居るが、他の上閉伊郡の話(四)に於ては、隣の長者殿から嫁に貰ひに來たので、二人で嫁入道具を買ひに町へ行くとあり、膽澤郡の二話(五、六)は單に町へ買物にといふだけであるが、其一つはやはり方々から嫁に貰はれたとあり、町から着物を買つて還つて來て、にせ物の瓜子姫を立派に着飾らせて、お駕籠に乘せて嫁に遣る
  translation: 姫の事業が、すでに完成に近づいていたということは、以前には、おそらく爺婆が留守にした理由によって説明されていたのだろうと思う。陸中の例では四つまで（一、二、三、七）が、いつものように山へ仕事に行ったとしている。しかし、別の上閉伊郡の話（四）では、隣の長者から嫁に欲しいと求められたので、二人で嫁入り道具を買いに町へ行く、とある。胆沢郡の二話（五、六）は、単に町へ買い物に行ったとするだけだが、その一つでは、やはりあちこちから嫁に望まれたとし、町から着物を買って帰ってきて、偽物の瓜子姫を立派に着飾らせ、駕籠に乗せて嫁入りさせる

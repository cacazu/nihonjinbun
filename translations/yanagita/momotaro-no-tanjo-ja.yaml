  section: 海神少童
  original: 'に黑猫をといふと、是には每日小豆を五合づつ喰はせなくてはならぬと言つて、その黑

    猫を下された。家につれて來て五合の小豆を與へると每日五合づつ黃金を糞する故に、

    忽ちにして大金持になつてしまつた。

    日頃音信もせぬ姉は此事を聞いて、その黑猫を借りに來た。否とも言へぬから貸して遣

    ると、元來慾の深い姉は大喜びで、小豆を一升づつ食はせて見たが、一升の黄金は糞ぜ

    ずに、その黑猫は死んでしまつた。

    妹は可愛さうに思つて猫の死骸を貰つて來て、自分の屋敷に丁寧に埋めてやると、後に

    其土から橙の木が生えて來た。黄金を生んだ猫の死骸から成長した橙の木だから、め

    でたい物としてそれ以來、正月には其實を飾るやうになつたといふ。

    此例に於ては爺は旣に退いて、貧しい妹と富みたる姉と、二人の同胞に分身して居るが、

    町に賣りに出て賣れなかつた薪を、水底に向つて投込んだ點のみは一つである。さうして又

    賣れ殘りだから投込んだといふことは、早旣に一つの變化であつたらしいのである。遠く日

    本の他の端に行つて見ると、岩手縣江刺郡の一つの昔話などは、此點は全くちがつて居て、

    結果は却つて肥後玉名のものに近かつたのである。

    昔爺が山に行つて柴を苅つて居ると、其下の淵の水がくる〴〵と面白く渦を卷いて居

    る。それを面白いと思つて、苅つて居た柴を一束投込むと、見事にくる〴〵とまはつて

    水の底に沈む。是は面白いと又一束、又一束と投げて居るうちに、とう〴〵三月の間苅

    り溜めて居た柴を、殘らず此渦卷の中へ沈めてしまつた。ところが其淵の中から美しい

    女が出て來て柴の禮をいひ、是非わたしの家へ遊びに來てくれといふ。そこで目をつぶ

    つて女に負はれて、淵の底に入つて行くと、眞に立派な構への屋形があつて、爺が投込

    んだ柴は其脇にちやんと積重ねてあつた云々(江刺郡昔話二三頁)。

    是とよく似た話は同じ縣の紫波郡にもあるが、此方は時を歲の暮と謂ひ、爺が淵の渦卷の中

    へ投入れたのは、正月の用意に迎へに行つた門松の木であつたと傳へて居る(紫波郡昔話一頁)。

    綠の松の枝を谷川の淵に投じたのは、繪樣としても美しいといふだけで無く、他の多くの昔

    話たとへば笠地藏や大歲の火の由來に於ても、無邪氣な老爺がよい事をして福德を授かつ

    たのは、大抵はまた除夜の出來事となつて居る。卽ち此日は最も奇瑞の起り易い時刻でもあ'
  translation: 'に黒猫が欲しいと言うと、これには毎日小豆を五合ずつ食べさせなければならないと言って、その黒猫をくださった。家へ連れて帰って五合の小豆を与えると、毎日五合ずつ黄金の糞をするので、たちまち大金持ちになった。

    日頃は便りもしない姉がこのことを聞き、その黒猫を借りに来た。嫌とも言えないので貸してやると、もともと欲の深い姉は大喜びで、小豆を一升ずつ食べさせてみた。しかし、一升の黄金の糞をするどころか、その黒猫は死んでしまった。

    妹はかわいそうに思い、猫の死骸をもらってきて、自分の屋敷に丁寧に埋めてやった。すると後に、その土から橙の木が生えてきた。黄金を生んだ猫の死骸から育った橙の木なので、めでたいものとして、それ以来、正月にはその実を飾るようになったという。

    この例では、おじいさんはすでに姿を消し、貧しい妹と金持ちの姉という二人の姉妹に分かれている。ただ、町へ売りに出て売れなかった薪を水底に投げ込んだという点だけは同じである。そして、売れ残りだから投げ込んだということも、すでに一つの変化だったらしい。遠く日本のもう一方の端へ行ってみると、岩手県江刺郡のある昔話などは、この点がまったく違うのに、結果はかえって肥後玉名の話に近いのである。

    昔、おじいさんが山へ行って柴を刈っていると、その下にある淵の水が、くるくるとおもしろく渦を巻いている。それをおもしろいと思って、刈っていた柴を一束投げ込むと、見事にくるくる回って水底へ沈む。これはおもしろいと、もう一束、もう一束と投げているうちに、とうとう三か月間刈りためていた柴を、残らずその渦の中へ沈めてしまった。すると、その淵の中から美しい女が現れ、柴の礼を言って、ぜひ私の家へ遊びに来てくれと言う。そこで、目をつぶって女に背負われ、淵の底へ入っていくと、実に立派な造りの屋敷があり、おじいさんが投げ込んだ柴が、そのそばにきちんと積み重ねてあった、という（『江刺郡昔話』二三頁）。

    これとよく似た話は、同じ県の紫波郡にもある。しかし、こちらは年の暮れのこととされ、おじいさんが淵の渦の中へ投げ入れたのは、正月の準備に山から迎えに行った門松の木だったと伝えている（『紫波郡昔話』一頁）。緑の松の枝を谷川の淵に投げ入れたというのは、絵として美しいというだけではない。ほかの多くの昔話、たとえば笠地蔵や大歳の火の由来の話でも、無邪気なおじいさんがよいことをして幸福や富を授かったのは、たいてい大みそかの夜の出来事になっている。つまり、この日は最も不思議なめでたいことが起こりやすい時でもあ'

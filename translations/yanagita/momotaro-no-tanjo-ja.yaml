  section: 隣の寝太郎／六 博打婿入りの事
  original: 方が遙かに今日の諸國の「寢太郞」に近く、しかも造意を以て神話の寫實味を排除して居る點は、却つて長州厚狹の治水開土談より前へ出て居る。私はこの事實によつて、宇治拾遺といふ書物が成つた時代に、旣に男性の說話を職業とする者が(盲人では無かつたかも知れぬが)、存在せしことを想像して居るが、それは素より今後發見せらるべき旁證の多少によつて決すべきことである。果して此想像が確かだつたとすると、神話は獨り一個の神子出現譚のみならず、他の全く之と關係なきもの迄も、もう此時代よりも以前から、そろ〳〵變質して今日の所謂昔話になりかゝつて居たと迄は言へるのである。試みにこの宇治拾遺の「博打聟入の事」を、今日の言葉に引直して見ようと思ふが、是にはたゞ一つ、婚姻習俗の其後の改廢が、稍々我々の諒解を妨げて居ることを、豫め注意して置く必要がある。昔々、醜い顏をした一人の若い博打があつた。二人の親は如何すれば是に嫁を持たせることが出來ようかと案じて居た。ところが或長者の家に大切な娘があつて、男ぶりのよい聟を搜して居ることを此博打が聞きつけて、自分は天が下の顏よし、卽ち日本一の美男といふふれ込みで、とう〳〵其娘と契約をしてしまつた。何日かの後、晴れて舅姑と對面する日になつて、始めて醜い顏を人に見せなければならぬのに苦心をして、ばくち仲間の者に相談して策略を廻らした。當日は夜の內からその仲間の一人が、竊かに天井裏に上つて居て、大きな聲で「天が下の顏よし」と三度喚ぶ。さうすると聟が思はず知らず返事をする。家の者が驚いて聽いて居る前で、その天井裏の鬼が、此娘は三年も前からおれが領して居るのに、其方はどうして通ふぞと言ふ。そんな事は少しも知りませんでした。どうか御許し下さいと聟がいふ。憎いやつだ、命と顏とどちらが惜しいか。一つだけは取つて行くと鬼が言ふ。聟はわざと返答に困つて居ると、傍から嫁の親たちが命の方が大切だ。顏はしかたが無いといふので、其通り返事をする。さらばスフスフと鬼は唱へごとをして、づし〳〵と天井を步んで歸つて行く。あら〳〵と言つて聟は伏しまろぶ。人々寄り集まり脂燭をつけて始めて顏を見ると、さしも天が下の顏よしが、目と鼻と一處に押付けたやうなをかしな顏になつて居る。「たゞ命をこそといふべかりけれ」と言つて花聟は泣く。是も致し方が無いと、却つて親たちの方で慰めて、それから
  translation: '……ほうが、はるかに今の各地の「寝太郎」に近い。しかも、意図的に神話の写実的な感じを取り除いている点では、かえって長州厚狭の治水・開墾の話よりも先へ進んでいる。私はこの事実から、『宇治拾遺』という本ができた時代には、すでに説話を職業とする男性が存在したと想像している。盲人ではなかったかもしれないが、それはもちろん、今後見つかる補助的な証拠の多さによって判断すべきことである。もしこの想像が確かなら、神話は、神の子が現れる一つの話だけでなく、それとまったく関係のないほかのものまで、すでにこの時代より前から、少しずつ性質を変えて、今日いわゆる昔話と呼ぶものになり始めていた、とまではいえるのである。

    試しに、『宇治拾遺』のこの「博打婿入りの事」を、今の言葉に直してみようと思う。ただ一つ、結婚の習慣がその後変わったりなくなったりしたため、私たちには少し理解しにくい点があることを、あらかじめ注意しておく必要がある。

    昔々、顔の醜い若い博打打ちがいた。両親は、どうすればこの息子に嫁を持たせられるかと心配していた。ところが、ある長者の家に大切な娘がいて、男ぶりのよい婿を探していると聞きつけたこの博打打ちは、自分は「天が下の顔よし」、つまり日本一の美男子だと触れ込んで、とうとうその娘と夫婦になる約束をしてしまった。何日か後、正式に舅・姑と対面する日になると、初めて醜い顔を人に見せなければならないので困り、博打仲間に相談して計略を巡らした。当日は夜のうちから仲間の一人がひそかに天井裏へ上がり、大声で「天が下の顔よし」と三度呼んだ。すると婿が、思わず返事をする。家の者が驚いて聞いている前で、天井裏の鬼は「この娘は三年も前からおれのものなのに、お前はなぜ通ってくるのだ」という。婿は「そんなことは少しも知りませんでした。どうかお許しください」という。「憎いやつだ。命と顔と、どちらが惜しい。一つだけは取っていく」と鬼がいう。婿がわざと返答に困っていると、そばから嫁の親たちが「命のほうが大切だ。顔は仕方がない」というので、そのとおり返事をする。「それなら、スフスフ」と鬼は呪文を唱え、ずしずしと天井を歩いて帰っていく。婿は「あらあら」といってうつ伏せになり、転げ回る。人々が寄り集まり、脂燭に火をともして初めて顔を見ると、あれほどの「天が下の顔よし」が、目と鼻を一か所に押しつけたようなおかしな顔になっている。「いっそ命のほうを取ってくれといえばよかった」と花婿は泣く。これも仕方がない、と、かえって親たちのほうで慰め、それから……'

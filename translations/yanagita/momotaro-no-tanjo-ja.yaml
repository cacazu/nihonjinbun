- id: mmt-249-01
  scan: 249
  section: 和泉式部の足袋／三 鹿母夫人・四 南無藥師
  original: 'つて居るのを見ると、或はずつと古くから我邦にも、さういふ話し方が出來て居たものとも考へられる。

    鹿の子が和泉式部になつたどいふ肥前五町田の村などは、前にも述べて置いた如く、同時に蛇の申し兒の話のある村でもあつた。

    足袋の始といふことは後に輸入せられたのだが、其前に旣に異類誕生の話だけは有つたのである。

    三州奧設樂の山村で五人の神樂男の由來を語るのに、蓮華の蕾といふ經典の所說を利用したのも、同じく古人の氣働きを示して居る。

    要するに我々はたゞ口移しに、よその說話を受賣するやうなへぼな國民では無かつたのである。

    今昔物語は元々其編纂の目的が、珍らしい說話を存錄するといふよりも、寧ろ專門の說話業者に、種を供給するを主とした樣に思はれるが、それすらも尙印度の原型を取捨して、自由に興味の中心を此方の好む所に移した形跡は隨所に見られる。

    之を要するに上古以來、說話には話者の空想の活躍し得る部分が有つて、其部分には時々の補充と改訂とが要求せられ、それが職業化し技藝化すると共に、大規模に外來の資料を採擇する風も起り、しかも之を弟子門流の間に、踏襲する傾向も生じたのである。

    だから現在の說話の目に立つ特徴の一二に由つて、直ちにその全部の傳來を推論しようとするのは誤つて居る。

    十數世紀の間の民間文藝の展開過程と、說話そのものの起源とは歷史が別である。

    後者もその悠遠なる發端に於ては、或は傳播であり、所謂文化接觸の所產であつたかも知れぬ。

    但しそれを尋ぬる用意はまだ整うて居ないのである。

    何でもかでも說話といへば天竺から運ばれ、欽明天皇の十三年以前は、日本人は默つてたゞ顏を見合つて居る人民であつたか、若し然らずんば一切の古い話を忘れて、珍奇に走つたモダンボオイであつたかの如く、考へてしまふにはまだ少し早いのである。

    今日はこの源頭を究むるに先だつて、一應其中流以下に來り合したものを、見分けて行くべき時代である。


    四南無藥師

    私は最初海の神を少童と書いて居た思想が、日本の田舍では大よそいつの頃まで遺り傳はつて居たらうかを考へて見るために、桃太郞の桃や瓜子姫の瓜が流れ下つて來た川上の方に思ひを馳せて居た。

    斯邦の固有信仰の中には、優れた小子を神より賜はつて、それを大切に守り育てて下界の生活を、美しく又安らかにしようといふ希望の强かつたことだけは、變轉'
  translation: '――っているのを見ると、あるいはずっと古くから、日本にもそうした語り方ができていたのだとも考えられる。鹿の子が和泉式部になったという肥前五町田の村などは、前にも述べたように、同時に蛇の申し子の話がある村でもあった。足袋の始まりという話は、あとで輸入されたが、その前に、すでに異類として誕生する話だけはあったのである。三河の奥設楽の山村で、五人の神楽男の由来を語るのに、蓮華のつぼみという経典の話を利用したことも、同じく昔の人の機転を示している。つまり私たちは、ただ口移しでよその説話を受け売りするような、へぼな国民ではなかったのだ。『今昔物語』は、もともとの編纂目的が、珍しい説話を記録して残すことより、むしろ説話を専門に語る人々へ題材を提供することに重点を置いていたように思われる。しかし、それでさえ、インドの原型を取捨選択し、興味の中心を自由にこちらの好むところへ移した跡が、至るところに見られる。要するに、上古以来、説話には語り手の空想が活躍できる部分があり、その部分には時々の補充と改訂が求められた。それが職業となり、技芸となるにつれ、大規模に外来の資料を取り入れる風も起こり、しかも、それを弟子や同門の間で踏襲する傾向も生まれたのである。だから、現在の説話の目立つ特徴の一つ二つから、すぐその全体の伝来を推論しようとするのは誤っている。十数世紀にわたる民間文芸の発展過程と、説話そのものの起源とは、別々の歴史である。後者も、そのはるか遠い始まりでは、あるいは伝播であり、いわゆる文化接触の産物だったかもしれない。ただし、それを探る準備は、まだ整っていない。何でもかんでも、説話といえばインドから運ばれ、欽明天皇十三年以前の日本人は、黙って顔を見合わせているだけの人々だったのか、そうでなければ、古い話をすべて忘れ、珍奇なものへ走ったモダンボーイだったのか、とでも考えてしまうのは、まだ少し早い。今日は、その源流を究める前に、まず中流以下で合流してきたものを見分けるべき時代なのである。

    四　南無薬師

    私は初め、海の神を「少童」と書いていた思想が、日本の田舎では、おおよそいつまで残り伝わっていたのだろうかと考えるために、桃太郎の桃や瓜子姫の瓜が流れ下ってきた川上へと思いをはせていた。この国の固有の信仰の中に、優れた幼子を神から授かり、大切に守り育てて、下界の生活を美しく、また安らかにしようという強い願いがあったことだけは、変転――'
  notes:
  - 冒頭は248、末尾は250へ続く。
  - 『へぼな國民』『モダンボオイ』などは著者の評価・当時の表現を保持。

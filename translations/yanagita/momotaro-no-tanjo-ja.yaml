  section: 絵姿女房／髪長媛
  original: 'かれて留まること三日、家に還つて見ると旣に三年であつた。その折に鼓練の古曲を始め、

    尙色々の神祭の行法を教へられて來たと言つて居る。又同書に南風原間切與那覇村の人、與

    那久の濱に出でて髦一つを拾ふ。常に異なり。驚き恠しみて之を返さうとすると一神女來つ

    て受取り禮を述べ、伴なはれて龍宮に往つて淹留すること三月、家に還つて問へば旣に三十

    三代を經て居た。決して開くこと無く携へて又來れと教へられた紙包を强ひて開くと、中に

    は只白髪が有つたばかりで、それが飛び起つて身にひつつき、忽然として衰老の翁となつて

    死んだ云々。琉球國舊記卷六にも、此島の羽衣談として著名なる安謝の茗苅子、一日田を耕し

    歸り來り、泉に臨みて手足を洗はうとして、墮ち髪の長さ七八尺許なるもの水上に浮ぶを見

    る。驚き恠しんでよく見ると、天女が衣を脫ぎかけて沐浴して居たとあつて、後段は余吾湖

    や羽衣石山の古譚とも接近して居る。

    內地の多くの神社に傳はつて居たといふ七難の揃毛なども、曾ては亦是と類似の言ひ傳へ

    をもつて居たのかも知れぬ。七難の揃毛のことは早く江戶期の學者によつて散々にもて囃さ

    れ、今更其跡を迫ふのも智慧無しな話だが、尙其名稱のみは注意して見る必要がある。誰で

    も知つて居るのは、本朝國語や和漢三才圖會に出て居る箱根權現の什寶悉難が揃毛、下總石

    下村東光寺の七難の揃毛、江州竹生島の七難の毛は、塵塚物語に出て居るといひ、信州戶隱

    山に在るものは鬼女紅葉が毛と稱して、色紅黑く縮みて長さ五六尺ばかりあり、丸く輪とな

    して壺の中に納むと信濃奇勝錄にもある。閑窓瑣談には今の群馬縣多野郡上野村新羽に於て、

    慶長年間の洪水に長き三十三尋ある黑い毛が神流川を流れて來た。同村野栗權現の流した

    まふ陰毛の由、湯立の巫の告であつた故に、之を寶物となし六月十五日の祭禮に神輿と共に

    之を渡すと謂ひ、四神地名錄には江戶より近い葛飾郡新里村の毛長明神、もとの御神體は箱

    に入れた髢であつたのを、いつの頃かの別當が、かゝる不淨の物を神體とするは有るまじき

    ことだと言つて、出水の際に之を流し棄てた。其沼を今も毛長沼といふとある。ずつと離れ

    て德島縣三好郡加茂村猪内谷の下宮のことは、阿波國式社略考にも阿州奇事雜話にも出て居

    る。此社の神毛は麻桶に入れられて一筋あり、常はたゞ一筋なれども、神慮穩かならざる時

    には、其毛に二岐が出來て大いに延び、桶の蓋を押上げて夥しく餘つたとある。日向兒湯郡

    西米良村の米良神社にも、尙一つの髪長媛の例が近い頃まであつた。明治神社誌料の誌す所'
  translation: 'かれて三日間滞在し、家へ帰ってみると、すでに三年がたっていた。そのとき、鼓練の古い曲をはじめ、さまざまな神祭りの作法を教わってきたという。

    また、同じ本には、次のような話がある。南風原間切の与那覇村の人が、与那久の浜へ出て、髪を一束拾った。普通と違うものだったので、驚き不思議に思って返そうとすると、一人の神女が来て受け取り、礼を述べた。その女に連れられて竜宮へ行き、三か月滞在した。家へ帰って尋ねると、すでに三十三代が過ぎていた。「決して開けず、持ってまた来なさい」と教えられた紙包みを、それでも開けると、中にはただ白髪だけがあった。それが飛び上がって体にくっつき、たちまち衰えた老人となって死んだ、という。

    『琉球国旧記』巻六にも、この島の羽衣の話で有名な、安謝の茗苅子の話がある。ある日、田を耕して帰り、泉で手足を洗おうとすると、長さ七、八尺ほどの抜け毛が水に浮かんでいた。驚いてよく見ると、天女が衣を脱ぎ掛けて水浴びをしていたという。その後半は、余呉湖や羽衣石山の古い話にも近い。

    日本本土の多くの神社に伝わっていたという「七難の揃毛」なども、かつては、これに似た言い伝えを持っていたのかもしれない。七難の揃毛については、早くから江戸時代の学者が盛んに取り上げていて、今さらその跡を追うのも知恵のない話だが、なお、その名称だけには注意してみる必要がある。

    誰もが知っているのは、『本朝国語』や『和漢三才図会』に出ている、箱根権現の宝物「悉難が揃毛」である。下総の石下村の東光寺の「七難の揃毛」、近江の竹生島の「七難の毛」は、『塵塚物語』に出ているという。信州戸隠山にあるものは「鬼女紅葉が毛」と呼ばれ、赤黒く縮れて、長さが五、六尺ほどあり、丸く輪にして壺に収めていると、『信濃奇勝録』にもある。

    『閑窓瑣談』には、現在の群馬県多野郡上野村新羽で、慶長年間の洪水の際、長さ三十三尋の黒い毛が神流川を流れてきたとある。同じ村の野栗権現がお流しになった陰毛だと、湯立ての巫者が告げたので、これを宝物とし、六月十五日の祭礼に神輿と一緒に巡行させるという。

    『四神地名録』には、江戸に近い葛飾郡新里村の毛長明神について、もとの御神体は箱に入れた髢だったが、いつのころかの別当が、このような不浄な物を御神体とするのはあってはならないと言い、洪水の際に流し捨てた、とある。その沼を今も毛長沼と呼ぶという。

    遠く離れた徳島県三好郡加茂村猪内谷の下宮については、『阿波国式社略考』にも『阿州奇事雑話』にも出ている。この神社の神毛は一本で、麻桶に入れられている。普段はただ一本だが、神の心がおだやかでないときには二股に分かれて大いに伸び、桶のふたを押し上げ、なお大量にはみ出したという。

    日向の児湯郡西米良村の米良神社にも、近ごろまで、髪長媛のもう一つの例があった。『明治神社誌料』の記すところ'
  notes:
  - 冒頭はscan195から、末尾はscan197に続く。
  - 「鼓練」の字形は原画像で確認したが、傍らの小さな振り仮名には判読上の留保があるため本文へ転記していない。
  - 原印刷の表記は「茗苅子」。前稿の推測補読「銘苅子」は撤回した。
  - 「本朝國語」を確認し、OCR「閑窓項議」は拡大画像により「閑窓瑣談」に訂正した。
  - 「髢」は添え髪。「陰毛」は原文の表現を省かず訳した。

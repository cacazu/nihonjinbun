units:
- id: mmt-003-01
  scan: 3
  section: 自序
  original: 今からちやうど十年前の、春の或日の明るい午前に、私はフィレンツェの畫廊を行き廻つて、あの有名なボティチェリの、海の姫神の繪の前に立つて居た。さうして何れの時か我が日の本の故國に於ても、『桃太郞の誕生』が新たなる一つの問題として回顧せられるであらうことを考へて、獨り快い眞晝の夢を見たのであつた。それが僅かに十年の後に、斯樣な形を以て世に現はれようなどといふことは、私にも實に意外であつたが、是には豫期し得なかつた二つの理由がある。其一つは各地の忠實なる採集によつて、急に多くの珍らしい昔話が、全國の隅々から報告せられて來たことである。前驅者たる佐々木喜善君、その他二三の同志の功績は、永く記念せらるべきものであつた。第二にはこの興味多き比較研究の事業が、爾來何人にも試みられんとする容子が無く、再び折角の資料を埋沒に付すべき懸念のあつたことである。大抵の說話集は、それ程にも流布の限られたるものであつた。特にこの方面に向つての注意を喚起する者が無いと、久しからずして
  translation: 'ちょうど十年前の春のある明るい午前、私はフィレンツェの美術館を歩き回り、あの有名なボッティチェリの海の女神の絵の前に立っていた。そして、いつか私たちの故国日本でも、「桃太郎の誕生」が新しい一つの問題として振り返られる時が来るだろうと思い、一人で心地よい白昼の夢を見ていた。

    それがわずか十年後に、このような形で世に出るとは、私自身にもまったく意外だった。そこには予想していなかった二つの理由がある。一つは、各地の熱心で確かな採集によって、珍しい昔話が全国の隅々から急に数多く報告されるようになったことだ。先駆者である佐々木喜善君や、ほかの二、三の同志の功績は、長く記念されるべきものである。第二に、この興味深い比較研究の仕事を、その後だれも手がけようとする様子がなく、せっかくの資料が再び埋もれてしまう心配があったことだ。たいていの説話集は、それほど限られた範囲でしか流通していなかった。この方面に特に注意を向けさせる人がいなければ、そう遠くないうちに、'
  notes:
  - 前後のコマにまたがる文は原資料の位置で区切って収録。
  - 原画像でOCR重複・順序を補正。「ボティチェリ」は訳では一般的な表記「ボッティチェリ」とした。
  sequence: 1
- id: mmt-004-01
  scan: 4
  section: 自序
  original: 所謂珍書道樂の手に鎖藏せられてしまふかも知れなかつたのである。私は境涯も年齡も、共にこの仕事に任ずるに適しては居ないが、たゞ學問の未來の爲に、坐視して居ることが出來なかつただけである。もしも幸ひにして別に其人が有つたならば、民間說話の二千年間の成長變化を攷察すると同時に、時の文化學者の受賣的態度を批判する樣な、そんな性急な一石二鳥は企てなかつたらう。この二つは共に現代の忘れられたる問題に相異ないが、それを併せて論じなければならぬ必要は少しも無い。寧ろ順序を追うて二度にした方が感じは遙かに良かつたのである。しかし私には此次の仕事が待ち兼ねて居る。是より以上の時と力とを、昔話の爲に割くことの出來ぬのを遺憾とするばかりである。今一つ不本意なことは、本篇各章の發表が時を隔てて居る爲に、其うちに若干の變說改論があつて、完全に是を現在の意見に統一し得なかつた點である。例へば木を獻じて水の神を悅ばしめた理由を、始めには偶然であらうといひ、後には深い意味があるらしく考へ、又山路の物語の永く傳はつた原因を、前には舞の手の面白さであらうといひ、次には笛の曲の力に歸して居る。勿論今信じて居るのは新らしい方であるが、前者も亦一說として存する迄はよからう。私は最初より人を誤りに導くやうな斷定はして居ない。又是ばかりの研究によつて、直ちに輕信するやうな讀者も少ないことと思ふ。將來際限も無く成長して行かねばならぬ學問である。この小さな一册子の全然無用となるやうな時代が、假に到達するとしてもそれも亦私には喜ばしい。大海に流れ入る日をほと遠み山下清水いは走るらん昭和七年十一月
  translation: 'いわゆる珍本収集を趣味にする人々の手にしまい込まれ、読めなくなってしまうかもしれなかった。私の境遇も年齢も、この仕事を引き受けるのに向いてはいない。ただ、学問の未来のために、何もせず見ていることができなかっただけである。

    もし幸いにも、ほかに適任者がいたなら、民間説話の二千年にわたる成長と変化を考察すると同時に、当時の文化研究者たちの受け売り的な態度を批判するような、性急な一石二鳥は狙わなかっただろう。この二つはいずれも現代に忘れられた問題に違いないが、一緒に論じる必要はまったくない。むしろ順序を踏んで二度に分けたほうが、はるかによかった。しかし、私には次の仕事が待ち構えている。これ以上の時間と力を昔話に割けないことを、ただ残念に思うばかりだ。

    もう一つ心残りなのは、本書の各章の発表時期が離れているため、その間に見解の変更がいくらかあり、それらを現在の意見に完全には統一できなかったことである。たとえば木を献じて水の神を喜ばせた理由について、初めは偶然だろうと言い、後には深い意味がありそうだと考えた。また、山路の物語が長く伝わった理由を、前には舞の所作の面白さに求め、次には笛の曲の力に求めている。もちろん、今信じているのは後の考えだが、前のものも一つの説として残しておいてよいだろう。私は最初から、人を誤った方向へ導くような断定はしていない。また、これだけの研究を読んで、すぐ無批判に信じ込む読者も少ないと思う。これは、将来にわたって限りなく発展していかなければならない学問である。この小さな一冊がまったく不要になる時代が来たとしても、それも私には喜ばしい。

    大海へ流れ入る日がまだ遠いので、山のふもとの清水は、岩の上を勢いよく流れているのだろう。

    昭和七年十一月（1932年11月）'
  notes:
  - 前後のコマにまたがる文は原資料の位置で区切って収録。
  - 末尾の和歌を現代語訳。「ほと遠み」は時の隔たりが大きいことと解した。
  sequence: 2
- id: mmt-005-01
  scan: 5
  section: 改版に際して
  original: 『桃太郞の誕生』が世に出てから、ちやうど又一昔、多くの寶の島は引寄せられ、學問の地平線は晴々と遠く展がつて來た。人を一段と高い岡の頂上に導いて、靜かに四方を望ましめることが出來たならば、どれほどか悅ばしく又樂しからうと、私なども考へては居る。ただ奈何にせん我々の昔話研究は、今も依然として麓の野を耕すのみで、たまさかに腰を伸し手の土を拂ひ、かの大空の白い雲を、指ざすほどの餘裕さへもたずに居る。さうして一方には昔話の背後に、何か埋もれたる深いものがあるやうに感ずる者は、もう著しく多くなつて居るのである。偶然なる仕合せかも知れぬが、この十年の間に昔話の採集は進んだ。是まで一顧もせられなかつた地方の隅々から、千年を持ち傳へた家々の語りごとが發見せられ、始めて記錄の形
  translation: '『桃太郎の誕生』が世に出てから、ちょうどまた十年が過ぎた。数多くの宝の島が身近になり、学問の地平線は晴れやかに遠くまで広がってきた。人々を一段高い丘の頂へ導き、静かに四方を見渡してもらえるなら、どれほど喜ばしく楽しいだろうかと、私も考えている。だが残念ながら、私たちの昔話研究は、今も相変わらずふもとの野を耕しているばかりで、ときどき腰を伸ばし、手の土を払い、あの大空の白い雲を指さすほどの余裕さえない。その一方で、昔話の背後には何か埋もれた深いものがあるように感じる人は、すでに著しく増えている。

    偶然の幸運かもしれないが、この十年間で昔話の採集は進んだ。これまで一度も目を向けられなかった地方の隅々から、千年にわたって受け継がれてきた家々の語りが発見され、初めて記録という形に'
  notes:
  - 前後のコマにまたがる文は原資料の位置で区切って収録。
  sequence: 3
- id: mmt-006-01
  scan: 6
  section: 改版に際して
  original: になつて公けの利用に供せられて居る。是が消えて行くものの全部又は大部分を、取留めたことになるとも思はれぬが、とにかくに是から後は、更に大きな速力を以て忘れられてしまふ所であつた。それを一國文運の輝かしい轉回期に於て、辛うじて保存することが出來たのは有難いことだと思つてゐる。十年前にも私が言つたやうに、『桃太郞の誕生』は少し出方が早かつたのである。是が其後の新資料に依つて、どの程度にまで確認せられ、又は反證を擧げて斥けられるか。實は甚だ危ないものであつた。しかしこの學問の將來の展開の爲には、私の失敗の如きは小さな犧牲である。それが怖ろしいやうでは、とてもこの未知世界へは入つて行けない。だから今私たちは、出來るだけこの新たなる採集を促進し、又之を整理し公開して、寧ろ自分の前說の誤りが、速かに露顯せんことを期して居るのである。些々たる訂正や追加を以て、辯護と妥協との餘地を作るには、私の假定意見はあまりにも大膽なものであつた。ちやうど今後の研究者たちの爲に、手頃の稽古臺を供する意味に於て、今暫く原の形のまゝで殘して置いて見るのがよいと思ふ。珊瑚海を取卷く大小の島々には、文化のさま〴〵の階段に屬する土民が住み、その或者は今も鬼ケ島である。しかも彼等の中にすらも、やはり昔話は有るのである。それと我々の珠玉の如く、守りかゝへて居た昔話との間に、果して悠久の昔から、何等の相交渉するものが無かつたと言へるかどうか。是は世界の謎であり、しかも我々日本人ならば、いつかは解き得べき謎でもある。私は幸ひにしてこの島々の新たなる資料が、ほゞ公共の財產となるの日を迎へ得るならば、もう一度この舊著を讀み返して、改めて是が保存に値するか否かを決したいと思つて居る。人が家々の祖神の神話として、たしかに信じて居た時代が曾てはあつたといふ點ならば、寧ろ未開の民の間にその痕を見つけやすいであらう。それに爭ふべからざる兩者の類似がもし有りとすれば、記錄こそは少しも無いけれども、一度は共に住んで敎へ合つたことがあるか、さうで無ければ人間の自然の性として、いつかは同じ樣な空想に遊ぶ階段を經、しかもその思ひ出を永く失はないといふ癖を共通にして居るのである。あまり多くの參考書は見て居ないが、此書に說くが如き昔話の起原論、是と中間の成長發達とを、二つに引離して見ようとする方法論は、まだ諸外國の通說とはなつて居ないやうである。さうしてやゝ大雜把な私の檢討では、まだ明白に私などの假定を、覆へすやうな資料は發見せら
  translation: 'なって、広く利用できるようになっている。これで消えつつあるもののすべて、あるいは大部分をとどめられたとは思わない。それでも、これから先はさらに急速に忘れ去られてしまうところだった。それを一国の文化が大きく転換する輝かしい時期に、どうにか保存できたことを、ありがたく思っている。十年前にも言ったように、『桃太郎の誕生』は、世に出るのが少し早すぎた。その後の新しい資料によって、どの程度まで裏づけられるのか、あるいは反証を示されて退けられるのか、実際にはきわめて危うかった。しかし、この学問が将来発展するためなら、私の失敗など小さな犠牲にすぎない。それを恐れていては、この未知の世界へ到底入れない。だから今、私たちはできるだけ新たな採集を進め、それを整理して公開し、むしろ自分の以前の説の誤りが早く明らかになることを期待している。わずかな訂正や追加によって弁明や妥協の余地を作るには、私の仮説はあまりに大胆だった。これからの研究者に適当な練習材料を提供するという意味でも、しばらくは元の形のまま残しておくのがよいと思う。

    珊瑚海を取り巻く大小の島々には、文化のさまざまな段階に属する先住の人々が暮らし、そのうちのある島は今なお「鬼ヶ島」である。しかも彼らの間にも、やはり昔話は存在する。それらと、私たちが宝石のように大切に守ってきた昔話との間に、はるかな昔から何の交渉もなかったと言い切れるだろうか。これは世界の謎であり、しかも私たち日本人なら、いつか解けるはずの謎でもある。幸いにして、これらの島々の新しい資料がおおむね共有の財産となる日を迎えられたら、私はもう一度この旧著を読み返し、保存する価値があるかどうかを改めて判断したい。かつて人々が家々の祖先神の神話として、確かに信じていた時代があったという点については、むしろ著者のいう「未開」の人々の間に、その痕跡を見つけやすいだろう。さらに、両者の間に否定できない類似があるなら、記録はまったくなくても、かつて共に暮らして教え合ったことがあるか、そうでなければ、人間に自然に備わる性質として、いつか同じような空想をする段階を経て、その記憶を長く失わない傾向を共有しているということになる。参考書はあまり多く読んでいないが、本書で述べるように、昔話の起源の問題と、その後の成長・発達の問題を二つに分けて考えようとする方法は、まだ外国でも通説になっていないようだ。そして、やや大まかな私の検討の範囲では、私たちの仮説を明確に覆すような資料は、まだ発見されて'
  notes:
  - 前後のコマにまたがる文は原資料の位置で区切って収録。
  - 「土民」「未開」や文化の「階段」、珊瑚海の島々を「鬼ケ島」とする表現は、1942年当時の著者の価値観・歴史的語法であり、訳者の認識ではない。原文を保存し、訳では文脈を明示した。
  sequence: 4
- id: mmt-007-01
  scan: 7
  section: 改版に際して
  original: れて居ない。事によるとこの豫想は當つて居るのかも知れない。さういふ樂觀も少しは手傳つて、この一つの舊作に對する著者の愛着は深いのである。昭和十七年六月柳田國男
  translation: 'いない。ひょっとすると、この予想は当たっているのかもしれない。そうした楽観も少し手伝って、著者はこの旧作に深い愛着を抱いている。

    昭和十七年六月（1942年6月）　柳田國男'
  notes:
  - 前後のコマにまたがる文は原資料の位置で区切って収録。
  sequence: 5
- id: mmt-012-01
  scan: 12
  section: 桃太郎の誕生／一 知られざる日本
  original: '一 知られざる日本

    是は最初はたゞ自分一人の樂しみの爲に、手を著けて見た研究であるけれども、今に及んでは誰か聽いて下さる方を搜してあるく必要を感ずる。桃太郞の鬼が島征伐などといふ昔話は、旣に御互ひの家の子供すらも、其管理を辭退する程のたわいも無いものではあるが、尙それが獨り日本現代の一つの問題であるのみで無く、實際は、やはり亦世界開闢以來の忘るべからざる事件として、考察せらるべきものであつた。しかも壯年の學者が全力を之に傾けてさへも尙五年や十年では整理しきれぬほどの材料が我々の邦には保存せられて居た。それが此頃になつて漸く明かになつて來たのである。此研究の後半分だけは、是非とも志を同じうする何人かに引繼いで置く必要がある。私が强ひてこの不完全なる研究を發表するのも、本願は是より他にはない。我々の昔話の中でも、特に外國に於ける斯道の學者を感動せしむべきものは、英國でいふシンドレラ、グリム童話の灰かつぎ姫、日本で糠福米福などと呼んで居る物語であつた。是が我邦に入つて來てから、如何に短くても千年は超えて居るだらうと思ふが、話は其間に誠に僅かばかりしか變化を受けて居ない。蜜柑の皮を遠くから妹に投げ付けたといふやうな、些細な點までが尙殘つて居る。さうして北は靑森縣の淋しい村から、南は壹岐島の海端にまで、數多く分布し且つ今も活きて居る。英國のシンドレラ研究者ミス·コックスが、若し此事實を知つて居たならば、彼女の記念碑的名著も必ず若干は其體裁を改めて居たことと思はれる。故廚川白村君などは、日本に彼女の目の屆かぬ一隅があることに心付いて、柳田の如きはなぜ早く之を說かうとせぬかといふことを、曾て大阪朝日紙上で注意せられたこともあつたが、實は其頃まではまだ私なども、さう大きな問題とも思つて居なかつたのである。それに國內の蒐集が、一向に進んでは居なかつた。今とても決して豐富とは言はれぬが、兎に'
  translation: '一　知られざる日本

    これは最初、ただ自分一人の楽しみのために手をつけてみた研究だった。しかし今では、誰か聞いてくださる人を探して歩く必要を感じている。桃太郎の鬼が島征伐などという昔話は、もう私たちの家の子どもさえ、引き受けて守り伝えるのを辞退するほどたわいないものではある。それでも、これは現代の日本だけの問題ではなく、実は世界の始まり以来の、忘れてはならない出来事として考察すべきものでもあった。しかも、壮年の学者が全力を傾けても、五年や十年では整理しきれないほどの資料が日本には保存されていた。そのことが、ようやく近ごろ明らかになってきたのである。この研究の後半だけは、ぜひとも志を同じくする何人かに引き継いでおく必要がある。私があえてこの不完全な研究を発表するのも、本当の願いはそれ以外にない。

    日本の昔話のうち、特に外国のこの分野の学者を感動させるはずのものは、イギリスでいうシンデレラ、グリム童話の「灰かつぎ姫」、日本で「糠福米福」などと呼んでいる物語だった。これが日本に入ってきてから、どんなに短く見積もっても千年以上はたっていると思うが、話はその間にほんのわずかしか変化していない。ミカンの皮を遠くから妹に投げつけたというような細かな点まで、今も残っている。そして、北は青森県の寂しい村から、南は壱岐島の海辺まで、数多く分布し、今も生きている。イギリスのシンデレラ研究者ミス・コックスがこの事実を知っていたなら、彼女の記念碑的な名著も、きっと多少はその構成を変えていただろう。故・厨川白村君などは、日本に彼女の目の届かない一角があると気づき、「柳田などは、なぜ早くこれを説明しようとしないのか」と、かつて大阪朝日新聞で指摘されたこともあった。だが実際には、そのころまでは私なども、さほど大きな問題とは思っていなかった。それに国内での収集が、いっこうに進んでいなかった。今でも決して豊富とはいえないが、とに……'

  section: 海神少童
  original: '呼ばれ、話の運びにも童話らしい點は至つて少ないが、神童出現の奇瑞と、善い爺が富貴に

    なつたといふ點では、旣に他の多くの申し兒說話と一致して居るのみならず、其前後の細々

    とした筋に於ても、必ずしも話者の豫想した如く孤立のものでは無かつたのである。出來る

    だけ手短かに大要を抄すると、

    昔この里に一人の老翁があつて、每日山に行つて枯枝を拾ひ集め、それを關の町へ持出

    して賣るのを渡世にして居た。

    或日其薪が賣れないので、町の中を流れる川の橋の上に休んで居たが、何と思つたか背

    の薪を取卸して、龍神を念じつゝそれを橋の下の淵に沈める。さうすると何ともいへな

    い好い心持になつた。

    その時に水の中から、美しい上臈が小さい、本當に小さい一人の兒を抱いて現はれて來

    た。「爺よ、お前が正直で每日よく働くのを、龍神は大へんに喜んで居られ、其褒美に

    此子供を御預けなされる。この方の名はハナタレ小僧樣と云ひ、お前の願ひ事は何でも

    かなへて下さるが、たゞ每日三度づつ必ずエビナマスを供へることを忘れぬやうに」と

    言つて、美女は淵の底へ歸つて行つた。

    爺は大喜びで其ハナタレ小僧樣を抱いて還り、それを神棚の側に坐らせて、每日每日海

    老の膾を上げることを忘れなかつた。

    それからといふものは米でも金でも、どうかお授け下さいといふ度に、ハナタレ小僧樣

    がフーンと鼻をかむ音をさせると、欲しいと思ふだけ爺の前に現はれた。もう山へ行く

    に及ばぬことになつた。家も大きなきれいなのを出して下さいといふと、忽ちフーンと

    音させて驚く程立派な家が出來た。倉が幾つも建つて米や寶で一杯になり、僅かな間に

    爺は長者になつた。

    爺の仕事は每日町へ下りて行つて、膾にする海老を買ふことだけであつたが、それがし

    まひには面倒になつて來て、或日ハナタレ小僧樣を神棚の側から下して、「もうあなたに

    は何も御願ひする事がありませんから、どうか龍宮へ御還り下さい。さうして龍神樣へ

    よろしく御傳へ下さい」といつた。さうすると小僧樣は默つて家の外へ出て行つた。暫

    くして家の前でスーと鼻を吸ふ聲が聞えたかと思ふと、忽ち立派な家も倉も無くなつて、'
  translation: '呼ばれていて、話の進み方にも童話らしいところはごく少ない。しかし、神童が現れるという不思議なめでたい出来事と、善良なおじいさんが豊かになったという点では、すでにほかの多くの「申し子」の物語と一致している。それだけでなく、前後の細かな筋についても、語り手が考えていたような独立した話では、必ずしもなかった。できるだけ短くあらすじを抜き書きすると、こうなる。

    昔、この里に一人のおじいさんがいて、毎日山に行って枯れ枝を拾い集め、それを関の町へ運んで売り、生計を立てていた。

    ある日、その薪が売れないので、町を流れる川の橋の上で休んでいたが、どう思ったのか背中の薪を下ろし、竜神に祈りながら橋の下の淵に沈めた。すると、何ともいえないよい気持ちになった。

    そのとき、水の中から美しい身分の高い女性が、小さい、本当に小さい子供を一人抱いて現れた。「おじいさん、お前が正直で毎日よく働くのを、竜神はたいそうお喜びになり、その褒美としてこの子をお預けになります。この方のお名前はハナタレ小僧様といい、お前の願い事は何でもかなえてくださいます。ただし、毎日三度ずつ必ずエビナマスをお供えするのを忘れないように」と言って、その美女は淵の底へ帰っていった。

    おじいさんは大喜びでハナタレ小僧様を抱いて帰り、神棚のそばに座らせて、毎日毎日、海老のなますを差し上げるのを忘れなかった。

    それ以来、米でも金でも、どうかお授けくださいと言うたびに、ハナタレ小僧様がフーンと鼻をかむ音を立てると、欲しいだけのものがおじいさんの前に現れた。もう山へ行く必要はなくなった。家も大きなきれいなのを出してくださいと言うと、たちまちフーンと音をさせて、驚くほど立派な家ができた。倉がいくつも建って米や宝でいっぱいになり、わずかな間におじいさんは長者になった。

    おじいさんの仕事は、毎日町へ下りていって、なますにする海老を買うことだけだった。しかし、それもやがて面倒になってきて、ある日、ハナタレ小僧様を神棚のそばから下ろし、「もうあなたには何もお願いすることがありませんから、どうか竜宮へお帰りください。そして竜神様によろしくお伝えください」と言った。すると小僧様は黙って家の外へ出ていった。しばらくして家の前でスーッと鼻をすする音が聞こえたかと思うと、たちまち立派な家も倉もなくなり、'

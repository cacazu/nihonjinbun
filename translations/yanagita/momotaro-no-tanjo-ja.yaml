  section: 瓜子織姫／諸國の瓜子姫
  original: 瓜子姫子ア乘さる駕籠さあまのしやぐア乘さたホホーホケキヨと鶯が啼き續けた。其鶯は瓜子姫子の魂がなつたのであつた。それでアマノシヤグの正體は見破られてしまつた。(此話は毛馬內の町の一女性の語り傳へた話である。同じ鹿角郡でも南部の宮川村などに行はれて居るものは、是と比べると二つ三つ異なつた點がある。第一に樹の梢から啼いて教へたのが、鶯では無くて烏であつた。次にヤマノサグの正體が露はれたのも、其鳥が教へたばかりでは無かつた。あまり汚ない顏をして居るので、瓜子姫子面洗へと云つて擦ると、被つて居た面の皮がごそもそとした。それから小便をさせようとして尻をはぐつたら、ヤマノサグの尾つぽがだらりと出て居て、化けが現はれてとう〳〵殺されたなどと謂つて居る。瓜の中から生れたといふことも此方にはもう落ちて居る。)
  translation: '瓜子姫子が乗る駕籠に

    あまのしゃぐが乗った

    ホホーホケキヨ

    と、鶯が鳴き続けた。その鶯は、瓜子姫子の魂がなったものだった。こうして、アマノシャグの正体は見破られてしまった。

    （この話は毛馬内の町の一人の女性が語り伝えたものである。同じ鹿角郡でも、南部の宮川村などにある話は、これと比べて二、三の相違がある。第一に、木の梢から鳴いて教えたのは鶯ではなく烏だった。次に、ヤマノサグの正体が露見したのも、その鳥が教えたからだけではなかった。顔があまり汚いので、「瓜子姫子、顔を洗いなさい」と言ってこすると、かぶっていた顔の皮が、もぞもぞと動いた。それから小便をさせようとして尻をまくると、ヤマノサグの尻尾がだらりと出ており、化けていたことがわかって、とうとう殺された、などという。瓜の中から生まれたという部分も、こちらではすでに抜け落ちている。）'

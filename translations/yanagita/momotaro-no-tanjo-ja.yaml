  - 次のスキャンへ続く
  sequence: 110
- id: mmt-106-01
  scan: 106
  section: 瓜子織姫／天之探女
  original: 'には受取れる。佐渡では役の行者と飛驒の匠とが、その一夜の工事を競爭して居た際に、や

    はりアマノジヤクの鶏の聲に騙されて、行者は國府川を鋤の柄三たけ掘り殘し、匠は藥師

    堂の戶を一枚作り殘して中止してしまつたと謂つて居る。越後では石地の羅石明神が、その

    佐渡の島へ岩橋を架けようとして、是も眷屬のアマノジヤク、一名を山彥といふ惰け者が、

    鷄の鳴く眞似をしたのに欺かれて、未完成のまゝに姿を隱されたと謂つて居る。紀州の南志

    野の松尾池なども、行基菩薩が一夜のうちに掘り上げようとしたのを、アマノジヤクが碾臼

    の音を眞似したばかりに、もう夜が明けたのかと思つて、其仕事を斷念して立退いてしまつ

    た。それ故に今も「志野の粉はたき」と謂つて、臼を使つて粉をひくと村の人に祟があると傳

    へられた。是等は何れも傳說の目的物が先づ在つて、之を說明する爲に人の憎むアマノジヤ

    クが、引張つて來られたものとしか考へられない。さうするとかの難波高津の石船の歌など

    も、間接には爰に面白い一つの傳說が、曾ては有つたといふことを想像させるし、更に進ん

    では紀記の共に採錄した天稚彥の物語の如きも、あの頃早既に口遊として流傳して居たとい

    ふことを推測せしめるので、つまり人生の理想の幸福の爲には、アマノジヤクなどは居ない

    方がよかつたのだが、退いてこの現實の不如意を甘なひ又樂しまうとするには、彼も亦缺く

    べからざる大切な役者であつたのである。

    瓜子姫說話のアマノジヤクが、或時は飛んで井の上の樹にとまつて鳴き、又ある時は尻尾

    を機臺の下へだらりと垂らして居たといふのみか、土地によつてはそれが山姥とも狼ともな

    つて居るかと思ふと、又一方には隣の家の意地わる娘と謂つた處があるなど、他の話の大筋

    が全國を一貫して居るに對して、特に此部分だけが幾らでも變化して來たのは、意味のある

    ことでなければならぬ。個々の語り手の自由なる空想は、信じない者の聽くことを許さなか

    つた前代の說話に於ても、尙或點に限つては夙くから容認せられ、どうせ亂暴であり世法の

    無視であつたアマノジヤクの出處進退の如きは、亦ちやうど勝手に之を說き立てて、大衆の

    印象を新たにするに適して居たものかと私は思ふ。灰蒔き花咲かせ屁ひり爺等の、眞似をし

    そこなつて尻を切られる役がこれと似て居る。それから今一つは親に不孝な鳥の話、親が山

    へといふと必ず川へ行くので、わざと墓場を川原に作れと言うて死ぬと、それたゞ一つだけ

    は言ふことを聽いた。其子が鳥になつて雨の降るたびに、水が出て墓が流れはせぬかと心配'
  translation: 'には思われる。佐渡では、役の行者と飛騨の匠が一夜の工事を競ったとき、やはりアマノジャクの鶏の声にだまされ、行者は国府川を鋤の柄三本分掘り残し、匠は薬師堂の戸を一枚作り残して、作業をやめてしまったという。越後では、石地の羅石明神が佐渡島へ岩の橋を架けようとした。これも、家来のアマノジャク、別名を山彦という怠け者が、鶏の鳴きまねをしたのにだまされ、未完成のまま姿を隠したという。紀州の南志野の松尾池なども、行基菩薩が一晩のうちに掘り上げようとしたのに、アマノジャクがひき臼の音をまねたため、もう夜が明けたのかと思い、仕事を断念して去ってしまった。そのため、今も「志野の粉はたき」といって、臼を使って粉をひくと、村人にたたりがあると伝えられた。

    これらはどれも、まず伝説の対象になるものが存在し、それを説明するために、人に憎まれるアマノジャクが引っ張り出されたとしか考えられない。そうすると、あの難波高津の石船の歌なども、そこにかつて面白い伝説が一つあったことを、間接的に想像させる。さらに、『日本書紀』『古事記』がともに採り入れた天稚彦の物語なども、その頃すでに語り楽しむものとして広まっていたことを推測させる。つまり、人生の理想的な幸福のためには、アマノジャクなどはいない方がよかった。しかし一歩退き、思いどおりにならない現実を受け入れ、また楽しもうとするためには、彼も欠かせない大切な役者だったのである。

    瓜子姫の話のアマノジャクは、あるときは飛んで井戸の上の木に止まって鳴き、あるときは機の台の下へ尻尾をだらりと垂らしている。そればかりか、土地によって山姥になったり狼になったりするかと思うと、一方では隣の家の意地悪な娘だとする土地もある。ほかの話の大筋が全国を通じて一貫しているのに、特にこの部分だけがいくらでも変わったのは、意味のあることに違いない。信じない者には聞くことを許さなかった昔の説話でも、個々の語り手の自由な空想は、ある点に限っては早くから認められていた。どうせ乱暴で世間の決まりを無視するアマノジャクの振る舞いなどは、自由に語り立てて聞き手の印象を新しくするのに、ちょうどよかったのではないかと私は思う。灰をまいて花を咲かせる話や屁ひり爺の話などで、まねに失敗して尻を切られる役がこれに似ている。

    もう一つは、親不孝な鳥の話だ。親が山へ行けと言えば必ず川へ行くので、親はわざと「墓は川原に作れ」と言って死ぬと、それだけは言うことを聞いた。その子が鳥になり、雨の降るたびに、水が出て墓が流されないかと心配'
  notes:
  - 冒頭はscan105、末尾はscan107へ続く。
  - 原文の「口遊」は、口に出して語り楽しむこと。役の行者・行基菩薩は伝説中の人物として記す。
  - 前のスキャンからの続き
  - 次のスキャンへ続く
  sequence: 111
- id: mmt-107-01
  scan: 107
  section: 瓜子織姫／天之探女・黃金の瓜
  original: 'して啼くといふのだが、話の有名な割に其鳥だけが國々で違つて居る。たとへば能登では

    鳩、私の故鄕では鳶、又は之を梟と謂つて居る土地も有るばかりか(南方隨筆三三九頁)、加賀

    と上總と九州以南の村里では、それを雨蛙の前生譚として傳へて居るのである。越後の西

    蒲原でも雨蛙をアマンギヤクといふが、ギヤクは鳴聲から出た言葉だらうと解せられて、ど

    うやら此話はもう絕えて居るやうに見える。併し九州では廣く雨蛙をアマガクと謂ひ、上總

    の夷隅郡なども雨蛙をアマンジヤといふ方言があつて、何れも親不孝が墓を水邊に作つた話

    を伴うて居るのを見ると、多分は兩者語音の近いのが元で、次第に斯う變つて來たのも新ら

    しいことで無かつた。然らばそれを鳶鳩梟などの逸話としたのは、更に第二次の改造であつ

    たかといふと、私は必ずしもさうは思つて居ない。全體に周圍の生物の特徵に注意して、之

    を興深く說明しようとしたのが、最も古風なる平民の文藝であつた。殊に鳥類の說話は日本

    では流行つて居る。だから是なども主人公の名前とは關係無しに、別に一種の「何故話」とし

    て發達したので、つまりは我々の天探女譚が、本來非常に成長し易い傳承であつたことを、

    意味する迄であつたのかと思ふ。豐後傳說集(一一四頁)を見ると、九州のアマガク話が若し

    最初から雨蛙であつたならば、發生し得なかつた傳說が殘つて居る。高田の町では不孝なる

    娘が、たつた一度だけ母の言ふことを聽いて、墓を川の中に作つて大水で流してしまつた。

    それから或日八幡樣へ詣る道で、天から降つて來た石の爲に押潰されて、死んで自分も石に

    化したと謂つて、鳥居の傍なる石燈籠の下に、あたかも子供が押されたやうな形をした平た

    い石が今も在るといふことである。是が毘沙門や靑面金剛の、足下に踏まへてござるアマノ

    ジヤクと、同じ系統の口碑であることは言ふまでもあるまい。

    私はたゞ是ほど迄變化して來

    た上代の天之探女が、尙依然として女性の要件を失はずに居たことを、驚き又注意せずには

    居られないのである。

    黃金の瓜

    (一)むかし或殿樣の奧方が、あやまつておならをなされた。殿樣は大へん怒つて、

    其奥

    方をうつろ舟といふ箱の舟の中へ入れて海に流された。流れ〳〵て其うつろ舟は或島に流れ'
  translation: 'して鳴くというのだが、話が有名なわりに、鳥の種類だけは土地ごとに違う。たとえば能登では鳩、私の故郷では鳶であり、梟と呼ぶ土地もある（『南方随筆』三三九ページ）。それだけでなく、加賀・上総・九州以南の村々では、雨蛙の前世の物語として伝えている。越後の西蒲原でも雨蛙をアマンギャクというが、ギャクは鳴き声から出た言葉だろうと解釈され、どうやらこの話はもう絶えているらしい。しかし九州では広く雨蛙をアマガクといい、上総の夷隅郡などにも、雨蛙をアマンジャという方言がある。どちらにも、親不孝な子が水辺に墓を作ったという話が伴うのを見ると、おそらく両者の音が似ていたことから、しだいにこのように変わってきたのも、最近のことではなかったのだろう。

    では、これを鳶・鳩・梟などの逸話にしたのは、さらにその後の二次的な改変だったのかというと、私は必ずしもそうは考えていない。そもそも、身の回りの生き物の特徴に注目し、面白く説明しようとしたものこそ、最も古い形の庶民の文芸だった。特に日本では鳥の説話が盛んである。だからこれも、主人公の名前とは無関係に、別に一種の「なぜ話」として発達したのであり、つまり私たちの天探女の話が、もともと非常に成長しやすい伝承だったことを意味するにとどまるのではないかと思う。

    『豊後伝説集』（一一四ページ）を見ると、九州のアマガクの話が最初から雨蛙の話だったなら、生まれえなかった伝説が残っている。高田の町では、親不孝な娘がたった一度だけ母の言葉に従い、墓を川の中に作って、大水で流してしまった。その後ある日、八幡様へ参る途中、天から降ってきた石に押しつぶされて死に、自分も石になったという。鳥居のそばの石灯籠の下に、まるで子供が押しつぶされたような形の平たい石が、今もあるというのだ。これが、毘沙門や青面金剛が足下に踏みつけているアマノジャクと同じ系統の口伝であることは、言うまでもないだろう。ただ私は、ここまで変化してきた上代の天之探女が、なお女性であるという条件を失わずにいたことに、驚き、注意を向けずにはいられないのである。

    黄金の瓜

    （一）昔、ある殿様の奥方が、うっかりおならをした。殿様はひどく怒り、奥方を「うつろ舟」という箱形の舟へ入れて海に流した。流れ流れて、そのうつろ舟は、ある島へ流れ'
  notes:
  - 冒頭はscan106、末尾はscan108へ続く。
  - 「上代」は古代。「青面金剛」は庚申信仰に関わる尊像。
  - 前のスキャンからの続き
  - 次のスキャンへ続く

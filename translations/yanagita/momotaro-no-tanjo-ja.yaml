  section: 桃太郎の誕生／あくと太郎／海神少童（次章扉）
  original: '蝦夷の語で股を意味し、爺婆のオムから生れた故にオムタロと名けられた。成長の後、舟をこしらへて貰つて海に出で、鬼が島に渡つて博奕をする鬼を追ひ、あまたの財寶を得て還つたことは、桃太郞よりも寧ろ我々の團子淨土の話と一致して居る。それを鄰の少年が羨んで眞似をして、失敗して滿船の糞を持つて來る。シタロのシはアイヌ語の糞であつた。此話はアイヌが近接する日本人から學んだらうといふ想像は、太郞といふ童兒の名一つからでも成立つかと思ふ。でも金田一氏の集めたアイヌ昔話集を見ると、彼等の中にも鍋に入れられて川上の大きな里から、流されて來たなどといふ童兒の話もあつて(日本童話集下卷)、その展開の形は可なり我々の方にあるものとちがつて居る。だから此話の如きも元は彼方に在り、或は雙方に獨立して生れたといふことも言へるかも知れぬが、假にさうであつても我々の昔話に、脛から生れ又は踵から生れた偉人もあつたといふ事實だけは爭へない。少くとも桃を主眼とした桃太郞研究が、詮無き辛勞であつたことはもう明かになつて居るのである。

    海神少童'
  translation: '……アイヌ語で股を意味し、爺と婆のオムから生まれたので、オムタロと名づけられた。成長してから舟を作ってもらい、海に出て鬼が島へ渡り、賭博をする鬼を追い払い、多くの財宝を得て帰ったという点は、桃太郎より、むしろ日本の「団子浄土」の話と一致している。それを隣の少年がうらやんでまねをし、失敗して舟いっぱいの糞を持ち帰る。シタロの「シ」は、アイヌ語の糞だった。この話は、アイヌが近くに住む日本人から学んだのだろうという推測は、「太郎」という子どもの名前一つからでも成り立つかと思う。しかし金田一氏の集めたアイヌ昔話集を見ると、アイヌの人々にも、鍋に入れられて川上の大きな里から流されてきた、という子どもの話があり（『日本童話集』下巻）、その展開の形は、日本側にあるものとはかなり違っている。だから、このような話も元はアイヌ側にあった、あるいは双方に独立して生まれた、といえるかもしれない。しかし仮にそうでも、日本の昔話に、すねやかかとから生まれた偉人もいたという事実だけは否定できない。少なくとも、桃を主眼にした桃太郎研究が、かいのない苦労だったことは、もう明らかになっているのである。

    海神少童'
  notes:
  - 冒頭は前スキャン末尾「オムは」から続く。
  - 左頁は次章「海神少童」の扉。本文と区別して収録した。
  - 原文「蝦夷」は当時の民族呼称で、ここではアイヌ語と訳した。アイヌ語の語義・伝播については著者の当時の説を訳しており、現代の学説による改訂は加えていない。

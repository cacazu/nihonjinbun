- id: mmt-051-01
  scan: 51
  section: 海神少童
  original: '迄も面白かつた。といふよりも後ほど面白くなつて來たのである。

    八興味と教訓

    然らば說話の不變部分として、如何なる個條が永く保存せられて居たか。たとへば一方の

    土地で汚ないをかしな名前の子供であつたものが、他では黑猫であり、又は白狗でもあつた

    らしいのは、是も亦私の謂ふ成長素に屬するものかどうか。斯ういふことが次には問題にな

    つて來る。其答は歷史が長い爲に、さう簡單には然りとも否とも言はれないが、大體に二つ

    の條件を附して、自分は之を或時代の不變分子の後に崩壞して、他の成長する細胞に捲き込

    まれてしまつたものと解して居るのである。二つの條件といふのは其一つは前にいふ轉用と

    複合、卽ち個々の記憶ばかりが幽かに殘つて居て、いつ迄も元の話の周圍に纏綿しては居る

    が、筋の續きは旣に變つてしまつた場合の多いことである。是あるが爲にもはや昔の形で無

    い昔話が、手付かずに傳はつて居る樣な感じを人に與へることは、是非とも豫め警戒してか

    からねばならぬ。今一つの條件は說話を支持して居た者の思想なり社會觀なりが、刻々に移

    動して常に大いなる外部の影響を及ぼして居たことである。之を認めない限りは、曾てあれ

    程重きを置かれて居た民間說話の骨子が、一朝にして變化して止まざる部分に遷つて行つた

    理由を、把握することは望み難い。神が現實に童兒を人に贈り、しかも其童兒が時あつて小

    さな動物、又は桃や鶯の卵の形を以て出現したなどといふことも、ずつと大昔には人が擧つ

    て之を信じて居たは勿論、信じて之を傳ふが故に次の者も疑ふ能はず、もしくは昔の神代な

    らば、さういふ出來事も無かつたとは言はれぬと思ふ者迄、可なり久しい間此點には手を著

    けることが出來なかつたのである。ところが智能が進み推理の力が逞しくなつて、底の信仰

    が先づ搖ぎ、終には之を聽かうとする者の要求が改まつて來た。話術の自由なる區域は徐々

    として擴張し、前には昔話の要素であつたものも、興味の少ないものは片隅に押遣られ、一

    方に面白くて堪らぬものは、面白いが爲に保存せられては居たけれども、それも亦やがては

    少しづつ作り換へられて、話はいつと無く大話になつてしまつたのである。是に數千年に亘

    つた遲速が無く、又土地によつて配合の異同が無かつたならば、比較研究も或は徒勞であつ

    たかも知れぬのだが、幸ひにして此變化には順序があり、個々の民族には又それ〴〵の狀況'
  translation: 'までもおもしろかった。いや、それよりも、後になるほどおもしろくなってきたのである。

    八　おもしろさと教訓

    それでは、物語の変わらない部分として、どのような項目が長く保存されていたのか。たとえば、ある土地では汚らしい、おかしな名前の子供だったものが、ほかの土地では黒猫であり、また白犬でもあったらしいというのは、これも私のいう成長の要素に属するのだろうか。次には、こうしたことが問題になってくる。その答えは、歴史が長いため、そう簡単に肯定も否定もできない。しかし私は、おおむね二つの条件を付けたうえで、ある時代には不変だった要素が、後に崩れ、ほかの成長する細胞へ巻き込まれてしまったものだと解釈している。

    二つの条件の一つは、前に述べた転用と複合である。つまり、個々の記憶だけがかすかに残って、いつまでも元の話の周辺にまとわりついているが、筋のつながりはすでに変わってしまっている場合が多い、ということだ。このため、もはや昔の形ではない昔話が、手を加えられずに伝わっているかのような感じを人に与えることには、ぜひとも前もって警戒しなくてはならない。もう一つの条件は、物語を支えていた人々の思想や社会観が絶えず動き、常に大きな外部からの影響を及ぼしていたことである。これを認めないかぎり、かつてあれほど重んじられた民間の物語の骨組みが、突然、絶えず変化する部分へ移っていった理由を理解するのは難しい。

    神が実際に子供を人に贈り、しかもその子供が、ときには小動物や桃、鶯の卵の形で現れた、などということも、はるかな昔には誰もが信じていたのはもちろん、信じて伝えるので次の人も疑えなかった。あるいは、昔の神代なら、そういう出来事がなかったとは言えないと思う人々も含め、かなり長い間、この点には手をつけられなかったのである。ところが知能が進み、推理する力が強くなると、まず根底の信仰が揺らぎ、ついには話を聞こうとする人々の要求も変わってきた。語り方を自由に変えられる領域は、徐々に広がった。以前は昔話の重要な要素だったものも、おもしろさの乏しいものは隅へ押しやられ、一方、おもしろくてたまらないものは、そのおもしろさゆえに保存された。それでもやがて、少しずつ作り替えられ、話はいつの間にか、誇張に満ちた大げさな話になってしまった。

    この変化に数千年にもわたる早さ・遅さの違いがなく、また土地によって組み合わせの違いがなかったなら、比較研究も無駄な努力だったかもしれない。しかし幸い、この変化には順序があり、個々の民族にも、それぞれの状況'

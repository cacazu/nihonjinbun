  section: 桃太郎の誕生／三 童話の起り・四 童話と其記録
  original: '採らうとした。是が今日の童話といふものの起りと言つて、多分誤りは無いと私は考へて居る。但しこの選擇者の心理の上に働いた外部の事情が、更に三つほどは算へられる。其一つは話術の進步を促した力の變化、卽ち子供だけが聽衆だと考へる時に、用語を解し易くするは固より、更に又叙述の省略と敷衍とが行はれたことである。併し是は子供に對してだけで無く話術は元來がさういふ風に、いつも聽衆の顏色によつて影響を受けるものであつた。たとへば色町の話はなまめかしく、軍談は騒々しいものとなつたのも、聽く人柄が知らず識らずのうちに、話す人の上に働きかけて居たのである。第二には話者に今日の作家の樣な特別の準備が無くて、常に自然の印象と記憶力とによつて動かされて居たことである。家庭の昔話の管理者は通例は女性であつた。母ならば二十何年前に、婆ならば又五十年ばかりも前に、曾て自分の面白く嬉しかつた記憶が、子供の智惠付くを見て復活する。たゞそれだけが御伽の資料であつた。從うて話者聽者の世代を重ねる程づつ、興味は追々に大人のものから、子供のそれに移つて行くので、いつの間にか話の要點がかはり、たとへば桃太郞でいふならば、割れて赤ん坊が飛び出したところ、又はどんぶりこんぶりと桃の實が流れて來た個條などが、中心かと思はれるやうになるのである。卽ち大人や靑年がそんなものはつまらぬと思ふ時代が來ると、別に童話にしようといふ氣が無くとも、昔話は次第に子供らしくならざるを得ない。是が又案外に古風な說話の、小兒の間ばかりに保存せられて居た理由である。

    四童話と其記錄

    さういふ中でもまだ大人たちの間に、若干の昔話の交換が行はれて居る限りは、兒童は又それをも傍聽して、始終二通りの種類を知つて覺えて居たのである。ところが更に第三の事情として、夜話の衰微といふことが重要であつた。以前古い話を聽く機會であつた庚申や日待の晩に、人がもう徹夜をする元氣も餘裕も無くなると、却つて晝日中そちこちに立ち淀んで雜談に耽る風は多くなつたが、是にはもう昔話のやうな長いものは出て來なかつた。それから一方には少し押賣りの嫌ひもあつたが、年長者が自分の知つて居ることだけは、是非とも語り殘して行きたいといふ氣持、是が書籍の增加と反比例に、追々と遠慮深くなつて來て'
  translation: '……選ぼうとした。これが今日の童話の起こりだといって、おそらく間違いはないと私は考えている。

    ただし、この選び手の心理に働きかけた外部の事情が、さらに三つほど挙げられる。一つは、話術の進歩を促す力の変化である。つまり、聞き手が子どもだけだと考えたときに、言葉をわかりやすくするのはもちろん、さらに叙述を省いたり、詳しく広げたりするようになったことである。しかしこれは、子どもに対してだけではない。話術はもともとそのように、いつも聞き手の反応によって影響を受けるものだった。たとえば色町の話がなまめかしく、軍談が騒々しいものになったのも、聞く人の性質が、知らず知らずのうちに話す人に働きかけていたのである。第二は、話し手が今日の作家のように特別な準備をするのではなく、いつも自然な印象と記憶力によって動かされていたことである。家庭で昔話を守り伝える役は、普通は女性だった。母親なら二十数年前、祖母なら五十年ほども前に、自分が面白く、うれしく感じた記憶が、子どもに知恵がつくのを見てよみがえる。ただそれだけが、おとぎ話の材料だった。したがって、話す人と聞く人が世代を重ねるにつれて、興味はだんだん大人のものから子どものものへと移っていく。いつの間にか話の重点が変わり、たとえば桃太郎なら、桃が割れて赤ん坊が飛び出したところや、どんぶりこんぶりと桃の実が流れてきた部分などが、中心と思われるようになる。つまり、大人や青年がそんな話はつまらないと思う時代が来ると、わざわざ童話にしようと思わなくても、昔話は次第に子どもらしくならざるをえない。これがまた、意外に古風な説話が子どもの間だけに保存されていた理由でもある。

    四　童話とその記録

    そうした中でも、まだ大人の間でいくらかの昔話が語り交わされているかぎり、子どもはそれもそばで聞いて、いつも二通りの種類を知り、覚えていた。ところが、さらに第三の事情として、夜話が衰えたことが重要だった。以前は古い話を聞く機会だった庚申や日待の晩にも、人々に徹夜をする元気や余裕がなくなると、かえって日中、あちこちに立ち止まって雑談にふける習慣は増えたが、そこにはもう、昔話のような長いものは出てこなかった。また一方では、少し押し売りじみたところもあったが、年長者には、自分の知っていることだけはぜひ語り残しておきたいという気持ちがあった。それが、本が増えるのに反比例して、だんだん遠慮がちになってきて……'
  notes:
  - 冒頭・末尾は前後のスキャンへ続く。
  - 庚申・日待は、共同で夜を明かすことのあった信仰上の行事。

  section: 瓜子織姫／三 瓜と桃
  original: 全體の一致から、內地の昔話の運搬せられたものとも想像し得られる。高木氏はこの二つの事實を重要視し、愈〻桃太郞といふ名の後に起つたことを信じたやうであるが、勿論單なる語音の近似だけからは、是迄の變化は起り得なかつた。二つ以上の昔話のもと同じであるか否かを決するには、どうしても內容の比較が必要である。瓜子と桃太郞とは色々な點でよく似て居るが、それが男の子であり又女の子であることは、可なり顯著なる一つの差異である。從うて名前は假に後のものとしても、話はずつと前から男女二通りのものが、併び存して居たのかも知れぬのである。
  translation: '全体が一致していることから、内地の昔話が伝えられたものとも考えられる。高木氏は、この二つの事実を重視し、桃太郎という名は後から生じたものだと、ますます確信したようである。しかしもちろん、単に言葉の響きが似ているだけでは、これほどの変化は起こりえなかった。二つ以上の昔話が、もともと同じ話だったかどうかを決めるには、どうしても内容を比較する必要がある。

    瓜子姫と桃太郎は、さまざまな点でよく似ているが、男の子と女の子であるというのは、かなりはっきりした相違である。したがって、仮に名前は後からついたものだとしても、話そのものは、ずっと以前から男女二通りの形で並び存在していたのかもしれない。'

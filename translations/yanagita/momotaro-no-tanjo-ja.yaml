  section: 瓜子織姫／三 瓜と桃
  original: 高き處に在るものと、信じられて居たらしき痕跡である。瓜と桃とが產子を運んで來たといふ昔話は、雙方ともに至つて古くから此國にあつたものと、考へて少しも差支は無いのであるが、桃の方には何と無く支那の感化といふことが思はれるので、此點に重きを置いた近世の註釋家は、諸人言ひ合せた如く桃太郞が飜案であり、少なくとも漢學興隆後の所產であることを說かうとし、それでは昔話の中にも、曾て大衆と關係の無い文藝があつたといふ結論に、歸することをさへ省みなかつたのである。是は全く昔話といふものがどうして流傳するかといふ大切な問題を、考へて見なかつた誤りといふの他は無いが、兎に角に「桃が流れて來た」といふ一點の、日本固有らしくないことだけは、彼等無意識に旣に之を認めて居たのである。瓜も果して最初から此民族の中にあつたかどうか。後に結合したかも知れぬといふ疑ひは、實は桃の實と五十步百步であるが、幾分か此方がまだ民間の信仰と調和し易かつた。たとへば今日祇園といふ名を以て知らるゝ行疫神は、胡瓜を好みたまふと謂つて、其夏祭の日に之を川に流し、又は祭の日以後之を食ふを忌むこと、さういふ瓜の中には小蛇が入つて居るといふ畏怖があることなども、我々には可なり重要なる暗示である。それから水の神の瓜を憎み若くは非常に好むといふことも、今は河童などの俗信に化して傳はつて居るが、是も亦河內の茨田堤、さては備中の縣守淵の古傳に見える如く、曾て瓠を以て神意を占なうた習俗の名殘かも知れぬのである。何れにしても若し此昔話の一つの要點が、童子の異常出現を說くに在つたならば、瓜は其性質が桃などに比べて、遙かに多分の靈恠味を持つて居たといふことだけは言へる。さうして其特徴の桃の方に缺けて居た二點は、瓜は其中が段々とうつろになつて行くこと、及び能く水に浮んで流れるといふことに在つたらうと思ふ。だから瓜子姫の說話が一段と古く、桃太郞は卽ちその第二次の變化であつたといふ說なども、今はまだ確かで無いが、成立つかも知れぬのである。故高木敏雄君が熱心に此問題を考へて居た頃には、ちやうど二つの偶然の發見があつた。其一つは子を欲しがつて居る善心の婆が、股に孕んで小さな子を生んだ、それでモヽ太郞と名けたといふ昔話のあること、第二にはアイヌの中にもオムタロといふ昔話があつて(鄕土研究一卷七號)、オムは卽ち蝦夷語の股であり、同じく爺婆のオムから生れて、後に鬼ケ島に遠征した童子の話であること、是は其
  translation: '高い場所にあると信じられていたらしい、その痕跡なのである。

    瓜と桃が生まれた子を運んできたという昔話は、どちらも、きわめて古くからこの国にあったと考えて、少しも差し支えない。しかし、桃のほうには、何となく中国の影響が感じられる。その点を重く見た近世の注釈家は、申し合わせたように、桃太郎は翻案であって、少なくとも漢学が盛んになった後の産物だと説こうとした。それでは、昔話の中にも、かつて大衆と関係のない文芸があったという結論になることさえ、顧みなかったのである。

    これはまったく、昔話というものがどのように流れ伝わるのかという大切な問題を考えなかった誤り、と言うほかない。ただし、「桃が流れてきた」という一点が日本固有のものらしくないことだけは、彼らも無意識のうちに、すでに認めていたのである。

    それでは瓜は、果たして初めからこの民族の間にあったのだろうか。後になって話と結びついたのかもしれないという疑いは、実のところ桃の実と大差ないが、瓜のほうが幾分、民間の信仰となじみやすかった。たとえば今日、祇園という名で知られる疫病の神は胡瓜を好むといい、その夏祭りの日に胡瓜を川へ流したり、祭りの日以後は食べるのを避けたりする。また、そうした瓜の中には小さな蛇が入っているという恐れがある。これらも私たちには、かなり重要な手がかりである。

    さらに、水神が瓜を嫌う、あるいは非常に好むということも、今は河童などの俗信となって伝わっている。これもまた、河内の茨田堤や備中の県守淵の古い伝承に見えるように、かつて瓠を使って神意を占った習俗の名残かもしれない。ともかく、この昔話の要点の一つが、童子の不思議な出現を語ることにあったとすれば、瓜はその性質上、桃などより、はるかに多くの神秘性を備えていた、とは言える。そして、桃に欠けていた特徴は、瓜の内部がだんだん空洞になっていくことと、水によく浮かんで流れることの二点だったと思う。

    したがって、瓜子姫の話のほうがさらに古く、桃太郎はその第二段階の変化だという説も、まだ確かではないが、成り立つかもしれない。故高木敏雄君が熱心にこの問題を考えていた頃、ちょうど二つの偶然の発見があった。一つは、子供を欲しがっていた心の善いお婆さんが、股に子を宿して小さな子を生み、そのためモモ太郎と名づけた、という昔話があること。もう一つは、アイヌの間にもオムタロという昔話があり（『郷土研究』一巻七号）、オムとは「蝦夷語」すなわちアイヌ語で股の意味で、同じように爺婆のオムから生まれ、後に鬼ヶ島へ遠征した童子の話だということである。これは、その'
  notes:
  - 冒頭はscan74、末尾はscan76に続く。
  - 原文の「支那」は当時の中国の呼称、「蝦夷語」はここではアイヌ語を指す歴史的表現。

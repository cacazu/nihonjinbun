  original: にをかしい程この系統の笑話が流布して居る。佐々木君の筆記した紫波郡昔話や老媼夜譚、山形縣では最上郡の豐里村誌、越後で近頃集めた加無波良夜譚にも、大よそ同じ型の話があるのだから、決して或土地限りのボサマの卽興の作で無く、師資相承して久しく持傳へて居るものであつた。しかも其話の話法として、物吝みの夫婦が何とぞして餅を座頭の坊にくれまいと思つて、色々と問答をした文句には地方的の變化があつた。それから亭主の足の指に細紐を結んで置いて、夜中にそつと引いて二人きりで餅を食はうとすると、それを盲がかん付いて紐を自分の足に結びかへ、引かれてのこ〳〵起き出して女房と共に餅を食ふ。さうして夜の明けぬうちに其家を飛出し、どぶんと横槌を井戶に投込んで、身投げと見せかけたといふなどは何處でも大抵同じだが、一方には又亭主に名前國所を尋ねられて、「蓑にかい餅くるみの郡」だの、「瓶の底ぬく一坊でござる」だのと答へる點は、一箇處每に其でたらめが區々になつて居て、誰も彼も自分が子供の頃に聽いて居た話し方が、最も面白く又正しい樣に思つて居るのである。誠にはや小さな事ばかり穿鑿して居るやうであるが、私の興味を抱くのはこの盲人の機轉が、相手次第によつて更へてもよい文句は改造し、しかも尙一貫して旣定の敎理、平たく言ふならば座頭には餅を食はすべきもの也といふ要點のみは、どこ迄も保存して行かうとしたことである。もしも彼等をして今日の世に在らしめば、必ず之を名けてイデオロギイと謂つたに相異ない。少なくも作者自らの生活に忠實であつた點にかけては、盲の文藝は他の多くの受賣小說よりも、遙かに花が自分の爲に匂ひ、鳥が自分の爲に歌ふに近かつた。但し一方にはざういふ隱れたる趣意を挿んだ文藝を、聽いて無心に嬉しがつて居た者は善人であつたと言つてよい。盲は之に乘じて始終少しづつ其地步を進めようとして居たのである。私の知つて居る座頭の餅話の中では、特に大膽なるものが秋田縣に一つあつた。今では土地の人も忘れてしまつたかも知らぬが、以前北秋田の十二所といふ町に座頭の神社が有り、そこに又座頭櫻といふ名木の櫻もあつた。花都といふ旅の琵琶法師の靈を祀ると傳へられて居た。昔此土地の人々の集會の席で、餅と酒と何れか優れるとの論があつた時に、この花都坊が居り合せて、ふと一斗搗きの餅なら食つて見せるといふ賭をした。もしも食ひ盡し得なかつたら首を取るといふ約束で、早速餅搗きの支度にかゝつたが、其家の女房が惡戯に、相
  translation: '〔前のスキャンから続く〕おかしいほど、この系統の笑い話が広く伝わっている。佐々木君の筆記した『紫波郡昔話』や『老媼夜譚』、山形県では最上郡の『豊里村誌』、越後で近ごろ集められた『加無波良夜譚』にも、おおよそ同じ型の話があるのだから、決してある土地だけのボサマの即興作ではない。師から弟子へと受け継いで、長く持ち伝えていたものだった。ただし話し方として、物惜しみする夫婦が、何とかして座頭の坊に餅をやるまいと考え、さまざまに問答する文句には、地方ごとの違いがあった。それから、夫の足の指に細い紐を結んでおき、夜中にそっと引いて二人だけで餅を食べようとすると、目の見えない男がそれを察し、紐を自分の足に結び替える。引かれるとのこのこ起き出して妻と餅を食べ、夜が明けないうちに家を飛び出す。そして横槌をどぶんと井戸へ投げ込み、身投げしたように見せかける、といったところは、どこでもたいてい同じである。一方、夫から名や出身地を尋ねられ、「蓑にかい餅、くるみの郡」とか、「瓶の底ぬく一坊でございます」とか答える部分では、土地ごとにでたらめな文句がまちまちになっている。そして誰もが、自分が子どものころ聞いた話し方が、最も面白く正しいように思っているのである。まことに小さなことばかり詮索しているようだが、私が興味を抱くのは、この目の見えない人の機転が、相手によって変えてよい文句は改造しながら、なお一貫してあらかじめ決まった教理、平たくいえば「座頭には餅を食べさせるべきだ」という要点だけは、どこまでも守ろうとしたことである。もし彼らが今日の世にいたなら、必ずこれを「イデオロギー」と呼んだにちがいない。少なくとも作者自身の生活に忠実だった点では、目の見えない人の文芸は、ほかの多くの受け売り小説よりはるかに、花が自分のために香り、鳥が自分のために歌うことに近かった。

    ただ一方では、そういう隠れた意図を含む文芸を聞いて、無邪気に喜んでいた人たちは善人だったといってよい。目の見えない人はこれに乗じ、いつも少しずつ自分の足場を広げようとしていたのである。私の知る座頭の餅話の中には、とくに大胆なものが秋田県に一つあった。今では土地の人も忘れてしまったかもしれないが、以前、北秋田の十二所という町に座頭の神社があり、そこに座頭桜という名木の桜もあった。花都という旅の琵琶法師の霊を祭ると伝えられていた。昔、この土地の人々の集まりで、餅と酒のどちらが優れているかという議論があったとき、この花都坊が居合わせ、ふと、一斗の米をついた餅なら食べてみせるという賭けをした。食べきれなければ首を取るという約束で、早速餅をつく支度に取りかかったが、その家の妻がいたずらに、相手の、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン274）と本文OCRを照合。
  - 画像で「教理」を確認し、OCRに基づく仮読「真理」を訂正。ボサマは座頭などの盲人芸能者の地方語。「蓑にかい餅くるみの郡」等は地名風の言葉遊びで、実在地名ではない。
  - 原文の歴史的差別語は文脈を保持し、通常は「目の見えない人」等と訳した。障害者の性質を一括りにする評価は著者の当時の見解であり、現代の事実認定ではない。

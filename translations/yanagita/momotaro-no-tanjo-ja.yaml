  scan: 135
  section: 田螺の長者／生きて居る小太郎・五分次郎
  original: '後はどうだつたか氣をつけて居るがまだわからず、又其筆記者の名も現はし難い事情に在る

    が、私は別に之を證據として、是非とも此事實を信じようとするのでは無いから、其點はどう

    であつてもよい。兎に角に斯ういふ取止めも無い風說が、たとへ片隅にも傳はつて居るとい

    ふことは、又一つの注意すべき事實と言はなければならぬ。三州矢作の淨瑠璃御前なども、

    牛若御曹司の同時代人であり、しかも小說中の人物に過ぎなかつたのであるが、やはり其遺

    跡といふものが此地方には多いのみならず、往々にして山中に其姿を見たといふ話を傳へて

    居る。是が單なる農民の幻覺であつて、曾つて說話の內容を信じた時代の、古い感情が無意

    識に相續せられて居たのであるか。或は人をさういふ誤解に誘ふ樣な人物が、實際に時々廻

    つて來たのであるか。はた又何のよりどころも無しに、斯んな作り事をして人を驚かす者が

    あつたのか。自分にはまだ何れとも判斷が付き兼ねるが、何れにしたところで我々の昔話と

    いふものは、是まで世間に承認せられた以上に、別に隱れたる人生との交渉があつたのであ

    る.この交涉たるや、新たに突然と中世から發生したものでも無かつたらう。然らば上古の

    說話のまだ力强く、弘く民間に活躍して居たものは、果してどういふ影響を我々の文明の上

    に及ぼして居るであらうか。形が有る限りは必ず其痕はどこかに殘つて居るべきである。そ

    れが尋ねて見ても見られぬやうであつたら、說話研究の意義もまだ決して大きいとは言はれぬ。

    五分次郎

    因伯昔話三六頁に採錄した鳥取市の一話は、同じく小さ子古傳の童話化した形であるが、

    是も妻覓めの箇條を省略した點は、現在の桃太郞と近く、書傳の御伽草子の「一寸法師」とは

    異なつて居る。

    昔ある處に爺と婆があつた。子供が一人も無いので觀音樣に願掛をすると、七日目の日か

    ら婆樣の左の手の拇指が段々に膨れて來て、七日七日のおしまひの七日目には、可愛らしい

    小さな男の子が其拇指から生れた。身の丈がたつた五分しか無いので五分次郞といふ名を付

    けた。五分次郞は元氣な强い子供になつたが、體だけは何時までも五分しかなかつた。笹の'
  translation: '――後がどうだったか注意しているが、まだわからない。また、筆記した人の名も公表しにくい事情がある。しかし私は、別にこれを証拠として、何としても事実だと信じようとするのではないので、その点はどうでもよい。ともかく、このような取りとめのない噂が、たとえ片隅であっても伝わっていることは、もう一つの注意すべき事実と言わなければならない。


    三州矢作の浄瑠璃御前なども、牛若御曹司と同時代の人とされ、しかも小説中の人物にすぎなかったのだが、やはり、ゆかりの跡とされるものがこの地方には多いばかりでなく、山中でその姿を見たという話が、しばしば伝えられている。これは単に農民の幻覚で、かつて説話の内容を信じていた時代の古い感情が、無意識に受け継がれていたのだろうか。それとも、人にそうした誤解をさせるような人物が、実際に時々やって来たのだろうか。あるいは、何の根拠もなく、このような作り話をして人を驚かせる者がいたのだろうか。私にはまだ、どれとも判断しかねる。しかしいずれにせよ、私たちの昔話には、これまで世間に認められてきた以上に、人間の生活との隠れたかかわりがあったのである。このかかわりも、中世になって突然、新たに生まれたのではなかっただろう。それならば、古代の説話で、なお力強く、広く民間で生きていたものは、いったい私たちの文明にどんな影響を及ぼしているのだろう。形があったからには、必ずどこかに跡が残っているはずである。それを探しても見いだせないのなら、説話研究の意義も、まだ決して大きいとは言えない。


    五分次郎


    『因伯昔話』三十六ページに収めた鳥取市の一話も、小さな子の古伝が童話になった形である。ただし、これも妻を求めるくだりを省いた点は、現在の桃太郎に近く、書物で伝わる御伽草子の「一寸法師」とは異なっている。


    昔あるところに、おじいさんとおばあさんがいた。子どもが一人もいないので観音様に願掛けをすると、七日目から、おばあさんの左手の親指が次第に膨れ、七日を七回重ねた最後の七日目に、かわいらしい男の子が親指から生まれた。身長がたった五分しかないので、五分次郎と名づけた。五分次郎は元気な強い子になったが、体だけはいつまでも五分しかなかった。笹の――'
  notes:
  - 冒頭はスキャン134の続き。末尾の引用はスキャン136へ続く。
  - 五分は一寸の半分で、約1.5センチメートル。
  - OCRで欠落していた「言はれぬ。」の「ぬ。」を原画像により補った。

  section: 桃太郎の誕生／四 童話と其記録
  original: に厄介な場合は豫定せられて居たのみか、更に其言葉のもつ意味以上に、別に隱れたる聯想の快い興奮の原因となるものがあつて、それが又至つて素朴なる前代の生活に筋を引いて居たのである。藝術を天才の獨創と解し、乃至は各期の社會生活が之を生むと說く者には、是はたしかに厄介なる不思議だ。之を何でも無い當然の出來事だと心付く爲には、やはり我々の子供らしい桃太郞を、賴んで來なければならなかつたのである。今日の所謂五大御伽噺が、書册の力を以て略〻現在の形に結集せられたのは、江戶期も半ば過ぎに出來た「雛乃宇計木」といふことになつて居るが、あの頃は支那の小說類まで飜案せられて居た時代で、何を書いてもよく又何と改造しても自由であつたらうに、實際は新聞の雜報などと同じ程度に、大よそあの頃に於ける都市の昔話の退歩した狀態を、有りのまゝに映寫して居る。しかもそれが今日の標準型として、さも〳〵大昔から此形を以て傳はつて居たかの如く、多くの人をして信ぜしめたのは、全く文字の魅力とも名くべきものであつた。記錄はたゞ單に筆者の居た時と處とに、さういふ話し方もあつたといふことを知らしめるのみで、二つある場合に古い記錄の話の方が古いとも言ひ切れないことは、宇治拾遺物語と醒睡笑と、二つの瘤取り話を比べて見ただけでもわかる。この兩度の採集の中間には四百年ばかりの時が挾まつて居る。同じ一つの昔話は一方に誰かの手によつて文字になつて居ることも知らずに、尙此樣な久しい歲月をどこかに前の形を以て保存せられて居た場合もあつたのである。五大御伽の名稱は明白に誤つて居た。實はたゞ數多い昔話の一つの、偶然に筆とる者の耳にとまつた、小さな變化の一例といふに過ぎなかつたのである。此中でも花咲爺などは比較的その沿革がよくわかつて居る。是は昔話の最も有りふれた形で、我々の假に鄰の爺型と名けて居る種類に屬することは、前にいふ瘤取なども同じである。幾ら一生懸命に眞似て見ようとしても、生れつき備はつた福分をもつ者、又は心がけがよくて神に愛せられて居る者にはかなはないといふことを、裏表二つの極端を竝べ說いて、效果を擧げようとした話であるが、是に亦色々の小別があつて、犬を大切に飼ひ育てて莫大の財寶を得たといふものにも、黃金小犬の如くたゞ金の粒をひり出したといふのと、眞似する唱へごとの幾つかある複雜なものとがあり、何れも皆其小犬の出現と成長とに、元は奇瑞の中心を置いて居たことは桃太郞と似て居る。ところが花咲爺には其點がもう省かれて居て、しかも枯木に花を咲か
  translation: '……場面はあらかじめ決まっていただけでなく、さらに言葉の表す意味とは別に、隠れた連想によって心地よい興奮を引き起こすものがあり、それがまた、ごく素朴な前の時代の生活につながっていたのである。〔この接続部分の原文には、文意のつながらない「に厄介な」の語句がある。〕芸術を天才の独創と理解する人や、それぞれの時代の社会生活が芸術を生むと説く人には、これは確かに厄介な不思議である。これが何でもない、当然の出来事だと気づくには、やはり私たちの子どもじみた桃太郎を頼りにして来なければならなかった。

    今日いわゆる五大おとぎ話が、書物の力によってほぼ現在の形にまとめられたのは、江戸時代も半ばを過ぎてできた『雛乃宇計木』だということになっている。しかし、あのころは中国の小説類まで翻案されていた時代で、何を書いてもよく、どのように作り変えるのも自由だったはずなのに、実際には新聞の雑報のように、そのころの都市における昔話の衰えた姿を、おおよそありのままに写している。しかも、それが今日の標準的な型になり、あたかも大昔からこの形で伝わっていたかのように多くの人に信じさせたのは、まさに文字の魔力とでも呼ぶべきものだった。記録はただ、その書き手がいた時と場所に、そういう語り方もあったと知らせるだけである。二つの記録がある場合、記録が古いほうの話が古いとはいいきれないことは、『宇治拾遺物語』と『醒睡笑』の二つの瘤取り話を比べるだけでもわかる。この二度の採集の間には、約四百年もの隔たりがある。同じ一つの昔話が、一方で誰かに文字にされていることも知らずに、これほど長い年月、どこかで以前の形のまま保存されていた場合もあったのである。「五大おとぎ」という名称は明らかに誤っていた。実際には、数多い昔話の一つで、たまたま書きとめる人の耳に入った、小さな変化の一例にすぎなかったのである。なかでも「花咲か爺」は、比較的その変遷がよくわかっている。これは昔話に最もよくある形で、私たちが仮に「隣の爺型」と呼んでいる種類に属する。前に挙げた「瘤取り」なども同じである。どんなに懸命にまねしようとしても、生まれつきの福運をもつ者、あるいは心がけがよく神に愛されている者にはかなわないということを、対照的な二つの極端な例を並べて語り、効果を上げようとした話である。これにもさまざまな小分類がある。犬を大切に飼い育てて莫大な財宝を得たという話でも、「黄金小犬」のように、ただ金の粒を排泄したというものと、まねをする際の唱え言がいくつかある複雑なものとがある。いずれも、その小犬の出現と成長に、もともとはめでたい奇跡の中心が置かれていた点で、桃太郎と似ている。ところが「花咲か爺」では、その点はもう省かれていて、しかも枯れ木に花を咲か……'
  notes:
  - 冒頭は前スキャンの「出現すべき」へ接続するが、画像にも「に厄介な場合」と印刷されており、誤植または本文の乱れが疑われる。校訂原文には印刷どおり残し、訳は問題箇所を明示して文意を通した。
  - 末尾は次スキャンへ続く。
  - 「支那」は原文にある当時の中国の呼称。訳では中国とした。

  section: 瓜子織姫／諸國の瓜子姫
  original: 'つた。爺樣と婆樣とは畠から歸つて來て、瓜子姫子居たかと云つたけれども返事が無い。戶

    をあけて見たら瓜子姫子は居なくて、其代りに鬼が火棚の上で大の字なりに寢て居た。そこ

    で戶をたてて家に火を附けて、鬼も一しよに燒いてしまつた。

    (此話は紫波郡飯岡村から出た老女の語る所であつた。此以外に、別に市中で傳へられて

    居たのは、瓜子姫子は殿樣の御妾にあがるので、駕籠に乘せてつれて行くと、それが實は姫

    子を食ひ殺して、自分がそれに化けて居たアマノジヤクであつたと謂ひ、こゝにも鹿角にあ

    る鳥の歌と同じ樣な「瓜子姫子の駕籠さ、アマノジヤクは乘はつた」といふ文句が、童謠のや

    うになつて記憶せられて居るといふ。)

    一五岩手郡雫石村(聽耳草紙三七一頁)

    婆が流れて來た瓜を食べると大さう甘いので、もう一つ流れて來いといへば又流れて來る。

    用のある瓜だらこつち來い

    用のない瓜だらあつち行け

    と呼ぶと傍へ流れ寄つたので、是は爺樣の分だとして取つて置いた。それが戶棚の中で二つ

    に割れて、中から姫子が生れて居る。その姫子が大きくなつて機を織つて居ると、アマノジ

    ヤクが騙して庖丁とさいばんとを出させて、代り番こに虱取りをすると言つて、姫子をサイ

    バンの上に寢させて切つて食べてしまつた。さうして瓜子姫子に化け機を織つて居る。そこ

    へ着物を買ひに行つた爺樣たちが歸つて來て、いつもならトギカカチヤガカカ·トギカカチ

    ヤガカカと聽える機の音が、トダバタン·トダバタンと聽える(のを不審に思ふ?)。いよい

    よ嫁入になつて、うその姫子が家を出ようとすると、喰ひ殺されて居た姫子の左の手が鶯に

    なつて

    瓜子姫子だとて

    アマノジヤクが化けて嫁に行く

    をかしでや、ホウホケキョ

    と啼いたのですつかり化の皮がはげてアマノジヤクは殺された。

    (同じ雫石の村には今一つ此話が傳はつて居るが、此方は川戶へうまさうな瓜が流れて來て、

    後に戶棚の中で二つに割れ、お姫樣が生れたといふ部分が詳しくて、爼板の上に寢かせて切'
  translation: 'った。お爺さんとお婆さんが畑から帰り、「瓜子姫子、いるか」と言っても返事がない。戸を開けると瓜子姫子はおらず、その代わり、鬼が火棚の上で大の字になって寝ていた。そこで戸を閉めて家に火をつけ、鬼も一緒に焼いてしまった。

    （この話は紫波郡飯岡村出身の老女が語ったものである。これとは別に盛岡の市内で伝わっていた話では、瓜子姫子が殿様の妾になるため、駕籠に乗せて連れていくと、それは実は姫子を食い殺し、姫子に化けたアマノジャクだったという。ここにも、鹿角にある鳥の歌と同じような「瓜子姫子の駕籠に、アマノジャクが乗った」という文句が、童謡のような形で記憶されているという。）

    十五　岩手郡雫石村（『聴耳草紙』三七一ページ）

    お婆さんが、流れてきた瓜を食べるととても甘かったので、「もう一つ流れておいで」と言うと、また流れてきた。

    「用のある瓜なら、こっちへおいで。

    用のない瓜なら、あっちへお行き」

    と呼ぶとそばへ流れ寄ったので、これはお爺さんの分だと取っておいた。その瓜が戸棚の中で二つに割れ、中から姫子が生まれていた。姫子が成長して機を織っていると、アマノジャクがだまして包丁とさいばんを出させ、「交代で虱を取ろう」と言って、姫子をサイバンの上に寝かせ、切って食べてしまった。そして瓜子姫子に化け、機を織っていた。そこへ着物を買いにいったお爺さんたちが帰ってくると、いつもならトギカカチャガカカ・トギカカチャガカカと聞こえる機の音が、トダバタン・トダバタンと聞こえる（のを不審に思うのか？）。いよいよ嫁入りとなり、偽の姫子が家を出ようとすると、食い殺された姫子の左手が鶯になって、

    「瓜子姫子だというけれど、

    アマノジャクが化けて嫁に行く。

    おかしいよ、ホウホケキョ」

    と鳴いたので、すっかり化けの皮がはがれ、アマノジャクは殺された。

    （同じ雫石村にはもう一つこの話が伝わっている。こちらは川の水くみ場へおいしそうな瓜が流れてきて、のちに戸棚の中で二つに割れ、お姫様が生まれたという部分が詳しい。そして、まな板の上に寝かせて切'
  notes:
  - 冒頭はscan92の「食つてしま」から続く。末尾はscan94へ続く。
  - 「さいばん／サイバン」は、まな板の方言。
  - 括弧内の疑問符は著者自身の補足であり、その不確かさを残した。
  - 前のスキャンからの続き
  - 次のスキャンへ続く

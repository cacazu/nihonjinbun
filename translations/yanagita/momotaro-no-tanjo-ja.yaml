  section: 狼と鍛冶屋の姥／狼と鏡と火
  original: '一時に之を退散せしめようとして其鏡を投付けた爲に(伊豫の方では狼が一時逃げのいたのを見て、やれ嬉しやと其鏡を棄てた故にといふ)、狼は却つて恠光の消えたのに力を得て、樹に登つて來て磯女を喰ひ殺した。

    時の人之を憐んで樹下に祠を建て鏡を安置して磯の靈を祀り、神の名を春日姫と號した。

    後に其杉は伐られて根株となつたが、世人は之をお磯の杉と謂つて、今尙安產の祈願に效驗があると信じて居るといふ。

    食はれてしまつた女の輕卒な擧動などは、誰が見て居たといふ者も無いのに、斯うして判つて居るのはをかしい樣なものだが、此時代には死人の靈に身を貸して、ロを寄せ身の上話をさせて遣る職業の女が居り、又其言を聽く者が疑はなかつたのである。

    口寄巫の無意識の言說に、再現せられて來る智識には限界があり、又一定の傾向があつた。

    從うてほんの少部分しか違つて居ない同種の悲話が、二處以上の土地に記憶せられ、信ぜられて居たとしても不思議は無いのである。

    冷靜にいふならば、この山中の古木のあたりに、古びた一つの鏡が落ち散つて居ただけであつた。

    それを手に取上げて、或種の女性が晝の夢を見たのであつた。

    それを山中の民が大きな感動を以て聽いたのである。

    不思議は寧ろその自由なる空想が、尙何物かに約束せられずには居なかつたことである。

    是が獵人を襲うた其家の古猫などの、兼て算へて置いた矢玉の數を打ち盡させ、今は安心と湯釜の蓋を投棄てた爲に、別に用意のあつた最後の一發で射殺されたといふ話と、下に似通うて居たのも偶然では無かつたと思へる。

    是は勿論主客を顛倒した話ではあるが、さういふ矛盾の指摘し得られるのは、文字のまんべん無き記錄が出來てからのことで、早期の聽衆には印象の特に强かつた部分、たとへば金屬の器のからんと地に堕ちたといふ類の光景が、いつ迄も保存せられて時あつて再現する傾きを持つて居たのかと思ふ。

    鏡の光で恠物を追ひ退けたといふことは、他にも有るかと思ふが狼に就いては聞いたことが無い。

    たゞ普通によく謂ふのは、之を防ぐが爲めに火を焚いて居ると、夜ふけに谷川の水に身を浸して來て、身ぶるひをして火を消さうとしたといふ樣な話と、今一つは狐狸のあやかしが有ると感ずると、先づ燧を打つて煙草を吸ひ付け、心を鎭めるがよいといふ話などである。

    ところが自分は狼の話を集め始めて、近頃奇妙に思ふのは數多くの世間話の一致であつた。

    其一つとして誰にでも氣付かれるのは、或人が夜中に野路をあるくと、路傍に腰かけて煙草を吸うて居る者が'
  translation: '――一度に退散させようとして鏡を投げつけたために、狼はかえって不思議な光が消えたことで勢いづき、木に登って磯女を食い殺した。伊予の方では、狼がいったん逃げのいたのを見て、「ああ、うれしい」と鏡を捨てたためだという。当時の人々はこれを哀れみ、木の下に祠を建て、鏡を安置して磯の霊を祀り、神の名を春日姫と呼んだ。のちにその杉は切られて切り株になったが、世間ではこれをお磯の杉といい、今も安産祈願に霊験があると信じているという。食べられてしまった女性の軽率な行動など、誰も見ていたという者がいないのに、こうしてわかっているのは、おかしいようでもある。しかしこの時代には、死者の霊に体を貸し、口寄せをして身の上話をさせることを職業とする女性がいて、その言葉を聞く者も疑わなかった。口寄せをする巫女の無意識の発言に再現される知識には限界があり、また一定の傾向があった。したがって、ほんの少ししか違わない同じ種類の悲話が、二か所以上の土地で記憶され、信じられていたとしても、不思議ではない。冷静にいえば、この山中の古木のあたりに、古びた鏡が一つ落ちていたにすぎなかった。それを拾い上げて、ある種の女性が白昼の夢を見たのである。それを山中の人々が大きな感動とともに聞いたのである。

    むしろ不思議なのは、その自由な空想も、なお何かに拘束されずにはいなかったことである。これが、猟師を襲ったその家の古猫などが、前もって数えておいた矢玉をすべて撃ち尽くさせ、もう安心だと湯釜の蓋を投げ捨てたために、別に用意されていた最後の一発で射殺された、という話と、底のところで似通っていたのも、偶然ではなかったと思われる。もちろん、これは主客が逆になった話だが、こうした矛盾を指摘できるのは、文字による行き届いた記録ができてからのことである。早い時代の聞き手には、特に強い印象を受けた部分、たとえば金属の器がからんと地面に落ちるような場面が、いつまでも記憶に残り、時を得て再現される傾向があったのかと思う。鏡の光で怪物を追い払ったという話は、ほかにもあるだろうが、狼については聞いたことがない。ただ、よくいわれるのは、狼を防ぐために火をたいていると、夜更けに谷川の水に体を浸してきて、身震いして火を消そうとしたという話と、もう一つは、狐や狸に化かされたと感じたら、まず火打ち石で火を起こして煙草を吸い、心を落ち着けるのがよいという話などである。ところが、私が狼の話を集め始めて、近ごろ奇妙に思うのは、数多くの世間話が一致していることだった。その一つとして誰でも気づくのは、ある人が夜中に野道を歩いていると、道端に腰を下ろして煙草を吸っている者が――'
  notes:
  - 冒頭は238、末尾は240へ続く。

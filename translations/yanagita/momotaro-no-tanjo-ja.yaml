  section: 狼と鍛冶屋の姥
  original: 傳說と化し易い傾きを持つて居たとは言ひ得る。土佐には限らず他の國々の例に於ても、是を國境の某峠の上に於て、有つたことだと傳へて居るものは多く、又一般に其話法がやゝ傳說の方に近くなつて居る。最初からもし此通りだつたら、さう弘く分布することは出來なかつた筈である。察するに說話としての興味の中心は、たゞの野獸の群には似つかはしからぬ策謀があり、それを不思議な事と思つて居ると、やがて彼等の語によつて、その最も老獪なる首領が人間の姿をして居たことを知るといふ點に在るものが、先づ一つは有つたのである。犬梯もしくは人梯子といふのが、恐らくはもと此昔話の名稱であつたらうと思ふ。此點は所謂逃竄說話の多數のものに、共通した趣向であつた。人は時あつて魔物に劫され、生死の危險に臨むことがあるが、元來耳が聰く又判斷に敏なる者である故に、終には之に由つて身を全うし、相手を退治することも出來るといふ所に、聽いて面白がられる話のヤマ(要點)があつたかと思ふ。日本には幾らもある古寺の化物退治、中にも大足二足小足八足だの、又は東野の馬骨西竹林の一目鶏だのと名乘つて來て、忽ち本體を見顯はされる話は代表的であり、又蛇聟入の話で、奧山の岩穴の口まで跡つけて行くと內に呻く聲があつて、子種を殘して來たから死んでも本望だと一方がいふ。いや〳〵人間といふものは賢こい者だ。もしも蓬と菖蒲を湯に入れて、行水したらどうすると謂ふのを、立聽きして還つて來て、當座の難を遁れたとあるなども同巧異曲であつた。但し犬梯の千疋狼の方には、某家の何々婆樣と人の名をさして言ふことになつて居る爲に、どうしても話が固定して、或地に土着する傾向は强かつたらうと思はれるが、しかも是と大木に登つて難を避けたといふ二つだけでは、土佐の野根山の產杉の傳說は、まだ現在の形に成長することは出來なかつた筈である。前揭南方氏の論文の中には、格別深い注意を拂はれなかつたやうに見えるが、この狼の群が梯子を作つて、樹上の旅人を攻め登るといふ話には、明かに二つの系統があつたのである。土佐と同樣に後から遣つて來た親分の怪物も、やはり狼であつたといふ例は北國の一部に限られて居る。新著聞集に採錄せられた越前大野郡、菖蒲池の孫右衞門が女房といふ一例の他に、伯耆日野郡の奥の或山路であつた事といふのが、六七年前に刊行せられた因伯童話に出て居り、それからちやうど此二地の中間に、やゝ異色ある但馬養父郡の、高木加門の妻の話
  translation: '伝説になりやすい傾向を持っていたとはいえる。土佐に限らずほかの国々の例でも、国境のある峠の上で起きたこととして伝えるものは多く、一般に語り方もやや伝説に近くなっている。もし最初からこのとおりだったなら、それほど広く分布することはできなかったはずである。

    思うに、説話としての興味の中心が、普通の野獣の群れには似つかわしくない策略があり、不思議に思っていると、やがて彼らの言葉によって、最も老獪な首領が人間の姿をしていたとわかる、という点にあるものが、まず一つあったのである。「犬梯」、あるいは「人梯子」というのが、おそらく元の昔話の名称だったと思う。この点は、いわゆる逃避説話の多くに共通する趣向だった。人はときに魔物に脅かされ、生死の危険に直面するが、もともと耳がよく判断も素早いため、最後にはその能力で身を守り、相手を退治することもできる。その点に、聞き手が面白がる話の山場、つまり要点があったのだと思う。日本にいくつもある古寺の化け物退治、とりわけ「大足二足、小足八足」や「東野の馬骨、西竹林の一目鶏」などと名乗って来て、たちまち正体を見破られる話は、その代表である。また蛇婿入りの話で、奥山の岩穴の入口まで跡をつけると、中でうめく声がし、「子種を残してきたから死んでも本望だ」と一方がいう。するともう一方が「いやいや、人間は賢い。もし蓬と菖蒲を湯に入れて行水したらどうする」と答える。それを立ち聞きして帰り、差し迫った難を逃れたという話なども、趣向は共通している。ただ「犬梯」の千匹狼のほうでは、何々の家の何々婆様と人名を挙げることになっているため、どうしても話が固定され、ある土地に定着する傾向が強かっただろう。しかし、それと、大木に登って難を避けたという二点だけでは、土佐の野根山の産杉の伝説は、まだ現在の形に育つことはできなかったはずである。

    先に挙げた南方氏の論文では、格別に深く注意されていないように見えるが、この狼の群れが梯子を作り、木の上の旅人を襲って登る話には、明らかに二つの系統があった。土佐と同じく、後から来た親分の怪物もやはり狼だったという例は、北国の一部に限られている。『新著聞集』に採録された越前大野郡の、菖蒲池の孫右衛門の妻という一例のほか、伯耆日野郡の奥のある山道で起きたことだという話が、六、七年前に刊行された『因伯童話』に出ている。そしてちょうどこの二つの土地の中間に、少し異色の、但馬養父郡の高木加門の妻の話'
  notes:
  - 「蛇婿入り」は蛇が男に化けて女性と婚姻する説話。「子種」や行水はその物語中の設定。

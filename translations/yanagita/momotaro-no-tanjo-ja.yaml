  section: 瓜子織姫／五 驚くべき成長
  original: 或は倭姫命の玉蟲傳說と同じく、必ず清淨なる容器に入れて安置するを要したことが察せられるのである。他日もう少し詳しく述べて見たいが、越中の灰蒔爺の話に於て、婆が洗濯に出て桃を拾ひ、それを持ち還つて臼の中に入れて置いたのを、爺が戾つて來て臼の中を見ると、桃がいつの間にか白い小犬になつて居たと謂ひ、又は木曾の小子塚の口碑などで、その小さな子を臼の中で、愛育したといふことになつて居るのを考へ合せると、古くは瓜子姫の成長を說く爲にも、やはりこの容器といふ點が缺くべからざる一箇條であつたことを、推定することが出來るのである。
  translation: 'あるいは倭姫命の玉虫伝説と同じように、必ず清浄な容器に入れ、安置する必要があったのだと察せられる。

    後日、もう少し詳しく述べたいが、越中の灰蒔爺の話では、お婆さんが洗濯に出て桃を拾い、持ち帰って臼に入れておく。お爺さんが帰って臼の中を見ると、桃がいつのまにか白い小犬になっていたという。また、木曽の小子塚の伝承などでは、その小さな子を臼の中で大切に育てたことになっている。これらを考え合わせると、古くは瓜子姫の成長を語るにも、やはり、この容器という点が、欠かせない要素の一つだったと推定できるのである。'

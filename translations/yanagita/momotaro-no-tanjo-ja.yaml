  section: 米倉法師／六 狐と座頭・七 狼と座頭
  original: たのが露顯したといふ話。それから又うちの師匠は醉ふと袋の中に入つて寢ようといふので困るといふと、狐がつい騙されて和尙を氣取り、今夜も袋を出せと謂つて其中へのこ〳〵と入つてしまふ。それを袋の上からうんとどやし付けた話。斯ういふのが何度聽いても高笑ひせずには居られぬ昔話であつた。信州北安曇郡の口碑集では、それが犬市といふ小盲法師の手柄話になつて居る。又奧州の聽耳草紙に於ては、琵琶の合の手を以てその擲られて啼く狐の聲を模して居る。乃ち此類の餘りにも素朴なる冒險譚が、本來彼徒の管轄であり又十八番であつたことを知るのである。是を事實だと思つて聽いた者も少ないであらうが、作者の空想は止めども無く發展して居た。或は山寺の化物退治の話の中にも、妙にペダンチックな南地の鯉魚だの、西竹林の一目鷄だのといふ名があつたり、或は三味線の絲をきり〳〵としめると、急に咽がしまつて苦しくなる。さては此妖恠は蜘蛛だなといふ類の理窟つぽい話もある。或は又行暮れて野中の一つ家に宿を乞ふと、むんづりとした親爺がたゞ一人居る。家は八疊一間きりで其疊には緣が無く、のつぺりとした澁紙のやうなもので、柔かで少し暖かいのでさては狸といふやうな、惡謔に過ぎたるものもあつた。つまりは諺にもなつて居る盲蛇におぢず、盲人は却つて化物などには平氣だといふ一種の功名談であつて、たま〳〵そのたつた一つが奥州の柳目村に於て、狐盲共に死すといふ悲劇に轉用せられて居ただけである。元が有つたのだから卽席にだつて作り上げられぬことは無い。それが傳說に化して或地の住民だけには信ぜられようとした經過こそは、更にもう一段の興味を以て推究せらるべきものだと思ふ。七狼と座頭前にも述べたやうに、全體に盲の文藝は重苦しかつた。自分は實驗が少なく耳學問を主とする結果、いつも言葉の外形に拘泥する傾きがあつた。國語の活用を裏面から考察しようとする者には、參考になることが少なくない。たとへば佐々木君の採集した一話に、心願を籠めて觀音堂の椽から飛びおりた男が、眼玉が拔け出したのを慌てて拾つて、けえっちゃくれに押込んだ爲に、腹の中の五臟六腑が見えるやうになつて名醫となる。それを羨ましがつた鄰の爺が、又飛下りて見ると眼は拔けたが、今度はまちがつて栃の實を拾つて、眼にはめたか
  translation: '〔前のスキャンから続く〕ばれてしまったという話。それからまた、「うちの師匠は酔うと袋の中に入って寝たがるので困る」と言うと、狐がついだまされ、和尚になりきって「今夜も袋を出せ」と言い、その中へのこのこ入ってしまう。それを袋の上から思い切りたたいたという話である。このような話は、何度聞いても大笑いせずにはいられない昔話だった。信州北安曇郡の口碑集では、それが犬市という目の見えない少年法師の手柄話になっている。また陸奥の『聴耳草紙』では、琵琶の合いの手で、たたかれて鳴く狐の声をまねている。つまり、このようなあまりにも素朴な冒険談が、もとは彼らの担当分野であり、また得意芸だったことがわかる。これを事実だと思って聞いた人も少ないだろうが、作者の空想はとめどなく発展していた。山寺の化け物退治の話の中に、南地の鯉魚や西竹林の一目鶏といった、妙に学者ぶった名前があったりもする。また、三味線の糸をきりきり締めると、急に喉が締まって苦しみだすので、さてはこの妖怪は蜘蛛だな、といった理屈っぽい話もある。あるいは、日が暮れて野中の一軒家に宿を頼むと、むっくりした老人が一人だけいる。家は八畳一間きりで、その畳には縁がなく、のっぺりした渋紙のようなもので、柔らかく、少し温かいので、さては狸だと気づく、というような、悪ふざけが過ぎるものもあった。つまり、「盲、蛇におじず」という諺にもなっているように、目の見えない人はかえって化け物など平気だ、という一種の手柄話なのである。そのたった一つが、たまたま陸奥の柳目村で、狐と目の見えない人がともに死ぬという悲劇に転用されていただけだった。もとになるものがあったのだから、即席に作れないこともない。それが伝説となり、ある土地の住民だけには信じられるようになろうとした経過こそ、さらに一段深い興味をもって究明すべきものだと思う。

    七　狼と座頭

    前にも述べたように、全体として、目の見えない人の文芸は重苦しかった。自分自身の実体験が少なく、耳からの知識が主となる結果、いつも言葉の外形にこだわる傾向があった。日本語の使われ方を裏面から考察しようとする者には、参考になることが少なくない。たとえば佐々木君の採集した一話では、心願を込めて観音堂の縁から飛び下りた男が、目玉が抜け落ちたのを慌てて拾い、逆さまに押し込んだため、腹の中の五臓六腑が見えるようになって名医になる。それをうらやんだ隣の老人も飛び下りると、目は抜けたが、今度は間違って栃の実を拾い、目にはめたから、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン278）と本文OCRを照合。
  - 諺「盲蛇におぢず」は差別的含意のある歴史的表現を分析対象として保持。「けえっちゃくれ」は文脈から逆さま・あべこべの意味とした。
  - 原文の歴史的差別語は文脈を保持し、通常は「目の見えない人」等と訳した。障害者の性質を一括りにする評価は著者の当時の見解であり、現代の事実認定ではない。

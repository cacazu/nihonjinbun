  section: 絵姿女房／六 六十六本の扇
  original: '理郡矢附の了鬟山などには、山路の牛飼童の故跡といふものさへ殘つて居た。單に滿能長者

    のまな娘といふだけの話ならば、まだ此外にも村々に行はれて居るのである。炭燒立身の奇

    談は是と入交つて、亦數多く奧州に分布して居たけれども、出先では始終別々の言ひ傳へと

    して取囃され、誰一人是が一續きの豐後の話だといふことに心付かなかつたのは、恐らくは

    各部其管理者を異にして居た爲かと思ふ。しかも其管理者が又時と地方とによつて、折々は

    移り變つて居たらしいので、離合集散の跡は一段と尋ね難くなり、從うて之を正のまゝで外

    國から輸入したかの如き、荒つぽい獨斷說をさへ許容したのであつた。そんなに慌てずとも、

    やがて系統は大よそ判明する時が來る。種はどの樣な渡り物であらうとも、兎に角に日本の

    土に根をさして、芽を吹き花を咲かせたのが我々の民間說話であつた。必ずどこかに其花園

    はあり、土かひ水漑いだ人があつた筈である。

    現存の記錄の中で、眞野の長者と草苅山路の物語を書留めて居るものは、舞の本の「烏帽

    子折」などが恐らくは最も古いものであらう。是には美濃の靑墓の宿の遊女の長が、酒宴の

    席に於て其長物語をしたことになつて居るが、それは所謂畫中畫の一つの趣向として、偶然

    に取入れられた挿話であれば、之に由つて曾て傀儡の徒が語り傳へて居たことを、推定し得

    ないのは無論のことで、たゞ少なくとも幸若隆盛の時代に、此說話の遠く東國まで知られて

    居たことと、或は旣に用ゐられなくなつて居た舞々の古曲の中に、以前この一篇が獨立して

    あつたこと迄は、想像して見てもよいかも知れぬ。私がさういふ想像を抱く理由は、「烏帽子

    折」曲中の草苅山路は、叙述が精細でやゝ長たらしく、ほゞ獨立した語り物の體裁を備へて

    居るからであるが、問題の繪姿女房は、もう旣に此中にも其形を現はして居るのである。特

    に我々の參考になる部分だけ、本文のまゝで引用して置く方が都合がよい。

    昔我朝に用明天皇と申せしは、十六にならせたまふ迄、后の宮もましまさず。ある時公

    卿殿上人集らせたまひ、扇を六十六本折らせ、繪女房を描かせ國々へ廻し、如何ならん

    賤の女·賤の子なりとも、此扇の繪に似たる女房やある。いそぎ內裏へ參らせよ。一の

    后にいはふべしと、日本國をぞ觸れられける。それ物の美しきをば繪女房とこそ申せ、

    日本廣しと申せども、繪に似たる女房は一人も無くして、扇は都へぞ上りける。然りと

    は申せども、筑紫豐後の國、内山里と申す所に長者一人あり。四方に四萬の倉を建て'
  translation: '理郡矢附のかむろ山などには、山路という牛飼いの童の旧跡とされる場所まで残っていた。単に満能長者の愛娘というだけの話なら、ほかにも村々に伝わっている。炭焼きが出世する不思議な話も、これに交じって奥州に数多く分布していた。それなのに、広まった先では終始別々の言い伝えとして喜ばれ、誰も、これが一続きの豊後の話だとは気づかなかった。おそらく、それぞれの部分を伝える人々が違っていたためだと思う。

    しかも、その担い手も、時代や地方によって、ときどき入れ替わっていたらしい。そのため、話が分かれたり集まったりした跡は一段と探しにくくなり、ついには、これをそのまま外国から輸入したかのような、乱暴な断定まで許されてしまったのである。それほど慌てなくても、やがて系統がおおよそ明らかになるときは来る。種がどのような渡来物であろうと、ともかく日本の土に根を下ろし、芽を出し花を咲かせたのが、私たちの民間説話だった。必ずどこかにその花園があり、土をかけ、水を注いだ人がいたはずである。

    現存する記録で、真野の長者と草刈山路の物語を書き留めているものは、舞の本の「烏帽子折」などが、おそらく最も古いだろう。そこでは、美濃の青墓の宿場にいる遊女の長が、酒宴の席でこの長い物語を語ったことになっている。しかし、それは、いわゆる絵の中の絵という趣向で、たまたま取り入れられた挿話である。だから、これを根拠に、かつて傀儡の人々が語り伝えていたと推定できないのはもちろんである。

    ただ、少なくとも幸若舞が盛んだった時代に、この説話が遠く東国まで知られていたこと、あるいは、その時点ですでに使われなくなっていた舞々の古い曲の中に、以前はこの一編が独立して存在したことまでは、想像してもよいかもしれない。私がそう考えるのは、「烏帽子折」の中の草刈山路の話が、描写が細かく、やや長々としていて、ほぼ独立した語り物の体裁を備えているからである。問題の絵姿女房は、すでにこの中にも姿を現している。とくに参考となる部分だけは、原文のまま引用しておくほうが都合がよい。

    昔、わが国の用明天皇は、十六歳になられるまで、お后もいらっしゃらなかった。あるとき公卿や殿上人を集め、扇を六十六本作らせて美しい女の絵を描かせ、国々へ回し、「どれほど身分の低い女でも、その家の娘でも、この扇の絵に似た女性がいれば、急いで内裏へ参らせよ。第一のお后としてお迎えする」と、日本じゅうへお触れを出された。そもそも、美しいものを「絵女房」と呼ぶほどである。日本は広いといっても、絵に似た女性は一人もなく、扇は都へ戻ってきた。

    そうはいっても、筑紫の豊後国、内山里という所に長者が一人いた。四方に四万の倉を建て'
  notes:
  - 冒頭はscan183から、末尾はscan185に続く。
  - 地名は字形を「了鬟山」と読み、原ルビは「かむろ」。初字にはなお字形上の留保があるため、訳は「かむろ山」とした。
  - 「賤の女・賤の子」は当時の身分意識に基づく表現。「傀儡」はここでは芸能を生業とした人々を指す。
  - 原著が原文で引く「烏帽子折」の引用も省略せず現代語訳した。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。

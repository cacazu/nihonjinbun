  section: 海神少童
  original: '一はなたれ小僧樣

    最初に私は五つの著名なる今日の御伽噺が、どうやら互ひに關係の有るもので、五つ別々

    に成育して來たのでは無いらしいといふことを述べて見た。此次にはずつと懸離れた各府縣

    の昔話の中に、是と緣があつてしかも忘れられて居たものが、幾つか有るといふことを說く

    のが順序である。昔話は傳說とちがつて、記憶する者が自身之を信ぜず、從つて人をして信

    ぜしむる必要が無く、其記憶は亦多く子供の時のものであつた故に、きまじめに之を我々に

    向つて談る人が稀であつて、今まで其採集は一向に進んで居なかつたが、其代りには下手な

    研究者によつていぢくり廻されて居らず、一つ見つかると一つだけの新らしい暗示が得られ

    る。問題はそれが餘りにひどく壞れてしまはぬうちに、どうすれば精確に出來るだけ多くを

    記錄して置かれるかであるが、仕合せなことにはこの十數年以來、思ひがけぬ地方から幾人

    かの優れた傳承者が現れて、熱心なる採集家と遭遇したものもあれば、或は自身直接に其記

    憶を筆にしようとした者もあつた。初期の若干の記錄の互ひに相知らず、何等の豫測無くし

    て偶然に一致して居るものは、特に將來の研究の爲に貴重なる資料であるが、其中でも國の

    南北の兩端に於て、古來一度も比較を試みられたことの無かつたものが、始めてこの採集に

    よつて顯著なる類似を認められ、もしくは意味有りげな部分的の相異を注意せられるに至つ

    たのは、寔に我々にとつては逸すべからざる機會と言ふべきである。徒らに採集の完備を期

    して、再び書册の不當なる統一の爲に、所謂五大噺の如き混亂を招かぬ樣にしなければなら

    ぬと思ふ。

    そこで先づ最も意外なる九州の一つの例を援用して、桃太郞說話の古い姿を尋ねて行く栞

    にして見たいのである。是は熊本縣でも北の境、玉名郡の眞弓といふ山中の小部落に、長く

    傳へられて居る昔話であつて、其話の中に出て來る南關の町に生れた、多田隈正巳君の報告

    する所であつた(旅と傳說二卷七號)。主人公はハナタレ小僧樣などといふをかしな名をもつて'
  translation: '一　はなたれ小僧様

    最初に私は、今日よく知られている五つのおとぎ話が、どうやら互いに関係を持ち、それぞれ別々に育ってきたのではないらしい、ということを述べてみた。次には、遠く離れた各府県の昔話の中に、これらとつながりがありながら忘れられていたものが、いくつかあることを説明するのが順序である。昔話は伝説とは違って、覚えている人自身がその内容を事実として信じていない。したがって、人にも信じさせる必要がなく、その記憶も多くは子供のときのものなので、私たちに向かってまじめに語ってくれる人が少なく、これまで採集はまったく進んでいなかった。だがその代わり、未熟な研究者によってむやみに手を加えられておらず、一つ見つかれば、それだけ新しい手がかりが得られる。問題は、ひどく崩れてしまわないうちに、どうすればできるだけ多くを正確に記録しておけるか、ということである。幸い、この十数年来、思いがけない地方から何人かの優れた伝承者が現れ、熱心な採集家と出会った人もあれば、自分で直接その記憶を書き留めようとした人もあった。初期のいくつかの記録で、互いの存在を知らず、何の予想もせずに偶然一致しているものは、とりわけ将来の研究のために貴重な資料である。中でも、日本の南北両端にあり、昔から一度も比較されたことのなかったものに、今回の採集によって初めて著しい類似が認められたり、意味がありそうな部分的な違いに注意が向けられたりしたのは、まさに私たちが逃してはならない機会というべきである。ただ採集の完成ばかりを待っていて、また本による不当な統一のために、いわゆる五大噺のような混乱を招くことのないようにしなければならないと思う。

    そこでまず、最も意外に思われる九州の一例を取り上げ、桃太郎の物語の古い姿を探る手がかりにしてみたい。これは熊本県でも北の境にある、玉名郡真弓という山中の小さな集落に、長く伝わっている昔話である。その話に登場する南関の町に生まれた、多田隈正巳君が報告したものであった（『旅と伝説』二巻七号）。主人公はハナタレ小僧様などというおかしな名前で'

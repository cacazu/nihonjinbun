  section: 隣の寝太郎／一 治水拓土の功績
  original: 一 治水拓土の功績昨年春頃のことであつたか、大阪朝日新聞の山口版に、長州厚狹驛の寢太郞荒神の由來談が、木像の寫眞を添へて詳しく掲げられて居た。寢太郞は三年三月の間寢通して、貯への穀物を食ひ盡してしまつた惰け者であつたが、人の知らぬうちに大川の水を引く工夫を凝らし、千町步の荒地を開發して、忽ち大福長者になつたといふ偉人である。二百十歲まで長生したなどとも傳へられる。寢太郞荒神はその寢太郞を祀つたとも謂へば、又寢太郞の守り神であつたとも謂つて一定せぬが、兎に角に百年餘も前から其名の社があつたことだけは、文政六年の溫山紀行にも明かに見えて居る(地名辭書)。それが近頃になつて急に名高くなつたのは、一つには此地が萩線の分岐點として、多くの旅客が足を留めることになつたのと、今一つは名物寢太郞餅の宣傳であらうと思ふ。私はこの餅の起り、乃至はどうして餅と寢太郞とを結び付けることになつたかを、誰よりも熱心に知りたがつて居る。其理由は是から述べて見ようと思ふが、事によると是も桃太郞の黍團子、もしくは蛙の聟殿の袋の餅などと、同じ「話の種」の幽かなる痕跡かも知れぬからである。寢太郞荒神は、又庚申と思つて拜んで居る人も多かつた。御神體の木像は福相で、寧ろ庚申よりも甲子の大黑樣の方に近かつたが、以前は此地方の農民たちが、藁で製した猿を奉納して農作を禱つたといふから、祭日も恐らく庚申の日であつたらう。此日は我々の昔話の爲にも、特に大切なる日であつた。庚申待と稱して講中の人々が、當番の家又は堂宮に集まつて神を祭り、夜通し面白い話をして明かすことは、全國農村の近い頃までの風習であつた。乃ち多くの昔話はこの庚申講の夜と聯想せられて居たのである。次にはその社のある處を寢太郞屋敷、土地を寢太郞町と謂ふ人があつたのも、若し寢太郞長者が實在の人物で無いとしたら、甚だ不可解のやうに見えるかも知れぬが、私には格別意
  translation: '一　治水と土地開発の功績

    昨年の春ごろだっただろうか。『大阪朝日新聞』の山口版に、長州の厚狭駅にある寝太郎荒神の由来が、木像の写真を添えて詳しく掲載されていた。寝太郎は三年三か月のあいだ寝続け、蓄えてあった穀物を食べ尽くした怠け者だったが、人に知られないうちに大川の水を引く方法を工夫し、千町歩の荒れ地を開いて、たちまち大金持ちになったという偉人である。二百十歳まで長生きしたとも伝えられる。寝太郎荒神は、その寝太郎を祭ったものだとも、寝太郎の守り神だったともいわれ、話が一定しない。しかし、とにかく百年以上前からその名の社があったことだけは、文政六年の『温山紀行』にもはっきり記されている（『地名辞書』）。それが近ごろ急に有名になったのは、一つには、この土地が萩線の分岐点として、多くの旅客が足をとめる場所になったこと、もう一つには、名物の寝太郎餅の宣伝によるのだろうと思う。

    私はこの餅の起源、あるいは、なぜ餅と寝太郎とを結びつけるようになったのかを、誰よりも熱心に知りたがっている。その理由はこれから述べようと思うが、ひょっとするとこれも、桃太郎のきび団子や、蛙の婿殿の袋に入った餅などと同じ「話の種」が、かすかに残った跡なのかもしれないからである。寝太郎荒神は、庚申だと思って拝んでいる人も多かった。ご神体の木像は福々しい顔をしていて、庚申というよりは甲子の大黒様に近かった。しかし以前、この地方の農民は、藁で作った猿を奉納して作物の実りを祈ったというから、祭日もおそらく庚申の日だったのだろう。この日は、私たちの昔話にとっても、とりわけ大切な日だった。庚申待といって、講の仲間が当番の家やお堂・神社に集まり、神を祭って、夜通し面白い話をしながら夜を明かすのは、全国の農村でつい近ごろまで行われていた習慣である。つまり、多くの昔話は、この庚申講の夜と結びつけて思い出されていたのである。

    また、その社のある場所を寝太郎屋敷、土地を寝太郎町という人がいたことも、もし寝太郎長者が実在の人物でなかったなら、とても理解できないことに見えるかもしれない。しかし私には、とりたてて意外なこととも……'
  notes:
  - scan144は「鄰の寢太郞」の章扉であり、本文は本scanから始まる。末尾の文はscan146に続く。
  - 庚申待は庚申の夜に集まって夜を明かす信仰行事。甲子は六十干支の一つで、大黒天の祭日として信仰された。千町歩は当時の土地面積表現を保持した。

  section: 瓜子織姫／諸國の瓜子姫
  original: 'クのオリヒメ子が、お嫁になつて駕籠に乘らうとした時に、鶯が飛んで來て其駕籠にとまつ

    て、

    オリヒメ子ア駕籠さ

    アマノジヤク乘つた、ホウホケキヨ

    と鳴いて、何處へか飛んで行つた。

    (此話の栗の木は、遠く離れた出雲石見の柿の木、信州や日向の梨の木も同樣で、當初眞假

    二人の瓜子姫の葛藤が、一本の果樹を中心として起つた樣に、語られて居た痕跡かと思はれ

    るが、奥羽の方面では他にはまだ其例を知らぬ。猿蟹合戰の柿の木が是と緣を引くことは前

    にも述べたが、事によると桃太郞の桃までも、こゝから導かれて來て居るのかも知れぬ。贋

    物の瓜子姫が顏を洗つて、發覺したといふ例は東北に多いが、鳥の鳴聲によつて教へられる

    といふ話よりも後のものであつたらしい。爰ではその二つが重複して、過渡期の混亂を示し

    て居る。それから尙一つ、順序は後先になつたが、岩手縣北部の變つた例を載せると)、

    一七下閉伊郡岩泉町(同上書三七六頁)

    爺と婆とが子供が無いので、欲しい欲しいと思つて神樣に願掛けした。或朝瓜畠に行つて見

    ると、瓜畠のまん中に美しい女の子が一人居た。これア神樣の御授けだと思つて、喜んで拾

    つて來て瓜子の姫子と名を付けて大事に育てた。爺樣婆樣は山さ薪採りに行く。誰が來ても

    戶を開けんな、此邊は狼がひどえしけに、と云つて置いて出て行つた。其あとで瓜子の姫子

    は、一人でトンカラ·ヒンカラと機を織つて居る。そこへ山の狼が、瓜子の姫子、遊んべや

    アと言つて遣つて來た。(それから段々の問答があつて結局)瓜子の姫子は爼板の上へ横にな

    ると、狼は庖丁で頭だの手だの足などを切つて、あゝうめやエうめやえと言つて食つた。さ

    うして骨こは椽側の下に匿して殘つたのを煮て居た。夕方に爺と婆とは山から歸つて來て、

    薪をがら〳〵と下して瓜子の姫子、今歸つたぞと言ふと、瓜子の姫子に化けて居た狼は、さ

    アさ腹がへつて來たごつたから、早くまんま食つとがれと言ふ。爺と婆とは瓜子の姫子を煮

    た汁を、あゝうんめアうんめアと言つて食ふと、その狼は

    板場の下を見さ

    骨こ置いたが見ろやエ見ろやエ'
  translation: 'クが化けたオリヒメ子が、お嫁さんになって駕籠に乗ろうとしたとき、鶯が飛んできて駕籠に止まり、

    「オリヒメ子の駕籠に、

    アマノジャクが乗った、ホウホケキョ」

    と鳴いて、どこかへ飛んでいった。

    （この話の栗の木は、遠く離れた出雲・石見の柿の木、信州や日向の梨の木も同様だが、もともと本物と偽物の二人の瓜子姫の争いが、一本の果樹を中心に起こったという形で語られていた、その痕跡ではないかと思われる。ただ、奥羽地方では、ほかにまだ例を知らない。猿蟹合戦の柿の木がこれにつながることは前にも述べたが、ひょっとすると桃太郎の桃までも、ここから導かれてきたのかもしれない。偽の瓜子姫が顔を洗って正体を見破られたという例は東北に多いが、鳥の鳴き声によって知らされるという話より後にできたものらしい。ここでは二つが重なり、過渡期の混乱を示している。それからもう一つ、順序が前後したが、岩手県北部の変わった例を載せると、）

    十七　下閉伊郡岩泉町（同書三七六ページ）

    お爺さんとお婆さんには子供がいなかったので、欲しい欲しいと神様に願をかけた。ある朝、瓜畑へ行くと、畑の真ん中に美しい女の子が一人いた。これは神様からの授かりものだと思い、喜んで拾ってきて、「瓜子の姫子」と名づけ、大切に育てた。二人は山へ薪を取りに行く。「誰が来ても戸を開けるな。このあたりは狼がひどく出るから」と言い置いて出かけた。そのあと瓜子の姫子は、一人でトンカラ・ヒンカラと機を織っていた。そこへ山の狼が、「瓜子の姫子、遊ぼうよ」と言ってやってきた。（それからいろいろやりとりがあって、結局、）瓜子の姫子がまな板の上へ横になると、狼は包丁で頭や手や足を切り、「ああ、うまいなあ、うまいなあ」と言って食べた。そして骨を縁側の下へ隠し、残りを煮ていた。

    夕方、お爺さんとお婆さんが山から帰り、薪をがらがらと下ろして、「瓜子の姫子、いま帰ったぞ」と言うと、瓜子の姫子に化けた狼は、「さあさあ、お腹がすいてきたでしょうから、早くご飯をお食べなさい」と言った。二人が、瓜子の姫子を煮た汁を「ああ、うまい、うまい」と食べると、その狼は、

    「板の間の下を見なさい。

    骨を置いておいたから、見ろやえ、見ろやえ」'
  notes:
  - 冒頭はscan94、末尾はscan96へ続く。
  - 「奥羽」は陸奥・出羽、現在の東北地方を指す歴史的地域名。

  section: 海神少童／龍宮小僧
  original: 此小僧を埋めたと言ひ傳へて居る。榎の近くからは清水が湧いて、今尙中シゲ全體の田を灌漑して居るといふことである。此點はヒヨウトクが死んで竈の神になつたといふ昔話と、比較をしてみなければならぬ一つの要件であると思ふ。蓼汁の奇拔なる特徴にも亦類似があつた。爰から山嶺を隔ててさまで遠くない天龍川の右岸三州市原の田原家では、屋敷のすぐ下が靑淵になつて居て、いつも河童が出て來て農作の手傳をしたり、客來の折には必ず鯇魚を二尾づつ、川から捕つて來て臺所口に置いてくれたりした。此河童は平日は同家の竈の上に住まつて居たと謂ひ、又は釜の蓋の上であつたともいふが、兎に角姿は人間の通りで、圓座に坐つて御器で御飯を食つたさうで、其御器は缺けては居るが今も傳はり、圓座も三十年前までは大事に保存してあつた。いつの頃の事か此家の召使が、誤つて河童に蓼汁を食はせたところが、非常に苦しがつて天龍川に轉がり落ちて、其まゝ還つて來なかつた。其時に屋敷續きの廣々とした前畠を、薙ぎを起して突き崩して行き、それ以來家運も追々衰へたと謂つて居る。同じ北設樂郡の振草村小林にも大谷地といふ舊家があつて、屋敷の下を流れる振草川にスミドン淵といふ淵があつたが、此淵のカハランベ(河童)も每年田植の手傳ひに來たり、又膳椀を貸してくれたりした。此邊でゴンゲノボウと稱する田植祝の日には、姿こそは見えなかつたが、昔から上座へ一人前の膳をすゑる例になつて居た。後に此家の者がそれを煩はしく思ふやうになつて、或年のゴンゲノボウに馳走の中へ蓼をまぜて置いた。河童はそれを喰つて、おゝ辛おゝ辛と叫びながら、谷を轉がつて振草川に落ちて行つたが、それ以來淵は淺くなり、其舊家も何かにつけて不仕合が續いて、衰微してしまつたと傳へて居る。それから又天龍川の上流、信州下伊那郡の大下條村にも似た話があつた。此村字川田の大家といふ家の後に、一坪ほどの井戶のやうな池があり、昔は此池に手紙を書いて浮べて置くと、膳椀を貸してくれた。又その池からカハランべが、田植に手傅ひに來たり鋤鍬の類も貸してくれた。田植の忙しい際には竈の火も焚いてくれた。それが或時此家の主人が、田植振舞のオセチの中へ蓼を混ぜて食はせてからは、手傅ひにも來なくなり、又膳椀も貸してくれなかつたといふ。遠州の側でも同じ川の對岸、奥山の草木といふ部落に、オトボウ淵といふ淵があつて、其傳說が亦よく似て居た。昔この近くに大きな物持があつて、淵の主と懇親を結び、是は膳椀を借りるのでは無くて、金錢の融通を
  translation: 'この小僧を埋めたと伝えている。榎の近くからは清水が湧き出し、今でも中シゲ全体の田を潤しているという。この点は、ヒョウトクが死んでかまどの神になったという昔話と、比較してみなければならない大切な要素の一つだと思う。

    蓼汁という、この一風変わった特徴にも、似た例があった。ここから山並みを隔てて、それほど遠くない天竜川右岸、三河の市原の田原家では、屋敷のすぐ下が青淵になっていて、いつも河童が出てきて農作業を手伝った。また、客のあるときには必ず川から鯇魚を二尾ずつ捕ってきて、台所口に置いてくれた。この河童は、ふだんは同家のかまどの上に住んでいたといい、釜の蓋の上だったともいう。ともかく姿は人間と同じで、円座に座り、お椀で飯を食べたそうである。その椀は欠けているものの今も伝わり、円座も三十年前までは大切に保存されていた。

    いつ頃のことか、この家の召使いが誤って河童に蓼汁を食べさせると、河童はひどく苦しみ、天竜川へ転がり落ちて、そのまま戻ってこなかった。その際、屋敷に続く広々とした前畑に地滑りを起こして崩していき、それ以来、家運も次第に衰えたという。

    同じ北設楽郡の振草村小林にも、大谷地という旧家があり、屋敷の下を流れる振草川にスミドン淵という淵があった。この淵のカハランベ（河童）も、毎年田植えの手伝いに来たり、膳や椀を貸してくれたりした。このあたりでゴンゲノボウと呼ぶ田植え祝いの日には、その姿こそ見えなかったが、昔から上座に一人前の膳を据える習わしがあった。後にこの家の者が、それを面倒に思うようになり、ある年のゴンゲノボウに、御馳走の中へ蓼を混ぜておいた。河童はそれを食べると、「ああ辛い、ああ辛い」と叫びながら谷を転がって、振草川に落ちていった。それ以来、淵は浅くなり、その旧家も何かにつけて不運が続き、衰えてしまったと伝えている。

    さらに天竜川上流の、信州下伊那郡大下条村にも、よく似た話があった。この村の川田という小字にある「大家」という家の裏に、一坪ほどの、井戸のような池があった。昔は、この池に手紙を書いて浮かべておくと、膳や椀を貸してくれた。また、その池からカハランベが田植えの手伝いに来たり、鋤や鍬の類も貸してくれたりした。田植えで忙しいときには、かまどの火まで焚いてくれた。それがあるとき、この家の主人が、田植えの御馳走であるオセチの中に蓼を混ぜて食べさせてからは、手伝いにも来なくなり、膳や椀も貸してくれなくなったという。

    遠江側でも、同じ川の対岸、奥山の草木という集落に、オトボウ淵という淵があり、その伝説もよく似ていた。昔、この近くにたいへんな金持ちがいて、淵の主と親しく交わり、この場合は膳や椀を借りるのではなく、金銭の融通を'

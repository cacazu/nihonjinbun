- id: mmt-096-01
  scan: 96
  section: 瓜子織姫／諸國の瓜子姫
  original: 'と言つて、狼になつて山ささつさと遁げて行つた。そして爺樣と婆樣とは又二人つこになつ

    た。

    (此話はもう著しくかち〳〵山の中段と似て居る。山で爺に生捕られたといふ部分も、奥州

    には狸で無くて、狼になつて居るものが多いのである。佐々木君の聽耳草紙には、七つの瓜

    子姫說話を集錄して居る。その內の四つはこゝに列擧して置いた。殘りの三つの一つは上閉

    伊郡に行はるゝもの(四)、今一つは和賀郡の一例として(一)、共に本章に引用した話を、も

    う一度精細に記述したに過ぎない。最後の一話は新らしい採集であるが、その採集地を明示

    して無い爲に、之を分布の資料に供することが出來なかつた。其筋は大體に第三の例と似て

    居るが、彼には山母と謂つて居るのを、是には亦アマノジヤクの所業として居り、其上に嫁

    入の途中で鳥が啼いて、教へてくれたといふ條が附加はつて居るが、結末は嫁御に顏を洗は

    せたら、化の皮が剝げたといふことは彼と同じである。それから尙一つ、瓜子が機を織る時に

    管無つちや、ばんばなや

    といふ唄をうたつたといふ點が、前の鹿角郡の「くだこア無くてからんころん」の外に、遠い

    石見國の昔話とも似て居るのは一奇である。石見の方でもお姫さんが每日機を織るのに

    爺さんさいが無い、婆さん管が無い

    キーリバツタンスツトントン

    と織つたと謂つて居る。是は恐らく織女の常の言葉であつたらうと思ふが、それにしても永

    く無心の間に保存せられたのは面白いと思ふ。瓜子姫子が野老が好きであつて、それをアマ

    ノジヤクが食べ方を知らぬので、にせ者であることがわかりかけるといふ點は、次の二つの

    例の中にも出て來る。是も亦偶然に保存せられた古へぶりであつたと思ふ。)

    一八會津若松市(堀氏夫人)

    瓜姫は野老が好きであつたので、爺と婆とはいつもそれを掘つて來て食べさせた。或日二人

    が野老を採りに出たあとで、アマノジヤクが遣つて來て機を織つて居る瓜姫を誑いて、强ひ

    て戶を明けさせて內に入つて食つてしまひ、自分が瓜姫に化けて機を織つて居る。そこへ父

    母が歸つていつもの通り野老を與へると、贋の瓜姫は野老の食べ方を知らず、毛も皮も取ら

    ずに食はうとするので、親たちは之を見て恠しく思ふ。其うちに瓜姫の美しいことが殿樣に'
  translation: 'と言って、狼の姿になり、山へさっさと逃げていった。そしてお爺さんとお婆さんは、また二人きりになった。

    （この話は、すでに「かちかち山」の中ほどの部分と非常によく似ている。山でお爺さんに生け捕りにされたというくだりも、奥州には狸ではなく狼になっている話が多い。佐々木君の『聴耳草紙』には、七つの瓜子姫の話が収められている。そのうち四つをここに挙げておいた。残る三つのうち一つは上閉伊郡に伝わるもの（四）、もう一つは和賀郡の一例として（一）、どちらもこの章に引用した話を、改めて詳しく記述したものにすぎない。最後の一話は新たに採集されたものだが、採集地が明記されていないため、分布を調べる資料には使えなかった。その筋はおおむね第三の例に似ている。ただし、そちらでは山母と呼んでいるものを、こちらではやはりアマノジャクの仕業としている。そのうえ、嫁入りの途中で鳥が鳴いて教えてくれたというくだりが加わっているが、最後にお嫁さんに顔を洗わせると化けの皮がはがれたという点は、そちらと同じである。

    それからもう一つ、瓜子が機を織るときに、

    「管がないよ、ばんばなや」

    という歌を歌ったという点が、前に挙げた鹿角郡の「くだこア無くてからんころん」だけでなく、遠い石見国の昔話にも似ているのは不思議だ。石見の方でも、お姫さんが毎日機を織るのに、

    「爺さん、さいがない。婆さん、管がない。

    キーリバッタン、スットントン」

    と歌って織ったという。これはおそらく機織り女が日頃使っていた言葉だったのだろうが、それにしても、意識されないまま長く保存されたことは面白いと思う。瓜子姫子が野老を好きで、それをアマノジャクがどう食べるか知らないため、偽物だとわかりかけるというくだりは、次の二つの例にも出てくる。これもまた、偶然に保存された古い習わしだったと思う。）

    十八　会津若松市（堀氏夫人）

    瓜姫は野老が好きだったので、お爺さんとお婆さんは、いつもそれを掘ってきて食べさせていた。ある日、二人が野老を採りに出たあと、アマノジャクがやってきて、機を織っている瓜姫をだました。無理に戸を開けさせて中へ入り、食べてしまい、自分が瓜姫に化けて機を織っていた。そこへ父母が帰り、いつものように野老を与えると、偽の瓜姫は食べ方を知らず、毛も皮も取らずに食べようとするので、親たちはそれを見て怪しく思った。そのうち、瓜姫が美しいという評判が殿様に'
  notes:
  - 冒頭はscan95、末尾はscan97へ続く。
  - 野老（ところ）は、食用にしたヤマノイモ科の植物。
  - 歌の「ばんばなや」「さい」は地方の織り歌の語形として保持。管（くだ）は機織りに使う糸巻き。

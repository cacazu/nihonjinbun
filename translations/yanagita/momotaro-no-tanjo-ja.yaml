  original: 上から、所謂音に聞きし千島の都まで、いつでも笛を吹いて征服の目的を遂げたといふ、多くの冒險譚の生れた由來は知ることが出來ない。どうせ記錄にも出て居ない人の事蹟を想像する程ならば、寧ろ笛を義經に賣つたといふ淀の津の彌陀次郞などの身の上を、考へて見る方が近路のやうに私は思ふ。私は最初この山路の草苅の著名になつた原因は、古くから傳はつて居た面白い舞の手の印象であらうと考へて居たが、今はそれよりも强い力が、之に伴なふ笛の曲に、在つたのでは無いかと思ふやうになつた。卽ち昔も人類文藝の最も興味ある題目として、殊に傾聽せられて居た美女と英傑との婚姻譚の中に、必ず篠笛の或る定まつたメロデイを以て、人を異常の昂奮に誘ふを例とするものがあつて、たま〳〵その一つの型が舞の本、もしくは之を承繼いだ淨瑠璃御前の物語に、保存せられて居たやうに考へられて來たのである。笛が端的に我々の戀の音樂であつたことは、日本では尙鮮かな記憶である。今でも夏の風がそよ〳〵と闇を吹く頃になると、私の住む村でも近きあたりの靑年たちの、覺束ないセレナードを聽いて微笑することが每度ある。しかし山路童子が黃牛の背に凭つて、夜深く吹き澄ましたといふ笛の曲は、固よりこの樣なしどけない、且つ凡庸なもので無かつたに相違ない。元を忘れてしまつた後代の作者にも、尙之を神の王子の妻もとめに托して、解說しなければならぬ樣な一種神祕の音調が、いつの世からとも無く取傳へられてあつたことは推測し得られる。私は韻律にかけては誰よりも耳が惡いが、それでも神樂や能の舞の、いつも定まつた個處にくり返さるゝ笛の音を聽き知つて、必ず此中には上古我國の神婚姻の神話を、裏づけて居た音樂の破片が保存せられ、それがやがては又其笛の調べから、探り當てられる日の來るべきことを、信ぜずには居られないのである。言葉に表はす途は知らなかつたけれども、多くの昔の人たちは心には之を記憶して居た。單なる記錄文字の表示する以上に、この山路の草苅や海道下りの古曲が、大きな感動を與へて居たのは其結果であつたらうと思ふ。我々の持ち傳へて居る民間說話の中には、又他の一面からこの以前の心持を推測せしめるものがある。近頃採集せられた越後森町村の昔話に、むかし笛吹きの上手な男があつて、その笛の音が天に屆き、天上の國から美しい嫁を貰ふことになつたといふのがあつた(岩倉市郞君報)。殿樣が其女房を橫取りしようと思つて、三つの無理難題を笛吹男に言ひ掛ける。そ
  translation: '上から、名に聞く千島の都まで、いつも笛を吹いて征服という目的を果たしたという、数多くの冒険物語が生まれた由来は、知ることができない。どうせ記録にも出ていない人物の事績を想像するくらいなら、むしろ笛を義経に売ったという淀の津の弥陀次郎などの生涯を考えてみるほうが、近道のように私には思われる。

    私は初め、この「山路の草刈」が有名になった原因は、古くから伝わっていた面白い舞の振りの印象だろうと考えていた。しかし今では、それ以上に強い力が、舞に伴う笛の曲にあったのではないかと思うようになった。つまり昔も、人間の文芸で最も興味深い題材として、とりわけ熱心に聞かれていた美女と英雄の婚姻物語の中には、必ず篠笛のある決まった旋律によって、人を尋常でない興奮へ誘うことを常とするものがあり、その一つの型が、たまたま『舞の本』、あるいはそれを受け継いだ浄瑠璃御前の物語に保存されていたように思われてきたのである。笛が端的に私たちの恋の音楽だったことは、日本ではまだ鮮やかな記憶として残っている。今でも夏の風がそよそよと闇を吹き渡るころになると、私の住む村でも近所の青年たちの、心もとないセレナードを聞いて微笑むことがたびたびある。しかし山路童子が黄色い牛の背に寄りかかり、夜更けに澄んだ音で吹いたという笛の曲は、もちろんこのようにしまりがなく、ありふれたものではなかったに違いない。起源を忘れてしまった後世の作者にも、なお神の王子の妻探しに託して説明しなければならないような、ある種の神秘的な音調が、いつの時代からともなく伝えられてきたことは推測できる。私は韻律に関しては誰よりも耳が悪いが、それでも神楽や能の舞で、いつも決まった箇所に繰り返される笛の音を聞き分けると、この中には必ず、日本の上古の神々の婚姻神話を裏づけていた音楽の断片が保存されており、やがてはその笛の調べから、それを探り当てられる日が来ると信じずにはいられない。言葉で表す方法は知らなかったけれども、昔の多くの人々は心の中でそれを記憶していた。単なる記録の文字が示す以上に、この「山路の草刈」や「海道下り」の古い曲が大きな感動を与えていたのは、その結果だったのだろうと思う。

    私たちが受け継いできた民間説話の中には、別の側面からこの昔の心持ちを推測させるものもある。近ごろ採集された越後森町村の昔話に、昔、笛の上手な男がいて、その笛の音が天に届き、天上の国から美しい嫁をもらうことになったという話があった（岩倉市郎君の報告）。殿様はその妻を横取りしようと思い、笛吹きの男に三つの無理難題を言いつける。そ'

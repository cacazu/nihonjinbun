  original: 相州津久井の話は鈴木重光君も內鄕村話四四頁の中に報告して居る。重箱に赤飯を詰めて穴の口まで持參して還つて來ると、返禮には兎や雉子などを其重箱に入れて、夜の間に返しに來るさうだといふ說さへあつた。三河の長篠では今九十何歲の老女、若い頃に近所の女房たちと共に、赤飯を炊いて山の犬の產見舞に行つたことがあると、話したことを早川君も記してゐる(猪·鹿·狸七七頁)。野州那須郡では淸水文彌翁の鄕土史話に、每年四月八日から月末までのうちに、狐樣山犬樣の初衣祝と稱して、村内各戶より米錢を集め、油揚わかさぎなどを調理して狐塚に供へる。是をするのは狐山犬が、いたづらをせぬ樣にといふ趣意であつたとある。此記事は一寸混亂して居るからもう一度聞合はす必要があるが、兎に角に狐だけでは無く狼にも物を贈り、それを初衣祝と名けて居たことはあるらしいのである。陸前の狼河原を始として、狼をよく祭らぬと野獸の害が怖いと謂つて、食物を供して居た慣習は方々にあるが、それのみでは特に人間と同樣に產養ひの禮儀を守つて居た理由は解釋し得ない。關西に弘く行はれて居る寒中の狐施行にも、稻荷下しを賴んで狐の口を寄せる時、先づ御眷屬が何人あるかを尋ねて、食物の分量を多くし少なくするのは普通であるから、この二つの贈遺は起りに於て似寄つたものであつたらしい。さうして自分は其起原を山の神の信仰と見て居るのであるが、是も「山の人生」にあらまし述べたから、此場合には餘り深入りをしない。兎に角に狼に御產の聯想の有ることだけは、少なくとも土佐の野根山のみの偶然では無く、それが駿河の朝比奈氏の祖先の如く、人に非凡の子を供與した傳說などの有るのを見ると、鍋を被つて來て產婦を噉はうとしたといふ類の變化譚などは、寧ろ後代の複合に基づく一種の新展開であらうと考へられ、從うてこれ一つから其由來を斷ずることは、無理といふことになるのである。七　狼と赤兒飛驒と山一重を隔てた信州の北安曇郡にも、人と狼の交渉した記錄は多く存し、それが大抵は亦平和なるものであつた。北安曇郡鄕土誌稿口碑篇の一·二に載せられたやうな村々の話は、今後も尙集積することが出來さうである。小谷の北境に近い中土村の奉納では、山奥に犬のへやといふ洞があつて、そこには狼が住んで居た。昔は狼のことを山の神樣といひ、
  translation: '相州津久井の話は、鈴木重光君も『内郷村話』四四頁で報告している。重箱に赤飯を詰め、穴の入口まで持参して帰ると、お返しに兎や雉などをその重箱へ入れ、夜のうちに返しに来るそうだという説さえあった。三河の長篠では、今九十何歳になる老女が、若いころ近所の女房たちと一緒に赤飯を炊き、山犬の産見舞に行ったことがあると話したことを、早川君も記している（『猪・鹿・狸』七七頁）。下野那須郡については、清水文弥翁の『郷土史話』に、毎年四月八日から月末までの間に、「狐様、山犬様の初衣祝」と称し、村の各戸から米と金銭を集め、油揚げやワカサギなどを料理して狐塚に供えたとある。これは狐や山犬が悪さをしないようにという趣旨だったという。この記事は少し混乱しているので、もう一度聞き確かめる必要があるが、ともかく狐だけでなく狼にも物を贈り、それを「初衣祝」と呼んでいたことはあるらしい。陸前の狼河原をはじめ、狼をきちんと祭らないと野獣の害が怖いといい、食べ物を供える習慣は各地にある。しかし、それだけでは、とくに人間と同じように出産祝いの礼儀を守っていた理由を説明できない。関西に広く行われる寒中の「狐施行」でも、稲荷下しを頼んで狐の言葉を聞くとき、まず眷属が何人いるかを尋ね、食べ物の量を増減するのは普通である。だからこの二つの贈り物は、起源の点で似通っていたらしい。そして私はその起源を山の神の信仰に求めているが、これも『山の人生』におおよそ述べたので、ここではあまり深く立ち入らない。ともかく狼に出産が連想されることだけは、少なくとも土佐の野根山だけの偶然ではない。駿河の朝比奈氏の祖先のように、人間に非凡な子を授けた伝説などがあるのを見ると、鍋をかぶってやって来て産婦を食おうとした類の変化譚は、むしろ後世の複合による新たな展開だろうと考えられる。したがって、それ一つから由来を断定するのは無理だということになる。

    七　狼と赤ん坊

    飛驒と山一つを隔てた信濃北安曇郡にも、人と狼が関わった記録が多く残り、それもたいてい平和なものだった。『北安曇郡郷土誌稿』口碑篇の一・二に載るような村々の話は、今後もまだ集められそうである。小谷の北の境に近い、中土村の奉納では、山奥に「犬のへや」という洞穴があり、そこに狼が住んでいた。昔は狼を「山の神様」と呼び、'
  notes:
  - 「産養ひ」は出産祝い・その饗応。「狐施行」は狐に食べ物を供える行事。「稲荷下し」は稲荷の神や狐の霊を呼び降ろして語らせること。「眷属」はここでは神に従う狐などを指す。
  - 「今九十何歳」は著者執筆時の年齢。

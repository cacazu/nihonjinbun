  section: 海神少童
  original: 'の名を以て呼ばるゝ一種の橙であつて、沖繩の島では此因緣に基づいて、正月七日祖先

    の祭には、必ず此果實を供へる慣習になつて居る(第五十二章)。

    この昔話は、薪を水の神に贈るといふ一節を除くの外は、大樣は肥前の黑猫に就いて話さ

    れて居るものと一つであつた。こがねの實の由來は同じ書物の中に、更にもう一つの話を記

    錄して居るが、兩者の異なつて居る點も亦一つの心强い參考であつた。昔ある貧しい百姓の

    子が、大晦日に父の家へ歸つて來る路で、女が路傍に子を抱いて立つて居るのに出逢ふ。今

    この兒が死んで埋めるのに困つて居る。鍬を借りて來る間暫らく抱いて居てくれぬかといふ。

    明日は元日といふのに穢れをも厭はず、快く抱き取つて待つて居るがいつ迄も女は戾つて來

    ない。仕方が無いので家に來て戶口にその兒を置き、父の承諾を受けて後に外に出て抱いて

    來ようとすると、非常に重くなつて居てどうしても持擧がらぬ。それを不思議に思つて父と

    共に其包みを解いて見ると、子供の屍では無くして黃金の大きな一塊であつた。それ故に今

    でも元日にはクガニーの實を以て祖神を祭るのだと謂つて居る。此「それ故に」は少しばかり

    說明の缺けた所がある。或はこの百姓の息子が孝行であり、又は其場處から橙の木が生えた

    などといふことが落ちたかと思ふ。年越の夜中に死骸を托されるといふのは迷惑の至りだ

    が、其穢れをも省みずに親切に人を助けると、忽ち報いがあつて骸と見えたのは實は黃金で

    あつたといふ話は、內地でも大歲の焚火の由來、もしくは嫁が火を消したといふ話などにな

    つて、尙各地に保存せられて居る。大晦日は前にヨケナイの話に就いて述べた如く、福分あ

    る者の必ず神の惠みを受ける日、卽ち靈界の勘定日とも名くべき日であつた。さうして女性

    が子を抱いて來て人の心を試みるといふことも、我々の昔話の極めて普通な型であつた。そ

    れが肥後の北境に於ては、龍宮から送られたるハナタレ小僧樣であつたのである。

    以前は此等の說話はそれ〴〵に別の起原をもつものと考へられて居たが、よく見ると此通

    り下に通うて居る心持があつた。悉く一つのものから變化したと迄は言ひ切れないが、少な

    くとも一方の話をする者が他の一方の話も知つて居り、言はば共同の井戶から掬み上げた色

    色の器の水であつた。此後類例の數が增加して、全國に二十も三十もの昔話が拾はれるやう

    になつたら、もつと安全に甲から乙へ移つて來た飛石の一列を指示し得るかも知れぬ。兄弟

    が亡き親の墓に參るのに、其情に厚薄があつたといふ話ならば、今昔物語にある萱草と紫苑'
  translation: 'という名で呼ばれる一種の橙で、沖縄の島ではこの由来によって、正月七日の祖先祭りには、必ずこの果実を供える習慣になっている（第五十二章）。

    この昔話は、薪を水の神に贈るという一節を除けば、おおむね、肥前の黒猫について語られているものと同じだった。こがねの実の由来については、同じ本にもう一つの話が記録されている。二つの話の違いもまた、心強い参考材料だった。昔、ある貧しい百姓の息子が、大みそかに父の家へ帰る途中、道端で子供を抱いて立っている女に出会った。「今、この子が死んでしまい、埋めるのに困っています。鍬を借りてくる間、しばらく抱いていてくれませんか」と言う。明日は元日だというのに、死の穢れも嫌がらず、快く抱き取って待っているが、いつまでたっても女は戻ってこない。仕方なく家へ帰り、戸口にその子を置き、父の承諾を得てから、外へ出て抱いてこようとすると、非常に重くなっていて、どうしても持ち上がらない。不思議に思い、父と一緒に包みを解いてみると、子供の遺体ではなく、大きな黄金の塊だった。それゆえ今でも、元日にはクガニーの実で祖先の神を祭るのだ、と言っている。

    この「それゆえ」には、少し説明の足りないところがある。あるいは、この百姓の息子が孝行だったとか、その場所から橙の木が生えた、といったことが抜け落ちたのかもしれない。年越しの夜中に遺体を預けられるというのは、この上なく迷惑なことである。しかし、その穢れにも構わず親切に人を助けると、すぐに報いがあり、遺体と見えたものが実は黄金だった、という話は、内地でも、大歳の焚き火の由来や、嫁が火を消したという話などになって、今なお各地に保存されている。大みそかは、前にヨケナイの話で述べたように、福にあずかる人が必ず神の恵みを受ける日、つまり霊界の勘定日とでも名づけるべき日だった。そして、女性が子供を抱いてきて人の心を試すということも、私たちの昔話にきわめてありふれた型だった。それが、肥後の北の境では、竜宮から送られたハナタレ小僧様だったのである。

    以前は、これらの物語はそれぞれ別の起源を持つと考えられていた。しかし、よく見ると、このように底で通じ合う心情があった。すべてが一つのものから変化したとまでは言い切れないが、少なくとも、一方の話をする人はもう一方の話も知っていた。いわば、共同の井戸からくみ上げた、さまざまな器の水だったのである。今後、類例が増え、日本全国から二十も三十もの昔話が拾い集められるようになれば、もっと確実に、一つから別のものへ移っていった飛び石の列を示せるかもしれない。兄弟が亡き親の墓へ参る際、その情愛に厚い薄いの差があったという話なら、『今昔物語』にある萱草と紫苑'
  notes:
  - 画像をまたぐ文は前後のunitと接続する。
  - 「穢れ」は死に関する歴史的な宗教観念。「内地」はここでは沖縄に対する日本本土の呼称。
  sequence: 50
- id: mmt-057-01
  scan: 57
  section: 海神少童
  original: 'などが旣に有名である。兄はわすれ草を植ゑて早く悲みを忘れんとし、弟は紫苑を栽ゑて永

    く愁の色を咲き匂はしめんとした。さうすると土の下に聲あつて、我は汝の親の骸を守る鬼

    なり。汝の孝心にめでて日の內に有るべき事を夢に見せんと謂つたとある。墓の中から呼ぶ

    者ならば祖靈であつて然るべきであるに、それが別の鬼であつたといふのには何かまだ探る

    べき意味があることと思ふ。私は是が或は前代日本人の埋葬式、その他の死に關する教法が、

    本來は水の神の信仰と交渉をもつて居たことを、暗示するものでは無いかと考へて居る。も

    つと具體的に言へば、岩穴に遺骸を收藏する慣習は、その最も奧の奥に住んで居る神と其眷

    屬に之を委託するのだといふ信仰があつた爲に、新たに人の世に送り寄せられる偉大な靈魂

    も、やはり水の底からと想像する樣になつたのではなかつたか。海を母の國と謂つた古い言

    ひ傳へは、私の知つて居る限りではまだ理由を究められて居ない。この大きな宗教史上の問

    題を解く爲にも、說話の研究は斷じて今日の如き飜譯狀態に、放置することは出來なかつた

    のである。

    一〇將來の神話學

    望みは大きかれ。しかし先づ事實を精確にしなければならぬ。現在我々の有つて居る材料

    だけでは、到底多くの斷定を下し得ないのは當り前で、諸君が安心して信じ又人に說き得る

    ことが、今はまだ僅かであるのは致し方が無い。それでも遠からず共同の注意によつて、ず

    つと前の方へ進んで行くことが出來るといふ、希望のみは明朗になつた。滿足は決して出來

    ないが張合ひのある學問だと迄は言へる。

    今度私たちの始めて知つたことは、第一に昔話の個々の變化によつて、中世民間の文藝生

    活の非常に活潑であり、貴紳文藝の擬古を専らとするものの比では無かつたことが、鮮明に

    證據立てられる點である。たとへば所謂五大御伽噺が、「話の種」は一つで部分はそれ〴〵に

    別のものの如く異つて居るといふことは、四つは少なくとも後代に斯う話しかへられたこと

    を意味する。徒らに昔話の昔といふ字に絆されて、是を上代の遺んの形と見るなどは、些か

    も理由の無い推斷であつた。第二には說話は聽く人の要求に動かされて、時代每に其興味の'
  translation: 'などが、すでに有名である。兄は忘れ草を植えて早く悲しみを忘れようとし、弟は紫苑を植えて、長く悲しみの色を花に咲かせようとした。すると土の下から声がして、「私はお前の親の遺体を守る鬼だ。お前の孝行心をほめ、その日に起こることを夢で見せてやろう」と言ったという。墓の中から呼びかける者なら祖先の霊でよさそうなのに、それが別の鬼だったという点には、まだ探るべき何かの意味があると思う。私は、これは、昔の日本人の埋葬形式や、ほかの死に関する教えが、本来、水の神への信仰と関わりを持っていたことを示唆するのではないかと考えている。もっと具体的に言えば、岩穴に遺体を納める習慣には、その最も奥に住む神と、その従者たちへ遺体を託すのだという信仰があった。そのため、新たに人間の世へ送り届けられる偉大な魂も、やはり水底から来ると想像するようになったのではないか。海を母の国と呼んだ古い言い伝えは、私の知るかぎり、まだ理由が究明されていない。この大きな宗教史上の問題を解くためにも、物語の研究を、決して今日のような、外国の研究を翻訳するだけの状態に放っておくことはできなかったのである。

    一〇　将来の神話学

    望みは大きく持とう。しかし、まず事実を正確にしなくてはならない。今、私たちが持つ資料だけでは、到底、多くの断定を下せないのは当然であり、皆さんが安心して信じ、人にも説明できることが、まだわずかしかないのは仕方がない。それでも、近いうちに共同で注意を向ければ、ずっと先へ進むことができるという希望だけは明るくなった。決して満足はできないが、やりがいのある学問だ、とまでは言える。

    今回、私たちが初めて知ったことの第一は、昔話の個々の変化によって、中世の民間の文芸生活が非常に活発で、古いものの模倣に専念していた貴族や上層の人々の文芸などとは比べものにならなかったことを、はっきり証明できるという点である。たとえば、いわゆる五大おとぎ話が、「話の種」は一つなのに、各部分はそれぞれ別のもののように違っているというのは、少なくとも四つは、後世になってこう語り替えられたことを意味する。ただ「昔話」の「昔」という字にとらわれて、それを古代から残ったままの形と見るのは、少しも根拠のない推測だった。第二に、物語は聞き手の要求に動かされ、時代ごとに、そのおもしろさの'
  notes:
  - 画像をまたぐ文は前後のunitと接続する。
  - 「飜譯狀態」は、続く外国学説への批判を踏まえ、外国の研究の翻訳に依存する状態と訳した。

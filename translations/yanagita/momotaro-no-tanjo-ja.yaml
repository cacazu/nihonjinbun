- id: mmt-176-01
  scan: 176
  section: 絵姿女房／二 桃売り殿様
  original: '二 桃賣殿樣

    孫三郞栗賣りの昔話は、勿論羽州孫在家の土に生えたもので無かつた。誰が遠い國から運

    んで來たかといふことは、その家傳の能の面以上に、尋ね難い前代の交通史であつて、それ

    を說明する史料はまだ十分に豐富とは言はれぬのであるが、例によつて手近のものから比べ

    て行くと、岩手縣には紫波郡の昔話の中に、次の樣な一話が採集せられて居る。

    或百姓の若者が、夏の日川の邊を通ると、三人の天女が水を浴びて居る。其一人の羽衣

    を木の蔭に隱したので、一人だけは天に登ることが出來ず、家に附いて來て其若者の女

    房になつた。若者は每日女房の顏ばかり見て居て、百姓の仕事を顧みない。それ程に私

    が戀しいなら、繪姿を描いてあげるから、それを畠に持つて出て、見ながら働いてござ

    いと言つて、女房は一枚の繪姿をかいてくれた。それを竹に挾んで畠の畔に立て、向ふ

    の畦を打つときは向ふに持つて行き、此方の畦を打つときは此方へ持つて來て、眺めた

    りさはつたり物を言ひかけたりして働いて居た。ところが或時不意に卷風が吹いて來て、

    竹もろともに其繪姿をどこかへ持つて行つてしまつた。それが殿樣の御殿の庭に落ちて

    來た。斯ういふ美しい女も此の世の中にはあるか。何でも探し出して連れて來るやうに

    といふことで、役人は國々を廻りあるいて、とうとう尋ね當てて御殿へ連れて行つた。

    天女は家を出て行く時に、桃の種を三つ夫の百姓に渡して、之を栽ゑて三年すると桃が

    なるから、其實を採つて御殿へ桃賣りに來て下さいと言つた。さうすると果して三年目

    に實がなつて紅く熟した。それを叺俵に入れて持つて出て、御殿の近所で桃賣ろ桃賣ろ

    と大きな聲でふれた。天女は御殿に來てから三年の間、たゞの一度も笑つたことが無か

    つたのが、此聲を聽くとにこにことして、其桃賣が見たいと言つた。それを喚入れて御

    庭先を、桃賣ろ桃賣ろとふれあるかせると、いよいよ天女は機嫌よく笑ふので、殿樣も

    大きに悅び、今度は一つおれが桃賣になつて見よう。其方はおれの座に上つて居れと言

    つて、自分の衣裝を脱いで若者に着せ、自分は桃賣のきたない衣類を着て、叺俵を擔い

    で、桃賣ろ桃賣ろと、庭中をあるきまはつた。天女は本の夫がよい衣裝を著て並んで坐

    つて居るのが嬉しいので、ますます大きな聲を出して笑ふと、殿樣はそれを自分のする'
  translation: '二　桃売り殿様

    孫三郎の栗売りの昔話は、もちろん羽州の孫在家で自然に生まれたものではなかった。誰が遠い国から運んできたのかということは、その家に伝わる能面の来歴以上に調べにくい、昔の人々の往来の歴史に関わる問題である。それを説明する史料も、まだ十分に豊かだとはいえない。しかし、いつものように身近なものから比較していくと、岩手県では紫波郡の昔話の中に、次のような一話が採集されている。

    ある百姓の若者が、夏の日に川辺を通ると、三人の天女が水浴びをしていた。そのうち一人の羽衣を木陰に隠したので、その一人だけは天に昇ることができず、家についてきて若者の妻になった。若者は毎日、妻の顔ばかり見ていて、農作業には目もくれない。妻は「それほど私が恋しいのなら、姿絵を描いてあげるから、それを畑に持っていって、見ながら働いていらっしゃい」と言って、一枚の姿絵を描いてくれた。

    若者はそれを竹に挟んで畑の畔に立て、向こうの畔を耕すときには向こうへ、こちらの畔を耕すときにはこちらへ持ってきて、眺めたり、触ったり、話しかけたりしながら働いていた。ところがあるとき、突然つむじ風が吹いてきて、その姿絵を竹ごとどこかへ持っていってしまった。それは殿様の御殿の庭に落ちてきた。「このように美しい女も、この世にいるのか。何としても探し出して連れてこい」と言われ、役人は国々を巡り歩き、とうとう探し当てて御殿へ連れていった。

    天女は家を出るとき、桃の種を三つ、夫の百姓に渡し、「これを植えて三年たつと桃がなるから、その実を採って、御殿へ桃を売りに来てください」と言った。すると、果たして三年目に実がなって赤く熟した。それをむしろで作った袋に入れて持っていき、御殿の近くで「桃売ろ、桃売ろ」と大声で呼び歩いた。

    天女は御殿に来てから三年間、たった一度も笑ったことがなかったが、この声を聞くとにこにこして、その桃売りが見たいと言った。桃売りを呼び入れ、庭先を「桃売ろ、桃売ろ」と呼び歩かせると、天女はますます機嫌よく笑う。殿様も大いに喜び、「今度はひとつ、おれが桃売りになってみよう。お前はおれの席に上がっていろ」と言って、自分の衣装を脱いで若者に着せ、自分は桃売りの汚い衣服を着て、むしろの袋を担ぎ、「桃売ろ、桃売ろ」と庭じゅうを歩き回った。天女は、もとの夫が立派な衣装を着て自分の隣に座っているのがうれしく、ますます大声で笑った。すると殿様は、自分のしている'
  notes:
  - 末尾の文はscan177に続く。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。
  - 「叺俵」はむしろを折って袋状にした容器。
  sequence: 181
- id: mmt-177-01
  scan: 177
  section: 絵姿女房／二 桃売り殿様・三 エンブの果報
  original: '事が氣に入つたのかと思つて、段々調子に乘つて門の外まで出て行く。門番の役人はび

    つくりして、此桃賣の無禮者と、うんと打擲して追出して門の戶を締めてしまつた。そ

    れで百姓の若者は殿樣になつたまゝで、永くこの御殿に天女と共に、仲よく住んで居る

    ことになつた。

    說話が外國から旣成品として輸入せられたといふ想像は、誰でも斯ういふ話を聽けば抱か

    ずには居られぬであらう。假に繪姿と云ひ掛圖といふものが、大昔から日本の田舎にあつた

    ものとしても、百姓と殿樣との身柄のすりかへ、何か皮肉なる諷刺を含むかと思はれるやう

    な、この奇拔なる貧富幸不幸の裏返しは、到底日本の農民の普通の空想では有り得ない。私

    は今尙當ても無く搜索して居るだけではあるが、豫め是が唐天竺の何れかの記錄の中から、

    其先型の發見せられるの日を期して居る。しかも我々の先祖が欣んで之を聽き、時としては

    之を事實として信じようとさへしたのは、單なる話し方や地名人名、さては桃とか栗とかい

    ふ細部の改造の爲では無く、別に以前から傳はつて居た他の昔話と複合して、寧ろ其叙述の

    一樣式の如くに、利用せられたからであらうと思ふ。羽衣と瓜子姫とは、根原に於てこそ同

    系かも知らぬが、もう此頃には明かに二つの說話であつたらう。それが二つ共に繪姿女房の

    奇譚と續いて居るのを見れば、複合は先づ疑ふ所が無いのである。問題はたゞこの新らしい

    後日談を取入れることによつて、切つて捨てられたる以前の叙述があつたか無かつたか。次

    には又何れの點が繼目であり、何が其セメントの役をして居たかといふことであるが、是も

    追々に他の地方の例を比較して行けば、丸つきりわからぬことも無いやうに思はれる。私が

    昔話の今後の採集を祈念して止まない動機も、同時に亦之に由つて諸君に認められるであら

    う。

    三エンブの果報

    繪姿女房の類話は又九州にもあつた。豐前築上郡などではその幸福な聟の名をエンブと謂

    ひ、之に伴なうてエンブガフーといふ諺も行はれて居るさうである(郷土研究三卷九號)。エン

    ブは中部日本の方言のエンバと同じく、偶然又は豫期せざることを意味する語、エンブガフ

    ーは卽ち「こぼれ幸ひ」のことだらうと思はれるが、それが稍々不明不用になつた爲に、乃ち主'
  translation: 'ことが気に入ったのかと思い、次第に調子に乗って門の外まで出ていった。門番の役人は驚き、「この桃売りの無礼者め」と、ひどく殴りつけて追い出し、門を閉めてしまった。そこで百姓の若者は、そのまま殿様となり、いつまでもこの御殿で天女と仲よく暮らすことになった。

    説話が完成した形で外国から輸入された、という考えは、誰でもこのような話を聞けば抱かずにはいられないだろう。仮に姿絵や掛け絵といったものが、大昔から日本の田舎にあったとしても、百姓と殿様の身分のすり替わり、何か皮肉な風刺を含んでいるかと思われるような、この奇抜な貧富や幸不幸の逆転は、とても日本の農民に普通の空想だったとは思えない。私は今も当てがないまま探しているにすぎないが、いずれ中国かインドの記録の中から、その先行する型が発見される日を期待している。

    しかも、私たちの先祖が喜んでこれを聞き、ときには事実として信じようとさえしたのは、単に話し方や地名・人名、それに桃や栗といった細かな部分を作り替えたためではないだろう。ほかに、以前から伝わっていた昔話と組み合わさり、むしろその語り方の一つとして利用されたためだと思う。羽衣と瓜子姫は、根本では同系統かもしれないが、このころにはもう、明らかに二つの説話になっていたはずである。その両方が絵姿女房の不思議な話に続いているのを見れば、話が組み合わされたことは、まず疑いない。

    問題はただ、この新しい後日談を取り入れたために、切り捨てられた以前の語りがあったのか、なかったのかということである。次には、どこがつなぎ目で、何がその接着剤の役を果たしたのかということになる。しかし、これも順にほかの地方の例と比較していけば、全く分からないということもなさそうに思われる。私が今後も昔話が採集されることを願ってやまない動機も、同時にこれによって皆さんに理解してもらえるだろう。

    三　エンブの果報

    絵姿女房に似た話は、九州にもあった。豊前の築上郡などでは、その幸運な婿の名をエンブといい、それに伴って「エンブガフー」ということわざも使われているそうである（『郷土研究』三巻九号）。エンブは、中部日本の方言のエンバと同じく、偶然や予期しないことを意味する語で、エンブガフーとは、つまり「思いがけず転がり込んできた幸運」のことだと思われる。ところが、それが次第に意味の分からない、使われない言葉になったため、主人'

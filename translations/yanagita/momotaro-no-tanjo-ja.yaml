  original: 其前に今日世に知られて居る若干の類話を列記して見ると、先づ伯耆國の例と地理的に接近して居るのは、雲州松江藩の家中小池某の下男、古志原の親元から夜分に歸つて來る途で狼に襲はれ、大木に遁げ登ると肩車をして後から登つて來る。僅かの處まで來て屆かぬので、早う小池の婆を呼んで來いと狼どもがいふ。やがて來たのを見れば犬ほどもある古猫であつた云々。是は高木氏の傳說集に載せられた淸水兵三君の報告の他、近年の島根縣口碑傳說集にも出て居つて一部分の異同がある。前の方の叙述では、脇差を拔いて切付けると金物の音がした。遁げて行つた跡には小池の家の茶釜の蓋が落ちて居た。それを證據に持還つて、愈〻主人のお袋樣の猫であつたことが露顯するのである。土橋里木君の甲斐昔話集に錄せられた一例は、右の茶釜の蓋は無いが、全體に昔話らしい話し方になつて居る。昔甲州の太物屋が、富士の裾野の遠ツ原で日を暮らし、枯草のにほにむぐり込んで寢て居ると、夜中に多くの山犬が出て來て嗅ぎまはすので、樹の上に登つて之を避けた。山犬はたゞ其木の周りをあるくばかりであつたが、そのうちに行つて孫太郞婆を呼ばつて來て、何とか勘辨をして貰はざアと行つて飛んで行つた。孫太郞婆といふのは一匹の虎猫の古つたれであつた。こりや犬梯を掛けるんよからずと謂つて、山犬に教へて段々に肩を踏んで登つて行かせる。その犬梯が近よつて來るので、商人はもつと高く登らうとするが、何か巢のやうなものがあつてもう上へは行かれない。それで脇差を拔いてそこを突きくじつて見ると、中に熊が寢て居たのが尻を突かれて下へ落ちる。それを追かけて見て熊だと知つて山犬どもは忌々しがり、早夜が明けるから今夜の細工にや行かぬと言つて去り、商人は命を助かつたといふのである。是も最初から斯んな結末では無かつたかも知れぬが、兎に角に婆が狼で無い點は、遠方の出雲と一致して居る。のみならず更に陸中上閉伊郡の例に至つては、話は今一段と徹底して猫であつた。佐々木喜善君の、聽耳草紙三四一頁に、昔旅人が旅から還つて來る峠の路で、猫が寄合ひをして居るのを見て、そつと樹に登つて樣子を窺うて居ると、まだ某どのゝ御頭が見えぬと謂ふ。その某といふのが自分のことであつた。そのうちに我家の古い三毛猫が遣つて來て、仲間に指圖して木や草の陰に隱れて待伏せをさせる。そこへ武士が通り掛つてその猫どもと戰ひ、最後に頭領の古猫が斬られて遁げ散る。その血を繫ぎつゝ二人で家に歸つ
  translation: 'その前に、今日知られているいくつかの類話を並べてみよう。まず伯耆の例と地理的に近いのは、出雲松江藩の家臣小池某の下男の話である。古志原の親元から夜に帰る途中、狼に襲われ、大木へ逃げ登ると、狼たちは肩車で後を追って登って来る。あと少しのところまで来ても届かないので、「早く小池の婆を呼んで来い」と狼たちがいう。やがて来たものを見ると、犬ほどの大きさの老猫だった、云々。これは高木氏の『伝説集』に載る清水兵三君の報告のほか、近年の『島根県口碑伝説集』にも出ており、一部に違いがある。前者の叙述では、脇差を抜いて斬りつけると金属の音がした。逃げ去った跡には、小池家の茶釜のふたが落ちていた。それを証拠として持ち帰り、とうとう主人の母親が猫だったことが明らかになるのである。

    土橋里木君の『甲斐昔話集』に収められた一例には、この茶釜のふたは出てこないが、全体が昔話らしい語り方になっている。昔、甲州の太物屋が富士の裾野の遠ツ原で日暮れを迎え、枯れ草を積んだ中にもぐって寝ていると、夜中に多くの山犬が出てきて嗅ぎ回ったので、木の上に登って避けた。山犬はただ木の周りを歩くだけだったが、やがて「行って孫太郎婆を呼んで来て、何とか知恵を貸してもらおう」と言って飛ぶように去った。孫太郎婆というのは、一匹の年を取った虎猫だった。「これは犬梯を掛けるのがよい」と言い、山犬に教えて、次々と肩を踏んで登らせる。その犬梯が近づくので商人はもっと高く登ろうとするが、何か巣のようなものがあって、これ以上は上がれない。そこで脇差を抜き、その場所を突き崩してみると、中で寝ていた熊が尻を突かれ、下へ落ちた。山犬たちは追いかけて見て熊だとわかると、忌々しそうに「もう夜が明けるから、今夜の仕事にはならない」と言って去り、商人は命拾いしたというのである。

    これも初めからこのような結末ではなかったかもしれないが、ともかく婆が狼ではない点では、遠くの出雲の話と一致する。それだけでなく、さらに陸中上閉伊郡の例となると、話はもう一段徹底して猫の話になっている。佐々木喜善君の『聴耳草紙』三四一頁によると、昔、旅人が旅から帰って来る峠道で、猫が寄り合いをしているのを見た。そっと木に登って様子をうかがうと、「まだ何某どのの御頭が見えない」という。その何某とは自分のことだった。やがて自分の家の古い三毛猫が来て、仲間に指図し、木や草の陰に隠れて待ち伏せさせる。そこを武士が通りかかって猫たちと戦い、最後に頭領の老猫が斬られると、猫たちは逃げ散った。その血の跡をたどりながら二人で家へ帰っ'
  notes:
  - 「太物屋」は木綿などの反物を扱う店。「勘辨」はこの方言の文脈では、考え・知恵を出してもらうことと解した。
  - 「山犬」はここでは狼を指す伝承上の呼称。

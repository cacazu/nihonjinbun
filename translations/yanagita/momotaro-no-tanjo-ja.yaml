  original: 瓜姫子、少しでいゝはんで開けてけへもう少しあけへと言つて、內へ入つてしまつた。それから瓜姫子を奧の押入の中に入れて、自分は瓜姫子に化けて待つて居た。爺と婆とはそれを知らずに、アマノシヤグに美しい着物を着せて、駕籠に乘せて嫁入させようとすると、松の木の上で烏が啼いて、瓜姫子ア乘る駕籠さアマノシヤグア乘てら、ガヲラガヲラと言つた。それを不思議に思つて駕籠の戶をあけて見ると、中にはアマノシヤグが寢て居た。駕籠を舁く人たちは大へんに怒つて、アマノシヤグをひどい目に遭はせた。さうして押入の中から本當の瓜子姫をつれ出して、殿樣の處へ嫁入をさせた。
  translation: '「瓜姫子、少しでいいから、開けておくれ」

    「もう少し開けて」

    と言って、家の中へ入り込んでしまった。そして瓜姫子を奥の押し入れへ閉じ込め、自分は瓜姫子に化けて待っていた。

    爺婆はそれを知らず、アマノシャグに美しい着物を着せ、駕籠に乗せて嫁入りさせようとした。すると、松の木の上で烏が鳴き、

    瓜姫子が乗る駕籠に

    アマノシャグが乗っている、ガヲラガヲラ

    と言った。不思議に思い、駕籠の戸を開けてみると、中でアマノシャグが寝ていた。駕籠かきたちはたいへん怒り、アマノシャグをひどい目に遭わせた。そして押し入れから本物の瓜子姫を連れ出し、殿様のもとへ嫁入りさせた。'

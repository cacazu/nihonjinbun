  sequence: 105
- id: mmt-101-01
  scan: 101
  section: 瓜子織姫／天之探女
  original: '話もある。續々鳩翁道話卷二下には、飛驒の山中で檜の長へぎを作る細工人が一人働いて居

    る處へ、背の高い山臥が不意に現はれて、何でもかでもこちらの思ふことを言ひ當てる。

    それに恐れてわく〳〵して居る際に、へぎ板の端がはねて相手の鼻柱を打つと、おのれは氣の

    知れぬ男かなと謂つて遁去つたといふのがあるが、此類の話はちやうど談義に都合のよい樣

    に寓話化しただけであつて、其起りは更に一昔古いものであつたことは、各地の例によつて

    推察し得られるのである。

    阿波でも反響は山男の口眞似だと謂つて居るさうだが、一方にはやはり是と同じ話が出來

    て居る。阿州奇事雜話中卷に、三好郡の深山で杣が小屋の中で焚火をして居る處へ、

    夜分に

    眼一つの山父が來て火にあたる。怖ろしいなと思ふと怖ろしいと思つて居るなといひ、

    殺し

    てやらうかと思ふと殺してやらうと思つて居るが、汝如きが手に合ふ者に非ずといふ。仕方

    無しに何事も思ふまいとすると、又其思案を言ひあてるので弱つて居たが、

    折ふし火に炙つ

    て撓めて居た木の端が、はねかへつて山父を彈いたのにびつくりして、

    尙人間の心のうちは

    測り難いと、急いで退散したと記して居る。近頃の話では是を桶屋が仕事をして居ると、

    一眼一脚の山父といふ恠物が來て思ふことを言ひあてる。

    そのうちに輪竹がはねて山父を打つ

    たので、其方は思はぬことをする者ぢや。

    爰に居るとどんな目に遭ふかも知れぬと言つて、

    通去つたなどといふさうである(鄕土研究二卷三七八頁)。

    說話を斯ういふ風に世間話の形にし

    て話すことは、日本特有の一つの話術であつた。

    さうして桶屋は又近代の說話輸送に、可な

    り重要な役割を引受けて居た旅人である。

    是は前代の農村生活に、非常な人望のあつた化物退治譚の、

    新らしい一分派であつたとい

    ふことが出來る。卽ち夜分に山の妖恠がのそりと遣つて來て、

    焚火の向ふ側に坐り込んだと

    いふ迄は、石の餅その他の多くの例も共通であつて、

    爰にはたゞ人の心中を探りあてるとい

    ふ一箇條のみが、要素として採り用ゐられて居るので、

    偶然かも知れぬが此話の分布する區

    域も、ほゞ瓜姫アマノジヤクのそれと重なり合つて居る。

    岩手郡昔話では御明神村小赤阪の

    彥太郞なる者、曾て葛根田の山奥に於て箕の輪曲げをして居ると、

    山姥が來てあゝ寒い寒い

    といつて焚火にあたつた。このホドアク(爐灰)を引かけてやるべえと思つて居ると、

    彥太郞

    お前はホドアクを俺さ引掛けようと思つて居るなといふ。この新らしい鉈で斬つてやらうか'
  translation: '話もある。『続々鳩翁道話』巻二下には、飛騨の山中で、檜を薄く長くはいだ板を作る職人が一人で働いていると、背の高い山伏が突然現れ、こちらの考えることを何でも言い当てる、という話がある。恐ろしくて落ち着かずにいると、へぎ板の端がはねて相手の鼻柱に当たり、「おまえは何を考えているかわからない男だな」と言って逃げ去ったという。この種の話は、ちょうど説教に都合のよいように寓話へと作り変えただけで、その起源はさらに一時代古かったことを、各地の例から推察できる。

    阿波でも、反響は山男が人の口まねをするのだといっているそうだが、そこにもやはり同じ話がある。『阿州奇事雑話』中巻には、三好郡の深山で木こりが小屋の中でたき火をしていると、夜、一つ目の山父が来て火に当たる。「恐ろしいな」と思うと、「恐ろしいと思っているな」と言い、「殺してやろうか」と思うと、「殺してやろうと思っているが、おまえのような者の手に負える相手ではないぞ」と言う。仕方なく何も考えるまいとすると、またその考えを言い当てるので困っていた。ちょうどそのとき、火であぶって曲げていた木の端がはね返って山父を打ったので、驚いて「やはり人間の心の内は測りがたい」と急いで退散した、と記されている。

    近頃の話では、桶屋が仕事をしていると、一つ目一本足の山父という怪物が来て、思っていることを言い当てる。そのうち、桶の輪にする竹がはねて山父に当たると、「おまえは思いもしないことをするやつだ。ここにいたらどんな目に遭うかわからない」と言って立ち去った、などと語られるそうだ（『郷土研究』二巻三七八ページ）。説話をこのように世間話の形で語るのは、日本特有の一つの話術だった。そして桶屋は、近代に説話を運ぶうえで、かなり重要な役割を担っていた旅人でもある。

    これは、以前の農村生活で非常に人気のあった化け物退治の話から、新しく枝分かれしたものだといえる。つまり、夜、山の妖怪がのそりと来て、たき火の向こうに座り込むところまでは、「石の餅」そのほかの多くの例と共通している。ここでは、ただ「人の心の中を探り当てる」という一点だけが要素として採用されているのだ。偶然かもしれないが、この話の分布する地域も、ほぼ瓜姫とアマノジャクの話の分布に重なっている。『岩手郡昔話』では、御明神村小赤阪の彦太郎という者が、かつて葛根田の山奥で箕の輪を曲げていると、山姥が来て「ああ寒い、寒い」と言いながらたき火に当たった。このホドアク（炉の灰）をかけてやろうと思っていると、「彦太郎、おまえはおれにホドアクをかけようと思っているな」と言う。この新しい鉈で斬ってやろうか'
  notes:
  - 冒頭はscan100、末尾はscan102へ続く。
  - 山父には原文で「やまちゝ」の振り仮名がある。
  - 「へぎ」は木材を薄くはいだ板。「箕」は穀物などをふるい分ける農具。

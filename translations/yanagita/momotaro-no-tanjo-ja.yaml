  original: つたらしいのである。蛇聟入說話の一要素、一方是が又傳說の中心として、意外に年久しく信ぜられて居た一點は、當の本人の姙める少女、もしくは其血族や從者が立聽きをしたことであつた。龍蛇は銕針の毒に苦しみ悶へつゝも、もはや人間に胤を殘したから、死んでも憾みは無いなどとうめいて居たといふのは、痛ましい古信仰の衰頽の影であつたが、しかも傳說の場合に於ては、之を保管する者は必ず其美女の出た家、卽ち水の神に奉仕した神官の家であつた。彼等の何人かが立聽きをしたと言はなかつたならば、所謂蛇聟入の神祕なる理由は、人間社會に知られ且つ傳はらない筈であつた。今日の傳說は通例外部の噂として流布して居るのであるが、私どもの經驗では其家でも多くは之を否認せず、又必ずしも恥ぢたり迷惑に思つたりしては居ないやうである。今ならば到底有り得ないさういふ不思議な話が附き纏うて居るのも、つまりは家が古く且つ土地との關係が深いからだと、人も解し我家でもさう見て居る。又一朝一夕には之を無いものにしてしまふことが出來ぬ位に、根强く且つ一般的なる信仰でもあつたらしいのである。日本の小さ子說話が、最初小さな動物の形を以て出現した英雄を說き、又は奇恠なる妻問ひの成功を中心に展開して居るといふことは、それが右申す如き神人通婚の言ひ傳への、まだ固く信じられて居た時代に始まつて居る證據として、我々に取つては可なり大切な要點であつた。然るに其點を所謂標準御伽の桃太郞のみが、何の考へも無く取除いてしまつて居たのである。それと同樣に一寸法師でも物草太郞でも、日本でならばそれが最後に神と顯はれて、永く祀られたといふわけも判るのであるが、外國の民間說話は之を單なる凡人界の出來事とし、たゞ一個極度の幸運兒の立身出世を以て、話の結末を付けることになつて居る爲に、もう其起原を究めることが大分困難な樣に見受けられる。つまりはとくの昔に神話から分離してしまつて、他にはその聯絡を暗示するだけの、何等の口碑も保存せられて居らぬ故に、假に見當はついても安全に之を論證する途が無いのである。この意味から言つて、我々はまだ賴もしい邦に生れ合せたと言ひ得る。無暗に洋人の通つた跡ばかり踏んで行かうとさへしなければ、是ほど變化しきつた桃太郞の中からでも、尙之を語り始めた人たちの心持を探つて見ることが出來る。神から送られた我々の濟ひ主は、いつでも變裝して居て最初は侮られ、後には必ず奇蹟によつて發覺するものと信じられて居たらしいのである。日本での今一つの
  translation: '……たらしいのである。「蛇婿入り」の説話の一要素であると同時に、伝説の中心としても、意外に長く信じられていたのは、妊娠した少女本人、あるいはその血縁者や従者が、立ち聞きしたという点だった。龍蛇は鉄の針の毒に苦しみもだえながらも、もう人間に子種を残したのだから、死んでも悔いはないなどとうめいていたという。これは痛ましい古い信仰の衰えの影だった。しかし伝説の場合、それを守り伝えるのは、必ずその美女が出た家、つまり水の神に仕えた神官の家だった。その人々の誰かが立ち聞きしたといわなければ、いわゆる蛇婿入りの神秘的な理由は、人間の社会に知られ、伝えられるはずがなかった。今日の伝説は普通、外部の噂として広まっている。だが、私たちの経験では、当の家も多くはそれを否定せず、必ずしも恥ずかしがったり迷惑に思ったりしてはいないようである。今なら到底ありえない、そんな不思議な話がついて回るのも、結局は家が古く、土地とのつながりが深いからだと、ほかの人も理解し、その家自身もそう見ている。また、一朝一夕にはなかったことにできないほど、根強く、広く共有された信仰でもあったらしい。

    日本の小さ子説話が、初めは小さな動物の姿で現れた英雄を語り、あるいは奇妙な妻問いの成功を中心に展開していることは、右に述べたような神と人との結婚の言い伝えが、まだ固く信じられていた時代に始まった証拠として、私たちにはかなり大切な点だった。ところが、いわゆる標準的なおとぎ話の桃太郎だけは、その点を何も考えずに取り除いてしまったのである。同じように、一寸法師でも物草太郎でも、日本なら、最後に神として現れて長く祭られた理由がわかる。ところが外国の民間説話では、これをただ普通の人間の世界の出来事として、ひときわ幸運な一人の立身出世で話を結ぶために、もはや起源を突き止めることが、かなり難しくなっているように見える。つまり、はるか昔に神話から切り離され、ほかにはそのつながりを示唆するほどの口伝えさえ保存されていないため、仮に見当はついても、確実に論証する道がないのである。こういう意味では、私たちはまだ、頼もしい国に生まれ合わせたといえる。むやみに西洋人の通った跡ばかりたどろうとさえしなければ、これほど変わりきった桃太郎からでも、語り始めた人々の心持ちを探ることができる。神から送られた私たちの救い主は、いつも姿を変えていて初めは侮られ、後には必ず奇跡によって正体が明らかになるものと、信じられていたらしいのである。日本における、もう一つの……'

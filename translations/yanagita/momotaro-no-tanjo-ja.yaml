  original: 的原因に基づくものだらうと私などは考へて居る。それ故に以前は沼湖の底深く、隱れて人間の幸福を支配する神靈の存在を想像し、是に奉仕し又外戚の親を結ぶことを、家の誇りとする迄の傳說を生じたものが、後には苧環の絲の末に針を附けて、其銕氣の毒を以て相手の身を傷うたことを說き、乃至は祕密の立聽きにより、又は保護者の智謀によつて、稀有の婚姻を全然無效のものにしたなどと說くに至つたのである。盲人がこの水神の威望の頓に失墜したに乘じて、寧ろ信任を裏切つて戟を逆しまにして之を排擊せんとしたことは、やかましく言へば生存の必要の爲に、主義を棄てて流俗に迎合したものであつた。琵琶法師が大蛇の言を洩らして、命を失うて一村の災厄を濟うたといふ話などは、ちやうどこの信仰改訂の過渡期を代表して居る。固有不變の文藝といふものを認めない我々には、素より之を目して一つの發達としなければならぬが、神話を基礎づけて居た或時代の信仰から觀るならば、是は明かに零落の迹といふの他は無かつたのである。何にもせよ、今ある蛇骨峠の鐵の杭の話などは、幾ら分布が弘くとも新らしい分布であつた。日本はその地形の上から山津浪の多い國であつて、之を一般に蛇拔けだの蛇崩れだのと謂ふ樣になつたことは事實であるが、それを此の如き手段を以て防ぐといふことは他には聞かぬのみならず、又その度每に一人づつ座頭が死なねばならぬのではたまつたもので無い。つまり何等か形跡のやゝ之に近い事件があつて、それに基づいて發生した語りごとでは無く、是も亦出羽の花都盲目の靈託と同樣に、由あつて次の代の座頭の空想に、浮び出でたる上代以来の夢であつた。そんなら今一つ以前の盲の文藝は、如何なる形のものであつたらうかと言ふと、勿論うぶな姿のまゝでは傳はつても居まいが、搜して居たならば少しづつは其破片が拾ひ集められるかも知れぬ。陸前柳目村で死んだ盲と狐と合葬して一つの塚を築き、又は大利峠の頂上に大蛇と座頭とを共に祀つて居るなどといふのが、或は又その昔のフオクロアの殘留では無かつたかと私は思ふが、其點は尙若干の資料を積み重ねた上で斷定した方がよい。九州の方では佐賀縣の黑髪山の麓に、曾て梅野の座頭といふ一部落が住んで居て、其先祖が鎭西八郞爲朝と共に此山の大蛇を退治し、其武功によつて後永く一本の刀をさす格式を認められたやうに傳へて居たことは、前に山島民譚集の中にも之を說いて置いたが、此徒が近國を演述してあるいた黑髪山大蛇物語といふものは、立派な讀み本になつてその幾通りか
  translation: '〔前のスキャンから続く〕原因によるものだろうと、私は考えている。それゆえ、以前は沼や湖の深い底に隠れ、人間の幸福を左右する神霊の存在を想像し、これに奉仕し、婚姻によって姻戚のつながりを結ぶことを家の誇りとするほどの伝説が生まれていた。それが後には、糸巻きの糸の端に針をつけ、その鉄の毒で相手の体を傷つけたと説くようになった。さらには、秘密を立ち聞きしたことや、保護者の知恵によって、その珍しい婚姻をまったく無効にしたなどと語るに至ったのである。目の見えない人が、水神の威信が急に失われたのに乗じ、かえって信任を裏切り、矛先を逆にしてこれを攻撃しようとしたのは、厳しくいえば、生存の必要から主義を捨て、世間の風潮に迎合したことだった。琵琶法師が大蛇の言葉を漏らし、命を失って一村の災いを救ったという話などは、ちょうどこの信仰の改められる過渡期を代表している。固有で不変の文芸というものを認めない私たちには、もちろんこれを一つの発達と見なさなければならない。しかし、神話を支えていたある時代の信仰から見れば、これは明らかに衰退の跡と呼ぶほかなかったのである。

    いずれにせよ、今伝わる蛇骨峠の鉄の杭の話などは、いくら広く分布していても、新しい時代の分布だった。日本は地形上、山崩れや土石流の多い国で、それを一般に「蛇抜け」や「蛇崩れ」と呼ぶようになったのは事実である。しかし、このような方法でそれを防ぐという話はほかに聞かないし、そのたびに座頭が一人ずつ死ななければならないのでは、たまったものではない。つまり、少しでもこれに似た事件があって、それに基づいて生まれた語り物ではない。これもまた出羽の花都という盲人の霊の託宣と同じく、ある事情によって、次の代の座頭の空想に浮かび出た、古代以来の夢だった。それでは、さらに一つ前の時代の目の見えない人の文芸は、どのような形だったのか。もちろん、もとの姿のままでは伝わってもいないだろうが、探していれば少しずつ、その断片を集められるかもしれない。陸前柳目村で死んだ目の見えない人と狐を合葬して一つの塚を築いたとか、大利峠の頂上に大蛇と座頭とをともに祭っているとかいうことは、その昔の民間伝承の名残ではなかったかと私は思う。しかし、この点はなお資料をいくらか積み重ねてから判断したほうがよい。九州では、佐賀県の黒髪山の麓に、かつて「梅野の座頭」という一集落が住んでいた。その先祖が鎮西八郎為朝とともにこの山の大蛇を退治し、その武功により、後々まで刀を一本差す格式を認められたと伝えていたことは、先に『山島民譚集』でも述べておいた。この人たちが近隣諸国で語って歩いた「黒髪山大蛇物語」は、立派な読本となり、その数種類が、'
  notes:

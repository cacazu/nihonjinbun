  section: 田螺の長者／二 蛙の王子と蛇の王子
  original: '授けて遣らう。脛に孕む子だから大事に育てよと仰せられた。果して女房の脛が段々に

    ふくれ、臨月にそこから小指程の子が生れた。夫婦は大に喜んで、之をスネコタンパコ

    と名けて大切に育てて居たが、十五六歲になる迄大きさは元のまゝであつた。それが或

    日母親に向つて、おれは長者どんのうば子樣を嫁に貰つて來るから、米を一杯くれろと

    言つた。何で長者どんが妹娘などをくれうぞと思つたが、大事なスネコタンパコの言ふ

    ことだから、望みの通り米を袋に入れて與へると、それを持つて隣の長者どんの玄關に

    立つて、御賴み申すと案內を求めた。長者の家では出て見たが誰も居らぬ。たびたび聲

    がするので氣を付けて見ると、下駄の下から隣のスネコタンパコが出て來た。今夜は泊

    めてくれといふから庭の隅に寢かせようとしたが、ひいひいと泣いて妹子樣の側に寢た

    いといふ。仕方が無いので夜著の袖の中に入れて寢させると、夜中に袋の米をにたにた

    と囓んで,それをうば子樣の口に塗つて置いて、大きな聲で泣き立てた。おれが乞食を

    して貰つて來た米を、うば子樣に食はれてしまつたと謂つた。うば子はそんなことは知ら

    ぬと言ふけれども皆が承知しない。夜寢て居て斯んな者の米を、盜んで噛むやうな娘は、

    此家には置かれぬ。スネコタンパコに遣るから連れて行くがよいと長者どんは言ふ。さ

    うして二人で戾つて來て、とうとう長者の末娘は、人で無しのスネコタンパコの嫁にな

    つた。

    その小さ子が不意に大きくなり、又富貴になつたといふ部分は、もう此話からは脫落して

    居るが、是と奄美大島の蛙の子の話と、筋が同じであつたことだけは、疑ふわけには行かな

    い。大島の風習では餅の袋が、妻を求むる者の結納であつたといふ報告は、信用してよから

    うと思ふ。男女の契りに相饗する晴の食物は、昔も今も餅を用ゐるのが例であつたからであ

    る。さうすると一方奥州の小さ子の袋の米といふのも、本來は新夫婦が共に噛むべきもので、

    それを行儀が惡いから追出したといふ風に語るのは、後の變化とも見られぬことは無い。

    それから今一點、長者の家の門口に案内を乞ふ聲があつて、出て見たら姿が見えなかつた

    といふ個條が、前の蛇の息子の話にも共通して居ること、是も偶然の一致では無かつたやう

    である。鉢から盥に移し、盥から飼葉桶に移したといふ程、急劇に成長した蛇が、目に付か

    なかつたといふのはをかしいけれども、それは寧ろこの紫波郡の二つの說話が、もとは相接'
  translation: '――授けてやろう。すねに宿る子だから大切に育てなさい」とおっしゃった。果たして妻のすねが次第に膨れ、月が満ちると、そこから小指ほどの子が生まれた。夫婦は大喜びし、スネコタンパコと名づけて大切に育てたが、十五、六歳になるまで大きさは初めのままだった。ある日、その子が母親に「おれは長者どんの末娘を嫁にもらってくるから、米を一杯くれ」と言った。長者どんがどうして末娘などをくれるものかと思ったが、大切なスネコタンパコの言うことなので、望みどおり米を袋に入れて与えた。すると、それを持って隣の長者どんの玄関に立ち、「お頼み申します」と案内を求めた。長者の家の者が出てみたが誰もいない。何度も声がするので注意して見ると、下駄の下から隣のスネコタンパコが出てきた。今夜は泊めてほしいと言うので庭の隅に寝かせようとしたが、ひいひい泣いて末娘のそばで寝たいと言う。仕方なく夜着の袖の中に入れて寝かせると、夜中に袋の米をくちゃくちゃとかみ、それを末娘の口に塗っておいて、大声で泣き出した。「おれが物乞いをしてもらってきた米を、末娘に食べられてしまった」と言う。末娘はそんなことは知らないと言ったが、誰も納得しない。「夜、寝ていて、こんな者の米を盗んでかむような娘は、この家には置けない。スネコタンパコにやるから連れていくがよい」と長者どんは言った。こうして二人で帰り、とうとう長者の末娘は、人間ではないスネコタンパコの嫁になった。


    この小さな子が突然大きくなり、また富や身分を得たという部分は、もはやこの話からは抜け落ちている。しかし、これと奄美大島の蛙の子の話の筋が同じだったことだけは、疑いようがない。大島の習慣では、餅の袋が妻を求める者の結納だったという報告は、信用してよいと思う。男女が契りを結ぶ際に互いに食べさせる晴れの日の食べ物には、昔も今も餅を用いるのが普通だったからである。そうすると、他方、奥州の小さな子が袋に入れていた米も、本来は新しい夫婦が一緒にかむべきものだったので、それを行儀が悪いから追い出したというふうに語るのは、後の変化と見られなくもない。


    もう一点、長者の家の門口から案内を求める声がして、出てみると姿が見えなかったというくだりが、前の蛇の息子の話にも共通する。これも偶然の一致ではなかったようである。鉢からたらいへ、たらいから飼い葉桶へ移したというほど急激に育った蛇が、目に入らなかったというのはおかしい。しかし、それはむしろ、この紫波郡の二つの説話が、もとは互いに近い関係に――'
  notes:
  - 冒頭はスキャン119の薬師の言葉の続き。末尾の議論はスキャン121へ続く。
  - OCR「腸」は原画像の「脛」に訂正。「人で無し」はこの話では人間の通常の姿を持たない存在を指す。
  - 「乞食」は原文の時代語で、訳では物乞いとした。

  section: 田螺の長者／三 小泉小太郎と泉小次郎
  original: '十四五になると、祖父樣、おれは斯んな體に生れて人に見られたくも無いし、又外に出

    て働くことも出來ぬから、どうか家の床板に穴を開けてくれ。其中に入つて手仕事でも

    したいからと言ふので、不憫に思つて言ふ通りに支度をして遣ると、息子は其穴から上

    半身だけ出して、上手に木地繰り物の細工をした。始は隣近所の子供等に與へて、其親

    たちから少しづつの米錢を禮に貰ふばかりであつたが、後には追々と神佛の御姿まで造

    つて、それを世間に廣めるやうになつた。

    腰から下だけが蜘蛛の形といふのは想像も出來ぬことであるが、人間の少女が大蛇と婚姻

    したといふ昔話でも、やはり何かの特徴が後裔の者にまで傳はると言つて居る。さうして其

    家は必ずしも之を恥ぢ包まず、寧ろ此傳說に據つて富みもし貴まれもして居たのである。豐

    後の緒方氏を始とし、諸國に數十の著名なる類例はあるが、それを陳列する事務だけならば

    私で無くても出來るだらう。爰では專らその「蛇の小さ子」が水を統御する神として、記念せ

    られたらしきことを述べて見たいのである。信州の方では右の甲州上九一色の龍吉を、小太

    郞といふ名で話すことになつて居た。小縣郡史餘編(四六頁)に載せてある一話は、やはり半

    分以上傳說化しては居るが、尙色々の點に於て興味ある特色を遺して居る。

    昔此郡西鹽田村、前山區の銕城山の頂上に寺があつた。其寺の住持の所へ、每夜美しい

    女が通うて來る。後に正體を知らうとして、針に長い絲を附けて女の衣服に刺して置く

    と、其絲は戶の節穴から出て產川の鞍淵の岩屋に入り込んで居た。女は大蛇であつて此

    岩屋の中で赤子を生み、それを鞍岩の上に置いて死んだ。それ故に今も川の名を產川と

    謂ひ、又蛇骨石などといふ遺跡があるのである。大蛇の產み落した子供は、下流の泉田

    村大字小泉の老婆に拾ひ上げて育てられ、其名を小泉の小太郞と呼ばれた。小太郞は小

    男であつた。さうして十六になる迄、大飯を食つて遊んでばかり暮したが、十六の歲に

    始めて大變な力を見せた。小泉の山に登つて山中の萩を苅り盡し、それを二束にたばね

    て家に持つて還り、決して束を解かず一本づつ拔いて焚くやうに、くれぐれも母親に警

    戒して置いたにも拘らず、母は束の小さいのに油斷をして、何心無く結び綱を解いたと

    ころが、其萩は家一ぱいになり、それに押し潰されて婆樣は死んでしまつた。今でも小

    泉山に萩が一本も無いのは、小太郞が苅り取つてしまつたからである。さうして小太郞'
  translation: '――十四、五歳になると、「おじいさん、おれはこんな体に生まれ、人に見られたくもないし、外へ出て働くこともできない。どうか家の床板に穴を開けてくれ。その中に入って手仕事でもしたいから」と言った。不憫に思い、言うとおりに用意してやると、息子は穴から上半身だけを出し、上手に木地のろくろ細工をした。初めは近所の子どもたちに与え、その親たちから少しずつ米や金をお礼にもらうだけだったが、後には次第に神仏の像まで作り、それを世間に広めるようになった。


    腰から下だけが蜘蛛の姿というのは、想像もできないことである。しかし、人間の娘が大蛇と結婚したという昔話でも、やはり何らかの特徴が子孫にまで伝わると言っている。そしてその家は、必ずしもこれを恥じて隠さず、むしろこの伝説によって富み、尊ばれてもいた。豊後の緒方氏をはじめ、諸国に数十の有名な類例があるが、それを並べるだけの仕事なら、私でなくてもできるだろう。ここでは、もっぱらその「蛇の小さな子」が、水を治める神として記憶されていたらしいことを述べたい。信州のほうでは、先に挙げた甲州上九一色の龍吉を、小太郎という名で語っていた。『小県郡史余編』四十六ページに載る一話は、やはり半分以上は伝説になっているが、なおさまざまな点で興味深い特色を残している。


    昔、この郡の西塩田村、前山区の鉄城山の頂に寺があった。その寺の住職のところへ、毎夜、美しい女が通ってきた。後に正体を知ろうとして、針に長い糸をつけて女の衣服に刺しておくと、その糸は戸の節穴から出て、産川の鞍淵の岩屋へ入り込んでいた。女は大蛇で、この岩屋の中で赤ん坊を産み、鞍岩の上に置いて死んだ。そのため、今でも川の名を産川と言い、蛇骨石などという跡も残っている。大蛇の産み落とした子は、下流の泉田村大字小泉の老婆に拾われて育ち、小泉の小太郎と呼ばれた。小太郎は小柄な男だった。十六歳になるまで大飯を食い、遊んでばかり暮らしていたが、十六歳で初めて、たいへんな力を見せた。小泉の山に登って山中の萩を刈り尽くし、二束にまとめて家へ持ち帰った。決して束を解かず、一本ずつ抜いてたくよう、くれぐれも母親に注意しておいた。それなのに、母は束が小さいので油断し、何気なく結び縄を解いた。すると萩が家いっぱいに広がり、押しつぶされておばあさんは死んでしまった。今でも小泉山に萩が一本もないのは、小太郎が刈り取ってしまったからである。そして小太郎――'
  notes:
  - 冒頭はスキャン123の蜘蛛息子の引用の続き。末尾はスキャン125へ続く。

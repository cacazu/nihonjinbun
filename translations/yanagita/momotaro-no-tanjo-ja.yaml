  section: 田螺の長者／生きて居る小太郎
  original: 'もさういふ新說が取つて代るべく、あまりに鉢伏權現の緣起などが有力になり過ぎて居た。

    もしくは周圍の地に於てその色々の類型が有り過ぎた。到底或一人の話術を以て、その神の

    子を泉親衡たらしむるを得なかつたのである。

    或はもう一步を進めて、その試みられた改造が、やゝ不自然であつたからとも考へられぬ

    ことは無い。所謂犀川の犀龍は小太郞が母であつた。さうは言はない土地でも保護者であり

    助手であつたとは信じて居た。それを退治したと說かうとするのだから、先づ聽衆の常識と

    闘はなければならぬわけである。或はこの在來の信仰の認識不足から、之を改めようとした

    人も、土地に育つた者では無くて、外から遣つて來たのであらうといふ推測が成立つかも知れない。

    兎に角に一方に之を鎌倉時代の勇士の外傳と解する者があると同時に、他方に之を神とする信仰も、相應に遠く及び根强く培はれて居たのである。北安曇郡鄕土誌稿(一卷

    二三頁)の記述する所では、近くは弘化四年の善光寺大地震に、岩倉山崩壞して新町一帶が

    湖水にならうとした際にも、泉小太郞が犀に乘つて現はれ、山を突割り水を涸して行つたの

    を、避難者達が目擊したと謂つて居る。其時以來新町の人々は、佛崎の觀音へ月詣りを缺か

    さぬことになつたといふが、この佛崎は又一つの小太郞遺跡で、爰には上流の鉢伏山麓など

    より、幾分か異なる傳說を保持して居るのである。筑摩郡の方では今の中山村といふ部落が、

    小次郞又は小太郞の家鄕の地として知られて居た。自分は行つて見ないが山の根に一つの洞

    窟があり、其傍には淸き池を湛へ、曾ては鳥居の形をした大木が、洞の口を蔽うて居たとい

    ふ。今でも知つて居る人が有るか知らぬが、二十年ほど以前或人が聽いて來たといふ話は、

    途法も無く珍らしいものであつた。其頃よりざつと三百年前に、此地に百歲にもなるかと思

    ふ一人の老人が住んで、自ら小太郞と名のつて居たさうである。小太郞は仙人であつて、蜂

    になつて諸方を飛びあるいたり、又は天の川の魚を捕つて來て見せたりした。時の殿樣がそ

    れを聞いて、喚寄せて對面せられたといふ點まで奧州の淸悅と似て居たが、この仙人は御殿

    からすぐに天へ昇つて、還つて來なかつたと傳へて居る。それから六七十年ほど過ぎて後

    に、又この老翁の姿を見た者がある。其時は岩屋の中から玉を得たと謂つて見せた。それか

    ら後にも土地の人達は、小太郞が水を浴び又は祈禱をして居るのを見たことが折々あるとい

    ひ、現に去年の秋なども見た者があるといふ話であつた。以上は既に二十年前の記錄で、其'
  translation: '――そうした新しい説が取って代わるには、鉢伏権現の縁起などが、あまりにも有力になりすぎていた。あるいは、周辺の土地にさまざまな類型がありすぎた。とうてい一人の語り手の話術では、その神の子を泉親衡にすることはできなかったのである。


    もう一歩進めて、この改作の試みが、やや不自然だったからだとも考えられなくはない。いわゆる犀川の犀竜は、小太郎の母だった。そう言わない土地でも、保護者であり、助力者だったとは信じられていた。それを退治したと説こうとするのだから、まず聞き手の常識と闘わなければならない。あるいは、こうした従来の信仰への理解不足から見て、改作しようとした人も地元で育った者ではなく、外から来た者だったのだろう、という推測が成り立つかもしれない。


    いずれにせよ、一方ではこれを鎌倉時代の勇士の外伝と解する人がいるのと同時に、他方では、これを神とする信仰も、相当に広く、また根強く育っていた。『北安曇郡郷土誌稿』一巻二十三ページの記述では、近くは弘化四年の善光寺大地震で岩倉山が崩れ、新町一帯が湖になりかけた時にも、泉小太郎が犀に乗って現れ、山を突き割って水を引かせていったのを、避難していた人々が目撃したという。それ以来、新町の人々は仏崎の観音への月参りを欠かさなくなったという。この仏崎もまた、小太郎ゆかりの場所の一つであり、ここには上流の鉢伏山麓などとは、いくらか違う伝説が残っている。


    筑摩郡では、今の中山村という集落が、小次郎または小太郎の故郷として知られていた。私は訪ねたことがないが、山のふもとに洞窟が一つあり、そばには澄んだ池をたたえ、かつては鳥居の形をした大木が洞窟の入り口を覆っていたという。今でも知っている人がいるかどうかはわからないが、二十年ほど前、ある人が聞いてきたという話は、とてつもなく珍しいものだった。


    そのころから、およそ三百年前、この地に百歳にもなろうかと思われる老人が一人住み、自ら小太郎と名乗っていたそうである。小太郎は仙人で、蜂になって各地を飛び回ったり、天の川の魚を捕ってきて見せたりした。当時の殿様がそれを聞いて呼び寄せ、対面したという点まで奥州の清悦と似ていたが、この仙人は御殿からすぐ天へ昇り、戻ってこなかったと伝えられる。それから六、七十年ほど後、またこの老人を見た者があった。その時は、岩屋の中から玉を得たと言って見せた。それから後も、地元の人々は、小太郎が水を浴びたり祈祷したりしているのを時々見たといい、現に去年の秋などにも見た者がある、という話だった。以上はすでに二十年前の記録で、その――'
  notes:
  - 冒頭はスキャン133の続き。末尾はスキャン135へ続く。
  - 弘化四年は1847年。「今」「二十年前」などは著者がこの文章を書いた時点を基準とする。

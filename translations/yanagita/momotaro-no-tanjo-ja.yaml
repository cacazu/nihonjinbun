  section: 狼と鍛冶屋の姥／九 良辨僧正の杉
  original: '奥州の片田舎は固より、都に近く住む鷲見某の家でも、家ある限りは尙この昔語りを棄てることが出來なかつた。

    是が又傳說の文化史料として、最も丁寧な取扱を受けなければならぬ理由で、我々はこの幾多の近代式合理化の背後にも、尙その最初の動機を見つけ得る場合が多いのである。

    最後にもう一つだけ、この說話と文獻との關係を述べて置きたい。

    伊豆三宅島の三島大明神緣起に、伊豫の神樣が此島に渡つて來て、地を乞うた一條を載せて居る。

    其詞に、我は是れ凡夫にては伊豫國三島郡に立花の清政と申せしが、四十に餘るまで子を持たず、大和國初瀨の十一面に籠り願ずれば、夢の御告に汝に於ては子とては無けれども、我が持つ所の寶に換へて子種を與ふとありしより、男子一人設けて喜びする所に、伊豫國しやくの浦にて鷲に取られ云々。

    十六年の間山中に籠り、我身に願のあるまゝに、人の願を叶へんことを佛神へ祈りしに、其功積りて垂跡となる云々とあるのである。

    是が室町期の多くの語り物、古くは安居院の甲賀三郞から、末々何の本地の名を以て文筆に保存せられてあるものと、樣式に於て一つであることは誰の目にもわかるのだが、三宅島では之を大切な社傳として信じて居た。

    人と神靈との仲介を業とした者が、同時に多くの說話の運搬者であつたことは、屢純朴な人の住む土地に於て、意外なる傳說の改造を爲し遂げて居たのである。

    傳說と說話との相違は、昔の田舍者とても知らぬ筈は無かつた。

    現に家々の祖父祖母の昔語りは、それ自身愉快なる空想の開展を示して居る。

    たゞ新たに外から持込まれた說話のみは、しば〱古風のまゝに信じ得べき形を以て說かれた故に、聽衆は當然に之を信じたのであつた。

    一個猫狼の旅人を襲うて破れたといふ民間說話が、或地では半ば以上傳說と化して信ぜられ、又他の方面では依然として昔話のまゝでもて囃されて居るのは、主たる原因は話者の相異と、之を受入れたる土地の事情で、一々の場合に必ずそれ相應の變化が生じたのである。

    さうしてそれは悉く皆我日本國內の、中世以後の國民の所爲であつた。

    知らずテオドル·ベンファイの流れを汲んで、今尙インディアニストの口吻をくり返さうとする學者たち、是をしも書册文字のたゞ一片の蘆の葉に乘つて、遙かに西天より漂到したものと、斷定するの勇氣ありや否や。

    (昭和六年十月、鄕土研究)'
  translation: '――奥州の片田舎はもちろん、都の近くに住む鷲見某の家でも、家が続く限り、なおこの昔語りを捨てることができなかった。これが、伝説が文化史の資料として最も丁寧に扱われなければならない理由でもあり、私たちは、こうした数々の近代的な合理化の背後にも、なお最初の動機を見いだせる場合が多いのである。

    最後にもう一つだけ、この説話と文献との関係を述べておきたい。伊豆三宅島の『三島大明神縁起』には、伊予の神がこの島へ渡ってきて、土地を求めた話が載っている。その言葉に、「私は、人間だったときには伊予国三島郡の立花の清政といったが、四十を過ぎても子がなく、大和国初瀬の十一面観音にこもって祈ると、夢のお告げで、おまえには子を持つ運命はないが、私の持つ宝と引き換えに子種を授けよう、とあった。それから男の子を一人もうけて喜んでいたところ、伊予国しやくの浦で鷲に取られた……。十六年間山中にこもり、自分に願いがあるのと同じく人の願いをかなえようと、仏神へ祈ったところ、その功徳が積もって神としてこの世に現れる身となった……」とある。これが、室町時代の多くの語り物、古くは安居院の「甲賀三郎」から、のちの「何々の本地」という名で文字に残されたものまでと、形式の上で同じだということは、誰の目にもわかる。しかし三宅島では、これを大切な神社の伝承として信じていた。人と神霊の仲立ちを職業とした者が、同時に多くの説話の運び手だったことは、たびたび素朴な人々の住む土地で、意外な伝説の改造を実現させていたのである。伝説と説話の違いは、昔の田舎の人々でも知らないはずはなかった。実際、家々の祖父母の昔語りは、それ自体、楽しい空想の展開を示している。ただ、新たに外から持ち込まれた説話だけは、しばしば古風なまま、信じられる形で語られたため、聞き手も当然それを信じたのである。猫や狼が旅人を襲って敗れたという一つの民間説話が、ある土地では半ば以上伝説となって信じられ、また別の地方では依然として昔話のまま喜ばれている。その主な原因は語り手の違いと、それを受け入れた土地の事情にあり、一つ一つの場合に、必ずそれに応じた変化が生じたのである。そして、それはすべて、日本国内の中世以後の人々が行ったことだった。テオドル・ベンファイの流れをくみ、今もインディアニストの主張を繰り返そうとする学者たちに尋ねたい。これまでもが、書物の文字というただ一片の葦の葉に乗って、はるか西方のインドから流れ着いたものだと、断定する勇気があるだろうか。

    （昭和六年十月、『郷土研究』）'
  notes:
  - 冒頭は231からの続き。
  - インディアニストは、ここでは説話の起源をインドに求める学説の支持者を指す。

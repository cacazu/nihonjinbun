  section: 米倉法師／二 笑話の分布
  original: 何れも遠い昔の世から、その後段の失敗が我々の笑の種であつた。純なる敬虔の情を以て謹んで前半の奇瑞に耳を傾けようとした人々も、尙この禍福幸不幸の餘りに顯著なる對照に觸れて、我知らず高笑ひをせずには居られなかつたかと思はれる。是が我々の想像し得る上代の俳諧であつた。ところが神話を支持して居た國人の信仰は夙く壞れ、人はたゞ此種の語り事を目して、敵を設けざる嬉笑の具とするに至つたのである。中世の平和時代は、それ程にも笑の乏しい期間であつた。それ故に努めて話法を平易且つ珍奇にし、特に笑の動機に關しては、競うて新意匠を出陳しようとして居たのである。我々の昔話が笑話に化して行つた事情は茲に存し、かの人生の最も笑ひ難き部分を步む者が、傭はれて此技藝を鍊磨することになつたのも、起りは亦是に在ることは想像し得られる。熊本縣では北の境の南關の町に、古風なハナタレ小僧樣の一話が今も行はれて居るに對して、他の一方の端に近い八代郡松求麻村のあたりに、是と前半分を同じうする米倉の話が、旣に發達して居たことは前にも述べて置いた。一方が海老の膾の日供を怠つたが爲に、海の神に賜はつた幸運を取失うたといふに反して、此方は單なる言葉の誤謬から揚足を取られたことになつて居るのも、もう早盲人の所爲らしい考へ過ぎた改作である。成るだけ手短かに其話の筋を述べると、昔ある處に一人の爺があつて、師走の町に門松を賣りに行つたが、一つも賣れぬのでその歸り路に、橋の上から其松を皆水の中へ投入れた。さうすると川の中から人が出て來て禮を述べ、龍宮へ案內してくれて、そこで大層な御馳走になつた。さうして御土產に頂載して來たのが、打出の小槌といふ一つの寶物であつた。米というて其槌を打つと米が現はれ、それを入れる爲に倉と謂うて打つと、又忽然として倉が建つた。鄰の惡い爺が聽いて之を羨み、强いて小槌を借りて歸つて、僅かな間に成るべく多くの米と倉とを出さうとして、急いで續けさまにコメクラ·コメクラと謂つて打つたら、米と倉とは出ないで澤山の小盲が現はれ、終にその慾深爺を責め殺したといふ話になつて居る(昔話號、濱田隆一君)。肥後の松求麻村は知つて居る人も多いであらうが、久しく肥後檢校といふ琵琶彈きの徒の住んで居た土地である。そこに小盲の笑話の傳はつて居たのは偶然で無いが、さりとて私は
  translation: '〔前のスキャンから続く〕どれも遠い昔から、後半の失敗が私たちの笑いの種だった。純粋な敬虔の思いをもって、つつしんで前半の不思議なめでたい出来事に耳を傾けようとした人々も、幸不幸のあまりにはっきりした対照に触れ、思わず声を上げて笑わずにはいられなかったのではないかと思われる。これが私たちの想像できる古代の俳諧だった。ところが、神話を支えていた国の人々の信仰は早くに崩れ、人はこの種の語り物を、敵を作らずに楽しく笑える道具と見るようになった。中世の平和な時代は、それほどにも笑いの乏しい時期だったのである。そのため、努めて話し方をわかりやすく、かつ珍しいものにし、とくに笑いのきっかけについては、競って新しい趣向を持ち出そうとしていた。昔話が笑い話になっていった事情はここにあり、人生の最も笑うことの難しい部分を歩む人たちが、雇われてこの技芸を磨くようになった、その起源もここにあると想像できる。

    熊本県では、北の境の南関の町に古風な「ハナタレ小僧様」の話が今も伝わる一方、もう一方の端に近い八代郡松求麻村のあたりには、これと前半が共通する米倉の話が、すでに発達していたことは先にも述べた。一方が海老のなますを毎日供えるのを怠ったために、海の神に授かった幸運を失ったというのに対し、こちらでは、単なる言い間違いから揚げ足を取られたことになっている。これもすでに、目の見えない人の仕業らしい、考えすぎた改作である。できるだけ短く筋を述べると、次のようになる。

    「昔ある所に一人の老人がいて、師走の町へ門松を売りに行った。しかし一つも売れないので、帰り道に橋の上から松を全部、水の中へ投げ入れた。すると川の中から人が現れて礼を言い、竜宮へ案内してくれ、そこでたいそうな御馳走になった。そして土産として頂いてきたのが、打ち出の小槌という一つの宝物だった。『米』と言って小槌を打つと米が現れ、それを入れるため『倉』と言って打つと、またたちまち倉が建った。隣の悪い老人が聞いてこれをうらやみ、無理に小槌を借りて帰った。短い間になるべく多くの米と倉を出そうとして、急いで続けざまに『コメクラ、コメクラ』と言って打つと、米と倉は出ず、たくさんの『小盲（こめくら）』が現れ、とうとうその欲深い老人を責め殺した」という話になっている（『昔話号』、浜田隆一君）。

    肥後の松求麻村は、知っている人も多いだろうが、長く肥後検校という琵琶弾きの人々が住んでいた土地である。そこに「小盲」の笑い話が伝わっていたのは偶然ではない。しかし、だからといって私は、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン265）と本文OCRを照合。
  - 「コメクラ」は「米・倉」と、盲目の少年や若い盲人をいう歴史的差別語「小盲（こめくら）」との語呂合わせ。筋の核心のため原語を引用内に残した。

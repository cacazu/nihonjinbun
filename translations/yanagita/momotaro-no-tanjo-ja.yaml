  section: 田螺の長者／四 タミナの婿とツブの長者
  original: 'それから商ひを始めた。さうするとツブが人間になつたといふ若者を見たさに、町中は

    申すに及ばず、近鄕近在の人たちも澤山に買物に遣つて來て、店は繁昌して忽ちのうち

    に大きな身代になつて、ツブの長者と謂へば誰知らぬ者も無い程の、有名な御大家の先

    祖になつた(佐々木喜善君報)。

    出來るだけ私は省略をして見たのだが、それでも此通り長話になつたのは、土地で今尙形

    を整へて、語り傳へられて居る爲である。しかも其形は色々の點から見て、決して古くから

    の文句のまゝでは無いのであつた。田螺を水の神の使令と見る信仰は、切れ切れには今でも

    山中の池沼に遺つて居るが、果して龍蛇と同じく人間の美女に聟入する話が、それに伴うて

    弘く行はれて居たものかどうか。現在はまだ無論肯定することは六つかしい。但し此話の末

    にある「つぶ殿つぶ殿」の歌ばかりは、隨分と多くの土地に於て、殆と意味無しに兒童によ

    つて口ずさまれて居る。それが若し最初から此話の中の歌であつたならば、是はその一つの

    痕跡と認め得るのである。それから東北では今一つ、所謂シンドレラ系の昔話の終に、繼母

    の實の子が姉の嫁入を羨んで、田に落ちて田螺になつたと語られることが普通になつて居

    る。是も或は「つぶ聟入」の、移されて零落した姿では無いかと思ふのである。

    桃太郞の昔話が昔から日本に有つたといふことは、單なる推定以上の何物でも無い。强ひ

    て記錄の徵證を求めようとすれば、本朝神社考卷五に秦河勝化生の事を說いて、昔大和國

    洪水の折に、初瀨川大に漲り、大なる甕一つ流れ來つて三輪の社頭に止まる。土人開き見る

    に玉の如き一男子あり云々。後に又小舟に乘つて播磨に著し、大荒明神となるとあるなどが

    早い方である。それから以前に筆錄せられたものは、一寸法師であれ物草太郞であれ、乃至

    竹取の翁の小さき姫であれ、事蹟も出現の形式も著しく遠ざかつて居て、たゞ其中間に地方

    採集の幾つかの口承說話を置いて見て、始めて兩者の聯絡を知ることが出來るのみである。

    謂はば他に反對の資料が無い限り、一應は前から此通りと想像するを許されたのであつた

    が、今は兎に角に新たなる證跡に據つて、中古次々の語り改めがあつたことが判り、從つて

    何が不變の要點であつたかも、略明かになつて來たのである。要點の一つは貴き童兒が信

    心ある者の希望に應じて與へられることであつた。恐らくは最初其信心の試みとして、殆と

    人間の空想し得る限りの、あらゆる信じ難い出現の方式が語られたのであらうが、其中でも'
  translation: 'それから商売を始めた。すると、ツブが人間になったという若者を見たくて、町じゅうはもちろん、近郷近在の人々も大勢買い物に来た。店は繁盛し、たちまち大きな財産を築いて、「ツブの長者」といえば知らない者のないほどの、有名な大家の先祖になった。（佐々木喜善君の報告）


    私はできるだけ省略してみたのだが、それでもこのような長話になったのは、土地では今でも、形を整えて語り継がれているからである。しかもその形は、いろいろな点から見て、決して古来の言い回しのままではなかった。田螺を水の神の使いとみる信仰は、断片的には今でも山中の池や沼に残っている。しかし、果たして竜や蛇と同じく、人間の美女のもとへ婿入りする話も、それに伴って広く伝わっていたのかどうか。今のところは、もちろんまだ肯定しにくい。ただし、この話の終わりに出てくる「つぶ殿つぶ殿」の歌だけは、ずいぶん多くの土地で、ほとんど意味を意識されずに子どもたちが口ずさんでいる。それがもし最初からこの話の中の歌だったなら、伝わった痕跡の一つと認められる。それから東北ではもう一つ、いわゆるシンデレラ系の昔話の最後に、継母の実の子が姉の嫁入りをうらやみ、田に落ちて田螺になったと語るのが一般的である。これも、もしかすると「ツブの婿入り」が別の話へ移され、衰えた姿ではないかと思う。


    桃太郎の昔話が昔から日本にあったということは、単なる推定以上のものではない。あえて記録による証拠を求めるなら、『本朝神社考』巻五が秦河勝の化生について述べ、「昔、大和国が洪水になった時、初瀬川が大いに増水し、大きな甕が一つ流れてきて、三輪の社前で止まった。土地の人が開けてみると、玉のように美しい男の子が一人いた」などとし、後にはまた小舟に乗って播磨に着き、大荒明神になったとする例などが、早いほうである。それ以前に文字にされたものは、一寸法師も物草太郎も、あるいは竹取の翁の小さな姫も、行った事柄も現れ方も、著しく異なっている。その間に地方で採集したいくつかの口承説話を置いてみて、初めて両者のつながりがわかるだけなのである。


    言ってみれば、ほかに反対の資料がない限り、ひとまず前からこのとおりだったと想像することが許されていた。しかし今は、ともかく新しい証拠によって、伝承の途中で次々に語り直しがあったことがわかり、したがって、何が変わらない要点だったかも、おおよそ明らかになってきた。一つの要点は、尊い子どもが、信心のある人の願いに応じて授けられることだった。おそらく初めは、その信心を試すために、人間がほぼ想像できる限りの、あらゆる信じがたい現れ方が語られたのだろう。その中でも――'
  notes:
  - 冒頭はスキャン130の引用の続き。末尾の議論はスキャン132へ続く。
  - 原文引用の「土人」はここでは土地の住民を指す時代語であり、訳では「土地の人」とした。

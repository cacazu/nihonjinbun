  original: と、町では誰も買つてくれなかつたが、殿樣がそれをサイマンダラといふ貴とい織物だと知つて、高い値で買つてくれた。其代りに是非この女房を取らうと思つて、出來さうも無い二つの難題を言ひかける。先づ第一に例の通り灰繩千把、それを差出さぬに於ては女房を參らせよ。次には打たぬ太皷だけは無くて、やはり小子部栖輕と同樣に、今度は天の雷神を連れて來いとの仰せだ。是も天人女房の力によつて、天から呼び下して箱に入れて獻上すると、始は細目にあけた箱の蓋の際間からカラコロピカピカ、强ひて全部を開けさせると御殿は震動して大雨が降り、やれ許せもう持つて還つてくれと、殿樣が我を折つた可笑味があつて、そこで一旦の結末は付いて居るのだが、此說話では更にその後に、笛吹藤平の方には無くて、越後南蒲原郡の笛吹男に伴なふ話が續いて居る。是も御曹司島渡りなどと關係が有るから、大要だけを言はねばならぬが、男は天人女房に勸められて、天の男殿へ禮に上ると、色々馳走があつた後に、一粒食へば千人力のつく米粒と、二千人力のつく米粒とを引出物に贈られる。それから屋敷の內を見まはつて居ると、金の太い綱に繫がれた一疋の赤鬼が、岩屋の隅でしをれ切つて泣いて居る。あまり不憫に思つて千人力の米粒を遣つたら、鬼はそれを食ふや否や金の綱をぷつりと切つて、何處へとも無く飛んで行つてしまつた。それは誠に飛んだことであつた。あれは姫が七歲の頃から、强ひて懸想をして附廻す故に繫いで置いたのだ。今頃は定めし下界に行つて、姫を盜んで遁げてしまつたらう。急いで行つて見よとのことで還つて來て見ると、果して天人女房はもう家には居なかつた。それから困つてしまつて日頃信心をする內神樣に、三七日の心願をかける。夢の御告があつて汝に此笛を授ける。是を吹いて西の方に向つて行くならば、再會の望みはかなふべしとあつて、爰に始めて一管の笛が出て來るのであつた。それからあとは大江山の如く、又島渡りの草子の大とう丸のやうに、鬼どもは其笛の音に心を許して居るうちに、千里走る車に乘つて遁げて歸つて來る。それを二千里走る車で迫掛けて來て、あべこべに敵の鬼は退治せられてしまふのである(詳しいことは紫波郡昔話一八六頁以下)。私が子供でもない讀者に、こんな昔話のおさらへをする趣意は、もう一度記錄の古さと話の古さとを、比較して見てもらひたい爲ばかりである。舞の本の烏帽子折の山路の語りを讀んで御覽あれ。あの中には先づ姿繪の戀慕があつて、次に芥子の種一萬石の難題となり、更
  translation: 'と、町では誰も買ってくれなかったが、殿様はそれが「サイマンダラ」という貴重な織物だと知り、高値で買ってくれた。その代わりに、ぜひこの妻を手に入れようと思い、できそうもない二つの難題を言いつける。第一は例のとおり灰の縄千束で、それを差し出さなければ妻を差し出せという。次には、たたかずに鳴る太鼓の話だけはなく、やはり小子部栖軽の場合と同じく、今度は天の雷神を連れて来いという命令である。これも天人の妻の力で天から呼び下し、箱に入れて献上する。初めは細く開けた箱のふたの隙間からカラコロ、ピカピカと鳴り光る。無理に全部を開けさせると御殿が揺れ動き、大雨が降って、「もう許せ、持って帰ってくれ」と殿様が折れるというおかしさがあって、ここでいったん結末がつく。しかしこの説話ではその後さらに、笛吹藤平のほうにはなく、越後南蒲原郡の笛吹き男に付いている話が続く。

    これも『御曹司島渡り』などと関係するので、大筋だけは述べなければならない。男は天人の妻に勧められ、天にいる妻の父へお礼に上がる。いろいろとごちそうされた後、一粒食べれば千人力のつく米粒と、二千人力のつく米粒を土産にもらう。それから屋敷の中を見て回ると、金属製の太い綱につながれた一匹の赤鬼が、岩屋の隅ですっかりしょげて泣いている。あまりに気の毒に思って千人力の米粒を与えると、鬼は食べるなり金属の綱をぷつりと切り、どこへともなく飛んでいってしまった。それはとんでもないことだった。あの鬼は姫が七歳のころから無理に言い寄ってつきまとったので、つないでおいたのだ。今ごろはきっと下界へ行き、姫を盗んで逃げてしまっただろう。急いで見て来いといわれて帰ると、果たして天人の妻はもう家にいなかった。困り果てた男は、日ごろ信仰している内神様に二十一日間の願掛けをする。夢のお告げがあり、「お前にこの笛を授ける。これを吹きながら西へ向かって行けば、再会の望みはかなうだろう」と告げられ、ここで初めて一本の笛が現れる。その後は『大江山』のように、また『島渡り』の草子の大とう丸のように、鬼たちが笛の音に気を許している間に、千里走る車に乗って逃げ帰ってくる。それを二千里走る車で追いかけて来た敵の鬼は、逆に退治されてしまうのである（詳しくは『紫波郡昔話』一八六頁以下）。

    私が子供でもない読者に、このような昔話をおさらいする趣旨は、記録の古さと話そのものの古さを、もう一度比べてみてもらいたいからにほかならない。『舞の本』の「烏帽子折」にある山路の語りを読んでいただきたい。その中にはまず肖像への恋慕があり、次に芥子の種一万石という難題が出てきて、さら'
  notes:
  - 「男殿」は妻の父の意と解した。「内神」は家で祭る神。
  - 末尾「さら」はscan202の「に」に続く。

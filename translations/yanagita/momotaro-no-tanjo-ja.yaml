- id: mmt-094-01
  scan: 94
  section: 瓜子織姫／諸國の瓜子姫
  original: 'つて食つたといふ所で話が終つて居る。それでもやはり代り番に蚤取りをしようといふ點は

    あり、山婆が最初隣の娘に化けて、遊びに來たといふ所は下水内郡の例(八)と似て居るので

    ある。)

    一六秋田縣角館(右同書三七三頁)

    爺と婆とに一人の娘があつて、其名をオリヒメ子と謂つた。オリヒメ子、オリヒメ子、アマ

    ノジヤクが來た時は決して戶を開けてはならないぞと謂つて、爺と婆とは外へ出て行つた。

    其留守に一人で機を織つて居ると、アマノジヤクが遣つて來て、オリヒメ子戶を開けろと謂

    つた。叱られるからいやだと言つたが、何遍も何遍も戶をあけろと言ふので、仕方無しにあ

    けて遣ると、

    オリヒメ子、オリヒメコ

    山さ栗拾ひに行くから

    下駄はいて來れ

    とアマノジヤクが謂つた。

    下駄が鳴るからやんだ。

    そんだら草履はけ。

    草履も無いからやんだ。

    それぢや。俺がおぶつて行く。

    とげが有つからやんだ。

    それで。板を敷いておぶるべえ。

    といふ問答があつて、とう〳〵アマノジヤクは背中に板を當てて、オリヒメ子を負うて山に

    行つた。さうしてアマノジヤクは自分だけ木に登つて栗を取つて居る。後からオリヒメ子が

    登つて行かうとすると、其木をうんと搖ぶつてオリヒメ子を木から落して殺し、自分は其皮

    を剝いて被つて、オリヒメ子に化けて戾つて來た。それからお嫁に行くことになつた。朝起

    きて顏を洗ふ時に、あんまりそろ〳〵と洗ふので、爺樣婆樣が今日は嫁に來たのだから、も

    つとよく洗へといふとおら洗へないと言つた。そんだら俺が洗つてやると、爺が强く顏をこ

    するとオリヒメ子の皮がはげて、アマノジヤクになつて山へ逃げて行つた。このアマノジヤ'
  translation: 'って食べたというところで話が終わっている。それでも、やはり代わる代わる蚤を取ろうというくだりはある。また、山婆が最初は隣の娘に化けて遊びにきたというところは、下水内郡の例（八）と似ている。）

    十六　秋田県角館（同書三七三ページ）

    お爺さんとお婆さんに一人の娘があり、オリヒメ子という名だった。「オリヒメ子、オリヒメ子、アマノジャクが来たときは決して戸を開けてはいけないよ」と言って、二人は外へ出かけた。留守に一人で機を織っていると、アマノジャクが来て、「オリヒメ子、戸を開けろ」と言った。「叱られるからいやだ」と答えたが、何度も何度も戸を開けろと言うので、仕方なく開けてやると、

    「オリヒメ子、オリヒメコ、

    山へ栗拾いに行くから、

    下駄を履いておいで」

    とアマノジャクが言った。

    「下駄が鳴るからいやだ」

    「それなら草履を履け」

    「草履もないからいやだ」

    「それなら、おれがおぶっていく」

    「とげがあるからいやだ」

    「それなら、板を敷いておぶろう」

    というやりとりがあり、とうとうアマノジャクは背中に板を当て、オリヒメ子を背負って山へ行った。そして自分だけ木に登り、栗を取っていた。あとからオリヒメ子が登ろうとすると、木をひどく揺すってオリヒメ子を落として殺し、その皮をはがしてかぶり、オリヒメ子に化けて帰ってきた。

    それから、お嫁にいくことになった。朝起きて顔を洗うとき、あまりにもそっと洗うので、お爺さんとお婆さんが「今日は嫁に来たのだから、もっとよく洗いなさい」と言うと、「おら、洗えない」と言った。「それならおれが洗ってやる」と、お爺さんが強く顔をこすると、オリヒメ子の皮がはがれ、アマノジャクになって山へ逃げていった。この、アマノジャ'
  notes:
  - 冒頭はscan93、末尾はscan95へ続く。
  - 「今日は嫁に來たのだから」は原文のまま。嫁入り前の場面との不整合を改変しない。

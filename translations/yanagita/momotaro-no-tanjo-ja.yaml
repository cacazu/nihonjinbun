  original: 受けて居たさうである。それで家へは度々淵の主からの使者が遣つて來たが、そのたびに蓼汁だけは嫌ひだとくり返して居たのに、或時家の者が其事を忘れて、振舞の膳に蓼を附けて出したところ、一口喰つて是はしまつたと叫び、其まゝ淵に向つて轉がり落ちて行つた。さうして落込んだ姿を見ると、今までは人間の通りであつたのが、赤い腹をした大きな魚になつて居た。それが段々に水の中を流れながら、頻りにオトボウやオトボウやと連呼した故に、以來この淵の名もオトボウ淵と謂ふやうになつた。此事あつてより淵の主との緣は切れ、さしもの物持も忽ち家運が傾いてしまつた。土地の人の說では、オトボウは此邊では父といふことである。或は死にがけに父の名を呼んだのでは無からうかと謂つて居る(以上四件早川孝太郎君採錄、民族二卷五號及三卷五號)。龍宮小僧が田植に手傳ひをしてくれたといふことは、農民で無い者には餘りに輕少な恩澤のやうに感じられるだらうが、此際の手不足は村の最も大きな惱みであつたといふに止まらず、爰で仕事にはかが行くといふことは、事實亦蓄積の主要なる力でもあつたので、百姓の身の上では寧ろ金銀珊瑚綾錦などこそ、物遠い空想に過ぎなかつたのである。奥州の昔話のヨケナイやウントクが、唯何くれとよく働いてくれて、家を富貴にしたといふ方が、自然でもあれば具體的でもあつた。夏の日の驟雨に干し物を取込んでくれたといふなども、外庭に有るだけの莚をしきつめて、穀類や何かをひろげて置いたまゝで、家中野に出て働いて居る樣な土地で無いと、其有難味はよくは解らない。奥州の座敷童子、又はオクナイサマといふ類の家の神は、斯うして家の幸福を守ると信ぜられ、又鼻取地藏だの田植仁王だのと謂つて、日頃信心する尊像が、足を泥にして農事を助けた話は、全國に亘つて其例最も夥しいのである。引佐郡の久留女木に關しては、寛政元年の自序をもつ內山氏の遠江國風土記傳にも、別に一つの口碑を採集して居る。古老曰く、昔行基菩薩、諸國を行化して古鄕に歸る。老婆に問うて曰ふ、汝應に衣を洗ふべきや。答へて曰ふ、今まさに田の苗を殖ゑんとす、故に衣(を洗ふ)の暇無しと。菩薩いへらく、我將に汝に代りて田の苗を殖ゑんと、藁の偶人を造つて田每に之を置く。偶人忽ちに田を殖ゑ去つて水口より川に流れ、反轉して此處に止まる。故に久留女木と謂ふなりと。
  translation: '受けていたそうである。そのため、家には淵の主の使いがたびたびやってきた。そのたびに、蓼汁だけは嫌いだと繰り返していたのに、あるとき家の者がそのことを忘れ、もてなしの膳に蓼を添えて出した。使いは一口食べると「これはしまった」と叫び、そのまま淵に向かって転がり落ちていった。落ち込んだ姿を見ると、それまでは人間と同じ姿だったのが、赤い腹をした大きな魚になっていた。その魚は、水の中を流れ下りながら、しきりに「オトボウや、オトボウや」と呼び続けた。そのため、それからこの淵をオトボウ淵と呼ぶようになった。このことがあって以来、淵の主との縁は切れ、あれほどの金持ちも、たちまち家運が傾いた。土地の人の話では、このあたりでオトボウとは「父」のことで、死に際に父を呼んだのではないかという（以上四例は早川孝太郎君採録、『民族』二巻五号および三巻五号）。

    竜宮小僧が田植えを手伝ってくれたということは、農民でない人には、あまりにも小さな恩恵のように感じられるだろう。しかし、この時期の人手不足が村の最大の悩みだったばかりでなく、ここで仕事がはかどることは、実際に財産を蓄える主要な力でもあった。百姓にとっては、むしろ金銀や珊瑚、綾や錦などのほうこそ、縁遠い空想にすぎなかったのである。奥州の昔話のヨケナイやウントクが、ただ何かにつけてよく働き、家を豊かにしたという話のほうが、自然であるとともに具体的でもあった。

    夏のにわか雨の際に干し物を取り込んでくれたということも、外庭いっぱいにありったけのむしろを敷き、穀類などを広げたまま、一家総出で野良仕事に出るような土地でなければ、そのありがたさはよくわからない。奥州の座敷童子やオクナイサマというような家の神は、このように家の幸福を守ると信じられている。また、鼻取地蔵や田植仁王といって、日頃信仰している仏像が、足を泥まみれにして農作業を助けたという話は、全国にきわめて多くの例がある。

    引佐郡の久留女木については、寛政元年の日付の自序がある内山氏の『遠江国風土記伝』にも、別の伝承が一つ採録されている。

    古老の話では、昔、行基菩薩が諸国で教えを広めて故郷へ帰ってきた。老婆に「あなたは衣を洗ってくれないか」と尋ねると、「今は、田に苗を植えようとしておりますので、衣を洗う暇がありません」と答えた。菩薩は「それなら私が、あなたに代わって苗を植えよう」と言い、藁の人形を作って、それぞれの田に置いた。人形はたちまち田植えを終え、水口から川へ流れ出て、くるりと向きを変えて、この場所にとどまった。そのため久留女木というのだ、とある。'

  original: '諸國の瓜子姫

    右の一文を書いてしまつてから、更に幾つかの同じ話が報告せられた。私の分析は旣に稍〻微細の點に入り過ぎたから、玆にはたゞ新たなる類例を排列して、著しい異同だけを注意するに止めようと思ふ。一二津輕昔ご集(川合勇太郞氏)裏の畠に大きな瓜がなつた。それを採つて來て庖丁で切らうとすると、其中から聲がしてぢ樣ば樣、ちよつと待つてけへぢやと言ひ、自然に二つに割れて女の子が出て來る。神の御授けと思つて大事に育て、名を瓜姫子とつけた。瓜姫子は大きくなつて殿樣から嫁に貰ひに來る。それなら着物を買つて來ようと町へ行く時に、留守にアマノシヤグが來るかも知れぬから、氣をつけよと言つて爺婆は出て行く(機を織るといふことは無い)。さうしたら果してアマノシヤグが來て、'
  translation: '諸国の瓜子姫

    以上の文章を書き終えた後、同じ話が、さらにいくつか報告された。私の分析は、すでに細部へ入りすぎたので、ここでは新しい類例を並べ、著しい共通点・相違点だけに注意することにしたい。

    十二　『津軽昔ご集』（川合勇太郎氏）

    裏の畑に大きな瓜ができた。それを取ってきて包丁で切ろうとすると、中から声がした。

    「爺様、婆様、ちょっと待っておくれよ」

    と言い、ひとりでに二つに割れて、女の子が出てきた。神様からの授かりものだと思って大切に育て、瓜姫子と名づけた。

    瓜姫子が大きくなると、殿様から嫁に欲しいと申し込みがあった。それなら着物を買ってこようと町へ出かけるとき、爺婆は、留守にアマノシャグが来るかもしれないから気をつけなさい、と言って出ていった（機を織るということは出てこない）。すると果たして、アマノシャグがやってきて、'

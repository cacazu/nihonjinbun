  original: 九日向某地(國民童話)。一〇出雲松江市(高木氏日本傳說集).一一石見邑智郡井原村(旅と傳說一卷十二號、久長興仁君)。此中で最後の石見の例が、新らしい採集であるのみか、形も略〻整うて居るやうに思はれるから、こゝには是を標準に取つて、他の話との異同を比べて見ようと思ふ。
  translation: '九　日向のある土地（『国民童話』）。

    十　出雲松江市（高木氏『日本伝説集』）。

    十一　石見邑智郡井原村（『旅と伝説』一巻十二号、久長興仁君）。

    この中で、最後の石見の例は、新しく採集されたものであるだけでなく、話の形もおおむね整っているように思える。そこで、ここではこれを基準として、ほかの話との共通点や相違点を比べてみたい。'

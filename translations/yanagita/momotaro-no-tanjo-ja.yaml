  original: 話が土著して永く傳はることになつたか否かは疑問である。傳說は兎に角に或時代の住人が、實際そんな事が曾て有つたと信じて、語り傳へて居たものである。單に面白い昔話を聽いたといふだけでは、それを此地の出來事だと謂つても、我も人も承知し得る筈は無かつたのである。人によつては一度何處かに似寄りの昔話さへあれば、それが直ちに同系傳說の分布をも解說し得る如く、思つて居る者も無いとは限らぬが、それは少々荒つぽい斷定である。無論かたからそんな話を知らなかつたら、滅多に獨立して同樣のことも言ひ出すまいが、曾て此樹の根もとにとか、あの家の婆がと言ひ傳へるやうになる迄には、別に又新たなる事情動機の附加はることを必要とし、從うて話は爰で若干の屈曲を見ることになるのである。出雲で小池の婆といひ、越前で菖蒲池の孫右衛門が女房と謂つたのも、出たら目ではよもや無かつたらう。出來ない相談かも知れぬが私だけは、先づ其理由を調べて見たいと思ふのである。一番厄介な問題は狼の群の頭領乃至相談役が、どうして猫であつたかといふことと、それがもし今一つ前の普通の型であつたなら、後にどうして土佐越前の如く、是までが狼と入替るやうになつたかといふことであるが、一方の理由が解しにくくなれば、第二の改訂は自然にも起つたかも知れぬ上に、此方にも亦別にそれだけの因緣があつたやうである。順序として第一の場合を考へて見ると、獸が人の隱れて聽いて居るとも知らず、人間の言葉を使つて身元が顯はれたといふ話は、狼には他に例が無いやうだが猫には有る。猫が默々として始終會話の席に侍する樣子が、斯かる想像を生じ易かつたからであらう。近世の世間話には新著聞集にもあるやうに、梁木から堕ちて南無三と口走つたとか、院主樣が御惡いから今夜は出られぬと、答へたとかいふ風に實際化して居るが、普通にある型では猫が荒寺の庭などに集まつて踊を催し、どうして何々屋の三毛殿は遲いぞと謂つて居る所へ、やがて其三毛が來て斯ういふわけで遲くなつたと、家の内證事を語るので、始めて猫の忠義を知つたり、若くは反對に怖ろしい害心のあることを、心づいたりする結末になつて居るものが多い。もう一つ溯れば或は所謂公冶長說話、卽ち人が禽獸の語を解して利益を得たといふ話から、系統を引いて居ることが判らうも知れぬが、少なくとも近代の奇異譚の中では、物を言つて素性を暴露する話は、主として化猫の管轄に屬して居たのである。猫が年を取つて何れへか姿を隱すといふ事實は、今でもまだ不思議がられて居る。それだ
  translation: '話がその土地に定着し、長く伝わることになったかどうかは疑問である。伝説とは、ともかくある時代の住民が、本当にそのようなことがかつてあったと信じ、語り伝えたものである。ただ面白い昔話を聞いたというだけでは、それをこの土地の出来事だといっても、自分も他人も納得できるはずがなかった。人によっては、どこかに似た昔話さえあれば、それで直ちに同じ系統の伝説の分布まで説明できるように考える者もいないとは限らないが、それは少々大ざっぱな断定である。もちろん、ほかからそのような話を知らなければ、独自に同じことを言い出すこともめったにないだろう。しかし「昔この木の根元で」とか「あの家の婆が」と語り伝えるようになるまでには、さらに新たな事情や動機が加わる必要があり、したがって話はここで多少の曲折を生じる。出雲で「小池の婆」、越前で「菖蒲池の孫右衛門の妻」といったのも、まさかでたらめではなかっただろう。無理な相談かもしれないが、私だけはまずその理由を調べてみたいのである。

    最も厄介な問題は、狼の群れの頭領ないし相談役がなぜ猫だったのか、そしてそれが一つ前の普通の型だったなら、なぜ後には土佐や越前のように、それまで狼に入れ替わったのか、ということだ。だが前者の理由が理解しにくくなれば、後者の改変は自然に起きたかもしれないし、こちらにもまた別に、それだけのいわれがあったようである。順序としてまず第一の場合を考えると、獣が人に隠れて聞かれているとも知らず、人間の言葉を話して身元がばれたという話は、狼にはほかの例がないようだが、猫にはある。猫が黙ったまま、いつも人の会話の場に控えている様子が、そのような想像を生みやすかったからだろう。近世の世間話では、『新著聞集』にもあるように、梁から落ちて「南無三」と口走ったとか、「院主様のお具合が悪いので今夜は出られない」と答えたとか、具体的な出来事になっている。しかし普通の型では、猫が荒れ寺の庭などに集まって踊り、「どうして何々屋の三毛殿は遅いのか」と言っているところへ、やがてその三毛猫がやって来て、こういうわけで遅れたと家の内輪の事情を話す。それによって初めて猫の忠義を知ったり、逆に恐ろしい害意があることに気づいたりする結末が多い。さらにさかのぼれば、いわゆる公冶長説話、つまり人が鳥獣の言葉を理解して利益を得た話の系統であることがわかるかもしれない。しかし少なくとも近代の怪異譚では、物を言って素性を暴露する話は、おもに化け猫の受け持ちだったのである。

    猫が年を取るとどこかへ姿を隠すという事実は、今でも不思議がられている。それだ'
  notes:
  - 「公冶長説話」は、鳥獣の言語を理解する人物を扱う説話群を指す、著者の分類名。

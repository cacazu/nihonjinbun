  section: 瓜子織姫／六 瓜子姫の事業
  original: ある形に於ては、一旦は鬼の腹中に呑まれたことにまでなつて居り、御曹司島渡りの話などになると、所謂逃竄說話の最も際どいものを經なければ、寶物を分取りして凱旋するわけには行かなかつたのである。併し一方が鬼の降參とか、黍團子の拜領とかいふ類の、明るいやや滑稽なる叙述の方に走らうとして居たに反して、瓜子姫の方は忍苦の生活を說くに力を費した結果、話に幾分の陰慘を加重する嫌ひがあり、却つて終局の喜悅を微弱にした例さへ生じたのである。是は必ずしも男女氣質の相異といふだけの、簡單な原因からでは無く、別に民間の文藝にも喜劇は喜劇、悲劇はどこ迄も悲劇たらしめんとした、二つの感動の分化ともいふべきものが、徐々に昔話の傾向を引分けようとしたのかも知れぬ。改めて尙研究すべき題目であると思ふ。それに就いて一言だけ述べて置きたいのは、日本では紅皿缺皿等の名を以て知られて居るシンドレラの話は、最初はたゞ繼母に責めらるゝ姉娘が、幾多の苦難を嘗めて後大いに惠まれたことになつて居たのだが、それと丁度隣してお月お星、又はお銀小銀と稱して、徹頭徹尾いぢめられ拔く繼子話が發生した。父が歸つて見たら二人とも死んで居たり、又は盲目になってしまつて辛うじて再會したり、何れにしても暗い悲しい方面のみに、物語の大部分を向けて居るのは、要するに或時代に於ける悲劇趣味の發達を意味するものかと思ふ。瓜子姫は殊に由緒ある昔話ではあるが、不幸にして早く亦此種の感化を受けて居た。さうして鬼ケ島征伐とも匹敵すべき女の大事業が、如何に完成したかといふ結末を、往々にして稍〻不明にして居るので、愈〻他の一端の快活なる武功譚と、大きな距離があるやうに感じられて來たのである。
  translation: 'ある形では、いったん鬼の腹の中に呑み込まれたことにまでなっている。また、「御曹司島渡り」の話などでは、いわゆる逃走譚の中でも、最も危うい経験を経なければ、宝物を奪い取って凱旋することはできなかった。

    しかし、一方が、鬼の降参や黍団子をいただく場面など、明るく、やや滑稽な描写の方向へ向かおうとしたのに対して、瓜子姫のほうは、苦しみに耐える生活を語ることに力を注いだ結果、いくらか陰惨さを増す傾向があり、かえって結末の喜びを弱めてしまった例さえ生まれた。これは、必ずしも男女の気質が違うというだけの単純な原因によるものではない。別に、民間文芸にも、喜劇は喜劇として、悲劇はどこまでも悲劇として描こうとする、いわば二種類の感動への分化があり、それがゆっくり、昔話の傾向を分けていったのかもしれない。改めて研究すべき問題だと思う。

    この点で、一言だけ述べておきたい。日本で紅皿・欠皿などの名で知られるシンデレラの話は、初めはただ、継母にいじめられる姉娘が、幾多の苦難をなめた後、大いに幸せになるというものだった。それとまさに隣り合って、お月・お星、またはお銀・小銀と呼ばれ、初めから終わりまでいじめ抜かれる継子の話が生まれた。父が帰ってみると二人とも死んでいたり、目が見えなくなって、ようやく再会したりする。いずれにせよ、暗く悲しい側面に物語の大部分を向けているのは、要するに、ある時代に悲劇を好む趣味が発達したことを意味するのではないかと思う。

    瓜子姫は、とりわけ由緒ある昔話だが、不幸にも早くから、この種の影響を受けていた。そのため、鬼ヶ島征伐にも匹敵する女性の大事業が、どのように完成したのかという結末を、ときに、やや不明瞭にしている。それで、もう一方の快活な武功譚との隔たりが、いっそう大きいように感じられるようになったのである。'

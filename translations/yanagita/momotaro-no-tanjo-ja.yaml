  section: 米倉法師／五 餅と座頭・六 狐と座頭
  original: 亦盲が片意地で、且つ目は見えずとも欺くことの出來ぬ者だといふことを、常から主張して居た坊樣の所業かと考へられる。六.狐と座頭座頭は元來が笑話ばかりを以て、渡世の途を立てて居る者では無かつた。西國の方ではつい近頃まで、音曲も療治も二の次として、專ら竈祓ひの土用經を以て、衆人の歸依を繋いで居た盲僧が多かつた。其信仰が稍〻衰へて、始めて薩摩と筑前との琵琶は起つたのである。平家と何の交渉も無い越後などの田舍でも、追々と上方の文化が浸潤して來て、後には正月每にこの物語りを語りつゝ、御大家の門を廻禮する座頭が多くなり、古風なテンポガタリといふ早口の滑稽は、弟子の小盲をして型ばかり演ぜしめる迄になつて居た。だから北秋田の花都最期のやうな悲劇でも、段物として之を持傳へて居たと考へられぬことは無いのだが、幸か不幸か彼等永年の癖ともいふべき餅食ひ話を伴なうて居るばかりに、是も亦一種の當意卽妙人を見て法を說いた偶然の改作であることが露顯したのである。卽ちよく〳〵相手を甘く見るか、又は爰では道化の需要が無いと見切つた時には、再び持合せの笑話を變じて、斯んな大時代なローマンスと化する迄の、技倆をさへ彼等は持つて居たのである。人間に酒落氣が段々と强くなり、所謂遊び坊主の商賣が繁昌すると共に、古い眞面目な說話は片端から、笑話になつて行く傾向を示して居るが、そんな中でも今一ぺん逆戾りに、男盲が考案した悲劇といふものが幾つかあつた。それが北方の鄕土の花都座頭の餅のやうに、何れも趣向を今までの笑話と共通にして居るらしいのは、考へて見るとをかしなことで、素より彼等のうそをつく技能が、非凡に習練せられて居たことを語るものであらうが、同時に又我々大衆が、泣くにも笑ふにも自分と共同であり得ない者を賴んで、泣かせてもらひ笑はせてもらはうとした氣樂さが、測らずも斯ういふ澁い酸つぱい果實を結ぶことになつたので、此點ばかりは歷史とはいひながらも、尙將來の參考にならぬことは無いと思ふ。併しさういふ理窟をこねることは、私の最初からの目的では無かつた。それにまだ少しばかり、列記して見たい事實が殘つて居る。盲の文藝でも眞面目な悲劇ものの方は、笑話ほどには後の人たちが、眞似たり焼き直しをしたりしようとはしなかつた。それは御互ひの批判
  translation: '〔前のスキャンから続く〕目の見えない者は意地が強く、目は見えなくてもだますことはできない、と常々主張していた坊様の仕業だったのかと考えられる。

    六　狐と座頭

    座頭はもともと、笑い話だけで生計を立てていた者ではなかった。西日本では、つい近ごろまで、音曲も治療も二の次にして、もっぱら竈を祓う土用経によって、人々の信心をつなぎとめていた盲僧が多かった。その信仰がやや衰えてから、初めて薩摩と筑前の琵琶が起こったのである。平家と何の関わりもない越後などの田舎でも、上方の文化が次第に浸透してきて、後には正月ごとにこの物語を語りながら、大きな家々の門を年始に回る座頭が多くなった。古風なテンポガタリという早口の滑稽話は、弟子の幼い盲人に、形だけ演じさせるにとどまるようになった。したがって、北秋田の花都の最期のような悲劇も、段物として伝えていたと考えられないわけではない。しかし幸か不幸か、彼らの長年の癖ともいうべき餅食いの話が伴っていたばかりに、これも一種の機転で相手に応じて教えを説いた、その場かぎりの改作だったことが露呈した。つまり、相手をよほど甘く見たか、またはここでは道化に需要がないと見切ったときには、手持ちの笑い話を再び変えて、このような大げさで古めかしい物語にするほどの技量まで、彼らは持っていたのである。人間のしゃれを好む気持ちが次第に強くなり、いわゆる「遊び坊主」の商売が繁盛するとともに、古いまじめな説話は次々と笑い話になっていく傾向を示した。しかし、その中でももう一度逆戻りして、目の見えない男性が考案した悲劇がいくつかあった。それらが北方の郷土の花都座頭の餅のように、どれも以前の笑い話と趣向を共通にしているらしいのは、考えてみるとおかしなことである。もちろん彼らが嘘をつく技能を非凡なほど磨き上げていたことを示すのだろう。しかし同時に、泣くにも笑うにも自分と同じ気持ちにはなれない人に頼み、泣かせてもらい、笑わせてもらおうとした私たち大衆の気楽さが、思いがけず、このような渋く酸っぱい実を結ぶことになったのである。この点だけは、歴史上のこととはいえ、将来の参考にならないわけではないと思う。

    しかし、このような理屈を述べるのが、私の最初からの目的ではなかった。それに、まだ少し列挙してみたい事実が残っている。目の見えない人の文芸のうちでも、まじめな悲劇は、笑い話ほどには、後の人々がまねたり作り直したりしようとはしなかった。それは、お互いの批判が、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン276）と本文OCRを照合。
  - 冒頭文の転倒を画像照合して訂正。画像は「北方の鄕土」であり、OCR段階の仮読「辺土」を改めた。段物は長い物語を段に分けて語る演目。
  - 原文の歴史的差別語は文脈を保持し、通常は「目の見えない人」等と訳した。障害者の性質を一括りにする評価は著者の当時の見解であり、現代の事実認定ではない。

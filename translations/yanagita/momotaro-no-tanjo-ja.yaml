  section: 桃太郎の誕生／六 桃と瓜・七 妻もとめ
  original: '無暗に子供のやうに桃といふたゞ一つの特徵を把へて、桃の話ばかりを搜して見ようとしたのが、玄同放言と其隨喜者たちであつた。そんな比較などはして貰はぬ方がよつぽど好かつた。

    七妻もとめ

    比較をする位ならば異なつて居る點も考へて見なければならぬ。たとへば遠征の目的の如きも、日本の昔話の方はやはり單純化して居る。西洋の「桃太郞」たちの大旅行は、必ずしも財寶を持つて還るといふ爲ばかりで無かつた。寧ろそれを手段としてよき配偶者とよき家を得更に佳き兒を儲けて末永く榮えんとして居るのである。我々の側でも瓜子姫だけは、この幸福なる婚姻を以て結末として居るものがあるが、あちらでは男性の冒險者も、同じくその珍らしい寶物を持つて來て、終に王樣の聟となつた話が多いのである。察するに近代の桃太郞は子供を主人公にしたといふよりも、寧ろ子供にのみ聽かせる話であつた爲に、計畫を以てこの重要なる妻覓ぎの一條を省いたのであつた。奥州民間の桃の子太郞といふものには、地獄から手紙を持つて烏が來たので、此遠征を思ひ立つたといふのがある。さうして黍團子を携へて行つて地獄の門番の鬼を懷柔し、地獄のお姫樣を連れて逃げて來る。それを大鬼が火の車で追うて來るといふなどは、頗る亦御伽の御曹司島渡りとも似て居る。桃の子太郞の桃は夫婦の者が花見に行つて居た折に、女房の腰のあたりに轉がつて來たことになつて居るが、それと近い昔話にはスネコタンパコといふのもあつた。卽ち子を禱る女房の脛から生れたといふ親指の頭ほどな小さ子であつて、是も長者の娘を嫁に貰ひに行つたといふことが、かの一寸法師の草子と共通の話し方を具へて居る。信州木曾の小さ子塚の傳說といふものは、旣に破片となつて元の姿を究め難いが、あまり小さいので臼に入れて育てたといひ、或は笠の蔭に蔽はれて見えなかつたといふことだけは殘つて居る。ところが是が我邦の神子譚の、至つて古い形であつたと見えて、九州にも又東北のそちこちにも、神に禱つて授けられた申し兒が、笠の中に蟠かまつた小さな小さな小蛇であつた昔話が傳はつて居る。是も大きくなつて妻求めをして長者の家を訪問することは、他の多くの蛇聟入話と同じきものがあり、終りに花嫁の力によつて壯麗なる人間の若者の姿に復したと言つて居る。書傳は之を逸'
  translation: '……むやみに子どものように、桃というただ一つの特徴だけを捉え、桃の話ばかり探そうとしたのが、『玄同放言』と、それを喜んで受け入れた人々だった。そんな比較は、してもらわないほうがよほどよかった。

    七　妻もとめ

    比較をするのなら、違っている点も考えなければならない。たとえば遠征の目的も、日本の昔話のほうは、やはり単純化している。西洋の「桃太郎」たちの大旅行は、必ずしも財宝を持ち帰るためだけではなかった。むしろ、それを手段として、よい配偶者とよい家を得て、さらによい子をもうけ、末永く栄えようとしているのである。日本側でも、瓜子姫だけは、その幸福な結婚を結末にするものがある。だが西洋では、男性の冒険者も同じように珍しい宝物を持って来て、ついに王様の婿となる話が多い。思うに、近代の桃太郎は、子どもを主人公にしたというより、むしろ子どもにだけ聞かせる話だったため、意図的にこの大切な妻探しの筋を省いたのだった。奥州民間の「桃の子太郎」には、地獄からカラスが手紙を持ってきたので遠征を思い立った、という話がある。そしてきび団子を持っていき、地獄の門番の鬼を手なずけ、地獄のお姫様を連れて逃げてくる。それを大鬼が火の車で追いかけてくるという点などは、御伽草子の『御曹司島渡り』にもたいへんよく似ている。「桃の子太郎」の桃は、夫婦が花見に出かけたとき、女房の腰のあたりへ転がってきたことになっている。それに近い昔話に「スネコタンパコ」というものもあった。これは子どもを授かりたいと祈る女房のすねから生まれた、親指の先ほどの小さ子である。これも長者の娘を嫁にもらいにいったという点で、あの「一寸法師」の草子と共通の語り方を備えている。信州木曽の「小さ子塚」の伝説は、すでに断片になっていて元の姿を明らかにしにくいが、あまりに小さいので臼に入れて育てたとか、笠の陰に隠れて見えなかったという点だけは残っている。ところが、これは日本の神の子の物語の、ごく古い形だったらしい。九州にも東北のあちこちにも、神に祈って授けられた子が、笠の中にとぐろを巻いた小さな小さな蛇だったという昔話が伝わっている。これも大きくなって妻を求め、長者の家を訪ねる点は、ほかの多くの「蛇婿入り」の話と同じであり、最後には、花嫁の力によって立派で美しい人間の若者の姿に戻ったという。文字による伝えからは、この話が失わ……'

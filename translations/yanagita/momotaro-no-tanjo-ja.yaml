  section: 田螺の長者／五分次郎
  original: '葉で造つた舟に楊枝の桿をさして、每日川へ乘出して遊びまはつて居た。ところが或日水が

    增して瀨が强かつた爲に、押流されて海まで出てしまつた。それでも平氣で

    さつさ五分次郞は

    笹の葉で舟をして

    楊枝でぐいやさ

    と歌ひながら遊びまはつて居ると、大きな鯛が現はれて笹舟と共に、五分次郞を呑んでしま

    ふ。是は困つたと思つて居ると、運よく漁師がこの大鯛を網で捕つて、やがて或家へ持つて

    行つて賣る。爼の上に乘せて料理をしようとすると、五分次郞は腹の中から聲を掛けて、

    五分次郞が居るからそろそろと腹をあけよ

    と謂ひ、家の人が不思議に思つて氣をつけて腹をあけると、ひよつこり中から拇指位の五分

    次郞が飛出した。さうしてわけを話して家へ送り屆けてもらつた。それから益々力强くなつ

    て、爺さん婆さんに暇乞ひをして鬼ケ島征伐に出かける。犬猿雉の家來もつれずに、たつた

    一人で鬼ケ島に渡つた。鬼の頭領が之を見つけて、つまんで一口に呑んでしまふと、腰にさ

    して居た縫針の劍を拔いて、鬼の腹の中をそちこちと突刺す。鬼は痛がつてすぐに降參し、

    鬼ケ島の寶物を皆獻上する約束をする。そんならよしと言つて鬼の頭の方へ上つて來ると、

    鬼は急に鼻の中が痒くなつて、嚏をして五分次郞を鼻の穴から出した。それで寶物を馬に

    積んで、自分も其上に乘つて喜び勇んで歸つて來た。さうして爺も婆もいよいよ仕合せよ

    く安樂に世を渡ることが出來たといふ。

    この五分次郞が一寸法師の次に出來た名といふことは、容易に察し得られることであるが、

    後者も亦たしかに或時代の流行語であつた。嬉遊笑覽卷四にも多くの例を擧げて居るやう

    に、以前この言葉を珍重して誹諧の句にも用ゐて居たのは、恐らくはそれがまだ新奇なる意

    匠であつた間の事で、乃ち又草子の名の「一寸法師」が、古い小さ子說話から改案せらるべき

    機會でもあつたらうと思ふ。その一つ以前の形らしい「小さ子法師」といふ語も、今尙童兒の

    唱へごとの中には幽かに殘つて居る。用捨箱その他の書にある

    隱れんぼうにまじらぬ者は、ちいちやこもちや桂の葉

    などといふ童詞は、意味が全く不明になつてもまだ行はれて居る土地は多く(日本民謠大全、'
  translation: '――葉で作った舟を楊枝のさおで操り、毎日、川へこぎ出して遊び回っていた。ところがある日、水が増えて流れが強かったため、押し流されて海まで出てしまった。それでも平気で、


    さっさ、五分次郎は、

    笹の葉で舟を作り、

    楊枝で、ぐいやさ。


    と歌いながら遊び回っていると、大きな鯛が現れ、笹舟ごと五分次郎をのみ込んだ。困ったことになったと思っていると、運よく漁師がこの大鯛を網で捕り、ある家へ持っていって売った。まな板に載せて料理しようとすると、五分次郎は腹の中から、


    五分次郎がいるから、そろそろと腹を開けてくれ。


    と呼びかけた。家の人が不思議に思い、注意して腹を開くと、親指ほどの五分次郎が中からひょっこり飛び出した。そして事情を話し、家まで送り届けてもらった。


    それからますます力が強くなり、おじいさんとおばあさんに別れを告げて、鬼ヶ島征伐へ出かける。犬・猿・雉の家来も連れず、たった一人で鬼ヶ島へ渡った。鬼の頭領が見つけ、つまんで一口にのみ込むと、五分次郎は腰に差していた縫い針の剣を抜き、鬼の腹の中をあちこち突き刺す。鬼は痛がってすぐ降参し、鬼ヶ島の宝物をすべて差し出すと約束する。それならよしと、五分次郎が鬼の頭のほうへ上ってくると、鬼は急に鼻がかゆくなり、くしゃみをして、五分次郎を鼻の穴から出した。そこで宝物を馬に積み、自分もその上へ乗り、喜び勇んで帰ってきた。こうして、おじいさんもおばあさんも、いよいよ幸せに、安楽な一生を送ることができたという。


    「五分次郎」が「一寸法師」の後に生まれた名前であることは、容易に察せられるが、「一寸法師」もまた、確かにある時代の流行語だった。『嬉遊笑覧』巻四にも多くの例が挙げられているように、以前、この言葉を珍重し、俳諧の句にも使っていたのは、おそらく、それがまだ目新しい趣向だった間のことだろう。つまり、それはまた、草子の「一寸法師」が古い小さな子の説話から作り直される機会でもあったと思う。その一つ前の形らしい「小さ子法師」という言葉も、今なお、子どもの唱え言葉の中に、かすかに残っている。『用捨箱』などにある、


    かくれんぼに加わらない者は、ちいちゃこもちや、桂の葉。


    といった子どもの言葉は、意味がまったくわからなくなっても、まだ行われている土地が多い（『日本民謡大全』、――'
  notes:
  - 冒頭はスキャン135の引用の続き。末尾の出典・考察はスキャン137へ続く。
  - 歌・唱え言葉は文中でその語形自体が考察対象であり、音や意味不明の箇所を無理に意訳せず残した。

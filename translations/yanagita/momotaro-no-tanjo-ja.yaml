  original: 大に優遇して、良い家を建てて樂々と暮らせるやうにしてくれた。めでたし。多くの是までの求婚冒險談では、小さいか貧しいか醜いか惰け者か、何れか一つでも美人の妻を得たことを奇蹟として居たのに、此話の若者は現に其三つを兼備して居た。それでも福分あり智慧があれば優に成功するといふことを、爰では長者の愚鈍を價にして實現させて居るのである。鬼が島の鬼が非常に弱く、寶物交換譚の天狗や狐が、法外に淺慮であつたのと同じく、つまりは是も實世界に不滿の多い凡人たちを、樂しませる爲の空想であつたと思ふ。それからこの幸福なる惰け者を、寢太郞だの睡蟲だのと謂ふ代りに、ばくち打のしやうの無い者であつたとして居るのも、近頃奥州で始まつたことでは無くして、古くからの話術であつたのである。單なる愚か者が突然として賢くなり、世にも稀なる長者となつたといふ爲には、そこに前兆なり隱れたる力の導きなりが、あつたことを說かなければならなかつたのであるが、其點が次第に常人には信じ難くなると、話はどうしても斯ういふ方へ出て行くの他は無かつたのである。今日ならば「惰け者」にも色々の種類があるが、中世には恐らく寢るか賭博をする以外に、人に嫌はれて除け者にされる生活が、さう澤山には無かつたのであらう。其上に又博打ちの賽といふものには、特殊なる神祕があつた。それ故に獨り長者の聟になる話だけで無く、妖怪變化を欺いて成功した話などが、是に基づいて際限も無く發達したのである。桃太郞や御曹司の島渡りに於ても、敵の寶物を捲上げることが勝利の手段であり、「一寸法師」でも先づ打出小槌を手に入れて、それから立身が思ふまゝであつた如く、我我の寶物交換譚には、法師や易者が祕傳の品だと稱して、何でも無い贋物を狐に渡す話と、博徒の持つ賽ころを天狗などが所望する話との二通りあるが、前者は多分第二次の轉化であつたらしい。賽と取替へられたといふ天狗の寶物にも、羽團扇と隱れ蓑笠との二種があつて、雙方ともに今は落語のやうな結末を以て笑はせて居るが、是にも曾ては目出たし〳〵の、本式の形態があつたのでは無いかと思ふ。信州北安曇郡などの「隱れ蓑笠」の話では、博徒が賽と交換して來た天狗の隱れ蓑を、女房が知らずに燒棄てたので、其灰を身に塗つて酒屋に忍び込んだといふ迄は、他の地方に行はるゝものと同じことであるが、爰ではそれが丁度何れの話にもよく有る中途一回の危機であつて、それを通り越して結局は其妻の智慮ある援助に
  translation: '……たいへん大切に扱い、よい家を建てて、楽に暮らせるようにしてくれた。めでたいことだ。

    これまでの多くの求婚冒険談では、小さい、貧しい、醜い、怠け者である、といううちのどれか一つに当てはまっていても、美人の妻を得たことを奇跡としていた。ところが、この話の若者は実際にそのうち三つを兼ね備えていた。それでも、与えられた幸運と知恵さえあれば十分に成功するということを、ここでは長者の愚かさを代償にして実現させているのである。鬼ヶ島の鬼がとても弱く、宝物交換の話の天狗や狐が、並外れて思慮に欠けていたのと同じく、これも結局は、現実の世界に不満の多い普通の人たちを楽しませるための空想だったと思う。

    また、この幸運な怠け者を、寝太郎や睡虫と呼ぶ代わりに、博打打ちのどうしようもない男だったとしていることも、近ごろ奥州で始まったのではなく、昔からの語りの工夫だったのである。ただの愚か者が突然賢くなり、世にも珍しい長者になったとするには、そこに前兆や、隠れた力の導きがあったと語らなければならなかった。しかし、その点を普通の人が次第に信じにくくなると、話はどうしても、このような方向へ進むしかなかった。今日なら「怠け者」にもさまざまな種類があるが、中世にはおそらく、寝ているか博打をする以外に、人に嫌われ、のけ者にされる暮らし方は、それほど多くなかったのだろう。そのうえ、博打のさいころには、特別な神秘性があった。それで、長者の婿になる話ばかりでなく、妖怪や化け物をだまして成功した話などが、これをもとに際限なく発達したのである。

    桃太郎や御曹司の島渡りでも、敵の宝物を巻き上げることが勝利の手段であり、『一寸法師』でも、まず打出の小槌を手に入れ、その後は思いのままに出世した。これと同様、私たちの宝物交換の話には、法師や易者が秘伝の品と称して、何でもない偽物を狐に渡す話と、博徒の持つさいころを天狗などが欲しがる話との二通りがあるが、前者はおそらく二次的な変化だったらしい。さいころと交換されたという天狗の宝物にも、羽団扇と隠れ蓑・笠の二種類があって、どちらも今は落語のような結末で笑わせている。しかし、これにもかつては「めでたし、めでたし」で終わる本来の形があったのではないかと思う。信州の北安曇郡などの「隠れ蓑笠」の話では、博徒がさいころと引き換えに天狗からもらってきた隠れ蓑を、妻が知らずに焼き捨ててしまう。その灰を体に塗って酒屋に忍び込む、というところまでは、ほかの土地に伝わる話と同じである。だが、ここではそれが、さまざまな話によくある途中の一度の危機にあたり、それを乗り越え、結局は妻の知恵ある助けに……'
  notes:
  - 冒頭はscan156の引用の結び。末尾はscan158冒頭に続く。
  - 御曹司はここでは島渡り物語の主人公を指す原文の呼称を保持した。

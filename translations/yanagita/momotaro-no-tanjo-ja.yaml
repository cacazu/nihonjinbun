  section: 瓜子織姫／四 申し兒の靈驗
  original: 屢何心無き挿話になつて居る。それは唯偶然の不思議を愈〻不思議ならしめるだけの話し方と解する人も有るか知らぬが、それに附け加へていま一點、婆が水上に向つて「もう一つ來い爺樣に遣ろ」といふと、果して問題の第二の瓜又は桃が流れて來たことになつて居るのは、確かに念願と應驗との關係であつた。婆が川端で早速最初の瓜の味を試みたといふことは、持つて還つて爺と二人で食べようと言つた話と比べると、人情味も足らず、又有りさうにも無いことだが、是非とも「もう一つ」と言はなければならなかつた點に、何か隱れたる意味があつたので、事によつたら是も以前は聽く者が待遠しくなる迄、何遍と無く同じ言葉を繰返して居たのが、後に形を整へて三度目の正直、又は二度目の見直しを以て終局とすること、恰かも出雲の佐陀大神の神話の如くになつたのかとも考へられる。中世以降の高僧傳などには、申し兒の話は非常に多い。單に靈夢の御告等に由つて、生るる兒の英俊なるべきことを豫期するに止まらず、進んで神佛に之を要望した場合に、始めて非凡の童兒が授けられたことになつて居る。其點は昔話の一寸法師系のものも、大抵は皆一樣であつた。實際桃太郞の如き大事業を爲し遂げた者が、たゞ偶然に子をもたぬ老夫婦の家に生れ合せたといふことは、恐らくは古人の信じ能はざることであつた故に、そこに第二の桃と謂ひ、「もう一つ來い」といふ唱へ言をしたといふ一條が入つて居たのであらう。瓜子姫の方でも右の石見の話以外に、是が陸中に一つ(二)と日向に一つと、飛離れて一致があるのは、私には理由があるやうに思はれる。さうすると更に一步を進めて、婆が川に出たのを「洗濯に」といふ點も、或は童話になつてからの話し方の改良かも知れない。同じく分布の廣い「屁をひらぬ女に栽ゑさせよ」といふ昔話なども、琉球の久高島では黄金の瓜になつて居て、之を海から拾ひ上げたといふ王子は、每朝潔齋をして東の濱に出て待つて居たら、浪に搖られて其瓜が漂着したといふことになつて居る。卽ち形は全く違つて居るけれども、是も亦加賀神崎の傳說の系統に屬せしむべきものであつたのである。
  translation: 'しば、何気ない挿話になっている。これは、単に偶然の不思議を、いっそう不思議に見せるための語り方だと考える人もいるかもしれない。しかし、それに加えてもう一点、お婆さんが川上に向かって「もう一つ来い、爺様にやろう」と言うと、果たして問題の二つ目の瓜や桃が流れてきたことになっているのは、確かに願いと、その成就との関係を示していた。

    お婆さんが川端ですぐに最初の瓜を食べてみたという話は、持ち帰ってお爺さんと二人で食べようと言った話に比べると、人情味に乏しく、実際にもありそうにない。それでも、どうしても「もう一つ」と言わなければならなかった点には、何か隠れた意味があったのである。もしかすると、これも以前は、聞き手がじれったくなるまで何度も同じ言葉を繰り返していたのが、後に形を整え、「三度目の正直」または「二度目の見直し」で終わるようになり、ちょうど出雲の佐陀大神の神話のようになったのかとも考えられる。

    中世以降の高僧伝などには、申し児の話が非常に多い。霊夢のお告げなどによって、生まれてくる子が優れた人物になると予期するだけでなく、進んで神仏に子を願い求めたとき、初めて非凡な童子が授けられることになっている。この点は、一寸法師系統の昔話でも、ほとんど皆同じだった。

    実際、桃太郎ほどの大事業を成し遂げた人物が、ただ偶然、子のない老夫婦の家に生まれ合わせたということは、おそらく昔の人には信じられなかった。そのため、二つ目の桃のことや、「もう一つ来い」という唱え言をしたという一節が、そこに含まれていたのだろう。瓜子姫でも、先に挙げた石見の話のほかに、陸中に一例（二）、日向に一例と、遠く離れた土地に一致が見られることには、私には理由があるように思われる。

    そう考えると、さらに一歩進めて、お婆さんが川へ出たのを「洗濯に」とする点も、童話になってから語り方を整えた結果かもしれない。同じく広く分布する「屁をひらぬ女に植えさせよ」という昔話も、琉球の久高島では黄金の瓜の話になっている。それを海から拾い上げたという王子は、毎朝身を清めて東の浜へ出て待っていると、波に揺られながら、その瓜が漂着したという。つまり形はまったく違っていても、これもまた、加賀神崎の伝説の系統に属するものとすべきだったのである。'

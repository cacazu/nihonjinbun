- id: mmt-181-01
  scan: 181
  section: 絵姿女房／四 安積山の糠次郎・五 般若寺の磐若姫
  original: '近代の傳說の中には、斯ういふ風に典據を重んじ、記錄と最大限度の調和を保つて居るも

    のが稀では無い。無論學殖の豐かな神職僧侶の參加があつて、始めて望み得る難事業であつ

    たが、それでも姿繪が千里の空を飛んだ點と、男の名が糠次郞であつたといふ點だけは、尙

    土地の人の古く持つものを無視することが出來なかつたのである。糠次郞は八戶の蕪燒笹四

    郞の如く、若い貧しい農民の綽名であつて、糠を食べて露命を繋いで居る程の貧人であつた

    ことを言つたのださうである。以前海南小記の中にも書いて置いたが、奄美大島の屋喜內方

    にも湯灣五郞又の名を糠五郞といふ男、全く偶然の幸運によつて、沖繩へ渡つて立身して貴

    族となつた話が傳はつて居る。所謂エンブの果報が無かつたならば、第一斯んな糠次郞に美

    しい長者の娘が、嫁に來る筈も無かつたのである。それから考へて行くと、此等の貧しい靑

    年が女房の傍にばかりへばり附いて、田畑が草になるまで働きに出なかつたといふことは、

    亦一種の物草太郞であつたかも知れぬ。其樣に貧しく且つ惰け者ではあつたけれども、兼て

    定まる女房の緣に引かれて、意外なる理由を以て危難を乘越し、末には榮えて長者の祖とな

    つたといふことが、もとは此說話の骨子であつて、繪姿の一條などは、たゞその「意外」の新

    しき例として、最初から話し手の自由なる空想に、委ねられて居た部分であつた故に、

    斯う

    して次々に珍らしい話の種を、喚んでは取附けることになつたのかと思ふ。此假定の正しい

    か否かは、次の「殿樣の難題」の變化を比べて見ても、亦よほど明かになつて來る。

    安積山の

    今ある口碑が、他の類例と反して悲劇を以て結末を付けて居ることは、

    是は近代傳說の癖の

    やうなものであつたが、其爲に糠次郞立身の快活なる昔話の興味を、丸々埋沒させてしまふ

    ことは、まだ幸ひにして出來なかつたのである。

    五般若寺の磐若姬

    繪姿女房の物語が、終り悲しき傳說として殘つて居る例は、周防室津半島の箕山の周圍に

    も今一つある。それが我々の寢太郞荒神の舊跡と、程遠からぬ地であつたといふことは、

    自

    分には偶然で無いやうに考へられる。此傳說は口に筆に、實に色々の形を以て世に行はれて

    居るが、今日麓の村々で人が說いて居るものは、比較的簡單又無邪氣なものであつた。

    昔用明天皇が太子の時、或日大きな凧が何處からか飛んで來て、御庭の松の枝に引掛か'
  translation: '近代の伝説には、このように典拠を重んじ、記録とできる限り整合するようにしているものが少なくない。もちろん、学識豊かな神職や僧侶が加わって、初めて実現が望める難しい仕事だった。それでも、姿絵が千里の空を飛んだという点と、男の名が糠次郎だったという点だけは、土地の人々が古くから持っていたものを無視できなかったのである。

    糠次郎は、八戸の蕪焼笹四郎のように、若く貧しい農民につけられたあだ名で、糠を食べてかろうじて命をつなぐほどの貧乏人だったことを表すのだという。以前『海南小記』にも書いておいたが、奄美大島の屋喜内方にも、湯湾五郎、別名を糠五郎という男が、全く偶然の幸運によって沖縄へ渡り、出世して貴族になったという話が伝わっている。いわゆるエンブの果報がなかったら、そもそも、こんな糠次郎のところへ美しい長者の娘が嫁いでくるはずはなかったのである。

    そこから考えていくと、これらの貧しい青年が妻のそばにばかりくっつき、田畑が草に覆われるまで働きに出なかったというのも、一種の物草太郎だったのかもしれない。そういう貧しい怠け者ではあったが、前から定まっていた妻との縁に導かれ、思いがけない事情で危難を乗り越え、最後には栄えて長者の家の祖先になった、というのが、もとはこの説話の骨組みだったのではないか。姿絵のくだりなどは、その「思いがけないこと」の新しい例にすぎず、初めから語り手の自由な空想に委ねられていた部分だったため、こうして次々に珍しい話の種を呼び込んで付け加えることになったのかと思う。

    この仮定が正しいかどうかは、次の「殿様の難題」の変化を比較しても、かなり明らかになる。現在ある安積山の言い伝えが、ほかの似た例とは違って悲劇で終わっているのは、近代の伝説の癖のようなものである。しかし、そのために、糠次郎が出世する明るい昔話の面白さを、すっかり埋もれさせてしまうことは、幸いにも、まだできなかったのである。

    五　般若寺の磐若姫

    絵姿女房の物語が、悲しい結末の伝説として残っている例は、周防の室津半島の箕山の周辺にも、もう一つある。それが、私たちが取り上げてきた寝太郎荒神の旧跡から、それほど遠くない土地だったことは、私には偶然ではないように思われる。この伝説は、口伝でも文章でも、実にさまざまな形で世に伝わっているが、現在、ふもとの村々で人々が語っているのは、比較的単純で素朴なものだった。

    昔、用明天皇がまだ皇太子だったとき、ある日、大きな凧がどこからか飛んできて、御庭の松の枝に引っ掛かっ'
  notes:
  - 末尾はscan182に続く。
  - 地名「屋喜内方」、人名「蕪焼笹四郎」を原画像で確認。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。

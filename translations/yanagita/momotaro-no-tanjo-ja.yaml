  section: 田螺の長者／二 蛙の王子と蛇の王子・三 小泉小太郎と泉小次郎
  original: '近して居た證據であつて、多分は蛇の方にも奄美大島の蛙のやうに、いつ迄も小さかつたと

    いふ話し方があつたのであらう。スネコタンパコが下駄の齒の蔭になつて見えなかつたとい

    ふ可笑味に至つては、旣に御伽草子の「一寸法師」にも見えて居て最も有名な挿話であつた。

    一寸法師は針に麥稈の柄鞘を拵へたる太刀を佩き、御器を舟とし箸を棹として、淀川を鳥羽

    の津まで上つて來た。さうして三條の宰相殿を訪れて、やはり足駄の下より物申さんと言う

    たとあるのである。宰相殿の姫君は年十三歲、容顏優れておはします。如何にもして思案を

    廻らし、我女房にせばやと思うて、茶袋の散米を嚙んで夜竊かに姫が御口に塗つたといふ點

    も同じであつた。そんなら此草子を讀んだ者が、之を口譯して東北に傳へたかといふと、鬼

    と戰をして打出小槌を卷上げた點は此に無く、脛から產れたといふ點は彼に無くして、却つ

    て南島の蛙の話と一致して居るのである。假に御伽草子が奥州の民話を筆錄修飾したのでは

    無くとも、少なくとも當時此口碑の旣に都鄙に行はるゝものがあつて、是はたまたま其一つ

    の形が、筆に遺されたに過ぎなかつたのである。但し今日の桃太郞童話が、故意にその求婚

    談の部分を省略し、專ら鬼島征伐の無邪氣なる武勇のみを說くやうになると、是と他の色々

    の申し兒說話との關係は、どうしても不明になり勝ちであるが、幸ひに御伽の「一寸法師」が

    中間に居るので、總括して元の起りを考へて見ることが出來る。神に授けられた多くの異常

    童子が、忽ち成長して直ぐに妻もとめに出かけること、さうして美しい花嫁を貰つて來るこ

    とが、時としてはその赫々の功名よりも大切に取扱はれて居たのは、それが家々の始祖とし

    て、又清き血の流の源頭として、熱心に語り傳へられ、敬虔に記憶せられる必要があつたか

    らで、單なる戀愛談の興味の爲に起つたものでは無いと思ふ。餅を背なかに負うて持つて行

    つて食はせたと言ひ、或は米を袋に携へて夜の床で共に噛んだといふ事なども、恐らくは其

    婚姻の合式確實のものであつたことを語るので、從うて桃太郞の黍團子乃至は舌切雀の糊な

    ども、今は童話化して全然別の目的に用立つて居るけれども、事によると是も亦曾てこの語

    りごとの中に、求婚成功の一節があつた痕跡であるのかも知れぬのである。

    三 小泉小太郞と泉小次郞

    神のお授けによつて蛇を子にしたといふ昔話は、蛙よりもずつと弘く行はれて居たらしい。'
  translation: '――あった証拠である。おそらく蛇のほうにも、奄美大島の蛙のように、いつまでも小さかったという語り方があったのだろう。スネコタンパコが下駄の歯に隠れて見えなかったというおかしさに至っては、すでに御伽草子の「一寸法師」にも出てくる、最も有名な挿話だった。一寸法師は、針に麦わらの柄と鞘をつけた太刀を差し、お椀を舟に、箸をさおにして、淀川を鳥羽の港まで上ってきた。そして三条の宰相殿を訪ね、やはり「足駄の下から申し上げます」と言ったとある。宰相殿の姫君は十三歳で、容貌がすぐれていた。何としても工夫を凝らして妻にしたいと思い、茶袋の散米をかんで、夜、ひそかに姫の口に塗ったという点も同じだった。それなら、この草子を読んだ人が、口で語り直して東北へ伝えたのかというと、鬼と戦って打ち出の小槌を取り上げたくだりはこちらにはなく、すねから生まれたという点はあちらにはなくて、かえって南の島の蛙の話と一致するのである。仮に御伽草子が奥州の民話を記録し、飾り立てたものではないとしても、少なくとも当時、この口伝がすでに都にも地方にも伝わっていて、これはたまたま、その一つの形が文字に残されたにすぎなかったのである。


    ただし、今日の桃太郎童話が、わざわざ求婚のくだりを省き、ひたすら鬼ヶ島征伐の無邪気な武勇だけを語るようになると、これとほかのさまざまな申し子説話との関係は、どうしてもわかりにくくなりがちである。幸い、御伽草子の「一寸法師」がその中間にあるので、全体を見渡して、もとの起こりを考えることができる。神に授けられた多くの普通とは違う子どもが、たちまち成長してすぐに妻を求めに出かけ、美しい花嫁をもらってくることが、時には華々しい功績以上に大切に扱われていた。それは、その子がそれぞれの家の始祖として、また清らかな血筋の源として、熱心に語り伝えられ、敬虔な気持ちで記憶される必要があったからで、単なる恋愛話への興味から起こったのではないと思う。餅を背負って持っていき食べさせたとか、米を袋に入れて持っていき、夜の寝床で一緒にかんだといったことも、おそらく、その婚姻が正式で確かなものだったことを語っている。したがって桃太郎の黍団子、さらには舌切雀の糊なども、今は童話になってまったく別の目的に使われているが、ひょっとすると、かつてこの物語にも求婚成功の一節があった、その痕跡なのかもしれない。


    三　小泉小太郎と泉小次郎


    神のお授けで蛇を子にしたという昔話は、蛙の話よりも、ずっと広く伝わっていたらしい。'
  notes:
  - 冒頭はスキャン120から続く。節見出しを本文とともに収録。
  - 「散米」は神仏に供える米。

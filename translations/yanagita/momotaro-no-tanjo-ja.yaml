  section: 桃太郎の誕生／七 妻もとめ・八 昔話の本の姿
  original: '至つて賤しい爺と婆との拾ひ上げた瓜や桃の實の中からでも、鬼を退治するやうな優れた現人神は出現し得るものと、信ずる人ばかりの住んで居た世界に於て、この桃太郞の昔話も誕生したのであつた。それから以後の色々の變化は、單なる成長であり乃至は老衰であつて、我々はこの一つの生きて行くものに、新たな生命を賦與する力は有たなかつたのである。

    八昔話の本の姿

    此推定は今はまだ大膽と評せられるかも知らぬが、之を側面から證明し得る資料に、前にも一言して置いた蛇聟入譚、卽ち說話流傳の第二の樣式によつて、固有信仰の推移の幾つかの階段に在る口碑と併び行はれて、今も其間に細かな比較を許さるゝ說話がある。我々の「桃太郞」は幸ひなことに、是とも若干の聯絡をもつて居た。神が小蛇の形になつて、人間の美女に求婚したといふ話は、上代の百襲止媛の記錄にも殘つて居る。卽ち錦の文ある小さな蛇が、女のたつての望にまかせて、櫛笥の中に其姿を現じたといふので、其神がやはり小子部連の祖が迎へ申したと稱する三輪山の後の高山、三諸岳の大神たる大物主であつた。是などは明白に神が小蛇の姿になつて現はれたので、蛇が神として拜まれて居たのでは無かつた。單に人間の娘には蛇としか見えなかつたといふだけである。然るにそれを唯靈ある蛇體が、人の美しい少女を戀ひ慕ふものと解するやうになつて、次第に我々の忌みは怖れとなり、之を災難の如く厭ひ避けて、終には祈禱や武勇の力を以て、擊退し又は報復したといふ傳說を生じ、更に一方には臼を負うて水に堕ち沈み、あはれな辭世の歌を詠んで流れたといふ、猿聟入の童話をさへ生ずるに至つた。是れ疑ひも無く此國人の信仰の變化の痕であつた。この美しい錦の小蛇といふ想像の起りも、私たちには略〻わかつて居る。是は今でも稻妻の名を以て呼ばるゝ電光の形から、之を太陽が此世に通はうとする姿と考へるに至つたので、或は黄金の箭とか丹塗りの矢によそへたこともあつたが、實際に天から人界に降つて來る火の線は、蛇のやうにうねり又走つて居たのである。次にはその光の蛇が妻を覓めんとした目的も、日本でならばまだ跡つけ得られる。卽ち人界に一人の優れたる兒を儲けんが爲、天の大神を父とし、人間の最も清き女性を母とした一個の神子を、此世に留めようが爲であ'
  translation: '……身分のごく低い爺と婆が拾い上げた瓜や桃の中からでも、鬼を退治するほど優れた現人神が現れうると、誰もが信じていた世界に、この桃太郎の昔話も生まれたのだった。それ以後のさまざまな変化は、単なる成長、あるいは老衰であり、私たちには、この一つの生きていくものに新しい生命を与える力はなかったのである。

    八　昔話の元の姿

    この推定は、今はまだ大胆だと評されるかもしれない。しかし、これを側面から証明できる資料として、前にも一言述べておいた「蛇婿入り」の話がある。すなわち、説話が伝わる第二の様式によって、固有の信仰の変遷のいくつかの段階にある口伝えと並んで伝わり、今なおそれらの間で細かな比較ができる説話である。幸い、日本の「桃太郎」は、これともいくらかのつながりをもっていた。神が小蛇の姿になり、人間の美しい女性に求婚したという話は、古代の百襲止媛の記録にも残っている。錦のような模様のある小さな蛇が、女の強い願いを受け入れて、櫛を入れる箱の中に姿を現したというのである。その神は、やはり小子部連の祖先が迎えたとされる、三輪山の背後の高山、三諸岳の大神、大物主だった。これは明らかに、神が小蛇の姿で現れたのであって、蛇が神として拝まれていたのではない。単に人間の娘には、蛇としか見えなかったというだけである。ところが、それをただ、霊力のある蛇が人間の美しい少女に恋い焦がれるものと理解するようになった。しだいに私たちの慎んで敬う気持ちは恐怖となり、災難のように嫌って避け、ついには祈祷や武勇の力で撃退し、あるいは仕返ししたという伝説が生まれた。さらに一方には、臼を背負って水に落ち沈み、哀れな辞世の歌を詠んで流れていったという、「猿婿入り」の童話さえ生まれるに至った。これは疑いなく、この国の人々の信仰が変化した跡だった。

    この美しい錦の小蛇という想像の起こりも、私たちにはおおよそわかっている。これは今も「稲妻」という名で呼ばれる電光の形から、それを太陽がこの世に通って来ようとする姿と考えるようになったのである。黄金の矢や丹塗りの矢になぞらえたこともあったが、実際に天から人間の世界へ降りてくる火の線は、蛇のようにうねり、走っていた。次に、その光の蛇が妻を求めた目的も、日本ならまだ跡をたどれる。それは人間の世界に一人の優れた子をもうけるため、天の大神を父、人間の最も清らかな女性を母とする一人の神の子を、この世に残そうとするためだっ……'

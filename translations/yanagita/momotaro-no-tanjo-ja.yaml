- id: mmt-047-01
  scan: 47
  section: 海神少童
  original: 'の樣な木の面や版畫を、竈の神として掛けて置く風があるのだから、つまり此風習の起りを

    說明したものであつた。それで此昔話の採集者や友人たちは、ヒヨウトクは卽ち火男であつ

    て、今日の所謂ヒヨツトコの面、口を尖らし火を吹いて居るものと、根本は同じ名であつた

    らうと解して居るのである。

    何にしても水の神から贈られたといふ童子は、非常に汚なくて見た所少しも有難さうで無

    かつた。たゞ心の素直にして神靈の指揮に從順であつた親爺のみが、大切に之を養ひ立てて

    其福分にあやかつたのである。肥前島原で謂ふ黑猫なども、其形は餘りにも變つて居るが、

    話の趣意に於ては同一であつたことが其結果からして窺ひ知られるのである。ハナタレ小僧

    樣の非常に形が小さくて、家の神棚の脇にすゑて置く位であつたといふなども、ヨケナイ、

    ウントクが醜い顏をして居たのと同じく、やはり最初は人は見かけによらぬといふことを說

    明する方が主では無かつたらうか。此想像の一つのよりどころは、例の一寸法師の昔話であ

    る。一寸法師の元の名は「小さ子」であつて、是も亦一つの嘲弄の異名であつた。何かの機會

    に於てその「小さ子」が俄然として成長し、普通の人間には出來ない樣な難事業を完成し、彼

    を大切に育てて居た爺と婆とを幸福にする。さうして其子は御伽草子の一寸法師に於ても、

    又奧州のスネコタンパコの昔話に於ても、共に信心祈願によつて授けられた兒といふことに

    なつて居るのである。今では此點を深く注意する人も無いやうだが、桃太郞は桃の中から、

    瓜子姫は瓜の中から、竹取物語の赫奕姬は竹の節の間から生れ出たといふのは、何れも最初

    は甚だしく小さかつたことを意味して居たのである。此以外にも尙一つ、同じ系統の珍らし

    い例として、申し兒が小さな蛇の形を以て生れ出たといふ昔話があるが、是などは蛇である

    だけに人間よりも更に成長が目ざましかつた。鉢に入れて置くと鉢に一杯になり、盥に入れ

    て置くと盥に一杯になり、次には馬槽に入れて育てたといふ話もある。奈良の朝廷の代に出

    來た常陸風土記にも、努賀毗咩といふ婦人が神の兒を生んで、それが小蛇の姿であつたこと

    を次の樣に記して居る。

    卽ち淨杯に盛りて壇を設けて安置す。一夜の間に巳に杯中に滿てり。更に甕を易へて置

    けば亦甕の內に滿つ。此の如きこと三たび四たび云々。

    是も恐らくはあの時代の、信じられたる昔話の一つであつたらう。'
  translation: 'のような木の面や版画を、竈の神として掛けておく習慣があるのだから、つまり、この習慣の起こりを説明したものだった。それで、この昔話の採集者や友人たちは、ヒヨウトクはすなわち火男であり、今日いうヒヨットコの面、つまり口をとがらせて火を吹いている姿のものと、根本では同じ名なのだろうと解釈している。

    ともかく、水の神から贈られたという子供は、非常に汚く、見たところ少しもありがたそうではなかった。ただ、心が素直で神霊の指示に従順だったおじいさんだけが、その子を大切に育てて、福にあずかったのである。肥前島原でいう黒猫なども、姿はあまりに違うけれども、話の趣旨は同じだったことが、その結末からうかがえる。ハナタレ小僧様の体が非常に小さく、家の神棚の脇に置いておけるほどだったということなども、ヨケナイやウントクが醜い顔をしていたのと同じく、やはり初めは、人は見かけによらないということを説明するのが主な目的だったのではないか。この想像の手がかりの一つは、あの一寸法師の昔話である。一寸法師のもとの名は「小さ子」で、これも一つの、からかいの呼び名だった。何かのきっかけでその「小さ子」が急に成長し、普通の人間にはできないような難しい事業を成し遂げて、自分を大切に育てていたおじいさんとおばあさんを幸せにする。そしてその子は、御伽草子の一寸法師でも、奥州のスネコタンパコの昔話でも、ともに、信心して祈ったことで授けられた子となっている。今では、この点に深く注意する人もいないようだが、桃太郎が桃の中から、瓜子姫が瓜の中から、『竹取物語』のかぐや姫が竹の節の間から生まれ出たというのは、どれも最初はきわめて小さかったことを意味していたのである。

    このほかにも、同じ系統の珍しい例として、祈りによって授かった子が小さな蛇の姿で生まれたという昔話がある。こちらは蛇であるだけに、人間よりさらに成長が目覚ましかった。鉢に入れておくと鉢いっぱいになり、たらいに入れておくとたらいいっぱいになり、次には馬の飼い葉桶に入れて育てたという話もある。奈良の朝廷の時代にできた『常陸風土記』にも、努賀毗咩という女性が神の子を産み、それが小蛇の姿だったことを、次のように記している。

    そこで清らかな杯に入れ、壇を設けて安置した。一夜のうちに、もう杯いっぱいになった。さらに甕に入れ替えておくと、やはり甕の中いっぱいになった。このようなことが三度、四度あった、という。

    これもおそらくは、その時代の、事実として信じられていた昔話の一つだったのだろう。'
  notes:
  - 「努賀毗咩」は原文の神話上の人名。
  - 「赫奕姬」はかぐや姫。原文の引用も省略せず現代語に訳した。

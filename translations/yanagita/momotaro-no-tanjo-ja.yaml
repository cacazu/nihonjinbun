  original: が滑稽に對するほど寬大で無く、おまけに普通の奇事珍聞は、其後も有り餘るほど發生して、笑に飢ゑたる人々の如く、がつ〳〵と喰ひ付くにも及ばなかつた爲と思はれるが、尙一方には狹い土地限りで、住民が大切に之を信じ傳へ、それを或時代の座頭の作り話であつたと聞くと、失望するかも知れない人が多い。卽ち此方面の文藝は後の複製を許さなかつた代りに、原版として古い文化の痕を保存しようとして居たのである。佐久間洞巖の奥羽觀迹聞老志卷四に、牡鹿郡柳目村に在る一つの塚が、一時非常に繁昌して持主大利を得、後にそれが妖僧の虛構に出でたことが露顯したといふ事實を錄して居るが、しかも其塚といふのは、もと盲人と狐とを共に埋めたといふ傳說をもつて居る塚であつた。昔この村の路傍に惡い狐が住んで居て、通行人の誑かされるものが多かつた。或時一人の座頭の坊がこの田圃路を通つて居ると、例の如く狐が出て來て惡戯をした。ボサマ大いに憤つて其尻尾を捉へて放さず、夜どほし格鬪して翌朝は盲も狐も、共に戰ひ疲れて田の中に死んで居た。それを埋葬したのが此塚だといふ樣に傳へられて居たが、是も亦記憶以上の史實であつた。狐が座頭に惡戯をしたこと、座頭がそれを憤つて反撃したことなどは、傍に居て實見し又は報告を聽いた者などは一人だつて無い筈である。其上に盲が狐の尾を牢く捉へて、共に斃れて居るのを見たであらう人とても、別に記錄を作つて之を傳へたわけでも無いのである。後年それがまさしき出來事として認められるに至つたのは、卽ち又亡靈の言を信じたからであつた。問題は誰が其樣な奇抜な託宣に參與したかといふことに歸着するが、意識的にもせよ又無意識にもせよ、是だけの豫備智識を具へて、そんな口寄せの言を爲し得た者は、座頭以外にはさう有りさうにも思はれぬのである。今日我々が略、忘れかゝつて居る笑の一種に、極めて原始的なる勝者の誇の笑ひといふものがあつた。自身直接に其事業には參與せずとも、惡者が討伐せられ妖魔が退治せられて、もうかなはぬ許せ〳〵といふ光景を見ては、子供で無い者も思はず笑つた。さういふ心地よさには一般的の需要があつた。我々の父老は是を訓育と勇氣の養成にさへ利用して居た。さうして盲人の笑話にば、いつも此需要を目ざしたものが多かつたのである。其中で一番有名なのは、狐が片目の爺に化けて來て、眼の右左を取違へで居た話。本尊の阿彌陀樣がいつの間にか二體になつて居たのを、賢こい小僧にすかされてにた〳〵と笑つたので忽ち狐の化け
  translation: '〔前のスキャンから続く〕滑稽に対するほど寛大ではなく、そのうえ普通の奇事や珍聞は、その後もあり余るほど起こったので、笑いに飢えた人のように、がつがつ飛びつく必要もなかったためだと思われる。しかし一方では、狭い土地の範囲だけで、住民が大事に信じ伝えており、これがある時代の座頭の作り話だったと聞けば、失望するかもしれない人が多い。つまり、この方面の文芸は、後の複製を許さなかった代わりに、原版として古い文化の跡を保存しようとしていたのである。佐久間洞巌の『奥羽観蹟聞老志』巻四は、牡鹿郡柳目村にある一つの塚が、一時ひどくはやって所有者が大きな利益を得たが、のちに怪しげな僧の作り事だったと露呈した事実を記している。しかも、その塚は、もともと目の見えない人と狐を一緒に葬ったという伝説を持つ塚だった。昔、この村の道端に悪い狐が住み、通行人の多くが化かされた。あるとき一人の座頭の坊がこの田んぼ道を通ると、いつものように狐が現れていたずらをした。ボサマはひどく怒り、尻尾をつかんで離さず、一晩中格闘して、翌朝には目の見えない人も狐も、ともに戦い疲れて田の中に死んでいた。それを葬ったのがこの塚だと伝えられていたが、これも記憶の及ばない時代の「史実」だった。狐が座頭にいたずらをしたこと、座頭が怒って反撃したことなどは、そばにいて実見したり、報告を聞いたりした者は、一人もいないはずである。そのうえ、目の見えない人が狐の尾を固くつかみ、ともに倒れているのを見たかもしれない者も、別に記録を作って伝えたわけではない。後年、それが確かな出来事と認められるようになったのは、これも亡霊の言葉を信じたからだった。問題は、誰がそのような奇抜な託宣に関わったのかという点に帰着する。意識していたにせよ、無意識だったにせよ、これだけの予備知識を備えて、こうした口寄せの言葉を言えた者は、座頭のほかにそうそういたとは思えない。

    今日、私たちがほぼ忘れかけている笑いの一種に、きわめて原始的な、勝者の誇りの笑いがあった。自分が直接その仕事に関わっていなくても、悪者が討ち取られ、妖魔が退治されて、「もうかないません、許してください、許してください」という光景を見れば、子どもでない者も思わず笑った。そういう心地よさには、広く需要があった。私たちの父祖は、それをしつけや勇気を養うことにさえ利用した。そして目の見えない人の笑い話には、いつもこの需要を狙うものが多かった。なかでも最も有名なのは、狐が片目の老人に化けて来て、目の左右を取り違えていた話である。また、本尊の阿弥陀様がいつのまにか二体になっていたが、賢い小僧にうまく乗せられてにたにた笑ったため、たちまち狐の化けたことが、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン277）と本文OCRを照合。
  - 「許せ許せ」「さうして」などのOCR脱誤を画像で確認して復元。塚の由来は著者が史実性を批判的に検討する伝説。
  - 原文の歴史的差別語は文脈を保持し、通常は「目の見えない人」等と訳した。障害者の性質を一括りにする評価は著者の当時の見解であり、現代の事実認定ではない。

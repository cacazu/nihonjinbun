  section: 隣の寝太郎／五 物草太郎の草子
  original: 今ある草子の「物草太郞」が、いつの頃何れの地に於て結集せられたかは、單に傳本の系統を究めたばかりでは、之を推定することが六つかしいやうに思ふ。諏訪繪詞の奥書にも旣に例がある如く、田舍の口碑を文章に書き表はし、殊に美しい手跡と彩畫とを賞翫しようといふには、之を京都に持つて出て藝術の士に依賴する場合が、多かつたらうことは勿論であるが、果して其際に新たに編述する必要があつたか否かは、全く口碑そのものの種類性質に由ることであつた。社寺の緣起や靈驗記のやうな、傳說の部類に屬すべきものならば、人は單にその實質だけを持傳へて居るのだから、順序なり話し方なりは時によつて一定せず、從つてそれを筆にする者の技能は隨處に發揮し得たであらうが、是が民謠であり若くは何曾である場合には、文字はたゞ忠實に旣存の口語を寫し出せば則ち足るのであつた。さうして昔話は、ちやうどこの二つのものの中程に位して居た。次々の話し手が自分の才智、若くは誤解や記憶ちがひを以て、改めて行く部分は無論あつたが、其前後の形式と大體の結構とには、踏襲しなければならぬものが多かつた。今日の如く人が「其話なら知つとる」と言つて、二度は聽かうとしない世の中になつても、尙少しく新し味を出し過ぎると、もう昔話では無くなつてしまふのである。殊に話術の洗煉を旨とする講釋師話し家に至つては、型にはまるを以て上達と心得る者さへ多く、凡庸なる多數は枕から入れこと迄、一切合切師匠の口寫しを守り、聽衆は單に聲と調子との、善惡を品等して居るだけである。卽ち外形は稍々自由になつた樣に見えても、之を暗記し又傳承しようとする者の態度に至つては、聊かも淨瑠璃其他の以前の語り物に對すると、異なる所は無かつたのである。場數と練習とを以て叩き上げた者には、一般にこの機械的傾向はあるが、殊に記憶力を生命とし傳授のやかましかつた盲人たちの間には、說話が變轉し進化する原因が乏しかつたやうに考へられる。だから現存の「物草太郞」が純乎たる書き卸しであるか、はた又是が一卷の書に筆錄せられる以前、既に略々この形に固まつて居たかは、結局は昔話を以て職業とする者が、其流傳に參與して居たか否かによつて決すべきで、私は今のところでは、多分參與して居たらうと思つて居る。但し斷つて置かねばならぬことは、中世信州の盲人たちが、說話によつて活計を立てて居たといふ、直接の證據が見付かつたわけでは無い。今ではまだ推測の範圍を出ないのであるが、筑紫琴とか三味線とかの民間樂器も普及せず、平家物語が東北の田舎に歡迎せられるま
  translation: '現在ある草子の『物草太郎』が、いつ、どこでまとめられたかは、伝わっている写本などの系統を調べただけでは、推定するのが難しいように思う。『諏訪絵詞』の奥書にもすでに例があるように、田舎の言い伝えを文章にし、とくに美しい筆跡と彩色画とを楽しもうとする場合、それを京都に持って出て芸術家に頼むことが多かっただろう、というのはもちろんである。しかし、その際に新しく文章を組み立てる必要があったかどうかは、まったくその口碑の種類と性質によった。社寺の縁起や霊験記のように、伝説の部類に入るものなら、人はただその内容を伝えているのだから、順序や語り方は一定せず、文章にする人の技量も随所で発揮できただろう。けれども、民謡や謎の場合には、文字はただ、すでにある口伝えの言葉を忠実に写せばそれで足りた。そして昔話は、ちょうどこの二つの中間に位置していた。代々の語り手が、自分の才知、あるいは誤解や記憶違いによって変えていく部分は、もちろんあった。しかし、その前後の形式と大体の構成には、受け継がなければならないものが多かった。今日のように、人が「その話なら知っている」といって二度は聞こうとしない世の中になっても、少し新しさを出しすぎれば、もう昔話ではなくなってしまう。

    とくに語りの技術を磨くことを第一にする講釈師や噺家には、型にはまることが上達だと心得る者さえ多い。平凡な大多数は、枕から挿入句まで、すべて師匠の語りをそのまままね、聴衆はただ、声と調子のよしあしを品定めしているだけである。つまり、外見は少し自由になったようでも、それを暗記し、伝承しようとする人の態度は、浄瑠璃など、以前の語り物に対するものとまったく変わらなかった。場数と練習を重ねて鍛えられた人には、一般にこうした機械的な傾向がある。しかしとくに、記憶力を命とし、伝授の規律が厳しかった盲人たちのあいだには、説話が変化し進化する要因が乏しかったように考えられる。だから、今ある『物草太郎』がまったくの書き下ろしなのか、それとも一巻の本に書きとめられる前から、すでにほぼこの形に固まっていたのかは、結局、昔話を職業にする者がその伝承に関わっていたかどうかによって決めるべきだろう。私は今のところ、おそらく関わっていたと思っている。

    ただし、断っておかなければならないのは、中世の信州の盲人たちが、説話を語って生計を立てていたという直接の証拠が見つかったわけではない、ということである。今はまだ推測の域を出ない。しかし筑紫琴や三味線といった民間の楽器も普及せず、『平家物語』が東北の田舎で歓迎されるほどには、……'

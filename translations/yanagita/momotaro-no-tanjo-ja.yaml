  original: 例としては、山路の牛飼と稱する古い歌物語があつて、舞の本の烏帽子折にも記錄せられて居る。是は舞の手振が非常に面白かつたと見えて、幾度か後世の淨瑠璃の題材ともなつて居るが、要點は古今大よそ同じであつた。牛に乘つて笛を吹く草苅童は實は天子で、長者の娘を戀ひ慕うて、身を下賤にやつして遙々と都より御下りなされた。八幡の祭の日の流鏑馬に何人も知らなかつた射術の神祕を御示しなされたら、社殿も是が爲に動搖して、乃ち神よりも尊い御方なることが現はれたと語つて居る。それを用明天皇職人鑑などと題したのは、姫を娶つて其間に生れたまふ太子を、日本の太子の中の最も賢明靈異なる、聖德太子の御事だと推定した結果であつたが、それは歷史とは合はぬことであるが故に、歷史の學問が少しでも進むと、之を改訂して出來るだけ信じ易くした。だから奧州の苅田宮には日本武尊、越前羽後では繼體天皇、薩摩や土佐では天智天皇の御逸話と解して、しかも傳說として今も尙之を信じたがつて居る。神が形を錦の小蛇と現じたまひしか否かによつて、末々の口碑は是だけの大きな差異を生じたが、說話の蛇聟入も傳說の用明天皇も、神が思ひ掛けぬ姿を以て人間に降臨なされたといふ本の意は一つであつた。勿論是はすべて最初は非常に崇嚴なる神祕であつて、凡人の決して常の日に口にすべからざる教訓であつたらうが、歌と舞姿とによつて年に一度、其記憶を喚び返す日の面白さに引かれて、後に信仰が弛めば人は之を娛樂の用に供した。是が藝術の分立して、獨自の發達を遂げた因緣であつたらうと私は信じて居る。酒や美女の紅粉が常の日のわざとなつた如く、祭の日の語りごとは我々遊宴の興を助け、舞は演劇となり、說話は童子の夜睡る前の慰みとまで零落し且つ變化し了つたのである。或は零落といふのは餘りに尙古趣味に囚はれて居るのかも知れぬが、少なくとも今は此程度にまで利用の途がかはり、又異なる人々の怡悅の具となつたので、ちやうど太古の偉大なる杉菜つくしんぼうが、今日の石炭になつたのと事がよく似て居る。是は石炭の物理を研究する人には、或は何でも無い事實なのかも知れぬ。併し私の樣に杉菜の植物學、もしくはつくしんぼうの自然史を知らうといふ者に取つては、微々たる一片の桃太郞昔話も、尙萬斛の感慨を催さざるを得ぬのである。(昭和五年一月、桃太郞の話をきく會講演)
  translation: '……例には、「山路の牛飼」という古い歌物語があり、舞の本の『烏帽子折』にも記録されている。舞の身振りが非常に面白かったらしく、何度か後世の浄瑠璃の題材にもなっているが、要点は昔も今もおおよそ同じだった。牛に乗って笛を吹く草刈りの童は、実は天子であり、長者の娘に恋い焦がれて、身分の低い者に姿を変え、はるばる都から下って来た。八幡の祭りの日の流鏑馬で、誰も知らなかった神秘的な弓の技を示すと、それによって社殿まで揺れ動き、神よりも尊い方だと明らかになった、と語っている。これを『用明天皇職人鑑』などと題したのは、姫を妻に迎えてその間に生まれた太子を、日本の太子の中でも最も賢く霊妙な聖徳太子だと推定した結果だった。しかし、それは歴史と合わないため、歴史の学問が少しでも進むと、この話を改訂して、できるだけ信じやすくした。だから奥州の苅田宮では日本武尊、越前や羽後では継体天皇、薩摩や土佐では天智天皇の逸話と理解し、しかも伝説として今なお信じたがっている。神が錦の小蛇の姿で現れたかどうかによって、後の口伝えはこれほど大きく違ってきた。しかし、説話の「蛇婿入り」も、伝説の用明天皇も、神が思いもよらない姿で人間の世界に降りて来たという、元の意味は同じだった。もちろん、これはどれも、初めはたいへん厳粛な神秘であり、普通の人が日常には決して口にしてはならない教えだったのだろう。しかし、歌と舞によって、年に一度その記憶を呼び戻す日の楽しさに引かれ、のちに信仰が緩むと、人々はそれを娯楽に用いた。これが、芸術が独立して独自の発達を遂げた由来だったのだろうと、私は信じている。酒や美女の化粧が普段のことになったように、祭りの日の語り事は、私たちの宴会を盛り上げ、舞は演劇になり、説話は子どもが夜眠る前の楽しみにまで零落し、変化してしまったのである。あるいは「零落」というのは、あまりに古いものを尊ぶ趣味にとらわれた言い方かもしれない。だが少なくとも今は、それほどまでに用途が変わり、別の人々を喜ばせる道具になった。それはちょうど、太古の巨大なスギナやツクシが、今日の石炭になったのと、よく似ている。石炭の物理を研究する人には、これは何でもない事実かもしれない。しかし、私のようにスギナの植物学やツクシの自然史を知ろうとする者には、ごく小さな一片の桃太郎の昔話でも、なお限りない感慨を催さずにはいられないのである。

    （昭和五年〔1930年〕一月、「桃太郎の話をきく会」での講演）'

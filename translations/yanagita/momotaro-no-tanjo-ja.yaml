- id: mmt-062-01
  scan: 62
  section: 海神少童／嘉手志川
  original: '通りに、小豆を五合づつ食べさせて戶棚の中に入れて置くと、每晩ちりん〳〵とお金を

    幾らでもひる。それを隣の爺婆は聞き知つて、無理に借りて行つて小豆を一升食はせ、

    戶棚に入れて置いて翌朝あけて見ると、金は少しもひらずにそこら中糞だらけにして居

    た。二人は大に怒つて其龜を殺してしまふ。貧乏な爺婆は大變にそれを悲しんで、龜の

    子を持つて歸つて庭さきに埋めたところが、そこに一本の蜜柑の木が生えて澤山の實が

    なり、それを剝いて見ると、中にはお金が一ぱい詰まつて居る。喜んで其蜜柑の實を皆

    剝いて、とう〴〵えらい大金持になつた(昔話號八一頁)。

    此話は壹岐全島に知られて居るらしく、村によつて早少しづつの變化がある。たとへば渡

    良では婆樣と息子があつて、其息子は大變な惰け者であつたといひ、立石村では是を貧しい

    兄と富める弟の話とし、年の暮に兄が金を借りに行つたのに、弟が惜んで貸さなかつたとい

    ふ點は、遠くは新羅の旁㐌の話、又は奥州に數多い黄金小臼の話と一つである。それから年

    木の方も此二村では、賣りに出たが賣れなかつたことになつて居り、海に捨てたところがそ

    れがちやうど、龍宮で入用な品であつた故に、恩賞があつたやうにも話されて居る。立石の

    方では金をひつたのは龜でなく、此點も肥前の島原と同樣に猫であつた。乙姫の使が途々二

    人の者に教へるには、龍宮では何でも望みの物を土產に遺らうと仰せあるから、其時は「みか

    んこうの猫」が欲しいと言へとあつた。其猫が小豆飯を食つて金をひり、それを弟に借りら

    れて殺されて、埋めると蜜柑の木が生え、其根もとから又黃金が掘出されたことになつて居

    るといふことである。

    をかしいことには兄が貧乏の正直、弟が慾深だつたといふ點のみが、肥前とは逆になつて

    居る。沖縄のクガニーの實の由來などは、伊波氏の昔話集や牛島氏の採錄(民俗學二卷二號)に

    も見えて居るが、共に親孝行で小犬を授かつたのは弟の方であり、相異はたゞ前者には粟の

    飯一合とあるのと、後者で犬の墓に一本の木を栽ゑ、それが橙で無く蜜柑であつたといふ個

    條だけである。犬が墓場の奥から、又は片脇から飛出したといふことは、この全國的な說話

    の最も目に立つ變化ではあるが、是も始から此形であつたとは見えない。岩崎卓爾翁の採集

    せられた石垣島の昔話などは(旅と傳說四卷二號)、却つて本島を飛越して九州以北のものと近

    く又或程度までは他の簡略なる「乙姫樣」を補充して居る。是もかい摘んで話の筋だけを轉'
  translation: 'とおり、小豆を五合ずつ食べさせて戸棚へ入れておくと、毎晩ちりんちりんと、いくらでもお金をひり出す。それを隣のおじいさんとおばあさんが聞きつけ、無理に借りていって、小豆を一升食べさせた。戸棚に入れておき、翌朝開けてみると、金は少しも出さず、そこら中を糞だらけにしていた。二人は大変怒り、その亀を殺してしまう。貧乏なおじいさんとおばあさんは、それをとても悲しみ、亀の子を持って帰って庭先に埋めた。すると、そこに一本のミカンの木が生え、たくさんの実がなり、皮をむいてみると、中にはお金がいっぱい詰まっている。喜んでそのミカンの実を全部むき、とうとうたいそうな大金持ちになった（『昔話号』八一頁）。

    この話は壱岐の島全体で知られているらしく、村ごとに、すでに少しずつ違いがある。たとえば渡良では、おばあさんと息子がいて、その息子がひどい怠け者だったという。立石村では、貧しい兄と金持ちの弟の話になっている。年の暮れに兄が金を借りに行ったのに、弟が惜しんで貸さなかったという点は、遠くは新羅の旁㐌の話や、奥州に多い黄金の小臼の話と同じである。それから、年木についても、この二つの村では、売りに出たが売れなかったことになっている。海へ捨てたところ、それがちょうど竜宮で必要な品だったので、褒美があった、とも語られている。

    立石のほうでは、金をひり出したのは亀ではなく、この点も肥前の島原と同じく、猫だった。乙姫の使いが道々、二人に教えるには、竜宮では何でも望むものを土産にやろうとおっしゃるから、そのときには「みかんこうの猫」が欲しいと言いなさい、とのことだった。その猫が小豆飯を食べて金をひり出す。それを弟に借りられ、殺されて、埋めるとミカンの木が生え、その根元からさらに黄金が掘り出されたことになっているという。

    おかしなことに、兄が貧しい正直者で、弟が欲深かったという点だけは、肥前の話と逆になっている。沖縄のクガニーの実の由来などは、伊波氏の昔話集や牛島氏の採録（『民俗学』二巻二号）にも見えるが、どちらも、親孝行で小犬を授かったのは弟のほうである。違うのは、前者では粟の飯一合とされていること、後者では犬の墓に一本の木を植え、それが橙ではなくミカンだったという点だけである。犬が墓の奥や脇から飛び出したというのは、この全国的な物語の中でも最も目立つ変化だが、これも初めからその形だったとは思えない。岩崎卓爾翁の採集した石垣島の昔話などは（『旅と伝説』四巻二号）、かえって沖縄本島を飛び越え、九州以北のものに近い。また、ある程度まで、ほかの簡略な「乙姫様」の話を補っている。これも要点を拾い、筋だけを転'
  notes:
  - 画像をまたぐ文は前後のunitと接続する。
  - 「年木」は年末年始に用意する木を指す。
  - 新羅の人物名は画像を拡大して「旁㐌」と校訂。「みかんこうの猫」は原伝承の呼び名を保持。

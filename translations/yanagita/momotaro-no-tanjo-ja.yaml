  section: 絵姿女房／八 白介の翁
  original: '「羽衣」にも「龍宮女房」にも、別に尙一つの絕緣譚があることは、知つて居る人が多いであ

    らう。此話は其形が是へ紛れ込んで居るのである。しかも二千艘の白黑の胡麻の船が、眞野

    長者の一萬石の芥子の種と、同じだといふことだけは爭ふわけには行かぬ。私は前年「遊牧

    記」といふ雜誌に、果無し話のことを書いて、閑の多く話に熱心な昔の人たちが、際限も無

    く斯ういふたわいも無い題目を、くり返して居た時代を想像して見た。殿樣の難題なども二

    つ三つには限らず、色々な小さな判じ物を次々に竝べて行つて、最終に眞面目な奇瑞を叙述

    したので、雷とか大蛇とかは一篇の眼目になつて居たことと思ふ。舞の本の山路の語りで

    も、一萬石の芥子の貢ぎが滯り無く濟んで、流石は長者と感歎せられたことになつて居る

    が、更に其上にもう一つの無理な命令が下される。「蜀紅の錦を以て、兩界の曼陀羅を二十

    尋に七流れ」、織りて參らせることが叶はずとならば、姫を內裏に參らせよと、重ねての勅

    使が立つ。「曼陀羅は佛たちの淨土にて、蓮の絲をもて織らせたまふものと承る。人間の身

    として何としてかは求むべき」。この上は姫を參らするの他は無いと、夜と共に管絃の宴に

    名殘を惜み、曉方に暫しまどろみたる夢に、「內山の聖觀音は枕上に立たせたまひ、いかに

    長者、汝が娘は自らが申し子也。惜むところの不びんさに、もろもろの佛たちを集め申し、

    長者が中の出居にて、錦を織るぞ聽問せよ」とあつて、テイ·ホロロの音も清く、程無く二十

    尋七流れの曼陀羅が織上げられてあつた。それで第二の難題も亦、きゝ目が無いことになつ

    たと語つて居るのである。

    山路太子の笛の旅は、斯ういふ絕望を經驗してから後に、改めて計畫せられたことになつ

    て居るが、是は確かに二つの話の繫ぎ目であると思ふ。無理難題の失敗といふことは、一つ

    の物語の終局にふさはしい形であつた。だから私の擧げた多くの例は、何れも此最後の奇瑞

    を說く爲に、準備せられた叙述といつてもよかつたのである。信州は流石物草太郞の本國で

    あつたと言はれるだけに、更に此類例の今一段と濃厚なるものが、更級郡新長谷寺の緣起と

    して傳はつて居るのである。三國傳記が最初の記錄かと思ふが、手元に其本を持たぬので、

    假に東方佛敎叢書第二輯八卷を引用すると、

    昔信濃の山中に白介翁といふ貧しい行者があつた。善光寺の御本尊の利益を受けて一願

    を果した後、更に彌陀如來の靈告によつて、生身の十一面觀世音を御迎へに、姥捨山下'
  translation: '「羽衣」にも「竜宮女房」にも、別にもう一つ、夫婦が別れる話があることは、多くの人が知っているだろう。この話には、その形が紛れ込んでいるのである。それでも、二千艘の白胡麻と黒胡麻の船が、真野長者の一万石の芥子の種と同じものだということだけは、否定できない。

    私は以前、『遊牧記』という雑誌に、果てしなく続く話について書き、暇が多く、物語に熱心だった昔の人々が、こういうたわいない題材を際限なく繰り返していた時代を想像してみた。殿様の難題も、二つ三つに限らず、いろいろな小さななぞ解きを次々に並べ、最後に真面目な奇跡を語ったのであって、雷や大蛇が一編の中心になっていたのだと思う。

    舞の本の山路の語りでも、一万石の芥子の貢ぎが滞りなく済み、さすが長者だと感心されたことになっているが、そのうえに、さらにもう一つ無理な命令が下る。「蜀紅の錦で、両界の曼荼羅を、長さ二十尋のもの七本」、織って献上することができないなら、姫を内裏へ参らせよと、重ねて勅使が立つ。

    「曼荼羅は仏たちの浄土で、蓮の糸を使って織られるものと伺っている。人間の身で、どうして手に入れられるだろう」。もう姫を差し上げるほかはないと、一晩じゅう管弦の宴を催して別れを惜しんだ。明け方に少しまどろんだ夢の中で、内山の聖観音が枕元に立ち、「長者よ、お前の娘は、私に願って授かった子である。別れを惜しむのがふびんなので、さまざまな仏たちをお集めし、長者の家の中の広間で錦を織っている。その音を聞くがよい」と告げた。そして、テイ・ホロロという澄んだ音も響き、ほどなく、二十尋の曼荼羅七本が織り上がっていた。こうして第二の難題もまた、効き目がなかったと語られているのである。

    山路太子が笛を手に旅することは、このような絶望を味わってから、改めて計画したことになっている。しかし、これは確かに二つの話のつなぎ目だと思う。無理難題が失敗することは、一つの物語の結末にふさわしい形である。だから、私が挙げた多くの例は、どれもこの最後の奇跡を語るために準備された叙述だといってもよかったのである。

    信州は、さすがに物草太郎の本国だといわれるだけあって、さらに、この型がもう一段濃く現れた例が、更級郡の新長谷寺の縁起として伝わっている。『三国伝記』が最初の記録かと思うが、手元にその本がないので、ひとまず『東方仏教叢書』第二輯八巻から引用すると、次のようになる。

    昔、信濃の山中に、白介翁という貧しい修行者がいた。善光寺の本尊のご利益によって一つの願いを果たした後、さらに阿弥陀如来のお告げにより、生身の十一面観世音を迎えに、姥捨山のふもと'
  notes:
  - 末尾はscan190に続く。
  - OCRで欠字となった箇所を原画像で「テイ・ホロロの音も清く」と復元し、訳に反映した。
  - 「蜀紅」は錦の名、「両界」は仏教の金剛界と胎蔵界。「尋」は長さの単位。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。
  sequence: 194
- id: mmt-190-01
  scan: 190
  section: 絵姿女房／八 白介の翁
  original: 'を發して大和の長谷に行き、三年の山籠りをした。明日下山の途に就て最初に逢ふ女を

    妻とせよとある。示現空しからずして美しい女房を得、伴なひ歸つて仲睦じく暮らして

    居た。王城の大殿といふ人がその女房を欲しがつて、白介翁を招いて遊宴を催し、わざ

    と小弓の勝負を挑んで翁が勝てば千兩の黃金を與へ、負けたら美しい妻を見る約束をし

    た。翁頻りに觀世音に祈請すれば、小弓は勝ちになつて千金は容易く手に入つた。次に

    大殿は相撲の勝負を挑んで、自分方が負けたらば翁に領家代の職を與へよう。勝てば女

    房を取るといふ約束をする。それが氣になるので女房に話をすると、少しも驚く氣色無く

    召使ふ童子を大和に遣つて、相撲人を求めさせた。程無く童子は年六十ばかりの、

    痩せた男を一人連れて歸つて來た(といふ所にをかしい趣向がある)。それが安々と相手

    の力士を負かしたので、不思議に思つて還つて行つた跡を付けさせると、近江の大山寺

    の仁王樣であつた。白介翁は約束の通り領家代になつて家富榮え、五萬長者といふ名を

    後の世に殘した。

    さて女房は大和の泊瀨山の瀧藏權現の化身であつた。形見に留めて置いた金色の片手が、

    新長谷寺の本尊十一面觀音の御手に用ゐられた。それ故に左の片手ばかりは、永く女の手の

    やうに溫かく又柔かであつたといふ奇瑞譚が添うて居る。是が法師か歌比丘尼か、兎に角に

    善光寺附屬の者の口から出た話であることは、想像してもよい理由がある。この白介翁も亦

    物草太郞と同樣に、由ある都の人の信濃に流されたものの子であつて、幼少にして親を失ひ、

    貧しい土民の生活をして居た。父母の菩提の爲に千日の湯をわかし、每日一本の卒都婆を立

    てて供養しようと思つたが、導師も無ければ布施物も無いので、善光寺に詣でて七日七夜の

    祈願を籠めると、滿願の朝に一人の貴き僧あつて、彼の爲に導師とならうと言つた。悅んで

    請じ來つて千日の湯に入れると、異香薫じみちて浴室の隙を洩れるので、怪しんで窺ひ見れ

    ば金色の阿彌陀如來、端然としておはしましたといふ、又一つの物語も傳はつて居て、それ

    で前の文には、「一願を果した後」とあるのである。渡邊敏翁の佐々禮石には、山口の白介翁

    とあるが、何に據られたかを知らぬ。或はかの寺第二期の大檀越と稱する丈部家の由緒を語

    り傳ふること、恰も豐後の內山觀世音に於て、寺の開基の草苅氏を說いたのと同じでは無か

    つたかと思ふ。'
  translation: 'を出発して大和の長谷へ行き、三年間、山に籠もった。すると、「明日、山を下りる道で最初に会う女を妻にせよ」とのお告げがあった。お告げはそのとおりになり、美しい妻を得て、連れ帰って仲むつまじく暮らしていた。

    王城の大殿という人がその妻を欲しがり、白介翁を招いて宴を開いた。そして、わざと小弓の勝負を挑み、翁が勝てば千両の黄金を与え、負ければ美しい妻を見るという約束をした。翁がひたすら観世音に祈ると、小弓には勝ち、千両はたやすく手に入った。

    次に大殿は相撲の勝負を挑み、自分の側が負ければ翁に領家代の職を与え、勝てば妻をもらう、という約束をする。気にかかるので妻に話すと、少しも驚く様子がなく、召し使っている童子を大和へ送り、相撲を取る者を探させた。ほどなく童子は、六十歳ほどの痩せた男を一人連れて帰ってきた（というところに、面白い工夫がある）。その男がやすやすと相手の力士を負かしたので、不思議に思い、帰っていく後をつけさせると、近江の大山寺の仁王様だった。白介翁は約束どおり領家代となり、家は豊かに栄え、「五万長者」という名を後世に残した。

    さて、妻は大和の泊瀬山の滝蔵権現の化身だった。形見に残した金色の片手が、新長谷寺の本尊である十一面観音の手に用いられた。そのため、左手だけは、長く女性の手のように温かく柔らかかったという、不思議な話が添えられている。

    これが法師か歌比丘尼か、ともかく善光寺に属する人の口から出た話だと考えてもよい理由がある。この白介翁もまた、物草太郎と同じく、由緒ある都の人が信濃へ流された、その子であり、幼いときに親を失って、貧しい土地の民の暮らしをしていた。父母の冥福のために千日間湯を沸かし、毎日一本の卒塔婆を立てて供養しようとしたが、導師もいなければ布施にする物もなかった。

    そこで善光寺へ参詣し、七日七夜、祈りを籠めると、満願の朝、一人の尊い僧が現れ、彼のために導師になろうと言った。喜んで招き、千日間沸かした湯に入ってもらうと、不思議なよい香りが満ちて浴室の隙間から漏れ出た。怪しく思ってのぞくと、金色の阿弥陀如来が、端然とそこにおられたという。このようなもう一つの物語も伝わっているので、先の文章には「一つの願いを果たした後」とあるのである。

    渡辺敏翁の『佐々礼石』には「山口の白介翁」とあるが、何に基づくのかは分からない。あるいは、その寺の第二期の大檀越と呼ばれる丈部家の由来を語り伝えたもので、ちょうど豊後の内山観世音で、寺を開いた草苅氏のことを語ったのと同じだったのではないかと思う。'
  notes:
  - 冒頭はscan189から続く。
  - 「領家代」は領家に代わって荘園の管理などを行う役。「大檀越」は寺を大きく支援する施主。
  - 「氣色無く」を原画像で確認。丈部家の字形と傍らの振り仮名も拡大して確認し、本文と区別した。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。
  sequence: 195
- id: mmt-191-01
  scan: 191
  section: 絵姿女房／八 白介の翁
  original: '是が往古の史實であつたか否かは、今ではもう問題で無い。我々が事實として認めなけれ

    ばならぬのは、外來敎法の應驗を語りあるいた人々が、必ずしも說話の輸入者では無かつた

    ことである。寧ろやゝ不自然に見える程度にまで、古くからあつた型に囚はれ、是をたゞ僅

    かづつ改造して、目前の用に供して居たことである。たとへば「殿樣の難題」は厄難の新らし

    い趣向として、後々流行し始めた外國種であつたとしても、不思議の女房の智慮才覺によつ

    て、結局長者になつたといふ要點ばかりは、何處まで行つても元の通りであつた。大和の

    泊瀨山の瀧藏權現などは、多分龍神であらうからまだそれでも龍宮女房の話と近い。それが

    一方には遙々都から下つた高貴の姫君であり、もしくは近郷に隱れなき長者のまな娘であつ

    たといふ場合でも、或は又大蛇の變形であり、鮭の化身であつたといふやうな場合でも、

    必ず愚直にして且つ貧窮なる若者を、富貴にする力を具へて居たことは同じであつた。

    其中でも自分の注意をして居るのは、最も羽衣の說話に近い鶴女房鵜鳥女房が、希代の錦

    を織つて親又は夫に與へ、決して安い價を以て賣つてはならぬと無慾の男に教へるのを普通

    として居たことである。今日の瓜子姫說話などは、さしも出現の奇瑞を說きながらも、單に

    アマノジヤクとの闘爭のみを以て終始して居るが、是にも曾ては機織の技藝に由つて、大い

    に家を興したといふやうな後日譚があつたのではあるまいか。さうで無かつたならば繪姿や

    栗賣の挿話が斯んなに安々と是に結合して、或舊家の由緒を飾ることにはならなかつたらう

    と思ふ。記錄文學の甚だ振はなかつた足利期は、特に各種の民間藝術の活躍した時代でもあ

    つた。雪の山國の莊內の黑川村に、新たなる能藝が入つて來て根づいたやうに、說話の外形

    が新奇の話術によつて、著しく改造せられたのも此際のことであつたかと思ふ。是には勿論

    職業として携はつた者の、次第に數多くなつたことを想像しなければならぬが、一方には土

    地にも之を招き寄せるだけの需要と、之を利用し且つ舊傳と調和させるだけの、能力は旣に

    發生して居たのである。別の語でいふと彼等の昔話は稍々古臭くならうとして居た。故に是

    に活を入れてもう一度面白いものとする必要があつたのである。もし物々しい名稱が使ひた

    ければ、是を說話の藝術化時代と謂つてもよい。兎に角に昔話だから昔も此通りと思つて、

    直ちに輸入や國際傳播の穿鑿に取掛ることは、是等興味ある一切の地方的變化に、わざと目

    をつぶつて居られるだけの度胸のある學者で無いと、到底企てられない難事業である。'
  translation: 'これが遠い昔の史実だったかどうかは、今ではもう問題ではない。私たちが事実として認めなければならないのは、外国から伝わった仏法の霊験を語り歩いた人々が、必ずしも説話そのものを輸入した人ではなかった、ということである。むしろ、少し不自然に見えるほど、古くからの型にとらわれ、それをわずかずつ作り替えて、当面の目的に使っていたのである。

    例えば「殿様の難題」が、災難の新しい表現として、後になって流行し始めた外国生まれのものだったとしても、不思議な妻の知恵と工夫によって、最後には長者になったという要点だけは、どこまでいっても元のままだった。大和の泊瀬山の滝蔵権現などは、おそらく竜神だろうから、まだ竜宮女房の話に近い。それが一方では、はるばる都から下った高貴な姫君であったり、近郷に名高い長者の愛娘であったりしても、あるいは大蛇が姿を変えたもの、鮭の化身だったという場合でも、必ず、正直一途で貧しい若者を富み栄えさせる力があったことは同じなのである。

    その中でも私が注意しているのは、羽衣の説話に最も近い鶴女房や鵜鳥女房が、世にもまれな錦を織って親や夫に与え、決して安い値で売ってはいけないと、欲のない男に教えるのを普通としていたことである。現在の瓜子姫の説話などは、あれほど不思議な出現を語りながら、単にアマノジャクとの争いだけで終始している。しかし、これにも、かつては機織りの技で家を大いに栄えさせたというような後日談があったのではないだろうか。そうでなければ、姿絵や栗売りの挿話が、これほどたやすく結び付き、ある旧家の由緒を飾ることにはならなかったと思う。

    書き記された文学がきわめて振るわなかった室町時代は、とくに各種の民間芸術が活発だった時代でもある。雪深い山国、庄内の黒川村に新しい能の芸が入り、根を下ろしたように、説話の外形が新奇な語りの技で大きく作り替えられたのも、この時期だったのではないか。そこには、もちろん、それを職業とする者が次第に増えたことを考えなければならない。しかし一方、土地の側にも、それを招き入れるだけの需要と、利用して古い伝承と調和させるだけの能力が、すでに生まれていたのである。

    言い換えれば、彼らの昔話は、いくらか古臭くなろうとしていた。そこで、活気を入れ、もう一度面白いものにする必要があったのだ。もし大げさな呼び名を使いたいなら、これを説話の芸術化時代と呼んでもよい。ともかく、昔話だから昔からこのとおりだったと思い、ただちに輸入や国際的な伝播の詮索に取りかかるのは、こうした興味深い地方ごとの変化すべてに、わざと目をつぶっていられるほど大胆な学者でなければ、とてもできない難事業なのである。'
  notes:
  - OCRの欠字「敎法」「近郷」「教へる」「必ず」を原画像で確認。前稿の「佛法」という原文補読は「敎法」に訂正。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。
  sequence: 196
- id: mmt-192-01
  scan: 192
  section: 絵姿女房／髪長媛
  original: '髮長媛

    舞の本の烏帽子折に於て、六十六本の繪扇といふ上品な物語になつて居る一條が、周防の

    民間傳承では、羽前黑川村の孫三郞の昔話などと稍々近く、單に美人の姿を描いた大凧が飛ん

    で大内山の松の枝に引かゝり、御門の御目に留まつたとなつて居ることは、本文にも旣に述

    べて置いたが、是もどうやら草苅氏の移住に伴なうて、對岸から携へて來たものの樣であ

    る。近頃公刊せられた豐後傳說集八五頁の、炭燒長者に關する口碑の中にも、この內山の人

    たちが、般若姫の似顏を繪にかいた凧を揚げて居るうちに、絲が切れて遠く禁中の御庭に落

    ち、尋ね探して其美女の內山長者の娘なることがわかつたけれども、度々の御使にも父の長

    者は承知せず、それでいよいよ山路の笛の、花やかな御旅は始まつたと傳へて居る。話の

    此形態が紙鳶に繪をかく今日の習慣よりも、早いもので無いことは說くに及ばぬが、さりと

    ては又同じ話の種が前には存せず、又は空に女の繪を扇に描いたといふのから、斯う轉じて

    來たものとも考へにくい。

    同じ傳說集には德川氏の驕兒越前宰相忠直、一伯樣と呼ばれて豐後國に幽居して居た頃、

    一枚の姿繪が落ちて來たのを拾ひ上げて見ると美しい女であつた。それを府內の町に探し求

    めて、召し招へたのがお蘭といふ愛妾であつたといふ話を載せて居る。乃ち凧で無い語り草

    が、亦此地方にも流布して居たのである。奥州南部の蕪燒笹四郞は、豐後の炭燒小五郞から

    變化したかと思はれる昔話であるが、是にも女房が餘り美しいので旅に出ることが出來ず、

    繪姿を携へて行つたら峠の上で風に捲上げられ、それから殿樣に女房を取られたといふのが

    あつた。朋輩に教へられて柿賣りになつて御城に入込み、衣裳を殿樣と交換する迄は他の例

    も同じだが、此方は女房の智慧によつて本物を追出し、自分が殿樣になつてしまつたといふ

    點が違つて居る。更に今一つの類話には、赤鬼丸といふ犬が其城の門を番して居たといひ、

    人が忍び込むと忽ち花の數に現はれる花園があると云つたりして、鬼ケ城冒險の話とよく似

    たのもあつた(以上二、聽耳草紙)。是が又後に說かうとする天人嫁入の說話との、一つの鏈鎻

    である樣に私は考へて居る。'
  translation: '髪長媛

    舞の本の「烏帽子折」では、六十六本の絵扇という上品な物語になっているくだりが、周防の民間伝承では、羽前の黒川村の孫三郎の昔話などに少し近い形になっている。単に美人の姿を描いた大凧が飛んできて、宮中の松の枝に引っ掛かり、帝の目に留まった、というのである。このことはすでに本文でも述べたが、どうやらこれも、草苅氏の移住に伴って、対岸から持ち込まれたものらしい。

    近ごろ刊行された『豊後伝説集』八五頁の、炭焼長者についての言い伝えにも、次のようにある。内山の人々が般若姫の似顔絵を描いた凧を揚げているうちに、糸が切れて、遠く宮中の庭に落ちた。探し尋ね、その美女が内山長者の娘だと分かったが、何度使者を送っても、父の長者は承知しなかった。そこでいよいよ、山路の笛による華やかな旅が始まった、という。

    この話の形が、凧に絵を描く現在の習慣より古くないことは、言うまでもない。しかし、だからといって、同じ話の種が以前には存在せず、あるいは実在の女性ではなく、想像で扇に女の絵を描いたという話から、このように変わったとも考えにくい。

    同じ伝説集には、徳川家の驕慢な御曹司、越前宰相忠直が、「一伯様」と呼ばれて豊後国で隠居生活を送っていたころの話も載っている。一枚の姿絵が落ちてきたのを拾ってみると、美しい女だった。そこで府内の町を探し、召し抱えたのが、お蘭という愛妾だったという。つまり、凧ではない形の話も、この地方に広まっていたのである。

    奥州南部の蕪焼笹四郎は、豊後の炭焼小五郎から変化したと思われる昔話だが、これにも、妻があまりに美しくて旅に出られず、姿絵を持っていくと峠の上で風に巻き上げられ、それがもとで殿様に妻を取られたという話があった。仲間に教えられて柿売りになり、城に入り込んで殿様と衣装を取り替えるところまでは、ほかの例と同じである。ただ、こちらは妻の知恵によって本物を追い出し、自分が殿様になってしまう点が違っている。

    さらに、もう一つの似た話では、赤鬼丸という犬が城の門を守っていたといい、人が忍び込むと、そのことがすぐ花の数に現れる花園があったといったりして、鬼ヶ城の冒険の話とよく似たものもあった（以上の二話は『聴耳草紙』）。私は、これもまた、後に述べる天人嫁入りの説話との間をつなぐ一つの鎖だと考えている。'
  notes:
  - 「一伯様」「お蘭」「蕪焼笹四郎」「赤鬼丸」を原画像で確認。
  - 「空に女の繪を扇に描いた」は、想像によって描いたこととして訳した。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。
  sequence: 197
- id: mmt-193-01
  scan: 193
  section: 絵姿女房／髪長媛
  original: '所謂繪姿女房の話は、又越後の南蒲原郡でも採集せられた(加無波良夜譚第二話)。單に栗賣

    桃賣が五月節供の朝の花賣と變つて居るのみで、他の部分はくり返す必要が無いほどよく一

    致して居る。姿繪が風に飛んだといふだけの話ならば、其分布は又ずつと弘いのであるが、

    是と殿樣百姓の衣裳交換とを併せ說くものだけでも、私は旣に奥羽から九州にかけて、五つ

    までの例を列擧することが出來たのである。しかし其爲に是が中古の舶來だらうといふ私の

    想像は衰へない。たゞ舶來ならば一度は文字を經、讀書人の手に掛つたであらうに、どうし

    てそれが再び口承の文藝となつて、田舍の隅ばかりに潜んで居たかを、知りたい念慮の强く

    なるだけである。將來の問題は寧ろ數限りも無く輸入せられた外國の說話の中で、何故にそ

    の二三のもののみが斯樣に根强く、又遠くまで行渡つて殘り傳はり、他の大部分が消えて跡

    形も無くなつたかであつて、それには他の多くの技藝も同樣に、國民の選擇があり、もしく

    はちやうど其話を容れてもよい空隙があつて、民族の需要はおのづから之を歡迎したのであ

    ることを、やがて證據によつて答へ得る時が來ると思つて居る。

    勿論支那から持つて來たといふにしても、疑へばまだ疑はれる。はつきりとした書證は或

    はいつ迄も得られぬかも知れない。たゞ直覺は何の値も無いやうなものだが、自分には是を

    常人自然の所產とは考へられず、言はば書册の氣臭を此中から感ずるのである。以前非常な

    勞苦を以て蒐集せられ、今尙寫本のまゝで打棄ててある奈良縣風俗志料の中に、吉野郡賀名

    生村の口碑として、大略次のやうな一條が載せられて居るといふ。

    むかし唐にケイオウとヨウキヒといふ夫婦の者が住んで居た。男は女房と離れるのを厭

    うて、畠に出て仕事もせぬので、女房は自分の姿を繪にかゝせ、畠の脇に立てさせるこ

    とにしたが、或日風が吹いてその繪が空に舞ひ揚がり、城の御殿の庭に落ちた。國王は

    之を見て、この繪の美人を探し求めさせ、ヨウキヒは終に宮中に上ることになつた。さ

    うしていつ迄も歸されなかつた爲に、ケイオウもヨウキヒも共に焦がれ死にをしてしま

    つた。それから幾年か經つて、宮中の女が正月の祝の七草を摘みに畑へ行くと、玉のや

    うに美しい一疋の蟲が居た。それを取つて歸つて針箱の引出しに入れて置くと、其蟲は

    ばりばりと針の折れを食うて大きくなり、後には釘を食ひ金棒を食ひ、しまひに牛ほど

    の大きさになつた。國王は食ひ物に困るだらうと思うて、箭で射、刀で斬つて其蟲を殺'
  translation: 'いわゆる絵姿女房の話は、越後の南蒲原郡でも採集された（『加無波良夜譚』第二話）。ただ、栗売りや桃売りが、五月の節句の朝の花売りに変わっているだけで、ほかは繰り返す必要がないほど、よく一致している。

    姿絵が風で飛んだというだけの話なら、分布はさらにずっと広い。しかし、それと殿様・百姓の衣装交換とを一緒に語るものだけでも、私はすでに、奥羽から九州まで五つの例を挙げることができた。それでも、これは中古の時代に外国から来たのだろうという私の考えは弱まらない。ただ、外国から来たものなら、一度は文字を通し、読書人の手を経たはずなのに、どうして再び口伝えの文学となり、田舎の片隅にばかり潜んでいたのか、それを知りたいという思いが強くなるだけである。

    むしろ今後の問題は、数限りなく輸入された外国の説話のうち、なぜ二つ三つだけがこれほど根強く、遠くまで行き渡って伝わり残り、大部分は消えて跡形もなくなったのか、という点にある。それには、ほかの多くの技芸と同様、国民による選択があった。あるいは、ちょうどその話を受け入れられる空きがあり、民族の側の需要が自然にそれを歓迎したのだということを、やがて証拠に基づいて答えられるときが来ると思っている。

    もちろん、中国から持ってきたという説にしても、疑おうと思えば、まだ疑う余地がある。はっきりした文献上の証拠は、いつまでも得られないかもしれない。ただの直感には何の値打ちもないようなものだが、私にはこれを、普通の人々が自然に生み出したものとは考えられず、いわば書物の気配を、この中に感じるのである。

    以前、たいへんな苦労をして収集され、今も写本のまま放置されている『奈良県風俗志料』の中に、吉野郡賀名生村の言い伝えとして、おおよそ次のような一節が載っているという。

    昔、唐にケイオウとヨウキヒという夫婦が住んでいた。男は妻と離れるのを嫌がり、畑へ出て仕事もしない。そこで妻は自分の姿を絵に描かせ、畑の脇に立てさせることにした。ところがある日、風が吹いて、その絵が空へ舞い上がり、城の御殿の庭に落ちた。国王はこれを見て、絵に描かれた美人を捜させ、ヨウキヒはついに宮中へ上がることになった。そして、いつまでたっても帰されなかったため、ケイオウもヨウキヒも、ともに恋い焦がれて死んでしまった。

    それから数年たち、宮中の女が、正月の祝いの七草を摘みに畑へ行くと、玉のように美しい虫が一匹いた。持ち帰って針箱の引き出しに入れておくと、その虫は折れた針をばりばり食べて大きくなり、その後には釘を食べ、金棒を食べ、しまいには牛ほどの大きさになった。国王は、食べ物に困るだろうと思い、矢で射たり刀で斬ったりして、その虫を殺'
  notes:
  - 末尾はscan194に続く。
  - 原文「支那」は当時の中国の呼称で、今日では差別的に受け取られうる語。本文訳では「中国」とし、原文を保存した。
  - 「奈良県風俗志料」「賀名生村」を原画像で確認。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。
  sequence: 198
- id: mmt-194-01
  scan: 194
  section: 絵姿女房／髪長媛
  original: 'さうとするが手應へが無い。火の中へ入れたら溶けようかと思つて之を試みると、蟲は

    赤くなつたまゝ火の中から出て來て、觸るもの皆燒けて城は終に滅びてしまつた。其蟲

    はケイオウとヨウキヒとの亡魂であつた。之を見つけたのが正月の六日であつたから、

    今でも七草は六日には摘まず、五日の日に摘むことになつて居る。七草を敲く時の唱へ

    言に、唐土の鳥といふのも此二人の亡魂であるといふ。

    此話の慶王と楊貴妃とは無論借り物であつた。原書が彼方に有らうと思つて、捜したら必

    ずむだをするであらう。しかし少なくとも姿繪の風に飛んだといふ趣向がどうやら日本の土

    に向かぬことを、昔も感じて居た人が有つたといふ證據にはなるかと思ふ。さうして又若干

    の漢書の知識ある者が、今ある昔話の成立に干與した場合が、時には有つたといふことも之

    に由つて窺はれる。それが桃とか菖蒲とか七草とかいふやうに、兎角節供の日の由來を說か

    うとしたのも、或は一頃の輸入學者の趣味であつたのかも知れない。

    しかも私はそれが突如として民間に入込んで、其まゝ居附いたのでは無からうと思つて居

    るのである。そんなら下地にどういふ因緣があつて、之を引寄せて土地のものとしたかとい

    ふと、先づ想像に浮ぶのは上流の戀、卽ち昔も貴人と有力者のみは、我が住む土地以外に婚

    姻を求め、名を聞いて遙かに懸想する習ひがあり、それを又家々の譽れとして語り傳ふる者

    が、何れの田舍にも多かつたことである。この種の傳說の說く限りに於ては、皇子と神の御

    子との堺すらも明かでなかつた。單に尋常鄰保の間からで無く、遠い異郷の人を聟に儲けた

    といふことが、直ちに我家の少女の殊に清く、すぐれて美しかつたことを推測せしめ得たの

    であつた。斯ういふ氣風が現實に我邦の婚姻制度に影響して、次第に今日の慣行を作り上げ

    たことに就ては、別の機會に於て詳しく說くつもりである。爰で述べたいことは中古以前の

    戀愛文藝が、殆とその總前線を擧げて、たゞこの一少部分の特殊婚姻を基調として展開して

    居たことと、更に近世の小說までが其遺習を承けて、偏へに才子佳人の氷月奇緣のみを、題

    材として悔いなかつたこととである。繪姿飄搖の新らしい趣向が、人望あるローマンスとし［て］

    此間に歡迎せられたのは、ちつとでも意外なことでは無い。

    繪姿女房の一つ以前の形として私たちの心づくのは、驚くべき長い髪の毛をもつた少女の

    話である。菅江眞澄の筆のまにまに卷四に、紀州淡島の加太神社の神主阪本左膳の傳ふる所'
  translation: 'そうとしたが、手応えがなかった。火の中に入れたら溶けるだろうかと思い、試してみると、虫は赤くなったまま火の中から出てきて、触れたものはすべて燃え、城はついに滅びてしまった。その虫は、ケイオウとヨウキヒの亡魂だった。これを見つけたのが正月六日だったので、今でも七草は六日には摘まず、五日に摘むことになっている。七草をたたくときの唱え言で「唐土の鳥」というのも、この二人の亡魂なのだという。

    この話の慶王と楊貴妃は、もちろん借り物の名である。原典が中国にあるだろうと思って探しても、必ず無駄になるだろう。しかし、少なくとも姿絵が風に飛ばされたという趣向は、どうも日本の土地に合わないと、昔も感じていた人がいた、その証拠にはなると思う。そしてまた、多少中国の書物の知識を持つ者が、今ある昔話の成立に関わった場合があったことも、これによってうかがわれる。桃、菖蒲、七草など、何かと節句の日の由来を説こうとしたのも、ある時代の、外国の学問を取り入れた人々の好みだったのかもしれない。

    それでも私は、それが突然民間へ入り込み、そのまま根づいたのではないと思っている。それなら、下地にどんな事情があって、これを引き寄せ、土地のものにしたのか。まず思い浮かぶのは、上流階級の恋である。つまり昔も、貴人や有力者だけは、自分の住む土地の外に結婚相手を求め、評判を聞いて遠くから恋い慕う習わしがあった。そして、それを家の誉れとして語り伝える人が、どの田舎にも多かったということである。

    この種の伝説の語るところでは、天皇の子と神の子との境目さえ、はっきりしなかった。普通の近隣の間からではなく、遠い他郷の人を婿に迎えたというだけで、わが家の娘がとりわけ清らかで、優れて美しかったことを推し量らせることができたのである。こうした気風が、実際にわが国の婚姻制度へ影響し、次第に現在の慣行を作り上げたことについては、別の機会に詳しく述べるつもりである。

    ここで述べたいのは、中古以前の恋愛文学が、ほとんど全体を挙げて、このごく一部の特殊な結婚を基調に展開していたこと、さらに近世の小説までがその習慣を受け継ぎ、もっぱら才気ある男と美しい女が不思議な縁で結ばれる話ばかりを題材にして、疑問を持たなかったことである。姿絵が風に漂うという新しい趣向が、人気のある恋物語として、その間に歓迎されたのは、少しも意外なことではない。

    絵姿女房の一つ前の形として、私たちが気づくのは、驚くほど長い髪を持つ少女の話である。菅江真澄の『筆のまにまに』巻四には、紀州淡島の加太神社の神主、阪本左膳の伝える話'
  notes:
  - 冒頭はscan193から、末尾はscan195に続く。
  - 原画像により「異郷」を確認し、「貴く」という推測補読は「清く」に訂正した。
  - 原文「氷月奇緣」は、結婚にまつわる不思議な縁の意として訳した。
  - 原印刷は「ローマンスとし」「此間」と続き、「て」が脱落しているとみられる。校訂原文では［て］を補い、訳も文意に沿ってつないだ。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。
  sequence: 199
- id: mmt-195-01
  scan: 195
  section: 絵姿女房／髪長媛
  original: 'として、次の話を錄して居る。白鳳の頃、禁中の御簾に一丈八尺ある黑髪一筋、鳥くひもち

    來りて引掛けたり。之をいと恠しきことと思し召すに、陰陽博士占なひて申すには、紀國に

    端正なる處女あり、是こそ其女の髪云々と奏しければ、やがて御使をたまはりて召されて天

    武天皇の御后に立ちたまふと也。其美女が出でし家は兄海士の家なり。九泉郞は故由ある家

    ながら、世につれて今は御坊となれり。其御坊の家の妻娘などは、世にいふ市子口寄縣神子

    の業をなせりと(以上)。所謂兄海士九海士の家のことは、續風土記にも載せて居らぬが、此

    御社の神主の前田氏、代々女子相續で入婿を取つて居たといふ舊記はある。爰から諸國を宣

    教してあるいた人々が、以前は此樣な語りごとをも持ち廻つて居ただけは想像し得られるの

    である。ところが東北の田舎に行くと、是が又或る別の舊家の、傳說として保存せられて居

    た。例へば閉伊郡の宮古濱などでは、某といふ家の娘が三月三日の潮干に行つたまゝ、三年

    の間歸つて來なかつた。三年目のちやうど同じ日に、身もちになつて戾つて來て、やがて一

    人の女の子を生み落したが、その子の父の誰であるかは言はなかつた。女の子は生れながら

    髪長く、やがて十七八の美しい娘になる頃には、其長さが七尋と三尺もあつた。都では時の

    御門が、春の日に右近の櫻といふ名木の花を御覽になつて居ると、其木の枝に珍らしく長い

    髪の毛が三筋引掛つて居た。安倍晴行といふ博士、是は人間の髪に相違無しと占なつたので、

    然らば其の女を探し出せといふことで、乃ち猿樂といふ者を仕立てて、京から西東へ手を分

    けて尋ね求めさせる。東の國々を廻つて居た猿樂の一組は、行き行きて閉伊郡山田の湊のほ

    とり、小山田といふ里にさしかゝつて、或峠の上で猿樂を興行し、土地の女たちを招いて見

    物させると、其見物の數多い群の中に、七尋三尺の髪の毛の娘が、その長い毛を桐の箱に入

    れて背に負ひ、母と共にまじつて居た。それを見つけて猿樂は直ぐに止め、娘は都へ連れて

    行かれた。土地ではこの女性を今も「うんなん神」と祀り、都の人が猿樂を舞つた處を、永く

    猿樂峠と呼ぶことになつたといふ(聽耳草紙、第一一六話)。

    沖繩諸島の浦島說話には、長い髪の毛を說くものが多い。たとへば遺老說傳に宮古島の

    禰間の伊嘉利、天川崎の濱邊に出て水際に三筋の髪毛の漂ふを見る。長さ七八尺許、奇とし

    て之を收むれば忽ち一美女來りて曰ふ。吾昨夕此地に遊び一髦を失へり。拾ひたらば之を返

    せと。乃ち返し與ふれば海中に歸り去る。翌日同じ所に行きて又美女に逢ひ、

    龍宮に連れ行'
  translation: 'として、次の話が記されている。

    白鳳のころ、宮中の御簾に、長さ一丈八尺の黒髪が一本、鳥にくわえて運ばれ、掛かっていた。帝がたいそう不思議に思われると、陰陽博士は占って、「紀伊国に美しい乙女がおり、これはその女の髪です」などと申し上げた。そこで使いを送り、召し出して天武天皇のお后に立てられたという。その美女の生まれた家は、兄海士の家である。九泉郎（くあま）は由緒ある家だが、時代の移り変わりにつれて、現在は御坊となった。その御坊の家の妻や娘などは、世にいう市子、口寄せ、県神子の仕事をしている、という（引用は以上）。

    この兄海士・九海士という家のことは、『続風土記』にも載っていない。しかし、この神社の神主である前田氏が、代々女性に跡を継がせ、婿を迎えていたという古記録はある。ここから各地へ教えを広めて歩いた人々が、以前はこうした語り物も持ち歩いていたことだけは、想像できる。

    ところが東北の田舎へ行くと、これがまた、別の旧家の伝説として保存されていた。例えば閉伊郡の宮古浜などでは、ある家の娘が三月三日に潮干狩りへ行ったまま、三年間帰ってこなかった。三年目のちょうど同じ日に、身ごもって戻り、やがて女の子を一人産んだが、その子の父が誰かは言わなかった。女の子は生まれつき髪が長く、十七、八歳の美しい娘になるころには、長さが七尋三尺もあった。

    都では、時の帝が、春の日に「右近の桜」という名木の花をご覧になっていると、その枝に、珍しく長い髪が三本引っ掛かっていた。安倍晴行という博士が、これは確かに人間の髪だと占った。では、その女を探し出せということになり、猿楽を演じる者たちを仕立て、京から西と東へ手分けして捜させた。

    東の国々を巡っていた猿楽の一団は、旅を続けて閉伊郡山田の港のほとり、小山田という里に来た。そして、ある峠の上で猿楽を演じ、土地の女たちを招いて見物させると、大勢の見物人の中に、七尋三尺の髪を桐の箱に入れて背負い、母と一緒に来ている娘がいた。それを見つけると、猿楽はすぐに中止され、娘は都へ連れていかれた。土地では今も、この女性を「うんなん神」として祭り、都の人が猿楽を舞った場所を、以来ずっと猿楽峠と呼ぶようになったという（『聴耳草紙』第一一六話）。

    沖縄諸島の浦島説話には、長い髪の毛を語るものが多い。例えば『遺老説伝』には、次のようにある。宮古島の禰間の伊嘉利が、天川崎の浜へ出ると、水際に三本の髪が漂っているのを見た。長さは七、八尺ほどで、不思議に思って拾うと、たちまち一人の美女が来て、「私は昨晩ここで遊び、髪を一束落としました。拾ったのなら返してください」と言った。返してやると、海中へ帰っていった。翌日、同じ所へ行くと、また美女に会い、竜宮へ連れてい'

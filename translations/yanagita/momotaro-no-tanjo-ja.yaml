  section: 和泉式部の足袋／三 鹿母夫人
  original: 'い。

    鹿が山奥に行をする聖者の子を孕んだ因緣だけは、彼と是と全く一つであつて、確かに一方の天竺の所傳を知らなかつたならば、日本で單獨には斯樣な空想は浮ばなかつたに違ひない。

    故芳賀博士の攷證今昔物語集に、此話の出所として指示せられた雜寶藏經の說話は、啻に東三河の人々によつて讀まれて居ただけで無く、更に十分に利用せられて居たことも證據があるのである。

    同じ早川君の大著「花祭」の後篇一二頁以下に、北設樂の村々の神樂の歌、「若子のしめ」といふ長篇の數種を揭げてあるが、何れも右の鹿母夫人の終りの方の一節、卽ち天竺の國王長者の北の御前が、蓮華の蕾を產み落したことを語つて居る。

    是が鳳來寺山僧の學問によつて、導かれて里に行はれたとまでは斷定し得ないだらうが、必ずしも今昔物語の和譯を仲介とせずに、既に原書に就いて斯かる山村には似つかはしからぬ空想を、歌にうたふ程度に承繼いで居たことは事實である。

    しかもそれが單純なる受賣では無くして、彼には五百人の王子が、五百の蓮の葉每に出現したとあるのを改めて、是には其蓮の蕾を池の上に投げ入れると、次の日は莖立ち八つの花瓣開いて、其中から五人の神樂男が生れたとあつて、之を我土地の神祭の由來に、結び付けようとして居るのみか、一方には其異常生誕の原因として、極めて日本風なる申し兒の夢を叙して居るのである。

    七日の夜半の頃なるに紀の國熊野三社權現枕がみに立たせたまひて六尺二寸の鐵の杖の三尺二寸になる程三尺二寸の鐵の足駄の一尺二寸になる程唐土天竺日本吾朝國を尋ね巡り候ひけるに汝に與ふるみたまは無きとてはちすの花の蕾みしところを左の袂へ移させ候ひければ其時こくわう長者も夢さめかつぱと起きふし七度の禮拜めされて云々'
  translation: '――い。鹿が、山奥で修行する聖者の子を身ごもったいきさつだけは、あちらとこちらでまったく同じである。確かに、一方のインドの伝承を知らなければ、日本で独自に、このような空想が浮かぶことはなかったに違いない。故芳賀博士の『攷証今昔物語集』に、この話の出典として挙げられた『雑宝蔵経』の説話は、東三河の人々に読まれていただけでなく、さらに十分に利用されていたことにも証拠がある。同じ早川君の大著『花祭』後篇一二頁以下には、北設楽の村々の神楽歌「若子のしめ」という長編が数種類掲げられているが、どれも右の鹿母夫人の話の終わりの方、つまりインドの国王長者の北の御前が、蓮華のつぼみを産み落としたことを語っている。これが鳳来寺の山僧の学問に導かれて村々に広まった、とまでは断定できないだろう。しかし、必ずしも『今昔物語』の和訳を仲立ちとせず、すでに原書に直接あたり、こうした山村には似つかわしくない空想を、歌に歌うほどに受け継いでいたことは事実である。しかも単純な受け売りではない。原典では、五百人の王子が五百枚の蓮の葉に一人ずつ現れたとなっているのを改め、こちらでは、その蓮のつぼみを池に投げ入れると、翌日には茎が立ち、八枚の花びらが開き、その中から五人の神楽男が生まれたとしている。これを自分たちの土地の神祭りの由来に結びつけようとしているだけでなく、一方では、その異常な誕生の原因として、きわめて日本的な「申し子」の夢を述べているのである。

    七日目の真夜中のこと、

    紀伊の国の熊野三社権現が

    枕元にお立ちになって、

    六尺二寸の鉄の杖が三尺二寸になるほど、

    三尺二寸の鉄の高下駄が一尺二寸になるほど、

    唐土、天竺、わが日本の

    国々を訪ね巡ったが、

    おまえに与える御魂はないといって、

    蓮の花のつぼんだものを

    左の袂へお移しになったので、

    そのとき国王長者も夢から覚め、

    はっと起きてはひれ伏し、七度礼拝なさって……。'
  notes:
  - 冒頭は246の文の続き。
  - 『若子のしめ』『こくわう長者』は原文の名称を保持。寸法も原文どおり。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第47頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

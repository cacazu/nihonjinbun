  section: 海神少童／嘉手志川
  original: '載すると、

    むかし一人の貧しい男が、磯に出て美しい小魚を釣り、家に持ち歸つて甕に入れて飼う

    て居た。それから以後每日外から歸つて見ると、家の內がよく清められ、新らしいアザ

    ネの蓆などを敷いて、酒と肴とがちやんと用意してある。餘り不思議に思つて或日窃か

    に覗いて見ると、我家の內に美しい娘が立働いて居る。近よつてわけを尋ねたら、それ

    は小魚になつて來た龍宮のお姫樣であつた。每日此男が釣をして父の韮畠を荒して困る

    ので、嫁になりに龍宮から來たといふ。それで二人で龍宮へ聟入をする時に、途中女に

    教へられて、何か引出物をと言つたら、ヒンジヤ(山羊)を下さいと所望することにする。

    それを貰つて還つてから、忽ちにして長者となつた(といふのみで黃金の糞をすることは

    無いが)、後に其女房と喧嘩をしたところ、女は怒つて火の神の灰を、悉く風呂敷に包

    んで持つて歸り、それから再びもとの貧乏になつた。

    此後に附いて居る一節は、夫が歸り去つた妻を慕うて、海に迷ひ出てコイナーといふ鳥に

    助けられる。それ故に今でも此鳥の渡つて來る季節になると、夜は家々に火を焚いて陸地の

    方角をコイナーに知らしめるといふので、この點は中古の所謂本地物が、一見關係の乏しい

    神々の由緒を附添へ、又は蛇の聟入の昔話等に於て、忽ち五節供の桃菖蒲菊の酒などの起り

    を語るのとよく似て居て、私たちには非常に意味の深いことと思はれるのであるが、今はた

    だ其問題を揭げて置くに止めて、もう少し當面の因緣だけを考へて行かう。水の神の贈物が

    或土地では童子、他では黑猫であるのは驚くに堪へたる變化ながら、それが龜ともなり又山

    羊とさへなつて居るのを見ると、異常なる靈魂の自在に其形體を取替へることは、前代の日

    本人には容易に承認し得られる事實であつたのである。是を信太の森の葛の葉の如く、狐が

    化けて來てといふ樣になつたのは、寧ろ近世の信仰の變化であつた。其爲に今や彼等の方が、

    人間よりもえらいといふ推論に陷らうとして居るが、それは決して尋常の狐では無く、人狐

    何れの形をでも採用し得る靈魂に過ぎなかつたやうである。魚が人間の嫁になりに來たとい

    ふ話も、內地では屢、或家の祖先譚として、今尙半ば信ぜられて居る例が多い。所謂鶴女房

    や鴻鳥女房の話なども、それが文藝化した羽衣の傳說よりは、實は一段と自然に聽きなされ

    て居たのであつた。古い記錄の蛇の聟も蛇女房も、この意味に於てこそ信ずることが出來た'
  translation: '載すると、次のようになる。

    昔、一人の貧しい男が、磯へ出て美しい小魚を釣り、家へ持ち帰って甕に入れ、飼っていた。それ以来、毎日外から帰ってみると、家の中がきれいに清められ、新しいアザネのむしろなどが敷かれて、酒と肴がきちんと用意してある。あまりに不思議なので、ある日こっそりのぞいてみると、自分の家の中で美しい娘が立ち働いている。近づいて訳を尋ねると、それは小魚の姿でやって来た、竜宮のお姫様だった。毎日この男が釣りをして、父のニラ畑を荒らして困るので、竜宮から嫁になりに来たという。それで二人で竜宮へ婿入りに行く際、途中で女に教わり、何か引き出物をと言われたら、ヒンジャ（山羊）をくださいと頼むことにした。それをもらって帰ると、たちまち長者になった（とあるだけで、黄金の糞をするとはない）。しかし後に、その妻と喧嘩をすると、女は怒って、火の神の灰を残らず風呂敷に包み、持って帰ってしまい、それ以来、再び元の貧乏になった。

    この後についている一節では、夫が帰り去った妻を慕って海へさまよい出て、コイナーという鳥に助けられる。それで今でも、この鳥が渡ってくる季節になると、夜には家々で火をたき、陸地の方角をコイナーに知らせるのだという。この点は、中古のいわゆる本地物が、一見関係の薄い神々の由来を付け加えることや、蛇の婿入りの昔話などで、突然、五節供の桃・菖蒲・菊の酒などの起こりを語ることによく似ている。私たちには非常に意味の深いことと思われるが、今は問題を示すだけにとどめ、もう少し、目の前のつながりだけを考えていこう。

    水の神の贈り物が、ある土地では子供であり、ほかでは黒猫であるのは、驚くほどの変化である。しかし、それが亀にもなり、山羊にさえなっているのを見ると、不思議な魂が自由に姿を取り替えるということは、昔の日本人には容易に受け入れられる事実だったのである。それを、信太の森の葛の葉のように、狐が化けて来たと語るようになったのは、むしろ近世の信仰の変化だった。そのため今では、狐のほうが人間よりも優れているという推論に陥りそうになる。だが、それは決して普通の狐ではなく、人間でも狐でも、どちらの姿も取ることのできる魂にすぎなかったようである。魚が人間の嫁になりに来たという話も、内地では、ある家の先祖の話として、今なお半ば信じられている例がしばしばある。いわゆる鶴女房やコウノトリ女房の話なども、それが文芸化した羽衣の伝説より、実は一段と自然なものとして聞かれていた。古い記録にある蛇の婿も蛇女房も、まさにこの意味でこそ信じることができた'
  notes:
  - 画像をまたぐ文は前後のunitと接続する。
  - 「アザネ」はむしろの材料に関する土地の語として保持。
  - 「鴻鳥女房」は原文のルビ「こうのとり」に従い、コウノトリ女房と訳した。
  - 「本地物」は神仏の由来・本地を語る中世の物語の類。

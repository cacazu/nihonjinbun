  section: 和泉式部の足袋／二 淨瑠璃御前の生ひ立ち・三 鹿母夫人
  original: '過ぎなかつたからである。

    古くから傳はつた口碑は、一般に感覺が粗笨で聽き苦しかつた。

    峰の藥師の寺でも夙くから其潤色と合理化とを心がけたやうであるが、それでも餘りに有名で世に弘まつたものは包み得なかつた。

    記錄の中にも幾つと無く旣に現はれて居る。

    昔利修仙人がこの鳳來寺の山で修行をして居た際に、岩窟の外に出て折々小便をしたのが、傍の薄の葉にかゝつて鹿が來て之を舐め、さうして孕んでしまつて美しい女の子を生んだ。

    それを仙人は故鄕の奈良に送つて、或貴人の家の門の外に棄てさせた。

    其子が拾はれて成長して後に光明皇后といふ御方になつたなどと、飛んでも無い無茶なことがちやんと寺記の中に書いてあつたのである。

    鹿の胎內に宿りたまひし故に、生れながらにして足の指二つに裂け、恰も鹿の爪のやうであつた。

    皇后之を嘆きたまひ、宿業消滅の爲にその鳳來寺に祈願をこめ、親筆に寺の扁額を書いて御納めなされたとも傳へて居る。

    此種の亂暴な寺傳がいつの頃に起つたかを私は知らないが、少なぐとも淨瑠璃御前の語りものより、前であつたことだけは想像してよからう。

    是をもし或一人の寺所屬の者が、虛構したのであつたら素より憎むべきいたづら者であるが、私たちは是も亦傳說の普通の法則に隨うて、粗より精に入り、空な話が追々に具體的になつて、固有名詞などは後にいつと無く、取附けることになつたものと思つて居る。

    さうして其背後にはやはり一種の說話の、かかる謬信の種を供したものはあつたのである。

    說話が或時代に入つて新たに輸入せられ、又は飜案製作せられるやうになつて後まで、一方には尙古來の習癖に囚はれて、之を事實として受入れようとする者の多かつたことが、此種の傳說の土著するに至つた主たる原因であつた。

    緣起の記錄の如きは寧ろその昔から有るものを、無意味にしまいとする手加減とも見られるので、人は直接に之によつて騙されるほど、最初から無關心では無かつたものと思ふ。

    私が近頃の文獻派なるものに對して容易に許さない理由は、主としてこの日本の常民をでくの坊の如く、何にでも欺かれる者と見ようとする速斷の點に在るのである。


    三鹿母夫人

    鳳來寺の利修仙人の傳記といふものが、かの今昔物語卷五の國王入山狩鹿見鹿母夫人爲后語の、もとになつて居る說話を知つて居た人の、言ひ始めたものであることは疑ふ餘地が無'
  translation: '――すぎなかったからである。古くから伝わる言い伝えは、一般に感覚が粗野で、聞き苦しかった。峰の薬師の寺でも、早くから脚色と合理化を心がけたようだが、それでも、あまりに有名で世に広まったものは隠せなかった。記録にもすでにいくつも現れている。昔、利修仙人がこの鳳来寺の山で修行していたとき、岩窟の外へ出て時折小便をすると、それがそばの薄の葉にかかり、鹿が来てなめた。そして身ごもって、美しい女の子を産んだ。それを仙人は故郷の奈良へ送り、ある貴人の家の門の外に捨てさせた。その子は拾われ、成長してのちに光明皇后というお方になった、などという、とんでもないむちゃなことが、きちんと寺の記録に書かれていたのである。鹿の胎内に宿ったので、生まれつき足の指が二つに分かれ、まるで鹿のひづめのようだった。皇后はこれを嘆き、前世の業を消すために、その鳳来寺に祈願をこめ、自筆で寺の扁額を書いて納められたとも伝えている。

    この種の乱暴な寺伝がいつ生まれたのか、私は知らない。しかし少なくとも、浄瑠璃御前の語り物より前だったことだけは、想像してよいだろう。もし寺に属する誰か一人がこれを作り上げたのなら、もちろん憎むべきいたずら者である。しかし私たちは、これもまた伝説の普通の法則に従い、粗雑なものから精密なものへ移り、漠然とした話がしだいに具体的になって、固有名詞などはのちにいつしか付け加えられたのだと思っている。そしてその背後には、やはり一種の説話があり、このような誤った信仰の種を提供したのだった。説話がある時代に入って新たに輸入され、または翻案されて作られるようになった後までも、一方ではなお古くからの習慣にとらわれ、それを事実として受け入れようとする者が多かった。これが、こうした伝説が土地に根づくに至った主な原因だった。縁起の記録などは、むしろ昔からあるものを無意味にしないようにする調整とも見られる。人々は、ただ記録によってだまされるほど、初めから無関心ではなかったと思う。私が近ごろの文献派というものを容易に認めないのは、主として、日本の一般の人々をでくの坊のように、何にでもだまされる者と見ようとする早合点のためなのである。

    三　鹿母夫人

    鳳来寺の利修仙人の伝記というものが、あの『今昔物語』巻五の「国王が山に入って鹿を狩り、鹿母夫人を見て后とする話」のもととなった説話を知っていた人が、言い出したものであることは、疑う余地がな――'
  notes:
  - 冒頭は245、末尾は247へ続く。
  - 『上臈』『でくの坊』などは当時の身分語・侮蔑的表現を含む。原文の論評として保持。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第46頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

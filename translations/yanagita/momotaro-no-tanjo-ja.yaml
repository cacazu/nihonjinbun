  original: の近世の變化であつたが、もう少し古い形は松崎慊堂の日歷、天保五年三月二十九日の條にも出て居て、先生も木賀の湯に滯在中、親しく往つて見たことがあるとさへ謂つて居る。是なども大蛇の祕密を聞いたのは、笛の上手な盲人であつたといひ、琵琶とも三味線とも言つて居ないのである。龍宮女房その他多くの日本の昔話に於て、蛇體に愛せられて特別の庇護を受けたといふ人間は、大抵は笛吹きの名人となつて居る。さうして此方が私にはより自然である樣に思へる。笛で長蟲を調御することは、今でも印度人の蛇使ひなどが遣つて居る。我邦にも古今著聞集に伶人助元、笛を吹いて怖ろしい大蛇を退けたといふ話がある。又夜分に笛を吹くと蛇が來るといふ俗信は、現在も尙各地に行はれて居る。是が中世以後の盲人の常の所業で無いだけに、或は彼等と水の神との關係を說く說話の、古い形の痕跡で無いかと思はれるのである。今日盲目の輩の祭り仕へて居る辨天樣は、御自身も亦琵琶を彈きたまふ美しい女性であるが、琵琶が此國に渡つて來ぬ以前にも、やはり盲といふ不幸な者は我々の間にあり、それが何かの方法で生を營み、もしくは因緣ある守護神に縋つて居たにちがひ無い。だからもし今日の按摩の笛が、何の意味も無いたゞ偶然の殘存で無いならば、曾ては笛を吹いて水底の神靈に仕へて居た時代が、彼等にはあつたのかも知れぬのである。假に固有の水の神との關係が、今ある妙音天女の信仰の基であつたとすれば、彼等も亦龍の都の消息を語り得る資格があり、從うて米倉の笑話も橫取りでは無かつた。たゞ單に是をあの樣な滑稽に語り改めたといふ點が、時勢に强ひられたる悲しむべき冒瀆であつたと言ひ得るのみである。九信仰から文藝へ全體に我々の祖先が水の神に對して、曾て抱いて居た信賴と感謝の念は、可なり早くから薄れ又衰へつゝあつたのである。農民はたゞ雨乞の日にばかり大騒ぎをするだけで、常には淵の主は人を取るとか風雨を起すとか謂つて、之を畏れ憚るの習ひのみが時と共に增長して居たことは、所謂三輪式神話の末の流れ、大蛇が美しい娘の聟になつて通うたといふ昔話の、變遷の上にもよく表はれて居る。是は人口の增加と生活技術の進歩とにつれて、日本人が次第に高地から下つて來て、水のやゝ豐富に過ぎる低濕の平原を、耕作するやうになつた經濟
  translation: '〔前のスキャンから続く〕近世における変化だった。もう少し古い形は、松崎慊堂の『日暦』の天保五年三月二十九日の条にも出ており、先生も木賀の湯に滞在中、自ら行って見たことがあるとまで述べている。これなども、大蛇の秘密を聞いたのは笛の上手な目の見えない人だったといい、琵琶とも三味線ともいっていない。「竜宮女房」など、多くの日本の昔話で、蛇の姿をした者に愛され、特別の保護を受けたという人間は、たいてい笛吹きの名人になっている。そして私には、こちらのほうが自然に思われる。笛で蛇を操ることは、今でもインドの蛇使いなどがやっている。日本にも『古今著聞集』に、楽人の助元が笛を吹いて恐ろしい大蛇を退けたという話がある。また、夜に笛を吹くと蛇が来るという俗信は、今も各地に伝わっている。これが中世以降の目の見えない人の通常の営みではないだけに、彼らと水の神との関係を説く説話の、古い形の痕跡ではないかと思われる。今日、目の見えない人たちが祭り仕える弁天様は、ご自身も琵琶を弾く美しい女性だが、琵琶がこの国へ渡来する以前にも、やはり目の見えない不幸な者は私たちの間にいた。その人たちは何らかの方法で生計を立て、あるいはゆかりある守護神にすがっていたにちがいない。だから、もし今日の按摩の笛が、何の意味もない、ただ偶然に残ったものではないとすれば、かつて彼らには、笛を吹いて水底の神霊に仕えた時代があったのかもしれない。仮に、もともとの水の神との関係が、現在の妙音天女の信仰の基礎だったとすれば、彼らにも竜の都の様子を語る資格があり、したがって米倉の笑い話も横取りではなかった。ただ、それをあのような滑稽な話に語り直した点が、時勢に強いられた、悲しむべき冒瀆だったといえるだけである。

    九　信仰から文芸へ

    全体に、私たちの祖先がかつて水の神に抱いていた信頼と感謝の念は、かなり早くから薄れ、衰えつつあった。農民は雨乞いの日だけ大騒ぎするばかりで、日ごろは淵の主が人を取るとか、風雨を起こすとかいい、恐れて避ける習慣だけが、時とともに強まっていた。このことは、いわゆる三輪式神話の末流、大蛇が美しい娘の婿となって通ってきたという昔話の変遷にも、よく現れている。これは人口の増加と生活技術の進歩に伴い、日本人が次第に高地から下り、水がやや多すぎる低く湿った平野を耕作するようになった、経済的な、'

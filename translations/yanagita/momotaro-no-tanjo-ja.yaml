  section: 瓜子織姫／二 瓜の中からお姬樣
  original: それで最初に先づ石見の話の大要を列記して見ると、昔昔、爺と婆とがあつた。爺は山へ木を樵りに、婆は川へ洗濯に行つた。川上から瓜がコンブリコンブリと流れて來た。それを拾うて食べて見ると、あまりにおいしいので「もう一つ流れて來い、爺さんに遣るから」といふと、果して又一つ流れて來た。其瓜を拾ひ上げて、持つて歸つて櫃の中へ入れて置いた。爺が歸つて來たから出して庖丁で切らうとすると、瓜はひとりでに二つに割れて、中からかはいゝお姬樣が出て來た。爺と婆とは大喜びであつた。そのお姫樣が每日機を織る。「爺さんサイが無い、婆さん管が無い、キーリバツタン、スツトントン」と機を織つた。ある日二人の留守の日に、アマンジヤクが遣つて來て、トントンと戶を叩く。「手の入るほどでよいから開けてくれ」。「叱られるからいやだ」と言つたが强ひて開けさせる。今度は「頭の入るだけ」といひ、今度は「體の入るだけ」と言つて、とうとう家の中に入つて來てしまつた。アマンジヤクは姫を誘うて柿の木谷へ柿を取りに行く。さうして最初には木の上から澁い柿を取つて投げ付け、次には姫にきたない自分の衣物を着せて、柿の樹に登らせて高い枝に縛り付けた。さうしてアマンジヤクは姫に化けて、家に來て機を織つて居た。爺と婆とは歸つて來て、それを知らずに姫を嫁に遣ると言つて駕籠に乘せる。「柿の木
  translation: 'そこで最初に、まず石見の話のあらましを順に挙げてみる。

    昔々、お爺さんとお婆さんがいた。お爺さんは山へ木を切りに、お婆さんは川へ洗濯に行った。川上から瓜がコンブリコンブリと流れてきた。それを拾って食べてみると、あまりにおいしいので、「もう一つ流れておいで。お爺さんにあげるから」と言った。すると、果たしてもう一つ流れてきた。

    その瓜を拾い上げ、持ち帰って櫃の中に入れておいた。

    お爺さんが帰ってきたので、取り出して包丁で切ろうとすると、瓜はひとりでに二つに割れ、中からかわいらしいお姫様が出てきた。

    お爺さんもお婆さんも大喜びだった。

    そのお姫様は、毎日機を織った。「爺さん、サイがない。婆さん、管がない。キーリバッタン、スットントン」と、機を織った。

    ある日、二人の留守にアマンジャクがやってきて、トントンと戸をたたいた。「手が入るくらいでいいから、開けておくれ」。「叱られるからいやだ」と言ったのに、無理に開けさせた。今度は「頭が入るだけ」、その次は「体が入るだけ」と言って、とうとう家の中に入ってしまった。

    アマンジャクは、姫を誘って柿の木谷へ柿を取りに行った。そして、まず木の上から渋い柿をもいで投げつけ、次に姫に自分の汚い着物を着せ、柿の木に登らせて高い枝に縛りつけた。

    そうしてアマンジャクは姫に化け、家に戻って機を織っていた。

    お爺さんとお婆さんは帰ってきたが、そのことを知らず、姫を嫁入りさせようと言って駕籠に乗せた。「柿の木'
  notes:
  - 末尾はscan74へ続く。
  - 「サイ」は機織りの用具名として原語を保持。
  - 次のスキャンへ続く

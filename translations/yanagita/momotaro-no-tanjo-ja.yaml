  original: 居ると段々に大きくなり、それから以下は奧州の灰まき爺とほゞ同樣に展開して居る。それとはちやうど逆に、東北地方の桃太郞には、桃で無いものが流れて來たといふ話がある。たとへば出羽の莊內の桃太郞は堀維孝氏の記憶に依ると、婆が洗濯をして居る所へ箱が二つ流れて來る。かーらだこん箱あつちやえけみーだこん箱こつちやこえと唱へて、寄つて來た箱を取上げて見ると、其中には桃が一つ入って居る。家に持つて歸つて爺樣と二人で食べようと思つて、暫らく神棚に上げて置いた。晩に柴苅りに行つた爺が戾つて來て、其話をするのを忘れて居るうちに、不意に神棚から赤兒の啼く聲が聽える。不思議に思つて上を見ると、其桃が二つに割れて、中から男の子が生れてをつたと謂つたさうである。「みーだこん箱」は中に實のある香箱といふことで、香箱は多くの子守唄にもある如く、以前の小兒のほしがる玩具であつた。卽ち此話は旣に童話化して居て、尙斯ういふ形にも話されて居たのである。內田邦彥氏の津輕口碑集には、これと關係の深い話が二つ出て居る。其一つは是も婆樣が川に出て、川上からきれいな宮が流れて來たのを拾ひ上げると、中には桃の實が一つ入つて居る。爺樣に見せようと思つて簞笥の中に取つて置いた。其夜山から爺樣が還つて來て、夜中に簞笥の中で幼兒の啼く聲がする。桃から生れたんで桃太郞と名をつける。それが段々に大きくなつて、黍團子を持つて鬼征伐に行く話である。今一つは桃太郎で無く尾羽剪雀の話であるが、是亦婆が洗濯に行くと、川上から鳥籠が流れて來た。きたない籠はあちへ行け、きれいな籠はこちへ來いといふと其通りになつた。婆樣は大喜びで鳥籠を家に持つて歸り、「爺むし爺むし、綺麗な娘こ一人拾つて來た」、「あゝさうか、娘なら此糊をすらせろ」と言つたとあつて、籠には何が入つて居たのかはつきりせぬが、それが糊をすりながらちゆんと鳴いては糊を食ひ、又ちゆんと鳴いては糊を食つて、とう〳〵皆食つてしまつたので、爺が怒つて尾を剪つて逐出したとあるのは雀である。それから後はたゞ爺婆が逆さになつて居るだけで、他は普通の舌切雀と異なる所がないのだが、是も考へて見ると、どうして其樣な非凡な雀が老夫婦の家に來たかは、所謂標準御伽の方では言ひ落して居るらしいのである。喜田貞吉氏の話によれば、阿波でも桃太郞の桃が流れて來る代りに、瓜が流
  translation: '……いるとだんだん大きくなり、それ以下は、奥州の「灰まき爺」とほぼ同じように展開している。

    それとはちょうど逆に、東北地方の桃太郎には、桃ではないものが流れてきたという話がある。たとえば、出羽の庄内の桃太郎では、堀維孝氏の記憶によれば、婆が洗濯しているところへ、箱が二つ流れてくる。

    「かーらだこん箱あっちゃえけ

    みーだこん箱こっちゃこえ」

    〔中の空の香箱はあっちへ行け、中身のある香箱はこっちへ来い。〕

    と唱え、寄ってきた箱を取り上げてみると、中には桃が一つ入っている。持ち帰って爺と二人で食べようと思い、しばらく神棚に上げておいた。夕方、柴刈りにいった爺が戻り、その話をするのを忘れていると、不意に神棚から赤ん坊の泣き声がする。不思議に思って上を見ると、桃が二つに割れ、中から男の子が生まれていた、という話だったそうである。「みーだこん箱」とは、中に実のある香箱のことで、香箱は多くの子守歌にも出てくるように、昔の子どもが欲しがる玩具だった。つまりこの話は、すでに童話になっていながら、なおこういう形でも語られていたのである。内田邦彦氏の『津軽口碑集』には、これと深い関係のある話が二つ出ている。一つは、やはり婆が川へ出て、川上からきれいなお宮が流れてきたのを拾い上げると、中に桃が一つ入っている。爺に見せようと思い、たんすの中にしまっておいた。その夜、爺が山から帰り、夜中にたんすの中で幼児の泣き声がする。桃から生まれたので桃太郎と名づける。その子が次第に大きくなり、きび団子を持って鬼退治にいく話である。もう一つは桃太郎ではなく「尾羽切り雀」の話だが、これも婆が洗濯にいくと、川上から鳥かごが流れてくる。「汚いかごはあっちへ行け、きれいなかごはこっちへ来い」というと、そのとおりになる。婆は大喜びで鳥かごを持ち帰り、「爺さん、爺さん、きれいな娘を一人拾ってきたよ」「ああ、そうか。娘なら、この糊をすらせろ」といった、とある。かごに何が入っていたのかはっきりしないが、それが糊をすりながら、ちゅんと鳴いては糊を食べ、またちゅんと鳴いては食べて、とうとう全部食べてしまったので、爺が怒って尾を切り、追い出したというのは雀である。それ以後は、ただ爺と婆の役が逆になっているだけで、ほかは普通の「舌切り雀」と違わない。しかしこれも考えてみると、どうしてそのような並外れた雀が老夫婦の家に来たのかを、いわゆる標準的なおとぎ話は語り落としているらしい。喜田貞吉氏の話によると、阿波でも桃太郎の桃が流れてくる代わりに、瓜が流……'

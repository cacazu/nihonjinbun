  section: 田螺の長者／三 小泉小太郎と泉小次郎
  original: 'の子孫は代々橫腹に蛇の斑紋があるさうだ。

    此話を分析して居ると、又長くなるから唯重要なる三點だけを擧げて置かう。其一つは小

    太郞が怠け者で何もせずに飯ばかり食つて居たこと。是は信州が物草太郞の鄕國であるだけに、殊に偶然の挿話とは思はれない。說話の英雄は最初小さく貧しく、又は形が見苦しかつ

    た外に、往々にして愚鈍であり怠惰であつたと傳へられて居る。それが常理を以て豫測し得

    なかつた奇跡を現ずることは、蛇や田螺の形を假りて出て來たといふ話と趣意に於て同じで

    ある。第二に小泉山に萩が一本も無い由緒、是は關東などでは專ら巨人說話に伴なふもので、

    例へばダイダラ坊が富士を背負つて立たうとして、其藤蔓の綱が切れた故、相模野には藤が

    育たぬといふ類の話は、必ず大昔の山作りや蹴裂きの傳說を潤色して居るのである。小泉の

    小太郎も小男であつたとはいふが、後に亦驚くやうな大仕事をして居るのである。更に第三の點としては、犀川盆地の泉小次郞と、元は一つであつたらうことが注意せられる。松本

    平の方の泉小次郞も、東筑摩郡中山村、大字和泉といふ村で生れたと傳へられ、父は鉢伏山

    の神と謂ひ、或は自身鉢伏權現の再誕であつたとも謂ふ說がある。夙くから大寺古社の緣起

    に採り入れられた爲に、造言が多くて何れを本據とすべくも無いが、信府統記(卷十七)の

    傳に、父は東高梨池の白龍王、母は犀龍にして姿を恥ぢて湖水に入ると謂ひ、誕生の地は鉢

    伏山、成長の地は放光寺山、其名を日光泉小太郞と稱すとあるのは、後に父の神と再會した

    際に、白龍が自ら我は日輪の精靈なりと言つたとあるのと關係があつたらしい。この泉小太

    郞の大事業なるものは、母の犀龍の背に乘つて、今の三清地と水內橋の岩山を突き破り、水

    の路を越後の海まで切り開いたことであつた。是は東國では利根富士川、九州では筑後の矢

    部川、奥州では猿ケ石川、其他多くの水筋に於て土地の神樣の偉勳として傳ふる所であつて、

    實際地形を熟知する者には、信じ且つ崇めざるを得ない神話の一つであつた。それを土地に

    よつては異人が山奥から石を蹴りながら、水路を付けつゝ下つて來たとも謂つて居る。泉と

    いふ山麓の部落が、其根原を誇つたのにも信仰があつた。然るに信州の學者の中には、是を

    吾妻鏡の和田一亂に加擔して行方知れずになつた泉小二郞親衡といふ勇士の事績として、旣

    に鄕土の人物志中に載せた者もあり、傳說と歷史との境を認めざる者は、親衡犀獸を退治す

    といふ類の武功を讚歎しようとして居たのである。僅か山一つ隣の類例を知つただけでも、'
  translation: '――の子孫には、代々、脇腹に蛇のまだら模様があるそうだ。


    この話を分析するとまた長くなるので、重要な三点だけを挙げておこう。一つは、小太郎が怠け者で、何もせずに飯ばかり食べていたことである。信州が物草太郎の故郷であるだけに、特に偶然の挿話とは思えない。説話の英雄は、初めは小さく、貧しく、または姿が見苦しかっただけでなく、しばしば愚鈍で怠け者だったと伝えられる。その人物が、常識では予想できなかった奇跡を示すことは、蛇や田螺の姿を借りて現れたという話と、趣旨は同じである。


    第二は、小泉山に萩が一本もないという由来である。これは関東などでは、もっぱら巨人の説話に伴う。例えば、ダイダラ坊が富士を背負って立とうとした時、藤づるの綱が切れたため、相模野には藤が育たないという類の話は、必ず大昔の山造りや、山を蹴り裂いたという伝説を飾り立てている。小泉の小太郎も小男だったというが、後にはまた、驚くような大仕事をしているのである。


    さらに第三として、犀川盆地の泉小次郎と、もとは一つだっただろうことが注目される。松本平の泉小次郎も、東筑摩郡中山村大字和泉という村で生まれたと伝えられ、父は鉢伏山の神とも、あるいは自身が鉢伏権現の生まれ変わりだったとも言われる。早くから大寺院や古い神社の縁起に取り入れられたため、作り話が多く、どれを本来のよりどころとも決められない。しかし『信府統記』巻十七の一伝に、父は東高梨池の白竜王、母は犀竜で、姿を恥じて湖に入ったといい、生まれたのは鉢伏山、育ったのは放光寺山、名を日光泉小太郎と称するとあるのは、後に父の神と再会した際、白竜が自ら「私は太陽の精霊だ」と言ったとあることに関係していたらしい。


    この泉小太郎の大事業とは、母の犀竜の背に乗り、今の三清地と水内橋の岩山を突き破って、越後の海まで水路を切り開いたことだった。これは東国の利根川や富士川、九州の筑後の矢部川、奥州の猿ヶ石川、そのほか多くの川筋でも、土地の神の偉業として伝えられている。実際の地形をよく知る者には、信じ、かつ崇めずにはいられない神話の一つだった。それを土地によっては、異人が山奥から石を蹴りながら、水路をつけて下ってきたともいう。泉という山麓の集落が、その起源を誇ったことにも信仰があった。ところが信州の学者には、これを『吾妻鏡』の和田の乱に加わり、行方不明になった泉小二郎親衡という勇士の事績として、すでに郷土の人物誌に載せた者もいる。伝説と歴史の境を認めない者は、「親衡が犀獣を退治した」といった武功を称賛しようとしていたのである。たった山一つ隣の類例を知るだけでも――'

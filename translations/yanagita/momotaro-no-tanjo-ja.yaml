  section: 和泉式部の足袋／一 熊の子鹿の娘
  original: '一 熊の子鹿の娘

    鷲や狼が赤兒を持つて來てくれたといふ話は、日本でも古くから各地に語り傳へられて居るが、それは其樣な事實が曾て一度でも有つて、其經驗を不精確に又は誇張して記憶して居るのでは無く、寧ろ今一段と荒唐無稽なる昔の信仰、卽ち偉人といふものが尋常一樣の產屋の中からは生れず、往々にして異類の姿を假りて世に出たものだといふ神話の、たゞ少しばかり合理化して保存せられたものであつたことは、今まで集めて見た若干の類例だけでも、大よそは推論することが出來るかと思ふ。

    此外にも形は全く人間の子の通りであつても、父とか母とかが靈ある動物であつたといふ傳說は、やはり此過程の中間から、岐れて出たものと私などは見て居る。

    所謂狐女房の話は有名なる安倍晴明以前、美濃の狐といふ大力の家の元祖の事蹟といふものが、旣に日本靈異記の中に載せられて居るのみならず、つい近頃まで同じやうな家筋が、諸國に十箇處以上もあつた。

    是等は何れも一樣に、後日何かの拍子に正體を顯はして、子供を殘し留めて退去したことになつて居るのだが、化けて女房になつて住込んで居た場合の外、他の動物が母であると、當然に其子を送り屆けて來たやうに話されて居た例がある。

    たとへば信州の小谷に於ては、昔中土村大草蓮の獵人、山中に迷うて熊に誘はれ、暫く其穴に滯留して歸つて來た。

    さうすると翌年熊は一人の赤兒をつれて來て、其獵師の家の軒下に置いて行つた。

    其子を熊太郞と名けて養育すると、成人の後胸に一ぱいの毛が生えた男になつたといふが(北安曇郡鄕土誌稿一)、是も疑ひ無く昔話の半ば土着したものであつた。

    鹿に兒を貰つた話は奧州にも一つあつたらしいが、此分は既に鹿の子では無くなつて居る。

    他日完形のものが採集せられるまで、假に今知られて居る記憶の破片を引用すると、昔或奥方が山の奥で產をして死んだ。

    其子を鹿に托して鹿の角にくゝり付けると、鹿は山を下つて'
  translation: '一　熊の子、鹿の娘

    鷲や狼が赤ん坊を運んできてくれたという話は、日本でも古くから各地で語り伝えられている。しかし、それは、そうした事実がかつて一度でもあって、その経験を不正確に、あるいは誇張して記憶しているのではない。むしろ、さらに荒唐無稽な昔の信仰、つまり、偉人というものは普通の産屋から生まれるのではなく、しばしば動物などの姿を借りてこの世に現れたという神話を、少しだけ合理化して保存したものだった。このことは、今まで集めてみた若干の類例だけでも、おおよそ推論できると思う。このほか、姿はまったく人間の子と同じでも、父や母が霊力を持つ動物だったという伝説も、やはりこの変化の途中から枝分かれして生まれたものだと、私などは見ている。いわゆる狐女房の話は、有名な安倍晴明より前にも、美濃の狐という怪力の家の祖先の事跡が、すでに『日本霊異記』の中に載っているだけでなく、つい近ごろまで、同じような家筋が諸国に十か所以上もあった。これらはいずれも、後日、何かの拍子に正体を現し、子どもを残して去ったことになっている。しかし、化けて女房となり住み込んでいた場合のほかに、ほかの動物が母であると、当然のことのように、その子を送り届けてきたと語られる例もある。たとえば信州の小谷では、昔、中土村大草蓮の猟師が山中で迷い、熊に誘われて、しばらくその穴に滞在してから帰ってきた。すると翌年、熊が赤ん坊を一人連れて来て、その猟師の家の軒下に置いていった。その子を熊太郎と名づけて育てると、成長後は胸いっぱいに毛の生えた男になったという（『北安曇郡郷土誌稿』一）。これも疑いなく、昔話が半ば土地に根づいたものだった。

    鹿から子をもらった話は、奥州にも一つあったらしいが、こちらはすでに鹿の子ではなくなっている。後日、完全な形の話が採集されるまで、ひとまず今知られている記憶の断片を引用すると、昔、ある奥方が山奥で子を産んで死んだ。その子を鹿に託し、鹿の角にくくりつけると、鹿は山を下って――'
  notes:

  section: 隣の寝太郎／山田の露
  original: といふ妙な歌であつたが、中將姫の母は姫の不謹愼を憎んで之を追ひ出したので、故鄕へ同道して還つて夫婦の語らひをした。山田川の藻淵は姫が山村に食物乏しきを憐んで、海から採つて來た一房の藻を、此淵に投入れたのが今でも繁茂すると謂つて居る(郡誌一一六〇頁)。上野國では山田郡川內村に山田といふ在處があつて、爰にも白瀧神社と山田男との傳說を保存して居る。山田郡誌にも此事を誌してあるさうだが私はまだ見ない。上州鄕土研究といふ書物の桐生市荒土の條には、この白瀧神社の祭神は、此地方の人に機織る藝を教へた白瀧姬であると謂ひ、和銅七年に桐生の人山田朝臣なる者、九重に奉仕して此姫を戀ひ慕ひ、名歌の德によつて姫を賜はつて還つて來た云々とあつて、其應酬の和歌といふのは前に擧げた攝陽群談、乃至は京童跡追などに出て居るものと、二首ながら同じである。京から下つた上臈に綾錦を織ることを教へられ、後に其女性を神に祀つたといふだけの口碑ならば、那須の綾姫や信夫の小手御前等、東北には幾らも其例があつて、是にも色々の語りごとを伴なうて居るが、たゞそれには物草太郞同系の求婚譚は無いのであつた。上總國では山武郡千代田村にも、山田といふ部落があつて清瀧姫の御手洗といふ三つの小池と同じやうな口碑とが殘つて居る。むかし孫三郞といふ男が役夫にさゝれて京に上り、或上臈を見染めて戀ひわづらひをした。其事貴人の御耳にとまつて、妻に賜はつて伴なひ還つたのが清瀧姫で、その守佛を本尊にして金光寺といふ寺を建てたことになつて居る。歌は傳はらぬが山田だから一つ話であらう。しかも爰では兵部卿某、京から流されて來て此里に住し、その一子が孫三郞であつたと謂つて、男系の方までも凡人で無かつたことにして居るのである。三つの小池に付いてももう少し話があつたのかも知れぬ。今はたゞベロ井戶の名に呼ばれて、そのやゝ褐色を帶びた涌き水を、口中一切の病にきくと謂つて汲んで行く者があるだけである(山武郡鄕土誌)。それから尙一つ、陸中上閉伊郡の海岸にも山田といふ町があるが、是に因んだ昔話は旣に百八十年も前に、遠野古事記卷一の中に載錄せられて居る。昔諸國より千人夫とて、三年の丁を京に上せ、又一國十人の釆女を奉りし代に、閉伊の山田の左内といふ男が、役夫に選まれて京に上り、官女清瀧を戀して一首の歌を贈る。雨降らで植ゑしさなへも枯れはてん清瀧おちて山田うるほせ女返し
  translation: '……という奇妙な歌だった。中将姫の母は姫の不謹慎さを嫌って追い出したので、男は故郷へ連れ帰り、夫婦になった。山田川の藻淵には、姫が山村の食べ物の乏しさを気の毒に思い、海で採ってきた一房の藻を投げ入れ、それが今でも繁茂しているという（郡誌、千百六十頁）。

    上野国では、山田郡川内村に山田という所があり、ここにも白瀧神社と山田男の伝説を保存している。『山田郡誌』にも記載があるそうだが、私はまだ見ていない。『上州郷土研究』という本の桐生市荒土の項には、白瀧神社の祭神は、この地方の人に機織りの技術を教えた白瀧姫だとある。和銅七年、桐生の人で山田朝臣という者が宮中に仕え、この姫を恋い慕い、名歌の力で姫を賜って帰ってきた、などと書かれている。その贈答歌は、前に挙げた『摂陽群談』や『京童跡追』などにあるものと、二首とも同じである。

    都から下ってきた高貴な女性に綾や錦の織り方を教えられ、後にその女性を神として祭った、というだけの伝承なら、那須の綾姫や信夫の小手御前など、東北にはいくらでも例があり、それにもいろいろな語り物が伴っている。ただ、そこには物草太郎と同じ系統の求婚の話はないのだった。

    上総国では、山武郡千代田村にも山田という集落があり、清瀧姫の御手洗という三つの小池と、同じような言い伝えが残っている。昔、孫三郎という男が労役に徴発されて京都へ上り、ある高貴な女性を見初めて恋の病になった。そのことが貴人のお耳に入り、妻として賜り、連れ帰ったのが清瀧姫で、その持仏を本尊にして金光寺という寺を建てたことになっている。歌は伝わっていないが、山田なのだから同じ話だろう。しかもここでは、兵部卿の何某が京都から流されてこの村に住み、その一人息子が孫三郎だったといって、男の家系まで普通ではなかったことにしている。三つの小池についても、もう少し話があったのかもしれない。今はただ「ベロ井戸」と呼ばれ、少し褐色がかった湧き水を、口の中のあらゆる病気によいといって、汲んでいく人がいるだけである（『山武郡郷土誌』）。

    それからもう一つ、陸中の上閉伊郡の海岸にも山田という町があるが、これにちなむ昔話は、すでに百八十年も前に『遠野古事記』巻一に記録されている。昔、諸国から千人夫といって、三年間勤務する男たちを京都に上らせ、また一国から十人ずつ采女を献上した時代に、閉伊の山田の左内という男が労役の人夫に選ばれて上京し、女官の清瀧を恋して一首の歌を贈った。

    「雨も降らずに植えた早苗は、枯れ果ててしまうだろう。清瀧よ、流れ落ちて、この山田を潤しておくれ」

    女の返歌は、……'
  notes:
  - 冒頭はscan164末尾、末尾の返歌はscan166冒頭に続く。
  - 和銅七年は714年。采女は地方から宮中に奉仕するために出された女性。病気への効能は原文の民間伝承であり、医学的な効能を認定するものではない。

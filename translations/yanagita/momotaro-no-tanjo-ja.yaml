  section: 狼と鍛冶屋の姥
  original: から魔物だ油斷がならぬといふ俗說は、昔話の外にはみ出して、時としては之を信じようとする者さへある。家に飼はれる猫は犬だけの群居性を持たぬにも拘らず、野良猫には往々一處に集まつて居る場合のあることが、以前にも觀察せられたものと見えて、常陸の猫島や肥後の猫岳の如く、彼等の社會が別に隱れてあつたといふ話は、方々に傳はつて居る。故に今日では猫が群を爲して人を襲うたといふことが、餘りにも想像し難いことになつて居らうとも、それだけでは話の發生までを疑ふことは出來ない。事實その通りのことが有つたか無かつたかは、我々の取扱はうとする問題の外であるが、少なくとも猫に對する我々の考へ方は變つて居たのである。あらゆる天然現象の解說が改まつて來た如く、人が曾ては今と全く異なる態度を以て、愛し敬ひ又は忌み怖れて居たものは、獨りこの一種の小動物のみでは無い。狼に就いても亦同樣に、彼等もし記憶あらば今昔の感に堪へぬであらうと思ふ程に、僅かな年代に人間の信用が衰微したのである。是は文獻の側からでもまだ若干の旁證が得られるかと思ふが、狼を支那風に兇猛無比の害敵と視たのは、さう古くからの事では無かつた。以前は畏敬もすれば又信賴もして居て、人と狼との珍らしい交際があつたことは、本篇と關係が有るから是非とも後に述べなければならぬ。動物の歷史の研究がもう少し進んだら、或は此點も明かになるであらうが、彼等の環境も近世に入つて變化して居る。是がもし其習性の上に影響して、人に新たなる經驗を與へ、次第に狼婆の怖ろしい空想を發達せしめたものとすると、產杉傳說は獨り說話分類の上に大切な資料を供するのみならず、兼て自然科學の爲にも興味ある一箇の新目標を立てたことになるのである。狼の群が夜行く旅人を劫かすといふことだけは、少なくとも近代に入つて幾度か實驗せられた現象であつたらう。從うて猫の寄合ひといふ俗信が稍〻廢れて、狼が之に代つて說話の序幕を占めたのは自然である(しかも是と反對に、狼の群の話が東北に行つて、猫に改まつたといふことは想像しにくい)。唯奇妙なのは狼の群の指導者として、猫が招かれて遣つて來たといふことであるが、是も自分は猫ならばさういふ話も有らうと思ふのである。猫と狼とが交を結んだ話はまだ知らぬが、狐とは屢〻一緒になつて遊んだといふ噂が殘つて居る。西田直養翁は九州の學者だが、其隨筆の筱舍漫筆に、或人月夜に猫と狐とが、竝んで踊つて居る
  translation: 'から「魔物だから油断ならない」という俗説は、昔話の枠からはみ出し、ときには信じようとする人さえいる。飼い猫は犬ほどの群居性を持たないにもかかわらず、野良猫がしばしば一か所に集まる場合があることは、以前にも観察されていたらしい。常陸の猫島や肥後の猫岳のように、猫たちの社会が別に隠れて存在したという話は、あちこちに伝わっている。だから今では、猫が群れを作って人を襲ったということがあまりにも想像しにくくなっていたとしても、それだけで話が生まれたことまで疑うわけにはいかない。本当にそのとおりの出来事があったかどうかは、私たちが扱おうとする問題の外にあるが、少なくとも猫に対する私たちの考え方は変わってきたのである。あらゆる自然現象の説明が変化してきたように、人がかつて今とはまったく異なる態度で愛し、敬い、あるいは忌み恐れていたものは、この一種類の小動物だけではない。狼についても同じで、もし彼らに記憶があれば昔と今の違いに感慨を抑えられないだろうと思うほど、短い年月で人間からの信用が衰えた。これには文献の側からもいくらか補助的な証拠が得られると思うが、狼を中国風に、比類なく凶暴な害敵とみなしたのは、それほど古くからのことではなかった。以前は畏敬するとともに信頼してもおり、人と狼の珍しい交わりがあったことは、本篇と関係があるので、後でぜひ述べなければならない。

    動物の歴史の研究がもう少し進めば、この点も明らかになるかもしれないが、狼の環境も近世に入って変わっている。もしそれが習性に影響して人々に新たな経験を与え、しだいに狼婆という恐ろしい空想を発達させたのだとすれば、産杉伝説は説話分類の重要な資料になるだけでなく、自然科学にとっても興味深い新たな研究対象を提示することになる。

    狼の群れが夜道を行く旅人を脅かすということだけは、少なくとも近代に入って何度か実際に経験された現象だっただろう。したがって、猫の寄り合いという俗信がやや廃れ、代わって狼が説話の冒頭を占めたのは自然である（それとは逆に、狼の群れの話が東北へ行って猫に変わったとは想像しにくい）。ただ奇妙なのは、狼の群れの指導者として猫が招かれて来たという点だが、これも私は、猫ならそういう話もあるだろうと思う。猫と狼が交わった話はまだ知らないが、狐とはしばしば一緒に遊んだといううわさが残っている。西田直養翁は九州の学者だが、その随筆『筱舎漫筆』には、ある人が月夜に猫と狐が並んで踊っている'
  notes:
  - 原文の「支那」は歴史的な中国の呼称であり、訳では「中国」とした。狼に対する中国風の見方という説明は著者の見解。

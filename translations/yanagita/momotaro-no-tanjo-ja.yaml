  section: 隣の寝太郎／山田の露
  original: へて居るものも、旣に萬葉集、一六の注記がある以上は假托であつた。さうして又斯ういふ古歌の存在に基づいて、新たに結構せられさうな說話でも無かつたのである。ところが諸國の山田白瀧話に於ては、攝津の丹生山田の栗花落家傳を始として、姫が水鏡を見て身の衰へを歎き、或は身を投げて死んだといふ泉の跡が、往々にして是と伴なうて居るのである。さうすると今は二つが別々のものになつて居るが、曾ては斯んな物悲しい結末をもつた「長者の聟」說話も出來て居た時代が有るので、それが第二の名歌譚の附添はつてから後まで、尙消えきらずに殘つて居て、偶然にその系統と沿革とを、我々に暗示してくれるのかも知れない。昔話が和歌を中心として記錄せられる結果、一度この部分に改作が行はれると、話全體が大きな變化を受けることは、至つて普通なる我々の經驗であるが、それが幸ひにしてこの山田白瀧の如く、新舊重なり合つて數多く分布して居る場合には、尙斯ういふ中からでも前代を貫通した一つの要點を、見つけ出すことが不可能では無いのであつた。第二に注意せられるのは、この幸運又は多智なる聟がねの說話が、國の全土に流布しようとした勢力、殊に些しでも所緣の有る處には、必ず土着して傳說と化せんとした傾向である。單にこの一話が著名であり、もしくは人望があつたといふ事實だけでは、是を我土地の昔の史實だつたと信ずるに至つた理由を解說するにはまだ足りない。今一步以前の狀態に遡つて考へて見なければ、人が此樣な口碑を尊重し始めた動機は尋ね難いのであるが、それには何よりも事件の中心であつたといふ家筋を、明かにする必要があるかと思ふ。山田は我邦では至つて有りふれた地名であるにも拘はらず、其名の土地があれば多くはこの昔話を過去の歷史の如く語り傳へて居る。それが私などには家の祖先を高貴ならしめたいといふ要望が先づ存して、流布の物語は是に供與せられたる一つの便宜であつたとしか解せられぬのである。現在知られて居る二三の例を擧げるならば、能登では鳳至郡鵜川村に山田といふ山中の部落があつて、そこを流るゝ山田川の邊には、藻淵·產田·若宮神社等の舊跡があつた。むかし三田の四郞右衞門といふ者、京に上つて禁裡の御庭掃きを勤め、掃除いとまある時には箒を持つて踊つた。それを姫君が簾の中から見て、田舎の黑鳥と嘲けつたところが、卽座に四郞右衞門一首の歌を詠んだ。それは羽根うちそろへてたつ時は中將姫も下に見る
  translation: '……いるものも、すでに『万葉集』巻十六に注記がある以上、後からその人物に結びつけたものだった。そして、このような古歌があることをもとに、新しく組み立てられそうな説話でもなかった。ところが各地の山田白瀧の話には、摂津の丹生山田にある栗花落家の伝承をはじめとして、姫が水鏡を見て自分の衰えを嘆き、あるいは身を投げて死んだという泉の跡が、しばしば伴っている。そうすると、今は二つが別々になっているが、かつては、こうした物悲しい結末を持つ「長者の婿」の説話ができていた時代もあるのだろう。それが第二の、名歌にまつわる話が付け加わった後まで、消えきらずに残り、偶然、その系統と変遷を私たちに示してくれるのかもしれない。

    昔話が和歌を中心に記録されると、その部分が一度作り変えられれば、話全体が大きく変わってしまう。これは私たちがごく普通に経験することである。しかし、幸いこの山田白瀧のように、新旧の話が重なり合い、数多く分布している場合には、こうした中からも、以前の時代を通じて一貫した一つの要点を見つけ出すことが、不可能ではなかったのである。

    第二に注目されるのは、この幸運な、あるいは知恵に富む婿候補の説話が、全国に広まろうとした勢い、とくに少しでもゆかりのある場所には、必ず根づいて伝説になろうとした傾向である。この一話が単に有名だった、人気があったというだけでは、それを自分たちの土地の昔の史実だったと信じるに至った理由を説明するには、まだ足りない。もう一歩前の状態にさかのぼって考えなければ、人がこうした言い伝えを尊重し始めた動機は探りにくい。そのためには何よりも、事件の中心だったという家筋を明らかにする必要があるのではないかと思う。「山田」は日本ではごくありふれた地名なのに、その名の土地では、多くがこの昔話を過去の歴史のように伝えている。私にはこれは、まず自分の家の祖先を高貴なものにしたいという願望があり、広まっていた物語は、それに役立つ一つの手段として提供された、としか理解できないのである。

    現在知られている二、三の例を挙げよう。能登では、鳳至郡鵜川村に山田という山中の集落があり、そこを流れる山田川のほとりには、藻淵・産田・若宮神社などの旧跡があった。昔、三田の四郎右衛門という者が京都へ上り、宮中の庭掃除を務め、掃除の暇があると箒を持って踊った。姫君が簾の中からそれを見て、「田舎の黒鳥」とあざけると、四郎右衛門はすぐに一首詠んだ。それは、

    「羽をきちんとそろえて飛び立てば、中将姫をも下に見る」

    ……'

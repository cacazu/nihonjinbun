- id: mmt-111-01
  scan: 111
  section: 瓜子織姫／黃金の瓜
  original: '訊ね、始めて母と子の生ひ立ちを聞しめされた。東海の小島の外夷孩童、此まゝ宮中に留め

    んも如何なり、暫らく歸つて時節を待つべしとあつて、一旦久高の家に戾つて居たが、後に

    國王に世子無きによつて、封じて世子と爲し王の位を嗣ぐことになつた。それよりして代々

    の聖主、二年每に一度この久高の島に御幸あり、且つ年に一次は外間の根人及び祝女、御仲

    門より進み入つて恭しく魚類數品を獻ずれば、祝女は內院に召し入れられて宴を賜ひ、且つ

    葉茶葉煙草を授けらる。根人にも御玉貫一雙を下し賜はるが例となつて居た。康熈庚子の年

    より其獻物を裁し去るとあれば、卽ち西洋の十八世紀初までに、旣に斯ういふ言ひ傳へが生

    れて居たのであつた(遺老說傳卷二、原漢文)。

    以上七つの話が本來は一箇の說話であつたことは、先づ何人も之を否むことは出來まい、

    さうして其變遷の何れが早く、何れが後であつたかも、さう多分の辨證は必要で無く、從うて

    其分布傳播の經路も、大よそは之によつて跡づけられるかと思ふ。但し大正十年春の朝日新

    聞に、私が「久高の屁」といふ一文を書いてしまふ迄は、別に同樣の例が內地にも有ることを、

    實はまだ一つも知らなかつたのである。しかも今日になつても尙この最後の沖繩の一例は、

    他には見られない幾つかの特色あることを指點し得られる。其一つは是が文籍に保存せられ

    た、恐らく最古の資料であらうといふことである。第二には之を採錄した人の心持が、少し

    でも其內容を疑はず、所謂正史の闕けたるを補ふものとして、出來るだけ合理的に之を解釋

    せしめようとして居たことである。第三には少なくとも久高の島人には、是は純然たる傳說

    であつて說話で無かつた。以前この由緒を申立てて王廷の優遇を受けて居た外間根人は、今

    でも久高の名門であつて、其家には思金松兼王子の產殿を保存する外に、なほ母思樽の白絹

    の下の袴を、什寶として持傳へて居るさうである。

    我々の問題は斯程まで世に弘く行はれて居る一箇の說話、それも明かに中世の文飾によつ

    て、やゝ興味新らしく改造せられたものが、如何にして爰ばかりではいと眞面目に信じられ

    て居たらうかといふことであるが、それを說明する途はたつた一つ、卽ち神話も亦旣に片端

    は成長するものであつて、其成長に參與した外部の力には、たとへば屁の理窟の如く一時風

    を爲し、弘く國內を周流するものがあつたといふことである。他の側面からいふと、久高の

    小島には屁の挿話の輸入せられる以前より、是と接合し得る樣な一種の古傳があつて、前者'
  translation: '尋ね、初めて母子の来歴をお聞きになった。「東の海の小島の、辺境の民である幼い子を、このまま宮中にとどめるのもどうか。ひとまず帰り、時期を待つがよい」と言われ、いったん久高の家へ帰っていた。のちに国王に世継ぎがいなかったため、世子に定められ、王位を継ぐことになった。それ以来、代々の王は二年に一度、久高島へ行幸する。また、年に一度、外間の根人と祝女が御仲門から進み入り、うやうやしく数種類の魚を献上すると、祝女は宮中の奥へ召し入れられ、宴を賜り、さらに葉茶と葉煙草を与えられる。根人にも御玉貫一対が下されるのが慣例だった。康熙の庚子の年から献上品を取りやめた、とあるので、西暦の十八世紀初めまでには、すでにこのような言い伝えが生まれていたのである（『遺老説伝』巻二、原文は漢文）。

    以上七つの話が、もとは一つの説話だったことは、まず誰も否定できないだろう。また、その変化のどれが先でどれが後だったかについても、それほど多くの論証は必要でなく、したがって、分布し伝わっていった道筋も、おおむねこれによって跡づけられるのではないかと思う。ただし、大正十年の春の『朝日新聞』に、私が「久高の屁」という文章を書くまでは、同じような例が沖縄以外の国内にもあることを、実は一つも知らなかった。

    しかも今なお、この最後の沖縄の例には、ほかに見られない特色をいくつか指摘できる。一つ目は、書物に残されたものとしては、おそらく最古の資料だということ。二つ目は、採録した人が内容を少しも疑わず、いわゆる正史の欠落を補うものとして、できるだけ合理的に解釈させようとしたこと。三つ目は、少なくとも久高島の人々にとって、これは純然たる伝説であって、単なる説話ではなかったことである。以前、この由緒を申し立てて王廷の優遇を受けていた外間根人は、今でも久高の名家で、その家には思金松兼王子の産所が保存されているほか、母の思樽の白絹の下袴も、家の宝として伝え持っているそうだ。

    私たちが考えるべき問題は、これほど世に広く行われている一つの説話、それも明らかに中世の脚色によって少し新しい面白さを加えられたものが、どうしてここだけでは、これほど真剣に信じられていたのか、ということである。その説明は一つしかない。神話もまた、すでに一方では成長しているのであり、その成長に関わる外からの力には、たとえばおならをめぐる理屈のように、一時流行して広く国内を巡るものがあったということだ。別の側面からいえば、久高という小島には、おならの挿話が入ってくる前から、それと結びつくことのできる古い伝承があった。おならの話の方'
  notes:
  - 冒頭はscan110、末尾はscan112へ続く。
  - 「外夷」は原記録中の王廷を中心とした周辺地域の人々の呼称であり、訳ではその視点を明示した。
  - 祝女（ノロ）は琉球の女性祭司。御玉貫は宮廷から下賜される品の名称として残した。
  - 「内地」は原文執筆時の呼称。ここでは沖縄以外の日本国内を指す。

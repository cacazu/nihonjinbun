  section: 瓜子織姫／四 申し兒の靈驗
  original: 獨り瓜子姫の一例には限らないが、遠い昔話の童話と化して行く過程には、未だ氣づかれざる信仰の衰頽といふものがあつた。是を具體的にいふと、童話では「そんな事があるものか」といふことが實現するので、聽衆は寧ろ其突然に笑ひ興ずるのであるが、ずつと以前には其奇跡が豫期せられ、又信じられて居たのである。卽ち特定の方法に依り、若しくは特定の條件を具へた人のみが、さういふ不思議に出逢ふのだといふ解釋が、昔話を發生せしめたのであつた。其信仰が衰へて、次第に其部分には力を入れて說かぬやうになつたのである。併し幾ら衰へても、曾てあつたものならば痕跡はどこかに殘つて居る。蛇に見入られて子を產んだといふ類の話なども、人は之を願はないばかりか、後には忌み怖れて避けた筈であるが、それでも其女は必ず美女であり、舊家の娘であり又色々の前兆があつたやうに語られて居る。瓜子姫·桃太郞も是と同じことで、今日子供等が驚いて眼を圓くするやうな意外な出來事になつて後まで、尙どこかの隅つこに幽かなる「さも有りなん」の破片が、こびり附いて殘つて居るのである。第一に其爺婆の善人であること、殊に兒の無いことを唯一つの苦勞にして居る處へ、拾はれて來て育てられるといふことは、恐らく此種の民譚の最初の要件であつたらうと思ふ。此部分は石見の例の如く、單に大喜びで大事に育てたといふだけに代つたものも多いが、中には和賀郡(一)や、日向(九)の例の通りに、ちやうど子供が無くて一人欲しいと思つて居た處だと言つて、一生懸命になつて可愛がつたといふのが多く、これが又桃太郞の方でも屢
  translation: '瓜子姫だけに限ったことではないが、遠い昔の話が子供向けの童話へ変わっていく過程には、まだ気づかれていない、信仰の衰えがあった。具体的にいえば、童話では「そんなことがあるものか」と思うことが実現するので、聞き手は、むしろその唐突さを笑い、おもしろがる。ところが、ずっと以前には、その奇跡は予期され、信じられていたのである。つまり、特定の方法を用いるか、または特定の条件を備えた人だけが、そうした不思議に出会うのだという解釈が、昔話を生み出した。その信仰が衰え、次第にその部分を強調して語らなくなったのである。

    しかし、どれほど衰えても、かつて存在したものなら、痕跡はどこかに残っている。蛇に見入られて子を生んだというような話も、人々はそれを願わないばかりか、後には忌み恐れて避けたはずだが、それでも、その女は必ず美女であり、旧家の娘であり、さまざまな前兆もあったように語られる。瓜子姫・桃太郎も同じである。今日の子供たちが目を丸くするような意外な出来事となった後まで、どこかの片隅に、「いかにもありそうだ」という感覚のかすかな断片が、こびりついて残っている。

    まず、爺婆が善人であり、とりわけ、子供のいないことだけを悩んでいるところへ、子が拾われてきて育てられるというのは、おそらく、この種の説話の最初の条件だったと思う。

    この部分は、石見の例のように、単に大喜びして大切に育てたというだけに変わった話も多い。しかし、和賀郡（一）や日向（九）の例のように、ちょうど子供がいなくて一人欲しいと思っていたところだと言って、一生懸命かわいがったとする話も多い。そして、このことは桃太郎でも、しば'

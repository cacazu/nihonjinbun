  section: 米倉法師／七 狼と座頭
  original: ら座頭の坊になつたといふなどは、その座頭の坊で無ければ何としても言はれぬことであつた。人はよく惡口に彼等の眼をとちまなこなどとは言つたが、此比較などは格別當つても居なかつたのである。鈴木正三の驢鞍橋に載せられた昔話で、私が日本昔話集の上卷に採錄したものなども是と近い。それをもう一度略述すると、昔一人の盲法師が、山中に迷うて山の神の樹の下に野宿し、夜すがら琵琶を彈いて山神に供養をした。さうすると色々の御馳走が出る。朝になると獵人が一人現はれて、里まで送つて進ぜるから此靱に取附きたまへといふ。そこで其毛靱をしかと捉へて案内せられて麓まで來ると、それを里の童が見つけてロ々に、あれ〳〵あの坊樣は狼の尻尾を持つて、引張られて來るとわめいたので、狼は急いで遁げて行き、自分は里の金持の家に行つて、昨夜からの奇瑞を語り合うた。山の神が座頭の琵琶を賞翫した餘りに、眷族の狼に命じて送らせたのであつた。とあるが、是も亦我々ならば思ひ付かぬ趣向であつた。座頭は稀に毛の靱を手に取つて見たことは有るか知らぬが、狼の尻尾だけは觸れたことも無かつたらう。それを人から先づ靱のやうなものだと聞かされて、早速に斯んな一話を考へ出したものかと思はれる。しかも此話などには棄てられないユーモアがあつた。どうせ我々は盲が正の事のみを語るとは思はぬから、彼の話によつて狼と盲人とが、尻尾で繋がつて山から下りて來る光景を、胸に描いて見たことを感謝したのである。故にもし是が靱と狼の尻尾との類似といふ知識に基づいて、新たに此一話を考へ出したものであつたならば、盲人の創意はよほど高く評價してよかつたのであるが、奈何せんそれは唯ほんの此部分だけの改作であつて、前から同系統の說話は可なり弘く流布して居たのだつた。その最初の形も尋ねて居たら今に判らうと思ふが、先づ手近に之と似通うたものが因伯童話には出て居る。因幡國八頭郡池田村の盲人國都、京に上らうとして若櫻の豹山にさしかかり、山中の芝原に野宿して琵琶を彈いて居ると、向ふの山に聲あつて之を褒め、又一曲と高野の卷を所望した。それから一人の老翁が現はれて來て、馬を牽かせて播州の方へ送らせてくれる。播州の戶倉といふ村で夜が明けると、路傍の子供が集まつて來て、あれを見よ、盲が狼に乘つて來た。狐が口を取つて居ると大聲に騒ぐ。それを聞いて馬は國都を振落し、
  translation: '〔前のスキャンから続く〕座頭の坊になった、というような話は、その座頭の坊でなければ、どうしても言えないことだった。人はよく悪口として彼らの目を「とちまなこ」などと呼んだが、このたとえはとくに当たってもいなかったのである。鈴木正三の『驢鞍橋』に載っていて、私が『日本昔話集』上巻に採録した昔話なども、これに近い。もう一度簡単に述べると、次のようになる。

    「昔、一人の目の見えない法師が山中で道に迷い、山の神の木の下で野宿し、一晩中琵琶を弾いて山の神に供養した。すると、いろいろな御馳走が出てきた。朝になると猟師が一人現れ、『里まで送って差し上げるから、この靫につかまりなさい』と言った。そこで、その毛皮の靫をしっかりつかみ、案内されて麓まで来た。すると村の子どもが見つけ、口々に『あれ、あれ、あの坊様は狼の尻尾を持って、引っ張られて来る』と叫んだので、狼は急いで逃げていった。自分は里の金持ちの家へ行き、昨夜からの不思議なめでたい出来事を語り合った。山の神が座頭の琵琶を非常に気に入り、配下の狼に命じて送らせたのだった。」

    とあるが、これもまた、私たちでは思いつかない趣向だった。座頭は、まれに毛皮の靫を手に取ってみたことはあるかもしれないが、狼の尻尾には触れたこともなかっただろう。それを人から、まず靫のようなものだと聞かされ、早速このような話を思いついたのかと考えられる。しかも、この話などには捨てがたいユーモアがあった。どうせ私たちは、目の見えない語り手が本当のことだけを話すとは思わないのだから、その話によって、狼と目の見えない人が尻尾でつながり、山から下りてくる光景を心に描けたことに感謝したのである。

    だから、もし靫と狼の尻尾とが似ているという知識に基づいて、この一話を新たに思いついたのなら、目の見えない人の創意は、ずいぶん高く評価してよかった。しかし残念ながら、それはほんのこの部分だけの改作であり、以前から同系統の説話が、かなり広く伝わっていたのだった。その最初の形も、尋ねていればやがてわかるだろうと思うが、まず手近なところでは、『因伯童話』にこれと似たものが出ている。

    因幡国八頭郡池田村の目の見えない国都が、京都へ上ろうとして若桜の氷ノ山にさしかかり、山中の芝原で野宿して琵琶を弾いていると、向こうの山から声がして褒め、もう一曲と「高野」の巻を所望した。それから一人の老人が現れ、馬を引かせて播州のほうへ送ってくれた。播州の戸倉という村で夜が明けると、道端の子どもが集まってきて、「あれを見ろ、目の見えない人が狼に乗って来た。狐が手綱を取っている」と大声で騒いだ。それを聞くと馬は国都を振り落とし、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン279）と本文OCRを照合。
  - 靫（うつぼ）は矢を入れて背負う武具。「とちまなこ」は差別的なたとえとして著者が取り上げる語。地名「豹山」に「へうのせん」の振り仮名を確認し、現代語訳では氷ノ山と表記。
  - 原文の歴史的差別語は文脈を保持し、通常は「目の見えない人」等と訳した。障害者の性質を一括りにする評価は著者の当時の見解であり、現代の事実認定ではない。

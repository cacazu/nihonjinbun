  original: 實演さへ有つたのかも知れぬ。それをほゞ順序立てて狂言の番組の中へ、挿し加へることになつたといふに過ぎぬ樣である。人も有らうに斯んな痛いけな片輪者の所業を、三百年も四百年も連綿として、目のある我々が模倣をして來たなどといふことは、智慧の無い話の行止まりであつた。斯んな重苦しい又不人情な道化話よりは、寧ろ是に盲從して居た文人の意氣地無さの方が、よつぽど可笑味に富んで居るやうに、私たちには感じられるのである。其上に我々は又時として眞似そこなひをして居たと思はれる。たとへば豐後の吉右衞門咄といふのは、或一人の吉右衞門といふおどけ者をフレエムにして、やたらに古今の笑話を寄せ集めた無記錄の說話集であるが、其中にも吉右が按摩をからかつたといふ話があり、是とよく似たものは他の地方にも折々は傳はつて居るらしい。其趣向といふのは向ふから多勢の盲が竝んで來るのを見かけて、竝木の松の枝に棒をぶら下げて置くと、それが一人一人の頭を打つて、彼等は仲間の者の所爲と誤解し、怒つて互ひに喧嘩をするといふだけの筋であるが、是なども元は此樣な簡單なもので無かつた。人がその滑稽の眞の味を解し難くなつて、たゞ其中の最も下品な騷々しい部分だけを取傳へたのである。萬治元年に刊行せられた百物語卷下には、次のやうな一章がある。或人座頭を好きて、每夜五人十人呼寄せ長遊びをしけるに、下部ども腹を立て、何とぞ座頭どもに當りて、來ぬ樣にと巧みて、門の口に橫槌をつりて頭を打たする樣にからくみ置きしに、案の如く座頭來て頭をしたゝかに打つ。めいよ意地惡しき者なれば、又あとに來る座頭に斯くと言はず、座頭八人來て八人ながら物言はず、皆かしらの割れる程打ちける。おのれ一人打ちては口をしと思ひける心何れもあり。さるほどに例の長遊びして還る時、下部ども言ひけるは、さても夜更けて候。座頭の坊なん時ぞと言へば、我等來たりし時八つがしらを打ちしまひたり。はや明け候はんと言ひける。すね者なりとぞ。卽ち此書は旣に傳聞の形を保存して居るのであつて、是も最初の話し手は亦座頭であつたらうと思ふ。座頭は生得意地惡しき者、又はすね者だといふことも、恐らくは彼等自身の言ひ立てたことで、斯ういふ誠に微弱なる反抗を試みつゝも、尙豫めそれを相手に斷つて置かねばならなかつた所に、考へて見れば心細い彼等の職業意識があつた。心の底からの樂しい笑を以て、自然に聽く人を同化せしめ得ず、彼等の滑稽譚がいつでも念の入り過ぎた稍。あく
  translation: '〔前のスキャンから続く〕実演まであったのかもしれない。それをおおよそ筋立てて、狂言の演目の中へ加えることになっただけのようである。ほかにも人はあろうに、このようないたましい、障害のある者の仕業を、三百年も四百年も絶えず、目の見える私たちがまねてきたなどというのは、知恵のなさの極みだった。このような重苦しく人情に乏しい道化話より、むしろこれに盲従してきた文人の意気地なさのほうが、ずっとおかしみに富んでいるように、私たちには感じられる。

    そのうえ私たちは、ときにはまねそこなってもいたと思われる。たとえば豊後の「吉右衛門咄」は、吉右衛門という一人のおどけ者を枠にして、古今の笑い話をやたらに寄せ集めた、書かれない説話集である。その中にも吉右が按摩をからかったという話があり、これとよく似たものは、他の地方にもときどき伝わっているらしい。その趣向は、向こうから大勢の目の見えない人が並んで来るのを見て、並木の松の枝に棒をつり下げておくと、それが一人一人の頭に当たり、彼らは仲間の仕業だと誤解して、怒って互いに喧嘩する、というだけの筋である。しかし、これなども、もとはこれほど単純なものではなかった。人々がその滑稽の本当の味を理解しにくくなり、ただその中の最も下品で騒々しい部分だけを伝えたのである。万治元年に出版された『百物語』巻下には、次のような一章がある。

    「ある人が座頭を好み、毎晩五人、十人と呼び寄せて長々と遊んだので、召使いたちは腹を立てた。何とか座頭たちをひどい目に遭わせ、来なくなるようにしようと工夫して、門口に横槌をつるし、頭に当たる仕掛けをした。案の定、座頭が来て頭を強く打った。たいそう意地の悪い者だったので、後から来る座頭にも事情を知らせず、八人の座頭が来て八人とも何も言わず、皆、頭が割れるほど打った。自分一人が打たれては悔しいと思う心が、誰にもあったのである。さて、いつもの長遊びをして帰るとき、召使いたちが『ずいぶん夜が更けましたね。座頭のお坊様、今何時でしょう』と尋ねると、『私たちが来たときに、八つ頭を打ち終えました。もう夜が明けるでしょう』と答えた。ひねくれ者だという。」

    つまりこの本は、すでに人から聞いた話という形を保っており、これも最初の語り手は座頭だっただろうと思う。座頭は生まれつき意地が悪いとか、ひねくれ者だとかいうことも、おそらく彼ら自身が言い立てたことだった。このような実にかすかな反抗を試みながらも、あらかじめ相手に断っておかなければならなかったところに、考えてみれば、心細い彼らの職業意識があった。心の底からの楽しい笑いによって、自然に聞き手を同じ気持ちに引き込めず、彼らの滑稽な話が、いつも念を入れすぎた、少しあくどい、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン271）と本文OCRを照合。
  - 原文「片輪者」は障害者への歴史的差別語。「八つがしら」は八人の頭と、時刻の八つ時の初めをいう「八つ頭」の掛詞。引用の「めいよ」は、程度がはなはだしい意として訳した。
  - 原文の歴史的差別語は文脈を保持し、通常は「目の見えない人」等と訳した。障害者の性質を一括りにする評価は著者の当時の見解であり、現代の事実認定ではない。

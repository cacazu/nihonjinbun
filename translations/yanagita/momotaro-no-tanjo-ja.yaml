  section: 絵姿女房／七 殿様の無理難題
  original: 'しまつたのだらうと言ふ說も起りさうである。それは隨分例もあることで、頭から否認して

    かゝるわけにも行かぬが、我々の繪姿女房說話と舞の本の眞野長者との一致は、もう少し前

    の方まで進出して居るのである。長者はたつた一人の娘を奉ることを惜しんで、御辭退を申

    上げると、其儀ならば今日一日のうちに芥子の種を一萬石獻上すべし、それが出來なければ

    娘を參らせよとの嚴命がある。是には少しばかり當惑をして居たところが、長者の女房が側

    から、それは私が何かの用もあらうかと乾の隅に萱の倉を建てて、年々の芥子の種を取集め

    て置きました。それが十萬石ばかりはあらうと思ひますと言ふので、早速其中から一萬石の

    芥子を積出して、折角の難題が造作も無く解決したとある。是と榊木君の報告せられた、肥

    前小濱の龍宮の花嫁の話とは、明白に同じものであつたのである。

    但し後者に於てはその殿樣の難題といふものが、もう笑話の中に足を踏入れて居る。肥前

    の殿樣の方では、一石六斗の小鳥を明日までに持參せよ。それが出來ぬやうなら女房を取る

    と仰せられる。左樣な無體な御注文が爲し遂げられるであらうかと、非常に心痛をして家に

    歸つて來ると、女房はそれを聞いてそんなことは何でも無いと、次の日は二羽の鳩を夫に持

    たせて、はい鳩(八斗)が二つで一石六斗の鳥を持參致しましたと言はせる。是には殿樣一言

    も無く、今度はヒユーヒユードンドン袖かぶる、エイヤハツチ、ヤレタマランといふ物を明

    日までに持參致せ。それが出來なければ女房を出せとある。是も女房が心配するに及ばぬ。

    私が龍宮に行つて持つて來ると言つて、翌朝何かは知らず三つの箱を亭主に渡す。それを殿

    樣の前へ持出して順々に蓋を開くと、一の箱からは小人が出て來て、笛を吹き太鼓を叩く。

    是が卽ちヒユーヒユードンドン。第二の箱からは無數の蜂が飛出して、居合はす人々を刺さ

    うとするから袖かぶる。第三の箱からは劍を拔いて、又多くの小人が出て、エイヤハツチと

    切つてかゝる。ヤレタマランと遁げまはるうちに、殿樣も斬られて、もう難題を以て夫婦を

    苦しめる者が無くなつたといふのである。

    此類の頓智機智は、今では豐後の吉右衛門といふやうな人の、逸話として傳へられるのが

    普通であり、或は和尙と小僧との問答となつて殘つて居るだけである。佐々木君の老媼夜譚

    第四五話にも、和尙が下男に向つて一石六斗の鳥と、十里の魚と天目の錦の酒とを買つて來

    いといひ付けると、鳩を二羽にゴリといふ小魚を二尾、瓢簞に入れた濁り酒(此わけは不明)を'
  translation: 'しまったのだろう、という説も出そうである。それは十分に例のあることなので、初めから否定するわけにはいかない。しかし、私たちが扱っている絵姿女房の説話と、舞の本の真野長者の話との一致は、さらに少し先まで及んでいる。

    長者は、たった一人の娘を差し上げるのを惜しみ、辞退を申し上げた。すると、「それなら今日一日のうちに、芥子の種を一万石献上せよ。それができなければ、娘を参らせよ」との厳しい命令があった。少し困っていると、長者の妻がそばから、「それなら、何かの役にも立つかと思って、西北の隅に萱の倉を建て、毎年の芥子の種を集めておきました。それが十万石ほどはあると思います」と言う。そこで、さっそくその中から一万石の芥子を積み出し、せっかくの難題も、造作なく解決したという。これと、榊木君が報告した肥前小浜の竜宮の花嫁の話とは、明らかに同じものだったのである。

    ただし、後者では、その殿様の難題というものが、すでに笑い話の領域に入っている。肥前の殿様は、「一石六斗の小鳥を明日までに持ってこい。それができないなら妻をもらう」と言う。このような無理な注文が果たせるだろうかと、男がひどく思い悩んで家へ帰ってくると、妻はそれを聞いて、そんなことは何でもないと言い、翌日、二羽の鳩を夫に持たせ、「はい、鳩（八斗）が二つで、一石六斗の鳥を持参しました」と言わせる。

    これには殿様も何も言えない。今度は、「ヒューヒュードンドン、袖かぶる、エイヤハッチ、ヤレタマランというものを、明日までに持ってこい。それができなければ妻を差し出せ」と言う。これも妻は、「心配しなくてよい。私が竜宮へ行って持ってきます」と言い、翌朝、中身は分からないが、三つの箱を夫に渡す。

    それを殿様の前へ持ち出し、順にふたを開けると、第一の箱から小人が出てきて、笛を吹き、太鼓をたたく。これがヒューヒュードンドンである。第二の箱からは無数の蜂が飛び出し、その場にいる人々を刺そうとするので、みな袖をかぶる。第三の箱からは、また多くの小人が剣を抜いて出てきて、エイヤハッチと切りかかる。「やれ、たまらん」と逃げ回るうちに殿様も斬られてしまい、もう難題で夫婦を苦しめる者はいなくなった、というのである。

    この種のとんちや機知は、今では豊後の吉右衛門というような人の逸話として伝えられるのが普通で、あるいは和尚と小僧の問答として残っているだけである。佐々木君の『老媼夜譚』第四五話にも、和尚が下男に「一石六斗の鳥と、十里の魚と、天目の錦の酒を買ってこい」と命じると、鳩を二羽、ゴリという小魚を二尾、瓢簞に入れた濁り酒（このわけは不明）を'
  notes:
  - 冒頭はscan185から、末尾はscan187に続く。
  - 一石は十斗。「鳩／八斗」「ゴリ／五里」の語呂合わせ。「天目の錦」と濁り酒の対応は原著も不明としている。

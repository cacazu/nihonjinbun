  original: つたのは、話術の進歩でもあれば經驗の增加でもあつた。或は曾我兄弟の物語などが、斯ういふ長たらしい復仇計畫の期間を、普通のことのやうに考へさせることになつたのかも知れぬ。一つのよい例は全國のどこにもある「山姥と牛方」の昔話であつた。山の峠で非常に苦しめられた牛方が、里に遁げ下つて山姥の家に忍び込み、其晩にすぐに騙して相手を退治してしまふといふことは、考へて見ると出來さうにも無い話であるが、さういふ話し方は一般に久しく行はれて居た。ところが是も亦いつの間にか、小さな孤兒が後日に敵を討つたと謂つて、復仇は漸く二代がかりにならうとして居たのである。是には別に然るべき理由のあることで、もし此變遷をも考へずに强ひて國際の比較を試みようとすれば、をかしな結論に陷るべきことは桃太郞の桃も同じであつたらう。だから標準御伽の現在ある形を以て、古來唯一つの正しいものと見ることは止めなければならぬ。其前に今少しく各府縣の異なる形の、如何にして發生したかを考へて見る必要があるやうである。近頃になつて丸で無視せられてしまつたのは、昔話の英雄の異常なる出現、卽ち只の女の腹からは生れなかつたことと、同時にその普通で無い成長のし方であるが、人が昔話は作り事、どうせ有りもせぬことをいふのだと思ふやうになつて、却つて此要件には重きを置かぬ結果を見た。しかも前代の常識に於ては、是ほど人を感動させることは無かつたので、或一人の童子が誰にも豫期し得ぬやうな難事業に成功したとすれば、それは必ず生れから違つて居たらうと思ひ、もしくはそれと反對に、不思議の誕生をする位な人間だから、鬼が島の寶でも取つて來られたのだと解する風が、我々の祖先には行渡つて居た。從うて蟹や雀の大勝利といふ話が、曾ては發端に於て桃太郞とよく似て居たとしても、必ずしも奇怪で無く又混亂でも無かつたと思ふ。其上に人が時があつて異類に轉身し、もしくは鳥獸草木の姿を具へつゝも、人と同じく思惟し咏歎し得たといふことも、極めて有りふれたる上代人の考へ方であつた。桃や瓜の中からでさへ生れると認められた者が、暫らくは小蛇小犬の形を以て我々の間に居たとしても、それだけが特に不可思議といふ程でも無かつたのである。だからこの所謂五大噺の相互の類似なども、事によるとそれが或一つの根幹から、岐れて變化して行つた經路を暗示する、偶然の痕跡であるかも知れぬと私などは思つて居る。但しそれを言ひ切る爲には、もつと多くの材料の集まつて來る時を待たなければならぬの
  translation: '……たのは、話術の進歩でもあり、経験が増えたためでもあった。あるいは曽我兄弟の物語などが、こうした長々とした復讐計画の期間を、普通のことのように思わせるようになったのかもしれない。一つのよい例は、全国どこにでもある「山姥と牛方」の昔話である。山の峠でひどく苦しめられた牛方が、里へ逃げ下って山姥の家に忍び込み、その晩すぐにだまして相手を退治してしまうというのは、考えてみるとできそうにもない話だが、そうした語り方が一般に長く行われていた。ところがこれも、いつの間にか小さな孤児が後に仇を討ったという話になり、復讐は次第に二代がかりになろうとしていたのである。

    これには、別にそれなりの理由がある。もしこの変遷を考えず、無理に国際的な比較をしようとすれば、おかしな結論に陥るはずだという点は、桃太郎の桃でも同じだっただろう。だから、標準的なおとぎ話の現在の形を、昔から唯一の正しいものだと見ることは、やめなければならない。

    その前に、もう少し各府県の異なる形がどのように生まれたのかを、考える必要があるようだ。近ごろまったく無視されてしまったのは、昔話の英雄の異常な現れ方、つまり普通の女の腹からは生まれなかったことと、その成長の仕方も普通ではなかったということである。人々が、昔話は作り話で、どうせありもしないことをいうのだと思うようになり、かえって、この重要な条件を重視しない結果になった。ところが昔の常識では、これほど人を感動させるものはなかった。ある一人の子どもが、誰も予想しなかったような難事業に成功したなら、その子は必ず生まれから違っていたのだろうと思う。あるいは逆に、不思議な生まれ方をするほどの人間だから、鬼が島の宝でも取ってこられたのだと考える。そのような見方が、私たちの祖先には行き渡っていた。したがって、蟹や雀の大勝利の話が、かつては始まりのところで桃太郎によく似ていたとしても、必ずしも奇怪でも、混乱でもなかったと思う。そのうえ、人がときに人間以外のものへ姿を変えることや、鳥獣や草木の姿をしながら、人と同じように考えたり感情を表したりできるということも、古代人にはごく普通の考えだった。桃や瓜の中からさえ生まれると認められていた者が、しばらく小蛇や小犬の姿で私たちの間にいたとしても、それだけが特に不思議というほどではなかった。だから、いわゆる五大話が互いに似ていることなども、ひょっとすると一つの根本から枝分かれし、変化していった道筋を示唆する、偶然に残った痕跡かもしれないと、私は考えている。

    ただし、それを断言するには、もっと多くの資料が集まるのを待たなければならないの……'

  section: 桃太郎の誕生／五 赤本の災厄
  original: とも唯追々の採集資料のみに由つて、自然に判明しようとして居るのである。今日はまだ何人も心付いて居ないやうだが、雀と蟹との二つの御伽噺は、相互にも關係をもち、又桃太郞の話とも似通うた點が若干ある。少なくとも桃太郞一つの成長過程を詳かにすることによつて、他の二つのものが今の形に變化して來た理由も、說明し得られる樣に私だけは信じて居る。それで何れの側面から考へて行つても、結局は同じ處に落付くのかは知らぬが、同じことならば目今比較の材料が稍、豐富で、手を空しうして今後の報告を待つて居なくとも、或程度までの假定が立てられる部分から、少しづつ此問題に近づいて見ようとして居るので、私の目的は弘く民間說話の世に傳はり、又案外に改作增補を受けずして、今まで保存せられて居た事情を知るのを第一段とするのである。今ある桃太郞童話の言ひ傳への中で、どの點とどの點とが特に昔から重きを置かれて居たかといふことは、勿論人によつて見方も違ふであらうが、少なくともその個々の要素には、類例の多いものと稀なるものと、國の內外を通じて分布の弘いものとさうで無いものと、非常な差等のあることだけは認められる。たとへば桃の實が割れて中から子が生れたといふことは、日本の桃太郞以外には無いらしいに反して、犬や其他の動物に援けられて、大きな仕事をした話は他國にも多い。犬が猫を嚇し猫が又鼠を驅使して、紛失した寶物を見付けさせたといふ話は我邦にもあり、西遊記の三藏法師までが、犬猿猪の半ば人間の形をしたのを伴につれて遠征し、途々色々なしくじりや仲間喧嘩のあつたことを笑話の種にして居る。遠い諸民族の間にも此點は相似たるものが多いが、其中でも羅馬の博物館などに幾つも陳列せられて居るミトラ神の石像などは、猛牛を退治して居るのは桃太郞同樣の少年であり、之を援けて居るのは犬と蠍とであつて、何人が見ても是を動物忠誠譚の古くから世界的であつた證跡と感ぜずには居られぬのである。說話の英雄が隱れたる約束により、もしくは恩義に報いんとする動物の助勢を受けて、非常な難事業に成功したといふことは、兎に角に日本ばかりの傳承では無かつたのである。日本の特徴といふのはたゞ其英雄の名前であり、又其出現の樣式であつた。桃が川上から流れて來て其中に赤兒があり、それで桃太郎と名を付けたといふ點ばかりは、近い地域にも其類似のものを發見せられて居ないから、多分は我邦に於て新たに出現したものであり、從
  translation: '……くても、次々に採集される資料だけによって、自然に明らかになろうとしている。今はまだ誰も気づいていないようだが、雀と蟹の二つのおとぎ話は、互いにも関係があり、また桃太郎の話とも似た点がいくつかある。少なくとも、桃太郎一つの成長過程を詳しく明らかにすれば、ほかの二つが今の形に変化してきた理由も説明できるようになると、私だけは信じている。どの側面から考えても結局は同じところに落ち着くのかもしれないが、どうせなら、今のところ比較資料がやや豊富で、何もせず今後の報告を待たなくても、ある程度まで仮説を立てられる部分から、少しずつこの問題に近づいてみようとしている。私の目的は、広く民間説話が世に伝わり、しかも意外に書き換えや増補を受けずに、今日まで保存されてきた事情を知ることを、第一段階とするのである。

    今ある桃太郎の童話の言い伝えで、どの点とどの点が特に昔から重視されていたのかは、もちろん人によって見方が違うだろう。それでも、個々の要素には、類例の多いものと少ないもの、国内外に広く分布するものとそうでないものとの間に、非常に大きな違いがあることだけは認められる。たとえば、桃が割れて中から子どもが生まれたという話は、日本の桃太郎以外にはないらしい。一方、犬などの動物に助けられて大きな仕事をした話は、ほかの国にも多い。犬が猫を脅し、猫がさらにネズミを使って、なくなった宝物を見つけさせたという話は日本にもある。『西遊記』の三蔵法師までが、犬・猿・猪の半ば人間の姿をしたものを供に連れて遠征し、途中のさまざまな失敗や仲間げんかを笑い話の種にしている。遠くの諸民族の間にも、この点が似た話は多い。なかでも、ローマの博物館などにいくつも陳列されているミトラ神の石像は、猛牛を退治しているのが桃太郎と同じような少年で、それを助けるのが犬とサソリである。誰が見ても、動物の忠誠を語る話が古くから世界的にあった証拠だと感じずにはいられない。説話の英雄が、隠れた約束によって、あるいは恩に報いようとする動物の助けを受けて、非常に難しい事業に成功したということは、ともかく日本だけの伝承ではなかったのである。

    日本の特徴というのは、ただその英雄の名前と、現れ方にあった。桃が川上から流れてきて、その中に赤ん坊がおり、それで桃太郎と名づけたという点だけは、近くの地域にも似たものが見つかっていない。だから、おそらく日本で新しく生まれたものであり、した……'
  notes:
  - 冒頭・末尾は前後のスキャンへ続く。
  - 『西遊記』の供を「犬猿猪」とするのは原文どおり。一般に知られる登場人物に合わせた訂正は加えていない。

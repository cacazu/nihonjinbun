  section: 桃太郎の誕生／四 童話と其記録
  original: 居る。以前は此念慮は一般に今よりもずつと强かつた。だから聽いてくれる人があれば、それを懷かしがり愛したのである。さういふ篤志者が一人去り二人立退いて、しまひに殘されたのが子供だけ、それも熱心にもつともつとと注文するのは、概して小さい者ばかりになつてしまつた。我々の昔話は急激に童話化せざるを得なかつた次第である。之を要するに是等外部の事情變化がもし無かつたら、我々の民間說話は決して此頃のやうな形にはならなかつた。昔も假に童話協會の會員といふ類の人が參與して居たならば、無意味なたわいの無い御話が、もう少し數多く出來て居た筈であるが、事實は正に其反對であつた。同じ話をさう度度は聽きたがらぬ兒、話を貪る子が少しせがむと、其次に出て來るのは大抵は「爲によくない話」であるのみならず、子供專用の如く心得られて居るかち〳〵山でも、又は瓜子姫でも、其内容は旣に甚だ殺風景なものであつた。是を小兒の爲に最初から、支度せられたと見ることは不可能である。しかも現代の作家たちはそれをさうかと思つて居る故に、自分等のすることの方が確かに改良進步だといふ誤つたる自信を得るのである。二つの者は全く別のものだ。是を童話といふ一個の名詞で、包括して居たのがそも〳〵間違つて居る。私はこの近世の經驗に徵して、更に又神話が後々の昔話となる際にも、やはり大よそは是と似た外部事情の感化を受けて、一種の選擇が行はれたものかと想像する。それだから固有信仰のまだ活きて働いて居た時代の名殘が、その僅かに殘された破片の中からも、見出されるのでは無いかと考へて居る。此想像が誤まつて居なかつたら、爰にも亦一つの藝術と宗教との交涉點が、將來の考察者の爲に保存せられて居たわけである。我々の固有信仰が、儒佛その他の外來思想の影響を受けて、少しづつ移り動いて居た間に、何かまだ明かになつて居らぬ動機に由つて、古い言ひ傅への或ものは形を損じつゝも永く殘り、他の或ものは夙に文藝化して、興味を以て常民の間にもて囃され、それが後更に都市の風雅階級に入り込んで、又別樣の取扱ひを受けるに至つたことは、さう大きな面倒無しに誰にでも認め得られる。ただ不思議と言つてもよい一つの事實は、多くの文人たちがいつも傳統の拘束を受けて、未だ曾て文學を以て、無より有を生ずるの術とは考へて居なかつたことである。彼等の想像力には眼に見えぬ繫緒が附いて居た。さうして自由奔放にさう遠くの空を飛び翔ることが出來なかつた。鶯が春に啼き鷄が天明を期して高く唱うたやうに、詩歌物語にもそれが出現すべき
  translation: '……いる。以前は、この思いは一般に、今よりずっと強かった。だから聞いてくれる人があれば、親しみを感じ、大切にしたのである。そうした熱心な聞き手が一人去り、二人離れていって、最後に残ったのは子どもだけになった。その中でも、「もっともっと」と熱心に求めるのは、おおむね小さな子ばかりになってしまった。このようにして、日本の昔話は急速に童話化せざるをえなかったのである。要するに、こうした外部の事情の変化がなければ、日本の民間説話は決して近ごろのような形にはならなかった。仮に昔も、童話協会の会員のような人が関わっていたなら、意味のないたわいない話が、もう少し多くできていたはずだが、事実はまさにその反対だった。同じ話をそう何度も聞きたがらず、話をむさぼる子が少しせがむと、次に出てくるのは、たいてい「ためにならない話」だった。それだけでなく、子ども専用と思われている「かちかち山」や「瓜子姫」でさえ、その内容はすでに、ひどくむごたらしいものだった。これらが初めから子どものために用意されたと見るのは不可能である。ところが現代の作家たちは、そうなのだと思っているため、自分たちのすることのほうが確かに改良であり進歩だという、誤った自信をもつのである。この二つは、まったく別のものだ。それを「童話」という一つの名詞でまとめていたことが、そもそも間違っている。

    私はこの近世の経験に照らして、さらに神話が後世の昔話になる際にも、おおよそこれと似た外部事情の影響を受けて、一種の選択が行われたのではないかと想像する。だからこそ、固有の信仰がまだ生きて働いていた時代の名残が、わずかに残された断片からでも見つかるのではないかと考えている。この想像が間違っていなければ、ここにもまた、芸術と宗教が交わる一つの地点が、将来の研究者のために保存されていたことになる。日本固有の信仰が、儒教や仏教など、外来の思想の影響を受けて少しずつ変化する間に、まだはっきりしない何らかの動機によって、古い言い伝えのあるものは、形を損ないながらも長く残った。一方、別のものは早くに文芸となり、普通の人々の間で面白がられて人気を集め、のちにさらに都市の風流を好む階層に入り、また別の扱いを受けるに至った。このことは、さほど苦労せず誰にでも認められる。ただ、不思議といってもよい一つの事実は、多くの文人がいつも伝統に縛られ、文学を、無から有を生み出す技だとはかつて一度も考えていなかったことである。彼らの想像力には、目に見えないつなぎ綱がついていた。そのため、自由奔放に、はるか遠い空を飛び回ることはできなかった。ウグイスが春に鳴き、ニワトリが夜明けを待って高らかに鳴いたように、詩歌や物語にも、それが現れるべき……'

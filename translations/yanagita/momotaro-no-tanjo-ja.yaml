  section: 桃太郎の誕生／犬子噺
  original: 上の爺と下の爺と二人で川に簗をかけた。上の爺はまだ夜も明けぬうちに往つて見ると、自分の簗には大きな木の根株が入つてをり、下の爺のには雜魚が澤山入つて居た。そこで自分の簗の根つこぶしをば、下の爺の簗に投入れ、下の爺の簗の雜魚をば、自分の籠に入れて持つて來た。夜が明けてから下の爺は往つて見ると、自分の簗に大きな根株が入つてあつたから、持つて來て日向に干して置いた。いゝ加減に乾いたから斧で其根株を割りかけると、中から「爺、靜かに割れ」といふ。それで靜かに割ると一疋の狗兒が出て來た。それを大切に養ひ育てたところが、椀で食はせると椀の大きさだけ、鉢で食はせると鉢の大きさだけ、臼で食はせると臼だけ大きく育つた。是と同樣の發端は「旅と傳說」の昔話號(二七頁)に、岩手郡雫石村の例が一つある。老媼夜譚(一三〇頁)に採集せられた上閉伊郡の雁取爺も、半ば笑話に化して居て尙この型を保留して居る。小犬が木の根株の中に居て、文福茶釜の狸の樣に、「爺樣そつと割れ、そつと割れ」と言つたなどといふのは、思ひ切つて奇拔な空想のやうであるが、是も佐々木喜善君の聽耳草紙(二〇五頁)に、同じ例が尙一つある。必ずしも或土地限りの新らしい附加へでは無かつたのである。しかもこの靈妙なる白い犬が、殺されて其跡から木が生えるといふことは、九州以南の黃金小犬ともよく似て居り、それが臼にきられ、最後には灰になつてまで、常に元の飼主の善い爺にのみ幸ひした點は、すべて現在の花咲爺と同じいのだから、後者が考へ無しに或一つの重要な箇條を、脫落して居たことは想像してよからう。卽ち以前は此小犬も亦桃の中の桃太郞のやうに、遠く不可測の川上から、緣有る者の方へ流れ近づいて來たと說いて居たらしいのである。それがたゞ單なる偶然の一致であつたか、但しは又底に繫がつて居る緣の絲があつたかは、私には必ずしも決し難い問題とは思へない。今までに集まつて居る諸國の資料だけでも、或程度までは兩者の聯絡を證することが出來るやうであるが、それは先づ各人の判斷次第として、爰にはたゞ我々の注意すべき事實を注意するだけに止めて置かう。大田榮太郎君が「國語教育」の昭和五年一月號に報告した、越中上新川郡の灰蒔爺では、爺が山へ柴苅に行つた留守に、婆は川へ出て洗濯をして居ると、水上から大きな桃が流れて來る。それを拾つて來て爺に食はせようと思つて、家の庭の搗臼の中に入れて置いたところが、爺が還つて蓋を除けて見ると、桃では無くて一匹の犬ころが入つて居た。大事に育てて
  translation: '「上の爺と下の爺の二人で、川に簗を仕掛けた。上の爺が、まだ夜の明けないうちに見にいくと、自分の簗には大きな木の根株が入っていて、下の爺の簗には小魚がたくさん入っていた。そこで、自分の簗の根の塊を下の爺の簗へ投げ込み、下の爺の簗の小魚を自分のかごに入れて持ち帰った。夜が明けてから下の爺が見にいくと、自分の簗に大きな根株が入っていたので、持ち帰って日なたに干しておいた。ほどよく乾いたので、斧でその根株を割りかけると、中から『爺、そっと割れ』という。そこでそっと割ると、一匹の犬の子が出てきた。それを大切に養い育てたところ、椀で食べさせると椀の大きさだけ、鉢で食べさせると鉢の大きさだけ、臼で食べさせると臼の分だけ大きく育った。」

    これと同じような始まりの例が、『旅と伝説』の昔話号（二十七頁）に、岩手郡雫石村のものとして一つある。『老媼夜譚』（百三十頁）に採集された上閉伊郡の「雁取り爺」も、半ば笑い話になりながら、なおこの型を保っている。小犬が木の根株の中にいて、文福茶釜のタヌキのように「爺様、そっと割れ、そっと割れ」といったというのは、ずいぶん奇抜な空想のようだが、これも佐々木喜善君の『聴耳草紙』（二百五頁）に、同じ例がもう一つある。必ずしも、ある土地だけで新たに付け加えたものではなかったのである。しかも、この霊妙な白い犬が殺され、その跡から木が生えるという点は、九州以南の「黄金小犬」にもよく似ている。それが臼に加工され、最後に灰になってまで、いつも元の飼い主の善い爺にだけ幸いをもたらす点は、すべて現在の「花咲か爺」と同じなのだから、後者が何も考えずに重要な一項目を抜かしてしまったと想像してもよいだろう。つまり、以前はこの小犬も、桃の中の桃太郎のように、遠く測り知れない川上から、縁のある者のところへ流れ近づいてきた、と語っていたらしいのである。それが単なる偶然の一致なのか、それとも根底で結びつける縁の糸があったのかは、私には必ずしも判断の難しい問題とは思えない。これまでに集まった各地の資料だけでも、ある程度までは両者のつながりを証明できそうだが、それはひとまず各人の判断に任せ、ここではただ、注意すべき事実に注意を向けるだけにとどめておこう。大田栄太郎君が『国語教育』昭和五年〔1930年〕一月号に報告した、越中上新川郡の「灰まき爺」では、爺が山へ柴刈りに出た留守に、婆が川へ出て洗濯していると、川上から大きな桃が流れてくる。それを拾って持ち帰り、爺に食べさせようと思って、家の庭の搗き臼の中に入れておいた。ところが爺が帰り、ふたを取ってみると、桃ではなく一匹の子犬が入っていた。大事に育てて……'

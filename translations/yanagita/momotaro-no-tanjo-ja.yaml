  section: 狼と鍛冶屋の姥／狼と鏡と火
  original: 'ある。

    自分も一服しようと思つて近づいて火を貸して下されといふと、それが狼の眼であつたとも、又はウオーと唸つたので喫驚して逃げたともいふ話。

    是などは私も父から聽き、又どの山村にも大抵は聽くことで、何れもいふ人は實際あつたことのやうに話すが、たつた一度や二度ならば兎に角、さう何回もそんな事が有る筈は無い。

    それほど又狼の目玉も煙草の火とは似ても居ないのである。

    察するに是も狼の聯想として、始終人の胸に描かるゝきらりとした光であつて、後に煙草の普及と共に、此形のみが特に有名になつたのであらう。

    だから鍋釜を被つて刄を防いだといふ猫の話なども、今ある例證の多さは必ずしも由來の古き故で無く、却つて鏡を出して狼を追うたといふ方が、前からあつたものかも知れぬのである。

    猫の踊に常連が一人遲いので、「鍛冶屋のおばゝはどうしたらう」といふなども、踊と鍛冶屋とは餘りにも緣が無いから、或は又旣にこの金物を取落した話に、かぶれて居たことを示すものかも知れない。

    もしさうだとすると土佐の佐喜濱の鍛冶の姥の話が、近世變化を受けて自身人を害する化け狼であつたと說かるゝやうになつたのにも、又一つの新たなる誘因が見つかつたことになるのである。

    何にもせよ狼と安產の祈願との關係の方が、所謂犬梯子や鍋被りの挿話よりも、前から土佐の東境の山に、在つたことだけは先づ確かだと云つてよい。'
  translation: ――いる。自分も一服しようと思って近づき、火を貸してくださいというと、それは狼の目だった、とも、あるいは、うおーとうなったので驚いて逃げた、ともいう話である。こういう話は私も父から聞き、どの山村でもたいてい聞くものだ。誰もが実際にあったことのように話すが、たった一、二度ならともかく、それほど何度もそんなことがあるはずはない。狼の目玉も、それほど煙草の火には似ていないのである。思うに、これも狼から連想して、いつも人の心に描かれるきらりとした光であって、のちに煙草が普及するとともに、この形だけが特に有名になったのだろう。だから、鍋や釜をかぶって刃を防いだという猫の話なども、今ある例が多いのは、必ずしも起源が古いからではなく、かえって鏡を出して狼を追ったという方が、前からあったのかもしれない。猫の踊りで常連の一匹が遅いために、「鍛冶屋のおばばはどうしたのだろう」というのも、踊りと鍛冶屋はあまりに縁がないので、あるいはすでに、この金物を取り落とす話の影響を受けていたことを示すのかもしれない。もしそうなら、土佐の佐喜浜の鍛冶屋の姥の話が、近世になって変化し、姥自身が人を害する化け狼だったと語られるようになったことにも、新たな原因がもう一つ見つかったことになる。ともかく、狼と安産祈願との関係の方が、いわゆる犬梯子や鍋かぶりの挿話よりも前から、土佐の東境の山に存在していたことだけは、まず確かだといってよい。

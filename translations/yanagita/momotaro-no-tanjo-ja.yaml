  section: 絵姿女房／八 白介の翁
  original: '外來の話の種が歡迎せられ、新たなる複合の次々に起つた事情は、恐らく此方面から尋ね

    られると思ふ。如何に簡單であり又粗野であらうとも、前から何の傳へごとも無かつた處へ、

    外國の話が入つて來て無意識に採用せられるなどといふことは、たとへ百人が說かうとも私

    には信ずることが出來ない。今は發見せられて居ないといふだけで、傳播には先づ引力があ

    り、次には新舊のものを結び合すだけの、紐なりセメントなりが必ずあつたのである。豐後

    の「眞野長者」に繪女房の話が來て加はつたのは、直接にはこの殿樣の難題、その一つ前には

    草苅笛の優雅なる情緒が媒介であつたらしいことは、偶然に奧州の二つの話が暗示するので

    あるが、其點は他日別に考へて見たい。石井研堂氏の國民童話の中に、相州小田原附近に行

    はるゝ葱賣の正助といふ話は、多分「話の世界」といふ雜誌(大正八年三月號)に報告せられた

    虎杖の名笛、卽ち此地方の小賀沼村の筑井氏の昔語りとして、巫女が雨乞の折に話をしたと

    いふものと、同じ口碑の變化であらうが、是には只何と無く殘つて居る葱賣といふことが、

    前に比べて見た菖蒲と桃と栗との、幽かなる聯絡を心付かせてくれる。其話の大要を抄出す

    るならば、

    昔葱賣の正助といふ貧乏で正直な男が、年の暮に錢が無くてぼんやりと川の面を眺めて

    居ると、龜が出て來て背に乘せて龍宮へ連れて行く。龍王が美しい姫を嫁にくれたので、

    伴なひ還つて仲睦まじく暮らして居ると、國司がその妻を奪はうとして無理な難題をか

    ける。白胡麻を船に千艘、黑胡麻を船に千艘、あすの晝までに持參すべし。それが出來

    なければ女房を出せとある。困つて戾つて來て相談をすると、女房が例の川端に出て、と

    ん〳〵と手を打つと二千艘の胡麻船が到着した。是には國司も我を折つたけれども、今

    度は又一つ手を替へて、コレハコレハといふものを持つて來い。それが出來なければ罰

    として女房を取る。さても御無體な國司殿だと泣いて戾つて女房に話をしたところが、

    少しも心配したまふなと、針箱の引出しから小箱を一つ出して、此中へ私を入れて差上

    げ給へと言つて、煙の樣なものになつて自分で小箱の中に入つた。是が御注文のコレハ

    コレハで御座るといふと、國司は早速其蓋を取つて見る。さうすると中から大蛇が現は

    れて、果してコレハコレハと言ふ國司の頸を卷いてしめ殺した。さうして屋根傳ひに前

    の川に入つて、其まゝ龍宮に還つて行き、正助はもとの葱賣になつて一生を暮らした。'
  translation: '外国から来た話の種が歓迎され、新しい組み合わせが次々に生まれた事情は、おそらくこの方面から探れると思う。どれほど単純で粗野であっても、もともと何の言い伝えもなかった所へ外国の話が入り、意識することもなく採用された、というようなことは、たとえ百人が説いても、私には信じられない。今はまだ発見されていないというだけで、伝播には、まず引き寄せる力があり、次に新旧のものを結び付ける紐なり接着剤なりが、必ずあったのである。

    豊後の「真野長者」に絵女房の話が加わったのは、直接にはこの殿様の難題が、その一つ前には、草刈りの笛の優雅な情緒が仲立ちをしたらしい。このことを、たまたま奥州の二つの話が示唆しているのだが、その点は別の機会に考えてみたい。

    石井研堂氏の『国民童話』に載る、相州の小田原付近に伝わる「葱売りの正助」という話は、おそらく『話の世界』という雑誌の大正八年三月号に報告された「虎杖の名笛」、すなわち、この地方の小賀沼村の筑井氏の昔語りとして、巫女が雨乞いのときに語ったというものと、同じ言い伝えが変化したものだろう。こちらに、ただ何となく残っている葱売りという要素は、先に比べた菖蒲、桃、栗との、かすかなつながりに気づかせてくれる。その話のあらましを抜き出すと、次のとおりである。

    昔、葱売りの正助という、貧乏で正直な男がいた。年の暮れに金がなく、ぼんやり川面を眺めていると、亀が出てきて、背に乗せて竜宮へ連れていった。竜王が美しい姫を妻にくれたので、連れ帰って仲よく暮らしていると、国司がその妻を奪おうとして無理な難題を出した。「白胡麻を船千艘、黒胡麻を船千艘、明日の昼までに持ってこい。それができなければ妻を差し出せ」というのである。

    困って帰り、相談すると、妻はあの川辺へ出て、とんとんと手を打った。すると二千艘の胡麻を積んだ船が着いた。これには国司も折れたが、今度はまた手を変え、「『コレハコレハ』というものを持ってこい。それができなければ、罰として妻をもらう」と言う。何という無理なことを言う国司だろうと、泣きながら帰って妻に話すと、「少しも心配なさるな」と、針箱の引き出しから小箱を一つ取り出し、「この中に私を入れて差し上げなさい」と言い、煙のようなものになって、自分で小箱の中へ入った。

    「これがご注文の『コレハコレハ』でございます」と言うと、国司はさっそくふたを取ってみた。すると中から大蛇が現れ、果たして「これは、これは」と言う国司の首に巻きつき、絞め殺してしまった。それから屋根伝いに、もとの川へ入り、そのまま竜宮へ帰っていった。正助は、もとの葱売りに戻り、一生を暮らした。'
  notes:
  - 「小賀沼村」「筑井氏」「虎杖の名笛」「情緒」を拡大画像で確認。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。
  - 拍手の擬音「とん〳〵」は原画像の縦書き繰り返し記号を復元。訳は「とんとん」。

  section: 狼と鍛冶屋の姥
  original: 狼の穴に取落した背の赤子を、夜間に咥へて來て家の門に置いて行つてくれたといふ話なども、今日は旣に實際あつた事として語り傳へられ、或は何村某の何代前の息子がそれだつたなどとも謂つて居るか知らぬが、それはやはり駿州子持阪の、朝比奈家元祖の傳說と系統を同じくするものの、單なる話し方の變化で無かつたとは言ひ切れない。狼が人間の憂ひを察して、斯くまでの親切を盡したとは、よく〳〵の事だからである。甲斐昔話集に土橋君の聞書きして居るものは、是に比べるとずつと自然に近いが、それでも聽く人が、今では昔話としてしか受取らぬやうである。甲州では曾て炭燒が山に伴なうて行つて居た二歲になる兒を、半纏にくるんだまゝで狼に持つて行かれたさうである。年經て後發見して家に連れて歸つたが、全身に毛が生えて居て山の物ばかり食ひ、どうしても里の食事に馴れ兼ねて、再び山に入つて行つた。あんなのが山男といふものになるのであらうと、評判をしたさうである。狼が人間の赤兒を掠めて岩窟に入り、飽滿して暫らく生かして置く間に、無心に乳などを吸はれて母性愛を生じ、其儘我子と共に育てて居た例が稀には有るといふことで、現に南方氏は近年印度の某州の病院に、山からさういふ子供を見つけて來て、實驗したといふ記事を譯し示された。民俗の根原は大抵皆幽玄であつて、安んじて我々の推定を述べ得るものは殆と一つも無い。從うて斯ういふ新たなる自然科學の記錄は、勿論興味多く又有力なる參考に相違ないが、さりとて狼と小兒に關する日本の多くの口碑が、當初何れも何人かの之に似た經驗に出發し、それが敷衍せられ又類推せられて、是だけ分布し變化したと考へることも、實例が外國であるだけに一層骨が折れる。殊に但馬の加門塚のやうに、母に化けて來て人の子を養つてくれた狼、又は是と反對に產婦を噉はうとした狼などは、假に國內にも時々狼の巢の赤子があつたとしても、それだけではまだ何分にも由來を解くことが出來ぬ。强ひてさう思つて說明を付けようとすると、それには邪魔になる色々の語り草を、押除け輕く見る樣な氣にならぬとも限らぬ。故に差當りは根本の法則がわからぬのも致し方無しとして、先づ弘く現存の事實、卽ち書いたものなり口でなり、國々に傳はつて居るものを集めて見る必要があるのである。佐喜濱の鍛冶屋の子孫の背中の毛は、朝比奈三郞左衞門の家の代々の犬の齒形と、是非とも比照して見なければならぬものと思ふ。それは唯單に過去の奇瑞の記念、卽ち傳說の空なもので無いことを證する
  translation: '狼の穴に落としてしまった背中の赤ん坊を、夜の間にくわえて来て、家の門に置いていってくれたという話なども、今ではすでに実際にあったこととして語り伝えられている。あるいは、何村の誰それの何代前の息子がそれだった、とまで言われているかもしれない。しかしそれも、やはり駿河の子持坂の朝比奈家の祖先の伝説と同じ系統のものが、ただ語り方を変えただけではなかったとは言い切れない。狼が人間の心配を察し、そこまで親切を尽くしたというのは、よほど特別なことだからである。土橋君が『甲斐昔話集』に聞き書きしたものは、それに比べればずっと自然に近いが、それでも今の聞き手は、昔話としてしか受け取らないようである。甲州では昔、炭焼きが山へ連れて行っていた二歳の子を、半纏に包んだまま狼に持ち去られたという。何年も後に見つけて家へ連れ帰ったが、全身に毛が生え、山の物ばかり食べて、どうしても里の食事になじめず、また山へ入っていった。「ああいうのが山男になるのだろう」と人々はうわさしたそうだ。狼が人間の赤ん坊をさらって岩窟に入り、腹が満ちているためしばらく生かしておくうちに、無邪気に乳などを吸われて母性愛が生じ、そのまま自分の子と一緒に育てた例が、まれにはあるという。実際、南方氏は近年、インドのある州の病院で、山からそういう子供を発見して連れてきて調べたという記事を訳して紹介された。民俗の根源はたいてい奥深く不明であり、安心して私たちの推定を述べられるものは、ほとんど一つもない。したがって、このような新しい自然科学の記録は、もちろん興味深く有力な参考資料に違いない。しかし、狼と子供に関する日本の多くの言い伝えが、初めはすべて誰かのこれに似た経験から出発し、それが広げられ、類推されて、これほど分布し変化したと考えるのも、実例が外国のものだけに、いっそう難しい。

    とくに但馬の加門塚のように、母に化けて人の子を養ってくれた狼や、逆に産婦を食おうとした狼などは、仮に国内でも時々、狼の巣に赤ん坊がいたとしても、それだけでは到底その由来を説明できない。無理にそう考えて説明をつけようとすると、その説明の邪魔になるさまざまな語り草を押しのけ、軽く見る気持ちにならないとも限らない。だから差し当たりは、根本の法則がわからないのもやむを得ないとして、まず広く現存する事実、つまり書かれたものでも口で伝えられるものでも、諸国に伝わるものを集めてみる必要がある。佐喜浜の鍛冶屋の子孫の背中の毛は、朝比奈三郎左衛門の家に代々伝わる犬の歯形と、ぜひ照らし合わせてみなければならないと思う。それは単に過去の不思議な瑞兆の記念、すなわち伝説が架空ではないと証明するもの'
  notes:
  - 狼に育てられた子供についての記述は、著者が当時の記事を紹介したもの。訳者がその報告の真実性を現代の知見で確認したという意味ではない。
  - 「実験」はこの文脈では、記事にいう観察・調査の趣旨で「調べた」と訳した。

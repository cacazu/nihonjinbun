  section: 和泉式部の足袋／二 淨瑠璃御前の生ひ立ち
  original: '山上には女人を住せしめない。

    それにも拘らず寺の後には產の神の社があつて、安產の願掛けに多くの孕み女が、方々の村から參詣して來るといふのは、少しばかり土佐の野根山の產杉とも似通うて居る。

    鹿が和泉式部を生んだといふなどは、思ひ切つて奇拔なる話ではあるが、爰に一條の足袋の挿話があつた爲に、我々は略ゝその年久しい流轉の路を跡つけることが出來る。

    といふことは是だけ具體的な因果譚、鹿の子なるが故に足の趾二つに支れ、それを包むが爲に我々の五本のゆびを、二つに分けてはく足袋といふものを、考へ出したといふ類の順序立つた話を、各地無關係に獨立して說き始めたとは言ひ難いからである。

    早川孝太郞君の「猪·鹿·狸」一一三頁に、今から三四十年前まで、東三河の村々に謠はれて居た淨瑠璃御前の一代記といふものがあつた。

    其節は旣に絕えて、話の內容だけが切れ〱に記憶せられて居る。

    昔矢作の兼高長者、子無きを憂へて鳳來寺の峰の藥師に願掛けして、一七日の參籠を企てたところ、滿願の夜の夢に藥師如來、大いなる白鹿となつて顯れたまひ、汝に授くべき子種とては無けれども、願ひの切なる故に是を與ふとあつて、一顆の球を賜はると見て身ごもると謂ひ、或は又藥師が白髪の翁と現じて、汝に鹿の子を授くべしと仰せられたとも謂つて居る。

    やがて月滿ちて生れたのが淨瑠璃姫であつた。

    容顏花の如く輝り耀く美女なれども、一つの缺點は足の指が二つしか無いことであつた。

    親の長者は深く之を悲しんで、それを隱す爲に布を以て足を纏うて置いた。

    是が我邦の足袋といふものの始だと言つて居たさうである。

    三河と肥前の杵島とは、中間に二百數十里の山川がある。

    さうして雙方共に他の一方に、同じ此話のあることを知らなかつたらしいのである。

    足袋は本來が皮製の輕い靴であつた。

    是を木綿で作り、又は其前に麻布でこしらへた時代は、文獻の方からでも明かにし得るであらうが、兎に角にさう古いことで無い。

    從うて此一挿話の新たに附加せられたのも、大よそ何時の頃からといふことが推定し得られる。

    卽ちさういふ足袋の常人にも稍、知られて來た時代に、此話は三河の方から旅をして來たのであつた。

    否々肥前國から三河へ出かけたのかも知れぬぢや無いかと、揚足を取らうとする人が若しあつたら、其仁は多分失敗するであらう。

    三河の鳳來山には是よりもずつと前から、鹿がすぐれた上臈を生んだといふ傳說があつて、淨瑠璃御前などは實は其傳說の、一つの派生に'
  translation: '――山上に女性を住まわせない。それにもかかわらず、寺の裏には産の神の社があり、安産の願をかけに多くの身重の女性が周囲の村から参詣して来るというのは、土佐の野根山の産杉とも少し似ている。

    鹿が和泉式部を産んだというのは、思い切って奇抜な話だが、ここに足袋の挿話があるために、私たちは、その長年の流転の道筋を、おおよそたどることができる。というのは、これほど具体的な因果関係の話、つまり、鹿の子なので足の指が二つに分かれ、それを包むために、私たちの五本の指を二つに分けて履く足袋というものを考え出した、というような筋道の立った話を、各地で互いに無関係に、独立して語り始めたとはいいにくいからである。早川孝太郎君の『猪・鹿・狸』一一三頁には、今から三、四十年前まで東三河の村々で歌われていた「浄瑠璃御前の一代記」というものが載っていた。節回しはすでに絶え、話の内容だけが断片的に記憶されている。昔、矢作の兼高長者が、子のないことを嘆き、鳳来寺の峰の薬師に願をかけ、七日間の参籠をしようとしたところ、満願の夜の夢に薬師如来が大きな白鹿となって現れ、「おまえに授ける子種はないが、願いが切実なので、これを与えよう」と、一個の玉をくださった、と見て身ごもったという。また、薬師が白髪の老人となって現れ、「おまえに鹿の子を授けよう」とおっしゃったともいう。やがて月満ちて生まれたのが浄瑠璃姫だった。顔立ちが花のように輝く美女だったが、ただ一つの欠点は、足の指が二つしかないことだった。親の長者はこれを深く悲しみ、隠すために布で足を包んでおいた。これが日本の足袋の始まりだ、といっていたそうである。三河と肥前の杵島の間には、二百数十里にわたる山や川がある。そして両方とも、もう一方に同じ話があることを知らなかったらしい。

    足袋は、もともと革製の軽い靴だった。これを木綿で作り、あるいはその前に麻布で作った時代は、文献からでも明らかにできるだろうが、いずれにせよ、それほど古いことではない。したがって、この一つの挿話が新たに付け加えられた時期も、おおよそ推定できる。つまり、そうした足袋が一般の人々にも多少知られるようになった時代に、この話は三河の方から旅をしてきたのだった。「いや、肥前から三河へ出かけたのかもしれないではないか」と揚げ足を取ろうとする人があれば、その人はおそらく失敗するだろう。三河の鳳来山には、これよりずっと前から、鹿が優れた上臈を産んだという伝説があり、浄瑠璃御前などは、実はその伝説から派生した一つに――'
  notes:
  - 冒頭は244、末尾は246へ続く。
  - 『欠點』という身体への評価は歴史的な物語・著者の叙述を忠実に訳したもので、訳者の評価ではない。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第45頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

  section: 絵姿女房／四 安積山の糠次郎
  original: 'を見付けようとしたのみならず、力めて話の信じ難い部分を排除し、又時としては善意の改

    訂增補さへ試みたのであつた。だから十分に昔話の實狀を知つた上で無いと、多くの傳說の

    成立ちを考へて見ることが出來ない。單に傳說ばかりを專門に見てあるいて居たのでは駄目

    なわけである。

    諸國の白米城の傳說に於ては、旣に其親であつた昔話が見付からぬ爲に、私の意見が幾分

    か空な想像のやうに聽えるけれども、孫在家の孫三郞の家の傳說だけは幸ひにして略、證據が

    あつた。單に瓜子姫成長の一點を除いて、殘りの三分の二は三箇處の昔話であり、更に繪姿

    の部分だけならば、尙三つ以上の例があつて、其二つ迄は亦傳說化して居るのであつた。そ

    れを考へて見るならば、昔話の隱れたる力がわかるであらう。福島縣では郡山市の近在、安

    積郡片平村の大町といふ處に、山の井の清水があつて采女の身を投げた故跡と傳へ、そこに

    又一つの繪姿女房の昔語りがある。貧しき百姓の名は糠次郞、しかも其清水の傍には、今で

    は「影さへ見ゆる」の歌の石碑さへ建つて居るのである。

    昔糠次郞といふ貧しい子供が成長して、長者の美しい娘を嫁に貰つた。女房を愛して其

    傍を離れず、少しも働きに出ようとしなかつた爲に、田畑は雜草に覆はれてしまつた。

    女房はそれを諫めて、自ら鏡に映して我姿を繪に描き、それを竿に挿んで夫に與へたの

    で、糠次郞はやつと之を携へて畑の脇に立て、眺めながら働くやうになつた。

    ところが

    或日旋風が吹起り、其繪を空高く捲揚げて、奈良の都の內裡の庭に持つて行つて落し

    た。葛城王といふ皇子が之を拾ひ上げ、それを携へて奥州に下り、

    方々捜しまはつて糠

    次郞の女房を發見し、それを采女にして大和の京へ連れて行つた。其時糠次郞が妻の別

    を悲しんで、長く行方を見送つたといふ故跡が、今でも踏張の松と名けられて、此口碑

    の作りごとで無いことを示して居る。一方采女は奈良に在つて舊里の戀しさに堪へず、

    或夜宮殿を拔けて衣を猿澤の池の柳に引掛け、遙々安積の郡にまで還つて來たが、夫の

    糠次郞は歎き死にに死んだ後なので、落膽の餘り自分もこの淺香沼に身を投げて死ん

    だ。奈良の方ではそれを知らぬから、猿澤の池を替へほして見たが姿は見えない。

    さう

    して陸奥の安積の沼に采女の亡骸が浮び揚がつた爲に、終にこの二つの水は遠く地下に

    通ふものと言ひ傳へられるやうになつた(地方叢談、菅野桃井二氏報)。'
  translation: 'を見つけようとしただけでなく、努めて話の信じがたい部分を取り除き、ときには善意から修正や付け足しまで試みたのだった。だから、昔話の実際のあり方を十分に知ってからでなければ、多くの伝説の成り立ちを考えることはできない。ただ伝説だけを専門に見て歩いていたのでは駄目なのである。

    各地の白米城の伝説については、その親となった昔話がもう見つからないため、私の意見が多少は根拠のない想像のように聞こえる。しかし、孫在家の孫三郎の家の伝説には、幸い、ほぼ証拠があった。瓜子姫の成長という一点だけを除けば、残りの三分の二は、三か所に伝わる昔話と共通している。さらに姿絵の部分だけなら、なお三つ以上の例があり、そのうち二つまでは、やはり伝説になっていた。このことを考えれば、昔話の隠れた力が分かるだろう。

    福島県では、郡山市の近郊、安積郡片平村の大町という所に「山の井」の清水があり、采女が身を投げた跡と伝えられている。そこにはまた一つ、絵姿女房の昔語りがある。貧しい百姓の名は糠次郎で、その清水のそばには、今では「影さへ見ゆる」の歌の石碑まで建っているのである。

    昔、糠次郎という貧しい子どもが成長し、長者の美しい娘を妻にもらった。妻を愛してそばを離れず、少しも働きに出ようとしなかったため、田畑は雑草に覆われてしまった。妻はそれをいさめ、自分を鏡に映して姿絵を描き、竿に挟んで夫に渡した。そこで糠次郎は、ようやくそれを持っていって畑の脇に立て、眺めながら働くようになった。

    ところがある日、つむじ風が吹き起こり、その絵を空高く巻き上げて、奈良の都の内裏の庭に運んで落とした。葛城王という皇子がこれを拾い上げ、携えて奥州へ下り、あちこち探し回って糠次郎の妻を見つけ出し、采女にして大和の都へ連れていった。そのとき糠次郎が妻との別れを悲しみ、いつまでも行く先を見送ったという跡は、今も「踏張の松」と呼ばれ、この言い伝えが作り話ではないことを示している。

    一方、采女は奈良で故郷への思いに耐えきれず、ある夜、宮殿を抜け出して、衣を猿沢の池の柳に掛け、はるばる安積郡まで帰ってきた。しかし、夫の糠次郎は嘆きのあまり亡くなった後だったので、失望のあまり、自分もこの浅香沼に身を投げて死んだ。奈良の人々はそのことを知らないので、猿沢の池の水をかい出して干してみたが、姿は見つからなかった。そして、陸奥の安積の沼に采女の遺体が浮かび上がったため、ついにはこの二つの水は、遠く地下でつながっていると言い伝えられるようになった（『地方叢談』。菅野・桃井の両氏の報告）。'
  notes:
  - 冒頭はscan179から続く。
  - 「采女」は宮廷に仕えた女性。「清水」と原表記「替へほす」を原画像で確認し、OCR段階の推測校訂「浚へ」を撤回した。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。

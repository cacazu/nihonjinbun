  section: 絵姿女房／三 エンブの果報
  original: '人公の名の如く解せられることになつたのである。

    昔エンブといふ貧しい百姓があつた。家柄もよく又親孝行であつたので、或長者の美し

    い娘が、自ら望んで嫁に來た。エンブは愛情の餘り片時も女房の側を離れ難く、稼業の

    爲に働きに行かぬやうになつた。父親は之を憂ひ色々と考へた末、名ある繪師を賴んで

    その女房の姿を描かせて與へた處が、エンブは悅んで其繪像を持つて出て、田の畔に掛

    けて置いて、それを眺めつゝ耕作をした。或日俄かに風が吹いて來て、繪像を空中に捲

    き上げて、國王の庭の前に落した。ちやうど國王は天下に美女を覓めて居たところであ

    つた故に、之を手がかりにして國々を搜しまはり、終にエンブの女房を見つけ出して都

    に連れて行つた。エンブは戀ひ焦れて其跡を追ひ、都に上つて來たけれども、城門の中

    に入ることを許されない。ところが一年に只の一日だけ、數多の菖蒲賣の中から、初の

    三人を宮中に呼び入れて、國王親ら其菖蒲を買上げる習はしがあることを知つて、菖蒲

    賣になつて夜明け前から御門の外に待つて居て、呼入れられて御殿の前へ出た。それを

    見ると、今まで一度も笑顔を見せたことの無い妃がにつこと笑つたので、又次の日も、

    もう一日同じ菖蒲賣を呼入れた。さうして妃の笑顔を見たいばかりに、强ひて菖蒲賣と

    衣裝を取換へて、國王は自身庭に下りて菖蒲を賣る眞似をした。其内に退城の時刻が來

    たので、何も知らぬ衞士どもは國王の菖蒲賣を門外に追立ててしまつた。それ故にエン

    ブは圖らずも國王となり、その最愛の妃と共に永く城内に住むことになつた。

    前の東北の二つの例に比べると、是は殆と其話の飜譯であることを、隱さなかつたかと思

    ふやうな話し方である。それでも菖蒲賣だけは尙和製の裝置らしいが、此點は多分蛇聟入の

    昔話に、菖蒲湯に浴して蛇の子を下したと謂ひ、又は牛方山姥の逃竄說話に於て、蓬菖蒲の

    叢の中に身を匿すと、山姥が其香に迷うて人間の有りかを嗅ぎ出し得なかつたといふのと同

    樣に、最初菖蒲をめでたい植物とする由來談として、乃ち專ら五月五日の節供の日ばかり、

    此話をした名殘では無いかと思はれる。それは兎に角この三つの話の、出處が一つであつた

    ことだけはもう明白であつて、さうすると我々の昔話は、南北數百里の大旅行を、何者かに

    附いてするものだといふことだけは、斷言してもよいことになるのである。

    榊木敏君の報告に依れば(旅と傳說三卷五號)、肥前の南高來郡にも是と半分だけ似た話があ'
  translation: '公の名のように受け取られることになったのである。

    昔、エンブという貧しい百姓がいた。家柄もよく、親孝行でもあったので、ある長者の美しい娘が、自分から望んで嫁いできた。エンブは愛情のあまり片時も妻のそばを離れられず、生業のために働きに行かなくなった。父親はそれを心配し、いろいろ考えた末、有名な絵師に頼んで妻の姿を描いてもらい、与えた。するとエンブは喜んでその絵を持って出かけ、田の畔に掛け、それを眺めながら耕作した。

    ある日、突然風が吹いてきて、絵を空に巻き上げ、国王の庭先に落とした。ちょうど国王は天下に美女を探していたところだったので、それを手がかりに国々を探し回り、ついにエンブの妻を見つけ出して都へ連れていった。エンブは恋い焦がれて後を追い、都へ上ってきたが、城門の中に入ることを許されなかった。

    ところが、一年にたった一日、多くの菖蒲売りのうち、最初の三人を宮中へ呼び入れ、国王自らその菖蒲を買い上げる習わしがあると知った。そこで菖蒲売りになり、夜明け前から御門の外で待っていると、呼び入れられて御殿の前に出た。それを見ると、今まで一度も笑顔を見せなかった妃がにっこり笑ったため、翌日も、もう一日、同じ菖蒲売りを呼び入れた。そして妃の笑顔を見たい一心で、国王は無理に菖蒲売りと衣装を取り替え、自ら庭に下りて菖蒲を売るまねをした。そのうちに城を退出する時刻になったので、何も知らない衛士たちは、菖蒲売り姿の国王を門の外へ追い立ててしまった。そのためエンブは思いがけず国王となり、最愛の妃とともに、いつまでも城内で暮らすことになった。

    先の東北の二つの例と比べると、これはほとんど、翻訳された話であることを隠さなかったのかと思えるような語り方である。それでも菖蒲売りだけは、やはり日本で加えられた設定らしい。この点はおそらく、蛇婿入りの昔話で、菖蒲湯につかって蛇の子を流したといい、また牛方と山姥の逃走説話で、蓬と菖蒲の茂みに身を隠すと、山姥はその香りに惑わされ、人間の居場所を嗅ぎ出せなかったというのと同じであろう。初めは菖蒲を縁起のよい植物とする由来の話として、もっぱら五月五日の節句の日だけに語っていた、その名残ではないかと思われる。

    それはともかく、この三つの話の出どころが一つだったことだけは、もう明らかである。そうすると、私たちの昔話は、南北数百里という大旅行を、誰かについてするものだということだけは、断言してもよいことになる。

    榊木敏君の報告によると（『旅と伝説』三巻五号）、肥前の南高来郡にも、これと半分だけ似た話があっ'

  scan: 113
  section: 田螺の長者
  original: 田螺の長者
  translation: 田螺の長者
  notes:
  - 章扉。右頁は前章の柱と頁番号だけで本文はない。田螺は「たにし」。
  sequence: 118
- id: mmt-114-01
  scan: 114
  section: 田螺の長者／舌切雀と腰折雀
  original: '一舌切雀と腰折雀

    現在の所謂御伽噺が、どれ程までに昔の面影を保持して居るか。多くの開け過ぎた國では

    それを知るべき手段がもう無い爲に、幾つもの假定が常に相鬪つて居たのである。私は若し

    彼等の間にも日本のやうに、比較し得べき眼前の資料が豐富であつたならば、果して說話學

    なるものが今日の形態をとつて、發達したであらうか否かを疑ふ者である。既に瓜子姫の例

    でも明かになつた如く、斯邦ばかりでは同じ一つの昔話が、少しづつ姿を變へて隅々にまで

    分布して居る。至つて僅かな將來の骨折を以て、其數を二十にも三十にもすることが出來る。

    假に直接にはどの點が古いかを證明し難くとも、少なくとも何が新たに加へられた變更であ

    るかを見出すことは、今ならばまだ決して面倒では無い。さうして都會に於て筆錄せられ若

    くは印刷せられたものが、必ずしも最も純なる形ではなかつたことだけは、兎に角に既に確

    かめられたのである。さうすれば先づ國內の更に古いものを尋ねて、何が今一つ以前の要素

    であつたかを知つて後に、かの外國の學者の區々相容れざる意見を、判別し取捨するのが順

    序では無いか。彼等もし新たに我々の多くの資料を聞き知つたならば、其所說は或は改訂す

    る所があらうも知れぬ。少なくとも日本の如く自身口碑を管理する民族の、直接の理解と感

    覺とを聽かうとすることは疑ひが無い。だから我々の努力は單なる學問の國產奬勵で無く、

    寧ろ進んて將來の輸出を隆盛ならしめんとする準備である。

    日本の昔話の中では、殊に「舌切雀」などが外國人に珍らしがられるやうだが、此昔話の他

    に類型の少ないのは、實は近世になるまで口から耳への傳承を主とし、著しい變化が其間に

    行はれた結果であつた。然るに世には說話の傳播を信ぜんとするの餘り、却つて僅かに遺つ

    て居る前代の特徴すら、見落す人の多かつたのは不幸である。たとへば宇治拾遺に出て居る

    「瓢の米」の話が、朝鮮を通つて入つて來たといふことは、今ではもう確かだと言つてよから'
  translation: '一　舌切雀と腰折雀

    現在、いわゆるおとぎ話と呼ばれるものは、どの程度、昔の姿を保っているのだろうか。文明化が進みすぎた多くの国では、それを知る手段がもうないため、いくつもの仮説が、いつも互いに争っていた。もしそれらの国々にも、日本のように、目の前で比較できる資料が豊富にあったなら、果たして説話学は、今日の形で発達しただろうか。私は疑問に思う。瓜子姫の例ですでに明らかになったように、日本では、同じ一つの昔話が少しずつ形を変え、すみずみにまで分布している。これからほんの少し労力をかければ、その例を二十にも三十にも増やせる。仮に、どの点が古いかを直接証明するのは難しくても、少なくとも、何が新しく加わった変更なのかを見つけることは、今なら決して困難ではない。そして、都市で書き留められ、あるいは印刷されたものが、必ずしも最も純粋な形ではなかったことだけは、とにかく、すでに確かめられている。

    それなら、まず国内のさらに古いものを探し、何がもう一段階前の要素だったかを知ったうえで、外国の学者の、互いに相いれないさまざまな意見を見分け、取捨選択するのが順序ではないか。彼らも、私たちの多くの資料を新しく知れば、自説を改めることがあるかもしれない。少なくとも、日本のように、自ら口伝を管理している民族の直接の理解や感覚を聞こうとすることは、疑いない。だから私たちの努力は、単に学問の国産を奨励することではなく、むしろ進んで、将来の輸出を盛んにしようとする準備なのである。

    日本の昔話では、特に「舌切雀」などを外国人が珍しがるようだ。しかし、この話に似た型がほかに少ないのは、実は近世まで、口から耳へ伝えることが中心で、その間に大きな変化が起こった結果だった。それなのに、世間には説話の伝播を信じようとするあまり、かえって、わずかに残る前の時代の特色まで見落とす人が多かったのは、不幸なことである。たとえば『宇治拾遺』にある「瓢の米」の話が、朝鮮を通って入ってきたことは、今ではもう確かだと言ってよいだろ'
  notes:
  - 末尾はscan115へ続く。
  - 「開け過ぎた國」「学問の輸出」などは著者の歴史観・比喩を保持。
  - 「瓢の米」は説話名。瓢は瓢箪。
  - 次のスキャンへ続く
  sequence: 119
- id: mmt-115-01
  scan: 115
  section: 田螺の長者／舌切雀と腰折雀
  original: 'うが、是と我々の「舌切雀」との間には、主人公が雀であるといふ一點以外、本來はさう澤山

    の一致は無いのであつた。善人の婆の家が富貴となり、鄰の慾深婆は難儀をするといふだけ

    ならば、殆と半分以上の昔話に附いてまはつて居る。是は一方が純然たる動物報恩譚なるに

    反して、此方は單に拾つて養ひ育てたといふことが幸運の機緣となつて居るので、其點は寧

    ろ桃太郞や瓜子姫の方に近いのである。だから若し瓜と桃とが入れ代つた如く、又はヨケナ

    イ童子が肥前島原で黑い犬の話となり、越中の灰まき爺に於て、桃の中から犬ころが出たと

    いふ如く、話の主人公が雀の形を以て現れたことが後年の變化であると假定すれば、愈〻以て

    腰折雀の命を助けたといふ話から、系統を引くものとは言ひにくくなるのである。果して曲

    亭馬琴以後の註釋家が、桃とか犬とか雀とかいふ部分を、古今不變の要素であるかの如く、

    取扱つて居たのが正しいかどうか。今度は一つ其點を考へて見ようと思ふ。

    今ある赤本系の舌切雀に於ては、興味の中心は旣に糊を食べて舌を切られたことや、重い

    葛籠を慾ばつて損したことなどに移つて、話はよほど又原の型から遠くなつて居る。童話の

    改造は一般に可なり自由なもので、其爲に曾て大切な箇條であつたものが、蔭の方へ押遣ら

    れる場合は屢。有つたらうが、それがもし痕形も無く消えてしまつて居たならば、同じ話で

    通用し得た筈が無い。尋ねたら必ず何處かの隅に、少なくも中間の階段のものが殘つて居な

    ければならぬ。ところが今日までの採集だけでは、腰折雀との連絡はまだ一向に付かぬのみ

    ならず、寧ろ反對に我々の桃太郞の方へ、少しづつ近くなつて行かうとする傾向が窺はれる

    のである。以前喜田博士が報ぜられた德島縣那賀郡の例で(鄕土研究一卷五號)、桃の代りに瓜

    が流れて來て、中から雀が出て其雀が後に舌切雀になるといふ話などは、或は近世の事を好

    む者が、わざと繼ぎ合せたものかとも想像せられて居るが、さうで無かつた證據が追々に出

    て來たのである。獨り桃の中から犬ころといふ一例に止まらず、近頃刊行せられた津輕口碑

    集の中にも東郡野内村の例として「尾つぱ剪雀」の一話が採錄せられて居る。

    昔々婆が川へ洗ひ物に行くと、鳥籠が流れて來た。きたない籠はあちへ行け、きれいな

    籠はこちへ來いといふと、其言葉の通りになつた。婆は大喜びで其籠を携へて還り、爺

    樣々々、綺麗な娘子を一人拾つて來た。あゝさうか、娘なら此糊を摺らせろと、其雀に

    糊をすらせると、腹がへつて居るので、ちゆんと啼いては一口、ちゆんと啼いては又一'
  translation: 'う。しかし、これと私たちの「舌切雀」との間には、主人公が雀だという一点以外、もともとそれほど多くの一致はなかった。善良な婆の家が豊かになり、隣の欲深い婆が苦しむというだけなら、ほとんど半数以上の昔話に伴うものだ。一方が純粋な動物の恩返しの話なのに対して、こちらでは、単に拾って養い育てたことが幸運のきっかけになっている。その点では、むしろ桃太郎や瓜子姫に近い。

    だから、瓜と桃が入れ替わったように、あるいはヨケナイ童子が肥前島原では黒い犬の話になり、越中の灰まき爺では桃から子犬が出てきたように、主人公が雀の姿で現れるのも後年の変化だと仮定すれば、「腰折雀」の命を助けた話から系統を引くとは、ますます言いにくくなる。曲亭馬琴以後の注釈者たちが、桃、犬、雀といった部分を、昔から今まで変わらない要素のように扱っていたのは、本当に正しいのだろうか。今度は、この点を考えてみたい。

    現在ある、赤本系統の「舌切雀」では、面白さの中心はすでに、糊を食べて舌を切られたことや、重い葛籠を欲張って損をしたことなどへ移り、話は元の型から、さらにかなり遠ざかっている。童話の作り変えは一般に相当自由で、そのため、かつて大切だった要素が陰へ押しやられることも、しばしばあっただろう。しかし、それが跡形もなく消えていたなら、同じ話として通用するはずがない。探せば、必ずどこか片隅に、少なくとも中間の段階のものが残っているはずだ。ところが、今日までの採集では、「腰折雀」とのつながりはまだまったくつかめない。それどころか、逆に、私たちの桃太郎の方へ少しずつ近づいていく傾向がうかがえる。

    以前、喜田博士が報告した徳島県那賀郡の例（『郷土研究』一巻五号）には、桃の代わりに瓜が流れてきて、中から雀が出て、その雀がのちに舌切雀になるという話がある。近世の物好きがわざとつなぎ合わせたのかとも考えられていたが、そうではなかった証拠が次第に出てきた。桃から子犬が出てくる一例だけではなく、最近刊行された『津軽口碑集』にも、東郡野内村の例として「尾っぱ剪雀」の話が採録されている。

    「昔々、婆が川へ洗い物に行くと、鳥籠が流れてきた。『汚い籠はあっちへ行け、きれいな籠はこっちへおいで』と言うと、そのとおりになった。婆は大喜びで籠を持ち帰り、『爺さん、爺さん、きれいな娘を一人拾ってきたよ』と言った。『ああ、そうか。娘なら、この糊をすらせろ』と、その雀に糊をすらせた。雀はお腹がすいていたので、ちゅんと鳴いては一口、ちゅんと鳴いてはまた一'
  notes:
  - 冒頭はscan114、末尾はscan116へ続く。
  - 赤本は、江戸期に刊行された子供向け絵入り本の一種。
  - 「ヨケナイ童子」は本書の別の箇所でも扱われる呼称。ここではそのまま保持。
  - 前のスキャンからの続き
  - 次のスキャンへ続く
  sequence: 120
- id: mmt-116-01
  scan: 116
  section: 田螺の長者／舌切雀と腰折雀
  original: '口と、其糊を皆食つてしまつた。爺は怒つて擂木で雀の頭を打ち、尾羽を剪つて追出し

    たのを、婆が跡から尋ねて行つて、途中で臼彫りと菅苅りに、おれが雀を見なかつたか

    と聞く條がある。さうして雀の處へ行つて見ると、金の臼に金の杵で、ぽつきり〳〵と

    米を搗いて居た。娘や娘や今迎へに來たどといふと、婆やよく來たと喜んで、金の膳金

    の箸金の椀で飯を食べさせ、後からついて來た爺には、猫の椀で飯を食はせた云々

    とあつて、それから輕いと重いの二つの葛籠になるのである。是について尙考へて見るのに、

    舌切りも元はこの尾羽剪りと同じく、折角授かつた雀を冷遇したといふことを意味するので

    はあらうが、幾ら子供の話としてもそれは餘りに不自然な空想であつて、何か基づく所が無

    ければ突如として思ひ付かれさうにも無い。多分は糊を食べたといふ部分が先づ高調せられ

    て、それから尾を剪るよりも舌を切つたといふ方に、話すことが似つかはしくなつたので

    あらう。假にこの想像が當つて居るとすれば、是も桃太郞の黍團子と同じく、異常誕生譚の

    男性のものに、古くから附隨して居た食物の一挿話の、變化であつたとも見られるのである。

    それから尙一つ、是も後人の技巧に成るかの如く、一應は誤解せられさうな「猿蟹合戰」の

    變つた型があつて、やはり雀が參與して居る。以前佐々木君の採錄した陸中の老媼夜譚に、次

    のやうな昔話が見えて居て、其類例はまだ他では發見せられない。

    一羽の雀が竹藪に巢をかけて卵を生んだ處へ、山母が遣つて來て、雀々、其卵を一つく

    れといふ。雀は怖ろしさに卵を與へると、もう一つもう一つと言つて皆取つた揚句、親

    鳥までも食つてしまつた。其時たつた一つだけ籔の中に落ちて孵つた卵が、後に大きく

    なつて仇討を企てる。彼方の稻架から稻穗を取り、此方の稻架から稻穗を取つて、それ

    を集めて團子を拵へて、それを背に負うて米の團子の本團子とふれてあるく。向ふから

    栃の實が轉がつて來て、雀の息子どの何處へ行く。おれは親の讐を討ちに行く。そんな

    らその團子を一つくれ、助太刀をしようと言つて、團子を貰つて跡に附いて來た。次に

    針と蟹と牛糞と臼とが遣つて來て、順々に同じ問答をして味方になる。山母の家に往つ

    て見ると留守であつたので、是も猿蟹の合戰と同じく、手分けをして匿れて居る。そこ

    へ日の暮方に山母が戾つて來て、爐に踏み跨がれば栃の實が跳ね、筵に尻餅をつけば針

    が刺し、水桶に入ると蟹がはさみ、走つて遁げようとして牛の糞にすべつた處へ、上か'
  translation: '口と、糊を全部食べてしまった。爺は怒って、すりこぎで雀の頭をたたき、尾羽を切って追い出した。婆があとを追って訪ねていき、途中で臼を彫る人と菅を刈る人に、『おれの雀を見なかったか』と聞くくだりがある。雀のところへ行くと、金の臼と金の杵で、ぽっきりぽっきりと米をついていた。『娘よ、娘よ、今迎えに来たぞ』と言うと、『婆さん、よく来たね』と喜び、金の膳、金の箸、金の椀でご飯を食べさせた。あとからついてきた爺には、猫の椀でご飯を食べさせた、などという。」

    そして、そのあと、軽いものと重いものの二つの葛籠の話になる。この点をもう少し考えると、舌切りも、もとは尾羽を切るのと同じく、せっかく授かった雀を冷たく扱ったことを意味するのだろう。しかし、いくら子供向けの話でも、舌を切るのはあまりに不自然な空想で、何か根拠がなければ突然思いつきそうもない。おそらく、まず糊を食べたくだりが強調され、そのため、尾を切るより舌を切ると語る方がふさわしくなったのだろう。もしこの想像が当たっていれば、これも桃太郎の黍団子と同じく、不思議な誕生の話のうち男性の主人公を扱うものに、古くから伴っていた食物の挿話が変化したものと見ることができる。

    もう一つ、これも後の人が技巧によって作ったものだと、ひとまず誤解されそうな、「猿蟹合戦」の変わった型があり、やはり雀が登場する。以前、佐々木君が採録した陸中の『老媼夜譚』に、次のような昔話が載っていて、似た例はまだほかには見つかっていない。

    「一羽の雀が竹藪に巣を掛けて卵を産むと、山母が来て、『雀、雀、その卵を一つくれ』と言った。雀が怖がって卵を与えると、もう一つ、もう一つと言い、全部取ったあげく、親鳥まで食べてしまった。そのとき、一つだけ藪の中へ落ちてかえった卵が、のちに成長して、仇討ちを計画する。あちらの稲架から稲穂を取り、こちらの稲架からも稲穂を取り、集めて団子を作った。それを背負い、『米の団子の本団子』と触れて歩く。向こうから栃の実が転がってきて、『雀の息子さん、どこへ行く』『おれは親の仇を討ちに行く』『それなら団子を一つくれ、助太刀しよう』と言い、団子をもらってついてきた。次に針、蟹、牛糞、臼が来て、順々に同じ問答をして味方になる。山母の家へ行くと留守だったので、これも猿蟹合戦と同じく、手分けして隠れた。夕暮れに山母が帰り、炉をまたぐと栃の実がはね、筵に尻餅をつくと針が刺し、水桶へ入ると蟹がはさんだ。走って逃げようとして牛の糞で滑ったところへ、上か'
  notes:
  - 冒頭はscan115、末尾はscan117へ続く。
  - 稲架（はさ）は、刈り取った稲を掛けて干すための設備。
  - 「山母」は原文の振り仮名では「やまはは」。山姥の別称として表記を保持。
  - 前のスキャンからの続き
  - 次のスキャンへ続く

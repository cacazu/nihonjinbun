  section: 瓜子織姫／九 瓜子姫の復活
  original: 居る。たゞ斯ういふ眼前の事象に對する興味ある解說は、常に鮮明なる印象を始めて聽く者の胸に刻み得たが故に、大切なる語りごとには出來る限り之を取添へて、屢〻聯想し又記憶するやうにしたことだけは想像せられるので、所謂why
    so storiesは言はば神話の容器であり、同時に又前者を昔話化させて行く、一種の酵母の如き役を勤めたものと思ふ。奈良朝時代の諸國風土記に、多く現れて居る地名談なども、目的はこの「蕎麥の莖はなぜ赤い」と同じく、最初よりさう信じて居た人が、語らうとしたものと見るわけには行かぬ。更に一步を進めると、中世の說話の一つの特色たる本地譚なども、事はそれ自身信仰に關係があるとはいへ、それを主張する爲にはあの樣な長話の必要は無かつたのだから、乃ち亦人をしてある古くからの口碑を保存せしめる爲に、わざと附け添へて置いた記念塔の類に過ぎなかつたと思ふ。我々の歷史に書籍ある如く、文字無き古人の古事を傳ふる爲には、何か思ひ出し易い目標が無くてはならなかつた。傳說が石や木や淵池に據つて傳はる如く、說話には又この「蕎麥の莖」などが、支柱として常に入用であつたのである。(昭和五年五月、旅と傳說)
  translation: 'いる。ただ、こうした目の前の事象についての興味深い説明は、初めて聞く人の心に、いつも鮮明な印象を刻むことができた。そのため、大切な語りごとには、できる限りこれを添えて、たびたび連想し、記憶するようにした――そのことは推測できる。いわゆる
    why so stories（なぜそうなのかを語る話）は、いわば神話の容器であり、同時に、神話を昔話へ変えていく、一種の酵母のような役割を果たしたのだと思う。

    奈良時代の各地の『風土記』に数多く現れる地名の由来話なども、目的は、この「蕎麦の茎はなぜ赤い」と同じである。初めから、そのように信じていた人が語ろうとしたもの、と見るわけにはいかない。

    さらに一歩進めると、中世の説話の特色の一つである本地譚なども、内容自体は信仰に関わるとはいえ、それを主張するためだけなら、あのような長い話は必要なかった。したがって、これもまた、昔からの伝承を人々に保存させるため、わざと添えておいた記念塔のようなものにすぎなかったと思う。

    私たちの歴史に書物があるように、文字を持たない昔の人々が、古い出来事を伝えるには、何か思い出しやすい目印が必要だった。伝説が石や木や淵・池をよりどころとして伝わるように、説話にも、この「蕎麦の茎」などが、支えとしていつも必要だったのである。

    （昭和五年〔一九三〇年〕五月、『旅と伝説』）'

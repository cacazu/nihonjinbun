  original: ふ非難を恐れて、最後に今一つの「桃太郎」との類似を述べて置くだけに止める。アマノジヤク乃至は山母の化の皮が、どうして露れたかといふ點は、殊に話し方が區々になつて居る。最も奇拔なのは山母が姫を食つてしまつて、其皮を顏に當てて姫に成りすまして居るのを、血が附いて居るからよく洗へと言つて、手拭でごしごしこすつて遣ると、皮がとれてしまつて正體が知れたといふのもあるし(三、五、七)、も少しとぼけたのでは瓜子姫の機を織る音が常にカランコロンキコパタントンと調子よく聽えたのに、今日に限つてドチバタと變な音がするので、障子の隙から覗いて見ると、アマンジヤクの尻尾がだらりと下つて居る。それで忽ち瓜子姫の讐と心づいて、斧を持つて來て斫り殺したといふのもある(一)。併し斯ういふ亂雜の中にも、注意して見ると尙一筋の聯絡はあるので、例へば出雲の例(一〇)に於てアマノジヤクを駕籠に載せて、鎭守樣へ參らうとして居ると、柿の木に縛られて居た本物の瓜姫が、「ヨーヨーアマノジヤクばかりお駕籠に乘つてヨーヨー」と泣いたので、始めて心付いてアマノジヤクの首を打落したとあるのを、石見の方に於ては前にも揭げてある如く、柿の木谷を通ると柿の木の梢に縛られた姫が、吾が乘りて行くのにアマノジヤクこそ乘りて行くかやピーロロロと啼いたといふ風に話して居る。此ピーロロは明らかに鳶の聲であつて、瓜子姫がそんなことをいふのは奇妙であるが、陸中上閉伊郡の例(四)に於ては、親が贋物の瓜子姫子を馬に乘せて、愈嫁に遣らうとして支度をして居ると、出口の木の枝に烏がとまつて居て、瓜子姫子は乘せないで山母乘せたカアカアと鳴き、又庭に居た鷄が、糠屋の隅こを見ろぢやケケロと鳴いて教へてくれたので、急いで糠屋に入つて見たら、姫子の骨が吊されてあつたと謂つて居る。是と最も近い遠野物語の昔話に於ては、教へて吳れたのは二度とも家の鶏であつて、おり子姫子載せなえで
  translation: 'う非難を恐れて、最後に、もう一つ「桃太郎」との類似を述べるだけにしておく。

    アマノジャク、または山母の化けの皮が、どのようにしてはがれたかという点は、とりわけ語り方がさまざまである。最も奇抜なのは、山母が姫を食べてしまい、その皮を顔に当てて姫になりすましているのを、血がついているからよく洗いなさいと言い、手拭いでごしごしこすってやると、皮が取れて正体がわかった、という話だ（三、五、七）。

    もう少しとぼけたものでは、瓜子姫の機織りの音は、いつもカランコロンキコパタントンと調子よく聞こえていたのに、その日に限ってドチバタと変な音がする。障子の隙間からのぞくと、アマンジャクの尻尾がだらりと垂れていた。そこで、たちまち瓜子姫の敵だと気づき、斧を持ってきて斬り殺した、という話もある（一）。

    しかし、このばらばらな話の中にも、注意して見ると、なお一本のつながりがある。たとえば出雲の例（十）では、アマノジャクを駕籠に乗せて鎮守様へ参ろうとしていると、柿の木に縛られていた本物の瓜姫が、「ヨーヨー、アマノジャクばかり駕籠に乗って、ヨーヨー」と泣いた。そこで初めて気づき、アマノジャクの首を斬り落とした、とある。

    これが石見では、先に挙げたとおり、柿の木谷を通ると、柿の梢に縛られた姫が、「私が乗っていくはずなのに、アマノジャクが乗っていくのかい、ピーロロ……」と鳴いた、というふうに語られている。このピーロロは、明らかに鳶の声であって、瓜子姫がそのように言うのは奇妙である。

    一方、陸中上閉伊郡の例（四）では、親が偽物の瓜子姫子を馬に乗せ、いよいよ嫁入りさせようと支度していると、出口の木の枝に烏が止まって、「瓜子姫子は乗せないで、山母乗せた、カアカア」と鳴く。また、庭の鶏が、「糠屋の隅を見てごらん、ケケロ」と鳴いて教えてくれた。急いで糠屋に入ってみると、姫子の骨がつるしてあったという。

    これに最も近い『遠野物語』の昔話では、教えてくれたのは二度とも家の鶏であり、「おり子姫子乗せないで'

  section: 和泉式部の足袋／七 清少納言の亡霊
  original: 阿波の撫養浦を中心にした清少納言の傳說は、餘りにも奇拔で又粗野である爲に、却つて面白がつて之を評判する者が今でもあるが、其起りは亦一團の念佛比丘尼から出て居た。故三宅博士の發見せられた以文會筆記卷五に、寺居菊居といふ人が眞面目に此問題を取扱つて居る。里浦の漁村に有る尼塚と稱する塚を、清女落魄して爰に來て世を終つた墓であると謂ふ。上臈が浦人に苦しめられたといふ話は太平記以來であるが、爰では其崇りで惡疾を煩ふ者が多く、其靈を慰めんが爲に塚の前に祭をするが例となり、尼念佛といふものが久しく傳はつて居たといふ。蛤の貝に穴をあけたもの七八つを絲に貫いて、是を塚に掛けて祈る習ひもあつた。かの貽貝の由來などといふ御話にもならぬ話が、是と無關係に發生したもので無いことは想像し得る。さうして同じ女性の遺跡といふものは、更に傍近の地にまで弘まつて居るのである。寶永年間のこととも謂ひ、或は享保中の事實であつたともいふ。讃岐の金比羅山の麓の寺で、鐘樓を築く爲に、昔がら清少納言の墓だといふ土地に工事をしようとした處、和尙の夜の夢に美しい官女が現はれて歌を詠んだ。うつゝなき跡のしるしを誰にかは問はれんなれど有りてしもがな意味は大よそ知れる樣だが、言葉は何だか變だ。清少納言の爲には冤罪の甚だしきものであつたが、それでも感歎して是を後に傳へて居る。此記事は笈埃隨筆·閑田耕筆·提醒紀談等の各書爭ひ載せ、旣に動かすべからざるものになつて居るかと思ふと、現在は夢を見た人が某といふ町の商家の主人で、其故に今も此家を告の茶屋と稱すとも傳へられる。さうして同じ話が又遠方の土地にもあつたのである。たとへば一話一言卷四八に、近江國にも清塚といふ古墳があつて、是を掘移さうとしたら亦村民が夢を見たとある。都の女房とおぼしき美女、紅の衣しどけなく着なして、短册を前に置いて行つた。夢の中に其歌を記憶して居て人に告げたといふのが、うつゝなき跡のしるしを誰にかも問はれしもがな忘られもせず是も餘程のかた言だと思ふが、京都では是は清少納言の墓のよし、公卿衆議あつて其儘にさし置かしめたと、土地の醫者らしき人の筆記に殘つて居たといふ。それから東に向ふと、話は今一段と突拍子になつて居る。宮川舍漫筆卷一に、甲州韮崎附近の某寺に古墓があつた。
  translation: '阿波の撫養浦を中心とする清少納言の伝説は、あまりにも奇抜で粗野なため、かえって面白がって話題にする人が今でもいるが、その起源もまた一団の念仏比丘尼にあった。故三宅博士が発見した『以文会筆記』巻五では、寺居菊居という人がこの問題を真剣に取り上げている。里浦の漁村にある「尼塚」と呼ぶ塚を、清少納言が落ちぶれてここに来て、亡くなった墓だという。高貴な女性が浦の人々に苦しめられたという話は『太平記』以来のものだが、ここではそのたたりによって悪い病気を患う人が多く、その霊を慰めるため塚の前で祭りをするのが慣例となり、「尼念仏」というものが長く伝わっていたという。穴を開けたハマグリの貝殻を七、八個、糸に通し、塚に掛けて祈る習慣もあった。あの貽貝の由来などという、話にもならない話が、これと無関係に生まれたのではないことは想像できる。そして、同じ女性の遺跡と呼ばれるものは、さらに近隣の土地にも広がっている。

    宝永年間のこととも、享保年間に実際にあったことともいう。讃岐の金比羅山の麓の寺で、鐘楼を建てるため、昔から清少納言の墓だという土地に工事をしようとした。すると和尚の夜の夢に、美しい女官が現れて歌を詠んだ。

    「現実の身もない私の跡を示すこのしるしを、誰が訪ねてくれるものでもないでしょうが、それでも残っていてほしいものです。」

    意味はおおよそわかるようだが、言葉遣いは何だか変だ。清少納言にとってはとんだ濡れ衣だったが、それでも人々は感心して後世に伝えている。この話は『笈埃随筆』『閑田耕筆』『提醒紀談』などの諸書が競って載せており、すでに動かしがたいものになったかと思えば、現在では夢を見た人はある町の商家の主人で、そのため今もその家を「告の茶屋」と呼ぶとも伝えられる。そして同じ話が、また遠方の土地にもあった。たとえば『一話一言』巻四十八には、近江国にも「清塚」という古墳があり、掘り返して移そうとしたところ、やはり村人が夢を見たとある。都の女房と思われる美女が、紅色の衣をくつろいだ姿で着て、短冊を前に置いて去った。夢の中でその歌を覚え、人に知らせたというのが、次の歌である。

    「現実の身もない私の跡を示すこのしるしを、誰かに訪ねてもらいたい、忘れ去られもせずに。」

    これもよほど不完全な言葉遣いだと思うが、京都では公卿たちが相談し、これは清少納言の墓であるからそのままにしておかせた、と土地の医者らしい人の筆記に残されていたという。そこから東へ向かうと、話はさらに突拍子もないものとなる。『宮川舎漫筆』巻一には、甲州韮崎付近のある寺に古い墓があった。'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン259）と本文OCRを照合。
  - 人名「寺居菊居」、書名「宮川舍漫筆」を画像で確認。貝名は「貽貝」、添えられた読みは「いのかひ」と読める。歌の文法の不自然さは著者自身の指摘に従い保持し、意味の取れる範囲で訳した。

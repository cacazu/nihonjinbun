  section: 鄰の寝太郎／衣服交換
  original: 'のである。是は大變なことをしてくれたと男は悲しんだが、もはや致し方は無いのでその蓑

    笠の灰を身に塗ると、奇瑞はまだあつて是でもやはり體は隱れて見えない、それで酒屋の倉

    へ入り込んで上等の酒を腹一ぱい飮んで、ぐつすりと寢てしまふ。其うちに滴が足にこぼれ

    て灰が落ちてそこだけ身が露はれ、足の化物が鼾をかいて寢て居ると言つて、店中大騒ぎを

    したといふ迄はどこの地方も同じだが、爰では博徒の女房が之を聽きつけて、私がまじなひ

    をして遣るからと言つて倉に入り、そつと亭主を喚び起して遁がしてしまひ、酒屋からは又

    澤山の御禮を貰つたといふ風に話して居る(郷土誌稿一卷一八六頁)。此種の昔話はどうせ誰だ

    つて本の事だとは思つて居ない。從うて話者の才覺で、其場きりのおまけを添へたことも想

    像せられるので、是あるが爲に最も古い形と迄は斷言することは出來ぬ。しかも假に復活で

    あり又は轉用であつたにしても、由緒無しには斯ういふ一條は挿まれ得なかつた。殊に蓑笠

    を燒棄てて灰にしたといふことは何處にもあり、それが必ず母であり女房であつたといふな

    ども、是と伴なふ今一回の女性干與がある爲に、始めて偶然の一致で無かつたことが知れる

    のである。寢太郞が突如として長者の聟になつたといへば、もう其以上の解說は不用であつ

    たかも知れぬが、此方はあまりに實際から遠い空想であつた。それ故に他の多くの同系說話

    に在つては、幸福なる婚姻は必ず寶物を伴なひ、又は女房が自身の力を以て、次第に家を樂

    しく又富裕にしたことになつて居るのである。尙山寺の獨法師が狐と問答して、狐は和尙の

    衣を借りて法師になつてあるいて見露はされ、法師は又その狐の隱れ蓑を着て、人の家の土

    藏に入つて捉へられた話は、萬治二年刊の百物語卷下にも出て居る。近頃しやれ始めた話で

    はなかつたのである。'
  translation: 'のである。男は、なんという大変なことをしてくれたのかと悲しんだ。しかし、もうどうしようもないので、その蓑笠の灰を体に塗ると、不思議な効力はまだ残っていて、それでもやはり体が隠れて見えなくなった。そこで酒屋の倉に入り込み、上等な酒を腹いっぱい飲んで、ぐっすり眠ってしまう。そのうちに酒のしずくが足にこぼれ、灰が落ちて、そこだけ体が現れた。足だけの化け物がいびきをかいて寝ていると、店じゅうが大騒ぎした、というところまでは、どこの地方でも同じである。ところがここでは、博打打ちの妻がそれを聞きつけ、「私がまじないをしてあげます」と言って倉に入り、そっと夫を起こして逃がしてしまい、そのうえ酒屋からもたくさんのお礼をもらった、と語られている（『郷土誌稿』一巻一八六頁）。

    こうした昔話は、もともと誰も本当のことだとは思っていない。したがって、語り手が機転を利かせ、その場限りのおまけを付け足したことも考えられるから、このくだりがあるというだけで、最も古い形だとまでは断言できない。それでも、仮に古い要素の復活や、ほかの話からの転用であったとしても、何のいわれもなく、このような一節を差し挟むことはできなかったはずである。とくに、蓑笠を焼き捨てて灰にするというくだりはどこにもあり、その役が必ず母親か妻になっている。このことも、それに伴って、もう一度女性が関与する場面があるために、初めて偶然の一致ではなかったと分かるのである。

    寝太郎が突然長者の婿になったと言えば、それ以上の説明はもう必要なかったかもしれない。しかし、それはあまりにも現実から遠い空想だった。そのため、同じ系統のほかの多くの説話では、幸福な結婚には必ず宝物が伴うか、あるいは妻が自分の力で、家を次第に楽しく豊かにしていったことになっているのである。

    なお、山寺で独り暮らす法師が狐と話をし、狐は和尚の衣を借りて法師に化けて歩いているうちに正体を見破られ、法師もまた、その狐の隠れ蓑を着て他人の家の土蔵に入り、捕らえられたという話は、万治二年刊の『百物語』巻下にも出ている。近ごろになって面白おかしく語り始めた話ではなかったのである。'

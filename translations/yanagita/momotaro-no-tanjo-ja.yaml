- id: mmt-143-01
  scan: 143
  section: 田螺の長者／田螺聟入
  original: 'けてくれるものが有れば、三人の娘の一人を嫁に遣らうと言つた。さうすると次の日には其

    田に漫々と水が湛へられて、田螺が美しい和子樣になつて嫁迎へに來た。さうして三人ある

    末の娘を、水の底の立派な家へ連れて行つた云々。それからあとは今その本が手元に無いの

    で引用し得ない。蛇の聟入の話でも、父の約束の理由は色々あるが、一ばん數多く且つ古い

    形は、是と同樣に稻田の水の必要からであつた。それを童話の猿聟入では、牛蒡を拔くのを

    手傅つて貰つてと言つたり、又は蛇の場合でも、蛙を助けてやるなら娘を遣らうと言つたな

    どと、もう最初から笑ふやうな話にしてしまつて居るのである。田螺に田の水を掛けて貰

    ふなども、突拍子も無いことの樣であるが、越後などには今でも山の池の白田螺に、雨を禱

    るといふ習俗が殘つて居る。

    肥前の島原では、この蛇聟入の昔話が河童の聟になつて居る例がある(榊木敏君、旅と傳說二

    卷八號)。むかし北有馬の庄屋の田に、どうしても水がかゝらぬことがあつた。氏神に願を掛

    けると夢の御告があつて、是は美しい一人娘を、有馬川の河童が嫁にほしがつて居るのだ。

    娘を河童に遣ればすぐに水は來るとのことであつた。それで心配をして娘に話すと、娘は承

    知をして一つの瓢簞を持つて河童の所へ行つた。嫁になりますから早く田に水をあてて下さ

    い。此瓢簞は私の魂です。是が沈んだらいつでも參りますと言つて、

    それを有馬川に投込ん

    で歸つて來た。さうすると庄屋の田には水が盈ち稻が繁り、其以後は秋の稻の稔る頃まで、

    一つの瓢簞が有馬川の淵に、浮いては沈み沈んでは浮きして居たといふのである。他の地方

    の蛇聟入の話にも瓢簞を持つて嫁入したといふ例は多く、猿聟入の方では是が一轉して木の

    臼の話にもなつて居る。さうして日本紀仁德紀十一年に出て居る備中縣守淵の虬〔字形不鮮明〕の話などが、

    この肥前の例と比べると似過ぎるほどよく似て居る。神を試みたといふ說話はもうあの頃か

    ら有つたのである。'
  translation: '――くれるものがあれば、三人の娘のうち一人を嫁にやろう」。すると翌日、その田には一面に水がたたえられ、田螺が美しい若様の姿になって嫁を迎えに来た。そして、三人のうちの末娘を、水底の立派な家へ連れていった、という。その先は今、その本が手元にないので引用できない。


    蛇の婿入りの話でも、父親が約束する理由はさまざまだが、いちばん多く、しかも古い形は、これと同じく、稲田に水が必要だったからである。それを童話の猿の婿入りでは、ゴボウを抜くのを手伝ってもらったためだと言ったり、蛇の場合でも、蛙を助けてやるなら娘をやろうと言ったとするなど、初めから笑い話にしてしまっている。田螺に田の水を引いてもらうことも、突拍子もないようだが、越後などには今でも、山の池の白い田螺に雨を祈る習俗が残っている。


    肥前の島原には、この蛇の婿入りの昔話が、河童の婿の話になっている例がある（榊木敏君、『旅と伝説』二巻八号）。昔、北有馬の庄屋の田へ、どうしても水がかからないことがあった。氏神に願掛けをすると夢でお告げがあり、「これは、有馬川の河童が、美しい一人娘を嫁に欲しがっているのだ。娘を河童にやれば、すぐに水は来る」ということだった。心配して娘に話すと、娘は承知し、ひょうたんを一つ持って河童のところへ行った。「嫁になりますから、早く田へ水を入れてください。このひょうたんは私の魂です。これが沈んだら、いつでも参ります」と言い、ひょうたんを有馬川へ投げ込んで帰ってきた。すると庄屋の田には水が満ち、稲が茂った。それから秋に稲が実るころまで、一つのひょうたんが有馬川の淵に浮いては沈み、沈んでは浮いていたという。


    ほかの地方の蛇の婿入りの話にも、ひょうたんを持って嫁いだという例は多い。猿の婿入りでは、それが変わって木の臼の話にもなっている。そして『日本紀』仁徳紀十一年に出てくる、備中の県守淵のみずち（水の怪物）の話などは、この肥前の例と比べると、似すぎるほどよく似ている。神を試したという説話は、すでにあのころからあったのである。'
  notes:
  - 冒頭はスキャン142の引用の続き。
  - Wikimedia Commonsの同一版正規ミラー画像143で全文・行順を照合。OCR「猿〓入」は「猿聟入」、「木の白」は「木の臼」と確認。末尾の水神名は虫偏の「虬／虯」系と読めるが、印字が不鮮明で異体字の別は断定できない。原文欄は「虬〔字形不鮮明〕」、訳は「みずち（水の怪物）」とした。独立確認者も同じ判読範囲で一致。

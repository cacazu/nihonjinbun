  section: 海神少童
  original: 'に、不幸に陷つたといふ話も方々の國に流布して居る。此點にかけてはハナタレ小僧樣の說

    話は、私たちのいふ鄰の爺型よりは一つ古いかと思はれる。

    此一人の柴苅爺を中心とする話し方は、西洋の說話研究者が輪廓もしくは額ぶち(Cadres)

    と謂つて居るものの一つであつた。其中でも是などは恐らく非常に古くからの樣式であつて、

    つまりは昔話の第一次の話し手がいつも老翁であり、又一人稱を以て自分自身の經歷のやう

    に話をする習ひであつた痕跡かと思ふ。記錄の殘つて居る中古以前の昔話で、類例を求める

    ならば竹取の翁、又は是から岐れて出たらしい箕作の翁であつて、是等は前半分がもつと桃

    太郞や瓜子姫に近く、後段は今ある蛇聟入とも似通うて居る。桃太郞の桃を拾ひ上げる爲に

    は、爺が柴苅りに行くことは少しでも關係が無い。それにも拘らず「爺は山へ柴苅りに」と語

    ることになつて居たのは、偶然ながらも以前あつたものの保存であつて、新らしい附加へで

    無かつたことが知れるのである。但し其薪と水の神樣との關係は、話の自然の推移ともいふ

    べきもので、必ずしも薪では無くとも、何か自分に大切な物を惜しげも無く差上げたといふ

    だけでよかつたことは、比較をして行くうちに追々判つて來るのである。

    三貧者の奉仕

    薪を龍宮に獻上したといふ話は、山に柴苅る老翁として、さう說くのが自然であつたとい

    ふに過ぎぬと思ふが、それでも起りは古かつたと見えて、南北に其例が數多く分布して居る。

    九州で今一つを擧げるならば、肥前の島原半島には次のやうな昔話があつて、報告者も其變

    化の奇拔なるに驚いて居る(旅と傳說二卷一〇號、山本靖民君)。

    昔々姉と妹との二人があつて、姉は金持の家に嫁入し、妹は山番の妻になつた。妹は每

    日山から薪を負うて町へ賣りに出たが、或日どうかして薪が賣れぬので、姉の家へ遣る

    のもいやだと思つて、其薪を海に投込んで歸つて來た。

    さういふことが何度か續いたところ、或日いつものやうに薪を海に投げて歸らうとする

    と、海の中から女が出て來て、龍宮へ來てくれと言つて案内した。その途で「歸りに何

    か土產を下さると言はれたら、黑猫を所望するがよい」と教へてくれた。何日か龍宮に

    逗留して後、いざ歸らうとする時に土產を遣らうと言はれたので、豫て教へられた通り'
  translation: 'に不幸に陥ったという話も、さまざまな国に広まっている。この点では、ハナタレ小僧様の物語は、私たちのいう「隣の爺型」よりも、一段階古いものではないかと思われる。

    この、一人の柴刈りのおじいさんを中心にする語り方は、西洋の説話研究者が輪郭、あるいは額縁（Cadres）と呼んでいるものの一つだった。中でもこの例などは、おそらく非常に古くからの形式である。つまり、昔話を最初に語り始めた者がいつも老人であり、しかも一人称を使って自分自身の経験のように話す習慣があった、その痕跡ではないかと思う。記録の残っている中古以前の昔話に似た例を求めれば、竹取の翁や、そこから分かれ出たらしい箕作の翁がある。これらは前半が、より桃太郎や瓜子姫に近く、後半は現在の蛇婿入りとも似ている。桃太郎の桃を拾い上げることと、おじいさんが柴刈りに行くことには、少しも関係がない。それにもかかわらず、「おじいさんは山へ柴刈りに」と語る決まりになっていたのは、たまたまではあっても、以前からあったものが保存されたのであり、新しく付け加えたものではなかったとわかる。ただし、薪と水の神との関係は、話の自然な移り変わりともいうべきものである。必ずしも薪でなくても、何か自分にとって大切なものを惜しまず差し上げたというだけでよかったことは、比較を進めるうちに次第に明らかになる。

    三　貧しい者の奉仕

    薪を竜宮に差し上げたという話は、山で柴を刈る老人なら、そう説明するのが自然だったというだけのことだと思う。それでも起こりは古かったらしく、南から北まで多くの例が分布している。九州でもう一例挙げるなら、肥前の島原半島には次のような昔話があり、報告者もその変化の意外さに驚いている（『旅と伝説』二巻一〇号、山本靖民君）。

    昔々、姉と妹がいた。姉は金持ちの家に嫁ぎ、妹は山番の妻になった。妹は毎日、山から薪を背負って町へ売りに出たが、ある日、どうしたわけか薪が売れないので、姉の家へやるのも嫌だと思い、その薪を海へ投げ込んで帰ってきた。

    そんなことが何度か続いた後、ある日、いつものように薪を海へ投げて帰ろうとすると、海の中から女が現れ、竜宮へ来てくれと言って案内した。その途中で、「帰りに何か土産をやろうと言われたら、黒猫をお願いするとよい」と教えてくれた。何日か竜宮に滞在した後、いざ帰ろうとするときに土産をやろうと言われたので、前もって教えられたとおり'

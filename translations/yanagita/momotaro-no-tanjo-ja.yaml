  section: 田螺の長者／四 タミナの婿とツブの長者
  original: 'の鳥居の處に來て見ると、夫の田螺はそこに見えなかつた。はて是はどうしたか。田の

    中にでもすべり込んだので無かべかと思つて見てあるいたが、如何にも田の中に數あま

    たのツブは居るけれども、尋ねる夫は居なかつた。田毎々々のツブの數を、一つ一つ手

    に取つて見ても、みんな自分の夫のツブで無い。嫁こは歎き悲しんで、

    つぶ殿や、つぶ殿や、わがつまや

    ことしも春になつたれば

    烏といふ馬鹿鳥に

    ちつくりもつくり刺されたか。

    斯う言つて歌ひながら、がぶがぶと田の中をこいであるいたから、嫁この美しいのゝは

    泥だらけになり、美しい顏は泣いて泣いて泥まみれになつた。御祭の人たちはそれを見

    て笑つた。夫をなくしてはとゞにもがゞにも申しわけが無い。是はいつそのこと田の中

    のやぢまなぐ(萢眼)にでも入つて死んでしまうべと思つて、ぢりぢりと泥の深みに沈ん

    で行かうとして居ると、後の方からこれ嫁こ嫁こ、何して居ると聲を掛ける者がある。

    振返つて見れば水の垂るやうな美しい若者が、深編笠を被り腰に尺八を差して居た。ど

    この御方だか知らないが、私は大事の夫をなくしたので、どうしても死なねばならながん

    すと泣いて話すと、お前の夫のツブこそはこの私だ、さあ早く上つておれの顏をよく見

    れと、嫁こをやぢまなぐから田の畔に抱き上げた。おれは御水神樣の申し兒であつた故

    に、今まではツブの姿をして居たけれども、けふといふ今日はお前が藥師樣に參詣して

    くれたので、斯うして漸く人間の姿になることが出來た。悅んでくれと手に手を取合つ

    て親の家に戾つて來る。家では父と母とがそれを見て、あれや、姉こは何處の和子樣を

    御連れ申した。いや、此人は何處の和子樣でも無い。うちのツブ殿が今日斯うなつたま

    すと、詳しくわけを話してきかせると、二人の親は天地がひつくりかへつた程喜んで、

    急いで長者どんに知らせる。さうすると旦那樣もかゞ樣も飛んで來た。さうして花のや

    うな聟殿を見て、是は又何たらえゝ事だ。おら必ず斯んなことが、いつかあることだと

    思つて居た。何が何でも斯んな立派な聟殿を、斯んな古家の破れ家には置かれないと、

    すぐさま町に廣い町屋敷を買うて、そこに見事な家を建てて若い夫婦を住はせ、二人は'
  translation: '――の鳥居のところへ来てみると、夫の田螺はそこに見えなかった。「いったいどうしたのだろう。田んぼの中へ滑り込んだのではないか」と思い、見て回った。確かに田にはたくさんのツブがいるが、探している夫はいなかった。田ごとにいるツブを一つずつ手に取ってみても、みな自分の夫のツブではない。嫁は嘆き悲しみ、


    ツブ殿よ、ツブ殿よ、私の夫よ。

    今年も春になったので、

    烏というばかな鳥に、

    ちくりもくりと、つつかれたのか。


    こう歌いながら、がぶがぶと田の中をかき分けて歩いたので、美しい着物は泥だらけになり、美しい顔も泣いて泣いて泥まみれになった。祭りに来た人たちはそれを見て笑った。夫を失っては、お父さんにもお母さんにも申し訳ない、いっそ田の中の「やぢまなぐ」にでも入って死んでしまおうと、じりじりと泥の深みに沈もうとしていた。すると後ろから、「おい、嫁、嫁、何をしている」と声をかける者がある。


    振り返ると、みずみずしいほど美しい若者が、深編笠をかぶり、腰に尺八を差していた。「どちらの方か存じませんが、私は大事な夫をなくしたので、どうしても死ななければなりません」と泣いて話すと、「お前の夫のツブこそ、この私だ。さあ、早く上がって、おれの顔をよく見ろ」と言い、嫁を「やぢまなぐ」から田の畔に抱き上げた。「おれは水神様の申し子だったので、今まではツブの姿をしていた。しかし今日という今日は、お前が薬師様へお参りしてくれたので、こうして、ようやく人間の姿になれたのだ。喜んでくれ」と、手を取り合って親の家へ帰ってきた。


    家では父と母がそれを見て、「おや、お嬢さん、どちらの若様をお連れしたのだ」と言った。「いいえ、この人はよその若様ではありません。うちのツブ殿が、今日こうなったのです」と詳しく話して聞かせると、両親は天地がひっくり返ったほど喜び、急いで長者どんへ知らせた。すると旦那様も奥様も飛んできた。花のような婿を見て、「これはまた、何とうれしいことだ。必ずこんなことがいつかあると思っていた。何が何でも、こんな立派な婿を、こんな古びた壊れかけの家には置いておけない」と、すぐに町へ広い屋敷地を買い、そこに見事な家を建てて、若い夫婦を住まわせた。二人は――'
  notes:
  - スキャン129から続く引用。末尾はスキャン131へ続く。
  - 「やぢまなぐ」は底本で「萢眼」と補記された方言。ここでは田の深い泥の箇所として訳した。

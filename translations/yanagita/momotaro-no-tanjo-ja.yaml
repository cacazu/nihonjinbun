  section: 隣の寝太郎／山田の露
  original: 治左衞門とてかしこき男內裡しらすのやに取られつゝ塵を拾うて勤めて居たがみすの戀風吹きまくりつゝ一のきさきの白瀧さまのつぼねまるねのおん姿をばひとめ見るよりはや戀となりけふかあすかの病となりて云々それが結局は和歌の應酬によつて貴人を感ぜしめまつり、姫を宿の妻に賜はつて故鄕に還り、子孫繁昌したといふ一條の物語である。以前兵庫踊の名を以て此物語の流布して居たのは、少なくとも又百年の昔のことであるが、其內容には格別の變化は無いものと見えて、現に攝陽群談卷八に記述せられたる山田白瀧贈答の歌なども、雲だにもかゝらぬ峯の白瀧をさのみな戀ひそ山田をとこよみな月の稻葉の末のこがるゝに山田に落ちよ白瀧の水となつて居る。是を備中の小島や私の生國などでは、意味が解らぬ故にたゞ少しづつまちがへて歌つて居ただけである。桃太郞の說話の研究者として、注意しなければならぬことが三つある。其一つは是ほど久しい間、定まつた形を以て流傳して居た說話でも、やはり中世の或機會に、誰かの手によつて改作せられ潤飾せられたといふことが、和歌によつて確認し得らるゝ點である。面白い歌には相異無いが、「雲だにも」の一首は到底選集時代の御姫樣らしい物の言ひ樣では無かつた。是でも通用したといふことそれ自身が、文學の今少し荒々しい階級まで、普及してから後の作であることを推定せしめる。假に此點が足利末頃などの時世粧であつたとすると、殘る部分の常民が面白く珍らしい言葉の力に由つて、優れた配偶者を獲たといふだけが、一方には寢太郞·一寸法師等の多くの等類を引くのみならず、他の一方には又遠く更科日記の著者が、武藏の竹芝で採集して來た民譚とも、別種とは言はれない一致を認めることになるのである。今昔物語卷三〇の大納言娘被取内舍人語、及び同じ話を略出した大和物語卷下に、是をかの安積山影さへ見ゆる山の井の歌を詠じた上臈の物語として傳
  translation: '……治左衛門という、利口な男がいた。

    内裏の「しらすのや」に召し出され、

    塵を拾って勤めていたが、

    御簾に恋の風が吹きまくり、

    第一のお妃、白瀧様の、

    局で横になっておられるお姿を、

    一目見るなり、もう恋に落ち、

    今日明日の命とも知れぬ病になって、などと続く。

    それが最後には、和歌のやり取りによって貴人を感動させ、姫を自分の妻として賜って故郷へ帰り、子孫が栄えた、という一続きの物語である。以前、「兵庫踊」の名でこの物語が広まっていたのは、少なくともさらに百年前のことである。しかし、その内容はそれほど変わっていないらしく、実際『摂陽群談』巻八に記された山田と白瀧の贈答歌なども、

    「雲さえかからない高い峰の白瀧を、そんなにも恋い慕ってはいけません、山田の男よ」

    「水無月の稲の葉先が焦げるように、私は恋に焦がれている。山田に流れ落ちておくれ、白瀧の水よ」

    となっている。これを備中の小島や私の生まれた土地などでは、意味がわからないため、ただ少しずつ間違えて歌っていただけである。

    桃太郎の説話を研究する者として、注意すべきことが三つある。第一は、これほど長く一定の形で伝わってきた説話でも、中世のある機会に、誰かの手で作り変えられ、飾りを加えられたことが、和歌によって確かめられる点である。面白い歌には違いないが、「雲だにも」の一首は、到底、歌の選集が編まれた時代のお姫様らしい物のいい方ではなかった。これでも通用したという事実そのものが、文学がもう少し粗野な階層まで広まってからの作だ、と推定させる。仮にこの部分が足利時代末ごろの流行の飾りだったとすれば、残る、普通の人が面白く珍しい言葉の力によって優れた配偶者を得た、という部分は、一方では寝太郎・一寸法師など多くの類話につながる。それだけでなく、他方では、遠く『更級日記』の著者が武蔵の竹芝で採集した民話とも、別種とはいえないほどの一致が認められる。『今昔物語』巻三十の「大納言の娘が内舎人に連れ去られる話」、そして同じ話を簡略に載せた『大和物語』巻下では、これを、「安積山、影さえ見える山の井」の歌を詠んだ上臈の物語として伝えて……'
  notes:
  - 冒頭はscan162末尾の歌の続き。末尾はscan164冒頭に続く。
  - 歌詞の「しらすのや」「つぼねまるね」は画像でもその表記。前者は意味を確定できないため保持し、後者は局で横になる姿という文脈上の解釈で訳した。著者自身も歌詞の変化・誤伝を論じている。
  - 和歌は山田という地名と男、白瀧という名と水、焦がれる恋と稲の乾きを重ねる。上臈は高い身分の女性。

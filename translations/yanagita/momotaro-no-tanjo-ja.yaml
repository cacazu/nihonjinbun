  - 冒頭は前スキャンから、末尾は次スキャンへ続く。
  - 「異類求婚譚」は人間と人間以外の存在との婚姻を扱う説話の呼称。
  - OCRで前後した「つた形で久しい間」を画像の順序に復元。

  translation: 申し児信仰の痕跡が、さらにもう一つある。こうして瓜の中から生まれ出た赤ん坊を、どの昔話でも、すべて瓜姫や瓜子姫など、「姫」という名で呼んでいることだ。親は柴を刈って暮らすほどの

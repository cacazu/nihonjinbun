  section: 和泉式部の足袋／七 清少納言の亡霊・八 横山の禰宜
  original: それを取拂はうとした所が、寺僧の夢に一人の貴女現はれ、歌の短册を殘し去つた。後に古筆家の鑑定した所では、赤染衞門の筆蹟のよし云々とあるから、此短册は實物であつたらしいのである。なき跡のしるしとなれば其まゝに問はれずとても有りてしもかな是などは琴平の方の歌を知らなかつたら、或は趣意を覺ることも六つかしい位だが、さりとてわざ〳〵拙く眞似るといふことも無かつたらう。それに移植にしては少しばかり距離が遠過ぎる。是も多分は亦之を一本の花の枝として携へあるいた者と、栽ゑて根づかせた者とは別人であつたことと思ふ。夢に上臈が來て歌を詠んだといふ話の、最も古く且つ弘く行はれて居たのは、かの阿曾沼の鴛鴦の哀話であつた。是は著聞集と沙石集との二つを比べて見ても、旣に話し方の著しい差を認めるが、今日では野州奧州以外に、十數箇處の何沼の歷史になりかけて居る。それを一方の沼の傳說として聽いた者が、羨んで我土地へ橫取りして來たと考へることは、如何に人間を不正直なものと見る人にも、本當は出來ない話である。たゞ籔から棒にそんな事を言ひ出しても、周圍が承知する筈は無かつたからである。たとへ稍〻漠然とでも兼て其話の存在を知る大衆があつて、始めて傳說は尤もらしく作り上げられ得るのであつた。卽ち清少赤染の如きは、最初からさう固定して居たものでも無かつたのである。八橫山の禰宜享保七年に板になつた井澤長秀の廣益俗說辨殘篇卷四に、俗說云、むかし阿波の鳴門甚だしく鳴りけるに、和泉式部一首の歌を詠ず。其歌にえのこ草おのが種とてなるものをあはのなるとは誰かいふらんそれよりして再び鳴ること無しとある。此歌は別に又清少納言が作だといふ說もある。それから何に出て居たかちよつと失念したが、和泉の作といふのが今一つあつて、其方が意味はまだ解し易い。えのこ草種はおのれと有るものをあはのなるとは誰かいふらん卽ちエノコグサと粟とは穗がよく似て居るが別物で、「あはのなると」といふのは間違ひだといふので、是もおのがみのかさ同然の甚だしいこぢつけ歌ながら、所謂誹諧の秀句時代には、
  translation: '〔前のスキャンから続く〕それを取り払おうとしたところ、寺の僧の夢に一人の高貴な女性が現れ、歌の短冊を残して去った。後に古筆の専門家が鑑定すると、赤染衛門の筆跡だった、などとあるから、この短冊は実物だったらしい。

    「亡くなった後のしるしとなるのですから、訪ねてもらえなくても、そのまま残っていてほしいものです。」

    これなどは琴平の歌を知らなければ、意味を理解することも難しいほどだが、かといって、わざわざ下手にまねたわけでもなかろう。それに、直接移し植えたというには少し距離が遠すぎる。これもおそらく、一枝の花として携えて歩いた者と、植えて根づかせた者とは別人だったのだと思う。夢に高貴な女性が現れて歌を詠んだという話のうち、最も古く、また広く伝えられていたのは、あの阿曾沼のオシドリの悲しい話だった。これは『古今著聞集』と『沙石集』の二つを比べても、すでに語り方に著しい違いが認められるが、今日では下野・陸奥以外にも、十数か所のさまざまな沼の歴史になりかけている。それを、一方の沼の伝説として聞いた者が、うらやましがって自分の土地へ横取りしてきたと考えることは、どれほど人間を不正直なものと見る人にも、本当はできないはずである。唐突にそんなことを言い出しても、周囲が納得するはずはなかったからだ。多少漠然とでも、その話の存在をかねて知っている人々がいて、初めて伝説はもっともらしく作り上げられるのだった。つまり、清少納言や赤染衛門という名も、最初からそのように固定していたわけではなかったのである。

    八　横山の禰宜

    享保七年に出版された井沢長秀の『広益俗説弁残篇』巻四には、世間に伝える話として、昔、阿波の鳴門がひどく鳴り響いていたとき、和泉式部が一首の歌を詠んだとある。その歌は、

    「エノコログサは自分自身の種として実るものなのに、『粟の鳴ると（阿波の鳴門）』とは誰がいうのでしょう。」

    それ以後、再び鳴ることがなかったという。この歌は別に清少納言の作とする説もある。それから、何に出ていたか今ちょっと思い出せないが、和泉式部の作とするものがもう一つあり、そちらのほうが意味はまだわかりやすい。

    「エノコログサにはそれ自身の種があるものなのに、『粟の鳴ると（阿波の鳴門）』とは誰がいうのでしょう。」

    つまり、エノコログサと粟は穂がよく似ていても別物なので、「あわのなると」というのは間違いだというのである。これも「おのがみのかさ」と同じくひどいこじつけの歌だが、いわゆる俳諧の秀句が重んじられた時代には、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン260）と本文OCRを照合。
  - 「えのこ草」の二首は「阿波／粟」「鳴る／成る」の掛詞が中心。現代語訳では語呂合わせの仕組みも併記。

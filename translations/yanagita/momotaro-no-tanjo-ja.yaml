  original: 角に新たな材料によつて、其後明かになつて來たことが幾つかある。文學卽ち記錄文藝の上では、此話は普通に紅皿缺皿の名を以て知られて居る。馬琴の皿皿郷談などは全く之に由つたもので、話を美作の久米の皿山の歌に結び付けたのも、彼が獨創に出でたる趣向では無かつた。今ある住吉落窪の物語を始として、日本に最も數の多い繼母話の原の種も、恐らくは之と無關係に生れ出たものでは無かつた。獨逸のグリム研究者たちが、日本の類話として採錄して居るのは、御伽草子の鉢かつぎ姫たゞ一つであるが、是も姥皮とか蟇の皮とかの形になつて、弘く民間に行はれて居る。獨逸では之をアルレライラウフ(千枚皮)、佛蘭西ではポーダアヌ(驢馬の皮)、英國では又キャッツスキン(猫の皮)などと稱へて、共に灰かつぎ姫譚から派生した一旁系であることは、コックスも旣に之を述べて居る。たゞ彼等は我々の草子以外の文藝を、知るべき機會をもたなかつただけである。日本民間の口承文藝に於ては、シンドレラは奥州南部の糠子米子、又は津輕の粟袋米袋等の名を以て傳はつて居る。是と並び行はれて居る多くの繼子いぢめの話で、姉妹の名前がお銀小銀、又はお月お星だの葦子萱子だのと、二つ相對するものの名になつて居るのも、すべて缺皿紅皿の系統を傳うて、やゝ目先きをかへようとしたものらしい。しかも其繼子のシンドレラが臺所へ追ひ下され、始終火焚き番をして灰まみれの汚い衣を着て居たといふ點は、まだこの溫暖の國に來ても、脫ぎ棄てては居ないのであつた。今まで此說話の研究者たちが、大切な分類の標準にして居た一つの點は、幸運な心がけのよい美しい繼娘を保護する者が、或一つの動物であつたか、亡くなつた實母の靈であつたか、はた又當人の守り神であつたかで、此特徴の異同によつて、個々の民族の傳承する說話の親疎、傳播の經路を尋ねることが出來る樣に考へられて居た。ところが其方法の頗る心もとなくなつて來たわけは、日本にはまさしく右三つの型が共に現存するからであつた。前の目安を信賴するとしたら、斯邦へは三口別々の鄰國から、前後して持つて來たといふ結論になるので、そんなことは容易に信じ難い。だから尊敬する外國の篤學者でも、折々は誤つたことをいふものと承知しなければならぬ。それといふのが渉獵は廣くても、一つの國民からさう幾つもの資料は得られず、得られたものだけに由つて一應は意見を述べようとするからで、從つて誤謬は始から新資料の發見によつて、訂正せられる樣に出來て居るのである。それを受賣するほど愚劣なことは
  translation: '……かく、新しい資料によって、その後明らかになってきたことがいくつかある。文学、つまり記録された文芸の世界では、この話は普通「紅皿欠皿」の名で知られている。馬琴の『皿皿郷談』などは、まったくこれに基づくもので、話を美作の久米の皿山の歌に結びつけたのも、彼の独創的な趣向ではなかった。現存する『住吉物語』『落窪物語』をはじめ、日本で最も数の多い継母の話のもとになった種も、おそらくこれと無関係に生まれたものではない。ドイツのグリム研究者たちが、日本の類話として採録しているのは、御伽草子の「鉢かつぎ姫」ただ一つだが、これも「姥皮」や「蟇の皮」という形で、広く民間に伝わっている。ドイツではこれを「アルレライラウフ（千枚皮）」、フランスでは「ポーダアヌ（驢馬の皮）」、イギリスでは「キャッツスキン（猫の皮）」などと呼び、いずれも「灰かつぎ姫」の話から派生した傍系の一つであることは、コックスもすでに述べている。ただ、彼らには私たちの草子以外の文芸を知る機会がなかっただけなのである。

    日本の民間の口承文芸では、シンデレラは奥州南部の「糠子米子」、あるいは津軽の「粟袋米袋」などの名で伝わっている。これと並んで語られる多くの継子いじめの話で、姉妹の名前が「お銀小銀」や「お月お星」、「葦子萱子」など、対をなすものの名になっているのも、すべて「欠皿紅皿」の系統を受け継ぎ、少し趣向を変えようとしたものらしい。しかも、継子のシンデレラが台所へ追いやられ、いつも火の番をして、灰まみれの汚れた着物を着ていたという点は、この暖かい国に来ても、まだ捨てられていない。これまでこの説話の研究者たちが大切な分類基準の一つにしていたのは、幸運で心がけのよい美しい継娘を守るものが、ある動物だったか、亡くなった実母の霊だったか、それとも本人の守り神だったかということだった。この特徴の共通点や相違点によって、それぞれの民族が伝える説話の関係の近さや遠さ、伝わった経路を探れると考えられていた。ところが、この方法がはなはだ頼りなくなってきたのは、日本にはまさにこの三つの型が、どれも現存しているからだった。従来の基準を信頼するなら、日本には三つの別々の隣国から、時期を前後して持ち込まれたという結論になるが、そんなことは簡単には信じられない。だから、尊敬する外国の熱心な学者でも、ときには間違ったことをいうものだと承知しておかなければならない。というのも、広い範囲を調べてはいても、一つの国民からそれほど多くの資料は得られず、得られたものだけに基づいて、ひとまず意見を述べようとするからである。したがって、その誤りは初めから、新しい資料の発見によって訂正される性質のものなのである。それを受け売りするほど愚かなことは……'

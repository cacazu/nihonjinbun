  section: 狼と鍛冶屋の姥
  original: のを正しく見たといふ話を載せて居る。中道等君の奧隅奇譚にも、外南部の大畑で或家の猫が、黃昏に水屋から手拭を咥へ出し、それを裏庭に待つて居た狐に與へて、共に兩手を宙に揚げて踊つたのを目撃したといふ話を載せ、さうして「虎子が來ねえば踊コはすまね」といふ言葉が、諺のやうになつて行はれて居たことを記して居る。佐々木君の聽耳草紙にも陸中の遠野で、猫と狐の踊つて居た話を幾種か採集し、やはり其狐が獨り言に、「虎子どのが來ないば踊にならねア」と謂つて居ると、やがて手拭を被つて其虎猫が來て踊つたとある。此等も前に掲げた江州柳ケ瀨峠の、「虎が婆を喚んで來い」の話などと、丸々無關係で無いことだけは想像してよからう。この聽耳草紙の怪猫譚の中には、例の茶釜の蓋と、彈丸を算へた三毛猫との話が一つあるが、それよりも珍らしいのは狐と踊つた虎猫が、義太夫節を語つて一人留守をして居る女房に聽かせた。或時その事を主人に告口すると、早速その女の咽笛を喰ひ破つて、行方知れずになつたといふ話を伴なうて居ることである。現在の話し方は世間話に近くなつて居るが、其分布は案外に廣い。陸前牡鹿郡の例は「民族」に、久慈の平岳の主になつて居るおとら猫の話は、八戶市の奥南新報に揭げられ、津輕のは內田邦彥氏の津輕口碑集に、鹿角郡のは「旅と傳說」昔話號の內田武志君の報告にあつて、共に内容は略〻一つであつた。福島縣北部の某村でも、むろの木といふ大きな榎があつて、其ムロは怪猫の名だと謂つて居た。話は亦同じで婆樣を咬み殺した後、榎の梢に昇つて居たのを鐵砲で射落された。其時にもかーんといふ金屬の音がしたが、落ちて來たのを見ると大猫が鏡を手に持つて死んで居た。やはり一旦は其鏡を以て彈を防ぎ、しかも終りには退治せられたのである。鐵砲といひ義太夫と云ひ道具は新らしくなつて居るが、話にはもつと古い傳統があつたかと思ふ。伊豫から土佐へ越える何とか峠の神木には、女が狼の群に襲はれて喰ひ殺された傳說があつた。樹上に鏡を手にして其光を狼にさし付け、登つて來るのを逐ひ下して居たが、狼が僞つて退き去るのを見て、あら嬉しやと鏡をからんと投げ棄てると、忽ち戾つて來て女を攻め殺したといふのである。誰が見て居て語り傳へたかもわからず、又いつの頃から斯うなつたのかも私にはまだ突止められない。
  translation: 'のを確かに見たという話を載せている。中道等君の『奥隅奇譚』にも、外南部の大畑で、ある家の猫が夕暮れに水屋から手ぬぐいをくわえて出て、裏庭で待っていた狐に渡し、ともに両手を宙に上げて踊るのを目撃したという話がある。そして「虎子が来なければ踊りはできない」という言葉が、ことわざのように使われていたことを記している。佐々木君の『聴耳草紙』にも、陸中遠野で猫と狐が踊っていた話がいくつか採集されており、やはり狐がひとり言で「虎子殿が来なければ踊りにならない」と言っていると、やがてその虎猫が手ぬぐいをかぶって来て踊ったとある。これらも、先に挙げた近江柳ヶ瀬峠の「虎が婆を呼んで来い」という話などと、まったく無関係ではないということだけは、想像してよいだろう。

    この『聴耳草紙』の怪猫譚には、例の茶釜のふたと、弾丸を数えた三毛猫の話が一つある。しかし、それより珍しいのは、狐と踊った虎猫が義太夫節を語り、一人で留守番をしている女房に聞かせたという話を伴っていることだ。あるときそのことを主人に告げ口すると、猫はすぐその女の喉笛を食い破り、行方知れずになったという。今の語り方は世間話に近いが、分布は意外に広い。陸前牡鹿郡の例は『民族』に、久慈の平岳の主となっている「おとら猫」の話は八戸市の『奥南新報』に、津軽のものは内田邦彦氏の『津軽口碑集』に、鹿角郡のものは『旅と伝説』昔話号の内田武志君の報告にあり、内容はどれもほぼ同じだった。福島県北部のある村にも、「むろの木」という大きな榎があり、そのムロは怪猫の名だといっていた。話も同じで、婆様をかみ殺した後、榎の梢に登っていたところを鉄砲で撃ち落とされた。そのときもカーンという金属音がしたが、落ちてきたものを見ると、大猫が鏡を手に持って死んでいた。やはり一度は鏡で弾を防いだが、最後には退治されたのである。鉄砲といい義太夫といい、道具立ては新しくなっているが、話にはもっと古い伝統があったのだと思う。伊予から土佐へ越える、何とかいう峠の神木には、女が狼の群れに襲われて食い殺されたという伝説があった。木の上で鏡を手に持ち、その光を狼へ向けて登って来るのを追い払っていたが、狼が退くふりをして去ったのを見て、「ああ、うれしい」と鏡をからんと投げ捨てた。すると狼はたちまち戻り、女を襲って殺したというのである。誰が見ていて語り伝えたのかもわからず、いつごろからこの形になったのかも、私にはまだ突き止められない。'
  notes:
  - 引用中の方言は意味を保って現代語化した。「虎子」は虎猫の呼称。

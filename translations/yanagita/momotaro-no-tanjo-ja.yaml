  original: れを三つともに天人女房が解いてくれるのである。ところが幾山川を隔てた陸中の上閉伊郡に、笛吹藤平の話として行はれて居るのが是と同じであつた。藤平の持つ笛は日本の三管といふ名笛の一つで、それを吹きつゝ唐天竺をまはつて居るうちに、家では二親が亡くなつて、壞れた手桶一つが殘つて居たといふだけは越後の方には無いが、是も美しい女房が天から慕うて來たとあり、更に其三つの難題の一つは灰繩千把の上納、二つには打たぬ太鼓に鳴る太皷の御用、三つ目は天の雷神九つの頭を連れて來いといふのが、三つながら一致して居るのみか、何れも妻の才覺によつて雜作なく之を辯じ、最後に雷神が大いにあばれて、殿樣を閉口させる段までも同じである。是とよく似た話は九州地方にも分布して居るが、是も其話の前段が稍、違ひ、たとへば肥前の南高來郡の例では、暮に讓葉と裏白の殘りを海の神に上げたので、龍宮から招待せられて御姫樣を貰つて來たとあり、その美しい女房の姿繪を、かゝせて畠の傍に引掛けて働いて居ると、風に吹揚げられて其繪が殿樣の庭に落ち、それから色色な難題をかけられたことになつて居る。笛吹藤平の話の方では、天人女房が男の貧乏を救ふ爲に、絲を買はせて三十三觀音の曼陀羅といふものを織り、それを町へ持つて出て三百兩に賣らせた。其事が殿に聞えて難題を以て、其女房を取上げようとすることになるのであつた。この部分は通例は鶴女房、又は裸鶴の話として獨立して行はれて居る。鶴が命を助けられた恩に報いる爲、又は男の孝心にめでて、美しい女房になつて來て鶴の毛衣を織つてくれる。後に姿を見られたので泣きながら歸つて行つたといふ風に話されるのだが、笛吹藤平にはそれまでが複合して居る。越後の笛吹男の話にはそれは無い代りに、別に後日譚として天國へ親見舞に行つた際に、鬼に大切な女房を盜まれて、それを捜して取戾すのに、大變な苦勞と冒險をしたことが附添へられて居るのである。面白いことには同じ陸中の紫波郡昔話には、ちやうどこの雙方の餘分を一皆合せた又一つの例があつた。それが御伽の蛤の草紙と、始の半分までが似通うても居たのである。その荒筋だけをかいつまんで言ふと、むかし學問のすきな若者の所へ、天から天人の御姫樣が押掛嫁にやつて來る。每日機を織つて三年かゝつて一匹の布を織り上げた。それを夫に町へ持つて出て、おら家の見たく無しのおかたが織つたタダソ布賣らうと觸れてあるかせる
  translation: 'れを三つとも、天人の妻が解決してくれるのである。ところが、いくつもの山や川を隔てた陸中の上閉伊郡に、笛吹藤平の話として伝わっているものが、これと同じだった。藤平の持つ笛は「日本の三管」と呼ばれる名笛の一つで、それを吹きながら中国やインドを巡っているうちに、家では両親が亡くなり、壊れた手桶一つが残っていたという点だけは越後の話にはない。しかしこちらも美しい妻が天から慕ってやって来たといい、さらに三つの難題の第一は灰でできた縄千束の献上、第二はたたかなくても鳴る太鼓を用意すること、第三は天の雷神九つの頭を連れて来いというもので、三つとも一致している。そればかりか、いずれも妻の知恵でたやすく果たし、最後に雷神が大暴れして殿様を困らせるくだりまで同じなのである。これによく似た話は九州地方にも分布しているが、こちらも前半が少し違う。たとえば肥前南高来郡の例では、年の暮れにユズリハとウラジロの残りを海の神に差し上げたため、竜宮から招かれてお姫様をもらって帰ったとある。その美しい妻の肖像を描かせ、畑のそばに掛けて働いていると、風に吹き上げられた絵が殿様の庭に落ち、それからさまざまな難題を言いつけられたことになっている。一方、笛吹藤平の話では、天人の妻が夫を貧乏から救うために糸を買わせ、「三十三観音の曼荼羅」というものを織って、それを町へ持って行き三百両で売らせた。そのことを聞いた殿様は、難題を口実にその妻を取り上げようとするのであった。

    この部分は普通、「鶴女房」あるいは「裸鶴」の話として独立して伝わっている。鶴が命を助けられた恩に報いるため、または男の親孝行な心に感じて、美しい妻となってやって来て、鶴の羽の衣を織ってくれる。後に本当の姿を見られたので、泣きながら帰っていったというふうに語られるのだが、笛吹藤平の話にはそれまでが組み合わされている。越後の笛吹き男の話にはその部分がない代わりに、別の後日談として、天国へ親の見舞いに行った際に大切な妻を鬼に盗まれ、探し出して取り戻すために大変な苦労と冒険をした話が付け加えられている。面白いことに、同じ陸中の紫波郡の昔話には、ちょうどこの双方に付け加わった部分をみな合わせた、もう一つの例があった。そしてそれは、御伽草子の『蛤の草紙』とも、前半が似通っていたのである。

    そのあらすじだけをかいつまんでいうと、昔、学問の好きな若者のところへ、天人のお姫様が天から押しかけ嫁にやって来る。毎日機を織り、三年かけて一匹の布を織り上げた。それを夫に町へ持って行かせ、「うちの見たくもない女房が織ったタダソ布を売ろう」と触れて歩かせる'
  notes:
  - 「三匹」等と混同しないよう、布の単位「一匹」は原語を残した。一般に反物二反に相当する。
  - 「タダソ布」は原文の呼称を保持。

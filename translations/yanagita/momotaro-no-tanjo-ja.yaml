- id: mmt-237-01
  scan: 237
  section: 狼と鍛冶屋の姥／古屋の漏り
  original: 'と、狐が川獺に騙されて尻尾を水に垂らし、氷に閉ぢられて拔けなかつたことになつて居るのだが、狐は現在あの通り太い尾が有るのだから、話は單なる或一箇の冒險談になつて、是を聽く者の胸に其面白さが映らない。

    そこでどうしても猿とか猫とかの樣な、實際に尾の無い者の古い歷史とした方が、感動を與へる力が大きかつたのである。

    猿と氷とを一つ話に取合せ得た國は、多分日本ばかりだらうといふことは曾て私が說いた(昔話號七九頁)。

    北歐の諸國の動物說話中には、尻尾で魚を釣らうとした話は最も著名であるが、騙したのは例の通り必ず狐、騙されて尾を失つた者は熊より他には無かつた。

    アイヌの類話に於ても亦當然に熊であり、どうやら跡をつけたらこの兩所の聯絡は知れさうである。

    しかも我邦に入つてから猿の尾の釣りとなり、古屋の漏りの結末となり、更に秋田縣の仙北郡の如く、踊つてしやべつて身元を露顯した猫の話とも複合して居るのである。

    是を尾が切れたといふ一點の一致によつて、忽ち輸入と說くのが在來の比較神話學なるものであつた。

    結果は當つて居らうとも尙出たらめの責は免れない。

    それが古屋の漏りなどといふ近世寓話を、發生せしめたので無いからである。

    右の津村氏の譚海より、僅か二三十年後に出來たかと思ふ江戶愚俗徒然噺を讀んで見ると。

    江戶でも古猫が踊つたといふ話が、もう飽きられてもよい程に古臭いものになつて居たらしい。

    我前かたの事、或家に行きければ、其時に前にいふ鍛冶屋の婆樣といふ猫の踊ををどるを、武者修行の者退治せし咄をして居る所へ行合せ共に聞き居たる時、猫を殺す人の名を忘れて、はて何とか申す修行者でござつたがと考へるとき、聞き居たる主人の申す樣、それは每度聞いたことが有りました。

    たしか古木花四郞といふ名の人では無きやと謂ひければ、いえ左樣の名ではござりませんと考へて居たるは、全く自分誠と一圖に咄すのと見えたり。

    主人の言ひたるは古き咄だらうとの名也。

    愼むべし。

    と記して居る。

    猫の踊るといふ話に、もう鍛冶屋の姥を引合ひに出して居たとすると、彼女が產婆であり狼の話の管理者であつたらうといふ、私の想像說は少し弱くなるが、一方に「何屋の婆さを喚んで來い」といふ狼群の人語が、かの「虎子どのが來ないば踊にならねア」といふ類の、猫の踊の話からの借り物であることだけは稍々明かになつた。

    卽ち此家畜の夜出'
  translation: '――と、狐が川獺にだまされて尻尾を水に垂らし、氷に閉じ込められて抜けなくなったことになっている。しかし狐には、今もあのとおり太い尾があるのだから、話は単なる一匹の冒険談になり、聞く者の心にその面白さが伝わらない。そこで、やはり猿や猫のような、実際に尾のないものの古い歴史とした方が、感動させる力は大きかったのである。猿と氷とを一つの話に組み合わせられた国は、おそらく日本だけだろうということは、かつて私が述べた（『昔話号』七九頁）。北欧諸国の動物説話では、尻尾で魚を釣ろうとした話は最も有名だが、だましたのはいつもどおり必ず狐で、だまされて尾を失った者は熊だけだった。アイヌの類話でも、当然ながら熊であり、どうやら跡をたどれば、この二つの地域のつながりはわかりそうである。しかも日本へ入ってからは、猿の尾の釣りとなり、古屋の漏りの結末となり、さらに秋田県仙北郡の例のように、踊ってしゃべって素性を明かした猫の話とも複合している。これを、尾が切れたという一点の一致だけで、すぐに輸入された話だと説明するのが、従来の比較神話学というものだった。結論は合っていようとも、なお、でたらめだという非難は免れない。それが「古屋の漏り」のような近世の寓話を生み出したのではないからである。

    右の津村氏の『譚海』より、わずか二、三十年後にできたと思われる『江戸愚俗徒然噺』を読むと、江戸でも、古猫が踊ったという話は、もう飽きられてもよいほど古くさくなっていたらしい。

    「私が以前、ある家を訪ねたとき、先に述べた『鍛冶屋の婆様』という猫の踊りを、武者修行の者が退治した話をしているところに出くわし、一緒に聞いていた。すると、語り手は猫を殺した人の名を忘れて、『さて、何という修行者でしたか』と考えた。そのとき、聞いていた主人が、『それは何度も聞いたことがあります。確か古木花四郎という名の人ではありませんか』というと、『いいえ、そういう名ではありません』と考え込んでいたのは、まったく自分では真実だと思い込んで話していると見えた。主人の言ったのは、『古い話だろう』を人名にしたものなのである。慎むべきことだ。」

    と記している。猫が踊るという話に、すでに鍛冶屋の姥が引き合いに出されていたとすれば、彼女が産婆であり、狼の話を管理していたのだろうという私の仮説は少し弱くなる。しかし一方で、「何屋の婆さを呼んで来い」という狼の群れの人語が、あの「虎子どのが来なければ踊りにならない」という類の猫の踊りの話から借りたものだということだけは、かなり明らかになった。つまり、この家畜が夜に出――'
  notes:
  - 冒頭は236、末尾は238へ続く。
  - アイヌに関する記述は著者の当時の比較説話論を訳出したもの。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第37頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。
  sequence: 242
- id: mmt-238-01
  scan: 238
  section: 狼と鍛冶屋の姥／古屋の漏り・狼と鏡と火
  original: 'て踊るといふ話が餘り古くなつて、追々とその兇惡の相を變化あらしめたものが、末には寧ろ狼の話に似つかはしくもなつたので、甲斐の犬梯や越後のおいぬ繫ぎの元の形は、卽ち藝州可部峠の猫のつぎ〱であつた。

    狼の爪の構造が樹に昇るに適するか否かの動物學上の問題では無かつたのである。

    猫が夜分に古辻堂の前などに集まつて、踊を踊つたからとて退治する迄の必要は無い。

    それに堂々たる武者修業までが參與したといふことは、もう此話の內容が少しづつ物凄くなつて來かゝつで居たことを反映する。

    狼は固より踊は不調法で、たゞその一段と殺伐の舞臺にしか、代つて現はれることは出來なかつた。

    だから猫の話の方が古からうと思ふのである。

    しかも此方にも何か是と近い言ひ傳へが無かつたら、突如として二話の混同してしまふことは無かつたことも亦明かで、是にも私は猫の話と同樣に、曾ては今少し無害平和なる昔話が、久しく流布して居てこの複合の素地を爲したことを考へて居るのである。


    狼と鏡と火

    狼が血に飽かうとする獸でありながら、不思議に其穢を忌むといふ口碑は方々に有る。

    伊豫の北宇和郡から土佐へ越える杖立峠の頂上に、月の障りのある若い女が狼に襲はれ、高い樹に登つたけれども終に其害を免れなかつたと傳へて、今も山中の神として祀られて居る話は、以前長山源雄君の報告があつたが(民族一卷六號)、土佐の側にも半ば以上之と似たものがある。

    場所は幡多郡大正村大字折合字上源見山で、前の杖立峠と同じ路であるか否かは知らぬが、兎に角に佐喜濱村野根峠とは、この大きな國の西東の兩端であつた。

    山林公報の古い號に、この國有林中のお磯杉の傳說を採錄して居る。

    今あるお磯杉は百年餘の二度生で、伐株の上に成育して居るとあるから、口碑の年輪は却つて產杉より多いかも知れない。

    しかも今から僅か百六七十年前にあつた事だと謂つて居る。

    お磯といふ孕み女が爰を通つて居て狼の群に遭ひ、此杉の木の上に攀ぢ昇つて、鏡を出して其光で近よる狼を追拂つて居たが、'
  translation: '――て踊るという話があまりに古くなり、しだいにその凶悪な様相を変えていったものが、最後にはむしろ狼の話にふさわしくなったので、甲斐の犬梯子や越後のおいぬ繋ぎの元の形は、すなわち芸州可部峠の猫の重なり合いだった。狼の爪の構造が木登りに向いているかどうかという、動物学上の問題ではなかったのである。猫が夜、古い辻堂の前などに集まって踊ったからといって、退治するまでの必要はない。それに立派な武者修行者まで関わったということは、すでにこの話の内容が少しずつ恐ろしいものへ変わりかけていたことを示している。狼はもともと踊りには不向きで、ただ一段と殺伐とした場面にしか、代わって登場することはできなかった。だから猫の話の方が古いだろうと思うのである。しかし、狼の側にも何かこれに近い言い伝えがなければ、突然二つの話が混同されることはなかったのも明らかだ。これについても私は、猫の話と同じく、かつてはもっと無害で平和な昔話が長く流布していて、この複合の下地をなしたのだと考えている。

    狼と鏡と火

    狼は血に飽こうとする獣でありながら、不思議とそのけがれを忌むという言い伝えは各地にある。伊予の北宇和郡から土佐へ越える杖立峠の頂上では、月経中の若い女性が狼に襲われ、高い木に登ったものの、ついに害を免れなかったと伝えられ、今も山中の神として祀られている。この話は以前、長山源雄君の報告にあった（『民族』一巻六号）が、土佐側にも半ば以上これに似たものがある。場所は幡多郡大正村大字折合字上源見山で、先の杖立峠と同じ道かどうかは知らないが、とにかく佐喜浜村の野根峠とは、この大きな国の西と東の両端に当たる。『山林公報』の古い号には、この国有林の中の「お磯杉」の伝説が採録されている。今のお磯杉は百年余りの二代目で、切り株の上に育っているというから、言い伝えの年輪は、かえって産杉より多いかもしれない。それでも、今からわずか百六、七十年前のことだといっている。お磯という身重の女性がここを通り、狼の群れに遭って、この杉の上によじ登り、鏡を出して、その光で近づく狼を追い払っていたが、――'
  notes:
  - 冒頭は237、末尾は239へ続く。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第38頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

  section: 瓜子織姫／一 昔話の分布
  original: 桃太郞の昔話は、その記錄に固定したのが早かつた爲か、或は又その成立が新らしかつた爲か、今までは少なくともその變つた型の分布が、意外に僅かしか發見せられて居ない。だからこの一つの民譚の歷史を考へて見ようとするには、どうしても其周圍の是と關係あるらしきものから、比較の試みを始めて行かなければならぬ。さういふ中でも瓜子姫の昔話は、他の何れのものよりも桃太郞に近く、又幸ひにして諸國の類例が、幾らかづつ互に異なつて居るので、將來或はもう少し精確な起原說を、提出し得る見込もあるのである。但し現在の採集は、まだ日本の一部だけにしか及んで居らぬ故、今後出て來るものの變化如何によつて、私の意見は尙大いに改訂せられるかも知れない。それ故に先づ問題の興味を揭げて、地方の採集家の活動を促す必要もあるわけである。まだ私の見落しはあることと思ふが、今わかつて居る瓜子姫說話は左の通りで、數は十一だが其七つ迄は岩手縣のものである。此以外に信州松本附近に一つ、阿波にも瓜の流れて來た童話があつたといふが、內容が知られて居ないから此中には算へなかつた。一陸中和賀郡。二同國某地。三同國某地。四同上閉伊郡遠野鄕(以上四、鄕土研究四卷一號、佐々木喜善君)。五同膽澤郡(森口氏黃金の馬)。六同郡(膽澤郡昔話集).七同紫波郡(紫波郡昔話)。八信濃下水內郡(下水内郡誌).
  translation: '桃太郎の昔話は、早くから記録によって形が固定したためなのか、あるいは、その成立自体が新しかったためなのか、少なくともこれまでは、その異なる型の分布が、意外なほどわずかしか見つかっていない。だから、この一つの民間説話の歴史を考えようとするなら、どうしても、その周辺にある、関連していそうな話から、比較を試みなければならない。

    その中でも瓜子姫の昔話は、ほかのどれより桃太郎に近い。また幸いなことに、各地の類話が、少しずつ互いに異なっているので、将来は、もう少し正確な起源説を提出できる見込みもある。ただし、現在の採集は、まだ日本の一部にしか及んでいない。今後現れる話がどのように違っているかによって、私の意見も大幅な訂正を必要とするかもしれない。だからまず、この問題のおもしろさを示して、地方の採集家の活動を促す必要があるのである。

    まだ私の見落としもあるだろうが、今わかっている瓜子姫の話は、次のとおりである。全部で十一例あるが、そのうち七例までは岩手県のものだ。これ以外に信州松本付近に一例、また阿波にも瓜が流れてくる童話があったという。しかし内容がわからないため、ここには数えなかった。

    一　陸中和賀郡。

    二　同国のある土地。

    三　同国のある土地。

    四　同国上閉伊郡遠野郷（以上四例は『郷土研究』四巻一号、佐々木喜善君による）。

    五　同国胆沢郡（森口氏『黄金の馬』）。

    六　同郡（『胆沢郡昔話集』）。

    七　同国紫波郡（『紫波郡昔話』）。

    八　信濃下水内郡（『下水内郡誌』）。'
  notes:
  - 列挙はscan73に続く。小見出し「一 昔話の分布」をsectionに収録。

- id: mmt-118-01
  scan: 118
  section: 田螺の長者／二 蛙の王子と蛇の王子
  original: '二 蛙の王子と蛇の王子

    第一に我々の「舌切雀」が、果して最初から雀であつたらうか否かが、まだ決定せられては

    居ないのである。日本の昔話の若く美しい主人公も、土地によつて色々の動物の形を假りて

    出現して居た。それを一々に別の話だと見てしまふと、末には却つて分類によつて比較の利

    益を破壞すべきことは、たとへばアマノジヤクと山母との相異を以て、瓜子姫の說話を二種

    に見ようとすると同じで、それでは折角集められた解說の手がかりを、最初から棄てること

    になるのである。私の計畫は出來るだけ意見をさし控へ、單に經驗ばかりを取次ぐやうにし

    たいのだが、折々つい面倒な理窟を言ふことになつて申譯が無い。併し今度は事柄が明白だ

    から、大體實例ばかりを竝べて置いて用は濟むと思ふ。最初に引用するのは鹿兒島縣大島の

    例是も「旅と傳說」(一卷七號)に、茂野幽考君が報告したものであるが、此「申し兒」は蛙

    の形を以て現はれて居る。

    昔々爺と婆、四十年も子が無いので山の神に願掛をする。婆さんの膝頭がむくむくと膨

    れて來たのを、爺さんが叩くと蛙の子がぴよんと生れた。私は神樣から授けられた子だ

    と名乘つたが、何でもよいからと願を掛けたのだから、是も仕方が無いと思つて大事に

    育てようとする。ところが蛙の子は早速二親に向つて、是から嫁を貰ひに行くから餅を

    搗いてくれと言つて、其餅を袋に入れてもらつて背に負うて村々を飛びあるく。或村で

    村一番の長者の家を尋ね、書院の佛壇に上つて居た。さうして香を燒きに來た主人に、

    おれは神樣の子だと告げた。それから其長者に三人の娘があることを聞いて、餅の袋を

    預けて其晩は此家に一泊した。此袋には大切な神樣の品が入つて居る。一つでも無くす

    れば此家の一番大事なものを貰ふぞと謂つた。さうして夜が更けてからそつと其餅袋を

    持出して、三人の中の末の娘の口に、其餅を押込んで置いて寢た。夜が明けて餅が一つ紛

    失して居ると騒ぎ立てたが、それが末の娘の口に入つて居たから、とうとう約束通り貰

    つて行くことになつた。家では爺さん婆さんが喜んで嫁を迎へ、祝言をさせる爲に村の

    人たちを招いた。そこで先づ風呂をわかして、始に花嫁を入れて次に蛙の子がどぶんと

    飛込むと、忽ち蛙の姿は改まつて、立派な若者になつた。今に蛙が座敷へ飛出すものと'
  translation: '二　蛙の王子と蛇の王子


    第一に、私たちの「舌切雀」が、本当に初めから雀の話だったかどうかは、まだ決まっていないのである。日本の昔話の若く美しい主人公も、土地によってさまざまな動物の姿を借りて現れていた。それを一つずつ別の話と見てしまえば、しまいには、かえって分類することで比較の利点を壊してしまうだろう。例えば、アマノジャクと山姥の違いを理由に、瓜子姫の説話を二種類に分けようとするのと同じである。それでは、せっかく集まった解釈の手がかりを初めから捨てることになる。私はできるだけ意見を控え、ただ経験したことだけを伝えたいと思っているのだが、ときどき、つい面倒な理屈を述べてしまって申し訳ない。しかし今回は事柄がはっきりしているので、おおむね実例を並べるだけで用が足りると思う。初めに挙げるのは鹿児島県大島の例である。これも『旅と伝説』一巻七号に茂野幽考君が報告したもので、この「申し子」は蛙の姿で現れている。


    昔々、おじいさんとおばあさんが、四十年もの間、子どもがいないので、山の神に願掛けをする。おばあさんの膝がむくむくと膨れてきたのをおじいさんがたたくと、蛙の子がぴょんと生まれた。「私は神様から授けられた子です」と名乗ったが、何でもよいからと願掛けをしたのだから仕方がないと思い、大切に育てようとする。ところが蛙の子は、さっそく両親に「これから嫁をもらいに行くから、餅をついてくれ」と言い、その餅を袋に入れてもらい、背負って村々を跳び回る。ある村で村一番の長者の家を訪ね、書院の仏壇に上がっていた。そして香をたきに来た主人に「おれは神様の子だ」と告げた。その長者には娘が三人いると聞くと、餅の袋を預け、その晩はその家に泊まった。「この袋には大切な神様の品が入っている。一つでもなくしたら、この家で一番大事なものをもらうぞ」と言った。そして夜が更けてから、そっと餅袋を持ち出し、三人のうちの末娘の口に餅を押し込んで寝た。夜が明けると、餅が一つなくなっていると騒ぎ立てた。それが末娘の口に入っていたので、とうとう約束どおり娘をもらっていくことになった。家ではおじいさんとおばあさんが喜んで嫁を迎え、祝言をさせるために村の人々を招いた。そこで、まず風呂を沸かし、初めに花嫁を入れ、次に蛙の子がどぶんと飛び込むと、たちまち蛙の姿は変わり、立派な若者になった。今にも蛙が座敷に跳び出してくると思っていた――'
  notes:
  - 末尾の引用は次のスキャン119に続く。
  - 「申し子」は神仏に祈って授かった子。
  sequence: 123
- id: mmt-119-01
  scan: 119
  section: 田螺の長者／二 蛙の王子と蛇の王子
  original: '思つて居た村の人は、見たことも無いやうな神々しい若者が、式服を著て現れたのでび

    つくりしてしまつた。

    この蛙の變身といふことが、花嫁の先づ入浴したのと關係のあるらしきことは、次の一例

    を見ても想像し得られる。但し此話の方では小さ子は蛇であり、話は北端の奥州に行はれて

    居るものであつた。紫波郡昔話の第七十五篇に曰く

    畑に働いて居た父と母が、夕方歸りがけに笠を取りに行くと、笠の中に小蛇が蟠つて居

    て、なんぼ追つても直ぐに來て入る。夫婦は子が無いから連れて戾つて鉢に入れて飼つ

    て置くと、すぐに大きくなるから今度は盥に入れ、それでも入れて置かれないので、其

    次は馬の飼葉桶に入れて養つて居た。其蛇が或時父母に向つて、是から長者どんに行つ

    て娘を一人嫁に貰つて來ると言つて出かけた。長者どんではちやうど夕飯を食べて居る

    と、門にお賴み申すといふ聲がするので、三人の娘が順に出て見たが誰も見えない。四

    度目に主人が聲を聞き付けて出ると、大きな蛇が居て娘を一人くれろ、くれないなら此

    家を卷き壞すと言つた。それを三人の娘に相談して見たが、姉と仲とは怒つて承知せ

    ず、末の娘だけがおとなしく承知をした。それで町へ行つて色々の衣裳を買ひ調へ、そ

    れを持たせて蛇の處へ嫁にやると、蛇は喜んで娘を背に載せて家に還つて來た。父と母

    とが畑に出て居る留守に、蛇は花嫁に向つて斯う言つた。おれは此藁打石の上に登つて

    寢て居るから、お前はこの藁打槌で肝の所を敲いてくれと言つた。嫁は言はれた通りに

    大槌で打つと、肝がぱちんとはねて向ふの隅に行つて立派な美男となつた。さうして二

    人は大喜びで、抱き合つて爐にあたつて居るところへ、父母は歸つて來てこれは何處の

    和子樣だと聞いた。蛇の息子が斯うなつたと知つて、急いで長者どんにも知らせて目出

    たく婚禮の式を擧げる。姉仲二人の娘は恥かしがつて何處へか往つてしまつた。

    此話を前の蛙の聟入の話と比べて、拔けて居る部分を丁度補塡するやうな例が、同じ紫波

    郡の昔話集に又一つある。是は最初から蛙でも蛇でも無かつたが、やはり申し兒であり且つ

    異常に小さかつた。

    子の無い夫婦、藥師樣に立願をして御堂に籠つて居ると、夢に藥師樣が現れて、御前た

    ち二人に授ける子は、葦の根尋ねても茅の根尋ねても無いのだが、餘り不憫だから一人'
  translation: '――村の人々は、見たこともないほど神々しい若者が礼服を着て現れたので、驚いてしまった。


    この蛙の変身が、花嫁が先に入浴したことと関係していそうなことは、次の一例からも想像できる。ただし、こちらの話の小さな子は蛇で、北の端にある奥州に伝わっている。『紫波郡昔話』の第七十五話には、こうある。


    畑で働いていた父と母が、夕方、帰りがけに笠を取りに行くと、その中に小さな蛇がとぐろを巻いていた。いくら追っても、すぐに戻って入る。夫婦には子どもがいないので連れ帰り、鉢に入れて飼っておくと、すぐに大きくなるので今度はたらいに入れた。それでも収まらなくなったので、次は馬の飼い葉桶に入れて養っていた。ある時、その蛇が父母に「これから長者どんのところへ行って、娘を一人、嫁にもらってくる」と言って出かけた。長者どんの家では、ちょうど夕飯を食べていると、門口で「お頼み申します」という声がした。三人の娘が順番に出てみたが、誰も見えない。四度目に主人が声を聞きつけて出ると、大きな蛇がいて、「娘を一人くれ。くれなければ、この家を巻きつぶす」と言った。三人の娘に相談したが、長女と次女は怒って承知せず、末娘だけが素直に承知した。そこで町へ行ってさまざまな衣装を買いそろえ、それを持たせて蛇のところへ嫁にやると、蛇は喜び、娘を背中に乗せて帰ってきた。父と母が畑へ出ている留守に、蛇は花嫁にこう言った。「おれはこの藁打ち石に上がって寝ているから、お前はこの藁打ち槌で、肝のあるところをたたいてくれ」。嫁が言われたとおり大槌で打つと、肝がぱちんとはねて向こうの隅へ行き、立派な美男子になった。二人は大喜びで抱き合い、囲炉裏にあたっていた。そこへ父母が帰ってきて、「これはどこの若様だ」と尋ねた。蛇の息子がこうなったと知ると、急いで長者どんにも知らせ、めでたく婚礼を挙げた。姉二人は恥ずかしがって、どこかへ行ってしまった。


    この話と先の蛙の婿入りの話を比べると、抜けている部分をちょうど補うような例が、同じ『紫波郡昔話』にもう一つある。これは最初から蛙でも蛇でもなかったが、やはり申し子で、しかも並外れて小さかった。


    子どものない夫婦が、薬師様に願を立ててお堂にこもっていると、夢に薬師様が現れ、「お前たち二人に授ける子は、葦の根を探しても茅の根を探してもいないのだが、あまりに不憫だから、一人――'
  notes:
  - 冒頭はスキャン118の引用の続き。末尾の薬師の言葉はスキャン120へ続く。

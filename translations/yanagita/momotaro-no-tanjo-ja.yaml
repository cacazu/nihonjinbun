  section: 狼と鍛冶屋の姥／八 荒血山の物語
  original: '要なる山の中の御產といふことが、甚だ稀薄になつてゐるから別の起原だらうと見る人もあらうが、それは水掛論になるから私はもつと中間の例の出て來るのを待たう。

    併し少なくとも戀衣譚の一段と土佐の方に近いものが、近世まで邊土には行はれて居たのである。

    いつでも我々の相談役になる菅江眞澄翁は、其晩年の著「雪の出羽路」の平鹿郡角間川の條に、次のやうな口碑を錄して居る。

    慶安の頃ならん。

    ある浮浪人妊める妻をぐして、陸奥より爰に來とて、文字の山中にて其妻頻りに腹やみて子產みたり。

    すべ無う妻をいたはり、草をしきなんど、とかくして日は暮れたり。

    夜半とおぼしく、しきりに眠の萠しぬれば、かたはらなる岩を枕として臥しぬ。

    物の音するに寢覺めて見れば、己が家に年頃召仕ひたりし下女のさまして、何處よりか若き女の來て、ねもごろに妻を助けいたはるは、惟しき事と思ふほどに、產める子も妻をもひし〱と咬みぬ。

    あな恐ろし。

    こは山媼なんどいふものならん。

    憎きやつかなとだんびら拔放ち、妻子の仇と打掛くれど、そが身に立たず事ともせず、其眼の光ること鏡の如く、身の毛いよ立ち、或木のうれにかき登りて辛き命を全くし、夜明くるを待ちて木より下れば、妻が亡骸は骨のみ殘りぬ。

    未ださるもの隱ろひあらんかと爰を馳せ出でて人里を得て、十日二十日とこゝかしこにさまよひ、出羽國に來て平鹿郡角間川に至り、世の中の行末を思ひて、自らも淨土宗なれば淨蓮寺の弟子となりて名を權齋といふ。

    風の權齋とは異なるべし。

    權齋が山姥打ちたりし太刀は無名の二尺九寸にて、そは肥後守國康ならむといふ人あり。

    今ある人家藏せり。

    その山媼と見しは狒なんどいふものにてやありけん。

    權齋角間川にて身まかれば、人々塚を築きて近き頃碑を建て、權齋遊士墓と誌しぬ。

    いづこの人か。

    九戶の城の落人なんどにて、名をあらはには語らざりけん。

    角間川の淨土寺に、遊士權齋が二人あらうとは思はれぬから、此話の運搬者は、やがて後人によつて話の主人公とも解せられたのであらう。

    若しさうだとすると戀衣物語の安達ヶ原一つ家と同樣に、是を文字山中の一本の樹木に結び付けただけが、此人の事業といふことになるのである。

    土佐でも寺石氏の鄕土民俗譚に依れば、土佐郡領家鄕の山中の往還に、七分まで是と似寄りの話があつた。

    異なる點はたゞ山姥が狼の類となつて居て、其故跡には老樹'
  translation: '――山中での出産という要素が非常に薄れているから、起源が別なのだろうと見る人もいるだろう。しかし、それでは水掛け論になるので、私はもっと中間的な例が見つかるのを待つことにしよう。ただ、少なくとも『恋衣物語』の一段よりも土佐の話に近いものが、近世まで遠隔地には伝わっていたのである。いつも私たちの相談相手になってくれる菅江真澄翁は、晩年の著作『雪の出羽路』の平鹿郡角間川の項に、次のような言い伝えを記している。

    「慶安のころのことであろう。ある浪人が身重の妻を連れ、陸奥からこちらへ来ようとして、文字の山中で妻がひどく腹痛を起こし、子を産んだ。どうすることもできず妻をいたわり、草を敷くなどして、あれこれするうちに日が暮れた。夜半と思われるころ、しきりに眠気がさしてきたので、傍らの岩を枕にして横になった。物音に目を覚まして見ると、自分の家で長年召し使っていた下女の姿をした若い女が、どこからか来て、心をこめて妻を助け、いたわっている。不思議なことだと思ううちに、産まれた子も妻も激しくかみついた。ああ恐ろしい。これは山姥などというものだろう。憎いやつだと、大刀を抜き放ち、妻子の仇だと斬りかかったが、刀は相手の体に刺さらず、何とも思っていない。その目が鏡のように光るので、ますます身の毛がよだち、ある木の梢にかけ登って、危うい命をなんとか保った。夜明けを待って木から下りると、妻の亡骸は骨だけになっていた。まだあのようなものが潜んでいるかもしれないと思い、そこを走り出て人里にたどり着き、十日、二十日とあちらこちらをさまよって、出羽国の平鹿郡角間川へ来た。世の中の行く末を思い、自分も浄土宗であったので、浄蓮寺の弟子となって、名を権斎といった。風の権斎とは別人であろう。権斎が山姥を斬った太刀は無銘で、長さ二尺九寸、肥後守国康の作だろうという人もある。今はある家に所蔵されている。その山姥と見たものは、狒などというものだったのだろうか。権斎が角間川で亡くなると、人々は塚を築き、近ごろ碑を建てて『権斎遊士墓』と記した。どこの人だったのか。九戸城の落人か何かで、名をはっきりとは語らなかったのであろうか。」

    角間川の浄土寺に遊士権斎が二人いたとは思えないから、この話を運んできた人が、やがて後世の人々によって、話の主人公とも解釈されたのだろう。そうだとすれば、『恋衣物語』の安達ヶ原の一つ家と同じように、これを文字山中の一本の木に結びつけたことだけが、この人のした仕事だったことになる。土佐でも寺石氏の『郷土民俗譚』によれば、土佐郡領家郷の山中の往還に、七割ほどこれと似た話があった。違うのは、ただ山姥が狼の類となっていて、その場所には老木――'
  notes:
  - 冒頭は227、末尾は229に続く。
  - 『下女』は当時の身分・職分を表す用語として引用訳に残した。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第28頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。
  - 引用の「惟しき」は原版の字形も判然としないため原文欄ではOCR表記を保持し、文脈上「怪しき（不思議な）」として訳した。

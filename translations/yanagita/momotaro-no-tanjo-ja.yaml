  section: 狼と鍛冶屋の姥
  original: て見た所が、先刻婆樣が氷で滑つて、眉間を割つたと言つて寢て居るので、行きなり傍へ行つて之を斬り殺すと猫の正體を顯した。幾年か前に本物の老母を喰つて、自分が其代りに化けて居たのだつたと謂ふので、爰ではもはや純然たる赤岩一角式になり切つて居るのである。土佐と奥州と、土地が是だけ離れ話が是ほどに違つて居ても、尙南北別々の由來をもつて傳はつたものと、如何にしても考へられない理由はどこに在るかといふと、つまりは全國の話を聽く者の興味が、主として怪物の祕密が偶然の事から發覺し、人間は其手柄に由つて、永く絕大の危難を免かれたといふ點に集注して居た爲で、從うて其發覺の手掛りなどは何であつてもよく、話をする人の空想と技倆次第、新らしいものと取替へてもよかつたらうと思ふが、前代の傳承者には神話以來の久しい習性を保つものが尙多く、知りつゝ昔の型を改めて見ようとする人が、今日のやうには輩出しなかつた。是が色々の細部の一致の尙しば〳〵認められて、且つは我々に溯原の便宜を供し、且つは時々誤つた推測に、人を誘はうとする混亂にもなつたやうに考へられる。一つの要點は婆に化けて居た白毛の古狼が、鍋を被つて悠然として登つて來たといふことは、南路志にも旣に見えて居り、國民童話の方にも釜を兜に被つて來たといひ、更に他の二つの筆寫の報告にも、鍛冶屋の婆を喚んで來いといふ一條は無く、單に血をつないで佐喜濱の民家に至るとあるのみであるが、やはり金物の音がしたのは鍋を被つて居たからだといふことを知つたとあり、又今一つの方は婆の寢床の中から血に塗れた釜が轉がり出したと記して居る。是などは若しも雲州の小池の婆の話に、家の茶釜の蓋が紛失して居たといふ例が無かつたならば、或は早速に成るほど鍛冶屋だから、店に有合せの商賣物を持出したのだらう、有りさうなことだとも又はうまく考へた趣向だとも、思つてしまふ人が有るかも知れぬが、實は此挿話は化猫に伴なうて、可なり廣く行はれて居る一つの型であつた。南方氏も以前から集めて居られるやうだが、熊野などには殊に色々の變化を以て傳へられて居る。他の地方にも折々聽く話は、大抵は其金物を以て箭とか鐵砲玉とかを防いだことになつて居る。たとへば狩人が茶釜の蓋で彈丸を丸めて居るのを、傍で家の猫がぢつと見て居る。さうして一回每に前肢でつるりと耳から顏を撫で下げる。それを不審に思つて居た處、次の朝その猫と茶
  translation: 'てみた。すると、さっき婆様が氷で滑って額を割ったと言って寝ているので、いきなりそばへ行って斬り殺すと、猫の正体を現した。何年か前に本物の老母を食べ、自分が代わりに化けていたのだという。ここではすでに、完全に赤岩一角型の話になっているのである。

    土佐と奥州とでは、土地がこれほど遠く、話もこれほど違っているのに、それでも南北で別々の起源を持って伝わったものとは、どうしても考えられない。その理由はどこにあるかというと、つまり全国の聞き手の興味が、おもに、偶然の出来事から怪物の秘密が発覚し、人間がその手柄によって、この先ずっと大きな危難から逃れられたという点に集中していたからである。したがって、正体が発覚する手掛かりなどは何でもよく、語り手の想像力と技量次第で、新しいものに取り替えてもよかったのだと思う。しかし昔の伝承者には、神話以来の長い習慣を保っている人がまだ多く、意識的に昔の型を変えてみようとする人は、今のように次々とは現れなかった。そのため、さまざまな細部の一致が今もしばしば認められ、私たちが起源へさかのぼる手助けとなる一方で、ときには誤った推測へ誘い込む混乱のもとにもなったのだろう。

    一つの要点として、婆に化けていた白い毛の老狼が、鍋をかぶって悠然と登って来たということは、すでに『南路志』にも見え、『国民童話』のほうにも釜をかぶと代わりにかぶって来たとある。さらにほかの二つの筆写報告では、「鍛冶屋の婆を呼んで来い」というくだりはなく、ただ血の跡をたどって佐喜浜の民家に着いたとあるだけだが、それでも金属音がしたのは鍋をかぶっていたからだとわかったといい、もう一方は、婆の寝床の中から血まみれの釜が転がり出たと記している。もし出雲の小池の婆の話に、家の茶釜のふたがなくなっていたという例がなかったなら、なるほど鍛冶屋だから店にある商品を持ち出したのだろう、ありそうなことだ、あるいはうまく考えた趣向だと思ってしまう人もいるかもしれない。しかし実はこの挿話は、化け猫に付いてかなり広く伝わる一つの型だった。南方氏も以前から集めているようだが、熊野などではとくにさまざまな変化を伴って伝えられている。ほかの地方でも時折聞く話では、たいてい、その金物で矢や鉄砲玉を防いだことになっている。たとえば、狩人が茶釜のふたの上で弾丸を丸めているのを、家の猫がそばでじっと見ている。そして一回ごとに、前足で耳から顔へとつるりとなで下ろす。不審に思っていたところ、翌朝、その猫と茶'
  notes:
  - 「赤岩一角式」は、老猫が人を食べてその人に化ける筋を指す比喩。

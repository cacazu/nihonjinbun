  section: 田螺の長者／四 タミナの婿とツブの長者・生きて居る小太郎
  original: '「桃太郞」の、水に沿うて流れて來たといふ例は自然に近かつた。桃はともあれ流れて來たと

    いふ迄は古いのであらう。第二の要點はその貴き童兒の事業、是も亦我々の望んで遂げ難き

    總てのものに及ばうとした故に、段々に所謂大話の方に近くなり、後々少年を樂しましむる

    技術となるに至つて、更に快活なる變化を見たのであらう。此點にかけては「桃太郞」は少し

    も古くない。寧ろ餘りにも氣輕に「一寸法師」以來の型を追うで居る。第三には童兒が成長の

    後に最善の結婚をして、類ひ少なき名家の始祖となること。此點は童話としては必要も無い

    故に、わざと脫落せしめて一段と他の同種の說話との緣を薄くしたが、搜せばまだ幾らでも

    其痕跡は見付けられる。私は現在のところ、先づこの三つの點に於て一致して居る說話があ

    るならば、それが外國にあつても同じ系統のものと推定して、傳播かはた又異處偶生かを、

    考究して見る價値があると思つて居る。さうして個々の民族の孤立した傳承の中には、日本

    のやうに類例の豐富な國の研究に俟つて、將來必ず若干の啓發を受けるものがあるだらうと

    信じて居る。(昭和五年六月、旅と傳說)

    生きて居る小太郎

    小太郞大力の話は案外に分布が弘く、かの狐を母とした安倍童子の例を中に置いて考へる

    と、或は信太の小太郞の出世譚にも、聯絡が有るかとさへ想像せられる。何にもせよ此話を

    した人は各地に住んで居た。單なる緣組や交遊によつて、一つの中心から聽傳へたもので無

    かつたのである。飛驒風物記などを見ると、益田川の流域にも小阪の小太郞と謂つて、珍ら

    しい大力の話が多く傳はつて居る外に、川の邊には小太郞岩の遺跡があり、小阪觀音堂の仁

    王の大木像は、萩原の方から逆流して來たのを、この小太郞が擔ぎ上げたといふ口碑もある。

    高根鄕日和田村のおちんが池に於て、魚を食つたが爲に大蛇になつたといふ、おちんが夫の

    小三郞などもそれらしい。甲州九一色の龍吉はもう別の話だとしても、水の神が異常の子を

    產んだといふ言ひ傳へは、たゞ偶然に小縣郡だけに、持運ばれて居たのでは無いのである。

    犀川の流域でも小太郎といふ名は尙知られて居た。それをいつの頃からか人が小次郞と改め'
  translation: '「桃太郎」の、水に沿って流れてきたという例は、自然なものに近かった。桃であることはともかく、流れてきたという点までは古いのだろう。第二の要点は、その尊い子どもの事業である。これもまた、私たちが望んでも実現しがたいすべてのことに及ぼうとしたため、次第に、いわゆるほら話に近づいた。後に少年を楽しませる技術になるに及んで、さらに明るく活発な変化を遂げたのだろう。この点では「桃太郎」は少しも古くない。むしろ、あまりにも気軽に「一寸法師」以来の型を追っている。第三は、子どもが成長した後、最善の結婚をして、まれに見る名家の始祖となることである。この点は童話としては必要がないため、わざと落とされ、ほかの同種の説話とのつながりがいっそう薄くなったが、探せばまだいくらでも痕跡は見つかる。


    私は今のところ、まずこの三点で一致する説話があるなら、それが外国にあっても、同じ系統のものと推定し、伝播したのか、それとも別の土地で偶然に生まれたのかを研究する価値があると思っている。そして、個々の民族の孤立した伝承の中には、日本のように類例の豊かな国で研究が進むことによって、将来必ず、いくらかの手がかりを得られるものがあるだろうと信じている。（昭和五年六月、『旅と伝説』）


    生きている小太郎


    小太郎の怪力の話は、意外に広く分布している。狐を母とした、あの安倍童子の例を間に置いて考えると、あるいは信太の小太郎の出世物語とも、つながりがあるのではないかとさえ想像される。いずれにせよ、この話を語る人は各地に住んでいた。単に縁組や交際を通じて、一つの中心地から聞き伝えたのではなかったのである。『飛騨風物記』などを見ると、益田川の流域にも小坂の小太郎といって、珍しい怪力の話が多く伝わっている。さらに川辺には小太郎岩という跡があり、小坂観音堂の仁王の大きな木像は、萩原の方から川をさかのぼって流れてきたものを、この小太郎が担ぎ上げたという口伝もある。高根郷日和田村のおちんが池で、魚を食べたため大蛇になったという、おちんの夫の小三郎なども、それらしい。甲州九一色の龍吉はもう別の話とするとしても、水の神が普通とは違う子を産んだという言い伝えが、たまたま小県郡だけへ運び込まれていたのではない。犀川流域でも、小太郎という名はなお知られていた。それをいつのころからか、人が小次郎と改め――'
  notes:
  - 冒頭はスキャン131の議論の続き。末尾はスキャン133へ続く。
  - 昭和五年は1930年。出典の日付は原文のまま残した。

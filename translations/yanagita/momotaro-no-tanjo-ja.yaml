  section: 桃太郎の誕生／犬子噺
  original: '犬子噺

    全國の灰まき爺が童話化したのは、もうよほど久しい前からのことのやうに思はれるが、それでも多くの新採集を比べて見るうちには、段々と古い形が現はれて來る見込がある。現在知られて居る七八つの例の中からでも、古い新らしいは他日の論として、兎に角に是と桃太郞との聯絡だけは見つけ出すことが出來る。たとへば善い爺の飼つて居た小犬は、松村武雄氏の著とある日本童話集には、子供が一人もありませんので、白い犬を一匹飼つて、それを子供のやうにかあいがつて居ました。といふのみであり、他の普通の花咲爺にはそれを白狗とすら謂はぬものも多いが、爺が金持になつた奇瑞の根本には、實際はその賢い小犬の不思議なる出現といふことがあつたらしいのである。森口多里氏の集められた膽澤郡の昔話「黃金の馬」では、上の爺と下の爺とが川に魚簗をかける。上の爺の簗に小犬が一匹引かゝつたのを、怒つて流れに投込むと、それが又流れて下の爺の簗にかゝる。下の爺はそれを拾ひ上げて、太郞と名けて可愛がつて育てる。皿で飯を食はせると皿ほど大きくなり、椀で食はせると又椀ほど大きくなるので、其次には臼で食はせた。さうして忽ち大きくなつて爺樣を背に載せて、山へ出かけて數多くの鹿を捕らせたと謂ふことになつてゐる。石井研堂氏の國民童話に採錄せられたのは、靑森縣上北郡浦野館の灰まき爺であるが、是も心の善い下の爺が掛けて置いた笯に白い小犬が流れて來て入つて居た。それを白妙と名けて可愛がつて育てたと謂つて居る。岩手縣江刺郡の昔話に於ても、二人は一しよに川に笯をかけた。ところが上の爺の笯には小犬が入り、下の爺のには多くの魚が入つて居たので、先きに揚げに行つた上の爺は腹を立て、下の爺の笯の中へ其小犬を投込み、自分は下の笯の魚をば皆取つて、知らぬ顏をして還つて來た。と謂つて居る。同じ縣の紫波郡昔話の中にあるものも、順序はあら方是と同じだが、今少し樣式が桃太郞に近い。それで其第一節だけを原文のまゝで載せると、'
  translation: '犬の子の話

    全国の「灰まき爺」が童話になったのは、もうずいぶん前のことと思われる。しかし、それでも新たに採集された話を多く比べていけば、だんだん古い形が現れてくる見込みがある。現在知られる七、八例だけからでも、古いか新しいかは後で論じるとして、ともかく、これと桃太郎とのつながりは見つけられる。たとえば、善い爺が飼っていた小犬について、松村武雄氏の著とされる『日本童話集』には、

    「子どもが一人もいなかったので、白い犬を一匹飼い、子どものようにかわいがっていました。」

    とあるだけである。ほかの普通の「花咲か爺」には、白い犬とさえいわないものも多い。しかし爺が金持ちになった奇跡の根本には、実際は、その賢い小犬が不思議な形で現れたということがあったらしい。森口多里氏が集めた胆沢郡の昔話「黄金の馬」では、上の爺と下の爺とが川に魚を捕る簗を仕掛ける。上の爺の簗に一匹の小犬がかかったので、怒って流れに投げ込むと、それがまた流れて下の爺の簗にかかる。下の爺は拾い上げ、太郎と名づけ、かわいがって育てる。皿で飯を食べさせると皿ほど大きくなり、椀で食べさせると椀ほど大きくなるので、その次は臼で食べさせた。すると、たちまち大きくなり、爺を背に乗せて山へ出かけ、多くの鹿を捕らせたというのである。石井研堂氏の『国民童話』に採録されたのは、青森県上北郡浦野館の「灰まき爺」だが、これも心の善い下の爺が仕掛けておいた「どう」という魚捕りのわなに、白い小犬が流れてきて入っていた。それを白妙と名づけ、かわいがって育てたという。岩手県江刺郡の昔話でも、

    「二人は一緒に川に魚捕りのわなを仕掛けた。ところが上の爺のわなには小犬が入り、下の爺のわなには多くの魚が入っていたので、先に引き揚げにいった上の爺は腹を立て、下の爺のわなに小犬を投げ込み、自分は下のわなの魚をすべて取って、知らん顔で帰ってきた。」

    という。同じ岩手県の『紫波郡昔話』にあるものも、順序はだいたいこれと同じだが、もう少し形が桃太郎に近い。そこで、第一節だけを原文のまま挙げると、……'

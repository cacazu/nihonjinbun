  original: でに、諸國の交通が發達しなかつた時代には、彼等の藝術も恐らくは地方的に割據し、後日全國を風靡したやうな大きな話題を持合せない土地では、勢ひ附近の神社佛閣に寄り縋つて、其信仰の宣傳を助け又は利用する生活方法に、技能を傾けようとして居たことは察せられる。尤もさういふ業體の者は他にもあつて、どれ迄が盲法師、どれから先が巫女や神なぎの仕事といふ區別も立てにくく、又事によると相互に融通して居たのかも知れぬが、少なくとも此輩の力に依らなければ、斯くまでは分布もせず又變化もしなかつたらうと思ふ口承文藝は、旣に幾つとも無く其例が擧げられるのである。草子の「物草太郞」が生國は信濃で、筑摩の郡あたらしの鄕といふ處に、四本の竹の柱を小屋にして住んで居たといふだけなら、或は都の文人の筆まかせとも考へられるが、それが出世の後信濃の中將となつて在國し、富貴長命を極めて終りに穗高の大明神となり、女房は朝日の權現となつて現はれたまふといふに至つては、斯ういふ道化たる話には不必要な結末で、前に定まつた一つの形が、その故鄕に於て旣に或程度の作りかへを受けてから、持出されたものなることを想像せしめるのである。每日一度この草子を讀みて人に聽かさん人は、財寶に飽滿ちて、幸ひ心に任すべしとの御誓ひ也、めでたし〳〵とある最後の一句なども、恐らくは亦古い形式の引繼ぎであつた。卽ち物草太郞の奇跡が、今少しく眞面目な驚きを以て迎へられて居た頃から、旣に是に近い言葉が附け添へられてあつたのを、其儘記錄に採用して居るのから見ても、是が創作で無かつたことがわかるのである。我々は寧ろこの偶然保存せられたる記錄の一篇に由つて、說話が追々と單純なる娛樂用に化して來た經路を尋ぬべきである。「物草太郞」の滑稽が幾分か濃厚に失し、押問答の妙に理窟張つて居るのは、それがもと盲人の所管に屬して居たからだと見るのは、私一個の直覺かも知れぬが、少なくとも說話には道化たのと眞面目なのと二つの種類があつて、それが男女の兩性の間に、分業になつて居たことだけは事實である。法師と歌比丘尼などは知合ひであつた場合が多く、又活計の爲には方々の昔話を拾ひ集め受賣して、必ずしも本山の正しき所傳ばかりを、守らうとしなかつたことも同じであるが、しかも二者の間には夙くから、著しい傾向の相異が現はれて居た。獨り合戰や變化退治のやうな荒くれたもののみと言はず、所謂
  translation: '……諸国の交通が発達していなかった時代には、彼らの芸も、おそらく地方ごとに分かれていたのだろう。後に全国を席巻したような大きな題材を持たない土地では、自然と近くの神社や寺院に頼り、その信仰の宣伝を助けたり利用したりして暮らしていくために、技量を注いでいたことが推察される。もっとも、同じような仕事をする者はほかにもいて、どこまでが盲法師で、どこから先が巫女や神なぎの仕事なのかは区別しにくい。また、ひょっとすると互いに融通し合っていたかもしれない。しかし、少なくともこうした人々の力によらなければ、これほど広まることも変化することもなかっただろうと思われる口承文芸は、すでに数多く例を挙げられる。

    草子の『物草太郎』で、生まれた国は信濃、筑摩郡の「あたらしの郷」という所で、竹四本を柱にした小屋に住んでいたというだけなら、都の文人が筆に任せて書いたとも考えられる。しかし出世した後は信濃の中将になって国に住み、富貴と長寿を極め、最後には穂高の大明神となり、妻は朝日の権現となってお現れになったというに至っては、これほどおどけた話には必要のない結末である。先に定まった一つの形が、すでに故郷である程度の作り変えを受けてから、持ち出されたのだろうと想像させる。

    「毎日一度、この草子を読んで人に聞かせる人は、財宝に満ち足り、幸せも思いのままになるだろう、というお誓いである。めでたい、めでたい」

    という最後の一句なども、おそらく古い形式を引き継いだものだった。つまり、物草太郎の奇跡が、今よりも少し真剣な驚きをもって受け止められていたころから、すでにこれに近い言葉が添えられていて、それをそのまま記録に取り入れた。この点から見ても、これが創作ではなかったとわかるのである。

    私たちはむしろ、偶然保存されたこの一編の記録によって、説話が次第に、純粋に娯楽のためのものへと変わってきた道筋を探るべきである。『物草太郎』の滑稽さがやや濃すぎ、押し問答が妙に理屈っぽいのは、もと盲人たちの扱う分野に属していたからだと考えるのは、私一人の直感かもしれない。しかし少なくとも、説話には、おどけたものと真面目なものの二種類があり、それが男女のあいだで分業になっていたことは事実である。法師と歌比丘尼などは、知り合いだったことも多い。また、生計のため、あちこちの昔話を集めて受け売りし、必ずしも本山の正統な伝承だけを守ろうとしなかったことも、双方に共通している。だが両者には、早くから著しい傾向の違いが現れていた。合戦や化け物退治のような荒々しいものだけでなく、いわゆる……'
  notes:
  - 冒頭はscan153末尾、末尾はscan155冒頭に続く。
  - 神なぎは神に仕える宗教者、歌比丘尼は歌や語り物を伴って活動した女性宗教芸能者。原文の職業名を保持した。

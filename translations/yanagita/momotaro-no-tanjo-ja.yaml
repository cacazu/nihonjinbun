  section: 桃太郎の誕生／四 童話と其記録・五 赤本の災厄
  original: 'すといふだけは違つて居るが、灰を蒔くといふ所までは越中の灰蒔爺、奥州の雁取爺と同じだからその前後の整うて居る後の二者よりは新らしいことがわかる。それから終りの殿樣に尻を斬られたといふ部分は、今一つの鄰の爺型の屁ひり爺と共通であるが、是も屁ひりの方には土地によつて古い形があり、もとは山の神との交渉を語つて居た話であつた。それを忘れてしまつた花咲爺は、此等の爺話の片端を切つて繋いで、後に結構したものと斷定して、大抵は間違ひが無いのである。

    五赤本の災厄

    それから又かち〳〵山、是は三種の昔話の繼ぎ合せといふことがほゞ證明し得られる。其中でも智謀に富む兎が愚直なる狸を欺き苦しめるといふ一條は、世界共通の動物說話の、殊によく知られて居る部分で、爰ではたゞ狸が其樣にまでひどい目に遭はされる理由を、爺の名代の仇討とした點がちがつて居るのである。最初其狸が爺に捕へられた事情なども、近頃は至極手短かに述べることになつて居るが、以前は是が又纏まつた一つの御話であつて、要點は石の上に餅を塗つて置くのを知らず、いつもの如く其石の上に登つて、爺婆を惡口しようとして失敗したことになつて居た。さういふ愚な狸が中途に於て婆を誑き殺し、其婆に化けて爺の歸りを待受けて居たなどといふことは、少し考へて見れば不調和は爭へないが、此部分が亦北歐の赤頭巾物語と對照すべき、我々の瓜子姫譚の骨子であつた。たゞ彼には「糠屋の隅を見よ」といふことを、家の鷄が鳴いて教へたに反して、これでは狸が自らさう謂つて遁げ去つたといふ點を異にするのみである。この三通りの昔話は、今でも獨立して方々の田舍には行はれて居る。かち〳〵山は單に之を省略し且つ綴り合せたといふ以上に、是といふ變化は加へて居ないのである。次に舌切雀と猿蟹合戰とであるが、この二つだけは或は古くから、斯ういふ纏まつた形で傳はつて居たのかと思つて居ると、それがやはり少しづつ恠しくなつて來たのである。雀報恩譚は朝鮮にも有るといふ狐の米、柿の種の方は猿蟇との餅爭ひなどから、筋を引いて居ることは明かであるにしても、たゞそれのみでは話が此樣に展開するわけは無かつた。それには他に今一つの系統の是に參加した昔話があつたことは、强ひて物々しい辯證推理を傭はず'
  translation: '……せるという点だけは違っているが、灰をまくところまでは越中の「灰まき爺」、奥州の「雁取り爺」と同じなので、前後の筋が整っているこの二つよりは新しいとわかる。また、最後の殿様に尻を斬られたという部分は、もう一つの隣の爺型である「屁ひり爺」と共通している。ただし「屁ひり」のほうには、土地によって古い形があり、もともとは山の神との関わりを語る話だった。そのことを忘れてしまった「花咲か爺」は、これらの爺の話の断片を切りつないで、後に組み立てたものだと断定して、ほぼ間違いないのである。

    五　赤本の災厄

    次に「かちかち山」である。これは三種類の昔話をつなぎ合わせたものだと、ほぼ証明できる。そのうち、知恵のあるウサギが、愚直なタヌキをだまして苦しめる筋は、世界共通の動物説話の中でも、とりわけよく知られた部分である。ここではただ、タヌキがそこまでひどい目に遭わされる理由を、爺に代わってする仇討ちとした点が違っている。初めにそのタヌキが爺に捕まった事情なども、近ごろはごく短く語られるようになっているが、以前はこれも、まとまった一つの話だった。要点は、石に鳥もちが塗ってあるのを知らず、いつものようにその石に登って爺と婆の悪口をいおうとして失敗した、ということだった。そういう愚かなタヌキが途中で婆をだまして殺し、その婆に化けて爺の帰りを待っていたというのは、少し考えれば不調和なのは否定できない。だが、この部分がまた、北欧の「赤頭巾」の物語と比較すべき、日本の「瓜子姫」の話の骨組みだった。ただ「瓜子姫」では、「糠屋の隅を見よ」と家のニワトリが鳴いて教えたのに対し、こちらではタヌキ自身がそういって逃げ去ったという点が違うだけである。この三通りの昔話は、今も独立して、各地の田舎に伝わっている。「かちかち山」は単にそれらを省略し、つなぎ合わせた以上に、目立った変化は加えていないのである。

    次に「舌切り雀」と「猿蟹合戦」である。この二つだけは、ひょっとすると古くからこのようなまとまった形で伝わっていたのかと思っていると、それもやはり、少しずつ怪しくなってきた。雀の恩返しの話は朝鮮にもあるという「狐の米」から、柿の種の話は猿やヒキガエルとの餅の取り合いなどから、つながっていることは明らかだとしても、ただそれだけでは、話がこのように展開するはずはなかった。ほかにもう一つの系統の昔話が加わっていたことは、わざわざ大げさな論証や推理を使わな……'
  notes:
  - 冒頭・末尾は前後のスキャンへ続く。
  - 石に塗る「餅」は、文脈上、鳥もちとして訳した。

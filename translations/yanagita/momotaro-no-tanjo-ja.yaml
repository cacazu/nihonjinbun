  section: 米倉法師／五 餅と座頭
  original: 手の目が見えぬを幸ひとして、そつと一升だけ餘分の糯米をさし加へて餅にした。もう早一斗分の餅は食つてしまつたと思ふが、まだ少しばかり殘つて居たのは案外だ。しかし是以上は何としても咽を通らぬ。殘念ながら此賭には私が負けた。さあ切つて下されと謂つて首をさし伸べる。何の御坊の首などを切つて何にしようぞ。あれは戯れだから氣にかけずに居るがよいと言ふと、意地張りの花都座頭はいきり立つて、さても笑止な土地がらよ。一旦取らうと言つた盲の首も斬り得ないとは、よつぽど腰拔けな話だと散々に惡口する。座中の若侍が短氣を起して、につくい盲めがと拔打ちに其首を斬り放すと、驚くべし咽の切口の際まで、今食つた餅が盛り上つて居たといふ話である。一升の糯米を量り添へた女房は、之を見て慚愧の念に責められ、且つは亡靈の崇を畏れて、塚を築き櫻の木を其上に栽ゑて、そこに花都座頭を神として祀つたといふのは、如何にしても耳新らしい御社の緣起であつた。是が實際其通りの事があつたといふ歷史であるならば、もう別に何も言ふべきことは無い、唯もしそれが作り話であつたとすれば、誰がその作者であつたらうかが、又しても問題になるのである。兎に角に話はよほど古い時代のことのやうに、土地の人たちには考へられて居たやうだが、さう古い頃ならば酒と餅との論も無く、又花都などといふ旅の琵琶法師が此邊に來ることも無かつた筈である。「筆のまに〳〵」といふ隨筆には此口碑を載錄して、其後に斯ういふことを附加して居る。ちやうど最初の所謂座頭櫻が枯れた頃に、其地面の持主がわけの判らぬ病氣をした。伺ひを立てて見ると花都の崇りであつたとあるから、話は卽ち其際に始めて明かになつたのである。ところが其地主の息子といふのが之を安からぬことに思つて居ると、或年の冬の雪の日に、犬が其祠の上に來て糞をした。是を見てあの樣な事をされても、默つて居るやうな神なら祭るねうちが無いと言つて、祠を毀して棄ててしまつたけれども、是には何の障りも無かつた。さうして緣もゆかりも無い鄰の某といふ者に、又花都の靈が憑いて惱ましたので、今度は祠だけは櫻の木とは別に、鄰地面に再建して祭ることになつたのだとある。卽ち其當時から旣に座頭の言を信ずる者と信じない者とがあつて、完全に一箇の傳說となりきることは出來なかつたのであるが、話が珍らしい爲に聽いた者だけは皆記憶して居た。さうしてさも有りぬべしと思つた者だけが、再び氣病みをしたり信心をしたりしたのであつた。斯ういふ事實を語つた者は、普通の女の口寄せでは無かつたらう。是も
  translation: '〔前のスキャンから続く〕目が見えないのをよいことに、そっと一升だけ余分なもち米を足して餅にした。もう一斗分の餅は食べ終えたはずなのに、まだ少し残っているのは意外だ。しかしこれ以上はどうしても喉を通らない。「残念ですが、この賭けは私の負けです。さあ切ってください」と言って、首を差し出す。「何の、お坊様の首など切って何になろう。あれは冗談だから気にしないでよい」と言うと、意地っ張りの花都座頭は激高し、「何とも情けない土地柄だ。一度取ると言った目の見えない者の首も切れないとは、ずいぶん腰抜けな話だ」と、さんざん悪口を言った。座中の若侍が短気を起こし、「憎らしい盲人め」と、抜き打ちにその首を切り落とすと、驚くべきことに、喉の切り口のぎりぎりまで、今食べた餅が盛り上がっていたという話である。一升のもち米を余分に加えた妻は、これを見て恥じ悔やむ念に責められ、また亡霊のたたりを恐れ、塚を築いてその上に桜を植え、花都座頭を神として祭ったという。何とも耳新しい神社の縁起だった。

    これが本当にそのとおりの出来事を記した歴史なら、もうほかに何もいうことはない。ただ、もし作り話だったとすれば、作者は誰だったのかが、また問題となる。ともかく、土地の人はずいぶん古い時代の話だと考えていたようだが、それほど古いころなら、酒と餅の議論もなく、また花都などという旅の琵琶法師がこのあたりへ来ることもなかったはずである。『筆のまにまに』という随筆は、この口伝を載せ、その後に次のことを付け加えている。ちょうど最初のいわゆる座頭桜が枯れたころ、その土地の所有者が原因不明の病気になった。神意を伺うと花都のたたりだったとあるから、話が初めて明らかになったのはそのときなのである。ところが、その地主の息子がこれを不愉快に思っていると、ある年の冬の雪の日に、犬が祠の上に来て糞をした。これを見て、あんなことをされても黙っている神なら祭る価値がないと言い、祠を壊して捨ててしまったが、何のたたりもなかった。すると、縁もゆかりもない隣の誰それという者に、今度は花都の霊が取りついて苦しめたので、祠だけは桜の木から離し、隣の土地に建て直して祭るようになったという。つまり、当時からすでに座頭の言葉を信じる者と信じない者があり、完全に一つの伝説にはなりきれなかった。しかし話が珍しいので、聞いた者は皆覚えていた。そして本当にありそうだと思った者だけが、再び思い悩んで病気になったり、信心したりしたのだった。このような出来事を語った者は、普通の女性の口寄せ役ではなかっただろう。これもまた、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン275）と本文OCRを照合。
  - 口寄せは、死者の霊の言葉を伝えるとされた行為とその担い手。引用内の差別的な呼び掛けは、原文の暴力的な場面を再現する範囲で訳した。
  - 原文の歴史的差別語は文脈を保持し、通常は「目の見えない人」等と訳した。障害者の性質を一括りにする評価は著者の当時の見解であり、現代の事実認定ではない。

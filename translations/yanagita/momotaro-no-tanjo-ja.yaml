  section: 瓜子織姫／諸國の瓜子姫
  original: '聞えて居て、御駕籠で迎へが來たのでそれに乘つて出て行くと、途中で子供たちが、瓜姫の

    駕籠に、アマノジヤクが乘つて居ると囃し笑うた。駕籠舁き等は之を聽いて心付き、怒つて

    アマノジヤクを引出して殺してしまふ。(此時に萱の根で如何とかしたといふ話があつて)、

    だから今でも萱の根の紅いのは、このアマノジヤクの血に染まつたのだと謂つて居る。(堀維

    孝翁の手翰に依れば、出羽の庄內にも大部分是に似た昔話があつた。瓜子姫が野老を好んで

    居たのに、アマノジヤクの化けたのは毛も皮も取らずに食はうとして、爺婆に食べ方を教へ

    て貰ふ。それから殿樣に召されて行く途中、アマノジヤクが乘つて居ると囃したのは樹の上

    の鳥であつた。それで露顯して萱原へ引出されて斫り殺された。それ故に今でも萱の根は紅

    いのだと謂つたさうである。それと近いのは前に列記した岩手縣の一話(例三)に、爺と婆と

    は山にホドコを掘りに行つた留守に、山母が來て瓜子姫子を食つてしまひ、自分がそれに化

    けて機を織つて居る。そこへ二親が山から戾つて來て、採つて來たホドコを洗ひに贋の姫子

    を川に遣る。さうすると大きなのは皆食つてしまつて、小さなホドコばかりを持つて歸り、ど

    うしたかと聞くと滑つて轉んで、流してしまつたと答へる。可愛いゝ瓜子姫子のことだから

    爺婆は叱らなかつたが、顏に血が附いて居るのを手拭で拭つて遣ると、それが化の皮だから

    直ぐに剝げて、憎らしい山母の顏になつて遁げて行つたと謂ふのである。アマノジヤクが斬

    り殺されて、それから萱の根が紅くなつたといふ例は、信州の下水內郡にもあつた(例八)。

    是が出雲では黍の莖はなぜ紅いかの話になり(例一〇)、石見では粟と蕎麥と黍とが根の赤い

    由來として語られて居ることは、旣に述べて置いたからもう繰返す必要も無い。)

    一九新潟縣南蒲原郡(加無波良夜譚二〇二頁)

    爺と婆とが、おりかは姫といふ美しい娘をもつて居た。近いうちに嫁に行くことになつて居

    る。姫は山芋が好きなので、爺さと婆さがそれを掘りに出かける。誰が何と言つても戶を開

    けんなよと言ひつけて行つた留守に、アマンギヤクが遣つて來て强ひて戶を開けさせ、騙し

    て爼板の上に寢させて切つてしまつた。さうして姫に化けて知らん顏をして居る所へ爺と婆

    は山から歸つて、芋をすつて姫に食べさせると、姫はあつぷら〳〵してそれを食べた。「變な

    で、うちの娘は」と爺婆は思つたが、アマンギヤクだとはまだ知らなかつた。いよ〳〵嫁入の

    日になつて、迎への駕籠に姫を乘せて二人が附いて行くと、一羽の烏が其駕籠の上にとまつ'
  translation: '伝わり、駕籠で迎えが来たので、それに乗って出かけた。途中で子供たちが、「瓜姫の駕籠にアマノジャクが乗っている」とはやして笑った。駕籠かきたちはそれを聞いて気づき、怒ってアマノジャクを引きずり出し、殺してしまった。（このとき、萱の根で何かをしたという話があって、）だから今でも萱の根が赤いのは、このアマノジャクの血に染まったからだという。

    （堀維孝翁の手紙によると、出羽の庄内にも、大部分がこれに似た昔話があった。瓜子姫は野老が好きだったのに、アマノジャクが化けた瓜子姫は、毛も皮も取らずに食べようとし、爺婆に食べ方を教えてもらう。その後、殿様に召されて行く途中、「アマノジャクが乗っている」とはやしたのは、木の上の鳥だった。それで正体がばれ、萱原へ引き出され、斬り殺された。そのため今でも萱の根は赤いのだ、と語ったそうである。

    これに近いのは、前に並べた岩手県の一話（例三）だ。爺婆が山にホドコを掘りに行った留守に、山母が来て瓜子姫子を食べ、自分が姫子に化けて機を織っている。そこへ両親が山から帰り、採ってきたホドコを洗わせに、偽の姫子を川へやる。すると、大きいものは全部食べてしまい、小さいホドコばかり持ち帰る。どうしたのかと聞くと、滑って転んで流してしまった、と答える。かわいい瓜子姫子のことなので爺婆は叱らなかったが、顔に血がついているので手拭いでぬぐってやると、それは化けの皮だからすぐにはがれ、憎らしい山母の顔になって逃げていったという。

    アマノジャクが斬り殺され、その後、萱の根が赤くなったという例は、信州の下水内郡にもあった（例八）。これが出雲では「黍の茎はなぜ赤いか」という話になり（例十）、石見では粟・蕎麦・黍の根が赤い由来として語られていることは、すでに述べたので繰り返す必要はない。）

    十九　新潟県南蒲原郡（『加無波良夜譚』二〇二ページ）

    お爺さんとお婆さんには、おりかは姫という美しい娘がいて、近く嫁入りすることになっていた。姫は山芋が好きなので、お爺さんとお婆さんが掘りに出かける。「誰が何と言っても戸を開けるなよ」と言いつけて出た留守に、アマンギャクが来て無理に戸を開けさせ、だましてまな板の上に寝かせ、切ってしまった。そして姫に化け、知らん顔をしていた。そこへ二人が山から帰り、芋をすって姫に食べさせると、姫はあっぷらあっぷらして食べた。「変だな、うちの娘は」と爺婆は思ったが、アマンギャクだとはまだ知らなかった。いよいよ嫁入りの日になり、迎えの駕籠に姫を乗せて二人がついて行くと、一羽の烏がその駕籠の上に止まっ'
  notes:
  - 冒頭はscan96、末尾はscan98へ続く。
  - 「あっぷらあっぷら」は食べ方を表す原話の方言・擬態語。明確な語義を補わず残した。
  - ホドコは、山で掘って食べる植物の地方名として原文どおり保持。

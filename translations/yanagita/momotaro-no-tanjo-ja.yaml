  section: 繪姿女房
  original: に命を助けられ、其恩に感じて姿をかへて妻になり子を產む。是も產屋のタブーを破つたばかりに、緣が盡きて一つの珠を遺して歸つて行く。後に其珠を殿樣に取上げられて、濱に出て手を叩くと母が現れて又一つの珠を與へる。我子の爲には盲になるは厭はぬが、どうか三井寺に鐘を上げて、夜晝の境を聞分けさせてくれと言つたとあるのは、どうやら此あはれを語つて居た旅の盲女の、出處素性も知れさうな話であつた。他の地方に傳はつて居るものは是と大同小異で、殊に九州の果にある話の方が、却つて一段とこの靑森縣の例に近かつた。たとへば陸中の江刺郡で、峯寺の鐘の由來として傳ふるもの(聽耳草紙)などは、兒の名が坊太郞で母の殘して行つた左の眼玉を甞めて飢を養ひ、大きくなる迄にしやぶり上げて無くなつた。それで父親が山奥の沼に行き、わけを話して右の方の片眼を貰つて來る。もう是で夜明けも日暮れも知れなくなつた。どうか此沼の岸に鐘を釣つて、明六つ暮六つを教へてくれと賴んだのが、峯寺の鐘であつたと言ひつゝ、尙坊太郎がその盲の母と再會したとあるのは、やはり「三井寺」の痕跡であつたらしい。紀州では西熊野の日置の寶勝寺の僧孝順、深田の奥の大蛇と契つて子を生んだといふ話がある(牟婁口碑集)。生れた一人子が盲目であつた故に、母は我眼の球を拔いて子の目にはめ、もとの姿になつて山の奥に還つて行つたとあつて、是にも物悲しい明け暮れの鐘の謂はれを說いて居る。九州の例といふのは豐後傳說集に、大野郡沈堕の瀧の口碑が一つ、「旅と傳說」二卷一一號には肥前の島原半島に於て、百四十年前の雲仙の山燒けと、結び附けた話が二つあり、念入りに捜せばまだ幾つも有りさうな樣子である。是が何れも皆殺されようとする蛇を助けたら、それが美女になつて嫁に來たことになつて居る(但し肥前の方のは海蛇とも、普賢の池の白鰻とも言ふ)。それから其蛇女房の遺して行つた珠を、殿樣にまき上げられたことも津輕の話と同じく、しかも第二の珠までも强奪されてしまつたので、水の主は激怒して父と子とを遠くへ立退かせ、山を突崩して思ひ切つた復讐をしたやうに、今日では說かれて居るのである。この眼無しの大蛇の悲劇は盲人の作爲らしく、座頭は水の神樣と古くから關係が有つたらしいのだが、それは又他日の談とする。こゝに考へて見たいことは異類の婚姻、卽ち天上の國から又は水の都から、特に人間の貧しく賤しい一人を見立てて、嫁入をして來たといふ因緣は何に在つたかで、それには越後や相州の笛吹男の話が、亦一つの暗示にはなるのである。
  translation: 'に命を助けられ、その恩を感じて姿を変え、妻となって子を産む。これも産屋の禁を破ったばかりに縁が切れ、一つの珠を残して帰っていく。後にその珠を殿様に取り上げられ、浜へ出て手をたたくと母が現れ、もう一つの珠を与える。「わが子のためなら目が見えなくなることもいとわないが、どうか三井寺に鐘を奉納して、夜と昼の境を聞き分けられるようにしておくれ」と言ったというのは、どうやらこの哀れな物語を語っていた旅の盲目の女性の、出身や素性も推し量れそうな話であった。

    ほかの地方に伝わるものも、これと大同小異である。とくに九州の端にある話のほうが、かえって一段とこの青森県の例に近かった。たとえば陸中江刺郡で、峯寺の鐘の由来として伝えるもの（『聴耳草紙』）などは、子の名を坊太郎といい、母の残した左目の玉をなめて飢えをしのぎ、大きくなるまでにしゃぶり尽くしてなくしてしまったという。そこで父が山奥の沼に行って事情を話し、右の片目をもらってくる。これでもう夜明けも日暮れもわからなくなった、どうかこの沼の岸に鐘をつり、明け六つと暮れ六つを知らせてくれと頼んだのが峯寺の鐘だったといいながら、さらに坊太郎がその目の見えない母と再会したとあるのは、やはり「三井寺」の痕跡だったらしい。紀州には、西熊野の日置の宝勝寺の僧孝順が、深田の奥の大蛇と契って子をもうけたという話がある（『牟婁口碑集』）。生まれた一人子の目が見えなかったため、母は自分の眼球を抜いて子の目にはめ、元の姿になって山奥へ帰っていったとあって、これにも物悲しい朝夕の鐘の由来が語られている。九州の例としては、『豊後伝説集』に大野郡沈堕の滝の言い伝えが一つ、『旅と伝説』二巻十一号には、肥前島原半島で百四十年前の雲仙の山崩れ・噴火に結び付けた話が二つあり、丹念に探せばまだいくつもありそうである。いずれも、殺されそうな蛇を助けると、その蛇が美女になって嫁に来たことになっている（ただし肥前のものは、海蛇とも普賢の池の白ウナギともいう）。その蛇の妻が残した珠を殿様に巻き上げられたことも津軽の話と同じだが、こちらは第二の珠まで奪われたため、水の主が激怒し、父子を遠くへ立ち退かせてから山を突き崩し、徹底した復讐をしたと、今では説明されている。

    この目のない大蛇の悲劇は、盲目の人々が作ったものらしく、座頭は水の神と古くから関係があったらしいが、それはまた別の日の話にしよう。ここで考えたいのは異類との婚姻、つまり天上の国や水の都から、とくに貧しく身分の低い一人の人間を選び、嫁入りしてきたという縁が、何によるものだったかということである。その点で越後や相州の笛吹き男の話も、一つの手掛かりになるのである。'
  notes:
  - 「盲女」「盲人」「座頭」は当時の呼称。座頭はここでは語りなどに携わる盲目の芸能者を指す。著者の起源推測は推測として訳した。
  - 「明け六つ・暮れ六つ」は、およそ夜明けと日暮れの時刻。

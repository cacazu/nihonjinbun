  section: 隣の寝太郎／八 信州の信の宮・山田の露
  original: いふ一條のみは落ちて居る。小泉の小太郞も小泉山の萩を、二束に刈つてのけたといふ大力であつたが、安曇の信太郞は其上に農作の功勞を殘し、神として今も敬はれて居るのである。是が長門の寢太郎荒神と似て居ないのは、單に話し手の力を入れて話す部分が、時代と地方と人とによつて、一樣で無かつた爲では無かつたか。たとへば信州にも信濃巫と稱して、女性の昔話を携へて旅をする者が住んで居た。若しこの簡單な話の種が假に彼等の手にかゝる場合があつたとしたら、或は秋田の八郞潟の口碑の如き、戀心の豐かなものに變形しては居なかつたかどうか。この私の想像が當つて居るや否やを確かめるものは、今後の採集とその綿密なる比較の他には無いのである。自分が故意に都合のよい材料だけを拾ひ集めて、ただ何でもかでも元は皆一つの話だと强辯する者の如く、誤解せられずんば幸ひである。(昭和五年七月、旅と傳說)山田の露昭和五年の春の鄕土舞踊大會に、備中白石島の女たちが日本靑年館に出て來て、山田の露といふ口說節の盆踊を踊つた。其歌の章句は民俗藝術三卷四號にも出て居るが、私が今からちやうど五十年前に、播州の故鄕で聽いて居たものと、筋は全く同じで言葉が少しづつ變つて居るのみである。緣は不思議なものにてござる。父は橫萩豐成公よ姉は當麻の中將姫よ妹しらたき二八の姿一のきさきにそなはり給ふ。こゝに津の國山田の谷に
  translation: '……一節だけが抜けている。小泉の小太郎も、小泉山の萩を二束に刈りまとめたという怪力の持ち主だったが、安曇の信太郎は、それに加えて農作の功績を残し、今も神として敬われている。これが長門の寝太郎荒神に似ていないのは、ただ語り手が力を入れて語る部分が、時代・地方・人によって一様ではなかったためではないだろうか。たとえば信州にも、信濃巫と呼ばれ、女性の昔話を携えて旅をする人たちが住んでいた。仮にこの単純な話の種が、その人たちの手にかかったことがあったとすれば、秋田の八郎潟の言い伝えのような、恋心にあふれたものに変わっていたのではないだろうか。私のこの想像が当たっているかどうかを確かめる手段は、今後の採集と、それらの綿密な比較以外にない。私がわざと都合のよい材料だけを拾い集め、とにかく何もかも、もとは一つの話だと言い張る者のように、誤解されなければ幸いである。

    （昭和五年七月、『旅と伝説』）

    山田の露

    昭和五年の春の郷土舞踊大会に、備中の白石島の女性たちが日本青年館へ来て、「山田の露」という口説節の盆踊りを踊った。その歌詞は『民俗芸術』三巻四号にも掲載されている。だが、私が今からちょうど五十年前、播州の故郷で聞いていたものと、筋はまったく同じで、言葉が少しずつ違うだけである。

    縁とは不思議なものでございます。

    父は横萩豊成公、

    姉は当麻の中将姫、

    妹の白瀧は十六歳の姿で、

    第一のお妃の位におつきになった。

    さて、摂津の国、山田の谷に……'
  notes:
  - 冒頭はscan161末尾の続き。末尾の歌はscan163へ続く。
  - 昭和五年は1930年。口説節は物語を節に乗せて長く歌う形式。「横萩豊成」は歌の本文の表記を保持した。

  section: 隣の寝太郎／一 治水拓土の功績・二 長者の婿
  original: 外とも思はれぬのである。一言でいふならば寢太郞の話をよくする人が、住んで居た屋敷又は町であつたと、解して置いて差支が無いのである。但し土地へ行つてもう一度確かめて見た方がよいが、私の聽いて居る或一人の報告では、寢太郞はよく寢る故に付けられた綽名であつて、本來は惡七兵衞景淸の後裔といふことになつて居たさうである。是が我々に取つて又一つの大切な手掛かりであるわけは、日本には景淸を元祖とする盲人の一群があつて、久しく色々の民間說話を管理し、又之を町田舎に配達して居たらしいからである。彼等は平家物語や三代田村といふ類の長い戰記を表藝とはして居たが、その合間には珍らしい多くの昔話を覺えて居て、面白く之を語り、又時々は少しづつ改作を試みて、聽く人の機嫌を取結ぶことを職業にして居た。さうして村々の庚申待の宵には、彼等は缺くべからざる御伽の人數でもあつたのである。二
    長者の聟寢太郞が稀代の惰け者でありながら、殆と日本の全土の何處にでも知られて居り、又在々にして土着して傳說に化して居るのは、假に全部が惡七兵衞の末流の所業で無い迄も、少なくとも話そのものが、始終旅をして居た證據といふことは出來る。自分が幼時播州の田舍で聽いて居たのは、細かな部分はもう忘れてしまつたけれども、寢太郞が何一つ能の無いのらくら者の癖に、一朝智謀を以て富貴の望みを達したといふ迄は、長州厚狹の例と同じであつた。しかも其手段といふのが丸で別種のもので、その所謂「昔々或處」は、明白に山口縣下では無かつたのである。播州の寢太郞は鄰が長者で、美しい一人娘をもつて居た。寢太郎は夜中に其長者の枕元に近よつて、「鄰の寢太郞を聟に取れ」といふと、長者が其聲を神の御告げと信じて、娘をこの惰け者にくれるといふ筋であつたが、どうしてそれを信ずることになつたものか、其まではもう記憶して居ない。たゞ此一句だけが、今でも强く耳の底にこびり付いて居るばかりである。前にも桃太郞に就いて旣に考へて見た如く、水土平定といふが如き世の中の爲になる勞苦と、完全なる花嫁を貰つて家を興すといふことは、昔話の英雄の二個の記念すべき大事蹟には相異ないが、それは其家筋の者の立場から見た時のことで、外部から考へるならば第一の
  translation: '……思われない。一言でいえば、寝太郎の話をよくする人が住んでいた屋敷や町だった、と理解しておいて差し支えないのである。ただし、現地でもう一度確かめたほうがよいが、私が聞いたある人の報告では、寝太郎とはよく寝るためについたあだ名で、本来は悪七兵衛景清の子孫だということになっていたそうである。これが私たちにとってもう一つの大切な手掛かりになるのは、日本には景清を祖とする盲人の一団があって、長いあいだ、さまざまな民間説話を保ち伝え、町や村へ届けていたらしいからである。彼らは『平家物語』や『三代田村』といった長い軍記物を主な芸にしていたが、その合間に語る珍しい昔話もたくさん覚えていた。それを面白く語り、ときには少しずつ作り変えてみて、聞く人を喜ばせることを職業にしていた。そして村々の庚申待の宵には、彼らは話の相手をするのに欠かせない人たちでもあったのである。

    二　長者の婿

    寝太郎は、めったにいないほどの怠け者でありながら、ほぼ日本全国のどこでも知られている。また、あちこちの土地に定着して伝説になっている。仮にその全部が悪七兵衛の流れをくむ人たちの働きによるのでないとしても、少なくとも、話そのものが絶えず旅をしていた証拠だとはいえる。私が子どものころ播州の田舎で聞いていた話は、細かいところはもう忘れてしまったが、寝太郎が、何一つ取り柄のないのらくら者のくせに、あるとき知恵と計略によって金持ちになる望みをかなえた、というところまでは長州厚狭の例と同じだった。けれども、その手段はまったく別で、話にいう「昔々、あるところ」は、明らかに山口県内ではなかった。播州の寝太郎の隣には長者が住み、美しい一人娘がいた。寝太郎が夜中に長者の枕元へ近づき、「隣の寝太郎を婿に取れ」というと、長者がその声を神のお告げだと信じて、娘をこの怠け者に嫁がせるという筋だった。ただ、どうしてそれを信じるようになったのか、そこまではもう覚えていない。この一句だけが、今でも強く耳の奥にこびりついているのである。

    前に桃太郎について考えたように、水を治め土地を整えるといった世の中に役立つ苦労と、申し分のない花嫁を迎えて家を興すこととは、どちらも昔話の英雄の、記念すべき二つの大きな業績には違いない。しかし、それはその家筋の人の立場から見た場合で、外部から考えるならば、第一の……'

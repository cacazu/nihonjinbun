  section: 和泉式部の足袋／一 熊の子鹿の娘
  original: '或爺さま婆さまの處へ、其赤兒を連れて來る。

    是を鹿娘又は鹿姫と名けて養育し、大きくなつてから長者の家の火焚女となつて居る。

    それを長者の和子が見染めて、見出されて出世をすることは姥皮の話ともよく似て居た。

    卽ち梅の枝を雀のとまつたまゝ手折り、引綿の上を新らしい草履であるき、又は水の上をあるくことの出來たりした者が此娘であつたので、終に引上げられて長者の花嫁となると謂ふので、是から想像すると、この地方では純然たる一つの昔話であつた(老媼夜譚一五二頁)。

    ところが是と發端のよく似た話で、もう半ば以上傳說に化して居る例も外にはある。

    まさか今日では其樣な事が曾て有つたらうと思はぬ迄も、それが丸々の作り事だつたら、說明し得なかつたらうと思ふ信仰が、今も殘つて居る土地はあるのである。

    山岡俊明の類聚名物考卷四十に、和泉式部の事蹟といふものを詳しく記して、終りに次のやうな一節がある。

    此頃肥前國の僧來りて語りしは、その國長崎のほとりに白石といふ所あり。

    此邊の杵島郡に和泉村といふ所ありて、そこに福泉寺(濟家)と云ふあり。

    和泉式部は此後の山にて生れしが、鹿の子にてありきとぞ。

    この產神の緣起に其事誌したりといへり。

    浮きたることながら人の云ふに隨ひて記し付けぬ。

    とある。

    鎭西要略といふ書にも此事は書いてあるさうだが、其本はまだ見たことが無い。

    太宰管内志肥前の部卷七に注記してゐるのは、多分此寺の所傳に據つたものと思ふが、是ばかり鹿を猪として居るのは聞きそこなひでは無かつたらうか。

    昔此寺に猪一つ來て、常に佛の茶湯を捨つるを飮みけり。

    後には人に馴れて猪よと云ひて茶湯を捨つれば、やがて驅け來りて飮みなどしけり。

    或時佛殿の後にて赤子の啼く聲す。

    衆徒不思議の思ひをなし、此聲を尋ねて見るに、かの猪人の子を生みて乳を呑ませて居たり。

    衆徒等肝を消して、是必ず此山の法師など、誤りて畜生道に堕ちけるならんと云ひて、先づ是を顯はさんとて、各彼堂に集まりつゝ僉議まち〱なる中に、或僧火石を取りて廻さんと云ひ、旣に其場に臨む。

    其曉に藤津郡鹽田庄大黑丸と云ふ夫婦に同夢の告げあり。

    卽ち老僧顯はれて云はく、汝年頃子を祈れり。

    今汝が子福泉寺の堂の後に有り。

    行きて取るべしと云ふと見て夢醒めぬ。

    彼夫婦この寺に來りて見るに、衆徒等火石を取らんとす。

    大黑丸夢の仔細を語りてかの女子を所望しけり。

    衆徒等爭ひを止めて'
  translation: '――ある爺さまと婆さまのところへ、その赤ん坊を連れてきた。これを鹿娘、または鹿姫と名づけて育て、成長してからは長者の家の火焚女となった。それを長者の若君が見初め、見いだされて出世するという点は、「姥皮」の話ともよく似ていた。つまり、雀がとまったままの梅の枝を折り取り、引き伸ばした綿の上を新しい草履で歩き、また水の上を歩くことができたのがこの娘で、そのため、ついには取り立てられて長者の花嫁になるという。ここから想像すると、この地方では、純粋に一つの昔話だった（『老媼夜譚』一五二頁）。

    ところが、これと発端がよく似ていて、すでに半ば以上伝説に変わっている例も、ほかにはある。今日では、まさかそんなことがかつてあったとは思わないにしても、それがまるきりの作り話だったなら説明できなかっただろうと思われる信仰が、今も残っている土地があるのだ。山岡俊明の『類聚名物考』巻四十には、和泉式部の事跡が詳しく記され、最後に次の一節がある。

    「近ごろ肥前国の僧が来て語ったところでは、その国の長崎の近くに白石というところがある。この辺りの杵島郡には和泉村というところがあり、そこに福泉寺という臨済宗の寺がある。和泉式部は、この裏の山で生まれたが、鹿の子だったそうだ。この産神の縁起には、そのことが記してあるという。根拠のはっきりしないことだが、人のいうままに書き留めておく。」

    『鎮西要略』という本にもこのことが書いてあるそうだが、その本はまだ見たことがない。『太宰管内志』肥前の部、巻七の注記は、おそらくこの寺の伝承に基づくと思われるが、これだけ鹿を猪としているのは、聞き違いではなかっただろうか。

    「昔、この寺に一頭の猪が来て、いつも仏に供えた茶や湯を捨てるのを飲んでいた。のちには人になれて、『猪よ』と呼んで茶湯を捨てると、すぐに駆けてきて飲むほどになった。あるとき、仏殿の裏から赤ん坊の泣き声がした。僧たちは不思議に思って、声のする方を探すと、あの猪が人の子を産み、乳を飲ませていた。僧たちは仰天し、『これはきっと、この山の法師などが、誤って畜生道へ落ちたのだろう』といって、まずそれを明らかにしようと、その堂に集まった。詮議をめぐる意見がいろいろある中で、ある僧が、焼いた石を取り、皆に回そうといって、いよいよ実行する段になった。その明け方、藤津郡塩田庄の大黒丸という夫婦が、同じ夢のお告げを受けた。つまり、老僧が現れ、『おまえたちは長年、子を授かるように祈ってきた。今、おまえたちの子が福泉寺の堂の裏にいる。行って受け取るがよい』といった、と見て、目を覚ました。夫婦がこの寺へ来てみると、僧たちは焼いた石を手に取ろうとしていた。大黒丸は夢の次第を話して、その女の子を欲しいと頼んだ。僧たちは争いをやめて、――'
  notes:
  - 冒頭は242、引用末尾は244へ続く。
  - 『火焚女』『畜生道』は原文の職分・仏教観を示す時代語として保持。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第43頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

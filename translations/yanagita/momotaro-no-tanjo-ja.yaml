  section: 瓜子織姫／九 瓜子姫の復活
  original: との分堺は今の我々の考へて居る如く、明確なものでは無かつた。卽ち姫が梨の樹の梢に縛られて居るのも、現在の魂の宿りを逐ひ出されたといふのも、等しく厄難であつて其差はさう大きなもので無かつたのである。だから七匹の小羊が狼の腹の中から、のこのこと出て來たといふ童話も起り、日本でも蟒蛇に呑まれた飛脚の笑話などが出來たので、死んでも直ぐに又もつと美しく、生れ變つて來ればよいぢや無いかといふ思想を、殊に久しい後まで東洋の我々は有つて居たのである。人柱や生牲もその一つの現れと認められて居るが、神に仕ふる者のすぐれて清きものは、一般にその一旦の生を去つて後、更により高き地位に登るものと信ぜられて居た。つまりは人を新らしい神にする信仰を、我々は抱いて居たのである。だから事によると瓜子姫が或木に縛られて居たといふことは、却つて其魂の一時の抑留を暗示して居たので、奧州の山母話の方と元は相容れざる報告で無かつたのかも知れない。糠屋の隅つこに姫の骨が吊してあるのを、鷄が教へてくれたといふことが、幽かながらも二傳の脈絡あることを想像せしめる。それからもう一つ、アマンジヤクを三つに切つて、一切れは粟の根へ、一切れは黍の根へ、又一切れは蕎麥の根へ投げ棄てた。この三つの作物の根が今でも赤いのは、アマンジヤクの血に染まつたからだといふこと、是も此樣に詳しくは無いが、出雲の話(一〇)でも黍の根の赤いのは其爲と謂ひ、信州の例(八)でもアマノジヤクといふ意地惡娘を斬つて、萱野に棄てた故に萱の根は赤いと謂ふのみならず、是と同じやうな所謂說明傳說は、尙他の多くの山姥退治譚、若くは鬼征討記に伴なうて傳はつて居る。是などは明瞭に昔話の、「相互に融通し得る部分」であつた。天然の特に目に立つ現象を指さして、あれは如何なる理由であゝなつたかと訝かるのは、人間の智慮の芽生えであつた。いつの世どの程度の文化に於ても、其問は年少者、答は年上の者の管轄であつたことは確かである。從つて是を童話の起り、說話文學の發端又は空想藝術の最初の練習方法と解するのは許されるであらうが、今までの神話學徒が考へて居る如く、一種神話の至つて單純なる形と認めることは、私には全く同意が出來ない。神話が若し長老の固く信ずる所を、次に生れて來る者に口傳する手段であるならば、此等の說明などは始めから信じて居た者は無く、寧ろ問に基づいて次々に考へ出したものであつた。それ故に其內容は最も奇拔であり、又折を見ては追々に其目先を變へようとさへして
  translation: 'の境目は、今の私たちが考えるほど明確ではなかった。つまり、姫が梨の梢に縛られていることも、今の魂の宿りである体から追い出されたことも、同じように災難で、その差は、それほど大きくなかったのである。

    そのため、七匹の小羊が狼の腹の中から、のこのこと出てくる童話も生まれ、日本でも大蛇に呑み込まれた飛脚の笑い話などができた。死んでも、すぐに、前より美しく生まれ変わってくればよいではないかという考えを、東洋の私たちは、とりわけ長いあいだ持ち続けていたのである。

    人柱や生きた供犠も、その現れの一つと認められている。神に仕える者のうち、特に清らかな者は、その一度の生を終えた後、さらに高い地位に上ると、一般に信じられていた。つまり私たちは、人が新しい神になるという信仰を抱いていたのである。

    だから、もしかすると、瓜子姫が木に縛られていたということは、むしろ、その魂が一時的に留められていたことを暗示していたのかもしれない。そうであれば、奥州の山母の話とは、もともと両立しない伝え方ではなかったのだろう。糠屋の隅に姫の骨がつるされているのを、鶏が教えてくれたということは、かすかながら、この二つの伝承につながりがあることを想像させる。

    もう一つ、アマンジャクを三つに切り、一切れは粟の根元へ、一切れは黍の根元へ、もう一切れは蕎麦の根元へ投げ捨てた、この三つの作物の根が今も赤いのは、アマンジャクの血で染まったからだという話がある。これほど詳しくはないが、出雲の話（十）でも、黍の根が赤いのは、そのためだという。信州の例（八）でも、アマノジャクという意地悪な娘を斬って萱野に捨てたので、萱の根は赤い、としている。

    それだけでなく、これと同じような、いわゆる説明伝説は、ほかにも多くの山姥退治譚や鬼の征討譚に伴って伝わっている。これらは、明らかに、昔話の「相互に融通できる部分」だった。

    自然の中で特に目立つ現象を指し、あれはどうして、ああなったのかと不思議がるのは、人間の知恵の芽生えだった。いつの時代、どの程度の文化でも、問いは年少者、答えは年長者の受け持ちだったことは確かである。したがって、これを童話の起こり、説話文学の始まり、あるいは空想芸術の最初の練習法と理解することは許されよう。しかし、これまでの神話学者が考えるように、神話のきわめて単純な一形態と見なすことには、私はまったく同意できない。

    神話が、長老の固く信じる事柄を、次の世代へ口伝えする手段だとすれば、これらの説明を初めから信じていた人はいない。むしろ、問いに応じて、次々に考え出したものだった。そのため、内容はきわめて奇抜であり、機会を見ては、さらにその趣向を変えようとさえして'

  section: 田螺の長者／四 タミナの婿とツブの長者
  original: 'では今日にもあね樣を貰ひますべと言つて、急いで家に還つて年寄に其話をする。とゞ

    もがゝも喜んでけてがんせ。おら長者どんのあね樣を嫁に貰ふ約束をして來たと言つ

    た。何たらどこの世界にそんな話があるもんであと思つたけれども、何しろ御水神樣の

    申し兒のことだから、なぞな事があらうも知れぬと、隣の婆を賴んで問合せて見ると、

    長者どんでは確かに其通りの約束をしたといふ返事であつた。長者どんの旦那は其晩二

    人の娘を呼び、おれはお前達のうちどつちでも一人、田螺の息子の嫁にやる約束をした。

    どつちでもよいから行つてけろやいと言つた。それを聽いて姉娘の方は、誰があんな蟲

    けらのおかたになるものかと、面を膨らせてぷいと立つてしまつたが、妹の方はとゞ樣

    とゞ樣、心配してがんすな。うちの寶になることだから、私があのツブの息子の所に行

    きんすと答へた。それを聽いて旦那樣も大喜びで、やがて日をきめて美しい妹娘は、赤

    いのゝ(衣類)を着飾つて、ツブ息子の家に嫁入した。嫁御の荷物には簞笥が七棹、長持

    が七棹、手箱や小道具が七駄と片馬で、荷物は家の中に入れ切らぬから庭のさきに積み

    重ねたが、七疋の馬は立てて置く處が無いので、隣の婆樣の空いた厩を借りて繋いだ。

    花嫁こはまめまめしい親切な嫁こであつた。朝も早くから親達と一緒に、野らに出てよ

    く働いた。さうかうして居るうちに春になり櫻の花こが咲いて、卯月八日は村の鎭守

    の、御藥師樣の祭禮であつた。嫁こは簞笥の中から赤いのゝを出して著て、田螺の夫

    をば帶の結び目に挾んで、御祭を見に行つた。途中でも仲よく話をして、そこいらの模

    樣を夫に言つて聽かせながらあるいて居ると、往來の人たちはそれを見て、あれあれあ

    のあね樣は氣が違つたと見えて、あんなに一人でしやべことをして笑つて行くであ。ほ

    んとにもぞやであと立止まつて言ひ合つた。そのうちに御藥師樣の一の鳥居の前まで行

    くと、帶の結び目に挾まつて居る田螺が、これや、ちよつと待てと嫁こを呼び止めた。

    おれは少々わけが有つて是から奥へは入られないから、おれを爰の田の畔に置いて、お

    前ばかり行つて拜んでこ。ほだらちよつと爰に待つて居てけてがんせ。おら急いで御詣

    りをして來るからと、夫のツブを田の端に遊ばせて置いて、一人で御社に參詣した。御

    藥師樣御藥師樣、どうか夫を當り前の人に直してけてたもれ、あゝとうだいあゝとうだ

    いと謂つて拜んだ。さうして居るうちにも氣にかゝつてならぬので、すぐ樣引返して一'
  translation: '――では今日にもお嬢さんをいただきましょう」と言い、急いで家へ帰って年老いた両親に話した。「父さんも母さんも喜んでください。長者どんのお嬢さんを嫁にもらう約束をしてきた」。いったいどこの世界にそんな話があるものかと思ったが、何しろ水神様の申し子のことだから、不思議なことがあるのかもしれないと、隣のおばあさんに頼んで問い合わせてみると、長者どんからは、確かにそのとおり約束したという返事だった。


    長者どんの旦那はその晩、二人の娘を呼び、「おれはお前たちのどちらか一人を、田螺の息子の嫁にやると約束した。どちらでもよいから行ってくれ」と言った。それを聞いて姉は、「誰があんな虫けらの妻になるものか」と頬を膨らませ、ぷいと席を立ってしまった。しかし妹は、「お父様、お父様、心配しないでください。うちの宝になることなのですから、私があのツブの息子のところへ行きます」と答えた。それを聞いて旦那様も大喜びした。やがて日を決め、美しい妹娘は赤い着物で着飾って、ツブの息子の家へ嫁いだ。嫁入り荷物は、たんすが七さお、長持ちが七さお、手箱や小道具が馬七頭分と片荷だった。荷物は家の中に収まりきらないので庭先に積み上げたが、七頭の馬を置く場所がなく、隣のおばあさんの空いている厩を借りてつないだ。


    花嫁はよく働く、親切な嫁だった。朝早くから親たちと一緒に野良へ出て、よく働いた。そうしているうちに春になり、桜が咲いた。四月八日は村の鎮守、薬師様の祭りだった。嫁はたんすから赤い着物を出して着て、田螺の夫を帯の結び目に挟み、祭りを見に行った。途中も仲よく話し、あたりの様子を夫に聞かせながら歩いていた。通りの人たちはそれを見て立ち止まり、「おやおや、あのお嬢さんは気が違ったとみえて、あんなふうに一人でしゃべり、笑いながら歩いている。本当にかわいそうだ」と言い合った。


    やがて薬師様の一の鳥居の前へ来ると、帯の結び目に挟まっている田螺が、「おい、ちょっと待て」と嫁を呼び止めた。「おれは少しわけがあって、ここから奥へは入れない。おれをここの田の畔に置き、お前だけ行って拝んでおいで」「それでは、ちょっとここで待っていてください。急いでお参りしてくるから」と、夫のツブを田の端で遊ばせておき、一人でお社へ参詣した。「薬師様、薬師様、どうか夫を普通の人間に直してください。ああ、尊い、ああ、尊い」と言って拝んだ。そうしている間にも気がかりでならず、すぐ引き返して一――'
  notes:
  - スキャン128から続く引用。末尾はスキャン130へ続く。
  - 「気が違った」は当時の登場人物の言葉で、精神状態に対する差別的な表現をそのまま記録したもの。

- id: mmt-255-01
  scan: 255
  section: 和泉式部の足袋／六 誓願寺と鳳來寺
  original: '今ある謠曲末百番は、元祿十一年の江戶開板であるが、その行はれて居たのは無論それよりもよほど古からう。

    その終の方にある歌藥師の一曲は、やはり亦同一の昔話を潤色したものであつた。

    シテは比叡山の鎭守藥師如來、ワキは此寺の住侶であつて、子方に菊光殿といふ喝食の兒が、重病に臥して餘りの苦しさに取敢へず、南無藥師衆病悉除の願なれば、身より佛の名こそ惜しけれと書列ねて、之を寢床の下に敷いて寢たところが、後に見れば其歌の文字は消えて、其紙に祕文あらたに見え給ふとあつて、瘡の病では無かつた故に「みのかさ」の御返歌は脫して居るけれども、やはり忽ちに本復したと叙べて居る。

    「身より佛の名」といふのは、自分はどう有つてもよいが、それよりも藥師如來の御名聲にかゝはりましようといふので、斯ういふくねつた歌を案じ出すのは、寧ろ若道の兒たちに多かつたやうである。

    如來こそよい御迷惑であつた。

    次に寛文十二年に出た一休關東話、これは著述だからさう古いものの採錄では無かつたらう。

    外題には「峰の藥師へ狂歌を遣はさるゝ事」とあつて、三河峯藥師、靈驗あらたか也。

    矢矧に瘡を病む者、七々日の願を立て、旣に四十餘日詣づれども其しるし無し。

    如來を恨み奉り散々に惡口す。

    一休狂歌一首遊ばし、今晩まうでて之を讀むべしとのたまひければ、頃しも五月中の二日參る人多し。

    深更を待ちて之を讀上げる。

    なむやくし衆病悉除の願なればと、讀みも果てぬに內院震動して、村雨はたゞ一ときのものぞかしおのがみのかさそこに脫ぎおけ。

    起きあがりて見れば身の瘡無し。

    骨髓に徹つてすぐに發心して諸國を廻る。

    とある。

    是は關東咄だから三河鳳來寺の有名な藥師の名を假りたとも見られるが、たゞ何でも無く矢矧の里の住人と謂つたのを考へると、前から此あたりに行はれて居た話を採上げたものの樣である。

    發心して諸國を廻るのも有りふれた型ではあるが、旅の僧尼が先づ語るのは發心の因緣ときまつて居たから、此歌一つを暗んじてさへ居れば、藥師の靈場は巡拜し易かつたわけであり、それには又全國に名の知られた峯の藥師と、矢矧の里の住人とを說くことが、便宜も效果も共に多かつたらうと思はれる。

    但しそれなれば叡山の兒の話と、式部小町の女性の瘡の疾と、何れが前から在つたとするかといふと、是は今だけの材料からでは決し難い問題であるが、此歌は是でも文學であつて、一休なり誰なり都の人を賴まなければ、'
  translation: '今ある『謡曲末百番』は、元禄十一年に江戸で刊行されたものだが、そこで扱われる曲が演じられていたのは、もちろんそれよりずっと古いだろう。その終わり近くにある「歌薬師」という一曲も、やはり同じ昔話に脚色を加えたものだった。シテは比叡山の鎮守である薬師如来、ワキはその寺の住僧で、子方には菊光殿という喝食の稚児が登場する。この子が重病で寝込み、あまりの苦しさに、とりあえず、「南無薬師。あらゆる病を除くとの誓いならば、私の命よりも、仏の名声が損なわれるのが惜しいことです」と書き連ね、それを寝床の下に敷いて寝た。後で見ると、その歌の文字は消え、紙には新たな霊験ある言葉が現れた、とある。瘡の病ではなかったので「みのかさ」の返歌はないが、やはりたちまち全快したと述べている。「身より仏の名」とは、自分はどうなってもよいが、それより薬師如来の評判にかかわるでしょう、という意味である。こうしたひねくれた歌を考え出すのは、むしろ若衆道の稚児たちに多かったようだ。如来こそ、いい迷惑だった。

    次に、寛文十二年に出た『一休関東話』がある。これは著作なので、それほど古い話を採録したものではなかっただろう。題は「峰の薬師へ狂歌をお送りになること」とあって、次のように記す。

    「三河の峰の薬師は霊験あらたかである。矢矧で瘡を患う者が四十九日間の願を立て、すでに四十日余り参詣しても効き目がなかった。如来を恨み、さんざん悪口をいう。一休が狂歌を一首作り、『今晩参詣して、これを読みなさい』とおっしゃった。時はちょうど五月中の二日で、参拝者が多い。夜更けを待って読み上げた。『南無薬師、あらゆる病を除くとの誓いならば』と、まだ読み終えないうちに内院が揺れ動いて、『村雨はほんの一時のもの。自分の蓑と笠を、そこへ脱いで置きなさい』と聞こえた。起き上がってみると、体に瘡はない。心の底から感じ入り、すぐに仏道を志して諸国を巡った。」

    これは関東の話なので、三河の鳳来寺の有名な薬師の名を借りたとも考えられる。しかし、何気なく矢矧の里の住人といっていることを考えると、以前からこの辺りにあった話を取り上げたようである。仏道を志して諸国を巡るというのもありふれた型だが、旅の僧尼がまず語るのは、信仰に入ったいきさつと決まっていた。だから、この歌を一つ暗記してさえいれば、薬師の霊場を巡拝しやすかったわけで、それには、全国に名を知られた峰の薬師と、矢矧の里の住人とを語ることが、便利でもあり、効果も大きかったのだろうと思われる。ただ、それなら比叡山の稚児の話と、式部や小町という女性の瘡の病の話と、どちらが先からあったのかとなると、現在の資料だけでは決めにくい。しかし、この歌もこれで文学であり、一休なり誰なり、都の人を頼まなければ、――'
  notes:
  - 末尾は担当外の256へ続く。訳は255に含まれる部分のみ。
  - このscanではordered OCRの語順が崩れた箇所をraw JSONのid順・座標と照合し、『南無藥師…身よ』を『取敢へず』の後に戻した。
  - 『喝食』は寺院の稚児の呼称。『若道』は原文の歴史的な男色・若衆道の文脈を指し、省略せず訳出。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第55頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。
  - 「五月中の二日」は原版にもこのとおり印刷されている。日付の意味は確定せず、訳でも表現を保持した。

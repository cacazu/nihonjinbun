  section: 瓜子織姫／諸國の瓜子姫・天之探女
  original: '存の稍〻望み難い點であり、從うて說話成長の異なる段階を示すものかと思ふが、尙今後の

    新採集までを引くるめて、豫斷するだけの膽力は私はもつて居ない。江戶の子供が瓜姫の咄

    を知らなかつたといふ嬉遊笑覽の說は假に信ずるとしても、四國內海の島々、大和紀州の山

    村等に、まだ此話の無いのは傳承者に出會はぬ爲であつた。注意と搜索との行屆かぬといふ

    ことしか意味して居ないのである。然るに小縣郡史の編者は芳賀博士の說を引いて、瓜姫は

    信濃と越後とのみに殘つて居る昔話のやうだと述べて居る。芳賀先生は私の舊師であり又旣

    に故人である。先生が何に據つてかゝる說を立てられたかの理由は、もはや尋ねに行く途も

    絕えたが、他の今一つの何故に地方の學徒が、此先生の說に信從したかの動機に至つては、

    もう一度考へて見る價値がありさうである。)

    天之探女

    「秋田方言」には平鹿郡に於て、山彥をアマノシヤグと謂ふとある。關東でも常陸稻敷郡上

    野邑樂郡などで、アマンジヤクといふのは反響のことであり、伊豆田方郡も山彥をアマンジ

    ヤクと謂つて居る。信州では下水內郡で反響をヤマノジヤク、「東筑摩郡方言」は口答へする

    こと、又は反對することをアマネジヤクといふとある。越中は高岡市の附近までは山彥をア

    マンジヤクと謂ひ、下新川郡ではメメンジヤクとも謂つて居るが、加賀に接した西礪波郡に

    なるともう是をヤマンバボと呼ぶのである。こだま山彥を山婆といふ土地は、尙この以外に

    美濃の加茂郡でヤマンボ、下野の芳賀郡などもヤマンバーといふのが之を意味する。何れが

    先であつたかは別として、二つの名稱は入交つて行はれて居るのである。山婆とアマノジヤ

    クとを同じものの樣に考へたのは、瓜子姫の昔話だけでは無かつた。

    出雲では山彥は山の神に使はれる化物の聲だと謂つて居た(鄕土研究二卷二四〇頁)。或獵師

    が雪の降つた山で日を暮らし、火を焚くつもりで枯枝をぽんと折ると、向ふの森でもぽんと

    音がした。驚いてあつと謂つたら又あつと答へる。肝を潰して逃げ歸る途中に、木の株に腰

    かけて煙草の火を切り、其音が餘りに高かつたので思はぬことしたと思ふと、又化物の方で

    も思はぬことしたと眞似をした。それから後は何の恠も無くて無事に還り著いたなどといふ'
  translation: '立って存在するとは少し考えにくく、したがって説話が成長していく異なる段階を示すものではないかと思う。しかし、今後新たに採集される資料まで含めてあらかじめ判断するほどの大胆さは、私にはない。江戸の子供は瓜姫の話を知らなかったという『嬉遊笑覧』の説を、仮に信用するとしても、四国や内海の島々、大和・紀州の山村などで、まだこの話が見つかっていないのは、伝承者に出会っていないからだった。注意と探索が行き届いていないということしか意味しない。それなのに『小県郡史』の編者は、芳賀博士の説を引き、瓜姫は信濃と越後だけに残る昔話のようだと述べている。芳賀先生は私の以前の師であり、すでに亡くなっている。先生が何を根拠にこの説を立てたのか、その理由を尋ねに行く道はもう断たれた。しかし、もう一つの問題、なぜ地方の研究者たちがこの先生の説を信じて従ったのかという動機については、改めて考える価値がありそうだ。）

    天之探女

    『秋田方言』には、平鹿郡では山彦をアマノシャグというとある。関東でも、常陸の稲敷郡や上野の邑楽郡などでアマンジャクというのは反響のことであり、伊豆の田方郡でも山彦をアマンジャクと呼んでいる。信州では下水内郡で反響をヤマノジャクといい、『東筑摩郡方言』には、口答えすることや反対することをアマネジャクというとある。越中は高岡市付近までは山彦をアマンジャクといい、下新川郡ではメメンジャクともいうが、加賀に接する西礪波郡になると、ヤマンバボと呼ぶ。こだま・山彦を山婆と呼ぶ土地は、このほかにもある。美濃の加茂郡のヤマンボ、下野の芳賀郡などのヤマンバーという語も、これを意味する。どちらが先だったかは別として、二つの名前が入り交じって用いられているのである。山婆とアマノジャクを同じもののように考えたのは、瓜子姫の昔話だけではなかった。

    出雲では、山彦は山の神に使われる化け物の声だといっていた（『郷土研究』二巻二四〇ページ）。ある猟師が雪の降った山で日暮れを迎え、火をたこうと枯れ枝をぽんと折ると、向こうの森でもぽんと音がした。驚いて「あっ」と言うと、また「あっ」と返ってくる。すっかり怖くなって逃げ帰る途中、切り株に腰をかけて煙草に火をつけようと火打ち石を打ち、その音があまり大きかったので「思いがけないことをした」と思うと、化け物の方も「思いがけないことをした」とまねをした。そのあとは何の怪異もなく、無事に帰り着いた、といった'
  notes:
  - 冒頭はscan99、末尾はscan101へ続く。
  - 天之探女（あまのさぐめ）は、この節でアマノジャクとの関連を検討する神名。旧国名・郡名は歴史的地域呼称として保持。

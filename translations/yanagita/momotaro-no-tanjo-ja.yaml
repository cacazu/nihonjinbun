  sequence: 116
- id: mmt-112-01
  scan: 112
  section: 瓜子織姫／黃金の瓜
  original: 'はたま〳〵或神童の聰明叡智を、例示するにふさはしい新話術として、

    採用せられたに過ぎ

    ぬのであつた。昔話が專門の話者によつて、幾らでも作爲し轉用せられる樣になつてからも、

    純朴なる聽衆は尙之を信受して、實有の歷史の如く思つて居た例は方々にあるが、

    それには

    隱れたる根本の誘因があつた場合が多いかと思ふ。久高の場合の如きは其誘因が隱れても居

    ない。第四の特徴として列記してよいことは、この民間の貴種を世に顯はし、

    再び父の王に

    逢うて其大業を嗣がしめた因緣は、七日の祈念によつて大海から流れ著いたといふ黃金の瓜

    であつたことで、童兒は其瓜の中から生れたのでは無いけれども、

    瓜に由つて始めてその夙

    慧の質を、立證することが出來たのである。我々の珍重する所の小さ子說話と、瓜との關係は

    深かつた。然るに多くの府縣では旣に此點を忘れてしまひ、

    話が流轉したと同樣に、其瓜も

    亦茄子となり山の椿の木ともなつた。獨り南海珊瑚礁上の若干家族のみが、

    いつ迄も海から

    漂ひ寄るものの尊さを記憶して居てくれた御蔭に、爰に僅かなる聯絡が見出されさうになつ

    て來たのである。此系統の說話は、今日のところでは男は桃太郞、

    女は瓜子姫と立別れて居

    る樣になつたが、是も決して定まつた固有の形で無かつた。或はまだ何處かの隅に、

    瓜をう

    つぼ舟にして遠い國から渡つて來た瓜彥瓜王丸の昔話が、偶然に遺つて居らぬものとも限ら

    ぬのである。'
  translation: 'は、たまたま、ある神童の聡明さや優れた知恵を示すのにふさわしい、新しい語りの手法として採用されたにすぎなかった。昔話が専門の語り手によって、いくらでも作り変えられ、転用されるようになってからも、素朴な聞き手はなおそれを信じ、実際にあった歴史のように考えていた、という例は各地にある。しかし、その場合には、表に現れない根本的なきっかけがあったことが多いのではないかと思う。久高の場合、そのきっかけは隠れてさえいない。

    第四の特色として挙げてよいのは、民間にいたこの高貴な血筋の子を世に出し、父王に再会させ、その大きな事業を継がせた縁が、七日間の祈りによって大海から流れ着いたという、黄金の瓜だったことだ。子供は瓜から生まれたのではない。しかし、瓜によって初めて、幼くして優れた知恵を持つことを証明できたのである。私たちが大切にしている「小さ子」の説話と、瓜との関係は深かった。それなのに、多くの府県ではすでにこの点を忘れ、話が各地を巡って変わったのと同じように、瓜も茄子になり、山の椿の木になった。ただ、南の海の珊瑚礁の上に暮らすいくつかの家族だけが、海から漂い寄るものの尊さをいつまでも覚えていてくれた。そのおかげで、ここにわずかなつながりを見いだせそうになってきたのである。

    この系統の説話は、現在では男は桃太郎、女は瓜子姫と、別々になっているようだが、それも決して固定した本来の形ではなかった。もしかすると、まだどこか片隅に、瓜をうつぼ舟にして遠い国から渡ってきた瓜彦・瓜王丸の昔話が、偶然残っていないとも限らないのである。'
  notes:
  - 冒頭はscan111から続く。このscanで「瓜子織姫」の本文が終わる。
  - 「小さ子」は、異常に小さな姿で現れ、力や知恵を示す主人公を扱う本書の説話分類。
  - 「うつぼ舟」は中空の舟。前出の「うつろ舟」との表記の違いを保持。
  - 前のスキャンからの続き

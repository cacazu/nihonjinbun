  original: その山の神が子を產むと、ウブヤシネ(產養ひ)と謂つて團子や餅を重箱に入れて、其穴の口に置いて來る習ひであつた。さうすると重箱はきつと其晩のうちに、返しに來たものだと傳へられて居る。北城の村でも狼が子を產んだときは、お七夜には赤飯をふかして重箱に入れて持つて行き、どうか子をふやしても惡戯はしなんで吳れと言つて歸つて來た。それ故に此邊の狼は屢〻夜路を行く人を護送して、何の害もせずに去つたといふ話が多い。或時村の女房が背の子を此穴の中に落して、非常に悲しみ憂へて一人で歸つて來たが、翌朝戶を開けて見ると家の戶間口に、ちやんと其嬰兒がつれて來て置いてあつた、といふ樣な驚くべき逸話さへも傳はつて居る。狼の信用は最も厚かつたのである。或は又斯ういふ話もある。美麻村千見區に花戶といふ澤があつて、村の下條家の持地であつた。岩穴に狼が子を產んだので、產養ひに赤飯を持たせて遣つた。其下男が狼の子を見て、好い兒を澤山產んだなア、おれに一疋くれねェかと口から出まかせを言つて戾つて來ると、翌朝は戶口に可愛らしい一疋の狼の子が居た。さうはいふものの飼ふわけにも行かぬので、又其子を狼の巢の中へ返しに行つたといふ。此種の世間話の發生した事情を考へて見ると、單なる目の迷ひや思ひ違へ以上に、尙之を受入れた聽衆の心理にも、今まで省みられなかつた奧深い何物かが窺はれる。所謂狼の巢の如きは、恐らくは動物學者の管轄すべき知識では無くて、久しい無意識傳承に養はれた一種深山の靈地であつた故に、容易に人をして斯る空想の光景を胸に描かしめ得たものと思ふ。同じ郡社村の丹生子に於ても、或家の下男がこの山犬の巢を荒したところ、其後此男が入れた苅敷を田から引出してあつたり、馬を牽いて行つて繋いで置くと危害を加へたりした。そこで村の人たちが集まつて思案をして、山犬の爲に七夜の祝をして遣つた。先づ赤飯を炊いで藁んだの上に盛り、之を山犬の巢の側に供へ、村では酒宴を開いて賑やかに歌ひ囃したら、それからは惡戯をしなくなつたと謂つて居る。狼の爲に產屋の日取を算へるなどといふことは出來るもので無い。是は何でも人間の七夜產養ひに該當する行事を、彼の爲にも執行したといふ迄のことで、しかも他の多くの獸類に就ては少しも問題にせぬ事を、特に狼の歡心を求めんとする場合のみに、必ず守らうとしたのには理由があつた筈である。つまりは狼の子といふことに、今は忘れてしまつて居る深い意味が、もとは有つたらしいのである。
  translation: 'その山の神が子を産むと、「ウブヤシネ（産養い）」といって団子や餅を重箱に入れ、穴の入口へ置いてくる習わしだった。そうすると重箱は必ず、その晩のうちに返しに来たものだと伝えられている。北城村でも、狼が子を産むとお七夜に赤飯を蒸して重箱へ入れ、持って行って、「どうか子が増えても悪さはしないでおくれ」と言って帰ってきた。そのため、この辺りの狼はしばしば夜道を行く人を護送し、何も害を加えず去ったという話が多い。あるとき村の女房が背負った子をこの穴に落とし、ひどく悲しみ心配しながら一人で帰ってきたが、翌朝戸を開けると、入口に赤ん坊がきちんと連れ戻されて置かれていたという、驚くような逸話さえ伝わっている。狼への信頼はたいへん厚かったのである。

    また、こんな話もある。美麻村千見区に花戸という沢があり、村の下条家の所有地だった。岩穴で狼が子を産んだので、出産祝いに赤飯を持たせてやった。その下男が狼の子を見て、「よい子をたくさん産んだなあ。おれに一匹くれないか」と口から出まかせを言って戻ってくると、翌朝、戸口にかわいらしい狼の子が一匹いた。そうは言っても飼うわけにはいかないので、また狼の巣へ返しに行ったという。この種の世間話が生まれた事情を考えると、単なる見間違いや思い違いというだけではなく、それを受け入れた聞き手の心理にも、今まで顧みられなかった奥深い何かがうかがわれる。「狼の巣」と呼ばれたものは、おそらく動物学者の扱う知識ではなく、長い無意識の伝承によって育まれた、深山の一種の霊地だったため、人々が容易にこのような空想の情景を心に描けたのだろう。同じ郡の社村丹生子でも、ある家の下男が山犬の巣を荒らすと、その後、その男が田に入れた刈敷が引き出されていたり、馬を連れて行ってつないでおくと危害を加えられたりした。そこで村人が集まって相談し、山犬のためにお七夜の祝いをしてやった。まず赤飯を炊いて藁で編んだ台の上に盛り、山犬の巣のそばに供え、村では酒宴を開いてにぎやかに歌いはやした。するとそれ以後は悪さをしなくなったという。狼のために出産の日取りを数えるなど、できることではない。これはともかく、人間のお七夜の出産祝いに相当する行事を、狼のためにも行ったというだけのことである。しかも、ほかの多くの獣では少しも問題にしないことを、とくに狼の機嫌をよくしようとする場合にだけ、必ず守ろうとしたのには理由があったはずだ。つまり「狼の子」ということには、今は忘れてしまった深い意味が、もとはあったらしいのである。'
  notes:
  - 「刈敷」は田畑の肥料にする刈草や若枝。「藁んだ」は藁で編んだ敷物・台と解して訳した。
  - これらは伝承の紹介と著者の分析であり、狼の実際の行動を保証する記述ではない。

- id: mmt-250-01
  scan: 250
  section: 和泉式部の足袋／四 南無藥師
  original: '零落した色々の說話を貫いて、今も尙依然として之を窺ひ知ることが出來るのである。

    第二の仕事としては、その僅かに保存せられて居る古代人の心意を、掻き交ぜ曇らせて居た後世の文藝生活の種々相が、果してどういふ風に骨折つたなら、一つ一つ引離して其因果を觀測することが出來ようかを說いて見る氣であつたのである。

    和泉式部の足袋はちやうど其練習の、最も簡易なる一つの機會であつた。

    斯ういふ話になると、大昔から其儘とは言へぬと同樣に、假に三百里を隔てても、獨立して二處に偶發したものとは何人にも考へられない。

    もし偶發で無いとすれば、運送した人が有るのである。

    誰がさういふ御苦勞なことをしたか。

    說話の成長といふことを明かにするには、是は實際手頃なる初歩の問題であつた。

    肥前と三河と、二箇所の足袋の由來を比べて見て、誰にも氣の付くのは雙方共に、御本尊が藥師如來であつたことである。

    是が我々には何等かの手掛りを與へはしないだらうか。

    和泉式部が生れたといふ土地は、肥前の杵島郡を西の端にして、他の一端は陸中の和賀郡まで、京を除いても全國に七箇所、注意をして居たら尙是以上にも顯れて來るかも知れない。

    傳說の和泉式部は若狹の八百比丘尼、又は大磯の虎などと同樣に、大相も無い旅行家であつた。

    その足跡は決して熊野や播州書寫山だけに限られては居なかつた。

    記念の念佛塔などを墓じるしと誤り傳へただけならば、或は死んだといふ土地の多いのは說明し得られようが、此地で生れたといふ所が斯う多くては、只事では無かつたのである。

    しかし研究者に取つて一つ都合のよかつたのは、肥前の福泉寺に彼女自筆の歌と稱して、錦のうらやきしま(杵島·黄縞)なるらんといふ一首が傳はつて居たやうに、奥州にも又因幡の湖山池にも、それ〱の歌が記憶せられて居た。

    信州の諏訪でも和泉が立身の糸口に、詠んで賞められたといふ名歌が殘つて居たらしい。

    それ等の名歌がいつの代のものであつたか。

    果してこの式部の才藻に成ると言ひ得るか否か。

    是を決する位は今日までの日本文學史でも出來さうなものである。

    さうすると是が又第二の目標にもなるわけであつた。

    和泉式部の葬處と傳ふるものは、有名な京の誓願寺の誠心院を始にして、今判つて居るだけが日本に十五箇所ある。

    中にはよつぽど賴りないのもあるが、九州の殆と行止まりの日向法華嶽寺の麓の里に在るものなどは、此山が性空上人留錫の靈地であつただけに、土地の學者は擧つて其史實なることを認め、我々の敬慕する山田清安翁などにも、和泉式部事蹟考の'
  translation: '――し、衰えたさまざまな説話を通して、今もなおうかがい知ることができるのである。第二の仕事としては、そのわずかに保存された古代人の心をかき混ぜ、曇らせていた後世の文芸生活のさまざまな面を、どのように努力すれば一つずつ切り離し、その因果関係を観察できるのか、説明してみるつもりだった。和泉式部の足袋は、ちょうどその練習の、最も簡単な機会の一つだった。こういう話となると、大昔からそのままの形だったとはいえないのと同様に、たとえ三百里を隔てていても、独立して二か所で偶然生まれたものとは、誰も考えられない。偶然でないなら、運んだ人がいるのである。誰が、そんなご苦労なことをしたのか。説話の成長を明らかにするには、これは実に手ごろな初歩の問題だった。

    肥前と三河の二か所の足袋の由来を比べて、誰もが気づくのは、両方とも本尊が薬師如来だったことである。これは私たちに何か手がかりを与えないだろうか。和泉式部が生まれたという土地は、西端の肥前杵島郡から、もう一端の陸中和賀郡まで、京都を除いても全国に七か所あり、注意していれば、さらに見つかるかもしれない。伝説上の和泉式部は、若狭の八百比丘尼や大磯の虎などと同じく、途方もない旅行家だった。その足跡は、決して熊野や播州書写山だけに限られていなかった。記念の念仏塔などを墓標と誤って伝えただけなら、死んだという土地が多いことは説明できるかもしれない。しかし、ここで生まれたという場所がこれほど多くては、ただごとではなかったのである。ただ、研究者にとって一つ都合がよかったのは、肥前の福泉寺に、彼女の自筆の歌として「錦のうらやきしまなるらん」という、杵島と黄縞を掛けた一首が伝わっていたように、奥州にも、また因幡の湖山池にも、それぞれの歌が記憶されていたことである。信州の諏訪でも、和泉が出世するきっかけに詠んで褒められたという名歌が残っていたらしい。これらの名歌は、いつの時代のものだったのか。果たして、この式部の才によって生まれたといえるのか。この程度を判断することなら、今日までの日本文学史でもできそうなものである。そうすれば、これがまた第二の目印になるはずだった。

    和泉式部の埋葬地と伝わるものは、有名な京都の誓願寺の誠心院をはじめ、今わかっているだけで日本に十五か所ある。中にはよほど根拠の弱いものもあるが、九州のほとんど行き止まりに当たる、日向の法華嶽寺の麓の里にあるものなどは、この山が性空上人の滞在した霊地であっただけに、土地の学者はそろって、それを史実と認めている。私たちが敬慕する山田清安翁にも、『和泉式部事蹟考』という――'
  notes:
  - 冒頭は249、末尾は251へ続く。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第50頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。
  sequence: 255
- id: mmt-251-01
  scan: 251
  section: 和泉式部の足袋／四 南無藥師
  original: '一著があつたさうである。

    ところが此寺の御本尊も、三河の鳳來山越後の米山と共に、日本の三藥師と稱せられる瑠璃光如來であつた。

    さうして爰にも亦珍らしい二首の歌が傳はつて、其傳說の眞を證明しようとして居るのである。

    三國名勝圖會卷五十五の文を抄出すると、上東門院の女房和泉式部、癩病を患へしが、種々の醫療驗無き故に、京都淸水の觀音に參籠しけるに、米山鳳來寺法華嶽寺、三所の藥師に祈るべき夢告を受く。

    於是米山鳳來寺に至つて參籠せしかども其驗無し。

    因つて遙かに日州に下り、法華嶽の藥師へ參籠すと雖其應驗を得ざりければ、此世の業緣は是までなりと思ひて、身を墜して死せんと志を定め、辭世に南無藥師諸病悉除の願立てゝ身より佛の名こそ惜しけれと詠じ、旣に合掌閉目して千尋の崖より自ら墜ちけるに、不思議に救ひ助けられ、一異人式部の眼中に現じ、其手を取りしと覺えて村雨はたゞひと時のものぞかしおのが蓑笠そこにぬぎおけといふ聲の下に、數年の宿病忽然として平癒し、玉貌瓊姿に復し再び京都に歸る。

    斯うは記してあるが其歸り途に、もしくは後年再び遣つて來て、此國に歿したと云つて、鹿''式部谷·腰掛野田といふ村に墳墓がある。

    さうして法華嶽寺には和泉式部の琵琶と髪掛柱、松·身投岡·杖取阪等の故跡を存するのである。

    この藥師如來との贈答の歌なるものは、可なり近代式な誹諧であつたが、其代り之を聽いた人には、心持はよく解つたらう。

    つまりは蓑笠を身の瘡に掛けたのが趣向で、少々ばかり藥師樣の御仁體に、似つかはしからぬ口合ひであつた。

    和泉式部の方ならば、夙くから斯樣な秀句も卽吟しかねぬ才女と目せられて居た。

    金葉集に出て居る鴨神主忠賴との贈答、千早ふるかみをも足に纏くものか、是をぞ下の社とはいふを始とし、何れ家々の聞書類から轉載したもので、實際此女史の卽吟であつたか否かは覺束無いまでも、兎に角に歷代の選集に和泉の作として錄せられたものは多く、近代になる程づつ其數は愈、加はつて居るのである。

    從うて彼女が信心の恍惚の間に於て、さういふ返歌を感得したと言ふならば、それでも或は通用したかも知れぬ。

    ところがこの藥師如來との歌問答を、和泉式部の逸話として居る例は、私の知つて居る限りでは日向の法華嶽寺ばかりで、其他はすべて皆別の人の歌になつて居る'
  translation: '――著書があったそうである。ところが、この寺の本尊も、三河の鳳来山、越後の米山とともに、日本の三薬師と呼ばれる瑠璃光如来だった。そしてここにもまた、珍しい二首の歌が伝わり、その伝説が真実であることを証明しようとしている。『三国名勝図会』巻五十五の文章を抜き出すと、次のとおりである。

    「上東門院の女房である和泉式部は、癩病を患ったが、さまざまな治療も効き目がないため、京都の清水の観音に参籠した。すると、米山、鳳来寺、法華嶽寺の三か所の薬師に祈るようにという夢のお告げを受けた。そこで米山と鳳来寺へ行って参籠したが、効き目がなかった。それで、はるか日向へ下り、法華嶽の薬師に参籠しても霊験が得られなかったので、この世の縁はここまでなのだと思い、身を投げて死のうと心を決めた。そして辞世に、

    『南無薬師。あらゆる病を取り除くという誓いを立てたのに、私の命よりも、仏の名声が損なわれるのが惜しいことです。』

    と詠み、合掌して目を閉じ、深い崖から身を投げた。すると不思議にも救い助けられ、異人が一人、式部の目の前に現れ、その手を取ったと感じると、

    『村雨はほんの一時のもの。自分の蓑と笠を、そこへ脱いで置きなさい。』

    という声とともに、長年の病がたちまち全快し、美しい顔と姿に戻って、再び京都へ帰った。」

    このように記されている。しかし、その帰り道に、あるいは後年再びやって来て、この国で亡くなったといって、鹿野田という村に墓がある。また法華嶽寺には、和泉式部の琵琶と髪掛柱があり、式部谷、腰掛松、身投岡、杖取坂などの跡も残っている。

    この薬師如来との贈答歌というものは、かなり近代的な滑稽の趣向だったが、その代わり、聞いた人には心情がよくわかっただろう。つまり「蓑笠」を「身の瘡」に掛けたのが工夫で、薬師様のお人柄には、いくらか似つかわしくないしゃれだった。和泉式部の方なら、早くから、このようなしゃれた歌も即座に詠みかねない才女と見られていた。『金葉集』に出ている鴨神主忠頼との贈答、「畏れ多い神、いや紙まで足に巻くものですか」「これを下の社というのです」をはじめ、いずれも諸家の聞き書きから転載したもので、実際にこの女性の即興の歌だったかは心もとない。それでも、とにかく歴代の選集には和泉の作として載せられたものが多く、時代が下るほど、その数はますます増えている。したがって、彼女が信仰による恍惚の中で、そのような返歌を感じ取ったというのなら、それでも通用したかもしれない。ところが、この薬師如来との歌問答を和泉式部の逸話にしている例は、私の知る限り日向の法華嶽寺だけで、ほかはすべて別人の歌になっている――'
  notes:
  - 冒頭は250、末尾は252へ続く。
  - 『癩病』は原文の歴史的病名で、現在のハンセン病を指す語だが、伝説中の人物の実際の診断を確定するものではない。差別的な歴史を持つ用語として引用訳に保持した。
  - 鴨神主との歌は「神／紙」の掛詞と下鴨神社の「下の社」を利用したしゃれ。解釈を補足して訳出。参照：織田正吉・野村雅昭「検証シンポジウム 小咄から落語へ」 https://www.jstage.jst.go.jp/article/warai/8/0/8_KJ00003259162/_pdf
    。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第51頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

- id: mmt-166-01
  scan: 166
  section: 隣の寝太郎／山田の露
  original: 及びなき雲の上なる清瀧に逢はんと思ふさなへはかなし男又かけはしも及ばぬ空の月日だに清き穢れの影は隔てぬ女又返しよしさらば山田におちて清瀧の名を流すとも逢ひてたすけんそれより忍びて逢ひ伴なはれて男の古里に下るとて、遠野東禪寺村の奥山に隱れ巖窟に住す云々とあつて、女やがて身まかり塚のしるしに石を建て、其石が麓の里から猿か石かと見えた故に、猿ヶ石川といふ川の名が始まつたとも記して居る。この歌は御覽の通り少しばかり文人の加筆があつて、いよ〳〵變な形になり切つて居るが、兎に角に東北は今でも盆踊に口說節は用ゐない習ひだから、是を運んで來た者は別に誰か有つたのである。話がラジオなどの如く空に放送し得るものと、考へて居る人は世間に多い樣だが、文字の媒介の洽ねからぬ時代には、たゞの狂言綺語とてもさう手輕には遠くまで弘まり得なかつた。ましてや我も他も共に信じて、之を或昔の史實として說き立てる迄を、自然の成行きと見ることは無理である。一方には勿論斯うした話を持ちあるいた者と、それを正しい語りごとの如く、受入れようとした者のあつたことは想像せられるが、尙その以外にも兼て何等かの因緣の、之を我土地に繋ぎ留めんとしたものが無かつたとは言へない。攝津の丹生山田庄の栗花落左衞門といふ舊家では、家の傍に辨財天女の社があつて、そこに栗の花ちる五月雨の頃になると、新たに涌き出づる不思議の泉があり、之を說明する爲に貴女降嫁の傳說があつたことは、夙く京洛の地にも知られて居たやうだが、之を中將姫の妹といひ、もしくは名歌の奇特によつて、無謀なる妻問ひに成功したといふ話までが、初めから之に伴なうてあつたものとは認められぬ。つまり此間には二度以上の增補が有つたのである。五月田の水の最も大切な頃に、每年定まつて涌き出す泉を奇瑞として、神を其地に祭つたといふだけの言ひ傳へならば、今ある浪華曾根崎の露天神社を始め、京にも田舍にも其例は乏しくない。それからその靈泉の所在地に就いて、或貴種の子の埋葬を說くのも、珍らしい口碑には相違ないが、我々は旣に遠州久留女木の龍宮小僧に於て、一つの類型を見たのである。家の曩祖と水の神との婚姻に至つでは、是は日本に餘りにも數しげく、又餘りに著名の傳說であつたが爲に、却つて省略して
  translation: '「とても手の届かない雲の上にいる清瀧に会おうと思うとは、その早苗は哀れなものです」

    男はまた、

    「梯子さえ届かない空の月や日でさえ、清いもの、汚れたものを分け隔てずに、その光を映すではありませんか」

    女はまた返した。

    「よいでしょう。それなら山田に落ち、清瀧の名を世間に流すことになっても、お会いしてあなたを救いましょう」

    それからひそかに会い、連れられて男の故郷へ下ることになり、遠野の東禅寺村の奥山に隠れて岩窟に住んだ、などとある。やがて女が死に、墓のしるしに石を建てた。その石が麓の村からは、猿なのか石なのか、と見えたので、「猿ヶ石川」という川の名が生まれたとも記している。この歌はご覧のとおり、文人が少し手を加えていて、いっそうおかしな形になりきっている。しかしともかく、東北では今でも盆踊りに口説節を用いない習慣だから、これを運んできた者は別に誰かいたのである。

    話はラジオのように空中へ放送できるものだ、と考えている人が世間には多いようだ。しかし、文字による媒介が行き渡っていなかった時代には、ただのおどけ話や飾った言葉でさえ、そう簡単に遠くまで広まることはできなかった。まして、自分も他人もともに信じ、それを昔の史実として語るようになるまでを、自然な成り行きと見るのは無理である。一方にはもちろん、こうした話を持ち歩く人と、それを正しい語り伝えとして受け入れようとする人がいた、と想像できる。しかしそれ以外にも、以前から何らかのつながりがあって、この話を自分たちの土地に結びとめようとしたことがなかった、とはいえない。

    摂津の丹生山田荘の、栗花落左衛門という旧家には、家のそばに弁財天女の社があり、栗の花が散る五月雨のころになると新たに湧き出す、不思議な泉があった。それを説明するために、高貴な女性が身分の低い男に嫁いだという伝説があったことは、早くから京都でも知られていたらしい。しかし、その女性を中将姫の妹だとしたり、名歌の不思議な力によって、無謀な求婚に成功したとする話までが、初めから伴っていたとは認められない。つまり、そのあいだには二度以上の付け加えがあったのである。

    旧暦五月の、田に水が最も大切な時期に、毎年決まって湧き出す泉を奇跡と考え、そこに神を祭った、というだけの言い伝えなら、現在の大阪・曽根崎の露天神社をはじめ、都にも田舎にも例は少なくない。また、その霊泉のある場所について、高貴な血筋の子どもが埋葬されたと語るのも、珍しい言い伝えには違いないが、私たちはすでに遠州久留女木の龍宮小僧に、一つの類型を見たのである。家の古い祖先と水の神との結婚となると、日本にはあまりにも数多く、またあまりにも有名な伝説だったため、かえって省略して……'

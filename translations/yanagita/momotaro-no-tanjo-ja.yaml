  section: 狼と鍛冶屋の姥
  original: 一　產杉の傳說土佐の東境に近い野根山の峠路、公の臺帳には高知縣安藝郡佐喜濱村字大道南山とある國有林中に、產ノ杉と稱する有名な古木があつた。明治三十二年の暴風に、根もとから吹倒されて僅かに古株を存するのみであるが、土地の人たちには今尙その傳說と共に、珍らしい樹の形を記憶する者が少なくない。世間普通の杉の木と異なつて居たのは、地上四メートル程の高さで其幹が横に屈曲し、そこが平らになつて優に五六人を坐せしめ得るくらゐ廣かつたことである。さうして昔旅の女がこの樹の上で產をしたといふ傳說は、今でもほゞ信じ傅へられて居る。倒れて株ばかりになつた後まで、人が其杉の木片を削つて、安產の護符として持つて行く風が有つたのは、必ず右の傳說と關係の有ることであらう。山中の通路に保存せられる異形の樹木に向つて、子安子育ての祈願を掛け、さて其一部を呪物として尊重する慣習は、我邦にも決して稀なる例で無いと思ふが、それが次に說く如く所謂人狼傳說と結合して行はれて居るのは、可なり珍らしい事實だから細かく考へて見る必要がある。幸ひなことには此杉の木の傳說は、夙に縣外の人も注意し、又採集した記錄も幾通りかある。寺石正路氏が土佐鄕土民俗譚に載せられたものは、主として南路志の記事に準據せられたやうだが、此以外に石井氏の國民童話、松村氏の日本童話集に出たものも少しづつ話が違つて居り、尙他に四通りの報告を私は見て居る。それが何れも完全に一致しないといふことは寧ろ興味がある。口碑の要點は佐喜濱村の鍛冶の老母が、いつの間にか狼の化けたのであつて、それが產婦をこの杉の木に襲うて、斫られて正體を露はしたといふに在るが、說話としては一番に人を動かすべき部分、卽ち前に來た狼どもが人語して、「それでは鍛冶屋の婆樣を賴んで來い」と、謂つたといふ條を脫落したものもあり、或は又刀で斬り下すとカンといふ音がした。それは古狼が鍛冶の婆であるだけに、鍋を兜に被つて來て刄を防がうとしたので
  translation: '一　産杉の伝説

    土佐の東の境に近い野根山の峠道、公の台帳では高知県安芸郡佐喜浜村字大道南山となっている国有林の中に、「産ノ杉」という有名な古木があった。明治三十二年の暴風で根元から吹き倒され、今では古い切り株がわずかに残るだけだが、地元には今も、その伝説とともに珍しい木の形を覚えている人が少なくない。普通の杉と違っていたのは、地上四メートルほどの高さで幹が横に折れ曲がり、そこが平らになって、五、六人がゆうに座れるほど広かったことである。そして昔、旅の女がこの木の上で出産したという伝説は、今でもほぼ信じ伝えられている。倒れて切り株だけになった後まで、人々がその杉の木片を削り、安産のお守りとして持っていく習わしがあったのは、きっとこの伝説と関係することだろう。山中の道沿いに残される変わった形の木に、安産や子育ての祈願をし、その一部を呪力のあるものとして大切にする習慣は、日本でも決して珍しい例ではないと思う。しかし、それが次に述べるように、いわゆる人狼伝説と結び付いているのはかなり珍しい事実なので、詳しく考えてみる必要がある。

    幸い、この杉の伝説は早くから県外の人も注目し、採集した記録も何通りかある。寺石正路氏が『土佐郷土民俗譚』に載せたものは、おもに『南路志』の記事に基づくようだが、それ以外に石井氏の『国民童話』、松村氏の『日本童話集』に出たものも少しずつ話が違い、さらにほかに四通りの報告を私は見ている。それらがどれも完全には一致しないのは、むしろ興味深い。言い伝えの要点は、佐喜浜村の鍛冶屋の老母が、いつの間にか狼の化けたものに入れ替わっていて、杉の木の上の産婦を襲い、斬られて正体を現したということにある。しかし説話として最も人の心を動かすはずの部分、つまり先に来た狼たちが人の言葉で「それでは鍛冶屋の婆様を頼んで来い」と言ったというくだりが抜けているものもある。また、刀で斬り下ろすとカンという音がした。それは老狼が鍛冶屋の婆であるだけに、鍋をかぶと代わりにかぶって来て、刃を防ごうとしたのだっ'
  notes:
  - 「産ノ杉」は安産に関わる木の呼称。引用中の「婆」「姥」は物語の役柄・呼称として保持した。
  - 明治三十二年は1899年。末尾はscan207冒頭に続く。
  sequence: 211
- id: mmt-207-01
  scan: 207
  section: 狼と鍛冶屋の姥
  original: あつたといふ興味ある一挿話を、忘れたのか知らぬが說いて居らぬものもある。殊に傳說を信じ易くする爲に、通例先づ問はるゝ固有名詞と年代、卽ち傳說の歷史的分子とも名くべきものが、まだ一向に具體化して居らぬのである。昔或浪人が身持ちの妻を連れて、日暮れて此山中を通りかゝつた時に、俄かに產氣づいて云々と說く例も一つあれば、又一人旅の女性が臨月に、山の夜路をして居たやうに傳ふるものも有つて、第二の場合にはそこへ通りかゝつたのが武勇の士であつたとも謂ひ、又は南路志の如くそれが飛脚の者であつて、杉の木の根もとに女の泣聲を聽付け、立寄り介抱して男の子を安產させたとも云ふのである。しかも何故に此樣な山中を孕み女が通つて居たかは、何人も不審としたことであらうが、獨り四國老樹名木誌に載せられた一傳だけが、長曾我部氏が阿波の由岐城を攻圍して居た際に、部將某の妻その夫を陣中に訪はんとする途すがらの出來事と說明するのみで、其他は悉くたゞ或時或一人の女がと謂つて居る。此點は少なくとも昔話の形式の方に近く、まだ完全に傳說とはなり切つて居らぬ樣にも感じられる。傳說の未だ書卷に登載せられざる間、もしくは文字の知識が弘く常人に及ばざる間は、斯ういふ口頭傳承の異同は最も自然のことであつて、それを比べて見て何れかの一つが正しく、他は誤つて居ると決定することは困難だ。記錄が古いといふのはもう其時代から、斯ういふ形の傳へ方もあつたことを意味するだけで、其後に書留められたやゝ別樣の口碑が、以前は無かつたものだとする證據には十分で無い。地誌や緣起などの有力な記錄が世に出ると、通例無學者の空覺えは是に讓歩して、自然に其形に固定する傾向はあるが、寫本の世の中ではまだ今ほどの統一は望めなかつたのである。丸々さういふ記錄の旣に一方に出來て居ることを知らず、家々各自の聞傳へを守つて、互ひに異同を檢める機會の無かつたのも、隨分久しい間のことであつたやうに思はれる。だから採集と比較とは、今後に於ても尙益〻必要になつて來るので、我々は單にこの傳說統一の過程に於て、特に何れの部分が變へ動かし易く、又他の何れの部分が一貫して夙に定まつて居たかを、明かにすることを以て一應は滿足しなければならぬのである。この有名なる野根山の傳說に於ては、少なくとも今まで共通に何れの記錄にも見えて居る個條が三つある。(一)杉の大木の梢で產をした婦人のあつたこと。(二)それが群狼の危難に
  translation: 'たという興味深い挿話も、忘れたのかどうかはわからないが、語っていないものがある。

    とくに、伝説を信じやすくするために普通まず尋ねられる固有名詞と年代、いわば伝説の歴史的要素に当たるものが、まだ一向に具体化していない。昔、ある浪人が妊娠中の妻を連れて、日暮れにこの山中を通りかかったところ、急に産気づいて云々と語る例も一つある。一方、出産間近の女性が一人旅で夜の山道を歩いていたと伝えるものもあり、この場合は、そこを通りかかったのが武勇に優れた人物だったともいい、あるいは『南路志』のように飛脚だったともいう。飛脚は杉の根元で女の泣き声を聞きつけ、立ち寄って介抱し、男の子を無事に産ませたというのである。とはいえ、なぜこのような山中を妊婦が通っていたのか、誰もが不思議に思ったことだろう。ところが『四国老樹名木誌』に載った一つの伝承だけが、長宗我部氏が阿波の由岐城を包囲攻撃していた際、ある部将の妻が陣中の夫を訪ねる途中の出来事だと説明し、ほかはみな、ただ「あるとき、ある一人の女が」と述べている。この点では少なくとも昔話の形式に近く、まだ完全に伝説になり切っていないようにも感じられる。

    伝説がまだ書物に収録されていない間、あるいは文字の知識が一般の人々に広く行き渡っていない間は、こうした口頭伝承に違いがあるのはごく自然なことであり、比べてどれか一つが正しく、ほかは誤りだと決めることは難しい。記録が古いというのは、その時代からすでにこの形の伝え方もあったという意味にすぎず、その後に書き留められた少し違う言い伝えが、以前にはなかったとする十分な証拠にはならない。地誌や縁起など有力な記録が世に出ると、普通は文字による学問を持たない人々の不確かな記憶はそれに譲り、自然に記録の形へ固定する傾向がある。しかし写本の時代には、まだ今ほどの統一は望めなかったのである。一方でそうした記録ができていることをまったく知らず、それぞれの家が自分たちの聞き伝えを守り、相互の違いを確かめる機会のない時代も、ずいぶん長く続いたように思われる。だから今後も、採集と比較はいっそう必要になる。私たちはこの伝説が統一されていく過程で、とくにどの部分が変えられやすく、どの部分が早くから一貫して定まっていたのかを明らかにすることで、ひとまず満足しなければならないのである。

    この有名な野根山の伝説には、少なくともこれまでのどの記録にも共通して見える事項が三つある。第一は、杉の大木の梢で出産した女性がいたこと。第二は、その女性が狼の群れによる危険に'

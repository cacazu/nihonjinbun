  section: 狼と鍛冶屋の姥
  original: 以上に、永く其家には世の常で無い特徴の、傳はつて居ることを意味して居たのでは無かつたか。土佐では其家が旣に絕えてしまつて、如何に解釋されても之を爭ふことも出來なくなつて居るが、朝比奈の方では元の形の保存に努力した跡がある。出羽莊內の同族が大力の譽れを博したのも、駿州の本家が朝比奈三郞の末と稱したのも、共に狼明神の崇祀と關係のあることで、斯ういふ異常出現の男子の末であるが故に、永く武勇の士を出すことが出來たのだと、我も人も信じて居たことは察せられ、卽ち又足柄山の山姥の子が金太郞であつたといふ話と、日を同じうして說かるべき昔語りであつたのである。但し狼がどこの家の子とも知れぬ子供を、錦の袍に包んで咥へて來たといふことは、それだけでも十分の神祕はある。もう一つ前に溯ると蛇息子や田螺長者のやうに、異類の姿を以て世に現はれたといひ、又は狼を生みの母として生れたと謂つて居た時代もあつたかも知れぬが、日本ではよほど久しい昔から、さう迄言つては傳說として成立たないやうな文化狀態に達して居た。さうして唯僅かに說話の一隅に於て、狼は必ず婆に化け、又は養ひの母となつて居たことが、或は所謂葛の葉信仰の、此方面に於ける痕跡とも見られるのであつた。羅馬人の元祖が狼の乳を吸うて育ち、又突厥の王者が狼の族から出たといふ類の話は、異國にも樣々あるらしいが、私はそれを茲に竝べる必要を感じない。南方熊楠氏の如く本の不自由な田舎に住み、偏へに博覽强記の力を以て思ひの儘の例證を擧げてこそ、大いなる驚歎を以て迎へられる價値はあるが、何の東京に居り索引をひねくりまはして、遠い記錄の片端を拔出して見せるなどは、只學問を面倒くさく見せるこけ嚇しではあるまいか。人の空想が屢〻自然界に馳せて、色々の鳥獸をも祖とし伴としたといふことだけならば、そんな材料が無くとも日本でも證明せられる。それを異民族から學び又は移したといふことは、そんな材料が有つてもやつぱりわからない。調べるならば國際的にも、平押しに進んで綜覽しなければならぬのだが、それ迄には各地の事實がまだ整理せられて居らぬ。それよりも實は我々の國內知識が、今はまだ中途半端といふ所まですらも進んで居ないのである。何の事は無い順序が逆だ。八　荒血山の物語
  translation: 'である以上に、その家に普通ではない特徴が長く受け継がれていることを意味していたのではないだろうか。土佐ではその家がすでに絶えてしまい、どう解釈されても反論できなくなっているが、朝比奈のほうには元の形を保存しようと努力した跡がある。出羽庄内の同族が大力の名声を得たことも、駿河の本家が朝比奈三郎の子孫と称したことも、ともに狼明神をあがめ祭ることと関係している。このように異常な形で出現した男子の子孫だからこそ、長く武勇に優れた人物を輩出できたと、本人たちも他の人々も信じていたことが推察される。つまりこれは、足柄山の山姥の子が金太郎だったという話と、同列に論じられるべき昔語りなのである。

    ただし、狼がどこの家の子ともわからない子供を錦の衣に包んでくわえて来たというだけでも、十分に神秘的ではある。さらに一段前へさかのぼれば、蛇息子や田螺長者のように異類の姿でこの世に現れたとか、狼を生みの母として生まれたとか、語っていた時代もあったかもしれない。しかし日本は、かなり遠い昔から、そこまで言うと伝説として成り立たなくなるような文化状態に達していた。そして説話の片隅にわずかに残る、狼が必ず婆に化けたり、養い親になったりすることが、いわゆる葛の葉信仰の、この方面での痕跡ともみられるのであった。ローマ人の祖先が狼の乳を吸って育ったとか、突厥の王が狼の一族から出たとかいう類の話は、外国にもいろいろあるらしいが、私はここでそれらを並べる必要を感じない。南方熊楠氏のように本を手に入れにくい田舎に住み、ひたすら広い読書と優れた記憶力によって思いのままに例証を挙げるからこそ、大いに驚嘆して迎えられる価値がある。ところが東京にいて索引をひねくり回し、遠い土地の記録の断片を抜き出して見せるのは、ただ学問を面倒に見せるこけおどしではないか。人の空想がしばしば自然界へ飛び、さまざまな鳥や獣を祖先や仲間としてきたということだけなら、そのような材料がなくても、日本でも証明できる。それを異民族から学んだのか、移し入れたのかということは、そうした材料があっても、やはりわからない。調べるなら、国際的にも正面から着実に進み、全体を見渡さなければならないが、そこへ至るには、各地の事実がまだ整理されていない。それどころか実際には、私たちの国内についての知識さえ、今はまだ中途半端と呼べるところにすら達していないのである。要するに、順序が逆なのだ。

    八　荒血山の物語'
  notes:
  - 末尾は次節の見出し。本文はscan226へ続く。
  - 「異類」は人間以外の生き物などを指す当時の説話研究上の用語。

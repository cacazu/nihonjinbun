  section: 狼と鍛冶屋の姥／八 荒血山の物語
  original: '土佐の野根山の產杉には、以前は今一段と快活に、且つ勇壯なる傳說があつたものと私は想像して居る。

    それが今日の如く陰慘にして血腥さいものに改まつた原因は、必ずしも佐喜濱の鍛冶が退轉した爲ばかりでは無いやうである。

    是には昔話といふものの、傳說とは反對に寧ろ信じ難い事件の方へ、走つて行かうとする傾向を持つて居ることを考へなければならぬが、說話の狼婆は此地方に運ばれて、產杉傳說の鍛冶の母と結合する以前に、もうよほど近世風の潤色を受けて居たと思はれる節がある。

    注意すべき一つの證跡は、國民童話に採錄した一傳に、狼は產が嫌ひで、其血の穢れのある者を送つて來るものだとある。

    横田龜吉氏の報告の中にも、狼は女の氣を忌み、產室に臨んだ人は無事に通さぬといふ習性があり、それで山中に姙婦を介抱した武士を襲うたのだとある。

    南路志の方には記さぬ樣だが、土地ではさういふ人も確かに有つたのである。

    狼の送るといふことも前に揭げた如く、其解釋が時と共に變つて居る。

    今日はたゞ飛びかゝつて食ふ爲に轉ぶのを待つといひ、其以前には謹愼する者には害無しといひ、又その以前には護衞をしてくれるやうにも謂つて、禮を述べ食物を與へて門から返したといふ話もある。

    從うて血の穢れある者を必ず送ると謂つたのも、本來はどういふ趣意であつたか判らぬのだが、兎に角に是に尋常で無い關心を狼が持つて居たといへば、話は次第に物凄い光景の方へ、展開して行くことも有りさうに考へられる。

    或は又狼は情慾の淡い獸だといふ說がある。

    奇妙な實驗だが狼は犬とちがつて、雌雄馴れ戯ぶ處を人に見せぬといふ話と、關係のあることだけは推測し得る。

    さうして是を見た爲に、危害を受けたといふ話も流傳して居るのである。

    川野正雄君の小豆島民俗誌の中に、昔話として次のやうな一條を採集して居る。

    昔旅人が或山路を通つて、狼のつがふ所を見た。

    宿の主人にその話をすると、それは大變なことだ。

    きつと見た人を探して仇をするに違ひない。

    斯うして遁れるより途は無いと、教へられて松の大木に登り、樹の下に盛んに火を燃して置いた。

    さうすると果して狼の群がやつて來て、太い尻尾に水を浸して來て其火を消し、それから松の根を穿り始めたが、そのうちに夜が明けたので、漸く退散して助かつたとある。

    此結末には或は今少し何か曲折があつたのを忘れたのかも知れぬ。

    樹に昇つて危きを助かるといふのは逃竄說話の常の型で、日本では牛方山姥、天道さん金の綱、又口無し女房などにも共通して居る。

    だから是を目標として狼の話を研究するのは一'
  translation: '土佐の野根山の産杉には、以前はもっと快活で、勇壮な伝説があったのだろうと私は想像している。それが現在のような陰惨で血なまぐさいものに変わった原因は、必ずしも佐喜浜の鍛冶屋が没落したことだけではないようだ。ここでは、昔話というものが、伝説とは反対に、むしろ信じがたい事件へと向かおうとする傾向を持つことを考えなければならない。しかし、説話の狼婆は、この地方に運ばれて産杉伝説の鍛冶屋の母と結びつく以前に、すでにかなり近世風の脚色を受けていたと思われるところがある。注目すべき証拠の一つは、『国民童話』に収められた異伝に、狼は出産を嫌い、その血のけがれのある者の後をついてくる、とあることだ。横田亀吉氏の報告にも、狼は女性の気を忌み嫌い、産室に立ち会った人を無事には通さないという習性があり、そのために山中で妊婦を介抱した武士を襲ったのだ、とある。『南路志』には記されていないようだが、土地には確かにそう語る人もいたのである。狼が人を「送る」ということも、前に挙げたように、その解釈は時代とともに変わっている。今では、飛びかかって食うために人が転ぶのを待つのだといい、それ以前には、慎み深くしている者には害を加えないといい、さらにその前には護衛してくれるかのようにもいって、礼を述べ、食べ物を与え、門から帰したという話もある。したがって、血のけがれのある者を必ず送るといったのも、もともとどういう意味だったのかはわからない。しかし、とにかく狼がそのことに普通でない関心を持っていたとすれば、話がしだいに恐ろしい光景の方へ展開していくことも、ありそうに思われる。

    また、狼は情欲の薄い獣だという説もある。奇妙な観察だが、狼は犬と違い、雌雄が親しく戯れるところを人に見せないという話と関係していることだけは推測できる。そして、それを見たために危害を受けたという話も伝わっている。川野正雄君の『小豆島民俗誌』には、昔話として次のような一話が採集されている。昔、旅人がある山道を通って、狼が交尾しているところを見た。宿の主人にその話をすると、「それは大変なことだ。きっと見た人を探して仕返しをするに違いない。こうして逃れるよりほかに道はない」と教えられ、松の大木に登り、木の下で盛んに火を燃やしておいた。すると案の定、狼の群れがやって来て、太い尻尾を水に浸してきて火を消し、それから松の根を掘り始めたが、そのうち夜が明けたので、ようやく退散して助かったという。この結末には、もう少し何か込み入った展開があったのを忘れたのかもしれない。

    木に登って危険を逃れるというのは、逃亡の説話によくある型で、日本では「牛方山姥」「天道さん金の綱」、また「口無し女房」などにも共通している。だから、この点を目印に狼の話を研究するのは、まったく――'
  notes:
  - 末尾の文は227へ続く。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第26頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。

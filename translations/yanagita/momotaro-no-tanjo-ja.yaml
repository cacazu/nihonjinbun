  original: 喝采せられさうな卽興體であつた。それを奧州宮古の橫山八幡宮などでは、又よつぽど間違へて傳へて居たのである。南部領の舊地誌、邦內鄕村志卷三に、此社火災に遭つて緣起喪失すとあつて、しかも此事を記したものが廣略二本あり、前者は漢文で延享三年に高橋半左衞門といふ人が書いて居る。·其大要は昔阿波の鳴門が天地も轟くやうに鳴つて、朝廷之を患へて樣々の祈禱をなされた時、この奥州橫山の神官が夢に神樣から一首の歌を授けられ、是を唱へるならば、鳴門の音は忽ち止むだらうといふことであつた。山畑に作りあらしのえの子草あはのなるとゝ誰かいふらん早速其歌を携へて現場に行向うたところ、女官の和泉式部が亦勅命を奉じて鳴門の音を鎭めに遣つて來て居た。さうして一夜旅館に横山の神主を訪ねて、だまして其神歌を聞取つてしまつた。次の朝早天に和泉は彼に先だつて洲先に進み出で、昨夜盜み聽いた歌を改作して、種はおのれと云々の歌を詠じ、續いて橫山も出て來て、山畑にの歌を唱へたので、どちらの歌の德で海の響きが熄んだのかを決し難かつた。それで京都では彼を嘲弄して、歌つくるのみとかんなをねとられてむなしく歸る横山の禰宜といふ歌も行はれた。けれども結局は御神德が認められて、橫山の禰宜は宮古といふ地名を頂載して奥州に戾り、其折阿州から杖について來た銀杏も、地に刺して成長して神木となつて榮えて居る。だから今でも阿波の船が此港へ來ると、我國の鎭守樣だと此御社を尊敬するのだとある。此記錄は同じ延享三年に、土地の人が京都に持參して、社格昇進の運動をした證據材料であつた。それから十五年後の寶曆十年には、江戶の學者井上蘭臺は、之に基づいて重修橫山八幡宮記を書き、更に五十年後には駒井常傅といふ人が、その山畑にの神歌を石に刻して、境內に記念碑を立てた(旅と傳說二卷二號)。卽ち由來は年久しいけれども、根源はたゞこの二首の歌の暗記に過ぎない。さうして我々にゆかしく思はれるのは、主としてこの言傳への奥南部に入つて來た事情のみであつた。無論阿波船などの載せて來た話では無かつたらう。この橫山の禰宜は舊家で、猿丸大夫の子孫だといふ傳へもあつた。奥州の猿丸大夫は會津でも小野氏であり、横山といふ神官はどこへ行つても小野氏であつた。小野氏は絕代の歌人小町を出し、又淨瑠璃十二段の作者と傳へられる小野於通をも出して居る。南無藥師の歌が東國
  translation: '〔前のスキャンから続く〕拍手を受けそうな即興の作りだった。それを陸奥の宮古にある横山八幡宮などでは、またかなり違った形で伝えていたのである。南部領の古い地誌『邦内郷村志』巻三には、この社は火災に遭い縁起を失ったとあるが、この事を記した詳しいものと簡略なものの二本があり、前者は延享三年に高橋半左衛門という人が漢文で書いている。そのあらましは、昔、阿波の鳴門が天地もとどろくほど鳴り、朝廷がそれを心配してさまざまな祈祷をしたとき、この陸奥横山の神官が夢で神から一首の歌を授けられ、これを唱えれば鳴門の音はたちまち止むだろう、と告げられたというものだった。

    「山の畑を耕したあと荒れるままにして生えたエノコログサを、『粟の鳴ると（阿波の鳴門）』とは誰がいうのでしょう。」

    早速、その歌を携えて現地へ行くと、女官の和泉式部も勅命を受け、鳴門の音を鎮めに来ていた。そしてある夜、宿に横山の神主を訪ね、だましてその神の歌を聞き出してしまった。翌朝早く、和泉は彼より先に洲の先端に進み出て、昨夜盗み聞いた歌を作り替え、「種はおのれと」云々の歌を詠んだ。続いて横山も出てきて「山畑に」の歌を唱えたため、どちらの歌の力で海の響きが止んだのか、決められなかった。そこで京都では彼をあざけって、

    「歌を作る鑿も鉋も、寝ている間に奪われて、むなしく帰る横山の禰宜よ。」

    という歌も流行した。しかし結局は神の徳が認められ、横山の禰宜は「宮古」という地名を賜って陸奥に帰った。そのとき阿波から杖についてきたイチョウも、地面に挿すと育ち、神木として栄えている。だから今でも阿波の船がこの港へ来ると、自分たちの国の鎮守様だといって、この社を敬うのだという。

    この記録は、同じ延享三年に土地の人が京都に持参し、社格を上げる運動に用いた証拠資料だった。それから十五年後の宝暦十年には、江戸の学者井上蘭台が、これに基づいて『重修横山八幡宮記』を書き、さらに五十年後には駒井常傅という人が、「山畑に」の神の歌を石に刻んで、境内に記念碑を建てた（『旅と伝説』二巻二号）。つまり、由来は長くても、根本にあるのは、この二首の歌の暗記にすぎない。そして、私たちが興味を引かれるのは、主として、この言い伝えが奥南部に入ってきた事情だけである。もちろん阿波の船などが運んできた話ではなかっただろう。この横山の禰宜は旧家で、猿丸大夫の子孫だという伝承もあった。陸奥の猿丸大夫は会津でも小野氏であり、横山という神官はどこへ行っても小野氏だった。小野氏は並ぶ者のない歌人小町を生み、また『浄瑠璃十二段』の作者と伝えられる小野於通も出している。「南無薬師」の歌が東国では、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン261）と本文OCRを照合。

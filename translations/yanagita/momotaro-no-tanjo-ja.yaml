  section: 隣の寝太郎／三 奥州のならず者
  original: 國中に流布したのは、隨分と古くからの事實であつた。奥州では寢太郞といふ代りに、或一人のならず者がと言つて居るが、長者を欺いてうま〳〵と一人娘の聟になつただけは一つである。老媼夜譚の第六十四話に昔大工の庄五郞といふならず者、村の長者が觀音堂に夜參りをして、どうか娘に良い聟を御授け下さいと、每晚夫婦で願掛けをして居るのを知つて、竊かに物蔭から作り聲をして、お前たちの聟になる者は、大工の庄五郞の外には無いと言つた。それを長者が觀音の御告げと信じて、早速大工の庄五郞を捜して、娘を貰つてくれと言つて來た。それで目出たく緣談がとゝのひ、ならず者忽ち長者となるといふのであるが、是には注意すべき一つの挿話を伴なうて居る。大工の庄五郞は此事を朋輩の博打どもに話すと、一同が遣つて來て色々と世話を燒く。當日は渚端に行つて砂を多くの俵につめて、今聟殿の米船が著いた。嫁御の荷物も運び入れねばならず、やれ忙がしやと大騒ぎをして見せる。それを聞いて嫁も喜び舅も安心をしたといふのであるが、この友だちの助力といふことは、同じ話に附いてまはつて居るのみならず、終りに言はうと思ふ八戶の蕪燒笹四郞の方とも繫がつて居る、單に聟一人の才覺では、目的を達し難かつたといふだけの理由では無かつたやうである。大工の庄五郞といふのは多分さういふ道化者があつて、面白く此話をした記念であることは、豐後の吉右衞門なども同じかと想像する。江刺郡昔話(五〇頁)に採錄せられた一話では、長者の方にばかり名があつて、聟は單に或のらくら者がとある。さうして朋輩の援助が是には今一段と適切であつた。昔二人ののらくら者が、生れ在所では誰も相手にしてくれぬので、二人連れ立つて南部へ遣つて來ると、ちやうど熊野澤の要左衞門長者の家で、一人娘に聟を探して居る。それを聞いて二人は談合して、近所の地藏堂に入り込んで、一人は地藏になつて物を言ひ、他の一人はその評判をしてあるく。それで忽ち流行地藏となつて繁昌する。熊野澤の長者もそれを聞傳へて、娘の緣談を伺ひに行くと、地藏が長者に斯う言つて教へた。いつ幾日の夜明けにお前の家の前の杉の樹の上へ、天から若い者が一人降りて來る。それは天つこ神の子だから、迎へ取つて娘の聟にせよと言つた。長者はそれを信じて待受けて居たところが、果して門前の杉の木の上から、其のらくらの一人がする〳〵と降りて來
  translation: '……全国に広まっていたのは、ずいぶん古くからの事実だった。奥州では寝太郎という代わりに、「ある一人のならず者が」といっているが、長者をだまして、まんまとその一人娘の婿になったという点は同じである。『老媼夜譚』の第六十四話には、次のようにある。

    昔、大工の庄五郎というならず者がいた。村の長者が観音堂へ夜参りをして、「どうか娘によい婿をお授けください」と、毎晩夫婦で願をかけているのを知ると、ひそかに物陰から声色を変え、「お前たちの婿になる者は、大工の庄五郎のほかにいない」といった。長者はそれを観音のお告げだと信じ、さっそく大工の庄五郎を捜し出して、娘をもらってくれと頼みにきた。

    こうしてめでたく縁談がまとまり、ならず者はたちまち長者になるというのである。けれども、この話には注意すべき一つの挿話がついている。大工の庄五郎がこのことを仲間の博打打ちたちに話すと、みんながやってきて、あれこれ世話を焼く。当日は浜辺に行って、たくさんの俵に砂を詰め、「今、婿殿の米船が着いた。嫁御の荷物も運び込まなければならない。やれ忙しい」と大騒ぎしてみせる。それを聞いて花嫁も喜び、舅も安心したという。この友人たちの助力は、同じ系統の話について回るだけでなく、最後に述べるつもりの八戸の蕪焼笹四郎の話ともつながっている。単に、婿一人の才覚では目的を果たしにくかった、というだけの理由ではなかったようである。

    大工の庄五郎というのは、おそらくその名の道化者がいて、この話を面白く語った記念なのだろう。豊後の吉右衛門なども同じではないかと想像する。『江刺郡昔話』（五十頁）に採録された一話では、長者にだけ名前があって、婿は単に「あるのらくら者が」となっている。そして仲間の助け方は、こちらではさらに適切だった。

    昔、二人ののらくら者が、生まれ故郷では誰にも相手にされないので、連れ立って南部へやってきた。するとちょうど、熊野沢の要左衛門長者の家で、一人娘の婿を探していた。それを聞いた二人は相談し、近くの地蔵堂に入り込んで、一人は地蔵になりすまして物をいい、もう一人はその評判を広めて歩いた。それでたちまち、評判の地蔵として参詣人が集まるようになった。熊野沢の長者も聞きつけ、娘の縁談についてお伺いに行くと、地蔵は長者にこう教えた。「何月何日の夜明けに、お前の家の前の杉の木の上へ、天から一人の若者が降りてくる。それは天つこ神の子だから、迎え入れて娘の婿にせよ」といった。長者がそれを信じて待ち構えていると、果たして門前の杉の木の上から、のらくら者の一人がするすると降りてき……'
  notes:
  - 末尾の引用はscan149へ続く。
  - 「天つこ神」は原文の呼称を保持した。

- id: mmt-252-01
  scan: 252
  section: 和泉式部の足袋／四 南無藥師・五 雨乞小町など
  original: 'のである。

    それがたま〱九州の或靈場に移されて、鹿野田の村に居た此女性に、托せられることになつたのは、私には意味のあることのやうに思へる。

    三河の鳳來山下に於ては、淨瑠璃御前の足袋であつたものが、肥前で和泉式部に變つて居る事情も、事によると是から類推し得られるかも知れぬ。


    五雨乞小町など

    上臈が惡疾に惱んで、都を離れ旅に流寓したといふ話は、如何なる理由からか我邦には最も例が多かつた。

    法然上人の傳記の片端を占むる松蟲鈴蟲なども、元はさういふ形に語り傳へられたものがあり、其他にも特殊の部落の根源を、是に結び付けたものが色々あつた樣だが、この南無藥師の歌物語ばかりは、不思議に小野小町に托したものが普及して居る。

    極めて簡單に今わかつて居る例を列擧して見ると、先づ稍々近い處では伊豫溫泉郡小野村に小野藥師、この話は伊豫溫故錄、久米郡北梅本村正觀寺の條に見えて居る。

    昔小野小町が住吉の神の教に從ひ、こゝに參詣して病を禱り、一百日の參籠をしたところ、滿願の日に歌の御告があつた。

    春雨の降ると見えしが霽れにけりそのみのかさをそこにぬぎおくとあつて、其病忽ち癒えた。

    仍つて三年の間此地に寓居し、新たに藥師佛を刻して、歌を御像の頭の中に納めてこゝに安置したと誌してある。

    次には備中都窪郡淸音村大字黑田の晝間藥師、是は備陽記卷九、備中巡禮略記その他の書に述べて居る。

    是も日本の三體藥師の一つで、東國には朝間の藥師、今は峯の藥師といふ。

    夕間の藥師は九州の何れかの地に在り、是は其中央の晝間の藥師だと謂つて居る。

    歌は記錄によつて少しづつの相異があるが、趣向だけは皆一致して居る。

    昔小野小町瘡疾を發し、この御佛に立願して禱れども驗無く、恨みの餘りに南無藥師衆生悉除の願立てゝ身より佛の名こそ惜しけれと詠みければ、卽ち御堂鳴動して藥師の返歌、村雨はたゞ一ときのものぞかしそこに脫ぎおけおのがみのかささうして亦忽ちに平癒したといふのである。'
  translation: '――のである。それが、たまたま九州のある霊場へ移され、鹿野田の村にいたこの女性の話とされたことは、私には意味のあることに思える。三河の鳳来山の麓では浄瑠璃御前の足袋だったものが、肥前では和泉式部に変わっている事情も、あるいは、ここから類推できるかもしれない。

    五　雨乞小町など

    身分の高い女性が悪い病に苦しみ、都を離れて旅先を流れ歩いたという話は、どういう理由か、日本には非常に例が多かった。法然上人の伝記の一部を占める松虫・鈴虫なども、もとはそうした形で語り伝えられたものがあり、そのほか、特殊な部落の起源をこれに結びつけたものも、いろいろあったようだ。しかし、この南無薬師の歌物語だけは、不思議と小野小町の話としたものが広まっている。今わかっている例を、ごく簡単に並べてみよう。まず比較的近いところでは、伊予温泉郡小野村の小野薬師がある。この話は『伊予温故録』の、久米郡北梅本村正観寺の項に見える。昔、小野小町が住吉の神の教えに従ってここに参詣し、病の回復を祈って百日間こもると、満願の日に歌のお告げがあった。

    『春雨が降ると見えたが、もう晴れた。その蓑と笠を、そこへ脱いで置きなさい。』

    というもので、病はたちまち治った。そこで三年間この地に仮住まいし、新たに薬師仏を彫らせ、歌を像の頭の中に納めて、ここに安置したと記されている。

    次に、備中都窪郡清音村大字黒田の昼間薬師がある。これは『備陽記』巻九や『備中巡礼略記』などに書かれている。これも日本の三体薬師の一つで、東国には朝間の薬師があり、今は峰の薬師という。夕間の薬師は九州のどこかにあり、これはその真ん中の昼間の薬師だという。歌は記録によって少しずつ違うが、趣向はみな一致している。昔、小野小町が瘡の病を患い、この仏に願を立てて祈っても効き目がなく、恨みのあまり、

    『南無薬師。あらゆる病を取り除くという誓いを立てたのに、私の命よりも、仏の名声が損なわれるのが惜しいことです。』

    と詠んだところ、すぐに堂が鳴り動いて、薬師の返歌があった。

    『村雨はほんの一時のもの。そこへ脱いで置きなさい、自分の蓑と笠を。』

    そして、やはりたちまち全快したというのである。'
  notes:
  - 冒頭は251からの続き。
  - 『上臈』『惡疾』『特殊の部落』は原文の時代的な身分・病気・集落に関する表現。特に『特殊の部落』は被差別集落を指す可能性のある歴史的な差別用語で、原文の叙述として残した。
  - 同一資料・同一版のCommons公開スキャン（NDL1062590 part3、PDF第52頁）と本文・見出し・語順を目視照合。柱・頁番号は除外。
  - 歌の原版は実際に「衆生悉除」と印刷されている。他の同型歌と文脈から「衆病悉除」の誤記と考えられるため、原文欄には印刷どおりを残し、訳では「あらゆる病を取り除く」とした。

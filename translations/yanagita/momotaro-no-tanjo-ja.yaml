- id: mmt-123-01
  scan: 123
  section: 田螺の長者／三 小泉小太郎と泉小次郎
  original: '培の爲に、深く水の德を仰ぐ人民であつた故に、取分けて天に近い川上の地を慕ひ、流れに

    導かれて人界に降り來るものを、貴重視したといふ說話も生れたらしいのである。だから桃

    太郞の桃や瓜子姫の瓜が、こんぶりこんぶりと善い婆さまの前に流れて來たのも、源はもと一つ

    であつたらうと私は思つて居る。大蛇はたゞ其姿と聯想とに由つて、直接に由緒を覺らしむ

    ることが出來た故に、わざわざ水に浮んで出現することを要しなかつたまでである。甲州の

    上九一色村、卽ち丁度竹取の古い物語と、富士の靈山を隔てて裏表になつた土地にも、又斯

    ういふ昔話が遺つて居た。

    昔老いたる夫婦、子無きを憂ひて神樣に子を禱ると、忽ち婆が身ごもつて男の兒を生ん

    だ。之を龍吉と名けて愛育して居るうちに、龍吉は追々體が長くなつて、家には置かれ

    ぬので鳥籠のやうな物を作つて其中に入れて置いた。それでも愈、長くなり、後には手

    足も無くなつて蛇のやうな形になつて、もう何處にも置かれぬので、老夫婦は其箱を山の

    頂上へ背負ひ上げ、よく譯を言つて聽かせて、又用がある時は爰へ來て喚ぶからと言つ

    て放すと、龍吉は喜んで走り去つた。それから何年かの後に國中にひどい旱魃があり、

    雨を降らせた者には褒美を遣るといふ、殿樣からの御觸れが出た。そこで爺婆は再び其

    山に登り龍吉を喚ぶと、龍吉は大蛇となつて、草木を靡かせつゝ飛んで來た。雨を降ら

    せてくれぬかといふと承知をして、七日の間靜かな雨を降らせてくれた。それ故に二親

    は御約束の恩賞を受け、斯んな片輪の子ながら龍吉は、親を一生安樂に送らせることが

    出來た(土橋里木君、甲斐昔話集)。

    話は斯ういふ形を以て又弘く行はれて居たと見えて、老媼夜譚の蜘蛛息子といふ一例も、

    大分世話物風に語り改められては居るが、一部分だけはこの甲州のものと似て居る。

    貧しい父に一人の娘があつた。春の頃山に菜を摘みに行つて、美しい若者と心安くなつ

    た。さうして身持になつて別れて還る時に、若者は誠は人間で無いと告げて、大きな蜘

    蛛の形になつて山深く入つて行つた。驚いて戾つて父に其事を話すと、仕方無い仕方な

    い。其物が大事に生んでくれと言ふなら、大事にして生むがよい。決して心配をするな

    と父が言つて慰めた。さうして生れた兒は腰から上は人間であるが、腰から下は蜘蛛の

    姿であつた。それでも父と娘は約束事だとあきらめて、大切に育てて居た。其男の子は'
  translation: '――水の恵みを深く仰ぐ人々だったため、特に天に近い川上の土地を慕い、流れに導かれて人間の世界へ下ってくるものを貴重なものとする説話も、生まれたらしいのである。だから、桃太郎の桃や瓜子姫の瓜が、こんぶりこんぶりとよいおばあさんの前へ流れてきたのも、源はもともと一つだっただろうと、私は考えている。大蛇はただ、その姿と、そこから連想されることによって、直接その由来を悟らせることができたので、わざわざ水に浮かんで現れる必要がなかっただけなのである。甲州の上九一色村、つまり、竹取の古い物語の土地とは霊山富士を隔ててちょうど表と裏になる土地にも、次のような昔話が残っていた。


    昔、年老いた夫婦が、子どもがいないことを嘆き、神様に子を祈り求めると、たちまちおばあさんが身ごもり、男の子を産んだ。龍吉と名づけて大切に育てているうち、龍吉は次第に体が長くなった。家に置けないので鳥籠のようなものを作って入れておいたが、それでもますます長くなり、後には手足もなくなって、蛇のような姿になった。もうどこにも置けないので、老夫婦はその箱を山頂へ背負って上がり、よく事情を言って聞かせ、「また用のある時は、ここへ来て呼ぶから」と言って放すと、龍吉は喜んで走り去った。それから何年か後、国中にひどい日照りがあり、「雨を降らせた者には褒美を与える」という殿様のお触れが出た。そこで老夫婦は再びその山に登り、龍吉を呼んだ。龍吉は大蛇になって、草木をなびかせながら飛んできた。「雨を降らせてくれないか」と言うと承知し、七日間、静かな雨を降らせてくれた。それで両親は約束の褒美を受け取った。こうした「片輪」の子ながら、龍吉は親に一生、安楽な暮らしを送らせることができた。（土橋里木君『甲斐昔話集』）


    話はこのような形でも広く伝わっていたらしい。『老媼夜譚』の「蜘蛛息子」という一例も、ずいぶん世話物ふうに語り直されているが、一部分はこの甲州の話に似ている。


    貧しい父親に一人の娘があった。春、山へ菜を摘みに行き、美しい若者と親しくなった。そして身ごもって、別れて帰る時、若者は実は人間ではないと告げ、大きな蜘蛛の姿になって山深く入っていった。娘は驚いて帰り、父にそのことを話した。父は「仕方がない、仕方がない。その者が大事に産んでくれと言うのなら、大切にして産むがいい。決して心配するな」と慰めた。そうして生まれた子は、腰から上は人間だったが、腰から下は蜘蛛の姿だった。それでも父と娘は、これは約束事なのだと受け入れ、大切に育てていた。その男の子は――'
  notes:
  - 冒頭はスキャン122の続き。末尾の蜘蛛息子の引用はスキャン124へ続く。
  - 「片輪」は身体の相違や障害に向けられた歴史的な差別語。原文の表現を明示して保持した。

  section: 海神少童
  original: 'つの昔話に共通であつた。單にそればかりで無く他の色々の民間說話、例へば何心無く斧を

    淵に取落したところが、それは水の神の此上も無く感謝することであり、日頃水底に在つて

    暴威を振ふ大蟹の足を斫り、退治してくれたのは誠に有難いと、出て來て禮を言つたといふ

    話などでも、其主は若い女性であつた。浦島子の舊傳は此方から遊びに行つたことになつて

    居るが、今ある龍宮女房の昔話に於ては、美しい少女が訪ねて來て、妻となり子を儲けて後

    に還り去つたといふのが至つて多い。其子は何れも人間の世に留まつて、後に父の家を富貴

    にして居るのである。それから又非常に多い水の神の文使ひの話、某の橋の袂に立つ女のも

    とへ、もしくは某沼の底に住む姉神へ、どうかこの手紙を屆けてくれと賴まれるのも若い女

    性からであつた。是には無邪氣に其任務を果して、尊い寶物を貰つたといふ話、それを裏切

    つたが爲に害に遭はうとした話、人が警戒したので災を轉じて福となしたといふ話、其他幾

    通りかの變化があつて、尋ねて見るならばその成長して來た過程がわかり、決して最初から

    是だけ區々に、話されて居たものでは無いことが知れるやうに思はれる。諸國の傳說に今も

    殘つて居る機織池機織淵、大歲の夜の眞夜中に又は靜かなる雨の日に、筬の音梭の音が水の

    底から聞えることが有るといひ、或は其音を聽き得た者は幸運であると稱し、もしくは某家

    の美しい一人娘が行方知れずになつたのが、後に水底に入つて機を織つて居るところを見て

    來た者があり又堅く口留めせられたなどといふのも、其根本には何か一つの古い信仰があつ

    て、それがどこかの點で右にいふ昔話と、緣の絲を引いて居るやうに思ふ。兎に角に我々は

    今尙龍宮といへば乙姫樣を思ひ起す習はしをもつて居る。是などもよその國にも例の有るこ

    とだと言つて、强ひて一部の似寄りを引張つて來る人はあらうが、程度も樣式も共に我々の

    は特殊である。繪をかく人たちの作り事以外に、日本の龍宮は又何れの國とも別なものであ

    つた。ひとり神祕なる蒼海の消息を傳へた者が、殆と常に若い女性であつたといふに止ら

    ず、更に又不思議の少童を手に抱いて、來つて人の世の緣を結ばうとしたのも彼等であつ

    た。海はこの國民の爲には永遠に妣の邦であつたといふことが言へるのである。

    五海の神の贈りもの

    小さな童兒とは誠に珍らしい御土產であつたが、是も前に列記した五つの例の、四つまで'
  translation: 'つの昔話に共通していた。そればかりではない。ほかのさまざまな民間の物語、たとえば、何気なく斧を淵に落としてしまったところ、それは水の神にとってこの上なくありがたいことで、いつも水底で暴れ回る大蟹の足を切り、退治してくれて本当にありがたい、と現れて礼を言ったという話などでも、その主は若い女性だった。浦島子の古い伝えでは、こちらから遊びに行ったことになっているが、現在の竜宮女房の昔話では、美しい少女が訪ねてきて、妻となり子供をもうけてから帰っていった、というものがきわめて多い。その子供はどれも人間の世にとどまり、後に父の家を豊かにするのである。また、非常に多い水の神の手紙の使いの話でも、ある橋のたもとに立つ女のところへ、または、ある沼の底に住む姉神のところへ、どうかこの手紙を届けてくれと頼むのは、若い女性だった。この話には、疑いなくその役目を果たして貴重な宝物をもらったというもの、頼みを裏切ったために危害を受けそうになったというもの、人から注意されて災いを福に転じたというものなど、いくつもの変化がある。調べてみれば、その話が発展してきた過程がわかり、決して最初からこれほどまちまちに語られていたのではないと、明らかになるように思われる。

    各地の伝説に今も残る機織池や機織淵について、大みそかの真夜中や静かな雨の日には、水底から筬や梭の音が聞こえることがあるといい、また、その音を聞くことのできた人は幸運だともいう。あるいは、ある家の美しい一人娘が行方不明になったが、後に、水底で機を織っているところを見てきた者がいて、しかも固く口止めされた、などともいう。これらにも、根本には何か一つの古い信仰があり、それがどこかで、今述べた昔話とつながっているように思う。ともかく、私たちは今でも、竜宮といえば乙姫様を思い浮かべる習慣を持っている。こういうことにも外国に例があると言って、無理に一部の似た点を持ち出す人はいるだろう。しかし、程度も形式も、ともに私たちのものは特殊なのである。絵を描く人たちの創作とは別に、日本の竜宮は、ほかのどの国とも異なるものだった。神秘的な青い海の様子を伝えた者が、ほとんどいつも若い女性だったというだけではない。さらに、不思議な幼い子を腕に抱き、こちらへ来て人間の世との縁を結ぼうとしたのも、そうした女性たちだった。海はこの国民にとって、永遠に亡き母の国であったと言えるのである。

    五　海の神の贈り物

    小さな子供とは、実に珍しい土産だった。しかし、これも前に挙げた五つの例のうち、四つまで'

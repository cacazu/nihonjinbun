  - 冒頭はscan197から、末尾はscan199「上から」に続く。199以降は別担当範囲。
  - 原文「氣ちがひ」は今日では差別的に受け取られる歴史的表現。原文を保存し、訳では引用符を付けた。ここでは著者が神がかりとの関係を論じており、現代の精神医学上の診断ではない。

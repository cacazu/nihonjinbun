  section: 絵姿女房／一 黒川能の起こりと瓜子姫
  original: '一 黑川能の起りと瓜子姫

    最近に又一つ、出羽の黑川村に傳はつて居る瓜子姫說話の、稍かはつた形のものを教へ

    て貰つた。是は爺婆の申し兒としては育てられずに、姫が急速に成長して美しい上臈になつ

    たといふ例である。ちやうど其問題を考へて見ようとして居た所であつたから、先づ出來る

    だけ簡單に、其話の要領を書拔いて、それから比較を進めて行かうと思ふ。

    昔々、黑川村の孫在家といふ處に、孫三郞といふ一人の百姓があつた。或時川端に出て

    見ると、上から瓜が流れて來た。それを拾つて來て神棚に上げ、後で食べようと思つて

    樂しみにして居ると、不意に赤兒の啼聲がするので、驚いて神棚を見たところが、めご

    え女の兒が生れて居た。其子を大事に大事に、ふツふツと言つて育てたら、忽ち大きくな

    つて美しいお姫樣になつた。孫三郞はお姫樣が餘りに美しいので、每日其姿をながめて

    居るばかりで、少しも働かぬ樣になつてしまつた。それではならぬと姫は自分の姿を繪

    にかいて、それを何處へでも持つて行つて働くことにさせた。或日其繪を畠の傍に引掛

    けて置いて、それを見ながら仕事をして居たところが、不意に大風が吹いて空高く之を

    卷上げ、何處へ行つたか見えなくなつてしまつた。御城の殿樣の庭の高い松の樹の枝に、

    何やら凧のやうなものが空から舞つて來て引掛かつて居る。殿樣があれは何かと取下し

    て見られると、世にも稀なる美人の姿繪であつた。此樣な美しい上臈がどこに居るので

    あらうかと、段々家來に尋ねさせて見ると、それは孫在家の賤しい百姓の女房であつた。

    早速呼寄せて無理に奥方にしてしまふ。孫三郞は諸處方々と姿繪を搜しまはつて、手を

    空しくして還つて來れば、當の本人のお姫樣ももう居ない。どうぞして一目でもよいか

    ら逢ひたいと思つて、每日御城の門まで往つて見るが、門番が叱り飛ばして入れてくれ

    なかつた。そこで色々と思案した上で、姫が大好きであつた栗を賣りに行つて見ようと'
  translation: '一　黒川能の起こりと瓜子姫

    最近また一つ、出羽の黒川村に伝わる瓜子姫の説話で、少し変わった形のものを教えてもらった。これは、爺と婆が神仏に願って授かった子として育てるのではなく、姫が急速に成長して美しい女性になったという例である。ちょうどその問題を考えてみようとしていたところなので、まずできるだけ簡潔に話の要点を書き抜き、それから比較を進めていこうと思う。

    昔々、黒川村の孫在家という所に、孫三郎という一人の百姓がいた。あるとき川辺に出てみると、上流から瓜が流れてきた。それを拾ってきて神棚に上げ、あとで食べようと楽しみにしていると、突然赤ん坊の泣き声がした。驚いて神棚を見ると、かわいい女の子が生まれていた。その子を大事に大事に、「ふっふっ」と言いながら育てると、たちまち大きくなって、美しいお姫様になった。孫三郎はお姫様があまりに美しいので、毎日その姿を眺めているばかりで、少しも働かなくなってしまった。それではいけないと、姫は自分の姿を絵に描き、それをどこへでも持っていって働くようにさせた。

    ある日、その絵を畑のそばに掛けて、それを見ながら仕事をしていると、不意に大風が吹き、絵を空高く巻き上げて、どこへ行ったか見えなくなってしまった。お城の殿様の庭の高い松の枝に、何やら凧のようなものが空から舞ってきて引っ掛かった。殿様が「あれは何だ」と下ろさせて見ると、世にもまれな美人の姿絵だった。こんなに美しい女性がどこにいるのだろうと、家来にあちこち尋ねさせると、それは孫在家の身分の低い百姓の妻だった。さっそく呼び寄せ、無理やり奥方にしてしまった。

    孫三郎はあちらこちらと姿絵を探し回り、何も得られずに帰ってくると、当の本人のお姫様も、もういなかった。何とかして、ひと目だけでも会いたいと思い、毎日お城の門まで行ってみるが、門番がどなりつけて入れてくれなかった。そこでいろいろと考えた末、姫が大好きだった栗を売りに行ってみようと'
  notes:
  - 末尾の文はscan175に続く。
  - 「賤しい」は当時の身分意識に基づく語で、「身分の低い」と訳した。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。
  - 「上臈」はここでは女性への敬称。婚姻前の成長の記述では「女性」と訳した。
  sequence: 179
- id: mmt-175-01
  scan: 175
  section: 絵姿女房／一 黒川能の起こりと瓜子姫
  original: '思ひ、栗賣に姿をかへ、［初字判読留保］代山の柴栗々々と大きな聲でふれながら、御城のまはりを三

    度まはつて見た。一方御姫樣の方では、無理に連れて來られて奥方になつたが、まだ一度

    でも笑ひ顏を見せたことが無かつた。それが此日ちやうど御城の窓の下を、大聲で栗を

    賣つてあるく男の姿を見て、始めてたつた一度につこり笑つた。それで殿樣が大急ぎに

    栗賣を喚入れさせ、何と男、その栗は皆買つて遣るが、其代りにこちらの言ふことをき

    くかとある。何かと思ふと殿は自分の衣服を脫いで、取換へて孫三郞のきたない着物を

    着て、柴栗の袋を背に負ひ、門を出て御城の窓の下を、何度も何度も栗々とふれてある

    いた。さうして今一度姫の笑顔を見たいと思つて居るうちに、日が暮れて城の門は閉さ

    れ、贋の栗賣はもう還らうと思つても、門番が入れてくれない。贋の殿樣の孫三郞は、

    出ようと思つても門が堅く閉されて居た爲に、とうとう殿樣となつて御殿の中にとまつ

    てしまつた。併しいつ迄も爰には居りたくないので、翌日は姫を伴なひ色々の寶物を持

    つて、黑川の村へ歸つて來た。黑川明神の御寶物の能の面を始とし、金の茶釜や金銀細

    工の道具類は、何れも此折に御城から持出したもので、孫三郞はそれから明神の社家と

    なり、又能樂の座頭となつて、子孫は明治の初まで、連綿として續いて居た(國分剛二君

    報大正三年採集)。

    右の黑川能の根原に關しては、今では算へ切れぬ程色々の傳說が出來て居て、是は唯その

    一つといふに過ぎぬが、それにしても孫在家の草分けといふ孫三郞男が、一方には肥後の

    米原長者、卽ち都の姫君を嫁に娶つて、忽ち黃金を發見したといふ大幸運の賤夫と、同じ名

    であつたと同時に、一方には川から瓜の姫君を拾ひ上げた多くの昔話中、たつた一つの獨身

    者の例であつたのは珍らしい。姫と孫三郞とは親子のやうでもあり、又終りには夫婦とあつ

    て、其境目が明かにはなつて居ないが、是がちやうど竹取と余呉の天女、或は又丹波の比沼

    山の昔話と、伯耆の羽衣石山の傳說などとの中間に立つもので、前者は多分神童の生ひ立ち

    から說かうとしたのが、後にその急激の成長といふことに興味が薄くなつて、次第に話を花

    やかなる最終の一幕に、持つて行かうとした過程を示すものであらうと思ふ。桃太郞と羽衣

    と、斯んな二つの昔話の間にも、尙一筋の脈絡は辿られるのである。'
  translation: '思い、栗売りに姿を変え、「たらのきやまの柴栗、柴栗」と大声で売り歩きながら、お城の周りを三度回ってみた。一方、お姫様は無理に連れてこられて奥方になったものの、まだ一度も笑顔を見せたことがなかった。ところがこの日、ちょうどお城の窓の下で、大声で栗を売り歩く男の姿を見て、初めて、一度だけにっこり笑った。そこで殿様は大急ぎで栗売りを呼び入れさせ、「おい、その栗は全部買ってやるが、その代わり、こちらの言うことを聞くか」と言った。何をするのかと思うと、殿様は自分の衣服を脱ぎ、取り替えて孫三郎の汚い着物を着ると、柴栗の袋を背負い、門を出てお城の窓の下を、何度も何度も「栗、栗」と呼び歩いた。

    そうして、もう一度姫の笑顔を見たいと思っているうちに日が暮れ、城門が閉ざされた。栗売り役を引き受けた殿様は、もう戻ろうと思っても門番が入れてくれない。殿様役になった孫三郎も、出ようと思っても門が固く閉まっていたため、とうとう殿様として御殿の中に泊まってしまった。しかし、いつまでもここにいたくはなかったので、翌日、姫を連れ、いろいろな宝物を持って黒川の村へ帰ってきた。

    黒川明神の宝物である能面をはじめ、金の茶釜や金銀細工の道具類は、いずれもこのときお城から持ち出したものである。孫三郎はその後、明神に仕える神職となり、また能の座の長にもなって、その子孫は明治の初めまで代々絶えず続いていた（国分剛二君の報告。大正三年採集）。

    この黒川能の起源については、現在では数え切れないほどさまざまな伝説ができていて、これはその一つにすぎない。それでも、孫在家を最初に開いたという孫三郎という男が、一方では肥後の米原長者、すなわち都の姫君を妻に迎え、たちまち黄金を発見したという大幸運に恵まれた身分の低い男と同じ名であったと同時に、他方では、川から瓜の姫君を拾い上げた多くの昔話の中で、たった一つ、独身者の例だったのは珍しい。

    姫と孫三郎は親子のようでもあり、また最後には夫婦とされていて、その境目ははっきりしていない。しかし、これはちょうど、竹取と余呉の天女との間、あるいは丹波の比沼山の昔話と伯耆の羽衣石山の伝説との間に位置するものである。前の型は、おそらく神童の生い立ちから語ろうとしたのが、のちにはその急速な成長への興味が薄れ、次第に物語を華やかな最後の一幕へ向けていこうとした、その過程を示すのだと思う。桃太郎と羽衣という、このような二つの昔話の間にも、なお一本のつながりをたどることができるのである。'
  notes:
  - 冒頭はscan174末尾に続く。
  - 「賤夫」は当時の身分意識に基づく表現で、「身分の低い男」と訳した。
  - 「比沼山の昔話」から「前者は多分神童の生ひ立ち」までの行順は、raw JSONのid順・座標と照合して復元した。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。
  - 「贋の栗賣」「贋の殿樣」は原画像で確認。地名の初字は拡大画像でも確定できず、楯・梳等への断定を撤回した。原文に判読留保を明示し、訳は原ルビ「たらのきやま」を採用。

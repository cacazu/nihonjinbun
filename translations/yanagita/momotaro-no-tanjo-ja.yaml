  section: 米倉法師／二 笑話の分布
  original: 是を此一話の發源地とまでは推斷することを敢てしない。近年我々の同志が採集しただけでも、同じ民譚の分布は可なり廣い。岡山縣では岡山文化資料二卷六號に、遠江濱松附近のものは土の香五卷四號に、何れもやゝ異なる形を以て傳はつて居り、更に甲州の富士山麓と、奥州では八戶市の附近に、明かに其破片と思はれるものが、半ば傳說に化して傳承せられて居た。さうして其以外にも私たちと同樣に、如何にもその話ならば自分も聽いたことがあると、思ひ出す諸君は必ず多いであらう。一箇處の師の坊が運搬してあるいたにしては、此區域は少しばかり廣きに過ぎる。作者があつたとすればもう少し中央に近く、且つよつぽど融通のきく本元があつたので無ければ、是だけの地方的變化は望み難かつたらう。豐前民話集に採錄せられた次の一例などは、形もよく調ひをかしさもずつと加はつて居る。是を肥後から輸入したものの燒直しとは考へることが難い。昔々ある一人の男が、子供のいぢめて居る龜を助けて遣る。さうすると龜は美しい女になつて來て、やはり寶物の小槌を一つくれた。其槌で地面を叩いて欲しい物の名を喚べば、何でも三度だけは望み通りのものが出るといふことであつた。持つて還つて女房に相談すると、其女房は慾ばかり深くして、智慧の足りない女であつた故に、先づ早速に雜炊千杯と謂うて打つと、乃ち千杯の雜炊が出た。それから足半草履を千足と謂うて地を叩くと、ちやうど又千足の草履が現はれる。さあ大變だ殘りはもう一度しか無い。是で米も出し、倉を出さねばならぬと、大急ぎでコメクラ千·コメクラ千と唱へたところが、忽ち小さな盲が千人出て來て、夫婦のあきれて居る間にその干杯の雜炊を食ひ、その千足の足半草履をはいて、さつさと何處へやら行つてしまつたといふ話になつて居る(梅林新市君採集)。岡山に行はれて居る小盲の童話などでも、千人の小盲が「まゝ食はせ三味線彈こ」と謂つて、鄰りの慾ばり爺をいぢめ通したといふ風に話されて居た。或は考へ過ぎであるかも知らぬが、是が私には端的にその作者の聲であつた樣な感じがする。さうでは無いまでも聽衆は之を話說する當人が小盲であつた故に、思はずどつと笑ひ又永く其をかしさを忘れなかつた。それを又盲の方でも當てにして居たのである。次の代の子供たちが年とつた祖父母から、至つて鮮明にこの滑稽を傳授してもらつたのも、旣に盲の文藝家の計畫のうちであつた。
  translation: '〔前のスキャンから続く〕ここがこの一話の発祥地だとまで推定しようとはしない。近年、私たちの仲間が採集したものだけでも、同じ民話の分布はかなり広い。岡山県のものは『岡山文化資料』二巻六号に、遠江浜松付近のものは『土の香』五巻四号に、それぞれ少し異なる形で伝わっている。さらに甲州の富士山麓や、陸奥の八戸市付近には、明らかにその断片と思われるものが、半ば伝説となって伝承されていた。そのほかにも私たちと同じように、その話なら自分も確かに聞いたことがある、と思い出す人は必ず多いだろう。一か所の師匠である坊が運んで歩いたにしては、この範囲は少し広すぎる。作者がいたとすれば、もう少し中央に近く、しかもよほど融通のきく本元があったのでなければ、これほどの地方的な変化は望みにくかっただろう。『豊前民話集』に採録された次の例などは、形もよく整い、おかしさもずっと増している。これを肥後から輸入した話の作り直しとは考えにくい。

    「昔々、一人の男が、子どもたちにいじめられている亀を助けてやった。すると亀は美しい女になって訪れ、やはり宝の小槌を一つくれた。その小槌で地面をたたき、欲しい物の名を呼べば、何でも三度だけ望みどおりの物が出るということだった。持ち帰って妻に相談すると、妻は欲ばかり深く、知恵の足りない女だったので、まず早速『雑炊千杯』と言ってたたき、千杯の雑炊が出た。それから『足半草履を千足』と言って地面をたたくと、ちょうど千足の草履が現れた。さあ大変だ、残りはもう一度しかない。これで米も倉も出さなければと、大急ぎで『コメクラ千、コメクラ千』と唱えたところ、たちまち小さな目の見えない人たちが千人現れた。夫婦があっけに取られている間に、千杯の雑炊を食べ、千足の足半草履を履いて、さっさとどこかへ行ってしまった」という話になっている（梅林新市君採集）。

    岡山に伝わる「小盲」の童話などでも、千人の小盲が「飯を食わせろ、三味線を弾こう」と言い、隣の欲張り老人をいじめ通したというふうに語られていた。考えすぎかもしれないが、私には、これは直接その作者の声だったように感じられる。そうでなくても、聴衆は、この話をする当人が小盲だったからこそ、思わずどっと笑い、そのおかしさを長く忘れなかった。それを目の見えない語り手の側でも当てにしていたのである。次の代の子どもたちが、年を取った祖父母から、この滑稽をきわめて鮮明に教え伝えてもらったことも、すでに目の見えない文芸家の計画のうちだった。'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン266）と本文OCRを照合。
  - 足半（あしなか）は足の裏の前半ほどの長さの短い草履。「コメクラ千」は「米・倉、千」と「小盲、千」の語呂合わせ。
  - 原文の歴史的差別語は文脈を保持し、通常は「目の見えない人」等と訳した。障害者の性質を一括りにする評価は著者の当時の見解であり、現代の事実認定ではない。

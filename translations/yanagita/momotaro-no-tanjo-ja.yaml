  section: 隣の寝太郎／六 博打婿入りの事・七 せやみ太郎兵衛
  original: よつて、そのばくち打ちの呑助が金儲けをしたといふことになつて居るのだから、卽ち亦最初は侮り輕しめられて居た者が、實は英雄であつたといふ說話の、進化して來た路筋が窺はれるのである。妻の援助が古くからの要素であつたらしきことは、是から後にも尙說明して見たいと思つて居るが、それとは別に今一つの重要なる援助者があつた。奧州でも宇治拾遺でも、それは博打ち仲間といふことになつて居るけれども、本來はもう少し深い意味あるものの痕跡であるらしいことは、他の類話に於て何が其地位を占めて居るかを、綿密に比較して行けば必ず心付かずに居られぬ。前に瓜子姫の物語に於て、私が動物の援助と言つたのもそれであつた。現に九州沖繩の寢太郞話に於ては、鷺や野鳩が其任務に當つて居る。さうして神佛靈鬼の隱れたる意思を代表したことは、雙方に共通であつたのである。單なる博徒仲間の義理といふだけでは無かつたのである。七せやみ太郞兵衞草子の「物草太郞」が新しい改名であつたことは、別に言語の側からも之を察することが出來る。古語のモノウシが、名詞形のモノウサを中に置いて、モノグサシと謂ふやうになつたことは、少くとも京都に於てはさう古くからの訛誤ではあるまいと思ふが、それが普通になつて後に物草太郞といふ語が起り、その新語の興味は又、改めてこの昔話をして生命あらしめたらしいのである。一寸法師も以前の日本語はチヒサコであつたのが、妙に新語の一寸法師が人氣に投じて、諺にもなれば俳諧の連歌にも用ゐられた時代があつた。昔の赫奕姫にも其後の桃太郎にも、共にこの名稱に由る復活といふものがあつたやうに思ふ。現に今日でも話は大抵この面白い名に於て、記憶し又保存せられて居るのである。出羽の莊內の「せやみ太郞兵衞」の一例は、最近に堀維孝氏の好意によつて知ることが出來た。セヤミは「背病み」であつて我々の「骨惜み」に近く、東北六縣を通じて惰け者の意味に用ゐられる方言である。そのセヤミ太郞兵衞が西日本の寢太郞と同樣に、やはり不思議な事から長者になつたと謂ふのである。昔々せやみ太郞兵衞といふ男があつた。每日々々寢轉んでばかり居て、何一つ働かうともせず、食ふ物の用意をするのも面倒だと謂つて、前の畠にたつた一株の菜が生えて居
  translation: '……よって、その博打打ちで大酒飲みの男が金儲けをしたことになっている。したがって、初めは侮り軽んじられていた者が、実は英雄だったという説話が発展してきた道筋も、うかがえるのである。妻の助力が古くからの要素だったらしいことは、この先でも説明してみたいと思っている。だが、それとは別に、もう一人の重要な助け手がいた。奥州でも『宇治拾遺』でも、それは博打仲間ということになっている。しかし、本来はもう少し深い意味を持っていたものの名残らしいことは、ほかの類話では何がその位置を占めているかを細かく比べていけば、必ず気づかずにはいられない。前に瓜子姫の物語で、私が動物の助力といったのも、そのことであった。実際、九州・沖縄の寝太郎の話では、鷺や野鳩がその役目を果たしている。そして、神仏や霊鬼の隠された意志を代表するという点は、双方に共通していた。ただ博徒仲間の義理というだけではなかったのである。

    七　せやみ太郎兵衛

    草子の「物草太郎」が、新しくつけられた名だったことは、言語の面からも推測できる。古語の「モノウシ」が、名詞形の「モノウサ」を経て「モノグサシ」といわれるようになったのは、少なくとも京都では、それほど古くからのなまりではないと思う。それが一般的になった後で「物草太郎」という名が生まれ、この新しい言葉の面白さが、昔話に改めて命を与えたらしい。一寸法師も、以前の日本語では「チヒサコ」だったものが、新語の「一寸法師」が不思議に人気を集め、ことわざにも俳諧の連歌にも使われた時代があった。昔の赫奕姫にも、その後の桃太郎にも、こうした名前による復活があったように思う。今でも実際、話はたいてい、この面白い名前によって記憶され、保存されているのである。

    出羽の庄内にある「せやみ太郎兵衛」の一例は、最近、堀維孝氏の好意によって知ることができた。「セヤミ」は「背病み」で、私たちのいう「骨惜しみ」に近く、東北六県に共通して、怠け者の意味に使われる方言である。そのせやみ太郎兵衛が、西日本の寝太郎と同じく、不思議な出来事によって長者になったというのである。

    昔々、せやみ太郎兵衛という男がいた。毎日毎日寝転んでばかりいて、何一つ働こうとせず、食べ物の用意をするのも面倒だといって、前の畑にただ一株だけ生えていた菜を……'

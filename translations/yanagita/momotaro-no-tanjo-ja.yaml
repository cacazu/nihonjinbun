  section: 米倉法師／三 蚯蚓の歌・四 盲をからかう話
  original: が平和の裡に完了し、蚯蚓も歌と好い聲とを受取つて滿足して居るといふ形に、話し始めたのは日本の座頭であつたとも見られるからである。實際この昔話の空想は、空から作り出したにしては稍、突飛に過ぎて居た。さうして御伽の役の盲人などといふものは、通例は舊話の作り替を以て能事とし、其聽衆も亦實は丸つきりの新作は好まなかつたのである。文藝の純乎として作者の創案に成るものを、つい近頃までの俗人は「舁いて除けるやうなうそ」と呼んで蔑しんで居た。大抵は今まで聽いて居た話をもつと詳しく知りたい爲に、作り替や後日譚の出るのを豫期して居たのである。所謂演義や踏襲で無い作品といふものは、沙翁にだつて殆と無いといふでは無いか。盲ばかりが剽竊して居たわけでは無いのである。四盲をからかふ話古人は古い趣向の一端を採用することを、別段に惡い事とはして居なかつた。それを氣が咎めるのは良心の洗煉見たやうであるが、實は其部分までも自分の手柄にしようといふ卑しい心が、隱せるだけはそれを隱して居たのであつた。近代の都府の作者たちが、どの程度にまで淡泊に、種の出處を打明けて居たかは私は知らないが、種を古書の中から探して用ゐて居たことのみは事實である。たとへば眼の不自由な者をいぢめたり、からかつたりしたといふ滑稽、是は其作者が盲人自らであり、所謂自嘲の文學である點に意義があつたのだが、そんな事は一向お構ひ無しに、目のちやんとある人生の鸚どもが模倣した。其中でも三馬の浮世風呂の柚の都·柿の都などは、舞臺を錢湯とし相手を生醉にした所にまだ若干の働きはあるといへるが、それだけに又讀者が能の狂言の「猿勾當」を、知らずに居てくれることを祈願した情がよく窺はれる。殊に一九の膝栗毛の鹽井川、犬市猿市の川越しの一條に至つては、餘りにも其叙述が狂言の「どぶかつちり」とよく似て居て、之を古文學の燒直しといぶことすらも難いのである。名を署した記錄の文藝に於てまで、斯んなことをする樣になつて、剽竊は始めて惡事であつた。しかし考へて見ると、彼等の粉本となつて居る狂言記の二篇とても、うぶなる新作書き卸しと見ることは到底出來ない。單にさうした滑稽の話柄が、何度でも夜話の席にくり返されて居たといふに止まらず、折々はあの頃流行の物眞似として、當の盲目等の今一層如實なる
  translation: '〔前のスキャンから続く〕平和のうちに完了し、ミミズも歌とよい声を受け取って満足している、という形で語り始めたのは日本の座頭だった、とも見られるからである。実際、この昔話の空想は、何もないところから作り出したにしては、少し突飛すぎた。そして、話し相手を務める目の見えない人などは、普通、古い話の作り替えを得意とし、その聴衆も実はまったくの新作は好まなかった。純粋に作者の独創からできた文芸を、つい近ごろまでの世間の人は、「担いでどけるような大嘘」と呼んで軽蔑していた。たいていは、それまで聞いていた話をもっと詳しく知りたくて、作り替えや後日談が出るのを期待していたのである。いわゆる演義や先行作の踏襲でない作品は、シェイクスピアにだってほとんどないというではないか。目の見えない人だけが盗用していたわけではないのである。

    四　目の見えない人をからかう話

    昔の人は、古い趣向の一部を採用することを、とくに悪いこととはしていなかった。それを後ろめたく感じるのは、良心が洗練されたように見えるが、実はその部分まで自分の手柄にしようとする卑しい心が、隠せる限りそれを隠していたのだった。近代の都会の作者たちが、どの程度率直に、種の出所を打ち明けていたかは知らないが、古い書物の中から題材を探して用いていたことだけは事実である。たとえば、目の不自由な者をいじめたり、からかったりしたという滑稽な話。これは作者が目の見えない人自身であり、いわゆる自嘲の文学である点に意義があったのだが、そのようなことには少しも構わず、目のちゃんと見える、人生のオウムどもがまねをした。その中でも三馬の『浮世風呂』の柚の都・柿の都などは、舞台を銭湯にし、相手をほろ酔いの者にした点に、まだいくらかの工夫があるとはいえる。しかしそれだけに、読者が能狂言の『猿勾当』を知らずにいてくれることを祈る気持ちが、よくうかがわれる。とくに一九の『膝栗毛』の塩井川で、犬市と猿市が川を渡る一節に至っては、その叙述があまりにも狂言の『どぶかっちり』と似ていて、古文学の作り直しと呼ぶことさえ難しい。名を署名して記録する文芸でまで、このようなことをするようになって、盗用は初めて悪事になったのだった。

    しかし考えてみれば、彼らの手本となった『狂言記』の二篇も、まったく新しい書き下ろしの創作と見ることは到底できない。このような滑稽な話の種が、何度も夜話の席で繰り返されていたというだけでなく、ときには当時流行の物まねとして、当の目の見えない人たちによる、いっそう真に迫った、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン270）と本文OCRを照合。
  - 画像拡大と振り仮名から「舁いて除ける」「人生の鸚ども」を確認し、OCRを訂正。「舁く」は担ぐ、「鸚」はオウムで、後者は模倣者をあざける比喩。沙翁はシェイクスピア。
  - 原文の歴史的差別語は文脈を保持し、通常は「目の見えない人」等と訳した。障害者の性質を一括りにする評価は著者の当時の見解であり、現代の事実認定ではない。

- id: mmt-105-01
  scan: 105
  section: 瓜子織姫／天之探女
  original: '亂しようとしたといふだけで無く、大よそ現存の口碑に於て、アマノジヤクの持たされた役

    割はきまつて居る。それを集めて丁寧に積重ねて見たならば、獨りでに問題は釋けることと

    思ふが、先づ氣がつくのは人間の望む所、さうして又神々の思召しに叶はぬことばかりをす

    るのが彼であつた。曾ては莖一面に附いて居た五穀の實を、しごいて穗先だけにちよつぴり

    と殘したのも、田畠には雜草の種、野山には人の困る茨の種を、播いてあるいたのも彼であ

    つた。其茨の種の播き殘りがまだ多かつたのを、一度に振り散らして行つたといふ土地に、

    今でも茨ばかり茂つた處があり、大豆だけは手が痛くてしごき切れなかつた爲に、今でも元

    の通り下の方にも實がなるといふ話もある。それだからアマノジヤクは百姓の讐であると謂

    つて、九州の方では毘沙門天、東國では又路の傍の庚申さんが、足の下に踏付けて居られる

    醜い石の像を、彼だと思つて居る者は多いのである。是は勿論大昔以來の、言ひ傳へのまゝ

    では無いであらうが、何か基づく所が無かつたら、話が斯ういふ風に展開して行くことは恐

    らくは六つかしかつた。

    其アマノジヤクの特色ともいふべきものを、私は三つほども指點することが出來る。一つに

    は彼の所行といふものが、いつの場合にもぶち壞しであり、又は文字通りの邪魔であつて、

    未だ曾てシテの役にはまはつたことが無く、相手無しには何事をも企てて居ないことであ

    る。次には彼の存在がたゞ興味ある語りごとの中にのみ傳はつて居ることと、それからもう

    一つは其事蹟が、憎らしいとは言ひながらも常に幾分の滑稽を帶びて居たことである。近世言

    ひ始めたものでは貧乏神などが似た例ではあるが、是は明らかに我々の考へて居る神といふ

    ものから遠いのみならず、妖恠鬼魅としても亦決して純なものではなかつた。最初此名の人

    に知られた際には、或はもう少し眞面目に怖ろしく、又は謹愼して仕へなければならぬ靈で

    あつたらう、といふ想像は成立つかも知らぬが、少なくとも記錄の保存せらるゝ限りでは、

    天之探女は單なる說話の上の假設敵であつた。以前の神態が特にさういふ人物を作り設けて、

    語りごとの印象を深からしめたもの、卽ち又一種の「鄰の爺」であつたらしいのである。諸國

    に數多く殘つて居る一夜工事の傳說に、神が鷄の聲を眞似て鬼の計畫を中止せしめられたと

    いふのがあるかと思ふと、又一方にはそれと反對に、神や偉人の世に幸ひせんとする企てを、

    アマノジヤクが欺いて妨げたといふことにもなつて居るのは、可なり有力な暗示のやうに私'
  translation: '乱そうとしたというだけでなく、現在残る口伝の中で、アマノジャクに割り当てられた役目は、おおむね決まっている。それらを集めて丁寧に積み重ねてみれば、問題は自然に解けると思う。まず気づくのは、人間の望みにも、神々のお心にもかなわないことばかりするのが、アマノジャクだったということだ。かつては茎全体についていた五穀の実をしごき落とし、穂先だけにほんの少し残したのも、田畑には雑草の種、野山には人を困らせる茨の種をまいて歩いたのも、彼だった。茨の種がまだたくさん残っていたので、一度に振りまいていったという土地には、今も茨ばかり茂る場所がある。また、大豆だけは手が痛くてしごき切れなかったので、今も元どおり下の方にも実がなる、という話もある。そのため、アマノジャクは農民の敵だといい、九州では毘沙門天、東国では道端の庚申様が足下に踏みつけている醜い石像を、アマノジャクだと考える人が多い。もちろん、これは大昔以来の言い伝えがそのまま残ったものではないだろう。しかし、何か根拠がなければ、話がこう展開していくのは、おそらく難しかった。

    アマノジャクの特徴と呼べるものを、私は三つほど指摘できる。第一に、その行いはいつでもぶち壊し、または文字どおりの邪魔であり、一度も主役に回ったことがなく、相手なしには何事も企てないこと。第二に、その存在が、面白い語り物の中だけに伝わっていること。そしてもう一つは、その行いが憎らしくはあっても、常にいくらか滑稽さを帯びていることだ。近世に語られ始めたものでは、貧乏神などが似た例だが、これは明らかに、私たちの考える神からかけ離れているだけでなく、妖怪や鬼魅としても、決して純粋なものではなかった。最初この名が人に知られたときには、もっと真剣に恐れられたり、慎んで仕えなければならなかったりする霊だったのだろう、と想像することはできるかもしれない。しかし、少なくとも記録が残っている範囲では、天之探女は、単に説話のために設けられた敵役だった。以前の神のわざの語りが、特にそのような人物を作り出して話の印象を深めたもの、つまり一種の「隣の爺」だったらしい。

    諸国に数多く残る、一晩で工事をするという伝説には、神が鶏の声をまねて鬼の計画をやめさせたというものがある。その一方では反対に、神や偉人が世の中を幸せにしようとする計画を、アマノジャクがだまして妨げたことにもなっている。これはかなり有力な手がかりのように私'
  notes:
  - 冒頭はscan104、末尾はscan106へ続く。
  - シテは能などの主役の呼称。ここでは物語を主体的に動かす役を意味する。
  - 原文の「神態」には「かみわざ」の振り仮名がある。

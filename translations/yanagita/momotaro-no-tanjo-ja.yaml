  section: 隣の寝太郎／妻に助けられて
  original: 手を愚にしたもので、言はば此樣な存在を無視する者の假構としか見えぬのだが、それが尙なまけ者立身の古來の樣式から、全然超越した自由の作品とは言へなかつたのである。狸を茶釜や太鼓などに化けさせて、賣つて金にしたといふ話はやゝ複雜だから、一括して其由來を說くことは見合はせる。通例我々の名けて寶物交換譚といふものにも、其相手の天狗や狐が損をして泣悲しみ、又は自滅したといふのを結末とするものは除いて、他の一方の寶物を手に入れた人が、それから如何したかといふことを說く話にも、二通りの種類があつて共に最後には「鄰の爺」の失敗をして居るのは、つまりは此說話が夙くから、たゞ滑稽談としてのみもて囃されて居た結果である。然るに斯うした大笑ひの話の中にも、まだ主人公の幸福なる婚姻といふ點が保存せられて居た。たとへば一方の横着な碌で無しが、狐天狗を騙して捲き上げた寶物が、朱色の篦であつたり羽團扇であつたりした場合にも、是で人間の鼻をそつと煽ぐと幾らでも鼻が高くなる。または尻を撫でると際限も無く尻が歌をうたふ。それを又逆さに使ふと鼻は低くなり、もしくは尻の音がはたと止む。橫着者はこの寶物の力を借りて、先づ長者殿の娘を困らせ、後に之を治して遣る約束で、うま〳〵と聟になつてしまふといふことになつて居る。今一つの方の話は其寶物といふのが、隱形自在の隱れ蓑笠であつた場合だが、是にも亦偶然ならず、一人の女性が參與して居るのである。土地によつて少しづつの差異は出來て居るが、詳しく說述するの必要も無い程に、多くの靑年は今でも此話を記憶して居る。主人公は通例始末にいけない博徒であつた。それが負けて丸裸になつて歸つて來る路で、是だけは身を離さなかつた一つの賽ころを取出し、何度も轉がして見ては一人で勝手な空想をしやべつて居る。それを高い樹の上からぢつと視て居た天狗が、つい釣込まれて降りて來て所望する。さうして博徒の出鱈目を眞に受けて、大切な隱れ蓑と交易してしまふと、此方は早速其蓑を着用して、もう何處に居るか姿は見えない。失望落膽して天狗殿は歸つて行き、博徒は隱形の術によつて、したい放題な事をしてあるく。信州北安曇郡に行はれて居る一例に於ては、今まで少しも働かずに居た男が、急に朝早くから家を出て、遲くまで外で働くやうになつたので、女房が不審をして氣を付けて居ると、時々簞笥を明けてはにこにこと悅んで居る。是はをかしいと思つて留守に行つて見たといふ點は、奥州のヨケナイ話などとも似て居る。さうしてこの汚ならしい蓑笠は何だと、取出して燒いてしまつたといふ
  translation: '……愚かに扱ったもので、いわばこうした存在を認めない人の作り話としか見えない。それでもなお、怠け者が出世するという昔からの型を完全に超えた、自由な作品とはいえなかったのである。狸を茶釜や太鼓などに化けさせ、売って金にした話は、やや複雑なので、まとめてその由来を述べるのは控える。

    普通、私たちが宝物交換の話と呼ぶものでも、相手の天狗や狐が損をして泣き悲しんだり、自滅したりすることを結末とするものは、ひとまず除こう。もう一方の、宝物を手に入れた人がその後どうしたかを語る話にも、二通りある。それがどちらも、最後には「隣の爺」のような失敗をしているのは、この説話が早くから、ただの滑稽な話としてばかり好まれた結果である。ところが、こうした大笑いする話の中にも、まだ主人公の幸せな結婚という点が保存されていた。

    たとえば、ずるいろくでなしが狐や天狗をだまして巻き上げた宝物が、朱色のへらや羽団扇だった場合である。これで人の鼻をそっとあおぐと、いくらでも鼻が高くなる。または尻をなでると、際限なく尻が歌を歌う。それを逆向きに使うと、鼻は低くなり、あるいは尻の音がぴたりと止まる。ずるい男は、この宝物の力を借り、まず長者の娘を困らせ、その後、それを治してやるという約束で、まんまと婿になってしまうのである。

    もう一つのほうは、その宝物が自由に姿を隠せる隠れ蓑・笠だった場合だが、こちらにも偶然ではなく、一人の女性が関わっている。土地によって少しずつ違いはあるが、詳しく説明する必要もないほど、多くの青年は今でもこの話を覚えている。主人公はたいてい、手に負えない博徒だった。博打に負け、身ぐるみを失って帰る途中、これだけは手放さなかった一つのさいころを取り出し、何度も転がしては、一人で勝手な空想をしゃべっている。それを高い木の上からじっと見ていた天狗が、つい誘い込まれて下りてきて、欲しがる。そして博徒のでたらめを真に受け、大切な隠れ蓑と交換してしまう。すると男は、さっそく蓑を着て、もうどこにいるのか姿が見えない。がっかりした天狗殿は帰っていき、博徒は姿を隠す術によって、したい放題にして歩く。

    信州北安曇郡に伝わる一例では、それまで少しも働かなかった男が、急に朝早くから家を出て、遅くまで外で働くようになったので、妻が不審に思って気をつけていると、ときどき箪笥を開けては、にこにこ喜んでいる。おかしいと思い、留守中に見にいったという点は、奥州のヨケナイの話などにも似ている。そして、「この汚らしい蓑・笠は何だ」と、取り出して焼いてしまったという……'
  notes:
  - 冒頭はscan170末尾に続く。末尾「焼いてしまったという」は担当外scan172冒頭「のである。」に続く。scan172の内容は本unitに重複収録していない。
  - ヨケナイは原文の話名・地域的呼称を保持した。

  original: 'は共通する點である。何か今日の智識ではまだ解し得ない關係が、海と少童との間には有

    つたものと想像して、此點を私などは最も重要なる一つに算へて居るのである。但しどうい

    ふ風にして貰つて來たかの手續きに於ては、この玉名郡のハナタレ小僧樣だけが、可なり著

    しく他の四つとは異なつて居る。岩手縣の方の昔話では、何れもその禮を叙べた美女に案內

    せられて、水の底又は穴の中へ御客に行くことになつて居り、其中でも江刺郡の二つは共に

    歸りしなに、見にくい小兒を無理やりに連れて行けと言つて、押付けられたので貰って來た

    ことになつて居る。紫波郡の方は前以てその同行の女性が、何か土產物を遣らうと言はれた

    ら、必ず子供を下さいと答へよと教へてくれたことになつて居る。山本氏採集の肥前島原半

    島の話などは、この最後のものと殊に近くして、しかも其變化は更に一段と奇拔であつた。

    卽ち小さな子を所望する代りに、黑猫を下さいと言つて貰つて來るのであるが、是も後にな

    つて利用の條件を背いた者が、失敗をしたといふだけは略〻同じである。

    兎に角に五つある話の四つまでが、此方から龍宮又は地下の國へ出かけて、貰つて來たこ

    とになつて居るに反して、ハナタレ小僧樣だけは女が子を抱いて來て手渡しする。さうして

    是とよく似た昔話は、別に產女の話として弘く行はれて居るのである。產女の話は以前も少

    しく說いて見たことがあるが、大體に早くから二通りに分れて居たやうである。卽ち其一つ

    は通行人に向つて、此子を抱いてくれといふから抱いて居てやると、後に木の葉に變じ、又

    は石地藏になつた。多分惡い狐などの所爲であつたらうといふ、結末のあまり面白くない例

    で、それも今昔物語に旣に出て居るのだから、決して新らしい變化では無いのである。併し

    第二のものはもう一段と古い形で、普通の人ならばとても我慢が出來ない程に、抱き取つた

    赤兒の重くなるのを、賴まれた者が正直者であり信心者であり、又は勇士名僧などであつた

    爲に、ぢつと辛抱して女の歸つて來るまで抱いて待つて居ると、非常に喜んで厚く禮を叙べ

    且つ報酬をくれる。其報酬は取れども盡きぬ金財布などであつた場合と、其家に遺傳する大

    力の筋であつた場合と、又二つに分れて居るのである。この產女が現はれたといふ場處も、

    往々にして淵の上や池の堤、又は橋の袂などと言つて、どうやら水の神と緣が有つたらしい

    のであるが、是までの人たちは其一致には心付かなかつた。ところが斯ういふハナタレ小僧

    以下の例が出て來た御蔭に、その赤子の雙方同じものであつたことが、少しばかり判りかけ'
  translation: 'は共通している点である。海と幼い子供の間には、今日の知識ではまだ理解できない何らかの関係があったのだろうと想像して、私はこの点を、最も重要な点の一つに数えている。ただし、どういう手順でもらってきたかという点では、この玉名郡のハナタレ小僧様だけが、ほかの四例とはかなり大きく異なっている。岩手県の昔話では、どれも礼を述べた美女に案内され、水底や穴の中へ客として行くことになっている。中でも江刺郡の二例は、どちらも帰りがけに、醜い子供を無理に連れていけと押し付けられたので、もらってきたことになっている。紫波郡のほうでは、同行する女性があらかじめ、何か土産をやろうと言われたら、必ず子供をくださいと答えるよう教えてくれた、とされる。山本氏が採集した肥前島原半島の話などは、この最後の例にとくに近いが、変化はさらに一段と意外である。つまり、小さな子を望む代わりに、黒猫をくださいと言ってもらってくるのだが、これも後になって、利用するための条件に背いた者が失敗したという点だけは、ほぼ同じなのである。

    ともかく、五つの話のうち四つまでが、こちらから竜宮や地下の国へ出かけてもらってきたとするのに対し、ハナタレ小僧様だけは、女が子供を抱いてきて手渡す。そして、これによく似た昔話が、別に産女の話として広く伝わっている。産女の話は以前も少し説明したことがあるが、おおむね、早くから二通りに分かれていたようだ。一つは、通行人に、この子を抱いてくれと頼むので抱いていてやると、後に木の葉や石地蔵に変わった。多分、悪い狐などの仕業だろうという、結末があまりおもしろくない例である。それもすでに『今昔物語』に出ているのだから、決して新しい変化ではない。しかし、第二のものは、さらに一段と古い形である。抱き取った赤ん坊が、普通の人には到底耐えられないほど重くなるのだが、頼まれた人が正直者や信心深い人、あるいは勇士や名僧だったため、じっと辛抱して、女が帰ってくるまで抱いて待っている。すると女が非常に喜び、厚く礼を述べて報酬をくれる。その報酬は、取っても尽きない金の財布などだった場合と、その家に代々伝わる怪力の血筋だった場合との、さらに二つに分かれている。この産女が現れたという場所も、しばしば淵の上や池の堤、あるいは橋のたもとなどとされ、どうやら水の神とつながりがあったらしい。ところが、これまでの人々はその一致に気づかなかった。しかし、このハナタレ小僧以下の例が見つかったおかげで、両方の赤ん坊が同じものだったことが、少しずつわかりかけ'

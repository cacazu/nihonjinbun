  section: 海神少童
  original: 'が深く一日にたつた三度しか金粒の出ないのをもどかしがり、是も爺の不在中に童子をつれ

    て來て、火箸でやたらに其臍を突いたので死んでしまつたといふのは、よほど又肥前の黑猫

    の方に近くなつて居る。但し後者に於ては心得ちがひをしたのは婆に非ず、平生貧しい妹に

    親切で無かつた富める姉であつた。是も花咲爺の如く强ひて其猫を貸せといふから貸して遣

    ると、一度に多くの黄金をひり出させようとして、小豆を一升も食はせたら猫は死んでしま

    つてか。それを本主の妹が悲しがつて、死骸をもらつて來て屋敷内に埋めてやつたところが、

    其の土から橙の木が生えて美しい實がなつた。是が正月に此果實を飾り物にする由來だと

    いふ點は、やはり亦白狗を埋めた處からコメの木が生えて大木となり、それを臼に窪めて物

    を搗くと、金銀が涌き出したといふ花咲爺の昔話と、全く聯絡の無い言ひ傳へでも無かつた

    のである。

    花咲爺ではその寶の臼も亦鄰の爺に借りられ、金を出さないので割られて竈の下で焚いて

    しまはれる。さうすると其灰が更に善い爺樣に利用せられて、又しても大きな幸運を齎らし

    たのである。是は興に乘じて稍、奔放に過ぎたる改造であつたかも知れぬが、尙その中間に

    死んで竈の神に祭られたといふ火男童子の話を置いて考へると、雙方の起りの至つて近いも

    のであつたことはわかるのである。但し私たちの研究方法に於ては、强ひて其樣な處に力瘤

    を入れる必要は無い。それよりも他に今一つ、是まで世人の心付かずに居た類似が、遠く南

    方海上の島々にもあつたといふことに、注意して置く方が大事である。故佐喜眞興英君が採

    集して置いてくれた南島說話の中に、次のやうな一話がある。

    昔沖繩の島に二人の兄弟があつた。兄は不孝者で親の祭を粗末にし、弟は孝行者でいつ

    も墓に參つて、懇ろなる供養をした。或日も常の如く酒と香とを供へて親の祭をして居

    ると、不意に墓の中から一疋の犬が飛出した。それを家に連れて來て、一合の飯を食はせ

    ると、其犬は黄金の糞をする。それが每日つゞいたので弟は金持になつた。兄は之を羨

    んで犬を借りて行き、決して一合より多く食はせてはいけないと、弟が固く戒めて置い

    たにも拘はらず、一度に澤山の金を得ようといふ慾心から、一升の飯を炊いで無理に食

    はせると、犬は食ひ過ぎて死んでしまつた。之を悲しんで犬の骸を引取つて庭に埋めた

    ところ、一本の木がそこから成長して黄金の實を結んだ。是が今でもクガニー(こがね)'
  translation: '深く、一日にたった三度しか金粒が出ないのをじれったく思い、やはりおじいさんの留守に子供を連れてきて、火箸でむやみにへそを突いたので死んでしまったという。この点では、むしろ肥前の黒猫の話にかなり近くなっている。ただし後者で思い違いをしたのは、おばあさんではなく、日頃貧しい妹に親切でなかった、金持ちの姉だった。これも花咲か爺のように、無理に猫を貸せと言うので貸してやると、一度にたくさんの黄金をひり出させようと、小豆を一升も食べさせ、猫は死んでしまった。それを元の飼い主である妹が悲しみ、死骸をもらって屋敷内に埋めてやると、その土から橙の木が生え、美しい実がなった。これが正月にこの果実を飾り物にする由来だという点は、やはり、白犬を埋めたところからコメの木が生えて大木となり、それをくりぬいて臼にして、物をつくと金銀が湧き出したという、花咲か爺の昔話と、まったく無関係な言い伝えでもなかったのである。

    花咲か爺では、その宝の臼もまた隣のおじいさんに借りられ、金が出ないので割られて、竈の下で燃やされてしまう。すると、その灰をさらに善良なおじいさんが利用して、また大きな幸運を得た。これは、おもしろさに乗って、やや自由に変えすぎた改作だったかもしれない。それでも両者の間に、死んで竈の神として祭られたという火男童子の話を置いて考えれば、両方の起こりがきわめて近かったことはわかる。ただし、私たちの研究方法では、無理にそうした点へ力を注ぐ必要はない。それよりも、これまで人々が気づかなかったもう一つの類似が、遠い南の海上の島々にもあったことに、注意しておくほうが大切である。故・佐喜眞興英君が採集してくれた『南島説話』の中に、次のような一話がある。

    昔、沖縄の島に二人の兄弟がいた。兄は不孝者で親の祭りをおろそかにし、弟は孝行者で、いつも墓に参って丁寧に供養した。ある日も、いつものように酒と香を供えて親を祭っていると、突然、墓の中から一匹の犬が飛び出した。その犬を家へ連れ帰り、一合の飯を食べさせると、黄金の糞をした。それが毎日続いたので、弟は金持ちになった。兄はうらやんで犬を借りていった。決して一合より多く食べさせてはいけない、と弟が固く言い聞かせておいたにもかかわらず、一度にたくさんの金を得たいという欲から、一升の飯を炊いて無理に食べさせると、犬は食べすぎて死んでしまった。これを悲しみ、犬の死骸を引き取って庭に埋めると、そこから一本の木が育ち、黄金の実を結んだ。これが今でもクガニー（こがね）'

  section: 狼と鍛冶屋の姥
  original: があるのみである。是は後の方にまはして先づ伯州の話を引用すると、むかし米子の山臥が狼の群に襲はれて、大木の梢に上つて其難を避けると、二三十匹の狼が背繼ぎをして登つて來たけれども屆かない。もう一匹だけ足りぬ、五郞太夫婆を喚びに遣れといひ、やがて遣つて來て先頭に立つたから、脇差を拔いて其大狼を斬ると、一同は退散してしまつた。翌朝里に出て五郞太夫の家に行つて見ると、婆は木から堕ちて怪我をしたと稱し、人々が疑ひを掛けて居るうちに行方知れず云々。とあつて是はたしかに其婆も狼になつて居る。雜誌「民族と歷史」七卷五號に、瀨戶源藏氏の報告したのは、若狹と越前との境の山、椿峠の中の曲り、三本松といふ處の傳說であるが、刀禰の婆と呼ばれて後から來て斫られたのは、大さ犢ほどある銀毛の怪獸とあつて、果して狼の年經たものだつたか否か、どうも十分に明瞭とは言へず、茲より遠からざる近江柳ヶ瀨峠の虎が婆の傳說は、是と同じだと同誌八卷三號に報ぜられて居るが、是は鄕土研究三卷十一號の福田文月君の說に依れば、古く柳ヶ瀨村の狼神社の由來として傳へられたもので、始め梯子になつて登つて來たのは狼連であつたけれども、招かれて後から手助けに來た太郞婆だけは、古猫の姿に化けて居たのであつたといふさうである。婆が狼であり又猫であることに由つて、話を二種別々のものだといふことは勿論出來まい。しかも此二つが雙方一齊に出現するといふことも有り得ないから、今はまだ斷言は六つかしい迄も、何れか一つが先に行はれて、後に理由があつて他の一つに、改まつたことだけは推定しないわけには行かぬ。人が狼の姿になつて飛廻つて害をした話は、西洋では餘りにも有名な奇聞である故に、或は幾分か高木君たちの先入主を養つたかとも思はれるが、日本に於ては其方の例は殆と絕無、狼が人に化けて居たといふのも此以外には稀であるから、私は猫の婆の方が前では無かつたかと考へて居る。さうして其證據とは言はれぬまでも、多少の參考になりさうな材料は色々ある。消極的には山中分娩の話が土佐以外には無いこと、積極的には鍋を被つて刄を防いだといふ話が、土佐の場合にも伴なうて居るといふことなどは、其中でも是非とも其理由を尋ねて見なければならぬ點である。三　鍋被りと茶釜の蓋
  translation: 'があるだけである。これは後に回し、まず伯州の話を引用すると、次のようになる。

    昔、米子の山伏が狼の群れに襲われ、大木の梢に登って難を避けた。すると二、三十匹の狼が背中を継ぐようにして登って来たが、届かない。「もう一匹足りない。五郎太夫婆を呼びにやれ」といい、やがて来た狼が先頭に立った。山伏が脇差を抜いてその大狼を斬ると、一同は退散してしまった。翌朝、里へ出て五郎太夫の家へ行ってみると、婆は木から落ちてけがをしたと言っており、人々が疑っているうちに行方不明になった、云々。

    このように、こちらでは確かにその婆も狼になっている。雑誌『民族と歴史』七巻五号に瀬戸源蔵氏が報告したのは、若狭と越前の境の山、椿峠の途中の曲がり角にある三本松という場所の伝説である。しかし「刀禰の婆」と呼ばれて後から来て斬られたのは、子牛ほどの大きさの銀色の毛を持つ怪獣とあって、本当に年老いた狼だったのか、どうも十分に明らかとはいえない。ここから遠くない近江柳ヶ瀬峠の「虎が婆」の伝説も、これと同じだと同誌八巻三号に報告されている。だが『郷土研究』三巻十一号の福田文月君の説によれば、これは古くから柳ヶ瀬村の狼神社の由来として伝わったもので、初めに梯子になって登って来たのは狼たちだったが、招かれて後から手助けに来た太郎婆だけは、年老いた猫の姿に化けていたという。

    婆が狼であったり猫であったりするからといって、もちろん話を別々の二種類とみなすことはできないだろう。しかし、この二つが同時に現れたとも考えられないので、今はまだ断言が難しくても、どちらか一つが先に行われ、後に理由があってもう一方に変わったことだけは、推定せざるを得ない。人が狼の姿で飛び回って害を加えた話は、西洋ではあまりに有名な怪異譚なので、それが高木君たちの先入観を多少育てたかもしれない。だが日本ではそのような例はほとんどなく、狼が人に化けていたという話も、これ以外ではまれである。だから私は、猫の婆のほうが先だったのではないかと考えている。そして、その証拠とはいえなくても、ある程度参考になりそうな材料はいろいろある。消極的な材料としては、山中で出産する話が土佐以外にないこと。積極的な材料としては、鍋をかぶって刃を防いだという話が土佐の例にも伴っていることなどが、とりわけその理由をぜひ探ってみなければならない点である。

    三　鍋かぶりと茶釜のふた'

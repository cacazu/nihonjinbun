  original: 五　高木加門の妻土佐と越前との狼女房の傳說に於て、又一つ不當に看過せられて居る特徴がある。佐喜濱の鍛冶屋は今では屋敷迹だけであるのに、子孫代々背中に毛が生えて居たと傳へられて居る。越前でも菖蒲池の孫右衞門方では、代々の子孫背筋に狼の毛が生えて居たさうだと記してある。無論先代の家刀自が狼であつたからといふのであらうが、是は退治せられたといふ事と、如何にも兩立し難い言ひ傳へであつた。緒形の一門では東國に移住した者の末までが、土地で本家と立てられる者の限りは、何れも身の內に鱗に似た痣があるだの、一部分ざら〳〵としたところが有るだのといふ噂を、格別迷惑がりもせずに承認して居たのは、古い信仰の名殘であつた。池の主に見込まれて嫁入をした娘の家などといふのが、今でも存外に知られて榮えて居るのは、是も所謂龍婚蛇婚に對する前代の考へ方が別であつたからである。最初からかち〳〵山の狸同然の言ひ傳へであつたなら、假に其怪物に實子があつたとしても、斯ういふ噂は公けには否認せられたであらう。だから私は右兩地の傳說が、曾ては今あるものと大分異なつて居たことを、是によつて推測しようとするのである。それには丁度似つかはしい類例が一つある。但馬は越前と色々の點に於て、關係の深かつた國であるが、彼處には養父郡の宿南村といふ處に、加門塚の傳說なるものが殘つて居る。現在民間に流布する形は、自分にはまだ確める機會が無い。加門記といふ一册の記錄があつて、是は稗史風に書き伸ばしてあるが、大要は其中からでも窺はれる。高木加門といふ鄕士の妻、或時山路に於て穽にかゝつた狼の命を助けて遣つたところが、狼は之を德として其女の死後、繼母を喰ひ殺して其姿を假り、苛められて居た先妻の子を愛撫する。それから色々の葛藤があつて後、突如として例の犬梯子の事件が起るのである。或一人の武者修行の士、夜中狼の群に襲はれて樹に登つて之を避けると、狼は肩車をして迫り來つたが、一匹分だけ屆かぬ。それでは加門殿のかみ樣を呼んで來いと謂つて、遣つて來たのが古狼であつた。それを樹上に待受けて斬殺し、やがて高木家を訪ねて始めて狼が母に化けて居たことを知つた。その狼を葬つたのが加門塚といひ、是は實子で無いから無論背筋の毛の話は無いのである。加門記には名刀の紛失などといふ趣向があつて、どこ迄が筆者の文藝であるのか、又どれ
  translation: '五　高木加門の妻

    土佐と越前の狼女房の伝説には、もう一つ、不当に見過ごされている特徴がある。佐喜浜の鍛冶屋は今では屋敷跡しかないのに、その子孫には代々、背中に毛が生えていたと伝えられている。越前でも菖蒲池の孫右衛門の家では、代々の子孫の背筋に狼の毛が生えていたそうだと記されている。もちろん先祖の主婦が狼だったからというのだろうが、これは退治されたということとは、どうにも両立しにくい言い伝えであった。緒形一族では、東国へ移住した人々の子孫まで、その土地で本家とされる家であるかぎり、どこも体に鱗のようなあざがあるとか、ざらざらした部分があるとかいううわさを、とくに迷惑がることもなく認めていた。これは古い信仰の名残だった。池の主に見込まれて嫁入りした娘の家などというものが、今でも案外よく知られ、栄えているのは、やはり竜や蛇との婚姻に対する昔の考え方が、今とは異なっていたからである。初めから『かちかち山』の狸と同じような伝承だったなら、仮にその怪物に実子がいたとしても、このようなうわさは公には否定されただろう。だから私は、この二つの土地の伝説が、かつては現在のものと大いに違っていたと、この点から推測しようとしている。

    それにちょうどふさわしい類例が一つある。但馬はさまざまな点で越前との関係が深い国だったが、その養父郡の宿南村という場所に、「加門塚」の伝説が残っている。現在民間に広まっている形を、私はまだ確かめる機会がない。『加門記』という一冊の記録があり、小説風に書き広げられているが、大筋はそれからでもわかる。高木加門という郷士の妻が、あるとき山道で落とし穴にかかった狼を助けた。狼は恩義を感じ、その女の死後、継母を食い殺してその姿を借り、いじめられていた先妻の子をかわいがる。その後、さまざまな葛藤があってから、突然、例の犬梯子の事件が起きるのである。ある武者修行の武士が夜中に狼の群れに襲われ、木に登って避けると、狼は肩車をして迫ってきたが、一匹分だけ届かない。「それでは加門殿の奥様を呼んで来い」といい、やって来たのは老狼だった。木の上で待ち受けて斬り殺し、その後高木家を訪れて、初めて狼が母親に化けていたと知った。その狼を葬った場所が加門塚だといい、こちらは実子ではないから、もちろん背筋の毛の話はないのである。『加門記』には名刀の紛失などの趣向もあり、どこまでが筆者の創作で、どれ'
  notes:
  - 「緒形」は原画像の表記。身体的特徴を家系と結び付ける説は、伝説・当時の信仰の記述であり、生物学的事実を示すものではない。
  - 「郷士」は在郷の武士。

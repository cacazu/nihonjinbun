  section: 桃太郎の誕生／二 民譚二種
  original: 內に於ても非常な變化發達を遂げ、しかも其經路が今も尙大よそは跡づけ得られる。たとへば幼少な者が笑ひそゞろいて聽く猿聟入のをどけた話から、遠くは三輪山箸墓の傳說と、筋の續きを認められる敬虔な或舊家の昔語りまで、現に其進化の中間の十數階段が、地を接して同時に併存して居るのである。神話に關する學問は、將來この採集が進み比較が容易になり、同時にどれが古く、どれが新らしく其次に變つたのかを測る爲の、一定の尺度が具はるに至つて、徐ろに改造せらるゝことと私などは信じて居る。今日の所謂神話學は、言はば今集まつて來た民間說話の中に、交つて傳はつて居る神話的分子を取扱つて居るので、必ずしも神話でも無い昔話を研究の對象として、是が神話であると强辯しようといふのでは無いが、たまたま二者の分堺を明かにすることを怠つた結果、何だか異樣なる言葉の用ゐ方、たとへば國の歷史を神話と言つて見たり、さうかと思ふと桃太郞やかち〳〵山の類までを、神話の大系にさし加へたりする者を生じたのである。語原から言つても、神話(ミート)は本來神聖なものであつた。定まつた日時に定まつた人が定まつた方式を以て之を語り、聽く者が悉く之を信じ、もしくは信ぜざる者の聽くことを許されぬ古風の說話であつた。それとこの退屈な時に又は人が耳を樂しましめたい時に、隨意に所望し得た話の藝術と、二者が類を同じくせざることは誰にでもわかり切つて居る。たゞ耶蘇教國の人々だけは、從來文化は平押しに、新しいものが進み古いものが退いたと解して居た故に、說話時代の神話を認めることが出來ず、ましてや神話時代にも旣にあつた民間說話などは、之を想像して見ることも出來なかつた。さうして昔話が神話の孫子であることをのみ、たゞひた向きに信じたがつたのであるが、假に孫子であつたとしても、同人で無い以上はちがつた閱歷を持つて居る筈である。だから之を混同してよろしいなどとは一人だつて言つては居ない。他に方法が無いなら是に由つて、彼を尋ねようと言つて居ただけである。ところが我々の生れた國に於ては、今でもまだこの二つのものが、それと因緣の深い「傳說」と、三つ巴になつて交錯して居る。勿論その三つの中でも神話だけは、數も少なく出現の機會も稀であり、又非常に荒れすさみ且つ不純になつては居るが、兎に角に是から傳說と民間說話へ、移り動いて往つた足取りだけは見られる。それにはこの異類求婚譚、其中でも殊に蛇の聟入の話などが、可なり豐富に手頃の材料を供するかと思ふ。私は此說話を整理す
  translation: '……中でも非常に大きな変化と発達を遂げており、しかもその経路は今なおおおよそたどれる。たとえば幼い子どもが大笑いしながら聞く「猿婿入り」の滑稽な話から、遠くは三輪山の箸墓伝説と筋のつながりが認められる、ある旧家の敬虔な昔語りに至るまで、変化の途中にあたる十数段階の姿が、現に隣り合った土地に同時に存在しているのである。神話を研究する学問は、将来こうした採集が進んで比較しやすくなり、同時にどれが古く、どれが新しく次に変化したものなのかを測る一定の尺度が備わるにつれて、しだいに作り変えられていくだろうと私は信じている。今日いわゆる神話学は、いわば、今集まってきた民間説話の中に混じって伝わっている神話的な要素を扱っているのである。必ずしも神話とはいえない昔話を研究対象にして、これこそ神話だと無理に主張しようとしているわけではない。だが、両者の境界を明らかにすることを怠った結果、どこか奇妙な言葉の使い方をする者が現れた。たとえば国の歴史を神話といったかと思えば、桃太郎やかちかち山のようなものまで神話の体系に組み込むのである。語源からいっても、神話（ミート）は本来、神聖なものだった。決まった日時に、決まった人が、決まった方式で語り、聞く者はみなそれを信じる、あるいは信じない者には聞くことが許されない、古風な説話だった。それと、退屈なときや、耳を楽しませたいときに自由に求められる物語の芸術とでは、種類が違うことは誰にでもわかる。ただ、キリスト教国の人々だけは、従来、文化は一律に、新しいものが進んで古いものが退くと理解していたため、説話の時代にある神話を認めることができず、まして神話の時代にもすでに存在した民間説話など、想像することもできなかった。そして昔話は神話の子孫だということばかりを、ひたすら信じたがった。しかし、たとえ子孫だったとしても、同じものではない以上、違った経歴をもつはずである。だから、これらを混同してよいなどとは、一人もいっていない。ほかに方法がないのなら、昔話によって神話を探ろうといっていただけなのである。

    ところが私たちの生まれた国では、今もまだ、この二つのものが、それと縁の深い「伝説」とともに、三つ巴になって交錯している。もちろん三つのうち、神話だけは数が少なく、現れる機会もまれで、しかも非常に形が崩れ、ほかのものが混じってはいる。それでも、神話から伝説と民間説話へと移っていった足取りだけは見られる。そのためには、この異類求婚譚、なかでも特に「蛇の婿入り」の話などが、かなり豊富で扱いやすい資料を提供すると思う。私はこの説話を整理す……'

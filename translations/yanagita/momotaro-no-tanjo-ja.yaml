  section: 和泉式部の足袋／八 横山の禰宜
  original: では小町の作であつた如く、和泉清少のえのこ草の歌にも、小野氏は亦參與して居たのである。歌を中心とした物語に長じた者が、此一門の流れを汲む女性の中からも輩出し、又巡國して居たらしい形跡は可なり著しいのである。現在知られて居る足袋の發明者は、和泉式部と矢矧の長者の女との他にはまだ無いが、是がさうなつてしまつた事情はほんの偶然であつて、その他に多くの非凡なる童女が、人間の婦人を母とせず、異常の誕生を以て世に現はれた話は、竹の中の赫耀姫以來久しく續いて居る。その異常の童女を有名ならしめた理由、卽ち男の武勇に對立して、女を高名優越ならしめたものは、美貌の他には「さかしい言葉」であつた。然るに小野氏の兩女は今日の俗傳によれば、共に此條件を具足して居る。故に其子孫の是を永く世に傳へんとするものが、行く先々でまだどの樣な珍らしい語りごとを作り、且つ面白く之を流布して居るかは測り知り難いのである。だから採訪は今後の事業であり、比較は尙幾つかの材料の出現に待たなければならぬ。私などの研究は實はたゞ不安全なる豫言に過ぎぬ。如何なる達見博識の士でも、目下の乏しい實例に由つて斷定をしようとする者は、如何に名乘らうとも決して我々の同志では無いのである。
  translation: 〔前のスキャンから続く〕小町の作とされていたように、和泉式部・清少納言のエノコログサの歌にも、小野氏は関わっていたのである。歌を中心とする物語に巧みな者が、この一門の系統を引く女性の中からも次々と現れ、諸国を巡っていたらしい形跡は、かなりはっきりしている。現在知られている足袋の発明者は、和泉式部と矢矧の長者の娘のほかにはまだいないが、こうなってしまった事情は、ほんの偶然にすぎない。それ以外にも、多くの非凡な少女が、人間の女性を母とせず、異常な生まれ方でこの世に現れた話は、竹の中のかぐや姫以来、長く続いている。その異常な少女を有名にした理由、つまり男性の武勇に対して、女性を名高く優れた存在にしたものは、美貌のほかには「利口な言葉」だった。ところが小野氏の二人の女性は、今日の俗説によれば、ともにこの条件を備えている。したがって、その子孫としてこの事を長く世に伝えようとする者が、行く先々で今なおどのような珍しい語り物を作り、面白く広めているかは、計り知れないのである。だから採集調査は今後の仕事であり、比較もなお、いくつかの資料が現れるのを待たなければならない。私などの研究は、実はただ確実でない予言にすぎない。どれほど見識が高く博学な人でも、現在の乏しい実例で断定しようとする者は、何と名乗ろうと、決して私たちの同志ではないのである。
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン262）と本文OCRを照合。
  - 本文を画像照合し、次章扉「米倉法師」と分離。「赫耀姫」はかぐや姫と訳した。

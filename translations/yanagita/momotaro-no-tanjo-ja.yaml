  section: 米倉法師／三 蚯蚓の歌
  original: 訓したのを、蚯蚓が自ら語らうとする「私」の意味に解し、昔からよくある二種の動物の、問答體の歌と見て居るのである。以前は多分湯溫海の湯治場の徒然に、村の人々を相手に座頭の歌つて居た唄であらう。農民は通例田植の後の腰の痛さを治する爲に、僅かな米錢を工面して溫泉地に來て寢轉ぶのが、何よりも大きな慰安であつた。故にこのやゝ皮肉なる小海老の腰曲りをかこつ歌は、境涯の最も接近した彼等の理解する所であつたのみならず、歌者は同時に又自分の眼といふものを有たぬ歎息を、田に住む第二の動物の言に托して、相憐れましめんとして居たのである。蚯蚓に眼が無いといふことは、かなり古くからの民間の語り草であつた。どうして蚯蚓はあの樣に聲が佳くて、それで又盲であるかといふことは、所謂なぜ話の有名なる一つであつて、恐らく是も亦作者は座頭であつた。夏の夕方の庭へ椽臺などを持出して靜かに涼んで居。ると、何處からとも無く蚯蚓の清い音が聽えて來る。あれは螻蛄であつて、蚯蚓は鳴くもので無いと、今では誰かが言ひ出すことになつて居るが、以前は斯ういふ場合に必ず此話が出たものであつた。記錄になつて居るのは民族二卷四號に、林魁一氏の東部美濃の例がある。昔蛇は歌が巧みであつて目を持たなかつた。その蛇の處へ蚯蚓が歌を敎へて貰ひに行くと、その目とならば取替へてやらうと答へたと言つて、曾ては蚯蚓が今の蛇の如く、美しい眼を持つて居たやうに話すのがをかしかつたのである。栃木縣南部の一例は箕和田良彌君が、その九十歲の祖母から聽いて之を採錄して居る。相州內鄕村話にも著者の老母の知つて居た話が載せてある。むかし蚯蚓には目が有つて聲が出ず、蛇は目が無くて歌が上手であつた。目は無くてもよいから美しい聲をと思つて、蛇に所望して其聲と我目とを交易したといふのである。それが同情に値する痩我慢であつたやら、但しは又心からさう思つて居たのやらは問はずとよい。少なくとも其作者が聲清く歌に巧みにして、目をもたぬ人であつたごとだけは想像し得られるのである。座頭の座の取持ちが主として音曲であつた時代にも、琵琶や三味線の手を休めると、必ず斯ういふ話が出たことであらう。誰しも半ばは愛相に、どうしてそなたは其樣な佳い聲が出るかなどと、尋ねる人は多かつたにちがひない。それに一々眞面目くさつて、卑下した會釋ばかりもしては居られなかつたのである。それに付けて思ひ出すのは、お貞子といふ奥州八
  translation: '〔前のスキャンから続く〕振り仮名をしたのを、ミミズが自分から語ろうとする「私」の意味に解し、昔からよくある、二種の動物の問答形式の歌と見ている。以前はおそらく、温海温泉で湯治中の退屈しのぎに、村人たちを相手に座頭が歌っていた歌だろう。農民は普通、田植えの後の腰の痛みを治すため、わずかな米と金を工面して温泉へ行き、寝転がっているのが、何より大きな慰めだった。そのため、このいくらか皮肉な、小海老が腰の曲がったことを嘆く歌は、境遇の最も近い彼らに理解されたばかりでない。歌い手は同時に、自分が目を持たない嘆きも、田んぼに住む第二の動物の言葉に託して、互いに哀れみ合うようにしようとしていたのである。

    ミミズに目がないということは、かなり古くから民間で語り伝えられてきた。なぜミミズはあれほど声がよく、それなのに目が見えないのかということは、いわゆる「なぜ話」の有名な一つで、おそらくその作者も座頭だった。夏の夕方、庭に縁台などを持ち出して静かに涼んでいると、どこからともなくミミズの澄んだ声が聞こえてくる。今では、あれはケラで、ミミズは鳴くものではない、と誰かが言い出すことになっているが、以前はこのような場合に、必ずこの話が出たものだった。記録としては『民族』二巻四号に、林魁一氏の東部美濃の例がある。昔、蛇は歌が巧みで、目を持たなかった。その蛇の所へミミズが歌を教わりに行くと、その目となら交換してやろうと答えたといって、かつてミミズが今の蛇のように美しい目を持っていたかのように話すのがおかしかったのである。栃木県南部の一例は、箕和田良弥君が九十歳の祖母から聞いて採録している。『相州内郷村話』にも、著者の老母が知っていた話が載せられている。昔、ミミズには目があって声が出ず、蛇は目がなく歌が上手だった。目はなくてもいいから美しい声が欲しいと思い、蛇に頼んで、その声と自分の目とを交換したというのである。それが同情すべき痩せ我慢だったのか、それとも心からそう思っていたのかは、問わなくてよい。少なくとも、その作者が澄んだ声を持ち、歌に巧みで、目の見えない人だったことだけは想像できる。

    座頭が座を取り持つ手段がおもに音曲だった時代にも、琵琶や三味線の手を休めると、きっとこのような話が出たことだろう。誰でも半ばは愛想として、どうしてあなたはそんなによい声が出るのか、などと尋ねる人が多かったにちがいない。それにいちいち大まじめに、へりくだった挨拶ばかりしてもいられなかったのである。これに関連して思い出すのは、お貞子という、陸奥八戸の、'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン268）と本文OCRを照合。

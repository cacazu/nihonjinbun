  original: かせる算段ばかりして居たと言ひ得るが、それも是も世間がたゞ單なる奇瑞譚のみは聽きたがらず、何か斯う身につまされるといふ類の、話を好むやうになつた趣味の變遷に、順應したものに過ぎなかつた。だからかの朝顏日記の娘深雪でも、さては安壽姫都志王丸の母親でも、氣をつけて見ると何れも典型があり、之を悲しくしただけが御前たちの手柄であつた。昔話の方面に於ては、繼母にいぢめられたお銀小銀の父親が、盲になつて二人の子を尋ねあるいて居る。又お銀女も目を泣きつぶして、後に不思議に光を取返したことは「手無し娘」なども同じである。或は所謂豐玉姫神話の系統かと考へられる龍宮女房の一話に於ては、母が故鄕の水の國に歸つて行く別れに、眼の珠をくり拔いて生みの兒に遺して行く條が有る。それを無慈悲な殿樣にまき上げられて、更に今一つの眼を惜しげも無く取つて與へ、是でもう夜と畫との境もわからなくなつた。どうぞ明け六つ暮れ六つの鐘を鳴らして、時刻を敎へてくれる樣になどと語るに及んで、子を持つ滿座の母姉は皆一樣に、はら〳〵と涙を堕したのであつた。斯ういふ昔話の數多い國は、日本ならずしてそも〳〵何處にあるか。是でも傳播論者は尙外國の說話集から、大きなヒントとやらを得て居れば安心であらうか。我々の盲女が見えぬ顏をふり上げて、さも悲しげに斯んな話をしたのは、成程師匠讓りの技藝ではあつたらうが、是にも亦人と綿津見の神の宮居との、何千年來の隱れたる交通といふものが、凡人の理解を下染めして居たことは爭はれないのである。たゞ併しながらそれを聽く者が何と受入れようかには頓着せず、學んで覺えた通りを其まゝに語つて、それでも宜しかつた時代が永く續いて、神の中居の尊敬を支持した信仰は衰へてしまつたのである。彼等盲人が更に一段と饒舌になり、又新工夫にあせつて、最初には先づ我家の由緒と名聲とを說き立て、尙進んでは一身の功績から、盲は賢しいものだ粗末にしていけないといふこと迄を、露骨に言はねばならぬことになつたのも世の中である。遠い昔の代から拜んで居た水の神を裏切つて、人に神祕を洩らしたのを恩に着せるのは憎い樣であるが、是とても亦生存の必要からであつた。誰が職業文藝の時と共に利己的になつて行くことを、罵倒する權利を有つて居るであらうか。(昭和七年七月、中央公論)
  translation: '〔前のスキャンから続く〕工夫ばかりしていたといえる。しかし、どちらも、世間が単なる不思議なめでたい話だけは聞きたがらず、何かこう、自分の身に引きつけてしみじみ感じられる話を好むようになった、趣味の変化に応じたものにすぎなかった。だから『朝顔日記』の娘深雪も、安寿姫と都志王丸の母親も、気をつけて見れば、いずれももとになる型があり、それを悲しくしたことだけが、御前たちの手柄だった。昔話の方面では、継母にいじめられたお銀・小銀の父親が、目が見えなくなって二人の子を探し歩いている。また、お銀女が泣いて目をつぶし、後に不思議に視力を取り戻したことは、「手無し娘」などでも同じである。あるいは、いわゆる豊玉姫神話の系統かと思われる「竜宮女房」の一話には、母が故郷の水の国へ帰る別れ際に、目の玉をくり抜いて、産んだ子に残していく一節がある。それを無慈悲な殿様に取り上げられると、さらにもう一つの目も惜しげなく取って与えた。「これでもう夜と昼の区別もつかなくなりました。どうぞ朝六つ、夕六つに鐘を鳴らして、時刻を知らせてくれるように」と語るところに来ると、その場にいる子を持つ母たちは皆、はらはらと涙を落としたのだった。このような昔話が数多い国は、日本でなくて、いったいどこにあるだろう。これでも伝播論者は、なお外国の説話集から「大きなヒント」とやらを得ていれば安心なのだろうか。日本の目の見えない女性が、目の見えぬ顔を上げ、いかにも悲しげにこのような話をしたのは、確かに師匠譲りの技芸だったろう。しかしここにも、人と海の神の宮殿との、何千年にもわたる隠れた交流が、普通の人々の理解の下地を染めていたことは否定できない。ただ、聞き手がどう受け取るかには頓着せず、習い覚えたとおりにそのまま語って、それでもよかった時代が長く続き、神の仲立ちをする者への尊敬を支えていた信仰は、衰えてしまったのである。目の見えない人々がさらによくしゃべるようになり、新しい工夫を焦って求め、最初はまず自分の家の由緒と名声を言い立て、さらに自分一人の功績から、「目の見えない者は賢いのだから、粗末にしてはいけない」ということまで、あからさまに言わなければならなくなったのも、世の中の成り行きである。遠い昔から拝んでいた水の神を裏切り、人に秘密を漏らしたことを恩に着せるのは、憎らしいようでもある。しかしこれも、生きていく必要からだった。職業としての文芸が、時とともに利己的になることを、誰が罵倒する権利を持つだろうか。

    （昭和七年七月、『中央公論』）'

- id: mmt-117-01
  scan: 117
  section: 田螺の長者／舌切雀と腰折雀
  original: 'ら臼が落ちかゝつて首尾よく仇討をしたといふのである。

    山姥退治の最も普通な近世の型としては、牛方又は馬方が山姥の留守宅に走り込み、色々

    とからかつて後に報復をしたことになつて居るが、興味は專ら征服の痛快さに集注して、山

    姥害惡の發端が詳かにせられて居ない。私の假定では牛方又は馬方が或時代の主たる傳承者

    であつた爲に、此樣に彼等を其說話の主人公にしてしまつて、最初のいたいけな被害者の物

    語を、押退けることになつたので、今に又この「雀の仇討」以上に、是と「瓜子姫」との中間に

    立つ話が、現れて來ることも有るだらうと思つて居る。何にもせよ雀が人のやうな智慧と感

    情を有ち、人と同じき事業を完成したといふ昔話は、人も雀も魂は一つだといふことを、

    思つて居た者ならば信じ得たのである。それを信ぜずとも面白ければ話だといふことになつ

    て、後に却つて色々の誇張が行はれるやうになつた。卽ち蟹は蟹、猿は猿、雀は雀とそれ〴〵

    の管轄を分つ以前には、もう少し昔の語り傳へが混融して、神の子が必ずしも常に一定の動

    物の形を假りて現れなければならぬといふことが、期待せられなかつた時代もあつたらしい

    のである。

    是が或種の動物に關しては、もはや疑の餘地も無くなつたことは、私が次節以下に說明せ

    んとする所であるが、たゞ雀に於ては材料がまだ足らず、又餘りにも奇拔なる發見であるが

    爲に、人は容易に「桃太郞」と「舌切雀」との、根源の一つなることを認めぬかも知れぬ。併し

    卵の中から英雄の出て來た點だけならば、旣に多くの民族に類例があるのみならず、日本で

    も美濃の養老山、出羽の鳥海山其他の緣起として、祖神が鳥によつて運ばれたことを說くも

    のが少なくない。文學の竹取物語を生成せしめた一話なども、同じく亦鶯が少女と化して時

    の帝の皇女に召されたと傳ふるものもあつた(謠曲富士山)。スヾメといふ語も本來は今の家

    雀のみで無く、弘く小鳥の總體の名であつたらしく、且つ我邦の卵生說話には、屢〻小さ子

    神の驚くべき成長を說くものがあつたのである。竹の林のたつた一つの卵から、山姥を征伐

    するほどの英雄が出たといふことが、曾ては桃太郞の瓜子姫と對立する如く、富士の鶯姫と

    竝び行はれた此說話の要素であつたかも知れない。勿論「瓢の米」の報恩譚の輸入によつて、

    感化を受けたと迄は言ひ得るであらう。併し少なくとも同一系統のものだといふ、燕石襍志

    流の解釋には根據が無い。'
  translation: 'ら臼が落ちかかり、首尾よく仇討ちを果たした」というのである。

    山姥退治の、近世で最も普通の型では、牛方や馬方が山姥の留守宅へ駆け込み、さまざまにからかった末、仕返しをしたことになっている。しかし、面白さはもっぱら打ち負かす痛快さに集中していて、山姥の害悪が始まった事情は詳しく語られない。私の仮説では、ある時代、牛方や馬方が主な伝承者だったため、彼ら自身を説話の主人公にしてしまい、もとの幼く弱々しい被害者の物語を押しのけたのだ。今後、この「雀の仇討ち」よりもさらに、「瓜子姫」との中間に位置する話が現れることもあるだろうと思う。

    いずれにせよ、雀が人間のような知恵や感情を持ち、人と同じような仕事を成し遂げたという昔話は、人も雀も魂は同じだと思う者なら信じることができた。それを信じなくても、面白ければ話としてよいということになってから、かえってさまざまな誇張が行われるようになった。つまり、蟹は蟹、猿は猿、雀は雀と、それぞれの領域を分ける以前には、もっと昔の語り伝えが入り混じり、神の子は必ず一定の動物の姿を借りて現れなければならない、とは期待されていなかった時代もあるらしいのである。

    ある種の動物については、この点にもはや疑いの余地がなくなったことを、私は次の節以降で説明しようと思う。ただ、雀については、まだ資料が足りないうえ、あまりにも意外な発見であるため、人は容易に「桃太郎」と「舌切雀」の根源が同じだとは認めないかもしれない。しかし、卵から英雄が出てくるという点だけなら、すでに多くの民族に似た例がある。それだけでなく、日本でも美濃の養老山、出羽の鳥海山などの由来を語る話には、祖先の神が鳥に運ばれたと説くものが少なくない。文学作品の『竹取物語』を生み出すもとになった話の一つにも、同じように、鶯が少女に姿を変え、時の帝の皇女として迎えられたと伝えるものがあった（謡曲『富士山』）。スズメという語も、もとは今の家雀だけでなく、小鳥全般の名だったらしい。また、日本の卵から生まれる話には、しばしば小さ子神の驚くべき成長を語るものがあった。

    竹林のただ一つの卵から、山姥を征伐するほどの英雄が出たという点が、かつては、桃太郎と瓜子姫が対になっていたように、富士の鶯姫と並んで語られたこの説話の要素だったのかもしれない。もちろん、「瓢の米」という恩返しの話が入ってきて、その影響を受けたとまでは言えるだろう。しかし、少なくとも同じ系統の話だとする『燕石襍志』流の解釈には、根拠がない。'
  notes:
  - 冒頭はscan116から続く。末尾は文・節ともに完結。次のscan118は新節「蛙の王子と蛇の王子」から始まり、本文の重複はない。
  - 牛方・馬方は、牛馬を使い荷物を運ぶ人。
  - 燕石襍志は曲亭馬琴の随筆。書名の「襍」は「雑」の異体字。
  - 「家雀」は人家周辺にいる普通のスズメを指す原文表現。
  - 前のスキャンからの続き

  section: 和泉式部の足袋／六 誓願寺と鳳来寺
  original: 像し得られるが、一方此靈山の南麓の村々には、或は其家筋の者では無いかと思ふ舊家が少しづつ殘つて居るやうである。だから醒睡笑などの存在を丸で知らなかつた人たちが、別に獨立して此方面から、南無藥師の說話を持つて國々を巡つて居たとも考へられぬことは無いのである。ところが爰にたゞ一つだけ、京と三河との聯絡を認めさせずには置かぬ史料は、九州の和泉式部であつた。和泉式部と京の誓願寺との關係は古い。新舊二つの緣起を始として、謠曲にも此事を主題としたものがあつて、後に誠心院が何等かの事情の爲に、本寺と分立してしまつてからも、尙誓願寺は和泉式部の寺であつた。さうして醒睡笑が右の藥師の歌以外に、幾つかの和泉式部の話を載せて居るのも、偶然では無かつたのである。といふ理由は其編者の安樂菴策傳こそは、實はこの誓願寺の前住であつた。策傳七十に及んで、この八卷の草紙を淨記した頃には、寺の乾の隅に在る竹林院といふに隱居して居たが、「小僧の時より耳に觸れて面白くをかしかりつることを反古の端に留置きたり」といふのも、又六十二三の頃に板倉周防守父子の爲に其話をして聽かせたといふのも、共に此寺の住侶であつた時のことらしくそれといふのが元來誓願寺が、說話を業とする法師比丘尼の、出入する寺であつたからかと思ふ。是は此寺の自ら傳ふる歷史なり、諸國の同名の寺との交通なりを調べて行けば、次第に明瞭になることであるが、この度はまだ其詳述の用意の整はぬ故に、單に假定として是だけの事を言つて置く。少なくとも和泉式部に關する近代の雜說だけは、すべて誓願寺が本元であつた。さうして歌藥師の物語も旣に此寺には知られて居た。だから日向の法華嶽寺の傳說は、一旦京都を通つて來たことが推測せられるのみならず、肥前の福泉寺のそれも事によると、直接に三州鳳來寺から持つて來たものでは無かつた。諸國の藥師如來の靈場に一貫する歌物語が、學び習ふこと無くして自然に相同じきこと能はずとすれば、元は恐らく誓願寺の所謂和泉式部塚、及び花の枝を手に持つた美しい尼の木像と、何等かの關係をもつて居たのである。そんなら何故に遠國では小町和泉の話のみ多く、獨り本山の醒睡笑だけが、叡山北谷の兒の瘡となつて居るかといふと、それは唯話者の安樂菴策傳が、比丘尼で無かつた故に男の話の方を知つて居たと、解說するの他はあるまいと思ふ。
  translation: '〔前のスキャンから続く〕一方、この霊山の南麓の村々には、その人たちの家筋ではないかと思われる旧家が、少しずつ残っているようである。したがって、『醒睡笑』などの存在をまったく知らなかった人たちが、別の独立した経路として、この方面から「南無薬師」の説話を携えて諸国を巡っていたということも、考えられないわけではない。

    ところが、京都と三河とのつながりを認めざるをえなくする史料が、ここにただ一つある。それが九州の和泉式部であった。和泉式部と京都の誓願寺との関係は古い。新旧二つの縁起をはじめ、謡曲にもこれを主題にしたものがあり、のちに誠心院が何らかの事情で本寺から分立してしまってからも、なお誓願寺は和泉式部の寺だった。そして『醒睡笑』が、先ほどの薬師の歌のほかにも和泉式部の話をいくつか載せていることも偶然ではない。というのは、その編者である安楽庵策伝こそ、実はこの誓願寺の前住職だったからである。策伝が七十歳になり、この八巻の草紙を清書したころには、寺の北西の隅にある竹林院という所に隠居していた。しかし、「小僧の時から耳にして、面白くおかしかったことを反故紙の端に書き留めておいた」というのも、六十二、三歳のころ板倉周防守父子にその話を聞かせたというのも、ともにこの寺の僧侶だった時のことらしい。それは、もともと誓願寺が、説話を生業とする法師や比丘尼の出入りする寺だったためかと思う。この点は、この寺が伝える歴史や、諸国の同名の寺との交流を調べていけば、次第に明らかになるだろう。しかし今回は詳しく述べる準備が整っていないので、ただ仮説としてこれだけを述べておく。少なくとも和泉式部に関する近代のさまざまな話だけは、すべて誓願寺が本元だった。そして歌薬師の物語も、すでにこの寺では知られていた。したがって、日向の法華嶽寺の伝説は、一度京都を経由してきたと推測できるだけでなく、肥前の福泉寺の伝説も、もしかすると三河の鳳来寺から直接持ち込まれたものではなかった。諸国の薬師如来の霊場に共通する歌物語が、学び伝えることなしに自然に同じものとなるはずはないとすれば、その起源はおそらく誓願寺の、いわゆる和泉式部塚や、花の枝を手に持った美しい尼の木像と、何らかの関係があったのである。それでは、なぜ遠い土地では小町や和泉式部の話ばかりが多く、ひとり本山の『醒睡笑』だけが比叡山北谷の稚児のできものの話になっているのか。それは、語り手の安楽庵策伝が比丘尼ではなかったので、男性の話のほうを知っていたのだ、と説明するほかあるまいと思う。'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン257）と本文OCRを照合。
  - 比丘尼は女性の出家者をいうが、ここでは諸国を巡って宗教的な説話を語った女性たちも指す。「近代」は著者の時代区分。

  section: 海神少童／嘉手志川
  original: 'のであつた。ところがいつの頃からとも無く、信じられなくともよいから珍らしいことが聽

    きたいといふ人が多くなつて、話は此幹から際限も無く枝葉を茂らせた。好き妻めでたい婚

    姻といふことを面白く語らうとすると、終には身の毛をむしつて美しい錦を織つたといふ裸

    鶴の話や、鍋の中に尻を洗つて旨い汁を調理したといふ、蛤女房のやうな殺風景な話さへ現

    はれることになつたのである。

    他の一方では、人間よりも賢こかつたといふ白い小狗なども、やはり灰まき·雁とり·花咲

    かせ爺の程度に、止まつて居ることは出來なかつた。今でも下がかつた汚ない話が始まると、

    人はよく之を話のおしまひだと謂ふが、實際そこ迄は展開して行くのが普通であつたらしい。

    たゞ私たちの注意せずに居られぬのは、その變遷の最後の形と思はれるものが、犬に關する

    限りは非常に弘く、日本全國に行渡つて居ることである。今日沖繩に傳はるやうな整うた昔

    話では無いが、曾て同種のものが有つたといふ痕跡だけならば、內地にも尙方々に發見せら

    れる。例へば備前犬島の犬石の由來として、附近の住民に知られて居る話なども其一つであ

    る。犬が菅原天神の飼犬であつて、船の導きをしたとか跡を慕うて吠えたとかいふ迄は、島

    に其御社も有るのだから不思議でも無いが、爰では其以外に熊野の路で路銀が無くなつて、

    渡し錢の代りにその小犬を、渡し守に與へられたなどと謂つて居る。一椀の砂を食はせると

    一兩の金をひり、二椀の砂を遣ると其犬が死んでしまつた。それを海に流したら此島へ漂着

    して、犬石樣になつたなどといふのである。或は其旅人は菅公では無く、唯の一人の浪人で

    あつた。紀州日高川の渡し場で、爺と九歲になる孫の竹市とが、其小犬を浪人から貰つた。

    頸輪には一日に砂一合、小判二枚を生むと書いてあつた。それをどうしたわけであつたらう

    か、子供と共に一つの樽の中に入れて置いたのが、海に漂うてこの犬島に流れて來たといふ

    口碑もあるとのことで、此方はよほど又桃太郞や奥州の灰まき爺の話と近いのである。三州

    寶飯郡八幡村の千兩大明神は、又の名を犬頭宮とも稱へて、昔ある正直なる女の爲に、鼻か

    ら多くの絹絲を出したといふ靈犬の故跡と認められて居たが、今から百年ほど前に或學者が

    其地を訪ひ、故老に就いて尋ねて見たところが、所謂犬頭蠶の由來は痕形も無くて、たゞ昔

    浪人が此里を開いた時に、その飼犬に金を糞するものがあつて、每年得る所の黃金が千兩あ

    つた。故に又千兩といふ村の名が出來たと語つて居たさうである(神祇全書卷四)。信州でも上'
  translation: 'のである。ところが、いつの頃からか、信じられなくてもよいから珍しいことを聞きたいという人が増えて、話はこの幹から、際限なく枝葉を茂らせていった。よい妻、めでたい結婚ということをおもしろく語ろうとすると、ついには、体の羽をむしって美しい錦を織ったという裸の鶴の話や、鍋の中で尻を洗ってうまい汁を作ったという、蛤女房のような興ざめする話まで現れることになったのである。

    もう一方では、人間よりも賢かったという白い小犬なども、やはり灰まき・雁とり・花咲かせ爺ぐらいのところに、とどまってはいられなかった。今でも下品で汚い話が始まると、人はよく、それを「話のおしまい」と言うが、実際、そこまでは展開していくのが普通だったらしい。ただ、私たちが注意せずにいられないのは、その変遷の最後の形と思われるものが、犬に関するかぎり、非常に広く、日本全国に行き渡っていることである。今日沖縄に伝わるような形の整った昔話ではないが、かつて同じ種類のものがあったという痕跡だけなら、内地でもなお、各地に見つけられる。

    たとえば、備前犬島の犬石の由来として、付近の住民に知られている話も、その一つである。犬が菅原天神の飼い犬で、船を導いたとか、後を慕ってほえたとかいうところまでは、島にその神社もあるのだから、不思議ではない。だが、ここではそれ以外に、熊野への道中で旅費がなくなり、渡し賃の代わりにその小犬を渡し守へ与えられた、などと言っている。一椀の砂を食べさせると一両の金をひり出し、二椀の砂を与えると、その犬は死んでしまった。それを海へ流すと、この島へ漂着し、犬石様になった、などというのである。

    あるいは、その旅人は菅原道真ではなく、ただ一人の浪人だったともいう。紀州日高川の渡し場で、おじいさんと九歳の孫の竹市が、浪人からその小犬をもらった。首輪には、一日に砂一合で、小判二枚を生むと書いてあった。それを、どうしたわけだったのか、子供と一緒に一つの樽へ入れておいたところ、海を漂って、この犬島へ流れ着いたという言い伝えもあるそうだ。こちらは、さらにかなり、桃太郎や奥州の灰まき爺の話に近いのである。

    三州宝飯郡八幡村の千両大明神は、別名を犬頭宮といい、昔、ある正直な女のために、鼻からたくさんの絹糸を出したという霊犬のゆかりの場所と認められていた。しかし、今から百年ほど前、ある学者がその地を訪れ、土地の老人に尋ねてみると、いわゆる犬頭蚕の由来は跡形もなく、ただ、昔、浪人がこの里を開いたとき、その飼い犬に金の糞をするものがいて、毎年得られる黄金が千両あった。それで千両という村の名もできた、と語っていたそうである（『神祇全書』巻四）。信州でも上'
  notes:
  - 画像をまたぐ文は前後のunitと接続する。
  - 担当末尾は「信州でも上」。scan065冒頭「高井郡の傳說に、亦一つの黄金小犬の破片があつた。」へ続く。065は境界確認のみで、本文は本ファイルに重複収録しない。
  - 「今から百年ほど前」は著者の執筆時点からの年数。
  - 「犬頭蠶」は犬と養蚕を結び付ける由来に関する原文の語を「犬頭蚕」として保持。

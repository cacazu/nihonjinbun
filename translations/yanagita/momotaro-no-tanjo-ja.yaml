  section: 田螺の長者／五分次郎・かしこ淵
  original: '京都伊勢越前等)、それが「つちや子持や」となり又は「槌や小槌や」と變つて居るのを見ると、

    「樗や辛夷や桂の葉」であらうと言つた足薪翁の說は、當て推量に過ぎるやうである。木曾の

    小さ子塚のことは本文の中にも一言してあるが、あれは寶曆七年に成つた吉蘇志略の記述を、

    後に名所圖繪が丸寫にしたのである。極めて簡略ではあるが、是以上の傳承はもう保存せら

    れては居るまいから、是も一つの例證として引用して置く値があると思ふ。

    〔吉蘇志略卷三。〕黑川、村陵墓。小子塚、野中に在り。里人相傳ふ木曾殿に尫子あり。

    其長僅に尺二寸。故に小子と名く。里民をして養はしむ。或ときは臼の中に匿し、覆ふ

    に笠を以てすれば其形を見ず。其矮きこと亦知るべし。卒する後此に葬る。其傍に長

    櫃塚あり。相傳ふ寶物を埋むと。今に至るまで之に觸るれば立ちどころに病む。里人惧

    れて敢て犯さず。(原漢文)

    この黑川村には箕作翁といふ長者があつて、童觀翁といふ長者と財寶競べをした話、及び

    山姥が里の子供を捕へて行くので、石を餅だと僞つて誑して退治した話があつたことも、同

    じ書物の中に見えて居るが、共にもう破片であつて聯絡の有無を究め難い。

    かしこ淵

    蜘蛛が人間の少女と緣を結んだ話は、今一つ北國のどこかに有つたと思ふだけで、他には

    類例をまだ聞いて居らぬが、是も曾ては蛇體と同樣に、水の神靈の假の姿として、想像せら

    れて居たらしい痕跡は顯著である。我邦でよく發達して居る怪譚の一つに、私たちが「喰は

    ず女房」又は「口無し女房」と名けて居るものがある。昔ある桶屋がもしくは一人の職人が、

    飯を喰はぬ嫁なら貰ひたいものだと謂つて居ると、私は飯をたべないからと言つて押掛女房

    に來た女がある。なるほどちつとも食はないが、それにも拘はらず米や味噌がぐんぐん減る

    ので、不思議に思つて外へ行く顏をして、そつと戾つて來て覗いて見ると、忽ちに化の皮が

    露はれた。私の集めて見ただけの材料では、この化の皮のむけ方に地方的の變化がある。先

    づ大體に日本の東半分、奥羽や關東で聽くところは、女が多量の飯を炊ぎ汁を煮て、それか

    ら髮を解くと頭の眞中に大きな口が有る。其口の中へ幾つでも握飯をほうり込み、何杯と無'
  translation: '京都・伊勢・越前など）。それが「つちや子持や」となったり、「槌や小槌や」と変わったりしているのを見ると、「樗や辛夷や桂の葉」だろうと言った足薪翁の説は、当て推量にすぎるようである。木曾の小さ子塚については本文でも一言触れたが、あれは宝暦七年にできた『吉蘇志略』の記述を、後に『名所図会』がそのまま書き写したものである。きわめて簡略ではあるが、それ以上の伝承はもう保存されていないだろうから、これも一つの証拠として引用する価値があると思う。


    〔『吉蘇志略』巻三、黒川村、陵墓〕

    小子塚は野の中にある。村人が伝えるところでは、木曾殿に「尫子」、つまり身体に異常があるとされた子がいた。身長はわずか一尺二寸だったので、小子と名づけた。村人に養わせた。ある時は臼の中へ隠し、笠をかぶせると姿が見えなくなった。その背の低さも知れるだろう。亡くなった後、ここに葬った。そばには長櫃塚がある。宝物を埋めたと伝えられる。今に至るまで、これに触れるとたちどころに病気になる。村人は恐れ、決して手をつけない。（原文は漢文）


    この黒川村には箕作翁という長者がいて、童観翁という長者と財宝比べをした話や、山姥が里の子どもをさらっていくので、石を餅だと偽ってだまし、退治した話があったことも、同じ書物に見える。しかし、どちらもすでに断片となっており、互いにつながりがあるかどうかは究めにくい。


    かしこ淵


    蜘蛛が人間の娘と結ばれた話は、もう一つ、北国のどこかにあったと思うだけで、ほかに類例はまだ聞いていない。しかし、蜘蛛もかつては蛇と同様、水の神霊の仮の姿として想像されていたらしい痕跡は、はっきりしている。日本でよく発達した怪談の一つに、私たちが「食わず女房」または「口なし女房」と呼ぶ話がある。昔、ある桶屋、あるいは一人の職人が、「飯を食わない嫁ならもらいたいものだ」と言っていると、「私は飯を食べませんから」と、押しかけ女房に来た女がいた。確かに少しも食べないのだが、それなのに米や味噌がどんどん減る。不思議に思って外出するふりをし、そっと戻ってのぞいてみると、たちまち化けの皮が現れた。


    私が集めた限りの資料では、この化けの皮のはがれ方に、土地による違いがある。まず、おおむね日本の東半分、奥羽や関東で聞くのは、女が大量の飯を炊き、汁を煮て、それから髪をほどくと頭の真ん中に大きな口がある、というものだ。その口へ幾つも握り飯を放り込み、何杯も――'
  notes:
  - 冒頭はスキャン136の考察・出典の続き。末尾はスキャン138へ続く。
  - 宝暦七年は1757年。樗はおうち、辛夷はこぶし。唱え言葉の語形を保持した。
  - 「尫子」は身体の相違・障害をいう歴史的な語を含む。原画像と同一版の正規ミラー画像を拡大して「尫子」と読んだが、印字不鮮明のため異体字の別は留保する。訳では原語を明示し、当時の身体観に基づく表現として説明した。
  sequence: 142
- id: mmt-138-01
  scan: 138
  section: 田螺の長者／かしこ淵
  original: 'く汁を注ぎ入れて、後でちやんと髪を束ねて、所謂何食はぬ顏をして居る。それを知つた亭

    主は空怖しくなり、何とかして之を離別しようとすることになつて居るのだが、この頭のて

    つぺんに大きな口が有るといふのは、どうやら女が蛇體であつたことを意味して居たらしい。

    現に懸離れた壹岐の島などでは、女房が頭だけ蛇になつて、藏の酒を飮んで居たといふ風に

    も語つて居る。ところが多くの話し手はどういふわけか、是を山姥の化けたのであつたと謂

    つて、蛇だといふことはもう忘れてしまひ、島根縣でも山姥は人の見る所では飯を食はず、

    人の知らぬうちに頭の上に在る口から、幾日もの食事を一度にたべるものだなどと謂ふさう

    である(高木傳說集一五二頁)。しかし中國以西に行はるゝものは、頭の口で飯を食つたとい

    ふことを言はぬ方が普通である。たとへば備前上道郡の一例に於ては、亭主の留守に多勢の

    人が集まり來り、それが蜘蛛になつて麥飯を炊いて食つて居た。亭主が之を見付けて肝を消

    し、夕方に歸つて來て、口實を設けて其女房を歸さうとすると、別れに風呂を立てて亭主を

    入らせ、上から蓋をして風呂桶のまゝ、多くの蜘蛛が擔いで行く。それが途中で古寺に入つ

    て休んで居るうちに、神々に禱つたら桶の繩を解けて、危い命を助かつて遁げて還つた云々

    と謂つて居る(岡山文化資料三卷一號)。肥前の有馬でも同樣に男を風呂桶に入れて擔いで行つ

    たが、道傍にさし出た樹の枝に取付いて、漸く拔け出して遁げ戻る。すると其女が又歸つて

    來たので、一生懸命になつて打殺すと大きな蜘蛛であつたと言ふ(旅と傳說二卷六號)。この樹

    の枝に取付いて風呂桶から脫け出したといふ點と、蓬菖蒲の陰に隱れて怪物の追跡を免れた

    といふ點とは、二つともに全國の「喰はず女房」說話の、最も數多く共通して居る部分である

    が、丹波では五月節供に菖蒲と蓬とを軒に葺く由來として、昔惡い蜘蛛が風呂に入つて居る

    男を風呂桶のまゝ背に負うて行かうとしたが、菖蒲と蓬との叢に入つて、支へられて進むこ

    とが出來ず、其間に風呂の中の男は助かつたといふ話を傳へ(なら一八號)、阿波の山中でも或

    男が行水をして居ると、山女が來て盥のまゝ頭に乘せて山へつれて行かうとしたが、路上の

    樹枝を攀ぢて身を脫し、そつと跡をつけて行つて立聽きをして居ると、おまへには所詮人間

    の聟は取れまいといふ聲がする。なに私が今夜もう一度、蜘蛛に化けて行つてきつと取つて

    來る。そんなことを言つても人間は賢こい。もし左の腋を打たれたらどうする。といふ問答

    の聲を聽いて、是はよいことを覺えたと思つて待つて居ると、果して夜になつて怖ろしい蜘'
  translation: '――汁を注ぎ入れ、後できちんと髪を束ねて、いわゆる何食わぬ顔をしている。それを知った夫は恐ろしくなり、何とか離縁しようとすることになっている。この、頭のてっぺんに大きな口があるというのは、どうやら女が蛇の姿だったことを意味していたらしい。現に、遠く離れた壱岐の島などでは、妻の頭だけが蛇になって、蔵の酒を飲んでいたとも語られている。ところが多くの語り手は、どうしたわけか、これを山姥が化けたものだと言い、蛇だということは忘れてしまっている。島根県でも、山姥は人の見ているところでは飯を食べず、人の知らないうちに頭の上の口から、何日分もの食事を一度に食べるものだ、などと言うそうである（『高木伝説集』一五二ページ）。


    しかし、中国地方以西に伝わるものは、頭の口で飯を食べたとは言わないほうが普通である。例えば備前上道郡の一例では、夫の留守に大勢の人が集まり、それが蜘蛛になって、麦飯を炊いて食べていた。夫はこれを見つけて仰天し、夕方帰ってから、口実を作って妻を帰そうとする。すると、別れに風呂を沸かして夫を入れ、上から蓋をし、風呂桶ごと多くの蜘蛛が担いでいく。途中、古寺に入って休んでいる間に、男が神々に祈ると桶の縄がほどけ、危うい命を救われて逃げ帰った、という（『岡山文化資料』三巻一号）。肥前の有馬でも、同じように男を風呂桶に入れて担いでいったが、男は道端に張り出した木の枝につかまり、ようやく抜け出して逃げ帰る。すると女がまた帰ってきたので、必死に打ち殺すと、大きな蜘蛛だったという（『旅と伝説』二巻六号）。


    木の枝につかまって風呂桶から抜け出したという点と、蓬や菖蒲の陰に隠れ、怪物の追跡を逃れたという点は、どちらも全国の「食わず女房」の説話で、最も多く共通している部分である。丹波では、五月の節句に菖蒲と蓬を軒にふく由来として、昔、悪い蜘蛛が風呂に入っている男を桶ごと背負っていこうとしたが、菖蒲と蓬の茂みに入ると遮られて進めず、その間に桶の中の男は助かったという話を伝える（『なら』十八号）。阿波の山中でも、ある男が行水していると、山女が来て、たらいごと頭に乗せ、山へ連れていこうとした。男は道の木の枝につかまって逃れ、そっと後をつけて立ち聞きしていると、「お前には、どうせ人間の婿は取れまい」という声がする。「なに、私が今夜もう一度、蜘蛛に化けて行って、きっと取ってくる」「そう言っても人間は賢い。もし左の脇を打たれたらどうする」。このやり取りを聞いて、よいことを覚えたと思って待っていると、果たして夜になり、恐ろしい蜘――'
  notes:
  - 冒頭はスキャン137の続き。末尾はスキャン139へ続く。
  - 引用中の「中国」は中国地方を指す。

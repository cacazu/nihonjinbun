  section: 和泉式部の足袋／三 鹿母夫人
  original: '爰にミタマと謂つて居るのは、後々の說話に子種といふのと同じもので、是は申し兒の語りの最も普通な型であつたが、斯ういふ部分は勿論雜寶藏經には出て居ないのである。

    私たちが問題として居るのは、所謂利修仙人の小便の話が、天竺を水上として居るか否かでは無い。

    其點はもうとうに決して居る。

    明かにしなければならぬのは、この外國の智識が到着する以前、三河の山間には鹿母の說話なり、又傳說なりが全く無かつたかどうかである。

    別の語でいふと異種民族の文藝なるものは、一つの觸角も出さず何等の沃地を求めずとも、行きなり放題に何處にでも根をさして、花咲くことの出來たものか否かである。

    この海外から無數に入つて來たものが稀に殘り、廣い國土の間に或境にのみ之を保存して居るのを見れば、よもや然りと答へ得る人は無からうと思ふが、當世の傳播論者の說を聽いて居ると、頓と皆さう思つて居るやうなことを平氣で言ふのである。

    私だけは憚りながらさうで無い。

    勿論前にどういふ話があつたから、それにからんで次の是々の新話が參加したと、片端から立證することは容易で無いが、時と場合によつては、隨分と無造作に、今ある口碑の蔭からでも、曾て其背後にあつたものを窺ひ知ることが出來る。

    肥前福泉寺の和泉式部などもそれであるが、たとへ其原型は文獻の上から、光明皇后以上には溯り得ずとも、それが始の形とは考へることが出來ない。

    是と同樣に印度の佛說を採つたことが明かであつても、それだけでは峯の藥師の靈山に、此樣な話の珍重せられた動機は、少しでも說明せられては居ない。

    疑つて尙探つて見るのが當然である。

    私は何よりも先づ異常誕生の說話が、古今我邦には數豐かに、其中でも最初身を鳥獸の姿に托して居たといふ例の、色々と變化して傳はつて居ることを考へ、更に家々が其古傳を尊重して、緒形氏の尾の形や三つの鱗といふ類の特徴を、注意するのが普通であつたことから推進めて、光明皇后乃至淨瑠璃御前の傳承にも、尙若干の日本分子の殘留があることを認めるのだが、それよりも一層看過し難いのは、布の足袋が世に行はれると直ぐに其形によつて足の趾が二岐れになつて居たといふ挿話を附加へ、それを又面白がつて何處ででも喜び聽かうとした、我同胞の敏活なる文藝技能である。

    義經記以來の語り草であつた矢矧長者申し兒の話が、後に鹿母の奇譚と繼合はされたものとしても、是も亦一つの適切なる例證たることを失はぬが、一方に神樣から田螺の子を賜はり、もしくは蛇の子を產んだといふ昔話も傳は'
  translation: 'ここでミタマといっているのは、のちの説話でいう子種と同じものである。これは申し子の語りの最も普通の型だったが、こうした部分は、もちろん『雑宝蔵経』には出ていない。

    私たちが問題にしているのは、いわゆる利修仙人の小便の話が、インドを源流としているかどうかではない。その点は、もうとうに決着している。明らかにしなければならないのは、この外国の知識が届く前、三河の山間に、鹿を母とする説話や伝説がまったくなかったかどうかである。言い換えれば、異民族の文芸というものは、何の手がかりも持たず、肥沃な土地を求めることもなく、行き当たりばったりにどこへでも根を張り、花を咲かせることができたのか、ということだ。海外から無数に入ってきたもののうち、残ったのはごくわずかで、広い国土の中でも、ある地域だけがそれを保存しているのを見れば、まさか、できたと答える人はいないと思う。ところが、今どきの伝播論者の説を聞いていると、まるで皆そう思っているかのようなことを平気でいう。はばかりながら、私だけはそうではない。もちろん、以前こういう話があったので、それに結びついて次にこれこれの新しい話が加わった、と一つ一つ立証するのは容易ではない。しかし時と場合によっては、今ある言い伝えの陰からでも、かつてその背後にあったものを、かなりたやすくうかがい知ることができる。肥前福泉寺の和泉式部の話などもそうである。たとえ、その原型を文献上、光明皇后より前へさかのぼらせられなくても、それが最初の形だとは考えられない。これと同じように、インドの仏教説話を採ったことが明らかでも、それだけでは、峰の薬師の霊山で、なぜこのような話が大切にされたのかは、少しも説明されていない。疑問を持ち、さらに探ってみるのが当然である。

    私は何より先に、異常な誕生の説話が、昔から今まで日本には数多くあり、なかでも初めは鳥や獣の姿を取っていたという例が、さまざまに変化して伝わっていることを考える。さらに、家々が古い伝承を尊重し、緒形氏の尾の形や三つの鱗といった特徴に注意するのが普通だったことから考え進め、光明皇后や浄瑠璃御前の伝承にも、なおいくらか日本由来の要素が残っていると認める。それよりもいっそう見逃せないのは、布の足袋が世に広まるとすぐ、その形から足の指が二つに分かれていたという挿話を付け加え、それをまた面白がり、どこでも喜んで聞こうとした、わが同胞の機敏な文芸の能力である。『義経記』以来の語り種だった矢矧長者の申し子の話が、のちに鹿母の不思議な話とつなぎ合わされたとしても、これが一つの適切な証拠であることに変わりはない。しかし一方で、神から田螺の子を授かり、あるいは蛇の子を産んだという昔話も伝わ――'

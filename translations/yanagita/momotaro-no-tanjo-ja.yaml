  - 冒頭はscan109、末尾はscan111へ続く。
  - 「思金松兼」は同じscan末尾では「思金兼松」と印刷されている。原文・訳とも表記の揺れを保持。
  - 外間根人は久高島の祭祀上の役職・家の呼称。思樽・伊敷泊などの固有名は原文表記を保持。

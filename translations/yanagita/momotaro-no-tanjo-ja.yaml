  section: 隣の寝太郎／山田の露
  original: 印象を微弱ならしめた場合が多く、其結果は往々にして新たなる修飾を必要とすることにもなつたかと思ふ。たとへば攝州丹生山田の千年家などでも、單に我家の初代夫人が、尋常農民の子では無かつたこと、及び其靈を永く湧水の傍に祀つて居るといふだけの漠然とした記憶を以て、滿足して居ることが出來たならば、如何に興味の深い昔話が有らうとも、卒爾に入り來つて是と結び付くやうなことは無かつたらう。たゞ何分にも家傳は物足らず、是には必ず今一段の謂はれ因緣が有つた筈だと、先づ聽く人々が期待するやうになつて、いつと無くさういふ機會を供與したもので、說話そのものは兼て久しく此界隈に浮遊して居たことは、ちやうど又關東奥州の山田といふ土地に行つて、再び土着するに至つた事情も同じであらうと思ふ。歌によつて好い女房を得たといふ話は、いづれ菖蒲の源三位賴政、もしくは梶原源太などが是よりも遙かに古い。これを換骨奪胎することは素人にも出來たことかも知らぬが、尙自分などは是を當麻の中將姫の妹といふことから、多分は專門の歌比丘尼の所作であつたらうと想像する。斯ういふ女性の神氣が副うて語ることは、事實又大抵の田舍人には信用せられたのであつた。さて最後に今一つ、特に我々の注意を惹くことは、說話が一國のしかも僅かな年代の間に於て、次から次へと變つて行く足取りの早さである。山田白瀧の踊り音頭のやうに、一方にあれほど弘く久しく型にはまつて行はれて居るものが、尙いつの間にか新しい衣裳を着せられて、又別方面の聽衆の好みに合はうとして居たのである。能登の山田村では白瀧落ちよの綾言葉は旣に無くなつて、たゞ黑鳥の警句を興ずるのみであるが、それでも中將姫を下に見るとあるだけに、尙前の話との聯絡は認められる。越後の南蒲原郡に存する二つの例では、一つは白瀧姫とあつて山田の稻は枯れ果てるといふ歌も殘つて居るが、他の一つの方は男の名をモクズと謂ひ、贈答の歌は全くちがつて居る(加無波良夜譚一五二、一六〇頁)。よつぽど變なものだが本文の通りを拔き書きすると、娘が男を嘲けつて詠んだといふのが、天より高く咲く花に何とて戀かくもくずさんモクズは之を聞いて天より高く咲く花も散ればもくずの下になると返したので、旦那もなか〳〵よく出來たと言つて、娘を嫁にくれたといふ話である。日本
  translation: '……印象を薄めてしまった場合が多く、その結果、しばしば新しい飾りを加える必要が生まれたのではないかと思う。たとえば摂州丹生山田の千年家でも、単に、自分の家の初代の妻が普通の農民の娘ではなかったことと、その霊を長く湧き水のそばに祭っている、というだけの漠然とした記憶で満足できたなら、どれほど興味深い昔話があっても、不意に入り込んで結びつくことはなかっただろう。ただ、どうにも家の伝承が物足りず、これには必ず、もう一段深い由来やつながりがあったはずだと、まず聞き手のほうが期待するようになり、いつの間にか、そうした機会を与えたのである。説話そのものは、以前から長くこのあたりを漂っていたのだろう。これはまた、関東や奥州の山田という土地へ行き、改めて根づくに至った事情も同じだと思う。

    歌によってよい妻を得たという話は、いずれにせよ、菖蒲にまつわる源三位頼政や、梶原源太などの話のほうが、これよりはるかに古い。これを作り変えて利用することは、素人にもできたかもしれない。しかし私はなお、その女性を当麻の中将姫の妹としていることから、おそらく専門の歌比丘尼が行ったのだろうと想像する。このような女性が、神がかった雰囲気を伴って語ることは、実際、たいていの田舎の人には信用されたのだった。

    さて最後にもう一つ、とくに私たちの注意を引くのは、説話が一つの国の中で、しかも短い年月のうちに、次々と変わっていく速さである。山田白瀧の踊り音頭のように、一方ではあれほど広く長く、一定の型で行われているものが、いつの間にか新しい衣装を着せられ、別の方面の聴衆の好みにも合おうとしていたのである。能登の山田村では、「白瀧落ちよ」の言葉のあやはすでになく、ただ黒鳥の機知ある言葉を面白がっているだけである。それでも、中将姫を下に見る、とあるだけに、前の話とのつながりは認められる。越後の南蒲原郡にある二つの例では、一つは白瀧姫となっていて、「山田の稲は枯れ果てる」という歌も残っている。もう一つのほうでは男の名をモクズといい、贈答歌はまったく違う（『加無波良夜譚』百五十二・百六十頁）。かなり奇妙なものだが、本文どおりに抜き書きすると、娘が男をあざけって詠んだのは、

    「天よりも高く咲く花に、どうして恋をかけるのです、もくずさん」

    という歌で、モクズはこれを聞いて、

    「天よりも高く咲く花でも、散ればもくずの下になる」

    と返した。すると旦那も、「なかなかよくできた」といって、娘を嫁にくれたという話である。『日本……'

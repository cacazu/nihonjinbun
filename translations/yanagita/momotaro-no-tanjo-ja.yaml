  section: 海神少童
  original: '以前の通りのあばら屋だけが跡に殘つた。爺はびつくりして飛び出して見たが、もう何

    處にもハナタレ小僧樣の姿は見えなかつた。

    二薪を採る翁

    さて是からが愈、各個條の比較になるのであるが、昔話の重點は普通まん中と末の方とに

    在る如く見られて居るけれども、却つて順序を追うて始めから述べて行く方がわかり易いか

    と思ふ。第一段には話の主人公の、山に行つて薪を採つて來る爺であつたこと、是は現在の

    童話では、殆とどうでもよい事のやうに考へられて居るが、曾ては必ず斯う言はぬと昔話で

    は無いやうな、何か特別の約束ともいふべきものが有つたのでは無かつたらうか。それが先

    づ問題になつて來るのである。但し今日の實際に於ては、桃太郞以下の所謂五大御伽を始と

    し、多數の昔話は悉く山に行く爺の經驗談の形になつて居るので、此點の一致だけでは說話

    の異同を說くことが出來ない。

    たとへば三人の娘を持つて居て、其內の一人を嫁にくれようと、蛇に約束したといふ親爺、

    もしくは小鳥が腹の中に入つてから、尻で珍らしい「ぴぴんぴよ鳥」などといふ文句を、唱へ

    るやうになつたといふ屁こき爺なども、大抵は皆かち〴〵山の老人と同じに、山の畠に出て

    働いて居たらとか、山に入つて竹を伐つて居るとといふことになつて居るのである。或は舌

    切雀の如くその爺に對立して慾深婆が登場し、もしくは鼠の淨土や灰まき爺の如く、鄰家に

    今一人の意地惡爺があり、それが又雙方各一組の老夫婦ともなつて居るのは、元は單純に主

    役の良い性質を反映せしむる方法として、又は一つの教訓を裏表兩面から、念入りに說き明

    かす手段として、どこの民族でも採用した話術の改良であつたらうが、後にはさう來なけれ

    ば昔話では無いやうになり、又その對象を面白をかしくする爲に、是を敷衍した色々の滑稽

    が附添へられるやうになつた。しかしさう迄言はずとも一人の爺の心掛が變つて、折角の福

    分を取遁がす結果になつたことは、まだ他にも話し方はあつた筈である。日本でも取れども

    盡きぬ米俵の尻を叩いたら、白い小蛇が飛出してそれからはもう米が出なくなつたといひ、

    桝を洗ふと貧乏になるといふ戒めを知りながら、富貴に退屈して桝を洗つたといふ長者の話

    なども、伊豫の桝洗ひ池の傳說となつて殘つて居る。たつた一つの條件を守らなかつた爲'
  translation: '以前と同じあばら家だけが、その跡に残った。おじいさんは驚いて飛び出してみたが、もうどこにもハナタレ小僧様の姿は見えなかった。

    二　薪を採る翁

    さて、ここからいよいよ一つ一つの項目を比べていく。昔話の重点は、普通、話の中ほどと終わりのほうにあると見られているが、かえって順序を追って初めから述べるほうが、わかりやすいかと思う。最初の段階で問題になるのは、話の主人公が、山へ行って薪を採ってくるおじいさんだったということである。これは現在の童話では、ほとんどどうでもよいことのように考えられている。しかし、かつては必ずこう語らなければ昔話ではないというような、何か特別な決まりとでもいうべきものがあったのではないだろうか。まずそれが問題になる。ただし、今日の実際の話を見れば、桃太郎以下のいわゆる五大おとぎ話をはじめ、多数の昔話がすべて、山へ行くおじいさんの経験談という形になっている。そのため、この点が一致するというだけでは、物語の共通点や違いを論じることはできない。

    たとえば、三人の娘を持ち、そのうち一人を嫁にやろうと蛇に約束したという父親や、小鳥が腹の中に入ってから、お尻で「ぴぴんぴよ鳥」などという珍しい文句を唱えるようになったという屁こき爺なども、たいてい皆、かちかち山のおじいさんと同じように、山の畑へ出て働いていたとか、山に入って竹を切っていると、といった始まりになっている。あるいは、舌切り雀のように、そのおじいさんと対立する欲深いおばあさんが登場したり、鼠の浄土や灰まき爺のように、隣の家にもう一人意地の悪いおじいさんがいたり、さらには両方の家にそれぞれ老夫婦がいたりする。これはもともと、主人公のよい性質を引き立てるため、あるいは一つの教訓を表と裏の両面から念入りに説き明かすために、どの民族でも採用した、語り方の改良だったのだろう。だが後には、そうでなければ昔話ではないかのようになり、またその対照をおもしろおかしくするために、話を広げてさまざまな滑稽さを付け加えるようになった。しかし、そこまで語らなくても、一人のおじいさんの心がけが変わって、せっかくの幸運を取り逃がしたという結果には、ほかにも語り方があったはずである。日本でも、取っても取っても尽きない米俵の尻をたたくと、白い小蛇が飛び出して、それから米が出なくなったという。また、桝を洗うと貧乏になるという戒めを知りながら、裕福な暮らしに退屈して桝を洗ったという長者の話なども、伊予の桝洗い池の伝説として残っている。たった一つの条件を守らなかったため'

- id: mmt-142-01
  scan: 142
  section: 田螺の長者／かしこ淵・田螺聟入
  original: '二村の傳說は何れが正しいとも決し難く、多分兩方とも本物で無いのだらうが、兎に角に北澤村では其大蛇の腮の骨を、中野の寶仙寺へ納めたと稱し、柏木の方でも之を二つに分けて半分は寶仙寺に、他の半分の上腮は柏木の圓照寺に納められて近年まで在つた。村の雨乞の時には井の頭の池の水を汲んで來て、此蛇骨に供へて祭をした。さうして村中を持廻ると雨が降つたとも謂つて居る(以上山中共古翁談)。雨乞の行法には昔から深祕が多く、寺僧は成るべく此類の俗說の、色々流布することを望んで居た形跡はあるが、是などは或はそれ以上に、彼等の作爲が加はつて居るかと思はれて、寺の名は忘れたが他にもまだ、同じ樣な來歷をもつた蛇の頭骨を、什寶として居る寺が幾つかあつた。つまり新井氏が之を譬喩に引用する頃には、もう關東では大分有名な話であつたので、それ故に折焚く柴にも此事をも父にておはせし人に語り申しければ、珍しからぬことなれど、よき喩にもありつる哉と笑ひたまひたりき。と言つて居るのである。大蛇が小蛇の姿を假りて來たといふだけならば、ずつと古くからも話は多かつた。それが小さい爲に人に侮られて、思はぬ侵害を受けたといふなども、所謂白龍魚服以來色々の形で傳はつて居る。たゞ私が注意するのは、何度も水の中から往來して居るうちに、段々大きくなつて來たといふ話法である。かしこ淵の靈怪譚が全國に分布して、その殆と全部が此點を共通にして居るのは、或は又一つの新らしい暗示であつた。是も今一段と古風な形があつて、水の神が蜘蛛になつて人間と交通したことを、信じて說いて居た時代があるのかも知れぬ。蛙や田螺の例は旣に本文にも列記したが、尙その以外には蟹なども多くの怪談を持つて居る。さうして屢々蛇體のヌシと、水底の主權を爭はうとしたといふ傳說が有るのである。

    田螺聟入

    森口多里君の「黃金の馬」一三一頁に、又一つの別樣なる田螺の聟入譚が出て居る。前に千刈田、後に千刈田の田主があつた。旱の年に其田がすらりと乾いてしまつたので、沼の畔に行つて斯ういふことを言つた。どの田螺でもいゝから今夜一晩のうちに、おれの田に水を掛'
  translation: '二つの村の伝説は、どちらが正しいとも決めがたく、おそらく両方とも本当ではないのだろう。しかし北沢村では、その大蛇の顎の骨を中野の宝仙寺へ納めたという。柏木でも、これを二つに分け、半分は宝仙寺へ、もう半分の上顎は柏木の円照寺へ納められ、近年まであったという。村で雨乞いをする時には、井の頭の池の水を汲んできて、この蛇の骨へ供えて祭った。そして村じゅうを持って回ると雨が降ったともいう。（以上、山中共古翁の話）


    雨乞いの儀礼には、昔から深く秘められたものが多く、寺の僧侶は、できるだけこの種の俗説がいろいろ広まることを望んでいた形跡がある。しかし、この例などは、それ以上に僧侶たちの作為が加わっているかと思われる。寺の名は忘れたが、ほかにも、同じような来歴を持つ蛇の頭骨を寺宝としている寺が幾つかあった。つまり、新井氏がこれをたとえ話に引くころには、関東ではすでにかなり有名な話だった。そのため『折たく柴』にも、


    「このことも父にお話ししたところ、『珍しくはない話だが、よいたとえでもあったなあ』と笑われた」


    とあるのである。


    大蛇が小さな蛇の姿を借りて来たというだけなら、ずっと古くから多くの話があった。それが小さいために人に侮られ、思わぬ危害を受けたということなども、いわゆる「白竜魚服」の故事以来、さまざまな形で伝わっている。ただ私が注目するのは、何度も水の中から行き来するうちに、だんだん大きくなったという語り方である。かしこ淵の霊怪譚が全国に分布し、そのほとんど全部がこの点を共通させていることは、もう一つの新しい示唆となるかもしれない。これにも、さらに古風な形があり、水の神が蜘蛛となって人間と交流したことを信じて語っていた時代があるのかもしれない。蛙や田螺の例はすでに本文にも並べたが、それ以外にも、蟹などには多くの怪談がある。そして、蛇の姿の主と、水底の支配権を争おうとしたという伝説が、しばしばあるのである。


    田螺の婿入り


    森口多里君の『黄金の馬』一三一ページに、もう一つ、別の形の田螺の婿入りの話が出ている。家の前にも千刈田、後ろにも千刈田を持つ田主がいた。日照りの年、その田がすっかり乾いたので、沼のほとりへ行って、こう言った。「どの田螺でもよいから、今夜一晩のうちに、おれの田へ水を引いて――'
  notes:
  - Wikimedia Commonsの同一版正規ミラー画像142で全文・行順を照合。座標順OCRで逆転した文順を復元。
  - 末尾はスキャン143へ続く。
  - 「白竜魚服」は白竜が魚の姿になって危害を受けたという故事。千刈田は広大な田を示す表現。

  sequence: 79
- id: mmt-080-02
  scan: 80
  section: 瓜子織姫／六 瓜子姫の事業
  original: 桃太郞と瓜子姫と、二つの昔話を比べ合せて見ると、雙方一致して居るのは前半分だけで、是から後は丸で行き方が違つて居るやうに見えるが、此相異は果して最初からのものか、それとも童話になつてからの傾向が、追々にそれを著しくしたかといふことは、可なり私たちには大切な問題である。それは單に此說話の成立ちを明らかにする爲のみならず、弘く一般に我々の昔話なるものが、如何にして起り又何によつて變化したかを知る爲にも、もう少し推究して置く必要があるのである。私の觀方が若し誤つて居ないとすれば、二話は主人公の男であり女である點に於て、明らかに相對立して居るけれども、他の幾つかの異なる內容は、大抵皆それから導かれたものであつて、始終を一貫した語りごとの筋路、卽ち異常の經過を取つて人界に出現した童子が、後に成長して異常の事業を爲し遂げたといふ要點に至つては、殆ど左右一對と言つてもよい位に、一致して居たのである。次には其事業に勁敵があり又危難があつたこと、及び或種の動物の援助を受けたといふことも、注意すべき共通點だと思ふが、それは節を分つて別に述べた方がよい。何にしても後々の話し方で、力を入れようとした部分が雙方同じで無かつた爲に、愈〻變化が甚だしくなつたことは確かであるが、尙其以外にも生活慣習の推移と、背後の思想信仰の發達とによつて、話をする者自身が先づこの二つの話の、一致共通に心付かなくなつてしまつたのである。瓜子姫が大きくなつて、機を織るのが上手であつたこと、若くは每日機を織つて居たこと、それからアマノジヤクが窺ひ寄つた時に、一人でちやうど戶をしめて機を織つて居たことは、
  translation: '桃太郎と瓜子姫の二つの昔話を比べると、一致しているのは前半だけで、その後はまるで方向が違うように見える。だが、この違いは果たして初めからのものなのか、それとも、童話になってからの傾向が、次第に違いを大きくしたのか。これは私たちにとって、かなり重要な問題である。単に、この説話の成り立ちを明らかにするためだけでなく、広く一般に、私たちの昔話が、どのように起こり、何によって変化したのかを知るためにも、もう少し追究しておく必要がある。

    私の見方が間違っていないとすれば、この二話は、主人公が男と女である点では、はっきり対をなしている。しかし、そのほかの内容の違いは、おおむねすべて、そこから導かれたものだった。最初から最後までを貫く物語の筋道、つまり、普通とは違う経過で人間界に現れた童子が、成長して後に並外れた事業を成し遂げた、という要点に至っては、ほとんど左右一対といってもよいほど一致していたのである。

    また、その事業には敵や危険があり、ある種の動物の助けを受けたということも、注意すべき共通点だと思うが、それは節を分けて述べるほうがよい。ともかく、後の語り方で力を入れようとした部分が、双方で同じではなかったため、ますます変化が大きくなったことは確かだ。さらに、それだけでなく、生活習慣の移り変わりと、その背後にある思想・信仰の発達によって、語り手自身が、まず、この二つの話の一致や共通性に気づかなくなってしまったのである。

    瓜子姫が大きくなって機織りが上手だったこと、あるいは毎日機を織っていたこと、そしてアマノジャクが忍び寄ったとき、ちょうど一人で戸を閉めて機を織っていたことは、'
  notes:
  - 末尾はscan81へ続く。
  - 次のスキャンへ続く
  sequence: 80
- id: mmt-081-01
  scan: 81
  section: 瓜子織姫／六 瓜子姫の事業
  original: もう既に日向の例(九)と、奥州の一話(四)とには拔けて居るが、私は是が瓜子姫の事業であり又この昔話の骨子であつたらうと想像して居る。それは單に男子の武勇征略に相對して、女性の理想が巧思であり、技藝の精妙に在つたからといふだけで無く、又織物の工業が貴重であつて、それを能くする者が稀有であつたといふ爲でも無く、一言でいふならばそれが、同時に又宗教上の任務でもあつたからである。神を祭るには清淨なる飮食を調理するを要件とした如く、豫て優秀なる美女を忌み籠らしめて、多くの日を費して神の衣を織らしめたことは、或は我邦だけの特徴であつたかと思ふ重要なる慣習であつた。それが如何なる信仰に出たものかは、まだ我々にも明白で無いのだが、兎に角に機を織ることが上手といふのは、元は確かに神を祭るに適したといふことも意味して居た。それを後世の話し手は、先づ忘れてしまつたのである。しかも口碑の中には幾らでも、まだ其痕跡は殘つて居る。たとへば或川の靑淵の底が龍宮であり、或山奥の洞の中に女神が住みたまふといふ場合には、之を證するものは多くは深夜の梭の音であつた。めつたに其姿を見たといふことは言はぬが、稀に水中に落した斧を尋ねたなどといふ傳說があると、必ず瓜子姫のやうな美しい娘が唯一人、機を織つて居るのを見たことになつて居る。其他鶴女房又は鸛鳥女房の昔話、卽ち恩に感じた或鳥類が、女の姿になつて來て家を富ませてくれたといふ話でも、殆と皆織機が巧みであつて、しかも毛衣とか錦とか尋常の家には用の無いやうな貴品を製して居る。家々日用の衣料を製するには、元はハタといふものを使はなかつたか、但しは又それ等は物の數で無かつたのか。何にもせよ織姫といへば神に仕ふる少女であり、後には祀られて從神の一に列すべき巫女であつた。其女が清からず又愼まざれば、神の祭は完全に行ひ得なかつたのである。是が我々の祖先に取つて、武夫の勝利に匹敵すべき大事業であつたことは、少しの疑ひも無いのである。遠い神代の忌機殿の物語を始として、その機織には障碍の多いものと考へられて居た。それを押切つて大切なる神の衣を織り上げることが、か柔い女性の勝利であつた。桃太郞の勝利はそれよりも遙かに積極的で、又花やかなものであつた上に、後には餘りにも手輕に其成功を說くやうになつたけれども、相手が鬼であり又多勢である以上は、やはり色々の危難と戰はなければならなかつたことは、それこそ言外に明らかなのである。現に「一寸法師」の今
  translation: 'すでに日向の例（九）と奥州の一例（四）では抜け落ちている。しかし私は、これこそ瓜子姫の事業であり、この昔話の骨格だったのだろうと考えている。

    それは、単に男性の武勇や征服に対し、女性の理想が巧みな工夫や技芸の精緻さにあったから、というだけではない。また、織物づくりが貴重な技術で、それに巧みな人がまれだったからでもない。一言でいえば、それは同時に、宗教上の務めでもあったからである。

    神を祭るには、清浄な飲食物を調理することが必要とされたのと同じように、あらかじめ優れた美女を忌み籠もらせ、長い日数をかけて神の衣を織らせた。これは、あるいは日本だけの特徴かと思われる、重要な慣習だった。どのような信仰から出たものかは、まだ私たちにも明らかではないが、ともかく、機織りが上手だということは、もとは確かに、神を祭るのに適していることをも意味していた。後世の語り手は、まずそれを忘れてしまったのである。

    それでも伝承には、その痕跡がまだいくらでも残っている。たとえば、ある川の青い淵の底が竜宮であるとか、山奥の洞窟に女神が住むとかいう場合、それを裏づけるものは、多くは深夜に聞こえる杼の音だった。めったに、その姿を見たとは言わないが、まれに、水中に落とした斧を探しに行ったといった伝説があると、必ず瓜子姫のような美しい娘が、ただ一人、機を織っているのを見たことになっている。

    そのほか、鶴女房やコウノトリ女房の昔話、つまり、恩を感じた鳥が女の姿になってやってきて、家を豊かにしてくれたという話でも、ほとんどすべて、機織りが巧みである。しかも、毛衣や錦など、普通の家には用途のないような貴重品を作っている。家々で日常着る衣料を作るには、もとはハタというものを使わなかったのか。それとも、そうした衣料は、取り立てて問題にされなかったのか。

    ともかく、織姫といえば神に仕える少女であり、後には祭られて、付き従う神々の一つに列せられるはずの巫女だった。その女が清く、慎み深くなければ、神の祭りを完全に行うことはできなかった。それが私たちの祖先にとって、武人の勝利に匹敵する大事業だったことは、少しも疑いない。

    遠い神代の忌機殿の物語をはじめ、その機織りには多くの妨害があるものと考えられていた。それを乗り越え、大切な神の衣を織り上げることが、か弱い女性の勝利だった。桃太郎の勝利は、それよりはるかに積極的で、華やかでもあり、後には、あまりにも簡単に成功したように語られるようになった。けれども、相手が鬼で、しかも多勢である以上、やはりさまざまな危険と闘わなければならなかったことは、まさに言うまでもなく明らかである。実際、「一寸法師」の現在'

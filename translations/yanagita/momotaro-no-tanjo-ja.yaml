- id: mmt-052-01
  scan: 52
  section: 海神少童
  original: 'の差があつた。さうして日本といふ島帝國は、無意識ながらもその最も安全なる實驗場の一

    つであつたのである。

    鳥が黃金の卵を生んだといふ話なども、曾ては信じ傳へた時代が我邦にもあつたと見えて、

    手毬歌の章句には今も殘つて居るが、說話の領分からは夙に消え去つて、其代りかと覺しき

    ものが行はれて居る。之に反して我々の「小さ子」は、つい近い頃まで尙一部の信仰であつた。

    それが忽然と成長して、人間の最も偉大なる者となつたといふことも、不思議ではあるが、

    笑ふべきことでは無かつたのである。然るに御伽の「一寸法師」が世に行はれた頃から、他の

    多くの靈童譚にはもう之を說かなくなり、少なくとも京都の文雅の及ぶ範圍に於ては、之を

    新たなる一つの境目として、

    皿で食はせば皿の大さだけ、鉢で食はせば鉢の大さだけ、每日々々大きくなつて行つた。

    などといふ話し方は、古臭いものになつてしまつた樣に思はれる。さうなつて來ると只の女

    の腹から生れる以外に、此種の英雄の出現を想像することは容易でない。從うて申し兒生れ

    替りの口碑のみは益〻多く、桃太郞は乃ち童話化せざるを得なかつたのである。是が說話の

    最初からの形で無かつたのは勿論、その變化の始まつたのもさまで古い事で無かつたことは、

    地方に保存せられて居た色々の類例以外に、別に文書の側からも之を窺ふことが出來る。中

    世の册子類ではこの小さ子のことを、心得童子とも如意童子とも謂つて居る。佛者の方では

    之を天童護法などと謂つたらしいが、名義は異なつて居ても其言ひ傳へは互ひによく似て居

    た。つまりは神靈に惠まるゝ人の處へ、派遣せられて來た小さな神使であつた。北亞細亞各

    地のシヤマンたちは、今でもまだ自分の親しくして居る天上の神から、一人以上の侍僮を乞

    ひ受けて、それを人間と神との間の走り使ひにして居るといふことで、此信仰は決して我々

    の昔ばかりに、限られたものでは無かつた。心得童子のことは以前「神を助けた話」といふ小

    著の中にも、稍詳しく之を說いて見たことがあるが、日本の昔話に於ては、北方巫覡の使

    役して居る者以上に、何でもかでも主人の意を體して、未だ命を下さざるに先だつて、いち

    はやく其希望を充たしたとさへ言はれて居る。人を富貴にする手段の如きも、一通りや二通

    りで無かつたのは當然のことである。昔話はそれを實例によつて說かうとしたが故に、興味

    ある話術の變化は、最初先づ此部分に於て試みられ、後は追々に當の本人の身の上にまで延'
  translation: 'の違いがあった。そして、日本という島の帝国は、意識されてはいなかったものの、その最も確実な実験場の一つだったのである。

    鳥が黄金の卵を産んだという話なども、日本でもかつては信じ伝えられた時代があったらしく、手毬歌の歌詞には今も残っている。しかし、物語の領域からは早くに消え去り、その代わりと思われるものが伝わっている。これに対して、私たちの「小さ子」は、ごく最近までなお、一部の人の信仰だった。それが突然成長して、人間の中でも最も偉大な者になったということも、不思議ではあっても、笑うべきことではなかったのである。ところが、おとぎ話の「一寸法師」が世に広まった頃から、ほかの多くの霊的な子供の話では、もうこのことを語らなくなった。少なくとも、京都の洗練された文化が及ぶ範囲では、この時期を新たな境として、

    皿で食べさせれば皿の大きさだけ、鉢で食べさせれば鉢の大きさだけ、毎日毎日、大きくなっていった。

    などという語り方が、古くさいものになったように思われる。そうなると、普通の女性の腹から生まれる以外に、この種の英雄の登場を想像することは難しい。したがって、祈って授かった子や生まれ変わりの言い伝えばかりがますます増え、桃太郎は童話にならざるをえなかった。

    これが物語の最初からの形でなかったことはもちろん、その変化が始まったのも、それほど古いことではなかった。それは、各地に保存されていたさまざまな類例だけでなく、別に文書の側からもうかがえる。中世の冊子類では、この小さ子のことを「心得童子」とも「如意童子」とも呼んでいる。仏教者はこれを「天童」「護法」などと呼んだらしいが、呼び名の意味は異なっていても、言い伝えは互いによく似ていた。つまり、神霊に恵まれる人のところへ派遣されてきた、小さな神の使いだったのである。北アジア各地のシャマンたちは、今でも、自分の親しくしている天上の神から一人以上の従者をもらい受け、人間と神との間を行き来する使いにしているという。この信仰は、決して私たちの過去にだけ限られたものではなかった。

    心得童子については、以前『神を助けた話』という小著の中でも、いくらか詳しく説明したことがある。日本の昔話では、北方の巫者が使っている者たち以上に、何事にも主人の意向をくみ取り、命令が出される前に、いち早く希望をかなえたとさえいわれている。人を裕福にする方法も、一通りや二通りではなかったのは当然である。昔話は、それを具体例によって説明しようとしたので、おもしろい語り方の変化は、まずこの部分で試みられ、後には次第に、その当人の身の上にまで広'

  section: 桃太郎の誕生／七 妻もとめ
  original: して旣に年久しいけれども、我々の祖先の間には此說話は曾て弘く流布して居たらしいのである。大和の三諸岳の靈神との因縁を語り傳へて居た小子部連氏は、其家名の由來として別の說を錄進して居るが、日本靈異記の最初の數條を讀んで見ると、同じ語部は又頭に蛇を纏はせた靈童の誕生をも說いて居て、上代の小さ子譚を管理した者は、此家も亦その一であつたことが察せられる。私は曾てこの問題を細叙して、古傳も時あつて信ずべからざる場合があるといふ說を立てた(參照「民族」二卷四號。若宮部と雷神)。それはまだ十分なる論據とは言はれぬか知らぬが、少なくとも小さ子出現の昔話は古かつたのである。それから尙一方の惰け者と貧乏人とが、美しい上臈を妻に獲た話、是も同じく太郎といふ名を以て日本に行はれて居る。古い記錄では物草太郞の草子、枕もとの團子も拾つて食はうとせぬ位のヅク無しであつたが、後によき妻を得、且つ立身して更に神となつた。鄰の寢太郞を聟にとれといふ話などは、私たちも小さい時から聽いて居るが、周防ではそれが寢太郞荒神の緣起と化して土着して居る。沖繩では是とよく似た話が遺老說傳に出て居り、更に溯つて宇治拾遺の「あめが下のみめよし」などは、二目と見られぬ面をしたならず者であつた。是が何れも皆安々と長者の聟になる話であつて、言はば身に負はぬ大望とその案外な成就が、よほど夙くから說話興味の中心をなして居たのである。此方の類例ならば外國にも幾つかを見付け得られる。勿論笑話となつてからは之をもてはやした動機も變つたらうが、何にもせよ是だけの結構を敢てし得ざる人々が、旣に話の趣意を忘れてしまつても、尙久しく之を語り傳へて居たのだから、其一つ以前の起りといふものが無くてはならぬのである。西洋の學者たちには、非常な勞苦を以てこの根源を突留め、且つ之を證明しようとして居る人も多いやうだが、氣の毒ながらあちらにはもう其資料が乏しくなつて居る。之に反して我々の方では、まだ幸ひに同じ母語の圈內に、色々の比較に供すべき活きた昔話をもつて居る。活きたといふことは昔話には似つかはしくないが、兎に角純乎たる文藝の目途から、之を改作しようとした者の無かつた話し方が今尙凡人大衆の間には傳はつて居るのである。橋はもう無くとも飛石だけは有る。我々はそれを踏んで神話の彼岸まで渡つて行けるのである。最も簡單な一語で結論を下すならば、斯ういふ昔話の起りは古かつた。卽ち或る最高の意思もしくは計畫の下には、貧しい大工の女房の腹からでもイエス·キリストは生れ得たと同樣に、
  translation: '……れて久しいが、私たちの祖先の間では、かつて広く伝わっていたらしい。大和の三諸岳の霊神との関わりを語り伝えていた小子部連氏は、その家名の由来として別の説を記録して朝廷に提出している。しかし『日本霊異記』の初めの数条を読むと、同じ語部が、頭に蛇を巻きつかせた霊童の誕生をも語っており、古代の小さ子の話を守り伝えた者の一つが、この家だったと察せられる。私は以前、この問題を詳しく述べ、古い伝えもときには信じてはいけない場合があるという説を立てた（『民族』二巻四号「若宮部と雷神」参照）。それはまだ十分な論拠とはいえないかもしれないが、少なくとも、小さ子が現れる昔話は古かったのである。

    また一方には、怠け者や貧乏人が美しい上臈を妻に得た話があり、これも同じく「太郎」という名で日本に伝わっている。古い記録には「物草太郎」の草子がある。枕もとの団子さえ拾って食べようとしないほどのずくなし、つまり無精者だったが、のちによい妻を得て、出世し、さらに神となった。「隣の寝太郎を婿にせよ」という話などは、私たちも小さいころから聞いている。周防ではそれが寝太郎荒神の縁起となって、土地に根づいている。沖縄では、これによく似た話が『遺老説伝』に出ている。さらにさかのぼると、『宇治拾遺物語』の「あめが下のみめよし」などは、二度と見たくないような顔をしたならず者だった。これらはどれも、たやすく長者の婿になる話である。いわば身のほどに合わない大望と、それが意外にも実現することが、かなり早くから説話の面白さの中心になっていたのである。こちらの類例なら、外国にもいくつか見つけられる。もちろん笑い話になってからは、人気を集める理由も変わっただろう。それでも、ともかくこれほどの筋立てを自分では作れない人々が、すでに話の趣旨を忘れてしまっても、なお長く語り伝えていたのだから、そのさらに前の起源がなければならない。西洋の学者たちには、たいへんな苦労をしてこの根源を突き止め、証明しようとする人も多いようだ。だが気の毒ながら、あちらにはもうその資料が乏しくなっている。それに対して私たちには、幸いまだ同じ母語の範囲内に、さまざまな比較に使える生きた昔話がある。「生きた」という言葉は昔話には似合わないが、ともかく純粋な文芸上の目的から作り変えようとした人のいなかった語り方が、今なお普通の大衆の間に伝わっているのである。橋はもうなくても、飛び石だけはある。私たちはそれを踏んで、神話という向こう岸まで渡っていける。ごく簡単に一言で結論を述べるなら、こうした昔話の起こりは古かった。つまり、ある最高の意志や計画のもとでは、貧しい大工の妻の腹からでもイエス・キリストが生まれえたのと同じように、……'
  notes:
  - 冒頭・末尾は前後のスキャンへ続く。
  - 「上臈」は身分の高い女性を指す歴史語。
  - 容姿を低く評価する表現は原文の記述であり、訳者の評価ではない。

  section: 隣の寝太郎／二 長者の婿・三 奥州のならず者
  original: 方が勿論重要である。然るにこの寢太郞の話ばかりは、唯一つの長州の例を除く外、妙に求婚手段の成功の方に力を入れて說くものが多い。私の想像では、是は此說話が夙に眞面目なる信仰生活から脫出して、專ら好笑を目的とするおどけ話の領域に入つて來た爲で、話術發達の二つの經路は、偶然に此方面からも窺ひ知ることが出來ると考へる。以前はたゞ田螺の子や一寸法師のやうに、人間の目からは到底物になるまじく見えるものでも、天分神意乃至は隱れたる約束の存する限り、斯程の難事業を安々と爲し遂げたといふ例であつたのかも知れぬが、後には却つてその信じ難い「意外」に興味を感じ、更に一段の誇張を添へて、愈々空想の新たなる自由を、樂しむことになつたのかと思ふ。越後八石山の豆の木が日を蔽うた話、若くは鴨取權兵衞が鴨と共に空を飛んだ話などは、如何なる上代にも神話として受入れられたわけが無い。それが少なくとも今日の形にまで成長したのは、聽き手も話し手も共に澤山の實驗を積んで、人生が必ずしも神話の說き示す通りで無いことを、知り切つてから後のことであつた。謂はば醒めたる者の新らしい夢であつた。寢太郞立身の昔話の如きも、恐らくは亦この昔の信仰の隙間から、萠え出でたる文藝の芽生であつて、問題は單にどれだけが元の姿、何を種にして斯ういふ類の大話が、波のまに〳〵生ひ茂ることになつたかに在ると思ふ。ウソにも一定の限界のあつたといふのは、考へて見ると面白いことである。なまけ者が突如として長者の聟になるといふ樣な、極度に不可能なる空想にまで、尙全國共通の順序樣式の如きものがあつたのは、つまり話を聽かうとする者の要求が、最初は今よりも遙かに强く、話をする者を拘束して居たからで、うそつきは特に實害を此世に殘さない用心から、出來るだけ、容易に人がウソだと心付いて、共々に笑ひ得るやうな話をした。是が我々の昔話のいつ迄も同じ筋を走つて、斯ういふ有り得べからざる滑稽の中からでも、尙最初の眞面目なる姿を、髣髴し得られる理由であらうと思ふ。三奥州のならず者座頭がおどけ話の改作に參與したことは、少くとも近世普通の例ではあつたが、果してそれが何れの時代から始まつたかは、どうもまだ確かに知ることが出來ない。さうして此話の
  translation: '……ほうが、もちろん重要である。ところが、この寝太郎の話に限っては、長州の一例を除き、妙に求婚の策略が成功するほうに力を入れて語るものが多い。私が想像するには、これはこの説話が早くから真剣な信仰生活の外に出て、ひたすら笑いを目的とするおどけ話の領域に入ってきたためである。語りの技術が発達した二つの道筋は、たまたまこの方面からもうかがい知ることができる、と考えている。以前はただ、田螺の子や一寸法師のように、人間の目には到底役に立ちそうもないものでも、生まれつき与えられた力や神の意志、あるいは隠された約束があるかぎり、これほど難しい事業をやすやすと成し遂げるという例だったのかもしれない。しかし後には、むしろその信じがたい「意外さ」に興味を感じ、さらに誇張を加え、ますます新しく自由な空想を楽しむようになったのだろうかと思う。越後の八石山で豆の木が太陽を覆った話や、鴨取り権兵衛が鴨とともに空を飛んだ話などは、どんな古代にも神話として受け入れられたはずがない。それが少なくとも現在の形にまで成長したのは、聞き手も語り手も数々の経験を重ね、人生が必ずしも神話の語るとおりではないと、すっかり知った後のことだった。いわば、目覚めた者が見る新しい夢だったのである。寝太郎が出世する昔話も、おそらくはまた、この古い信仰の隙間から芽を出した文芸であろう。問題はただ、どこまでがもとの姿であり、何を種としてこうした大ぼら話が、波に従うように生い茂るようになったのか、というところにあると思う。

    嘘にも一定の限界があったというのは、考えてみると面白いことである。怠け者が突然長者の婿になるという、きわめて実現しがたい空想にまで、なお全国に共通する筋運びや型があった。これは、話を聞こうとする人の要求が、初めは今よりはるかに強く、語り手を縛っていたからである。嘘を語る人は、とりわけ現実の世の中に害を残さないように気をつけ、できるかぎり、人がたやすく嘘だと気づき、一緒に笑えるような話をした。私たちの昔話がいつまでも同じ筋をたどり、このようなありそうもない滑稽な話の中にも、なお最初の真剣な姿をおぼろげに見いだせるのは、そのためだろうと思う。

    三　奥州のならず者

    座頭がおどけ話の作り変えに加わったことは、少なくとも近世には普通のことだった。しかし、それがどの時代から始まったのかは、どうしてもまだ確かにはわからない。そして、この話が……'
  notes:
  - 冒頭はscan146末尾、末尾はscan148冒頭に続く。
  - 座頭は当時の盲人の語り手・芸能者の呼称。著者の推論を断定に改めず訳した。

- id: mmt-023-01
  scan: 23
  section: 桃太郎の誕生／五 赤本の災厄・六 桃と瓜
  original: 'うて同胞國民の間に、其原因を探り求むべきものであつたらう。見遁すことの出來ない一つの事實は、此點が兼て我々の固有信仰の、可なり大切なる一つの信條であつたことである。玄同放言などには和漢の多くの書を引いて、桃の中から桃太郞の生れる原理のやうなものを說明せんとし、それに推服した人も折々あつた樣だが、假にそんな想像が正しかつたとしても、實際は大したことで無かつた。不思議な赤ん坊は必ずしも常に、桃の中からばかり飛出して居たのでは無いからである。瓜子姫の昔話は少なくとも桃太郞と同時に並び行はれ、九州中國にも稀に傳はり、東日本は殆と到る處に保存せられて居た。たゞそれが文筆の士に採錄せられなかつた故に、人が久しく是に心付かなかつただけで、其代りには又所謂五大御伽噺に見るやうな、新奇なる潤色を受けずにも濟んだのである。

    六桃と瓜

    奥州に行はるゝ瓜子姫などは、其發端がよほど竹取のかぐや姫と近くなつて居て、末は今一つの可なり重要なる說話に繫がつて居る。紫波郡の例を見ると、爺と婆が嫁入支度を調へに町へ行つた留守に、瓜子姫は一人で佳い音を立てて機を織つて居る。そこへ山姥がやつて來て作り聲をして、指の入るだけでよいから戶を開けろといふ點は、グリムの狼と小羊やぺロールの赤頭巾などともよく似て居る。此山姥は他處ではアマノジヤクともなつて居るが、それが姫を殺して小豆餅をこしらへ、自分は姫に化けて其餅を還つて來た爺と婆とに食はせ惡口を言つて逃げて行くところは卽ちかち〳〵山であつて、別の多くの例に於ては雀鴉又は鶏が啼いて事實を親たちに教へ、卽座にアマノジヤクは復讐せられたことになつて居る。姫はそれと同時に多分復活するといふのが本の話し方であつたらう。今でも樹の梢に縛られて居たのを、助けおろされたといふ風に話す例も少なくは無い。さてこの大きな瓜と大きな桃、それが水上から浮いて流れて來たといふことは、小兒には素より感じのよい言葉には相違ないが、要點は寧ろ「大きな」といふことでは無かつたやうである。元は恐らくは桃の中から、又は瓜の中から出るほどの小さな姫もしくは男の子、卽ち人間の腹からは生れなかつたといふことと、それが急速に成長して人になつたといふこと、私たちの名けて「小さ子」物語と言はうとするものが、この昔話の骨子であつたかと思ふ。後'
  translation: '……がって、その原因は同じ日本の人々の間に探し求めるべきものだったのだろう。見逃せない一つの事実は、この点が、かねてから日本固有の信仰の、かなり大切な信条の一つだったことである。『玄同放言』などは、日本と中国の多くの本を引いて、桃の中から桃太郎が生まれる原理のようなものを説明しようとしている。それに感服した人も、ときおりいたようだ。だが、仮にそうした想像が正しかったとしても、実際にはたいしたことではなかった。不思議な赤ん坊は、必ずしもいつも桃の中からだけ飛び出していたわけではないからである。「瓜子姫」の昔話は、少なくとも桃太郎と同時に並んで伝えられ、九州や中国地方にもまれに伝わり、東日本ではほとんど至るところに保存されていた。ただ、文筆家に採録されなかったので、人々が長く気づかなかっただけである。その代わり、いわゆる五大おとぎ話に見られるような、新奇な脚色を受けずにも済んだのである。

    六　桃と瓜

    奥州に伝わる「瓜子姫」などは、その始まりが『竹取物語』のかぐや姫にかなり近くなっていて、後半はもう一つの、かなり重要な説話につながっている。紫波郡の例では、爺と婆が嫁入り支度を整えに町へ出かけた留守に、瓜子姫は一人で、よい音を立てて機を織っている。そこへ山姥がやってきて、声色を使い、指の入る分だけでよいから戸を開けろという。この点は、グリムの「狼と小羊」やペローの「赤頭巾」などにもよく似ている。この山姥は、ほかの土地ではアマノジャクともなっている。それが姫を殺して小豆餅を作り、自分は姫に化けて、帰ってきた爺と婆にその餅を食べさせ、悪口をいって逃げていくところは、つまり「かちかち山」である。別の多くの例では、雀やカラス、あるいはニワトリが鳴いて親たちに事実を知らせ、ただちにアマノジャクが仇討ちに遭うことになっている。姫はそれと同時に、おそらく生き返るというのが、元の語り方だったのだろう。今でも、木の梢に縛られていたのを助け下ろされた、というように語る例も少なくない。

    さて、この大きな瓜と大きな桃が、川上から水に浮かんで流れてきたというのは、子どもにはもちろん感じのよい言葉に違いない。だが、重点はむしろ「大きな」ということにはなかったようである。もともとはおそらく、桃や瓜の中から出てくるほど小さな姫や男の子、つまり人間の腹からは生まれなかったということと、それが急速に成長して人になったということ、私たちが「小さ子」物語と名づけようとするものが、この昔話の骨組みだったのだと思う。後……'
  notes:
  - 冒頭・末尾は前後のスキャンへ続く。
  - 「小さ子」は、異常に小さな姿で現れる神や子どもを指す著者の用語として保持。

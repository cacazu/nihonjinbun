  sequence: 107
- id: mmt-103-01
  scan: 103
  section: 瓜子織姫／天之探女
  original: '退散したなどといふ話がある。信州遠山の程野の助作といふ狩人の逸話として傳はつて居る

    のは、或時本谷の山に入つて芝生の上に午睡をして居て、高い聲で呼ぶ者があるから目を醒

    ますと、岩の上に眼の赤い大男が、自分をぢつと見詰めて居たが、先づ第一番にサトリのわ

    つぱといふ物を投掛けた。さうして腹の內に思ふことを次々に言ひ當てる。いよいよ急場と

    心得て取つて置きの黃金の彈丸を出しかけると、ちやんと又其決意を見拔いて、此事口外す

    るなと言つて立退いたが、あとには徑一尺もある足跡が殘つて居た。助作臨終の床に於て始

    めて人に語つたとも傳つて居るが(民族三卷一四二頁)、面白いことには其「サトリのわつぱ」

    といふのが、自ら跳ねて山人の鼻を彈いたといふ、檜の長へぎのことであつたらしいのであ

    る。卽ち昔話は山村を行き廻つて、次々に其形を變化させたけれども、尙當初の要點であつ

    たものは殘つて居た。卽ち斯んな偶然の出來事に待つより外、他には之を追拂ふ手段も無い

    位に、人をからかひに來る奧山の恠物の、よく〳〵始末の惡いものと考へられて居たので、

    是も恐らくは多くの昔話と同樣に、まだ人間の一向に幼なかつた頃の印象が、子供を通じて

    永く保存せられて居た結果かと私は思ふ。

    我々の國語に於ては、樹精山魈に對比すべきコダマ又はヤマヒコが、今尙反響の意味に用

    ゐられて居る。彼等は必ずしも頻々と其姿を現ぜず、先づ遠くから人間の耳に向つて挑戰し

    て居たのである。是を單純なる自然の現象なりと、解し知る迄の間の我々の感覺は、たゞ小

    兒のみがまだ之を記憶して居る。或はこの山彥に對する黄昏の不安を、かのサトリ男やヤマ

    ンボの話とは、別のことである樣に思ふ人が有るかも知れぬが、二つの點に注意すると其誤

    りはやがて釋ける。其一つは前代人の生活に內外の差が少なく、我々は常に高聲に物を考へ

    て居たこと、二つには所謂口合戰の始まりが、大抵は物眞似を武器として居たことである。

    敵を制せんとする罵りや笑ひ聲が敵に嘲けられ、乃至は退いて我心に語らうとする獨り言が

    眞似られると、成人でも多くは怒り、子供はしまひには泣き出す者もある。中世の軍記など

    を見ると、實際にも此武器がよく用ゐられて居た。少なくとも相手が我力を憑み、此方を輕

    んじて闘爭を辭せざることを表示して居た。心の弱い者がそれを敵飛行機の尾羽の音を聽く

    樣に、怖れをのゝいたのは當然のことであつた。それ故にこの山鄕の昔話の一つが、最初山

    の魔物の際限も無い口返しに始まり、次には內心の弱味を見透かされることになつて、末は'
  translation: '退散したという話もある。信州遠山の程野にいた助作という猟師の逸話として伝わっているのは、こんな話だ。あるとき本谷の山に入り、芝生の上で昼寝をしていると、大声で呼ぶ者がいた。目を覚ますと、岩の上に目の赤い大男がいて、自分をじっと見つめていたが、まず最初に「サトリのわっぱ」というものを投げかけた。そして心の中で考えていることを、次々に言い当てる。いよいよ危急の場面だと判断し、取っておきの黄金の弾丸を出そうとすると、またその決意をちゃんと見抜いて、「このことを口外するな」と言って立ち去った。あとには直径一尺もある足跡が残っていた。助作は臨終の床で初めて人に語ったとも伝わる（『民族』三巻一四二ページ）。面白いことに、その「サトリのわっぱ」とは、ひとりではねて山人の鼻を打ったという、檜の長いへぎ板だったらしい。

    つまり、昔話は山村を巡り歩き、次々に形を変えたけれど、初めの要点だったものはなお残っていた。このような偶然の出来事を待つ以外には追い払う手段がないほど、人をからかいに来る奥山の怪物は、まったく始末の悪いものだと考えられていたのである。これもおそらく、多くの昔話と同じく、人間がまだ非常に幼い段階にあった頃の印象が、子供を通して長く保存された結果ではないかと私は思う。

    私たちの日本語では、樹木の精や山の怪物に相当するコダマ、ヤマヒコという語を、今も反響の意味で使っている。それらはいつも姿を現すとは限らず、まず遠くから、人の耳に向けて挑みかかっていたのである。それが単なる自然現象だと理解するまでに私たちが抱いていた感覚を、今も覚えているのは子供だけだ。山彦に対するこの夕暮れの不安と、サトリ男やヤマンボの話とは、別のことのように思う人がいるかもしれない。しかし、二点に注意すれば、その誤解は解ける。

    一つは、昔の人の生活では心の内と外との違いが少なく、私たちはいつも考えを声に出していたということ。二つ目は、いわゆる口喧嘩の始まりでは、たいてい物まねが武器だったということだ。相手を抑えつけようとする罵声や笑い声を逆にあざけられたり、一歩退いて自分の心に語りかける独り言をまねされたりすると、大人でも多くは怒り、子供には最後に泣き出す者もいる。中世の軍記などを見ると、実際にもこの武器はよく使われた。少なくとも、それは相手が自分の力を頼み、こちらを軽んじて戦いも辞さないことを示していた。気の弱い者が、敵の飛行機の尾羽の音を聞くように恐れおののいたのは、当然だった。

    だから、この山里の昔話の一つが、初めは山の魔物の果てしない口答えから始まり、次には心の弱みを見透かされることになり、最後には'
  notes:
  - 冒頭はscan102、末尾はscan104へ続く。
  - 一尺は約三〇センチ。
  - 「敵飛行機の尾羽の音」は原文の時代的な比喩を保持。
  - 「人間の幼かった頃」は著者の文化史観を表す表現。現代の研究上確定した説明としては扱わない。
  - 前のスキャンからの続き
  - 次のスキャンへ続く
  sequence: 108
- id: mmt-104-01
  scan: 104
  section: 瓜子織姫／天之探女
  original: '無言のうちに起つた外部の事實に由つて、辛うじて危地を脫したといふ風に話されて居たの

    も、至つて自然なる空想の展開であると共に、一方には亦他のすべての妖恠退治譚の、成長し

    て來た順序とも合致して居る。怖畏を基調とした昔話の宇宙觀が、後に壯快なる捷利の民間

    文藝と化する迄には、其中間に身の毛のよだつ樣な逃竄說話といふ一つの過程があつた。或

    は僥倖であり身に附いた幸運であり、乃至は神佛の冥助、個人の智巧といふ樣に、難を免れ

    仇を制する條件は時と共に其數を增加し、人は其間に於て追々と正しい法則を發見して、幼

    ない幻覺は逐次に笑ひの領分に推遣られたが、尙昔話の如く信ずべからざるものを樂しむ社

    會では、曾て我々の一たび經過した境涯が、淡い痕跡となつて暫らくは保存せられて居るの

    である。

    山父山姥の信仰は土地と時代によつて、可なり著しい變化があるけれども、其起原の至つ

    て古いものであることだけは、記錄の上にも幾つかの徵證がある。さうすると是が誘因の一

    つであつたサトリ男の說話なども、亦決して新らしいもので無かつたといふことは、想像し

    て差支が無い樣である。但し中部日本の稍、廣い地域に亘つて、その山彥をヤマノジヤク、或

    はアマノジヤクと謂ふ方言があり、一方には又瓜子姫の昔話に於て、山姥とアマノジヤクが

    交互に代用せられて居るといふ事實に據つて、是をも初期以來の山の神恠を代表するものの

    如く、見ようとすることは早計に失する。私などの考へて居る所では、アマノジヤクの由來

    の年久しいものであるか否かは、又一つの新らしい問題であつて、しかも是が相應に古いも

    のだといふ證據は、別に之を提供することが出來る。九州では何れの土地に行つても、今

    尙はつきりとアマンシヤグメと呼んで居る。假に內容と定義が時代につれて推移つたにして

    も、少なくとも其名稱は神代史の天之探女を承繼いだものと、いふことだけは先づ確かであ

    る。處がその天之探女の何物であるかが、極めてうろんであつたのも昨今のことでは無かつ

    た。日本書紀の一書には之を國神と記して居るのに、倭名鈔は旣に鬼魅類に編入して居る。

    後世の諸註にも或は之に從神と謂ひ、又は天稚彥の侍女であつたと解して居るが、果して萬

    葉の歌にある如く、石船に乘つて天降つた神ならば、國神であつた筈は無いので、つまりは

    今有る僅かな記錄ばかりでは、どうしても其本體を突留める途が無かつたのである。斯うい

    ふ場合にこそは民間の傳承が役に立つ。獨り瓜子姫の忌機殿を襲うて、昔話の平和幸福を攪'
  translation: '何も言わないうちに外で起こった出来事のおかげで、かろうじて危機を脱した、というふうに語られたのも、ごく自然な空想の展開である。同時に、それはほかのあらゆる妖怪退治の話が成長してきた順序とも一致する。恐怖を基調とする昔話の世界観が、のちに痛快な勝利を描く民間文芸へ変わるまでには、その間に、身の毛もよだつような逃走の話という一つの段階があった。偶然の幸運、生まれつき身についた運、あるいは神仏の見えない助け、個人の知恵や工夫というふうに、危難を逃れ、敵を抑えるための条件は、時とともに数を増した。その間に人は徐々に正しい法則を発見し、幼い幻覚は次々に笑いの領域へ追いやられた。それでも、昔話のような信じられないものを楽しむ社会には、かつて私たちが一度は通った境遇が、淡い痕跡となって、しばらく保存されているのである。

    山父・山姥に関する信仰は、土地や時代によってかなり大きく変わるが、その起源が非常に古いことだけは、記録にもいくつか証拠がある。そうすると、この信仰を成立のきっかけの一つとしたサトリ男の説話なども、決して新しいものではなかった、と考えて差し支えないようだ。ただし、中部日本の比較的広い地域に、山彦をヤマノジャク、またはアマノジャクと呼ぶ方言があり、一方、瓜子姫の昔話で山姥とアマノジャクが互いに置き換えられているからといって、アマノジャクも初期以来の山の神怪を代表するものだとみなすのは、早計である。

    私の考えでは、アマノジャクの由来が古いかどうかは、もう一つ別の問題だ。そして、これが相当に古いことを示す証拠は、別に挙げることができる。九州では、どこへ行っても、今なおはっきりアマンシャグメと呼んでいる。仮に内容や定義が時代とともに移り変わったとしても、少なくともその名前が、神代の物語に出てくる天之探女を受け継いだものだという点は、まず確かである。

    ところが、その天之探女が何者なのか、きわめて不確かだったのも、最近に始まったことではない。『日本書紀』の異伝の一つには国神と記されているのに、『倭名鈔』ではすでに鬼魅の類に分類されている。後世の注釈には、従者である神とするものや、天稚彦の侍女だったと解釈するものもある。しかし、本当に『万葉集』の歌にあるように、石船に乗って天から下った神であるなら、国神だったはずはない。つまり、今残っているわずかな記録だけでは、どうしてもその本体を突き止める方法がなかったのである。このような場合こそ、民間の伝承が役に立つ。瓜子姫の忌機殿を襲い、昔話の平和や幸福をかき'
  notes:
  - 冒頭はscan103、末尾はscan105へ続く。
  - 国神は地上の土地に属する神。天から下る神との区別がこの議論の要点。
  - 忌機殿（いみはたどの）は、神事のため忌み清めて機を織る建物。ここでは瓜子姫の機織り場をその語で表している。
  - 前のスキャンからの続き

- id: mmt-078-01
  scan: 78
  section: 瓜子織姫／五 驚くべき成長
  original: 貧しい百姓の家で、假令不思議に拾ひ上げた子であらうとも、直ちに其名をヒメと付けたといふのは、之を「貴き子」と信じて居た結果で無ければならぬ。桃太郞の太郞にもさういふ意味があつたのか知れぬが、今は少なくとも何人にも氣付かれぬやうになつて居る。併し斯ういふ習俗は獨り昔話の上に遺つて居るのみならず、實際の歷史に於ても見出され得ることであつた。例へば王でも何でも無い武家又は其以下の家で、生れた子を何王丸と名け、もしくは何若といふ童名が普通になつたのも、流行の根原は恐らくは亦この申し兒の風であつた。卽ち禱を容れたまひし神の王子、又は若子に准じ得る子であつた故に、そんな名を付けても僭越で無く、後には又之を以て無病息災立身富貴を求むべき、普通の手段の如くにも考へるに至つたのかと思ふ。氏子といふ言葉や神前元服の慣習、それからオシラ神の養子とか地藏の奉公人とかいふ類の珍らしい契約も、たゞ此方面ばかりから說明し得られるものであつた。武州熊谷の奴稻荷のことは、前にも一度公表したことがあるが、此神に願掛けして小兒の無事を禱る人は、たつた一つの條件として決して其子を叱つてはならぬのであつた。それが何故であるかはもう說明し得る者も無くなつた。昔話の方でも此點は輕く取扱はれるやうになつたが、曾て神授と解する信仰が無かつたならば、姫と名けるわけは何としても無かつたのである。說話は右の如く、絕えず重點ともいふべきものが移つて居た。之を最初から今ある形式を以て語られて居たと見る人は、いつでも誤つた斷定に陷らずには居らぬであらう。其中でも大切な一つの箇條は、瓜子姫に於てその瓜の中の赤子が、急に大きくなつて人間の通りになつたといふことでなければならぬが、普通の童話では桃太郞も同じやうに、殆と其部分を素通りしようとして居る。稀に或は「一寸法師」の如く、力を入れて小さかつたといふ點を說かうとするものでも、其變化を單純なる打出の小槌や、如意寶珠の作用に托してしまつて、神の子だから大きくなつたといふ風には說かうとしない。併し如何に巨大なる桃でも瓜でも、其中に入つて居たといへば小さかつたにきまつて居る。それが機を織り鬼ケ島を征伐する迄になつたのは、確かに驚くべき成長である。しかも新たに外部の奇術を借らずして、自然にさうなつたと謂へば尙靈異とすべきであるが、近頃の聽き手は妙に此點には深い注意を拂はうとしなかつた。是も恐らくは童話の一つの特性であつて、童兒は自身が盛んに成長する者
  translation: '貧しい百姓の家である。いかに不思議な形で拾い上げた子であっても、すぐに「ヒメ」と名づけたのは、その子を「尊い子」だと信じたからでなければならない。桃太郎の「太郎」にも、そうした意味があったのかもしれないが、少なくとも今では、誰も気づかなくなっている。

    しかし、この種の習俗は、昔話にだけ残っているのではなく、実際の歴史の中にも見いだせる。たとえば、王でも何でもない武家や、それより身分の低い家で、生まれた子に何々王丸と名づけたり、何々若という幼名が一般的になったりしたのも、その流行のもとは、おそらく、この申し児の習わしだった。つまり、祈りを聞き届けてくださった神の王子や若子に準ずる子だったので、そのような名をつけても僭越ではなかった。後には、それを、無病息災や立身出世、富貴を願う普通の手段のように考えるに至ったのだと思う。

    「氏子」という言葉や、神前で元服する慣習、それにオシラ神の養子、地蔵の奉公人といった珍しい契約も、この方面からでなければ説明できない。武蔵熊谷の奴稲荷のことは、以前に一度公表したことがある。この神に願をかけて子供の無事を祈る人には、ただ一つ、決してその子を叱ってはいけない、という条件があった。その理由を説明できる人は、もういなくなった。昔話でも、この点は軽く扱われるようになった。しかし、かつて神から授かった子と理解する信仰がなかったならば、姫と名づける理由は、どうしてもないのである。

    このように、説話では、重点というべきものが絶えず移り変わっていた。最初から現在の形で語られていたと考える人は、いつも誤った断定に陥らざるをえないだろう。中でも重要なのは、瓜子姫の話で、瓜の中の赤子が急に大きくなり、普通の人間のようになった、という点であるはずだ。しかし通常の童話では、桃太郎と同様、ほとんどその部分を素通りしてしまう。まれに、一寸法師のように、小さかった点を強調する話でも、その変化を、ただ打出の小槌や如意宝珠の作用に任せてしまい、神の子だから大きくなった、というふうには語ろうとしない。

    だが、どれほど巨大な桃や瓜でも、その中に入っていたという以上、子供は小さかったに決まっている。それが機を織り、鬼ヶ島を征伐するまでになったのは、確かに驚くべき成長である。しかも、新たに外から不思議な力を借りず、自然にそうなったというなら、なおさら霊妙な出来事とすべきなのに、近頃の聞き手は、不思議とこの点に深い注意を向けなかった。これも、おそらく童話の特性の一つであり、子供は自分自身が盛んに成長する者'

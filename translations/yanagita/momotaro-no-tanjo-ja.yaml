  section: 瓜子織姫／七 瓜子姬の敵
  original: 居る。是は編者の石井研堂氏に尋ねて見なければわからぬが、私の想像では話が壞れて居たか、又は名前がある方がよいといふ考で、特に本にする際に附與した名前で無かつたかと思ふ。松村氏の日本童話集は、不幸斯くの如き標本的で無いものを、默つて日本の童話として採錄して居るが、是からでは瓜子姫の由來は考へられない。それに比べるとアマノジヤクの代りに、之を山母山姥の所業として說くものは、變化が自然であるだけに遙かに有益なる參考である。近世の俗信に於ては、アマノジヤクも亦山に住む魔女であり、所謂山の神の部類であつた。此混同の原因は大よそ判つて居る。山の反響が人間の聲を眞似るのを、小兒等は普通眼に見えぬ物の惡戲と考へて、土地に由つてこれをヤマンボとも謂へば、或は又アマノジヤクとも謂ふのである。この二つの中ではアマノジヤクの方が元であることは、此物がいつも人の言葉をもどき、人の意に逆らふのを職業のやうにして居ると、言はれて居るのを見ても想像し得られるが、何にせよ後には是を山の中に居る魔物の、一般の癖の如く解することになつたのである。妖恠がもともと空想の所產である以上、その分類差別は容易な仕事で無いが、山姥の侵害の强力犯を通例とするに反して、邪魔とか眞似とかはアマノジヤクの得意とする所であつた。さうして我々の瓜子姫譚に於ては、姫を殺して食つてしまつたといふ話と、縛つて隱して置いたといふのと兩方あるけれども、何れも姫の衣を着、姫の姿をまねて爺婆を欺かうとして、最後に其化けの皮が露れたことになつて居るのみならず、次から次へ色々の物ねだりをして、素直な氣立のよい瓜姫を苦しめたといふ點に、特に力を入れて話されて居るのが、恐らくはアマノジヤクの方が原の形であつた證據であらうと思ふ。それがいつの間にか山母山姥に變つたのは、新らしい聽衆には其方が感動を與へ易かつたからで、つまりは是も亦アマノジヤクに就ての言ひ傳へが、次第に物遠くなつた結果と言つてよい。信州下水內郡で「意地の惡い裏の家の娘」の名としたのも同じことであつた。現在東日本の弘い地域に在つては、アマンジヤクは單に女の子を罵る語としてより他は、もう使用せられて居ないのである。
  translation: 'いる。これは編者の石井研堂氏に尋ねなければわからないが、私の推測では、話が崩れていたのか、あるいは、名前があったほうがよいという考えで、本にする際に特につけた名だったのではないかと思う。松村氏の『日本童話集』は、不幸にも、このような代表例とはいえないものを、何の断りもなく日本の童話として採録している。しかし、これでは瓜子姫の由来を考えることはできない。

    それに比べると、アマノジャクの代わりに山母や山姥のしわざとして語る話は、その変化が自然であるだけ、はるかに有益な参考になる。近世の俗信では、アマノジャクもまた山に住む魔女であり、いわゆる山の神の仲間だった。この混同の原因は、おおよそわかっている。山のこだまが人の声をまねるのを、子供たちは普通、目に見えない者のいたずらと考え、土地によってヤマンボと呼んだり、アマノジャクと呼んだりするのである。

    この二つのうちでは、アマノジャクのほうがもとだったことは、これがいつも人の言葉をまね返し、人の意に逆らうことを仕事のようにしている、と言われることからも推測できる。いずれにせよ、後には、これを山にいる魔物一般の癖のように理解するようになったのである。

    妖怪が、もともと空想の産物である以上、その種類を分けるのは容易ではない。しかし、山姥の危害が、通常は力ずくの暴力であるのに対し、邪魔や物まねは、アマノジャクの得意とするところだった。そして瓜子姫の話には、姫を殺して食べたというものと、縛って隠しておいたというものの両方がある。だが、いずれも姫の衣を着て、その姿をまね、爺婆を欺こうとしたところ、最後に化けの皮がはがれたことになっている。それだけでなく、次々にいろいろなものをねだり、素直で気立てのよい瓜姫を苦しめた点を、とりわけ強調して語っている。これが、おそらく、アマノジャクのほうが元来の形だった証拠だと思う。

    それがいつのまにか山母・山姥へ変わったのは、新しい聞き手には、そのほうが感情を動かしやすかったからである。つまり、これもまた、アマノジャクについての伝承が、次第に人々から縁遠くなった結果といってよい。信州下水内郡で、「意地悪な裏の家の娘」の名にしたのも、同じことであった。現在、東日本の広い地域では、アマンジャクは、女の子をののしる言葉として以外、もう使われていないのである。'

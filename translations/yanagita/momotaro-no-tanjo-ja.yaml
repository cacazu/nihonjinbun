  section: 隣の寝太郎／五 物草太郎の草子・六 博打婿入りの事
  original: 大話の舊來の信仰を裏切り、專ら聽く人の笑を促さうとする類の語りごとも、必ず男がするものにきまつて居た。是は單に女性の氣質や教養が、一般にそれに向かなかつたといふだけであるか。但しは又彼等が一段と神佛に接近して奉仕して居たことと、何か隱れたる關係のあるものかは、まだ我々には容易に決し兼ねるが、兎に角に技藝の分離獨立、卽ち昔話の自由なる發達は先づ此方面に始り、各種の浮かれ坊主の狂言綺語を弄する者が、年と共に其數を加へたに反して、婦人の此業に携はる者だけは、尙久しい後まで信仰と緣を絕たなかつたのである。信州の「物草太郞」が他の多くの桃太郞系說話と共通に、非常に明るい結果を以て瓜子姫系の淋しさと對立する以外、更に其求婚方法に關して、山田白瀧譚の歌問答の形式を採用して居ること、それから團子の轉んだのを地頭殿に、馬から下りて拾つてくれと賴んだといふ一條が、後世の笑話にも屢、現れて來ることなどは、共に此草子の本文の傳承者が、やはり長門の寢太郞長者の場合と同じく、惡七兵衞景淸を元祖とする盲目の徒であつたと、解して見るならば格別の不思議は無いのである。六博打聟入の事問題はさうした自由なる改作者、說話固有の趣旨を脇に差置いて、專らその可笑味にのみ力を入れ、出來るだけそれを誇張して、信仰無き俗衆に悅び聽かせようとする者が、果して何時の世から我々の邦に出現したかといふことである。田舍は兎も角も、京には其風が早く始まるべき理由もあり、又記錄の徴證も有るわけであるが、私はまだ餘り古いものに心付いて居ない。勿論昔話の種類によつて、特に笑話に化し易いものと、さうで無いものとが有つたには相違ないが、隨分眞面目な話でも、一旦我々の之を迎へる態度が變れば、如何樣にも滑稽に取扱はれ得たことは、江戶その他の近代都市の、民間文藝の趨向を見ても察せられることで、要は世の中の需要と、それに應ずる技術の進步とにあつて、最初から或一部面のみに限らるべき新現象では無かつた筈である。「惰け者の聟入」が後世の新作でも無く、又輸入でも無かつたといふ例證は、少なくとも宇治拾遺物語(國史大系本一九四頁)の中に一つ有る。筆錄の年代は少なくとも四百年ほど、物草太郞の草子よりも前だらうと思ふにも拘らず、此
  translation: '……大ぼら話のように、以前からの信仰を裏切って、ひたすら聞き手の笑いを誘おうとする語り物も、必ず男が語るものと決まっていた。これは単に、女性の気質や教養が一般にそうしたものに向いていなかった、というだけなのだろうか。それとも、女性たちがいっそう神仏の近くで仕えていたことと、何か隠れた関係があるのだろうか。それはまだ、私たちには簡単に決められない。ともかく、芸の分離独立、すなわち昔話の自由な発達は、まず男性の側から始まった。そして、浮かれ歩くさまざまな坊主で、たわむれの言葉や飾り立てた言葉を操る者が、年ごとに増えたのに対し、この仕事に携わる女性だけは、その後も長く信仰との縁を断たなかった。

    信州の『物草太郎』は、ほかの多くの桃太郎系の説話と共通する、とても明るい結末によって、瓜子姫系の寂しさと対照をなしている。それだけでなく、求婚の方法に山田白瀧の話の歌問答の形式を取り入れていることや、転がった団子を地頭殿に、馬を下りて拾ってほしいと頼んだ一節が、後世の笑い話にもたびたび現れることなどがある。これらも、この草子の本文を伝えた人が、長門の寝太郎長者と同じく、悪七兵衛景清を祖とする盲人の一団だった、と理解すれば、それほど不思議ではないのである。

    六　博打婿入りの事

    問題は、こうした自由な作り変えをする人、説話本来の趣旨を脇に置き、ただそのおかしさだけに力を入れて、できるだけ誇張し、信仰を持たない世間の人々に喜んで聞かせようとする人が、いったいいつの時代から日本に現れたのか、ということである。田舎はともかく、京都には、そうした風潮が早く始まってよい理由もあり、記録上の証拠もあるはずだが、私はまだ、あまり古いものには気づいていない。もちろん昔話の種類によって、とくに笑い話に変わりやすいものと、そうでないものがあったことは確かである。しかし、かなり真面目な話でも、いったん私たちの受け止め方が変われば、どのようにも滑稽に扱えたことは、江戸など近代の都市の民間文芸の傾向からも推測できる。要するに、世の中の需要と、それに応える技術の進歩とが問題なのであって、初めからある一分野だけに限られるべき新現象ではなかったはずである。「怠け者の婿入り」が後世の新作でも輸入でもなかったことを示す例は、少なくとも『宇治拾遺物語』（国史大系本百九十四頁）に一つある。書きとめられた年代は、『物草太郎』の草子より少なくとも四百年ほど前だろうと思われるのに、こちらの……'

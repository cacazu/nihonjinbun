- id: mmt-065-01
  scan: 65
  section: 海神少童
  original: 高井郡の傳說に、亦一つの黄金小犬の破片があつた。昔八幡長者の家の犬が、每日一升づつの小判を糞にした。それを女房の山吹御前が强慾で、强ひてその小判を三升にしようと思つて、一日に三升の米を食はせた。それでも小判を出さぬので怒つて犬を打つと、犬は走つて池に飛込んで死んだ。其池の迹といふのが今は鹽川の流れの中程にあると傳へて居る(上高井郡誌)。私が今知つて居る例は是だけだが、氣を付けて居たらまだ幾らも見つかるであらうし、見つかれば必ずそれだけは聯絡が明かになるだらうと思ふ。しかし此三つの資料からでも、若干の假定は下されぬことは無い。八幡長者と其妻の山吹は、古い語り物のごく有りふれた人の名であつた。今でも子供の手毬唄などには、折々は其名が用ゐられて居る。備前犬島で謂ふ熊野街道の渡し守なども、多分は亦さういふ章句の中で、人の耳に熟した情景であつたらう。それと結び付いて記憶せられて居た犬の話ならば、先づは中世以後の作り事であつたと、想像して置いて差支が無いやうである。ところが一方に其事實を信じて、爰が其遺蹟だといふ傳說が出來て居るとすると、それは果してどういふ事を意味するであらうか。思ふに昔話は一所不住に流傳するものであつたけれども、やはり何等かの因緣ある土地だけには、引掛つて殘る傾向を持つて居た。是が三河の犬頭の宮などに、第二の犬の傳說が入替つて居た理由であるらしい。卽ち住民は曾て靈ある犬の說話を聞知つて、それを稍〻忘れかけて居た所であるが爲に、比較的多くの注意を、次に來るものに拂つたとも考へられるのである。その以前のものが是とどれだけ迄似通うて居たかは、因より僅かな類例によつて決することも出來ぬが、少なくとも今ある府縣の昔話、其中でも新らしい文化の中心から、比較的遠ざかつて居る傳承の間に、幾らかは消え殘つたものがまだ有つて、それが一つの手掛りを供するであらうといふ望みはある。たとへば沖繩の黄金小犬が、善惡二人の兄弟の親の墓から、飛出して來て孝行な弟に幸ひしたといふなども、後に附添へられた空想の樣には思へない。この島の墓所は今日の漆喰造りになる以前、專ら天然の岩窟の中に設けられて居た。その舊習は現に或一部に痕跡を留めて居るのみならず、本州に於ても稀には其實例が殘り傳はつてゐる(人類學雜誌第五百號拙文參照)。家々の祖靈の歸り休らふ處から、再び若々しい優れた生命が、子孫の之を愛慕する者に供給せられるが如く、信じ且つ話して居た時代があつて、そ
  translation: '高井郡の伝説にも、「黄金小犬」の断片が一つあった。昔、八幡長者の家の犬は、毎日一升ずつの小判を糞として出した。ところが妻の山吹御前は欲深く、その小判を無理に三升にしようと考えて、一日に三升の米を食べさせた。それでも小判を出さないので腹を立てて犬を打つと、犬は走って池に飛び込み、死んでしまった。その池の跡が、今は塩川の流れの中ほどにあると伝えている（『上高井郡誌』）。

    私が今知っている例はこれだけだが、気をつけていれば、まだいくらでも見つかるだろう。見つかれば、その分だけ相互のつながりも必ず明らかになると思う。しかし、この三つの資料だけでも、多少の仮説は立てられなくはない。八幡長者と、その妻の山吹は、古い語り物ではごくありふれた人物名だった。今でも子供の手毬歌などに、ときどきその名が出てくる。備前の犬島で語られる熊野街道の渡し守なども、おそらくそうした語り物の一節を通じて、人々の耳になじんだ情景だっただろう。それと結びつけて記憶されていた犬の話ならば、まずは中世以降の創作だったと推測しておいて差し支えないようである。

    ところが、その一方では、それを事実と信じ、ここがその跡だという伝説ができている。これはいったい何を意味するのだろうか。思うに、昔話は一か所にとどまらず流れ伝わるものだったが、それでも何らかの縁のある土地には引っかかって残る傾向があった。これが、三河の犬頭の宮などで、もとの犬の伝説が別の犬の伝説に入れ替わった理由らしい。つまり、住民がかつて霊力のある犬の話を聞き知っていて、それを少し忘れかけていた土地だからこそ、次に伝わってきた話に比較的強い関心を向けた、とも考えられるのである。

    それ以前の話が、今の話とどの程度似ていたかは、もちろんわずかな類例だけでは決められない。ただ、少なくとも現在各府県に残る昔話、とりわけ新しい文化の中心から比較的遠く離れた土地の伝承には、まだ幾らか消え残ったものがあり、それが手がかりになるだろうという望みはある。たとえば沖縄の黄金小犬が、善人と悪人の二人の兄弟の親の墓から飛び出し、親孝行な弟に幸福をもたらした、という話なども、後から付け加えられた空想とは思えない。

    この島の墓は、今日のような漆喰造りになる以前には、もっぱら天然の岩窟の中に設けられていた。その古い習わしは、今なお一部に痕跡をとどめているだけでなく、本州にもまれに実例が残っている（『人類学雑誌』第五百号の拙文を参照）。家々の祖先の霊が帰って休む場所から、再び若々しく優れた生命が、祖先を慕う子孫に授けられる――そのように信じ、また語っていた時代があり、そ'

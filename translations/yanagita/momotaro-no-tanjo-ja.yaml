  original: れども、やはり物草太郞の伏屋の住居と一貫して居る。それから天人が爆竹を與へ、策を授けたといふ點は、恐らく亦奥州でいふ博打仲間と共に、さういふ成功が自分一人の智謀で無かつたことを、必ず語り添へて居た名殘であらうと思ふ。沖繩では今から百五十年ばかり以前、民間の說話と傳說とを集錄した遺老說傳といふ漢文の一書がある。其中にも旣に同じ話を載せて居るのであるが、それから以後の話し方の變化か。但しは又當時早くも系統を異にしたものがあつたか。兎に角に今では同じ話とも言へぬ位に、幾つもの相違を以て傳はつて居るのである。文章が長くて又六つかしいから、爰にはたゞ要點だけを引用して置くことにする。昔首里の町に、至つて貧乏なる老夫婦があつて、次良といふ一人の息子を持つて居た。次良は世にも稀なる惰け者で、食つては睡り覺めては食ひ、少しでも老いたる親の勞苦を助けようとせぬので、人は嘲つて睡蟲といふ綽名を付けた。或時その睡蟲が何を考へ付いたか、突然母親に向つて白鷺を一羽買つてくれといふ。わけを尋ねても默つて答へない。親はふびんに思つて、强ひて工面をして白鷺を求めて與へると、大に悅んでそれを隱して置き、一夜竊に神仙の容貌を裝うて、鷺を抱へて鄰の金持の家の、庭前の大榕樹の梢に登り、天帝の勅諭があるから急いで出て來いと、大きな聲を上げて喚んだ。長者夫婦が榕樹の下に行くと、此家には十六になる娘があるでは無いか。其聟になるべき者は鄰の次良より他に無い。速かに彼を呼び迎へて家を嗣がせ、親どもを養つて遣るがよい。今こそ世間から侮られては居るが、彼は誠實で又賢い男で、後には必ず此家を繁昌させる。天の御教へを背いて遲疑するならば、其罪は決して輕く無いぞと言つた。長者は驚き又喜んで、如何にも御仰せの通り、睡蟲を聟に致しましようと答へると、それでは其由を天宮に復命すべしと言つて、抱へて居た白鷺を放したので、鳥は忽ち大空に向つて飛び揚り、夫婦は愈、尊信の念を加へた云々。それから計畫の如く忽ちにして長者の聟となり、同時に又生れ更つたやうによく働く若者となつて、めでたく家富み榮えたことは、すべての寢太郞と異なる所が無いのである。此話が沖繩一島に偶然に發明せられたもので無いことだけは、次の一例が亦明かに之を證據立てる。たゞ何人が其分布に參與し、どうして分れ〳〵に保存せられて居たかといふことのみが、將
  translation: '……やはり物草太郎の粗末な小屋暮らしと一つにつながっている。また、天人が爆竹を与え、策略を授けたという点も、おそらく奥州の話の博打仲間と同じく、こうした成功は本人一人の知恵によるものではなかった、と必ず付け加えていた名残なのだろうと思う。沖縄には、今から百五十年ほど前に民間の説話と伝説を集めた、『遺老説伝』という漢文の本がある。その中にも、すでに同じ話が載っている。それ以来語り方が変わったのか、それとも当時すでに系統の違うものがあったのか、とにかく今では、同じ話ともいえないほど、いくつもの違いをもって伝わっている。文章が長く、また難しいので、ここには要点だけを引用しておく。

    昔、首里の町に、たいそう貧しい老夫婦がいて、次良という一人息子を持っていた。次良は世にも珍しい怠け者で、食べては眠り、目覚めては食べ、年老いた親の苦労を少しも助けようとしなかった。そこで人はあざけって、睡虫というあだ名をつけた。あるとき、その睡虫が何を思いついたのか、突然母親に白鷺を一羽買ってくれといった。わけを尋ねても黙って答えない。親は不憫に思い、無理に金を工面して白鷺を手に入れ、与えた。次良は大いに喜んでそれを隠しておき、ある夜、ひそかに神仙の姿に身を装い、鷺を抱いて、隣の金持ちの家の庭先にある大きなガジュマルの梢に登った。そして「天帝のお言葉があるから、急いで出てこい」と大声で呼んだ。長者夫婦がガジュマルの下に行くと、「この家には十六歳になる娘がいるではないか。その婿となるべき者は、隣の次良のほかにはいない。すぐに彼を呼び迎えて家を継がせ、親たちを養ってやるがよい。今でこそ世間から侮られているが、彼は誠実で賢い男で、後には必ずこの家を栄えさせる。天の教えに背いてぐずぐずするなら、その罪は決して軽くないぞ」といった。長者は驚くと同時に喜び、「まさしくおっしゃるとおり、睡虫を婿にいたしましょう」と答えた。すると「それでは、そのことを天の宮に帰って報告しよう」といって、抱いていた白鷺を放した。鳥はたちまち大空へ飛び上がり、夫婦はますますありがたく信じる気持ちを強くした、という。

    それから計画どおり、たちまち長者の婿になり、それと同時に、生まれ変わったようによく働く若者となって、めでたく家が豊かに栄えたことは、どの寝太郎の話とも変わらない。この話が、沖縄一島で偶然に作り出されたものではないことは、次の例がまたはっきりと証明している。ただ、誰がその広がりに関わり、どうして別々に保存されてきたのかということだけが、今後の……'
  notes:
  - 冒頭はscan149末尾、末尾はscan151冒頭に続く。
  - 睡虫は眠ってばかりいる者というあだ名。大榕樹は大きなガジュマルとして訳した。

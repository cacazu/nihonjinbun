  section: 狼と鍛冶屋の姥
  original: 遭うて、辛うじて助けられたこと、及び(三)狼の巨魁は鍛冶屋の姥であつたことが後に露はれたこと。此三つの特徴は結び付いて、今ではもう其一を缺くならば、產ノ杉の傳說とも言へぬ迄になつて居る。處が其中でも一と三との二點は、現に山中に年經る杉があり、又佐喜濱村には其鍛冶の屋敷と傳ふる地があつて、故人の考へ方から言ふと爭ふべからざる證跡が、儼として存して居たのだから、受入れないわけには行かなかつたらうが、殘りの第二の狼に襲はれたといふ部分だけは、如何にして土佐で傳說として信じられるに至つたのであらうか。是が我々の桃太郞說話の普及と關聯して、考究して見ずに居られない問題の一つである。二　犬梯子と猫の智慧所謂千疋狼の說話の起りに關しては、旣に南方熊楠氏が色々の類型を擧げて、さういふ口碑の發生し得べく、又流布し得べかりし事情を說いて居られる(民俗學二卷五號)。說話の移動といふことは日本一國だけでも、十分之を信ずべき證據があるが、たゞ其根源を記錄の古今のみによつて、推定することは無理だと思ふ故に、自分等は飜つて其末端の方の現實から、逐次に其渡來の方角を考へて行かうとして居るのである。土佐の東の境の山地に、千疋狼の說話が分布して居るといふことは、先づ其理由を究めねばならぬ眼前の事實であるが、是には幸ひにして必ずしも普通で無い三通りの特徵を具へて居る。其一つは被害者が產婦であつてしかも最後に難を免れて平產したこと。第二には狼が化けて居たのは鍛冶屋の姥で、其家址は今でも遺つて居ること。第三は最も重要な點で、爰では此說話が傳說と化して、杉の樹の根株を削つて安產の護符にする習俗と結び付いて、今も曾て有つたことのやうに考へられて居ることである。私の新たに考へて見ようとするのは主として此點で、それだけは未だ南方氏も觸れて居なかつた。簡單に自分の假定を述べると、此傳說は前に說話として諸國を流轉して居る間から、旣に幾回かの複合と變化とを經たらしい。さうしてその最も緣の深い一角を以て、偶然に野根山の產杉と結び付いたのであつて、その癒著點は數多い他の地方の類型中に、普通は伴なはれて居らぬ狼の子育ての話であつたらうと思ふが、其以外にも元來此昔話には、大木の梢に登つて難を遁れたといふ個條が必ず有る所から、山の峠路の畸形の樹などに附着して、幾分か
  translation: '遭い、かろうじて助けられたこと。そして第三は、狼の首領が鍛冶屋の姥だったと、後になって明らかになったこと。この三つの特徴は結び付き、今では一つでも欠ければ「産ノ杉」の伝説とはいえないほどになっている。ところが、そのうち第一と第三については、実際に山中に古い杉があり、佐喜浜村にもその鍛冶屋の屋敷跡だと伝える場所がある。昔の人の考え方からすれば、争いようのない証拠が厳然と存在していたのだから、受け入れないわけにはいかなかっただろう。しかし残る第二の、狼に襲われたという部分だけは、どうして土佐で伝説として信じられるようになったのだろうか。これが、私たちの桃太郎説話の普及とも関連して、考えずにはいられない問題の一つなのである。

    二　犬梯子と猫の知恵

    いわゆる「千匹狼」の説話の起こりについては、すでに南方熊楠氏がさまざまな類型を挙げ、そのような言い伝えが生まれ、広まることのできた事情を説明している（『民俗学』二巻五号）。説話が移動することには、日本一国だけでも十分に信じられる証拠がある。しかし、その根源を記録の新旧だけから推定するのは無理だと思うので、私たちは逆に、伝播の末端にある現実から、順を追ってそれが伝わって来た方向を考えていこうとしている。土佐の東境の山地に「千匹狼」の説話が分布しているのは、まずその理由を究めなければならない目の前の事実である。そして幸い、これには必ずしも一般的ではない三つの特徴が備わっている。第一は、被害者が産婦で、最後には危難を逃れて無事に出産したこと。第二は、狼が化けていたのが鍛冶屋の姥で、その家の跡が今でも残ること。第三が最も重要で、ここでは説話が伝説になり、杉の切り株を削って安産のお守りにする習俗と結び付いて、今もかつて実際にあったことのように考えられている点である。私が新たに考えたいのはおもにこの点で、そこにはまだ南方氏も触れていなかった。

    自分の仮説を簡単に述べれば、この伝説は以前、説話として諸国を巡り流れていた間に、すでに何度かの複合と変化を経験したらしい。そしてその最も縁の深い一部分によって、偶然、野根山の産杉に結び付いたのである。その接合点は、ほかの地方の多くの類型には普通付いていない、狼の子育ての話だっただろうと思う。ただそれ以外にも、もともとこの昔話には、大木の梢に登って危難を逃れたという要素が必ずあるため、山の峠道にある奇妙な形の木などに結び付き、ある程度'
  notes:
  - 「犬梯子」は狼などが互いの背や肩に乗り、梯子状になって木を登るという説話の仕掛け。

  section: 和泉式部の足袋／七 清少納言の亡霊
  original: 七清少納言の亡靈同じ一つの趣向に成る昔話を、男女二群の旅人が持運んで居たことは、斯ういふ種類の目に立つ一致が無いと、めつたに推論することが許されない。だから土地の人が章句を忘れてしまはぬうちに、出來るだけ此比較を進めて置く必要もあるのである。東北ではイダコの夫が、往々にして淨瑠璃座頭であつたけれども、彼等はいつも別々の物語を語つて居た。夫婦の語らひはしても、互ひの傳承には加擔しなかつた。それが南無藥師に於ては、僧も說き比丘尼も話しまはつて居る。誓願寺か安居院か、まだ確かに突留められないが、何かよく〳〵有力なる話の問屋が、中央には一つあつたらしいのである。此事を略,暗示して居るのは、京都で元祿の頃に刊行せられた人倫訓蒙圖彙などであらう。此時代には人が剩つて來たか、所謂職人の種類は忽ち前代に數十倍し、門附の歌念佛にも法師が亦携はつて居る。一方には又理のつんだ話などと稱して、御伽の子供噺以外にやゝ方面の變つたもの、殊に若干の文學的暗記をまじへた語りごとを、珍重する風が追々に普及して、明治の代になるまで是を情操教育の一つに算へる有樣であつたことは、勢ひ諸國修業の徒をして時の好尙を逐ひ、同じ一つの口碑の分布に、男女の力を集注せしめたのでは無からうか。婦人は或は先驅者であつたかも知れぬが、之を到る處に於て傳說に化せしめたのは彼等ばかりの活躍では無かつたやうに思はれる。といふわけは傳說は一つの主張であり、公けに外部の人に向つて、少しも恥ぢらはずに之を說く者を要したからである。それで無くては少なくとも記念碑なとは建たない。さうして今日は多くの有形無形の記念碑が建つて居るのである。なるほど傳說の解釋は普通には間違つて居る。併し地方が各自の歷史を求め、史書が存せずんば所謂野人の語に聽かうとしただけは進步であつた。兎に角にこの氣風を誘致して、今日の新國學の素地を奠定したことは、一言に要約すれば太平の化、卽ち男に弓矢兵粮の煩累が無くなつて、昔話をもてはやす心の餘裕の出來たことである。傳說は確かに此機運に乘つて、日本では近世第二次の發展を遂げて居る。さうして此方面にも亦男女の協力が有つたのである。其例を一つこゝに擧げて、もう和泉式部の一篇をとぢめようと思ふ。
  translation: '七　清少納言の亡霊

    同じ一つの趣向からなる昔話を、男性と女性という二組の旅人が持ち運んでいたことは、このような目立つ一致がなければ、めったに推論を許されない。だから土地の人がその文句を忘れてしまわないうちに、できるだけ比較を進めておく必要もある。東北ではイタコの夫がしばしば浄瑠璃座頭だったが、彼らはいつも別々の物語を語っていた。夫婦として話はしても、お互いの伝承には関わらなかった。それが「南無薬師」については、僧も説き、比丘尼も各地で語っている。誓願寺か安居院か、まだ確かには突き止められないが、中央には何か非常に有力な、話の「問屋」が一つあったらしい。これをおおよそ示唆しているのは、京都で元禄のころ出版された『人倫訓蒙図彙』などだろう。この時代には人手が余るようになったのか、いわゆる職人の種類がたちまち前の時代の数十倍となり、門付けの歌念仏にも法師が携わっている。一方では、「理屈のよく整った話」などと称して、子ども向けのおとぎ話とは少し方面の違うもの、とくに文学的な文章の暗唱をいくらか交えた語り物を重んじる風潮が、次第に広まった。明治の時代になるまで、これを情操教育の一つに数えるような有様だった。このことが、諸国を修行して回る者たちに時代の好みを追わせ、同じ一つの口伝の普及に男女の力を集中させたのではないだろうか。女性が先駆者だったのかもしれないが、各地でそれを伝説に変えたのは、女性たちだけの活動ではなかったように思われる。

    というのは、伝説とは一つの主張であり、外から来た人に向かって、公然と少しもためらわずにそれを説く者を必要としたからである。そうでなければ、少なくとも記念碑などは建たない。そして今日では、多くの有形無形の記念碑が建っている。なるほど、伝説の解釈は一般には間違っている。しかし地方がそれぞれの歴史を求め、歴史書がなければ、いわゆる民間の人の話に耳を傾けようとしたことだけでも進歩だった。ともかく、この気風を生み出し、今日の新国学の基礎を据えたものは、一言でいえば平和のもたらした変化、すなわち男性が戦いや兵糧の心配に煩わされなくなり、昔話をもてはやす心の余裕ができたことである。伝説は確かにこの機運に乗って、日本では近世に二度目の発展を遂げている。そしてこの方面にも男女の協力があった。その例を一つここに挙げて、和泉式部についてのこの一篇を閉じようと思う。'
  notes:
  - 1942年版の原資料画像（Commons公開ミラー、スキャン258）と本文OCRを照合。
  - 画像で「清少納言」「人倫訓蒙圖彙」「情操教育」「一言」を確認してOCRを訂正。イタコ・浄瑠璃座頭はいずれも当時の宗教・芸能上の呼称。

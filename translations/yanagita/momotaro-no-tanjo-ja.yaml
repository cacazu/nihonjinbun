  section: 米倉法師／九 信仰から文芸へ
  original: が今も傳はつて居る。彼等にとつては是も亦小規模なる一種の平家物語であつた。私の觸目した一系統の寫本に於ては、處々に不細工な道化話、又は我々が大話と名付けて居る誇張の滑稽などを挿入してあるのが特徴であるが、其叙述の要部には他の地方と共通のものが多く、頗る其由來を思ひ當らしめる節がある。たとへば物語の主人公海正坊といふ座頭の生母が、我子に立身をさせてやりたい一心から、化けて大蛇になつて斬り殺されるといふ一條の如きは、伊豫の上浮穴郡に行はれて居た賴政と鵺の話と同巧異曲であつた。賴政の母も亦我子の射藝を、朝廷から認められしめんが爲に、死んで化鳥になつて大內山に飛んで行つてあばれたといふのである。それは誠に飛んでも無い作り事ではあるが、恐らくは是も亦盲人の趣向に成るものであつた。それから今一つは松尾彈正之助の忘れがたみ、萬壽と小太郞との姉弟が登場して、姉の萬壽の前は水の神の牲となつて沈められたといふなども、此土地ばかりに語り傳へて居た話ではなかつた。宇佐の神宮を中心とした大分縣の各地に、今でもよく知られて居る鶴市母子の人柱の傳說に於ても、是と關係の深い父とか主人とかの人名に、必ず何の彈正といふ名があり、又その人柱の親子の名も、母が鶴女で子供は市太郞、もしくは小市郞さまとなつて居る。さうして是が又古い八幡神話の殘りのもの、卽ち神が人間の女を娶つてたつた一人の、大切な男の兒を生ましめられたと言傳への、末々變化して斯うなつたものらしいのである。それを詳しく說くことは他日の仕事として、今はたゞ肥前の梅野座頭なども、我邦に數多い母一人子一人の物語、卽ち神を父とし人間の處女を母として、生れた靈童を第二の神と崇め、其仲立ちと取なしとによつて、天の大神の御惠を獲ようとした信仰に、片端は參與して居たといふだけを說くに留める。越後大利峠の大蛇と座頭なども、本來は今一段と親密な關係があつて、後者が人類の爲に現世の生命を絕つて、水の神の怒りを和げたといふ風に語つて居た時代が、曾ては有つたらうといふ私の想像も、後に此比較を進めて行けば、さう無茶なもので無かつたといふことが判つて來ると思ふ。それから最後にたゞ一言、最も簡單に言ひ添へて置きたいのは、ごぜ卽ち女盲の管轄した文藝にも、やはり座頭と同樣の自己宣傳があつたことと、それが追々に男女相異なる方向に分立して行つたけれども、古く溯れば唯一の信仰の表裏二つの側面を、撫摩して居たものに過ぎなかつたこととである。大體に男盲が笑の文學に進出したに對して、瞽女は聽く人を泣
  translation: '〔前のスキャンから続く〕今も伝わっている。彼らにとって、これもまた小規模な一種の『平家物語』だった。私が目にしたある系統の写本では、ところどころに不器用な道化話や、私たちが「大話」と呼ぶ誇張の滑稽を差し込んでいるのが特徴である。しかし、叙述の中心には他の地方と共通するものが多く、その由来を強く思い当たらせる点がある。たとえば、主人公の海正坊という座頭の実母が、我が子を出世させたい一心で、大蛇に化けて斬り殺されるという一節は、伊予の上浮穴郡に伝わっていた頼政と鵺の話と、趣向を同じくしていた。頼政の母も、我が子の弓の腕前を朝廷に認めてもらうため、死んで怪鳥となり、大内山へ飛んでいって暴れたという。これは実にとんでもない作り事だが、おそらく目の見えない人の考えた趣向だった。それからもう一つ、松尾弾正之助の遺児、万寿と小太郎の姉弟が登場し、姉の万寿の前が水の神のいけにえとして沈められたということなども、この土地だけで伝えられた話ではない。宇佐神宮を中心として大分県各地で今もよく知られる、鶴市母子の人柱伝説にも、これと関係の深い父や主人の名に、必ず「何々弾正」という名がある。また、人柱になった親子も、母は鶴女、子は市太郎、あるいは小市郎様と呼ばれる。そして、これがまた古い八幡神話の名残、つまり神が人間の女性を妻にし、たった一人の大切な男の子を産ませたという言い伝えが、末々に変化してこのようになったものらしい。詳しく述べるのは別の日の仕事として、今はただ、肥前の梅野座頭なども、日本に数多い母一人子一人の物語に、ある面では関わっていた、と述べるにとどめる。それは、神を父、人間の乙女を母として生まれた霊妙な子を第二の神として崇め、その仲立ちや取りなしによって、天の大神の恵みを得ようとした信仰だった。越後大利峠の大蛇と座頭なども、もとはもう一段親密な関係にあり、後者が人類のためにこの世の命を絶ち、水の神の怒りを和らげた、と語られた時代が、かつてあっただろうという私の想像も、今後この比較を進めれば、そう無茶ではなかったとわかってくると思う。

    それから最後に一言だけ、簡単に付け加えておきたい。瞽女、すなわち目の見えない女性が担った文芸にも、やはり座頭と同じ自己宣伝があった。そしてそれは、次第に男女それぞれ異なる方向へ分かれていったが、古くさかのぼれば、ただ一つの信仰の表裏二つの側面に触れていたにすぎない、ということである。おおむね目の見えない男性が笑いの文学へ進出したのに対して、瞽女は聞く人を泣かせる、'

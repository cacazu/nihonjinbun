  original: 世の所謂一寸法師、古くは竹取の翁の傳へにもそれは旣に見えて居るのみならず、諸社根元記の載錄する倭姫古傳の破片にも、姫が玉蟲の形をして宮の中に姿を現じたまふといふことがあるのである。それから今一つは水上に浮んで來て、岸に臨む老女の手に達したといふこと、是が又大切なる點では無かつたかと思ふ。海から次第に遠ざかつて、山々の間に入って住んだ日本人は、天から直接に高い嶺の上へ、それから更に麓に降りたまふ神々を迎へ祭る習はしになつて居た。だから又谷水の流れに沿うて、人界に近よらうとする精靈を信じたのであつた。賀茂の瀨見小河の丹塗矢、出雲の加賀窟の黄金の箭も共にそれであつて、其結果は戶の隙間からさし入つた日光の金線が、人間の少女の身を射た場合と同じかつたのである。桃太郞の桃が瓜子姫の瓜よりも後のものであつたことは、さう多くの臆測を借らずとも容易に之を認めることが出來る。瓜類が中うつろにして自然に水の上を浮き漂ふ事實は、非常に我々をして其內に在るものを床しがらせて居たのであつた。後世のうつぼ舟說話を成長せしめた元の起りには、新羅の朴氏の始祖が瓠に乘つて、日本から渡つて來たといふ樣な例もある。是と白蘞の皮で作つた舟に乘り、鷦鷯の羽衣を着て、潮のまに〳〵流れ寄つたといふ我々の小男神の物語とを比べ合せて見ると、最初異常に小さかつたといふことが、其神を尊く又靈ありとした理由であつたことは察し得られる。是が桃太郞の鬼が島征服の話と、複合するに至つた主要な點のやうに私は思ふ。獨逸の人たちは人文神などといふ語を設けて居るやうだが、我々の說話の上代の英雄にも、彼と共通した運命の前提があつた。常人すら尙到底企て難しとする難事業を、始めは普通以下の如く見えた者が、何の苦も無く安々と爲し遂げた。是れ奇瑞であり是れ天意で無くして何であらう。乃ち一種族の幸福を指導するの力が有つたのも偶然で無い。故に傳ふるに足る。又傳へざるべからずといふ考へ方を、昔の人たちはして居たらしいのである。だから亞細亞でも歐羅巴でも、現在知られて居る英雄の成功譚には、單に小さくて弱々しい者であつたといふ以上に、非常な貧乏人であり、極度の惰け者であり、又は少なくとも外見には法外な魯か者でもあつた。この四つの條件の二又は三を兼備して人から省みられなかつた者が後に偉い事をして居る。是をたゞ桃や瓜の中から飛出したといふだけにしたのは、我々の方の單純化であつたかも知れない。兎に角に國內に瓜や鶯の卵や竹の中から出た例も有ることを知らずに、
  translation: '……世のいわゆる一寸法師や、古くは竹取の翁の伝えにも、それはすでに見られる。それだけでなく、『諸社根元記』に収められた倭姫の古い伝えの断片にも、姫がタマムシの姿をして宮の中に現れたという話がある。またもう一つ、水に浮かんで来て、岸辺にいる老女の手に届いたことも、大切な点ではなかったかと思う。海から次第に離れ、山々の間に入って住むようになった日本人は、天から直接高い峰へ、そこからさらに山麓へと降りてくる神々を迎え、祭る習わしになっていた。だからこそ、谷川の流れに沿って人間の世界に近づこうとする精霊を信じたのである。賀茂の瀬見小河の丹塗りの矢、出雲の加賀の窟の黄金の矢も、どちらもその例である。その結果は、戸の隙間から差し込んだ金色の日光が、人間の少女の体を射た場合と同じだった。桃太郎の桃が、瓜子姫の瓜より後に生まれたものであることは、多くの推測に頼らなくても、容易に認められる。瓜の類は中が空洞になり、自然に水に浮かんで漂う。この事実が、私たちにその中にあるものを強く知りたがらせていたのである。後世の「うつぼ舟」の説話を発達させた元の起こりには、新羅の朴氏の始祖がひさごに乗って日本から渡ってきたというような例もある。これと、ガガイモの皮で作った舟に乗り、ミソサザイの羽衣を着て、潮の流れのままに漂い着いたという、日本の小さな男神の物語とを比べると、初めは異常に小さかったということこそ、その神が尊く、霊力をもつとされた理由だったと察することができる。

    私はこれが、桃太郎の鬼が島征服の話と結びつくに至った主要な点だと思う。ドイツの人々は「人文神」などという言葉を設けているようだが、日本の説話の古代の英雄にも、それと共通する運命の前提があった。普通の人でさえ、とてもできそうにないと思う難事業を、初めは普通以下に見えた者が、苦もなくたやすく成し遂げる。これが奇跡であり天の意志でないとしたら、何だろう。つまり、一つの民族を幸福に導く力があったのも偶然ではない。だから伝える価値があり、また伝えなければならない、と昔の人々は考えていたらしい。したがって、アジアでもヨーロッパでも、現在知られる英雄の成功物語では、主人公は単に小さく弱々しいだけではない。たいへんな貧乏人であったり、極度の怠け者であったり、あるいは少なくとも見かけは、とんでもない愚か者であったりもする。この四つの条件の二つか三つを兼ね備え、人から気にとめられなかった者が、後に偉大なことをしている。これを、ただ桃や瓜から飛び出したというだけにしたのは、日本側での単純化だったのかもしれない。ともかく、国内に瓜やウグイスの卵や竹から生まれた例もあると知らずに、……'
  notes:
  - 冒頭・末尾は前後のスキャンへ続く。
  - 「白蘞」「鷦鷯」は、それぞれガガイモ、ミソサザイとして訳した。
  - 新羅の始祖の出自など歴史的記述は著者の議論をそのまま訳し、現代の知見による書き換えはしていない。

  scan: 185
  section: 絵姿女房／六 六十六本の扇・七 殿様の無理難題
  original: 'て住めば、萬の長者と申せしを、人の申し易きまゝにまの殿と申す。子の無きことを悲

    み、內山里の聖觀音に詣り、申し子をこそしたまひけれ。祈誓のしるし早有りて、御寶

    殿の內よりも、寶珠を賜はると北の御方御覽じて、御着帶の身となり、なゝ月の煩ひ九

    月の苦しみ、十月半ばと申すに產の紐平かなり。取上げて御覽ずれば、玉をのべたる如

    くなる姫にておはします。御夢想によそへ、玉よの姫と名け、いつきかしづきたまひけ

    るに、かの姫十四の年この繪扇の下りたるを引合せて見てあれば、もの言へば扇の繪が

    妬むべくぞ見ゆる云々。

    以上が物語の第一段であつて、それから禁裡の難題の條に續くのだが、是は分割して次の

    節で述べて見たい。前に出してある周防般若寺の傳說と、同じ物語が是だけ迄は變化し得た

    のである。凧が庭上の松の枝にかゝるといふのは、餘りにもあどけない空想であつた。それ

    に美人の姿繪が描いてあつたのも、何の爲とも說明し難いから、或は是二つだけを比べて見

    ると、舞の本を原型とも言ひ得るか知らぬが、一たび眼を轉じて東北の三地、及び九州の二

    國に共通する旋風が掛け物を捲上げた話を見渡すとき、果して足利時代の記錄がある故に、

    此方が古い形と言ひ切ることが出來るかどうか。私は少なくともまだそれ迄の勇氣が無い。

    雙方繪の藝術の實際にうとく、大相も無い功能を是に持たせようとした平民らしさは同じで

    あるが、六十六本の扇は少し空想に走り過ぎて居る。之に比べると惰ける花聟を働かせる爲

    に、繪を描いて竹に挿んで畠の傍に立てさせたといふ方は、昔の信心者の佛に仕へた話など

    にも有りさうな思ひ付きであるのみか、實際又本尊が風に飜つて、空より降りて來たと傳へ

    て居る例もあるのである。何にしても話は此方が遙かに面白く、假に後々話しかへたものと

    すれば、それは改造以上の腕前であつた。是が日本の北と南の田舍に、此樣に弘く分布して

    居ることも、あちらを本の形とすると說明が困難にある。それ故に自分などは、舞の本の六

    十六本の扇の話より以前、旣につむじ風に吹取られたといふ繪女房の話が、存在して居たも

    のかと思つて居るのである。

    七殿樣の無理難題

    或は單に二つの稍々似寄つた姿繪の話があつて、それが偶然に周防の海岸に於て、混同して'
  translation: 'て住んでいたため、「万の長者」と呼ばれていたが、人々が呼びやすいように、「まの殿」と呼んでいた。子がないことを悲しみ、内山里の聖観音に参詣して、子を授けてほしいと願った。願いのしるしは早くも現れ、奥方は、お堂の中から宝珠を頂いたという夢を見て、身ごもった。七か月のわずらい、九か月の苦しみを経て、十か月半というころ、無事に出産した。取り上げて見ると、玉を敷き延べたかのような美しい姫だった。夢のお告げにちなんで玉世の姫と名づけ、大切に育てているうち、その姫が十四歳の年にこの絵扇が届いた。見比べてみると、姫がものを言うので、扇の絵のほうが妬みそうに見えた、という。

    以上が物語の第一段で、その後に宮中からの難題のくだりが続くが、これは切り分けて次の節で述べたい。先に挙げた周防の般若寺の伝説と比べると、同じ物語がここまで変化しえたのである。凧が庭の松の枝に掛かるというのは、あまりにも無邪気な空想だった。そのうえ、そこに美人の姿絵が描いてあったのも、何のためか説明しにくい。だから、この二つだけを比べれば、舞の本が原型ともいえるかもしれない。

    しかし、いったん目を転じ、東北の三か所と九州の二国に共通する、つむじ風が掛け絵を巻き上げたという話を見渡したとき、果たして室町時代の記録があるからというだけで、舞の本のほうを古い形と言い切れるだろうか。私には、少なくとも、まだそこまで断言する勇気はない。どちらも絵画の実際を知らず、途方もない効き目を持たせようとした庶民らしさは同じだが、六十六本の扇は、少し空想に走りすぎている。

    これと比べると、怠ける花婿を働かせるため、絵を描いて竹に挟み、畑のそばに立てさせたというほうは、昔の信仰深い人が仏に仕えた話などにもありそうな思い付きであるだけでなく、実際に、本尊が風にひるがえって空から降りてきたと伝える例もある。何にしても、話はこちらのほうがはるかに面白い。仮に後世に語り替えたものだとすれば、それは改造という程度を超えた腕前だった。日本の北と南の田舎に、このように広く分布していることも、六十六本の扇を元の形とすると説明しにくい。だから私は、舞の本の六十六本の扇の話よりも前に、すでにつむじ風に吹き取られた絵女房の話があったのではないかと思っているのである。

    七　殿様の無理難題

    あるいは、ただ二つの少し似た姿絵の話があって、それがたまたま周防の海岸で混同されて'
  notes:
  - 冒頭はscan184から、末尾はscan186に続く。
  - 引用の「申し子」は神仏に祈願して授かる子。原著の引用部分も全文を現代語訳した。
  - 同一原資料のWikimedia Commons公開画像と原文・訳を照合済み。

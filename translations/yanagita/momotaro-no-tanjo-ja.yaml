- id: mmt-198-01
  scan: 198
  section: 絵姿女房／髪長媛・山路の笛
  original: '布して居る俗信に、婦人が端近く出て髪を梳くを忌む風がある。其理由を問ふと萬一にも鳥

    が拔け毛をくはへて、神の樹に巢を作るやうなことがあると、其毛の當人は氣ちがひになる

    から、又は緣が遠くなるからと言つて居る。氣ちがひといふのは神氣が副ふことであつた。

    神に誓願する者が毛を切つて捧げたのも同樣に、髪を召さるゝことは卽ち身を任せ申すこと

    であつた。それ故に又紀州淡島の口碑の如く、髪の長きによつて貴人の妻問ひを受けたとい

    ふ昔語りも起つたのであらう。藤原非想翁の談によれば、羽後の生保内にも繪姿女房の昔話

    はあつたが、是は姿繪を風に吹揚げられるのでは無く、鳥が咥へて飛んで行つて、殿樣の庭

    に落すことになつて居たさうである(旅と傳說三卷十一號)。鳥は神使であり其擧動は神意であ

    つたことを、感じ得た人たちの所傳であらうと思ふ。是が單なる偶然の風の所業となる迄に

    は、順序もあり又素地もあつた筈である。幾ら珍らしくとも外來の繪姿女房は、只では日本

    の昔話とはなり得なかつた。卽ち傳播には非ずして採擇であつたのである。

    山路の笛

    さんろが草刈る夜の笛は、幾度と無く後代の語りものにくり返されて居る。舞の本の烏帽

    子折は先づ長々とその由緒を述べ、十二段の草子にも御曹司自ら、此頃もてあそぶ草苅笛と

    申すべしと謂つて居るが、それが斯樣に有名になつたのは、必ずしもこの二種の文藝の力で

    無かつたと思はれる。其理由は第一に爰でさういふ笛の名を持出さなければならなかつた趣

    意が、まだちつとでも說明せられては居らぬからで、つまり當時既に山路の笛といふ語り草

    が、流布して居たことを想像せしめるまでの、資料といふに過ぎなかつたからである。だか

    ら山路といふやうな珍らしい牧童の名の起りを、嬉遊笑覽の著者などと共に、今でも尋ねて

    見ようとする人のあるのは尤もであるが、假に其點が手輕に判つたとしたところで、尙それ

    だけでは一天萬乘の若き現人神が、遙に之を携へて筑紫の果に下られたといふ語りごとは解

    し難く、更に又牛若丸が此技に堪能であつて、その次々の海道下り、近くは京の五條の橋の'
  translation: '布している俗信に、女性が家の外に近い所へ出て髪をすくことを忌む習慣がある。理由を尋ねると、万一、鳥が抜け毛をくわえ、神の木に巣を作るようなことがあると、その毛の持ち主は「気が狂う」から、あるいは良縁が遠のくからだという。「気が狂う」とは、神の気がその人に付き添うことだった。神に願を立てる人が髪を切って捧げたのと同じく、髪を神に取られることは、つまり自分の身を神に委ねることだったのである。

    そのため、紀州淡島の言い伝えのように、髪の長さによって貴人から求婚されたという昔語りも生まれたのだろう。藤原非想翁の話では、羽後の生保内にも絵姿女房の昔話があったが、こちらは姿絵が風で吹き上げられるのではなく、鳥がくわえて飛び、殿様の庭へ落とすことになっていたそうである（『旅と伝説』三巻十一号）。鳥は神の使いで、その動きは神の意思によると感じることのできた人々が伝えたものだと思う。

    これが単なる偶然の風の仕業となるまでには、段階も下地もあったはずである。どれほど珍しくても、外国から来た絵姿女房は、何の条件もなく日本の昔話にはなれなかった。つまり、ただ伝わったのではなく、選び取られたのである。

    山路の笛

    山路が草を刈る夜の笛は、後世の語り物で何度となく繰り返されている。舞の本の「烏帽子折」は、まず長々とその由来を述べ、『十二段の草子』でも、御曹司自身が、「このごろ人々が楽しんでいる、草刈笛というものです」と言っている。しかし、それがこのように有名になったのは、必ずしも、この二種類の文学の力ではなかったと思われる。

    その理由は、第一に、ここでこのような笛の名を持ち出さなければならなかった意味が、まだ少しも説明されていないからである。つまり、それらは、当時すでに山路の笛という語り物が流布していたことを想像させるだけの資料にすぎなかった。

    だから、山路という珍しい牧童の名の由来を、『嬉遊笑覧』の著者などと同じように、今でも調べようとする人がいるのは、もっともである。しかし、仮にその点が簡単に分かったとしても、それだけでは、天下を治める若い現人神が、この笛を携えてはるか筑紫の果てへ下ったという語りは理解しにくい。さらに、牛若丸がこの技に優れ、次々に東国へ下っていく旅で、近くは京の五条の橋の'

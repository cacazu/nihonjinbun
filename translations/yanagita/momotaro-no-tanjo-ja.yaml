  section: 隣の寝太郎／三 奥州のならず者・四 沖縄の睡虫
  original: て、早速に聟殿になつてしまふといふ話。地藏が物を言ふなどは餘り馬鹿げて居るやうだが、東北の村の人には是にも特別の興味があつた。曾て日本傳說集(二二一頁)にも書いて置いた如く、多勢の若い者が一人を眞中に入れて圓陣を作り、歌や唱へごとを以て囃し立てて地藏を憑かせて、色々の伺ひを立てる遊びが東北にはあつた。我々の知つて居る「中の中の小坊主」と同じく、最初は是も信仰の行事であつたらうが、近頃は全く一種の慰みになつてしまつて、わざと飛んでも無い問をかけ、おどけた事を言はせて笑ふのを目的にして居た。相手が地藏であり寄り集まる者が若い男女である故に、題目は自然に緣結びのやうなことを主にして居たらうと思ふ。長者の娘がのらくら者を聟に取るなどは、特にこの地藏遊びと聯想せられ易い、滑稽なる作りごとであつたのである。四沖繩の睡蟲それよりも自分の珍らしく感ずることは、聟が天から門前の杉の樹を傳つて降りて來たといふ一條である。是を直接に日本書紀の、海の宮の門の前なる百枝の杜樹に比較しようとしたら、人は必ず其不倫を憤るでもあらうが、この二つの極端の中間には、尙幾つかの「失はれたる鏈」が見出されるので、決して或一つの地方でばかり、偶然に取入れられた新らしい挿話では無いのである。例へば佐喜眞君の南島說話第八十七話は、琉球にも是と半分以上、一致した例のあることを示して居る。曰く昔或處に貧しい男があつた。心は非常に善かつたが貧乏は言語に絕し、頭を入れると足が出る。足を入れると頭が出るやうな小さな家に住んで居た。この男が天人に教へてもらつて、一本の爆竹を持つて村の長者の家の前の大木に登り、大きな聲で自分は天人であると言つた。さうして何の某を此家の聟にしなければ、此通り家を燒いてしまふぞと嚇して、爆竹の火をあげて見せた。長者が謹んで承知の旨を答へて後、そつと小屋に還つて寢轉んで居ると、果して長者が多勢の下男を連れて、この貧しい男を迎へに來た。それで目出たく大金持の聟になつたといふ話。此話の中でも、小屋へ戾つて寢ころんで居るといふことが、何でも無い一條のやうであるけ
  translation: '……て、すぐに婿殿になってしまう、という話である。

    地蔵が物をいうなど、あまりに馬鹿げているようだが、東北の村の人たちには、これにも特別な興味があった。以前『日本伝説集』（二百二十一頁）にも書いたように、東北には、多くの若者が一人を真ん中に入れて円陣をつくり、歌や唱えごとで囃し立てて地蔵を取り憑かせ、さまざまなことを尋ねる遊びがあった。私たちの知っている「中の中の小坊主」と同じように、初めはこれも信仰の行事だったのだろう。だが近ごろは、すっかり一種の遊びになってしまい、わざととんでもない質問をして、おどけたことをいわせて笑うのが目的になっていた。相手が地蔵で、集まるのが若い男女であるから、題材は自然に縁結びのようなことが中心になっていたのだろうと思う。長者の娘がのらくら者を婿に取る、といったことは、とりわけこの地蔵遊びに結びつけられやすい、滑稽な作り話だったのである。

    四　沖縄の睡虫

    それよりも私が珍しく感じるのは、婿が天から門前の杉の木を伝って降りてきた、というくだりである。これを直接『日本書紀』に出てくる海の宮の門前の、枝が多く茂った桂の木と比べようとすれば、人はきっと、不釣り合いな比較だと憤ることだろう。しかし、この二つの両極端のあいだには、なおいくつかの「失われた鎖のつながり」が見つかるのであって、ある一地方だけで偶然取り入れられた新しい挿話では決してない。たとえば佐喜真君の『南島説話』第八十七話は、琉球にも、これと半分以上一致する例があることを示している。そこには、次のようにある。

    昔、あるところに貧しい男がいた。心はとても善良だったが、その貧しさは言葉では言い表せないほどで、頭を入れると足が出、足を入れると頭が出るような小さな家に住んでいた。この男が天人に教えてもらって、一本の爆竹を持ち、村の長者の家の前の大木に登って、大声で「自分は天人である」といった。そして「何の誰それをこの家の婿にしなければ、このように家を焼いてしまうぞ」と脅し、爆竹に火をつけてみせた。長者がうやうやしく承知したと答えると、男はそっと小屋に帰って寝転んでいた。すると果たして、長者が大勢の下男を連れて、この貧しい男を迎えにきた。こうして、めでたく大金持ちの婿になったという話である。

    この話でも、小屋へ戻って寝転んでいるという点は、何でもない一節のようではあるけれども、……'

  original: だけが以前からの口碑か、實際は明かに區分することが難い。しかし少なくとも路傍の加門塚は存し、所謂千疋狼は隣國にも行はれて居る話だから、全部が作り話で無かつたことのみは確かである。名古屋の菱屋半七翁の筑紫紀行卷九、享和元年六月十日の條にも、偶然に此地の記事がある。卽ち但馬の養父宿を過ぎて、一丁ばかり行けば左の方に水谷大明神の宮あり。こは神名帳に但馬國養父郡水谷神社とある御社か。坂を登りて隨身門のあるより入りて拜す。門は草葺、拜殿本社は檜皮葺なり。左の方にお猫さまの社とて小さき宮あり。宮の下なる小石をとり歸りて、家に置くときは鼠を辟くといふ。又しばし行きて五社明神の御社あり。是は神名帳に但馬國養父郡夜夫坐神社五座とある神社なるべし。今は藪崎大明神と申すなり。また一丁ばかり奧の方に山の口の社といふあり。是は狼を神に祭る御社なりといへり。故に此神は狼を遣ひたまふといふ。社僧の居所は水谷山普賢寺、本尊は藥師如來なり。さて大道を歸りて六五町行けば藪崎村、養父宿より是まで二十五町云々。と謂つて居る。この御猫樣を末社に祀つたといふ御宮は、どうも式内の水谷の神社では無ささうである。實地に行つて見ぬ故詳しいことは判らぬが、但馬考には式內の水谷神社は、是より一里餘り東の山手の、奥米地といふ部落にあると出て居る。ところが古く大田文の時代前から、この養父市場の養父神社、卽ち前の紀行文に藪崎大明神とあるものを、養父水谷大明神と稱へ申す習はしがあつた。さうして狼も猫も共に此御社に附屬して居たらしいのである。鈴鹿翁の神社覈錄には但馬考を引いて、末社三座あり。末社のうち山口神社を、俗に狼の宮と稱す。麋鹿の田畝を害する時これを祈る。加地屋敷は猫ノ宮と云ふ。鼠の蠶を害することを防ぐ。と記してあるのだが、その猫の宮の所在が誤りであつたか、又は引越して居たのである。桃井塘雨の笈埃隨筆は、この但馬考よりはよほど前に出たものと思ふが、それにも亦同じ狼の宮のことが載せてある。この山(妙見山)の後の麓に養父明神在す。狼を使令として宮前に大石をもて狼の雌雄を彫造し、鐵鎖をもつて繋いで左右に有り。諸社の高麗犬の如し。隣國の村々にて猪鹿の爲に田畑を荒らさるゝことあれば、此明神へ參り立願して、狼を借り用ゐんといへば、
  translation: 'だけが以前からの言い伝えなのか、実際には明確に分けることが難しい。しかし少なくとも道端に加門塚は存在し、いわゆる千匹狼は隣国にも伝わる話なので、全部が創作ではなかったことだけは確かである。名古屋の菱屋半七翁の『筑紫紀行』巻九、享和元年六月十日の条にも、たまたまこの土地の記事がある。すなわち次のようにいう。

    但馬の養父宿を過ぎ、一町ほど行くと左手に水谷大明神の宮がある。これは『神名帳』に但馬国養父郡水谷神社とある社だろうか。坂を登り、随身門のある所から入って拝む。門は草葺き、拝殿と本社は檜皮葺きである。左手には「お猫さまの社」という小さな宮がある。宮の下の小石を持ち帰って家に置くと、ネズミを避けるという。またしばらく行くと五社明神の社がある。これは『神名帳』に但馬国養父郡夜夫坐神社五座とある神社だろう。今は藪崎大明神と呼んでいる。さらに一町ほど奥に、山の口の社というものがある。これは狼を神として祭る社だという。それで、この神は狼をお使いになるという。社僧の住まいは水谷山普賢寺で、本尊は薬師如来である。さて、大きな道に戻って「六五町」行くと藪崎村で、養父宿からここまで二十五町、云々。

    この「お猫様」を末社として祭ったという宮は、どうも『延喜式』に記載された水谷神社ではなさそうである。実地へ行っていないので詳しくはわからないが、『但馬考』では、式内の水谷神社はここから一里余り東の山手、奥米地という集落にあるとされている。ところが古く、大田文の時代より前から、この養父市場の養父神社、つまり先の紀行文で藪崎大明神とされるものを、「養父水谷大明神」と呼ぶ習わしがあった。そして狼も猫も、ともにこの社に付属していたらしい。鈴鹿翁の『神社覈録』は『但馬考』を引き、次のように記している。

    末社は三座ある。そのうち山口神社は俗に「狼の宮」と呼び、鹿が田畑を荒らすときに祈る。加地屋敷は「猫ノ宮」といい、ネズミが蚕に害を与えるのを防ぐ。

    こう記しているのだが、猫の宮の所在地についての記載が誤っていたか、あるいは宮が移転していたのである。桃井塘雨の『笈埃随筆』は、この『但馬考』よりかなり前に出たものだと思うが、そこにも同じ狼の宮のことが載っている。

    この山、すなわち妙見山の後ろのふもとに養父明神がおられる。狼を使者とし、社前には大きな石で彫った雌雄の狼が、鉄の鎖でつながれて左右に置かれている。ほかの社の狛犬のようである。隣国の村々で猪や鹿に田畑を荒らされると、この明神へ参詣して願を掛け、狼を借りたいというと、'
  notes:
  - 引用の距離「六五町」は原画像の表記を保持。数字の順序等に疑問があるため、六十五町などと断定しなかった。
  - 享和元年は1801年。「町」「里」は距離の旧単位。式内社は『延喜式』神名帳に記載される神社をいう。
  - 原文で「養父水谷大明神」の一部がOCRで行をまたいで混入したため、原画像の順序に修正。

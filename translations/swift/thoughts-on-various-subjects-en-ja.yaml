  "translation_ja": |-
    貿易や商業に関する、あらゆる格言や体系を聞いた後では、傍観者は、世の中の仕組みは、なんとも馬鹿げて作られていると思うだろう。
  "translation_status": "reviewed"
- "id": "thoughts-on-various-subjects-094"
  "section_id": "work"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    There are few countries which, if well cultivated, would not support double the number of their inhabitants, and yet fewer where one-third of the people are not extremely stinted even in the necessaries of life. I send out twenty barrels of corn, which would maintain a family in bread for a year, and I bring back in return a vessel of wine, which half a dozen good follows would drink in less than a month, at the expense of their health and reason.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[393]"
    "line_start": 4752
    "source_sequence": 122
  "translation_ja": |-
    十分に耕作すれば、今の住民の二倍を養えない国は、ほとんどない。それなのに、住民の三分の一が、生活の必需品にさえ、ひどく事欠いていない国は、さらに少ない。私は、一家族を一年間、パンで養える、二十樽の穀物を送り出し、その代わりに、一樽の葡萄酒を持ち帰る。気のいい仲間が六人もいれば、一か月もかからず、自分たちの健康と理性を代償に、飲み干してしまうものを。
  "translation_status": "reviewed"
- "id": "thoughts-on-various-subjects-095"
  "section_id": "work"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    A man would have but few spectators, if he offered to show for threepence how he could thrust a red-hot iron into a barrel of gunpowder, and it should not take fire.
  "source_languages":
  - "en"
  "source_locations":

  "reader_notes_ja":
  - "本編は、一八八六年Cassell & Company版の英語電子翻刻にある見出しと本文九十五段落。その順序と、原文にある反復を保つ。"
  - "これに、一八〇一年版全集の第五巻から本編にない十二段落、第十巻から本編にない五十三段落、さらに第十巻に異なる文言で収められた三段落を加えた合成版。段落数には引用や標語の導入も含み、百六十三の独立した格言を意味しない。"
  - "「一八〇一年版・第五巻の補遺」「一八〇一年版・第十巻の補遺」「異なる形で収められた断章」は、今回の収録を整理するための見出し。補遺はそれぞれの巻の原文順に並べ、異文の三段落は、対応する本編の断章へリンクした。"
  - "対象は本編の選録と明示した補遺・異文の本文。全集の第五・第十巻全体や、スウィフトの全作品の完訳ではない。第五巻の標題に付く編者注二件と、第十七巻にある同名の別作品は含めない。"
  "subtitle_ja": "一八八六年版選録と一八〇一年版第五・第十巻からの補遺"

- "id": "thoughts-1801-v10-para-053"
  "section_id": "variants-1801-v10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Very few men do properly live at present, but are providing to live another time."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "wikisource-1801-v10-thoughts"
    "precision": "page"
    "printed_page": "247"

      "source_sequence": 98
    "description_ja": "本編の第70段落に対応。第十巻の文言をこの段落で全訳し、比較する本編の原文・訳文もそのまま保持する。"
- "id": "thoughts-1801-v10-para-031"
  "section_id": "variants-1801-v10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Politicks are nothing but corruptions, and are consequendy of no use to a good king or a good ministry; for which reason all courts are so full of politicks."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "wikisource-1801-v10-thoughts"
    "precision": "page"
    "printed_page": "245"
    "url": "https://en.wikisource.org/wiki/The_Works_of_the_Rev._Jonathan_Swift/Volume_10/Thoughts_on_various_Subjects#245"
    "source_sequence": 31
  "translation_ja": "政治術は、腐敗以外の何ものでもない。したがって、よい王や、よい政府には、何の役にも立たない。それゆえ、どこの宮廷も、政治術でこれほど満ちている。"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "wikisource-1801-v10-thoughts"
    "original_unit_id": "body-paragraph-031"
  "source_variants":
  - "kind": "comparison"
    "text": "Politics, as the word is commonly understood, are nothing but corruptions, and consequently of no use to a good king or a good ministry; for which reason Courts are so overrun with politics."
    "source_locations":

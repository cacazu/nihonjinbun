  "translation_ja": |-
    真の友の、最良の手本よ、気をつけてほしい。
    その看護に、あまりに高い代価を払っている、
    君の優しさが、私の命を守りながら、
    君の命を、危うくするのなら。
    そんな愚か者は、かつて一人もいなかった、
    宮殿を、地面まで取り壊し、
    ただ、そのがれきを、
    傷んだ家の、材料にするためだけに。

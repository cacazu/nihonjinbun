  "origin": "source"
  "source_text": "STELLA’S BIRTHDAY, MARCH 13, 1726."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/h2[18]"
    "line_start": 3090
    "source_sequence": 229
  "translation_ja": "ステラの誕生日、一七二六年三月十三日"
  "translation_status": "reviewed"
- "id": "sb1726-stanza-1"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    This day, whate’er the Fates decree,
    Shall still be kept with joy by me;
    This day, then, let us not be told
    That you are sick, and I grown old,
    Nor think on our approaching ills,
    And talk of spectacles and pills;
    To-morrow will be time enough
    To hear such mortifying stuff.
    Yet, since from reason may be brought
    A better and more pleasing thought,
    Which can, in spite of all decays,
    Support a few remaining days:
    From not the gravest of divines
    Accept for once some serious lines.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[210]"
    "line_start": 3091
    "source_sequence": 230
  "translation_ja": |-
    この日は、運命の女神たちが何を定めようとも、
    私には、いつも喜びの祝い日である。
    だから、この日に限っては、聞かせないでほしい、
    君は病気で、私は老いたという話を。
    迫ってくる災いを、思いもせず、
    眼鏡や丸薬の話も、やめておこう。
    そんな、気のめいる話を聞くのは、
    明日になってからで、十分だ。
    だが、理性からなら、引き出せるかもしれない、
    もっとよく、もっと喜ばしい考えを。
    あらゆる衰えにもかかわらず、
    残るわずかな日々を、支えてくれる考えを。
    もっともまじめな聖職者とはいえない私から、
    今度だけは、少しまじめな詩を、受け取ってほしい。
  "translation_status": "reviewed"
- "id": "sb1726-stanza-2"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Although we now can form no more
    Long schemes of life, as heretofore;
    Yet you, while time is running fast,
    Can look with joy on what is past.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[211]"
    "line_start": 3105
    "source_sequence": 231
  "translation_ja": |-
    昔のように、これからの長い人生の計画を、
    もう立てることは、できなくなったけれど、
    君は、時が急いで過ぎる中でも、
    過去を、喜びとともに振り返ることができる。
  "translation_status": "reviewed"
- "id": "sb1726-stanza-3"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Were future happiness and pain
    A mere contrivance of the brain,
    As Atheists argue, to entice,
    And fit their proselytes for vice
    (The only comfort they propose,
    To have companions in their woes).
    Grant this the case, yet sure ’tis hard
    That virtue, styled its own reward,
    And by all sages understood
    To be the chief of human good,
    Should acting, die, or leave behind
    Some lasting pleasure in the mind.
    Which by remembrance will assuage
    Grief, sickness, poverty, and age;
    And strongly shoot a radiant dart,
    To shine through life’s declining part.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[212]"
    "line_start": 3109
    "source_sequence": 232
  "translation_ja": |-
    もし、来世の幸福も苦しみも、
    頭の中の、ただの作り事だとしても、
    無神論者が、そう言い張って、信者を誘い、
    悪徳へ導こうとする、そのとおりだとしても、
    （彼らの差し出す、ただ一つの慰めは、
    自分たちの苦悩の、道連れを得ることだ。）
    そうだと認めよう。それでも、確かに理不尽ではないか、
    それ自体が報いと呼ばれる徳が、
    人間にとって、最高の善であると、
    あらゆる賢人の認める徳が、
    行いとともに消え、後に、何も残さないとは、
    心の中の、長く続く喜びさえも。
    思い出すことで、和らげてくれる喜びを、
    悲しみや病気、貧困や老いを。
    力強く、光り輝く矢を放ち、
    人生の、衰えゆく日々を照らす喜びを。
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "comparison"
    "text": "Should acting die; nor leave behind"
    "source_locations":
    - "source_id": "wikisource-1801"
      "precision": "work"
      "url": "https://en.wikisource.org/wiki/The_Works_of_the_Rev._Jonathan_Swift/Volume_7/Stella's_Birthday,_1726-7"
    "description_ja": "第十一行のみ。底本orに対してnor。訳の否定関係は同版の読みを参照。"
- "id": "sb1726-stanza-4"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Say, Stella, feel you no content,
    Reflecting on a life well spent;
    Your skilful hand employed to save
    Despairing wretches from the grave;
    And then supporting with your store,
    Those whom you dragged from death before?
    So Providence on mortals waits,
    Preserving what it first creates,
    You generous boldness to defend
    An innocent and absent friend;
    That courage which can make you just,
    To merit humbled in the dust;
    The detestation you express
    For vice in all its glittering dress:
    That patience under to torturing pain,
    Where stubborn stoics would complain.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[213]"
    "line_start": 3125
    "source_sequence": 233
  "translation_ja": |-
    ステラ、教えてくれ、君は満ち足りた思いがしないだろうか、
    よく生きた一生を、振り返るときに。
    君の巧みな手は、救うために働いてきた、
    絶望した、不幸な人々を、墓から。
    そして、自分の蓄えで、支えてきた、
    以前、死から引き戻してやった人々を。
    摂理も、そうして人間に付き添い、
    初めに生み出したものを、守り続ける。
    君の、寛大で大胆な心――
    罪のない、その場にいない友を、かばう心。
    塵にまみれて、低く押しやられた値打ちを、
    公平に認められる、その勇気。
    悪徳が、どれほどきらびやかな衣装を着ようと、
    君のあらわす、その嫌悪。
    頑固なストア派でさえ、泣き言をこぼすような、
    責め苦のような痛みの中での、その忍耐。
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "comparison"
    "text": "Your generous boldness to defend"
    "source_locations":
    - "source_id": "wikisource-1801"
      "precision": "work"
      "url": "https://en.wikisource.org/wiki/The_Works_of_the_Rev._Jonathan_Swift/Volume_7/Stella's_Birthday,_1726-7"
    "description_ja": "第九行のみ。底本Youに対してYour。"
  - "kind": "comparison"
    "text": "That patience under torturing pain."
    "source_locations":
    - "source_id": "wikisource-1801"
      "precision": "work"
      "url": "https://en.wikisource.org/wiki/The_Works_of_the_Rev._Jonathan_Swift/Volume_7/Stella's_Birthday,_1726-7"
    "description_ja": "第十五行のみ。底本under toに対してunder。"
- "id": "sb1726-stanza-5"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Must these like empty shadows pass,
    Or forms reflected from a glass?
    Or mere chimæras in the mind,
    That fly, and leave no marks behind?
    Does not the body thrive and grow
    By food of twenty years ago?
    And, had it not been still supplied,
    It must a thousand times have died.
    Then, who with reason can maintain
    That no effects of food remain?
    And, is not virtue in mankind
    The nutriment that feeds the mind?
    Upheld by each good action past,
    And still continued by the last:
    Then, who with reason can pretend
    That all effects of virtue end?
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[214]"
    "line_start": 3141
    "source_sequence": 234
  "translation_ja": |-
    こうしたものは、空しい影のように、過ぎ去るのか、
    鏡に映った姿のように。
    あるいは、心の中の、ただの幻のように、
    飛び去って、何の跡も残さないのか。
    二十年前に食べたものによっても、
    体は、栄え、育っているのではないか。
    食べ物を、与え続けられなかったなら、
    とっくに千回も、死んでいたはずだ。
    それなら、誰が、理をもって言えるだろう、
    食べ物の効き目は、何も残らないなどと。
    そして、人間にとっての徳は、
    心を養う、糧ではないか。
    過去の、よい行いの一つ一つに支えられ、
    最新の行いによって、また支え続けられる。
    それなら、誰が、理をもって主張できるだろう、
    徳の効き目は、すべて尽きてしまうなどと。
  "translation_status": "reviewed"
- "id": "sb1726-stanza-6"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Believe me, Stella, when you show
    That true contempt for things below,
    Nor prize your life for other ends
    Than merely to oblige your friends,
    Your former actions claim their part,
    And join to fortify your heart.
    For virtue in her daily race,
    Like Janus, bears a double face.
    Look back with joy where she has gone,
    And therefore goes with courage on.
    She at your sickly couch will wait,
    And guide you to a better state.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[215]"
    "line_start": 3157
    "source_sequence": 235
  "translation_ja": |-
    信じてほしい、ステラ、君が示すとき、
    この世のものへの、真の軽蔑を。
    ただ友人たちを喜ばせるほかには、
    自分の命に、何の値打ちも置かないとき、
    君の過去の行いも、分け前を求め、
    力を合わせ、君の心を強くする。
    徳は、日々の道のりの中で、
    ヤヌスのように、二つの顔を持つのだから。
    喜びをもって、通ってきた道を振り返り、
    それゆえ、勇気をもって、前へ進む。
    徳は、君の病の床に付き添い、
    もっとよい境涯へと、導くだろう。
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "comparison"
    "text": "Looks back with joy where she has gone,"
    "source_locations":
    - "source_id": "wikisource-1801"
      "precision": "work"
      "url": "https://en.wikisource.org/wiki/The_Works_of_the_Rev._Jonathan_Swift/Volume_7/Stella's_Birthday,_1726-7"
    "description_ja": "第九行のみ。底本Lookに対してLooks。主語は前行の徳。"
- "id": "sb1726-stanza-7"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    O then, whatever heav’n intends,
    Take pity on your pitying friends;
    Nor let your ills affect your mind,
    To fancy they can be unkind;
    Me, surely me, you ought to spare,
    Who gladly would your sufferings share;
    Or give my scrap of life to you,
    And think it far beneath your due;
    You to whose care so oft I owe
    That I’m alive to tell you so.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[216]"
    "line_start": 3169
    "source_sequence": 236
  "translation_ja": |-
    ああ、それなら、天が何を意図しようとも、
    君を思いやる友人たちを、思いやってほしい。
    君の病に、心を乱され、
    友人が冷淡だなどと、思い込まないでほしい。
    私を、そう、この私だけは、大事にしてほしい、
    君の苦しみを、喜んで分かち合い、
    この命の切れ端を、君に渡したいと願い、
    それでも、君にふさわしい贈り物には、ほど遠いと思う私を。
    私が生きて、こう伝えられるのは、
    幾度となく、君の看護のおかげだったのだから。
  "translation_status": "reviewed"

- "id": "sb1722-stanza-1"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Resolved my annual verse to pay,
    By duty bound, on Stella’s day;
    Furnished with paper, pens, and ink,
    I gravely sat me down to think:
    I bit my nails, and scratched my head,
    But found my wit and fancy fled;
    Or, if with more than usual pain,
    A thought came slowly from my brain,
    It cost me Lord knows how much time
    To shape it into sense and rhyme;
    And, what was yet a greater curse,
    Long-thinking made my fancy worse
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[197]"
    "line_start": 2952
    "source_sequence": 215
  "translation_ja": |-
    年ごとの詩を、今年も納めようと決めた。
    ステラの日には、それが務めである。
    紙とペンとインクをそろえ、
    まじめくさって座り込み、考えた。
    爪をかみ、頭をかいたが、
    機知も空想も、逃げてしまっていた。
    いつもより、もっと苦しんだあげく、
    何かが、のろのろ頭から出てきても、
    どれほど時間がかかったか、神のみぞ知る、
    それを意味と韻の形にするまでには。
    しかも、さらに困ったことに、
    長く考えるほど、空想は悪くなる。
  "translation_status": "reviewed"
- "id": "sb1722-stanza-2"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Forsaken by th’ inspiring nine,
    I waited at Apollo’s shrine;
    I told him what the world would sa
    If Stella were unsung to-day;
    How I should hide my head for shame,
    When both the Jacks and Robin came;
    How Ford would frown, how Jim would leer,
    How Sh---r the rogue would sneer,
    And swear it does not always follow,
    That Semel’n anno ridet Apollo.
    I have assured them twenty times,
    That Phœbus helped me in my rhymes,
    Phœbus inspired me from above,
    And he and I were hand and glove.
    But finding me so dull and dry since,
    They’ll call it all poetic licence.
    And when I brag of aid divine,
    Think Eusden’s right as good as mine.
  "source_languages":
  - "en"
  - "la"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[198]"
    "line_start": 2964
    "source_sequence": 216
  "translation_ja": |-
    霊感をくれる九柱の女神に見放され、
    私は、アポロンの社の前で待った。
    今日、ステラを詩にたたえなかったら、
    世間が何と言うだろうかと、神に訴えた。
    二人のジャックや、ロビンがやって来たら、
    恥ずかしくて、どれほど顔を隠したくなるか。
    フォードは眉をひそめ、ジムは横目で笑い、
    いたずら者のSh――rは、せせら笑って、
    こう毒づくだろう、いつも本当とは限らぬぞ、
    「アポロンは年に一度は笑う」というのも、と。
    私は、二十回も言い切ってきた、
    ポイボスが、私の韻文を助けてくれると。
    天から私に、霊感を授けてくれ、
    神と私は、つうと言えばかあの仲なのだと。
    だが、その後の私が、これほど鈍く、干からびていれば、
    皆、あれは全部、詩人の勝手な言い分だと言うだろう。
    私が神の助けを自慢しても、
    ユーズデンにも、同じだけの権利があると思うだろう。
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "comparison"
    "text": "I told him what the world would say,"
    "source_locations":
    - "source_id": "wikisource-1801"
      "precision": "work"
      "url": "https://en.wikisource.org/wiki/The_Works_of_the_Rev._Jonathan_Swift/Volume_7/Stella's_Birthday,_1722-3"
    "description_ja": "第三行のみ。底本は末尾がsaで途切れている。sayを参照して訳す。"
- "id": "sb1722-stanza-3"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Nor do I ask for Stella’s sake;
    ’Tis my own credit lies at stake.
    And Stella will be sung, while I
    Can only be a stander by.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[199]"
    "line_start": 2982
    "source_sequence": 217
  "translation_ja": |-
    それに、私が頼むのは、ステラのためではない。
    危ないのは、私自身の評判なのだ。
    ステラは、きっと誰かにたたえられるだろう、
    私には、脇で眺めることしかできなくても。
  "translation_status": "reviewed"
- "id": "sb1722-stanza-4"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Apollo having thought a little,
    Returned this answer to a tittle.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[200]"
    "line_start": 2986
    "source_sequence": 218
  "translation_ja": |-
    アポロンは、少し考えた後、
    一言も違えず、こう答えた。
  "translation_status": "reviewed"
- "id": "sb1722-stanza-5"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Tho’ you should live like old Methusalem,
    I furnish hints, and you should use all ’em,
    You yearly sing as she grows old,
    You’d leave her virtues half untold.
    But to say truth, such dulness reigns
    Through the whole set of Irish Deans;
    I’m daily stunned with such a medley,
    Dean W---, Dean D---l, and Dean S---;
    That let what Dean soever come,
    My orders are, I’m not at home;
    And if your voice had not been loud,
    You must have passed among the crowd.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[201]"
    "line_start": 2988
    "source_sequence": 219
  "translation_ja": |-
    たとえお前が、老メトシェラほど長生きし、
    私の与える着想を、一つ残らず使っても、
    彼女が年を取るたび、毎年歌い続けても、
    その徳の半分は、なお語られずに残るだろう。
    だが、正直に言えば、こうも愚鈍がはびこっているのだ、
    アイルランドの首席司祭という連中の間じゅうに。
    私は毎日、こんな寄せ集めに、耳をつぶされている、
    W――師、D――l師、それにS――師と。
    だから、どの首席司祭が来たところで、
    留守だと伝えよ、と命じてある。
    お前の声が、大きくなかったなら、
    やはり群衆に紛れて、通り過ぎたはずだ。
  "translation_status": "reviewed"
- "id": "sb1722-stanza-6"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    But, now your danger to prevent,
    You must apply to Mrs. Brent, [2]
    For she, as priestess, knows the rites
    Wherein the God of Earth delights.
    First, nine ways looking, let her stand
    With an old poker in her hand;
    Let her describe a circle round
    In Saunder’s [3] cellar on the ground
    A spade let prudent Archy [4] hold,
    And with discretion dig the mould;
    Let Stella look with watchful eye,
    Rebecea, Ford, and Grattons by.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[202]"
    "line_start": 3000
    "source_sequence": 220
  "translation_ja": |-
    だが今は、お前の危機を救うために、
    ブレント夫人に、頼むがよい。[2]
    巫女である彼女は、心得ている、
    地の神の、お気に召す儀式を。
    まず、九方を見回して、立たせるがよい、
    古い火かき棒を、手に持たせて。
    ぐるりと円を、描かせるがよい、
    ソーンダーズの[3]酒蔵の、地面の上に。
    用心深いアーチーに[4]、鋤を持たせ、
    慎重に、土を掘らせるがよい。
    ステラには、目を凝らして見守らせよ、
    そばには、レベッカ、フォード、グラットンたちを。
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "comparison"
    "text": "Rebecca, Ford, and Grattans by."
    "source_locations":
    - "source_id": "wikisource-1801"
      "precision": "work"
      "url": "https://en.wikisource.org/wiki/The_Works_of_the_Rev._Jonathan_Swift/Volume_7/Stella's_Birthday,_1722-3"
    "description_ja": "第十二行のみ。底本のRebeceaに対してRebecca。人名の読みに参照。"
- "id": "sb1722-stanza-7"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Behold the bottle, where it lies
    With neck elated tow’rds the skies!
    The god of winds, and god of fire,
    Did to its wondrous birth conspire;
    And Bacchus for the poet’s use
    Poured in a strong inspiring juice:
    See! as you raise it from its tomb,
    It drags behind a spacious womb,
    And in the spacious womb contains
    A sovereign med’cine for the brains.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[203]"
    "line_start": 3015
    "source_sequence": 221
  "translation_ja": |-
    見よ、あそこに横たわる瓶を、
    首を高く、空へ向けている！
    風の神と、火の神が、
    力を合わせ、その不思議な誕生を助けた。
    そしてバッカスは、詩人のために、
    力強く、霊感をもたらす液を、注ぎ込んだ。
    見よ、墓から、その瓶を引き上げると、
    大きな腹を、後ろに引きずってくる。
    その大きな腹の中に、収められているのは、
    頭脳のための、無上の妙薬なのだ。
  "translation_status": "reviewed"
- "id": "sb1722-stanza-8"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    You’ll find it soon, if fate consents;
    If not, a thousand Mrs. Brents,
    Ten thousand Archys arm’d with spades,
    May dig in vain to Pluto’s shades.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[204]"
    "line_start": 3025
    "source_sequence": 222
  "translation_ja": |-
    運命が許せば、すぐに見つかる。
    さもなければ、ブレント夫人が千人、
    鋤を携えたアーチーが一万人いようと、
    冥王プルートーの陰の国まで、むなしく掘るばかりだ。
  "translation_status": "reviewed"
- "id": "sb1722-stanza-9"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    From thence a plenteous draught infuse,
    And boldly then invoke the muse
    (But first let Robert on his knees
    With caution drain it from the lees);
    The muse will at your call appear,
    With Stella’s praise to crown the year.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[205]"
    "line_start": 3029
    "source_sequence": 223
  "translation_ja": |-
    そこから、たっぷり一杯を、注ぎ込むがよい。
    それから大胆に、詩の女神を呼べ。
    （だが、先にロバートを膝まずかせ、
    澱を入れぬよう、用心して、酒を移させよ。）
    女神は、お前の呼び声に応えて現れ、
    ステラをたたえる詩で、今年を飾るだろう。
  "translation_status": "reviewed"

- id: sb1718-stanza-1
  section_id: stella-birthday-1718
  kind: verse
  origin: source
  source_text: 'Stella this day is thirty-four

    (We shan’t dispute a year or more)

    However, Stella, be not troubled,

    Although thy size and years are doubled

    Since first I saw thee at sixteen,

    The brightest virgin on the green.

    So little is thy form declined;

    Made up so largely in thy mind.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-623
    precision: block
    url: https://www.gutenberg.org/files/623/623-h/623-h.htm
    xpath: /html/body/p[190]
    source_sequence: 1
  translation_ja: 'ステラは今日で三十四。

    （一つ二つの違いは、言い合うまい。）

    それでもステラ、気にすることはない。

    体つきも年齢も、二倍になったとはいえ、

    私が初めて会った十六のころ、

    野に集う娘たちの中で、君はいちばん輝いていた。

    姿かたちの衰えはほんのわずか、

    心の豊かさが、あり余るほど埋め合わせている。'
  translation_status: reviewed
- id: sb1718-stanza-2
  section_id: stella-birthday-1718
  kind: verse
  origin: source
  source_text: 'Oh, would it please the gods to split

    Thy beauty, size, and years, and wit,

    No age could furnish out a pair

    Of nymphs so graceful, wise, and fair:

    With half the lustre of your eyes,

    With half your wit, your years, and size.

    And then, before it grew too late,

    How should I beg of gentle fate,

    (That either nymph might lack her swain),

    To split my worship too in twain.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-623
    precision: block
    url: https://www.gutenberg.org/files/623/623-h/623-h.htm
    xpath: /html/body/p[191]
    source_sequence: 2
  translation_ja: 'ああ、神々が分けてくださるなら、

    君の美しさも、体つきも、年齢も、才知も。

    どんな時代を探しても、こんな二人の乙女はいまい、

    これほど気品があり、賢く、美しい乙女たちは。

    君の瞳の輝きも半分ずつ、

    才知も、年齢も、体つきも半分ずつなのに。

    そのとき私は、手遅れになる前に、

    優しい運命の神に、どれほど願うことだろう、

    （どちらかの乙女が、恋人なしになってはと、）

    どうかこの私も、二つに分けてほしいと。'
  translation_status: reviewed
  source_variants:
  - kind: comparison
    text: That either nymph might have her swain,
    source_locations:
    - source_id: wikisource-1801
      precision: work

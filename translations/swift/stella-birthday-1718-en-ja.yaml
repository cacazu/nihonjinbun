- id: sb1718-variant-note
  section_id: translator-notes
  kind: note_body
  origin: translator
  source_text: null
  source_languages: []
  source_locations: []
  translation_ja: 第十七行の底本の語句は「どちらかの乙女が恋人を欠くかもしれない」。自分も二人になって相手を務めるという文脈から、欠けてしまうことを案じる意味に訳した。1801年版では「どちらの乙女にも恋人がいるように」となっている。
  translation_status: reviewed

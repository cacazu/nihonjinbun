- "id": "morning-stanza-01"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Now hardly here and there an hackney-coach
    Appearing, show'd the ruddy morn's approach.
    Now Betty from her master's bed had flown,
    And softly stole to discompose her own;
    The slip-shod 'prentice from his master's door
    Had pared the dirt, and sprinkled round the floor.
    Now Moll had whirl'd her mop with dext'rous airs,
    Prepared to scrub the entry and the stairs.
    The youth with broomy stumps began to trace
    The kennel's edge, where wheels had worn the place.[2]
    The small-coal man was heard with cadence deep,
    Till drown'd in shriller notes of chimney-sweep:
    Duns at his lordship's gate began to meet;
    And brickdust Moll had scream'd through half the street.
    The turnkey now his flock returning sees,
    Duly let out a-nights to steal for fees:[3]
    The watchful bailiffs take their silent stands,
    And schoolboys lag with satchels in their hands.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[89]"
    "line_start": 4708
  "translation_ja": |-
    いまは、まだ、そこここに辻馬車が、
    ようやく現れ、赤い朝の近づくのを告げる。
    いま、ベティは、主人の寝床を抜け出し、
    そっと忍び寄り、自分の寝床を乱しておく。
    かかとを踏んだ靴の徒弟は、主人の戸口で、
    泥を削ぎ取り、床の辺りに、水をまいたところだ。
    いま、モールは、器用な身振りでモップを回し、
    入口と階段を、磨く支度を整えた。
    若者は、すり減った箒の切れ端で、なぞり始める、
    車輪が削った、側溝の縁を。[2]
    小粒の炭売りの、低く節のついた声が響く、
    煙突掃除の、甲高い呼び声に、かき消されるまで。
    貴族の屋敷の門に、借金取りが集まり始め、
    煉瓦粉売りのモールは、通りの半分まで叫んで回った。
    牢番は、いま、自分の群れが戻るのを見る、
    毎晩、納付金を盗みで稼ぐため、きちんと放ってやった連中だ。[3]
    目を光らす執行吏が、黙って持ち場につき、
    学校通いの少年たちは、鞄を手に、のろのろ歩く。

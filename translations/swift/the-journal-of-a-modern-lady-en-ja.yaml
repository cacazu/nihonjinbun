  "translation_ja": |-
    さて、しばらく、眺めてみよう、
    夕方のお茶を飲む、われらが奥様を。
    貞淑ぶった女、媚を売る女、鬼婆ども、
    騒々しい取り巻きに、囲まれている。
    やかましい一団に、おびえた沈黙の神は、
    飛んで逃げ去り、
    美しい分別も、その場を去った、
    慎みも、顔を赤らめながら。
    そこへ、うぬぼれきった高慢が現れ、
    いつも大口を開けている醜聞も来る。
    険しい顔をした偽善、
    冷やかし顔の下品な悪口、
    いまにも、はじけそうな下卑た笑い、
    いつでも、いちばん悪く取る悪意。
    手鏡を持った虚栄と、
    真鍮の面の皮を持つ厚かましさ。
    わざとらしく気取った、虚飾も来た、
    手足も顔つきも、一つ残らず、ゆがめながら。
    そして、鉛の脳みそを持つ無知が、
    女たち一人一人の頭上を、飛びまわっていた。

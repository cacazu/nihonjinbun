    "line_start": 9208
  "translation_ja": |-
    しかも、頼みとするのは、舌だけではない、
    自分たち独自の言葉も、話すのだ。
    うなずき、肩をすくめる仕草、目つきの意味を、
    印刷された本より、はるかによく読み取り、
    眉をひそめるだけで、中傷を伝え、
    目くばせ一つで、人の評判を落とし、
    あるいは、扇を、ひらりと動かすだけで、
    あの奥様、あの男と、名指してみせる。
  "translation_status": "reviewed"

- "id": "modern-lady-verse-05"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
           Now to another scene give place:
         Enter the folks with silks and lace:
         Fresh matter for a world of chat,
         Right Indian this, right Mechlin that:
         "Observe this pattern—there's a stuff;
         I can have customers enough.
         Dear madam, you are grown so hard—
         This lace is worth twelve pounds a-yard:
         Madam, if there be truth in man,
         I never sold so cheap a fan."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[186]"
    "line_start": 9208
  "translation_ja": |-
    さて、別の場面へ移ろう。
    絹とレースを持った連中が登場する。
    際限のないおしゃべりに、新たな種、
    これは本物のインド絹、あれは本物のメヘレンのレース。
    「こちらの柄を、ご覧ください、これぞ上物、
    買い手には、事欠きませんよ。
    まあ、奥様、ずいぶん、お値段に厳しくおなりで、
    このレースは、一ヤード、十二ポンドの値打ちがございます。
    奥様、人間の言葉に、誠というものがあるなら、
    扇を、これほど安く売ったことは、一度もございません。」
  "translation_status": "reviewed"
  "attributions":

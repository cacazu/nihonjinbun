    "contributor_id": "swift"
- "id": "modern-lady-verse-15"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
           While thus they rail, and scold, and storm,
         It passes but for common form:
         But, conscious that they all speak true,
         And give each other but their due,
         It never interrupts the game,
         Or makes them sensible of shame.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[186]"
    "line_start": 9208
  "translation_ja": |-
    こうして、ののしり、叱りつけ、わめき合っても、
    ただ、いつもの作法で通ってしまう。
    皆、自分たちの言っていることが真実で、
    お互い、当然のことしか言われていないと、承知しているから、
    それで、勝負が途切れることもなければ、
    恥ずかしく思うこともない。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "modern-lady-verse-16"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
           The time too precious now to waste,
         The supper gobbled up in haste;
         Again afresh to cards they run,
         As if they had but just begun.
         But I shall not again repeat,
         How oft they squabble, snarl, and cheat.
         At last they hear the watchman knock,
         "A frosty morn—past four o'clock."
         The chairmen are not to be found,
         "Come, let us play the other round."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[186]"
    "line_start": 9208
  "translation_ja": |-
    いまや、時間は貴重で、無駄にはできず、
    夜食を、大急ぎで、がつがつと平らげ、
    また、札のところへ、駆け戻る、
    まるで、たったいま、始めたばかりのように。
    だが、どれほど、言い争い、唸り合い、いかさまをするか、
    もう一度、繰り返すことはするまい。
    ようやく、夜警の戸をたたく音が聞こえる、
    「霜の降りた朝、四時を回りました。」
    駕籠かきは、見つからない、
    「さあ、もう一回り、勝負しましょうよ。」
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "modern-lady-verse-17"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
           Now all in haste they huddle on
         Their hoods, their cloaks, and get them gone;
         But, first, the winner must invite
         The company to-morrow night.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[186]"
    "line_start": 9208
  "translation_ja": |-
    さて、皆、大慌てで、
    頭巾と外套を、ひっかぶり、引き揚げていく。
    ただし、まず、勝った人が、
    明日の夜、この仲間を、招かなければならない。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "modern-lady-verse-18"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
           Unlucky madam, left in tears,
         (Who now again quadrille forswears,)
         With empty purse, and aching head,
         Steals to her sleeping spouse to bed.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[186]"
    "line_start": 9208
  "translation_ja": |-
    不運な奥様は、一人残って涙に暮れ、
    （いままた、カドリーユは、二度としないと誓い、）
    からっぽの財布と、痛む頭を抱えて、
    眠っている夫のそばへ、そっと、寝床に潜り込む。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

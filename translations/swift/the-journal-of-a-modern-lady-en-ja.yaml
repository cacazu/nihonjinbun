- "id": "modern-lady-verse-01"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    SIR, 'twas a most unfriendly part
         In you, who ought to know my heart,
         Are well acquainted with my zeal
         For all the female commonweal—
         How could it come into your mind
         To pitch on me, of all mankind,
         Against the sex to write a satire,
         And brand me for a woman-hater?
         On me, who think them all so fair,
         They rival Venus to a hair;
         Their virtues never ceased to sing,
         Since first I learn'd to tune a string?
         Methinks I hear the ladies cry,
         Will he his character belie?
         Must never our misfortunes end?
         And have we lost our only friend?
         Ah, lovely nymphs! remove your fears,
         No more let fall those precious tears.
         Sooner shall, etc.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[186]"
    "line_start": 9208
  "translation_ja": |-
    あなた、それは、何と薄情な仕打ちであったろう。
    私の心を知っているはずの、あなたともあろう人が、
    すべての女性の幸せのために、
    私がいかに熱を入れているか、よくご存じの人が。
    どうして、そんなことを、思いつけたのか、
    この世のあらゆる男のうちから、私を選んで、
    女性に向けた風刺を書かせ、
    女嫌いの烙印を、私に押そうとは。
    私は、女性は誰もが、たいそう美しく、
    ヴィーナスにも、寸分の差なく張り合うと思っている。
    初めて、詩の弦を調べる術を覚えて以来、
    その美徳を、絶えず歌ってきた、この私を。
    淑女たちの叫ぶ声が、聞こえるようだ、
    「あの方は、自分の評判を裏切るのかしら。
    私たちの不幸は、いつまでたっても終わらないの。
    ただ一人の味方まで、失ってしまったの。」
    ああ、愛らしい乙女たち、心配はお捨てなさい。
    その貴い涙を、もう流さないでほしい。
    それより先に、何々が起ころう、云々。
  "translation_status": "reviewed"

- "id": "modern-lady-verse-03"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
           'Twas you engaged me first to write,
         Then gave the subject out of spite:
         The journal of a modern dame,
         Is, by my promise, what you claim.
         My word is past, I must submit;
         And yet perhaps you may be bit.
         I but transcribe; for not a line
         Of all the satire shall be mine.
         Compell'd by you to tag in rhymes
         The common slanders of the times,
         Of modern times, the guilt is yours,
         And me my innocence secures.
         Unwilling Muse, begin thy lay,
         The annals of a female day.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[186]"
    "line_start": 9208
  "translation_ja": |-
    初めに、書いてくれと私に頼んだのは、あなただった。
    そして、意地悪にも、題材をお決めになった。
    今どきの淑女の日記、
    約束どおり、それを書けと、おっしゃるのだ。
    一度口にした以上、従わねばなるまい。
    だが、ひょっとすると、あなたのほうが一杯食うかもしれぬ。
    私は、ただ写すだけ、風刺のうち、
    一行たりとも、私のものにはならない。
    あなたに強いられて、韻にくくるのは、
    この時代の、ありふれた悪口、
    今どきの世間の悪口なのだから、罪はあなたにある、
    私は、潔白の身で、安全というわけだ。
    気の進まぬ詩の女神よ、さあ、お前の歌を始めよ、
    一人の女の、一日の記録を。
  "translation_status": "reviewed"
  "attributions":

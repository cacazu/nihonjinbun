- "id": "modern-lady-verse-08"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
           Why should I ask of thee, my Muse,
         A hundred tongues, as poets use,
         When, to give every dame her due,
         A hundred thousand were too few?
         Or how should I, alas! relate
         The sum of all their senseless prate,
         Their innuendoes, hints, and slanders,
         Their meanings lewd, and double entendres?
         Now comes the general scandal charge;
         What some invent, the rest enlarge;
         And, "Madam, if it be a lie,
         You have the tale as cheap as I;
         I must conceal my author's name:
         But now 'tis known to common fame."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[186]"
    "line_start": 9208
  "translation_ja": |-
    なぜ、私の詩の女神よ、お前に、
    詩人たちの常のように、百の舌を求めようか、
    奥様方を、一人残らず、存分に描き出すには、
    十万の舌でも、まだ足りないのだから。
    それに、ああ、どうして私が語り尽くせよう、
    あの愚かなおしゃべりの、何もかもを、
    当てこすり、ほのめかし、陰口、
    卑猥な含みや、二重の意味を持つ言葉を。
    さて、いっせいに、醜聞の攻撃が始まる、
    ある者がこしらえれば、ほかの者が話を膨らます。
    そして、「奥様、もし嘘だったとしても、
    私同様、あなたも、ただでお聞きになったお話ですからね。
    誰に聞いたかは、伏せておかなければなりませんが、
    もう、世間じゅうに知られていることですよ。」
  "translation_status": "reviewed"
  "attributions":

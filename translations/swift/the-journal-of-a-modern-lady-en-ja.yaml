    "xpath": "/html/body/pre[186]"
    "line_start": 9208
  "translation_ja": |-
    いまや、声に声が重なり、
    誰もが、いちばん大きな声を出そうと競う。
    否定し、断言し、言い争い、
    どの舌も、一瞬たりとも黙らない。
    皆、しゃべることに夢中で、聞こうとする者はなく、
    座敷犬まで、吠え出させる。
    そのおしゃべりの騒々しさは、
    ジンを一杯飲んだ魚売り女たちよりも、まだひどい。
    教師を締め出す生徒たちでさえ、
    これほど、とめどない騒ぎを立てたためしはない。
    混沌の中で、ぶつかり合う物質の粒でさえ、
    これほど、がたがたと音を立てなかった。
    選挙用の酸っぱいエールに酔って、
    群衆が上げる怒号や罵声も、はるかに及ばない。
  "translation_status": "reviewed"

    "line_start": 9208
  "translation_ja": |-
    この大事な用事が済み、
    四時には、奥様の身支度も、ほぼ整う。
    従僕が、いつもの言い方で、
    「奥様、お食事がお待ちしております。」と、上がってくる。
    奥様も、いつもの調子で答える、
    「料理人に、もうしばらく待たせるように言いなさい。
    身支度をする時間が、ちっとも取れないわ、
    私ほど時間をかけない女なんて、この世にいないのに。
    こう急かされては、気分まで悪くなる、
    食事なんか、悪魔にくれてやりたいわ。」
    さて、食卓で、奥様は自分の役を演じ、
    食事どきの決まり文句を、何一つ忘れずに披露する。
    「今日は、二人だけで食事をすると思っていたわ、
    あなた、だって、もしも、知っていたなら、
    皆様が、今日いらっしゃると――
    でも、本当に、うちの人は、いつもこうなのよ。
    お友達をお招きになるときも、
    知らせをよこしてくれない、薄情な人なの。
    どうか、お料理が足りますように。」
    こうした、くだらぬことばかりで、
    座ったまま、客という客を苦しめ、
    一瞬たりとも、舌を休ませない。
    使い古され、陳腐で、ありきたりの言い回し、
    それを、今どきの淑女は、上品だと称している。
    見れば、間抜けな夫が、席について、
    妻の機知に、感心しているではないか。

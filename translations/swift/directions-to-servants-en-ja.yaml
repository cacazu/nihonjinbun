    "printed_page": "163"
  "translation_ja": |-
    第九章
    侍女心得。
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c09-001"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "TWO accidents have happened to lessen the comforts and profits of your employment; first, that execrable custom got among ladies of trucking their old clothes for china, or turning them to cover easy chairs, or making them into patchwork for screens, stools, cushions, and the like. The second is, the invention of small chests and trunks with lock and key, wherein they keep the tea and sugar, without which it is impossible for a waitingmaid to live: for, by this means you are forced to buy brown sugar, and pour water upon the leaves, when they have lost all their spirit and taste. I cannot contrive any perfect remedy against either of these two evils. As to the former, I think there should be a general confederacy of all the servants in every family, for the publick good, to drive those china hucksters from the doors; and as to the latter, there is no other method to relieve yourselves, but by a false key, which is a point both difficult and dangerous to compass; but, as to the circumstance of honesty in procuring one, I am under no doubt, when your mistress gives you so just a provocation by refusing you an ancient and legal perquisite. The mistress of the tea shop may now and then give you half an ounce; but that will be only a drop in the bucket: therefore I fear you must be forced, like the rest of your sisters, to run in trust, and pay for it out of your wages, as far as they will go, which you can easily make up other ways, if your lady be handsome, or her daughters have good fortunes."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[264]"
    "line_start": 1086
    "source_sequence": 1460
    "printed_page": "163"
  "translation_ja": "二つの出来事が起こって、あなたの仕事の楽しみと利益を減らしてしまった。第一は、奥さま方の間に広まった、古い服を磁器と交換したり、安楽椅子の張り地にしたり、つぎはぎ細工にして衝立、腰掛け、クッションなどを覆ったりする、あの忌まわしい習慣である。第二は、鍵と錠の付いた小箱や長持ちが発明され、侍女が生きていくのに欠かせない茶と砂糖を、奥さま方がそこにしまうことである。このため、あなたは黒砂糖を買い、香りも味もすっかり抜けた茶葉に湯を注がなければならなくなる。どちらの害にも、完全な救済策は思いつかない。第一については、公益のため、あらゆる家の奉公人全員が同盟し、磁器の行商人を戸口から追い払うべきだと思う。第二については、合鍵で身を助けるほかないが、これを手に入れるのは難しく、危険でもある。だが、手に入れることが正直かどうかという点には、私は何の疑問も持たない。奥さまが、古くからの正当な役得を拒み、それほどもっともな憤りの種を与えているのだから。茶の店の女将が、ときどき半オンスくれるかもしれないが、それも大海の一滴にすぎない。だから恐らく、ほかの仲間たちと同じく、つけで買い、賃金の続く限りそこから払うほかないだろう。奥さまが美しいか、お嬢さまたちに十分な財産があれば、ほかの方法で簡単に取り戻せる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c09-002"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are in a great family, and my lady's woman, my lord may probably like you, although you are not half so handsome as his own lady. In this case take care to get as much out of him as you can; and never allow him the smallest liberty, not the squeezing of your hand, unless he puts a guinea into it; so by degrees make him pay accordingly for every new attempt, doubling upon him in proportion to the concessions you allow, and always struggling, and threatening to cry out, or tell your lady, although you receive his money: five guineas for handling your breast is a cheap pennyworth, although you seem to resist with all your might; but never allow him the last favour under a hundred guineas, or a settlement of twenty pounds a year for life."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[265]"
    "line_start": 1088
    "source_sequence": 1468
    "printed_page": "164"
  "translation_ja": "大きな家で奥方付きの侍女をしているなら、あなたが奥方の半分ほども美しくなくても、旦那さまに気に入られることがある。この場合は、できるだけ多くを引き出すよう心がけなさい。どんなささいな自由も許さず、手を握るだけでも、そこへ一ギニー入れてもらわなければいけない。そうして、新しい試みのたびに相応の金を払わせ、譲歩する分に応じて、取り分を倍にしていきなさい。金を受け取っても、いつも抵抗し、大声を出すとか、奥方に話すとか脅すこと。力いっぱい拒んでいるように見せながらでも、胸を触らせるのに五ギニーなら、安い買い物だ。ただし、最後の恩恵だけは、百ギニーか、生涯年二十ポンドを受け取る取り決めがなければ、決して許してはいけない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c09-003"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In such a family, if you are handsome, you will have the choice of three lovers; the chaplain, the steward, and my lord's gentleman. I would first advise you to choose the steward; but if you happen to be young with child by my lord, you must take up with the chaplain. I like my lord's gentleman the least of the three; for he is usually vain and saucy from the time he throws off his livery; and if he misses a pair of colours, or a tidewaiter's place, he has no remedy but the highway."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[266]"
    "line_start": 1090
    "source_sequence": 1470
    "printed_page": "164"
  "translation_ja": "そのような家で、あなたに器量があれば、付き牧師、家令、旦那さま付きの従者という、三人の恋人から選べるだろう。まず家令を選ぶことを勧める。だが、もし旦那さまの子を身ごもって間もないなら、付き牧師で手を打たなければならない。三人のうち、旦那さま付きの従者は、私はいちばん気に入らない。お仕着せを脱ぎ捨てたときから、たいてい気取り屋で生意気になるうえ、軍旗を持つ職か、入港船の税関監視員の職を逃せば、追い剥ぎ以外に道がないからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c09-004"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I must caution you particularly against my lord's eldest son: if you are dextrous enough, it is odds that you may draw him in to marry you, and make you a lady: if he be a common rake (and he must be one or t'other), avoid him like Satan; for he stands less in awe of a mother, than my lord does of a wife; and after ten thousand promises, you will get nothing from him, but a big belly or a clap, and probably both together."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[267]"
    "line_start": 1092
    "source_sequence": 1472
    "printed_page": "164"
  "translation_ja": "旦那さまの長男には、特に用心するよう言っておかねばならない。十分に手際がよければ、結婚へ引き込んで、奥方にしてもらえる見込みは大きい。ありふれた放蕩者なら――どちらかに違いないのだが――悪魔同然に避けなさい。旦那さまが奥方を恐れるほどには、母親を恐れていないからだ。一万もの約束のあとに手に入るのは、大きな腹か淋病だけで、おそらく両方一緒だろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c09-005"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your lady is ill, and after a very bad night is getting a little nap in the morning, if a footman comes with a message to inquire how she does, do not let the compliment be lost, but shake her gently until she wakes; then deliver the message, receive her answer, and leave her to sleep."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[268]"
    "line_start": 1094
    "source_sequence": 1478
    "printed_page": "165"
  "translation_ja": "奥さまが病気で、ひどい夜を過ごしたあと、朝になって少しうとうとしているとき、従僕が容体伺いの伝言を持ってきたら、その挨拶を無駄にせず、そっと揺すって起こしなさい。それから伝言を伝え、返事を受け取り、そのまま眠らせておくこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c09-006"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are so happy as to wait on a young lady with a great fortune, you must be an ill manager if you cannot get five or six hundred pounds for disposing of her. Put her often in mind, that she is rich enough to make any man happy; that there is no real happiness but in love; that she has liberty to choose wherever she pleases, and not by the directions of parents, who never give allowances for an innocent passion; that there are a world of handsome, fine, sweet young gentlemen in town, who would be glad to die at her feet; that the conversation of two lovers is a Heaven upon earth; that love, like death, equals all conditions; that if she should cast her eyes upon a young fellow below her in birth and estate, his marrying her would make him a gentleman; that you saw yesterday on the Mall the prettiest ensign; and that if you had forty thousand pounds it should be at his service. Take care that every body should know what lady you live with; how great a favourite you are; and that she always takes your advice. Go often to St. James's Park; the fine fellows will soon discover you, and contrive to slip a letter into your sleeve or your bosom: pull it out in a fury, and throw it on the ground, unless you find at least two guineas along with it; but in that case, seem not to find it, and to think he was only playing the wag with you: when you come home, drop the letter carelessly in your lady's chamber; she finds it, is angry; protest you knew nothing of it, only you remember, that a gentleman in the Park struggled to kiss you, and you believe it was he that put the letter into your sleeve or petticoat; and indeed he was as pretty a man as ever you saw: that she may burn the letter if she pleases. If your lady be wise, she will burn some other paper before you, and read the letter when you are gone down. You must follow this practice as often as you safely can; but let him, who pays you best with every letter, be the handsomest man. If a footman presumes to bring a letter to the house to be delivered to you for your lady, although it come from your best customer, throw it at his head; call him impudent rogue and villain, and shut the door in his face: run up to your lady, and as a proof of your fidelity, tell her what you have done."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[269]"
    "line_start": 1096
    "source_sequence": 1480
    "printed_page": "165"
  "translation_ja": "幸運にも、大きな財産のある若いお嬢さまに仕えているなら、その結婚の始末をつけて五、六百ポンドを得られないのは、あなたの取り回しが悪いからだ。たびたびお嬢さまに思い出させなさい。どんな男でも幸せにできるだけの財産があること、本当の幸せは恋にしかないこと、罪のない情熱を決して大目に見ない親の指図ではなく、どこでも好きに選ぶ自由があること、町には足元で喜んで死のうという、男前で、立派で、優しい若い紳士が大勢いること、恋人どうしの語らいは地上の天国であること、恋は死と同じく、あらゆる身分を等しくすること、生まれと財産で劣る若者に目を向けても、その人は結婚すれば紳士になること、昨日モールの並木道で、この上なくすてきな少尉を見たこと、自分に四万ポンドあれば、その人へ差し出すのに、ということを。自分がどのお嬢さまに仕え、どれほど気に入られ、いつも自分の助言が受け入れられるか、誰もが知るようにしておきなさい。セント・ジェームズ公園へしばしば行けば、すてきな男たちはすぐあなたを見つけ、袖や胸元へ手紙を滑り込ませようとするだろう。一緒に少なくとも二ギニーが入っていない限り、怒り狂って引きずり出し、地面へ投げ捨てること。入っていれば、気づかないふりをし、ただいたずらをされたと思っているようにしなさい。帰宅したら、お嬢さまの部屋へ、うっかり手紙を落とすこと。見つけて怒られたら、何も知らなかった、ただ、公園である紳士が口づけしようと揉み合ったのを覚えている、その人が袖かペティコートへ入れたのだと思う、実際、今まで見た中でも特別にすてきな方だった、手紙はお望みなら焼いてよい、と言い張りなさい。お嬢さまが賢ければ、あなたの前では別の紙を焼き、あなたが下へ去ってから手紙を読む。このやり方は、安全な限り何度でも続けること。ただし、手紙のたびにいちばん多く払う男を、いちばん男前にしておきなさい。従僕が、お嬢さま宛ての手紙をあなたに渡そうと、厚かましくも家へ持ってきたら、たとえいちばんの得意客からであっても、その頭に投げつけなさい。無礼な悪党、ならず者と罵り、鼻先で戸を閉めること。それからお嬢さまのもとへ駆け上がり、忠実さの証拠として、自分のしたことを話しなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c09-007"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I could enlarge very much upon this subject, but I trust to your own discretion."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[270]"
    "line_start": 1098
    "source_sequence": 1488
    "printed_page": "166"
  "translation_ja": "この話はいくらでも長くできるが、あとはあなた自身の分別に任せよう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c09-008"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you serve a lady, who is a little disposed to gallantries, you will find it a point of great prudence how to manage: three things are necessary. First, how to please your lady; secondly, how to prevent suspicion in the husband, or among the family; and lastly, but principally, how to make it most for your own advantage. To give you full directions in this important affair would require a large volume. All assignations at home are dangerous both to your lady and yourself; and therefore contrive, as much as possible, to have them in a third place; especially if your lady, as it is a hundred odds, entertains more lovers than one, each of whom is often more jealous than a thousand husbands; and very unlucky rencounters may often happen under the best management. I need not warn you to employ your good offices chiefly in favour of those, whom you find most liberal: yet, if your lady should happen to cast an eye upon a handsome footman, you should be generous enough to bear with her humour, which is no singularity, but a very natural appetite: it is still the safest of all home intrigues, and was formerly the least suspected, until of late years it has grown more common. The great danger is, lest this kind of gentry, dealing too often in bad ware, may happen not to be sound; and then your lady and you are in a very bad way, although not altogether desperate."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[271]"
    "line_start": 1100
    "source_sequence": 1490
    "printed_page": "166"
  "translation_ja": "恋の戯れを少し好む奥さまに仕えているなら、どう取り回すかは、大いに賢さの要る問題となる。必要なのは三つだ。第一に、どうすれば奥さまを喜ばせられるか。第二に、どうすれば夫や家の者に疑われずにすむか。そして最後に、何よりも、自分の利益を最大にするにはどうすればよいか。この大事な仕事について、すべて教えを授けるには、分厚い一巻が必要になる。家の中での逢い引きは、どれも奥さまにもあなたにも危険なので、できる限り、よそで会うよう工夫しなさい。特に、百に一つを除けばまずそうだが、奥さまに恋人が二人以上いる場合には、なおさらだ。そういう男は、一人でも夫千人より嫉妬深いことが多く、どれほどうまく取り計らっても、ひどくまずい鉢合わせは、しばしば起こり得る。いちばん気前のよい男を主に取り持つよう、わざわざ忠告する必要はあるまい。ただし、奥さまがたまたま男前の従僕に目を向けたなら、その好みを許すだけの寛大さを持つこと。変わったことではなく、とても自然な欲求なのだから。それでもなお、家の中の情事では、これがいちばん安全だ。近年、より普通になるまでは、以前はいちばん疑われなかったものでもある。大きな危険は、この種の紳士たちが、しょっちゅう悪い品物を扱っているので、たまたま身体が健全でないかもしれないことだ。そうなると、奥さまもあなたも、まるで絶望的とはいえないにしても、ひどく困った立場になる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c09-009"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But to say the truth, I confess it is a great presumption in me to offer you any instructions in the conduct of your lady's amours, wherein your whole sisterhood is already so expert, and deeply learned; although it be much more difficult to compass, than that assistance which my brother footmen give their masters on the like occasion; and therefore I leave this affair to be treated by some abler pen."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[272]"
    "line_start": 1102
    "source_sequence": 1496
    "printed_page": "167"
  "translation_ja": "だが本当のところ、奥さまの恋の取り回しについて、あなたに何か教えようというのは、大いなる思い上がりだと認める。あなたがたの仲間全員が、すでにそれほど熟達し、深く学んでいるのだから。もっとも、同じような場合に、わが同業の従僕たちが主人を手助けするより、ずっと難しくはある。だから、この仕事は、もっと腕のよい書き手に任せよう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c09-010"
  "section_id": "chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you lock up a silk mantua, or laced head, in a trunk or chest, leave a piece out, that when you open the trunk again, you may know where to find it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[273]"
    "line_start": 1104
    "source_sequence": 1498
    "printed_page": "167"
  "translation_ja": "絹のドレスやレースの頭飾りを長持ちや箱にしまって鍵をかけるときは、少しはみ出させておきなさい。次に開けたとき、どこにあるか分かるようにするためだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-heading"
  "section_id": "chapter-10"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    CHAP. X.
    Directions to the Housemaid.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/div[43]/p"
    "line_start": 1106
    "source_sequence": 1509
    "printed_page": "168"
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/div[44]/p"
    "line_start": 1108
    "source_sequence": 1513
    "printed_page": "168"
  "translation_ja": |-
    第十章
    女中心得。
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-001"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "IF your master and lady go into the country for a week or more, never wash the bedchamber or diningroom until just the hour before you expect them to return: thus the rooms will be perfectly clean to receive them, and you will not be at the trouble to wash them so soon again."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[275]"
    "line_start": 1111
    "source_sequence": 1517
    "printed_page": "168"
  "translation_ja": "主人と奥さまが一週間かそれ以上、田舎へ出かけたら、寝室と食堂の床は、帰宅の予定時刻のわずか一時間前まで、決して水拭きしてはいけない。そうすれば、部屋は完全に清潔な状態で迎えられ、それだけ早くまた洗う手間もかからずにすむ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-002"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am very much offended with those ladies who are so proud and lazy, that they will not be at the pains of stepping into the garden to pluck a rose, but keep an odious implement, sometimes in the bedchamber itself, or at least in a dark closet adjoining, which they make use of to ease their worst necessities; and you are the usual carriers away of the pan; which makes not only the chamber, but even their clothes, offensive to all who come near. Now to cure them of this odious practice, let me advise you, on whom the office lies, to convey away this utensil, that you will do it openly, down the great stairs, and in the presence of the footmen; and if any body knocks, to open the street door, while you have the vessel filled in your hands; this, if any thing can, will make your lady take the pains of evacuating her person in the proper place, rather than expose her filthiness to all the menservants in the house."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[276]"
    "line_start": 1113
    "source_sequence": 1521
    "printed_page": "168"
  "translation_ja": "私をひどく不快にさせるのは、高慢で怠け者のあまり、庭へ出て薔薇を一輪摘む手間さえ嫌がり、ときには寝室そのものに、少なくとも隣の暗い小部屋に、忌まわしい道具を置いて、いちばん厄介な用を足す奥さま方である。その器を運び去るのは、普通あなたの役目なので、部屋だけでなく、奥さまの服まで、近寄る誰にとっても臭くなる。そこで、この忌まわしい習慣を直させるため、その道具を運び去る役目を負うあなたに、助言しよう。大階段を、従僕たちの目の前で、堂々と運び下ろしなさい。誰かが戸をたたけば、中身の入った器を手にしたまま、表の戸を開けること。何かが効くとすれば、これこそ、奥さまが家じゅうの男の奉公人に汚物をさらすより、しかるべき場所へ行って用を足す手間をかける気になるはずだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-003"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Leave a pail of dirty water with the mop in it, a coal-box, a bottle, a broom, a chamberpot, and such other unsightly things, either in a blind entry, or upon the darkest part of the backstairs, that they may not be seen; and if people break their shins by trampling on them, it is their own fault."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[277]"
    "line_start": 1115
    "source_sequence": 1523
    "printed_page": "168"
  "translation_ja": "汚れた水とモップの入った桶、石炭箱、瓶、ほうき、便器、その他の見苦しいものは、奥まった通路か、裏階段のいちばん暗いところに置き、見えないようにしなさい。人がそれにつまずいて脛を傷めても、本人の落ち度である。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-004"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never empty the chamberpots until they are quite full: if that happens in the night, empty them into the street; if in the morning, into the garden; for it would be an endless work to go a dozen times from the garret and upper rooms down to the backside; but never wash them in any other liquor except their own: what cleanly girl would be dabbling in other folk's urine? and besides, the smell of stale, as I observed before, is admirable against the vapours; which, a hundred to one, may be your lady's case."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[278]"
    "line_start": 1117
    "source_sequence": 1529
    "printed_page": "169"
  "translation_ja": "便器は、いっぱいになるまで、決して空けてはいけない。夜中にいっぱいになれば通りへ、朝なら庭へ捨てること。屋根裏や上の部屋から裏庭まで、十二度も降りていては、きりがない。だが、洗うときは、中身の尿以外の液体を決して使わないこと。清潔な娘が、よその人の尿を手でいじくり回すだろうか。そのうえ、先にも述べたように、古い尿の匂いは、憂鬱な気分によく効く。百に一つを除けば、奥さまもその病かもしれないのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-005"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Brush down the cobwebs with a broom that is wet and dirty, which will make them stick the faster to it, and bring them down more effectually."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[279]"
    "line_start": 1119
    "source_sequence": 1531
    "printed_page": "169"
  "translation_ja": "蜘蛛の巣は、濡れて汚れたほうきで払い落としなさい。そのほうが、ほうきへしっかりくっつき、よく落とせる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-006"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you rid up the parlour hearth in a morning, throw the last night's ashes into a sieve; and what falls through, as you carry it down, will serve instead of sand for the rooms and the stairs."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[280]"
    "line_start": 1121
    "source_sequence": 1533
    "printed_page": "169"
  "translation_ja": "朝、居間の炉床を片づけるときは、昨晩の灰をふるいへ放り込みなさい。運び下ろす途中でこぼれ落ちる分は、部屋や階段にまく砂の代わりになる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-007"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you have scoured the brasses and irons in the parlour chimney, lay the foul wet clout upon the next chair, that your lady may see you have not neglected your work: observe the same rule, when you clean the brass locks, only with this addition, to leave the marks of your fingers on the doors, to show you have not forgot."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[281]"
    "line_start": 1123
    "source_sequence": 1535
    "printed_page": "169"
  "translation_ja": "居間の暖炉の真鍮や鉄の道具を磨いたら、汚れた濡れ布は、いちばん近くの椅子へ置き、仕事を怠らなかったと奥さまに分かってもらいなさい。真鍮の錠前を磨いたときも、同じ決まりを守ること。ただし、こちらはもう一つ、忘れずにやったと示すため、戸に指の跡を残しておきなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-008"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Leave your lady's chamberpot in her bedchamber window all day to air."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[282]"
    "line_start": 1125
    "source_sequence": 1537
    "printed_page": "169"
  "translation_ja": "奥さまの便器は、一日中、寝室の窓に置き、風に当てておきなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-009"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Bring up none but large coals to the diningroom and your lady's chamber; they make the best fires, and if you find them too big, it is easy to break them on the marble hearth."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[283]"
    "line_start": 1127
    "source_sequence": 1539
    "printed_page": "169"
  "translation_ja": "食堂と奥さまの部屋へは、大きな石炭だけを運びなさい。いちばんよい火ができるし、大きすぎたら、大理石の炉床で簡単に割れる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-010"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you go to bed, be sure take care of fire; and therefore blow the candle out with your breath, and then thrust it under your bed. Note, the smell of the snuff is very good against vapours."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[284]"
    "line_start": 1129
    "source_sequence": 1545
    "printed_page": "170"
  "translation_ja": "寝るときは、必ず火の用心をしなさい。だから、ろうそくは息で吹き消し、そのあと寝床の下へ押し込むこと。なお、焦げた芯の匂いは、憂鬱な気分にたいそうよく効く。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-011"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Persuade the footman, who got you with child, to marry you before you are six months gone; and if your lady asks you, why you would take a fellow who was not worth a groat? let your answer be, That service is no inheritance."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[285]"
    "line_start": 1131
    "source_sequence": 1547
    "printed_page": "170"
  "translation_ja": "自分を身ごもらせた従僕には、妊娠六か月になる前に結婚するよう説得しなさい。奥さまに、一グロートの値打ちもない男をなぜ選ぶのかと聞かれたら、奉公は世襲の財産ではありませんから、と答えること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-012"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your lady's bed is made, put the chamber pot under it; but in such a manner, as to thrust the valance along with it, that it may be full in sight, and ready for your lady when she has occasion to use it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[286]"
    "line_start": 1133
    "source_sequence": 1549
    "printed_page": "170"
  "translation_ja": "奥さまの寝床を整えたら、その下へ便器を置きなさい。ただし、寝台の垂れ布も一緒に押し込み、便器がすっかり見え、奥さまが使いたくなったら、すぐ用意ができているようにすること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-013"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lock up a cat or a dog in some room or closet, so as to make such a noise all over the house as may frighten away the thieves, if any should attempt to break or steal in."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[287]"
    "line_start": 1135
    "source_sequence": 1551
    "printed_page": "170"
  "translation_ja": "猫か犬をどこかの部屋か小部屋へ閉じ込め、家じゅうに響く騒ぎをさせなさい。押し入ったり、忍び込んだりしようとする盗人がいれば、怖がって逃げるようにするためだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-014"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you wash any of the rooms toward the street over night, throw the foul water out of the street door; but be sure not to look before you, for fear those on whom the water lights might think you uncivil, and that you did it on purpose. If he who suffers, breaks the windows in revenge, and your lady chides you, and gives positive orders that you should carry the pail down, and empty it in the sink, you have an easy remedy: when you wash an upper room, carry down the pail so as to let the water dribble on the stairs all the way down to the kitchen; by which not only your load will be lighter, but you will convince your lady, that it is better to throw the water out of the windows, or down the streetdoor steps: besides, this latter practice will be very diverting to you and the family in a frosty night, to see a hundred people on their noses or backsides before your door, when the water is frozen."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[288]"
    "line_start": 1137
    "source_sequence": 1553
    "printed_page": "170"
  "translation_ja": "晩、通りに面した部屋を水拭きしたら、汚れた水は表の戸から放り出しなさい。ただし、決して前を見ないこと。水をかけられた人に、あなたが無作法で、わざとしたと思われてはいけないからだ。被害者が仕返しに窓を割り、奥さまが叱って、桶を下へ運び、流しへ空けろと厳命なさったら、簡単な手がある。上の部屋を洗ったとき、桶を運び下ろしながら、台所までの階段にずっと水が垂れるようにするのだ。そうすれば、荷が軽くなるばかりか、窓からか、表の戸口の段へ水を捨てるほうがよいと、奥さまに納得してもらえる。そのうえ、凍える晩には、後のやり方は、あなたも一家もたいそう楽しめる。水が凍ると、戸口の前で百人もの人が、鼻から倒れたり、尻餅をついたりするのを見られるからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-015"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Polish and brighten the marble hearths and chimney pieces with a clout dipt in grease; nothing makes them shine so well; and it is the business of the ladies to take care of their petticoats."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[289]"
    "line_start": 1139
    "source_sequence": 1559
    "printed_page": "171"
  "translation_ja": "大理石の炉床や暖炉飾りは、脂に浸した布で磨いて光らせなさい。これほどよく光るものはない。ペティコートに気をつけるのは、奥さま方の仕事である。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c10-016"
  "section_id": "chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your lady be so nice that she will have the room scoured with freestone, be sure to leave the marks of the freestone six inches deep round the bottom of the wainscot, that your lady may see your obedience to her orders."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[290]"
    "line_start": 1141
    "source_sequence": 1561
    "printed_page": "171"
  "translation_ja": "奥さまが気難しくて、部屋を磨き石で磨かせたがるなら、必ず壁板の下の周りに、六インチ幅の磨き石の跡を残し、命令に従ったことが分かるようにしなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

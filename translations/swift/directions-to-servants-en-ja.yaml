- "id": "dts-editorial-introduction"
  "section_id": "editorial-introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The directions to Servants is evidently an unfinished performance; some parts of it containing merely rough outlines. Mr. Faulkner, who printed it in 1745, observes, \"it may be seen from scattered papers, wherein were given hints for a dedication and preface, and a list of all degrees of servants, that the author intended to have gone through all their characters.\" — Lord Orrery says, \"the manuscript was handed about, and much applauded in the dean's life time;\" and that it is \"written in so facetious a kind of low humour, that it must please many readers; nor is it without some degree of merit, try pointing out with an amazing exactness (and what in a less trivial case must have been called judgment) the faults, blunders, tricks, lies, and various knaveries of domestick servants.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/div[2]"
    "line_start": 529
    "source_sequence": 445
    "printed_page": "100"
  "translation_ja": "『奉公人心得』が未完の作であることは明らかであり、いくつかの部分には、粗い輪郭しか記されていない。一七四五年にこれを刊行したフォークナー氏は、「献辞と序文のための覚書や、あらゆる階級の奉公人の一覧を記した、ばらばらの原稿が残っていることから、著者には、彼らすべての性格を扱うつもりがあったと分かる」と述べている。オーラリー卿によると、「この原稿は首席司祭の存命中に人々の間で回覧され、大いに喝采を受けた」。また、「俗な笑いが、なんともおどけた調子で書かれており、多くの読者を喜ばせずにはおかない。家庭の奉公人の欠点、へま、ごまかし、嘘、さまざまな悪だくみを、驚くほど正確に指摘している点で、それなりの価値もある。これほどささいな主題でなければ、その正確さは判断力と呼ばれたに違いない」と述べている。"
  "translation_status": "reviewed"
  "source_kind": "source_editorial"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "1801年版の本作固有の編者説明。個人署名はなく、巻の編者名から特定執筆者へ帰属させない。"
- "id": "dts-general-heading"
  "section_id": "general"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    RULES THAT CONCERN
    ALL SERVANTS IN GENERAL.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/div[4]/p[1]"
    "line_start": 535
    "source_sequence": 470
    "printed_page": "101"
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/div[4]/p[2]"
    "line_start": 537
    "source_sequence": 471
    "printed_page": "101"
  "translation_ja": "すべての奉公人に共通する心得"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-001"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "WHEN your master or lady calls a servant by name, if that servant be not in the way, none of you are to answer, for then there will be no end of your drudgery: and masters themselves allow, that if a servant comes when he is called, it is sufficient."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[7]"
    "line_start": 541
    "source_sequence": 481
    "printed_page": "101"
  "translation_ja": "主人や奥さまが、奉公人を名指しで呼んだとき、その者がそこにいなければ、誰も返事をしてはいけない。そんなことをすれば、こき使われるのにきりがなくなるからである。主人たち自身も、呼ばれた奉公人が来れば、それで十分だと認めている。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-002"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you have done a fault, be always pert and insolent, and behave yourself as if you were the injured person; this will immediately put your master or lady off their mettle."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[8]"
    "line_start": 544
    "source_sequence": 486
    "printed_page": "101"
  "translation_ja": "へまをしたときは、いつも生意気で横柄にし、自分のほうが被害者であるかのように振る舞いなさい。そうすれば主人や奥さまの勢いを、たちまちくじくことができる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-003"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you see your master wronged by any of your fellow-servants, be sure to conceal it for fear of being called a telltale: however, there is one exception in case of a favourite servant, who is justly hated by the whole family; who therefore are bound in prudence to lay all the faults they can upon the favourite."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[9]"
    "line_start": 546
    "source_sequence": 488
    "printed_page": "101"
  "translation_ja": "仲間の奉公人が主人に損をさせているのを見かけても、告げ口屋と呼ばれないよう、必ず隠しておきなさい。ただし例外が一つある。屋敷じゅうの者が、もっともなことに嫌っている、お気に入りの奉公人の場合である。この場合はみな、用心のため、できるだけあらゆる落ち度を、そのお気に入りにかぶせるべきである。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-004"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The cook, the butler, the groom, the marketman, and every other servant who is concerned in the expenses of the family, should act as if his master's whole estate ought to be applied to that servant's particular business. For instance, if the cook computes his master's estate to be a thousand pounds a year, he reasonably concludes, that a thousand pounds a year will afford meat enough, and therefore he need not be sparing; the butler makes the same judgment; so may the groom and the coachman; and thus every branch of expense will be filled to your master's honour."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[10]"
    "line_start": 548
    "source_sequence": 490
    "printed_page": "101"
  "translation_ja": "料理人、執事、馬丁、買出し係、そのほか家の支出にかかわる奉公人はみな、主人の全財産を、自分の受け持つ仕事だけに使うべきものとして振る舞うこと。たとえば、料理人が主人の年収を千ポンドと見積もれば、年千ポンドあれば肉は十分買えるから、節約するには及ばないと、理にかなった結論を出せる。執事も同じように判断し、馬丁や御者もそうすればよい。こうすれば、主人の名誉にふさわしく、どの支出部門も十分に満たされることになる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-005"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are chid before company (which with submission to our masters and ladies, is an unmannerly practice) it often happens that some stranger will have the good nature to drop a word in your excuse; in such a case you will have a good title to justify yourself, and may rightly conclude, that whenever he chides you afterward on other occasions, he may be in the wrong; in which opinion you will be the better confirmed, by stating the case to your fellow-servants in your own way, who will certainly decide in your favour: therefore, as I have said before, whenever you are chidden, complain as if you were injured."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[11]"
    "line_start": 550
    "source_sequence": 496
    "printed_page": "102"
  "translation_ja": "客の前で叱られたときには、よその人が親切にも、あなたをかばう言葉をひと言挟んでくれることがよくある。主人や奥さまにはお言葉を返すようだが、そもそも客の前で叱るのは無作法である。そういうときには、あなたには自分の正しさを主張する立派な資格ができる。今後、主人が別のことで叱るときも、主人のほうが間違っているかもしれないと、正当に考えてよい。その一件を、自分に都合のよい言い方で仲間の奉公人に話してやれば、この考えはいっそう確かになる。仲間は必ずあなたの味方をしてくれるからである。だから先にも言ったとおり、叱られたらいつでも、自分が不当に扱われたという顔で不平を言いなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-006"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It often happens, that servants sent on messages are apt to stay out somewhat longer than the message requires, perhaps two, four, six, or eight hours, or some such trifle; for, the temptation to be sure was great, and flesh and blood cannot always resist: when you return, the master storms, the lady scolds; stripping, cudgelling, and turning off is the word. But here you ought to be provided with a set of excuses, enough to serve on all occasions: for instance, your uncle came fourscore miles to town this morning on purpose to see you, and goes back by break of day to morrow: a brother servant, that borrowed money of you when he was out of place, was running away to Ireland: you were taking leave of an old fellow-servant, who was shipping for Barbadoes: your father sent a cow to you to sell, and you could not get a chapman till nine at night: you were taking leave of a dear cousin, who is to be hanged next Saturday: you wrenched your foot against a stone, and were forced to stay three hours in a shop, before you could stir a step: some nastiness was thrown on you out of a garret-window, and you were ashamed to come home before you were cleaned, and the smell went off: you were pressed for the sea-service, and carried before a justice of peace, who kept you three hours before he examined you, and you got off with much ado: a bailiff by mistake seized you for a debtor, and kept you the whole evening in a spunging house: you were told your master had gone to a tavern, and came to some mischance, and your grief was so great that you inquired for his honour in a hundred taverns between Pall-mall and Temple-bar."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[12]"
    "line_start": 552
    "source_sequence": 498
    "printed_page": "102"
  "translation_ja": "使いに出された奉公人が、用事に必要な時間より少しばかり、二時間、四時間、六時間、八時間といった、ほんの些細な時間だけ、長く外にいることはよくある。誘惑はたしかに大きかったのであり、血の通った人間には、いつでも逆らえるわけではない。帰ってくると、主人は怒鳴り、奥さまは小言を言い、服を剥ぐぞ、棒で打つぞ、首にするぞ、という騒ぎになる。そこで、どんな場合にも間に合うだけの言い訳を、一揃い用意しておくこと。たとえば、叔父が今朝、自分に会うためだけに八十マイルも旅をして町へ来たが、明日の夜明けには帰ってしまう。失業中に金を貸してやった仲間が、アイルランドへ逃げようとしていた。バルバドス行きの船に乗る昔の奉公仲間に、別れを告げていた。父が売るようにと牛を一頭送ってきたが、夜九時になるまで買い手が見つからなかった。来週の土曜日に絞首刑になる、大切ないとこに別れを告げていた。石につまずいて足をひねり、三時間も店で休むまで一歩も動けなかった。屋根裏の窓から汚物を浴びせられ、汚れと臭いが落ちるまで、恥ずかしくて帰れなかった。海軍へ強制徴募され、治安判事の前へ連れていかれたが、取り調べまで三時間待たされ、やっとの思いで放免された。借金取りの役人に債務者と間違えて捕まり、夕方じゅう、借金取りの留置所に入れられていた。主人が居酒屋へ出かけて災難に遭ったと聞き、あまりに心配で、ペル・メルからテンプル・バーまで百軒の居酒屋で、旦那さまの消息を尋ねて回った。こんな具合である。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-007"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Take all tradesmen's parts against your master, and when you are sent to buy any thing, never offer to cheapen it, but generously pay the full demand. This is highly to your master's honour, and may be some shillings in your pocket; and you are to consider, if your master has paid too much, he can better afford the loss than a poor tradesman."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[13]"
    "line_start": 554
    "source_sequence": 504
    "printed_page": "103"
  "translation_ja": "主人に対しては、いつでも商人たちの味方をしなさい。何かを買いに行かされたら、決して値切ろうとせず、気前よく言い値を払いなさい。これは主人の名誉を大いに高め、あなたの懐にも、何シリングか入るかもしれない。考えてもみなさい。主人が払いすぎたとしても、貧しい商人よりは、損に耐える余裕があるのだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-008"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never submit to stir a finger in any business, but that for which you were particularly hired. For example, if the groom be drunk, or absent, and the butler be ordered to shut the stable-door, the answer is ready, An' please your honour, I don't understand horses: if a corner of the hanging wants a single nail to fasten it, and the footman be directed to tack it up, he may say, he does not understand that sort of work, but his honour may send for the upholsterer."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[14]"
    "line_start": 556
    "source_sequence": 506
    "printed_page": "103"
  "translation_ja": "自分が特にそのために雇われた仕事以外は、指一本動かすことにも応じてはならない。たとえば、馬丁が酔っていたり、いなかったりして、執事が馬小屋の戸を閉めるように言われたら、返事は決まっている。「恐れ入りますが、旦那さま、私は馬のことは分かりません。」壁掛けの隅を釘一本で留める必要があり、従僕がそれを打つように言われたら、そういう仕事は存じませんので、旦那さまから室内装飾屋を呼んでいただけます、と答えればよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-009"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Masters and ladies are usually quarrelling with the servants for not shutting the doors after them: but neither masters nor ladies consider, that those doors must be open before they can be shut, and that the labour is double to open and shut the doors; therefore the best, and shortest, and easiest way is to do neither. But if you are so often teased to shut the door, that you cannot easily forget it, then give the door such a clap as you go out, as will shake the whole room, and make every thing rattle in it, to put your master and lady in mind that you observe their directions."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[15]"
    "line_start": 558
    "source_sequence": 508
    "printed_page": "103"
  "translation_ja": "主人や奥さまは、通ったあとで戸を閉めないと、しょっちゅう奉公人と喧嘩をしている。しかし、閉めるためにはその前に戸を開けねばならず、開けて閉めれば手間が二倍になるということを、主人も奥さまも考えていない。したがって最善で、最も手短で、最も楽なのは、どちらもしないことである。ただし、戸を閉めろとあまりにしつこく言われ、忘れようにも忘れられなくなったら、出ていくとき、部屋じゅうが震え、あらゆる物ががたがた鳴るほど、思いきり戸をたたきつけなさい。言いつけを守っていることを、主人夫妻に思い出させるためである。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-010"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you find yourself[1] to grow into favour with your master or lady, take some opportunity, in a very mild way, to give them warning; and when they ask the reason, and seem loth to part with you, answer, that you would rather live with them than any body else, but a poor servant is not to be blamed if he strives to better himself; that service is no inheritance; that your work is great, and your wages very small. Upon which, if your master has any generosity, he will add five or ten shillings a quarter, rather than let you go: but if you are balked, and have no mind to go off, get some fellow-servant to tell your master, that he has prevailed upon you to stay."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[16]"
    "line_start": 560
    "source_sequence": 514
    "printed_page": "104"
  "translation_ja": "主人や奥さまの気に入り始めたと気づいたら、[1] 何かの折に、とても穏やかな口調で、暇をいただきたいと申し出なさい。理由を尋ねられ、別れを惜しまれているようなら、ほかの誰よりもこちらで働きたいが、貧しい奉公人が暮らしをよくしようと努めても、責められるいわれはない、奉公は代々受け継ぐ財産ではなく、仕事は多いのに給金はとても少ない、と答えること。そうすれば、主人に少しでも気前のよさがあれば、あなたを手放すよりはと、四半期につき五シリングか十シリング、上乗せしてくれるだろう。しかし当てが外れ、しかも辞めたくないのなら、仲間の奉公人に頼んで、自分が説き伏せてあなたを引き留めたのだと、主人に話してもらいなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-011"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Whatever good bits you can pilfer in the day, save them to junket with your fellow-servants at night; and take in the butler, provided he will give you drink."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[17]"
    "line_start": 562
    "source_sequence": 521
    "printed_page": "104"
  "translation_ja": "昼間にくすねられるうまい物は、何でも取っておき、夜、仲間の奉公人とごちそうを楽しみなさい。酒を出してくれるなら、執事も仲間に入れてやること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-012"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Write your own name and your sweetheart's, with the smoke of a candle on the roof of the kitchen, or the servants hall, to show your learning."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[18]"
    "line_start": 564
    "source_sequence": 523
    "printed_page": "104"
  "translation_ja": "自分の名と恋人の名を、蝋燭の煤で、台所か奉公人部屋の天井に書き、自分の学のあるところを見せなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-013"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are a young sightly fellow, whenever you whisper your mistress at the table, run your nose full in her cheek; or if your breath be good, breathe full in her face; this I have known to have had very good consequences in some families."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[19]"
    "line_start": 565
    "source_sequence": 526
    "printed_page": "104"
  "translation_ja": "あなたが若くて見栄えのよい男なら、食卓で奥さまに耳打ちするたびに、その頬に鼻をしっかり押しつけなさい。息がさわやかなら、顔にまっすぐ息を吹きかけてもよい。いくつかの家庭で、これがたいへんよい結果を生んだのを、私は知っている。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-014"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never come till you have been called three or four times; for none but dogs will come at the first whistle: and when the master calls \"Who's there?\" no servant is bound to come; for Who's there is nobody's name."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[20]"
    "line_start": 567
    "source_sequence": 532
    "printed_page": "105"
  "translation_ja": "三、四度呼ばれるまでは来てはならない。一声の口笛で駆けつけるのは犬だけだからである。主人が「誰かいないか」と呼んでも、奉公人に行く義務はない。「誰かいないか」という名の者はいないのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-015"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you have broken all your earthen drinking vessels below stairs (which is usually done in a week) the copper pot will do as well; it can boil milk, heat porridge, hold small beer, or in case of necessity, serve for a jordan, therefore apply it indifferently to all these uses; but never wash or scour it, for fear of taking off the tin."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[21]"
    "line_start": 569
    "source_sequence": 534
    "printed_page": "105"
  "translation_ja": "階下で使う陶器の飲み物入れを全部割ってしまったら、たいてい一週間もあればそうなるが、銅の鍋で十分間に合う。牛乳を沸かせるし、粥も温められ、薄いビールも入れられる。いざというときは尿瓶にもなるから、これらの用途に区別なく使いなさい。ただし、錫のめっきがはがれるといけないので、洗ったり磨いたりしてはならない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-016"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Although you are allowed knives for the servants hall at meals, yet you ought to spare them, and make use only of your master's."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[22]"
    "line_start": 571
    "source_sequence": 536
    "printed_page": "105"
  "translation_ja": "奉公人部屋の食事に使うナイフを与えられていても、それは惜しんでおき、主人のものだけを使うこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-017"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let it be a constant rule, that no chair, stool, or table in the servants hall, or the kitchen, shall have above three legs, which has been the ancient and constant practice in all the families I ever knew, and is said to be founded upon two reasons; first to show that servants are ever in a tottering condition; secondly, it was thought a point of humility, that the servants chairs and tables should have at least one leg fewer than those of their masters. I grant there has been an exception to this rule with regard to the cook, who, by old custom, was allowed an easy chair to sleep in after dinner; and yet I have seldom seen them with above three legs. Now this epidemical lameness of servants' chairs, is by philosophers imputed to two causes, which are observed to make the greatest revolutions in states and empires; I mean love and war. A stool, a chair, or a table, is the first weapon taken up in a general romping or skirmish; and after a peace, the chairs, if they be not very strong, are apt to suffer in the conduct of an amour, the cook being usually fat and heavy, and the butler a little in drink."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[23]"
    "line_start": 573
    "source_sequence": 538
    "printed_page": "105"
  "translation_ja": "奉公人部屋や台所の椅子、腰掛け、机には、脚を四本以上つけないことを、常に守る決まりとしなさい。これは私の知るどの家庭でも、昔から絶えず行われてきたことであり、二つの理由によるとされている。第一は、奉公人がいつもぐらついた境遇にあることを示すため。第二は、奉公人の椅子や机の脚は、主人のものより少なくとも一本少ないほうが、謙虚さの表れと考えられたためである。料理人については、この決まりに例外があったことを認めよう。古くからの習慣により、食事のあとに眠るための安楽椅子が与えられていた。しかし、それでも脚が四本以上あるものは、めったに見たことがない。さて、奉公人の椅子にこうも広く足の不自由がはやるのは、国や帝国に最大の変革を起こすと認められている、二つの原因によると哲学者は考えている。すなわち、恋と戦争である。みなでふざけ合ったり小競り合いをしたりするとき、まず手に取る武器は、腰掛けか椅子か机である。そして和睦のあとにも、椅子がよほど頑丈でない限り、情事のさなかに痛めつけられがちである。料理人はたいてい太って重く、執事は少し酔っているからである。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-018"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I could never endure to see maidservants so ungenteel as to walk the streets with their petticoats pinned up; it is a foolish excuse to allege, their petticoats will be dirty, when they have so easy a remedy as to walk three or four times down a clean pair of stairs after they come home."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[24]"
    "line_start": 575
    "source_sequence": 545
    "printed_page": "106"
  "translation_ja": "女の奉公人が、ペティコートをピンでたくし上げて町を歩くような、あんな品のない姿を見るのは、私にはどうにも我慢がならなかった。裾が汚れるというのは、愚かな言い訳である。帰宅してから、きれいな階段を三、四度下りればよいという、こんな簡単な解決法があるのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-019"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you stop to tattle with some crony servant in the same street, leave your own street-door open, that you may get in without knocking when you come back; otherwise your mistress may know you are gone out, and you must be chidden."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[25]"
    "line_start": 577
    "source_sequence": 547
    "printed_page": "106"
  "translation_ja": "同じ通りの仲良しの奉公人と、立ち止まっておしゃべりをするときは、自分の家の表戸を開けておきなさい。戻るとき、たたかずに入れるようにするためである。そうしないと、奥さまに外へ出たと知られ、叱られることになる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-020"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I do most earnestly exhort you all to unanimity and concord: but mistake me not: you may quarrel with each other as much as you please, only always bear in mind, that you have a common enemy, which is your master and lady, and you have a common cause to defend. Believe an old practitioner; whoever out of malice to a fellow-servant carries a tale to his master, shall be ruined by a general confederacy against him."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[26]"
    "line_start": 579
    "source_sequence": 549
    "printed_page": "106"
  "translation_ja": "私は皆さんに、心を一つにし、仲よくするよう、心から強く勧めたい。ただし、取り違えてはいけない。互いの喧嘩は、好きなだけしてもかまわない。ただ、皆さんには主人と奥さまという共通の敵がいて、守るべき共通の大義があることだけは、いつも心に留めておきなさい。この道の古参を信じることだ。仲間の奉公人への悪意から主人に告げ口をする者は、ほかの者がみなで結託して破滅させるだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-021"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The general place of rendezvous for all the servants both in winter and summer, is the kitchen; there the grand affairs of the family ought to be consulted whether they concern the stable, the dairy, the pantry, the laundry, the cellar, the nursery, the dining-room, or my lady's chamber; there, as in own proper element, you can laugh, and squall, and romp, in full security."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[27]"
    "line_start": 581
    "source_sequence": 551
    "printed_page": "106"
  "translation_ja": "冬でも夏でも、すべての奉公人が集まる場所は台所である。馬小屋、乳製品の作業場、食器室、洗濯場、酒蔵、子供部屋、食堂、奥さまの寝室、どこに関することであれ、家の重大事はそこで相談するべきである。そこなら自分にふさわしい居場所にいるのだから、安心しきって、笑い、わめき、ふざけ合うことができる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-022"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When any servant comes home drunk, and cannot appear, you must all join in telling your master, that he is gone to bed very sick; upon which your lady will be so good natured, as to order some comfortable thing for the poor man or maid."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[28]"
    "line_start": 583
    "source_sequence": 557
    "printed_page": "107"
  "translation_ja": "奉公人の誰かが酔って帰り、人前に出られなくなったら、みなで口を揃え、ひどく具合が悪くて寝込んでいると主人に言いなさい。そうすれば、親切な奥さまは、気の毒な男や女のために、何か滋養のあるものを用意するよう命じてくださるだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-023"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your master and lady go abroad together, to dinner, or on a visit for the evening, you need leave only one servant in the house, unless you have a blackguard boy to answer at the door, and attend the children if there be any. Who is to stay at home is to be determined by short and long cuts, and the stayer at home may be comforted by a visit from a sweetheart, without danger of being caught together. These opportunities must never be missed, because they come but sometimes; and all is safe enough while there is a servant in the house."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[29]"
    "line_start": 585
    "source_sequence": 559
    "printed_page": "107"
  "translation_ja": "主人と奥さまが連れ立って、食事や晩の訪問に出かけたら、家には奉公人を一人だけ残せばよい。玄関の応対をし、子供がいればその世話もする下働きの小僧がいるなら、それさえ必要ない。誰が留守番をするかは、長短の籤を引いて決めること。残った者は、恋人に訪ねてもらって慰められればよい。二人でいるところを見つけられる危険はない。こういう機会は、時々しかないのだから、決して逃してはならない。家に奉公人が一人いれば、何もかも十分に安心なのである。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-024"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your master or lady comes home, and wants a servant who happens to be abroad, your answer must be, that he had but just that minute stept out, being sent for by a cousin who was dying."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[30]"
    "line_start": 587
    "source_sequence": 561
    "printed_page": "107"
  "translation_ja": "主人や奥さまが帰宅し、たまたま外へ出ている奉公人を呼んだら、死にかけのいとこから呼ばれ、つい今しがた出たばかりです、と答えること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-025"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your master calls you by name, and you happen to answer at the fourth call, you need not hurry yourself; and if you be chidden for staying, you may lawfully say, you came no sooner, because you did not know what you were called for."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[31]"
    "line_start": 589
    "source_sequence": 563
    "printed_page": "107"
  "translation_ja": "主人が名を呼び、たまたま四度目で返事をしたとしても、急ぐ必要はない。遅いと叱られたら、何のために呼ばれたのか分からなかったので、もっと早くは来られませんでした、と堂々と言ってよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-026"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are chidden for a fault, as you go out of the room, and down stairs, mutter loud enough to be plainly heard; this will make him believe you are innocent."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[32]"
    "line_start": 591
    "source_sequence": 565
    "printed_page": "107"
  "translation_ja": "へまをして叱られたときは、部屋を出て階段を下りながら、はっきり聞こえるほど大きな声で、ぶつぶつ言いなさい。そうすれば、主人はあなたが無実だと信じるだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-027"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Whoever comes to visit your master or lady when they are abroad, never burden your memory with the person's name, for indeed you have too many other things to remember. Besides, it is a porter's busines, and your master's fault he does not keep one; and who can remember names? and you will certainly mistake them, and you can neither write nor read."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[33]"
    "line_start": 593
    "source_sequence": 567
    "printed_page": "107"
  "translation_ja": "主人や奥さまの留守に誰が訪ねてきても、その名を覚えて記憶に重荷をかけてはならない。実際、ほかに覚えることが多すぎるのである。それに、それは門番の仕事であり、門番を雇わないのは主人の落ち度である。そもそも名前など誰が覚えていられるだろう。どうせ取り違えるに決まっているし、あなたは読み書きもできないのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-028"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If it be possible, never tell a lie to your master or lady, unless you have some hopes that they cannot find it out in less than half an hour. When a servant is turned off, all his faults must be told, although most of them were never known by his master or lady; and all mischiefs done by others, charged to him. And when they ask any of you, why you never acquainted them before? the answer is, \"Sir, or Madam, really I was afraid it would make you angry; and besides, perhaps you might think it was malice in me.\" Where there are little masters and misses in a house, they are usually great impediments to the diversions of the servants; the only remedy is to bribe them with goody goodies, that they may not tell tales to papa and mamma."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[34]"
    "line_start": 595
    "source_sequence": 575
    "printed_page": "108"
  "translation_ja": "できることなら、主人や奥さまに嘘をついてはならない。ただし、少なくとも三十分は見破られずに済む見込みがある場合は別である。奉公人が首になったら、その者の落ち度を全部話すこと。主人や奥さまが知らなかったことが大半でもかまわない。ほかの者がした悪さも、すべてその者のせいにしなさい。どうして今まで知らせなかったのかと聞かれたら、こう答えること。「旦那さま、奥さま、まことに、お怒りになるのではないかと恐れておりました。それに、私の悪意からだとお考えになるかもしれませんので。」家に小さな坊ちゃんやお嬢ちゃんがいると、たいてい奉公人の楽しみの大きな邪魔になる。唯一の手立ては、お菓子で買収し、パパやママに告げ口をさせないことである。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-029"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I advise you of the servants, whose master lives in the country, and who expect vales, always to stand rank and file when a stranger is taking his leave; so that he must of necessity pass between you; and he must have more confidence, or less money than usual, if any of you let him escape; and according as he behaves himself, remember to treat him the next time he comes."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[35]"
    "line_start": 597
    "source_sequence": 578
    "printed_page": "108"
  "translation_ja": "田舎に住む主人に仕え、心付けを当てにしている皆さんに忠告したい。客が帰るときには、いつでも縦横に列を組んで立ち、必ずその間を通るようにすること。誰か一人でも客を逃してしまうようなら、その客は普通以上に図太いか、普通以上に金がないに違いない。どんな振る舞いをしたかを覚えておき、次に来たときは、それにふさわしく扱いなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-030"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are sent with ready money to buy any thing at a shop, and happen at that time to be out of pocket, sink the money, and take up the goods on your master's account. This is for the honour of your master and yourself; for he becomes a man of credit at your recommendation."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[36]"
    "line_start": 599
    "source_sequence": 580
    "printed_page": "108"
  "translation_ja": "何かを店で買うために現金を持たされ、折よくそのとき自分の懐が寒かったら、その金は懐に入れ、品物は主人のつけで買うこと。これは主人の名誉にも、あなたの名誉にもなる。あなたの口利きによって、主人は信用のある人になるのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-031"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your lady sends for you up to her chamber to give you any orders, be sure to stand at the door, and keep it open, fiddling with the lock all the while she is talking to you, and keep the button in your hand, for fear you should forget to shut the door after you."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[37]"
    "line_start": 600
    "source_sequence": 583
    "printed_page": "108"
  "translation_ja": "奥さまが何かを言いつけようと、上の居間へあなたを呼んだら、必ず戸口に立ち、戸を開けたままにしなさい。話しかけられている間じゅう錠をいじり、戸のつまみを手に持っていること。出るときに戸を閉め忘れないためである。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-032"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your master or lady happen once in their lives to accuse you wrongfully, you are a happy servant; for you have nothing more to do, than for every fault you commit while you are in their service, to put them in mind of that false accusation, and protest yourself equally innocent in the present case."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[38]"
    "line_start": 602
    "source_sequence": 589
    "printed_page": "109"
  "translation_ja": "主人や奥さまが、一生に一度でも間違ってあなたを責めたなら、あなたは幸せな奉公人である。あとは、その家に仕える間にどんなへまをしても、あの間違った非難を思い出させ、今度の件も同じく無実だと言い張りさえすればよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-033"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you have a mind to leave your master, and are too bashful to break the matter for fear of offending him, the best way is to grow rude and saucy of a sudden, and beyond your usual behaviour, till he finds it necessary to turn you off; and when you are gone, to revenge yourself, give him and his lady such a character to all your brother-servants who are out of place, that none will venture to offer their service."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[39]"
    "line_start": 604
    "source_sequence": 591
    "printed_page": "109"
  "translation_ja": "主人のところを辞めたくなったが、気を悪くさせるのが怖く、気が引けて切り出せないときには、急に、普段よりずっと無礼で生意気になり、首にするしかないと主人が思うまで続けるのが最善である。辞めたあとは仕返しに、職にあぶれている奉公仲間にみな、主人と奥さまのひどい評判を吹き込み、誰も雇ってもらおうとはしないようにすること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-034"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Some nice ladies who are afraid of catching cold, having observed that the maids and fellows below stairs often forget to shut the door after them, as they come in, or go out into the back yards, have contrived that a pulley and a rope, with a large piece of lead at the end, should be so fixed, as to make the door shut of itself, and require a strong hand to open it; which is an immense toil to servants, whose business may force them to go in and out fifty times in a morning: but ingenuity can do much, for prudent servants have found out an effectual remedy against this insupportable grievance, by tying up the pulley in such a manner, that the weight of the lead shall have no effect; however, as to my own part, I would rather choose to keep the door always open, by laying a heavy stone at the bottom of it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[40]"
    "line_start": 606
    "source_sequence": 593
    "printed_page": "109"
  "translation_ja": "風邪をひくのを怖がる気難しい奥さまの中には、階下の女中や男たちが裏庭へ出入りするたび、戸を閉め忘れることが多いのに気づき、端に大きな鉛のおもりをつけた綱と滑車を取り付けて、戸がひとりでに閉まり、力を入れなければ開かなくなるよう工夫した人がいる。仕事のため午前中だけで五十回も出入りしなければならない奉公人には、莫大な苦労である。しかし、知恵を働かせれば、できることは多い。抜け目のない奉公人は、この我慢のならない苦情の種に対し、鉛のおもりが働かないように滑車を縛りつけるという、よく効く対策を見つけた。ただ、私自身なら、戸の下に重い石を置いて、いつも開け放しにしておくほうを選ぶだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-035"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The servants candlesticks are generally broken, for nothing can last for ever. But you may find out many expedients; you may conveniently stick your candle in a bottle, or with a lump of butter against the wainscot, in a powderhorn, or in an old shoe, or in a cleft stick, or in the barrel of a pistol, or upon its own grease on a table, in a coffeecup, or a drinking-glass, a horn can, a teapot, a twisted napkin, a mustardpot, an inkhorn, a marrowbone, a piece of dough, or you may cut a hole in the loaf, and stick it there."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[41]"
    "line_start": 608
    "source_sequence": 599
    "printed_page": "110"
  "translation_ja": "奉公人の燭台は、たいてい壊れている。何事も、永遠には持たないからである。しかし工夫の仕方はいくらでもある。蝋燭は、瓶に挿せば具合がよい。バターの塊で羽目板にくっつけてもよいし、角製の火薬入れ、古靴、割れ目を入れた棒、拳銃の銃身に挿してもよい。溶けた自分の蝋で机に立てたり、コーヒーカップ、コップ、角製の飲み器、茶のポット、ねじったナプキン、からし壺、インク壺、髄のある骨、パン生地の塊に立てたりしてもよい。パンの塊に穴を切り開け、そこへ挿すこともできる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-036"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you invite the neighbouring servants to junket with you at home in an evening, teach them a peculiar way of tapping or scraping at the kitchenwindow, which you may hear, but not your master or lady; whom you must take care not to disturb or frighten at such unseasonable hours."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[42]"
    "line_start": 610
    "source_sequence": 601
    "printed_page": "110"
  "translation_ja": "晩に近所の奉公人を家へ招き、ごちそうを楽しむときは、台所の窓をたたくか、こするかする、特別な合図を教えておきなさい。自分には聞こえても、主人や奥さまには聞こえないようにすること。こんな不適当な時刻に、お二人を煩わせたり、驚かせたりしないよう、気をつけねばならない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-037"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lay all faults upon a lapdog, or favourite cat, a monkey, a parrot, a child; or on the servant who was last turned off: by this rule you will excuse yourself, do no hurt to any body else, and save your master or lady from the trouble and vexation of chiding."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[43]"
    "line_start": 612
    "source_sequence": 603
    "printed_page": "110"
  "translation_ja": "あらゆる落ち度は、愛玩犬、お気に入りの猫、猿、鸚鵡、子供、あるいは最後に首になった奉公人のせいにしなさい。この決まりに従えば、自分は言い逃れができ、ほかの誰も傷つけず、主人や奥さまも、叱る手間やいらだちから救われる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-038"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you want proper instruments for any work you are about, use all expedients you can invent, rather than leave your work undone. For instance, if the poker be out of the way, or broken, stir the fire with the tongs; if the tongs be not at hand, use the muzzle of the bellows, the wrong end of the fireshovel, the handle of the firebrush, the end of a mop, or your master's cane. If you want paper to singe a fowl, tear the first book you see about the house. Wipe your shoes, for want of a clout, with, the bottom of a curtain, or a damask napkin. Strip your livery lace for garters. If the butler wants a jordan, he may use the great silver cup."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[44]"
    "line_start": 614
    "source_sequence": 605
    "printed_page": "110"
  "translation_ja": "取りかかった仕事に必要な道具がないときは、仕事をやり残すくらいなら、思いつくあらゆる工夫を使いなさい。たとえば、火かき棒が見つからないか、折れていたら、火ばさみで火をかくこと。火ばさみが手元になければ、ふいごの口、灰すくいの逆側、暖炉のブラシの柄、モップの先、主人の杖を使えばよい。鶏の残り毛を焼く紙がなければ、家の中で最初に見かけた本を破りなさい。靴を拭く布がなければ、カーテンの裾か、ダマスク織のナプキンで拭くこと。靴下留めには、仕着せの飾り紐を剥ぎ取ればよい。執事が尿瓶を欲しいなら、大きな銀の杯を使ってもかまわない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-039"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There are several ways of putting out candles, and you ought to be instructed in them all: you may run the candle end against the wainscot, which puts the snuff out immediately: you may lay it on the ground, and tread the snuff out with your foot: you may hold it upside down, until it is choked with its own grease, or cram it into the socket of the candlestick: you may whirl it round in your hand till it goes out: when you go to bed, after you have made water, you may dip the candle end into the chamberpot: you may spit on your finger and thumb, and pinch the snuff till it goes out. The cook may run the candle's nose into the mealtub, or the groom into a vessel of oats, or a lock of hay, or a heap of litter: the housemaid may put out her candle by running it against the looking-glass, which nothing cleans so well as candle-snuff: but the quickest and best of all methods is, to blow it out with your breath, which leaves the candle clear, and readier to be lighted."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[45]"
    "line_start": 616
    "source_sequence": 611
    "printed_page": "111"
  "translation_ja": "蝋燭を消す方法はいくつもあり、皆さんはすべてを教わっておくべきである。蝋燭の先を羽目板に押しつければ、芯はたちまち消える。床に置き、足で芯を踏み消してもよい。逆さに持ち、溶けた自分の蝋で火が窒息するまで待ってもよいし、燭台の受け口へ押し込んでもよい。手に持って振り回し、消してもよい。寝るときは、小便をしたあと、蝋燭の先をおまるへ浸してもよい。親指と人さし指につばをつけ、芯をつまんで消してもよい。料理人なら粉桶へ、馬丁なら燕麦の容器や、ひとつかみの干し草、敷藁の山へ、蝋燭の鼻先を突っ込めばよい。女中なら鏡に押しつけて消せる。蝋燭の芯ほど鏡をきれいにするものはないからである。しかし、あらゆる方法のうち最も速く、最もよいのは、息を吹きかけて消すことである。蝋燭を汚さずに済み、次に火をつけるにも具合がよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-general-040"
  "section_id": "general"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is nothing so pernicious in a family as a telltale; against whom it must be the principal business of you all to unite: whatever office he serves in, take all opportunities to spoil the business he is about, and to cross him in every thing. For instance, if the butler be a telltale, break his glasses whenever he leaves the pantry-door open; or lock the cat or the mastiff in it, who will do as well: mislay a fork or spoon so as he may never find it. If it be the cook, whenever she turns her back, throw a lump of soot, or a handful of salt, in the pot, or smoking coals into the drippingpan, or daub the roast meat with the back of the chimney, or hide the key of the jack. If a footman be suspected, let the cook daub the back of his new livery; or when he is going up with a dish of soup, let her follow him softly with a ladle full, and dribble it all the way up stairs to the dining-room, and then let the housemaid make such a noise, that her lady may hear it. The waiting maid is very likely to be guilty of this fault, in hopes to ingratiate herself: in this case the laundress must be sure to tear her smocks in the washing, and yet wash them but half; and when she complains, tell all the house that she sweats so much, and her flesh is so nasty, that she fouls a smock more in one hour, than the kitchenmaid does in a week."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[46]"
    "line_start": 618
    "source_sequence": 614
    "printed_page": "111"
  "translation_ja": "家に告げ口屋ほど有害なものはない。皆さんが力を合わせ、その者に立ち向かうことこそ、いちばんの仕事にしなければならない。その者の役目が何であれ、機会あるごとに仕事を台なしにし、何をするにも邪魔しなさい。たとえば、執事が告げ口屋なら、食器室の戸を開けておくたびに、グラスを割ること。猫かマスティフ犬を中へ閉じ込めても、同じ働きをしてくれる。フォークか匙を、二度と見つからない所へ置きなさい。料理人なら、後ろを向くたびに、煤の塊か塩をひとつかみ鍋へ放り込み、脂受け皿へ煙を上げる石炭を入れ、焼き肉に煙突の内壁の煤を塗りつけ、あるいは焼串の回転装置の鍵を隠すこと。従僕が疑わしければ、料理人に新しい仕着せの背中を汚させなさい。また、スープの皿を持って上へ行くとき、料理人がお玉いっぱいのスープを持ってそっと後を追い、階段から食堂まで、ずっと滴らせていくのもよい。それから女中に、奥さまに聞こえるほど大騒ぎをさせること。この悪癖に陥りやすいのは侍女である。気に入られたいと望んでいるからだ。そんなときは、洗濯女が必ず、洗うときに侍女の肌着を裂き、しかも半分しか洗わないようにすること。文句を言ってきたら、あの女は汗っかきで、体があまりに汚らしいので、台所女中が一週間かけるよりひどく、一時間で肌着を汚すのだと、家じゅうに話してやりなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

- "id": "dts-c13-001"
  "section_id": "chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "IF you happen to let the child fall, and lame it, be sure never confess it; and if it dies, all is safe."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[298]"
    "line_start": 1172
    "source_sequence": 1631
    "printed_page": "172"
  "translation_ja": "うっかり子供を落として、脚を不自由にしてしまっても、決して白状しないこと。その子が死ねば、すべて安心だ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c13-002"
  "section_id": "chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Contrive to be with child as soon as you can, while you are giving suck, that you may be ready for another service, when the child you nurse dies, or is weaned."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[299]"
    "line_start": 1174
    "source_sequence": 1635
    "printed_page": "172"
  "translation_ja": "乳を飲ませている間に、できるだけ早く妊娠するよう工夫しなさい。乳をやっている子が死ぬか、乳離れしたら、次の奉公に備えられるようにするためだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

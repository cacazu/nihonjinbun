    "line_start": 951
    "source_sequence": 1178
    "printed_page": "149"
  "translation_ja": |-
    第四章
    御者心得。
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c04-001"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "YOU are strictly bound to nothing, but to step into the box, and carry your master or lady."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[209]"
    "line_start": 954
    "source_sequence": 1183
    "printed_page": "149"
  "translation_ja": "あなたが厳密に義務づけられているのは、御者台に上がり、主人か奥さまをお運びすることだけである。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c04-002"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let your horses be so well trained, that when you attend your lady at a visit, they will wait until you slip into a neighbouring alehouse to take a pot with a friend."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[210]"
    "line_start": 956
    "source_sequence": 1187
    "printed_page": "149"
  "translation_ja": "馬はよく仕込んでおき、奥さまの訪問に付き添っているとき、近所の居酒屋へそっと入り、友人と一杯やってくる間くらいは、待っているようにしなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c04-003"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are in no humour to drive, tell your master that the horses have got a cold, that they want shoeing, that rain does them hurt, and roughens their coat, and rots the harness. This may likewise be applied to the groom."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[211]"
    "line_start": 958
    "source_sequence": 1189
    "printed_page": "149"
  "translation_ja": "馬車を出す気分でないときは、馬が風邪をひいた、蹄鉄を打ち直す必要がある、雨は馬に悪く、毛並みを荒らし、馬具を腐らせると、主人に言いなさい。これは馬丁にも応用できる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c04-004"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your master dines with a country friend, drink as much as you can get; because it is allowed, that a good coachman never drives so well as when he is drunk; and then show your skill by driving to an inch by a precipice; and say, you never drive so well as when drunk."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[212]"
    "line_start": 960
    "source_sequence": 1191
    "printed_page": "149"
  "translation_ja": "主人が田舎の友人と食事をするときは、飲めるだけ飲みなさい。よい御者がいちばんうまく馬車を操るのは、酔っているときだと、認められているからだ。それから、崖の縁すれすれ一インチのところを走らせ、腕前を見せなさい。そして、酔ったときほど、うまく操れることはありません、と言うこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c04-005"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you find any gentleman fond of one of your horses, and willing to give you a consideration beside the price; persuade your master to sell him, because he is so vicious that you cannot undertake to drive with him, and is foundered into the bargain."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[213]"
    "line_start": 962
    "source_sequence": 1193
    "printed_page": "149"
  "translation_ja": "主人の馬の一頭を気に入り、代金とは別にあなたへ謝礼を払おうという紳士を見つけたら、主人を説得して売らせなさい。あまりに性質が悪く、その馬を使っては責任を持って馬車を出せないし、そのうえ脚も悪い、と言えばよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c04-006"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Get a black-guard boy to watch your coach at the church door on Sundays, that you and your brother coachmen may be merry together at the alehouse, while your master and lady are at church."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[214]"
    "line_start": 964
    "source_sequence": 1195
    "printed_page": "149"
  "translation_ja": "日曜日は、教会の戸口で馬車を見張る使い走りの小僧を雇いなさい。そうすれば、主人と奥さまが教会にいる間、あなたも仲間の御者たちも、居酒屋で楽しく過ごせる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c04-007"
  "section_id": "chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Take care that your wheels be good; and get a new set bought as often as you can, whether you are allowed the old as your perquisite or not: in one case it will turn to your honest profit; and in tho other, it will be a just punishment on your master's covetousness; and, probably, the coachmaker will consider you too."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[215]"
    "line_start": 965
    "source_sequence": 1198
    "printed_page": "149"
  "translation_ja": "車輪がよい状態にあるように気をつけ、古いものを役得としてもらえるかどうかにかかわらず、できるだけたびたび、一揃い新しく買わせなさい。もらえれば正直な利益になるし、もらえなければ主人のけちへの正当な罰になる。おそらく馬車屋も、あなたにはそれなりの礼をするだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-heading"
  "section_id": "chapter-05"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    CHAP. V.
    Directions to the Groom.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/div[27]/p"
    "line_start": 970
    "source_sequence": 1215
    "printed_page": "150"
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/div[28]/p"
    "line_start": 972
    "source_sequence": 1219
    "printed_page": "150"
  "translation_ja": |-
    第五章
    馬丁心得。
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-001"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "YOU are the servant, upon whom the care of your master's honour in all journeys entirely depends; your breast is the sole repository of it. If he travels the country, and lodges at inns, every dram of brandy, every pot of ale extraordinary that you drink, raises his character; and therefore his reputation ought to be dear to you; and I hope you will not stint yourself in either. The smith, the saddler's journeyman, the cook at the inn, the ostler, and the bootcatcher, ought all by your means to partake of your master's generosity: thus his fame will reach from one county to another; and what is a gallon of ale, or a pint of brandy, in his worship's pocket? and although he should be in the number of those, who value their credit less than their purse, yet your care of the former ought to be so much the greater. His horse wanted two removes: your horse wanted nails; his allowance of oats and beans was greater than the journey required; a third part may be retrenched, and turned into ale or brandy; and thus his honour may be preserved by your discretion, and less expense to him; or, if he travels with no other servant, the matter is easily made up in the bill between you and the tapster."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[217]"
    "line_start": 975
    "source_sequence": 1224
    "printed_page": "150"
  "translation_ja": "旅という旅で主人の名誉を守ることは、まったくあなた一人にかかっている。その名誉を預かる唯一の蔵は、あなたの胸なのだ。主人が地方を旅して宿屋に泊まるなら、あなたが余分に飲むブランデーの一杯、エールの一杯ごとに、その評判は高まる。だから、主人の評判を大切にするべきだし、どちらの酒も遠慮なく飲んでほしい。鍛冶屋、馬具屋の職人、宿の料理人、馬丁、長靴脱がせの小僧、皆があなたのおかげで主人の気前よさにあずかるべきだ。そうすれば、主人の名声は一つの州から別の州へ届く。エール一ガロンやブランデー一パイントなど、旦那さまの懐には何ほどのものでもないではないか。主人が、評判より財布を大切にする人々の一人であっても、あなたはそれだけいっそう、評判のほうに気を配るべきだ。主人の馬には蹄鉄の付け直しが二度必要だった、あなたの馬には釘が要った、とすればよい。馬に割り当てられた燕麦と豆が、その旅に必要な量より多ければ、三分の一を削って、エールかブランデーに換えられる。こうすれば、あなたの分別によって、主人の出費を減らしつつ、その名誉も守れる。あるいは、ほかに奉公人を連れていない旅なら、酒場の給仕とあなたとの間で、勘定書きは簡単に調整できる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-002"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Therefore as soon as you alight at the inn, deliver your horses to the stableboy, and let him gallop them to the next pond, then call for a pot of ale, for it is very fit that a christian should drink before a beast. Leave your master to the care of the servants in the inn, and your horses to those in the stable: thus both he and they are left in the properest hands; but you are to provide for yourself; therefore get your supper, drink freely, and go to bed without troubling your master, who is in better hands than yours. The ostler is an honest fellow, and loves horses in his heart; and would not wrong the dumb creatures for the world. Be tender of your master, and order the servants not to wake him too early. Get your breakfast before he is up, that he may not wait for you; make the ostler tell him the roads are very good, and the miles short; but advise him to stay a little longer till the weather clears up, for you are afraid there will be rain, and he will be time enough after dinner."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[218]"
    "line_start": 977
    "source_sequence": 1236
    "printed_page": "151"
  "translation_ja": "だから、宿屋で馬を降りたら、すぐに馬を厩の小僧へ渡し、近くの池まで駆けさせておき、そのあとエールを一杯頼みなさい。キリスト教徒が獣より先に飲むのは、きわめてふさわしいことだからだ。主人の世話は宿の奉公人に、馬の世話は厩の者に任せなさい。そうすれば、主人も馬も、いちばん適した人々の手に委ねられる。だが、自分の世話は自分でするのだから、夕食を取り、たっぷり飲み、あなたよりよい世話を受けている主人を煩わせず、寝床へ入りなさい。宿の馬丁は正直な男で、心から馬が好きなので、何があっても口の利けない生き物をひどく扱ったりはしない。主人をいたわり、あまり早く起こさないよう、宿の奉公人に命じること。主人を待たせないよう、起きてくる前に朝食を済ませなさい。宿の馬丁には、道はとてもよく、一マイル一マイルも短く感じられると主人に言わせなさい。ただし、あなたは主人に、雨になりそうで心配だから、天気が晴れるまでもう少し待ち、昼食後に出ても十分間に合うと勧めなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-003"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let your master mount before you, out of good manners. As he is leaving the inn drop a good word in favour of the ostler, what care he took of the cattle; and add, that you never saw civiller servants. Let your master ride on before, and do you stay until your landlord has given you a dram; then gallop after him through the town or village with full speed, for fear he should want you, and to show your horsemanship."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[219]"
    "line_start": 979
    "source_sequence": 1238
    "printed_page": "151"
  "translation_ja": "礼儀をわきまえ、主人を自分より先に馬に乗せなさい。主人が宿を出ていくとき、宿の馬丁がどれほどよく馬の世話をしたか、褒め言葉を一つ添え、あんなに礼儀正しい奉公人たちは見たことがないと付け加えること。主人を先へ進ませ、自分は宿の亭主に一杯振る舞ってもらうまで残りなさい。それから、主人があなたを必要とするかもしれないので、また馬術の腕を見せるため、町や村を全速力で駆け抜けて、追いかけること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-004"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are a piece of a farrier, as every good groom ought to be, get sack, brandy, or strong beer, to rub your horses heels every night, and be not sparing, for (if any be spent) what is left, you know how to dispose of it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[220]"
    "line_start": 980
    "source_sequence": 1241
    "printed_page": "151"
  "translation_ja": "立派な馬丁なら皆そうあるべきだが、いくらか馬医の心得があるなら、サック酒か、ブランデーか、強いビールを手に入れ、毎晩、馬の踵をこすってやりなさい。けちけち使ってはいけない。多少は使ったとしても、残りをどう処分するかは分かっているだろうから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-005"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Consider your master's, health, and rather than let him take long journeys, say the cattle are weak, and fallen in their flesh with hard riding: tell him of a very good inn five miles nearer than he intended to go; or leave one of his horse's fore shoes loose in the morning; or contrive that the saddle may pinch the beast in his withers; or keep him without corn all night and morning, so that he may tire on the road; or wedge a thin plate of iron between the hoof and the shoe to make him halt; and all this in perfect tenderness to your master."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[221]"
    "line_start": 982
    "source_sequence": 1248
    "printed_page": "152"
  "translation_ja": "主人の健康を考え、長旅をさせるくらいなら、馬が弱り、乗りすぎで痩せたと告げなさい。予定している行き先より五マイル手前に、とてもよい宿屋があると教えること。あるいは、朝、主人の馬の前脚の蹄鉄を片方、緩めたままにしておく、鞍が馬の肩口を締めつけるよう細工する、夜も朝も穀物を与えず、道中で疲れるようにする、蹄と蹄鉄の間へ薄い鉄板を差し込み、脚を引きずらせる。すべては、まったく主人をいたわる心からだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-006"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are going to be hired, and the gentleman asks you, Whether you are apt to be drunk; own freely that you love a cup of good ale; but that it is your way, drunk or sober, never to neglect your horses."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[222]"
    "line_start": 984
    "source_sequence": 1250
    "printed_page": "152"
  "translation_ja": "雇われようというとき、先方の紳士に、よく酔っ払うほうかと聞かれたら、うまいエールを一杯やるのは好きだと、率直に認めなさい。ただし、酔っていてもしらふでも、決して馬の世話は怠らないのが自分のやり方です、と言うこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-007"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your master has a mind to ride out for the air, or for pleasure, if any private business of your own makes it inconvenient for you to attend him; give him to understand, that the horses want bleeding or purging; that his own pad has got a surfeit; or that the saddle wants stuffing, and his bridle is gone to be mended: this you may honestly do, because it will be no injury to the horses or your master; and at the same time shows the great care you have of the poor dumb creatures."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[223]"
    "line_start": 986
    "source_sequence": 1252
    "printed_page": "152"
  "translation_ja": "主人が気晴らしか楽しみのために乗馬に出たがり、何か自分の用事があって、お供するのが都合の悪いときは、馬に瀉血か下剤が必要だ、主人の乗用馬が食べすぎで具合を悪くした、鞍の詰め物を直さなければならない、手綱は修繕に出している、と分かってもらいなさい。これは正直にやってよい。馬にも主人にも害がないばかりか、哀れな、口の利けない生き物を、どれほど大切にしているかも示せるからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-008"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If there be a particular inn in the town whither you are going, and where you are well acquainted with the ostler or tapster, and the people of the house; find fault with the other inns, and recommend your master thither; it may probably be a pot and a dram or two more in your way, and to your master's honour."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[224]"
    "line_start": 988
    "source_sequence": 1254
    "printed_page": "152"
  "translation_ja": "これから行く町に、馬丁や酒場の給仕や宿の者たちと、よく知り合っている宿屋があれば、ほかの宿の悪口を言って、主人にそこを勧めなさい。おそらくエールをもう一杯、ブランデーも一、二杯は余計に転がり込み、主人の名誉にもなるだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-009"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your master sends you to buy hay, deal with those who will be the most liberal to you; for, service being no inheritance, you ought not to let slip any lawful and customary perquisite. If your master buys it himself, he wrongs you, and to teach him his duty, be sure to find fault with the hay as long as it lasts; and if the horses thrive with it, the fault is yours."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[225]"
    "line_start": 990
    "source_sequence": 1262
    "printed_page": "153"
  "translation_ja": "主人から干し草を買いにやられたら、あなたにいちばん気前よくする相手と取引しなさい。奉公は世襲の財産ではないのだから、合法的で慣習にかなった役得は、一つも逃すべきではない。主人が自分で買うなら、それはあなたへの不当な仕打ちだ。そこで、主人に義務を教えるため、その干し草がある間は、必ず文句を言い続けなさい。それを食べて馬がよく育つなら、あなたの落ち度である。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-010"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Hay and oats, in the management of a skilful groom, will make excellent ale, as well as brandy; but this I only hint."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[226]"
    "line_start": 992
    "source_sequence": 1264
    "printed_page": "153"
  "translation_ja": "熟練した馬丁の手にかかれば、干し草や燕麦は、上等のエールにもブランデーにもなる。ただし、これはほのめかすだけにしておこう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-011"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your master dines, or lies at a gentleman's house in the country, although there be no groom, or he be gone abroad, or that the horses have been quite neglected, be sure employ some of the servants to hold the horse when your master mounts. This I would have you do, when your master only alights to call in for a few minutes: for brother servants must always befriend one another, and that also concerns your master's honour; because he cannot do less than give a piece of money to him who holds his horse."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[227]"
    "line_start": 994
    "source_sequence": 1266
    "printed_page": "153"
  "translation_ja": "主人が田舎の紳士の家で食事をしたり泊まったりするときは、馬丁がいなくても、外へ出ていても、馬がまるでほったらかしにされていても、主人が馬に乗る際、必ずそこの奉公人の誰かに馬を押さえさせなさい。ほんの数分立ち寄るために馬を降りただけのときにも、そうしてほしい。同じ奉公人どうし、いつでも助け合うべきだし、それはまた主人の名誉にもかかわるからだ。馬を押さえてくれた者には、主人もいくらか渡さずにはいられない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-012"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In long journeys, ask your master leave to give ale to the horses; carry two quarts full to the stable, pour half a pint into a bowl; and if they will not drink it, you and the ostler must do the best you can; perhaps they may be in a better humour at the next inn; for I would have you never fail to make the experiment."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[228]"
    "line_start": 996
    "source_sequence": 1268
    "printed_page": "153"
  "translation_ja": "長旅では、馬にエールを飲ませてよいか、主人に許可を求めなさい。たっぷり二クォートを厩へ運び、半パイントを鉢へ注ぐこと。馬が飲まなければ、あなたと宿の馬丁とで、できるだけうまく片づけるほかない。次の宿では、馬の機嫌もよくなっているかもしれない。この実験は、決して怠らないでほしいからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-013"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you go to air your horses in the park, or the fields, give them to a horseboy, or one of the black-guards, who being lighter than you, may be trusted to run races with less damage to the horses, and teach them to leap over hedges and ditches, while you are drinking a friendly pot with your brother grooms: but sometimes you and they may run races yourselves, for the honour of your horses, and of your masters."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[229]"
    "line_start": 997
    "source_sequence": 1271
    "printed_page": "153"
  "translation_ja": "馬を運動させに公園や野原へ行くときは、馬の世話をする小僧か、使い走りの一人に預けなさい。あなたより軽いので、競走をさせても馬を傷めることが少なく、生け垣や溝を跳び越えることも教えられる。その間、あなたは仲間の馬丁と、親しみ深く一杯やればよい。ただし、ときには馬と主人たちの名誉のために、あなたも仲間も、自分で競走をしてよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-014"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never stint your horses at home in hay and oats, but fill the rack to the top, and the manger to the brim, for you would take it ill to be stinted yourself; although perhaps they may not have the stomach to eat; consider, they have no tongues to ask. If the hay be thrown down, there is no loss, for it will make litter and save straw."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[230]"
    "line_start": 999
    "source_sequence": 1277
    "printed_page": "154"
  "translation_ja": "家では、干し草や燕麦を決して馬に出し惜しみせず、干し草棚はてっぺんまで、飼葉桶は縁までいっぱいにしなさい。自分が出し惜しみされれば、嫌だろうから。馬には食べる気がないかもしれないが、頼むための口が利けないのだと、考えてやること。干し草が下へ落ちても、損はない。寝藁の代わりになって、藁が節約できる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-015"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your master is leaving a gentleman's house in the country, where he has lain a night; then consider his honour; let him know how many servants there are of both sexes, who expect vales; and give them their cue to attend in two lines, as he leaves the house; but desire him not to trust the money with the butler, for fear he should cheat the rest; this will force your master to be more generous: and then you may take occasion to tell your master, that 'squire such a one, whom you lived with last, always gave so much apiece to the common servants, and so much to the housekeeper, and the rest, naming at least double to what he intended to give; but be sure to tell the servants what a good office you did them: this will gain you love, and your master honour."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[231]"
    "line_start": 1001
    "source_sequence": 1279
    "printed_page": "154"
  "translation_ja": "主人が田舎の紳士の家で一泊し、出発しようとするときこそ、その名誉を考えなさい。心付けを期待している男女の奉公人が何人いるかを知らせ、家を出る際、二列に並んで待つよう、彼らに合図をすること。ただし、執事がほかの者の分をごまかすといけないから、金は執事に預けないよう、主人に頼みなさい。これで、主人はもっと気前よくせざるを得なくなる。そこで機会をとらえ、以前奉公していた何々旦那さまは、普通の奉公人には一人いくら、家政婦にはいくら、そのほかの者にはいくらと、いつもお渡しだったと話してよい。その額は、主人が渡そうと思っていたものの、少なくとも倍を挙げること。ただし、どれほどよい取り計らいをしてやったかは、必ず先方の奉公人たちに伝えなさい。あなたは好かれ、主人は名誉を得るだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-016"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "You may venture to be drunk much oftener than the coachman, whatever he pretends to allege in his own behalf, because you hazard nobody's neck but your own; for the horse will probably take so much care of himself, as to come off with only a strain or a shoulderslip."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[232]"
    "line_start": 1003
    "source_sequence": 1281
    "printed_page": "154"
  "translation_ja": "御者が自分のためにどんな理屈を持ち出そうと、あなたはあの男よりずっとたびたび酔っ払ってよい。危険にさらす首は、自分のものだけだからだ。馬はおそらく自分のことを十分気遣い、筋を違えるか、肩を外すくらいで済ませるだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-017"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you carry your master's riding-coat in a journey, wrap your own in it, and buckle them up close with a strap, but turn your master's inside out, to preserve the outside from wet and dirt; thus, when it begins to rain, your master's coat will be first ready to be given him; and if it get more hurt than yours, he can afford it better, for your livery must always serve its year's apprenticeship."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[233]"
    "line_start": 1005
    "source_sequence": 1287
    "printed_page": "155"
  "translation_ja": "旅で主人の乗馬用の外套を運ぶときは、その中へ自分の外套を包み、革帯できつく締めなさい。ただし、主人のほうは裏返して、表側を水や泥から守ること。こうしておけば、雨が降り出したとき、主人の外套を真っ先に取り出して渡せる。あなたのものより傷んでも、主人のほうが負担に耐えられる。あなたのお仕着せには、必ず一年間の徒弟奉公を務めてもらわねばならないのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-018"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you come to your inn with the horses wet and dirty after hard riding, and are very hot, make the ostler immediately plunge them into water up to their bellies, and allow them to drink as much as they please; but be sure to gallop them full speed a mile at least, to dry their skins and warm the water in their bellies. The ostler understands his business, leave all to his discretion, while you get a pot of ale and some brandy at the kitchen fire to comfort your heart."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[234]"
    "line_start": 1007
    "source_sequence": 1289
    "printed_page": "155"
  "translation_ja": "激しく走って、馬が濡れて汚れ、ひどく身体が熱くなったまま宿に着いたら、宿の馬丁に、すぐ腹まで水へ漬けさせ、好きなだけ飲ませなさい。ただし、少なくとも一マイルは全速力で駆けさせ、皮膚を乾かし、腹の中の水を温めることを忘れないように。宿の馬丁は仕事を心得ている。あなたは台所の火のそばで、エールとブランデーをいくらか飲んで元気をつけ、その間すべて彼の判断に任せなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-019"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your horse drop a fore shoe, be so careful as to alight and take it up: then ride with all speed you can (the shoe in your hand, that every traveller may observe your care) to the next smith on the road, make him put it on immediately, that your master may not wait for you, and that the poor horse may be as short a time as possible without a shoe."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[235]"
    "line_start": 1009
    "source_sequence": 1291
    "printed_page": "155"
  "translation_ja": "馬の前脚の蹄鉄が落ちたら、気を利かせて馬から降り、拾いなさい。それから、旅人皆にあなたの心遣いが見えるよう、その蹄鉄を手に持って、街道の次の鍛冶屋まで、できるだけ速く走ること。すぐに打ち直させ、主人を待たせず、哀れな馬が蹄鉄のないままでいる時間を、できるだけ短くしなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-020"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your master lies at a gentleman's house, if you find the hay and oats are good, complain aloud of their badness; this will get you the name of a diligent servant; and be sure to cram the horses with as much oats as they can eat, while you are there, and you may give them so much the less for some days at the inns, and turn the oats into ale. When you leave the gentleman's house, tell your master what a covetous hunks that gentleman was, that you got nothing but buttermilk or water to drink; this will make your master out of pity allow you a pot of ale the more at the next inn: but if you happen to get drunk in a gentleman's house, your master cannot be angry, because it cost him nothing: and so you ought to tell him as well as you can in your present condition, and let him know it is both for his and the gentleman's honour to make a friend's servant welcome."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[236]"
    "line_start": 1011
    "source_sequence": 1293
    "printed_page": "155"
  "translation_ja": "主人が紳士の家に泊まり、干し草と燕麦がよいものだと分かったら、その質の悪さを声高に非難しなさい。そうすれば、忠実な奉公人という評判が得られる。また、そこにいる間、馬には必ず、食べられるだけ燕麦を詰め込むこと。数日は宿屋で与える量をそれだけ減らし、燕麦をエールに換えられる。紳士の家を出るときには、あの方は何というけちん坊か、自分はバターミルクか水しか飲ませてもらえなかった、と主人に話しなさい。そうすれば主人も気の毒がり、次の宿でエールをもう一杯許してくれる。だが、紳士の家で酔っ払ってしまっても、主人は怒れない。自分の懐は痛まなかったからだ。そのことは、今の状態で言えるだけうまく伝え、友人の奉公人をもてなすのは、主人の名誉にも、その紳士の名誉にもなるのだと、分かってもらいなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-021"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A master ought always to love his groom, to put him in a handsome livery, and to allow him a silver-laced hat. When you are in this equipage, all the honours he receives on the road are owing to you alone: that he is not turned out of the way by every carrier, is caused by the civility he receives at second hand from the respect paid to your livery."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[237]"
    "line_start": 1013
    "source_sequence": 1299
    "printed_page": "156"
  "translation_ja": "主人は、いつも自分の馬丁を大事にし、立派なお仕着せを着せ、銀の飾り紐を付けた帽子を与えるべきだ。あなたがその装いをしていれば、街道で主人が受ける敬意は、すべてあなた一人のおかげである。荷運び人に出会うたび道を追い出されずに済むのも、あなたのお仕着せに払われる敬意から、間接にもらった礼儀のおかげなのだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-022"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "You may now and then lend your master's pad to a brother servant, or your favourite maid, for a short jaunt, or hire him for a day, because the horse is spoiled for want of exercise; and if your master happens to want his horse, or has a mind to see the stable, curse that rogue the helper, who is gone out with the key."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[238]"
    "line_start": 1015
    "source_sequence": 1301
    "printed_page": "156"
  "translation_ja": "ときどき、主人の乗用馬を仲間の奉公人や、お気に入りの女の奉公人に、ちょっとした遠出のため貸してもよいし、一日、賃貸ししてもよい。運動不足では馬が駄目になるからだ。たまたま主人が馬を使いたがったり、厩を見たがったりしたら、鍵を持って出ていった手伝いの悪党め、と悪態をつけばよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c05-023"
  "section_id": "chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you want to spend an hour or two with your companions at the alehouse, and that you stand in need of a reasonable excuse for your stay, go out of the stable door, or the back way, with an old bridle, girth, or stirrup-leather in your pocket; and on your return, come home by the street door with the same bridle, girth, or stirrup-leather dangling in your hand, as if you came from the saddler's, where you were getting the same mended; if you were not missed, all is well; but if you are met by your master, you will have the reputation of a careful servant. This I have known practised with good success."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[239]"
    "line_start": 1017
    "source_sequence": 1303
    "printed_page": "156"
  "translation_ja": "居酒屋で仲間と一、二時間過ごしたくなり、留守にするもっともらしい言い訳が必要なら、古い手綱か腹帯か鐙革をポケットに入れて、厩の戸か裏口から出なさい。帰りは、同じ手綱か腹帯か鐙革を手からぶら下げ、今まで馬具屋で修理させてきたかのように、表の戸から帰ってくること。不在に気づかれなければ、それでよし。主人と出会えば、気配りの行き届いた奉公人という評判を得る。これが実際にうまくいった例を、私は知っている。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

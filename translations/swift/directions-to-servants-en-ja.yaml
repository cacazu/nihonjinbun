  "section_id": "chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "FATIGUE of making butter: put scalding water in your churn, although in summer, and churn close to the kitchen fire, and with cream of a week old. Keep cream for your sweetheart."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"

  "translation_ja": |-
    第三章
    従僕心得。
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-001"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "YOUR employment, being of a mixed nature, extends to a great variety of business, and you stand in a fair way of being the favourite of your master or mistress, or of the young masters and misses; you are the fine gentleman of the family, with whom all the maids are in love. You are sometimes a pattern of dress to your master, and sometimes he is so to you. You wait at table in all companies, and consequently have the opportunity to see and know the world, and to understand men and manners. I confess your vales are but few, unless you are sent with a present, or attend the tea in the country; but you are called Mr. in the neighbourhood, and sometimes pick up a fortune; perhaps your master's daughter; and I have known many of your tribe to have good commands in the army. In town you have a seat reserved for you in the playhouse, where you have an opportunity of becoming wits and criticks: you have no professed enemy except the rabble, and my lady's waitingwoman, who are sometimes apt to call you skip-kennel. I have a true veneration for your office, because I had once the honour to be one of your order, which I foolishly left by demeaning myself with accepting an employment in the customhouse. But that you, my brethren, may come to better fortunes, I shall here deliver my instructions, which have been the fruits of much thought and observation, as well as of seven years experience."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[157]"
    "line_start": 851
    "source_sequence": 991
    "printed_page": "133"
  "translation_ja": "あなたの仕事はさまざまな役目が入り交じっているので、用事は多岐にわたり、主人や奥さま、若旦那やお嬢さまのお気に入りになる機会にも恵まれている。あなたは一家の伊達男で、女の奉公人は皆、あなたに恋をする。ときには主人があなたの服装を手本とし、ときにはあなたが主人を手本とする。どんな客の集まりでも食卓で給仕するので、世間を見聞きし、人間とその作法を知る機会がある。確かに、贈り物を届けにやられたり、田舎で茶の給仕をしたりするのでなければ、心付けはあまりもらえない。だが近所では「何々さん」と呼ばれ、ときには財産をつかむこともある。ひょっとすると、主人の娘かもしれない。あなたの仲間で、軍の立派な指揮職に就いた者も、私は大勢知っている。町では芝居小屋に専用の席があり、才人や批評家になる機会にも恵まれる。公然たる敵は、町の下層の連中と、奥さまの侍女のほかにはいない。その連中は、ときどきあなたを溝跳び野郎と呼びたがる。私はあなたの職分を心から尊敬している。かつて私も、その一員たる栄誉に浴したことがあるからだ。ところが愚かにも、税関の勤めを引き受けて身を落とし、その職を離れてしまった。だが、わが同業の諸君がもっとよい運をつかめるよう、ここに教えを授けよう。これは、多くの思索と観察、それに七年の経験の実りである。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-002"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In order to learn the secrets of other families, tell them those of your master's; thus you will grow a favourite both at home and abroad, and regarded as a person of importance."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[158]"
    "line_start": 853
    "source_sequence": 999
    "printed_page": "134"
  "translation_ja": "よその家の秘密を知るには、自分の主人の家の秘密を話してやりなさい。そうすれば、内でも外でも気に入られ、重要人物と見なされるようになる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-003"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never be seen in the streets with a basket or bundle in your hands, and carry nothing but what you can hide in your pocket, otherwise you will disgrace your calling: to prevent which, always retain a blackguard boy to carry your loads; and if you want farthings, pay him with a good slice of bread, or scrap of meat."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[159]"
    "line_start": 855
    "source_sequence": 1001
    "printed_page": "134"
  "translation_ja": "籠や包みを手に持って、街路を歩く姿を見られてはいけない。ポケットに隠せるもの以外は持ち歩かないこと。さもないと、職業の名折れになる。それを防ぐため、荷物を運ばせる使い走りの小僧を、いつも雇っておきなさい。ファージング銅貨が足りなければ、厚切りのパンか、肉の切れ端で払えばよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-004"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let a shoeboy clean your own shoes first, for fear of fouling the chamber, then let him clean your master's; keep him on purpose for that use, and to run of errands, and pay him with scraps. When you are sent on an errand, be sure to edge in some business of your own, either to see your sweetheart, or drink a pot of ale with some brother servants, which is so much time clear gained."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[160]"
    "line_start": 856
    "source_sequence": 1004
    "printed_page": "134"
  "translation_ja": "部屋を汚さないよう、靴磨きの少年には、まず自分の靴を磨かせ、それから主人の靴を磨かせなさい。その仕事と使い走りのために、専用の少年を置き、残り物で払うこと。使いに出されたら、恋人に会うなり、仲間の奉公人とエールを一杯飲むなり、自分の用事を必ず差し挟みなさい。それだけ丸ごと時間が浮くのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-005"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is a great controversy about the most convenient and genteel way of holding your plate at meals; some stick it between the frame and the back of the chair, which is an excellent expedient, where the make of the chair will allow it: others, for fear the plate should fall, grasp it so firmly, that their thumb reaches to the middle of the hollow; which however, if your thumb be dry, is no secure method; and therefore in that case, I advise your wetting the ball of it with your tongue: as to that absurd practice of letting the back of the plate lye leaning on the hollow of your hand, which some ladies recommend, it is universally exploded, being liable to so many accidents. Others again are so refined, that they hold their plate directly under the left armpit, which is the best situation for keeping it warm; but this may be dangerous in the article of taking away a dish, where your plate may happen to fall upon some of the company's heads. I confess myself to have objected against all these ways, which I have frequently tried; and therefore I recommend a fourth, which is to stick your plate up to the rim inclusive, in the left side between your waistcoat and your shirt: this will keep it at least as warm as under your armpit, or ockster, as the Scots call it; this will hide it so, as strangers may take you for a better servant, too good to hold a plate; this will secure it from falling, and thus disposed, it lies ready for you to whip out in a moment ready warmed to any guest within your reach, who may want it. And lastly, there is another convenience in this method, that if at any time during your waiting you find yourself going to cough or sneeze, you can immediately snatch out the plate, and hold the hollow part close to your nose or mouth, and thus prevent spirting any moisture from either upon the dishes or the ladies dress; you see gentlemen and ladies observe a like practice on such an occasion, with a hat or a handkerchief; yet a plate is less fouled and sooner cleaned than either of these; for, when your cough or sneeze is over, it is but returning your plate to the same position, and your shirt will clean it in the passage."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[161]"
    "line_start": 858
    "source_sequence": 1010
    "printed_page": "135"
  "translation_ja": "食事の給仕中、皿をどう持つのがいちばん便利で上品かについては、大変な論争がある。椅子の枠と背もたれの間に挟む者もいて、椅子の造りがそれを許すなら、実によい工夫だ。また、落とすのを恐れて、親指が皿のくぼみの真ん中まで届くほど、しっかり握る者もいる。ただし、親指が乾いていれば、この方法も確かではないので、その場合は、親指の腹を舌でぬらすことを勧める。皿の裏を手のひらのくぼみに載せておくという、一部の奥さま方がお勧めの愚かなやり方は、さまざまな事故を招くため、誰からも見放されている。また、左の脇の下へじかに皿を挟むほど、洗練された者もいる。温めておくには最上の場所だが、大皿を下げる際、抱えていた皿が客の誰かの頭に落ちることもあるので、危険かもしれない。私自身は、これらの方法を何度も試してみて、どれにも異論がある。そこで第四の方法を勧めよう。左の胴着とシャツの間に、縁まですっぽり皿を差し込んでおくのだ。これなら、脇の下、スコットランド人のいうオクスターに挟むのと、少なくとも同じくらい温まる。しかも皿が見えなくなるので、よその人は、皿など持たない、もっと格の高い奉公人だと思うだろう。落とす心配もなく、こうしておけば、手の届く客が皿を欲しがったとき、すでに温まったものを一瞬でさっと抜き出せる。最後に、もう一つ便利な点がある。給仕の途中で咳やくしゃみが出そうになれば、すぐ皿を抜き出し、くぼんだ側を鼻か口にぴったり当てて、料理や婦人の服に、どちらからも水気を飛ばさずにすむのだ。紳士淑女も、そういうときには、帽子かハンカチで同じようなことをするのを見かける。だが皿なら、そのどちらより汚れにくく、すぐきれいになる。咳やくしゃみが済んだら、皿を元の位置に戻すだけでよく、通り道でシャツが拭いてくれるからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-006"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Take off the largest dishes, and set them on, with one hand, to show the ladies your vigour and strength of back; but always do it between two ladies, that if the dish happens to slip, the soup or sauce may fall on their clothes, and not daub the floor; by this practice, two of our brethren, my worthy friends, got considerable fortunes."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[162]"
    "line_start": 860
    "source_sequence": 1016
    "printed_page": "136"
  "translation_ja": "いちばん大きな料理皿を運び下げたり運び上げたりするときは、婦人方に元気と腰の強さを見せるため、片手でやりなさい。ただし、必ず二人の婦人の間で行うこと。皿が滑っても、スープやソースが床を汚さず、婦人たちの服にかかるようにするためだ。このやり方で、私の立派な友人である仲間二人は、相当な財産を手に入れた。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-007"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Learn all the new-fashion words, and oaths, and songs, and scraps of plays that your memory can hold. Thus you will become the delight of nine ladies in ten, and the envy of ninety-nine beaux in a hundred."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[163]"
    "line_start": 862
    "source_sequence": 1018
    "printed_page": "136"
  "translation_ja": "新流行の言葉、悪態、歌、芝居のせりふの断片を、覚えられるだけ覚えなさい。そうすれば、十人中九人の婦人に喜ばれ、百人中九十九人の伊達男に羨ましがられるようになる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-008"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Take care, that at certain periods, during dinner especially, when persons of quality are there, you and your brethren be all out of the room together; by which you will give yourselves some ease from the fatigue of waiting, and at the same time leave the company to converse more freely without being constrained by your presence."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[164]"
    "line_start": 864
    "source_sequence": 1020
    "printed_page": "136"
  "translation_ja": "食事の途中、折々には、特に身分の高い客がいるとき、あなたも仲間も全員、一緒に部屋からいなくなるよう気をつけなさい。そうすれば、給仕の疲れから少し休めるうえ、客たちも、あなたがたのいることに気兼ねせず、もっと自由に話ができる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-009"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are sent on a message, deliver it in your own words, although it be to a duke or a duchess, and not in the words of your master or lady; for how can they understand what belongs to a message as well as you, who have been bred to the employment? But never deliver the answer till it is called for, and then adorn it with your own style."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[165]"
    "line_start": 866
    "source_sequence": 1026
    "printed_page": "137"
  "translation_ja": "伝言を頼まれたら、相手が公爵でも公爵夫人でも、主人や奥さまの言葉ではなく、自分の言葉で伝えなさい。伝言に何が必要かということを、その仕事で育ってきたあなたほど、あの方々に分かるはずがないではないか。ただし、返事は尋ねられるまで決して伝えず、伝えるときには自分の言い回しで飾り立てること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-010"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When dinner is done, carry down a great heap of plates to the kitchen, and when you come to the head of the stairs, trundle them all before you: there is not a more agreeable sight or sound, especially if they be silver, beside the trouble they save you, and there they will lie ready near the kitchen door for the scullion to wash them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[166]"
    "line_start": 868
    "source_sequence": 1028
    "printed_page": "137"
  "translation_ja": "食事が済んだら、皿を山と積んで台所へ運び、階段の上まで来たところで、全部、自分より先に転がし落としなさい。これほど心地よい眺めも音もない。銀の皿なら、なおさらだ。自分の手間も省けるうえ、台所の戸口の近くに並び、皿洗いが洗うばかりになる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-011"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are bringing up a joint of meat in a dish, and it falls out of your hand, before you get into the diningroom, with the meat on the ground, and the sauce spilled, take up the meat gently, wipe it with the flap of your coat, then put it again into the dish, and serve it up; and when your lady misses the sauce, tell her, it is to be sent up in a plate by itself."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[167]"
    "line_start": 870
    "source_sequence": 1030
    "printed_page": "137"
  "translation_ja": "皿に載せた肉の塊を運び上げる途中、食堂へ入る前に手から落とし、肉は地面、ソースはこぼれてしまったら、肉をそっと拾い上げ、上着の裾で拭き、皿に戻して出しなさい。奥さまがソースがないとおっしゃったら、別の皿で運んでくるところです、と答えればよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-012"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you carry up a dish of meat, dip your fingers in the sauce, or lick it with your tongue, to try whether it be good, and fit for your master's table."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[168]"
    "line_start": 872
    "source_sequence": 1032
    "printed_page": "137"
  "translation_ja": "肉料理の皿を運び上げるときは、ソースに指を浸すか、舌でなめるかして、うまいかどうか、主人の食卓に出してよいものかどうかを確かめなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-013"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "You are the best judge of what acquaintance your lady ought to have, and therefore if she sends you on a message of compliment or business to a family you do not like, deliver the answer in such a manner, as may breed a quarrel between them not to be reconciled: or if a footman comes from the same family on the like errand, turn the answer she orders you to deliver, in such a manner, as the other family may take it for an affront."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[169]"
    "line_start": 874
    "source_sequence": 1034
    "printed_page": "137"
  "translation_ja": "奥さまがどんな家と付き合うべきかは、あなたがいちばんよく判断できる。だから、あなたの気に入らない家へ、挨拶や用事の伝言を持って行くよう言いつけられたら、その家との間に、仲直りのできない喧嘩が起こるような伝え方で、返事を取り次ぎなさい。あるいは、その家の従僕が同じような使いでやって来たら、奥さまから託された返事を、向こうの家が侮辱と受け取るように、言い換えて伝えればよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-014"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are in lodgings, and no shoeboy to be got, clean your master's shoes with the bottom of the curtains, a clean napkin, or your landlady's apron."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[170]"
    "line_start": 876
    "source_sequence": 1040
    "printed_page": "138"
  "translation_ja": "借間に滞在していて、靴磨きの少年が見つからなければ、カーテンの裾か、清潔なナプキンか、家主の女将の前掛けで、主人の靴を磨きなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-015"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Ever wear your hat in the house, but when your master calls; and as soon as you come into his presence, pull it off to show your manners."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[171]"
    "line_start": 878
    "source_sequence": 1042
    "printed_page": "138"
  "translation_ja": "家の中では、主人に呼ばれるとき以外、いつも帽子をかぶっていなさい。そして御前へ出たら、すぐに脱いで、礼儀を示すこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-016"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never clean your shoes on the scraper, but in, the entry, or at the foot of the stairs, by which you will have the credit of being at home almost a minute sooner, and the scraper will last longer."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[172]"
    "line_start": 880
    "source_sequence": 1044
    "printed_page": "138"
  "translation_ja": "靴の泥は、決して泥落とし金具で落とさず、玄関の中か階段の下で落としなさい。そうすれば、一分近く早く帰宅したという評判が得られ、泥落としも長持ちする。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-017"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never ask leave to go abroad, for then it will be always known that you are absent, and you will be thought an idle rambling fellow; whereas if you go out and nobody observes you, you have a chance of coming home without being missed, and you need not tell your fellow-servants where you are gone, for they will be sure to say, you were in the house but two minutes ago, which is the duty of all servants."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[173]"
    "line_start": 882
    "source_sequence": 1046
    "printed_page": "138"
  "translation_ja": "外出の許可は決して求めないこと。求めれば、不在だと必ず知られ、ぶらぶら出歩く怠け者と思われる。ところが、誰にも気づかれずに出れば、いないことを知られずに帰れる見込みがある。仲間の奉公人に行き先を教える必要もない。彼らはきっと、ほんの二分前には家にいたと言ってくれる。それが、すべての奉公人の務めだからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-018"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Snuff the candles with your fingers, and throw the snuff on the floor, then tread it out to prevent stinking: this method will very much save the snuffers from wearing out. You ought also to snuff them close to the tallow, which will make them run, and so increase the perquisite of the cook's kitchenstuff; for she is the person you ought in prudence to be well with."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[174]"
    "line_start": 884
    "source_sequence": 1048
    "printed_page": "138"
  "translation_ja": "ろうそくの芯は指でつまんで切り、切り取った芯は床に投げて、臭わないよう踏み消しなさい。この方法なら、芯切りばさみの摩耗が大いに防げる。また、芯は獣脂に近いところまで切ること。そうすれば脂が垂れて、料理人の役得である台所の廃脂が増える。賢く立ち回るなら、あの人とは仲よくしておくべきなのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-019"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "While grace is saying after meat, do you and your brethren take the chairs from behind the company, so that when they go to sit again, they may fall backward, which will make them all merry; but be you so discreet as to hold your laughter till you get to the kitchen, and then divert your fellow servants."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[175]"
    "line_start": 886
    "source_sequence": 1051
    "printed_page": "138"
  "translation_ja": "食後の感謝の祈りが唱えられている間に、あなたも仲間も、客の背後から椅子を取り去りなさい。そうすれば、また座ろうとして後ろへひっくり返り、皆が愉快になる。ただし、台所へ戻るまで笑いをこらえる分別は持ち合わせ、そこで仲間の奉公人を楽しませること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-020"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you know your master is most busy in company, come in and pretend to fettle about the room, and if he chides, say, you thought he rung the bell. This will divert him from plodding on business too much, or spending himself in talk, or racking his thoughts, all which are hurtful to his constitution."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[176]"
    "line_start": 888
    "source_sequence": 1057
    "printed_page": "139"
  "translation_ja": "主人が客と取り込んでいるのが分かったら、部屋へ入り、あちこち整えるふりをしなさい。叱られたら、鈴をお鳴らしになったと思いました、と答えること。そうすれば主人は、仕事に根を詰めすぎたり、話で消耗したり、頭を絞ったりするのを中断できる。どれも身体によくないことなのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-021"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are ordered to break the claw of a crab or a lobster, clap it between the sides of the diningroom door between the hinges: thus you can do it gradually without mashing the meat, which is often the fate of the street-door key, or the pestle."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[177]"
    "line_start": 890
    "source_sequence": 1059
    "printed_page": "139"
  "translation_ja": "カニやロブスターのはさみを割るよう言いつけられたら、食堂の戸の蝶番側の隙間に挟みなさい。これなら、少しずつ割ることができ、玄関の鍵やすりこぎを使うときのように、身をつぶさずにすむ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-022"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you take a foul plate from any of the guests, and observe the foul knife and fork lying on the plate, show your dexterity, take up the plate, and throw off the knife and fork on the table without shaking off the bones or broken meat that are left: then the guest, who has more time than you, will wipe the fork and knife already used."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[178]"
    "line_start": 892
    "source_sequence": 1061
    "printed_page": "139"
  "translation_ja": "客の使い終えた皿を下げるとき、使ったナイフとフォークも載っていたら、手際のよさを見せなさい。皿を持ち上げ、残った骨や肉の切れ端は落とさずに、ナイフとフォークだけを食卓へ放り落とすのだ。そうすれば、あなたより暇のある客が、使ったフォークとナイフを拭いてくれる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-023"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you carry a glass of liquor to any person who has called for it, do not bob him on the shoulder, or cry, sir, or madam, here's the glass; that would be unmannerly, as if you had a mind to force it down one's throat; but stand at the person's left shoulder and wait his time; and if he strikes it down with his elbow by forgetfulness, that was his fault and not yours."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[179]"
    "line_start": 894
    "source_sequence": 1063
    "printed_page": "139"
  "translation_ja": "飲み物を頼んだ人にグラスを運ぶときは、肩を小突いたり、「旦那さま」「奥さま、グラスをどうぞ」と叫んだりしてはいけない。それでは、相手の喉に無理やり押し込む気があるかのようで、無作法だ。その人の左肩の後ろに立ち、相手の都合を待つこと。うっかり肘で払い落とされたとしても、それはその人の落ち度で、あなたの落ち度ではない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-024"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your mistress sends you for a hackney coach in a wet day, come back in the coach to save your clothes and the trouble of walking; it is better the bottom of her petticoats should be daggled with your dirty shoes, than your livery be spoiled, and yourself get a cold."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[180]"
    "line_start": 896
    "source_sequence": 1065
    "printed_page": "139"
  "translation_ja": "雨の日に奥さまから辻馬車を呼びにやられたら、服を守り、歩く手間を省くため、その馬車に乗って戻りなさい。奥さまのペティコートの裾が、あなたの泥靴で汚れるほうが、お仕着せを傷め、自分が風邪をひくよりよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-025"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is no indignity so great to one of your station as that of lighting your master in the streets with a lantern; and therefore it is very honest policy to try all arts how to evade it: besides, it shows your master to be either poor or covetous, which are the two worst qualities you can meet with in any service. When I was under these circumstances, I made use of several wise expedients, which I here recommend to you: sometimes I took a candle so long, that it reached to the very top of the lantern and burned it: but my master after a good beating, ordered me to paste it over with paper. I then used a middling candle, but stuck it so loose in the socket, that it leaned toward one side, and burned a whole quarter of the horn. Then I used a bit of candle of half an inch, which sunk in the socket, and melted the solder, and forced my master to walk half the way in the dark. Then he made me stick two inches of candle in the place where the socket was; after which I pretended to stumble, put out the candle, and broke all the tin part to pieces: at last, he was forced to make use of a lanternboy out of perfect good husbandry."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[181]"
    "line_start": 898
    "source_sequence": 1071
    "printed_page": "140"
  "translation_ja": "あなたのような立場の者にとって、提灯を持って主人の街路の足元を照らすことほど、ひどい屈辱はない。だから、あらゆる手を試して逃れようとするのは、まったく正直な方策だ。そのうえ、これは主人が貧乏か、けちかのどちらかだと示すことにもなる。どこの奉公先でも出会いうる、最悪の二つの性質である。私がこの境遇にあったときは、いくつか賢い工夫を使ったので、ここでお勧めしよう。あるときは、提灯のいちばん上まで届くような長いろうそくを使い、上を焼いた。だが主人は、私をたっぷり殴ったあと、そこへ紙を貼れと命じた。そこで、中くらいのろうそくを使い、ろうそく受けにわざと緩く差して片側に傾くようにし、角板の四分の一をすっかり焼いた。次に、半インチほどのろうそくの切れ端を使うと、受けの中に沈み込み、はんだを溶かして、主人は道の半分を暗がりの中で歩かざるを得なかった。すると主人は、ろうそく受けのあった場所に、二インチのろうそくを立てさせた。それから私は、つまずいたふりをして、火を消し、ブリキの部分をすっかり壊した。とうとう主人は、純粋に節約のため、提灯持ちの少年を使わざるを得なくなった。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-026"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is much to be lamented, that gentlemen of our employment have but two hands to carry plates, dishes, bottles, and the like out of the room at meals; and the misfortune is still the greater, because one of those hands is required to open the door, while you are encumbered with your load; therefore I advise, that the door may be always left at jar, so as to open it with your foot, and then you may carry out plates and dishes from your belly up to your chin, beside a good quantity of things under your arms, which will save you many a weary step; but take care that none of the burden falls till you are out of the room, and if possible out of hearing."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[182]"
    "line_start": 900
    "source_sequence": 1073
    "printed_page": "140"
  "translation_ja": "私たちの仕事をする紳士に、食事中、部屋から皿や大皿や瓶などを運び出す手が二本しかないのは、大いに嘆かわしい。しかも、荷物を抱えたまま、その片手で戸を開けなければならないので、不運はいっそう大きい。だから、戸はいつも少し開けておき、足で開けられるようにすることを勧める。そうすれば、腹から顎まで皿や大皿を積み、そのうえ両脇にも相当な量を抱えて運び出せるので、疲れる往復を何度も省ける。ただし、部屋から出るまでは何も落とさず、できれば音の聞こえないところまで行くよう、気をつけなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-027"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are sent to the postoffice with a letter in a cold rainy night, step to the alehouse and take a pot, until it is supposed you have done your errand; but take the next fair opportunity to put the letter in carefully, as becomes an honest servant."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[183]"
    "line_start": 902
    "source_sequence": 1079
    "printed_page": "141"
  "translation_ja": "寒い雨の晩、手紙を出しに郵便局へやられたら、居酒屋に寄って一杯飲み、用事が済んだと思われる時刻まで待ちなさい。ただし、次の晴れ間の機会には、正直な奉公人にふさわしく、忘れずに手紙を投函すること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-028"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are ordered to make coffee for the ladies after dinner, and the pot happens to boil over, while you are running up for a spoon to stir it, or thinking of something else, or struggling with the chambermaid for a kiss, wipe the sides of the pot clean with a dishclout, carry up your coffee boldly, and when your lady finds it too weak, and examines you whether it has not run over, deny the fact absolutely, swear you put in more coffee than ordinary, that you never stirred an inch from it, that you strove to make it better than usual, because your mistress had ladies with her, that the servants in the kitchen will justify what you say; upon this, you will find that the other ladies will pronounce your coffee to be very good, and your mistress will confess that her mouth is out of taste, and she will for the future suspect herself, and be more cautious in finding fault. This I would have you do from a principle of conscience, for coffee is very unwholesome; and out of affection to your lady you ought to give it her as weak as possible: and upon this argument, when you have a mind to treat any of the maids with a dish of fresh coffee, you may, and ought to subtract a part of the powder on account of your lady's health, and getting her maids good-will."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[184]"
    "line_start": 904
    "source_sequence": 1081
    "printed_page": "141"
  "translation_ja": "食後、婦人方のコーヒーをいれるよう命じられ、かき混ぜる匙を取りに上へ走っている間や、何かほかのことを考えている間や、小間使いに口づけしようと揉み合っている間に、鍋が吹きこぼれたら、布巾で鍋の外側をきれいに拭き、堂々とコーヒーを運びなさい。奥さまが薄すぎるとおっしゃって、吹きこぼれたのではないかと問い詰めたら、断固として否定すること。いつもより粉を多く入れた、一インチもそばを離れなかった、奥さまに婦人方のお客様があるので、いつもよりよくいれようと努めた、台所の奉公人たちも証言してくれる、と誓いなさい。そうすれば、ほかの婦人方はコーヒーがたいそうおいしいと言い、奥さまは自分の口の具合が悪いと認め、今後はご自分のほうを疑って、そう軽々しく文句を言わなくなる。このようにするのは、良心からであってほしい。コーヒーはたいそう身体に悪いので、奥さまへの愛情から、できるだけ薄くして差し上げるべきだからだ。そしてこの理屈によれば、女の奉公人の誰かに、いれたてのコーヒーを一杯振る舞いたくなったときは、奥さまの健康と、女の奉公人の好意を得ることのため、粉の一部を取り分けてよいし、そうすべきなのだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-029"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your master sends you with a small trifling present to one of his friends, be as careful of it as you would be of a diamond ring; therefore, if the present be only half a dozen pippins, send up the servant who received the message to say, that you were ordered to deliver them with your own hands. This will show your exactness and care to prevent accidents or mistakes; and the gentleman or lady cannot do less than give you a shilling: so when your master receives the like present, teach the messenger who brings it to do the same, and give your master hints that may stir up his generosity; for brother servants should assist one another, since it is all for their master's honour, which is the chief point to be consulted by every good servant, and of which he is the best judge."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[185]"
    "line_start": 906
    "source_sequence": 1087
    "printed_page": "142"
  "translation_ja": "主人の友人のところへ、ささやかなつまらない贈り物を届けにやられたら、ダイヤモンドの指輪と同じくらい注意深く扱いなさい。だから、贈り物がリンゴ半ダースにすぎなくても、取り次いだ奉公人を上へやり、自分の手で直接お渡しするよう命じられている、と告げさせること。これなら、事故や間違いを防ぐための几帳面さと用心が示せるし、先方の紳士か淑女も、一シリングくらいは渡さずにいられない。だから主人が同じような贈り物を受け取るときには、持って来た使いの者に同じやり方を教え、主人には気前をよくさせるようなほのめかしをしなさい。同じ奉公人どうし、助け合うべきだからだ。それもすべて主人の名誉のためであり、立派な奉公人が何より考えるべきなのは、その名誉であって、判断するのにいちばん適しているのも奉公人なのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-030"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you step but a few doors off to tattle with a wench, or take a running pot of ale, or to see a brother footman going to be hanged, leave the street door open, that you may not be forced to knock, and your master discover you are gone out; for a quarter of an hour's time can do his service no injury."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[186]"
    "line_start": 908
    "source_sequence": 1089
    "printed_page": "142"
  "translation_ja": "数軒先へ娘とおしゃべりに行くときや、エールを駆けつけ一杯飲みに行くときや、仲間の従僕が絞首刑になるのを見に行くときは、玄関の戸を開け放しておきなさい。戸をたたかずにすむので、主人に外出したと気づかれない。十五分くらいで、主人への奉公に差し障りはないのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-031"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you take away the remaining pieces of bread after dinner, put them on foul plates and press them down with other plates over them, so as no body can touch them; and so they will be a good perquisite to the black-guard boy in ordinary."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[187]"
    "line_start": 910
    "source_sequence": 1091
    "printed_page": "142"
  "translation_ja": "食後、残りのパンを下げるときは、汚れた皿に載せ、ほかの皿を上から押しつけ、誰も手をつけられなくしておきなさい。そうすれば、いつもの使い走りの小僧の、よい役得になる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-032"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are forced to clean your master's shoes with your own hand, use the edge of the sharpest case-knife, and dry them with the toes an inch from the fire, because wet shoes are dangerous, and besides, by these arts you will get them the sooner for yourself."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[188]"
    "line_start": 911
    "source_sequence": 1094
    "printed_page": "142"
  "translation_ja": "やむを得ず自分の手で主人の靴を磨くときは、いちばん切れる食卓用ナイフの刃を使い、つま先を火から一インチのところに置いて乾かしなさい。濡れた靴は危険なうえ、この手を使えば、それだけ早く自分のお下がりになる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-033"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In some families the master often sends to the tavern for a bottle of wine, and you are the messenger; I advise you therefore, to take the smallest bottle you can find; but however, make the drawer give you a full quart, then you will get a good sup for yourself, and your bottle will be filled. As for a cork to stop it, you need be at no trouble, for the thumb will do as well, or a bit of dirty chewed paper."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[189]"
    "line_start": 913
    "source_sequence": 1100
    "printed_page": "143"
  "translation_ja": "家によっては、主人がしばしば酒場にワインを一本買いにやり、その使いがあなただ。そこで、見つかる限りいちばん小さな瓶を持って行くことを勧める。ただし、酒場の給仕には、たっぷり一クォートを出させなさい。そうすれば、自分もいい一口にありつけて、瓶もいっぱいになる。栓をするコルクに気を遣う必要はない。親指で十分だし、汚れた紙を噛んで丸めたものでもよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-034"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In all disputes with chairmen and coachmen for demanding too much, when your master sends you down to chaffer with them, take pity of the poor fellows, and tell your master that they will not take a farthing less: it is more for your interest to get share of a pot of ale, than to save a shilling for your master, to whom it is a trifle."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[190]"
    "line_start": 915
    "source_sequence": 1102
    "printed_page": "143"
  "translation_ja": "駕籠かきや御者が高すぎる代金を請求し、主人から値切りにやられたときは、いつでも気の毒な連中に同情し、一ファージングも負けないと言っています、と主人に伝えなさい。主人にははした金にすぎない一シリングを節約してやるより、エールを一杯分けてもらうほうが、あなたの得になる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-035"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you attend your lady in a dark night, if she uses her coach, do not walk by the coach side, so as to tire and dirt yourself, but get up into your proper place behind it, and so hold the flambeau sloping forward over the coach roof; and when it wants snuffing, dash it against the corners."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[191]"
    "line_start": 917
    "source_sequence": 1104
    "printed_page": "143"
  "translation_ja": "暗い晩に奥さまのお供をするとき、奥さまが馬車をお使いなら、馬車の横を歩いて疲れたり汚れたりせず、後ろの自分の持ち場に上がり、馬車の屋根の上から前へ傾けて、たいまつを持ちなさい。芯の燃えかすを落とす必要があれば、馬車の角に打ちつけること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-036"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you leave your lady at church on Sundays, you have two hours safe to spend with your companions at the alehouse, or over a beef steak and a pot of beer at home with the cook, and the maids; and indeed poor servants have so few opportunities to be happy, that they ought not to lose any."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[192]"
    "line_start": 919
    "source_sequence": 1106
    "printed_page": "143"
  "translation_ja": "日曜日、奥さまを教会に送り届けたら、安心して使える二時間がある。居酒屋で仲間と過ごしてもよいし、家で料理人や女中たちと、ビーフステーキとビールを一杯楽しんでもよい。実際、哀れな奉公人には、楽しく過ごせる機会があまりに少ないのだから、一度たりとも逃すべきではない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-037"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never wear socks when you wait at meals, on account of your own health, as well as of them who sit at table; because as most ladles like the smell of young mens toes, so it is a sovereign remedy against vapours."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[193]"
    "line_start": 920
    "source_sequence": 1109
    "printed_page": "143"
  "translation_ja": "食事の給仕をするときは、自分の健康のためにも、食卓についている方々の健康のためにも、決して靴下をはいてはいけない。たいていの婦人は若い男の足の指の匂いが好きで、それはまた、憂鬱な気分に対する特効薬でもあるからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-038"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Choose a service, if you can, where your livery colours are least tawdry and distinguishing: green and yellow immediately betray your office, and so do all kinds of lace, except silver, which will hardly fall to your share, unless with a duke or some prodigal just come to his estate. The colours you ought to wish for, are blue, or filemot turned up with red; which with a borrowed sword, a borrowed air, your master's linen, and a natural and improved confidence, will give you what title you please, where you are not known."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[194]"
    "line_start": 922
    "source_sequence": 1115
    "printed_page": "144"
  "translation_ja": "できれば、お仕着せの色が、あまりけばけばしくなく、目立たない奉公先を選びなさい。緑と黄色は、すぐにあなたの仕事をばらしてしまうし、銀以外の飾り紐もすべて同じだ。銀のものなど、公爵か、領地を継いだばかりの放蕩者のところでなければ、まずあなたには回ってこない。望むべき色は、青か枯葉色に、赤の折り返しが付いたものだ。それに、借り物の剣、借り物の気取り、主人の肌着、そして生まれつきの度胸を磨いたものが加われば、顔を知られないところでは、どんな称号でも好きなものが手に入る。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-039"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you carry dishes or other things out of the room at meals, fill both your hands as full as possible; for although you may sometimes spill, and sometimes let fall, yet you will find, at the year's end, you have made great dispatch, and saved abundance of time."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[195]"
    "line_start": 924
    "source_sequence": 1117
    "printed_page": "144"
  "translation_ja": "食事中、皿などを部屋から運び出すときは、両手に持てるだけ持ちなさい。ときにはこぼし、ときには落とすこともあろうが、年の終わりには、仕事が大いにはかどり、多くの時間を節約したと分かるだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-040"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your master or mistress happen to walk the streets, keep on one side, and as much on the level with them as you can, which people observing will either think you do not belong to them, or that you are one of their companions; but if either of them happen to turn back and speak to you, so that you are under the necessity to take off your hat, use but your thumb and one finger, and scratch your head with the rest."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[196]"
    "line_start": 926
    "source_sequence": 1119
    "printed_page": "144"
  "translation_ja": "主人や奥さまが街路をお歩きになるときは、片側に付き、できるだけ横に並んで歩きなさい。見た人は、あなたがその家の者ではないか、あるいはお連れの一人だと思うだろう。ただし、どちらかが振り向いて声をかけ、帽子を取らざるを得なくなったら、親指と指一本だけを使い、残りの指で頭をかくこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-041"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In winter time light the diningroom fire but two minutes before dinner is served up, that your master may see how saving you are of his coals."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[197]"
    "line_start": 928
    "source_sequence": 1121
    "printed_page": "144"
  "translation_ja": "冬、食堂の火を入れるのは、料理を出すわずか二分前にしなさい。どれほど石炭を節約してあげているか、主人に分かってもらうためだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-042"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are ordered to stir up the fire, clean away the ashes from betwixt the bars with the firebrush."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[198]"
    "line_start": 929
    "source_sequence": 1124
    "printed_page": "144"
  "translation_ja": "火をかき起こすよう言いつけられたら、炉の格子の間の灰を、暖炉用のほうきで掃き出しなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-043"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are ordered to call a coach, although it be midnight, go no farther than the door, for fear of being out of the way when you are wanted; and there stand bawling, Coach, Coach, for half an hour."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[199]"
    "line_start": 931
    "source_sequence": 1130
    "printed_page": "145"
  "translation_ja": "馬車を呼ぶよう言いつけられたら、たとえ真夜中でも、玄関より遠くへは行かないこと。呼ばれたときに、居合わせなくてはいけないからだ。そこで三十分、「馬車、馬車」と怒鳴り続けなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-044"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Although you gentlemen in livery have the misfortune to be treated scurvily by all mankind, yet you make a shift to keep up your spirits, and sometimes arrive at considerable fortunes. I was an intimate friend to one of our brethren, who was footman to a court lady: she had an honourable employment, was sister to an earl, and the widow of a man of quality. She observed something so polite in my friend, the gracefulness with which he tripped, before her chair, and put his hair under his hat, that she made him many advances; and one day taking the air in her coach with Tom behind it, the coachman mistook the way, and stopped at a privileged chapel, where the couple were married, and Tom came home in the chariot by his lady's side: but he unfortunately taught her to drink brandy, of which she died, after having pawned all her plate to purchase it, and Tom is now a journeyman maltster."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[200]"
    "line_start": 933
    "source_sequence": 1132
    "printed_page": "145"
  "translation_ja": "お仕着せの紳士諸君は、世の中の誰からもひどく扱われるという不運に遭っているが、それでもどうにか元気を保ち、ときには相当な財産にたどり着く。私の親しい友人だった仲間の一人は、宮廷のある婦人の従僕をしていた。婦人は名誉ある役職に就き、伯爵の姉妹で、身分の高い男の未亡人だった。この友人には、たいそう洗練されたところがあり、婦人の駕籠の前を軽やかに歩く姿や、髪を帽子の下へ収めるしぐさが優美なのに気づいて、婦人は盛んに言い寄った。ある日、トムを後ろに乗せて馬車で散歩に出ると、御者が道を間違えて、特別の権限を持つ礼拝堂の前で止まった。そこで二人は結婚し、トムは奥方の隣に座って、馬車で帰宅した。ところが不幸にも、トムは奥方にブランデーを飲むことを教えてしまい、奥方はそれを買うため銀器をすべて質に入れたあげく、飲酒のために死んだ。今、トムは雇われの麦芽職人をしている。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-045"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Boucher, the famous gamester, was another of our fraternity: and when he was worth 50000l. he dunned the duke of Buckingham for an arrear of wages in his service; and I could instance many more, particularly another, whose son had one of the chief employments at court; and is sufficient to give you the following advice, which is to be pert and saucy to all mankind, especially to the chaplain, the waiting-woman, and the better sort of servants in a person of quality's family, and value not now and then a kicking, or a caning; for your insolence will at last turn to good account; and from wearing a livery, you may probably soon carry a pair of colours."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[201]"
    "line_start": 935
    "source_sequence": 1134
    "printed_page": "145"
  "translation_ja": "有名な賭博師ブーシェも、私たちの仲間の一人だった。五万ポンドの財産がありながら、バッキンガム公爵に、奉公していたときの未払い賃金をしつこく催促したものだ。ほかにも多くの例を挙げられるし、特に、息子が宮廷の要職に就いた仲間もいる。これだけで、次の助言を授けるには十分だろう。誰に対しても生意気で無礼に振る舞い、特に、身分の高い家の付き牧師や侍女、格上の奉公人たちには、そうしなさい。ときどき蹴られたり、杖で打たれたりしても、気にしないこと。その横柄さも、ついには得になる。お仕着せを着る身から、ほどなく軍旗を担う士官の身になるかもしれないのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-046"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you wait behind a chair at meals, keep constantly wriggling the back of the chair, that the person behind whom you stand may know you are ready to attend him."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[202]"
    "line_start": 937
    "source_sequence": 1144
    "printed_page": "146"
  "translation_ja": "食事中、椅子の後ろに控えているときは、絶えず背もたれを揺すりなさい。あなたが後ろに立っているその人に、いつでも給仕する用意があると分かってもらうためだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-047"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you carry a parcel of china plates, if they chance to fall, as it is a frequent misfortune, your excuse must be, that a dog ran across you in the hall; that the chambermaid accidentally pushed the door against you; that a mop stood across the entry, and tripped you up; that your sleeve stuck against the key, or button of the lock."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[203]"
    "line_start": 939
    "source_sequence": 1146
    "printed_page": "146"
  "translation_ja": "磁器の皿を重ねて運んでいて、よくある不運で落としてしまったら、言い訳はこうしなさい。広間で犬が前を横切った、小間使いがうっかり戸を押しつけた、玄関をふさぐようにモップが立っていて足を取られた、袖が鍵や錠前のつまみに引っかかった。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-048"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your master and lady are talking together in their bedchamber, and you have some suspicion that you or your fellow servants are concerned in what they say, listen at the door for the publick good of all the servants, and join all to take proper measures for preventing any innovations that may hurt the community."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[204]"
    "line_start": 941
    "source_sequence": 1148
    "printed_page": "146"
  "translation_ja": "主人と奥さまが寝室で話し合っていて、自分や仲間の奉公人のことを話しているのではないかと疑ったら、奉公人全体の公益のため、戸口で立ち聞きしなさい。そして、共同体を害しかねない改革を何一つ許さないよう、皆で結束して、しかるべき手を打つこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-049"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Be not proud in prosperity: you have heard that fortune turns on a wheel; if you have a good place, you are at the top of the wheel. Remember how often you have been stripped, and kicked out of doors, your wages all taken up beforehand, and spent in translated red heeled shoes, secondhand toupees, and repaired laced ruffles, beside a swingeing debt to the alewife and the brandy shop. The neighbouring tapster, who before would beckon you over to a savoury bit of ox cheek in the morning, give it you gratis, and only score you up for the liquor, immediately after you were packed off in disgrace, carried a petition to your master to be paid out of your wages, whereof not a farthing was due, and then pursued you with bailiffs into every blind cellar. Remember how soon you grew shabby, threadbare, and out at heels; was forced to borrow an old livery coat, to make your appearance while you were looking for a place; and sneak to every house where you had an old acquaintance to steal you a scrap to keep life and soul together; and upon the whole, were in the lowest station of human life, which, as the old ballad says, is that of a skipkennel turned out of place; I say, remember all this now in your flourishing condition. Pay your contributions duly to your late brothers the cadets, who are left to the wide world; take one of them as your dependant to send on your lady's messages, when you have a mind to go to the alehouse: slip him out privately now and then a slice of bread, and a bit of cold meat; your master can afford it; and if he be not yet put upon establishment for a lodging, let him lie in the stable, or the coach-house, or under the back stairs, and recommend him to all the gentlemen who frequent your house as an excellent servant."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[205]"
    "line_start": 943
    "source_sequence": 1150
    "printed_page": "146"
  "translation_ja": "順境におごってはいけない。運命は車輪に乗って回るという話を、聞いたことがあるだろう。よい勤め口にいるなら、あなたはその車輪のいちばん上にいる。何度、お仕着せを剝ぎ取られ、戸外へ蹴り出されたかを思い出しなさい。賃金はすべて前借りし、仕立て直した赤い踵の靴、中古のかつら、繕ったレースの袖飾りにつぎ込み、そのうえ居酒屋の女将とブランデー屋には、どっさり借金があった。以前は、朝から隣の酒場の給仕が、うまそうな牛の頬肉へと手招きし、肉はただでくれ、酒代だけをつけにしてくれたものだ。ところが、あなたが不名誉にも追い出されるや、賃金から払ってもらおうと、主人へ請願書を持って行った。もらえる賃金など、一ファージングも残っていないのにだ。それからは執行吏を連れて、隠れた地下室という地下室まで追い回してきた。たちまち身なりがみすぼらしくなり、服は擦り切れ、踵は破れ、勤め口を探し歩くため、古いお仕着せを借りて、どうにか人前へ出なければならなくなったことを、思い出しなさい。古い知り合いのいる家ならどこへでもこそこそ出かけ、命をつなぐために、残り物を盗んで恵んでもらったものだ。要するに、人間の暮らしの最底辺にいたのだ。古い俗謡のいう、奉公先を追い出された溝跳び野郎の境遇である。今の栄えた暮らしの中で、これをすべて思い出しなさい、と私は言っているのだ。広い世間に放り出された、少し前までの仲間、あの下積み連中には、きちんと援助金を払うこと。その一人を自分の配下として抱え、居酒屋へ行きたいときには、代わりに奥さまの使いに出しなさい。ときどき内緒で、パン一切れと冷たい肉を少し渡してやること。主人にはそれくらいの余裕がある。まだ決まった寝場所がないなら、厩か馬車小屋か裏階段の下で寝かせてやり、家へ出入りする紳士たち皆に、優秀な奉公人として推薦しなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-050"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "To grow old in the office of a footman, is the highest of all indignities: therefore when you find years coming on without hopes of a place at court, a command in the army, a succession to the stewardship, an employment in the revenue, (which two last you cannot obtain without reading and writing) or running away with your master's niece or daughter; I directly advise you to go upon the road, which is the only post of honour left you: there you will meet many of your old comrades, and live a short life and a merry one, and make a figure at your exit, wherein I will give you some instructions."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[206]"
    "line_start": 945
    "source_sequence": 1156
    "printed_page": "147"
  "translation_ja": "従僕の仕事のまま年を取ることは、あらゆる屈辱の中でも最たるものだ。だから、宮廷の勤め口も、軍の指揮職も、家令の後継も、歳入関係の仕事も――後の二つは、読み書きができなければ手に入らない――、あるいは主人の姪や娘との駆け落ちも、望めないまま年が進んできたら、私は率直に、追い剥ぎをやることを勧める。それが、あなたに残された唯一の名誉ある地位なのだから。そこでは、昔の仲間に大勢会い、短くとも陽気な一生を送り、最期には晴れ姿を見せられる。そのことについて、少々教えを授けよう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c03-051"
  "section_id": "chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The last advice I give you relates to your behaviour when you are going to be hanged; which either for robbing your master, for housebreaking, or going upon the highway, or in a drunken quarrel by killing the first man you meet, may very probably be your lot, and is owing to one of these three qualities; either a love of good fellowship, a generosity of mind, or too much vivacity of spirits. Your good behaviour on this article will concern your whole community: deny the fact with all solemnity of imprecations: a hundred of your brethren, if they can be admitted, will attend about the bar, and be ready upon demand to give you a character before the court: let nothing prevail on you to confess, but the promise of a pardon for discovering your comrades; but I suppose all this to be in vain; for if you escape now, your fate will be the same another day. Get a speech to be written by the best author of Newgate: some of your kind wenches will provide you with a Holland shirt and white cap, crowned with a crimson or black ribbon: take leave cheerfully of all your friends in Newgate: mount the cart with courage; fall on your knees; lift up your eyes; hold a book in your hands, although you cannot read a word; deny the fact at the gallows; kiss and forgive the hangman, and so farewell: you shall be buried in pomp at the charge of the fraternity: the surgeon shall not touch a limb of you; and your fame shall continue until a successor of equal renown succeeds in your place."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[207]"
    "line_start": 947
    "source_sequence": 1162
    "printed_page": "148"
  "translation_ja": "最後の助言は、絞首刑になるときの振る舞いに関するものだ。主人の物を盗むにせよ、家に押し入るにせよ、街道で追い剥ぎを働くにせよ、酔った喧嘩で最初に出会った男を殺すにせよ、そうなるのは、あなたには大いにありうる運命である。そしてそれは、次の三つの性質のいずれかによるのだ。仲間と楽しく付き合うのが好きか、心が気前よすぎるか、気性が活発すぎるかである。このときの立派な振る舞いには、あなたの共同体全体がかかわっている。あらゆる厳粛な呪いの言葉にかけて、犯行を否定しなさい。仲間が百人、入れてもらえるなら、被告席の周りに付き添い、求めがあれば、あなたの人柄を法廷で証言する用意があるだろう。仲間の正体を明かせば赦免するという約束以外には、何に説かれても自白しないこと。ただし私は、そんなことはすべて無駄だと考えている。今は逃れても、別の日には同じ運命になるだろうから。ニューゲート監獄のいちばんよい作者に、最期の演説を書いてもらいなさい。親切な恋人の娘たちが、オランダ織のシャツと、深紅か黒のリボンで飾った白い帽子を用意してくれるだろう。ニューゲートの友人全員に、陽気に別れを告げなさい。勇気をもって荷車に乗り、膝をつき、目を上げ、一字も読めなくても本を手に持ちなさい。絞首台でも犯行を否定し、刑吏に口づけして赦しを与え、それでお別れだ。仲間の費用で盛大に葬られ、外科医には手足一本触れさせない。あなたの名声は、同じくらい名高い後継者が、その地位を継ぐまで続くだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

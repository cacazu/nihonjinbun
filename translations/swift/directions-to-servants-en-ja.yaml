  "translation_ja": |-
    第十六章
    家庭女教師、または教育係心得。
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c16-001"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "SAY the children have sore eyes; miss Betty won't take to her book, &c."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[307]"
    "line_start": 1202
    "source_sequence": 1703
    "printed_page": "174"
  "translation_ja": "子供たちは目を痛めている、ベティお嬢さまは勉強に身を入れようとしない、と言うこと、など。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c16-002"
  "section_id": "chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Make the misses read French and English novels, and French romances, all the comedies writ in king Charles II and king William's reigns, to soften their nature, and make them tender-hearted, &c."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[308]"
    "line_start": 1204
    "source_sequence": 1707
    "printed_page": "174"
  "translation_ja": "お嬢さまたちには、フランスとイングランドの小説や、フランスの恋愛物語、チャールズ二世とウィリアム王の治世に書かれたすべての喜劇を読ませ、気性を柔らかくし、情け深くしてやること、など。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-source-note-001"
  "section_id": "source-notes"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This is not English, the particle to ought not to precede the word grow, after the verb find; — better thus — 'If you find yourself growing into favour,' &c."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[4]/div/ol/li"
    "line_start": 1210
    "source_sequence": 1717
  "translation_ja": "これは正しい英語ではない。動詞findのあとでは、growという語の前にtoを置くべきではない。「If you find yourself growing into favour（気に入られるようになっていると気づいたら）」などとするほうがよい。"
  "translation_status": "reviewed"
  "source_kind": "source_editorial_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本の本文語法を批評する注。署名はなく、特定編者やSwift本人へ帰属させない。"

  "translation_ja": |-
    第十四章
    洗濯女心得。
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c14-001"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "IF you singe the linen with the iron, rub the place with flower, chalk, or white powder; and if nothing will do, wash it so long till it be either not to be seen, or torn to rags."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[301]"
    "line_start": 1181
    "source_sequence": 1654
    "printed_page": "173"
  "translation_ja": "アイロンで亜麻布を焦がしたら、その場所に小麦粉か、白墨か、白い粉をこすりつけなさい。何をしても駄目なら、焦げが見えなくなるか、ぼろぼろに破れるまで、長く洗うこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c14-002"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "About tearing linen in washing:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[302]"
    "line_start": 1183
    "source_sequence": 1658
    "printed_page": "173"
  "translation_ja": "洗濯で亜麻布を破くことについて。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c14-003"
  "section_id": "chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your linen is pinned on the line, or on a hedge, and it rains, whip it off, although you tear it, &c. But the place for hanging them is on young fruit trees, especially in blossom; the linen cannot be torn, and the trees give them a fine smell."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[303]"
    "line_start": 1185
    "source_sequence": 1660
    "printed_page": "173"
  "translation_ja": "干し綱か生け垣に亜麻布を留めておいて、雨が降ったら、破れてもかまわず、さっと引き取ること、など。だが、掛けるべき場所は若い果樹、特に花盛りの木である。亜麻布は破れず、木がよい香りを付けてくれる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

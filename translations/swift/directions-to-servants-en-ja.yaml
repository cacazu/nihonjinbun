  "translation_ja": |-
    第十五章
    家政婦心得。
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c15-001"
  "section_id": "chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "YOU must always have a favourite footman whom you can depend upon; and order him to be very watchful when the second course is taken off, that it be brought safely to your office, that you and the steward may have a titbit together."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[305]"
    "line_start": 1195
    "source_sequence": 1681
    "printed_page": "173"
  "translation_ja": "いつも、頼りにできるお気に入りの従僕を一人持ち、第二の膳を下げるときには、十分気をつけて、無事にあなたの部屋へ持ってこさせなさい。あなたと家令が、一緒にうまいものをつまめるようにするためだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c16-heading"
  "section_id": "chapter-16"

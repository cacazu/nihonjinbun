- "id": "dts-c07-001"
  "section_id": "chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "IF your master be a minister of state, let him be at home to none but his pimp, or chief flatterer, or one of his pensionary writers, or his hired spy and informer, or his printer in ordinary, or his city solicitor, or a landjobber, or his inventor of new funds, or a stockjobber."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[243]"
    "line_start": 1037
    "source_sequence": 1357
    "printed_page": "157"
  "translation_ja": "主人が国務大臣なら、主人の女の世話をする男、筆頭のおべっか使い、年金で雇われた文筆家の一人、雇いの密偵兼密告者、常用の印刷人、シティでの用件を扱う代理人、土地の投機屋、新たな財源を考え出す者、株の投機屋のほかは、誰に対しても留守にしておきなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-heading"

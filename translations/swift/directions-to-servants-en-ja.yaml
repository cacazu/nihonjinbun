  "source_attribution_assessment_ja": "単に全集目次に収録されることとは別に、本作固有の編者説明が1745年Faulkner刊行と、Orreryによるdean生前の写本回覧・評判の証言を引用し、未完原稿をSwiftの作として扱う。今回直接読んだのは1801年版の説明であり、1745年刊行本・Faulknerの元の序文・Orrery原著を直接実見したとは扱わない。"
  "editorial_attribution_limit_ja": "1801年版のこの説明自体に個人署名は見当たらず、巻の編者名から特定の執筆者へ自動帰属しない。"
  "source_preparation_manual_scope_ja": "編者未完説明・全標題と一般心得/各章の冒頭と末尾・短い第VI/VII/XI〜XVI章全文・語法注・末尾174頁の作品境界を確認。全著者本文の意味の通読や原版全頁の画像校合、翻訳は未実施。"
  "unperformed_checks_ja": "英語本文全体の意味通読、原刊画像全頁の照合、他版全量校合、翻訳・完稿後全文原文対照はいずれも未実施。"
  "note_location_qualification_ja": "無署名語法注は電子版の末尾へ集められている。元抽出のpage_at_block_start=174は電子DOMの先行頁表示として証拠に残すが、標準Locationのprinted_pageへは移さない。"

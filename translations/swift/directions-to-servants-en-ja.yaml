    "line_start": 1151
    "source_sequence": 1582
    "printed_page": "171"
  "translation_ja": "バター作りの骨折り。夏でも、攪乳桶へ煮え湯を入れ、台所の火のすぐそばで、一週間たったクリームを攪拌すること。恋人のためにクリームを取っておく。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

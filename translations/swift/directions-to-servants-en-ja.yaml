    CHAP. VIII.
    Directions to the Chambermaid.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/div[35]/p"
    "line_start": 1042
    "source_sequence": 1373
    "printed_page": "157"
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/div[36]/p"
    "line_start": 1044
    "source_sequence": 1377
    "printed_page": "157"
  "translation_ja": |-
    第八章
    小間使い心得。
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-001"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "THE nature of your employment differs according to the quality, the pride, or the wealth of the lady you serve; and this treatise is to be applied to all sorts of families: so that I find myself under great difficulty to adjust the best business, for which you are hired. In a family where there is a tolerable estate, you differ from the housemaid, and in that view I give my directions. Your particular province is your lady's chamber, where you make the bed, and put things in order; and if you live in the country, you take care of rooms, where ladies lie who come into the house, which brings in all the vales that fall to your share. Your usual lover, as I take it, is the coachman; but, if you are under twenty, and tolerably handsome, perhaps a footman may cast his eyes on you."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[245]"
    "line_start": 1047
    "source_sequence": 1382
    "printed_page": "157"
  "translation_ja": "あなたの仕事の性質は、仕える奥さまの身分や高慢さ、財産によって違ってくる。しかも、この論考はあらゆる家に当てはめるためのものなので、あなたが雇われた仕事を、どれに絞るのがいちばんよいか、私は大いに困っている。そこそこの財産のある家では、あなたは女中とは違うので、そのつもりで教えを授けよう。あなたの特別の持ち場は奥さまの寝室で、寝床を整え、物を片づける。田舎暮らしなら、泊まりに来る婦人方の部屋の世話もするので、あなたの取り分になる心付けは、すべてそこから入ってくる。私の見るところ、普通、あなたの恋人は御者だが、二十歳前で、まずまずの器量なら、従僕が目を向けてくれるかもしれない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-002"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Get your favourite footman to help you in making your lady's bed; and if you serve a young couple, the footman and you, as you are turning up the bed clothes, will make the prettiest observations in the world; which whispered about will be very entertaining to the whole family, and get among the neighbourhood."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[246]"
    "line_start": 1049
    "source_sequence": 1390
    "printed_page": "158"
  "translation_ja": "奥さまの寝床を整えるときは、お気に入りの従僕に手伝ってもらいなさい。若い夫婦に仕えているなら、寝具をめくりながら、あなたと従僕は、この上なく面白いことをいろいろ発見するだろう。それをこっそり言い広めれば、家じゅうの大きな楽しみとなり、近所にも伝わる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-003"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Do not carry down the necessary vessels for the fellows to see, but empty them out of the window, for your lady's credit. It is highly improper for men servants to know, that fine ladies have occasion for such utensils; and do not scour the chamberpot, because the smell is wholesome."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[247]"
    "line_start": 1051
    "source_sequence": 1392
    "printed_page": "158"
  "translation_ja": "用便の器は、男たちに見えるよう下へ運ばず、奥さまの名誉のため、窓から中身を捨てなさい。上品な婦人にも、そのような道具が必要だと、男の奉公人が知るのは、きわめて不適切である。また、便器は磨かないこと。その匂いは健康によいからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-004"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you happen to break any china with the top of the whisk on the mantletree or the cabinet, gather up the fragments, put them together as well as you can, and place them behind the rest, so that when your lady comes to discover them, you may safely say they were broke long ago, before you came to the service. This will save your lady many an hour's vexation."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[248]"
    "line_start": 1053
    "source_sequence": 1394
    "printed_page": "158"
  "translation_ja": "暖炉棚や飾り棚の上にある磁器に、ほうきの先を当てて割ってしまったら、破片を集め、できるだけつなぎ合わせて、ほかの品の後ろに置きなさい。そうすれば、奥さまが見つけたとき、ずっと前、自分が奉公に来る前から割れていたのだと、安心して言える。これで奥さまは、何時間ものいらだちを免れる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-005"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It sometimes happens, that a looking-glass is broken by the same means; while you are looking another way, as you sweep the chamber, the long end of the brush strikes against the glass, and breaks it to shivers. This is the extremest of all misfortunes, and all remedy desperate in appearance, because it is impossible to be concealed. Such a fatal accident once happened in a great family, where I had the honour to be a footman; and I will relate the particulars to show the ingenuity of the poor chambermaid on so sudden and dreadful an emergency, which perhaps may help to sharpen your invention, if your evil star should ever give you the like occasion: the poor girl had broken a large japan glass of great value with a stroke of her brush: she had not considered long, when by a prodigious presence of mind she locked the door, stole into the yard, brought a stone of three pound weight into the chamber, laid it on the hearth just under the looking-glass, then broke a pane in the sash window that looked into the same yard, so shut the door and went about her other affairs. Two hours after the lady goes into the chamber, sees the glass broken, the stone lying under, and a whole pane in the window destroyed; from all which circumstances she concluded, just as the maid could have wished, that some idle straggler in the neighbourhood, or perhaps one of the out servants, had through malice, accident, or carelessness, flung in the stone and done the mischief. Thus far all things went well, and the girl concluded herself out of danger: but it was her ill fortune, that a few hours after in came the parson of the parish, and the lady naturally told him the accident, which you may believe had much discomposed her; but the minister, who happened to understand mathematicks, after examining the situation of the yard, the window, and the chimney, soon convinced the lady, that the stone could never reach the looking-glass without taking three turns in its flight from the hand that threw it; and the maid being proved to have swept the room the same morning, was strictly examined, but constantly denied that she was guilty upon her salvation, offering to take her oath upon the Bible before his reverence, that she was as innocent as the child unborn; yet the poor wench was turned off, which I take to have been hard treatment, considering her ingenuity: however, this may be a direction to you in the like case to contrive a story, that will better hang together. For instance, you might say, that while you were at work with a mop or brush, a flash of lightning came suddenly in at the window, which almost blinded you; that you immediately heard the ringing of broken glass on the hearth; that as soon as you recovered your eyes, you saw the looking-glass all broken to pieces: or you may allege, that observing the glass a little covered with dust, and going very gently to wipe it, you suppose the moisture of the air had dissolved the glue or cement, which made it fall to the ground: or as soon as the mischief is done, you may cut the cords that fastened the glass to the wainscot, and so let it fall flat on the ground; run out in a fright, tell your lady, curse the upholsterer; and declare how narrowly you escaped, that it did not fall upon your head. I offer these expedients from a desire I have to defend the innocent; for innocent you certainly must be, if you did not break the glass on purpose, which I would by no means excuse, except upon great provocations."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[249]"
    "line_start": 1054
    "source_sequence": 1397
    "printed_page": "158"
  "translation_ja": "同じやり方で、鏡を割ることもある。部屋を掃きながらよそを見ていると、ほうきの長い端が鏡に当たり、粉々に砕いてしまうのだ。これは不運の極みであり、隠すことができないため、どんな救済の望みもないように見える。かつて私が従僕として仕える栄誉に浴した、ある大きな家でも、この致命的な事故が起きた。その詳細を語り、あまりに突然で恐ろしい非常時に、哀れな小間使いが示した機転をお見せしよう。不運の星のせいで同じ事態に遭うことがあれば、あなたの工夫を研ぐ助けになるかもしれない。その哀れな娘は、ほうきの一撃で、たいそう高価な、大きな漆塗りの鏡を割ってしまった。だが、考え込んだ時間は長くなかった。驚くべき落ち着きを取り戻すと、戸に鍵をかけ、そっと中庭へ出て、重さ三ポンドの石を部屋に持ち込み、鏡の真下の炉床へ置いた。それから、同じ中庭に向いた上下窓のガラスを一枚割り、戸を閉めて、ほかの用事に取りかかった。二時間後、奥さまが部屋へ行き、鏡が割れ、その下に石があり、窓ガラスが一枚すっかり壊れているのを見た。この事情をすべて合わせて、小間使いの望みどおりに、近所をうろつく暇人か、おそらく外仕事の奉公人の一人が、悪意からか、偶然か、不注意かで、石を投げ込み、この損害を起こしたのだと結論した。ここまではすべてうまくいき、娘ももう危険はないと思った。ところが不幸なことに、数時間後、教区の牧師が訪ねてきて、奥さまは当然ながら、この事故のことを話した。奥さまがひどく気を乱していたことは、想像できるだろう。ところが、その牧師は、たまたま数学を心得ていた。中庭と窓と暖炉の位置を調べると、石を投げた手から鏡に届くまで、空中で三度向きを変えなければならないと、すぐに奥さまを納得させた。そして、同じ朝、小間使いが部屋を掃いたことが明らかになり、厳しく問い詰められた。だが娘は、自分の魂の救いにかけて、罪はないと一貫して否定し、まだ生まれぬ子供と同じく潔白だと、牧師様の前で聖書に手を置いて誓ってもよい、と申し出た。それでも、哀れな娘は解雇された。その機転を考えれば、ひどい扱いだったと私は思う。ともあれ、これは同じ目に遭ったとき、もっと筋の通る話を考えるための教えになるだろう。たとえば、モップかほうきで仕事をしていたら、突然、窓から稲妻が差し込み、ほとんど目がくらんだ、すぐに炉床でガラスの砕ける音がし、目が見えるようになると、鏡が粉々だった、と言えばよい。あるいは、鏡に少しほこりがあるのに気づき、ごくそっと拭こうとしたら、空気の湿りで膠か接着剤が溶けたらしく、床に落ちてしまった、と言ってもよい。また、壊したらすぐに、鏡を壁板につなぎ止めている紐を切り、床へ平らに落として、怯えた様子で駆け出し、奥さまに知らせ、内装屋に悪態をつき、もう少しで頭の上に落ちるところだったと訴えてもよい。こうした工夫を授けるのは、罪のない者を守りたいからである。わざと鏡を割ったのでなければ、あなたに罪がないのは確かだ。わざと割ることは、よほどひどい挑発を受けた場合のほか、私は決して弁護しない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-006"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Oil the tongs, poker, and fireshovel, up to the top, not only to keep them from rusting, but likewise to prevent meddling people from wasting your master's coals with stirring the fire."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[250]"
    "line_start": 1055
    "source_sequence": 1409
    "printed_page": "160"
  "translation_ja": "火ばさみ、火かき棒、灰かきには、持ち手の上端まで油を塗りなさい。錆を防ぐばかりでなく、余計なことをする人々が火をかき回して、主人の石炭を無駄にするのを防ぐためでもある。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-007"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are in haste, sweep the dust into a corner of the room, but leave your brush upon it, that it may not be seen, for that would disgrace you."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[251]"
    "line_start": 1057
    "source_sequence": 1415
    "printed_page": "161"
  "translation_ja": "急いでいるときは、ほこりを部屋の隅へ掃き寄せ、その上にほうきを置いて、見えないようにしなさい。見えれば、あなたの名折れになる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-008"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never wash your hands, or put on a clean apron, till you have made your lady's bed, for fear of rumpling your apron, or fouling your hands again."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[252]"
    "line_start": 1059
    "source_sequence": 1417
    "printed_page": "161"
  "translation_ja": "奥さまの寝床を整えるまでは、決して手を洗わず、清潔な前掛けも着けないこと。前掛けにしわを寄せたり、手をまた汚したりしてはいけないからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-009"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you bar the window-shuts of your lady's bedchamber at nights, leave open the sashes to let in the fresh air, and sweeten the room against morning."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[253]"
    "line_start": 1061
    "source_sequence": 1419
    "printed_page": "161"
  "translation_ja": "晩に奥さまの寝室の鎧戸へかんぬきをかけるときは、上下窓を開けておき、新鮮な空気を入れ、朝までに部屋の空気をきれいにしなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-010"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In the time when you leave the windows open for air, leave books, or something else on the windowseat, that they may get air too."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[254]"
    "line_start": 1063
    "source_sequence": 1421
    "printed_page": "161"
  "translation_ja": "風を通すため窓を開けている間は、窓辺の腰掛けに本などを置き、それにも風を当ててやりなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-011"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you sweep your lady's room, never stay to pick up foul smocks, handkerchiefs, pinners, pincushions, teaspoons, ribbands, slippers, or whatever lies in your way; but sweep all into a corner, and then you may take them up in a lump, and save time."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[255]"
    "line_start": 1065
    "source_sequence": 1423
    "printed_page": "161"
  "translation_ja": "奥さまの部屋を掃くとき、汚れた肌着、ハンカチ、頭巾、針山、茶匙、リボン、室内履き、その他行く手にあるものを拾うために、いちいち立ち止まってはいけない。全部まとめて隅へ掃き寄せてから、一度に拾えば、時間が省ける。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-012"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Making beds in hot weather is a very laborious work, and you will be apt to sweat; therefore, when you find the drops running down from your forehead, wipe them off with a corner of the sheet, that they may not be seen on the bed."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[256]"
    "line_start": 1067
    "source_sequence": 1425
    "printed_page": "161"
  "translation_ja": "暑い日に寝床を整えるのは、とても骨の折れる仕事で、汗が出やすい。だから、額からしずくが流れてきたら、シーツの隅で拭き取り、寝床の上に汗が見えないようにしなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-013"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your lady sends you to wash a china cup, and it happen to fall, bring it up, and swear you did but just touch it with your hand, when it broke into three halves: and here I must inform you, as well as all your fellow-servants, that you ought never to be without an excuse; it does no harm to your master, and it lessens your fault: as in this instance, I do not commend you for breaking the cup; it is certain you did not break it on purpose; and the thing is possible, that it might break in your hand."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[257]"
    "line_start": 1069
    "source_sequence": 1427
    "printed_page": "161"
  "translation_ja": "奥さまに磁器の茶碗を洗うよう言いつけられ、うっかり落としてしまったら、持って上がり、ほんのちょっと手を触れただけで、三つの半分に割れたのだと誓いなさい。ここで、あなたにも、すべての仲間の奉公人にも、教えておかなければならない。言い訳には、決して困ってはいけないということだ。主人には何の害もなく、自分の落ち度は軽くなる。今の例でも、茶碗を割ったことを褒めているのではない。わざと割ったのでないことは確かだし、手の中で割れることも、あり得るのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-014"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "You are sometimes desirous to see a funeral, a quarrel, a man going to be hanged, a wedding, a bawd carted, or the like: as they pass by in the street, you lift up the sash suddenly, there by misfortune it sticks: this was no fault of yours; young women are curious by nature; you have no remedy but to cut the cord, and lay the fault upon the carpenter, unless nobody saw you, and then you are as innocent as any servant in the house."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[258]"
    "line_start": 1071
    "source_sequence": 1433
    "printed_page": "162"
  "translation_ja": "ときには、葬式、喧嘩、絞首刑に向かう男、結婚式、荷車に乗せてさらされる女衒などを、見たくなることもある。それが通りを過ぎるので、急いで上下窓を上げると、不運にも引っかかってしまう。あなたの落ち度ではない。若い女は生まれつき好奇心が強いのだ。紐を切り、大工のせいにするほか、手はない。ただし、誰にも見られなかったなら、あなたは家のほかの奉公人と同じく潔白である。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-015"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Wear your lady's smock when she has thrown it off; it will do you credit, save your own linen, and be not a pin the worse."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[259]"
    "line_start": 1073
    "source_sequence": 1435
    "printed_page": "162"
  "translation_ja": "奥さまが肌着を脱いだら、自分で着なさい。あなたの見栄えはよくなり、自分の肌着は節約でき、その肌着も、ほんの少しも悪くならない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-016"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you put a clean pillowcase on your lady's pillow, be sure to fasten it well with corking pins, that it may not fall off in the night."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[260]"
    "line_start": 1075
    "source_sequence": 1437
    "printed_page": "162"
  "translation_ja": "奥さまの枕に清潔な枕カバーをかけるときは、夜の間に外れないよう、必ず太い留め針でしっかり留めなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-017"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you spread bread and butter for tea, be sure that all the holes in the loaf be left full of butter, to keep the bread moist against dinner; and let the mark of your thumb be seen only upon one end of every slice to show your cleanliness."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[261]"
    "line_start": 1077
    "source_sequence": 1439
    "printed_page": "162"
  "translation_ja": "お茶用のパンにバターを塗るときは、夕食までパンの湿り気が保てるよう、パンの穴はすべて、必ずバターでいっぱいにしておきなさい。そして、清潔さを示すため、親指の跡は、一切れごとに片方の端だけに見えるようにすること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c08-018"
  "section_id": "chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are ordered to open or lock any door, trunk, or cabinet, and miss the proper key, or cannot distinguish it in the bunch; try the first key that you can thrust in, and turn it with all your strength, till you open the lock, or break the key; for your lady will reckon you a fool to come back and do nothing."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[262]"
    "line_start": 1079
    "source_sequence": 1441
    "printed_page": "162"
  "translation_ja": "戸や長持ちや飾り棚を開けたり閉めたりするよう命じられ、合う鍵が見つからないか、鍵束の中で見分けられないときは、差し込める最初の鍵を試し、錠が開くか鍵が折れるまで、力いっぱい回しなさい。何もせず戻れば、奥さまに馬鹿だと思われるからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"

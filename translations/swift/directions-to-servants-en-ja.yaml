- "id": "dts-c01-001"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "IN my directions to servants, I find from my long observation, that you butlers are the principal persons concerned."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[48]"
    "line_start": 628
    "source_sequence": 640
    "printed_page": "112"
  "translation_ja": "奉公人に心得を授けるに当たって、長年観察して分かったのは、執事の諸君こそ、いちばん深いかかわりのある人々だということだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-002"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Your business being of the greatest variety, and requiring the greatest exactness, I shall, as well as I can recollect, run through the several branches of your office, and order my instructions accordingly."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[49]"
    "line_start": 630
    "source_sequence": 644
    "printed_page": "112"
  "translation_ja": "あなた方の仕事は最も多岐にわたり、最も正確さを求められるものなので、思い出せる限り、職務のさまざまな部門を一つずつ取り上げ、それに合わせて指南することにしよう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-003"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In waiting at the sideboard, take all possible care to save your own trouble, and your master's drinking-glasses: therefore, first, since those who dine at the same table are supposed to be friends, let them all drink out of the same glass without washing, which will save you much pains, as well as the hazard of breaking them. Give no person any liquor until he has called for it thrice at least, by which means, some, out of modesty, and others, out of forgetfulness, will call the seldomer, and thus your master's liquor be saved."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[50]"
    "line_start": 632
    "source_sequence": 650
    "printed_page": "113"
  "translation_ja": "配膳台で給仕するときは、自分の手間を省き、主人のグラスを大切にするため、できる限り気を配りなさい。まず、同じ食卓に着く者同士は友人ということになっているのだから、みんなに同じグラスで飲ませ、洗わないこと。それで大いに手間が省け、割る危険もなくなる。酒は、少なくとも三度頼まれるまでは誰にも出さないこと。そうすれば、遠慮から、あるいは忘れてしまって、頼む回数を減らす人が出るので、主人の酒が節約できる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-004"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If any one desires a glass of bottled ale, first shake the bottle, to see whether any thing be in it; then taste it, to see what liquor it is, that you may not be mistaken; and lastly, wipe the mouth of the bottle with the palm of your hand, to show your cleanliness."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[51]"
    "line_start": 634
    "source_sequence": 652
    "printed_page": "113"
  "translation_ja": "瓶詰めのエールを一杯欲しいと言われたら、まず瓶を振り、中身があるか確かめなさい。次に、取り違えないよう、どんな酒か味見する。そして最後に、清潔好きなところを見せるため、瓶の口を手のひらで拭くこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-005"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Be more careful to have the cork in the belly of the bottle than in the mouth; and if the cork be musty, or white friars in your liquor, your master will save the more."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[52]"
    "line_start": 636
    "source_sequence": 654
    "printed_page": "113"
  "translation_ja": "コルクは瓶の口よりも、瓶の腹の中にあるように気を配りなさい。そしてコルクがかび臭かったり、酒に白い浮きかすがあったりすれば、主人はいっそう節約できる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-006"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If an humble companion, a chaplain, a tutor, or a dependent cousin, happen to be at table, whom you find to be little regarded by the master, and the company (which nobody is readier to discover and observe than we servants) it must be the business of you and the footman, to follow the example of your betters, by treating him many degrees worse than any of the rest; and you cannot please your master better, or at least your lady."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[53]"
    "line_start": 638
    "source_sequence": 656
    "printed_page": "113"
  "translation_ja": "控えめな話し相手、礼拝付き牧師、家庭教師、あるいは居候のいとこが食卓にいて、主人や客たちに軽く扱われていると分かったら――そんなことを見抜いて気にかける速さでは、われわれ奉公人にかなう者はいない――あなたと従僕は、目上の人々に倣い、ほかの誰よりも何段もひどくその人を扱うよう努めなければならない。これほど主人を、少なくとも奥さまを喜ばせることはない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-007"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If any one calls for small beer toward the end of dinner, do not give yourself the pains of going down to the cellar, but gather the droppings and leavings out of the several cups and glasses and salvers into one; but turn your back to the company for fear of being observed. On the contrary, when any one calls for ale toward the end of dinner, fill the largest tankard-cup topful, by which you will have the greatest part left to oblige your fellow servants, without the sin of stealing from your master."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[54]"
    "line_start": 639
    "source_sequence": 659
    "printed_page": "113"
  "translation_ja": "食事の終わりごろに薄ビールを頼まれたら、わざわざ地下貯蔵室まで下りず、あちこちの杯やグラスや盆に残った雫や飲み残しを一つに集めなさい。ただし、見つからないよう、客たちに背を向けること。逆に、食事の終わりごろエールを頼まれたら、いちばん大きなジョッキになみなみと注ぎなさい。そうすれば大半が残って、主人の物を盗む罪を犯さずに、仲間の奉公人たちに恩を売ることができる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-008"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is likewise a perquisite full as honest, by which you have a chance of getting every day the best part of a bottle of wine for yourself; for, you are to suppose, that gentlefolks will not care for the remainder of a bottle; therefore always set a fresh one before them after dinner, although there has not been above a glass drunk out of the other."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[55]"
    "line_start": 641
    "source_sequence": 665
    "printed_page": "114"
  "translation_ja": "同じくらい正直な役得が、もう一つある。毎日、ワインを瓶の大半ほど自分のために手に入れる見込みのある方法だ。上流の方々は瓶の残りを好まないものだと考え、食後には必ず新しい一本を出しなさい。前の瓶から一杯しか飲まれていなくても、そうすること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-009"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Take special care that your bottles be not musty before you fill them; in order to which, blow strongly into the mouth of every bottle; and then if you smell nothing but your own breath, immediately fill it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[56]"
    "line_start": 643
    "source_sequence": 667
    "printed_page": "114"
  "translation_ja": "瓶に酒を詰める前には、かび臭くないか、特によく気をつけなさい。そのためには、瓶の口から一本ずつ強く息を吹き込み、自分の息のほかに何も臭わなければ、すぐに詰めること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-010"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are sent down in haste to draw any drink, and find it will not run, do not be at the trouble of opening a vent, but blow strongly into the fauset, and you will find it immediately pour into your mouth; or take out the vent, but do not stay to put it in again, for fear your master should want you."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[57]"
    "line_start": 645
    "source_sequence": 669
    "printed_page": "114"
  "translation_ja": "急いで酒をくんでくるよう下へやられたのに、酒が出てこなかったら、空気穴を開ける手間などかけず、注ぎ口に強く息を吹き込みなさい。するとすぐ口の中に注がれてくる。あるいは空気穴の栓を抜いてもよいが、主人があなたを必要とするかもしれないから、栓を戻すためにぐずぐずしないこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-011"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are curious to taste some of your master's choice bottles, empty as many of them just below the neck as will make the quantity you want; but then take care to fill them up again with clean water, that you may not lessen your master's liquor."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[58]"
    "line_start": 647
    "source_sequence": 671
    "printed_page": "114"
  "translation_ja": "主人の取っておきの酒を味見したくなったら、必要な量になるだけ何本かの瓶から、液面が首のすぐ下になるまで抜きなさい。ただし、主人の酒を減らさないよう、あとは必ずきれいな水で満たしておくこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-012"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is an excellent invention found out of late years in the management of ale and small beer at the sideboard: for instance, a gentleman calls for a glass of ale and drinks but half; another calls for small beer: you immediately turn out the remainder of the ale into the tankard, and fill the glass with small beer; and so backward and forward, as long as dinner lasts, by which you answer three ends: First, you save yourself the trouble of washing, and consequently the danger of breaking your glasses: Secondly, you are sure not to be mistaken in giving gentlemen the liquor they call for: And lastly, by this method you are certain that nothing is lost."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[59]"
    "line_start": 648
    "source_sequence": 674
    "printed_page": "114"
  "translation_ja": "近年、配膳台でエールと薄ビールを扱う、実に優れた工夫が見つかった。たとえば、ある紳士がエールを一杯頼み、半分しか飲まず、別の人が薄ビールを頼む。そこでただちに、エールの残りをジョッキにあけ、そのグラスに薄ビールを注ぐ。食事の間じゅう、これをあちらへこちらへと繰り返すのだ。これによって三つの目的が果たせる。第一に、洗う手間を省き、その結果グラスを割る危険も省ける。第二に、紳士方に頼まれた酒を出す際、確実に取り違えずに済む。そして最後に、この方法なら何一つ無駄にならないことが確かだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-013"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Because butlers are apt to forget to bring up their ale and beer time enough, be sure you remember to have up yours two hours before dinner; and place them in the sunny part of the room, to let people see that you have not been negligent."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[60]"
    "line_start": 650
    "source_sequence": 680
    "printed_page": "115"
  "translation_ja": "執事は、エールやビールを早めに上へ運ぶのを忘れがちなものだから、食事の二時間前には忘れずに運んでおきなさい。そして、手抜かりがないと人々に分かるよう、部屋の日の当たる場所に置くこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-014"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Some butlers have a way of decanting (as they call it) bottled ale, by which they lose a good part of the bottom; let your method be to turn the bottle directly upside down, which will make the liquor appear double the quantity: by this means, you will be sure not to lose one drop, and the froth will conceal the muddiness."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[61]"
    "line_start": 652
    "source_sequence": 682
    "printed_page": "115"
  "translation_ja": "瓶詰めのエールを、いわゆるデカントする執事もいるが、それでは底のほうをかなり捨ててしまう。あなたは、瓶をまっすぐ逆さまにして注ぐことにしなさい。そうすれば酒の量は倍に見える。この方法なら確実に一滴も失わず、濁りは泡が隠してくれる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-015"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Clean your plate, wipe your knives, and rub the dirty tables, with the napkins and tablecloths used that day; for it is but one washing, and besides, it will save you wearing out the coarse rubbers; and in reward of such good husbandry, my judgment is, that you may lawfully make use of the finest damask napkins for nightcaps for yourself."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[62]"
    "line_start": 654
    "source_sequence": 684
    "printed_page": "115"
  "translation_ja": "銀食器を磨き、ナイフを拭き、汚れたテーブルをこするには、その日使ったナプキンやテーブルクロスを用いなさい。洗濯は一度で済むし、粗い布巾をすり減らさずにも済む。これほどの倹約に対する褒美として、いちばん上等なダマスク織のナプキンを、自分の寝帽子に使っても差し支えない、というのが私の判断だ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-016"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you clean your plate, leave the whiting plainly to be seen in all the chinks, for fear your lady should not believe you had cleaned it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[63]"
    "line_start": 655
    "source_sequence": 687
    "printed_page": "115"
  "translation_ja": "銀食器を磨いたら、奥さまに磨いたと信じてもらえないと困るので、隙間という隙間に白亜の磨き粉を、はっきり見えるよう残しておきなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-017"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is nothing wherein the skill of a butler more appears, than in the management of candles, whereof although some part may fall to the share of the other servants, yet you being the principal person concerned, I shall direct my instructions upon this article to you only, leaving to your fellow-servants to apply them upon occasion."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[64]"
    "line_start": 657
    "source_sequence": 693
    "printed_page": "116"
  "translation_ja": "執事の腕前が最もよく現れるのは、ろうそくの扱いである。この仕事は一部、ほかの奉公人の持ち分になることもあるが、主にかかわるのはあなただから、この件の指南はあなただけに向けて述べ、仲間の奉公人には、折に触れて応用してもらうことにしよう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-018"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "First, to avoid burning daylight, and to save your master's candles, never bring them up till half an hour after it be dark, although they are called for ever so often."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[65]"
    "line_start": 659
    "source_sequence": 695
    "printed_page": "116"
  "translation_ja": "まず、日のあるうちから灯をともす無駄を避け、主人のろうそくを節約するため、何度催促されても、暗くなって半時間たつまでは持って上がらないこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-019"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let your sockets be full of grease to the brim, with the old snuff at the top, and then stick on your fresh candles. It is true, this may endanger their falling, but the candles will appear so much the longer and handsomer before company. At other times, for variety, put your candles loose in the sockets, to show they are clean to the bottom."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[66]"
    "line_start": 661
    "source_sequence": 697
    "printed_page": "116"
  "translation_ja": "燭台の受け口には縁まで脂を詰め、上に古い燃えさしの芯を載せて、その上に新しいろうそくを立てなさい。確かに倒れる危険はあるが、お客の前でろうそくがそれだけ長く、立派に見える。ときには趣向を変えて、受け口の底まできれいになっていると示すため、ろうそくをぐらぐらのまま差しておくこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-020"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When your candle is too big for the socket, melt it to the right size in the fire; and to hide the smoke, wrap it in paper half way up."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[67]"
    "line_start": 663
    "source_sequence": 699
    "printed_page": "116"
  "translation_ja": "ろうそくが受け口には太すぎるときは、火で溶かして合う太さにしなさい。そして煤の跡を隠すため、半分の高さまで紙で包んでおくこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-021"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "You cannot but observe, of late years, the great extravagance among the gentry upon the article of candles, which a good butler ought by all means to discourage, both to save his own pains, and his master's money: this may be contrived several ways; especially when you are ordered to put candles into the sconces."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[68]"
    "line_start": 665
    "source_sequence": 701
    "printed_page": "116"
  "translation_ja": "近年、上流の方々がろうそくにひどく浪費していることに、気づかずにはいられまい。よい執事なら、自分の手間と主人の金を省くため、何としてもこれをやめさせるべきである。これにはいくつも工夫のしようがあり、壁燭台にろうそくを立てるよう命じられたときは、とりわけそうだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-022"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sconces are great wasters of candles; and you, who are always to consider the advantage of your master, should do your utmost to discourage them: therefore your business must be to press the candle with both your hands into the socket, so as to make it lean in such a manner, that the grease may drop all upon the floor, if some lady's head dress or gentleman's periwig be not ready to intercept it: you may likewise stick the candle so loose, that it will fall upon the glass of the sconce, and break it into shatters; this will save your master many a fair penny in the year, both in candles and to the glassman, and yourself much labour; for the sconces spoiled cannot be used."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[69]"
    "line_start": 667
    "source_sequence": 703
    "printed_page": "116"
  "translation_ja": "壁燭台はろうそくを大いに浪費する。いつでも主人の利益を考えなければならないあなたは、これを使わせないよう、全力を尽くすべきだ。そこで、両手でろうそくを受け口に押し込み、脂が残らず床に落ちるよう、傾けて立てることを務めとしなさい。もっとも、御婦人の髪飾りや紳士のかつらが、途中で受け止めてくれなければの話だが。また、ろうそくをぐらぐらに立てておき、壁燭台の鏡に倒れかかって、粉々に割るようにしてもよい。そうすれば主人は、一年にろうそく代とガラス屋への支払いをかなり節約でき、あなた自身もずいぶん仕事が減る。壊れた壁燭台は使えないのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-023"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never let the candles burn too low, but give them as a lawful perquisite to your friend the cook, to increase her kitchenstuff; or if this be not allowed in your house, give them in charity to the poor neighbours, who often run on your errands."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[70]"
    "line_start": 669
    "source_sequence": 709
    "printed_page": "117"
  "translation_ja": "ろうそくは決して短くなりすぎるまで燃やさず、正当な役得として、仲のよい料理人に渡し、彼女の集める台所の屑脂を増やしてやりなさい。あるいは、それがあなたの家で認められていなければ、よく使い走りをしてくれる近所の貧しい人たちに、施してやること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-024"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you cut bread for a toast, do not stand idly watching it, but lay it on the coals, and mind your other business: then come back, and if you find it toasted quite through, scrape off the burnt side, and serve it up."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[71]"
    "line_start": 671
    "source_sequence": 711
    "printed_page": "117"
  "translation_ja": "トーストにするパンを切ったら、ぼんやり見張ってなどいず、炭の上に載せ、ほかの仕事をしなさい。それから戻ってきて、中まで十分焼けていたら、焦げた面を削り落とし、食卓へ出すこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-025"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you dress up your sideboard, set the best glasses as near the edge of the table as you can; by which means they will cast a double lustre, and make a much finer figure; and the consequence can be at most, but the breaking half a dozen, which is a trifle in your master's pocket."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[72]"
    "line_start": 673
    "source_sequence": 713
    "printed_page": "117"
  "translation_ja": "配膳台を飾り立てるときは、いちばん上等なグラスを、できるだけ台の縁近くに置きなさい。そうすれば輝きが倍になり、はるかに見栄えがよくなる。その結果といったところで、せいぜい六個ほど割るだけのことで、主人の懐には何でもない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-026"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Wash the glasses with your own water, to save your master's salt."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[73]"
    "line_start": 675
    "source_sequence": 715
    "printed_page": "117"
  "translation_ja": "主人の塩を節約するため、グラスは自分の小水で洗いなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-027"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When any salt is spilt on the table, do not let it be lost, but when dinner is done, fold up the tablecloth with the salt in it, then shake the salt out into the saltcellar to serve next day: but the shortest and surest way is, when you remove the cloth, to wrap the knives, forks, spoons, saltcellars, broken bread, and scraps of meat all together, in the tablecloth; by which you will be sure to lose nothing, unless you think it better to shake them out of the window among the beggars, that they may with more convenience eat the scraps."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[74]"
    "line_start": 677
    "source_sequence": 717
    "printed_page": "117"
  "translation_ja": "食卓に塩がこぼれたら、無駄にせず、食事が済んでから塩を入れたままテーブルクロスを畳み、それから塩入れの中へ振り落として、翌日また使いなさい。ただし、いちばん手早く確実な方法は、クロスを片づけるとき、ナイフ、フォーク、匙、塩入れ、ちぎれたパン、肉の食べ残しを、全部一緒にクロスで包むことだ。それなら確実に何一つなくさずに済む。もっとも、乞食たちが食べ残しをもっと食べやすいように、窓から彼らのところへ全部振り落とすほうがよいと思うなら、別だが。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-028"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Leave the dregs of wine, ale, and other liquors in the bottles: to rince them is but loss of time, since all will be done at once in a general washing; and you will have a better excuse for breaking them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[75]"
    "line_start": 679
    "source_sequence": 723
    "printed_page": "118"
  "translation_ja": "ワイン、エール、その他の酒の澱は、瓶の中に残しておきなさい。まとめて洗うときに一度に済むのだから、ゆすぐのは時間の無駄だし、瓶を割ったときの言い訳も立ちやすくなる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-029"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your master has many musty, or very foul and crusted bottles, I advise you, in point of conscience, that those may be the first you truck at the next alehouse for ale or brandy."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[76]"
    "line_start": 681
    "source_sequence": 727
    "printed_page": "118"
  "translation_ja": "主人の瓶に、かび臭いものや、ひどく汚れて垢のこびりついたものがたくさんあったら、良心に従って勧めるが、近くのエール酒場でエールやブランデーと交換する際は、それから先に出すことだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-030"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When a message is sent to your master, be kind to your brother-servant who brings it; give him the best liquor in your keeping, for your master's honour; and at the first opportunity he will do the same to you."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[77]"
    "line_start": 683
    "source_sequence": 729
    "printed_page": "118"
  "translation_ja": "主人への伝言が届いたら、それを届けた同業の奉公人に親切にしなさい。主人の名誉のため、管理している中でいちばんよい酒を振る舞うこと。そうすれば、次の機会には、向こうも同じことをしてくれる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-031"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "After supper, if it be dark, carry your plate and china together in the same basket, to save candlelight, for you know your pantry well enough to put them up in the dark."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[78]"
    "line_start": 685
    "source_sequence": 731
    "printed_page": "118"
  "translation_ja": "夕食のあと、暗くなっていたら、灯りを節約するため、銀食器と陶磁器を同じ籠に一緒に入れて運びなさい。自分の食器室はよく心得ているのだから、暗がりでもしまえるはずだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-032"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When company is expected at dinner, or in the evenings, be sure to be abroad, that nothing may be got which is under your key; by which your master will save his liquor, and not wear out his plate."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[79]"
    "line_start": 687
    "source_sequence": 733
    "printed_page": "118"
  "translation_ja": "昼食や夕方に客が来る予定があれば、必ず外出して、あなたが鍵を預かる物は何も取り出せないようにしなさい。そうすれば主人は酒を節約でき、銀食器もすり減らさずに済む。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-033"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I come now to a most important part of your economy, the bottling of a hogshead of wine, wherein I recommend three virtues, cleanliness, frugality, and brotherly love. Let your corks be of the longest kind you can get; which will save some wine in the neck of every bottle: as to your bottles, choose the smallest you can find, which will increase the number of dozens, and please your master; for a bottle of wine is always a bottle of wine whether it hold more or less; and if your master has his proper number of dozens, he cannot complain."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[80]"
    "line_start": 689
    "source_sequence": 735
    "printed_page": "118"
  "translation_ja": "さて、あなたの家計管理のうち、きわめて大切な仕事、ホッグズヘッド樽のワインを瓶に詰めることに移ろう。ここでは、清潔、倹約、兄弟愛という三つの美徳を勧めたい。コルクは、手に入るいちばん長いものを使いなさい。それで瓶一本ごとに、首の部分のワインがいくらか節約できる。瓶については、見つかる限り小さなものを選ぶこと。そうすれば何ダースという数が増え、主人も喜ぶ。中身が多かろうと少なかろうと、ワイン一本は常にワイン一本であり、主人がしかるべきダース数を受け取れば、文句は言えない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-034"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Every bottle must be first rinsed with wine, for fear of any moisture left in the washing: some, out of a mistaken thrift, will rinse a dozen bottles with the same wine; but I would advise you, for more caution, to change the wine at every second bottle; a gill may be enough. Have bottles ready by to save it; and it will be a good perquisite either to sell, or drink with the cook."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[81]"
    "line_start": 691
    "source_sequence": 741
    "printed_page": "119"
  "translation_ja": "洗ったあとの水分が残っているといけないので、どの瓶も、まずワインでゆすがなければならない。倹約をはき違えて、同じワインで一ダースの瓶をゆすぐ者もいるが、私は、いっそう慎重を期して、二本ごとにワインを替えるよう勧める。一ジルもあれば足りるだろう。それを取っておく瓶をそばに用意しておきなさい。売るにせよ、料理人と飲むにせよ、よい役得になる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-035"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never draw your hogshead too low; nor tilt it for fear of disturbing your liquor. When it begins to run slow, and before the wine grows cloudy, shake the hogshead, and carry a glass of it to your master; who will praise you for your discretion, and give you all the rest as a perquisite to your place: you may tilt the hogshead the next day, and in a fortnight get a dozen or two of good clear wine to dispose of as you please."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[82]"
    "line_start": 693
    "source_sequence": 743
    "printed_page": "119"
  "translation_ja": "ホッグズヘッド樽は底近くまでくみ出さず、酒をかき乱すといけないので、傾けてもいけない。出が遅くなり始めたら、ワインが濁りだす前に樽を揺すり、一杯主人に持っていきなさい。主人はあなたの分別を褒め、残りは全部、その職の役得としてくれるだろう。翌日、樽を傾けておけば、二週間もすれば、好きに処分できる、よく澄んだワインが一、二ダース手に入る。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-036"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In bottling wine, fill your mouth full of corks, together with a large plug of tobacco, which will give to the wine the true taste of the weed, so delightful to all good judges in drinking."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[83]"
    "line_start": 695
    "source_sequence": 745
    "printed_page": "119"
  "translation_ja": "ワインを瓶に詰めるときは、大きな噛み煙草の塊と一緒に、口いっぱいにコルクを詰めなさい。そうすればワインに、酒の分かる人なら誰もが大喜びする、本物の煙草の味がつく。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-037"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are ordered to decant a suspicious bottle, if a pint be out, give your hand a dextrous shake, and show it in a glass, that it begins to be muddy."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[84]"
    "line_start": 697
    "source_sequence": 747
    "printed_page": "119"
  "translation_ja": "怪しい瓶のワインを別の容器に移すよう言われたら、一パイントほど出たところで、手を器用に一振りし、一杯分をグラスで見せて、濁り始めたと示しなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-038"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When a hogshead of wine or any other liquor is to be bottled off, wash your bottles immediately before you begin; but, be sure not to drain them, by which good management your master will save some gallons in every hogshead."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[85]"
    "line_start": 699
    "source_sequence": 749
    "printed_page": "119"
  "translation_ja": "ホッグズヘッド樽のワインやほかの酒を瓶に詰めるときは、始める直前に瓶を洗い、必ず水を切らずにおきなさい。この上手なやりくりで、主人は一樽ごとに何ガロンか節約できる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-039"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This is the time, that in honour to your master you ought to show your kindness to your fellow-servants, and especially to the cook; for what signifies a few flagons out of a whole hogshead? But make them be drunk in your presence, for fear they should be given to other folks, and so your master be wronged: but advise them, if they get drunk, to go to bed, and leave word they are sick; which last caution I would have all the servants observe, both male and female."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[86]"
    "line_start": 701
    "source_sequence": 755
    "printed_page": "120"
  "translation_ja": "主人の名誉のために、仲間の奉公人、とりわけ料理人への親切を示すべきなのは、このときだ。ホッグズヘッド樽一つから、酒壺に数杯くらい、何だというのか。ただし、ほかの連中にやって主人を損なわせるといけないから、必ずあなたの目の前で飲ませること。そして酔ったら、病気だと言い残して寝に行くよう勧めなさい。この最後の用心は、男女を問わず、すべての奉公人に守ってもらいたい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-040"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your master finds the hogshead to fall short of his expectation, what is plainer, than that the vessel leaked: that the wine-cooper had not filled it in proper time: that the merchant cheated him with a hogshead below the common measure?"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[87]"
    "line_start": 703
    "source_sequence": 757
    "printed_page": "120"
  "translation_ja": "ホッグズヘッド樽の中身が思ったより少ないと主人が気づいたら、樽が漏れていた、ワイン樽の職人がちょうどよい時に満たしておかなかった、商人が通常の容量より小さい樽でだました、といったことほど明白な説明が、ほかにあるだろうか。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-041"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are to get water on for tea after dinner (which in many families is part of your office) to save firing, and to make more haste, pour it into the teakettle from the pot where cabbage or fish have been boiling, which will make it much wholesomer, by curing the acid and corroding quality of the tea."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[88]"
    "line_start": 705
    "source_sequence": 759
    "printed_page": "120"
  "translation_ja": "食後のお茶に湯を沸かすときは――多くの家庭では、これもあなたの仕事の一部だ――燃料を節約し、早く済ませるため、キャベツや魚をゆでていた鍋から、やかんへ湯を移しなさい。お茶の酸性で胃を荒らす性質が和らぎ、ずっと健康によいものになる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-042"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Be saving of your candles, and let those in the sconces of the hall, the stairs, and in the lantern, burn down into the sockets, until they go out of themselves; for which your master and lady will commend your thriftness, as soon as they shall smell the snuff."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[89]"
    "line_start": 707
    "source_sequence": 761
    "printed_page": "120"
  "translation_ja": "ろうそくは大切に使い、広間や階段の壁燭台、また角灯にあるものは、受け口の中まで燃やし、自分で消えるまで放っておきなさい。主人も奥さまも、燃えさしの芯の臭いがした途端に、あなたの倹約ぶりを褒めてくださるだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-043"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If a gentleman leaves a snuffbox or picktoothcase on the table after dinner, and goes away, look upon it as part of your vails, for so it is allowed by servants, and you do no wrong to your master or lady."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[90]"
    "line_start": 709
    "source_sequence": 763
    "printed_page": "120"
  "translation_ja": "紳士が食後、嗅ぎ煙草入れや爪楊枝入れをテーブルに忘れて帰ったら、自分への心付けの一部と見なしなさい。奉公人の間ではそういうことになっているし、主人にも奥さまにも、損はさせない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-044"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you serve a country 'squire, when gentlemen and ladies come to dine at your house, never fail to make their servants drunk, and especially the coachman, for the honour of your master: to which in all your actions you must have a special regard, as being the best judge: for the honour of every family is deposited in the hands of the cook, the butler, and the groom, as I shall hereafter demonstrate."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[91]"
    "line_start": 711
    "source_sequence": 769
    "printed_page": "121"
  "translation_ja": "地方の郷紳に仕えていて、紳士淑女が食事に来られたら、主人の名誉のため、必ずその奉公人たちを、とりわけ御者を、酔いつぶしなさい。主人の名誉は、あなたが何をするにも特に心にかけなければならない。あなたがそれをいちばんよく判断できるのだから。どこの家の名誉も、料理人、執事、馬丁の手に託されている。そのことは、あとで論証しよう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-045"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Snuff the candles at supper as they stand on the table, which is much the securest way: because, if the burning snuff happens to get out of the snuffers, you have a chance that it may fall into a dish of soup, sackposset, rice-milk, or the like, where it will be immediately extinguished with very little stink."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[92]"
    "line_start": 713
    "source_sequence": 771
    "printed_page": "121"
  "translation_ja": "夕食時には、ろうそくをテーブルに立てたまま、芯を切りなさい。それが、はるかに安全な方法だ。燃えている芯が芯切りばさみからこぼれても、スープやサック酒のポセット、米入りミルクなどの器に落ちれば、たちまち消えて、臭いもほとんどしない見込みがある。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-046"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you have snuffed the candle, always leave the snuffers open, for the snuff will of itself burn away to ashes, and cannot fall out and dirty the table when you snuff the candles again."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[93]"
    "line_start": 715
    "source_sequence": 773
    "printed_page": "121"
  "translation_ja": "ろうそくの芯を切ったら、芯切りばさみは必ず開いたままにしておきなさい。そうすれば芯はひとりでに燃えて灰になり、次に芯を切るとき、こぼれてテーブルを汚すこともない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-047"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "That the salt may lie smooth in the saltcellar, press it down with your moist palm."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[94]"
    "line_start": 717
    "source_sequence": 775
    "printed_page": "121"
  "translation_ja": "塩入れの塩を平らにならすには、湿った手のひらで押さえつけなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-048"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When a gentleman is going away after dining with your master, be sure to stand full in view, and follow him to the door, and as you have opportunity, look full in his face, perhaps it may bring you a shilling; but if the gentleman has lain there a night, get the cook, the housemaid, the stablemen, the scullion, and gardiner, to accompany you, and to stand in his way to the hall in a line on each side of him: if the gentleman performs handsomely, it will do him honour, and cost your master nothing."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[95]"
    "line_start": 719
    "source_sequence": 777
    "printed_page": "121"
  "translation_ja": "主人と食事をした紳士が帰るときは、必ずよく目につくところに立ち、戸口までついていき、機会を見て、その顔を正面からじっと見なさい。一シリング手に入るかもしれない。ただし、その紳士が一晩泊まったのなら、料理人、女中、馬小屋の男たち、皿洗い、庭師にも一緒に来てもらい、広間へ向かう彼の行く手で、その両側に一列ずつ並ぶこと。紳士が気前よく振る舞えば、その人の名誉になり、主人の懐は少しも痛まない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-049"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "You need not wipe your knife to cut bread for the table, because in cutting a slice or two it will wipe itself."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[96]"
    "line_start": 721
    "source_sequence": 779
    "printed_page": "121"
  "translation_ja": "食卓に出すパンを切るのに、ナイフを拭く必要はない。一切れか二切れ切れば、ひとりでに拭き清められる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-050"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Put your finger into every bottle to feel whether it be full, which is the surest way, for feeling has no fellow."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[97]"
    "line_start": 722
    "source_sequence": 782
    "printed_page": "121"
  "translation_ja": "どの瓶にも指を入れて、いっぱいかどうか確かめなさい。それが最も確実な方法だ。手触りにかなうものはないのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-051"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you go down to the cellar to draw ale or small beer, take care to observe directly the following method: hold the vessel between the finger and thumb of your right hand, with the palm upwards; then hold the candle between your fingers, but a little leaning toward the mouth of the vessel; then take out the spigot with your left hand, and clap the point of it in your mouth, and keep your left hand to watch accidents; when the vessel is full, withdraw the spigot from your mouth, well wetted with spittle, which being of a slimy consistence will make it stick faster in the fauset: if any tallow drops into the vessel you may easily (if you think of it) remove it with a spoon."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[98]"
    "line_start": 724
    "source_sequence": 788
    "printed_page": "122"
  "translation_ja": "エールや薄ビールをくみに地下貯蔵室へ下りたら、次の方法をそっくり守るようにしなさい。右手は手のひらを上に向け、人差し指と親指で器を持つ。そして、ろうそくを指の間に挟み、ただし少し器の口のほうへ傾けておく。それから左手で栓を抜き、その先を口にくわえ、左手は不意の出来事に備えて空けておく。器がいっぱいになったら、唾液でよく湿った栓を口から抜く。唾液にはぬめりがあるので、注ぎ口にいっそうしっかりはまる。獣脂が器に垂れ落ちたら、気がつけばの話だが、匙で簡単に取り除ける。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-052"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Always lock up a cat in the closet where you keep your china plates, for fear the mice may steal in and break them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[99]"
    "line_start": 726
    "source_sequence": 790
    "printed_page": "122"
  "translation_ja": "鼠が忍び込んで磁器の皿を割ると困るので、皿をしまう戸棚には、いつでも猫を一匹閉じ込めておきなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-053"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A good butler always breaks off the point of his bottlescrew in two days, by trying which is hardest, the point of the screw, or the neck of the bottle: in this case, to supply the want of a screw, after the stump has torn the cork in pieces, make use of a silver fork, and when the scraps of the cork are almost drawn out, flirt the mouth of the bottle into the cistern three or four times, until you quite clear it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[100]"
    "line_start": 728
    "source_sequence": 792
    "printed_page": "122"
  "translation_ja": "よい執事は、栓抜きのねじの先と瓶の首のどちらが硬いか試して、必ず二日で栓抜きの先を折ってしまう。こうなったら、折れ残ったねじでコルクをずたずたにしたあと、栓抜きの代わりに銀のフォークを使いなさい。そしてコルクのくずがだいたい引き出せたら、瓶の口を流しに向けて三、四度勢いよく振り、すっかり取り除くこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-054"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If a gentleman dines often with your master, and gives you nothing when he goes away, you may use several methods to show him some marks of your displeasure, and quicken his memory: if he calls for bread or drink, you may pretend not to hear, or send it to another who called after him; if he asks for wine, let him stay awhile, and then send him small beer; give him always foul glasses; send him a spoon when he wants a knife; wink at the footman to leave him without a plate: by these, and the like expedients, you may probably be a better man by half a crown before he leaves the house, provided you watch an opportunity of standing by, when he is going."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[101]"
    "line_start": 730
    "source_sequence": 794
    "printed_page": "122"
  "translation_ja": "主人としょっちゅう食事をするのに、帰りがけに何もくれない紳士には、不満のしるしを示し、物覚えをよくしてやる方法が、いくつもある。パンや飲み物を頼まれたら、聞こえないふりをするか、その人よりあとに頼んだ別の客に出してやってよい。ワインを頼まれたら、しばらく待たせてから、薄ビールを出す。グラスはいつも汚れたものを渡す。ナイフを欲しがったら、匙を持っていく。従僕に目配せして、その人に皿を出さないようにする。こうした手立てや、その類の工夫を使えば、帰るときにそばに立つ機会を逃しさえしなければ、その人が家を出るまでに、半クラウンほど裕福になれるだろう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-055"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your lady loves play, your fortune is fixed for ever; moderate gaming will be a perquisite of ten shillings a week; and in such a family I would rather choose to be butler than chaplain, or even rather than be steward; it is all ready money, and got without labour, unless your lady happens to be one of those, who either obliges you to find wax candies, or forces you to divide it with some favourite servants; but, at worst, the old cards are your own; and if the gamesters play deep or grow peevish, they will change the cards so often, that the old ones will be a considerable advantage by selling them to coffeehouses, or families who love play, but cannot afford better than cards at second hand: when you attend at the service, be sure to leave new packs within the reach of the gamesters; which, those who have ill luck will readily take to change their fortune; and now and then an old pack mingled with the rest will easily pass. Be sure to be very officious on play nights, and ready with your candles to light out your company, and have salvers of wine at hand to give them when they call; but manage so with the cook, that there be no supper, because it will be so much saved in your master's family; and because a supper will considerably lessen your gains."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[102]"
    "line_start": 732
    "source_sequence": 800
    "printed_page": "123"
  "translation_ja": "奥さまが賭け事好きなら、あなたの身代は一生安泰だ。ほどほどの賭け事でも、一週十シリングの役得になる。そういう家なら、私は礼拝付き牧師より、いや、家令よりも、執事になりたい。すべて現金で、労せずして得られる。ただし、奥さまが、蝋ろうそくをあなたに用意させたり、お気に入りの奉公人に分け前をやるよう強いたりする人でなければの話だ。それでも、最悪の場合でさえ、古いトランプはあなたのものだ。客たちが大勝負をしたり、不機嫌になったりすれば、ひっきりなしに札を取り替えるので、古い札をコーヒーハウスや、賭け事は好きでも中古の札しか買えない家に売るだけで、かなりの利益になる。給仕するときは、必ず新品の組を客の手の届くところに置いておきなさい。ついていない人が、運を変えようと、すぐに使ってくれる。ときどき古い組をほかに交ぜても、たやすく通る。賭け事のある晩は、特によく立ち働き、客の帰り道を照らすろうそくを用意し、頼まれたらすぐ出せるよう、ワインを載せた盆を手元に置いておくこと。ただし、料理人と話をつけて、夜食は出さないようにしなさい。その分主人の家の節約になるし、夜食があるとあなたの稼ぎもかなり減るからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-056"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Next to cards, there is nothing so profitable to you as bottles; in which perquisite you have no competitors except the footmen, who are apt to steal and vend them for pots of beer: but you are bound to prevent any such abuses in your master's family: the footmen are not to answer for what are broke at a general bottling; and those may be as many as your discretion will make them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[103]"
    "line_start": 733
    "source_sequence": 803
    "printed_page": "123"
  "translation_ja": "トランプの次に儲かるのは瓶だ。この役得については、従僕以外に競争相手はいない。従僕は瓶を盗んで、ジョッキ入りのビールと引き換えに売りがちだが、主人の家でそんな不正が起こるのを防ぐのは、あなたの務めだ。まとめて瓶詰めするときに割れた瓶については、従僕が責任を負うわけではない。そしてその本数は、あなたの分別でいくらにでもできる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-057"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The profit of glasses is so very inconsiderable, that it is hardly worth mentioning; it consists only in a small present made by the glassman, and about four shillings in the pound added to the prices for your trouble and skill in choosing them. If your master has a large stock of glasses, and you or your fellow-servants happen to break any of them without your master's knowledge, keep it a secret till there are not enough left to serve the table, then tell your master that the glasses are gone; this will be but one vexation to him, which is much better than fretting once or twice a week; and it is the office of a good servant to discompose his master and his lady as seldom as he can; and here the cat and dog will be of great use to take the blame from you. Note, that bottles missing are supposed to be half stolen by stragglers and other servants; and the other half broken by accident, and a general washing."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[104]"
    "line_start": 735
    "source_sequence": 809
    "printed_page": "124"
  "translation_ja": "グラスからの利益は、わざわざ述べるほどもない、ごくささやかなものだ。ガラス屋からのちょっとした贈り物と、グラスを選ぶ手間と目利きに対して、値段に一ポンド当たり四シリングほど上乗せしてもらうだけである。主人がグラスをたくさん持っていて、あなたか仲間の奉公人が、主人の知らないところで何個か割ってしまったら、食卓に出すのに足りなくなるまで秘密にしておき、それから主人に、グラスがなくなったと告げなさい。それなら不愉快な思いをさせるのは一度で済み、週に一、二度いらいらさせるより、ずっとよい。主人や奥さまの機嫌を損ねるのを、できるだけ少なくするのが、よい奉公人の務めである。そしてここでは、猫や犬が、あなたから責めをそらすのに大いに役立つ。なお、見当たらない瓶は、半分がうろつく者やほかの奉公人に盗まれ、もう半分は、不慮の事故とまとめ洗いの際に割れた、ということになっている。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-058"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Whet the backs of your knives until they are as sharp as the edge; which will have this advantage, that when gentlemen find them blunt on one side, they may try the other; and to show you spare no pains in sharpening the knives, whet them so long, till you wear out a good part of the iron, and even the bottom of the silver handle. This does credit to your master, for it shows good housekeeping, and the goldsmith may one day make you a present."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[105]"
    "line_start": 737
    "source_sequence": 811
    "printed_page": "124"
  "translation_ja": "ナイフの背も、刃と同じくらい鋭くなるまで研ぎなさい。そうすれば、紳士方は片側が切れなかったとき、反対側を試せるという利点がある。また、ナイフを研ぐのに手間を惜しまないことを示すため、鉄の部分がかなりすり減り、銀の柄の端まで削れるほど、長く研ぐこと。これは主人の面目を立てる。家計にゆとりのある証拠になるし、いつか金銀細工師が、あなたに贈り物をしてくれるかもしれない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-059"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Your lady, when she finds the small beer or ale dead, will blame you for not remembering to put the peg into the vent-hole. This is a great mistake, nothing being plainer, than that the peg keeps the air in the vessel, which spoils the drink, and therefore ought to be let out; but if she insists upon it, to prevent the trouble of pulling out the vent, and putting it in a dozen times a day, which is not to be born by a good servant, leave the spigot half out at night, and you will find, with only the loss of two or three quarts of liquor, the vessel will run freely."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[106]"
    "line_start": 739
    "source_sequence": 817
    "printed_page": "125"
  "translation_ja": "薄ビールやエールの気が抜けていると、奥さまは、空気穴に栓をするのを忘れたと、あなたを責めるだろう。これは大きな間違いだ。栓をすると樽の中に空気が閉じ込められ、それが酒を悪くするのだから、外へ出すべきだということほど明らかな話はない。しかし、奥さまが言い張るなら、よい奉公人には耐えがたい、一日に十二度も空気穴の栓を抜き差しする面倒を省くため、夜のうちに注ぎ口の栓を半分抜いておきなさい。酒が二、三クォート失われるだけで、樽から勢いよく出るようになる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-060"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you prepare your candles, wrap them up in a piece of brown paper, and so stick them into the socket; let the paper come half way up the candle, which looks handsome, if anybody should come in."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[107]"
    "line_start": 741
    "source_sequence": 819
    "printed_page": "125"
  "translation_ja": "ろうそくを用意するときは、茶色の包み紙でくるみ、そのまま燭台の受け口に立てなさい。紙はろうそくの半ばの高さまで届くようにする。誰か入ってきたとき、立派に見える。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c01-061"
  "section_id": "chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Do all in the dark, to save your master's candles."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[108]"
    "line_start": 743
    "source_sequence": 821
    "printed_page": "125"
  "translation_ja": "主人のろうそくを節約するため、何もかも暗闇でやりなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-heading"
  "section_id": "chapter-02"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    CHAP. II.
    Directions to the Cook.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/div[14]/p"
    "line_start": 749
    "source_sequence": 836
    "printed_page": "125"
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/div[15]/p"
    "line_start": 751
    "source_sequence": 840
    "printed_page": "125"
  "translation_ja": |-
    第二章
    料理人への心得
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-001"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "ALTHOUGH I am not ignorant, that it has been a long time, since the custom began among the people of quality to keep men cooks, and generally of the French nation; yet because my treatise is chiefly calculated for the general run of knights, 'squires, and gentlemen both in town and country, I shall therefore apply to you, Mrs. cook, as a woman: however, a great part of what I intend may serve for either sex; and your part naturally follows the former, because the butler and you are joined in interest; your vales are generally equal, and paid when others are disappointed: you can junket together at nights upon your own prog, when the rest of the house are abed; and have it in your power to make every fellow-servant your friend; you can give a good bit or a good sup to the little masters and misses, and gain their affections: a quarrel between you is very dangerous to you both, and will probably end in one of you being turned off; in which fatal case, perhaps it will not be so easy in some time to cotton with another. And now Mrs. cook, I proceed to give you my instructions; which I desire you will get some fellow-servant in the family to read to you constantly one night in every week when you are going to bed, whether you serve in town or country; for my lessons shall be fitted for both."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[111]"
    "line_start": 754
    "source_sequence": 845
    "printed_page": "125"
  "translation_ja": "身分の高い人々が、たいていフランス人の男の料理人を雇う習慣になってから、ずいぶん長いことは、私も知らないわけではない。しかし、この論は主として、都会と田舎の普通の騎士、郷紳、紳士方のために書いているので、料理人さん、あなたには女性として語りかけることにしよう。もっとも、ここに述べることの大部分は、男女どちらにも役立つ。そして、あなたの章が前の章に続くのは、自然なことだ。執事とあなたは、利害を共にしているのだから。心付けはふつう同額で、ほかの者はもらい損ねても、あなた方には払われる。家の者が皆寝たあと、夜中に自分たちの蓄えた食べ物で、一緒にごちそうを楽しめるし、どの仲間の奉公人をも味方につけられる立場にいる。小さな坊ちゃんやお嬢ちゃんにも、おいしい一口や、うまい一杯をやって、気に入ってもらえる。あなた方が喧嘩をすると、双方にひどく危険で、おそらくどちらかが暇を出されることになる。そんな致命的な事態になったら、しばらくは、別の相手と気を合わせるのも、そう簡単にはいかないかもしれない。さて、料理人さん、これから指南に取りかかろう。都会に奉公していても、田舎にいても、毎週一晩、床に入るとき、同じ家の仲間の奉公人に、必ず読み聞かせてもらいたい。私の教えは、どちらにも合うようにするつもりだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-002"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your lady forgets at supper that there is any cold meat in the house, do not you be so officious as to put her in mind; it is plain she did not want it; and if she recollects it the next day, say she gave you no orders, and it is spent; therefore, for fear of telling a lie, dispose of it with the butler, or any other crony, before you go to bed."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[112]"
    "line_start": 756
    "source_sequence": 853
    "printed_page": "126"
  "translation_ja": "夕食のとき、奥さまが家に冷たい肉の残りがあることを忘れていたら、余計なおせっかいで思い出させたりしてはいけない。欲しくなかったのは明らかだ。翌日思い出されたら、お申しつけがなかったので、もうなくなりました、と言いなさい。だから、嘘をつくことにならないよう、寝る前に執事か、ほかの親しい仲間と、始末しておくこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-003"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never send up a leg of a fowl at supper, while there is a cat or a dog in the house, that can be accused for running away with it: but if there happen to be neither, you must lay it upon the rats, or a strange greyhound."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[113]"
    "line_start": 758
    "source_sequence": 855
    "printed_page": "126"
  "translation_ja": "家に猫か犬がいて、くわえて逃げたと罪を着せられるうちは、鶏の脚を夕食に出してはいけない。たまたまどちらもいなければ、鼠か、よそのグレイハウンドのせいにしなければならない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-004"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is ill housewifery to foul your kitchen rubbers with wiping the bottoms of the dishes you send up, since the tablecloth will do as well, and is changed every meal."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[114]"
    "line_start": 760
    "source_sequence": 857
    "printed_page": "126"
  "translation_ja": "食卓に出す皿の底を拭いて、台所の布巾を汚すのは、やりくりが悪い。テーブルクロスでも同じ役に立ち、毎食取り替えるのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-005"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never clean your spits after they have been used; for the grease left upon them by meat is the best thing to preserve them from rust; and when you make use of them again, the same grease will keep the inside of the meat moist."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[115]"
    "line_start": 762
    "source_sequence": 863
    "printed_page": "127"
  "translation_ja": "焼き串は使ったあと、決してきれいにしてはいけない。肉からついた脂が、錆を防ぐのにいちばんよいし、また使うときには、その脂が肉の内側をしっとりさせてくれる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-006"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you live in a rich family, roasting and boiling are below the dignity of your office, and which it becomes you to be ignorant of; therefore leave that work wholly to the kitchenwench, for fear of disgracing the family you live in."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[116]"
    "line_start": 764
    "source_sequence": 865
    "printed_page": "127"
  "translation_ja": "裕福な家に仕えているなら、焼いたり煮たりする仕事は、あなたの職の品位にふさわしくなく、知らないほうが似つかわしい。だから、仕える家の名誉を傷つけないよう、そうした仕事はすべて台所女中に任せなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-007"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are employed in marketting, buy your meat as cheap as you can; but when you bring in your accounts, be tender of your master's honour, and set down the highest rate; which besides is but justice; for nobody can afford to sell at the same rate that he buys, and I am confident that you may charge safely; swear that you gave no more than what the butcher and poulterer asked. If your lady orders you to set up a piece of meat for supper, you are not to understand that you must set it up all, therefore you may give half to yourself and the butler."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[117]"
    "line_start": 766
    "source_sequence": 867
    "printed_page": "127"
  "translation_ja": "買い出しを任されているなら、肉はできるだけ安く買いなさい。ただし、勘定を出すときは、主人の名誉を重んじ、いちばん高い値を書きつけること。それに、それが公正というものだ。仕入れたのと同じ値で売って、やっていける者はいないのだから。安心して請求してよいと、私は確信している。肉屋と鳥肉屋の言い値より多くは払っていない、と誓いなさい。奥さまから、夕食用に肉の塊を取り置くよう言われても、全部を取り置かなければならないという意味に受け取ってはいけない。だから半分は、自分と執事に回してよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-008"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Good cooks cannot abide what they justly call fiddling work, where abundance of time is spent and little done: such for instance, is the dressing small birds, requiring a world of cookery and clutter, and a second or third spit, which by the way is absolutely needless; for it will be a very ridiculous thing indeed, if a spit, which is strong enough to turn a sirloin of beef, should not be able to turn a lark; however. If your lady be nice, and is afraid that a large spit will tear them, place them handsomely in the drippingpan, where the fat of roasted mutton or beef falling on the birds will serve to baste them, and so save both time and butter: for what cook of any spirit would lose her time in picking larks, wheatears, and other small birds? Therefore if you cannot get the maids or the young misses to assist you, e'en make short work, and either singe or flay them; there is no great loss in the skins, and the flesh is just the same."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[118]"
    "line_start": 768
    "source_sequence": 869
    "printed_page": "127"
  "translation_ja": "よい料理人は、手間ばかりかかって、ろくに仕事の進まないことを、まことに適切にも、ちまちました仕事と呼び、我慢ならなく思う。たとえば、小鳥の料理がそうだ。ひどく手数がかかって大騒ぎになり、二本目、三本目の焼き串まで要る。もっとも、それはまったく不要である。牛のサーロインを回せるほど丈夫な焼き串が、ヒバリを回せないというのも、実におかしな話だ。しかし奥さまが気難しく、大きな串では鳥が裂けてしまうと心配なさるなら、脂受け皿にきれいに並べなさい。羊や牛の焼肉から落ちる脂で鳥に脂をかける代わりができ、時間もバターも節約できる。気概のある料理人の誰が、ヒバリやハシグロヒタキなどの小鳥の羽をむしって、時間をつぶしたりするものか。だから、女中や幼いお嬢ちゃんたちに手伝ってもらえなければ、さっさと済ませるため、毛を焼くか、皮を剥ぐかしなさい。皮がなくなっても大した損ではなく、肉はまったく同じだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-009"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you are employed in marketting, do not accept a treat of a beef steak and a pot of ale from the butcher, which I think in conscience is no better than wronging your master; but do you always take that perquisite in money, if you do not go in trust; or in poundage, when you pay the bills."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[119]"
    "line_start": 770
    "source_sequence": 875
    "printed_page": "128"
  "translation_ja": "買い出しを任されているなら、肉屋からビーフステーキとジョッキ一杯のエールをおごってもらってはいけない。良心に照らして言うが、それは主人に損をさせるのと変わらないと思う。代わりに、その役得は必ず、掛け買いでなければ現金で、請求書を払う際なら一ポンドごとの口銭として、受け取ること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-010"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The kitchen bellows being usually out of order with stirring the fire with the muzzle to save the tongs and poker, borrow the bellows out of your lady's bedchamber, which being least used are commonly the best in the house; and if you happen to damage or grease them, you have a chance to have them left entirely for your own use."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[120]"
    "line_start": 772
    "source_sequence": 877
    "printed_page": "128"
  "translation_ja": "台所のふいごは、火ばさみや火かき棒を大切にするため、その口で火をかき立てるので、たいてい傷んでいる。そこで、奥さまの寝室のふいごを借りてきなさい。それがいちばん使われず、ふつう家でいちばんよいものだ。そして、もし傷めたり脂まみれにしたりすれば、そのままあなた専用に下げ渡される見込みがある。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-011"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let a black-guard boy be always about the house to send on your errands, and go to market for you on rainy days, which will save your clothes, and make you appear more creditable to your mistress."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[121]"
    "line_start": 774
    "source_sequence": 879
    "printed_page": "128"
  "translation_ja": "いつでもごろつき小僧を家のあたりに置いて、使い走りをさせ、雨の日には代わりに買い出しに行かせなさい。それで服が傷まず、奥さまにも、もっときちんとした姿を見せられる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-012"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your mistress allows you the kitchenstuff, in return of her generosity take care to boil and roast your meat sufficiently. If she keeps it for her own profit, do her justice; and rather than let a good fire be wanting, enliven it now and then with the dripping and the butter that happens to turn to oil."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[122]"
    "line_start": 776
    "source_sequence": 881
    "printed_page": "128"
  "translation_ja": "奥さまが台所の屑脂をあなたにくださるなら、その寛大さに報いて、肉は念入りに煮たり焼いたりしなさい。御自分の利益のために取っておかれるなら、それに見合う扱いをすること。そして火力を不足させるくらいなら、ときどき焼き汁の脂や、たまたま溶けて油になったバターで、火の勢いをよくしてやりなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-013"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Send up your meat well stuck with skewers, to make it look round and plump; and an iron skewer rightly employed now and then will make it look handsomer."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[123]"
    "line_start": 778
    "source_sequence": 883
    "printed_page": "128"
  "translation_ja": "肉は、串をしっかり刺して、丸々と太って見えるようにして出しなさい。ときには鉄串をうまく使っても、見栄えがよくなる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-014"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you roast a long joint of meat, be careful only about the middle, and leave the two extreme parts raw, which will serve another time, and will also save firing."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[124]"
    "line_start": 780
    "source_sequence": 889
    "printed_page": "129"
  "translation_ja": "長い肉の塊を焼くときは、真ん中だけに気を配り、両端は生のままにしておきなさい。そこはまた別の機会に使え、燃料の節約にもなる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-015"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you scour your plates and dishes, bend the brim inward, so as to make them hold the more."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[125]"
    "line_start": 782
    "source_sequence": 891
    "printed_page": "129"
  "translation_ja": "皿や大皿を磨くときは、もっとたくさん盛れるよう、縁を内側へ曲げなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-016"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Always keep a large fire in the kitchen when there is a small dinner, or the family dines abroad, that the neighbours, seeing the smoke, may commend your master's housekeeping: but, when much company is invited, then be as sparing as possible of your coals, because a great deal of the meat being half raw will be saved, and serve next day."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[126]"
    "line_start": 784
    "source_sequence": 893
    "printed_page": "129"
  "translation_ja": "食事がささやかなときや、家の者がよそで食事をするときは、必ず台所で盛んに火を燃やし、煙を見た近所の人々が、主人の暮らし向きのよさを褒めるようにしなさい。ただし、大勢客を招いたときには、できる限り石炭を惜しむこと。肉の大部分が半生なら、それだけ残って、翌日また使えるからだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-017"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Boil your meat constantly in pump water, because you must sometimes want river or pipe water; and then your mistress observing your meat of a different colour, will chide you when you are not in fault."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[127]"
    "line_start": 786
    "source_sequence": 895
    "printed_page": "129"
  "translation_ja": "肉を煮るには、いつもポンプでくんだ水を使いなさい。川の水や水道の水は、ときには手に入らないものだから、そのとき肉の色が違うと奥さまが気づけば、あなたに落ち度がないのに叱られてしまう。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-018"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you have plenty of fowl in the larder, leave the door open in pity to the poor cat, if she be a good mouser."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[128]"
    "line_start": 788
    "source_sequence": 897
    "printed_page": "129"
  "translation_ja": "食料貯蔵室に鶏がたくさんあったら、かわいそうな猫が鼠捕りの上手なやつであれば、情けをかけて、戸を開けておきなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-019"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you find it necessary to go to market in a wet day, take out your mistress's ridinghood and cloak to save your clothes."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[129]"
    "line_start": 790
    "source_sequence": 899
    "printed_page": "129"
  "translation_ja": "雨の日に、どうしても買い出しに行かなければならなくなったら、自分の服をいたわるため、奥さまの乗馬用頭巾と外套を持ち出しなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-020"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Get three or four chairwomen to attend you constantly in the kitchen, whom you pay at small charges, only with the broken meat, a few coals, and all the cinders."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[130]"
    "line_start": 792
    "source_sequence": 901
    "printed_page": "129"
  "translation_ja": "三、四人の日雇いの掃除女を、いつでも台所であなたに仕えるようにしておきなさい。その賃金は、肉の食べ残し、わずかの石炭、そして燃えがら全部をやるだけで、安く済む。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-021"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "To keep troublesome servants out of the kitchen, always leave the winder sticking on the jack to fall on their heads."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[131]"
    "line_start": 794
    "source_sequence": 903
    "printed_page": "129"
  "translation_ja": "面倒な奉公人たちを台所へ寄せつけないため、焼き串回転器の巻き上げハンドルはいつでも差したままにして、彼らの頭に落ちるようにしておきなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-022"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If a lump of soot falls into the soup, and you cannot conveniently get it out, stir it well, and it will give the soup a high French taste."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[132]"
    "line_start": 796
    "source_sequence": 905
    "printed_page": "129"
  "translation_ja": "煤の塊がスープに落ち、うまく取り出せなかったら、よくかき混ぜなさい。スープに濃厚なフランス風の味がつく。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-023"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you melt your butter to oil, be under no concern, but send it up, for oil is a genteeler sauce than butter."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[133]"
    "line_start": 797
    "source_sequence": 908
    "printed_page": "129"
  "translation_ja": "バターを溶かして油にしてしまっても、気にせずに出しなさい。油はバターより上品なソースなのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-024"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Scrape the bottoms of your pots and kettles with a silver spoon, for fear of giving them a taste of copper."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[134]"
    "line_start": 799
    "source_sequence": 914
    "printed_page": "130"
  "translation_ja": "鍋や釜の底をこそげるには、銅の味をつけないよう、銀の匙を使いなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-025"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you send up butter for sauce, be so thrifty as to let it be half water; which is also much wholesomer."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[135]"
    "line_start": 801
    "source_sequence": 916
    "printed_page": "130"
  "translation_ja": "ソース用のバターを出すときは、倹約して半分は水にしなさい。そのほうが、ずっと健康にもよい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-026"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your butter, when it is melted, tastes of brass, it is your master's fault, who will not allow you a silver saucepan; besides, the less of it will go farther, and new tinning is very chargeable: if you have a silver saucepan, and the butter smells of smoke, lay the fault upon the coals."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[136]"
    "line_start": 803
    "source_sequence": 918
    "printed_page": "130"
  "translation_ja": "溶かしたバターに真鍮の味がしたら、それは、銀の小鍋を使わせてくれない主人の落ち度だ。それに、そのほうが少量でたくさん間に合い、錫を引き直すには、ひどく金がかかる。銀の小鍋があるのにバターが煙臭かったら、石炭のせいにしなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-027"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Never make use of a spoon in any thing that you can do with your hands, for fear of wearing out your master's plate."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[137]"
    "line_start": 805
    "source_sequence": 920
    "printed_page": "130"
  "translation_ja": "手でできることには、決して匙を使ってはいけない。主人の銀食器をすり減らすと困るから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-028"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you find that you cannot get dinner ready at the time appointed, put the clock back, and then it may be ready to a minute."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[138]"
    "line_start": 807
    "source_sequence": 922
    "printed_page": "130"
  "translation_ja": "決められた時刻までに食事の用意ができないと分かったら、時計を戻しなさい。そうすれば、一分の違いもなく間に合わせられる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-029"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let a redhot coal now and then fall into the drippingpan, that the smoke of the dripping may ascend, and give the roast meat a high taste."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[139]"
    "line_start": 809
    "source_sequence": 924
    "printed_page": "130"
  "translation_ja": "ときどき真っ赤におきた石炭を脂受け皿に落とし、脂の煙を立ち上らせて、焼肉に強い風味をつけなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-030"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "You are to look upon the kitchen as your dressingroom; but you are not to wash your hands till you have gone to the necessaryhouse, and spitted your meat, trussed your fowl, picked your sallad, not indeed till after you have sent up your second course; for your hands will be ten times fouler with the many things you are forced to handle; but when your work is over, one washing will serve for all."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[140]"
    "line_start": 811
    "source_sequence": 926
    "printed_page": "130"
  "translation_ja": "台所は、自分の身支度部屋と思いなさい。ただし、手を洗うのは、便所に行き、肉を串に刺し、鶏を縛って形を整え、サラダの葉を選り分けてからにすること。いや、実際には、第二の膳の料理を出すまでは洗ってはいけない。さまざまな物を扱わなければならず、手は十倍も汚くなるのだから、仕事が済んでから、一度洗えば全部間に合う。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-031"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is but one part of your dressing that I would admit while the victuals are boiling, roasting, or stewing; I mean the combing your head, which loses no time, because you can stand over your cookery, and watch it with one hand, while you are using your comb with the other."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[141]"
    "line_start": 813
    "source_sequence": 928
    "printed_page": "130"
  "translation_ja": "食べ物を煮たり焼いたり蒸し煮にしたりしている間、私が認める身支度は、一つだけある。髪をとかすことだ。それなら時間の無駄にならない。料理の上に身をかがめ、片手で様子を見ながら、もう片方の手で櫛を使えるのだから。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-032"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If any of the combings happen to be sent up with the victuals, you may safely lay the fault upon any of the footmen that has vexed you: as those gentlemen are sometimes apt to be malicious, if you refuse them a sop in the pan, or a slice from the spit, much more when you discharge a ladleful of hot porridge on their legs, or send them up to their masters with a dishclout pinned at their tails."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[142]"
    "line_start": 815
    "source_sequence": 934
    "printed_page": "131"
  "translation_ja": "抜け毛が食べ物と一緒に出てしまったら、あなたを困らせた従僕の誰かに、安心して罪を着せてよい。あの御仁たちは、鍋の汁に浸したパンや、串から切り取った肉をやらないと、ときに意地悪をするものだから。まして、脚に熱い粥をひしゃく一杯ぶちまけたり、尻に皿洗い布をピンで留めたまま主人のところへ送り出したりすれば、なおさらだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-033"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In roasting and boiling, order the kitchen maid to bring none but the large coals, and save the small ones for the fires above stairs; the first are properest for dressing meat, and when they are out, if you happen to miscarry in any dish, you may fairly lay the fault upon want of coals; besides, the cinder-pickers will be sure to speak ill of your master's housekeeping, where they do not find plenty of large cinders mixed with fresh large coals: thus you may dress your meat with credit, do an act of charity, raise the honour of your master, and sometimes get share of a pot of ale for your bounty to the cinder-woman."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[143]"
    "line_start": 817
    "source_sequence": 936
    "printed_page": "131"
  "translation_ja": "焼いたり煮たりするときは、台所女中に、大きな石炭だけ持ってくるよう言い、小さなものは上の部屋の暖炉に取っておきなさい。大きいほうが料理に向いているし、それがなくなって、何かの料理をしくじったら、正当に石炭の不足のせいにできる。それに、燃えがら拾いの人々は、大きな燃えがらに未使用の大きな石炭がたっぷり交じっていないと、きっと主人の暮らしぶりを悪く言う。こうすれば、評判を立てながら料理をし、慈善を行い、主人の名誉を高め、ときには燃えがら拾いの女への気前よさの礼に、ジョッキのエールを分けてもらうこともできる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-034"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As soon as you have sent up the second course, you have nothing to do (in a great family) until supper: therefore scour your hands and face, put on your hood and scarf, and take your pleasure among your cronies, till nine or ten at night. — But dine first."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[144]"
    "line_start": 819
    "source_sequence": 938
    "printed_page": "131"
  "translation_ja": "第二の膳の料理を出してしまえば、大きな家では、夕食まで何もすることがない。だから手と顔をごしごし洗い、頭巾と肩掛けを着け、夜の九時か十時まで、親しい仲間の間で楽しみなさい。ただし、先に昼食を済ませること。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-035"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let there be always a strict friendship between you and the butler, for it is both your interests to be united: the butler often wants a comfortable titbit, and you much oftener a cool cup of good liquor. However, be cautious of him, for he is sometimes an inconstant lover, because he has great advantage to allure the maids with a glass of sack, or white wine and sugar."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[145]"
    "line_start": 821
    "source_sequence": 940
    "printed_page": "131"
  "translation_ja": "あなたと執事の間には、いつでも固い友情を保ちなさい。結束することが、双方の利益になるのだから。執事はしばしば、うまい一口が欲しくなり、あなたはそれよりずっとしばしば、よい酒を冷たく一杯やりたくなる。ただし、あの男には用心すること。女中たちを、サック酒一杯や、砂糖を入れた白ワインで誘えるという大きな強みがあるので、ときには浮気な恋人になる。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-036"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you roast a breast of veal, remember your sweetheart the butler loves a sweetbread; therefore set it aside till evening: you can say, the cat or the dog has run away with it, or you found it tainted, or flyblown; and besides it looks as well at the table, without it as with it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[146]"
    "line_start": 823
    "source_sequence": 946
    "printed_page": "132"
  "translation_ja": "仔牛の胸肉を焼くときは、恋人の執事が胸腺を好むことを忘れず、夕方まで取っておきなさい。猫や犬がくわえて逃げたとか、傷んでいた、蠅に卵を産みつけられていた、と言えばよい。それに、食卓では、それがなくても、あっても、見栄えは変わらない。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-037"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you make the company wait long for dinner, and the meat be overdone, which is generally the case, you may lawfully lay the fault upon your lady, who hurried you so to send up dinner, that you was forced to send it up too much boiled and roasted."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[147]"
    "line_start": 825
    "source_sequence": 948
    "printed_page": "132"
  "translation_ja": "客たちを食事まで長く待たせ、そのうえ、たいていそうなるように、肉に火を通しすぎてしまったら、奥さまのせいにして差し支えない。食事を出せとあまりに急かされたので、煮すぎ焼きすぎのまま出さざるを得なかったのだ。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-038"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your dinner miscarries in almost every dish, how could you help it? You were teased by the footmen coming into the kitchen; and to prove it true, take occasion to be angry, and throw a ladleful of broth on one or two of their liveries; besides, Friday and Childermas-day are two cross days in the week, and it is impossible to have good luck on either of them; therefore on those two days you have a lawful excuse."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[148]"
    "line_start": 827
    "source_sequence": 950
    "printed_page": "132"
  "translation_ja": "食事のほとんどどの皿もしくじったとして、どうしようがあっただろう。従僕たちが台所へ来て、邪魔ばかりしたのだから。そして、それが本当だと証明するため、折を見て腹を立て、一人か二人の仕着せに、ひしゃく一杯の肉汁を浴びせなさい。それに、金曜日と幼子殉教者の日は、一週間のうちでも運の悪い二日で、どちらの日にも幸運など望めない。だから、その二日には、正当な言い訳がある。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-039"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you are in haste to take down your dishes, tip them in such a manner, that a dozen will fall together upon the dresser, just ready for your hand."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[149]"
    "line_start": 829
    "source_sequence": 952
    "printed_page": "132"
  "translation_ja": "急いで皿を下ろすときは、一ダースが一緒に調理台へ落ちて、すぐ手に取れるよう、傾けなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-040"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "To save time and trouble, cut your apples and onions with the same knife; and well-bred gentry love the taste of an onion in every thing they eat."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[150]"
    "line_start": 831
    "source_sequence": 954
    "printed_page": "132"
  "translation_ja": "時間と手間を省くため、林檎も玉葱も同じナイフで切りなさい。育ちのよい上流の方々は、何を食べるにも、玉葱の味がするのを好む。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-041"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lump three or four pounds of butter together with your hand, then dash it against the wall just over the dresser, so as to have it ready to pull by pieces as you have occasion for it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[151]"
    "line_start": 833
    "source_sequence": 956
    "printed_page": "132"
  "translation_ja": "バター三、四ポンドを手で一塊にし、調理台のすぐ上の壁にたたきつけて、必要なときにちぎって使えるようにしておきなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-042"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If you have a silver saucepan for the kitchen use, let me advise you to batter it well, and keep it always black; this will be for your master's honour, for it shows there has been constant good housekeeping: and make room for the saucepan by wriggling it on the coals, &c."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[152]"
    "line_start": 835
    "source_sequence": 962
    "printed_page": "133"
  "translation_ja": "台所用に銀の小鍋があったら、よくへこませ、いつも真っ黒にしておくよう勧めたい。それが主人の名誉になる。いつもよい暮らしをしてきた証しになるからだ。そして石炭の上でぐりぐり動かすなどして、小鍋を置く場所を作りなさい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-043"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In the same manner, if you are allowed a large silver spoon for the kitchen, let half the bowl of it be worn out with continual scraping and stirring, and often say merrily. This spoon owes my master no service."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[153]"
    "line_start": 837
    "source_sequence": 964
    "printed_page": "133"
  "translation_ja": "同じように、台所に大きな銀の匙を使わせてもらえたら、絶えずこそげたりかき混ぜたりして、匙のくぼみの半分がすり減るようにし、たびたび陽気に言いなさい。この匙は、もう主人のために十分働いたね、と。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c02-044"
  "section_id": "chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When you send up a mess of broth, watergruel, or the like, to your master in a morning, do not forget with your thumb and two fingers to put salt on the side of the plate; for if you make use of a spoon or the end of a knife, there may be danger that the salt would fall, and that would be a sign of ill luck. Only remember to lick your thumb and fingers clean, before you offer to touch the salt."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[154]"
    "line_start": 839
    "source_sequence": 966
    "printed_page": "133"
  "translation_ja": "朝、主人に一椀の肉汁や、薄い穀粉粥などを出すときは、忘れずに、親指とほかの二本の指でつまんで、皿の脇に塩を添えなさい。匙やナイフの先を使うと、塩をこぼす危険があり、それは不運のしるしになるからだ。ただし、塩に触れようとする前に、親指とほかの指をきれいに舐めておくのを忘れないこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

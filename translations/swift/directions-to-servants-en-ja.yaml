  "section_id": "chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "LORD Peterborough's steward, that pulled down his house, sold the materials, and charged my lord with repairs. Take money for forbearance from tenants. Renew leases, and get by them, and sell woods. Lend my lord his own money. Gilblas said much of this, to whom I refer."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[241]"
    "line_start": 1027
    "source_sequence": 1332
    "printed_page": "157"
  "translation_ja": "ピーターバラ卿の管理人。主人の家を取り壊し、材料を売り、修理代を主人に請求した男。小作人から、取り立てを猶予する金を取る。借地契約を更新して儲け、森を売る。主人の金を主人に貸す。この手のことはジル・ブラースが多く述べているので、そちらを参照されたい。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

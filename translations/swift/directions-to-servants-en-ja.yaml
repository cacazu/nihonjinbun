  - "source_id": "swift-1801-v16-directions"
    "description_ja": "原著は未完で、一部は粗描・短い列挙のまま残ると底本編者が説明している。編者が報告する献辞・序文の構想や全奉公人の一覧を再構成せず、採用底本にない続きや第XVII章以降を補わない。末尾の&c.を保持し、それだけを物理的欠落の証拠と断定しない。"

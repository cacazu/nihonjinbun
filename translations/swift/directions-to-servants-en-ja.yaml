  "translation_ja": |-
    第十二章
    子守心得。
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c12-001"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "IF a child be sick, give it whatever it wants to eat or drink, although particularly forbid by the doctor: for what we long for in sickness will do us good; and throw the physick out of the window: the child will love you the better; but bid it not tell. Do the same for your lady when she longs for any thing in sickness, and engage it will do her good."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[294]"
    "line_start": 1158
    "source_sequence": 1604
    "printed_page": "172"
  "translation_ja": "子供が病気なら、医者から特に禁じられていても、食べたいもの、飲みたいものは何でも与えなさい。病気のときに欲しくなるものは、身体によいのだから。そして薬は窓から捨てること。子供はあなたをもっと好きになる。ただし、言いつけないように言っておきなさい。奥さまが病気で何かを欲しがるときも、同じようにし、きっとお身体によいと請け合うこと。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c12-002"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If your mistress comes to the nursery, and offers to whip a child, snatch it out of her hands in rage, and tell her she is the cruellest mother you ever saw: she will chide, but love you the better. Tell the children stories of spirits, when they offer to cry, &c."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[295]"
    "line_start": 1160
    "source_sequence": 1608
    "printed_page": "172"
  "translation_ja": "奥さまが子供部屋へ来て、子供を鞭で打とうとしたら、怒ってその手から子供を奪い、今まで見た中でいちばん残酷な母親だと言いなさい。奥さまは叱るだろうが、あなたをもっと好きになる。子供たちが泣こうとしたら、幽霊の話をしてやること、など。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dts-c12-003"
  "section_id": "chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Be sure to wean the children, &c."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "swift-1801-v16-directions"
    "precision": "block"
    "url": "https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_16/Directions_to_Servants&oldid=11538613"
    "xpath": "/html/body/div[3]/div/div[3]/main/div[3]/div[2]/div[1]/section/div[3]/p[296]"
    "line_start": 1162
    "source_sequence": 1610
    "printed_page": "172"
  "translation_ja": "子供たちは必ず乳離れさせること、など。"
  "translation_status": "reviewed"
  "source_kind": "author_text"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

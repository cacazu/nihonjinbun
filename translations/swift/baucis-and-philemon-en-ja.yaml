    In ancient times, as story tells,
    The saints would often leave their cells,
    And stroll about, but hide their quality,
    To try good people's hospitality.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4268
    "line_end": 4271
  "translation_ja": |-
    昔々、物語によると、
    聖人たちは、よく庵を離れ、
    身分を隠して、あちこち歩き、
    善良な人々の、もてなしぶりを試した。
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-02"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      It happen'd on a winter night,
    As authors of the legend write,
    Two brother hermits, saints by trade,
    Taking their tour in masquerade,
    Disguis'd in tatter'd habits, went
    To a small village down in Kent;
    Where, in the strollers' canting strain,
    They begg'd from door to door in vain,
    Try'd ev'ry tone might pity win;
    But not a soul would let them in.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4272
    "line_end": 4281
  "translation_ja": |-
    それは、ある冬の夜のこと、
    伝説を書いた人々の話では、
    仲間の隠者二人、商売は聖人、
    姿を変えて、巡り歩き、
    ぼろぼろの服に身をやつして、
    ケントの奥の、小さな村へ来た。
    そこで、流れ者の、お決まりの口調で、
    戸から戸へ物を乞うたが、無駄だった。
    同情を誘いそうな声を、すべて試したが、
    入れてくれる人は、一人もいなかった。
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-03"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      Our wand'ring saints, in woful state,
    Treated at this ungodly rate,
    Having thro' all the village past,
    To a small cottage came at last
    Where dwelt a good old honest ye'man,
    Call'd in the neighbourhood Philemon;
    Who kindly did these saints invite
    In his poor hut to pass the night;
    And then the hospitable sire
    Bid Goody Baucis mend the fire;
    While he from out the chimney took
    A flitch of bacon off the hook,
    And freely from the fattest side
    Cut out large slices to be fry'd;
    Then stepp'd aside to fetch 'em drink,
    Fill'd a large jug up to the brink,
    And saw it fairly twice go round;
    Yet (what was wonderful) they found
    'Twas still replenished to the top,
    As if they ne'er had touch'd a drop.
    The good old couple were amaz'd,
    And often on each other gaz'd;
    For both were frighten'd to the heart,
    And just began to cry, "What art!"
    Then softly turn'd aside, to view
    Whether the lights were burning blue.
    The gentle pilgrims, soon aware on't,
    Told them their calling and their errand:
    "Good folk, you need not be afraid,
    We are but saints," the hermits said;
    "No hurt shall come to you or yours:
    But for that pack of churlish boors,
    Not fit to live on Christian ground,
    They and their houses shall be drown'd;
    While you shall see your cottage rise,
    And grow a church before your eyes."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4282
    "line_end": 4317
  "translation_ja": |-
    さすらう聖人たちは、惨めな姿で、
    こんな不信心な扱いを受け、
    村を、すっかり通り抜けて、
    ついに、小さな家へたどり着いた。
    そこには、善良で正直な老自作農が住み、
    近所では、ピレモンと呼ばれていた。
    彼は、親切にも、この聖人たちを招き、
    貧しい小屋で、一夜を明かさせた。
    人をもてなすのが好きな老人は、
    バウキス婆さんに、火をつぎ足すよう言い、
    自分は、炉の中の鉤から、
    塩漬け豚肉の片身を外し、
    いちばん脂ののった所から、惜しみなく、
    炒めるため、大きく何枚も切り取った。
    それから、飲み物を取りに、脇へ行き、
    大きな水差しへ、縁いっぱいに注ぎ、
    きちんと、二度回したのを見た。
    ところが、不思議なことに、気づいたのだ、
    相変わらず、口まで満たされ、
    まるで、一滴も口をつけなかったようなのだ。
    善良な老夫婦は、驚き、
    何度も、互いの顔を見た。
    二人とも、心の底から怯え、
    「何者なのだ！」と叫びかけ、
    それから、そっと脇を向いて確かめた、
    明かりが、青く燃えてはいないかと。
    穏やかな巡礼たちは、すぐに気づき、
    自分たちの仕事と、旅の目的を告げた。
    「善良な人々よ、怖がることはない、
    ただの聖人だ」と、隠者たちは言った。
    「お前たちにも、家族にも、害は及ばぬ。
    ただし、あの無礼な田舎者ども、
    キリスト教徒の土地に住む資格のない連中は、
    家々ともども、水に沈めてやろう。
    その間に、お前たちの家は立ち上がり、
    目の前で、教会に変わるだろう。」
  "translation_status": "reviewed"

  "translation_ja": |-
    粥椀は、一列に、
    高く掛けられ、きらきらしていたが、
    もっと卑しい材質へ変わり、
    今では、革の手桶が並ぶばかり。
  "translation_status": "reviewed"
- "id": "bp-v1-stanza-09"
  "section_id": "version-1"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      The ballads, pasted on the wall,
    Of Chevy Chase, and English Mall,[3]
    Fair Rosamond, and Robin Hood,
    The little Children in the Wood,
    Enlarged in picture, size, and letter,
    And painted, lookt abundance better,
    And now the heraldry describe
    Of a churchwarden, or a tribe.
    A bedstead of the antique mode,
    Composed of timber many a load,
    Such as our grandfathers did use,
    Was metamorphos'd into pews;
    Which yet their former virtue keep
    By lodging folk disposed to sleep.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[79]"
    "line_start": 4131
    "line_end": 4144
  "translation_ja": |-
    壁に貼ってあった、物語歌、
    『チェヴィー・チェイス』に『イングランドのモール』、[3]
    『美しきロザモンド』に『ロビン・フッド』、
    『森の中の幼い子供たち』は、
    絵も、大きさも、文字も拡大され、
    色を塗られて、ずっと立派に見え、
    今では、教会委員か、部族の、
    紋章を描き出すものとなった。
    昔ふうの寝台は、
    何車分もの木材でできた、
    祖父たちが、使ったような代物で、
    教会の腰掛けへ姿を変えた。
    それでも、昔の長所は残し、
    眠りたい人々を、寝かせてくれる。
  "translation_status": "reviewed"
- "id": "bp-v1-stanza-10"
  "section_id": "version-1"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      The cottage, with such feats as these,
    Grown to a church by just degrees,
    The holy men desired their host
    To ask for what he fancied most.
    Philemon, having paused a while,
    Replied in complimental style:
    "Your goodness, more than my desert,
    Makes you take all things in good part:
    You've raised a church here in a minute,
    And I would fain continue in it;
    I'm good for little at my days,
    Make me the parson if you please."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[79]"
    "line_start": 4145
    "line_end": 4156
  "translation_ja": |-
    こうした、あれこれの技によって、
    家が、順々に教会へ育つと、
    聖人たちは、主人へ勧めた、
    いちばん欲しいものを、願いなさいと。
    ピレモンは、しばらく考え、
    丁重な言葉で答えた。
    「私の値打ちより、お慈悲のほうが勝るので、
    何もかも、よいように受け取ってくださいます。
    あっという間に、ここへ教会を建ててくださり、
    私は、このまま住み続けたいのです。
    この歳では、大して役にも立てません。
    どうか、ここの牧師にしてください。」
  "translation_status": "reviewed"
- "id": "bp-v1-stanza-11"
  "section_id": "version-1"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      He spoke, and presently he feels
    His grazier's coat reach down his heels;
    The sleeves new border'd with a list,
    Widen'd and gather'd at his wrist,
    But, being old, continued just
    As threadbare, and as full of dust.
    A shambling awkward gait he took,
    With a demure dejected look,
    Talk't of his offerings, tythes, and dues,
    Could smoke and drink and read the news,
    Or sell a goose at the next town,
    Decently hid beneath his gown.
    Contriv'd to preach old sermons next,
    Chang'd in the preface and the text.
    At christ'nings well could act his part,
    And had the service all by heart;
    Wish'd women might have children fast,
    And thought whose sow had farrow'd last;
    Against dissenters would repine.
    And stood up firm for "right divine;"
    Carried it to his equals higher,
    But most obedient to the squire.
    Found his head fill'd with many a system;
    But classic authors,—he ne'er mist 'em.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[79]"
    "line_start": 4157
    "line_end": 4180
  "translation_ja": |-
    そう言うと、たちまち気づいた、
    牧畜業者の上着が、踵まで延びている。
    袖には、新たに縁飾りがつき、
    広がってから、手首で絞られた。
    だが、古着であるから、相変わらず、
    すり切れ、埃だらけなのは同じ。
    ぎこちなく、足を引きずって歩き、
    すまし顔で、うつむいた。
    話すのは、献金、十分の一税、納付金、
    煙草を吸い、酒を飲み、新聞を読み、
    隣町では、鵞鳥も売れた、
    法衣の下へ、行儀よく隠して。
    次には、古い説教をする工夫をした、
    前置きと、引用聖句を取り替えて。
    洗礼式では、役をうまく務め、
    式文は、すっかり暗記していた。
    女たちが、次々子を産むのを願い、
    最後に子を産んだのは、誰の雌豚だったかと考えた。
    非国教徒には、不平を鳴らし、
    「神授の権利」を、断固として擁護した。
    同輩には、偉そうに振る舞ったが、
    地主には、ひたすら従順だった。
    頭は、多くの学説で満ちたが、
    古典の著者がなくても、少しも困らなかった。
  "translation_status": "reviewed"
- "id": "bp-v1-stanza-12"
  "section_id": "version-1"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      Thus having furbish'd up a parson,
    Dame Baucis next they play'd their farce on.
    Instead of homespun coifs, were seen
    Good pinners edg'd with colberteen;[4]
    Her petticoat, transform'd apace,
    Became black satin, flounced with lace.
    "Plain Goody" would no longer down,
    'Twas "Madam," in her grogram gown.
    Philemon was in great surprise,
    And hardly could believe his eyes.
    Amaz'd to see her look so prim,
    And she admir'd as much at him.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[79]"
    "line_start": 4181
    "line_end": 4192
  "translation_ja": |-
    こうして、牧師を仕立て上げると、
    次に、バウキス婆さんへ茶番を仕掛けた。
    手織りの頭巾に代わって、
    コルベルティーンで縁取った、立派な垂れ布の頭飾り。[4]
    ペティコートは、たちまち姿を変え、
    レースの襞飾りのついた、黒いサテンとなった。
    ただの「婆さん」では、もう通用しない、
    グログラムの服を着れば、「奥様」だった。
    ピレモンは、たいそう驚き、
    自分の目を、ほとんど信じられなかった。
    妻が、あんなにおすましなのに驚き、
    妻も、同じほど夫に驚いた。
  "translation_status": "reviewed"
- "id": "bp-v1-stanza-13"
  "section_id": "version-1"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      Thus happy in their change of life,
    Were several years this man and wife:
    When on a day, which prov'd their last,
    Discoursing o'er old stories past,
    They went by chance, amidst their talk,
    To the churchyard, to take a walk;
    When Baucis hastily cry'd out,
    "My dear, I see your forehead sprout!"—
    "Sprout;" quoth the man; "what's this you tell us?
    I hope you don't believe me jealous!
    But yet, methinks, I feel it true,
    And really yours is budding too—
    Nay,—now I cannot stir my foot;
    It feels as if 'twere taking root."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[79]"
    "line_start": 4193
    "line_end": 4206
  "translation_ja": |-
    こうして、変わった暮らしを幸せに、
    夫婦は、幾年か過ごした。
    やがて、最後となった、ある日、
    昔の物語を、あれこれ話し、
    喋りながら、ふと歩いていった、
    教会の墓地へ、散歩するために。
    すると、バウキスが、急に叫んだ。
    「あなた、額から芽が出ているわ！」
    「芽だと？」と夫は言った。「何を言う？
    まさか、私をやきもち焼きだと思うまいな！
    だが、どうも本当らしい、感じがする。
    それに、お前にも芽が出ているぞ。
    おや、もう、足が動かせぬ、
    根を張っているような気がする。」
  "translation_status": "reviewed"
- "id": "bp-v1-stanza-14"
  "section_id": "version-1"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      Description would but tire my Muse,
    In short, they both were turn'd to yews.
    Old Goodman Dobson of the Green
    Remembers he the trees has seen;
    He'll talk of them from noon till night,
    And goes with folk to show the sight;
    On Sundays, after evening prayer,
    He gathers all the parish there;
    Points out the place of either yew,
    Here Baucis, there Philemon, grew:
    Till once a parson of our town,
    To mend his barn, cut Baucis down;
    At which, 'tis hard to be believ'd
    How much the other tree was griev'd,
    Grew scrubby, dy'd a-top, was stunted,
    So the next parson stubb'd and burnt it.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[79]"
    "line_start": 4207
    "line_end": 4222
  "translation_ja": |-
    描き続けても、詩神が疲れるだけ。
    要するに、二人はイチイとなった。
    村の緑地の、老ドブソン爺さんは、
    あの木々を見たのを、覚えている。
    昼から夜まで、その話をし、
    人々についていって、見せてくれる。
    日曜には、夕べの祈りのあと、
    教区の皆を、そこへ集め、
    二本のイチイの場所を、指し示す、
    ここにバウキス、そこにピレモンが育ったと。
    ところが、あるとき、この町の牧師が、
    納屋の修繕に、バウキスを切り倒した。
    それで、もう一本が、どれほど悲しんだかは、
    信じがたいほどだった。
    枝は貧弱になり、梢が枯れ、成長も止まったので、
    次の牧師が、根ごと抜いて燃やした。
  "translation_status": "reviewed"

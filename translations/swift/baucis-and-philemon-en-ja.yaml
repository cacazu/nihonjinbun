    "line_end": 4359
  "translation_ja": |-
    粥椀は、一列に、
    高く掛けられ、きらきらしていたが、
    もっと卑しい材質へ変わり、
    今では、革の手桶が並ぶばかり。
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-09"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      The ballads, pasted on the wall,
    Of Joan[2] of France, and English Mall,[3]
    Fair Rosamond, and Robin Hood,
    The little Children in the Wood,
    Now seem'd to look abundance better,
    Improved in picture, size, and letter:
    And, high in order plac'd, describe
    The heraldry of ev'ry tribe.[4]
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4360
    "line_end": 4367
  "translation_ja": |-
    壁に貼ってあった、物語歌、
    フランスのジャンヌ[2]と、イングランドのモール[3]、
    『美しきロザモンド』に『ロビン・フッド』、
    『森の中の幼い子供たち』は、
    今では、ずっと立派に見えた、
    絵も、大きさも、文字も、よくなって。
    高い所へ、整然と据えられ、
    部族それぞれの紋章を、描き出す。[4]
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-10"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      A bedstead of the antique mode,
    Compact of timber many a load,
    Such as our ancestors did use,
    Was metamorphos'd into pews;
    Which still their ancient nature keep
    By lodging folk disposed to sleep.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4368
    "line_end": 4373
  "translation_ja": |-
    昔ふうの寝台は、
    何車分もの木材を組み合わせた、
    先祖たちが、使ったような代物で、
    教会の腰掛けへ姿を変えた。
    それでも、昔の性質は残し、
    眠りたい人々を、寝かせてくれる。
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-11"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      The cottage, by such feats as these,
    Grown to a church by just degrees,
    The hermits then desired their host
    To ask for what he fancy'd most.
    Philemon, having paused a while,
    Return'd them thanks in homely style;
    Then said, "My house is grown so fine,
    Methinks, I still would call it mine.
    I'm old, and fain would live at ease;
    Make me the parson if you please."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4374
    "line_end": 4383
  "translation_ja": |-
    こうした、あれこれの技によって、
    家が、順々に教会へ育つと、
    隠者たちは、主人へ勧めた、
    いちばん欲しいものを、願いなさいと。
    ピレモンは、しばらく考え、
    飾らぬ言葉で、礼を述べた。
    それから言った。「我が家は、こんなに立派になり、
    このまま、我が物と呼んでいたい気がします。
    歳も取り、楽に暮らしたいのです。
    どうか、ここの牧師にしてください。」
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-12"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      He spoke, and presently he feels
    His grazier's coat fall down his heels:
    He sees, yet hardly can believe,
    About each arm a pudding sleeve;
    His waistcoat to a cassock grew,
    And both assumed a sable hue;
    But, being old, continued just
    As threadbare, and as full of dust.
    His talk was now of tithes and dues:
    Could smoke his pipe, and read the news;
    Knew how to preach old sermons next,
    Vamp'd in the preface and the text;
    At christ'nings well could act his part,
    And had the service all by heart;
    Wish'd women might have children fast,
    And thought whose sow had farrow'd last;
    Against dissenters would repine,
    And stood up firm for "right divine;"
    Found his head fill'd with many a system;
    But classic authors,—he ne'er mist 'em.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4384
    "line_end": 4403
  "translation_ja": |-
    そう言うと、たちまち気づいた、
    牧畜業者の上着が、踵まで垂れている。
    目にしても、ほとんど信じられぬ、
    両腕の周りに、膨らんだ袖。
    胴着は、カソックへと変わり、
    どちらも、黒い色となった。
    だが、古着であるから、相変わらず、
    すり切れ、埃だらけなのは同じ。
    今や、話すのは、十分の一税と納付金、
    パイプで煙草を吸い、新聞を読めた。
    次には、古い説教をする術を心得た、
    前置きと、引用聖句を、つぎはぎして。
    洗礼式では、役をうまく務め、
    式文は、すっかり暗記していた。
    女たちが、次々子を産むのを願い、
    最後に子を産んだのは、誰の雌豚だったかと考えた。
    非国教徒には、不平を鳴らし、
    「神授の権利」を、断固として擁護した。
    頭は、多くの学説で満ちたが、
    古典の著者がなくても、少しも困らなかった。
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-13"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      Thus having furbish'd up a parson,
    Dame Baucis next they play'd their farce on.
    Instead of homespun coifs, were seen
    Good pinners edg'd with colberteen;
    Her petticoat, transform'd apace,
    Became black satin, flounced with lace.
    "Plain Goody" would no longer down,
    'Twas "Madam," in her grogram gown.
    Philemon was in great surprise,
    And hardly could believe his eyes.
    Amaz'd to see her look so prim,
    And she admir'd as much at him.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4404
    "line_end": 4415
  "translation_ja": |-
    こうして、牧師を仕立て上げると、
    次に、バウキス婆さんへ茶番を仕掛けた。
    手織りの頭巾に代わって、
    コルベルティーンで縁取った、立派な垂れ布の頭飾り。
    ペティコートは、たちまち姿を変え、
    レースの襞飾りのついた、黒いサテンとなった。
    ただの「婆さん」では、もう通用しない、
    グログラムの服を着れば、「奥様」だった。
    ピレモンは、たいそう驚き、
    自分の目を、ほとんど信じられなかった。
    妻が、あんなにおすましなのに驚き、
    妻も、同じほど夫に驚いた。
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-14"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      Thus happy in their change of life,
    Were several years this man and wife:
    When on a day, which prov'd their last,
    Discoursing o'er old stories past,
    They went by chance, amidst their talk,
    [5]To the churchyard to take a walk;
    When Baucis hastily cry'd out,
    "My dear, I see your forehead sprout!"—
    "Sprout;" quoth the man; "what's this you tell us?
    I hope you don't believe me jealous!
    But yet, methinks, I feel it true,
    And really yours is budding too—Nay,—now
    I cannot stir my foot;
    It feels as if 'twere taking root."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4416
    "line_end": 4429
  "translation_ja": |-
    こうして、変わった暮らしを幸せに、
    夫婦は、幾年か過ごした。
    やがて、最後となった、ある日、
    昔の物語を、あれこれ話し、
    喋りながら、ふと歩いていった、
    [5]教会の墓地へ、散歩するために。
    すると、バウキスが、急に叫んだ。
    「あなた、額から芽が出ているわ！」
    「芽だと？」と夫は言った。「何を言う？
    まさか、私をやきもち焼きだと思うまいな！
    だが、どうも本当らしい、感じがする。
    それに、お前にも芽が出ているぞ——おや、もう、
    足が動かせぬ、
    根を張っているような気がする。」
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-15"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      Description would but tire my Muse,
    In short, they both were turn'd to yews.
    Old Goodman Dobson of the Green
    Remembers he the trees has seen;
    He'll talk of them from noon till night,
    And goes with folk to show the sight;
    On Sundays, after evening prayer,
    He gathers all the parish there;
    Points out the place of either yew,
    Here Baucis, there Philemon, grew:
    Till once a parson of our town,
    To mend his barn, cut Baucis down;
    At which, 'tis hard to be believ'd
    How much the other tree was griev'd,
    Grew scrubby, dy'd a-top, was stunted,
    So the next parson stubb'd and burnt it.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4430
    "line_end": 4445
  "translation_ja": |-
    描き続けても、詩神が疲れるだけ。
    要するに、二人はイチイとなった。
    村の緑地の、老ドブソン爺さんは、
    あの木々を見たのを、覚えている。
    昼から夜まで、その話をし、
    人々についていって、見せてくれる。
    日曜には、夕べの祈りのあと、
    教区の皆を、そこへ集め、
    二本のイチイの場所を、指し示す、
    ここにバウキス、そこにピレモンが育ったと。
    ところが、あるとき、この町の牧師が、
    納屋の修繕に、バウキスを切り倒した。
    それで、もう一本が、どれほど悲しんだかは、
    信じがたいほどだった。
    枝は貧弱になり、梢が枯れ、成長も止まったので、
    次の牧師が、根ごと抜いて燃やした。
  "translation_status": "reviewed"

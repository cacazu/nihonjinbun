    "line_end": 4321
  "translation_ja": |-
    言い終わるか終わらぬうちに、静かに、ゆっくり、
    屋根が、高く上がり始めた。
    梁も垂木も、ことごとく上がり、
    重たい壁も、ゆっくり、あとから登った。
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-05"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      The chimney widen'd, and grew higher
    Became a steeple with a spire.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4322
    "line_end": 4323
  "translation_ja": |-
    煙突は、幅も高さも増し、
    尖塔のついた、鐘楼となった。
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-06"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      The kettle to the top was hoist,
    And there stood fasten'd to a joist,
    But with the upside down, to show
    Its inclination for below:
    In vain; for a superior force
    Applied at bottom stops its course:
    Doom'd ever in suspense to dwell,
    'Tis now no kettle, but a bell.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4324
    "line_end": 4331
  "translation_ja": |-
    釜は、てっぺんへ吊り上げられ、
    そこで、梁へしっかり留められた。
    ただし逆さまで、下のほうへ、
    行きたがる気持ちを示している。
    だが無駄だ。それに勝る力が、
    底へ加わり、動きを止めている。
    いつまでも、宙ぶらりんと定められ、
    もはや釜ではなく、鐘となった。
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-07"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      A wooden jack, which had almost
    Lost by disuse the art to roast,
    A sudden alteration feels,
    Increas'd by new intestine wheels;
    And, what exalts the wonder more,
    The number made the motion slower.
    The flyer, though it had leaden feet,
    Turn'd round so quick you scarce could see't;
    But, slacken'd by some secret power,
    Now hardly moves an inch an hour.
    The jack and chimney, near ally'd,
    Had never left each other's side;
    The chimney to a steeple grown,
    The jack would not be left alone;
    But, up against the steeple rear'd,
    Became a clock, and still adher'd;
    And still its love to household cares,
    By a shrill voice at noon, declares,
    Warning the cookmaid not to burn
    That roast meat, which it cannot turn.
    The groaning-chair began to crawl,
    Like an huge snail, half up the wall;
    There stuck aloft in public view,
    And with small change, a pulpit grew.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[81]"
    "line_start": 4332
    "line_end": 4355
  "translation_ja": |-
    木製の焼き串回しは、ほとんど、
    使われぬまま、肉を焼く技を忘れていたが、
    突然、変化を感じ、
    中には、新しい歯車が増えた。
    しかも、不思議を増すことには、
    数が増えると、動きは遅くなった。
    鉛の足のついた、回転する羽根は、
    もとは、ほとんど見えぬほど速く回ったのに、
    ある秘密の力に、速度を落とされ、
    今は、一時間に、一インチも動かぬほど。
    串回しと煙突は、近しい仲で、
    互いのそばを、離れたことがなかった。
    煙突が、鐘楼となったからには、
    串回しも、独り置いていかれはせず、
    鐘楼に沿って、高く据えられ、
    時計となって、なお寄り添った。
    今も、家事への愛着を、
    正午の鋭い声で告げる。
    料理女中に、焦がさぬよう注意するのだ、
    自分には、もう回せない焼き肉を。
    産婦の椅子は、這い始めた、
    巨大な蝸牛のように、壁の半ばまで。
    高い所で貼りつき、人目にさらされ、
    わずかに姿を変え、説教壇となった。
  "translation_status": "reviewed"
- "id": "bp-v2-stanza-08"
  "section_id": "version-2"
  "kind": "verse"
  "origin": "source"
  "source_text": |2-
      The porringers, that in a row
    Hung high, and made a glitt'ring show,
    To a less noble substance chang'd,
    Were now but leathern buckets rang'd.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"

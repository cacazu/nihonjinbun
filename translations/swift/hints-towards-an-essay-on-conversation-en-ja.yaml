  "source_text": |-
    HINTS TOWARDS AN ESSAY ON CONVERSATION.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"

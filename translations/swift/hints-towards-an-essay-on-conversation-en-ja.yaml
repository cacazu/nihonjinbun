  "translation_ja": |-
    何の重要さもなく、毎日どこにでも起きる、ごく普通の出来事から少しも外れない事実を語るだけで、自分の役目を十分に果たし、一座を楽しませていると思う人々がいる。私は、このことを、ほかのどの国民よりも、スコットランド人の間で多く見かけた。彼らは、時や場所の、どんな細かな事情も省かないよう、たいへん気をつける。そうした話は、その国特有の、奇妙な語や言い回し、なまりや身振りに、多少救われなければ、ほとんど耐えられないだろう。人中でたくさん話すことは、欠点ではない。だが、長く話し続けることは、確かに欠点である。集まった人々の大半が、生まれつき無口であったり、用心深かったりする場合、新しい話題を持ち出せる誰かが、たびたび会話を立て直さなければ、話は途切れがちになる。ただし、その話題にいつまでも居座らず、答えや応酬の余地を残しておくことが条件である。

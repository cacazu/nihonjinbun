  "translation_ja": |-
    このような会話の堕落と、それが私たちの気質や性向に及ぼす有害な結果には、いくつかの原因があるが、その一つは、近年生じた、賭け事や踊りの集まり、あるいは恋愛の追求を除けば、女を私たちの交際から締め出す習慣である。イングランドでもっとも礼節が栄えた時期は、チャールズ一世の治世の、平和だったころだと私は考える。フランスでも同じ時期である。当時の記録や、その宮廷で暮らしていた人々から、以前聞いた話によれば、そのころ、会話を高め、育てるために用いられた方法は、私たちのものとは、まるで違っていた。同時代の詩人たちにたたえられている、何人かの婦人は、自宅で集まりを開いていた。そこには、男女を問わず、もっとも理解力のすぐれた人々が集まり、その場で持ち出される、どんな愉快な主題についてでも語り合い、夕べを過ごしたのである。私たちは、彼らが恋愛や友情について抱き、あるいは演じていた、高尚なプラトン風の観念を笑いがちだが、その洗練は理性に根ざしていたと私は思う。そして、ほんの少しのロマンスは、人間性の尊厳を守り、高めるための、悪くない材料である。それがなければ、人間性は、卑しく、悪く、低いものへと、いくらでも堕ちやすい。婦人と会話することに、ほかに何の効用もないとしても、わが北国の粗野な気質が、つい陥りがちな、みだらで下品な、不快な話題を抑えるだけで、十分なのである。だから、公園や芝居小屋で、仮面をつけた女を楽しませるのが、あれほど巧みな、町の陽気な紳士たちが、貞淑で名誉ある婦人たちの前では、黙り込み、うろたえ、勝手が違ってしまうのは、注目すべきことである。

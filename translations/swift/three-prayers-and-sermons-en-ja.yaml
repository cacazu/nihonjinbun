  "translation_ja": "第一の祈り"
  "translation_status": "reviewed"
- "id": "prayers-005"
  "section_id": "prayer-1"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Almighty and most gracious Lord God, extend, we beseech Thee, Thy pity and compassion toward this Thy languishing servant; teach her to place her hope and confidence entirely in Thee; give her a true sense of the emptiness and vanity of all earthly things; make her truly sensible of all the infirmities of her life past, and grant to her such a true sincere repentance as is not to be repented of. Preserve her, O Lord, in a sound mind and understanding during this Thy visitation; keep her from both the sad extremes of presumption and despair. If Thou shalt please to restore her to her former health, give her grace to be ever mindful of that mercy, and to keep those good resolutions she now makes in her sickness, so that no length of time nor prosperity may entice her to forget them. Let no thought of her misfortunes distract her mind, and prevent the means toward her recovery, or disturb her in her preparations for a better life. We beseech thee also, O Lord, of Thy infinite goodness, to remember the good actions of this Thy servant; that the naked she hath clothed, the hungry she hath fed, the sick and the fatherless whom she hath relieved, may be reckoned according to Thy gracious promise, as if they had been done unto Thee. Hearken, O Lord, to the prayers offered up by the friends of this Thy servant in her behalf, and especially those now made by us unto thee. Give Thy blessing to those endeavours used for her recovery; but take from her all violent desire either of life or death, further than with resignation to Thy holy will. And now, O Lord, we implore Thy gracious favour toward us here met together. Grant that the sense of this Thy servant’s weakness may add strength to our faith; that we, considering the infirmities of our nature and the uncertainty of life, may by this example be drawn to repentance before it shall please Thee to visit us in like manner. Accept these prayers, we beseech Thee, for the sake of Thy dear Son Jesus Christ, our Lord, who, with Thee and the Holy Ghost, liveth and reigneth, ever one God, world without end. Amen.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[3]"
    "source_sequence": 5
  "translation_ja": |-
    全能にして、いと恵み深い主なる神よ、衰えゆくあなたのこのしもべに、どうか憐れみと慈しみをおかけください。希望も信頼もひたすらあなたに置くことを教え、地上のものはすべて空しく、はかないと心から悟らせてください。これまでの生涯の弱さを残らず深く自覚させ、悔いを残すことのない、真実で誠実な悔い改めをお与えください。主よ、あなたがこうしてお試しになる間も、彼女の心と判断を健やかに保ち、思い上がりと絶望という、二つの悲しい極端からお守りください。もし以前の健康をお返しくださるなら、その憐れみをいつまでも心にとどめ、病の床で今立てている善い決意を守り続ける恵みをお授けください。どれほど時が過ぎても、どれほど暮らしが栄えても、その決意を忘れる誘惑に負けないようにしてください。不幸を思いわずらうことで心が乱れ、回復のための手だてが妨げられたり、よりよい命への備えが乱されたりすることのないようにしてください。また主よ、あなたの限りない慈しみによって、このしもべの善い行いを覚えていてくださるよう、お願いいたします。衣のない者に着せ、飢えた者に食べさせ、病人や父のない子を助けたことを、恵み深いお約束のとおり、あなたご自身にしたこととしてお認めください。このしもべのために友人たちがささげる祈り、とりわけ今ここで私たちがあなたにささげる祈りにお耳をお傾けください。回復のために尽くされる努力を祝福してください。ただし、生きることにも死ぬことにも、あなたの聖なる御心に従う範囲を越えて激しく執着することのないようにしてください。そして今、主よ、ここに集まった私たちにも、恵み深い慈しみをお願いいたします。このしもべの弱さを身に感じることが、私たちの信仰をいっそう強めますように。私たち自身の性質の弱さと命の不確かさを思い、この姿を戒めとして、あなたが同じように私たちをお試しになるより前に、悔い改めへと導かれますように。どうか、あなたの愛する御子、私たちの主イエス・キリストのために、この祈りをお受け入れください。主はあなたと聖霊とともに、永遠にただ一人の神として生き、世の終わりなく治めておられます。アーメン。
  "translation_status": "reviewed"

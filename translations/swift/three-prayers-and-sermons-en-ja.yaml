    "source_sequence": 9
  "translation_ja": |-
    憐れみ深い父よ、あなたが御自分の子らを苦しめられるのは、ただその者たちの益のためであり、正義にかなってのことです。しかもその正義には、常にあなたの憐れみがまさっています。悔い改めへと導くため、あるいは、よりよい命において報いるために今の世で罰するために、苦しみをお与えになるのです。あなたの御手の重みのもとで、かくも長く、かくも激しく衰え苦しむ、この哀れなしもべを、どうかお憐れみください。主よ、その弱さを支える力を与え、あなたの懲らしめを恨まず、痛みを忍ぶ忍耐をお授けください。心は変わらずまったくあなたの御心に従っていても、苦痛のために、ふと軽率で思慮に欠けた言葉が口をついて出ることがありましたら、どうか残らずお赦しください。主よ、生への激しい欲求を鎮め、あなたの憐れみへの、へりくだりながらも確かな希望を吹き込み、死への恐れを和らげてください。犯した罪も、なすべきことを怠った罪も、すべて心から悔い改めさせ、残された生涯を、あなたのあらゆる戒めを力の限り守るために費やす、固い決意をお与えください。また、思いを落ち着かせ、病の間も記憶と理性の働きを保ってくださるよう、お願いいたします。人間にかかわるものはすべて、空しく、愚かで、取るに足りないことを正しく悟らせ、苦しみのただ中でも、あなたへの誠実な愛が生まれるほどに強めてください。彼女の善い行いをすべてお受け入れになり、善として数えてください。また、あなたに対して犯した罪のうち、心から悔い改めたものや、記憶の弱さのために忘れてしまったものを、すべてお赦しください。そして今、主よ、私たち自身と、悲しむほかの友人たちのために、あなたを仰ぎます。私たちの悲しみが彼女の心を苦しめ、それによって今の病を悪くすることのないようにしてください。私たちのうち、これほど親しく、人々の役に立つ友を失う悲しみと恐れに耐えかねている者たちの、その悲嘆と弱さをお赦しください。この悪しき世にもうしばらく彼女をとどめてくださるようにと、切に祈り、願う私たちを、お受け入れになり、お赦しください。あなたが御自身への奉仕と呼んでくださることを、彼女が果たせますように。それはただ彼女の当然の務めにすぎませんが、そうしてなお私たちを慰め、語らいや助言や親切や施しの恩恵をこれからも必要とする、すべての人の慰めとなれますように。また、あなたは、二人か三人が御名によって集まるところには、そのただ中にいて願いをかなえると約束してくださいました。恵み深い主よ、御名によってここに集まった私たちの願いをおかなえください。苦しむあなたのこのしもべと私たち自身のために、今、心から誠実に、熱心にささげた願いが、私たちの主イエス・キリストの功績によって、確かに聞き届けられますように。アーメン。
  "translation_status": "reviewed"

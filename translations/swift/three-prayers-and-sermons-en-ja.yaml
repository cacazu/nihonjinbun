  "translation_ja": "この世の知恵について"
  "translation_status": "reviewed"
- "id": "prayers-060"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "“The wisdom of this world is foolishness with God.”—I Cor. iii. 19."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/blockquote[3]/p[1]"
    "source_sequence": 60
  "translation_ja": "「この世の知恵は、神の御前では愚かなものだからである。」――『コリントの信徒への手紙一』三章十九節"
  "translation_status": "reviewed"
- "id": "prayers-061"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    It is remarkable that about the time of our Saviour’s coming into the world all kinds of learning flourished to a very great degree, insomuch that nothing is more frequent in the mouths of many men, even such who pretend to read and to know, than an extravagant praise and opinion of the wisdom and virtue of the Gentile sages of those days, and likewise of those ancient philosophers who went before them, whose doctrines are left upon record, either by themselves or other writers. As far as this may be taken for granted, it may be said that the providence of God brought this about for several very wise ends and purposes; for it is certain that these philosophers had been a long time before searching out where to fix the true happiness of man; and not being able to agree upon any certainty about it, they could not possibly but conclude, if they judged impartially, that all their inquiries were in the end but vain and fruitless, the consequence of which must be not only an acknowledgment of the weakness of all human wisdom, but likewise an open passage hereby made for letting in those beams of light which the glorious sunshine of the Gospel then brought into the world, by revealing those hidden truths which they had so long before been labouring to discover, and fixing the general happiness of mankind beyond all controversy and dispute. And therefore the providence of God wisely suffered men of deep genius and learning then to arise, who should search into the truth of the Gospel now made known, and canvass its doctrines with all the subtilty and knowledge they were masters of, and in the end freely acknowledge that to be the true wisdom only “which cometh from above.”
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[51]"
    "source_sequence": 61
  "translation_ja": |-
    注目すべきことに、救い主がこの世に来られたころ、あらゆる種類の学問は大いに栄えていた。そのため、少なからぬ人々は、読書も知識もあると称する者まで含めて、当時の異教の賢者や、それ以前の古代の哲学者の知恵と徳を、しきりに大げさに褒め上げ、高く評価している。その教えは、本人またはほかの著述家によって記録され、今に残っている。こうした学問の繁栄を事実として認めるなら、神の摂理が、いくつかの深い知恵に基づく目的のために、それを生じさせたと言ってよい。なぜなら、これらの哲学者は、それよりずっと前から、人間の真の幸福をどこに置くべきか、探し続けていたのは確かだからだ。それなのに、何一つ確かな点で一致できなかった以上、公平に判断したなら、探究は結局むなしく、実りがなかったと結論せざるをえなかったはずである。そこからは、人間のあらゆる知恵の弱さを認めるだけでなく、そのころ、輝かしい福音の日の光が世にもたらした光線を、迎え入れる道も開けたはずだ。福音は、彼らがかくも長く苦労して見つけようとしていた隠れた真理を明らかにし、人類全体の幸福を、もはや論争も議論もできないところに定めたのである。それゆえ神の摂理は、深い才知と学識を持つ人々が、そのころ現れるのを、賢明にもお許しになった。彼らが、今や知らされた福音の真理を調べ、持てる限りの鋭さと知識でその教えを吟味し、ついには、「上から来る」知恵だけが真の知恵だと、自ら認めるためであった。
  "translation_status": "reviewed"
- "id": "prayers-062"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    However, to make a further inquiry into the truth of this observation, I doubt not but there is reason to think that a great many of those encomiums given to ancient philosophers are taken upon trust, and by a sort of men who are not very likely to be at the pains of an inquiry that would employ so much time and thinking. For the usual ends why men affect this kind of discourse appear generally to be either out of ostentation, that they may pass upon the world for persons of great knowledge and observation, or, what is worse, there are some who highly exalt the wisdom of those Gentile sages, thereby obliquely to glance at and traduce Divine revelation, and more especially that of the Gospel; for the consequence they would have us draw is this: that since those ancient philosophers rose to a greater pitch of wisdom and virtue than was ever known among Christians, and all this purely upon the strength of their own reason and liberty of thinking; therefore it must follow that either all revelation is false, or, what is worse, that it has depraved the nature of man, and left him worse than it found him.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[52]"
    "source_sequence": 62
  "translation_ja": |-
    しかし、この見方が本当に正しいかをさらに調べるなら、古代の哲学者にささげられる賛辞の多くは、受け売りであり、しかも、そのように時間と思索を要する調査の労を、とうてい取ろうとしそうにない種類の人々によるものだと考える理由が、確かにあると思う。というのも、人々がこの種の話を好んでする普通の目的は、たいてい、豊かな知識と観察力を持つ人だと世間に思わせるための見せびらかしであるか、さもなければ、もっと悪いものだからだ。異教の賢者たちの知恵を大いに持ち上げ、それによって神の啓示、とりわけ福音の啓示に、遠回しな当てこすりや中傷を加えようとする者がいる。その者たちが私たちに導かせたい結論は、こうである。古代の哲学者たちは、自分の理性と自由な思索の力だけで、キリスト者の間ではかつて知られなかったほど高い知恵と徳に達した。したがって、啓示はすべて偽りであるか、あるいは、さらに悪いことに、人間の本性を堕落させ、啓示に出会う前より悪くしてしまったに違いない、というのである。
  "translation_status": "reviewed"
- "id": "prayers-063"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    But this high opinion of heathen wisdom is not very ancient in the world, nor at all countenanced from primitive times. Our Saviour had but a low esteem of it, as appears by His treatment of the Pharisees and Sadducees, who followed the doctrines of Plato and Epicurus. St. Paul likewise, who was well versed in all the Grecian literature, seems very much to despise their philosophy, as we find in his writings, cautioning the Colossians to “beware lest any man spoil them through philosophy and vain deceit;” and in another place he advises Timothy to “avoid profane and vain babblings, and oppositions of science falsely so called;” that is, not to introduce into the Christian doctrine the janglings of those vain philosophers, which they would pass upon the world for science. And the reasons he gives are, first, that those who professed them did err concerning the faith; secondly, because the knowledge of them did increase ungodliness, vain babblings being otherwise expounded vanities or empty sounds; that is, tedious disputes about words, which the philosophers were always so full of, and which were the natural product of disputes and dissensions between several sects.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[53]"
    "source_sequence": 63
  "translation_ja": |-
    だが、異教の知恵をこれほど高く評価することは、世の中でそれほど古いものでもなく、初期の時代から少しも支持されていない。救い主はそれを低く評価しておられた。プラトンとエピクロスの教えに従っていたファリサイ派やサドカイ派に、どのように接しておられたかを見ればわかる。同じく、ギリシアのあらゆる学芸に通じた聖パウロも、その著作からわかるとおり、彼らの哲学を大いに軽蔑しているように見える。コロサイの人々には、「哲学や空しい欺きによって、誰にもとりこにされないよう気をつけよ」と警告し、別の箇所ではテモテに、「俗悪で空虚なおしゃべりと、知識と偽って呼ばれるものの反論を避けよ」と勧めている。つまり、空しい哲学者たちが知識として世に通そうとする、あのやかましい言い争いを、キリスト教の教えに持ち込むな、ということである。その理由として、第一に、そういうものを公言する者は信仰を踏み外したこと、第二に、それを知ることが不敬虔を増したことを挙げる。「空虚なおしゃべり」は、空しいこと、または空っぽの音とも解される。すなわち、哲学者たちがいつも熱中していた、言葉についての退屈な論争であり、諸学派の争いや不和から自然に生じたものを指している。
  "translation_status": "reviewed"
- "id": "prayers-064"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Neither had the primitive fathers any great or good opinion of the heathen philosophy, as is manifest from several passages in their writings; so that this vein of affecting to raise the reputation of those sages so high Is a mode and a vice but of yesterday, assumed chiefly, as I have said, to disparage revealed knowledge and the consequences of it among us.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[54]"
    "source_sequence": 64
  "translation_ja": |-
    初期の教父たちも、異教の哲学を高く、あるいは好意的に評価していなかったことは、その著作のいくつもの箇所から明らかである。したがって、あの賢者たちの評判を好んであれほど高く持ち上げる風潮は、昨日今日の流行であり、悪癖にすぎない。述べたとおり、主として、啓示された知と、それが私たちにもたらすものを、おとしめるために取り入れられたのである。
  "translation_status": "reviewed"
- "id": "prayers-065"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Now, because this is a prejudice which may prevail with some persons so far as to lessen the influence of the Gospel, and whereas, therefore, this is an opinion which men of education are likely to be encountered with when they have produced themselves into the world, I shall endeavour to show that their preference of heathen wisdom and virtue before that of the Christian is every way unjust, and grounded upon ignorance or mistake; in order to which I shall consider four things:—
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[55]"
    "source_sequence": 65
  "translation_ja": |-
    さて、この偏見が人によっては強く働き、福音の影響を弱めるほどになるかもしれない。またそれゆえ、教育を受けた人々が世に出れば、この意見に出会うことも十分ありうる。そこで私は、異教の知恵と徳をキリスト教のものより上に置くのは、あらゆる点で不当であり、無知か誤解に基づくことを示したい。そのため、四つの事柄を考える。
  "translation_status": "reviewed"
- "id": "prayers-066"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    First, I shall produce certain points wherein the wisdom and virtue of all unrevealed philosophy in general fell short and was very imperfect.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[56]"
    "source_sequence": 66
  "translation_ja": "第一に、啓示によらない哲学全般の知恵と徳が、どのような点で不足し、甚だしく不完全だったかを挙げる。"
  "translation_status": "reviewed"
- "id": "prayers-067"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Secondly, I shall show, in several instances, where some of the most renowned philosophers have been grossly defective in their lessons of morality.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[57]"
    "source_sequence": 67
  "translation_ja": "第二に、最も名高い哲学者のうちの何人かが、道徳の教えにおいて甚だしく不十分だった点を、いくつかの例で示す。"
  "translation_status": "reviewed"
- "id": "prayers-068"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thirdly, I shall prove the perfection of Christian wisdom from the proper characters and marks\
    \ of it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[58]"
    "source_sequence": 68
  "translation_ja": "第三に、キリスト教の知恵に固有の性質としるしから、その完全さを証明する。"
  "translation_status": "reviewed"
- "id": "prayers-069"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Lastly, I shall show that the great examples of wisdom and virtue among the heathen wise men were produced by personal merit, and not influenced by the doctrine of any sect; whereas, in Christianity, it is quite the contrary.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[59]"
    "source_sequence": 69
  "translation_ja": "最後に、異教の賢者に見られる知恵と徳の偉大な実例は、いずれかの学派の教えに影響されて生まれたものではなく、個人の優れた資質によるものだったのに対し、キリスト教では、まったく逆であることを示す。"
  "translation_status": "reviewed"
- "id": "prayers-070"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    First, I shall produce certain points wherein the wisdom and virtue of all unrevealed philosophy in general fell short and was very imperfect.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[60]"
    "source_sequence": 70
  "translation_ja": "第一に、啓示によらない哲学全般の知恵と徳が、どのような点で不足し、甚だしく不完全だったかを挙げよう。"
  "translation_status": "reviewed"
- "id": "prayers-071"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    My design is to persuade men that Christian philosophy is in all things preferable to heathen wisdom; from which, or its professors, I shall, however, have no occasion to detract. They were as wise and as good as it was possible for them to be under such disadvantages, and would have probably been infinitely more so with such aids as we enjoy; but our lessons are certainly much better, however our practices may fall short.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[61]"
    "source_sequence": 71
  "translation_ja": |-
    私の目的は、キリスト教の哲学が、あらゆる点で異教の知恵にまさることを、人々に納得してもらうことである。ただし、そのために、異教の知恵や、それを説いた人々をけなす必要はない。あのような不利な条件のもとで、可能な限り、彼らは賢く、善良であった。私たちが享受するような助けがあったなら、おそらく、はるかにそうであったろう。しかし、私たちの実践がどれほど及ばなくても、教えそのものは、確かにはるかに優れているのである。
  "translation_status": "reviewed"
- "id": "prayers-072"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    The first point I shall mention is that universal defect which was in all their schemes, that they could not agree about their chief good, or wherein to place the happiness of mankind; nor had any of them a tolerable answer upon this difficulty to satisfy a reasonable person. For to say, as the most plausible of them did, “That happiness consisted in virtue,” was but vain babbling, and a mere sound of words to amuse others and themselves; because they were not agreed what this virtue was or wherein it did consist; and likewise, because several among the best of them taught quite different things, placing happiness in health or good fortune, in riches or in honour, where all were agreed that virtue was not, as I shall have occasion to show when I speak of their particular tenets.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[62]"
    "source_sequence": 72
  "translation_ja": |-
    最初に挙げたいのは、彼らのあらゆる体系に共通した欠陥である。最高善とは何か、人類の幸福をどこに置くべきかについて、一致できなかった。しかも、この難問に対し、理性ある人を納得させられる、まずまずの答えを持っていた者は、一人もいなかった。最ももっともらしいことを言う者たちがしたように、「幸福は徳にある」と言っても、それは空虚なおしゃべり、自他を楽しませるだけの言葉の響きにすぎなかった。その徳とは何か、何に成り立つのかについて、一致していなかったからだ。加えて、最良の哲学者のうちにも、まったく異なることを教え、幸福を健康や幸運、富や名誉に置いた者がいくらもいた。それらが徳ではないことには、皆が同意していたのである。これについては、個々の主張を述べるとき、また示す機会がある。
  "translation_status": "reviewed"
- "id": "prayers-073"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    The second great defect in the Gentile philosophy was that it wanted some suitable reward proportioned to the better part of man—his mind, as an encouragement for his progress in virtue. The difficulties they met with upon the score of this default were great, and not to be accounted for; bodily goods, being only suitable to bodily wants, are no rest at all for the mind; and if they were, yet are they not the proper fruits of wisdom and virtue, being equally attainable by the ignorant and wicked. Now human nature is so constituted that we can never pursue anything heartily but upon hopes of a reward. If we run a race, it is in expectation of a prize; and the greater the prize the faster we run; for an incorruptible crown, if we understand it and believe it to be such, more than a corruptible one. But some of the philosophers gave all this quite another turn, and pretended to refine so far as to call virtue its own reward, and worthy to be followed only for itself; whereas, if there be anything in this more than the sound of the words, it is at least too abstracted to become a universal influencing principle in the world, and therefore could not be of general use.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[63]"
    "source_sequence": 73
  "translation_ja": |-
    異教の哲学の第二の大きな欠陥は、徳の道を進む励ましとして、人間のより優れた部分、すなわち精神に見合う、適切な報いを欠いていたことだ。この欠如のために出会った難問は大きく、解き明かしがたかった。肉体のためによいものは、肉体の必要に見合うだけで、精神を少しも安らがせない。たとえ安らがせるとしても、知恵や徳にふさわしい実りではない。無知な者も悪人も、同じように手に入れられるからである。ところで人間の本性は、報いを望まなければ、何一つ心から追い求めることができないようにできている。競走するのは、賞を期待するからだ。賞が大きいほど、速く走る。朽ちない冠が本当にそういうものだと理解し、信じるなら、朽ちる冠を目指すより、いっそう速く走るだろう。ところが一部の哲学者は、これをすっかり別の方向へ曲げ、徳はそれ自身が報いであり、ただそれ自身のために追求するに値すると言うほどまで、考えを洗練したつもりになった。だが、その言葉の響き以上の意味があるとしても、少なくとも抽象的すぎて、世の人を普遍的に動かす原理にはなれず、したがって、広く役立つものにはなりえなかった。
  "translation_status": "reviewed"
- "id": "prayers-074"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    It was the want of assigning some happiness proportioned to the soul of man that caused many of them, either on the one hand, to be sour and morose, supercilious and untreatable, or, on the other, to fall into the vulgar pursuits of common men, to hunt after greatness and riches, to make their court and to serve occasions, as Plato did to the younger Dionysius, and Aristotle to Alexander the Great. So impossible it is for a man who looks no further than the present world to fix himself long in a contemplation where the present world has no part; he has no sure hold, no firm footing; he can never expect to remove the earth he rests upon while he has no support besides for his feet, but wants, like Archimedes, some other place whereon to stand. To talk of bearing pain and grief without any sort of present or future hope cannot be purely greatness of spirit; there must be a mixture in it of affectation and an alloy of pride, or perhaps is wholly counterfeit.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[64]"
    "source_sequence": 74
  "translation_ja": |-
    人間の魂に見合う幸福を定められなかったため、多くの哲学者は、一方では、不機嫌で気難しく、高慢で近寄りがたくなり、他方では、普通の人の俗な追求へと落ち込み、地位や富を追い、権力者に取り入り、機会に迎合した。プラトンが小ディオニュシオスに、アリストテレスがアレクサンドロス大王に対してしたように、である。この世より先を見ない人間が、この世とは関係のない観想に長くとどまることは、それほど不可能なのだ。確かな手がかりも、しっかりした足場もない。足を支えるものがほかにないのに、自分が乗っている地球を動かせると思っても、無理である。アルキメデスのように、ほかに立つ場所が要るのだ。現在にも未来にも何の希望もなしに、苦痛と悲しみに耐えるなどと言うのは、純粋に心が大きいからとは言えない。気取りが混じり、高慢という混ぜ物があるはずで、あるいは、まったくの見せかけなのかもしれない。
  "translation_status": "reviewed"
- "id": "prayers-075"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    It is true there has been all along in the world a notion of rewards and punishments in another life, but it seems to have rather served as an entertainment to poets or as a terror of children than a settled principle by which men pretended to govern any of their actions. The last celebrated words of Socrates, a little before his death, do not seem to reckon or build much upon any such opinion; and Cæsar made no scruple to disown it and ridicule it in open senate.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[65]"
    "source_sequence": 75
  "translation_ja": |-
    確かに、来世の報いと罰という考えは、昔から世にあった。しかしそれは、人々が行動を律するための確かな原理というより、詩人の楽しみや子供への脅しとして役立っていたように見える。ソクラテスが死の少し前に語った、あの有名な最後の言葉も、そのような考えを大して当てにせず、それに頼ってもいないようだし、カエサルは、元老院の公の席で、それをはばからず否定し、嘲ったのである。
  "translation_status": "reviewed"
- "id": "prayers-076"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Thirdly, the greatest and wisest of all their philosophers were never able to give any satisfaction to others and themselves in their notions of a deity. They were often extremely gross and absurd in their conceptions, and those who made the fairest conjectures are such as were generally allowed by the learned to have seen the system of Moses, if I may so call it, who was in great reputation at that time in the heathen world, as we find by Diodorus, Justin, Longinus, and other authors; for the rest, the wisest among them laid aside all notions after a deity as a disquisition vain and fruitless, which indeed it was upon unrevealed principles; and those who ventured to engage too far fell into incoherence and confusion.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[66]"
    "source_sequence": 76
  "translation_ja": |-
    第三に、彼らの最も偉大で賢い哲学者も、神についての考えでは、他人にも自分にも、納得できる答えを一度も与えられなかった。その理解はしばしば、はなはだ粗野で、ばかげていた。最もましな推測をした者たちは、いわばモーセの体系と呼べるものに触れたと、学識ある人々から一般に認められている者たちだった。ディオドロス、ユスティヌス、ロンギノスなどの著者からわかるように、モーセは当時の異教世界でも、大いに尊敬されていたのである。それ以外の者では、最も賢い者たちは、神をめぐる考えをすべて、むなしく実りのない探究として捨ててしまった。実際、啓示によらない原理では、そうならざるをえなかったし、あえて深く入り込んだ者は、筋の通らなさと混乱に陥った。
  "translation_status": "reviewed"
- "id": "prayers-077"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Fourthly, Those among them who had the justest conceptions of a Divine power, and did also admit a providence, had no notion at all of entirely relying and depending upon either; they trusted in themselves for all things, but as for a trust or dependence upon God, they would not have understood the phrase; it made no part of the profane style.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[67]"
    "source_sequence": 77
  "translation_ja": |-
    第四に、彼らの中で、神的な力を最も正しく理解し、摂理も認めていた者たちでさえ、そのどちらかに、まったく頼り、身を委ねるという考えを、少しも持っていなかった。何事においても自分を頼みとしたが、神を信頼し、神に依存するという言い方は、理解さえできなかっただろう。それは異教の言葉遣いには、なかったのである。
  "translation_status": "reviewed"
- "id": "prayers-078"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Therefore it was that, in all issues and events which they could not reconcile to their own sentiments of reason and justice, they were quite disconcerted; they had no retreat, but upon every blow of adverse fortune, either affected to be indifferent, or grew sullen and severe, or else yielded and sunk like other men.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[68]"
    "source_sequence": 78
  "translation_ja": |-
    だからこそ、理性や正義についての自分たちの考えと折り合いがつかない成り行きや出来事には、彼らはすっかりうろたえた。逃げ場がなかったのだ。不運が一撃を加えるたび、平気なふりをするか、むっつりと厳しくなるか、あるいは、ほかの人と同じように屈し、くずおれるかであった。
  "translation_status": "reviewed"
- "id": "prayers-079"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Having now produced certain points wherein the wisdom and virtue of all unrevealed philosophy fell short and was very imperfect, I go on, in the second place, to show, in several instances, where some of the most renowned philosophers have been grossly defective in their lessons of morality.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[69]"
    "source_sequence": 79
  "translation_ja": "これで、啓示によらない哲学全般の知恵と徳が不足し、甚だしく不完全だった点を、いくつか挙げた。続いて第二に、最も名高い哲学者のうちの何人かが、道徳の教えにおいて甚だしく不十分だった点を、いくつかの例で示そう。"
  "translation_status": "reviewed"
- "id": "prayers-080"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Thales, the founder of the Ionic sect, so celebrated for morality, being asked how a man might bear ill-fortune with greatest ease, answered, “By seeing his enemies in a worse condition.” An answer truly barbarous, unworthy of human nature, and which included such consequences as must destroy all society from the world.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[70]"
    "source_sequence": 80
  "translation_ja": |-
    道徳であれほど名高いイオニア学派の創始者タレスは、どうすれば不運に最もたやすく耐えられるかと尋ねられ、「敵がもっと悪い境遇にあるのを見ることだ」と答えた。実に野蛮で、人間性にふさわしくない答えである。その意味を推し進めれば、世のあらゆる社会を滅ぼさずにはいない。
  "translation_status": "reviewed"
- "id": "prayers-081"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Solon lamenting the death of a son, one told him, “You lament in vain.” “Therefore,” said he, “I lament, because it is in vain.” This was a plain confession how imperfect all his philosophy was, and that something was still wanting. He owned that all his wisdom and morals were useless, and this upon one of the most frequent accidents in life. How much better could he have learned to support himself even from David, by his entire dependence upon God, and that before our Saviour had advanced the notions of religion to the height and perfection wherewith He hath instructed His disciples!
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[71]"
    "source_sequence": 81
  "translation_ja": |-
    ソロンが息子の死を嘆いていると、ある者が「嘆いてもむだです」と言った。「だからこそ嘆くのだ。むだなのだから」と彼は答えた。これは、自分の哲学全体がいかに不完全で、なお何かを欠いていたかを、はっきり告白したものだった。自分の知恵も道徳も、すべて役に立たないと認めたのであり、しかも人生で最もよくある出来事の一つについて、そうだったのだ。神にまったく身を委ねたダビデだけからでも、もっとはるかによく、自分を支えるすべを学べたことだろう。それも、救い主が宗教の理解を高め、弟子たちに教えられた、あの高みと完全さへ導かれる以前のダビデから、である。
  "translation_status": "reviewed"
- "id": "prayers-082"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Plato himself, with all his refinements, placed happiness in wisdom, health, good fortune, honour, and riches, and held that they who enjoyed all these were perfectly happy; which opinion was indeed unworthy its owner, leaving the wise and good man wholly at the mercy of uncertain chance, and to be miserable without resource.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[72]"
    "source_sequence": 82
  "translation_ja": |-
    あれほど洗練されたプラトン自身も、幸福を知恵、健康、幸運、名誉、富に置き、これらをすべて享受する人は完全に幸福だと考えた。これは、その人にふさわしくない意見だった。賢く善い人を、不確かな偶然のなすがままに任せ、救いようもなく不幸になるに任せるからである。
  "translation_status": "reviewed"
- "id": "prayers-083"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    His scholar Aristotle fell more grossly into the same notion, and plainly affirmed, “That virtue, without the goods of fortune, was not sufficient for happiness, but that a wise man must be miserable in poverty and sickness.” Nay, Diogenes himself, from whose pride and singularity one would have looked for other notions, delivered it as his opinion, “That a poor old man was the most miserable thing in life.”
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[73]"
    "source_sequence": 83
  "translation_ja": |-
    弟子のアリストテレスは、いっそうひどく同じ考えに陥り、「徳は運に恵まれることなしには幸福に足りず、賢者も貧困と病の中では不幸であるはずだ」と、はっきり断言した。それどころか、高慢さと風変わりさからすれば、別の考えを期待したくなるディオゲネスでさえ、「貧しい老人は、人生で最も不幸なものである」と、自分の意見を述べたのだ。
  "translation_status": "reviewed"
- "id": "prayers-084"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Zeno also and his followers fell into many absurdities, among which nothing could be greater than that of maintaining all crimes to be equal; which, instead of making vice hateful, rendered it as a thing indifferent and familiar to all men.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[74]"
    "source_sequence": 84
  "translation_ja": "ゼノンとその弟子たちも、多くのばかげた考えに陥った。とりわけ大きいのは、すべての罪は等しいと主張したことである。それは悪徳を憎むべきものにする代わりに、誰にとっても、どうでもよい、ありふれたものにしてしまった。"
  "translation_status": "reviewed"
- "id": "prayers-085"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Lastly, Epicurus had no notion of justice but as it was profitable; and his placing happiness in pleasure, with all the advantages he could expound it by, was liable to very great exception; for although he taught that pleasure did consist in virtue, yet he did not any way fix or ascertain the boundaries of virtue, as he ought to have done; by which means he misled his followers into the greatest vices, making their names to become odious and scandalous even in the heathen world.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[75]"
    "source_sequence": 85
  "translation_ja": |-
    最後に、エピクロスは、利益になるという以外に、正義の観念を持っていなかった。また幸福を快楽に置いたことは、それを説明するためにどんな有利な解釈を添えようと、きわめて大きな異論を免れない。快楽は徳にあると教えたにしても、当然そうすべきだったのに、徳の境界を何ら定めず、確かにしなかったからだ。そのために弟子たちを最も大きな悪徳へ迷い込ませ、異教の世でさえ、その名を忌み嫌われ、恥とされるものにしてしまった。
  "translation_status": "reviewed"
- "id": "prayers-086"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    I have produced these few instances from a great many others to show the imperfection of heathen philosophy, wherein I have confined myself wholly to their morality. And surely we may pronounce upon it, in the words of St. James, that “This wisdom descended not from above, but was earthly and sensual.” What if I had produced their absurd notions about God and the soul? It would then have completed the character given it by that Apostle, and appeared to have been devilish too. But it is easy to observe from the nature of these few particulars that their defects in morals were purely the flagging and fainting of the mind for want of a support by revelation from God.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[76]"
    "source_sequence": 86
  "translation_ja": |-
    数多い例の中から、このわずかな実例を挙げたのは、異教の哲学の不完全さを示すためであり、ここでは、もっぱら道徳に話を限った。それについては、聖ヤコブの言葉を借り、「この知恵は上から降ったものではなく、地上のものであり、肉欲に属するものだった」と、確かに言えるだろう。もし神や魂についての、ばかげた考えまで挙げていたら、どうだったろう。そうすれば、この使徒による特徴づけは完成し、悪魔的なものでもあったと、わかったはずだ。だが、今挙げたわずかな事柄の性質からでも、彼らの道徳上の欠陥は、神の啓示による支えを欠いたため、ただ精神が力尽き、衰えた結果であることは、たやすく見て取れる。
  "translation_status": "reviewed"
- "id": "prayers-087"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    I proceed, therefore, in the third place, to show the perfection of Christian wisdom from above; and I shall endeavour to make it appear from those proper characters and marks of it by the Apostle before mentioned, in the third chapter, and 15th, 16th, and 17th verses.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[77]"
    "source_sequence": 87
  "translation_ja": "そこで第三に、上から来るキリスト教の知恵の完全さを示そう。先ほど触れた使徒が、三章の十五、十六、十七節で挙げている、その知恵に固有の性質としるしから、それを明らかにしたい。"
  "translation_status": "reviewed"
- "id": "prayers-088"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The words run thus—"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[78]"
    "source_sequence": 88
  "translation_ja": "その言葉は、次のとおりである。"
  "translation_status": "reviewed"
- "id": "prayers-089"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "“This wisdom descendeth not from above, but is earthly, sensual, devilish."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[79]"
    "source_sequence": 89
  "translation_ja": "「この知恵は上から降るものではなく、地上のものであり、肉欲に属し、悪魔的なものである。"
  "translation_status": "reviewed"
- "id": "prayers-090"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "“For where envying and strife is, there is confusion and every evil work."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[80]"
    "source_sequence": 90
  "translation_ja": "「ねたみと争いのあるところには、混乱とあらゆる悪い行いがあるからである。"
  "translation_status": "reviewed"
- "id": "prayers-091"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    “But the wisdom that is from above is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality and without hypocrisy.”
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[81]"
    "source_sequence": 91
  "translation_ja": "「しかし、上からの知恵は、まず清く、次に平和を好み、穏やかで、人の願いをよく聞き、憐れみと善い実りに満ち、偏りがなく、偽りがない。」"
  "translation_status": "reviewed"
- "id": "prayers-092"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    “The wisdom from above is first pure.” This purity of the mind and spirit is peculiar to the Gospel. Our Saviour says, “Blessed are the pure in heart, for they shall see God.” A mind free from all pollution of lusts shall have a daily vision of God, whereof unrevealed religion can form no notion. This is it that keeps us unspotted from the world, and hereby many have been prevailed upon to live in the practice of all purity, holiness, and righteousness, far beyond the examples of the most celebrated philosophers.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[82]"
    "source_sequence": 92
  "translation_ja": |-
    「上からの知恵は、まず清い。」この心と霊の清さは、福音に固有のものである。救い主は、「心の清い人々は幸いである。その人たちは神を見る」と言われる。欲望のあらゆる汚れから自由な心は、日々神を見ることになる。啓示によらない宗教には、思い描くことさえできないものである。これこそ、世に汚されないよう私たちを守るものだ。そして、これに動かされた多くの人々は、あらゆる清さ、聖らかさ、正しさを実践し、最も名高い哲学者の実例をはるかに越えて生きるようになったのである。
  "translation_status": "reviewed"
- "id": "prayers-093"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    It is “peaceable, gentle, and easy to be entreated.” The Christian doctrine teacheth us all those dispositions that make us affable and courteous, gentle and kind, without any morose leaven of pride or vanity, which entered into the composition of most heathen schemes: so we are taught to be meek and lowly. Our Saviour’s last legacy was peace, and He commands us to forgive our offending brother unto seventy times seven. Christian wisdom is full of mercy and good works, teaching the height of all moral virtues, of which the heathens fell infinitely short. Plato indeed (and it is worth observing) has somewhere a dialogue, or part of one, about forgiving our enemies, which was perhaps the highest strain ever reached by man without Divine assistance; yet how little is that to what our Saviour commands us, “To love them that hate us, to bless them that curse us, and to do good to them that despitefully use us.”
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[83]"
    "source_sequence": 93
  "translation_ja": |-
    それは「平和を好み、穏やかで、人の願いをよく聞く」。キリスト教の教えは、私たちを愛想よく礼儀正しく、穏やかで親切にする、あらゆる心のあり方を教える。異教の体系の大半に入り込んでいた、高慢や虚栄という、気難しさを生む種は、そこには少しもない。こうして私たちは、柔和でへりくだるよう教えられる。救い主が最後に遺されたものは平和であり、私たちに罪を犯した兄弟を、七の七十倍までも赦すよう命じておられる。キリスト教の知恵は、憐れみと善い行いに満ち、あらゆる道徳的な徳の頂点を教える。異教徒たちは、それに遠く及ばなかった。もっともプラトンには、注目すべきことだが、敵を赦すことについての対話篇、またはその一部分が、どこかにある。これはおそらく、神の助けなしに、人がかつて達した最高の調べだったろう。だが、それでさえ、救い主が命じる「私たちを憎む者を愛し、呪う者を祝福し、悪意をもって扱う者に善をなす」ことに比べれば、なんとわずかなことだろう。
  "translation_status": "reviewed"
- "id": "prayers-094"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Christian wisdom is “without partiality;” it is not calculated for this or that nation of people, but the whole race of mankind. Not so the philosophical schemes, which were narrow and confined, adapted to their peculiar towns, governments, or sects; but “in every nation, he that feareth God and worketh righteousness is accepted with Him.”
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[84]"
    "source_sequence": 94
  "translation_ja": |-
    キリスト教の知恵は「偏りがない」。あれこれの民族のためではなく、全人類のために用意されたものだからだ。哲学の諸体系はそうではなかった。狭く、限られていて、特定の都市や政体や学派に合わせて作られていた。しかし、「どの国の人でも、神を畏れ、正義を行う者は、神に受け入れられる」のである。
  "translation_status": "reviewed"
- "id": "prayers-095"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Lastly, It is “without hypocrisy;” it appears to be what it really is; it is all of a piece. By the doctrines of the Gospel we are so far from being allowed to publish to the world those virtues we have not, that we are commanded to hide even from ourselves those we really have, and not to let our right hand know what our left hand does, unlike several branches of the heathen wisdom, which pretended to teach insensibility and indifference, magnanimity and contempt of life, while at the same time, in other parts, it belied its own doctrines.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[85]"
    "source_sequence": 95
  "translation_ja": |-
    最後に、それは「偽りがない」。実際の姿そのままに見え、どこを取っても筋が通っている。福音の教えでは、持ってもいない徳を世に言いふらすことを許されないばかりか、本当に持つ徳さえ、自分自身に隠し、左の手のすることを右の手に知らせてはならないと命じられる。これは、平然として動じないことや、心の大きさや、命への無執着を教えるふりをしながら、ほかの点では、自分の教えに背いていた、異教の知恵のいくつかの流れとは違うのである。
  "translation_status": "reviewed"
- "id": "prayers-096"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    I come now, in the last place, to show that the great examples of wisdom and virtue among the Grecian sages were produced by personal merit; and not influenced by the doctrine of any particular sect, whereas in Christianity it is quite the contrary.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[86]"
    "source_sequence": 96
  "translation_ja": "では最後に、ギリシアの賢者に見られる知恵と徳の偉大な実例は、特定の学派の教えに影響されて生じたものではなく、個人の優れた資質によるものだったのに対し、キリスト教では、まったく逆であることを示そう。"
  "translation_status": "reviewed"
- "id": "prayers-097"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    The two virtues most celebrated by ancient moralists were fortitude and temperance, as relating to the government of man in his private capacity, to which their schemes were generally addressed and confined, and the two instances wherein those virtues arrived at the greatest height were Socrates and Cato. But neither these, nor any other virtues possessed by these two, were at all owing to any lessons or doctrines of a sect. For Socrates himself was of none at all; and although Cato was called a Stoic, it was more from a resemblance of manners in his worst qualities, than that he avowed himself one of their disciples. The same may be affirmed of many other great men of antiquity. Whence I infer that those who were renowned for virtue among them were more obliged to the good natural dispositions of their own minds than to the doctrines of any sect they pretended to follow.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[87]"
    "source_sequence": 97
  "translation_ja": |-
    古代の道徳家が最もたたえた二つの徳は、剛毅と節制だった。それらは、私人としての人間が自分を治めることにかかわる。彼らの体系も、一般に、そこに向けられ、そこに限られていた。そして、この二つの徳が最も高みに達した実例が、ソクラテスとカトーであった。だが、この二人の持つ、これらの徳も、ほかのどんな徳も、いずれかの学派の教訓や教義に由来したものでは、少しもなかった。ソクラテス自身は、どの学派にも属していなかった。カトーはストア派と呼ばれたが、それは、自らその弟子と公言していたからというより、彼の最も悪い性質の振る舞いが似ていたからである。同じことは、古代のほかの多くの偉人についても言える。そこで私は、彼らのうち、徳によって名高かった者たちは、従うと称した学派の教えよりも、自分自身の心に生まれつき備わった善い性向に、多くを負っていたと推論する。
  "translation_status": "reviewed"
- "id": "prayers-098"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    On the other side, as the examples of fortitude and patience among the primitive Christians have been infinitely greater, and more numerous, so they were altogether the product of their principles and doctrine, and were such as the same persons, without those aids, would never have arrived to. Of this truth most of the Apostles, with many thousand martyrs, are a cloud of witnesses beyond exception. Having, therefore, spoken so largely upon the former heads, I shall dwell no longer upon this.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[88]"
    "source_sequence": 98
  "translation_ja": |-
    これに対して、初期のキリスト者の間に見られた剛毅と忍耐の実例は、はるかに偉大で、数もはるかに多かったが、それらはまったく、その原理と教えから生まれたものだった。その助けがなければ、同じ人々も決して達せなかったようなものだったのである。大半の使徒と、幾千もの殉教者は、この真理について、異論の余地のない、おびただしい証人である。前の項目でこれほど長く話したので、この点には、これ以上とどまらないことにしよう。
  "translation_status": "reviewed"
- "id": "prayers-099"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    And if it should here be objected, Why does not Christianity still produce the same effects? it is easy to answer, first, that, although the number of pretended Christians be great, yet that of true believers, in proportion to the other, was never so small; and it is a true lively faith alone that, by the assistance of God’s grace, can influence our practice.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[89]"
    "source_sequence": 99
  "translation_ja": |-
    もしここで、なぜキリスト教は今も同じ効果を生まないのか、という異論が出るなら、答えはたやすい。第一に、キリスト者と称する者の数は多くても、その数に比べて真の信者が、これほど少なかったことはないからである。そして、神の恵みに助けられて、私たちの行いを動かせるのは、真に生きた信仰だけなのだ。
  "translation_status": "reviewed"
- "id": "prayers-100"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Secondly, We may answer that Christianity itself has very much suffered by being blended up with Gentile philosophy. The Platonic system, first taken into religion, was thought to have given matter for some early heresies in the Church. When disputes began to arise, the Peripatetic forms were introduced by Scotus as best fitted for controversy. And however this may now have become necessary, it was surely the author of a litigious vein, which has since occasioned very pernicious consequences, stopped the progress of Christianity, and been a great promoter of vice; verifying that sentence given by St. James, and mentioned before, “Where envying and strife is, there is confusion and every evil work.” This was the fatal stop to the Grecians in their progress both of arts and arms; their wise men were divided under several sects, and their governments under several commonwealths, all in opposition to each other, which engaged them in eternal quarrels among themselves, while they should have been armed against the common enemy. And I wish we had no other examples, from the like causes, less foreign or ancient than that. Diogenes said Socrates was a madman; the disciples of Zeno and Epicurus, nay, of Plato and Aristotle, were engaged in fierce disputes about the most insignificant trifles. And if this be the present language and practice among us Christians no wonder that Christianity does not still produce the same effects which it did at first, when it was received and embraced in its utmost purity and perfection; for such wisdom as this cannot “descend from above,” but must be “earthly, sensual, devilish, full of confusion and every evil work,” whereas, “the wisdom from above is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality, and without hypocrisy.” This is the true heavenly wisdom, which Christianity only can boast of, and which the greatest of the heathen wise men could never arrive at.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[90]"
    "source_sequence": 100
  "translation_ja": |-
    第二に、キリスト教そのものが、異教の哲学を混ぜ込まれたために、大いに損なわれたと答えられる。初めに宗教へ取り入れられたプラトンの体系は、教会初期のいくつかの異端に、材料を与えたと考えられていた。争論が起こり始めると、スコトゥスが、論争に最も適するものとして、逍遥学派の形式を導入した。今ではそれが必要になっているとしても、確かにそれは、争うことを好む気風を生んだ。その後この気風は、きわめて有害な結果をもたらし、キリスト教の進歩を妨げ、悪徳を大いに助長し、先に挙げた聖ヤコブの言葉、「ねたみと争いのあるところには、混乱とあらゆる悪い行いがある」を、事実によって裏づけたのである。これは、ギリシア人が学芸と武力の両面で進歩するうえでも、致命的な妨げとなった。賢者たちは諸学派に、政体は諸国家に分かれ、すべてが互いに敵対していた。そのため、共通の敵に対して武装すべきときに、果てしない内輪の争いに巻き込まれたのだ。そして、同じ原因による実例が、それほど遠い国や昔のものではないところにもある、というのでなければよいのだが。ディオゲネスは、ソクラテスを狂人だと言った。ゼノンやエピクロスの弟子たち、いや、プラトンやアリストテレスの弟子たちも、最も取るに足りない些細なことで、激しい論争を繰り広げていた。もしそれが、今の私たちキリスト者の言葉と行いであるなら、キリスト教が、最大限に清く完全な姿で受け入れられ、信奉されていた初めのころと、同じ効果を生まないのも不思議ではない。このような知恵は、「上から降る」ことはありえず、「地上のものであり、肉欲に属し、悪魔的で、混乱とあらゆる悪い行いに満ちたもの」であるはずだ。それに対して、「上からの知恵は、まず清く、次に平和を好み、穏やかで、人の願いをよく聞き、憐れみと善い実りに満ち、偏りがなく、偽りがない」。これこそ、キリスト教だけが誇れる、天からの真の知恵であり、異教の最も偉大な賢者たちにも、決して達せなかったものなのである。
  "translation_status": "reviewed"
- "id": "prayers-101"
  "section_id": "wisdom-of-this-world"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now to God the Father, &c."
  "source_languages":
  - "en"
  "source_locations":

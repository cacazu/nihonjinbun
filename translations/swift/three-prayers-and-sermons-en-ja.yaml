- "id": "prayers-014"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    As God hath contrived all the works of Nature to be useful, and in some manner a support to each other, by which the whole frame of the world, under His providence, is preserved and kept up, so among mankind our particular stations are appointed to each of us by God Almighty, wherein we are obliged to act as far as our power reacheth toward the good of the whole community. And he who doth not perform that part assigned him towards advancing the benefit of the whole, in proportion to his opportunities and abilities, is not only a useless, but a very mischievous member of the public; because he takes his share of the profit, and yet leaves his share of the burden to be borne by others, which is the true principal cause of most miseries and misfortunes in life. For a wise man who does not assist with his counsels, a great man with his protection, a rich man with his bounty and charity, and a poor man with his labour, are perfect nuisances in a commonwealth. Neither is any condition of life more honourable in the sight of God than another; otherwise He would be a respecter of persons, which He assures us He is not; for He hath proposed the same salvation to all men, and hath only placed them in different ways or stations to work it out. Princes are born with no more advantages of strength or wisdom than other men, and, by an unhappy education, are usually more defective in both than thousands of their subjects. They depend for every necessary of life upon the meanest of their people; besides, obedience and subjection were never enjoined by God to humour the passions, lusts, and vanities of those who demand them from us; but we are commanded to obey our governors, because disobedience would breed seditions in the state. Thus servants are directed to obey their masters, children their parents, and wives their husbands, not from any respect of persons in God, but because otherwise there would be nothing but confusion in private families. This matter will be clearly explained by considering the comparison which St. Paul makes between the Church of Christ and the body of man; for the same resemblance will hold not only to families and kingdoms, but to the whole corporation of mankind. “The eye,” saith he, “cannot say unto the hand, ‘I have no need of thee;’ nor again the hand to the foot, ‘I have no need of thee.’ Nay, much more those members of the body which seem to be more feeble are necessary; and whether one member suffer, all the members suffer with it; or one member be honoured, all the members rejoice with it.” The case is directly the same among mankind. The prince cannot say to the merchant, “I have no need of thee,” nor the merchant to the labourer, “I have no need of thee.” Nay, much more those members which seem to be more feeble are necessary; for the poor are generally more necessary members of the commonwealth than the rich; which clearly shows that God never intended such possessions for the sake and service of those to whom He lends them, but because he hath assigned every man his particular station to be useful in life, and this for the reason given by the Apostle, “that there may be no schism in the body.”
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[8]"
    "source_sequence": 14
  "translation_ja": |-
    神は自然界のあらゆる働きを、有用で、何らかの形で互いに支え合うようにお造りになり、その摂理のもとで、世界の仕組み全体が保たれている。同じように人間の間でも、それぞれの立場は全能の神によって一人ひとりに定められており、私たちはその場で、共同体全体の益のため、力の及ぶ限り働く義務がある。機会と能力に応じて全体の利益を増すために割り当てられた役目を果たさない者は、社会にとって役立たないばかりか、大いに有害な一員である。利益は自分の分を受け取りながら、負担は自分の分までほかの人に負わせるからであり、これこそ人生のほとんどの苦難と不幸を生む、本当の主な原因なのだ。賢い者が助言せず、地位の高い者が保護せず、富む者が惜しみなく施しをせず、貧しい者が労働によって助けないなら、その者たちは国家にとってまったくの厄介者である。また、神の御前で、ある暮らしの境遇がほかの境遇より尊いということもない。もしそうなら、神は人を分け隔てなさることになるが、御自身、決してそうはしないと断言しておられる。すべての人に同じ救いを示し、ただそれを成し遂げる道筋や立場を違えて置かれただけなのである。君主も、生まれつき、ほかの人より力や知恵に恵まれているわけではない。それどころか、不幸な教育のために、配下の何千人という臣民より、そのどちらも劣っていることが多い。暮らしに欠かせないものはすべて、最も身分の低い民に頼っている。加えて、私たちに服従を求める者の情念や欲望や虚栄を満たすために、従順や服従を神がお命じになったことはない。統治者に従うように命じられるのは、従わなければ国に反乱が生じるからだ。同じように、召使いには主人に、子には親に、妻には夫に従うよう教えられているのも、神が人を分け隔てなさるからではなく、そうしなければ家庭の中が混乱ばかりになるからである。聖パウロがキリストの教会を人間の体にたとえた言葉を考えれば、この点ははっきりする。そのたとえは、家庭や国家だけでなく、人類という共同体全体にも当てはまるからだ。「目は手に向かって、お前は要らないとは言えず、また手も足に向かって、お前は要らないとは言えない。それどころか、体の中でいっそう弱く見える部分こそ、なくてはならない。そして一つの部分が苦しめば、すべての部分がともに苦しみ、一つの部分が尊ばれれば、すべての部分がともに喜ぶ」と言う。人間同士の場合もまったく同じである。君主は商人に向かって「お前は要らない」とは言えず、商人も労働者に向かって「お前は要らない」とは言えない。それどころか、いっそう弱く見える部分こそ、なくてはならない。一般に、貧しい人は富む人よりも、国家にとって欠かせない一員なのである。このことからも明らかなように、神がそのような財産をお与えになるのは、それを貸し与えられた本人のため、その者に仕えるためではない。一人ひとりに、生涯を有益に生きるための固有の立場を割り当てておられるからであり、その理由は、使徒の言う「体の中に分裂がないようにするため」なのである。
  "translation_status": "reviewed"
- "id": "prayers-015"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    From hence may partly be gathered the nature of that subjection which we all owe to one another. God Almighty hath been pleased to put us into an imperfect state, where we have perpetual occasion of each other’s assistance. There is none so low as not to be in a capacity of assisting the highest, nor so high as not to want the assistance of the lowest.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[9]"
    "source_sequence": 15
  "translation_ja": |-
    ここから、私たち皆が互いに対して負う服従とはどういうものか、その一端が見えてくる。全能の神は、私たちを不完全な境遇に置かれた。そのため私たちは、絶えず互いの助けを必要とする。最も高い地位の者を助けられないほど低い者はなく、最も低い者の助けを必要としないほど高い者もないのである。
  "translation_status": "reviewed"
- "id": "prayers-016"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    It plainly appears, from what hath been said, that no one human creature is more worthy than another in the sight of God, further than according to the goodness or holiness of their lives; and that power, wealth, and the like outward advantages, are so far from being the marks of God’s approving or preferring those on whom they are bestowed, that, on the contrary, He is pleased to suffer them to be almost engrossed by those who have least title to His favour. Now, according to this equality wherein God hath placed all mankind with relation to Himself, you will observe that in all the relations between man and man there is a mutual dependence, whereby the one cannot subsist without the other. Thus no man can be a prince without subjects, nor a master without servants, nor a father without children. And this both explains and confirms the doctrine of the text; for where there is a mutual dependence there must be a mutual duty, and consequently a mutual subjection. For instance, the subject must obey his prince, because God commands it, human laws require it, and the safety of the public makes it necessary; for the same reasons we must obey all that are in authority, and submit ourselves not only to the good and gentle, but also to the froward, whether they rule according to our liking or not. On the other side, in those countries that pretend to freedom, princes are subject to those laws which their people have chosen; they are bound to protect their subjects in liberty, property, and religion, to receive their petitions and redress their grievances, so that the best prince is, in the opinion of wise men, only the greatest servant of the nation—not only a servant to the public in general, but in some sort to every man in it. In the like manner a servant owes obedience, and diligence, and faithfulness to his master, from whom, at the same time, he hath a just demand for protection, and maintenance, and gentle treatment. Nay, even the poor beggar hath a just demand of an alms from the rich man, who is guilty of fraud, injustice, and oppression if he does not afford relief according to his abilities.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[10]"
    "source_sequence": 16
  "translation_ja": |-
    これまで述べたことから明らかなように、神の御前で、ある人がほかの人よりも価値があるのは、その生き方の善さ、聖らかさによる場合だけである。権力や財産など、外面的な有利さは、それを授かった者を神がお認めになり、好んでおられるしるしであるどころか、逆に、神の恩寵を受ける資格が最も乏しい者たちに、ほとんど独占されるままにしておられる。神との関係において、神が全人類をこのように平等に置かれたことを考えるなら、人と人とのあらゆる関係には、互いに依存するところがあり、一方がなければ他方も成り立たないことに気づくだろう。臣民がなければ君主ではありえず、召使いがなければ主人ではありえず、子がなければ父でもありえない。これこそ聖句の教えを説明し、同時に裏づけるものである。互いに依存するところには互いの務めがあり、したがって互いの服従があるはずだからだ。たとえば臣民が君主に従わなければならないのは、神がお命じになり、人間の法が求め、社会の安全のために必要だからである。同じ理由で、権威のある者すべてに従い、善良で穏やかな者だけでなく、気難しい者にも、その治め方が気に入ろうと入るまいと従わねばならない。一方、自由を標榜する国々では、君主も国民が選んだ法に従う。臣民の自由、財産、信仰を守り、請願を受け付け、苦情を正す義務がある。だから賢者の考えでは、最良の君主とは、国で最も大きな務めを担う奉仕者にほかならない。社会全体への奉仕者であるばかりでなく、ある意味では、その中の一人ひとりへの奉仕者でもある。同じように、召使いは主人に従順、勤勉、忠実を尽くす義務を負うが、同時に主人に対して、保護、生活の保障、穏やかな扱いを求める正当な権利がある。いや、貧しい物乞いにさえ、富む人に施しを求める正当な権利がある。その人が能力に応じた救いの手を差し伸べなければ、欺き、不正、抑圧の罪を犯すことになる。
  "translation_status": "reviewed"
- "id": "prayers-017"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    But this subjection we all owe one another is nowhere more necessary than in the common conversations of life, for without it there could be no society among men. If the learned would not sometimes submit to the ignorant, the wise to the simple, the gentle to the froward, the old to the weaknesses of the young, there would be nothing but everlasting variance in the world. This our Saviour Himself confirmed by His own example; for He appeared in the form of a servant and washed His disciples’ feet, adding those memorable words, “Ye call me Lord and Master, and ye say well, for so I am. If I then, your Lord and Master, wash your feet, how much more ought ye to wash one another’s feet?” Under which expression of washing the feet is included all that subjection, assistance, love, and duty, which every good Christian ought to pay his brother, in whatever station God hath placed him. For the greatest prince and the meanest slave are not, by infinite degrees, so distant as our Saviour and those disciples, whose feet He vouchsafed to wash.

    "source_sequence": 17
  "translation_ja": |-
    だが、私たちが皆、互いに負うこの服従が、最も必要なのは、日常の交わりにおいてである。これがなければ、人々の社会は成り立たない。学識ある者が無学な者に、賢い者が素朴な者に、穏やかな者が気難しい者に、年長者が若者の弱さに、ときに自分を合わせようとしなければ、世の中には果てしない不和しかないだろう。このことを救い主御自身、御自身の行いによって確かなものとされた。しもべの姿で現れ、弟子たちの足を洗い、あの忘れがたい言葉を付け加えられたからだ。「あなたがたは私を主、師と呼ぶ。そのとおりである。私はそうなのだから。主であり、師である私が、あなたがたの足を洗うなら、あなたがたもなおさら互いの足を洗うべきではないか。」この、足を洗うという言い方には、神からどのような立場に置かれようと、善いキリスト者が兄弟に対して果たすべき、あらゆる服従、援助、愛、務めが含まれている。最も偉大な君主と最も卑しい奴隷との隔たりも、足を洗ってくださった救い主とその弟子たちの隔たりには、比べようもないほど及ばないのである。
  "translation_status": "reviewed"
- "id": "prayers-018"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    And although this doctrine of subjecting ourselves to one another may seem to grate upon the pride and vanity of mankind, and may therefore be hard to be digested by those who value themselves upon their greatness or their wealth, yet it is really no more than what most men practise upon other occasions. For if our neighbour, who is our inferior, comes to see us, we rise to receive him; we place him above us, and respect him as if he were better than ourselves; and this is thought both decent and necessary, and is usually called good manners. Now the duty required by the Apostle is only that we should enlarge our minds, and that what we thus practise in the common course of life we should imitate in all our actions and proceedings whatsoever; since our Saviour tells us that every man is our neighbour, and since we are so ready, in point of civility, to yield to others in our own houses, where only we have any title to govern.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[12]"
    "source_sequence": 18
  "translation_ja": |-
    互いに従うというこの教えは、人間の高慢や虚栄を逆なでするように見え、地位や財産を鼻にかける者には、受け入れがたいかもしれない。けれども実際は、大半の人が別の機会には行っていることにすぎない。自分より下の立場にある近所の人が訪ねてくれば、私たちは立ち上がって迎え、自分より上の席へ案内し、まるで相手のほうが優れているかのように敬意を示す。これはふさわしく必要なことと思われ、普通、礼儀と呼ばれている。使徒が求める務めとは、ただ心を広くし、日常の暮らしでこうして行っていることを、あらゆる行動、あらゆる事柄でも実行することでしかない。救い主は、すべての人が私たちの隣人だと教えておられるし、私たちも、唯一自分に取り仕切る権限のある自宅でさえ、礼儀の点ではあれほど進んで人に譲っているではないか。
  "translation_status": "reviewed"
- "id": "prayers-019"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Having thus shown you what sort of subjection it is which all men owe one another, and in what manner it ought to be paid, I shall now draw some observations from what hath been said.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[13]"
    "source_sequence": 19
  "translation_ja": "これで、すべての人が互いに対して果たすべき服従とは何か、どのように果たすべきかをお示しした。ここからは、これまでの話をもとに、いくつか考察を引き出したい。"
  "translation_status": "reviewed"
- "id": "prayers-020"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    And first, a thorough practice of this duty of subjecting ourselves to the wants and infirmities of each other would utterly extinguish in us the vice of pride.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[14]"
    "source_sequence": 20
  "translation_ja": "第一に、互いの不足と弱さに応じて自分を従わせるこの務めを徹底して実践すれば、高慢という悪徳は私たちの中からすっかり消えるだろう。"
  "translation_status": "reviewed"
- "id": "prayers-021"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    For if God has pleased to intrust me with a talent, not for my own sake, but for the service of others, and at the same time hath left me full of wants and necessities which others must supply, I can then have no cause to set any extraordinary value upon myself, or to despise my brother because he hath not the same talents which were lent to me. His being may probably be as useful to the public as mine; and therefore, by the rules of right reason, I am in no sort preferable to him.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[15]"
    "source_sequence": 21
  "translation_ja": |-
    神が私にある才能を委ねてくださったのが、私自身のためではなく、ほかの人々に役立てるためであり、同時に私を、ほかの人に補ってもらわねばならない不足や必要に満ちたままにしておられるのなら、自分をことさら高く評価したり、私が貸し与えられたものと同じ才能を持たないからといって、兄弟を見下したりする理由はない。その人がいることは、私がいることと同じほど社会に役立っているかもしれない。だから正しい理性の規則によれば、私はいかなる点でも、その人より上なのではない。
  "translation_status": "reviewed"
- "id": "prayers-022"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Secondly, It is very manifest, from what has been said, that no man ought to look upon the advantages of life, such as riches, honour, power, and the like, as his property, but merely as a trust which God hath deposited with him to be employed for the use of his brethren, and God will certainly punish the breach of that trust, though the laws of man will not, or rather indeed cannot; because the trust was conferred only by God, who has not left it to any power on earth to decide infallibly whether a man makes a good use of his talents or not, or to punish him where he fails. And therefore God seems to have more particularly taken this matter into His own hands, and will most certainly reward or punish us in proportion to our good or ill performance in it. Now, although the advantages which one possesseth more than another may, in some sense, be called his property with respect to other men, yet with respect to God they are, as I said, only a trust, which will plainly appear from hence: if a man does not use those advantages to the good of the public or the benefit of his neighbour, it is certain he doth not deserve them, and consequently that God never intended them for a blessing to him; and on the other side, whoever does employ his talents as he ought will find, by his own experience, that they were chiefly lent him for the service of others, for to the service of others he will certainly employ them.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[16]"
    "source_sequence": 22
  "translation_ja": |-
    第二に、これまでの話からきわめて明らかなのは、富、名誉、権力といった人生の有利な条件を、自分の所有物と考えるべきではないということである。それらはただ、兄弟のために用いるよう、神から預けられたものにすぎない。その信託に背けば、人間の法は罰しないとしても――いや、厳密には罰することができないとしても――神は必ず罰せられる。それを委ねたのは神だけであり、人が才能を善用しているかどうかを誤りなく判断したり、怠った場合に罰したりする権限を、地上のいかなる権力にも任せてはおられないからだ。そこで神は、この事柄をことさらに御自身の手にとどめておられるように見える。そして、その務めをよく果たしたか、悪く果たしたかに応じて、必ず私たちに報いや罰をお与えになる。ある人がほかの人より多く持つ利点は、人間同士の関係では、ある意味でその人の所有物と呼べるかもしれない。しかし神との関係では、述べたとおり、預かり物にすぎない。それは次のことから明らかになる。ある人がその利点を社会の益や隣人のために用いないなら、それに値する者でないのは確かであり、したがって神は、その人自身の祝福となるように、それを与えるおつもりではなかったのだ。逆に、自分の才能をしかるべく用いる者は誰でも、それが主として他者に役立てるために貸し与えられたものだと、経験によってわかるだろう。なぜなら、その人は必ず、それを他者への奉仕に用いるからである。
  "translation_status": "reviewed"
- "id": "prayers-023"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Thirdly, If we could all be brought to practise this duty of subjecting ourselves to each other, it would very much contribute to the general happiness of mankind, for this would root out envy and malice from the heart of man; because you cannot envy your neighbour’s strength if he make use of it to defend your life or carry your burden; you cannot envy his wisdom if he gives you good counsel; nor his riches if he supplies your wants; nor his greatness if he employs it to your protection. The miseries of life are not properly owing to the unequal distribution of things, but God Almighty, the great King of heaven, is treated like the kings of the earth, who, although perhaps intending well themselves, have often most abominable ministers and stewards, and those generally the vilest to whom they intrust the most talents. But here is the difference, that the princes of this world see by other men’s eyes, but God sees all things; and therefore, whenever He permits His blessings to be dealt among those who are unworthy, we may certainly conclude that He intends them only as a punishment to an evil world, as well as to the owners. It were well if those would consider this, whose riches serve them only as a spur to avarice or as an instrument of their lusts; whose wisdom is only of this world, to put false colours upon things, to call good evil and evil good against the conviction of their own consciences; and lastly, who employ their power and favour in acts of oppression or injustice, in misrepresenting persons and things, or in countenancing the wicked to the ruin of the innocent.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[17]"
    "source_sequence": 23
  "translation_ja": |-
    第三に、私たち皆が互いに従うこの務めを実践するようになれば、人類全体の幸福に大いに役立つだろう。そうすれば人の心から、ねたみと悪意が根こそぎ除かれるからだ。隣人がその力であなたの命を守り、あなたの荷を運んでくれるなら、その力をねたむことはできない。よい助言をくれるならその知恵を、必要を満たしてくれるならその富を、あなたを守るために用いてくれるならその地位を、ねたむことはできない。人生の苦しみは、厳密には、物の分配が不平等であるせいではない。天の偉大な王である全能の神が、地上の王と同じような扱いを受けておられるのだ。地上の王は、本人には善意があっても、ひどく忌まわしい大臣や管理人を持つことが多く、最も多くの才能を委ねた者が、たいてい最も卑劣なのである。ただ、違いがある。この世の君主は他人の目で見るが、神はすべてを御覧になる。だから、ふさわしくない者たちに祝福が配られるのをお許しになる場合、それは祝福を持つ者だけでなく、悪に染まった世を罰するためなのだと、確かに結論できる。財産が貪欲をあおる刺激や欲望の道具にしかならない者、知恵がただこの世のもので、良心ではわかっていながら、物事を偽って見せ、善を悪、悪を善と呼ぶために使われる者、そして権力や寵遇を、抑圧や不正、人や物事の歪曲、悪人をかばって罪のない者を破滅させる行いに使う者は、このことをよく考えるがよい。
  "translation_status": "reviewed"
- "id": "prayers-024"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Fourthly, The practice of this duty of being subject to one another would make us rest contented in the several stations of life wherein God hath thought fit to place us, because it would, in the best and easiest manner, bring us back, as it were, to that early state of the Gospel when Christians had all things in common. For if the poor found the rich disposed to supply their want, if the ignorant found the wise ready to instruct and direct them, or if the weak might always find protection from the mighty, they could none of them, with the least pretence of justice, lament their own condition.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[18]"
    "source_sequence": 24
  "translation_ja": |-
    第四に、互いに従うこの務めを実践すれば、神がそれぞれにふさわしいとお定めになった境遇に、満ち足りていられるようになる。というのも、いわば、キリスト者がすべてを共有していた福音の初めのころの状態へ、最もよく、最もたやすく立ち戻らせてくれるからである。貧しい者が、自分の不足を満たそうとする富む者を見いだし、無学な者が、自分を教え導こうとする賢者を見いだし、弱い者が、強い者の保護をいつでも得られるなら、自分の境遇を嘆く正当な理由は、その誰にも少しもないはずだ。
  "translation_status": "reviewed"
- "id": "prayers-025"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    From all that hath been hitherto said it appears that great abilities of any sort, when they are employed as God directs, do but make the owners of them greater and more painful servants to their neighbour and the public. However, we are by no means to conclude from hence that they are not really blessings, when they are in the hands of good men. For, first, what can be a greater honour than to be chosen one of the stewards and dispensers of God’s bounty to mankind? What is there that can give a generous spirit more pleasure and complacency of mind than to consider that he is an instrument of doing much good; that great numbers owe to him, under God, their subsistence, their safety, their health, and the good conduct of their lives? The wickedest man upon earth takes a pleasure in doing good to those he loves; and therefore surely a good Christian, who obeys our Saviour’s commands of loving all men, cannot but take delight in doing good even to his enemies. God, who gives all things to all men, can receive nothing from any; and those among men who do the most good and receive the fewest returns do most resemble the Creator; for which reason St. Paul delivers it as a saying of our Saviour, that “it is more blessed to give than receive.” By this rule, what must become of those things which the world values as the greatest blessings—riches, power, and the like—when our Saviour plainly determines that the best way to make them blessings is to part with them? Therefore, although the advantages which one man hath over another may be called blessings, yet they are by no means so in the sense the world usually understands. Thus, for example, great riches are no blessings in themselves, because the poor man, with the common necessaries of life, enjoys more health and has fewer cares without them. How then do they become blessings? No otherwise than by being employed in feeding the hungry, clothing the naked, rewarding worthy men, and, in short, doing acts of charity and generosity. Thus, likewise, power is no blessing in itself, because private men bear less envy, and trouble, and anguish without it. But when it is employed to protect the innocent, to relieve the oppressed, and to punish the oppressor, then it becomes a great blessing.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[19]"
    "source_sequence": 25
  "translation_ja": |-
    ここまでのすべてからわかるように、どのような優れた能力も、神の指示どおりに用いるなら、その持ち主を、隣人や社会のために、より大きな務めを負い、より骨を折る奉仕者にするだけである。しかし、だからといって、善い人の手にある場合にも、それが本当の祝福ではないと考えてはならない。第一に、人類への神の恵みを預かり、配る者の一人に選ばれる以上の名誉が、どこにあるだろう。自分が多くの善をなす道具となり、神のもとで、多くの人の暮らし、安全、健康、正しい生き方を支えていると思うほど、寛大な心に喜びと満足を与えることがあるだろうか。地上で最も邪悪な者でさえ、愛する相手に善いことをするのは楽しい。それなら、すべての人を愛せよという救い主の命令に従う善いキリスト者は、敵に善をなすことさえ、喜ばずにはいられないはずだ。すべての人にすべてを与える神は、誰からも何一つ受け取ることができない。人間のうちでも、最も多くの善をなし、最も少ない見返りしか受け取らない者が、創造主に最もよく似ている。そのため聖パウロは、救い主の言葉として、「受けるよりも与えるほうが幸いである」と伝えている。この規則に照らすと、世が最大の祝福と見なす富や権力などは、いったいどうなるだろう。それらを祝福にする最良の道は、手放すことだと、救い主ははっきり定めておられるのだから。だから、ある人がほかの人より有利に持つものを祝福と呼べるにしても、世間が普通に考える意味での祝福では、決してない。たとえば、大きな富は、それ自体では祝福ではない。暮らしに普通に必要なものを持つ貧しい人のほうが、富がなくても、より健康で、心配も少ないからだ。では、どうすれば祝福となるのか。飢えた者を食べさせ、衣のない者に着せ、ふさわしい者に報い、要するに、慈善と寛大な行いに用いることによってしか、祝福にはならない。同じく権力も、それ自体では祝福ではない。私人のほうが、権力がなければ、ねたまれることも、面倒も、苦悩も少ないからだ。しかし、罪のない者を守り、抑圧された者を救い、抑圧する者を罰するために使われるとき、それは大きな祝福となる。
  "translation_status": "reviewed"
- "id": "prayers-026"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    And so, lastly, even great wisdom is, in the opinion of Solomon, not a blessing in itself; for “in much wisdom is much sorrow;” and men of common understanding, if they serve God and mind their callings, make fewer mistakes in the conduct of life than those who have better heads. And yet wisdom is a mighty blessing when it is applied to good purposes, to instruct the ignorant, to be a faithful counsellor either in public or private, to be a director to youth, and to many other ends needless here to mention.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[20]"
    "source_sequence": 26
  "translation_ja": |-
    そして最後に、優れた知恵でさえ、ソロモンの考えでは、それ自体で祝福とはならない。「知恵が多ければ、悲しみも多い」からであり、普通の理解力を持つ人も、神に仕え、自分の務めに心を配るなら、自分より頭のよい人より、生き方を誤ることは少ない。それでも、無学な者を教え、公私いずれにおいても忠実な助言者となり、若者を導くなど、ここでいちいち挙げるまでもない多くの善い目的に用いられるとき、知恵は大いなる祝福なのである。
  "translation_status": "reviewed"
- "id": "prayers-027"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    To conclude: God sent us into the world to obey His commands, by doing as much good as our abilities will reach, and as little evil as our many infirmities will permit. Some He hath only trusted with one talent, some with five, and some with ten. No man is without his talent; and he that is faithful or negligent in a little shall be rewarded or punished, as well as he that hath been so in a great deal.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[21]"
    "source_sequence": 27
  "translation_ja": |-
    結びに言おう。神は、御命令に従わせるために、私たちをこの世に遣わされた。能力の及ぶ限り善を多くなし、数々の弱さが許す限り悪を少なくするためである。ある者には一タラント、ある者には五タラント、ある者には十タラントをお委ねになった。自分のタラントを持たない者はいない。多くのものについて忠実だった者、怠った者がそうされるのと同じく、わずかなものについて忠実だった者も、怠った者も、報い、あるいは罰を受けるのである。
  "translation_status": "reviewed"
- "id": "prayers-028"
  "section_id": "mutual-subjection"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Consider what hath been said, &c."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[22]"
    "source_sequence": 28
  "translation_ja": "以上述べたことを考えよ、云々。"
  "translation_status": "reviewed"

- "id": "prayers-007"
  "section_id": "prayer-2"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    Most merciful Father, accept our humblest prayers in behalf of this Thy languishing servant; forgive the sins, the frailties, and infirmities of her life past. Accept the good deeds she hath done in such a manner that, at whatever time Thou shalt please to call her, she may be received into everlasting habitations. Give her grace to continue sincerely thankful to Thee for the many favours Thou hast bestowed upon her, the ability and inclination and practice to do good, and those virtues which have procured the esteem and love of her friends and a most unspotted name in the world. O God, Thou dispensest Thy blessings and Thy punishments as it becometh infinite justice and mercy; and since it was Thy pleasure to afflict her with a long, constant, weakly state of health, make her truly sensible that it was for very wise ends, and was largely made up to her in other blessings more valuable and less common. Continue to her, O Lord, that firmness and constancy of mind wherewith Thou hast most graciously endowed her, together with that contempt of worldly things and vanities that she has shown in the whole conduct of her life. O All-powerful Being, the least motion of whose will can create or destroy a world, pity us, the mournful friends of Thy distressed servant, who sink under the weight of her present condition, and the fear of losing the most valuable of our friends. Restore her to us, O Lord, if it be Thy gracious will, or inspire us with constancy and resignation to support ourselves under so heavy an affliction. Restore her, O Lord, for the sake of those poor who, by losing her, will be desolate, and those sick who will not only want her bounty, but her care and tending; or else, in Thy mercy, raise up some other in her place with equal disposition and better abilities. Lessen, O Lord, we beseech Thee, her bodily pains, or give her a double strength of mind to support them. And if Thou wilt soon take her to Thyself, turn our thoughts rather upon that felicity which we hope she shall enjoy, than upon that unspeakable loss we shall endure. Let her memory be ever dear unto us, and the example of her many virtues, as far as human infirmity will admit, our constant imitation. Accept, O Lord, these prayers, poured from the very bottom of our hearts, in Thy mercy, and for the merits of our blessed Saviour. Amen.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4738"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/4738/4738-h/4738-h.htm"
    "xpath": "/html[1]/body[1]/p[4]"
    "source_sequence": 7
  "translation_ja": |-
    いと憐れみ深い父よ、衰えゆくあなたのこのしもべのために、私たちがへりくだってささげる祈りをお受け入れください。これまでの生涯の罪も、もろさも、弱さもお赦しください。彼女の善い行いをお受け入れになり、いつお召しになっても、永遠の住まいへ迎え入れられるようにしてください。あなたから授かった数々の恵み、善をなす力と意欲と実践、そして友人たちの敬愛と世に一点の汚れもない名をもたらした美徳のために、心から感謝し続ける恵みをお与えください。神よ、あなたは限りない正義と憐れみにふさわしく、祝福も罰もお授けになります。あなたの御心によって、彼女は長く絶え間ない病弱さに苦しんできました。それが深い知恵に基づく目的のためであり、いっそう価値が高く、いっそう得がたいほかの恵みによって、十分に埋め合わされていたことを、心から悟らせてください。主よ、あなたが恵み深く授けてくださった、揺るがず耐える心と、生涯の行い全体を通して示してきた、世俗の事物や虚栄にとらわれない心を、これからも保たせてください。意志をわずかに動かすだけで世界を造り、また滅ぼすこともできる全能の御方よ、苦しむしもべを思って悲しむ私たち友人をお憐れみください。彼女の今の姿と、かけがえのない友を失う恐れが重くのしかかり、私たちはくずおれています。主よ、それがあなたの恵み深い御心なら、彼女を私たちのもとへお返しください。そうでなければ、これほど重い苦しみのもとでも身を支えられるよう、揺るがぬ心と御心に従う心をお与えください。主よ、彼女を失えば見捨てられる貧しい人々のため、施しだけでなく気づかいや看護も失う病人たちのために、彼女をお返しください。さもなければ、憐れみによって、同じ心を持ち、さらに大きな力を備えた人を、代わりにお立てください。主よ、どうか体の痛みを軽くしてください。そうでなければ、それに耐える心の力を倍にしてください。まもなく彼女を御もとへ召されるのでしたら、私たちが受ける言いようのない喪失よりも、彼女が享受すると私たちが望んでいる幸いへと、私たちの思いを向けてください。その思い出がいつまでも私たちにとって大切なものであり、人間の弱さが許す限り、その多くの美徳を常に手本として倣えますように。主よ、心の底から注ぎ出すこの祈りを、あなたの憐れみと、私たちの祝福された救い主の功績によってお受け入れください。アーメン。
  "translation_status": "reviewed"

- "id": "dl-l02-003"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But who are these merchants and traders of Ireland that make this report of \"the utmost necessity we are under of copper money\"? They are only a few betrayers of their country, confederates with Wood, from whom they are to purchase a great quantity of his coin, perhaps at half value, and vend it among us to the ruin of the public, and their own private advantage. Are not these excellent witnesses, upon whose integrity the fate of a kingdom must depend, who are evidences in their own cause, and sharers in this work of iniquity?"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[174]"
    "line_start": 1855
    "source_sequence": 211
  "translation_ja": "しかし、「銅貨がどうしても必要な状況にある」という報告をする、このアイルランドの商人や業者とは、誰なのでしょう。国を裏切る、ほんの数人の者たちにすぎません。ウッドの仲間で、彼から大量の貨幣を、おそらく半値で買い入れ、私たちの間で売りさばいて、世間を破滅させ、自分だけ利益を得るのです。自分の事件で証人になり、この不正な仕事の分け前にもあずかる者たち。その誠実さに王国の運命を託さねばならないとは、ずいぶん立派な証人ではありませんか。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-004"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If we could have deserved the liberty of coining for ourselves, as we formerly did, and why we have not is everybody's wonder as well as mine,[4] ten thousand pounds might have been coined here in Dublin of only one-fifth below the intrinsic value, and this sum, with the stock of halfpence we then had, would have been sufficient:[5] But Wood by his emissaries, enemies to God and this kingdom, hath taken care to buy up as many of our old halfpence as he could, and from thence the present want of change arises; to remove which, by Mr. Wood's remedy, would be, to cure a scratch on the finger by cutting off the arm. But supposing there were not one farthing of change in the whole nation, I will maintain, that five and twenty thousand pounds would be a sum fully sufficient to answer all our occasions. I am no inconsiderable shopkeeper in this town, I have discoursed with several of my own and other trades, with many gentlemen both of city and country, and also with great numbers of farmers, cottagers, and labourers, who all agree that two shillings in change for every family would be more than necessary in all dealings. Now by the largest computation (even before that grievous discouragement of agriculture, which hath so much lessened our numbers [6]) the souls in this kingdom are computed to be one million and a half, which, allowing but six to a family, makes two hundred and fifty thousand families, and consequently two shillings to each family will amount only to five and twenty thousand pounds, whereas this honest liberal hardwareman Wood would impose upon us above four times that sum."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[175]"
    "line_start": 1865
    "source_sequence": 212
  "translation_ja": "かつてのように、自分たちの貨幣を自分たちで鋳造する自由が、私たちにふさわしいものとして認められていたなら。なぜ認められていないのか、私だけでなく誰もが不思議に思っています。[4] それなら、実質価値と額面の差が五分の一だけの貨幣を、このダブリンで一万ポンド分鋳造できたでしょう。そして当時あった半ペニー貨と合わせれば、それで十分だったのです。[5] ところがウッドは、神とこの王国の敵である手先どもを通じて、古い半ペニー貨をできるだけ買い集める手を打ちました。いま釣銭が不足しているのは、そのためです。それをウッド氏の処方で治そうというのは、指のかすり傷を腕の切断で治すようなものです。しかし仮に、全国に釣銭が一ファージング分もなかったとしても、二万五千ポンドあれば、あらゆる必要を十分に満たせると、私は断言します。私もこの町では小さくない店を営んでいます。同業やほかの業種の人々、市内や地方の多くの紳士、そして大勢の農民、零細小作人、労働者と話をしてきましたが、すべての取引において、一家族につき二シリングの釣銭があれば十分すぎる、という点でみな意見が一致しています。さて、この王国の人口は、多めに見積もっても百五十万人とされています。人口をあれほど減らした、農業へのあの深刻な圧迫が始まる前でさえ、そうでした。[6] 一家族わずか六人としても二十五万家族ですから、各家族二シリングなら、合計は二万五千ポンドにしかなりません。ところが、あの正直で気前のよい金物商ウッドは、その四倍を超える額を私たちに押しつけようとしているのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-note-004-001"
  "section_id": "letter-02"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Time and again Ireland had petitioned the King of England for the establishment of a mint in Dublin. Both Houses of Parliament addressed King Charles I. in 1634, begging for a mint which should coin money in Ireland of the same standard and values as those of England, and allowing the profits to the government. Wentworth supported the address; but it was refused (Carte's \"Ormond,\" vol. i., pp. 79-80). When Lord Cornwallis's petition for a renewal of his patent for minting coins was presented in 1700, it was referred to a committee of the Lords Justices. In their report the Lords Justices condemned the system in vogue, and urged the establishment of a mint, in which the coining of money should be in the hands of the government and in those of a subject. No notice was taken of this advice. See Lecky's \"Ireland,\" vol. i., p. 448 (ed 1892) [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[176]"
    "line_start": 1890
    "source_sequence": 213
  "translation_ja": "アイルランドは繰り返し、ダブリンに造幣所を設けるようイングランド王に請願していた。一六三四年には議会の両院がチャールズ一世へ上申し、イングランドと同じ品位と価額の貨幣をアイルランドで鋳造し、利益を政府に納める造幣所を求めた。ウェントワースもこの上申を支持したが、認められなかった（カート『オーモンド』第一巻七九〜八〇頁）。一七〇〇年、コーンウォリス卿が貨幣鋳造特許の更新を請願すると、それは統治委員たちの委員会に付託された。その報告で統治委員たちは現行制度を非難し、貨幣鋳造を政府と臣民の手に置く造幣所の設立を強く勧めた。この助言には何の配慮もなされなかった。レッキー『アイルランド』第一巻四四八頁（一八九二年版）を参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"

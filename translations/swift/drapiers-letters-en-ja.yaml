    "xpath": "/html/body/pre[15]"
    "line_start": 6611
    "source_sequence": 684
  "translation_ja": |-
    彼らは偽りの言葉で私を取り囲み、
    理由もなく私に戦いを挑んだ。

    私の愛に報いて、彼らは敵となる。
    だが私は、祈りに身をささげる。

    彼らは私の善に悪で報い、
    私の愛に憎しみで報いた。　詩篇第一〇九篇、三、四、五節。

    不正を取り除けないのなら、裁判官になろうとするな。
    そうしなければ、権力者の顔を恐れ、
    自分の正しい道につまずきの石を置くことになる。

    町の大衆に罪を犯すな。
    そうすれば、人々の間で自らを倒すこともない。

    罪の上に罪を重ねるな。
    一つの罪によっても、罰を免れることはないのだから。
    『集会の書』第七章、六、七、八節。

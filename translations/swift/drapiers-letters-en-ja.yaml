- "id": "dl-l04-note-018-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This was the passage selected by the government upon which to found its prosecution. As Sir Walter Scott points out, it \"contains the pith and essence of the whole controversy.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[441]"
    "line_start": 5070
    "source_sequence": 506
  "translation_ja": "政府が訴追の根拠として選んだのは、この一節であった。ウォルター・スコット卿が指摘するように、ここには「論争全体の核心と本質が含まれている」。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-030"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let whoever think otherwise, I M.B. Drapier, desire to be excepted,[19] for I declare, next under God, I depend only on the King my sovereign, and on the laws of my own country; and I am so far from depending upon the people of England, that if they should ever rebel against my sovereign (which God forbid) I would be ready at the first command from His Majesty to take arms against them, as some of my countrymen did against theirs at Preston. And if such a rebellion should prove so successful as to fix the Pretender on the throne of England, I would venture to transgress that statute so far as to lose every drop of my blood to hinder him from being King of Ireland.[20]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[442]"
    "line_start": 5075
    "source_sequence": 507
  "translation_ja": "誰がそうでないと考えようと、私、M・B・ドレイピアは、その例外にしていただきたいのです。[19] 私は、神の次には、わが君主たる国王と、自国の法律にのみ依存する、と宣言します。そして、イングランド国民に依存するどころか、もし彼らが私の君主に反逆することがあれば――神よ、それを防ぎたまえ――陛下からの最初の御命令によって、彼らに対して武器を取る用意があります。わが同国人の中に、プレストンで、彼らの同国人を相手にそうした者がいたのと同じです。そして、もしその反乱が成功して、王位僭称者をイングランドの王座に据えるに至ったとしても、私は彼がアイルランドの国王となるのを阻むために、自分の血の最後の一滴を失うところまで、あえて前記の法律に背くでしょう。[20]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-note-019-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "For a humorous story which accounts for Swift's use of the words \"desire to be excepted,\" see the Drapier's sixth letter. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[443]"
    "line_start": 5087
    "source_sequence": 508
  "translation_ja": "「例外にしていただきたい」という言葉をスウィフトが使ったわけを説明する愉快な話については、ドレイピアの第六書簡を参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true

- "id": "dl-l03-note-005-005"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"After the Revolution, Col. Roger Moore being possessed of Knox's patent, commenced his coinage in Dublin, and at first kept several offices for changing his half-pence for gold or silver. He soon overstocked the kingdom so with copper money, that persons were obliged to receive large sums in it; for the officers of the crown were industrious dispensers of it, for which he allowed them a premium. It was common at that time for one to compound for 1/4 copper, and the collectors paid nothing else. The country being thus overcharged with a base coin, everyone tendered it to Col. Moore to be changed. This he refused, on pretence they were counterfeits.... On this he quitted coining in 1698, but left us in a miserable condition, which is lively represented in a Memorial presented by Will. Trench, Esq. to the Lords of the Treasury, on Mr. Wood's obtaining his patent, and which our Commissioners referred to.... Col. Moore finding the sweet of such a patent, applied to King William for a renewal of it; but his petition being referred to the government of Ireland, the affair was fairly represented to the king, whereby his designs were frustrated."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[283]"
    "line_start": 3207
    "source_sequence": 332
  "translation_ja": "「名誉革命ののち、ノックスの特許状を保有していたロジャー・ムーア大佐はダブリンで鋳造を始め、初めのうちは、自分の半ペニー銅貨を金貨または銀貨と交換する窓口を数か所設けていた。だが、彼はたちまち王国を銅貨であふれさせ、人々は多額の支払いを銅貨で受け取らざるを得なくなった。王室の役人たちが、その報酬として彼から割増金をもらって、盛んにそれをばらまいたからである。当時は、支払額の四分の一を銅貨で受け取るという取り決めをすることがよくあり、徴収官たちは銅貨以外では支払わなかった。国じゅうがこのように粗悪な貨幣であふれると、誰もがそれを交換してもらおうとムーア大佐に持ち込んだ。ところが彼は、偽物だという口実でこれを拒んだ。……こうして彼は一六九八年に鋳造をやめたが、わが国を悲惨な状態に置き去りにした。その有様は、ウッド氏が特許状を取得した際、ウィリアム・トレンチ氏が大蔵卿たちに提出し、わが国の委員たちも言及した覚書に、生き生きと描かれている。……ムーア大佐は、このような特許状のうまみを知ると、ウィリアム王にその更新を願い出た。しかし、請願がアイルランド政府に照会されると、事情が正確に国王に伝えられたため、その企ては挫かれた。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-005-006"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"In the reign of the late Queen, application was made by Robert Baird and William Harnill, Trustees for the garrison which defended Londonderry, for a patent to coin base money for Ireland ... their petition was rejected.... Since this time there have been many applications made for such patents.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[284]"
    "line_start": 3226
    "source_sequence": 333
  "translation_ja": "「先の女王の治世には、ロバート・ベアードとウィリアム・ハーニルが、ロンドンデリーを防衛した守備隊の受託者として、アイルランド向けに粗悪な貨幣を鋳造する特許状を求めて申請した。……彼らの請願は却下された。……その後も、この種の特許状を求める申請は数多く出されている」。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-015"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Put the case, that the two Houses of Lords and Commons of England, and the Privy-council there should address His Majesty to recall a patent, from whence they apprehend the most ruinous consequences to the whole kingdom: And to make it stronger if possible, that the whole nation, almost to a man, should thereupon discover the \"most dismal apprehensions\" (as Mr. Wood styles them) would His Majesty debate half an hour what he had to do? Would any minister dare advise him against recalling such a patent? Or would the matter be referred to the Privy-Council or to Westminster-hall, the two Houses of Parliament plaintiffs, and William Wood defendant? And is there even the smallest difference between the two cases?"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[285]"
    "line_start": 3233
    "source_sequence": 334
  "translation_ja": "仮に、イングランドの貴族院と庶民院、そして同国の枢密院が、王国全体にきわめて破滅的な結果をもたらすと危惧する特許状を取り消してほしいと、陛下に上奏したとしましょう。さらに念を入れるなら、これを受けて国民のほとんど一人残らずが、ウッド氏のいう「この上なく暗澹たる不安」を示したとします。陛下は、どうすべきか、三十分も思案なさるでしょうか。そのような特許状を取り消さないよう進言する勇気のある大臣が、いるでしょうか。あるいは、議会両院を原告、ウィリアム・ウッドを被告として、この件を枢密院かウェストミンスターの法廷に付すのでしょうか。そして、こちらの場合とそちらの場合に、ほんのわずかでも違いがあるでしょうか。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-016"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Were not the people of Ireland born as free as those of England? How have they forfeited their freedom? Is not their Parliament as fair a representative of the people as that of England? And hath not their Privy-council as great or a greater share in the administration of public affairs? Are they not subjects of the same King? Does not the same sun shine on them? And have they not the same God for their protector? Am I a freeman in England, and do I become a slave in six hours by crossing the Channel? No wonder then, if the boldest persons were cautious to interpose in a matter already determined by the whole voice of the nation, or to presume to represent the representatives of the kingdom, and were justly apprehensive of meeting such a treatment as they would deserve at the next session. It would seem very extraordinary if an inferior court in England, should take a matter out of the hands of the high court of Parliament, during a prorogation, and decide it against the opinion of both Houses."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[286]"
    "line_start": 3245
    "source_sequence": 335
  "translation_ja": "アイルランドの国民も、イングランドの国民と同じく、生まれながらに自由なのではありませんか。どうしてその自由を失ったというのでしょう。その議会も、イングランドの議会と同じく、公正に国民を代表しているのではありませんか。その枢密院も、公務の運営に同じほど、あるいはそれ以上の役割を担っているのではありませんか。同じ国王の臣民ではありませんか。同じ太陽が彼らを照らしているのではありませんか。そして同じ神に守られているのではありませんか。私はイングランドでは自由人なのに、海峡を渡る六時間の間に奴隷になるというのでしょうか。それなら、どれほど大胆な人でも、国民の総意によってすでに決着した事柄に介入したり、王国の代表者をさらに代表しようなどと出過ぎた真似をしたりするのを慎み、次の議会で当然受けるべき扱いを受けるのではないかと、もっともな不安を抱いたのも、不思議ではありません。イングランドの下級裁判所が、停会中に最高の議会裁判所から事件を取り上げ、両院の意見に反する判決を下したとすれば、それは大変異例のことと思われるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-017"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It happens however, that, although no persons were so bold, as to go over as evidences, to prove the truth of the objections made against this patent by the high court of Parliament here, yet these objections stand good, notwithstanding the answers made by Wood and his Council."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[287]"
    "line_start": 3261
    "source_sequence": 336
  "translation_ja": "しかし実際には、当地の最高の議会裁判所がこの特許状に対して提起した異議の正しさを証明するため、証人として海を渡るほど大胆な者はいなかったにしても、その異議は、ウッドとその弁護人たちがいかに答えようと、依然として有効なのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-018"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The Report says, that \"upon an assay made of the fineness, weight and value of this copper, it exceeded in every article.\" This is possible enough in the pieces upon which the assay was made; but Wood must have failed very much in point of dexterity, if he had not taken care to provide a sufficient quantity of such halfpence as would bear the trial; which he was well able to do, although \"they were taken out of several parcels.\" Since it is now plain, that the bias of favour hath been wholly on his side.[6]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[288]"
    "line_start": 3267
    "source_sequence": 337
  "translation_ja": "「報告」には、「この銅の純度、重さ、価値を試験したところ、すべての点で基準を上回った」とあります。試験された貨幣については、十分あり得ることでしょう。しかし、ウッドが試験に耐える半ペニー銅貨を十分な数量だけ用意しておかなかったとしたら、その手腕もずいぶんお粗末だったことになります。たとえ「いくつもの包みから取り出した」ものであっても、彼にはそれくらいできたのです。今では、ひいきの天秤がすっかり彼の側に傾いていたことが、明らかになっているのですから。[6]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-006-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The report of the assayers as abstracted by the Lords of the Committee in their report is not accurately stated. Monck Mason notes that the abstract omits the following passage: \"But although the copper was very good, and the money, one piece with another, was full weight, yet the single pieces were not so equally coined in the weight as they should have been.\" Nor is it shown that the coins assayed were of the same kind as those sent into Ireland. The Committee's report fails to see the question that must arise when it is noted that while in England a pound of copper was made into twenty-three pence, yet for Ireland Wood was permitted to make it into thirty pence, in spite of the statement that the copper used in England was worth fivepence a pound more than that used by Wood. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[289]"
    "line_start": 3277
    "source_sequence": 338
  "translation_ja": "委員会の貴族たちが報告書で要約した分析官の報告は、正確に伝えられていない。モンク・メイソンは、その要約が次の一節を省いていると指摘する。「しかし、銅は非常に良質であり、貨幣も全体を平均すれば規定の重量を満たしていたとはいえ、一枚ごとの重さは、本来そうあるべきほど均一には鋳造されていなかった」。また、試験された貨幣が、アイルランドに送られたものと同種であったことも示されていない。イングランドで使われた銅はウッドの使ったものより一ポンド当たり五ペンス高いとされているのに、イングランドでは一ポンドの銅から二十三ペンス分を鋳造し、ウッドにはアイルランド向けに三十ペンス分を鋳造することが認められている。委員会の報告書は、この点から必然的に生じる疑問を見落としている。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-019"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But what need is there of disputing, when we have positive demonstration of Wood's fraudulent practices in this point? I have seen a large quantity of these halfpence weighed by a very skilful person, which were of four different kinds, three of them considerably under weight. I have now before me an exact computation of the difference of weight between these four sorts, by which it appears that the fourth sort, or the lightest, differs from the first to a degree, that, in the coinage of three hundred and sixty tons of copper, the patentee will be a gainer, only by that difference, of twenty-four thousand four hundred and ninety-four pounds, and in the whole, the public will be a loser of eighty-two thousand one hundred and sixty-eight pounds, sixteen shillings, even supposing the metal in point of goodness to answer Wood's contract and the assay that hath been made; which it infallibly doth not. For this point hath likewise been enquired into by very experienced men, who, upon several trials in many of these halfpence, have found them to be at least one fourth part below the real value (not including the raps or counterfeits that he or his accomplices have already made of his own coin, and scattered about). Now the coinage of three hundred and sixty ton of copper coined by the weight of the fourth or lightest sort of his halfpence will amount to one hundred twenty-two thousand four hundred eighty-eight pounds, sixteen shillings, and if we subtract a fourth part of the real value by the base mixture in the metal, we must add to the public loss one fourth part to be subtracted from the intrinsic value of the copper, which in three hundred and sixty tons amounts to ten thousand and eighty pounds, and this added to the former sum of eighty-two thousand one hundred sixty-eight pounds, sixteen shillings, will make in all, ninety-two thousand two hundred forty-eight pounds loss to the public; besides the raps or counterfeits that he may at any time hereafter think fit to coin. Nor do I know whether he reckons the dross exclusive or inclusive with his three hundred and sixty ton of copper; which however will make a considerable difference in the account."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[290]"
    "line_start": 3291
    "source_sequence": 339
  "translation_ja": "しかし、この点についてはウッドの不正を明白に証明するものがあるのに、議論する必要がどこにあるでしょうか。私は、非常に熟練した人が大量の半ペニー銅貨を量るのを見ました。それらには四つの異なる種類があり、そのうち三つは、かなり目方が足りませんでした。今、私の手もとには、この四種類の重量差を正確に計算したものがあります。それによれば、第四の、つまり最も軽い種類と第一の種類との差は、三百六十トンの銅を鋳造するとき、この違いだけで特許権者に二万四千四百九十四ポンドの利益をもたらすほどです。そして、金属の質がウッドの契約と、すでに行われた分析の結果にかなっていると仮定してさえ、公衆の損失は総額八万二千百六十八ポンド十六シリングになります。実際には、その仮定は決して成り立ちません。この点も非常に経験豊かな人々が調べ、多くの半ペニー銅貨を何度も試験したところ、少なくとも本来の価値を四分の一は下回ると分かったからです。これは、彼またはその仲間が、すでに彼自身の貨幣をまねて作り、ばらまいたラップ貨や偽造貨幣を含めない話です。さて、三百六十トンの銅を、第四の、つまり最も軽い半ペニー銅貨の目方で鋳造すれば、その額は十二万二千四百八十八ポンド十六シリングになります。そして金属に粗悪な混ぜ物をしたために実質価値の四分の一を差し引くなら、銅の素材価値から失われる四分の一を、公衆の損失に加えなければなりません。これは三百六十トンで一万八十ポンドに上り、先の八万二千百六十八ポンド十六シリングに加えると、全体で公衆に九万二千二百四十八ポンドの損失となります。彼が今後いつでも好きに鋳造できるラップ貨や偽造貨幣は、また別です。さらに、この三百六十トンの銅に、かすを含めて数えているのか、除いて数えているのか、私には分かりません。どちらにしても、計算には相当の違いが生じるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-020"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "You will here please to observe, that the profit allowed to Wood by the patent is twelvepence out of every pound of copper valued at 1s. 6d. whereas 5d. only is allowed for coinage of a pound weight for the English halfpence, and this difference is almost 25 per cent. which is double to the highest exchange of money, even under all the additional pressures, and obstructions to trade, that this unhappy kingdom lies at present. This one circumstance in the coinage of three hundred and sixty ton of copper makes a difference of twenty-seven thousand seven hundred and twenty pounds between English and Irish halfpence, even allowing those of Wood to be all of the heaviest sort."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[291]"
    "line_start": 3324
    "source_sequence": 340
  "translation_ja": "ここでご注意いただきたいのは、特許状によってウッドに認められている利益が、一シリング六ペンスと評価される銅一ポンドごとに十二ペンスであるのに対し、イングランドの半ペニー銅貨では、重さ一ポンド分の鋳造に対して、五ペンスしか認められていないことです。この差はほとんど二十五パーセントに当たり、現在この不幸な王国を圧迫し、貿易を妨げているあらゆる負担を加えた状況のもとでさえ、為替相場の最高の割増率の二倍に当たります。三百六十トンの銅の鋳造では、この一点だけで、イングランドとアイルランドの半ペニー銅貨の間に二万七千七百二十ポンドの差が生じるのです。ウッドのものをすべて最も重い種類だと認めたとしても、そうなのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-021"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is likewise to be considered, that for every halfpenny in a pound weight exceeding the number directed by the patent, Wood will be a gainer in the coinage of three hundred and sixty ton of copper, sixteen hundred and eighty pounds profit more than the patent allows him; Out of which he may afford to make his comptrollers easy upon that article."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[292]"
    "line_start": 3336
    "source_sequence": 341
  "translation_ja": "また、重さ一ポンドから鋳造する枚数を、特許状で定められた枚数より半ペニー銅貨一枚増すごとに、三百六十トンの銅の鋳造で、ウッドは特許状に認められた利益を千六百八十ポンドずつ上回ることになる点も、考慮すべきです。その中から、この点について検査官たちに気を楽にしてもらうくらいの金は、出せるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-022"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As to what is alleged, that \"these halfpence far exceed the like coinage for Ireland in the reigns of His Majesty's predecessors;\" there cannot well be a more exceptionable way of arguing: Although the fact were true, which however is altogether mistaken; not by any fault in the Committee, but by the fraud and imposition of Wood, who certainly produced the worst patterns he could find, such as were coined in small numbers by permissions to private men, as butchers' halfpence, black dogs and the like, or perhaps the small St. Patrick's coin which passes for a farthing, or at best some of the smallest raps of the latest kind. For I have now by me some halfpence coined in the year 1680 by virtue of the patent granted to my Lord Dartmouth, which was renewed to Knox, and they are heavier by a ninth part than those of Wood, and in much better metal. And the great St. Patrick's halfpenny is yet larger than either."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[293]"
    "line_start": 3343
    "source_sequence": 342
  "translation_ja": "「この半ペニー銅貨は、陛下の先王たちの治世にアイルランド向けに鋳造された同種の貨幣を、はるかにしのぐ」という主張については、これほど異議の多い論法もそうはないでしょう。仮にその事実が正しかったとしてさえ、そうなのです。もっとも、実際にはまったくの誤りです。委員会の落ち度ではなく、ウッドの詐欺と欺瞞によるものです。彼は、見つけられる限り最悪の見本を出したに違いありません。たとえば、私人への許可によって少量ずつ鋳造された肉屋の半ペニー銅貨、ブラック・ドッグ貨など、あるいは、ファージング銅貨として通用する小型の聖パトリック貨、よくても、ごく最近のラップ貨の中で最も小さいものです。というのも、今私の手もとには、ダートマス卿に授与され、ノックスに更新された特許状によって一六八〇年に鋳造された半ペニー銅貨がありますが、これはウッドのものより九分の一重く、金属もずっと良質だからです。さらに、大型の聖パトリック半ペニー銅貨は、そのどちらよりも大きいのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-023"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But what is all this to the present debate? If under the various exigencies of former times, by wars, rebellions, and insurrections, the Kings of England were sometimes forced to pay their armies here with mixed or base money, God forbid that the necessities of turbulent times should be a precedent for times of peace, and order, and settlement."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[294]"
    "line_start": 3358
    "source_sequence": 343
  "translation_ja": "しかし、こうした話が今の論争と何の関係があるでしょうか。戦争、反乱、暴動など、昔のさまざまな緊急時に、イングランドの国王が、当地の軍に混合金属や粗悪な貨幣で給与を払わざるを得ないことがあったとしても、騒乱の時代の必要に迫られた措置を、平和と秩序と安定の時代の先例にするなど、あってはなりません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-024"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In the patent above mentioned granted to Lord Dartmouth, in the reign of King Charles 2d. and renewed to Knox, the securities given into the exchequer, obliging the patentee to receive his money back upon every demand, were an effectual remedy against all inconveniencies. And the copper was coined in our own kingdom, so that we were in no danger to purchase it with the loss of all our silver and gold carried over to another, nor to be at the trouble of going to England for the redressing of any abuse."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[295]"
    "line_start": 3365
    "source_sequence": 344
  "translation_ja": "先に述べた、チャールズ二世の治世にダートマス卿に授与され、ノックスに更新された特許状では、特許権者は求めがあるたびに自分の貨幣を引き取る義務を負い、その担保が財務府に差し入れられていました。これは、あらゆる不都合に対する有効な救済策でした。また、銅貨はわが王国内で鋳造されましたから、それを買うためにすべての金銀を他国に持ち去られる危険もなく、弊害を正してもらうために、わざわざイングランドへ出向く必要もなかったのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-025"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "That the Kings of England have exercised their prerogative of coining copper for Ireland and for England is not the present question: But (to speak in the style of the Report) it would \"seem a little extraordinary,\" supposing a King should think fit to exercise his prerogative by coining copper in Ireland, to be current in England, without referring it to his officers in that kingdom to be informed whether the grant was reasonable, and whether the people desired it or no, and without regard to the addresses of his Parliament against it. God forbid that so mean a man as I should meddle with the King's prerogative: But I have heard very wise men say, that the King's prerogative is bounded and limited by the good and welfare of his people. I desire to know, whether it is not understood and avowed that the good of Ireland was intended by this patent. But Ireland is not consulted at all in the matter, and as soon as Ireland is informed of it, they declare against it; the two Houses of Parliament and the Privy-council addresses His Majesty upon the mischiefs apprehended by such a patent. The Privy-council in England takes the matter out of the Parliament's cognizance; the good of the kingdom is dropped, and it is now determined that Mr. Wood shall have the power of ruining a whole nation for his private advantage."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[296]"
    "line_start": 3375
    "source_sequence": 345
  "translation_ja": "イングランドの国王が、アイルランド向けにもイングランド向けにも銅貨を鋳造する大権を行使してきたかどうかは、今の問題ではありません。しかし、ある国王が、アイルランドで銅貨を鋳造してイングランドで通用させようとお考えになり、その特許が妥当か、国民がそれを望んでいるかを知るために同王国の役人へ照会もせず、それに反対する議会の上奏も顧みなかったとすれば、それは「報告」の言い方を借りるなら、「いささか異例に思われる」でしょう。私のような卑しい者が国王の大権に口を出すなど、あってはならないことです。しかし私は、国王の大権は国民の利益と幸福によって境界を定められ、制限される、と非常に賢明な人たちが言うのを聞いたことがあります。この特許状はアイルランドの利益を意図したものだと、理解され、公言されているのではないかと、私は伺いたいのです。ところが、アイルランドはこの件について何の相談も受けず、知るや否や反対を表明します。議会両院と枢密院は、そのような特許状がもたらすと危惧される害悪について、陛下に上奏します。するとイングランドの枢密院が、この件を議会の管轄から取り上げるのです。王国の利益は放り出され、今では、ウッド氏が私利のために一国民全体を破滅させる権力を持つことに、話が決まってしまいました。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-026"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I never can suppose that such patents as these were originally granted with the view of being a job for the interest of a particular person, to the damage of the public: Whatever profit must arise to the patentee was surely meant at best but as a secondary motive, and since somebody must be a gainer, the choice of the person was made either by favour, or something else[7] or by the pretence of merit and honesty. This argument returns so often and strongly into my head, that I cannot forbear frequently repeating it. Surely His Majesty, when he consented to the passing of this patent, conceived he was doing an act of grace to his most loyal subjects of Ireland, without any regard to Mr. Wood, farther than as an instrument. But the people of Ireland think this patent (intended no doubt for their good) to be a most intolerable grievance, and therefore Mr. Wood can never succeed, without an open avowal that his profit is preferred not only before the interests, but the very safety and being of a great kingdom; and a kingdom distinguished for its loyalty, perhaps above all others upon earth. Not turned from its duty by the \"jurisdiction of the House of Lords, abolished at a stroke, by the hardships of the Act of Navigation newly enforced; By all possible obstructions in trade,\" and by a hundred other instances, \"enough to fill this paper.\" Nor was there ever among us the least attempt towards an insurrection in favour of the Pretender. Therefore whatever justice a free people can claim we have at least an equal title to it with our brethren in England, and whatever grace a good prince can bestow on the most loyal subjects, we have reason to expect it: Neither hath this kingdom any way deserved to be sacrificed to one \"single, rapacious, obscure, ignominious projector.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[297]"
    "line_start": 3396
    "source_sequence": 346
  "translation_ja": "このような特許状が、もともと公衆を害して特定の個人に利益を与える利権仕事として授与されたなどと、私は決して考えられません。特許権者に生じるどのような利益も、せいぜい第二義的な動機として意図されたに違いありません。誰かが利益を得る以上、その人物は、えこひいきか、何か別の事情によって、[7] あるいは功績と誠実さがあるという触れ込みによって、選ばれたのでしょう。この論点は、あまりにたびたび、強く私の頭に浮かんでくるので、何度も繰り返さずにはいられません。陛下がこの特許状の発給に同意されたときは、ウッド氏を手段として用いる以上には顧慮せず、アイルランドのこの上なく忠実な臣民に恩恵を施すおつもりだったに違いありません。しかし、アイルランドの国民は、この特許状を――疑いなく自分たちの利益のために意図されたものなのに――最も耐え難い苦痛だと考えています。ですからウッド氏が成功するには、一つの大きな王国の利益ばかりか、その安全と存立そのものより、彼の利益を優先するのだと、公然と認めるほかありません。しかもこの王国は、その忠節によって、おそらく地上のどの王国よりも際立っています。「貴族院の裁判権を一挙に廃止」されても、「新たに強制された航海法の苦難」に遭っても、「貿易にあらゆる妨害」を加えられても、さらに「この紙面を埋めるに足る」そのほか百もの仕打ちを受けても、臣下の務めから離れなかったのです。また、王位僭称者を支持して反乱を起こそうという企ては、わが国にはこれまで、ほんのわずかもありませんでした。したがって、自由な国民が求め得る正当な扱いについては、少なくともイングランドの同胞と同等の権利が私たちにもあり、善良な君主が最も忠実な臣民に与え得る恩恵についても、それを期待する理由があります。この王国は、たった一人の「強欲で、無名で、恥知らずな山師」の犠牲にされるようなことは、何一つしていないのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"

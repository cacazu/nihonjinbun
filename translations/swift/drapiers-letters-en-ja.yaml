- "id": "dl-l02-006"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But your Newsletter says that an assay was made of the coin. How impudent and insupportable is this? Wood takes care to coin a dozen or two halfpence of good metal, sends them to the Tower and they are approved, and these must answer all that he hath already coined or shall coin for the future. It is true indeed, that a gentleman often sends to my shop for a pattern of stuff, I cut it fairly off, and if he likes it, he comes or sends and compares the pattern with the whole piece, and probably we come to a bargain. But if I were to buy an hundred sheep, and the grazier should bring me one single wether fat and well fleeced by way of pattern, and expect the same price round for the whole hundred, without suffering me to see them before he was paid, or giving me good security to restore my money for those that were lean or shorn or scabby, I would be none of his customer. I have heard of a man who had a mind to sell his house, and therefore carried a piece of brick in his pocket, which he shewed as a pattern to encourage purchasers: And this is directly the case in point with Mr. Wood's assay.[8]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[181]"
    "line_start": 1929
    "source_sequence": 218
  "translation_ja": "しかし、あなたの新聞によると、この貨幣の試金が行われたというのです。なんと厚かましい、我慢のならない話でしょう。ウッドは抜かりなく、良い金属で半ペニー貨を一ダースか二ダース鋳造し、ロンドン塔へ送って認めてもらいます。それで、すでに鋳造したものも、今後鋳造するものも、全部の保証にしようというのです。たしかに、紳士がよく私の店へ毛織物の見本を取り寄せます。私は正直に切り取り、気に入っていただければ、ご自分か使いの者が来て、見本と反物全体を比べます。そうして、おそらく取引がまとまるでしょう。しかし私が羊を百頭買おうとするとき、牧畜業者が、太って毛並みのよい去勢雄羊をたった一頭、見本に連れてきて、それと同じ値で百頭全部を買えと言ったらどうでしょう。支払い前には見せもせず、痩せた羊、毛を刈られた羊、疥癬の羊について代金を返す確かな保証もないなら、私は彼の客にはなりません。家を売りたいと思い、買い手の気を引こうと、ポケットに煉瓦のかけらを入れて持ち歩き、見本だといって見せた男の話を聞いたことがあります。ウッド氏の試金とは、まさにそれなのです。[8]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-note-008-001"
  "section_id": "letter-02"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Monck Mason remarks on this assay that \"the assay-masters do not report that Mr. Wood's coinage was superior to that of former kings, but only to those specimens of such coinages as were exhibited by Mr. Wood, which, it is admitted were much worn. Whether the money coined in the preceding reign was good or bad is in fact nothing to the purpose.\" \"'What argument,'\" quotes Monck Mason from the tract issued in 1724 entitled, \"A Defence of the Conduct of the People of Ireland, in their unanimous refusal of Mr. Wood's Copper Money,\" \"'can be drawn from the badness of our former coinages but this, that because we have formerly been cheated by our coiners, we ought to suffer Mr. Wood to cheat us over again? Whereas, one reason for our so vigorously opposing Mr. Wood's coinage, is, because we have always been imposed upon in our copper money, and we find he is treading exactly in the steps of his predecessors, and thinks he has a right to cheat us because he can shew a precedent for it.' In truth, there was a vast number of counterfeits of those coins, which had been imported, chiefly from Scotland, as appears from a proclamation prohibiting the Importation of them in 1697\" (\"History St. Patrick's Cathedral,\" p, 340, note d.) [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[182]"
    "line_start": 1947
    "source_sequence": 219
  "translation_ja": "この試金について、モンク・メイソンはこう述べている。「試金官たちは、ウッド氏の鋳貨が過去の王たちの鋳貨より優れていたとは報告していない。ウッド氏が提出した、そうした鋳貨の標本より優れていたと報告しただけである。そしてその標本がひどく摩耗していたことは認められている。前の治世に鋳造された貨幣が良かったか悪かったかなど、実際、問題に関係ない。」モンク・メイソンはさらに、一七二四年刊の小冊子『ウッド氏の銅貨を全員一致で拒否したアイルランド人民の行動の弁護』から引用している。「『以前の鋳貨が悪かったということから、何が言えるだろう。私たちはこれまで貨幣鋳造者にだまされてきたのだから、ウッド氏にもう一度だまされるのを甘受すべきだ、ということ以外に。むしろ私たちがウッド氏の鋳貨にこれほど激しく反対する理由の一つは、これまで銅貨ではいつも不当な目に遭わされてきたからであり、彼も前任者とまったく同じ道を歩み、先例を示せるのだからだます権利があると考えているのが分かるからである。』実際、これらの貨幣には莫大な数の偽造品があり、主としてスコットランドから輸入されていた。このことは、一六九七年にその輸入を禁じた布告から分かる」（『聖パトリック大聖堂史』三四〇頁、注d）。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"

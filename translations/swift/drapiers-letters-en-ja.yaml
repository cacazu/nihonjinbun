- "id": "dl-l03-note-013-004"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"By Poyning's Law,\" says Lecky, \"a great part of the independence of the Irish Parliament had indeed been surrendered; but even the servile Parliament which passed it, though extending by its own authority to Ireland laws previously enacted in England, never admitted the right of the English Parliament to make laws for Ireland.\" (\"Hist. Ireland,\" vol. ii., p. 154; 1892 ed). [T.S.]"

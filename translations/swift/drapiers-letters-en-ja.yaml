  "section_id": "letter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Sir Robert Filmer, the political writer who suffered for his adhesion to the cause of Charles I. His chief work was published after his death in 1680. It is entitled, \"Patriarcha,\" and defends the patriarchal theory of government against the social-compact theory of Hobbes. Locke vigorously attacked it in his \"Two Treatises on Government\" published in 1690."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[650]"
    "line_start": 7372
    "source_sequence": 756
  "translation_ja": "サー・ロバート・フィルマー。チャールズ一世の側に固く立ったため、苦難を受けた政治著述家である。主著は、没後の一六八〇年に刊行された。『家父長制論』と題し、ホッブズの社会契約説に対して、家父長的な統治の理論を擁護している。ロックは、一六九〇年刊の『統治二論』でこれを激しく攻撃した。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"

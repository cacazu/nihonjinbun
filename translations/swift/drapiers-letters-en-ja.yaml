    "xpath": "/html/body/p[692]"
    "line_start": 7827
    "source_sequence": 807
  "translation_ja": "イングランドに不在滞在している軍の上級将校たちの俸給。これは多額になります。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-034"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Four commissioners of the revenue, always absent."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[693]"
    "line_start": 7831
    "source_sequence": 808
  "translation_ja": "つねに不在である四人の歳入委員。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-035"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Civil employments very numerous, and of great income."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[694]"
    "line_start": 7834
    "source_sequence": 809
  "translation_ja": "非常に数が多く、収入も大きい文官職。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-036"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The vast charge of appeals to the House of Lords, and to the Court of Delegates."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[695]"
    "line_start": 7837
    "source_sequence": 810
  "translation_ja": "貴族院や委任上訴裁判所への上訴にかかる莫大な費用。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-037"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Students at the Inns of Court, and the two Universities."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[696]"
    "line_start": 7841
    "source_sequence": 811
  "translation_ja": "法学院と二つの大学に学ぶ学生たち。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-038"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Eighty thousand pounds sent yearly to England, for coals; whereof the prime cost is nothing; and therefore, the profit wholly theirs."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[697]"
    "line_start": 7844
    "source_sequence": 812
  "translation_ja": "石炭の代金として毎年イングランドへ送られる八万ポンド。その原価はただも同然ですから、利益はすべてあちらのものになります。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-039"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "One hundred thousand pounds paid several years past, for corn sent over hither from England; the effect of our own great wisdom in discouraging agriculture."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[698]"
    "line_start": 7848
    "source_sequence": 813
  "translation_ja": "イングランドからこの国へ送られてきた穀物に、ここ数年、支払われた十万ポンド。農業を冷遇するという、私たち自身のたいへん賢明な政策の結果です。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-040"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The kind liberty granted us of wearing Indian stuffs, and calicoes, to gratify the vanity and folly of our women; which, beside the profit to England, is an unconceivable loss to us; forcing the weavers to beg in our streets, or transport themselves to foreign countries."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[699]"
    "line_start": 7853
    "source_sequence": 814
  "translation_ja": "わが国の女性たちの虚栄と愚かさを満足させるため、インドの織物やキャラコを着る自由を、親切にも私たちに与えてくださったこと。これはイングランドに利益をもたらすほか、私たちには想像もつかないほどの損失を与え、織物職人たちを、わが国の街路で物乞いさせるか、外国へ移住させることになります。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-041"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The prodigious loss to us, and gain to England, by selling them all our wool at their own rates; whereof the manufacture exceeds above ten times the prime cost: A proceeding without example in the Christian or heathen world."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[700]"
    "line_start": 7859
    "source_sequence": 815
  "translation_ja": "私たちの羊毛をすべて、イングランドの言い値で売ることによる、こちらの莫大な損失と、あちらの利益。羊毛を製品にすれば、その価値は原価の十倍を超えるのです。キリスト教世界にも異教世界にも、例のない仕打ちです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-042"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Our own wool returned upon us, in English manufactures, to our infinite shame and damage; and the great advantage of England."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[701]"
    "line_start": 7865
    "source_sequence": 816
  "translation_ja": "私たち自身の羊毛が、イングランド製の製品となって送り返されてくること。それは私たちの計り知れない恥と損害になり、イングランドの大きな利益になります。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-043"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The full profit of all our mines accruing to England; an effect of great negligence and stupidity."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[702]"
    "line_start": 7869
    "source_sequence": 817
  "translation_ja": "私たちの鉱山の利益がすべてイングランドに帰すること。ひどい怠慢と愚かさの結果です。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-044"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "An affectation among us, of liking all kinds of goods made in England."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[703]"
    "line_start": 7873
    "source_sequence": 818
  "translation_ja": "あらゆる種類のイングランド製品を好む、この国の気取り。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-045"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "NOTE, Many of the above articles have been since particularly computed by another writer, to whose treatise the reader is referred.[4]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[704]"
    "line_start": 7876
    "source_sequence": 819
  "translation_ja": "注。上記の項目の多くは、その後、別の著者が詳しく計算していますので、読者にはその論考をご参照いただきたいと存じます。[4]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-note-004-001"
  "section_id": "letter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The work referred to is \"A List of the Absentees of Ireland, and the yearly value of their estates and Incomes spent abroad,\" by Thomas Prior, Esq. Prior was a native of Ireland and the schoolfellow and life-long friend of Berkeley, the philosopher. In concert with Samuel Madden and other friends, he founded, in 1731, the Dublin Society for the Promotion of Agriculture, Manufactures, Arts and Sciences. This society was the parent of the present Royal Dublin Society. His \"List of the Absentees of Ireland\" was published in 1729. He also issued \"Observations on Coin\" (1730), and \"An Authentic Narrative of the Success of Tar Water in Curing a great number and variety of Distempers\" (1746), to which Berkeley contributed. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[705]"
    "line_start": 7880
    "source_sequence": 820
  "translation_ja": "ここで指している著作は、トマス・プライアー氏の『アイルランド不在地主一覧、および国外で費消される彼らの土地と収入の年額』である。プライアーはアイルランド出身で、哲学者バークリーの学友であり、生涯にわたる友人だった。サミュエル・マデンらの友人と協力し、一七三一年に、農業、製造業、技芸、科学の振興を目的とするダブリン協会を創設した。この協会が、現在の王立ダブリン協会の母体となった。『アイルランド不在地主一覧』は一七二九年に刊行された。ほかに『貨幣についての考察』（一七三〇年）、またバークリーも寄稿した『タール水が数多くのさまざまな疾病の治療にもたらした成功についての確かな記録』（一七四六年）を刊行している。［T.S.］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l07-046"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These and many other articles, which I cannot recollect at present, are agreed by judicious men to amount to near seven hundred thousand pounds per ann. clear profit to England. And, upon the whole, let any man look into those authors who write upon the subject of commerce, he shall find, that there is not one single article in the essentials, or circumstances of trade, whereby a country can be a loser, which we do not possess in the highest perfection; somewhat, in every particular, that bears a kind of analogy to William Wood; and now the branches are all cut off, he stands ready with his axe at the root."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[706]"
    "line_start": 7893
    "source_sequence": 821
  "translation_ja": "これらの項目と、今は思い出せないほかの多くの項目を合わせると、イングランドに毎年ほぼ七十万ポンドの純益がもたらされると、分別のある人々の見解は一致しています。総じて、誰であれ商業を論じた著者たちを調べれば、貿易の本質や諸条件のうち、一国の損失となりうる要素で、この国が最高度に備えていないものは一つもないことがわかるでしょう。どの点にも、ウィリアム・ウッドにどこか似たものがあるのです。そして、枝がすべて切り払われた今、彼は根元に斧を振り下ろそうと、構えているのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-047"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Upon this subject of perpetual absentees, I have spent some time in very insignificant reflections; and considering the usual motives of human actions, which are pleasure, profit, and ambition, I cannot yet comprehend how those persons find their account in any of the three. I speak not of those English peers or gentlemen, who, beside their estates at home, have possessions here; for, in that case, the matter is desperate; but I mean those lords, and wealthy knights, or squires, whose birth, and partly their education, and all their fortune (except some trifle, and that in very few instances) are in this kingdom. I knew many of them well enough, during several years, when I resided in England; and truly I could not discover that the figure they made was, by any means, a subject for envy; at least it gave me two very different passions: For, excepting the advantage of going now and then to an opera, or sometimes appearing behind a crowd at Court; or adding to the ring of coaches in Hyde Park, or losing their money at the Chocolate House; or getting news, votes, and minutes, about five days before us in Dublin, I say, besides these, and a few other privileges of less importance, their temptations to live in London, were beyond my knowledge or conception. And I used to wonder, how a man of birth and spirit, could endure to be wholly insignificant and obscure in a foreign country, when he might live with lustre in his own; and even at less than half that expense, which he strains himself to make, without obtaining any one end; except that which happened to the frog when he would needs contend for size with the ox. I have been told by scholars, that Caesar said, he would rather be the first man, in I know not what village, than the second in Rome. This, perhaps, was a thought only fit for Caesar: But to be preceded by thousands, and neglected by millions; to be wholly without power, figure, influence, honour, credit, or distinction, is not, in my poor opinion, a very amiable situation of life, to a person of title, or wealth, who can so cheaply and easily shine in his native country."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[707]"
    "line_start": 7904
    "source_sequence": 822
  "translation_ja": "私は、恒常的な不在地主というこの問題について、いくらかの時間を取って、ささやかなことを考えてみました。人間を行動に駆り立てるいつもの動機である、快楽、利益、野心を考えてみても、この人々がそのどれについて得をしているのか、いまだに理解できません。私が申すのは、本国の土地に加えてこちらにも所領を持つ、イングランドの貴族や紳士たちのことではありません。その場合は、手の打ちようがないからです。私が指すのは、この王国で生まれ、教育もある程度ここで受け、全財産が——わずかな例外にすぎない人々の、ごく小さなものを除いて——この王国にある、貴族や裕福な騎士、郷紳たちです。イングランドに住んでいた数年の間、私はその多くをかなりよく知っていましたが、正直なところ、あちらでの彼らの暮らしぶりに、何か羨むべきものがあるとは、どうしても思えませんでした。少なくとも私には、それとはまるで違う二つの感情が湧いたものです。というのも、ときどきオペラへ行けるとか、たまに宮廷で群衆の後ろに顔を出せるとか、ハイド・パークを巡る馬車の輪に加われるとか、チョコレート・ハウスで金をすれるとか、ダブリンの私たちより五日ばかり早く、新聞や議会決議、議事録を手にできるとか、そうしたことや、そのほかのさらに小さな特権を別にすれば、ロンドン暮らしに彼らがどんな魅力を感じるのか、私にはわからず、想像もつかなかったからです。そして、生まれもよく気概もある者が、祖国では華やかに暮らせるのに、異国ではまったく取るに足りない、影の薄い存在であることに、どうして耐えられるのか、不思議でなりませんでした。しかも祖国では、無理をして使っている費用の半分以下で、それができるのです。そうして無理をしても、得られるものといえば、牛と大きさを競わずにはおれなかったカエルと、同じ結末くらいしかありません。学者たちから聞いたのですが、カエサルは、ローマで二番目の者になるより、どこだったかの村で第一の者でありたい、と言ったそうです。これは、カエサルにしかふさわしくない考えだったかもしれません。しかし、何千人もの者に先を越され、何百万人にも無視され、権力も威容も影響力も、名誉も信用も特別な扱いも、まったく持たないというのは、私のささやかな考えでは、爵位や富があり、祖国ならわずかな金でたやすく光り輝ける人にとって、あまり魅力的な境遇ではありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-048"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But, besides the depopulating of the kingdom, the leaving so many parts of it wild and uncultivated, the ruin of so many country-seats and plantations, the cutting down all the woods to supply expenses in England; the absence of so many noble and wealthy persons, hath been the cause of another fatal consequence, which few perhaps have been aware of. For if that very considerable number of lords, who possess the amplest fortunes here, had been content to live at home, and attend the affairs of their own country in Parliament; the weight, reputation, and dignity thereby added to that noble House, would, in all human probability, have prevented certain proceedings, which are now ever to be lamented; because they never can be remedied: And we might have then decided our own properties among ourselves, without being forced to travel five hundred miles by sea and land, to another kingdom, for justice; to our infinite expense, vexation, and trouble: Which is a mark of servitude without example, from the practice of any age or nation in the world."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[708]"
    "line_start": 7936
    "source_sequence": 823
  "translation_ja": "しかし、このように多くの貴族や富裕な人々が不在であることは、王国の人口を減らし、国土の多くを荒れ地のまま耕さずに置き、数多くの田舎の邸宅や植林地を荒廃させ、イングランドでの出費を賄うために森をことごとく伐採させるばかりではありません。もう一つ、おそらく気づいている人の少ない、致命的な結果の原因にもなっています。この国に最大級の財産を持つ、相当な数の貴族たちが、祖国に住むことで満足し、議会で自国の問題に携わっていたなら、あの高貴な議院に加わったはずの重みと名声と尊厳によって、どう考えても、ある手続きは防げたことでしょう。もはや改めることができないため、今や永遠に嘆かずにはいられない手続きです。そうしていれば、私たちは自分たちの財産の争いを、自分たちの間で裁定できたでしょうし、正義を求めて別の王国へ、海路と陸路を合わせて五百マイルも旅を強いられずにすんだでしょう。こうして私たちは、限りない費用と苦痛と面倒を負っているのです。これは、世界のいかなる時代、いかなる国の慣行にも例のない、隷属のしるしです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-049"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have sometimes wondered, upon what motive the peerage of England were so desirous to determine our controversies; because I have been assured, and partly know, that the frequent appeals from hence, have been very irksome to that illustrious body; and whoever hath frequented the Painted Chamber, and Court of Requests, must have observed, that they are never so nobly filled, as when an Irish appeal is under debate."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[709]"
    "line_start": 7953
    "source_sequence": 824
  "translation_ja": "私はときどき、イングランドの貴族たちが、どんな動機から、私たちの争いを裁定することに、それほど熱心だったのだろうと不思議に思います。というのも、こちらからの頻繁な上訴は、あの輝かしい議院にとって、ひどく厄介なものであったと、私は確かな人から聞いていますし、一部は自分でも知っているからです。また、ペインテッド・チェンバーやコート・オヴ・リクエスツの部屋へ足を運んだことのある方なら、アイルランドからの上訴が審議されるときほど、あそこが高貴な方々で埋まることはない、とお気づきになったはずです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-050"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The peers of Scotland, who are very numerous, were content to reside in their castles and houses, in that bleak and barren climate; and although some of them made frequent journeys to London, yet I do not remember any of their greatest families, till very lately, to have made England their constant habitation, before the Union: Or, if they did, I am sure it was generally to their own advantage; and whatever they got, was employed to cultivate and increase their own estates; and by that means enrich themselves and their country."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[710]"
    "line_start": 7961
    "source_sequence": 825
  "translation_ja": "非常に数の多いスコットランドの貴族たちは、あの寒々とした不毛の気候の中で、自分の城や屋敷に住んで満足していました。中にはしばしばロンドンへ旅をする人々もいましたが、あちらの最有力の家柄の人々が、合同以前にイングランドを定住の地とした例は、ごく最近のことを除いて、記憶にありません。仮にそうしたとしても、たいていは自分たちの利益のためだったことは確かですし、得たものはすべて、自分たちの土地を改良し増やすために用いられ、そのようにして、自分たちと祖国を豊かにしたのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-051"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As to the great number of rich absentees, under the degree of peers; what particular ill effects their absence may have upon this kingdom, besides those already mentioned, may perhaps be too tender a point for me to touch. But whether those who live in another kingdom, upon great estates here; and have lost all regards to their own country, further than upon account of the revenues they receive from it: I say, whether such persons may not be prevailed on to recommend others to vacant seats, who have no interest here, except a precarious employment; and consequently can have no views, but to preserve what they have got, or to be higher advanced: This, I am sure, is a very melancholy question, if it be a question at all."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[711]"
    "line_start": 7971
    "source_sequence": 826
  "translation_ja": "爵位を持たない、多数の裕福な不在地主については、すでに述べたこと以外に、その不在がこの国へどのような具体的な悪影響を及ぼすかは、私が触れるには、繊細すぎる問題かもしれません。しかし、この国の大きな所領の収入で、別の王国に暮らし、そこから収入を受け取るということ以外には、祖国に対する一切の関心を失った人々が、空いた議席へ、頼りない官職のほかにはこの国に何の利害関係もなく、したがって、得たものを守るか、さらに昇進すること以外には、何一つ目指しえない人々を推薦するよう、仕向けられるおそれはないのでしょうか。もしこれが、そもそも問うまでもないことだと言わぬのであれば、まことに陰鬱な問いであることは確かです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-052"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But, besides the prodigious profit which England receives by the transmittal thither of two-thirds of the revenues of this whole kingdom; it hath another mighty advantage by making our country a receptacle, wherein to disburthen themselves of their supernumerary pretenders to offices; persons of second-rate merit in their own country; who, like birds of passage, most of them thrive and fatten here, and fly off when their credit and employments are at an end. So that Ireland may justly say what Luther said of himself; POOR Ireland maketh many rich."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[712]"
    "line_start": 7984
    "source_sequence": 827
  "translation_ja": "しかし、イングランドが、この王国全体の収入の三分の二を送金させることで、途方もない利益を受け取るほかに、もう一つの大きな利点があります。この国を、余った官職志願者を厄介払いする受け皿にできることです。自国では二流の実力しかない人々で、その多くは渡り鳥のように、ここで栄えて肥え太り、信用と役職が尽きると飛び去ってゆきます。ですから、アイルランドは、ルターが自分自身について言った言葉を、そのまま言ってよいのです。「貧しきアイルランド、多くの者を富ませる」と。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-053"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If amidst all our difficulties, I should venture to assert, that we have one great advantage, provided we could improve it as we ought; I believe most of my readers would be long in conjecturing what possible advantage could ever fall to our share. However, it is certain, that all the regular seeds of party and faction among us are entirely rooted out, and if any new ones shall spring up, they must be of equivocal generation, without any seed at all; and will justly be imputed to a degree of stupidity beyond even what we have been ever charged with upon the score of our birth-place and climate."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[713]"
    "line_start": 7994
    "source_sequence": 828
  "translation_ja": "これほどの困難のただ中にあっても、ふさわしく活用できさえすれば、私たちには一つの大きな利点がある、と私があえて主張したなら、読者の大半は、いったいどんな利点が私たちの取り分になりうるのか、長いこと考え込むでしょう。しかし、私たちの間では、党派や派閥を生み出す通常の種はすべて、完全に根こそぎ取り除かれたことは確かです。今後何か新たなものが芽生えるとしたら、それは種一つなしに自然発生したものであるに違いありません。そしてそれは、生まれた土地や気候のせいとして、これまで私たちに浴びせられてきた非難をさえ超える愚かさによるものと、当然ながら見なされるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-054"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The parties in this kingdom (including those of modern date) are, First, of those who have been charged or suspected to favour the Pretender; and those who were zealous opposers of him. Secondly, of those who were for and against a toleration of Dissenters by law. Thirdly, of High and Low Church; or, (to speak in the cant of the times) of Whig and Tory: And, Fourthly, of court and country. If there be any more, they are beyond my observation or politics: For as to subaltern or occasional parties, they have all been derivations from the same originals."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[714]"
    "line_start": 8005
    "source_sequence": 829
  "translation_ja": "この王国の党派は、新しく生まれたものも含めて、第一に、王位請求者を支持すると非難され、あるいは疑われてきた者と、その者に熱心に反対する者です。第二に、非国教徒を法律で容認することに、賛成する者と反対する者です。第三に、高教会派と低教会派、あるいは当世の決まり文句を使えば、ホイッグとトーリーです。そして第四に、宮廷派と在野派です。このほかにもあるとすれば、私の観察や政治知識の及ぶ範囲を超えています。というのも、下位の党派や、その場かぎりの党派は、すべて、この同じ源から派生したものだからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-055"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now, it is manifest, that all these incitements to faction, party, and division are wholly removed from among us. For, as to the Pretender, his cause is both desperate and obsolete: There are very few now alive who were men in his father's time, and in that prince's interest; and in all others, the obligation of conscience hath no place;[5] even the Papists in general, of any substance, or estates, and their priests almost universally, are what we call Whigs in the sense which by that word is generally understood. They feel the smart, and see the scars of their former wounds; and very well know, that they must be made a sacrifice to the least attempts towards a change; although it cannot be doubted, that they would be glad to have their superstition restored, under any prince whatsoever."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[715]"
    "line_start": 8015
    "source_sequence": 830
  "translation_ja": "さて、こうした派閥や党派や分裂への誘いが、私たちの間からすっかり除かれたことは、明らかです。王位請求者についていえば、その望みにはもう見込みがなく、話そのものが時代遅れだからです。その父の時代に成人していて、父王の側に立っていた者は、今ではほとんど生き残っていません。それ以外のすべての者には、良心の義務が関与する余地はありません。[5] 財産や土地をいくらか持つカトリック教徒さえ、おおむね、そしてその司祭たちはほぼ例外なく、私たちがその語の一般的な意味で、ホイッグと呼ぶ人々です。彼らは以前受けた傷の痛みを感じ、その傷痕を見ており、変革に向けたどんなささやかな企てにも、自分たちが犠牲に供されるほかないと、よく承知しています。もっとも、いかなる君主の下であれ、自分たちの迷信が復活するなら喜ぶだろうことは、疑いありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-note-005-001"
  "section_id": "letter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "That is to say, they had not sworn any allegiance to him. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[716]"
    "line_start": 8029
    "source_sequence": 831
  "translation_ja": "つまり、彼らはその人物に忠誠の誓いを立てていなかった、ということである。［T.S.］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l07-056"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Secondly, The Dissenters are now tolerated by law; neither do we observe any murmurs at present from that quarter, except those reasonable complaints they make of persecution, because they are excluded from civil employments; but their number being very small in either House of Parliament, they are not yet in a situation to erect a party: Because, however indifferent men may be with regard to religion, they are now grown wise enough to know, that if such a latitude were allowed to Dissenters; the few small employments left us in cities and corporations, would find other hands to lay hold on them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[717]"
    "line_start": 8033
    "source_sequence": 832
  "translation_ja": "第二に、非国教徒は今では法律で容認されています。今のところ、その方面から不平の声が聞こえるとすれば、文官の職から締め出されているため迫害されている、と彼らが訴える、あの道理のある苦情くらいです。しかし、議会のどちらの院でも、その人数は非常に少ないので、まだ党派を立ち上げられる状況ではありません。というのも、人々は宗教についてはどれほど無頓着であっても、非国教徒にそれほどの自由を認めたなら、都市や自治団体に私たちのために残されている、わずかな小役職は、別の者たちの手に取られてしまう、とわかるくらいには、今では賢くなっているからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-057"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thirdly, The dispute between High and Low Church is now at an end; two-thirds of the bishops having been promoted in this reign, and most of them from England, who have bestowed all preferments in their gift to those they could well confide in: The deaneries all except three, and many principal church-livings, are in the donation of the crown: So that we already possess such a body of clergy as will never engage in controversy upon that antiquated and exploded subject."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[718]"
    "line_start": 8044
    "source_sequence": 833
  "translation_ja": "第三に、高教会派と低教会派の争いは、今や終わっています。主教の三分の二は今の御代に任じられ、その大半はイングランドから来た者で、自分たちに任命権のある聖職をすべて、十分信頼できる人々に与えてしまったからです。三つを除くすべての首席司祭職と、主要な聖職禄の多くは、国王に授与権があります。したがって私たちは、この古くさく、すでに斥けられた問題について、決して論争にかかわらないような聖職者の集まりを、すでに持っているのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-058"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lastly, As to court and country parties, so famous and avowed under most reigns in English Parliaments: This kingdom hath not, for several years past been a proper scene whereon to exercise such contentions; and is now less proper than ever; many great employments for life being in distant hands, and the reversions diligently watched and secured; the temporary ones of any inviting value are all bestowed elsewhere as fast as they drop; and the few remaining, are of too low consideration to create contests about them, except among younger brothers, or tradesmen like myself. And, therefore, to institute a court and country party without materials, would be a very new system in politics, and what I believe was never thought on before; nor, unless in a nation of idiots, can ever succeed. For the most ignorant Irish cottager will not sell his cow for a groat."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[719]"
    "line_start": 8053
    "source_sequence": 834
  "translation_ja": "最後に、大部分の御代のイングランド議会で、名も知られ、公然と存在を認められている宮廷派と在野派についてです。この王国は、ここ数年、そのような争いを演じるのにふさわしい舞台ではなく、今は以前にも増して不向きです。終身の重要な官職の多くが遠くの者たちの手にあり、その後継の権利も丹念に見張られ、押さえられています。任期付きで何らかの魅力的な価値のある職は、空きが出るそばから、すべてよそへ与えられます。わずかに残るものは、私のような商人や、家の跡を継げない弟たちの間は別として、それをめぐって争いが起きるほどの値打ちがありません。ですから、材料もないのに宮廷派と在野派を設けるというのは、政治上のまったく新しい方式で、これまで誰も考えつかなかったことだと思いますし、愚か者の国でもなければ、決して成功しないでしょう。何しろ、もっとも無知なアイルランドの小屋住まいの農民でさえ、グロート銀貨一枚で牛を売りはしないのですから。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-059"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Therefore, I conclude, that all party and faction, with regard to public proceedings, are now extinguished in this kingdom; neither doth it appear in view how they can possibly revive; unless some new causes be administered; which cannot be done without crossing the interests of those who are greatest gainers by continuing the same measures. And, general calamities without hope of redress, are allowed to be the great uniters of mankind."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[720]"
    "line_start": 8068
    "source_sequence": 835
  "translation_ja": "したがって私は、この王国では、公の事柄に関するあらゆる党派と派閥は、今や消滅していると結論いたします。新たな原因が持ち込まれないかぎり、どうすれば復活しうるのか、見当もつきません。そしてそのような原因を作るには、同じ政策を続けることで、もっとも得をしている人々の利害に、逆らわずにはいられないのです。また、救済の望みもない共通の災難こそ、人間をもっとも強く結びつけるものだということは、広く認められています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-060"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "However we may dislike the causes; yet this effect of begetting an universal concord among us in all national debates, as well as in cities, corporations, and country neighbourhoods, may keep us at least alive, and in a condition to eat the little bread allowed us in peace and amity. I have heard of a quarrel in a tavern, where all were at daggers-drawing, till one of the company cried out, desiring to know the subject of the quarrel; which, when none of them could tell, they put up their swords, sat down, and passed the rest of the evening in quiet. The former part hath been our case; I hope the latter will be so too; that we shall sit down amicably together, at least until we have something that may give us a title to fall out; since nature hath instructed even a brood of goslings to stick together while the kite is hovering over their heads."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[721]"
    "line_start": 8077
    "source_sequence": 836
  "translation_ja": "その原因がどれほど気に入らなくても、国全体のあらゆる議論において、また都市や自治団体、地方の近隣関係においても、私たちの間に広く一致を生むというこの結果は、少なくとも私たちを生き延びさせ、許されているわずかなパンを、平和と友愛のうちに食べられるようにするかもしれません。私はある酒場の喧嘩の話を聞いたことがあります。皆が刃を抜いてにらみ合っていたところ、一人が声を上げて、何が喧嘩の原因か知りたいと言いました。誰にも答えられなかったので、彼らは剣を収め、腰を下ろし、その晩の残りを穏やかに過ごしたそうです。前半は私たちの境遇そのものです。後半もそうなってほしいと願っています。少なくとも、争うだけの理由となる何かを手に入れるまでは、仲よく一緒に腰を下ろしていたいものです。鳶が頭上を舞っている間は離れずにいるよう、自然はガチョウの雛の一群にさえ教えているのですから。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-061"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is certain, that a firm union in any country, where every man wishes the same thing with relation to the public, may, in several points of the greatest importance, in some measure, supply the defect of power; and even of those rights which are the natural and undoubted inheritance of mankind. If the universal wish of the nation upon any point, were declared by the unanimous vote of the House of Commons, and a reasonable number of Lords; I should think myself obliged in conscience to act in my sphere according to that vote; because, in all free nations, I take the proper definition of law to be the will of the majority of those who have the property in land; which, if there be a monarchy, is to be confirmed by the royal assent. And, although such votes or declarations have not received such a confirmation, for certain accidental reasons; yet I think they ought to be of much weight with the subject; provided they neither oppose the King's prerogative, endanger the peace of the nation, nor infringe any law already in force; none of which, however, can reasonably be supposed. Thus, for instance, if nine in ten of the House of Commons, and a reasonable number of native temporal peers, should declare, that whoever received or uttered brass coin, except under certain limitations and securities, should be deemed as enemies to the King and the nation; I should think it a heinous sin in myself to act contrary to such a vote: And, if the same power should declare the same censure against those who wore Indian stuffs and calicoes, or woollen manufactures imported from abroad, whereby this nation is reduced to the lowest ebb of misery; I should readily, heartily, and cheerfully pay obedience; and to my utmost power persuade others to do the like: Because, there is no law of this land obliging us either to receive such coin, or to wear such foreign manufactures."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[722]"
    "line_start": 8091
    "source_sequence": 837
  "translation_ja": "どの国であれ、公のことについて皆が同じことを望んでいるなら、固い団結によって、いくつかのもっとも重要な点では、権力の欠如をある程度補えることは確かです。さらには、人類に生まれながらの、疑いえない相続財産である、あの権利の欠如さえも補えるでしょう。ある問題についての国民全体の願いが、庶民院の全会一致の決議と、相当数の貴族たちの決議によって表されたなら、私は良心にかけて、自分の立場でその決議に従って行動する義務があると考えます。というのも、すべての自由な国において、法の正しい定義とは、土地を所有する人々の多数の意志であり、君主制であれば、それに国王の裁可が加わるべきものだと、私は考えるからです。そのような決議や宣言が、何らかの偶然の事情によって、裁可を受けていないとしても、臣民にとっては大いに重みを持つべきものと考えます。ただし、それが国王の大権に反せず、国の平穏を危うくせず、現に効力のある法律を侵害しないことが条件です。もっとも、どれも、そのような事態を合理的に想定することはできません。ですから、たとえば庶民院の十分の九と、相当数のこの国出身の世俗貴族が、一定の制限と保証がないかぎり、真鍮貨を受け取ったり流通させたりする者は誰でも、国王と国民の敵と見なすと宣言したなら、その決議に反する行動を取ることは、私にとって大きな罪だと考えます。また、同じ権威が、この国を悲惨のどん底に沈める原因となっている、インドの織物やキャラコ、あるいは外国から輸入した毛織物を身に着ける者にも、同じ譴責を宣言したなら、私は進んで、心から、喜んで従い、ほかの人々にもそうするよう、力のかぎり説くつもりです。この国には、そのような貨幣を受け取ることも、そのような外国製品を着ることも、私たちに義務づける法律はないからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-062"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Upon this last article, I could humbly wish that the reverend the clergy would set us an example, by contenting themselves with wearing gowns, and other habiliments of Irish drapery; which, as it would be some incitement to the laity, and set many hands to work; so they would find their advantage in the cheapness; which is a circumstance not to be neglected by too many among that venerable body.[6] And, in order to this, I could heartily desire, that the most ingenious artists of the weaving trade, would contrive some decent stuffs and silks for clergymen, at reasonable rates.[7]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[723]"
    "line_start": 8120
    "source_sequence": 838
  "translation_ja": "この最後の点について、私は謹んで、尊敬すべき聖職者の皆様が、アイルランド製の織物の法衣や、そのほかの衣服を着ることで満足され、私たちに模範を示していただきたいと願います。それは俗人をいくらか励まし、多くの人々に仕事を与えるばかりでなく、聖職者ご自身も、安くすむ利点をお感じになることでしょう。あの尊敬すべき集団の、あまりにも多くの方々にとって、それは無視できない事情なのです。[6] そして、そのために、織物業でもっとも工夫に富む職人たちが、聖職者にふさわしい品のよい織物や絹地を、手ごろな値で作り出してくれることを、私は心から望みます。[7]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-note-006-001"
  "section_id": "letter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This hath since been put in practice, by the persuasions, and influence of the supposed author; but much defeated by the most infamous fraud of shop-keepers. [F.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[724]"
    "line_start": 8131
    "source_sequence": 839
  "translation_ja": "これは、その著者とされる人物の説得と影響によって、その後実行されたが、商店主たちのこの上なく恥知らずな詐欺によって、大いに妨げられた。［F.］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: F."
- "id": "dl-l07-note-007-001"
  "section_id": "letter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This scheme was likewise often urged to the weavers by the supposed author; but he could never prevail upon them to put it in practice. [F.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[725]"
    "line_start": 8136
    "source_sequence": 840
  "translation_ja": "その著者とされる人物は、この案も織物職人たちに繰り返し勧めたが、実行するよう説得することは、ついにできなかった。［F.］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: F."
- "id": "dl-l07-063"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have pressed several of our most substantial brethren, that the whole corporation of weavers in silk and woollen, would publish some proposals, (I wish they would do it to both Houses of Parliament) inviting persons of all degrees, and of both sexes, to wear the woollen and silk manufactures of our own country; entering into solemn, mutual engagements, that the buyer shall have good, substantial, merchantable ware for his money; and at a certain rate, without the trouble of cheapening: So that, if I sent a child for a piece of stuff of a particular colour and fineness, I should be sure not to be deceived; or if I had reason to complain, the corporation should give me immediate satisfaction; and the name of the tradesman who did me the wrong, should be published; and warning given not to deal with him for the future; unless the matter plainly appeared to be a mistake: For, besides the trouble of going from shop to shop; an ignorant customer runs the hazard of being cheated in the price and goodness of what he buys; being forced to an unequal combat with a dexterous, and dishonest man, in his own calling. Thus our goods fall under a general disreputation; and the gentry call for English cloth, or silk, from an opinion they have (and often too justly by our own faults) that the goodness more than makes up for the difference of price."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[726]"
    "line_start": 8141
    "source_sequence": 841
  "translation_ja": "私は、同業者のうちでもとりわけ資力のある数人に、強く勧めてきました。絹織物と毛織物の職人組合全体で、あらゆる身分の男女に、自国の毛織物や絹織物を身に着けるよう呼びかける提案を、公にしていただきたいのです。できれば、それを議会両院へ提出してほしいと願っています。そして、買い手は代金に見合う、良質で丈夫な、ちゃんとした商品を、値切る面倒もなく、定まった値段で得られるという、厳粛な相互の約束を結んでもらいたいのです。そうすれば、私が特定の色と織りの細かさの布地を買いに子供をやっても、騙されないと確信できますし、不満を申し立てる理由があれば、組合が直ちに埋め合わせをしてくれるはずです。また、私を不当に扱った商人の名は公表され、今後その者と取引しないよう警告が出されるべきです。明らかな間違いだったと判明した場合は、別ですが。というのも、客は店から店へ歩き回る面倒だけでなく、事情を知らなければ、買う品の値段と品質をごまかされる危険にもさらされるからです。相手はその道の熟練者で、不正直な人間であり、自分の得意分野で、不釣り合いな勝負を強いてくるのです。このために、この国の品物は全体として悪い評判を受けるようになり、上流の人々は、品質のよさで値段の違いは十分埋め合わせられると考えて、イングランドの毛織物や絹を求めるのです。その考えは、私たち自身の落ち度のために、往々にしてもっともなのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-064"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Besides, it hath been the sottish and ruinous practice of us tradesmen, upon any great demand of goods, either at home or from abroad, to raise the prices immediately, and manufacture the said goods more slightly and fraudulently than before."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[727]"
    "line_start": 8162
    "source_sequence": 842
  "translation_ja": "そのうえ、私たち商人の間では、国内からであれ国外からであれ、品物に大きな需要が生じると、直ちに値を上げ、それまでより粗雑で、ごまかしの多い作り方をするという、愚かで身を滅ぼす慣行が続いています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-065"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Of this foul and foolish proceeding, too many instances might be produced; and I cannot forbear mentioning one, whereby this poor kingdom hath received such a fatal blow in the only article of trade allowed us of any importance that nothing but the success of Wood's project, could outdo it. During the late plague in France, the Spaniards, who buy their linen cloths in that kingdom, not daring to venture thither for fear of infection; a very great demand was made here for that commodity, and exported to Spain: But, whether by the ignorance of the merchants, or dishonesty of the Northern weavers, or the collusion of both; the ware was so bad, and the price so excessive, that except some small quantity, which was sold below the prime cost, the greatest part was returned back: And I have been told by very intelligent persons, that if we had been fair dealers, the whole current of the linen trade to Spain would have taken its course from hence."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[728]"
    "line_start": 8168
    "source_sequence": 843
  "translation_ja": "この卑しく愚かなやり方の例は、あまりにも多く挙げられます。そのうち一つには、触れずにはおれません。この貧しい王国に許された、ただ一つの重要な商業分野に、致命的な打撃を与えた例であり、ウッドの計画の成功でもなければ、これを上回ることはできないでしょう。先ごろフランスでペストが流行したとき、あの国で亜麻布を買うスペイン人たちは、感染を恐れて、危険を冒して渡ろうとはしませんでした。そこで、こちらに亜麻布の非常に大きな需要が生じ、スペインへ輸出されたのです。ところが、商人の無知のためか、北部の織物職人の不正直さのためか、それとも両者の結託のためか、品物の質はあまりに悪く、値段はあまりに高かったので、原価を下回る値で売られた少量を除き、大部分が送り返されました。たいへん事情に通じた人々から聞いたのですが、私たちが公正な商売をしていれば、スペインへ向かう亜麻布貿易の流れは、すべてこちらを起点とするようになっていたはずだそうです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-066"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If any punishment were to be inflicted on numbers of men; surely there could none be thought too great for such a race of traitors, and enemies to God and their country; who for the prospect of a little present gain, do not only ruin themselves, (for that alone would be an example to the rest, and a blessing to the nation) but sell their souls to hell, and their country to destruction; And, if the plague could have been confined only to these who were partakers in the guilt, had it travelled hither from Marseilles, those wretches would have died with less title to pity, than a highwayman going to the gallows."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[729]"
    "line_start": 8184
    "source_sequence": 844
  "translation_ja": "もし大勢の人間に罰を科すことがあるとすれば、このような裏切り者の一族、神と祖国の敵に対して、重すぎると思われる罰など、決してないはずです。彼らは、目先のわずかな利益を見込んで、自分自身を破滅させるだけではありません。それだけなら、ほかの者の戒めとなり、国にとっては恵みとなるでしょう。彼らは、自分の魂を地獄へ、祖国を破滅へと売り渡すのです。もしペストがマルセイユからこちらへ渡ってきて、その罪に加担した者たちだけに閉じ込められたとしたら、あの悪党どもは、絞首台へ向かう追い剥ぎよりも、憐れみに値しない死を遂げたでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-067"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But, it happens very unluckily, that, for some time past, all endeavours or proposals from private persons, to advance the public service; however honestly and innocently designed, have been called flying in the King's face: And this, to my knowledge, hath been the style of some persons, whose ancestors, (I mean those among them who had any) and themselves, have been flying in princes' faces these fourscore years; and from their own inclinations would do so still, if their interest did not lead them rather to fly in the face of a kingdom; which hath given them wings to enable them for such a flight."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[730]"
    "line_start": 8195
    "source_sequence": 845
  "translation_ja": "ところが、まことに不運なことに、ここしばらくは、たとえどれほど誠実で無害な意図に基づいていても、一私人が公益を進めようとする努力や提案は、すべて「国王の御顔に飛びかかること」と呼ばれています。しかも、私の知るところでは、その言い方をしているのは、本人もその先祖も——先祖と呼べるものがあった連中のことですが——この八十年間、君主の顔に飛びかかってきた人々です。彼らは自分の性分からすれば、今でもそうするでしょう。ただ、自分の利益に従うなら、むしろ一つの王国の顔に飛びかかるほうがよいのです。その王国こそ、彼らに翼を与えて、そのような飛翔を可能にしたのですが。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-068"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thus, about four years ago, when a discourse was published, endeavouring to persuade our people to wear their own woollen manufactures,[8] full of the most dutiful expressions to the King, and without the least party hint; it was termed \"flying in the King's face;\" the printer was prosecuted in the manner we all remember; (and, I hope, it will somewhere be remembered further) the jury kept eleven hours, and sent back nine times, till they were under the necessity of leaving the prisoner to the mercy of the court, by a special verdict. The judge on the bench invoking God for his witness, when he asserted, that the author's design was to bring in the Pretender.[9]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[731]"
    "line_start": 8206
    "source_sequence": 846
  "translation_ja": "たとえば、四年ほど前、この国の人々に、自国製の毛織物を着るよう勧める論考が刊行されました。[8] 国王へのこの上なく恭順な言葉に満ち、党派をほのめかすところなど少しもなかったのに、「国王の御顔に飛びかかること」と呼ばれました。印刷業者は、皆が覚えているあのやり方で訴追されました。どこかで、この先も覚えられていることを願います。陪審は十一時間も引き留められ、九度も審議に戻され、とうとう特別評決によって、囚人の処遇を裁判所の慈悲に委ねるほかなくなったのです。裁判席の判事は、著者の狙いは王位請求者を呼び込むことだと断言し、その証人として神に呼びかけたのでした。[9]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-note-008-001"
  "section_id": "letter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This was Swift's pamphlet entitled, \"A Proposal for the Universal Use of Irish Manufactures.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[732]"
    "line_start": 8218
    "source_sequence": 847
  "translation_ja": "これはスウィフトの小冊子『アイルランド製品の全面的な使用のための提案』である。［T.S.］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l07-note-009-001"
  "section_id": "letter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The action and language of Justice Whitshed. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[733]"
    "line_start": 8222
    "source_sequence": 848
  "translation_ja": "ホイットシェッド判事の行為と言葉を指す。［T.S.］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l07-069"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And thus also, my own poor endeavours to prevent the ruin of my country, by the admission of Wood's coin, was called by the same persons, \"flying in the King's face;\" which I directly deny: For I cannot allow that vile representation of the royal countenance in William Wood's adulterate copper, to be his Sacred Majesty's face; or if it were, my flying was not against the impression, but the baseness of the metal; because I well remembered; that the image which Nebuchadnezzar \"commanded to be set up, for all men to fall down and worship it,\" was not of copper, but pure gold. And I am heartily sorry, we have so few royal images of that metal among us; the sight whereof, although it could hardly increase our veneration for His Majesty, which is already so great; yet would very much enliven it with a mixture of comfort and satisfaction."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[734]"
    "line_start": 8225
    "source_sequence": 849
  "translation_ja": "同じように、ウッドの貨幣を受け入れることで祖国が破滅するのを防ごうとする、私のささやかな努力も、同じ人々から「国王の御顔に飛びかかること」と呼ばれました。私はこれをきっぱりと否定いたします。ウィリアム・ウッドの粗悪な銅に刻まれた、あの王の御容貌の卑しい似姿を、神聖なる陛下の御顔だと認めるわけにはいかないからです。仮にそうだとしても、私が飛びかかったのは、刻まれた肖像ではなく、金属の質の悪さです。私はよく覚えていました。ネブカドネザルが「あらゆる人がひれ伏して礼拝するよう、建てさせた」像は、銅ではなく、純金だったのです。そして、この国にその金属で作られた王の御像が、これほど少ないことを、心から残念に思います。それを目にしても、すでにこれほど大きい陛下への崇敬が、さらに増すことはまずないでしょう。しかし、慰めと満足が混じることによって、その崇敬はいっそう生き生きしたものとなるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-070"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Alexander the Great, would suffer no statuary, except Phidias, to carve his image in stone or metal. How must he have treated such an operator as Wood, who goes about with sackfuls of dross; odiously misrepresenting his Prince's countenance; and would force them, by thousands, upon every one of us, at above six times the value."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[735]"
    "line_start": 8239
    "source_sequence": 850
  "translation_ja": "アレクサンドロス大王は、フェイディアス以外のいかなる彫刻家にも、石や金属で自分の像を作ることを許しませんでした。王の御容貌を見苦しく歪めて表した滓を、袋いっぱいに詰めて持ち歩き、私たちの誰にでも、何千枚も、その価値の六倍を超える値段で押しつけようとする、ウッドのような細工人を、大王ならどう扱ったことでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-071"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But, notwithstanding all that hath been objected by William Wood himself; together with his favourers, abettors, supporters, either public or private; by those who connive at his project, or discourage and discountenance his opposers, for fear of lessening their favour, or hazarding their employments; by those who endeavour to damp the spirit of the people raised against this coin; or check the honest zeal of such as by their writings, or discourses, do all they can to keep it up: Those softeners, sweeteners, compounders; and expedient-mongers, who shake their heads so strongly, that we can hear their pockets jingle; I did never imagine, that, in detecting the practices of such enemies to the kingdom, I was \"flying in the King's face\"; or thought they were better representers of His Majesty, than that very coin, for which they are secret or open advocates."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[736]"
    "line_start": 8246
    "source_sequence": 851
  "translation_ja": "しかし、ウィリアム・ウッド本人が何を反論しようとも、また、公然であれ内々であれ、彼をひいきし、加担し、支える者たちが、何を言おうとも、私の考えは変わりません。彼らの中には、寵愛を失ったり官職を危うくしたりするのを恐れ、彼の計画を見逃したり、反対者たちの気をくじき、冷遇したりする者もいます。この貨幣に対して立ち上がった国民の気概を弱めようとしたり、文章や話によって、それを保つためにできるかぎりを尽くす人々の、誠実な熱意を抑えようとしたりする者もいます。角を丸め、甘い言葉で包み、妥協を取り持ち、弥縫策を売り歩く連中で、あまり激しく頭を振るので、ポケットの中の金が鳴る音さえ聞こえるほどです。このような王国の敵の行いを暴くことで、私が「国王の御顔に飛びかかっている」などと考えたことは、一度もありません。また、彼らが密かに、あるいは公然と弁護しているあの貨幣以上に、彼らが陛下をよく代表する者だと考えたこともありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-072"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If I were allowed to recite only those wishes of the nation, which may be in our power to attain; I think they might be summed up in these few following."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[737]"
    "line_start": 8261
    "source_sequence": 852
  "translation_ja": "もし、実現が私たちの力に及ぶような国の願いだけを列挙することを許されるなら、次の少数の項目にまとめられると思います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-073"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "First, That an end might be put to our apprehensions of Wood's halfpence, and to any danger of the like destructive scheme for the future."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[738]"
    "line_start": 8266
    "source_sequence": 853
  "translation_ja": "第一に、ウッドの半ペニー銅貨に対する不安と、今後の同様な破壊的計画の危険を、終わらせていただきたいということです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-074"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Secondly; That halfpence might be coined in this kingdom, by a public mint, with due limitations."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[739]"
    "line_start": 8270
    "source_sequence": 854
  "translation_ja": "第二に、この王国の公の造幣所で、適切な制限の下に、半ペニー銅貨を鋳造していただきたいということです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-075"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thirdly, That the sense of both Houses of Parliament, at least of the House of Commons, were declared by some unanimous and hearty votes, against wearing any silk or woollen manufactures, imported from abroad, as likewise against wearing Indian silks or calicoes, which are forbidden under the highest penalties in England: And it behoves us, to take example from so wise a nation; because we are under a greater necessity to do so, since we are not allowed to export any woollen manufactures of our own; which is the principal branch of foreign trade in England."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[740]"
    "line_start": 8274
    "source_sequence": 855
  "translation_ja": "第三に、国外から輸入される絹織物や毛織物を着用することに反対し、また、イングランドではもっとも重い罰をもって禁じられている、インドの絹やキャラコを着用することにも反対する、全会一致の、心のこもった決議によって、議会両院、少なくとも庶民院の意向を表していただきたいということです。私たちは、このように賢い国の例に倣うべきです。私たちのほうが、そうする必要はいっそう大きいからです。イングランドでは外国貿易の主要な部門である、自国の毛織物の輸出を、私たちは一切認められていないのですから。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-076"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Fourthly, That some effectual methods may be taken to civilize the poorer sort of our natives, in all those parts of this kingdom where the Irish abound; by introducing among them our language and customs; for want of which they live in the utmost ignorance, barbarity and poverty; giving themselves wholly up to idleness, nastiness, and thievery, to the very great and just reproach of too many landlords. And, if I had in me the least spirit of a projector, I would engage that this might be effected in a few years, at a very inconsiderable charge.[10]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[741]"
    "line_start": 8284
    "source_sequence": 856
  "translation_ja": "第四に、この王国でアイルランド人が多く住むすべての地域で、土地の住民のうち貧しい人々を文明化するため、実効ある手段を講じていただきたいということです。その人々の間に、私たちの言語と慣習を広めるのです。それを欠くために、彼らは極度の無知と野蛮と貧困の中に暮らし、怠惰と不潔と盗みにすっかり身を委ねています。このため、あまりにも多くの地主が、きわめて大きな、そして当然の非難を受けることになります。もし私に計画屋の心意気が少しでもあれば、ほんのわずかな費用で、数年のうちにこれを実現すると、お約束するところです。[10]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-note-010-001"
  "section_id": "letter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Since this hint was suggested, several useful seminaries have been instituted, under the name of \"Charter Working Schools,\" in Ireland, supported by the royal benefaction of a thousand pounds a year, by a tax on hawkers and pedlars, and by voluntary subscriptions. The schools are for the education of boys and girls born of Popish parents; in most of them, the children manufacture their own clothing, and the boys are employed in matters relative to husbandry. [F.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[742]"
    "line_start": 8294
    "source_sequence": 857
  "translation_ja": "この示唆がなされて以来、アイルランドでは「勅許労働学校」の名で、有用な教育施設がいくつか設けられた。年千ポンドの国王の寄付、街の売り子や行商人への税、自発的な寄付によって支えられている。これらはカトリック教徒の両親から生まれた少年少女の教育のための学校で、大半の学校では子供たちが自分の衣服を作り、男子は農業に関する仕事に従事している。［F.］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: F., T.S."
- "id": "dl-l07-note-010-002"
  "section_id": "letter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "These Charter Schools, founded by Marsh, Bishop of Clogher, and adopted by Primate Boulter in 1733, were intended \"to rescue the souls of thousands of poor children from the dangers of Popish superstition and idolatry, and their bodies from the miseries of idleness and beggary.\" In reality the scheme was one by which it was hoped to prevent the growth of Catholicism. The conditions and methods of instruction were positively cruel, since the children were actually withheld from any communication with their parents. Mr. Lecky deals with the subject fully in the first volume of his \"Ireland in the Eighteenth Century,\" Froude gives the scheme his praise and admiration, but at the time of its institution it was the cause of \"an intensity of bitterness hardly equalled by any portion of the penal code. Parents would rather do anything than send their children into such prisons where, at last, they would receive an education which, to their minds, must lead them to forfeit their soul's salvation.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[743]"
    "line_start": 8303
    "source_sequence": 858
  "translation_ja": "これらの勅許学校は、クロガー主教マーシュによって創設され、一七三三年に首座主教ボールターが採用した。その目的は、「幾千もの貧しい子供たちの魂を、カトリックの迷信と偶像崇拝の危険から救い、身体を怠惰と物乞いの悲惨から救う」こととされた。実際には、カトリック信仰の拡大を防ごうとする制度だった。子供たちは親といかなる連絡を取ることも実際に禁じられていたので、教育の条件も方法も、まぎれもなく残酷だった。レッキー氏は『十八世紀のアイルランド』第一巻で、この問題を詳しく扱っている。フルードはこの制度を褒め、称賛しているが、設立当時は、「刑罰法規のどの部分にも、ほとんど匹敵するものがないほどの激しい恨み」の原因となった。「両親は、子供をあのような牢獄に送るくらいなら、何でもしたほうがよいと考えた。そこでは結局、自分たちの考えでは、魂の救いを失わせるに違いない教育を、子供が受けることになるからである。」［T.S.］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: F., T.S."
- "id": "dl-l07-077"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Fifthly, That due encouragement should be given to agriculture; and a stop put to that pernicious practice of graziers; engrossing vast quantities of land, sometimes at great distance; whereby the country is extremely depopulated."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[744]"
    "line_start": 8319
    "source_sequence": 859
  "translation_ja": "第五に、農業を適切に奨励し、ときには遠く離れた所まで広大な土地を独占して、国の人口を甚だしく減らしている、牧畜業者たちの有害な慣行を、止めていただきたいということです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-078"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sixthly, That the defects in those acts for planting forest trees, might be fully supplied, since they have hitherto been wholly ineffectual; except about the demesnes of a few gentlemen; and even there, in general, very unskilfully made, and thriving accordingly. Neither hath there yet been due care taken to preserve what is planted, or to enclose grounds; not one hedge, in a hundred, coming to maturity, for want of skill and industry. The neglect of copsing woods cut down, hath likewise been of very ill consequences. And if men were restrained from that unlimited liberty of cutting down their own woods before the proper time, as they are in some other countries; it would be a mighty benefit to the kingdom. For, I believe, there is not another example in Europe, of such a prodigious quantity of excellent timber cut down, in so short a time, with so little advantage to the country, either in shipping or building."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[745]"
    "line_start": 8325
    "source_sequence": 860
  "translation_ja": "第六に、森林となる樹木の植樹を定めた法律の不備を、十分に補っていただきたいということです。これまで、少数の紳士の直営地の周辺を除いて、その法律はまったく効き目がなかったからです。その周辺でさえ、一般に植え方はひどく拙く、生育もそれに見合ったものです。植えたものを保護したり、土地を囲ったりするための、十分な注意もいまだに払われておらず、技術と勤勉さが足りないため、百の生け垣のうち、一つも育ち切らないほどです。伐採した森を再び茂らせることを怠ったのも、非常に悪い結果を生んでいます。また、ほかのいくつかの国で行われているように、自分の森だからといって、適した時期より前に、際限なく伐採する自由を制限するなら、この王国には大いに有益でしょう。これほど大量の優れた材木が、これほど短い間に伐り倒されながら、造船にせよ建築にせよ、国のためになることがこれほど少ない例は、ヨーロッパのほかにはないと、私は思うのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-079"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I may add, that absurd practice of cutting turf, without any regularity; whereby great quantities of restorable land are made utterly desperate, many thousands of cattle destroyed, the turf more difficult to come at, and carry home, and less fit for burning; the air made unwholesome by stagnating pools and marshes; and the very sight of such places offensive to those who ride by. Neither should that odious custom be allowed, of cutting scraws, (as they call them) which is flaying off the green surface of the ground, to cover their cabins; or make up their ditches; sometimes in shallow soils, where all is gravel within a few inches; and sometimes in low ground, with a thin greensward, and sloughy underneath; which last turns all into bog, by this mismanagement. And, I have heard from very skilful country-men, that by these two practices in turf and scraws, the kingdom loseth some hundreds of acres of profitable land every year; besides the irreparable loss of many skirts of bogs, which have a green coat of grass, and yet are mangled for turf; and, besides the want of canals, by regular cutting, which would not only be a great convenience for bringing their turf home at an easy rate; but likewise render even the larger bogs more dry and safe, for summer pasture."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[746]"
    "line_start": 8340
    "source_sequence": 861
  "translation_ja": "さらに、何の秩序もなく泥炭を切り取るという、愚かな慣行も付け加えられます。このため、再生可能な土地が大量に、まったく回復の望みを失い、何千頭もの家畜が失われ、泥炭は掘り出すにも家へ運ぶにも難しくなり、燃料としても劣るものになります。よどんだ池や沼地によって空気は不健康になり、そのような場所の眺め自体が、馬で通りかかる人々の気分を害します。また、小屋の屋根を葺いたり、溝の土手を築いたりするために、地面の緑の表面を剝ぎ取る、「スクロー」と呼ぶ芝土の切り取りも、あの忌まわしい慣習として、許されるべきではありません。わずか数インチ下はすべて砂利であるような、土の浅い所でも行われますし、薄い緑の芝の下がぬかるんでいる低地でも行われます。後者は、このような無茶な扱いによって、全体が泥炭湿地になってしまいます。たいへん詳しい農村の人々から聞いたのですが、泥炭と芝土についてのこの二つのやり方によって、王国は毎年、数百エーカーの有益な土地を失っているそうです。そのうえ、草の緑の覆いを持ちながら、泥炭のために切り荒らされる、数多くの湿地の縁の、取り返しのつかない損失もあります。また、秩序立てて切り取ればできるはずの水路も、失われています。その水路があれば、泥炭を安く家へ運ぶための大きな便宜となるだけでなく、大きな泥炭湿地でさえ、より乾いて安全になり、夏の放牧に使えるようになるのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-080"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These, and some other speculations of the like kind, I had intended to publish in a particular discourse against this session of Parliament; because, in some periods of my life, I had opportunity and curiosity to observe, from what causes those great errors, in every branch of country management, have arisen; of which I have now ventured to relate but few, out of very many; whereof some, perhaps, would not be mentioned without giving offence; which I have endeavoured, by all possible means, to avoid. And, for the same reason, I chose to add here, the little I thought proper to say on this subject."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[747]"
    "line_start": 8360
    "source_sequence": 862
  "translation_ja": "こうしたことや、そのほか同種の考察を、私は今会期の議会に間に合うよう、独立した論考として刊行しようと思っていました。これまでの人生のある時期には、農村経営のあらゆる部門で見られる、あの大きな誤りが、どんな原因から生じてきたのかを観察する機会があり、また関心もあったからです。今、私があえて述べたのは、非常に多い例のうち、ごく少数にすぎません。中には、述べると不興を招かずにはすまないものもあるでしょう。不興を招くことは、私はあらゆる手段を尽くして避けようとしてきました。そして同じ理由から、この問題について述べてよいと考えたわずかなことを、ここに添えることにしたのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-081"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But, as to the lands of those who are perpetual absentees, I do not see any probability of their being ever improved. In former times, their tenants sat at easy rents; but for some years past, they have been, generally speaking, more terribly racked by the dexterity of merciless agents from England, than even those held under the severest landlords here. I was assured upon the place, by great numbers of credible people, that a prodigious estate in the county of Cork, being let upon leases for lives, and great fines paid; the rent was so high, that the tenants begged leave to surrender their leases, and were content to lose their fines."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[748]"
    "line_start": 8371
    "source_sequence": 863
  "translation_ja": "しかし、恒常的な不在地主の土地に至っては、いつか改良されるという見込みは、私にはまったく見えません。以前は、その小作人たちは楽な地代で土地を借りていましたが、ここ数年は、一般にいって、イングランドから来た無慈悲な管理人たちの手腕によって、この国でももっとも厳しい地主の下にいる者たち以上に、恐ろしく絞り上げられてきました。コーク州のある巨大な所領では、人の生存期間を期限とする借地契約が結ばれ、多額の契約金も支払われたのに、地代があまりに高いため、小作人たちは契約を返上する許しを求め、契約金を失ってもよいと考えていた、と私は現地で、大勢の信用できる人々から、確かな話として聞きました。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-082"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The cultivating and improvement of land, is certainly a subject worthy of the highest enquiry in any country, but especially in ours; where we are so strangely limited in every branch of trade, that can be of advantage to us; and utterly deprived of those, which are of the greatest importance; whereof I defy the most learned man in Europe, to produce me an example from any other kingdom in the world: For, we are denied the benefits which God and nature intended to us; as manifestly appears by our happy situation for commerce, and the great number of our excellent ports. So that, I think, little is left us, beside the cultivating our own soil, encouraging agriculture, and making great plantations of trees, that we might not be under the necessity of sending for corn and bark from England, and timber from other countries. This would increase the number of our inhabitants, and help to consume our natural products, as well as manufactures at home. And I shall never forget what I once ventured to say to a great man in England; \"That few politicians, with all their schemes, are half so useful members of a commonwealth, as an honest farmer; who, by skilfully draining, fencing, manuring, and planting, hath increased the intrinsic value of a piece of land; and thereby done a perpetual service to his country;\" which it is a great controversy, whether any of the former ever did, since the creation of the world; but no controversy at all, that ninety-nine in a hundred, have done abundance of mischief."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[749]"
    "line_start": 8382
    "source_sequence": 864
  "translation_ja": "土地の耕作と改良は、どの国でも、もっとも深く調査するに値する問題であることは確かですが、私たちの国では、とりわけそうです。私たちに利益となる商業のあらゆる分野で、異様なまでに制限され、もっとも重要な分野は、すっかり奪われているからです。ヨーロッパでもっとも学識の深い人に、世界のほかの王国から、これに比べられる例を示してみていただきたいものです。商業に恵まれた位置と、多数の優れた港が、はっきり示しているとおり、私たちは神と自然が与えようとされた利益を、否定されているのです。ですから、自分たちの土地を耕し、農業を奨励し、大々的に植樹すること以外、私たちに残されたことはほとんどないと、私は思います。そうすれば、穀物と樹皮をイングランドから、材木をほかの国々から取り寄せる必要もなくなるでしょう。これによって住民の数が増え、国内で、製造品だけでなく天然の産物を消費する助けにもなります。そして、かつてイングランドのある偉い方に、私があえて申し上げたことを、決して忘れません。「政治家たちは、ありとあらゆる計画を持っていても、巧みに排水し、囲いを設け、肥料を施し、作物を植えることによって、一筆の土地そのものの価値を高め、祖国に永続する奉仕をした、誠実な農夫の半分ほどにも、この国にとって有用でない者が、ほとんどなのです」と。世界の創造以来、政治家のうち誰か一人でも、そのような奉仕をしたことがあるかとなると、大いに議論になります。しかし、百人のうち九十九人が、山ほどの害をなしたことには、まったく議論の余地がありません。"
  "translation_status": "reviewed"
  "translation_required": true

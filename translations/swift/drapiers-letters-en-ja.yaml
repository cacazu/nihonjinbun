- "id": "dl-l03-note-005-004"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "[Footnote B: \"A proclamation was issued by the lord lieutenant, declaring these half-pence to be the current coin of the kingdom, but it provided that none should be enforced to take more than five shillings in the payment of one hundred pounds, and so proportionately in all greater and lesser sums.... This patent was granted, by and with, the advice of James, Duke of Ormond\" (Monck Mason, \"History of St. Patrick's,\" p. 334, note y).]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[282]"
    "line_start": 3198
    "source_sequence": 331
  "translation_ja": "［注B：「総督によって布告が出され、これらの半ペニー銅貨が王国の通用貨幣であると宣言された。ただし、百ポンドの支払いに際して五シリングを超えて受け取ることを強制される者はなく、それより大きい額も小さい額も、すべて同じ割合によるものと定められていた。……この特許状は、オーモンド公ジェームズの助言に基づき、その同意を得て授与された」（モンク・メイソン『聖パトリック大聖堂史』三三四頁、注y）。］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"

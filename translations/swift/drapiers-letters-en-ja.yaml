    "xpath": "/html/body/p[667]"
    "line_start": 7552
    "source_sequence": 782
  "translation_ja": "鋳造額を四万ポンドへ減らすというウォルポールの申し出を指す。［T.S.］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"

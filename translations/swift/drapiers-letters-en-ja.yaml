    "line_start": 5123
    "source_sequence": 511
  "translation_ja": "特にウィリアム三世の治世である。ジェームズ二世の召集したアイルランド議会の権威を失墜させるため、このイングランド優越の主張が採られた。［S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"

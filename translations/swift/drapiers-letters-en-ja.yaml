- "id": "dl-l06-041"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am confident your lordship will be of my sentiments in one thing, that some short plain authentic tract might be published for the information both of petty and grand juries, how far their power reacheth, and where it is limited, and that a printed copy of such a treatise might be deposited in every court, to be consulted by the jurymen before they consider of their verdict; by which abundance of inconveniences would be avoided, whereof innumerable instances might be produced from former times, because I will say nothing of the present."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[644]"
    "line_start": 7255
    "source_sequence": 748
  "translation_ja": "一つのことについては、閣下も私と同じお考えだと確信しています。小陪審と大陪審の双方のために、その権限がどこまで及び、どこで限られるかを知らせる、短く平明で信頼できる論説を刊行し、その印刷物を各法廷に一部ずつ置き、陪審員が評決を考える前に参照できるようにすればよい、ということです。そうすれば、多くの不都合を避けられるでしょう。その実例は、昔のことから無数に挙げられます。今のことは、何も申しません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-042"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have read somewhere of an eastern king who put a judge to death for an iniquitous sentence, and ordered his hide to be stuffed into a cushion, and placed upon the tribunal for the son to sit on, who was preferred to his father's office. I fancy such a memorial might not have been unuseful to a son of Sir William Scroggs, and that both he and his successors would often wriggle in their seats as long as the cushion lasted. I wish the relater had told us what number of such cushions there might be in that country."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[645]"
    "line_start": 7265
    "source_sequence": 749
  "translation_ja": "どこかで、東方のある王の話を読みました。不正な判決を下した判事を死刑にし、その皮を詰め物入りの座布団に仕立てて、裁判官の席に置かせ、父の職を継がせた息子を、その上に座らせたというのです。こういう形見は、サー・ウィリアム・スクロッグズの息子にも、無用ではなかったかもしれません。その座布団がもつ間は、本人も後任者たちも、しばしば座席で身をよじっただろうと思います。この話の語り手が、あの国にはこんな座布団がいくつあったのか、教えてくれていればよかったのですが。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-043"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I cannot but observe to your lordship how nice and dangerous a point it is grown for a private person to inform the people even in an affair where the public interest and safety are so highly concerned as that of Mr. Wood, and this in a country where loyalty is woven into the very hearts of the people, seems a little extraordinary. Sir William Scroggs was the first who introduced that commendable acuteness into the courts of judicature; but how far this practice hath been imitated by his successors or strained upon occasion, is out of my knowledge. When pamphlets unpleasing to the ministry were presented as libels, he would order the offensive paragraphs to be read before him, and said it was strange that the judges and lawyers of the King's Bench should be duller than all the people of England; and he was often so very happy in applying the initial letters of names, and expounding dubious hints (the two common expedients among writers of that class for escaping the law) that he discovered much more than ever the authors intended, as many of them or their printers found to their cost. If such methods are to be followed in examining what I have already written or may write hereafter upon the subject of Mr. Wood, I defy any man of fifty times my understanding and caution to avoid being entrapped, unless he will be content to write what none will read, by repeating over the old arguments and computations, whereof the world is already grown weary. So that my good friend Harding lies under this dilemma, either to let my learned works hang for ever a drying upon his lines, or venture to publish them at the hazard of being laid by the heels."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[646]"
    "line_start": 7275
    "source_sequence": 750
  "translation_ja": "私人が人々に情報を知らせることが、ウッド氏の件のように、公共の利益と安全にこれほど深く関わる事柄においてすら、いかに微妙で危険なことになったか、閣下に申し上げずにはいられません。しかも、忠誠が人々の心そのものに織り込まれた国でのことですから、いささか異様に思えます。この称賛すべき鋭さを、法廷に初めて持ち込んだのはサー・ウィリアム・スクロッグズでした。しかし後任たちが、このやり方をどこまでまねたか、あるいは場合によってどこまで拡張したかは、私の知るところではありません。大臣たちの気に入らない小冊子が、誹謗文書として告発されると、彼は問題の段落を自分の前で読ませ、王座裁判所の判事や法律家が、イングランドの人民全体よりも鈍いとは不思議なことだ、と言ったものです。そして、名の頭文字が誰を指すかを当てたり、曖昧なほのめかしを解いたりすることに、しばしば実に巧妙な手腕を発揮しました。これは、その種の筆者が法律を逃れるために使う、お決まりの二つの手段ですが、彼は著者が意図したことより、ずっと多くを発見したのです。その著者や印刷者の多くが、身にしみて知ったとおりです。ウッド氏について、私がこれまで書いたものや今後書くかもしれないものを調べるのに、こういうやり方を使うのなら、私の五十倍もの理解力と用心深さがある人でも、罠に落ちずに済むものかと思います。世間がもう飽きた古い論拠や計算を繰り返し、誰も読まないものを書くだけで満足するのでなければ、ですが。ですから、私のよき友ハーディングは、二つに一つの難題を抱えています。私の学識豊かな著作を、いつまでも縄に掛けて乾かしたままにしておくか、足枷をはめられる危険を冒して、出版に踏み切るかです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-044"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I need not tell your lordship where the difficulty lies. It is true, the King and the laws permit us to refuse this coin of Mr. Wood, but at the same time it is equally true, that the King and the laws permit us to receive it. Now it is most certain the ministers in England do not suppose the consequences of uttering that brass among us to be so ruinous as we apprehend; because doubtless if they understood it in that light, they are persons of too much honour and justice not to use their credit with His Majesty for saving a most loyal kingdom from destruction. But as long as it shall please those great persons to think that coin will not be so very pernicious to us, we lie under the disadvantage of being censured as obstinate in not complying with a royal patent. Therefore nothing remains, but to make use of that liberty which the King and the laws have left us, by continuing to refuse this coin, and by frequent remembrances to keep up that spirit raised against it, which otherwise may be apt to flag, and perhaps in time to sink altogether. For, any public order against receiving or uttering Mr. Wood's halfpence is not reasonably to be expected in this kingdom, without directions from England, which I think nobody presumes, or is so sanguine to hope."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[647]"
    "line_start": 7301
    "source_sequence": 751
  "translation_ja": "難しさがどこにあるか、閣下に申し上げるまでもありません。確かに、国王と法律は、ウッド氏の貨幣を拒むことを私たちに認めています。しかし同時に、国王と法律が、それを受け取ることも私たちに認めているのは、同じく本当です。そしてイングランドの大臣たちが、あの真鍮を私たちの間に流通させた結果を、私たちの恐れるほど破滅的なものとは考えていないことは、まったく確かです。もしそういうものだと理解していれば、あれほど名誉と正義を重んじる方々が、この上なく忠実な王国を破滅から救うため、陛下への影響力を使わずにいるはずはないからです。しかし、あの偉い方々が、この貨幣は私たちにさほど有害ではないとお考えになるかぎり、私たちは、国王の特許状に従おうとしない頑固者だと非難される、不利な立場にあります。ですから、残る手立てはただ一つ、国王と法律が私たちに残した自由を使い、この貨幣を拒み続け、たびたび注意を呼び起こして、これに反対して生まれた気概を保つことです。そうしなければ、気概は衰え、やがては完全に沈んでしまうかもしれません。イングランドの指示なしに、この王国でウッド氏の半ペニー銅貨の受領や流通を禁ずる公の命令が出ると期待するのは、無理なことです。そしてそんな指示が出るとは、誰も考えていませんし、そこまで楽観的な望みを抱く人もいないでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-045"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But to confess the truth, my lord, I begin to grow weary of my office as a writer, and could heartily wish it were devolved upon my brethren, the makers of songs and ballads, who perhaps are the best qualified at present to gather up the gleanings of this controversy. As to myself, it hath been my misfortune to begin and pursue it upon a wrong foundation. For having detected the frauds and falsehoods of this vile impostor Wood in every part, I foolishly disdained to have recourse to whining, lamenting, and crying for mercy, but rather chose to appeal to law and liberty and the common rights of mankind, without considering the climate I was in."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[648]"
    "line_start": 7321
    "source_sequence": 752
  "translation_ja": "しかし閣下、本当のことを申せば、私は著述家としての務めに飽き始めており、歌や俗謡を作る仲間たちに、これを引き継いでもらえたらと、心から願っています。今この論争の落ち穂を拾うには、おそらく彼らが最もふさわしいでしょう。私自身に関しては、誤った土台に立って始め、そのまま続けたのが不運でした。この卑劣な詐欺師ウッドの詐欺と虚偽を、あらゆる点で暴いたあと、私は愚かにも、泣き言を並べ、嘆き、慈悲を求めて叫ぶことを軽蔑しました。それよりも、法律と自由と、人類共通の権利に訴えるほうを選んだのです。自分がどんな風土の中にいるかも考えずに。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-046"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Since your last residence in Ireland, I frequently have taken my nag to ride about your grounds, where I fancied myself to feel an air of freedom breathing round me, and I am glad the low condition of a tradesman did not qualify me to wait on you at your house, for then I am afraid my writings would not have escaped severer censures. But I have lately sold my nag, and honestly told his greatest fault, which was that of snuffing up the air about Brackdenstown, whereby he became such a lover of liberty, that I could scarce hold him in. I have likewise buried at the bottom of a strong chest your lordship's writings under a heap of others that treat of liberty, and spread over a layer or two of Hobbes, Filmer, Bodin[22] and many more authors of that stamp, to be readiest at hand whenever I shall be disposed to take up a new set of principles in government. In the mean time I design quietly to look to my shop, and keep as far out of your lordship's influence as possible; and if you ever see any more of my writings upon this subject, I promise you shall find them as innocent, as insipid and without a sting as what I have now offered you. But if your lordship will please to give me an easy lease of some part of your estate in Yorkshire,[23] thither will I carry my chest and turning it upside down, resume my political reading where I left it off; feed on plain homely fare, and live and die a free honest English farmer: But not without regret for leaving my countrymen under the dread of the brazen talons of Mr. Wood: My most loyal and innocent countrymen, to whom I owe so much for their good opinion of me, and of my poor endeavours to serve them,"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[649]"
    "line_start": 7332
    "source_sequence": 753
  "translation_ja": "閣下が前回アイルランドにお住まいだったころ以来、私はしばしば小馬に乗り、閣下の領地を回っていました。そこでは周りに自由の風が吹いているように感じたものです。また、商人という低い身分のために、邸宅へ伺う資格がなかったのを、ありがたく思っています。もし伺っていたら、私の著作はもっと厳しい非難を免れなかったでしょうから。しかし近ごろ、その小馬を売りました。そして最大の欠点も、正直に話しました。ブラックデンズタウンの空気を吸い込み、すっかり自由を愛するようになったので、ほとんど抑えが利かなくなったことです。また、閣下の著作は、丈夫な箱の底へ、自由を論じたほかの多くの本の下に埋め、その上にホッブズ、フィルマー、ボダン[22]、その他同類の著者の本を一、二層重ねておきました。統治について新しい一組の原則を採り入れたい気分になれば、いつでも、いちばん手近に取り出せるようにです。それまでは静かに店の面倒を見て、閣下の影響から、できるだけ遠ざかるつもりです。もしまたこの問題についての私の著作をご覧になることがあれば、今お目にかけたものと同じくらい潔白で、味気なく、とげもないものになっていると、お約束します。しかし、もし閣下がヨークシャーの領地[23]の一部を、楽な条件で貸してくださるなら、そこへ箱を運び、ひっくり返して、読みさしにした政治の読書を再開しましょう。そして飾り気のない粗末な食事を取り、自由で正直なイングランドの農民として、生きて死にたいと思います。ただし、ウッド氏の真鍮の爪への恐れの中に、同胞たちを置き去りにすることには、悔いを残すでしょう。この上なく忠実で罪のない同胞たち。私と、彼らに仕えようとする私のささやかな努力に、よい評価を与えてくれたことについて、私はそれほど多くの恩を負っているのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":

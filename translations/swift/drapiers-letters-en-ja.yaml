- "id": "dl-l03-note-017-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Another hint at the Duchess of Kendal and her connection with the patent. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[339]"
    "line_start": 3953
    "source_sequence": 388
  "translation_ja": "ケンダル公爵夫人と、この特許状との関係を再びほのめかしている。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-046"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Upon Wood's complaint that the officers of the King's revenue here had already given orders to all the inferior officers not to receive any of his coin, the Report says, That \"this cannot but be looked upon as a very extraordinary proceeding,\" and being contrary to the powers given in the patent, the Committee say, They \"cannot advise His Majesty to give directions to the officers of the revenue here, not to receive or utter any of the said coin as has been desired in the addresses of both Houses,\" but on the contrary, they \"think it both just and reasonable that the King should immediately give orders to the commissioners of the revenue, &c. to revoke all orders, &c. that may have been given by them to hinder or obstruct the receiving the said coin.\" And accordingly, we are told, such orders are arrived.[18]. Now this was a cast of Wood's politics; for his information was wholly false and groundless, which he knew very well; and that the commissioners of the revenue here were all, except one, sent us from England, and love their employments too well to have taken such a step: But Wood was wise enough to consider, that such orders of revocation would be an open declaration of the crown in his favour, would put the government here under a difficulty, would make a noise, and possibly create some terror in the poor people of Ireland. And one great point he hath gained, that although any orders of revocation will be needless, yet a new order is to be sent, and perhaps already here, to the commissioners of the revenue, and all the King's officers in Ireland, that Wood's \"halfpence be suffered and permitted, without any let, suit, trouble, molestation or denial of any of the King's officers or ministers whatsoever, to pass and be received as current money by such as shall be willing to receive them.\" In this order there is no exception, and therefore, as far as I can judge, it includes all officers both civil and military, from the Lord High Chancellor to a justice of peace, and from the general to an ensign: So that Wood's project is not likely to fail for want of managers enough. For my own part, as things stand, I have but little regret to find myself out of the number, and therefore I shall continue in all humility to exhort and warn my fellow-subjects never to receive or utter this coin, which will reduce the kingdom to beggary by much quicker and larger steps than have hitherto been taken.[19]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[340]"
    "line_start": 3957
    "source_sequence": 389
  "translation_ja": "当地の国王の歳入担当官たちが、すでにすべての下級官吏に、ウッドの貨幣を一切受け取らないよう命じた、というウッドの訴えに対し、「報告」は、「これはきわめて異例の措置と見なさざるを得ない」と述べています。そして、特許状で与えられた権限に反するため、委員会は、「両院の上奏で求められたように、前記貨幣を一切受け取らず、流通させないよう、当地の歳入担当官に指示を与えることを、陛下に進言するわけにはいかない」とし、逆に、「前記貨幣の受取りを妨げ、阻止するために発した命令等をすべて撤回するよう、歳入委員等に陛下が直ちに命じられることが、公正かつ合理的だと考える」と述べています。それに従った命令が届いたと、私たちは聞かされています。[18] さて、これはウッドの政略の一手でした。彼の申し立ては、まったくの虚偽で根拠がなく、本人もよく知っていたからです。それに、当地の歳入委員は、一人を除いてすべてイングランドから送り込まれた人々で、あまりに職を大切にしているので、そのような措置に出るはずがないことも、知っていたのです。しかしウッドは、そのような撤回命令が出れば、王室が自分を支持すると公然と宣言したことになり、当地の政府を難しい立場に置き、騒ぎを起こし、ことによると哀れなアイルランド国民に多少の恐怖を抱かせると考えるだけの知恵がありました。そして彼は、一つ大きな点を勝ち取りました。撤回命令などまったく不要なのに、それでも歳入委員とアイルランドの国王の全官吏に、新しい命令が送られることになり、ことによると、すでに届いているのです。それは、ウッドの「半ペニー銅貨が、それを受け取る意思のある者によって通用貨幣として流通し、受け取られることを、いかなる国王の官吏または大臣も、妨害、訴訟、煩擾、干渉、拒絶を加えることなく、容認し許可する」という命令です。この命令には例外がないので、私に判断できる限りでは、大法官から治安判事まで、将軍から少尉まで、すべての文武の官吏が含まれます。ですから、ウッドの計画は、取り仕切る人手が足りずに失敗することはなさそうです。私自身は、このような事情であれば、自分がその仲間に入っていないと知っても、ほとんど残念には思いません。したがって私は、これまで以上にはるかに速く、大きな歩幅で王国を乞食の境遇に追い込むこの貨幣を、決して受け取らず、流通させないよう、同胞臣民に謹んで勧告し、警告し続けるつもりです。[19]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-018-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Archbishop King's letter, quoted by Monck Mason, explains why it was that the revenue officers refused to receive Wood's coins. It seems the officers had been advised by lawyers that, in the event of their taking the coins, it might be quite likely they would be compelled to make them good, should such a demand be made of them. Precedents could easily be cited by those taking action, since all previous patents issued to private individuals for coining money, required of the patentee to take them back and pay for them with gold or silver. [T. S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[341]"
    "line_start": 3993
    "source_sequence": 390
  "translation_ja": "モンク・メイソンの引用したキング大主教の書簡は、なぜ歳入担当官たちがウッドの貨幣の受取りを拒んだのかを説明している。貨幣を受け取れば、請求された場合に、その額を正貨で支払わなければならなくなる可能性が十分ある、と法律家から助言されていたらしい。以前、貨幣鋳造のために私人に発給された特許状はすべて、特許権者が貨幣を引き取り、その代わりに金貨または銀貨を支払うことを求めていたので、訴えを起こす者にとって、先例を挙げるのは容易だった。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-019-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The suggestion thus made by the Lords of the Committee, although coupled with the reduction in the amount of money Wood was to be permitted to introduce, did not do any good. Archbishop King argued rightly that this was treating the people of Ireland as if they were fools and children. If Wood could coin £40,000, what was to prevent him coining £200,000? The suggestion indeed irritated the people almost as much as did the patent itself. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[342]"
    "line_start": 4003
    "source_sequence": 391
  "translation_ja": "貴族委員たちによるこの提案は、ウッドに持込みを許す貨幣の総額削減と組み合わされていたが、何の役にも立たなかった。キング大主教が、これはアイルランド国民を愚か者か子供のように扱うものだと論じたのは、もっともである。ウッドが四万ポンドを鋳造できるなら、二十万ポンド鋳造するのを何が妨げるのか。この提案は実際、特許状そのものとほとんど同じくらい、人々をいらだたせた。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-047"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But it is needless to argue any longer. The matter is come to an issue. His Majesty pursuant to the law, hath left the field open between Wood and the kingdom of Ireland. Wood hath liberty to offer his coin, and we have law, reason, liberty and necessity to refuse it. A knavish jockey may ride an old foundered jade about the market, but none are obliged to buy it. I hope the words \"voluntary\" and \"willing to receive it\" will be understood, and applied in their true natural meaning, as commonly understood by Protestants. For if a fierce captain comes to my shop to buy six yards of scarlet cloth, followed by a porter laden with a sack of Wood's coin upon his shoulders, if we are agreed about the price, and my scarlet lies ready cut upon the counter, if he then gives me the word of command, to receive my money in Wood's coin, and calls me a \"disaffected Jacobite dog\" for refusing it (although I am as loyal a subject as himself, and without hire) and thereupon seizes my cloth, leaving me the price in his odious copper, and bids me take my remedy: In this case, I shall hardly be brought to think that I am left to my own will. I shall therefore on such occasions, first order the porter aforesaid to go off with his pack, and then see the money in silver and gold in my possession before I cut or measure my cloth. But if a common soldier drinks his pot first, and then offers payment in Wood's halfpence, the landlady may be under some difficulty; For if she complains to his captain or ensign, they are likewise officers, included in this general order for encouraging these halfpence to pass as current money. If she goes to a justice of peace, he is also an officer, to whom this general order is directed. I do therefore advise her to follow my practice, which I have already begun, and be paid for her goods before she parts with them. However I should have been content, for some reasons, that the military gentlemen had been excepted by name, because I have heard it said, that their discipline is best confined within their own district."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[343]"
    "line_start": 4012
    "source_sequence": 392
  "translation_ja": "しかし、これ以上論じる必要はありません。問題は決着すべきところまで来ました。陛下は法に従い、ウッドとアイルランド王国とが自由に向き合う場を残されました。ウッドには自分の貨幣を差し出す自由があり、私たちには、それを拒む法律上の根拠、道理、自由、そして必要があります。いかさま馬売りが、足の悪い老いぼれ馬を市場で乗り回しても、誰も買う義務はありません。「自発的」と「受け取る意思のある」という言葉が、プロテスタントが普通に理解するとおり、本来の自然な意味に解され、適用されることを願います。というのも、荒々しい大尉が、緋色の布を六ヤード買いに私の店に来て、その後ろにはウッドの貨幣の袋を肩に担いだ荷運び人が付き従っているとしましょう。値段の折り合いがつき、私の緋色の布はすでに切られて、売台の上にあります。そこで大尉が、ウッドの貨幣で代金を受け取れと号令をかけ、断る私を「不忠なジャコバイトの犬」と呼びます。私も彼と同じく忠実な臣民であり、しかも給金ももらわずにそうしているというのにです。そして、大尉は私の布を取り上げ、代金としてあの忌まわしい銅貨を置き、文句があるなら訴えてみろと言います。こうなっては、私が自分の自由意思に任されていると、納得させるのは難しいでしょう。ですから、そのような場合、私はまず、その荷運び人に荷を持って立ち去るよう命じ、それから銀貨か金貨の代金が自分の手に入ったことを確かめて、初めて布を切ったり量ったりするつもりです。しかし、一兵卒が先にビールを飲み干し、それからウッドの半ペニー銅貨で払おうとすれば、宿の女将は困るかもしれません。大尉や少尉に苦情を言っても、彼らもまた、この半ペニー銅貨を通用貨幣として流通させるよう奨励する一般命令に含まれる官吏だからです。治安判事に訴えても、その人もまた、この一般命令の宛先となった官吏です。そこで私は、自分がすでに始めているやり方に倣って、品物を渡す前に代金を受け取ることを、女将に勧めます。もっとも、いくつかの理由から、軍人の方々は名指しで除外しておいてほしかったものです。軍の規律は、その受持ち区域の中だけに限るのがよいと、聞いたことがあるからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-048"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "His Majesty in the conclusion of his answer to the address of the House of Lords against Wood's coin, is pleased to say that \"he will do everything in his power for the satisfaction of his people.\" It should seem therefore, that the recalling the patent is not to be understood as a thing in his power. But however since the law does not oblige us to receive this coin, and consequently the patent leaves it to our voluntary choice, there is nothing remaining to preserve us from rain but that the whole kingdom should continue in a firm determinate resolution never to receive or utter this fatal coin:[20]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[344]"
    "line_start": 4043
    "source_sequence": 393
  "translation_ja": "陛下は、ウッドの貨幣に反対する貴族院の上奏への御返答の結びで、「国民を満足させるため、御自身の力の及ぶすべてを行う」と、仰せになっています。すると、特許状の取消しは、その力の及ぶ事柄に含まれないようです。しかし、いずれにせよ、法律は私たちにこの貨幣を受け取る義務を課しておらず、したがって特許状も、自発的な選択に任せています。ですから、破滅を免れるために残された手段は、王国全体が、この致命的な貨幣を決して受け取らず、流通させないという、固く揺るがぬ決意を貫くことだけです。[20]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-020-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "So ready was the response to this suggestion of Swift's, that it was found necessary for tradesmen to take precautions to have it publicly known that they were in no way connected with Wood and his money, The following is a copy of an advertisement which illustrates this:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[345]"
    "line_start": 4054
    "source_sequence": 394
  "translation_ja": "スウィフトのこの提案には、すぐさま大きな反応があり、商人たちは、ウッドやその貨幣とはいっさい関係がないことを公に知らせるため、用心する必要が生じた。次に掲げる広告の写しが、それを例証している。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-020-002"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"Whereas several persons in this kingdom suspect that John Molyneux of Meath Street, ironmonger, and his brother Daniel Molyneux, of Essex Street, ironmonger, are interested in the patent obtained by William Wood for coining of halfpence and farthings for this kingdom."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[346]"
    "line_start": 4060
    "source_sequence": 395
  "translation_ja": "「本王国内の一部の人々が、ミース通りの金物商ジョン・モリニューと、その兄弟であるエセックス通りの金物商ダニエル・モリニューが、ウィリアム・ウッドの取得した、本王国向け半ペニーおよびファージング銅貨鋳造の特許状に利害関係を有しているのではないかと疑っているため、"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-020-003"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"Now we the said John Molyneux and Daniel Molyneux, in order to satisfy the public, do hereby declare, that we are in no way concerned with the said Wood in relation to his said patent; And that we never were possessed of any of the said halfpence or farthings, except one halfpence and one farthing, which I the said John Molyneux received in a post-letter, and which I immediately afterwards delivered to one of the Lords-Justices of Ireland."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[347]"
    "line_start": 4066
    "source_sequence": 396
  "translation_ja": "「ここに前記ジョン・モリニューおよびダニエル・モリニューは、公衆の疑念を晴らすため、前記特許状に関して、前記ウッドといかなる関係もないことを宣言する。また、前記ジョン・モリニューが郵便の書簡に同封されて受け取り、その直後にアイルランドの統治代行官の一人に手渡した半ペニー銅貨一枚とファージング銅貨一枚を除き、前記の半ペニーまたはファージング銅貨を所有したことは一度もない。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-020-004"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"And we do further declare, that we will not directly or indirectly, be anyways concerned with the said Wood's halfpence or farthings; but on the contrary, act to the great advantage and satisfaction of this kingdom, as good, loving and faithful subjects ought to do. And we do further declare, that to the best of our knowledge, the said William Wood is not in this kingdom."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[348]"
    "line_start": 4075
    "source_sequence": 397
  "translation_ja": "「また我々は、直接にも間接にも、前記ウッドの半ペニーまたはファージング銅貨にいかなる形でもかかわらず、反対に、善良で、国を愛する忠実な臣民のなすべきとおり、本王国の大きな利益と満足のために行動することを、さらに宣言する。また、我々の知る限り、前記ウィリアム・ウッドは本王国内にいないことを、さらに宣言する。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":

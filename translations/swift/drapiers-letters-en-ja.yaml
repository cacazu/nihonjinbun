  "source_text": "[Footnote A: Monck Mason, quoting Simon \"On Irish Coins\" (Append., No. LXV), says: \"Sir Thomas [Armstrong] was never admitted to make use of this grant, nor could he obtain allowance of the chief governor of Ireland, to issue them as royal coin among the subjects of that kingdom.\"]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[281]"
    "line_start": 3192
    "source_sequence": 330
  "translation_ja": "［注A：モンク・メイソンは、サイモン『アイルランド貨幣論』（付録第六十五）を引いて、次のように述べている。「トマス［・アームストロング］卿は、この特許を利用することを一度も認められず、その王国の臣民の間に王国貨幣として流通させるというアイルランドの最高統治官の許可も、得られなかった」。］"
  "translation_status": "reviewed"
  "translation_required": true

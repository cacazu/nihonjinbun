- "id": "dl-l04-003"
  "section_id": "letter-04-body"
  "kind": "heading"
  "origin": "source"
  "source_text": "MY DEAR COUNTRYMEN,"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/h3[25]"
    "line_start": 4489
    "source_sequence": 450
  "translation_ja": "親愛なる同国の皆様、"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-004"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Having already written three letters upon so disagreeable a subject as Mr. Wood and his halfpence; I conceived my task was at an end: But I find, that cordials must be frequently applied to weak constitutions, political as well as natural. A people long used to hardships, lose by degrees the very notions of liberty, they look upon themselves as creatures at mercy, and that all impositions laid on them by a stronger hand, are, in the phrase of the Report, legal and obligatory. Hence proceeds that poverty and lowness of spirit, to which a kingdom may be subject as well as a particular person. And when Esau came fainting from the field at the point to die, it is no wonder that he sold his birthright for a mess of pottage."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[388]"
    "line_start": 4492
    "source_sequence": 451
  "translation_ja": "ウッド氏とその半ペニー銅貨という、これほど不愉快な問題について、すでに三通の書簡を書いたので、私の務めも終わったと思っていました。ところが、弱った体質には、自然の身体であれ政治の身体であれ、気付け薬をたびたび施さなければならないようです。長く苦難に慣れた国民は、次第に自由という観念そのものを失い、自分たちを情けにすがるほかない生き物と思い、強い手から押しつけられるものは何でも、「報告」の言葉を借りれば、合法で拘束力があると見なすようになります。そこから、個人にも劣らず一王国も陥り得る、あの心の貧しさと卑屈さが生じるのです。そしてエサウが、疲れ果て、今にも死にそうになって野から帰ってきたとき、一椀の煮物で長子の権利を売ったのも、不思議ではありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-005"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I thought I had sufficiently shewn to all who could want instruction, by what methods they might safely proceed, whenever this coin should be offered to them; and I believe there hath not been for many ages an example of any kingdom so firmly united in a point of great importance, as this of ours is at present, against that detestable fraud. But however, it so happens that some weak people begin to be alarmed anew, by rumours industriously spread. Wood prescribes to the newsmongers in London what they are to write. In one of their papers published here by some obscure printer (and probably with no good design) we are told, that \"the Papists in Ireland have entered into an association against his coin,\" although it be notoriously known, that they never once offered to stir in the matter; so that the two Houses of Parliament, the Privy-council, the great number of corporations, the lord mayor and aldermen of Dublin, the grand juries, and principal gentlemen of several counties are stigmatized in a lump under the name of \"Papists.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[389]"
    "line_start": 4504
    "source_sequence": 452
  "translation_ja": "この貨幣を差し出されたとき、どのような方法で安全に対処できるかは、教えを必要とするすべての人に、十分示したつもりでした。そして、この忌まわしい詐欺に反対する今のわが王国ほど、重大な一点について固く団結した王国の例は、幾世代もなかったと思います。それでも、盛んに流される噂によって、気の弱い人々が再びおびえ始めています。ウッドは、ロンドンの新聞屋たちに、何を書くべきか指図しています。名もない印刷屋が当地で出した新聞の一つに、おそらくろくでもない意図から、「アイルランドの教皇派が、彼の貨幣に反対する同盟を結んだ」とあります。しかし、教皇派がこの問題で一度たりとも動こうとしなかったことは、周知の事実です。こうして、議会両院、枢密院、多数の自治団体、ダブリンの市長と市参事会員たち、各地の大陪審や有力な郷紳たちが、一括して「教皇派」の名で汚名を着せられているのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-006"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This impostor and his crew do likewise give out, that, by refusing to receive his dross for sterling, we \"dispute the King's prerogative, are grown ripe for rebellion, and ready to shake off the dependency of Ireland upon the crown of England.\" To countenance which reports he hath published a paragraph in another newspaper, to let us know that \"the Lord Lieutenant is ordered to come over immediately to settle his halfpence.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[390]"
    "line_start": 4521
    "source_sequence": 453
  "translation_ja": "この詐欺師とその一味はまた、私たちが、彼の金属くずを正貨として受け取るのを拒むことによって、「国王の大権を争い、反乱を起こす機が熟し、アイルランドのイングランド王権への従属を振り払おうとしている」と言いふらしています。この噂にもっともらしさを添えるため、彼は別の新聞に一段の記事を載せ、「総督は、彼の半ペニー銅貨の問題を片づけるため、直ちに渡海するよう命じられた」と、私たちに知らせたのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-007"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I entreat you, my dear countrymen, not to be under the least concern upon these and the like rumours, which are no more than the last howls of a dog dissected alive, as I hope he hath sufficiently been. These calumnies are the only reserve that is left him. For surely our continued and (almost) unexampled loyalty will never be called in question for not suffering ourselves to be robbed of all that we have, by one obscure ironmonger."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[391]"
    "line_start": 4529
    "source_sequence": 454
  "translation_ja": "親愛なる同国の皆様、こうした噂やその類については、ほんの少しも気にかけないでいただきたいのです。それは、生きたまま解剖された犬の、最後の遠吠えにすぎません。彼が十分に解剖されたことを、私は願っています。このような中傷こそ、彼に残された最後の手なのです。一人の無名の金物商に、持っているものを残らず奪わせないからといって、私たちの変わらぬ、ほとんど類例のない忠節が疑われることなど、あるはずがありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-008"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As to disputing the King's prerogative, give me leave to explain to those who are ignorant, what the meaning of that word prerogative is."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[392]"
    "line_start": 4537
    "source_sequence": 455
  "translation_ja": "国王の大権を争うという点については、大権という言葉の意味を、知らない方々のために説明させてください。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-009"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The Kings of these realms enjoy several powers, wherein the laws have not interposed: So they can make war and peace without the consent of Parliament; and this is a very great prerogative. But if the Parliament doth not approve of the war, the King must bear the charge of it out of his own purse, and this is as great a check on the crown. So the King hath a prerogative to coin money without consent of Parliament. But he cannot compel the subject to take that money except it be sterling, gold or silver; because herein he is limited by law. Some princes have indeed extended their prerogative further than the law allowed them; wherein however, the lawyers of succeeding ages, as fond as they are of precedents, have never dared to justify them. But to say the truth, it is only of late times that prerogative hath been fixed and ascertained. For whoever reads the histories of England, will find that some former Kings, and these none of the worst, have upon several occasions ventured to control the laws with very little ceremony or scruple, even later than the days of Queen Elizabeth. In her reign that pernicious counsel of sending base money hither, very narrowly failed of losing the kingdom, being complained of by the lord-deputy, the council, and the whole body of the English here:[5] So that soon after her death it was recalled by her successor, and lawful money paid in exchange."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[393]"
    "line_start": 4541
    "source_sequence": 456
  "translation_ja": "これらの王国の国王には、法律が立ち入っていないいくつかの権限があります。たとえば、議会の同意なしに戦争と講和を行うことができ、これは非常に大きな大権です。しかし、議会が戦争を承認しなければ、国王は自分の財布からその費用を出さなければならず、これも王権に対する同じくらい大きな歯止めです。同様に、国王には議会の同意なしに貨幣を鋳造する大権があります。しかし、それが正規の金貨または銀貨でなければ、臣民に受取りを強制することはできません。この点では法律によって制限されているからです。確かに、法律の許す範囲を超えて大権を広げた君主もいました。しかし、後世の法律家は、いかに先例好きでも、その点をあえて正当化しようとはしませんでした。ですが、本当のところ、大権の範囲が定められ、明確になったのは、ほんの近ごろのことです。イングランドの歴史を読めば、昔の国王の中には、しかも決して最悪ではない国王たちが、さまざまな機会に、ほとんど遠慮もためらいもなく、法律を押さえつけることを敢行したと分かるでしょう。エリザベス女王の時代より後でさえ、そうでした。女王の治世には、粗悪な貨幣を当地へ送るという有害な進言のため、危うく王国を失うところまでいき、総督代理、枢密院、当地のイングランド人全体から苦情が出ました。[5] そのため、女王の死後まもなく、後継者によってその貨幣は回収され、代わりに適法な貨幣が支払われたのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-note-005-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "See Moryson's \"Itinerary\" (Pt. ii., pp. 90, 196 and 262), where an account is given which fully bears out Swift.[T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[394]"
    "line_start": 4563
    "source_sequence": 457
  "translation_ja": "スウィフトの述べることを十分に裏づける記述は、モリスン『旅行記』（第二部、九〇、一九六、二六二頁）を参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-010"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Having thus given you some notion of what is meant by the King's \"prerogative,\" as far as a tradesman can be thought capable of explaining it, I will only add the opinion of the great Lord Bacon: That \"as God governs the world by the settled laws of nature, which he hath made, and never transcends those laws but upon high important occasions; so among earthly princes, those are the wisest and the best, who govern by the known laws of the country, and seldomest make use of their prerogative.\"[6]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[395]"
    "line_start": 4567
    "source_sequence": 458
  "translation_ja": "これで、国王の「大権」というものが何を意味するか、一商人に説明できる範囲ではありますが、多少お分かりいただけたと思います。あとは、偉大なベーコン卿の意見を付け加えるだけにしましょう。「神は、自ら定めた不変の自然法則によって世界を治め、きわめて重大な場合のほかは、その法則を超えることはない。それと同じく、地上の君主の中で最も賢明かつ善良なのは、国の周知の法律によって統治し、大権を用いることが最も少ない君主である」。[6]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-note-006-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The words in inverted commas appear to be a reminiscence rather than a quotation. I have not traced the sentence, as it stands, in Bacon; but the regular government of the world by the laws of nature, as contrasted with the exceptional disturbance of these laws, is enunciated in Bacon's \"Confession of Faith,\" while the dangers of a strained prerogative are urged in the \"Essay on Empire.\" Bacon certainly gives no support to Swift's limits of the prerogative as regards coinage. [CRAIK.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[396]"
    "line_start": 4577
    "source_sequence": 459
  "translation_ja": "引用符の中の言葉は、正確な引用というより、記憶によるものと思われる。この文のままでは、ベーコンの著作中に見いだせなかった。しかし、世界が自然法則に従って規則的に統治されることと、その法則が例外的に破られることとの対比は、ベーコンの『信仰告白』に述べられており、大権を無理に拡張する危険は、「帝国について」の随筆で説かれている。貨幣鋳造についてスウィフトが大権に設ける制限を、ベーコンが支持していないことは確かである。［クレイク］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: CRAIK."
- "id": "dl-l04-011"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now, here you may see that the vile accusation of Wood and his accomplices, charging us with \"disputing the King's prerogative\" by refusing his brass, can have no place, because compelling the subject to take any coin which is not sterling is no part of the King's prerogative, and I am very confident if it were so, we should be the last of his people to dispute it, as well from that inviolable loyalty we have always paid to His Majesty, as from the treatment we might in such a case justly expect from some who seem to think, we have neither common sense nor common senses. But God be thanked, the best of them are only our fellow-subjects, and not our masters. One great merit I am sure we have, which those of English birth can have no pretence to, that our ancestors reduced this kingdom to the obedience of England, for which we have been rewarded with a worse climate, the privilege of being governed by laws to which we do not consent, a ruined trade, a House of Peers without jurisdiction, almost an incapacity for all employments; and the dread of Wood's halfpence."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[397]"
    "line_start": 4586
    "source_sequence": 460
  "translation_ja": "さて、これでお分かりのとおり、自分の真鍮を拒む私たちを「国王の大権を争う」と責める、ウッドとその仲間たちの卑劣な告発には、何の根拠もありません。正貨でない貨幣を臣民に無理に受け取らせることは、国王の大権に含まれないからです。そして、もし含まれるのであれば、私たちは陛下の国民の中で、最後までそれを争おうとはしない者となると、私は固く信じています。それは、これまで陛下に尽くしてきた揺るがぬ忠節のためでもあり、また、私たちには常識も五感もないと考えているらしい人々から、その場合に当然予想される扱いのためでもあります。しかし、ありがたいことに、彼らはその最上の者でさえ、私たちと同じ臣民にすぎず、私たちの主人ではありません。私たちには、イングランド生まれの者には決して主張できない、一つの大きな功績があることは確かです。それは、私たちの祖先がこの王国をイングランドに服従させたことです。その報いとして私たちに与えられたのは、より悪い気候、自分たちが同意しない法律で統治される特権、荒廃した貿易、裁判権のない貴族院、ほとんどあらゆる官職に就くことができない立場、そしてウッドの半ペニー銅貨への恐れなのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-012"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But we are so far from disputing the King's prerogative in coining, that we own he has power to give a patent to any man for setting his royal image and superscription upon whatever materials he pleases, and liberty to the patentee to offer them in any country from England to Japan, only attended with one small limitation, That nobody alive is obliged to take them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[398]"
    "line_start": 4603
    "source_sequence": 461
  "translation_ja": "しかし、私たちは鋳造についての国王の大権を争うどころか、国王には、どんな材料にでもお望みのままにその肖像と銘を付ける特許状を誰にでも与え、特許権者にはそれをイングランドから日本まで、どの国ででも差し出す自由を認める権限があると、承認しています。ただ一つ、小さな制限が付くのです。生きている者は誰一人、それを受け取る義務はない、ということです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-013"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Upon these considerations I was ever against all recourse to England for a remedy against the present impending evil, especially when I observed that the addresses of both Houses, after long expectance, produced nothing but a REPORT altogether in favour of Wood, upon which I made some observations in a former letter, and might at least have made as many more. For it is a paper of as singular a nature as I ever beheld."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[399]"
    "line_start": 4611
    "source_sequence": 462
  "translation_ja": "このように考えて、私は、今まさに降りかかろうとしている害悪から救われるためにイングランドへ頼ることには、常に反対してきました。とりわけ、両院の上奏が、長く待たされたすえ、ウッドを全面的に支持する「報告」しか生まなかったのを見てからは、そうです。私は前の書簡でその「報告」について若干の考察を述べましたが、少なくとも同じくらい多くを、さらに述べることもできました。私が見たことのある中でも、これほど風変わりな性質の文書はないからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-014"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But I mistake; for before this Report was made, His Majesty's most gracious answer to the House of Lords was sent over and printed, wherein there are these words, \"granting the patent for coining halfpence and farthings AGREEABLE TO THE PRACTICE OF HIS ROYAL PREDECESSORS, &c.\" That King Charles 2d. and King James 2d. (AND THEY ONLY) did grant patents for this purpose is indisputable, and I have shewn it at large. Their patents were passed under the great seal of Ireland by references to Ireland, the copper to be coined in Ireland, the patentee was bound on demand to receive his coin back in Ireland, and pay silver and gold in return. Wood's patent was made under the great seal of England, the brass coined in England, not the least reference made to Ireland, the sum immense, and the patentee under no obligation to receive it again and give good money for it: This I only mention, because in my private thoughts I have sometimes made a query, whether the penner of those words in His Majesty's most gracious answer, \"agreeable to the practice of his royal predecessors,\" had maturely considered the several circumstances, which, in my poor opinion seem to make a difference."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[400]"
    "line_start": 4619
    "source_sequence": 463
  "translation_ja": "しかし、私は間違えました。この「報告」が作られる前に、貴族院に対する陛下のこの上なく恵み深い御返答が送られ、印刷されていたのです。そこには、「歴代の先王の慣行に従い、半ペニーおよびファージング銅貨鋳造の特許状を与える、云々」という言葉があります。チャールズ二世とジェームズ二世が、しかもこの二人だけが、この目的の特許状を与えたことは争えず、私は詳しく示しました。その特許状は、アイルランドへの照会を経て、アイルランドの国璽のもとに発給され、銅貨はアイルランドで鋳造することとされ、特許権者は、請求があればアイルランドで自分の貨幣を引き取り、その代わりに金銀を支払う義務を負っていました。ウッドの特許状は、イングランドの国璽のもとに作られ、真鍮貨はイングランドで鋳造され、アイルランドにはまったく照会されず、額は莫大で、特許権者には、それを引き取って良貨を渡す義務はありません。このことを申し上げるのは、陛下のこの上なく恵み深い御返答に、「歴代の先王の慣行に従い」という言葉を記した人が、私の浅い考えでは相違を生むように見えるこうした事情を、一つ一つ十分検討したのだろうかと、ひそかに疑問を抱くことがあるからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-015"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let me now say something concerning the other great cause of some people's fear, as Wood has taught the London newswriter to express it. That \"his Excellency the Lord Lieutenant is coming over to settle Wood's halfpence.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[401]"
    "line_start": 4638
    "source_sequence": 464
  "translation_ja": "さて、一部の人々の不安を引き起こしているもう一つの大きな原因について、少し述べさせてください。ウッドがロンドンの新聞記者に書かせた表現によれば、「総督閣下は、ウッドの半ペニー銅貨の問題を片づけるために渡ってこられる」ということです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-016"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "We know very well that the Lords Lieutenants for several years past have not thought this kingdom worthy the honour of their residence, longer than was absolutely necessary for the King's business, which consequently wanted no speed in the dispatch; and therefore it naturally fell into most men's thoughts, that a new governor coming at an unusual time must portend some unusual business to be done, especially if the common report be true, that the Parliament prorogued to I know not when, is by a new summons (revoking that prorogation) to assemble soon after his arrival: For which extraordinary proceeding the lawyers on t'other side the water have by great good fortune found two precedents."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[402]"
    "line_start": 4643
    "source_sequence": 465
  "translation_ja": "ここ数年の総督たちは、国王の御用に絶対必要な期間を超えて、この王国に住まう栄誉を与えようとはなさらず、したがって御用の処理にも速度が欠けなかったことを、私たちはよく知っています。そのため、新任の統治者が普通でない時期に来るからには、何か普通でない仕事をする前触れに違いないという考えが、自然と多くの人の頭に浮かびました。とりわけ、いつまでか私の知らない日まで停会となっている議会が、その停会を取り消す新たな召集令によって、総督の到着後まもなく集まるという、世間の噂が本当なら、なおさらです。この異例の手続については、海の向こうの法律家たちが、まことに幸運にも、二つの先例を見つけたそうです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-017"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "All this being granted, it can never enter into my head that so little a creature as Wood could find credit enough with the King and his ministers to have the Lord Lieutenant of Ireland sent hither in a hurry upon his errand."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[403]"
    "line_start": 4655
    "source_sequence": 466
  "translation_ja": "これらをすべて認めてもなお、ウッドのようなつまらぬ者が、国王と大臣たちにそれほど信用され、自分の使いとしてアイルランド総督を大急ぎで当地へ送り込ませることができるとは、私にはどうしても考えられません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-018"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For let us take the whole matter nakedly as it lies before us, without the refinements of some people, with which we have nothing to do. Here is a patent granted under the great seal of England, upon false suggestions, to one William Wood for coining copper halfpence for Ireland: The Parliament here, upon apprehensions of the worst consequences from the said patent, address the King to have it recalled; this is refused, and a committee of the Privy-council report to His Majesty, that Wood has performed the conditions of his patent. He then is left to do the best he can with his halfpence; no man being obliged to receive them; the people here, being likewise left to themselves, unite as one man, resolving they will have nothing to do with his ware. By this plain account of the fact it is manifest, that the King and his ministry are wholly out of the case, and the matter is left to be disputed between him and us. Will any man therefore attempt to persuade me, that a Lord Lieutenant is to be dispatched over in great haste before the ordinary time, and a Parliament summoned by anticipating a prorogation, merely to put an hundred thousand pounds into the pocket of a sharper, by the ruin of a most loyal kingdom."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[404]"
    "line_start": 4661
    "source_sequence": 467
  "translation_ja": "というのも、一部の人々が加える、私たちには関係のない微妙な理屈を取り除き、目の前にある問題全体を、ありのままに見てみましょう。虚偽の申し立てに基づき、イングランドの国璽のもとで、ウィリアム・ウッドという者に、アイルランド向け半ペニー銅貨の鋳造特許状が与えられます。当地の議会は、その特許状から最悪の結果が生じると危惧し、取り消してほしいと国王に上奏します。これは拒否され、枢密院の一委員会が陛下に、ウッドは特許状の条件を履行したと報告します。そこで彼は、半ペニー銅貨をできるだけうまく処分するよう、自分に任されます。誰にもそれを受け取る義務はありません。当地の国民も同じく自分たちに任され、一人の人のように団結して、彼の商品とはいっさいかかわらないと決意します。この簡明な事実の説明から明らかなのは、国王と政府は、この件から完全に離れ、問題は彼と私たちとの間で争われるよう残されている、ということです。それなのに、最も忠実な王国を破滅させ、一人のいかさま師の懐に十万ポンドを入れるためだけに、総督が通常の時期より早く、大急ぎで派遣され、停会期限を繰り上げて議会が召集されるのだと、私を説得しようとする人がいるのでしょうか。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-019"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But supposing all this to be true. By what arguments could a Lord Lieutenant prevail on the same Parliament which addressed with so much zeal and earnestness against this evil, to pass it into a law? I am sure their opinion of Wood and his project is not mended since the last prorogation; and supposing those methods should be used which detractors tell us have been sometimes put in practice for gaining votes. It is well known that in this kingdom there are few employments to be given, and if there were more, it is as well known to whose share they must fall."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[405]"
    "line_start": 4680
    "source_sequence": 468
  "translation_ja": "しかし、それがすべて本当だとしましょう。総督は、どのような議論によって、この害悪にあれほど熱心かつ真剣に反対の上奏をした同じ議会を説得し、それを法律として成立させられるのでしょうか。前回の停会以来、ウッドとその計画に対する議会の評価がよくなっていないことは、確かです。そして、悪口を言う人たちが、ときには票を得るために用いられてきたと語る手段が使われるとしても、この王国には与えるべき官職が少なく、仮にもっとあったとしても、それが誰の取り分になるかは、同じくよく知られています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-020"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But because great numbers of you are altogether ignorant in the affairs of your country, I will tell you some reasons why there are so few employments to be disposed of in this kingdom. All considerable offices for life here are possessed by those to whom the reversions were granted, and these have been generally followers of the chief governors, or persons who had interest in the Court of England. So the Lord Berkeley of Stratton[7] holds that great office of master of the rolls, the Lord Palmerstown[8] is first remembrancer worth near 2000l. per ann. One Dodington[9] secretary to the Earl of Pembroke,[10] begged the reversion of clerk of the pells worth 2500l. a year, which he now enjoys by the death of the Lord Newtown. Mr. Southwell is secretary of state,[11] and the Earl of Burlington[12] lord high treasurer of Ireland by inheritance. These are only a few among many others which I have been told of, but cannot remember. Nay the reversion of several employments during pleasure are granted the same way. This among many others is a circumstance whereby the kingdom of Ireland is distinguished from all other nations upon earth, and makes it so difficult an affair to get into a civil employ, that Mr. Addison was forced to purchase an old obscure place, called keeper of the records of Bermingham's Tower of ten pounds a year, and to get a salary of 400l. annexed to it,[13] though all the records there are not worth half-a-crown, either for curiosity or use. And we lately saw a favourite secretary descend to be master of the revels, which by his credit and extortion he hath made pretty considerable.[14] I say nothing of the under-treasurership worth about 8000l. a year, nor the commissioners of the revenue, four of whom generally live in England; For I think none of these are granted in reversion. But the test is, that I have known upon occasion some of these absent officers as keen against the interest of Ireland as if they had never been indebted to her for a single groat."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[406]"
    "line_start": 4690
    "source_sequence": 469
  "translation_ja": "しかし皆様の多くは、祖国の事情をまるでご存じないので、この王国で振り分けられる官職がなぜこれほど少ないのか、その理由をいくつかお話ししましょう。当地の重要な終身官職はすべて、後継権を与えられた人々が握っています。そしてそれは、たいてい最高統治官の取り巻きか、イングランドの宮廷に引きのある人々でした。たとえば、ストラットンのバークリー卿は、[7] 記録長官という大きな官職を持ち、パーマーズタウン卿は、[8] 年ほぼ二千ポンドになる首席記録官です。ドディントンなる者は、[9] ペンブルック伯爵の[10] 秘書であり、 年二千五百ポンドになる財務府出納簿書記の後継権をねだって得て、今ではニュートン卿の死により、その職を享受しています。サウスウェル氏は国務長官であり、[11] バーリントン伯爵は、[12] 世襲によりアイルランドの大蔵卿です。これは、私が聞いたものの覚えていられない多数の例の中の、ほんの一部にすぎません。それどころか、君主の意向次第で在職するいくつかの官職まで、同じ方法で後継権が与えられています。これもまた、アイルランド王国を地上のほかのあらゆる国々から区別する、多くの事情の一つであって、文官の職に就くことを非常に困難にしています。そのため、アディソン氏は、バーミンガム塔記録管理官という年十ポンドの古びた無名の官職を買い取り、それに四百ポンドの俸給を付けてもらわなければなりませんでした。[13] そこにある記録を全部合わせても、珍しさからいっても、実用からいっても、半クラウンの価値さえないというのにです。また近ごろ、寵愛されたある秘書が、祝典監督官に身を落とすのを、私たちは見ました。彼は引きと強要によって、その職をかなりの実入りのあるものにしました。[14] 年およそ八千ポンドになる財務次官の職や、通常は四人がイングランドに住んでいる歳入委員については、何も言いません。これらには後継権が与えられていないと思うからです。しかし、その本性を試すものとして、こうした不在官吏の中には、アイルランドから一グロートの恩恵も受けたことがないかのように、機会があれば激しくその利益に反対する者がいることを、私は知っています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-note-007-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Berkeley was one of the Junta in Harley's administration of 1710-1714. He had married Sir John Temple's daughter. His connection with a person so disliked by Swift may account for his inclusion here. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[407]"
    "line_start": 4721
    "source_sequence": 470
  "translation_ja": "バークリーは、一七一〇―一七一四年のハーリー政権の少数中枢の一人であった。ジョン・テンプル卿の娘を妻としていた。スウィフトにこれほど嫌われた人物とのつながりが、ここに彼の名が挙げられた理由かもしれない。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"

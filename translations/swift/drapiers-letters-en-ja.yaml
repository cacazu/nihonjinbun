- "id": "dl-l07-002"
  "section_id": "letter-07-body"
  "kind": "heading"
  "origin": "source"
  "source_text": "LETTER VII. AN HUMBLE ADDRESS TO BOTH HOUSES OF PARLIAMENT."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/h2[18]"
    "line_start": 7442
    "source_sequence": 773
  "translation_ja": "第VII書簡　議会両院への謹んでの上申。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-003"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have been told, that petitions and addresses, either to King or Parliament, are the right of every subject; providing they consist with that respect, which is due to princes and great assemblies. Neither do I remember, that the modest proposals, or opinions of private men, have been ill-received, when they have not been delivered in the style of advice; which is a presumption far from my thoughts. However, if proposals should be looked upon as too assuming; yet I hope, every man may be suffered to declare his own and the nation's wishes. For instance; I may be allowed to wish, that some further laws were enacted for the advancement of trade, for the improvement of agriculture, now strangely neglected, against the maxim of all wise nations: For supplying the manifest defects in the acts concerning plantation of trees: For setting the poor to work, and many others."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[659]"
    "line_start": 7445
    "source_sequence": 774
  "translation_ja": "国王や議会に請願や上申を行うことは、君主やこのような大いなる会議に対する当然の敬意を損なわないかぎり、すべての臣民の権利だと聞いております。また、一私人の控えめな提案や意見が、助言めいた口調で述べられたのでなければ、不興を買ったという話も覚えがありません。そのような思い上がりは、私の考えからはまったく縁遠いものです。しかし、提案さえも出過ぎたことと見なされるのでしたら、せめて自分自身やこの国の願いを述べることくらいは、誰にでも許されるものと存じます。たとえば、商業の振興のため、また、賢明な国々すべての方針に反して、今や異様なまでに放置されている農業の改良のため、植樹に関する法律の明白な不備を補うため、貧しい人々に仕事を与えるため、その他さまざまな目的のために、さらに法律を定めていただきたいと願うことは、私にも許されましょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-004"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Upon this principle, I may venture to affirm; it is the hearty wish of the whole nation, very few excepted; that the Parliament in this session would begin by strictly examining into the detestable fraud of one William Wood, now or late of London, hardwareman; who illegally and clandestinely, as appears by your own votes and addresses, procured a patent in England, for coining halfpence in that kingdom, to be current here. This, I say, is the wish of the whole nation, very few excepted; and upon account of those few, is more strongly and justly the wish of the rest: Those few consisting either of Wood's confederates, some obscure tradesmen, or certain bold UNDERTAKERS[1] of weak judgment, and strong ambition; who think to find their accounts in the ruin of the nation, by securing or advancing themselves. And, because such men proceed upon a system of politics, to which I would fain hope you will be always utter strangers, I shall humbly lay it before you."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[660]"
    "line_start": 7460
    "source_sequence": 775
  "translation_ja": "この原則に立って、私はあえて断言いたします。ごく少数の例外を除き、国民全体の心からの願いは、議会が今会期の最初の仕事として、ウィリアム・ウッドなる、現在あるいは先ごろまでロンドンにいた金物商の、忌まわしい詐欺を厳しく調査してくださることです。この男は、両院の決議と上申にも示されているとおり、不法かつ秘密裏にイングランドで特許状を手に入れ、かの王国で半ペニー銅貨を鋳造して、この国で通用させようとしたのです。申しましたとおり、ごく少数の例外を除いて、これが国民全体の願いです。そして、その少数の者がいるために、ほかの国民の願いはいっそう強く、また正当なものとなっております。その少数とは、ウッドの共犯者たちか、何者とも知れぬ商人たち、あるいは判断力は乏しく野心ばかりは強い、向こう見ずな「請負人」たち[1]で、自分の地位を固め、あるいは高めることで、国家の破滅から利益を引き出そうと考えているのです。このような者たちは、ある種の政治の仕組みに従って行動しています。皆様にはいつまでもまったく無縁であっていただきたいと心から願う仕組みですので、ここに謹んでご説明いたします。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-note-001-001"
  "section_id": "letter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This was a phrase used in the time of Charles II. to express those dashing ministers who obtained power by undertaking to carry through particular favourite measures of the crown. But the Dean applies it with his usual studied ambiguity, so that it may be explained as meaning schemers or projectors in general. [S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[661]"
    "line_start": 7476
    "source_sequence": 776
  "translation_ja": "これはチャールズ二世の時代の言い方で、国王がとりわけ望む施策の実行を請け負うことで権力を得た、押しの強い大臣たちを指した。ただし首席司祭は、いつものように周到な曖昧さを持たせてこの語を用い、一般的な意味での策謀家や計画屋とも解せるようにしている。［S.］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: S."
- "id": "dl-l07-005"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Be pleased to suppose me in a station of fifteen hundred pounds a year, salary and perquisites; and likewise possessed of 800l. a year, real estate. Then, suppose a destructive project to be set on foot; such, for instance, as this of Wood; which if it succeed, in all the consequences naturally to be expected from it, must sink the rents and wealth of the kingdom one half, (although I am confident, it would have done so five-sixths.) Suppose, I conceive that the countenancing, or privately supporting this project, will please those by whom I expect to be preserved, or higher exalted. Nothing then remains, but to compute and balance my gain and my loss, and sum up the whole. I suppose that I shall keep my employment ten years, (not to mention the fair chance of a better.) This at 1500l. a year, amounts, in ten years, to 15,000l. My estate, by the success of the said project, sinks 400l. a year; which at twenty years' purchase, is but 8000l. so that I am a clean gainer of 7000l. upon the balance. And during all that period, I am possessed of power and credit, can gratify my favourites, and take vengeance of mine enemies. And if the project miscarry, my private merit is still entire. This arithmetic, as horrible as it appears, I knowingly affirm to have been practised, and applied in conjunctures, whereon depended the ruin or safety of a nation: Although, probably the charity and virtue of a senate, will hardly be induced to believe, that there can be such monsters among mankind. And yet, the wise Lord Bacon mentions a sort of people, (I doubt the race is not yet extinct) who would \"set a house on fire, for the convenience of roasting their own eggs at the flame.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[662]"
    "line_start": 7483
    "source_sequence": 777
  "translation_ja": "どうか、私が俸給と役得を合わせて年に千五百ポンドの役職にあり、そのうえ年収八百ポンドの不動産を所有していると仮定してください。次に、たとえばウッドの計画のような破壊的な事業が始められ、それが成功したあかつきには、そこから当然予想される結果によって、この王国の地代と富が半減するとします。もっとも私は、実際には六分の五が失われただろうと確信しております。そして、この計画に賛意を示すか、内々に後押しすれば、私の地位を守り、あるいはさらに引き立ててくれると期待する人々の意にかなう、と私が考えたとします。そうなれば、あとは得失を計算して差し引きし、総額を出すだけです。私は十年間その役職にとどまるものとします。さらによい役職に就く見込みも十分あるのですが、それは勘定に入れません。年千五百ポンドですから、十年では一万五千ポンドになります。先の計画が成功すると、私の土地からの収入は年四百ポンド減りますが、土地の価格を年収の二十年分と見積もっても、わずか八千ポンドです。ですから差し引き七千ポンドの純益になります。しかもその間ずっと、私は権力と信用を手にし、お気に入りの者に恩恵を与え、敵に復讐できます。計画が失敗しても、私個人の功績はそっくり残ります。恐るべき勘定に見えますが、国家の破滅か存続かが懸かった局面で、実際にこの勘定が用いられ、実行に移されたことを、私は確かな事実として断言いたします。もっとも、おそらく議会の寛仁さと徳をもってしては、人間のうちにかかる怪物がいるとは、にわかにお信じになれないでしょう。それでも、賢人ベーコン卿は、「自分の卵をその火で焼く都合のために、一軒の家に火を放つ」ような連中について述べています。この種族がまだ絶えていないのではないかと、私は恐れております。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-006"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But whoever is old enough to remember, and hath turned his thoughts to observe the course of public affairs in this kingdom, from the time of the Revolution; must acknowledge, that the highest points of interest and liberty, have been often sacrificed to the avarice and ambition of particular persons, upon the very principles and arithmetic that I have supposed: The only wonder is, how these artists were able to prevail upon numbers; and influence even public assemblies to become instruments for effecting their execrable designs."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[663]"
    "line_start": 7510
    "source_sequence": 778
  "translation_ja": "しかし、名誉革命以来のこの王国の公の事柄を記憶できるだけの年齢に達し、その成り行きを注意して見てきた人なら、公益と自由にかかわる最重要の事柄が、まさしく今私の仮定した原理と計算によって、しばしば個人の強欲と野心の犠牲にされてきたことを認めざるをえません。ただ不思議なのは、この手練れたちが、どうやって大勢を従わせ、さらには公の会議にまで働きかけて、その忌まわしい企てを成し遂げる道具にできたのか、ということだけです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-007"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is, I think, in all conscience, latitude enough for vice, if a man in station be allowed to act injustice, upon the usual principles of getting a bribe, wreaking his malice, serving his party, or consulting his preferment; while his wickedness terminates in the ruin only of particular persons: But, to deliver up our whole country, and every living soul who inhabits it, to certain destruction; hath not, as I remember, been permitted by the most favourable casuists on the side of corruption. It were far better, that all who have had the misfortune to be born in this kingdom, should be rendered incapable of holding any employment whatsoever, above the degree of a constable, (according to the scheme and intention of a great minister[2] gone to his own place)than to live under the daily apprehension of a few false brethren among ourselves. Because, in the former case we should be wholly free from the danger of being betrayed; since none could then have impudence enough to pretend any public good."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[664]"
    "line_start": 7520
    "source_sequence": 779
  "translation_ja": "地位にある者が、賄賂を得る、恨みを晴らす、自分の党派に尽くす、昇進を図るといったいつもの動機で不正を働くにしても、その悪行が個々人を破滅させるだけにとどまるなら、それだけで悪徳には良心に照らして十分すぎる自由が認められていると私は思います。しかし、自分の国全体と、そこに暮らすすべての生きた人間を、確実な破滅へ引き渡すことまで許した者は、腐敗にもっとも寛容な詭弁家にも、私の記憶にはありません。すでにしかるべき所へ去ったある大臣[2]の構想と意図どおり、この王国に生まれたという不運を持つ者が、誰一人として治安吏以上のいかなる官職にも就けなくされたほうが、私たち自身のうちにいる少数の偽りの同胞を、日々恐れて暮らすより、はるかによいでしょう。前の場合には、裏切られる危険だけはすっかりなくなるからです。そうなれば、公のためだなどと装えるほど厚顔な者は、一人もいなくなるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

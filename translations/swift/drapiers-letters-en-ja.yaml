- "id": "dl-l04-note-020-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Great offence was taken at this paragraph. Swift refers to it again in his sixth letter. Sir Henry Craik, in his \"Life of Jonathan Swift\" (vol. ii., p. 74), has an acute note on this paragraph, and the one already alluded to in the sixth letter. I take the liberty of transcribing it: \"The manoeuvre by which Swift managed to associate a suspicion of Jacobitism with his opponents, is one peculiarly characteristic; and so is the skill with which, in the next letter, he meets the objections to this paragraph, by half offering an extent of submission that might equally be embarrassing—a submission even to Jacobitism, if Jacobitism were to become strong enough. He does not commit himself, however: he fears a 'spiteful interpretation.' In short, he places the English Cabinet on the horns of a dilemma. 'Am I to resist Jacobitism? Then what becomes of your doctrine of Ireland's dependency?' or, 'Am I to become a Jacobite, if England bids me? Then what becomes of your Protestant succession? Must even that give way to your desire to tyrannize?'\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"

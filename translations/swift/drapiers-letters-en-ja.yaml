- "id": "dl-l06-039"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As to the other paper I must confess it is a sharp censure of an English House of Commons against dissolving grand juries by any judge before the end of the term, assizes, or sessions, while matters are under their consideration, and not presented; is arbitrary, illegal, destructive to public justice, a manifest violation of his oath, and is a means to subvert the fundamental laws of the kingdom."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[640]"
    "line_start": 7216
    "source_sequence": 744
  "translation_ja": "もう一つの文書については、それがイングランド庶民院による厳しい非難であることを認めなければなりません。判事が、大陪審でまだ事案を検討中で、告発が済んでいない間に、開廷期、巡回裁判、あるいは裁判会期の終了を待たず解散させることは、恣意的かつ違法であり、公正な司法を破壊し、宣誓の明白な違反であり、王国の根本法を転覆させる手段となる、というものです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-040"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "However, the publisher seems to have been mistaken in what he aimed at. For, whatever dependence there may be of Ireland upon England, I hope he would not insinuate, that the proceedings of a lord chief justice in Ireland must depend upon a resolution of an English House of Commons. Besides, that resolution although it were levelled against a particular lord chief justice, Sir William Scroggs,[20] yet the occasion was directly contrary: For Scroggs dissolved the grand jury of London for fear they should present, but ours in Dublin was dissolved because they would not present, which wonderfully alters the case. And therefore a second grand jury supplied that defect by making a presentment[21] that hath pleased the whole kingdom. However I think it is agreed by all parties, that both the one and the other jury behaved themselves in such a manner, as ought to be remembered to their honour, while there shall be any regard left among us for virtue or public spirit."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[641]"
    "line_start": 7224
    "source_sequence": 745
  "translation_ja": "しかし、この文書を公にした者は、ねらいを間違えたようです。アイルランドがどれほどイングランドに従属していようと、アイルランドの首席裁判官卿の行動まで、イングランド庶民院の決議に従わなければならない、とほのめかそうとしたのでないことを願います。それに、その決議は特定の首席裁判官卿、サー・ウィリアム・スクロッグズ[20]に向けられたものでしたが、事情はまるで反対でした。スクロッグズは、ロンドンの大陪審が告発を行うのを恐れて解散させましたが、ダブリンの大陪審は、告発を行おうとしなかったため解散させられたのです。これでは、事情が驚くほど違ってきます。そこで第二の大陪審が、この欠けたところを埋め、王国全体を喜ばせる告発を行いました。[21]しかし、どちらの陪審も、この国に徳や公共心への敬意が少しでも残るかぎり、その名誉として記憶されるべき振る舞いをした、ということは、すべての側が認めていると思います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-note-020-001"
  "section_id": "letter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Sir William Scroggs (1623?-1683) was appointed Lord Chief Justice of England on the removal of Sir Thomas Ramsford in 1678. One of the eight articles of impeachment against Scroggs, in 1680, was for illegally discharging the grand jury of Middlesex before the end of the term. Although the articles of impeachment were carried to the House of Lords in 1681, the proceedings went no farther than ordering him to find bail and file his answer by a certain time. Scroggs was removed, on account of his unpopularity, on April 11th, 1681. As a lawyer, Scroggs has no great reputation; as a judge he must be classed with the notorious Jeffreys. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[642]"
    "line_start": 7240
    "source_sequence": 746
  "translation_ja": "サー・ウィリアム・スクロッグズ（一六二三？―一六八三）は、一六七八年、サー・トマス・ラムズフォードの解任に伴い、イングランドの首席裁判官に任命された。一六八〇年の彼に対する八つの弾劾条項の一つは、開廷期が終わる前に、違法にミドルセックスの大陪審を解散させたことだった。一六八一年に弾劾条項は貴族院へ送られたが、手続きは、保釈保証を立て、一定の期日までに答弁書を提出するよう命ずる以上には進まなかった。スクロッグズは不評のため、一六八一年四月十一日に解任された。法律家としての評判は高くなく、判事としては、悪名高いジェフリーズと同類に数えねばならない。[T.S.]"

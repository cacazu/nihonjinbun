- "id": "dl-l06-037"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I allow this gentleman's advice to have been good, and his observations just, and in one respect my condition is worse than that of the Jew, for no recantation will save me. However it should seem by some late proceedings, that my state is not altogether deplorable. This I can impute to nothing but the steadiness of two impartial grand juries, which hath confirmed in me an opinion I have long entertained, that, as philosophers say, \"virtue is seated in the middle,\" so in another sense, the little virtue left in the world is chiefly to be found among the middle rank of mankind, who are neither allured out of her paths by ambition, nor driven by poverty."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[636]"
    "line_start": 7174
    "source_sequence": 740
  "translation_ja": "この紳士の忠告は適切であり、その見方も正しかったと認めます。それに一つの点では、私の境遇はあのユダヤ人より悪いのです。何を撤回しても、私は救われませんから。それでも最近の成り行きを見ると、私の立場は、まるで望みがないわけでもなさそうです。これはただ、二つの公平な大陪審が動じなかったおかげだと思います。そのため、私は長く抱いてきた意見を、ますます確かにしました。哲学者の言う「徳は中庸にある」という言葉は、別の意味でも成り立ち、この世に残るわずかな徳は、主として人々の中間の階層に見つかるのです。野心に誘われて徳の道を外れることも、貧しさに追い出されることもない人々の間に。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-038"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Since the proclamation occasioned by my last letter, and a due preparation for proceeding against me in a court of justice, there have been two printed papers clandestinely spread about, whereof no man is able to trace the original further than by conjecture, which with its usual charity lays them to my account. The former is entitled, \"Seasonable Advice,\"[18] and appears to have been intended for information of the grand jury, upon the supposition of a bill to be prepared against that letter. The other[19] is an extract from a printed book of Parliamentary Proceedings in the year 1680 containing an angry resolution of the House of Commons in England against dissolving grand juries. As to the former, your lordship will find it to be the work of a more artful hand than that of a common Drapier. It hath been censured for endeavouring to influence the minds of a jury, which ought to be wholly free and unbiassed, and for that reason it is manifest that no judge was ever known either upon or off the bench, either by himself or his dependents, to use the least insinuation that might possibly affect the passions or interests of any one single juryman, much less of a whole jury; whereof every man must be convinced who will just give himself the trouble to dip into the common printed trials; so as, it is amazing to think, what a number of upright judges there have been in both kingdoms for above sixty years past, which, considering how long they held their offices during pleasure, as they still do among us, I account next to a miracle."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[637]"
    "line_start": 7186
    "source_sequence": 741
  "translation_ja": "最後の書簡によって布告が出され、法廷で私を訴追する準備が十分に整えられてから、二つの印刷物が密かに出回りました。誰もその出所を突き止められず、推測するしかありませんが、推測というものはいつもの慈悲深さで、私の作だということにしています。最初のものは「時宜にかなった忠告」[18]という題で、あの書簡に対する起訴状が用意されると仮定して、大陪審に事情を知らせるためのものらしく見えます。もう一つ[19]は、一六八〇年の議会審議を記録した刊本からの抜粋で、大陪審の解散に反対する、イングランド庶民院の憤激した決議を含んでいます。前者は、お読みになれば、普通の羅紗商よりも巧みな手になるものだと、閣下にもおわかりになるでしょう。まったく自由で偏りのないはずの陪審員の心に、影響を及ぼそうとするものだと非難されています。その理屈からすれば、判事が法廷の内外で、自ら、あるいは手先を通じて、陪審員の誰か一人の感情や利害にでも、影響しかねないことを少しでもほのめかした例など、まして陪審全体に対してそんなことをした例など、これまで知られていないのは明らかです。ありふれた公刊裁判記録を、わざわざ少し拾い読みするだけで、誰もが納得するでしょう。そう考えると、過去六十年以上にわたり、両王国にいかに多くの高潔な判事がいたことかと、驚かずにはいられません。長くその地位を、任命者の意のままに解任できる条件で保っていたことを考えれば――この国では今もそうですが――、ほとんど奇跡だと思います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"

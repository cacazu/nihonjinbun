  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Ambrose Crowley (not Crawley) was alderman and sheriff of London. He was knighted January 1st, 1706-1707, and sat in the House of Commons as member for Andover in 1713-1714. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[309]"
    "line_start": 3559
    "source_sequence": 358
  "translation_ja": "アンブローズ・クラウリー（クローリーではない）は、ロンドン市の市参事会員およびシェリフであった。一七〇六／〇七年一月一日にナイトに叙せられ、一七一三―一七一四年、アンドーヴァー選出の庶民院議員を務めた。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-034"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But suppose there were not one single halfpenny of copper coin in this whole kingdom (which Mr. Wood seems to intend, unless we will come to his terms, as appears by employing his emissaries to buy up our old ones at a penny in the shilling more than they pass for), it could not be any real evil to us, although it might be some inconvenience. We have many sorts of small silver coins, to which they are strangers in England, such as the French threepences, fourpence halfpennies and eightpence half-pennies, the Scotch fivepences and tenpences, besides their twenty-pences, and three-and-four-pences, by all which we are able to make change to a halfpenny of almost any piece of gold or silver, and if we are driven to Brown's expedient of a sealed card, with the little gold or silver still remaining, it will I suppose, be somewhat better than to have nothing left but Wood's adulterated copper, which he is neither obliged by his patent, nor hitherto able by his estate to make good."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[310]"
    "line_start": 3564
    "source_sequence": 359
  "translation_ja": "しかし、仮に王国全体に半ペニーの銅貨一枚もなかったとしても、それは多少の不便ではあっても、私たちにとって本当の害にはなりません。ウッド氏は、こちらが自分の条件をのまなければ、実際そうするつもりらしいのです。手先を使って、私たちの古い銅貨を通用額一シリングにつき一ペニー高く買い占めさせていることからも、それは分かります。私たちには、イングランドではなじみのない小額銀貨が何種類もあります。たとえば、フランスの三ペンス貨、四ペンス半貨、八ペンス半貨、スコットランドの五ペンス貨、十ペンス貨があり、さらに二十ペンス貨、三シリング四ペンス貨もあります。これらをすべて使えば、ほとんどどんな金貨や銀貨でも、半ペニーの端数まで釣り銭を出せます。残り少ない金銀貨を使いながら、ブラウンのいう、印を押した札という手段に追い込まれたとしても、ウッドの混ぜ物入りの銅貨しか残らないよりは、多少ましだと思います。ウッドには、それを正貨で引き取る義務は特許状によっても課されておらず、今のところ、その資産による支払能力もないのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-035"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The Report farther tells us, it \"must be admitted that letters-patents under the Great Seal of Great Britain for coining copper money for Ireland are legal and obligatory, a just and reasonable exercise of His Majesty's royal prerogative, and in no manner derogatory or invasive of any liberty or privilege of his subjects of Ireland.\" First we desire to know, why His Majesty's prerogative might not have been as well asserted, by passing this patent in Ireland, and subjecting the several conditions of the contract to the inspection of those who are only concerned, as was formerly done in the only precedents for patents granted for coining for this kingdom, since the mixed money[12] in Queen Elizabeth's time, during the difficulties of a rebellion: Whereas now upon the greatest imposition that can possibly be practised, we must go to England with our complaints, where it hath been for some time the fashion to think and to affirm that \"we cannot be too hardly used.\" Again the Report says, that \"such patents are obligatory.\" After long thinking, I am not able to find out what can possibly be meant here by this word obligatory. This patent of Wood neither obligeth him to utter his coin, nor us to take it, or if it did the latter, it would be so far void, because no patent can oblige the subject against law, unless an illegal patent passed in one kingdom can bind another and not itself."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[311]"
    "line_start": 3580
    "source_sequence": 360
  "translation_ja": "「報告」はさらに、「グレートブリテンの国璽のもとに発給された、アイルランド向けの銅貨鋳造特許状は、合法かつ拘束力を有し、陛下の王権大権の正当かつ合理的な行使であって、アイルランドの臣民のいかなる自由や特権をも、何ら損ない侵すものではない、と認められねばならない」と述べています。第一に、私たちが知りたいのは、この特許状をアイルランドで発給し、契約のさまざまな条件を、利害の直接かかわる当地の人々の監督に委ねることによっても、同じように陛下の大権を確立できたのではないか、ということです。エリザベス女王の時代、反乱に苦しむ中で使われた混合金属の貨幣以来、[12] この王国向けの貨幣鋳造のために与えられた特許状の、わずかな先例では、以前そうしていたのです。ところが今では、考え得る限り最大の不正を押しつけられても、私たちは苦情を訴えるためにイングランドまで行かなければなりません。しかもそこでは、しばらく前から、「我々にはどれほどひどい扱いをしてもしすぎることはない」と考え、言い立てるのが流行しているのです。また、「報告」は「このような特許状は拘束力を持つ」と述べています。長く考えてみても、ここで拘束力という言葉が、いったい何を意味し得るのか分かりません。このウッドの特許状は、彼に貨幣の発行を義務づけてもいなければ、私たちにその受取りを義務づけてもいません。仮に後者を義務づけていたとしても、その限りで無効でしょう。どのような特許状も、法に反して臣民を拘束することはできないからです。もっとも、一方の王国で発給された違法な特許状が、発給された王国は拘束せず、他方を拘束できるというなら、話は別ですが。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":

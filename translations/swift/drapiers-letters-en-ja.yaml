- "id": "dl-l03-note-021-006"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"A certain King of Great Britain who spoke broad Scotch, and being himself a man of wit, loved both to hear and speak things that were humorous, had once a petition preferred to him, in which the petitioner, having set forth his own merits, most humbly prayed His Majesty to grant him letters-patent for receiving a shilling from every one of his subjects who should be willing to give so much to him. 'In gude troth,' said the King, 'a very reasonable petition. Let every man give thee twa shillings gin he be willing so to do, and thou shalt have full liberty to receive it.' 'But,' says the petitioner, 'I desire that this clause may be inserted in my patent, That every man who refuses to give me a shilling, should appear at Westminster Hall to shew cause why he so refuses.' 'This also,' says the King, 'shall be granted thee, but always with this proviso, that the man be willing to come.'"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[364]"
    "line_start": 4193
    "source_sequence": 417
  "translation_ja": "「スコットランド訛りのきつい、あるグレートブリテンの国王は、自ら機知に富んだ人で、面白い話を聞くのも話すのも好きでした。あるとき、この国王に一通の請願が差し出されました。請願者は自分の功績を並べたうえで、自分に一シリングを与える意思のある臣民すべてから、その額を受け取る特許状を賜りたいと、謹んで陛下にお願いしたのです。「ほんに、まことにもっともな請願じゃ」と国王は言いました。「皆、そなたに二シリング与えるがよい、そうしたいというならな。そなたは自由に受け取ってよいぞ」。「ですが」と請願者は言いました。「特許状には、次の条項を入れていただきたいのです。私に一シリングを与えるのを拒む者は、皆、ウェストミンスターの法廷に出頭し、なぜ拒むのか、理由を示すべきものとする、と」。「それも許そう」と国王は言いました。「ただし常に、本人が出てきたいと思う場合に限る、という条件付きじゃ」。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":

- "id": "dl-l03-note-007-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "A hint at the Duchess of Kendal's influence in the procuring of the patent. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"

    "contributor_id": "swift"
- "id": "dl-l03-note-005-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "It will serve to elucidate this paragraph if an account be given of the various coinage patents issued for Ireland. Monck Mason gives an account in a long note to his biography of Swift; but as he has obtained it from the very ably written tract, \"A Defence of the Conduct of the People of Ireland,\" etc., I have gone to that pamphlet for the present résumé. I quote from pp. 21-24 of the Dublin edition, issued in 1724 and printed by George Ewing:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[279]"
    "line_start": 3156
    "source_sequence": 328
  "translation_ja": "アイルランドに対して発行されたさまざまな貨幣鋳造特許状の経緯を述べれば、この段落は理解しやすくなるだろう。モンク・メイソンは、スウィフト伝の長い注にその経緯を記しているが、その資料は、きわめて優れた論考『アイルランド国民の行動の弁護』等から得ている。そこで本要約では、その小冊子自体に当たった。一七二四年刊、ジョージ・ユーイング印刷のダブリン版二一―二四頁から引用する。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-005-002"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"K. Charles 2d. 1660 granted a patent for coining only farthings for the kingdom of Ireland to Coll. Armstrong: But I do not find he ever made any use of it.[A] For all our copper and brass money to the year 1680 was issued by private persons, who obtained particular licences, on giving security to change their half-pence and farthings for gold and silver; but some of their securities failing, others pretending the half-pence which were tendered to be changed were counterfeits, the public always suffered. Col. Armstrong's son, finding great profit was made by coining half-pence in Ireland, by virtue of particular licences recallable at pleasure, solicited and obtained a patent in the name of George Legg afterwards Lord Dartmouth, for coining half-pence for Ireland from 1680, for 21 years, he giving security to exchange them for gold or silver on demand.[B] In pursuance of this he coined considerable quantities of half-pence for four years; but in 1685 [John] Knox, with the consent of Armstrong, got the remaining part of this term granted by patent in his own name, he giving security as above, and got his half-pence declared the current coin of Ireland, notwithstanding two Acts of Parliament had enacted that they should not be received in the revenue. Knox was interrupted in his coinage in 1689, by King James's taking it into his own hands, to coin his famous brass money, of which he coined no less than £965,375, three penny worth of metal passing for £10 ster. In this money creditors were obliged to receive their debts, and by this cruel stratagem Ireland lost about £60,000 per month. This not only made our gold and silver, but even our half-pence to disappear; which obliged King William to coin pewter half-pence for the use of his army...."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[280]"
    "line_start": 3165
    "source_sequence": 329
  "translation_ja": "「チャールズ二世は一六六〇年、アイルランド王国向けにファージング銅貨だけを鋳造する特許状を、アームストロング大佐に与えた。しかし、彼がそれを行使した事実は見当たらない。[A] というのも、一六八〇年まで、わが国の銅貨と真鍮貨はすべて、半ペニーおよびファージング銅貨を金銀と交換する担保を差し入れ、個別の許可を得た私人によって発行されていたからである。しかし、ある者は担保が破綻し、またある者は交換のために持ち込まれた半ペニー銅貨が偽物だと言い張ったので、損をするのはいつも公衆だった。アームストロング大佐の息子は、いつでも取り消せる個別の許可によるアイルランドでの半ペニー銅貨鋳造が大きな利益を生んでいるのを見て、のちにダートマス卿となるジョージ・レッグの名で特許状を申請し、取得した。一六八〇年から二十一年間、請求があれば金貨または銀貨と交換する担保を差し入れて、アイルランド向けに半ペニー銅貨を鋳造するというものだった。[B] これに基づいて、彼は四年間、大量の半ペニー銅貨を鋳造した。しかし一六八五年、［ジョン・］ノックスが、アームストロングの同意を得て、残りの期間を自分名義の特許状で与えられた。同じように担保を差し入れ、二つの議会制定法がこれを歳入として受け取ってはならないと定めていたにもかかわらず、自分の半ペニー銅貨をアイルランドの通用貨幣と宣言させたのである。ノックスの鋳造は一六八九年、ジェームズ王がみずから鋳造を引き受け、その有名な真鍮貨を鋳造したことで、中断された。その鋳造額は実に九十六万五千三百七十五ポンドであり、三ペンス分の金属が英貨十ポンドとして通用した。債権者はこの貨幣で債務の支払いを受けなければならず、この残酷な策略によって、アイルランドは毎月およそ六万ポンドを失った。これによって金銀貨のみならず、半ペニー銅貨さえ姿を消したので、ウィリアム王は自軍のために白鑞の半ペニー貨を鋳造せざるを得なくなった。……"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"

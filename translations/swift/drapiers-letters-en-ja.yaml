  "source_text": "The portion here in square brackets was printed in the fourth edition of this Letter and in the work entitled, \"Fraud Detected.\" It is not given in Faulkner's first collected edition issued in 1735, nor in \"The Hibernian Patriot,\" issued in 1730. [T.S.]"

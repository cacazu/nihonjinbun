  "origin": "source"
  "source_text": "Jean Bodin, who died in 1596, wrote the \"Livres de la Republique,\" a remarkable collection of information and speculation on the theoretical basis of political government. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"

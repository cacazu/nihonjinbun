    "contributor_id": "swift"
- "id": "dl-l04-note-017-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Hugh Boulter (1672-1742) was appointed Archbishop of Armagh, August 31st, 1724. He had been a fellow of Magdalen College, Oxford, and had served the King as chaplain in Hanover, in 1719. In this latter year he was promoted to the Bishopric of Bristol, and the Deanery of Christ Church, Oxford. His appointment as Primate of Ireland, was in accordance with Walpole's plan for governing Ireland from England. Walpole had no love for Carteret, and no faith in his power or willingness to aid him in his policy. Indeed, Carteret was sent to Ireland to be got out of the way. He was governor nominally; the real governor being Walpole in the person of the new Primate. What were Boulter's instructions may be gathered from the manner in which he carried out his purpose. Of a strong character and of untiring energy, Boulter set about his work in a fashion which showed that Walpole had chosen well. Nothing of any importance that transpired in Ireland, no fact of any interest about the individuals in office, no movement of any suspected or suspicious person escaped his vigilance. His letters testify to an unabating zeal for the English government of Irish affairs by Englishmen in the English interest. His perseverance knew no obstacles; he continued against all difficulties in his dogged and yet able manner to establish some order out of the chaos of Ireland's condition. But his government was the outcome of a profound conviction that only in the interest of England should Ireland be governed. If Ireland could be made prosperous and contented, so much more good would accrue to England. But that prosperity and that contentment had nothing whatever to do with safeguarding Irish institutions, or recognizing the rights of the Irish people. If he gave way to popular opinion at all, it was because it was either expedient or beneficial to the English interest. If he urged, as he did, the founding of Protestant Charter schools, it was because this would strengthen the English power. To preserve that he obtained the enactment of a statute which excluded Roman Catholics from the legal profession and the offices of legal administration; and another act of his making actually disfranchised them altogether. Boulter was also a member of the Irish Privy Council, and Lord Justice of Ireland. The latter office he held under the vice-regencies of Carteret, Dorset and Devonshire. His secretary, Ambrose Philips, had been connected with him, in earlier years, in contributing to a periodical entitled, \"The Free Thinker,\" which appeared in 1718. Philips, in 1769, supervised the publication of Boulter's \"Letters,\" which were published at Oxford. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[438]"
    "line_start": 4992
    "source_sequence": 503
  "translation_ja": "ヒュー・ボールター（一六七二―一七四二）は、一七二四年八月三十一日、アーマー大主教に任命された。オックスフォードのモードリン・カレッジのフェローを務め、一七一九年にはハノーファーで国王の礼拝付き牧師を務めた。同年、ブリストル主教、およびオックスフォードのクライスト・チャーチ首席司祭に昇進した。アイルランド首座大主教への任命は、アイルランドをイングランドから統治するというウォルポールの計画に沿ったものであった。ウォルポールはカータレットを好まず、自分の政策を支える力や意思があるとも信じていなかった。実際、カータレットがアイルランドに送られたのは、邪魔を除くためだった。彼は名目上の統治者であり、真の統治者は、新任の首座大主教を通じて働くウォルポールだったのである。ボールターに与えられた指示は、彼が目的を遂げたやり方から推し量れる。強固な性格と尽きぬ精力を備えたボールターは、ウォルポールの人選が正しかったことを示す仕方で仕事に取りかかった。アイルランドで起こった重要な出来事、在職者個々についての興味ある事実、疑われている、あるいは疑わしい人物の動静は、一つとして彼の監視を免れなかった。その書簡は、イングランド人が、イングランドの利益のために、アイルランドの諸事をイングランド政府によって治めることへの、衰えぬ熱意を証し立てている。その粘り強さには、障害というものがなかった。彼はあらゆる困難に逆らい、執拗でありながら有能なやり方を続け、混沌としたアイルランドの状態から、多少の秩序を築こうとした。しかし、その統治は、アイルランドはもっぱらイングランドの利益のために統治されるべきだという、深い確信から生まれていた。アイルランドを繁栄させ、満足させることができれば、それだけ多くの利益がイングランドにもたらされる。しかし、その繁栄と満足は、アイルランドの制度を守ることとも、アイルランド国民の権利を認めることとも、いっさい関係がなかった。世論に譲ることがあったとしても、それは便宜にかなうか、イングランドの利益に役立つ場合だった。実際に彼がプロテスタントの勅許学校の設立を推進したのも、それがイングランドの権力を強めるからだった。その権力を守るため、彼はローマ・カトリック教徒を法律専門職や司法行政の官職から排除する法律を成立させ、さらに、彼の作った別の法律は、彼らの選挙権を完全に奪った。ボールターは、アイルランド枢密顧問官および統治代行官でもあった。後者の職は、カータレット、ドーセット、デヴォンシャーが総督を務めた時期に保持した。秘書のアンブローズ・フィリップスは、それ以前の一七一八年に発行された『自由思想家』という定期刊行物への寄稿で、彼と関係があった。フィリップスは一七六九年、オックスフォードで出版されたボールターの『書簡集』の刊行を監督した。［T・S］"

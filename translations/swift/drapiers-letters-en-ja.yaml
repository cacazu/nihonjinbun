- "id": "dl-l03-note-020-009"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"ADVERTISEMENT."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/h3[20]"
    "line_start": 4095
    "source_sequence": 402
  "translation_ja": "「広告"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-020-010"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"Whereas, I, Thomas Handy, of Meath Street, Dublin, did receive by the last packet, from a person in London, to whom I am an entire stranger, bills of lading for eleven casks of Wood's halfpence, shipped at Bristol, and consigned to me by the said person on his own proper account, of which I had not the least notice until I received the said bills of lading."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[351]"
    "line_start": 4098
    "source_sequence": 403
  "translation_ja": "「私、ダブリン、ミース通りのトマス・ハンディは、先便の郵便船で、まったく面識のないロンドンのある人物から、ウッドの半ペニー銅貨十一樽についての船荷証券を受け取った。銅貨はブリストルで船積みされ、前記人物が自らの勘定で私宛てに委託したものであり、私はこの船荷証券を受け取るまで、何一つ知らされていなかった。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-020-011"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"Now I, the said Thomas Handy, being highly sensible of the duty and regard which every honest man owes to his country and to his fellow-subjects, do hereby declare, that I will not be concerned, directly or indirectly, in entering, landing, importing, receiving, or uttering any of the said Wood's halfpence, for that I am fully convinced, as well from the addresses of both Houses of Parliament, as otherwise, that the importing and uttering the said halfpence will be destructive to this nation, and prejudicial to his Majesty's revenue."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[352]"
    "line_start": 4105
    "source_sequence": 404
  "translation_ja": "「そこで、前記トマス・ハンディである私は、すべての誠実な人間が祖国と同胞臣民に対して負う務めと配慮を、深く自覚しているので、前記ウッドの半ペニー銅貨のいかなるものについても、通関、陸揚げ、輸入、受取り、流通に、直接にも間接にもかかわらないことを、ここに宣言する。議会両院の上奏からも、その他の事情からも、前記半ペニー銅貨の輸入と流通は、この国を破滅させ、陛下の歳入を損なうものと、私は十分に確信しているからである。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-020-012"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"And of this my resolution I gave notice by letter to the person who sent me the bills of lading, the very day I received them, and have sent back the said bills to him."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[353]"
    "line_start": 4115
    "source_sequence": 405
  "translation_ja": "「私は、船荷証券を受け取ったその日に、送り主へ書簡を出して、この決意を知らせ、前記船荷証券も返送した。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-020-013"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"THO. HANDY."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/h3[21]"
    "line_start": 4120
    "source_sequence": 406
  "translation_ja": "「トマス・ハンディ"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."

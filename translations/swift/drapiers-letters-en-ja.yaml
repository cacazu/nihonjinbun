    "contributor_id": "swift"
- "id": "dl-l03-note-012-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"Civill warre having set all Ireland in a combustion, the Queene [Elizabeth] more easily to subdue the rebels, did take silver coyne from the Irish, some few years before her death, and paid her army with a mixed base coyne, which, by proclamation, was commanded to be spent and received, for sterling silver money. This base mixed money had three parts of copper, and the fourth part of silver, which proportion of silver was in some part consumed by the mixture, so as the English goldsmiths valued a shilling thereof at no more than two silver pence, though they acknowledged the same to be worth two pence halfpenny.\" (Fynes Moryson's \"Itinerary,\" pt. i., p. 283). [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[312]"
    "line_start": 3602
    "source_sequence": 361
  "translation_ja": "「内戦によってアイルランド全土が燃え上がったため、女王［エリザベス］は、反徒をより容易に征服しようと、その死の数年前、アイルランド人から銀貨を取り上げ、軍には混合金属の粗悪な貨幣で給与を払った。この貨幣は、英貨の銀貨として支払いに使い、また受け取るよう、布告で命じられた。この粗悪な混合貨幣は、四分の三が銅、四分の一が銀であったが、混合によって銀の一部が消耗するので、イングランドの金細工師たちは、二ペンス半の価値があるとは認めながら、その一シリングを銀の二ペンスにしか評価しなかった」（ファインズ・モリスン『旅行記』第一部、二八三頁）。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-036"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lastly, it is added that \"such patents are in no manner derogatory or invasive of any liberty or privilege of the King's subjects of Ireland.\" If this proposition be true, as it is here laid down, without any limitation either expressed or implied, it must follow that a King of England may at any time coin copper money for Ireland, and oblige his subjects here to take a piece of copper under the value of half a farthing for half-a-crown, as was practised by the late King James, and even without that arbitrary prince's excuse, from the necessity and exigences of his affairs. If this be in no manner \"derogatory nor evasive of any liberties or privileges of the subjects of Ireland,\" it ought to have been expressed what our liberties and privileges are, and whether we have any at all, for in specifying the word Ireland, instead of saying \"His Majesty's subjects,\" it would seem to insinuate that we are not upon the same foot with our fellow-subjects in England; which, however the practice may have been, I hope will never be directly asserted, for I do not understand that Poining's act[13] deprived us of our liberty, but only changed the manner of passing laws here (which however was a power most indirectly obtained) by leaving the negative to the two Houses of Parliament. But, waiving all controversies relating to the legislature, no person, I believe, was ever yet so bold as to affirm that the people of Ireland have not the same title to the benefits of the common law, with the rest of His Majesty's subjects, and therefore whatever liberties or privileges the people of England enjoy by common law, we of Ireland have the same; so that in my humble opinion, the word Ireland standing in that proposition, was, in the mildest interpretation, a lapse of the pen."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[313]"
    "line_start": 3614
    "source_sequence": 362
  "translation_ja": "最後に、「このような特許状は、アイルランドの国王臣民のいかなる自由や特権をも、何ら損ない侵すものではない」と付け加えられています。この命題が、ここに記されたとおり、明示的にも黙示的にも一切の制限なしに正しいのなら、イングランドの国王は、いつでもアイルランド向けに銅貨を鋳造し、当地の臣民に、半ファージングにも満たない銅片を半クラウンとして受け取るよう強制できる、ということになるはずです。先のジェームズ王が実際にしたとおりです。しかも、あの専制君主が持ち出した、政務の切迫した必要という言い訳さえなしに、できるのです。これが「アイルランドの臣民のいかなる自由や特権をも、何ら損なわず侵さない」というのなら、私たちの自由と特権とは何なのか、そもそもそのようなものがあるのか、明示しておくべきでした。ただ「陛下の臣民」と言わず、アイルランドという語を特に挙げることは、私たちがイングランドの同胞臣民と同じ立場にはないと、ほのめかすように思われるからです。実際の扱いがどうであったにせよ、そんなことが正面から主張されることは決してないと、願っています。ポイニングス法が私たちの自由を奪ったとは、私は理解していません。[13] それは、議会両院に拒否権を残したまま、当地での法律成立の方法を変えただけなのです。もっとも、その権限が手に入れられた手段は、甚だしく不正なものでした。しかし、立法府についての論争はいっさい措くとして、アイルランドの国民には、陛下のほかの臣民と同じくコモン・ローの恩恵を受ける権利がない、などと断言するほど大胆な者は、まだいなかったと思います。したがって、イングランドの国民がコモン・ローによって享受するどのような自由や特権も、アイルランドの私たちには同様にあります。ですから私の卑見では、この命題の中のアイルランドという語は、最も穏やかに解しても、筆の誤りだったのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":

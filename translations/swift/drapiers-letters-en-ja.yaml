- "id": "dl-l05-003"
  "section_id": "letter-05-advertisement"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The next treatise is called \"An Address, &c.\" It is without a date; but seems to be written during the first session of Parliament in Lord Carteret's government. The title of this Address is in the usual form, by M.B. Drapier. There is but a small part of it that relates to William Wood and his coin: The rest contains several proposals for the improvement of Ireland, the many discouragements it lies under, and what are the best remedies against them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[512]"
    "line_start": 5718
    "source_sequence": 589
  "translation_ja": "次の論説は「上申、その他」と題されている。日付はないが、カータレット卿の統治下で最初の議会会期中に書かれたものと思われる。この上申の題には、通例の形で、M・B・ドレイピア著と記されている。ウィリアム・ウッドとその貨幣に関する部分はごくわずかで、それ以外は、アイルランドを改善するいくつかの提案、この国にのしかかる多くの障害、そしてそれらに対する最良の対策を論じている。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "early_editor_preface"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "Faulkner版に置かれた刊行前付。ScottはSwiftの指示下の可能性とするが著者とは断定しない。"
- "id": "dl-l05-004"
  "section_id": "letter-05-advertisement"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "By many passages in some of the Drapier's former letters, but particularly in the following Address, concerning the great drain of money from Ireland by absentees, importation of foreign goods, balance of trade, and the like, it appears that the author had taken much pains, and been well informed in the business of computing; all his reasonings upon that subject, although he does not here descend to particular sums, agreeing generally with the accounts given by others who have since made that enquiry their particular study. And it is observable, that in this Address, as well as in one of his printed letters, he hath specified several important articles, that have not been taken notice of by others who came after him."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[513]"
    "line_start": 5727
    "source_sequence": 590
  "translation_ja": "ドレイピアの以前の書簡にも多く見られるが、とりわけ以下の上申の、国外居住地主によるアイルランドからの巨額の資金流出、外国商品の輸入、貿易収支などに関する箇所からは、著者が計算の仕事に大いに骨を折り、よく事情に通じていたことがわかる。この文書では細かな金額にまでは立ち入っていないが、この問題についての推論はすべて、後にそれを専門の研究とした人々の算定と、おおむね一致している。また、この上申と刊行済みの書簡の一つには、後に同じ問題を論じた人々も取り上げていない重要項目がいくつか明記されていることにも、注目されたい。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "early_editor_preface"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "Faulkner版に置かれた刊行前付。ScottはSwiftの指示下の可能性とするが著者とは断定しない。"

- "id": "dl-l01-018"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When once the kingdom is reduced to such a condition, I will tell you what must be the end: The gentlemen of estates will all turn off their tenants for want of payment, because as I told you before, the tenants are obliged by their leases to pay sterling which is lawful current money of England; then they will turn their own farmers, as too many of them do already, run all into sheep where they can, keeping only such other cattle as are necessary, then they will be their own merchants and send their wool and butter and hides and linen beyond sea for ready money and wine and spices and silks. They will keep only a few miserable cottiers.[23] The farmers must rob or beg, or leave their country. The shopkeepers in this and every other town, must break and starve: For it is the landed man that maintains the merchant, and shopkeeper, and handicraftsman."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[126]"
    "line_start": 1433
    "source_sequence": 157
  "translation_ja": "王国がいったんそんな状態に陥れば、どういう結末になるか、お話ししましょう。地主の方々はみな、支払いがないとして小作人を追い出します。すでに申し上げたとおり、小作人は賃貸契約により、イングランドで適法に通用するスターリング貨で払う義務があるからです。そうして地主は自分で農場を経営し始めます。すでに、そうする地主があまりに多いのですが、可能な土地はすべて羊の放牧地にし、ほかの家畜は必要な分だけ残します。それから自分で商人にもなり、羊毛、バター、獣皮、亜麻布を海の向こうへ送り、現金や、ワイン、香辛料、絹織物と引き換えます。残しておくのは、みじめな零細小作人[23]をほんの少しだけです。農民は盗むか、乞うか、国を去るかするほかありません。この町でも、ほかのどの町でも、店を営む者は破産して飢えることになります。商人、店主、職人を養っているのは、土地を持つ者なのですから。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-023-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"Unlike the peasant proprietor,\" says Lecky, \"and also unlike the mediaeval serf, the cottier had no permanent interest in the soil, and no security for his future position. Unlike the English farmer, he was no capitalist, who selects land as one of the many forms of profitable investment that are open to him. He was a man destitute of all knowledge and of all capital, who found the land the only thing that remained between himself and starvation. Rents in the lower grades of tenancies were regulated by competition, but it was competition between a half-starving population, who had no other resources except the soil, and were therefore prepared to promise anything rather than be deprived of it. The landlord did nothing for them. They built their own mud hovels, planted their hedges, dug their ditches. They were half naked, half starved, utterly destitute of all providence and of all education, liable at any time to be turned adrift from their holdings, ground to the dust by three great burdens—rack-rents, paid not to the landlord but to the middleman; tithes, paid to the clergy—often the absentee clergy—of the church to which they did not belong; and dues, paid to their own priests\" (\"Hist, of Ireland,\" vol. i., pp. 214-215, ed. 1892). [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[127]"
    "line_start": 1447
    "source_sequence": 158
  "translation_ja": "レッキーは言う。「自作農とも、中世の農奴とも違って、この零細小作人には土地に対する恒久的な権利がなく、将来の地位の保障もなかった。イングランドの農業経営者のように、選ぶことのできる数多くの有利な投資先の一つとして土地を選ぶ資本家でもなかった。知識も資本も何一つ持たず、自分と餓死の間に残されたものは土地だけ、という人間だったのである。下層の借地の地代は競争によって決まったが、それは土地以外に頼るものがなく、それを奪われるくらいならどんな約束でもしようとする、半ば飢えた人々の間の競争だった。地主は彼らのために何もしなかった。泥の小屋を建て、生け垣を植え、溝を掘るのは自分たちだった。半ば裸で半ば飢え、将来への備えも教育もまるでなく、いつでも借地から放り出されかねなかった。三つの大きな重荷に、彼らは地面へすりつぶされていた。地主ではなく中間の借地人に払う法外な地代、自分が属していない教会の、しばしば土地にもいない聖職者に払う十分の一税、そして自分たちの司祭に払う上納金である」（『アイルランド史』第一巻二一四〜二一五頁、一八九二年版）。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":

    "line_start": 5091
    "source_sequence": 509
  "translation_ja": "この段落は、大いに憤慨を招いた。スウィフトは、第六書簡で再びこれに触れている。ヘンリー・クレイク卿は、その『ジョナサン・スウィフト伝』（第二巻、七四頁）で、この段落と、すでに言及した第六書簡の段落について、鋭い注を付している。ここに転記させていただく。「反対者にジャコバイトの疑いを結びつけることに成功したスウィフトの策略は、ことのほか彼らしい。また、次の書簡で、この段落への異議に応じ、同じくらい相手を困らせかねないほどの服従を、半ば申し出る手腕も、彼らしいものである。それは、ジャコバイトが十分に強くなれば、そのジャコバイトへの服従さえ含む。しかし、彼は自分を縛る言質は与えない。『意地の悪い解釈』を恐れるからである。つまり、彼はイングランド政府を、逃げ道のない二者択一に追い込む。『私はジャコバイトに抵抗すべきなのか。それなら、あなた方のアイルランド従属論はどうなるのか』。あるいは、『イングランドが命ずれば、私はジャコバイトになるべきなのか。それなら、あなた方のプロテスタント王位継承はどうなるのか。それさえも、あなた方が専制したいという欲望に道を譲らなければならないのか』」。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"

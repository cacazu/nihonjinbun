  "translation_ja": "ここで角括弧に入れた部分は、この書簡の第四版、および『暴かれた詐欺』と題する著作に印刷されている。一七三五年刊のフォークナーによる最初の作品集にも、一七三〇年刊の『アイルランドの愛国者』にもない。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"

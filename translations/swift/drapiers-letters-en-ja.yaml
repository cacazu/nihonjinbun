    "line_start": 1387
    "source_sequence": 154
  "translation_ja": "ジェイムズ二世は、アイルランドでの不首尾に終わった戦役中、兵士への支出を賄うために貨幣を悪鋳した。キング大主教は『アイルランドにおけるプロテスタントの状況』で、この措置の弊害を次のように記している。「ジェイムズ王の評議会は、法律や道理の手続にこだわることなどなかった。そこで大量の真鍮貨が鋳造され、一六八九年六月十八日付の布告により、厳罰をもってその通用が強制された。この貨幣の材料は最も粗悪な真鍮で、古い大砲や金属のくずを溶かして作られた。職工たちの評価では一ポンドの重さで三ペンスか一グロート、つまり四ペンスにしかならなかったが、六ペンス、一シリング、半クラウンの貨幣に鋳造すると、一ポンドの重さでおよそ五ポンドの額面となった。さらに一六九〇年の別の布告では、半クラウン貨を回収し、刻印を打ち直して一クラウン貨として通用させた。こうして三、四ペンス相当の金属が十ポンドとなったのである。造幣所が初めて設けられてからボイン川での敗走まで、およそ十二か月の間に、総額九十六万五千三百七十五ポンドが鋳造された。ジェイムズ王はすべての俸給をこの貨幣で支払った。王の給与を受ける者はおおむねカトリック教徒であったので、彼らはプロテスタントに、この貨幣と引換えに店の品物を渡させ、貸金の返済もこれで受け取らせた。そのため真鍮貨による損失は、いわばすべてプロテスタントに降りかかった。この策略によって月におよそ六万ポンドをだまし取られたのである。ほかに呼びようがない。これでは数か月で彼らの資力はすっかり尽きてしまう。カトリック教徒は、隣人のプロテスタントから売り物の大半を手に入れても、なお大量の真鍮貨を持っていた。そこで、土地を持つ自分たちの仲間のうち、どれほどの者が、判決債務や、土地を担保とする商事債務認諾証書や、抵当によって、土地をプロテスタントへの担保に入れているかを考え始めた。そしてこれも彼らから奪うため、一六八九年二月四日付の布告を出させ、いかなる支払いにも真鍮貨を通用させた。」ウィリアム三世の一六九〇年七月十日付の布告は、このジェイムズ王のクラウン貨を一枚につき一ペニーとして通用させるよう命じている。［T・S］"

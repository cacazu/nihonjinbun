    "xpath": "/html/body/p[298]"
    "line_start": 3423
    "source_sequence": 347
  "translation_ja": "特許取得に際してのケンダル公爵夫人の影響力をほのめかしている。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-027"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Among other clauses mentioned in this patent, to shew how advantageous it is to Ireland, there is one which seems to be of a singular nature, that the patentee shall be obliged, during his term, \"to pay eight hundred pounds a year to the crown, and two hundred pounds a year to the comptroller.\"[8] I have heard indeed that the King's council do always consider, in the passing of a patent, whether it will be of advantage to the crown, but I have likewise heard that it is at the same time considered whether the passing of it may be injurious to any other persons or bodies politic. However, although the attorney and solicitor be servants to the King, and therefore bound to consult His Majesty's interest, yet I am under some doubt whether eight hundred pounds a year to the crown would be equivalent to the ruin of a kingdom. It would be far better for us to have paid eight thousand pounds a year into His Majesty's coffers, in the midst of all our taxes (which, in proportion, are greater in this kingdom than ever they were in England, even during the war) than purchase such an addition to the revenue at the price of our utter undoing."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[299]"
    "line_start": 3427
    "source_sequence": 348
  "translation_ja": "この特許状がいかにアイルランドの利益になるかを示すために挙げられた条項の中に、いささか風変わりなものがあります。特許権者は期間中、「王室に年八百ポンド、検査官に年二百ポンドを支払う」義務を負うというのです。[8] 確かに、国王の法律顧問は、特許状を発給するに当たり、それが王室の利益になるかどうかを必ず検討すると聞いています。しかし同時に、その発給が、ほかの個人や公的団体を害するおそれはないかも検討すると、聞いています。もっとも、法務総裁も法務次官も国王の臣下であり、したがって陛下の利益を図る義務があるとはいえ、王室への年八百ポンドが、一王国の破滅に見合うものかどうか、私には多少疑問があります。私たちの全面的な破滅を代価として、このような歳入の増加を手に入れるよりは、あらゆる税の負担を抱えたままでも、陛下の金庫に年八千ポンドを納めたほうが、私たちにははるかによかったでしょう。しかも、わが王国の税負担は、その規模に照らせば、戦時を含めたイングランドのどの時期のものよりも重いのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-008-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "By the terms of the patent, Wood covenanted to pay to the King's clerk, or comptroller of the coinage, £200 yearly, and £100 per annum into his Majesty's exchequer, and not as Walpole's report has it, £800 and £200. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[300]"
    "line_start": 3445
    "source_sequence": 349
  "translation_ja": "特許状の条件により、ウッドは、国王付き書記官、すなわち鋳造検査官に年二百ポンドを、陛下の財務府に年百ポンドを支払うことを約した。ウォルポールの報告にある八百ポンドと二百ポンドではない。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-028"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But here it is plain that fourteen thousand pounds are to be paid by Wood, only as a small circumstantial charge for the purchase of his patent, what were his other visible costs I know not, and what were his latent, is variously conjectured. But he must be surely a man of some wonderful merit. Hath he saved any other kingdom at his own expense, to give him a title of reimbursing himself by the destruction of ours? Hath he discovered the longitude or the universal medicine? No. But he hath found out the philosopher's stone after a new manner, by debasing of copper, and resolving to force it upon us for gold."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[301]"
    "line_start": 3451
    "source_sequence": 350
  "translation_ja": "ところが、ここではっきりしているのは、ウッドが特許状を買い取るに当たり、単なる付随的な小経費として、一万四千ポンドを支払うことになっているということです。ほかにどのような表向きの費用があったのか、私は知りません。裏の費用については、さまざまな憶測が飛んでいます。しかし、彼はきっと、何か驚くべき功績のある人物なのでしょう。ほかの王国を自費で救ったので、わが国を破滅させてその費用を取り戻す権利があるのでしょうか。経度の測定法か、万能薬でも発見したのでしょうか。いいえ。ですが、銅を粗悪なものにして、金の代わりに私たちに押しつけようと決意することによって、新しいやり方の賢者の石を発見したのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-029"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When the two Houses represented to His Majesty, that this patent to Wood was obtained in a clandestine manner, surely the Committee could not think the Parliament would insinuate that it had not passed in the common forms, and run through every office where fees and perquisites were due. They knew very well that persons in places were no enemies to grants, and that the officers of the crown could not be kept in the dark. But the late Lord Lieutenant of Ireland[9] affirmed it was a secret to him (and who will doubt of his veracity, especially when he swore to a person of quality; from whom I had it, that Ireland should never be troubled with these halfpence). It was a secret to the people of Ireland, who were to be the only sufferers, and those who best knew the state of the kingdom and were most able to advise in such an affair, were wholly strangers to it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[302]"
    "line_start": 3462
    "source_sequence": 351
  "translation_ja": "両院が陛下に、このウッドへの特許状は秘密裏に取得されたものだと上奏したとき、議会が、通常の形式を経ず、手数料や役得を納めるべき役所をすべて通していないとほのめかしたのだと、委員会が考えたはずはありません。官職に就いている人々が特許の授与を嫌わないことも、王室の役人たちに隠し通せるはずがないことも、議会はよく知っていたのです。しかし、前のアイルランド総督は、[9] 自分には秘密にされていたと断言しました。その誠実さを誰が疑うでしょう。とりわけ、この半ペニー銅貨でアイルランドが悩まされることは決してないと、ある身分ある人に誓っていたのです。その人から、私は直接聞きました。ただ被害だけを受けることになるアイルランドの国民にとっても、これは秘密でした。そして、王国の事情を最もよく知り、このような案件について最も適切に助言できる人々は、まったく何も知らされていなかったのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-009-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The Duke of Grafton. Walpole called him \"a fair-weather pilot, that knew not what he had to do, when the first storm arose.\" Charles, second Duke of Grafton (1683-1757), was the grandfather of the third duke, so virulently attacked by Junius in his famous letters. [T. S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[303]"
    "line_start": 3476
    "source_sequence": 352
  "translation_ja": "グラフトン公。ウォルポールは彼を、「最初の嵐が起こると何をすべきか分からなくなる、凪の海だけの水先案内人」と呼んだ。第二代グラフトン公チャールズ（一六八三―一七五七）は、有名な書簡でジュニアスから激烈な攻撃を受けた第三代公爵の祖父である。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-030"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is allowed by the Report that this patent was passed without the knowledge of the chief governor or officers of Ireland; and it is there elaborately shewn, that \"former patents have passed in the same manner, and are good in law.\" I shall not dispute the legality of patents, but am ready to suppose it in His Majesty's power to grant a patent for stamping round bits of copper to every subject he hath. Therefore to lay aside the point of law, I would only put the question, whether in reason and justice it would not have been proper, in an affair upon which the welfare of a kingdom depends, that the said kingdom should have received timely notice, and the matter not be carried on between the patentee and the officers of the Crown, who were to be the only gainers by it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[304]"
    "line_start": 3483
    "source_sequence": 353
  "translation_ja": "「報告」は、この特許状がアイルランドの最高統治官や役人たちに知られずに発給されたことを認めています。そして、「以前の特許状も同じ方法で発給されており、法律上有効である」と、念入りに示しています。私は特許状の合法性を争おうとは思いません。陛下には、丸い銅片に刻印を押す特許状を、すべての臣民に一つずつ与える権限があると、ひとまず認めましょう。そこで法律の問題は脇に置き、一王国の幸福がかかっている案件であれば、その王国にしかるべき時期に知らせ、そこから利益を得る唯一の者たちである特許権者と王室の役人との間だけで話を進めないのが、道理と正義に照らして適切だったのではないかと、ただそれだけを伺いたいのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-031"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The Parliament, who in matters of this nature are the most able and faithful counsellors, did represent this grant to be \"destructive of trade, and dangerous to the properties of the people,\" to which the only answer is, that \"the King hath a prerogative to make such a grant.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[305]"
    "line_start": 3496
    "source_sequence": 354
  "translation_ja": "この種の問題では最も有能で忠実な助言者である議会は、この特許が「貿易を破壊し、国民の財産を危うくする」と上奏しました。それに対する唯一の答えは、「国王にはそのような特許を授与する大権がある」というものです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-032"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is asserted that in the patent to Knox, his \"halfpence, are made and declared the current coin of the kingdom,\" whereas in this to Wood, there is only a \"power given to issue them to such as will receive them.\" The authors of the Report, I think, do not affirm that the King can by law declare anything to be current money by his letters-patents. I dare say they will not affirm it, and if Knox's patent contained in it powers contrary to law, why is it mentioned as a precedent in His Majesty's just and merciful reign:[10] But although that clause be not in Wood's patent, yet possibly there are others, the legality whereof may be equally doubted, and particularly that, whereby \"a power is given to William Wood to break into houses in search of any coin made in imitation of his.\" This may perhaps be affirmed to be illegal and dangerous to the liberty of the subject. Yet this is a precedent taken from Knox's patent, where the same power is granted, and is a strong instance what uses may be sometimes made of precedents."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[306]"
    "line_start": 3502
    "source_sequence": 355
  "translation_ja": "ノックスの特許状では、その「半ペニー銅貨を王国の通用貨幣として定め、宣言」しているのに対し、ウッドの特許状では、ただ「それを受け取る意思のある者に発行する権限」が与えられているだけだと、主張されています。「報告」の著者たちは、国王が特許状によって何であれ通用貨幣と宣言することは法律上できる、とまでは述べていないと思います。断言しますが、そのようには述べないでしょう。そして、ノックスの特許状に法に反する権限が含まれていたのなら、なぜ陛下の正しく慈悲深い治世に、その特許状を先例として持ち出すのでしょうか。[10] しかし、その条項はウッドの特許状にないとしても、同じくらい合法性の疑わしい条項が、ほかにあるかもしれません。とりわけ、「ウィリアム・ウッドに、自分の貨幣をまねて作ったものを捜索するために家屋へ押し入る権限を与える」という条項です。これは違法であり、臣民の自由を危うくするものだと、言ってよいかもしれません。それでも、これも同じ権限を認めたノックスの特許状から取った先例なのです。先例というものが、ときにどのように使われるかを示す、顕著な実例です。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-010-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Knox's patent, as Monck Mason points out, did not contain the right to have his coins pass as the current coin of the realm; that was permitted by a proclamation of the lord lieutenant, and could in the same manner be withdrawn. Knox's patent differed materially from that granted to Wood, since he was obliged to take back his coins and give gold or silver for them, and no one was compelled to take more than five shillings in the payment of each £100. See note, p. 66. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[307]"
    "line_start": 3519
    "source_sequence": 356
  "translation_ja": "モンク・メイソンの指摘するように、ノックスの特許状には、自分の貨幣を王国の通用貨幣とする権利は含まれていなかった。それは総督の布告で許され、同じ方法で取り消すこともできた。ノックスは自分の貨幣を引き取り、その代わりに金貨または銀貨を渡す義務があり、また、百ポンドの支払いごとに五シリングを超えて受け取ることを強制される者はなかったので、その特許状は、ウッドに与えられたものとは本質的に異なる。六六頁の注を参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-033"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But although before the passing of this patent, it was not thought necessary to consult any persons of this kingdom, or make the least enquiry whether copper money were wanted among us; yet now at length, when the matter is over, when the patent hath long passed, when Wood hath already coined seventeen thousand pounds, and hath his tools and implements prepared to coin six times as much more; the Committee hath been pleased to make this affair the subject of enquiry. Wood is permitted to produce his evidences, which consist as I have already observed, of four in number, whereof Coleby, Brown and Mr. Finley the banker are three. And these were to prove that copper money was extremely wanted in Ireland. The first had been out of the kingdom almost twenty years, from the time that he was tried for robbing the treasury, and therefore his knowledge and credibility are equal. The second may be allowed a more knowing witness, because I think it is not above a year since the House of Commons ordered the Attorney-general to prosecute him, for endeavouring \"to take away the life of John Bingham Esq; member of parliaments by perjury and subornation.\" He asserted that he was forced to tally with his labourers for want of small money (which hath often been practised in England by Sir Ambrose Crawley[11] and others) but those who knew him better give a different reason, (if there be any truth at all in the fact) that he was forced to tally with his labourers not for want of halfpence, but of more substantial money, which is highly possible, because the race of suborners, forgers, perjurers and ravishers, are usually people of no fortune, or of those who have run it out by their vices and profuseness. Mr. Finley the third witness honestly confessed, that he was ignorant whether Ireland wanted copper money or no; but all his intention was to buy a certain quantity from Wood at a large discount, and sell them as well as he could, by which he hoped to get two or three thousand pounds for himself."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"

- "id": "dl-l05-006"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "My Lord, I desire you will consider me as a member who comes in at the latter end of a debate; or as a lawyer who speaks to a cause, when the matter hath been almost exhausted by those who spoke before."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[516]"
    "line_start": 5753
    "source_sequence": 596
  "translation_ja": "閣下、どうか私を、討論も終わりに近づいたころに入ってきた議員、あるいは先に弁じた人々によって論点がほとんど語り尽くされたところで、事件について弁論する弁護士のような者とお考えください。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-note-005-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Alan Brodrick, Lord Midleton (1660?-1728), came of a Surrey family that had greatly benefited by the forfeitures in Ireland. Adopting the profession of the law, Brodrick was, in 1695, appointed Solicitor-General for Ireland. He sat in the Irish House of Commons as the member for Cork, and in 1703 was chosen its Speaker. His strong opposition to the Sacramental Test Act lost him the favour of the government, and he was removed from his office of Solicitor-General. In 1707, however, he was appointed Attorney-General for Ireland, and in 1714 made Lord Chancellor. In the year following he was created Baron Brodrick of Midleton. His trimming with Walpole and Carteret did not, however, prevent him from opposing the Wood's patent, though he signed the proclamation against the Drapier. He thought the letters served to \"create jealousies between the King and the people of Ireland.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[517]"
    "line_start": 5758
    "source_sequence": 597
  "translation_ja": "アラン・ブロドリック、ミドルトン卿（一六六〇？―一七二八）は、アイルランドの没収地によって大きな利益を得たサリーの一族の出であった。法律家となり、一六九五年にアイルランドの法務次官に任命された。コーク選出のアイルランド庶民院議員を務め、一七〇三年には議長に選ばれた。聖餐による資格審査を定めた法律に強硬に反対したため、政府の信任を失い、法務次官を解任された。しかし一七〇七年には法務長官に任命され、一七一四年には大法官となった。翌年、ミドルトンのブロドリック男爵に叙された。ウォルポールとカータレットの間で日和見の立場を取っていたが、それでもウッドの特許状には反対した。ただしドレイピアに対する布告には署名した。この書簡が「国王とアイルランド人民の間に不信を生む」役割を果たしていると考えていた。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-007"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I remember some months ago I was at your house upon a commission, where I am one of the governors: But I went thither not so much on account of the commission, as to ask you some questions concerning Mr. Wood's patent to coin halfpence for Ireland; where you very freely told me, in a mixed company, how much you had been always against that wicked project, which raised in me an esteem for you so far, that I went in a few days to make you a visit, after many years' intermission. I am likewise told, that your son wrote two letters from London, (one of which I have seen) empowering those to whom they were directed, to assure his friends, that whereas there was a malicious report spread of his engaging himself to Mr. Walpole for forty thousand pounds of Wood's coin, to be received in Ireland, the said report was false and groundless; and he had never discoursed with that minister on the subject; nor would ever give his consent to have one farthing of the said coin current here. And although it be long since I have given myself the trouble of conversing with people of titles or stations; yet I have been told by those who can take up with such amusements, that there is not a considerable person of the kingdom, scrupulous in any sort to declare his opinion. But all this is needless to allege, when we consider, that the ruinous consequences of Wood's patent, have been so strongly represented by both Houses of Parliament; by the Privy-council; the Lord Mayor and Aldermen of Dublin; by so many corporations; and the concurrence of the principal gentlemen in most counties, at their quarter-sessions, without any regard to party, religion, or nation."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[518]"
    "line_start": 5773
    "source_sequence": 598
  "translation_ja": "数か月前、私も管理委員の一人を務める委員会の用件で、閣下のお宅に伺ったことを覚えています。しかし伺った主な目的は委員会のことよりも、アイルランド向けの半ペニー銅貨を鋳造するウッド氏の特許状について、いくつかお尋ねすることでした。その折、閣下は居合わせたさまざまな人々の前で、あの邪悪な計画にずっと強く反対してこられたと、たいへん率直に話してくださいました。それで私は閣下への敬意を深め、何年もご無沙汰していたのに、数日後にはご機嫌伺いに参りました。また、ご子息がロンドンから二通の手紙を送られたとも伺いました。その一通は私も読みました。ご子息がウォルポール氏に、ウッドの貨幣四万ポンドをアイルランドで受け入れると約束した、という悪意ある噂が流れているが、それは虚偽で根拠がなく、ご子息はこの件についてあの大臣と話したことすらなく、この国であの貨幣を一ファージングでも通用させることに決して同意しない――手紙は宛先の人々に、友人たちへそう保証する権限を与えるものでした。爵位や地位のある人々と話す面倒は久しく避けてきた私ですが、そういう楽しみで満足できる人々から聞くところでは、この国の有力者には、この件についての意見を公言するのを少しでもためらう者は一人もいないそうです。もっとも、議会の両院、枢密院、ダブリンの市長と市参事会員、数多くの自治団体、そして大多数の州で四季裁判の席に集まる主だった紳士たちが、党派、宗教、出身国の違いを問わず一致して、ウッドの特許状がもたらす破滅的な結果をきわめて強く訴えていることを考えれば、こうした話を持ち出すまでもありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-008"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I conclude from hence, that the currency of these halfpence would, in the universal opinion of our people, be utterly destructive to this kingdom; and consequently, that it is every man's duty, not only to refuse this coin himself, but as far as in him lies, to persuade others to do the like: And whether this be done in private or in print, is all a case: As no layman is forbid to write, or to discourse upon religious or moral subjects; although he may not do it in a pulpit (at least in our church). Neither is this an affair of state, until authority shall think fit to declare it so: Or if you should understand it in that sense; yet you will please to consider that I am not now a preaching."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[519]"
    "line_start": 5799
    "source_sequence": 599
  "translation_ja": "ここから私は、この半ペニー銅貨の流通は、この国の人々が一致して考えているとおり、王国を完全に破滅させるものであり、したがって誰もが、自分でこの貨幣を拒むばかりでなく、できるかぎり他人にも同じようにするよう勧める義務を負う、と結論します。それを私的に行おうと、印刷物で行おうと、事情は変わりません。平信徒が宗教や道徳の問題について著述したり語ったりすることは禁じられていないのと同じです。もっとも、少なくとも私たちの教会では、説教壇からそうすることは許されませんが。また、権力者がこれを国政上の問題と宣言するまでは、国政上の問題でもありません。仮に閣下がそういう意味にお取りになったとしても、私が今説教をしているわけではないことは、お考えいただきたいのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-009"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Therefore, I do think it my duty, since the Drapier will probably be no more heard of, so far to supply his place, as not to incur his fortune: For I have learnt from old experience, that there are times wherein a man ought to be cautious as well as innocent. I therefore hope, that preserving both those characters, I may be allowed, by offering new arguments or enforcing old ones, to refresh the memory of my fellow-subjects, and keep up that good spirit raised among them; to preserve themselves from utter ruin by lawful means, and such as are permitted by his Majesty."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[520]"
    "line_start": 5811
    "source_sequence": 600
  "translation_ja": "そこで私は、今後ドレイピアの声を聞くことはおそらくなくなる以上、その身に降りかかった災難までは招かない範囲で、彼の役を補うのが自分の義務だと思います。長年の経験から、人は潔白であるとともに慎重でもなければならない時期がある、と学んだからです。ですから、この二つを守るかぎりは、新しい論拠を示し、古い論拠を補強することによって、同胞たる臣民の記憶を呼び覚まし、その間に生まれた立派な気概を保たせることを、お許しいただきたいと思います。合法的で、陛下がお認めになっている手段によって、完全な破滅から身を守るためなのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-010"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I believe you will please to allow me two propositions: First, that we are a most loyal people; and, Secondly, that we are a free people, in the common acceptation of that word applied to a subject under a limited monarch. I know very well, that you and I did many years ago in discourse differ much, in the presence of Lord Wharton, about the meaning of that word liberty, with relation to Ireland. But if you will not allow us to be a free people, there is only another appellation left; which, I doubt, my Lord Chief Justice Whitshed would call me to an account for, if I venture to bestow: For, I observed, and I shall never forget upon what occasion, the device upon his coach to be Libertas et natale solum; at the very point of time when he was sitting in his court, and perjuring himself to betray both.[6]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[521]"
    "line_start": 5822
    "source_sequence": 601
  "translation_ja": "閣下には次の二つの命題をお認めいただけると信じます。第一に、私たちはきわめて忠実な民であること。第二に、私たちは自由な民であること。後者は、権力に制限のある君主の下の臣民についていう場合の、通常の意味での自由です。何年も前、ウォートン卿の面前で閣下と私が話した際、アイルランドに関してこの自由という語をどう解するかについて、大いに意見が食い違ったことは、よく覚えています。しかし、私たちが自由な民であるとお認めにならないなら、残る呼び名はただ一つです。それを口にする勇気を私が出したなら、首席裁判官ホイットシェッド卿から責任を問われるのではないかと思います。というのも、あの方の馬車に掲げられた標語が Libertas et natale solum、すなわち「自由と生まれ故郷」であるのを、私は見たからです。どういう折に見たのかも、決して忘れません。まさしくあの方が法廷の席につき、偽誓を行い、この両方を裏切っていた、そのときでした。[6]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-note-006-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "On this motto of Whitshed's Swift wrote the following poetical paraphrase:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[522]"
    "line_start": 5836
    "source_sequence": 602
  "translation_ja": "ホイットシェッドのこの標語について、スウィフトは次のように詩で言い換えている。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-note-006-002"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": |-
    "Libertas et natale solum:
                   Fine words! I wonder where you stole 'em.
                   Could nothing but thy chief reproach
                   Serve for a motto on thy coach?
                   But let me now thy words translate:
                   Natale solum, my estate;
                   My dear estate, how well I love it,
                   My tenants, if you doubt, will prove it,
                   They swear I am so kind and good,
                   I hug them till I squeeze their blood.
                     Libertas bears a large import:
                   First, how to swagger in a court;
                   And, secondly, to shew my fury
                   Against an uncomplying jury;
                   And, thirdly, 'tis a new invention,
                   To favour Wood, and keep my pension;
                   And, fourthly, 'tis to play an odd trick,
                   Get the great seal and turn out Broderick;
                   And, fifthly, (you know whom I mean,)
                   To humble that vexatious Dean:
                   And, sixthly, for my soul to barter it
                   For fifty times its worth to Carteret.
                   Now since your motto thus you construe,
                   I must confess you've spoken once true.
                   Libertas et natale solum.
                   You had good reason when you stole 'em."

                   [T.S.]
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/pre[10]"
    "line_start": 5840
    "source_sequence": 603
  "translation_ja": |-
    「Libertas et natale solum――自由と生まれ故郷。
    ご立派な言葉だ！　どこから盗んできたのやら。
    お前の一番の恥を示すものしか、
    馬車の標語には使えなかったのか。
    では今、お前の言葉を訳してやろう。
    生まれ故郷とは、わが領地。
    愛しい領地、それをどれほど愛しているか、
    疑うなら、わが小作人たちが証明しよう。
    私が実に情け深く善良だと、彼らは誓う。
    抱き締めて血を搾り取るほどなのだから。
    自由には、広い意味がある。
    第一に、法廷で威張り散らすこと。
    第二に、言うことを聞かない陪審に
    激怒を浴びせること。
    第三に、新案を工夫して、
    ウッドを助け、わが年金を守ること。
    第四に、風変わりな一手を打ち、
    国璽を手にしてブロドリックを追い出すこと。
    第五に、誰のことかわかるだろうが、
    あの厄介な首席司祭をへこませること。
    第六に、わが魂を、
    その値打ちの五十倍でカータレットに売ること。
    さて、お前が標語をそう解するのなら、
    一度は本当のことを言ったと認めねばなるまい。
    自由と生まれ故郷。
    盗み取ったのには、もっともなわけがあったのだな。」

    [T.S.]
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "verse_in_editor_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-011"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now, as for our loyalty, to His present Majesty; if it hath ever been equalled in any other part of his dominions; I am sure it hath never been exceeded: And I am confident he hath not a minister in England who could ever call it once in question: But that some hard rumours at least have been transmitted from t'other side the water, I suppose you will not doubt: and rumours of the severest kind; which many good people have imputed to the indirect proceeding of Mr. Wood and his emissaries; as if he endeavoured it should be thought that our loyalty depended upon the test of refusing or taking his copper. Now, as I am sure you will admit us to be a loyal people; so you will think it pardonable in us to hope for all proper marks of favour and protection from so gracious a King, that a loyal and free people can expect: Among which, we all agree in reckoning this to be one; that Wood's halfpence may never have entrance into this kingdom. And this we shall continue to wish, when we dare no longer express our wishes; although there were no such mortal as a Drapier in the world."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[523]"
    "line_start": 5870
    "source_sequence": 604
  "translation_ja": "さて、現在の陛下に対する私たちの忠誠ですが、その御領土のほかの地方に、これと同等の忠誠があったとしても、これを超えたものはなかったと断言できます。また、これを一度でも疑い得た大臣が、イングランドに一人でもおられるとは思いません。しかし少なくとも、海の向こうから厳しい噂が伝えられてきたことは、閣下もお疑いにならないでしょう。それもきわめて過酷な噂です。多くの善良な人々は、これをウッド氏とその手先たちの曲がったやり方のせいだと考えています。まるで彼が、自分の銅貨を拒むか受け取るかという試験次第で、私たちの忠誠が決まるかのように、思わせようとしているというわけです。閣下が私たちを忠実な民とお認めになることは確かですから、これほど慈悲深い国王から、忠実で自由な民の期待し得る、しかるべき恩恵と保護のしるしをことごとく望むとしても、お許しいただけると思います。その一つとして私たち皆が一致して数えるのは、ウッドの半ペニー銅貨を、この王国へ決して入り込ませないことです。この願いを口にすることすら、もはやできなくなったときにも、私たちは願い続けるでしょう。たとえドレイピアという人間が、この世に一人もいなかったとしても。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-012"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am heartily sorry, that any writer should, in a cause so generally approved, give occasion to the government and council to charge him with paragraphs \"highly reflecting upon His Majesty and his ministers; tending to alienate the affections of his good subjects in England and Ireland from each other; and to promote sedition among the people.\"[7] I must confess, that with many others, I thought he meant well; although he might have the failing of better writers, to be not always fortunate in the manner of expressing himself."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[524]"
    "line_start": 5888
    "source_sequence": 605
  "translation_ja": "誰であれ、これほど広く支持されている大義を論じる筆者が、政府と枢密院に、彼の文章を「陛下とその大臣をはなはだしく誹謗し、イングランドとアイルランドにおける善良な臣民の心を互いに引き離し、人民の間に扇動を広めようとする」段落であると非難する機会を与えたのは、心から残念です。[7]私もほかの多くの人と同じく、あの人の意図は善良だと思っていたことを認めます。もっと優れた筆者にもある欠点、つまり表現の仕方がいつも適切とは限らないという欠点は、あったかもしれませんが。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-note-007-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Swift here quotes the words of the proclamation issued against the fourth Drapier's Letter. See Appendix IV. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[525]"
    "line_start": 5898
    "source_sequence": 606
  "translation_ja": "ここでスウィフトは、ドレイピアの第四書簡に対して出された布告の文言を引用している。付録第四参照。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-013"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "However, since the Drapier is but one man, I shall think I do a public service, by asserting that the rest of my countrymen are wholly free from learning out of his pamphlets to reflect on the King or his ministers, to breed sedition."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[526]"
    "line_start": 5902
    "source_sequence": 607
  "translation_ja": "しかし、ドレイピアはたった一人の人間なのですから、ほかの同胞たちは、その小冊子から国王や大臣を誹謗し、扇動を生むようなことを学んだわけでは決してない、と断言すれば、私は公共への奉仕をしたことになるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-014"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I solemnly declare, that I never once heard the least reflection cast upon the King, on the subject of Mr. Wood's coin: For in many discourses on this matter, I do not remember His Majesty's name to be so much as mentioned. As to the ministry in England, the only two persons hinted at were the Duke of Grafton, and Mr. Walpole:[8] The former, as I have heard you and a hundred others affirm, declared, that he never saw the patent in favour of Mr. Wood, before it was passed, although he were then lord lieutenant: And therefore I suppose everybody believes, that his grace hath been wholly unconcerned in it since."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[527]"
    "line_start": 5908
    "source_sequence": 608
  "translation_ja": "私は厳粛に申し上げます。ウッド氏の貨幣に関して、国王を少しでも誹謗する言葉を、一度として聞いたことはありません。この問題についての数々の会話でも、陛下のお名前が口にされたことすら、覚えがありません。イングランドの大臣については、ほのめかされたのはグラフトン公爵とウォルポール氏の二人だけです。[8]前者は、閣下やほかの百人もの方が確言されるのを聞いたところでは、当時総督であったにもかかわらず、ウッド氏を利する特許状が通過するまでは、それを見たこともなかったと明言されました。ですから、公爵閣下がその後もこれにまったく関与しておられないことは、誰もが信じていると思います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-note-008-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Walpole was created a Knight of the Bath in 1724, when that order was revived. In 1726 he was installed Knight of the Order of the Garter, being the only commoner who had been so distinguished since the reign of James I., except Admiral Montague, afterwards Earl of Sandwich. He had been offered a peerage in 1723, but declined it for himself, accepting it for his son, who was created Baron Walpole of Walpole, in Norfolk. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[528]"
    "line_start": 5919
    "source_sequence": 609
  "translation_ja": "ウォルポールは、一七二四年、バス勲章の再興に際して同勲章の騎士となった。一七二六年にはガーター勲章の騎士となったが、ジェームズ一世の治世以来、この栄誉にあずかった平民は、後にサンドウィッチ伯爵となるモンタギュー提督を除けば、彼だけであった。一七二三年には爵位を勧められたが、自分のためには辞退し、息子のために受け入れた。息子はノーフォークのウォルポールのウォルポール男爵に叙された。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-015"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Mr. Walpole was indeed supposed to be understood by the letter W. in several newspapers; where it is said, that some expressions fell from him not very favourable to the people of Ireland; for the truth of which, the kingdom is not to answer, any more than for the discretion of the publishers. You observe, the Drapier wholly clears Mr. Walpole of this charge, by very strong arguments and speaks of him with civility. I cannot deny myself to have been often present, where the company gave then opinion, that Mr. Walpole favoured Mr. Wood's project, which I always contradicted; and for my own part, never once opened my lips against that minister, either in mixed or particular meetings: And my reason for this reservedness was, because it pleased him, in the Queen's time (I mean Queen Anne of ever blessed memory) to make a speech directly against me, by name, in the House of Commons, as I was told a very few minutes after, in the Court of Requests, by more than fifty members."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[529]"
    "line_start": 5928
    "source_sequence": 610
  "translation_ja": "確かに、いくつかの新聞に出たWという頭文字は、ウォルポール氏を指すものと考えられました。それらには、あの方がアイルランドの人々にあまり好意的でない言葉を漏らした、と書かれています。しかし、その真偽について王国が責任を負う必要はありません。それを公にした人々の分別について、責任を負わないのと同じです。ご承知のとおり、ドレイピアはきわめて有力な論拠によって、ウォルポール氏をこの嫌疑から完全に解き、礼儀正しく論じています。同席した人々がウォルポール氏はウッド氏の計画をひいきしていると意見を述べる場に、私がたびたび居合わせたことは否定しません。しかし私はいつも、それに反論しました。自分自身のことをいえば、多人数の集まりでも内輪の集まりでも、あの大臣を攻撃するために、一度も口を開いたことはありません。この慎重さには理由があります。女王の御代に――いつまでも祝福されるべきアン女王のことです――あの方は庶民院で、わざわざ私を名指して、真っ向から攻撃する演説をなさったからです。そのわずか数分後、請願の間で五十人以上の議員から、私はそう聞かされました。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-016"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But you, who are in a great station here, (if anything here may be called great) cannot be ignorant, that whoever is understood by public voice to be chief minister, will, among the general talkers, share the blame, whether justly or no, of every thing that is disliked; which I could easily make appear in many instances, from my own knowledge, while I was in the world; and particularly in the case of the greatest, the wisest, and the most uncorrupt minister, I ever conversed with.[9]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[530]"
    "line_start": 5944
    "source_sequence": 611
  "translation_ja": "しかし、この地で高い地位にある閣下なら――この地の何かを高いと呼べるのであればですが――、世間の声によって首席大臣と見なされている者は、一般の噂好きの間では、不評なことが何か起これば、正当かどうかにかかわらず、その非難の一部を浴びるものだと、ご存じないはずはありません。私が世間に出ていたころの経験から、多くの実例を挙げて、これは容易に示せます。とりわけ、私がかつて交際した中で最も偉大で、最も賢明で、最も清廉な大臣の場合がそうでした。[9]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-note-009-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Robert Harley, Earl of Oxford. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[531]"
    "line_start": 5953
    "source_sequence": 612
  "translation_ja": "ロバート・ハーリー、オックスフォード伯爵。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-017"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But, whatever unpleasing opinion some people might conceive of Mr. Walpole, on account of those halfpence; I dare boldly affirm, it was entirely owing to Mr. Wood. Many persons of credit, come from England, have affirmed to me, and others, that they have seen letters under his hand, full of arrogance and insolence towards Ireland; and boasting of his favour with Mr. Walpole; which is highly probable: Because he reasonably thought it for his interest to spread such a report; and because it is the known talent of low and little spirits, to have a great man's name perpetually in their mouths.[10]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[532]"
    "line_start": 5956
    "source_sequence": 613
  "translation_ja": "しかし、あの半ペニー銅貨の件で、ウォルポール氏について人々がどのような悪い意見を抱いたにせよ、それはひとえにウッド氏のせいであったと、私ははっきり断言します。イングランドから来た信用ある多くの人々が、私やほかの人たちに、彼の自筆の手紙を見たと語っています。それらはアイルランドに対する尊大さと無礼に満ち、ウォルポール氏の寵愛を受けていると自慢するものでした。これは十分ありそうなことです。そんな話を広めれば自分の利益になると、彼が考えたのももっともだからです。また、偉い人の名を絶えず口にするのは、卑しく小さな心の持ち主におなじみの芸当だからです。[10]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-note-010-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "See Coxe's \"Memoirs of Walpole\" (vol. i., cap. 26, p. 389, ed. 1800), where Wood is blamed for his indiscretion on this matter. See also note prefixed to the Drapier's First Letter in the present edition. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[533]"
    "line_start": 5967
    "source_sequence": 614
  "translation_ja": "コックス『ウォルポール回想録』第一巻第二十六章、三八九頁、一八〇〇年版参照。この件でウッドの無分別が非難されている。本版のドレイピア第一書簡の前に置いた解説も参照。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-018"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thus I have sufficiently justified the people of Ireland, from learning any bad lessons out of the Drapier's pamphlets, with regard to His Majesty and his ministers: And, therefore, if those papers were intended to sow sedition among us, God be thanked, the seeds have fallen upon a very improper soil."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[534]"
    "line_start": 5973
    "source_sequence": 615
  "translation_ja": "こうして私は、アイルランドの人々が陛下とその大臣に関し、ドレイピアの小冊子から悪い教えを何か学んだという疑いを、十分に晴らしました。ですから、あの文書が私たちの間に扇動の種をまく意図で書かれたのだとしても、ありがたいことに、その種はひどく不向きな土地に落ちたのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-019"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As to alienating the affections of the people of England and Ireland from each other; I believe, the Drapier, whatever his intentions were, hath left that matter just as he found it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[535]"
    "line_start": 5980
    "source_sequence": 616
  "translation_ja": "イングランドとアイルランドの人々の心を互いに引き離すという点については、ドレイピアの意図が何であったにせよ、もともとあった状態を少しも変えなかったと思います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-020"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have lived long in both kingdoms, as well in country as in town; and therefore, take myself to be as well informed as most men, in the dispositions of each people toward the other. By the people, I understand here, only the bulk of the common people; and I desire no lawyer may distort or extend my meaning."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[536]"
    "line_start": 5985
    "source_sequence": 617
  "translation_ja": "私は両王国の田舎にも町にも長く暮らしました。したがって、両国の人々が相手に対してどのような気持ちを抱いているかについては、たいていの人に劣らず心得ているつもりです。ここで人々というのは、一般庶民の大多数だけを指します。法律家がこの意味をねじ曲げたり、広げたりしないよう願います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-021"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is a vein of industry and parsimony, that runs through the whole people of England; which, added to the easiness of their rents, makes them rich and sturdy. As to Ireland, they know little more than they do of Mexico; further than that it is a country subject to the King of England, full of bogs, inhabited by wild Irish Papists; who are kept in awe by mercenary troops sent from thence: And their general opinion is, that it were better for England if this whole island were sunk into the sea; for, they have a tradition, that every forty years there must be a rebellion in Ireland. I have seen the grossest suppositions pass upon them; \"that the wild Irish were taken in toils; but that, in some time, they would grow so tame, as to eat out of your hands:\" I have been asked by hundreds, and particularly by my neighbours, your tenants, at Pepper-harrow; \"whether I had come from Ireland by sea:\" And, upon the arrival of an Irishman to a country town, I have known crowds coming about him, and wondering to see him look so much better than themselves."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[537]"
    "line_start": 5992
    "source_sequence": 618
  "translation_ja": "イングランドの人々には全体を通じて、勤勉と倹約の気風があります。それに地代の安さが加わって、豊かで頑健になるのです。アイルランドについては、メキシコについて知っているより、少し多く知っている程度です。イングランド王に従属する国で、沼地だらけで、野蛮なアイルランド人の教皇主義者が住み、イングランドから送られた傭兵に威圧されている、というくらいのことしか知りません。この島が丸ごと海に沈んでしまえば、イングランドにはそのほうがよい、というのが大方の意見です。アイルランドでは四十年ごとに必ず反乱が起こる、という言い伝えがあるからです。私はこの人々が、途方もなく荒唐無稽な話を信じ込むのを見ました。「野生のアイルランド人は網で捕まえられるが、しばらくすれば手から餌を食べるほどおとなしくなる」というのです。何百人もの人、とりわけペッパーハローにいる私の隣人、つまり閣下の小作人たちからは、「アイルランドから海路で来たのか」と尋ねられました。地方の町にアイルランド人が一人やって来ると、人だかりがその周りに集まり、自分たちよりずっと立派な姿をしているのに驚くのを、見たこともあります。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-022"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A gentleman now in Dublin, affirms, \"that passing some months ago through Northampton, and finding the whole town in a flurry, with bells, bonfires, and illuminations, upon asking the cause, was told, it was for joy, that the Irish had submitted to receive Wood's halfpence.\" This, I think, plainly shews what sentiments that large town hath of us; and how little they made it their own case; although they be directly in our way to London, and therefore, cannot but be frequently convinced that we have human shapes."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[538]"
    "line_start": 6009
    "source_sequence": 619
  "translation_ja": "今ダブリンにいるある紳士は、こう語っています。「数か月前にノーサンプトンを通りかかったところ、町じゅうが鐘を鳴らし、かがり火と灯飾りをともして浮き立っていた。理由を尋ねると、アイルランド人が服従し、ウッドの半ペニー銅貨を受け入れたので喜んでいるのだ、と言われた」。これは、あの大きな町が私たちについてどう思っているか、また、いかに他人事としか考えていないかを、はっきり示していると思います。ロンドンへ向かう私たちの通り道にある町なのですから、私たちが人間の形をしていることを、しょっちゅう確かめずにはいられないはずなのに。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-023"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As to the people of this kingdom, they consist either of Irish Papists; who are as inconsiderable, in point of power, as the women and children; or of English Protestants, who love their brethren of that kingdom; although they may possibly sometimes complain, when they think they are hardly used: However, I confess, I do not see any great consequence, how their personal affections stand to each other, while the sea divides them, and while they continue in their loyalty to the same prince. And yet, I will appeal to you; whether those from England have reason to complain, when they come hither in pursuit of their fortunes? Or, whether the people of Ireland have reason to boast, when they go to England on the same design?"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[539]"
    "line_start": 6019
    "source_sequence": 620
  "translation_ja": "一方、この王国の人々は、アイルランド人の教皇主義者か、イングランド系のプロテスタントから成っています。前者の力は、女性や子どもたちと同様、取るに足りません。後者はあの王国の同胞を愛しています。もっとも、不当に扱われていると思えば、ときには不平を言うこともあるでしょう。しかし、海が二つの国を隔て、同じ君主への忠誠を保っているかぎり、互いの個人的な感情がどうであろうと、大した意味があるとは、私には思えません。それでも閣下にお尋ねしたいのです。イングランドから財を求めてこちらへやって来る者たちには、不平を言う理由があるでしょうか。あるいは、同じ目的でイングランドへ行くアイルランドの人々には、自慢する理由があるでしょうか。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-024"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "My second proposition was, that we of Ireland are a free people: This, I suppose, you will allow; at least, with certain limitations remaining in your own breast. However, I am sure it is not criminal to affirm; because the words \"liberty\" and \"property,\" as applied to the subject, are often mentioned in both houses of Parliament, as well as in yours, and other courts below; from whence it must follow, that the people of Ireland do, or ought to enjoy all the benefits of the common and statute law; such as to be tried by juries, to pay no money without their own consent, as represented in Parliament; and the like. If this be so, and if it be universally agreed, that a free people cannot, by law, be compelled to take any money in payment, except gold and silver; I do not see why any man should be hindered from cautioning his countrymen against this coin of William Wood; who is endeavouring by fraud to rob us of that property, which the laws have secured. If I am mistaken, and that this copper can be obtruded on us; I would put the Drapier's case in another light, by supposing, that a person going into his shop, should agree for thirty shillings' worth of goods, and force the seller to take his payment in a parcel of copper pieces, intrinsically not worth above a crown: I desire to know, whether the Drapier would not be actually robbed of five and twenty shillings, and how far he could be said to be master of his property? The same question may be applied to rents and debts, on bond or mortgage, and to all kind of commerce whatsoever."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[540]"
    "line_start": 6032
    "source_sequence": 621
  "translation_ja": "私の第二の命題は、アイルランドの私たちは自由な民である、ということでした。閣下もこれはお認めになると思います。少なくとも、胸の内に一定の留保を残してなら。しかし、そう述べることが罪にならないのは確かです。臣民について「自由」や「財産」という言葉は、議会両院でも、閣下の法廷やその下の法廷でも、しばしば口にされるからです。そこから、アイルランドの人々はコモン・ローと制定法によるあらゆる利益を享受している、あるいは享受すべきだ、ということが導かれるはずです。たとえば、陪審による裁判を受けること、議会に代表を送る自分たち自身の同意なしには金銭を支払わないこと、などです。そうであり、また自由な民は金銀以外の貨幣を支払いとして受け取るよう、法律で強制されることはないと、誰もが認めるのなら、法律によって守られた私たちの財産を詐欺で奪おうとする、このウィリアム・ウッドの貨幣に用心するよう、同胞に呼びかけるのを、なぜ誰かが妨げられるのか、私にはわかりません。私が間違っていて、この銅貨を押しつけることができるのであれば、別の角度からドレイピアの場合を考えてみましょう。誰かが彼の店に入り、三十シリング分の商品を買う約束をし、実質的な価値は一クラウンを超えない銅片の束を、その代金として売り手に強いて受け取らせた、と仮定します。そこでお尋ねしたいのです。ドレイピアは実際に二十五シリングを奪われたことにならないでしょうか。また、その財産を自分で支配していると、どこまで言えるでしょうか。同じ問いは、地代にも、証文や抵当による債務にも、あらゆる種類の取引にも当てはまります。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-025"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Give me leave to do what the Drapier hath done more than once before me; which is, to relate the naked fact, as it stands in the view of the world."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[541]"
    "line_start": 6056
    "source_sequence": 622
  "translation_ja": "ドレイピアが私より先に、すでに何度もしていることを、私にもさせてください。世間の目の前にあるとおりの、ありのままの事実を述べることです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-026"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "One William Wood, Esq; and hardware-man, obtains, by fraud, a patent in England, to coin 108,000l. in copper, to pass in Ireland, leaving us liberty to take, or to refuse. The people here, in all sorts of bodies and representatives, do openly and heartily declare, that they will not accept this coin: To justify these declarations, they generally offer two reasons; first, because by the words of the patent, they are left to their own choice: And secondly, because they are not obliged by law: So that here you see there is, bellum atgue virum, a kingdom on one side, and William Wood on the other. And if Mr. Wood gets the victory, at the expense of Ireland's ruin, and the profit of one or two hundred thousand pounds (I mean by continuing, and counterfeiting as long as he lives) for himself; I doubt, both present and future ages will, at least, think it a very singular scheme."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[542]"
    "line_start": 6060
    "source_sequence": 623
  "translation_ja": "ウィリアム・ウッドなる、紳士を名乗る金物商が、イングランドで詐欺によって特許状を手に入れ、アイルランドで通用させるための銅貨を十万八千ポンド分鋳造することになりました。私たちには、受け取るか拒むかの自由が残されています。こちらの人々は、あらゆる種類の団体や代表を通じて、この貨幣を受け取らないと、公然と、心から宣言しています。その宣言の正当な理由として、おおむね二つが挙げられます。第一に、特許状の文言によれば、自分たちの選択に任されていること。第二に、法律上の義務がないことです。ですから、ご覧のとおり、これは bellum atgue virum、戦いと一人の男、一方に王国、他方にウィリアム・ウッド、という構図なのです。そしてウッド氏が、アイルランドの破滅を犠牲にし、自分には十万あるいは二十万ポンドの利益を得て勝利するのだとすれば――生きているかぎり鋳造を続け、偽造もし続けるという意味です――、現代も後世も、少なくともこれは非常に風変わりな企てだと思うのではないでしょうか。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-027"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If this fact be truly stated; I must confess, I look upon it as my duty, so far as God hath enabled me, and as long as I keep within the bounds of truth, of duty, and of decency, to warn my fellow-subjects, as they value their King, their country, and all that ought or can be dear to them, never to admit this pernicious coin; no not so much as one single halfpenny. For, if one single thief forces the door, it is in vain to talk of keeping out the whole crew behind."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[543]"
    "line_start": 6075
    "source_sequence": 624
  "translation_ja": "この事実の述べ方が正しいのであれば、神が私に授けてくださった能力の及ぶかぎり、また真実と義務と礼節の範囲を守っているかぎり、同胞たる臣民に警告するのが私の義務だと、私は考えます。国王と祖国、また大切にすべき、あるいは大切にし得る一切を重んじるなら、この有害な貨幣を決して受け入れないこと、ただの半ペニー一枚でも受け入れないことです。たった一人の盗賊に戸を破られてしまえば、後ろに控える一味を全員締め出すと話しても、無駄だからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-028"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And, while I shall be thus employed, I will never give myself leave to suppose, that what I say can either offend my Lord Lieutenant; whose person and great qualities I have always highly respected; (as I am sure his excellency will be my witness) or the ministers in England, with whom I have nothing to do, or they with me; much less the Privy-council here, who, as I am informed, did send an address to His Majesty against Mr. Wood's coin; which, if it be a mistake, I desire I may not be accused for a spreader of false news: But, I confess, I am so great a stranger to affairs, that for anything I know, the whole body of the council may since have been changed: And, although I observed some of the very same names in a late declaration against that coin, which I saw subscribed to the proclamation against the Drapier; yet possibly they may be different persons; for they are utterly unknown to me, and are like to continue so."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[544]"
    "line_start": 6084
    "source_sequence": 625
  "translation_ja": "こうした仕事をしている間、私の発言が総督閣下のお気に障るなどとは、決して考えないことにします。あの方ご自身とその優れた資質を、私はいつも深く尊敬してきましたから。閣下もきっと、その証人になってくださるはずです。また、イングランドの大臣たちのお気に障るとも思いません。私とは互いに何の関わりもない方々だからです。まして、この地の枢密院はなおさらです。聞くところでは、ウッド氏の貨幣に反対する上奏を陛下へ送ったのですから。もしこれが間違いでも、虚報を広めた者として非難されないことを願います。ただ、私は政務の事情にたいへん疎いので、ひょっとすると枢密院の顔ぶれは、その後すっかり入れ替わったのかもしれません。それに、この貨幣に反対する最近の声明に、ドレイピアに対する布告の署名で見たのとまったく同じ名がいくつかあったとはいえ、別人である可能性もあります。私にはまるで知らない方々ですし、今後もそうでありそうですから。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-029"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In this controversy, where the reasoners on each side are divided by St. George's Channel, His Majesty's prerogative, perhaps, would not have been mentioned; if Mr. Wood, and his advocates, had not made it necessary, by giving out, that the currency of his coin should be enforced by a proclamation. The traders and common people of the kingdom, were heartily willing to refuse this coin; but the fear of a proclamation brought along with it most dreadful apprehensions. It was therefore, absolutely necessary for the Drapier, to remove this difficulty; and accordingly, in one of his former pamphlets, he hath produced invincible arguments, (wherever he picked them up) that the King's prerogative was not at all concerned in the matter; since the law had sufficiently provided against any coin to be imposed upon the subject, except gold and silver; and that copper is not money, but as it hath been properly called nummorum famulus."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[545]"
    "line_start": 6099
    "source_sequence": 626
  "translation_ja": "セント・ジョージ海峡を挟んで双方の論者が分かれているこの争いで、陛下の大権が持ち出されることは、ウッド氏とその擁護者たちがそうせざるを得なくしなければ、おそらくなかったでしょう。彼らは、布告によって彼の貨幣の流通を強制するつもりだと言いふらしたのです。この王国の商人と一般の人々は、この貨幣を心底から拒むつもりでした。しかし布告への恐れが、この上なく恐ろしい不安をもたらしました。したがってドレイピアには、この難点を取り除くことが絶対に必要でした。そこで以前の小冊子の一つで、どこから拾い集めたものかは知りませんが、国王の大権はこの件にまったく関わらない、という反論しようのない論拠を挙げたのです。金銀以外の貨幣を臣民に押しつけることについては、法律が十分に防いでいるからです。また、銅は貨幣ではなく、適切に nummorum famulus、すなわち「貨幣の下僕」と呼ばれるものにすぎないからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-030"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The three former letters from the Drapier, having not received any public censure, I look upon them to be without exception; and that the good people of the kingdom ought to read them often, in order to keep up that spirit raised against this destructive coin of Mr. Wood: As for this last letter, against which a proclamation is issued; I shall only say, that I could wish it were stripped of all that can be any way exceptionable; which I would not think it below me to undertake, if my abilities were equal; but being naturally somewhat slow of comprehension; no lawyer, and apt to believe the best of those who profess good designs, without any visible motive either of profit or honour; I might pore for ever, without distinguishing the cockle from the corn."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[546]"
    "line_start": 6115
    "source_sequence": 627
  "translation_ja": "ドレイピアの先の三通は公の非難を受けていませんから、私は問題のないものだと考えています。この王国の善良な人々は、ウッド氏の破滅的な貨幣に反対して起こった気概を保つため、それらをたびたび読むべきでしょう。布告の出された最後の書簡については、どんな意味であれ非難の対象になり得る箇所を、すべて取り去れたらよいのに、ということだけ申します。私にそれだけの力があれば、その仕事を引き受けるのも、身分にふさわしくないとは思いません。しかし私は、生来いささか理解が遅いうえ、法律家でもなく、利益や名誉という目に見える動機もないのに善意を掲げる人々については、よいほうに信じがちです。いつまでも目を凝らして読んだところで、麦から毒麦を見分けられないかもしれません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-031"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "That which, I am told, gives greatest offence in this last letter, is where the Drapier affirms; \"that if a rebellion should prove so successful, as to fix the Pretender on the throne of England, he would venture so far to transgress the Irish statute, (which unites Ireland to England under one King) as to lose every drop of his blood, to hinder him from being King of Ireland.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[547]"
    "line_start": 6128
    "source_sequence": 628
  "translation_ja": "聞くところによると、この最後の書簡で最も不興を買っているのは、ドレイピアが次のように断言した箇所だそうです。「もし反乱が成功し、王位僭称者をイングランドの王座につけるまでになったとしても、私はアイルランドをイングランドと同じ一人の国王の下に結びつけるアイルランドの法律を、あえてそれほどまでに犯し、彼がアイルランドの国王となるのを阻むため、一滴残らず血を流すだろう」。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-032"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I shall not presume to vindicate any man, who openly declares he would transgress a statute; and a statute of such importance: But, with the most humble submission, and desire of pardon for a very innocent mistake, I should be apt to think that the loyal intention of the writer, might be at least some small extenuation of his crime. For, in this I confess myself to think with the Drapier."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[548]"
    "line_start": 6136
    "source_sequence": 629
  "translation_ja": "法律を、しかもこれほど重要な法律を犯すと、公然と宣言する人を、私があえて擁護するつもりはありません。しかし、この上なく謙虚に服し、まったく罪のない思い違いをお許し願ったうえで申せば、筆者の忠誠に満ちた意図は、少なくともその罪をほんの少し軽くする理由にはなるのではないか、と思います。というのも、この点については私もドレイピアと同じ考えであると、認めねばならないからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-033"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have not hitherto been told of any other objections against that pamphlet; but, I suppose, they will all appear at the prosecution of the Drapier. And, I think, whoever in his own conscience believes the said pamphlet to be \"wicked and malicious, seditious and scandalous, highly reflecting upon His Majesty and his ministers, &c.\" would do well to discover the author, (as little a friend as I am to the trade of informers) although the reward of 300l. had not been tacked to the discovery. I own, it would be a great satisfaction to me, to hear the arguments not only of judges, but of lawyers, upon this case. Because, you cannot but know, there often happens occasions, wherein it would be very convenient, that the bulk of the people should be informed how they ought to conduct themselves; and therefore, it hath been the wisdom of the English Parliaments, to be very reserved in limiting the press. When a bill is debating in either House of Parliament there, nothing is more usual, than to have the controversy handled by pamphlets on both sides; without the least animadversion upon the authors."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[549]"
    "line_start": 6144
    "source_sequence": 630
  "translation_ja": "あの小冊子に対するそれ以外の異議は、今のところ聞いていません。しかし、ドレイピアが訴追されれば、すべて明らかになるのでしょう。そして私は、あの小冊子が「邪悪で悪意に満ち、扇動的かつ中傷的で、陛下とその大臣をはなはだしく誹謗する、その他」であると、良心に照らして信じる人なら、著者を見つけ出すのがよいと考えます。私は密告という商売の味方では決してありませんが、発見の報奨に三百ポンドが付いていなくても、です。この事件について、判事ばかりでなく弁護士の議論も聞けたら、たいへん満足だろうと思います。閣下もご存じのとおり、多くの人々に、どう行動すべきか知らせておけば非常に都合がよい、という場合がしばしばあるからです。だからこそイングランドの議会は賢明にも、出版の自由を制限することにきわめて慎重であったのです。あちらでは、両院のどちらかで法案が審議されるとき、双方の立場から小冊子で論争するのが、ごく普通のことです。その著者たちが少しでも叱責されることはありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-034"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "So here, in the case of Mr. Wood and his coin; since the two Houses gave their opinion by addresses, how dangerous the currency of that copper would be to Ireland; it was, without all question, both lawful and convenient, that the bulk of the people should be let more particularly into the nature of the danger they were in; and of the remedies that were in their own power, if they would have the sense to apply them; and this cannot be more conveniently done, than by particular persons, to whom God hath given zeal and understanding sufficient for such an undertaking. Thus it happened in the case of that destructive project for a bank in Ireland, which was brought into Parliament a few years ago; and it was allowed, that the arguments and writings of some without doors, contributed very much to reject it.[11]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[550]"
    "line_start": 6162
    "source_sequence": 631
  "translation_ja": "ですから、こちらでのウッド氏とその貨幣の場合も同じです。あの銅貨の流通がアイルランドにいかに危険かを、両院が上奏によって述べている以上、大多数の人々に、自分たちの陥っている危険の性質と、賢明にも使おうと思えば自分たちの力で使える対策とを、もっと詳しく知らせることは、疑いなく合法であり、有益でもありました。それには、神からこの仕事を果たすに足りる熱意と理解力を授けられた個々人が行う以上に、適切なやり方はありません。数年前、議会に提出された、あの破滅的なアイルランドの銀行設立計画の場合も、そうでした。議会の外にいる数人の議論と著述が、その否決に大きく役立ったことは、認められていたのです。[11]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-note-011-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Swift himself assisted in writing against this \"destructive project\" in a series of pamphlets (see vol. vii.). The arguments for and against the bank were thoroughly discussed by Hercules Rowley and Henry Maxwell in a series of controversial letters against each other. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[551]"
    "line_start": 6176
    "source_sequence": 632
  "translation_ja": "スウィフト自身が一連の小冊子を書き、この「破滅的な計画」への反対に加わった。第七巻参照。銀行に対する賛否の議論は、ハーキュリーズ・ロウリーとヘンリー・マクスウェルが互いに宛てた一連の論争的な書簡で、徹底的に論じられた。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-035"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now, I should be heartily glad if some able lawyers would prescribe the limits, how far a private man may venture in delivering his thoughts upon public matters: Because a true lover of his country, may think it hard to be a quiet stander-by, and an indolent looker-on, while a public error prevails; by which a whole nation may be ruined. Every man who enjoys property, hath some share in the public; and therefore, the care of the public is, in some degree, every such man's concern."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[552]"
    "line_start": 6182
    "source_sequence": 633
  "translation_ja": "そこで私は、有能な法律家の方々が、公の事柄について私見を述べる際に、一個人はどこまで踏み込んでよいのか、その限界を定めてくだされば、心からうれしく思います。祖国を真に愛する者にとって、国民全体を破滅させかねない公の誤りがまかり通っている間、何もせず、ただ傍観しているのは、つらいことかもしれないからです。財産を持つ人は皆、公共の利害の一部を担っています。したがって、公共を気にかけることは、そういう人々の一人一人に、ある程度までは関わることなのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-036"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "To come to particulars, I could wish to know, Whether it be utterly unlawful in any writer so much as to mention the prerogative; at least so far as to bring it into doubt, upon any point whatsoever? I know it is often debated in Westminster-hall; and Sir Edward Coke, as well as other eminent lawyers, do frequently handle that subject in their books."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[553]"
    "line_start": 6191
    "source_sequence": 634
  "translation_ja": "具体的に申せば、私が知りたいのは、どのような筆者であれ、大権について言及することすら、少なくとも何らかの点でそれを疑問の対象とすることは、まったく違法なのか、ということです。ウェストミンスターの法廷ではしばしば議論され、サー・エドワード・クックをはじめ、優れた法律家たちも、その著書でこの問題をたびたび扱っていることは、承知しています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-037"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Secondly, How far the prerogative extends to force coin upon the subject, which is not sterling; such as lead, brass, copper, mixt metal, shells, leather, or any other material; and fix upon it whatever denomination the crown shall think fit?"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[554]"
    "line_start": 6198
    "source_sequence": 635
  "translation_ja": "第二に、正規の金銀貨ではない貨幣、たとえば鉛、真鍮、銅、合金、貝殻、革、そのほかどんな材料のものでも、それを臣民に押しつけ、王権が適当と考える額面をつけるということについて、大権はどこまで及ぶのでしょうか。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-038"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thirdly, What is really and truly meant by that phrase of \"a depending kingdom,\" as applied to Ireland; and wherein that dependency consisteth?"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[555]"
    "line_start": 6204
    "source_sequence": 636
  "translation_ja": "第三に、アイルランドについて用いられる「従属王国」という言葉は、本当に、実際には何を意味し、その従属とは何から成るのでしょうか。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-039"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lastly, In what points relating to liberty and property, the people of Ireland differ, or at least ought to differ, from those of England?"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[556]"
    "line_start": 6208
    "source_sequence": 637
  "translation_ja": "最後に、自由と財産に関するどの点で、アイルランドの人々はイングランドの人々と異なり、少なくとも異なるべきなのでしょうか。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-040"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If these particulars were made so clear, that none could mistake them, it would be of infinite ease and use to the kingdom; and either prevent or silence all discontents."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[557]"
    "line_start": 6212
    "source_sequence": 638
  "translation_ja": "これらの点が、誰にも取り違えようがないほど明らかにされれば、王国に計り知れない安心と利益をもたらし、あらゆる不満を未然に防ぐか、鎮めることになるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-041"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "My Lord Somers, the greatest man I ever knew of your robe; and whose thoughts of Ireland differed as far as heaven and earth, from those of some others among his brethren here; lamented to me, that the prerogative of the Crown, or the privileges of Parliament, should ever be liable to dispute, in any single branch of either; by which means, he said, the public often suffered great inconveniences; whereof he gave me several instances. I produce the authority of so eminent a person, to justify my desires, that some high points might be cleared."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[558]"
    "line_start": 6217
    "source_sequence": 639
  "translation_ja": "私の知るかぎり、閣下と同じ法服を着る方々の中で最も偉大であったサマーズ卿は、アイルランドに対するお考えも、この地の同職者の幾人かとは天地ほど違っていました。その方が私に、王権の大権も議会の特権も、そのどの一部分であれ、争いの対象になり得ること自体が嘆かわしい、と話されました。そのために、公共はしばしば大きな不都合を被るのだと、いくつか実例も挙げられました。私は、こうした重要な問題のいくつかを明らかにしていただきたいという願いが正当であることを示すため、これほど優れた方の権威を持ち出すのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-042"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For want of such known ascertainment, how far a writer may proceed in expressing his good wishes for his country; a person of the most innocent intentions, may possibly, by the oratory and comments of lawyers, be charged with many crimes, which from his very soul he abhors; and consequently may be ruined in his fortunes, and left to rot among thieves in some stinking jail; merely for mistaking the purlieus of the law. I have known, in my lifetime, a printer prosecuted and convicted, for publishing a pamphlet; where the author's intentions, I am confident, were as good and innocent, as those of a martyr at his last prayers.[12] I did very lately, as I thought it my duty, preach to the people under my inspection, upon the subject of Mr. Wood's coin; and although I never heard that my sermon gave the least offence, as I am sure none was intended; yet, if it were now printed and published, I cannot say, I would ensure it from the hands of the common hangman; or my own person from those of a messenger.[13]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[559]"
    "line_start": 6227
    "source_sequence": 640
  "translation_ja": "筆者が祖国のためを思う気持ちを述べる際、どこまで進んでよいかが、このように周知の明確な形で定められていないため、まったく潔白な意図を持つ人でさえ、法律家の雄弁と解釈によって、心の底から忌み嫌っている数々の罪を着せられるかもしれません。その結果、ただ法律の境目を取り違えただけで財産を失い、臭い牢獄で盗賊たちとともに朽ち果てるままにされるかもしれないのです。私はこれまで生きてきた間に、小冊子を出版したために訴追され、有罪になった印刷者を知っています。その筆者の意図は、殉教者の最後の祈りと同じほど善良で潔白だったと、私は確信しています。[12]ごく最近、私は自分の義務だと考えて、牧会を任されている人々に、ウッド氏の貨幣について説教しました。誰かの気分を害するつもりなどなかったのは確かですし、その説教が少しでも不興を招いたとは聞いていません。それでも今これを印刷して公にしたなら、この説教を公の刑吏の手から、また私自身を逮捕官の手から守れるとは、断言できません。[13]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-note-012-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Supposed to be \"A proposal for the universal use of Irish manufactures,\" written by the author. [F.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"

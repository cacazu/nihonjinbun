    "xpath": "/html/body/p[373]"
    "line_start": 4304
    "source_sequence": 427
  "translation_ja": "「市の合同参事会に集まった、ダブリン市の市長、シェリフ、市民代表および市民による謹んでの請願」は、一七二四年九月八日、一枚刷りとして発行された。付録第九も参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: F., T.S."
- "id": "dl-l03-057"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And if the dread of Wood's halfpence should continue till next quarter-sessions (which I hope it will not) the gentlemen of every county will then have a fair opportunity of declaring against them with unanimity and zeal."
  "source_languages":
  - "en"
  "source_locations":

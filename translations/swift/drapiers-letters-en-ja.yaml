  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The pay of the chief officers of the army absent in England, which is a great sum."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"

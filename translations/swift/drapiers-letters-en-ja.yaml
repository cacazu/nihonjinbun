  "translation_ja": "「『したがって、イングランドは、アイルランドを完全に破滅させるつもりでないのなら、私たちに何らかの救済を与えることを、考えるべきです。アイルランドという王国によって、イングランドは毎年百三十万ないし百四十万ポンドを得ていると、証明できるのですから』」（『聖パトリック大聖堂史』九三―九四頁［序文頁］）。［T・S］"

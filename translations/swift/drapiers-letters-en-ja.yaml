- "id": "dl-l04-028"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Another slander spread by Wood and his emissaries is, that by opposing him we discover an inclination to \"shake off our dependence upon the crown of England.\" Pray observe how important a person is this same William Wood, and how the public weal of two kingdoms is involved in his private interest. First, all those who refuse to take his coin are Papists; for he tells us that \"none but Papists are associated against him;\" Secondly, they \"dispute the King's prerogative;\" Thirdly, \"they are ripe for rebellion,\" and Fourthly, they are going to \"shake off their dependence upon the crown of England;\" That is to say, \"they are going to choose another king;\" For there can be no other meaning in this expression, however some may pretend to strain it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[439]"
    "line_start": 5032
    "source_sequence": 504
  "translation_ja": "ウッドとその手先が流すもう一つの中傷は、彼に反対することで、私たちが「イングランド王権への従属を振り払う」意向を示している、というものです。このウィリアム・ウッドが、何という重要人物であり、二つの王国の公益が、彼の私益にどれほど巻き込まれているか、ご覧ください。第一に、彼の貨幣を受け取らない者は、皆、教皇派です。「自分に反対して同盟するのは教皇派ばかりだ」と、本人が言っているからです。第二に、その者たちは「国王の大権を争って」います。第三に、「反乱を起こす機が熟して」います。そして第四に、「イングランド王権への従属を振り払おうとして」います。つまり、「別の国王を選ぼうとしている」ということです。いかに言葉を無理にこじつけようとする人がいても、この表現にそれ以外の意味はないからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-029"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And this gives me an opportunity of explaining, to those who are ignorant, another point, which hath often swelled in my breast. Those who come over hither to us from England, and some weak people among ourselves, whenever in discourse we make mention of liberty and property, shake their heads, and tell us, that Ireland is a \"depending kingdom,\" as if they would seem, by this phrase, to intend that the people of Ireland is in some state of slavery or dependence different from those of England; Whereas a \"depending kingdom\" is a modern term of art, unknown, as I have heard, to all ancient civilians, and writers upon government; and Ireland is on the contrary called in some statutes an \"imperial crown,\" as held only from God; which is as high a style as any kingdom is capable of receiving. Therefore by this expression, a \"depending kingdom,\" there is no more understood than that by a statute made here in the 33d year of Henry 8th. \"The King and his successors are to be kings imperial of this realm as united and knit to the imperial crown of England.\" I have looked over all the English and Irish statutes without finding any law that makes Ireland depend upon England, any more than England does upon Ireland. We have indeed obliged ourselves to have the same king with them, and consequently they are obliged to have the same king with us. For the law was made by our own Parliament, and our ancestors then were not such fools (whatever they were in the preceding reign) to bring themselves under I know not what dependence, which is now talked of without any ground of law, reason or common sense.[18]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[440]"
    "line_start": 5045
    "source_sequence": 505
  "translation_ja": "そこで、これまで何度も胸にこみ上げてきた、もう一つの点を、ご存じない方々のために説明する機会が得られました。イングランドから私たちのところへ渡ってくる人々や、私たち自身の中の気の弱い人々は、私たちが話の中で自由と財産に触れると、いつも首を振って、アイルランドは「従属する王国」だと言います。まるでこの言い方で、アイルランド国民は、イングランド国民とは異なる、ある種の奴隷状態か従属状態にあると、言いたいかのようです。ところが、「従属する王国」は近代の専門用語で、聞くところでは、昔の民法学者や統治を論じた著述家には、まったく知られていません。逆にアイルランドは、いくつかの法律では、神からのみ授けられるものとして、「独立した王権」と呼ばれています。これは、どんな王国にも与え得る最高の呼び名です。したがって、「従属する王国」という表現が意味するのは、当地でヘンリー八世の治世第三十三年に作られた法律により、「国王およびその後継者は、イングランドの独立した王権と結合し、一体となった、この王国の独立した国王となる」ということ、それ以上ではありません。私はイングランドとアイルランドの法令をすべて調べましたが、アイルランドをイングランドに従属させる法律は、イングランドをアイルランドに従属させる法律と同様、一つも見つかりませんでした。確かに私たちは、彼らと同じ国王を持つ義務を自らに課しましたが、したがって彼らにも、私たちと同じ国王を持つ義務があるのです。この法律は私たち自身の議会によって作られたのであり、その当時の祖先たちは、今では法律にも道理にも常識にも何の根拠もなく語られている、正体の分からない従属状態に、自らを置くほど愚かではありませんでした。前の治世にはどうだったにせよ、です。[18]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"

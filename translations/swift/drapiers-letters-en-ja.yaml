    "xpath": "/html/body/p[651]"
    "line_start": 7380
    "source_sequence": 757
  "translation_ja": "ジャン・ボダンは一五九六年に没した。政治的統治の理論的基礎について、情報と考察を見事に集めた『国家論』を書いた。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true

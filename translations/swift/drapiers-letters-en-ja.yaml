  "section_id": "letter-06-body"
  "kind": "heading"
  "origin": "source"
  "source_text": "LETTER VI. A LETTER TO THE RIGHT HONOURABLE THE LORD VISCOUNT MOLESWORTH, AT HIS HOUSE AT BRACKDENSTOWN NEAR SWORDS.[6]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/h2[16]"
    "line_start": 6735
    "source_sequence": 704
  "translation_ja": "第六書簡　スウォーズ近郊、ブラックデンズタウンの御邸宅におられる、モールズワース子爵閣下への手紙[6]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-014"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "My Lord, I reflect too late on the maxim of common observers, that \"those who meddle in matters out of their calling, will have reason to repent;\" which is now verified in me: For by engaging in the trade of a writer, I have drawn upon myself the displeasure of the government, signified by a proclamation promising a reward of three hundred pounds to the first faithful subject who shall be able and inclined to inform against me. To which I may add the laudable zeal and industry of my Lord Chief Justice [Whitshed] in his endeavours to discover so dangerous a person. Therefore whether I repent or no, I have certainly cause to do so, and the common observation still stands good."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[601]"
    "line_start": 6739
    "source_sequence": 705
  "translation_ja": "閣下、「自分の本業に関わりのない事柄に首を突っ込む者は、後悔することになる」という、世間の人々の格言を、遅すぎる今になって考えています。まさしく私自身に当てはまってしまったからです。著述という商売に関わったことで、政府の不興を招いてしまいました。私を告発でき、その意志のある最初の忠実な臣民には、三百ポンドの報奨を与えるという布告が、そのしるしです。これに、これほど危険な人物を発見しようと、首席裁判官卿［ホイットシェッド］が示す、称賛すべき熱意と勤勉を付け加えてもよいでしょう。ですから、私が後悔していようといまいと、後悔すべき理由があることだけは確かで、世間の格言は、やはり正しいままなのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-note-006-001"
  "section_id": "letter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Robert, Viscount Molesworth (1656-1725), born in Dublin and educated at the University there, was a prominent adherent of the Prince of Orange during the Revolution of 1688. In 1692 William sent him to Denmark as envoy-extraordinary to the Court at Copenhagen; but he left abruptly because of the offence he gave there. Retiring to Flanders, Molesworth revenged himself by writing, \"An Account of Denmark as it was in 1692,\" in which he described that country as no fit place for those who held their liberties dearly. Molesworth had been strongly imbued with the republican teachings of Algernon Sidney, and his book affords ample proof of the influence. Its publication aroused much indignation, and a controversy ensued in which Swift's friend, Dr. William King, took part. In 1695 Molesworth returned to Ireland, became a Privy Councillor in 1697, sat in the Irish parliament in 1703-1705, and in the English House of Commons from 1705 to 1708. In 1713 he was removed from the Irish Privy Council on a charge of a treasonable utterance, which Steele vindicated in \"The Englishman\" and \"The Crisis.\" The accession of George I., however, brought Molesworth into his honours again, and he was created Baron Molesworth of Philipstown, and Viscount Molesworth of Swords, in 1719. His work entitled \"Considerations for Promoting Agriculture,\" issued in 1723, was considered by Swift as \"an excellent discourse, full of most useful hints.\" At the time Swift addressed him this sixth letter, Molesworth was living in retirement at Brackdenstown. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[602]"
    "line_start": 6751
    "source_sequence": 706
  "translation_ja": "ロバート、モールズワース子爵（一六五六―一七二五）は、ダブリンに生まれ、同地の大学で学び、一六八八年の革命ではオラニエ公の有力な支持者であった。一六九二年、ウィリアム王は彼をコペンハーゲン宮廷への特命公使としてデンマークへ派遣したが、そこで反感を買い、突然離任した。フランドルへ退いたモールズワースは、仕返しに『一六九二年当時のデンマークの記述』を書き、自由を重んじる者には、あの国はふさわしい場所ではないと述べた。モールズワースはアルジャーノン・シドニーの共和主義思想に強く染まっており、この著書はその影響を十分に示している。刊行は大きな憤激を引き起こし、論争が起こった。スウィフトの友人、ウィリアム・キング博士もこれに加わった。一六九五年にアイルランドへ戻り、一六九七年に枢密顧問官となり、一七〇三年から一七〇五年までアイルランド議会、一七〇五年から一七〇八年までイングランド庶民院の議員を務めた。一七一三年、反逆的な発言をしたという理由でアイルランド枢密院から除名された。この発言は、スティールが『イングリッシュマン』と『危機』で弁護した。しかしジョージ一世の即位によって再び栄誉を得て、一七一九年にフィリップスタウンのモールズワース男爵、スウォーズのモールズワース子爵に叙された。一七二三年刊の『農業振興についての考察』を、スウィフトは「きわめて有益な示唆に満ちた、優れた論説」と評した。スウィフトがこの第六書簡を送った当時、モールズワースはブラックデンズタウンで隠退生活を送っていた。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l06-015"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It will sometimes happen, I know not how in the course of human affairs, that a man shall be made liable to legal animadversions, where he has nothing to answer for, either to God or his country; and condemned at Westminster-hall for what he will never be charged with at the Day of Judgment."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[603]"
    "line_start": 6775
    "source_sequence": 707
  "translation_ja": "人の世の成り行きには、どういうわけか、神に対しても祖国に対しても、何ら責任を問われることのない者が、法律上の非難を受ける羽目になることがあります。最後の審判の日には決して咎められないことによって、ウェストミンスターの法廷で有罪になるのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-016"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "After strictly examining my own heart, and consulting some divines of great reputation, I cannot accuse myself of any \"malice or wickedness against the public;\" of any \"designs to sow sedition,\" of \"reflecting on the King and his ministers,\" or of endeavouring \"to alienate the affections of the people of this kingdom from those of England.\"[7] All I can charge myself with, is a weak attempt to serve a nation in danger of destruction by a most wicked and malicious projector, without waiting until I were called to its assistance; which attempt, however it may perhaps give me the title of pragmatical and overweening will never lie a burthen upon my conscience. God knows whether I may not with all my caution have already run myself into danger, by offering thus much in my own vindication. For I have heard of a judge, who, upon the criminal's appeal to the dreadful Day of Judgment, told him he had incurred a premunire for appealing to a foreign jurisdiction: And of another in Wales, who severely checked the prisoner for offering the same plea, taxing him with reflecting on the Court by such a comparison, because \"comparisons were odious.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[604]"
    "line_start": 6782
    "source_sequence": 708
  "translation_ja": "私は厳しく自分の心を調べ、名高い神学者数人にも相談しましたが、「公共に対する悪意や邪悪さ」、「扇動の種をまく企て」、「国王とその大臣への誹謗」、あるいは「この王国の人々の心をイングランドの人々から引き離そうとすること」の、いずれについても、自分に罪があるとは思えません。[7]自分を咎められる点があるとすれば、きわめて邪悪で悪意ある計画屋によって破滅の危険にさらされた国民を、助けに来るよう頼まれるまで待つことなく、弱いながらも救おうと試みたこと、それだけです。この試みのために、出しゃばりの思い上がった者と呼ばれることはあるかもしれません。しかし、私の良心に重荷を負わせることは、決してないでしょう。こんなに注意していても、これほど自分の弁明を述べたことで、すでに危険に飛び込んでしまったかどうか、神のみぞご存じです。というのも、ある判事の話を聞いたことがあるからです。罪人が恐ろしい最後の審判の日に訴えると言うと、その判事は、外国の裁判権に上訴したため、王権侵害罪に問われるぞと告げたそうです。またウェールズの別の判事は、同じ申し立てをした囚人を厳しく叱り、そんな比較は当法廷を誹謗するものだと非難しました。「比較は不愉快なもの」だから、というのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-note-007-001"
  "section_id": "letter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The quotations are from the charges stated in the indictment and proclamation against the writer and printer of the previous letters. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[605]"
    "line_start": 6801
    "source_sequence": 709
  "translation_ja": "これらの引用は、先の書簡の筆者と印刷者に対する起訴状と布告に挙げられた容疑から取ったもの。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"

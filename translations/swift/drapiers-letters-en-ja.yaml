- "id": "dl-l03-note-020-014"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"Dublin, 29th. August, 1724.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[354]"
    "line_start": 4123
    "source_sequence": 407
  "translation_ja": "「ダブリン、一七二四年八月二十九日」。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-049"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "After which, let the officers to whom these orders are directed, (I would willingly except the military) come with their exhortations, their arguments and their eloquence, to persuade us to find our interest in our undoing. Let Wood and his accomplices travel about the country with cart-loads of their ware, and see who will take it off their hands, there will be no fear of his being robbed, for a highwayman would scorn to touch it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[355]"
    "line_start": 4126
    "source_sequence": 408
  "translation_ja": "そのうえで、これらの命令を受けた官吏たちには、勧告と議論と雄弁を携えて来て、私たちの破滅に私たちの利益を見いだすよう、説得してもらいましょう。軍人はできれば除いておきたいところですが。ウッドとその仲間には、自分たちの商品を荷車に山と積んで国じゅうを回り、誰が引き取ってくれるか試してもらいましょう。強盗に遭う心配はありません。追い剥ぎも、そんなものには触れるのさえばかばかしいと思うでしょうから。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-050"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am only in pain how the commissioners of the revenue will proceed in this juncture; because I am told they are obliged by act of Parliament to take nothing but gold and silver in payment for His Majesty's customs, and I think they cannot justly offer this coinage of Mr. Wood to others, unless they will be content to receive it themselves."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[356]"
    "line_start": 4135
    "source_sequence": 409
  "translation_ja": "私がただ気がかりなのは、この局面で歳入委員たちがどうするかということです。聞けば、陛下の関税の支払いには、議会制定法によって金貨と銀貨以外は受け取れないということですから、自分たちで受け取るつもりがないのに、このウッド氏の貨幣をほかの人々に差し出すのは、正当ではないと思います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-051"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The sum of the whole is this. The \"Committee advises the King to send immediate orders to all his officers here, that Wood's coin be suffered and permitted without any let, suit, trouble, &c. to pass and be received as current money by such as shall be willing to receive the same.\" It is probable, that the first willing receivers may be those who must receive it whether they will or no, at least under the penalty of losing an office. But the landed undepending men, the merchants, the shopkeepers and bulk of the people, I hope, and am almost confident, will never receive it. What must the consequence be? The owners will sell it for as much as they can get. Wood's halfpence will come to be offered for six a penny (yet then he will be a sufficient gainer) and the necessary receivers will be losers of two-thirds in their salaries or pay."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[357]"
    "line_start": 4142
    "source_sequence": 410
  "translation_ja": "話をすべてまとめれば、こうです。「委員会は国王に対し、ウッドの貨幣が、それを受け取る意思のある者によって、妨害、訴訟、煩擾等を受けることなく、通用貨幣として流通し、受け取られることを容認し許可するよう、当地の全官吏へ直ちに命令を送ることを進言する」。最初の、自ら進んで受け取る人々は、おそらく、望むと望まないとにかかわらず、少なくとも職を失う覚悟がなければ受け取らざるを得ない人々でしょう。しかし、独立した地主たち、商人たち、商店主たち、そして国民の大部分は、決して受け取らないと、私は願い、ほとんど確信しています。すると結果はどうなるでしょう。持ち主は、取れるだけの値段でそれを売り払います。ウッドの半ペニー銅貨は、一ペニーにつき六枚で売りに出されるようになり、それでもなお、彼には十分な利益があります。そして、受け取らざるを得ない人々は、俸給や給金の三分の二を失うのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-052"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This puts me in mind of a passage I was told many years ago in England. At a quarter-sessions in Leicester, the justices had wisely decreed, to take off a halfpenny in a quart from the price of ale. One of them, who came in after the thing was determined, being informed of what had passed, said thus: \"Gentlemen; you have made an order, that ale should be sold in our country for three halfpence a quart: I desire you will now make another to appoint who must drink it, for by G— I will not.\"[21]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[358]"
    "line_start": 4156
    "source_sequence": 411
  "translation_ja": "このことから、私は何年も前、イングランドで聞いた出来事を思い出します。レスターの四季裁判所で、治安判事たちが賢明にも、エールの値段を一クォート当たり半ペニー下げることに決めました。決定が済んでから来た一人が、その経緯を聞いて、こう言いました。「皆さん、わが地方のエールを一クォート一ペニー半で売れという命令を出されたのですな。では、今度は誰が飲まなければならないのか、もう一つ命令を出していただきたい。神――に誓って、私は飲まんから」。[21]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-021-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The following broadside, ascribed to Swift, but written probably by Sheridan, further amusingly illustrates the point Swift makes. The broadside was printed by John Harding:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[359]"
    "line_start": 4165
    "source_sequence": 412
  "translation_ja": "次に掲げる一枚刷りは、スウィフトに帰されているが、おそらくシェリダンの作であり、スウィフトの論点をさらに面白く例証している。印刷はジョン・ハーディングによる。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "無署名の底本注。引用する別の小冊子をSwift本人作と確定しない。"
- "id": "dl-l03-note-021-002"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"Another Letter to Mr. Harding the printer, upon occasion of the Report of the Committee of the Lords of His Majesty's Most Honourable Privy-Council, in relation to Mr. Wood's halfpence and farthings, etc., lately published."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[360]"
    "line_start": 4170
    "source_sequence": 413
  "translation_ja": "「ウッド氏の半ペニーおよびファージング銅貨等に関し、先ごろ発表された、国王陛下の最も名誉ある枢密院の貴族委員会報告を機として、印刷人ハーディング氏に宛てた、もう一通の書簡。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "無署名の底本注。引用する別の小冊子をSwift本人作と確定しない。"
- "id": "dl-l03-note-021-003"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"Mr. Harding,—Although this letter also is directed to you, yet you know that it is intended for the benefit of the whole kingdom, and therefore I pray make it public, and take care to disperse it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[361]"
    "line_start": 4175
    "source_sequence": 414
  "translation_ja": "「ハーディング様――この書簡もあなたに宛てていますが、王国全体の利益のためのものだということは、ご存じのとおりです。ですから、公表し、広く行き渡るようお取り計らいください。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "無署名の底本注。引用する別の小冊子をSwift本人作と確定しない。"
- "id": "dl-l03-note-021-004"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"The design of it is only to desire all people to take notice, That whatever apprehensions some persons seem to be under on account of the above-mentioned report concerning Mr. Wood's halfpence and farthings, yet the utmost advice which the right honourable Committee have thought fit to give His Majesty, is, That a certain sum of the said halfpence and farthings may be received as current money by such as shall be willing to receive the same. And if we are willing to ruin ourselves and our country, I think we are not to be pitied."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[362]"
    "line_start": 4180
    "source_sequence": 415
  "translation_ja": "「その目的はただ、すべての人に、次のことを心に留めてほしいというものです。ウッド氏の半ペニーおよびファージング銅貨に関する前記の報告によって、一部の人がどのような不安を抱いているように見えても、名誉ある委員会が陛下に差し上げるのを適当とした助言は、最大限に解しても、前記の半ペニーおよびファージング銅貨の一定額を、それを受け取る意思のある者が、通用貨幣として受け取ってよいということにすぎません。そして、自分と祖国を進んで破滅させるのなら、私たちは憐れんでもらう筋合いもないと思います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "無署名の底本注。引用する別の小冊子をSwift本人作と確定しない。"

    A
                                 LETTER
                                    TO
                        Mr. Harding the Printer,
                            Upon Occasion of a

                              PARAGRAPH
                                 IN HIS
                              News-Paper
                              of Aug. 1st.

                   Relating to Mr. Wood's Half-pence.

                          By M.B. Drapier.
                       AUTHOR of the LETTER to the
                            SHOP-KEEPERS, &c.

                     DUBLIN: Printed by J. Harding
                         in Molesworth's-Court.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"

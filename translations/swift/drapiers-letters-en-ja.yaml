    "line_start": 1094
    "source_sequence": 126
  "translation_ja": |-
    アイルランドの
    小売商人、商工業者、農民、一般の人々へ
    送る書簡。

    この王国で通用させようとして
    ウッズ氏が鋳造した
    真鍮の半ペニー銅貨について。

    右の特許状が持つ効力、半ペニー銅貨の価値、各人が支払いとしてどこまでその受取りを義務づけられるのか、またウッズその他の者がそのような受取りを強いようとした場合に、どう振る舞うべきかを明らかにする。

    ［各家庭に一部ずつ備えておくのに、まことにふさわしいもの。］

    M・B・ドレイピア著。

    ダブリン、モールズワース・コートのJ・ハーディング印刷。
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "original_title_page_transcription"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-002"
  "section_id": "letter-01-body"
  "kind": "heading"
  "origin": "source"
  "source_text": "BRETHREN, FRIENDS, COUNTRYMEN AND FELLOW-SUBJECTS,"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/h3[11]"
    "line_start": 1128
    "source_sequence": 127
  "translation_ja": "兄弟、友人、同国人、そして同じ国王の臣民である皆さん、"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-003"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "What I intend now to say to you, is, next to your duty to God, and the care of your salvation, of the greatest concern to yourselves, and your children, your bread and clothing, and every common necessary of life entirely depend upon it. Therefore I do most earnestly exhort you as men, as Christians, as parents, and as lovers of your country, to read this paper with the utmost attention, or get it read to you by others; which that you may do at the less expense, I have ordered the printer to sell it at the lowest rate."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[97]"
    "line_start": 1131
    "source_sequence": 128
  "translation_ja": "これから皆さんにお話しするのは、神への務めと自分の魂の救いへの配慮に次いで、皆さん自身とお子さんたちにとって最も大切な問題です。日々のパンや衣服をはじめ、暮らしに必要なものはすべて、この問題にかかっています。そこで、一人の人間として、キリスト教徒として、親として、祖国を愛する者として、細心の注意を払ってこの書面を読み、あるいは他の人に読み聞かせてもらうよう、心から強く勧めます。少ない出費でそうできるよう、印刷業者には、できるかぎり安い値段で売るよう指示しておきました。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-004"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is a great fault among you, that when a person writes with no other intention than to do you good, you will not be at the pains to read his advices: One copy of this paper may serve a dozen of you, which will be less than a farthing a-piece. It is your folly that you have no common or general interest in your view, not even the wisest among you, neither do you know or enquire, or care who are your friends, or who are your enemies."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[98]"
    "line_start": 1141
    "source_sequence": 129
  "translation_ja": "皆さんの大きな欠点は、誰かがただ皆さんのためを思って書いたときにも、その助言を読む手間を惜しむことです。この書面は一部あれば十二人ほどで読めるので、一人当たり一ファージングにもつきません。皆さんは、共通の利益や全体の利益を考えないという愚を犯しています。一番分別のある人でさえ、そうです。誰が味方で、誰が敵なのか、知りもせず、調べもせず、気にもかけません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-005"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "About three[9] years ago, a little book was written, to advise all people to wear the manufactures of this our own dear country:[10] It had no other design, said nothing against the King or Parliament, or any man, yet the POOR PRINTER was prosecuted two years, with the utmost violence, and even some WEAVERS themselves, for whose sake it was written, being upon the JURY, FOUND HIM GUILTY. This would be enough to discourage any man from endeavouring to do you good, when you will either neglect him or fly in his face for his pains, and when he must expect only danger to himself and loss of money, perhaps to his ruin.[11]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[99]"
    "line_start": 1150
    "source_sequence": 130
  "translation_ja": "三年[9]ほど前、この愛すべきわが国で作られた品を、みんなで身につけようと勧める小冊子が書かれました。[10] それ以外の狙いはなく、国王や議会にも、誰にも、悪口を言ったわけではありません。それなのに、哀れな印刷業者は二年間、激しい追及を受けました。しかも、この冊子がほかならぬ自分たちのために書かれた織工の中からさえ、陪審に加わって、彼を有罪とした者がいたのです。これでは、皆さんのために何かしようとする気持ちを、誰でもくじかれてしまいます。せっかく尽くしても、皆さんは知らぬ顔をするか、かえって食ってかかる。その人が予期できるのは、自分の身の危険と金銭の損失だけで、それが破産にまでつながるかもしれないのですから。[11]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-009-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "In his reprint of the Drapier's Letters, issued in 1725 with the title, \"Fraud Detected; or the Hibernian Patriot,\" Faulkner prints \"four\" instead of \"three\"; but this, of course, is a correction made to agree with the date of the publication of this reprint. The \"Proposal\" was published in 1720. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[100]"
    "line_start": 1161
    "source_sequence": 131
  "translation_ja": "フォークナーが一七二五年に『暴かれた詐欺、あるいはアイルランドの愛国者』という題で出した『ドレイピア書簡集』の再版では、「三年」を「四年」としている。もちろん、これは再版の刊行年に合うように改めたものである。『提案』は一七二〇年に刊行された。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-note-010-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The \"little book\" was \"A Proposal for the Universal Use of Irish Manufactures.\" See vol. vii. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[101]"
    "line_start": 1168
    "source_sequence": 132
  "translation_ja": "この「小冊子」は『アイルランド製品の全面的な使用を勧める提案』である。第七巻を参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-note-011-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Instead of the words \"loss of money,\" Faulkner in the reprint of 1725 has \"to be fined and imprisoned.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[102]"
    "line_start": 1172
    "source_sequence": 133
  "translation_ja": "フォークナーの一七二五年再版では、「金銭の損失」の代わりに「罰金と投獄を受けること」となっている。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-006"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "However I cannot but warn you once more of the manifest destruction before your eyes, if you do not behave yourselves as you ought."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[103]"
    "line_start": 1176
    "source_sequence": 134
  "translation_ja": "とはいえ、皆さんが取るべき行動を取らなければ、目の前に明らかな破滅が迫っていると、もう一度警告せずにはいられません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-007"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I will therefore first tell you the plain story of the fact; and then I will lay before you how you ought to act in common prudence, and according to the laws of your country."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[104]"
    "line_start": 1180
    "source_sequence": 135
  "translation_ja": "そこでまず、事実をありのままにお話しします。それから、普通の分別に従い、わが国の法律に照らして、皆さんがどう行動すべきかを示します。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-008"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The fact is thus: It having been many years since COPPER HALFPENCE OR FARTHINGS were last coined in this kingdom, they have been for some time very scarce,[12] and many counterfeits passed about under the name of raps, several applications were made to England, that we might have liberty to coin new ones, as in former times we did; but they did not succeed. At last one Mr. Wood,[13] a mean ordinary man, a hardware dealer, procured a patent[14]under his Majesty's broad seal to coin fourscore and ten thousand pounds[15] in copper for this kingdom, which patent however did not oblige any one here to take them, unless they pleased. Now you must know, that the halfpence and farthings in England pass for very little more than they are worth. And if you should beat them to pieces, and sell them to the brazier you would not lose above a penny in a shilling. But Mr. Wood made his halfpence of such base metal, and so much smaller than the English ones, that the brazier would not give you above a penny of good money for a shilling of his; so that this sum of fourscore and ten thousand pounds in good gold and silver, must be given for trash that will not be worth above eight or nine thousand pounds real value. But this is not the worst, for Mr. Wood when he pleases may by stealth send over another and another fourscore and ten thousand pounds, and buy all our goods for eleven parts in twelve, under the value. For example, if a hatter sells a dozen of hats for five shillings a-piece, which amounts to three pounds, and receives the payment in Mr. Wood's coin, he really receives only the value of five shillings."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[105]"
    "line_start": 1185
    "source_sequence": 136
  "translation_ja": "事実はこうです。この王国で最後に半ペニー銅貨やファージング銅貨を鋳造してから、何年もたったため、しばらく前からそれらがひどく不足し、[12]「ラップ」と呼ばれる偽銅貨が数多く出回るようになりました。そこで、昔のように自分たちで新たに鋳造することを許してほしいと、何度もイングランドへ願い出ましたが、認められませんでした。ところがついに、ウッド[13]という、身分の低い、ありふれた金物商が、国王陛下の国璽を付した特許状[14]を手に入れ、この王国のために九万ポンド[15]分の銅貨を鋳造することになったのです。ただし、この特許状は、こちらの誰にも、本人が望まないのにその銅貨を受け取る義務を課してはいません。ここで知っておいていただきたいのは、イングランドの半ペニーやファージングは、実際の地金の価値をほんの少し上回る額で通用しているということです。砕いて銅細工商に売ったとしても、一シリングにつき一ペニーを超える損はしないでしょう。ところがウッド氏の半ペニーは、金属があまりに粗悪で、イングランドのものよりもずっと小さいため、彼の銅貨一シリング分を持っていっても、銅細工商は良貨で一ペニーより多くは出さないでしょう。つまり、立派な金貨や銀貨で九万ポンドもの金額を、実際の価値はせいぜい八千か九千ポンドにしかならないがらくたと引き換えに渡さなければならないのです。しかも、これが最悪というわけではありません。ウッド氏は、気が向けば、さらに九万ポンド、また九万ポンドと、ひそかに送り込んで、わが国の商品を、本来の価値より十二分の十一も安く買うことができます。たとえば、帽子屋が帽子一ダースを一個五シリングで売れば、代金は三ポンドになりますが、ウッド氏の貨幣で受け取れば、実際に受け取った価値はたった五シリングなのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-012-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "They had become scarce because they had been undervalued, and therefore sent out of the country in payment of goods bought. See Prior's \"Observations on Coin,\" issued in 1729, where it is stated that this scarcity had occurred only within the last twenty years. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[106]"
    "line_start": 1210
    "source_sequence": 137
  "translation_ja": "銅貨が不足したのは、本来の価値より低く評価されていたため、商品の購入代金として国外へ送られたからである。一七二九年刊のプライアー『貨幣に関する考察』を参照。同書によれば、この不足が生じたのは過去二十年ほどの間に限られていた。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-note-013-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "William Wood (1671-1730) was an ironmaster of Wolverhampton. In addition to the patent for coining copper halfpence which he obtained for Ireland, and to which full reference is made in the introductory note to this first Drapier's Letter, Wood also obtained a patent, in 1722, for coining halfpence, pence and twopence for the English colonies in America. This latter patent fared no better than the Irish one. The coins introduced in America bear the dates 1722 and 1723, and are now much sought after by collectors. They are known as the Rosa American coinage. A list of the poems and pamphlets on Wood, during the excitement in Dublin, attending on the Drapier's Letters, will be found in the bibliography of Swift's works to be given in vol. xi. of this edition. See also Monck Mason's \"History of St. Patrick's Cathedral.\" In the original edition of the Letter, Wood's name is mis-spelt Woods. [T. S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[107]"
    "line_start": 1216
    "source_sequence": 138
  "translation_ja": "ウィリアム・ウッド（一六七一〜一七三〇年）は、ウォルヴァーハンプトンの製鉄業者であった。この第一書簡の導入解説で詳しく述べた、アイルランド向けの半ペニー銅貨の鋳造特許に加え、ウッドは一七二二年、アメリカのイングランド植民地向けに、半ペニー、一ペニー、二ペニーの銅貨を鋳造する特許も得た。こちらの特許もうまくはいかなかった。アメリカへ持ち込まれた貨幣には一七二二年と一七二三年の年記があり、現在では収集家が盛んに求めている。「ローザ・アメリカン貨」として知られるものである。『ドレイピア書簡』をめぐってダブリンが沸いた時期に出た、ウッドに関する詩や小冊子の一覧は、本版第十一巻に掲げるスウィフト著作書誌に収録される。モンク・メイソン『聖パトリック大聖堂史』も参照。この書簡の初版では、Woodの名がWoodsと誤記されている。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-note-014-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "See the introductory note for the manner in which this patent was obtained. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[108]"
    "line_start": 1231
    "source_sequence": 139
  "translation_ja": "この特許がどのように得られたかについては、導入解説を参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-note-015-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This is how the amount is named in the first edition; but the amount in reality was £100,800 (the value of 360 tons of copper, as stated by the patent). Sir W. Scott prints this as £108,000. Coxe, in his \"Memoirs of Sir Robert Walpole\" gives the amount as £100,000. Lecky states it as £108,000. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[109]"
    "line_start": 1235
    "source_sequence": 140
  "translation_ja": "金額は初版でこのように記されているが、実際には十万八百ポンドであった。これは、特許状に記載された銅三百六十トンの価額である。W・スコット卿の版では十万八千ポンドとなっている。コックス『サー・ロバート・ウォルポール回想録』では十万ポンド、レッキーは十万八千ポンドとしている。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-009"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Perhaps you will wonder how such an ordinary fellow as this Mr. Wood could have so much interest as to get His Majesty's broad seal for so great a sum of bad money, to be sent to this poor country, and that all the nobility and gentry here could not obtain the same favour, and let us make our own halfpence, as we used to do. Now I will make that matter very plain. We are at a great distance from the King's court, and have nobody there to solicit for us, although a great number of lords and squires, whose estates are here, and are our countrymen, spending all their lives and fortunes there. But this same Mr. Wood was able to attend constantly for his own interest; he is an Englishman and had great friends, and it seems knew very well where to give money, to those that would speak to others that could speak to the King and could tell a fair story. And His Majesty, and perhaps the great lord or lords who advised him, might think it was for our country's good; and so, as the lawyers express it, \"the King was deceived in his grant,\" which often happens in all reigns. And I am sure if His Majesty knew that such a patent, if it should take effect according to the desire of Mr. Wood, would utterly ruin this kingdom, which hath given such great proofs of its loyalty, he would immediately recall it, and perhaps shew his displeasure to somebody or other. But \"a word to the wise is enough.\" Most of you must have heard, with what anger our honourable House of Commons received an account of this Wood's patent.[16] There were several fine speeches made upon it, and plain proofs that it was all A WICKED CHEAT from the bottom to the top, and several smart votes were printed, which that same Wood had the assurance to answer likewise in print, and in so confident a way, as if he were a better man than our whole Parliament put together.[17]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[110]"
    "line_start": 1242
    "source_sequence": 141
  "translation_ja": "ウッド氏のようなありふれた男が、なぜそれほどのつてを持ち、こんなに大量の悪貨をこの貧しい国へ送り込むために、陛下の国璽まで取り付けられたのか、皆さんは不思議に思うかもしれません。それなのに、こちらの貴族や地主は総がかりでも同じ恩恵を得られず、かつてのように自分たちで半ペニーを作ることも許されないのです。では、その訳をはっきり説明しましょう。わが国は国王の宮廷から遠く離れ、あちらでこちらのために働きかけてくれる者がいません。こちらに領地を持つ、わが同胞の貴族や地主の多くが、あちらで一生を送り、財産を使い果たしているにもかかわらずです。ところがウッド氏は、自分の利益のために、絶えずその場にいて動くことができました。彼はイングランド人で、有力な友人がいました。そしてどうやら、誰に金を渡せば、その者から別の者へ話が通り、その先から国王へ、もっともらしい話を持ち込めるのか、よく心得ていたのです。陛下や、おそらく陛下に進言した有力な貴族の方々は、これがわが国の利益になると思われたのでしょう。こうして、法律家の言い方を借りれば、「国王は特許を与える際に欺かれた」のです。これは、どの治世にもよくあることです。そして私は確信しています。このような特許がウッド氏の望みどおりに実行されれば、これほど忠誠を示してきたこの王国が、すっかり滅びてしまうと陛下がお知りになれば、直ちに取り消され、誰かに御不興を示されることもあるでしょう。ですが、「賢明な人には、一言で足りる」のです。皆さんの大半は、わが誉れ高い庶民院が、ウッドの特許の知らせをどれほど憤慨して受け止めたか、聞いているはずです。[16] 立派な演説がいくつも行われ、この件が最初から最後まで卑劣な詐欺にほかならないことを示す、明白な証拠が挙げられました。手厳しい決議もいくつか印刷されました。ところがあのウッドは、あつかましくも、やはり印刷物でそれに答えたのです。しかも、自分一人のほうが、わが議会の全員を合わせたよりも偉いと言わんばかりの、自信に満ちた態度ででした。[17]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":

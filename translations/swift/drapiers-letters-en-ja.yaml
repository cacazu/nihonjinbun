    "contributor_id": "swift"
- "id": "dl-l01-note-016-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The Irish House of Commons reported that the loss to the country, even if the patent were carried out as required, would amount to about 150 per cent.; and both Irish Houses of Parliament voted addresses against the coinage, and accused the patentee of fraud and deceit. They asserted that the terms of the patent had not been fulfilled and \"that the circulation of the halfpence would be highly prejudicial to the revenue, destructive of the commerce, and of most dangerous consequences to the rights and properties of the subjects.\" See introductory note. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[111]"
    "line_start": 1270
    "source_sequence": 142
  "translation_ja": "アイルランド庶民院は、特許が条件どおりに履行されても、国の損失はおよそ百五十パーセントに上ると報告した。アイルランド議会の両院は、この鋳貨に反対する国王への上申を議決し、特許権者を詐欺と欺瞞のかどで非難した。両院は、特許の条件は履行されておらず、「この半ペニー銅貨の流通は、歳入を甚だしく損ない、商業を破壊し、臣民の権利と財産にきわめて危険な結果をもたらす」と主張した。導入解説を参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-note-017-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Wood's indiscreet retort was published in the \"Flying Post\" October 8th, 1723. Later he boasted that he would, with Walpole's assistance, \"pour the coin down the throats of the people.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[112]"
    "line_start": 1280
    "source_sequence": 143
  "translation_ja": "ウッドの軽率な反論は、一七二三年十月八日の『フライング・ポスト』に掲載された。後には、ウォルポールの助けを借りて「人々の喉へこの貨幣を流し込んでやる」と豪語した。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-010"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This Wood, as soon as his patent was passed, or soon after, sends over a great many barrels of these halfpence, to Cork and other sea-port towns,[18] and to get them off offered an hundred pounds in his coin for seventy or eighty in silver. But the collectors of the King's customs very honestly refused to take them, and so did almost everybody else. And since the Parliament hath condemned them, and desired the King that they might be stopped, all the kingdom do abominate them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[113]"
    "line_start": 1285
    "source_sequence": 144
  "translation_ja": "ウッドは、特許が認められるとすぐ、あるいはその間もなく、この半ペニー銅貨を樽に何杯も詰め、コークその他の港町へ送り込みました。[18] それをさばくために、自分の銅貨で百ポンド分を、銀貨七十ないし八十ポンドと引き換えに渡すと申し出ました。けれども、国王の関税徴収官たちは、まことに正直にも受取りを拒みました。ほとんど誰もが、同じように拒みました。そして議会がこの銅貨を非難し、流通を止めるよう国王に求めて以来、王国全体がこれを忌み嫌っています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-018-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "At Dublin, Cork, Waterford and other ports, the merchants refused to accept the copper coins. Monck Mason notes that \"in the 'Dublin Gazette,' No. 2562, we meet with resolutions by the merchants of Cork, dated the 25th of Aug., 1724, and like resolutions by those of Waterford, dated 22d Aug. wherein they declare, that, 'they will never receive or utter in any payment, the halfpence or farthings coined by William Wood; as they conceive the importing and uttering the same, to be highly prejudicial to His Majesty's revenue, and to the trade of the kingdom': these resolutions are declared to be conformable to those of the Trinity Guild, of merchants, of the city of Dublin, voted at their guild-hall, on the 18th day of the same month\" (Hist. St. Patrick's, p. 346, note r). See also Appendix No. IX. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[114]"
    "line_start": 1294
    "source_sequence": 145
  "translation_ja": "ダブリン、コーク、ウォーターフォードその他の港では、商人たちはこの銅貨の受取りを拒否した。モンク・メイソンは、次のように記している。「『ダブリン・ガゼット』第二五六二号には、一七二四年八月二十五日付のコーク商人の決議と、同月二十二日付のウォーターフォード商人の同様の決議が見られる。そこでは、『ウィリアム・ウッドの鋳造した半ペニーやファージングを、いかなる支払いにおいても決して受け取らず、また支払いにも使わない。これらを輸入し流通させることは、陛下の歳入と王国の商業を甚だしく損なうと考えるからである』と宣言している。これらの決議は、同月十八日に会館で議決された、ダブリン市商人のトリニティ組合の決議に沿うものであると表明されている」（『聖パトリック大聖堂史』三四六頁、注r）。付録第九も参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-011"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But Wood is still working underhand to force his halfpence upon us, and if he can by help of his friends in England prevail so far as to get an order that the commissioners and collectors of the King's money shall receive them, and that the army is to be paid with them, then he thinks his work shall be done. And this is the difficulty you will be under in such a case. For the common soldier when he goes to the market or alehouse will offer this money, and if it be refused, perhaps he will swagger and hector, and threaten to beat the butcher or alewife, or take the goods by force, and throw them the bad halfpence. In this and the like cases, the shopkeeper or victualler, or any other tradesman has no more to do, than to demand ten times the price of his goods, if it is to be paid in Wood's money; for example, twenty-pence of that money for a quart of ale, and so in all things else, and not part with his goods till he gets the money."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[115]"
    "line_start": 1308
    "source_sequence": 146
  "translation_ja": "それでもウッドは、半ペニーをこちらに押しつけようと、今も陰で動いています。イングランドの友人たちの力を借り、国王の金を扱う委員や徴収官にこの銅貨を受け取らせ、軍隊の給与もこれで支払わせる命令まで取り付けられれば、仕事は済んだも同然だと考えているのです。そうなれば、皆さんはこんな苦境に立たされます。兵卒が市場やエール酒場へ行ってこの金を出し、断られると、威張り散らして脅し、肉屋や酒場の女主人を殴ると言い出すかもしれません。あるいは、商品を力ずくで取り上げ、代わりにこの悪い半ペニーを投げつけるかもしれません。こうした場合や、それに似た場合、商店主も飲食店主も、ほかの商売の人も、ウッドの金で支払うなら商品は十倍の値段だと要求すれば、それでよいのです。たとえば、エール一クォートなら、その金で二十ペンスを求める。ほかの商品も同じようにして、代金を手にするまでは品物を渡さないことです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-012"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For suppose you go to an alehouse with that base money, and the landlord gives you a quart for four of these halfpence, what must the victualler do? His brewer will not be paid in that coin, or if the brewer should be such a fool, the farmers will not take it from them for their bere,[19] because they are bound by their leases to pay their rents in good and lawful money of England, which this is not, nor of Ireland neither, and the 'squire their landlord will never be so bewitched to take such trash for his land, so that it must certainly stop somewhere or other, and wherever it stops it is the same thing, and we are all undone."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[116]"
    "line_start": 1323
    "source_sequence": 147
  "translation_ja": "たとえば、皆さんがこの粗悪な金を持ってエール酒場へ行き、主人が半ペニー四枚と引き換えに一クォートを出してくれたとしましょう。では、その酒場の主人はどうすればよいのでしょう。醸造業者は、その銅貨で払われることを承知しません。仮に醸造業者が、そんな愚かな真似をしたとしても、農民は醸造用の大麦[19]の代金として、それを受け取らないでしょう。農民は、小作契約によって、イングランドの正当な法定貨幣で地代を払わなければならないからです。この金は、その貨幣ではありません。アイルランドの法定貨幣でもありません。地主も、自分の土地の対価にそんながらくたを受け取るほど、気がふれたようにはならないでしょう。ですから、どこかで必ず行き詰まるのです。どこで止まっても結果は同じで、私たちは皆、破滅してしまいます。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-019-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Bere = barley. Cf. A.S. baerlic, Icelandic, barr, meaning barley, the grain used for making malt for the preparation of beer. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[117]"
    "line_start": 1334
    "source_sequence": 148
  "translation_ja": "Bereは大麦のこと。アングロサクソン語のbaerlic、アイスランド語のbarrを参照。いずれも、ビールを醸造する麦芽の原料となる穀物、大麦を意味する。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-013"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The common weight of these halfpence is between four and five to an ounce, suppose five, then three shillings and fourpence will weigh a pound, and consequently twenty shillings will weigh six pound butter weight. Now there are many hundred farmers who pay two hundred pound a year rent. Therefore when one of these farmers comes with his half-year's rent, which is one hundred pound, it will be at least six hundred pound weight, which is three horse load."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[118]"
    "line_start": 1339
    "source_sequence": 149
  "translation_ja": "この半ペニー銅貨は、ふつう一オンスにつき四枚から五枚の重さです。五枚だとすると、三シリング四ペンスで重さ一ポンド、したがって二十シリングでは、バターを量るときの重さで六ポンドになります。さて、年二百ポンドの地代を払う農民は何百人もいます。その一人が半年分の地代、つまり百ポンドを納めに来ると、それは少なくとも六百ポンドの重さとなり、馬三頭分の荷物になるのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-014"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If a 'squire has a mind to come to town to buy clothes and wine and spices for himself and family, or perhaps to pass the winter here; he must bring with him five or six horses loaden with sacks as the farmers bring their corn; and when his lady comes in her coach to our shops, it must be followed by a car loaden with Mr. Wood's money. And I hope we shall have the grace to take it for no more than it is worth."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[119]"
    "line_start": 1348
    "source_sequence": 150
  "translation_ja": "郷紳が、自分や家族の衣服、ワイン、香辛料を買いに町へ来ようとしたり、こちらで冬を過ごそうとしたりすれば、農民が穀物を運ぶときと同じく、袋を積んだ馬を五、六頭連れてこなければなりません。奥方が馬車で私たちの店へおいでになるときも、その後ろにはウッド氏の貨幣を満載した荷車がついてこなければならないのです。その際には私たちにも、それを実際の値打ち以上では受け取らないだけの分別があってほしいものです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-015"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "They say 'Squire Conolly[20] has sixteen thousand pounds a year, now if he sends for his rent to town, as it is likely he does, he must have two hundred and forty horses to bring up his half-year's rent, and two or three great cellars in his house for stowage. But what the bankers will do I cannot tell. For I am assured, that some great bankers keep by them forty thousand pounds in ready cash to answer all payments, which sum, in Mr. Wood's money, would require twelve hundred horses to carry it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[120]"
    "line_start": 1356
    "source_sequence": 151
  "translation_ja": "コノリー殿[20]には、年一万六千ポンドの収入があるそうです。おそらくそうしておいででしょうが、地代を町へ取り寄せようとなされば、半年分を運ぶのに馬二百四十頭、家にしまうのに大きな地下室が二つか三つは必要になります。けれども銀行家たちがどうするのか、私には見当もつきません。大きな銀行家の中には、あらゆる支払いに応じるため、四万ポンドの現金を手元に置いている人もいると、確かな筋から聞いています。この金額をウッド氏の貨幣で運ぶには、馬千二百頭が必要になるのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-020-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "William Conolly (d. 1729) was chosen Speaker of the Irish House of Commons on November 12th, 1715. He held this office until October 12th, 1729. Swift elsewhere says that Wharton sold Conolly the office of Chief Commissioner of the Irish Revenue for £3,000. Between the years 1706 and 1729 Conolly was ten times selected for the office of a Lord Justice of Ireland. The remark in the text as to Conolly's income is repeated by Boulter (\"Letters,\" vol. i., p. 334), though the Primate writes of £17,000 a year. The reference to Conolly is of set purpose, because Conolly had advocated the patent as against Midleton's condemnation of it. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[121]"
    "line_start": 1365
    "source_sequence": 152
  "translation_ja": "ウィリアム・コノリー（一七二九年没）は、一七一五年十一月十二日にアイルランド庶民院議長に選出され、一七二九年十月十二日まで在職した。スウィフトは別の箇所で、ウォートンがアイルランド歳入委員会の首席委員の職を、三千ポンドでコノリーに売ったと述べている。一七〇六年から一七二九年までの間に、コノリーは十回、アイルランドの統治委員に選ばれた。本文のコノリーの収入についての記述は、ボールターの『書簡集』第一巻三三四頁にも見える。ただし、この首座大主教は年一万七千ポンドとしている。ここでコノリーに言及するのは意図してのことである。ミドルトンが特許を非難したのに対し、コノリーはそれを擁護していたからである。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-016"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For my own part, I am already resolved what to do; I have a pretty good shop of Irish stuffs and silks, and instead of taking Mr. Wood's bad copper, I intend to truck with my neighbours the butchers, and bakers, and brewers, and the rest, goods for goods, and the little gold and silver I have, I will keep by me like my heart's blood till better times, or till I am just ready to starve, and then I will buy Mr. Wood's money as my father did the brass money in K. James's time,[21] who could buy ten pound of it with a guinea, and I hope to get as much for a pistole, and so purchase bread from those who will be such fools as to sell it me."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[122]"
    "line_start": 1376
    "source_sequence": 153
  "translation_ja": "私自身は、どうするかもう決めています。私にはアイルランド製の毛織物と絹織物を商う、まずまずの店があります。ウッド氏の悪質な銅貨を受け取る代わりに、近所の肉屋、パン屋、醸造屋などと、品物と品物を交換するつもりです。わずかばかり持っている金貨と銀貨は、よい時代が来るか、もう餓死するという間際まで、自分の命の血のように大切に取っておきます。そのときになったら、父がジェイムズ王の時代に真鍮貨を買ったように、ウッド氏の貨幣を買うのです。[21] 父は一ギニーで十ポンド分を買えました。私も一ピストル金貨で同じだけ買い、それでパンを買うつもりです。そんな貨幣で私にパンを売るほど愚かな人がいれば、ですが。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-021-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "James II., during his unsuccessful campaign in Ireland, debased the coinage in order to make his funds meet the demands of his soldiery. Archbishop King, in his work on the \"State of the Protestants in Ireland,\" describes the evil effects which this proceeding had: \"King James's council used not to stick at the formalities of law or reason, and therefore vast quantities of brass money were coined, and made current by a proclamation, dated 18th June, 1689, under severe penalties. The metal of which this money was made was the worst kind of brass; old guns, and the refuse of metals were melted down to make it; workmen rated it at threepence or a groat a pound, which being coined into sixpences, shillings, or half-crowns, one pound weight made about £5. And by another proclamation, dated 1690, the half-crowns were called in, and being stamped anew, were made to pass for crowns; so that then, three pence or four pence worth of metal made £10. There was coined in all, from the first setting up of the mint, to the rout at the Boyne, being about twelve months, £965,375. In this coin King James paid all his appointments, and all that received the king's pay being generally papists, they forced the protestants to part with the goods out of their shops for this money, and to receive their debts in it; so that the loss by the brass money did, in a manner, entirely fall on the protestants, being defrauded (for I can call it no better) of about, £60,000 per month by this stratagem, which must, in a few months, have utterly exhausted them. When the papists had gotten most of their saleable goods from their protestant neighbours, and yet great quantities of brass money remained in their hands, they began to consider how many of them, who had estates, had engaged them to protestants by judgments, statutes staple, and mortgages; and to take this likewise from them they procured a proclamation, dated 4 Feb. 1689, to make brass money current in all payments whatsoever.\" A proclamation of William III., dated July 10th, 1690, ordered that these crown pieces of James should pass as of equal value with one penny each. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"

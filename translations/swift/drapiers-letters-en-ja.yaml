- "id": "dl-l02-021"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I observe many of our people putting a melancholy case on this subject. \"It is true\" say they, \"we are all undone if Wood's halfpence must pass; but what shall we do, if His Majesty puts out a proclamation commanding us to take them?\" This hath been often dinned in my ears. But I desire my countrymen to be assured that there is nothing in it. The King never issues out a proclamation but to enjoin what the law permits him. He will not issue out a proclamation against law, or if such a thing should happen by a mistake, we are no more obliged to obey it than to run our heads into the fire. Besides, His Majesty will never command us by a proclamation, what he does not offer to command us in the patent itself. There he leaves it to our discretion, so that our destruction must be entirely owing to ourselves. Therefore let no man be afraid of a proclamation, which will never be granted; and if it should, yet upon this occasion, will be of no force. The King's revenues here are near four hundred thousand pounds a year, can you think his ministers will advise him to take them in Wood's brass, which will reduce the value to fifty thousand pounds. England gets a million sterl. by this nation, which, if this project goes on, will be almost reduced to nothing: And do you think those who live in England upon Irish estates will be content to take an eighth or a tenth part, by being paid in Wood's dross?"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[200]"
    "line_start": 2145
    "source_sequence": 237
  "translation_ja": "この件で、人々の多くが、こんな気の重くなる仮定を持ち出すのを耳にします。「たしかに、ウッドの半ペニー銅貨を通用させねばならないなら、私たちはみな破滅だ。しかし、陛下が受け取れと命じる布告をお出しになったら、どうすればよいのか。」この言葉を、何度も耳にたたき込まれました。しかし同国の皆さんには、それに何の根拠もないと、確信していただきたいのです。王が布告を出すのは、法律が王に認めたことを命じる場合だけです。法律に反する布告などお出しになりません。仮に何かの誤りでそんなことが起こっても、それに従う義務は、火の中へ頭を突っ込む義務と同じく、私たちにはありません。それに陛下は、特許状そのもので命じようとされなかったことを、布告で命じたりなさいません。特許状では私たちの判断に任せておられるのですから、私たちが滅びるなら、それはすべて自分たちのせいです。ですから、決して出されない布告を恐れることはありません。たとえ出されたところで、この場合には効力はないのです。この国での王の歳入は、年四十万ポンド近くあります。大臣たちが、それを五万ポンドの値打ちに減らすウッドの真鍮で受け取るよう、王に勧めると思いますか。イングランドはこの国から、スターリング貨で百万ポンドを得ていますが、この計画が進めば、それもほとんど無になってしまいます。アイルランドの土地の収入でイングランドに住んでいる人たちが、ウッドのくずで払われて八分の一や十分の一になるのを、喜んで受け入れると思いますか。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-022"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If Wood and his confederates were not convinced of our stupidity, they never would have attempted so audacious an enterprise. He now sees a spirit hath been raised against him, and he only watches till it begins to flag, he goes about \"watching\" when to \"devour us.\" He hopes we shall be weary of contending with him, and at last out of ignorance, or fear, or of being perfectly tired with opposition, we shall be forced to yield. And therefore I confess it is my chief endeavour to keep up your spirits and resentments. If I tell you there is a precipice under you, and that if you go forwards you will certainly break your necks. If I point to it before your eyes, must I be at the trouble of repeating it every morning? Are our people's \"hearts waxed gross\"? Are \"their ears dull of hearing,\" and have \"they closed their eyes\"? I fear there are some few vipers among us, who, for ten or twenty pounds gain, would sell their souls and their country, though at last it would end in their own ruin as well as ours. Be not like \"the deaf adder, who refuses to hear the voice of the charmer, charm he never so wisely.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[201]"
    "line_start": 2167
    "source_sequence": 238
  "translation_ja": "ウッドとその仲間が、私たちを愚か者だと確信していなければ、これほど大胆な企てに手を出すことはなかったでしょう。彼はいま、自分に抗する気勢が上がったのを見て、その勢いが衰え始めるのを待ち構えているだけです。私たちを「食らおう」と、「見張り」ながら歩き回っています。私たちが彼と争うのにくたびれ、ついには、無知や恐怖のため、あるいは反対にすっかり疲れ果てて、屈服せざるを得なくなることを期待しているのです。ですから、私のいちばんの努力は、皆さんの気概と憤りを保つことに向けられていると認めます。足元に崖があり、進めば必ず首を折ると私が告げ、その崖を目の前に指し示したなら、それを毎朝繰り返す手間までかけねばならないのでしょうか。私たちの民の「心は鈍くなった」のでしょうか。「耳は聞こえにくくなり」、「目を閉じた」のでしょうか。私たちの中には、十ポンド、二十ポンドのもうけのために、魂も国も売る毒蛇が、ほんの少しはいるのではないかと心配しています。結局は、私たちだけでなく、自分の破滅にもなるというのに。「いかに巧みに呪文を唱えられても、蛇使いの声を聞こうとしない、耳の聞こえない毒蛇」のようにはならないでください。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-023"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Though my letter be directed to you, Mr. Harding, yet I intend it for all my countrymen. I have no interest in this affair but what is common to the public. I can live better than many others, I have some gold and silver by me, and a shop well furnished, and shall be able to make a shift when many of my betters are starving. But I am grieved to see the coldness and indifference of many people, with whom I discourse. Some are afraid of a proclamation, others shrug up their shoulders, and cry, \"What would you have us do?\" Some give out, there is no danger at all. Others are comforted that it will be a common calamity and they shall fare no worse than their neighbours. Will a man, who hears midnight robbers at his door, get out of bed, and raise his family for a common defence, and shall a whole kingdom lie in a lethargy, while Mr. Wood comes at the head of his confederates to rob them of all they have, to ruin us and our posterity for ever? If an highwayman meets you on the road, you give him your money to save your life, but, God be thanked, Mr. Wood cannot touch a hair of your heads. You have all the laws of God and man on your side. When he or his accomplices offer you his dross it is but saying no, and you are safe. If a madman should come to my shop with an handful of dirt raked out of the kennel, and offer it in payment for ten yards of stuff, I would pity or laugh at him, or, if his behaviour deserved it, kick him out of my doors. And if Mr. Wood comes to demand any gold and silver, or commodities for which I have paid my gold and silver, in exchange for his trash, can he deserve or expect better treatment?"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[202]"
    "line_start": 2185
    "source_sequence": 239
  "translation_ja": "ハーディング氏、この書簡はあなた宛てですが、同国のすべての人々に向けて書いています。この件について、私には公共と共通するもの以外、何の利害もありません。私はほかの多くの人よりよい暮らしができます。金銀をいくらか手元に持ち、店にも品物は十分あります。私より身分の高い人々が大勢飢えていても、なんとかやっていけるでしょう。しかし、話す相手の多くが冷淡で無関心なのを見ると、私は悲しくなります。布告を恐れる人もいれば、肩をすくめて、「どうしろというのか」と言う人もいます。危険などまるでないと言いふらす人もいます。みんなの災難なのだから、隣人よりひどい目には遭わないと慰められている人もいます。夜中に戸口で強盗の音を聞いた者なら、床を出て家族を起こし、力を合わせて防ぎます。それなのに、ウッド氏が仲間を率いて全財産を奪い、私たちと子孫を永遠に破滅させようとやってくる間、王国全体は眠りこけているのでしょうか。街道で追いはぎに出会えば、命を守るため金を渡します。しかしありがたいことに、ウッド氏は皆さんの髪の毛一本にも触れられません。神と人間のあらゆる法が、皆さんの味方です。彼やその仲間が金属くずを差し出してきたら、ただ、いいえと言えばよい。それで安全なのです。狂人が、溝からかき集めた泥をひとつかみ持って私の店へ来て、毛織物十ヤードの代金だと差し出したら、私は気の毒に思うか、笑うか、振る舞い次第では戸口から蹴り出すでしょう。ウッド氏が、そのがらくたと引換えに、私の金銀や、金銀を払って仕入れた商品を求めてきたら、もっとよい待遇に値するでしょうか。それを期待できるでしょうか。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-024"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When the evil day is come (if it must come) let us mark and observe those who presume to offer these halfpence in payment. Let their names, and trades, and places of abode be made public, that every one may be aware of them, as betrayers of their country, and confederates with Mr. Wood. Let them be watched at markets and fairs, and let the first honest discoverer give the word about, that Wood's halfpence have been offered, and caution the poor innocent people not to receive them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[203]"
    "line_start": 2210
    "source_sequence": 240
  "translation_ja": "災いの日が来たら、どうしても来るというのならですが、この半ペニー銅貨を、あえて支払いに差し出す者を見定め、よく見張りましょう。名、商売、住まいを公にし、国の裏切者でありウッド氏の仲間である者として、誰もが警戒できるようにしましょう。市場や市で見張り、最初に見つけた正直者が、ウッドの半ペニー銅貨が差し出されたと触れ回り、事情を知らぬ貧しい人々に、受け取らないよう注意を促してください。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-025"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Perhaps I have been too tedious; but there would never be an end, if I attempted to say all that this melancholy subject will bear. I will conclude with humbly offering one proposal, which, if it were put in practice, would blow up this destructive project at once. Let some skilful judicious pen draw up an advertisement to the following purpose."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[204]"
    "line_start": 2219
    "source_sequence": 241
  "translation_ja": "長くなりすぎたかもしれません。しかし、この憂鬱な主題から言えることをすべて言おうとすれば、終わりがありません。最後に、つつしんで一つ提案をいたしましょう。実行すれば、この破滅的な計画をただちに吹き飛ばせる提案です。筆の立つ、判断力のある方に、次のような趣旨の告示を起草していただきたいのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-026"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "That \"Whereas one William Wood hardware-man, now or lately sojourning in the city of London, hath, by many misrepresentations, procured a patent for coining an hundred and forty thousand pounds[12] in copper halfpence for this kingdom, which is a sum five times greater than our occasions require. And whereas it is notorious that the said Wood hath coined his halfpence of such base metal and false weight, that they are, at least, six parts in seven below the real value. And whereas we have reason to apprehend, that the said Wood may, at any time hereafter, clandestinely coin as many more halfpence as he pleases. And whereas the said patent neither doth nor can oblige His Majesty's subjects to receive the said halfpence in any payment, but leaves it to their voluntary choice, because, by law the subject cannot be obliged to take any money except gold or silver. And whereas, contrary to the letter and meaning of the said patent, the said Wood hath declared that every person shall be obliged to take fivepence halfpenny of his coin in every payment. And whereas the House of Commons and Privy-council have severally addressed his Most Sacred Majesty, representing the ill consequences which the said coinage may have upon this kingdom. And lastly whereas it is universally agreed, that the whole nation to a man (except Mr. Wood and his confederates) are in the utmost apprehensions of the ruinous consequences, that must follow from the said coinage. Therefore we whose names are underwritten, being persons of considerable estates in this kingdom, and residers therein, do unanimously resolve and declare that we will never receive, one farthing or halfpenny of the said Wood's coining, and that we will direct all our tenants to refuse the said coin from any person whatsoever; Of which that they may not be ignorant, we have sent them a copy of this advertisement, to be read to them by our stewards, receivers, &c.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[205]"
    "line_start": 2226
    "source_sequence": 242
  "translation_ja": "「金物商ウィリアム・ウッドなる者は、現在、または最近までロンドン市に滞在し、数々の虚偽の申立てによって、この王国向けに、半ペニー銅貨十四万ポンド分を鋳造する特許を得た。[12] これは私たちの必要額の五倍にもなる。また、同人が鋳造した半ペニー銅貨は、金属が粗悪で重量も不正確であるため、実質価値が額面より少なくとも七分の六も不足していることは、周知の事実である。また、同人が今後いつでも、好きなだけさらに半ペニー銅貨を秘密に鋳造するおそれがあると、私たちが考える理由がある。また、この特許状は、いかなる支払いにおいても、陛下の臣民にこの半ペニー銅貨を受け取る義務を課しておらず、課すこともできず、自発的な選択に任せている。法律上、臣民に金銀以外の貨幣を受け取る義務を課すことはできないからである。また、同人は、この特許状の文言と趣旨に反し、支払いのたびに、誰もがその貨幣を五ペンス半分受け取る義務があると宣言した。また、庶民院と枢密院はそれぞれ、畏れ多くも陛下に上申し、この鋳貨がこの王国にもたらすかもしれない悪しき結果を訴えた。最後に、全国民が一人残らず、ウッド氏とその仲間を除き、この鋳貨が必ずもたらす破滅的な結果を、この上なく恐れていることは、万人の認めるところである。よって、この王国に相当の土地を持ち、ここに居住する私たち下記署名者は、ウッドの鋳造した貨幣を、一ファージングも半ペニーも決して受け取らず、また、すべての小作人に、誰からであれこの貨幣を拒むよう命じることを、全会一致で決議し、宣言する。このことを知らずにいる者がないよう、この告示の写しを小作人たちへ送り、管理人、地代徴収人その他の者に読み聞かせさせるものとする。」"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"

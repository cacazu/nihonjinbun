- "id": "dl-l07-008"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is true, that in this desperate affair of the new halfpence, I have not heard of any man above my own degree of a shopkeeper, to have been hitherto so bold, as, in direct terms, to vindicate the fatal project; although I have been told of some very mollifying expressions which were used, and very gentle expedients proposed and handed about, when it first came under debate: But, since the eyes of the people have been so far opened, that the most ignorant can plainly see their own ruin, in the success of Wood's attempt; these grand compounders have been more cautious.[3]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[666]"
    "line_start": 7541
    "source_sequence": 781
  "translation_ja": "たしかに、この新しい半ペニー銅貨をめぐる絶望的な問題については、今までのところ、私と同じ商店主という身分より上の者で、この破滅的な計画をはっきりと言葉に出して弁護するほど大胆な人物がいるとは、耳にしておりません。とはいえ、初めて議論になったころには、ずいぶんと事を丸く収める言い回しが使われ、実に穏やかな折衷策が提案されて方々に回された、と聞いております。しかし、国民の目がここまで開かれ、もっとも無知な者にも、ウッドの企ての成功は自分たちの破滅なのだとはっきりわかるようになって以来、この大立者の妥協屋たちも、以前より慎重になりました。[3]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-note-003-001"

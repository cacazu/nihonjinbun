- "id": "dl-l05-002"
  "section_id": "letter-05-advertisement"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The former of the two following papers is dated Oct. 6th 1724[3], by which it appears to be written a little after the proclamation against the author of the Drapier's Fourth Letter. It is delivered with much caution, because the author confesseth himself to be Dean of St. Patrick's; and I could discover his name subscribed at the end of the original, although blotted out by some other hand, I can tell no other reason why it was not printed, than what I have heard; that the writer finding how effectually the Drapier had succeeded, and at the same time how highly the people in power seemed to be displeased, thought it more prudent to keep the paper in his cabinet. However, having received some encouragement to collect into one volume all papers relating to Ireland, supposed to be written by the Drapier; and knowing how favourably that author's writings in this kind have been received by the public; to make the volume more complete, [I procured a copy of the following letter from one of the author's friends, with whom it was left, while the author was in England; and][4] I have printed it as near as I could in the order of time."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[506]"
    "line_start": 5654
    "source_sequence": 583
  "translation_ja": "以下の二篇のうち初めのものには一七二四年十月六日という日付がある[3]。したがって、ドレイピアの第四書簡の著者に対する布告が出てから、ほどなくして書かれたものとわかる。筆者は自分が聖パトリック大聖堂の首席司祭であると認めているため、たいへん慎重な述べ方をしている。また、原稿の末尾には、別人の手で消されてはいたものの、その名が署名されているのを見分けることができた。これが印刷されなかった理由として私が挙げられるのは、聞き及んだ次の話だけである。つまり筆者は、ドレイピアの企てがいかに功を奏したかを知るとともに、権力者たちがそれをどれほど不快に思っているらしいかを知り、この文書を机の中にしまっておくほうが賢明だと考えた、というのである。しかし、ドレイピアが書いたとされるアイルランド関係の文書をすべて一巻に集めるよう勧められ、また、この種の著作がいかに好意をもって世間に迎えられてきたかを知っていた私は、この巻をさらに充実させるため、［著者がイングランドに滞在中、原稿を預かっていたその友人の一人から、以下の書簡の写しを手に入れ、］[4]できるかぎり年代順になるように印刷した。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "early_editor_preface"

    "line_start": 3528
    "source_sequence": 357
  "translation_ja": "しかし、この特許状を発給する前には、この王国の誰に相談する必要もなく、私たちの間に銅貨が必要かどうか、少しも調べなくてよいとされていたのに、今になってようやく、何もかも済み、特許状が発給されて久しく、ウッドがすでに一万七千ポンドを鋳造し、その六倍をさらに鋳造する道具と設備も整えたあとで、委員会はこの件を調査の対象にしてくださったのです。ウッドは証人を出すことを許されています。先にも述べたように全部で四人で、そのうち三人がコールビー、ブラウン、銀行家のフィンリー氏です。そして、この者たちは、アイルランドで銅貨がきわめて不足していることを証明するはずでした。最初の者は、国庫の金を盗んだかどで裁判にかけられたときから、ほとんど二十年、この王国を離れていました。したがって、その知識も信用も、同じ程度のものです。二番目の者は、もっと事情に通じた証人と認めてもよいでしょう。「偽証と偽証の教唆によって、議会議員ジョン・ビンガム氏の生命を奪おうと企てた」件で、庶民院が法務総裁に起訴を命じてから、まだ一年もたっていないと思うからです。彼は、小銭が足りないので労働者に割符で支払わざるを得なかった、と述べました。イングランドでも、アンブローズ・クローリー卿らがよく行ったことです。[11] しかし、彼をもっとよく知る人々は、別の理由を挙げます。この話にそもそも事実があるのなら、労働者に割符で支払わざるを得なかったのは、半ペニー銅貨ではなく、もっとまともな金がなかったからだというのです。それは大いにあり得ます。偽証教唆、偽造、偽証、強姦を働く輩は、たいてい財産のない者か、悪徳と浪費で財産を使い果たした者だからです。三番目の証人フィンリー氏は、アイルランドに銅貨が不足しているかどうかは知らないと、正直に認めました。彼の目的はただ、ウッドから一定量を大幅な値引きで買い取り、できるだけうまく売りさばいて、自分の懐に二、三千ポンドを収めることだったのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"

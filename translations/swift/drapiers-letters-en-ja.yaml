- "id": "dl-l04-note-016-003"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"MY LORD,"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/h3[26]"
    "line_start": 4862
    "source_sequence": 486
  "translation_ja": "「閣下、"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-004"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"It is above a month since I took the boldness of writing to your excellency, upon a subject wherein the welfare of this kingdom is highly concerned."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[423]"
    "line_start": 4865
    "source_sequence": 487
  "translation_ja": "「この王国の幸福に深くかかわる問題について、私が大胆にも閣下に書簡を差し上げてから、一か月余りが過ぎました。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-005"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"I writ at the desire of several considerable persons here, who could not be ignorant that I had the honour of being well known to you."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[424]"
    "line_start": 4870
    "source_sequence": 488
  "translation_ja": "「当地の数名の有力な方々の御希望により、書いたものです。その方々は、私が閣下によく知られている栄誉に浴していることを、当然ご承知でした。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-006"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"I could have wished your excellency had condescended so far, as to let one of your under clerks have signified to me that a letter was received."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[425]"
    "line_start": 4874
    "source_sequence": 489
  "translation_ja": "「閣下には、下級書記のお一人に、書簡を受け取った旨を私へ知らせるくらいには、御身を低くしていただきたかったものです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-007"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"I have been long out of the world; but have not forgotten what used to pass among those I lived with while I was in it: and I can say, that during the experience of many years, and many changes in affairs, your excellency, and one more, who is not worthy to be compared to you, are the only great persons that ever refused to answer a letter from me, without regard to business, party, or greatness; and if I had not a peculiar esteem for your personal qualities, I should think myself to be acting a very inferior part in making this complaint."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[426]"
    "line_start": 4878
    "source_sequence": 490
  "translation_ja": "「私は長く世間を離れておりますが、その中にいたころ、付き合っていた人々の間で何が普通に行われていたかを、忘れたわけではありません。そして、長年の経験と、政情の幾多の変化を通じて申せるのは、閣下と、閣下とは比較するにも値しないもう一人だけが、用件や党派や地位の高低を問わず、私からの書簡に返答することを拒んだ、唯一の高位の方々だということです。閣下のお人柄に特別な敬意を抱いていなければ、このような苦情を申し上げる自分を、ずいぶん卑しい役を演じていると思ったことでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-008"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"I never was so humble, as to be vain upon my acquaintance with men in power, and always rather chose to avoid it when I was not called. Neither were their power or titles sufficient, without merit, to make me cultivate them; of which I have witnesses enough left, after all the havoc made among them, by accidents of time, or by changes of persons, measures, and opinions."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[427]"
    "line_start": 4888
    "source_sequence": 491
  "translation_ja": "「私は、権力の座にある人々と知り合いだというだけで得意になるほど、へりくだったことは一度もなく、呼ばれないときは、むしろその付き合いを避けることにしてきました。また、本人の値打ちがなければ、その権力や称号だけで、私に親交を求めさせることはできませんでした。このことの証人は、時の巡り合わせや、人、政策、意見の変化によって、ずいぶん多くが失われたあとでも、まだ十分に残っています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-009"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"I know not how your conception of yourself may alter, by every new high station; but mine must continue the same, or alter for the worse."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[428]"
    "line_start": 4896
    "source_sequence": 492
  "translation_ja": "「閣下が新しい高位に就かれるたびに、御自身についてのお考えがどう変わるのか、私には分かりません。しかし私の考えは、同じままであるか、悪いほうへ変わるかの、どちらかでなければなりません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-010"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"I often told a great minister, whom you well know, that I valued him for being the same man through all the progress of power and place. I expected the like in your lordship; and still hope that I shall be the only person who will ever find it otherwise."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[429]"
    "line_start": 4900
    "source_sequence": 493
  "translation_ja": "「私は、閣下もよく御存じのある偉大な大臣に、権力と地位のあらゆる昇進を通じて同じ人物であり続けるからこそ、尊敬するのだと、よく申し上げました。閣下にも同じことを期待しておりましたし、そうではないと気づく者が、私一人で終わるよう、今も願っております。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-011"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"I pray God to direct your excellency in all your good undertakings, and especially in your government of this kingdom."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[430]"
    "line_start": 4906
    "source_sequence": 494
  "translation_ja": "「閣下のあらゆる善い事業、とりわけこの王国の統治において、神の御導きがありますよう、お祈りいたします。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-012"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"I shall trouble you no more; but remain, with great respect, my Lord,"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[431]"
    "line_start": 4910
    "source_sequence": 495
  "translation_ja": "「これ以上、お煩わせはいたしません。閣下に深い敬意を捧げつつ、"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-013"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"Your excellency's most obedient,"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[432]"
    "line_start": 4913
    "source_sequence": 496
  "translation_ja": "「閣下に最も従順な、"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-014"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"and most humble servant,"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[433]"
    "line_start": 4916
    "source_sequence": 497
  "translation_ja": "「最も謙虚な僕、"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-015"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"JON. SWIFT.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/h3[27]"
    "line_start": 4919
    "source_sequence": 498
  "translation_ja": "「ジョナサン・スウィフト」"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-016"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This letter brought an immediate reply from Carteret, who confessed himself in the wrong for his silence, and trusted he had not forfeited Swift's friendship by it. With regard to Mr. Wood's patent, he said that the matter was under examination, \"and till that is over I am not informed sufficiently to make any other judgment of the matter, than that which I am naturally led to make, by the general aversion which appears to it in the whole nation.\" Swift replied in a charming vein, and elegantly put his scolding down to the testiness of old age. His excellency had humbled him. \"Therefore, I fortel that you, who could so easily conquer so captious a person, and of so little consequence, will quickly subdue this whole kingdom to love and reverence you\" (Scott's ed. 1824, vol. xvi., pp. 430-435). [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[434]"
    "line_start": 4922
    "source_sequence": 499
  "translation_ja": "この書簡に対して、カータレットは直ちに返事を寄こし、沈黙していたのは自分が悪かったと認め、それによってスウィフトの友情を失ってはいないと信じたいと述べた。ウッド氏の特許状については、目下調査中であり、「それが終わるまでは、国民全体に見られる一般的な反感によって自然に導かれる判断以外には、この件について判断を下すのに十分な情報を得ていません」と述べた。スウィフトは魅力的な調子で返事をし、自分の叱責を、年を取って気難しくなったためだと、巧みに取り繕った。閣下は自分をへこませてしまったのだという。「それゆえ私は、これほど気難しく、これほど取るに足りぬ者を、これほど容易に征服できたあなたなら、まもなくこの王国全体を従わせて、あなたを愛し敬うようにするだろうと予言します」（スコット版、一八二四年、第十六巻、四三〇―四三五頁）。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-025"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is true indeed, that within the memory of man, there have been governors of so much dexterity, as to carry points of terrible consequence to this kingdom, by their power with those who were in office, and by their arts in managing or deluding others with oaths, affability, and even with dinners. If Wood's brass had in those times been upon the anvil, it is obvious enough to conceive what methods would have been taken. Depending persons would have been told in plain terms, that it was a \"service expected from them, under pain of the public business being put into more complying hands.\" Others would be allured by promises. To the country gentleman, besides good words, burgundy and closeting. It would perhaps have been hinted how \"kindly it would be taken to comply with a royal patent, though it were not compulsory,\" that if any inconveniences ensued, it might be made up with other \"graces or favours hereafter.\" That \"gentlemen ought to consider whether it were prudent or safe to disgust England:\" They would be desired to \"think of some good bills for encouraging of trade, and setting the poor to work, some further acts against Popery and for uniting Protestants.\" There would be solemn engagements that we should \"never be troubled with above forty thousand pounds in his coin, and all of the best and weightiest sort, for which we should only give our manufactures in exchange, and keep our gold and silver at home.\" Perhaps a \"seasonable report of some invasion would have been spread in the most proper juncture,\" which is a great smoother of rubs in public proceedings; and we should have been told that \"this was no time to create differences when the kingdom was in danger.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[435]"
    "line_start": 4936
    "source_sequence": 500
  "translation_ja": "確かに、人々の記憶の届く時代にも、在職者への影響力を使い、ほかの人々を誓いの言葉や愛想のよさ、さらには晩餐によって操り、あるいは欺く術を使って、この王国に恐ろしい結果をもたらす事柄を押し通すほど、手腕に富んだ統治者はいました。もしそのころ、ウッドの真鍮が金床に載っていたなら、どんな手段が採られたかは、容易に想像できます。地位に頼る人々には、はっきりと、それは「彼らに期待される奉仕であり、果たさなければ、公務はもっと従順な者の手に渡される」と告げられたでしょう。ほかの人々は約束で釣られるでしょう。地方の郷紳には、甘い言葉に加えて、ブルゴーニュ酒と内密の会談です。おそらく、「強制ではないとはいえ、国王の特許状に従えば、いかに喜ばれるか」、不都合が生じても、「後日、ほかの恩恵や厚遇で」埋め合わせられるかもしれない、とほのめかされたことでしょう。「イングランドの機嫌を損ねることが、賢明で安全かどうかを、紳士たちは考えるべきだ」と言われたでしょう。「貿易を奨励し、貧民に仕事を与えるよい法案、教皇派に対する追加の法律、プロテスタントを団結させる法律を考えてほしい」と頼まれたでしょう。「彼の貨幣で四万ポンドを超えて悩まされることは決してなく、それもすべて最良で最も重い種類であり、その交換には製品を渡すだけで、金銀は国内にとどめられる」と、厳粛な約束がされたでしょう。ことによると、公的な手続上の障害を取り除くのに大いに役立つ、「侵略に関する時宜を得た噂が、最も適切な時機に流され」、「王国が危険にあるとき、いざこざを起こす時ではない」と、私たちは言われたかもしれません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-026"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These, I say, and the like methods would in corrupt times have been taken to let in this deluge of brass among us; and I am confident would even then have not succeeded, much less under the administration of so excellent a person as the Lord Carteret, and in a country where the people of all ranks, parties and denominations are convinced to a man, that the utter undoing of themselves and their posterity for ever will be dated from the admission of that execrable coin; that if it once enters, it can be no more confined to a small or moderate quantity, than the plague can be confined to a few families, and that no equivalent can be given by any earthly power, any more than a dead carcass can be recovered to life by a cordial."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[436]"
    "line_start": 4962
    "source_sequence": 501
  "translation_ja": "つまり、腐敗した時代には、この真鍮の洪水を私たちの間に流れ込ませるため、これらやその類の方法が採られたでしょう。しかし私は、そのころでさえ成功しなかったと確信しています。まして、カータレット卿ほど優れた人物の統治のもとでは、なおさらです。しかもこの国では、あらゆる身分、党派、宗派の人々が、一人残らず確信しているのです。あの呪わしい貨幣を受け入れる日が、自分たちと子孫の永遠の完全な破滅の始まりになること、ひとたび入り込めば、疫病を数家族にとどめておけないのと同様に、小量やほどほどの量に限ることはできないこと、そして死骸を気付け薬で生き返らせられないのと同様、地上のどの権力にも、それに見合う代償は与えられないことを。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-027"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is one comfortable circumstance in this universal opposition to Mr. Wood, that the people sent over hither from England to fill up our vacancies ecclesiastical, civil and military, are all on our side: Money, the great divider of the world, hath by a strange revolution, been the great uniter of a most divided people. Who would leave a hundred pounds a year in England (a country of freedom) to be paid a thousand in Ireland out of Wood's exchequer. The gentleman they have lately made primate[17] would never quit his seat in an English House of Lords, and his preferments at Oxford and Bristol, worth twelve hundred pounds a year, for four times the denomination here, but not half the value; therefore I expect to hear he will be as good an Irishman, upon this article, as any of his brethren, or even of us who have had the misfortune to be born in this island. For those, who, in the common phrase, do not \"come hither to learn the language,\" would never change a better country for a worse, to receive brass instead of gold."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[437]"
    "line_start": 4975
    "source_sequence": 502
  "translation_ja": "ウッド氏へのこの全国的な反対には、一つ心強い事情があります。聖職、文官、武官の空席を埋めるためイングランドから送り込まれた人々が、皆、私たちの味方だということです。世界を大きく分かつ金が、奇妙な逆転によって、この上なく分裂した国民を大いに団結させるものとなりました。自由な国イングランドでの年百ポンドを捨て、アイルランドでウッドの金庫から千ポンド払ってもらおうとする者が、いるでしょうか。最近、首座大主教にされた方は、[17] イングランドの貴族院の議席と、年千二百ポンドになるオックスフォードとブリストルの聖職を捨てて、当地で額面は四倍でも、価値は半分にもならないものを受け取ろうとは、なさらないでしょう。ですから私は、この件については、その方もほかの主教たちに劣らず、さらにはこの島に生まれるという不運に遭った私たちにさえ劣らず、立派なアイルランド人になると聞くのを期待しています。普通の言い方でいって、「言葉を習いにここへ来る」のではない人々なら、金の代わりに真鍮を受け取るために、よい国を悪い国に換えようとは、決してしないでしょうから。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"

  "source_text": "2 Inst. 576. [ORIG. ED.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[134]"
    "line_start": 1524
    "source_sequence": 165
  "translation_ja": "『法学提要』第二部五七六頁。［原刊］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_original_edition_note"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "原刊注の表示[ORIG. ED.]。個人の著者署名なし。"
- "id": "dl-l01-024"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This book is very ancient, and of great authority for the time in which it was wrote, and with that character is often quoted by that great lawyer my Lord Coke.[26] By the law of England, the several metals are divided into lawful or true metal and unlawful or false metal, the former comprehends silver or gold; the latter all baser metals: That the former is only to pass in payments appears by an act of Parliament[27] made the twentieth year of Edward the First, called the \"Statute concerning the Passing of Pence,\" which I give you here as I got it translated into English, for some of our laws at that time, were, as I am told writ in Latin: \"Whoever in buying or selling presumeth to refuse an halfpenny or farthing of lawful money, bearing the stamp which it ought to have, let him be seized on as a contemner of the King's majesty, and cast into prison.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[135]"
    "line_start": 1527
    "source_sequence": 166
  "translation_ja": "この本はきわめて古く、書かれた時代について大きな権威を持ち、あの偉大な法律家クック卿もしばしばそのような書物として引用しています。[26] イングランド法では、さまざまな金属を、適法な、すなわち真正な金属と、不法な、すなわち偽りの金属とに分けています。前者に含まれるのは銀と金、後者はそれより卑しい金属すべてです。支払いに用いてよいのが前者だけであることは、エドワード一世の治世第二十年に制定された、「ペンス貨の通用に関する法」という議会制定法から分かります。[27] 当時の法律にはラテン語で書かれたものもあるそうですので、英訳してもらったままを、ここにお伝えします。「売買において、所定の刻印を備えた適法な貨幣である半ペニー貨またはファージング貨を、あえて拒む者は、国王陛下を侮る者として捕らえ、牢に投ぜよ。」"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

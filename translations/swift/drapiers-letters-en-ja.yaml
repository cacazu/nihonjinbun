    "evidence_ja": "Faulkner版に置かれた刊行前付。ScottはSwiftの指示下の可能性とするが著者とは断定しない。"
- "id": "dl-l05-note-002-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Nichols, in the second volume of his Supplement to Swift's Works (1779, 8vo), prints a note on this \"Advertisement,\" furnished him by Bowyer. It is as follows:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[507]"
    "line_start": 5672
    "source_sequence": 584
  "translation_ja": "ニコルズは『スウィフト著作補遺』第二巻（一七七九年、八折判）に、バウヤーから提供された、この「告知」についての注を載せている。次のとおりである。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-note-002-002"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"1. The first of the papers is said to be dated Oct. 6, 1724; and that it appears from thence to be dated a little after the proclamation against the Drapier's fourth letter. Now the fourth letter itself is dated Oct. 23, 1724. This is a pardonable mistake anywhere, but, much more in a country where going before just coming after is the characteristic dialect. But I little thought that the Dean, in his zeal for Ireland, would vouchsafe to adopt the shibboleth of it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[508]"
    "line_start": 5677
    "source_sequence": 585
  "translation_ja": "「一、最初の文書の日付は一七二四年十月六日とされ、そこから、ドレイピアの第四書簡に対する布告が出てからほどなくして書かれたものとされている。ところが第四書簡そのものの日付は一七二四年十月二十三日である。どこでも大目に見られる間違いだが、「前に来る」がそのまま「後に来る」になるのが、その土地特有の言い回しである国なら、なおさらのことだ。それでも首席司祭が、アイルランドへの熱意のあまり、そのお国ぶりを示す合言葉まで採り入れてくださるとは、思ってもみなかった。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-note-002-003"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"2. The Preface-writer, in the choice MS which he found, could discover the Dean's name subscribed at the end of the original; but blotted out by some other hand. As the former passage is a proof that the Advertisement was drawn up in Ireland, so this affords a strong presumption that it was under the direction of the Dean himself: for who else could divine that his name was struck out by another hand? Other ink it might be: but in these recent MSS. of our age, it is the first time I ever heard of a blot carrying the evidence of a handwriting. Whether the Dean or the printer hit this blot, I shall not inquire; but lay before you the pleasant procedure of the latter upon this discovery. He had got, we see, the original in the Dean's hand; but the name was obliterated. What does he, but send away to England for a copy which might authenticate his original; and from such a copy the public is favoured with it! I remember, in a cause before Sir Joseph Jekyll, a man began reading in court the title-deeds of an estate which was contested. 'The original is a little blind,' says he; 'I have got a very fair copy of it, which I beg leave to go on with'—'Hold,' says Sir Joseph, 'if the original is not good, the copy can never make it so.' I am far, however, from accusing the printer of intending any fraud on the world. He who tells his story so openly gives security enough for his honesty. I can easily conceive the Advertisement might be in a good measure the Dean's, who never was over-courteous to his readers, and might for once be content to be merry with them.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[509]"
    "line_start": 5686
    "source_sequence": 586
  "translation_ja": "「二、この序文の筆者は、見つけた貴重な手稿の原本の末尾に、別人の手で消されてはいたものの、首席司祭の署名を見分けることができたという。先ほどの箇所がこの告知のアイルランド製である証拠となるとすれば、こちらは首席司祭自身の指図の下で書かれたことを強く推測させる。ほかの誰に、名が別人の手で消されたと見抜けるだろうか。違うインクだった可能性はある。だが、われわれの時代のこうした新しい手稿で、消し跡が筆跡の証拠を帯びているという話を聞いたのは、これが初めてだ。首席司祭と印刷者のどちらがこの消し跡を突いたかは問わず、この発見に続く後者の愉快な手続きをお目にかけよう。見てのとおり、彼は首席司祭自筆の原稿を手に入れた。ところが名は消されている。そこで何をしたかというと、自分の原本の真正さを証明できる写しを取り寄せるため、はるばるイングランドへ人をやったのであり、世間はそうした写しを通じて、この文書を恵んでいただくのである！　かつてサー・ジョゼフ・ジーキルの法廷で、ある男が、係争中の土地の権利証書を読み始めたのを覚えている。『原本は少々読みにくいので』と男は言った。『たいへん鮮明な写しを持ってきました。これで続けさせていただきたいのです』――『待ちなさい』とサー・ジョゼフは言った。『原本が有効でなければ、写しで有効にすることはできない』。もっとも私は、印刷者が世間を欺こうとしたと非難するつもりは毛頭ない。これほどあけすけに事情を語る者なら、その正直さの保証としては十分である。この告知は大部分が首席司祭の筆になったものだとしても、私にはたやすく理解できる。あの方はもともと読者に過度の礼儀を尽くしたことなどなく、たまには読者をからかって楽しもうとしても、不思議はないからだ。」[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":

- "id": "dl-l03-053"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I must beg leave to caution your lordships and worships in one particular. Wood hath graciously promised to load us at present only with forty thousand pounds of his coin, till the exigences of the kingdom require the rest. I entreat you will never suffer Mr. Wood to be a judge of your exigences. While there is one piece of silver or gold remaining in the kingdom he will call it an exigency, he will double his present quantum by stealth as soon as he can, and will have the remainder still to the good. He will pour his own raps[22]and counterfeits upon us: France and Holland will do the same; nor will our own coiners at home be behind them: To confirm which I have now in my pocket a rap or counterfeit halfpenny in imitation of his, but so ill performed, that in my conscience I believe it is not of his coining."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[366]"
    "line_start": 4214
    "source_sequence": 420
  "translation_ja": "貴族ならびに郷紳の皆様には、一点、あえてご注意を申し上げなければなりません。ウッドは、ありがたくも、王国の必要が残りを求めるまでは、今のところ自分の貨幣を四万ポンド分だけ私たちに背負わせると約束しました。皆様の必要を判断する役を、決してウッド氏に任せないでいただきたいのです。王国内に金貨か銀貨が一枚でも残っていれば、彼はそれを必要だと言い、できるだけ早く、ひそかに現在の量を倍にしても、なお残りを出す余地を持ち続けるでしょう。自分で作ったラップ貨や、[22] 偽造貨幣を私たちに注ぎ込むでしょう。フランスもオランダも同じことをし、わが国内の偽造屋たちも引けを取らないでしょう。その証拠に、今私の懐には、彼のものをまねたラップ貨、つまり偽の半ペニー銅貨が一枚あります。ただし出来があまりに悪いので、私は心から、彼自身の鋳造ではないと思っています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-022-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The word Rap is probably a contraction of \"raparee,\" and was the name given to the tokens that passed current in Ireland for copper coins of small value. Generally it referred to debased coins; hence it may be allied to \"raparee,\" who might be considered as a debased citizen. The raparees were so called from the rapary or half-pike they carried. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[367]"
    "line_start": 4228
    "source_sequence": 421
  "translation_ja": "Rapという語は、おそらくrapareeの短縮形で、アイルランドで小額の銅貨として通用した代用貨幣に与えられた名である。一般には粗悪な貨幣を指したので、粗悪な国民と見なし得るrapareeと関連するのかもしれない。ラパリーたちは、その携帯するrapary、すなわち短槍にちなんでそう呼ばれた。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-054"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I must now desire your lordships and worships that you will give great allowance for this long undigested paper, I find myself to have gone into several repetitions, which were the effects of haste, while new thoughts fell in to add something to what I had said before. I think I may affirm that I have fully answered every paragraph in the Report, which although it be not unartfully drawn, and is perfectly in the spirit of a pleader who can find the most plausible topics in behalf of his client, yet there was no great skill required to detect the many mistakes contained in it, which however are by no means to be charged upon the right honourable Committee, but upon the most false impudent and fraudulent representations of Wood and his accomplices. I desire one particular may dwell upon your minds, although I have mentioned it more than once; That after all the weight laid upon precedents there is not one produced in the whole Report, of a patent for coining copper in England to pass in Ireland, and only two patents referred to (for indeed there were no more) which were both passed in Ireland, by references to the King's Council here, both less advantageous to the coiner than this of Wood, and in both securities given to receive the coin at every call, and give gold and silver in lieu of it. This demonstrates the most flagrant falsehood and impudence of Wood, by which he would endeavour to make the right honourable Committee his instruments, (for his own illegal and exorbitant gain,) to ruin a kingdom, which hath deserved quite different treatment."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[368]"
    "line_start": 4235
    "source_sequence": 422
  "translation_ja": "ここで、貴族ならびに郷紳の皆様には、この長く、まとまりのない文章を、どうか大目に見ていただきたいと思います。何度も同じことを繰り返してしまいましたが、急いでいたところへ新しい考えが浮かび、先に述べたことに何かを付け加えたためです。私は、「報告」のすべての段落に十分な答えをしたと、言ってよいと思います。「報告」は決して拙く書かれてはおらず、自分の依頼人を弁護するために、いかにももっともらしい論点を見つけ出す弁護士の精神に徹していますが、その中に数多くある誤りを見抜くのに、大した手腕は要りませんでした。ただし、その誤りは、名誉ある委員会の責任では決してなく、ウッドとその仲間たちの、まったく虚偽で、厚かましく、欺瞞に満ちた説明のせいです。もう何度も述べましたが、一つの点を心に刻んでいただきたいのです。先例をあれほど重視したにもかかわらず、「報告」全体に、アイルランドで通用させる銅貨をイングランドで鋳造する特許状の先例は、一つも示されていません。言及されているのは、ただ二つの特許状であり、実際それ以上はなかったのですが、どちらも当地の国王の枢密院への照会を経て、アイルランドで発給されたものです。どちらもウッドのものほど鋳造者に有利ではなく、どちらも、請求のたびに貨幣を引き取り、その代わりに金銀を渡す担保が差し入れられていました。これで、ウッドのこの上なく甚だしい虚偽と厚顔無恥が明らかになります。彼は、自分の違法で法外な利益のために、名誉ある委員会を道具にして、まるで違う扱いを受けるに値する一王国を、破滅させようとしているのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-055"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am very sensible that such a work as I have undertaken might have worthily employed a much better pen. But when a house is attempted to be robbed it often happens that the weakest in the family runs first to stop the door. All the assistance I had were some informations from an eminent person,[23] whereof I am afraid I have spoiled a few by endeavouring to make them of a piece with my own productions, and the rest I was not able to manage: I was in the case of David who could not move in the armour of Saul, and therefore I rather chose to attack this \"uncircumcised Philistine (Wood I mean) with a sling and a stone.\" And I may say for Wood's honour as well as my own, that he resembles Goliath in many circumstances, very applicable to the present purpose; For Goliath had \"a helmet of brass upon his head, and he was armed with a coat of mail, and the weight of the coat was five thousand shekels of brass, and he had greaves of brass upon his legs, and a target of brass between his shoulders.\" In short he was like Mr. Wood, all over brass; And \"he defied the armies of the living God.\" Goliath's condition of combat were likewise the same with those of Wood. \"If he prevail against us, then shall we be his servants:\" But if it happens that I prevail over him, I renounce the other part of the condition, he shall never be a servant of mine, for I do not think him fit to be trusted in any honest man's shop."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[369]"
    "line_start": 4259
    "source_sequence": 423
  "translation_ja": "私が引き受けたような仕事には、私よりはるかに優れた書き手が取り組むのがふさわしかったことは、十分承知しています。しかし、家に泥棒が入ろうとすると、家族でいちばん弱い者が、真っ先に戸を押さえに走ることも、よくあるのです。私が受けた助けは、ある優れた人物からいただいた、いくらかの情報だけでした。[23] その一部は、自分の書いたものに調子を合わせようとして、かえって損なってしまったのではないかと心配していますし、残りは使いこなせませんでした。私はサウルの鎧を着て動けなかったダビデのようなもので、そのため、むしろこの「割礼を受けぬペリシテ人――ウッドのことです――を、石投げと石で」攻撃する道を選んだのです。そして、ウッドと私の双方の名誉のために申せば、今の話にぴったり当てはまる多くの点で、彼はゴリアテに似ています。ゴリアテは、「頭に真鍮の兜をかぶり、鎖帷子を身に着け、その鎧の重さは真鍮五千シェケルであり、脚には真鍮の脛当てを着け、肩の間には真鍮の小盾を負って」いたからです。つまり彼はウッド氏のように、全身が真鍮、厚顔そのものでした。そして「生ける神の軍勢を侮った」のです。ゴリアテの申し出た勝負の条件も、ウッドと同じでした。「彼が我々に勝てば、我々はその僕となろう」。しかし、もし私が彼に勝ったなら、私はこの条件のもう一方を放棄します。彼を私の僕にすることは、決してありません。誠実な人の店で仕事を任せられる男とは、思わないからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-023-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Mr. Robert Lindsay, a Dublin lawyer, assisted Swift on the legal points raised in the Drapier's letters. This is the Mr. Lindsay, counsellor-at-law, to whom Swift submitted a case concerning a Mr. Gorman (see Scott's edit., vol. xix., p. 294). Mr. Lindsay is supposed to be the author of two letters addressed to Chief Justice Whitshed on the matter of his conduct towards the grand jury which discharged Harding the printer (see Scott's edit., vol. vi., p. 467). [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[370]"
    "line_start": 4281
    "source_sequence": 424
  "translation_ja": "ダブリンの法律家ロバート・リンジー氏が、『ドレイピア書簡』で取り上げられた法律上の論点について、スウィフトを助けた。スウィフトがゴーマンという人物に関する案件を相談した弁護士リンジー氏とは、この人である（スコット版、第十九巻、二九四頁参照）。印刷人ハーディングを放免した大陪審に対するウィットシェッド首席裁判官の振舞いを問題として、同裁判官に宛てられた二通の書簡は、リンジー氏の作とされている（スコット版、第六巻、四六七頁参照）。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-056"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I will conclude with my humble desire and request which I made in my second letter; That your lordships and worships would please to order a declaration to be drawn up expressing, in the strongest terms, your firm resolutions never to receive or utter any of Wood's halfpence or farthings, and forbidding your tenants to receive them. That the said declaration may be signed by as many persons as possible who have estates in this kingdom, and be sent down to your several tenants aforesaid.[24]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[371]"
    "line_start": 4290
    "source_sequence": 425
  "translation_ja": "結びに、第二の書簡で述べた、私のささやかな願いとお願いを、もう一度申し上げます。貴族ならびに郷紳の皆様には、ウッドの半ペニーまたはファージング銅貨を決して受け取らず、流通させないという固い決意を、この上なく強い言葉で表し、小作人にも受取りを禁じる宣言書を、作成するよう命じていただきたいのです。そして、この王国内に領地を持つ、できるだけ多くの人々に、その宣言書へ署名していただき、それぞれの前記小作人のもとへ送り届けていただきたいのです。[24]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-024-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "A Declaration, pursuant to this request, was signed soon after by the most considerable persons of the kingdom, which was universally spread and of great use. [F.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[372]"
    "line_start": 4299
    "source_sequence": 426
  "translation_ja": "この要望に従った宣言は、まもなく王国の最も有力な人々によって署名され、あまねく広まって、大いに役立った。［F］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: F., T.S."
- "id": "dl-l03-note-024-002"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"The humble petition of the lord-mayor, sheriffs, commons, and citizens of the city of Dublin, in Common Council assembled,\" was issued as a broadside on 8th September, 1724. See also Appendix IX. [T.S.]"
  "source_languages":

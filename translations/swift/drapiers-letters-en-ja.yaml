    "line_start": 7105
    "source_sequence": 735
  "translation_ja": "しかし、一部の人々の考えがどうであれ、私に反対して署名した者の多くが、ウッド氏に反対する王国の圧倒的多数の側にいることは、認められていると思います。そして、彼とその貨幣に反対する強硬な声明の末尾に、非常に尊い方々のお名前が、私の名とたいへん仲よく並んでいるのを見て、私は大いに満足しました。とはいえ、すでに私たちの間でこの貨幣を受け入れると決まっているなら、私を売ろうとしている立派な人物は、賢明にも、できるかぎり早く実行すべきです。さもないと、その報酬を支払うための三百ポンドを、正規の金銀貨で見つけるのが難しくなるかもしれません。公衆が五十万ポンドを――この国にそれほどあるとしてですが――失い、さらに毎年の所得の五分の四を永久に失ったあとでは。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-034"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am told by lawyers, that in all quarrels between man and man, it is of much weight, which of them gave the first provocation or struck the first blow. It is manifest that Mr. Wood hath done both, and therefore I should humbly propose to have him first hanged and his dross thrown into the sea; after which the Drapier will be ready to stand his trial. \"It must needs be that offences come, but woe unto him by whom the offence cometh.\" If Mr. Wood had held his hand every body else would have held their tongues, and then there would have been little need of pamphlets, juries, or proclamations upon this occasion. The provocation must needs have been great, which could stir up an obscure indolent Drapier to become an author. One would almost think the very stones in the street would rise up in such a cause: And I am not sure they will not do so against Mr. Wood if ever he comes within their reach. It is a known story of the dumb boy, whose tongue forced a passage for speech by the horror of seeing a dagger at his father's throat. This may lessen the wonder that a tradesman hid in privacy and silence should cry out when the life and being of his political mother are attempted before his face, and by so infamous a hand."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[632]"
    "line_start": 7118
    "source_sequence": 736
  "translation_ja": "法律家から聞くところでは、人と人との争いでは、どちらが先に挑発し、最初の一撃を加えたかが、非常に重要なのだそうです。ウッド氏がその両方を行ったのは明らかですから、まず彼を絞首刑にし、そのくず銅を海に投げ捨てることを、謹んで提案します。その後ならドレイピアは、喜んで裁判を受けます。「つまずきが来るのは避けられないが、つまずきをもたらす者は災いである」。ウッド氏が手を出さなければ、ほかの者も皆、黙っていたでしょうし、この件で小冊子や陪審や布告が必要になることも、ほとんどなかったでしょう。目立たず、怠け者の羅紗商を、著述家になるまで奮い立たせたからには、挑発はよほど大きかったに違いありません。こういう大義のためなら、道端の石さえ立ち上がるのではないかと、思いそうになります。そしてウッド氏が、いつかその手の届くところへ来たなら、石が本当に彼に向かって立ち上がらないとも、私には言い切れません。口の利けない少年が、父の喉に短剣が突きつけられるのを見て恐怖にかられ、舌が通り道をこじ開けて声を発した、という話は有名です。これを思えば、人目を避け、静かに隠れ暮らしていた商人が、自分を生んだ政治上の母の命と存在が、これほど卑劣な手によって、目の前で奪われようとしているとき、声を上げたからといって、さほど不思議ではなくなるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-035"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But in the meantime, Mr. Wood the destroyer of a kingdom walks about in triumph (unless it be true that he is in jail for debt) while he who endeavoured to assert the liberty of his country is forced to hide his head for occasionally dealing in a matter of controversy. However I am not the first who hath been condemned to death for gaining a great victory over a powerful enemy, by disobeying for once the strict orders of military discipline."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[633]"
    "line_start": 7137
    "source_sequence": 737
  "translation_ja": "それなのに、王国を滅ぼすウッド氏は、得意顔で歩き回っています。借金のために牢にいるという話が本当でなければ、ですが。一方、祖国の自由を守ろうとした者は、たまたま論争に関わったために、頭を隠さなければなりません。もっとも、軍紀の厳命に一度だけ背き、強敵に大勝したため死刑を宣告された者は、私が初めてではありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-036"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am now resolved to follow (after the usual proceeding of mankind, because it is too late) the advice given me by a certain Dean. He shewed the mistake I was in of trusting to the general good-will of the people, \"that I had succeeded hitherto better than could be expected, but that some unfortunate circumstantial lapse would probably bring me within the reach of power. That my good intentions would be no security against those who watched every motion of my pen, in the bitterness of my soul.\" He produced an instance of \"a writer as innocent, as disinterested, and as well meaning as myself, where the printer, who had the author in his power, was prosecuted with the utmost zeal, the jury sent back nine times, and the man given up to the mercy of the court.\"[17] The Dean further observed \"that I was in a manner left alone to stand the battle, while others who had ten thousand times better talents than a Drapier, were so prudent to lie still, and perhaps thought it no unpleasant amusement to look on with safety, while another was giving them diversion at the hazard of his liberty and fortune, and thought they made a sufficient recompense by a little applause.\" Whereupon he concluded with a short story of a Jew at Madrid, who being condemned to the fire on account of his religion, a crowd of school-boys following him to the stake, and apprehending they might lose their sport, if he should happen to recant, would often clap him on the back, and cry, \"Sta firme Moyse (Moses, continue steadfast).\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[634]"
    "line_start": 7146
    "source_sequence": 738
  "translation_ja": "私は今、ある首席司祭から受けた忠告に従うことに決めました。もう手遅れになってからという、人間によくあるやり方ですが。その方は、私が人々の全般的な好意を当てにしたのは間違いだと指摘しました。「これまでは思いのほかうまくいったが、おそらく何か不運な細部の手落ちによって、権力の手の届くところへ引き込まれるだろう。魂の憤りのままに動く君の筆を、一筆一筆見張っている者たちに対して、善意など何の保障にもならない」と。そして、こういう例を挙げました。「君と同じく潔白で、私欲がなく、善意に満ちた筆者がいた。その著者の正体を知る印刷者が、この上ない熱心さで訴追され、陪審は九度も評議をやり直させられ、ついにはその男は法廷の情けに委ねられた」。[17]さらに首席司祭は言いました。「君は、いわば一人だけで戦いに立ち向かうままにされている。羅紗商より一万倍も優れた才のある人々は、賢明にもじっとしていて、ほかの者が自由と財産を賭けて楽しませてくれるのを、安全な場所から眺めるのは、悪くない娯楽だと思っているのかもしれない。そして少し喝采すれば、十分な礼をしたつもりでいる」。そうして最後に、マドリードのあるユダヤ人の短い話をしました。信仰のために火刑を宣告されたその男の後を、学童の一団が火刑柱までついて行きました。男が信仰を捨てると、自分たちの楽しみがなくなるのではないかと心配して、しきりに背中をたたき、「スタ・フィルメ・モイセ、モーセ、しっかり信仰を守れ」と叫んだ、という話です。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

- "id": "dl-l02-027"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I could wish, that a paper of this nature might be drawn up, and signed by two or three hundred principal gentlemen of this kingdom, and printed copies thereof sent to their several tenants; I am deceived, if anything could sooner defeat this execrable design of Wood and his accomplices. This would immediately give the alarm, and set the kingdom on their guard. This would give courage to the meanest tenant and cottager. \"How long, O Lord, righteous and true.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[207]"
    "line_start": 2259
    "source_sequence": 244
  "translation_ja": "こうした文書を起草し、この王国の主だった紳士二、三百人が署名して、印刷した写しをそれぞれの小作人へ送れればと願っています。ウッドとその共犯者の忌まわしい企みを、これより早く打ち破る方法があるとは思えません。これなら、ただちに警鐘を鳴らし、王国を警戒させることができます。最も身分の低い小作人や零細農民にさえ、勇気を与えます。「正しく、まことなる主よ、いつまでなのですか。」"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-028"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I must tell you in particular, Mr. Harding, that you are much to blame. Several hundred persons have enquired at your house for my \"Letter to the Shopkeepers, &c.\" and you had none to sell them. Pray keep yourself provided with that letter, and with this; you have got very well by the former, but I did not then write for your sake, any more than I do now. Pray advertise both in every newspaper, and let it not be your fault or mine, if our countrymen will not take warning. I desire you likewise to sell them as cheap as you can."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[208]"
    "line_start": 2268
    "source_sequence": 245
  "translation_ja": "ハーディング氏、あなたには特に、ひどく責められるべき点があると申し上げねばなりません。何百人もの人が、あなたの店へ『商店主その他の皆さんへの書簡』を求めに行ったのに、売る分がなかったというのです。あの書簡とこの書簡を、切らさず用意しておいてください。前の書簡ではあなたもずいぶんもうけましたが、あのときも今と同じく、あなたのために書いたわけではありません。両方をあらゆる新聞で広告してください。同国の人々が警告を聞き入れないとしても、それをあなたや私の落ち度にしないようにしましょう。また、できるだけ安く売っていただきたいと思います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

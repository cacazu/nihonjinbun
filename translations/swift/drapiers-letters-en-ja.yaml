- "id": "dl-l02-020"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The impudence of this remark exceeds all that went before. First; the House of Commons in Ireland, which represents the whole people of the kingdom; and secondly the Privy-council, addressed His Majesty against these halfpence. What could be done more to express the universal sense and opinion of the nation? If his copper were diamonds, and the kingdom were entirely against it, would not that be sufficient to reject it? Must a committee of the House of Commons, and our whole Privy-council go over to argue pro and con with Mr. Wood? To what end did the King give his patent for coining of halfpence in Ireland? Was it not, because it was represented to his sacred Majesty, that such a coinage would be of advantage to the good of this kingdom, and of all his subjects here? It is to the patentee's peril if his representation be false, and the execution of his patent be fraudulent and corrupt. Is he so wicked and foolish to think that his patent was given him to ruin a million and a half of people, that he might be a gainer of three or four score thousand pounds to himself? Before he was at the charge of passing a patent, much more of raking up so much filthy dross, and stamping it with His Majesty's \"image and superscription,\" should he not first in common sense, in common equity, and common manners, have consulted the principal party concerned; that is to say, the people of the kingdom, the House of Lords or Commons, or the Privy-council? If any foreigner should ask us, \"whose image and superscription\" there is in Wood's coin, we should be ashamed to tell him, it was Caesar's. In that great want of copper halfpence, which he alleges we were, our city set up our Caesar's statue[11] in excellent copper, at an expense that is equal in value to thirty thousand pounds of his coin: And we will not receive his image in worse metal."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[198]"
    "line_start": 2113
    "source_sequence": 235
  "translation_ja": "この所見の厚かましさは、それまでのすべてを上回っています。第一に、この王国の全人民を代表するアイルランド庶民院が、第二に、枢密院が、この半ペニー銅貨に反対して陛下へ上申したのです。全国民の共通の感情と意見を表すために、それ以上何ができたでしょう。彼の銅がダイヤモンドだったとしても、王国全体が反対しているなら、それだけで拒むには十分ではありませんか。庶民院の委員会も、こちらの枢密院全員も、海を渡ってウッド氏と賛否を論じ合わなければならないのでしょうか。そもそも王は、何のために、アイルランドで半ペニー銅貨を鋳造する特許をお与えになったのでしょう。その鋳貨が、この王国と、ここにいるすべての臣民のためになると、畏れ多くも陛下に申し立てられたからではありませんか。その申立てが虚偽で、特許の実施が詐欺的で不正だったなら、その危険を負うのは特許権者です。彼は、自分が六万か八万ポンドをもうけるため、百五十万の人民を破滅させよと特許を与えられたと思うほど、悪くて愚かな男なのでしょうか。特許を得る費用を出す前に、まして、あれほどの汚い金属くずをかき集め、陛下の「像と銘」を刻む前に、常識、公正、礼儀からしても、まず主たる当事者に相談すべきだったのではありませんか。つまり、この王国の人民、貴族院か庶民院、あるいは枢密院です。外国人に、ウッドの貨幣にあるのは「誰の像と銘か」と聞かれたら、カエサルのものだと答えるのが、私たちは恥ずかしくなるでしょう。彼の言うほど銅の半ペニー貨が大いに不足していた時期に、私たちの市は、わがカエサルの像を良質の銅で建てました。[11] その費用は、彼の貨幣の三万ポンド分に相当します。それより悪い金属に刻まれた陛下の像など、私たちは受け取りません。"

  "kind": "note_body"
  "origin": "source"
  "source_text": "William Molyneux (1656-1698), the correspondent of John Flamsteed and Locke. His \"Dioptrica Nova\" contains a warm appreciation of Locke's \"Essay on the Human Understanding.\" He died in October, 1698, but in the early part of this year, he published his famous inquiry into the effect of English legislation on Irish manufactures. The work was entitled, \"The Case of Ireland's being bound by Acts of Parliament in England stated,\" and its publication made a great stir both in England and in Ireland. Molyneux attempted to show that the Irish Parliament was independent of the English Parliament. His book was reported by a Committee of the House of Commons, on June 22nd, 1698, to be \"of dangerous consequence to the Crown and Parliament of England,\" but the matter went no further than embodying this resolution of the committee in an address to the King. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[625]"
    "line_start": 7026
    "source_sequence": 729
  "translation_ja": "ウィリアム・モリニュー（一六五六―一六九八）は、ジョン・フラムスティードとロックの文通相手であった。その『新光学』には、ロックの『人間知性論』への熱烈な賛辞がある。一六九八年十月に没したが、その年の初めには、イングランドの法律がアイルランドの製造業に及ぼす影響について、有名な考察を刊行した。『イングランド議会の法律によってアイルランドが拘束されることの問題を論ず』と題するこの著作は、イングランドとアイルランドの双方で大きな騒ぎを起こした。モリニューは、アイルランド議会はイングランド議会から独立していることを示そうとした。一六九八年六月二十二日、庶民院の委員会はこの著書を、「イングランドの王権と議会に、危険な結果をもたらすもの」と報告した。しかし事態は、この委員会決議を国王への上奏に盛り込む以上には、進まなかった。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"

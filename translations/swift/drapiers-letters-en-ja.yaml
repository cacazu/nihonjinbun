- "id": "dl-l06-007"
  "section_id": "letter-06-directions"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "MR. HARDING, When I sent you my former papers, I cannot say I intended you either good or hurt, and yet you have happened through my means to receive both. I pray God deliver you from any more of the latter, and increase the former. Your trade, particularly in this kingdom, is of all others the most unfortunately circumstantiated; For as you deal in the most worthless kind of trash, the penny productions of pennyless scribblers, so you often venture your liberty and sometimes your lives, for the purchase of half-a-crown, and by your own ignorance are punished for other men's actions."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[594]"
    "line_start": 6661
    "source_sequence": 694
  "translation_ja": "ハーディング氏へ。以前の原稿をお送りしたとき、あなたに得をさせようとも、損をさせようとも思っていたとは言えません。それなのに結果として、私のために両方を受けられました。これ以上損害に遭わないよう、また利益のほうが増えるよう、神に祈ります。あなたがたの商売は、とりわけこの王国では、どんな商売にも増して不幸な境遇にあります。一文なしの三文文士が作る一ペニーの読み物という、この上なくくだらないがらくたを扱うために、しばしば自由を、ときには命まで、半クラウンを得るために危険にさらし、自分の無知のために、他人の行為について罰せられるのですから。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "author_preface"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-008"
  "section_id": "letter-06-directions"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am afraid, you in particular think you have reason to complain of me for your own and your wife's confinement in prison, to your great expense, as well as hardship, and for a prosecution still impending. But I will tell you, Mr. Harding, how that matter stands. Since the press hath lain under so strict an inspection, those who have a mind to inform the world are become so cautious, as to keep themselves if possible out of the way of danger. My custom is to dictate to a 'prentice who can write in a feigned hand, and what is written we send to your house by a blackguard boy. But at the same time I do assure you upon my reputation, that I never did send you anything, for which I thought you could possibly be called to an account. And you will be my witness that I always desired you by a letter to take some good advice before you ventured to print, because I knew the dexterity of dealers in the law at finding out something to fasten on where no evil is meant; I am told indeed, that you did accordingly consult several very able persons, and even some who afterwards appeared against you: To which I can only answer, that you must either change your advisers, or determine to print nothing that comes from a Drapier."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[595]"
    "line_start": 6671
    "source_sequence": 695
  "translation_ja": "ことにあなたは、ご自分と奥様が牢に入れられ、苦労のうえに多額の費用まで負い、今なお訴追が迫っていることで、私に不平を言う理由があると、お考えなのではないかと思います。しかしハーディング氏、その事情をお話ししましょう。出版がこれほど厳しく監視されるようになって以来、世間に何かを知らせたい者たちは、できることなら危険の及ばないところに身を置くよう、たいへん慎重になりました。私は普段、筆跡を変えて書ける徒弟に口述し、できた原稿を、使い走りの少年に持たせて、あなたのお宅へ送っています。しかし同時に、私の名誉にかけて保証しますが、あなたが責任を問われる可能性があると思ったものを、お送りしたことは一度もありません。また、悪意のないところにも、法律を商う者たちが言いがかりをつける材料を見つけ出す腕前を知っていたので、あえて印刷に踏み切る前に、しかるべき助言を得るよう、いつも手紙でお願いしていたことは、あなたも証言してくださるでしょう。実際、そのとおりに、たいへん有能な何人かの方に相談され、後にあなたに敵対して現れた方にも相談されたと聞きました。これには、助言者を変えるか、羅紗商から来たものは何も印刷しないと決めるか、そのどちらかになさるしかない、としかお答えできません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "author_preface"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-009"
  "section_id": "letter-06-directions"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I desire you will send the enclosed letter, directed \"To my Lord Viscount Molesworth at his house at Brackdenstown near Swords;\" but I would have it sent printed for the convenience of his Lordship's reading, because this counterfeit hand of my 'prentice is not very legible. And if you think fit to publish it, I would have you first get it read over carefully by some notable lawyer: I am assured you will find enough of them who are friends to the Drapier, and will do it without a fee, which I am afraid you can ill afford after all your expenses. For although I have taken so much care, that I think it impossible to find a topic out of the following papers for sending you again to prison; Yet I will not venture to be your guarantee."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[596]"
    "line_start": 6690
    "source_sequence": 696
  "translation_ja": "同封の手紙を、「スウォーズ近郊、ブラックデンズタウンの御邸宅にて、モールズワース子爵閣下へ」という宛名で、お届けください。ただ、閣下が読みやすいよう、印刷したものをお送りいただきたいのです。私の徒弟が筆跡を変えて書いた文字は、あまり読みやすくないからです。また、これを公にするのが適当だと思われるなら、まず有力な法律家に、注意深く読み通してもらってください。ドレイピアに好意を持ち、無料で引き受けてくれる方なら、きっと十分に見つかると聞いています。これまでの出費を考えれば、あなたに謝礼を払う余裕はあまりないでしょうから。以下の原稿から、あなたを再び牢へ送る口実を見つけるのは不可能だと思えるほど、注意を払ってはいます。それでも、あえてあなたの保証人になるつもりはありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "author_preface"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-010"
  "section_id": "letter-06-directions"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This ensuing letter contains only a short account of myself, and an humble apology for my former pamphlets, especially the last, with little mention of Mr. Wood or his halfpence, because I have already said enough upon that subject, until occasion shall be given for new fears; and in that case you may perhaps hear from me again."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[597]"
    "line_start": 6703
    "source_sequence": 697
  "translation_ja": "以下の手紙にあるのは、私自身の短い身の上話と、これまでの小冊子、とりわけ最後のものについての、謹んでの弁明だけです。ウッド氏やその半ペニー銅貨については、ほとんど触れていません。新たな恐れを抱く事情が生じるまでは、この問題については、すでに十分述べたからです。そのような事情が生じた場合には、また私の便りをお聞きになるかもしれません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "author_preface"

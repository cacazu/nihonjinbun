- "id": "dl-l03-003"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Having already written two letters to people of my own level, and condition; and having now very pressing occasion for writing a third; I thought I could not more properly address it than to your lordships and worships."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[246]"
    "line_start": 2832
    "source_sequence": 295
  "translation_ja": "私はすでに、自分と同じ身分、境遇の人々に宛てて二通の書簡を書きました。そして今、第三の書簡を書く差し迫った必要が生じましたので、貴族ならびに郷紳の皆様にお届けするのが、何よりふさわしいと考えたのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-004"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The occasion is this. A printed paper was sent to me on the 18th instant, entitled, \"A Report of the Committee of the Lords of His Majesty's Most Honourable Privy-Council in England, relating to Mr. Wood's Halfpence and Farthings.\"[2] There is no mention made where the paper was printed, but I suppose it to have been in Dublin; and I have been told that the copy did not come over in the Gazette, but in the London Journal, or some other print of no authority or consequence; and for anything that legally appears to the contrary, it may be a contrivance to fright us, or a project of some printer, who hath a mind to make a penny by publishing something upon a subject, which now employs all our thoughts in this kingdom. Mr. Wood in publishing this paper would insinuate to the world, as if the Committee had a greater concern for his credit and private emolument, than for the honour of the Privy-council and both Houses of Parliament here, and for the quiet and welfare of this whole kingdom; For it seems intended as a vindication of Mr. Wood, not without several severe remarks on the Houses of Lords and Commons of Ireland."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[247]"
    "line_start": 2838
    "source_sequence": 296
  "translation_ja": "その事情はこうです。今月十八日、「ウッド氏の半ペニーおよびファージング銅貨に関する、イングランドの国王陛下の最も名誉ある枢密院所属の貴族委員会報告」と題する印刷物が、私のもとに送られてきました。[2] 印刷地はどこにも記されていませんが、ダブリンではないかと思います。また、その原稿は『ガゼット』に載って渡ってきたのではなく、『ロンドン・ジャーナル』か、ほかの権威も重みもない新聞に載ったものだと聞いています。法律上これに反する証拠が示されていない以上、これは私たちを脅すための仕掛けかもしれず、あるいは、この王国で今や誰もが気をもんでいる問題について何かを出版し、一稼ぎしようという印刷屋の企てなのかもしれません。ウッド氏はこの文書を公にして、委員会が、当地の枢密院や議会両院の名誉、さらにはこの王国全体の平穏と幸福よりも、彼の信用と私腹を肥やすことのほうを大切にしているかのような印象を、世間に与えようとしています。というのも、この文書はウッド氏を弁護するためのものらしく、アイルランドの貴族院と庶民院に対する手厳しい批評まで、いくつも含んでいるからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-002-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The full text of this report is prefixed to this third letter of the Drapier. The report was published in the \"London Journal\" about the middle of August of 1724. Neither the \"Gazette\" nor any other ministerial organ printed it, which evidently gave Swift his cue to attack it in the merciless manner he did. Monck Mason thought it \"not improbable that the minister [Walpole] adopted this method of communication, because it served his own purpose; he dared not to stake his credit upon such a document, which, in its published form, contains some gross mis-statements\" (\"History of St. Patrick's Cathedral,\" note, on p. 336). [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[248]"
    "line_start": 2856
    "source_sequence": 297
  "translation_ja": "この報告書の全文は、ドレイピアの第三書簡に先立って掲げてある。報告書は一七二四年八月の半ばごろ、『ロンドン・ジャーナル』に掲載された。『ガゼット』にも、そのほかの政府系機関紙にも掲載されなかったことが、スウィフトにあの容赦ない攻撃の糸口を与えたのは明らかである。モンク・メイソンは、次のように考えていた。「大臣［ウォルポール］がこの伝達方法を採ったのは、それが自分の目的にかなっていたからだという可能性は、小さくない。彼はこのような文書に自分の信用を賭ける勇気がなかったのだ。公表された形のこの文書には、甚だしい事実誤認がいくつか含まれているのである」（『聖パトリック大聖堂史』三三六頁の注）。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-005"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The whole is indeed written with the turn and air of a pamphlet, as if it were a dispute between William Wood on the one part, and the Lords Justices, Privy-council and both Houses of Parliament on the other; the design of it being to clear and vindicate the injured reputation of William Wood, and to charge the other side with casting rash and groundless aspersions upon him."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[249]"
    "line_start": 2867
    "source_sequence": 298
  "translation_ja": "実際、全体の書きぶりも調子も論争用の小冊子そのもので、ウィリアム・ウッドを一方に、統治代行官、枢密院、そして議会両院を他方に置いた論争であるかのようです。その狙いは、傷つけられたウィリアム・ウッドの名誉を潔白なものとして弁護し、相手方には彼について軽率で根拠のない中傷を浴びせたという罪を着せることにあります。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-006"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But if it be really what the title imports, Mr. Wood hath treated the Committee with great rudeness, by publishing an act of theirs in so unbecoming a manner, without their leave, and before it was communicated to the government and Privy-council of Ireland, to whom the Committee advised that it should be transmitted. But with all deference be it spoken, I do not conceive that a Report of a Committee of the Council in England is hitherto a law in either kingdom; and until any point is determined to be a law, it remains disputable by every subject."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[250]"
    "line_start": 2875
    "source_sequence": 299
  "translation_ja": "しかし、もし本当に表題どおりの文書なのだとすれば、ウッド氏は委員会に対して大変無礼なことをしています。委員会の許可も得ず、しかも、委員会が送付するよう勧告したアイルランドの政府と枢密院に伝達される前に、委員会の公の措置をこれほど不似合いな形で発表したからです。ただし、畏れながら申し上げますが、イングランドの枢密院の一委員会による報告が、今のところ、どちらの王国でも法律になっているとは思えません。そして、ある事柄が法律であると確定されるまでは、どの臣民にもそれを論じる権利があるのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-007"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This (may it please your lordships and worships) may seem a strange way of discoursing in an illiterate shopkeeper. I have endeavoured (although without the help of books) to improve that small portion of reason which God hath pleased to give me, and when reason plainly appears before me, I cannot turn away my head from it. Thus for instance, if any lawyer should tell me that such a point were law, from which many gross palpable absurdities must follow, I would not, I could not believe him. If Sir Edward Coke should positively assert (which he nowhere does, but the direct contrary) that a limited prince, could by his prerogative oblige his subjects to take half an ounce of lead, stamped with his image, for twenty shillings in gold, I should swear he was deceived or a deceiver, because a power like that, would leave the whole lives and fortunes of the people entirely at the mercy of the monarch: Yet this, in effect, is what Wood hath advanced in some of his papers, and what suspicious people may possibly apprehend from some passages in that which is called the \"Report.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[251]"
    "line_start": 2885
    "source_sequence": 300
  "translation_ja": "貴族ならびに郷紳の皆様、このような話し方は、学問のない商店主には似つかわしくないと思われるかもしれません。私は、本の助けこそ借りていませんが、神がお与えくださったわずかな理性を磨こうと努めてきました。そして、理にかなったことが目の前にはっきり現れたとき、私はそこから顔を背けることができません。たとえば、ある法律家が、そこから数多くの甚だしく明白な不合理が生じるような事柄を、これが法律なのだと教えたとしても、私はその人を信じようとは思いませんし、信じることもできません。もしエドワード・クック卿が、権力に制限のある君主でも、大権によって、自分の肖像を刻んだ半オンスの鉛を金貨二十シリング分として受け取るよう臣民に強制できる、と断言したとしたら――卿はどこにもそんなことを述べておらず、まったく反対のことを述べていますが――私は、卿が欺かれているか、さもなくば人を欺いていると、誓って申し上げます。そのような権力があれば、国民すべての生命と財産が、ことごとく君主の意のままになってしまうからです。それなのに、実質的にはこれこそ、ウッドがいくつかの文書で主張してきたことであり、用心深い人なら、いわゆる「報告」のいくつかの箇所から読み取って、不安を覚えるかもしれないことなのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-008"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "That paper mentions \"such persons to have been examined, who were desirous and willing to be heard upon that subject.\" I am told, they were four in all, Coleby, Brown, Mr. Finley the banker, and one more whose name I know not. The first of these was tried for robbing the Treasury in Ireland, and although he was acquitted for want of legal proof, yet every person in the Court believed him to be guilty. The second was tried for a rape, and stands recorded in the votes of the House of Commons, for endeavouring by perjury and subornation, to take away the life of John Bingham, Esq.[3]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[252]"
    "line_start": 2903
    "source_sequence": 301
  "translation_ja": "その文書には、「この問題について意見を述べることを望み、その意思のある人々を取り調べた」と書かれています。聞くところでは、その人々は全部で四人、コールビー、ブラウン、銀行家のフィンリー氏、そしてもう一人、私の知らない名前の者だったそうです。最初の者は、アイルランドの国庫から盗みを働いたとして裁判にかけられました。法にかなう証拠が足りなかったため無罪となりましたが、法廷にいた人は誰もが有罪だと思っていました。二番目の者は強姦の罪で裁判にかけられており、また、偽証と偽証の教唆によってジョン・ビンガム氏の命を奪おうと企てたことが、庶民院の議決録に記されています。[3]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-003-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Referring to these persons who were examined by the Committee, Monck Mason quotes from two letters from Archbishop King to Edward Southwell, Esq. King was one of the council, and Southwell secretary of state at the time. The first of these letters remarks: \"Could a greater contempt be put upon a nation, than to see such a little fellow as Wood favoured and supported against them, and such profligates as Brown and Coleby believed before a whole parliament, government, and private council.\" From the second letter, written on August 15th, 1724, Monck Mason gives the following extracts:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[253]"
    "line_start": 2913
    "source_sequence": 302
  "translation_ja": "委員会による取調べを受けたこれらの人物について、モンク・メイソンは、キング大主教からエドワード・サウスウェル氏に宛てた二通の書簡を引用している。キングは当時、枢密顧問官の一人であり、サウスウェルは国務長官であった。最初の書簡には、次の一節がある。「ウッドのようなつまらぬ男が国民に敵対して厚遇され、支えられ、ブラウンやコールビーのような無頼漢が議会全体、政府、枢密院よりも信用されるのを見せつけられるとは、一国民に対するこれ以上の侮辱がありましょうか」。一七二四年八月十五日付の二通目の書簡から、モンク・メイソンは次の箇所を引いている。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-003-002"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"—When I returned to Dublin I met with resolutions concerning our halfpence, founded chiefly on the testimony of two infamous persons, John Brown and Coleby: as to the first of these, you will find his character in the votes of the house of commons, last parliament. Tuesday, the 5th of November."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[254]"
    "line_start": 2924
    "source_sequence": 303
  "translation_ja": "「――私がダブリンに戻ると、我々の半ペニー銅貨に関する決議が出ていましたが、その根拠は主として、ジョン・ブラウンとコールビーという二人の悪名高い者の証言でした。このうち前者の人物については、前議会の庶民院議決録に、その人となりをお読みになれます。十一月五日、火曜日の項です。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-003-003"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'Resolved, that it appears to this Committee, that a wicked conspiracy was maliciously contrived and carried on against John Bingham, to take away his life and fortune."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[255]"
    "line_start": 2931
    "source_sequence": 304
  "translation_ja": "「『ジョン・ビンガムの生命と財産を奪うため、悪意をもって邪悪な陰謀が企てられ、実行されたものと、本委員会は認める旨、決議する。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-003-004"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'Resolved, that it is the opinion of this Committee, that the said John Brown, of Rabens, Esq. and his accomplices, were the chief promoters and advisers of the said conspiracy."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[256]"
    "line_start": 2936
    "source_sequence": 305
  "translation_ja": "「『前記レイベンズのジョン・ブラウン氏およびその共犯者らが、前記陰謀の主たる推進者および助言者であったと、本委員会は認める旨、決議する。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-003-005"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'Resolved, that it is the opinion of this Committee, that the said John Brown is a person not fit to serve his majesty, in any office or employment, civil or military, whatsoever."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[257]"
    "line_start": 2941
    "source_sequence": 306
  "translation_ja": "「『前記ジョン・ブラウンは、文官、武官を問わず、いかなる職務、職業においても陛下に奉仕するにふさわしくない人物であると、本委員会は認める旨、決議する。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-003-006"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'Resolved, that the said John Brown has, in the course of his examination, grossly prevaricated with this Committee."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[258]"
    "line_start": 2946
    "source_sequence": 307
  "translation_ja": "「『前記ジョン・ブラウンは、その取調べの間に、本委員会に対して甚だしく事実を曲げた答弁を行った旨、決議する。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-003-007"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'To all which resolutions, the question being severally put, the house did agree, nemine contradicente."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[259]"
    "line_start": 2950
    "source_sequence": 308
  "translation_ja": "「『以上の各決議をそれぞれ採決に付したところ、本院は全会一致でこれに同意した。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-003-008"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'Ordered, that the said John Brown be, for his said prevarication, taken into the custody of the serjeant at arms attending this house."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[260]"
    "line_start": 2954
    "source_sequence": 309
  "translation_ja": "「『前記ジョン・ブラウンを、前記の虚偽答弁のため、本院付きの守衛官の拘禁に付すべき旨、命令する。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-003-009"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'Ordered, that his majesty's attorney-general do present the said John Brown, for conniving and maliciously carrying on the said conspiracy to take away the life of the said John Bingham, and others.'"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[261]"
    "line_start": 2958
    "source_sequence": 310
  "translation_ja": "「『陛下の法務総裁は、前記ジョン・ビンガムらの生命を奪う前記陰謀を黙認し、悪意をもって実行した件につき、前記ジョン・ブラウンを告発すべき旨、命令する』。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-003-010"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"As to Coleby, he was turned out of the treasury for robbing it of a considerable sum of money. I was present at his trial at the King's-bench, and the evidence was such as convinced every one, in his conscience, that he was guilty; but, the proofs being presumptive, and not direct, the jury acquitted him; on which the judge (Pine, if I remember right) observed the happiness of English subjects, that, though everybody was convinced of a man's guilt, yet, if the evidence did not come up to the strict requisites of the law, he would escape\" (\"History of St. Patrick's Cathedral,\" pp. xciv-xcv.) [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[262]"
    "line_start": 2963
    "source_sequence": 311
  "translation_ja": "「コールビーについて申せば、彼は相当額の金を盗んだため、国庫から追放されました。私は王座裁判所で行われた彼の裁判に立ち会いましたが、その証拠は、誰もが良心に照らして有罪を確信するほどのものでした。しかし、証拠は状況証拠であって直接証拠ではなかったので、陪審は無罪としました。その際、裁判官――記憶に誤りがなければパインです――は、誰もがその人の有罪を確信していても、証拠が法の厳密な要件を満たさなければ処罰を免れるのだから、イングランドの臣民は幸福であると述べました」（『聖パトリック大聖堂史』九四―九五頁［序文頁］）。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-009"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But since I have gone so far as to mention particular persons, it may be some satisfaction to know who is this Wood himself, that has the honour to have a whole kingdom at his mercy, for almost two years together. I find he is in the patent entitled Esq; although he were understood to be only a hardware-man, and so I have been bold to call him in my former letters; however a 'squire he is, not only by virtue of his patent, but by having been a collector in Shropshire, where pretending to have been robbed, and suing the county, he was cast, and for the infamy of the fact, lost his employment."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[263]"
    "line_start": 2974
    "source_sequence": 312
  "translation_ja": "しかし、ここまで個人の名前を挙げた以上、ほとんど二年もの間、一王国全体を意のままに扱うという栄誉に浴している、このウッド自身が何者なのかを知るのも、一つの慰めかもしれません。特許状には彼に「エスクワイア」の称号が付いているのを見ました。ただの金物商だと聞いていたので、前の書簡でも大胆にもそう呼んだのですが、ともかく彼は紳士なのです。それも、特許状の力によるばかりではありません。シュロップシャーで徴収官を務めていたからでもあります。そこで彼は、強盗に遭ったと偽って州を訴えましたが、敗訴し、その行いの悪質さによって職を失ったのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-010"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have heard another story of this 'Squire Wood from a very honourable lady, that one Hamilton told her. He (Hamilton) was sent for six years ago by Sir Isaac Newton to try the coinage of four men, who then solicited a patent for coining halfpence for Ireland; their names were Wood, Coster, Elliston, and Parker. Parker made the fairest offer, and Wood the worst, for his coin were three halfpence in a pound less value than the other. By which it is plain with what intentions he solicited this patent, but not so plain how he obtained it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[264]"
    "line_start": 2985
    "source_sequence": 313
  "translation_ja": "このウッド紳士については、ある大変高貴な夫人から、もう一つ話を聞いています。その夫人にはハミルトンという人が語ったそうです。このハミルトンは、六年前、アイルランド向けの半ペニー銅貨の鋳造特許を申請していた四人の貨幣を試験するため、アイザック・ニュートン卿に呼ばれました。四人の名は、ウッド、コスター、エリストン、パーカーでした。パーカーの申し出が最も有利で、ウッドのものが最も悪く、その貨幣の価値は、ほかの者のものより一ポンドにつき一ペニー半も低かったのです。これを見れば、彼がどういうつもりでこの特許を申請したのかは明らかですが、どうして手に入れられたのかは、それほど明らかではありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-011"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is alleged in the said paper, called the \"Report,\" that upon repeated orders from a secretary of state, for sending over such papers and witnesses, as should be thought proper to support the objections made against the patent (by both Houses of Parliament) the Lord Lieutenant represented \"the great difficulty he found himself in to comply with these orders. That none of the principal members of both Houses, who were in the King's service or council, would take upon them to advise how any material person or papers might be sent over on this occasion, &c.\" And this is often repeated and represented as \"a proceeding that seems very extraordinary, and that in a matter which had raised so great a clamour in Ireland, no one person could be prevailed upon to come over from Ireland in support of the united sense of both Houses of Parliament in Ireland, especially that the chief difficulty should arise from a general apprehension of a miscarriage, in an enquiry before His Majesty, or in a proceeding by due course of law, in a case where both Houses of Parliament had declared themselves so fully convinced, and satisfied upon evidence, and examinations taken in the most solemn manner.\"[4]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[265]"
    "line_start": 2995
    "source_sequence": 314
  "translation_ja": "いわゆる「報告」という前記文書には、国務長官から、特許状に対して議会両院が提起した異議を裏づけるのに適当と思われる書類と証人を送るよう、繰り返し命令があったのに対し、総督が次のように申し述べたとあります。「この命令に従うには甚だしい困難がある。国王に仕え、または枢密顧問官を務める両院の主要議員のうち、この件について有力な人物や書類をどのように送ればよいか、進んで助言を引き受けようとする者は誰もいない、云々」。このことが繰り返し取り上げられ、次のように評されています。「これはきわめて異例に見える措置である。アイルランドでこれほどの騒ぎを起こした問題でありながら、アイルランド議会両院の一致した見解を裏づけるため、アイルランドから渡ってくるよう説得できる者が一人もいないという。とりわけ奇異なのは、主要な困難が、陛下の御前での調査、あるいは法の正規の手続による審理で不首尾に終わるのではないかという、一般的な不安から生じているという点である。しかもこの件では、議会両院は、きわめて厳粛に行われた証拠の提出と取調べに基づき、十分な確信と納得を得ていると宣言しているのである」。[4]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-004-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Commenting on this Monck Mason has the following note. This learned biographer's remarks are specially important inasmuch as he has fortified them with letters from Archbishop King, unpublished at the time he wrote: \"But this [referring to the extract from the Report given by Swift] will not appear so strange or inexplicable after perusing the following letter from Archbishop King ... to Edward Southwell, Esq. ...; this important state paper may, therefore, be considered as an official communication of the sentiments of the Irish Privy Council upon this matter."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[266]"
    "line_start": 3014
    "source_sequence": 315
  "translation_ja": "この点について、モンク・メイソンは次のような注を付している。この博識な伝記作者の所見は、執筆当時まだ公刊されていなかったキング大主教の書簡によって裏づけられているだけに、特に重要である。「しかし、キング大主教から……エドワード・サウスウェル氏に宛てた次の書簡を読めば、このこと［スウィフトが引用した報告書の一節を指す］も、それほど奇異でも不可解でもなくなるだろう。……したがって、この重要な公文書は、この問題についてのアイルランド枢密院の見解を正式に伝達したものと見なしてよい。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-004-002"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"Letter from William King, Archbishop of Dublin, to Edward Southwell, Esq., dated the 23d March, 1723."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[267]"
    "line_start": 3025
    "source_sequence": 316
  "translation_ja": "「ダブリン大主教ウィリアム・キングよりエドワード・サウスウェル氏への書簡。一七二三年三月二十三日付。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-004-003"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'I have not had any occasion of late to trouble you with my letters; but yesternight I came to the knowledge of an affair which gave me some uneasiness, and, I believe, will do so to the whole kingdom, when it becomes public. My lord lieutenant sent for several lords and commoners of the privy council, and communicated to them a letter from my Lord Carteret, writ by his majesty's command, in which was repeated the answer given to the addresses of the lords and commons, about one William Wood's farthings and halfpence; and his grace is required to send over witnesses and evidences against the patentee or patent: this has surprised most people, because we were borne in hand that that affair was dead, and that we should never hear any more of it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[268]"
    "line_start": 3029
    "source_sequence": 317
  "translation_ja": "「『最近は、書簡でお手を煩わせる用件もありませんでしたが、昨晩、私に少なからぬ不安を抱かせる出来事を知りました。公になれば、王国全体も同じ不安を抱くと思います。総督閣下が、枢密顧問官である貴族院議員と庶民院議員を数名召集し、陛下の御命令によってカータレット卿が書いた書簡を伝えられました。そこには、ウィリアム・ウッドなる者のファージングおよび半ペニー銅貨に関する両院の上奏に対して、すでに与えられた回答が繰り返されていました。そして総督閣下は、特許権者ないし特許状に不利な証人と証拠を送るよう求められたのです。多くの人はこれに驚いています。というのも、その件はもう立ち消えであり、二度と聞かされることはないと、私たちは思わされていたからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-004-004"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'His grace's design was, to be advised by what means and methods he might effectually comply with his majesty's commands; and, by what I could perceive, it was the sense of all, that it was not possible, in the present situation of affairs, to answer his majesty's expectations or those of the kingdom; and that, for these reasons:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[269]"
    "line_start": 3042
    "source_sequence": 318
  "translation_ja": "「『総督閣下のお考えは、どのような手段と方法によって陛下の御命令を実効ある形で果たせるか、助言を得ることでした。しかし、私の見たところ、現在の情勢では、陛下の御期待にも王国の期待にも応えることは不可能だというのが、皆の意見でした。その理由は、次のとおりです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-004-005"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'1st, because this is a controversy between the parliament of Ireland and William Wood, and, the parliament being now prorogued, nobody either would, or durst, take on them to meddle in a business attacked by the parliament, or pretend to manage a cause which so deeply concerned the parliament, and the whole nation, without express orders. If this letter had come whilst the parliament was sitting, and had been communicated to the houses, they could have appointed certain persons to have acted for them, and raised a fund to support them, as has been done formerly in this kingdom on several occasions; but, for any, without such authority, to make himself a party for the legislature and people of Ireland, would be a bold undertaking, and, perhaps, dangerous; for, if such undertaker or undertakers should fail in producing all evidences that may be had, or any of the papers necessary to make the case evident, they must expect to be severely handled the next parliament for their officiousness, and bear the blame of the miscarriage of the cause: for these reasons, as it seemed to me, the privy councillors were unwilling to engage at all in the business, or to meddle with it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[270]"
    "line_start": 3049
    "source_sequence": 319
  "translation_ja": "「『第一に、これはアイルランド議会とウィリアム・ウッドとの間の争いだからです。議会は今、停会中であり、議会が攻撃した案件に自分から介入しようとか、議会と国民全体にこれほど深くかかわる事件を、明示の命令もなしに取り仕切ろうとかいう者は、誰もおりませんし、その勇気もありません。この書簡が議会の開会中に届き、両院に伝えられていたなら、両院は自分たちのために行動する人物を任命し、それを支える資金を調達できたでしょう。この王国でも以前、何度かそうした例がありました。しかし、そのような権限なしに、アイルランドの立法府と国民を代表する当事者になろうというのは、大胆な企てであり、おそらく危険でもあります。そのような役を買って出た者たちが、入手しうる証拠をすべて提出できなかったり、事実を明らかにするために必要な書類の一つでも出せなかったりすれば、次の議会で、お節介を焼いたかどで厳しく責められ、事件を不首尾に終わらせた責任を負わされるのを、覚悟しなければならないからです。私の見るところ、こうした理由から、枢密顧問官たちはこの件を引き受けることも、介入することも、まったく望まなかったのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-004-006"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'But, 2dly, the thing seemed impracticable; because it would signify nothing to send over the copies of the papers that were laid before the parliament, if the design is, as it seems to be, to bring the patent to a legal trial; for such copies we were told by lawyers, could not be produced in any court as evidence; and, as to the originals, they are in the possession of the houses, and (as was conceived) could not be taken from the proper officers with whom they were trusted, but by the like order."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[271]"
    "line_start": 3068
    "source_sequence": 320
  "translation_ja": "「『しかし第二に、その実行は不可能に見えました。というのも、意図するところが、見受けられるように、特許状を法律上の審理に付すことだとすれば、議会に提出された書類の写しを送っても、何の役にも立たないからです。そのような写しは、どの法廷でも証拠として提出できないと、法律家たちは申しました。一方、原本は両院の所有であり、保管を委ねられた所管の役人の手から取り出すには、それに相応する命令が必要だと考えられたのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-004-007"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'And, as to the witnesses, it was a query whether my lord lieutenant by his own power could send them; and, if he have such power, yet it will not be possible to come at the witnesses, for several in each house vouched several facts on their own knowledge, to whom the houses gave credit; my lord lieutenant can neither be apprised of the persons nor of the particulars which the members testified; whereas, if the parliament was sitting, those members would appear, and make good their assertions."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[272]"
    "line_start": 3078
    "source_sequence": 321
  "translation_ja": "「『証人については、総督閣下がご自身の権限で送り出せるのかという疑問がありました。仮にその権限があっても、証人を突き止めることはできません。両院の何人もの議員が、自分の知っているさまざまな事実を証言し、両院はその証言を信用したのです。総督閣下には、誰が証言したかも、議員たちがどのような細部を証言したかも、分かりません。議会が開会中であれば、それらの議員が出頭して、自分の主張を立証できるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-004-008"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'There were several sorts of farthings and halfpence produced to the houses, differing in weight, and there was likewise a difference in the stamp. These were sent over by William Wood to his correspondents here, and by them produced. But can it be proved, on a legal trial, that these particular halfpence were coined by him? It is easy for him to say, that they are counterfeited, as (if I remember right) he has already affirmed in the public prints, in his answer to the address of the commons."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[273]"
    "line_start": 3087
    "source_sequence": 322
  "translation_ja": "「『両院には、重さが異なり、刻印にも違いのある数種のファージングおよび半ペニー銅貨が提出されました。これはウィリアム・ウッドが当地の取引相手に送ってきたもので、その人々が提出したのです。しかし、正式な裁判で、この特定の半ペニー銅貨を彼が鋳造したと証明できるでしょうか。彼は簡単に、偽物だと言えます。記憶が正しければ、庶民院の上奏への反論として、すでに新聞紙上でもそう主張しています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-004-009"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'But, 3dly, it was not on the illegality of the patent, nor chiefly on the abuse of it the patentee (which was not so much as mentioned by the lords), that the parliament insisted, but on the unavoidable mischief and destruction it would bring on the kingdom, and on its being obtained by most false and notorious misinformation of his majesty; it being suggested, as appears by the preamble, that the kingdom wanted such halfpence and farthings: now, if the king be misinformed, the lawyers tell us, that the grant is void. And, that his majesty was deceived in this grant by a false representation, it was said, needed no further proof than the patent itself.—William Wood by it was empowered to coin 360 tons of copper into halfpence and farthings, which would have made £90,000, about the fifth part of all the current cash of Ireland; for that is not reckoned, by those who suppose it most, to be £500,000. Now, the current cash of England is reckoned above twenty millions; in proportion, therefore, if Ireland wants £90,000 England will want four millions. It is easy to imagine what would be said to a man that would propose to his majesty such a coinage; and it is agreed, that the people of England would not be more alarmed by such a patent, than the people of Ireland are, by the prospect of turning the fifth part of their current coin into brass."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[274]"
    "line_start": 3096
    "source_sequence": 323
  "translation_ja": "「『しかし第三に、議会が問題としたのは、特許状の違法性でも、主として特許権者によるその濫用でもありませんでした。後者に至っては、貴族院は言及さえしていません。議会が力説したのは、それが王国に必然的にもたらす害悪と破滅、そして、陛下に甚だしく明白な虚偽をお伝えして取得されたものだという点でした。前文から明らかなように、王国にはそのような半ペニーおよびファージング銅貨が必要である、と申し立てられているのです。しかし法律家によれば、国王に誤った情報が伝えられた場合、その授与は無効となります。そして、この特許を授与するに当たって陛下が虚偽の申し立てによって欺かれたことは、特許状そのもののほかに証拠を要しない、とされました。――それによってウィリアム・ウッドは、三百六十トンの銅を半ペニーおよびファージング銅貨に鋳造する権限を与えられました。額にして九万ポンド、アイルランドの全流通貨幣のおよそ五分の一に当たります。全流通額は、最も多く見積もる人でも五十万ポンドとは考えていないからです。一方、イングランドの流通貨幣は二千万ポンド以上と見積もられています。したがって、同じ割合でいえば、アイルランドに九万ポンドが必要なら、イングランドには四百万ポンドが必要なはずです。そのような貨幣鋳造を陛下に提案する者が、何と言われるかは容易に想像できます。そして、流通貨幣の五分の一が真鍮に変わるという見通しに、アイルランドの国民が覚えている不安は、イングランドの国民がそのような特許状に対して覚えるであろう不安にも、劣らないという点では、意見が一致しています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-004-010"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'This, so far as I can remember, is a brief of what passed in the meeting before my lord lieutenant'\" (\"History of St. Patrick's Cathedral,\" pp. lxxxvii-lxxxviii). [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[275]"
    "line_start": 3117
    "source_sequence": 324
  "translation_ja": "「『覚えている限りでは、以上が総督閣下の御前での会合で交わされた話の要旨です』」（『聖パトリック大聖堂史』八七―八八頁［序文頁］）。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-012"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "How shall I, a poor ignorant shopkeeper, utterly unskilled in law, be able to answer so weighty an objection. I will try what can be done by plain reason, unassisted by art, cunning or eloquence."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[276]"
    "line_start": 3122
    "source_sequence": 325
  "translation_ja": "法律をまったく知らない、無学な一介の商店主である私に、これほど重大な異議をどうして論駁できるでしょうか。技巧も策略も雄弁も借りず、ありのままの道理だけで、どこまでできるか試してみましょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-013"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In my humble opinion, the committee of council, hath already prejudged the whole case, by calling the united sense of both Houses of Parliament in Ireland an \"universal clamour.\" Here the addresses of the Lords and Commons of Ireland against a ruinous destructive project of an \"obscure, single undertaker,\" is called a \"clamour.\" I desire to know how such a style would be resented in England from a committee of council there to a Parliament, and how many impeachments would follow upon it. But supposing the appellation to be proper, I never heard of a wise minister who despised the universal clamour of a people, and if that clamour can be quieted by disappointing the fraudulent practice of a single person, the purchase is not exorbitant."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[277]"
    "line_start": 3127
    "source_sequence": 326
  "translation_ja": "私の卑見では、枢密院委員会は、アイルランド議会両院の一致した意見を「国じゅうの騒ぎ」と呼んだことで、すでに事件全体に予断を下しています。「名もない一人の事業請負人」の破滅的な計画に反対するアイルランドの貴族院と庶民院の上奏が、ここでは「騒ぎ」と呼ばれているのです。イングランドの枢密院委員会が同国の議会にこのような言葉を使ったなら、どれほどの怒りを招き、どれほどの弾劾が続くことになるのか、伺いたいものです。もっとも、この呼び名がふさわしいと仮定しても、国民全体の騒ぎを軽んじた賢明な大臣というものを、私は聞いたことがありません。そして、たった一人の不正な企てを挫くことでその騒ぎを鎮められるのなら、その代償は法外なものではないでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-014"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But in answer to this objection. First it is manifest, that if this coinage had been in Ireland, with such limitations as have been formerly specified in other patents, and granted to persons of this kingdom, or even of England, able to give sufficient security, few or no inconveniencies could have happened, which might not have been immediately remedied. As to Mr. Knox's patent mentioned in the Report, security was given into the exchequer, that the patentee should at any time receive his halfpence back, and pay gold or silver in exchange for them. And Mr. Moor (to whom I suppose that patent was made over) was in 1694 forced to leave off coining, before the end of that year, by the great crowds of people continually offering to return his coinage upon him. In 1698 he coined again, and was forced to give over for the same reason. This entirely alters the case; for there is no such condition in Wood's patent, which condition was worth a hundred times all other limitations whatsoever.[5]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[278]"
    "line_start": 3140
    "source_sequence": 327
  "translation_ja": "しかし、この異議にお答えしましょう。第一に、もしこの貨幣鋳造が、以前のほかの特許状に明記されたような制限のもとに、アイルランド国内で行われ、十分な担保を差し入れられるこの王国の人々、あるいはイングランドの人々に特許が与えられていたなら、直ちに是正できない不都合は、ほとんど、あるいはまったく起こらなかったことは明らかです。「報告」にあるノックス氏の特許状についていえば、特許権者はいつでも自分の半ペニー銅貨を引き取り、代わりに金銀を支払うという担保が、財務府に差し入れられていました。そして、その特許状を譲り受けたと思われるムーア氏は、一六九四年、自分の貨幣を返しにくる大群衆が絶えなかったため、その年の終わりを待たずに鋳造をやめざるを得ませんでした。一六九八年に再び鋳造しましたが、同じ理由で断念せざるを得なかったのです。これは、事情をまったく別のものにします。ウッドの特許状には、そのような条件がないからです。この条件一つで、ほかのどんな制限をすべて合わせたものより、百倍の価値があったのです。[5]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":

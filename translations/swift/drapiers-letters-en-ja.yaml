  "kind": "paragraph"
  "origin": "source"
  "source_text": "These halfpence, if they once pass, will soon be counterfeit, because it may be cheaply done, the stuff is so base. The Dutch likewise will probably do the same thing, and send them over to us to pay for our goods.[22] And Mr. Wood will never be at rest but coin on: So that in some years we shall have at least five times fourscore and ten thousand pounds of this lumber. Now the current money of this kingdom is not reckoned to be above four hundred thousand pounds in all, and while there is a silver sixpence left these blood-suckers will never be quiet."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[124]"
    "line_start": 1419
    "source_sequence": 155
  "translation_ja": "この半ペニー銅貨がいったん通用するようになれば、まもなく偽造されるでしょう。材料があまりに粗悪なので、安くできるからです。オランダ人もおそらく同じことをし、私たちの商品への支払いとしてこちらへ送ってくるでしょう。[22] ウッド氏も休むことなく鋳造を続けるでしょうから、数年もたてば、このがらくたは少なくとも九万ポンドの五倍にもなります。ところが、この王国で現在通用している貨幣は、全部で四十万ポンドを超えないと見積もられています。銀の六ペンス貨が一枚でも残っている限り、この血を吸う連中が静かになることはないでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"

- "id": "dl-l06-note-014-001"
  "section_id": "letter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Algernon Sidney (1622-1682), the author of the well known \"Discourses concerning Government,\" and the famous republican of the Cromwellian and Restoration years, was the second surviving son of the second Earl of Leicester His career as soldier, statesman, agitator, ambassador and author, forms an interesting and even fascinating chapter of the story of this interesting period of English history. He was tried for treason before Jeffreys, and in spite of a most excellent defence, sentenced to death. His execution took place on December 7th, 1682. [T. S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[626]"
    "line_start": 7041
    "source_sequence": 730
  "translation_ja": "アルジャーノン・シドニー（一六二二―一六八二）は、よく知られた『統治論』の著者で、クロムウェル時代と王政復古期の有名な共和主義者であった。第二代レスター伯爵の、成人まで生きた息子のうちの次男である。軍人、政治家、扇動家、大使、著述家としての生涯は、イングランド史のこの興味深い時代に、一つの興味深く、魅力的ですらある章をなしている。ジェフリーズの前で反逆罪の裁判にかけられ、この上なく優れた弁護にもかかわらず、死刑を宣告された。処刑は一六八二年十二月七日に行われた。[T. S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l06-note-015-001"
  "section_id": "letter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "A writer, signing himself M.M., replying to this letter of Swift's in a broadside entitled, \"Seasonable Advice to M.B. Drapier, Occasioned by his Letter to the R—t. Hon. the Lord Visct. Molesworth,\" actually takes this paragraph to mean that Swift intended seriously to turn informer: \"Now sir, some people are of opinion that you carried this too far, inasmuch as you become a precedent to informers: others think that you intimate to his lordship, the miserable circumstance you are in by the menaces of the prentice to whom you dictate; they conceive your declaring to inform, if not fee'd, to the contrary, signifies your said prentice on the last occasion to swear, if you don't forthwith deliver him his indentures, and half of your stock to set up trade with, he will inform against you, bring you to justice, be dismissed by law, and get the promised £300 to begin trade with; how near these conceptions be to truth I can't tell; but I know people think that word inform unseasonable. . . .\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[627]"
    "line_start": 7052
    "source_sequence": 731
  "translation_ja": "M・Mと署名する筆者は、『モールズワース子爵閣下への手紙を機として、M・B・ドレイピアへの時宜にかなった忠告』という一枚刷りで、スウィフトのこの書簡に答え、実際にこの段落を、スウィフトが本気で密告者になろうとしている意味だと受け取っている。「さて、あなたはこれを行き過ぎたものにした、という意見の人々もいる。密告者たちの先例になってしまうからだ。ほかの人々は、あなたが口述を聞かせている徒弟の脅しによって、惨めな立場にいることを、閣下にほのめかしているのだと考える。金を渡してやめさせなければ密告する、というあなたの言明は、先の機会にその徒弟が、奉公契約書をすぐに返し、独立して商売をするために店の商品の半分を渡さなければ、あなたを密告し、裁判に引き出し、自分は法律によって奉公から解放され、約束の三百ポンドを開業資金にする、と誓ったことを意味するというのである。こうした解釈がどれほど真実に近いかは、私にはわからない。ただ、密告という言葉を時宜にかなわないと思う人がいることは知っている……」。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l06-031"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In the meantime, I beg your lordship to receive my confession, that if there be any such thing as a dependency of Ireland upon England, otherwise than as I have explained it, either by the law of God, of nature, of reason, of nations, or of the land (which I shall never hereafter contest,) then was the proclamation against me, the most merciful that ever was put out, and instead of accusing me as malicious, wicked and seditious, it might have been directly as guilty of high treason."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[628]"
    "line_start": 7069
    "source_sequence": 732
  "translation_ja": "差し当たり、閣下には私の告白をお聞き届けいただきたいと思います。もし、神の法、自然法、理性の法、国際法、あるいはこの国の法律のいずれによってであれ、私の説明した以外の意味で、アイルランドのイングランドへの従属というものがあるなら――これについて、私は今後決して争いません――、私に対する布告は、かつて出されたうちで最も慈悲深いものでした。私を悪意ある邪悪な扇動者と非難する代わりに、まっすぐ大逆罪で告発してもよかったのですから。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-032"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "All I desire is, that the cause of my country against Mr. Wood may not suffer by any inadvertency of mine; Whether Ireland depends upon England, or only upon God, the King and the law, I hope no man will assert that it depends upon Mr. Wood. I should be heartily sorry that this commendable resentment against me should accidentally (and I hope, what was never intended) strike a damp upon that spirit in all ranks and corporations of men against the desperate and ruinous design of Mr. Wood. Let my countrymen blot out those parts in my last letter which they dislike, and let no rust remain on my sword to cure the wounds I have given to our most mortal enemy. When Sir Charles Sidley[16] was taking the oaths, where several things were to be renounced, he said \"he loved renouncing,\" asked \"if any more were to be renounced, for he was ready to renounce as much as they pleased.\" Although I am not so thorough a renouncer; yet let me have but good city security against this pestilent coinage, and I shall be ready not only to renounce every syllable in all my four letters, but to deliver them cheerfully with my own hands into those of the common hangman, to be burnt with no better company than the coiner's effigies, if any part of it hath escaped out of the secular hands of the rabble."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[629]"
    "line_start": 7078
    "source_sequence": 733
  "translation_ja": "私が望むのはただ、ウッド氏と争う祖国の大義が、私の何らかの不注意によって損なわれないことです。アイルランドがイングランドに従属しようと、神と国王と法律だけに従属しようと、ウッド氏に従属していると主張する人はいないでしょう。私に対するこの称賛すべき憤りが、図らずも――それは決して意図したことではないと願いますが――、ウッド氏の無謀で破滅的な計画に反対する、あらゆる身分や団体の人々の気概を冷やすなら、心から残念に思います。同胞たちには、私の最後の書簡のうち、気に入らない部分を消していただきたい。そして、私たちのこの上なく恐ろしい敵につけた傷を治すのに使える錆など、私の剣に残さないでください。サー・チャールズ・シドリー[16]が、いくつものことを否認しなければならない宣誓を行ったとき、「否認するのは好きだ」と言って、「ほかにも否認するものはないか。望まれるだけ否認する用意がある」と尋ねたそうです。私はそこまで徹底した否認者ではありませんが、この疫病のような鋳貨から守られるという、商都の確かな保証さえいただければ、四通の書簡の一音節まで、すべて否認する用意があります。それどころか、自分の手で喜んで公の刑吏に渡し、鋳貨業者の人形ほどの仲間とともに焼いてもらう用意もあります。その人形のどこかが、群衆という世俗の執行者の手を逃れて残っているならば、ですが。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-note-016-001"
  "section_id": "letter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This must be Sir Charles Sedley (properly Sidley), the famous wit and dramatist of Charles II.'s reign. In his reprint of 1735, Faulkner prints the name \"Sidley,\" though the original twopenny tract and the \"Hibernian Patriot\" print it as \"Sidney.\" Sir W. Scott corrects it to \"Sedley.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[630]"
    "line_start": 7098
    "source_sequence": 734
  "translation_ja": "これは、チャールズ二世治世の有名な才人で劇作家のサー・チャールズ・セドリー、正しくはシドリーのことに違いない。フォークナーは一七三五年の再版でSidleyと印刷しているが、原刊の二ペニーの小冊子と『ハイバーニアン・ペイトリオット』ではSidneyとなっている。サー・W・スコットはSedleyと訂正している。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l06-033"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But whatever the sentiments of some people may be, I think it is agreed that many of those who subscribed against me, are on the side of a vast majority in the kingdom who opposed Mr. Wood; and it was with great satisfaction that I observed some right honourable names very amicably joined with my own at the bottom of a strong declaration against him and his coin. But if the admission of it among us be already determined the worthy person who is to betray me ought in prudence to do it with all convenient speed, or else it may be difficult to find three hundred pounds in sterling for the discharge of his hire; when the public shall have lost five hundred thousand, if there be so much in the nation; besides four-fifths of its annual income for ever."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"

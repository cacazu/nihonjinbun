- "id": "dl-l02-note-006-001"
  "section_id": "letter-02"
  "kind": "note_body"
  "origin": "source"
  "source_text": "It was not alone the direct discouragement of agriculture which lessened the population. This result was also largely brought about by the anti-Catholic legislation of Queen Anne's reign, which \"reduced the Roman Catholics to a state of depression,\" and caused thousands of them to go elsewhere for the means of living. See Crawford's \"Ireland,\" vol. ii., pp. 264-267. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[178]"
    "line_start": 1908
    "source_sequence": 215
  "translation_ja": "人口を減少させたのは、農業への直接の圧迫だけではなかった。アン女王の治世の反カトリック法も大きな原因である。それらは「ローマ・カトリック教徒を抑圧された状態に置き」、生活の糧を求めて、何千人もの人々を他国へ向かわせた。クローフォード『アイルランド』第二巻二六四〜二六七頁を参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l02-005"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Your paragraph relates further, that Sir Isaac Newton reported an assay taken at the Tower of Wood's metal, by which it appears, that Wood had in all respects performed his contract[7]. His contract! With whom? Was it with the parliament or people of Ireland? Are not they to be the purchasers? But they detest, abhor, and reject it, as corrupt, fraudulent, mingled with dirt and trash. Upon which he grows angry, goes to law, and will impose his goods upon us by force."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[179]"
    "line_start": 1916
    "source_sequence": 216
  "translation_ja": "記事はさらに、サー・アイザック・ニュートンが、ロンドン塔で行われたウッドの金属の試金について報告し、その結果、ウッドがあらゆる点で契約を履行したことが明らかになった、と伝えています。[7] 契約ですって。誰との契約なのでしょう。アイルランド議会か、アイルランドの人民と結んだのでしょうか。買い手になるのは彼らではありませんか。しかし彼らはそれを、汚れやがらくたの混じった、腐敗した詐欺的な代物として、嫌悪し、憎み、拒んでいます。すると彼は腹を立て、法に訴え、力ずくで自分の商品を私たちに押しつけようとするのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-note-007-001"
  "section_id": "letter-02"
  "kind": "note_body"
  "origin": "source"
  "source_text": "For the full text of Newton's report see Appendix, No. II. [T.S.]"
  "source_languages":

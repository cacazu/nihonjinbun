    "line_start": 3674
    "source_sequence": 366
  "translation_ja": "レッキーは言う。「ポイニングス法によって、アイルランド議会の独立の大部分は、確かに放棄された。しかし、それを成立させた隷属的な議会でさえ、それ以前にイングランドで制定された法律を、自らの権限によってアイルランドに適用したとはいえ、イングランド議会がアイルランドのために立法する権利を認めたことは、決してなかった」（『アイルランド史』第二巻、一五四頁、一八九二年版）。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-037"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The Report farther asserts, that \"the precedents are many, wherein cases of great importance to Ireland, and that immediately affected the interests of that kingdom, warrants, orders, and directions by the authority of the King and his predecessors, have been issued under the royal sign manual, without any previous reference or advice of His Majesty's officers of Ireland, which have always had their due force, and have been punctually complied with, and obeyed.\" It may be so, and I am heartily sorry for it, because it may prove an eternal source of discontent. However among all these precedents there is not one of a patent for coining money for Ireland."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[318]"
    "line_start": 3682
    "source_sequence": 367
  "translation_ja": "「報告」はさらにこう述べています。「アイルランドにとってきわめて重要で、その王国の利益に直接影響する問題について、陛下のアイルランドの役人たちへの事前の照会や諮問なしに、国王および先王たちの権限により、親署のもとに令状、命令、指示が発せられた先例は多く、それらは常に所定の効力を有し、正確に履行され、遵守されてきた」。そうなのかもしれません。私は心から残念に思います。これは、永遠に尽きない不満の源となりかねないからです。しかし、これらすべての先例の中に、アイルランド向けの貨幣鋳造特許状は、一つもないのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-038"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is nothing hath perplexed me more than this doctrine of precedents. If a job is to be done, and upon searching records you find it hath been done before, there will not want a lawyer to justify the legality of it, by producing his precedents, without ever considering the motives and circumstances that first introduced them, the necessity or turbulence or iniquity of times, the corruptions of ministers, or the arbitrary disposition of the prince then reigning. And I have been told by persons eminent in the law, that the worst actions which human nature is capable of, may be justified by the same doctrine. How the first precedents began of determining cases of the highest importance to Ireland, and immediately affecting its interest, without any previous reference or advice to the King's officers here, may soon be accounted for. Before this kingdom was entirely reduced by the submission of Tyrone in the last year of Queen Elizabeth's reign, there was a period of four hundred years, which was a various scene of war and peace between the English pale and the Irish natives, and the government of that part of this island which lay in the English hands, was, in many things under the immediate administration of the King. Silver and copper were often coined here among us, and once at least upon great necessity, a mixed or base metal was sent from England. The reign of King James Ist. was employed in settling the kingdom after Tyrone's rebellion, and this nation flourished extremely till the time of the massacre 1641. In that difficult juncture of affairs, the nobility and gentry coined their own plate here in Dublin."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[319]"
    "line_start": 3694
    "source_sequence": 368
  "translation_ja": "この先例という教えほど、私を困惑させるものはありません。利権仕事をしようとして、記録を調べ、以前にも行われたと分かれば、先例を持ち出してその合法性を弁護する法律家には事欠きません。その最初の発端となった動機や事情、時代の窮迫、騒乱、不正、大臣の腐敗、あるいは当時の君主の専制的な性向などは、一度も考えようとしないのです。そして、この同じ教えによれば、人間のなし得る最悪の行為さえ正当化できると、法律の大家から聞かされたことがあります。当地の国王の役人に事前の照会や諮問もせず、アイルランドにとって最重要で、その利益に直接影響する問題を決めるという最初の先例が、どのように始まったかは、容易に説明できます。エリザベス女王の治世の最終年にティローンが服従し、この王国が完全に平定されるまで、四百年の間、イングランド領ペイルとアイルランドの先住民との間では、戦争と平和がさまざまに移り変わってきました。そして、この島のうちイングランドの手にあった部分の統治は、多くの点で国王の直接の管理下に置かれていました。当地では金銀のうち銀と、銅の貨幣がしばしば鋳造され、少なくとも一度、大きな必要に迫られて、混合した、あるいは粗悪な金属貨幣がイングランドから送られました。ジェームズ一世の治世は、ティローンの反乱後の王国の安定に費やされ、この国は一六四一年の虐殺の時まで、非常に繁栄しました。その困難な時期には、貴族や郷紳が、当地ダブリンで自分たちの銀器を貨幣に鋳造したのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-039"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "By all that I can discover, the copper coin of Ireland for three hundred years past consisted of small pence and halfpence, which particular men had licence to coin, and were current only within certain towns and districts, according to the personal credit of the owner who uttered them, and was bound to receive them again, whereof I have seen many sorts; neither have I heard of any patent granted for coining copper for Ireland till the reign of King Charles II. which was in the year 1680. to George Legge Lord Dartmouth, and renewed by King James II. in the first year of his reign to John Knox. Both patents were passed in Ireland, and in both the patentees were obliged to receive their coin again to any that would offer then twenty shillings of it, for which they were obliged to pay gold or silver."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[320]"
    "line_start": 3719
    "source_sequence": 369
  "translation_ja": "私に調べられる限り、過去三百年間のアイルランドの銅貨は、個々人が鋳造許可を得た小型のペニー貨、半ペニー貨からなり、それらは発行者本人の信用に応じ、特定の町や地区の中だけで通用するものでした。発行者にはそれを再び引き取る義務があり、そのさまざまな種類を私は見たことがあります。また、チャールズ二世の治世まで、アイルランド向けの銅貨鋳造特許状が与えられたとは、聞いたことがありません。それは一六八〇年、ダートマス卿ジョージ・レッグに与えられ、ジェームズ二世の治世第一年にジョン・ノックスに更新されたものでした。どちらの特許状もアイルランドで発給され、どちらも特許権者は、自分の貨幣二十シリング分を持ち込む者があれば、それを引き取り、代わりに金貨または銀貨を支払う義務を負っていました。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-040"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The patents both of Lord Dartmouth and Knox were referred to the Attorney-general here, and a report made accordingly, and both, as I have already said, were passed in this kingdom. Knox had only a patent for the remainder of the term granted to Lord Dartmouth, the patent expired in 1701, and upon a petition by Roger Moor to have it renewed, the matter was referred hither, and upon the report of the attorney and solicitor, that it was not for His Majesty's service or the interest of the nation to have it renewed, it was rejected by King William. It should therefore seem very extraordinary, that a patent for coining copper halfpence, intended and professed for the good of the kingdom, should be passed without once consulting that kingdom, for the good of which it is declared to be intended, and this upon the application of a \"poor, private obscure mechanic;\" and a patent of such a nature, that as soon as ever the kingdom is informed of its being passed, they cry out unanimously against it as ruinous and destructive. The representative of the nation in Parliament, and the Privy-council address the King to have it recalled; yet the patentee, such a one as I have described, shall prevail to have this patent approved, and his private interest shall weigh down the application of a whole kingdom. St. Paul says, \"All things are lawful, but all things are not expedient.\" We are answered that this patent is lawful, but is it expedient? We read that the high-priest said \"It was expedient that one Man should die for the people;\" and this was a most wicked proposition. But that a whole nation should die for one man, was never heard of before."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[321]"
    "line_start": 3733
    "source_sequence": 370
  "translation_ja": "ダートマス卿とノックスの特許状は、どちらも当地の法務総裁に照会され、それに応じた報告が作られ、すでに述べたように、どちらもこの王国で発給されました。ノックスが得たのは、ダートマス卿に認められた期間の残りの分だけであり、特許状は一七〇一年に失効しました。その更新を求めるロジャー・ムーアの請願に対しては、件は当地に照会され、法務総裁と法務次官が、更新は陛下のためにも国民の利益にもならないと報告したため、ウィリアム王によって却下されました。それゆえ、王国の利益を意図し、そう公言される半ペニー銅貨の鋳造特許状が、利益を受けるはずのその王国に一度も相談せず発給されるのは、甚だしく異例のことと思われます。それも、「貧しく無名の一職人」の申請によってです。しかも、その特許状は、発給されたことを王国が知るや否や、破滅と破壊をもたらすものだとして、全員が声をそろえて反対するような性質のものなのです。議会における国民の代表者も、枢密院も、取り消していただくよう国王に上奏します。それでも、私が描いてきたような特許権者のほうが勝って、その特許状を承認させ、その私益が王国全体の訴えより重んじられるのです。聖パウロは、「すべてのことは許されているが、すべてのことが益になるわけではない」と言っています。この特許状は合法だと、私たちは答えられます。しかし、益になるのでしょうか。大祭司が、「民のために一人の人が死ぬほうがよい」と言ったと、私たちは読んでいます。これは甚だしく邪悪な主張でした。しかし、一人の人のために国民全体が死ぬほうがよいなどということは、これまで聞いたこともありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-041"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But because much weight is laid on the precedents of other patents, for coining copper for Ireland, I will set this matter in as clear a light as I can. Whoever hath read the Report, will be apt to think, that a dozen precedents at least could be produced of copper coined for Ireland, by virtue of patents passed in England, and that the coinage was there too; whereas I am confident, there cannot be one precedent shewn of a patent passed in England for coining copper for Ireland, for above an hundred years past, and if there were any before, it must be in times of confusion. The only patents I could ever hear of, are those already mentioned to Lord Dartmouth and Knox; the former in 1680. and the latter in 1685. Now let us compare these patents with that granted to Wood. First, the patent to Knox, which was under the same conditions as that granted to Lord Dartmouth, was passed in Ireland, the government and the Attorney and Solicitor-general making report that it would be useful to this kingdom: [The patentee was obliged to make every halfpenny one hundred and ten grains Troy weight, whereby 2s. 2d. only could be coined out of a pound of copper.][14] The patent was passed with the advice of the King's council here; The patentee was obliged to receive his coin from those who thought themselves surcharged, and to give gold and silver for it; Lastly, The patentee was to pay only 16l. 13s. 4d. per ann. to the crown. Then, as to the execution of that patent. First, I find the halfpence were milled, which, as it is of great use to prevent counterfeits (and therefore industriously avoided by Wood) so it was an addition to the charge of coinage. And for the weight and goodness of the metal; I have several halfpence now by me, many of which weigh a ninth part more than those coined by Wood, and bear the fire and hammer a great deal better; and which is no trifle, the impression fairer and deeper. I grant indeed, that many of the latter coinage yield in weight to some of Wood's, by a fraud natural to such patentees; but not so immediately after the grant, and before the coin grew current: For in this circumstance Mr. Wood must serve for a precedent in future times."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[322]"
    "line_start": 3758
    "source_sequence": 371
  "translation_ja": "しかし、アイルランド向けの銅貨鋳造のために与えられたほかの特許状の先例が、これほど重視されていますので、この問題をできるだけはっきりさせておきましょう。「報告」を読んだ人は誰でも、イングランドで発給された特許状に基づきアイルランド向けに銅貨を鋳造した先例が、少なくとも一ダースは挙げられ、鋳造もイングランドで行われたと思いがちでしょう。しかし私は、過去百年余りの間に、アイルランド向け銅貨鋳造の特許状がイングランドで発給された先例は、一つも示せないと確信しています。それ以前にあったとしても、混乱の時代のことに違いありません。私が聞いたことのある特許状は、先に述べたダートマス卿とノックスへのものだけで、前者は一六八〇年、後者は一六八五年です。では、この二つをウッドに与えられた特許状と比べてみましょう。第一に、ダートマス卿に与えられたものと同じ条件のノックスの特許状は、政府、法務総裁、法務次官が、この王国に役立つとの報告を作成して、アイルランドで発給されました。［特許権者は半ペニー銅貨一枚をトロイ衡で百十グレーンとする義務を負い、それによって一ポンドの銅から鋳造できるのは、二シリング二ペンス分だけでした。］[14] 特許状は、当地の国王の枢密院の助言を得て発給されました。特許権者は、銅貨を持たされすぎたと考える人々から、その貨幣を引き取り、代わりに金銀を渡す義務を負っていました。最後に、特許権者が王室に支払うのは、年十六ポンド十三シリング四ペンスだけでした。次に、その特許状の履行についてです。第一に、半ペニー銅貨には縁の刻みが付けられていたことが分かります。これは偽造を防ぐのに大変役立ち、だからこそウッドは熱心に避けているのですが、鋳造費を余計に要するものでもありました。そして、重さと金属の質についていえば、今私の手もとにある数枚の半ペニー銅貨は、その多くがウッドの鋳造したものより九分の一重く、火や槌にもはるかによく耐えます。刻印も、決して小さなことではありませんが、もっと鮮明で深いのです。確かに、後期の鋳造分には、ウッドのものの一部よりも軽いものが数多くあります。この種の特許権者にはつきものの不正です。しかし、特許の直後、まだ貨幣が通用し始めないうちから、ということではありません。この点では、ウッド氏こそ将来の先例となるに違いありません。"
  "translation_status": "reviewed"
  "translation_required": true

    "evidence_ja": "底本注の署名: F."
- "id": "dl-l05-note-013-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The reference here is to Swift's sermon on \"Doing Good.\" See Swift's Works, vol. iv., p. 181, present edition. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[561]"
    "line_start": 6248
    "source_sequence": 642
  "translation_ja": "ここで指すのは、スウィフトの説教「善を行うことについて」。本版『スウィフト著作集』第四巻一八一頁参照。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-043"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have heard the late Chief Justice Holt[14]affirm, that in all criminal cases, the most favourable interpretation should be put upon words, that they can possibly bear. You meet the same position asserted in many trials, for the greatest crimes; though often very ill practised, by the perpetual corruption of judges. And I remember, at a trial in Kent, where Sir George Rook[15] was indicted for calling a gentleman knave and villain; the lawyer for the defendant brought off his client, by alleging, that the words were not injurious; for, knave in the old and true signification, imported only a servant; and villain in Latin, is villicus; which is no more than a man employed in country labour; or rather a bailiff."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[562]"
    "line_start": 6252
    "source_sequence": 643
  "translation_ja": "故ホルト首席裁判官[14]が、あらゆる刑事事件では、言葉が許すかぎり、最も被告人に有利な解釈を与えるべきだ、と断言するのを、私は聞いたことがあります。同じ原則は、最も重大な犯罪についての多くの裁判でも、主張されています。ただし、判事たちの絶え間ない腐敗によって、実際には往々にして、ひどく不十分にしか守られていません。そして、ケントで、サー・ジョージ・ルーク[15]がある紳士を「knave、悪党」「villain、ならず者」と呼んだかどで訴えられた裁判を、私は覚えています。被告側の弁護士は、この言葉には侮辱はない、と主張して、依頼人を無罪にしたのです。knaveは、古い本来の意味では単なる召使を表し、villainをラテン語にすればvillicusであり、これは農作業に雇われている者、むしろ農場管理人という以上の意味はない、というわけでした。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-note-014-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Sir John Holt (1642-1710) held the recordership of London, in 1685, and was appointed Lord Chief Justice of the King's Bench in 1688. In the celebrated case, Ashby v.. White, Holt strongly upheld the rights of the voter as against the House of Commons. He was distinguished, in his time, for the fair and impartial hearing he always accorded a prisoner, and he even personally assisted the accused in cases where the law did not allow him to be represented by counsel. Many of Holt's opinions did become \"standard maxims.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[563]"
    "line_start": 6265
    "source_sequence": 644
  "translation_ja": "サー・ジョン・ホルト（一六四二―一七一〇）は、一六八五年にロンドン市の法律顧問判事を務め、一六八八年に王座裁判所の首席裁判官に任命された。有名なアシュビー対ホワイト事件では、庶民院に対抗して有権者の権利を強く擁護した。被告人に対して常に公正で偏りのない審理を行うことで、当時際立っており、法律上、弁護人をつけることが認められない事件では、自ら被告人を助けることさえあった。ホルトの意見の多くは、実際に「標準となる法の格言」となった。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-note-015-001"
  "section_id": "letter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Admiral Sir George Rooke (1650-1709), who, with Rear-Admiral Byng, captured Gibraltar in 1704. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[564]"
    "line_start": 6275
    "source_sequence": 645
  "translation_ja": "サー・ジョージ・ルーク提督（一六五〇―一七〇九）。一七〇四年、ビング海軍少将とともにジブラルタルを攻略した。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l05-044"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If Sir John Holt's opinion were a standard maxim for all times and circumstances, any writer, with a very small measure of discretion, might easily be safe; but, I doubt, in practice it hath been frequently controlled, at least before his time; for I take it to be an old rule in law."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[565]"
    "line_start": 6279
    "source_sequence": 646
  "translation_ja": "サー・ジョン・ホルトの意見が、どんな時代、どんな事情でも標準となる法の格言であるなら、どの筆者も、ごくわずかな分別さえあれば、容易に身を守れるでしょう。しかし実際には、少なくともあの方の時代より前には、しばしば抑えつけられていたのではないかと思います。法律上の古い原則だと、私は理解しているのですが。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-045"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have read, or heard, a passage of Signor Leti, an Italian; who being in London, busying himself with writing the History of England, told King Charles the Second, that he endeavoured as much as he could to avoid giving offence, but found it a thing impossible; although he should have been as wise as Solomon: The King answered, that if this were the case, he had better employ his time in writing proverbs as Solomon did: But Leti lay under no public necessity of writing; neither would England have been one halfpenny the better, or the worse, whether he writ or no."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[566]"
    "line_start": 6286
    "source_sequence": 647
  "translation_ja": "イタリア人のレーティ氏について、ある話を読んだか聞いたかしたことがあります。ロンドンに滞在し、イングランド史の執筆に忙しくしていたころ、チャールズ二世に、できるかぎり不興を買わないよう努めているが、たとえソロモンほど賢かったとしても、それは不可能だとわかった、と話したそうです。国王は、そういうことなら、ソロモンのように格言を書くことに時間を使ったほうがよい、とお答えになりました。しかし、レーティには、公の必要に迫られて書く理由はありませんでしたし、彼が書こうと書くまいと、イングランドには半ペニー分の得にも損にもならなかったでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-046"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This I mention, because I know it will readily be objected, \"What have private men to do with the public? What call had a Drapier to turn politician, to meddle in matters of state? Would not his time have been better employed in looking to his shop; or his pen in writing proverbs, elegies, ballads, garlands, and wonders? He would then have been out of all danger of proclamations, and prosecutions. Have we not able magistrates and counsellors hourly watching over the public weal?\" All this may be true: And yet, when the addresses from both Houses of Parliament, against Mr. Wood's halfpence, failed of success; if some pen had not been employed, to inform the people how far they might legally proceed, in refusing that coin, to detect the fraud, the artifice, and insolence of the coiner; and to lay open the most ruinous consequences to the whole kingdom; which would inevitably follow from the currency of the said coin; I might appeal to many hundred thousand people, whether any one of them would ever have had the courage or sagacity to refuse it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[567]"
    "line_start": 6296
    "source_sequence": 648
  "translation_ja": "この話を挙げたのは、すぐに次のような異議が出ることを知っているからです。「私人に公共の事柄が何の関係がある。羅紗商が政治家に転じ、国政に口を挟むなど、どんな資格があったのか。店の面倒を見ることに時間を使うか、格言や哀歌や俗謡や歌集や奇談を書くことに筆を使うほうが、よかったのではないか。そうしていれば、布告や訴追の危険からまったく無縁でいられた。われわれには、一刻一刻、公共の幸福を見守る、有能な行政官や顧問官がいないとでもいうのか」。どれも本当かもしれません。それでも、ウッド氏の半ペニー銅貨に反対する議会両院の上奏が失敗したとき、もし誰かが筆を執り、この貨幣を拒むにあたって法律上どこまで行動してよいのかを人々に知らせず、この鋳貨業者の詐欺と策略と横柄さを暴かず、その貨幣の流通から必ず生じる、王国全体にとってこの上なく破滅的な結果を明らかにしなかったら、どうだったでしょう。何十万もの人々にお尋ねしてよいと思います。その中の誰か一人でも、それを拒む勇気や先見の明を持てたでしょうか。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-047"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If this copper should begin to make its way among the common, ignorant people, we are inevitably undone; it is they who give us the greatest apprehension, being easily frighted, and greedy to swallow misinformations: For, if every man were wise enough to understand his own interest, which is every man's principal study, there would be no need of pamphlets upon this occasion. But, as things stand, I have thought it absolutely necessary, from my duty to God, my King, and my country, to inform the people, that the proclamation lately issued against the Drapier, doth not in the least affect the case of Mr. Wood and his coin; but only refers to certain paragraphs in the Drapier's last pamphlet, (not immediately relating to his subject, nor at all to the merits of the cause,) which the government was pleased to dislike; so that any man has the same liberty to reject, to write, and to declare against this coin, which he had before: Neither is any man obliged to believe, that those honourable persons (whereof you are the first) who signed that memorable proclamation against the Drapier, have at all changed their opinions, with regard to Mr. Wood or his coin."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[568]"
    "line_start": 6313
    "source_sequence": 649
  "translation_ja": "この銅貨が、物事を知らない一般の人々の間に入り込み始めたら、私たちの破滅は避けられません。最も不安なのはその人々なのです。たやすくおびえさせられ、誤った情報を進んでうのみにするからです。誰もが、自分にとって何が利益かを理解できるほど賢ければ――自分の利益こそ誰もが第一に考えることですが――、この件で小冊子など必要ないでしょう。しかし現状では、私は神と国王と祖国に対する義務から、次のことを人々に知らせるのが、絶対に必要だと思いました。最近ドレイピアに対して出された布告は、ウッド氏とその貨幣の問題には、少しも関わりません。ただ、政府がお気に召さなかった、ドレイピアの最後の小冊子の特定の段落だけを指しています。それらは主題に直接関係せず、この問題の本質にはまったく関係のない段落です。したがって、誰もが以前と同じく、この貨幣を拒み、これに反対して書き、意見を述べる自由を持っています。また、ドレイピアに対するあの記念すべき布告に署名した、閣下を筆頭とする名誉ある方々が、ウッド氏やその貨幣について、少しでも考えを変えたと信じる義務は、誰にもありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-048"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Therefore concluding myself to be thus far upon a safe and sure foot; I shall continue, upon any proper occasion, as God enables me, to revive and preserve that spirit raised in the nation, (whether the real author were a real Drapier or no is little to the purpose) against this horrid design of Mr. Wood; at the same time carefully watching every stroke of my pen, and venturing only to incur the public censure of the world as a writer; not of my Lord Chief Justice Whitshed, as a criminal. Whenever an order shall come out by authority, forbidding all men upon the highest penalties, to offer anything in writing or discourse against Mr. Wood's halfpence; I shall certainly submit. However, if that should happen, I am determined to be somewhat more than the last man in the kingdom to receive them; because I will never receive them at all: For, although I know how to be silent; I have not yet learned to pay active obedience against my conscience, and the public safety."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[569]"
    "line_start": 6332
    "source_sequence": 650
  "translation_ja": "ですから、ここまでは安全で確かな足場に立っていると考え、私は今後も、ふさわしい機会があるたび、神から力をいただくかぎり、ウッド氏のこの恐ろしい企てに反対して国民の間に起こった気概を、よみがえらせ、保ち続けるつもりです。その気概を生んだ本当の著者が、本物の羅紗商であるかどうかなど、大したことではありません。同時に、一筆一筆に注意深く目を配り、あえて受ける非難は、筆者として世間一般から受けるものだけにし、犯罪者としてホイットシェッド首席裁判官卿から受けるものにはしません。ウッド氏の半ペニー銅貨に反対することは、書いても語ってもならず、違反には最も重い刑罰を科す、と権力者の命令が出れば、私は必ず従います。しかし、もしそうなったとしても、この王国でそれを受け取る最後の一人より、さらに後になるつもりです。なにしろ私は、決して受け取りませんから。沈黙する仕方は心得ていますが、良心と公共の安全に反して、行動によって服従することは、まだ学んでいないのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-049"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I desire to put a case, which I think the Drapier, in some of his books, hath put before me; although not so fully as it requires."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[570]"
    "line_start": 6348
    "source_sequence": 651
  "translation_ja": "ここで一つの場合を考えていただきたいと思います。ドレイピアも著書のどこかで、私より先に取り上げたと思いますが、必要なほど十分には論じていないものです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-050"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "You know the copper halfpence in England are coined by the public; and every piece worth pretty tolerably near the value of the copper. Now suppose, that, instead of the public coinage, a patent had been granted to some private, obscure person, for coining a proportionable quantity of copper in that kingdom, to what Mr. Wood is preparing in this; and all of it at least five times below the intrinsic value: The current money of England is reckoned to be twenty millions; and ours under five hundred thousand pounds: By this computation, as Mr. Wood hath power to give us 108,000 pound; so the patentee in England, by the same proportion, might circulate four millions three hundred and twenty thousand pounds; besides as much more by stealth and counterfeits: I desire to know from you, whether the Parliament might not have addressed upon such an occasion; what success they probably would have had; and how many Drapiers would have risen to pester the world with pamphlets: Yet that kingdom would not be so great a sufferer as ours in the like case; because their cash would not be conveyed into foreign countries, but lie hid in the chests of cautious, thrifty men, until better times. Then I desire, for the satisfaction of the public, that you will please to inform me why this country is treated in so very different a manner, in a point of such high importance; whether it be on account of Poining's act; of subordination; dependence; or any other term of art; which I shall not contest, but am too dull to understand."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[571]"
    "line_start": 6352
    "source_sequence": 652
  "translation_ja": "ご存じのとおり、イングランドの半ペニー銅貨は公の手で鋳造され、一枚ごとの銅の価値も、額面とかなり近いものです。そこで仮に、公の鋳造に代えて、どこかの名もない個人に、ウッド氏がこの国のために用意している量と釣り合うだけの銅貨を、あの王国で鋳造する特許状が与えられたとしましょう。そしてその全部が、実質的には額面のせいぜい五分の一の価値しかないとします。イングランドで流通する貨幣は二千万ポンド、私たちの国では五十万ポンド未満と見積もられています。この計算によると、ウッド氏が私たちに十万八千ポンドを与える権限を持つのと同じ割合で、イングランドの特許権者は四百三十二万ポンドを流通させられることになります。さらに、それと同じだけを密かに、偽造によって流通させることもできます。そこで閣下に伺いたいのです。こういう場合、議会は上奏しなかったでしょうか。それはおそらくどのような結果を得たでしょうか。また、何人のドレイピアが現れ、小冊子で世間を騒がせたでしょうか。それでもあの王国は、同じ立場にある私たちほど、大きな損害は受けないでしょう。あちらの現金は国外へ運び出されず、慎重で倹約家の人々の金庫に隠され、時代がよくなるのを待つでしょうから。そこで、人々が納得できるよう、この上なく重要な点で、この国がこれほど違った扱いを受けるのはなぜか、お教えいただきたいのです。ポイニングズ法のせいでしょうか。下位にあること、従属していることのせいでしょうか。それとも何か別の専門用語でしょうか。私はそれを争うつもりはありません。ただ愚鈍で、理解できないのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-051"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am very sensible, that the good or ill success of Mr. Wood, will affect you less than any person of consequence in the kingdom; because I hear you are so prudent as to make all your purchases in England; and truly so would I, if I had money, although I were to pay a hundred years' purchase; because I should be glad to possess a freehold that could not be taken from me by any law to which I did not give my own consent; and where I should never be in danger of receiving my rents in mixed copper, at the loss of sixteen shillings in the pound. You can live in ease and plenty at Pepper-harrow, in Surrey; and therefore I thought it extremely generous and public-spirited in you to be of the kingdom's side in this dispute, by shewing, without reserve, your disapprobation of Mr. Wood's design; at least if you have been so frank to others as you were to me; which indeed I could not but wonder at, considering how much we differ in other points; and therefore I could get but few believers, when I attempted to justify you in this article from your own words."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[572]"
    "line_start": 6376
    "source_sequence": 653
  "translation_ja": "ウッド氏の成功不成功が閣下に及ぼす影響は、この王国の有力者の誰よりも小さいことは、十分承知しています。賢明にも、不動産はすべてイングランドで買っておられると伺うからです。まったく、私にも金があれば、百年分の収益に当たる代価を払ってでも、そうするでしょう。自分自身が同意していない法律によっては奪われることのない自由保有地を持ちたいですし、地代を合金の銅貨で受け取り、一ポンドにつき十六シリングを失う危険など、決してないところにいたいからです。閣下はサリーのペッパーハローで、安楽に豊かに暮らせます。ですから、この争いで、ウッド氏の計画への反対を包み隠さず示し、王国の側に立たれたのは、きわめて寛大で公共心のあることだと、私は思いました。少なくとも、私に対するのと同じほど率直に、ほかの人にも話されていたなら、です。実際、ほかの点では私たちの意見が大きく違っていることを考えれば、驚かずにはいられませんでした。それで、ご自身のお言葉によって、この点での閣下の立場を弁護しようとしても、信じてくれる人はほとんどいなかったのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-052"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I would humbly offer another thought, which I do not remember to have fallen under the Drapier's observation. If these halfpence should once gain admittance; it is agreed, that in no long space of time, what by the clandestine practices of the coiner, what by his own counterfeits, and those of others, either from abroad or at home; his limited quantity would be trebled upon us, until there would not be a grain of gold or silver visible in the nation. This, in my opinion would lay a heavy charge upon the crown, by creating a necessity of transmitting money from England to pay the salaries at least of the principal civil officers: For I do not conceive how a judge (for instance) could support his dignity with a thousand pounds a year in Wood's coin; which would not intrinsically be worth near two hundred. To argue that these halfpence, if no other coin were current, would answer the general ends of commerce among ourselves, is a great mistake; and the Drapier hath made that matter too clear to admit an answer; by shewing us what every owner of land must be forced to do with the products of it in such a distress. You may read his remarks at large in his second and third letter; to which I refer you."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[573]"
    "line_start": 6393
    "source_sequence": 654
  "translation_ja": "もう一つ、ドレイピアは気づいていなかったように記憶している考えを、謹んで申し上げたいと思います。この半ペニー銅貨がひとたび入り込めば、鋳貨業者の密かな手口や、その者自身による偽造、さらに国内外の他人による偽造によって、ほどなくして、許可された量の三倍が私たちに押しつけられ、ついにはこの国に金銀が一粒も見えなくなる、という点では、皆の意見が一致しています。私の考えでは、これは王権に重い負担をかけることになります。少なくとも主だった文官の俸給を支払うために、イングランドから送金する必要が生じるからです。たとえば判事が、ウッドの貨幣で年千ポンドをもらっても、その実質価値が二百ポンドにも遠く及ばないのであれば、どうやってその威厳を保てるのか、私にはわかりません。ほかに流通する貨幣がなければ、この半ペニー銅貨でも、私たちの間での取引の一般的な目的は果たせる、というのは大きな間違いです。ドレイピアは、そのような窮境で、土地を持つ者が誰も、自分の土地の生産物をどう扱わざるを得なくなるかを示し、この問題を、反論の余地がないほど明らかにしています。第二、第三書簡に詳しく述べていますので、そちらをお読みください。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-053"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Before I conclude, I cannot but observe, that for several months past, there have more papers been written in this town, such as they are, all upon the best public principle, the love of our country, than, perhaps, hath been known in any other nation, and in so short a time: I speak in general, from the Drapier down to the maker of ballads; and all without any regard to the common motives of writers: which are profit, favour, and reputation. As to profit, I am assured by persons of credit, that the best ballad upon Mr. Wood will not yield above a groat to the author; and the unfortunate adventurer Harding, declares he never made the Drapier any present, except one pair of scissors. As to favour, whoever thinks to make his court by opposing Mr. Wood is not very deep in politics. And as to reputation, certainly no man of worth and learning, would employ his pen upon so transitory a subject, and in so obscure a corner of the world, to distinguish himself as an author. So that I look upon myself, the Drapier, and my numerous brethren, to be all true patriots in our several degrees."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[574]"
    "line_start": 6412
    "source_sequence": 655
  "translation_ja": "終える前に、どうしても指摘しておきたいことがあります。この数か月の間、この町では、出来はともかく、祖国への愛という最も立派な公共の原則から書かれた文書が、おそらくほかのどの国でも、これほど短い期間に例がなかったほど、多数現れました。ドレイピアから俗謡の作者までを、ひとまとめに言っているのです。そのすべてが、筆者たちの普通の動機、すなわち利益、引き立て、名声を顧みずに書いています。利益については、信用できる人々から、ウッド氏についての最高の俗謡でも、作者の手に入るのは一グロートを超えない、と保証されています。また、不運な事業家ハーディングは、ドレイピアには鋏一丁のほか、何も贈ったことがないと述べています。引き立てについていえば、ウッド氏に反対してご機嫌を取れると思う人は、政治にあまり通じていません。名声についていえば、立派で学問のある人が、こんな一時的な題材で、しかも世界のこれほど目立たない片隅で、著述家として名を上げるために筆を執るはずはありません。ですから私は、自分も、ドレイピアも、大勢いる仲間たちも、それぞれの程度に応じて、真の愛国者であると思っています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-054"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "All that the public can expect for the future, is only to be sometimes warned to beware of Mr. Wood's halfpence; and refer them for conviction to the Drapier's reasons. For, a man of the most superior understanding, will find it impossible to make the best use of it, while he writes in constraint; perpetually softening, correcting, or blotting out expressions, for fear of bringing his printer, or himself, under a prosecution from my Lord Chief-Justice Whitshed. It calls to my remembrance the madman in Don Quixote, who being soundly beaten by a weaver for letting a stone (which he always carried on his shoulder) fall upon a spaniel, apprehended that every cur he met was of the same species."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[575]"
    "line_start": 6429
    "source_sequence": 656
  "translation_ja": "人々が今後期待できるのは、ウッド氏の半ペニー銅貨に気をつけるよう、ときおり警告を受け、納得するためにドレイピアの論拠を読むよう勧められること、それだけです。いかに優れた理解力の持ち主でも、制約されながら書く間は、その力を最大限に発揮することは不可能です。ホイットシェッド首席裁判官卿の訴追を、自分や印刷者に招くのを恐れ、絶えず表現を和らげ、直し、消さなければならないのですから。『ドン・キホーテ』の狂人を思い出します。いつも肩に担いでいた石をスパニエル犬の上に落として、織物職人にひどく殴られたため、それからは出会う野良犬がどれも同じ種類ではないかと恐れた、あの男です。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-055"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For these reasons, I am convinced, that what I have now written will appear low and insipid; but if it contributes, in the least, to preserve that union among us for opposing this fatal project of Mr. Wood, my pains will not be altogether lost."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[576]"
    "line_start": 6441
    "source_sequence": 657
  "translation_ja": "こうした理由から、今私の書いたものは、低調で味気なく見えるだろうと確信しています。それでも、ウッド氏のこの致命的な計画に反対するため、私たちの結束を保つことに少しでも役立てば、私の苦労も、すっかり無駄にはならないでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-056"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I sent these papers to an eminent lawyer (and yet a man of virtue and learning into the bargain) who, after many alterations returned them back, with assuring me, that they are perfectly innocent; without the least mixture of treason, rebellion, sedition, malice, disaffection, reflection, or wicked insinuation whatsoever."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[577]"
    "line_start": 6447
    "source_sequence": 658
  "translation_ja": "この原稿は、ある著名な法律家へ送りました。しかもその方は、徳と学識まで兼ね備えた人です。多くの修正をしたうえで送り返し、これは完全に潔白であり、反逆、反乱、扇動、悪意、不忠、中傷、その他いかなる邪悪なほのめかしも、少しも混じっていない、と保証してくださいました。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l05-057"
  "section_id": "letter-05-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If the bellman of each parish, as he goes his circuit, would cry out, every night, \"Past twelve o'clock; Beware of Wood's halfpence;\" it would probably cut off the occasion for publishing any more pamphlets; provided that in country towns it were done upon market days. For my own part, as soon as it shall be determined, that it is not against law, I will begin the experiment in the liberty of St. Patrick's; and hope my example may be followed in the whole city But if authority shall think fit to forbid all writings, or discourses upon this subject, except such as are in favour of Mr. Wood, I will obey as it becomes me; only when I am in danger of bursting, I will go and whisper among the reeds, not any reflection upon the wisdom of my countrymen; but only these few words, BEWARE OF WOOD'S HALFPENCE."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[578]"
    "line_start": 6454
    "source_sequence": 659
  "translation_ja": "各教区の夜回りが、毎晩巡回の際に、「十二時を過ぎました。ウッドの半ペニー銅貨にご用心」と叫べば、おそらく小冊子をこれ以上出版する必要はなくなるでしょう。ただし地方の町では、市の立つ日に行うことにします。私自身は、法律違反でないと決まり次第、聖パトリック大聖堂の特別管轄区でこの実験を始めるつもりです。そして町全体がこの例に倣ってくれることを願います。しかし権力者が、ウッド氏を支持するものを除き、この問題についての一切の著述や発言を禁じるのが適当とお考えになるなら、私は身分にふさわしく従います。ただし、胸が張り裂けそうになったときだけは、葦の間へ行って、ささやくでしょう。同胞たちの賢明さを誹謗することなど、一つも言いません。ただ次のわずかな言葉だけです。「ウッドの半ペニー銅貨にご用心」。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

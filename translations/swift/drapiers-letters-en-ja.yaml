- "id": "dl-l06-017"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But in order to make some excuse for being more speculative than others of my condition, I desire your lordship's pardon, while I am doing a very foolish thing, which is, to give you some little account of myself."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[606]"
    "line_start": 6806
    "source_sequence": 710
  "translation_ja": "しかし、同じ境遇のほかの人々よりも物思いにふけりがちなことを、いささか弁明するため、ひどく愚かなことをする間、どうか閣下にお許しいただきたいのです。私自身について、ほんの少しお話しすることです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-018"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I was bred at a free school where I acquired some little knowledge in the Latin tongue, I served my apprenticeship in London, and there set up for myself with good success, till by the death of some friends, and the misfortunes of others, I returned into this kingdom, and began to employ my thoughts in cultivating the woollen manufacture through all its branches Wherein I met with great discouragement and powerful opposers, whose objections appeared to me very strange and singular They argued that the people of England would be offended if our manufactures were brought to equal theirs; and even some of the weaving trade were my enemies, which I could not but look upon as absurd and unnatural I remember your lordship at that time did me the honour to come into my shop, where I shewed you a piece of black and white stuff just sent from the dyer, which you were pleased to approve of, and be my customer for it.[8]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[607]"
    "line_start": 6811
    "source_sequence": 711
  "translation_ja": "私は無料の学校で育ち、そこでラテン語をいくらか覚えました。ロンドンで徒弟奉公をし、それから独立して、うまく商売をしていました。ところが友人の幾人かが亡くなり、ほかの人々にも不運が重なったので、この王国へ戻り、毛織物業のあらゆる部門を育てることに、思いを向けるようになりました。そこで、大きな妨害と強力な反対者に出会いましたが、その異議は、私には非常に奇妙で特異なものに思えました。私たちの製品がイングランドの製品に肩を並べるようになれば、イングランドの人々の気分を害する、と言うのです。織物業者の中にまで私の敵がおり、愚かで不自然なことだと思わずにはいられませんでした。そのころ閣下には、ご親切にも私の店へお越しいただき、染物屋から戻ったばかりの白黒の布地をお見せしたところ、お気に召して、お買い上げいただいたことを覚えています。[8]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-note-008-001"
  "section_id": "letter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The \"piece of black and white stuff just sent from the dyer,\" refers to his pamphlet, issued in 1720, \"The Proposal for the Universal Use of Irish Manufactures.\" See vol. vii. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[608]"
    "line_start": 6826
    "source_sequence": 712
  "translation_ja": "「染物屋から戻ったばかりの白黒の布地」とは、一七二〇年刊の小冊子『アイルランド製品の普遍的使用についての提案』を指す。第七巻参照。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l06-019"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "However I was so mortified, that I resolved for the future to sit quietly in my shop, and deal in common goods like the rest of my brethren; till it happened some months ago considering with myself that the lower and poorer sort of people wanted a plain strong coarse stuff to defend them against cold easterly winds, which then blew very fierce and blasting for a long time together, I contrived one on purpose, which sold very well all over the kingdom, and preserved many thousands from agues I then made a second and a third kind of stuffs for the gentry with the same success, insomuch that an ague hath hardly been heard of for some time.[9]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[609]"
    "line_start": 6831
    "source_sequence": 713
  "translation_ja": "しかし私はすっかり意気をくじかれ、今後はほかの同業者のように、店でおとなしく普通の品物を扱っていこうと決めました。ところが数か月前、身分の低い貧しい人々には、長い間ひどく激しく吹きつけ、身を切るようだった冷たい東風を防ぐため、飾り気のない、丈夫な粗い布地が必要だと思い至りました。それで、そのための布を考案したところ、王国じゅうでたいへんよく売れ、何千人もの人を悪寒の出る熱病から守りました。そこで紳士方のために、第二、第三の布地も作り、同じ成功を収めました。おかげで、しばらくは、そんな熱病の話をほとんど聞かないほどでした。[9]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-note-009-001"
  "section_id": "letter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The \"cold easterly winds\" refer to the demands made on the Irish people to accept Wood's halfpence. The three different kinds of \"stuffs\" are the three letters written under the nom de guerre, \"M.B. Drapier.\" [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[610]"
    "line_start": 6842
    "source_sequence": 714
  "translation_ja": "「冷たい東風」とは、ウッドの半ペニー銅貨を受け入れるよう、アイルランドの人々に加えられた要求を指す。三種類の「布地」とは、「M・B・ドレイピア」という筆名で書かれた三通の書簡である。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l06-020"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This incited me so far, that I ventured upon a fourth piece made of the best Irish wool I could get, and I thought it grave and rich enough to be worn by the best lord or judge of the land. But of late some great folks complain as I hear, \"that when they had it on, they felt a shuddering in their limbs,\" and have thrown it off in a rage, cursing to hell the poor Drapier who invented it, so that I am determined never to work for persons of quality again, except for your lordship and a very few more.[10]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[611]"
    "line_start": 6848
    "source_sequence": 715
  "translation_ja": "これにすっかり励まされ、私は手に入るかぎり上等のアイルランド羊毛で、あえて第四の布を織ってみました。この国の最高の貴族や判事が着るにも、十分に重々しく、豪華だと思ったのです。ところが近ごろ、偉い方々の中から、「これを着ると手足に震えを感じる」という苦情が出ていると聞きます。そして腹を立てて脱ぎ捨て、これを考案した哀れな羅紗商に、地獄へ落ちろと呪いを浴びせたそうです。そこで私は、閣下と、ごくわずかな方々を除き、二度と身分の高い方々のための仕事はしない、と決めています。[10]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-note-010-001"
  "section_id": "letter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This refers to the fourth letter of the Drapier, which brought forth the proclamation, and for the author of which the reward of £300 was offered. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[612]"
    "line_start": 6857
    "source_sequence": 716
  "translation_ja": "これはドレイピアの第四書簡を指す。この書簡のために布告が出され、著者を見つけた者には三百ポンドの報奨が示された。[T.S.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l06-021"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I assure your lordship upon the word of an honest citizen, that I am not richer by the value of one of Mr. Wood's halfpence with the sale of all the several stuffs I have contrived; for I give the whole profit to the dyers and pressers.[11] And therefore I hope you will please to believe, that no other motive beside the love of my country could engage me to busy my head and hands to the loss of my time and the gain of nothing but vexation and ill-will."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[613]"
    "line_start": 6862
    "source_sequence": 717
  "translation_ja": "正直な市民の言葉にかけて、閣下に保証します。私が考案したさまざまな布地をすべて売っても、ウッド氏の半ペニー銅貨一枚分すら、私は豊かになっていません。利益は丸ごと、染物屋とプレス屋に与えているからです。[11]ですから、祖国への愛以外の動機では、時間を失い、いらだちと敵意しか得られないのに、頭と手をせわしなく動かす気にはならないと、お信じいただきたいのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-note-011-001"
  "section_id": "letter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The printers [F.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[614]"
    "line_start": 6871
    "source_sequence": 718
  "translation_ja": "印刷者たちのこと。[F.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: F."
- "id": "dl-l06-022"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have now in hand one piece of stuff to be woven on purpose for your lordship, although I might be ashamed to offer it you, after I have confessed that it will be made only from the shreds and remnants of the wool employed in the former. However I shall work it up as well as I can, and at worst, you need only give it among your tenants."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[615]"
    "line_start": 6874
    "source_sequence": 719
  "translation_ja": "今、閣下のために特別に織ろうとしている布地が一枚、手元にあります。もっとも、先の布地に使った羊毛の切れ端や残りだけで作ると白状しては、差し上げるのが恥ずかしくなるかもしれません。それでも、できるだけうまく仕上げるつもりですし、最悪でも、小作人の誰かにお与えになれば済むことです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-023"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am very sensible how ill your lordship is like to be entertained with the pedantry of a drapier in the terms of his own trade. How will the matter be mended, when you find me entering again, though very sparingly, into an affair of state; for such is now grown the controversy with Mr. Wood, if some great lawyers are to be credited. And as it often happens at play, that men begin with farthings, and go on to gold, till some of them lose their estates, and die in jail; so it may possibly fall out in my case, that by playing too long with Mr. Wood's halfpence, I may be drawn in to pay a fine, double to the reward for betraying me, be sent to prison, and \"not be delivered thence till I shall have paid the uttermost farthing.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[616]"
    "line_start": 6881
    "source_sequence": 720
  "translation_ja": "羅紗商が自分の商売の専門用語をひけらかすのを聞かされても、閣下にはさぞ退屈だろうと、よくわかっています。それなのに、ほんのわずかとはいえ、私がまた国政の問題へ入っていくのをご覧になれば、いったいどれほど話がましになるでしょうか。偉い法律家たちの言うことを信じるなら、ウッド氏との争いは、今では国政の問題に育ってしまったのです。そして賭け事ではよくあるように、ファージングで始めた人が金貨にまで進み、ついには財産を失い、牢で死ぬ者まで出るのと同じことが、私にも起こるかもしれません。ウッド氏の半ペニー銅貨をあまり長くもてあそんでいると、私を売る報奨の二倍の罰金を払わされ、牢へ送られて、「最後の一ファージングを払い終えるまで、そこから出られない」ことになるかもしれないのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-024"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There are my lord, three sorts of persons with whom I am resolved never to dispute: A highwayman with a pistol at my breast, a troop of dragoons who come to plunder my house, and a man of the law who can make a merit of accusing me. In each of these cases, which are almost the same, the best method is to keep out of the way, and the next best is to deliver your money, surrender your house, and confess nothing."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[617]"
    "line_start": 6894
    "source_sequence": 721
  "translation_ja": "閣下、私は三種類の人間とは、決して議論しないと決めています。胸に拳銃を突きつけてくる追い剥ぎ、家を略奪しに来る竜騎兵の一隊、そして私を告発することで手柄を立てられる法律家です。この三つはほとんど同じ場合ですが、最善の方法は、近づかないことです。次によいのは、金を差し出し、家を明け渡し、何も自白しないことです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-025"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am told that the two points in my last letter, from which an occasion of offence hath been taken, are where I mention His Majesty's answer to the address of the House of Lords upon Mr. Wood's patent, and where I discourse upon Ireland's being a dependent kingdom. As to the former, I can only say, that I have treated it with the utmost respect and caution, and I thought it necessary to shew where Wood's patent differed in many essential parts from all others that ever had been granted, because the contrary had for want of due information been so strongly and so largely asserted. As to the other, of Ireland's dependency, I confess to have often heard it mentioned, but was never able to understand what it meant. This gave me the curiosity to enquire among several eminent lawyers, who professed they knew nothing of the matter. I then turned over all the statutes of both kingdoms without the least information, further than an Irish act, that I quoted, of the 33d of Henry 8th, uniting Ireland to England under one king. I cannot say I was sorry to be disappointed in my search, because it is certain, I could be contented to depend only upon God and my prince and the laws of my own country, after the manner of other nations. But since my betters are of a different opinion, and desire further dependencies, I shall readily submit, not insisting on the exception I made of M.B. Drapier. For indeed that hint was borrowed from an idle story I had heard in England, which perhaps may be common and beaten, but because it insinuates neither treason nor sedition, I will just barely relate it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[618]"
    "line_start": 6902
    "source_sequence": 722
  "translation_ja": "最後の書簡で非難のきっかけとなったのは、二つの箇所だと聞いています。ウッド氏の特許状について貴族院が行った上奏に対する陛下の返答に触れた箇所と、アイルランドが従属王国であることについて論じた箇所です。前者については、最大限の敬意と注意をもって扱ったとしか言えません。ウッドの特許状が、これまで与えられたほかのすべての特許状と、多くの重要な点でどう違うかを示すのは、必要なことだと思いました。正しい情報がないために、その反対のことがあまりに強く、広く主張されていたからです。後者の、アイルランドの従属については、しばしば耳にしたことを認めますが、その意味を理解できたことは一度もありません。それで好奇心を起こし、優れた法律家数人に尋ねましたが、皆、何も知らないと明言しました。そこで両王国の法律をすべて繰りましたが、私が引用した、ヘンリー八世治世第三十三年のアイルランドの法律、つまりアイルランドをイングランドと一人の国王の下に結びつけるもののほかは、何の情報も得られませんでした。探して何も見つからなかったのを、残念だったとは言えません。ほかの国民と同じく、神と自分の君主と自国の法律だけに従属することで、私は確かに満足できるからです。しかし私より上の方々は違う意見を持ち、さらに従属先を増やしたいとお望みなのですから、私は喜んで従い、M・B・ドレイピアについて設けた例外に固執することはしません。実際、あの思いつきは、イングランドで聞いたつまらない話から借りたものでした。よく知られた、ありふれた話かもしれませんが、反逆も扇動もほのめかすものではないので、ただそのままお話ししましょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-026"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Some hundred years ago when the peers were so great that the commons were looked upon as little better than their dependents, a bill was brought in for making some new additions to the power and privileges of the peerage. After it was read, one Mr. Drewe a member of the house, stood up, and said, he very much approved the bill, and would give his vote to have it pass; but however, for some reasons best known to himself, he desired that a clause might be inserted for excepting the family of the Drewes. The oddness of the proposition taught others to reflect a little, and the bill was thrown out."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[619]"
    "line_start": 6927
    "source_sequence": 723
  "translation_ja": "数百年前、貴族がたいへん強大で、庶民はその従属者と大差ないと見なされていたころ、貴族の権力と特権に、新たなものをいくつか加える法案が提出されました。朗読が済むと、下院議員のドリュー氏が立ち、この法案には大いに賛成で、可決に票を投じるが、ただ、自分だけがよく知るいくつかの理由から、ドリュー家を例外とする条項を入れていただきたい、と言いました。この提案の奇妙さで、ほかの人々も少し考えるようになり、法案は否決されました。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-027"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Whether I were mistaken, or went too far in examining the dependency must be left to the impartial judgment of the world, as well as to the courts of judicature, although indeed not in so effectual and decisive a manner. But to affirm, as I hear some do, in order to countenance a fearful and servile spirit, that this point did not belong to my subject, is a false and foolish objection. There were several scandalous reports industriously spread by Wood and his accomplices to discourage all opposition against his infamous project. They gave it out that we were prepared for a rebellion, that we disputed the King's prerogative, and were shaking off our dependency. The first went so far, and obtained so much belief against the most visible demonstrations to the contrary, that a great person of this kingdom, now in England, sent over such an account of it to his friends, as would make any good subject both grieve and tremble. I thought it therefore necessary to treat that calumny as it deserved. Then I proved by an invincible argument that we could have no intention to dispute His Majesty's prerogative, because the prerogative was not concerned in the question, the civilians and lawyers of all nations agreeing that copper is not money. And lastly to clear us from the imputation of shaking off our dependency, I shewed wherein as I thought this dependency consisted, and cited the statute above mentioned made in Ireland, by which it is enacted, that \"whoever is King of England shall be King of Ireland,\" and that the two kingdoms shall be \"for ever knit together under one King.\" This, as I conceived, did wholly acquit us of intending to break our dependency, because it was altogether out of our power, for surely no King of England will ever consent to the repeal of that statute."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[620]"
    "line_start": 6938
    "source_sequence": 724
  "translation_ja": "従属を調べるにあたって私が間違っていたか、行き過ぎたかは、裁判所ばかりでなく、世間の公平な判断にも委ねるほかありません。もっとも、世間には裁判所ほどの実効性や決定権はありませんが。しかし、聞くところでは一部の人々が、臆病で卑屈な精神を助長するため、この点は私の主題に関係しないと主張しているそうです。これは誤った、愚かな異議です。ウッドとその共謀者は、あの悪名高い計画に対するあらゆる反対をくじこうと、いくつもの中傷的な噂を、せっせと広めました。私たちは反乱の用意をしている、国王の大権を争っている、従属を振り捨てようとしている、と言いふらしたのです。第一の噂は、反対の証拠がこの上なく明白だったにもかかわらず、あまりに広まり、あまりに信じられたため、今イングランドにいるこの王国のある偉い方が、善良な臣民なら誰もが悲しみ震えるような報告を、こちらの友人たちに送ってきたほどでした。ですから私は、この誹謗を、その性質にふさわしく扱う必要があると思いました。次に、陛下の大権を争う意図など、私たちにはあり得ないことを、反論の余地のない論拠で証明しました。どの国のローマ法学者も法律家も、銅は貨幣ではないと認めている以上、大権はこの問題に関わらないからです。最後に、従属を振り捨てようとしているとの非難を晴らすため、この従属が何から成ると私が考えるかを示し、前に述べたアイルランドの法律を引用しました。「イングランドの国王である者は、アイルランドの国王であるべきこと」、両王国は「一人の国王の下に、永久に結び合わされること」を定めた法律です。これによって、従属を断つ意図があるという疑いは、完全に晴れたと考えました。私たちには、それをする力がまるでないのですから。イングランドの国王が、その法律の廃止に同意することなど、決してないはずです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-028"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But upon this article I am charged with a heavier accusation. It is said I went too far, when I declared, that \"if ever the Pretender should come to be fixed upon the throne of England (which God forbid) I would so far venture to transgress this statute, that I would lose the last drop of my blood before I would submit to him as King of Ireland.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[621]"
    "line_start": 6965
    "source_sequence": 725
  "translation_ja": "ところが、この点について、もっと重い非難を浴びせられています。次のように宣言したのは行き過ぎだ、というのです。「もし王位僭称者が、イングランドの王座に据えられるようなことにでもなれば――神よ、それを防ぎたまえ――、私はあえて、それほどまでにこの法律を犯し、彼にアイルランド王として服従する前に、最後の一滴まで血を流すだろう」。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-029"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This I hear on all sides, is the strongest and weightiest objection against me, and which hath given the most offence; that I should be so bold to declare against a direct statute, and that any motive how strong soever, could make me reject a King whom England should receive. Now if in defending myself from this accusation I should freely confess, that I \"went too far,\" that \"the expression was very indiscreet, although occasioned by my zeal for His present Majesty and his Protestant line in the House of Hanover,\" that \"I shall be careful never to offend again in the like kind.\" And that \"I hope this free acknowledgment and sorrow for my error, will be some atonement and a little soften the hearts of my powerful adversaries.\" I say if I should offer such a defence as this, I do not doubt but some people would wrest it to an ill meaning by some spiteful interpretation, and therefore since I cannot think of any other answer, which that paragraph can admit, I will leave it to the mercy of every candid reader."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[622]"
    "line_start": 6972
    "source_sequence": 726
  "translation_ja": "これが私への最も強く重い異議であり、最も大きな不興を招いたものだと、方々で聞きます。はっきりした法律にあえて反対を唱え、どんなに強い動機があろうとも、イングランドが受け入れる国王を拒むとは何事か、というのです。さて、この非難から自分を守るため、私が率直に、「行き過ぎた」、「その表現はきわめて軽率だった。もっとも、それは現在の陛下と、ハノーファー家のプロテスタント王統に対する熱意から出たものだった」、「今後は同じ種類の過ちを決して犯さぬよう注意する」と認めたとしましょう。さらに、「この率直な告白と、自分の誤りへの悔恨が、いくらかの償いとなり、力ある敵対者の心を少しでも和らげることを望む」と言ったとしましょう。このような弁明をしたとしても、ある人々は意地悪な解釈によって、悪い意味にねじ曲げるに違いありません。ですから、あの段落について、ほかに可能な返答を思いつかない以上、私は公正な読者の一人一人の寛容に、これを委ねます。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l06-030"
  "section_id": "letter-06-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I will now venture to tell your lordship a secret, wherein I fear you are too deeply concerned You will therefore please to know that this habit of writing and discoursing, wherein I unfortunately differ from almost the whole kingdom, and am apt to grate the ears of more than I could wish, was acquired during my apprenticeship in London, and a long residence there after I had set up for myself. Upon my return and settlement here, I thought I had only changed one country of freedom for another. I had been long conversing with the writings of your lordship,[12] Mr. Locke, Mr. Molineaux,[13] Colonel Sidney[14] and other dangerous authors, who talk of \"liberty as a blessing, to which the whole race of mankind hath an original title, whereof nothing but unlawful force can divest them.\" I knew a good deal of the several Gothic institutions in Europe, and by what incidents and events they came to be destroyed; and I ever thought it the most uncontrolled and universally agreed maxim, that freedom consists in a people being governed by laws made with their own consent; and slavery in the contrary. I have been likewise told, and believe it to be true, that liberty and property are words of known use and signification in this kingdom, and that the very lawyers pretend to understand, and have them often in their mouths. These were the errors which have misled me, and to which alone I must impute the severe treatment I have received. But I shall in time grow wiser, and learn to consider my driver, the road I am in, and with whom I am yoked. This I will venture to say, that the boldest and most obnoxious words I ever delivered, would in England have only exposed me as a stupid fool, who went to prove that the sun shone in a clear summer's day; and I have witnesses ready to depose that your lordship hath said and writ fifty times worse, and what is still an aggravation, with infinitely more wit and learning, and stronger arguments, so that as politics run, I do not know a person of more exceptionable principles than yourself; and if ever I shall be discovered, I think you will be bound in honour to pay my fine and support me in prison; or else I may chance to inform against you by way of reprisal.[15]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[623]"
    "line_start": 6989
    "source_sequence": 727
  "translation_ja": "ここで、閣下に一つの秘密を、あえてお話しします。恐らく閣下には、あまりに深い関わりがある秘密です。どうかお聞きください。この王国のほとんどすべての人と、不幸にも私が違っている点、つまり、望むより多くの方々の耳を不快にしかねない、この書いたり論じたりする癖は、ロンドンでの徒弟時代と、独立してからの長い滞在の間に身につけたものです。こちらに帰って住みついたときも、自由のある一つの国から、別の自由のある国へ移っただけだと思っていました。私は長く、閣下[12]、ロック氏、モリニュー氏[13]、シドニー大佐[14]、その他の危険な著者の書物に親しんできました。そういう人々は、「自由は、人類全体が生まれながらに権利を持ち、不法な力によってしか奪い去ることのできない恵みである」と論じます。私はヨーロッパ各地のゴート人に由来する制度について、また、それがどんな出来事や成り行きによって壊されたかについて、かなり知っていました。そして、人々が自分たちの同意で作った法律によって治められることこそ自由であり、その反対が隷属だということは、最も疑いようがなく、誰もが認める原則だと、ずっと考えていました。また、自由や財産という言葉は、この王国でも使い方と意味が知られており、法律家たち自身も、理解している顔をして、しばしば口にするのだと聞き、本当だと信じています。これらこそ、私を迷わせた誤りであり、私が受けた厳しい扱いは、ただこれだけのせいにするほかありません。しかし、やがては賢くなり、自分を追い立てる御者も、今いる道も、誰と同じ軛につながれているかも、考慮するようになるでしょう。これだけは、あえて申します。私がこれまで述べた最も大胆で、最も嫌われた言葉も、イングランドなら、晴れた夏の日に太陽が輝いていることを証明しようとする、愚かな馬鹿だと思われるだけだったでしょう。また閣下が、五十倍もひどいことを話し、書いてこられたと、いつでも証言できる証人がいます。さらに罪を重くすることに、それがはるかに優れた機知と学識と、より強力な論拠によってなされているのです。ですから、今の政治のあり方では、閣下ほど非難すべき原則をお持ちの方を、私は知りません。もし私の正体がわかったら、閣下は名誉にかけて、私の罰金を払い、牢での暮らしを支える義務があると思います。そうでなければ、仕返しに閣下を密告することになるかもしれません。[15]"

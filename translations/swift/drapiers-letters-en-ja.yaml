- "id": "dl-l02-002"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sir, In your Newsletter of the 1st. instant there is a paragraph dated from London, July 25th. relating to Wood's halfpence; whereby it is plain what I foretold in my \"Letter to the Shopkeepers, &c.\" that this vile fellow would never be at rest, and that the danger of our ruin approaches nearer, and therefore the kingdom requires NEW and FRESH WARNING; however I take that paragraph to be, in a great measure, an imposition upon the public, at least I hope so, because I am informed that Wood is generally his own newswriter. I cannot but observe from that paragraph that this public enemy of ours, not satisfied to ruin us with his trash, takes every occasion to treat this kingdom with the utmost contempt. He represents \"several of our merchants and traders upon examination before a committee of council, agreeing that there was the utmost necessity of copper money here, before his patent, so that several gentlemen have been forced to tally with their workmen and give them bits of cards sealed and subscribed with their names.\" What then? If a physician prescribes to a patient a dram of physic, shall a rascal apothecary cram him with a pound, and mix it up with poison? And is not a landlord's hand and seal to his own labourers a better security for five or ten shillings, than Wood's brass seven times below the real value, can be to the kingdom, for an hundred and four thousand pounds?[3]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[172]"
    "line_start": 1829
    "source_sequence": 209
  "translation_ja": "拝啓。今月一日付のあなたの新聞に、ウッドの半ペニー銅貨について、七月二十五日ロンドン発の記事が載っています。それを見ると、この卑しい男は決しておとなしくはならないという、私が『商店主その他の皆さんへの書簡』で予言したことが、はっきり分かります。私たちの破滅の危険はますます近づいており、したがって、この王国には新たな警告を改めて発する必要があります。もっとも、この記事の大部分は世間を欺くものだと思います。少なくとも、そうであってほしい。ウッドはたいてい、自分で自分の記事を書くと聞いているからです。この記事からはまた、私たち共通の敵であるこの男が、がらくたで私たちを破滅させるだけでは満足せず、機会あるごとにこの王国をこの上なく侮辱していることが分かります。彼の述べるところでは、「アイルランドの商人、業者数名が、枢密院の委員会での審問に際し、特許が与えられる前には、当地で銅貨がどうしても必要であったこと、そこで何人もの紳士が、職工との間で割符を用い、自分の名を書いて印を押したカードの切れ端を渡さねばならなかったことを認めた」というのです。それがどうしたというのでしょう。医者が患者に一ドラムの薬を処方したら、悪党の薬屋は一ポンド分を、毒まで混ぜて無理やり飲ませてよいのでしょうか。それに、地主が自分の労働者に渡す署名と印章は、五シリングや十シリングの支払いに対してなら、額面の七分の一の実質価値しかないウッドの真鍮が十万四千ポンド分について王国に与えるより、確かな保証ではありませんか。[3]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":

    "xpath": "/html/body/p[560]"
    "line_start": 6244
    "source_sequence": 641
  "translation_ja": "著者の筆になる『アイルランド製品の普遍的使用についての提案』のことと思われる。[F.]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"

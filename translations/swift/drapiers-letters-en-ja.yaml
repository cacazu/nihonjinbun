    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-019"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But when the 'squire turns farmer and merchant himself, all the good money he gets from abroad, he will hoard up or send for England, and keep some poor tailor or weaver and the like in his own house, who will be glad to get bread at any rate."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[128]"
    "line_start": 1467
    "source_sequence": 159
  "translation_ja": "しかし、郷紳が自分で農民にも商人にもなれば、外国から得る良い貨幣はすべてため込むか、イングランドへ送ってしまいます。そして貧しい仕立屋や織工などを何人か自分の屋敷に置くでしょう。そうした者たちは、どんな条件であれ食べ物にありつければ喜ぶのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-020"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I should never have done if I were to tell you all the miseries that we shall undergo if we be so foolish and wicked as to take this CURSED COIN. It would be very hard if all Ireland should be put into one scale, and this sorry fellow Wood into the other, that Mr. Wood should weigh down this whole kingdom, by which England gets above a million of good money every year clear into their pockets, and that is more than the English do by all the world besides."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[129]"
    "line_start": 1473
    "source_sequence": 160
  "translation_ja": "この呪われた貨幣を受け取るほど愚かで悪い人間に私たちがなったら、どれほどの惨めさに苦しむことになるか、語っていけばきりがありません。アイルランド全土をはかりの一方の皿に載せ、もう一方にこのつまらない男ウッドを載せたとき、ウッド氏のほうが王国全体より重いとされたら、あまりにひどい話です。イングランドはこの王国から、毎年百万ポンドを超える良い貨幣を、純益として自分たちの懐へ入れているのです。それは、イングランド人が世界のそのほかの国々すべてから得る額よりも多いのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-021"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But your great comfort is, that as His Majesty's patent does not oblige you to take this money, so the laws have not given the crown a power of forcing the subjects to take what money the King pleases: For then by the same reason we might be bound to take pebble-stones or cockle-shells or stamped leather for current coin, if ever we should happen to live under an ill prince, who might likewise by the same power make a guinea pass for ten pounds, a shilling for twenty shillings, and so on, by which he would in a short time get all the silver and gold of the kingdom into his own hands, and leave us nothing but brass or leather or what he pleased. Neither is anything reckoned more cruel or oppressive in the French government than their common practice of calling in all their money after they have sunk it very low, and then coining it anew at a much higher value, which however is not the thousandth part so wicked as this abominable project of Mr. Wood. For the French give their subjects silver for silver and gold for gold, but this fellow will not so much as give us good brass or copper for our gold and silver, nor even a twelfth part of their worth."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[130]"
    "line_start": 1482
    "source_sequence": 161
  "translation_ja": "しかし、皆さんには大きな安心の種があります。陛下の特許状は、この貨幣を受け取る義務を皆さんに負わせてはいません。それと同様、法律も、王の好きな貨幣を臣民に無理やり受け取らせる権力を、王権に与えてはいないのです。もしそんな権力があれば、悪い君主の治世に生きる羽目になったとき、同じ理屈で、小石でも貝殻でも刻印つきの革でも、通貨として受け取らねばならなくなります。その君主は同じ権力で、一ギニーを十ポンド、一シリングを二十シリングとして通用させることもできるでしょう。そうやって短い間に、王国の銀と金をすべて自分の手に集め、私たちには真鍮なり革なり、好きな物だけを残すことになります。フランス政府のやり方の中でも、貨幣の価値をひどく下げてから全部を回収し、それよりずっと高い価値の貨幣に鋳造し直す、あの常套手段ほど残酷で圧制的だと思われているものはありません。それでさえ、ウッド氏の忌まわしい計画の悪辣さの千分の一にもならないのです。フランス人は臣民に、銀には銀、金には金を渡します。ところがこの男は、私たちの金銀に対し、まともな真鍮や銅さえよこさず、その値打ちの十二分の一すら渡そうとしません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-022"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Having said thus much, I will now go on to tell you the judgments of some great lawyers in this matter, whom I fee'd on purpose for your sakes, and got their opinions under their hands, that I might be sure I went upon good grounds."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[131]"
    "line_start": 1501
    "source_sequence": 162
  "translation_ja": "ここまで申し上げましたので、次に、この問題について高名な法律家たちが下した判断をお伝えしましょう。皆さんのためにわざわざ謝礼を払って相談し、確かな根拠に立っていると確認できるよう、署名入りの意見を頂いたのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-023"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A famous law-book, called \"The Mirror of Justice,\"[24] discoursing of the articles (or laws) ordained by our ancient kings declares the law to be as follows: \"It was ordained that no king of this realm should change, impair or amend the money or make any other money than of gold or silver without the assent of all the counties,\" that is, as my Lord Coke says,[25] without the assent of Parliament."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[132]"
    "line_start": 1507
    "source_sequence": 163
  "translation_ja": "『司法の鏡』[24]という有名な法律書は、昔の王たちの定めた条項、つまり法律を論じる中で、次のように法を述べています。「この王国のいかなる王も、すべての州の同意なく、貨幣を変更、減損、改良してはならず、また金銀以外の貨幣を作ってはならない、と定められた。」すなわち、クック卿の言うとおり、[25] 議会の同意がなければ、ということです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-024-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This was an important legal treatise often quoted by Coke. Its full title is: \"The Booke called, The Mirrour of Justices: Made by Andrew Home. With the book, called, The Diversity of Courts, And Their Jurisdictions ... London ... 1646.\" The French edition was printed in 1642 with the title, \"La somme appelle Mirroir des Justices: vel speculum Justiciariorum, Factum per Andream Home.\" Coke quotes it from a manuscript, as he died before it was printed. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[133]"
    "line_start": 1515
    "source_sequence": 164
  "translation_ja": "これはクックがしばしば引用した、重要な法律論の書である。正式な書名は『司法の鏡と呼ばれる書、アンドルー・ホーム著。諸裁判所の相違とその裁判権と呼ばれる書を付す……ロンドン……一六四六年』。フランス語版は一六四二年に『La somme appelle Mirroir des Justices: vel speculum Justiciariorum, Factum per Andream Home』という題で刊行された。クックは刊行前に没しているので、写本から引用している。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-note-025-001"
  "section_id": "letter-01"

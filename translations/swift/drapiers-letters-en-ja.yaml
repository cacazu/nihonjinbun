  "source_text": |-
    A
                                  LETTER
                                   TO THE
                   Shop-Keepers, Tradesmen, Farmers
                     and Common-People of
                    IRELAND,

                               Concerning the
                             Brass Half-pence
                                 Coined by

                               Mr. Woods,

                                    WITH
                   A Design to have them Pass in this
                                 KINGDOM.

                   Wherein is shewn the Power of the said PATENT,
                     the Value of the HALF-PENCE, and
                     how far every Person may be oblig'd to take the
                     same in Payments, and how to behave in Case
                     such an Attempt shou'd be made by WOODS
                     or any other Person.

                   [Very Proper to be kept in every FAMILY.]

                           By M.B. Drapier.

                   DUBLIN: Printed by J. Harding
                     in Molesworth's-Court.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"

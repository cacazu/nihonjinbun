- "id": "dl-l04-031"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "'Tis true indeed, that within the memory of man, the Parliaments of England have sometimes assumed the power of binding this kingdom by laws enacted there,[21] wherein they were at first openly opposed (as far as truth, reason and justice are capable of opposing) by the famous Mr. Molineux,[22] an English gentleman born here, as well as by several of the greatest patriots, and best Whigs in England; but the love and torrent of power prevailed. Indeed the arguments on both sides were invincible. For in reason, all government without the consent of the governed is the very definition of slavery: But in fact, eleven men well armed will certainly subdue one single man in his shirt. But I have done. For those who have used power to cramp liberty have gone so far as to resent even the liberty of complaining, although a man upon the rack was never known to be refused the liberty of roaring as loud as he thought fit."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[445]"
    "line_start": 5108
    "source_sequence": 510
  "translation_ja": "確かに、人々の記憶にある時代にも、イングランド議会はときどき、そこで制定した法律によって、この王国を拘束する権限を僭称しました。[21] これには当初、当地生まれのイングランド人紳士、著名なモリニュー氏や、[22] イングランドの最も偉大な愛国者、最良のホイッグの人々のうち数名が、真理と道理と正義の及ぶ限り、公然と反対しました。しかし、権力への欲望とその激流のほうが勝ったのです。実際、双方の議論とも、打ち破れないものでした。道理のうえでは、統治される者の同意なしに行うあらゆる統治は、奴隷制の定義そのものです。しかし事実のうえでは、十分に武装した十一人は、下着一枚のたった一人を、確実に征服します。しかし、もうやめましょう。権力を使って自由を抑え込んできた人々は、苦情を言う自由にさえ腹を立てるところまで来ています。拷問台に載せられた人が、思う存分大声でわめく自由を拒まれた例など、聞いたこともないのですが。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-note-021-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Particularly in the reign of William III., when this doctrine of English supremacy was assumed, in order to discredit the authority of the Irish Parliament summoned by James II. [S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"

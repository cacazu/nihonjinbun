    "contributor_id": "swift"
- "id": "dl-l03-note-013-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "It was not intended that Poyning's act should interfere with the liberty of the people, but it is undoubted that advantage was taken of this law, and an interpretation put on it far different from the intention that brought it on the statute books. It was passed by a parliament convened by Sir Edward Poyning, at Drogheda, in the tenth year of Henry VII.'s reign. Its immediate cause was the invasion of Perkin Warbeck. That pretender assumed royal authority in Ireland and had several statutes passed during his short-lived term of power. To prevent any viceroy from arrogating to himself the powers of law-making it was enacted by Poyning's parliament:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[314]"
    "line_start": 3642
    "source_sequence": 363
  "translation_ja": "ポイニングス法は、国民の自由を侵害する意図で作られたものではない。しかし、この法律が利用され、法令集に載せた当初の意図とはまったく異なる解釈を加えられたことは、疑いない。これは、ヘンリー七世の治世第十年、エドワード・ポイニングス卿がドロヘダに召集した議会で成立した。直接の原因は、パーキン・ウォーベックの侵入であった。この王位僭称者は、アイルランドで王権を僭称し、その短い権力の座にある間に、いくつかの法律を成立させた。いかなる副王も立法権を僭取することのないよう、ポイニングスの議会は次のように定めた。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-013-002"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"That no parliament be holden hereafter in Ireland, but at such season as the King's lieutenant and counsaile there first do certifie the King, under the Great Seal of that land, the causes and considerations, and all such acts as them seemeth should pass in the same parliament, and such causes, considerations, and acts affirmed by the King and his counsaile to be good and expedient for that land, and his licence thereupon, as well in affirmation of the said causes and acts, as to summon the said parliament, under his Great Seal of England had and obtained; that done, a parliament to be had and holden as afore rehearsed\" (\"Irish Statutes,\" vol. i., p. 44)."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[315]"
    "line_start": 3654
    "source_sequence": 364
  "translation_ja": "「今後アイルランドで議会を開くには、まず当地の国王代理官および枢密院が、同国の国璽のもとに、その理由、検討事項、および当該議会で成立させるべきと考えるすべての法案を国王に証明し、当該の理由、検討事項、および法案が、同国にとって善良かつ適切であると国王およびその枢密院によって認められ、前記の理由と法案の承認、ならびに前記議会の召集の双方について、イングランドの国璽のもとに国王の許可が取得された時に限る。以上が行われたのち、前記のとおり議会を開き、開催するものとする」（『アイルランド法令集』第一巻、四四頁）。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-013-003"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Two statutes, one, the Act of 3 and 4 Phil., and Mary, cap. 4, and the other of II Eliz. Ses. 3, cap. 8, explain this act further, and the latter points out the reason for the original enactment, namely, that \"before this statute, when liberty was given to the governors to call parliaments at their pleasure, acts passed as well to the dishonour of the prince, as to the hindrance of their subjects\" (\"Irish Statutes,\" vol. i., p. 346)."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[316]"
    "line_start": 3666
    "source_sequence": 365
  "translation_ja": "二つの法律、すなわちフィリップおよびメアリー治世第三・四年第四章の法律と、エリザベス治世第十一年第三会期第八章の法律が、この法律をさらに説明している。後者は当初の制定理由を次のように示す。「この法律以前には、統治官たちが意のままに議会を召集する自由を与えられていたため、君主の名誉を傷つけ、またその臣民を妨げる法律が成立した」（『アイルランド法令集』第一巻、三四六頁）。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":

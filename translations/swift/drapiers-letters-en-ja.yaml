  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-008"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "His first proposal is, that \"whereas he hath already coined seventeen thousand pounds, and has copper prepared to make it up forty thousand pounds, he will be content to coin no more, unless the EXIGENCES OF TRADE REQUIRE IT, though his patent empowers him to coin a far greater quantity.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[184]"
    "line_start": 1971
    "source_sequence": 221
  "translation_ja": "最初の提案は、こうです。「すでに一万七千ポンド分を鋳造し、四万ポンド分に達するだけの銅を用意しているが、特許ははるかに多い量の鋳造を認めているとはいえ、商業上の必要が生じない限り、それ以上は鋳造しないことで了承する。」"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-009"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "To which if I were to answer it should be thus: \"Let Mr. Wood and his crew of founders and tinkers coin on till there is not an old kettle left in the kingdom: let them coin old leather, tobacco-pipe clay or the dirt in the streets, and call their trumpery by what name they please from a guinea to a farthing, we are not under any concern to know how he and his tribe or accomplices think fit to employ themselves.\" But I hope and trust, that we are all to a man fully determined to have nothing to do with him or his ware."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[185]"
    "line_start": 1978
    "source_sequence": 222
  "translation_ja": "これに答えるなら、私はこう言いましょう。「ウッド氏も、その仲間の鋳物師や鋳掛屋たちも、王国に古い釜が一つもなくなるまで、勝手に鋳造を続けるがよい。古い革でも、煙管を作る粘土でも、道の泥でも貨幣にして、その安物を、一ギニーから一ファージングまで、好きな名で呼ぶがよい。彼とその一族や共犯者が、どんな仕事をするつもりなのか、私たちは知ったことではない。」しかし、私たち全員が一人残らず、彼にもその商品にも一切かかわらないと、固く決意していることを、私は願い、信じています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-010"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The King has given him a patent to coin halfpence, but hath not obliged us to take them, and I have already shewn in my \"Letter to the Shopkeepers, &c.\" that the law hath not left it in the power of the prerogative to compel the subject to take any money, beside gold and silver of the right sterling and standard."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[186]"
    "line_start": 1988
    "source_sequence": 223
  "translation_ja": "王は彼に半ペニー銅貨を鋳造する特許を与えましたが、私たちにそれを受け取る義務を課してはいません。そして『商店主その他の皆さんへの書簡』ですでに示したとおり、正しいスターリングの品位と基準にかなう金銀以外の貨幣を、臣民に無理に受け取らせる権限を、法律は王の大権に認めていないのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-011"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Wood further proposes, (if I understand him right, for his expressions are dubious) that \"he will not coin above forty thousand pounds, unless the exigences of trade require it.\" First, I observe that this sum of forty thousand pounds is almost double to what I proved to be sufficient for the whole kingdom, although we had not one of our old halfpence left. Again I ask, who is to be judge when the exigences of trade require it? Without doubt he means himself, for as to us of this poor kingdom, who must be utterly ruined if his project should succeed, we were never once consulted till the matter was over, and he will judge of our exigences by his own; neither will these be ever at an end till he and his accomplices will think they have enough: And it now appears that he will not be content with all our gold and silver, but intends to buy up our goods and manufactures with the same coin."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[187]"
    "line_start": 1995
    "source_sequence": 224
  "translation_ja": "ウッドはさらに、「商業上の必要が生じない限り、四万ポンドを超えて鋳造しない」と提案しています。表現が曖昧なので、私の理解が正しければ、ですが。まず指摘しておきたいのは、この四万ポンドという額が、古い半ペニー貨が一枚も残っていないとしても王国全体に十分だと、私が立証した額のほとんど二倍だということです。さらに尋ねます。商業上の必要が生じたとき、誰がそれを判断するのでしょう。もちろん、彼は自分のことを言っているのです。計画が成功すれば完全に破滅する、この貧しい王国の私たちは、すべてが決まるまで、一度も相談されませんでした。彼は私たちの必要を、自分自身の必要で判断するでしょう。そして、彼とその仲間が十分に得たと思うまで、その必要に終わりはありません。いまや、彼は私たちの金銀を全部手にするだけでは満足せず、同じ貨幣で私たちの商品や製品を買い占めるつもりだということも、明らかになっています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-012"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I shall not enter into examination of the prices for which he now proposes to sell his halfpence, or what he calls his copper, by the pound; I have said enough of it in my former letter, and it hath likewise been considered by others. It is certain that by his own first computation, we were to pay three shillings for what was intrinsically worth but one,[9] although it had been of the true weight and standard for which he pretended to have contracted; but there is so great a difference both in weight and badness in several of his coins that some of them have been nine in ten below the intrinsic value, and most of them six or seven.[10]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[188]"
    "line_start": 2010
    "source_sequence": 225
  "translation_ja": "彼がいま、半ペニー銅貨、あるいは彼のいわゆる銅を、重さ一ポンドにつきいくらで売ると提案しているか、その価格の検討には立ち入りません。前の書簡で十分に述べましたし、ほかの人々も検討しています。確かなのは、彼自身の最初の計算によっても、本当の値打ちが一シリングしかないものに、私たちは三シリングを払うことになっていたということです。[9] しかもこれは、彼が契約で約束したという正しい重量と品位があったとしての話です。ところが彼の貨幣は、個々の重量や粗悪さに非常に大きな違いがあり、中には額面に対して実質価値が十分の九も足りないものがあり、たいていのものも十分の六か七は足りませんでした。[10]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-note-009-001"
  "section_id": "letter-02"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The report of the Committee of the Privy Council which sat on Wood's coinage, stated that copper ready for minting cost eighteen pence per pound before it was brought into the Mint at the Tower of London. See the Report prefixed to Letter III. and Appendix II., in which it is also stated that Wood's copper was worth thirteen pence per pound. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[189]"
    "line_start": 2021
    "source_sequence": 226
  "translation_ja": "ウッドの鋳貨を審査した枢密院委員会の報告によると、鋳造の用意を整えた銅の費用は、ロンドン塔の造幣所へ運び込む前で、重さ一ポンドにつき十八ペンスだった。第三書簡の前に置かれた報告と、付録第二を参照。そこにはウッドの銅が、重さ一ポンドにつき十三ペンスの値打ちであったとも記されている。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l02-note-010-001"
  "section_id": "letter-02"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Newton's assay report says that Wood's pieces were of unequal weight. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[190]"
    "line_start": 2028
    "source_sequence": 227
  "translation_ja": "ニュートンの試金報告は、ウッドの貨幣の重量が不揃いだったとしている。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l02-013"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "His last proposal being of a peculiar strain and nature, deserves to be very particularly considered, both on account of the matter and the style. It is as follows."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[191]"
    "line_start": 2032
    "source_sequence": 228
  "translation_ja": "最後の提案は、その調子も性質も独特なので、内容と文体の両方について、とりわけ念入りに検討する必要があります。次のとおりです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-014"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "\"Lastly, in consideration of the direful apprehensions which prevail in Ireland, that Mr. Wood will by such coinage drain them of their gold and silver, he proposes to take their manufactures in exchange, and that no person be obliged to receive more than fivepence halfpenny at one payment.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[192]"
    "line_start": 2037
    "source_sequence": 229
  "translation_ja": "「最後に、ウッド氏がこの鋳貨によってアイルランドの金銀を吸い尽くすのではないかという、同国に広まっている恐ろしい不安に配慮し、交換に同国の製品を受け取ること、また、いかなる者も一度の支払いにおいて五ペンス半を超えて受け取る義務を負わないことを提案する。」"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-015"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "First, Observe this little impudent hardwareman turning into ridicule \"the direful apprehensions of a whole kingdom,\" priding himself as the cause of them, and daring to prescribe what no King of England ever attempted, how far a whole nation shall be obliged to take his brass coin. And he has reason to insult; for sure there was never an example in history, of a great kingdom kept in awe for above a year in daily dread of utter destruction, not by a powerful invader at the head of twenty thousand men, not by a plague or a famine, not by a tyrannical prince (for we never had one more gracious) or a corrupt administration, but by one single, diminutive, insignificant, mechanic."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[193]"
    "line_start": 2044
    "source_sequence": 230
  "translation_ja": "まずご覧ください。このちっぽけで厚かましい金物商が、「王国全体の恐ろしい不安」をあざ笑い、その原因となったことを得意がり、自分の真鍮貨を全国民にどこまで受け取る義務があるか、定めようとまでしています。イングランドの王さえ、一度も企てたことのないことです。もっとも、彼が侮辱したくなるのも無理はありません。一つの大きな王国が、一年以上もおびえさせられ、完全に滅びるのではないかと日々恐れ続けるなど、歴史上、実例がなかったに違いありません。それも、二万人の軍勢を率いた強力な侵略者のせいでも、疫病や飢饉のせいでも、暴虐な君主や腐敗した政府のせいでもなく、たった一人の、取るに足りない、ちっぽけな職工のせいなのですから。君主について言えば、今の方ほど慈悲深い方を頂いたことはありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-016"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But to go on. To remove our \"direful apprehensions that he will drain us of our gold and silver by his coinage:\" This little arbitrary mock-monarch most graciously offers to \"take our manufactures in exchange.\" Are our Irish understandings indeed so low in his opinion? Is not this the very misery we complain of? That his cursed project will put us under the necessity of selling our goods for what is equal to nothing. How would such a proposal sound from France or Spain or any other country we deal with, if they should offer to deal with us only upon this condition, that we should take their money at ten times higher than the intrinsic value? Does Mr. Wood think, for instance, that we will sell him a stone of wool for a parcel of his counters not worth sixpence, when we can send it to England and receive as many shillings in gold and silver? Surely there was never heard such a compound of impudence, villainy and folly."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[194]"
    "line_start": 2056
    "source_sequence": 231
  "translation_ja": "しかし、先へ進みましょう。「鋳貨によって私たちの金銀を吸い尽くすのではないかという、恐ろしい不安」を取り除くため、この小さな専制的な偽君主は、まことにありがたくも、「引換えに私たちの製品を受け取る」と申し出ています。彼の考えでは、私たちアイルランド人の理解力は、それほど低いのでしょうか。それこそまさに、私たちが訴えている災いではありませんか。彼の呪わしい計画のため、私たちは、無に等しいものと引換えに商品を売らざるを得なくなるのです。もしフランスでもスペインでも、ほかの取引相手の国でも、自国の貨幣を実質価値の十倍で受け取ることだけを条件に取引を申し出てきたら、そんな提案はどう聞こえるでしょう。たとえば、ウッド氏は、羊毛一ストーンを、六ペンスの値打ちもない彼の計算札ひと包みで、私たちが売ると思っているのでしょうか。それをイングランドへ送れば、金銀で六シリングも受け取れるというのに。まったく、厚かましさと悪辣さと愚かさを、これほど混ぜ合わせたものは聞いたことがありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-017"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "His proposals conclude with perfect high treason. He promises, that no person shall be obliged to receive more than fivepence halfpenny of his coin in one payment: By which it is plain, that he pretends to oblige every subject in this kingdom to take so much in every payment, if it be offered; whereas his patent obliges no man, nor can the prerogative by law claim such a power, as I have often observed; so that here Mr. Wood takes upon him the entire legislature, and an absolute dominion over the properties of the whole nation."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[195]"
    "line_start": 2071
    "source_sequence": 232
  "translation_ja": "彼の提案は、まぎれもない大逆罪で締めくくられています。一度の支払いで、誰も自分の貨幣を五ペンス半を超えて受け取る義務はない、と彼は約束します。これでは、この王国のすべての臣民に対し、支払いのたびにそれだけ差し出されれば受け取る義務を負わせるつもりなのは明らかです。しかし彼の特許状は誰にも義務を負わせていませんし、何度も述べたとおり、法律上、王の大権にもそのような権力を主張することはできません。ですからウッド氏はここで、立法権のすべてと、全国民の財産に対する絶対的な支配権を、自分にあるものとしているのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l02-018"
  "section_id": "letter-02-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Good God! Who are this wretch's advisers? Who are his supporters, abettors, encouragers, or sharers? Mr. Wood will oblige me to take fivepence halfpenny of his brass in every payment! And I will shoot Mr. Wood and his deputies through the head, like highwaymen or housebreakers, if they dare to force one farthing of their coin upon me in the payment of an hundred pounds. It is no loss of honour to submit to the lion, but who, with the figure of a man, can think with patience of being devoured alive by a rat. He has laid a tax upon the people of Ireland of seventeen shillings at least in the pound; a tax I say, not only upon lands, but interest-money, goods, manufactures, the hire of handicraftsmen, labourers, and servants. Shopkeepers look to yourselves. Wood will oblige and force you to take fivepence halfpenny of his trash in every payment, and many of you receive twenty, thirty, forty payments in a day, or else you can hardly find bread: And pray consider how much that will amount to in a year: Twenty times fivepence halfpenny is nine shillings and twopence, which is above an hundred and sixty pounds a year, whereof you will be losers of at least one hundred and forty pounds by taking your payments in his money. If any of you be content to deal with Mr. Wood on such conditions they may. But for my own particular, \"let his money perish with him.\" If the famous Mr. Hampden rather chose to go to prison, than pay a few shillings to King Charles 1st. without authority of Parliament, I will rather choose to be hanged than have all my substance taxed at seventeen shillings in the pound, at the arbitrary will and pleasure of the venerable Mr. Wood."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[196]"
    "line_start": 2081
    "source_sequence": 233
  "translation_ja": "神よ。このろくでなしに助言しているのは誰ですか。支持し、手助けし、励まし、分け前にあずかっているのは誰ですか。ウッド氏が、支払いのたびに、私に真鍮貨を五ペンス半分受け取らせるですって。百ポンドの支払いに一ファージングでもその貨幣を無理やり押しつけようとするなら、私はウッド氏とその代理人の頭を、追いはぎや押込み強盗と同じように撃ち抜いてやります。獅子に屈しても名誉は失いませんが、人の姿をした者で、鼠に生きながら食われることを平然と考えられる者がいるでしょうか。彼はアイルランド人民に、一ポンドにつき少なくとも十七シリングの税を課したのです。税、と言いました。土地だけでなく、利子収入、商品、製品、職人、労働者、奉公人の賃金にまでかかる税です。商店主の皆さん、ご用心なさい。ウッドは支払いのたびに、そのがらくたを五ペンス半分、無理やり皆さんに受け取らせます。皆さんの多くは、一日に二十回、三十回、四十回の支払いを受けます。それくらいなければ、食べることも難しいでしょう。一年でどれほどになるか、考えてみてください。五ペンス半の二十倍は九シリング二ペンス、一年では百六十ポンドを超えます。そのうち、彼の貨幣で支払いを受けることによる損は、少なくとも百四十ポンドになるのです。そんな条件でウッド氏と取引したい人は、すればよいでしょう。しかし私自身は、「彼の金も彼も共に滅びよ」と言います。かの有名なハムデン氏が、議会の権限なしにチャールズ一世に数シリング払うくらいなら牢に行くほうを選んだのなら、私も、尊敬すべきウッド氏の勝手気ままな意志によって全財産に一ポンド当たり十七シリングの税をかけられるくらいなら、絞首刑を選びます。"

    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l07-009"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But that the same spirit still subsists, hath manifestly appeared (among other instances of great compliance) from certain circumstances, that have attended some late proceedings in a court of judicature. There is not any commonplace more frequently insisted on, by those who treat of our constitution, than the great happiness and excellency of trials by juries; yet if this blessed part of our law be eludible at pleasure, by the force of power, frowns, and artifice; we shall have little reason to boast of our advantage, in this particular, over other states or kingdoms in Europe. And surely, these high proceedings, exercised in a point that so nearly concerned the life-blood of the people, their necessary subsistence, their very food and raiment, and even the public peace; will not allow any favourable appearance; because it was obvious, that so much superabundant zeal could have no other design, or produce any other effect, than to damp that spirit raised in the nation against this accursed scheme of William Wood, and his abettors; to which spirit alone, we owe, and for ever must owe, our being hitherto preserved, and our hopes of being preserved for the future; if it can be kept up, and strongly countenanced by your wise assemblies. I wish I could account for such a demeanour upon a more charitable foundation, than that of putting our interest in over balance with the ruin of our country."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[668]"
    "line_start": 7556
    "source_sequence": 783
  "translation_ja": "しかし、その同じ精神が依然として生きていることは、権力への大いなる迎合を示すほかの例ともども、最近ある裁判所で行われた手続きに伴う、いくつかの事情から明らかになりました。私たちの国制を論じる者が、陪審による裁判の大きな恵みと優秀さほど、たびたび繰り返す常套句はありません。しかし、法のこのありがたい部分が、権力や威圧や策略によって、思うままにすり抜けられるのであれば、この点でヨーロッパのほかの諸国より優れているなどと誇る理由は、ほとんどなくなります。そして、国民の命の糧、欠くことのできない生計、まさに食べ物や衣服、さらには公の平穏にまで、これほど深くかかわる事柄について、このような高圧的手続きが取られたことは、どう見ても好意的には受け取れません。というのも、これほど過剰な熱心さの狙いは、ウィリアム・ウッドとその加担者たちの呪わしい企てに反対して、この国に燃え上がった気概をくじくこと以外にはありえず、またそのほかの結果を生むはずもないからです。今日まで私たちを守ったもの、そして将来も守られるとの希望を与えるものは、ひとえにこの気概であり、この先も永遠にそうであります。皆様の賢明な両院が、これを保ち、力強く支えてくださるならば、ですが。このような振る舞いについて、自分の利益と祖国の破滅を秤にかけて利益のほうを重くする、という説明より、もう少し寛大な解釈ができたらよいのですが。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-010"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I remember some months ago, when this affair was fresh in discourse; a person near allied to SOMEBODY, or (as the hawkers called him) NOBODY, who was thought deeply concerned, went about very diligently among his acquaintance, to shew the bad consequences that might follow from any public resentment to the disadvantage of his ally Mr. Wood; principally alleging the danger of all employments being disposed of from England. One of these emissaries came to me, and urged the same topic: I answered, naturally, that I knew there was no office of any kind, which a man from England might not have, if he thought it worth his asking; and that I looked upon all who had the disadvantage of being born here, as only in the condition of leasers and gleaners. Neither could I forbear mentioning the known fable of the countryman, who entreated his ass to fly for fear of being taken by the enemy; but the ass refused to give himself that trouble; and upon a very wise reason, because he could not possibly change his present master for a worse: The enemy could not make him fare harder; beat him more cruelly; nor load him with heavier burthens."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[669]"
    "line_start": 7578
    "source_sequence": 784
  "translation_ja": "数か月前、この問題がまだ新たな話題であったころのことを覚えております。この件に深くかかわっていると思われていた「何者か」、あるいは街の売り子たちの呼び名では「何者でもない者」と、近い縁のある人物が、知人たちの間をひどく熱心に歩き回り、縁者のウッド氏に不利な形で人々が公然と憤慨したなら、どのような悪い結果が起こりうるかを説いていました。なかでも、すべての官職がイングランドからの指図で割り振られる危険を、主に訴えていたのです。その使者の一人が私の所へ来て、同じ論点を持ち出しました。私は当然の返事として、イングランドから来た者が、願い出るだけの価値があると思えば手にできない官職など、一つもないことは承知しているし、この国に生まれたという不利を負う者は皆、落ち穂を拾う者や刈り残しを集める者と同じ境遇だと考えている、と答えました。また、農夫とロバの、あのよく知られた寓話にも触れずにはいられませんでした。農夫は敵に捕まらぬよう逃げようとロバに頼むのですが、ロバはその骨折りを断ります。実に賢明な理由からです。今の主人より悪い主人に替わることは、どうしてもありえないのですから。敵とて、これ以上ひどい食事をさせることも、もっと残酷に打つことも、もっと重い荷を背負わせることもできないのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-011"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Upon these, and many other considerations, I may affirm it to be the wish of the whole nation, that the power and privileges of juries were declared, ascertained, and confirmed by the legislature; and that whoever hath been manifestly known to violate them, might be stigmatized by public censure; not from any hope that such a censure will amend their practices, or hurt their interest, (for it may probably operate quite contrary in both:) but that the nation may know their enemies from their friends."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[670]"
    "line_start": 7596
    "source_sequence": 785
  "translation_ja": "こうしたことや、ほかにも数多くのことを考えれば、陪審の権能と特権を立法府が明示し、確定し、保証してくださることが、国民全体の願いであると、私は断言できます。また、それらを侵害したことが明らかになった者は、誰であれ公の譴責によって汚名を着せられるべきです。そうした譴責がその行いを改めさせたり、その利益を損ねたりすることを期待してではありません。どちらについても、まったく逆の結果になるかもしれないからです。ただ、国民が味方と敵を見分けられるようにするためです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-012"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I say not this with any regard or view to myself; for I write in great security; and am resolved that none shall merit at my expense further than by shewing their zeal to discover, prosecute, and condemn me, for endeavouring to do my duty in serving my country: And yet I am conscious to myself that I never had the least intention to reflect on His Majesty's ministers, nor on any other person, except William Wood, whom I neither did, nor do yet conceive to be of that number. However, some would have it, that I went too far; but I suppose they will now allow themselves mistaken. I am sure I might easily have gone further; and I think I could not easily have fared worse. And therefore I was no further affected with their proclamation, and subsequent proceedings, than a good clergyman is with the sins of the people. And as to the poor printer, he is now gone to appear before a higher, and before a righteous tribunal."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[671]"
    "line_start": 7605
    "source_sequence": 786
  "translation_ja": "私は自分のことを念頭に置いて、このように申しているのではありません。私は大いに身の安全を確保して書いており、祖国に仕えて義務を果たそうとする私を、捜し出し、訴追し、有罪にしようと熱意を示すこと以外には、誰にも私を踏み台にして功を立てさせまいと決めています。それでも私は、陛下の大臣たちを非難する意図など少しも持たなかったと、自ら確信しております。ほかの何人についても、ウィリアム・ウッドだけを例外として同じです。そのウッドは、以前も今も、私は大臣たちの一人だとは考えておりません。もっとも、私が行き過ぎたと言いたがる者もおりますが、今では誤りだったと認めてくれることでしょう。私なら、もっと先へ進むことはたやすかったと確信しておりますし、今よりさらにひどい目に遭うことは、そう簡単ではなかったと思います。ですから、あの布告と、それに続く手続きに私が心を痛めたとしても、それは善良な聖職者が人々の罪に心を痛めるのと同じ程度でした。哀れな印刷業者については、今やさらに高く、正義の行われる法廷の前に立つため、旅立ってしまいました。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-013"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As my intention is only to lay before your great assemblies, the general wishes of the nation; and as I have already declared it our principal wish that your first proceeding would be to examine into the pernicious fraud of William Wood; so I must add, as the universal opinion, that all schemes of commutation, composition, and the like expedients, either avowed or implied, will be of the most pernicious consequences to the public; against the dignity of a free kingdom; and prove an encouragement to future adventurers in the same destructive projects. For, it is a maxim, which no man at present disputes, that even a connivance to admit one thousand pounds in these halfpence, will produce, in time, the same ruinous effects, as if we openly consented to admit a million. It were, therefore, infinitely more safe and eligible, to leave things in the doubtful, melancholy state they are at present, (which, however, God forbid) and trust entirely to the general aversion of our people against this coin; using all honest endeavours to preserve, continue, and increase that aversion, than submit to apply those palliatives which weak, perfidious, or abject politicians, are, upon all occasions, and in all diseases, so ready to administer."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[672]"
    "line_start": 7620
    "source_sequence": 787
  "translation_ja": "私の意図は、この国の一般的な願いを皆様の大いなる両院にお伝えすることだけです。議会の最初の手続きとして、ウィリアム・ウッドの有害な詐欺を調べていただきたいということが、私たちの第一の願いであると、すでに申しました。そこでさらに、これは国民の一致した見解として申しますが、交換や妥協その他の弥縫策は、公然と唱えるにせよ、暗に含ませるにせよ、すべて社会全体にもっとも有害な結果を及ぼし、自由な王国の尊厳を傷つけ、今後も同じ破壊的計画を企てる山師たちを励ますことになります。というのも、現在誰も異を唱えない原則ですが、この半ペニー銅貨をわずか千ポンド分でも黙認して受け入れれば、時がたつにつれ、百万ポンド分の受け入れに公然と同意した場合と、同じ破滅的効果が生じるからです。したがって、弱く、背信的で、卑屈な政治家たちが、あらゆる場合に、あらゆる病に、あれほど進んで投与したがるそのような応急薬を使うことに甘んじるくらいなら、物事を今のような不安で憂鬱な状態に置いておき——もっとも、そうならぬよう神に祈りますが——この銅貨を忌み嫌う国民全体の気持ちだけに頼り、その嫌悪を守り、保ち、強めるために、あらゆる誠実な努力を尽くすほうが、比べものにならぬほど安全で、望ましいのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-014"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In the small compass of my reading, (which, however, hath been more extensive than is usual to men of my inferior calling) I have observed that grievances have always preceded supplies; and if ever grievances had a title to such a pre-eminence, it must be this of Wood; because it is not only the greatest grievance that any country could suffer, but a grievance of such a kind that, if it should take effect, would make it impossible for us to give any supplies at all; except in adulterate copper; unless a tax were laid for paying the civil and military lists, and the large pensions, with real commodities instead of money; which, however, might be liable to some few objections as well as difficulties: For although the common soldiers might be content with beef and mutton, and wool, and malt, and leather; yet I am in some doubt as to the generals, the colonels, the numerous pensioners, the civil officers, and others, who all live in England upon Irish pay; as well as those few who reside among us only because they cannot help it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[673]"
    "line_start": 7640
    "source_sequence": 788
  "translation_ja": "私の読書の範囲は狭いものですが——もっとも、私のような低い稼業の者にしては広く読んできたほうです——その中で気づいたのは、租税の承認よりも、つねに苦情の是正が先であったということです。もし苦情にそのような優先権が認められる場合があるとすれば、このウッドの件こそ、まさにそれに当たります。いかなる国も被りうる最大の災厄であるばかりか、実現すれば、不純な銅貨で納める以外、私たちが租税を一切提供できなくなる性質の災厄だからです。あるいは、行政と軍の俸給や多額の年金を、金銭の代わりに現物で支払う税を設けることもできましょうが、それにも多少の異論と困難はありそうです。というのも、兵卒たちは牛肉や羊肉、羊毛、麦芽、革で満足するかもしれませんが、将軍や大佐、多数の年金受給者、文官その他、アイルランドの金でイングランドに暮らす人々が、それでよいかとなると、私はいささか疑わしく思うからです。やむをえないためだけにこの国に住んでいる、少数の方々も同様です。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-015"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is one particular, which although I have mentioned more than once in some of my former papers, yet I cannot forbear to repeat, and a little enlarge upon it; because I do not remember to have read or heard of the like in the history of any age or country; neither do I ever reflect upon it without the utmost astonishment."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[674]"
    "line_start": 7657
    "source_sequence": 789
  "translation_ja": "ある一点については、以前の拙文のいくつかで、一度ならず触れました。それでも、もう一度繰り返し、少し詳しく述べずにはおれません。どの時代、どの国の歴史を読んでも聞いても、このような例は記憶になく、また、それを思うたびに、この上なく驚かずにはいられないからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-016"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "After the unanimous addresses to his Sacred Majesty, against this patent of Wood, from both Houses of Parliament, which are the three estates of the kingdom; and likewise an address from the Privy-council, to whom, under the chief governors, the whole administration is entrusted; the matter is referred to a committee of council in London. Wood, and his adherents, are heard on one side; and a few volunteers, without any trust or direction from hence, on the other. The question (as I remember) chiefly turned upon the want of halfpence in Ireland: Witnesses are called on the behalf of Wood (of what credit I have formerly shewn :) Upon the issue the patent is found good and legal; all His Majesty's officers here, (not excepting the military) commanded to be aiding and assisting to make it effectual. The addresses of both Houses of Parliament, of the Privy-council; and of the city of Dublin: The declarations of most counties and corporations through the kingdom, are altogether laid aside, as of no weight, consequence, or consideration whatsoever: And the whole kingdom of Ireland nonsuited, in default of appearance; as if it were a private cause between John Doe, plaintiff, and William Roe, defendant."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[675]"
    "line_start": 7664
    "source_sequence": 790
  "translation_ja": "王国の三身分をなす議会両院が、ウッドのこの特許状に反対する一致した上申を、神聖なる陛下に奉ったあと、さらに、最高統治者たちの下で行政全体を託されている枢密院も上申を行ったあとで、この問題はロンドンの枢密院委員会へ付託されました。一方ではウッドとその支持者の言い分が聴取され、他方では、こちらから何らの委任も指示も受けていない、少数の志願者の言い分が聴取されます。問題は、記憶によれば、主としてアイルランドに半ペニー銅貨が足りないかどうかをめぐっていました。ウッド側の証人たちが召喚されます。彼らの信用がどれほどのものかは、すでに示しました。審理の結果、特許状は有効かつ合法とされ、軍人をも例外とせず、この国にいる陛下の全官吏に、その施行を援助し、協力するよう命令が下されます。議会両院、枢密院、ダブリン市の上申も、この王国の大部分の州や自治団体の宣言も、何の重みも重要性もなく、一切考慮に値しないものとして、ことごとく脇に追いやられます。そしてアイルランド王国全体が、出廷しなかったために訴えを退けられるのです。まるで原告ジョン・ドウと被告ウィリアム・ロウの間の、私的な訴訟ででもあったかのように。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-017"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "With great respect to those-honourable persons, the committee of council in London, I have not understood them to be our governors, councillors, or judges. Neither did our case turn at all upon the question, whether Ireland wanted halfpence or no. For there is no doubt, but we do want both halfpence, gold, and silver; and we have numberless other wants, and some that we are not so much as allowed to name; although they are peculiar to this nation; to which no other is subject, whom God hath blessed with religion and laws, or any degree of soil and sunshine: But, for what demerits on our side, I am altogether in the dark."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[676]"
    "line_start": 7683
    "source_sequence": 791
  "translation_ja": "ロンドンの枢密院委員会の尊敬すべき方々には十分な敬意を払いますが、私はあの方々が、私たちの統治者や顧問官や裁判官であるとは、承知しておりませんでした。また、私たちの問題は、アイルランドで半ペニー銅貨が不足しているかどうかなどには、まったくかかっていません。たしかに私たちは、半ペニー銅貨も、金も、銀も不足しています。そのほかにも数えきれないほど不足するものがあり、名を挙げることすら許されないものもあります。その中には、この国だけに特有で、神によって宗教と法律、あるいはいささかの土地と日光でも与えられたほかの国々は、いずれも苦しめられていない欠乏もあるのです。とはいえ、私たちの側のどのような罪科のためにそうなったのかは、私にはさっぱりわかりません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-018"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But, I do not remember, that our want of halfpence was either affirmed, or denied in any of our addresses or declarations, against those of Wood: We alleged, the fraudulent obtaining and executing his patent, the baseness of his metal, the prodigious sum to be coined, which might be increased by stealth, from foreign importation and his own counterfeits, as well as those at home; whereby we must infallibly lose all our little gold and silver, and all our poor remainder of a very limited and discouraged trade: We urged, that the patent was passed without the least reference hither; and without mention of any security given by Wood, to receive his own halfpence upon demand; both which are contrary to all former proceedings in the like cases. These, and many other arguments we offered; but still the patent went on, and at this day our ruin would have been half completed; if God, in His mercy, had not raised an universal detestation of these halfpence, in the whole kingdom; with a firm resolution never to receive them; since we are not under obligations to do so by any law, either human or divine."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[677]"
    "line_start": 7694
    "source_sequence": 792
  "translation_ja": "しかし、ウッドの半ペニー銅貨に反対する私たちの上申や宣言で、銅貨の不足を肯定したり否定したりした覚えはありません。私たちが主張したのは、特許状の取得と実施が不正であること、金属の質が劣ること、鋳造される巨額の貨幣が、国内の偽物に加えて、外国からの輸入やウッド自身の偽物によっても、密かに膨れ上がりうることでした。そのために私たちは、わずかばかりの金銀も、ひどく制限され妨げられている商業の、乏しい残りかすも、間違いなくすべて失うのです。また、特許状がこちらへの照会を一切せずに認められたこと、求められれば自分の半ペニー銅貨を引き取るという保証を、ウッドが与えたとの記載がないことも訴えました。この二点はいずれも、同様の場合の過去すべての手続きに反します。こうした議論や、ほかにも数多くの議論を私たちは差し出しました。それでも特許状の実施は進みました。もし神が憐れみによって、王国全体にこの半ペニー銅貨への一致した嫌悪を起こし、決して受け取らないという固い決意を生ませてくださらなかったなら、今ごろは私たちの破滅も半ばまで進んでいたはずです。私たちには、人の法であれ神の法であれ、この銅貨を受け取る義務を負わせる法律など、ないのですから。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-019"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But, in the Name of God, and of all justice and piety; when the King's Majesty was pleased that this patent should pass; is it not to be understood, that he conceived, believed, and intended it as a gracious act, for the good and benefit of his subjects, for the advantage of a great and fruitful kingdom; of the most loyal kingdom upon earth, where no hand or voice was ever lifted up against him; a kingdom where the passage is not of three hours from Britain; and a kingdom where Papists have less power, and less land, than in England? Can it be denied, or doubted, that His Majesty's ministers understood and proposed the same end, the good of this nation, when they advised the passing this patent? Can the person of Wood be otherwise regarded, than as the instrument, the mechanic, the head-workman, to prepare his furnace, his fuel, his metal, and his stamps? If I employ a shoe-boy, is it in view to his advantage, or to my own convenience? I mention the person of William Wood alone, because no other appears, and we are not to reason upon surmises; neither would it avail, if they had a real foundation."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[678]"
    "line_start": 7712
    "source_sequence": 793
  "translation_ja": "しかし、神と、あらゆる正義と信仰心の名において伺います。国王陛下がこの特許状の発給をお認めになったとき、それは臣民の幸福と利益のため、大きく豊かな王国の繁栄のための、慈悲深い行為であると、お考えになり、信じ、意図された、と理解すべきではないでしょうか。そこは地上でもっとも忠誠の厚い王国で、陛下に対して、一度も手が上げられたことも、反抗の声が上がったこともありません。ブリテンから三時間もかからずに渡れる王国であり、カトリック教徒の権力も所有する土地も、イングランドより少ない王国なのです。また、陛下の大臣たちも、特許状の発給を進言したときには、この国の幸福という同じ目的を理解し、目指していたということを、否定したり疑ったりできるでしょうか。ウッドなる人物は、炉や燃料、金属や刻印を用意するための道具、職人、現場の頭と見るほかに、どう見られるというのでしょう。私が靴磨きの少年を雇うのは、少年の利益を考えてのことでしょうか、それとも自分の都合のためでしょうか。私がウィリアム・ウッド一人の名を挙げるのは、ほかには誰も表に出てこないからです。憶測に基づいて論じるわけにはいきませんし、仮に憶測に根拠があったとしても、それで何かの役に立つわけでもありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-020"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Allowing therefore, (for we cannot do less) that this patent, for the coining of halfpence, was wholly intended, by a gracious king, and a wise public-spirited ministry, for the advantage of Ireland; yet when the whole kingdom to a man, for whose good the patent was designed, do, upon maturest consideration, universally join, in openly declaring, protesting, addressing, petitioning, against these halfpence, as the most ruinous project that ever was set on foot, to complete the slavery and destruction of a poor innocent country: Is it, was it, can it, or will it ever be a question, not whether such a kingdom, or William Wood, should be a gainer; but whether such a kingdom should be wholly undone, destroyed, sunk, depopulated, made a scene of misery and desolation, for the sake of William Wood? God, of His infinite mercy, avert this dreadful judgment; and it is our universal wish, that God would put it into your hearts to be His instruments for so good a work."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[679]"
    "line_start": 7730
    "source_sequence": 794
  "translation_ja": "ですから、この半ペニー銅貨鋳造の特許状が、慈悲深い国王と、賢明で公益を重んじる大臣たちによって、もっぱらアイルランドの利益のために意図されたことを認めるとしましょう。それ以下のことは私たちにはできません。しかし、特許状が利益をもたらすはずの王国全体が、一人の例外もなく、もっとも慎重に検討した末、一致団結して、この半ペニー銅貨に反対し、公然と宣言し、抗議し、上申し、請願しているのです。罪のない貧しい国の隷属と破滅を完成させるために、かつて企てられたうちでも、もっとも破壊的な計画だとしてです。そのような場合に、この王国とウィリアム・ウッドのどちらが得をするか、ということならともかく、この王国がウィリアム・ウッドのために、すっかり滅ぼされ、破壊され、沈められ、住民を失い、悲惨と荒廃の地とされてよいかどうかが、問題なのでしょうか。かつて問題だったのでしょうか。問題になりうるのでしょうか。今後いつか問題になるのでしょうか。神がその無限の憐れみによって、この恐ろしい裁きを避けさせてくださいますように。そして皆様を、これほどよい仕事のための神の道具となろうとするお気持ちにしてくださいますように。これが私たち皆の願いです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-021"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For my own part, who am but one man, of obscure condition, I do solemnly declare, in the presence of Almighty God, that I will suffer the most ignominious and torturing death, rather than submit to receive this accursed coin, or any other that shall be liable to the same objections, until they shall be forced upon me, by a law of my own country; and if that shall ever happen, I will transport myself into some foreign land, and eat the bread of poverty among a free people."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[680]"
    "line_start": 7746
    "source_sequence": 795
  "translation_ja": "私自身は、身分も知れぬ一人の人間にすぎませんが、全能の神の御前で厳粛に宣言いたします。この呪わしい貨幣、あるいは同じ異議を免れないほかのいかなる貨幣を受け取ることにも、自分の国の法律によって強制されるまでは、決して服従しません。服従するくらいなら、この上なく不名誉で、苦痛に満ちた死を甘んじて受けます。もしそのような法律ができることがあれば、私は異国へ渡り、自由な民の中で、貧しさのパンを食べるつもりです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-022"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Am I legally punishable for these expressions? Shall another proclamation issue against me, because I presume to take my country's part against William Wood; where her final destruction is intended? But, whenever you shall please to impose silence upon me, I will submit; because, I look upon your unanimous voice to be the voice of the nation; and this I have been taught, and do believe to be, in some manner, the voice of God."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[681]"
    "line_start": 7755
    "source_sequence": 796
  "translation_ja": "私はこの言葉のために、法律に従って罰せられるのでしょうか。ウィリアム・ウッドに対して祖国の側に立つことを、私があえてするからといって、しかも祖国の最終的な破滅が目論まれているときにそうするからといって、またしても私に対する布告が出されるのでしょうか。しかし皆様が、いつであれ私に沈黙をお命じになれば、私は従います。皆様の一致した声は国民の声であり、それはある意味で神の声なのだと、私は教えられ、また信じているからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-023"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The great ignominy of a whole kingdom, lying so long at mercy, under so vile an adversary, is such a deplorable aggravation, that the utmost expressions of shame and rage, are too low to set it forth; and therefore, I shall leave it to receive such a resentment, as is worthy of a parliament."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[682]"
    "line_start": 7763
    "source_sequence": 797
  "translation_ja": "一つの王国全体が、このように卑劣な敵の意のままに、これほど長くさらされている。その大きな屈辱は、この悲惨な事態をいっそう耐えがたくするもので、どれほど激しく恥や怒りを表しても、なお十分に言い尽くせません。ですから、このことについては、議会にふさわしい憤りをもってお扱いいただくことに委ねます。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-024"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is likewise our universal wish, that His Majesty would grant liberty to coin halfpence in this kingdom, for our own use; under such restrictions as a parliament here shall advise: Since the power of coining even gold and silver, is possessed by every petty prince abroad; and was always practised by Scotland, to the very time of the Union; yet surely Scotland, as to soil, climate, and extent, is not, in itself, a fourth part the value of Ireland; (for Bishop Burnet says, it is not above a fortieth part in value, to the rest of Britain) and with respect to the profit that England gains from hence, not the forty thousandth part. Although I must confess, that a mote in the eye, or a thorn in the side, is more dangerous and painful than a beam, or a spike at a distance."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[683]"
    "line_start": 7770
    "source_sequence": 798
  "translation_ja": "また、この国の議会が勧告する制限の下に、私たち自身の用に供する半ペニー銅貨を、この王国で鋳造する自由を、陛下がお許しくださることも、私たち皆の願いです。外国では、どんな小さな君主も金銀さえ鋳造する権利を持ち、スコットランドも合同の時まで、つねにその権利を行使していました。それでも、土地、気候、広さを考えれば、スコットランドそれ自体の価値は、アイルランドの四分の一にも達しないはずです。バーネット主教によれば、ブリテンの残りの部分に比べれば、その価値は四十分の一を超えないそうです。そして、イングランドがそこから得る利益に至っては、こちらから得るものの四万分の一にもなりません。もっとも、目の中の塵や脇腹の棘のほうが、離れた所にある梁や太い釘より、危険で痛いことは認めなくてはなりません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-025"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The histories of England, and of most other countries, abound in relating the miserable, and sometimes the most tragical effects, from the abuses of coin; by debasing the metal, by lessening, or enhancing the value upon occasions, to the public loss; of which we have an example, within our own memory in England, and another very lately in France. It is the tenderest point of government, affecting every individual, in the highest degree. When the value of money is arbitrary, or unsettled; no man can well be said to have any property at all; nor is any wound so suddenly felt, so hardly cured, or that leaves such deep and lasting scars behind it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[684]"
    "line_start": 7783
    "source_sequence": 799
  "translation_ja": "イングランドや、ほとんどの諸国の歴史には、貨幣の悪用がもたらした、悲惨な、ときにはこの上なく悲劇的な結果が数多く記されています。金属の質を落としたり、折に触れて価値を上げ下げしたりして、社会に損失を与えるのです。私たちの記憶にも、イングランドでの例があり、ごく最近にはフランスにも一例があります。これは政治のうちでも、もっとも扱いの難しい点で、一人一人の人間に、最大限の影響を及ぼします。貨幣の価値が恣意的であったり、定まらなかったりするときには、そもそも誰かが何らかの財産を持つなどとは、まず言えません。また、これほどたちまち痛みを感じ、治すことが難しく、深く長く残る傷痕を残す傷は、ほかにありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-026"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I conceive this poor unhappy island, to have a title to some indulgence from England; not only upon the score of Christianity, natural equity, and the general rights of mankind; but chiefly on account of that immense profit they receive from us; without which, that kingdom would make a very different figure in Europe, from what it doth at present."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[685]"
    "line_start": 7794
    "source_sequence": 800
  "translation_ja": "この貧しく不幸な島には、イングランドからいくらかの配慮を受ける資格があると、私は考えます。それは、キリスト教や自然の公平、人類に共通の権利からいってそうであるばかりか、とりわけ、かの国が私たちから受け取る莫大な利益を考えれば、そうなのです。それがなければ、あの王国がヨーロッパで占める地位は、今日とは大きく異なったものになるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-027"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The rents of land in Ireland, since they have been of late so enormously raised, and screwed up, may be computed to about two millions; whereof one-third part, at least, is directly transmitted to those, who are perpetual absentees in England; as I find by a computation made with the assistance of several skilful gentlemen."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[686]"
    "line_start": 7801
    "source_sequence": 801
  "translation_ja": "アイルランドの地代は、近ごろ途方もなくつり上げられ、絞り取られているので、およそ二百万ポンドと見積もれます。そのうち少なくとも三分の一は、つねにイングランドに住む不在地主たちに、そのまま送られています。これは、数人のよく通じた方々に助けていただいた計算からわかったことです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-028"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The other articles by which we are altogether losers, and England a gainer; we found to amount to almost as much more. I will only set down as many heads of them as I can remember; and leave them to the consideration of those, who understand accounts better than I pretend to do."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[687]"
    "line_start": 7808
    "source_sequence": 802
  "translation_ja": "ほかにも、私たちにとっては損失ばかりとなり、イングランドには利益となる項目を調べたところ、それらも合わせれば、ほぼそれに等しい額になることがわかりました。私は思い出せるだけの項目を、ただ列挙するにとどめ、私などより会計のわかる方々のご検討に委ねます。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-029"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The occasional absentees, for business, health, or diversion."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[688]"
    "line_start": 7814
    "source_sequence": 803
  "translation_ja": "仕事、療養、娯楽のため、一時的に国外で暮らす者たち。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-030"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Three-fourths of the revenue of the chief governor, during his absence; which is usually four-fifths of his government."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[689]"
    "line_start": 7817
    "source_sequence": 804
  "translation_ja": "最高統治者の不在中、その収入の四分の三。不在の期間は、通常、在任期間の五分の四です。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-031"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The whole revenue of the post-office."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[690]"
    "line_start": 7821
    "source_sequence": 805
  "translation_ja": "郵便事業の収益の全額。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l07-032"
  "section_id": "letter-07-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The numerous pensions paid to persons in England."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[691]"
    "line_start": 7824
    "source_sequence": 806
  "translation_ja": "イングランドにいる人々に支払われる、数多くの年金。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":

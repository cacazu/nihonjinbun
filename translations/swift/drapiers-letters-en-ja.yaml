  "translation_ja": |-
    印刷人ハーディング氏への書簡
    八月一日付の新聞に掲載された
    ウッド氏の半ペニー銅貨に関する記事を受けて

    M・B・ドレイピア著
    『商店主その他の皆さんへの書簡』の筆者

    ダブリン、モールズワース・コートのJ・ハーディング印刷
  "translation_status": "reviewed"

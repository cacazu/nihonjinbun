  "translation_ja": "記事はこう結んでいます。「N・B」すなわちnota bene、よく注意せよ、という意味ですが、「訴えられている弊害や、この特許の実施において犯された何らかの不正を証明する証言は、アイルランドからも、ほかのいかなる場所からも出なかった。」"

- "id": "dl-l04-note-008-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This was Henry Temple, first Viscount Palmerston, with whom Swift later had an unpleasant correspondence. Palmerston could not have been more than seven years old when he was appointed (September 21st, 1680), with Luke King, chief remembrancer of the Court of Exchequer in Ireland, for their joint lives. King died in 1716, but the grant was renewed to Palmerston and his son Henry for life. He was raised to the peerage as Baron Temple of Mount Temple, and Viscount Palmerston of Palmerston, in March, 1722-1723. Sir Charles Hanbury Williams called him \"Little Broadbottom Palmerston.\" He died in 1757. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[408]"
    "line_start": 4726
    "source_sequence": 471
  "translation_ja": "初代パーマストン子爵ヘンリー・テンプルであり、スウィフトはのちに彼と不愉快な書簡のやり取りをすることになる。パーマストンが、ルーク・キングとともに、両者の生存中を任期として、アイルランド財務裁判所の首席記録官に任命された一六八〇年九月二十一日には、まだ七歳を超えてはいなかったはずである。キングは一七一六年に死んだが、任命はパーマストンとその息子ヘンリーの終身職として更新された。一七二二／二三年三月、彼はマウント・テンプルのテンプル男爵、およびパーマストンのパーマストン子爵として貴族に列せられた。チャールズ・ハンベリー・ウィリアムズ卿は、彼を「小柄な尻広パーマストン」と呼んだ。一七五七年没。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-009-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "George Bubb (1691-1762) was Chief Secretary during Wharton's Lord lieutenancy in 1709. He took the name of Doddington on the death of his uncle in 1720. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[409]"
    "line_start": 4737
    "source_sequence": 472
  "translation_ja": "ジョージ・バブ（一六九一―一七六二）は、一七〇九年、ウォートンの総督在任中、首席秘書官を務めた。一七二〇年に伯父が死去すると、ドディントンの姓を名乗った。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-010-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Thomas Herbert, eighth Earl of Pembroke (1656-1733), had preceded the Earl of Wharton as Lord lieutenant of Ireland. He bears a high character in history and on four successive coronations, namely, those of William and Mary, Anne, George I. and George II., he acted as sword carrier. Although a Tory, even Macaulay acknowledges Pembroke's high breeding and liberality. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[410]"
    "line_start": 4742
    "source_sequence": 473
  "translation_ja": "第八代ペンブルック伯爵トマス・ハーバート（一六五六―一七三三）は、ウォートン伯爵の前任のアイルランド総督であった。歴史上、高い評価を受けており、ウィリアムとメアリー、アン、ジョージ一世、ジョージ二世という、続く四回の戴冠式で、剣を捧持する役を務めた。トーリーでありながら、マコーリーさえ、ペンブルックの気品と寛大さを認めている。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-011-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This is the Edward Southwell to whom Archbishop King wrote the letters quoted from Monck Mason in previous notes. He was the son of Sir Robert Southwell, the diplomatist and friend of Sir William Temple, to whom Swift bore a letter of introduction from the latter, soliciting the office of amanuensis. In June, 1720, Edward Southwell had his salary as secretary increased by £300; and in July of the same year the office was granted to him and his son for life. The Southwell family first came to Ireland in the reign of James I., at the time of the plantation of Munster. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[411]"
    "line_start": 4750
    "source_sequence": 474
  "translation_ja": "前の注でモンク・メイソンから引用した、キング大主教の書簡の宛先、エドワード・サウスウェルである。外交官で、ウィリアム・テンプル卿の友人でもあったロバート・サウスウェル卿の息子である。スウィフトはテンプル卿からの紹介状を携え、書記の職を求めてロバート卿を訪ねた。一七二〇年六月、エドワード・サウスウェルは秘書官としての俸給を三百ポンド増額され、同年七月、その官職は彼とその息子の終身職として与えられた。サウスウェル家が初めてアイルランドに来たのは、ジェームズ一世の治世、マンスター植民の時代であった。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-012-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Richard Boyle, third Earl of Burlington (or Bridlington of Yorks), and fourth Earl of Cork (1695-1753), was appointed Lord High-Treasurer of Ireland in August, 1715. His great-grandfather, the first Earl of Cork, had held the same office in 1631. The Lord-lieutenancy of the West Riding of Yorkshire, and the office of Custos Rotulorum of the North and West Ridings, seem also to have been inheritances of this family. The third Earl had a taste for architecture, and spent enormous sums of money in the reconstruction of Burlington House, a building that was freely satirized by Hogarth and Lord Hervey. His taste, however, seems to have run to the ornamental rather than the useful, and its gratification involved him in such serious financial difficulties, that he was compelled to sell some of his Irish estates. Swift notes that \"My Lord Burlington is now selling in one article £9,000 a year in Ireland for £200,000 which must pay his debts\" (Scott's edit. 1814, vol. xix., p. 129). [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[412]"
    "line_start": 4761
    "source_sequence": 475
  "translation_ja": "第三代バーリントン伯爵（ヨークシャーのブリドリントン伯爵ともいう）および第四代コーク伯爵リチャード・ボイル（一六九五―一七五三）は、一七一五年八月、アイルランド大蔵卿に任命された。その曾祖父、初代コーク伯爵も、一六三一年に同じ官職を務めていた。ヨークシャー西ライディングの統監、および北・西ライディングの治安判事名簿管理官の職も、この家に世襲されていたようである。第三代伯爵は建築を好み、バーリントン・ハウスの建て直しに莫大な金額を費やした。この建物は、ホガースやハーヴィー卿から、遠慮なく風刺された。しかし、その好みは実用よりも装飾に向かっていたようであり、それを満たすために深刻な財政難に陥り、アイルランドの領地の一部を売らざるを得なかった。スウィフトは、「バーリントン卿は今、アイルランドで年九千ポンドになるものを、一口で二十万ポンドで売ろうとしている。それで借金を払わねばならないのだ」と記している（スコット版、一八一四年、第十九巻、一二九頁）。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-013-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This post was found for Addison on his appointment in 1709 as secretary to the Earl of Wharton, Lord-lieutenant of Ireland. Tickell, in his preface to his edition of Addison's works, says the post was granted to Addison as a mark of Queen Anne's special favour. Bermingham's Tower was that part of Dublin Castle in which the records were kept. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[413]"
    "line_start": 4778
    "source_sequence": 476
  "translation_ja": "この官職は、一七〇九年にアディソンがアイルランド総督ウォートン伯爵の秘書官に任命された際、彼のために見つけられたものである。ティッケルは、そのアディソン作品集の序文で、この職はアン女王の特別な寵愛のしるしとしてアディソンに与えられたと述べている。バーミンガム塔は、記録を保管していたダブリン城の一部分であった。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-014-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Mr. Hopkins, secretary to the Duke of Grafton. The exactions made by this gentleman upon the players, in his capacity of Master of the Revels, are the subject of two satirical poems. [S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[414]"
    "line_start": 4786
    "source_sequence": 477
  "translation_ja": "グラフトン公の秘書ホプキンズ氏。この人物が祝典監督官として俳優たちに行った取り立ては、二篇の風刺詩の題材となっている。［S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: S., T.S."
- "id": "dl-l04-note-014-002"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This may have been John Hopkins, the second son of the Bishop of Londonderry, who was the author of \"Amasia,\" dedicated to the Duchess of Grafton. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[415]"
    "line_start": 4791
    "source_sequence": 478
  "translation_ja": "これは、ロンドンデリー主教の次男ジョン・ホプキンズかもしれない。彼はグラフトン公爵夫人に献呈した『アメイジア』の著者であった。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: S., T.S."
- "id": "dl-l04-021"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I confess, I have been sometimes tempted to wish that this project of Wood might succeed, because I reflected with some pleasure what a jolly crew it would bring over among us of lords and squires, and pensioners of both sexes, and officers civil and military, where we should live together as merry and sociable as beggars, only with this one abatement, that we should neither have meat to feed, nor manufactures to clothe us, unless we could be content to prance about in coats of mail, or eat brass as ostriches do iron."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[416]"
    "line_start": 4796
    "source_sequence": 479
  "translation_ja": "白状すると、私はときどき、ウッドのこの計画が成功してほしいと思いたくなったことがあります。というのも、貴族や郷紳、男女の年金受給者、文武の官吏など、何と愉快な一団が海を渡って私たちのところへやってくることだろうと、多少の楽しみをもって考えたからです。そうすれば、私たちは一緒になって、乞食のように陽気で親しみ深く暮らせるでしょう。ただし一つ難点があります。鎖帷子を着て跳ね回ったり、ダチョウが鉄を食べるように真鍮を食べたりして満足できない限り、食べる肉も、着るための製品も、なくなることです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-022"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I return from this digression to that which gave me the occasion of making it: And I believe you are now convinced, that if the Parliament of Ireland were as temptable as any other assembly within a mile of Christendom (which God forbid) yet the managers must of necessity fail for want of tools to work with. But I will yet go one step further, by supposing that a hundred new employments were erected on purpose to gratify compilers; yet still an insuperable difficulty would remain; for it happens, I know not how, that money is neither Whig nor Tory, neither of town nor country party, and it is not improbable, that a gentleman would rather choose to live upon his own estate which brings him gold and silver, than with the addition of an employment, when his rents and salary must both be paid in Wood's brass, at above eighty per cent. discount."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[417]"
    "line_start": 4806
    "source_sequence": 480
  "translation_ja": "この脱線から、そのきっかけとなった話へ戻りましょう。アイルランド議会が、キリスト教世界から一マイル以内のどんな議会にも劣らず誘惑に弱かったとしても――神よ、そうならないように――工作をする連中は、使う道具がないために必ず失敗するということが、もうお分かりいただけたと思います。しかし、私はさらに一歩進んで、従う者たちに報いるためだけに、百の新しい官職が設けられたと仮定してみましょう。それでもなお、克服できない困難が残ります。どういうわけか、金はホイッグでもトーリーでもなく、宮廷派でも地方派でもないからです。ある紳士が、金銀を生む自分の領地だけで暮らすことを、官職を加えても、地代も俸給も八十パーセント以上値下がりするウッドの真鍮で払われなければならない暮らしより、むしろ選ぶというのは、十分あり得ることです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-023"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For these and many other reasons, I am confident you need not be under the least apprehensions from the sudden expectation of the Lord Lieutenant,[15] while we continue in our present hearty disposition; to alter which there is no suitable temptation can possibly be offered: And if, as I have often asserted from the best authority, the law hath not left a power in the crown to force any money except sterling upon the subject, much less can the crown devolve such a power upon another."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[418]"
    "line_start": 4820
    "source_sequence": 481
  "translation_ja": "これらの理由、そしてほかの多くの理由から、総督の急な到来が見込まれることを、[15] 皆様はほんの少しも恐れる必要がないと、私は確信しています。今の私たちの真剣な決意が続く限り、それを変えさせるほどの誘惑は、どうしても差し出しようがないからです。そして、最も確かな権威に基づいて私がたびたび主張したとおり、正貨以外の貨幣を臣民に強制する権限が、法律によって王権に認められていないのなら、王権がそのような権限をほかの者に委ねることは、なおさらできません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-note-015-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Lord Carteret, afterwards Earl Granville. See note to \"A Vindication of Lord Carteret,\" in vol. vii. of present edition of Swift's works. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[419]"
    "line_start": 4829
    "source_sequence": 482
  "translation_ja": "カータレット卿、のちのグランヴィル伯爵。本スウィフト作品集第七巻の「カータレット卿の弁護」の注を参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-024"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This I speak with the utmost respect to the person and dignity of his Excellency the Lord Carteret, whose character hath been given me by a gentleman that hath known him from his first appearance in the world: That gentleman describes him as a young nobleman of great accomplishments, excellent learning, regular in his life, and of much spirit and vivacity. He hath since, as I have heard, been employed abroad, was principal secretary of state, and is now about the 37th year of his age appointed Lord Lieutenant of Ireland. From such a governor this kingdom may reasonably hope for as much prosperity as, under so many discouragements, it can be capable of receiving.[16]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[420]"
    "line_start": 4834
    "source_sequence": 483
  "translation_ja": "私は、カータレット総督閣下の御身と地位に、この上ない敬意をもってこう申し上げています。その人物については、閣下が初めて世に出られたころから知っている、ある紳士から伺いました。その紳士によれば、閣下は多くの才能と優れた学識を備え、生活は規律正しく、気概と活気に富む若い貴族だということでした。その後は、聞くところによると、海外で職務を務め、国務長官となり、今、三十七歳ほどでアイルランド総督に任じられています。このような統治者であれば、これほど多くの不利な条件のもとでも、この王国が受け取り得る限りの繁栄をもたらしてくださると、期待してよいでしょう。[16]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-note-016-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Carteret was an old friend of Swift. On the Earl's appointment to the Lord-lieutenancy, in April, 1724, Swift wrote him a letter on the matter of Wood's halfpence, in which he took the liberty of \"an old humble servant, and one who always loved and esteemed\" him, to make known to him the apprehensions the people were under concerning Mr. Wood's patent. \"Neither is it doubted,\" he wrote, \"that when your excellency shall be thoroughly informed, your justice and compassion for an injured people, will force you to employ your credit for their relief.\" Swift waited for more than a month, and on receiving no reply, sent a second letter, which Sir Henry Craik justly calls, \"a masterpiece of its kind.\" It was as follows:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[421]"
    "line_start": 4846
    "source_sequence": 484
  "translation_ja": "カータレットはスウィフトの古い友人であった。一七二四年四月、伯爵が総督に任命されると、スウィフトはウッドの半ペニー銅貨の問題について書簡を送り、「昔からの謙虚な僕であり、常に敬愛してきた者」の自由を許してほしいとして、ウッド氏の特許状について人々が抱いている不安を知らせた。「また、閣下が十分に事情をお知りになれば、その正義感と、虐げられた国民への同情によって、人々を救済するために御威光をお使いにならずにはいられまいと、誰も疑ってはおりません」と、彼は書いた。スウィフトは一か月以上待ったが、返事がなかったので、二通目を送った。ヘンリー・クレイク卿が、正当に「この種の手紙の傑作」と評したものである。内容は次のとおり。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-note-016-002"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"June 9, 1724."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[422]"
    "line_start": 4859
    "source_sequence": 485
  "translation_ja": "「一七二四年六月九日。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"

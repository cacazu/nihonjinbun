- "id": "dl-l04-032"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And as we are apt to sink too much under unreasonable fears, so we are too soon inclined to be raised by groundless hopes (according to the nature of all consumptive bodies like ours) thus, it hath been given about for several days past, that somebody in England empowered a second somebody to write to a third somebody here to assure us, that we \"should no more be troubled with those halfpence.\" And this is reported to have been done by the same person, who was said to have sworn some months ago, that he would \"ram them down our throats\" (though I doubt they would stick in our stomachs) but whichever of these reports is true or false, it is no concern of ours. For in this point we have nothing to do with English ministers, and I should be sorry it lay in their power to redress this grievance or to enforce it: For the \"Report of the Committee\" hath given me a surfeit. The remedy is wholly in your own hands, and therefore I have digressed a little in order to refresh and continue that spirit so seasonably raised amongst you, and to let you see that by the laws of GOD, of NATURE, of NATIONS, and of your own COUNTRY, you ARE and OUGHT to be as FREE a people as your brethren in England."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[449]"
    "line_start": 5134
    "source_sequence": 514
  "translation_ja": "私たちは、不合理な恐怖によって必要以上に沈みがちなのと同じく、根拠のない希望によって、あまりにも早く浮き立ちがちです。私たちのように衰弱した身体の性質どおりです。そこで、ここ数日の間、イングランドの何者かが、別の何者かに権限を与え、当地の第三の何者かに、「あの半ペニー銅貨で、これ以上悩まされることはない」と私たちを安心させる手紙を書くようにした、という話が流れています。そして、これをしたのは、数か月前、「あれを我々の喉へ無理やり押し込む」と誓ったとされる、その同じ人物だと伝えられています。もっとも、胃の腑には引っかかってしまうと思いますが。しかし、このどちらの噂が本当で、どちらが嘘であろうと、私たちの関知することではありません。この点では、イングランドの大臣たちは、私たちには関係ないからです。そして、この苦痛を取り除くことも、押しつけることも、その人々の権限に属しているとしたら、私は残念に思います。「委員会報告」で、もう腹いっぱいなのです。救済の手段は、すべて皆様自身の手にあります。ですから私は、これほど時宜にかなって皆様の間に起こった気概をよみがえらせ、持続させるために、また、神の法、自然の法、諸国民の法、そして皆様自身の国の法によって、皆様はイングランドの同胞と同じく自由な国民であり、そうあるべきなのだと知っていただくために、少し話を脇へ進めたのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-033"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If the pamphlets published at London by Wood and his journeymen in defence of his cause, were reprinted here, and that our countrymen could be persuaded to read them, they would convince you of his wicked design more than all I shall ever be able to say. In short I make him a perfect saint in comparison of what he appears to be from the writings of those whom he hires to justify his project. But he is so far master of the field (let others guess the reason) that no London printer dare publish any paper written in favour of Ireland, and here nobody hath yet been so bold as to publish anything in favour of him."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[450]"
    "line_start": 5153
    "source_sequence": 515
  "translation_ja": "もし、ウッドとその雇い人たちが、自分たちの立場を弁護するためにロンドンで出した小冊子が当地で再刊され、同国の人々に読む気になってもらえたなら、それは、私がどれほど語るよりも、彼の邪悪な企てを皆様に納得させるでしょう。要するに、計画を正当化するために彼が雇った人々の文章に現れる彼に比べれば、私の描く彼は、まるで聖人です。しかし彼は、戦場をすっかり支配しているので――理由はほかの人の推量に任せます――ロンドンの印刷屋には、アイルランドを支持して書かれた文章を出す勇気がある者は一人もおらず、当地では、彼を支持するものを出版するほど大胆な者が、まだ一人もいません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-034"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There was a few days ago a pamphlet sent me of near 50 pages written in favour of Mr. Wood and his coinage, printed in London; it is not worth answering, because probably it will never be published here: But it gave me an occasion to reflect upon an unhappiness we lie under, that the people of England are utterly ignorant of our case, which however is no wonder, since it is a point they do not in the least concern themselves about, farther than perhaps as a subject of discourse in a coffee-house when they have nothing else to talk of. For I have reason to believe that no minister ever gave himself the trouble of reading any papers written in our defence, because I suppose their opinions are already determined, and are formed wholly upon the reports of Wood and his accomplices; else it would be impossible that any man could have the impudence to write such a pamphlet as I have mentioned."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[451]"
    "line_start": 5164
    "source_sequence": 516
  "translation_ja": "数日前、ウッド氏とその貨幣鋳造を支持して書かれた、ロンドン印刷の、五十頁近い小冊子が送られてきました。おそらく当地では決して出版されないでしょうから、答える価値はありません。しかし、そのために、私たちの抱える一つの不幸について、考えさせられました。イングランドの人々が、私たちの事情をまったく知らないということです。もっとも不思議ではありません。ほかに話題がないとき、コーヒーハウスで話の種にするかもしれないという以上には、彼らが少しも関心を持たない問題だからです。実際、私たちを弁護して書かれた文章を、わざわざ読んだ大臣などいなかったと思うだけの理由があります。おそらく彼らの意見はすでに決まっており、ウッドとその仲間たちの報告だけに基づいて作られているのでしょう。そうでなければ、私の挙げたような小冊子を、どんな人間でも、あれほど厚かましく書けるはずがありません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-035"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Our neighbours whose understandings are just upon a level with ours (which perhaps are none of the brightest) have a strong contempt for most nations, but especially for Ireland: They look upon us as a sort of savage Irish, whom our ancestors conquered several hundred years ago, and if I should describe the Britons to you as they were in Caesar's time, when they painted their bodies, or clothed themselves with the skins of beasts, I would act full as reasonably as they do: However they are so far to be excused in relation to the present subject, that, hearing only one side of the cause, and having neither opportunity nor curiosity to examine the other, they believe a lie merely for their ease, and conclude, because Mr. Wood pretends to have power, he hath also reason on his side."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[452]"
    "line_start": 5179
    "source_sequence": 517
  "translation_ja": "私たちの隣人たちは、理解力では私たちとちょうど同程度なのに――私たちも、特に頭のよいほうではないかもしれませんが――たいていの国民を、ことにアイルランドを、ひどく軽蔑しています。私たちを、何百年も前に私たちの祖先が征服した、野蛮なアイルランド人の一種と見なしているのです。私が皆様に、カエサルの時代、身体に色を塗り、獣の皮を着ていたころのブリトン人の姿を描いても、彼らのしていることと、理屈の通り方はまったく同じでしょう。しかし、今の問題に関しては、彼らにもそれだけの弁解の余地があります。片側の言い分しか聞かず、反対側を調べる機会も好奇心もないため、面倒を避けるためだけに嘘を信じ、ウッド氏が権限を持つと称しているのだから、道理も彼の側にあるのだと、結論してしまうのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-036"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Therefore to let you see how this case is represented in England by Wood and his adherents, I have thought it proper to extract out of that pamphlet a few of those notorious falsehoods in point of fact and reasoning contained therein; the knowledge whereof will confirm my countrymen in their own right sentiments, when they will see by comparing both, how much their enemies are in the wrong."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[453]"
    "line_start": 5192
    "source_sequence": 518
  "translation_ja": "そこで、ウッドとその支持者たちが、この問題をイングランドでどう説明しているかをお見せするため、前記の小冊子に含まれる、事実と論理に関する甚だしい虚偽のうち、いくつかを抜き出すのがよいと考えました。両方を比較して、自分たちの敵がどれほど間違っているかが分かれば、その知識は、わが同国人の正しい考えを、いっそう固めるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-037"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "First, The writer, positively asserts, \"That Wood's halfpence were current among us for several months with the universal approbation of all people, without one single gainsayer, and we all to a man thought ourselves happy in having them.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[454]"
    "line_start": 5200
    "source_sequence": 519
  "translation_ja": "第一に、その書き手は、断言しています。「ウッドの半ペニー銅貨は、数か月の間、たった一人の反対者もなく、すべての人の全面的な賛同をもって我々の間に通用し、我々は皆、一人残らず、それを持つことを幸せだと考えていた」。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-038"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Secondly, He affirms, \"That we were drawn into a dislike of them only by some cunning evil-designing men among us, who opposed this patent of Wood to get another for themselves.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[455]"
    "line_start": 5206
    "source_sequence": 520
  "translation_ja": "第二に、こう主張しています。「我々がそれを嫌うよう仕向けられたのは、我々の中の、ずる賢く邪悪な企みを抱く数人の者が、自分たちで別の特許状を得るために、ウッドの特許状に反対したからにすぎない」。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-039"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thirdly, That \"those who most declared at first against Wood's patent were the very men who intended to get another for their own advantage.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[456]"
    "line_start": 5211
    "source_sequence": 521
  "translation_ja": "第三に、「初めにウッドの特許状に最も強く反対した者たちこそ、自分たちの利益のために、別の特許状を得ようとした当人たちだった」。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-040"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Fourthly, That \"our Parliament and Privy-council, the Lord Mayor and aldermen of Dublin, the grand juries and merchants, and in short the whole kingdom, nay the very dogs\" (as he expresseth it) \"were fond of those halfpence, till they were inflamed by those few designing persons aforesaid.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[457]"
    "line_start": 5215
    "source_sequence": 522
  "translation_ja": "第四に、「我々の議会と枢密院、ダブリンの市長と市参事会員、大陪審と商人、要するに王国全体、いや、犬に至るまで」――その人の表現です――「前記の少数の陰謀家にあおり立てられるまでは、あの半ペニー銅貨を好んでいた」。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-041"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Fifthly, He says directly, That \"all those who opposed the halfpence were Papists and enemies to King George.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[458]"
    "line_start": 5222
    "source_sequence": 523
  "translation_ja": "第五に、はっきりとこう言っています。「半ペニー銅貨に反対した者は、すべて教皇派であり、ジョージ王の敵だった」。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-042"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thus far I am confident the most ignorant among you can safely swear from your own knowledge that the author is a most notorious liar in every article; the direct contrary being so manifest to the whole kingdom, that if occasion required, we might get it confirmed under five hundred thousand hands."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[459]"
    "line_start": 5226
    "source_sequence": 524
  "translation_ja": "ここまでの各項目については、皆様のうち最も無学な方でも、自分自身の知識に基づき、この著者がまったく甚だしい嘘つきだと、安心して誓えるはずです。正反対のことが王国全体にあまりにも明白なので、必要とあれば、五十万人の署名をもって確認してもらうこともできるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-043"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sixthly, He would persuade us, that \"if we sell five shillings worth of our goods or manufactures for two shillings and fourpence worth of copper, although the copper were melted down, and that we could get five shillings in gold or silver for the said goods, yet to take the said two shillings and fourpence in copper would be greatly for our advantage.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[460]"
    "line_start": 5233
    "source_sequence": 525
  "translation_ja": "第六に、彼は私たちをこう信じ込ませようとします。「たとえ我々が、五シリング分の品物または製品を、銅を溶かしてしまってもなお二シリング四ペンスの価値しかない量の銅と引き換えに売り、しかも同じ品物に対して金貨か銀貨で五シリングを得られるとしても、それでも、その二シリング四ペンス分の銅を受け取るほうが、我々には大いに有利である」。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-044"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And Lastly, He makes us a very fair offer, as empowered by Wood, that \"if we will take off two hundred thousand pounds in his halfpence for our goods, and likewise pay him three per cent. interest for thirty years, for an hundred and twenty thousand pounds (at which he computes the coinage above the intrinsic value of the copper) for the loan of his coin, he, will after that time give us good money for what halfpence will be then left.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[461]"
    "line_start": 5240
    "source_sequence": 526
  "translation_ja": "そして最後に、彼はウッドから権限を与えられたとして、私たちにまことに立派な提案をしています。「もし我々が、自分たちの品物と引き換えに、彼の半ペニー銅貨二十万ポンド分を引き取り、さらに、その貨幣を貸してもらう対価として、十二万ポンドについて三十年間、年三パーセントの利子を払うなら――彼は鋳造された貨幣の額と銅の素材価値との差を、十二万ポンドと計算している――彼は、その期間が過ぎたあと、そのとき残っている半ペニー銅貨を、良貨に換えてくれる」というのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-045"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let me place this offer in as clear a light as I can to shew the unsupportable villainy and impudence of that incorrigible wretch. First (says he) \"I will send two hundred thousand pounds of my coin into your country, the copper I compute to be in real value eighty thousand pounds, and I charge you with an hundred and twenty thousand pounds for the coinage; so that you see I lend you an hundred and twenty thousand pounds for thirty years, for which you shall pay me three per cent. That is to say three thousand six hundred pounds per ann. which in thirty years will amount to an hundred and eight thousand pounds. And when these thirty years are expired, return me my copper and I will give you good money for it.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[462]"
    "line_start": 5249
    "source_sequence": 527
  "translation_ja": "この救いようのない悪党の、耐え難い不正と厚顔無恥を示すため、その申し出を、できるだけはっきりした形にしましょう。まず、彼はこう言うのです。「私は、あなた方の国に、自分の貨幣を二十万ポンド送ります。銅の実際の価値は八万ポンドと見積もり、鋳造代としてあなた方に十二万ポンド請求します。つまり、ご覧のとおり、私はあなた方に十二万ポンドを三十年間貸すのですから、あなた方は私に三パーセント、すなわち年三千六百ポンドを支払わねばなりません。三十年間では十万八千ポンドになります。そして、その三十年が過ぎたら、私の銅を返してください。そうすれば、良貨を差し上げましょう」。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-046"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This is the proposal made to us by Wood in that pamphlet written by one of his commissioners; and the author is supposed to be the same infamous Coleby one of his under-swearers at the committee of council, who was tried for robbing the treasury here, where he was an under-clerk.[23]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[463]"
    "line_start": 5262
    "source_sequence": 528
  "translation_ja": "これが、ウッドの代理人の一人によって書かれた前記小冊子で、彼が私たちにしている提案です。著者は、あの悪名高いコールビー、すなわち枢密院委員会で彼のために証言した下っ端の一人で、下級書記を務めていた当地の国庫から金を盗んだとして、裁判にかけられた当人だと考えられています。[23]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-note-023-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "See note on p. 61. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[464]"
    "line_start": 5268
    "source_sequence": 529
  "translation_ja": "六一頁の注を参照。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-047"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "By this proposal he will first receive two hundred thousand pounds, in goods or sterling for as much copper as he values at eighty thousand pounds, but in reality not worth thirty thousand pounds. Secondly, He will receive for interest an hundred and eight thousand pounds. And when our children came thirty years hence to return his halfpence upon his executors (for before that time he will be probably gone to his own place) those executors will very reasonably reject them as raps and counterfeits, which probably they will be, and millions of them of his own coinage."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[465]"
    "line_start": 5271
    "source_sequence": 530
  "translation_ja": "この提案によれば、彼は第一に、自分では八万ポンドと評価しているものの、実際には三万ポンドの価値もない銅と引き換えに、品物か正貨で二十万ポンドを受け取ります。第二に、利子として十万八千ポンドを受け取ります。そして、三十年後、私たちの子供たちが、彼の半ペニー銅貨をその遺言執行人のところへ返しに来ると――そのころにはおそらく、彼は行くべき場所へ行っているでしょうから――その執行人たちは、それをラップ貨や偽造貨幣として、まことに理にかなった仕方で拒むでしょう。おそらく実際そうなっており、しかも何百万枚もが、彼自身の鋳造したものなのでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-048"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Methinks I am fond of such a dealer as this who mends every day upon our hands, like a Dutch reckoning, where if you dispute the unreasonableness and exorbitance of the bill, the landlord shall bring it up every time with new additions."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[466]"
    "line_start": 5281
    "source_sequence": 531
  "translation_ja": "こんな商売人は、どうも好きになってしまいそうです。こちらが相手をしている間に、日に日に調子づくのですから。まるでオランダ式の勘定書です。請求が不当で法外だと文句を言えば、宿の主人がそのたびに新しい項目を加えて、また持ってくるのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-049"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Although these and the like pamphlets published by Wood in London be altogether unknown here, where nobody could read them without as much indignation as contempt would allow, yet I thought it proper to give you a specimen how the man employs his time, where he rides alone without one creature to contradict him, while our FEW FRIENDS there wonder at our silence, and the English in general, if they think of this matter at all, impute our refusal to wilfulness or disaffection, just as Wood and his hirelings are pleased to represent."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[467]"
    "line_start": 5287
    "source_sequence": 532
  "translation_ja": "ウッドがロンドンで出しているこれらやその類の小冊子は、当地ではまったく知られていません。ここで読めば、誰もが、軽蔑のあまり怒る余地がある限り、憤慨せずにはいられないでしょう。それでも私は、この男が、反論する者が一人もいない場所で、独り我が物顔に振る舞いながら、どのように時間を使っているか、一例をお示しするのが適切だと考えました。その間、かの地にいる私たちのわずかな友人たちは、私たちの沈黙を不思議に思い、イングランドの一般の人々は、そもそもこの件を考えることがあるとしても、ウッドとその雇い人たちが好んで描くとおりに、私たちの拒絶を頑迷さか不忠のせいにしているのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-050"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But although our arguments are not suffered to be printed in England, yet the consequence will be of little moment. Let Wood endeavour to persuade the people there that we ought to receive his coin, and let me convince our people here that they ought to reject it under pain of our utter undoing. And then let him do his best and his worst."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[468]"
    "line_start": 5297
    "source_sequence": 533
  "translation_ja": "しかし、私たちの議論がイングランドで印刷することを許されなくても、さして大きな影響はないでしょう。私たちは彼の貨幣を受け取るべきだと、ウッドにはかの地の人々を説得させておきましょう。私は当地の人々に、私たちの完全な破滅を避けるため、それを拒まなければならないと納得してもらいましょう。そのうえで、彼には、できる限りのことも、できる限りの悪事も、やらせておけばよいのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-051"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Before I conclude, I must beg leave in all humility to tell Mr. Wood, that he is guilty of great indiscretion, by causing so honourable a name as that of Mr. Walpole to be mentioned so often, and in such a manner, upon his occasion: A short paper printed at Bristol and reprinted here reports Mr. Wood to say, that he \"wonders at the impudence and insolence of the Irish in refusing his coin, and what he will do when Mr. Walpole comes to town.\" Where, by the way, he is mistaken, for it is the true English people of Ireland who refuse it, although we take it for granted that the Irish will do so too whenever they are asked. He orders it to be printed in another paper, that \"Mr. Walpole will cram this brass down our throats:\" Sometimes it is given out that we must \"either take these halfpence or eat our brogues,\" And, in another newsletter but of yesterday, we read that the same great man \"hath sworn to make us swallow his coin in fire-balls.\""
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[469]"
    "line_start": 5304
    "source_sequence": 534
  "translation_ja": "結びに入る前に、謹んでウッド氏に申し上げなければなりません。自分の件に絡めて、ウォルポール氏ほど名誉あるお名前を、あれほどたびたび、あのような仕方で口にさせるのは、甚だしく軽率なことです。ブリストルで印刷され、当地で再刊された短い文書には、ウッド氏が、「自分の貨幣を拒むアイルランド人の厚顔と横柄には驚く、ウォルポール氏が都へ来たらどうしてやろうか」と述べたとあります。ちなみに、この点でも彼は間違っています。それを拒むのは、アイルランドの、真にイングランド系である人々だからです。もっとも、アイルランド人も、尋ねられれば同じようにするだろうことは、当然と思っています。彼は別の文書に、「ウォルポール氏が、この真鍮を我々の喉に押し込むだろう」と印刷させています。ときには、「この半ペニー銅貨を受け取るか、自分たちの粗皮靴を食べるか、どちらかだ」とも言いふらされます。そして、つい昨日の別のニュースレターには、その同じ偉い方が、「この貨幣を火の玉にして、我々に呑み込ませてやると誓った」と書かれています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-052"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This brings to my mind the known story of a Scotchman, who receiving sentence of death, with all the circumstances of hanging, beheading, quartering, embowelling and the like, cried out, \"What need all this COOKERY?\" And I think we have reason to ask the same question; for if we believe Wood, here is a dinner getting ready for us, and you see the bill of fare, and I am sorry the drink was forgot, which might easily be supplied with melted lead and flaming pitch."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[470]"
    "line_start": 5320
    "source_sequence": 535
  "translation_ja": "これで、有名なスコットランド人の話を思い出しました。絞首、斬首、四つ裂き、内臓の摘出その他、あらゆる付け足しを伴う死刑を宣告されると、その人は、「こんなに手の込んだ料理にする必要があるのか」と叫んだのです。私たちにも、同じことを尋ねる理由があると思います。ウッドを信じるなら、今、私たちのための晩餐が準備されていて、その献立はご覧のとおりです。飲み物が忘れられているのが残念です。溶かした鉛と、燃え上がる瀝青で、簡単に補えるでしょうに。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-053"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "What vile words are these to put into the mouth of a great councillor, in high trust with His Majesty, and looked upon as a prime-minister. If Mr. Wood hath no better a manner of representing his patrons, when I come to be a great man, he shall never be suffered to attend at my levee. This is not the style of a great minister, it savours too much of the kettle and the furnace, and came entirely out of Mr. Wood's forge."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[471]"
    "line_start": 5329
    "source_sequence": 536
  "translation_ja": "陛下の厚い信任を受け、首相と見なされる偉大な顧問官の口に、何と卑劣な言葉を入れるのでしょう。ウッド氏が自分の後援者を描くのに、これよりましなやり方を知らないなら、私が偉い人間になった暁には、朝の拝謁に来ることを、決して許しません。これは大臣の言葉遣いではありません。釜と炉の匂いが強すぎます。すべてウッド氏の鍛冶場から出てきたものなのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-054"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As for the threat of making us eat our brogues, we need not be in pain; for if his coin should pass, that unpolite covering for the feet, would no longer be a national reproach; because then we should have neither shoe nor brogue left in the kingdom. But here the falsehood of Mr. Wood is fairly detected; for I am confident Mr. Walpole never heard of a brogue in his whole life.[24]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[472]"
    "line_start": 5337
    "source_sequence": 537
  "translation_ja": "粗皮靴を食べさせてやるという脅しについては、心配する必要はありません。彼の貨幣が通用すれば、あの不作法な足の覆いは、もはや国民の恥ではなくなるからです。そのときには、この王国に、靴も粗皮靴も、一足として残らなくなるでしょう。しかし、ここでウッド氏の嘘は、はっきり見破られます。ウォルポール氏は、その生涯に、粗皮靴など聞いたこともないと、私は確信しているからです。[24]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-note-024-001"
  "section_id": "letter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "A biting sneer at Walpole's ignorance of Irish affairs. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[473]"
    "line_start": 5345
    "source_sequence": 538
  "translation_ja": "ウォルポールがアイルランドの事情に無知であることへの、痛烈な皮肉。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l04-055"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As to \"swallowing these halfpence in fire-balls,\" it is a story equally improbable. For to execute this operation the whole stock of Mr. Wood's coin and metal must be melted down and moulded into hollow balls with wild-fire, no bigger than a reasonable throat can be able to swallow. Now the metal he hath prepared, and already coined will amount at least fifty millions of halfpence to be swallowed by a million and a half of people; so that allowing two halfpence to each ball, there will be about seventeen balls of wild-fire a-piece to be swallowed by every person in this kingdom, and to administer this dose, there cannot be conveniently fewer than fifty thousand operators, allowing one operator to every thirty, which, considering the squeamishness of some stomachs and the peevishness of young children, is but reasonable. Now, under correction of better judgments, I think the trouble and charge of such an experiment would exceed the profit, and therefore I take this report to be spurious, or at least only a new scheme of Mr. Wood himself, which to make it pass the better in Ireland he would father upon a minister of state."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[474]"
    "line_start": 5349
    "source_sequence": 539
  "translation_ja": "「この半ペニー銅貨を火の玉にして呑み込ませる」というのも、同じくらいありそうにない話です。この作業を実行するには、ウッド氏の貨幣と金属の在庫をすべて溶かし、普通の喉が呑み込める大きさを超えない、中に燃焼剤を詰めた空洞の球に鋳直さなければなりません。さて、彼が準備し、またすでに鋳造した金属は、少なくとも半ペニー銅貨五千万枚分になり、それを百五十万人が呑み込むことになります。球一つを半ペニー銅貨二枚分とすれば、この王国の一人一人が、十七個ほどの火の玉を呑まなければなりません。そして、この薬を投与するには、三十人につき一人を割り当てて、少なくとも五万人の施術者が必要でしょう。胃の敏感な人がいることや、小さな子供がむずかることを考えれば、それももっともな人数です。さて、より優れた判断による御訂正には従いますが、このような実験の手間と費用は、利益を上回ると思います。したがって私は、この噂を偽物と考えます。あるいは、せいぜいウッド氏自身の新たな計画にすぎず、アイルランドで通りをよくするために、国務大臣にその親の役を押しつけようとしているのでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l04-056"
  "section_id": "letter-04-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But I will now demonstrate beyond all contradiction that Mr. Walpole is against this project of Mr. Wood, and is an entire friend to Ireland, only by this one invincible argument, that he has the universal opinion of being a wise man, an able minister, and in all his proceedings pursuing the true interest of the King his master: And that as his integrity is above all corruption, so is his fortune above all temptation. I reckon therefore we are perfectly safe from that corner, and shall never be under the necessity of contending with so formidable a power, but be left to possess our brogues and potatoes in peace as remote from thunder as we are from Jupiter."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[475]"
    "line_start": 5367
    "source_sequence": 540
  "translation_ja": "しかし私は今、たった一つの反駁しようのない議論によって、ウォルポール氏がウッド氏のこの計画に反対であり、まったくのアイルランドの友人であることを、疑いの余地なく証明しましょう。すなわち、彼は賢明な人物、有能な大臣であり、そのすべての行動において、主君である国王の真の利益を追求していると、世間一般から認められているということです。そして、その廉直さがあらゆる買収を超えているのと同じく、その財産もあらゆる誘惑を超えています。ですから、あちらの方面については、私たちはまったく安全だと考えます。それほど恐るべき権力と争う必要に迫られることは決してなく、ユピテルから遠いのと同じく雷鳴からも遠く離れて、粗皮靴とジャガイモを平穏に持つに任されるでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

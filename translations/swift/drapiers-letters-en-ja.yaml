- "id": "dl-l01-025"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "By this statute, no person is to be reckoned a contemner of the King's majesty, and for that crime to be committed to prison; but he who refuses to accept the King's coin made of lawful metal, by which, as I observed before, silver and gold only are intended."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[138]"
    "line_start": 1547
    "source_sequence": 169
  "translation_ja": "この法律によれば、国王陛下を侮る者とされ、その罪で牢に入れられるのは、適法な金属で作られた王の貨幣を受け取るのを拒む者だけです。そして、先にも述べたとおり、ここでいう金属とは銀と金だけなのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-026"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "That this is the true construction of the act, appears not only from the plain meaning of the words, but from my Lord Coke's observation upon it. \"By this act\" (says he) \"it appears, that no subject can be forced to take in buying or selling or other payments, any money made but of lawful metal; that is, of silver or gold.\"[28]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[139]"
    "line_start": 1553
    "source_sequence": 170
  "translation_ja": "これがこの法律の正しい解釈であることは、文言の明らかな意味からだけでなく、それについてのクック卿の所見からも分かります。卿はこう述べています。「この法律から、売買その他の支払いにおいて、適法な金属、すなわち銀または金以外で作った貨幣を受け取るよう強制される臣民はいないことが明らかである。」[28]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-028-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "2 Inst. 577. [ORIG. ED.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[140]"
    "line_start": 1560
    "source_sequence": 171
  "translation_ja": "『法学提要』第二部五七七頁。［原刊］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_original_edition_note"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "原刊注の表示[ORIG. ED.]。個人の著者署名なし。"
- "id": "dl-l01-027"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The law of England gives the King all mines of gold and silver, but not the mines of other metals, the reason of which prerogative or power, as it is given by my Lord Coke[29] is, because money can be made of gold and silver, but not of other metals."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[141]"
    "line_start": 1563
    "source_sequence": 172
  "translation_ja": "イングランド法は、金と銀の鉱山はすべて王のものとしていますが、ほかの金属の鉱山はそうしていません。クック卿によれば、[29] この大権ないし権力の理由は、金銀からは貨幣を作れても、ほかの金属からは作れないからです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-029-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "2 Inst. 577. [ORIG. ED.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[142]"
    "line_start": 1569
    "source_sequence": 173
  "translation_ja": "『法学提要』第二部五七七頁。［原刊］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_original_edition_note"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "原刊注の表示[ORIG. ED.]。個人の著者署名なし。"
- "id": "dl-l01-028"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Pursuant to this opinion halfpence and farthings were anciently made of silver, which is most evident from the act of Parliament of Henry the 4th. chap. 4.[30] by which it is enacted as follows: \"Item, for the great scarcity that is at present within the realm of England of halfpence and farthings of silver, it is ordained and established that the third part of all the money of silver plate which shall be brought to the bullion, shall be made in halfpence and farthings.\" This shews that by the word \"halfpenny\" and \"farthing\" of lawful money in that statute concerning the passing of pence, are meant a small coin in halfpence and farthings of silver."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[143]"
    "line_start": 1572
    "source_sequence": 174
  "translation_ja": "この考え方に従い、昔は半ペニー貨とファージング貨も銀で作られていました。これはヘンリー四世の議会制定法、第四章からも明白です。[30] そこには、次のように定められています。「また、イングランド王国内では現在、銀の半ペニー貨とファージング貨が甚だしく不足しているため、造幣用に持ち込まれる銀器から作るすべての貨幣のうち、三分の一は半ペニー貨とファージング貨とすべし、と命じ、定める。」このことからも、先のペンス貨の通用に関する法で、「適法な貨幣」である「半ペニー貨」や「ファージング貨」と言っているのは、銀でできた半ペニー、ファージングの小額貨幣のことだと分かります。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-030-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Swift makes an incorrect reference here. The act was 4 Henry IV., cap. 10. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[144]"
    "line_start": 1584
    "source_sequence": 175
  "translation_ja": "ここでのスウィフトの法令引用は誤っている。該当する法はヘンリー四世治世第四年、第一〇章である。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-029"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This is further manifest from the statute of the ninth year of Edward the 3d. chap. 3. which enacts, \"That no sterling halfpenny or farthing be molten for to make vessel, nor any other thing by the goldsmiths, nor others, upon forfeiture of the money so molten\" (or melted)."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[145]"
    "line_start": 1588
    "source_sequence": 176
  "translation_ja": "エドワード三世治世第九年、第三章の法からも、この点はさらに明らかです。そこには、「金細工師その他の者は、スターリング銀の半ペニー貨またはファージング貨を溶かして、器物その他いかなる物も作ってはならない。違反すれば、溶かした貨幣を没収する」と定められています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-030"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "By another act in this King's reign[31] black money was not to be current in England, and by an act made in the eleventh year of his reign chap. 5. galley halfpence were not to pass, what kind of coin these were I do not know, but I presume they were made of base metal, and that these acts were no new laws, but farther declarations of the old laws relating to the coin."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[146]"
    "line_start": 1594
    "source_sequence": 177
  "translation_ja": "この王の治世の別の法律では、[31] 黒い貨幣をイングランドで通用させてはならないとされ、治世第十一年、第五章の法では、ガレー半ペニー貨を通用させてはならないとされました。これらがどんな貨幣だったか、私は知りません。しかし卑しい金属でできていたのでしょうし、これらの法も新しい法律ではなく、貨幣に関する古い法律を改めて明らかにしたものだったのでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-031-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The act against black money was passed in Henry IV.'s reign not Edward III.'s. The \"galley halfpence\" were dealt with by 9 Hen. IV., cap. 4. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[147]"
    "line_start": 1602
    "source_sequence": 178
  "translation_ja": "黒い貨幣を禁じる法が制定されたのは、エドワード三世ではなくヘンリー四世の治世である。「ガレー半ペニー貨」を扱うのは、ヘンリー四世治世第九年、第四章である。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-031"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thus the law stands in relation to coin, nor is there any example to the contrary, except one in Davis's Reports,[32] who tells us that in the time of Tyrone's rebellion Queen Elizabeth ordered money of mixed metal to be coined in the Tower of London, and sent over hither for payment of the army, obliging all people to receive it and commanding that all silver money should be taken only as bullion, that is, for as much as it weighed. Davis tells us several particulars in this matter too long here to trouble you with, and that the privy-council of this kingdom obliged a merchant in England to receive this mixed money for goods transmitted hither.[33]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[148]"
    "line_start": 1607
    "source_sequence": 179
  "translation_ja": "貨幣に関する法律は、以上のようになっています。これに反する実例もありません。ただし、デイヴィスの『判例集』[32]に一件あるだけです。それによると、ティローンの反乱のころ、エリザベス女王は、ロンドン塔で混合金属の貨幣を鋳造し、軍への支払いのためにこちらへ送るよう命じました。そして、すべての者にそれを受け取る義務を課し、銀貨はすべて地金として、つまり重さに見合うだけの値で受け取るよう命じたのです。デイヴィスは、この件についていろいろ詳しく述べていますが、ここで皆さんを煩わせるには長すぎます。また、この王国の枢密院が、こちらへ送った品物への支払いとして、この混合貨幣を受け取るようイングランドの商人に強いたとも記しています。[33]"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-032-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "This refers to Sir John Davies's \"Abridgement of Sir Edward Coke's Reports,\" first published in 1651. Davies was Attorney-General for Ireland and a poet. His works have been collected and edited by Dr. A.B. Grosart in the Fuller Worthies Library. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[149]"
    "line_start": 1618
    "source_sequence": 180
  "translation_ja": "サー・ジョン・デイヴィスの『サー・エドワード・クック判例集摘要』を指す。初刊は一六五一年。デイヴィスはアイルランドの司法長官であり、詩人でもあった。その著作はA・B・グローサート博士が収集、編集し、「フラー・ワージーズ・ライブラリー」に収録した。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-note-033-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "Charles I., during the Civil War, paid his forces with debased coin struck by him. [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[150]"
    "line_start": 1624
    "source_sequence": 181
  "translation_ja": "チャールズ一世は内戦中、自分の鋳造した悪質な貨幣で軍への支払いを行った。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-032"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But this proceeding is rejected by all the best lawyers as contrary to law, the Privy-council here having no such power. And besides it is to be considered, that the Queen was then under great difficulties by a rebellion in this kingdom assisted from Spain, and whatever is done in great exigences and dangerous times should never be an example to proceed by in seasons of peace and quietness."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[151]"
    "line_start": 1628
    "source_sequence": 182
  "translation_ja": "しかし、この処置は違法であるとして、最も優れた法律家たちはみな退けています。こちらの枢密院には、そのような権力はないのです。それに加えて考えるべきなのは、当時女王が、この王国でスペインの援助を受けた反乱により、甚だしい困難に陥っていたということです。切迫した危険な時代に行われたことを、平和で穏やかな時代の先例にしてはなりません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-033"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I will now, my dear friends to save you the trouble, set before you in short, what the law obliges you to do, and what it does not oblige you to."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[152]"
    "line_start": 1636
    "source_sequence": 183
  "translation_ja": "さて、親愛なる皆さん、手間をおかけしないよう、法律が皆さんに何を義務づけ、何を義務づけていないのかを、簡単にお示ししましょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-034"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "First, You are obliged to take all money in payments which is coined by the King and is of the English standard or weight, provided it be of gold or silver."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[153]"
    "line_start": 1640
    "source_sequence": 184
  "translation_ja": "第一に、王が鋳造し、イングランドの品位または重量の基準にかなう貨幣は、金貨か銀貨である限り、すべて支払いとして受け取る義務があります。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-035"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Secondly, You are not obliged to take any money which is not of gold or silver, no not the halfpence, or farthings of England, or of any other country, and it is only for convenience, or ease, that you are content to take them, because the custom of coining silver halfpence and farthings hath long been left off, I will suppose on account of their being subject to be lost."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[154]"
    "line_start": 1645
    "source_sequence": 185
  "translation_ja": "第二に、金でも銀でもない貨幣は、受け取る義務がありません。イングランドの半ペニー貨やファージング貨も、ほかのどこの国のものも、例外ではありません。皆さんがそれらを受け取っているのは、ただ便利で手間が省けるからです。銀の半ペニー貨やファージング貨を鋳造する習慣は、ずっと前に廃れていますから。なくしやすいせいだったのだろう、と私は思います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-036"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thirdly, Much less are you obliged to take those vile halfpence of that same Wood, by which you must lose almost eleven-pence in every shilling."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[155]"
    "line_start": 1653
    "source_sequence": 186
  "translation_ja": "第三に、例のウッドの粗悪な半ペニー銅貨を受け取る義務など、なおさらありません。これでは一シリングにつき、ほとんど十一ペンスも損をするのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-037"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Therefore my friends, stand to it one and all, refuse this filthy trash. It is no treason to rebel against Mr. Wood. His Majesty in his patent obliges nobody to take these halfpence,[34] our gracious prince hath no so ill advisers about him; or if he had, yet you see the laws have not left it in the King's power, to force us to take any coin but what is lawful, of right standard gold and silver, therefore you have nothing to fear."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[156]"
    "line_start": 1657
    "source_sequence": 187
  "translation_ja": "ですから皆さん、一人残らず踏みとどまり、この汚いがらくたを拒んでください。ウッド氏に反抗しても反逆罪にはなりません。陛下は特許状の中で、この半ペニー銅貨を受け取る義務を、誰にも負わせていません。[34] 慈悲深いわが君主の周りには、そんな悪い助言者はいないのです。仮にいたところで、お分かりのように、法律は、正しい品位の金銀による適法な貨幣以外のものを私たちに強制する権力を、王には認めていません。ですから恐れることは何もないのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-034-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "The words of the patent are \"to pass and to be received as current money; by such as shall or will, voluntarily and wittingly, and not otherwise, receive the same\" (the halfpence and farthings). [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[157]"
    "line_start": 1665
    "source_sequence": 188
  "translation_ja": "特許状の文言は、「自発的に、事情を承知のうえで、これを受け取ろうとし、または受け取る意思のある者により、通貨として通用し受領されるものとし、それ以外の場合を除く」となっている。「これ」とは半ペニー銅貨とファージング銅貨である。［T・S］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l01-038"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And let me in the next place apply myself particularly to you who are the poor sort of tradesmen, perhaps you may think you will not be so great losers as the rich, if these halfpence should pass, because you seldom see any silver, and your customers come to your shops or stalls with nothing but brass, which you likewise find hard to be got, but you may take my word, whenever this money gains footing among you, you will be utterly undone; if you carry these halfpence to a shop for tobacco or brandy, or any other thing you want, the shopkeeper will advance his goods accordingly, or else he must break, and leave the key under the door. Do you think I will sell you a yard of tenpenny stuff for twenty of Mr. Wood's halfpence? No, not under two hundred at least, neither will I be at the trouble of counting, but weigh them in a lump; I will tell you one thing further, that if Mr. Wood's project should take, it will ruin even our beggars; For when I give a beggar an halfpenny, it will quench his thirst, or go a good way to fill his belly, but the twelfth part of a halfpenny will do him no more service than if I should give him three pins out of my sleeve."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[158]"
    "line_start": 1670
    "source_sequence": 189
  "translation_ja": "次に、商売をなさる方のうちでも、貧しい皆さんへ特にお話しさせてください。この半ペニー銅貨が通用したところで、金持ちほど損はしない、とお考えになるかもしれません。銀貨などめったに見かけず、お客が店や露店へ持ってくるのは真鍮貨ばかりで、それさえ手に入りにくいのですから。しかし、私の言葉を信じてください。この貨幣が皆さんの間にいったん根づけば、皆さんは完全に破滅するのです。これを持って、煙草やブランデーや、ほかに必要な物を店へ買いに行けば、店主はそれに応じて値をつり上げます。そうしなければ破産し、店を閉め、鍵を戸の下へ残して去るほかありません。十ペンスの毛織物一ヤードを、ウッド氏の半ペニー銅貨二十枚で、私が売ると思いますか。いいえ、少なくとも二百枚なければ売りません。それもいちいち数える手間などかけず、ひとまとめに重さを量るでしょう。もう一つ申せば、ウッド氏の計画が成功したら、わが国の乞食さえ破滅します。私が乞食に半ペニーをやれば、渇きを癒やせるか、腹を満たすかなりの助けになります。しかし半ペニーの十二分の一では、私が袖から針を三本抜いて渡すのと、たいして違いはないのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-039"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In short these halfpence are like \"the accursed thing, which\" as the Scripture tells us, \"the children of Israel were forbidden to touch,\" they will run about like the plague and destroy every one who lays his hands upon them. I have heard scholars talk of a man who told a king that he had invented a way to torment people by putting them into a bull of brass with fire under it, but the prince put the projector first into his own brazen bull to make the experiment;[35] this very much resembles the project of Mr. Wood, and the like of this may possibly be Mr. Wood's fate, that the brass he contrived to torment this kingdom with, may prove his own torment, and his destruction at last."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[159]"
    "line_start": 1689
    "source_sequence": 190
  "translation_ja": "要するに、この半ペニー銅貨は、聖書が語る、「イスラエルの子らが触れることを禁じられた、呪われた物」のようなものです。疫病のように広まり、手にする者を誰も彼も滅ぼします。学者たちがこんな男の話をするのを聞いたことがあります。真鍮の雄牛に人を入れ、下から火をたいて責め苦を与える方法を発明したと、ある王に申し出た男です。しかし君主は試してみようと、まず発案者自身をその真鍮の雄牛に入れました。[35] これはウッド氏の計画によく似ています。ウッド氏も同じ運命に遭うかもしれません。この王国を苦しめようと彼が工夫した真鍮が、自分自身の責め苦となり、ついには破滅を招くかもしれないのです。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-note-035-001"
  "section_id": "letter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "It is curious to find Swift so referring to Phalaris, of whom he had heard so much in the days of the \"Battle of the Books.\" [SIR H. CRAIK.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[160]"
    "line_start": 1701
    "source_sequence": 191
  "translation_ja": "『書物合戦』のころにあれほどファラリスについて耳にしたスウィフトが、ここでこのように言及しているのは興味深い。［サー・H・クレイク］"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: SIRH.CRAIK."
- "id": "dl-l01-040"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "N.B. The author of this paper is informed by persons who have made it their business to be exact in their observations on the true value of these halfpence, that any person may expect to get a quart of twopenny ale for thirty-six of them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[161]"
    "line_start": 1706
    "source_sequence": 192
  "translation_ja": "付記。この文章の筆者は、この半ペニー銅貨の本当の価値を正確に調べることに専念してきた人々から、三十六枚もあれば、誰でも二ペンスのエールを一クォート買えると思ってよい、と聞いています。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l01-041"
  "section_id": "letter-01-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I desire all persons may keep this paper carefully by them to refresh their memories whenever they shall have farther notice of Mr. Wood's halfpence, or any other the like imposture."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[162]"
    "line_start": 1712
    "source_sequence": 193
  "translation_ja": "皆さんには、この紙を大切に手元に保管し、ウッド氏の半ペニー銅貨や、ほかの同じような詐欺について、さらに知らせがあったとき、記憶を新たにしていただきたいと思います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"

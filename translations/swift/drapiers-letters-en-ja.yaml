  "reader_notes_ja":
  - "第I〜VII書簡を一つの連作として訳す。底本の独立した編者解説・公文書・付録・索引は対象外。"
  - "底本の第五書簡（ミドルトン宛）と第六書簡（モールズワース宛）は、1801年版の第六・第五書簡にそれぞれ対応する。採用底本の順序を保持し、同一書簡を重複収録しない。"
  - "「読者への告知」は早期刊本の前付として区別する。そこでいう二篇は、現在の第五・第六書簡ではなく、ミドルトン宛書簡と第七書簡の「議会両院への謹んでの上申」を指す。"
  - "底本の金額・日付・法令番号の食い違いは、本文と注を区別して残した。文脈で読める誤植はその意味で訳し、原文の記載を保持した。"

    "contributor_id": "temple-scott"
- "id": "dl-l03-042"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let us now examine this new patent granted to William Wood. It passed upon very false suggestions of his own, and of a few confederates: It passed in England, without the least reference hither. It passed unknown to the very Lord Lieutenant, then in England. Wood is empowered to coin one hundred and eight thousand pounds, \"and all the officers in the kingdom (civil and military) are commanded\" in the Report to countenance and assist him. Knox had only power to utter what we would take, and was obliged \"to receive his coin back again at our demand,\" and to \"enter into security for so doing.\" Wood's halfpence are not milled, and therefore more easily counterfeited by himself as well as by others: Wood pays a thousand pounds per ann. for 14 years, Knox paid only 16l. 13s. 4d. per ann. for 21 years."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[324]"
    "line_start": 3797
    "source_sequence": 373
  "translation_ja": "では、ウィリアム・ウッドに与えられたこの新しい特許状を調べましょう。これは、彼自身と少数の共謀者の甚だしい虚偽の申し立てに基づいて発給されました。当地にはまったく照会せず、イングランドで発給されました。当時イングランドにいた総督その人にも知らされずに、発給されました。ウッドは十万八千ポンドを鋳造する権限を与えられ、「王国のすべての文武の官吏は」彼を支持し、援助するよう、「報告」で「命じられて」います。ノックスには、私たちが受け取るだけの量を発行する権限しかなく、「私たちの請求に応じて自分の貨幣を引き取ること」、そして「そうするための担保を差し入れること」を義務づけられていました。ウッドの半ペニー銅貨には縁の刻みがないので、ほかの者だけでなく、彼自身にとっても偽造が容易です。ウッドは十四年間、年千ポンドを支払い、ノックスは二十一年間、年十六ポンド十三シリング四ペンスしか支払いませんでした。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-043"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It was the Report that set me the example of making a comparison between those two patents, wherein the committee was grossly misled by the false representation of William Wood, as it was by another assertion, that seven hundred ton of copper were coined during the 21 years of Lord Dartmouth's and Knox's patents. Such a quantity of copper at the rate of 2s. 8d. per pound would amount to about an hundred and ninety thousand pounds, which was very near as much as the current cash of the kingdom in those days; yet, during that period, Ireland was never known to have too much copper coin, and for several years there was no coining at all: Besides I am assured, that upon enquiring into the custom-house books, all the copper imported into the kingdom, from 1683 to 1692, which includes 8 years of the 21 (besides one year allowed for the troubles) did not exceed 47 tons, and we cannot suppose even that small quantity to have been wholly applied to coinage: So that I believe there was never any comparison more unluckily made or so destructive of the design for which it was produced."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[325]"
    "line_start": 3811
    "source_sequence": 374
  "translation_ja": "この二つの特許状を比較する手本を私に示したのは、「報告」のほうでした。その比較で委員会は、ウィリアム・ウッドの虚偽の説明によって、ひどく惑わされています。ダートマス卿とノックスの特許期間二十一年の間に、七百トンの銅が鋳造された、というもう一つの主張についても同様です。その量の銅を、一ポンドにつき二シリング八ペンスの割合で鋳造すれば、およそ十九万ポンドになります。当時の王国の流通貨幣の総額に、ほとんど匹敵する額です。それなのに、その期間、アイルランドで銅貨が多すぎるとされたことは一度もなく、何年もの間、鋳造がまったく行われなかったことさえありました。さらに、税関の帳簿を調べたところ、一六八三年から一六九二年までに王国へ輸入された銅は、すべて合わせても四十七トンを超えなかったと、確かな筋から聞いています。この期間には、前記二十一年のうちの八年が含まれ、ほかに騒乱のための一年も見込まれています。そのわずかな量でさえ、すべてが貨幣鋳造に使われたとは考えられません。これほどまずい比較、それを持ち出した目的をこれほど自分で損なう比較は、かつてなかったと思います。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-044"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The Psalmist reckons it an effect of God's anger, when \"He selleth His people for nought, and taketh no money for them.\" That we have greatly offended God by the wickedness of our lives is not to be disputed: But our King we have not offended in word or deed; and although he be God's vicegerent upon earth, he will not punish us for any offences, except those which we shall commit against his legal authority, his sacred person (which God preserve) or the laws of the land."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[326]"
    "line_start": 3829
    "source_sequence": 375
  "translation_ja": "詩篇の作者は、神が「その民をただ同然で売り、彼らのために代金も取られない」ことを、神の怒りの現れに数えています。私たちの悪い暮らしぶりが、神を大いに怒らせたことは争えません。しかし、私たちは言葉でも行いでも、国王には背いていません。そして、国王は地上における神の代理者ではあっても、その合法的な権威、その尊い御身――神よ、お守りください――あるいは国法に対して私たちが犯す罪以外については、私たちを罰しようとはなさらないでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-045"
  "section_id": "letter-03-body"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The Report is very profuse in arguments, that Ireland is in great want of copper money.[15] Who were the witnesses to prove it, hath been shewn already, but in the name of God, Who are to be judges? Does not the nation best know its own wants? Both Houses of Parliament, the Privy-council and the whole body of the people declare the contrary: Or let the wants be what they will, We desire they may not be supplied by Mr. Wood. We know our own wants but too well; they are many and grievous to be borne, but quite of another kind. Let England be satisfied: As things go, they will in a short time have all our gold and silver, and may keep their adulterate copper at home, for we are determined not to purchase it with our manufactures, which Wood hath graciously offered to accept. Our wants are not so bad by an hundredth part as the method he hath taken to supply them. He hath already tried his faculty in New-England,[16] and I hope he will meet at least with an equal reception here; what that was I leave to public intelligence. I am supposing a wild case, that if there should be any person already receiving a monstrous pension out of this kingdom, who was instrumental in procuring this patent, they have either not well consulted their own interests, or Wood must[17] put more dross into his copper and still diminish its weight."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[327]"
    "line_start": 3838
    "source_sequence": 376
  "translation_ja": "「報告」は、アイルランドが銅貨の大いなる不足にあると、議論をふんだんに並べています。[15] それを証明する証人が誰だったかは、すでに示しました。しかし、神にかけて伺いますが、誰が判断するのでしょうか。国の必要をいちばんよく知っているのは、その国民ではありませんか。議会両院、枢密院、国民の全体が、それとは反対のことを述べています。あるいは、どんな不足があるにせよ、私たちはそれをウッド氏に満たしてもらいたくありません。自分たちの不足は、嫌というほど承知しています。多く、耐え難いものばかりですが、種類がまるで違うのです。イングランドには、もう満足してもらいましょう。この調子でいけば、間もなく私たちの金銀をすべて手にするでしょうから、混ぜ物入りの銅貨は、国の中に取っておいてかまいません。私たちは、それを自分たちの製品と引き換えに買わないと決めているからです。ウッドはありがたくも、製品で受け取ってよいと言ってくれましたが。私たちの不足は、それを補うために彼が採った方法のひどさに比べれば、百分の一にもなりません。彼はすでにニューイングランドで腕を試しています。[16] 当地でも、少なくとも同じ程度の歓迎を受けてほしいものです。それがどのような歓迎だったかは、世間の報道にお任せします。ここで一つ、突飛な場合を想定しましょう。すでにこの王国から莫大な年金を受け取っている人物が、この特許状の取得に力を貸したのだとしたら、その人は自分の利益をよく考えていなかったか、さもなければウッドが、[17] 銅にもっとかすを混ぜ、さらに重さを減らさなければならないでしょう。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "body"
  "attributions":
  - "voice": "author"
    "contributor_id": "swift"
- "id": "dl-l03-note-015-001"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "On this subject of the want of small money in Ireland, Monck Mason traverses the Report in the following manner:"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[328]"
    "line_start": 3859
    "source_sequence": 377
  "translation_ja": "アイルランドにおける小銭不足という問題について、モンク・メイソンは次のように「報告」に反論している。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-015-002"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"There appears to be a manifest prevarication in their lordships' report upon this part of the subject; they state, that the witnesses testified, that there was a want of small money in Ireland; they attempt, therefore, to impose a copper currency, which certainly was not wanted. To satisfy the reader upon this point, I shall quote, from the unpublished correspondence of Archbishop King, the following extracts: the first, from his letter to General Gorge, dated the 17th October, 1724, is to the following purpose."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[329]"
    "line_start": 3863
    "source_sequence": 378
  "translation_ja": "「この論点に関する貴族委員たちの報告には、明白なごまかしがあるように見える。彼らは、アイルランドには小銭の不足があると証人たちが証言した、と述べる。それゆえ彼らは、確実に不足などしていなかった銅貨を、押しつけようとするのである。この点を読者に納得してもらうため、キング大主教の未刊書簡から、次の箇所を引用しよう。第一のものは、一七二四年十月十七日付のゴージ将軍への書簡からで、その趣旨は次のとおりである。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-015-003"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'... As to our wanting halfpence for change, it is most false; we have more halfpence than we need, already; it is true, we want change; but it is sixpences, shillings, half-crowns, and crowns; our silver and our guineas being almost gone; and the general current coin of the kingdom is now moydores, which are thirty shillings a-piece; at least nine pence above the value in silver: now, they would have us change these for halfpence, and so the whole cash of the kingdom would be these halfpence.' ..."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[330]"
    "line_start": 3873
    "source_sequence": 379
  "translation_ja": "「『……釣り銭にする半ペニー銅貨が足りないというのは、まったくの虚偽です。半ペニー銅貨は、すでに必要以上にあります。確かに釣り銭は足りません。しかし足りないのは、六ペンス、シリング、半クラウン、クラウンの銀貨です。私たちの銀貨とギニー金貨はほとんどなくなってしまい、今、王国で一般に通用しているのはモイドール金貨で、一枚三十シリングです。銀貨での価値より、少なくとも九ペンス高いのです。ところが、今度はこれを半ペニー銅貨に換えさせようというのですから、王国の現金はすべて、この半ペニー銅貨になってしまうでしょう』。……"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-015-004"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"But the true state of the case, as to coin, is more circumstantially developed in the following letter of the same prelate to Mr. Southwell, which was written a few months before, viz., on the 9th June, 1724."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[331]"
    "line_start": 3883
    "source_sequence": 380
  "translation_ja": "「しかし、貨幣についての実情は、同じ大主教がその数か月前、すなわち一七二四年六月九日にサウスウェル氏に宛てた次の書簡で、さらに詳しく明らかにされている。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-015-005"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'... And yet, after all, we want change, and I will take leave to acquaint you with the state of this kingdom as to coin. We used to have hardly any money passing here, but foreign ducatoons, plate pieces, perns, dollars, etc. but, when the East India Company were forbid sending the coin of England abroad, they continued to buy up all our foreign coin, and give us English money in lieu of some part of it; by which we lost twopence in every ounce, the consequence of this was, that in two years there was not to be seen in Ireland a piece of foreign silver."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[332]"
    "line_start": 3888
    "source_sequence": 381
  "translation_ja": "「『……それでも結局、私たちには釣り銭が足りません。そこで、お許しを得て、この王国の貨幣事情をお知らせします。かつて当地で通用する貨幣は、外国のドゥカトン貨、プラーテ貨、パーン貨、ダラー貨などが、ほとんどすべてでした。しかし、東インド会社がイングランド貨幣を海外へ送ることを禁じられると、同社は私たちの外国貨幣をすべて買い集め続け、その一部の代わりにイングランドの貨幣を渡したので、私たちは一オンスにつき二ペンスを失いました。その結果、二年たつと、アイルランドでは外国銀貨を一枚も見かけなくなりました。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-015-006"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'If any be brought, it is immediately sent away, the two, or as I am informed, the three pence in the ounce, given by the East India Company, being a temptation not to be resisted; but, the truth is, very little is brought in, for the merchants that carry our commodities to foreign markets, find it more to their advantage to carry directly to London whatever they receive in cash; and whereas formerly they used, when they had disposed of their cargo, to load their vessels with such commodities as there was a demand for in Ireland, and bring the rest in cash, they bring now only the commodities, and send the silver to London; and when they have got the twopence in every ounce from the East India Company, the rest serves to answer the returns we are obliged to make to England, for the rents we are obliged to pay to noblemen and gentlemen who have estates in Ireland and live in England, and for the pensions, and other occasions which are many; by this means they gain likewise the exchange, which is commonly four or five per cent, better to them than if they sent cash."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[333]"
    "line_start": 3898
    "source_sequence": 382
  "translation_ja": "「『何か持ち込まれても、すぐに送り出されてしまいます。東インド会社が一オンスにつき二ペンス、聞くところでは三ペンスを支払うという誘惑には、抗し難いからです。しかし実際には、持ち込まれるものはごくわずかです。わが国の産物を外国市場へ運ぶ商人たちは、現金で受け取った分はそのままロンドンへ運んだほうが得だと気づいたからです。以前は、積荷を売り払うと、アイルランドで需要のある商品を船に積み、残りを現金で持ち帰ったものでしたが、今は商品だけを持ち帰り、銀はロンドンへ送っています。そして、東インド会社から一オンスにつき二ペンスを受け取ると、残りは私たちがイングランドへ送らなければならない支払いに充てられます。アイルランドに領地を持ちながらイングランドに住む貴族や紳士に払う地代、年金、その他数多くの用件です。この方法によって商人たちは、現金を送るより通常四、五パーセント有利な為替差益も手にします。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-015-007"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'It Is farther to be observed, that 21 shillings, which is the value of a guinea in England, makes in Ireland 22 shillings and 9 pence, whereas a guinea passes for 23 shillings with us, therefore, he who sends silver into England, gains three pence more by it than if he sent guineas; this advantage, though it may seem little, yet in a manner has entirely drained us of our English money which was given in lieu of foreign silver."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[334]"
    "line_start": 3915
    "source_sequence": 383
  "translation_ja": "「『さらに注意すべきは、イングランドでのギニー金貨の価値である二十一シリングが、アイルランドでは二十二シリング九ペンスに相当するのに、わが国ではギニー金貨が二十三シリングで通用することです。したがって、銀貨をイングランドに送る者は、ギニー金貨を送った場合よりも、三ペンス多く得をします。この利益は小さいようですが、実質的には、外国銀貨の代わりに渡されたイングランド貨幣を、すっかりわが国から吸い尽くしてしまいました。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-015-008"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'But farther, if any carry foreign gold to England, they cannot easily pass it, and if they do, it is at a greater loss than there is in the guineas, this has taken away our guineas, so that there is hardly one to be seen; we have hardly any coin left but a few moydores and pistoles, which can, by no means, serve the inland trade of the kingdom."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[335]"
    "line_start": 3923
    "source_sequence": 384
  "translation_ja": "「『さらに、外国の金貨をイングランドに持ち込んでも、容易には通用せず、通用させても、ギニー金貨より損失が大きくなります。このため私たちのギニー金貨は持ち去られ、今では一枚見かけることさえほとんどありません。わずかなモイドール金貨とピストール金貨を除けば、貨幣はほとんど残っておらず、それでは到底、王国内の商取引をまかなえません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-015-009"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'To give, therefore, a short view of our case, it is thus; We can have English coin but by stealth, there being an act of parliament forbidding the exportation of English coin; if, therefore, we should send our gold or silver to England to be coined, we cannot have it back again, or if we could, we cannot keep it for the reason above; we cannot for the same reason have foreign silver; let us add to these, that by the act of navigation and other acts, we cannot make our markets of buying where we make our markets for selling; though we might have the commodities we want much cheaper there, than we can have them in England, viz. all East India and Turkey goods, with many others: nor is it to be expected that any nation will trade with us with their silver only, when we will not exchange commodities with them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[336]"
    "line_start": 3930
    "source_sequence": 385
  "translation_ja": "「『そこで、私たちの事情を簡単に示せば、こうです。イングランド貨幣の輸出を禁じる議会制定法があるため、イングランド貨幣を手に入れるには、ひそかに行うほかありません。したがって、私たちが金銀を鋳造してもらおうとイングランドへ送っても、取り戻すことはできず、仮にできても、先に述べた理由から、手もとにとどめられません。同じ理由で、外国銀貨も持てません。これに加えて、航海法やその他の法律によって、私たちは売る市場で買うことができません。必要な商品を、その市場ならイングランドよりずっと安く手に入れられるにもかかわらず、です。すなわち、東インドやトルコの商品すべてと、その他多くの商品がそれに当たります。また、こちらが商品を交換しようとしないのに、どこかの国が銀だけを携えて私たちと貿易してくれるとは、期待できません。"
  "translation_status": "reviewed"
  "translation_required": true
  "source_kind": "attached_edition_note"
  "attributions":
  - "voice": "editor"
    "evidence_ja": "底本注の署名: T.S."
    "contributor_id": "temple-scott"
- "id": "dl-l03-note-015-010"
  "section_id": "letter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "\"'Except, therefore, England designs entirely to ruin Ireland, a kingdom by which it is demonstrable that she gains yearly thirteen or fourteen hundred thousand pounds, she ought to think of giving us some relief'\" (\"History of St. Patrick's,\" pp. xciii-xciv). [T.S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "pg-12784"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/12784/pg12784-images.html"
    "xpath": "/html/body/p[337]"

  translation_ja: 閣下の仰せに従うとともに、私自身の好奇心をも満たすため、この数日間、暦作りのパートリッジの様子を、絶えず尋ねていた。一か月ほど前に公表されたビッカースタッフ氏の予言によれば、彼は当月29日、夜11時ごろ、激しい熱病で死ぬことになっていた。私が税務に勤めていたころ、彼とは、いくらか面識があった。私やほかの紳士たちが、ささやかな謝礼をやるので、毎年、自分の暦を贈ってきたからである。彼が死ぬ十日ほど前にも、偶然一度か二度会い、ひどくしおれ、衰え始めているのに気づいた。ただ、聞くところでは、友人たちは、危険な状態とは思っていなかったらしい。二、三日前、彼は病気になって、まず部屋に引きこもり、それから数時間後には床についた。そこへ、診察して薬を出してもらおうと、ケイス博士とカールース夫人が呼ばれた。この報せを聞くと、私は毎日三度ずつ、召使いを誰かしら送り、容体を尋ねさせた。そして昨日の午後4時ごろ、もう望みはないと伝えられた。そこで私は、憐れみからという気持ちもあり、白状すれば、好奇心からという気持ちもあって、自分で見舞いに行く気になった。彼は私が誰かをよく覚えており、私がわざわざ来たのに驚いたようで、その状態でできる限り、礼を述べた。まわりの人は、しばらく前からうわごとを言っていたと話したが、私が見たときには、これまで知っていたのと変わらず、しっかり理解し、苦しそうな様子や無理をしている様子もなく、力強く、はっきりと話した。私は、これほど痛ましい状態にあるのを見て、どんなにつらいかを伝え、その場にふさわしい、ほかの挨拶もいくらか述べた。そのあとで、ビッカースタッフ氏が彼の死について公表した予言が、想像力にあまりに強く作用し、心を乱したのではないか、遠慮なく率直に話してほしいと頼んだ。彼は、それをたびたび頭に思い浮かべていたことは認めたが、二週間ほど前までは、大して恐ろしくなかったと言った。それ以後は、そのことが心と思考を絶えず占領し、今の病気の本当の、自然な原因になったのだと、心から信じているという。というのも、と彼は言った、ビッカースタッフ氏は、何もかも当て推量で言ったのであって、今年起こることについて、私自身以上のことは、何も知らなかったと、私は十分に確信しているし、そう思うだけの、たいへんよい理由もある、と。私は、その話には驚いた、ビッカースタッフ氏の無知を確信する、どんな理由があったのか、話せるだけの健康があればよいのに、と言った。すると彼は答えた。私は、卑しい商売を仕込まれた、貧しく無学な男です。それでも、占星術で先のことがわかるなどという主張は、すべていかさまだと知るだけの分別はあります。理由ははっきりしています。この学問にいくらかでも真実があるかどうか、判断できるのは、賢者や学者だけです。その人たちが皆、声をそろえて笑い、軽蔑しているのです。信じるのは、貧しく無学な俗人だけで、それも、読み書きもろくにできない、私や同業者のような、間抜けなろくでなしどもの言葉をうのみにしているだけなのです。そこで私は、ビッカースタッフの予言と合うかどうか、自分の誕生時の星を、なぜ計算しなかったのかと尋ねた。彼は頭を振り、ああ、旦那、今は冗談を言うときではありません。あんな愚行を悔い改めるときです。今こうして、心の底から悔いているのです、と言った。あなたの話からすると、と私は言った、あなたが暦と一緒に印刷した観測や予言は、まったく人々をだますものだったのですね。彼は答えた。そうでなければ、私の罪も、もう少し軽くなりましょう。ああいうことには皆、決まった型があるのです。天気の予報などには、私たちは一切手を出さず、印刷屋に任せます。向こうが適当に、古い暦のどれかから引っ張ってくるのです。ほかは、暦を売るため、私が考え出したものです。養わねばならない妻がいて、ほかに食べる道がないものですから。古靴の修繕では、たいした暮らしにはなりません。そして、と彼はため息をついて付け加えた、占星術よりも、薬のほうで、もっとひどい害を与えていなければよいのですが。祖母から教わった、よい処方もいくつかありましたし、自分で調合したものも、少なくとも害はないと思ったものでは、ありましたが。

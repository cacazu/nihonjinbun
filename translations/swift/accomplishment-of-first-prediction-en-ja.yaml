- id: bicker-accomplishment-005
  section_id: accomplishment
  kind: paragraph
  origin: source
  source_text: 'I had some other discourse with him, which now I cannot call to mind; and I fear I have already tired your Lordship. I shall only add one circumstance, That on his death-bed he declared himself a Nonconformist, and had a fanatick preacher to be his spiritual guide. After half an hour''s conversation I took my leave, being half stifled by the closeness of the room. I imagine he could not hold out long, and therefore withdrew to a little coffee-house hard by, leaving a servant at the house with orders to come immediately, and tell me, as near as he could, the minute when Partridge should expire, which was not above two hours after; when, looking upon my watch, I found it to be above five minutes after seven; by which it is clear that Mr. Bickerstaff was mistaken almost four hours in his calculation. In the other circumstances he was exact enough. But whether he has not been the cause of this poor man''s death, as well as the predictor, may be very reasonably disputed. However,
    it must be confess''d the matter is odd enough, whether we should endeavour to account for it by chance, or the effect of imagination: For my own part, tho'' I believe no man has less faith in these matters, yet I shall wait with some impatience, and not without some expectation, the fulfilling of Mr. Bickerstaff''s second prediction, that the Cardinal de Noailles is to die upon the fourth of April, and if that should be verified as exactly as this of poor Partridge, I must own I should be wholly surprized, and at a loss, and should infallibly expect the accomplishment of all the rest.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0002
    xpath: /html[1]/body[1]/p[64]
    line_start: 579
    line_end: 602
    source_sequence: 57
  translation_ja: ほかにもいくらか話をしたが、今は思い出せない。すでに閣下を、お疲れにしてしまったのではないかと思う。もう一つだけ事情を付け加えよう。彼は死の床で、自分は非国教徒だと告白し、狂信的な説教師を、魂の導き手としていた。三十分ほど話したあと、私は暇を告げた。部屋が締め切ってあって、半ば息が詰まりそうだったからだ。彼はもう長くは持たないと思い、すぐ近くの小さなコーヒー店へ退いた。召使いを一人その家に残し、パートリッジが息を引き取ったら、できる限り正確な時刻を、すぐ知らせに来るよう命じておいた。それは二時間もたたないうちのことだった。時計を見ると、7時5分を少し過ぎていた。これによって、ビッカースタッフ氏の計算には、四時間近い誤りがあったことが明らかである。ほかの事情については、十分正確だった。だが、彼がこの気の毒な男の死を予告しただけでなく、その原因にもなったのではないか、という点は、議論するだけの理由が大いにあるだろう。いずれにせよ、偶然として説明しようと、想像力の作用として説明しようと、この件が、かなり奇妙であることは認めざるをえない。私自身、この手のことへの信頼は、誰にも劣らず乏しいつもりだが、それでも、ノアイユ枢機卿が4月4日に死ぬという、ビッカースタッフ氏の第二の予言の成就を、いささか待ち遠しく、また、いくらかの期待をもって待つつもりである。それが、気の毒なパートリッジについての予言と同じほど正確に確かめられたなら、私も、ただ驚き、途方に暮れるだろうし、残りもすべて、間違いなく成就するものと期待するほかない、と白状しなければならない。

- "id": "ldr-verse-005"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |2-
      But, oh! it turn'd poor Strephon's bowels
    When he beheld and smelt the towels,
    Begumm'd, bematter'd, and beslim'd,
    With dirt, and sweat, and ear-wax grim'd;
    No object Strephon's eye escapes;
    Here petticoats in frouzy heaps;
    Nor be the handkerchiefs forgot,
    All varnish'd o'er with snuff and snot.
    The stockings why should I expose,
    Stain'd with the moisture of her toes,[2]
    Or greasy coifs, and pinners reeking,
    Which Celia slept at least a week in?
    A pair of tweezers next he found,
    To pluck her brows in arches round;
    Or hairs that sink the forehead low,
    Or on her chin like bristles grow.
  "translation_ja": |-
    だが、ああ、気の毒なストレフォンは、腹の底からむかついた、
    手ぬぐいを目にし、その臭いを嗅いだときに。
    ねばつき、膿と粘液にまみれ、
    垢と汗と耳垢で、黒ずんでいる。
    ストレフォンの目を、逃れる物はない。
    ここには、かび臭い山をなす、ペティコート。
    ハンカチも、忘れてはならない、
    嗅ぎ煙草と鼻汁で、すっかり艶をつけたものを。
    なぜ、私が、靴下までさらそう、
    足の指の湿り気で、染みだらけのものを。[2]
    あるいは、あぶらじみた頭巾や、臭う垂れ布つきの帽子、
    少なくとも一週間は、シーリアがかぶって寝たものを。
    次には、毛抜きを一つ、見つけた、
    眉を、丸い弧の形に抜くためのもの、
    あるいは、額へ低く生え下がった毛や、
    顎に剛毛のように生える毛を、抜くためのものを。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[207]"

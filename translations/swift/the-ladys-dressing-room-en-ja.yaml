- "id": "ldr-verse-002"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |2-
      Strephon, who found the room was void,
    And Betty otherwise employ'd,
    Stole in, and took a strict survey
    Of all the litter as it lay:
    Whereof, to make the matter clear,
    An inventory follows here.
  "translation_ja": |-
    ストレフォンは、部屋が空いていて、
    ベティも、ほかの仕事にかかっていると知り、
    忍び込み、散らかり放題の品々を、
    一つ残らず、念入りに見て回った。
    そこで、事を明らかにするため、
    ここに、その目録を掲げよう。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"

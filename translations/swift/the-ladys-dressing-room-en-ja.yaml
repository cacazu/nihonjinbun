- "id": "ldr-verse-003"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |2-
      And, first, a dirty smock appear'd,
    Beneath the arm-pits well besmear'd;
    Strephon, the rogue, display'd it wide,
    And turn'd it round on ev'ry side:
    On such a point, few words are best,
    And Strephon bids us guess the rest;
    But swears, how damnably the men lie
    In calling Celia sweet and cleanly.
  "translation_ja": |-
    まず、汚れた肌着が現れた、
    脇の下は、すっかり汚れにまみれている。
    悪党ストレフォンは、それを広げ、
    ひっくり返して、隅々まで眺めた。
    こういう点は、多くを語らぬにかぎる、
    あとは察しろと、ストレフォンは言う。
    だが、シーリアを、よい香りの、清潔な女と呼ぶ、
    男どもは、とんでもない嘘つきだと、罵って誓う。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"

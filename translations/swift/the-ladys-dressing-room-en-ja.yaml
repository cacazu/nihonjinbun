- "id": "ldr-verse-010"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |2-
      Thus finishing his grand survey,
    Disgusted Strephon slunk away;
    Repeating in his amorous fits,
    "Oh! Celia, Celia, Celia sh—!"
    But Vengeance, goddess never sleeping,
    Soon punish'd Strephon for his peeping:
    His foul imagination links
    Each dame he sees with all her stinks;
    And, if unsavoury odours fly,
    Conceives a lady standing by.
    All women his description fits,
    And both ideas jump like wits;
    By vicious fancy coupled fast,
    And still appearing in contrast.
  "translation_ja": |-
    こうして、大探検を終え、
    うんざりしたストレフォンは、こそこそ立ち去った。
    恋の発作にとらわれては、繰り返す、
    「おお、シーリア、シーリア、シーリアは、くそを——！」
    だが、決して眠らぬ女神、復讐は、
    のぞき見したストレフォンを、すぐ罰した。
    その不潔な想像力は、目にする、どの女をも、
    その女の、ありとあらゆる悪臭と、結びつける。
    そして、不快な臭いが漂えば、
    そばに、婦人が立っていると思い込む。
    どんな女にも、彼の描く姿は当てはまり、
    二つの観念は、才人の考えのように、ぴたりと合う。
    いびつな空想で、固く結ばれ、
    しかも、いつも、互いに対照をなして現れる。
  "translation_status": "reviewed"

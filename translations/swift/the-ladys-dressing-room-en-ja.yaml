- "id": "ldr-verse-001"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Five hours (and who can do it less in?)
    By haughty Celia spent in dressing;
    The goddess from her chamber issues,
    Array'd in lace, brocades, and tissues.
  "translation_ja": |-
    五時間を（これより短く、誰が済ませられよう）、
    高慢なシーリアは、身支度に費やした。
    女神は、部屋から姿を現す、
    レースと錦織と薄絹をまとって。
  "translation_status": "reviewed"
  "source_locations":

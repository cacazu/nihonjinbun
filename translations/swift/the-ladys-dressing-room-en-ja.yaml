- "id": "ldr-verse-008"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |2-
      As, from within Pandora's box,
    When Epimetheus op'd the locks,
    A sudden universal crew
    Of human evils upward flew;
    He still was comforted to find
    That hope at last remain'd behind:
    So Strephon, lifting up the lid,
    To view what in the chest was hid,
    The vapours flew from up the vent;
    But Strephon, cautious, never meant
    The bottom of the pan to grope,
    And foul his hands in search of hope.
    O! ne'er may such a vile machine
    Be once in Celia's chamber seen!
    O! may she better learn to keep
    Those "secrets of the hoary deep." [3]
  "translation_ja": |-
    パンドラの箱の中から、
    エピメテウスが、錠を開けたとき、
    人間を襲う、ありとあらゆる災いの群れが、
    不意に、上へと飛び出したとき、
    それでも、最後には、希望だけが、
    あとに残ったと知り、彼は慰められた。
    それと同じく、ストレフォンが蓋を上げ、
    箱に隠されたものを見ようとすると、
    湯気が、穴から、上へと吹き出した。
    だが、用心深いストレフォンは、そもそも、
    便壺の底を、手探りして、
    希望を求め、手を汚すつもりはなかった。
    ああ、こんな汚らしい仕掛けが、
    シーリアの部屋で、一度たりとも、見られませんように！
    ああ、彼女が、もっと上手に隠せますように、
    かの「太古の深淵の秘密」を。[3]
  "translation_status": "reviewed"
  "source_locations":

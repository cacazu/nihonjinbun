- "id": "ldr-verse-007"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |2-
      Why, Strephon, will you tell the rest?
    And must you needs describe the chest?
    That careless wench! no creature warn her
    To move it out from yonder corner!
    But leave it standing full in sight,
    For you to exercise your spight?
    In vain the workman shew'd his wit,
    With rings and hinges counterfeit,
    To make it seem in this disguise
    A cabinet to vulgar eyes:
    Which Strephon ventur'd to look in,
    Resolved to go thro' thick and thin.
    He lifts the lid: there needs no more,
    He smelt it all the time before.
  "translation_ja": |-
    ストレフォン、なぜ、残りまで話すのだ。
    どうしても、あの箱を描き出さねばならないのか。
    あの、うっかり女中め！　誰も言ってやらなかったのか、
    あの隅から、どかしておけと。
    それなのに、丸見えのまま、置いておくとは、
    おまえが、意地の悪さを振るえるようにとでもいうのか。
    職人が、知恵を見せたのも、無駄だった、
    見せかけの、取っ手の輪や蝶番をつけ、
    その偽装で、普通の目には、
    飾り戸棚と見えるようにしたのも。
    ストレフォンは、思い切って、中をのぞいた、
    どんなことになろうと、やり抜くと決めて。
    蓋を上げた。もう、それ以上は要らない、
    それまでも、ずっと、臭いは嗅いでいたのだから。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[207]"

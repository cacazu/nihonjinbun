- "id": "ldr-verse-009"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |2-
      As mutton-cutlets, prime of meat,
    Which, tho' with art you salt and beat,
    As laws of cookery require,
    And toast them at the clearest fire;
    If from upon the hopeful chops
    The fat upon a cinder drops,
    To stinking smoke it turns the flame,
    Pois'ning the flesh from whence it came,
    And up exhales a greasy stench,
    For which you curse the careless wench:
    So things which must not be exprest,
    When drop'd into the reeking chest,
    Send up an excremental smell
    To taint the part from whence they fell:
    The petticoats and gown perfume,
    And waft a stink round ev'ry room.
  "translation_ja": |-
    極上の肉、羊肉の骨つき切り身も、
    料理の掟が、要求するとおり、
    手をかけて、塩をすり込み、叩いて、
    煙の出ぬ火で、炙り上げようとも、
    その、うまそうな骨つき肉から、
    脂が、燃えさしへ滴り落ちれば、
    炎を、臭い煙へと変えて、
    脂のもととなった肉を、台無しにし、
    上へ、脂ぎった悪臭を立ちのぼらせ、
    そのため、不注意な女中を、罵ることになる。
    それと同じく、口に出してはならぬものも、
    湯気の立つ箱へ、落とされれば、
    排泄物の臭いを、立ちのぼらせて、
    それが落ちてきた部位へ、臭いを染みつかせる。
    ペティコートやガウンを、香らせ、
    部屋という部屋へ、悪臭を漂わせる。
  "translation_status": "reviewed"
  "source_locations":

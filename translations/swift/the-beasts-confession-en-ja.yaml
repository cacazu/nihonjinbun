  "full_review_corrections_ja":
  - "segment_id": "bc-preface-001"
    "reason_ja": "scienceはここでは学問一般の分野であり、現代の自然科学へ範囲を限定しない。"
  - "segment_id": "bc-verse-003"
    "reason_ja": "vigilanceは警戒・注意深さ。目覚ましさという賞賛語へのずれを修正。like peaseも豆を憎むこととの比較と明示し、豚の自己賛美の反語を保つ。"
  - "segment_id": "bc-verse-005"
    "reason_ja": "frigid constitutionは雌への愛情・貞潔を論じる性欲の乏しい体質。体温や冷え症の限定と読まれないよう意味を明示。"
  - "segment_id": "bc-verse-009"
    "reason_ja": "Chaplainは付属の牧師職。礼拝付きという不成立の職名を付き牧師へ修正。"
  - "segment_id": "bc-verse-011"
    "reason_ja": "exciseは注3の葡萄酒・煙草へ課す物品税。現代日本の一般消費税と混同しない表記に統一。"
  - "segment_id": "bc-verse-012"
    "reason_ja": "fleeceは賭博で金を搾り取ること。身体の毛を文字どおり剝ぐ動作という誤読を除き、金銭を奪う比喩を保つ。"
  - "segment_id": "bc-verse-013"
    "reason_ja": "fields Elysianのギリシア神話の地名を、一般的な極楽へ置き換えずに保持。"
  - "segment_id": "bc-note-003"
    "reason_ja": "詩本体のexciseと同じ物品税へ統一。年・日付・二か月延期・署名は不変。"
  "source_extraction_ja": "詩preの共通左余白5字のみ除去し、残る字下げ・各行・参照番号を保持。散文と底本注の折り返しは空白へ統合。元HTMLのXPathと開始・終了行、作品内の連続順を記録。"
  "source_note_authorship_ja": "W. E. B.署名は編者Browningへ帰属。F.署名と無署名の注は人物を推測せずunknownとし、原署名を保持。"

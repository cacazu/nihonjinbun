- "id": "bc-verse-003"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |2-
      The Swine with contrite heart allow'd,
    His shape and beauty made him proud:
    In diet was perhaps too nice,
    But gluttony was ne'er his vice:
    In every turn of life content,
    And meekly took what fortune sent:
    Inquire through all the parish round,
    A better neighbour ne'er was found;
    His vigilance might some displease;
    'Tis true, he hated sloth like pease.
  "translation_ja": |2-
      豚は、悔い改めた心で認めた、
    自分の姿と美しさが、自分を高慢にしたと。
    食べ物には、少々うるさすぎたかもしれぬが、
    大食いは、決して自分の悪徳ではなかった。
    人生の、どんな移り変わりにも満足し、
    運命のくれるものを、従順に受け取った。
    教区の周りを、残らず尋ねてもらいたい、
    もっとよい隣人は、決して見つからぬはず。
    その用心深さを、嫌がる者はいるかもしれぬ、
    確かに、豆を憎むのと同じほど、怠惰を憎んだ。
  "translation_status": "reviewed"

- "id": "bc-verse-013"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |2-
      I own the moral not exact,
    Besides, the tale is false, in fact;
    And so absurd, that could I raise up,
    From fields Elysian, fabling Æsop,
    I would accuse him to his face,
    For libelling the four-foot race.
    Creatures of every kind but ours
    Well comprehend their natural powers,
    While we, whom reason ought to sway,
    Mistake our talents every day.
    The Ass was never known so stupid,
    To act the part of Tray or Cupid;
    Nor leaps upon his master's lap,
    There to be stroked, and fed with pap,
    As Æsop would the world persuade;
    He better understands his trade:
    Nor comes whene'er his lady whistles,
    But carries loads, and feeds on thistles.
    Our author's meaning, I presume, is
    A creature bipes et implumis;
    Wherein the moralist design'd
    A compliment on human kind;
    For here he owns, that now and then
    Beasts may degenerate into men.[4]
  "translation_ja": |2-
      この教訓は、正確ではないと認めよう、
    それに、話は、事実として偽りである。
    あまりに馬鹿げているので、もし呼び戻せるなら、
    エリュシオンの野から、寓話のイソップを、
    その面前で、告発してやろう、
    四足の種族を、誹謗した罪で。
    我々以外の、どんな種類の生き物も、
    自分の生まれつきの力を、よく心得ている。
    それなのに、理性に従うべき我々は、
    毎日、自分の才能を取り違える。
    驢馬が、こんなに愚かだった例はない、
    トレイやキューピッドの役を、演じようとしたり、
    主人の膝に、跳び乗って、
    撫でられ、粥を食わせてもらおうとしたり。
    イソップは、世間に、そう信じさせようとするが、
    驢馬は、自分の仕事を、もっとよく知っている。
    女主人が笛を鳴らすたび、来るのでもなく、
    荷物を運び、薊を食べるのである。
    我が著者の言いたいものは、思うに、
    bipes et implumis、二足で羽のない生き物。
    そこで、この道徳家は、人類への、
    お世辞を、意図していたのだ。
    というのも、ここで認めているからである、ときには、
    獣も堕落して、人間になりうると。[4]
  "translation_status": "reviewed"

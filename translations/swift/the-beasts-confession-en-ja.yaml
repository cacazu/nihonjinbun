- "id": "bc-verse-008"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |2-
      The cringing knave, who seeks a place
    Without success, thus tells his case:
    Why should he longer mince the matter?
    He fail'd, because he could not flatter;
    He had not learn'd to turn his coat,
    Nor for a party give his vote:
    His crime he quickly understood;
    Too zealous for the nation's good:
    He found the ministers resent it,
    Yet could not for his heart repent it.
  "translation_ja": |2-
      地位を求めて、首尾の上がらぬ、
    卑屈な悪党は、こう身の上を語る。
    もう、どうして、言葉を濁していようか、
    お世辞を言えなかった、それが失敗の理由なのだ。
    風向きで上着を替えるすべも、
    一党派のために票を投じるすべも、習わなかった。
    自分の罪は、すぐにわかった、
    国の利益に、熱心すぎたのである。
    大臣たちが、それを不快に思うとわかったが、
    どうしても、心から悔いることは、できなかった。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"

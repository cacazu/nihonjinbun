- "id": "christianity-003"
  "section_id": "body"
  "kind": "paragraph"
  "source_text": |-
    This perhaps may appear too great a paradox even for our wise and paxodoxical age to endure; therefore I shall handle it with all tenderness, and with the utmost deference to that great and profound majority which is of another sentiment.
  "translation_ja": |-
    これでは、賢明で逆説を好む我々の時代にさえ、耐えられぬほど甚だしい逆説と思われるかもしれない。したがって私は、できる限り穏やかに、別の考えを持つ、あの偉大で深遠な多数派へ、この上ない敬意を払いながら、これを扱うことにしよう。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[249]"
    "line_start": 3653
    "source_sequence": 3
  "origin": "source"
  "source_languages":
  - "en"
  "source_variants":
  - "kind": "comparison"
    "text": "paradoxical"
    "source_locations":

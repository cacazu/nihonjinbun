- "id": "shower-note-2"
  "section_id": "source-notes"
  "kind": "note_body"
  "origin": "source"
  "source_text": |-
    [Footnote 2: "Aches" is two syllables, but modern printers, who had lost
    the right pronunciation, have aches as one syllable; and then to
    complete the metre have foisted in "aches will throb." Thus, what the
    poet and the linguist wish to preserve, is altered and finally lost. See
    Disraeli's "Curiosities of Literature," vol. i, title "Errata," p. 81,
    edit. 1858. A good example occurs in "Hudibras," Part III, canto 2, line
    407, where persons are mentioned who
      "Can by their Pangs and Aches find
      All turns and changes of the wind."—W. E. B.]
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[92]"
    "line_start": 4817
  "translation_ja": |-
    [2] 「aches」は二音節だが、正しい発音を忘れた近代の印刷業者は、一音節の「aches」として扱い、韻律を整えるため、「aches will throb」という語句を勝手に差し込んだ。こうして、詩人と言語学者が残そうと望むものが、変えられ、ついには失われる。ディズレーリ『文学の珍聞』第一巻「誤植」の項、一八五八年版八一頁を参照。よい例が、『ヒューディブラス』第三部第二歌第四〇七行にある。そこでは、こういう人々が述べられている。
    「苦痛や痛みによって、
    風のあらゆる向きや変化を、知ることができる。」――W・E・B。

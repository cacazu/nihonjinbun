  "translation_ja": |-
    注意深く観察する者なら、時刻を予告できる、
    確かな前兆によって、にわか雨を恐れるべき時を。
    雨が迫ると、猫は物思わしげに、
    ふざけるのをやめ、自分の尾も追わなくなる。
    夜、家へ帰れば、汚水だめが、
    うんざりした鼻を、倍の悪臭で襲うだろう。
    賢いなら、遠くまで食事に行くな、
    葡萄酒代を浮かせるより、馬車代のほうが高くつく。
    疼く魚の目は、にわか雨の前触れ、
    古い痛みも[2]ずきずきし、虫歯は激しく疼く。
    コーヒーハウスには、ダルマンが、ぶらぶらしている。
    気候に悪態をつき、憂鬱を訴える。
    その間に南風が、濡れた翼をもたげ、
    真っ黒な雲を、大空へ投げ放つ。
    雲は、入り切らぬほど、たっぷり酒をあおり、
    酔っ払いのように、また吐き出す。
    てきぱきしたスーザンは、綱から洗濯物をさらい取る、
    最初の細かな雨が、斜めに吹きつけるなか。
    がさつな女が、モップを振って、
    こちらへ散らす水も、こんなもの、ただし、もっと汚い。
    お前は逃げ、神々に祈り、やがて振り向いて、立ち止まり、
    悪態をつく。女は歌いながら、なおモップを回す。
    埃は、まだ、不利な戦いから退かず、
    風に助けられ、生き残ろうと、なお戦った。
    突風に、敵ともども巻き上げられ、
    どちらが雨で、どちらが埃か、見分けがつかなかった。[3]
    ああ、貧しい詩人は、どこへ助けを求めればよい、
    埃と雨が、同時に上着へ攻め込むときには？
    たった一枚の上着よ！[4]　そこでは、雨で固まった埃が、
    毛羽を逆立て、曇った染みを残す！
    いまや、しずくは途切れず、洪水となって降り注ぎ、
    滅びを定められた町を、大水で脅かしている。
    泥はねだらけの女たちは、群れをなして店へ逃げ、
    品物の値をまけさせるふりをして、何も買わぬ。
    テンプル法学院の洒落者は、どの雨樋からも、水が流れ出すなか、
    晴れるまで待ちながら、辻馬車を呼ぶふりをする。
    裾をたくし上げた針子は、足早に歩き、
    油を引いた傘の周りには、水が流れ落ちる。
    ここでは、さまざまな運命に導かれた、さまざまな者が、
    雨よけの下で、知り合いになる。
    勝ち誇るトーリーも、落胆するホイッグも、[5]
    反目を忘れ、かつらを守るために手を結ぶ。
    箱のような輿に収まった伊達男は、いらいら座り、
    ときおり、雨樋の水が、屋根を、がたがた打つ。
    折々、恐ろしい音を立てて、
    革張りが鳴り、中の男は震える。
    トロイの担ぎ手たちが、木馬を運んだときも、そうだった、
    早く外へ出たくてたまらぬギリシア人を、腹にはらんで、
    あの、ごろつきのギリシア人どもは、今の連中と同じく、
    担ぎ手に金を払わず、その体を突き通したのだったが、
    ラオコーンが[6]、外から槍で打つと、
    閉じ込められた英雄は、皆、恐れに震えた。

    "line_start": 4805
  "translation_ja": |-
    いま、あちこちから、増水した側溝が流れ出し、
    戦利品を携えて、進んでゆく。
    あらゆる色と臭いの汚物が、見た目と臭いで、
    どの通りから流れてきたか、告げるようだ。
    それぞれの激流に、勢いよく押し流され、
    スミスフィールドから、セント・パルカーズへ向かい、
    スノーヒルの高まりで、巨大な流れに合わさり、
    導水路から、ホルボーン橋へ、まっ逆さまに落ちる。[7]
    屠畜屋の店からさらわれた、糞、腸、血、
    溺れた子犬、臭う小鰊、どれも泥まみれ、
    死んだ猫に、蕪の葉が、洪水を転げ落ちる。

- "id": "ps-verse-001"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    The life of man to represent,
      And turn it all to ridicule,
    Wit did a puppet-show invent,
      Where the chief actor is a fool.
  "translation_ja": |-
    人の一生を映し出し、
      そのすべてを笑いものにしようと、
    才知は人形芝居を発明した、
      主役を務めるのは愚か者。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9097
    "line_end": 9100
    "source_sequence": 1
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-002"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    The gods of old were logs of wood,
      And worship was to puppets paid;
    In antic dress the idol stood,
      And priest and people bow'd the head.
  "translation_ja": |-
    昔の神々は木の丸太、
      人形に礼拝が捧げられた。
    奇妙な衣装で偶像は立ち、
      神官も民も頭を垂れた。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9102
    "line_end": 9105
    "source_sequence": 2
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-003"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    No wonder then, if art began
      The simple votaries to frame,
    To shape in timber foolish man,
      And consecrate the block to fame.
  "translation_ja": |-
    だから、細工の技が始めたとしても不思議はない、
      あの無邪気な信者を作ることを。
    愚かな人間を材木で形作り、
      木の塊を名声のために聖別することを。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9107
    "line_end": 9110
    "source_sequence": 3
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-004"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    From hence poetic fancy learn'd
      That trees might rise from human forms;
    The body to a trunk be turn'd,
      And branches issue from the arms.
  "translation_ja": |-
    ここから詩人の空想は学んだ、
      人の姿から木々が生え出てもよいのだと。
    胴体は幹に変わり、
      腕から枝が伸び出すのだと。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9112
    "line_end": 9115
    "source_sequence": 4
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-005"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Thus Dædalus and Ovid too,
      That man's a blockhead, have confest:
    Powel and Stretch[1] the hint pursue;
      Life is a farce, the world a jest.
  "translation_ja": |-
    かくして、ダイダロスもオウィディウスも、
      人間は木偶の坊だと認めた。
    パウエルとストレッチ[1]は、その暗示を受け継ぐ。
      人生は茶番、この世は冗談なのだ。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9117
    "line_end": 9120
    "source_sequence": 5
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-006"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    The same great truth South Sea has proved
      On that famed theatre, the alley;
    Where thousands, by directors moved
      Are now sad monuments of folly.
  "translation_ja": |-
    同じ偉大な真実を、南海会社も証明した、
      かの名高い舞台、あの取引小路で。
    取締役に動かされた幾千人もが、
      いまでは愚かさの、悲しい記念碑なのだから。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9122
    "line_end": 9125
    "source_sequence": 6
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-007"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    What Momus was of old to Jove,
      The same a Harlequin is now;
    The former was buffoon above,
      The latter is a Punch below.
  "translation_ja": |-
    昔、ユピテルに対するモモスだったもの、
      いまのアルルカンも同じこと。
    前者は天上の道化であり、
      後者は地上のパンチである。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9127
    "line_end": 9130
    "source_sequence": 7
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-008"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    This fleeting scene is but a stage,
      Where various images appear;
    In different parts of youth and age,
      Alike the prince and peasant share.
  "translation_ja": |-
    この移ろう景色は、ただの舞台、
      さまざまな像が姿を見せる。
    若い役も、老いた役も、
      君主も農夫も、等しく分け持つ。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9132
    "line_end": 9135
    "source_sequence": 8
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-009"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Some draw our eyes by being great,
      False pomp conceals mere wood within;
    And legislators ranged in state
      Are oft but wisdom in machine.
  "translation_ja": |-
    偉いというだけで、我々の目を引く者もいる、
      偽りの威儀が、中のただの木を隠す。
    そして、いかめしく居並ぶ立法者も、
      しばしば、機械仕掛けの知恵にすぎぬ。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9137
    "line_end": 9140
    "source_sequence": 9
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-010"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    A stock may chance to wear a crown,
      And timber as a lord take place;
    A statue may put on a frown,
      And cheat us with a thinking face.
  "translation_ja": |-
    木の塊が、王冠をかぶることもあり、
      材木が、貴族として席を占めもする。
    彫像がしかめ面を装い、
      考えているような顔で、我々を欺きもする。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9142
    "line_end": 9145
    "source_sequence": 10
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-011"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Others are blindly led away,
      And made to act for ends unknown;
    By the mere spring of wires they play,
      And speak in language not their own.
  "translation_ja": |-
    ほかの者は、わけもわからず引かれるまま、
      知りもしない目的のために動かされる。
    ただ針金の仕掛けで演じ、
      自分のものではない言葉で話す。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9147
    "line_end": 9150
    "source_sequence": 11
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-012"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Too oft, alas! a scolding wife
      Usurps a jolly fellow's throne;
    And many drink the cup of life,
      Mix'd and embitter'd by a Joan.
  "translation_ja": |-
    ああ、あまりにもよくあるのは、口やかましい妻が、
      陽気な男の王座を奪うこと。
    多くの者が、ジョーンの混ぜ物で苦くなった、
      人生の杯を飲むのである。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9152
    "line_end": 9155
    "source_sequence": 12
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-013"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    In short, whatever men pursue,
      Of pleasure, folly, war, or love:
    This mimic race brings all to view:
      Alike they dress, they talk, they move.
  "translation_ja": |-
    要するに、人々が追い求めるものなら何でも、
      快楽も、愚行も、戦争も、恋も、
    この物真似の種族が、すべて見せてくれる。
      同じように着て、話して、動くのだ。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9157
    "line_end": 9160
    "source_sequence": 13
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-014"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Go on, great Stretch, with artful hand,
      Mortals to please and to deride;
    And, when death breaks thy vital band,
      Thou shalt put on a puppet's pride.
  "translation_ja": |-
    進め、偉大なストレッチよ、巧みな手で、
      人間どもを楽しませ、嘲るために。
    死がお前の命の絆を断つときには、
      人形の晴れ姿をまとうだろう。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9162
    "line_end": 9165
    "source_sequence": 14
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-015"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Thou shalt in puny wood be shown,
      Thy image shall preserve thy fame;
    Ages to come thy worth shall own,
      Point at thy limbs, and tell thy name.
  "translation_ja": |-
    お前は、ちっぽけな木の姿で見せられ、
      その像が、お前の名声を保つだろう。
    来たる世々は、お前の値打ちを認め、
      手足を指差し、その名を語るだろう。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9167
    "line_end": 9170
    "source_sequence": 15
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-016"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Tell Tom,[2] he draws a farce in vain,
      Before he looks in nature's glass;
    Puns cannot form a witty scene,
      Nor pedantry for humour pass.
  "translation_ja": |-
    トム[2]には言え、茶番を書いても無駄だと、
      自然の鏡を覗き込まぬうちは。
    駄洒落では、気の利いた場面は作れず、
      学者気取りは、ユーモアでは通らない。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9172
    "line_end": 9175
    "source_sequence": 16
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-017"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    To make men act as senseless wood,
      And chatter in a mystic strain,
    Is a mere force on flesh and blood,
      And shows some error in the brain.
  "translation_ja": |-
    人を、感覚のない木のように動かし、
      わけのわからぬ調子で、しゃべらせるのは、
    生身の人間に対する、ただの無理強いであり、
      頭のどこかの間違いを示している。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-14353"
    "precision": "block"
    "url": "https://www.gutenberg.org/cache/epub/14353/pg14353-images.html"
    "xpath": "/html/body/pre[184]"
    "line_start": 9177
    "line_end": 9180
    "source_sequence": 17
  "origin": "source"
  "source_languages":
  - "en"
- "id": "ps-verse-018"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    He that would thus refine on thee,
      And turn thy stage into a school,
    The jest of Punch will ever be,
      And stand confest the greater fool.
  "translation_ja": |-
    こうして、お前より上を行こうとして、
      お前の舞台を学校に変えたがる者は、
    いつまでも、パンチの笑い種になり、
      もっとひどい愚か者だと、白日のもとに立つだろう。
  "translation_status": "reviewed"
  "source_locations":

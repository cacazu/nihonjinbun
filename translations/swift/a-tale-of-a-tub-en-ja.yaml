  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The old Sclavonian proverb said well that it is with men as with asses; whoever would keep them fast must find a very good hold at their ears. Yet I think we may affirm, and it hath been verified by repeated experience, that—"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 255
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[236]"
  "translation_ja": "古いスラヴの諺は、うまく言った。人間も驢馬と同じで、しっかりつないでおきたければ、耳をよほどよくつかまねばならない。しかし、こう断言してよいと思うし、繰り返す経験によっても確かめられている。"
  "translation_status": "reviewed"
- "id": "tub-section-11-024"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "“Effugiet tamen hæc sceleratus vincula Proteus.” [151a]"
  "source_languages":

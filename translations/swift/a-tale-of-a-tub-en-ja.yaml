    "xpath": "/html[1]/body[1]/p[45]"
  "translation_ja": "それまでの間、あらゆる学芸と学問の総体から忠実に抜き出した摘要を、ここにあえて殿下へお捧げいたします。もっぱら殿下のお役に立ち、御教育に資するためのものです。ほかの若い君主たちが、近年その学問の助けとして書かれた多数の書物を用いてなさったのと同じほど丁寧に、殿下もこれをお読みになり、同じほど大いなる進歩を遂げられることを、私は少しも疑いません。"

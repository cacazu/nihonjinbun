    "xpath": "/html[1]/body[1]/blockquote[4]/p[1]"
  "translation_ja": "「すべての市長、州長官、獄吏、警吏、執行吏、絞首刑執行人、その他へ。われわれは、A・Bなる者が、死刑の宣告を受け、汝ら、または汝らのいずれかの手中にあるとの報を得た。よって、これを見次第、その囚人を自宅へ帰らせることを望み、かつ命じる。罪名が殺人、男色、強姦、涜聖、近親相姦、反逆、冒涜、その他のいずれであれ、本書をもって十分の許可とせよ。もし背けば、汝と汝の一族を、神が永遠に罰したもうように。それでは、心よりさらば。汝の最もつつましき僕の僕、"

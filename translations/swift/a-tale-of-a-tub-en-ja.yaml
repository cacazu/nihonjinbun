  "translation_ja": "信じやすさが、好奇心より穏やかな心の財産であるのと同じ割合で、表面を相手にする知恵は、物事の奥へ入り、やがて重々しく戻ってきて、中身は何の役にも立たないと、報告や発見を述べる、あの哲学もどきに勝る。あらゆる物が、最初に訴える二つの感覚は、視覚と触覚である。これらは、色、形、大きさ、その他、物体の外側にあるか、技巧によってそこへ描かれた性質以上には、決して調べない。そこへ理性が、お節介にも、切り、開き、刻み、穿つ道具を持って現れ、最後まで同じ中身ではないと、証明してみせようと申し出る。私は、これをすべて、自然を歪める究極の仕業と考える。自然の永遠の法の一つは、最上の家具を前へ出しておくことだからだ。そこで、今後、こうした高価な解剖の費用を節約するため、読者に知らせておこう。このような結論では、理性は確かに正しい。私の知る物体の大半は、内側より外側のほうが、無限に好ましい。近頃の実験で、私はさらに確信を深めた。先週、皮を剝がれた女を見た。その姿が、どれほど悪く変わったか、信じていただきにくいほどだ。昨日は、伊達男の死体を、目の前で裸にさせた。すると一同、一そろいの衣服の下から、思いもよらぬ欠点が、これほど多く現れたことに驚いた。次に、脳、心臓、脾臓を切り開いたが、処置のたびに、進めば進むほど、欠陥が、数も大きさも増すのが、はっきりわかった。以上から、私は正当に、自分のため、こう結論した。自然の傷や不完全さを、つぎはぎして塞ぐ技を発見できる哲学者、あるいは計画屋は、今これほど尊ばれている、傷を広げ、さらす技より、人類に大いに功をなし、もっと有益な学問を教えるだろう。解剖を医学の究極の目的と考えた、あの人のような技よりも。そして、運と性向によって、この高貴な技の実りを楽しめる、都合のよい位置に置かれた者は、エピクロスとともに、物の表面から感覚へ飛んでくる薄膜と映像で、自分の観念を満足させられるなら、真に賢い人なのである。自然の上澄みのクリームをすくい、酸っぱいものと滓は、哲学と理性に舐めさせておく。この崇高で洗練された幸福の境地こそ、「うまく騙されている状態を保つこと」、悪党たちの間で愚か者でいる、澄んだ穏やかな状態なのだ。"
  "translation_status": "reviewed"
- "id": "tub-section-09-013"
  "section_id": "section-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But to return to madness. It is certain that, according to the system I have above deduced, every species thereof proceeds from a redundancy of vapour; therefore, as some kinds of frenzy give double strength to the sinews, so there are of other species which add vigour, and life, and spirit to the brain. Now it usually happens that these active spirits, getting possession of the brain, resemble those that haunt other waste and empty dwellings, which for want of business either vanish and carry away a piece of the house, or else stay at home and fling it all out of the windows. By which are mystically displayed the two principal branches of madness, and which some philosophers, not considering so well as I, have mistook to be different in their causes, over-hastily assigning the first to deficiency and the other to redundance."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 219
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[202]"
  "translation_ja": "だが、狂気へ戻ろう。先に導き出した体系によれば、そのあらゆる種類は、蒸気の過剰から生じることが確かである。だから、ある種の錯乱が筋に倍の力を与えるように、別の種類は、脳へ勢い、命、霊を加える。さて、これらの活発な霊が脳を占領すると、ふつう、ほかの荒れた空き家に取りつく霊と同じようになる。仕事がないので、消え去って家の一部を持ち逃げするか、家に居座り、何もかも窓から放り出すか、どちらかだ。これによって、狂気の二大部門が神秘的に示される。私ほどよく考えなかった、ある哲学者たちは、その原因が違うと誤解し、性急にも、第一を不足、第二を過剰に割り当ててしまったのである。"
  "translation_status": "reviewed"
- "id": "tub-section-09-014"
  "section_id": "section-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I think it therefore manifest, from what I have here advanced, that the main point of skill and address is to furnish employment for this redundancy of vapour, and prudently to adjust the seasons of it, by which means it may certainly become of cardinal and catholic emolument in a commonwealth. Thus one man, choosing a proper juncture, leaps into a gulf, from thence proceeds a hero, and is called the saviour of his country. Another achieves the same enterprise, but unluckily timing it, has left the brand of madness fixed as a reproach upon his memory. Upon so nice a distinction are we taught to repeat the name of Curtius with reverence and love, that of Empedocles with hatred and contempt. Thus also it is usually conceived that the elder Brutus only personated the fool and madman for the good of the public; but this was nothing else than a redundancy of the same vapour long misapplied, called by the Latins ingenium par negotiis, or (to translate it as nearly as I can), a sort of frenzy never in its right element till you take it up in business of the state."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 220
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[203]"
  "translation_ja": "ゆえに、ここで述べてきたことから、腕前と手際の要は、この余分な蒸気に仕事を与え、その時機を賢く調整することだと、明らかになったと思う。そうすれば、国家にとって、確かに根本的で、普遍的な利益となりうる。たとえば、ある男は適切な時を選んで淵へ飛び込み、そこから英雄となり、祖国の救い主と呼ばれる。別の男は同じ事業を果たすが、不幸にも時機を誤り、その記憶に、狂気の烙印を、そしりとして残す。この繊細な区別によって、われわれは、クルティウスの名を敬意と愛で、エンペドクレスの名を憎しみと軽蔑で、繰り返すよう教わる。また、大ブルトゥスは、公共の利益のためにだけ、愚か者と狂人を装ったと、ふつう考えられている。しかし、それは同じ蒸気の過剰が、長く誤用されていたにすぎない。ラテン語で「仕事にふさわしい才」、できるだけ近く訳せば、国家の仕事へ使うまでは、自分にふさわしい場所にいられない、一種の錯乱なのである。"
  "translation_status": "reviewed"
- "id": "tub-section-09-015"
  "section_id": "section-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Upon all which, and many other reasons of equal weight, though not equally curious, I do here gladly embrace an opportunity I have long sought for, of recommending it as a very noble undertaking to Sir Edward Seymour, Sir Christopher Musgrave, Sir John Bowles, John Howe, Esq., and other patriots concerned, that they would move for leave to bring in a Bill for appointing commissioners to inspect into Bedlam and the parts adjacent, who shall be empowered to send for persons, papers, and records, to examine into the merits and qualifications of every student and professor, to observe with utmost exactness their several dispositions and behaviour, by which means, duly distinguishing and adapting their talents, they might produce admirable instruments for the several offices in a state, . . . civil and military, proceeding in such methods as I shall here humbly propose. And I hope the gentle reader will give some allowance to my great solicitudes in this important affair, upon account of that high esteem I have ever borne that honourable society, whereof I had some time the happiness to be an unworthy member."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 221
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[204]"
  "translation_ja": "以上と、それに劣らず重いが、同じほど珍しくはない、ほかの多くの理由に基づき、長く探していた機会を、私はここで喜んでつかむ。エドワード・シーモア卿、クリストファー・マスグレイヴ卿、ジョン・ボウルズ卿、ジョン・ハウ殿、その他、関係する愛国者の方々へ、たいそう高貴な事業として提案したい。ベドラムと近隣を調査する委員を任命する法案の提出許可を、動議として求めていただきたいのである。委員には、人、書類、記録を取り寄せ、あらゆる学生と教授の功績と資格を調べ、それぞれの性向と行動を、最大限の正確さで観察する権限を与える。そうして、才能をきちんと見分け、適応させれば、国家のさまざまな職務……文官の職も、武官の職も……に、立派に役立つ人材を作れるだろう。方法は、これから私が、つつましく提案するとおりに進めればよい。優しい読者には、この重大事に対する私の大いなる心配も、いくらかお許しいただきたい。私は昔から、この名誉ある団体を高く尊び、かつて一時、そのふさわしからぬ一員となる幸福にも、あずかったのである。"
  "translation_status": "reviewed"
- "id": "tub-section-09-016"
  "section_id": "section-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Is any student tearing his straw in piecemeal, swearing and blaspheming, biting his grate, foaming at the mouth, and emptying his vessel in the spectators’ faces? Let the right worshipful the Commissioners of Inspection give him a regiment of dragoons, and send him into Flanders among the rest. Is another eternally talking, sputtering, gaping, bawling, in a sound without period or article? What wonderful talents are here mislaid! Let him be furnished immediately with a green bag and papers, and threepence in his pocket [135], and away with him to Westminster Hall. You will find a third gravely taking the dimensions of his kennel, a person of foresight and insight, though kept quite in the dark; for why, like Moses, Ecce cornuta erat ejus facies. He walks duly in one pace, entreats your penny with due gravity and ceremony, talks much of hard times, and taxes, and the whore of Babylon, bars up the wooden of his cell constantly at eight o’clock, dreams of fire, and shoplifters, and court-customers, and privileged places. Now what a figure would all these acquirements amount to if the owner were sent into the City among his brethren! Behold a fourth in much and deep conversation with himself, biting his thumbs at proper junctures, his countenance chequered with business and design; sometimes walking very fast, with his eyes nailed to a paper that he holds in his hands; a great saver of time, somewhat thick of hearing, very short of sight, but more of memory; a man ever in haste, a great hatcher and breeder of business, and excellent at the famous art of whispering nothing; a huge idolator of monosyllables and procrastination, so ready to give his word to everybody that he never keeps it; one that has forgot the common meaning of words, but an admirable retainer of the sound; extremely subject to the looseness, for his occasions are perpetually calling him away. If you approach his grate in his familiar intervals, “Sir,” says he, “give me a penny and I’ll sing you a song; but give me the penny first” (hence comes the common saying and commoner practice of parting with money for a song). What a complete system of court-skill is here described in every branch of it, and all utterly lost with wrong application! Accost the hole of another kennel, first stopping your nose, you will behold a surly, gloomy, nasty, slovenly mortal, raking in his own dung and dabbling in his urine. The best part of his diet is the reversion of his own ordure, which expiring into steams, whirls perpetually about, and at last reinfunds. His complexion is of a dirty yellow, with a thin scattered beard, exactly agreeable to that of his diet upon its first declination, like other insects, who, having their birth and education in an excrement, from thence borrow their colour and their smell. The student of this apartment is very sparing of his words, but somewhat over-liberal of his breath. He holds his hand out ready to receive your penny, and immediately upon receipt withdraws to his former occupations. Now is it not amazing to think the society of Warwick Lane [136] should have no more concern for the recovery of so useful a member, who, if one may judge from these appearances, would become the greatest ornament to that illustrious body? Another student struts up fiercely to your teeth, puffing with his lips, half squeezing out his eyes, and very graciously holds out his hand to kiss. The keeper desires you not to be afraid of this professor, for he will do you no hurt; to him alone is allowed the liberty of the ante-chamber, and the orator of the place gives you to understand that this solemn person is a tailor run mad with pride. This considerable student is adorned with many other qualities, upon which at present I shall not further enlarge. . . . Hark in your ear. . . . I am strangely mistaken if all his address, his motions, and his airs would not then be very natural and in their proper element."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 222
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[205]"
  "translation_ja": "藁を細々と引き裂き、悪態をつき、神を冒涜し、鉄格子へ噛みつき、口から泡を吹き、見物人の顔へ便器を空ける学生がいるか。尊敬すべき調査委員の諸卿よ、その者に竜騎兵の連隊を与え、ほかの者とともに、フランドルへ送ればよい。別の者は、絶えずしゃべり、唾を飛ばし、口を開け、区切りもつながりもない音で、わめいているか。なんと驚くべき才能が、置き場所を誤っていることか！　ただちに、緑の袋と書類、懐へ三ペンスを与え[135]、ウェストミンスター・ホールへ送り出すがよい。第三の者は、自分の犬小屋の寸法を、重々しく測っているだろう。まるきり暗闇に置かれながら、先を見る目と、内を見抜く目を持つ男である。なぜなら、モーセのように、「見よ、その顔には角があった」からだ。きまった歩調で歩き、しかるべき重々しさと礼儀をもって、あなたの一ペニーを乞う。苦しい時世、税、バビロンの淫婦について多くを語り、いつも八時になると、房の木戸に閂をかけ、火事、万引き、宮廷の客、特権区域を夢見る。さて、これらの素養の持ち主を、シティの仲間の中へ送れば、どれほど立派な姿になるだろう！　第四の者を見よ。自分とたっぷり深く話し込み、要所で親指を噛み、顔には仕事と企みの模様が浮かぶ。ときには、手の中の紙に目を釘づけにし、とても速く歩く。時間をたいそう節約し、少し耳が遠く、目はたいそう近眼で、記憶はそれより短い。いつも急ぎ、仕事を大いに孵し、殖やし、何もないことを囁く、あの有名な技に優れている。ひと言の返事と引き延ばしを、ひたすら崇拝し、誰にでもあまりにすぐ約束するので、決して守らない。言葉の普通の意味は忘れたが、音は見事に覚えている。ひどく下り腹で、用事が絶えず彼を呼び去るからである。親しみやすい合間に鉄格子へ近づくと、「旦那」と言う。「一ペニーくれれば、歌を歌いましょう。ただし、一ペニーを先に。」ここから、歌一つに金を手放すという、よくある言い回しと、さらによくある実践が生まれた。宮廷の技の完全な体系が、ここでは全部門にわたり描かれ、適用を誤ったため、すっかり失われているとは！　別の犬小屋の穴へ、まず鼻をつまんで近づいてみよ。無愛想で、陰気で、汚く、だらしない人間が、自分の糞を掻き回し、小便をいじっているのが見える。その食事の最上の部分は、自分の排泄物の戻りである。蒸気となって立ち昇り、絶えず渦を巻き、最後には再び注ぎ戻される。顔色は汚い黄色で、薄くまばらな髭があり、その食物が最初に下ってきたときの色に、ぴたりと合っている。排泄物の中で生まれ育ち、そこから色と匂いを借りる、ほかの虫と同じだ。この部屋の学生は、言葉をたいそう惜しむが、息は少し気前よく出しすぎる。手を出して一ペニーを待ち、受け取ると、すぐ前の仕事へ引っ込む。さて、こういう有用な一員を取り戻すことに、ウォリック・レインの団体[136]が、これほど無関心とは、驚くべきではないか。見かけから判断してよければ、その輝かしい団体の、最大の飾りとなるはずの人物なのに。さらに別の学生は、唇を膨らませ、目を半ば絞り出し、荒々しく胸を張って、すぐ鼻先までやって来る。そして、たいそう愛想よく、口づけさせるための手を差し出す。看守は、この教授を恐れるな、害はないからと言う。前室を自由に歩くことを許されているのは、この者だけである。この場所の案内弁士によれば、このもったいぶった人物は、高慢のために狂った仕立屋だという。この重んずべき学生は、ほかにも多くの資質で飾られているが、今はそれ以上、詳しく述べない。……耳を貸していただきたい。……そうなれば、その振る舞いも、動きも、気取りも、すべて、とても自然で、ふさわしい場所へ収まるだろう。そうでないなら、私はひどく見当違いをしている。"
  "translation_status": "reviewed"
- "id": "tub-section-09-017"
  "section_id": "section-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I shall not descend so minutely as to insist upon the vast number of beaux, fiddlers, poets, and politicians that the world might recover by such a reformation, but what is more material, beside the clear gain redounding to the commonwealth by so large an acquisition of persons to employ, whose talents and acquirements, if I may be so bold to affirm it, are now buried or at least misapplied. It would be a mighty advantage accruing to the public from this inquiry that all these would very much excel and arrive at great perfection in their several kinds, which I think is manifest from what I have already shown, and shall enforce by this one plain instance, that even I myself, the author of these momentous truths, am a person whose imaginations are hard-mouthed and exceedingly disposed to run away with his reason, which I have observed from long experience to be a very light rider, and easily shook off; upon which account my friends will never trust me alone without a solemn promise to vent my speculations in this or the like manner, for the universal benefit of human kind, which perhaps the gentle, courteous, and candid reader, brimful of that modern charity and tenderness usually annexed to his office, will be very hardly persuaded to believe."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 223
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[206]"
  "translation_ja": "このような改革によって、世間が取り戻せる、膨大な数の伊達男、楽師、詩人、政治家について、細々と列挙するつもりはない。もっと重要なことがある。働かせられる人々を、これほど大きく獲得して国家へ返す、明白な利益に加えて、ということである。大胆に言わせていただけば、彼らの才能と素養は、今、埋もれているか、少なくとも誤用されている。この調査から公共へ生じる大きな利点は、彼ら全員が、それぞれの分野で、たいそう優れ、大きな完成に達するだろう、という点なのだ。これはすでに示したことから明らかだと思うが、さらに、一つの明白な例で強めよう。この重大な真理の著者たる私自身も、想像力が轡を受けつけぬ馬のようで、理性を乗せたまま暴走しやすい人間である。長い経験によれば、私の理性は、たいそう軽い乗り手で、容易に振り落とされる。だから友人たちは、私が、このような方法か、それに類する方法で、人類全体の利益のため、自分の思索を吐き出すという、厳かな約束をしなければ、一人きりでは決して信用しない。優しく、親切で、公平な読者は、その役目にふつう伴う、近代の慈愛といたわりを、なみなみと満たしているだろうから、このことは、おそらく、なかなか信じてくださらないに違いない。"
  "translation_status": "reviewed"

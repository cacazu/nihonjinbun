- "id": "tub-section-02-014"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But as human happiness is of a very short duration, so in those days were human fashions, upon which it entirely depends. Shoulder-knots had their time, and we must now imagine them in their decline, for a certain lord came just from Paris with fifty yards of gold lace upon his coat, exactly trimmed after the court fashion of that month. In two days all mankind appeared closed up in bars of gold lace. Whoever durst peep abroad without his complement of gold lace was as scandalous as a —, and as ill received among the women. What should our three knights do in this momentous affair? They had sufficiently strained a point already in the affair of shoulder-knots. Upon recourse to the will, nothing appeared there but altum silentium. That of the shoulder-knots was a loose, flying, circumstantial point, but this of gold lace seemed too considerable an alteration without better warrant. It did aliquo modo essentiæ adhærere, and therefore required a positive precept. But about this time it fell out that the learned brother aforesaid had read “Aristotelis Dialectica,” and especially that wonderful piece de Interpretatione, which has the faculty of teaching its readers to find out a meaning in everything but itself, like commentators on the Revelations, who proceed prophets without understanding a syllable of the text. “Brothers,” said he, “you are to be informed that of wills, duo sunt genera, nuncupatory and scriptory, [77a] that in the scriptory will here before us there is no precept or mention about gold lace, conceditur, but si idem affirmetur de nuncupatorio negatur. For, brothers, if you remember, we heard a fellow say when we were boys that he heard my father’s man say that he heard my father say that he would advise his sons to get gold lace on their coats as soon as ever they could procure money to buy it.” “That is very true,” cries the other. “I remember it perfectly well,” said the third. And so, without more ado, they got the largest gold lace in the parish, and walked about as fine as lords."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 110
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[107]"
  "translation_ja": "しかし、人間の幸福が長続きしないように、それがまったく依存している人間の流行も、当時は短命だった。肩飾りにも盛りの時はあり、今や衰え始めたと考えていただきたい。ある貴族がちょうどパリから戻り、その月の宮廷の流行にぴたりと合わせて、上着に五十ヤードもの金モールをつけていたのである。二日もしないうちに、人類は皆、金モールの格子に囲まれた姿で現れた。規定の量の金モールなしに、あえて外へ顔を出す者は、まるで――のように不面目で、女性にもそれと同じほど嫌われた。この重大事に、三人の騎士はどうするのか。肩飾りの一件で、すでに十分、無理は通していた。遺言へ戻ってみても、そこには深い沈黙しかなかった。肩飾りは、ひらひらした、取り外しのきく、付随的な問題だったが、金モールは、もっと確かな根拠なしには、大きすぎる変更と思われた。いわば本質に付着するものなので、明文の指示が必要だった。ところがこの頃、例の物知りの兄弟は、アリストテレスの『弁証法』、とくに、あの驚くべき『命題論』を読んでいた。これは、読者に、自分自身以外のあらゆるものから意味を見つけさせる力を持つ。『黙示録』の注釈者が、本文を一音節も理解しないまま、預言者になるのと同じだ。「兄弟たち」と彼は言った。「知っておくべきことだが、遺言には二種類、口頭のものと、書面のものがある[77a]。ここにある書面の遺言には、金モールについて指示も言及もない。これは認めよう。しかし、口頭のものにも同じだと主張するなら、否である。というのも、兄弟たち、覚えているだろう。子供の頃、ある男から聞いたことがある。あの男は父の下男が言うのを聞いたそうだし、その下男は父自身から聞いたという。息子たちには、買う金ができ次第、上着へ金モールをつけるよう勧めたい、とね。」「まったくそのとおりだ」と、もう一人が叫んだ。「私もはっきり覚えている」と、三人目が言った。そこで三人は、もう面倒なことはせず、教区でいちばん大きな金モールを手に入れ、貴族のように着飾って歩き回った。"

- "id": "tub-conclusion-002"
  "section_id": "conclusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Going too long is a cause of abortion as effectual, though not so frequent, as going too short, and holds true especially in the labours of the brain. Well fare the heart of that noble Jesuit [155] who first adventured to confess in print that books must be suited to their several seasons, like dress, and diet, and diversions; and better fare our noble notion for refining upon this among other French modes. I am living fast to see the time when a book that misses its tide shall be neglected as the moon by day, or like mackerel a week after the season. No man has more nicely observed our climate than the bookseller who bought the copy of this work. He knows to a tittle what subjects will best go off in a dry year, and which it is proper to expose foremost when the weather-glass is fallen to much rain. When he had seen this treatise and consulted his almanac upon it, he gave me to understand that he had manifestly considered the two principal things, which were the bulk and the subject, and found it would never take but after a long vacation, and then only in case it should happen to be a hard year for turnips. Upon which I desired to know, considering my urgent necessities, what he thought might be acceptable this month. He looked westward and said, “I doubt we shall have a bit of bad weather. However, if you could prepare some pretty little banter (but not in verse), or a small treatise upon the it would run like wildfire. But if it hold up, I have already hired an author to write something against Dr. Bentley, which I am sure will turn to account.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 262
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[241]"
  "translation_ja": "長く身ごもりすぎることも、短すぎることと、同じほど確かな流産の原因になる。頻度は低いにせよ、脳の出産では、とくにそうだ。服装、食事、娯楽と同じく、本もそれぞれの時節に合わせねばならぬと、初めてあえて活字で認めた、高貴なイエズス会士[155]の心に、幸いあれ。そして、ほかのフランス流行とともに、この考えも磨き上げる、わが高貴な国民には、さらに幸いあれ。潮時を逃した本が、昼の月や、旬の一週間後の鯖と同じほど見捨てられる時代を、私は足早に生きて、見届けようとしている。この作品の原稿を買った書店主ほど、わが国の気候を細かく観察した者はいない。乾いた年には、どんな題目が最もよく売れ、気圧計が大雨まで下がったときには、何をいちばん目につく所へ出すべきか、寸分違わず知っている。この論考を見て、暦に照らすと、主な二点、すなわち分量と主題を、明確に考慮したと、私へ告げた。そして、長い休暇の後でしか人気は出ず、それも、蕪が不作の年でなければだめだ、とわかったという。そこで私は、差し迫った窮状を考えてもらい、今月なら何が受けると思うか、尋ねた。彼は西を見て言った。「どうも、少し天気が崩れそうです。しかし、ちょっとした気の利いたからかいを――詩ではなく――用意できるなら、あるいは、……についての短い論考なら、野火のように売れるでしょう。ただ、晴れが続くなら、ベントリー博士を攻撃するものを書かせるため、すでに一人、著者を雇ってあります。これは確かに、利益になると見ています。」"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "comparison"
    "text": "and better fare our noble nation, for refining upon this among other French modes; a small treatise upon the —— it would run like wildfire"
    "source_locations":

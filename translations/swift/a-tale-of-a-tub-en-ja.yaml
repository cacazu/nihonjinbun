      "precision": "work"
      "url": "https://celt.ucc.ie/published/E700001-013.html"
    "description_ja": "底本の notion は比較本文の nation により「国民」と訳す。また底本の upon the it would の間は、比較本文にある話題を伏せるダッシュを省略記号として訳し、内容を補わない。底本の翻刻はsource_textに保持。"
- "id": "tub-conclusion-003"
  "section_id": "conclusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "At length we agreed upon this expedient, that when a customer comes for one of these, and desires in confidence to know the author, he will tell him very privately as a friend, naming whichever of the wits shall happen to be that week in the vogue, and if Durfey’s last play should be in course, I had as lieve he may be the person as Congreve. This I mention, because I am wonderfully well acquainted with the present relish of courteous readers, and have often observed, with singular pleasure, that a fly driven from a honey-pot will immediately, with very good appetite, alight and finish his meal on an excrement."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 263
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[242]"
  "translation_ja": "とうとう、次の便法で話がまとまった。客がこれらの作品の一つを求め、内々に著者を知りたいと言ったら、書店主は、友人として、ごくひそかに教えることにする。その週、たまたま評判になっている才人の誰かを、名指すのだ。ダーフィーの最新作が順番に来ているなら、私としては、コングリーヴでも彼でも、どちらでもかまわない。こう申し上げるのは、親切な読者たちの今の味覚を、私は驚くほどよく知っているからだ。そして、蜂蜜の壺から追われた蠅が、すぐさま、たいそうよい食欲で、糞の上へ降り、食事を終えるのを、格別の喜びをもって、たびたび観察してきたからである。"
  "translation_status": "reviewed"
- "id": "tub-conclusion-004"
  "section_id": "conclusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have one word to say upon the subject of profound writers, who are grown very numerous of late, and I know very well the judicious world is resolved to list me in that number. I conceive, therefore, as to the business of being profound, that it is with writers as with wells. A person with good eyes can see to the bottom of the deepest, provided any water be there; and that often when there is nothing in the world at the bottom besides dryness and dirt, though it be but a yard and half under ground, it shall pass, however, for wondrous deep, upon no wiser a reason than because it is wondrous dark."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 264
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[243]"
  "translation_ja": "近頃たいそう数の増えた、深遠な著者たちについて、一言だけ申し上げたい。分別ある世間が、私もその一人へ数えるつもりなのは、よくわかっている。そこで、深遠であるということについては、著者も井戸と同じだと考える。目のよい人なら、水さえあれば、最も深い井戸の底も見える。ところが、底に乾いた土と泥以外、何もなければ、地下わずか一ヤード半でも、驚くほど深いとされることが、よくある。驚くほど暗いから、という以上に賢い理由は、何もないのである。"
  "translation_status": "reviewed"
- "id": "tub-conclusion-005"
  "section_id": "conclusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am now trying an experiment very frequent among modern authors, which is to write upon nothing, when the subject is utterly exhausted to let the pen still move on; by some called the ghost of wit, delighting to walk after the death of its body. And to say the truth, there seems to be no part of knowledge in fewer hands than that of discerning when to have done. By the time that an author has written out a book, he and his readers are become old acquaintance, and grow very loathe to part; so that I have sometimes known it to be in writing as in visiting, where the ceremony of taking leave has employed more time than the whole conversation before. The conclusion of a treatise resembles the conclusion of human life, which has sometimes been compared to the end of a feast, where few are satisfied to depart ut plenus vitæ conviva. For men will sit down after the fullest meal, though it be only to dose or to sleep out the rest of the day. But in this latter I differ extremely from other writers, and shall be too proud if, by all my labours, I can have any ways contributed to the repose of mankind in times so turbulent and unquiet as these. Neither do I think such an employment so very alien from the office of a wit as some would suppose; for among a very polite nation in Greece [157] there were the same temples built and consecrated to Sleep and the Muses, between which two deities they believed the strictest friendship was established."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 265
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[244]"
  "translation_ja": "私は今、近代の著者の間で、たいそう頻繁に行われる実験を試している。何についてでもなく書くこと、主題をすっかり使い尽くしても、なおペンを動かすことだ。ある人々は、これを、体の死後も歩き回るのを喜ぶ、才知の幽霊と呼ぶ。実を言えば、いつやめるかを見分けることほど、身につけた者の少ない知識はなさそうだ。著者が本を書き終える頃には、本人と読者は古い知り合いになり、別れるのをたいそう嫌がる。だから、文章でも訪問でも、同じことがあると、私はときどき知った。暇乞いの儀式のほうが、それまでの会話全体より、多くの時間を使うのだ。論考の結びは、人の生の終わりに似ている。それは、ときに宴の終わりへたとえられるが、「生に満ち足りた客として」、満足して去る者は少ない。人は、十分食べた後にも、ただ、まどろみ、残りの日を眠り過ごすためだけにさえ、座り続けるからだ。だが、この最後の点では、私は、ほかの著者と大いに違う。これほど騒がしく、落ち着かぬ時代に、私のあらゆる労作が、何らかの形で人類の休息へ寄与できれば、この上もない誇りとなる。また、こうした仕事は、ある人々が考えるほど、才人の務めからかけ離れてもいないと思う。ギリシアの、たいそう洗練された一民族[157]の間では、眠りとムーサたちのため、同じ神殿が建てられ、奉献されていた。二つの神の間には、最も固い友情が結ばれていると、信じられていたのである。"
  "translation_status": "reviewed"
- "id": "tub-conclusion-006"
  "section_id": "conclusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have one concluding favour to request of my reader, that he will not expect to be equally diverted and informed by every line or every page of this discourse, but give some allowance to the author’s spleen and short fits or intervals of dulness, as well as his own, and lay it seriously to his conscience whether, if he were walking the streets in dirty weather or a rainy day, he would allow it fair dealing in folks at their ease from a window, to criticise his gate and ridicule his dress at such a juncture."
  "source_languages":
  - "en"

    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[245]"
  "translation_ja": "最後に一つ、読者へお願いしたい。この論説のどの行、どの頁からも、同じだけ楽しみと知識が得られるとは、期待しないでいただきたい。御自身のものと同じく、著者の癇癪や、短い愚鈍の発作、あるいは合間も、いくらか大目に見てほしい。そして、良心に真剣に問うていただきたい。もし御自身が、泥道の日、雨の日に街を歩いていたら、窓辺でのんびりした人々が、その折の歩き方を批評し、服装を笑うことを、公正な仕打ちと認めるだろうか、と。"
  "translation_status": "reviewed"
- "id": "tub-conclusion-007"
  "section_id": "conclusion"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In my disposure of employments of the brain, I have thought fit to make invention the master, and to give method and reason the office of its lackeys. The cause of this distribution was from observing it my peculiar case to be often under a temptation of being witty upon occasion where I could be neither wise nor sound, nor anything to the matter in hand. And I am too much a servant of the modern way to neglect any such opportunities, whatever pains or improprieties I may be at to introduce them. For I have observed that from a laborious collection of seven hundred and thirty-eight flowers and shining hints of the best modern authors, digested with great reading into my book of common places, I have not been able after five years to draw, hook, or force into common conversation any more than a dozen. Of which dozen the one moiety failed of success by being dropped among unsuitable company, and the other cost me so many strains, and traps, and ambages to introduce, that I at length resolved to give it over. Now this disappointment (to discover a secret), I must own, gave me the first hint of setting up for an author, and I have since found among some particular friends that it is become a very general complaint, and has produced the same effects upon many others. For I have remarked many a towardly word to be wholly neglected or despised in discourse, which hath passed very smoothly with some consideration and esteem after its preferment and sanction in print. But now, since, by the liberty and encouragement of the press, I am grown absolute master of the occasions and opportunities to expose the talents I have acquired, I already discover that the issues of my observanda begin to grow too large for the receipts. Therefore I shall here pause awhile, till I find, by feeling the world’s pulse and my own, that it will be of absolute necessity for us both to resume my pen."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 267
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[246]"
  "translation_ja": "脳の仕事を配置するにあたり、私は創意を主人とし、構成と理性には、その従僕の役を与えることにした。この配分の理由は、自分に特有の事情へ気づいたことにある。賢くも、筋の通ったことも、当面の件に関わることも言えない場面で、機知を見せたいという誘惑へ、たびたび駆られるのだ。私は近代の流儀に忠実すぎるので、そのような機会を、どれも見過ごせない。持ち込むために、どれほど苦労し、不都合を冒そうとも、である。というのも、最良の近代作家から、苦心して七百三十八の名文と輝く着想を集め、多くの読書を経て抜き書き帳へ整理したのに、五年たっても、普段の会話へ引き出し、引っかけ、あるいは押し込めたものは、十二しかなかった。その十二のうち、半分は、ふさわしくない集まりへ落としたために失敗した。残りの半分を導入するにも、あまりに多くの無理、罠、遠回りが要ったので、とうとう、もうやめようと決めた。さて、秘密を明かすが、著者として身を立てようという、最初の手がかりをくれたのは、この失望だったと認めなければならない。その後、ある友人たちの間で、これはたいそう一般的な不満となり、多くの者へ同じ効果を及ぼしたとわかった。話し言葉では、すっかり無視され、軽蔑されていた有望な一言が、印刷という出世と公認を得た後には、いくらかの配慮と敬意をもって、とても滑らかに通る例を、私は多く見ている。だが今、出版の自由と励ましによって、身につけた才能を披露する機会と場合を、まったく自分で支配できるようになると、私の注目事項の支出が、収入に比べて、大きくなりすぎ始めたことに、もう気づいている。そこで、しばらく、ここで休もう。世間の脈と、自分の脈を診て、再びペンを取ることが、双方にとって絶対に必要だとわかるときまで。"
  "translation_status": "reviewed"

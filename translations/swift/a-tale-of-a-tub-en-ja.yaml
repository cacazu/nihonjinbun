  "source_text": "In short, Peter grew so scandalous that all the neighbourhood began in plain words to say he was no better than a knave; and his two brothers, long weary of his ill-usage, resolved at last to leave him; but first they humbly desired a copy of their father’s will, which had now lain by neglected time out of mind. Instead of granting this request, he called them rogues, traitors, and the rest of the vile names he could muster up. However, while he was abroad one day upon his projects, the two youngsters watched their opportunity, made a shift to come at the will, and took a copia vera [99a], by which they presently saw how grossly they had been abused, their father having left them equal heirs, and strictly commanded that whatever they got should lie in common among them all. Pursuant to which, their next enterprise was to break open the cellar-door and get a little good drink to spirit and comfort their hearts [99b]. In copying the will, they had met another precept against whoring, divorce, and separate maintenance; upon which, their next work was to discard their concubines and send for their wives [99c]. Whilst all this was in agitation, there enters a solicitor from Newgate, desiring Lord Peter would please to procure a pardon for a thief that was to be hanged to-morrow. But the two brothers told him he was a coxcomb to seek pardons from a fellow who deserved to be hanged much better than his client, and discovered all the method of that imposture in the same form I delivered it a while ago, advising the solicitor to put his friend upon obtaining a pardon from the king. In the midst of all this platter and revolution in comes Peter with a file of dragoons at his heels, and gathering from all hands what was in the wind, he and his gang, after several millions of scurrilities and curses not very important here to repeat, by main force very fairly kicks them both out of doors, and would never let them come under his roof from that day to this."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 158
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[150]"
  "translation_ja": "要するに、ピーターの不評はひどくなり、近所中が、あれはただの悪党だと、はっきり言い始めた。長く虐げられ、うんざりしていた二人の兄弟も、とうとう彼と別れようと決めた。ただ、その前に、いつからかもわからぬほど長く、顧みられずにいた父の遺言の写しを、つつましく求めた。彼は頼みを認めるどころか、二人を悪党、裏切り者と呼び、思いつくかぎりの罵りを浴びせた。しかし、ある日、彼が計画のために出かけると、二人の弟は機会をうかがい、どうにか遺言を手に入れ、忠実な写しを取った[99a]。それで、いかにひどく騙されていたか、すぐにわかった。父は、三人を等しい相続人とし、手に入れたものは何でも、全員で共有するよう、厳しく命じていたのである。これに従い、次の仕事は、酒蔵の戸をこじ開け、少しよい飲み物を手に入れて、元気をつけ、心を慰めることだった[99b]。遺言を写すうちに、女遊び、離婚、別居扶養を禁じる、もう一つの教えも見つかった。それで、次には妾を追い出し、妻を呼び戻した[99c]。これらの仕事が進行中に、ニューゲート監獄から、ある法律事務代理人がやって来た。明日絞首刑になる盗人の赦免を、ピーター卿に取り計らってほしいという。だが兄弟は、自分の依頼人より、よほど絞首刑にふさわしい男に赦免を求めるとは、君は間抜けだと告げた。そして、そのいかさまの手口を、先ほど私が述べたとおりに、残らず明かし、友人のため、国王から赦免を得るよう動いたほうがよいと勧めた。この大騒ぎと変革のさなかに、ピーターが、竜騎兵の一列を引き連れて帰ってきた。あちらこちらから何が起きたかを聞き取ると、彼と一味は、ここで繰り返すほどの意味もない、何百万という悪口と呪いを浴びせた後、力ずくで、まことに見事に、二人とも戸外へ蹴り出した。その日から今日まで、二度と自分の屋根の下へ入らせなかった。"
  "translation_status": "reviewed"

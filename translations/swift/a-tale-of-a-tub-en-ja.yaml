- "id": "tub-note-75"
  "section_id": "notes"
  "kind": "note_body"
  "origin": "source"
  "source_text": "[75] The Roman Catholics were considered by the Reformers to have added to the simple doctrines of Christianity inventions of their own, and to have laid especial stress on the adoption of them. Upon Swift’s saying of the three brothers, “Now the coats their father had left them were, it is true, of very good cloth, and besides so neatly sewn that you would swear they were all of a piece, but, at the same time, very plain, with little or no ornament,” W. Wotton observes: “This is the distinguishing character of the Christian religion. Christiana religio absoluta et simplex, was Ammianus Marcellinus’s description of it, who was himself a heathen.” But the learned Peter argues that if a doctrine cannot be found, totidem verbis, in so many words, it may be found in so many syllables, or, if that way fail, we shall make them out in a third way, of so many letters."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 293
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "anchor": "footnote75"
  "translation_ja": "[75] 改革者たちは、ローマ・カトリックが、キリスト教の単純な教義へ、自作の発明を付け加え、その採用を、とりわけ重んじたと考えた。三兄弟についての、スウィフトの言葉、「父の残した上着は、たしかにたいへんよい生地で、縫い目も見事なので、一枚物だと誓ってもよいくらいだった。しかし同時に、たいそう地味で、飾りはほとんどないか、まったくなかった」に対し、W・ウォットンは、こう述べる。「これこそ、キリスト教の際立った特徴である。自らは異教徒だったアンミアヌス・マルケリヌスも、『キリスト教は完全で単純である』と記述した。」しかし、物知りのピーターは、ある教義が、一語一句そのままの言葉では見つからなくても、音節を一つずつ拾えば見つかり、それもだめなら、第三の方法で、文字を一つずつ拾って見つけ出せる、と論じる。"
  "translation_status": "reviewed"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "署名・引用元は注本文に保持。注全体の著者・編者の帰属は未確定。"

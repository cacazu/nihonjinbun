    "anchor": "footnote102b"
  "translation_ja": "[102b] 五十年ほど前、ケンブリッジのウェールズ人紳士が書いた論考。名は、記憶ではヴォーン。博学なヘンリー・モア博士による反論からも、そうとわかる。おそらく、どの言語でも、これまで刊行されたうち、最も意味不明な大言壮語の一つである。――S.　この作品は、詩人ヘンリー・ヴォーンの兄弟による。"
  "translation_status": "reviewed"
  "attributions":

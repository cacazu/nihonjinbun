  "translation_ja": "さて、人間の心は、思考に拍車と手綱を与えると、決して止まらず、高低、善悪、その両極へ自然に飛び出してゆく。空想の最初の飛翔は、ふつう、最も完全で、完成し、高められたものの観念へと運ぶ。やがて、自分の手も目も届かぬところまで舞い上がると、高さと深さの境が、どれほど近く接するかをよく見分けられず、同じ進路と翼のまま、物事の最も低い底へ、どさりと落ちる。東へ旅して西へ至る者、あるいは、自分の長さによって円へ引き曲げられる直線のようである。わが本性に混じる悪意が、輝かしい観念の一つ一つに、裏面を用意することを好ませるのか。それとも、万物を照らす理性は、太陽のように、地球の半分しか明るくできず、残る半分を、いやでも影と闇に置くのか。それとも、最も高く、最良のものを思い描こうと飛び上がった空想が、力不足となり、消耗し、疲れ果て、死んだ極楽鳥のように、突然、地面へ落ちるのか。それとも、これほどの形而上学的推測を尽くして、真の理由を、私はまったく外しているのか。ともかく、これだけの前置きを費やした命題は、完全に真実である。最も文明化していない人々も、どうにかして、神、あるいは至高の力の観念へ登りつめると、たいてい、自分の恐れのために、ある種のぞっとする観念を用意するのを忘れなかった。もっとよいものの代わりに、それが悪魔として、まずまずの役を果たしたのである。この手順は、十分自然に見える。想像力を非常に高く上げた人々は、体を非常に高く上げた人々と同じだ。上を間近に眺める利点を喜ぶと同時に、下の崖の陰惨な眺めに、同じほど怯える。こうして、悪魔を選ぶ際、人類はふつう、自分で作った神と、最も反対の存在を、実際にあるものから、または幻の中から、選び出した。風崇拝者の宗派もまた、二つの悪しき本性への恐れ、嫌悪、憎しみに取りつかれた。自分たちの拝む神々との間に、永遠の敵対が定められたものだ。第一はカメレオンで、霊感の誓った敵だった。彼らの神の大きな影響を、軽蔑しながら食い尽くし、げっぷで、ほんの一息も払い戻さなかった。もう一つは、ムーラン・ア・ヴァンという、巨大で恐ろしい怪物だった。四本の強い腕で、彼らのすべての神と永遠に戦い、巧みに回って打撃を避け、利息をつけて打ち返したのである[123]。"
  "translation_status": "reviewed"
- "id": "tub-section-08-011"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thus furnished, and set out with gods as well as devils, was the renowned sect of Æolists, which makes at this day so illustrious a figure in the world, and whereof that polite nation of Laplanders are beyond all doubt a most authentic branch, of whom I therefore cannot without injustice here omit to make honourable mention, since they appear to be so closely allied in point of interest as well as inclinations with their brother Æolists among us, as not only to buy their winds by wholesale from the same merchants, but also to retail them after the same rate and method, and to customers much alike."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 204
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[189]"
  "translation_ja": "こうして神々だけでなく悪魔までそろえ、支度を整えたのが、名高い風崇拝者の宗派である。今日、世間でこれほど輝かしい姿を見せており、あの洗練されたラップ人という国民も、疑いなく、その正真正銘の一派である。だから、ここで彼らを、うやうやしく挙げずに済ませるのは、公正を欠く。利害においても好みにおいても、わが国の同胞たる風崇拝者と、たいそう密接につながっているからだ。同じ商人から、風を卸売りで買うだけでなく、同じ値段と方法で、よく似た客へ小売りしているのである。"
  "translation_status": "reviewed"
- "id": "tub-section-08-012"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now whether the system here delivered was wholly compiled by Jack, or, as some writers believe, rather copied from the original at Delphos, with certain additions and emendations suited to times and circumstances, I shall not absolutely determine. This I may affirm, that Jack gave it at least a new turn, and formed it into the same dress and model as it lies deduced by me."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 205
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[190]"
  "translation_ja": "さて、ここに示した体系を、ジャックがすべて編み出したのか、それとも、ある著者たちの考えるとおり、むしろデルフォイの原型を書き写し、時代と事情に合う追加や修正を施したのか、私は断定しない。確かに言えるのは、少なくともジャックが、それに新しいひねりを与え、ここで私が説明したとおりの姿と型へ仕立てた、ということだ。"
  "translation_status": "reviewed"
- "id": "tub-section-08-013"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have long sought after this opportunity of doing justice to a society of men for whom I have a peculiar honour, and whose opinions as well as practices have been extremely misrepresented and traduced by the malice or ignorance of their adversaries. For I think it one of the greatest and best of human actions to remove prejudices and place things in their truest and fairest light, which I therefore boldly undertake, without any regards of my own beside the conscience, the honour, and the thanks."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 206
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[191]"
  "translation_ja": "私が特別な敬意を抱く人々の集まりへ、公正な扱いを与える機会を、私は長く待ち望んできた。その意見も実践も、敵の悪意や無知によって、甚だしく歪められ、中傷されてきたのである。偏見を取り除き、物事を最も真実で、最も公平な光の下へ置くことは、人間の行為のうち、最も偉大で、最もよいものの一つだと、私は考える。だから、良心と名誉と感謝以外、自分の都合は何も顧みず、大胆にも、その仕事を引き受けるのである。"
  "translation_status": "reviewed"
- "id": "tub-section-09-001"
  "section_id": "section-09"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    SECTION IX.
     A DIGRESSION CONCERNING THE ORIGINAL, THE USE, AND IMPROVEMENT OF MADNESS IN A COMMONWEALTH.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 207
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/h3[14]"
  "translation_ja": |-
    第9節
    国家における狂気の起源・効用・発展についての脱線
  "translation_status": "reviewed"
- "id": "tub-section-09-002"
  "section_id": "section-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Nor shall it any ways detract from the just reputation of this famous sect that its rise and institution are owing to such an author as I have described Jack to be, a person whose intellectuals were overturned and his brain shaken out of its natural position, which we commonly suppose to be a distemper, and call by the name of madness or frenzy. For if we take a survey of the greatest actions that have been performed in the world under the influence of single men, which are the establishment of new empires by conquest, the advance and progress of new schemes in philosophy, and the contriving as well as the propagating of new religions, we shall find the authors of them all to have been persons whose natural reason hath admitted great revolutions from their diet, their education, the prevalency of some certain temper, together with the particular influence of air and climate. Besides, there is something individual in human minds that easily kindles at the accidental approach and collision of certain circumstances, which, though of paltry and mean appearance, do often flame out into the greatest emergencies of life. For great turns are not always given by strong hands, but by lucky adaptation and at proper seasons, and it is of no import where the fire was kindled if the vapour has once got up into the brain. For the upper region of man is furnished like the middle region of the air, the materials are formed from causes of the widest difference, yet produce at last the same substance and effect. Mists arise from the earth, steams from dunghills, exhalations from the sea, and smoke from fire; yet all clouds are the same in composition as well as consequences, and the fumes issuing from a jakes will furnish as comely and useful a vapour as incense from an altar. Thus far, I suppose, will easily be granted me; and then it will follow that as the face of Nature never produces rain but when it is overcast and disturbed, so human understanding seated in the brain must be troubled and overspread by vapours ascending from the lower faculties to water the invention and render it fruitful. Now although these vapours (as it hath been already said) are of as various original as those of the skies, yet the crop they produce differs both in kind and degree, merely according to the soil. I will produce two instances to prove and explain what I am now advancing."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 208
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[192]"
  "translation_ja": "この名高い宗派の成立と創設が、私の描いたジャックのような人物、知性がひっくり返り、脳が自然な位置から揺すり出された人物によるものだからといって、その正当な評判が、いささかも損なわれることはない。この状態を、私どもはふつう病と考え、狂気、または錯乱と呼ぶ。だが、一人の人間の影響によって、世界で成し遂げられた最も偉大な行為を見渡してみよう。征服による新しい帝国の樹立、哲学の新体系の発展と進歩、新しい宗教の考案と普及が、それにあたる。これらの創始者は皆、食事、教育、ある特定の気質の優勢、それに空気や気候の特殊な影響によって、生来の理性に大きな変革を受け入れた人物だったとわかるだろう。そのうえ、人間の心には、個人に固有の何かがあり、ある事情が偶然近づき、ぶつかると、容易に火がつく。その事情は、取るに足りず、卑しく見えても、しばしば、人生最大の事件へと燃え広がる。大転換は、いつでも強い手で起こされるのではなく、幸運な取り合わせと、適切な時機によっても起こる。そして、蒸気がひとたび脳へ昇れば、どこで火がついたかは、どうでもよい。人間の上部の領域は、大気の中間の領域と同じようにできているからだ。材料は、最も異なる原因から作られても、ついには同じ物質と効果を生む。霧は地面から、湯気は肥溜めから、蒸気は海から、煙は火から昇る。それでも雲はすべて、組成においても、もたらす結果においても同じであり、便所から出る煙も、祭壇の香と同じほど、立派で有用な蒸気を供給する。ここまでは、容易に認めてもらえるだろう。すると、次のことが帰結する。自然の顔は、曇り、乱れなければ、雨を生まない。それと同じく、脳に座を占める人間の理解力も、下位の機能から昇る蒸気に乱され、覆われねばならない。創意に水を与え、実り豊かにするためである。さて、すでに述べたように、この蒸気の起源は、空の蒸気と同じくさまざまだが、生み出す収穫が、種類においても程度においても違うのは、もっぱら土壌の違いによる。今の主張を証明し、説明するため、二つの例を挙げよう。"
  "translation_status": "reviewed"
- "id": "tub-section-09-003"
  "section_id": "section-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A certain great prince [126a] raised a mighty army, filled his coffers with infinite treasures, provided an invincible fleet, and all this without giving the least part of his design to his greatest ministers or his nearest favourites. Immediately the whole world was alarmed, the neighbouring crowns in trembling expectation towards what point the storm would burst, the small politicians everywhere forming profound conjectures. Some believed he had laid a scheme for universal monarchy; others, after much insight, determined the matter to be a project for pulling down the Pope and setting up the Reformed religion, which had once been his own. Some again, of a deeper sagacity, sent him into Asia to subdue the Turk and recover Palestine. In the midst of all these projects and preparations, a certain state-surgeon [126b], gathering the nature of the disease by these symptoms, attempted the cure, at one blow performed the operation, broke the bag and out flew the vapour; nor did anything want to render it a complete remedy, only that the prince unfortunately happened to die in the performance. Now is the reader exceeding curious to learn from whence this vapour took its rise, which had so long set the nations at a gaze? What secret wheel, what hidden spring, could put into motion so wonderful an engine? It was afterwards discovered that the movement of this whole machine had been directed by an absent female, who was removed into an enemy’s country. What should an unhappy prince do in such ticklish circumstances as these? He tried in vain the poet’s never-failing receipt of corpora quæque, for"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 209
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[193]"
  "translation_ja": "ある偉大な君主[126a]が、強大な軍を集め、金庫を無限の財宝で満たし、無敵の艦隊を整えた。それも、有力な大臣にも、最も親しい寵臣にも、計画のほんの一部さえ知らせずに、である。たちまち世界中が驚き、近隣の王たちは、嵐がどこへ破裂するのかと、震えながら待ち構え、小政治家たちは至る所で、深遠な推測を組み立てた。世界全体の君主になろうと企てたのだと信じる者もいた。多くを見抜いた末に、教皇を引き倒し、かつて自分も属していた改革派の宗教を打ち立てる計画だと、決めつける者もいた。さらに洞察の深い者は、彼をアジアへ送り、トルコ人を征服し、パレスチナを奪回させた。こうした計画と準備のさなか、一人の国家外科医[126b]が、これらの症状から病の性質を見抜き、治療を試みた。一撃で手術を施し、袋を破ると、蒸気は外へ飛び出した。完全な治療にするために、何一つ足りないものはなかった。ただ、運悪く、処置の最中に君主が死んでしまっただけである。さて読者は、諸国をあれほど長く呆然と見とれさせた蒸気が、どこから生じたか、たいそう知りたくなっているだろう。どんな秘密の車輪、どんな隠れたばねが、こんな驚くべき機械を動かしたのか。この装置全体の動きを導いたのは、敵国へ移って不在となった、一人の女だったと、後で判明した。このような微妙な境遇で、不幸な君主に何ができよう。詩人の、決して失敗しない処方、「どんな体ででも」を試したが、むだだった。というのも、"
  "translation_status": "reviewed"

  "translation_status": "reviewed"
- "id": "tub-bookseller-002"
  "section_id": "bookseller"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is now six years since these papers came first to my hand, which seems to have been about a twelvemonth after they were written, for the Author tells us in his preface to the first treatise that he had calculated it for the year 1697; and in several passages of that discourse, as well as the second, it appears they were written about that time."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 27
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[31]"
  "translation_ja": "この原稿が初めて私の手に渡ってから、もう六年になる。書かれてから一年ほどたった頃のことだったらしい。というのも、著者は最初の論考の序文で、一六九七年を念頭に書いたと述べており、その論考にも二番目の論考にも、その頃に執筆されたとわかる箇所がいくつもあるからである。"
  "translation_status": "reviewed"
- "id": "tub-bookseller-003"
  "section_id": "bookseller"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As to the Author, I can give no manner of satisfaction. However, I am credibly informed that this publication is without his knowledge, for he concludes the copy is lost, having lent it to a person since dead, and being never in possession of it after; so that, whether the work received his last hand, or whether he intended to fill up the defective places, is like to remain a secret."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 28
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[32]"
  "translation_ja": "著者については、何一つ納得のいく説明を差し上げられない。ただ、本人の知らぬところでの刊行であることは、確かな筋から聞いている。著者はこの原稿をある人物に貸したが、その人物はその後死去し、原稿も戻らなかったので、もう失われたものと思い込んでいる。そのため、本作に最後の仕上げを施したのか、欠けた箇所を埋めるつもりだったのかは、謎のままになりそうである。"
  "translation_status": "reviewed"
- "id": "tub-bookseller-004"
  "section_id": "bookseller"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If I should go about to tell the reader by what accident I became master of these papers, it would, in this unbelieving age, pass for little more than the cant or jargon of the trade. I therefore gladly spare both him and myself so unnecessary a trouble. There yet remains a difficult question—why I published them no sooner? I forbore upon two accounts. First, because I thought I had better work upon my hands; and secondly, because I was not without some hope of hearing from the Author and receiving his directions. But I have been lately alarmed with intelligence of a surreptitious copy which a certain great wit had new polished and refined, or, as our present writers express themselves, “fitted to the humour of the age,” as they have already done with great felicity to Don Quixote, Boccalini, La Bruyère, and other authors. However, I thought it fairer dealing to offer the whole work in its naturals. If any gentleman will please to furnish me with a key, in order to explain the more difficult parts, I shall very gratefully acknowledge the favour, and print it by itself."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 29
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[33]"
  "translation_ja": "どんないきさつでこの原稿を手に入れたかを読者に語ろうとしても、何でも疑う今の世のこと、出版商売の決まり文句か、わけのわからぬ口上としか受け取られまい。そこで、読者と私自身に、そんな無用な手間をかけずに済むのはありがたい。なお一つ、難しい問いが残る。なぜもっと早く刊行しなかったのか。控えていたのには二つ理由がある。第一に、ほかにもっとよい仕事を抱えていると思っていたから。第二に、著者から連絡があり、指示が得られる望みも、いくらか持っていたからである。しかし最近、ある大才人がこの作品の海賊写本に新しく磨きをかけ、洗練させたという知らせに接して、気をもむようになった。今の文筆家たちの言い方なら「時代の好みに合わせた」のである。すでに彼らは『ドン・キホーテ』やボッカリーニ、ラ・ブリュイエールなどに、同じことをたいへんめでたく施している。それでも私は、作品の全体を生まれたままの姿で差し出すほうが、誠実な商売だと考えた。どなたか、難しい部分を説明する手引きをお寄せくださるなら、その御厚意には心から感謝し、別冊として刊行したい。"
  "translation_status": "reviewed"

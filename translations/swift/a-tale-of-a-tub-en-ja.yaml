    "xpath": "/html[1]/body[1]/p[58]"
  "translation_ja": "また、「出版物がどれほどの屑であふれているかを見れば」、云々。"
  "translation_status": "reviewed"
- "id": "tub-preface-011"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Another: “Sir, it is merely in obedience to your commands that I venture into the public, for who upon a less consideration would be of a party with such a rabble of scribblers,” &c."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 57
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[59]"
  "translation_ja": "また、「あなたの御命令に従うという、ただそれだけのために、私はあえて世に出るのであります。もっと軽い理由で、このような駄文書きの群れに加わる者がいるでしょうか」、云々。"
  "translation_status": "reviewed"
- "id": "tub-preface-012"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now, I have two words in my own defence against this objection. First, I am far from granting the number of writers a nuisance to our nation, having strenuously maintained the contrary in several parts of the following discourse; secondly, I do not well understand the justice of this proceeding, because I observe many of these polite prefaces to be not only from the same hand, but from those who are most voluminous in their several productions; upon which I shall tell the reader a short tale."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 58
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[60]"
  "translation_ja": "さて、この反論に対し、弁明を二言述べたい。第一に、著述家の数を国の迷惑だと認めるつもりは、まったくない。以下の論考の何か所でも、私はその反対を力説している。第二に、このやり方が公正なのか、どうもわからない。こうした洗練された序文の多くは、同じ人物の手になるばかりでなく、著作の分量でとりわけ群を抜く連中のものだからである。これについて読者に、一つ短い話をしよう。"
  "translation_status": "reviewed"
- "id": "tub-preface-013"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A mountebank in Leicester Fields had drawn a huge assembly about him. Among the rest, a fat unwieldy fellow, half stifled in the press, would be every fit crying out, “Lord! what a filthy crowd is here. Pray, good people, give way a little. Bless need what a devil has raked this rabble together. Z—ds, what squeezing is this? Honest friend, remove your elbow.” At last a weaver that stood next him could hold no longer. “A plague confound you,” said he, “for an overgrown sloven; and who in the devil’s name, I wonder, helps to make up the crowd half so much as yourself? Don’t you consider that you take up more room with that carcass than any five here? Is not the place as free for us as for you? Bring your own guts to a reasonable compass, and then I’ll engage we shall have room enough for us all.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 59
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[61]"
  "translation_ja": "レスター・フィールズで、いかさま薬売りが大勢の人だかりを集めていた。その中で、太って身動きの鈍い男が、押し合いへし合いのうちに半ば息を詰まらせ、しょっちゅう叫んでいた。「何だって、こんなひどい人だかりなんだ！　皆さん、頼むから少し道をあけてくれ。まったく、いったい誰がこんな連中をかき集めやがった。ちくしょう、なんて押し方だ。そこのあんた、その肘をどけてくれ。」とうとう隣の織工が我慢しきれなくなった。「くたばっちまえ、このでっかいだらしな野郎」と言った。「いったい誰が、あんたの半分でも、この人だかりを大きくしてるっていうんだ。その体で、ほかの五人分以上の場所を取ってるのがわからんのか。ここへ来る権利は、俺たちもあんたも同じだろう。その腹をまともな寸法にしてから来な。そうすりゃ皆の場所が十分できるって、請け合ってやるよ。」"
  "translation_status": "reviewed"
- "id": "tub-preface-014"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There are certain common privileges of a writer, the benefit whereof I hope there will be no reason to doubt; particularly, that where I am not understood, it shall be concluded that something very useful and profound is couched underneath; and again, that whatever word or sentence is printed in a different character shall be judged to contain something extraordinary either of wit or sublime."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 60
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[62]"
  "translation_ja": "著述家には、共通の特権がいくつかある。その恩恵が私にも及ぶことには、異議がないものと願いたい。とくに、私の文章がわからぬときには、その奥に、たいへん役立つ深遠な何かが潜んでいると結論していただきたい。また、違う書体で印刷された語句は、すべて、並外れた機知か崇高さを含んでいると判断していただきたい。"
  "translation_status": "reviewed"
- "id": "tub-preface-015"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "As for the liberty I have thought fit to take of praising myself, upon some occasions or none, I am sure it will need no excuse if a multitude of great examples be allowed sufficient authority; for it is here to be noted that praise was originally a pension paid by the world, but the moderns, finding the trouble and charge too great in collecting it, have lately bought out the fee-simple, since which time the right of presentation is wholly in ourselves. For this reason it is that when an author makes his own eulogy, he uses a certain form to declare and insist upon his title, which is commonly in these or the like words, “I speak without vanity,” which I think plainly shows it to be a matter of right and justice. Now, I do here once for all declare, that in every encounter of this nature through the following treatise the form aforesaid is implied, which I mention to save the trouble of repeating it on so many occasions."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 61
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[63]"
  "translation_ja": "折にふれ、あるいは折などなくても、自分をほめる自由をいただいたことについては、偉大な先例が数多くあることを十分な権威と認めてくだされば、弁解は要らぬと確信している。ここで注意したいのは、称賛とは、もともと世間から支給される年金だったということだ。ところが近代人たちは、取り立ての手間と費用が大きすぎると気づき、近頃、その権利を完全な所有権ごと買い取ってしまった。それ以来、授与の権利は、すっかり私ども自身の手にある。このため、著者が自分の頌辞を述べるときには、その権原を宣言し、主張する一定の文句を使う。たいてい「虚栄心から言うのではないが」、あるいはそれに類する言葉である。これは明らかに、権利と公正の問題であることを示していると思う。そこで一度だけ、きっぱり宣言しておこう。以下の論考の同種の場面では、すべて、この文句が暗黙に添えられているものとする。何度も繰り返す手間を省くため、申し添えた次第である。"
  "translation_status": "reviewed"
- "id": "tub-preface-016"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is a great ease to my conscience that I have written so elaborate and useful a discourse without one grain of satire intermixed, which is the sole point wherein I have taken leave to dissent from the famous originals of our age and country. I have observed some satirists to use the public much at the rate that pedants do a naughty boy ready horsed for discipline. First expostulate the case, then plead the necessity of the rod from great provocations, and conclude every period with a lash. Now, if I know anything of mankind, these gentlemen might very well spare their reproof and correction, for there is not through all Nature another so callous and insensible a member as the world’s posteriors, whether you apply to it the toe or the birch. Besides, most of our late satirists seem to lie under a sort of mistake, that because nettles have the prerogative to sting, therefore all other weeds must do so too. I make not this comparison out of the least design to detract from these worthy writers, for it is well known among mythologists that weeds have the pre-eminence over all other vegetables; and therefore the first monarch of this island whose taste and judgment were so acute and refined, did very wisely root out the roses from the collar of the order and plant the thistles in their stead, as the nobler flower of the two. For which reason it is conjectured by profounder antiquaries that the satirical itch, so prevalent in this part of our island, was first brought among us from beyond the Tweed. Here may it long flourish and abound; may it survive and neglect the scorn of the world with as much ease and contempt as the world is insensible to the lashes of it. May their own dulness, or that of their party, be no discouragement for the authors to proceed; but let them remember it is with wits as with razors, which are never so apt to cut those they are employed on as when they have lost their edge. Besides, those whose teeth are too rotten to bite are best of all others qualified to revenge that defect with their breath."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 62
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[64]"
  "translation_ja": "これほど丹念で有益な論考を書きながら、一粒の風刺も混ぜずに済んだことは、私の良心にとって大きな安らぎである。この一点だけは、この時代、この国の名高い手本から離れることをお許しいただいた。ある風刺家たちが世間を扱うさまを見ると、学者先生が、鞭打ちのために人の背へ載せた悪童を扱うのと、ほとんど変わらない。まず言い聞かせ、次にこれほど悪さをしたのだから鞭は必要だと論じ、文の区切りごとに一発くらわせる。ところが、人間について私が少しでも知っているなら、この人たちは叱責も折檻も省いてかまわない。蹴飛ばそうが、樺の鞭で打とうが、世間の尻ほど皮が厚く、感覚の鈍い部分は、自然界のどこにもないからである。そのうえ近頃の風刺家の大半は、一種の勘違いをしているらしい。イラクサに刺す特権があるからといって、ほかの雑草も全部刺さねばならぬ、というのだ。こうたとえるのは、この立派な著述家たちを、いささかでもけなすためではない。雑草がほかのあらゆる植物に優越することは、神話学者の間ではよく知られている。だからこそ、趣味も判断も鋭く洗練されていた、この島を初めて統一して治めた君主は、まことに賢明にも、騎士団の頸飾から薔薇を抜き去り、二つのうち高貴な花であるアザミを代わりに植えた。このため、より深遠な古物研究家は、この島のこちら側でこれほど流行する風刺の痒みは、もともとツイード川の向こうから持ち込まれたと推測している。どうかここで、末長く栄え、はびこってほしい。世間がその鞭を何とも思わないのと同じほど、気楽に、鼻であしらって世間の嘲りをやり過ごし、生き延びてほしい。著者たちも、自分や仲間の鈍さにくじけず、仕事を続けてほしい。ただし、才知も剃刀と同じで、刃が鈍っているときこそ、あてがわれた相手を最もよく切るものだと覚えておこう。それに、歯が腐りすぎて噛めない者こそ、その不足を息の臭さで埋め合わせる資格を、誰よりも立派に備えているのだ。"
  "translation_status": "reviewed"
- "id": "tub-preface-017"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am not, like other men, to envy or undervalue the talents I cannot reach, for which reason I must needs bear a true honour to this large eminent sect of our British writers. And I hope this little panegyric will not be offensive to their ears, since it has the advantage of being only designed for themselves. Indeed, Nature herself has taken order that fame and honour should be purchased at a better pennyworth by satire than by any other productions of the brain, the world being soonest provoked to praise by lashes, as men are to love. There is a problem in an ancient author why dedications and other bundles of flattery run all upon stale musty topics, without the smallest tincture of anything new, not only to the torment and nauseating of the Christian reader, but, if not suddenly prevented, to the universal spreading of that pestilent disease the lethargy in this island, whereas there is very little satire which has not something in it untouched before. The defects of the former are usually imputed to the want of invention among those who are dealers in that kind; but I think with a great deal of injustice, the solution being easy and natural, for the materials of panegyric, being very few in number, have been long since exhausted; for as health is but one thing, and has been always the same, whereas diseases are by thousands, besides new and daily additions, so all the virtues that have been ever in mankind are to be counted upon a few fingers, but his follies and vices are innumerable, and time adds hourly to the heap. Now the utmost a poor poet can do is to get by heart a list of the cardinal virtues and deal them with his utmost liberality to his hero or his patron. He may ring the changes as far as it will go, and vary his phrase till he has talked round, but the reader quickly finds it is all pork, [56a] with a little variety of sauce, for there is no inventing terms of art beyond our ideas, and when ideas are exhausted, terms of art must be so too."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 63
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[65]"
  "translation_ja": "私はほかの人々のように、自分の及ばない才能を妬んだり、見くびったりはしない。だから、わがブリテンの著述家たちの中でも、多数を占めるこの名高い一派には、心から敬意を払わずにいられない。このささやかな頌辞も、彼らだけに向けたという取り柄があるので、耳障りにはならぬと願っている。実際、自然そのものが、頭脳のほかの産物より、風刺によってこそ安く名声と名誉を買えるよう取り計らっている。世間は、鞭で打たれると最も手早く称賛する気になる。人が打たれて恋心をかき立てられるのと同じである。ある古い著者に、こんな問題がある。献辞その他のお世辞の束は、なぜどれも、かび臭い使い古しの題目ばかりで、ほんの少しも新味がないのか。キリスト教徒の読者を苦しめ、吐き気を催させるばかりか、急いで手を打たなければ、昏睡病という恐ろしい病を、この島全体にはびこらせかねないほどなのは、なぜか。一方、風刺なら、これまで触れられなかった何かを含まないものは、ほとんどないのに。前者の欠陥は、ふつう、その商売をする連中に創意がないためとされる。しかし、これは甚だ不公正だと思う。答えは簡単で自然なものだからである。頌辞の材料はもともとごく少なく、とうの昔に使い尽くされている。健康はたった一つで、昔から変わりがないが、病気は何千とあり、しかも日々新しく増える。同じように、人間がこれまで備えた美徳は数本の指で数えられるが、その愚かさと悪徳は数えきれず、時は毎時、その山を大きくしている。だから哀れな詩人にできるのは、基本となる美徳の一覧を暗記して、精いっぱい気前よく、主人公や庇護者へ配ってやることぐらいだ。可能なかぎり組み合わせを変え、一巡するまで言い回しを替えてもよい。しかし読者は、どれも豚肉に[56a]少し違うソースをかけただけだと、すぐに気づく。観念を超えて専門用語を発明することはできず、観念が尽きれば、専門用語も尽きるほかないのだから。"
  "translation_status": "reviewed"
- "id": "tub-preface-018"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But though the matter for panegyric were as fruitful as the topics of satire, yet would it not be hard to find out a sufficient reason why the latter will be always better received than the first; for this being bestowed only upon one or a few persons at a time, is sure to raise envy, and consequently ill words, from the rest who have no share in the blessing. But satire, being levelled at all, is never resented for an offence by any, since every individual person makes bold to understand it of others, and very wisely removes his particular part of the burden upon the shoulders of the World, which are broad enough and able to bear it. To this purpose I have sometimes reflected upon the difference between Athens and England with respect to the point before us. In the Attic [56b] commonwealth it was the privilege and birthright of every citizen and poet to rail aloud and in public, or to expose upon the stage by name any person they pleased, though of the greatest figure, whether a Creon, an Hyperbolus, an Alcibiades, or a Demosthenes. But, on the other side, the least reflecting word let fall against the people in general was immediately caught up and revenged upon the authors, however considerable for their quality or their merits; whereas in England it is just the reverse of all this. Here you may securely display your utmost rhetoric against mankind in the face of the world; tell them that all are gone astray; that there is none that doeth good, no, not one; that we live in the very dregs of time; that knavery and atheism are epidemic as the pox; that honesty is fled with Astræa; with any other common-places equally new and eloquent, which are furnished by the splendida bilis [56c]; and when you have done, the whole audience, far from being offended, shall return you thanks as a deliverer of precious and useful truths. Nay, further, it is but to venture your lungs, and you may preach in Covent Garden against foppery and fornication, and something else; against pride, and dissimulation, and bribery at Whitehall. You may expose rapine and injustice in the Inns-of-Court chapel, and in a City pulpit be as fierce as you please against avarice, hypocrisy, and extortion. It is but a ball bandied to and fro, and every man carries a racket about him to strike it from himself among the rest of the company. But, on the other side, whoever should mistake the nature of things so far as to drop but a single hint in public how such a one starved half the fleet, and half poisoned the rest; how such a one, from a true principle of love and honour, pays no debts but for wenches and play; how such a one runs out of his estate; how Paris, bribed by Juno and Venus, loath to offend either party, slept out the whole cause on the bench; or how such an orator makes long speeches in the Senate, with much thought, little sense, and to no purpose;—whoever, I say, should venture to be thus particular, must expect to be imprisoned for scandalum magnatum, to have challenges sent him, to be sued for defamation, and to be brought before the bar of the House."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 64
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[66]"
  "translation_ja": "だが、頌辞の材料が風刺の題目と同じほど豊かだったとしても、なぜ後者がいつも前者より歓迎されるのか、その十分な理由を見つけるのは難しくない。頌辞は一度に一人か数人へしか与えられないので、その祝福にあずからないほかの人々から、必ず妬みを、したがって悪口を引き起こす。一方、風刺は万人に向けられるので、誰もそれを侮辱だとは受け取らない。一人一人が勝手に、ほかの者のことだと解し、自分の分の重荷を、賢くも「世間」の肩へ移してしまう。その肩は広く、十分に耐えられるからだ。このことから、私はときどき、今の問題についてアテネとイングランドがどう違うかを考えた。アッティカの[56b]共和国では、誰でも、市民と詩人の生来の特権として、好きな人物を大声で公然と罵り、名指しで舞台の笑いものにできた。クレオンであれ、ヒュペルボロスであれ、アルキビアデスであれ、デモステネスであれ、どんな大物でもかまわなかった。だが逆に、人民全体を少しでも悪く言えば、たちまちとらえられ、口にした者は、身分や功績がどれほど高くても、仕返しを受けた。イングランドでは、すべてがちょうど逆である。ここなら、世間の面前で、人類に向けて修辞の限りを尽くしても無事でいられる。誰もが道を踏み外した、善を行う者はいない、一人としていない、われわれは時代の滓の底に生きている、詐欺と無神論が梅毒のように蔓延している、正直はアストライアとともに地上を去った、などと言ってよい。ほかにも、「輝かしい憤怒」[56c]が供給してくれる、これと同じほど新鮮で雄弁な決まり文句を並べてよい。言い終わると、聴衆一同は腹を立てるどころか、貴重で有益な真理を告げる人として、感謝してくれるだろう。さらに、肺を張り上げる覚悟さえあれば、コヴェント・ガーデンで、気取りや淫行や、ほかの何かを攻撃する説教もできる。ホワイトホールで、高慢や偽りや収賄を攻撃してもよい。法学院の礼拝堂で略奪と不正を暴いてもよいし、シティの説教壇で貪欲、偽善、強請をどれほど激しく責めてもよい。それは行ったり来たりする球でしかなく、誰もがラケットを持ち歩き、自分から仲間のほうへ打ち返すのである。ところが逆に、物事の性質をひどく取り違え、公の場で、たった一言でもこんなふうにほのめかす者がいたとしたらどうか。誰それは艦隊の半分を飢えさせ、残りの半分には毒同然の食物を与えた、誰それはまことの愛と名誉の原則から、女と賭博の借金しか払わない、誰それは財産を食いつぶしている、ユノとウェヌス双方から賄賂を受けたパリスは、どちらの機嫌も損ねたくなくて、審理の間ずっと裁判席で寝ていた、ある弁士は議会で長演説をするが、考え込んだわりに意味は乏しく、何の役にも立たない、と。このように具体的に話す勇気を示す者は、貴人誹謗罪で投獄され、決闘状を送られ、名誉毀損で訴えられ、議院の喚問台へ引き出される覚悟をしておかなければならない。"
  "translation_status": "reviewed"

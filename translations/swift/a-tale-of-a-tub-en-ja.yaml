    "anchor": "footnote70"
  "translation_ja": "[70] ピーターはローマ教会、マーティンはイングランドで公認された改革教会、ジャックはイングランド国教会からの分離派。マーティンの名は、おそらくマルティン・ルターから、ジャックはジャン・カルヴァンから取られている。上着は、神に仕える者が皆まとうべき、義の衣である。意見は違っても、愛と務めにおいては、等しくあらねばならない。"
  "translation_status": "reviewed"

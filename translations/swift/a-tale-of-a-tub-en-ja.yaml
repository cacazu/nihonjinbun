  "translation_status": "reviewed"
- "id": "tub-section-03-016"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But Ctesias, whom we lately quoted, has been a great deal bolder; he had been used with much severity by the true critics of his own age, and therefore could not forbear to leave behind him at least one deep mark of his vengeance against the whole tribe. His meaning is so near the surface that I wonder how it possibly came to be overlooked by those who deny the antiquity of the true critics. For pretending to make a description of many strange animals about India, he has set down these remarkable words. “Among the rest,” says he, “there is a serpent that wants teeth, and consequently cannot bite, but if its vomit (to which it is much addicted) happens to fall upon anything, a certain rottenness or corruption ensues. These serpents are generally found among the mountains where jewels grow, and they frequently emit a poisonous juice, whereof whoever drinks, that person’s brain flies out of his nostrils.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 131
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[126]"
  "translation_ja": "だが、先ほど引いたクテシアスは、はるかに大胆だった。同時代の真の批評家から、ひどく手厳しい扱いを受けたので、一族全体へ向けて、せめて一つ、深い復讐の印を残さずにはいられなかった。その意味は、表面のすぐ下にある。真の批評家が古代にいたことを否定する人々が、どうして見落としたのか、不思議なほどだ。インドの多くの珍獣を描くふりをして、彼は次の注目すべき言葉を書き残している。「ほかにも」と彼は言う。「歯がなく、したがって噛めない蛇がいる。だが、その吐瀉物――吐くことをたいそう好むのだが――が何かにかかると、一種の腐敗や腐食が起きる。この蛇は、ふつう宝石の育つ山々で見つかり、しばしば毒の汁を出す。それを飲んだ者は、誰であれ、脳味噌が鼻の穴から飛び出してしまう。」"
  "translation_status": "reviewed"
- "id": "tub-section-03-017"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There was also among the ancients a sort of critic, not distinguished in specie from the former but in growth or degree, who seem to have been only the tyros or junior scholars, yet because of their differing employments they are frequently mentioned as a sect by themselves. The usual exercise of these young students was to attend constantly at theatres, and learn to spy out the worst parts of the play, whereof they were obliged carefully to take note, and render a rational account to their tutors. Fleshed at these smaller sports, like young wolves, they grew up in time to be nimble and strong enough for hunting down large game. For it has been observed, both among ancients and moderns, that a true critic has one quality in common with a whore and an alderman, never to change his title or his nature; that a grey critic has been certainly a green one, the perfections and acquirements of his age being only the improved talents of his youth, like hemp, which some naturalists inform us is bad for suffocations, though taken but in the seed. I esteem the invention, or at least the refinement of prologues, to have been owing to these younger proficients, of whom Terence makes frequent and honourable mention, under the name of Malevoli."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 132
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[127]"
  "translation_ja": "古代には、もう一種の批評家もいた。前の種と、種類が違うのではなく、成長の段階や程度が違うものだった。どうやら、ただの初心者か下級の学生だったらしいが、仕事が違うので、しばしば独立の宗派として言及される。この若い学生たちの普段の練習は、絶えず劇場へ通い、芝居のいちばん悪い部分を見つけることを学ぶことだった。それを注意深く記録し、教師へ筋道だった報告をする義務があった。こうした小さな獲物で血の味を覚えると、仔狼のように、やがて大物を追い倒せるほど、敏捷で強く育つ。古代にも近代にも、真の批評家は、売春婦と市参事会員に共通の性質を一つ持つと観察されている。その称号も本性も、決して変えないのだ。白髪の批評家は、間違いなく青二才の批評家だった。老いて備えた完成と素養は、若い頃の才能を伸ばしたものにすぎない。麻のようなもので、ある博物学者によれば、種のうちに摂ってさえ、窒息には有害だという。口上の発明、あるいは少なくともその洗練は、この若い達人たちのおかげだと、私は思う。テレンティウスは彼らを、「悪意ある者ども」という名で、たびたび、うやうやしく取り上げている。"
  "translation_status": "reviewed"
- "id": "tub-section-03-018"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now it is certain the institution of the true critics was of absolute necessity to the commonwealth of learning. For all human actions seem to be divided like Themistocles and his company. One man can fiddle, and another can make a small town a great city; and he that cannot do either one or the other deserves to be kicked out of the creation. The avoiding of which penalty has doubtless given the first birth to the nation of critics, and withal an occasion for their secret detractors to report that a true critic is a sort of mechanic set up with a stock and tools for his trade, at as little expense as a tailor; and that there is much analogy between the utensils and abilities of both. That the “Tailor’s Hell” is the type of a critic’s commonplace-book, and his wit and learning held forth by the goose. That it requires at least as many of these to the making up of one scholar as of the others to the composition of a man. That the valour of both is equal, and their weapons near of a size. Much may be said in answer to these invidious reflections; and I can positively affirm the first to be a falsehood: for, on the contrary, nothing is more certain than that it requires greater layings out to be free of the critic’s company than of any other you can name. For as to be a true beggar, it will cost the richest candidate every groat he is worth, so before one can commence a true critic, it will cost a man all the good qualities of his mind, which perhaps for a less purchase would be thought but an indifferent bargain."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 133
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[128]"
  "translation_ja": "さて、真の批評家という制度が、学問の共和国に絶対必要だったことは確かである。というのも、人間のあらゆる働きは、テミストクレスとその同席者たちのように分けられるらしい。ある者は楽器を弾き、別の者は小さな町を大都市にできる。そのどちらもできない者は、創造の世界から蹴り出されて当然だ。この罰を避けるため、批評家の国民が初めて生まれたのは、疑いない。同時に、陰で悪口を言う者には、こんな噂を流すきっかけも与えた。真の批評家とは、一種の職人で、仕立屋と同じくらい安い費用で、商売の元手と道具をそろえられる。また、両者の用具と能力には、多くの類似がある。「仕立屋の地獄」は批評家の抜き書き帳を表し、機知と学識は鵞鳥が示す。仕立屋何人かでようやく一人の人間ができるように、学者一人を作るにも、少なくとも同じ数の批評家が要る。勇気も等しく、武器の大きさも似たようなものだ、と。こうした意地の悪い批判には、多くの反論ができる。第一の点については、虚偽だと、きっぱり断言できる。まったく逆に、批評家組合の自由会員となるには、どんな組合よりも大きな出費が必要なのである。真の乞食になるためには、最も金持ちの志願者でも、その持ち金を一銭残らず失わねばならない。それと同じで、真の批評家として出発する前には、その人の精神のよい性質を、ことごとく費やさねばならないのだ。もっと安いものを買うためなら、おそらく、あまりよい取引とは思われまい。"
  "translation_status": "reviewed"
- "id": "tub-section-03-019"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Having thus amply proved the antiquity of criticism and described the primitive state of it, I shall now examine the present condition of this Empire, and show how well it agrees with its ancient self [88]. A certain author, whose works have many ages since been entirely lost, does in his fifth book and eighth chapter say of critics that “their writings are the mirrors of learning.” This I understand in a literal sense, and suppose our author must mean that whoever designs to be a perfect writer must inspect into the books of critics, and correct his inventions there as in a mirror. Now, whoever considers that the mirrors of the ancients were made of brass and fine mercurio, may presently apply the two principal qualifications of a true modern critic, and consequently must needs conclude that these have always been and must be for ever the same. For brass is an emblem of duration, and when it is skilfully burnished will cast reflections from its own superficies without any assistance of mercury from behind. All the other talents of a critic will not require a particular mention, being included or easily deducible to these. However, I shall conclude with three maxims, which may serve both as characteristics to distinguish a true modern critic from a pretender, and will be also of admirable use to those worthy spirits who engage in so useful and honourable an art."
  "source_languages":
  - "en"
  - "la"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 134
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[129]"
  "translation_ja": "こうして批評の古さを十分に証明し、初期の状態を描いたので、今度は、この帝国の現状を調べ、昔の姿といかによく一致するかを示そう[88]。ある著者――その著作は、何世代も前に、すっかり失われている――は、第5巻第8章で、批評家について「その著作は学問の鏡である」と言っている。私はこれを文字どおりに解し、完全な著述家になろうとする者は、批評家の本をのぞき込み、鏡に映すように、そこで自分の着想を直さねばならない、という意味だと考える。さて、古代の鏡が、真鍮製で、水銀を使っていなかったことを考えれば、誰でもすぐ、近代の真の批評家の二つの主要な資質に当てはめられる。したがって、その資質は昔から常に同じであり、永遠に同じでなければならない、と結論せざるをえない。真鍮は持続の象徴であり、巧みに磨けば、背後の水銀の助けなしに、自分の表面から映像を返す。批評家のほかの才能は、どれもこの二つに含まれるか、容易に導かれるので、個別に挙げる必要はない。だが、最後に三つの格言を記そう。これは、近代の真の批評家を偽物から区別する特徴となるばかりか、これほど有用で名誉ある技に携わる、立派な精神の持ち主にも、大いに役立つだろう。"
  "translation_status": "reviewed"
  "source_variants":

- "id": "tub-note-61"
  "section_id": "notes"
  "kind": "note_body"
  "origin": "source"
  "source_text": "[61] In his subsequent apology for “The Tale of a Tub,” Swift wrote of these machines that, “In the original manuscript there was a description of a fourth, which those who had the papers in their power blotted out, as having something in it of satire that I suppose they thought was too particular; and therefore they were forced to change it to the number three, whence some have endeavoured to squeeze out a dangerous meaning that was never thought on. And indeed the conceit was half spoiled by changing the numbers; that of four being much more cabalistic, and therefore better exposing the pretended virtue of numbers, a superstition then intended to be ridiculed.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 277
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "anchor": "footnote61"
  "translation_ja": "[61] 後の『樽物語』弁明で、スウィフトは、これらの機械について、こう書いている。「元の原稿には、第四の機械の記述があったが、原稿を手にしていた者たちが消してしまった。何か、風刺があまりに特定の相手へ向いていると考えたのだろう。そのため、数を三に変えざるをえなくなった。そこから、考えたこともない危険な意味を、無理に絞り出そうとした者もいる。実際、数を変えたことで、趣向は半ば台無しになった。四のほうが、はるかにカバラ的であり、したがって、数にあるとされる力、当時嘲ろうとしていた迷信を、よく暴けたからである。」"
  "translation_status": "reviewed"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "署名・引用元は注本文に保持。注全体の著者・編者の帰属は未確定。"

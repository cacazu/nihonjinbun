  "kind": "paragraph"
  "origin": "source"
  "source_text": "But I forget that I am expatiating on a subject wherein I have no concern, having neither a talent nor an inclination for satire. On the other side, I am so entirely satisfied with the whole present procedure of human things, that I have been for some years preparing material towards “A Panegyric upon the World;” to which I intended to add a second part, entitled “A Modest Defence of the Proceedings of the Rabble in all Ages.” Both these I had thoughts to publish by way of appendix to the following treatise; but finding my common-place book fill much slower than I had reason to expect, I have chosen to defer them to another occasion. Besides, I have been unhappily prevented in that design by a certain domestic misfortune, in the particulars whereof, though it would be very seasonable, and much in the modern way, to inform the gentle reader, and would also be of great assistance towards extending this preface into the size now in vogue—which by rule ought to be large in proportion as the subsequent volume is small—yet I shall now dismiss our impatient reader from any further attendance at the porch; and having duly prepared his mind by a preliminary discourse, shall gladly introduce him to the sublime mysteries that ensue."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 65
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[67]"
  "translation_ja": "だが、忘れていた。風刺の才能も、その気もない私が、自分には関係のない話を長々と続けている。むしろ私は、人間界の今の運び方の一切に、心から満足している。それで何年も前から、『世間をたたえる頌辞』の材料を集めているほどだ。これには第二部として、『あらゆる時代の群衆のふるまいを、つつましく弁護する一論』を添えるつもりでいた。両方とも、以下の論考の付録として刊行しようと考えていたのだが、抜き書き帳の埋まる速さが、もっともな期待に比べてずっと遅いことに気づき、別の機会へ延ばすことにした。そのうえ、ある身内の不幸により、この計画は運悪く妨げられてしまった。そのいきさつを優しい読者にお話しすれば、たいへん時宜にかなってもおり、近代の流儀にもよく合い、序文を今流行の長さへ引き延ばすうえでも、大いに助かるだろう。規則によれば、後に続く本が薄いほど、序文は長くなければならないのだ。しかし、もう待ちきれない読者を、これ以上玄関で待たせるのはよそう。前置きの論説で心の準備を十分に整えていただいたところで、これから続く崇高な秘儀の中へ、喜んで御案内しよう。"
  "translation_status": "reviewed"

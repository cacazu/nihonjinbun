  "translation_ja": "次は、哲学に新体系を持ち込む偉人たちを調べよう。誰もが、知りえないと認める物事について、それほど熱心に新しい体系を打ち立てようと思いつく性向は、人間の魂の、どの機能から生じるのか。どんな種から芽生えるのか。そして、この大革新者たちは、多くの弟子を得たことを、人間性のどんな性質に負うのか。わかるまで探してみよう。というのも、彼らの主だった者のうち、古代にも近代にも、頭がおかしくなった、正気を失った人物だと、敵対者から、実際には自分の弟子を除く皆から、ふつう誤解された者が何人もいたことは明らかだからだ。日常の言葉や行いにおいて、彼らは、磨かれぬ理性の俗な指図とは、たいそう異なる方法に従っていた。各自のやり方は、今日のベドラム学園にいる、疑いのない後継者たちと、概して一致していた。その功績と原理は、しかるべき箇所で、さらに調べよう。この種の人には、エピクロス、ディオゲネス、アポロニオス、ルクレティウス、パラケルスス、デカルトなどがいた。彼らが今の世にいて、弟子から引き離され、きつく縛られていたら、見分けのつかぬわが時代では、瀉血、鞭、鎖、暗室、藁の、明白な危険にさらされるだろう。というのも、自然な状態、自然な思考の道筋にある人間の誰が、人類すべての観念を、自分のそれと、まったく同じ長さ、幅、高さにそろえられるなどと、考えたことがあろう。だが、理性の帝国の革新者たちは皆、最初にこのつつましく礼儀正しい計画を持つ。エピクロスは、あらゆる人々の意見が、絶え間なく、鋭いものと滑らかなもの、軽いものと重いもの、丸いものと四角いものと、押し合いへし合いした後、ある偶然の集まりによって、いつか、ある種の偏りを通じ、原子と空虚の観念へ結びつく、と控えめに希望した。万物の起源で、原子と空虚がそうしたように、である。デカルトは、死ぬ前に、すべての哲学者の意見が、その空想的な体系の小さな星々のように、自分の渦へさらわれ、引き込まれるのを見られると、見込んでいた。さて、このような想像が、ある人々の中に生まれるのを、どう説明できるのか、ぜひ教えていただきたい。私の示した、下位の機能から蒸気が昇り、脳を覆い、そこで概念へと蒸留される現象に頼らずに、である。そうした概念に、わが母語の乏しさは、いまだ狂気、または錯乱以外の名を与えていない。だから今度は、これらの偉大な処方者が、なぜ必ず、自分と自説のために、盲従する弟子を大勢そろえられるのか、推測してみよう。理由は容易に示せると思う。人間の理解力の調和には、ある固有の弦があり、いくつもの個人の間で、まったく同じ調律になっているのだ。それを巧みに、正しい音高へ締め上げ、軽く弾く。幸運にも、同じ音の者たちの中へ行き当たれば、彼らも、秘密の必然的な共鳴によって、まったく同時に鳴り出す。この一事情に、事の技術、あるいは幸運のすべてがある。もし、自分より高いか低い音の者たちの間で、うっかり弦を鳴らせば、教説に賛同するどころか、彼らはあなたを縛りつけ、気違いと呼び、パンと水をあてがうだろう。だから、人と時の違いに応じて、この高貴な才能を見分け、適応させるのは、最も繊細な身の処し方の問題なのである。キケロは、この点をよく心得ていた。イングランドにいる友人へ手紙を書き、ほかの注意とともに、わが国の辻馬車の御者に騙されぬよう警告した際――当時も今と同じく、とんだ悪党だったらしい――次の注目すべき言葉を記している。「少しは賢く見える土地へ来たことを、喜んでもよかろう。」[129]　大胆に真実を言えば、ある集まりでは哲学者として扱われうるのに、別の集まりでは愚か者に見えるよう、事を下手に運ぶのは、致命的な失敗なのだ。知り合いのある紳士方には、たいそう時宜にかなうほのめかしとして、心にしまっていただきたい。"

- "id": "tub-section-07-002"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have sometimes heard of an Iliad in a nut-shell, but it has been my fortune to have much oftener seen a nut-shell in an Iliad. There is no doubt that human life has received most wonderful advantages from both; but to which of the two the world is chiefly indebted, I shall leave among the curious as a problem worthy of their utmost inquiry. For the invention of the latter, I think the commonwealth of learning is chiefly obliged to the great modern improvement of digressions. The late refinements in knowledge, running parallel to those of diet in our nation, which among men of a judicious taste are dressed up in various compounds, consisting in soups and olios, fricassees and ragouts."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 182
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[169]"
  "translation_ja": "木の実の殻に収まる『イリアス』という話は、ときどき聞いたことがある。だが、私のめぐり合わせでは、『イリアス』の中に木の実の殻が入っているものを、はるかによく見てきた。どちらからも、人間生活が驚くほどの利益を受けてきたことには、疑いがない。しかし、世間がとくにどちらへ恩を負うかは、好奇心ある方々の間に、最大限の探究に値する問題として、残しておこう。後者の発明について、学問の共和国は、主として、近代の脱線という大改良に恩を負うと、私は思う。近頃の知識の洗練は、わが国の食事の洗練と並行している。味のわかる人々のもとでは、さまざまな混ぜ物として料理され、スープ、大鍋の煮込み、フリカッセ、ラグーとなっているのである。"
  "translation_status": "reviewed"
- "id": "tub-section-07-003"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is true there is a sort of morose, detracting, ill-bred people who pretend utterly to disrelish these polite innovations. And as to the similitude from diet, they allow the parallel, but are so bold as to pronounce the example itself a corruption and degeneracy of taste. They tell us that the fashion of jumbling fifty things together in a dish was at first introduced in compliance to a depraved and debauched appetite, as well as to a crazy constitution, and to see a man hunting through an olio after the head and brains of a goose, a widgeon, or a woodcock, is a sign he wants a stomach and digestion for more substantial victuals. Further, they affirm that digressions in a book are like foreign troops in a state, which argue the nation to want a heart and hands of its own, and often either subdue the natives, or drive them into the most unfruitful corners."
  "source_languages":
  - "en"
  "source_locations":

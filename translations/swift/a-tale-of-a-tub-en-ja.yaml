- "id": "tub-section-08-004"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This is what the Adepti understand by their anima mundi, that is to say, the spirit, or breath, or wind of the world; or examine the whole system by the particulars of Nature, and you will find it not to be disputed. For whether you please to call the forma informans of man by the name of spiritus, animus, afflatus, or anima, what are all these but several appellations for wind, which is the ruling element in every compound, and into which they all resolve upon their corruption. Further, what is life itself but, as it is commonly called, the breath of our nostrils, whence it is very justly observed by naturalists that wind still continues of great emolument in certain mysteries not to be named, giving occasion for those happy epithets of turgidus and inflatus, applied either to the emittent or recipient organs."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 197
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[182]"
  "translation_ja": "これは、秘術の達人たちが、世界霊魂という名で理解するもの、すなわち、世界の霊、または息、または風にほかならない。あるいは、自然の個々の事物から、この体系全体を調べてみれば、争う余地がないとわかるだろう。人間に形を与える形相を、スピリトゥス、アニムス、アフラトゥス、アニマ、そのどの名で呼ぼうと、それらはみな、風の異名ではないか。風こそ、あらゆる複合体を支配する元素であり、腐敗すれば、すべてがそこへ還るのである。さらに、生命そのものも、一般に言われるとおり、鼻孔の息にほかならないではないか。そこから、博物学者は、まことに正しく観察している。名指しできぬ、ある種の秘儀では、風が今も大いに役立つ。それゆえ、送り出す器官にも、受け入れる器官にも、「膨れた」「吹きふくらんだ」という、幸せな形容が与えられるのだ、と。"
  "translation_status": "reviewed"
- "id": "tub-section-08-005"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "By what I have gathered out of ancient records, I find the compass of their doctrine took in two-and-thirty points, wherein it would be tedious to be very particular. However, a few of their most important precepts deducible from it are by no means to be omitted; among which, the following maxim was of much weight: That since wind had the master share as well as operation in every compound, by consequence those beings must be of chief excellence wherein that primordium appears most prominently to abound, and therefore man is in highest perfection of all created things, as having, by the great bounty of philosophers, been endued with three distinct animas or winds, to which the sage Æolists, with much liberality, have added a fourth, of equal necessity as well as ornament with the other three, by this quartum principium taking in the four corners of the world. Which gave occasion to that renowned cabalist Bombastus [119a] of placing the body of man in due position to the four cardinal points."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 198
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[183]"
  "translation_ja": "古い記録から集めたところによると、彼らの教説の羅針盤は、三十二方位を含んでいたらしい。あまり詳しく記しては、退屈になるだろう。しかし、そこから導かれる、最も重要な教えをいくつか、決して省くわけにはいかない。中でも、次の格言は、たいそう重んじられた。風は、どの複合体でも、量においても働きにおいても、最大の部分を占める。したがって、この根源物質が、とくに豊かに満ちている存在こそ、最も優れているはずだ。それゆえ、人間は、すべての被造物の中で、最高の完成にある。哲学者たちの大いなる気前のよさにより、三つの異なる魂、つまり風を授かっているからである。賢い風崇拝者たちは、たいそう寛大にも、それに第四を加えた。ほかの三つと同じく、必要でもあれば、飾りにもなるものだ。この第四の原理によって、世界の四隅を取り込んだのである。これがきっかけで、名高いカバラ学者ボンバストゥス[119a]は、人間の体を、東西南北の四方位へ、正しく位置づけた。"
  "translation_status": "reviewed"
- "id": "tub-section-08-006"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In consequence of this, their next principle was that man brings with him into the world a peculiar portion or grain of wind, which may be called a quinta essentia extracted from the other four. This quintessence is of catholic use upon all emergencies of life, is improveable into all arts and sciences, and may be wonderfully refined as well as enlarged by certain methods in education. This, when blown up to its perfection, ought not to be covetously boarded up, stifled, or hid under a bushel, but freely communicated to mankind. Upon these reasons, and others of equal weight, the wise Æolists affirm the gift of belching to be the noblest act of a rational creature. To cultivate which art, and render it more serviceable to mankind, they made use of several methods. At certain seasons of the year you might behold the priests amongst them in vast numbers with their mouths gaping wide against a storm. At other times were to be seen several hundreds linked together in a circular chain, with every man a pair of bellows applied to his neighbour, by which they blew up each other to the shape and size of a tun; and for that reason with great propriety of speech did usually call their bodies their vessels [119b]. When, by these and the like performances, they were grown sufficiently replete, they would immediately depart, and disembogue for the public good a plentiful share of their acquirements into their disciples’ chaps. For we must here observe that all learning was esteemed among them to be compounded from the same principle. Because, first, it is generally affirmed or confessed that learning puffeth men up; and, secondly, they proved it by the following syllogism: “Words are but wind, and learning is nothing but words; ergo, learning is nothing but wind.” For this reason the philosophers among them did in their schools deliver to their pupils all their doctrines and opinions by eructation, wherein they had acquired a wonderful eloquence, and of incredible variety. But the great characteristic by which their chief sages were best distinguished was a certain position of countenance, which gave undoubted intelligence to what degree or proportion the spirit agitated the inward mass. For after certain gripings, the wind and vapours issuing forth, having first by their turbulence and convulsions within caused an earthquake in man’s little world, distorted the mouth, bloated the cheeks, and gave the eyes a terrible kind of relievo. At which junctures all their belches were received for sacred, the sourer the better, and swallowed with infinite consolation by their meagre devotees. And to render these yet more complete, because the breath of man’s life is in his nostrils, therefore the choicest, most edifying, and most enlivening belches were very wisely conveyed through that vehicle to give them a tincture as they passed."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 199
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[184]"
  "translation_ja": "この結果、次の原理が生まれた。人間は世に生まれるとき、固有のひと分け、あるいは一粒の風を持参する。それは、ほかの四つから抽出された第五精髄と呼んでもよい。この精髄は、人生のあらゆる急場に普遍的に役立ち、あらゆる学芸へ発展させられ、教育の一定の方法によって、驚くほど洗練することも、膨らませることもできる。完成まで吹きふくらませたら、欲深くしまい込み、押し殺し、枡の下へ隠すのではなく、人類へ惜しみなく分け与えねばならない。この理由と、同じほど重い、ほかの理由から、賢明な風崇拝者たちは、げっぷの賜物こそ、理性的な生き物の最も高貴な行為だと断言する。この技を育て、人類の役にいっそう立たせるため、彼らはさまざまな方法を使った。一年のある時期には、彼らの祭司が、大勢で口を大きく開け、嵐へ向かっているのを見ることができた。別のときには、数百人が輪につながり、一人ずつ、隣人にふいごをあてがい、互いを大樽の形と大きさへ膨らませているのが見られた。このため、実に適切な言葉遣いで、自分の体を、ふつう「器」と呼んだ[119b]。こうしたことや、それに類する行いで、十分満ち足りると、すぐに出かけ、獲得したもののたっぷりした分け前を、公共のため、弟子たちの口へ放出した。ここで注意しておかねばならないが、彼らの間では、すべての学問は、同じ原理から組み立てられると考えられていた。第一に、学問は人を膨れ上がらせると、一般に断言され、認められているからである。第二に、次の三段論法で証明したからだ。「言葉は風にすぎず、学問は言葉にすぎない。ゆえに、学問は風にすぎない。」このため、彼らの哲学者たちは、学堂で、生徒へあらゆる教義と意見を、げっぷによって伝えた。それについては、驚くべき雄弁と、信じがたいほどの多様さを身につけていた。しかし、主だった賢者をいちばんよく見分けられる大きな特徴は、ある顔つきだった。内側の塊を、霊がどの程度、どの割合で揺り動かしているか、疑いのない情報を与えてくれるのだ。いくらか腹が差し込んだ後、風と蒸気が外へ出る。その前には、内部の乱れと痙攣によって、人間という小世界で地震を起こし、口を歪め、頬をふくらませ、目を恐ろしいほど浮き上がらせる。この局面でのげっぷは、すべて神聖とされ、酸っぱいほどよく、痩せた信者たちに、限りない慰めとともに飲み込まれた。そして、いっそう完全なものにするため、人の命の息は鼻孔にあるという理由から、最上で、最も教化的で、最も生気に富むげっぷは、賢くも鼻という通り道を通され、途中で風味をつけられたのである。"
  "translation_status": "reviewed"
- "id": "tub-section-08-007"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Their gods were the four winds, whom they worshipped as the spirits that pervade and enliven the universe, and as those from whom alone all inspiration can properly be said to proceed. However, the chief of these, to whom they performed the adoration of Latria, was the Almighty North, an ancient deity, whom the inhabitants of Megalopolis in Greece had likewise in highest reverence. “Omnium deorum Boream maxime celebrant.” [120] This god, though endued with ubiquity, was yet supposed by the profounder Æolists to possess one peculiar habitation, or (to speak in form) a cælum empyræum, wherein he was more intimately present. This was situated in a certain region well known to the ancient Greeks, by them called Σχοτία, the Land of Darkness. And although many controversies have arisen upon that matter, yet so much is undisputed, that from a region of the like denomination the most refined Æolists have borrowed their original, from whence in every age the zealous among their priesthood have brought over their choicest inspiration, fetching it with their own hands from the fountain-head in certain bladders, and disploding it among the sectaries in all nations, who did, and do, and ever will, daily gasp and pant after it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 200
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[185]"
  "translation_ja": "彼らの神々は四方の風であり、宇宙を貫き、活気づける霊として、また、あらゆる霊感はそこからのみ来ると、正しく言いうるものとして、崇拝された。だが、その中の首位、最高の礼拝を捧げられたのは、全能の北風だった。これは古い神で、ギリシアのメガロポリスの住民も、最高の崇敬を払っていた。「あらゆる神々のうち、北風を最もたたえる。」[120]　この神は、どこにでもいる力を備えながら、とくに一つの住まい、正式に言えば火天を持ち、そこではいっそう身近に臨在すると、深遠な風崇拝者たちは考えた。その場所は、古代ギリシア人によく知られた、ある地方にあった。彼らはそこをスコティア、暗闇の国と呼んだ。この問題には多くの論争があるが、少なくとも一つは争われていない。最も洗練された風崇拝者は、似た名の地方に起源を負っている。各時代の、熱心な祭司たちは、最上の霊感を、そこから持ち帰ってきた。自分の手で、ある種の袋に源泉から汲み、あらゆる国の宗徒へ向けて破裂させたのだ。宗徒たちは、それを求め、日々あえぎ、息を切らしてきたし、今もそうし、これからも永遠にそうするだろう。"
  "translation_status": "reviewed"
- "id": "tub-section-08-008"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now their mysteries and rites were performed in this manner. It is well known among the learned that the virtuosos of former ages had a contrivance for carrying and preserving winds in casks or barrels, which was of great assistance upon long sea-voyages, and the loss of so useful an art at present is very much to be lamented, though, I know not how, with great negligence omitted by Pancirollus. It was an invention ascribed to Æolus himself, from whom this sect is denominated, and who, in honour of their founder’s memory, have to this day preserved great numbers of those barrels, whereof they fix one in each of their temples, first beating out the top. Into this barrel upon solemn days the priest enters, where, having before duly prepared himself by the methods already described, a secret funnel is also conveyed to the bottom of the barrel, which admits new supplies of inspiration from a northern chink or cranny. Whereupon you behold him swell immediately to the shape and size of his vessel. In this posture he disembogues whole tempests upon his auditory, as the spirit from beneath gives him utterance, which issuing ex adytis and penetralibus, is not performed without much pain and griping. And the wind in breaking forth deals with his face as it does with that of the sea, first blackening, then wrinkling, and at last bursting it into a foam. It is in this guise the sacred Æolist delivers his oracular belches to his panting disciples, of whom some are greedily gaping after the sanctified breath, others are all the while hymning out the praises of the winds, and gently wafted to and fro by their own humming, do thus represent the soft breezes of their deities appeased."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 201
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[186]"
  "translation_ja": "さて、彼らの秘儀と祭式は、次のように行われた。昔の物知りたちが、風を樽や桶に入れ、運び、保存する工夫を持ち、長い航海で大いに役立てたことは、学者の間でよく知られている。今、これほど有用な技が失われたのは、まことに嘆かわしい。どうしたことか、パンチロルスも、ひどく不注意に、この件を落としているが。この発明は、アイオロス自身によるとされ、宗派の名も、この神から取られた。創始者の記憶を尊び、彼らは今日まで、その樽を大量に保存している。そして、まず天板を打ち抜いてから、寺院ごとに一つを据える。儀式の日には、祭司がこの樽へ入る。すでに述べた方法で、あらかじめ十分に身を整えているが、さらに樽の底へ、秘密の漏斗が通される。それが北向きの隙間から、新しい霊感を補給する。すると、たちまち彼が、器と同じ形、大きさへ膨れ上がるのが見える。この姿勢で、下からの霊が語らせるまま、嵐を丸ごと、聴衆へ吐き出す。それは内陣と奥の聖所から出るため、相当の痛みと腹の差し込みを伴う。そして、噴き出す風は、海面に対すると同じように、その顔を扱う。まず黒ずませ、次に皺立たせ、最後に泡を噴かせるのである。この姿で、神聖な風崇拝者は、神託のげっぷを、息を切らす弟子たちへ授ける。ある者は、聖なる息を求めて、貪欲に口を開け、ほかの者は、その間ずっと風をたたえて唱和する。自分たちの唸るような声に、ゆるゆると前後に揺られ、なだめられた神々の、穏やかなそよ風を表すのである。"
  "translation_status": "reviewed"
- "id": "tub-section-08-009"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is from this custom of the priests that some authors maintain these Æolists to have been very ancient in the world, because the delivery of their mysteries, which I have just now mentioned, appears exactly the same with that of other ancient oracles, whose inspirations were owing to certain subterraneous effluviums of wind delivered with the same pain to the priest, and much about the same influence on the people. It is true indeed that these were frequently managed and directed by female officers, whose organs were understood to be better disposed for the admission of those oracular gusts, as entering and passing up through a receptacle of greater capacity, and causing also a pruriency by the way, such as with due management has been refined from carnal into a spiritual ecstasy. And to strengthen this profound conjecture, it is further insisted that this custom of female priests is kept up still in certain refined colleges of our modern Æolists [122], who are agreed to receive their inspiration, derived through the receptacle aforesaid, like their ancestors the Sybils."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 202
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[187]"
  "translation_ja": "ある著者たちが、この風崇拝者は、世界でたいそう古いものだと主張するのは、祭司のこの習慣からである。今述べた秘儀の伝え方が、ほかの古代の神託と、まったく同じに見えるからだ。その霊感も、地下から出る、ある種の風の発散に負い、祭司に同じ痛みを与えて発せられ、民衆にも、ほぼ同じ作用を及ぼした。もっとも、古代の神託は、しばしば女性の役人によって取り仕切られた。女性の器官のほうが、その神託の突風を受け入れるのに適していると、理解されていたからである。風は、もっと容量の大きな受け口から入り、上へ抜け、道すがら、ある種のむずがゆさを引き起こす。それは適切に扱えば、肉体の恍惚から、霊の恍惚へと精製できるものだった。この深遠な推測を強めるため、さらに次の点も主張される。女祭司の習慣は、近代の風崇拝者の、とくに洗練された、ある種の学寮で、今も保たれている[122]。彼らは、先祖の巫女シビュラたちのように、先に述べた受け口を通じて来る霊感を受け入れることで、一致しているのだ。"
  "translation_status": "reviewed"
- "id": "tub-section-08-010"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And whereas the mind of man, when he gives the spur and bridle to his thoughts, does never stop, but naturally sallies out into both extremes of high and low, of good and evil, his first flight of fancy commonly transports him to ideas of what is most perfect, finished, and exalted, till, having soared out of his own reach and sight, not well perceiving how near the frontiers of height and depth border upon each other, with the same course and wing he falls down plump into the lowest bottom of things, like one who travels the east into the west, or like a straight line drawn by its own length into a circle. Whether a tincture of malice in our natures makes us fond of furnishing every bright idea with its reverse, or whether reason, reflecting upon the sum of things, can, like the sun, serve only to enlighten one half of the globe, leaving the other half by necessity under shade and darkness, or whether fancy, flying up to the imagination of what is highest and best, becomes over-short, and spent, and weary, and suddenly falls, like a dead bird of paradise, to the ground; or whether, after all these metaphysical conjectures, I have not entirely missed the true reason; the proposition, however, which has stood me in so much circumstance is altogether true, that as the most uncivilised parts of mankind have some way or other climbed up into the conception of a God or Supreme Power, so they have seldom forgot to provide their fears with certain ghastly notions, which, instead of better, have served them pretty tolerably for a devil. And this proceeding seems to be natural enough, for it is with men whose imaginations are lifted up very high after the same rate as with those whose bodies are so, that as they are delighted with the advantage of a nearer contemplation upwards, so they are equally terrified with the dismal prospect of the precipice below. Thus in the choice of a devil it has been the usual method of mankind to single out some being, either in act or in vision, which was in most antipathy to the god they had framed. Thus also the sect of the Æolists possessed themselves with a dread and horror and hatred of two malignant natures, betwixt whom and the deities they adored perpetual enmity was established. The first of these was the chameleon, sworn foe to inspiration, who in scorn devoured large influences of their god, without refunding the smallest blast by eructation. The other was a huge terrible monster called Moulinavent, who with four strong arms waged eternal battle with all their divinities, dexterously turning to avoid their blows and repay them with interest. [123]"

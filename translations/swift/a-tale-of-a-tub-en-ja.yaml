  "source_text": "This, indeed, was the fatal mistake of that worthy gentleman, my most ingenious friend Mr. Wotton, a person in appearance ordained for great designs as well as performances, whether you will consider his notions or his looks. Surely no man ever advanced into the public with fitter qualifications of body and mind for the propagation of a new religion. Oh, had those happy talents, misapplied to vain philosophy, been turned into their proper channels of dreams and visions, where distortion of mind and countenance are of such sovereign use, the base, detracting world would not then have dared to report that something is amiss, that his brain hath undergone an unlucky shake, which even his brother modernists themselves, like ungrates, do whisper so loud that it reaches up to the very garret I am now writing in."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 214
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[197]"
  "translation_ja": "実際、これこそ、かの立派な紳士、私のたいそう才気ある友人、ウォットン氏の、致命的な誤りだった。その考えを見ても、外見を見ても、大きな計画と実行のために定められたらしい人物である。新しい宗教を広めるため、これほど適切な心身の資質を備えて、公の場へ進み出た人は、きっと誰もいなかった。ああ、むなしい哲学へ誤って使われた、その幸せな才能が、夢と幻という、ふさわしい水路へ向けられていたなら。そこでは、心と顔の歪みが、それほど絶大な役に立つのだから。そうすれば、卑しく、中傷好きな世間も、何か具合が悪い、脳が不幸な揺れを受けた、などという噂を流す勇気はなかっただろう。仲間の近代派たちまで、恩知らずにも、私が今書いている屋根裏部屋へ届くほど、大きな囁き声で言っている、あの噂を。"
  "translation_status": "reviewed"
- "id": "tub-section-09-009"
  "section_id": "section-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lastly, whoever pleases to look into the fountains of enthusiasm, from whence in all ages have eternally proceeded such fattening streams, will find the spring-head to have been as troubled and muddy as the current. Of such great emolument is a tincture of this vapour, which the world calls madness, that without its help the world would not only be deprived of those two great blessings, conquests and systems, but even all mankind would unhappily be reduced to the same belief in things invisible. Now the former postulatum being held, that it is of no import from what originals this vapour proceeds, but either in what angles it strikes and spreads over the understanding, or upon what species of brain it ascends, it will be a very delicate point to cut the feather and divide the several reasons to a nice and curious reader, how this numerical difference in the brain can produce effects of so vast a difference from the same vapour as to be the sole point of individuation between Alexander the Great, Jack of Leyden, and Monsieur Des Cartes. The present argument is the most abstracted that ever I engaged in; it strains my faculties to their highest stretch, and I desire the reader to attend with utmost perpensity, for I now proceed to unravel this knotty point."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 215
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[198]"
  "translation_ja": "最後に、熱狂の源泉をのぞこうとする者は、いつの時代にも、そこから絶えず肥沃な流れが出てきた、その水源が、流れそのものと同じほど、濁り、泥だらけだったと見つけるだろう。世間が狂気と呼ぶ、この蒸気が少し混じるだけで、これほど大きな利益がある。その助けなしには、世界は、征服と体系という二つの大いなる祝福を失うばかりか、人類すべてが、不幸にも、目に見えない物事について、同じ信仰へ引き戻されてしまうのである。さて、先の要請、すなわち、この蒸気がどこから来るかは問題ではなく、理解力へどんな角度で当たり、広がるか、あるいは、どんな種類の脳へ昇るかが問題だ、ということを認めよう。そうすると、繊細で好奇心ある読者のため、この羽根を裂き、理由を一つずつ分けて示すのは、たいそう微妙な仕事となる。脳における、この個体ごとの違いが、同じ蒸気から、なぜあれほど大きく異なる効果を生み、アレクサンドロス大王、ライデンのジャック、デカルト氏を、それぞれ別人たらしめる唯一の点となるのか、という問題だ。これは、私がこれまで携わったうち、最も抽象的な議論であり、能力を限界まで引き伸ばす。どうか読者には、最大限の思い入れをもって注意していただきたい。いよいよ、この結び目の多い問題を解きほぐすのである。"
  "translation_status": "reviewed"

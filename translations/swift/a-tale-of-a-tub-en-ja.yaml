- "id": "tub-section-03-020"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The first is, that criticism, contrary to all other faculties of the intellect, is ever held the truest and best when it is the very first result of the critic’s mind; as fowlers reckon the first aim for the surest, and seldom fail of missing the mark if they stay not for a second."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 135
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[130]"
  "translation_ja": "第一に、批評は、ほかのあらゆる知的能力と違い、批評家の心が最初に生み出したものこそ、最も真実で、最良とみなされる。鳥猟師が、最初の狙いをいちばん確かとし、二度目を待たなければ、ほとんど必ず的を外すと考えるのと同じである。"
  "translation_status": "reviewed"
- "id": "tub-section-03-021"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Secondly, the true critics are known by their talent of swarming about the noblest writers, to which they are carried merely by instinct, as a rat to the best cheese, or a wasp to the fairest fruit. So when the king is a horseback he is sure to be the dirtiest person of the company, and they that make their court best are such as bespatter him most."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 136
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[131]"
  "translation_ja": "第二に、真の批評家は、最も優れた著者の周囲へ群がる才能で見分けられる。最良のチーズへ寄る鼠や、いちばん美しい果実へ寄る蜂のように、ただ本能に動かされて集まる。国王が馬に乗ると、一行のうちで必ずいちばん泥まみれになるのと同じだ。最もうまく御機嫌を取るのは、最も多く泥をはねかける者なのである。"
  "translation_status": "reviewed"
- "id": "tub-section-03-022"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lastly, a true critic in the perusal of a book is like a dog at a feast, whose thoughts and stomach are wholly set upon what the guests fling away, and consequently is apt to snarl most when there are the fewest bones [89]."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 137
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[132]"
  "translation_ja": "最後に、真の批評家が本を読むさまは、宴会の犬に似ている。考えも腹も、客が捨てるものだけを目当てにしているので、骨が最も少ないとき、最もよく唸るものだ[89]。"
  "translation_status": "reviewed"
- "id": "tub-section-03-023"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Thus much I think is sufficient to serve by way of address to my patrons, the true modern critics, and may very well atone for my past silence, as well as that which I am like to observe for the future. I hope I have deserved so well of their whole body as to meet with generous and tender usage at their hands. Supported by which expectation I go on boldly to pursue those adventures already so happily begun."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 138
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[133]"
  "translation_ja": "私の庇護者である、近代の真の批評家たちへの挨拶としては、これで十分だろう。これまでの沈黙も、おそらく今後守ることになる沈黙も、十分償えると思う。一団全体にこれほど尽くした以上、寛大で優しい扱いを受けられるものと願う。その期待を支えに、すでにあれほど幸先よく始まった冒険の続きを、勇んでたどることにしよう。"
  "translation_status": "reviewed"
- "id": "tub-section-04-001"
  "section_id": "section-04"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    SECTION IV.
     A TALE OF A TUB.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 139
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/h3[9]"
  "translation_ja": |-
    第4節
    樽物語
  "translation_status": "reviewed"
- "id": "tub-section-04-002"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have now with much pains and study conducted the reader to a period where he must expect to hear of great revolutions. For no sooner had our learned brother, so often mentioned, got a warm house of his own over his head, than he began to look big and to take mightily upon him, insomuch that unless the gentle reader out of his great candour will please a little to exalt his idea, I am afraid he will henceforth hardly know the hero of the play when he happens to meet him, his part, his dress, and his mien being so much altered."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 140
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[134]"
  "translation_ja": "さて、多くの労苦と研究を重ね、読者を、大きな変革の話を聞くことになる時点まで導いてきた。というのも、たびたび登場した物知りの兄弟は、自分のものとなった暖かい家の屋根を頭上に得るやいなや、威張り始め、たいそう尊大に振る舞うようになったからだ。その変わりようは、優しい読者が、その寛大なお心から、彼についての思い描き方を、少し高くしてくださらないかぎり、今後この芝居の主人公に出くわしても、見分けがつかぬのではないかと、心配になるほどである。役柄も衣装も物腰も、それほど変わったのだ。"
  "translation_status": "reviewed"
- "id": "tub-section-04-003"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He told his brothers he would have them to know that he was their elder, and consequently his father’s sole heir; nay, a while after, he would not allow them to call him brother, but Mr. Peter; and then he must be styled Father Peter, and sometimes My Lord Peter. To support this grandeur, which he soon began to consider could not be maintained without a better fonde than what he was born to, after much thought he cast about at last to turn projector and virtuoso, wherein he so well succeeded, that many famous discoveries, projects, and machines which bear great vogue and practice at present in the world, are owing entirely to Lord Peter’s invention. I will deduce the best account I have been able to collect of the chief amongst them, without considering much the order they came out in, because I think authors are not well agreed as to that point."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 141
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[135]"
  "translation_ja": "彼は兄弟たちに、自分が長男で、したがって父のただ一人の相続人であると、よく覚えておくように言った。それどころか、しばらくすると、兄弟と呼ぶことさえ許さず、ピーター氏と呼ばせた。次にはピーター神父、ときにはピーター卿と呼ばねばならなくなった。この威厳を支えるには、生まれ持った資力より、もっと確かな財源が要ると、すぐに考え始めた。さんざん思案した末、計画屋かつ物知りの研究家になろうと目をつけた。これがたいそううまくいき、今、世間で大流行し、広く使われている数々の有名な発見、計画、機械は、まったくピーター卿の発明によるものとなった。主なものについて、集められたかぎりの最良の報告を、これから述べよう。出現した順序にはあまりこだわらない。その点では、著者たちの意見が、よく一致していないように思うからだ。"
  "translation_status": "reviewed"
- "id": "tub-section-04-004"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I hope when this treatise of mine shall be translated into foreign languages (as I may without vanity affirm that the labour of collecting, the faithfulness in recounting, and the great usefulness of the matter to the public, will amply deserve that justice), that of the several Academies abroad, especially those of France and Italy, will favourably accept these humble offers for the advancement of universal knowledge. I do also advertise the most reverend fathers the Eastern missionaries that I have purely for their sakes made use of such words and phrases as will best admit an easy turn into any of the Oriental languages, especially the Chinese. And so I proceed with great content of mind upon reflecting how much emolument this whole globe of earth is like to reap by my labours."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 142
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[136]"
  "translation_ja": "私のこの論考が外国語に翻訳された暁には――材料を集める労苦、語る際の忠実さ、内容の公共に対する大いなる有用さを考えれば、その程度の公正な扱いは十分に値すると、虚栄心なしに言ってよかろう――海外の各学士院、とりわけフランスとイタリアの学士院が、普遍的知識の増進のために、これらのつつましい提案を、好意的に受け取ってくださるよう願っている。また、東洋へ布教なさる、いとも尊い神父方にも、お知らせしておきたい。東洋のどの言葉へも、とりわけ中国語へ、容易に移せる語句を使ったのは、ひとえに神父方のためである。こうして、自分の労作から、この地球全体が、どれほどの利益を得ることになりそうかを思い、たいそう満ち足りた気持ちで、先へ進むのである。"
  "translation_status": "reviewed"
- "id": "tub-section-04-005"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The first undertaking of Lord Peter was to purchase a large continent, lately said to have been discovered in Terra Australis incognita. This tract of land he bought at a very great pennyworth from the discoverers themselves (though some pretended to doubt whether they had ever been there), and then retailed it into several cantons to certain dealers, who carried over colonies, but were all shipwrecked in the voyage; upon which Lord Peter sold the said continent to other customers again and again, and again and again, with the same success."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 143
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[137]"
  "translation_ja": "ピーター卿の最初の事業は、未知の南方大陸で、最近発見されたという、広大な陸地の購入だった。この土地を、発見者自身から、たいへん安く買い取った。もっとも、連中が本当にそこへ行ったのか、疑おうとする者もいた。その後、土地をいくつかの地区に分け、商人たちへ小売りした。彼らは植民者を運んだが、航海の途中で皆、難破してしまった。そこでピーター卿は、その大陸を、別の客へ、何度も何度も、また何度も何度も売り、毎回同じ成功を収めた。"
  "translation_status": "reviewed"
- "id": "tub-section-04-006"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The second project I shall mention was his sovereign remedy for the worms, especially those in the spleen. The patient was to eat nothing after supper for three nights; as soon as he went to bed, he was carefully to lie on one side, and when he grew weary, to turn upon the other. He must also duly confine his two eyes to the same object, and by no means break wind at both ends together without manifest occasion. These prescriptions diligently observed, the worms would void insensibly by perspiration ascending through the brain."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 144
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[138]"
  "translation_ja": "第二に挙げる計画は、虫、とりわけ脾臓に巣くう虫への特効療法である。患者は三晩、夕食後には何も食べてはならない。床に入ったら、注意して片側を下に寝る。疲れたら、反対側へ向きを変える。また、両目は必ず同じ物へ向け、明白な理由がないかぎり、上下両方の口から同時に風を出してはならない。この処方を丹念に守れば、虫は脳を通って上へ昇り、気づかぬうちに、汗となって排出されるという。"
  "translation_status": "reviewed"
- "id": "tub-section-04-007"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A third invention was the erecting of a whispering-office for the public good and ease of all such as are hypochondriacal or troubled with the cholic, as likewise of all eavesdroppers, physicians, midwives, small politicians, friends fallen out, repeating poets, lovers happy or in despair, bawds, privy-counsellors, pages, parasites and buffoons, in short, of all such as are in danger of bursting with too much wind. An ass’s head was placed so conveniently, that the party affected might easily with his mouth accost either of the animal’s ears, which he was to apply close for a certain space, and by a fugitive faculty peculiar to the ears of that animal, receive immediate benefit, either by eructation, or expiration, or evomition."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 145
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[139]"
  "translation_ja": "第三の発明は、囁き所の開設だった。公共の利益と、心気症や腹の疝痛に悩む人々の安楽のためであり、同じく、盗み聞きする者、医師、産婆、小政治家、仲違いした友人、詩を朗誦する詩人、うまくいっている恋人と絶望した恋人、取り持ち婆、枢密顧問官、小姓、寄食者、道化、つまり、風をためすぎて破裂しそうなすべての人のためでもあった。驢馬の頭が、きわめて都合よく据えられ、患う人は、そのどちらの耳にも、口を容易に近づけられる。しばらくの間、そこへぴたりと口を当てればよい。この動物の耳に特有の、風を逃がす働きによって、げっぷか、息か、吐瀉か、いずれかの形で、すぐに効き目が現れる。"
  "translation_status": "reviewed"
- "id": "tub-section-04-008"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Another very beneficial project of Lord Peter’s was an office of insurance for tobacco-pipes, martyrs of the modern zeal, volumes of poetry, shadows . . . and rivers, that these, nor any of these, shall receive damage by fire. From whence our friendly societies may plainly find themselves to be only transcribers from this original, though the one and the other have been of great benefit to the undertakers as well as of equal to the public."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 146
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[140]"
  "translation_ja": "ピーター卿の別の、きわめて有益な計画には、保険事務所があった。煙草のパイプ、近代の熱心さの殉教者、詩集、影……および河川に対し、そのいずれも火による損害を受けぬと保証するのである。ここから、わが共済組合も、ただこの原型を写したにすぎないと、はっきり悟ることができるだろう。もっとも、どちらも事業主には大きな利益を与え、公共にも等しい利益をもたらした。"
  "translation_status": "reviewed"
- "id": "tub-section-04-009"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Lord Peter was also held the original author of puppets and raree-shows, the great usefulness whereof being so generally known, I shall not enlarge farther upon this particular."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 147
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[141]"
  "translation_ja": "ピーター卿は、人形芝居と覗きからくりを初めて作った人ともされていた。その大いなる有用さは、誰にもよく知られているので、この件について、これ以上詳しくは述べない。"
  "translation_status": "reviewed"
- "id": "tub-section-04-010"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But another discovery for which he was much renowned was his famous universal pickle. For having remarked how your common pickle in use among housewives was of no farther benefit than to preserve dead flesh and certain kinds of vegetables, Peter with great cost as well as art had contrived a pickle proper for houses, gardens, towns, men, women, children, and cattle, wherein he could preserve them as sound as insects in amber. Now this pickle to the taste, the smell, and the sight, appeared exactly the same with what is in common service for beef, and butter, and herrings (and has been often that way applied with great success), but for its many sovereign virtues was quite a different thing. For Peter would put in a certain quantity of his powder pimperlim-pimp, after which it never failed of success. The operation was performed by spargefaction in a proper time of the moon. The patient who was to be pickled, if it were a house, would infallibly be preserved from all spiders, rats, and weasels; if the party affected were a dog, he should be exempt from mange, and madness, and hunger. It also infallibly took away all scabs and lice, and scalled heads from children, never hindering the patient from any duty, either at bed or board."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 148
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[142]"
  "translation_ja": "だが、彼をたいそう有名にした、もう一つの発見は、あの名高い万能漬け汁だった。主婦がふつう使う漬け汁は、死んだ肉や、ある種の野菜を保存する以外に役立たないと気づき、ピーターは、大きな費用と技巧をもって、家、庭、町、男、女、子供、家畜に使える漬け汁を工夫した。その中なら、琥珀の中の虫のように、傷まず保存できるのである。この漬け汁は、味、匂い、見た目では、牛肉、バター、鰊に日常使うものと、まったく同じだった。実際、その用途にもたびたび使われ、大成功した。しかし、多くの特効においては、まるで別物だった。ピーターが、秘伝の粉ピンパリン・ピンプを一定量入れると、その後は決して失敗しなかったからだ。処置は、月のよい時期を選び、振りかける方法で行った。漬けられる患者が家なら、必ず、あらゆる蜘蛛、鼠、イタチから守られる。患う者が犬なら、疥癬、狂犬病、飢えを免れる。また、子供の瘡蓋や虱や頭の皮膚病も、必ず除き去った。患者は寝床でも食卓でも、どんな務めも妨げられなかった。"
  "translation_status": "reviewed"
- "id": "tub-section-04-011"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But of all Peter’s rarities, he most valued a certain set of bulls, whose race was by great fortune preserved in a lineal descent from those that guarded the golden-fleece. Though some who pretended to observe them curiously doubted the breed had not been kept entirely chaste, because they had degenerated from their ancestors in some qualities, and had acquired others very extraordinary, but a foreign mixture. The bulls of Colchis are recorded to have brazen feet; but whether it happened by ill pasture and running, by an alloy from intervention of other parents from stolen intrigues; whether a weakness in their progenitors had impaired the seminal virtue, or by a decline necessary through a long course of time, the originals of nature being depraved in these latter sinful ages of the world—whatever was the cause, it is certain that Lord Peter’s bulls were extremely vitiated by the rust of time in the metal of their feet, which was now sunk into common lead. However, the terrible roaring peculiar to their lineage was preserved, as likewise that faculty of breathing out fire from their nostrils; which notwithstanding many of their detractors took to be a feat of art, and to be nothing so terrible as it appeared, proceeding only from their usual course of diet, which was of squibs and crackers. However, they had two peculiar marks which extremely distinguished them from the bulls of Jason, and which I have not met together in the description of any other monster beside that in Horace, “Varias inducere plumas,” and “Atrum definit in piscem.” For these had fishes tails, yet upon occasion could outfly any bird in the air. Peter put these bulls upon several employs. Sometimes he would set them a roaring to fright naughty boys and make them quiet. Sometimes he would send them out upon errands of great importance, where it is wonderful to recount, and perhaps the cautious reader may think much to believe it; an appetitus sensibilis deriving itself through the whole family from their noble ancestors, guardians of the Golden Fleece, they continued so extremely fond of gold, that if Peter sent them abroad, though it were only upon a compliment, they would roar, and spit, and belch, and snivel out fire, and keep a perpetual coil till you flung them a bit of gold; but then pulveris exigui jactu, they would grow calm and quiet as lambs. In short, whether by secret connivance or encouragement from their master, or out of their own liquorish affection to gold, or both, it is certain they were no better than a sort of sturdy, swaggering beggars; and where they could not prevail to get an alms, would make women miscarry and children fall into fits; who to this very day usually call sprites and hobgoblins by the name of bull-beggars. They grew at last so very troublesome to the neighbourhood, that some gentlemen of the North-West got a parcel of right English bull-dogs, and baited them so terribly, that they felt it ever after."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 149
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[143]"
  "translation_ja": "しかし、ピーターの珍品のうち、彼が最も大事にしていたのは、一群の雄牛だった。幸運にも、その血統は、金の羊毛を守った雄牛から、直系で保たれていた。ただし、詳しく観察したという者の中には、血統が完全には清らかに保たれていないのでは、と疑う者もいた。いくつかの性質では先祖より退化し、ほかには、たいそう異常な、よそから混じった性質を獲得していたからだ。コルキスの雄牛の脚は、青銅だったと記録されている。だが、悪い牧草や走り回るせいか、密かな情事によって別の親が入り、混ぜ物が生じたせいか、祖先の衰弱で種の力が損なわれたせいか、それとも、世界の罪深い末の時代には、自然の原型も堕落するので、長い時の流れに伴う、避けられぬ衰えのせいか。原因は何であれ、ピーター卿の雄牛の脚の金属が、時の錆によってひどく損なわれ、今では、ただの鉛へ落ちぶれたことは確かである。しかし、血筋に特有の恐ろしい吼え声と、鼻から火を噴く能力は保たれていた。もっとも、多くの中傷者は、それは細工の技であって、見かけほど恐ろしくなく、普段の食餌である花火や爆竹から来るだけだとみなしていた。とはいえ、この雄牛には、イアソンの雄牛と際立って違う、二つの特徴があった。その二つが一緒にある怪物は、ホラティウスの「さまざまな羽根を身につけ」、「下半身は黒い魚に終わる」という記述以外では、見たことがない。この牛には魚の尾があり、それでいて、いざとなれば、空のどんな鳥よりも速く飛べた。ピーターは、この雄牛たちを、さまざまな仕事につけた。ときには吼えさせ、悪い子をおびやかして、おとなしくさせた。ときには、たいそう重要な用事を託して送り出した。そのさまは、語るにも驚くばかりで、慎重な読者には信じにくいかもしれない。金の羊毛を守る高貴な先祖から、家系全体へ伝わる感覚的欲求のおかげで、牛たちは相変わらず、金をひどく好んだ。だから、ピーターが外へ使いに出すと、たとえ挨拶のためだけでも、金の一片を投げてやるまで、吼え、唾を吐き、げっぷをし、鼻水とともに火を吹き、絶えず大騒ぎした。しかし「わずかな塵を投ずれば」、子羊のように穏やかで静かになった。要するに、主人の密かな黙認か奨励によるのか、自分自身の金への卑しい食い気によるのか、あるいは両方によるのか、いずれにせよ、一種の頑強で威張り散らす乞食にすぎなかった。施しを得られない所では、女性を流産させ、子供にひきつけを起こさせた。そのため子供たちは今でも、お化けや悪鬼を、牛乞食という名で呼ぶことが多い。とうとう近所がひどく迷惑したので、北西のある紳士たちが、純粋なイングランド産のブルドッグをそろえ、牛たちにたいそう激しくけしかけた。その痛手は、その後もずっと残った。"
  "translation_status": "reviewed"
- "id": "tub-section-04-012"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I must needs mention one more of Lord Peter’s projects, which was very extraordinary, and discovered him to be master of a high reach and profound invention. Whenever it happened that any rogue of Newgate was condemned to be hanged, Peter would offer him a pardon for a certain sum of money, which when the poor caitiff had made all shifts to scrape up and send, his lordship would return a piece of paper in this form:—"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"

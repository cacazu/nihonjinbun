- "id": "tub-section-10-002"
  "section_id": "section-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is an unanswerable argument of a very refined age the wonderful civilities that have passed of late years between the nation of authors and that of readers. There can hardly pop out a play, a pamphlet, or a poem without a preface full of acknowledgments to the world for the general reception and applause they have given it, which the Lord knows where, or when, or how, or from whom it received. In due deference to so laudable a custom, I do here return my humble thanks to His Majesty and both Houses of Parliament, to the Lords of the King’s most honourable Privy Council, to the reverend the Judges, to the Clergy, and Gentry, and Yeomanry of this land; but in a more especial manner to my worthy brethren and friends at Will’s Coffee-house, and Gresham College, and Warwick Lane, and Moorfields, and Scotland Yard, and Westminster Hall, and Guildhall; in short, to all inhabitants and retainers whatsoever, either in court, or church, or camp, or city, or country, for their generosity and universal acceptance of this divine treatise. I accept their approbation and good opinion with extreme gratitude, and to the utmost of my poor capacity shall take hold of all opportunities to return the obligation."

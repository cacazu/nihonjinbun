- "id": "tub-dedication-002"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Sir,"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 31
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[34]"
  "translation_ja": "殿下"
  "translation_status": "reviewed"
- "id": "tub-dedication-003"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I here present your Highness with the fruits of a very few leisure hours, stolen from the short intervals of a world of business, and of an employment quite alien from such amusements as this; the poor production of that refuse of time which has lain heavy upon my hands during a long prorogation of Parliament, a great dearth of foreign news, and a tedious fit of rainy weather. For which, and other reasons, it cannot choose extremely to deserve such a patronage as that of your Highness, whose numberless virtues in so few years, make the world look upon you as the future example to all princes. For although your Highness is hardly got clear of infancy, yet has the universal learned world already resolved upon appealing to your future dictates with the lowest and most resigned submission, fate having decreed you sole arbiter of the productions of human wit in this polite and most accomplished age. Methinks the number of appellants were enough to shock and startle any judge of a genius less unlimited than yours; but in order to prevent such glorious trials, the person, it seems, to whose care the education of your Highness is committed, has resolved, as I am told, to keep you in almost an universal ignorance of our studies, which it is your inherent birthright to inspect."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 32
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[35]"
  "translation_ja": "ここに殿下へお捧げするのは、山なす仕事のわずかな合間から盗み取った、ほんの数時間の余暇の実りにございます。私の職務は、こうした戯れとはまるで縁がございません。議会が長らく休会し、海外の便りがひどく乏しく、雨続きにうんざりしていた間、持て余した時間の屑から生まれた、ささやかな産物です。そのためにも、またほかの理由からも、本作は殿下のような方の御庇護を、とりわけ受けるにふさわしいに違いありません。殿下はわずかのお年で数えきれない美徳を備え、やがてあらゆる君主の模範となる方と、世間から仰がれておられます。殿下はようやく幼年期を抜け出しかけたばかりでいらっしゃいますが、学問の世界全体はすでに、この洗練と完成を誇る時代の人間の才知の産物について、将来下される殿下の御裁定に、ひたすらへりくだって従い、訴え出ることに決めております。その唯一の判定者となる運命を、殿下はお持ちなのです。訴え出る者の数だけでも、殿下ほど無限の才をお持ちでない裁判官なら、恐れ驚いてしまうでしょう。ところが、こうした輝かしい審理を妨げるためか、殿下の教育を託された人物は、殿下が生来の権利としてお調べになるべき私どもの研究について、ほとんど何一つ殿下のお耳に入れぬ決意だと聞き及んでおります。"
  "translation_status": "reviewed"
- "id": "tub-dedication-004"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is amazing to me that this person should have assurance, in the face of the sun, to go about persuading your Highness that our age is almost wholly illiterate and has hardly produced one writer upon any subject. I know very well that when your Highness shall come to riper years, and have gone through the learning of antiquity, you will be too curious to neglect inquiring into the authors of the very age before you; and to think that this insolent, in the account he is preparing for your view, designs to reduce them to a number so insignificant as I am ashamed to mention; it moves my zeal and my spleen for the honour and interest of our vast flourishing body, as well as of myself, for whom I know by long experience he has professed, and still continues, a peculiar malice."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 33
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[36]"
  "translation_ja": "この人物が、白昼堂々、私どもの時代にはほとんどまったく学問がなく、どんな分野にも著述家を一人として生み出していないと、厚かましくも殿下に信じ込ませようとしているのは、驚くほかございません。殿下がお年を重ね、古代の学問を修められた暁には、すぐ前の時代の著述家についても、お知りにならずにはいられまいと、私はよく承知しております。それなのに、この無礼者が殿下のために準備している報告では、その著述家たちを、口にするのも恥ずかしいほど取るに足らない人数へと切り詰めるつもりだとは。大きく栄える私どもの仲間の名誉と利益のためにも、また、この人物から昔も今も特別な悪意を向けられていることを長年の経験で知る私自身のためにも、熱意と憤懣をかき立てられずにはいられません。"
  "translation_status": "reviewed"
- "id": "tub-dedication-005"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is not unlikely that, when your Highness will one day peruse what I am now writing, you may be ready to expostulate with your governor upon the credit of what I here affirm, and command him to show you some of our productions. To which he will answer—for I am well informed of his designs—by asking your Highness where they are, and what is become of them? and pretend it a demonstration that there never were any, because they are not then to be found. Not to be found! Who has mislaid them? Are they sunk in the abyss of things? It is certain that in their own nature they were light enough to swim upon the surface for all eternity; therefore, the fault is in him who tied weights so heavy to their heels as to depress them to the centre. Is their very essence destroyed? Who has annihilated them? Were they drowned by purges or martyred by pipes? Who administered them to the posteriors of —. But that it may no longer be a doubt with your Highness who is to be the author of this universal ruin, I beseech you to observe that large and terrible scythe which your governor affects to bear continually about him. Be pleased to remark the length and strength, the sharpness and hardness, of his nails and teeth; consider his baneful, abominable breath, enemy to life and matter, infectious and corrupting, and then reflect whether it be possible for any mortal ink and paper of this generation to make a suitable resistance. Oh, that your Highness would one day resolve to disarm this usurping maître de palais of his furious engines, and bring your empire hors du page."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 34
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[37]"
  "translation_ja": "いつの日か、今私が書いているものを殿下がお読みになれば、この主張を信用して、御養育係に抗議なさり、私どもの作品をいくつか見せよとお命じになるかもしれません。そのとき相手はどう答えるでしょう。私はその企みをよく存じております。そんな作品はどこにあるのか、どうなったのかと殿下に問い返し、その時点で見つからないことをもって、かつても一つも存在しなかった証拠と言い張るでしょう。見つからないですって！　置き忘れたのは誰でしょう。万物の奈落に沈んだのでしょうか。本来なら、どの作品も永遠に水面を漂えるほど軽かったことは確かです。ならば、踵に重い重りをつけ、地の中心まで沈めた者に非があるのです。その実体そのものが滅ぼされたのでしょうか。消し去ったのは誰でしょう。下剤で溺れさせられたのか、パイプの火で殉教させられたのか。誰がそれを、かの――の尻にあてがったのでしょう。しかし、この全面的な破滅を引き起こす者が誰か、殿下にもう疑う余地がないよう、どうか、御養育係がいつも気取って持ち歩いている、大きな恐ろしい鎌に御注目ください。その爪と歯がどれほど長く強く、鋭く硬いかを御覧ください。その息が、生命と物質の敵として、どれほど有害で忌まわしく、毒を広め、ものを腐らせるかをお考えください。そのうえで、この世代のはかないインクと紙に、十分な抵抗ができるものか、御判断願います。ああ、どうかいつの日か、権力を簒奪したこの宮宰から、荒々しい武器を取り上げ、殿下の帝国を後見の束縛から解き放っていただきたいものです。"
  "translation_status": "reviewed"
- "id": "tub-dedication-006"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It were endless to recount the several methods of tyranny and destruction which your governor is pleased to practise upon this occasion. His inveterate malice is such to the writings of our age, that, of several thousands produced yearly from this renowned city, before the next revolution of the sun there is not one to be heard of. Unhappy infants! many of them barbarously destroyed before they have so much as learnt their mother-tongue to beg for pity. Some he stifles in their cradles, others he frights into convulsions, whereof they suddenly die, some he flays alive, others he tears limb from limb, great numbers are offered to Moloch, and the rest, tainted by his breath, die of a languishing consumption."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 35
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[38]"
  "translation_ja": "御養育係がこの件でお楽しみになっている、暴虐と破壊の手口を数え始めたら、際限がございません。私どもの時代の著作を憎む心は根深く、この名高い都で毎年何千と生まれる作品も、太陽が次の一巡を終える前には、一つとして噂を聞かなくなります。哀れな赤子たち！　多くは、母語を覚えて情けを乞えるようにさえならぬうちに、残酷にも殺されてしまうのです。揺り籠の中で窒息させられるもの、おびえて痙攣を起こし、そのまま死ぬもの、生きながら皮を剝がれるもの、手足を引き裂かれるもの。大勢がモロクへの生贄となり、残りもその息に毒され、衰弱性の病でやつれ死にいたします。"
  "translation_status": "reviewed"
- "id": "tub-dedication-007"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But the concern I have most at heart is for our Corporation of Poets, from whom I am preparing a petition to your Highness, to be subscribed with the names of one hundred and thirty-six of the first race, but whose immortal productions are never likely to reach your eyes, though each of them is now an humble and an earnest appellant for the laurel, and has large comely volumes ready to show for a support to his pretensions. The never-dying works of these illustrious persons your governor, sir, has devoted to unavoidable death, and your Highness is to be made believe that our age has never arrived at the honour to produce one single poet."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 36
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[39]"
  "translation_ja": "しかし、私が何より気にかけておりますのは、私どもの詩人組合のことです。今、その第一級の詩人百三十六名の署名を添え、殿下へ嘆願書を差し上げようと準備しております。とはいえ、その不朽の作品が殿下のお目に届く見込みは、まずございません。一人一人は今、月桂冠を求めてつつましく熱心に訴え出ており、その請求を裏づける立派な大冊も用意しているのですが。殿下、これらの偉人の不滅の著作に、殿下の御養育係は避けがたい死を宣告しているのです。そして殿下は、私どもの時代が詩人をただの一人も生み出す栄誉にあずからなかったと、信じ込まされることになっております。"
  "translation_status": "reviewed"
- "id": "tub-dedication-008"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "We confess immortality to be a great and powerful goddess, but in vain we offer up to her our devotions and our sacrifices if your Highness’s governor, who has usurped the priesthood, must, by an unparalleled ambition and avarice, wholly intercept and devour them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 37
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[40]"
  "translation_ja": "なるほど不死は、偉大で力ある女神でしょう。しかし、祭司の座を奪った殿下の御養育係が、並ぶもののない野心と貪欲から、私どもの祈りも供物もことごとく横取りして食らい尽くすのであれば、私どもが女神に祈りと生贄を捧げても、むなしいばかりです。"
  "translation_status": "reviewed"
- "id": "tub-dedication-009"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "To affirm that our age is altogether unlearned and devoid of writers in any kind, seems to be an assertion so bold and so false, that I have been sometimes thinking the contrary may almost be proved by uncontrollable demonstration. It is true, indeed, that although their numbers be vast and their productions numerous in proportion, yet are they hurried so hastily off the scene that they escape our memory and delude our sight. When I first thought of this address, I had prepared a copious list of titles to present your Highness as an undisputed argument for what I affirm. The originals were posted fresh upon all gates and corners of streets; but returning in a very few hours to take a review, they were all torn down and fresh ones in their places. I inquired after them among readers and booksellers, but I inquired in vain; the memorial of them was lost among men, their place was no more to be found; and I was laughed to scorn for a clown and a pedant, devoid of all taste and refinement, little versed in the course of present affairs, and that knew nothing of what had passed in the best companies of court and town. So that I can only avow in general to your Highness that we do abound in learning and wit, but to fix upon particulars is a task too slippery for my slender abilities. If I should venture, in a windy day, to affirm to your Highness that there is a large cloud near the horizon in the form of a bear, another in the zenith with the head of an ass, a third to the westward with claws like a dragon; and your Highness should in a few minutes think fit to examine the truth, it is certain they would be all chanced in figure and position, new ones would arise, and all we could agree upon would be, that clouds there were, but that I was grossly mistaken in the zoography and topography of them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 38
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[41]"
  "translation_ja": "私どもの時代にはまるで学問がなく、どんな種類の著述家もいないと言い切るのは、あまりにも大胆で、あまりにも虚偽に満ちた主張に思われます。ときには私も、反対の事実なら、ほぼ反論の余地もない証明を挙げられるのではないかと考えたことがございます。たしかに、著述家の数は膨大で、作品もそれに応じて多いのですが、どれもあまりに急いで舞台から追い立てられるので、記憶からこぼれ、目から逃げてしまいます。この献辞を思い立ったとき、私は自分の主張の動かぬ証拠として殿下にお見せするため、大量の書名の一覧を用意しておりました。元の広告は、どの門にも、どの街角にも、貼られたばかりでした。ところが、ほんの数時間後に確かめに戻ると、全部引き剝がされ、新しいものに替わっていたのです。読者や書店主に尋ねましたが、むだでした。その記憶は人々の間から失われ、あった場所さえもう見つかりません。私は、趣味も洗練もない田舎者、学者馬鹿として笑いものにされました。世間の動きに疎く、宮廷や都の上流の交際で何が話題になっていたか、何も知らぬ男だというのです。ですから殿下には、学識も才知も豊かに存在すると、全般について申し上げるしかございません。個々の例をつかまえるのは、私の乏しい能力には滑りやすすぎる仕事です。たとえば風の強い日に、地平線近くに熊の形の大雲があり、頭上には驢馬の頭の形の雲、西には竜の爪を持つ雲があると、あえて殿下に申し上げたとします。殿下が数分後にその真偽を確かめようとなされば、どれも形や位置を変え、新しい雲が現れているに違いありません。私どもが一致できるのは、雲は確かにあったが、その動物図譜と位置の記述については、私が大いに間違っていた、という点だけでしょう。"
  "translation_status": "reviewed"
- "id": "tub-dedication-010"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But your governor, perhaps, may still insist, and put the question, What is then become of those immense bales of paper which must needs have been employed in such numbers of books? Can these also be wholly annihilated, and to of a sudden, as I pretend? What shall I say in return of so invidious an objection? It ill befits the distance between your Highness and me to send you for ocular conviction to a jakes or an oven, to the windows of a bawdyhouse, or to a sordid lanthorn. Books, like men their authors, have no more than one way of coming into the world, but there are ten thousand to go out of it and return no more."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 39
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[42]"
  "translation_ja": "しかし御養育係は、なお食い下がって問うかもしれません。それほど多くの本に使われたはずの、おびただしい紙の束は、どうなったのか。それまでも、私の言うとおり、そっくり、しかも突然に消えてしまうことがあるのか、と。この意地の悪い反論に、何と答えればよいでしょう。目で見て確かめていただくため、殿下を便所や竈へ、売春宿の窓や薄汚れた提灯へお連れするのは、私と殿下の身分の隔たりに似つかわしくありません。本も、それを書く人間と同じで、この世へ来る道は一つしかありませんが、この世を去って二度と戻らぬ道は、一万もあるのです。"
  "translation_status": "reviewed"
- "id": "tub-dedication-011"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I profess to your Highness, in the integrity of my heart, that what I am going to say is literally true this minute I am writing; what revolutions may happen before it shall be ready for your perusal I can by no means warrant; however, I beg you to accept it as a specimen of our learning, our politeness, and our wit. I do therefore affirm, upon the word of a sincere man, that there is now actually in being a certain poet called John Dryden, whose translation of Virgil was lately printed in large folio, well bound, and if diligent search were made, for aught I know, is yet to be seen. There is another called Nahum Tate, who is ready to make oath that he has caused many reams of verse to be published, whereof both himself and his bookseller, if lawfully required, can still produce authentic copies, and therefore wonders why the world is pleased to make such a secret of it. There is a third, known by the name of Tom Durfey, a poet of a vast comprehension, an universal genius, and most profound learning. There are also one Mr. Rymer and one Mr. Dennis, most profound critics. There is a person styled Dr. Bentley, who has wrote near a thousand pages of immense erudition, giving a full and true account of a certain squabble of wonderful importance between himself and a bookseller; he is a writer of infinite wit and humour, no man rallies with a better grace and in more sprightly turns. Further, I avow to your Highness that with these eyes I have beheld the person of William Wotton, B.D., who has written a good-sized volume against a friend of your governor, from whom, alas! he must therefore look for little favour, in a most gentlemanly style, adorned with utmost politeness and civility, replete with discoveries equally valuable for their novelty and use, and embellished with traits of wit so poignant and so apposite, that he is a worthy yoke-mate to his fore-mentioned friend."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 40
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[43]"
  "translation_ja": "これから申し上げることは、今こうして書いているこの瞬間には、文字どおり真実であると、心の誠実さにかけて殿下に申し上げます。殿下のお目に届くまでに、どんな変転が起きるかは、とうてい保証できません。それでも、私どもの学識、洗練、才知の見本としてお受け取りいただきたく存じます。さて、正直な人間の言葉として断言いたしますが、ジョン・ドライデンという名の詩人が、現に今、実在しております。そのウェルギリウス訳は、先頃、大判の二折本で、立派な装丁を施して刊行されました。念入りに捜せば、私の知るかぎりでは、まだ見ることができるかもしれません。ネイハム・テイトという詩人もおります。大量の詩を刊行したと、いつでも宣誓する用意があり、法律に従って請求されれば、本人も書店主も、その真正な本をまだ提出できます。ですから彼は、なぜ世間がそのことをわざわざ秘密にするのか、不思議に思っております。第三にはトム・ダーフィーという名で知られる詩人がおります。広大な理解力と万能の才、きわめて深い学識の持ち主です。また、ライマー氏とデニス氏という、たいへん深遠な批評家もおります。ベントリー博士と称する人物もおり、本人とある書店主の間で起きた、驚くほど重大な一悶着について、完全にして真実なる報告を、千頁近い莫大な学識の中で述べております。無限の機知とユーモアを備えた著述家で、これほど優雅に、これほど生き生きと皮肉を飛ばせる人はおりません。さらに殿下に申し上げますが、私はこの目で、神学士ウィリアム・ウォットンその人を見たことがございます。この方は、殿下の御養育係の友人を攻撃する、かなりの厚さの一巻を書きました。それゆえ、ああ、御養育係の好意などほとんど望めますまい。文体はたいへん紳士的で、極上の洗練と礼儀正しさに彩られ、新しさと有用さが同じほど貴重な発見に満ち、鋭く的確な機知で飾られており、先に挙げた彼の友人と、肩を並べるにふさわしい方です。"
  "translation_status": "reviewed"
- "id": "tub-dedication-012"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Why should I go upon farther particulars, which might fill a volume with the just eulogies of my contemporary brethren? I shall bequeath this piece of justice to a larger work, wherein I intend to write a character of the present set of wits in our nation; their persons I shall describe particularly and at length, their genius and understandings in miniature."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 41
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[44]"
  "translation_ja": "同時代の仲間たちへの正当な賛辞だけで一巻を満たせそうなのに、なぜこれ以上、個々の話を続けましょう。この公正な仕事は、もっと大きな著作に譲ることといたします。そこで私は、この国の当代才人たちの人物評を書くつもりです。その人物は細々と長く、その才と知性は小さな細密画で描くことになるでしょう。"
  "translation_status": "reviewed"
- "id": "tub-dedication-013"
  "section_id": "dedication"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In the meantime, I do here make bold to present your Highness with a faithful abstract drawn from the universal body of all arts and sciences, intended wholly for your service and instruction. Nor do I doubt in the least but your Highness will peruse it as carefully and make as considerable improvements as other young princes have already done by the many volumes of late years written for a help to their studies."

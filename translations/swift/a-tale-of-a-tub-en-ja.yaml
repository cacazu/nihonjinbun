  "origin": "source"
  "source_text": "[102b] A treatise written about fifty years ago by a Welsh gentleman of Cambridge. His name, as I remember, Vaughan, as appears by the answer to it by the learned Dr. Henry More. It is a piece of the most unintelligible fustian that perhaps was ever published in any language.—S. This piece was by the brother of Henry Vaughan, the poet."

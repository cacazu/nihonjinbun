  "translation_status": "reviewed"
- "id": "tub-section-05-002"
  "section_id": "section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "We whom the world is pleased to honour with the title of modern authors, should never have been able to compass our great design of an everlasting remembrance and never-dying fame if our endeavours had not been so highly serviceable to the general good of mankind. This, O universe! is the adventurous attempt of me, thy secretary—"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 160
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[151]"
  "translation_ja": "世間が近代の著述家という称号でほめてくださる私どもも、その努力が人類全体の幸福に、あれほど大いに役立たなかったなら、永遠の記憶と、不滅の名声という大計画を、とうてい成し遂げられなかっただろう。おお宇宙よ！　そなたの書記たる私の、この冒険的な企てこそ――"
  "translation_status": "reviewed"

    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[170]"
  "translation_ja": "なるほど、こうした洗練された革新が、まったく気に入らないという、陰気で、けちをつけたがる、育ちの悪い連中もいる。食事のたとえについても、類似は認めるが、大胆にも、その例自体が、趣味の腐敗と退化だと言い放つ。五十ものものを、一皿でごちゃまぜにする流行は、もともと、堕落して放埒になった食欲と、壊れかけた体質に合わせて、導入されたのだという。大鍋の煮込みの中で、鵞鳥か、ヒドリガモか、ヤマシギの頭と脳味噌を探し回る者を見るのは、もっとしっかりした食べ物を受けつける胃と、消化力がない証拠だ、と。さらに、本の中の脱線は、国の中の外国軍に似ている、と彼らは断言する。国民に自前の勇気と腕がないことを示すもので、しばしば国民を征服するか、最も痩せた片隅へ追いやるのだ、と。"
  "translation_status": "reviewed"
- "id": "tub-section-07-004"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But after all that can be objected by these supercilious censors, it is manifest the society of writers would quickly be reduced to a very inconsiderable number if men were put upon making books with the fatal confinement of delivering nothing beyond what is to the purpose. It is acknowledged that were the case the same among us as with the Greeks and Romans, when learning was in its cradle, to be reared and fed and clothed by invention, it would be an easy task to fill up volumes upon particular occasions without further expatiating from the subject than by moderate excursions, helping to advance or clear the main design. But with knowledge it has fared as with a numerous army encamped in a fruitful country, which for a few days maintains itself by the product of the soil it is on, till provisions being spent, they send to forage many a mile among friends or enemies, it matters not. Meanwhile the neighbouring fields, trampled and beaten down, become barren and dry, affording no sustenance but clouds of dust."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 184
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[171]"
  "translation_ja": "しかし、この高慢な検閲官たちが、どれほど反論を並べようと、一つのことは明らかだ。本筋に関係すること以外は何も述べてはならぬという、致命的な制限の下で本を書かせたら、著述家の社会は、たちまち取るに足りぬ人数へ縮んでしまうだろう。もし、私どもの境遇が、ギリシア人やローマ人の頃と同じなら、ということは認めよう。学問がまだ揺り籠にあり、創意に育てられ、食べさせられ、着せてもらっていた頃なら、ある題目で何巻も満たすのは、たやすい仕事だったろう。主な目的を進め、明らかにするための、穏やかな寄り道以上には、主題から外れずに済んだはずだ。しかし、知識は、豊かな国に野営した大軍のような運命をたどった。初めの数日は、足もとの土地の産物で暮らせる。やがて食糧が尽きると、味方であれ敵であれ、何マイルも先まで徴発隊を送る。その間、近隣の畑は踏みにじられ、打ち固められ、不毛で乾き切り、砂塵の雲以外には、何の糧も与えなくなる。"
  "translation_status": "reviewed"
- "id": "tub-section-07-005"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The whole course of things being thus entirely changed between us and the ancients, and the moderns wisely sensible of it, we of this age have discovered a shorter and more prudent method to become scholars and wits, without the fatigue of reading or of thinking. The most accomplished way of using books at present is twofold: either first to serve them as some men do lords, learn their titles exactly, and then brag of their acquaintance; or, secondly, which is indeed the choicer, the profounder, and politer method, to get a thorough insight into the index by which the whole book is governed and turned, like fishes by the tail. For to enter the palace of learning at the great gate requires an expense of time and forms, therefore men of much haste and little ceremony are content to get in by the back-door. For the arts are all in a flying march, and therefore more easily subdued by attacking them in the rear. Thus physicians discover the state of the whole body by consulting only what comes from behind. Thus men catch knowledge by throwing their wit on the posteriors of a book, as boys do sparrows with flinging salt upon their tails. Thus human life is best understood by the wise man’s rule of regarding the end. Thus are the sciences found, like Hercules’ oxen, by tracing them backwards. Thus are old sciences unravelled like old stockings, by beginning at the foot."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 185
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[172]"
  "translation_ja": "こうして、物事の流れ全体が、古代人と私どもの間で、すっかり変わり、近代人は賢くもそれを心得ている。そこで当代のわれわれは、読書や思考に疲れることなく、学者や才人になるための、もっと短く賢い方法を発見した。今のところ、最も洗練された本の使い方は二つある。第一は、ある人々が貴族に対してするように、本を扱うこと。肩書き、つまり表題を正確に覚え、それから知り合いだと自慢するのである。第二は、実際、こちらのほうが、選び抜かれ、深遠で、洗練された方法だが、索引を徹底的に知り尽くすこと。本全体は、魚が尾で向きを変えるように、索引によって操られ、動かされる。学問の宮殿へ正門から入るには、時間と儀式の費用がかかるので、せっかちで儀礼に無頓着な人々は、裏口から入ることで満足するのだ。諸学芸はすべて、逃げるように行軍しているのだから、後ろから攻撃すれば、いっそうたやすく征服できる。このように、医者は後ろから出るものだけを調べ、全身の状態を見抜く。このように、人は才知を本の尻へ投げつけ、知識を捕まえる。子供が雀の尾へ塩を投げて捕まえるのと同じである。このように、賢者の教えどおり、終わりを見れば、人の生は最もよくわかる。このように、学問も、ヘラクレスの牛のように、後ろ向きの足跡をたどって見つかる。このように、古い学問は、古い靴下のように、足先からほどかれるのである。"
  "translation_status": "reviewed"
- "id": "tub-section-07-006"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Besides all this, the army of the sciences hath been of late with a world of martial discipline drawn into its close order, so that a view or a muster may be taken of it with abundance of expedition. For this great blessing we are wholly indebted to systems and abstracts, in which the modern fathers of learning, like prudent usurers, spent their sweat for the ease of us their children. For labour is the seed of idleness, and it is the peculiar happiness of our noble age to gather the fruit."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 186
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[173]"
  "translation_ja": "これに加えて、近頃、諸学問の軍隊は、たいへんな軍紀によって密集隊形へまとめられ、ずいぶん素早く、全体を見渡し、点呼できるようになった。この大きな祝福は、すべて、体系書と摘要のおかげである。近代の学問の父たちは、賢い高利貸しのように、私ども子供が楽をできるよう、汗を流した。労苦は怠惰の種であり、その実を収穫できるのは、わが高貴な時代だけに与えられた幸福なのだ。"
  "translation_status": "reviewed"
- "id": "tub-section-07-007"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now the method of growing wise, learned, and sublime having become so regular an affair, and so established in all its forms, the number of writers must needs have increased accordingly, and to a pitch that has made it of absolute necessity for them to interfere continually with each other. Besides, it is reckoned that there is not at this present a sufficient quantity of new matter left in Nature to furnish and adorn any one particular subject to the extent of a volume. This I am told by a very skilful computer, who hath given a full demonstration of it from rules of arithmetic."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 187
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[174]"
  "translation_ja": "さて、賢く、学識を備え、崇高になる方法が、これほど規則正しくなり、その形式もすべて確立された以上、著述家の数も、それに応じて増えたに違いない。その数は、絶えず互いの邪魔をせずにはいられぬほどに達した。そのうえ現在、自然界には、どんな一つの主題でも、一巻分になるまで満たし、飾り立てるほどの、新しい材料は残っていないと見積もられている。これは、たいそう熟練した計算家から聞いた。その人は、算術の規則によって、完全に証明してくれたのである。"
  "translation_status": "reviewed"
- "id": "tub-section-07-008"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This perhaps may be objected against by those who maintain the infinity of matter, and therefore will not allow that any species of it can be exhausted. For answer to which, let us examine the noblest branch of modern wit or invention planted and cultivated by the present age, and which of all others hath borne the most and the fairest fruit. For though some remains of it were left us by the ancients, yet have not any of those, as I remember, been translated or compiled into systems for modern use. Therefore we may affirm, to our own honour, that it has in some sort been both invented and brought to a perfection by the same hands. What I mean is, that highly celebrated talent among the modern wits of deducing similitudes, allusions, and applications, very surprising, agreeable, and apposite, from the signs of either sex, together with their proper uses. And truly, having observed how little invention bears any vogue besides what is derived into these channels, I have sometimes had a thought that the happy genius of our age and country was prophetically held forth by that ancient typical description of the Indian pigmies whose stature did not exceed above two feet, sed quorum pudenda crassa, et ad talos usque pertingentia. Now I have been very curious to inspect the late productions, wherein the beauties of this kind have most prominently appeared. And although this vein hath bled so freely, and all endeavours have been used in the power of human breath to dilate, extend, and keep it open, like the Scythians [116], who had a custom and an instrument to blow up those parts of their mares, that they might yield the more milk; yet I am under an apprehension it is near growing dry and past all recovery, and that either some new fonde of wit should, if possible, be provided, or else that we must e’en be content with repetition here as well as upon all other occasions."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 188
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[175]"
  "translation_ja": "これには、物質の無限性を唱え、したがって、そのどんな種類も尽きることはないと主張する者から、反論があるかもしれない。その答えとして、近代の才知、または創意のうち、最も高貴な枝を調べてみよう。当代が植え、育て、ほかのどれよりも多く、美しい実を結ばせた枝である。その名残を、古代人もいくらか残してはくれたが、私の記憶では、そのどれも、近代人のために翻訳されたり、体系へまとめられたりはしていない。だから、自分たちの名誉のため、ある意味では、同じ手で発明もし、完成もさせたと言ってよい。私が意味するのは、近代の才人の間で、高く称賛される才能である。男女それぞれの性のしるしと、その本来の用途から、たいそう意外で、楽しく、ぴったりした比喩、ほのめかし、応用を導き出す才能のことだ。実際、この水路へ流し込まれたもの以外、どれほど少しの創意しか流行しないかを見て、私はときどき、こう思ったことがある。わが時代と祖国の幸せな天才は、古代のインドの小人族の寓意的な記述によって、預言されていたのではないか。身の丈は二フィートを超えないが、陰部は太く、足首まで届くという、あの人々である。さて、私は、この種の美がとくに目立つ近頃の作品を、たいそう熱心に調べてきた。この血管からは、ずいぶん盛んに血が流れ、人間の息にできるあらゆる努力によって、広げ、伸ばし、開いたままに保とうとしてきた。牝馬の乳を多く出させるため、その部分へ息を吹き込む習慣と道具を持った、スキタイ人[116]のように、である。それでも、もう干上がりかけ、回復の見込みもないのでは、と私は心配している。可能ならば、機知の新しい財源を用意するか、さもなければ、ほかのあらゆる場合と同じく、ここでも繰り返しで満足しなければならないのだろう。"
  "translation_status": "reviewed"
- "id": "tub-section-07-009"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This will stand as an uncontestable argument that our modern wits are not to reckon upon the infinity of matter for a constant supply. What remains, therefore, but that our last recourse must be had to large indexes and little compendiums? Quotations must be plentifully gathered and booked in alphabet. To this end, though authors need be little consulted, yet critics, and commentators, and lexicons carefully must. But above all, those judicious collectors of bright parts, and flowers, and observandas are to be nicely dwelt on by some called the sieves and boulters of learning, though it is left undetermined whether they dealt in pearls or meal, and consequently whether we are more to value that which passed through or what stayed behind."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 189
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[176]"
  "translation_ja": "これは、近代の才人が、物質の無限性を恒常的な供給源として当てにできない、という争いようのない証拠となるだろう。ならば最後の頼みとして、大きな索引と小さな便覧へ訴える以外、何が残されているか。引用をたっぷり集め、アルファベット順に帳面へ記さねばならない。そのために、著者自身を調べる必要はほとんどないが、批評家、注釈者、辞書は、注意深く調べる必要がある。とりわけ、輝くくだり、名文、注目点を、分別をもって集める収集家たちには、細心の注意で取り組まねばならない。彼らを、学問の篩や粉ふるいと呼ぶ者もいる。ただし、扱っていたのが真珠か粉か、したがって、通り抜けたものと、残ったものの、どちらをいっそう尊ぶべきなのかは、まだ決まっていない。"
  "translation_status": "reviewed"
- "id": "tub-section-07-010"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "By these methods, in a few weeks there starts up many a writer capable of managing the profoundest and most universal subjects. For what though his head be empty, provided his commonplace book be full? And if you will bate him but the circumstances of method, and style, and grammar, and invention; allow him but the common privileges of transcribing from others, and digressing from himself as often as he shall see occasion, he will desire no more ingredients towards fitting up a treatise that shall make a very comely figure on a bookseller’s shelf, there to be preserved neat and clean for a long eternity, adorned with the heraldry of its title fairly inscribed on a label, never to be thumbed or greased by students, nor bound to everlasting chains of darkness in a library, but when the fulness of time is come shall happily undergo the trial of purgatory in order to ascend the sky."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 190
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[177]"
  "translation_ja": "こうした方法で、数週間もすると、最も深遠で普遍的な主題を扱える著者が、何人も現れる。抜き書き帳がいっぱいなら、頭が空っぽでも、何の問題があろう。構成、文体、文法、創意といった細目さえ、少し大目に見てやればよい。他人から書き写し、自分の本筋からは、必要と思うたびに脱線するという、ありふれた特権さえ許せばよい。そうすれば、書店の棚でたいそう立派に見える論考を仕立てるために、ほかの材料は何も要らぬと言うだろう。本はそこで、表題という紋章を、札に美しく書き込まれて飾り、長い永遠の間、きちんと清潔に保存される。学生に手垢や脂をつけられることもなく、図書館で、永遠の暗闇の鎖につながれることもない。やがて時が満ちれば、空へ昇るため、幸いにも煉獄の試練にかけられるのである。"
  "translation_status": "reviewed"
- "id": "tub-section-07-011"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Without these allowances how is it possible we modern wits should ever have an opportunity to introduce our collections listed under so many thousand heads of a different nature, for want of which the learned world would be deprived of infinite delight as well as instruction, and we ourselves buried beyond redress in an inglorious and undistinguished oblivion?"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 191
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[178]"
  "translation_ja": "こうした特別扱いなしに、わが近代の才人は、性質の異なる何千もの見出しの下へ並べた収集物を、どうして持ち出せよう。それがなければ、学問の世界は、無限の楽しみと教訓を奪われ、私ども自身も、救いようのない、名誉も区別もない忘却の中へ、葬られてしまうではないか。"
  "translation_status": "reviewed"
- "id": "tub-section-07-012"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "From such elements as these I am alive to behold the day wherein the corporation of authors can outvie all its brethren in the field—a happiness derived to us, with a great many others, from our Scythian ancestors, among whom the number of pens was so infinite that the Grecian eloquence had no other way of expressing it than by saying that in the regions far to the north it was hardly possible for a man to travel, the very air was so replete with feathers."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 192
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[179]"
  "translation_ja": "こうした要素のおかげで、著述家組合が、野にあるほかのすべての同業者をしのぐ日を、私は生きて目にしている。この幸福も、ほかの多くの幸福とともに、スキタイの先祖から受け継いだものだ。彼らの間には、羽根ペンがあまりに無限にあったので、ギリシアの雄弁も、遠い北の地方では、空気そのものが羽根でいっぱいで、人が旅するのはほとんど不可能だった、と言うほか、表現するすべがなかったのである。"
  "translation_status": "reviewed"
- "id": "tub-section-07-013"
  "section_id": "section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The necessity of this digression will easily excuse the length, and I have chosen for it as proper a place as I could readily find. If the judicious reader can assign a fitter, I do here empower him to remove it into any other corner he please. And so I return with great alacrity to pursue a more important concern."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 193
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[180]"
  "translation_ja": "この脱線の必要性は、その長さを容易に許してくれるだろう。置き場所も、すぐ見つけられるうちでは、できるだけ適切な所を選んだ。判断力ある読者が、もっとふさわしい場所を指定できるなら、ここで権限をお与えしよう。お好きな、ほかのどの隅へでも、移していただいてよい。こうして私は、たいそう軽快に、もっと重要な用件の続きを追うことにする。"
  "translation_status": "reviewed"
- "id": "tub-section-08-001"
  "section_id": "section-08"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    SECTION VIII.
     A TALE OF A TUB.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 194
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/h3[13]"
  "translation_ja": |-
    第8節
    樽物語
  "translation_status": "reviewed"
- "id": "tub-section-08-002"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The learned Æolists maintain the original cause of all things to be wind, from which principle this whole universe was at first produced, and into which it must at last be resolved, that the same breath which had kindled and blew up the flame of Nature should one day blow it out."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 195
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[181]"
  "translation_ja": "学識ある風崇拝者たちは、万物の根本原因は風だと説く。この全宇宙は、最初その原理から生まれ、最後には、そこへ還らなければならない。自然の炎を点じ、吹き起こしたのと同じ息が、いつかそれを吹き消すのである。"
  "translation_status": "reviewed"
- "id": "tub-section-08-003"
  "section_id": "section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "“Quod procul à nobis flectat Fortuna gubernans.”"
  "source_languages":
  - "la"
  "source_locations":

  "translation_ja": "こうして、この入り組んだ難問を、細部まで通り抜けた以上、読者はきっと、次の結論で私に同意するだろう。近代人が狂気という語で、ただ、下位の機能から立ち昇る、ある種の蒸気の力による、脳の乱れ、または位置の転換を意味するなら、この狂気こそ、帝国、哲学、宗教に起きた、あらゆる大革命の親だったのである。脳が自然な位置と穏やかな状態にあると、その持ち主は、自分の力、理屈、幻に大勢を服従させようなどと考えず、ありふれた形で人生を送ろうとする。人間の学問を手本に理解力を形作れば作るほど、自分だけの考えに従う党派を作る気はなくなる。学問は、自分自身の弱さと、人々の頑固な無知を、ともに教えるからだ。だが、空想が理性の背にまたがり、想像力が感覚と殴り合い、普通の理解力と常識が戸外へ蹴り出されると、最初に改宗させる相手は、自分自身となる。それさえ済めば、ほかの者を引き入れるのは、それほど難しくない。強い妄想は、内からと同じ勢いで、外からも作用するからだ。もったいぶった御託と幻は、耳と目に対して、くすぐりが触覚に与えるのと同じ働きをする。人生で最も重んじる楽しみや快楽は、感覚を騙し、からかうものなのだ。一般に幸福と呼ばれるものを、理解力についても感覚についても調べれば、その性質と付随物は、すべて、次の短い定義へ群れ集まるだろう。幸福とは、うまく騙されている状態を、絶えず保つことである。まず、心または理解力についていえば、虚構が真実に対して、どれほど大きな利点を持つかは明らかで、その理由はすぐ手近にある。想像力は、運命や自然が、わざわざ用意するよりも高貴な景色を築き、驚くべき変転を生み出せるからだ。この選択に導かれる人間も、それほど責められはしない。議論は、ただ、過ぎたものと、思い描かれたものの間にあるにすぎないからだ。問題は、つまりこういうことである。想像の中に場所を占めるものも、記憶に座を占めるものと同じように、存在すると言ってよいのではないか。これは正当に肯定してよく、前者にはたいへん有利な答えとなる。想像は、物事の母胎と認められる一方、記憶は、ただ墓でしかないとされるからである。また、この幸福の定義を、感覚に関して調べれば、驚くほどぴたりと合うと認められるだろう。欺きという乗り物で運ばれてこない物は、どれも、なんと悲しく、味気なく、われわれに迫ることか。自然の鏡に映ると、何もかも、なんと縮んで見えることか。人工の媒介、偽りの照明、屈折した角度、ニス、金ぴかの飾りが助けてくれなければ、はかない人間の幸福と楽しみは、大いに低くならされてしまうだろう。世間がこれを真剣に考えるなら――まずそうしないのではと疑う、ある理由が私にはあるが――弱点をさらし、欠陥を公表する技を、高度な知恵の一つには、もう数えなくなるだろう。私に言わせれば、それは、仮面を剝ぐことと、よくも悪くも同じ仕事だ。仮面を剝ぐことが、公正な扱いとして認められたことは、世間でも、芝居小屋でも、なかったと思う。"

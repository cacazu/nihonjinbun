  "translation_ja": "こうした考えと、その実践は、宮廷と都の洗練された人々の間に、広く行き渡っていた。それで、わが冒険者の三兄弟は、そのときの身の上では、ほとほと困り果てた。一方では、求婚する、すでに名を挙げた三人の御婦人方が、いつでも流行の最先端に立ち、髪の毛一本でもそこから遅れる者を嫌っていた。他方、父の遺言はきわめて厳密だった。最も重い罰を添えた第一の教えは、遺言に明文の命令がないかぎり、上着の糸一本も増減させるな、というものだった。父の残した上着は、たしかにたいへんよい生地で、縫い目も見事なので、一枚物だと誓ってもよいくらいだった。しかし同時に、たいそう地味で、飾りはほとんどないか、まったくなかった。ところが、三人が都へ来て一か月もたたぬうちに、大きなshoulder-knot（肩結び飾り）が流行し始めた。たちまち世間は肩飾り一色となり、しかるべき数の肩飾りなしには、御婦人方の寝室の語らいの席へも近づけない。「あの男には魂がない」と、ある者は叫ぶ。「肩飾りは、どこにある？」[75]　三兄弟は、散歩のたびに数々の屈辱や無礼に出会い、苦い経験から、自分たちに何が欠けているか、すぐに悟った。芝居へ行けば、木戸番が十二ペンスの天井桟敷へ案内する。舟を呼べば、舟頭は「私は一人漕ぎですよ」と言う。ローズ亭で葡萄酒を一本飲もうと入れば、給仕は「旦那、うちではエールは売ってませんよ」と叫ぶ。御婦人を訪ねれば、従僕が戸口へ出て、「御用件をお取り次ぎしましょう」と言う。この不幸な境遇に陥り、三人はすぐに父の遺言を調べ、繰り返し読んだが、肩飾りについては一言もなかった。どうすればよいか。どこに折り合いをつけるか。服従は絶対に必要だが、肩飾りもぜひとも要るように見える。さんざん考えた末、三兄弟のうち、ほかの二人より書物に通じていた一人が、うまい手を見つけたと言った。「たしかに、この遺言に、肩飾りを一語ずつそのまま挙げた文句はない。しかし、含みとしてなら、あるいは音節を一つずつ拾えば、見つかるのではないか。」この区別は、たちまち皆の承認を得た。そこで再び遺言を調べた。ところが不運にも、最初の音節が、文書のどこにもなかった。この失望に、前の抜け道を見つけた者が気を取り直して言った。「兄弟たち、まだ希望はある。一語ずつでも、一音節ずつでも見つからなくても、第三の方法、つまり一文字ずつなら、必ず見つけ出せる。」この発見も大いにほめられ、もう一度調査を始めた三人は、すぐに S、H、O、U、L、D、E、R を拾い出した。ところが、彼らの安らぎを妨げる、あの星が、なんと K だけは見つからないよう取り計らっていた。これは重大な難問だ！　しかし、細かな区別を立てる兄弟――その名は、いずれ見つけよう――は、すでに調子が出ていたので、たいへん立派な議論により、K は近代の私生児の文字で、学問の栄えた時代には知られず、古い写本にもどこにも見えないと証明した。「たしかに」と彼は言った。「Calendæ という語が、いくつかの古い写本[76]で、ときには K で書かれたこともある。だが、それは誤りだ。最良の写本では、常に C で綴られている。したがって、わが言葉で knot を K で綴るのは、はなはだしい間違いである。これからは、私が責任を持って C で書くようにしよう。」これで、さらなる困難はすべて消えた。肩結び飾りは、父の法にかなうものだと明らかになり、わが三人の紳士は、誰にも負けぬほど大きく派手なものをつけて、肩で風を切って歩いた。"

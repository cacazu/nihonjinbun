    "xpath": "/html[1]/body[1]/p[148]"
  "translation_ja": "この立派な一件を、細部まで語ることにしたのは、同じ頃、兄弟の間に起き、その後決して埋まらなかった、あの大きく名高い断裂[98a]の、主なきっかけになったからである。しかし、それについては、別の節で詳しく述べよう。"
  "translation_status": "reviewed"
- "id": "tub-section-04-019"
  "section_id": "section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "However, it is certain that Lord Peter, even in his lucid intervals, was very lewdly given in his common conversation, extreme wilful and positive, and would at any time rather argue to the death than allow himself to be once in an error. Besides, he had an abominable faculty of telling huge palpable lies upon all occasions, and swearing not only to the truth, but cursing the whole company to hell if they pretended to make the least scruple of believing him. One time he swore he had a cow at home which gave as much milk at a meal as would fill three thousand churches, and what was yet more extraordinary, would never turn sour. Another time he was telling of an old sign-post [98b] that belonged to his father, with nails and timber enough on it to build sixteen large men-of-war. Talking one day of Chinese waggons, which were made so light as to sail over mountains, “Z—nds,” said Peter, “where’s the wonder of that? By G—, I saw a large house of lime and stone travel over sea and land (granting that it stopped sometimes to bait) above two thousand German leagues.” [98c] And that which was the good of it, he would swear desperately all the while that he never told a lie in his life, and at every word: “By G— gentlemen, I tell you nothing but the truth, and the d—l broil them eternally that will not believe me.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 157
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[149]"
  "translation_ja": "とはいえ、ピーター卿は、正気に戻っている間でさえ、日々の交際でひどく無作法で、極端に頑固で独断的だった。自分が一度でも間違ったと認めるくらいなら、いつでも死ぬまで議論しようとしたことは確かである。そのうえ、折あるごとに、とてつもなく大きな、見え透いた嘘をつく、忌まわしい才能を持っていた。ただ本当だと誓うだけでなく、信じるのを少しでもためらう素振りを見せれば、一同が地獄へ落ちるよう呪った。あるときは、自宅に牛がいて、一度の搾乳で三千の教会を満たすほど乳を出し、さらに驚くべきことに、その乳は決して酸っぱくならぬと誓った。またあるときは、父の持っていた古い看板柱[98b]について、それについた釘と木材だけで、大きな軍艦を十六隻造れるほどだと語った。ある日、山々の上を帆走するほど軽く作られた、中国の車の話をしていると、「ちくしょう」とピーターは言った。「そんなことの何が不思議だ。神にかけて、私は、石と漆喰でできた大きな家が、海と陸を、ドイツの里程で二千里以上も旅するのを見たぞ。まあ、ときどきは餌を取るために止まったがな。」[98c]　しかも面白いことに、彼はその間ずっと、自分は生涯、一度も嘘をついたことがないと、必死で誓い続けた。一言ごとに、「神にかけて、諸君、私は真実しか語らぬ。信じない連中は、悪魔が永遠に炙り焼きにするがよい」と言うのだった。"

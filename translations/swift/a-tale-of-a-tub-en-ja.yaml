    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[237]"
  "translation_ja": "だから、先祖の格言は、時と人を十分に斟酌して読むのがよい。初期の記録を調べれば、人間の耳ほど、大きく、頻繁な革命を受けたものはないとわかる。昔は、それを捕らえ、保つための珍しい発明があり、失われた技の一つに、正当に数えてよいと思う。ほかに、どうなりえよう。近頃の数世紀では、耳という種そのものが、嘆かわしいほど減ったばかりか、哀れな残りも、最も巧みなつかみ方を嘲るほど、退化してしまったのだから。一頭の牡鹿の片耳を裂くだけで、森じゅうへその欠陥が広まると判明したのなら、父祖の耳も自分たちの耳も、近頃あれほど多く切断や損傷にさらされてきた以上、最大の結果が生じても、なぜ驚こう。なるほど、わが島が恩寵の支配の下にあった間、耳の成長を再び促そうと、多くの努力が払われた。大きな寸法は、外なる人の飾りとみなされるばかりか、内なる人の恩寵のしるしともされた。そのうえ、博物学者によれば、耳や鼻など、体の上部の部分が突き出ていれば、下部にも、釣り合うものがあるはずだという。だから、あの真に敬虔な時代には、どの集まりの男たちも、それぞれの賜物に応じ、耳とその周囲を、進んで人目へさらした。ヒポクラテス[151b]が、耳の後ろの血管を切ると、人は宦官になる、と教えているからだ。女たちも、それを眺め、教化されることに、少しも遅れを取らなかった。すでに手段を用いた者は、この眺めによって、ふさわしい子を身ごもれるのを期待し、熱心に周囲を見回した。慈善を待ち望む立場の者には、豊富な選択肢があり、二人の間で血筋が小さくならぬよう、最も大きな耳を見せる者に、必ず目をつけた。最後に、とくに敬虔な姉妹たちは、この器官の並外れた広がりを、熱心さの突出、あるいは霊的な瘤とみなしていたので、それが載る頭を、裂けた舌でもあるかのように敬った。とりわけ説教者の頭はそうだった。耳はふつう、第一級の大きさで、そのため、雄弁の発作の最中、あらゆる好条件の下で、頻繁に、正確に、民衆へさらした。ときには向きを変えて一方を差し出し、ときには他方を差し出した。この習慣から、説教という営み全体を、彼らの仲間は今日まで、「差し出す」という言葉で呼ぶのである。"
  "translation_status": "reviewed"
- "id": "tub-section-11-026"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Such was the progress of the saints for advancing the size of that member, and it is thought the success would have been every way answerable, if in process of time a cruel king had not arose, who raised a bloody persecution against all ears above a certain standard [152a]; upon which some were glad to hide their flourishing sprouts in a black border, others crept wholly under a periwig; some were slit, others cropped, and a great number sliced off to the stumps. But of this more hereafter in my general “History of Ears,” which I design very speedily to bestow upon the public."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 258
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[238]"
  "translation_ja": "これが、その器官の寸法を増すため、聖者たちが遂げた進歩だった。時がたって、残酷な王が現れ、ある基準を超えるすべての耳に、血なまぐさい迫害を起こさなかったなら[152a]、成功も、どの点でも、それに見合ったはずだと考えられる。そのため、ある者は、よく育った芽を、黒い縁飾りへ喜んで隠し、ほかの者は、鬘の下へすっぽり潜り込んだ。裂かれた耳、刈り取られた耳、根元まで切り落とされた、おびただしい耳があった。だが、これについては、私の『耳の総合的歴史』で、後ほど詳しく述べよう。ごく近く、公共へ贈るつもりの本である。"
  "translation_status": "reviewed"
- "id": "tub-section-11-027"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "From this brief survey of the falling state of ears in the last age, and the small care had to advance their ancient growth in the present, it is manifest how little reason we can have to rely upon a hold so short, so weak, and so slippery; and that whoever desires to catch mankind fast must have recourse to some other methods. Now he that will examine human nature with circumspection enough may discover several handles, whereof the six [152b] senses afford one apiece, beside a great number that are screwed to the passions, and some few riveted to the intellect. Among these last, curiosity is one, and of all others affords the firmest grasp; curiosity, that spur in the side, that bridle in the mouth, that ring in the nose of a lazy, an impatient, and a grunting reader. By this handle it is that an author should seize upon his readers; which as soon as he hath once compassed, all resistance and struggling are in vain, and they become his prisoners as close as he pleases, till weariness or dulness force him to let go his grip."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 259
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[239]"
  "translation_ja": "前の時代における耳の衰えと、今の時代に、その古い成長を促す配慮が、どれほど乏しいかを、このように手短に見渡せば、あれほど短く、弱く、滑りやすい取っ手へ頼る理由が、どれほど少ないかは明らかだ。人類をしっかり捕らえたい者は、ほかの方法へ頼らねばならないのである。さて、人間性を十分注意深く調べれば、いくつもの取っ手を見つけられる。六つの[152b]感覚が、それぞれ一つずつ供給するほか、情念へねじ込まれたものも大量にあり、知性へ鋲留めされたものも、少しある。最後の部類では、好奇心がその一つであり、何よりもしっかり握れる。好奇心は、怠惰で、せっかちで、ぶつぶついう読者の脇腹の拍車、口の手綱、鼻の輪なのだ。著者は、この取っ手によって、読者を捕らえねばならない。ひとたびそれを成し遂げれば、あらゆる抵抗も、もがきもむだとなり、倦怠か愚鈍さによって、握る手を放させられるまで、好きなだけ、きつく囚人にしておける。"
  "translation_status": "reviewed"
- "id": "tub-section-11-028"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And therefore I, the author of this miraculous treatise, having hitherto, beyond expectation, maintained by the aforesaid handle a firm hold upon my gentle readers, it is with great reluctance that I am at length compelled to remit my grasp, leaving them in the perusal of what remains to that natural oscitancy inherent in the tribe. I can only assure thee, courteous reader, for both our comforts, that my concern is altogether equal to thine, for my unhappiness in losing or mislaying among my papers the remaining part of these memoirs, which consisted of accidents, turns, and adventures, both new, agreeable, and surprising, and therefore calculated in all due points to the delicate taste of this our noble age. But alas! with my utmost endeavours I have been able only to retain a few of the heads. Under which there was a full account how Peter got a protection out of the King’s Bench, and of a reconcilement between Jack and him, upon a design they had in a certain rainy night to trepan brother Martin into a spunging-house, and there strip him to the skin. How Martin, with much ado, showed them both a fair pair of heels. How a new warrant came out against Peter, upon which Jack left him in the lurch, stole his protection, and made use of it himself. How Jack’s tatters came into fashion in court and city; how he got upon a great horse and ate custard [153]. But the particulars of all these, with several others which have now slid out of my memory, are lost beyond all hopes of recovery. For which misfortune, leaving my readers to condole with each other as far as they shall find it to agree with their several constitutions, but conjuring them by all the friendship that has passed between us, from the title-page to this, not to proceed so far as to injure their healths for an accident past remedy, I now go on to the ceremonial part of an accomplished writer, and therefore by a courtly modern least of all others to be omitted."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 260
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[240]"
  "translation_ja": "ゆえに、この奇跡的な論考の著者たる私は、ここまで予想を超え、先の取っ手によって、優しい読者をしっかりつかんできたが、とうとう手を緩めざるをえず、まことに名残惜しい。残りを読む際には、この種族に生来備わる、自然な欠伸癖へお任せすることになる。親切な読者よ、二人の慰めのため、これだけは請け合える。この回想の残りを、書類の間で失ったか、置き違えた不幸について、私の心配は、そなたの心配とまったく同じだ。その残りは、新しく、愉快で、驚くべき事件、転変、冒険から成り、したがって、わが高貴な時代の繊細な趣味へ、あらゆる点で、ぴたりと合っていた。だが、ああ、力の限りを尽くしても、いくつかの見出ししか残せなかった。その下には、次のようなことが、詳しく記されていたのだ。ピーターが、いかに王座裁判所から保護令状を手に入れたか。彼とジャックが、ある雨の夜、兄弟マーティンを債務者の仮留置所へおびき寄せ、そこで裸に剝ごうという計画から、いかに和解したか。マーティンが、苦労の末、いかに見事に二人へ踵を見せて逃げたか。ピーターに新しい令状が出ると、ジャックが彼を見捨て、保護令状を盗んで、自分のために使ったこと。ジャックのぼろが、宮廷とシティで流行したこと。彼が大きな馬へ乗り、カスタードを食べたこと[153]。だが、これらすべての細部と、今では記憶から滑り落ちた、さらにいくつかの話は、取り戻す望みもなく失われた。この不幸について、読者同士、それぞれの体質に合うかぎり、悔やみ合っていただこう。ただし、表題紙からここまで、われわれの間に交わされた、すべての友情にかけてお願いする。取り返しのつかぬ出来事で、健康を損なうほどには進まないでほしい。さて、今度は、完成された著者の儀礼的な部分へ進む。したがって、礼儀正しい近代人こそ、何より省くべきでない部分なのである。"
  "translation_status": "reviewed"

- "id": "tub-section-11-002"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "After so wide a compass as I have wandered, I do now gladly overtake and close in with my subject, and shall henceforth hold on with it an even pace to the end of my journey, except some beautiful prospect appears within sight of my way, whereof, though at present I have neither warning nor expectation, yet upon such an accident, come when it will, I shall beg my reader’s favour and company, allowing me to conduct him through it along with myself. For in writing it is as in travelling. If a man is in haste to be at home (which I acknowledge to be none of my case, having never so little business as when I am there), if his horse be tired with long riding and ill ways, or be naturally a jade, I advise him clearly to make the straightest and the commonest road, be it ever so dirty; but then surely we must own such a man to be a scurvy companion at best. He spatters himself and his fellow-travellers at every step. All their thoughts, and wishes, and conversation turn entirely upon the subject of their journey’s end, and at every splash, and plunge, and stumble they heartily wish one another at the devil."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 234
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[215]"
  "translation_ja": "これほど大きく巡り歩いた後、私は今、喜んで主題へ追いつき、合流した。これからは、旅の終わりまで、同じ歩調で進んでゆくつもりである。ただし、道の見える範囲に、美しい眺めが現れなければ、の話だ。今のところ、その予告も期待もないが、そうした偶然がいつ訪れようと、読者の御好意と御同伴を願い、私と一緒に、その中へ御案内することを、お許しいただきたい。文章を書くことも、旅と同じなのだから。家へ急いで帰りたい者がいるなら――私には当てはまらないと認めよう。家にいるときほど、用事が少ないことはない――、馬が長旅と悪路で疲れているか、生来の駄馬なら、どれほど泥だらけでも、最もまっすぐで、最もありふれた道を取るよう、はっきり勧める。だが、そういう男は、よくても、ろくな道連れではないと、認めるほかない。歩くたびに、自分と同行者へ泥をはねる。皆の考え、望み、会話は、もっぱら旅の終わりへ向けられ、はね、はまり、つまずくたびに、互いに、心から悪魔の所へ行けと願うのだ。"
  "translation_status": "reviewed"
- "id": "tub-section-11-003"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "On the other side, when a traveller and his horse are in heart and plight, when his purse is full and the day before him, he takes the road only where it is clean or convenient, entertains his company there as agreeably as he can, but upon the first occasion carries them along with him to every delightful scene in view, whether of art, of Nature, or of both; and if they chance to refuse out of stupidity or weariness, let them jog on by themselves, and be d—n’d. He’ll overtake them at the next town, at which arriving, he rides furiously through, the men, women, and children run out to gaze, a hundred noisy curs run barking after him, of which, if he honours the boldest with a lash of his whip, it is rather out of sport than revenge. But should some sourer mongrel dare too near an approach, he receives a salute on the chaps by an accidental stroke from the courser’s heels, nor is any ground lost by the blow, which sends him yelping and limping home."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 235
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[216]"
  "translation_ja": "一方、旅人も馬も元気で、よい調子にあり、財布は満ち、日もまだ長ければ、道は、きれいか、都合のよい所だけを選ぶ。そこで、できるだけ愉快に仲間をもてなすが、機会があればすぐ、見えるかぎりの楽しい眺めへ、皆を連れてゆく。技芸の眺めでも、自然の眺めでも、両方でもよい。もし愚鈍か疲労のため断るなら、勝手に、のろのろ行けばよい。くたばるがいい。次の町で追いついてやる。そこへ着くと、彼は勢いよく駆け抜け、男も女も子供も、眺めようと飛び出し、百匹の騒がしい犬が、吠えながら追ってくる。いちばん大胆な犬へ、鞭の一打という栄誉を与えるとしても、復讐より、遊びのためである。だが、もっと気難しい雑種が、あえて近づきすぎれば、馬の踵の偶然の一撃で、顎へ挨拶を受ける。その一撃で、こちらの進みは少しも損なわれず、犬は、きゃんきゃん鳴き、足を引きずって家へ帰る。"
  "translation_status": "reviewed"
- "id": "tub-section-11-004"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I now proceed to sum up the singular adventures of my renowned Jack, the state of whose dispositions and fortunes the careful reader does, no doubt, most exactly remember, as I last parted with them in the conclusion of a former section. Therefore, his next care must be from two of the foregoing to extract a scheme of notions that may best fit his understanding for a true relish of what is to ensue."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 236
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[217]"
  "translation_ja": "さて、名高いわがジャックの、比類ない冒険を、まとめてゆくことにしよう。注意深い読者は、前の節の結びで別れた、その性向と運命の状態を、疑いなく、最も正確に覚えているだろう。だから次の仕事は、先行する二つの節から、これからの話を真に味わうため、理解力へ最もよく合う、観念の図式を抽出することになる。"
  "translation_status": "reviewed"
- "id": "tub-section-11-005"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Jack had not only calculated the first revolution of his brain so prudently as to give rise to that epidemic sect of Æolists, but succeeding also into a new and strange variety of conceptions, the fruitfulness of his imagination led him into certain notions which, although in appearance very unaccountable, were not without their mysteries and their meanings, nor wanted followers to countenance and improve them. I shall therefore be extremely careful and exact in recounting such material passages of this nature as I have been able to collect either from undoubted tradition or indefatigable reading, and shall describe them as graphically as it is possible, and as far as notions of that height and latitude can be brought within the compass of a pen. Nor do I at all question but they will furnish plenty of noble matter for such whose converting imaginations dispose them to reduce all things into types, who can make shadows—no thanks to the sun—and then mould them into substances—no thanks to philosophy—whose peculiar talent lies in fixing tropes and allegories to the letter, and refining what is literal into figure and mystery."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 237
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[218]"
  "translation_ja": "ジャックは、脳の最初の革命を、あの広く蔓延する風崇拝者の宗派を生むほど、賢く計算したばかりではなかった。その後も、新しく奇妙な概念のさまざまへと進んだ。想像力の豊かさが導いた観念は、見たところ、まるで説明がつかなくても、神秘も意味もないわけではなく、支持し、発展させる追随者にも事欠かなかった。だから私は、疑いのない伝承と、疲れを知らぬ読書によって集められた、この種の重要なくだりを、極度に慎重に、正確に語ろう。そして、あれほどの高さと広がりを持つ観念が、ペンの範囲へ収まるかぎり、できるだけ生き生きと描くつもりだ。それらが、多くの高貴な材料を与えることを、私は少しも疑わない。変換好きの想像力によって、あらゆるものを比喩へ還元する人々に、とりわけそうである。彼らは、太陽の助けもなく影を作り、哲学の助けもなく、それを実体へ仕立てられる。転義や寓意を文字どおりに固定し、文字どおりのものを、比喩と神秘へ精製するのが、特有の才能なのだ。"
  "translation_status": "reviewed"
- "id": "tub-section-11-006"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Jack had provided a fair copy of his father’s will, engrossed in form upon a large skin of parchment, and resolving to act the part of a most dutiful son, he became the fondest creature of it imaginable. For although, as I have often told the reader, it consisted wholly in certain plain, easy directions about the management and wearing of their coats, with legacies and penalties in case of obedience or neglect, yet he began to entertain a fancy that the matter was deeper and darker, and therefore must needs have a great deal more of mystery at the bottom. “Gentlemen,” said he, “I will prove this very skin of parchment to be meat, drink, and cloth, to be the philosopher’s stone and the universal medicine.” In consequence of which raptures he resolved to make use of it in the most necessary as well as the most paltry occasions of life. He had a way of working it into any shape he pleased, so that it served him for a nightcap when he went to bed, and for an umbrella in rainy weather. He would lap a piece of it about a sore toe; or, when he had fits, burn two inches under his nose; or, if anything lay heavy on his stomach, scrape off and swallow as much of the powder as would lie on a silver penny—they were all infallible remedies. With analogy to these refinements, his common talk and conversation ran wholly in the praise of his Will, and he circumscribed the utmost of his eloquence within that compass, not daring to let slip a syllable without authority from thence. Once at a strange house he was suddenly taken short upon an urgent juncture, whereon it may not be allowed too particularly to dilate, and being not able to call to mind, with that suddenness the occasion required, an authentic phrase for demanding the way to the back, he chose rather, as the more prudent course, to incur the penalty in such cases usually annexed; neither was it possible for the united rhetoric of mankind to prevail with him to make himself clean again, because, having consulted the will upon this emergency, he met with a passage near the bottom (whether foisted in by the transcriber is not known) which seemed to forbid it [145a]."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 238
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[219]"
  "translation_ja": "ジャックは、父の遺言を、立派な写しにして用意した。大きな羊皮紙一枚へ、正式に清書したものである。そして、最も孝行な息子の役を果たそうと決め、想像できるかぎりで、いちばんの遺言好きになった。読者へ何度も述べたとおり、遺言の内容は、上着の手入れと着方についての、いくつかの平明で容易な指示と、従う場合の遺贈、怠る場合の罰に、すべて尽きていた。それなのに彼は、もっと深く、暗い内容なのだから、その底には、はるかに多くの神秘があるに違いない、と考え始めた。「諸君」と彼は言った。「私は、この羊皮紙そのものが、食べ物、飲み物、衣服であり、賢者の石であり、万能薬であると証明しよう。」こうした有頂天な考えに従い、人生の最も必要な場合にも、最もつまらぬ場合にも、それを使おうと決めた。好きな形へ加工する方法を持ち、寝るときは寝帽になり、雨の日には傘になった。痛む足指へ、一切れ巻きつけたり、発作のときには、鼻の下で二インチ分を燃やしたりした。胃が重ければ、銀の一ペニー貨に載るほど、粉を削り取って飲み込んだ。どれも、必ず効く治療法だった。こうした洗練に合わせ、日頃の話や会話も、すべて遺言の賛美へ向かった。雄弁の最大限を、その範囲に閉じ込め、そこからの権威なしには、一音節も口を滑らせようとしなかった。あるとき、よその家で、突然、ある切迫した事態に襲われた。あまり細かく述べることは、許されぬ事態である。ところが、裏の場所への道を尋ねる、正統な言い回しを、その場の要求する速さで思い出せなかったので、より賢明な道として、その場合ふつう伴う罰を、あえて受けるほうを選んだ。しかも、人類すべての修辞を合わせても、再び身をきれいにするよう、彼を説得できなかった。この急場に遺言を調べると、末尾近くに、それを禁じているらしい一節を見つけたからだ。書き写した者が紛れ込ませたかどうかは、知られていない[145a]。"
  "translation_status": "reviewed"
- "id": "tub-section-11-007"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He made it a part of his religion never to say grace to his meat, nor could all the world persuade him, as the common phrase is, to eat his victuals like a Christian [145b]."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 239
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[220]"
  "translation_ja": "食事に祈りを捧げないことを、宗教の一部とした。世間が総がかりでも、いわゆる、キリスト教徒らしく食べるよう、彼を説き伏せられなかった[145b]。"
  "translation_status": "reviewed"
- "id": "tub-section-11-008"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He bore a strange kind of appetite to snap-dragon and to the livid snuffs of a burning candle [146a], which he would catch and swallow with an agility wonderful to conceive; and by this procedure maintained a perpetual flame in his belly, which issuing in a glowing steam from both his eyes, as well as his nostrils and his mouth, made his head appear in a dark night like the skull of an ass wherein a roguish boy hath conveyed a farthing-candle, to the terror of his Majesty’s liege subjects. Therefore he made use of no other expedient to light himself home, but was wont to say that a wise man was his own lanthorn."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 240
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[221]"
  "translation_ja": "彼は、火をつけた酒から食べ物をつまみ取るスナップドラゴンと、燃える蝋燭の青白い芯に、奇妙な食欲を抱いていた[146a]。それらを、想像もつかぬ敏捷さで、つかんでは飲み込んだ。このやり方で、腹の中に絶えない炎を保った。その炎が、両目からも、鼻孔や口からも、光る蒸気となって出るので、暗い夜、その頭は、悪戯な少年が一ファージングの蝋燭を仕込んだ驢馬の頭蓋骨のように見え、陛下の忠良なる臣民をおびやかした。だから、家へ戻る明かりとして、ほかの工夫は使わず、賢者は自分自身が提灯なのだ、とよく言った。"
  "translation_status": "reviewed"
- "id": "tub-section-11-009"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He would shut his eyes as he walked along the streets, and if he happened to bounce his head against a post or fall into the kennel (as he seldom missed either to do one or both), he would tell the gibing apprentices who looked on that he submitted with entire resignation, as to a trip or a blow of fate, with whom he found by long experience how vain it was either to wrestle or to cuff, and whoever durst undertake to do either would be sure to come off with a swingeing fall or a bloody nose. “It was ordained,” said he [146b], “some few days before the creation, that my nose and this very post should have a rencounter, and therefore Providence thought fit to send us both into the world in the same age, and to make us countrymen and fellow-citizens. Now, had my eyes been open, it is very likely the business might have been a great deal worse, for how many a confounded slip is daily got by man with all his foresight about him. Besides, the eyes of the understanding see best when those of the senses are out of the way, and therefore blind men are observed to tread their steps with much more caution, and conduct, and judgment than those who rely with too much confidence upon the virtue of the visual nerve, which every little accident shakes out of order, and a drop or a film can wholly disconcert; like a lanthorn among a pack of roaring bullies when they scour the streets, exposing its owner and itself to outward kicks and buffets, which both might have escaped if the vanity of appearing would have suffered them to walk in the dark. But further, if we examine the conduct of these boasted lights, it will prove yet a great deal worse than their fortune. It is true I have broke my nose against this post, because Providence either forgot, or did not think it convenient, to twitch me by the elbow and give me notice to avoid it. But let not this encourage either the present age of posterity to trust their noses unto the keeping of their eyes, which may prove the fairest way of losing them for good and all. For, O ye eyes, ye blind guides, miserable guardians are ye of our frail noses; ye, I say, who fasten upon the first precipice in view, and then tow our wretched willing bodies after you to the very brink of destruction. But alas! that brink is rotten, our feet slip, and we tumble down prone into a gulf, without one hospitable shrub in the way to break the fall—a fall to which not any nose of mortal make is equal, except that of the giant Laurcalco [147a], who was Lord of the Silver Bridge. Most properly, therefore, O eyes, and with great justice, may you be compared to those foolish lights which conduct men through dirt and darkness till they fall into a deep pit or a noisome bog.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 241
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[222]"
  "translation_ja": "彼は、街を歩くとき、目を閉じた。たまたま柱へ頭をぶつけたり、溝へ落ちたりすると――片方、または両方を、めったに欠かさなかったが――見ていてからかう徒弟たちに、こう語った。それは運命に足をかけられ、あるいは殴られたものとして、全面的な諦念をもって受け入れる。運命と組み合ったり、殴り合ったりしても、どれほどむだか、長い経験でわかっている。どちらかを試みる勇気のある者は、必ず、ひどく投げ倒されるか、鼻血を出して終わるだろう、と。「天地創造の数日前に」と彼は言った[146b]。「私の鼻と、この柱そのものが出会うことは、定められていた。だから摂理は、われわれ両者を同じ時代に世へ送り、同国人、同市民にするのをよしとしたのだ。さて、目が開いていたら、事態はよほど悪かったかもしれない。先を見通す力をすっかり備えていながら、人間は毎日、どれほどひどいつまずきをすることか。しかも、理解力の目は、感覚の目が邪魔をしないとき、最もよく見る。だから盲人のほうが、視神経の働きを過信する者より、はるかに慎重に、巧みに、分別をもって歩くと観察されている。視神経など、小さな出来事で、すぐ調子が狂い、一滴や薄い膜で、すっかり混乱する。騒々しいごろつきの一団が街を荒らす中の、提灯のようなものだ。持ち主と自分を、外からの蹴りや殴打へさらす。姿を見せたいという虚栄さえ、暗闇を歩くことを許せば、どちらも免れたのに。さらに、この自慢の明かりの行いを調べると、その運より、はるかに悪いとわかる。たしかに私は、この柱で鼻を折った。摂理が、肘を引いて避けるよう知らせるのを忘れたか、そうするのが都合よくないと考えたからだ。しかし、このために、今の時代も後世も、鼻の番を目へ任せようと、勇気づけられてはならない。それこそ、鼻を永遠に失う、いちばん確実な道となるかもしれない。おお目よ、盲目の案内人よ、われわれの脆い鼻の、惨めな守護者よ。そう、お前たちは、最初に見える断崖をとらえ、哀れにも従順な体を引いて、破滅の縁ぎりぎりまで連れてゆく。だが、ああ、その縁は腐っており、足が滑って、われわれは真っ逆さまに淵へ落ちる。途中には、転落を和らげる、親切な灌木一つない。その転落に耐える、人間製の鼻は、銀の橋の主、巨人ラウルカルコの鼻以外にはない[147a]。だから、おお目よ、お前たちを、泥と闇の中へ人を導き、深い穴や、悪臭を放つ沼へ落ち込ませる、愚かな鬼火へたとえるのは、きわめて適切で、まことに公正なのだ。」"
  "translation_status": "reviewed"
- "id": "tub-section-11-010"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This I have produced as a scantling of Jack’s great eloquence and the force of his reasoning upon such abstruse matters."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 242
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[223]"
  "translation_ja": "以上を、このような深遠な問題についての、ジャックの偉大な雄弁と、推論の力の、見本として挙げた。"
  "translation_status": "reviewed"
- "id": "tub-section-11-011"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He was, besides, a person of great design and improvement in affairs of devotion, having introduced a new deity, who has since met with a vast number of worshippers, by some called Babel, by others Chaos, who had an ancient temple of Gothic structure upon Salisbury plain, famous for its shrine and celebration by pilgrims."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 243
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[224]"
  "translation_ja": "そのうえ彼は、信仰の事柄でも、大きな企てと改良を行う人物だった。新しい神を導入し、それは、その後、大勢の崇拝者を得た。ある者はバベル、ある者はカオスと呼ぶ。ソールズベリー平原に、ゴシック建築の古い神殿があり、その社と、巡礼たちの祝祭で名高かった。"
  "translation_status": "reviewed"
- "id": "tub-section-11-012"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When he had some roguish trick to play, he would down with his knees, up with his eyes, and fall to prayers though in the midst of the kennel. Then it was that those who understood his pranks would be sure to get far enough out of his way; and whenever curiosity attracted strangers to laugh or to listen, he would of a sudden bespatter them with mud."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 244
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[225]"
  "translation_ja": "何か悪だくみをするときには、たとえ溝の真ん中でも、膝をつき、目を上へ向け、祈り始めた。すると、彼のいたずらを知る者は、きっと十分遠くへ、道をよけた。好奇心に引かれたよそ者が、笑い、聞こうと集まると、いつでも、突然、泥をはねかけたのである。"
  "translation_status": "reviewed"
- "id": "tub-section-11-013"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In winter he went always loose and unbuttoned, and clad as thin as possible to let in the ambient heat, and in summer lapped himself close and thick to keep it out [147b]."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 245
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[226]"
  "translation_ja": "冬には、周りの熱を入れるため、いつも服を緩め、ボタンを外し、できるだけ薄着をした。夏には、熱を締め出すため、ぴたりと厚く着込んだ[147b]。"
  "translation_status": "reviewed"
- "id": "tub-section-11-014"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In all revolutions of government, he would make his court for the office of hangman-general, and in the exercise of that dignity, wherein he was very dexterous, would make use of no other vizard than a long prayer."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 246
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[227]"
  "translation_ja": "政変のたびに、絞首刑執行総監の職を求めて、取り入ろうとした。その役目には、たいそう器用だったが、その威厳を行使するとき、長い祈り以外の覆面は、何も使わなかった。"
  "translation_status": "reviewed"
- "id": "tub-section-11-015"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He had a tongue so musculous and subtile, that he could twist it up into his nose and deliver a strange kind of speech from thence. He was also the first in these kingdoms who began to improve the Spanish accomplishment of braying; and having large ears perpetually exposed and erected, he carried his art to such a perfection, that it was a point of great difficulty to distinguish either by the view or the sound between the original and the copy."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 247
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[228]"
  "translation_ja": "舌は、たいそう筋肉が発達し、器用だったので、ひねって鼻の中へ入れ、そこから奇妙な話し声を出すことができた。また、この王国で初めて、驢馬のように鳴くスペイン流の技を、改良し始めたのも彼だった。大きな耳を、いつもさらし、立てていたので、その技を、見るにも聞くにも、原物と模倣の区別が、たいそう難しいほどに完成させた。"
  "translation_status": "reviewed"
- "id": "tub-section-11-016"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He was troubled with a disease the reverse to that called the stinging of the tarantula, and would run dog-mad at the noise of music, especially a pair of bagpipes [148a]. But he would cure himself again by taking two or three turns in Westminster Hall, or Billingsgate, or in a boarding-school, or the Royal Exchange, or a state coffee-house."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 248
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[229]"
  "translation_ja": "タランチュラに刺されたと呼ばれる病の、反対の病に悩まされ、音楽の音、とりわけバグパイプの音を聞くと、狂犬のようになった[148a]。だが、ウェストミンスター・ホール、ビリングズゲート、寄宿学校、王立取引所、政治談義のコーヒー店のどこかを、二、三周歩けば、再び治った。"
  "translation_status": "reviewed"
- "id": "tub-section-11-017"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He was a person that feared no colours, but mortally hated all, and upon that account bore a cruel aversion to painters, insomuch that in his paroxysms as he walked the streets, he would have his pockets loaded with stones to pelt at the signs [148b]."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 249
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[230]"
  "translation_ja": "どんな旗色も恐れない男だったが、どんな色も、死ぬほど憎んだ。そのため画家へ残酷な嫌悪を抱き、発作のとき、街を歩くには、ポケットを石でいっぱいにして、看板へ投げつけた[148b]。"
  "translation_status": "reviewed"
- "id": "tub-section-11-018"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Having from his manner of living frequent occasions to wash himself, he would often leap over head and ears into the water, though it were in the midst of the winter, but was always observed to come out again much dirtier, if possible, than he went in [148c]."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 250
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[231]"
  "translation_ja": "暮らし方のため、体を洗う機会がたびたびあり、真冬のさなかでも、しばしば頭まで、水へ飛び込んだ。しかし、出てくるときは、入ったときより、できることなら、ずっと汚くなっていると、いつも観察された[148c]。"
  "translation_status": "reviewed"
- "id": "tub-section-11-019"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He was the first that ever found out the secret of contriving a soporiferous medicine to be conveyed in at the ears [148d]. It was a compound of sulphur and balm of Gilead, with a little pilgrim’s salve."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 251
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[232]"
  "translation_ja": "耳から送り込む睡眠薬の工夫という秘密を、初めて発見したのも彼だった[148d]。硫黄とギレアドの香油に、巡礼の膏薬を少し混ぜた薬だった。"
  "translation_status": "reviewed"
- "id": "tub-section-11-020"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He wore a large plaister of artificial caustics on his stomach, with the fervour of which he could set himself a groaning like the famous board upon application of a red-hot iron."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 252
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[233]"
  "translation_ja": "腹には、人工の腐食剤を塗った大きな貼り薬をつけていた。その熱によって、焼けた鉄をあてる、あの有名な板のように、いつでも自分を唸らせることができた。"
  "translation_status": "reviewed"
- "id": "tub-section-11-021"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "He would stand in the turning of a street, and calling to those who passed by, would cry to one, “Worthy sir, do me the honour of a good slap in the chaps;” to another, “Honest friend, pray favour me with a handsome kick in the rear;” “Madam, shall I entreat a small box in the ear from your ladyship’s fair hands?” “Noble captain, lend a reasonable thwack, for the love of God, with that cane of yours over these poor shoulders.” And when he had by such earnest solicitations made a shift to procure a basting sufficient to swell up his fancy and his sides, he would return home extremely comforted, and full of terrible accounts of what he had undergone for the public good. “Observe this stroke,” said he, showing his bare shoulders; “a plaguy janissary gave it me this very morning at seven o’clock, as, with much ado, I was driving off the Great Turk. Neighbours mine, this broken head deserves a plaister; had poor Jack been tender of his noddle, you would have seen the Pope and the French King long before this time of day among your wives and your warehouses. Dear Christians, the Great Moghul was come as far as Whitechapel, and you may thank these poor sides that he hath not—God bless us—already swallowed up man, woman, and child.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 253
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[234]"
  "translation_ja": "彼は、街角の曲がり目に立ち、通る人へ呼びかけた。ある人には、「御立派な旦那、どうか口へ、よい平手打ちをいただく栄誉を」と叫んだ。別の人には、「正直な御友人、ひとつ尻へ、見事な蹴りをお恵みください」と言った。「奥様、その美しいお手で、耳へ小さな一発をお願いできましょうか。」「気高い隊長殿、神のお慈悲に、その杖で、この哀れな肩へ、ほどよい一打をお貸しください。」こうした熱心な懇願によって、空想と脇腹を十分に膨らませるだけの殴打を、どうにか手に入れると、たいそう慰められて帰宅し、公共のために受けた苦難の、恐ろしい話をたっぷり披露した。「この一打を見たまえ」と、裸の肩を見せて言った。「今朝の七時、トルコの大君を、やっと追い払っていたとき、忌まわしいイェニチェリが、これをくれたのだ。近所の皆さん、この割れた頭には、貼り薬が必要だ。哀れなジャックが、自分の頭を大事にしすぎていたなら、今よりずっと前に、教皇とフランス王が、あなた方の女房や倉庫の間に入り込むのを、見ていたはずだ。親愛なるキリスト教徒よ、大ムガル皇帝は、ホワイトチャペルまで来ていた。この哀れな脇腹へ感謝したまえ。これがなければ、男も女も子供も、もう――神よ、お守りください――丸呑みにされていたのだから。」"
  "translation_status": "reviewed"
- "id": "tub-section-11-022"
  "section_id": "section-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It was highly worth observing the singular effects of that aversion or antipathy which Jack and his brother Peter seemed, even to affectation, to bear towards each other. Peter had lately done some rogueries that forced him to abscond, and he seldom ventured to stir out before night for fear of bailiffs. Their lodgings were at the two most distant parts of the town from each other, and whenever their occasions or humours called them abroad, they would make choice of the oddest, unlikely times, and most uncouth rounds that they could invent, that they might be sure to avoid one another. Yet, after all this, it was their perpetual fortune to meet, the reason of which is easy enough to apprehend, for the frenzy and the spleen of both having the same foundation, we may look upon them as two pair of compasses equally extended, and the fixed foot of each remaining in the same centre, which, though moving contrary ways at first, will be sure to encounter somewhere or other in the circumference. Besides, it was among the great misfortunes of Jack to bear a huge personal resemblance with his brother Peter. Their humour and dispositions were not only the same, but there was a close analogy in their shape, their size, and their mien; insomuch as nothing was more frequent than for a bailiff to seize Jack by the shoulders and cry, “Mr. Peter, you are the king’s prisoner;” or, at other times, for one of Peter’s nearest friends to accost Jack with open arms: “Dear Peter, I am glad to see thee; pray send me one of your best medicines for the worms.” This, we may suppose, was a mortifying return of those pains and proceedings Jack had laboured in so long, and finding how directly opposite all his endeavours had answered to the sole end and intention which he had proposed to himself, how could it avoid having terrible effects upon a head and heart so furnished as his? However, the poor remainders of his coat bore all the punishment. The orient sun never entered upon his diurnal progress without missing a piece of it. He hired a tailor to stitch up the collar so close that it was ready to choke him, and squeezed out his eyes at such a rate as one could see nothing but the white. What little was left of the main substance of the coat he rubbed every day for two hours against a rough-cast wall, in order to grind away the remnants of lace and embroidery, but at the same time went on with so much violence that he proceeded a heathen philosopher. Yet after all he could do of this kind, the success continued still to disappoint his expectation, for as it is the nature of rags to bear a kind of mock resemblance to finery, there being a sort of fluttering appearance in both, which is not to be distinguished at a distance in the dark or by short-sighted eyes, so in those junctures it fared with Jack and his tatters, that they offered to the first view a ridiculous flaunting, which, assisting the resemblance in person and air, thwarted all his projects of separation, and left so near a similitude between them as frequently deceived the very disciples and followers of both . . . Desunt nonnulla, . . ."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 254
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[235]"
  "translation_ja": "ジャックと兄ピーターが、互いに抱くらしい嫌悪と反感、それも、わざとらしいほどの反感が、奇妙な結果を生んだことは、大いに注目に値した。ピーターは最近、いくつか悪事を働き、身を隠さねばならなくなっていた。執行吏を恐れ、夜になるまで、めったに外へ出ようとしなかった。二人の宿は、町の中で最も遠く離れていた。用事や気分によって出かけるときは、互いを必ず避けられるよう、思いつくかぎり、最も奇妙で、ありそうもない時刻と、最も不自然な回り道を選んだ。それでもなお、出会うことが、絶えぬ運命だった。理由は、十分容易に理解できる。二人の錯乱と癇癪は、同じ土台を持っていたので、等しく開かれた二本のコンパスと考えればよい。それぞれの固定した脚は同じ中心にあり、初めは逆向きに動いても、円周のどこかで、必ず出会うのである。そのうえ、ジャックの大きな不幸の一つは、兄ピーターと、容姿がひどく似ていることだった。気分や性向が同じだけでなく、形、体格、物腰も、そっくりだった。だから、執行吏がジャックの肩をつかみ、「ピーター氏、国王の囚人として捕らえる」と叫ぶことも、ピーターの親友の一人が、両腕を広げてジャックへ近づき、「親愛なるピーター、会えて嬉しい。虫に効く、いちばんよい薬を、ひとつ送ってくれたまえ」と言うことも、しょっちゅうだった。長く骨を折ってきたジャックの努力と作業への、屈辱的な報いだったに違いない。すべての努力が、自分に定めた唯一の目的と意図に、正反対の答えを返したと知って、彼のような仕立ての頭と心に、恐ろしい影響が出ないはずがあろう。だが、罰はすべて、上着の哀れな残りが受けた。東の太陽は、日々の運行を始めるたび、その一片が欠けているのを見た。彼は仕立屋を雇い、襟を、今にも窒息しそうなほど、きつく縫い合わせた。目は押し出され、白目しか見えなくなるほどだった。わずかに残った上着の本体は、毎日二時間、ざらついた壁へこすりつけ、モールや刺繍の残りを削り落とそうとした。だが、同時に、あまりに激しく続けたので、異教の哲学者にまでなってしまった。それでも、こうしたことを何もかも尽くした後も、成果は相変わらず期待を裏切った。ぼろ切れには、上等な装いへ、一種のまがいの類似を見せる性質があるからだ。どちらにも、ひらひらした見かけがあり、遠くからや、暗闇でや、近眼の目では、見分けがつかない。ジャックとそのぼろも、その場面では同じだった。一見すると、滑稽な派手さがあり、容姿や態度の類似を助けたため、別物になろうとする、あらゆる計画を妨げた。二人には、双方の弟子や追随者さえ、たびたび取り違えるほどの、近い類似が残ったのである。……〔若干の欠落〕……"
  "translation_status": "reviewed"

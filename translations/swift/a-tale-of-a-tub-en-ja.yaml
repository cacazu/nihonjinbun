    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[207]"
  "translation_ja": "近年、著者の国民と読者の国民の間に交わされた、驚くほどの礼儀正しさは、この時代の高度な洗練を示す、反論不能の証拠である。芝居、パンフレット、詩の一つでも現れると、たいてい、世間の広い歓迎と喝采に対する感謝でいっぱいの序文がついている。その歓迎を、どこで、いつ、どうやって、誰から受けたかは、神のみぞ知るところだ。これほどほめるべき習慣に、しかるべく敬意を払い、私もここで、この神々しい論考に対する寛大さと、普遍的な歓迎について、つつましくお礼を述べる。国王陛下と上下両院、国王のいとも名誉ある枢密院の諸卿、尊敬すべき裁判官、わが国の聖職者、紳士、自営農民の方々に。だが、とりわけ、ウィルズ・コーヒー店、グレシャム・カレッジ、ウォリック・レイン、ムーアフィールズ、スコットランド・ヤード、ウェストミンスター・ホール、ギルドホールの、わが立派な同胞と友人たちに。要するに、宮廷、教会、軍営、都、田舎、どこにいようと、すべての住人と関係者の方々に、である。その御承認と好意的なお考えを、極上の感謝をもって受け取り、私の乏しい力の及ぶかぎり、あらゆる機会をつかんで、御恩を返したい。"
  "translation_status": "reviewed"
- "id": "tub-section-10-003"
  "section_id": "section-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I am also happy that fate has flung me into so blessed an age for the mutual felicity of booksellers and authors, whom I may safely affirm to be at this day the two only satisfied parties in England. Ask an author how his last piece has succeeded, “Why, truly he thanks his stars the world has been very favourable, and he has not the least reason to complain.” And yet he wrote it in a week at bits and starts, when he could steal an hour from his urgent affairs, as it is a hundred to one you may see further in the preface, to which he refers you, and for the rest to the bookseller. There you go as a customer, and make the same question, “He blesses his God the thing takes wonderful; he is just printing a second edition, and has but three left in his shop.” “You beat down the price; sir, we shall not differ,” and in hopes of your custom another time, lets you have it as reasonable as you please; “And pray send as many of your acquaintance as you will; I shall upon your account furnish them all at the same rate.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 226
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[208]"
  "translation_ja": "また、書店主と著者が、ともに幸福である、これほど祝福された時代へ、運命が私を投じてくれたのも、幸せなことだ。この二者こそ、今日のイングランドで、満足している唯一の二党派だと、安心して断言できる。著者に、最新作の首尾を尋ねてみるがよい。「いや、まったく、星の巡りに感謝します。世間がとても好意的で、少しも不平を言う理由はありません。」しかも、その本は、差し迫った仕事から一時間を盗み取れるたび、一週間の間、切れ切れに、思いつくまま書いたものなのだ。十中九分、そのことは、さらに序文でわかる。著者は、そちらを見よと言い、残りは書店主へ尋ねるよう案内する。そこで客として店へ行き、同じ問いをすると、「ありがたいことに、ものすごい人気です。ただいま第二版を刷っておりまして、店にはもう三冊しかございません。」値切ってみる。「旦那、お値段で揉めることはございません。」次の御来店を期待して、望むほど安く譲ってくれる。「それに、お知り合いも何人でもお送りください。あなた様の御紹介なら、皆様に同じお値段でお出しします。」"
  "translation_status": "reviewed"
- "id": "tub-section-10-004"
  "section_id": "section-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now it is not well enough considered to what accidents and occasions the world is indebted for the greatest part of those noble writings which hourly start up to entertain it. If it were not for a rainy day, a drunken vigil, a fit of the spleen, a course of physic, a sleepy Sunday, an ill run at dice, a long tailor’s bill, a beggar’s purse, a factious head, a hot sun, costive diet, want of books, and a just contempt of learning,—but for these events, I say, and some others too long to recite (especially a prudent neglect of taking brimstone inwardly), I doubt the number of authors and of writings would dwindle away to a degree most woeful to behold. To confirm this opinion, hear the words of the famous troglodyte philosopher. “It is certain,” said he, “some grains of folly are of course annexed as part in the composition of human nature; only the choice is left us whether we please to wear them inlaid or embossed, and we need not go very far to seek how that is usually determined, when we remember it is with human faculties as with liquors, the lightest will be ever at the top.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 227
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[209]"
  "translation_ja": "さて、世間を楽しませるため、刻々と現れる立派な著作の大半が、どんな偶然や機会に負っているかは、十分に考えられていない。雨の日、酔った徹夜、癇癪の発作、服薬の一期間、眠い日曜日、骰子の負け続け、長い仕立屋の勘定書、乞食の財布、党派好きの頭、暑い太陽、便秘になる食事、書物の欠乏、学問への正当な軽蔑。こうした出来事や、挙げるには長すぎる、ほかのいくつか、とくに硫黄の内服を賢明に怠ることがなければ、著者と著作の数は、見るも哀れなほど減ってしまうだろう。この意見を確かめるため、名高い洞穴住まいの哲学者の言葉を聞こう。「確かなことだが」と彼は言う。「人間性の組成には、いくらかの愚かさの粒が、当然の一部分として添えられている。われわれに残される選択は、それを象嵌にして内へ埋め込むか、浮彫にして外へ出すか、というだけだ。どちらに決まるのが普通かを知るため、遠くまで探す必要はない。人間の諸能力も酒と同じで、最も軽いものが、いつも上へ来ると、思い出せばよい。」"
  "translation_status": "reviewed"
- "id": "tub-section-10-005"
  "section_id": "section-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is in this famous island of Britain a certain paltry scribbler, very voluminous, whose character the reader cannot wholly be a stranger to. He deals in a pernicious kind of writings called “Second Parts,” and usually passes under the name of “The Author of the First.” I easily foresee that as soon as I lay down my pen this nimble operator will have stole it, and treat me as inhumanly as he has already done Dr. Blackmore, Lestrange, and many others who shall here be nameless. I therefore fly for justice and relief into the hands of that great rectifier of saddles and lover of mankind, Dr. Bentley, begging he will take this enormous grievance into his most modern consideration; and if it should so happen that the furniture of an ass in the shape of a second part must for my sins be clapped, by mistake, upon my back, that he will immediately please, in the presence of the world, to lighten me of the burthen, and take it home to his own house till the true beast thinks fit to call for it."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 228
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[210]"
  "translation_ja": "この名高いブリテン島に、ある取るに足りぬ駄文書きがいる。ひどく多作で、読者もその人となりを、まったく御存じないわけではあるまい。「第二部」と呼ばれる有害な種類の文章を扱い、ふつう「第一部の著者」の名で通っている。私がペンを置くやいなや、このすばしこい仕事師が、それを盗み取り、すでにブラックモア博士、レストレンジ、その他、ここでは名を伏せる多くの人々にしたように、私を非人道的に扱うことは、容易に見通せる。そこで私は、公正と救済を求めて、鞍を正す偉人にして、人類を愛するベントリー博士の手へ逃げ込む。この途方もない弊害を、その最も近代的な御考慮に入れていただきたい。そして、もし私の罪ゆえ、第二部という形をした驢馬の馬具が、うっかり私の背へ載せられたら、世間の面前で、ただちにその荷を下ろし、本当の獣が受け取りに来るまで、御自宅に預かっていただきたい。"
  "translation_status": "reviewed"
- "id": "tub-section-10-006"
  "section_id": "section-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In the meantime, I do here give this public notice that my resolutions are to circumscribe within this discourse the whole stock of matter I have been so many years providing. Since my vein is once opened, I am content to exhaust it all at a running, for the peculiar advantage of my dear country, and for the universal benefit of mankind. Therefore, hospitably considering the number of my guests, they shall have my whole entertainment at a meal, and I scorn to set up the leavings in the cupboard. What the guests cannot eat may be given to the poor, and the dogs under the table may gnaw the bones [140]. This I understand for a more generous proceeding than to turn the company’s stomachs by inviting them again to-morrow to a scurvy meal of scraps."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 229
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[211]"
  "translation_ja": "その間に、公にお知らせしておく。長年用意してきた材料の全在庫を、この論説一つの内に収めるのが、私の決意である。ひとたび血管を開いたからには、愛する祖国の特別な利益と、人類の普遍的な幸福のため、一度に流し尽くしてよいと思っている。ゆえに、もてなしの心で客の数を考え、料理のすべてを、一度の食事でお出ししよう。残り物を戸棚へしまうなど、私は潔しとしない。客が食べきれなければ、貧しい者に与えればよいし、卓の下の犬には、骨をかじらせればよい[140]。明日また招いて、みすぼらしい残り物の食事で、皆の胃をむかつかせるより、そのほうが寛大なやり方だと、私は理解している。"
  "translation_status": "reviewed"
- "id": "tub-section-10-007"
  "section_id": "section-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If the reader fairly considers the strength of what I have advanced in the foregoing section, I am convinced it will produce a wonderful revolution in his notions and opinions, and he will be abundantly better prepared to receive and to relish the concluding part of this miraculous treatise. Readers may be divided into three classes—the superficial, the ignorant, and the learned, and I have with much felicity fitted my pen to the genius and advantage of each. The superficial reader will be strangely provoked to laughter, which clears the breast and the lungs, is sovereign against the spleen, and the most innocent of all diuretics. The ignorant reader (between whom and the former the distinction is extremely nice) will find himself disposed to stare, which is an admirable remedy for ill eyes, serves to raise and enliven the spirits, and wonderfully helps perspiration. But the reader truly learned, chiefly for whose benefit I wake when others sleep, and sleep when others wake, will here find sufficient matter to employ his speculations for the rest of his life. It were much to be wished, and I do here humbly propose for an experiment, that every prince in Christendom will take seven of the deepest scholars in his dominions and shut them up close for seven years in seven chambers, with a command to write seven ample commentaries on this comprehensive discourse. I shall venture to affirm that, whatever difference may be found in their several conjectures, they will be all, without the least distortion, manifestly deducible from the text. Meantime it is my earnest request that so useful an undertaking may be entered upon (if their Majesties please) with all convenient speed, because I have a strong inclination before I leave the world to taste a blessing which we mysterious writers can seldom reach till we have got into our graves, whether it is that fame being a fruit grafted on the body, can hardly grow and much less ripen till the stock is in the earth, or whether she be a bird of prey, and is lured among the rest to pursue after the scent of a carcass, or whether she conceives her trumpet sounds best and farthest when she stands on a tomb, by the advantage of a rising ground and the echo of a hollow vault."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 230
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[212]"
  "translation_ja": "先の節で示した論の強さを、読者が公正に考えれば、その観念と意見に、驚くべき革命を起こし、この奇跡的な論考の結びの部分を、受け取り、味わう準備も、ずっとよく整うと確信する。読者は、浅薄な者、無知な者、学識ある者の三つに分けられる。私は、たいへん幸いにも、それぞれの性向と利益へ、ペンを合わせた。浅薄な読者は、妙に笑いを誘われるだろう。笑いは胸と肺をきれいにし、憂鬱への特効があり、あらゆる利尿剤の中で、最も無害である。無知な読者――前者との区別は、きわめて繊細だが――は、ぽかんと目を見張りたくなるだろう。これは悪い目の見事な治療法であり、気力を高め、活気づけ、驚くほど発汗を助ける。だが、真に学識ある読者は、その人の利益のためにこそ、私は他人が眠る間に起き、他人が起きる間に眠るのだが、ここに、余生の思索を十分に満たす材料を見つけるだろう。強く望まれることが一つあり、私はここで、つつましく実験を提案する。キリスト教世界のすべての君主が、領内の最も深遠な学者を七人選び、七つの部屋へ七年間、厳重に閉じ込め、この包括的な論説について、七つの浩瀚な注釈を書くよう命じていただきたい。各人の推測にどんな違いがあろうと、いささかも歪めず、すべて本文から明白に導き出せると、私はあえて断言する。それまでの間、私の切なる願いは、このような有益な事業へ、陛下方の御意向がよろしければ、できるだけ早く取りかかっていただくことだ。われわれ神秘的な著者が、墓に入るまで、めったに得られぬ祝福を、この世を去る前に味わいたいという、強い望みがあるからである。名声は体に接ぎ木された果実なので、台木が土に入るまで、なかなか育たず、まして熟さないからなのか。それとも、猛禽なので、ほかの鳥と同じく、死骸の臭いを追っておびき寄せられるからなのか。それとも、高所の利点と、空洞の墓の反響によって、墓の上に立つとき、自分のラッパが、最もよく、最も遠くまで鳴ると考えるからなのか。"
  "translation_status": "reviewed"
- "id": "tub-section-10-008"
  "section_id": "section-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is true, indeed, the republic of dark authors, after they once found out this excellent expedient of dying, have been peculiarly happy in the variety as well as extent of their reputation. For night being the universal mother of things, wise philosophers hold all writings to be fruitful in the proportion they are dark, and therefore the true illuminated (that is to say, the darkest of all) have met with such numberless commentators, whose scholiastic midwifery hath delivered them of meanings that the authors themselves perhaps never conceived, and yet may very justly be allowed the lawful parents of them, the words of such writers being like seed, which, however scattered at random, when they light upon a fruitful ground, will multiply far beyond either the hopes or imagination of the sower."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 231
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[213]"
  "translation_ja": "たしかに、難解な著者の共和国は、死ぬという見事な方便をひとたび発見してから、評判の多様さにおいても、広がりにおいても、とりわけ幸福だった。夜は万物の普遍的な母なので、賢い哲学者たちは、あらゆる著作は、暗ければ暗いほど、実り豊かだと考える。だから、真に照らされた者、つまり、誰よりも暗い者は、数えきれぬ注釈者に恵まれた。その注釈の産婆術が、著者自身、おそらく身ごもったこともない意味を、取り上げてくれたのである。それでも著者は、その正当な親と認めてよい。この種の書き手の言葉は、種に似ている。いかにでたらめに撒かれようと、肥えた地に落ちれば、種を撒く者の希望も想像も、はるかに超えて増えるのだから。"
  "translation_status": "reviewed"
- "id": "tub-section-10-009"
  "section_id": "section-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And therefore, in order to promote so useful a work, I will here take leave to glance a few innuendos that may be of great assistance to those sublime spirits who shall be appointed to labour in a universal comment upon this wonderful discourse. And first, I have couched a very profound mystery in the number of 0’s multiplied by seven and divided by nine. Also, if a devout brother of the Rosy Cross will pray fervently for sixty-three mornings with a lively faith, and then transpose certain letters and syllables according to prescription, in the second and fifth section they will certainly reveal into a full receipt of the opus magnum. Lastly, whoever will be at the pains to calculate the whole number of each letter in this treatise, and sum up the difference exactly between the several numbers, assigning the true natural cause for every such difference, the discoveries in the product will plentifully reward his labour. But then he must beware of Bythus and Sigè, and be sure not to forget the qualities of Acamoth; a cujus lacrymis humecta prodit substantia, à risu lucida, à tristitiâ solida, et à timore mobilis, wherein Eugenius Philalethes [142] hath committed an unpardonable mistake."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 232
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[214]"
  "translation_ja": "そこで、これほど有用な仕事を促すため、この驚くべき論説に、普遍的な注釈を施すよう任命される、崇高な精神の持ち主たちへ、大いに役立つかもしれぬほのめかしを、ここで二、三、ちらりと示させていただこう。第一に、私は、零の数を七倍し、九で割ったところに、たいそう深遠な神秘を潜ませてある。また、敬虔な薔薇十字の兄弟が、生きた信仰をもって、六十三の朝、熱烈に祈り、それから処方どおり、一定の文字と音節を入れ替えるなら、第二節と第五節は、必ず、大いなる業の完全な処方を明かすだろう。最後に、この論考の各文字の総数を数え、それぞれの数の差を正確に合計し、その差の一つ一つに、真の自然な原因を割り当てる労を取る者は、結果の中の発見から、労苦をたっぷり報われるだろう。ただし、ビュトスとシゲには気をつけ、アカモートの性質を、決して忘れてはならない。その涙から湿った実体が、笑いから明るい実体が、悲しみから固い実体が、恐れから動く実体が生まれる、という性質である。この点で、エウゲニウス・フィラレテス[142]は、許しがたい誤りを犯した。"
  "translation_status": "reviewed"

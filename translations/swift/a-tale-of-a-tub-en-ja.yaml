- "id": "tub-somers-002"
  "section_id": "somers"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "My Lord,"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 15
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"

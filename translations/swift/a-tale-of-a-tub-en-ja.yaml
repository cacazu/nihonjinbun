    "xpath": "/html[1]/body[1]/p[158]"
  "translation_ja": "自分が書いているものの美点と卓越性について、できるかぎり光を当てるのは、私の義務と考えている。この洗練と学識の時代の第一級の著者たちの間で、それが最も喝采される流行であり、好みとなったからだ。意地悪な批評的読者を正したり、親切な読者の無知を教え導いたりする際に、用いられるのである。そのうえ、最近、詩でも散文でも、名高い作品がいくつか刊行されたが、著者たちが、大いなる人間愛と公共への思いやりから、含まれる崇高なもの、驚嘆すべきものを、細かく教えてくれなかったなら、われわれがそのどちらかの一粒でも見つけ出す見込みは、千に一つだったろう。私自身についていえば、この機会に述べたことは、序文に置くほうが適切で、ふつうはそうせよと指図する流行にも合っていることは、否定しない。しかし、ここでは、最後に書く著者という、大きく名誉ある特権をつかむことにする。最も新鮮な近代人として、私は絶対的な権威を、権利として主張する。この権威によって、私以前のあらゆる著者に対し、専制的な力を持つのだ。この資格に基づき、序文を本の献立表にするという有害な習慣を、私は全面的に退け、反対を宣言する。怪物を見せ物にする者や、珍しい光景を小売りする連中が、扉の上に、生き写しの大きく美しい絵を掲げ、下へたいへん雄弁な説明を添えるのは、ひどく思慮を欠くことだと、私はいつも考えてきた。そのおかげで、何度三ペンスを節約できたことか。好奇心はすっかり満たされ、呼び込みの雄弁家が、最後の感動的な決まり文句、「旦那、誓って申しますが、たった今、始まるところです」でしきりに誘っても、中へ入ろうとはしなかった。序文、献辞、広告、序論、緒言、準備篇、読者へ、の今の運命も、まさにこれと同じなのである。この工夫も、最初は見事だった。偉大なドライデンは、とうに可能なかぎり推し進め、信じがたいほどの成功を収めた。彼は、内々に何度も私へ語ったものだ。自分がこれほど偉大な詩人だとは、世間は決して思いもよらなかっただろう、序文で何度も請け合い、疑うことも忘れることもできぬようにしておかなかったならば、と。ひょっとすると、そうなのかもしれない。だが私は、その教えが、教えるべきでない所まで届き、本人には意図もなかった点で、人を賢くしてしまったのではないかと、大いに恐れる。今の時代の、欠伸をする読者たちが、四十頁、五十頁の序文と献辞――近代では普通の分量だが――を、まるでラテン語でもあるかのように、怠惰な軽蔑をもって、ぱらぱらめくるのを見るのは、嘆かわしい。もっとも、他方では、それ以外は何も読まず、批評家や才人になる者も、非常に多いと認めねばならない。現在の読者は皆、この二派へ分けてよいと思う。さて、私は前者に属すると公言する。だから、自作の美しさについて長々語り、論説の輝かしい部分を見せびらかしたいという、近代の欲求を持つ以上、それを本文の中で行うのが最善だと考えた。現に、今ここへ置いたことで、本の厚みはかなり増している。熟練の著者なら、決して軽んじてはならぬ事情である。"
  "translation_status": "reviewed"
- "id": "tub-section-05-011"
  "section_id": "section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Having thus paid my due deference and acknowledgment to an established custom of our newest authors, by a long digression unsought for and a universal censure unprovoked, by forcing into the light, with much pains and dexterity, my own excellences and other men’s defaults, with great justice to myself and candour to them, I now happily resume my subject, to the infinite satisfaction both of the reader and the author."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 169
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[159]"
  "translation_ja": "こうして、求められもしない長い脱線と、挑発されもしない全面的な非難により、最新の著者たちの定着した習慣へ、しかるべき敬意と謝意を払った。多くの労苦と器用さで、自分の優秀さと他人の欠陥を無理に照らし出し、自分には大いなる公正を、彼らには寛容を尽くしたので、今こそ喜んで本筋へ戻り、読者と著者、双方を限りなく満足させることにしよう。"
  "translation_status": "reviewed"

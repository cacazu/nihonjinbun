- "id": "tub-translator-goose-text"
  "section_id": "notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "goose は「鵞鳥」と、仕立屋の使う「アイロン」の両方を指す。また、「仕立屋の地獄」は、布の裁ち屑などを入れる場所の俗称である。仕立屋の仕事道具を、神や地獄として描いている。"
  "translation_status": "reviewed"
- "id": "tub-translator-brass-text"
  "section_id": "notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "brass には「真鍮」のほかに「厚顔さ」の意味がある。比較した英語本文の sine mercurio は「水銀なしで」。鏡の材質と、批評家の性質を重ねる言葉遊びである。"
  "translation_status": "reviewed"
- "id": "tub-translator-bulls-text"
  "section_id": "notes"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "bull は「雄牛」と「教皇の勅書」の両方を指す。ここでは、教皇の勅書を、吼え、火を噴き、金を求める雄牛として描いている。"
  "translation_status": "reviewed"

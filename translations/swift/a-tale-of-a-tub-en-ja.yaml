  "kind": "paragraph"
  "origin": "source"
  "source_text": "Next winter a player, hired for the purpose by the Corporation of Fringemakers, acted his part in a new comedy, all covered with silver fringe [78b], and according to the laudable custom gave rise to that fashion. Upon which the brothers, consulting their father’s will, to their great astonishment found these words: “Item, I charge and command my said three sons to wear no sort of silver fringe upon or about their said coats,” &c., with a penalty in case of disobedience too long here to insert. However, after some pause, the brother so often mentioned for his erudition, who was well skilled in criticisms, had found in a certain author, which he said should be nameless, that the same word which in the will is called fringe does also signify a broom-stick, and doubtless ought to have the same interpretation in this paragraph. This another of the brothers disliked, because of that epithet silver, which could not, he humbly conceived, in propriety of speech be reasonably applied to a broom-stick; but it was replied upon him that this epithet was understood in a mythological and allegorical sense. However, he objected again why their father should forbid them to wear a broom-stick on their coats, a caution that seemed unnatural and impertinent; upon which he was taken up short, as one that spoke irreverently of a mystery which doubtless was very useful and significant, but ought not to be over-curiously pried into or nicely reasoned upon. And in short, their father’s authority being now considerably sunk, this expedient was allowed to serve as a lawful dispensation for wearing their full proportion of silver fringe."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 112
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[109]"
  "translation_ja": "次の冬、房飾り職人組合に、そのために雇われた役者が、新しい喜劇に、全身を銀の房飾りで覆って登場し[78b]、例のほめるべき習慣どおり、それを流行させた。兄弟たちが父の遺言を調べると、たいそう驚いたことに、こんな言葉が見つかった。「一、前記三人の息子に命ずる。前記上着の上、またはその周りに、いかなる銀の房飾りもつけてはならない」、云々。背けば罰があったが、ここに記すには長すぎる。とはいえ、しばらく考えると、すでに何度も学識ゆえに登場した兄弟が、うまい手を見つけた。彼は文献の解釈に熟達しており、名は明かさないという、ある著者の中で、遺言に房飾りと書かれたのと同じ語は、箒の柄をも意味すると見つけ出した。間違いなく、この段落でも、そう解釈すべきだというのである。もう一人の兄弟は、これを気に入らなかった。「銀の」という形容がある以上、言葉の正しい使い方として、それを箒の柄へ当てはめるのは、筋が通らないのではないか、とつつましく考えたからだ。しかし、その形容は神話的、寓意的な意味で理解するのだ、と返された。それでも彼は、なぜ父が、上着に箒の柄をつけることなど禁じたのか、そんな注意は不自然で見当違いではないか、と再び異を唱えた。すると、ぴしゃりとたしなめられた。疑いなく有用で意味深い神秘について、不敬な口を利くものではない。あまり詮索したり、細かく理屈をつけたりすべきではないのだ、と。要するに、父の権威が今やかなり衰えていたので、この便法は、存分に銀の房飾りをつけるための、正当な特免として認められた。"
  "translation_status": "reviewed"
- "id": "tub-section-02-017"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "A while after was revived an old fashion, long antiquated, of embroidery with Indian figures of men, women, and children [79a]. Here they had no occasion to examine the will. They remembered but too well how their father had always abhorred this fashion; that he made several paragraphs on purpose, importing his utter detestation of it, and bestowing his everlasting curse to his sons whenever they should wear it. For all this, in a few days they appeared higher in the fashion than anybody else in the town. But they solved the matter by saying that these figures were not at all the same with those that were formerly worn and were meant in the will; besides, they did not wear them in that sense, as forbidden by their father, but as they were a commendable custom, and of great use to the public. That these rigorous clauses in the will did therefore require some allowance and a favourable interpretation, and ought to be understood cum grano salis."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 113
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[110]"
  "translation_ja": "しばらくすると、長くすたれていた古い流行、インド風の男、女、子供の姿を刺繍する流行が復活した[79a]。ここでは、遺言を調べる必要はなかった。父がいつもこの流行を嫌っていたことを、三人はよく覚えすぎるほど覚えていたからだ。父はわざわざ、全面的な嫌悪を示す段落をいくつも設け、息子たちがこれを身につけたら、いついかなるときでも、永遠の呪いを与えると記していた。それでも数日のうちに、三人は、都の誰よりも流行の先を行く姿で現れた。次のように言って、問題を解決したのである。この姿は、昔身につけられ、遺言で意図されたものとは、まるで同じではない。それに、自分たちは、父が禁じた意味で身につけているのではなく、立派な習慣で、公共の大いなる役に立つものとして、身につけている。だから遺言の厳しい条項には、多少の斟酌と好意的な解釈が必要であり、額面どおりでなく、ひとつまみの塩を添えて理解すべきなのだ、と。"
  "translation_status": "reviewed"
- "id": "tub-section-02-018"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But fashions perpetually altering in that age, the scholastic brother grew weary of searching further evasions and solving everlasting contradictions. Resolved, therefore, at all hazards to comply with the modes of the world, they concerted matters together, and agreed unanimously to lock up their father’s will in a strong-box, brought out of Greece or Italy [79b] (I have forgot which), and trouble themselves no farther to examine it, but only refer to its authority whenever they thought fit. In consequence whereof, a while after it grew a general mode to wear an infinite number of points, most of them tagged with silver; upon which the scholar pronounced ex cathedrâ [80a] that points were absolutely jure paterno as they might very well remember. It is true, indeed, the fashion prescribed somewhat more than were directly named in the will; however, that they, as heirs-general of their father, had power to make and add certain clauses for public emolument, though not deducible todidem verbis from the letter of the will, or else multa absurda sequerentur. This was understood for canonical, and therefore on the following Sunday they came to church all covered with points."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 114
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[111]"
  "translation_ja": "しかし当時は、流行が絶えず変わったので、スコラ学者の兄弟は、さらに抜け道を探し、果てしない矛盾を解くことに、うんざりしてしまった。そこで三人は、何があっても世間の流行に従おうと決め、相談し、全員一致で、父の遺言を金庫にしまうことにした。金庫はギリシアかイタリアか、どちらかから運ばれてきたものだったが、どちらだったかは忘れた[79b]。もうわざわざ中身を調べず、都合のよいときにだけ、その権威を持ち出すことにしたのである。その結果、しばらく後、ほとんどに銀の先金のついた留め紐を、途方もない数つけるのが、一般の流行となったとき、学者は権威ある席から宣言した[80a]。留め紐は、皆もよく覚えているとおり、絶対に父の法にかなう、と。たしかに、流行が要求する数は、遺言に直接挙げられた数より、いくらか多かった。しかし、自分たちは父の包括相続人として、公共の利益のために、いくつかの条項を設け、付け加える権限がある。それが遺言の文言から一語一句そのまま導けなくても、かまわない。さもなければ、多くの不合理が生じるだろう、と。これは正典にかなうと理解されたので、次の日曜日、三人は全身に留め紐をつけて、教会へ現れた。"
  "translation_status": "reviewed"
- "id": "tub-section-02-019"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The learned brother so often mentioned was reckoned the best scholar in all that or the next street to it; insomuch, as having run something behindhand with the world, he obtained the favour from a certain lord [80b] to receive him into his house and to teach his children. A while after the lord died, and he, by long practice upon his father’s will, found the way of contriving a deed of conveyance of that house to himself and his heirs; upon which he took possession, turned the young squires out, and received his brothers in their stead."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 115
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[112]"
  "translation_ja": "これまで何度も登場した物知りの兄弟は、その通りでも、隣の通りを合わせても、いちばんの学者とみなされていた。それで、懐がいくらか苦しくなっていたとき、ある貴族の好意を受け[80b]、屋敷に迎えられて、子供たちを教えることになった。しばらくすると、その貴族が死んだ。彼は、父の遺言を相手に長く積んだ腕前のおかげで、その屋敷を自分と相続人へ譲る証書を、うまく作る方法を見つけた。そうして屋敷を占有し、若い跡取りたちを追い出して、代わりに兄弟を迎え入れたのである。"

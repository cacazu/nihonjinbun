- "id": "tub-section-02-002"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Once upon a time there was a man who had three sons by one wife [70] and all at a birth, neither could the midwife tell certainly which was the eldest. Their father died while they were young, and upon his death-bed, calling the lads to him, spoke thus:—"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 98
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[95]"
  "translation_ja": "昔々、一人の男がいた。同じ妻との間に三人の息子があり[70]、三人とも一度に生まれたので、産婆にも誰が一番上かは、はっきりわからなかった。父親は、息子たちがまだ若いうちに死んだ。臨終の床で彼らを呼び寄せ、こう語った。"
  "translation_status": "reviewed"
- "id": "tub-section-02-003"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "“Sons, because I have purchased no estate, nor was born to any, I have long considered of some good legacies to bequeath you, and at last, with much care as well as expense, have provided each of you (here they are) a new coat. Now, you are to understand that these coats have two virtues contained in them; one is, that with good wearing they will last you fresh and sound as long as you live; the other is, that they will grow in the same proportion with your bodies, lengthening and widening of themselves, so as to be always fit. Here, let me see them on you before I die. So, very well! Pray, children, wear them clean and brush them often. You will find in my will (here it is) full instructions in every particular concerning the wearing and management of your coats, wherein you must be very exact to avoid the penalties I have appointed for every transgression or neglect, upon which your future fortunes will entirely depend. I have also commanded in my will that you should live together in one house like brethren and friends, for then you will be sure to thrive and not otherwise.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 99
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[96]"
  "translation_ja": "「息子たちよ。私は土地を買いもせず、生まれつき受け継いだ土地もない。そこで、お前たちに何かよい遺産を残せないかと、長く考えてきた。ようやく、手間も金もずいぶんかけて、一人一人に新しい上着を用意した。ほら、ここにある。よいか、この上着には二つの優れた働きがある。一つは、大事に着れば、お前たちが生きているかぎり、いつまでも新しく、傷まずにもつこと。もう一つは、お前たちの体と同じ割合で育ち、ひとりでに長くも広くもなって、いつでもぴったり合うことだ。さあ、死ぬ前に、着た姿を見せておくれ。うん、たいへんよい！　どうか息子たちよ、汚さずに着て、こまめにブラシをかけるように。この遺言書を見れば――ほら、これだ――上着の着方と手入れについて、細かな点まですべて指示してある。一つでも違反したり怠ったりすれば、それぞれ定めた罰があるから、実に几帳面に守らねばならない。お前たちの行く末は、すべてそれにかかっている。遺言書には、兄弟として、友人として、一つの家で仲よく暮らすことも命じておいた。そうすれば必ず栄えるが、そうしなければ、栄えることはない。」"
  "translation_status": "reviewed"
- "id": "tub-section-02-004"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Here the story says this good father died, and the three sons went all together to seek their fortunes."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 100
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[97]"
  "translation_ja": "物語によれば、ここでこの善良な父親は死に、三人の息子は、そろって幸運を求める旅に出た。"
  "translation_status": "reviewed"
- "id": "tub-section-02-005"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I shall not trouble you with recounting what adventures they met for the first seven years, any farther than by taking notice that they carefully observed their father’s will and kept their coats in very good order; that they travelled through several countries, encountered a reasonable quantity of giants, and slew certain dragons."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 101
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[98]"
  "translation_ja": "初めの七年間にどんな冒険をしたか、詳しく語って煩わせるつもりはない。父の遺言を注意深く守り、上着をたいへんよい状態に保ったこと、いくつかの国を旅して、ほどほどの数の巨人と出会い、いくつかの竜を退治したことだけ、述べておけばよかろう。"
  "translation_status": "reviewed"
- "id": "tub-section-02-006"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Being now arrived at the proper age for producing themselves, they came up to town and fell in love with the ladies, but especially three, who about that time were in chief reputation, the Duchess d’Argent, Madame de Grands-Titres, and the Countess d’Orgueil [71]. On their first appearance, our three adventurers met with a very bad reception, and soon with great sagacity guessing out the reason, they quickly began to improve in the good qualities of the town. They wrote, and rallied, and rhymed, and sung, and said, and said nothing; they drank, and fought, and slept, and swore, and took snuff; they went to new plays on the first night, haunted the chocolate-houses, beat the watch; they bilked hackney-coachmen, ran in debt with shopkeepers, and lay with their wives; they killed bailiffs, kicked fiddlers down-stairs, ate at Locket’s, loitered at Will’s; they talked of the drawing-room and never came there; dined with lords they never saw; whispered a duchess and spoke never a word; exposed the scrawls of their laundress for billet-doux of quality; came ever just from court and were never seen in it; attended the levee sub dio; got a list of peers by heart in one company, and with great familiarity retailed them in another. Above all, they constantly attended those committees of Senators who are silent in the House and loud in the coffee-house, where they nightly adjourn to chew the cud of politics, and are encompassed with a ring of disciples who lie in wait to catch up their droppings. The three brothers had acquired forty other qualifications of the like stamp too tedious to recount, and by consequence were justly reckoned the most accomplished persons in town. But all would not suffice, and the ladies aforesaid continued still inflexible. To clear up which difficulty, I must, with the reader’s good leave and patience, have recourse to some points of weight which the authors of that age have not sufficiently illustrated."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 102
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[99]"
  "translation_ja": "さて、世に出るのにふさわしい年齢になったので、三人は都へ上り、御婦人方に恋をした。とりわけ、当時いちばん評判の三人、ダルジャン公爵夫人、グラン・ティートル夫人、ドルグイユ伯爵夫人に、である[71]。都に初めて姿を現したとき、わが三人の冒険者は、ひどく冷たく迎えられた。だが、抜け目なくその理由を察し、たちまち都会の美点を身につけ始めた。文章を書き、皮肉を飛ばし、韻を踏み、歌い、しゃべり、何も言わず、酒を飲み、喧嘩をし、眠り、悪態をつき、嗅ぎ煙草を吸った。新作芝居の初日に出かけ、チョコレート店に入り浸り、夜警を殴った。辻馬車の御者を踏み倒し、商人の店で借金を重ね、その女房と寝た。執行吏を殺し、ヴァイオリン弾きを階段から蹴落とし、ロケッツで食事をし、ウィルズでぶらぶらした。行ったこともない宮廷の謁見の間を語り、会ったこともない貴族と食事をしたことにした。ひと言も口を利かずに、公爵夫人と内緒話をしたことになり、洗濯女の走り書きを、身分ある女性からの恋文として見せびらかした。いつでも宮廷から来たばかりと言うが、宮廷で姿を見た者はいなかった。朝の謁見には、空の下で参列した。ある集まりで貴族名簿を暗記し、別の集まりでは、皆と親しい口ぶりで、その名を並べ立てた。何よりも熱心に通ったのは、議場では黙り込み、コーヒー店では大声を上げる議員たちの委員会だった。毎晩そこへ場所を移しては政治を反芻し、こぼれ落ちる言葉を拾おうと待ち構える弟子たちに、ぐるりと囲まれているのである。三兄弟は、これと同じ手合いの素養を、さらに四十ばかり身につけた。すべて挙げては退屈になるので省くが、その結果、当然ながら、都で最も完成された人物たちとみなされた。だが、それでも足りなかった。先に挙げた御婦人方は、いっこうに折れなかったのである。この難問を解くため、読者のお許しと御辛抱を得て、当時の著者たちが十分に明らかにしていない、いくつかの重要な問題へ立ち入らなければならない。"
  "translation_status": "reviewed"
- "id": "tub-section-02-007"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "For about this time it happened a sect arose whose tenets obtained and spread very far, especially in the grand monde, and among everybody of good fashion. They worshipped a sort of idol [72a], who, as their doctrine delivered, did daily create men by a kind of manufactory operation. This idol they placed in the highest parts of the house on an altar erected about three feet. He was shown in the posture of a Persian emperor sitting on a superficies with his legs interwoven under him. This god had a goose for his ensign, whence it is that some learned men pretend to deduce his original from Jupiter Capitolinus. At his left hand, beneath the altar, Hell seemed to open and catch at the animals the idol was creating, to prevent which, certain of his priests hourly flung in pieces of the uninformed mass or substance, and sometimes whole limbs already enlivened, which that horrid gulph insatiably swallowed, terrible to behold. The goose was also held a subaltern divinity or Deus minorum gentium, before whose shrine was sacrificed that creature whose hourly food is human gore, and who is in so great renown abroad for being the delight and favourite of the Egyptian Cercopithecus [72b]. Millions of these animals were cruelly slaughtered every day to appease the hunger of that consuming deity. The chief idol was also worshipped as the inventor of the yard and the needle, whether as the god of seamen, or on account of certain other mystical attributes, hath not been sufficiently cleared."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 103
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[100]"
  "translation_ja": "ちょうどこの頃、一つの宗派が現れ、その教説は広く受け入れられ、とりわけ上流社会と、流行に通じた人々すべての間へ広まっていた。彼らはある種の偶像を拝んでいた[72a]。その教義によると、偶像は工場仕事のような操作によって、日々、人間を作り出していた。家のいちばん高い場所に、高さ三フィートほどの祭壇を設け、その上にこの偶像を置いていた。姿はペルシア皇帝のように、平らな面の上へ脚を組んで座っていた。この神の標章は鵞鳥だったので、一部の学者は、その起源をカピトリウムのユピテルに求めようとしている。祭壇の下、神の左手には地獄が口を開け、偶像が作る動物たちを捕らえようとしているように見えた。これを防ぐため、神官の一部は、まだ形のない塊や素材の切れ端を、ときにはすでに命を与えられた手足を丸ごと、絶えずそこへ投げ込んだ。恐ろしい穴が、飽くことなく飲み込むさまは、見るもおぞましかった。鵞鳥もまた、下位の神、小神の一柱とみなされ、その祠の前では、いつも人の血を餌とし、エジプトの尾長猿[72b]に気に入られ、可愛がられることで、海外に大いに名を知られた生き物が、生贄に捧げられた。その焼き尽くす神の飢えをなだめるため、毎日何百万という、これらの動物が無残にも殺された。主たる偶像は、ヤード尺と針の発明者としても拝まれたが、それが船乗りの神としてなのか、あるいは別の神秘的な属性によるのかは、十分に解明されていない。"
  "translation_status": "reviewed"
- "id": "tub-section-02-008"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The worshippers of this deity had also a system of their belief which seemed to turn upon the following fundamental. They held the universe to be a large suit of clothes which invests everything; that the earth is invested by the air; the air is invested by the stars; and the stars are invested by the Primum Mobile. Look on this globe of earth, you will find it to be a very complete and fashionable dress. What is that which some call land but a fine coat faced with green, or the sea but a waistcoat of water-tabby? Proceed to the particular works of the creation, you will find how curious journeyman Nature hath been to trim up the vegetable beaux; observe how sparkish a periwig adorns the head of a beech, and what a fine doublet of white satin is worn by the birch. To conclude from all, what is man himself but a microcoat, or rather a complete suit of clothes with all its trimmings? As to his body there can be no dispute, but examine even the acquirements of his mind, you will find them all contribute in their order towards furnishing out an exact dress. To instance no more, is not religion a cloak, honesty a pair of shoes worn out in the dirt, self-love a surtout, vanity a shirt, and conscience a pair of breeches, which, though a cover for lewdness as well as nastiness, is easily slipped down for the service of both."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 104
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[101]"
  "translation_ja": "この神の信者たちはまた、次の根本原理を中心とするらしい、信仰の体系を持っていた。宇宙とは、あらゆるものを包む、大きな一そろいの衣服である。大地は空気をまとい、空気は星々をまとい、星々は第一動天をまとっている、と彼らは説いた。この地球を見れば、実に仕立てのよい、流行にかなう衣装だとわかるだろう。人々が陸地と呼ぶものは、緑の見返しをつけた立派な上着にすぎず、海は水の波紋織の胴着ではないか。創造物を一つ一つ見れば、自然という職人が、植物界の伊達男を、どれほど念入りに着飾らせているかがわかる。ブナの頭を飾る鬘の気取りようを見よ。シラカバが着込む、白い繻子の胴着の見事さを見よ。以上から結論すれば、人間自身とは、小宇宙ならぬ小上着、いや、あらゆる飾りをつけた、ひとそろいの衣服にほかならないではないか。体については、議論の余地もない。精神が獲得したものまで調べてみても、すべてが順に、申し分のない装いを整えるために役立っているとわかる。例を少し挙げれば、宗教は外套、正直は泥の中で履きつぶした一足の靴、自己愛は上っ張り、虚栄はシャツ、良心は半ズボンではないか。この半ズボンは、淫らなものや汚いものを覆い隠しながら、その両方に用を足すとなると、あっさりずり下ろされるのである。"
  "translation_status": "reviewed"
- "id": "tub-section-02-009"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These postulata being admitted, it will follow in due course of reasoning that those beings which the world calls improperly suits of clothes are in reality the most refined species of animals, or to proceed higher, that they are rational creatures or men. For is it not manifest that they live, and move, and talk, and perform all other offices of human life? Are not beauty, and wit, and mien, and breeding their inseparable proprieties? In short, we see nothing but them, hear nothing but them. Is it not they who walk the streets, fill up Parliament-, coffee-, play-, bawdy-houses. It is true, indeed, that these animals, which are vulgarly called suits of clothes or dresses, do according to certain compositions receive different appellations. If one of them be trimmed up with a gold chain, and a red gown, and a white rod, and a great horse, it is called a Lord Mayor; if certain ermines and furs be placed in a certain position, we style them a judge, and so an apt conjunction of lawn and black satin we entitle a Bishop."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 105
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[102]"
  "translation_ja": "この要請を認めるなら、正しい推論の筋道に従って、次の結論が出る。世間が誤って一そろいの衣服と呼んでいる存在は、実は最も洗練された動物の一種であり、さらに高くいえば、理性的な生き物、すなわち人間なのだ。生き、動き、話し、人間生活のほかのあらゆる営みを行っていることは、明らかではないか。美しさ、機知、物腰、育ちのよさは、それに切り離せぬ属性ではないか。要するに、われわれはそれしか見ず、それしか聞かない。街を歩き、議事堂、コーヒー店、芝居小屋、売春宿をいっぱいにしているのは、それではないか。なるほど、俗に一そろいの衣服、または衣装と呼ばれるこれらの動物は、組み合わせに応じて、異なる名を与えられる。金の鎖と赤い法衣と白い杖と大きな馬で飾れば、それは市長閣下と呼ばれる。ある種の白貂や毛皮を一定の位置に配せば、裁判官と呼ばれる。同じように、薄麻布と黒繻子を適切に組み合わせたものには、主教という称号を授ける。"
  "translation_status": "reviewed"
- "id": "tub-section-02-010"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Others of these professors, though agreeing in the main system, were yet more refined upon certain branches of it; and held that man was an animal compounded of two dresses, the natural and the celestial suit, which were the body and the soul; that the soul was the outward, and the body the inward clothing; that the latter was ex traduce, but the former of daily creation and circumfusion. This last they proved by Scripture, because in them we live, and move, and have our being: as likewise by philosophy, because they are all in all, and all in every part. Besides, said they, separate these two, and you will find the body to be only a senseless unsavoury carcass. By all which it is manifest that the outward dress must needs be the soul."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 106
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[103]"
  "translation_ja": "この教えを奉じる者の中には、大筋では同じ体系に賛成しながら、その枝葉ではさらに洗練された考えを持つ者もいた。人間は二つの衣装、自然の衣と天上の衣、つまり肉体と魂を組み合わせた動物であり、魂は外の衣服、肉体は内の衣服であるとした。後者は親から伝わるが、前者は日々新たに作られ、外へかぶせられる。この最後の説を、彼らは聖書から証明した。「その中で、われわれは生き、動き、存在している」からである。また哲学からも、「それは全体の中に全体としてあり、各部分の中にも全体としてある」ことを挙げて証明した。しかも、この二つを引き離せば、肉体はただの感覚のない、臭い死骸にすぎなくなるではないか、と彼らは言った。以上から、外の衣装こそ魂であることは、明らかなのだ。"
  "translation_status": "reviewed"
- "id": "tub-section-02-011"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "To this system of religion were tagged several subaltern doctrines, which were entertained with great vogue; as particularly the faculties of the mind were deduced by the learned among them in this manner: embroidery was sheer wit, gold fringe was agreeable conversation, gold lace was repartee, a huge long periwig was humour, and a coat full of powder was very good raillery. All which required abundance of finesse and delicatesse to manage with advantage, as well as a strict observance after times and fashions."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 107
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[104]"
  "translation_ja": "この宗教体系には、いくつもの下位の教義が飾りのように付けられ、大流行をもって受け入れられていた。とりわけ精神の諸能力について、その中の学者たちは、次のように説明した。刺繍は純粋な機知、金の房飾りは愉快な会話、金モールは即妙な切り返し、途方もなく長い鬘はユーモア、粉だらけの上着は、たいそう巧みなからかいである。どれも、うまく使うには十分な技巧と繊細さが要り、時代や流行を厳密に守ることも必要だった。"
  "translation_status": "reviewed"
- "id": "tub-section-02-012"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I have with much pains and reading collected out of ancient authors this short summary of a body of philosophy and divinity which seems to have been composed by a vein and race of thinking very different from any other systems, either ancient or modern. And it was not merely to entertain or satisfy the reader’s curiosity, but rather to give him light into several circumstances of the following story, that, knowing the state of dispositions and opinions in an age so remote, he may better comprehend those great events which were the issue of them. I advise, therefore, the courteous reader to peruse with a world of application, again and again, whatever I have written upon this matter. And so leaving these broken ends, I carefully gather up the chief thread of my story, and proceed."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 108
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[105]"
  "translation_ja": "私は多くの苦労と読書を重ね、古い著者たちから、この哲学・神学の体系の短い摘要を集めた。この体系は、古代のものにも近代のものにも似ない、まるで別の筋道と種類の思考によって、組み立てられたらしい。これを記したのは、単に読者を楽しませ、好奇心を満たすためではない。むしろ、これからの物語のさまざまな事情を、明らかにするためである。それほど遠い時代の気風や意見を知れば、そこから生じた大事件も、いっそうよく理解できるだろう。だから、親切な読者には、この問題について私が書いたところを、何度でも、ひたすら熱心に読み返すことを勧める。さて、脇へほつれた糸はここに置き、物語の主な糸を注意深く拾い上げて、先へ進もう。"
  "translation_status": "reviewed"
- "id": "tub-section-02-013"
  "section_id": "section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These opinions, therefore, were so universal, as well as the practices of them, among the refined part of court and town, that our three brother adventurers, as their circumstances then stood, were strangely at a loss. For, on the one side, the three ladies they addressed themselves to (whom we have named already) were ever at the very top of the fashion, and abhorred all that were below it but the breadth of a hair. On the other side, their father’s will was very precise, and it was the main precept in it, with the greatest penalties annexed, not to add to or diminish from their coats one thread without a positive command in the will. Now the coats their father had left them were, it is true, of very good cloth, and besides, so neatly sewn you would swear they were all of a piece, but, at the same time, very plain, with little or no ornament; and it happened that before they were a month in town great shoulder-knots came up. Straight all the world was shoulder-knots; no approaching the ladies’ ruelles without the quota of shoulder-knots. “That fellow,” cries one, “has no soul: where is his shoulder-knot?” [75] Our three brethren soon discovered their want by sad experience, meeting in their walks with forty mortifications and indignities. If they went to the playhouse, the doorkeeper showed them into the twelve-penny gallery. If they called a boat, says a waterman, “I am first sculler.” If they stepped into the “Rose” to take a bottle, the drawer would cry, “Friend, we sell no ale.” If they went to visit a lady, a footman met them at the door with “Pray, send up your message.” In this unhappy case they went immediately to consult their father’s will, read it over and over, but not a word of the shoulder-knot. What should they do? What temper should they find? Obedience was absolutely necessary, and yet shoulder-knots appeared extremely requisite. After much thought, one of the brothers, who happened to be more book-learned than the other two, said he had found an expedient. “It is true,” said he, “there is nothing here in this will, totidem verbis, making mention of shoulder-knots, but I dare conjecture we may find them inclusive, or totidem syllabis.” This distinction was immediately approved by all; and so they fell again to examine the will. But their evil star had so directed the matter that the first syllable was not to be found in the whole writing; upon which disappointment, he who found the former evasion took heart, and said, “Brothers, there is yet hopes; for though we cannot find them totidem verbis nor totidem syllabis, I dare engage we shall make them out tertio modo or totidem literis.” This discovery was also highly commended, upon which they fell once more to the scrutiny, and soon picked out S, H, O, U, L, D, E, R, when the same planet, enemy to their repose, had wonderfully contrived that a K was not to be found. Here was a weighty difficulty! But the distinguishing brother (for whom we shall hereafter find a name), now his hand was in, proved by a very good argument that K was a modern illegitimate letter, unknown to the learned ages, nor anywhere to be found in ancient manuscripts. “It is true,” said he, “the word Calendæ, had in Q. V. C. [76] been sometimes writ with a K, but erroneously, for in the best copies it is ever spelt with a C; and by consequence it was a gross mistake in our language to spell ‘knot’ with a K,” but that from henceforward he would take care it should be writ with a C. Upon this all further difficulty vanished; shoulder-knots were made clearly out to be jure paterno, and our three gentlemen swaggered with as large and as flaunting ones as the best."

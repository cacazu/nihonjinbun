  "section_id": "notes"
  "kind": "note_body"
  "origin": "source"
  "source_text": "[70] Peter, the Church of Rome; Martin, the Reformed Church as established by authority in England; Jack, the dissenters from the English Church Establishment. Martin, named probably from Martin Luther; Jack, from John Calvin. The coats are the coats of righteousness, in which all servants of God should be clothed; alike in love and duty, however they may differ in opinion."

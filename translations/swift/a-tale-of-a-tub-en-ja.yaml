- "id": "tub-note-152a"
  "section_id": "notes"
  "kind": "note_body"
  "origin": "source"
  "source_text": "[152a] Charles II., by the Act of Uniformity, which drove two thousand ministers of religion, including some of the most devout, in one day out of the Church of England."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 350
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "anchor": "footnote152a"
  "translation_ja": "[152a] チャールズ二世。統一法によって、最も敬虔な者の一部を含む、二千人の聖職者を、一日でイングランド国教会から追い出した。"
  "translation_status": "reviewed"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "署名・引用元は注本文に保持。注全体の著者・編者の帰属は未確定。"
- "id": "tub-note-152b"
  "section_id": "notes"
  "kind": "note_body"
  "origin": "source"
  "source_text": "[152b] “Including Scaliger’s,” is Swift’s note in the margin. The sixth sense was the “common sense” which united and conveyed to the mind as one whole the information brought in by the other five. Common sense did not originally mean the kind of sense common among the people generally. A person wanting in common sense was one whose brain did not properly combine impressions brought into it by the eye, the ear, &c."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 351
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "anchor": "footnote152b"
  "translation_ja": "[152b] 「スカリゲルのものを含む」が、スウィフトの欄外注である。第六感は、ほかの五つの感覚が運ぶ情報を結びつけ、一つの全体として心へ伝える「共通感覚」だった。common senseは、もともと、一般の人々に共通する判断力を意味しなかった。共通感覚を欠く人とは、目や耳などから入る印象を、脳が適切に結びつけられない人のことだった。"
  "translation_status": "reviewed"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "署名・引用元は注本文に保持。注全体の著者・編者の帰属は未確定。"
- "id": "tub-note-153"
  "section_id": "notes"
  "kind": "note_body"
  "origin": "source"
  "source_text": "[153] Reference here is to the exercise by James II. of a dispensing power which illegally protected Roman Catholics, and incidentally Dissenters also; to the consequent growth of feeling against the Roman Catholics. “Jack on a great horse and eating custard” represents what was termed the occasional conformity of men who “blasphemed custard through the nose,” but complied with the law that required them to take Sacrament in the Church of England as qualification for becoming a Lord Mayor or holding any office of public authority."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 352
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "anchor": "footnote153"
  "translation_ja": "[153] ここで指すのは、ジェームズ二世が、法に反してローマ・カトリックを、付随して非国教徒をも保護した、法律適用免除権の行使と、その結果強まった、ローマ・カトリックへの反感である。「大きな馬へ乗り、カスタードを食べるジャック」は、「鼻声でカスタードを冒涜し」ながら、市長や公職へ就く資格として、イングランド国教会で聖餐を受けることを求める法律には従った人々の、いわゆる一時的国教服従を表す。"
  "translation_status": "reviewed"
  "attributions":
  - "voice": "unknown"
    "evidence_ja": "署名・引用元は注本文に保持。注全体の著者・編者の帰属は未確定。"

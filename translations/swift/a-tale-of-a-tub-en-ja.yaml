    "xpath": "/html[1]/body[1]/p[108]"
  "translation_ja": "しばらくして、裏地用に、炎の色をした美しい繻子が大流行した[77b]。絹物商は、さっそく三人の紳士へ見本を持ってきた。「旦那様方」と言った。「昨夜、C卿もJ・W卿も、まさにこの反物から裏地をお取りになりました。たいへんな売れ行きで、明日の朝十時には、うちの女房の針刺しを作るほどの端切れも残らないでしょう。」そこで三人は、また遺言を引っかき回した。正統の著者によれば、裏地は上着の本質に属するので、今度の件にも、明文の指示が必要だったからである。長く探したが、当面の件に当てはまりそうなものは、父の短い忠告以外、何も見つからなかった。火に気をつけ、寝る前には蝋燭を消せ、というものだ[78a]。これはかなり役に立ち、自分たちを納得させるには大いに助けになったが、命令を打ち立てるには、どうも力が足りない。これ以上の良心の迷いも、将来の非難の種も避けようと決めたので、学者役の兄弟が言った。「遺言には追補が添えられると、読んだ覚えがある。これは実際、遺言の一部で、書かれていることも、ほかの部分と同じ権威を持つ。今、目の前の遺言を考えるに、そうした追補がない以上、完全なものとは思えない。だから私が、あるべき場所へ、たいそう巧みに付け足そう。前から一つ、手もとに持っていたのだ。祖父の犬の世話係が書いたもので、幸いにも、まさにこの炎色の繻子のことを、たくさん論じている。」残る二人もすぐに賛成した。古い羊皮紙の巻物が、付属追補という形で、作法に従ってつぎ合わされ、繻子は買い求められ、身につけられた。"
  "translation_status": "reviewed"
- "id": "tub-section-02-016"

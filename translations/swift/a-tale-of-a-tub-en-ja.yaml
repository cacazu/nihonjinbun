    "xpath": "/html[1]/body[1]/p[147]"
  "translation_ja": "これほど多くの立派な発見が、世間で大成功を収めたと、読者に納得してもらうのは、難しくあるまい。ただし、語ったのは、ほんのごく一部だと、確かに申し上げておこう。私の目的は、公共がまねるのに最も役立つもの、あるいは発明者の眼力と才知のほどを、最もよくうかがわせるものだけを、選び出すことだった。それゆえ、この頃までにピーター卿が大金持ちになっていたとしても、驚く必要はない。しかし、ああ！　あまりに長く激しく、頭脳を拷問台にかけていたので、とうとう脳味噌が揺らぎ、少し楽になろうと、ぐるぐる回り始めた。要するに、高慢、計画、悪だくみが重なり、哀れなピーターは気が狂い、世にも奇妙なことを思い描くようになった。発作の最高潮には、高慢のために狂う者の常として、自分を全能の神、ときには宇宙の君主と呼んだ。「私は見た」と、私の典拠の著者は言う。「彼は、古い山高帽を三つ取り、頭の上へ三階建てに重ね、大きな鍵の束を腰帯につけ、釣り竿を手にしていた。」この姿でいるとき、挨拶に握手をしようと近づく者がいれば、ピーターは、よくしつけられたスパニエル犬のように、優雅に足を差し出した。この厚意を断られると、相手の顎まで足を上げ、口へひどい蹴りをくれた。それ以来、それは挨拶と呼ばれている。挨拶せず通り過ぎる者には、驚くほど強い息で、その帽子を吹き飛ばし、泥の中へ落とした。一方、家の中のことは何もかも、めちゃくちゃになり、二人の兄弟は惨めな日を送った。まず最初の気まぐれで、ある朝、二人の妻を戸外へ蹴り出し、自分の妻まで追い出して、代わりに、街で最初に見かけた放浪女を三人拾ってこいと命じた。しばらくして、酒蔵の戸に釘を打ち、兄弟たちには、食事の飲み物を一滴も許さなくなった[95]。ある日、シティの市参事会員の家で食事をしたとき、ピーターは、その男が仲間の常として、牛のサーロインの賛美を、長々と述べるのを聞いた。「牛肉こそ、肉の王です」と、賢明な役人は言った。「牛肉の中には、山鶉、鶉、鹿肉、雉、プラム・プディング、カスタードの精髄が含まれています。」家へ戻ったピーターは、この教説を料理して、実用に供することを思いついた。サーロインがないので、褐色のパンに教えを当てはめようとしたのだ。「親愛なる兄弟たち」と彼は言った。「パンは生命の杖だ。そのパンには、牛肉、羊肉、仔牛肉、鹿肉、山鶉、プラム・プディング、カスタードの精髄が、すべて含まれている。そして、完全なものにするため、適量の水も混ぜてある。その生っぽさも、酵母や酒母で正され、健康によい発酵した飲み物となり、パンの塊の全体へ行き渡っているのだ。」この結論を根拠に、翌日の夕食には、褐色のパンが、市の大宴会さながらの儀式で供された。「さあ兄弟たち」とピーターは言った。「遠慮なく食べてくれ。すばらしい羊肉だぞ[96]。いや、待て、せっかく手が出ているから、私が取ってやろう。」そう言って、フォークとナイフを使い、もったいぶって、パンから厚い二切れを切り取り、それぞれ皿に載せて、兄弟たちへ差し出した。二人のうち年上のほうは、すぐにはピーター卿の思いつきについてゆけず、きわめて丁寧な言葉で、その神秘を尋ね始めた。「閣下」と言った。「恐れながら、何かお間違いがあるのではないでしょうか。」「何だって」とピーターは言った。「冗談を言うのか。では、聞かせてみたまえ。その頭に、いっぱい詰まっている冗談を。」「とんでもありません、閣下。ただ、私がよほど思い違いをしていなければ、先ほど閣下は、羊肉とおっしゃいました。ぜひとも、それを拝見したいのです。」「何だと」とピーターは、ひどく驚いた顔をして言った。「まったく意味がわからない。」そこで、年下のほうが、話を正そうと口を挟んだ。「閣下、兄は腹が減り、夕食に出すとお約束の羊肉を、食べたがっているのだと思います。」「ちょっと待て」とピーターは言った。「わかるように話してくれ。お前たちは二人とも狂っているか、私の好む以上に、ふざけるつもりなのか。その切り身が気に入らなければ、別のを切ってやろう。肩肉全体の中でも、一番よい部分だと思ったのだがね。」「では、閣下」と、最初の者が答えた。「これは初めからずっと、羊の肩肉だったというわけですか。」「いいから、君」とピーターは言った。「食べ物を食べて、無礼な口をやめてくれたまえ。今は、それを面白がる気分ではない。」だが相手は、ピーターの取り澄ました大真面目な顔に、あまりに苛立ち、黙っていられなかった。「閣下、私に言えるのは、目にも指にも、歯にも鼻にも、これはパンの皮にしか思えない、ということだけです。」そこで、もう一人も口を入れた。「十二ペンスのパンの一切れに、これほどよく似た羊肉は、生まれて初めて見ました。」「いいか、諸君」とピーターは怒鳴った。「お前たちが、いかに盲目で、思い込みが強く、無知で、頑固な仔犬どもかを思い知らせるため、たった一つ、明白な議論を使おう。神にかけて、これはレドンホール市場のどれにも劣らぬ、本物の、立派な、正真正銘の羊肉だ。これと違うことを信じようとするなら、神がお前たち二人を、永遠に滅ぼしたもうように。」これほど雷鳴のような証明では、反論の余地は残らなかった。二人の不信者は、できるだけ急いで、自分たちの間違いを拾い集め、懐へしまい始めた。「なるほど、確かに」と最初の者は言った。「もっとよくよく考えてみますと――」「ええ」と、もう一人が遮った。「今、よく考え直してみましたが、閣下のおっしゃることは、大いに道理があるようです。」「よろしい」とピーターは言った。「おい、給仕、ビールのグラスにクラレットを満たしてくれ。二人のために、心から乾杯しよう。」兄弟たちは、こんなに早く機嫌が直ったのを見て、たいそう喜び、つつましく礼を述べ、自分たちも閣下に杯を捧げたいと言った。「そうさせてやろう」とピーターは言った。「私は、もっともな願いを断る男ではない。葡萄酒も、ほどほどに飲めば強壮剤だ。ほら、一杯ずつ。本物の葡萄の汁だぞ。あの忌まわしい酒屋の混ぜ物とは違う。」こう言って、彼はそれぞれに、また大きな乾いたパンの皮を渡し、飲み干せ、遠慮するな、害にはならん、と命じた。二人の兄弟は、こうした微妙な局面での決まりの務めとして、十分な間、ピーター卿と互いの顔を見つめた。そして、事態がどう進むかを悟り、新しい議論は始めず、好きなように勝ちを譲ることにした。今や彼は狂気の発作の一つに入り込んでおり、さらに論じたり抗議したりしても、百倍手に負えなくなるだけだったからである。"

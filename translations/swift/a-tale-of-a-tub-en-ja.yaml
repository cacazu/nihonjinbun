    "xpath": "/html[1]/body[1]/p[144]"
  "translation_ja": "ピーター卿の計画を、もう一つ挙げずにはいられない。実に並外れていて、遠くまで見通す眼力と、深遠な創意の持ち主だと示すものだった。ニューゲート監獄の悪党が絞首刑を言い渡されるたびに、ピーターは、一定の金額で赦免を与えると申し出た。哀れなならず者が、あらゆる工面をして金をかき集め、送ってくると、卿は、次の形式の紙を送り返した。"

    第6節
    樽物語
  "translation_status": "reviewed"
- "id": "tub-section-06-002"
  "section_id": "section-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "We left Lord Peter in open rupture with his two brethren, both for ever discarded from his house, and resigned to the wide world with little or nothing to trust to. Which are circumstances that render them proper subjects for the charity of a writer’s pen to work on, scenes of misery ever affording the fairest harvest for great adventures. And in this the world may perceive the difference between the integrity of a generous Author and that of a common friend. The latter is observed to adhere close in prosperity, but on the decline of fortune to drop suddenly off; whereas the generous author, just on the contrary, finds his hero on the dunghill, from thence, by gradual steps, raises him to a throne, and then immediately withdraws, expecting not so much as thanks for his pains; in imitation of which example I have placed Lord Peter in a noble house, given him a title to wear and money to spend. There I shall leave him for some time, returning, where common charity directs me, to the assistance of his two brothers at their lowest ebb. However, I shall by no means forget my character of a historian, to follow the truth step by step whatever happens, or wherever it may lead me."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 171
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[160]"
  "translation_ja": "ピーター卿と二人の兄弟が公然と決裂し、二人が家から永遠に追い払われ、ほとんど、あるいはまったく頼るものもなく、広い世間へ放り出されたところで、話を置いてきた。このような境遇は、著者の慈悲深いペンが働くのに、まさにふさわしい題材である。悲惨な場面は、大冒険の最も豊かな収穫を、いつでも与えてくれるからだ。ここに世間は、寛大な著者の誠実さと、ありふれた友人のそれとの違いを見ることができる。後者は、栄えている間はぴたりと寄り添い、運が傾くと、突然離れるものとされる。これに対し、寛大な著者は、まったく逆である。肥溜めの上で主人公を見つけ、そこから段階を踏んで王座へ上げると、すぐさま身を引き、労苦に対して感謝さえ期待しない。私はこの手本にならい、ピーター卿を立派な家へ入れ、帯びるべき称号と、使うべき金を与えた。そこへ、しばらく彼を残しておこう。そして、普通の慈悲が指図するところへ、すなわち、どん底にいる二人の兄弟を助けに戻ろう。ただし、歴史家としての役目は決して忘れず、何が起きようと、どこへ導かれようと、真実を一歩ずつ追ってゆくつもりである。"
  "translation_status": "reviewed"
- "id": "tub-section-06-003"
  "section_id": "section-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The two exiles so nearly united in fortune and interest took a lodging together, where at their first leisure they began to reflect on the numberless misfortunes and vexations of their life past, and could not tell of the sudden to what failure in their conduct they ought to impute them, when, after some recollection, they called to mind the copy of their father’s will which they had so happily recovered. This was immediately produced, and a firm resolution taken between them to alter whatever was already amiss, and reduce all their future measures to the strictest obedience prescribed therein. The main body of the will (as the reader cannot easily have forgot) consisted in certain admirable rules, about the wearing of their coats, in the perusal whereof the two brothers at every period duly comparing the doctrine with the practice, there was never seen a wider difference between two things, horrible downright transgressions of every point. Upon which they both resolved without further delay to fall immediately upon reducing the whole exactly after their father’s model."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 172
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[161]"
  "translation_ja": "運命も利害も、これほど固く結ばれた二人の追放者は、一緒に宿を借りた。最初の暇ができると、これまでの人生の数えきれぬ不幸と煩いを振り返り始めた。どんな行いの過ちが、それを招いたのか、すぐにはわからなかったが、いくらか記憶をたどるうち、幸運にも取り戻した、父の遺言の写しを思い出した。さっそくこれを取り出し、すでに間違っているものは何でも改め、今後のあらゆる方針を、その指示へ最も厳しく従わせようと、二人で固く決意した。遺言の主要部分は、読者もそう簡単にはお忘れあるまいが、上着の着方についての、いくつかの見事な規則から成っていた。二人はそれを読むたび、一文ごとに、教えと実際をきちんと比べた。これほど大きく食い違う二つのものは、ほかに見たことがなかった。一つ一つ、恐ろしいほど、露骨な違反だった。そこで二人は、これ以上遅らせず、全体を父の手本へ正確に戻す作業に、ただちに取りかかろうと決めた。"
  "translation_status": "reviewed"
- "id": "tub-section-06-004"
  "section_id": "section-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But here it is good to stop the hasty reader, ever impatient to see the end of an adventure before we writers can duly prepare him for it. I am to record that these two brothers began to be distinguished at this time by certain names. One of them desired to be called Martin, and the other took the appellation of Jack. These two had lived in much friendship and agreement under the tyranny of their brother Peter, as it is the talent of fellow-sufferers to do, men in misfortune being like men in the dark, to whom all colours are the same. But when they came forward into the world, and began to display themselves to each other and to the light, their complexions appeared extremely different, which the present posture of their affairs gave them sudden opportunity to discover."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 173
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[162]"
  "translation_ja": "だがここで、気の早い読者を引き止めるのがよかろう。われわれ著者が、しかるべき準備を整えてやる前に、冒険の結末を見たがる、いつも待ちきれない読者のことだ。この頃、二人の兄弟は、それぞれの名で区別され始めたと、記しておかなければならない。一人はマーティンと呼ばれたいと望み、もう一人はジャックと名乗った。この二人は、兄ピーターの圧政の下では、たいそう仲よく、意見も合って暮らしていた。苦しみを共にする者の得意なことだ。不幸な人々は、暗闇の中の人々に似て、どの色も同じに見えるからである。だが、世間へ進み出て、互いの姿を、また光の下へ、さらし始めると、その色合いは、まるで違って見えた。今の事情によって、二人は、それに気づく機会を、たちまち得たのである。"
  "translation_status": "reviewed"
- "id": "tub-section-06-005"
  "section_id": "section-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But here the severe reader may justly tax me as a writer of short memory, a deficiency to which a true modern cannot but of necessity be a little subject. Because, memory being an employment of the mind upon things past, is a faculty for which the learned in our illustrious age have no manner of occasion, who deal entirely with invention and strike all things out of themselves, or at least by collision from each other; upon which account, we think it highly reasonable to produce our great forgetfulness as an argument unanswerable for our great wit. I ought in method to have informed the reader about fifty pages ago of a fancy Lord Peter took, and infused into his brothers, to wear on their coats whatever trimmings came up in fashion, never pulling off any as they went out of the mode, but keeping on all together, which amounted in time to a medley the most antic you can possibly conceive, and this to a degree that, upon the time of their falling out, there was hardly a thread of the original coat to be seen, but an infinite quantity of lace, and ribbands, and fringe, and embroidery, and points (I mean only those tagged with silver, for the rest fell off). Now this material circumstance having been forgot in due place, as good fortune hath ordered, comes in very properly here, when the two brothers are just going to reform their vestures into the primitive state prescribed by their father’s will."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 174
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[163]"
  "translation_ja": "しかしここで、厳しい読者は、私を記憶の短い著者として、正当に責めてよい。これは真の近代人なら、どうしても多少は免れぬ欠点である。記憶とは、過ぎた物事へ精神を働かせることだから、輝かしいわが時代の学者には、まるで用のない能力なのだ。彼らはもっぱら創意を扱い、何もかも、自分自身から打ち出すか、少なくとも、互いにぶつかり合って火花を出す。だから私どもは、大いなる物忘れを、大いなる才知の反論不能の証拠として示すのが、たいへん理にかなうと考える。本来の順序なら、五十頁ほど前に、読者へ伝えておくべきだった。ピーター卿は、流行する飾りは何でも上着につけ、流行が過ぎても決して外さず、全部つけたままにするという気まぐれを思いつき、兄弟にも吹き込んだ。時がたつと、想像しうるうちで最も奇怪な、ごったまぜになった。三人が仲違いした頃には、元の上着の糸など、ほとんど見えず、途方もない量のモール、リボン、房飾り、刺繍、留め紐しか見えないほどだった。留め紐というのは、銀の先金つきのものだけで、ほかは落ちてしまっていた。さて、この大事な事情を、あるべき場所で言い忘れたが、幸いにも、二人が父の遺言の命ずる元の姿へ、服を改めようとしている、ちょうどここで、とても都合よく持ち出せるのである。"
  "translation_status": "reviewed"
- "id": "tub-section-06-006"
  "section_id": "section-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "They both unanimously entered upon this great work, looking sometimes on their coats and sometimes on the will. Martin laid the first hand; at one twitch brought off a large handful of points, and with a second pull stripped away ten dozen yards of fringe. But when he had gone thus far he demurred a while. He knew very well there yet remained a great deal more to be done; however, the first heat being over, his violence began to cool, and he resolved to proceed more moderately in the rest of the work, having already very narrowly escaped a swinging rent in pulling off the points, which being tagged with silver (as we have observed before), the judicious workman had with much sagacity double sewn to preserve them from falling. Resolving therefore to rid his coat of a huge quantity of gold lace, he picked up the stitches with much caution and diligently gleaned out all the loose threads as he went, which proved to be a work of time. Then he fell about the embroidered Indian figures of men, women, and children, against which, as you have heard in its due place, their father’s testament was extremely exact and severe. These, with much dexterity and application, were after a while quite eradicated or utterly defaced. For the rest, where he observed the embroidery to be worked so close as not to be got away without damaging the cloth, or where it served to hide or strengthened any flaw in the body of the coat, contracted by the perpetual tampering of workmen upon it, he concluded the wisest course was to let it remain, resolving in no case whatsoever that the substance of the stuff should suffer injury, which he thought the best method for serving the true intent and meaning of his father’s will. And this is the nearest account I have been able to collect of Martin’s proceedings upon this great revolution."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 175
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[164]"
  "translation_ja": "二人は、あるときは上着を、あるときは遺言を見つめ、一致して、この大事業に着手した。まずマーティンが手をつけた。一引きで、大きなひとつかみの留め紐を取り、二度目の引っ張りで、百二十ヤードの房飾りを剝ぎ取った。だが、そこまで進むと、しばらく考え込んだ。まだ、することがたくさん残っているのは、よくわかっていた。しかし、最初の熱が過ぎると、激しさも冷め、残りはもっと穏やかに進めようと決めた。すでに留め紐を外すとき、大きく裂くところを、きわどく免れたからである。前にも述べたとおり、先金が銀なので、分別ある職人が、落ちないよう、抜け目なく二重に縫いつけていたのだ。そこで、大量の金モールを上着から除こうと決めると、細心の注意で縫い目をほどき、進むたびに、ほどけた糸を丹念に拾い出した。これは時間のかかる仕事になった。次に、インド風の男、女、子供の刺繍へ取りかかった。しかるべき箇所でお聞きになったとおり、これについて、父の遺言はきわめて厳密で厳しかった。相当な器用さと熱心さによって、やがてそれらは、すっかり取り去られるか、形がわからなくなった。残りについては、刺繍があまりに細かく入っていて、生地を傷めずには取れない所や、職人たちが絶えずいじり回したためにできた、上着の本体の傷を隠し、補強している所では、そのまま残すのが最も賢いと結論した。何があろうと、生地の実質を傷つけまいと決め、それこそ、父の遺言の真の意図と意味にかなう最善の方法だと考えたのである。この大変革におけるマーティンの行動について、集められたうち、最も正確に近い説明は以上である。"
  "translation_status": "reviewed"
- "id": "tub-section-06-007"
  "section_id": "section-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But his brother Jack, whose adventures will be so extraordinary as to furnish a great part in the remainder of this discourse, entered upon the matter with other thoughts and a quite different spirit. For the memory of Lord Peter’s injuries produced a degree of hatred and spite which had a much greater share of inciting him than any regards after his father’s commands, since these appeared at best only secondary and subservient to the other. However, for this medley of humour he made a shift to find a very plausible name, honouring it with the title of zeal, which is, perhaps, the most significant word that has been ever yet produced in any language, as, I think, I have fully proved in my excellent analytical discourse upon that subject, wherein I have deduced a histori-theo-physiological account of zeal, showing how it first proceeded from a notion into a word, and from thence in a hot summer ripened into a tangible substance. This work, containing three large volumes in folio, I design very shortly to publish by the modern way of subscription, not doubting but the nobility and gentry of the land will give me all possible encouragement, having already had such a taste of what I am able to perform."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 176
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[165]"
  "translation_ja": "だが、弟ジャックは、その冒険があまりに奇抜なので、この論説の残りの大部分を占めることになるのだが、別の考えと、まるで違う精神で、この仕事へ入った。ピーター卿に受けた仕打ちの記憶が、憎しみと意趣を生み、それが、父の命令を重んじる気持ちより、はるかに大きく彼を駆り立てた。父への配慮など、せいぜい二の次で、ほかの動機に従属するだけに見えたからだ。とはいえ、この気分の混ぜ物に、彼はどうにか、もっともらしい名を見つけ、「熱心」という称号を授けた。おそらく、どんな言語にも、これほど意味深い語は、まだ生まれていない。私は、この主題についての優れた分析的論説で、それを十分に証明したと思う。そこでは、熱心について、歴史学・神学・生理学の説明を導き出し、最初は一つの観念だったものが語となり、そこから暑い夏を経て、触れられる実体へと熟すさまを示した。この作品は、大判の二折本三巻から成り、近代流の予約購読方式で、ごく近く刊行するつもりである。この国の貴族や紳士たちは、すでに私の力量を味見しているのだから、できるかぎりの支援を寄せてくれるだろうと、疑っていない。"
  "translation_status": "reviewed"
- "id": "tub-section-06-008"
  "section_id": "section-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I record, therefore, that brother Jack, brimful of this miraculous compound, reflecting with indignation upon Peter’s tyranny, and further provoked by the despondency of Martin, prefaced his resolutions to this purpose. “What!” said he, “a rogue that locked up his drink, turned away our wives, cheated us of our fortunes, palmed his crusts upon us for mutton, and at last kicked us out of doors; must we be in his fashions? A rascal, besides, that all the street cries out against.” Having thus kindled and inflamed himself as high as possible, and by consequence in a delicate temper for beginning a reformation, he set about the work immediately, and in three minutes made more dispatch than Martin had done in as many hours. For, courteous reader, you are given to understand that zeal is never so highly obliged as when you set it a-tearing; and Jack, who doted on that quality in himself, allowed it at this time its full swing. Thus it happened that, stripping down a parcel of gold lace a little too hastily, he rent the main body of his coat from top to bottom [110]; and whereas his talent was not of the happiest in taking up a stitch, he knew no better way than to darn it again with packthread thread and a skewer. But the matter was yet infinitely worse (I record it with tears) when he proceeded to the embroidery; for being clumsy of nature, and of temper impatient withal, beholding millions of stitches that required the nicest hand and sedatest constitution to extricate, in a great rage he tore off the whole piece, cloth and all, and flung it into the kennel, and furiously thus continuing his career, “Ah! good brother Martin,” said he, “do as I do, for the love of God; strip, tear, pull, rend, flay off all that we may appear as unlike that rogue Peter as it is possible. I would not for a hundred pounds carry the least mark about me that might give occasion to the neighbours of suspecting I was related to such a rascal.” But Martin, who at this time happened to be extremely phlegmatic and sedate, begged his brother, of all love, not to damage his coat by any means, for he never would get such another; desired him to consider that it was not their business to form their actions by any reflection upon Peter’s, but by observing the rules prescribed in their father’s will. That he should remember Peter was still their brother, whatever faults or injuries he had committed, and therefore they should by all means avoid such a thought as that of taking measures for good and evil from no other rule than of opposition to him. That it was true the testament of their good father was very exact in what related to the wearing of their coats; yet was it no less penal and strict in prescribing agreement, and friendship, and affection between them. And therefore, if straining a point were at all defensible, it would certainly be so rather to the advance of unity than increase of contradiction."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 177
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[166]"
  "translation_ja": "そこで記しておこう。兄弟ジャックは、この奇跡的な混合物を、なみなみと満たし、ピーターの圧政を怒りもって振り返り、さらにマーティンの弱腰に苛立ち、決意の前置きを、こんな趣旨で述べた。「何だって！」と彼は言った。「酒をしまい込み、われわれの妻を追い出し、財産を騙し取り、パンの皮を羊肉と押しつけ、最後には戸外へ蹴り出した悪党だぞ。その流行に、われわれも従えというのか。そのうえ、通り中が悪く言う、ならず者ではないか。」こうして、できるかぎり自分に火をつけ、燃え上がらせ、したがって改革を始めるのに、たいへん申し分のない気分となって、すぐに仕事へ取りかかった。三分で、マーティンが三時間で進めたよりも、多くを片づけた。親切な読者よ、御承知いただきたい。熱心さは、引き裂く仕事を与えられたときほど、喜ぶことはない。ジャックは、自分のこの資質に惚れ込んでいたので、このときは、存分に暴れさせた。こうして、一かたまりの金モールを、少し急ぎすぎて引き下ろすと、上着の本体が、上から下まで裂けてしまった[110]。しかも、縫い目を拾う腕前は、あまり幸せなものではなかったので、荷造り紐と串で縫い合わせる以上の方法を、思いつけなかった。だが、涙とともに記すが、刺繍へ進むと、事態は無限に悪くなった。生来不器用で、そのうえ気も短かった彼は、解くには最も繊細な手と、最も落ち着いた気性が要る、何百万もの縫い目を見て、激怒した。生地もろとも、全部を引きちぎり、溝へ投げ捨てた。そして、狂ったように作業を続けながら言った。「ああ、よい兄弟マーティン、神のために、私のようにしろ。剝げ、裂け、引け、引き破れ、みんな剝ぎ取れ。あの悪党ピーターと、できるだけ似ても似つかぬ姿になろうじゃないか。百ポンドもらっても、あんなならず者と血縁かと、近所に疑わせる印は、ほんの少しだって身につけたくない。」しかし、そのとき、ちょうどたいそう冷静で落ち着いていたマーティンは、頼むから、どんなことがあっても、上着を傷めぬようにと、弟に懇願した。同じものは、二度と手に入らないからだ。自分たちの務めは、ピーターの行いに反応して、自分の行いを定めることではなく、父の遺言に定められた規則を守ることだと、考えてほしいと言った。ピーターがどんな過ちや加害を犯そうと、なお自分たちの兄弟であることを忘れてはならない。だから、善悪の判断を、ただ彼への反対だけから決めるような考えは、何としても避けるべきだ。たしかに、善良な父の遺言は、上着の着方について厳密だが、兄弟間の一致、友情、愛情についても、同じように罰を伴い、厳しく命じている。だから、もし多少の無理な解釈を弁護できる場合があるなら、対立を増すためより、結束を進めるためのほうが、確かにそうなのだ、と。"
  "translation_status": "reviewed"
- "id": "tub-section-06-009"
  "section_id": "section-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Martin had still proceeded as gravely as he began, and doubtless would have delivered an admirable lecture of morality, which might have exceedingly contributed to my reader’s repose both of body and mind (the true ultimate end of ethics), but Jack was already gone a flight-shot beyond his patience. And as in scholastic disputes nothing serves to rouse the spleen of him that opposes so much as a kind of pedantic affected calmness in the respondent, disputants being for the most part like unequal scales, where the gravity of one side advances the lightness of the other, and causes it to fly up and kick the beam; so it happened here that the weight of Martin’s arguments exalted Jack’s levity, and made him fly out and spurn against his brother’s moderation. In short, Martin’s patience put Jack in a rage; but that which most afflicted him was to observe his brother’s coat so well reduced into the state of innocence, while his own was either wholly rent to his shirt, or those places which had escaped his cruel clutches were still in Peter’s livery. So that he looked like a drunken beau half rifled by bullies, or like a fresh tenant of Newgate when he has refused the payment of garnish, or like a discovered shoplifter left to the mercy of Exchange-women [111a], or like a bawd in her old velvet petticoat resigned into the secular hands of the mobile [111b]. Like any or like all of these, a medley of rags, and lace, and fringes, unfortunate Jack did now appear; he would have been extremely glad to see his coat in the condition of Martin’s, but infinitely gladder to find that of Martin in the same predicament with his. However, since neither of these was likely to come to pass, he thought fit to lend the whole business another turn, and to dress up necessity into a virtue. Therefore, after as many of the fox’s arguments as he could muster up for bringing Martin to reason, as he called it, or as he meant it, into his own ragged, bobtailed condition, and observing he said all to little purpose, what alas! was left for the forlorn Jack to do, but, after a million of scurrilities against his brother, to run mad with spleen, and spite, and contradiction. To be short, here began a mortal breach between these two. Jack went immediately to new lodgings, and in a few days it was for certain reported that he had run out of his wits. In a short time after he appeared abroad, and confirmed the report by falling into the oddest whimsies that ever a sick brain conceived."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 178
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[167]"
  "translation_ja": "マーティンは、話し始めたときと同じく、重々しく続けていた。きっと、すばらしい道徳の講義をしてくれただろうし、それは、読者の心身の休息――倫理学の真の究極の目的――に、たいそう役立ったかもしれない。しかしジャックは、とうに我慢の届く範囲を、一射程も飛び越していた。スコラ学派の論争では、答える側の、学者ぶった、わざとらしい平静ほど、反対する側の癇癪をかき立てるものはない。論者はたいてい、釣り合いの悪い天秤に似て、一方の重みが、もう一方の軽さをいっそう進め、勢いよく跳ね上がらせ、梁へぶつける。ここでも同じで、マーティンの議論の重さは、ジャックの軽さを高め、暴れ出させ、兄の節度へ蹴りつかせた。要するに、マーティンの忍耐が、ジャックを激怒させたのだ。だが、何より彼を苦しめたのは、兄の上着があれほど見事に、無垢の状態へ戻ったのに、自分のものは、肌着まで丸見えになるほど裂けているか、残忍な爪を免れた場所だけ、なおピーターの仕着せのままであることだった。だから彼は、酔った伊達男が、ごろつきに半分剝ぎ取られた姿か、入牢の礼銭を払わなかった、ニューゲートの新入りか、万引きが露見し、取引所の女商人たちの手に委ねられた者[111a]か、古びたビロードの下スカートをまとい、群衆の世俗の手に渡された取り持ち婆[111b]に似ていた。そのどれか、あるいは全部に似て、ぼろ切れ、モール、房飾りの入り混じる姿で、不幸なジャックは現れた。自分の上着をマーティンの状態にできれば、たいそう嬉しかっただろう。だが、マーティンのものが自分と同じ窮状になるなら、その無限倍も嬉しかっただろう。しかし、どちらも起こりそうになかったので、この件全体を別の向きへ転じ、仕方のないことを、美徳に着飾らせるのがよいと考えた。そこで、思いつくかぎりの狐の理屈を並べ、マーティンを、本人の言い方では道理へ、本人の意図では、自分と同じ、ぼろぼろで尻尾を切られた状態へ、引き込もうとした。だが、どれもほとんど役立たないとわかると、ああ、見捨てられたジャックに、何が残されていたというのか。兄へ百万の罵りを浴びせた後、癇癪と意趣と反抗で、気が狂うよりほかなかった。手短に言えば、ここで二人の間に、致命的な裂け目が生じた。ジャックはすぐに別の宿へ移り、数日のうちに、気がおかしくなったとの噂が、確かなものとして広まった。その少し後、彼は外へ姿を現し、病んだ脳が思いついたうちでも、最も奇妙な気まぐれに陥って、噂を裏づけた。"
  "translation_status": "reviewed"
- "id": "tub-section-06-010"
  "section_id": "section-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And now the little boys in the streets began to salute him with several names. Sometimes they would call him Jack the Bald, sometimes Jack with a Lanthorn, sometimes Dutch Jack, sometimes French Hugh, sometimes Tom the Beggar, and sometimes Knocking Jack of the North [112]. And it was under one or some or all of these appellations (which I leave the learned reader to determine) that he hath given rise to the most illustrious and epidemic sect of Æolists, who, with honourable commemoration, do still acknowledge the renowned Jack for their author and founder. Of whose originals as well as principles I am now advancing to gratify the world with a very particular account."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 179
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[168]"
  "translation_ja": "すると、街の子供たちは、さまざまな名前で、彼を呼び迎えるようになった。あるときは禿のジャック、あるときは提灯ジャック、あるときはオランダのジャック、あるときはフランスのヒュー、あるときは乞食のトム、あるときは北方の叩き屋ジャック、と呼んだ[112]。そして、これらの一つ、いくつか、あるいはすべての名の下に――その決定は、学識ある読者に委ねる――彼は、最も輝かしく、最も広く蔓延する、風崇拝者の宗派を生み出した。彼らは今も、名高いジャックを、その創始者にして設立者と認め、敬意をもって記念している。その起源と原理について、これから私は、たいそう詳しい報告をもって、世間を喜ばせようとしているのである。"
  "translation_status": "reviewed"

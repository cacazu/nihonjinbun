  "translation_ja": "閣下"
  "translation_status": "reviewed"
- "id": "tub-somers-003"
  "section_id": "somers"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Though the author has written a large Dedication, yet that being addressed to a Prince whom I am never likely to have the honour of being known to; a person, besides, as far as I can observe, not at all regarded or thought on by any of our present writers; and I being wholly free from that slavery which booksellers usually lie under to the caprices of authors, I think it a wise piece of presumption to inscribe these papers to your Lordship, and to implore your Lordship’s protection of them. God and your Lordship know their faults and their merits; for as to my own particular, I am altogether a stranger to the matter; and though everybody else should be equally ignorant, I do not fear the sale of the book at all the worse upon that score. Your Lordship’s name on the front in capital letters will at any time get off one edition: neither would I desire any other help to grow an alderman than a patent for the sole privilege of dedicating to your Lordship."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 16
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[21]"
  "translation_ja": "著者は長々とした献辞を書いておりますが、その相手は、私などが御面識を得る栄誉にはとうていあずかれそうもない王子です。そのうえ、私の見るかぎり、今どきの文筆家は誰一人、その方を気にかけても、念頭に置いてもおりません。一方、私には、書店主がふつう著者の気まぐれに対して負っている、あの隷属の義務がまったくございません。そこで、この原稿を閣下に献じ、御庇護をお願いするのは、賢明な僭越というべきものと存じます。原稿の欠点も長所も、神と閣下にはおわかりでしょう。私自身は、その中身についてはまるで不案内でございます。世間の方々も同じように何も御存じでないとしても、それで売れ行きを心配するつもりは少しもございません。表に閣下の御名を大文字で掲げれば、いつでも一版は売り切れます。私が市参事会員へと出世するにも、閣下に献辞を捧げる独占権の特許さえいただければ、ほかに助けは要りません。"
  "translation_status": "reviewed"
- "id": "tub-somers-004"
  "section_id": "somers"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I should now, in right of a dedicator, give your Lordship a list of your own virtues, and at the same time be very unwilling to offend your modesty; but chiefly I should celebrate your liberality towards men of great parts and small fortunes, and give you broad hints that I mean myself. And I was just going on in the usual method to peruse a hundred or two of dedications, and transcribe an abstract to be applied to your Lordship, but I was diverted by a certain accident. For upon the covers of these papers I casually observed written in large letters the two following words, DETUR DIGNISSIMO, which, for aught I knew, might contain some important meaning. But it unluckily fell out that none of the Authors I employ understood Latin (though I have them often in pay to translate out of that language). I was therefore compelled to have recourse to the Curate of our Parish, who Englished it thus, Let it be given to the worthiest; and his comment was that the Author meant his work should be dedicated to the sublimest genius of the age for wit, learning, judgment, eloquence, and wisdom. I called at a poet’s chamber (who works for my shop) in an alley hard by, showed him the translation, and desired his opinion who it was that the Author could mean. He told me, after some consideration, that vanity was a thing he abhorred, but by the description he thought himself to be the person aimed at; and at the same time he very kindly offered his own assistance gratis towards penning a dedication to himself. I desired him, however, to give a second guess. Why then, said he, it must be I, or my Lord Somers. From thence I went to several other wits of my acquaintance, with no small hazard and weariness to my person, from a prodigious number of dark winding stairs; but found them all in the same story, both of your Lordship and themselves. Now your Lordship is to understand that this proceeding was not of my own invention; for I have somewhere heard it is a maxim that those to whom everybody allows the second place have an undoubted title to the first."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 17
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[22]"
  "translation_ja": "さて、献辞を捧げる者の権利として、閣下御自身の美徳を列挙し、同時に御謙遜を傷つけるのは心苦しいと申し上げるべきところでございましょう。とりわけ、才能は豊かでも懐の乏しい者に対する御寛大をたたえ、それはほかならぬ私のことだと、露骨にほのめかすべきでしょう。そこで私も通例に従い、百や二百の献辞に目を通して、閣下に当てはめられる抜粋を写し取ろうとしたのですが、ある出来事で手が止まりました。この原稿の表紙に、たまたま DETUR DIGNISSIMO という二語が大きく書かれているのを見つけたのです。ひょっとすると、何か重要な意味があるのかもしれません。ところが運悪く、私が雇っている著述家には、ラテン語のわかる者が一人もおりませんでした。もっとも、ラテン語から翻訳させるために、しょっちゅう彼らへ金を払ってはいるのですが。仕方なく教区の副牧師に頼みますと、「最もふさわしい人に与えよ」と訳してくれました。その説明では、著者は、機知、学識、判断力、雄弁、知恵において当代随一の天才に、この著作を献じたいのだろうとのことでした。私は近くの路地に住む詩人の部屋を訪ねました。私の店のために仕事をしている男です。その訳を見せ、著者が誰のことを言っているのか、意見を求めました。少し考えてから彼は、自分は虚栄を忌み嫌う人間だが、この説明からすると指しているのは自分だろう、と答えました。そして、本人に捧げる献辞を作るのであれば、自分も無報酬で力を貸そうと、たいへん親切に申し出てくれました。それでも私は、もう一人、心当たりを挙げてくれと頼みました。「それなら」と彼は言いました。「私か、さもなければサマーズ卿に決まっている。」そこからほかの知り合いの才人たちも何人か訪ねました。暗い螺旋階段をおびただしく上り下りさせられ、ずいぶん危ない思いも疲れる思いもしましたが、閣下についても自分自身についても、皆の答えは同じでした。なお、この手順は私の思いつきではございません。誰もが二番手と認める人物には、一番手となる疑いのない権利がある、という格言をどこかで聞いたことがあったのです。"
  "translation_status": "reviewed"
- "id": "tub-somers-005"
  "section_id": "somers"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This infallibly convinced me that your Lordship was the person intended by the Author. But being very unacquainted in the style and form of dedications, I employed those wits aforesaid to furnish me with hints and materials towards a panegyric upon your Lordship’s virtues."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 18
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[23]"
  "translation_ja": "これで、著者の意中の人物は閣下だと、間違いなく確信いたしました。しかし、私は献辞の文体にも作法にもひどく疎いものですから、先ほどの才人たちを雇い、閣下の美徳をたたえる文章のために、着想と材料を用意させました。"
  "translation_status": "reviewed"
- "id": "tub-somers-006"
  "section_id": "somers"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In two days they brought me ten sheets of paper filled up on every side. They swore to me that they had ransacked whatever could be found in the characters of Socrates, Aristides, Epaminondas, Cato, Tully, Atticus, and other hard names which I cannot now recollect. However, I have reason to believe they imposed upon my ignorance, because when I came to read over their collections, there was not a syllable there but what I and everybody else knew as well as themselves: therefore I grievously suspect a cheat; and that these Authors of mine stole and transcribed every word from the universal report of mankind. So that I took upon myself as fifty shillings out of pocket to no manner of purpose."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 19
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[24]"
  "translation_ja": "二日後、彼らは裏表びっしり書き込んだ紙を十枚持ってまいりました。ソクラテス、アリステイデス、エパメイノンダス、カトー、キケロ、アッティクス、そのほか今では思い出せない難しい名の人々について、人物評に見つかるものは何もかも探し尽くしたと、彼らは誓いました。しかし、どうも私の無知につけ込んだらしいのです。集めた材料を読んでみると、私も世間の人も彼らと同じくらい知っていることばかりで、目新しい言葉は一つもありませんでした。そこで私は、これは詐欺ではないか、このお抱え著述家たちは、世間一般の評判を一字残らず盗み写したのではないか、と大いに疑っております。まったく何の役にも立たないことに、五十シリングをふいにした勘定です。"
  "translation_status": "reviewed"
- "id": "tub-somers-007"
  "section_id": "somers"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "If by altering the title I could make the same materials serve for another dedication (as my betters have done), it would help to make up my loss; but I have made several persons dip here and there in those papers, and before they read three lines they have all assured me plainly that they cannot possibly be applied to any person besides your Lordship."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 20
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[25]"
  "translation_ja": "表題さえ替えれば同じ材料を別の献辞に使えるのでしたら、私より偉い方々もなさったように、損失の埋め合わせになりましょう。ところが、何人かにこの原稿を拾い読みしてもらったところ、三行も読まぬうちに、これは閣下以外の誰にも絶対に当てはまらないと、皆にはっきり請け合われてしまいました。"
  "translation_status": "reviewed"
- "id": "tub-somers-008"
  "section_id": "somers"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I expected, indeed, to have heard of your Lordship’s bravery at the head of an army; of your undaunted courage in mounting a breach or scaling a wall; or to have had your pedigree traced in a lineal descent from the House of Austria; or of your wonderful talent at dress and dancing; or your profound knowledge in algebra, metaphysics, and the Oriental tongues: but to ply the world with an old beaten story of your wit, and eloquence, and learning, and wisdom, and justice, and politeness, and candour, and evenness of temper in all scenes of life; of that great discernment in discovering and readiness in favouring deserving men; with forty other common topics; I confess I have neither conscience nor countenance to do it. Because there is no virtue either of a public or private life which some circumstances of your own have not often produced upon the stage of the world; and those few which for want of occasions to exert them might otherwise have passed unseen or unobserved by your friends, your enemies have at length brought to light."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 21
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[26]"
  "translation_ja": "私が聞かされるつもりでいたのは、軍の先頭に立つ閣下の武勇や、城壁の破れを乗り越え、塀をよじ登る不撓の勇気、あるいはオーストリア王家から一直線に続く御家系、衣装や舞踊のすばらしい才覚、代数学、形而上学、東洋諸語の深い御造詣といったお話でした。それが、機知、雄弁、学識、知恵、公正、洗練、率直さ、どんな境遇でも変わらぬ穏やかな御気性、優れた人を見抜く大いなる眼力と、その人に進んで力を貸す御姿勢、そのほか四十ばかりのありふれた題目について、聞き古した話を世間に浴びせるとは。正直に申しまして、そんなことをする良心も、厚い面の皮も、私にはございません。公私の生活における美徳で、閣下の御身の上に起きた何らかの事情によって、世間の舞台にたびたび示されなかったものなどないからです。発揮する機会がなく、御友人にさえ見えず、気づかれずに終わったかもしれない少数の美徳も、とうとう敵方の人々が明るみに出してくれました。"
  "translation_status": "reviewed"
- "id": "tub-somers-009"
  "section_id": "somers"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is true I should be very loth the bright example of your Lordship’s virtues should be lost to after-ages, both for their sake and your own; but chiefly because they will be so very necessary to adorn the history of a late reign; and that is another reason why I would forbear to make a recital of them here; because I have been told by wise men that as dedications have run for some years past, a good historian will not be apt to have recourse thither in search of characters."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 22
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[27]"
  "translation_ja": "もちろん、閣下の美徳の輝かしい手本が後世に伝わらぬことは、後世の人々のためにも、閣下のためにも、まことに惜しいと思います。とりわけ、それは先頃の治世の歴史を飾るのに、ぜひとも必要となりましょう。そして、それもまた、ここで美徳を並べ立てるのを控える理由です。近年の献辞のありさまからすれば、優れた歴史家は、人物評を探しに献辞をひもといたりはしないだろうと、賢い人々から聞かされたからでございます。"
  "translation_status": "reviewed"
- "id": "tub-somers-010"
  "section_id": "somers"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is one point wherein I think we dedicators would do well to change our measures; I mean, instead of running on so far upon the praise of our patron’s liberality, to spend a word or two in admiring their patience. I can put no greater compliment on your Lordship’s than by giving you so ample an occasion to exercise it at present. Though perhaps I shall not be apt to reckon much merit to your Lordship upon that score, who having been formerly used to tedious harangues, and sometimes to as little purpose, will be the readier to pardon this, especially when it is offered by one who is, with all respect and veneration,"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 23
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[28]"
  "translation_ja": "献辞を捧げる私どもも、一つだけ、やり方を改めたほうがよい点があると存じます。庇護者の寛大さを長々とたたえる代わりに、その忍耐力への感嘆を、一言二言述べるということです。今こうして、その忍耐力を発揮する十分な機会を差し上げること以上に、閣下をおほめする方法はございません。とはいえ、この点では、閣下にさほど大きな功績を認める気にはなれないかもしれません。閣下は以前から、長々とした演説には慣れておられ、ときにはこの文章と同じほど無益なものも聞かされてきたのですから、これもいっそう気軽にお許しくださるでしょう。まして、それを差し上げるのが、あらゆる敬意と畏敬をもって、次のように申し上げる者なのですから。"
  "translation_status": "reviewed"
- "id": "tub-somers-011"
  "section_id": "somers"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "My Lord,"
  "source_languages":
  - "en"
  "source_locations":

  "translation_status": "reviewed"
- "id": "tub-preface-002"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The wits of the present age being so very numerous and penetrating, it seems the grandees of Church and State begin to fall under horrible apprehensions lest these gentlemen, during the intervals of a long peace, should find leisure to pick holes in the weak sides of religion and government. To prevent which, there has been much thought employed of late upon certain projects for taking off the force and edge of those formidable inquirers from canvassing and reasoning upon such delicate points. They have at length fixed upon one, which will require some time as well as cost to perfect. Meanwhile, the danger hourly increasing, by new levies of wits, all appointed (as there is reason to fear) with pen, ink, and paper, which may at an hour’s warning be drawn out into pamphlets and other offensive weapons ready for immediate execution, it was judged of absolute necessity that some present expedient be thought on till the main design can be brought to maturity. To this end, at a grand committee, some days ago, this important discovery was made by a certain curious and refined observer, that seamen have a custom when they meet a Whale to fling him out an empty Tub, by way of amusement, to divert him from laying violent hands upon the Ship. This parable was immediately mythologised; the Whale was interpreted to be Hobbes’s “Leviathan,” which tosses and plays with all other schemes of religion and government, whereof a great many are hollow, and dry, and empty, and noisy, and wooden, and given to rotation. This is the Leviathan from whence the terrible wits of our age are said to borrow their weapons. The Ship in danger is easily understood to be its old antitype the commonwealth. But how to analyse the Tub was a matter of difficulty, when, after long inquiry and debate, the literal meaning was preserved, and it was decreed that, in order to prevent these Leviathans from tossing and sporting with the commonwealth, which of itself is too apt to fluctuate, they should be diverted from that game by “A Tale of a Tub.” And my genius being conceived to lie not unhappily that way, I had the honour done me to be engaged in the performance."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 48
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[50]"
  "translation_ja": "当代の才人はあまりに数が多く、洞察も鋭いので、教会と国家のお偉方は、恐ろしい心配に取りつかれ始めたらしい。この人たちが長い平和の合間に暇を見つけ、宗教や政治の弱点をほじくり出しはしないか、というのである。それを防ごうと、近頃はさまざまな計画が真剣に考えられてきた。この手ごわい探究者たちの勢いと切れ味をそらし、そんな微妙な問題について詮索したり理屈をこねたりさせないためだ。ようやく一案に落ち着いたが、完成には費用も時間もかかる。その間にも、才人の新兵が次々に徴集され、危険は刻一刻と増していた。恐ろしいことに、全員がペンとインクと紙を装備しているらしく、ひと声かかれば、それらはパンフレットその他の攻撃兵器となって、たちまち威力を発揮できる。そこで、本計画が実現するまでの応急策を、どうあっても考えねばならぬと判断された。この目的で数日前に開かれた大委員会で、ある好奇心に富んだ洗練された観察者が、重大な発見を披露した。船乗りは鯨に出会うと、空の樽を投げて遊び相手にし、船に乱暴を働かせないよう気をそらす習慣がある、というのである。この話にはただちに寓意が与えられた。鯨とはホッブズの『リヴァイアサン』であり、ほかのあらゆる宗教・政治の仕組みを、放り投げてはおもちゃにするものとされた。それらの仕組みの多くは、がらんどうで、干からび、中身がなく、騒々しく、木でできていて、よく回る。当代の恐るべき才人たちは、このリヴァイアサンから武器を借りてくるのだという。危うくなった船が、昔ながらの寓意どおり国家共同体を表すことは、容易にわかる。だが樽の分析が難しかった。長い調査と議論の末、これは文字どおりの意味に据え置かれ、次のように決定した。これらのリヴァイアサンに、ただでさえ揺らぎやすい国家共同体を放り上げて遊ばせないため、その遊びから『樽物語』へと気をそらせること。私の才も、その方面に向いていなくはないと見込まれたので、光栄にもこの仕事を仰せつかったのである。"
  "translation_status": "reviewed"
- "id": "tub-preface-003"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This is the sole design in publishing the following treatise, which I hope will serve for an interim of some months to employ those unquiet spirits till the perfecting of that great work, into the secret of which it is reasonable the courteous reader should have some little light."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 49
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[51]"
  "translation_ja": "以下の論考を刊行する目的は、ただこれだけである。かの大事業が完成するまでの数か月、落ち着きのない連中の暇つぶしになればと願っている。親切な読者にも、その事業の秘密を少しはお知らせしてよかろう。"
  "translation_status": "reviewed"
- "id": "tub-preface-004"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is intended that a large Academy be erected, capable of containing nine thousand seven hundred forty and three persons, which, by modest computation, is reckoned to be pretty near the current number of wits in this island [50]. These are to be disposed into the several schools of this Academy, and there pursue those studies to which their genius most inclines them. The undertaker himself will publish his proposals with all convenient speed, to which I shall refer the curious reader for a more particular account, mentioning at present only a few of the principal schools. There is, first, a large pederastic school, with French and Italian masters; there is also the spelling school, a very spacious building; the school of looking-glasses; the school of swearing; the school of critics; the school of salivation; the school of hobby-horses; the school of poetry; the school of tops; the school of spleen; the school of gaming; with many others too tedious to recount. No person to be admitted member into any of these schools without an attestation under two sufficient persons’ hands certifying him to be a wit."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 50
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[52]"
  "translation_ja": "計画では、九千七百四十三人を収容できる大きな学園を建てることになっている。控えめな計算によれば、これは現在この島にいる才人の数に、ほぼ近いらしい[50]。彼らを学園内のさまざまな学科に配属し、それぞれの資質に最も向く研究に従事させる。事業の請負人はいずれ、できるだけ早く計画書を刊行するはずなので、詳しく知りたい読者にはそちらを御覧いただき、ここでは主要な学科を二、三挙げるにとどめよう。まず、フランス人とイタリア人の教師をそろえた大きな少年愛学科がある。また、広々とした建物を備える綴り字学科、鏡学科、罵り学科、批評家学科、唾液分泌学科、木馬学科、詩学科、独楽学科、癇癪学科、賭博学科などがある。ほかにもあるが、挙げていては退屈だろう。どの学科であれ、しかるべき二人の署名により才人であると保証された証明書がなければ、入学は許されない。"
  "translation_status": "reviewed"
- "id": "tub-preface-005"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But to return. I am sufficiently instructed in the principal duty of a preface if my genius, were capable of arriving at it. Thrice have I forced my imagination to take the tour of my invention, and thrice it has returned empty, the latter having been wholly drained by the following treatise. Not so my more successful brethren the moderns, who will by no means let slip a preface or dedication without some notable distinguishing stroke to surprise the reader at the entry, and kindle a wonderful expectation of what is to ensue. Such was that of a most ingenious poet, who, soliciting his brain for something new, compared himself to the hangman and his patron to the patient. This was insigne, recens, indictum ore alio [51a]. When I went through that necessary and noble course of study, [51b] I had the happiness to observe many such egregious touches, which I shall not injure the authors by transplanting, because I have remarked that nothing is so very tender as a modern piece of wit, and which is apt to suffer so much in the carriage. Some things are extremely witty to-day, or fasting, or in this place, or at eight o’clock, or over a bottle, or spoke by Mr. Whatdyecall’m, or in a summer’s morning, any of which, by the smallest transposal or misapplication, is utterly annihilate. Thus wit has its walks and purlieus, out of which it may not stray the breadth of a hair, upon peril of being lost. The moderns have artfully fixed this Mercury, and reduced it to the circumstances of time, place, and person. Such a jest there is that will not pass out of Covent Garden, and such a one that is nowhere intelligible but at Hyde Park Corner. Now, though it sometimes tenderly affects me to consider that all the towardly passages I shall deliver in the following treatise will grow quite out of date and relish with the first shifting of the present scene, yet I must need subscribe to the justice of this proceeding, because I cannot imagine why we should be at expense to furnish wit for succeeding ages, when the former have made no sort of provision for ours; wherein I speak the sentiment of the very newest, and consequently the most orthodox refiners, as well as my own. However, being extremely solicitous that every accomplished person who has got into the taste of wit calculated for this present month of August 1697 should descend to the very bottom of all the sublime throughout this treatise, I hold it fit to lay down this general maxim. Whatever reader desires to have a thorough comprehension of an author’s thoughts, cannot take a better method than by putting himself into the circumstances and posture of life that the writer was in upon every important passage as it flowed from his pen, for this will introduce a parity and strict correspondence of ideas between the reader and the author. Now, to assist the diligent reader in so delicate an affair—as far as brevity will permit—I have recollected that the shrewdest pieces of this treatise were conceived in bed in a garret. At other times (for a reason best known to myself) I thought fit to sharpen my invention with hunger, and in general the whole work was begun, continued, and ended under a long course of physic and a great want of money. Now, I do affirm it will be absolutely impossible for the candid peruser to go along with me in a great many bright passages, unless upon the several difficulties emergent he will please to capacitate and prepare himself by these directions. And this I lay down as my principal postulatum."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 51
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[53]"
  "translation_ja": "さて、話を戻そう。序文の第一の務めが何かは、十分心得ている。私の才がそれを果たせるのであれば、の話だが。私は三度、想像力を駆り立て、創意の領地を巡らせた。三度とも手ぶらで戻ってきた。創意のほうは、以下の論考ですっかり汲み尽くしていたからである。もっと成功している同業の近代人たちは、そうではない。序文や献辞となれば、何か際立った一筆で、入り口から読者を驚かせ、先への大きな期待を燃え立たせずにはおかない。たとえば、あるたいそう才気ある詩人は、新しい趣向を求めて頭を絞り、自分を死刑執行人に、庇護者を刑を受ける者にたとえた。まさしく「鮮やかで、新しく、ほかの口がまだ語らなかったもの」だった[51a]。私も、あの必要にして高貴な研究課程[51b]を修めたときには、こういう抜群の一筆をたくさん見つける幸運に恵まれた。しかし、それをここへ移し植えて著者を傷つけるつもりはない。近代の機知ほど繊細で、運搬中に傷みやすいものはない、と気づいているからだ。今日なら、空腹のときなら、この場所なら、八時なら、酒を飲みながらなら、何とかいう氏が語るなら、夏の朝なら、とびきり気の利いた話になるものがある。そのどれも、ほんの少し場所を替え、使いどころを誤っただけで、跡形もなく消えてしまう。つまり機知にも散歩道と縄張りがあって、そこから髪の毛一本ほどでも外れれば、おしまいなのである。近代人たちは、この水銀のようなものを巧みに固定し、時・場所・人の条件に縛りつけた。ある冗談はコヴェント・ガーデンの外へは出られず、ある冗談はハイド・パーク・コーナーでしか意味が通じない。私がこの論考で披露する有望なくだりも、目の前の景色がひとたび変われば、すっかり時代遅れとなり、味を失う。そのことを思うと、しんみりする場合もある。しかし、このやり方が公正であることは認めなければならない。先の時代の人々が私どものためには何も用意しなかったのに、なぜ私どもだけが、費用をかけて後世へ機知を供給してやる必要があるのか、わからないからだ。これは私一人の考えではない。最も新しく、したがって最も正統な趣味の改良家たちの気持ちでもある。とはいえ、まさに今、一六九七年八月向けに仕立てられた機知の味を覚えた、あらゆる教養人に、この論考のあらゆる崇高なくだりの底まで降りていただきたいと、私は切に願っている。そこで、次の一般原則を定めておく。著者の考えを十分に理解したい読者は、重要なくだりの一つ一つがペンから流れ出たとき、著者が置かれていた生活の境遇と姿勢に、自分を置いてみるのが何よりよい。そうすれば、読者と著者の観念の間に、等しさと厳密な対応が生まれるからである。さて、この微妙な仕事に取り組む熱心な読者を、簡潔さの許すかぎり助けようと記憶をたどると、本作の最も冴えたくだりは、屋根裏部屋の寝床で思いついたものだった。また別のときには、私だけが知る理由から、空腹で創意を研ぎ澄ますことにした。概していえば、作品の全体が、長い服薬生活とひどい金欠のうちに、始まり、進み、終わった。だから私は断言する。心の開けた読者であっても、難所に出会うたび、この指示に従って身を整え、準備してくださらないかぎり、多くの輝かしいくだりについてくるのは、絶対に不可能だろう。これを、私の第一の要請としておく。"
  "translation_status": "reviewed"
- "id": "tub-preface-006"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Because I have professed to be a most devoted servant of all modern forms, I apprehend some curious wit may object against me for proceeding thus far in a preface without declaiming, according to custom, against the multitude of writers whereof the whole multitude of writers most reasonably complain. I am just come from perusing some hundreds of prefaces, wherein the authors do at the very beginning address the gentle reader concerning this enormous grievance. Of these I have preserved a few examples, and shall set them down as near as my memory has been able to retain them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 52
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[54]"
  "translation_ja": "私は近代のあらゆる作法に忠実に仕えると公言しているので、気の回る才人からは、こんな反論を受けそうだ。序文をここまで進めながら、なぜ慣例どおり、著述家の多すぎることを弾劾しないのか。大勢の著述家が一人残らず、もっともなことに、嘆いている問題ではないか、と。私はたった今、何百もの序文を読み終えたところだが、どれも冒頭で、この甚だしい弊害について、優しい読者に語りかけていた。例をいくつか覚えているので、記憶に残ったままに、できるだけ近く書き記そう。"
  "translation_status": "reviewed"

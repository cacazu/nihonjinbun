  "source_text": "“To all mayors, sheriffs, jailors, constables, bailiffs, hangmen, &c. Whereas we are informed that A. B. remains in the hands of you, or any of you, under the sentence of death. We will and command you, upon sight hereof, to let the said prisoner depart to his own habitation, whether he stands condemned for murder, sodomy, rape, sacrilege, incest, treason, blasphemy, &c., for which this shall be your sufficient warrant. And it you fail hereof, G— d—mn you and yours to all eternity. And so we bid you heartily farewell. Your most humble man’s man,"
  "source_languages":
  - "en"
  "source_locations":

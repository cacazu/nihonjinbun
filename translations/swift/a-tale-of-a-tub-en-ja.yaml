    第1節
    序論
  "translation_status": "reviewed"
- "id": "tub-section-01-002"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Whoever has an ambition to be heard in a crowd must press, and squeeze, and thrust, and climb with indefatigable pains, till he has exalted himself to a certain degree of altitude above them. Now, in all assemblies, though you wedge them ever so close, we may observe this peculiar property, that over their heads there is room enough; but how to reach it is the difficult point, it being as hard to get quit of number as of hell."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 67
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[68]"
  "translation_ja": "人だかりの中で自分の声を聞かせたいと望む者は、押し、詰め寄り、突き進み、よじ登り、疲れを知らぬ努力を重ねて、皆の頭よりいくらか高い所まで自分を持ち上げねばならない。どんな集まりでも、いくらぎゅうぎゅうに人を詰め込んでも、その頭の上には十分な余地がある、という不思議な性質に気づくだろう。だが、そこまで達するのが難しい。大勢から抜け出すのは、地獄から抜け出すのと同じほどの難事なのだ。"
  "translation_status": "reviewed"
- "id": "tub-section-01-003"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    “—Evadere ad auras,
     Hoc opus, hic labor est.” [59]
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 68
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/blockquote[1]/p[1]"
  "translation_ja": |-
    「――大気の中へ逃れ出ること、
    これこそ大事業、これこそ苦労なのだ。」[59]
  "translation_status": "reviewed"
- "id": "tub-section-01-004"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "To this end the philosopher’s way in all ages has been by erecting certain edifices in the air; but whatever practice and reputation these kind of structures have formerly possessed, or may still continue in, not excepting even that of Socrates when he was suspended in a basket to help contemplation, I think, with due submission, they seem to labour under two inconveniences. First, that the foundations being laid too high, they have been often out of sight and ever out of hearing. Secondly, that the materials being very transitory, have suffered much from inclemencies of air, especially in these north-west regions."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 69
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[69]"
  "translation_ja": "この目的のため、どの時代の哲学者も、空中にある種の建物を築くという方法を用いてきた。しかし、こうした構造物が昔どれほど使われ、名声を得ていたにせよ、今なおそうであるにせよ、思索の助けにと籠に入って吊るされたソクラテスの例までも含め、恐れながら、二つの不都合があると思われる。第一に、土台を高い所に置きすぎたため、しばしば姿が見えず、声にいたっては一度も聞こえなかった。第二に、材料があまりにはかないので、天候の厳しさ、とりわけ、ここ北西地方の気候で、ひどく傷んでしまったのである。"
  "translation_status": "reviewed"
- "id": "tub-section-01-005"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Therefore, towards the just performance of this great work there remain but three methods that I can think on; whereof the wisdom of our ancestors being highly sensible, has, to encourage all aspiring adventures, thought fit to erect three wooden machines for the use of those orators who desire to talk much without interruption. These are the Pulpit, the Ladder, and the Stage-itinerant. For as to the Bar, though it be compounded of the same matter and designed for the same use, it cannot, however, be well allowed the honour of a fourth, by reason of its level or inferior situation exposing it to perpetual interruption from collaterals. Neither can the Bench itself, though raised to a proper eminency, put in a better claim, whatever its advocates insist on. For if they please to look into the original design of its erection, and the circumstances or adjuncts subservient to that design, they will soon acknowledge the present practice exactly correspondent to the primitive institution, and both to answer the etymology of the name, which in the Phoenician tongue is a word of great signification, importing, if literally interpreted, “The place of sleep,” but in common acceptation, “A seat well bolstered and cushioned, for the repose of old and gouty limbs;” senes ut in otia tuta recedant [60]. Fortune being indebted to them this part of retaliation, that as formerly they have long talked whilst others slept, so now they may sleep as long whilst others talk."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 70
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[70]"
  "translation_ja": "そこで、この大事業を適切に成し遂げる方法として、思いつくものは三つしか残らない。このことを十分に心得ていた賢い御先祖たちは、上を目指すあらゆる冒険家を励まそうと、三つの木造機械を建てた。邪魔をされずに大いにしゃべりたい雄弁家のためである。すなわち、説教壇、梯子、巡回芝居の舞台である。法廷の弁護士席も、同じ材料ででき、同じ用途のために設けられてはいる。しかし、同じ高さか、それより下の場所にあるため、横合いから絶えず口を挟まれてしまうので、第四の栄誉にあずからせるわけにはいかない。裁判官席も、適度の高みに設けられているとはいえ、その擁護者が何と言おうと、これよりましな資格は主張できない。設置の本来の目的と、その目的を助ける事情や付属物をお調べになれば、現在の使われ方が当初の制度にぴたりと合い、両者とも、その名の語源にかなっていると、すぐに認めるだろうからだ。フェニキア語において、その名は深い意味を持ち、直訳すれば「眠りの場所」、通俗的にいえば「老いて痛風を患う手足を休めるため、詰め物と座布団を十分にあてがった椅子」を意味する。「老人たちが安らかな休息へ退けるように」[60]である。かつて、ほかの者が眠る間、彼らは長々としゃべっていた。だから今は、ほかの者がしゃべる間、同じだけ眠ってよい。それくらいの埋め合わせを、運命も彼らに負っているのである。"
  "translation_status": "reviewed"
- "id": "tub-section-01-006"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But if no other argument could occur to exclude the Bench and the Bar from the list of oratorical machines, it were sufficient that the admission of them would overthrow a number which I was resolved to establish, whatever argument it might cost me; in imitation of that prudent method observed by many other philosophers and great clerks, whose chief art in division has been to grow fond of some proper mystical number, which their imaginations have rendered sacred to a degree that they force common reason to find room for it in every part of Nature, reducing, including, and adjusting, every genus and species within that compass by coupling some against their wills and banishing others at any rate. Now, among all the rest, the profound number THREE [61] is that which has most employed my sublimest speculations, nor ever without wonderful delight. There is now in the press, and will be published next term, a panegyrical essay of mine upon this number, wherein I have, by most convincing proofs, not only reduced the senses and the elements under its banner, but brought over several deserters from its two great rivals, SEVEN and NINE."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 71
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[71]"
  "translation_ja": "しかし、裁判官席と弁護士席を雄弁機械の一覧から外すため、ほかに理由が見つからなかったとしても、これだけで十分だったろう。両者を加えると、どれほど理屈を費やしてでも打ち立てようと決めていた数が、崩れてしまうのである。私はここで、多くの哲学者や大学者が守ってきた、賢明な方法にならっている。彼らの分類の主要な技は、手頃な神秘の数に惚れ込むことだった。想像のうちでその数を神聖にするあまり、常識に無理を強いて、自然界のどの部分にも、その数の入る余地を作らせる。嫌がるもの同士を組ませ、ほかのものは何としても追放し、あらゆる類と種を、その枠に収め、取り込み、調整するのである。さて、数ある中でも、深遠なる三[61]こそ、私の最も崇高な思索が一番多く捧げられた数であり、そのたびに、驚くほどの喜びをもたらしてくれた。今、印刷中で、次の学期に刊行されるのは、この数をたたえる私の試論である。そこで私は、最も説得力のある証拠により、感覚と元素をその旗の下へ収めるばかりか、二大競争相手である七と九の陣営からも、何人かの脱走者を引き入れている。"
  "translation_status": "reviewed"
- "id": "tub-section-01-007"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now, the first of these oratorical machines, in place as well as dignity, is the Pulpit. Of pulpits there are in this island several sorts, but I esteem only that made of timber from the Sylva Caledonia, which agrees very well with our climate. If it be upon its decay, it is the better, both for conveyance of sound and for other reasons to be mentioned by and by. The degree of perfection in shape and size I take to consist in being extremely narrow, with little ornament, and, best of all, without a cover; for, by ancient rule, it ought to be the only uncovered vessel in every assembly where it is rightfully used, by which means, from its near resemblance to a pillory, it will ever have a mighty influence on human ears."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 72
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[72]"
  "translation_ja": "さて、この雄弁機械のうち、位置においても威厳においても第一なのは、説教壇である。この島にはさまざまな説教壇があるが、私が尊ぶのは、カレドニアの森の木材で作られたものだけだ。わが国の気候によく合っている。腐りかけていれば、なおよい。音を伝えるためにも、追って述べるほかの理由からも、そうなのである。形と大きさの完成というものは、極端に狭く、飾りが少なく、何より屋根がないことにあると、私は考える。古来の規則によれば、説教壇が正当に使われる集まりでは、これだけが蓋のない器でなければならないからだ。そのおかげで、さらし台によく似た姿となり、いつでも人間の耳に強力な影響を及ぼすのである。"
  "translation_status": "reviewed"
- "id": "tub-section-01-008"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Of Ladders I need say nothing. It is observed by foreigners themselves, to the honour of our country, that we excel all nations in our practice and understanding of this machine. The ascending orators do not only oblige their audience in the agreeable delivery, but the whole world in their early publication of their speeches, which I look upon as the choicest treasury of our British eloquence, and whereof I am informed that worthy citizen and bookseller, Mr. John Dunton, has made a faithful and a painful collection, which he shortly designs to publish in twelve volumes in folio, illustrated with copper-plates,—a work highly useful and curious, and altogether worthy of such a hand."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 73
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[73]"
  "translation_ja": "梯子については、何も言う必要はない。わが国の誉れとなることに、外国人自身も、この機械の使い方と理解において、われわれがあらゆる国民に勝ると認めている。その上へ昇る雄弁家は、好ましい語り口で聴衆を喜ばせるばかりか、演説をいち早く刊行して、世界全体をも喜ばせる。私はそれを、ブリテンの雄弁の最上の宝庫とみなしている。聞くところでは、立派な市民にして書店主であるジョン・ダントン氏が、忠実に、骨を折って、これらを集めたそうだ。近く、銅版画入りの二折本十二巻として刊行するつもりだという。きわめて有用で珍しい仕事であり、まさしく、かの人の手にふさわしい。"
  "translation_status": "reviewed"
- "id": "tub-section-01-009"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The last engine of orators is the Stage-itinerant, erected with much sagacity, sub Jove pluvio, in triviis et quadriviis. [62a] It is the great seminary of the two former, and its orators are sometimes preferred to the one and sometimes to the other, in proportion to their deservings, there being a strict and perpetual intercourse between all three."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 74
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[74]"
  "translation_ja": "雄弁家の最後の装置は、巡回芝居の舞台である。たいへん抜け目なく、「雨降る空の下、三つ辻や四つ辻に」[62a]建てられる。これは前二者に人材を送る大養成所であり、その雄弁家は、功績の程度に応じて、あるときはこちらへ、あるときはあちらへと出世する。三者の間には、緊密で絶え間ない交流があるのだ。"
  "translation_status": "reviewed"
- "id": "tub-section-01-010"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "From this accurate deduction it is manifest that for obtaining attention in public there is of necessity required a superior position of place. But although this point be generally granted, yet the cause is little agreed in; and it seems to me that very few philosophers have fallen into a true natural solution of this phenomenon. The deepest account, and the most fairly digested of any I have yet met with is this, that air being a heavy body, and therefore, according to the system of Epicurus [62b], continually descending, must needs be more so when laden and pressed down by words, which are also bodies of much weight and gravity, as is manifest from those deep impressions they make and leave upon us, and therefore must be delivered from a due altitude, or else they will neither carry a good aim nor fall down with a sufficient force."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 75
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[75]"
  "translation_ja": "この精密な推論から、人前で注目を得るには、場所の高い位置がどうしても必要だと明らかになる。しかし、この点は一般に認められても、その原因については意見があまり一致していない。この現象を自然の真の仕組みから説明できた哲学者は、ごく少ないと思われる。私がこれまで出会ったうち、最も深く、最もよく整理された説明は、次のようなものだ。空気は重い物体であり、したがって、エピクロスの体系[62b]に従えば、絶えず下降している。言葉を積み込み、その重みで押し下げられれば、下降はいっそう強まるはずだ。言葉もまた、重みと厳粛さに富む物体である。われわれの心を深く打ち、その跡を残すことからも、それは明らかだ。だから、言葉はしかるべき高さから発しなければならない。さもなければ、狙いが定まらず、落下の力も足りなくなる。"
  "translation_status": "reviewed"
- "id": "tub-section-01-011"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    “Corpoream quoque enim vocem constare fatendum est,
     Et sonitum, quoniam possunt impellere sensus.”
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 76
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/blockquote[2]/p[1]"
  "translation_ja": |-
    「声も音も、物体から成ると認めねばならない。
    感覚を揺り動かすことができるのだから。」
  "translation_status": "reviewed"
- "id": "tub-section-01-012"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "—Lucr. lib. 4. [62c]"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 77
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/blockquote[2]/p[2]"
  "translation_ja": "――ルクレティウス、第4巻。[62c]"
  "translation_status": "reviewed"
- "id": "tub-section-01-013"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And I am the readier to favour this conjecture from a common observation, that in the several assemblies of these orators Nature itself has instructed the hearers to stand with their mouths open and erected parallel to the horizon, so as they may be intersected by a perpendicular line from the zenith to the centre of the earth. In which position, if the audience be well compact, every one carries home a share, and little or nothing is lost."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 78
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[76]"
  "translation_ja": "私がこの推測をいっそう支持したくなるのは、よく見られる光景のためでもある。こうした雄弁家のさまざまな集まりでは、自然そのものが聴衆に教え、口を開け、それを地平線と平行になるよう上向きに構えて立たせている。天頂から地球の中心へ引いた垂直線が、口を貫くように、というわけだ。この姿勢で聴衆がぎっしり詰まっていれば、誰もが一人分の取り分を持ち帰り、失われるものはほとんどないか、まったくない。"
  "translation_status": "reviewed"
- "id": "tub-section-01-014"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I confess there is something yet more refined in the contrivance and structure of our modern theatres. For, first, the pit is sunk below the stage with due regard to the institution above deduced, that whatever weighty matter shall be delivered thence, whether it be lead or gold, may fall plump into the jaws of certain critics, as I think they are called, which stand ready open to devour them. Then the boxes are built round and raised to a level with the scene, in deference to the ladies, because that large portion of wit laid out in raising pruriences and protuberances is observed to run much upon a line, and ever in a circle. The whining passions and little starved conceits are gently wafted up by their own extreme levity to the middle region, and there fix and are frozen by the frigid understandings of the inhabitants. Bombast and buffoonery, by nature lofty and light, soar highest of all, and would be lost in the roof if the prudent architect had not, with much foresight, contrived for them a fourth place, called the twelve-penny gallery, and there planted a suitable colony, who greedily intercept them in their passage."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 79
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[77]"
  "translation_ja": "もっとも、近代の劇場の設計と構造には、さらに洗練された何かがあることは認めよう。まず平土間は、舞台より低く掘り下げられている。これは今導き出した制度を、正しく重んじたものだ。舞台からどんな重い材料が投じられても、鉛であれ金であれ、批評家とか呼ばれる連中の顎へ、どさりと落ちるようになっている。彼らはそれを食らおうと、口を開けて待ち構えている。次に桟敷席は、御婦人方への敬意から、舞台と同じ高さまで上げ、周囲にぐるりと設けてある。むらむらした欲望や膨らみを生じさせるために費やされる、大きな部分の機知は、ほぼ水平に、しかもいつも円を描いて走る、と観察されているからだ。めそめそした情念や、痩せこけた小さな思いつきは、自らの極端な軽さによって、ふわりと中間の空域へ運ばれ、そこに住む者の冷たい理解力に捕まり、凍りつく。大げさな空言と道化じみた悪ふざけは、生来、気高く軽いので、何よりも高く舞い上がる。もし賢明な建築家が、先を見越して第四の場所、いわゆる十二ペンスの天井桟敷を設け、そこへふさわしい入植者たちを置かなかったら、屋根の中へ消え失せていただろう。彼らは途中で、貪欲にそれらを受け止めてくれるのである。"
  "translation_status": "reviewed"
- "id": "tub-section-01-015"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now this physico-logical scheme of oratorical receptacles or machines contains a great mystery, being a type, a sign, an emblem, a shadow, a symbol, bearing analogy to the spacious commonwealth of writers and to those methods by which they must exalt themselves to a certain eminency above the inferior world. By the Pulpit are adumbrated the writings of our modern saints in Great Britain, as they have spiritualised and refined them from the dross and grossness of sense and human reason. The matter, as we have said, is of rotten wood, and that upon two considerations: because it is the quality of rotten wood to light in the dark; and secondly, because its cavities are full of worms—which is a type with a pair of handles, having a respect to the two principal qualifications of the orator and the two different fates attending upon his works. [63]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 80
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[78]"
  "translation_ja": "さて、この雄弁の容器、あるいは機械についての自然学的・論理学的図式には、大いなる神秘が含まれる。広大な著述家の共和国と、その住人が下界の者たちよりいくらか高く身を上げる方法を映す、型であり、しるしであり、表象であり、影であり、象徴なのだ。説教壇がほのめかすのは、近代ブリテンの聖者たちの著作である。彼らはそれを霊化し、洗練し、感覚や人間の理性という滓や粗雑さから清めた。材料が腐った木であることは、すでに述べたが、その理由は二つある。第一に、腐った木には暗闇で光る性質がある。第二に、その空洞には虫が詰まっている。この比喩には、二つの取っ手がついている。雄弁家の二つの主な資質と、その著作を待ち受ける二つの異なる運命の、両方に関わるのである[63]。"
  "translation_status": "reviewed"
- "id": "tub-section-01-016"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The Ladder is an adequate symbol of faction and of poetry, to both of which so noble a number of authors are indebted for their fame. Of faction, because . . . (Hiatus in MS.) . . . Of poetry, because its orators do perorare with a song; and because, climbing up by slow degrees, fate is sure to turn them off before they can reach within many steps of the top; and because it is a preferment attained by transferring of propriety and a confounding of meum and tuum."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 81
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[79]"
  "translation_ja": "梯子は、党派争いと詩を表す、申し分のない象徴である。いかに多くの立派な著述家が、この両者に名声を負っていることか。党派争いを表すのは、なぜなら……〔原稿に欠落〕……。詩を表すのは、その雄弁家が歌で締めくくるからであり、ゆっくり一段ずつ登るうちに、頂上へ何段も残したところで、運命にきっと蹴落とされるからであり、所有権を移し、「私のもの」と「あなたのもの」を混同することで手に入れる出世だからである。"
  "translation_status": "reviewed"
- "id": "tub-section-01-017"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Under the Stage-itinerant are couched those productions designed for the pleasure and delight of mortal man, such as “Six Pennyworth of Wit,” “Westminster Drolleries,” “Delightful Tales,” “Complete Jesters,” and the like, by which the writers of and for Grub Street have in these later ages so nobly triumphed over time, have clipped his wings, pared his nails, filed his teeth, turned back his hour-glass, blunted his scythe, and drawn the hobnails out of his shoes. It is under this class I have presumed to list my present treatise, being just come from having the honour conferred upon me to be adopted a member of that illustrious fraternity."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 82
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[80]"
  "translation_ja": "巡回芝居の舞台に包まれているのは、はかない人間の楽しみや喜びのために書かれた作品である。『六ペンス分の機知』『ウェストミンスター滑稽集』『愉快な物語』『完璧な笑い話集』などの類だ。近頃の時代、グラブ・ストリートで、またそこへ向けて書く著述家たちは、これらによって、実に見事に時を打ち負かしてきた。その翼を切り、爪を削り、歯に鑢をかけ、砂時計をひっくり返し、鎌を鈍らせ、靴底の鋲まで抜き取ってしまった。私もつい先ほど、この輝かしい同胞団の一員として迎えられる栄誉を受けたばかりなので、恐れながら、本論考をこの部類へ登録させていただいた。"
  "translation_status": "reviewed"
- "id": "tub-section-01-018"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now, I am not unaware how the productions of the Grub Street brotherhood have of late years fallen under many prejudices, nor how it has been the perpetual employment of two junior start-up societies to ridicule them and their authors as unworthy their established post in the commonwealth of wit and learning. Their own consciences will easily inform them whom I mean; nor has the world been so negligent a looker-on as not to observe the continual efforts made by the societies of Gresham and of Will’s [64], to edify a name and reputation upon the ruin of ours. And this is yet a more feeling grief to us, upon the regards of tenderness as well as of justice, when we reflect on their proceedings not only as unjust, but as ungrateful, undutiful, and unnatural. For how can it be forgot by the world or themselves, to say nothing of our own records, which are full and clear in the point, that they both are seminaries, not only of our planting, but our watering too. I am informed our two rivals have lately made an offer to enter into the lists with united forces and challenge us to a comparison of books, both as to weight and number. In return to which, with license from our president, I humbly offer two answers. First, we say the proposal is like that which Archimedes made upon a smaller affair [65a], including an impossibility in the practice; for where can they find scales of capacity enough for the first, or an arithmetician of capacity enough for the second. Secondly, we are ready to accept the challenge, but with this condition, that a third indifferent person be assigned, to whose impartial judgment it shall be left to decide which society each book, treatise, or pamphlet do most properly belong to. This point, God knows, is very far from being fixed at present, for we are ready to produce a catalogue of some thousands which in all common justice ought to be entitled to our fraternity, but by the revolted and newfangled writers most perfidiously ascribed to the others. Upon all which we think it very unbecoming our prudence that the determination should be remitted to the authors themselves, when our adversaries by briguing and caballing have caused so universal a defection from us, that the greatest part of our society has already deserted to them, and our nearest friends begin to stand aloof, as if they were half ashamed to own us."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 83
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[81]"
  "translation_ja": "近年、グラブ・ストリート同胞団の作品が、数々の偏見を浴びていることを、私は知らぬわけではない。また、新参の成り上がりの二団体が、才知と学問の共和国における既成の地位にふさわしくないとして、私どもの作品と著者を嘲ることに、明けても暮れても励んでいることも、承知している。誰のことかは、彼ら自身の良心が、すぐに教えてくれるだろう。世間も、それほどぼんやり見物していたわけではないから、グレシャムの団体とウィルズの団体[64]が、私どもの破滅の上に自らの名声と評判を築こうと、絶えず努めていることには気づいている。しかも、彼らの仕打ちを、不公正なばかりか、恩知らずで、親不孝で、人の道に背くものと考えると、この悲しみはいっそう身にしみる。公正の問題だけでなく、愛情の問題でもあるからだ。この点を十分かつ明白に記す私どもの記録はさておいても、彼らの二つの養成所は、どちらも私どもが植え、しかも水までやって育てたものなのだ。そのことを、世間も彼ら自身も、どうして忘れられよう。聞けば、この二つの競争相手は最近、力を合わせて競技場へ入り、本の重量と冊数を比べようと、私どもに挑戦する案を出したらしい。これに対して、会長のお許しを得て、つつしんで二つの返答を申し上げる。第一に、この提案は、アルキメデスがもっと小さな問題で行った提案[65a]と同じで、実行不可能な条件を含んでいる。前者を量れるほど大きな秤、後者を数えられるほど能力のある算術家を、どこで見つけるというのか。第二に、挑戦は受けて立つ。ただし中立の第三者を指名し、どの本、論考、パンフレットが、どちらの団体に属するのが最もふさわしいか、その公平な判断に委ねることを条件とする。神も御存じのとおり、この点は今、まるで定まっていない。ごく当たり前の公正に従えば、当然わが同胞団のものとされるべき数千の作品の目録を、私どもはいつでも示せる。それなのに、離反した新奇好みの著述家どもが、実に不実にも、それらをほかの団体のものとしているのである。こうしたことをすべて考えれば、その判定を著者自身に任せるのは、私どもの賢明さに、まことに似つかわしくない。敵方は、票集めと徒党によって、これほど全面的な離反を引き起こしたので、わが団体の大部分はすでに向こうへ脱走し、一番親しい友人たちまで、私どもとのつながりを認めるのを半ば恥じるかのように、距離を置き始めているのだ。"
  "translation_status": "reviewed"
- "id": "tub-section-01-019"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This is the utmost I am authorised to say upon so ungrateful and melancholy a subject, because we are extremely unwilling to inflame a controversy whose continuance may be so fatal to the interests of us all, desiring much rather that things be amicably composed; and we shall so far advance on our side as to be ready to receive the two prodigals with open arms whenever they shall think fit to return from their husks and their harlots, which I think, from the present course of their studies [65b], they most properly may be said to be engaged in, and, like an indulgent parent, continue to them our affection and our blessing."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 84
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[82]"
  "translation_ja": "これほど恩知らずで、気の滅入る問題について、私が発言を許されているのは、ここまでである。論争を続ければ、われわれ全員の利益にとって致命的になりかねず、これを煽ることを、私どもはひどく嫌っている。むしろ円満に収めたいと願っているのだ。こちらとしては、この二人の放蕩息子が、豚の食う莢と売春婦のもとから戻る気になったら、いつでも両腕を広げて迎えるところまで、譲歩する用意がある。彼らの今の研究のありさま[65b]を見れば、まさにそうしたものに関わっていると言ってよいだろう。そして、寛大な親のように、変わらぬ愛情と祝福を与え続けたいのである。"
  "translation_status": "reviewed"
- "id": "tub-section-01-020"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But the greatest maim given to that general reception which the writings of our society have formerly received, next to the transitory state of all sublunary things, has been a superficial vein among many readers of the present age, who will by no means be persuaded to inspect beyond the surface and the rind of things; whereas wisdom is a fox, who, after long hunting, will at last cost you the pains to dig out. It is a cheese which, by how much the richer, has the thicker, the homelier, and the coarser coat, and whereof to a judicious palate the maggots are the best. It is a sack-posset, wherein the deeper you go you will find it the sweeter. Wisdom is a hen whose cackling we must value and consider, because it is attended with an egg. But then, lastly, it is a nut, which, unless you choose with judgment, may cost you a tooth, and pay you with nothing but a worm. In consequence of these momentous truths, the Grubæan sages have always chosen to convey their precepts and their arts shut up within the vehicles of types and fables; which having been perhaps more careful and curious in adorning than was altogether necessary, it has fared with these vehicles after the usual fate of coaches over-finely painted and gilt, that the transitory gazers have so dazzled their eyes and filled their imaginations with the outward lustre, as neither to regard nor consider the person or the parts of the owner within. A misfortune we undergo with somewhat less reluctancy, because it has been common to us with Pythagoras, Æsop, Socrates, and other of our predecessors."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 85
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[83]"
  "translation_ja": "しかし、わが団体の著作が、かつてのように広く受け入れられることを最も大きく損なったのは、月の下の万物が移ろう運命にあることを別とすれば、当代の多くの読者に見られる、うわべだけで済ませる気風である。彼らは、物事の表面や皮の向こうをのぞくよう、どうしても説得できない。ところが知恵とは狐であり、長々と追い回したあげく、最後には穴から掘り出す手間をかけさせる。チーズでもある。中身が豊かであるほど、皮は厚く、見栄えがせず、粗いものになる。そして、味のわかる舌にとっては、その蛆こそが最上なのだ。知恵はまた、甘い酒を加えた乳の飲み物であり、底へ行くほど甘くなる。知恵は雌鶏でもある。その鳴き声は、重んじ、よく考えなければならない。卵を伴っているからである。だが最後に、知恵は木の実だ。慎重に選ばなければ、歯を一本失ったうえ、虫しか得られないかもしれない。こうした重大な真理に従い、グラブ街の賢者たちは昔から、教えや技を、比喩や寓話という乗り物の中に閉じ込めて運んできた。その乗り物を飾るのに、必要以上の気配りや凝り方をしたのかもしれない。おかげで、あまりに見事な塗装や金箔を施した馬車と同じ、ありふれた運命に見舞われた。通りすがりの見物人は、外の輝きに目をくらまされ、想像力をいっぱいにして、中にいる持ち主の姿や才には、注意も考慮も払わないのである。とはいえ、この不運は、ピュタゴラス、アイソポス、ソクラテスその他の先達とも共有しているので、いくらかは我慢しやすい。"
  "translation_status": "reviewed"
- "id": "tub-section-01-021"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "However, that neither the world nor ourselves may any longer suffer by such misunderstandings, I have been prevailed on, after much importunity from my friends, to travail in a complete and laborious dissertation upon the prime productions of our society, which, besides their beautiful externals for the gratification of superficial readers, have darkly and deeply couched under them the most finished and refined systems of all sciences and arts, as I do not doubt to lay open by untwisting or unwinding, and either to draw up by exantlation or display by incision."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 86
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[84]"
  "translation_ja": "しかし、世間も私どもも、このような誤解でこれ以上損なわれぬように、友人たちのたび重なる懇願に押され、私は、わが団体の主要な作品について、完全で労作に富む論文を書くことになった。これらの作品は、浅薄な読者を喜ばせる美しい外観のほかに、その下へ、あらゆる学芸の最も完成され、洗練された体系を、暗く深く隠し持っている。私は、ねじれを解き、巻きをほどき、汲み上げて引き出すか、切開して見せるかして、必ずやそれを明らかにできると思っている。"
  "translation_status": "reviewed"
- "id": "tub-section-01-022"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This great work was entered upon some years ago by one of our most eminent members. He began with the “History of Reynard the Fox,” but neither lived to publish his essay nor to proceed farther in so useful an attempt, which is very much to be lamented, because the discovery he made and communicated to his friends is now universally received; nor do I think any of the learned will dispute that famous treatise to be a complete body of civil knowledge, and the revelation, or rather the apocalypse, of all state arcana. But the progress I have made is much greater, having already finished my annotations upon several dozens from some of which I shall impart a few hints to the candid reader, as far as will be necessary to the conclusion at which I aim."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 87
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[85]"
  "translation_ja": "この大事業には、数年前、わが団体でも指折りの一員が着手した。『狐のルナールの物語』から始めたのだが、試論を刊行するまで生きられず、それほど有用な試みを、それ以上進めることもできなかった。まことに惜しいことである。彼が発見して友人たちに伝えたことは、今や普遍的に受け入れられているからだ。その名高い論考が、政治知識の完全な体系であり、国家のあらゆる秘事の開示、いや、黙示録であることを、学者なら誰も争うまいと思う。だが、私の進捗ははるかに大きい。すでに何十もの作品への注釈を完成させている。そのいくつかから、目指す結論に必要なかぎり、二、三の手がかりを、公平な読者にお伝えしよう。"
  "translation_status": "reviewed"
- "id": "tub-section-01-023"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The first piece I have handled is that of “Tom Thumb,” whose author was a Pythagorean philosopher. This dark treatise contains the whole scheme of the metempsychosis, deducing the progress of the soul through all her stages."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 88
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[86]"
  "translation_ja": "最初に扱ったのは『親指トム』である。その著者はピュタゴラス派の哲学者だった。この難解な論考は、輪廻転生の体系全体を含み、魂があらゆる段階を巡る道筋をたどっている。"
  "translation_status": "reviewed"
- "id": "tub-section-01-024"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The next is “Dr. Faustus,” penned by Artephius, an author bonæ notæ and an adeptus; he published it in the nine hundred and eighty-fourth year [67a] of his age; this writer proceeds wholly by reincrudation, or in the via humida; and the marriage between Faustus and Helen does most conspicuously dilucidate the fermenting of the male and female dragon."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 89
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[87]"
  "translation_ja": "次は『ファウスト博士』で、名の知られた著者にして秘術の達人アルテフィウスが書いたものだ。九百八十四歳のときに刊行した[67a]。この著者は、もっぱら原初の状態へ戻す方法、すなわち湿式の道に従っている。ファウストとヘレネの結婚は、雄と雌の竜の発酵を、きわめて鮮やかに解き明かしている。"
  "translation_status": "reviewed"
- "id": "tub-section-01-025"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "“Whittington and his Cat” is the work of that mysterious Rabbi, Jehuda Hannasi, containing a defence of the Gemara of the Jerusalem Misna, and its just preference to that of Babylon, contrary to the vulgar opinion."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 90
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[88]"
  "translation_ja": "『ウィッティントンとその猫』は、神秘のラビ、イェフダ・ハンナシの著作である。エルサレムのミシュナに対するゲマラの弁護を含み、世間の通念に反して、バビロンのものより正当に優先されることを論じている。"
  "translation_status": "reviewed"
- "id": "tub-section-01-026"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "“The Hind and Panther.” This is the masterpiece of a famous writer now living [67b], intended for a complete abstract of sixteen thousand schoolmen from Scotus to Bellarmine."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 91
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[89]"
  "translation_ja": "『牝鹿と豹』。これは、現在存命の有名な著述家の傑作であり[67b]、スコトゥスからベラルミーノまで、一万六千人のスコラ学者を完全に要約することを目指している。"
  "translation_status": "reviewed"
- "id": "tub-section-01-027"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "“Tommy Potts.” Another piece, supposed by the same hand, by way of supplement to the former."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 92
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[90]"
  "translation_ja": "『トミー・ポッツ』。同じ著者の手になるとされる、別の一作で、前の作品の補遺にあたる。"
  "translation_status": "reviewed"
- "id": "tub-section-01-028"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The “Wise Men of Gotham,” cum Appendice. This is a treatise of immense erudition, being the great original and fountain of those arguments bandied about both in France and England, for a just defence of modern learning and wit, against the presumption, the pride, and the ignorance of the ancients. This unknown author hath so exhausted the subject, that a penetrating reader will easily discover whatever has been written since upon that dispute to be little more than repetition. An abstract of this treatise has been lately published by a worthy member of our society."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 93
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[91]"
  "translation_ja": "『ゴータムの賢人たち』、付録つき。これは莫大な学識を備えた論考であり、フランスとイングランドの両国で、古代人の思い上がり、高慢、無知に対抗し、近代の学識と才知を正当に擁護するために飛び交っている議論の、大いなる原典にして源泉である。この無名の著者が主題をすっかり論じ尽くしたので、洞察の鋭い読者なら、その後この論争について書かれたものは何であれ、ほとんど繰り返しにすぎないと、容易に見抜くだろう。わが団体の立派な一員が、最近この論考の摘要を刊行した。"
  "translation_status": "reviewed"
- "id": "tub-section-01-029"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These notices may serve to give the learned reader an idea as well as a taste of what the whole work is likely to produce, wherein I have now altogether circumscribed my thoughts and my studies; and if I can bring it to a perfection before I die, shall reckon I have well employed the poor remains of an unfortunate life. This indeed is more than I can justly expect from a quill worn to the pith in the service of the State, in pros and cons upon Popish Plots, and Meal Tubs, and Exclusion Bills, and Passive Obedience, and Addresses of Lives and Fortunes; and Prerogative, and Property, and Liberty of Conscience, and Letters to a Friend: from an understanding and a conscience, threadbare and ragged with perpetual turning; from a head broken in a hundred places by the malignants of the opposite factions, and from a body spent with poxes ill cured, by trusting to bawds and surgeons, who (as it afterwards appeared) were professed enemies to me and the Government, and revenged their party’s quarrel upon my nose and shins. Fourscore and eleven pamphlets have I written under three reigns, and for the service of six-and-thirty factions. But finding the State has no farther occasion for me and my ink, I retire willingly to draw it out into speculations more becoming a philosopher, having, to my unspeakable comfort, passed a long life with a conscience void of offence towards God and towards men."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 94
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[92]"
  "translation_ja": "これらの紹介によって、学識ある読者には、この大著全体がどんなものを生み出すか、その見当と味わいをつかんでいただけよう。今では私の思考も研究も、すべてこの仕事の内に収まっている。死ぬ前に完成できれば、不幸な人生の乏しい余生を、よく役立てたと考えるつもりだ。だが実際には、それは正当に期待できる以上のことなのである。国家への奉仕に、教皇派陰謀事件、小麦粉桶事件、王位継承排除法案、無抵抗服従、生命財産を捧げる上奏文、国王大権、財産権、信仰の自由、友人への書簡といった題目について、賛成と反対を論じ続け、私の羽根ペンは芯まで擦り切れている。知性も良心も、絶えず裏返しにされて、ぼろぼろにほころびた。頭は、敵対する各党派の悪党から、百か所も打ち破られた。体は、治り損ねた梅毒の数々で疲れ果てた。取り持ち婆や外科医を信用したためだが、後でわかったところでは、連中は私と政府に公然と敵対する者たちで、自分の党派の恨みを、私の鼻と脛に晴らしたのだった。三代の治世にわたり、三十六の党派に奉仕して、私は九十一のパンフレットを書いた。しかし、国家はもう私と私のインクを必要としていないとわかったので、喜んで身を引き、残りを、もっと哲学者にふさわしい思索に注ごうと思う。神にも人にもやましいところのない良心とともに、長い人生を送ってきたことは、言葉に尽くせぬ慰めである。"
  "translation_status": "reviewed"
- "id": "tub-section-01-030"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But to return. I am assured from the reader’s candour that the brief specimen I have given will easily clear all the rest of our society’s productions from an aspersion grown, as it is manifest, out of envy and ignorance, that they are of little farther use or value to mankind beyond the common entertainments of their wit and their style; for these I am sure have never yet been disputed by our keenest adversaries; in both which, as well as the more profound and most mystical part, I have throughout this treatise closely followed the most applauded originals. And to render all complete I have with much thought and application of mind so ordered that the chief title prefixed to it (I mean that under which I design it shall pass in the common conversation of court and town) is modelled exactly after the manner peculiar to our society."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 95
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[93]"
  "translation_ja": "さて、話を戻そう。読者の公平さを信頼しているので、今お示しした短い見本によって、わが団体のほかの作品もすべて、中傷から容易に救われると確信する。その中傷とは、これらの作品は、機知や文体のありふれた楽しみ以上には、人類にほとんど役立ちもせず、価値もないというものだ。明らかに、妬みと無知から生まれた非難である。機知と文体そのものについては、最も手厳しい敵でさえ、これまで争ったことはないはずだ。私は本論考の全体で、その両面においても、より深遠で、最も神秘的な部分においても、最も評判の高い手本に、忠実にならってきた。さらに、すべてを完全にするため、深く考え、心を尽くして、冒頭に掲げた主な表題も、わが団体に固有のやり方へ正確に倣わせた。ここでいう表題とは、宮廷や都の普段の会話で通用させるつもりの名のことである。"
  "translation_status": "reviewed"
- "id": "tub-section-01-031"
  "section_id": "section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I confess to have been somewhat liberal in the business of titles [69a], having observed the humour of multiplying them, to bear great vogue among certain writers, whom I exceedingly reverence. And indeed it seems not unreasonable that books, the children of the brain, should have the honour to be christened with variety of names, as well as other infants of quality. Our famous Dryden has ventured to proceed a point farther, endeavouring to introduce also a multiplicity of godfathers [69b], which is an improvement of much more advantage, upon a very obvious account. It is a pity this admirable invention has not been better cultivated, so as to grow by this time into general imitation, when such an authority serves it for a precedent. Nor have my endeavours been wanting to second so useful an example, but it seems there is an unhappy expense usually annexed to the calling of a godfather, which was clearly out of my head, as it is very reasonable to believe. Where the pinch lay, I cannot certainly affirm; but having employed a world of thoughts and pains to split my treatise into forty sections, and having entreated forty Lords of my acquaintance that they would do me the honour to stand, they all made it matter of conscience, and sent me their excuses."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 96
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[94]"
  "translation_ja": "表題については、いくらか気前よくやりすぎたと認めよう[69a]。私がひどく尊敬している、ある種の著述家たちの間で、表題を増やす流儀が大流行していることに気づいたからだ。実際、頭脳の子供である本が、ほかの身分ある赤子と同じように、さまざまな名を授かる栄誉を受けても、不合理ではなさそうだ。かの有名なドライデンは、あえてさらに一歩進み、名付け親まで複数にすることを持ち込もうとした[69b]。これがはるかに有利な改良である理由は、きわめて明白である。このような権威を先例として持ちながら、その見事な発明がもっと育てられず、今頃には広く模倣されるまでになっていないのは惜しい。私も、これほど有用な手本を後押しすべく、努力を惜しまなかった。ところが、名付け親という務めには、ふつう、厄介な出費がつきものらしい。この点は私の頭からすっかり抜けていた。そう信じていただくのも、無理はあるまい。どこが差し障ったのかは、確かなことを言えない。しかし、さんざん考え、骨を折って、論考を四十の節に分け、知り合いの四十人の貴族に、名付け親を務める栄誉をいただきたいとお願いしたところ、全員が良心に関わる問題として、辞退の返事をよこしたのである。"
  "translation_status": "reviewed"
- "id": "tub-section-02-001"
  "section_id": "section-02"
  "kind": "heading"
  "origin": "source"

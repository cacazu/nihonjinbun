  "translation_status": "reviewed"
- "id": "tub-section-05-004"
  "section_id": "section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "To this end I have some time since, with a world of pains and art, dissected the carcass of human nature, and read many useful lectures upon the several parts, both containing and contained, till at last it smelt so strong I could preserve it no longer. Upon which I have been at a great expense to fit up all the bones with exact contexture and in due symmetry, so that I am ready to show a very complete anatomy thereof to all curious gentlemen and others. But not to digress further in the midst of a digression, as I have known some authors enclose digressions in one another like a nest of boxes, I do affirm that, having carefully cut up human nature, I have found a very strange, new, and important discovery: that the public good of mankind is performed by two ways—instruction and diversion. And I have further proved my said several readings (which, perhaps, the world may one day see, if I can prevail on any friend to steal a copy, or on certain gentlemen of my admirers to be very importunate) that, as mankind is now disposed, he receives much greater advantage by being diverted than instructed, his epidemical diseases being fastidiosity, amorphy, and oscitation; whereas, in the present universal empire of wit and learning, there seems but little matter left for instruction. However, in compliance with a lesson of great age and authority, I have attempted carrying the point in all its heights, and accordingly throughout this divine treatise have skilfully kneaded up both together with a layer of utile and a layer of dulce."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 162
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[152]"
  "translation_ja": "この目的のため、少し前、私は、たいへんな労苦と技術を費やして、人間性の死骸を解剖し、その包む部分と包まれる部分、それぞれについて、多くの有益な講義を行った。とうとう臭いがひどくなり、もう保存できなくなった。そこで今度は、大金をかけ、すべての骨を、正確なつながりと、しかるべき釣り合いで組み直した。今では、好奇心ある紳士その他の方々へ、たいへん完全な解剖標本を、いつでもお見せできる。しかし、脱線の最中に、さらに脱線するのはよそう。入れ子の箱のように、脱線の中へ脱線を詰め込む著者も、見たことがあるからだ。私が断言したいのは、注意深く人間性を切り開いた結果、たいへん奇妙で、新しく、重要な発見をした、ということである。人類の公共の幸福を実現する方法は、教えることと楽しませること、この二つなのだ。さらに私は、先に挙げた一連の講義で、こう証明した。その講義は、友人の誰かに写しを盗むよう仕向けるか、私を称賛する紳士方に、しつこく懇願していただければ、いつか世間のお目にかけるかもしれない。さて、今の人間の性向では、教えられるより、楽しませてもらうほうが、はるかに大きな利益を受ける。蔓延している病が、うんざり、締まりのなさ、欠伸だからである。一方、今の才知と学問の普遍的帝国には、教えるために残された材料が、ほとんどないように見える。とはいえ、古く、権威ある教訓に従い、私は、あらゆる最高の形で、両立を成し遂げようと試みた。そこで、この神々しい論考の全体で、有益の層と快楽の層を重ね、両者を巧みに練り合わせたのである。"
  "translation_status": "reviewed"
- "id": "tub-section-05-005"
  "section_id": "section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When I consider how exceedingly our illustrious moderns have eclipsed the weak glimmering lights of the ancients, and turned them out of the road of all fashionable commerce to a degree that our choice town wits of most refined accomplishments are in grave dispute whether there have been ever any ancients or no; in which point we are like to receive wonderful satisfaction from the most useful labours and lucubrations of that worthy modern, Dr. Bentley. I say, when I consider all this, I cannot but bewail that no famous modern hath ever yet attempted an universal system in a small portable volume of all things that are to be known, or believed, or imagined, or practised in life. I am, however, forced to acknowledge that such an enterprise was thought on some time ago by a great philosopher of O-Brazile. The method he proposed was by a certain curious receipt, a nostrum, which after his untimely death I found among his papers, and do here, out of my great affection to the modern learned, present them with it, not doubting it may one day encourage some worthy undertaker."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 163
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[153]"
  "translation_ja": "輝かしい近代人たちが、古代人の弱々しい瞬きを、どれほど見事に覆い隠し、洒落た交際の道から追い払ったことか。最も洗練された素養を持つ、都のえり抜きの才人たちが、そもそも古代人など、本当にいたのか、いなかったのかと、真面目に論争するほどである。この点では、立派な近代人、ベントリー博士の、きわめて有益な労作と夜業から、驚くほど十分な答えが得られそうだ。こうしたことをすべて考えると、私は嘆かずにいられない。人生で知るべきこと、信ずべきこと、想像すべきこと、実践すべきことを、すべて、小さな携帯用の一巻へ収めた普遍的体系を、これまで有名な近代人の誰も試みなかったのは、惜しい。もっとも、少し前、オ・ブラジルの大哲学者が、そういう企てを考えたことは、認めなければならない。その提案した方法は、ある珍しい処方、秘伝の薬によるものだった。彼が早世した後、その書類の中で、私は処方を見つけた。ここで、近代の学者たちへの大いなる愛情から、それをお贈りする。いつか、しかるべき事業家を勇気づけると、疑っていない。"
  "translation_status": "reviewed"
- "id": "tub-section-05-006"
  "section_id": "section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "You take fair correct copies, well bound in calf’s skin and lettered at the back, of all modern bodies of arts and sciences whatsoever, and in what language you please. These you distil in balneo Mariæ, infusing quintessence of poppy Q.S., together with three pints of lethe, to be had from the apothecaries. You cleanse away carefully the sordes and caput mortuum, letting all that is volatile evaporate. You preserve only the first running, which is again to be distilled seventeen times, till what remains will amount to about two drams. This you keep in a glass vial hermetically sealed for one-and-twenty days. Then you begin your catholic treatise, taking every morning fasting (first shaking the vial) three drops of this elixir, snuffing it strongly up your nose. It will dilate itself about the brain (where there is any) in fourteen minutes, and you immediately perceive in your head an infinite number of abstracts, summaries, compendiums, extracts, collections, medullas, excerpta quædams, florilegias and the like, all disposed into great order and reducible upon paper."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 164
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[154]"
  "translation_ja": "近代のあらゆる技芸と学問の体系書を、どの言語でもよいから、きれいで正確な本でそろえる。仔牛革でよく装丁し、背に書名が入ったものがよい。これを湯煎で蒸留し、芥子の精髄を適量、さらに、薬屋で手に入る忘却の水を三パイント加える。汚物と死んだ残滓を注意深く除き、揮発するものはすべて蒸発させる。初めに流れ出る液だけを残し、さらに十七回蒸留して、残りを二ドラムほどにする。それをガラスの小瓶へ入れ、気密に封じて、二十一日置く。それから、あなたの普遍的論考に着手する。毎朝、空腹のまま、まず瓶を振り、この霊薬を三滴、鼻へ強く吸い込む。十四分で、脳の周りへ広がる。脳があれば、の話だが。すると、無限の数の摘要、梗概、便覧、抜粋、集成、精髄、若干の抄録、詞華集などが、整然と並び、そのまま紙へ書き移せる姿で、たちまち頭の中に現れる。"
  "translation_status": "reviewed"
- "id": "tub-section-05-007"
  "section_id": "section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I must needs own it was by the assistance of this arcanum that I, though otherwise impar, have adventured upon so daring an attempt, never achieved or undertaken before but by a certain author called Homer, in whom, though otherwise a person not without some abilities, and for an ancient of a tolerable genius; I have discovered many gross errors which are not to be forgiven his very ashes, if by chance any of them are left. For whereas we are assured he designed his work for a complete body of all knowledge, human, divine, political, and mechanic [102a], it is manifest he hath wholly neglected some, and been very imperfect perfect in the rest. For, first of all, as eminent a cabalist as his disciples would represent him, his account of the opus magnum is extremely poor and deficient; he seems to have read but very superficially either Sendivogus, Behmen, or Anthroposophia Theomagica [102b]. He is also quite mistaken about the sphæra pyroplastica, a neglect not to be atoned for, and (if the reader will admit so severe a censure) vix crederem autorem hunc unquam audivisse ignis vocem. His failings are not less prominent in several parts of the mechanics. For having read his writings with the utmost application usual among modern wits, I could never yet discover the least direction about the structure of that useful instrument a save-all; for want of which, if the moderns had not lent their assistance, we might yet have wandered in the dark. But I have still behind a fault far more notorious to tax this author with; I mean his gross ignorance in the common laws of this realm, and in the doctrine as well as discipline of the Church of England. A defect, indeed, for which both he and all the ancients stand most justly censured by my worthy and ingenious friend Mr. Wotton, Bachelor of Divinity, in his incomparable treatise of ancient and modern learning; a book never to be sufficiently valued, whether we consider the happy turns and flowings of the author’s wit, the great usefulness of his sublime discoveries upon the subject of flies and spittle, or the laborious eloquence of his style. And I cannot forbear doing that author the justice of my public acknowledgments for the great helps and liftings I had out of his incomparable piece while I was penning this treatise."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 165
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[155]"
  "translation_ja": "白状しなければならないが、ほかの点では力の足りない私が、これほど大胆な企てに踏み出したのも、この秘薬のおかげだった。この企ては、これまで、ホメロスというある著者以外、成し遂げた者も、試みた者もいない。この人には、ほかの点で多少の能力がないわけではなく、古代人にしては、まずまずの才もあった。しかし私は、その中に多くの甚だしい誤りを見つけた。仮にその灰がまだどこかに残っていても、灰にさえ許せぬ誤りである。彼は、人間、神、政治、機械に関する、あらゆる知識の完全な体系を、自作で目指したという[102a]。ところが、一部はまったく無視し、残りもひどく不完全なままにしているのは明らかだ。まず何より、弟子たちが、どれほど卓越したカバラの達人に仕立てようとも、大いなる業についての説明が、あまりに貧弱で不十分である。センディヴォギウスもベーメも『神聖魔術的人智学』[102b]も、まるで表面しか読んでいないらしい。また、火成の球についても、すっかり取り違えている。これは償いようのない怠慢であり、読者がこれほど厳しい批判をお認めくださるなら、この著者が、そもそも火という言葉を聞いたことがあるのか、私は疑いたくなる。機械学のいくつかの部分でも、欠陥は同じほど目立つ。近代の才人がふつう払う、最大限の注意をもって著作を読んだが、あの便利な器具、蝋燭の燃え残り受けの構造について、いまだに、ほんのわずかな指示も見つけられない。近代人が助けてくれなければ、その不足のため、われわれは今でも暗闇をさまよっていただろう。しかし、もっと明白な欠点が、この著者を責めるために、まだ残っている。この国のコモン・ローと、イングランド国教会の教義および規律についての、甚だしい無知である。実際、この欠点ゆえに、彼も、すべての古代人も、わが立派で才気ある友人、神学士ウォットン氏から、まことに正当な非難を受けている。あの比類ない『古代と近代の学問』という論考の中で、である。著者の機知の幸せな転回と流れを考えても、蠅と唾についての崇高な発見の大いなる有用さを考えても、苦心のにじむ文体の雄弁を考えても、いくら高く評価してもし足りない本だ。そして、この論考を書く間、あの比類ない作品から得た大きな助けと持ち上げについて、この著者に、公に感謝を表すという公正を、私は果たさずにいられない。"
  "translation_status": "reviewed"
- "id": "tub-section-05-008"
  "section_id": "section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But besides these omissions in Homer already mentioned, the curious reader will also observe several defects in that author’s writings for which he is not altogether so accountable. For whereas every branch of knowledge has received such wonderful acquirements since his age, especially within these last three years or thereabouts, it is almost impossible he could be so very perfect in modern discoveries as his advocates pretend. We freely acknowledge him to be the inventor of the compass, of gunpowder, and the circulation of the blood; but I challenge any of his admirers to show me in all his writings a complete account of the spleen. Does he not also leave us wholly to seek in the art of political wagering? What can be more defective and unsatisfactory than his long dissertation upon tea? and as to his method of salivation without mercury, so much celebrated of late, it is to my own knowledge and experience a thing very little to be relied on."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 166
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[156]"
  "translation_ja": "だが、すでに述べたホメロスの抜け落ちのほかに、好奇心ある読者は、その著作に、本人だけの責任とは言い切れぬ欠陥も、いくつか見つけるだろう。彼の時代以後、とりわけ、ここ三年ばかりの間に、知識のあらゆる部門は、驚くべき成果を得た。だから、擁護者たちの言い張るように、彼が近代の発見にも完全に通じていたなど、ほとんど不可能なのだ。羅針盤、火薬、血液循環の発明者だったことは、喜んで認めよう。しかし、その著作のどこであれ、脾臓についての完全な説明を、賛美者の誰かに見せてもらいたいものだ。政治をめぐる賭けの技でも、彼はわれわれを、まるきり手探りに放置していないか。茶についての長い論文より、不十分で不満足なものが、どこにあるだろう。近頃たいそう称賛される、水銀を用いずに唾液を出させる彼の方法にいたっては、私自身の知識と経験から言って、ほとんど当てにならない。"
  "translation_status": "reviewed"
- "id": "tub-section-05-009"
  "section_id": "section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It was to supply such momentous defects that I have been prevailed on, after long solicitation, to take pen in hand, and I dare venture to promise the judicious reader shall find nothing neglected here that can be of use upon any emergency of life. I am confident to have included and exhausted all that human imagination can rise or fall to. Particularly I recommend to the perusal of the learned certain discoveries that are wholly untouched by others, whereof I shall only mention, among a great many more, my “New Help of Smatterers, or the Art of being Deep Learned and Shallow Read,” “A Curious Invention about Mouse-traps,” “A Universal Rule of Reason, or Every Man his own Carver,” together with a most useful engine for catching of owls. All which the judicious reader will find largely treated on in the several parts of this discourse."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 167
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[157]"
  "translation_ja": "こうした重大な欠陥を補うため、長い懇願に押され、私はペンを取ることになった。判断力のある読者には、あえてお約束しよう。人生のどんな急場にも役立ちうるものを、ここでは何一つ取り落としていないはずだ。人間の想像力が昇りうるところ、落ちうるところを、すべて含め、尽くしたと確信している。とりわけ、ほかの者がまったく触れていない、いくつかの発見を、学識ある方々にお読みいただきたい。大勢の中から、私の『半可通の新しい助け、または、浅く読んで深く学ぶ術』『鼠捕り器についての珍しい発明』『理性の普遍的規則、または、誰もが自分の取り分を切り取る者』、それに、梟を捕まえる、たいへん便利な装置だけ挙げておこう。いずれも、本論考の各所で、詳しく扱われていると、判断力ある読者にはおわかりになるだろう。"
  "translation_status": "reviewed"
- "id": "tub-section-05-010"
  "section_id": "section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I hold myself obliged to give as much light as possible into the beauties and excellences of what I am writing, because it is become the fashion and humour most applauded among the first authors of this polite and learned age, when they would correct the ill nature of critical or inform the ignorance of courteous readers. Besides, there have been several famous pieces lately published, both in verse and prose, wherein if the writers had not been pleased, out of their great humanity and affection to the public, to give us a nice detail of the sublime and the admirable they contain, it is a thousand to one whether we should ever have discovered one grain of either. For my own particular, I cannot deny that whatever I have said upon this occasion had been more proper in a preface, and more agreeable to the mode which usually directs it there. But I here think fit to lay hold on that great and honourable privilege of being the last writer. I claim an absolute authority in right as the freshest modern, which gives me a despotic power over all authors before me. In the strength of which title I do utterly disapprove and declare against that pernicious custom of making the preface a bill of fare to the book. For I have always looked upon it as a high point of indiscretion in monstermongers and other retailers of strange sights to hang out a fair large picture over the door, drawn after the life, with a most eloquent description underneath. This has saved me many a threepence, for my curiosity was fully satisfied, and I never offered to go in, though often invited by the urging and attending orator with his last moving and standing piece of rhetoric, “Sir, upon my word, we are just going to begin.” Such is exactly the fate at this time of Prefaces, Epistles, Advertisements, Introductions, Prolegomenas, Apparatuses, To the Readers’s. This expedient was admirable at first; our great Dryden has long carried it as far as it would go, and with incredible success. He has often said to me in confidence that the world would never have suspected him to be so great a poet if he had not assured them so frequently in his prefaces, that it was impossible they could either doubt or forget it. Perhaps it may be so. However, I much fear his instructions have edified out of their place, and taught men to grow wiser in certain points where he never intended they should; for it is lamentable to behold with what a lazy scorn many of the yawning readers in our age do now-a-days twirl over forty or fifty pages of preface and dedication (which is the usual modern stint), as if it were so much Latin. Though it must be also allowed, on the other hand, that a very considerable number is known to proceed critics and wits by reading nothing else. Into which two factions I think all present readers may justly be divided. Now, for myself, I profess to be of the former sort, and therefore having the modern inclination to expatiate upon the beauty of my own productions, and display the bright parts of my discourse, I thought best to do it in the body of the work, where as it now lies it makes a very considerable addition to the bulk of the volume, a circumstance by no means to be neglected by a skilful writer."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"

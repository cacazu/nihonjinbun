- "id": "tub-section-09-005"
  "section_id": "section-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Having to no purpose used all peaceable endeavours, the collected part of the semen, raised and inflamed, became adust, converted to choler, turned head upon the spinal duct, and ascended to the brain. The very same principle that influences a bully to break the windows of a woman who has jilted him naturally stirs up a great prince to raise mighty armies and dream of nothing but sieges, battles, and victories."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 211
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[194]"
  "translation_ja": "あらゆる平和な努力を尽くしても甲斐がなかったので、たまった精液の部分は、かき立てられ、熱を帯び、焼けつき、胆汁へ変わり、脊髄の管へ向きを変えて、脳へと昇った。自分を振った女の窓を、ごろつきに割らせるのと、まったく同じ原理が、自然に、偉大な君主を駆り立て、強大な軍を集め、包囲、会戦、勝利以外、何も夢見なくさせるのである。"
  "translation_status": "reviewed"
- "id": "tub-section-09-006"
  "section_id": "section-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The other instance is what I have read somewhere in a very ancient author of a mighty king [127a], who, for the space of above thirty years, amused himself to take and lose towns, beat armies and be beaten, drive princes out of their dominions, fright children from their bread and butter, burn, lay waste, plunder, dragoon, massacre subject and stranger, friend and foe, male and female. It is recorded that the philosophers of each country were in grave dispute upon causes natural, moral, and political, to find out where they should assign an original solution of this phenomenon. At last the vapour or spirit which animated the hero’s brain, being in perpetual circulation, seized upon that region of the human body so renowned for furnishing the zibeta occidentalis [127b], and gathering there into a tumour, left the rest of the world for that time in peace. Of such mighty consequence is it where those exhalations fix, and of so little from whence they proceed. The same spirits which in their superior progress would conquer a kingdom descending upon the anus, conclude in a fistula."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 212
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[195]"
  "translation_ja": "もう一つの例は、きわめて古い著者のどこかで読んだ、強大な王の話である[127a]。彼は三十年以上もの間、町を取っては失い、軍を破っては破られ、君主を領国から追い出し、子供をおびやかして、バターつきのパンから引き離し、焼き、荒らし、略奪し、竜騎兵を差し向け、臣民も異邦人も、友も敵も、男も女も虐殺することを、楽しみにしていた。各国の哲学者は、自然的、道徳的、政治的な原因について、真面目に論争し、この現象の根本的説明を、どこに求めるべきか探したと、記録されている。とうとう、英雄の脳を活気づけていた蒸気、または霊は、絶えず循環するうち、西洋麝香[127b]を供給することで名高い、人体のある領域を捕らえた。そこで腫れ物へ集まり、その間だけは、世界の残りを平和にしておいた。これほど大きな結果を生むのは、発散したものが、どこへ定着するかであり、どこから来たかは、それほど取るに足りない。上へ進めば王国を征服するのと同じ霊も、肛門へ降りれば、痔瘻に終わるのだ。"
  "translation_status": "reviewed"
- "id": "tub-section-09-007"
  "section_id": "section-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Let us next examine the great introducers of new schemes in philosophy, and search till we can find from what faculty of the soul the disposition arises in mortal man of taking it into his head to advance new systems with such an eager zeal in things agreed on all hands impossible to be known; from what seeds this disposition springs, and to what quality of human nature these grand innovators have been indebted for their number of disciples, because it is plain that several of the chief among them, both ancient and modern, were usually mistaken by their adversaries, and, indeed, by all, except their own followers, to have been persons crazed or out of their wits, having generally proceeded in the common course of their words and actions by a method very different from the vulgar dictates of unrefined reason, agreeing for the most part in their several models with their present undoubted successors in the academy of modern Bedlam, whose merits and principles I shall further examine in due place. Of this kind were Epicurus, Diogenes, Apollonius, Lucretius, Paracelsus, Des Cartes, and others, who, if they were now in the world, tied fast and separate from their followers, would in this our undistinguishing age incur manifest danger of phlebotomy, and whips, and chains, and dark chambers, and straw. For what man in the natural state or course of thinking did ever conceive it in his power to reduce the notions of all mankind exactly to the same length, and breadth, and height of his own? Yet this is the first humble and civil design of all innovators in the empire of reason. Epicurus modestly hoped that one time or other a certain fortuitous concourse of all men’s opinions, after perpetual jostlings, the sharp with the smooth, the light and the heavy, the round and the square, would, by certain clinamina, unite in the notions of atoms and void, as these did in the originals of all things. Cartesius reckoned to see before he died the sentiments of all philosophers, like so many lesser stars in his romantic system, rapt and drawn within his own vortex. Now I would gladly be informed how it is possible to account for such imaginations as these in particular men, without recourse to my phenomenon of vapours ascending from the lower faculties to overshadow the brain, and there distilling into conceptions, for which the narrowness of our mother-tongue has not yet assigned any other name beside that of madness or frenzy. Let us therefore now conjecture how it comes to pass that none of these great prescribers do ever fail providing themselves and their notions with a number of implicit disciples, and I think the reason is easy to be assigned, for there is a peculiar string in the harmony of human understanding, which in several individuals is exactly of the same tuning. This, if you can dexterously screw up to its right key, and then strike gently upon it whenever you have the good fortune to light among those of the same pitch, they will by a secret necessary sympathy strike exactly at the same time. And in this one circumstance lies all the skill or luck of the matter; for, if you chance to jar the string among those who are either above or below your own height, instead of subscribing to your doctrine, they will tie you fast, call you mad, and feed you with bread and water. It is therefore a point of the nicest conduct to distinguish and adapt this noble talent with respect to the differences of persons and of times. Cicero understood this very well, when, writing to a friend in England, with a caution, among other matters, to beware of being cheated by our hackney-coachmen (who, it seems, in those days were as arrant rascals as they are now), has these remarkable words, Est quod gaudeas te in ista loca venisse, ubi aliquid sapere viderere [129]. For, to speak a bold truth, it is a fatal miscarriage so ill to order affairs as to pass for a fool in one company, when in another you might be treated as a philosopher; which I desire some certain gentlemen of my acquaintance to lay up in their hearts as a very seasonable innuendo."

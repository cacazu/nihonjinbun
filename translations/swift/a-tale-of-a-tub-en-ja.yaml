    "xpath": "/html[1]/body[1]/h3[8]"
  "translation_ja": |-
    第3節
    批評家についての脱線
  "translation_status": "reviewed"
- "id": "tub-section-03-002"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Though I have been hitherto as cautious as I could, upon all occasions, most nicely to follow the rules and methods of writing laid down by the example of our illustrious moderns, yet has the unhappy shortness of my memory led me into an error, from which I must immediately extricate myself, before I can decently pursue my principal subject. I confess with shame it was an unpardonable omission to proceed so far as I have already done before I had performed the due discourses, expostulatory, supplicatory, or deprecatory, with my good lords the critics. Towards some atonement for this grievous neglect, I do here make humbly bold to present them with a short account of themselves and their art, by looking into the original and pedigree of the word, as it is generally understood among us, and very briefly considering the ancient and present state thereof."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 117
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[113]"
  "translation_ja": "ここまでは、あらゆる折に、輝かしい近代人たちの手本が定める執筆の規則と方法へ、できるかぎり慎重に、細心の注意をもって従ってきた。それなのに、不幸にも記憶が短いため、一つの誤りに陥ってしまった。本筋を体裁よく続けるには、まず、すぐにそこから抜け出さねばならない。恥を忍んで告白すれば、わが立派な批評家諸卿に向けて、しかるべき抗弁、懇願、またはお慈悲を乞う弁を述べずに、ここまで進んだのは、許されぬ手落ちだった。この重大な不注意をいくらかでも償うため、つつしみながらも、あえて、諸卿御自身とその技についての短い報告をお捧げしたい。私どもの間で一般に理解される、この語の起源と系譜を調べ、その技の古代と現在のありさまを、ごく手短に考察するものである。"
  "translation_status": "reviewed"
- "id": "tub-section-03-003"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "By the word critic, at this day so frequent in all conversations, there have sometimes been distinguished three very different species of mortal men, according as I have read in ancient books and pamphlets. For first, by this term were understood such persons as invented or drew up rules for themselves and the world, by observing which a careful reader might be able to pronounce upon the productions of the learned, form his taste to a true relish of the sublime and the admirable, and divide every beauty of matter or of style from the corruption that apes it. In their common perusal of books, singling out the errors and defects, the nauseous, the fulsome, the dull, and the impertinent, with the caution of a man that walks through Edinburgh streets in a morning, who is indeed as careful as he can to watch diligently and spy out the filth in his way; not that he is curious to observe the colour and complexion of the ordure or take its dimensions, much less to be paddling in or tasting it, but only with a design to come out as cleanly as he may. These men seem, though very erroneously, to have understood the appellation of critic in a literal sense; that one principal part of his office was to praise and acquit, and that a critic who sets up to read only for an occasion of censure and reproof is a creature as barbarous as a judge who should take up a resolution to hang all men that came before him upon a trial."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 118
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[114]"
  "translation_ja": "今日、あらゆる会話でしきりに使われる「批評家」という語は、私が古い書物やパンフレットで読んだところによると、かつて、まるで異なる三種類の人間を区別して指すことがあった。第一には、この言葉で、自分と世間のために規則を考え出し、まとめた人々を指した。その規則に従えば、注意深い読者は、学者の作品を判定し、崇高で見事なものを真に味わえるよう趣味を養い、内容や文体のあらゆる美を、それに似せた腐敗から見分けられる。彼らがふだん本を読むとき、誤りや欠点、吐き気を催すもの、過剰なもの、退屈なもの、見当違いなものを選び出す慎重さは、朝のエディンバラの街を歩く者に似ていた。その人は、行く手の汚物を見つけようと、できるかぎり注意して目を配る。だが、糞の色合いや顔つきを観察したり、寸法を測ったりすることに、好奇心を抱いているのではない。まして、いじり回したり、味見したりしたいわけでもない。ただ、なるべくきれいなまま、通り抜けたいだけである。これらの人々は、はなはだしくも誤って、批評家という名称を、文字どおりに理解していたらしい。その務めの主要な一部は、ほめること、無罪と認めることだと考え、ただ難癖や叱責の機会を求めて読む批評家は、裁判に来る者を一人残らず絞首刑にすると決めた裁判官と同じほど、野蛮な生き物だと思っていたのである。"
  "translation_status": "reviewed"
- "id": "tub-section-03-004"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Again, by the word critic have been meant the restorers of ancient learning from the worms, and graves, and dust of manuscripts."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 119
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[115]"
  "translation_ja": "また、批評家という語は、写本の虫や墓や埃の中から、古代の学問を蘇らせる人々を指すこともあった。"
  "translation_status": "reviewed"
- "id": "tub-section-03-005"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now the races of these two have been for some ages utterly extinct, and besides to discourse any further of them would not be at all to my purpose."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 120
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[116]"
  "translation_ja": "さて、この二つの種族は、何世代も前に、すっかり絶えてしまった。そのうえ、これ以上彼らについて論じても、私の目的には少しもかなわない。"
  "translation_status": "reviewed"
- "id": "tub-section-03-006"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The third and noblest sort is that of the true critic, whose original is the most ancient of all. Every true critic is a hero born, descending in a direct line from a celestial stem, by Momus and Hybris, who begat Zoilus, who begat Tigellius, who begat Etcætera the elder, who begat Bentley, and Rymer, and Wotton, and Perrault, and Dennis, who begat Etcætera the younger."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 121
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[117]"
  "translation_ja": "第三の、最も高貴な種類こそ、真の批評家であり、その起源は何よりも古い。真の批評家は誰でも、生まれながらの英雄である。天上の家系から、モモスとヒュブリスを通じて、直系で下ってきた。二人はゾイロスを生み、ゾイロスはティゲリウスを生み、ティゲリウスは大エトセトラを生み、大エトセトラはベントリー、ライマー、ウォットン、ペロー、デニスを生み、彼らは小エトセトラを生んだ。"
  "translation_status": "reviewed"
- "id": "tub-section-03-007"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "And these are the critics from whom the commonwealth of learning has in all ages received such immense benefits, that the gratitude of their admirers placed their origin in heaven, among those of Hercules, Theseus, Perseus, and other great deservers of mankind. But heroic virtue itself hath not been exempt from the obloquy of evil tongues. For it hath been objected that those ancient heroes, famous for their combating so many giants, and dragons, and robbers, were in their own persons a greater nuisance to mankind than any of those monsters they subdued; and therefore, to render their obligations more complete, when all other vermin were destroyed, should in conscience have concluded with the same justice upon themselves, as Hercules most generously did, and hath upon that score procured for himself more temples and votaries than the best of his fellows. For these reasons I suppose it is why some have conceived it would be very expedient for the public good of learning that every true critic, as soon as he had finished his task assigned, should immediately deliver himself up to ratsbane or hemp, or from some convenient altitude, and that no man’s pretensions to so illustrious a character should by any means be received before that operation was performed."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 122
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[118]"
  "translation_ja": "そして、この人々こそ、学問の共和国がどの時代にも莫大な恩恵を受けてきた批評家たちである。あまりに大きな恩恵なので、賛美者たちは感謝のあまり、その起源を、ヘラクレス、テセウス、ペルセウス、その他、人類に大いに功のあった者たちと並べて、天に置いた。しかし、英雄の美徳そのものさえ、悪い舌の中傷を免れたわけではない。多くの巨人、竜、盗賊と戦って名高い古代の英雄たちも、本人たちは、倒した怪物のどれよりも人類の迷惑だった、という反論があるのだ。だから、自分たちが与える恩恵をもっと完全にするため、ほかの害獣をすべて滅ぼした後には、良心に従い、自分自身にも同じ裁きを下して終えるべきだったという。ヘラクレスは、まことに寛大にもそうしたため、そのおかげで、仲間の中でも最も立派な者以上に、多くの神殿と信者を獲得した。おそらく、こうした理由から、次のように考えた人々もいるのだろう。学問の公共の利益のためには、真の批評家は誰でも、割り当てられた仕事を終え次第、すぐに鼠殺しの毒か麻縄へ身を委ねるか、適当な高所から身を投げるのが、きわめて望ましい。そして、その処置を終えるまでは、これほど輝かしい称号を求める請求を、何人のものでも、一切受け付けるべきではない、と。"
  "translation_status": "reviewed"
- "id": "tub-section-03-008"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now, from this heavenly descent of criticism, and the close analogy it bears to heroic virtue, it is easy to assign the proper employment of a true, ancient, genuine critic: which is, to travel through this vast world of writings; to peruse and hunt those monstrous faults bred within them; to drag out the lurking errors, like Cacus from his den; to multiply them like Hydra’s heads; and rake them together like Augeas’s dung; or else to drive away a sort of dangerous fowl who have a perverse inclination to plunder the best branches of the tree of knowledge, like those Stymphalian birds that ate up the fruit."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 123
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[119]"
  "translation_ja": "さて、批評のこの天上の血統と、英雄の美徳との密接な類似から、真の、古来正統の批評家にふさわしい仕事は、容易に定められる。それは、この広大な著作の世界を遍歴すること、その中で育った怪物じみた欠点を、読んでは狩り立てること、隠れた誤りを、洞穴のカクスのように引きずり出すこと、ヒュドラの首のように増やすこと、アウゲイアスの糞のように掻き集めることだ。あるいは、知識の木の最良の枝を荒らそうとする、よこしまな性向を持つ、危険な鳥どもを追い払うことである。実を食い尽くした、あのステュムパロスの鳥のような連中を。"
  "translation_status": "reviewed"
- "id": "tub-section-03-009"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "These reasonings will furnish us with an adequate definition of a true critic: that he is a discoverer and collector of writers’ faults; which may be further put beyond dispute by the following demonstration:—That whoever will examine the writings in all kinds wherewith this ancient sect hath honoured the world, shall immediately find from the whole thread and tenor of them that the ideas of the authors have been altogether conversant and taken up with the faults, and blemishes, and oversights, and mistakes of other writers, and let the subject treated on be whatever it will, their imaginations are so entirely possessed and replete with the defects of other pens, that the very quintessence of what is bad does of necessity distil into their own, by which means the whole appears to be nothing else but an abstract of the criticisms themselves have made."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 124
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[120]"
  "translation_ja": "こうした推論から、真の批評家の適切な定義が得られる。すなわち、著述家の欠点の発見者にして収集者、である。次の証明を挙げれば、いっそう議論の余地はなくなる。この古い宗派が、あらゆる分野で世間を飾ってきた著作を調べれば、誰でも、その筋道と調子の全体から、すぐに気づくことがある。著者の観念は、ほかの書き手の欠点、瑕疵、見落とし、間違いばかりを相手にし、それだけに占められている。扱う題目が何であろうと、他人のペンの欠陥が、想像力をあまりに完全に占領し、満たしているので、悪いものの精髄そのものが、いやでも自分のペンへ蒸留されてしまう。そのため作品全体が、自分のした批判を、そのまま集約したものにしか見えなくなるのである。"
  "translation_status": "reviewed"
- "id": "tub-section-03-010"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Having thus briefly considered the original and office of a critic, as the word is understood in its most noble and universal acceptation, I proceed to refute the objections of those who argue from the silence and pretermission of authors, by which they pretend to prove that the very art of criticism, as now exercised, and by me explained, is wholly modern, and consequently that the critics of Great Britain and France have no title to an original so ancient and illustrious as I have deduced. Now, if I can clearly make out, on the contrary, that the most ancient writers have particularly described both the person and the office of a true critic agreeable to the definition laid down by me, their grand objection—from the silence of authors—will fall to the ground."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 125
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[121]"
  "translation_ja": "こうして、最も高貴で、最も普遍的な意味における批評家の起源と職務を手短に考察したので、次は、著者たちの沈黙や記載の欠如に訴える人々の反論を、打ち破ることにしよう。彼らは、それをもって、現在行われ、私が説明したとおりの批評の技は、まったく近代のものであり、したがって大ブリテンとフランスの批評家には、私が導き出したほど古く、輝かしい起源を名乗る資格はない、と証明したつもりなのだ。さて、もし逆に、最も古い著者たちが、私の示した定義に合う、真の批評家の姿と職務を、詳しく描いていると明らかにできれば、著者の沈黙を根拠とする、彼らの最大の反論は崩れ落ちるだろう。"
  "translation_status": "reviewed"
- "id": "tub-section-03-011"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I confess to have for a long time borne a part in this general error, from which I should never have acquitted myself but through the assistance of our noble moderns, whose most edifying volumes I turn indefatigably over night and day, for the improvement of my mind and the good of my country. These have with unwearied pains made many useful searches into the weak sides of the ancients, and given us a comprehensive list of them [84a]. Besides, they have proved beyond contradiction that the very finest things delivered of old have been long since invented and brought to light by much later pens, and that the noblest discoveries those ancients ever made in art or nature have all been produced by the transcending genius of the present age, which clearly shows how little merit those ancients can justly pretend to, and takes off that blind admiration paid them by men in a corner, who have the unhappiness of conversing too little with present things. Reflecting maturely upon all this, and taking in the whole compass of human nature, I easily concluded that these ancients, highly sensible of their many imperfections, must needs have endeavoured, from some passages in their works, to obviate, soften, or divert the censorious reader, by satire or panegyric upon the true critics, in imitation of their masters, the moderns. Now, in the commonplaces [84b] of both these I was plentifully instructed by a long course of useful study in prefaces and prologues, and therefore immediately resolved to try what I could discover of either, by a diligent perusal of the most ancient writers, and especially those who treated of the earliest times."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 126
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[122]"
  "translation_ja": "私も長い間、この一般的な誤りに加わっていたことを認めよう。高貴な近代人たちの助けがなければ、そこから抜け出せなかったに違いない。私は、精神を高め、祖国のためになるよう、彼らの教訓に富む書物を、夜も昼も、飽くことなくめくっている。彼らは疲れを知らぬ労苦を重ね、古代人の弱点を有益にも調べ尽くし、包括的な一覧を与えてくれた[84a]。そのうえ、昔語られた最上のことも、はるか後世のペンによって、とうに発明され、世に示されていたと、反論の余地なく証明した。古代人が技芸や自然について成し遂げた、最も立派な発見は、すべて、当代の卓越した天才によって生み出されたものなのだ。これで、古代人が正当に主張できる功績の小ささは、はっきりわかる。また、今の物事に触れる機会が少ないという不幸に見舞われ、片隅に引っ込んでいる連中が、彼らに捧げる盲目的な崇拝も、取り払われる。これを十分に考え、人間性の全体を視野に収めた結果、私は容易に結論した。古代人も、自分たちの多くの不完全さを痛感していた以上、師匠である近代人をまねて、作品のあるくだりで、真の批評家に風刺か頌辞を捧げ、口うるさい読者を先回りして防ぎ、和らげ、気をそらそうとしたに違いない。さて、序文や口上を長く有益に研究してきたおかげで、私は、この両者の決まり文句[84b]をたっぷり仕込まれていた。だから、いちばん古い著者、とりわけ最古の時代を扱った者たちを丹念に読み、どちらの例が見つかるか、さっそく調べてみることにした。"
  "translation_status": "reviewed"
- "id": "tub-section-03-012"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Here I found, to my great surprise, that although they all entered upon occasion into particular descriptions of the true critic, according as they were governed by their fears or their hopes, yet whatever they touched of that kind was with abundance of caution, adventuring no further than mythology and hieroglyphic. This, I suppose, gave ground to superficial readers for urging the silence of authors against the antiquity of the true critic, though the types are so apposite, and the applications so necessary and natural, that it is not easy to conceive how any reader of modern eye and taste could overlook them. I shall venture from a great number to produce a few which I am very confident will put this question beyond doubt."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 127
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[123]"
  "translation_ja": "そこで、たいへん驚いたことに、次のことがわかった。古代の著者は皆、恐れや期待に導かれるまま、折にふれて真の批評家を詳しく描いていたが、この種の話に触れるときには、ひどく慎重で、あえて神話や象形文字の範囲を出なかったのだ。おそらくそのせいで、浅薄な読者は、著者の沈黙を持ち出して、真の批評家の古さを否定するのだろう。しかし、その比喩はあまりにぴったりし、当てはめ方も必然的で自然なので、近代の目と趣味を持つ読者が、どうして見落とせるのか、なかなか想像できない。多数の中から、あえて二、三挙げてみよう。これで問題は、疑いの余地なく決着すると、私は強く確信している。"
  "translation_status": "reviewed"
- "id": "tub-section-03-013"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It well deserves considering that these ancient writers, in treating enigmatically upon this subject, have generally fixed upon the very same hieroglyph, varying only the story according to their affections or their wit. For first, Pausanias is of opinion that the perfection of writing correct was entirely owing to the institution of critics, and that he can possibly mean no other than the true critic is, I think, manifest enough from the following description. He says they were a race of men who delighted to nibble at the superfluities and excrescences of books, which the learned at length observing, took warning of their own accord to lop the luxuriant, the rotten, the dead, the sapless, and the overgrown branches from their works. But now all this he cunningly shades under the following allegory: That the Nauplians in Argia learned the art of pruning their vines by observing that when an ass had browsed upon one of them, it thrived the better and bore fairer fruit. But Herodotus holding the very same hieroglyph, speaks much plainer and almost in terminis. He hath been so bold as to tax the true critics of ignorance and malice, telling us openly, for I think nothing can be plainer, that in the western part of Libya there were asses with horns, upon which relation Ctesias [85] yet refines, mentioning the very same animal about India; adding, that whereas all other asses wanted a gall, these horned ones were so redundant in that part that their flesh was not to be eaten because of its extreme bitterness."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 128
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[124]"
  "translation_ja": "よく考えるに値するのは、古代の著者たちが、この問題を謎めいて扱う際、概してまったく同じ象形文字を選び、好悪や才知に応じて、話だけを変えていることだ。まずパウサニアスによれば、正しく書く技が完成したのは、まったく批評家という制度のおかげである。その意味する者が、真の批評家以外にありえないことは、次の記述で十分明らかだと思う。彼らは、本の余計な部分や瘤をかじるのを喜ぶ種族だった、と彼は言う。それにようやく気づいた学者たちは、自ら教訓を得て、伸びすぎた枝、腐った枝、枯れた枝、樹液のない枝、茂りすぎた枝を、自作から切り落とすようになった。しかし、彼はこの一切を、次の寓話で巧みに覆い隠している。アルゴス地方のナウプリア人は、驢馬がかじった葡萄の木のほうが、よく育ち、美しい実を結ぶと観察して、剪定の術を学んだ、というのだ。だがヘロドトスは、同じ象形文字を使いながら、もっと明瞭に、ほとんどあけすけに述べている。真の批評家を無知と悪意のかどで責めるほど、大胆だった。リビア西部には、角のある驢馬がいた、と公然と語るのである。これ以上明らかな表現はないと思う。この話を、クテシアス[85]はさらに磨き、インドについて、まったく同じ動物を述べている。そのうえ、ほかの驢馬には胆汁がないのに、この有角の驢馬には、それがあまりにも多いので、肉がひどく苦く、食べられないと付け加えている。"
  "translation_status": "reviewed"
- "id": "tub-section-03-014"
  "section_id": "section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now, the reason why those ancient writers treated this subject only by types and figures was because they durst not make open attacks against a party so potent and so terrible as the critics of those ages were, whose very voice was so dreadful that a legion of authors would tremble and drop their pens at the sound. For so Herodotus tells us expressly in another place how a vast army of Scythians was put to flight in a panic terror by the braying of an ass. From hence it is conjectured by certain profound philologers, that the great awe and reverence paid to a true critic by the writers of Britain have been derived to us from those our Scythian ancestors. In short, this dread was so universal, that in process of time those authors who had a mind to publish their sentiments more freely in describing the true critics of their several ages, were forced to leave off the use of the former hieroglyph as too nearly approaching the prototype, and invented other terms instead thereof that were more cautious and mystical. So Diodorus, speaking to the same purpose, ventures no farther than to say that in the mountains of Helicon there grows a certain weed which bears a flower of so damned a scent as to poison those who offer to smell it. Lucretius gives exactly the same relation."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-4737"
    "precision": "block"
    "source_sequence": 129
    "url": "https://www.gutenberg.org/files/4737/4737-h/4737-h.htm"
    "xpath": "/html[1]/body[1]/p[125]"
  "translation_ja": "さて、古い著者たちが、この問題を比喩や寓意でしか扱わなかったのは、当時の批評家ほど強く、恐ろしい党派に対し、公然と攻撃する勇気がなかったからだ。その声だけで、著者の一軍が震え、ペンを取り落とすほどだった。実際、ヘロドトスは別の箇所で、スキタイ人の大軍が、驢馬の鳴き声に恐慌を起こして逃げ出したと、はっきり述べている。ここから、ある深遠な言語学者たちは、ブリテンの著者が真の批評家に払う大きな畏怖と敬意は、スキタイの先祖から受け継いだものだと推測している。要するに、この恐怖はあまりに広く行き渡っていたので、時がたつにつれ、それぞれの時代の真の批評家を描く際に、もっと自由に気持ちを発表したいと望む著者は、従来の象形文字を使うのをやめざるをえなくなった。原型に似すぎていたからである。代わりに、いっそう慎重で神秘的な表現を考え出した。ディオドロスなどは、同じ趣旨を語るにも、ヘリコンの山々には、嗅ごうと近づく者を毒するほど、忌まわしい臭いの花を咲かせる草が生える、と言うにとどまっている。ルクレティウスも、まったく同じ話を述べている。"
  "translation_status": "reviewed"

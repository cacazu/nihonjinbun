  "translation_status": "reviewed"
- "id": "sb1720-stanza-1"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    All travellers at first incline
    Where’er they see the fairest sign;
    And if they find the chambers neat,
    And like the liquor and the meat,
    Will call again and recommend
    The Angel Inn to every friend
    What though the painting grows decayed,
    The house will never lose its trade:
    Nay, though the treach’rous tapster Thomas
    Hangs a new angel two doors from us,
    As fine as daubers’ hands can make it,
    In hopes that strangers may mistake it,
    We think it both a shame and sin,
    To quit the true old Angel Inn.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[192]"
    "line_start": 2893
    "source_sequence": 209
  "translation_ja": |-
    旅人は誰しも、初めには、
    いちばん見栄えのよい看板へ足が向く。
    部屋がこざっぱりとしていて、
    酒も料理も気に入れば、
    また訪れ、友人の誰にも、
    「天使亭」を勧めるものだ。
    看板の絵が古びたところで、
    その宿の商いは衰えはしない。
    たとえ裏切り者の酒場男トマスが、
    二軒先に、新しい天使を掲げ、
    へぼ絵描きの手で、精いっぱい飾り立て、
    よその客が取り違えるのを当てにしても、
    私たちは、恥であり、罪だと思う、
    本物の、昔ながらの天使亭を見捨てることを。
  "translation_status": "reviewed"
- "id": "sb1720-stanza-2"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Now, this is Stella’s case in fact,
    An angel’s face, a little cracked
    (Could poets, or could painters fix
    How angels look at, thirty-six):
    This drew us in at first, to find
    In such a form an angel’s mind;
    And every virtue now supplies
    The fainting rays of Stella’s eyes.
    See, at her levee, crowding swains,
    Whom Stella freely entertains,
    With breeding, humour, wit, and sense;
    And puts them but to small expense;
    Their mind so plentifully fills,
    And makes such reasonable bills,
    So little gets for what she gives,
    We really wonder how she lives!
    And had her stock been less, no doubt,
    She must have long ago run out.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[193]"
    "line_start": 2907
    "source_sequence": 210
  "translation_ja": |-
    さて、これこそ、ステラにそのまま当てはまる。
    天使の顔に、少しひびが入っただけ。
    （詩人や画家に描けるものなら描いてほしい、
    三十六歳の天使とは、どんな顔か。）
    初めは、その顔に引かれて訪れ、
    その姿のうちに、天使の心を見つけた。
    そして今は、あらゆる徳が埋め合わせている、
    ステラの瞳の、薄れゆく輝きを。
    見よ、君の朝の客間に群がる男たちを。
    ステラは気前よく、皆をもてなす、
    礼儀とユーモアと、才知と分別で。
    しかも、ほとんど出費をさせずに。
    皆の心を、こんなに豊かに満たし、
    勘定も、こんなに良心的で、
    与えるものに比べ、受け取るものは、あまりに少ない。
    どうやって暮らしているのか、本当に不思議だ。
    その蓄えが、もっと乏しかったなら、間違いなく、
    とうの昔に、使い果たしていたはずである。
  "translation_status": "reviewed"
- "id": "sb1720-stanza-3"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Then who can think we’ll quit the place,
    When Doll hangs out a newer face;
    Or stop and light at Cloe’s Head,
    With scraps and leavings to be fed.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[194]"
    "line_start": 2925
    "source_sequence": 211
  "translation_ja": |-
    それなのに、誰が思うだろう、私たちがここを離れるなどと、
    ドールが、もっと新しい顔の看板を出したからといって。
    あるいは「クロエの顔」亭で足を止め、馬を降り、
    切れ端や食べ残しを、あてがわれようなどと。
  "translation_status": "reviewed"
- "id": "sb1720-stanza-4"
  "section_id": "poem"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Then Cloe, still go on to prate
    Of thirty-six, and thirty-eight;
    Pursue your trade of scandal picking,
    Your hints that Stella is no chicken.
    Your innuendoes when you tell us,
    That Stella loves to talk with fellows;
    And let me warn you to believe
    A truth, for which your soul should grieve:
    That should you live to see the day
    When Stella’s locks, must all be grey,
    When age must print a furrowed trace
    On every feature of her face;
    Though you and all your senseless tribe,
    Could art, or time, or nature bribe
    To make you look like beauty’s queen,
    And hold for ever at fifteen;
    No bloom of youth can ever blind
    The cracks and wrinkles of your mind;
    All men of sense will pass your door,
    And crowd to Stella’s at fourscore.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[195]"
    "line_start": 2929
    "source_sequence": 212
  "translation_ja": |-
    だからクロエ、まだしゃべり続けるがいい、
    三十六だ、三十八だと。
    悪口の種を拾う商売を続けるがいい、
    ステラはもう、ひよっこではないという、当てこすりを。
    男たちと話すのが、ステラは好きなのだと、
    私たちに告げる、その思わせぶりな口ぶりも。
    だが、これだけは信じるよう、忠告しておこう。
    君の心には、嘆かわしい真実だろうが、
    もし君が、その日まで生き延びたとしても、
    ステラの髪が、すっかり白くなり、
    年齢が、深いしわの跡を刻む日まで、
    その顔の、あらゆるところに。
    君と、君の愚かな仲間の全員が、
    細工にも、時にも、自然にも、賄賂を渡し、
    美の女王そっくりに、してもらい、
    永遠に十五歳で、いられたとしても、
    若さの花盛りは、決して隠せはしない、
    君たちの心の、ひびや、しわを。
    分別ある男たちは皆、君の戸口を通り過ぎ、
    八十になったステラのもとへ、群がるだろう。

- id: partridge-epitaph-stanza-1
  section_id: epitaph
  kind: verse
  origin: source
  source_text: 'Here, five Foot deep, lies on his Back,

    A Cobler, Starmonger, and Quack;

    Who to the Stars in pure Good-will,

    Does to his best look upward still.

    Weep all you Customers that use

    His Pills, his Almanacks, or Shoes;

    And you that did your Fortunes seek,

    Step to his Grave but once a Week:

    This Earth which bears his Body''s Print,

    You''ll find has so much Vertue in''t,

    That I durst pawn my Ears ''twill tell

    Whate''er concerns you full as well,

    In Physick, Stolen Goods, or Love,

    As he himself could, when above.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0004
    xpath: /html/body/pre[2]
    line_start: 738
    source_sequence: 17
  translation_ja: 'ここ、深さ五フィートの地に、仰向けに眠る、

    靴直し、星占い師、いかさま医者。

    星々への、まったくの好意から、

    今も、できる限り上を見つめている。

    泣いてくれ、彼の丸薬、暦、靴を、

    愛用していた、すべての客たちよ。

    そして、運勢を尋ねていた者たちも、

    週に一度だけ、この墓を訪ねてくれ。

    彼の体の跡をとどめる、この土には、

    それほどの効き目があると、わかるだろう。

    私の耳を賭けてもよい、この土は教えてくれる、

    お前たちに関わる、どんなことでも、まったく同じように、

    病のことも、盗品も、恋のことも、

    彼自身が、地上にいたときにできたのと同じくらいに。'
  translation_status: reviewed

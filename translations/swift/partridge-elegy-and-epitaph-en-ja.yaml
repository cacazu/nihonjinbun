  translation_ja: 哀歌第三連の冒頭は底本ではA List of Coblers Temples Tiesだが、一八〇一年版のA list the cobbler’s temples tiesを参照し、布の細帯でこめかみを縛る意味に読んだ。第七連のfly as fairは同版のfly as farを参照し「遠くまで飛ぶ」とした。第八連のMercuryは水星と水銀、Venusは金星と恋愛の女神を意味する。星々の話には、恋がもたらす病を水銀で治すという皮肉も重なる。
  translation_status: reviewed

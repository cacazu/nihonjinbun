  translation_status: reviewed
- id: partridge-elegy-stanza-1
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'Well, ''tis as Bickerstaff has guess''d,

    Tho'' we all took it for a jest;

    Partridge is dead, nay more, he dy''d

    E''re he could prove the good ''Squire ly''d.

    Strange, an Astrologer shou''d die,

    Without one Wonder in the Sky!

    Not one of all his Crony Stars

    To pay their Duty at his Herse?

    No Meteor, no Eclipse appear''d?

    No Comet with a flaming Beard?

    The Sun has rose, and gone to Bed,

    Just as if partridge were not dead:

    Nor hid himself behind the Moon,

    To make a dreadful Night at Noon.

    He at fit Periods walks through Aries,

    Howe''er our earthly Motion varies;

    And twice a Year he''ll cut th'' Equator,

    As if there had been no such Matter.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 1
  translation_ja: 'さて、ビッカースタッフの見立てどおりだった、

    私たちは皆、冗談だと思っていたが。

    パートリッジは死んだ。それどころか、

    あのご立派な氏を嘘つきと立証する前に死んだ。

    不思議ではないか、占星術師が死んだのに、

    空には不思議が一つもないとは。

    仲良しの星々は、その一つとして、

    霊柩に敬意を払いに来なかったのか。

    流星も出ず、日食も月食も起こらず、

    燃える髭をなびかせた彗星も出なかったのか。

    太陽は昇り、そして寝床に入った、

    まるでパートリッジが死ななかったかのように。

    月の陰に身を隠して、

    真昼を恐ろしい夜に変えることもなかった。

    太陽はいつもの時期に、牡羊座を通ってゆく、

    地上の私たちの動きが、どう変わろうとも。

    そして年に二度、赤道を横切る、

    そんな事件など、なかったかのように。'
  translation_status: reviewed
- id: partridge-elegy-stanza-2
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'Some Wits have wonder''d what Analogy

    There is ''twixt Cobbling* and Astrology:

    How Partridge made his Optics rise,

    From a Shoe-Sole, to reach the Skies.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 2
  translation_ja: '物知りの中には、不思議がる者もいた、

    靴直し[1]と占星術に、どんな似たところがあるのかと。

    パートリッジは、どうしてその目を、

    靴底から引き上げ、空にまで届かせたのかと。'
  translation_status: reviewed
- id: partridge-elegy-stanza-3
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'A List of Coblers Temples Ties,

    To keep the Hair out of their Eyes;

    From whence ''tis plain the Diadem

    That Princes wear, derives from them.

    And therefore Crowns are now-a-days

    Adorn''d with Golden Stars and Rays,

    Which plainly shews the near Alliance

    ''Twixt cobling and the Planets Science.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 3
  translation_ja: '靴直しは、布の細帯でこめかみを縛る、

    髪が目にかからないように。

    だから、君主たちの戴く王冠も、

    そこから生まれたことは明らかだ。

    従って今の王冠には、

    金の星と光が飾られている。

    これもはっきり示している、靴直しと、

    惑星の学問の、近しいつながりを。'
  translation_status: reviewed
  source_variants:
  - kind: comparison
    text: 'A list the cobbler''s temples ties,

      To keep the hair out of their eyes;'
    source_locations:
    - source_id: wikisource-1801-v07-partridge
      precision: work
      url: https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_7/Elegy_on_Partridge_the_Almanack_Maker&oldid=10241124
    description_ja: 1801年版の該当行。底本の語句を保持し、日本語訳の文意を確認するために参照。
- id: partridge-elegy-stanza-4
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'Besides, that slow-pac''d Sign Bootes,

    As ''tis miscall''d, we know not who ''tis?

    But Partridge ended all Disputes,

    He knew his Trade, and call''d it **Boots.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 4
  translation_ja: 'そのうえ、ゆっくり歩く星座、ボオーテスは、

    そう呼び違えられていても、何者なのか誰も知らない。

    だが、パートリッジは、すべての論争にけりをつけた、

    本業を心得て、「ブーツ」と呼んだのだ。[2]'
  translation_status: reviewed
- id: partridge-elegy-stanza-5
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'The Horned Moon, which heretofore

    Upon their Shoes the Romans wore,

    Whose Wideness kept their Toes from Corns,

    And whence we claim our Shooing-Horns;

    Shows how the Art of Cobling bears

    A near Resemblance to the Spheres.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 5
  translation_ja: '昔、ローマ人が、

    靴につけていた、角のある月の飾り、

    その幅広い形は、足の指に魚の目ができるのを防ぎ、

    私たちの靴べらも、そこから来たというが、

    それもまた、靴直しの技が、いかに、

    天球とよく似ているかを示している。'
  translation_status: reviewed
- id: partridge-elegy-stanza-6
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'A Scrap of Parchment hung by Geometry

    (A great Refinement in Barometry)

    Can, like the Stars, foretel the Weather;

    And what is Parchment else but Leather?

    Which an Astrologer might use,

    Either for Almanacks or Shoes.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 6
  translation_ja: '幾何学に従って吊るした、羊皮紙の切れ端は、

    （気圧の測定では、大した進歩だが、）

    星々と同じように、天気を予告できる。

    しかも羊皮紙とは、皮以外の何だろう。

    占星術師は、その皮を、

    暦にも、靴にも使えるのだ。'
  translation_status: reviewed
- id: partridge-elegy-stanza-7
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'Thus Partridge, by his Wit and Parts,

    At once did practise both these Arts;

    And as the boading Owl (or rather

    The Bat, because her Wings are Leather)

    Steals from her private Cell by Night,

    And flies about the Candle-Light;

    So learned Partridge could as well

    Creep in the Dark from Leathern Cell,

    And, in his Fancy, fly as fair,

    To peep upon a twinkling Star.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 7
  translation_ja: 'こうしてパートリッジは、機知と才能によって、

    この二つの技を、一度に営んだ。

    そして、不吉を告げる梟が、いや、むしろ、

    蝙蝠が、その翼は皮でできているのだから、

    夜になると、奥の隠れ家からそっと抜け出し、

    蝋燭の明かりのまわりを飛ぶように、

    学識あるパートリッジもまた、

    暗がりの中、皮の仕事場から這い出して、

    空想の中で、遠くまで飛んでゆき、

    またたく星を、のぞき見ることができた。'
  translation_status: reviewed
  source_variants:
  - kind: comparison
    text: And in his fancy fly as far,
    source_locations:
    - source_id: wikisource-1801-v07-partridge
      precision: work
      url: https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_7/Elegy_on_Partridge_the_Almanack_Maker&oldid=10241124
    description_ja: 1801年版の該当行。底本の語句を保持し、日本語訳の文意を確認するために参照。
- id: partridge-elegy-stanza-8
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'Besides, he could confound the Spheres,

    And set the Planets by the Ears;

    To shew his Skill, he Mars could join

    To Venus in Aspect Mali''n;

    Then call in Mercury for Aid,

    And cure the Wounds that Venus made.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 8
  translation_ja: 'そればかりか、天球を混乱させ、

    惑星同士を、喧嘩させることさえできた。

    腕を見せようと、火星を、

    金星と、不吉な位置関係に置く。

    それから水星を、助けに呼んで、

    金星が負わせた傷を、治すのだ。'
  translation_status: reviewed
- id: partridge-elegy-stanza-9
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'Great Scholars have in Lucian read,

    When Philip, King of Greece was dead,

    His Soul and Spirit did divide,

    And each Part took a diff''rent Side;

    One rose a Star, the other fell

    Beneath, and mended Shoes in Hell.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 9
  translation_ja: '偉い学者たちは、ルキアノスで読んだことだろう、

    ギリシア王フィリッポスが死んだとき、

    その魂と霊は、二つに分かれ、

    それぞれ、別の方へ向かったと。

    一方は昇って星となり、もう一方は、

    下へ落ち、地獄で靴を直したと。'
  translation_status: reviewed
- id: partridge-elegy-stanza-10
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'Thus Partridge still shines in each Art,

    The Cobling and Star-gazing Part,

    And is install''d as good a Star

    As any of the Caesars are.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 10
  translation_ja: 'こうしてパートリッジは、今も二つの技で輝く、

    靴直しの技と、星を見る技で。

    そして、歴代のカエサルたちに劣らぬ、

    立派な星の地位を授けられた。'
  translation_status: reviewed
- id: partridge-elegy-stanza-11
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'Triumphant Star! some Pity shew

    On Coblers militant below,

    Whom roguish Boys in stormy Nights

    Torment, by pissing out their Lights;

    Or thro'' a Chink convey their Smoke;

    Inclos''d Artificers to choke.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 11
  translation_ja: '勝利の星よ、少しは情けをかけてくれ、

    地上で、今なお戦っている靴直したちに。

    嵐の夜には、いたずら小僧たちが、

    小便で灯を消し、彼らを苦しめる。

    あるいは隙間から、煙を吹き込み、

    狭い中の職人たちを、窒息させようとするのだ。'
  translation_status: reviewed
- id: partridge-elegy-stanza-12
  section_id: elegy
  kind: verse
  origin: source
  source_text: 'Thou, high exalted in thy Sphere,

    May''st follow still thy Calling there.

    To thee the Bull will lend his hide,

    By Phoebus newly tann''d and dry''d.

    For thee they Argo''s Hulk will tax,

    And scrape her pitchy Sides for Wax.

    Then Ariadne kindly lends

    Her braided Hair to make thee Ends.

    The Point of Sagittarius'' Dart

    Turns to an awl, by heav''nly Art;

    And Vulcan, wheedled by his Wife,

    Will forge for thee a Paring-Knife.

    For want of Room, by Virgo''s Side,

    She''ll strain a Point, and sit astride***,

    To take thee kindly in between,

    And then the Signs will be Thirteen.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0003
    xpath: /html/body/pre[1]
    line_start: 614
    source_sequence: 12
  translation_ja: '高く天球へ昇ったお前は、

    そこでも、これまでの職を続けられる。

    牡牛はお前に、その皮を貸してくれるだろう、

    ポイボスが、なめして干したばかりの皮を。

    お前のために、アルゴ船の船体に取り立てをかけ、

    瀝青を塗った船腹を削り、靴糸の蝋を取るだろう。

    そしてアリアドネは、親切にも、

    編んだ髪を貸して、糸を作らせてくれる。

    射手座の矢の先は、

    天の技で、錐に変わる。

    妻になだめすかされたウルカヌスは、

    お前のために、革包丁を鍛えてくれるだろう。

    乙女座の隣に、場所が足りなければ、

    乙女は少し無理をして、両脚を広げて座り、[3]

    親切にも、その間へお前を迎え入れる。

    そうなれば、星座は十三になるだろう。'
  translation_status: reviewed

      precision: work
      url: https://en.wikisource.org/w/index.php?title=The_Works_of_the_Rev._Jonathan_Swift/Volume_5/Predictions_For_the_Year_1708,_By_Isaac_Bickerstaff,_Esq.&oldid=10241414
    description_ja: 対応語句のみ。1801年版もTethysと綴る。原文を訂正せず、日本語でもテテュスと音写した。
- id: bicker-predictions-049
  section_id: predictions
  kind: paragraph
  origin: source
  source_text: Upon the 25th day of this month, the fulfilling of this prediction will be manifest to every body.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0001
    xpath: /html[1]/body[1]/p[56]
    line_start: 450
    line_end: 453
    source_sequence: 49
  translation_ja: この月の25日には、この予言の成就が、誰の目にも明らかになる。
  translation_status: reviewed
- id: bicker-predictions-050
  section_id: predictions
  kind: paragraph
  origin: source
  source_text: 'This is the farthest I have proceeded in my calculations for the present year. I do not pretend, that these are all the great events which will happen in this period, but that those I have set down will infallibly come to pass. It will perhaps still be objected, why I have not spoke more particularly of affairs at home, or of the success of our armies abroad, which I might, and could very largely have done; but those in power have wisely discouraged men from meddling in publick concerns, and I was resolv''d by no means to give the least offence. This I will venture to say, That it will be a glorious campaign for the allies, wherein the English forces, both by sea and land, will have their full share of honour: That her Majesty Queen Anne will continue in health and prosperity: And that no ill accident will arrive to any of the chief ministry.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0001
    xpath: /html[1]/body[1]/p[57]
    line_start: 454
    line_end: 468
    source_sequence: 50
  translation_ja: 今年の計算を、今のところ進めたのは、ここまでである。この期間に起きる大事件は、これだけだと主張するつもりはない。ただ、書き記したものは、間違いなく起きると言っているのだ。それでもなお、国内の事柄や、海外でのわが軍の戦果について、なぜもっと詳しく話さなかったのか、と異論が出るかもしれない。そうすることもできたし、詳しく述べるだけの材料も、十分あった。しかし、権力を持つ人々は、国の問題に手を出すなと、賢明にも人々を戒めておられるので、私は、わずかでも機嫌を損ねることは、決してすまいと決めていた。これだけは、あえて言おう。同盟諸国にとって、輝かしい戦役となるだろう。イングランド軍も、海陸ともに、その栄誉を十分に分かつだろう。アン女王陛下は、引き続き健やかに、栄えられるだろう。そして、主要な閣僚の誰にも、悪い事故は起こらないだろう。
  translation_status: reviewed
- id: bicker-predictions-051
  section_id: predictions
  kind: paragraph
  origin: source
  source_text: 'As to the particular events I have mention''d, the readers may judge by the fulfilling of ''em, whether I am on the level with common astrologers; who, with an old paultry cant, and a few pothook for planets, to amuse the vulgar, have, in my opinion, too long been suffer''d to abuse the world: But an honest physician ought not to be despis''d, because there are such things as mountebanks. I hope I have some share of reputation, which I would not willingly forfeit for a frolick or humour: And I believe no gentleman, who reads this paper, will look upon it to be of the same cast or mould with the common scribblers that are every day hawk''d about. My fortune has placed me above the little regard of scribbling for a few pence, which I neither value or want: Therefore let no wise men too hastily condemn this essay, intended for a good design, to cultivate and improve an ancient art, long in disgrace, by having fallen into mean and unskilful hands. A little time will determine
    whether I have deceived others or myself: and I think it is no very unreasonable request, that men would please to suspend their judgments till then. I was once of the opinion with those who despise all predictions from the stars, till the year 1686, a man of quality shew''d me, written in his album, That the most learned astronomer, Captain H. assured him, he would never believe any thing of the stars'' influence, if there were not a great revolution in England in the year 1688. Since that time I began to have other thoughts, and after eighteen years diligent study and application, I think I have no reason to repent of my pains. I shall detain the reader no longer, than to let him know, that the account I design to give of next year''s events, shall take in the principal affairs that happen in Europe; and if I be denied the liberty of offering it to my own country, I shall appeal to the learned world, by publishing it in Latin, and giving order to have it printed in Holland.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0001
    xpath: /html[1]/body[1]/p[58]
    line_start: 469
    line_end: 498
    source_sequence: 51
  translation_ja: 述べてきた個々の出来事については、その成就によって、私が普通の占星術師と同じ水準かどうか、読者に判断してもらえばよい。古びた安っぽい決まり文句と、惑星を表す、二つ三つの引っかき文字で、俗人を面白がらせる、ああいう連中が世間をだますのを、放っておいた期間は長すぎると、私は思う。だが、いかさま薬売りというものがあるからといって、正直な医者まで軽蔑すべきではない。私にも、いくらかの評判はあるつもりだ。戯れや気まぐれのために、それを進んで失いたくはない。この文を読む紳士であれば、日々呼び売りされる、ありふれた駄文と同じ型から出たものとは、見ないだろうと信じる。私の資産は、二、三ペンスのために書き散らすなどという、けちな考えを超えたところに、私を置いてくれた。そのはした金は、欲しいとも思わず、必要でもない。だから賢い人々には、この試みを、あまり急いで非難しないでもらいたい。卑しく未熟な者の手に落ちて、長く不名誉にまみれてきた古い術を育て、改良するという、善い目的のためのものなのである。少し時がたてば、私がだましたのが他人だったか、自分自身だったかは、決着する。それまでは判断を控えていただきたいというのは、さほど無理な頼みではあるまい。私もかつては、星からなされる予言をすべて蔑む人々と、同じ意見だった。ところが一六八六年、ある身分の高い人が、手帳に書いてあったことを見せてくれた。きわめて学識豊かな天文学者、H船長が、一六八八年にイングランドで大きな革命が起こらなければ、星の影響については何一つ信じまい、とその人に断言したというのである。そのときから、私は別の考えを持ち始めた。そして十八年間、勤勉に研究し、力を尽くした今、その労を悔やむ理由はないと思っている。読者を引き止めるのは、あと一つだけだ。来年の出来事について予定している報告では、ヨーロッパで起こる主な事柄を取り上げるつもりである。自国にそれを差し出す自由を認めてもらえなければ、ラテン語で公表し、オランダで印刷するよう手配して、学識ある世界に訴えよう。
  translation_status: reviewed

- id: bicker-predictions-004
  section_id: predictions
  kind: paragraph
  origin: source
  source_text: 'I have long consider''d the gross abuse of astrology in this kingdom, and upon debating the matter with myself, I could not possibly lay the fault upon the art, but upon those gross impostors, who set up to be the artists. I know several learned men have contended that the whole is a cheat; that it is absurd and ridiculous to imagine, the stars can have any influence at all upon human actions, thoughts, or inclinations: And whoever has not bent his studies that way, may be excused for thinking so, when he sees in how wretched a manner that noble art is treated by a few mean illiterate traders between us and the stars; who import a yearly stock of nonsense, lyes, folly, and impertinence, which they offer to the world as genuine from the planets, tho'' they descend from no greater a height than their own brains.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0001
    xpath: /html[1]/body[1]/p[11]
    line_start: 122
    line_end: 135
    source_sequence: 4
  translation_ja: 私は、この王国で占星術がひどく悪用されていることを、長い間考えてきた。自分なりにあれこれ検討した末に、その罪を術そのものに負わせることは、どうしてもできなかった。責めるべきは、その術の使い手を名乗る、ひどい山師どもなのである。幾人もの学者が、何もかもがいかさまだ、星が人間の行動や思考や気質に、いささかでも影響するなどと考えるのは、ばかげていておかしい、と主張してきたのは承知している。この道を研究したことのない者がそう考えるのも、無理はない。この気高い術が、私たちと星々の間を仲介する、身分の低い無学な商売人たちによって、どれほど惨めに扱われているかを見れば、そうだろう。彼らは毎年、無意味な話、嘘、愚かさ、くだらないことをひと山仕入れ、惑星から届いた本物として世間に売りつける。だが、その出所は、彼ら自身の頭より高いところではないのだ。
  translation_status: reviewed
- id: bicker-predictions-005
  section_id: predictions
  kind: paragraph
  origin: source
  source_text: 'I intend in a short time to publish a large and rational defence of this art, and therefore shall say no more in its justification at present, than that it hath been in all ages defended by many learned men, and among the rest by Socrates himself, whom I look upon as undoubtedly the wisest of uninspir''d mortals: To which if we add, that those who have condemned this art, though otherwise learned, having been such as either did not apply their studies this way, or at least did not succeed in their applications; their testimony will not be of much weight to its disadvantage, since they are liable to the common objection of condemning what they did not understand.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0001
    xpath: /html[1]/body[1]/p[12]
    line_start: 136
    line_end: 147
    source_sequence: 5
  translation_ja: 私は近いうちに、この術を理にかなった仕方で擁護する大部の書を出すつもりなので、今はその正当化について、これ以上述べない。ただ、どの時代にも多くの学者がこれを擁護してきたこと、なかにはソクラテスその人もいたことを言っておこう。神の霊感を受けなかった人間の中では、彼こそ疑いなく最も賢い者だったと、私は考えている。さらに、この術を非難した人々は、ほかのことには通じていても、この道には研究を向けなかったか、少なくとも研究して成果を挙げられなかった者たちだという点を加えれば、その証言がこの術に不利に働く重みは、大したものではあるまい。理解しないものを非難している、というよくある反論が、彼らには当てはまるからだ。
  translation_status: reviewed
- id: bicker-predictions-006
  section_id: predictions
  kind: paragraph
  origin: source
  source_text: Nor am I at all offended, or think it an injury to the art, when I see the common dealers in it, the students in astrology, the philomaths, and the rest of that tribe, treated by wise men with the utmost scorn and contempt; but rather wonder, when I observe gentlemen in the country, rich enough to serve the nation in parliament, poring in Partridge's almanack, to find out the events of the year at home and abroad; not daring to propose a hunting-match, till Gadbury or he have fixed the weather.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0001
    xpath: /html[1]/body[1]/p[13]
    line_start: 148
    line_end: 156
    source_sequence: 6
  translation_ja: また、よくいるこの道の商売人、占星術の学徒、数理を好むと称する連中、その他同類の者たちが、賢者たちから徹底的に嘲られ、軽蔑されるのを見ても、私は少しも腹を立てず、この術が傷つけられたとも思わない。それよりむしろ驚くのは、議会で国に奉仕できるほど裕福な地方の紳士たちが、その年の国内外の出来事を知ろうと、パートリッジの暦をじっと読みふけっていることだ。ガドベリーか彼が天気を決めてくれるまでは、狩りの会を提案することさえ、あえてしないのである。
  translation_status: reviewed
- id: bicker-predictions-007
  section_id: predictions
  kind: paragraph
  origin: source
  source_text: 'I will allow either of the two I have mentioned, or any other of the fraternity, to be not only astrologers, but conjurers too, if I do not produce a hundred instances in all their almanacks, to convince any reasonable man, that they do not so much as understand common grammar and syntax; that they are not able to spell any word out of the usual road, nor even in their prefaces write common sense or intelligible English. Then for their observations and predictions, they are such as will equally suit any age or country in the world. "This month a certain great person will be threatened with death or sickness." This the news-papers will tell them; for there we find at the end of the year, that no month passes without the death of some person of note; and it would be hard if it should be otherwise, when there are at least two thousand persons of not in this kingdom, many of them old, and the almanack-maker has the liberty of chusing the sickliest season of the year where he
    may fix his prediction. Again, "This month an eminent clergyman will be preferr''d;" of which there may be some hundreds half of them with one foot in the grave. Then "such a planet in such a house shews great machinations, plots and conspiracies, that may in time be brought to light:" After which, if we hear of any discovery, the astrologer gets the honour; if not, his prediction still stands good. And at last, "God preserve King William from all his open and secret enemies, Amen." When if the King should happen to have died, the astrologer plainly foretold it; otherwise it passes but for the pious ejaculation of a loyal subject: Though it unluckily happen''d in some of their almanacks, that poor King William was pray''d for many months after he was dead, because it fell out that he died about the beginning of the year.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-1090
    precision: block
    url: https://www.gutenberg.org/files/1090/1090-h/1090-h.htm#link2H_4_0001
    xpath: /html[1]/body[1]/p[14]
    line_start: 157
    line_end: 184
    source_sequence: 7
  translation_ja: 今挙げた二人でも、その仲間のほかの誰でも、私がその暦の中から百の実例を示せなかったら、占星術師どころか魔術師だとさえ認めよう。その実例を見れば、理性のある人なら誰でも、彼らが普通の文法や構文さえ理解していないこと、ありふれた範囲を少しでも外れる単語は綴れず、序文でさえ、筋の通ることや、意味のわかる英語を書けないことを、納得するはずである。さて、その観測と予言に至っては、世界のどの時代、どの国にも同じように当てはまるものばかりだ。「今月、ある大人物が、死または病に脅かされるだろう。」そのくらいは新聞が教えてくれる。年末に新聞を振り返れば、名のある誰かが死なない月など、ないとわかるからだ。この王国だけでも、少なくとも二千人の名士がおり、その多くは高齢で、暦作りには、予言を置く時期として一年で最も病人の多い季節を選ぶ自由まであるのだから、そうならないほうが難しい。また、「今月、高名な聖職者が昇進するだろう」。そういう聖職者は何百人もいて、その半分は墓穴に片足を入れているかもしれない。次には、「ある惑星がある宮にあることは、大きなたくらみ、陰謀、謀反のしるしであり、それらはいずれ明るみに出るかもしれない」。そのあとで何かの発覚を聞けば、占星術師の手柄となる。聞かなければ、その予言はまだ有効なのだ。そして最後は、「神よ、公然の敵からも隠れた敵からも、ウィリアム王をお守りください。アーメン」。もし王がたまたま亡くなれば、占星術師は、それをはっきり予言していたことになる。そうでなければ、忠実な臣民の敬虔な祈りで済む。ただし一部の暦では、気の毒なウィリアム王が死んでからも、何か月もそのために祈り続けるという、まずいことになった。王は、たまたま年の初めごろに亡くなったからである。
  translation_status: reviewed
  source_variants:
  - kind: comparison
    text: persons of note
    source_locations:

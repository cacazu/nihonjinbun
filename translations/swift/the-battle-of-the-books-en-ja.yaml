  "source_text": "A FULL AND TRUE ACCOUNT OF THE BATTLE FOUGHT LAST FRIDAY BETWEEN THE ANCIENT AND THE MODERN BOOKS IN SAINT JAMES’S LIBRARY."
  "source_languages":

  "origin": "source"
  "source_text": "This dispute was managed with such eagerness, clamour, and warmth, that the two parties of books, in arms below, stood silent a while, waiting in suspense what would be the issue; which was not long undetermined: for the bee, grown impatient at so much loss of time, fled straight away to a bed of roses, without looking for a reply, and left the spider, like an orator, collected in himself, and just prepared to burst out."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[29]"
    "line_start": 624
    "source_sequence": 19
  "translation_ja": "この論争は、あまりの熱意、騒ぎ、激しさで行われたので、下で武器を取る、二党の本どもは、しばらく黙り、どう決着するか、息を詰めて待った。結末は、長くは定まらぬままでいなかった。蜜蜂は、これほどの時間の損失に、辛抱できなくなり、返事を待たず、まっすぐ薔薇の花壇へ飛び去った。そして、演説家のように、心を集中し、まさに、ほとばしり出ようとしていた蜘蛛を、残したのである。"

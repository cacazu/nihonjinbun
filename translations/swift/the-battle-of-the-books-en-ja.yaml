  "translation_ja": "騎兵の左翼には、体へ完全に合った、輝く鎧姿で、ウェルギリウスが現れた。斑のある芦毛に乗り、その歩みが遅いのは、最高の気性と活力のためだった。勇気にふさわしい相手を見つけようと、敵の翼を見ると、そこに、途方もなく大きな栗毛の去勢馬に乗り、敵の最も密な隊列から出てくる者がいた。しかし、速さは、騒音ほどではなかった。老いて痩せた馬が、残る力を、足を高く上げる速足へ費やし、進みは遅いが、鎧を、聞くも恐ろしい大音響で、がちゃがちゃ鳴らしたのである。二騎が、槍の届く所まで来ると、見知らぬ騎士は、話し合いを求め、兜の面頬を上げた。中から顔が、かろうじて現れ、しばらくして、名高いドライデンとわかった。勇敢な古代派は、驚きと失望に、同時に捕らえられた者のように、はっと身じろぎした。兜は頭の九倍も大きく、頭は、ずっと奥へ引っ込んで見えた。まるで、ロブスターの中の「貴婦人」、国王の天蓋の下の鼠、あるいは、近代の鬘の庇から見える、しなびた伊達男のようだった。声も、顔に似合い、弱く、遠くから響いた。ドライデンは、長い弁舌で、善良な古代派をなだめ、父と呼び、系図を長々とたどって、近い親類であることを、明白に示した。それから、二人の間の歓待の、永遠のしるしとして、鎧を取り替えようと、恭しく申し出た。ウェルギリウスは同意した。謙遜の女神が、姿を見せずに来て、目の前へ霧をかけたからである。自分の鎧は金製で、牛百頭の値がし、相手のは、錆びた鉄にすぎなかったのに。だが、この輝く鎧は、近代派へ、自分のものより、さらに似合わなかった。それから、馬を交換することでも一致したが、試す段になると、ドライデンは恐れ、まったく乗れなかった。……〔原稿に、さらに欠落〕……ルカヌスが、見事な姿の、激しい馬に乗って現れた。しかし馬は強情で、思うままに、乗り手を戦場中へ運んだ。彼は、敵の騎兵を大いに殺した。この破壊を止めようと、近代派の名高いブラックモアが――ただし傭兵の一人だった――力を込めて立ち向かい、強い手で投槍を放った。だが、的まで届かず、地へ深く刺さった。次にルカヌスが槍を投げたが、アスクレピオスが、見えぬまま来て、穂先をそらした。「勇敢な近代派よ」とルカヌスは言った。「何かの神が、お前を守るとわかる。これまで、自分の腕に、こうも裏切られたことはないからだ。しかし、人間が、神と争えようか。だから、もう戦わず、互いに贈り物をしよう」。ルカヌスは、近代派へ一対の拍車を贈り、ブラックモアは、ルカヌスへ頭絡を与えた。……〔若干欠落〕…………クリーチ。しかし、愚鈍の女神は、雲を取り、武装して馬に乗るホラティウスの姿へ変え、逃げる格好で、彼の前へ置いた。騎士は、逃げる敵との戦いを喜び、大声で脅しながら、幻を追った。ついには、父オグルビーの、平穏な木陰へ導かれ、そこで武装を解かれ、休息を命じられた。"

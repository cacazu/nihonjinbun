  "full_review_corrections":
  - "id": "btb-001"
    "old_translation_sha256": "a49b61d0baf042f3cd6e59a7cc2e607a407896db772b689887048413c297c88b"
    "reason_ja": "was on footは論争が進行していたことをいう。発端の年を1697年と断定する訳を修正。"
  - "id": "btb-009"
    "old_translation_sha256": "860ab8f0e0fdb9b29de2aece8f6e085aa56b4aab46cc87368d79606e7c7d4fc2"
    "reason_ja": "ラテン語brutum hominisの属格と、霊的残存物をいう文脈に合わせ、獣的な性格の霊という解釈へ寄せず、人間の獣的な部分という呼称を示す。"
  - "id": "btb-018"
    "old_translation_sha256": "dad38ae0c51387769c9eb1072fbce94829f2f545f0ce6665ef5f76f41ed647ab"
    "reason_ja": "four inches roundに原文にない正方形を設定した点を修正。feeding and engendering on itselfの、自分だけを糧とし産出するという閉鎖的な比喩も明確にする。"
  - "id": "btb-020"
    "old_translation_sha256": "a55c534a31d89e53a23e60667c400af7eb2b482ca06299e68e5d33e7c1ee5d08"
    "reason_ja": "a large veinはここでは性向・資質を指し、論理のつながりである脈絡ではないため修正。"
  - "id": "btb-031"
    "old_translation_sha256": "d9dbb2fcfc62d87a336f0319d77e4d76238cc47344b2c3f625d42a2462775733"
    "reason_ja": "Diffidenceはウェルギリウスの慎み深さ・控えめな性質を人格化した語で、決断をためらう意味ではない。古代伝記を引くRunning Commentary p.145でもshyness and modestyと確認した。"
  - "id": "btb-032"
    "old_translation_sha256": "a61c5327f6289f9cf14b7c9280892ccf84156e522a596da42f2e59ff351e0c29"
    "reason_ja": "to be trodは倒れた半身が踏まれるに任せられることを表す。既に踏まれ終わった出来事として読ませないよう時の関係を修正。"
  - "id": "btb-034"
    "old_translation_sha256": "5f2c7f6c8cba6d34a07a6c3f60d2529fae8410bb5b3ccccd589af785a6f3395b"
    "reason_ja": "a greater coward burdeneth not the armyの、軍で最も臆病な者だという比較関係を明確にする。"
  - "id": "btb-035"
    "old_translation_sha256": "ebab8d33e06902e726be9da3eb2eb7c699e4a52483550394e2d093aa2f92d134"
    "reason_ja": "by reflectionは月の影が落ちることではなく、水面に映る姿を見ることをいうため修正。"
  "full_review_notes":
  - "全40単位の初稿が揃った後、書店主の2段落、著者序の鏡・クリーム比喩、本文冒頭の戦争と高慢・犬の共和国まで、btb000〜007の全原文と日本語を一回対照。btb001の進行中を発端とする誤読を修正。Bentleyの表記は既訳のベントリーを確認。"
  - "btb008〜013を英日全文対照。パルナッソスの二案、岩への応答、羽根ペンと戦勝記念の列挙、八百年と五万兵、図書館での人名と配置を確認。gall/copperasは原料の没食子/緑礬でよいことを、当時の製法を引く研究者のRunning Commentary（https://www.uni-muenster.de/imperia/md/content/englischesseminar/swift/battle_commentary.pdf pp.22〜23）および一次の製法集（https://www.gutenberg.org/files/46254/old/46254-h/46254-h.htm）で確認。brutum hominisも同Commentary pp.25〜26のVaughan/Paracelsus一次引用に照らして語義を確認。"
  - "btb014〜020の全原文と日本語を対照。プラトンの皮肉、テンプルの転属、蜘蛛と蜂の発話順・三度の反復・生まれつきの元手・自然からの採集、イソップの適用と甘さ／光の比喩を確認。source_textにあるlesson/fall/tillを改変せず、対になるdisparage、増分の源、蜜と蝋の文脈からlessen/fail/fillの意味で訳すことを確認。"
  - "btb021〜028の全原文と訳文を対照。両軍の部隊・人名・役割、名声とユピテルの運命の書、批評とその家族、ウォットンへの憑依を確認。八つ折判・二つ折判、七人の子、没食子と煤の墨、神学者ベントリーの呼称を確認。"
  - "btb029〜039の全原文と訳文を対照。各戦闘の攻撃者と防御者、兜九倍・牛百頭・投槍三本・十二騎・三度と七度の反復、身体と書物を二重に指す比喩、二人の死と半額の渡し賃、末尾の欠落表示を確認。欠落を示すラテン語はすべて訳出済み。Diffidenceは同Running Commentary p.145のDonatus古代伝記引用を確認。lady in a lobsterは同p.142〜143および初期辞書の用例を確認し、原語の貴婦人という呼称を保った。"
  "boundary_note_ja": "Morleyの紹介と後続の別作品は別範囲。書店主の言葉からDesunt cœteraまでの40単位を原文順に保持。図なし。"

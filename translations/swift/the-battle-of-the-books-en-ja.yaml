  "translation_ja": "日も大いに暮れ、近代派の大軍が、半ば退却へ傾くころ、重装歩兵の一隊から、ベントリーという隊長が出た。近代派で、最も不格好な者だった。背は高いが、姿にも美しさにも欠け、体は大きいが、力も釣り合いもなかった。鎧は、互いに合わぬ千もの破片を継ぎ合わせ、進むたび、高く、乾いた音を立てた。エテシアの風に、突然、尖塔の屋根から吹き落とされた、鉛板の音のようだった。兜は、古い錆びた鉄で、面頬は真鍮だったが、息に汚され、腐って緑礬となっていた。同じ源から、胆汁にも事欠かなかったので、怒りや労苦に駆られると、最も悪性の、インクのようなものが、唇から滴るのが見えた。右手には殻竿、左手には、攻撃の武器に、決して不足せぬよう、汚物を満たした器を握っていた。完全武装した、この姿で、近代派の首領たちが、情勢全体を相談する所へ、ゆっくり重い足取りで進んだ。将軍たちは、近づくと、その曲がった脚と、盛り上がった肩を見て笑った。長靴と鎧は、隠そうと、むなしく努めたが、その形へ従い、さらけ出さざるを得なかった。将軍たちは、罵倒の才能を利用していた。管理しておけば、しばしば、大いに役立つが、そうでなければ、益より害が大きかった。少しでも気に障ると、しばしば、何もなくても、傷ついた象のように、自分の指導者へ向けたからだ。いまのベントリーは、まさに、そういう気分だった。敵が優勢なのを悔しがり、自分以外、誰の行動にも不満だった。近代派の将軍たちへ、恭しく、こう申し上げた。恐れながら、自分の考えでは、諸君は皆、悪党、馬鹿、とんでもない木偶の坊、無学な小犬、たわけたならず者の集まりだ。自分を将軍にしておけば、生意気な犬ども、古代派などは、とっくに戦場から叩き出されていたはずだ、と。「諸君は」と言った。「ここで怠けて座るが、おれか、ほかの勇敢な近代派が敵を殺せば、必ず戦利品を奪う。だが、おれが捕らえ、殺した者の武具は、誰のものでも、邪魔されずに取れると、皆で誓うまでは、敵へ向かって一歩も進まないぞ」。ベントリーが、こう言うと、スカリジェは、苦々しい目を向けた。「下劣なおしゃべりめ」と言った。「自分の目の中でしか雄弁でないくせに、機知も、真実も、分別もなく罵る。性質の悪意が、自然をねじ曲げ、学識は、お前を、もっと野蛮にし、人文学の研究は、もっと非人間的にし、詩人との交わりは、もっと卑屈で、泥まみれで、愚鈍にする。他人を文明化する、あらゆる技が、お前を粗野で、扱いにくくする。宮廷は無作法を教え、洗練された会話は、衒学者へ仕上げた。そのうえ、これほどの臆病者を、この軍はほかに抱えていない。しかし、決して落胆するな。約束しよう。取った戦利品は、何でも、確かに、お前のものとなる。ただし、その前に、卑しい屍が、鳶と虫の餌になるよう願うがね」。"

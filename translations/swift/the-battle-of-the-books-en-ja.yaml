    "source_sequence": 18
  "translation_ja": "「少なくとも、翼と声は、正直に手に入れたと認めてくれて、うれしいね」と蜜蜂は答えた。「それなら、飛ぶことと音楽については、天にだけ恩があるらしい。そして、摂理は、最も高貴な目的を定めずに、こんな二つの賜物を、与えはしなかったろう。たしかに、野原や庭の、あらゆる花を訪ねる。だが、そこから何を集めても、自分を豊かにするだけで、美しさ、香り、味を、少しも傷つけない。さて、君の建築術や、その他の数学の腕前には、あまり言うことがない。その建物には、私の知る限り、十分な労苦や秩序も、あったかもしれない。だが、双方の悲しい経験から、材料が駄目なのは、あまりに明白だ。これからは、戒めとして、方法と技術だけでなく、耐久性と素材も、考えてもらいたい。君は、ほかの生き物には、一切恩がなく、すべて自分から引き出し、紡ぎ出すと自慢する。つまり、出るものから、器の中の液体を判断してよいなら、胸に、たっぷりの汚物と毒を蓄えているのだ。生まれつきの、そのどちらの元手も、少なくしたり、貶したりするつもりは、決してないが、それを増やすためには、多少、よその助けに恩があるのではないかと思う。持ち前の汚物も、下から舞い上がる掃き屑で、増し分には事欠かない。また、一匹の虫が、別の虫を殺す毒の、一部を供給している。だから、要するに、問題は、どちらが、より高貴な存在かということに尽きる。自分の周囲四インチを、怠けて眺め、思い上がった高慢で、自分自身を糧とし、自分だけで子を生み、すべてを糞と毒へ変え、蠅殺しと蜘蛛の巣しか生まないものか。それとも、広く巡り、長く探し、大いに学び、正しく判断して、物事を見分け、蜜と蝋を、持ち帰るものか」。"

  "translation_ja": "事態が、この危機に達したとき、重要な出来事が起こった。大きな窓の、いちばん高い隅に、ある蜘蛛が住んでいたのである。無数の蠅を滅ぼして、最大級の大きさに膨れ、獲物の残骸は、巨人の洞穴の前の人骨のように、宮殿の門前へ散らばっていた。城へ通じる道は、回転する防柵や、杭柵で守られ、すべて近代式の築城法に、ならっていた。幾つもの中庭を通ると、中央へ出て、城代自身の住まいが見えた。どの通路にも向いた窓と、獲物を捕らえ、防御するため、いつでも出撃できる門を備えていた。この館で、しばらくの間、平穏と豊かさの中に住み、身には、上からの燕、宮殿には、下からの箒の危険もなかった。そこへ、運命の気まぐれで、さまよう蜜蜂が導かれた。割れた窓ガラスが、その好奇心に姿を現したので、入って来たのである。しばらく飛び回った末、たまたま、蜘蛛の城の外壁の一つへ止まった。壁は、釣り合わぬ重みに負け、土台まで崩れた。三度、通り抜けようとし、三度、中心が震えた。中の蜘蛛は、恐ろしい震動を感じ、初めは、自然の最後の崩壊が近づいたのか、それとも、何千もの臣民を敵に殺され、食われた、ベルゼブブが、全軍を率いて仇を討ちに来たのかと思った。しかし、ついには、勇ましく出て、運命に会おうと決めた。その間に、蜜蜂は、絡みつくものから逃れ、少し離れた安全な場所で、翼を整え、ぼろぼろの蜘蛛の巣の残りを、払いのけていた。このころ、蜘蛛も思い切って外へ出た。要塞の亀裂、廃墟、崩壊を見ると、ほとんど正気を失い、狂人のように怒鳴り、悪態をつき、裂けそうなほど膨れた。やがて蜜蜂を見て、賢くも、結果から原因を推した。二匹は、互いに顔を知っていたのである。「疫病に引き裂かれろ」と言った。「この散らかしようは、てめえの仕業か。前を見られなかったのか、この罰当たりめ。悪魔にかけて、おれには、てめえのあと始末と修理しか、仕事がないと思うのか」。「言葉は穏やかに、友よ」と、身繕いを終え、からかう気になっていた蜜蜂は言った。「握手して、約束しよう。二度と、君の寝ぐらへ近づかない。生まれてこのかた、こんな、ひどい目には遭ったことがない」。「こら」と蜘蛛は答えた。「敵に向かって、外へ出ないという、家の古いしきたりを破るのでなければ、行って、もう少し礼儀を教えてやるところだ」。「どうか、辛抱したまえ」と蜜蜂は言った。「さもないと、身の蓄えを使い果たす。見たところ、家を修理するのに、全部、要るかもしれないよ」。「悪党め、悪党め」と蜘蛛は答えた。「それでも、世界中から、てめえより、ずっと上だと認められる者には、もう少し敬意を払うべきだろう」。「まったく」と蜜蜂は言った。「その比較は、なかなか、よい冗談になる。この、見込みのありそうな論争で、世間が、お使いになる理由を、ぜひ教えてくれたまえ」。そこで蜘蛛は、論争家の大きさと構えに膨れ上がり、真の論争精神をもって、議論を始めた。心底、罵り、怒り、相手の答えや異論には、少しも構わず、自分の理由だけを押し進め、いかなる説得にも屈しまいと、あらかじめ、心に決めていた。"

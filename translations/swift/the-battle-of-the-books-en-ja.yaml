  "translation_ja": "この事態で、初めに沈黙を破ったのは、イソップだった。近ごろ、図書館の支配者の人情の、奇妙な作用によって、最も野蛮に扱われていたのである。扉を破り取り、頁の半分をひどく傷つけ、近代派の棚の中へ、鎖で、しっかり縛りつけたのだった。そこで、争いが、どれほど高まろうとしているか、すぐ見て取り、あらゆる技を試し、千もの姿へ変わった。ついに、借り物の驢馬の姿になると、支配者は、近代派の一冊と間違えた。そのおかげで、古代派へ逃れる時と機会が生まれ、ちょうど、蜘蛛と蜜蜂が、論争に入るところへ来た。たいそう楽しく、それを聞き、終わると、生まれてこのかた、窓の中の件と、棚の上の件ほど、ぴったり対応する二つの場合を、知ったことはないと、いちばん大きな声で誓った。「二人の論者は」と言った。「見事に論争を進め、双方で言うべきことの、力をすべて取り込み、賛否のあらゆる議論の中身を、尽くした。双方の推論を、目下の争いへ合わせ、蜜蜂が学識深く論じた、それぞれの労働と実りを、比べ、当てはめさえすればよい。すると、結論は、近代派と我々へ、明白かつ、ぴたりと当てはまる。さて、諸君、あの蜘蛛の態度、身のこなし、逆説ほど、近代的なものが、かつてあっただろうか。彼は、兄弟たる諸君と、自分自身のため、生まれつきの元手や、大きな天才を、自慢たっぷりに論じる。すべてを自分から紡ぎ、吐き出し、外からの恩や助けを認めるのを、軽蔑する。それから、建築の腕と、数学の進歩を見せびらかす。それに対し、我々古代派に雇われた弁護人たる蜜蜂は、こう答えるのがよいと考える。近代派の生んだものから、その大きな天才や発明を判断してよいなら、どちらを自慢するにも、とても、顔を保てまい。好きなだけ、秩序と技術をもって、構想を築くがよい。しかし材料が、自分のはらわた、すなわち近代の頭脳の腹から紡いだ、汚物にすぎないなら、建物は、ついには蜘蛛の巣となる。その長持ちも、ほかの蜘蛛の巣と同じく、忘れられ、放置され、隅に隠れたためと、考えられよう。ほかに近代派が、自前だと称しうるものは、思い出せない。あるとすれば、言い争いと風刺の、豊かな才能で、性質も中身も、蜘蛛の毒によく似る。すべて自分から吐き出すと称しても、やはり、同時代の虫や害虫を食べる、同じ技によって、強まるのだ。我々古代派は、蜜蜂とともに、翼と声、すなわち飛翔と言葉のほかには、自分のものを称さず、満足する。残りは、手に入れたものすべてが、果てしない労苦と探索、自然の隅々を巡ることによる。違いは、汚物と毒の代わりに、蜜と蝋で巣を満たすほうを選んだことだ。こうして人類へ、最も高貴な二つのもの、甘さと光を、供給するのである」。"

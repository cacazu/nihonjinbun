    "line_start": 274
    "source_sequence": 6
  "translation_ja": "去る金曜日、セント・ジェームズ図書館において、古代と近代の書物の間に戦われた合戦の、完全にして真実なる報告"
  "translation_status": "reviewed"
- "id": "btb-007"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Whoever examines, with due circumspection, into the annual records of time, will find it remarked that War is the child of Pride, and Pride the daughter of Riches:—the former of which assertions may be soon granted, but one cannot so easily subscribe to the latter; for Pride is nearly related to Beggary and Want, either by father or mother, and sometimes by both: and, to speak naturally, it very seldom happens among men to fall out when all have enough; invasions usually travelling from north to south, that is to say, from poverty to plenty. The most ancient and natural grounds of quarrels are lust and avarice; which, though we may allow to be brethren, or collateral branches of pride, are certainly the issues of want. For, to speak in the phrase of writers upon politics, we may observe in the republic of dogs, which in its original seems to be an institution of the many, that the whole state is ever in the profoundest peace after a full meal; and that civil broils arise among them when it happens for one great bone to be seized on by some leading dog, who either divides\
    \ it among the few, and then it falls to an oligarchy, or keeps it to himself, and then it runs up to a tyranny. The same reasoning also holds place among them in those dissensions we behold upon a turgescency in any of their females. For the right of possession lying in common (it being impossible to establish a property in so delicate a case), jealousies and suspicions do so abound, that the whole commonwealth of that street is reduced to a manifest state of war, of every citizen against every citizen, till some one of more courage, conduct, or fortune than the rest seizes and enjoys the prize: upon which naturally arises plenty of heart-burning, and envy, and snarling against the happy dog. Again, if we look upon any of these republics engaged in a foreign war, either of invasion or defence, we shall find the same reasoning will serve as to the grounds and occasions of each; and that poverty or want, in some degree or other (whether real or in opinion, which makes no alteration in the case), has a great share, as well as pride, on the part of the aggressor."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[17]"
    "line_start": 277
    "source_sequence": 7
  "translation_ja": "年代の記録を、しかるべく用心深く調べる者は、戦争は高慢の子であり、高慢は富の娘だと、記されているのを見いだすだろう。前の主張は、すぐ認めてもよいが、後の主張には、そう容易に賛成できない。高慢は、父方か母方、ときには両方で、乞食や欠乏と近い親類だからである。自然に即して言えば、皆が十分に持っているとき、人間同士が争うことは、めったにない。侵略は、普通、北から南へ、つまり、貧乏から豊かさへ向かう。争いの、最も古く自然な原因は、情欲と貪欲である。高慢の兄弟か、傍系の枝とは認めるにしても、確かに欠乏の子なのだ。政治を論じる書き手の言い方を借りれば、犬の共和国を見てみよう。もともとは多数者の制度らしいが、十分に食べたあとでは、国家全体が、いつも、この上ない平和にある。ところが、有力な犬が、大きな骨を一本、手に入れると、内紛が起こる。少数へ分ければ寡頭制へ落ち、自分で独り占めすれば、僭主政へ走るのである。雌のどれかが発情するとき、我々の見る争いにも、同じ議論が当てはまる。この微妙な場合には、所有権を立てることは不可能で、占有の権利は共有されるので、嫉妬と疑惑が、あまりに満ちあふれ、その通りの共和国全体が、市民と市民、すべてが敵となる、明白な戦争状態へ陥る。ほかより勇気、指揮の腕、あるいは幸運を持つ一匹が、獲物を奪い、ものにするまで、そうなのだ。すると当然、ひどい腹立ち、妬み、幸運な犬への唸り声が起こる。さらに、こうした共和国が、侵略にせよ防衛にせよ、外国との戦争へ入るところを見れば、その根拠ときっかけにも、同じ議論が役立つとわかる。攻撃する側には、高慢とともに、何らかの程度の貧しさや欠乏が、大きく関わるのだ。それが実際のものか、思い込みかは、この場合、何の違いも生まない。"
  "translation_status": "reviewed"
- "id": "btb-008"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now whoever will please to take this scheme, and either reduce or adapt it to an intellectual state or commonwealth of learning, will soon discover the first ground of disagreement between the two great parties at this time in arms, and may form just conclusions upon the merits of either cause. But the issue or events of this war are not so easy to conjecture at; for the present quarrel is so inflamed by the warm heads of either faction, and the pretensions somewhere or other so exorbitant, as not to admit the least overtures of accommodation. This quarrel first began, as I have heard it affirmed by an old dweller in the neighbourhood, about a small spot of ground, lying and being upon one of the two tops of the hill Parnassus; the highest and largest of which had, it seems, been time out of mind in quiet possession of certain tenants, called the Ancients; and the other was held by the Moderns. But these disliking their present station, sent certain ambassadors to the Ancients, complaining of a great nuisance; how the height of that part of Parnassus quite spoiled the\
    \ prospect of theirs, especially towards the east; and therefore, to avoid a war, offered them the choice of this alternative, either that the Ancients would please to remove themselves and their effects down to the lower summit, which the Moderns would graciously surrender to them, and advance into their place; or else the said Ancients will give leave to the Moderns to come with shovels and mattocks, and level the said hill as low as they shall think it convenient. To which the Ancients made answer, how little they expected such a message as this from a colony whom they had admitted, out of their own free grace, to so near a neighbourhood. That, as to their own seat, they were aborigines of it, and therefore to talk with them of a removal or surrender was a language they did not understand. That if the height of the hill on their side shortened the prospect of the Moderns, it was a disadvantage they could not help; but desired them to consider whether that injury (if it be any) were not largely recompensed by the shade and shelter it afforded them. That as to the levelling or digging\
    \ down, it was either folly or ignorance to propose it if they did or did not know how that side of the hill was an entire rock, which would break their tools and hearts, without any damage to itself. That they would therefore advise the Moderns rather to raise their own side of the hill than dream of pulling down that of the Ancients; to the former of which they would not only give licence, but also largely contribute. All this was rejected by the Moderns with much indignation, who still insisted upon one of the two expedients; and so this difference broke out into a long and obstinate war, maintained on the one part by resolution, and by the courage of certain leaders and allies; but, on the other, by the greatness of their number, upon all defeats affording continual recruits. In this quarrel whole rivulets of ink have been exhausted, and the virulence of both parties enormously augmented. Now, it must be here understood, that ink is the great missive weapon in all battles of the learned, which, conveyed through a sort of engine called a quill, infinite numbers of these are darted\
    \ at the enemy by the valiant on each side, with equal skill and violence, as if it were an engagement of porcupines. This malignant liquor was compounded, by the engineer who invented it, of two ingredients, which are, gall and copperas; by its bitterness and venom to suit, in some degree, as well as to foment, the genius of the combatants. And as the Grecians, after an engagement, when they could not agree about the victory, were wont to set up trophies on both sides, the beaten party being content to be at the same expense, to keep itself in countenance (a laudable and ancient custom, happily revived of late in the art of war), so the learned, after a sharp and bloody dispute, do, on both sides, hang out their trophies too, whichever comes by the worst. These trophies have largely inscribed on them the merits of the cause; a full impartial account of such a Battle, and how the victory fell clearly to the party that set them up. They are known to the world under several names; as disputes, arguments, rejoinders, brief considerations, answers, replies, remarks, reflections, objections,\
    \ confutations. For a very few days they are fixed up all in public places, either by themselves or their representatives, for passengers to gaze at; whence the chiefest and largest are removed to certain magazines they call libraries, there to remain in a quarter purposely assigned them, and thenceforth begin to be called books of controversy."

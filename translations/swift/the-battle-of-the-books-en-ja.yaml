  "source_text": "On the left wing of the horse Virgil appeared, in shining armour, completely fitted to his body; he was mounted on a dapple-grey steed, the slowness of whose pace was an effect of the highest mettle and vigour. He cast his eye on the adverse wing, with a desire to find an object worthy of his valour, when behold upon a sorrel gelding of a monstrous size appeared a foe, issuing from among the thickest of the enemy’s squadrons; but his speed was less than his noise; for his horse, old and lean, spent the dregs of his strength in a high trot, which, though it made slow advances, yet caused a loud clashing of his armour, terrible to hear. The two cavaliers had now approached within the throw of a lance, when the stranger desired a parley, and, lifting up the visor of his helmet, a face hardly appeared from within which, after a pause, was known for that of the renowned Dryden. The brave Ancient suddenly started, as one possessed with surprise and disappointment together; for the helmet was nine times too large for the head, which appeared situate far in the hinder part, even\
    \ like the lady in a lobster, or like a mouse under a canopy of state, or like a shrivelled beau from within the penthouse of a modern periwig; and the voice was suited to the visage, sounding weak and remote. Dryden, in a long harangue, soothed up the good Ancient; called him father, and, by a large deduction of genealogies, made it plainly appear that they were nearly related. Then he humbly proposed an exchange of armour, as a lasting mark of hospitality between them. Virgil consented (for the goddess Diffidence came unseen, and cast a mist before his eyes), though his was of gold and cost a hundred beeves, the other’s but of rusty iron. However, this glittering armour became the Modern yet worsen than his own. Then they agreed to exchange horses; but, when it came to the trial, Dryden was afraid and utterly unable to mount. . . Alter hiatus . . . . in MS. Lucan appeared upon a fiery horse of admirable shape, but headstrong, bearing the rider where he list over the field; he made a mighty slaughter among the enemy’s horse; which destruction to stop, Blackmore, a famous Modern (but\
    \ one of the mercenaries), strenuously opposed himself, and darted his javelin with a strong hand, which, falling short of its mark, struck deep in the earth. Then Lucan threw a lance; but Æsculapius came unseen and turned off the point. “Brave Modern,” said Lucan, “I perceive some god protects you, for never did my arm so deceive me before: but what mortal can contend with a god? Therefore, let us fight no longer, but present gifts to each other.” Lucan then bestowed on the Modern a pair of spurs, and Blackmore gave Lucan a bridle. . . . Pauca desunt. . . . . . . . Creech: but the goddess Dulness took a cloud, formed into the shape of Horace, armed and mounted, and placed in a flying posture before him. Glad was the cavalier to begin a combat with a flying foe, and pursued the image, threatening aloud; till at last it led him to the peaceful bower of his father, Ogleby, by whom he was disarmed and assigned to his repose."

  "translation_ja": "その間、ウォットンは、手柄を求めて長くさまよい、ついに、人間の言葉でヘリコンと呼ぶ、近くの泉から流れる、小さな川へ着いた。そこで止まり、喉が渇いていたので、この澄んだ流れで癒そうとした。三度、汚れた手で水を唇へ運ぼうとし、三度、すべて指の間から、こぼれ落ちた。そこで、胸を下に伏せた。だが、口が、液体の水晶へ接吻する前に、アポロンが来て、流れの中で、近代派と泉の間へ盾を置いたので、泥しか吸えなかった。地上の、どの泉も、ヘリコンの清さには及ばないが、底には、粘土と泥が、厚く沈んでいるのである。アポロンがユピテルへ、そう願ったのだ。聖められぬ唇で、あえて味わおうとする者への罰、そして、あまり深く、あるいは源から遠くで、汲まぬよう、すべての者への教訓とするためである。"

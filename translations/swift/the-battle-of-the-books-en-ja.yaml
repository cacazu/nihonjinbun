- "id": "btb-004"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Satire is a sort of glass wherein beholders do generally discover everybody’s face but their own; which is the chief reason for that kind reception it meets with in the world, and that so very few are offended with it. But, if it should happen otherwise, the danger is not great; and I have learned from long experience never to apprehend mischief from those understandings I have been able to provoke: for anger and fury, though they add strength to the sinews of the body, yet are found to relax those of the mind, and to render all its efforts feeble and impotent."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[15]"
    "line_start": 254
    "source_sequence": 4
  "translation_ja": "風刺は一種の鏡であって、見る者はたいてい、そこに誰の顔でも見つけるが、自分の顔だけは見つけない。風刺が世間で好意的に迎えられ、腹を立てる者がほとんどいないのは、主としてそのためである。だが、そうならなかったとしても、大した危険はない。長い経験から学んだことだが、私が怒らせることのできた程度の頭脳から、害を受ける心配はないからだ。怒りや激情は、肉体の筋には力を加えても、精神の筋を緩ませ、そのあらゆる働きを弱く、無力にしてしまうとわかっている。"
  "translation_status": "reviewed"
- "id": "btb-005"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "There is a brain that will endure but one scumming; let the owner gather it with discretion, and manage his little stock with husbandry; but, of all things, let him beware of bringing it under the lash of his betters, because that will make it all bubble up into impertinence, and he will find no new supply. Wit without knowledge being a sort of cream, which gathers in a night to the top, and by a skilful hand may be soon whipped into froth; but once scummed away, what appears underneath will be fit for nothing but to be thrown to the hogs."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[16]"
    "line_start": 264
    "source_sequence": 5
  "translation_ja": "上澄みを一度すくえば、それきりという頭もある。持ち主は慎重にすくい取り、ささやかな蓄えを倹約して使うがよい。だが何より、自分よりすぐれた者の鞭の下へ差し出さぬように気をつけることだ。そんなことをすれば、すべてが泡立って、くだらないおしゃべりとなり、あとには何も補充されないだろう。知識のない才知は、一晩で表面にたまるクリームのようなもので、巧みな手にかかれば、たちまち泡に立てられる。しかし、いったんすくい取れば、その下に現れるものは、豚に投げてやるよりほかに使い道がない。"
  "translation_status": "reviewed"
- "id": "btb-006"

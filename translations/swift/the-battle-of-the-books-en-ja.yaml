    "line_start": 312
    "source_sequence": 8
  "translation_ja": "この図式を受け取り、知性の国家、あるいは学問の共和国へ、形を変え、当てはめようとする者は、いま武器を取っている、二大党派の不和の、最初の原因を、すぐに見いだし、どちらの主張が正しいかについても、妥当な結論を出せるだろう。しかし、この戦争の結末や成り行きは、そう容易に推測できない。目下の争いは、双方の党派の熱血漢によって、ひどく燃え上がり、どこかの主張は、あまりに法外で、和解の申し出を、少しも受け入れないからだ。近所の古い住人が断言するのを聞いたところでは、発端は、パルナッソス山の、二つの頂の一方にある、小さな土地だった。高く広いほうの頂は、昔から、古代派と呼ぶ住人たちが、平穏に占有し、もう一方は、近代派が持っていたらしい。だが近代派は、いまの場所が気に入らず、古代派へ使節を送って、大きな迷惑を訴えた。そちらのパルナッソスの高さが、こちらの眺めを、とくに東のほうへ向かって、すっかり台無しにするというのである。そこで、戦争を避けるため、次の二つのうち、どちらかを選べと申し出た。古代派が、身の回りの物とともに、低い頂へ移り、近代派が、恵み深くも譲ってやるその場所と引き換えに、自分たちの場所へ、近代派を進ませるか。それとも、近代派が鋤と鍬を持って来て、好きな高さまで山を削り、平らにすることを、許すかである。古代派は答えた。まったく自発的な恩恵から、これほど近い隣に住むのを認めた入植者に、このような口上を受けるとは、少しも思わなかった、と。自分たちの住まいについては、もともとの住人なのだから、移転や明け渡しの話をされても、理解できぬ言葉だ、と。こちらの山の高さが、近代派の眺めを狭めるなら、どうしようもない不利だが、そこから得る日陰や風よけで、その損害なるものは、もし損害なら、十分すぎるほど埋め合わされていないか、考えてほしい、と。平らにしたり、掘り崩したりすることについては、こちら側の山が、すべて一枚岩だと、知っていて提案するなら愚か、知らずにするなら無知である。岩そのものには傷もつかず、道具と心が砕けるだけだからだ、と。だから、古代派の山を壊す夢を見るより、自分たちの側を高くするよう勧める。それなら、許すばかりでなく、大いに力も貸そう、と。近代派は、これをすべて、ひどく憤って退け、相変わらず、二つの方策の一方を言い張った。こうして、不和は、長く頑固な戦争となった。一方は、決意と、ある指導者や同盟者の勇気によって支えられ、他方は、数の多さによって、負けるたびに、絶えず補充を送り込んで支えた。この争いでは、幾筋もの小川ほどのインクが使い果たされ、双方の毒気は、途方もなく増した。ここで心得ておくべきことだが、インクは、学者の、あらゆる合戦における、主要な飛び道具である。羽根ペンという、一種の機械を通して運ばれ、双方の勇士が、無数のそれを、等しい巧みさと激しさで敵へ投げつける。まるで、山嵐の戦いのようだ。この悪性の液体は、発明した技師が、没食子と緑礬という、二つの材料で作った。その苦さと毒で、戦う者の気質に、幾らか似せるとともに、それを煽るためである。そして、ギリシア人が、戦いのあと、勝敗で一致しないとき、双方に戦勝の記念を立て、負けた側も、顔を保つため、同じ費用を喜んで出したように――称賛すべき古い習慣で、近ごろ、幸いにも兵法のうちに復活した――学者も、激しく血なまぐさい論争のあと、どちらが負けようと、双方で、戦勝の記念を掲げる。そこには、主張の正しさ、ある合戦の完全で公平な報告、そして、記念を立てた側の勝利が、いかに明白だったかが、大きく書かれている。世間では、論争、議論、再反駁、短い考察、答弁、応答、所見、省察、異論、論駁など、さまざまな名で知られる。ごく数日の間、本人か代理人によって、公の場所へ掲げられ、通行人の目にさらされる。その中で、最も大きく、主だったものは、図書館という倉庫へ移され、特に割り当てられた一角へ置かれ、その後は、論争書と呼ばれ始めるのである。"
  "translation_status": "reviewed"
- "id": "btb-009"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "In these books is wonderfully instilled and preserved the spirit of each warrior while he is alive; and after his death his soul transmigrates thither to inform them. This, at least, is the more common opinion; but I believe it is with libraries as with other cemeteries, where some philosophers affirm that a certain spirit, which they call brutum hominis, hovers over the monument, till the body is corrupted and turns to dust or to worms, but then vanishes or dissolves; so, we may say, a restless spirit haunts over every book, till dust or worms have seized upon it—which to some may happen in a few days, but to others later—and therefore, books of controversy being, of all others, haunted by the most disorderly spirits, have always been confined in a separate lodge from the rest, and for fear of a mutual violence against each other, it was thought prudent by our ancestors to bind them to the peace with strong iron chains. Of which invention the original occasion was this: When the works of Scotus first came out, they were carried to a certain library, and had lodgings\
    \ appointed them; but this author was no sooner settled than he went to visit his master Aristotle, and there both concerted together to seize Plato by main force, and turn him out from his ancient station among the divines, where he had peaceably dwelt near eight hundred years. The attempt succeeded, and the two usurpers have reigned ever since in his stead; but, to maintain quiet for the future, it was decreed that all polemics of the larger size should be hold fast with a chain."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[19]"
    "line_start": 389
    "source_sequence": 9
  "translation_ja": "こうした書物には、勇士の生前、その気魄が、驚くべき仕方で注ぎ込まれ、保存される。そして、死後は、その魂が移り住み、書物へ命を与える。少なくとも、よくある意見は、そういうものだ。しかし私は、図書館も、ほかの墓地と同じだと信じる。ある哲学者たちの言うところでは、墓の上には、ブルートゥム・ホミニス、すなわち、人間の獣的な部分と呼ぶ、ある霊が漂い、体が腐り、塵や虫になると、消えるか、溶けてなくなるという。同じように、どの本の上にも、落ち着かぬ霊が取りつき、塵や虫が、それを捕らえるまで続くと言えよう。ある本では、数日でそうなるが、ほかでは、もっと遅い。したがって、あらゆる本のうち、最も乱暴な霊の取りつく論争書は、いつも、ほかと別の宿へ閉じ込められてきた。互いに暴力を振るうのを恐れ、先祖たちは、丈夫な鉄鎖で、平和を守るよう縛るのが、賢明だと考えた。その工夫が、初めて必要になったのは、こういうことからだった。スコトゥスの著作が初めて出たとき、ある図書館へ運ばれ、宿を割り当てられた。ところが、落ち着くやいなや、師のアリストテレスを訪ね、二人で相談し、プラトンを力ずくで捕らえ、八百年近く、平穏に住んできた、神学者たちの中の古い座から、追い出した。企ては成功し、この二人の簒奪者は、それ以来、その代わりに君臨している。しかし、今後の静けさを保つため、大型の論争書は、すべて鎖で、しっかり留めねばならぬと、定められたのである。"
  "translation_status": "reviewed"
- "id": "btb-010"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "By this expedient, the public peace of libraries might certainly have been preserved if a new species of controversial books had not arisen of late years, instinct with a more malignant spirit, from the war above mentioned between the learned about the higher summit of Parnassus."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[20]"
    "line_start": 415
    "source_sequence": 10
  "translation_ja": "この方策で、図書館の公共の平和も、確かに保たれただろう。近年、先に述べた、パルナッソスの高い頂をめぐる学者の戦争から、いっそう悪性の霊を吹き込まれた、新種の論争書が現れなかったならば。"
  "translation_status": "reviewed"
- "id": "btb-011"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "When these books were first admitted into the public libraries, I remember to have said, upon occasion, to several persons concerned, how I was sure they would create broils wherever they came, unless a world of care were taken; and therefore I advised that the champions of each side should be coupled together, or otherwise mixed, that, like the blending of contrary poisons, their malignity might be employed among themselves. And it seems I was neither an ill prophet nor an ill counsellor; for it was nothing else but the neglect of this caution which gave occasion to the terrible fight that happened on Friday last between the Ancient and Modern Books in the King’s library. Now, because the talk of this battle is so fresh in everybody’s mouth, and the expectation of the town so great to be informed in the particulars, I, being possessed of all qualifications requisite in an historian, and retained by neither party, have resolved to comply with the urgent importunity of my friends, by writing down a full impartial account thereof."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[21]"
    "line_start": 420
    "source_sequence": 11
  "translation_ja": "こうした本が、初めて公共の図書館へ入れられたとき、機会を見て、関係者の幾人かに、こう言ったのを覚えている。よほど気をつけない限り、行く先々で騒ぎを起こすに違いない、と。だから、双方の勇士を、一組ずつ結ぶか、ほかの仕方で混ぜ、反対の毒を混ぜるときのように、その毒気を、互いの間で使わせるのがよいと、忠告した。私は、悪い予言者でも、悪い助言者でもなかったらしい。ほかならぬ、この注意を怠ったことが、先週の金曜日、国王の図書館で、古代と近代の書物の間に起きた、あの恐ろしい合戦の原因となったからだ。いま、この合戦の話は、誰の口にも新しく、世間は、その細部を知ろうと、大きな期待を寄せている。そこで、歴史家に必要な資格を、すべて備え、どちらの党にも雇われていない私は、友人たちの、やかましい催促に応じ、完全で公平な報告を書くことに決めた。"
  "translation_status": "reviewed"
- "id": "btb-012"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The guardian of the regal library, a person of great valour, but chiefly renowned for his humanity, had been a fierce champion for the Moderns, and, in an engagement upon Parnassus, had vowed with his own hands to knock down two of the ancient chiefs who guarded a small pass on the superior rock, but, endeavouring to climb up, was cruelly obstructed by his own unhappy weight and tendency towards his centre, a quality to which those of the Modern party are extremely subject; for, being light-headed, they have, in speculation, a wonderful agility, and conceive nothing too high for them to mount, but, in reducing to practice, discover a mighty pressure about their posteriors and their heels. Having thus failed in his design, the disappointed champion bore a cruel rancour to the Ancients, which he resolved to gratify by showing all marks of his favour to the books of their adversaries, and lodging them in the fairest apartments; when, at the same time, whatever book had the boldness to own itself for an advocate of the Ancients was buried alive in some obscure corner, and\
    \ threatened, upon the least displeasure, to be turned out of doors. Besides, it so happened that about this time there was a strange confusion of place among all the books in the library, for which several reasons were assigned. Some imputed it to a great heap of learned dust, which a perverse wind blew off from a shelf of Moderns into the keeper’s eyes. Others affirmed he had a humour to pick the worms out of the schoolmen, and swallow them fresh and fasting, whereof some fell upon his spleen, and some climbed up into his head, to the great perturbation of both. And lastly, others maintained that, by walking much in the dark about the library, he had quite lost the situation of it out of his head; and therefore, in replacing his books, he was apt to mistake and clap Descartes next to Aristotle, poor Plato had got between Hobbes and the Seven Wise Masters, and Virgil was hemmed in with Dryden on one side and Wither on the other."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[22]"
    "line_start": 438
    "source_sequence": 12
  "translation_ja": "王室図書館の守護者は、たいへん勇猛な人物だったが、とりわけ、人情で名高かった。かつて近代派の激しい闘士として、パルナッソスの戦いでは、高い岩の小さな隘路を守る、古代の首領二人を、自分の手で打ち倒すと誓ったことがあった。だが、登ろうとすると、不運にも、自分の重さと、中心へ引かれる傾きに、ひどく妨げられた。近代派の者には、きわめてありがちな性質である。頭が軽いので、思弁では、驚くほど身軽で、登るのに高すぎるものなど、考えもしない。しかし、実行へ移すとなると、尻や踵のあたりに、たいへんな重みを発見するのである。こうして企てに失敗し、失望した闘士は、古代派に、ひどい恨みを抱いた。そこで、敵側の本へ、あらゆる好意を示し、最も美しい部屋へ置くことで、晴らそうとした。その一方で、大胆にも古代派の味方を名乗る本は、暗い隅へ生き埋めにされ、ほんの少しでも機嫌を損ねれば、外へ追い出すと脅された。そのうえ、このころ、図書館の本の置き場所が、奇妙に混乱し、さまざまな理由が挙げられた。近代派の棚から、ひねくれた風が、学問の埃を大量に吹き落とし、管理人の目へ入れたせいだ、とする者もいた。別の者は、スコラ学者の本から虫を拾い出し、新鮮なまま、空き腹へ飲み込む癖があるのだ、と断言した。その虫の、あるものは脾臓へ落ち、あるものは頭へ登り、両方を大いにかき乱したという。最後には、暗闇の図書館を、あまりに歩き回ったため、配置を、すっかり頭から失ったのだ、と主張する者もいた。そのため、本を戻すと、間違いやすく、デカルトをアリストテレスの隣へ押し込み、気の毒なプラトンは、ホッブズと『七賢人物語』の間へ入り、ウェルギリウスは、片側をドライデン、もう片側をウィザーに挟まれていた。"
  "translation_status": "reviewed"
- "id": "btb-013"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Meanwhile, those books that were advocates for the Moderns, chose out one from among them to make a progress through the whole library, examine the number and strength of their party, and concert their affairs. This messenger performed all things very industriously, and brought back with him a list of their forces, in all, fifty thousand, consisting chiefly of light-horse, heavy-armed foot, and mercenaries; whereof the foot were in general but sorrily armed and worse clad; their horses large, but extremely out of case and heart; however, some few, by trading among the Ancients, had furnished themselves tolerably enough."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[23]"
    "line_start": 471
    "source_sequence": 13
  "translation_ja": "その間、近代派に味方する本どもは、仲間から一冊を選び、図書館全体を巡って、党の数と力を調べ、段取りを整えさせた。使者は、すべてを、たいそう熱心に行い、兵力の名簿を持ち帰った。総勢五万、主として軽騎兵、重装歩兵、傭兵からなっていた。歩兵は、概して装備が悪く、衣服は、さらにひどかった。馬は大きいが、ひどく痩せ、元気もなかった。もっとも、古代派との取引で、まずまず身支度を整えた者も、わずかながらいた。"
  "translation_status": "reviewed"
- "id": "btb-014"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "While things were in this ferment, discord grew extremely high; hot words passed on both sides, and ill blood was plentifully bred. Here a solitary Ancient, squeezed up among a whole shelf of Moderns, offered fairly to dispute the case, and to prove by manifest reason that the priority was due to them from long possession, and in regard of their prudence, antiquity, and, above all, their great merits toward the Moderns. But these denied the premises, and seemed very much to wonder how the Ancients could pretend to insist upon their antiquity, when it was so plain (if they went to that) that the Moderns were much the more ancient of the two. As for any obligations they owed to the Ancients, they renounced them all. “It is true,” said they, “we are informed some few of our party have been so mean as to borrow their subsistence from you, but the rest, infinitely the greater number (and especially we French and English), were so far from stooping to so base an example, that there never passed, till this very hour, six words between us. For our horses were of our own breeding,\
    \ our arms of our own forging, and our clothes of our own cutting out and sewing.” Plato was by chance up on the next shelf, and observing those that spoke to be in the ragged plight mentioned a while ago, their jades lean and foundered, their weapons of rotten wood, their armour rusty, and nothing but rags underneath, he laughed loud, and in his pleasant way swore, by ---, he believed them."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[24]"
    "line_start": 482
    "source_sequence": 14
  "translation_ja": "事態が、こうして沸き立つ間、不和は、ひどく高まり、双方で激しい言葉が交わされ、悪感情が、たっぷり育った。ここで、近代派の棚一つ分に、押し込まれていた、孤立した古代派の一冊が、公平に論じ合おうと申し出た。長い占有と、思慮深さ、古さ、そして、とりわけ、近代派へ尽くした大きな功績から、優先権は自分たちにあることを、明白な理性で証明しよう、というのである。しかし、相手は前提を否定し、そういう話なら、二者のうち、近代派のほうが、ずっと古いのは明白なのに、古代派が古さを主張するとは、どうしたことかと、大いに不思議がる様子だった。古代派に負う恩があるという点も、すべて否認した。「たしかに」と彼らは言った。「我々の党の、わずかな者が、卑しくも、そちらから生活の糧を借りたと、聞いてはいる。だが、残りの、はるかに多い大多数、とりわけ、我々フランス人とイングランド人は、そんな低い模範に屈するどころか、この瞬間まで、六語の言葉さえ、互いに交わしたことがない。我々の馬は、自分で育て、武器は、自分で鍛え、衣服は、自分で裁ち、縫ったものなのだから」。たまたま、次の棚の上にいたプラトンは、話す者たちが、先ほど述べた、ぼろぼろのありさまで、駄馬は痩せ、脚を悪くし、武器は腐った木、鎧は錆び、その下は、ぼろしかないと見て、大声で笑った。そして、いつもの陽気な仕方で、――にかけて、彼らを信じる、と誓った。"
  "translation_status": "reviewed"
- "id": "btb-015"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Now, the Moderns had not proceeded in their late negotiation with secrecy enough to escape the notice of the enemy. For those advocates who had begun the quarrel, by setting first on foot the dispute of precedency, talked so loud of coming to a battle, that Sir William Temple happened to overhear them, and gave immediate intelligence to the Ancients, who thereupon drew up their scattered troops together, resolving to act upon the defensive; upon which, several of the Moderns fled over to their party, and among the rest Temple himself. This Temple, having been educated and long conversed among the Ancients, was, of all the Moderns, their greatest favourite, and became their greatest champion."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[25]"
    "line_start": 507
    "source_sequence": 15
  "translation_ja": "ところで、近代派の、先の交渉は、敵の注意を逃れるほど、ひそかには行われなかった。最初に優先権の論争を持ち出して、争いを始めた弁護者たちが、戦いになると、あまり大声で話したので、ウィリアム・テンプル卿が、たまたま聞きつけ、ただちに古代派へ知らせたのである。古代派は、散らばる軍勢を集め、防御に徹すると決めた。すると、近代派の幾人かが、相手の党へ走り、その中には、テンプル自身もいた。このテンプルは、古代派のもとで教育を受け、長く交わったため、近代派のうち、最も深く気に入られており、彼らの最大の闘士となった。"
  "translation_status": "reviewed"

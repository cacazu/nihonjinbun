  "translation_ja": "次に、アリストテレスは、猛烈な顔つきでベーコンが進むのを見て、矢尻まで弓を引き、矢を放った。勇敢な近代派には当たらず、頭上を唸って飛んだが、デカルトに命中した。鋼の穂先は、すぐに兜の弱点を見つけ、革と厚紙を貫き、右目へ入った。痛みの苦しみは、勇ましい弓兵を、ぐるぐる回したが、やがて死が、強い影響力を持つ星のように、自分の渦へ引き込んだ。〔原稿のここに、大きな欠落〕…………そのとき、ホメロスが騎兵の先頭に現れた。荒れ狂う馬に乗り、本人も、やっと扱っていたが、ほかの人間には、近寄る勇気さえなかった。敵の列の中を駆け、行く手の、すべてをなぎ倒した。女神よ、初めに誰を殺し、最後に誰を殺したか、告げたまえ。まず、ゴンディバートが、重い鎧を着け、落ち着いた、おとなしい去勢馬に乗り、立ち向かった。馬は、速さよりも、乗り手が乗り降りするとき、いつでも膝をつく、従順さで名高かった。彼はパラスへ、ホメロスの鎧を奪うまで、戦場を去らないと誓っていた。一度も、着る者を見ず、その力も知らなかった、狂人よ。ホメロスは、馬も人も地へ倒し、踏みつけられ、泥で息を詰まらせるに任せた。次には、長槍で、頑丈な近代派、デナムを殺した。父方ではアポロンの血を引いたが、母は人間だった。倒れて、大地を噛んだ。天の部分は、アポロンが取って星にしたが、地の部分は、地上をのたうった。それからホメロスは、馬の後ろ蹄の一蹴りで、サム・ウェズリーを殺し、ペローを、怪力で鞍から引き抜き、フォントネルへ投げつけ、一撃で、二人の脳髄を、打ち砕いた。"

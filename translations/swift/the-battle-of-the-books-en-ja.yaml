- "id": "btb-021"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "It is wonderful to conceive the tumult arisen among the books upon the close of this long descant of Æsop: both parties took the hint, and heightened their animosities so on a sudden, that they resolved it should come to a battle. Immediately the two main bodies withdrew, under their several ensigns, to the farther parts of the library, and there entered into cabals and consults upon the present emergency. The Moderns were in very warm debates upon the choice of their leaders; and nothing less than the fear impending from their enemies could have kept them from mutinies upon this occasion. The difference was greatest among the horse, where every private trooper pretended to the chief command, from Tasso and Milton to Dryden and Wither. The light-horse were commanded by Cowley and Despreaux. There came the bowmen under their valiant leaders, Descartes, Gassendi, and Hobbes; whose strength was such that they could shoot their arrows beyond the atmosphere, never to fall down again, but turn, like that of Evander, into meteors; or, like the cannon-ball, into stars. Paracelsus\
    \ brought a squadron of stinkpot-flingers from the snowy mountains of Rhætia. There came a vast body of dragoons, of different nations, under the leading of Harvey, their great aga: part armed with scythes, the weapons of death; part with lances and long knives, all steeped in poison; part shot bullets of a most malignant nature, and used white powder, which infallibly killed without report. There came several bodies of heavy-armed foot, all mercenaries, under the ensigns of Guicciardini, Davila, Polydore Vergil, Buchanan, Mariana, Camden, and others. The engineers were commanded by Regiomontanus and Wilkins. The rest was a confused multitude, led by Scotus, Aquinas, and Bellarmine; of mighty bulk and stature, but without either arms, courage, or discipline. In the last place came infinite swarms of calones, a disorderly rout led by L’Estrange; rogues and ragamuffins, that follow the camp for nothing but the plunder, all without coats to cover them."

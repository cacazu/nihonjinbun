  "source_text": "At the fountain-head Wotton discerned two heroes; the one he could not distinguish, but the other was soon known for Temple, general of the allies to the Ancients. His back was turned, and he was employed in drinking large draughts in his helmet from the fountain, where he had withdrawn himself to rest from the toils of the war. Wotton, observing him, with quaking knees and trembling hands, spoke thus to himself: O that I could kill this destroyer of our army, what renown should I purchase among the chiefs! but to issue out against him, man against man, shield against shield, and lance against lance, what Modern of us dare? for he fights like a god, and Pallas or Apollo are ever at his elbow. But, O mother! if what Fame reports be true, that I am the son of so great a goddess, grant me to hit Temple with this lance, that the stroke may send him to hell, and that I may return in safety and triumph, laden with his spoils. The first part of this prayer the gods granted at the intercession of his mother and of Momus; but the rest, by a perverse wind sent from Fate, was scattered\
    \ in the air. Then Wotton grasped his lance, and, brandishing it thrice over his head, darted it with all his might; the goddess, his mother, at the same time adding strength to his arm. Away the lance went hizzing, and reached even to the belt of the averted Ancient, upon which, lightly grazing, it fell to the ground. Temple neither felt the weapon touch him nor heard it fall: and Wotton might have escaped to his army, with the honour of having remitted his lance against so great a leader unrevenged; but Apollo, enraged that a javelin flung by the assistance of so foul a goddess should pollute his fountain, put on the shape of ---, and softly came to young Boyle, who then accompanied Temple: he pointed first to the lance, then to the distant Modern that flung it, and commanded the young hero to take immediate revenge. Boyle, clad in a suit of armour which had been given him by all the gods, immediately advanced against the trembling foe, who now fled before him. As a young lion in the Libyan plains, or Araby desert, sent by his aged sire to hunt for prey, or health, or exercise, he\
    \ scours along, wishing to meet some tiger from the mountains, or a furious boar; if chance a wild ass, with brayings importune, affronts his ear, the generous beast, though loathing to distain his claws with blood so vile, yet, much provoked at the offensive noise, which Echo, foolish nymph, like her ill-judging sex, repeats much louder, and with more delight than Philomela’s song, he vindicates the honour of the forest, and hunts the noisy long-eared animal. So Wotton fled, so Boyle pursued. But Wotton, heavy-armed, and slow of foot, began to slack his course, when his lover Bentley appeared, returning laden with the spoils of the two sleeping Ancients. Boyle observed him well, and soon discovering the helmet and shield of Phalaris his friend, both which he had lately with his own hands new polished and gilt, rage sparkled in his eyes, and, leaving his pursuit after Wotton, he furiously rushed on against this new approacher. Fain would he be revenged on both; but both now fled different ways: and, as a woman in a little house that gets a painful livelihood by spinning, if chance\
    \ her geese be scattered o’er the common, she courses round the plain from side to side, compelling here and there the stragglers to the flock; they cackle loud, and flutter o’er the champaign; so Boyle pursued, so fled this pair of friends: finding at length their flight was vain, they bravely joined, and drew themselves in phalanx. First Bentley threw a spear with all his force, hoping to pierce the enemy’s breast; but Pallas came unseen, and in the air took off the point, and clapped on one of lead, which, after a dead bang against the enemy’s shield, fell blunted to the ground. Then Boyle, observing well his time, took up a lance of wondrous length and sharpness; and, as this pair of friends compacted, stood close side by side, he wheeled him to the right, and, with unusual force, darted the weapon. Bentley saw his fate approach, and flanking down his arms close to his ribs, hoping to save his body, in went the point, passing through arm and side, nor stopped or spent its force till it had also pierced the valiant Wotton, who, going to sustain his dying friend, shared his fate.\
    \ As when a skilful cook has trussed a brace of woodcocks, he with iron skewer pierces the tender sides of both, their legs and wings close pinioned to the rib; so was this pair of friends transfixed, till down they fell, joined in their lives, joined in their deaths; so closely joined that Charon would mistake them both for one, and waft them over Styx for half his fare. Farewell, beloved, loving pair; few equals have you left behind: and happy and immortal shall you be, if all my wit and eloquence can make you."

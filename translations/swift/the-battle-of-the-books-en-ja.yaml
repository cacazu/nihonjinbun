  "translation_ja": "泉の湧き口に、ウォットンは、二人の勇士を見た。一人は見分けられなかったが、もう一人は、すぐ、古代派の同盟軍の将、テンプルとわかった。背を向け、兜で泉から、たっぷり水を飲んでいた。戦争の疲れを休めるため、退いていたのである。それを見たウォットンは、膝を震わせ、手をわななかせ、こう独り言を言った。ああ、我が軍を滅ぼす、この者を殺せたなら、首領たちの間で、どれほど名声を得られよう。しかし、人と人、盾と盾、槍と槍で立ち向かう勇気が、我々近代派の誰にあるだろう。神のように戦い、パラスかアポロンが、いつも肘のそばにいるのだから。だが、母よ、これほど偉大な女神の息子だという、名声の女神の話が真実なら、この槍をテンプルへ命中させ、一撃で地獄へ送り、戦利品を抱え、無事、勝利の帰還を遂げさせたまえ。この祈りの初めの部分は、母とモモスの取りなしで、神々が聞き入れた。だが、残りは、運命の送った、つむじ曲がりの風に、空中へ散らされた。そこでウォットンは槍を握り、頭上で三度振り、力いっぱい投げた。女神たる母も、同時に腕へ力を加えた。槍は唸って飛び、背を向けた古代派の帯まで達し、軽くかすめて、地へ落ちた。テンプルは、武器の触れたのも感じず、落ちた音も聞かなかった。ウォットンは、これほど偉大な将へ槍を投げ、報復も受けなかった名誉を携え、自軍へ逃げ帰れたかもしれない。しかし、アポロンは、これほど醜い女神の助けで投げた槍が、泉を汚したことへ怒り、――の姿となり、そのとき、テンプルに同行していた、若いボイルへ、そっと近づいた。まず槍を、次に、それを投げた遠い近代派を指し、ただちに仇を討てと、若い勇士へ命じた。すべての神々から与えられた、一揃いの鎧を着けたボイルは、すぐに、震える敵へ進み、敵は逃げ出した。リビアの平原か、アラビアの砂漠で、老いた父から、獲物を捕るため、健康のため、運動のために送り出された、若い獅子のように駆けた。山の虎か、猛る猪へ会いたいと思っていると、たまたま、うるさく鳴く野驢馬が、耳を辱める。気高い獣は、これほど卑しい血で爪を汚すのを嫌うが、不快な声に、ひどく怒る。愚かなニンフ、エコーも、判断の悪い同性の仲間らしく、フィロメラの歌より、ずっと大きく、ずっと喜んで繰り返す。そこで、森の名誉を守るため、騒々しい、耳の長い動物を追う。ウォットンは、そのように逃げ、ボイルは、そのように追った。しかし、重装備で、足の遅いウォットンの走りは、鈍り始めた。そこへ、眠る古代派二人の戦利品を抱えて戻る、彼を愛するベントリーが現れた。ボイルは、よく見て、友ファラリスの兜と盾を、すぐに見つけた。近ごろ、自分の手で磨き、金箔を施したものだった。目に怒りが閃き、ウォットンの追跡をやめ、新たに来る者へ、猛烈に突進した。どちらにも仇を討ちたかったが、二人は、別々へ逃げた。小さな家で、糸を紡ぎ、苦しい暮らしを立てる女が、共有地に鵞鳥を散らしてしまうと、平地を、あちらへこちらへ走り回り、はぐれた者を、あちこちで群れへ戻すようなものだった。鵞鳥は、大声で鳴き、野を羽ばたく。ボイルは、そのように追い、二人の友は、そのように逃げた。ついに、逃走も無駄だとわかると、勇敢にも合流し、密集陣を組んだ。まずベントリーが、敵の胸を貫こうと、全力で槍を投げた。だがパラスが、見えぬまま来て、空中で穂先を外し、鉛の穂を取りつけた。それは、敵の盾へ鈍く当たり、潰れて地へ落ちた。次にボイルは、よく機をうかがい、驚くほど長く鋭い槍を取った。二人の友が、ぴったり横に並んで固まると、右へ回り、並外れた力で、その武器を投げた。ベントリーは、運命が迫るのを見ると、体を守ろうと、両腕を、肋骨へ、ぴたりと下ろした。穂先は、腕と脇腹を通り抜け、その勢いを止めず、使い果たさず、死にゆく友を支えようとした、勇敢なウォットンまでも貫き、同じ運命を分け合わせた。腕のよい料理人が、山鷸二羽の、脚と翼を肋へぴたりと縛り、鉄串で、柔らかな両方の脇を刺し通すようなものだった。二人の友は、そのように串刺しになり、倒れた。生きて結ばれ、死んで結ばれ、あまりに固く結ばれたので、カロンも二人を一人と間違え、半額の船賃で、ステュクスを渡すだろう。さらば、愛され、愛し合う二人よ。残した者に、比肩する者は少ない。私の機知と雄弁の、すべてで、そうできるなら、幸せに、不滅となるだろう。"

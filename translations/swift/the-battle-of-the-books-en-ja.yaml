  "translation_ja": "イソップの、この長い談論が終わったとき、本どもの間に起きた騒ぎは、想像するにも驚くほどだった。双方が合図を受け取り、たちまち敵意を高め、合戦に訴えると決めた。すぐに、二つの主力は、それぞれの旗のもと、図書館の奥へ退き、この危急の事態について、密議と相談を始めた。近代派は、指導者の選択をめぐり、ひどく熱い論議になった。敵の差し迫る恐れがなければ、この機に、反乱を起こさずには済まなかったろう。とくに騎兵の争いが大きく、タッソ、ミルトンから、ドライデン、ウィザーまで、一兵卒が、皆、最高の指揮権を求めた。軽騎兵は、カウリーとデプレオーが率いた。弓兵は、勇敢な指導者、デカルト、ガッサンディ、ホッブズのもとに来た。その力は、大気の外まで矢を射るほどで、矢は二度と落ちず、エウアンドロスの矢のように流星となり、あるいは、砲弾のように星となった。パラケルススは、ラエティアの雪山から、悪臭弾投げの一隊を連れてきた。さまざまな国の、膨大な竜騎兵が、その大アガたるハーヴィーの指揮で来た。ある者は、死の武器である大鎌を持ち、ある者は、すべて毒に浸した槍や長い刃物を持った。ある者は、最も悪性の弾を撃ち、音を立てずに、必ず殺す、白い火薬を使った。重装歩兵の幾隊もが、グイッチャルディーニ、ダヴィラ、ポリドール・ヴァージル、ブキャナン、マリアナ、カムデンらの旗のもとに来た。すべて傭兵だった。工兵は、レギオモンタヌスとウィルキンズが率いた。残りは、スコトゥス、アクイナス、ベラルミーノに率いられた、雑然とした大群で、体も背丈も大きいが、武器も、勇気も、規律もなかった。最後には、カロネス、すなわち陣営の雑役者たちの、無数の群れが来た。レストレンジに率いられた、乱れた群衆で、略奪だけを目当てに従軍する、悪党や、ぼろをまとう連中だった。皆、身を覆う上着もなかった。"
  "translation_status": "reviewed"
- "id": "btb-022"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The army of the Ancients was much fewer in number; Homer led the horse, and Pindar the light-horse; Euclid was chief engineer; Plato and Aristotle commanded the bowmen; Herodotus and Livy the foot; Hippocrates, the dragoons; the allies, led by Vossius and Temple, brought up the rear."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[32]"
    "line_start": 718
    "source_sequence": 22
  "translation_ja": "古代派の軍は、数では、はるかに少なかった。ホメロスが騎兵、ピンダロスが軽騎兵を率い、エウクレイデスが工兵長となり、プラトンとアリストテレスが弓兵、ヘロドトスとリウィウスが歩兵、ヒポクラテスが竜騎兵を指揮した。フォッシウスとテンプルに率いられた同盟軍が、後衛となった。"
  "translation_status": "reviewed"
- "id": "btb-023"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "All things violently tending to a decisive battle, Fame, who much frequented, and had a large apartment formerly assigned her in the regal library, fled up straight to Jupiter, to whom she delivered a faithful account of all that passed between the two parties below; for among the gods she always tells truth. Jove, in great concern, convokes a council in the Milky Way. The senate assembled, he declares the occasion of convening them; a bloody battle just impendent between two mighty armies of ancient and modern creatures, called books, wherein the celestial interest was but too deeply concerned. Momus, the patron of the Moderns, made an excellent speech in their favour, which was answered by Pallas, the protectress of the Ancients. The assembly was divided in their affections; when Jupiter commanded the Book of Fate to be laid before him. Immediately were brought by Mercury three large volumes in folio, containing memoirs of all things past, present, and to come. The clasps were of silver double gilt, the covers of celestial turkey leather, and the paper such as here\
    \ on earth might pass almost for vellum. Jupiter, having silently read the decree, would communicate the import to none, but presently shut up the book."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[33]"
    "line_start": 723
    "source_sequence": 23
  "translation_ja": "何もかもが、雌雄を決する合戦へ、激しく向かっていた。王室図書館へ、たびたび通い、以前から広い部屋も割り当てられていた、名声の女神は、まっすぐユピテルへ飛び上がり、下の二党の間に起きたことを、すべて忠実に報告した。神々の間では、いつも真実を語るのである。ユピテルは、大いに心を痛め、銀河で会議を召集した。神々の会議が集まると、召集の理由を告げた。本と呼ばれる、古代と近代の生き物の、強大な二軍の間に、いま、血なまぐさい合戦が迫り、天上の利害も、あまりに深く関わっているのだ、と。近代派の守護神、モモスは、彼らのため、見事な演説をし、古代派の守護者、パラスが、それに答えた。会議の心は二つに分かれた。そこで、ユピテルは、運命の書を持ってくるよう命じた。メルクリウスが、すぐに、大きな二つ折判三巻を運んできた。過去、現在、未来の、あらゆる事柄の記録を収めていた。留め金は、二重の金箔を施した銀、表紙は、天上のトルコ革、紙は、地上なら、ほとんど犢皮紙として通るようなものだった。ユピテルは、黙って定めを読み、意味を誰にも伝えず、すぐに本を閉じた。"
  "translation_status": "reviewed"
- "id": "btb-024"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Without the doors of this assembly there attended a vast number of light, nimble gods, menial servants to Jupiter: those are his ministering instruments in all affairs below. They travel in a caravan, more or less together, and are fastened to each other like a link of galley-slaves, by a light chain, which passes from them to Jupiter’s great toe: and yet, in receiving or delivering a message, they may never approach above the lowest step of his throne, where he and they whisper to each other through a large hollow trunk. These deities are called by mortal men accidents or events; but the gods call them second causes. Jupiter having delivered his message to a certain number of these divinities, they flew immediately down to the pinnacle of the regal library, and consulting a few minutes, entered unseen, and disposed the parties according to their orders."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[34]"
    "line_start": 744
    "source_sequence": 24
  "translation_ja": "会議の戸の外には、軽く、身のすばやい神々が、大勢控えていた。ユピテルの下僕で、下界の、あらゆる事柄で、その働きの道具となる者たちである。多かれ少なかれ、群れをなして旅し、ガレー船の奴隷の列のように、軽い鎖で、互いに結ばれていた。鎖は、彼らから、ユピテルの足の親指へ通じていた。それでも、用件を受けたり伝えたりするとき、玉座の、いちばん下の段より上へは、決して近づけず、大きな中空の管を通して、互いに囁いた。この神々を、人間は偶然や出来事と呼ぶが、神々は、第二原因と呼ぶ。ユピテルが、そのうち幾柱かへ用件を授けると、ただちに王室図書館の尖頂へ飛び降り、数分相談してから、見えぬまま入り、命令どおり、双方を配置した。"
  "translation_status": "reviewed"
- "id": "btb-025"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Meanwhile Momus, fearing the worst, and calling to mind an ancient prophecy which bore no very good face to his children the Moderns, bent his flight to the region of a malignant deity called Criticism. She dwelt on the top of a snowy mountain in Nova Zembla; there Momus found her extended in her den, upon the spoils of numberless volumes, half devoured. At her right hand sat Ignorance, her father and husband, blind with age; at her left, Pride, her mother, dressing her up in the scraps of paper herself had torn. There was Opinion, her sister, light of foot, hood-winked, and head-strong, yet giddy and perpetually turning. About her played her children, Noise and Impudence, Dulness and Vanity, Positiveness, Pedantry, and Ill-manners. The goddess herself had claws like a cat; her head, and ears, and voice resembled those of an ass; her teeth fallen out before, her eyes turned inward, as if she looked only upon herself; her diet was the overflowing of her own gall; her spleen was so large as to stand prominent, like a dug of the first rate; nor wanted excrescences in form\
    \ of teats, at which a crew of ugly monsters were greedily sucking; and, what is wonderful to conceive, the bulk of spleen increased faster than the sucking could diminish it. “Goddess,” said Momus, “can you sit idly here while our devout worshippers, the Moderns, are this minute entering into a cruel battle, and perhaps now lying under the swords of their enemies? who then hereafter will ever sacrifice or build altars to our divinities? Haste, therefore, to the British Isle, and, if possible, prevent their destruction; while I make factions among the gods, and gain them over to our party.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[35]"
    "line_start": 759
    "source_sequence": 25
  "translation_ja": "一方、モモスは、最悪を恐れ、自分の子たる近代派に、あまり好ましくない、古い予言を思い出し、批評という、悪性の神の領域へ飛んだ。女神は、ノヴァ・ゼンブラの雪山の頂に住んでいた。モモスが見つけたときには、巣穴で、半ば食い尽くした、無数の書物の残骸の上へ、身を伸ばしていた。右手には、父であり夫でもある無知が、年のため目を失い、座っていた。左手には、母の高慢が、自ら裂いた紙切れで、娘を飾っていた。妹の意見もいた。足が軽く、目隠しされ、強情だが、ふらつき、絶えず向きを変えていた。周囲には、子供たちの、騒音と厚顔、愚鈍と虚栄、独断、衒学、無作法が遊んでいた。女神自身は、猫のような爪を持ち、頭、耳、声は驢馬に似ていた。前歯は抜け、目は、自分だけを見るかのように、内側へ向いていた。食事は、自分の胆汁の、あふれたものだった。脾臓は、たいそう大きく、最大級の乳房のように、突き出していた。乳首の形の出っ張りにも事欠かず、醜い怪物どもが、むさぼるように吸っていた。しかも、驚くべきことに、脾臓は、吸われて減るよりも速く、膨らんだ。「女神よ」とモモスは言った。「敬虔な崇拝者たる近代派が、いま、この瞬間、激しい合戦へ入り、ひょっとすると、もう敵の剣の下へ倒れているのに、ここで怠けて座っていられるか。これから、誰が、我々の神格へ、生贄を捧げ、祭壇を建てるのか。だから急いで、ブリテンの島へ行き、できれば、彼らの滅亡を防いでくれ。その間、私は神々の間に党派を作り、我々の側へ引き入れよう」。"
  "translation_status": "reviewed"
- "id": "btb-026"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Momus, having thus delivered himself, stayed not for an answer, but left the goddess to her own resentment. Up she rose in a rage, and, as it is the form on such occasions, began a soliloquy: “It is I” (said she) “who give wisdom to infants and idiots; by me children grow wiser than their parents, by me beaux become politicians, and schoolboys judges of philosophy; by me sophisters debate and conclude upon the depths of knowledge; and coffee-house wits, instinct by me, can correct an author’s style, and display his minutest errors, without understanding a syllable of his matter or his language; by me striplings spend their judgment, as they do their estate, before it comes into their hands. It is I who have deposed wit and knowledge from their empire over poetry, and advanced myself in their stead. And shall a few upstart Ancients dare to oppose me? But come, my aged parent, and you, my children dear, and thou, my beauteous sister; let us ascend my chariot, and haste to assist our devout Moderns, who are now sacrificing to us a hecatomb, as I perceive by that grateful\
    \ smell which from thence reaches my nostrils.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[36]"
    "line_start": 787
    "source_sequence": 26
  "translation_ja": "こう言うと、モモスは返事も待たず、女神を、その憤りに任せて去った。女神は、怒って立ち上がり、このような場合の作法どおり、独白を始めた。「幼児と愚か者へ、知恵を与えるのは、私だ。私によって、子供は親より賢くなり、伊達男は政治家、学校の少年は、哲学の裁判官となる。私によって、詭弁家は、知識の深みを論じ、結論を下す。コーヒー店の才人も、私に吹き込まれれば、著者の主題や言語を、一音節も理解せずに、文体を直し、最も細かな誤りを、さらけ出せる。若者たちは、私によって、財産と同じく、判断力を、手に入る前から使い果たす。詩を支配する帝位から、機知と知識を退け、自分を、その代わりへ上げたのも、この私だ。わずかな成り上がりの古代派が、あえて私へ逆らうというのか。さあ、老いた父よ、いとしい子供たちよ、美しい妹よ。私の車へ乗り、敬虔な近代派を、急いで助けよう。いま、私たちへ、百牛の生贄を捧げているのが、そこから鼻へ届く、ありがたい匂いでわかるのだから」。"
  "translation_status": "reviewed"
- "id": "btb-027"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The goddess and her train, having mounted the chariot, which was drawn by tame geese, flew over infinite regions, shedding her influence in due places, till at length she arrived at her beloved island of Britain; but in hovering over its metropolis, what blessings did she not let fall upon her seminaries of Gresham and Covent-garden! And now she reached the fatal plain of St. James’s library, at what time the two armies were upon the point to engage; where, entering with all her caravan unseen, and landing upon a case of shelves, now desert, but once inhabited by a colony of virtuosos, she stayed awhile to observe the posture of both armies."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[37]"
    "line_start": 806
    "source_sequence": 27
  "translation_ja": "女神と、その一行は、飼い慣らした鵞鳥の引く車へ乗り、無数の地方を飛び越え、適当な所で影響を降り注ぎ、ついに、愛するブリテン島へ着いた。しかし、都の上に舞ったとき、グレシャムや、コヴェント・ガーデンの養成所へ、どれほどの恵みを落とさなかっただろう。やがて、セント・ジェームズ図書館の、運命の戦場へ達した。そのとき、二軍は、まさに戦いを始めるところだった。女神は、一団すべてと、姿を見せずに入り、いまは空だが、かつて博識家たちの集落が住んだ、一つの書棚へ降り、しばらく、双方の軍の構えを眺めた。"
  "translation_status": "reviewed"
- "id": "btb-028"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "But here the tender cares of a mother began to fill her thoughts and move in her breast: for at the head of a troup of Modern bowmen she cast her eyes upon her son Wotton, to whom the fates had assigned a very short thread. Wotton, a young hero, whom an unknown father of mortal race begot by stolen embraces with this goddess. He was the darling of his mother above all her children, and she resolved to go and comfort him. But first, according to the good old custom of deities, she cast about to change her shape, for fear the divinity of her countenance might dazzle his mortal sight and overcharge the rest of his senses. She therefore gathered up her person into an octavo compass: her body grow white and arid, and split in pieces with dryness; the thick turned into pasteboard, and the thin into paper; upon which her parents and children artfully strewed a black juice, or decoction of gall and soot, in form of letters: her head, and voice, and spleen, kept their primitive form; and that which before was a cover of skin did still continue so. In this guise she marched on\
    \ towards the Moderns, indistinguishable in shape and dress from the divine Bentley, Wotton’s dearest friend. “Brave Wotton,” said the goddess, “why do our troops stand idle here, to spend their present vigour and opportunity of the day? away, let us haste to the generals, and advise to give the onset immediately.” Having spoke thus, she took the ugliest of her monsters, full glutted from her spleen, and flung it invisibly into his mouth, which, flying straight up into his head, squeezed out his eye-balls, gave him a distorted look, and half-overturned his brain. Then she privately ordered two of her beloved children, Dulness and Ill-manners, closely to attend his person in all encounters. Having thus accoutred him, she vanished in a mist, and the hero perceived it was the goddess his mother."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[38]"
    "line_start": 817
    "source_sequence": 28
  "translation_ja": "しかし、ここで、母の優しい心配が、思いを満たし、胸を動かし始めた。近代派の弓兵の一隊の先頭に、運命が、ごく短い糸を割り当てた、息子ウォットンを見つけたからだ。若い勇士ウォットンは、名も知れぬ人間の父が、この女神との、ひそかな抱擁によって生んだ子だった。子の中でも、最も深い母の寵愛を受けており、女神は、行って慰めようと決めた。しかし、まず、神々の、よき古い習慣どおり、姿を変える算段をした。顔の神性が、人間の目を眩ませ、ほかの感覚にも、負担をかけるのを恐れたのである。そこで、身を八つ折判の大きさへ縮めた。体は白く乾き、乾燥で、ばらばらに裂けた。厚い所は厚紙、薄い所は紙となり、そこへ、両親と子供たちが、黒い汁、すなわち没食子と煤の煎液を、文字の形へ、巧みに散らした。頭、声、脾臓は、元の形を保ち、以前、皮の覆いだったものも、そのままだった。この姿で、近代派へ進んだ。形と服装は、ウォットンの、最も親しい友、神学者ベントリーと、見分けがつかなかった。「勇敢なウォットンよ」と女神は言った。「なぜ、我が軍は、ここで怠け、いまの勢いと、その日の好機を、空費しているのか。さあ、将軍たちへ急ぎ、ただちに攻撃を始めるよう、進言しよう」。そう言うと、脾臓から、たっぷり吸った、最も醜い怪物を取り、見えぬまま、その口へ投げ込んだ。怪物は、まっすぐ頭へ飛び上がり、眼球を押し出し、顔を歪め、脳を半ば、ひっくり返した。それから、愛する子のうち、愚鈍と無作法の二人へ、どんな戦いにも、ぴったり付き添うよう、ひそかに命じた。こうして身支度を整えると、霧の中へ消え、勇士は、それが母なる女神だったと悟った。"
  "translation_status": "reviewed"
- "id": "btb-029"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The destined hour of fate being now arrived, the fight began; whereof, before I dare adventure to make a particular description, I must, after the example of other authors, petition for a hundred tongues, and mouths, and hands, and pens, which would all be too little to perform so immense a work. Say, goddess, that presidest over history, who it was that first advanced in the field of battle! Paracelsus, at the head of his dragoons, observing Galen in the adverse wing, darted his javelin with a mighty force, which the brave Ancient received upon his shield, the point breaking in the second fold . . . Hic pauca . . . . desunt They bore the wounded aga on their shields to his chariot . . . Desunt . . . nonnulla. . . ."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[39]"
    "line_start": 849
    "source_sequence": 29
  "translation_ja": "いまや、運命の定めた時が来て、戦いが始まった。だが、あえて詳しい描写へ入る前に、ほかの著者の例にならい、百の舌、口、手、筆を願わねばならない。それでも、これほど巨大な仕事には、すべて、少なすぎるだろう。歴史を司る女神よ、告げたまえ。初めに戦場へ進んだのは、誰だったか。パラケルススは、竜騎兵の先頭で、敵の翼にガレノスを見ると、力いっぱい投槍を放った。勇敢な古代派は、盾で受け、穂先は、二枚目の層で折れた。……〔ここに若干欠落〕……手負いのアガを、盾に載せ、戦車へ運んだ。……〔若干欠落〕……。"
  "translation_status": "reviewed"
- "id": "btb-030"
  "section_id": "battle"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "Then Aristotle, observing Bacon advance with a furious mien, drew his bow to the head, and let fly his arrow, which missed the valiant Modern and went whizzing over his head; but Descartes it hit; the steel point quickly found a defect in his head-piece; it pierced the leather and the pasteboard, and went in at his right eye. The torture of the pain whirled the valiant bow-man round till death, like a star of superior influence, drew him into his own vortex Ingens hiatus . . . . hic in MS. . . . . . . . . when Homer appeared at the head of the cavalry, mounted on a furious horse, with difficulty managed by the rider himself, but which no other mortal durst approach; he rode among the enemy’s ranks, and bore down all before him. Say, goddess, whom he slew first and whom he slew last! First, Gondibert advanced against him, clad in heavy armour and mounted on a staid sober gelding, not so famed for his speed as his docility in kneeling whenever his rider would mount or alight. He had made a vow to Pallas that he would never leave the field till he had spoiled Homer of his\
    \ armour: madman, who had never once seen the wearer, nor understood his strength! Him Homer overthrew, horse and man, to the ground, there to be trampled and choked in the dirt. Then with a long spear he slew Denham, a stout Modern, who from his father’s side derived his lineage from Apollo, but his mother was of mortal race. He fell, and bit the earth. The celestial part Apollo took, and made it a star; but the terrestrial lay wallowing upon the ground. Then Homer slew Sam Wesley with a kick of his horse’s heel; he took Perrault by mighty force out of his saddle, then hurled him at Fontenelle, with the same blow dashing out both their brains."

  "source_text": "“Not to disparage myself,” said he, “by the comparison with such a rascal, what art thou but a vagabond without house or home, without stock or inheritance? born to no possession of your own, but a pair of wings and a drone-pipe. Your livelihood is a universal plunder upon nature; a freebooter over fields and gardens; and, for the sake of stealing, will rob a nettle as easily as a violet. Whereas I am a domestic animal, furnished with a native stock within myself. This large castle (to show my improvements in the mathematics) is all built with my own hands, and the materials extracted altogether out of my own person.”"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[27]"
    "line_start": 581
    "source_sequence": 17
  "translation_ja": "「てめえのような、ならず者と比べて、自分を貶めるつもりはないが」と蜘蛛は言った。「家も住まいも、元手も相続財産もない、浮浪者以外の何者だ。生まれたときから持っているのは、翼一対と、うなる笛だけではないか。暮らしは、自然からの、やみくもな略奪だ。野原や庭の海賊で、盗むためなら、菫でも、蕁麻でも、同じように奪う。それに引き換え、おれは、家に住む動物で、自分の中に、生まれつきの元手を備えている。この大きな城は、数学の進歩を示すために言うが、すべて、おれ自身の手で建て、材料も、すっかり自分の体から取り出したのだ」。"

  "translation_ja": "次にピンダロスは、――、――、オールダム、――、そして、足の軽い、アマゾンの女戦士アフラを殺した。決して直線には進まず、信じ難い敏捷さと力で回り、敵の軽騎兵を、恐ろしいほど殺した。それを見たカウリーは、気高い心を内に燃やし、猛々しい古代派へ進んだ。馬の活力と、自分の腕が許す限り、その身ごなし、歩み、駆け方をまねた。二騎が、投槍三本の長さまで近づくと、まずカウリーが槍を投げた。ピンダロスを外れ、敵の列へ入り、何の効き目もなく、地へ落ちた。そこでピンダロスは、この衰えた時代の騎士なら、十二人でも、やっと地面から持ち上げるほど、大きく重い投槍を放った。しかし、容易に投げ、誤らぬ手から、空中を歌って飛んだ。近代派は、幸い、ヴィーナスから与えられた盾を差し出さなければ、その場の死を逃れられなかったろう。いま、両雄は剣を抜いたが、近代派は、あまりに恐れ、混乱し、自分がどこにいるかも、わからなかった。盾は手から落ち、三度逃げ、三度、逃れられなかった。ついに振り返り、懇願の構えで手を上げ、「神のごときピンダロスよ」と言った。「命を助け、馬と、この武具を、お取りください。友人たちも、私が生きて、あなたの捕虜になったと聞けば、身代金を出すでしょう」。「犬め」とピンダロスは言った。「身代金は、友人のもとに置け。だが、屍は、空の鳥と、野の獣へ残してやる」。そう言うと、剣を上げ、強烈な一撃で、哀れな近代派を、真っ二つにした。剣は、振り抜かれ、半分は地面で息をあえぎ、馬の足で粉々に踏まれるままとなり、もう半分は、おびえた馬に乗り、戦場を運ばれた。ヴィーナスは、この半分を取り、アムブロシアで七度洗い、不凋花の小枝で三度打った。すると、革は丸く柔らかくなり、紙葉は羽毛へ変わり、もとからの金箔は、そのまま残った。こうして鳩となり、女神は、自分の車へつないだ。…………〔原稿に、まことに嘆かわしい欠落〕……。"

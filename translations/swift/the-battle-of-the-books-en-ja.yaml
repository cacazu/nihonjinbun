  "source_text": "He, in the meantime, had wandered long in search of some enterprise, till at length he arrived at a small rivulet that issued from a fountain hard by, called, in the language of mortal men, Helicon. Here he stopped, and, parched with thirst, resolved to allay it in this limpid stream. Thrice with profane hands he essayed to raise the water to his lips, and thrice it slipped all through his fingers. Then he stopped prone on his breast, but, ere his mouth had kissed the liquid crystal, Apollo came, and in the channel held his shield betwixt the Modern and the fountain, so that he drew up nothing but mud. For, although no fountain on earth can compare with the clearness of Helicon, yet there lies at bottom a thick sediment of slime and mud; for so Apollo begged of Jupiter, as a punishment to those who durst attempt to taste it with unhallowed lips, and for a lesson to all not to draw too deep or far from the spring."

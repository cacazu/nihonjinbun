  "source_text": "Day being far spent, and the numerous forces of the Moderns half inclining to a retreat, there issued forth, from a squadron of their heavy-armed foot, a captain whose name was Bentley, the most deformed of all the Moderns; tall, but without shape or comeliness; large, but without strength or proportion. His armour was patched up of a thousand incoherent pieces, and the sound of it, as he marched, was loud and dry, like that made by the fall of a sheet of lead, which an Etesian wind blows suddenly down from the roof of some steeple. His helmet was of old rusty iron, but the vizor was brass, which, tainted by his breath, corrupted into copperas, nor wanted gall from the same fountain, so that, whenever provoked by anger or labour, an atramentous quality, of most malignant nature, was seen to distil from his lips. In his right hand he grasped a flail, and (that he might never be unprovided of an offensive weapon) a vessel full of ordure in his left. Thus completely armed, he advanced with a slow and heavy pace where the Modern chiefs were holding a consult upon the sum\
    \ of things, who, as he came onwards, laughed to behold his crooked leg and humped shoulder, which his boot and armour, vainly endeavouring to hide, were forced to comply with and expose. The generals made use of him for his talent of railing, which, kept within government, proved frequently of great service to their cause, but, at other times, did more mischief than good; for, at the least touch of offence, and often without any at all, he would, like a wounded elephant, convert it against his leaders. Such, at this juncture, was the disposition of Bentley, grieved to see the enemy prevail, and dissatisfied with everybody’s conduct but his own. He humbly gave the Modern generals to understand that he conceived, with great submission, they were all a pack of rogues, and fools, and confounded logger-heads, and illiterate whelps, and nonsensical scoundrels; that, if himself had been constituted general, those presumptuous dogs, the Ancients, would long before this have been beaten out of the field. “You,” said he, “sit here idle, but when I, or any other valiant Modern kill an enemy,\
    \ you are sure to seize the spoil. But I will not march one foot against the foe till you all swear to me that whomever I take or kill, his arms I shall quietly possess.” Bentley having spoken thus, Scaliger, bestowing him a sour look, “Miscreant prater!” said he, “eloquent only in thine own eyes, thou railest without wit, or truth, or discretion. The malignity of thy temper perverteth nature; thy learning makes thee more barbarous; thy study of humanity more inhuman; thy converse among poets more grovelling, miry, and dull. All arts of civilising others render thee rude and untractable; courts have taught thee ill manners, and polite conversation has finished thee a pedant. Besides, a greater coward burdeneth not the army. But never despond; I pass my word, whatever spoil thou takest shall certainly be thy own; though I hope that vile carcase will first become a prey to kites and worms.”"

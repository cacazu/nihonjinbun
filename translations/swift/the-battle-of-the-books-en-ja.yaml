- "id": "btb-001"
  "section_id": "bookseller"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "This discourse, as it is unquestionably of the same author, so it seems to have been written about the same time, with “The Tale of a Tub;” I mean the year 1697, when the famous dispute was on foot about ancient and modern learning. The controversy took its rise from an essay of Sir William Temple’s upon that subject; which was answered by W. Wotton, B.D., with an appendix by Dr. Bentley, endeavouring to destroy the credit of Æsop and Phalaris for authors, whom Sir William Temple had, in the essay before mentioned, highly commended. In that appendix the doctor falls hard upon a new edition of Phalaris, put out by the Honourable Charles Boyle, now Earl of Orrery, to which Mr. Boyle replied at large with great learning and wit; and the Doctor voluminously rejoined. In this dispute the town highly resented to see a person of Sir William Temple’s character and merits roughly used by the two reverend gentlemen aforesaid, and without any manner of provocation. At length, there appearing no end of the quarrel, our author tells us that the BOOKS in St. James’s Library, looking\
    \ upon themselves as parties principally concerned, took up the controversy, and came to a decisive battle; but the manuscript, by the injury of fortune or weather, being in several places imperfect, we cannot learn to which side the victory fell."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[13]"
    "line_start": 224
    "source_sequence": 1
  "translation_ja": "この論考が『樽物語』と同じ著者の作であることに疑いはないが、書かれた時期もほぼ同じと思われる。つまり、古代と近代の学問をめぐる、あの有名な論争が行われていた一六九七年である。論争の発端は、この主題についてウィリアム・テンプル卿が書いた一篇の論考だった。それに神学士W・ウォットンが反論し、ベントリー博士の付論を添えた。付論は、テンプル卿が先の論考で高く称えたイソップとファラリスについて、著者としての信用を覆そうとしたものである。その中で博士は、今はオラリー伯となっているチャールズ・ボイル閣下が刊行したファラリスの新版を、激しく攻撃した。ボイル氏が豊かな学識と才知をもって詳しく反論すると、博士も大部の再反論を出した。この争いでは、テンプル卿ほどの人格と功績を持つ人が、何の挑発もしていないのに、先の二人の聖職者から手荒く扱われるのを見て、世間は大いに憤った。ついに争いの終わりが見えなくなると、わが著者の言うところでは、セント・ジェームズ図書館の本どもが、自分たちこそ主たる当事者であると考え、この論争を引き受けて、雌雄を決する戦いに及んだ。だが原稿は、不運か風雨のためか、ところどころ欠けており、どちらが勝ったかはわからない。"
  "translation_status": "reviewed"
- "id": "btb-002"
  "section_id": "bookseller"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "I must warn the reader to beware of applying to persons what is here meant only of books, in the most literal sense. So, when Virgil is mentioned, we are not to understand the person of a famous poet called by that name; but only certain sheets of paper bound up in leather, containing in print the works of the said poet: and so of the rest."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[14]"
    "line_start": 247
    "source_sequence": 2
  "translation_ja": "読者には、ここで文字どおり本だけを指していることを、人物に当てはめぬよう、ご注意いただかねばならない。たとえばウェルギリウスとあっても、その名の有名な詩人本人を意味するのではなく、ただ、その詩人の著作を印刷した何枚かの紙を、革で綴じたものだけを意味する。ほかも同様である。"
  "translation_status": "reviewed"

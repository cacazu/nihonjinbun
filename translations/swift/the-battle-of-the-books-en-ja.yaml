  "translation_ja": "ベントリーは、返す勇気もなく、ひがみと怒りに、半ば喉を詰まらせ、大きな手柄を立てようと、固く決心して退いた。助け手と連れとして、最愛のウォットンを伴い、計略か奇襲で、古代派の軍の、手薄な一角を襲うつもりだった。殺された友人の屍を越えて進み、自軍の右手へ出て、北へ回り、アルドロヴァンドゥスの墓へ至ると、沈む日の側を通り過ぎた。いまや、恐れながら敵の前哨へ近づき、負傷者の宿か、武器も持たず、仲間から離れて眠る、はぐれ者が見えぬかと、見回した。生まれつきの貪欲と、家の欠乏に駆られ、手を組んだ二匹の雑種犬が、恐れながらも、夜ごと、豊かな牧畜家の囲いへ侵入しようと、尾を下げ、舌を垂らし、そっと、ゆっくり這うようなものだった。その間、天頂へ達した、すべてを見通す月は、罪深い頭へ、垂直の光を射す。水たまりに映る姿で見ようと、空で直接見ようと、輝く顔に、いくら苛立っても、吠える勇気はない。一匹が周囲を見渡す間、もう一匹は平地を探る。群れから離れた所に、腹いっぱいの狼や、不吉な烏の残した、半ば食われた屍を見つけられないかと。この、美しく、愛し合う二人の友も、劣らぬ恐怖と用心をもって進んだ。すると、遠くに、樫へ掛けられた、輝く鎧が二領と、近くで深く眠る、その持ち主が見えた。二人は籤を引き、この冒険は、ベントリーに当たった。進む先頭には混乱と驚愕、後尾には恐怖と戦慄がついた。近づくと、見よ、古代派の二勇士、ファラリスとイソップが、熟睡していた。ベントリーは、二人とも片づけたくてたまらず、忍び寄り、ファラリスの胸へ殻竿を向けた。だが、そのとき、戦慄の女神が割って入り、氷の腕で近代派を抱え、予見した危険から引きずり離した。眠る二勇士が、熟睡したまま、夢に夢中で、同時に寝返りを打ったのだ。ファラリスは、ちょうど、甚だ卑しいへぼ詩人に風刺され、その者を、自分の牡牛の中へ入れ、吠えさせる夢を見ていた。イソップは、古代の友と地面に寝ていると、逃げ出した野驢馬が走り回り、顔を踏み、蹴る夢を見た。ベントリーは、二勇士を眠るまま残し、両方の鎧を奪うと、最愛のウォットンを探しに退いた。"

- "id": "cv-verse-008"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    There was on both sides much to say;
    She’d hear the cause another day;
    And so she did, and then a third,
    She heard it—there she kept her word;
    But with rejoinders and replies,
    Long bills, and answers, stuffed with lies
    Demur, imparlance, and essoign,
    The parties ne’er could issue join:
    For sixteen years the cause was spun,
    And then stood where it first begun.
  "translation_ja": |-
    双方には、言いたいことが、山ほどあった。
    女神は、別の日に、訴えを聴くとした。
    実際、そうして、さらに三日目も、
    聴いた。この点は、約束を守った。
    だが、再答弁と、返答と、
    嘘を詰めた、長い訴状と、答弁と、
    抗弁、和解猶予、欠席の弁明で、
    当事者たちは、争点を、定められぬ。
    十六年も、訴訟は引き延ばされ、
    結局、初めの場所に、立ったまま。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[150]"
    "line_start": 2099
    "line_end": 2108
    "source_sequence": 9
  "origin": "source"
  "source_languages":
  - "en"
- "id": "cv-verse-009"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Now, gentle Clio, sing or say,
    What Venus meant by this delay.
    The goddess, much perplexed in mind,
    To see her empire thus declined,
    When first this grand debate arose
    Above her wisdom to compose,
    Conceived a project in her head,
    To work her ends; which, if it sped,
    Would show the merits of the cause
    Far better than consulting laws.
  "translation_ja": |-
    さて、優しいクレイオよ、歌え、あるいは語れ、
    ウェヌスが、この引き延ばしで、何を狙ったか。
    女神は、自分の帝国が、これほど衰えたのを見て、
    心に、ひどく思い悩んだ。
    この大きな争いが、初めて起き、
    自分の知恵では、治められぬと知ると、
    胸の中に、一つの計画を思いついた、
    目的を果たすためのもの。それが成功すれば、
    法を調べるより、はるかによく、
    訴えの実質を、示せるだろうという計画を。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[151]"
    "line_start": 2109
    "line_end": 2118
    "source_sequence": 10
  "origin": "source"
  "source_languages":
  - "en"
- "id": "cv-verse-010"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    In a glad hour Lucina’s aid
    Produced on earth a wondrous maid,
    On whom the queen of love was bent
    To try a new experiment.
    She threw her law-books on the shelf,
    And thus debated with herself:—
  "translation_ja": |-
    めでたい時、ルキナの助けによって、
    地上に、不思議な乙女が生まれた。
    恋の女王は、その娘を使い、
    新たな実験をしようと、心に決めた。
    法律書を棚へ投げ、
    自分自身と、こう論じた。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[152]"
    "line_start": 2119
    "line_end": 2124
    "source_sequence": 11
  "origin": "source"
  "source_languages":
  - "en"
- "id": "cv-verse-011"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    “Since men allege they ne’er can find
    Those beauties in a female mind
    Which raise a flame that will endure
    For ever, uncorrupt and pure;
    If ’tis with reason they complain,
    This infant shall restore my reign.
    I’ll search where every virtue dwells,
    From Courts inclusive down to cells.
    What preachers talk, or sages write,
    These I will gather and unite,
    And represent them to mankind
    Collected in that infant’s mind.”
  "translation_ja": |-
    「男たちは、女の心の中には、
    あの美しさを、決して見つけられぬと言う。
    永遠に、損なわれず、清らかに、
    持ちこたえる炎を、燃え上がらせる美しさを。
    理にかなって、そう不平を言うのなら、
    この幼子が、私の支配を、取り戻してくれよう。
    あらゆる美徳の住む所を、私は探そう、
    宮廷も含め、下は、隠者の庵まで。
    説教師の語ること、賢者の書くこと、
    それらを集め、一つにしよう。
    この幼子の心の中へ、すべて集め、
    人類に、示してみせよう」。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[153]"
    "line_start": 2125
    "line_end": 2136
    "source_sequence": 12
  "origin": "source"
  "source_languages":
  - "en"
- "id": "cv-verse-012"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    This said, she plucks in heaven’s high bowers
    A sprig of Amaranthine flowers,
    In nectar thrice infuses bays,
    Three times refined in Titan’s rays:
    Then calls the Graces to her aid,
    And sprinkles thrice the now-born maid.
    From whence the tender skin assumes
    A sweetness above all perfumes;
    From whence a cleanliness remains,
    Incapable of outward stains;
    From whence that decency of mind,
    So lovely in a female kind.
    Where not one careless thought intrudes
    Less modest than the speech of prudes;
    Where never blush was called in aid,
    The spurious virtue in a maid,
    A virtue but at second-hand;
    They blush because they understand.
  "translation_ja": |-
    そう言うと、天上の、高い木陰で、
    萎れぬ花、アマランスの小枝を摘み、
    月桂樹を、三たび神酒に浸し、
    三たび、ティタンの光で精めた。
    それから、優美の女神たちを助けに呼び、
    生まれたばかりの娘へ、三たび振りかけた。
    そのため、柔らかな肌は、
    どんな香水にも勝る、甘い香りを得た。
    そのため、清潔さが残り、
    外からの汚れは、つくことがない。
    そのため、女というものには、これほど愛らしい、
    心の慎みが、備わった。
    お堅い女の言葉より、少しでも慎みに欠ける、
    不用意な思いは、一つも入り込まない。
    乙女の、偽物の美徳である、
    赤面の助けは、一度も求められなかった。
    二次的なものにすぎぬ、あの美徳、
    女たちは、意味がわかるから、赤くなるのだ。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[154]"
    "line_start": 2137
    "line_end": 2154
    "source_sequence": 13
  "origin": "source"
  "source_languages":
  - "en"
- "id": "cv-verse-013"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    The Graces next would act their part,
    And show but little of their art;
    Their work was half already done,
    The child with native beauty shone,
    The outward form no help required:
    Each breathing on her thrice, inspired
    That gentle, soft, engaging air
    Which in old times adorned the fair,
    And said, “Vanessa be the name
    By which thou shalt be known to fame;
    Vanessa, by the gods enrolled:
    Her name on earth—shall not be told.”
  "translation_ja": |-
    次に、優美の女神たちが、役目を果たそうとしたが、
    自分たちの技は、ほんの少し示すだけだった。
    仕事の半分は、すでに済み、
    幼子は、生来の美に輝いていた。
    外の姿は、何の助けも要らなかった。
    一人一人が、三たび息を吹きかけ、
    昔の美女を飾った、あの優しく、
    柔らかで、心を引く様子を、吹き込んだ。
    そして言った、「ヴァネッサを、その名とせよ、
    その名によって、名声に知られるように。
    神々の帳簿に記すのは、ヴァネッサ。
    地上での名は――語らぬことにしよう」。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[155]"
    "line_start": 2155
    "line_end": 2166
    "source_sequence": 14
  "origin": "source"
  "source_languages":
  - "en"
- "id": "cv-verse-014"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    But still the work was not complete,
    When Venus thought on a deceit:
    Drawn by her doves, away she flies,
    And finds out Pallas in the skies:
    Dear Pallas, I have been this morn
    To see a lovely infant born:
    A boy in yonder isle below,
    So like my own without his bow,
    By beauty could your heart be won,
    You’d swear it is Apollo’s son;
    But it shall ne’er be said, a child
    So hopeful has by me been spoiled;
    I have enough besides to spare,
    And give him wholly to your care.
  "translation_ja": |-
    だが、仕事は、まだ完成していなかった、
    ウェヌスが、一つの欺きを思いついたときには。
    鳩に引かれて、飛び去り、
    天で、パラスを探し出す。
    「親愛なるパラス、今朝、私は、
    愛らしい幼子の、誕生を見てきたの。
    下界の、あの島の男の子、
    弓がないだけで、私の子に、そっくりよ。
    もし、美しさで、あなたの心が奪えるなら、
    アポロンの息子に違いないと、言うはず。
    でも、これほど有望な子供が、
    私のせいで駄目になったとは、決して言わせない。
    ほかにも、手放せる子は、十分いるから、
    この子は、まるごと、あなたに預けるわ」。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[156]"
    "line_start": 2167
    "line_end": 2180
    "source_sequence": 15
  "origin": "source"
  "source_languages":
  - "en"
- "id": "cv-verse-015"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Wisdom’s above suspecting wiles;
    The queen of learning gravely smiles,
    Down from Olympus comes with joy,
    Mistakes Vanessa for a boy;
    Then sows within her tender mind
    Seeds long unknown to womankind;
    For manly bosoms chiefly fit,
    The seeds of knowledge, judgment, wit,
    Her soul was suddenly endued
    With justice, truth, and fortitude;
    With honour, which no breath can stain,
    Which malice must attack in vain:
    With open heart and bounteous hand:
    But Pallas here was at a stand;
    She know in our degenerate days
    Bare virtue could not live on praise,
    That meat must be with money bought:
    She therefore, upon second thought,
    Infused yet as it were by stealth,
    Some small regard for state and wealth:
    Of which as she grew up there stayed
    A tincture in the prudent maid:
    She managed her estate with care,
    Yet liked three footmen to her chair,
    But lest he should neglect his studies
    Like a young heir, the thrifty goddess
    (For fear young master should be spoiled)
    Would use him like a younger child;
    And, after long computing, found
    ’Twould come to just five thousand pound.
  "translation_ja": |-
    知恵は、人の企みなどを疑わぬ、高みにいる。
    学問の女王は、重々しく微笑み、
    喜んで、オリュンポスから下り、
    ヴァネッサを、男の子と取り違える。
    そして、その柔らかな心へ、種をまいた、
    女たちが、長いこと知らなかった種を。
    主として、男らしい胸に、ふさわしい、
    知識、判断、才知という種を。
    その魂には、たちまち、公正と、
    真実と、剛毅が、授けられた。
    どんな風評にも、汚せず、
    悪意が、むなしく攻めるだけの名誉が。
    開かれた心と、物惜しみせぬ手が。
    だが、ここで、パラスは、立ち止まった。
    堕落した、この時代には、
    美徳だけでは、褒め言葉で暮らせぬと知っていた。
    肉は、金で買わねばならぬ。
    そこで、考え直して、
    まるで、忍び込ませるように、なお幾らか、
    身分と富への、わずかな関心を、吹き込んだ。
    娘が育つにつれ、その色合いは、
    思慮ある、その乙女に残った。
    自分の財産は、注意して管理したが、
    輿には、三人の従僕がつくのを、好んだ。
    だが、若い跡取りのように、彼が学業を怠らぬよう、
    倹約な女神は、（若旦那が、
    駄目になるのを恐れて、）
    弟に当たる子のように、扱おうとした。
    長く勘定した末、ちょうど、
    五千ポンドになると、わかった。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[157]"
    "line_start": 2181
    "line_end": 2210
    "source_sequence": 16
  "origin": "source"
  "source_languages":
  - "en"
  "source_variants":
  - "kind": "comparison"
    "text": "She knew, in our degenerate days,"
    "source_locations":
    - "source_id": "gutenberg-13621"
      "precision": "block"
      "url": "https://www.gutenberg.org/cache/epub/13621/pg13621-images.html"
      "xpath": "/html/body/pre[2]"
    "description_ja": "主底本knowに対してknew。女神が当時の世相を知っていたという過去形で訳す。 比較版の詩pre内213行目を確認。主底本のsource_textは変更しない。"
- "id": "cv-verse-016"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    The Queen of Love was pleased and proud
    To we Vanessa thus endowed;
    She doubted not but such a dame
    Through every breast would dart a flame;
    That every rich and lordly swain
    With pride would drag about her chain;
    That scholars would forsake their books
    To study bright Vanessa’s looks:
    As she advanced that womankind
    Would by her model form their mind,
    And all their conduct would be tried
    By her, as an unerring guide.
    Offending daughters oft would hear
    Vanessa’s praise rung in their ear:
    Miss Betty, when she does a fault,
    Lets fall her knife, or spills the salt,
    Will thus be by her mother chid,
    “’Tis what Vanessa never did.”
    Thus by the nymphs and swains adored,
    My power shall be again restored,
    And happy lovers bless my reign—
    So Venus hoped, but hoped in vain.
  "translation_ja": |-
    恋の女王は、喜び、誇らしかった、
    ヴァネッサが、このように授かったのを見て。
    こんな娘なら、どんな胸へも、
    炎を射込めると、疑わなかった。
    金持ちで、高貴な羊飼いは、誰もが、
    誇りをもって、彼女の鎖を引きずるだろうと。
    学者は、書物を投げ出し、
    輝くヴァネッサの顔を、研究するだろうと。
    彼女が成長するにつれ、女たちは、
    彼女を模範に、心を形作り、
    あらゆる振る舞いが、間違わぬ導き手である、
    彼女によって、試されるだろうと。
    悪さをした娘たちは、たびたび、
    ヴァネッサを褒める声を、耳元で聞くだろう。
    ベティ嬢が、失敗し、
    ナイフを落とし、塩をこぼせば、
    母親に、こう叱られるだろう、
    「ヴァネッサなら、決してしなかったことよ」。
    「こうして、ニンフにも羊飼いにも崇められ、
    私の力は、ふたたび取り戻され、
    幸せな恋人たちが、私の治世を祝福する」。
    そう、ウェヌスは望んだが、その望みは、むなしかった。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"

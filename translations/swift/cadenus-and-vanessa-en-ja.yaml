- "id": "cv-verse-034"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Vanessa, filled with just disdain,
    Would still her dignity maintain,
    Instructed from her early years
    To scorn the art of female tears.
  "translation_ja": |-
    ヴァネッサは、正当な軽蔑に満ち、
    なお、自分の威厳を、保とうとした。
    幼いころから、教えられていた、
    女の涙の手管は、軽蔑せよと。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[176]"
    "line_start": 2577
    "line_end": 2580
    "source_sequence": 35
  "origin": "source"
  "source_languages":

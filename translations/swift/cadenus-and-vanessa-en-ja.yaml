- "id": "cv-verse-031"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    Cadenus many things had writ,
    Vanessa much esteemed his wit,
    And called for his poetic works!
    Meantime the boy in secret lurks.
    And while the book was in her hand,
    The urchin from his private stand
    Took aim, and shot with all his strength
    A dart of such prodigious length,
    It pierced the feeble volume through,
    And deep transfixed her bosom too.
    Some lines, more moving than the rest,
    Struck to the point that pierced her breast;
    And, borne directly to the heart,
    With pains unknown, increased her smart.
  "translation_ja": |-
    カデヌスは、多くのものを書いていた。
    ヴァネッサは、その才知を、大いに尊び、
    彼の詩集を、求めた。
    その間、少年は、ひそかに潜んでいる。
    書物が、彼女の手にあったとき、
    悪戯小僧は、隠れた場所から、
    狙いを定め、力を尽くして、射た、
    途方もなく長い、一本の矢を。
    矢は、弱い一巻を、突き通し、
    その胸にも、深々と突き刺さった。
    ほかより、心を動かす、幾行かが、
    胸を貫いた、その先端に、くっついた。
    そして、まっすぐ心へ運ばれ、
    知らぬ苦しみで、その痛みを増した。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"

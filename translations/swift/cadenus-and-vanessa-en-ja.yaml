- "id": "cv-verse-001"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    The shepherds and the nymphs were seen
    Pleading before the Cyprian Queen.
    The counsel for the fair began
    Accusing the false creature, man.
  "translation_ja": |-
    羊飼いたちとニンフたちが、姿を見せ、
    キュプロスの女王の前で、訴えを争っていた。
    美女たちの代理人が口を開き、
    男という不実な生き物を、告発した。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"
    "xpath": "/html/body/p[143]"

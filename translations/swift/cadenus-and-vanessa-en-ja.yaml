- "id": "cv-verse-046"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    But now, repenting what was done,
    She left all business to her son;
    She puts the world in his possession,
    And let him use it at discretion.”
  "translation_ja": |-
    だが、いまでは、したことを悔い、
    仕事はすべて、息子に任せた。
    世界を、その手に渡し、
    その裁量で、扱わせることにしたのだ」。
  "translation_status": "reviewed"

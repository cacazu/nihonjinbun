- "id": "cv-verse-029"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    The queen of wisdom could foresee,
    But not prevent the Fates decree;
    And human caution tries in vain
    To break that adamantine chain.
    Vanessa, though by Pallas taught,
    By love invulnerable thought,
    Searching in books for wisdom’s aid,
    Was, in the very search, betrayed.
  "translation_ja": |-
    知恵の女王は、予見することはできても、
    運命の定めを、防ぐことは、できなかった。
    人間の用心も、あの金剛の鎖を、
    断とうとするが、むなしい。
    ヴァネッサは、パラスに教えられ、
    恋にも傷つかぬと、思われていたが、
    書物に、知恵の助けを探すうち、
    まさに、その探求の中で、裏切られた。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"
    "url": "https://www.gutenberg.org/files/623/623-h/623-h.htm"

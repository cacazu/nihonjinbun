- "id": "cv-verse-004"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    In a dull stream, which, moving slow,
    You hardly see the current flow,
    If a small breeze obstructs the course,
    It whirls about for want of force,
    And in its narrow circle gathers
    Nothing but chaff, and straws, and feathers:
    The current of a female mind
    Stops thus, and turns with every wind;
    Thus whirling round, together draws
    Fools, fops, and rakes, for chaff and straws.
    Hence we conclude, no women’s hearts
    Are won by virtue, wit, and parts;
    Nor are the men of sense to blame
    For breasts incapable of flame:
    The fault must on the nymphs be placed,
    Grown so corrupted in their taste.
  "translation_ja": |-
    流れが動くのも、ほとんど見えない、
    のろのろ進む、鈍い小川では、
    わずかな風が、行く手を妨げると、
    力がないので、くるくる回り、
    その狭い輪の中へ集めるのは、
    穀物の殻、藁、羽ばかり。
    女の心の流れも、こうして止まり、
    吹く風ごとに、向きを変える。
    こうして回り、殻や藁の代わりに、
    愚か者、伊達男、放蕩者を、引き寄せる。
    ゆえに、女の心は、美徳や才知や能力で、
    勝ち取られはしない、と結論する。
    炎を宿せぬ胸のために、
    分別ある男を、責めることもできぬ。
    罪は、ニンフたちに負わせねばならない、
    好みが、これほど腐ってしまったのだから。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"

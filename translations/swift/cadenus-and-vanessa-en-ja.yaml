- "id": "cv-verse-040"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    ’Tis an old maxim in the schools,
    That vanity’s the food of fools;
    Yet now and then your men of wit
    Will condescend to take a bit.
  "translation_ja": |-
    学び舎の、古い格言にある、
    虚栄は、愚か者の食べ物であると。
    それでも、才人の皆様も、ときには、
    身をかがめて、一口つまむのである。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"

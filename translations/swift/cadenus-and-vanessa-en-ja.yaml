- "id": "cv-verse-003"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    The nymphs with scorn beheld their foes:
    When the defendant’s counsel rose,
    And, what no lawyer ever lacked,
    With impudence owned all the fact.
    But, what the gentlest heart would vex,
    Laid all the fault on t’other sex.
    That modern love is no such thing
    As what those ancient poets sing;
    A fire celestial, chaste, refined,
    Conceived and kindled in the mind,
    Which having found an equal flame,
    Unites, and both become the same,
    In different breasts together burn,
    Together both to ashes turn.
    But women now feel no such fire,
    And only know the gross desire;
    Their passions move in lower spheres,
    Where’er caprice or folly steers.
    A dog, a parrot, or an ape,
    Or some worse brute in human shape
    Engross the fancies of the fair,
    The few soft moments they can spare
    From visits to receive and pay,
    From scandal, politics, and play,
    From fans, and flounces, and brocades,
    From equipage and park-parades,
    From all the thousand female toys,
    From every trifle that employs
    The out or inside of their heads
    Between their toilets and their beds.
  "translation_ja": |-
    ニンフたちは、敵を、蔑んで見つめた。
    すると、被告の代理人が立ち、
    どの法律家も欠いたことのないもの、
    厚かましさをもって、事実はすべて認めた。
    だが、どんな優しい心をも、苛立たせることに、
    罪をすべて、もう一方の性へ、なすりつけた。
    当世の恋は、あの昔の詩人たちが、
    歌うものとは、まったく違うのだ。
    天上の、貞らかで、精妙な火、
    心の中で宿り、燃え立つ火、
    それが、等しい炎を見つけると、
    結ばれ、二つは、一つになり、
    別々の胸で、ともに燃え、
    ともに、灰となる、あの火とは。
    だが、いまの女たちに、そんな火はなく、
    知っているのは、粗野な欲望だけ。
    その情念は、もっと低い天球を動く、
    気まぐれや愚かさの、導くままに。
    犬か鸚鵡か、猿か、
    人の姿をした、もっと悪い獣かが、
    美女たちの空想を、占めきっている。
    訪問を受け、訪問を返すことから、
    中傷、政治、賭け事から、
    扇、フリル、錦織から、
    馬車、公園での練り歩きから、
    女の、あの千もの玩具から、
    化粧台と寝床の間で、
    頭の外や中を占める、あらゆる些事から、
    やっと割ける、わずかな優しい時間を、
    そうしたものが、独り占めしているのだ。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"

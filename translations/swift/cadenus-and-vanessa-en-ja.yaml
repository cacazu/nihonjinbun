- "id": "cv-verse-002"
  "section_id": "poem"
  "kind": "verse"
  "source_text": |-
    The brief with weighty crimes was charged,
    On which the pleader much enlarged:
    That Cupid now has lost his art,
    Or blunts the point of every dart;
    His altar now no longer smokes;
    His mother’s aid no youth invokes—
    This tempts free-thinkers to refine,
    And bring in doubt their powers divine,
    Now love is dwindled to intrigue,
    And marriage grown a money-league.
    Which crimes aforesaid (with her leave)
    Were (as he humbly did conceive)
    Against our Sovereign Lady’s peace,
    Against the statutes in that case,
    Against her dignity and crown:
    Then prayed an answer and sat down.
  "translation_ja": |-
    訴訟要旨書には、重い罪が書き連ねられ、
    弁論人は、それを、詳しく述べ立てた。
    いまやキューピッドは、技を失ったか、
    どの矢の先も、鈍らせてしまったのだ。
    その祭壇からは、もう煙が立たず、
    その母の助けを、若者は誰も祈らない。
    このため、自由思想家は、理屈をこね、
    二人の神聖な力を、疑うようになる。
    いまや恋は、密かな情事へと縮み、
    結婚は、金のための同盟となった。
    右に掲げた罪は、（お許しいただければ、）
    （恐れながら、そう考えますが、）
    我らが君主たる女王陛下の、平安に反し、
    かかる場合の法令に反し、
    その尊厳と王冠に、背くものである。
    そうして、答弁を願い、席に着いた。
  "translation_status": "reviewed"
  "source_locations":
  - "source_id": "gutenberg-623"
    "precision": "block"

    "reason_ja": "essoignは指定時刻に英国法廷へ出ないことの弁解。一般的な欠席通知ではなく弁明であると明示。"
  - "segment_id": "cv-verse-016"
    "reason_ja": "as she advancedのsheは模範となるVanessa。ほかの女たち自身が成長する条件と読まれないよう明示。"
  - "segment_id": "cv-verse-021"
    "reason_ja": "Muscovyは歴史的な国・地域名であり、現代のモスクワ市へ置き換えず音写を保持する。"
  - "segment_id": "cv-verse-023"
    "reason_ja": "the ringは社交の周回路の名。管理主体Royal Parksの公的なHyde Park史でもRingを馬・馬車の環状路と説明。人々の輪の中という読みを訂正。"
  - "segment_id": "cv-verse-024"
    "reason_ja": "Madamは女性への呼びかけで、未婚のVanessaを既婚者とする奥様の限定を避ける。"
  - "segment_id": "cv-verse-028"
    "reason_ja": "they would improveの主体はVenusのまいた種であり、Cupid自身が成長する文と読まれないよう明示。"
  - "segment_id": "cv-verse-033"
    "reason_ja": "tender sex and ageは女性という性と若い年齢のか弱さを述べる。「性と年齢の一人」という不成立の指示表現を改め、原文の性別観と若さを明示する。"
  - "segment_id": "cv-verse-036"
    "reason_ja": "fancied worse（主底本worst）は金持ちの若い娘より悪い相手を好む可能性、つまり縁組を悪くないとする世間の当てこすり。道徳的に悪い望みへのずれを除く。併記French句も主底本どおり無アクセントのsans\
      \ consequenceを保持。"
  - "segment_id": "cv-verse-043"
    "reason_ja": "主底本To like with less seraphic endsは比較版PG13621でTo act with less seraphic ends。地上の恋を目的に行動する意味で、生きるへの推測を訂正。"

  "translation_ja": |-
    アイルランド総督代理閣下お二方[1]へ、
      フランシス・ハリスの慎ましき請願。
    これがしくじれば、飢え死にして、嫁にも行けぬまま世を去る身でございます。
    恐れながら申し上げます、私は、ベティ様[2]のお部屋へ、暖まりにまいりました、
      寒かったものですから。
    そのとき財布には、七ポンド四シリング六ペンス、
      （ファージング銅貨は別に）、小銭と金貨で入っておりました。
    それで、昨晩は奥様のお買物をしていたものですから、
    お金を数えて、ちゃんと合っているか、確かめようと思ったのでございます。
    お聞きくださいな、私の長持ちの錠前は、ひどく具合が悪いので、
    私のお金は全部――神様もご存じの、ほんのわずかな蓄えですが――、
    肌着のすぐ上で、腰に結びつけたポケットに入れておくのでございます。
    それで、財布をしまおうとしたとき、何の因果か、肌着の縫い目が、
      ほつれておりまして、
    ポケットへ入らず、そのまま下へ、すべり落ちたのでございます。
    そこへ呼び鈴が鳴り、私は、奥様をお寝かせするため、階下へまいりました。
    神様もご存じのとおり、お金は、私の操と同じほど無事だと、思っておりました。
    ところが、戻ってまいりますと、ポケットが、とても軽いのでございます。
    探ってみて、財布がないと分かったときは、まあ、私は、その場で、
      へたり込んでしまうかと思いました。
    「まあ、どうなさいましたの。」とメアリー。「本当に、」と私、「こんなに困ったことはないわ。
    ねえ、メアリー、私のお財布、どうしたか、知らないかしら。」
    「とんでもない。」とメアリー、「私は、ここから一歩も動いていませんよ。」
    「いいえ、ベティ様のお部屋では、ちゃんと持っていたのよ、それは確かだわ。」と私。
    それで、メアリーは私を寝床に入れ、暖かく掛け物をしてくれましたが、
    私が自分を傷つけないようにと、靴下留めを、こっそり持ち去りました。
    お察しのとおり、私は、一晩じゅう、寝返りばかり打って、
    ほとんど目も閉じず、まんじりともしませんでした。
    それで夢を見ましたの、あたりの人たちの持ち物を、私が調べてまわりますと、
    デュークさん[3]の箱の隅に、ぼろに包まれたお金が、
      見つかったのでございます。
    そこで翌朝、ウィトル[4]に話しましたら、あの人は、ひどく悪態をつきまして、
    そこへ、ワドガー婆さん[5]がまいりました、あの方は、ご存じのとおり、耳が遠いのです。
    「婆さん、私が、どんな損をしたか、
      知っているかい。」と、私は、ありったけの大声で叫びました。
    「いえね、」と婆さん、「コルウェイ卿[6]のお屋敷の皆さんは、たいそう悲しんでいるよ。
    ドロメダリー卿[7]が、火曜日に、きっとおいでになるからね。」
    「もう、私が困っているのは、そんなことじゃないのよ。」と私。
    するとケアリー[8]が、「わしは、この春で、召使いをして、
      二十五年になるが、
    どのお屋敷にいたときも、こんなことは聞いたためしがない。」と言います。
    「いや、」と執事[9]、「私がシュルーズベリー卿の、
      お屋敷にいたころ、
    こんなことがあったな、ちょうど、スグリの実るころだった。」
    そこで私は、疑われている人のところへ行きましたら、しきりに悲しんでおりました。
    （お聞きくださいな、私は、何よりも、泥棒というものが大嫌いなのでございます。）
    それでも、それとなく、その話へ持っていこうと決めまして、
    「デュークさん、困ったことが起きましたねえ、」と申しました。
    「お金なんて、シラミが三跳ねするほども、惜しくはないんですけれどね。[10]
    私が気にするのは、お屋敷の信用なのですよ。
    確かに、七ポンド四シリング六ペンスは、私のお給金には、
      大きな穴をあけますけれど、
    それに、いまどきの奉公は、相続できる財産ではない、と言いますでしょう。
    ねえ、デュークさん、あなたもご存じですし、誰だって分かっていますわね、
    誰の仕業かは決めかねても、お金は、誰かの手なしには、なくならないということを。」
    「悪魔にさらわれてもいいよ、」とあの人は（神様のお守りを祈りながら）、「私が一度でも、それを見たというんならね。」
    そして、私が、散々にののしったかのように、気違いじみた大声を上げました。
    それでは、ご存じのとおり、もう何が言えましょう。
    私は、さっさとあの人から離れ、何も分からぬまま、引き揚げました。
    そうしましたら、今度は皆が、占い師のところへ行けと言うのでございます。
    「いいえ、同じことですよ、もうすぐ、お抱え牧師様[11]がいらっしゃるわ。」と私。
    それで、お抱え牧師様がおいでになりました。召使いたちは、あの方が、私の恋人だと言いますの、
    いつも私の部屋にいらっしゃいますし、私も、いつも、あの方の味方をするものですから。
    ところが、悪魔のいたずらで、私は、ついうっかり、口を滑らせました。
    「牧師さん、盗まれた人の、生まれ星を占うことは、できますか。」
    （お聞きくださいな、あの方は、「牧師さん」と呼ばれるのを、死ぬほどお嫌いなのです。）
    「まったく、ナブさん、もう少し礼儀正しくしてもよいでしょう、」と、あの方。
    「お金がなくなったのなら、ある学識高い神学者の言葉どおり[12]、よろしいか、
    あなたは、私が取り上げる説教の題ではないのです、そう覚えておきなさい。
    私は、これまで、魔法使いと思われたことなど、一度もないのですよ。」
    「まあ、怒らないでくださいな、そんなことは、決して思ったことはありませんわ。
    私が聖職を敬っているのは、ご存じでしょう、牧師の奥さんになるつもりですもの。
    あなたと同じ服を着たお方を、魔法使いだと思ったことは、生まれて一度もございません。」
    すると、あの方は、私に向かって、腰ひもを縄のようによじって見せました、まるで、
    「首でも吊るがいい、私は知らん。」と言うようにして、そのまま行ってしまわれました。
    さて、私は、気を失いそうでした。「まあ、どうしたらいいのかしら。
    お金をなくしたうえに、大事な恋人まで、失くしてしまうわ。」
    そこへ、ご主人様がお呼びになり、「ハリー[13]、泣くんじゃない、
    損の埋め合わせに、少し、やろう。」とおっしゃいました。「では、私も、」と奥様が、
      おっしゃいました。
    でも、私は申しました、「お抱え牧師様が、それでも、承知してくださらなかったら、どうしましょう。」
    そのことなら、閣下方には恐れ入りますが、お二方に請願を出せと、ご主人様がおっしゃったのでございます。
      以上の事情を、どうか、あわれとお考えになり、閣下方の、
      お庇護を賜りたく、
    また、今度の日曜の献金を、私にも、お分けいただきたく存じます。
    そのうえ、さらに、閣下方のお手紙を、賜りまして、
    前述のお抱え牧師様か、その代わりに、もっとよいお方を、私にお与えになるよう、お命じいただきたく存じます。
    そうすれば、貧しい願い人である私は、夜も昼も、
    あるいは、お抱え牧師様が（それが、お仕事ですから[14]）、務めとして、いつまでも、
      お祈り申し上げます。

- id: og-093
  section_id: contract
  kind: note_body
  origin: source
  source_text: Dans le souper magique de M. de Merville, Ninon demande quelle est la maitresse de Louis XVI ? On lui répond, c’est la Nation, cette maitresse corrompra le gouvernement si elle prend trop d’empire.
  translation_ja: メルヴィル氏の『魔法の晩餐』で、ニノンが、ルイ十六世の愛人は誰かと尋ねる。「国民だ」と答えが返る。この愛人が力を握りすぎれば、政府を堕落させるだろう。
  source_languages:
  - fr
  source_locations:

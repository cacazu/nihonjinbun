- id: og-055
  section_id: article-12
  kind: paragraph
  origin: source
  source_text: La garantie des droits de la femme et de la Citoyenne nécessite une utilité majeure ; cette garantie doit être instituée pour l’avantage de tous, & non pour l’utilité particulière de celles à qui elle est confiée.
  translation_ja: 女性および女性市民の権利を保障するには、より大きな公益を旨としなければならない。この保障は万人の利益のために設けるべきで、それを委ねられた女性たちだけの便益のために設けるものではない。

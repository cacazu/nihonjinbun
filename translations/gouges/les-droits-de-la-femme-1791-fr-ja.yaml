- id: og-021
  section_id: rights
  kind: note_body
  origin: source
  source_text: De Paris au Pérou, du Japon jusqu’à Rome, Le plus sot animal, à mon avis, c’est l’homme.
  translation_ja: パリからペルーまで、日本からローマまで、動物のなかでいちばん愚かなのは、私に言わせれば、人間の男。
  source_languages:

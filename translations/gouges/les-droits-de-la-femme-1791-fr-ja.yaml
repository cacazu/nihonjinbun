- id: og-077
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: 'Je reprends mon texte quant aux mœurs. Le mariage est le tombeau de la confiance & de l’amour. La femme mariée peut impunément donner des bâtards à son mari, et la fortune qui ne leur appartient pas. Celle qui ne l’est pas, n’a qu’un foible droit : les lois anciennes et inhumaines lui refusoient ce droit sur le nom & sur le bien de leur père, pour ses enfans, et l’on n’a pas fait de nouvelles lois sur cette matière. Si tenter de donner à mon sexe une consistance honorable et juste, est considéré dans ce moment comme un paradoxe de ma part, et comme tenter l’impossible, je laisse aux hommes à venir la gloire de traiter cette matière ; mais, en attendant, on peut la préparer par l’éducation nationale, par la restauration des mœurs et par les conventions conjugales.'
  translation_ja: さて、風俗についての話に戻ろう。結婚とは、信頼と愛との墓場である。結婚した女性は、罰せられることもなく、ほかの男との間にできた子を夫の子とし、その子たちに本来は属さない財産を渡すことができる。結婚していない女性には、わずかな権利しかない。古い非人間的な法律は、その子どもたちのために父の名と財産を求める権利を彼女に認めなかったし、この点について新しい法律も作られていない。女性に名誉ある正当な地位を与えようとすることが、今のところ私の逆説にすぎず、不可能なことを企てるのだと見なされるなら、この問題を論じる栄誉は後代の人々に譲ろう。だが、それまでの間にも、国民教育、風俗の立て直し、夫婦間の取り決めによって、その下準備はできるのだ。
  source_languages:
  - fr
  source_locations:

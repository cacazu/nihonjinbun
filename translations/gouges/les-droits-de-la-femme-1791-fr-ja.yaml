- id: og-041
  section_id: article-06
  kind: paragraph
  origin: source
  source_text: 'La Loi doit être l’expression de la volonté générale ; toutes les Citoyennes et Citoyens doivent concourir personellement, ou par leurs représentans, à sa formation ; elle doit être la même pour tous : toutes les citoyennes et tous les citoyens, étant égaux à ses yeux, doivent être également admissibles à toutes dignités, places et emplois publics, selon leurs capacités, & sans autres distinctions que celles de leurs vertus et de leurs talents.'
  translation_ja: 法律は一般意志の表現でなければならない。すべての女性市民と男性市民は、自ら、またはその代表を通じて、法律の制定に参加しなければならない。法律はすべての人に同じでなければならない。すべての女性市民と男性市民は法の目に平等であるから、その能力に応じ、美徳と才能以外のいかなる区別もなく、あらゆる栄誉ある地位、職位、公職に等しく就く資格を持たなければならない。

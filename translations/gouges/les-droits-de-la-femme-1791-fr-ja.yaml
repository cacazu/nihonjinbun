- id: og-087d
  section_id: contract
  kind: paragraph
  origin: source
  source_text: Mon opinion seroit encore de raccommoder le pouvoir exécutif avec le pouvoir législatif, car il me semble que l’un est tout, et que l’autre n’est rien ; d’où naîtra, malheureusement peut être, la perte de l’Empire François. Je considère ces deux pouvoirs, comme l’homme et la femme qui doivent être unis, mais égaux en force et en vertu, pour faire un bon ménage.
  translation_ja: 私はまた、行政権と立法権を和解させるべきだと考える。一方がすべてで、他方が無に等しいように見えるからだ。そこから不幸にして、フランス国の破滅さえ生じるかもしれない。私の考えでは、この二つの権力は男と女のようなものだ。よい家庭を営むためには、結ばれていなければならず、それでいて力と徳においては対等でなければならない。
  source_languages:
  - fr
  source_locations:

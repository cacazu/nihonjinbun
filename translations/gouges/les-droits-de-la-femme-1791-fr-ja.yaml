- id: og-012
  section_id: dedication
  kind: paragraph
  origin: source
  source_text: Voilà, Madame, voilà quels sont mes principes. En vous parlant de ma patrie, je perds de vue le but de cette dédicace. C’est ainsi que tout bon Citoyen sacrifie sa gloire, ses intérêts, quand il n’a pour objet que ceux de son pays.
  translation_ja: 陛下、これが私の信条にほかなりません。祖国のことを陛下に申し上げるうち、この献辞の目的を見失ってしまいました。国の栄光、国の利益のほかに願うもののないとき、よき市民とは誰しも、このように自身の栄光と利益を犠牲にするものです。

- id: og-080
  section_id: contract
  kind: paragraph
  origin: source
  source_text: 'Nous N et N, mus par notre propre volonté, nous unissons pour le terme de notre vie, et pour la durée de nos penchans mutuels, aux conditions suivantes : Nous entendons & voulons mettre nos fortunes en communauté, en nous réservant cependant le droit de les séparer en faveur de nos enfans, et de ceux que nous pourrions avoir d’une inclination particulière, reconnaissant mutuellement que notre bien appartient directement à nos enfans, de quelque lit qu’ils sortent, et que tous indistinctement ont le droit de porter le nom des pères et mères qui les ont avoués, et nous imposons de souscrire à la loi qui punit l’abnégation de son propre sang.'
  translation_ja: われわれ何某と何某とは、自らの意志により、われわれの生涯にわたり、また互いに愛情を抱き続けるあいだ、以下の条件のもとに結ばれる。われわれは双方の財産を共有とすることを意図し、かつ望む。ただし、われわれの子どもたち、およびいずれかが別の相手への愛情からもうけるかもしれない子どもたちのために、それを分割する権利は留保する。われわれの財産は、生まれた床がいずれであれ、われわれの子どもたちに直接属すること、またすべての子どもには区別なく、自らの子として認知した父と母の名を名乗る権利があることを、われわれは互いに認める。また、自分の血を引く者を否認する行為を罰する法律に従う義務を引き受ける。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '17'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/19
    source_sequence: 71
  - source_id: wikisource-fr
    precision: page
    printed_page: '17'

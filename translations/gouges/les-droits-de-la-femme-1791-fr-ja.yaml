- id: og-001
  section_id: dedication
  kind: paragraph
  origin: source
  source_text: Madame,
  translation_ja: 王妃陛下、
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '1'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/3
    source_sequence: 1
  - source_id: wikisource-fr
    precision: page
    printed_page: '1'
    url: https://fr.wikisource.org/w/index.php?oldid=12057319
    source_sequence: 1
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-001-print
  translation_status: reviewed
- id: og-002
  section_id: dedication
  kind: paragraph
  origin: source
  source_text: Peu faite au langage que l’on tient aux Rois, je n’emploierai point l’adulation des Courtisans pour vous faire hommage de cette singulière production. Mon but, Madame, est de vous parler franchement ; je n’ai pas attendu, pour m’exprimer ainsi, l’époque de la Liberté ; je me suis montrée avec la même énergie dans un temps où l’aveuglement des Despotes punissait une si noble audace.
  translation_ja: 私は、王侯に向かってものを申すときの言葉遣いには慣れておりません。この風変わりな一篇をお捧げするのに、宮廷人のようにおべっかを使うつもりもございません。陛下に率直に申し上げること、それが私の望みです。このようにものを言うのに、私は自由の時代を待ちはいたしませんでした。目のくらんだ専制君主が、かくも気高い大胆さを罰した頃にも、私は今と変わらぬ熱意を示したのです。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '1'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/3
    source_sequence: 2
  - source_id: wikisource-fr
    precision: page
    printed_page: '1'
    url: https://fr.wikisource.org/w/index.php?oldid=12057319
    source_sequence: 2
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-002-print
  translation_status: reviewed
- id: og-003
  section_id: dedication
  kind: paragraph
  origin: source
  source_text: Lorsque tout l’Empire vous accusait et vous rendait responsable de ses calamités, moi seule, dans un temps de trouble et d’orage, j’ai eu la force de prendre votre défense. Je n’ai jamais pu me persuader qu’une Princesse, élevée au sein des grandeurs, eût tous les vices de la bassesse.
  translation_ja: 国じゅうが陛下を責め、国の災いを陛下のせいにしたとき、騒乱の嵐のただなかで、ただ一人、陛下を弁護する勇気を持ったのは私でした。栄華のうちに育った姫君が、卑しさのもたらす悪徳をことごとく備えておられようとは、私にはどうしても思えませんでした。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '1'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/3
    source_sequence: 3
  - source_id: wikisource-fr
    precision: page
    printed_page: '1'
    url: https://fr.wikisource.org/w/index.php?oldid=12057319
    source_sequence: 3
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-003-print
  translation_status: reviewed
- id: og-004
  section_id: dedication
  kind: paragraph
  origin: source
  source_text: Oui, Madame, lorsque j’ai vu le glaive levé sur vous, j’ai jeté mes observations entre ce glaive et la victime ; mais aujourd’hui que je vois qu’on observe de près la foule de mutins soudoyée, & qu’elle est retenue par la crainte des loix, je vous dirai, Madame, ce que je ne vous aurois pas dit alors.
  translation_ja: そうです、陛下。陛下の頭上に剣が振り上げられたのを見て、私はその刃と犠牲者との間に、自分の意見を書いて投じました。けれども今日、金で雇われた暴徒の群れは厳しく見張られ、法を恐れておとなしくしています。今ならば、陛下、あのときには申し上げなかったことを申し上げます。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '2'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/4
    source_sequence: 4
  - source_id: wikisource-fr
    precision: page
    printed_page: '2'
    url: https://fr.wikisource.org/w/index.php?oldid=6146440
    source_sequence: 4
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-004-print
  translation_status: reviewed
- id: og-005
  section_id: dedication
  kind: paragraph
  origin: source
  source_text: Si l’étranger porte le fer en France, vous n’êtes plus à mes yeux cette Reine faussement inculpée, cette Reine intéressante, mais une implacable ennemie des Français. Ah ! Madame, songez que vous êtes mère et épouse ; employez tout votre crédit pour le retour des Princes. Ce crédit, si sagement appliqué, raffermit la couronne du père, la conserve au fils, et vous réconcilie l’amour des Français. Cette digne négociation est le vrai devoir d’une Reine. L’intrigue, la cabale, les projets sanguinaires précipiteroient votre chûte, si l’on pouvait vous soupçonner capable de semblables desseins.
  translation_ja: もし外国の軍勢がフランスに刃を向けるなら、私の目に映る陛下は、濡れ衣を着せられて同情に値する王妃ではもはやなく、フランス人にとって容赦のない敵です。ああ陛下、ご自分が母であり妻であることをお考えください。王族たちを呼び戻すため、あらゆるお力をお尽くしください。そうして賢明に力を用いれば、父王の冠は揺るぎなくなり、王子のために守られ、陛下も再びフランス人の愛をお取り戻しになります。この立派な交渉こそ、王妃の真の務めです。陰謀、徒党、血なまぐさい企てなど、陛下にそれができると疑われるだけで、ご自身の没落を早めましょう。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '2'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/4
    source_sequence: 5
  - source_id: wikisource-fr
    precision: page
    printed_page: '2'
    url: https://fr.wikisource.org/w/index.php?oldid=6146440
    source_sequence: 5
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-005-print
  translation_status: reviewed
- id: og-006
  section_id: dedication
  kind: paragraph
  origin: source
  source_text: 'Qu’un plus noble emploi, Madame, vous caractérise, excite votre ambition, et fixe vos regards. Il n’appartient qu’à celle que le hasard a élevée à une place éminente, de donner du poids à l’essor des Droits de la Femme, et d’en accélérer les succès. Si vous étiez moins instruite, Madame, je pourrais craindre que vos intérêts particuliers ne l’emportassent sur ceux de votre sexe. Vous aimez la gloire : songez, Madame, que les plus grands crimes s’immortalisent comme les plus grandes vertus ; mais quelle différence de célébrité dans les fastes de l’histoire ! l’une est sans cesse prise pour exemple, et l’autre est éternellement l’exécration du genre humain.'
  translation_ja: 陛下にはもっと気高い仕事にこそ、ご自身の真価を示し、大望を燃やし、目をお向けいただきたいのです。女性の権利が羽ばたこうとするいま、そこに重みを加え、その実現を早めることができるのは、運命に選ばれてその高い地位にお就きになった方だけです。もし陛下がこれほど物事に通じておられなければ、ご自身の利害が女性全体の利益にまさるのではと、私は案じたでしょう。陛下は栄光を愛しておいでです。お考えください。大きな罪も、偉大な徳に劣らず不滅の名を残しますが、歴史の記録に残る名声にはなんという違いがあることでしょう。一方はいつまでも模範とされ、もう一方は永遠に人類の憎しみを受けるのです。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '2'
    printed_page_end: '3'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/4
    source_sequence: 6
  - source_id: wikisource-fr
    precision: page
    printed_page: '2'
    printed_page_end: '3'
    url: https://fr.wikisource.org/w/index.php?oldid=6146440
    source_sequence: 6
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-006-print
  translation_status: reviewed
- id: og-008
  section_id: dedication
  kind: paragraph
  origin: source
  source_text: On ne vous fera jamais un crime de travailler à la restauration des mœurs, à donner à votre sexe toute la consistance dont il est susceptible. Cet ouvrage n’est pas le travail d’un jour, malheureusement pour le nouveau régime. Cette révolution ne s’opérera que quand toutes les femmes seront pénétrées de leur déplorable sort, & des droits qu’elles ont perdus dans la société. Soutenez, Madame, une si belle cause ; défendez ce sexe malheureux, et vous aurez bientôt pour vous une moitié du royaume, et le tiers au moins de l’autre.
  translation_ja: 風俗を立て直し、女性がその持てる力にふさわしい確かな地位を得るようお努めになったところで、それを罪に問う者はおりますまい。新しい体制にとっては残念なことに、これは一日で成し遂げられる仕事ではございません。この革命は、すべての女性が、自分たちの嘆かわしい境遇と、社会のなかで失った権利とを身にしみて知ってはじめて成し遂げられるものです。陛下、どうかこのすばらしい大義をお支えください。この不幸な女性たちをお守りください。そうすれば間もなく、王国の半数はもとより、残る半数の少なくとも三分の一までは、陛下の味方につくでしょう。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '3'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/5
    source_sequence: 7
  - source_id: wikisource-fr
    precision: page
    printed_page: '3'
    url: https://fr.wikisource.org/w/index.php?oldid=14583823
    source_sequence: 7
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-008-print
  translation_status: reviewed
- id: og-009
  section_id: dedication
  kind: paragraph
  origin: source
  source_text: Voilà, Madame, voilà par quels exploits vous devez vous signaler et employer votre crédit. Croyez-moi, Madame, notre vie est bien peu de chose, sur-tout pour une Reine, quand cette vie n’est pas embellie par l’amour des peuples, et par les charmes éternels de la bienfaisance.
  translation_ja: 陛下、こうした働きにこそ、お力を用い、ご自身のお名前を輝かせていただきたいのです。どうか私の言葉をお信じください。人々の愛と、いつまでも色あせぬ慈善の魅力とに彩られぬ人生など、ほんのわずかな値打ちしかございません。ましてや王妃の人生なら、なおのことです。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '3'
    printed_page_end: '4'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/5
    source_sequence: 8
  - source_id: wikisource-fr
    precision: page
    printed_page: '3'
    printed_page_end: '4'
    url: https://fr.wikisource.org/w/index.php?oldid=14583823
    source_sequence: 8
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-009-print
  translation_status: reviewed
- id: og-011
  section_id: dedication
  kind: paragraph
  origin: source
  source_text: S’il est vrai que des Français arment contre leur patrie toutes les puissances ; pourquoi ? pour de frivoles prérogatives, pour des chimères. Croyez, Madame, si j’en juge par ce que je sens, le parti monarchique se détruira de lui-même, qu’il abandonnera tous les tyrans, et tous les cœurs se rallieront autour de la patrie pour la défendre.
  translation_ja: フランス人が祖国に敵対するよう諸外国に武器を取らせているというのが本当でしたら、それは何のためでしょう。つまらぬ特権のため、幻のためです。陛下、お信じください。私自身の気持ちをもとに判断するなら、王党派はひとりでに崩れ去り、あらゆる暴君を見捨て、人々の心は一つになって祖国のもとに集い、これを守りましょう。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '4'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/6
    source_sequence: 9
  - source_id: wikisource-fr
    precision: page
    printed_page: '4'

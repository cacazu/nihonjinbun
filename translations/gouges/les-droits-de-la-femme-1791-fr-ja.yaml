  translation_status: reviewed
- id: og-020
  section_id: rights
  kind: paragraph
  origin: source
  source_text: L’homme seul s’est fagoté un principe de cette exception. Bisarre, aveugle, boursoufflé de sciences et dégénéré, dans ce siècle de lumières et de sagacité, dans l’ignorance la plus crasse, il veut commander en despote sur un sexe qui a reçu toutes les facultés intellectuelles ; il prétend jouir de la révolution, et réclamer ses droits à l’égalité, pour ne rien dire de plus.
  translation_ja: 男だけが、自分は例外だという原則を勝手にでっち上げたのだ。奇妙で、ものを見る目がなく、学問を鼻にかけて堕落した男は、この啓蒙と明察の世にあって、甚だしい無知のまま、知性にかかわるあらゆる能力を授けられた女たちに、専制君主として命令しようとする。それでいて革命の実りを享受し、平等への自分の権利を主張するというのだ。これ以上は言うまい。

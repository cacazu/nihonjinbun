- id: og-052
  section_id: article-11
  kind: paragraph
  origin: source
  source_text: La libre communication des pensées et des opinions est un des droits les plus précieux de la femme, puisque cette liberté assure la légitimité des pères envers les enfans. Toute Citoyenne peut donc dire librement, je suis mère d’un enfant qui vous appartient, sans qu’un préjugé barbare la force à dissimuler la vérité ; sauf à répondre de l’abus de cette liberté dans les cas déterminés par la Loi.
  translation_ja: 思想と意見を自由に伝え合うことは、女性の最も貴重な権利の一つである。この自由によって、子どもにとって誰が正当な父であるかが確かになるからだ。ゆえに、いかなる女性市民も、野蛮な偏見に強いられて真実を隠すことなく、「私はあなたの子の母です」と自由に言うことができる。ただし、法律の定める場合には、この自由の濫用について責任を負う。

  translation_status: reviewed
- id: og-080b
  section_id: contract
  kind: paragraph
  origin: source
  source_text: Nous nous obligeons également, au cas de séparation, de faire le partage de notre fortune, et de prélever la portion de nos enfans indiquée par la loi ; et, au cas d’union parfaite, celui qui viendrait à mourir, se désisteroit de la moitié de ses propriétés en faveur de ses enfans ; et si l’un mouroit sans enfans, le survivant hériteroit de droit, à moins que le mourant n’ait disposé de la moitié du bien commun en faveur de qui il jugeroit à propos.
  translation_ja: 別離する場合には、われわれの財産を分割し、法律の定める子どもたちの取り分を先に取り分けることも約束する。結びつきが最後まで保たれた場合には、先に死ぬ者が自分の財産の半分を子どもたちに譲る。一方が子を残さずに死ぬ場合、残る者は当然の権利として相続する。ただし死に臨む者が、ふさわしいと認めた相手のために共有財産の半分をすでに処分していた場合は、そのかぎりでない。
  source_languages:
  - fr
  source_locations:

- id: og-068
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: Femme, réveille-toi ; le tocsin de la raison se fait entendre dans tout l’univers ; reconnois tes droits. Le puissant empire de la nature n’est plus environné de préjugés, de fanatisme, de superstition et de mensonges. Le flambeau de la vérité a dissipé tous les nuages de la sottise et de l’usurpation. L’homme esclave a multiplié ses forces, a eu besoin de recourir aux tiennes pour briser ses fers. Devenu libre, il est devenu injuste envers sa compagne.
  translation_ja: 女よ、目を覚ませ。理性の早鐘が世界じゅうで鳴っている。自分の権利を知れ。自然の強大な王国を取り巻いていた偏見、狂信、迷信、偽りは、もうない。真理のたいまつが、愚かさと権利の横取りとが生んだ雲をすべて払いのけた。奴隷だった男は、力を倍加させ、自分を縛る鎖を砕くために、あなたの力まで借りねばならなかった。そうして自由になるや、連れ合いに対しては不公正になったのだ。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '11'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/13

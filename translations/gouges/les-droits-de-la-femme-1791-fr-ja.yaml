- id: og-073
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: Dans cette sorte d’antithèse, que de remarques n’ai-je point à offrir ! je n’ai qu’un moment pour les faire, mais ce moment fixera l’attention de la postérité la plus reculée.
  translation_ja: この種の対照についてなら、私にはどれだけでも言うことがある。述べる暇はほんのわずかしかないが、この一瞬に、はるかな後世の人たちも目を留めるだろう。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '14'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/16
    source_sequence: 63
  - source_id: wikisource-fr
    precision: page
    printed_page: '14'
    url: https://fr.wikisource.org/w/index.php?oldid=12057382

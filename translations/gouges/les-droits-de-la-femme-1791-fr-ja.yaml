- id: og-046
  section_id: article-08
  kind: paragraph
  origin: source
  source_text: La loi ne doit établir que des peines strictement & évidemment nécessaires, & nul ne peut être puni qu’en vertu d’une Loi établie et promulguée antérieurement au délit et légalement appliquée aux femmes.
  translation_ja: 法律が定めてよい刑罰は、厳密に、かつ明らかに必要なものだけである。何人も、犯罪に先立って制定・公布され、かつ女性に対して適法に適用された法律によるのでなければ、罰せられることはない。

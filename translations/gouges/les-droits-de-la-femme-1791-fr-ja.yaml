- id: og-018
  section_id: rights
  kind: paragraph
  origin: source
  source_text: Homme, es-tu capable d’être juste ? C’est une femme qui t’en fait la question ; tu ne lui ôteras pas du moins ce droit. Dis-moi ? Qui t’a donné le souverain empire d’opprimer mon sexe ? ta force ? tes talents ? Observe le créateur dans sa sagesse ; parcours la nature dans toute sa grandeur, dont tu sembles vouloir te rapprocher, et donne-moi, si tu l’oses, l’exemple de cet empire tirannique.
  translation_ja: 男よ、おまえは公正でいられるか。こう尋ねるのは一人の女だ。せめて尋ねる権利までは取り上げまい。言ってみたまえ。女たちを抑圧してよいという至上の権力を、おまえに与えたのは誰だ。腕力か。才能か。創造主の英知を見よ。その偉大さに少しでも近づこうとしているらしい自然のすみずみまで歩いてみよ。そして、おまえにそれだけの勇気があるなら、そこからこの専制支配の実例を一つ、私に示してみよ。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page

  translation_status: reviewed
- id: og-084b
  section_id: contract
  kind: paragraph
  origin: source
  source_text: Je voudrois, en même tems, comme je l’ai exposée dans le bonheur primitif de l’homme, en 1788, que les filles publiques fussent placées dans des quartiers désignés. Ce ne sont pas les femmes publiques qui contribuent le plus à la dépravation des mœurs, ce sont les femmes de la société. En restaurant les dernières, on modifie les premières. Cette chaîne d’union fraternelle offrira d’abord le désordre, mais par les suites, elle produira à la fin un ensemble parfait.
  translation_ja: あわせて、私が一七八八年の『人間の原初の幸福』で述べたように、売春に従事する女たちには指定した地区に住んでほしい。風俗の堕落に最も大きく手を貸しているのは街の女たちではない。上流社会の女たちだ。後者を立て直せば、前者も変わる。この同胞の結びつきの鎖は、はじめこそ無秩序のさまを見せるだろうが、やがて、ついには見事に調和した全体を生み出すだろう。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791

- id: og-068b
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: 'Ô femmes ! femmes, quand cesserez-vous d’être aveugles ? Quels sont les avantages que vous avez recueillis dans la révolution ? Un mépris plus marqué, un dédain plus signalé. Dans les siècles de corruption vous n’avez régné que sur la foiblesse des hommes. Votre empire est détruit ; que vous reste-t-il donc ? la conviction des injustices de l’homme. La réclamation de votre patrimoine, fondée sur les sages décrets de la nature ; qu’auriez-vous à redouter pour une si belle entreprise ? le bon mot du Législateur des noces de Cana ? Craignez-vous que nos Législateurs Français, correcteurs de cette morale, long-temps accrochée aux branches de la politique, mais qui n’est plus de saison, ne vous répètent : femmes, qu’y a-t-il de commun entre vous et nous ? Tout, auriez-vous à répondre.'
  translation_ja: ああ、女たちよ、女たちよ、いつまで目を閉ざしているのか。革命であなたがたが手にしたものは何か。前にもましてあらわな軽蔑、いよいよ隠そうともしない侮りだ。腐敗の世紀、あなたがたが支配できたのは男の弱さだけだった。その支配も崩れ去ったいま、何が残るのか。男たちの不正を思い知ったことだ。自然の賢明な定めを根拠に、自分に受け継がれるはずの財産を要求することだ。これほどすばらしい企てで、何を恐れることがあろう。カナの婚礼の立法者が放ったあの機知の一言だろうか。あの教訓は長らく政治の枝にしがみついていたが、もう時代に合わない。それを正すはずのフランスの立法者たちに、こう言い返されるのが怖いのか。「女たちよ、あなたがたとわれわれに、何のかかわりがあるのか」。こう答えればよい。「すべてです」と。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '12'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/14
    source_sequence: 58
  - source_id: wikisource-fr
    precision: page
    printed_page: '12'
    url: https://fr.wikisource.org/w/index.php?oldid=12057373
    source_sequence: 58
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-068-print
  translation_status: reviewed
- id: og-068c
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: S’ils s’obstinoient, dans leur faiblesse, à mettre cette inconséquence en contradiction avec leurs principes ; opposez courageusement la force de la raison aux vaines prétentions de supériorité ; réunissez-vous sous les étendards de la philosophie ; déployez toute l’énergie de votre caractère, et vous verrez bientôt ces orgueilleux, non serviles adorateurs rampans à vos pieds, mais fiers de partager avec vous les trésors de l’Être Suprême. Quelles que soient les barrières que l’on vous oppose, il est en votre pouvoir de les affranchir ; vous n’avez qu’à le vouloir.
  translation_ja: もし彼らが弱さゆえに、自分で掲げた原則と矛盾するこの筋違いな考えにあくまでも固執するなら、根も葉もない優越の主張に、勇気をもって理性の力を対置しなさい。哲学の旗のもとに集い、あなたがたの気性に宿る力を存分に発揮しなさい。そうすれば、あの高慢な男たちもやがて、足もとを這う卑屈な崇拝者としてではなく、至高の存在の宝をあなたがたと分かち合うことを誇りとして、姿を現すだろう。どんな障壁を築かれても、それを越える力はあなたがたにある。ただそうしようと望めばよい。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '12'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/14
    source_sequence: 59
    printed_page_end: '13'
  - source_id: wikisource-fr
    precision: page

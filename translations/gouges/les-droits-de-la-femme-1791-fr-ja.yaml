- id: og-086
  section_id: contract
  kind: paragraph
  origin: source
  source_text: 'J’offre un moyen invincible pour élever l’ame des femmes ; c’est de les joindre à tous les exercices de l’homme : si l’homme s’obstine à trouver ce moyen impraticable, qu’il partage avec la femme, non à son caprice, mais par la sagesse des loix. Le préjugé tombe, les mœurs s’épurent, et la nature reprend tous ses droits. Ajoutez-y le mariage des prêtres ; le Roi, raffermi sur son trône, et le gouvernement français ne sauroit plus périr.'
  translation_ja: 女性の精神を高めるための、何ものにも負けない手だてを一つ示そう。男性の行うあらゆる活動に女性も参加させることだ。男がなおも実行は無理だと言い張るなら、自分の気まぐれではなく、賢明な法律に従って女と分かち合うがいい。偏見は崩れ、風俗は清まり、自然はその権利をことごとく取り戻す。それに、聖職者の結婚と、王座に揺るぎなく座る国王とを加えてみよ。そうすればフランスの政府はもはや滅びることはありえない。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '20'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/22
    source_sequence: 78
  - source_id: wikisource-fr

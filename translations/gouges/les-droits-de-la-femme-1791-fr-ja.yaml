- id: og-090
  section_id: contract
  kind: paragraph
  origin: source
  source_text: Il est donc vrai que nul individu ne peut échapper à son sort ; j’en fais l’expérience aujourd’hui.
  translation_ja: なるほど、人は誰も自分の運命からは逃れられないものだ。今日、私はそれを身をもって知った。
  source_languages:
  - fr
  source_locations:

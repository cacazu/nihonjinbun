- id: og-039
  section_id: article-05
  kind: paragraph
  origin: source
  source_text: 'Les loix de la nature et de la raison défendent toutes actions nuisibles à la société : tout ce qui n’est pas défendu par ces loix, sages et divines, ne peut être empêché, et nul ne peut être contraint à faire ce qu’elles n’ordonnent pas.'
  translation_ja: 自然と理性の法は、社会に害を及ぼすあらゆる行為を禁じる。これらの賢明にして神聖な法が禁じていないことを妨げてはならず、これらの法が命じていないことを誰にも強いてはならない。

  translation_status: reviewed
- id: og-068d
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: Passons maintenant à l’effroyable tableau de ce que vous avez été dans la société ; & puisqu’il est question, en ce moment, d’une éducation nationale, voyons si nos sages Législateurs penseront sainement sur l’éducation des femmes.
  translation_ja: では、これまで社会のなかであなたがたが何であったか、その恐ろしい光景に目を移そう。ちょうどいま国民教育が論じられている。われらの賢明な立法者たちは女性の教育についてもまっとうに考えるか、見届けようではないか。
  source_languages:
  - fr
  source_locations:

- id: og-092
  section_id: contract
  kind: paragraph
  origin: source
  source_text: L’économie n’est point défendue, sur-tout dans ce tems de misère. J’habite la campagne. Ce matin à huit heures je suis partie d’Auteuil, & me suis acheminée vers la route qui conduit de Paris à Versailles, où l’on trouve souvent ces fameuses guinguettes qui ramassent les passans à peu de frais. Sans doute une mauvaise étoile me poursuivoit dès le matin. J’arrive à la barrière où je ne trouve pas même le triste sapin aristocrate. Je me repose sur les marches de cet édifice insolent qui recéloit des commis.
  translation_ja: 節約は禁じられてはいない。ましてこの困窮の時代なら、なおさらだ。私は田舎に住んでいる。今朝八時、オートゥイユを出て、パリからヴェルサイユへ通じる街道に向かった。そこでは、わずかな運賃で通りすがりの人を拾う、あの名物の乗り物によくお目にかかる。きっと朝から悪い星に追われていたのだろう。市門に着いてみれば、あのみすぼらしいお貴族様の辻馬車さえ見当たらない。徴税の役人たちをひそませた、あのふてぶてしい建物の階段でひと休みした。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '22'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/24
    source_sequence: 86
  - source_id: wikisource-fr
    precision: page
    printed_page: '22'

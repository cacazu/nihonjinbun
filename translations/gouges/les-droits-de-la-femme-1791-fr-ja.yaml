  kind: paragraph
  origin: source
  source_text: La Femme naît libre et demeure égale à l’homme en droits. Les distinctions sociales ne peuvent être fondées que sur l’utilité commune.
  translation_ja: 女性は自由な者として生まれ、権利において男性と平等であり続ける。社会的な区別は、共同の利益だけを根拠としうる。

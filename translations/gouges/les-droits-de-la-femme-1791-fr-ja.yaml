- id: og-057
  section_id: article-13
  kind: paragraph
  origin: source
  source_text: Pour l’entretien de la force publique, & pour les dépenses d’administration, les contributions de la femme et de l’homme sont égales ; elle a part à toutes les corvées, à toutes les tâches pénibles ; elle doit donc avoir de même part à la distribution des places, des emplois, des charges, des dignités et de l’industrie.
  translation_ja: 公の武力を維持するにも、行政の費用をまかなうにも、女性と男性の負担は等しい。女性はあらゆる賦役とつらい仕事を分担している。したがって、職位、雇用、官職、栄誉ある地位、産業に携わる機会の配分にも、同じようにあずからねばならない。

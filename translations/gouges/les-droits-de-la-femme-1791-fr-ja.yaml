- id: og-064
  section_id: article-16
  kind: paragraph
  origin: source
  source_text: Toute société, dans laquelle la garantie des droits n’est pas assurée, ni la séparation des pouvoirs déterminée, n’a point de constitution ; la constitution est nulle, si la majorité des individus qui composent la Nation, n’a pas coopéré à sa rédaction.
  translation_ja: 権利の保障が確保されず、権力の分立も定められていない社会には、憲法はない。国民を構成する人々の過半数がその起草に加わらなかったならば、その憲法は無効である。
  source_languages:
  - fr
  source_locations:

- id: og-092f
  section_id: contract
  kind: paragraph
  origin: source
  source_text: Semblables aventures arrivent indistinctement aux bons patriotes, comme aux mauvais. Il n’y a qu’un cri sur les désordres des sections & des tribunaux. La justice ne se rend pas ; la loi est méconnue, & la police se fait, Dieu sait comment. On ne peut plus retrouver les cochers à qui l’on confie des effets ; ils changent les numéros à leur fantaisie, & plusieurs personnes, ainsi que moi, ont fait des pertes considérables dans les voitures. Sous l’ancien régime, quel que fût son brigandage, on trouvait la trace de ses pertes, en faisant un appel nominal des cochers, & par l’inspection exacte des numéros ; enfin on étoit en sûreté. Que font ces juges de paix ? que font ces comissaires, ces inspecteurs du nouveau régime ? Rien que des sottises & des monopoles. L’Assemblée Nationale doit fixer toute son attention sur cette partie qui embrasse l’ordre social.
  translation_ja: こうした出来事は、善き愛国者であれ悪しき愛国者であれ、分け隔てなく降りかかる。各区と裁判所の混乱には、誰もが声をそろえて嘆いている。正義は行われず、法律は顧みられず、警察がどう働いているのかは神のみぞ知る。荷物を預けた御者さえ、あとになって捜し出せない。彼らは好き勝手に車の番号を変え、私をはじめ何人もの人が馬車で相当な損をしている。旧体制はどれほど人を食いものにしていたとはいえ、御者の名前を一人ずつ呼び上げ、番号をきちんと調べれば、なくした物の行方を追うことができた。要するに、安心できたのである。いまの治安判事は何をしているのか。新体制のこの委員や監察官たちは何をしているのか。ばかなまねと、自分たちだけの利益を図ることばかりだ。社会の秩序にかかわるこの領域に、国民議会はありったけの注意を向けねばならない。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '24'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/26
    source_sequence: 91
  - source_id: wikisource-fr
    precision: page
    printed_page: '24'
    url: https://fr.wikisource.org/w/index.php?oldid=12057476
    source_sequence: 91
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-092-print
  translation_status: reviewed
- id: og-096
  section_id: contract
  kind: paragraph
  origin: source
  source_text: P. S. Cet ouvrage étoit composé depuis quelques jours ; il a été retardé encore à l’impression ; et au moment que M. Taleyrand, dont le nom sera toujours cher à la postérité, venant de donner son ouvrage sur les principes de l’éducation nationale, cette production étoit déjà sous la presse. Heureuse si je me suis rencontrée avec les vues de cet orateur ! Cependant je ne puis m’empêcher d’arrêter la presse, et de faire éclater la pure joie, que mon cœur a ressentie à la nouvelle que le roi venoit d’accepter la Constitution, et que l’assemblée nationale, que j’adore actuellement, sans excepter l’abbé Maury ; et la Fayette est un dieu, avoit proclamé d’une voix unanime une amnistie générale. Providence divine, fais que cette joie publique ne soit pas une fausse illusion ! Renvoie-nous, en corps, tous nos fugitifs, et que je puisse avec un peuple aimant, voler sur leur passage ; et dans ce jour solemnel, nous rendrons tous hommage à ta puissance.
  translation_ja: 追伸　本書の原稿は数日前にできあがっていたが、印刷でもさらに遅れた。その名がいつまでも後の世の人々に愛されるだろうタレーラン氏が、国民教育の原理についての著作を発表したばかりのその時には、この一篇はもう印刷にかかっていた。もし私の考えがこの弁論家の見解と一致していたなら、うれしいことだ！　それでも私は、印刷機を止めて、わが心にわき上がったまじりけのない喜びをほとばしらせずにはいられない。国王がたったいま憲法を受諾したこと、そして私が今やモーリ師ひとりをも除かず敬愛する国民議会が（ラファイエットなどはもう神様だ）、満場一致で大赦を宣したという知らせを聞いたのである。天の摂理よ、どうかこの公の喜びをはかない幻に終わらせたもうな！　われらのもとを去った者たちをひとり残らずお返しください。愛情深い人民とともに、その帰路へと私を飛んでゆかせてください。その厳粛な日、私たちはみな、あなたのみ力をたたえるでしょう。
  source_languages:
  - fr
  source_locations:

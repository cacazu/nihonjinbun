    printed_page_end: '23'
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-092-print
  translation_status: reviewed
- id: og-092c
  section_id: contract
  kind: paragraph
  origin: source
  source_text: 'Je reste à-peu-près vingt minutes ; & fatiguée de marche, de composition & d’impression, je me propose d’aller prendre un bain dans le quartier du Temple, où j’allois dîner. J’arrive à onze heures moins un quart à la pendule du bain ; je devois donc au cocher une heure & demie ; mais, pour ne pas avoir de dispute avec lui, je lui offre 48 sols : il exige plus, comme d’ordinaire ; il fait du bruit. Je m’obstine à ne vouloir plus lui donner que son dû, car l’être équitable aime mieux être généreux que dupe. Je le menace de la loi, il me dit qu’il s’en moque, & que je lui payerai deux heures.'
  translation_ja: 二十分ほどそこにいて、歩き疲れ、書き疲れ、印刷にも疲れたので、食事を取りに行くことになっていたタンプル地区で、ひと風呂浴びることにした。浴場の時計で十時四十五分に着いた。だから御者に払うべきなのは一時間半の料金だったが、言い争いはしたくないので四十八スーを差し出した。すると例によって、もっと寄越せと言って騒ぎ始めた。こうなったら正当な取り分を超えては一文も払うまいと、私も意地を張った。公正を重んじる者は、人に気前よくするのは好きでも、だまされるのは嫌いだからだ。法律に訴えると言うと、御者は知ったことか、二時間分は払わせる、と答えた。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '23'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/25
    source_sequence: 88
  - source_id: wikisource-fr
    precision: page
    printed_page: '23'
    url: https://fr.wikisource.org/w/index.php?oldid=12057461
    source_sequence: 88
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-092-print
  translation_status: reviewed
- id: og-092d
  section_id: contract
  kind: paragraph
  origin: source
  source_text: Nous arrivons chez un commissaire de paix, que j’ai la générosité de ne pas nommer, quoique l’acte d’autorité qu’il s’est permis envers moi, mérite une dénonciation formelle. Il ignoroit sans doute que la femme qui réclamoit sa justice étoit la femme auteur de tant de bienfaisance & d’équité. Sans avoir égard à mes raisons, il me condamne impitoyablement à payer au cocher ce qu’il demandoit. Connoissant mieux la loi que lui, je lui dis, Monsieur, je m’y refuse, & je vous prie de faire attention que vous n’êtes pas dans le principe de votre charge.
  translation_ja: そこでわれわれは治安委員のところへ出向いた。私に対して彼がふるった権力は正式な告発に値するけれども、ここは寛大に、その名を伏せておこう。裁きを求めてきた女が、慈善と公正のためにあれほど書いてきたあの女流著述家だとは、おそらく知らなかったのだろう。彼は私の言い分など取り合わず、無慈悲にも、御者の要求どおり払えと命じた。彼より法を知っていた私は言った。「失礼ですが、お断りします。あなたのなさっていることが、お役目の趣旨から外れていることにお気づきいただきたいのです」。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '23'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/25
    source_sequence: 89
  - source_id: wikisource-fr
    precision: page
    printed_page: '23'
    url: https://fr.wikisource.org/w/index.php?oldid=12057461
    source_sequence: 89
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-092-print
  translation_status: reviewed
- id: og-092e
  section_id: contract
  kind: paragraph
  origin: source
  source_text: 'Alors cet homme, ou, pour mieux dire, ce forcené s’emporte, me menace de la Force si je ne paye à l’instant, ou de rester toute la journée dans son bureau. Je lui demande de me faire conduire au tribunal de département ou à la mairie, ayant à me plaindre de son coup d’autorité. Le grave magistrat, en redingote poudreuse & dégoûtante comme sa conversation, m’a dit plaisamment : cette affaire ira sans doute à l’Assemblée Nationale ? Cela se pourroit bien, lui dis-je ; & je m’en fus moitié furieuse & moitié riant du jugement de ce moderne Bride-Oison, en disant : c’est donc là l’espèce d’homme qui doit juger un peuple éclairé ! On ne voit que cela.'
  translation_ja: するとこの男、いや、この乱心者はかっとなり、今すぐ払わないならラ・フォルス監獄に入れるぞ、さもなければ一日じゅうこの事務所にいてもらう、と私を脅した。権力を振りかざされたことを訴えたいので、県の裁判所か市庁舎に連れて行くよう、私は求めた。もったいぶったこの司法官は、その話しぶりに劣らず不潔で、埃にまみれたフロックコートを着て、ひとつしゃれたつもりで言った。「この一件も、きっと国民議会まで行くのでしょうな」。「そうかもしれませんよ」と私は返事し、この当世のへぼ判事ブリドワゾンの判決に、半ば腹を立て、半ば笑いながら立ち去った。こう言いながら。「これが啓蒙された人民を裁くという手合いか！　こんなのばかりだ」。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '23'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/25
    source_sequence: 90
    printed_page_end: '24'
  - source_id: wikisource-fr
    precision: page
    printed_page: '23'
    url: https://fr.wikisource.org/w/index.php?oldid=12057461
    source_sequence: 90
    printed_page_end: '24'
  source_alignment:

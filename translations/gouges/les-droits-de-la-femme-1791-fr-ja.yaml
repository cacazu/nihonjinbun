- id: og-084
  section_id: contract
  kind: paragraph
  origin: source
  source_text: Je voudrois encore une loi qui avantageât les veuves et les demoiselles trompées par les fausses promesses d’un homme à qui elles se seroient attachées ; je voudrois, dis-je, que cette loi forçât un inconstant à tenir ses engagemens, ou à une indemnité proportionnelle à sa fortune. Je voudrois encore que cette loi fût rigoureuse contre les femmes, du moins pour celles qui auroient le front de recourir à une loi qu’elles auroient elles-mêmes enfreinte par leur inconduite, si la preuve en étoit faite.
  translation_ja: 私はさらに、心を寄せた男の偽りの約束に欺かれた寡婦や未婚の女性を保護する法律がほしい。心変わりした男に、約束を守るか、自分の財産に見合った賠償をするか、どちらかを義務づける法律がほしいのだ。同時に、女性に対してもこの法律は厳しくあってほしい。少なくとも、自らの不品行によってこの法を破ったことが証明されたのに、恥知らずにも同じ法にすがろうとする女性に対しては。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '19'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/21

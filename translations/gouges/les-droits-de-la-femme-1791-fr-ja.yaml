- id: og-071
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: Les femmes ont fait plus de mal que de bien. La contrainte et la dissimulation ont été leur partage. Ce que la force leur avoit ravi, la ruse leur a rendu ; elles ont eu recours à toutes les ressources de leurs charmes, et le plus irréprochable ne leur résistoit pas. Le poison, le fer, tout leur étoit soumis ; elles commandoient au crime comme à la vertu. Le gouvernement français, sur-tout, a dépendu, pendant des siècles, de l’administration nocturne des femmes ; le cabinet n’avoit point de secret pour leur indiscrétion ; ambassade, commandement, ministère, présidence, pontificat, cardinalat ; enfin tout ce qui caractérise la sottise des hommes, profane et sacré, tout a été soumis à la cupidité et à l’ambition de ce sexe autrefois méprisable et respecté, et depuis la révolution, respectable et méprisé.
  translation_ja: 女性は善よりも多くの害をなしてきた。押さえつけられ、本心を隠さねばならなかったのが、その境遇だった。力ずくで奪われたものは、知恵をめぐらせて取り戻した。女たちは自分の魅力を出し尽くし、どれほど非の打ちどころのない男もそれに抗えなかった。毒も刃も思うまま、犯罪にも美徳にも号令を下した。とりわけフランスの政府は、幾世紀にもわたって、女たちの夜の采配に左右されてきた。大臣の執務室にも、口の軽い女たちに対して守りおおせる秘密などなかった。大使の職、軍の指揮権、大臣の椅子、長官の職、高位聖職者の座、枢機卿の位。要するに、俗界でも聖界でも、男の愚かさを特徴づけるものは、ことごとく女たちの貪欲と野心に従った。当時は軽蔑に値しながら敬われ、革命後のいまは尊敬に値しながら蔑まれる、その女たちに。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791

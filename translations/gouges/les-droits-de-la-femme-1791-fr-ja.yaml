- id: og-032
  section_id: article-02
  kind: paragraph
  origin: source
  source_text: 'Le but de toute association politique est la conservation des droits naturels et imprescriptibles de la Femme et de l’Homme : ces droits sont la liberté, la propriété, la sûreté, et sur-tout la résistance à l’oppression.'
  translation_ja: あらゆる政治的結合の目的は、女性と男性の、生まれながらの、時効によっても消えない権利を守ることにある。その権利とは自由、所有、安全、とりわけ抑圧に抵抗する権利である。

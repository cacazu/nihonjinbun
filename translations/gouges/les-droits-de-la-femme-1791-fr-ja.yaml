- id: og-066
  section_id: article-17
  kind: paragraph
  origin: source
  source_text: Les propriétés sont à tous les sexes réunis ou séparés ; elles ont pour chacun un droit inviolable et sacré ; nul ne peut en être privé comme vrai patrimoine de la nature, si ce n’est lorsque la nécessité publique, légalement constatée, l’exige évidemment, et sous la condition d’une juste et préalable indemnité.
  translation_ja: 財産は、両性がともに所有することも、別々に所有することもできる。どちらにとっても、財産に対する権利は不可侵で神聖である。財産は自然からまさしく受け継いだものであって、何人もこれを奪われない。例外は、公の必要が法律に従って確かめられ、明らかにこれを要求する場合だけで、それも正当な補償があらかじめ行われることを条件とする。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791

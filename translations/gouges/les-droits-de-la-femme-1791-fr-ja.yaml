- id: og-026
  section_id: preamble
  kind: paragraph
  origin: source
  source_text: Les mères, les filles, les sœurs, représentantes de la nation, demandent d’être constituées en assemblée nationale. Considérant que l’ignorance, l’oubli ou le mépris des droits de la femme, sont les seules causes des malheurs publics et de la corruption des gouvernements, ont résolu d’exposer dans une déclaration solemnelle, les droits naturels, inaliénables et sacrés de la femme, afin que cette déclaration, constamment présente à tous les membres du corps social, leur rappelle sans cesse leurs droits et leurs devoirs, afin que les actes du pouvoir des femmes, et ceux du pouvoir des hommes pouvant être à chaque instant comparés avec le but de toute institution politique, en soient plus respectés, afin que les réclamations des citoyennes, fondées désormais sur des principes simples et incontestables, tournent toujours au maintien de la constitution, des bonnes mœurs, et au bonheur de tous.
  translation_ja: 国民を代表する母たち、娘たち、姉妹たちは、自分たちを国民議会として組織するよう求める。女性の権利が知られず、忘れられ、あるいは軽んじられることだけが、社会の不幸と政府の腐敗の原因であると考え、女性が生まれながらに持ち、譲り渡すことのできない神聖な権利を、厳粛な宣言のうちに明らかにすることを決意した。この宣言が社会のすべての構成員の心にいつもあり、その権利と義務を絶えず思い起こさせるためである。また、女性の権力の行為も男性の権力の行為も、あらゆる政治制度がめざす目的といつでも照らし合わせることができ、それによっていっそう尊重されるためである。そして女性市民の訴えが、今後は明快で異論の余地のない原則に基づき、つねに憲法と良き風俗の維持、すべての人の幸福に役立つためである。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '6'
    printed_page_end: '7'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/8
    source_sequence: 20
  - source_id: wikisource-fr
    precision: page
    printed_page: '6'
    printed_page_end: '7'
    url: https://fr.wikisource.org/w/index.php?oldid=12057343
    source_sequence: 20

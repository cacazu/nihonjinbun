- id: og-037
  section_id: article-04
  kind: paragraph
  origin: source
  source_text: La liberté et la justice consistent à rendre tout ce qui appartient à autrui ; ainsi l’exercice des droits naturels de la femme n’a de bornes que la tyrannie perpétuelle que l’homme lui oppose ; ces bornes doivent être réformées par les loix de la nature et de la raison.
  translation_ja: 自由と正義とは、他者に属するものをすべてその人に返すことにある。したがって、女性が生まれながらの権利を行使するのを制限しているのは、男性が絶えず女性に押しつけてきた専制だけである。この制限は、自然と理性の法によって改められなければならない。

  translation_status: reviewed
- id: og-028
  section_id: preamble
  kind: paragraph
  origin: source
  source_text: En conséquence, le sexe supérieur en beauté comme en courage, dans les souffrances maternelles, reconnaît et déclare, en présence et sous les auspices de l’Être suprême, les Droits suivans de la Femme et de la Citoyenne.
  translation_ja: よって、美しさにおいても、母となる苦しみに耐える勇気においてもまさる性は、至高の存在の前で、その庇護のもとに、女性および女性市民の次の権利を認め、宣言する。

- id: og-050
  section_id: article-10
  kind: paragraph
  origin: source
  source_text: Nul ne doit être inquiété pour ses opinions mêmes fondamentales, la femme a le droit de monter sur l’échafaud ; elle doit avoir également celui de monter à la Tribune ; pourvu que ses manifestations ne troublent pas l’ordre public établi par la Loi.
  translation_ja: 何人も、その意見が根本にかかわるものであっても、それを理由に煩わされてはならない。女性には処刑台に上る権利がある。ならば、演壇に上る権利もまた等しく持たねばならない。ただし、その意見の表明が、法律の定める公の秩序を乱さないかぎりにおいてである。

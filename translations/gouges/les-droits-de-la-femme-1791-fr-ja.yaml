- id: og-034
  section_id: article-03
  kind: paragraph
  origin: source
  source_text: 'Le principe de toute souveraineté réside essentiellement dans la Nation, qui n’est que la réunion de la Femme et de l’Homme : nul corps, nul individu, ne peut exercer d’autorité qui n’en émane expressément.'
  translation_ja: あらゆる主権の源は本質的に国民にあり、国民とは女性と男性の結合にほかならない。いかなる団体も個人も、そこから明示的に出たものでない権力を行使することはできない。

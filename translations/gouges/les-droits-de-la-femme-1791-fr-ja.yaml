- id: og-091
  section_id: contract
  kind: paragraph
  origin: source
  source_text: 'J’avois résolu & décidé de ne pas me permettre le plus petit mot pour rire dans cette production, mais le sort en a décidé autrement : voici le fait :'
  translation_ja: この一篇ではほんのひと言たりとも冗談を言うまいと、固く心に決めていた。それが運命は別のことを決めていたらしい。いきさつはこうだ。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '22'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/24

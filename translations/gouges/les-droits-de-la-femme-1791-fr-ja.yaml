  source_text: Nulle femme n’est exceptée ; elle est accusée, arrêtée, & détenue dans les cas déterminés par la Loi. Les femmes obéissent comme les hommes à cette Loi rigoureuse.
  translation_ja: いかなる女性も例外ではない。法律の定める場合には、女性も訴追され、逮捕され、拘禁される。女性は男性と同じく、この厳しい法律に従う。

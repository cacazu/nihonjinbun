- id: og-082b
  section_id: contract
  kind: paragraph
  origin: source
  source_text: Le riche Épicurien sans enfans, trouve fort bon d’aller chez son voisin pauvre augmenter sa famille. Lorsqu’il y aura une loi qui autorisera la femme du pauvre à faire adopter au riche ses enfans, les liens de la société seront plus resserrés, et les mœurs plus épurées. Cette loi conservera peut-être le bien de la communauté, et retiendra le désordre qui conduit tant de victimes dans les hospices de l’opprobre, de la bassesse et de la dégénération des principes humains, où, depuis long-tems, gémit la nature. Que les détracteurs de la saine philosophie cessent donc de se récrier contre les mœurs primitives, ou qu’ils aillent se perdre dans la source de leurs citations.
  translation_ja: 子どものいない金持ちの快楽主義者は、貧しい隣人の家の子どもを増やしてやるのは大いに結構だと考える。貧しい男の妻が、自分の子をその金持ちに養子として引き取らせられる法律ができたなら、社会の絆はますます強く、風俗はますます清くなるだろう。この法律は、夫婦の共有財産を守りもするだろうし、多くの犠牲者を、恥辱と卑しさと人間の道義の堕落とが集まる救護院へと追いやる無秩序を、食い止めもするだろう。そこでは自然がとうの昔からうめき声を上げている。まっとうな哲学をけなす人々よ、だから、いにしえの風習に抗議の声を上げるのはやめるがいい。さもなくば、自分たちが引き合いに出す典拠の源にさかのぼって、そこで道に迷うがいい。
  source_languages:
  - fr
  source_locations:

- id: og-059
  section_id: article-14
  kind: paragraph
  origin: source
  source_text: Les Citoyennes et Citoyens ont le droit de constater par eux-mêmes, ou par leurs représentans, la nécessité de la contribution publique. Les Citoyennes ne peuvent y adhérer que par l’admission d’un partage égal, non-seulement dans la fortune, mais encore dans l’administration publique, et de déterminer la quotité, l’assiette, le recouvrement et la durée de l’impôt.
  translation_ja: 女性市民と男性市民は、自ら、またはその代表を通じて、公の負担が必要かどうかを確かめる権利を持つ。女性市民がこの負担に同意しうるのは、財産だけでなく公の行政にも対等にあずかることが認められ、税の額、課税の基準、徴収の仕方と期間を決められる場合に限る。

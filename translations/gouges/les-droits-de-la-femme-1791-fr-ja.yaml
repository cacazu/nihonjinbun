  kind: paragraph
  origin: source
  source_text: Une main divine semble répandre par tout l’appanage de l’homme, la liberté ; la loi seule a le droit de réprimer cette liberté, si elle dégénére en licence ; mais elle doit être égale pour tous, c’est elle sur-tout qui doit renfermer l’Assemblée Nationale dans son décret, dicté par la prudence et par la justice. Puisse-t-elle agir de même pour l’état de la France, et se rendre aussi attentive sur les nouveaux abus, comme elle l’a été sur les anciens qui deviennent chaque jour plus effroyables !
  translation_ja: 神の手が、人間に生まれながら授けられた自由を、あまねく行き渡らせようとしているかのようだ。その自由が放縦に堕したとき、これを制する権利があるのは法律だけである。だが法律は万人に平等でなければならない。なかでも国民議会自身に、用心深さと正義に導かれて定めた法令を逸脱させないようにするのは、その法律なのである。議会がフランス国内のことについても同じように行動し、日に日に恐ろしさを増す古い弊害に目を光らせたのと同じくらい、新しい弊害にも注意を向けてくれればよいのだが。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791

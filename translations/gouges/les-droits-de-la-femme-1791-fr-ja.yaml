- id: og-082
  section_id: contract
  kind: paragraph
  origin: source
  source_text: Voilà à-peu-près la formule de l’acte conjugal dont je propose l’exécution. À la lecture de ce bisarre écrit, je vois s’élever contre moi les tartuffes, les bégueules, le clergé et toute la séquelle infernale. Mais combien il offrira aux sages de moyens moraux pour arriver à la perfectibilité d’un gouvernement heureux ! j’en vais donner en peu de mots la preuve physique.
  translation_ja: 以上が、私が実施を提案する婚姻契約書のおおよその文面である。この風変わりな文を読んで、偽善者やお上品ぶった女たち、聖職者に地獄のお供がぞろぞろと、私に立ち向かってくるのが目に見える。だが、良い政治をどこまでもよくしてゆくための道徳上の手だてを、賢明な人々はここにどれほど見いだすだろう。ほんの数言で、実際の暮らしに即した証拠をお目にかけよう。
  source_languages:
  - fr
  source_locations:

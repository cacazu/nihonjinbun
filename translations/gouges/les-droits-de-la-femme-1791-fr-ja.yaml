  translation_status: reviewed
- id: og-087
  section_id: contract
  kind: paragraph
  origin: source
  source_text: 'Il étoit bien nécessaire que je dise quelques mots sur les troubles que cause, dit-on, le décret en faveur des hommes de couleur, dans nos îles. C’est l’à où la nature frémit d’horreur ; c’est l’à où la raison et l’humanité, n’ont pas encore touché les âmes endurcies ; c’est là sur-tout où la division et la discorde agitent leurs habitans. Il n’est pas difficile de deviner les instigateurs de ces fermentations incendiaires : il y en a dans le sein même de l’Assemblée Nationale : ils alument en Europe le feu qui doit embraser l’Amérique.'
  translation_ja: わが国の島々で、有色の人々のための法令が引き起こしているという紛争についても、私はひと言触れずにはいられなかった。そこでは自然が恐ろしさに震え、理性と人間愛は、かたくなになった人々の心をいまだ動かしていない。とりわけそこでは、分裂と不和が住民を揺るがしている。火を噴きかねないこの動揺をあおる者たちを言い当てるのは難しくない。国民議会のまさにその内部にさえいる。彼らはヨーロッパで、やがてアメリカを包む炎に火をつけている。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '20'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/22
    source_sequence: 79
  - source_id: wikisource-fr
    precision: page
    printed_page: '20'
    url: https://fr.wikisource.org/w/index.php?oldid=12057414
    source_sequence: 79
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-087-print
  translation_status: reviewed
- id: og-087b
  section_id: contract
  kind: paragraph
  origin: source
  source_text: 'Les Colons prétendent régner en despotes sur des hommes dont ils sont les pères et les frères ; et méconnoissant les droits de la nature, ils en poursuivent la source jusque dans la plus petite teinte de leur sang. Ces Colons inhumains disent : notre sang circule dans leurs veines, mais nous le répandrons tout, s’il le faut, pour assouvir notre cupidité, ou notre aveugle ambition. C’est dans ces lieux les plus près de la nature, que le père méconnoît le fils ; sourd aux cris du sang, il en étouffe tous les charmes ; que peut-on espérer de la résistance qu’on lui oppose ? la contraindre avec violence, c’est la rendre terrible, la laisser encore dans les fers, c’est acheminer toutes les calamités vers l’Amérique.'
  translation_ja: 植民者たちは、自分がその父であり兄弟でもある人々の上に、専制君主として君臨しようとする。自然の権利を認めず、自分たちの血にほんのわずかでもその色合いが見えれば、そこにまでさかのぼって、その権利の源を追い詰めようとする。この非人間的な植民者たちは言う。「われわれの血があの者たちの血管を流れている。だがわれわれの貪欲や盲目の野心を満たすのに必要なら、その血を一滴残らず流してやる」。自然に最も近いこの地でこそ、父は息子をわが子と認めない。血の呼び声に耳をふさぎ、血の情の魅力を残らず押し殺す。これほどの相手への抵抗を前に、何を期待できるというのか。力で抑え込めば、抵抗はいよいよ恐るべきものになる。なお鎖につないでおけば、あらゆる災いをアメリカに招き寄せることになる。
  source_languages:
  - fr
  source_locations:

    source_sequence: 86
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-092-print
  translation_status: reviewed
- id: og-092b
  section_id: contract
  kind: paragraph
  origin: source
  source_text: 'Neuf heures sonnent, & je continue mon chemin : une voiture s’offre à mes regards, j’y prends place, & j’arrive à neuf heures un quart, à deux montres différentes, au Pont-Royal. J’y prends le sapin, & je vole chez mon Imprimeur, rue Christine, car je ne peux aller que là si matin : en corrigeant mes épreuves, il me reste toujours quelque chose à faire ; si les pages ne sont pas bien serrées & remplies.'
  translation_ja: 九時が鳴る。再び歩きだすと、一台の乗り物が目に入った。それに乗ってポン・ロワイヤルに着いたのは、別々の時計二つで確かめて、九時十五分だった。そこで辻馬車を拾い、クリスティーヌ街の行きつけの印刷屋へと飛んだ。こんな朝早くから訪ねられるのはそこしかない。校正刷りを直していても、紙面がきっちり埋まっていなければ、私にはいつも、まだ何かすることが残っている。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '22'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/24
    source_sequence: 87
    printed_page_end: '23'
  - source_id: wikisource-fr

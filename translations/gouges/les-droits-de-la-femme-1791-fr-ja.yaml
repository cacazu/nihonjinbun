- id: og-019
  section_id: rights
  kind: paragraph
  origin: source
  source_text: Remonte aux animaux, consulte les élémens, étudie les végétaux, jette enfin un coup-d’œil sur toutes les modifications de la matière organisée ; et rends-toi à l’évidence quand je t’en offre les moyens ; cherche, fouille et distingue, si tu peux, les sexes dans l’administration de la nature. Par-tout tu les trouveras confondus, par-tout ils coopèrent avec un ensemble harmonieux à ce chef-d’œuvre immortel.
  translation_ja: 動物にまでさかのぼり、自然界の諸元素に問い、植物を調べよ。つまるところ、生きた物質のあらゆる姿に目をやれ。証拠を見いだす手立てを教えてやろうというのだ。目の前の事実を認めよ。探し、掘り下げ、自然の営みのなかで二つの性の働きを区別できるものならしてみよ。どこでも両者は分かちがたく結びつき、どこでも調和のとれた力を合わせて、この不滅の傑作を支えているはずだ。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '5'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/7

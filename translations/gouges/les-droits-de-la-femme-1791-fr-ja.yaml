- id: og-073b
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: Sous l’ancien régime, tout étoit vicieux, tout étoit coupable ; mais ne pourroit-on pas apercevoir l’amélioration des choses dans la substance même des vices ? Une femme n’avoit besoin que d’être belle ou aimable ; quand elle possédoit ces deux avantages, elle voyoit cent fortunes à ses pieds. Si elle n’en profitoit pas, elle avoit un caractère bizarre, ou une philosophie peu commune, qui la portoit aux mépris des richesses ; alors elle n’étoit plus considérée que comme une mauvaise tête ; la plus indécente se faisoit respecter avec de l’or ; le commerce des femmes étoit une espèce d’industrie reçue dans la première classe, qui, désormais, n’aura plus de crédit. S’il en avoit encore, la révolution seroit perdue, et sous de nouveaux rapports, nous serions toujours corrompus ; cependant la raison peut-elle se dissimuler que tout autre chemin à la fortune est fermé à la femme que l’homme achette, comme l’esclave sur les côtes d’Afrique.
  translation_ja: 旧体制下では、何もかもが悪徳に染まり、何もかもが罪深かった。だが悪徳そのものの中身にさえ、事態をよくする糸口が見えはしないだろうか。女性は美しいか、愛嬌があるか、それだけでよかった。両方に恵まれれば、足もとには百もの財産が転がってきた。そんな機会を利用しないのは変わり者か、あるいは富など歯牙にもかけぬ並外れた哲学の持ち主だった。となれば、世間からはただの厄介者扱いを受けた。いちばんふしだらな女でさえ、金があれば人に一目置かせることができた。女を売り買いするのは上流階級では公認のなりわいのようなものだったが、今後はもはや通用しまい。なおも通用するなら革命は失われ、新しい関係のもとでも、われわれはいつまでも腐り果てたままだろう。けれども、理性の目をもってして、次のことを見ないふりができるだろうか。アフリカの海岸で奴隷を買うように男に買われる女には、富を得るほかの道がことごとく閉ざされているのだ。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '14'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/16
    source_sequence: 64
    printed_page_end: '15'
  - source_id: wikisource-fr
    precision: page
    printed_page: '14'
    url: https://fr.wikisource.org/w/index.php?oldid=12057382
    source_sequence: 64
    printed_page_end: '15'
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-073-print
  translation_status: reviewed
- id: og-073c
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: La différence est grande ; on le sait. L’esclave commande au maître ; mais si le maître lui donne la liberté sans récompense, et à un âge où l’esclave a perdu tous ses charmes, que devient cette infortunée ? Le jouet du mépris ; les portes même de la bienfaisance lui sont fermées ; elle est pauvre et vieille, dit-on ; pourquoi n’a-t-elle pas su faire fortune ?
  translation_ja: もちろん、大きな違いはある。この奴隷は主人に命令する。だが、主人がなんの償いもせず、魅力のすべてが失われた年齢になってから自由をくれてやったら、この不幸な女はどうなるのか。侮蔑の餌食である。慈善の戸口さえ彼女には閉ざされる。「貧乏で年を取っている。なぜ財産を作るすべを知らなかったのだ」と世間は言う。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '15'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/17
    source_sequence: 65
  - source_id: wikisource-fr
    precision: page
    printed_page: '15'
    url: https://fr.wikisource.org/w/index.php?oldid=13633138
    source_sequence: 65
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-073-print
  translation_status: reviewed
- id: og-073d
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: D’autres exemples encore plus touchans s’offrent à la raison. Une jeune personne sans expérience, séduite par un homme qu’elle aime, abandonnera ses parens pour le suivre ; l’ingrat la laissera après quelques années, et plus elle aura vieilli avec lui, plus son inconstance sera inhumaine ; si elle a des enfants, il l’abandonnera de même. S’il est riche, il se croira dispensé de partager sa fortune avec ses nobles victimes. Si quelqu’engagement le lie à ses devoirs, il en violera la puissance en espérant tout des lois. S’il est marié, tout autre engagement perd ses droits.
  translation_ja: もっと胸を打つ例も、考えればいくらでもある。世間知らずの若い娘が、愛する男に誘惑され、親を捨てて男についてゆく。何年かすれば、恩知らずの男は彼女を捨てる。一緒に年を重ねていればいるほど、その心変わりは無慈悲なものになる。子がいてもやはり捨てる。金持ちなら、自分のせいで犠牲になったこの気高い人たちと財産を分ける必要などないと思い込む。何か約束があって義務を負っていても、法がすべて味方をしてくれると当て込んで、その効力を踏みにじるだろう。男に妻があれば、ほかのどんな約束も権利の裏付けを失う。
  source_languages:
  - fr
  source_locations:
  - source_id: gouges-1791
    precision: page
    printed_page: '15'
    url: https://fr.wikisource.org/wiki/Page:De_Gouges_-_Les_Droits_de_la_femme,_1791.djvu/17
    source_sequence: 66
    printed_page_end: '16'
  - source_id: wikisource-fr
    precision: page
    printed_page: '15'
    url: https://fr.wikisource.org/w/index.php?oldid=13633138
    source_sequence: 66
    printed_page_end: '16'
  source_alignment:
  - source_id: gouges-1791
    original_unit_id: og-073-print
  translation_status: reviewed
- id: og-073e
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: Quelles lois restent-il donc à faire pour extirper le vice jusques dans la racine ? Celle du partage des fortunes entre les hommes et les femmes, et de l’administration publique. On conçoit aisément que celle qui est née d’une famille riche, gagne beaucoup avec l’égalité des partages. Mais celle qui est née d’une famille pauvre, avec du mérite et des vertus ; quel est son lot ? La pauvreté et l’opprobre. Si elle n’excelle pas précisément en musique ou en peinture, elle ne peut être admise à aucune fonction publique, quand elle en auroit toute la capacité.
  translation_ja: この悪弊を根こそぎにするために、どんな法律をこれから作ればよいか。男女の間で財産も、公の行政も分かち合うための法だ。富裕な家に生まれた女性なら、財産の平等な分配から大きな恩恵を受けるのは容易にわかる。だが貧しい家に生まれ、才能にも徳にも恵まれた女性には、何が割り当てられるのか。貧困と屈辱だ。たまたま音楽や絵画に秀でてでもいないかぎり、どれほどの力量を備えていようとも、いかなる公の職にも就けない。
  source_languages:
  - fr
  source_locations:

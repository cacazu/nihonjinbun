- id: og-073f
  section_id: postamble
  kind: paragraph
  origin: source
  source_text: Je ne veux donner qu’un aperçu des choses, je les approfondirai dans la nouvelle édition de tous mes ouvrages politiques que je me propose de donner au public dans quelques jours, avec des notes.
  translation_ja: ここでは見取り図を示すにとどめたい。詳しくは数日のうちに注を添えて世に問うつもりの、私の政治著作をすべて収めた新版で論じよう。

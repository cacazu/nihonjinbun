    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 30
  "source_text": null
  "translation_ja": "セウェルスはユリアヌス帝の意気地のなさに気づいた。当時スキアヴォニアで軍を指揮していた彼は、皇帝の近衛兵に殺されたペルティナクスの仇を討つという名目を掲げた。〔軍事的政変の偽装と進行の具体策は非収録。〕ローマに来ると、おびえた元老院が彼を皇帝に選び、ユリアヌスは命を落とした。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "段落原文を非収録：軍事的政変の偽装・進行手順。歴史的事実と論旨を記載。"
- "id": "pr-19-031"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 31
  "source_text": "Restavano a Severo dopo questo principio due difficultà a volersi insignorire di tutto lo Stato: l’una in Asia, dove Nigro capo degli eserciti Asiatici si era fatto chiamare Imperatore; l’altra in ponente di Albino, il quale ancora lui aspirava all’Imperio."
  "translation_ja": "こうして第一歩を踏み出したセウェルスにとって、帝国をまるごと手に入れるには、なお二つの難題があった。アジアでは現地の諸軍を率いるニゲルが皇帝を名乗り、西方ではアルビヌスが同じく帝位を望んでいた。"
  "translation_status": "reviewed"
- "id": "pr-19-032"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":

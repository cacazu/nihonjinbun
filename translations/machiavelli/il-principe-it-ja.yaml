- "id": "pr-03-016"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 16
  "source_text": "Ma tenendovi, in cambio di colonie, gente d’arme, si spende più assai, avendo a consumare nella guardia tutte l’entrate di quello Stato: in modo che l’acquistato gli torna in perdita, ed offende molto più; perchè nuoce a tutto quello Stato, tramutando con gli alloggiamenti il suo esercito; del quale disagio ognuno ne sente, e ciascuno li diventa nimico, e sono inimici, che gli possono nuocere, rimanendo battuti in casa loro. Da ogni parte dunque questa guardia è inutile, come quella delle colonie è utile."
  "translation_ja": "これに対して入植地の代わりに兵を置けば、費用はずっとかさむ。領国の収入全部を守備に食わせることになり、せっかく得たものが損失に変わる。しかも反感はもっと広がる。軍が宿営地を移すたびに住民に宿の負担が回り、国じゅうが迷惑を被るからである。人はそれぞれに痛手を感じ、みなが君主の敵になる。しかも彼らは害を受けてもなお自宅にとどまっており、君主に害を返せる相手なのである。どこから見ても、この種の守備は役に立たない。入植による守りが有用なのと正反対である。"
  "translation_status": "reviewed"
- "id": "pr-03-017"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 17
  "source_text": "Debbe ancora chi è in una provincia disforme, come è detto, farsi capo e difensore de’ vicini minori potenti, ed ingegnarsi d’indebolire i più potenti di quella, e guardare che, per accidente alcuno, non vi entri uno forestiere non meno potente di lui: e sempre interverrà che vi sarà messo da coloro che saranno in quella malcontenti o per troppa ambizione o per paura; come si vide già che gli Etoli misero li Romani in Grecia; ed in ogni altra provincia che loro entrarono, vi furono messi dai provinciali."
  "translation_ja": "いま述べたような異質な地方に入った者は、近隣の小勢力の先頭に立ち、その保護者とならねばならない。また、土地の大勢力を弱めるよう努め、何かの拍子に、自分に劣らぬ力を持つ外国勢が入り込まないよう注意しなければならない。過大な野心か恐れから現状に不満を持つ者が、必ず外から人を招くからである。かつてアイトリア人がローマ人をギリシアに招いたのがそうだった。ローマ人が入ったほかの地方でも、同じ土地の人間が彼らを招き入れた。"
  "translation_status": "reviewed"
- "id": "pr-03-018"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 18
  "source_text": "E l’ordine della cosa è, che subito che un forestiere potente entra in una provincia, tutti quelli che sono in essa meno potenti, gli aderiscono, mossi da una invidia che hanno contro a chi è stato potente sopra di loro; tantochè rispetto a questi minori potenti, egli non ha a durare fatica alcuna a guadagnarli, perché subito tutti insieme volentieri fanno massa con lo Stato, che egli vi ha acquistato."
  "translation_ja": "事の成り行きはこうだ。有力な外国勢がひとたび土地に入ると、現地の小勢力は、それまで自分たちの上に立っていた者への反感から、いっせいに新参者になびく。この小勢力の人々なら、何の苦労もなく味方にできる。新たに築かれたその政権のもとへ、みずから喜んでまとまってくるからだ。"
  "translation_status": "reviewed"
- "id": "pr-03-019"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 19
  "source_text": "Ha solamente a pensare, che non piglino troppe forze, e troppa autorità; e facilmente può con le forze sue, e con il favor loro abbassare quelli che sono potenti, per rimanere in tutto arbitro di quella provincia. E chi non governerà bene questa parte, perderà presto quello che arà acquistato; e mentre che lo terrà, vi arà dentro infinite difficultà e fastidi."
  "translation_ja": "気を配るのは、味方があまり力と権威を握りすぎないことだけでよい。自分の力に彼らの支持を合わせれば、土地の大勢力を難なく抑え、地方全体の裁定者でいられる。この関係をうまく治めない者は、せっかく得たものをたちまち失うし、保っているあいだも内部に絶えず難儀や心配を抱える。"
  "translation_status": "reviewed"
- "id": "pr-03-020"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 20
  "source_text": "I Romani nelle provincie che pigliarono, osservarono bene queste parti, e mandarono le colonie, intrattenerono i men potenti senza crescere loro potenza, abbassarono li potenti, e non vi lasciarono prendere riputazione a’ potenti forestieri. E voglio mi basti solo la provincia di Grecia per esempio."
  "translation_ja": "ローマ人は獲得した地方でこの点をよくわきまえた。入植地を設け、弱い者とはつき合いを保ちつつ、その力を大きくはさせず、強い者の勢力をそぎ、外国の強国には威信を築かせなかった。ここでは一例としてギリシアだけを挙げればよい。"
  "translation_status": "reviewed"
- "id": "pr-03-021"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 21
  "source_text": "Furono intrattenuti da loro gli Achei, e gli Etoli, fu abbassato il Regno de’ Macedoni, funne cacciato Antioco; nè mai gli meriti degli Achei o delli Etoli fecero che permettessero loro accrescere alcuno Stato, nè le persuasioni di Filippo gli indussero mai ad essergli amici senza sbassarlo, nè la potenza di Antioco potè fare gli consentissero che tenesse in quella provincia alcuno Stato."
  "translation_ja": "ローマはアカイア人とアイトリア人を味方に保ち、マケドニア王国を弱め、アンティオコスを追い払った。アカイア人やアイトリア人がどれほど功績を上げても領地の拡張を認めず、フィリッポスがいくら説いても、彼の力をそがずに友好を結ぶ気にはならなかった。アンティオコスにいかに勢力があろうと、ギリシアに領土を持つことを許しはしなかった。"
  "translation_status": "reviewed"
- "id": "pr-03-022"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 22
  "source_text": "Perchè i Romani fecero in questi casi quello che tutti i Principi savi debbono fare, li quali non solamente hanno ad aver riguardo alli scandoli presenti, ma alli futuri, ed a quelli con ogni industria riparare; perchè prevedendosi discosto, facilmente vi si può rimediare, ma aspettando, che ti s’appressino, la medicina non è più a tempo, perchè la malattia è diventata incurabile; ed interviene di questa come dicono i medici dell’etica, che nel principio è facile a curare, e difficile a cognoscere, ma nel corso del tempo, non l’avendo nel principio cognosciuta nè medicata, diventa facile a cognoscere e difficile a curare."
  "translation_ja": "このときローマがしたのは、賢明な君主なら誰でもすべきことだった。目の前の騒乱だけでなく、先に起こる騒乱にも目を配り、力を尽くして食い止めるのである。遠いうちに見通せば、手当てするのはたやすい。迫ってくるまで待てば、病は不治となり、薬はもう間に合わない。医者が消耗性の病について言うのと同じだ。初めのうちは治しやすいが見分けにくい。初めに見抜かず手当てもせずに時がたつと、見分けはつきやすくなっても、治すのが難しくなる。"
  "translation_status": "reviewed"
- "id": "pr-03-023"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 23
  "source_text": "Così interviene nelle cose dello Stato, perchè cognoscendo discosto, il che non è dato se non ad un prudente, i mali che nascono in quello, si guariscono presto; ma quando, per non gli aver cognosciuti, si lasciano crescere in modo che ognuno li cognosce, non vi è più rimedio."
  "translation_ja": "国のことでも同じである。そこに生じつつある病弊を遠くから見分ければ、すぐに治せる。それができるのは思慮のある人だけである。見抜かずに育つに任せ、誰にでもわかるほどになってしまえば、もう手の打ちようがない。"
  "translation_status": "reviewed"
- "id": "pr-03-024"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 24
  "source_text": "Però i Romani vedendo discosto gl’inconvenienti, li rimediarono sempre, e non li lasciarono mai seguire per fuggire una guerra, perchè sapevano, che la guerra non si leva, ma si differisce con vantaggio d’altri; però volsero fare con Filippo ed Antioco guerra in Grecia, per non l’avere a fare con loro in Italia; e potevano per allora fuggire e l’una e l’altra; il che non volsero, nè piacque mai loro quello che tutto dì è in bocca de’ savi de’ nostri tempi, Godere li beneficii del tempo; ma bene quello della virtù e prudenza loro; perchè il tempo si caccia innanzi ogni cosa, e può condurre seco bene come male, male come bene."
  "translation_ja": "だからローマ人は、厄介事を遠いうちに見つけては手を打ち、戦争を避けたいという理由で放ってはおかなかった。戦争が消えるのではなく、他人に有利な時期まで延びるだけだと知っていたからである。イタリアでフィリッポスやアンティオコスと戦わずにすむよう、ギリシアで彼らと戦うことを選んだ。そのときだけならどちらの戦争も避けられたが、そうはしなかった。今日の物知りたちが朝から晩まで口にする「時の恵みを享受する」という言葉を、ローマ人は好まなかった。頼んだのは自分たちの力量と思慮の恵みだった。時はすべてのものを先へ押しやる。よいものを悪いものと同じように運んでくるし、悪いものをよいものと同じようにも運んでくる。"
  "translation_status": "reviewed"
- "id": "pr-03-025"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 25
  "source_text": "Ma torniamo a Francia, ed esaminiamo se delle cose dette ne ha fatto alcuna; e parlerò di Luigi e non di Carlo, come di colui, del quale, per aver tenuto più lunga possessione in Italia, si sono meglio visti li suoi andamenti; e vedrete, come egli ha fatto il contrario di quelle cose, che si debbono fare per tenere uno Stato disforme. Il Re Luigi fu messo in Italia dall’ambizione de’ Viniziani, che volsero guadagnarsi mezzo lo Stato di Lombardia per quella venuta."
  "translation_ja": "だがフランスの話に戻ろう。これまで述べたことのどれかをフランスは行っただろうか。ここではシャルルでなくルイを取り上げる。ルイのほうが長くイタリアに領地を持ち、その振る舞いがよく見えたからだ。彼が異質な地方を保つためになすべきことと、ことごとく逆のことをしたのが分かるだろう。ルイ王をイタリアに招いたのはヴェネツィア人の野心だった。彼の到来を利用して、ロンバルディア領の半分を手に入れようとしたのである。"
  "translation_status": "reviewed"
- "id": "pr-03-026"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 26
  "source_text": "Io non voglio biasimare quella venuta o partito preso dal Re; perchè, volendo cominciare a mettere un piede in Italia, e non avendo in questa provincia amici, anzi essendoli, per li portamenti del Re Carlo, serrate tutte le porte, fu forzato prendere quelle amicizie che poteva; e sarebbeli riuscito il pensiero bene preso, quando negli altri maneggi non avesse fatto errore alcuno."
  "translation_ja": "私は王の来訪も、その際の決断も責めるつもりはない。イタリアに第一歩を踏み入れたいのに、この地方には友もなく、むしろシャルル王の行いのせいで、どの門も閉ざされていた。王は得られる友を得るしかなかった。その後の政略に過ちがなかったなら、この初めの構想は適切であり、うまく運んだことだろう。"
  "translation_status": "reviewed"
- "id": "pr-03-027"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 27
  "source_text": "Acquistata adunque il Re la Lombardia, si riguadagnò subito quella riputazione che gli aveva tolta Carlo; Genova cedette, i Fiorentini gli diventarono amici, Marchese di Mantova, Duca di Ferrara, Bentivogli, Madonna di Furlì, Signore di Faenza, di Pesaro, di Rimino, di Camerino, di Piombino, Lucchesi, Pisani, Sanesi, ognuno se li fece incontro per essere suo amico."
  "translation_ja": "王がロンバルディアを得ると、シャルルのせいで失った威信をただちに取り戻した。ジェノヴァは屈服し、フィレンツェ人は友となった。マントヴァ侯、フェラーラ公、ベンティヴォーリョ家、フォルリの女領主、ファエンツァ、ペーザロ、リミニ、カメリーノ、ピオンビーノの各領主、ルッカ、ピサ、シエナの人々、誰もが王の友となろうと出迎えた。"
  "translation_status": "reviewed"
- "id": "pr-03-028"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 28
  "source_text": "Ed allora poterono considerare li Viniziani la temerità del partito preso da loro, i quali, per acquistare due terre in Lombardia, fecero Signore il Re di duoi terzi d’Italia."
  "translation_ja": "このときになって、ヴェネツィア人は自分たちの決断がいかに無謀だったか、思い知ったに違いない。ロンバルディアの二つの町を手に入れようとして、イタリアの三分の二の主人に王を据えてしまったのだ。"
  "translation_status": "reviewed"
- "id": "pr-03-029"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 29
  "source_text": "Consideri ora uno con quanta poca difficultà poteva il Re tenere in Italia la sua riputazione, se egli avessi osservate le regole sopraddette, e tenuti sicuri, e difesi tutti quelli amici suoi, li quali, per essere gran numero, e deboli, e paurosi chi della Chiesa, chi de’ Viniziani, erano sempre necessitati a star seco, e per il mezzo loro poteva facilmente assicurarsi di chi ci restava grande."
  "translation_ja": "先ほどの原則を守り、友となった者すべてを安心させ、守っていれば、王がいかにたやすくイタリアで威信を保てたかを考えてほしい。友邦は数が多く、それぞれは弱く、ある者は教会を、ある者はヴェネツィアを恐れていた。常に王につかざるをえず、王のほうもその力を借りれば、まだ残っていた大勢力に対してたやすく身を守れたのである。"
  "translation_status": "reviewed"
- "id": "pr-03-030"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 30
  "source_text": "Ma egli non prima fu in Milano, che fece il contrario, dando aiuto a Papa Alessandro, perché egli occupasse la Romagna. Nè si accorse con questa deliberazione che faceva sè debole, togliendosi li amici, e quelli che se li erano gittati in grembo, e la Chiesa grande, aggiugnendo allo spirituale, che gli dà tanta autorità, tanto temporale."
  "translation_ja": "ところが王はミラノに入るやいなや、正反対のことをした。教皇アレクサンデルがロマーニャを占領するのに力を貸したのだ。この決断によって、友と、自分の懐に飛び込んできた人々を自ら手放し、自分を弱くしたことに、王は気づかなかった。また、すでに大きな権威を与えていた霊的な力に、さらにあれほどの世俗の力を加えて、教会を大きくしたことにも。"
  "translation_status": "reviewed"
- "id": "pr-03-031"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 31
  "source_text": "E fatto un primo errore, fu costretto a seguitare; intantochè, per porre fine all’ambizione di Alessandro, e perché non divenisse Signore di Toscana, gli fu forza venire in Italia."
  "translation_ja": "ひとたび最初の過ちを犯すと、あとはその後を追わざるをえない。アレクサンデルの野心を抑え、彼がトスカーナの支配者になるのを防ぐために、王は自らイタリアに来なければならなくなった。"
  "translation_status": "reviewed"
- "id": "pr-03-032"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 32
  "source_text": "E non gli bastò aver fatto grande la Chiesa, e toltisi gli amici, che per volere il regno di Napoli, lo divise con il Re di Spagna; e dove egli era prima arbitro d’Italia, vi messe un compagno, acciochè gli ambiziosi di quella provincia e malcontenti di lui avessero dove ricorrere; e dove poteva lasciare in quel Regno un Re suo pensionario, egli ne lo trasse per mettervi uno che potesse cacciarne lui."
  "translation_ja": "教会を大きくし、友を手放しただけでも足りなかったとみえる。今度はナポリ王国が欲しくなり、そこをスペイン王と分割した。以前はイタリアの裁定者は彼一人だったのに、今度は仲間を一人入れた。おかげで、この地方で野心を抱く者、フランス王に不満のある者には頼る先ができた。自分から俸金を受ける王をそのまま置けたのに、その王を追い立て、代わりに今度は自分を追い立てる力のある者を据えたのだ。"
  "translation_status": "reviewed"
- "id": "pr-03-033"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 33
  "source_text": "È cosa veramente molto naturale e ordinaria desiderare di acquistare, e sempre, quando gli uomini lo fanno che possino, ne saranno laudati e non biasimati; ma quando non possono e vogliono farlo in ogni modo, qui è il biasimo e l’errore. Se Francia adunque con le sue forze poteva assaltare Napoli, doveva farlo; se non poteva, non doveva dividerlo."
  "translation_ja": "手に入れたいと願うのは、ごく自然な、ありふれたことだ。実際にそれをなしうる人が実行に移したなら、非難ではなく称賛を得るだろう。だができないのに、何が何でもやろうとするとき、そこに過ちと非難の理由がある。フランスに自力でナポリを攻める力があったなら、そうすればよかった。力がなかったなら、分割すべきではなかったのだ。"
  "translation_status": "reviewed"
- "id": "pr-03-034"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 34
  "source_text": "E se la divisione che fece con i Viniziani di Lombardia, meritò scusa per avere con quella messo il piè in Italia, questa meritò biasimo per non essere scusato da quella necessità."
  "translation_ja": "ロンバルディアをヴェネツィア人と分割したことには、それでイタリアへの足掛かりを得たという弁明の余地があった。だがナポリの分割にはその差し迫った事情がなく、非難を免れない。"
  "translation_status": "reviewed"
- "id": "pr-03-035"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 35
  "source_text": "Aveva adunque Luigi fatto questi cinque errori: spenti i minori potenti; accresciuto in Italia potenza a un potente; messo in quella un forestiere potentissimo; non venuto ad abitarvi; non vi messo colonie."
  "translation_ja": "したがってルイは五つの過ちを犯したことになる。小勢力を消滅させ、イタリアの有力者をいっそう強め、さらに強力な外国勢を引き入れ、自分では移り住まず、入植地も置かなかった。"
  "translation_status": "reviewed"
- "id": "pr-03-036"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 36
  "source_text": "Li quali errori, vivendo lui, potevano ancora non lo offendere, se non avesse fatto il sesto, di torre lo Stato a’ Viniziani; perchè quando non avesse fatto grande la Chiesa, nè messo in Italia, Spagna, era ben ragionevole e necessario abbassarli; ma, avendo preso quelli primi partiti, non doveva mai consentire alla rovina loro; perchè essendo quelli potenti, arebbono sempre tenuti gli altri discosto dalla impresa di Lombardia, sì perchè i Viniziani non vi arebbero consentito, senza diventarne Signori loro; sì perchè gli altri non arebbero voluto torla a Francia per darla a loro; e andarli ad urtare ambidui non arebbero avuto animo."
  "translation_ja": "この五つの過ちだけなら、王の存命中はまだ害が及ばずにすんだかもしれない。だが王は、ヴェネツィア人から領国を奪うという第六の過ちを犯した。教会を大きくせず、スペインをイタリアに入れなかったのであれば、ヴェネツィアの勢力を抑えるのはごくもっともで、必要でもあった。だが初めにあれらの選択をした以上、ヴェネツィアの没落には決して同意すべきでなかった。彼らが有力でいれば、ほかの国々はロンバルディアに手を出せなかっただろう。ヴェネツィアは自分が領主になれないなら認めず、ほかの国々もヴェネツィアに与えるためにフランスから奪いたいとは思わず、その二国をともに敵に回す勇気もなかったはずだからだ。"
  "translation_status": "reviewed"
- "id": "pr-03-037"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 37
  "source_text": "E se alcun dicesse, il Re Luigi cedè ad Alessandro la Romagna, ed a Spagna il Regno per fuggire una guerra; rispondo con le ragioni dette di sopra, che non si debba mai lasciar seguire uno disordine per fuggire una guerra; perchè ella non si fugge, ma si differisce a tuo disavvantaggio."
  "translation_ja": "ルイ王がアレクサンデルにロマーニャを、スペインにナポリ王国を譲ったのは戦争を避けるためだと言う人がいるかもしれない。先ほど述べた理由から、私はこう答える。戦争を避けるために混乱を放置してはいけない。戦争は避けられず、自分に不利な形で先送りされるだけだからだ。"
  "translation_status": "reviewed"
- "id": "pr-03-038"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 38
  "source_text": "E se alcuni altri allegassero la fede, che il Re aveva data al Papa, di far per lui quella impresa per la risoluzione del suo matrimonio, e per il Cappello di Roano, rispondo con quello che per me di sotto si dirà circa la fede dei Principi, e come ella si debba osservare."
  "translation_ja": "王には教皇に対する約束があったはずだと、別の人が言うかもしれない。結婚を解消してもらい、ルーアンの大司教に枢機卿帽を得る引き換えに、教皇の企てに力を貸すとの約束である。それには、君主の信義とその守り方について、後に私が述べるところをもって答えとしよう。"
  "translation_status": "reviewed"
- "id": "pr-03-039"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 39
  "source_text": "Ha perduto dunque il Re Luigi la Lombardia per non avere osservato alcuno di quelli termini osservati da altri, che hanno preso provincie, e volutele tenere. Nè è miracolo alcuno questo, ma molto ragionevole ed ordinario."
  "translation_ja": "ルイ王がロンバルディアを失ったのは、他国を獲得してそれを持ち続けようとしたほかの者が守っていた心得を、一つも守らなかったからである。少しも不思議なことはない。ごく道理にかなった、ありふれた成り行きだ。"
  "translation_status": "reviewed"
- "id": "pr-03-040"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 40
  "source_text": "E di questa materia parlai a Nantes con Roano, quando il Valentino (che così volgarmente era chiamato Cesare Borgia figliuolo di Papa Alessandro) occupava la Romagna; perchè dicendomi il Cardinale Roano, che gl’Italiani non s’intendevano della guerra, io risposi, che i Francesi non s’intendevano dello Stato, perchè, intendendosene, non lascerebbono venire la Chiesa in tanta grandezza."
  "translation_ja": "ヴァレンティーノ公、つまり教皇アレクサンデルの子チェーザレ・ボルジアが、ロマーニャを占領していたころ、私はナントでこのことをルーアンの枢機卿と話したことがある。枢機卿が、イタリア人は戦争を知らないと言ったので、私は、フランス人は政治を知らないと答えた。知っているなら、教会がこれほど強大になるのを許しはしなかったはずだからだ。"
  "translation_status": "reviewed"
- "id": "pr-03-041"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 41
  "source_text": "E per esperienza si è visto, che la grandezza in Italia di quella, e di Spagna, è stata causata da Francia, e la rovina sua è proceduta da loro. Di che si cava una regola generale, quale non mai, o raro falla, che chi è cagione che uno diventi potente, rovina; perchè quella potenza è causata da colui o con industria, o con forza, e l’una e l’altra di queste due è sospetta a chi è divenuto potente."
  "translation_ja": "経験の示したとおり、イタリアで教会とスペインが大きくなったのはフランスのためであり、フランスの没落はその両者によってもたらされた。ここから、まず外れることのない一般則が引き出せる。他者が力を得る原因をつくった者は、身を滅ぼす。その力を生み出したのは、助けた者の才覚か実力かであり、力を得た側から見れば、そのどちらも油断のならないものに映るからだ。"
  "translation_status": "reviewed"
- "id": "pr-04-001"
  "section_id": "pr-sec-04"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 1
  "source_text": "CAPITOLO IV. Perchè il Regno di Dario da Alessandro occupato non si ribellò dalli successori di Alessandro dopo la sua morte."
  "translation_ja": "第四章　アレクサンドロスが占領したダレイオスの王国は、なぜ彼の死後も後継者たちに背かなかったか"
  "translation_status": "reviewed"
- "id": "pr-04-002"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 2
  "source_text": "Considerate le difficultà, le quali si hanno in tenere uno Stato acquistato di nuovo, potrebbe alcuno maravigliarsi, donde nacque che Alessandro Magno diventò Signore dell’Asia in pochi anni, e, non l’avendo appena occupata, morì, donde pareva ragionevole che tutto quello Stato si ribellasse; nondimeno li successori suoi se lo mantennero, e non ebbono a tenerselo altra difficultà, che quella che intra loro medesimi per propria ambizione nacque."
  "translation_ja": "新たに得た国を維持する苦労を考えると、不思議に思う人がいるだろう。アレクサンドロス大王はわずか数年でアジアの支配者となったが、占領を終えるか終えないかのうちに死んだ。当然、国じゅうが反乱に立ち上がってもおかしくはなかった。それなのに後継者たちは国を保ち、しかも保つにあたって、自らの野心が仲間のあいだに引き起こしたもののほかに、難題は起こらなかった。なぜだろうか。"
  "translation_status": "reviewed"
- "id": "pr-04-003"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 3
  "source_text": "Rispondo come i Principati, de’ quali si ha memoria, si trovano governati in due modi diversi, o per un Principe, e tutti gli altri servi, i quali come ministri per grazia e concessione sua aiutano governare quel Regno; o per un Principe e per Baroni, i quali non per grazia del Signore, ma per antichità di sangue tengono quel grado. Questi tali Baroni hanno Stati e sudditi propri, li quali gli riconoscono per Signori, e hanno in loro naturale affezione."
  "translation_ja": "私の答えはこうである。記録に残る君主国の治め方には二通りある。一つは君主のほかはみなその家僕であり、君主の恩顧と委任によって政務を助ける官吏となるもの。もう一つは君主と諸侯がいるものだ。この諸侯は主君の恩寵ではなく、家柄の古さによってその地位を占める。自分の領地と臣民を持ち、その臣民は彼らを主君と認め、代々の愛着を寄せている。"
  "translation_status": "reviewed"
- "id": "pr-04-004"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 4
  "source_text": "Quelli Stati che si governano per un Principe e per servi, hanno il loro Principe con più autorità; perchè in tutta la sua provincia non è alcuno che riconosca per superiore se non lui; e se ubbidiscono altri, lo fanno come a ministro e ufficiale, e non gli portano particolare amore. Gli esempi di queste due diversità di governi sono, ne’ nostri tempi, il Turco e il Re di Francia."
  "translation_ja": "君主とその家僕によって治められる国では、君主の権威はより大きい。国じゅうに君主以外の誰かを主人と認める者はいないからだ。ほかの人に従う場合も、君主の大臣や役人として従うのであって、その人個人に格別の愛着があるわけではない。この二つの統治のあり方を当代に例示するのが、トルコの君主とフランス王である。"
  "translation_status": "reviewed"
- "id": "pr-04-005"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 5
  "source_text": "Tutta la monarchia del Turco è governata da un Signore; gli altri sono suoi servi; e distinguendo il suo Regno in Sangiacchi, vi manda diversi amministratori, e gli muta e varia come pare a lui. Ma il Re di Francia è posto in mezzo di una moltitudine antica di Signori, ricognosciuti da’ loro sudditi, ed amati da quelli; hanno le loro preminenzie, nè le può il Re torre loro senza suo pericolo."
  "translation_ja": "トルコの君主国全体を治める主人は一人で、ほかは皆その家僕である。王国をサンジャクという行政区に分け、それぞれに長官を送り、思いのままに交替させ、異動させる。これに対しフランス王を取り巻いているのは、多くの由緒ある領主たちである。それぞれ臣民から主人と認められ、愛されてもいる。諸侯にはそれぞれ特権がある。王がそれを奪おうとすれば自分の身も危うくなる。"
  "translation_status": "reviewed"
- "id": "pr-04-006"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 6
  "source_text": "Chi considera adunque l’uno e l’altro di questi Stati, troverà difficultà nell’acquistare lo Stato del Turco; ma vinto che sia, è facilità grande a tenerlo."
  "translation_ja": "この二つの国を考え比べれば、トルコの国を手に入れるのは難しいが、いったん勝ってしまえば保つのはきわめてたやすいとわかる。"
  "translation_status": "reviewed"
- "id": "pr-04-007"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 7
  "source_text": "Le cagioni della difficultà in potere occupare il Regno del Turco sono per non potere l’occupatore essere chiamato da’ Principi di quel Regno, nè sperare con la ribellione di quelli che egli ha d’intorno, potere facilitare la sua impresa; il che nasce dalle ragioni sopraddette. Perchè essendogli tutti schiavi ed obbligati, si possono con più difficultà corrompere; e quando bene si corrompessino, se ne può sperare poco utile, non potendo quelli trarsi dietro i popoli, per le ragioni assegnate."
  "translation_ja": "トルコの王国を占領しにくいのは、攻める者を招き入れるような国内の諸侯がいないからである。君主の側近たちが背いて、こちらの企てがたやすくなる望みもない。理由はすでに述べた。いずれも君主に隷属し、恩義を負っているから、抱き込むのは容易でない。仮に抱き込めたところで、先に挙げた理由から、その者たちには民衆を引き連れる力がなく、大した役には立たない。"
  "translation_status": "reviewed"
- "id": "pr-04-008"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 8
  "source_text": null
  "translation_ja": "それゆえトルコのような国を前にする場合、相手の内部分裂は当てにできないと著者はいう。〔征服と旧王家の排除をめぐる具体策は非収録。〕ほかの者に民の信望がない以上、勝利の前に彼らの力を当てにできなかったのと同じ理由で、勝利の後に彼らを恐れる必要もない。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "該当段落の原文を非収録：征服と旧王家の排除の具体策"
- "id": "pr-04-009"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 9
  "source_text": "Il contrario interviene ne’ Regni governati come è quello di Francia, perchè con facilità puoi entrarvi, guadagnandoti alcuno Barone del Regno; perchè sempre si trova de’ malcontenti, e di quelli che desiderano innovare. Costoro, per le ragioni dette, ti possono aprire la via a quello Stato, e facilitarti la vittoria; la quale dipoi a volerti mantenere, si tira dietro infinite difficultà e con quelli che ti hanno aiutato, e con quelli che tu hai oppressi."
  "translation_ja": "フランスのような治め方の王国では、事情は逆になる。国内の諸侯の誰かと手を結べば、入り込むのは容易である。不満を持つ者、変革を望む者が必ずいるからだ。すでに述べた事情によって、そうした者が国への道を開き、勝利を得やすくしてくれる。だがその勝利を維持しようとすると、自分に協力した者にも、自分が抑えつけた者にも、限りなく悩まされることになる。"
  "translation_status": "reviewed"
- "id": "pr-04-010"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 10
  "source_text": null
  "translation_ja": "〔旧王家や有力者の排除をめぐる具体策は非収録。〕諸侯がそこに残って新たな動乱の先頭に立ち、機会が訪れるたびに、獲得した者は国を失うのである。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "該当段落の原文を非収録：支配家の排除をめぐる具体策"
- "id": "pr-04-011"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 11
  "source_text": "Ora se voi considererete di qual natura di governi era quello di Dario, lo troverete simile al Regno del Turco; e però ad Alessandro fu necessario prima urtarlo tutto, e torgli la campagna; dopo la quale vittoria essendo Dario morto, rimase ad Alessandro quello stato sicuro, per le ragioni sopra discorse. E li suoi successori, se fussino stati uniti, se lo potevano godere oziosi; nè in quello Regno nacquero altri tumulti, che quelli che loro proprii suscitarono."
  "translation_ja": "ダレイオスの国がどちらの仕組みだったかを考えれば、それはトルコの王国と同じ型だと分かる。アレクサンドロスは初めに国の力をまともに相手にし、野戦で勝たなければならなかった。だが勝利のあとダレイオスが死ぬと、すでに述べた理由から、その国は安定して彼のものになった。後継者たちも仲間割れさえしなければ、苦もなく享受できたはずだ。あの王国には彼ら自身が引き起こしたもの以外に動乱は起こらなかった。"
  "translation_status": "reviewed"
- "id": "pr-04-012"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 12
  "source_text": "Ma gli Stati ordinati, come quello di Francia, è impossibile possedergli con tanta quiete. Di qui nacquero le spesse ribellioni di Spagna, di Francia, e di Grecia da’ Romani, per li spessi Principati che erano in quelli Stati, de’ quali mentre che durò la memoria, sempre furono i Romani incerti di quella possessione; ma spenta la memoria di quelli, con la potenza e diuturnità dell’imperio, ne diventarono sicuri possessori."
  "translation_ja": "だがフランスのようにできている国を、これほど安穏と領有するのは不可能である。スペイン、フランス、ギリシアがたびたびローマに反乱を起こしたわけもここにある。いずれにもおびただしい数の君主領があった。それらの記憶が生きているあいだ、ローマ人は支配を確かなものとは思えなかった。しかし帝国の力と長い歳月によって記憶が消えると、彼らはようやく土地を確実にわがものとした。"
  "translation_status": "reviewed"
- "id": "pr-04-013"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 13
  "source_text": "E poterono dipoi anche quelli, combattendo tra loro, ciascuno tirarsi dietro parte di quelle provincie, secondo l’autorità vi aveva preso dentro; e quelle, per essere il sangue del loro antico Signore spento, non ricognoscevano altri, che i Romani."
  "translation_ja": "その後は、ローマ人同士が戦う際にも、そこで築いた威信の大きさに応じて、それぞれがこれらの属州の一部を味方にすることができた。かつての主君の血筋が絶えていたので、属州の人々が主人として認めるのはローマ人だけだったのである。"
  "translation_status": "reviewed"
- "id": "pr-04-014"
  "section_id": "pr-sec-04"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IV&oldid=3702252"
    "source_sequence": 14
  "source_text": "Considerando adunque queste cose, non si maraviglierà alcuno della facilità che ebbe Alessandro a tenere lo Stato d’Asia, e delle difficultà che hanno avuto gli altri a conservare l’acquistato, come Pirro, e molti altri; il che non è accaduto dalla poca o molta virtù del vincitore, ma dalla disformità del suggetto."
  "translation_ja": "こうして考えれば、アレクサンドロスがたやすくアジアの国を保ったことも、ピュロスをはじめ多くの者が、獲得したものを保つのに苦労したことも、少しも不思議ではない。勝者の力量の大小ではなく、支配の対象となった国の性質が違っていたのである。"
  "translation_status": "reviewed"
- "id": "pr-05-001"
  "section_id": "pr-sec-05"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_V&oldid=3702254"
    "source_sequence": 1
  "source_text": "CAPITOLO V. In che modo siano da governare le città o Principati, quali, prima che occupati fussino, vivevano con le loro leggi."
  "translation_ja": "第五章　占領される前には自分たちの法律に従って暮らしていた都市や君主国を、どう治めるか"
  "translation_status": "reviewed"
- "id": "pr-05-002"
  "section_id": "pr-sec-05"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_V&oldid=3702254"
    "source_sequence": 2
  "source_text": "Quando quelli Stati che si acquistano, come è detto, sono consueti a vivere con le loro leggi e in libertà, a volergli tenere ci sono tre modi. Il primo è rovinargli. L’altro andarvi ad abitare personalmente. Il terzo lasciargli vivere con le sue leggi, tirandone una pensione, e creandovi dentro uno Stato di pochi, che te lo conservino amico."
  "translation_ja": "先に述べた新たな領国が、自分たちの法律のもとで自由に生きることに慣れていたなら、これを保つ道は三つある。第一はこれを滅ぼすこと、第二は自分でそこに移り住むこと、第三は住民がもとの法律で暮らすのを認め、貢納を取り立て、君主への友好を保つ少数者の政府を内部につくることである。"
  "translation_status": "reviewed"
- "id": "pr-05-003"
  "section_id": "pr-sec-05"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_V&oldid=3702254"
    "source_sequence": 3
  "source_text": "Perchè essendo quello Stato creato da quel Principe, sa che non può stare senza l’amicizia e potenza sua, e ha da fare il tutto per mantenerlo; e più facilmente si tiene una città usa a vivere libera con il mezzo de’ suoi cittadini, che in alcuno altro modo, volendola preservare."
  "translation_ja": "この政府は君主によって設けられたので、君主の友好と力なしには自立できないと知っており、それを保つためには何でもしなければならない。自由に暮らすことに慣れた都市を壊さずに保ちたいなら、その市民自身を介して治めるほうが、ほかのどんな方法よりもたやすい。"
  "translation_status": "reviewed"
- "id": "pr-05-004"
  "section_id": "pr-sec-05"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_V&oldid=3702254"
    "source_sequence": 4
  "source_text": "Sonoci, per esempio, gli Spartani, ed i Romani. Gli Spartani tennero Atene e Tebe, creandovi uno Stato di pochi: nientedimeno le perderono. I Romani per tenere Capua, Cartagine, e Numanzia, le disfecero, e non le perderono. Vollero tenere la Grecia quasi come la tennero gli Spartani, facendola libera, e lasciandole le sue leggi, e non successe loro; in modo che furono costretti disfare molte città di quella provincia per tenerla, perchè in verità non ci è modo sicuro a possederle, altro che la rovina."
  "translation_ja": "例はスパルタ人とローマ人である。スパルタはアテナイとテーバイに少数者の政府を設けて支配したが、それでも両方を失った。ローマはカプア、カルタゴ、ヌマンティアを支配するためにそれらを破壊し、失わなかった。ギリシアではスパルタに近い方法で、自由を認め、もとの法を残して支配しようとしたが、うまくいかなかった。そのためギリシアを保つには多くの都市を破壊せざるをえなかった。実のところ、こうした都市を確実に所有する道は、その破滅のほかにはないというのである。"
  "translation_status": "reviewed"
- "id": "pr-05-005"
  "section_id": "pr-sec-05"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_V&oldid=3702254"
    "source_sequence": 5
  "source_text": null
  "translation_ja": "自由に暮らした都市を征服した者は、かえってその都市に自らを滅ぼされかねない。反乱の際、住民にはいつも、自由の名と昔からの制度というよりどころがある。長い歳月も恩恵も、そこへの思いを消すことはない。〔住民の抵抗を封じる具体策は非収録。〕何かあれば、人々はただちにその名と制度に立ち返る。長い年月フィレンツェ人に従属させられていたのちのピサがそうだった。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "該当段落の原文を非収録：都市住民の抵抗を封じる具体策"
- "id": "pr-05-006"
  "section_id": "pr-sec-05"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_V&oldid=3702254"
    "source_sequence": 6
  "source_text": "Ma quando le città o le provincie sono use a vivere sotto un Principe, e quel sangue sia spento, essendo da una parte use ad ubbidire, dall’altra non avendo il Principe vecchio, farne uno intra loro non si accordano, vivere libere non sanno; dimodochè sono più tarde a pigliare le armi, e con più facilità se li può un Principe guadagnare, e assicurarsi di loro."
  "translation_ja": "だが、もともと君主のもとで暮らしていた都市や地方で、その家系が絶えた場合は違う。人々は服従に慣れており、かといって旧主を失うと、仲間から一人を君主に選ぶことにも合意できず、自由に生きる術も知らない。そのぶん武器を取るまでには時がかかり、君主のほうは民心を得て支配を安定させやすい。"
  "translation_status": "reviewed"
- "id": "pr-05-007"
  "section_id": "pr-sec-05"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_V&oldid=3702254"
    "source_sequence": 7
  "source_text": "Ma nelle Republiche è maggior odio, più desiderio di vendetta, nè le lascia nè può lasciare riposare la memoria dell’antica libertà; talchè la più sicura via è spegnerle, o abitarvi."
  "translation_ja": "共和国ではこれに反して、憎しみは強く、復讐への願いはいっそう切実である。かつての自由の記憶が民を静かにはしておかないし、静かにできるはずもない。だから、最も確実な道は共和国を消滅させるか、そこに自分で移り住むかだ、と著者は結ぶ。"
  "translation_status": "reviewed"
- "id": "pr-06-001"
  "section_id": "pr-sec-06"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 1
  "source_text": "CAPITOLO VI. De’ Principati nuovi, che con le proprie armi e virtù si acquistano."
  "translation_ja": "第六章　自らの軍事力と力量によって獲得される新しい君主国について"
  "translation_status": "reviewed"
- "id": "pr-06-002"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 2
  "source_text": null
  "translation_ja": "君主も国も新しい、まったく新たな君主国を語るのに、私がとびきり偉大な人々を例に引いても、驚かないでほしい。人はたいてい、誰かの踏み開いた道を歩き、人のすることにならって行動する。とはいえ、他人の道をそっくりたどることも、手本の相手と同じ力量に達することもできない。思慮ある人はそれゆえにこそ、常に偉人の開いた道に入り、最も優れた人々をこそまねるべきである。その力量には及ばなくても、せめてその香りぐらいは移るだろう。弓を引く人が、遠くの目的を果たすために、目的そのものより高いところに目を向けるのと同じである。〔射法に関する具体的な説明は非収録。〕"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "該当段落の一部原文を非収録：射法の記述。模倣に関する論旨は訳文に収録。"
- "id": "pr-06-003"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 3
  "source_text": "Dico adunque, che ne’ Principati in tutto nuovi, dove sia un nuovo Principe, si trova più o meno difficultà a mantenergli, secondo che più o meno virtuoso è colui che gli acquista. E perchè questo evento di diventare di privato Principe presuppone o virtù o fortuna, pare che l’una o l’altra di queste due cose mitighino in parte molte difficultà. Nondimeno colui che è stato manco in su la fortuna, si è mantenuto più."
  "translation_ja": "そこで、国も君主も新しい国を保つ難しさは、それを獲得した者の力量の大小によって変わる、と私は言う。一私人が君主になるという出来事には、力量か幸運のどちらかがなくてはならないから、そのどちらも多くの難儀をいくらか和らげてくれるように見える。それでも、運を頼りにすることの少なかった者のほうが長く地位を保っている。"
  "translation_status": "reviewed"
- "id": "pr-06-004"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 4
  "source_text": "Genera ancora facilità l’essere il Principe costretto, per avere altri Stati, venirvi personalmente ad abitare. Ma per venire a quelli, che per propria virtù e non per fortuna sono diventati Principi, dico, che li più eccellenti sono Moisè, Ciro, Romulo, Teseo, e simili. E benchè di Moisè non si debba ragionare, essendo stato un mero esecutore delle cose che gli erano ordinate da Dio; pure merita di essere ammirato solamente per quella grazia che lo faceva degno di parlare con Dio."
  "translation_ja": "君主がその土地へ自ら移り住まざるをえない事情も、事をたやすくする。〔底本は理由を「ほかに領地を持つため」とする。〕だが運によらず、自分の力量で君主になった人々に話を移せば、最も優れた例はモーセ、キュロス、ロムルス、テセウスらである。もっとも、モーセはただ神から命じられたことを実行した人だから、同列に論じるべきではないにしても、神と言葉を交わすにふさわしいとされた恩寵一つだけでも、称賛に値する。"
  "translation_status": "reviewed"
- "id": "pr-06-005"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 5
  "source_text": "Ma considerando Ciro e gli altri, che hanno acquistato o fondato regni, si troveranno tutti mirabili; e se si considereranno le azioni e ordini loro particulari, non parranno differenti da quelli di Moisè, benchè egli ebbe sì gran precettore."
  "translation_ja": "キュロスをはじめ、王国を得、あるいは建てた人々を見るならば、彼らはみな驚嘆すべき人である。一人ひとりの行動と設けた制度とを考えると、あれほど偉大な師がいたモーセのそれとも違いはないように思われる。"
  "translation_status": "reviewed"
- "id": "pr-06-006"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 6
  "source_text": "Ed esaminando le azioni, e vita loro, non si vedrà che quelli avessino altro dalla fortuna, che l’occasione, la quale dette loro materia di potervi introdurre quella forma che a lor parse; e senza quella occasione la virtù dell’animo loro si saria spenta, e senza quella virtù l’occasione sarebbe venuta invano. Era adunque necessario a Moisè trovare il popolo d’Isdrael in Egitto schiavo, e oppresso dagli Egizi, acciocchè quelli, per uscire di servitù, si disponessino a seguirlo."
  "translation_ja": "その生涯と仕事を調べると、幸運が彼らに与えたものは、機会以外にはなかったと分かる。機会が素材を提供し、彼らはそこに自分がよいと思う形を与えた。その機会がなければ心の力量は埋もれて消え、その力量がなければ機会はむなしく過ぎ去っただろう。だからモーセにとって必要だったのは、イスラエルの民がエジプトで奴隷にされ、エジプト人に苦しめられているところに居合わせることだった。そうであって初めて、民は隷属から抜け出したいと願い、彼に従おうとするのである。"
  "translation_status": "reviewed"
- "id": "pr-06-007"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 7
  "source_text": "Conveniva che Romulo non capesse in Alba, e fusse stato esposto al nascer suo, a volere che diventasse Re di Roma, e fondatore di quella patria. Bisognava che Ciro trovasse i Persi malcontenti dell’imperio de’ Medi, ed i Medi molli ed effeminati per lunga pace. Non poteva Teseo dimostrare la sua virtù, se non trovava gli Ateniesi dispersi."
  "translation_ja": "ロムルスがローマの王となり、祖国の創建者になるには、アルバに身の置き場がなく、生まれるなり捨てられていなければならなかった。キュロスの前には、メディアの支配に不満を持つペルシア人と、長い平和で柔弱になったメディア人がいなければならなかった。テセウスはアテナイ人がばらばらに暮らしていなければ、自分の力量を示せなかった。"
  "translation_status": "reviewed"
- "id": "pr-06-008"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 8
  "source_text": "Queste occasioni pertanto feciono questi uomini felici, e l’eccellente virtù loro fece quella occasione esser cognosciuta: donde la loro patria ne fu nobilitata, e diventò felicissima. Quelli i quali per vie virtuose simili a costoro diventano Principi, acquistano il Principato con difficultà, ma con facilità lo tengono; e le difficultà che hanno nell’acquistare il Principato, nascono in parte da’ nuovi ordini e modi, che sono forzati introdurre per fondare lo Stato loro e la loro sicurtà."
  "translation_ja": "こうした機会が彼らを成功させ、並外れた力量があったからこそ、それと気づくことができた。そのため祖国は名誉を高め、大いに栄えた。こうした人々と同じく力量を通じて君主になる者は、君主国を手に入れるのには苦労するが、保つのは容易である。手に入れる際の苦労の一部は、自分の国を築き、身の安全を固めるために、新しい制度とやり方を導入せざるをえないことから生じる。"
  "translation_status": "reviewed"
- "id": "pr-06-009"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 9
  "source_text": "E debbesi considerare come non è cosa più difficile a trattare, nè più dubbia a riuscire, nè più pericolosa a maneggiare, che farsi capo ad introdurre nuovi ordini."
  "translation_ja": "新制度の導入の先頭に立つことほど、手がけるのが難しく、成功がおぼつかなく、扱いの危うい仕事はほかにない。このことをよく考えなくてはならない。"
  "translation_status": "reviewed"
- "id": "pr-06-010"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 10
  "source_text": "Perchè l’introduttore ha per nimici tutti coloro che degli ordini vecchi fanno bene; e tepidi difensori tutti quelli che degli ordini nuovi farebbono bene; la qual tepidezza nasce, parte per paura degli avversari, che hanno le leggi in beneficio loro, parte dalla incredulità degli uomini, i quali non credono in verità le cose nuove, se non ne veggono nata esperienza ferma."
  "translation_ja": "古い制度でうまい汁を吸っている人はみな改革者の敵となり、新制度から利益を得るはずの人々は、誰もが生ぬるい味方にしかならない。その熱意の乏しさには二つの理由がある。一つは、現行の法律を味方につけた敵を恐れることであり、もう一つは人の疑い深さである。人は、確かな実例が現れるのを見るまで、新しいことを本気では信じない。"
  "translation_status": "reviewed"
- "id": "pr-06-011"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 11
  "source_text": "Donde nasce che qualunque volta quelli che sono nimici, hanno occasione di assaltare, lo fanno parzialmente, e quelli altri difendono tepidamente, in modo che insieme con loro si periclita. È necessario pertanto, volendo discorrere bene questa parte, esaminare se questi innovatori stanno per lor medesimi, o se dipendano da altri; cioè, se per condurre l’opera loro bisogna che preghino, ovvero possono forzare."
  "translation_ja": "それゆえ敵は機会があるたび、党派を挙げて攻めてくる。対する味方は生ぬるい守り方しかしないので、改革者は味方ともども危うくなる。この点をきちんと論じるには、改革者が自分の足で立つのか、他人に依存するのかを見分ける必要がある。つまり仕事を成し遂げるのに、人に頼んで回らねばならないのか、それとも自ら強制する力があるのか、である。"
  "translation_status": "reviewed"
- "id": "pr-06-012"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 12
  "source_text": "Nel primo caso capitano sempre male, e non conducono cosa alcuna; ma quando dipendono da loro proprii, e possono forzare, allora è che rade volte periclitano. Di qui nacque che tutti li Profeti armati vinsono, e li disarmati rovinarono; perchè, oltre le cose dette, la natura de’ popoli è varia, ed è facile a persuadere loro una cosa, ma è difficile fermargli in quella persuasione. E però conviene essere ordinato in modo, che, quando non credono più, si possa far lor credere per forza."
  "translation_ja": "前者ならいつも悲惨な結末を迎え、何もなし遂げられない。自分によりどころがあり、意志を押し通せる場合には、危機に陥ることはめったにない。武装した預言者がみな勝ち、武器のない預言者は身を滅ぼした理由もそこにある。先に述べた事情のほかに、人々の心は変わりやすい。あることを信じさせるのは容易だが、その信念を保たせるのは難しい。だから彼らがもはや信じなくなったとき、力によってでも信じさせられる備えがいる、と著者はいう。"
  "translation_status": "reviewed"
- "id": "pr-06-013"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 13
  "source_text": "Moisè, Ciro, Teseo, e Romulo non arebbono potuto fare osservare lungamente le loro costituzioni, se fussero stati disarmati, come ne’ nostri tempi intervenne a Frate Girolamo Savonarola, il quale rovinò ne’ suoi ordini nuovi, come la moltitudine cominciò a non credergli, e lui non aveva il modo da tenere fermi quelli, che avevano creduto, nè a far credere i discredenti."
  "translation_ja": "モーセ、キュロス、テセウス、ロムルスが武器を持っていなかったなら、自分たちの定めを長く守らせることはできなかったろう。同時代では、修道士ジローラモ・サヴォナローラの身にそれが起きた。群衆が彼を信じなくなるや、新しい制度とともに失墜した。一度信じた者を引きとどめる手立ても、信じない者を信じさせる手立ても、彼にはなかった。"
  "translation_status": "reviewed"
- "id": "pr-06-014"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 14
  "source_text": "Però questi tali hanno nel condursi gran difficultà, e tutti i loro pericoli sono tra via, e conviene che con la virtù gli superino; ma superati che gli hanno, e che cominciano ad essere in venerazione, avendo spenti quelli che di sua qualità gli avevano invidia, rimangono potenti, sicuri, onorati, felici. A sì alti esempi io voglio aggiugnere uno esempio minore; ma bene arà qualche proporzione con quelli, e voglio mi basti per tutti li altri simili: e questo è Ierone Siracusano."
  "translation_ja": "だからこのような人々は、目的に達するまでに大変な苦労をする。危険はみな途上にあり、自分の力量でこれを乗り越えなくてはならない。だが乗り越えて尊敬を受け始め、自分の優秀さを妬んだ者を排したならば、あとは力と安全と名誉と幸運を享受できる。こうした高い例に、規模こそ小さいが並べて見られる例を一つ加えよう。同様の例のすべてに代わる一例である。シラクサのヒエロンだ。"
  "translation_status": "reviewed"
- "id": "pr-06-015"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 15
  "source_text": "Costui di privato diventò Principe di Siracusa; nè ancor egli cognobbe altro dalla fortuna che l’occasione: perchè essendo i Siracusani oppressi l’elessono per loro capitano, donde meritò d’essere fatto loro Principe; e fu di tanta virtù ancora in privata fortuna, che chi ne scrive dice, che niente gli mancava a regnare eccetto il Regno."
  "translation_ja": "彼は一私人からシラクサの君主となった。やはり運から受け取ったのは機会だけである。シラクサの人々は苦境にあり、彼を指揮官に選んだ。そこでの働きによって、彼は君主に選ばれるにふさわしい人物となった。私人だったころからあまりに力量があったので、彼を伝える著者は、王として彼に欠けていたものは王国だけだった、と言っている。"
  "translation_status": "reviewed"
- "id": "pr-06-016"
  "section_id": "pr-sec-06"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VI&oldid=3702255"
    "source_sequence": 16
  "source_text": "Costui spense la milizia vecchia, ordinò la nuova, lasciò le amicizie antiche, prese delle nuove; e come ebbe amicizie e soldati che fussero suoi, potette in su tale fondamento edificare ogni edificio; tantochè egli durò assai fatica in acquistare, e poca in mantenere."
  "translation_ja": "彼は旧来の軍制を廃し、新しい軍を整え、それまでの同盟を解き、新しい同盟を結んだ。自分のものといえる友と兵を得ると、その基礎にどんな建物でも建てられた。だから、手に入れるにはずいぶん苦労したが、保つ苦労はほとんどなかった。"
  "translation_status": "reviewed"
- "id": "pr-07-001"
  "section_id": "pr-sec-07"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 1
  "source_text": "CAPITOLO VII. De’ Principati nuovi, che con forze d’altri e per fortuna si acquistano."
  "translation_ja": "第七章　他人の軍事力と運によって手に入る新しい君主国について"
  "translation_status": "reviewed"
- "id": "pr-07-002"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 2
  "source_text": "Coloro i quali solamente per fortuna diventano di privati Principi, con poca fatica diventano, ma con assai si mantengono: e non hanno difficultà alcuna tra via, perchè vi volano; ma tutte le difficultà nascono dappoi che vi sono posti."
  "translation_ja": "ただ運によって私人から君主になる者は、なるのには苦労せず、とどまるのにずいぶん苦労する。途中には何の困難もない。飛んでそこに着くからだ。難しさはすべて地位に就いてから始まる。"
  "translation_status": "reviewed"
- "id": "pr-07-003"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 3
  "source_text": "E questi tali sono quelli, a chi è concesso alcuno Stato o per danari, o per grazia di chi lo concede, come intervenne a molti in Grecia nelle città di Ionia, e dell’Ellesponto, dove furono fatti Principi da Dario, acciò le tenessero per sua sicurtà e gloria, come erano ancora fatti quelli Imperadori, che di privati per corruzione de’ soldati pervenivano allo Imperio."
  "translation_ja": "金を払って、あるいは授ける側の好意で領国を与えられた者がこれに当たる。ギリシア世界のイオニアやヘレスポントス沿岸の諸都市では、多くの人々がダレイオスの安全と栄光のため都市を治めるよう彼によって君主に据えられた。兵士を買収し、一私人から帝位に上った皇帝たちも同じである。"
  "translation_status": "reviewed"
- "id": "pr-07-004"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 4
  "source_text": "Questi stanno semplicemente in su la volontà e fortuna di chi gli ha fatti grandi, che sono due cose volubilissime e instabili, e non sanno e non possono tenere quel grado; non sanno, perchè se non è uomo di grande ingegno e virtù, non è ragionevole, che, essendo sempre vissuto in privata fortuna, sappia comandare; non possono, perchè non hanno forze che gli possino essere amiche e fedeli."
  "translation_ja": "彼らはただ、自分を偉くしてくれた者の意志と運にかかっている。どちらもまことに変わりやすく不安定なものだ。この地位を守るすべも、力もない。すべがないというのは、格別に頭が切れ力量がある人でないかぎり、一生私人であったのに命じるすべを知っている道理はないからだ。力がないというのは、味方になり、忠実でいてくれる勢力がないからである。"
  "translation_status": "reviewed"
- "id": "pr-07-005"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 5
  "source_text": "Dipoi gli Stati che vengono subito, come tutte le altre cose della natura che nascono e crescono presto, non possono avere le radici e corrispondenzie loro in modo che il primo tempo avverso non le spenga; se già quelli, come è detto, che sì in un subito sono diventati Principi, non sono di tanta virtù, che quello che la fortuna ha messo loro in grembo, sappino subito prepararsi a conservare, e quelli fondamenti, che gli altri hanno fatti avanti che diventino Principi, gli faccino poi."
  "translation_ja": "それに、急にできた国は、急に生まれ育つ自然界のあらゆるものと同じで、根や結びつきが十分に育たない。初めて逆風に遭えば、たちまち枯れてしまう。ただしこのように急に君主になった者でも、力量にすぐれ、運が膝もとに投げてよこしたものを守る備えをすぐに整え、ほかの者が君主になる前に築いた基礎を後から築けるなら別である。"
  "translation_status": "reviewed"
- "id": "pr-07-006"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 6
  "source_text": "Io voglio all’uno e all’altro di questi modi, circa il diventare Principe per virtù o per fortuna, addurre duoi esempi stati ne’ dì della memoria nostra: e questi sono Francesco Sforza, e Cesare Borgia. Francesco per li debiti mezzi, e con una sua gran virtù, di privato diventò Duca di Milano, e quello che con mille affanni aveva acquistato, con poca fatica mantenne."
  "translation_ja": "力量で君主になる場合と、運で君主になる場合に、われわれの記憶する時代から一例ずつ引こう。フランチェスコ・スフォルツァとチェーザレ・ボルジアだ。フランチェスコは正当な手段と自らの大きな力量とで、一私人からミラノ公になった。千辛万苦の果てに手に入れたものを、さしたる苦労なく保った。"
  "translation_status": "reviewed"
- "id": "pr-07-007"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 7
  "source_text": "Dall’altra parte Cesare Borgia, chiamato dal vulgo Duca Valentino, acquistò lo Stato con la fortuna del Padre, e con quella lo perdette, non ostante che per lui si usasse ogni opera, e facessinsi tutte quelle cose che per un prudente e virtuoso uomo si dovevano fare, per mettere le radici sue in quelli Stati, che l’armi e fortuna di altri gli aveva concessi."
  "translation_ja": "一方、世にヴァレンティーノ公と呼ばれたチェーザレ・ボルジアは父の運で国を手に入れ、父の運とともに失った。他人の軍事力と運とで与えられた国々にみずから根を張るため、思慮と力量のある人がなすべきことを残らず行い、あらゆる努力をしたにもかかわらず、である。"
  "translation_status": "reviewed"
- "id": "pr-07-008"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 8
  "source_text": "Perchè, come di sopra si disse, chi non fa i fondamenti prima, gli potrebbe con una gran virtù fare dipoi, ancorchè si faccino con disagio dell’architettore, e pericolo dello edificio."
  "translation_ja": "前にも言ったように、土台を先に築かなかった者でも、大きな力量があれば後から築ける。ただし建てる人の苦労は増し、建物にとっても危険である。"
  "translation_status": "reviewed"
- "id": "pr-07-009"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 9
  "source_text": "Se adunque si considererà tutti i progressi del Duca, si vedrà quanto lui avesse fatto gran fondamenti alla futura potenzia, li quali non giudico superfluo discorrere, perchè io non saprei quali precetti mi dare migliori ad un Principe nuovo, che lo esempio delle azioni sue; e se gli ordini suoi non gli giovarono, non fu sua colpa, perchè nacque da una strasordinaria ed estrema malignità di fortuna. Aveva Alessandro VI nel voler fare grande il Duca suo figliuolo assai difficultà presenti e future."
  "translation_ja": "公が歩んだ道を一つずつ見れば、将来の力のためにいかに大きな土台を築いたかがわかる。その話は余計ではないと思う。新しい君主への教訓として、彼の行いほどよい例を私は知らないからだ。せっかくの制度が彼を救わなかったのは本人の落ち度ではない。運命がこのうえなく異常な意地悪をしたからである。アレクサンデル六世が息子の公を大きくしようとしたとき、目の前にも先々にも困難が多かった。"
  "translation_status": "reviewed"
- "id": "pr-07-010"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 10
  "source_text": "Prima non vedeva via di poterlo fare Signore di alcuno Stato, che non fusse Stato di Chiesa; e sapeva che il Duca di Milano e i Viniziani non glielo consentirebbono, perchè Faenza e Rimino erano di già sotto la protezione de’ Viniziani. Vedeva, oltre a questo, le armi d’Italia, e quelle in spezie, di chi si fusse possuto servire, essere nelle mani di coloro che dovevano temere la grandezza del Papa; e però non se ne poteva fidare, essendo tutte negli Orsini, e Colonnesi, e loro seguaci."
  "translation_ja": "まず、教会の領土でない国を息子に与える道は見当たらず、教会領を渡すこともミラノ公とヴェネツィア人は認めまいとわかっていた。ファエンツァとリミニはすでにヴェネツィアの保護下にあったからだ。そのうえイタリアの軍事力、とくに自分が利用できそうな軍事力が、教皇の権勢を恐れずにはいられない人々の手にあることも見えていた。オルシーニ、コロンナ両家とその一党がすべてを握っている以上、信頼などできなかった。"
  "translation_status": "reviewed"
- "id": "pr-07-011"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 11
  "source_text": "Era adunque necessario che si turbassero quelli ordini, e disordinare gli Stati d’Italia, per potersi insignorire sicuramente di parte di quelli; il che gli fu facile; perchè trovò i Viniziani, che mossi da altre cagioni si erano volti a fare ripassare i Francesi in Italia; il che non solamente non contradisse, ma fece più facile con la risoluzione del matrimonio antico del Re Luigi."
  "translation_ja": "イタリアの一部を安全に手に入れるには、既存の仕組みを揺さぶり、諸国の秩序を崩しておく必要があった。これは容易だった。ヴェネツィア人が別の理由から、フランス人を再びイタリアへ呼び戻そうとしていたからだ。教皇はそれに反対しないばかりか、ルイ王のもとの結婚を解消して、事が運びやすいようにした。"
  "translation_status": "reviewed"
- "id": "pr-07-012"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 12
  "source_text": "Passò adunque il Re in Italia con lo aiuto de’ Viniziani e consenso di Alessandro; nè prima fu in Milano, che il Papa ebbe da lui gente per l’impresa di Romagna, la quale gli fu consentita per la riputazione del Re."
  "translation_ja": "こうして王はヴェネツィアの援助とアレクサンデルの同意を得てイタリアに入った。王がミラノに着くか着かないかのうちに、教皇はロマーニャでの事業に使う兵を王から得た。王の威光があったからこそ、教皇の事業は認められたのである。"
  "translation_status": "reviewed"
- "id": "pr-07-013"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 13
  "source_text": "Acquistata adunque il Duca la Romagna, e battuti i Colonnesi, volendo mantenere quella, e procedere più avanti, l’impedivano due cose: l’una l’armi sue, che non gli parevano fedeli; l’altra la volontà di Francia; cioè temeva che l’armi Orsine, delle quali si era servito, non gli mancassero sotto, e non solamente gl’impedissero l’acquistare, ma gli togliessero l’acquistato; e che il Re ancora non gli facesse il simile."
  "translation_ja": "公はロマーニャを得、コロンナ派を打ち破ったが、領国を守ってさらに先へ進むには、二つの障害があった。一つは配下の軍への不信、もう一つはフランスの意向だった。使っていたオルシーニ家の軍隊がいざとなれば離反し、新たな獲得を妨げるばかりか手に入れたものまで奪いかねない。王もまた同じことをしかねないと恐れたのである。"
  "translation_status": "reviewed"
- "id": "pr-07-014"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 14
  "source_text": "Degli Orsini ne ebbe uno riscontro quando dopo l’espugnazione di Faenza assaltò Bologna, che gli vide andare freddi in quello assalto. E circa il Re, cognobbe l’animo suo, quando, preso il Ducato di Urbino, assaltò la Toscana; dalla quale impresa il Re lo fece desistere; ondechè il Duca deliberò non dipendere più dalla fortuna ed armi d’altri."
  "translation_ja": "オルシーニ家については、ファエンツァ攻略後にボローニャを攻めた際、その攻撃に気乗りしない様子を目にして見当がついた。王の腹がわかったのは、ウルビーノ公国を得たのちトスカーナに手を出し、断念を迫られたときだった。そこで公は他人の運と軍にはもう頼るまいと決めた。"
  "translation_status": "reviewed"
- "id": "pr-07-015"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 15
  "source_text": "E la prima cosa indebolì le parti Orsine e Colonnesi in Roma, perchè tutti gli aderenti loro, che fussino gentiluomini, si guadagnò, facendogli suoi gentiluomini, e, dando loro gran provvisioni, gli onorò secondo le qualità loro, di condotte e di governi; in modo che in pochi mesi negli animi loro l’affezione delle parti si spense, e tutta si volse nel Duca."
  "translation_ja": "まずローマにおけるオルシーニ派とコロンナ派の力をそいだ。両家に従う貴族をことごとく自分の家臣に迎え、手厚い俸給を与え、それぞれの身分に応じて指揮権や統治の職を授けて重く用いた。数カ月もすれば、彼らの胸に残っていた派閥への忠誠は消え、まるごと公に向けられた。"
  "translation_status": "reviewed"
- "id": "pr-07-016"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 16
  "source_text": "Dopo questo aspettò l’occasione di spegnere gli Orsini, avendo dispersi quelli di casa Colonna, la quale gli venne bene, ed egli usò meglio; perchè avvedutisi gli Orsini tardi che la grandezza del Duca e della Chiesa era la lor rovina, fecero una dieta a Magione nel Perugino."
  "translation_ja": "コロンナ家を四散させたあと、公はオルシーニ家を倒す機会を待った。機会は具合よく訪れ、公はそれをいっそう巧みに使った。公と教会が大きくなるのは自分たちの破滅だとようやく悟ったオルシーニ一門は、ペルージャ領のマジョーネで会議を開いた。"
  "translation_status": "reviewed"
- "id": "pr-07-017"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 17
  "source_text": null
  "translation_ja": "そこからウルビーノの反乱とロマーニャの動乱が起こり、公は無数の危険にさらされたが、フランス人の助けですべてをしのいだ。威信を取り戻しても、フランスもほかの外国勢も信じられず、公は欺きに転じた。〔セニガッリアへ相手を誘い出し捕らえた具体的な手順は非収録。〕"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "段落原文を非収録：謀殺の誘導手順。歴史上の帰結は訳文に残す。"
- "id": "pr-07-018"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 18
  "source_text": "Spenti adunque questi capi, e ridotti li partigiani loro amici suoi, aveva il Duca gittati assai buoni fondamenti alla potenza sua, avendo tutta la Romagna con il Ducato di Urbino, e guadagnatosi tutti quei popoli, per avere incominciato a gustare il ben essere loro. E perchè questa parte è degna di notizia, e da essere imitata da altri, non la voglio lasciare indietro."
  "translation_ja": "この指導者たちが殺され、一味が公の友人となって、公は権力の足もとにかなり確かな基礎を築いた。全ロマーニャとウルビーノ公国を握り、住民も暮らしがよくなるのを味わい始めて、公になびいた。この点は知っておく値打ちがあり、ほかの人の手本になるので、飛ばしておきたくない。"
  "translation_status": "reviewed"
- "id": "pr-07-019"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 19
  "source_text": "Preso che ebbe il Duca la Romagna, trovandola essere stata comandata da Signori impotenti, quali piuttosto avevano spogliato i loro sudditi, che correttoli, e dato loro materia di disunione, che di unione; tantochè quella provincia era tutta piena di latrocini, di brighe, e di ogni altra sorte d’insolenza, giudicò necessario, a volerla ridurre pacifica ed obbediente al braccio regio, darli un buon governo. Però vi prepose messer Ramiro d’Orco, uomo crudele ed espedito, al quale dette pienissima potestà."
  "translation_ja": "ロマーニャを手に入れた公が見たのは、力のない領主たちに治められてきた土地だった。彼らは臣民を正すよりも収奪し、結束よりも仲たがいの種を与えた。そのため地方じゅうに強盗、争い、あらゆる乱暴がはびこっていた。平和を取り戻し君主の権威に従わせるには、よい統治が要ると公は考え、残酷だが仕事の早いラミロ・ドルコ殿を据えて全権を授けた。"
  "translation_status": "reviewed"
- "id": "pr-07-020"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 20
  "source_text": "Costui in breve tempo la ridusse pacifica e unita con grandissima riputazione. Dipoi giudicò il Duca non essere a proposito sì eccessiva autorità, perchè dubitava non diventasse odiosa; e preposevi un giudizio civile nel mezzo della provincia, con un presidente eccellentissimo, dove ogni città avea l’avvocato suo."
  "translation_ja": "この男は短時日のうちに秩序と統一を回復し、大変な威勢を得た。やがて公は、これほど行き過ぎた権限は、憎しみの的になりかねず具合が悪いと判断した。そこで地方の中央に民事裁判所を設け、優れた長官を置き、各都市がそこに自分の代理人を立てるようにした。"
  "translation_status": "reviewed"
- "id": "pr-07-021"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 21
  "source_text": null
  "translation_ja": "過去の厳しい支配が自分への憎しみもいくらか生んだと知った公は、責任を臣下に帰した。〔臣下の殺害を公衆に示して印象を操作する具体的な演出は非収録。〕その光景のすさまじさに、人々は溜飲を下げると同時に呆然とした。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "段落原文を非収録：殺害の演出と責任転嫁の手順。歴史上の帰結は訳文に残す。"
- "id": "pr-07-022"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 22
  "source_text": "Ma torniamo donde noi partimmo."
  "translation_ja": "だが、話を元に戻そう。"
  "translation_status": "reviewed"
- "id": "pr-07-023"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 23
  "source_text": "Dico, che trovandosi il Duca assai potente, ed in parte assicurato da’ presenti pericoli, per essersi armato a suo modo, ed avere in buona parte spente quelle armi che vicine lo potevano offendere, li restava, volendo procedere con l’acquisto, il respetto di Francia; perchè cognosceva che dal Re, il quale tardi si era avveduto dell’errore suo, non gli sarebbe sopportato."
  "translation_ja": "公はいまや十分に強くなった。自分の望む形で軍を持ち、近くにあって危害を加えられる軍も大方退けたので、差し迫った危険はいくらか去っていた。だが領地獲得を続けようとすれば、なおフランスを気にせずにはいられなかった。自分の誤りに遅ればせながら気づいた王が、これ以上は容認しないと知っていたからだ。"
  "translation_status": "reviewed"
- "id": "pr-07-024"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 24
  "source_text": "E cominciò per questo a cercare amicizie nuove, e vacillare con Francia, nella venuta che fecero i Francesi verso il Regno di Napoli contro li Spagnuoli che assediavano Gaeta. E l’animo suo era di assicurarsi di loro; il che già saria presto riuscito, se Alessandro viveva. E questi furono i governi suoi circa le cose presenti."
  "translation_ja": "そこで新しい友好関係を求め始め、フランスが、ガエータを包囲するスペイン勢に対抗してナポリ王国へ進んだときには、フランスへの態度をあいまいにした。公はフランスに脅かされない立場を築きたかった。アレクサンデルが生きていれば、ほどなく目的を達したろう。以上が当面の事態に対する公の対処だった。"
  "translation_status": "reviewed"
- "id": "pr-07-025"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 25
  "source_text": null
  "translation_ja": "だが将来については心配があった。まず教会の新しい後継者が自分の味方ではなく、アレクサンデルが与えたものを取り上げようとする恐れである。そこで四つの手を考えた。〔失脚した諸侯の血族への加害策は非収録。〕第二は、すでに述べたようにローマの貴族をことごとく味方にして教皇を抑えること。第三は枢機卿会をできるかぎり味方につけること。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "段落原文を非収録：失脚した諸侯の血族を対象とする加害策。歴史上の帰結は訳文に残す。"
- "id": "pr-07-026"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 26
  "source_text": "Quarto, con acquistare tanto imperio, avanti che il Papa morisse, che potesse per sè medesimo resistere a un primo impeto."
  "translation_ja": "第四は、教皇が死ぬ前に、自力で最初の衝撃に耐えうるだけの領国を獲得することだった。"
  "translation_status": "reviewed"
- "id": "pr-07-027"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 27
  "source_text": "Di queste quattro cose alla morte di Alessandro ne aveva condotte tre; la quarta aveva quasi per condotta. Perchè de’ Signori spogliati ne ammazzò quanti ne potè aggiugnere, e pochissimi si salvarono; i gentiluomini Romani si aveva guadagnato; e nel Collegio aveva grandissima parte. E quanto al nuovo acquisto, aveva disegnato diventare Signore di Toscana; e possedeva già Perugia e Piombino, e di Pisa aveva preso la protezione."
  "translation_ja": "四つの事柄のうち、アレクサンデルの死までに三つを成し遂げ、第四もほぼ成し遂げていた。公は領地を奪った諸侯を手の届くかぎり殺し、生き延びた者はごく少なかった。ローマの貴族は取り込み、枢機卿会ではきわめて多くの支持を持っていた。領地の獲得についても、トスカーナの支配者になる構想があり、すでにペルージャとピオンビーノを領し、ピサを保護下に置いていた。"
  "translation_status": "reviewed"
- "id": "pr-07-028"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 28
  "source_text": "E come non avesse dovuto avere rispetto a Francia (che non glie n’aveva ad aver più, per essere già i Francesi spogliati del Regno di Napoli dagli Spagnuoli, in forma che ciascun di loro era necessitato di comperare l’amicizia sua), saltava in Pisa."
  "translation_ja": "フランスに気兼ねする必要さえなくなれば、ピサに入るつもりだった。実際もう気兼ねは無用だった。フランスはすでにスペインにナポリ王国を奪われ、フランスもスペインも公の友好を買う必要に迫られていたからだ。"
  "translation_status": "reviewed"
- "id": "pr-07-029"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 29
  "source_text": "Dopo questo, Lucca e Siena cedeva subito, parte per invidia de’ Fiorentini, e parte per paura; i Fiorentini non avevano rimedio; il che se li fusse riuscito, che gli riusciva l’anno medesimo che Alessandro morì, si acquistava tante forze e tanta riputazione, che per sè stesso si sarebbe retto, senza dipendere dalla fortuna o forza d’altri, ma solo dalla potenza e virtù sua. Ma Alessandro morì dopo cinque anni, che egli aveva incominciato a trarre fuora la spada."
  "translation_ja": "次には、フィレンツェへの反感と恐れから、ルッカとシエナがすぐに屈し、フィレンツェには打つ手がなくなるはずだった。これが成功すれば、そしてアレクサンデルが死んだまさにその年には成功したはずなのだが、公は十分な力と威信を得、他人の力や運でなく自分の力と力量だけで立てるはずだった。だが、公が剣を抜いて活動を始めてから五年でアレクサンデルは死んだ。"
  "translation_status": "reviewed"
- "id": "pr-07-030"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 30
  "source_text": "Lasciollo con lo Stato di Roma solamente assolidato, con tutti gli altri in aria, intra duoi potentissimi eserciti inimici, ammalato a morte. Ed era nel Duca tanta ferocia e tanta virtù, e si ben cognosceva come gli uomini s’abbino a guadagnare o perdere, e tanto erano validi i fondamenti che in sì poco tempo si aveva fatti, che se non avesse avuto quelli eserciti addosso, o fusse stato sano, arebbe retto ad ogni difficultà."
  "translation_ja": "父が死んだとき、足もとが固まっていたのはローマの領国だけで、ほかのすべては宙に浮いていた。敵対する二つの強大な軍に挟まれ、公自身は死の病の床にあった。それでも公には激しい気性と力量があり、人を味方にし、あるいは失う機微を知り、これほど短期間に築いた基礎も強固だった。二つの軍を背負っていなかったか、あるいは本人が健康だったか、そのどちらかだけでも、あらゆる難局をしのげただろう。"
  "translation_status": "reviewed"
- "id": "pr-07-031"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 31
  "source_text": "E che li fondamenti suoi fussino buoni, si vide, che la Romagna l’aspettò più di un mese; in Roma, ancora che mezzo morto, stette sicuro; e benchè i Baglioni, Vitelli, e Orsini venissero in Roma, non ebbero seguito contro di lui. Potè fare, se non chi egli volle, almeno che non fusse Papa chi egli non voleva. Ma se nella morte di Alessandro fusse stato sano, ogni cosa gli era facile."
  "translation_ja": "基礎の確かさは事実から見てとれる。ロマーニャはひと月以上も彼を待った。ローマでは半死半生でも安全だった。バリオーニ、ヴィテッリ、オルシーニの諸家が入城したのに、彼らに従って公に敵対する者はいなかった。望む人を教皇にするのは無理でも、望まない人が教皇になるのを阻むことはできた。アレクサンデルが死んだときに健康だったなら、どれもたやすかったはずだ。"
  "translation_status": "reviewed"
- "id": "pr-07-032"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 32
  "source_text": "Ed egli mi disse ne’ dì che fu creato Iulio II, che avea pensato a tutto quello che potesse nascere morendo il Padre, e a tutto aveva trovato rimedio, eccetto che non pensò mai in su la sua morte di stare ancora lui per morire. Raccolte adunque tutte queste azioni del Duca, non saprei riprenderlo, anzi mi pare, come io ho fatto, di proporlo ad imitare a tutti coloro, che per fortuna e con l’armi d’altri sono saliti all’imperio."
  "translation_ja": "ユリウス二世が選ばれたころ、公は私にこう言った。父が死ねば何が起きうるか、すべて考え、すべてに手を打ってあった。ただ父が死ぬとき、自分までもが死にかけていようとは、ついぞ考えなかった、と。こうして公の行いをまとめてみると、私には彼を責める言葉がない。むしろこれまでそうしてきたように、他人の軍事力と運とで権力に上ったすべての人に、手本として示したい。"
  "translation_status": "reviewed"
- "id": "pr-07-033"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 33
  "source_text": "Perchè egli avendo l’animo grande, e la sua intenzione alta, non si poteva governare altrimente; e solo si oppose alli suoi disegni la brevità della vita di Alessandro, e la sua infirmità."
  "translation_ja": "公には大きな志と高い目標があった。それなら別の行き方はできなかった。計画を阻んだのはアレクサンデルの余命の短さと、公自身の病だけだった。"
  "translation_status": "reviewed"
- "id": "pr-07-034"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 34
  "source_text": "Chi adunque giudica necessario nel suo Principato nuovo assicurarsi degl’inimici, guadagnarsi amici, vincere o per forza o per fraude, farsi amare e temere da’ populi, seguire e riverire da’ soldati, spegnere quelli che ti possono o debbono offendere, e innovare con nuovi modi gli ordini antichi, essere severo e grato, magnanimo e liberale, spegnere la milizia infedele, creare della nuova, mantenersi le amicizie de’ Re e delli Principi, in modo che ti abbino a beneficare con grazia, o ad offendere con rispetto, non può trovare più freschi esempi, che le azioni di costui."
  "translation_ja": "新たな国では敵から身を守り、友を得、力によるか策略によるかして勝ち、民に愛され恐れられ、兵に従われ敬われ、危害を加えうる者を除き、古い制度を新しくし、厳格である一方で恩に報い、度量と気前のよさを示し、不忠な軍を廃して新しい軍を設け、王や君主との友好を保ち、相手が進んで便宜をはかり、不利益を加えるにはためらうようにする必要がある、と考える人は、この公の行いより新しい例を見つけられまい。"
  "translation_status": "reviewed"
- "id": "pr-07-035"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 35
  "source_text": "Solamente si può accusarlo nella creazione di Iulio II, nella quale egli ebbe mala elezione; perchè, come è detto, non potendo fare un Papa a suo modo, poteva tenere, che uno non fusse Papa; e non dovea acconsentire mai al Papato di quelli Cardinali, che lui avesse offesi, o che diventati Pontefici avessino ad avere paura di lui. Perchè gli uomini offendono o per paura, o per odio. Quelli che egli aveva offesi, erano, tra gli altri, S. Pietro ad Vincula, Colonna, S. Giorgio, Ascanio."
  "translation_ja": "非難できるとすれば、ユリウス二世の選出だけだ。そこでは選択を誤った。すでに述べたように、自分の意中の教皇は選べなくても、特定の一人の就任を阻むことはできたからだ。自分が侮辱した枢機卿や、教皇になれば自分を恐れる枢機卿の即位に、決して同意すべきではなかった。人が相手を傷つけるのは、恐れか憎しみからである。公が侮辱した顔ぶれには、サン・ピエトロ・イン・ヴィンコリ、コロンナ、サン・ジョルジョ、アスカニオがいた。"
  "translation_status": "reviewed"
- "id": "pr-07-036"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 36
  "source_text": "Tutti gli altri assunti al Pontificato avevano da temerlo, eccetto Roano e gli Spagnuoli. Questi per coniunzione e obbligo, quello per potenza, avendo congiunto seco il Regno di Francia. Pertanto il Duca innanzi ad ogni cosa doveva creare Papa uno Spagnuolo; e, non potendo, dovea consentire che fusse Roano, e non S. Pietro ad Vincula. E chi crede che ne’ personaggi grandi beneficii nuovi faccino dimenticare l’ingiurie vecchie, s’inganna."
  "translation_ja": "ほかの誰が教皇になっても公を恐れたはずだが、ルーアンの枢機卿とスペイン人は別だった。スペイン人には縁と恩義があり、ルーアンにはフランス王国を背負う力があった。だから公はまずスペイン人を教皇にすべきであり、無理ならサン・ピエトロ・イン・ヴィンコリでなく、ルーアンに同意すべきだった。権力者が新しい恩によって昔の恨みを忘れると思う者は、見誤っている。"
  "translation_status": "reviewed"
- "id": "pr-07-037"
  "section_id": "pr-sec-07"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VII&oldid=3702256"
    "source_sequence": 37
  "source_text": "Errò adunque il Duca in questa elezione, e fu cagione dell’ultima rovina sua."
  "translation_ja": "結局、公はこの選挙で誤った。そのことが最終的に自分の破滅を招いたのである。"
  "translation_status": "reviewed"
- "id": "pr-08-001"
  "section_id": "pr-sec-08"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 1
  "source_text": "CAPITOLO VIII. Di quelli che per scelleratezze sono pervenuti al Principato."
  "translation_ja": "第八章　悪行によって君主の地位に上った者について"
  "translation_status": "reviewed"
- "id": "pr-08-002"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 2
  "source_text": "Ma perchè di privato si diventa ancora in duoi modi Principe, il che non si può al tutto, o alla fortuna, o alla virtù attribuire, non mi pare da lasciargli indietro, ancora che dell’uno si possa più diffusamente ragionare dove si trattasse delle Republiche. Questi sono, quando o per qualche via scellerata e nefaria si ascende al Principato, o quando uno privato cittadino con il favore degli altri suoi cittadini diventa Principe della sua patria."
  "translation_ja": "一私人が君主になる道にはもう二つ、運にも力量にもすっかり帰するわけにはいかないものがある。片方は共和国を扱うところで詳しく論じられる事柄だが、いずれもここで飛ばすべきではない。一つは邪悪で忌むべき道から君主の地位に上る場合、もう一つは普通の市民が、同じ国の市民の支持を得て祖国の君主となる場合である。"
  "translation_status": "reviewed"
- "id": "pr-08-003"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 3
  "source_text": "E, parlando del primo modo, si mostrerà con duoi esempi, l’uno antico, l’altro moderno, senza entrare altrimenti ne’ meriti di questa parte, perchè giudico che bastino a chi fusse necessitato imitargli. Agatocle Siciliano, non solo di privata, ma d’infima ed abietta fortuna, divenne Re di Siracusa. Costui nato di un orciolaio, tenne sempre per i gradi della sua fortuna vita scellerata."
  "translation_ja": "第一の道について、古代と現代から一例ずつ示そう。これ以上ここで中身に深入りはしない。こうした例にならわざるをえない者にはそれで十分だと思うからだ。シチリアのアガトクレスは私人、それもごく低く卑しまれた境遇から、シラクサの王になった。陶工の子として生まれた彼は、出世の階を上っていくあいだ、終始悪事に手を染めていた。"
  "translation_status": "reviewed"
- "id": "pr-08-004"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 4
  "source_text": "Nondimanco accompagnò le sue scelleratezze con tanta virtù di animo e di corpo, che voltosi alla milizia, per li gradi di quella pervenne ad essere Pretore di Siracusa."
  "translation_ja": "しかしその悪行には並外れた気力と体力が伴っていた。軍務に身を投じ、階級を一段ずつ上ってシラクサの法務官となった。"
  "translation_status": "reviewed"
- "id": "pr-08-005"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 5
  "source_text": null
  "translation_ja": "その地位に就くと、合意によって委ねられた権限を、今度は誰にも恩を負わず、暴力によって保持し、君主になろうと心を決めた。シチリアに出兵していたカルタゴのハミルカルにその意向を通じた。〔シラクサの元老院議員と富裕な市民を集団殺害した具体的な手順は非収録。〕彼らが命を失うと、内戦というほどの争いもなく、都市の君主権を奪い、保った。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "段落原文を非収録：集団殺害の準備と実行。政治的論旨・歴史上の帰結のみを記載。"
- "id": "pr-08-006"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 6
  "source_text": "E benchè da’ Cartaginesi fusse due volte rotto, e ultimamente assediato, non solamente potè difendere la sua città, ma lasciata parte della sua gente alla difesa di quella, con l’altre assaltò l’Affrica, e in breve tempo liberò Siracusa dall’assedio, e condusse i Cartaginesi in estrema necessità: i quali furono necessitati ad accordarsi con quello, ad essere contenti della possessione dell’Affrica, e ad Agatocle lasciare la Sicilia."
  "translation_ja": "カルタゴ軍に二度敗れ、ついには包囲されても、この町に守備の兵を残し、ほかの兵とともにアフリカに戦いを移し、短時日のうちにシラクサの包囲を解いて、カルタゴ人を窮地に追い込んだ。カルタゴは彼と和を結び、自分はアフリカの所領でよしとして、シチリアをアガトクレスに任せるしかなかった。"
  "translation_status": "reviewed"
- "id": "pr-08-007"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 7
  "source_text": "Chi considerasse adunque le azioni e virtù di costui, non vedria cose o poche, le quali possa attribuire alla fortuna, conciossiachè, come di sopra è detto, non per favore di alcuno, ma per li gradi della milizia, quali con mille disagi e pericoli si aveva guadagnato, pervenisse al Principato, e quello dipoi con tanti animosi partiti e pericolosi mantenesse."
  "translation_ja": "この男の行いと力量を考える人は、運に帰せるものがないか、あってもごく少ないと見るだろう。先に述べたとおり、誰かの引き立てでなく、無数の苦労と危険を冒して軍で地位を上げ、君主になり、その後は勇気を要する危うい決断をいくつも重ねて地位を保ったからだ。"
  "translation_status": "reviewed"
- "id": "pr-08-008"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 8
  "source_text": "Non si può chiamare ancora virtù ammazzare li suoi cittadini, tradire gli amici, essere senza fede, senza pietà, senza religione; li quali modi possono far acquistare imperio, ma non gloria. Perchè se si considerasse la virtù di Agatocle nell’entrare e nell’uscire de’ pericoli, e la grandezza dell’animo suo nel sopportare e superare le cose avverse, non si vede perchè egli abbia ad essere tenuto inferiore a qualsisia eccellentissimo capitano."
  "translation_ja": "しかし自国の市民を殺し、友を裏切り、信義も慈悲も信仰も持たないことを力量と呼ぶことはできない。そのような道で支配権は得られても、栄光は得られない。危険に踏み込み、そこから抜け出すアガトクレスの力量や、逆境に堪えて克服する気概の大きさだけを取れば、どんな名将にも劣ると見る理由はない。"
  "translation_status": "reviewed"
- "id": "pr-08-009"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 9
  "source_text": "Nondimeno la sua efferata crudeltà e inumanità, con infinite scelleratezze, non consentono che sia tra li eccellentissimi uomini celebrato. Non si può adunque attribuire alla fortuna o alla virtù quello che senza l’una e l’altra fu da lui conseguito."
  "translation_ja": "それでも、残忍非道な振る舞いと無数の悪事のため、傑出した人々の列に加えてたたえるわけにはいかない。したがって、運にも力量にもよらずに得たものを、いずれかの手柄にすることはできない。"
  "translation_status": "reviewed"
- "id": "pr-08-010"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 10
  "source_text": "Ne’ tempi nostri, regnante Alessandro VI, Oliverotto da Fermo, essendo più anni addietro rimaso piccolo, fu da un suo zio materno, chiamato Giovanni Fogliani, allevato, e ne’ primi tempi della sua gioventù dato a militare sotto Paulo Vitelli, acciocchè ripieno di quella disciplina, pervenisse a qualche grado eccellente di milizia."
  "translation_ja": "われわれの時代、アレクサンデル六世の在位中に、フェルモのオリヴェロットという男がいた。ずっと以前、幼くして親を亡くし、母方の叔父ジョヴァンニ・フォリアーニに育てられた。まだ若いうちにパオロ・ヴィテッリのもとで軍務に就かされたのは、そこで鍛えられ、軍人として高い地位に上れるようにとのことだった。"
  "translation_status": "reviewed"
- "id": "pr-08-011"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 11
  "source_text": "Morto dipoi Paulo, militò sotto Vitellozzo suo fratello, ed in brevissimo tempo, per essere ingegnoso, e della persona e dell’animo gagliardo, diventò de’ primi uomini della sua milizia."
  "translation_ja": "パオロの死後には弟のヴィテッロッツォに仕えた。才知があり心身ともにたくましかったので、たちまち彼の軍でも指折りの人物となった。"
  "translation_status": "reviewed"
- "id": "pr-08-012"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":

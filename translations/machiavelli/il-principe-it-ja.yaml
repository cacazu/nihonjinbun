- "id": "pr-03-015"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 15
  "source_text": null
  "translation_ja": "以上から著者は、入植のほうが安上がりで信用が置け、反感を買う範囲も狭いと結論する。〔報復の機会を奪うための加害を指示する部分は非収録。〕"
  "translation_status": "partial"
  "issues":

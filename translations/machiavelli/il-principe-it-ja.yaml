    "source_sequence": 1
  "source_text": "NICC. MACHIAVELLI al MAGNIFICO LORENZO DI PIERO DE’ MEDICI."
  "translation_ja": "ニッコロ・マキャヴェッリより、ピエロ・デ・メディチの子、高名なるロレンツォ殿へ"
  "translation_status": "reviewed"
- "id": "pr-00-002"
  "section_id": "pr-sec-00"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Dedica&oldid=3702275"
    "source_sequence": 2
  "source_text": "Sogliono il più delle volte coloro che desiderano acquistare grazia appresso un Principe, farsegli innanzi con quelle cose, che tra le loro abbino più care, o delle quali vegghino lui più dilettarsi; donde si vede molte volte esser loro presentati cavalli, arme, drappi d’oro, pietre preziose e simili ornamenti, degni della grandezza di quelli."
  "translation_ja": "君主の寵愛を得たいと思う者は、たいてい、自分の持ち物のなかでいちばん大切にしているものか、君主がとりわけ好むと見て取ったものを携えて、その御前に進み出ます。馬や武具、金襴の織物、宝石など、その方の威光にふさわしい品々がしばしば贈られるのは、そのためです。"
  "translation_status": "reviewed"
- "id": "pr-00-003"
  "section_id": "pr-sec-00"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Dedica&oldid=3702275"
    "source_sequence": 3
  "source_text": "Desiderando io adunque offerirmi alla Vostra Magnificenza con qualche testimone della servitù mia verso di quella, non ho trovato, tra la mia suppellettile, cosa, quale io abbia più cara, o tanto stimi, quanto la cognizione delle azioni degli uomini grandi, imparata da me con una lunga sperienza delle cose moderne, ed una continova lezione delle antiche, la quale avendo io con gran diligenza lungamente escogitata ed esaminata, ed ora in uno piccolo volume ridotta, mando alla Magnificenza Vostra."
  "translation_ja": "そこで私も、閣下にお仕えする心のしるしを持って御前に出たいと存じ、自分の手もとを探してみました。けれども、偉大な人々の行いについて得た知識ほど、私が大切に思い、高く買っているものは、ほかにはございません。それは当代の事柄を長く実地に経験し、遠い昔の記録をたえず読み続けて得たものです。長いあいだ心を尽くして考え、吟味してまいりましたが、このたび一冊の小さな本にまとめましたので、閣下にお届けいたします。"
  "translation_status": "reviewed"
- "id": "pr-00-004"
  "section_id": "pr-sec-00"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Dedica&oldid=3702275"
    "source_sequence": 4
  "source_text": "E benchè io giudichi questa opera indegna della presenza di quella; nondimeno confido assai, che per sua umanità gli debba essere accetta, considerato che da me non li possa essere fatto maggior dono, che darle facultà a poter in brevissimo tempo intendere tutto quello, che io in tanti anni, e con tanti miei disagi e pericoli ho cognosciuto ed inteso: la quale opera io non ho ornata nè ripiena di clausule ampie, o di parole ampollose o magnifiche, o di qualunque altro lenocinio o ornamento estrinseco, con li quali molti sogliono le lor cose discrivere ed ornare; perchè io ho voluto o che veruna cosa la onori, o che solamente la verità della materia, e la gravità del soggetto la faccia grata."
  "translation_ja": "御前に差し出すに足る書とは私も思っておりません。それでも、閣下のご厚情ゆえに、お納めいただけると信じております。長い年月をかけ、数々の苦難を忍び、危険を冒して私が見聞きし理解したことのすべてを、ほんの短いあいだに知っていただけるようにする。私にできる贈り物に、これ以上のものはございません。本書には、もったいぶった長広舌も、大仰で華やかな文句も詰め込みませんでした。多くの書き手が自分の著作を飾り立てるのに使う、そのほかの見せかけの魅力や上辺の装いも加えておりません。何の飾りもないままでよい、もしお気に召すとすれば、記したことが事実であり、取り上げた主題に重みがあるからであってほしいと願ったからです。"
  "translation_status": "reviewed"
- "id": "pr-00-005"
  "section_id": "pr-sec-00"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Dedica&oldid=3702275"
    "source_sequence": 5
  "source_text": "Nè voglio sia riputata presunzione, se uno uomo di basso ed infimo stato ardisce discorrere e regolare i governi de’ Principi; perchè così come coloro che disegnano i paesi, si pongono bassi nel piano a considerare la natura de’ monti e de’ luoghi alti, e per considerare quella de’ bassi si pongono alti sopra i monti; similmente, a cognoscer bene la natura de’ popoli bisogna esser Principe, ed a cognoscer bene quella de’ Principi conviene essere popolare."
  "translation_ja": "また、身分も地位も低い人間が、君主の政治を論じ、そのあり方まで定めようとするのを、思い上がりとはお取りにならないでください。風景を描く者は、山や高地の様子をよく見るため平地に降り、低地の様子を見るため山に登ります。同じように、民というものをよく知るには君主でなければならず、君主というものをよく知るには一介の民でなければならないのです。"
  "translation_status": "reviewed"
- "id": "pr-00-006"
  "section_id": "pr-sec-00"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Dedica&oldid=3702275"
    "source_sequence": 6
  "source_text": "Pigli adunque Vostra Magnificenza questo piccolo dono con quello animo che io lo mando; il quale se da quella fia diligentemente considerato e letto, vi cognoscerà dentro uno estremo mio desiderio, che ella pervenga a quella grandezza che la fortuna, e le altre sue qualità le promettono. E se Vostra Magnificenza dallo apice della sua altezza qualche volta volgerà gli occhi in questi luoghi bassi, cognoscerà, quanto indegnamente io sopporti una grande e continova malignità di fortuna."
  "translation_ja": "どうか、このささやかな贈り物を、私が差し上げるのと同じ心でお受け取りください。念を入れてお読みになれば、運とご自身のさまざまな資質が約束する偉大な地位に、閣下が達せられるようにとの、私の切なる願いをお認めいただけるでしょう。そしてその地位の頂から、折にふれてこの低い場所にも目を向けてくださるなら、私がいかにいわれもなく、苛酷な運命に長く苦しめられているか、お分かりいただけることでしょう。"
  "translation_status": "reviewed"
- "id": "pr-01-001"
  "section_id": "pr-sec-01"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_I&oldid=3702249"
    "source_sequence": 1
  "source_text": "IL PRINCIPE di NICC. MACHIAVELLI."
  "translation_ja": "『君主論』　ニッコロ・マキャヴェッリ著"
  "translation_status": "reviewed"
- "id": "pr-01-002"
  "section_id": "pr-sec-01"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_I&oldid=3702249"
    "source_sequence": 2
  "source_text": "CAPITOLO I. Quante siano le specie de’ Principati, e con quali modi si acquistino."
  "translation_ja": "第一章　君主国にはいくつの種類があり、どのように獲得されるか"
  "translation_status": "reviewed"
- "id": "pr-01-003"
  "section_id": "pr-sec-01"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_I&oldid=3702249"
    "source_sequence": 3
  "source_text": "Tutti gli Stati, tutti i dominii che hanno avuto, e hanno imperio sopra gli uomini, sono stati e sono o Repubbliche o Principati. I principati sono o ereditari, de’ quali il sangue del loro Signore ne sia stato lungo tempo Principe, o e’ sono nuovi. I nuovi o sono nuovi tutti, come fu Milano a Francesco Sforza, o sono come membri aggiunti allo stato ereditario del Principe che gli acquista, come è il Regno di Napoli al Re di Spagna."
  "translation_ja": "今も昔も、人々に支配権を行使してきた国家、領国はすべて、共和国か君主国である。君主国には二種類ある。君主の一族が代々長く治めてきた世襲の国と、新しく手に入れた国である。新しい国には、フランチェスコ・スフォルツァにとってのミラノのように、その君主にとってまったく新しいものもあれば、スペイン王にとってのナポリ王国のように、獲得した君主の世襲領に一部として加わるものもある。"
  "translation_status": "reviewed"
- "id": "pr-01-004"
  "section_id": "pr-sec-01"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_I&oldid=3702249"
    "source_sequence": 4
  "source_text": "Sono questi dominii, così acquistati, o consueti a vivere sotto un Principe, o usi ad esser liberi; ed acquistansi o con le armi di altri o con le proprie, o per fortuna o per virtù."
  "translation_ja": "こうして得た領国の住民には、君主のもとで暮らし慣れた者も、自由な暮らしに慣れた者もいる。手に入れるにあたっては、他人の軍事力によることも、自分の軍事力によることもあり、運によることも、自分の力量によることもある。"
  "translation_status": "reviewed"
- "id": "pr-02-001"
  "section_id": "pr-sec-02"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_II&oldid=3702250"
    "source_sequence": 1
  "source_text": "CAPITOLO II. De’ Principati ereditari."
  "translation_ja": "第二章　世襲の君主国について"
  "translation_status": "reviewed"
- "id": "pr-02-002"
  "section_id": "pr-sec-02"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_II&oldid=3702250"
    "source_sequence": 2
  "source_text": "Io lascerò indietro il ragionare delle Repubbliche, perchè altra volta ne ragionai a lungo. Volterommi solo al Principato, e anderò, nel ritessere queste orditure di sopra, disputando come questi Principati si possono governare e mantenere."
  "translation_ja": "共和国については、以前に詳しく論じたことがあるので、ここでは立ち入らない。もっぱら君主国に目を向けることにしよう。先に張った縦糸に横糸を通していくように、こうした国をどのように治め、保っていけるかを考えていく。"
  "translation_status": "reviewed"
- "id": "pr-02-003"
  "section_id": "pr-sec-02"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_II&oldid=3702250"
    "source_sequence": 3
  "source_text": "Dico adunque, che nelli Stati ereditari, ed assuefatti al sangue del loro Principe, sono assai minori difficultà a mantenergli, che ne’ nuovi; perchè basta solo non trapassare l’ordine de’ suoi antenati, e dipoi temporeggiare con gli accidenti, in modo che se tal Principe è di ordinaria industria, sempre si manterrà nel suo Stato, se non è una straordinaria ed eccessiva forza che ne lo priva; e privato che ne sia, quantunque di sinistro abbia lo occupatore, lo racquista."
  "translation_ja": "代々同じ君主の一族に慣れ親しんだ世襲の国は、新しく得た国と比べて、維持するのがはるかにたやすい。祖先からのしきたりを踏み外さず、あとは出来事に応じて時機を見ながら対処すればよい。並の才覚をそなえた君主なら、並外れて強大な力で追われでもしないかぎり、その地位にとどまれる。たとえ追われても、国を奪った者がひとたび逆境に陥れば、取り戻すことができる。"
  "translation_status": "reviewed"
- "id": "pr-02-004"
  "section_id": "pr-sec-02"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_II&oldid=3702250"
    "source_sequence": 4
  "source_text": "Noi abbiamo in Italia, per esempio, il Duca di Ferrara, il quale non ha retto agli assalti de’ Viniziani nell’84, nè a quelli di Papa Iulio nel 10 per altre cagioni che per essere antiquato in quel Dominio."
  "translation_ja": "イタリアにはフェラーラ公の例がある。一四八四年のヴェネツィア人の攻勢にも、一五一〇年の教皇ユリウスの攻勢にも持ちこたえられたのは、ただ、その家の支配がこの領国で古くから続いていたからである。"
  "translation_status": "reviewed"
- "id": "pr-02-005"
  "section_id": "pr-sec-02"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_II&oldid=3702250"
    "source_sequence": 5
  "source_text": "Perchè il Principe naturale ha minori cagioni e minori necessità di offendere; donde conviene che sia più amato; e se strasordinarii vizi non lo fanno odiare, è ragionevole che naturalmente sia ben voluto da’ suoi; e nell’antichità e continuazione del dominio sono spente le memorie e le cagioni delle innovazioni; perchè sempre una mutazione lascia lo addentellato per la edificazione dell’altra."
  "translation_ja": "もとからの君主には、人々の反感を買う理由も必要も少ない。だから余計に愛されるはずだ。並外れた悪癖のために憎まれるのでなければ、家臣や領民から自然に好意を寄せられるのが道理である。支配が古くから途切れず続いていれば、かつての変革の記憶も、変革を促す事情も消えている。変革というのは、煉瓦をかみ合わせるために壁の端を突き出しておくように、いつも次の変革が取りつく足場を残すものだからである。"
  "translation_status": "reviewed"
- "id": "pr-03-001"
  "section_id": "pr-sec-03"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 1
  "source_text": "CAPITOLO III. De’ principati misti."
  "translation_ja": "第三章　複合的な君主国について"
  "translation_status": "reviewed"
- "id": "pr-03-002"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 2
  "source_text": "Ma nel Principato nuovo consistono le difficultà. E prima se non è tutto nuovo, ma come membro, che si può chiamare tutto insieme quasi misto, le variazioni sue nascono in prima da una natural difficultà, quale è in tutti i Principati nuovi; perchè gli uomini mutano volentieri Signore, credendo migliorare; e questa credenza gli fa pigliar l’arme contro a chi regge; di che s’ingannano, perchè veggono poi per esperienza aver peggiorato."
  "translation_ja": "難しさは、新しく得た君主国にある。まず、まったく新しい国ではなく、もとの国に一部が加わり、全体としていわば複合的な国となった場合を考えよう。そこに変転が生じる第一の原因は、新しい君主国すべてに共通する、人の本性に根ざした難しさである。人は今よりよくなると思い、喜んで主人を取り替える。その思いから現に治めている者に武器を取って立ち向かう。だが、いざ暮らしてみると前より悪くなったと知る。見込み違いだったのだ。"
  "translation_status": "reviewed"
- "id": "pr-03-003"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 3
  "source_text": "Il che dipende da un’altra necessità naturale ed ordinaria, quale fa che sempre bisogni offendere quelli, di chi si diventa nuovo Principe; e con gente d’arme, e con infinite altre ingiurie che si tira dietro il nuovo acquisto."
  "translation_ja": "これには、もう一つ自然でありふれた事情が働いている。他国の新しい君主となる者は、軍隊を入れるだけでも住民に迷惑をかけるし、そのほかにも、新しい領地の獲得には限りない不利益がついて回るのである。"
  "translation_status": "reviewed"
- "id": "pr-03-004"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 4
  "source_text": "Dimodochè ti trovi avere inimici tutti quelli che tu hai offesi in occupare quel Principato; e non ti puoi mantenere amici quelli, che vi ti hanno messo, per non gli potere satisfare in quel modo che si erano presupposto, e per non potere tu usare contra di loro medicine forti, essendo loro obbligato; perchè sempre, ancorchè uno sia fortissimo in su gli eserciti, ha bisogno del favore de’ provinciali ad entrare in una provincia."
  "translation_ja": "こうして、君主国を占領する過程で損害を与えた相手は、ことごとく敵に回る。しかも自分を迎え入れた者たちでさえ、いつまでも味方にはしておけない。彼らが思い描いていたほどには報いてやれず、恩義のある相手だから、厳しい手も打てないからだ。どれほど強い軍を持っていても、よその土地に入り込むには、その土地の人の好意がいる。"
  "translation_status": "reviewed"
- "id": "pr-03-005"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 5
  "source_text": "Per queste ragioni Luigi XII Re di Francia occupò subito Milano, e subito lo perdè, e bastarono a toglierlo la prima volta le forze proprie di Lodovico; perchè quelli popoli, che gli avevano aperte le porte, trovandosi ingannati della opinione loro, e di quel futuro bene che si aveano presupposto, non potevano sopportare fastidi del nuovo Principe."
  "translation_ja": "こうした理由で、フランス王ルイ十二世はミラノをあっという間に占領し、またあっという間に失った。最初に取り返すのには、ルドヴィーコ自身の力だけで足りた。市門を開けてフランス王を迎え入れた人々は、当てが外れ、期待した幸福も来ないと分かると、新しい君主がもたらす厄介事に我慢ができなかった。"
  "translation_status": "reviewed"
- "id": "pr-03-006"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 6
  "source_text": null
  "translation_ja": "一度背いた土地も、二度目に取り戻したあとは簡単には失われない、というのもまた事実である。反乱をきっかけに君主の態度が変わるからだ。〔強制的な支配を固める具体策は非収録。〕"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "原文の一部を非収録：反乱後の強制的な支配手順"
- "id": "pr-03-007"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 7
  "source_text": "In modo che se a far perdere Milano a Francia bastò la prima volta un Duca Lodovico, che romoreggiasse in su’ confini, a farlo dipoi perdere la seconda, gli bisognò avere contro il mondo tutto, e che gli eserciti suoi fossero spenti, e cacciati d’Italia; il che nacque dalle cagioni sopraddette. Nondimeno e la prima e la seconda volta gli fu tolto."
  "translation_ja": "そのため、初めにフランスからミラノを奪うには、公ルドヴィーコが国境辺りで騒ぎを起こすだけで足りたが、二度目に失わせるには、世界中がフランスの敵に回り、その軍隊が打ち破られ、イタリアから追われるところまで行かねばならなかった。違いを生んだのは先に挙げた理由である。それでも、一度目も二度目も、ミラノを奪われたことに変わりはない。"
  "translation_status": "reviewed"
- "id": "pr-03-008"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 8
  "source_text": "Le cagioni universali della prima si sono discorse; resta ora a vedere quelle della seconda, e dire che remedii egli aveva, e quali può avere uno che fusse ne’ termini suoi, per potersi meglio mantenere nello acquistato, che non fece il Re di Francia. Dico pertanto, che questi Stati, i quali acquistandosi si aggiungono a uno Stato antico di quello che gli acquista, o sono della medesima provincia e della medesima lingua, o non sono."
  "translation_ja": "一度目に働いた一般的な理由はすでに論じた。では二度目には何が働いたのか。ルイにどんな選択肢があり、同じ立場の人にどんな手があれば、フランス王よりもうまく新領土を保てるのか。まず、取得者の旧領に加わる国は、同じ地方に属し同じ言葉を話す場合と、そうでない場合とに分かれる。"
  "translation_status": "reviewed"
- "id": "pr-03-009"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 9
  "source_text": null
  "translation_ja": "同じ地方、同じ言葉なら、国を保つのはたいへんたやすい。とくに住民が自由な国での暮らしに慣れていない場合はそうだ。〔旧支配家の排除を求める箇所は非収録。〕ほかのことは従来どおりで、習慣も変わらなければ、人々は平穏に暮らす。長らくフランスに属してきたブルゴーニュ、ブルターニュ、ガスコーニュ、ノルマンディーがそうであった。言葉が少し違っても、習慣が似ていれば、互いに無理なくやっていける。著者が重く見るもう一つの条件は、現地の法律も租税も変えないことである。そうすれば新旧の君主国はごく短いあいだに一つの体になる。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "原文の一部を非収録：旧支配家の排除を政策化する箇所"
- "id": "pr-03-010"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 10
  "source_text": "Ma quando si acquistano Stati in una provincia disforme di lingua, di costumi, e di ordini, qui sono le difficultà, e qui bisogna avere gran fortuna, e grande industria a tenergli; ed uno de’ maggiori rimedii e più vivi sarebbe, che la persona di chi gli acquista vi andasse ad abitare."
  "translation_ja": "だが、言葉も習慣も制度も違う地方に領国を得たなら、そこにこそ難しさがある。保つにはたいへんな運と手腕がいる。最も有力で効果のある方策の一つは、獲得した本人がそこへ移り住むことだろう。"
  "translation_status": "reviewed"
- "id": "pr-03-011"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 11
  "source_text": "Questo farebbe più sicura e più durabile quella possessione, come ha fatto il Turco di Grecia, il quale con tutti gli altri ordini osservati da lui per tenere quello Stato, se non vi fusse ito ad abitare, non era possibile, che lo tenesse. Perchè standovi, si veggono nascere i disordini, e presto vi si può rimediare; non vi stando, s’intendono quando sono grandi, e non vi è più rimedio."
  "translation_ja": "そうすれば支配は安定し、長く続く。ギリシアでトルコの君主がしたことがそうである。その国を治めるためほかにどんな制度を整えていても、自ら住もうとしなかったなら保てはしなかったろう。その場にあれば混乱の芽が出る時点で気づき、すぐにも手が打てる。そこにいなければ大事になってから知らせが届き、もう手の打ちようがない。"
  "translation_status": "reviewed"
- "id": "pr-03-012"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_III&oldid=3702251"
    "source_sequence": 12
  "source_text": "Non è oltre a questo la provincia spogliata da’ tuoi ufiziali; satisfannosi i sudditi del ricorso propinquo al Principe, donde hanno più cagione di amarlo, volendo essere buoni, e volendo essere altrimente, di temerlo. Chi degli esterni volesse assaltare quello Stato, vi ha più rispetto; tantochè abitandovi lo può con grandissima difficultà perdere."
  "translation_ja": "それに、現地が自分の役人たちに食い物にされることもない。臣民はすぐ近くの君主にじかに訴えられることに満足する。そのため、善良な臣民であろうとする者には君主を愛する理由が増し、そうでない者には恐れる理由が増す。外からこの国に手を出そうとする者も以前より慎重になる。こうして、君主がそこに住んでいれば、よほどのことがなければ国を失わない。"
  "translation_status": "reviewed"
- "id": "pr-03-013"
  "section_id": "pr-sec-03"
  "kind": "paragraph"
  "origin": "source"

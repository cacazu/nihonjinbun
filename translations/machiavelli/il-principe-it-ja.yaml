    "source_sequence": 16
  "source_text": null
  "translation_ja": "この殺害のあと、都市の最高政務官たちは恐怖に駆られて従い、新しい政府を立てざるをえなくなった。オリヴェロットはみずからその君主に収まった。〔武力で政務官を威圧した具体策は非収録。〕"
  "translation_status": "partial"

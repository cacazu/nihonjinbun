  "translation_ja": "しかし他人の下にいるのは奴僕のすることだと感じ、祖国の自由より隷属を好むフェルモの一部の市民とヴィテッリ一門の支持を受け、フェルモを奪おうとした。〔叔父への手紙を利用した襲撃計画の偽装は非収録。〕"

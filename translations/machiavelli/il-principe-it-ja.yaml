    "status": "open"
    "message_ja": "段落原文を非収録：反対派への加害を組織する助言。政治的論旨・歴史上の帰結のみを記載。"
- "id": "pr-08-022"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 22
  "source_text": "E deve sopra tutto un Principe vivere con li suoi sudditi in modo che nessuno accidente, o di male, o di bene, lo abbia a far variare; perchè, venendo per li tempi avversi la necessità, tu non sei a tempo al male; ed il bene che tu fai, non ti giova, perchè è giudicato forzato, e non grado alcuno ne riporti."
  "translation_ja": "何より君主は、よいことがあっても悪いことがあっても、芯を変えずにすむよう、臣民との日々の関係を築くべきである。逆境に迫られてからでは、害を加えようにも時機を失している。よいことをしても、人に強いられてしたと見なされ、感謝もされず、役にも立たない。"
  "translation_status": "reviewed"
- "id": "pr-09-001"
  "section_id": "pr-sec-09"
  "kind": "heading"
  "origin": "source"

    "source_sequence": 18
  "source_text": "Pigli adunque la illustre Casa Vostra questo assunto con quello animo, e con quelle speranze che si pigliano l’imprese giuste, acciocchè sotto la sua insegna questa patria ne sia nobilitata, e sotto i suoi auspicii si verifichi quel detto del Petrarca:"
  "translation_ja": "それゆえ貴家には、正しい事業を引き受けるときの気概と希望とをもって、この務めをお取りいただきたいのです。貴家の旗のもとで祖国が名誉を得、貴家の采配のもとでペトラルカのあの言葉が真実となりますように。"
  "translation_status": "reviewed"

- "id": "pr-19-034"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 34
  "source_text": "Chi esaminerà adunque tritamente le azioni di costui, lo troverà un ferocissimo lione e un’astutissima volpe, e vedrà quello temuto e riverito da ciascuno, e dagli eserciti non odiato; e non si maraviglierà se lui, uomo nuovo, arà possuto tenere tanto Imperio, perchè la sua grandissima riputazione lo difese sempre da quell’odio che i popoli per le sue rapine avevano potuto concipere."
  "translation_ja": "この行いをつぶさに調べれば、きわめて猛々しい獅子と、きわめて抜け目のない狐とをそこに認めるだろう。誰からも恐れ敬われ、しかも軍には憎まれなかった。新参者の彼がこれだけの帝国を保てたことも不思議ではない。収奪によって民が抱きえた憎しみから、非常に高い威信がつねに彼を守ったのだ。"
  "translation_status": "reviewed"
- "id": "pr-19-035"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 35
  "source_text": "Ma Antonino suo figliuolo fu ancor lui uomo eccellentissimo, ed aveva in sè parti eccellentissime, che lo facevano ammirabile nel cospetto de’ popoli, e grato a’ soldati, perchè era uomo militare, sopportantissimo di ogni fatica, disprezzatore di ogni cibo delicato, e di ogni altra mollizie; la qual cosa lo faceva amare da tutti gli eserciti."
  "translation_ja": "息子のアントニヌスもまた、並々ならぬ人物で、まことに優れた資質があり、そのため民には驚嘆され、兵には好かれた。軍人肌でどんな苦労にも耐え、ごちそうや、そのほかのいっさいのぜいたくを軽んじた。このため全軍から愛された。"
  "translation_status": "reviewed"
- "id": "pr-19-036"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 36
  "source_text": "Nondimeno la sua ferocia e crudeltà fu tanta e sì inaudita, per avere dopo molte occisioni particulari morto gran parte del Popolo di Roma, e tutto quello d’Alessandria, che diventò odiosissimo a tutto il mondo, e cominciò ad esser temuto da quelli ancora che egli aveva intorno, in modo che fu ammazzato da un centurione in mezzo del suo esercito."
  "translation_ja": "だがその激しさと残酷さは前代未聞だった。個々の人を数多く殺したのち、ローマの民の大部分を、アレクサンドリアでは民のすべてを殺したため、世の誰からもひどく憎まれ、側近にまで恐れられ始めた。その末に自分の軍のただなかで、一人の百人隊長に殺されたのである。"
  "translation_status": "reviewed"
- "id": "pr-19-037"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 37
  "source_text": "Dove è da notare che queste simili morti, le quali seguitano per deliberazione di un animo deliberato e ostinato, non si possono da’ Principi evitare, perchè ciascuno che non si curi di morire, lo può fare; ma deve bene il Principe temerne meno, perchè le sono rarissime."
  "translation_ja": "この種の死は、一人の人間の固い決意と執念から生じるので、君主にも確実に避けようはない。自分が死ぬことを意に介さぬ者には可能だからだ。ただしきわめてまれなので、君主はそれほど恐れる必要もない。"
  "translation_status": "reviewed"
- "id": "pr-19-038"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 38
  "source_text": "Deve solo guardarsi di non fare ingiuria grave ad alcuno di coloro, de’ quali si serve, e che egli ha d’intorno al servizio del suo Principato, come aveva fatto Antonino, il quale aveva morto contumeliosamente un fratello di quel centurione, e lui ogni giorno minacciava, e nientedimeno lo teneva a guardia del suo corpo: il che era partito temerario, e da rovinarvi, come gl’intervenne."
  "translation_ja": "ただ、自分が用い、身近に置いて国の仕事をさせる者に、大きな侮辱を与えないよう用心すべきである。アントニヌスはその隊長の兄弟を辱めて殺し、隊長本人も日ごとに脅しながら、なおも身辺警護に置いた。それは向こう見ずで、破滅を招く措置であり、実際そうなった。"
  "translation_status": "reviewed"
- "id": "pr-19-039"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 39
  "source_text": "Ma vegniamo a Commodo, al quale era facilità grande tenere l’Imperio, per averlo ereditario, essendo figliuolo di Marco; e solo gli bastava seguire le vestigia del padre, ed a’ populi e a’ soldati arebbe satisfatto; ma essendo di animo crudele e bestiale, per potere usare la sua rapacità ne’ populi, si volse ad intrattenere gli eserciti, e fargli licenziosi; dall’altra parte non tenendo la sua dignità, descendendo spesso nelli teatri a combattere con i gladiatori, e facendo altre cose vilissime, e poco degne della Maiestà Imperiale, diventò vile nel cospetto de’ soldati; ed essendo odiato da una parte, e dall’altra disprezzato, fu conspirato contro di lui e morto."
  "translation_ja": "さてコンモドゥスは、マルクスの息子として帝位を継いだため、地位を保つことはいたって容易だった。父の足跡をたどりさえすれば民も兵も満足したはずだ。だが心が残酷で獣のようだったため、民に向けて欲を満たせるよう軍にこび、規律を緩めた。他方、威厳を保たず、しばしば劇場に下りて剣闘士と戦うなど、帝権の尊厳にふさわしくない卑しいことを行い、兵の目にも卑しく映った。こうして一方に憎まれ、他方に軽蔑され、陰謀を企てられて殺された。"
  "translation_status": "reviewed"
- "id": "pr-19-040"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 40
  "source_text": "Restaci a narrare le qualità di Massimino."
  "translation_ja": "あとはマクシミヌスの人となりを語ろう。"
  "translation_status": "reviewed"
- "id": "pr-19-041"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 41
  "source_text": "Costui fu uomo bellicosissimo; ed essendo gli eserciti infastiditi dalla mollizie di Alessandro, del quale ho di sopra discorso, morto lui, lo elessero all'Imperio, il quale non molto tempo possedette, perchè due cose lo fecero odioso e disprezzato: l’una esser lui vilissimo per aver guardate le pecore in Tracia (la qual cosa era per tutto notissima, e gli faceva una gran dedignazione nel cospetto di ciascuno); l’altra, perchè avendo, nell'ingresso del suo Principato, differito l'andare a Roma, ed entrare nella possessione della sedia Imperiale, aveva dato opinione di crudelissimo, avendo per li suoi prefetti in Roma, e in qualunque luogo dell'Imperio esercitato molte crudeltà; a talchè commosso tutto il mondo dallo sdegno per la viltà del suo sangue, e dall'altra parte dallo odio per la paura della sua ferocia, prima l'Affrica, dipoi il Senato con tutto il Popolo di Roma, e tutta l'Italia gli cospirò contro; al che si aggiunse il suo proprio esercito, il quale campeggiando Aquileia, e trovando difficultà nell'espugnazione, infastidito della crudeltà sua, e, per vedergli tanti nimici, temendolo meno, lo ammazzò."
  "translation_ja": "彼は極めて好戦的だった。先に述べたアレクサンデルの軟弱さにうんざりしていた軍は、その死後、彼を皇帝に選んだ。だが二つの事情から憎まれ軽蔑され、帝位を長く保てなかった。一つはトラキアで羊を飼っていたという、誰もが知る卑しい出自で、皆の反感を引いたこと。もう一つは、即位の初めローマに行って帝座を占めるのを延ばす一方、ローマをはじめ帝国各地で長官たちを通じて数々の残虐を行い、残酷きわまりないとの評判を得たことである。低い家柄を軽んじる憤りと、恐ろしい性質を恐れる憎しみとが世界を動かし、まずアフリカが、次に元老院とローマの全市民、さらにはイタリア全土が彼に背いた。自分の軍もそれに加わった。アクイレイア包囲が難航するうち、その残酷さに嫌気がさし、敵が増えたのを見て以前ほど恐れなくなり、彼を殺した。"
  "translation_status": "reviewed"
- "id": "pr-19-042"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 42
  "source_text": "Io non voglio ragionare nè di Eliogabalo, nè di Macrino, nè di Iuliano, i quali, per essere al tutto vili, si spensero subito; ma verrò alla conclusione di questo discorso; e dico, che li Principi de’ nostri tempi hanno meno questa difficultà di satisfare straordinariamente a’ soldati ne’ governi loro, perchè nonostante che si abbi ad avere a quelli qualche considerazione, pure si risolve presto, per non avere alcuno di questi Principi eserciti insieme, che sieno inveterati con li governi ed amministrazioni delle provincie, come erano gli eserciti dell'Imperio Romano; e però se allora era necessario sodisfare a’ soldati, più che a’ popoli, era perchè i soldati potevano più, che i popoli; ora è più necessario a tutti i Principi, eccetto che al Turco ed al Soldano, satisfare a’ popoli, che a’ soldati, perchè i popoli possono più, che quelli."
  "translation_ja": "エラガバルス、マクリヌス、ユリアヌスについては論じまい。まるきり卑小でたちまち消えた人々だからだ。結論に移ろう。現代の君主には、統治にあたってこれほど特別に兵を満足させる難しさは少ない。兵への配慮は多少必要だが、問題はすぐ片づく。ローマ帝国の軍のように、集合した軍が属州の行政と統治に根を張って久しいという君主はいないからである。当時、民より兵を満足させる必要があったのは、民より兵の力が強かったためだ。いまはトルコの君主とエジプトのスルタンを除くすべての君主にとって、兵より民を満足させる必要がある。民のほうが力があるからだ。"
  "translation_status": "reviewed"
- "id": "pr-19-043"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 43
  "source_text": "Di che io ne eccettuo il Turco, tenendo sempre quello intorno dodicimila fanti e quindicimila cavalli, da’ quali dipende la sicurtà e la fortezza del suo Regno; ed è necessario che posposto ogni altro rispetto de' popoli, se gli mantenga amici. Simile è il Regno del Soldano, quale essendo tutto in mano de’ soldati, conviene che ancora lui, senza respetto de’ popoli, se gli mantenga amici."
  "translation_ja": "トルコの君主を例外とするのは、彼が常時、歩兵一万二千と騎兵一万五千を周囲に置き、王国の安全と強さがその兵にかかっているからである。民へのほかの配慮に先んじて兵を味方に保つ必要がある。スルタンの王国も同様で、全体が兵士の手にあるから、スルタンも民のことはさておき、兵の友でいるほかない。"
  "translation_status": "reviewed"
- "id": "pr-19-044"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 44
  "source_text": "Ed avete a notare, che questo Stato del Soldano è disforme da tutti gli altri Principati; perchè egli è simile al Pontificato Cristiano, il quale non si può chiamare nè Principato ereditario, nè Principato nuovo; perchè non i figliuoli del Principe morto rimangono eredi e signori, ma colui che è eletto a quel grado da coloro che ne hanno autorità."
  "translation_ja": "ここで注意してほしい。スルタンの国は、ほかのすべての君主国とは違う。キリスト教世界の教皇権に似て、世襲の君主国とも新しい君主国とも呼べない。死んだ君主の子が相続人や主君となるのではなく、その権限を持つ人々に選ばれた者が次の位に就くからだ。"
  "translation_status": "reviewed"
- "id": "pr-19-045"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 45
  "source_text": "Ed essendo questo ordine anticato, non si può chiamare Principato nuovo; perchè in quello non sono alcune di quelle difficultà che sono ne’ nuovi; perchè sebbene il Principe è nuovo, gli ordini di quello Stato sono vecchi, e ordinati a riceverlo come se fusse loro signore ereditario."
  "translation_ja": "この制度は古くから続いているから、新しい君主国とは呼べない。そこには新たな君主国特有の困難が一つもない。君主は新しいが、制度は古く、世襲の主君であるかのように彼を迎える仕組みが整っているからである。"
  "translation_status": "reviewed"
- "id": "pr-19-046"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 46
  "source_text": "Ma, tornando alla materia nostra, dico, che qualunque considererà al sopraddetto discorso, vedrà o l’odio, o il dispregio essere stato causa della rovina di quelli Imperadori prenominati, e cognoscerà ancora donde nacque, che parte di loro procedendo in uno modo, e parte al contrario, in qualunque di quelli uno ebbe felice, e gli altri infelice fine; perchè a Pertinace ed Alessandro, per essere Principi nuovi, fu inutile e dannoso il volere imitare Marco, che era nel Principato ereditario; e similmente a Caracalla, Commodo e Massimino essere stata cosa perniziosa imitar Severo, per non avere avuto tanta virtù che bastasse a seguitare le vestigia sue."
  "translation_ja": "本題に戻ろう。ここまでの議論を考える人には、先に挙げた皇帝たちを滅ぼしたのは憎しみか軽蔑だったとわかるはずだ。ある人々は一つの仕方で、別の人々は正反対の仕方で振る舞い、しかもどちらにも一人の成功者とほかの不幸な人々が出た理由もわかる。新しい君主だったペルティナクスとアレクサンデルにとって、世襲の地位にいたマルクスをまねるのは無益で有害だった。カラカラ、コンモドゥス、マクシミヌスがセウェルスをまねたのも破滅を招いた。彼の跡をたどれるほどの力量が彼らにはなかったからだ。"
  "translation_status": "reviewed"
- "id": "pr-19-047"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 47
  "source_text": "Pertanto un Principe nuovo in un Principato non può imitare le azioni di Marco, nè ancora è necessario imitare quelle di Severo; ma deve pigliare di Severo quelle parti che per fondare il suo Stato sono necessarie, e da Marco quelle che sono convenienti e gloriose a conservare uno Stato, che sia di già stabilito e fermo."
  "translation_ja": "だから新しい国の君主はマルクスの行いをそのまままねることはできず、セウェルスの行いをそのまままねる必要もない。国の基礎を築くために必要なものをセウェルスから取り、すでに安定した国を保つのにふさわしく名誉あるものをマルクスから取るべきなのである。"
  "translation_status": "reviewed"
- "id": "pr-20-001"
  "section_id": "pr-sec-20"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 1
  "source_text": "CAPITOLO XX. Se le fortezze, e molte altre cose che spesse volte i Principi fanno, sono utili o dannose."
  "translation_ja": "第二十章　要塞や、そのほか君主がよく行うことは、有益か有害か"
  "translation_status": "reviewed"
- "id": "pr-20-002"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 2
  "source_text": "Alcuni Principi, per tenere sicuramente lo Stato, hanno disarmato i loro sudditi; alcuni altri hanno tenuto divise in parti le terre suggette; alcuni altri hanno nutrito nimicizie contro a sè medesimi; alcuni altri si sono volti a guadagnarsi quelli che gli erano sospetti nel principio del suo Stato; alcuni hanno edificato fortezze; alcuni le hanno rovinate e distrutte."
  "translation_ja": "国を確実に保つため、臣民を武装解除した君主もいる。領下の都市を派閥に分けた君主もいる。自分に敵対する者を育てた人、即位のはじめには疑わしかった人の心を獲得しようとした人もいる。要塞を造った人もいれば、取り壊してなくした人もいる。"
  "translation_status": "reviewed"
- "id": "pr-20-003"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 3
  "source_text": "E benchè di tutte queste cose non si possa dare determinata sentenzia, se non si viene su’ particulari di questi Stati, dove si avesse da pigliare alcuna simile deliberazione; nondimeno io parlerò in quel modo largo che la materia per sè medesima sopporta."
  "translation_ja": "こうした決断がなされた個々の国の事情に踏み込まなければ、どれにも定まった判決は下せない。それでも問題そのものが許す範囲で、できるだけ広く論じよう。"
  "translation_status": "reviewed"
- "id": "pr-20-004"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 4
  "source_text": "Non fu mai adunque che un Principe nuovo disarmasse i suoi sudditi; anzi, quando gli ha trovati disarmati, gli ha sempre armati; perchè armandosi, quelle arme diventano tue; diventano fedeli quelli che ti sono sospetti; e quelli che erano fedeli, si mantengono; e gli sudditi tuoi si fanno tuoi partigiani."
  "translation_ja": "新たに立った君主が自分の臣民を武装解除したためしはない。むしろ武装していなければ、いつも君主のほうから武装させた。彼らの武器はあなたの武器となり、疑っていた者は忠実になり、すでに忠実な者はそのままで、あなたの臣民があなたの支持者になるからだ。"
  "translation_status": "reviewed"
- "id": "pr-20-005"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 5
  "source_text": "E perchè tutti i sudditi non si possono armare, quando si benefichino quelli che tu armi, con gli altri si può fare più sicurtà; e quella diversità del procedere che conoscono in loro, gli fa tuoi obbligati; quelli altri ti scusano, giudicando esser necessario quelli aver più merito che hanno più pericolo e più obbligo."
  "translation_ja": "臣民すべてを武装させることはできないが、武装させた人を厚遇すれば、ほかの人々に対してもより安心できる。扱いの違いに気づいた当人はあなたに恩義を感じ、ほかの人々も、危険と負担が大きい者のほうが多く報われて当然だと考え、納得してくれる。"
  "translation_status": "reviewed"
- "id": "pr-20-006"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 6
  "source_text": "Ma quando tu gli disarmi, tu incominci ad offendergli, e mostrare che tu abbi in loro diffidenza o per viltà, o per poca fede; e l’una e l’altra di queste opinioni concipe odio contro di te. E perchè tu non puoi stare disarmato, conviene che ti volti alla milizia mercenaria, della quale di sopra abbiam detto quale sia; e quando essa fusse buona, non può esser tanta, che ti difenda da’ nimici potenti, e da’ sudditi sospetti."
  "translation_ja": "だが武装解除すれば、それが人々を傷つける第一歩となる。臆病か、不実かのどちらかと疑っていると示すことになるからだ。どちらと思われても憎しみを生む。しかもあなた自身は丸腰でいられないので、傭兵の軍に頼らねばならない。その質はすでに述べた。仮に優秀でも、強い外敵と疑わしい臣民の両方からあなたを守れるほどにはならない。"
  "translation_status": "reviewed"
- "id": "pr-20-007"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 7
  "source_text": "Però, come io ho detto, un Principe nuovo in un nuovo Principato sempre vi ha ordinato l’arme. Di questi esempi son piene le istorie."
  "translation_ja": "だから新たな君主国に入った新たな君主は、私が言ったように、常にその地で軍を組織した。こうした例は歴史に満ちている。"
  "translation_status": "reviewed"
- "id": "pr-20-008"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 8
  "source_text": null
  "translation_ja": "これに対し、旧領の一部分として新たな国を併合した場合は別で、著者は旧領の軍に力を集中する方針を取る。〔新領の住民を武装解除して支配を固める具体的な手順は非収録。〕"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "段落原文を非収録：併合領の強制的な武装解除・権力集中の具体策。"
- "id": "pr-20-009"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 9
  "source_text": "Solevano li antichi nostri, e quelli che erano stimati savi, dire, come era necessario tenere Pistoia con le parti, e Pisa con le fortezze; e per questo nutrivano in qualche terra lor suddita le differenze per possederla più facilmente."
  "translation_ja": "われわれの父祖、とくに賢者とされた人は、ピストイアは派閥で、ピサは要塞で保てと言った。それゆえ、支配をたやすくするために、従属するいくつかの町で対立を育てていた。"
  "translation_status": "reviewed"
- "id": "pr-20-010"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 10
  "source_text": "Questo, in quelli tempi che Italia era in un certo modo bilanciata, doveva essere ben fatto; ma non mi pare si possa dare oggi per precetto; perchè io non credo che le divisioni fatte faccino mai bene alcuno; anzi è necessario, quando il nimico si accosta, che le città divise si perdino subito; perchè sempre la parte più debole si accosterà alle forze esterne, e l’altra non potrà reggere."
  "translation_ja": "イタリアにある程度の勢力均衡があった当時は、それも適切だったに違いない。だが今日の教訓としては勧められない。人為的に設けた分裂が何かよいことを生むとは私は思わない。むしろ敵が来れば、分裂した町はたちまち失われる。弱い側は常に外の軍につき、もう一方だけでは持ちこたえられないからだ。"
  "translation_status": "reviewed"
- "id": "pr-20-011"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 11
  "source_text": "I Viniziani mossi, come io credo, dalle ragioni sopraddette, nutrivano le sette Guelfe e Ghibelline nelle città loro suddite; e benchè non gli lasciassino mai venire al sangue, pure nutrivano fra loro questi dispareri acciocchè, occupati quelli cittadini in quelle loro differenze, non si muovessero contro di loro. Il che, come si vide, non tornò poi loro a proposito; perchè, essendo rotti a Vailà, subito una parte di quelle prese ardire, e tolsono loro tutto lo Stato."
  "translation_ja": "ヴェネツィア人は、おそらく同じ考えから、支配下の町で教皇派と皇帝派を育てていた。流血には至らせなかったが、市民を互いの対立に夢中にさせ、自分たちに向かってこないようにと、不和は育てていた。だが目にしたとおり、結末は都合よくなかった。ヴァイラで負けると片方の派閥がすぐに気勢を得て、彼らから領土をことごとく奪ったのである。"
  "translation_status": "reviewed"
- "id": "pr-20-012"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 12
  "source_text": "Arguiscano pertanto simili modi debolezza del Principe; perchè in un Principato gagliardo mai si permetteranno tali divisioni; perchè le fanno solo profitto a tempo di pace, potendosi, mediante quelle, più facilmente maneggiare i sudditi; ma, venendo la guerra, mostra simile ordine la fallacia sua."
  "translation_ja": "したがって、そのようなやり方は君主の弱さを物語る。強い君主国ではそんな分裂を許さない。平時に臣民を扱いやすくする役には立っても、戦争になれば、この仕組みの頼りなさがあらわになる。"
  "translation_status": "reviewed"
- "id": "pr-20-013"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 13
  "source_text": "Sanza dubbio li Principi diventano grandi quando superano le difficultà e le opposizioni che son fatte loro; e però la fortuna, massime quando vuole far grande un Principe nuovo, il quale ha maggiore necessità di acquistare riputazione, che uno ereditario, gli fa nascere de’ nimici, e gli fa fare delle imprese contro, acciocchè quello abbia cagione di superarle, e su per quella scala, che gli hanno portata i nimici suoi, salir più alto."
  "translation_ja": "疑いなく、君主は自分に向けられた困難と反対を克服するとき大きくなる。そこで運命は、とくに世襲の君主以上に名声を築く必要のある新たな君主を大きくしようとするとき、敵を出現させ、その敵に事を起こさせる。君主がこれを克服する機会を得、敵の運んできたはしごを伝ってさらに高く上れるようにするのである。"
  "translation_status": "reviewed"
- "id": "pr-20-014"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 14
  "source_text": "E però molti giudicano che un Principe savio, quando ne abbia l'occasione, deve nutrirsi con astuzia qualche inimicizia, acciocchè, oppressa quella, ne seguiti maggiore sua grandezza. Hanno i Principi, e specialmente quelli che son nuovi, trovato più fede e più utilità in quelli uomini, che nel principio del loro Stato son tenuti sospetti, che in quelli che nel principio erano confidenti."
  "translation_ja": "そのため、分別ある君主は機会があればひそかに何らかの敵対を育て、抑えたときにさらに大きくなれるようにすべきだと判断する人も多い。君主、とくに新しい君主は、初めから信用していた者より、政権当初に疑わしいとされた者のうちに、より厚い忠誠と、より大きな役立ちを見つけてきた。"
  "translation_status": "reviewed"
- "id": "pr-20-015"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 15
  "source_text": "Pandolfo Petrucci Principe di Siena reggeva lo Stato suo più con quelli che furono sospetti, che con gli altri."
  "translation_ja": "シエナの君主パンドルフォ・ペトルッチは、ほかの人々よりも、以前に疑わしく思われた者たちに頼って国を治めていた。"
  "translation_status": "reviewed"
- "id": "pr-20-016"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 16
  "source_text": "Ma di questa cosa non si può parlare largamente, perchè ella varia secondo il subietto; solo dirò questo, che quelli uomini che nel principio di un Principato erano stati nimici, che sono di qualità che a mantenersi abbino bisogno di appoggio, sempre il Principe con facilità grandissima se li potrà guadagnare; e loro maggiormente son forzati a servirlo con fede, quanto cognoscono essere loro più necessario cancellare con l'opere quella opinione sinistra che si aveva di loro; e così il Principe ne trae sempre più utilità, che di coloro, i quali, servendolo con troppa sicurtà, trascurano le cose sue."
  "translation_ja": "ただし相手次第なので、この点は一般的に論じられない。これだけ言おう。当初は敵だった人々が、身を立てるのに後ろ盾を必要とする立場なら、君主はいつもごく容易に彼らを得られる。悪い見方を行いによって消す必要を自分でも強く知っているため、ますます忠実に仕えざるをえない。だから安心しきって君主の用向きをなおざりにする人々より、はるかに役に立つ。"
  "translation_status": "reviewed"
- "id": "pr-20-017"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 17
  "source_text": "E poichè la materia lo ricerca, non voglio lasciare indietro il ricordare a un Principe che ha preso uno Stato di nuovo, mediante i favori intrinsechi di quello, che consideri bene qual cagione abbi mosso quelli che l'hanno favorito, a favorirlo; e se ella non è affezione naturale verso di quello, ma fusse solo perchè quelli non si contentavano di quello Stato, con fatica e difficultà grande se gli potrà mantenere amici; perchè e’ fia impossibile che lui possa contentargli."
  "translation_ja": "ここで、国内の支持を受けて新たな国を手に入れた君主に思い出してもらいたい。支持した人々を何がそうさせたのか、よく考えることである。もし君主への生来の愛着ではなく、ただ以前の政権に満足していなかったからだとすれば、友のまま引きとめるのは実に難しい。彼らを満足させることは不可能だからだ。"
  "translation_status": "reviewed"
- "id": "pr-20-018"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 18
  "source_text": "E discorrendo bene con quelli esempi che dalle cose antiche e moderne si traggono la cagione di questo, vedrà esser molto più facile il guadagnarsi amici quelli uomini che dello Stato innanzi si contentavono, e però erano suoi nimici, che quelli, i quali, per non se ne contentare, gli diventarono amici, e favorironlo ad occuparlo."
  "translation_ja": "古今の例をもとにこの理由をよく考えれば、もとの政府に満足し、そのため敵であった人々を味方にするほうが、もとの政府に満足せず、味方になって国を手に入れるのを助けた人々を味方に保つよりはるかに容易だとわかるだろう。"
  "translation_status": "reviewed"
- "id": "pr-20-019"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 19
  "source_text": "È stata consuetudine de’ Principi, per poter tenere più sicuramente lo Stato loro, edificare fortezze che sieno briglia e freno di quelli che disegnassino far loro contro, ed avere un rifugio sicuro da un primo impeto. Io lodo questo modo, perchè gli è usitato anticamente. Nondimeno Messer Niccolò Vitelli ne’ tempi nostri si è visto disfare due fortezze in Città di Castello, per tener quello Stato."
  "translation_ja": "国をより確実に保つために要塞を築くのは君主たちの習わしだった。歯向かおうとする者には手綱となり、最初の衝撃に対する安全な逃げ場にもなるからだ。古来のやり方なので私はこれをよしとする。だが今日も、ニッコロ・ヴィテッリ殿がチッタ・ディ・カステッロの支配を保つため、そこの要塞を二つ取り壊したのをわれわれは見た。"
  "translation_status": "reviewed"
- "id": "pr-20-020"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 20
  "source_text": "Guid’Ubaldo Duca di Urbino, ritornato nel suo Stato, donde da Cesare Borgia era stato cacciato, rovinò da fondamenti tutte le fortezze di quella provincia; e giudicò senza quelle più difficilmente riperdere quello Stato. I Bentivogli, ritornati in Bologna, usarono simil termine. Sono adunque le fortezze utili o no, secondo li tempi; e se ti fanno bene in una parte, ti offendono in una altra. E puossi discorrere questa parte così."
  "translation_ja": "チェーザレ・ボルジアに追われたあと国に戻ったウルビーノ公グイドバルドは、その地方の要塞をすべて根本から壊した。要塞がないほうがこの国を再び失いにくいと考えたからだ。ベンティヴォーリョ家がボローニャに戻ったときも同じだった。要塞は時勢次第で役に立つことも、立たないこともある。一方で利益があれば、他方では害にもなる。こう考えてよい。"
  "translation_status": "reviewed"
- "id": "pr-20-021"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 21
  "source_text": "Quel Principe che ha più paura de’ popoli, che de’ forestieri, deve fare le fortezze; ma quello che ha più paura de’ forestieri, che de’ popoli, deve lasciarle indietro. Alla Casa Sforzesca ha fatto e farà più guerra il castello di Milano che vi edificò Francesco Sforza, che alcun altro disordine di quello Stato."
  "translation_ja": "外国勢より民衆のほうが恐ろしい君主は要塞を築くべきで、民衆より外国勢のほうが恐ろしい君主は築かずにおくべきだ。フランチェスコ・スフォルツァが築いたミラノの城は、スフォルツァ家にとって国内のどの混乱にもまして害をなし、これからも害をなすだろう。"
  "translation_status": "reviewed"
- "id": "pr-20-022"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 22
  "source_text": "Però la migliore fortezza che sia, è non essere odiato da' popoli; perchè ancora che tu abbi le fortezze, ed il popolo ti abbi in odio, le non ti salvano; perchè non mancano mai a’ popoli, preso che egli hanno l’armi, forestieri che gli soccorrino."
  "translation_ja": "だから最良の要塞は、民衆に憎まれないことである。要塞があっても民衆に憎まれれば、守ってはくれない。民がいったん武器を取れば、救援の手を差し伸べる外国人に事欠かないからだ。"
  "translation_status": "reviewed"
- "id": "pr-20-023"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 23
  "source_text": "Ne’ tempi nostri non si vede che quelle abbin fatto profitto ad alcun Principe, se non alla Contessa di Furlì quando fu morto il Conte Girolamo suo consorte; perchè, mediante quella, potè fuggire l’impeto popolare, ed aspettare il soccorso di Milano, e ricuperare lo Stato; e li tempi stavano allora in modo, che il forestiero non poteva soccorrere il popolo. Ma dipoi valsono ancor poco a lei, quando Cesare Borgia l’assaltò, e che il popolo nimico suo si congiunse col forestiero."
  "translation_ja": "今日、要塞が役に立った君主は、夫ジローラモ伯が殺されたときのフォルリ伯爵夫人しか見当たらない。要塞のおかげで民衆の突進を逃れ、ミラノの援助を待ち、領国を回復できた。当時は外国勢が民衆を救えない時勢だった。しかし後にチェーザレ・ボルジアが攻め、彼女に敵対する民が外国勢と組むと、彼女にさえ要塞はほとんど役立たなかった。"
  "translation_status": "reviewed"
- "id": "pr-20-024"
  "section_id": "pr-sec-20"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XX&oldid=3702268"
    "source_sequence": 24
  "source_text": "Pertanto ed allora, e prima, saria stato più sicuro a lei non essere odiata dal popolo, che avere le fortezze. Considerate adunque queste cose, io loderò chi farà fortezze, e chi non le farà; e biasimerò qualunque, fidandosi delle fortezze, stimerà poco l'essere odiato da’ popoli."
  "translation_ja": "したがって、そのときも前のときも、夫人には要塞を持つことより、民衆に憎まれないほうが確かな守りだったろう。以上を考え、私は要塞を築く人も、築かない人も、よしとする。ただし要塞を頼りに、民衆に憎まれることを軽く見る人は、誰であれ非難しよう。"
  "translation_status": "reviewed"
- "id": "pr-21-001"
  "section_id": "pr-sec-21"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 1
  "source_text": "CAPITOLO XXI. Come si debba governare un Principe per acquistarsi riputazione."
  "translation_ja": "第二十一章　名声を得るために君主はどう振る舞うべきか"
  "translation_status": "reviewed"
- "id": "pr-21-002"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 2
  "source_text": "Nissuna cosa fa tanto stimare un Principe, quanto fanno le grandi imprese, e il dare di sè esempi rari. Noi abbiamo nei nostri tempi Ferrando Re d'Aragona, presente Re di Spagna. Costui si può chiamare quasi Principe nuovo, perchè d'un Re debole è diventato per fama e per gloria il primo Re dei Cristiani; e se considererete le azioni sue, le troverete tutte grandissime, e qualcuna straordinaria."
  "translation_ja": "大事業をなし、自分についてめったにない実例を示すことほど、君主の評価を高めるものはない。同時代にはアラゴン王フェルナンド、いまのスペイン王がいる。いわば新しい君主と呼んでよい。弱い王から、名声と栄光においてキリスト教世界第一の王となったからだ。その行いを考えれば、すべてきわめて大きく、並外れたものさえある。"
  "translation_status": "reviewed"
- "id": "pr-21-003"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 3
  "source_text": "Egli nel principio del suo regno assaltò la Granata, e quella impresa fu il fondamento dello Stato suo. In prima ei la fece ozioso, e senza sospetto di essere impedito; tenne occupati in quella gli animi de’ Baroni di Castiglia, li quali pensando a quella guerra non pensavano ad innovare; e lui acquistava in questo mezzo riputazione ed imperio sopra di loro, che non se ne accorgevano."
  "translation_ja": "治世の初めにグラナダを攻めた。この事業が王権の土台となった。初めはほかに煩わされず、妨げられる心配もなく行えた。この戦争にカスティーリャの諸侯の心を引きつけたので、彼らは戦を思うばかりで変革など考えなかった。そのあいだに王は彼らが気づかぬうちに、彼らに対する威信と支配権を手に入れた。"
  "translation_status": "reviewed"
- "id": "pr-21-004"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 4
  "source_text": "Potè nutrire, con danari della Chiesa e de’ popoli, gli eserciti, e fare un fondamento con quella guerra lunga alla milizia, la quale dipoi lo ha onorato. Oltra questo, per potere intraprender maggiori imprese, servendosi sempre della Religione, si volse a una pietosa crudeltà, cacciando e spogliando il suo Regno de’ Marrani; nè può essere questo esempio più mirabile, nè più raro."
  "translation_ja": "教会と民衆の金で軍を養い、長い戦争によって、後に自分に名誉をもたらす軍隊の土台を築けた。さらに大きな事業を企てるため、いつも宗教を利用し、ある「敬虔なる残酷さ」に転じた。マラーノと呼ばれた人々を追放し、王国から一掃したのだ。これほど驚くべき、類のない例はない。"
  "translation_status": "reviewed"
- "id": "pr-21-005"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 5
  "source_text": "Assaltò sotto questo medesimo mantello l’Affrica, fece l’impresa d’Italia, ha ultimamente assaltato la Francia, e così sempre ordito cose grande, le quali sempre hanno tenuto sospesi ed ammirati gli animi de’ sudditi, ed occupati nell’evento di esse. E sono nate queste sue azioni in modo l’una dall’altra, che non hanno dato mai spazio agli uomini di quietare ed operargli contro."
  "translation_ja": "同じ覆いの下でアフリカを攻め、イタリアでも事業を行い、最近はフランスを攻めた。つねに大事業を織り上げ、臣民の心を宙に浮かせて感嘆させ、結果を見守ることに夢中にさせた。その行いは一つから次が生まれ、人々には落ち着いて王に逆らう余裕がなかった。"
  "translation_status": "reviewed"
- "id": "pr-21-006"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 6
  "source_text": "Giova ancora assai a un Principe dare di sè esempi rari circa il governo di dentro, simili a quelli che si narrano di Messer Bernabò di Milano, quando si ha l’occasione di qualcuno che operi qualche cosa straordinaria o in bene o in male nella vita civile, e trovare un modo circa il premiarlo o punirlo, di che s’abbi a parlare assai. E soprattutto un Principe si debbe ingegnare dare di sè in ogni sua azione fama di grande ed eccellente."
  "translation_ja": "国内政治でもめったにない実例を示すことは君主に大いに役立つ。ミラノのベルナボ殿について語られるように、市民生活で誰かが善につけ悪につけ並外れた行いをしたとき、いつまでも話の種になるような報い方、罰し方を見つけるのである。なにより君主は、どの行動でも偉大で優れた人という名が立つよう努めるべきだ。"
  "translation_status": "reviewed"
- "id": "pr-21-007"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 7
  "source_text": "È ancora stimato un Principe quando egli è vero amico, o vero nimico, cioè quando senza alcun rispetto si scuopre in favore di alcuno contro un altro; il qual partito fia sempre più utile, che star neutrale; perchè se duoi potenti tuoi vicini vengono alle mani, o essi sono di qualità che vincendo un di quelli tu abbi da temere del vincitore, o no."
  "translation_ja": "また君主は、本物の友か、本物の敵であるときに重んじられる。遠慮なく一方の味方に立ち、他方に対する立場を明らかにするときである。この選択は常に中立でいるより有用である。近隣の二つの強国が争うなら、どちらかが勝ったあと勝者を恐れねばならない場合と、恐れないですむ場合がある。"
  "translation_status": "reviewed"
- "id": "pr-21-008"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 8
  "source_text": "In qualunque di questi duoi casi ti sarà sempre più utile lo scuoprirti, e far buona guerra; perchè nel primo caso se tu non ti scuopri sarai sempre preda di chi vince con piacere e satisfazione di colui che è stato vinto, e non arai ragione nè cosa alcuna che ti difenda, nè chi ti riceva. Perchè chi vince non vuole amici sospetti, e che nelle avversità non l'aiutino; chi perde non ti riceve, per non aver tu voluto con l'armi in mano correre la fortuna sua."
  "translation_ja": "いずれにせよ態度を明らかにし、しっかり戦うほうがいつもよい。第一の場合、立場を示さなければ、敗者が喜び、満足するなかで、必ず勝者の獲物となる。身を守る理屈も手立てもなく、受け入れてくれる人もいない。勝者は疑わしく逆境に助けてくれない友を望まない。敗者は、武器を取ってその運命を分かとうとしなかったあなたを受け入れない。"
  "translation_status": "reviewed"
- "id": "pr-21-009"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 9
  "source_text": "Era passato Antioco in Grecia, messovi dagli Etoli per cacciarne i Romani. Mandò Antioco oratori agli Achei, che erano amici de’ Romani, a confortarli a star di mezzo; e dall'altra parte i Romani gli persuadevano a pigliare l'armi per loro."
  "translation_ja": "アンティオコスは、ローマ人を追い払おうとしたアイトリア人に招かれ、ギリシアに渡った。ローマの友であったアカイア人のもとに使節を送り、中立を勧めた。一方ローマは、自分たちのために武器を取るよう説いた。"
  "translation_status": "reviewed"
- "id": "pr-21-010"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 10
  "source_text": "Venne questa cosa a deliberarsi nel concilio degli Achei, dove il legato d'Antioco gli persuadeva a stare neutrali; a che il legato Romano rispose: Quanto alla parte, che si dice essere ottimo ed utilissimo allo Stato vostro il non v'intromettere nella guerra nostra, niente vi è più contrario; imperocchè, non vi ci intromettendo, senza grazia e senza riputazione alcuna resterete premio del vincitore."
  "translation_ja": "問題はアカイア人の評議会にはかられ、アンティオコスの使節は中立を勧めた。ローマの使節はこう答えた。「われわれの戦争に加わらないのが、あなたがたの国には最善、最も有益であるというが、真実はまったく逆である。加わらなければ、感謝も名声も得ず、勝者の賞品として残されるだけだ。」"
  "translation_status": "reviewed"
- "id": "pr-21-011"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 11
  "source_text": "E sempre interverrà, che quello che non è ti amico, ti richiederà della neutralità, e quello che ti è amico, ti ricercherà che ti scuopra con l'armi. E li Principi mal risoluti, per fuggire i presenti pericoli, seguono il più delle volte quella via neutrale, ed il più delle volte rovinano."
  "translation_ja": "いつでも友でない者はあなたに中立を求め、友である者は武器を手に立場を明らかにするよう求める。決断の鈍い君主は、目の前の危険を避けようと、多くの場合に中立を選び、多くの場合に滅びる。"
  "translation_status": "reviewed"
- "id": "pr-21-012"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 12
  "source_text": "Ma quando il Principe si scuopre gagliardamente in favore di una parte, se colui, con chi tu aderisci, vince, ancorachè sia potente e che tu rimanga a sua discrezione, egli ha teco obbligo, e vi è contratto l’amore, e gli uomini non sono mai sì disonesti, che con tanto esemplo d'ingratitudine ti opprimessero. Dipoi le vittorie non sono mai sì prospere, che il vincitore non abbia ad avere qualche rispetto; e massime alla giustizia."
  "translation_ja": "だが君主がきっぱりと片方の味方になり、その相手が勝てば、相手が強く、あなたの身がその意のままになるとしても、相手にはあなたへの義理ができ、友愛が結ばれる。人はこれほどの恩知らずの見本になってあなたを踏みつけるほど、不実ではない。それに勝利というものは、勝者がいくつかの顧慮、とりわけ正義への顧慮など持たなくてよいほど、何もかもうまくいくものでもない。"
  "translation_status": "reviewed"
- "id": "pr-21-013"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 13
  "source_text": "Ma se quello, con il quale tu aderisci, perde, tu siei ricevuto da lui; e, mentre che può, ti aiuta, e diventi compagno di una fortuna che può risurgere. Nel secondo caso quando quelli che combattono insieme sono di qualità, che tu non abbia da temere di quello che vince, tantopiù è gran prudenza lo aderire; perchè tu vai alla rovina d’uno con l'aiuto di chi lo dovrrebbe salvare, se fusse savio, e vincendo rimane alla tua discrezione, ed è impossibile con l'aiuto tuo non vinca."
  "translation_ja": "組んだ側が負けたなら、その側があなたを受け入れ、力のあるかぎり助けてくれる。あなたは、また浮かび上がるかもしれない運命の仲間となる。第二の場合、勝者を恐れる必要がないなら、いずれかに加わるのがいっそう賢明だ。相手が賢ければ本来救うはずの者を、その相手の助けで倒せる。勝った者はあなたの意のままとなり、あなたの助けがあれば勝てないはずがない。"
  "translation_status": "reviewed"
- "id": "pr-21-014"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 14
  "source_text": "E qui è da notare, che un Principe deve avvertire non far mai compagnia con uno più potente di sè per offendere altri, se non quando la necessità lo strigne, come di sopra si dice; perchè, vincendo lui, tu rimani a sua discrezione, e li Principi debbono fuggire quanto possono lo stare a discrezione d'altri. I Viniziani si accompagnarono con Francia contro al Duca di Milano, e potevano fuggire di non fare quella compagnia; di che ne risultò la rovina loro."
  "translation_ja": "ここで心に留めるべきなのは、君主がほかの相手を攻めるため、自分より強い者と組むのは、必要に迫られた場合のほかは避けるべきだ、ということである。勝てば、その強者の掌中に残される。君主は他人の意のままとなるのをできるだけ避けるべきだ。ヴェネツィア人は組まずにもすんだのに、ミラノ公に対してフランスと組み、その結果、自分たちの破滅を招いた。"
  "translation_status": "reviewed"
- "id": "pr-21-015"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 15
  "source_text": "Ma quando non si può fuggirla, come intervenne a’ Fiorentini quando il Papa e Spagna andarono con gli eserciti ad assaltare la Lombardia, allora vi deve il Principe aderire per le sopradette ragioni."
  "translation_ja": "だが組まずにすまない場合、たとえば教皇とスペインが軍を率いてロンバルディアを攻めに行ったときのフィレンツェ人の場合には、すでに挙げた理由から、君主は同盟に加わらなければならない。"
  "translation_status": "reviewed"
- "id": "pr-21-016"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 16
  "source_text": "Nè creda mai alcuno Stato poter pigliare partiti sicuri; anzi pensi d'avere a prenderli tutti dubbi; perchè si trova questo nell’ordine delle cose, che mai si cerca fuggire uno inconveniente, che non s'incorra in un altro: ma la prudenza consiste in saper cognoscere la qualità degli inconvenienti, e prendere il manco tristo per buono."
  "translation_ja": "いかなる国も、危険のない選択ができるとは思わないほうがよい。むしろ、どの選択も不確かなのだと思うことである。一つの不都合を逃れようとしても、別の不都合にぶつからずにはすまないのが世の成り行きだからである。思慮とは不都合の性質を見分け、より悪くないものをよしとして選ぶことにある。"
  "translation_status": "reviewed"
- "id": "pr-21-017"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 17
  "source_text": "Deve ancora un Principe mostrarsi amatore delle virtù, e onorare gli eccellenti in ciascuna arte."
  "translation_ja": "君主はまた、人の長所を愛するところを見せ、どの技芸でも秀でた人々を遇するべきである。"
  "translation_status": "reviewed"
- "id": "pr-21-018"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 18
  "source_text": "Appresso deve animare i suoi cittadini di poter quietamente esercitare gli esercizi loro e nella mercanzia, e nell'agricultura, ed in ogni altro esercizio degli uomini, acciocchè quello non si astenga di ornare le sue possessioni per timore che non gli sieno tolte, e quell’altro di aprire un traffico per paura delle taglie; ma deve preparare premi a chi vuol fare queste cose, ed a qualunque pensa in qualunque modo di ampliare la sua città o il suo Stato."
  "translation_ja": "さらに、市民が商業、農業その他あらゆる生業に安心して取り組めるよう励ますことだ。財産を取られる恐れから領地の手入れをためらったり、課税を恐れて取引を始めるのを思いとどまったりしないようにする。そうした仕事をしたい人や、どんなやり方であれ都市や国を発展させようと考える人のために、褒賞を用意すべきである。"
  "translation_status": "reviewed"
- "id": "pr-21-019"
  "section_id": "pr-sec-21"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXI&oldid=3702269"
    "source_sequence": 19
  "source_text": "Deve oltre a questo ne’ tempi convenienti dell’anno tenere occupati li popoli con le feste e spettacoli; e perchè ogni città è divisa o in arti o in tribù, deve tenere conto di quelle università, ragunarsi con loro qualche volta, dare di sè esempio di umanità e di magnificenza; tenendo nondimeno sempre ferma la maestà della dignità sua; perchè questo non si vuole mai che manchi in cosa alcuna."
  "translation_ja": "加えて、一年のうち適当な時期には祭りや見世物で民を楽しませる。どの都市も同業の組合や地区に分かれているから、その団体を大切にし、ときにはその人たちの集まりに加わり、人間味と気前のよさを身をもって示す。ただし自分の地位の威厳は常に損なわないことだ。これはどんなことでも一度として欠けてはならない。"
  "translation_status": "reviewed"
- "id": "pr-22-001"
  "section_id": "pr-sec-22"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXII&oldid=3702270"
    "source_sequence": 1
  "source_text": "CAPITOLO XXII. Delli segretari de’ Principi."
  "translation_ja": "第二十二章　君主の秘書官について"
  "translation_status": "reviewed"
- "id": "pr-22-002"
  "section_id": "pr-sec-22"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXII&oldid=3702270"
    "source_sequence": 2
  "source_text": "Non è di poca importanza a un Principe la elezione de’ ministri, li quali sono buoni o no, secondo la prudenza del Principe. E la prima coniettura che si fa di un signore, e del cervel suo, è vedere gli uomini che lui ha d’intorno; e quando sono sufficienti e fedeli, sempre si può riputarlo savio, perchè ha saputo cognoscergli sufficienti e mantenerseli fedeli. Ma quando siano altrimenti, sempre si può fare non buono giudizio di lui; perchè il primo errore che e’ fa, lo fa in questa elezione."
  "translation_ja": "大臣の選び方は君主にとって並大抵の問題ではない。よい大臣を得るかどうかは、君主の分別次第である。主君とその頭の出来について最初の見当をつけるには、そばにどんな人間を置いているかを見る。有能で忠実な人々なら、その能力を見抜き、忠誠を保たせることができたのだから、君主を賢いと見てよい。そうでないなら、よい評価はできない。人選の時点で最初の過ちを犯しているからだ。"
  "translation_status": "reviewed"
- "id": "pr-22-003"
  "section_id": "pr-sec-22"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXII&oldid=3702270"
    "source_sequence": 3
  "source_text": "Non era alcuno che cognoscesse Messer Antonio da Venafro per ministro di Pandolfo Petrucci Principe di Siena, che non giudicasse Pandolfo essere prudentissimo uomo, avendo quello per suo ministro. E perchè sono di tre generazioni cervelli; l’uno intende per sè, l’altro intende quanto da altri gli è mostro, il terzo non intende nè sè stesso nè per dimostrazione d’altri. Quel primo è eccellentissimo, il secondo eccellente, il terzo inutile."
  "translation_ja": "シエナの君主パンドルフォ・ペトルッチの大臣アントニオ・ダ・ヴェナフロ殿を知って、これだけの人を大臣に持つパンドルフォはきわめて分別があると思わない者はいなかった。頭には三種類ある。一つは自分自身でわかる頭、次は他人に示されるとわかる頭、第三は自分でも、他人に示されてもわからない頭である。第一は最上、第二は上等、第三は役に立たない。"
  "translation_status": "reviewed"
- "id": "pr-22-004"
  "section_id": "pr-sec-22"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXII&oldid=3702270"
    "source_sequence": 4
  "source_text": "Conveniva pertanto di necessità, che se Pandolfo non era nel primo grado, fusse nel secondo; perchè ogni volta che uno ha giudicio di cognoscere il bene ed il male che un fa e dice, ancorachè da sè non abbia invenzione, cognosce le opere triste e le buone del ministro, e quelle esalta e le altre corregge; ed il ministro non può sperare d’ingannarlo, e mantiensi buono. Ma come un Principe possa cognoscere il ministro, ci è questo modo che non falla mai."
  "translation_ja": "だからパンドルフォは、第一でなかったとしても必ず第二には属していた。人の言行の善し悪しを判断する力があれば、自分で考え出す力はなくても、大臣のよい働きと悪い働きを見分け、よいものを高く買い、悪いものを正せる。大臣も君主を欺けるとは思わず、よいままでいる。君主が大臣を見分けるには、けっして外れない、こんな方法がある。"
  "translation_status": "reviewed"
- "id": "pr-22-005"
  "section_id": "pr-sec-22"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXII&oldid=3702270"
    "source_sequence": 5
  "source_text": "Quando tu vedi il ministro pensare più a sè, che a te, e che in tutte le azioni vi ricerca l’utile suo, questo tale così fatto mai non fia buon ministro, nè mai te ne potrai fidare; perchè quello che ha lo Stato di uno in mano, non deve mai pensare a sè, ma al Principe; e non gli ricordare mai cosa, che non appartenga a lui."
  "translation_ja": "大臣があなたより自分のことを考え、することなすことに自分の利益を求めているとわかったら、そのような人はけっしてよい大臣にならず、信用もできない。他人の国家を掌中に預かる者は自分でなく君主を考え、君主にかかわりのないことをけっして進言してはならないからだ。"
  "translation_status": "reviewed"
- "id": "pr-22-006"
  "section_id": "pr-sec-22"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXII&oldid=3702270"
    "source_sequence": 6
  "source_text": "E dall’altra parte il Principe per mantenerlo buono deve pensare al ministro, onorandolo, facendolo ricco, obbligandoselo, partecipandogli gli onori e carichi, acciocchè li assai onori, le assai ricchezze concessegli siano causa che egli non desideri altri onori, e ricchezze; e gli assai carichi gli faccino temere le mutazioni, cognoscendo non poter reggersi senza lui."
  "translation_ja": "他方、よい大臣でいてもらうには、君主も大臣のことを考えなくてはならない。敬い、富ませ、恩で結びつけ、名誉と責任を分け与える。授けられた名誉と富が十分多ければ、ほかの名誉や富を欲しなくなる。多くの責任を担えば、君主なしには自分が立ち行かないと知り、政変を恐れる。"
  "translation_status": "reviewed"
- "id": "pr-22-007"
  "section_id": "pr-sec-22"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXII&oldid=3702270"
    "source_sequence": 7
  "source_text": "Quando adunque i Principi e li ministri sono così fatti, possono confidare l’uno dell’altro; quando altrimenti, il fine sarà sempre dannoso o per l’uno, o per l’altro."
  "translation_ja": "したがって君主と大臣がこのようであれば、互いを信頼できる。そうでなければ結末はいつも、どちらか一方にとって有害である。"
  "translation_status": "reviewed"
- "id": "pr-23-001"
  "section_id": "pr-sec-23"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIII&oldid=3702271"
    "source_sequence": 1
  "source_text": "CAPITOLO XXIII. Come si debbino fuggire gli adulatori."
  "translation_ja": "第二十三章　追従する者をどう避けるべきか"
  "translation_status": "reviewed"
- "id": "pr-23-002"
  "section_id": "pr-sec-23"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIII&oldid=3702271"
    "source_sequence": 2
  "source_text": "Non voglio lasciare indietro un capo importante, ed un errore, dal quale i Principi con difficultà si difendono, se non sono prudentissimi, o se non hanno buona elezione. E questo è quello degli adulatori, delli quali le corti sono piene, perchè gli uomini si compiacciono tanto nelle cose lor proprie, e in modo vi s’ingannano, che con difficultà si difendono da questa peste; ed a volersene difendere si porta pericolo di non diventare disprezzato."
  "translation_ja": "大切な論点が一つあるので、残しておきたくない。よほど賢明でなければ、あるいは人選がよくなければ、君主が身を守りにくい過ちだ。宮廷に満ちている追従者の問題である。人は自分に関することにはひどく気をよくし、それで思い違いをするので、この疫病から身を守るのは難しい。かといって守ろうとすると、今度は軽く見られる危険がある。"
  "translation_status": "reviewed"
- "id": "pr-23-003"
  "section_id": "pr-sec-23"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIII&oldid=3702271"
    "source_sequence": 3
  "source_text": "Perchè non ci è altro modo a guardarsi dalle adulazioni, se non che gli uomini intendino che non ti offendono a dirti il vero; ma quando ciascuno può dirti il vero, ti manca la riverenza."
  "translation_ja": "追従を防ぐには、本当のことを言っても主君は傷つかないと人にわからせる以外に道はない。ところが誰もがあなたに本当のことを言えるとなると、あなたへの敬意が失われる。"
  "translation_status": "reviewed"
- "id": "pr-23-004"
  "section_id": "pr-sec-23"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIII&oldid=3702271"
    "source_sequence": 4
  "source_text": "Pertanto un Principe prudente deve tenere un terzo modo, eleggendo nel suo Stato uomini savi, e solo a quelli deve dare libero arbitrio a parlargli la verità, e di quelle cose sole che lui domanda, e non di altro; ma deve domandargli di ogni cosa, e udire le opinioni loro, dipoi deliberare da sè a suo modo; e con questi consigli, e con ciascun di loro portarsi in modo, che ognuno conosca che quanto più liberamente si parlerà, tanto più gli sarà accettato; fuori di quelli, non volere udire alcuno, andar dietro alla cosa deliberata, ed essere ostinato nelle deliberazioni sue."
  "translation_ja": "そこで思慮ある君主は第三の道を取る。国のなかから賢い人を選び、その人々だけに真実を自由に話すことを許す。話してよいのは自分が尋ねたことだけで、ほかのことではない。だが何についても広く尋ね、それぞれの意見を聞き、最後には自分の仕方で自分で決める。相談の席でも一人ひとりに対しても、率直に話すほど喜ばれると誰にでも分かるように振る舞う。その人々以外の言葉には耳を貸さず、決めたことのあとを追い、自分の決断を堅く守る。"
  "translation_status": "reviewed"
- "id": "pr-23-005"
  "section_id": "pr-sec-23"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIII&oldid=3702271"
    "source_sequence": 5
  "source_text": "Chi fa altrimenti o precipita per gli adulatori, o si muta spesso per la variazione de’ pareri; di che nasce la poca estimazione sua. Io voglio a questo proposito addurre un esempio moderno."
  "translation_ja": "そうしない人は追従者のためにつまずくか、意見の変化につれてたびたび自分も変わり、そのために重んじられなくなる。ここで最近の一例を引きたい。"
  "translation_status": "reviewed"
- "id": "pr-23-006"
  "section_id": "pr-sec-23"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIII&oldid=3702271"
    "source_sequence": 6
  "source_text": "Pre’ Luca, uomo di Massimiliano presente Imperatore, parlando di sua Maestà, disse, come non si consigliava con persona, e non faceva mai d’alcuna cosa a suo modo; il che nasceva dal tenere contrario termine al sopradetto; perchè l’Imperatore è uomo segreto, non comunica li suoi segreti con persona, non ne piglia parere. Ma come nel mettergli ad effetto s’incominciano a conoscere e scuoprire, gl’incominciano ad esser contradetti da coloro che egli ha d’intorno, e quello come facile se ne stoglie."
  "translation_ja": "現皇帝マクシミリアンのもとにいる司祭ルーカが、陛下について言った。誰にも相談しないのに、どんなことも自分の思うようにはなさらない、と。それは先に述べたのと反対の道を取った結果である。皇帝は秘密主義で、胸中を誰にも伝えず、意見を求めない。だが実行に移して計画が知られ、表に出始めると、周囲の者が異を唱え始め、折れやすい皇帝はすぐやめてしまう。"
  "translation_status": "reviewed"
- "id": "pr-23-007"
  "section_id": "pr-sec-23"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIII&oldid=3702271"
    "source_sequence": 7
  "source_text": "Di qui nasce che quelle cose che fa l’un giorno, distrugge l’altro; e che non s’intenda mai quello che vogli, o disegni fare, e che sopra le sue deliberazioni non si può fondare."
  "translation_ja": "その結果、ある日にしたことを次の日には自分で壊す。何を望み、何をしようと考えているのか誰にも分からず、その決断をあてにすることもできない。"
  "translation_status": "reviewed"
- "id": "pr-23-008"
  "section_id": "pr-sec-23"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIII&oldid=3702271"
    "source_sequence": 8
  "source_text": "Un Principe pertanto deve consigliarsi sempre, ma quando lui vuole, non quando altri vuole; anzi deve torre animo a ciascuno di consigliarlo d’alcuna cosa, se non gliene domanda; ma lui deve ben essere largo domandatore, e dipoi, circa le cose domandate, paziente auditore del vero; anzi intendendo che alcuno per qualche rispetto non gliene dica, turbarsene."
  "translation_ja": "君主はだから常に相談すべきだが、それは自分が望むときであって、人が望むときではない。尋ねてもいないことを進言する気は、むしろ誰にも起こさせないようにする。だが自分からは幅広く問い、尋ねた事柄については辛抱強く真実を聞く。何かに遠慮して真実を話していない人がいると分かったら、むしろそれをこそ憤るべきである。"
  "translation_status": "reviewed"
- "id": "pr-23-009"
  "section_id": "pr-sec-23"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIII&oldid=3702271"
    "source_sequence": 9
  "source_text": "E perchè molti stimano che alcun Principe, il quale dà di sè opinione di prudente, sia così tenuto non per sua natura, ma per li buoni consigli che lui ha d’intorno, senza dubbio s’ingannano; perchè questa non falla mai, ed è regola generale, che un Principe, il quale non sia savio per sè stesso, non può essere consigliato bene, se già a sorte non si rimettesse in un solo che al tutto lo governasse, che fusse uomo prudentissimo."
  "translation_ja": "分別ある君主という評判は、本人の資質でなく、周囲のよい助言のおかげだと思う人は多いが、それは間違いに違いない。例外のない一般則がある。自分自身が賢くない君主は、じつに思慮ある一人の人にたまたま身を任せ、自分を全面的に治めさせるのでないかぎり、よい助言を受けることもできない。"
  "translation_status": "reviewed"
- "id": "pr-23-010"
  "section_id": "pr-sec-23"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIII&oldid=3702271"
    "source_sequence": 10
  "source_text": "In questo caso potria bene essere ben governato, ma durerebbe poco, perchè quello governatore in breve tempo gli torrebbe lo Stato; ma consigliandosi con più d’uno, un Principe che non sia savio, non arà mai uniti consigli, nè saprà per sè stesso unirgli. Dei consiglieri ciascuno penserà alla proprietà sua; ed egli non gli saprà correggere, nè cognoscere. E non si possono trovare altrimenti, perchè gli uomini sempre ti riusciranno tristi, se da una necessità non sono fatti buoni."
  "translation_ja": "その場合、治め方はよいかもしれないが、長くは続くまい。その補佐者がやがて君主から国を取り上げるからだ。かといって大勢に相談するなら、賢くない君主は決して一致した助言を得られず、自分でまとめることもできない。相談役はみな自分の利益を思い、君主にはそれを正す力も見抜く力もない。それ以外の相談役を見つけることはできない。必要に迫られて善良にさせられないかぎり、人はいつもあなたに対して悪く出るものだからだ。"
  "translation_status": "reviewed"
- "id": "pr-23-011"
  "section_id": "pr-sec-23"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIII&oldid=3702271"
    "source_sequence": 11
  "source_text": "Però si conchiude che li buoni consigli, da qualunque venghino, conviene naschino dalla prudenza del Principe, e non la prudenza del Principe da’ buoni consigli."
  "translation_ja": "したがって、誰から来たものであろうと、よい助言が君主の思慮から生まれるのであって、君主の思慮がよい助言から生まれるのではない、と結論される。"
  "translation_status": "reviewed"
- "id": "pr-24-001"
  "section_id": "pr-sec-24"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIV&oldid=3702272"
    "source_sequence": 1
  "source_text": "CAPITOLO XXIV. Perchè i Principi d’Italia abbino perduto i loro Stati."
  "translation_ja": "第二十四章　イタリアの君主はなぜ国を失ったか"
  "translation_status": "reviewed"
- "id": "pr-24-002"
  "section_id": "pr-sec-24"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIV&oldid=3702272"
    "source_sequence": 2
  "source_text": "Le cose sopradette osservate prudentemente fanno parere un Principe nuovo antico; e lo rendono subito più sicuro e più fermo nello Stato, che se vi fosse anticato dentro."
  "translation_ja": "これまで述べてきたことを分別をもって守れば、新しく立った君主も古くからいる君主のように見える。いや、もとからその地位にあったよりも、たちまちいっそう安全になり、国にしっかり根を張る。"
  "translation_status": "reviewed"
- "id": "pr-24-003"
  "section_id": "pr-sec-24"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIV&oldid=3702272"
    "source_sequence": 3
  "source_text": "Perchè un Principe nuovo è molto più osservato nelle sue azioni, che uno ereditario; e quando le son cognosciute virtuose, si guadagnano molto più gli uomini, e molto più gli obbligano, che il sangue antico; perchè gli uomini sono molto più presi dalle cose presenti, che dalle passate, e quando nelle presenti ei trovano il bene, vi si godono, e non cercano altro; anzi pigliano ogni difesa di lui, quando il Principe non manchi nelle altre cose a sè medesimo."
  "translation_ja": "新しい君主は、世襲の君主よりはるかにその行動を注視されるからだ。その行いに力量が認められると、古い血筋以上に人々の心をつかみ、強く結びつける。人々は過去のものより現在のものにずっと強く引きつけられ、現在によいものを見いだせばそれを享受し、それ以上は求めない。君主がほかの面で自分を損なわないかぎり、むしろ進んで守りの手を尽くしてくれる。"
  "translation_status": "reviewed"
- "id": "pr-24-004"
  "section_id": "pr-sec-24"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIV&oldid=3702272"
    "source_sequence": 4
  "source_text": "E così arà duplicata gloria di aver dato principio a un Principato nuovo, ed ornatolo, e corroboratolo di buone leggi, di buone armi, di buoni amici, e di buoni esempi; come quello arà duplicata vergogna, che è nato Principe, e per sua poca prudenza l’ha perduto."
  "translation_ja": "こうして新しい君主国を建てたうえによい法律、よい軍、よい友、よい模範でこれを飾り、強めたという二重の栄光を受ける。生来の君主でありながら思慮の足りなさで国を失った者が、二重の恥を得るのと同じだ。"
  "translation_status": "reviewed"
- "id": "pr-24-005"
  "section_id": "pr-sec-24"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIV&oldid=3702272"
    "source_sequence": 5
  "source_text": "E se si considera quelli Signori che in Italia hanno perduto lo Stato ne’ nostri tempi, come il Re di Napoli, Duca di Milano, e altri, si troverà in loro prima un comune difetto quanto all’armi, per le cagioni che di sopra a lungo si sono discorse; dipoi si vedrà alcun di loro o che arà avuto nimici i popoli, o se arà avuto amico il popolo, non si sarà saputo assicurare de’ grandi; perchè senza questi difetti non si perdono gli Stati, che abbino tanto nervi, che possino tenere un esercito alla campagna."
  "translation_ja": "ナポリ王、ミラノ公など、われわれの時代にイタリアで国を失った領主たちを見ると、第一に、先に詳しく論じた原因によって、軍事に共通の欠陥があったとわかる。次に、ある者は民衆を敵に回し、ほかの者は民衆を味方にしても有力者に対する安全を確保できなかった。野戦に出せる軍を維持するほどの力がある国は、こうした欠陥がなければ失われない。"
  "translation_status": "reviewed"
- "id": "pr-24-006"
  "section_id": "pr-sec-24"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIV&oldid=3702272"
    "source_sequence": 6
  "source_text": "Filippo Macedone, non il padre di Alessandro Magno, ma quello che fu da Tito Quinzio vinto, aveva non molto Stato rispetto alla grandezza de’ Romani, e di Grecia, che l’assaltò; nientedimeno, per essere uomo militare, e che sapeva intrattenere i popoli, ed assicurarsi de’ grandi, sostenne più anni la guerra contro di quelli; e se alla fine perdè il dominio di qualche città, gli rimase nondimanco il Regno."
  "translation_ja": "マケドニアのフィリッポス、つまりアレクサンドロス大王の父でなくティトゥス・クィンクティウスに敗れた方は、襲ってきたローマとギリシアの大きさに比べてさほどの国を持っていなかった。それでも軍事に通じ、民衆をつなぎとめ、有力者に対する身の安全も図れたので、何年も戦争を維持した。最後は幾つかの都市の支配を失ったが、王国は彼のもとに残った。"
  "translation_status": "reviewed"
- "id": "pr-24-007"
  "section_id": "pr-sec-24"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIV&oldid=3702272"
    "source_sequence": 7
  "source_text": "Pertanto questi nostri Principi, i quali molti anni erano stati nel loro Principato, per averlo dipoi perso, non accusino la fortuna, ma l’ignavia loro; perchè non avendo mai pensato ne’ tempi quieti che possino mutarsi; (il che è comune difetto degli uomini non far conto nella bonaccia della tempesta) quando poi vennero i tempi avversi, pensarono a fuggirsi, non a difendersi, e sperarono che i populi, infastiditi per la insolenza de’ vincitori, gli richiamassero."
  "translation_ja": "だから長年君主でありながらやがて国を失ったわが国の君主たちは、運命でなく自分たちの怠惰を責めるべきだ。平穏なときに時勢が変わりうるなどと考えてもみなかった。凪のときに嵐を考えないのは人に共通する欠点である。逆境が来ると、防ぐのでなく逃げることを考えた。そして民衆が勝者の横暴に嫌気がさして、自分たちを呼び戻すことに期待した。"
  "translation_status": "reviewed"
- "id": "pr-24-008"
  "section_id": "pr-sec-24"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXIV&oldid=3702272"
    "source_sequence": 8
  "source_text": "Il quale partito, quando mancano li altri, è buono; ma è ben male avere lasciato gli altri rimedi per quello; perchè non si vorrebbe mai cadere per credere poi di trovare chi ti ricolga. Il che, o non avviene, o se egli avviene, non è con tua sicurtà, per essere quella difesa vile, e non dipendere da te; e quelle difese solamente sono buone, certe, e durabili, che dipendono da te proprio, e dalla virtù tua."
  "translation_ja": "ほかに手がないなら、その策もよい。だがそのためにほかの手を捨てておいたのは悪い。あとで誰かが助け起こしてくれると思って、わざわざ転ぶものではない。助けがないか、あっても確かな身の安全には結びつかない。そうした守りは頼りなく、自分の手にかかっていないからである。よく、確かで、長続きする守りとは、自分自身と自分の力量にかかっているものだけだ。"
  "translation_status": "reviewed"
- "id": "pr-25-001"
  "section_id": "pr-sec-25"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 1
  "source_text": "CAPITOLO XXV. Quanto possa nelle umane cose la fortuna, e in che modo se gli possa ostare."
  "translation_ja": "第二十五章　人間の事柄を運はどこまで左右するか、また運にどう抗しうるか"
  "translation_status": "reviewed"
- "id": "pr-25-002"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 2
  "source_text": "Non mi è incognito, come molti hanno avuto e hanno opinione, che le cose del mondo siano in modo governate dalla fortuna, e da Dio, che gli uomini con la prudenza loro non possino correggerle, anzi non vi abbino rimedio alcuno; e per questo potrebbono giudicare che non fusse da insudare molto nelle cose, ma lasciarsi governare dalla sorte. Questa opinione è suta più creduta ne’ nostri tempi per la variazione delle cose grandi che si sono viste, e veggonsi ogni dì fuori di ogni umana coniettura."
  "translation_ja": "多くの人々が以前から今に至るまで、世の中は運と神にあまりにも支配され、人間が思慮を働かせても正しようがなく、手の打ちようもない、と考えているのは承知している。だから物事にそう骨を折らず、成り行きに任せるのがよい、と考える人もいるだろう。われわれの時代には、人間のいっさいの予測を超えて、大きな事柄が変転するのを昔も見、いまも日ごとに見ているため、この意見がなおさら信用されている。"
  "translation_status": "reviewed"
- "id": "pr-25-003"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 3
  "source_text": "A che pensando io qualche volta, sono in qualche parte inchinato nella opinione loro. Nondimanco, perchè il nostro libero arbitrio non sia spento, giudico potere esser vero, che la fortuna sia arbitra della metà delle azioni nostre, ma che ancora ella ne lasci governare l’altra metà, o poco meno, a noi."
  "translation_ja": "私もときどきそれを考え、その意見にいくらか傾いたことがある。それでも人間の自由意志を消してしまわないために、こう考えるのが真実ではないかと思う。われわれの行動の半分については運命が裁定者であるとしても、後の半分、あるいはそれよりわずかに少ない部分を治めることは、なおわれわれに委ねられている。"
  "translation_status": "reviewed"
- "id": "pr-25-004"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 4
  "source_text": "Ed assomiglio quella ad fiume rovinoso, che quando ei si adira, allaga i piani, rovina gli arbori e gli edifici, lieva da questa parte terreno, ponendolo a quell’altra; ciascuno gli fugge davanti, ognuno cede al suo furore, senza potervi ostare; e benchè sia così fatto, non resta però che gli uomini, quando sono tempi quieti, non vi possino fare provvedimenti e con ripari, e con argini, immodochè crescendo poi, o egli andrebbe per un canale, o l’impeto suo non sarebbe sì licenzioso, nè sì dannoso."
  "translation_ja": "私は運を荒れ狂う川にたとえる。腹を立てれば平野を水浸しにし、木々や建物を倒し、こちらから土を削ってはあちらへ運ぶ。人はみなその前を逃げ、だれも抗せず猛威に屈する。だが川がそういうものであっても、静かな季節に、人が堤防を築き、護岸を施して備えることを妨げはしない。備えがあれば、また増水しても水は定めた流路に入るか、少なくとも勢いが以前ほど勝手気ままに暴れ、大きな害をなすことはない。"
  "translation_status": "reviewed"
- "id": "pr-25-005"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 5
  "source_text": "Similmente interviene della fortuna, la quale dimostra la sua potenzia dove non è ordinata virtù a resistere, e quivi volta i suoi impeti, dove la sa che non sono fatti gli argini, nè i ripari a tenerla. E se voi considererete l’Italia, che è la sede di queste variazioni, e quella che ha dato loro il moto, vedrete essere una campagna senza argini, e senza alcun riparo."
  "translation_ja": "運も同じである。抗するだけの力量が組織されていないところでその強さを示し、抑える堤も護岸もつくられていないと知るところへ猛威を向ける。こうした変転の舞台であり、変転に動きを与えたイタリアを見れば、堤も防壁もない平野であることがわかるだろう。"
  "translation_status": "reviewed"
- "id": "pr-25-006"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 6
  "source_text": "Che se la fusse riparata da conveniente virtù, come è la Magna, la Spagna, e la Francia, questa inondazione non avrebbe fatto le variazioni grandi che l’ha, o la non ci sarebbe venuta. E questo voglio basti aver detto quanto all’opporsi alla fortuna in universale. Ma restringendomi più al particulare, dico, come si vede oggi questo Principe felicitare, e domani rovinare, senza vederli aver mutato natura o qualità alcuna."
  "translation_ja": "ドイツ、スペイン、フランスのように相応の力量で守られていたなら、この洪水もこれほど大きな変化を起こさなかったか、さもなければイタリアには来なかっただろう。運に抗する一般論はこれで十分としよう。もっと個々に絞って言えば、君主の性格も資質も少しも変化したように見えないのに、今日は栄え、明日は滅びることがある。"
  "translation_status": "reviewed"
- "id": "pr-25-007"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 7
  "source_text": "Il che credo nasca prima dalle cagioni che si sono lungamente per lo addietro trascorse; cioè, che quel Principe che si appoggia tutto in sulla fortuna, rovina come quella varia. Credo ancora, che sia felice quello, il modo del cui procedere suo si riscontra con la qualità de’ tempi, e similmente sia infelice quello, dal cui procedere si discordano i tempi."
  "translation_ja": "この第一の原因は、前に詳しく見てきたとおり、すべてを運に頼る君主は運の変化とともに滅びるからだと私は考える。また、自分の運び方が時代の性質に合致する人は幸運であり、時代と運び方が食い違う人は不運である、とも考える。"
  "translation_status": "reviewed"
- "id": "pr-25-008"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 8
  "source_text": "Perchè si vede gli uomini nelle cose che gl’inducono al fine, quale ciascuno ha innanzi, cioè gloria e ricchezze, procedervi variamente, l’uno con rispetti, l’altro con impeto; l’uno per violenza, l’altro per arte; l’uno con pazienza, l’altro col suo contrario; e ciascuno con questi diversi modi vi può pervenire."
  "translation_ja": "人が栄光と富というそれぞれの目標に向かうとき、進み方は実にさまざまである。ある者は慎重に、別の者は勢いで進む。力ずくで、あるいは知略で、忍耐をもって、あるいはその逆のやり方で進む。人はそれぞれ違った方法で、いずれも目標に達しうる。"
  "translation_status": "reviewed"
- "id": "pr-25-009"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 9
  "source_text": "E vedesi ancora duoi respettivi, l’uno pervenire al suo disegno, l’altro no; e similmente duoi equalmente felicitare con due diversi studi, essendo l’uno respettivo, l’altro impetuoso; il che non nasce da altro, se non da qualità di tempi che si conformino o no col procedere loro. Di qui nasce quello ho detto che duoi, diversamente operando, sortiscano il medesimo effetto; e duoi equalmente operando, l’uno si conduce al suo fine, l’altro no."
  "translation_ja": "同じく慎重な二人のうち、一人が目標に達し、一人は達しないこともある。逆に、一人は慎重、一人は性急という別々のやり方で、二人とも等しく成功することもある。これは時勢の性質がそれぞれの進み方に合うか合わないか以外の何ものにも由来しない。違った行動をした二人が同じ結果を得、同じ行動をした二人が一方だけ目的に達するのはそのためである。"
  "translation_status": "reviewed"
- "id": "pr-25-010"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 10
  "source_text": "Da questo ancora dipende la variazione del bene; perchè se a uno, che si governa con rispetto e pazienza, i tempi e le cose girano in modo che il governo suo sia buono, esso viene felicitando; ma se li tempi e le cose si mutano, egli rovina, perchè non muta modo di procedere."
  "translation_ja": "順運が変転することもこれにかかっている。慎重で忍耐強い人の場合、時勢と物事がその治め方に都合よく巡っているなら、成功を重ねる。だが時勢と事柄が変わっても、本人はやり方を変えないため、破滅する。"
  "translation_status": "reviewed"
- "id": "pr-25-011"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 11
  "source_text": "Nè si trova uomo sì prudente, che si sappi accordare a questo, sì perchè non si può deviare da quello, a che la natura l’inclina; sì ancora perchè avendo sempre uno prosperato camminando per una via, non si può persuadere, che sia bene partirsi da quella; e però l’uomo rispettivo, quando gli è tempo di venire all’impeto non lo sa fare; donde egli rovina; che se si mutasse natura con li tempi e con le cose, non si muterebbe fortuna."
  "translation_ja": "これに合わせられるほど思慮深い人は見当たらない。生まれつきの傾向から離れられないうえ、いつもある道を歩いて成功してきた者は、その道を離れるほうがよいと納得できないからだ。慎重な人は勢いに任せて動くべきときにそうできず、そこから滅びる。時勢や事柄とともに自分の性質を変えられたなら、運のよさも変わらずにすむだろうに。"
  "translation_status": "reviewed"
- "id": "pr-25-012"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 12
  "source_text": "Papa Iulio II procedette in ogni sua cosa impetuosamente, e trovò tanto i tempi e le cose conformi a quel suo modo di procedere, che sempre sortì felice fine. Considerate la prima impresa che fece di Bologna, vivendo ancora Messer Giovanni Bentivogli."
  "translation_ja": "教皇ユリウス二世はあらゆることを勢いで押し進めた。時勢も事柄もその進み方にじつによく合ったおかげで、つねによい結果を得た。ジョヴァンニ・ベンティヴォーリョ殿がまだ生きていたときの最初のボローニャ遠征を考えてほしい。"
  "translation_status": "reviewed"
- "id": "pr-25-013"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 13
  "source_text": "I Viniziani non se ne contentavano, il Re di Spagna similmente con Francia aveva ragionamento di tale impresa; e lui nondimanco con la sua ferocità ed impeto si mosse personalmente a quella espedizione, la qual mossa fece star sospesi e fermi e Spagna, e i Viniziani; quelli per paura, quell’altro per il desiderio di ricuperare tutto il Regno di Napoli; e dall’altra parte si tirò dietro il Re di Francia, perchè vedutolo quel Re mosso, e desiderando farselo amico per abbassare i Viniziani, giudicò non poterli negare le sue genti senza ingiuriarlo manifestamente."
  "translation_ja": "ヴェネツィア人はこれに不満で、スペイン王も同様だった。教皇はフランスとはこの企てについて話し合っているところだった。それでも教皇本人が激しく、一気に遠征へ出発した。その行動でスペインもヴェネツィアもためらい立ち止まった。ヴェネツィアは恐れから、スペイン王はナポリ王国をまるごと回復したいとの願いからだった。一方、フランス王は教皇に引っ張られた。すでに教皇が動いたのを見、ヴェネツィアの勢力をそぐために友としたかったので、兵を断るのは公然の侮辱になると考えたからだ。"
  "translation_status": "reviewed"
- "id": "pr-25-014"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 14
  "source_text": "Condusse adunque Iulio con la sua mossa impetuosa quello che mai altro Pontefice con tutta l’umana prudenza non avria condutto; perchè se egli aspettava di partirsi da Roma con le conclusione ferme, e tutte le cose ordinate, come qualunque altro Pontefice arebbe fatto, mai non gli riusciva. Perchè il Re di Francia avria trovate mille scuse, e gli altri gli arebbero messo mille paure."
  "translation_ja": "こうしてユリウスは勢いに任せた行動で、ほかの教皇なら人間の思慮を尽くしてもできなかったことをなし遂げた。ほかの教皇ならしたように、取り決めが固まり万事が整うのを待ってローマを出ていたら、けっして成功しなかった。フランス王はいくらでも言い訳を見つけ、ほかの者はいくらでも不安を吹き込んだろう。"
  "translation_status": "reviewed"
- "id": "pr-25-015"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 15
  "source_text": "Io voglio lasciare stare le altre sue azioni, che tutte sono state simili, e tutte gli sono successe bene, e la brevità della vita non gli ha lasciato sentire il contrario; perchè se fussero sopravvenuti tempi che fosse bisognato procedere con rispetti, ne seguiva la sua rovina; perchè mai non arebbe deviato da quelli modi, a’ quali la natura lo inchinava."
  "translation_ja": "ほかの行動はここでは省こう。すべて同じようで、すべてうまくいった。在世が短かったから、反対の場合を経験しなかった。慎重に事を運ぶ必要のある時代が来ていたら、破滅していたろう。生来の傾向に合ったやり方をけっして外れなかったはずだからだ。"
  "translation_status": "reviewed"
- "id": "pr-25-016"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 16
  "source_text": "Conchiudo adunque, che, variando la fortuna, e gli uomini stando nei loro modi ostinati, sono felici mentre concordano insieme, e come discordano sono infelici. Io giudico ben questo, che sia meglio essere impetuoso, che rispettivo, perchè la Fortuna è donna; ed è necessario, volendola tener sotto, batterla, ed urtarla; e si vede che la si lascia più vincere da questi che da quelli che freddamente procedono."
  "translation_ja": "結論すると、運は変わるのに人間は自分のやり方に固執するから、両者が合うあいだは幸運、食い違うや不運になる。それでも私の判断では、慎重であるより激しく進むほうがよい。運命は女であり、押さえつけておこうとすれば打ち据え、荒々しく迫る必要がある、と私は考える。冷静に事を運ぶ者よりそういう者に、運命は征服されやすいように見える。"
  "translation_status": "reviewed"
- "id": "pr-25-017"
  "section_id": "pr-sec-25"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXV&oldid=3702273"
    "source_sequence": 17
  "source_text": "E però sempre, come donna, è amica de’ giovani, perchè sono meno rispettivi, più feroci, e con più audacia la comandano."
  "translation_ja": "それゆえ運命は、女のようにいつも若者の味方である。若者はためらいが少なく、気が荒く、いっそう大胆に運命に命じるからだ。"
  "translation_status": "reviewed"
- "id": "pr-26-001"
  "section_id": "pr-sec-26"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 1
  "source_text": "CAPITOLO XXVI. Esortazione a liberare la Italia da’ barbari."
  "translation_ja": "第二十六章　イタリアを蛮族から解放するための勧告"
  "translation_status": "reviewed"
- "id": "pr-26-002"
  "section_id": "pr-sec-26"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 2
  "source_text": "Considerato adunque tutte le cose di sopra discorse, e pensando meco medesimo se al presente in Italia correvano tempi da onorare un Principe nuovo, e se ci era materia che desse occasione a uno prudente e virtuoso d’introdurvi nuova forma, che facesse onore a lui, e bene alla università degli uomini di quella, mi pare concorrino tante cose in beneficio d’un Principe nuovo, che non so qual mai tempo fusse più atto a questo."
  "translation_ja": "ここまで論じたすべてを見渡し、今日のイタリアが新しい君主に名誉を与える時を迎えているか、思慮と力量をそなえた人が新しい形を与え、自分の名誉となり、この国の人々すべてのためになるような素材があるかと、私は独り考えました。新しい君主に味方する事情はこれほど重なっています。かつてこれ以上にふさわしい時があったか、私には分かりません。"
  "translation_status": "reviewed"
- "id": "pr-26-003"
  "section_id": "pr-sec-26"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 3
  "source_text": "E se, come io dissi, era necessario, volendo vedere la virtù di Moisè, che il popolo d’Istrael fusse schiavo in Egitto, ed a conoscere la grandezza e l’animo di Ciro, che i Persi fussero oppressi da’ Medi, e ad illustrare l’eccellenza di Teseo, che gli Ateniesi fussero dispersi; così al presente, volendo conoscere la virtù di uno spirito Italiano, era necessario che l’Italia si conducesse ne’ termini presenti, e che la fusse più schiava che gli Ebrei, più serva che i Persi, più dispersa che gli Ateniesi, senza capo, senz’ordine, battuta, spogliata, lacera, corsa, ed avesse sopportato di ogni sorta rovine."
  "translation_ja": "先に申したように、モーセの力量が見えるには、イスラエルの民がエジプトで奴隷であることが必要でした。キュロスの偉大さと気概が知られるにはペルシア人がメディア人に圧迫され、テセウスの卓越が輝くにはアテナイ人が散らばっていなければなりませんでした。それと同じく今日、イタリアの一人の人の力量を知るには、イタリアがいまの境遇に至ることが必要だったのです。ヘブライ人よりも奴隷となり、ペルシア人よりも隷属し、アテナイ人よりも離散し、首領も制度もなく、打たれ、奪われ、引き裂かれ、踏み荒らされ、ありとあらゆる破壊を受けるに至ることが。"
  "translation_status": "reviewed"
- "id": "pr-26-004"
  "section_id": "pr-sec-26"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 4
  "source_text": "E benchè infino a qui si sia mostro qualche spiraculo in qualcuno da poter giudicare che fusse ordinato da Dio per sua redenzione; nientedimanco si è visto come dipoi nel più alto corso delle azioni è stato dalla fortuna reprobato in modo, che, rimasa come senza vita, aspetta qual possa esser quello che sani le sue ferite, e ponga fine alle direpzioni, e a’ sacchi di Lombardia, alle espilazioni, e taglie del Reame, e di Toscana, e la guarisca di quelle sue piaghe già per lungo tempo infistolite."
  "translation_ja": "これまでにも、ある人のうちに、イタリアを救うため神が定めたのではないかと思わせるかすかな光が見えました。それでもその人は事業の最も高いところで運命に見放されました。イタリアはいま命のないもののように取り残され、傷を癒やしてくれる者を待っています。ロンバルディアの強奪と略奪、ナポリ王国とトスカーナの収奪と取り立てに終止符を打ち、長年うみ続けた病創を治してくれる者を、です。"
  "translation_status": "reviewed"
- "id": "pr-26-005"
  "section_id": "pr-sec-26"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 5
  "source_text": "Vedesi come la prega Dio che gli mandi qualcuno che la redima da queste crudeltà ed insolenzie barbare. Vedesi ancora tutta pronta e disposta a seguire una bandiera, purchè ci sia alcuno che la pigli. Nè si vede al presente in quale la possa più sperare che nella illustre Casa Vostra, la quale con la sua virtù e fortuna, favorita da Dio e dalla Chiesa, della quale è ora Principe, possa farsi capo di questa redenzione."
  "translation_ja": "イタリアが神に向かい、この異国人の残酷さと横暴から救い出す人を遣わしてくださいと祈っているのが見えます。一つの旗を手に取る者さえあれば、その旗の下に馳せ参じる用意がすっかりできているのも見えます。いま、貴家ほどにイタリアの希望を託せる家は、ほかには見当たりません。貴家は自らの力量と幸運、神の後押しと、現に貴家の一員を長と仰ぐ教会の後押しを受けて、この解放の先頭に立つことができます。"
  "translation_status": "reviewed"
- "id": "pr-26-006"
  "section_id": "pr-sec-26"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 6
  "source_text": "E questo non vi sarà molto difficile, se vi recherete innanzi le azioni e vite de’ soprannominati. E benchè quelli uomini siano rari e maravigliosi; nondimeno furono uomini, ed ebbe ciascuno di loro minore occasione, che la presente; perchè l’impresa loro non fu più giusta di questa, nè più facile; nè fu Dio più a loro amico, che a voi. Qui è giustizia grande, perchè quella guerra è giusta, che gli è necessaria; e quelle armi sono pietose, dove non si spera in altro, che in elle."
  "translation_ja": "先に名を挙げた人々の生涯と行いを眼前に置かれれば、それはさほど難しいことではありません。まれに見る驚くべき人々ではありましたが、同じ人間です。一人ひとりが得た機会は、いまの機会より小さかったのです。彼らの事業はこの事業より正しくも、たやすくもなかった。神も彼らに、閣下に対するより好意をお示しになったわけではありません。ここには大きな正義があります。必要に迫られた戦争こそ正しい戦争であり、ほかに望みのない人にとって、その武器は慈悲深い武器だからです。"
  "translation_status": "reviewed"
- "id": "pr-26-007"
  "section_id": "pr-sec-26"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 7
  "source_text": "Qui è disposizione grandissima; nè può essere, dove è grande disposizione, grande difficultà; purchè quella pigli delli ordini di coloro che io vi ho proposto per mira. Oltre a questo, qui si veggono straordinari senza esempio, condutti da Dio: il mare s’è aperto, una nube vi ha scorto il cammino, la pietra ha versato l’acqua; qui è piovuto la manna, ogni cosa è concorsa nella vostra grandezza; il rimanente dovete far voi."
  "translation_ja": "ここには並々ならぬ心の準備があります。準備がこれほど整っているところに大きな困難はありえません。私が目標にお示しした人々の定めを貴家が取り入れさえすればよいのです。そのうえ前例のない不思議なことが、神の導きでここに現れました。海は開け、雲が道を示し、岩から水がほとばしり、ここにはマナが降りました。あらゆることが貴家の大いなる地位に力を貸してきました。残りはご自身でなさることです。"
  "translation_status": "reviewed"
- "id": "pr-26-008"
  "section_id": "pr-sec-26"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 8
  "source_text": "Dio non vuole far ogni cosa, per non ci torre il libero arbitrio, e parte di quella gloria che tocca a noi. E non è maraviglia, se alcuno de’ prenominati Italiani non ha possuto far quello che si può sperare facci la illustre Casa Vostra, e se in tante revoluzioni d’Italia, e in tanti maneggi di guerra, e’ pare sempre che in quella la virtù militare sia spenta; perchè questo nasce che gli ordini antichi di quella non erano buoni, e non ci è suto alcuno che abbia saputo trovare de’ nuovi."
  "translation_ja": "神は何もかもをみずから行おうとはされません。私たちから自由な意志と、私たちにあずかるべき栄光の一部分とを奪わないためです。先に挙げたイタリア人の誰も、貴家に今期待できることをなしえなかったのも、無数の政変と戦の営みを経ながら、いつもイタリアでは軍事の力が消えているように見えるのも不思議ではありません。古い制度がよくなかったのに、新たな制度を見つけられる人がいなかったためです。"
  "translation_status": "reviewed"
- "id": "pr-26-009"
  "section_id": "pr-sec-26"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 9
  "source_text": "Nessuna cosa fa tanto onore ad uno uomo che di nuovo surga, quanto fanno le nuove leggi e nuovi ordini trovati da lui. Queste cose quando sono ben fondate, ed abbino in loro grandezza, lo fanno reverendo e mirabile, e in Italia non manca materia da introdurvi ogni forma. Qui è virtù grande nelle membra, quando ella non mancasse ne’ capi. Specchiatevi nelli duelli, e nei congressi de’ pochi, quanto gl’Italiani siano superiori con le forze, con la destrezza, con l’ingegno."
  "translation_ja": "新しく興る人に、その人が見つけた新しい法と制度ほど名誉をもたらすものはありません。これらがよい土台と大きさをもつなら、その人は敬われ、驚嘆されます。イタリアには、どんな形でも受け入れられる素材が不足していません。手足には大きな力があるのです。頭にまであればよいのに。決闘や少人数の競い合いで、イタリア人が力でも敏捷さでも才知でも、いかにまさるかをご覧ください。"
  "translation_status": "reviewed"
- "id": "pr-26-010"
  "section_id": "pr-sec-26"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 10
  "source_text": "Ma come si viene agli eserciti, non compariscono; e tutto procede dalla debolezza de’ capi, perchè quelli che sanno, non sono ubbedienti, ed a ciascuno par sapere, non ci essendo infino a qui suto alcuno che si sia rilevato tanto e per virtù e per fortuna, che gli altri cedino."
  "translation_ja": "ところが軍全体になると、見る影もありません。すべて指導者の弱さのせいです。心得のある者は服従せず、誰もが自分こそ知っていると思う。これまで力量と運の両方で抜きんで、ほかの人が一歩譲るほどになった者がいなかったからです。"
  "translation_status": "reviewed"
- "id": "pr-26-011"
  "section_id": "pr-sec-26"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 11
  "source_text": "Di qui nasce che in tanto tempo, in tante guerre fatte ne’ passati venti anni, quando gli è stato un esercito tutto Italiano, sempre ha fatto mala prova; di che è testimone prima il Taro, dipoi Alessandria, Capua, Genova, Vailà, Bologna, Mestri."
  "translation_ja": "そのため過去二十年、これほど長いあいだ、数多く繰り広げられた戦争のなかで、すべてをイタリア人で固めた軍があれば、つねに振るわなかった。最初の証人はタロであり、続いてアレッサンドリア、カプア、ジェノヴァ、ヴァイラ、ボローニャ、メストリがその証人です。"
  "translation_status": "reviewed"
- "id": "pr-26-012"
  "section_id": "pr-sec-26"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 12
  "source_text": "Volendo dunque la illustre Casa Vostra seguitare quelli eccellenti uomini, che redimerono le provincie loro, è necessario innanzi a tutte le altre cose, come vero fondamento d’ogni impresa, provvedersi d’armi proprie; perchè non si può avere nè più fidi, nè più veri, nè migliori soldati. E benchè ciascuno di essi sia buono, tutti insieme diventeranno migliori, quando si vedranno comandare dal loro Principe, e da quello onorare ed intrattenere."
  "translation_ja": "貴家が、地方を解放したかの優れた人々に続こうとされるなら、何より先に、あらゆる事業の真の土台として、自分の軍を備えねばなりません。これほど忠実で、本当に自分のもので、優れた兵はほかにいないからです。一人ずつでもよい兵なのに、自分たちの君主から指揮され、重んじられ、面倒を見てもらっているとわかれば、全員が集まったとき、いっそうよい兵になります。"
  "translation_status": "reviewed"
- "id": "pr-26-013"
  "section_id": "pr-sec-26"

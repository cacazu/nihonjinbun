    "source_sequence": 32
  "source_text": null
  "translation_ja": "二人を同時に敵に回すのは危険だと考えたセウェルスは、ニゲルに対抗し、アルビヌスにはカエサルの称号を与えた。アルビヌスは申し出を本気にした。〔武力による権力奪取の具体的な偽装は非収録。〕"

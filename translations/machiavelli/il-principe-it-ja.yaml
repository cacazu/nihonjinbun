    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XXVI&oldid=3702274"
    "source_sequence": 17
  "source_text": "Nè posso esprimere con quale amore ei fussi ricevuto in tutte quelle provincie che hanno patito per queste illuvioni esterne, con qual sete di vendetta, con che ostinata fede, con che pietà, con che lacrime. Quali porte se gli serrerebbono? Quali popoli li negherebbono la obbidienza? Quale invidia se gli opporrebbe? Quale Italiano gli negherebbe l’ossequio? Ad ognuno puzza questo barbaro dominio."
  "translation_ja": "よそからの洪水に苦しめられたすべての地方において、その人がどんな愛情をもって迎えられるか。どんな復讐への渇き、どんな揺るぎない忠誠、どんな敬愛、どんな涙に迎えられるか。私には言い表せません。どの門がその人に閉ざされるでしょう。どの民が服従を拒むでしょう。どんな妬みがその前に立ちふさがるでしょう。どんなイタリア人が敬意を捧げるのを拒むでしょう。この野蛮な支配は、誰にとっても鼻持ちならないものです。"
  "translation_status": "reviewed"

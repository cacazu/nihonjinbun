    "source_sequence": 15
  "source_text": null
  "translation_ja": "祝宴では教皇アレクサンデルとその子チェーザレの勢力や事業が話題になった。ジョヴァンニと同行の有力市民たちはオリヴェロットの手の者に殺された。〔客を誘導して襲う手順は非収録。〕"

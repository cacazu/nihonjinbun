- "id": "pr-08-021"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 21
  "source_text": null
  "translation_ja": "臆病さや誤った助言のために逆の道を取る者は、いつも刃物を手放せず、けっして臣民を自分の足場にはできない。被害が絶えず新しく加われば、臣民は支配者を信頼できないからである。〔加害の時期を調整する勧めは非収録。〕対照的に、恩恵は少しずつ施せば、いっそうよく味わってもらえるという。"
  "translation_status": "partial"
  "issues":

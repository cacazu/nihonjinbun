    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 1
  "source_text": "CAPITOLO IX. Del Principato civile."
  "translation_ja": "第九章　市民による君主政について"
  "translation_status": "reviewed"
- "id": "pr-09-002"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 2
  "source_text": "Ma venendo all’altra parte quando un Principe cittadino, non per scelleratezza o altra intollerabile violenza, ma con il favore degli altri suoi cittadini diventa Principe della sua patria, il qual si può chiamare Principato civile, nè al pervenirvi è necessario o tutta virtù, o tutta fortuna, ma piuttosto un’astuzia fortunata; dico, che si ascende a questo Principato o col favore del popolo, o col favore de’ grandi."
  "translation_ja": "もう一つの場合に移ろう。普通の市民が、悪事や耐えがたい暴力によらず、同じ市民の支持を得て祖国の君主となる場合である。これは市民による君主政と呼んでよい。その地位に達するには力量がすべてでも、運がすべてでもない。むしろ運の伴った機転がものをいう。この君主政に上るのは、民衆の支持か、有力者たちの支持か、いずれかによってである。"
  "translation_status": "reviewed"
- "id": "pr-09-003"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 3
  "source_text": "Perchè in ogni città si trovano questi duoi umori diversi, e nascono da questo, che il popolo desidera non esser comandato nè oppresso da’ grandi, e i grandi desiderano comandare e opprimere il popolo; e da questi duoi appetiti diversi surge nelle città uno de’ tre effetti, o Principato, o Libertà, o Licenza."
  "translation_ja": "どの都市にも、この二つの異なった気質がある。それが生じるのは、民衆が有力者に命令されたくも抑圧されたくもないと願うのに、有力者のほうは民衆に命令し、これを抑圧したいと願うからだ。この二つの相反する欲求から、都市には三つの結果のどれかが生じる。君主政か、自由か、放縦である。"
  "translation_status": "reviewed"
- "id": "pr-09-004"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 4
  "source_text": "Il Principato è causato o dal popolo, o da’ grandi, secondochè l’una, o l’altra di queste parte ne ha l’occasione; perchè vedendo i grandi non poter resistere al popolo, cominciano a voltare la riputazione ad uno di loro, e lo fanno Principe, per poter sotto l’ombra sua sfogare l’appetito loro. Il popolo ancora volta la riputazione ad un solo, vedendo non poter resistere alli grandi, e lo fa Principe, per essere con l’autorità sua difeso."
  "translation_ja": "君主政を生み出すのは、どちらに機会が回ってくるか次第で、民衆であったり有力者であったりする。有力者たちは民衆に対抗できないと見ると、自分たちの一人に威信を集め、その人物を君主にする。その陰で自分たちの欲を満たそうというわけだ。民衆も有力者に対抗できないと見ると、ただ一人の人物に威信を集めて君主とする。その権威に守ってもらうためである。"
  "translation_status": "reviewed"
- "id": "pr-09-005"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 5
  "source_text": "Colui che viene al Principato con l’aiuto de’ grandi, si mantiene con più difficultà, che quello che diventa con l’aiuto del popolo; perchè si trova Principe con di molti intorno che a loro pare essere eguali a lui; e per questo non gli può nè comandare, nè maneggiare a suo modo. Ma colui che arriva al Principato con il favor popolare, vi si trova solo, e ha intorno o nessuno o pochissimi che non sieno parati ad ubbidire."
  "translation_ja": "有力者の助けで君主になった者は、民衆の助けでなった者より、地位を保つのに苦労する。君主でありながら、自分と対等だと思い込んでいる連中に取り囲まれているからだ。それでは思うままに命令することも、人を動かすこともできない。民衆の支持で君主になった人は、ただ一人頂点に立ち、周囲には従う気のない者は皆無か、いてもほんのわずかである。"
  "translation_status": "reviewed"
- "id": "pr-09-006"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 6
  "source_text": "Oltre a questo, non si può con onestà satisfare a’ grandi, e senza ingiuria d’altri, ma sibbene al popolo; perchè quello del popolo è più onesto fine che quel de’ grandi, volendo questi opprimere, e quello non essere oppresso. Aggiungesi ancora, che del popolo nimico il Principe non si può mai assicurare per essere troppi; de’ grandi si può assicurare per essere pochi."
  "translation_ja": "そのうえ有力者を満足させるには、誠実なまま、他人の権利を傷つけずにすませるわけにいかない。民衆ならそれができる。民衆の目標は有力者の目標より正当だからだ。有力者が望むのは抑圧すること、民衆が望むのは抑圧されないことである。加えて、民衆を敵にすれば数が多すぎて、君主が身を安んじることはできない。有力者は少数だから、身を守る手立てがある。"
  "translation_status": "reviewed"
- "id": "pr-09-007"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 7
  "source_text": "Il peggio che possa aspettare un Principe dal popolo nimico, è l’essere abbandonato da lui; ma da’ grandi nimici non solo debbe temere di essere abbandonato, ma che ancor loro gli venghino contro; perchè essendo in quelli più vedere e più astuzia, avanzano sempre tempo per salvarsi, e cercano gradi con quello che sperano che vinca."
  "translation_ja": "民衆を敵にした君主が予想すべき最悪の事態は、見放されることだ。だが有力者を敵にしたときは、見放されるばかりか、その者たちが向かってくる恐れもある。彼らは先を見る目も機転も利き、身を守るためにいつも先回りして、勝つと見込んだ相手に取り入ろうとするからだ。"
  "translation_status": "reviewed"
- "id": "pr-09-008"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 8
  "source_text": "È necessitato ancora il Principe vivere sempre con quel medesimo popolo, ma può ben fare senza quelli medesimi grandi, potendo farne e disfarne ogni dì, e torre e dare, quando gli piace, riputazione loro."
  "translation_ja": "また君主は、いつも同じ民衆とともに生きるほかないが、同じ有力者を相手にし続ける必要はない。望めば日々でも取り立てたり退けたりし、名望を与えたり取り上げたりできる。"
  "translation_status": "reviewed"
- "id": "pr-09-009"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 9
  "source_text": "E per chiarire meglio questa parte, dico, come i grandi si debbono considerare in duoi modi principalmente, cioè o si governano in modo col procedere loro, che si obbligano in tutto alla tua fortuna, o no; quelli che si obbligano, e non sieno rapaci, si debbono onorare ed amare; quelli che non si obbligano, si hanno a considerare in duoi modi: o fanno questo per pusillanimità e difetto naturale d’animo, ed allora ti debbi servir di loro, e di quelli massime che sono di buon consiglio; perchè nelle prosperità te ne onori, e nelle avversità non hai da temere."
  "translation_ja": "さらに明らかにしよう。有力者には大きく二通りある。振る舞いのすべてをもって君主であるあなたと運命をともにしようとする者と、そうでない者だ。身を結び、かつ強欲でない者は、厚く遇して愛すべきである。身を結ばない者も、さらに二つに分けてみる。臆病さや生来の気の弱さからそうするのであれば、その人を用いてよい。とくに助言が的確な人はそうだ。順境にはあなたの名誉となり、逆境でも恐れる必要はない。"
  "translation_status": "reviewed"
- "id": "pr-09-010"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 10
  "source_text": "Ma quando non si obbligano ad arte, e per cagione ambiziosa, è segno come e’ pensano più a sè, che a te. E da quelli si deve il Principe guardare, e tenergli come se fussero scoperti nimici, perchè sempre nelle avversità l’aiuteranno rovinare. Debbe pertanto uno che diventa Principe per favore del popolo, mantenerselo amico; il che gli fia facile, non domandando lui se non di non essere oppresso."
  "translation_ja": "だが計算ずくの野心から身を結ばない者は、あなたより自分を大切に考えているしるしだ。君主はこうした人には警戒を怠らず、公然たる敵と同然に扱うべきである。逆境になれば彼らは、あなたを滅ぼす手助けをする。だから民衆の支持で君主になった人は、民衆を引き続き友としなければならない。それは難しくない。民衆の求めは抑圧されないことだけなのだから。"
  "translation_status": "reviewed"
- "id": "pr-09-011"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 11
  "source_text": "Ma uno che contro il popolo diventi Principe con il favor de’ grandi, deve innanzi ogni altra cosa cercare di guadagnarsi il popolo; il che gli fia facile, quando pigli la protezione sua."
  "translation_ja": "反対に、民衆の意に逆らい、有力者の支持で君主になった者こそ、何にも先んじて民衆の心を獲得しなければならない。自分が民衆の保護者になることにすれば、それは容易である。"
  "translation_status": "reviewed"
- "id": "pr-09-012"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 12
  "source_text": "E perchè gli uomini, quando hanno bene da chi credevano aver male, si obbligano più al beneficatore loro, diventa il popolo suddito più suo benevolo, che se si fusse condotto al Principato per li suoi favori; e puosselo il Principe guadagnare in molti modi, li quali perchè variano secondo il suggetto, non se ne può dare certa regola; però si lasceranno indietro."
  "translation_ja": "人は害を受けると思っていた相手から恩恵を得ると、恩人にそれだけ強く結びつく。そのため民衆のほうも、自分たちが推して君主にした場合以上に、好意ある臣民となる。君主には民心を得る道がいくつもある。だが相手に応じて違い、決まりきった規則は与えられないから、ここでは省く。"
  "translation_status": "reviewed"
- "id": "pr-09-013"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 13
  "source_text": "Conchiuderò solo che ad un Principe è necessario avere il popolo amico, altrimenti non ha nelle avversità rimedio. Nabide Principe degli Spartani sostenne l’ossidione di tutta Grecia e di uno esercito Romano vittoriosissimo, e difese contro a quelli la patria sua e il suo Stato, e gli bastò solo, sopravvenendo il pericolo, assicurarsi di pochi. Che se egli avessi avuto il popolo nemico, questo non gli bastava."
  "translation_ja": "ただ一つの結論は、君主には民衆を味方にしておく必要がある、そうでなければ逆境に救いはないということだ。スパルタの君主ナビスは全ギリシアと連戦連勝のローマ軍に囲まれ、なお祖国と自分の地位を守った。危機が訪れた際、ごく少数の人への用心だけで足りた。もし民衆を敵にしていたなら、そんなことでは足りなかった。"
  "translation_status": "reviewed"
- "id": "pr-09-014"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 14
  "source_text": "E non sia alcuno che ripugni a questa mia opinione con quel proverbio trito, che chi fonda in sul populo fonda in sul fango; perchè quello è vero, quando un cittadino privato vi fa su fondamento, e dassi ad intendere che il popolo lo liberi quando esso fusse oppresso dagl’inimici, o da’ magistrati; in questo caso si potrebbe trovare spesso ingannato, come intervenne in Roma a’ Gracchi, ed a Firenze a Messer Giorgio Scali."
  "translation_ja": "私の見方に対し、「民衆を土台にする者は泥の上に築く」という使い古した諺で反論しないでほしい。確かに、一私人が民衆を土台とし、敵や役人に押さえつけられても民衆が救ってくれると信じ込むなら、この言葉は当たる。そういう場合には、ローマのグラックス兄弟やフィレンツェのジョルジョ・スカーリ殿のように、しばしば当てが外れるだろう。"
  "translation_status": "reviewed"
- "id": "pr-09-015"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 15
  "source_text": "Ma essendo un Principe quello che sopra vi si fonda, che possa comandare, e sia un uomo di cuore, nè si sbigottisca nelle avversità, e non manchi delle altre preparazioni, e tenga con l’animo e ordini suoi animato l’universale, non si troverà ingannato da lui, e gli parrà aver fatti i suoi fondamenti buoni. Sogliono questi Principati periclitare quando sono per salire dall’ordine civile allo assoluto: perchè questi Principi o comandano per loro medesimi, o per mezzo de’ magistrati."
  "translation_ja": "だが民衆の上に立つのが命令できる君主で、その人に勇気があり、逆境でもおじけず、ほかの備えも怠らず、その気概と制度で人々全体を励ましているのであれば、民衆に期待を裏切られることはなく、よい基礎を築いたのだと分かるだろう。このような君主政が危うくなるのは、市民の制度から絶対的な支配に上ろうとするときだ。君主はみずから命じる場合と、政務官を通じて命じる場合とがある。"
  "translation_status": "reviewed"
- "id": "pr-09-016"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 16
  "source_text": "Nell’ultimo caso è più debole e più pericoloso lo Stato loro, perchè egli stanno al tutto con la volontà di quelli cittadini che sono preposti a’ magistrati, li quali, massimamente ne’ tempi avversi, gli possono torre con facilità grande lo Stato o con fargli contro, o col non l’ubbidire; e il Principe non è a tempo ne’ pericoli a pigliare l’autorità assoluta, perchè li cittadini, e sudditi, che sogliono avere li comandamenti da’ magistrati, non sono in quelli frangenti per ubbidire a’ suoi, e arà sempre ne’ tempi dubbi penuria di chi si possa fidare."
  "translation_ja": "後者なら地位はいっそう弱く、危うい。政務官に就いた市民の意志に全面的に左右されるからである。とくに逆境では、彼らが反対するか、ただ従わないかするだけで、君主から政権を至極容易に取り上げられる。危機に直面してからでは君主が全権を握るいとまはない。日ごろ政務官の命令を受けるのに慣れた市民や臣民は、いざとなって君主の命令には従わない。不確かな時にはいつも、頼れる人材に事欠く。"
  "translation_status": "reviewed"
- "id": "pr-09-017"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 17
  "source_text": "Perchè simil Principe non può fondarsi sopra quello che vede ne’ tempi quieti, quando i cittadini hanno bisogno dello Stato; perchè allora ognuno corre, ognuno promette, e ciascuno vuole morire per lui quando la morte è discosto; ma ne’ tempi avversi, quando lo Stato ha bisogno de’ cittadini, allora se ne trova pochi. E tanto più è questa esperienza pericolosa, quanto la non si può fare se non una volta."
  "translation_ja": "このような君主は、市民が国家を頼る平穏な時代に見る光景を、あてにしてはいけない。そういう時には誰もが駆けつけ、誰もが約束し、命を落とす見込みが遠いかぎり、誰もが君主のために死にたいと言う。だが逆境になり、国家のほうが市民を必要とすると、そういう人はほとんど見当たらない。その試験がなおさら危険なのは、一度しか試せないからだ。"
  "translation_status": "reviewed"
- "id": "pr-09-018"
  "section_id": "pr-sec-09"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_IX&oldid=3702253"
    "source_sequence": 18
  "source_text": "Però uno Principe savio deve pensare un modo, per il quale li suoi cittadini sempre, ed in ogni modo e qualità di tempo, abbino bisogno dello Stato di lui, e sempre poi gli saranno fedeli."
  "translation_ja": "だから賢明な君主は、どういう方法なら、いついかなる時勢、いかなる事情でも、市民が国家と君主を必要とするようになるかを考えねばならない。そうなれば、彼らの忠誠も続く。"
  "translation_status": "reviewed"
- "id": "pr-10-001"
  "section_id": "pr-sec-10"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_X&oldid=3702258"
    "source_sequence": 1
  "source_text": "CAPITOLO X. In che modo le forze di tutti i Principati si debbino misurare."
  "translation_ja": "第十章　あらゆる君主国の力はどのように測るべきか"
  "translation_status": "reviewed"
- "id": "pr-10-002"
  "section_id": "pr-sec-10"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_X&oldid=3702258"
    "source_sequence": 2
  "source_text": "Conviene avere, nell’esaminare le qualità di questi Principati, un’altra considerazione; cioè se un Principe ha tanto Stato, che possa, bisognando, per sè medesimo reggersi, ovvero se ha sempre necessità della defensione d’altri."
  "translation_ja": "これらの君主国の性質を調べるには、なお一つ目を向けるべき点がある。君主は、必要に迫られたとき自力で立てるほどの領国を持つか、それともいつでも他人の保護を必要とするのか、ということである。"
  "translation_status": "reviewed"
- "id": "pr-10-003"
  "section_id": "pr-sec-10"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_X&oldid=3702258"
    "source_sequence": 3
  "source_text": "E, per chiarire meglio questa parte, dico, come io giudico potersi coloro reggere per sè medesimi, che possono o per abbondanzia d’uomini, o di danari, mettere insieme un esercito giusto, e fare una giornata con qualunque li viene ad assaltare; e così giudico coloro aver sempre necessità d’altri, che non possono comparire contro gli inimici in campagna, ma sono necessitati rifuggirsi dentro alle mura, e guardare quelle. Nel primo caso si è discorso; e per l’avvenire diremo quello che ne occorre."
  "translation_ja": "はっきり言えば、人的資源か金銭が豊かなために相応の軍を集め、どんな来攻者とも一戦を交えられる者を、私は自力で立てる者と見る。敵を野に迎えることができず、城壁の中へ逃れ、そこで守るほかない者は、いつも他人の助けを必要とすると見る。初めの場合はすでに論じたし、この先でも必要があれば話す。"
  "translation_status": "reviewed"
- "id": "pr-10-004"
  "section_id": "pr-sec-10"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_X&oldid=3702258"
    "source_sequence": 4
  "source_text": "Nel secondo caso non si può dire altro, salvo che confortare tali Principi a munire e fortificare la terra propria, e del paese non tenere alcun conto."
  "translation_ja": "第二の場合には、そうした君主に、自分の都市を守り固め、周囲の田園まで気にかけないよう勧めるほかには、さほど言うことはない。"
  "translation_status": "reviewed"
- "id": "pr-10-005"
  "section_id": "pr-sec-10"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_X&oldid=3702258"
    "source_sequence": 5
  "source_text": "E qualunque arà bene fortificata la sua terra, e circa gli altri governi con i sudditi si sia maneggiato, come di sopra è detto, e di sotto si dirà, sarà sempre assaltato con gran rispetto; perchè gli uomini sono sempre nimici delle imprese, dove si vegga difficultà; nè si può vedere facilità assaltando uno che abbia la sua terra gagliarda, e non sia odiato dal popolo."
  "translation_ja": "自分の都市を堅固にし、臣民の統治についても、すでに述べたように、またこれから述べるように振る舞ってきた者には、誰でも攻撃をためらう。人は困難が目に見えている企てを嫌うものだ。都市は強固で、民衆にも憎まれていない相手を攻めることが容易なはずはない。"
  "translation_status": "reviewed"
- "id": "pr-10-006"
  "section_id": "pr-sec-10"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_X&oldid=3702258"
    "source_sequence": 6
  "source_text": null
  "translation_ja": "ドイツの都市はきわめて自由で、農村部の領地をほとんど持たず、皇帝にも従いたいときにだけ従う。皇帝も近くの強国も恐れない。落とすには難渋して時間もかかると誰もが思うほど、守りが堅いからである。〔防御施設と軍備の具体的な構成は非収録。〕公共の倉には一年分の食料と飲み物、燃料を常に蓄えている。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "該当段落の原文を非収録：都市防衛の具体的な軍備構成。政治的文脈を訳文に残す。"
- "id": "pr-10-007"
  "section_id": "pr-sec-10"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_X&oldid=3702258"
    "source_sequence": 7
  "source_text": "Ed oltre a questo, per potere tenere la plebe pasciuta, e senza perdita del pubblico, hanno sempre in comune per un anno da poter dar loro da lavorare in quelli esercizi che siano il nervo e la vita di quella città, e dell’industria de’ quali la plebe si pasca; tengono ancora gli esercizi militari in riputazione, e sopra questo hanno molti ordini a mantenerli."
  "translation_ja": "そればかりでなく、民衆を飢えさせず、しかも公に損失が出ないよう、都市の生命線となり、庶民がそれで暮らしを立てている産業について、一年間は仕事を与えられるだけのものを共同で用意しておく。軍事訓練も高く評価し、それを維持する制度をいくつも持っている。"
  "translation_status": "reviewed"
- "id": "pr-10-008"
  "section_id": "pr-sec-10"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_X&oldid=3702258"
    "source_sequence": 8
  "source_text": "Un Principe adunque che abbia una città forte, e non si facci odiare, non può essere assaltato; e se pur fusse chi lo assaltasse, se ne partirebbe con vergogna; perchè le cose del mondo sono sì varie, che egli è quasi impossibile che uno possa con gli eserciti stare un anno ozioso, e campeggiarlo."
  "translation_ja": "したがって強い都市を持ち、憎しまれないようにしている君主には、攻撃の手は向かわない。仮に攻める者があっても、不名誉を負って引き揚げるだろう。世の事柄はあまりに変わりやすく、軍を丸一年もほかに動かさず、包囲にかかりきるなど、まず不可能だからである。"
  "translation_status": "reviewed"
- "id": "pr-10-009"
  "section_id": "pr-sec-10"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_X&oldid=3702258"
    "source_sequence": 9
  "source_text": "E chi replicasse, se il popolo arà le sue possessioni fuora, e veggale ardere, non arà pazienza; e il lungo assedio e la carità propria gli farà dimenticare il Principe; rispondo che un Principe potente ed animoso supererà sempre quelle difficultà, dando ora speranza a’ sudditi che il male non sia lungo, ora timore della crudeltà del nimico, ora assicurandosi con destrezza di quelli che gli paressono troppo arditi."
  "translation_ja": "だが、民衆の財産が城外にあり、それが焼けるのを見れば、長い包囲に我慢できず、自分のことがかわいくて君主を忘れるのではないか、と言う人もいよう。それには、力と勇気のある君主は困難を乗り越えられると答える。苦しみは長く続かないという希望を、ときには敵の残酷さへの恐れを民に抱かせ、あまりに大胆と見える者にも巧みに対処するからである。"
  "translation_status": "reviewed"
- "id": "pr-10-010"
  "section_id": "pr-sec-10"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_X&oldid=3702258"
    "source_sequence": 10
  "source_text": null
  "translation_ja": "〔敵が城外に加える破壊の時機とその効果を論じる具体的な部分は非収録。〕いったん損害が出て、もはや取り返しがつかなくなると、住民はむしろ自分の君主といっそう強く結ばれる。君主を守るために家を焼かれ、財産も滅ぼされたからには、君主が自分たちに負い目を持つはずだと思うからである。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "該当段落の原文を非収録：占領に伴う放火の時機・心理的効果を述べる箇所。"
- "id": "pr-10-011"
  "section_id": "pr-sec-10"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_X&oldid=3702258"
    "source_sequence": 11
  "source_text": "E la natura degli uomini è, così obligarsi per li beneficii che essi fanno, come per quelli che essi ricevono. Onde se si considera bene tutto, non fia difficile a un Principe prudente tenere prima e poi fermi gli animi de’ suoi cittadini nella ossidione, quando non gli manchi da vivere, nè da difendersi."
  "translation_ja": "人は受けた恩だけでなく、みずから施した恩によっても相手に結ばれる性質がある。こうしてすべてをよく考えれば、市民に生活と防衛の手段が不足しないかぎり、思慮ある君主が包囲の初めから終わりまで人心をしっかり保つのは難しくない。"
  "translation_status": "reviewed"
- "id": "pr-11-001"
  "section_id": "pr-sec-11"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 1
  "source_text": "CAPITOLO XI. De’ Principati Ecclesiastici."
  "translation_ja": "第十一章　教会の君主国について"
  "translation_status": "reviewed"
- "id": "pr-11-002"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 2
  "source_text": "Restaci solamente al presente a ragionare de’ Principati Ecclesiastici, circa i quali tutte le difficultà sono avanti che si possegghino; perchè si acquistano o per virtù o per fortuna, e senza l’una e l’altra si mantengono; perchè sono sostentati dagli ordini anticati nella Religione, quali sono tutti potenti, e di qualità, che tengono i loro Principi in istato in qualunque modo si procedino e vivino."
  "translation_ja": "いま残るのは、教会の君主国を論じることだけである。ここでは困難は、すべて領有する前にある。手に入れるには力量か運がいるが、保つのにはどちらもいらない。宗教に根ざした古い制度に支えられているからである。その制度の力はきわめて強く、君主が何をし、どんな暮らしをしようと、地位にとどめておく性質を持つ。"
  "translation_status": "reviewed"
- "id": "pr-11-003"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 3
  "source_text": "Costoro soli hanno Stati e non gli difendono, hanno sudditi e non gli governano; e gli Stati, per essere indifesi, non sono loro tolti; e li sudditi, per non essere governati, non se ne curano, nè pensano nè possono alienarsi da loro. Solo adunque questi Principati sono sicuri e felici. Ma essendo quelli retti da cagioni superiori, alle quali la mente umana non aggiugne, lascerò il parlarne, perchè essendo esaltati e mantenuti da Dio, sarebbe ufficio d’uomo presuntuoso e temerario il discorrerne."
  "translation_ja": "彼らだけは国があっても防衛せず、臣民がいても統治しない。国は無防備でも奪われず、臣民は統治されないことを気にもかけず、離れようと思いもせず、離れることもできない。だからこの君主国だけが安全で幸福である。とはいえ、これを治めるのは人の知恵の及ばない高次の原因であるから、私はこれ以上述べまい。神によって高められ、支えられるものを論じるのは、思い上がった無鉄砲な人間のすることだからだ。"
  "translation_status": "reviewed"
- "id": "pr-11-004"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 4
  "source_text": "Nondimanco se alcuno mi ricerca donde viene che la Chiesa nel temporale sia venuta a tanta grandezza, conciossiachè da Alessandro indietro i potentati Italiani, e non solamente quelli che si chiamano potentati, ma ogni Barone e Signore, benchè minimo, quanto al temporale, la stimava poco; e ora un Re di Francia ne trema, e l’ha potuto cavare d’Italia, e rovinare i Viniziani; ancorachè ciò noto sia, non mi pare superfluo ridurlo in qualche parte alla memoria."
  "translation_ja": "それでも、教会が世俗の事柄でこれほど大きくなったのはなぜか、と私に尋ねる人もあろう。アレクサンデル以前にはイタリアの諸国はもちろん、諸国と呼べるほどでもない、どれほど小さな諸侯や領主も、世俗における教会の力など高く買っていなかった。それがいまは一国のフランス王まで震え上がり、教会にはその王をイタリアから追い払い、ヴェネツィアを打ちのめすほどの力があった。よく知られた話とはいえ、いくらか思い起こすのは無駄ではなかろう。"
  "translation_status": "reviewed"
- "id": "pr-11-005"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 5
  "source_text": "Avanti che Carlo Re di Francia passasse in Italia, era questa provincia sotto l’imperio del Papa, Viniziani, Re di Napoli, Duca di Milano, e Fiorentini. Questi Potentati avevano ad avere due cure principali: l’una, che un forestiero non entrasse in Italia con l’armi; l’altra, che nessuno di loro occupasse più stato. Quelli, a chi s’aveva più cura, erano il Papa e Viniziani."
  "translation_ja": "フランス王シャルルがイタリアに入る前、この地方を支配していたのは教皇、ヴェネツィア、ナポリ王、ミラノ公、フィレンツェであった。これらの勢力にとっておもな関心は二つあった。外国勢が軍を率いてイタリアに入らないこと、そして仲間のどれも領土をこれ以上手に入れないことだ。特に注意が向けられたのは教皇とヴェネツィアだった。"
  "translation_status": "reviewed"
- "id": "pr-11-006"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 6
  "source_text": "Ed a tenere addietro i Viniziani, bisognava l’unione di tutti gli altri, come fu nella difesa di Ferrara; e a tenere basso il Papa si servivano de’ Baroni di Roma, li quali essendo divisi in due fazioni, Orsini e Colonnesi, sempre v’era cagione di scandoli tra loro, e stando con l’armi in mano in su gli occhi del Pontefice, tenevano il Pontificato debole ed infermo."
  "translation_ja": "ヴェネツィアを押しとどめるには、フェラーラを守ったときのように、ほかのすべての国が団結する必要があった。教皇の力を低く抑えるためにはローマの諸侯が利用された。彼らはオルシーニ、コロンナの二派に分かれ、内紛の種が尽きず、教皇の目の前で武器を手にしていた。そのため教皇権は弱く、不安定なままだった。"
  "translation_status": "reviewed"
- "id": "pr-11-007"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 7
  "source_text": "E benchè surgesse qualche volta un Papa animoso, come fu Sisto; pure la fortuna o il sapere non lo potè mai disobbligare da queste incomodità. E la brevità della vita loro ne era cagione, perchè in dieci anni che ragguagliato viveva un Papa, a fatica che potesse abbassare l’una delle fazioni; e, se per modo di parlare, l’uno aveva quasi spenti i Colonnesi, surgeva un altro nimico agli Orsini, che gli faceva risurgere, e non era a tempo a spegnerli."
  "translation_ja": "ときにはシクストゥスのような気概のある教皇も出たが、運によっても知恵によっても、こうした厄介から解放されるには至らなかった。一つの原因は、教皇の余命の短さだった。平均して教皇の在位する十年ほどでは、一方の派閥を弱めるのがやっとである。ある教皇が、たとえばコロンナ派をほぼ倒しても、次にはオルシーニ派を敵とする教皇が立ち、コロンナ派をよみがえらせ、自分はオルシーニ派を滅ぼすまでの時間を持てないのだった。"
  "translation_status": "reviewed"
- "id": "pr-11-008"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 8
  "source_text": "Questo faceva che le forze temporali del Papa erano poco stimate in Italia. Surse dipoi Alessandro VI, il quale di tutti li Pontefici che sono stati mai, mostrò quanto un Papa e con il danaio, e con le forze si poteva prevalere; e fece con l’istrumento del Duca Valentino, e con la occasione della passata de’ Francesi tutte quelle cose, che io ho discorso di sopra nelle azioni del Duca."
  "translation_ja": "このため教皇の世俗の力はイタリアで軽く見られていた。そこに登場したアレクサンデル六世は、かつてのどの教皇にも増して、一人の教皇が資金と兵力でどこまでできるかを示した。ヴァレンティーノ公を手足とし、フランス軍の侵入を機会ととらえ、公の行いについて先に述べたすべてのことを実行したのである。"
  "translation_status": "reviewed"
- "id": "pr-11-009"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 9
  "source_text": "E benchè l’intento suo non fusse di far grande la Chiesa, ma il Duca; nondimeno ciò che fece, tornò a grandezza della Chiesa, la quale dopo la sua morte, spento il Duca, fu erede delle fatiche sue."
  "translation_ja": "彼の目的は教会でなく公を大きくすることにあった。だがやったことはすべて教会を大きくする結果に終わった。教皇の死後に公が没落すると、その労苦の果実を相続したのは教会だった。"
  "translation_status": "reviewed"
- "id": "pr-11-010"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 10
  "source_text": "Venne dipoi Papa Iulio, e trovò la Chiesa grande, avendo tutta la Romagna, ed essendo spenti tutti li Baroni di Roma, e per le battiture d’Alessandro annullate quelle fazioni; e trovò ancora la via aperta al modo dell’accumulare danari, non mai più usitato da Alessandro indietro."
  "translation_ja": "続いて教皇ユリウスが立ったとき、教会はすでに大きかった。ロマーニャ全土を領し、ローマの諸侯の勢いはことごとく消え、アレクサンデルに痛めつけられた派閥は力を失っていた。しかもアレクサンデル以前には誰も使わなかったような資金調達の道まで、すでに開かれていた。"
  "translation_status": "reviewed"
- "id": "pr-11-011"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 11
  "source_text": "Le quali cose Iulio non solamente seguitò, ma accrebbe, e pensò guadagnarsi Bologna, e spegnere i Viniziani, e cacciare i Francesi d’Italia; e tutte queste imprese gli riuscirono, e con tanta più sua laude, quanto fece ogni cosa per accrescere la Chiesa, e non alcun privato."
  "translation_ja": "ユリウスは前任者の仕事を引き継いだだけでなく、さらに拡大した。ボローニャを手に入れ、ヴェネツィア勢を倒し、フランス勢をイタリアから追い払うことを企て、そのすべてをなし遂げた。しかも個人でなく教会を大きくするためにすべてを行っただけに、名誉もいっそう高かった。"
  "translation_status": "reviewed"
- "id": "pr-11-012"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 12
  "source_text": "Mantenne ancora le parti Orsine e Colonnesi in quelli termini che le trovò; e benchè tra loro fusse qualche capo da fare alterazione, nientedimeno due cose gli ha tenuti fermi: l’una, la grandezza della Chiesa che gli sbigottisce; l’altra, il non avere loro Cardinali, quali sono origine di tumulti tra loro; nè mai staranno quiete queste parti qualunque volta abbino Cardinali, perchè questi nutriscono in Roma e fuori le parti, e quelli Baroni sono forzati a difenderle; e così dall’ambizione de’ Prelati nascono le discordie e tumulti tra’ Baroni."
  "translation_ja": "オルシーニとコロンナの両派も、就任したときの状態のままに抑えておいた。混乱を起こしそうな頭目は幾人かいたが、二つのものが彼らを静かにさせた。一つは彼らをおじけづかせる教会の強大さ、もう一つは、自陣に紛争の源となる枢機卿がいなかったことだ。この派閥に枢機卿がつくかぎり、静かになることはけっしてない。枢機卿はローマの内外で党派を養い、諸侯はその党派を守らざるをえない。こうして高位聖職者の野心から、諸侯間の不和と騒乱が生まれる。"
  "translation_status": "reviewed"
- "id": "pr-11-013"
  "section_id": "pr-sec-11"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XI&oldid=3702259"
    "source_sequence": 13
  "source_text": "Ha trovato adunque la Santità di Papa Leone questo Pontificato potentissimo, del quale si spera che se quelli lo fecero grande con l’armi, esso con la bontà ed infinite altre sue virtù lo farà grandissimo e venerando."
  "translation_ja": "このようにして、教皇レオ聖下が継がれた教皇権はきわめて強大であった。先代たちが武力をもってこれを大きくしたのなら、聖下はその善良さと数えきれないほかの美徳によって、これをいよいよ大きく、尊ぶべきものとなさるよう期待される。"
  "translation_status": "reviewed"
- "id": "pr-12-001"
  "section_id": "pr-sec-12"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 1
  "source_text": "CAPITOLO XII. Quante siano le spezie della milizia, e de’ soldati mercenari."
  "translation_ja": "第十二章　軍隊の種類と傭兵について"
  "translation_status": "reviewed"
- "id": "pr-12-002"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 2
  "source_text": "Avendo discorso particolarmente tutte le qualità di quelli Principati, de’ quali nel principio proposi di ragionare, e considerato in qualche parte le cagioni del bene e del male essere loro, e mostro i modi con li quali molti hanno cerco d’acquistargli e tenergli; mi resta ora a discorrere generalmente le offese e difese, che in ciascuno dei prenominati possono accadere. Noi abbiamo detto di sopra come ad un Principe è necessario avere li suoi fondamenti buoni; altrimente di necessità conviene che rovini."
  "translation_ja": "初めに論じると申し上げた君主国の種類は、それぞれに取り上げた。盛衰の原因もいくらか考察し、多くの人が獲得と維持に試みた方法を示した。残るは、どの君主国にも起こりうる攻防を、一般的に論じることである。君主にはよい土台が必要で、さもなければ必ず倒れるとは、すでに述べたとおりである。"
  "translation_status": "reviewed"
- "id": "pr-12-003"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 3
  "source_text": "I principali fondamenti che abbino tutti gli Stati, così nuovi come vecchi o misti, sono le buone leggi e le buone armi; e perchè non possono essere buone leggi dove non sono buone armi, e, dove sono buone armi conviene che siano buone leggi; io lascerò indietro il ragionare delle leggi, e parlerò dell’armi. Dico adunque, che l’armi, con le quali un Principe difende il suo Stato, o le sono proprie, o le sono mercenarie, o ausiliarie, o miste."
  "translation_ja": "新しい国、古い国、複合的な国を問わず、すべての国のおもな土台は、よい法律とよい軍隊である。よい軍隊がないところによい法律はありえず、よい軍隊があればよい法律もあるはずだから、法律の話は置き、軍隊を論じることにする。君主が国を守るために頼む軍隊には、自前の軍、傭兵、援軍、それらを合わせた混成軍がある。"
  "translation_status": "reviewed"
- "id": "pr-12-004"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 4
  "source_text": "Le mercenarie ed ausiliari sono inutili e pericolose; e se uno tiene lo Stato suo fondato in su l’armi mercenarie, non starà mai fermo nè sicuro, perchè le sono disunite, ambiziose, e senza disciplina, infedeli, gagliarde tra gli amici, tra li nimici vili, non hanno timore di Dio, non fede con gli uomini, e tanto si differisce la rovina, quanto si differisce l’assalto; e nella pace siei spogliato da loro, nella guerra da’ nimici."
  "translation_ja": "傭兵と援軍は役に立たず、危険である。傭兵を土台に据えた国には、安定も安全もない。傭兵はまとまりがなく、野心があり、規律を欠き、不忠である。味方のなかでは勇ましいが敵の前では臆病で、神を畏れず、人との信義も守らない。破滅の先延ばしは攻撃の先延ばしでしかない。平時は彼らに、戦時は敵に略奪される。"
  "translation_status": "reviewed"
- "id": "pr-12-005"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 5
  "source_text": "La cagione di questo è, che non hanno altro amore, nè altra cagione che le tenga in campo, che un poco di stipendio, il quale non è sufficiente a fare che e’ voglino morire per te. Vogliono bene essere tuoi soldati mentre che tu non fai guerra; ma come la guerra viene, o fuggirsi o andarsene."
  "translation_ja": "理由は、わずかな給金以外に彼らの心を結び、戦場にとどめるものがないからだ。その給金では、あなたのために死のうという気にはならない。あなたが戦争をしないかぎり、喜んであなたの兵でいるが、戦争となれば、逃げるか立ち去る。"
  "translation_status": "reviewed"
- "id": "pr-12-006"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 6
  "source_text": "La qual cosa dovrei durar poca fatica a persuadere, perchè la rovina d’Italia non è ora causata da altra cosa, che per essere in spazio di molti anni riposatasi in sull’armi mercenarie, le quali feciono già per qualcuno qualche progresso, e parevano gagliarde tra loro; ma come venne il forestiero, elle mostrarono quello che l’erano."
  "translation_ja": "これを納得してもらうのに苦労はいらないはずだ。今日のイタリアの破滅は、長年傭兵に身をゆだねたこと以外に原因はない。かつては多少の成功を誰かにもたらし、身内の間ではいかにも強そうだったが、外国勢が来ると正体をさらした。"
  "translation_status": "reviewed"
- "id": "pr-12-007"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 7
  "source_text": "Onde è che a Carlo Re di Francia fu lecito pigliare Italia col gesto; e chi diceva che ne erano cagione i peccati nostri, diceva il vero; ma non erano già quelli che credeva, ma questi ch’io ho narrato. E perchè gli erano peccati di Principi, ne hanno patita la pena ancora loro. Io voglio dimostrare meglio la infelicità di queste armi."
  "translation_ja": "このためフランス王シャルルは、ひと振りの身ぶりでイタリアを手に入れられた。われわれ自身の罪のせいだと言った人は正しかった。ただしその人が思ったような罪ではなく、私が語った罪である。そして罪が君主たちのものだったので、罰は彼ら自身にも及んだ。こうした軍隊の頼りなさをもう少し明らかにしよう。"
  "translation_status": "reviewed"
- "id": "pr-12-008"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 8
  "source_text": "I capitani mercenari o sono uomini eccellenti, o no; se sono, non te ne puoi fidare, perchè sempre aspirano alla grandezza propria o con l’opprimere te, che li siei padrone, o con l’opprimere altri fuora della tua intenzione; ma se non è il capitano virtuoso, ti rovina per l’ordinario."
  "translation_ja": "傭兵隊長は有能か、そうでないかだ。有能なら信頼できない。雇い主のあなたを圧迫するか、あなたの意向に背いてほかの誰かを圧迫するかして、つねに自分を大きくしたがるからである。隊長に力量がなければ、ふつうはその無能のためあなたが滅びる。"
  "translation_status": "reviewed"
- "id": "pr-12-009"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 9
  "source_text": "E se si risponde, che qualunque arà l’arme in mano, farà questo medesimo, o mercenario o no; replicherei, come l’armi hanno ad essere adoperate o da un Principe, o da una Repubblica; il Principe deve andare in persona, e fare lui l’ufficio del capitano; la Repubblica ha da mandare i suoi cittadini; e quando ne manda uno che non riesca valente, debbe cambiarlo; e quando sia, tenerlo con le leggi che non passi il segno."
  "translation_ja": "武器を握れば傭兵でなくても同じではないか、という反論には、軍隊の使用者は君主か共和国でなければならないと答えよう。君主は自ら出向いて指揮官の役を果たすべきだ。共和国は自国市民を送り、その人が有能でなければ交替させ、有能なら法律によって一線を越えないようにすべきである。"
  "translation_status": "reviewed"
- "id": "pr-12-010"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 10
  "source_text": "E per esperienza si vede i Principi soli, e le Repubbliche armate fare progressi grandissimi, e l’armi mercenarie non fare mai se non danno; e con più difficultà viene all’ubbidienza di un suo cittadino una Repubblica armata di armi proprie, che un’armata d’armi forestiere. Sterono Roma e Sparta molti secoli armate e libere. I Svizzeri sono armatissimi e liberissimi."
  "translation_ja": "君主自身と自ら武装した共和国は大きく発展し、傭兵は害にしかならないことを経験は示している。自前の軍を持つ共和国のほうが、外国の軍を持つ共和国より、一市民の支配を受けにくい。ローマもスパルタも数世紀にわたり武装して自由だった。スイス人は十分に武装し、きわめて自由である。"
  "translation_status": "reviewed"
- "id": "pr-12-011"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 11
  "source_text": "Dell’armi mercenarie antiche, per esempio, ci sono li Cartaginesi, li quali furono per essere oppressi da loro soldati mercenari, finita la prima guerra co’ Romani, ancorachè i Cartaginesi avessero per capitani propri cittadini. Filippo Macedone fu fatto da’ Tebani, dopo la morte di Epaminonda, capitano della loro gente, e tolse loro, dopo la vittoria, la libertà."
  "translation_ja": "古代の傭兵にはカルタゴの例がある。第一回の対ローマ戦争が終わると、指揮官には自国市民を用いていたにもかかわらず、自分の傭兵たちに征服されそうになった。テーバイ人はエパメイノンダスの死後、マケドニアのフィリッポスに自軍を任せたが、彼は勝利の後で彼らの自由を奪った。"
  "translation_status": "reviewed"
- "id": "pr-12-012"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 12
  "source_text": "I Milanesi, morto il Duca Filippo, soldarono Francesco Sforza contro a’ Veniziani; il quale, superati li nimici a Caravaggio, si congiunse con loro per opprimere i Milanesi suoi padroni. Sforza suo padre, essendo soldato della Regina Giovanna di Napoli, la lasciò in un tratto disarmata, onde ella, per non perdere il Regno, fu costretta gettarsi in grembo al Re d’Aragona."
  "translation_ja": "ミラノ人はフィリッポ公の死後、ヴェネツィアと戦うためフランチェスコ・スフォルツァを雇った。彼はカラヴァッジョで敵を破るとその敵と手を結び、雇い主のミラノ人を抑え込んだ。父のスフォルツァもナポリ女王ジョヴァンナに雇われていたが、にわかに女王を丸腰で放り出した。王国を失うまいとして、女王はアラゴン王の懐に飛び込まざるをえなかった。"
  "translation_status": "reviewed"
- "id": "pr-12-013"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 13
  "source_text": "E se i Viniziani e Fiorentini hanno accresciuto per l’addietro lo imperio loro con queste armi, e li loro capitani non se ne sono però fatti Principi, ma gli hanno difesi; rispondo, che gli Fiorentini in questo caso sono stati favoriti dalla sorte; perchè de’ capitani virtuosi, i quali potevano temere, alcuni non hanno vinto, alcuni hanno avuto opposizioni, altri hanno volto l’ambizione loro altrove."
  "translation_ja": "それでもヴェネツィア人とフィレンツェ人はかつてこの軍隊で領土を広げ、隊長たちは君主にならず国を守ったではないか、と言われるかもしれない。フィレンツェについては、運に恵まれたと答える。彼らが恐れるべき有能な隊長のうち、ある者は勝てず、ある者は対抗者を持ち、ある者は野心をほかへ向けた。"
  "translation_status": "reviewed"
- "id": "pr-12-014"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 14
  "source_text": "Quello che non vinse fu Giovanni Acuto, del quale, non vincendo, non si potea cognoscere la fede; ma ognuno confesserà, che, vincendo, stavano i Fiorentini a sua discrezione. Sforza ebbe sempre i Bracceschi contrari, che guardrono l’uno l’altro. Francesco volse l’ambizione sua in Lombardia. Braccio contro la Chiesa e il Regno di Napoli. Ma vegniamo a quello che è seguito poco tempo fa."
  "translation_ja": "勝てなかったのはジョヴァンニ・アクートである。勝たなかった以上、その忠誠は試せなかったが、勝っていればフィレンツェ人の運命は彼の胸一つだったことは、誰もが認めよう。スフォルツァにはつねにブラッチョ派という対抗者があり、互いににらみ合っていた。フランチェスコは野心をロンバルディアに向け、ブラッチョは教会とナポリ王国に向けた。だが、もっと最近の例に移ろう。"
  "translation_status": "reviewed"
- "id": "pr-12-015"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 15
  "source_text": "Feciono i Fiorentini Paolo Vitelli loro capitano, uomo prudentissimo, e che di privata fortuna aveva presa riputazione grandissima. Se costui espugnava Pisa, veruno fia che nieghi come e’ conveniva a’ Fiorentini stare seco; perchè, se fusse diventato soldato de’ loro nemici, non avevano rimedio, e tenendolo, aveano ad ubbidirlo."
  "translation_ja": "フィレンツェはパオロ・ヴィテッリを指揮官とした。非常に思慮深く、一介の私人から大いなる名声を得た人物だ。彼がピサを攻め落としていたら、フィレンツェは彼に従わなければならなかったことを、誰が否定できよう。敵に雇われれば打つ手がなく、引きとめればその言うことを聞かねばならなかったからだ。"
  "translation_status": "reviewed"
- "id": "pr-12-016"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 16
  "source_text": "I Viniziani, se si considera i progressi loro, si vedrà quelli sicuramente e gloriosamente avere operato, mentrechè feciono guerra loro propri, che fu avanti che si volgessino con l’imprese in terra, dove con li gentiluomini e con la plebe armata operarono virtuosamente; ma come cominciarono a combattere in terra, lasciarono questa virtù, e seguitarono i costumi d’Italia."
  "translation_ja": "ヴェネツィア人の足跡をたどると、彼らがみずから戦ったあいだ、すなわち陸上に事業の矛先を向ける前までは、安全に、名誉をもって行動したことがわかる。貴族と武装した庶民とで力をふるった。しかし陸上で戦い始めると、この長所を捨て、イタリア一般の習慣にならった。"
  "translation_status": "reviewed"
- "id": "pr-12-017"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 17
  "source_text": "E nel principio dell’augumento loro in terra, per non avere molto stato, e per essere in gran riputazione, non avevano da temere molto de’ loro capitani; ma come essi ampliarono, che fu sotto il Carmignuola, ebbono un saggio di questo errore; perchè, vedutolo virtuosissimo, battuto che ebbero sotto il suo governo il Duca di Milano, e cognoscendo dall’altra parte, come egli era freddo nella guerra, giudicarono non potere più vincere con lui, perchè non volevano, nè poteano licenziarlo, per non perdere ciò che avevano acquistato, ondechè furono necessitati, per assicurarsi, di ammazzarlo."
  "translation_ja": "陸上に進出した初めは、領土がさほど広くなく、名声は大きかったので、隊長を恐れる必要はさしてなかった。だがカルマニョーラのもとで領土が拡大すると、この過ちの味を知った。彼は力量にすぐれ、その指揮でミラノ公を破ったが、他方では戦いに熱意がないと知れた。彼とではこれ以上勝てないと判断しても、獲得したものを失わぬためには解任したくもなく、することもできなかった。結局、ヴェネツィア人は身の安全を図って彼を殺すしかなかった。"
  "translation_status": "reviewed"
- "id": "pr-12-018"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 18
  "source_text": "Hanno dipoi avuto per loro capitani Bartolommeo da Bergamo, Ruberto da S. Severino, il Conte di Pitigliano, e simili, con li quali avevano da temere della perdita, non del guadagno loro; come intervenne dipoi a Vailà, dove in una giornata perderono quello che in ottocento anni con tante fatiche avevano acquistato; perchè da queste armi nascono solo i lenti, tardi e deboli acquisti, e le subite e miracolose perdite."
  "translation_ja": "その後の隊長にはベルガモのバルトロメオ、サン・セヴェリーノのロベルト、ピティリアーノ伯らがいた。彼らとともにある限り、その勝ちすぎでなく、その負けを恐れることになった。事実ヴァイラでは、一日の戦いで八百年の苦労による獲得物を失った。この種の軍がもたらす獲得は遅く、のろく、頼りなく、その喪失は一瞬で、驚くほどである。"
  "translation_status": "reviewed"
- "id": "pr-12-019"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 19
  "source_text": "E perchè io sono venuto con questi esempi in Italia, la quale è stata governata già molti anni dall’armi mercenarie, le voglio discorrere più da alto; acciocchè veduta l’origine e progressi di esse, si possano meglio correggere."
  "translation_ja": "これらの例でイタリアの話になった。イタリアはすでに長年傭兵の軍に支配されてきたので、さらに由来までさかのぼって論じたい。その起こりと歩みを見れば、問題を正すことも容易になるからだ。"
  "translation_status": "reviewed"
- "id": "pr-12-020"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 20
  "source_text": "Avete da intendere come, tostochè in questi ultimi tempi, l’Imperio cominciò ad essere ributtato d’Italia, e che il Papa nel temporale vi prese più riputazione, si divise l’Italia in più Stati; perchè molte delle città grosse presono l’armi contro i loro nobili, li quali prima, favoriti dall’Imperadore, le tenevano oppresse, e la Chiesa le favoriva per darsi riputazione nel temporale; di molte altre i loro cittadini ne diventarono Principi."
  "translation_ja": "近い時代に帝国の力がイタリアから押し返され始め、教皇がイタリアの世俗の事柄で威信を得るにつれて、イタリアはいくつもの国に分かれた。それまで皇帝の後援で圧迫してきた貴族に対し、多くの大都市が武器を取って立った。教会は世俗における自らの威信を高めようと、都市側に味方した。また別の多くの都市では、市民の一人が君主となった。"
  "translation_status": "reviewed"
- "id": "pr-12-021"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 21
  "source_text": "Ondechè, essendo venuta l’Italia quasi in mano della Chiesa, e di qualche Repubblica; ed essendo quelli Preti e quelli altri cittadini usi a non cognoscere l’armi, incominciarono a soldare forestieri. Il primo che dette riputazione a questa milizia, fu Alberigo da Como Romagnuolo. Dalla disciplina di costui discese, tra gli altri, Braccio e Sforza, che ne’ loro tempi furono arbitri d’Italia."
  "translation_ja": "こうしてイタリアの大半が教会といくつかの共和国の手に入ると、一方は聖職者、他方は市民で、どちらも軍事に不慣れだったから、外国人を雇い始めた。この軍務に最初に名声を与えたのは、ロマーニャ人アルベリーゴ・ダ・コモである。その門下からはブラッチョ、スフォルツァらが出て、一時代のイタリアの裁定者となった。"
  "translation_status": "reviewed"
- "id": "pr-12-022"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 22
  "source_text": "Dopo questi vennero tutti gli altri, che fino a’ nostri tempi hanno governato l’armi d’Italia; ed il fine delle lor virtù è stato, che quella è stata corsa da Carlo, predata da Luigi, forzata da Ferrando, e vituperata da’ Svizzeri. L’ordine che loro hanno tenuto, è stato, prima per dare riputazione a loro propri, aver tolto riputazione alle fanterie."
  "translation_ja": "そのあとに、今日までイタリアの軍事を取り仕切った人々が皆続いた。その立派な力量の結末はどうか。イタリアはシャルルに踏み荒らされ、ルイに略奪され、フェルナンドに屈服させられ、スイス人に辱められた。彼らのやり方はまず、自分たちの名声を高めるために、歩兵の名声を落とすことであった。"
  "translation_status": "reviewed"
- "id": "pr-12-023"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 23
  "source_text": "Feciono questo, perchè essendo senza Stato, e in su la industria, i pochi fanti non davano loro riputazione, e li assai non potevano nutrire; e però si ridussero a’ cavalli, dove con numero sopportabile erano nutriti e onorati; ed erano le cose ridotte in termine, che in un esercito di ventimila soldati non si trovavano duemila fanti. Avevano, oltre a questo, usato ogni industria per levar via a sè, e a’ soldati la fatica e la paura, non s’ammazzando nelle zuffe, ma pigliandosi prigioni e senza taglia."
  "translation_ja": "自分の領国がなく、腕一本で立つ彼らには、少数の歩兵では評判が立たず、大勢は養えなかったからだ。それで騎兵に絞った。手の届く人数で生活が立ち、敬意も得られたからである。二万の兵を擁する軍にも歩兵は二千といないありさまになった。自分と兵が疲労と恐怖を免れるためにもあらゆる知恵を使い、小競り合いでは殺し合わず、捕虜にしても身代金を取らなかった。"
  "translation_status": "reviewed"
- "id": "pr-12-024"
  "section_id": "pr-sec-12"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XII&oldid=3702260"
    "source_sequence": 24
  "source_text": "Non traevano di notte alle terre, quelli delle terre non traevano di notte alle tende, non facevano intorno al campo nè steccato nè fossa, non campeggiavano il verno. E tutte queste cose erano permesse ne’ loro ordini militari, e trovate da loro per fuggire, come è detto, e la fatica ed i pericoli; tantochè essi hanno condotta Italia schiava e vituperata."
  "translation_ja": "夜には都市を攻めず、町の側も夜は陣営を攻めず、陣の周りに柵も堀も設けず、冬には出陣しなかった。すべて軍規が認めたことだ。その軍規も、すでに述べたように、危険と苦労を避けようと自分たちで考え出したものだった。かくして彼らはイタリアを隷属と屈辱に導いた。"
  "translation_status": "reviewed"
- "id": "pr-13-001"
  "section_id": "pr-sec-13"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 1
  "source_text": "CAPITOLO XIII. De’ soldati ausiliari, misti, e propri."
  "translation_ja": "第十三章　援軍、混成軍、自国の軍について"
  "translation_status": "reviewed"
- "id": "pr-13-002"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 2
  "source_text": "L’armi ausiliarie, che sono le altre armi inutili, sono quando si chiama un potente, che con l’armi sue ti venga ad aiutare e difendere, come fece ne’ prossimi tempi Papa Iulio, il quale avendo visto nell’impresa di Ferrara la trista prova delle sue armi mercenarie, si volse alle ausiliari, e convenne con Ferrando Re di Spagna, che con le sue genti ed eserciti dovesse aiutarlo."
  "translation_ja": "もう一つの役に立たない軍、すなわち援軍とは、強国に頼み、その国の兵を連れてきて助け、守ってもらう場合をいう。近年の教皇ユリウスは、フェラーラで傭兵が不首尾に終わったのを見て援軍に転じ、スペイン王フェルナンドと、その兵と軍で助けてくれるよう取り決めた。"
  "translation_status": "reviewed"
- "id": "pr-13-003"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 3
  "source_text": "Queste armi possono essere utili e buone per loro medesime, ma sono per chi le chiama sempre dannose; perchè perdendo rimani disfatto, vincendo resti loro prigione. E ancora che di questi esempi ne sieno piene l’antiche istorie; nondimanco io non mi voglio partire da questo esempio di Papa Iulio II, quale è ancora fresco, il partito del quale non potè essere manco considerato, per volere Ferrara, mettendosi tutto nelle mani d’uno forestiere."
  "translation_ja": "援軍は、それ自体としては有用で優秀かもしれないが、招いた側には常に有害である。負ければ自分が滅び、勝てば相手の捕虜になる。古代の歴史にはこうした例が満ちているが、私は記憶に新しいユリウス二世の例を離れまい。フェラーラを欲して外国人の手にその身をまるごとゆだねたのだから、これ以上無分別な選択もありえない。"
  "translation_status": "reviewed"
- "id": "pr-13-004"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 4
  "source_text": "Ma la sua buona fortuna fece nascere una terza causa, acciò non cogliesse il frutto della sua mala elezione; perchè, essendo gli ausiliari suoi rotti a Ravenna, e surgendo gli Svizzeri che cacciarono i vincitori fuora d’ogni opinione e sua, e d’altri, venne a non rimanere prigione degli inimici, essendo fugati, nè degli ausiliari suoi, avendo vinto con altre armi, che con le loro."
  "translation_ja": "ただ運が味方して第三の事態が持ち上がり、まずい選択の実を食べずにすんだ。援軍がラヴェンナで敗れたあと、スイス人が立ち上がり、本人を含め誰の予想にも反して勝者を追い出したのだ。敵は逃げたのでその捕虜にはならず、勝ったのは別の軍だったので、自分の援軍の捕虜にもならなかった。"
  "translation_status": "reviewed"
- "id": "pr-13-005"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 5
  "source_text": "I Fiorentini essendo al tutto disarmati condussero diecimila Francesi a Pisa per espugnarla; per il qual partito portarono più pericolo che in qualunque tempo de’ travagli loro. Lo Imperadore di Costantinopoli, per opporsi alli suoi vicini, mise in Grecia diecimila Turchi, li quali, finita la guerra, non se ne volsero partire; il che fu principio della servitù della Grecia con gl’infedeli."
  "translation_ja": "すっかり丸腰だったフィレンツェ人は、ピサを攻略するためフランス兵一万をつれてきた。その選択で、それまでのどの苦境にいたときよりも大きな危険を背負った。コンスタンティノープルの皇帝は近隣に対抗するためトルコ人一万をギリシアに入れた。彼らは戦争が終わっても出ていこうとせず、これがギリシアが異教徒に従属する始まりとなった。"
  "translation_status": "reviewed"
- "id": "pr-13-006"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 6
  "source_text": "Colui adunque che vuole non poter vincere, si vaglia di queste armi, perchè sono molto più pericolose, che le mercenarie; perchè in queste è la rovina fatta, sono tutte unite, tutte volte all’obbedienza di altri; ma nelle mercenarie, ad offenderti, vinto che elle hanno, bisogna più tempo, e maggiore occasione, non essendo tutte un corpo, ed essendo trovate e pagate da te, nelle quali un terzo che tu facci capo, non può pigliare subito tanta autorità che ti offenda."
  "translation_ja": "だから勝てなくなりたいなら援軍を用いればよい。傭兵よりはるかに危険なのだ。援軍は初めから破滅を内に抱えている。全員がまとまり、全員がよその人間の命令に服しているからだ。傭兵の場合、勝ったあとであなたを害するには、もっと時間と機会がいる。一体でもなく、雇い集めて金を払ったのはあなたであって、あなたが隊長に据えた第三者が、たちまち危害を加えられるほどの権限を握ることはできない。"
  "translation_status": "reviewed"
- "id": "pr-13-007"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 7
  "source_text": "Insomma nelle mercenarie è più pericolosa la ignavia, nelle ausiliarie la virtù. Un Principe pertanto savio sempre ha fuggito queste arme, e voltosi alle proprie, e ha voluto piuttosto perdere con le sue, che vincere con l’altrui, giudicando non vera vittoria quella che con l’armi d’altri si acquistasse. Io non dubiterò mai di allegare Cesare Borgia, e le sue azioni."
  "translation_ja": "つまり傭兵では意気地のなさが、援軍では有能さが、より危険なのである。そこで賢明な君主はこうした軍を常に避け、自前の軍に向かい、他人の軍で勝つより自分の軍で負けるほうを選んできた。他人の軍で得たものは真の勝利でないと判断したのである。チェーザレ・ボルジアと彼の行いを、私はためらわず、ここでも引き合いに出そう。"
  "translation_status": "reviewed"
- "id": "pr-13-008"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 8
  "source_text": "Questo Duca entrò in Romagna con le armi ausiliarie, conducendovi tutte genti Francesi, e con quelle prese Imola e Furlì; ma, non li parendo poi tali arme sicure, si volse alle mercenarie, giudicando in quelle manco pericolo, e soldò gli Orsini e Vitelli; le quali poi nel maneggiare trovando dubbie, infedeli, e pericolose, le spense e volsesi alle proprie."
  "translation_ja": "公は援軍でロマーニャに入った。すべてフランスの兵を率い、イモラとフォルリを取った。その軍では安心できないと思うと、まだ危険が少ないと見て傭兵に転じ、オルシーニとヴィテッリを雇った。使ってみるとこれも頼りない、不忠で危険な軍だったので、これを排して自前の軍に切り替えた。"
  "translation_status": "reviewed"
- "id": "pr-13-009"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 9
  "source_text": "E puossi facilmente vedere che differenza sia tra l’una e l’altra di queste armi, considerato che differenza fu dalla riputazione del Duca quando aveva gli Orsini e Vitelli, e quando rimase con gli soldati suoi, e sopra di sè stesso, e si troverà sempre accresciuta; nè mai fu stimato assai, se non quando ciascuno vide che egli era intero possessore delle sue armi."
  "translation_ja": "それぞれの軍の違いは、オルシーニとヴィテッリを抱えたときと、自分自身と自分の兵だけで立ったとき、公の威信がどう違ったかを考えれば容易にわかる。その威信は一段ごとに高まった。軍隊をまるごとわがものとしていることが誰の目にも明らかになって初めて、公は十分に重んじられたのである。"
  "translation_status": "reviewed"
- "id": "pr-13-010"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 10
  "source_text": "Io non mi volevo partire dagli esempi Italiani e freschi: pure non voglio lasciare indietro Ierone Siracusano, essendo uno de’ sopra nominati da me. Costui, come di già dissi, fatto dalli Siracusani capo degli eserciti, cognobbe subito quella milizia mercenaria non essere utile, per essere conduttori fatti come li nostri Italiani, e parendoli non gli potere tenere nè lasciare, gli fece tutti tagliare a pezzi; dipoi fece guerra con l’armi sue, e non con l’altrui."
  "translation_ja": "イタリアの近い例を離れるつもりはなかったが、先に名を挙げたシラクサのヒエロンは省きたくない。すでに述べたように、シラクサ人から総司令官にされた彼は、傭兵は役に立たないとすぐ見抜いた。隊長たちが今のわれわれのイタリアの隊長と同類だったからだ。雇い続けることも手放すこともできないと見て彼らを皆殺しにし、それ以後は他人の軍でなく自分の軍で戦った。"
  "translation_status": "reviewed"
- "id": "pr-13-011"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 11
  "source_text": "Voglio ancora ridurre a memoria una figura del Testamento Vecchio fatta a questo proposito."
  "translation_ja": "ここで、この問題にぴったりの旧約聖書のたとえを思い起こしたい。"
  "translation_status": "reviewed"
- "id": "pr-13-012"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 12
  "source_text": "Offerendosi David a Saul di andare a combattere con Golia provocatore Filisteo, Saul, per dargli animo, l’armò dell’armi sue, le quali come David ebbe indosso, ricusò, dicendo, con quelle non si potere ben valere di sè stesso; e però voleva trovare il nimico con la sua fromba, e con il suo coltello. In somma l’armi d’altri o le ti cascono di dosso, o elle ti pesano, e le ti stringono."
  "translation_ja": "挑戦をしかけてきたペリシテ人ゴリアテと戦いに行こうとダビデがサウルに申し出ると、サウルは励ますために自分の武具を身につけさせた。ダビデは着せられると、これでは自分の力を発揮できないといって断り、自分の投石紐と短刀で敵に会うことを選んだ。要するに、他人の武具はずり落ちるか、重すぎるか、窮屈すぎるかなのである。"
  "translation_status": "reviewed"
- "id": "pr-13-013"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 13
  "source_text": "Carlo VII padre del Re Luigi XI avendo con la sua fortuna e virtù libera la Francia dagl’Inglesi, cognobbe questa necessità di armarsi d’armi proprie, e ordinò nel suo regno l’ordinanza delle genti di arme e delle fanterie. Dipoi il Re Luigi suo figliuolo spense quella de’ fanti, e cominciò a soldare Svizzeri; il quale errore seguitato dagli altri, è, come si vede ora in fatto, cagione de’ pericoli di quel Regno."
  "translation_ja": "ルイ十一世の父シャルル七世は、運と力量でフランスをイングランドから解放すると、自前の軍を持つ必要を知り、王国に騎兵と歩兵の常備の制度を設けた。ところが息子のルイ王は歩兵の制度をやめ、スイス人を雇い始めた。後の人も踏襲したこの過ちが、現にいま見るとおり、王国の危機の原因である。"
  "translation_status": "reviewed"
- "id": "pr-13-014"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 14
  "source_text": "Perchè, avendo dato riputazione a’ Svizzeri, ha invilito tutte l’armi sue, perchè le fanterie ha spento in tutto, e le sue genti d’arme ha obbligate all’arme d’altri, perchè essendo assuefatti a militare con Svizzeri, non pare loro di poter vincere senza essi."
  "translation_ja": "スイス人の名を高めたことで、自国の軍すべてを弱くした。自国の歩兵は完全に廃し、自国の騎兵も外国の軍に依存させた。スイス人とともに戦い慣れた彼らは、スイス人なしで勝てるとは思えないからだ。"
  "translation_status": "reviewed"
- "id": "pr-13-015"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 15
  "source_text": "Di qui nasce, che gli Francesi contro a’ Svizzeri non bastano, e senza i Svizzeri contro ad altri non provano. Sono adunque stati gli eserciti di Francia misti, parte mercenari, e parte propri; le quali armi e tutte insieme sono molto migliori, che le semplici mercenarie, o le semplici ausiliarie, e molto inferiori alle proprie. E basti l’esempio detto, perchè il Regno di Francia sarebbe insuperabile, se l’ordine di Carlo era accresciuto, o preservato."
  "translation_ja": "その結果、フランス人はスイス人を敵にしてはかなわず、スイス人を欠いてはほかの相手にも力を示せない。フランスの軍隊は一部が傭兵、一部が自国軍の混成軍となってきた。全体として傭兵だけ、援軍だけの場合よりずっとよいが、自前の軍よりはずっと劣る。以上の例で十分だ。シャルルの制度を育てるか、せめて守っていたなら、フランス王国は打ち負かしえなかったはずである。"
  "translation_status": "reviewed"
- "id": "pr-13-016"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 16
  "source_text": "Ma la poca prudenza degli uomini comincia una cosa, che per sapere allora di buono non manifesta il veleno che v’è sotto, come io dissi di sopra delle febbri etiche. Pertanto se colui che è in un Principato, non cognosce i mali se non quando che nascono, non è veramente savio; e questo è dato a pochi."
  "translation_ja": "だが思慮の足りない人は、取りかかったことの当座の味のよさに、その下にある毒が現れないまま始めてしまう。先に消耗性の熱病について言ったとおりだ。君主の地位にある者が、悪しきものを、それが姿を現してからしか見抜けないなら、真に賢いとは言えない。この見通しを授かる人は少ない。"
  "translation_status": "reviewed"
- "id": "pr-13-017"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 17
  "source_text": "E se si considerasse la prima rovina dell’Imperio Romano, si troverà essere stato solo il cominciare a soldare i Goti; perchè da quel principio cominciarono ad enervare le forze dell’Imperio Romano; e tutta quella virtù, che si levava da lui, si dava a loro. Conchiudo adunque, che, senza avere arme proprie, nessuno Principato è sicuro; anzi tutto obligato alla fortuna, non avendo virtù che nell’avversità lo difenda."
  "translation_ja": "ローマ帝国が崩れた最初を考えれば、それはただゴート人を雇い始めたことにあったとわかる。その時点から帝国の力を弱め始め、帝国から失われた力量はすべてゴート人に与えられたからだ。ゆえに自前の軍を持たぬ君主国に安全なものはない。逆境に守ってくれる力量がないために、何もかも運まかせなのである。"
  "translation_status": "reviewed"
- "id": "pr-13-018"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 18
  "source_text": "E fu sempre opinione e sentenzia degli uomini savi, che niente sia così infermo ed instabile, come è la fama della potenza non fondata nelle forze proprie. E l’arme proprie sono quelle che sono composte di sudditi o di cittadini, o di creati tuoi; tutte l’altre sono o mercenarie, o ausiliari."
  "translation_ja": "自前の力を土台としない強さの評判ほど、もろく不確かなものはない。これはいつも賢者の考え、賢者の格言であった。自前の軍とは、自分の臣民、市民、あるいは自分が育てた人員で編成した軍である。それ以外は皆、傭兵か援軍だ。"
  "translation_status": "reviewed"
- "id": "pr-13-019"
  "section_id": "pr-sec-13"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIII&oldid=3702261"
    "source_sequence": 19
  "source_text": "E il modo ad ordinare l’arme proprie sarà facile a trovare, se si discorreranno gli ordini sopra nominati da me; e se si vedrà come Filippo, padre di Alessandro Magno, e come molte Repubbliche e Principi si sono armati ed ordinati; a’ quali ordini io mi rimetto al tutto."
  "translation_ja": "自国の軍を整える方法は、私が挙げた諸制度を考え、アレクサンドロス大王の父フィリッポスや、多くの共和国や君主がどのように武装して組織を整えたかを見れば、たやすく見いだせる。私はひとえにそうした制度を参照してほしいと思う。"
  "translation_status": "reviewed"
- "id": "pr-14-001"
  "section_id": "pr-sec-14"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIV&oldid=3702262"
    "source_sequence": 1
  "source_text": "CAPITOLO XIV. Quello che al Principe si appartenga circa la milizia."
  "translation_ja": "第十四章　軍事にかかわる君主の務めについて"
  "translation_status": "reviewed"
- "id": "pr-14-002"
  "section_id": "pr-sec-14"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIV&oldid=3702262"
    "source_sequence": 2
  "source_text": "Deve adunque un Principe non avere altro oggetto, nè altro pensiero, nè prendere cosa alcuna per sua arte, fuori della guerra, ed ordini e disciplina di essa; perchè quella è sola arte che si aspetta a chi comanda; ed è di tanta virtù, che non solo mantiene quelli che sono nati Principi, ma molte volte fa gli uomini di privata fortuna salire a quel grado. E per contrario si vede, che quando i Principi hanno pensato più alle delicatezze, che all’arme, hanno perso lo Stato loro."
  "translation_ja": "したがって君主は戦争とその組織、規律を除き、ほかの目標も関心も持たず、ほかの何ものをも自分の生業としないことだ。人の上に立つ者に固有の技はこれだけである。それほどの力があって、君主として生まれた者の地位を保つばかりか、一介の私人をしばしばその地位に上らせる。反対に、軍事よりもぜいたくに心を奪われた君主が地位を失ったのは、見てのとおりである。"
  "translation_status": "reviewed"
- "id": "pr-14-003"
  "section_id": "pr-sec-14"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIV&oldid=3702262"
    "source_sequence": 3
  "source_text": "E la prima cagione che ti fa perdere quello, è il disprezzare questa arte; e la cagione che te lo fa acquistare, è l’essere professo di questa arte. Francesco Sforza, per essere armato, diventò di privato Duca di Milano; e li figliuoli, per fuggire le fatiche e i disagi dell’arme, di Duchi diventarono privati. Perchè tra le altre cagioni di male, che ti arreca l’essere disarmato, ti fa disprezzare; la quale è una di quelle infamie, dalle quali il Principe si debbe guardare, come di sotto si dirà."
  "translation_ja": "地位を失わせる第一の原因はこの技の軽視であり、地位を得させるものはこれに熟達することだ。フランチェスコ・スフォルツァは武力を持つことで一私人からミラノ公になったが、その子らは軍事の苦労と不便を避けたため、公から私人になった。武力がないことの害の一つは、人から軽んじられることだ。後で述べるように、それは君主が避けねばならない不名誉の一つである。"
  "translation_status": "reviewed"
- "id": "pr-14-004"
  "section_id": "pr-sec-14"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIV&oldid=3702262"
    "source_sequence": 4
  "source_text": "Perchè da uno armato a un disarmato non è proporzione alcuna; e la ragione non vuole che chi è armato ubbidisca volentieri a chi è disarmato, e che il disarmato stia sicuro tra i servitori armati. Perchè essendo nell’uno sdegno, e nell’altro sospetto, non è possibile operino bene insieme. E però un Principe che della milizia non s’intende, oltre all’altre infelicità, come è detto, non può essere stimato da’ suoi soldati, nè fidarsi di loro."
  "translation_ja": "武装した者としない者は釣り合わない。武装した者が丸腰の者に喜んで従うとも、丸腰の者が武装した家来に囲まれて安心できるとも、道理からいって考えられない。一方に軽蔑が、他方に疑いがあれば、うまく力を合わせられるはずがない。だから軍事を解さない君主は、ほかの不都合に加えて、自分の兵から重んじられず、兵のほうも信用できない。"
  "translation_status": "reviewed"
- "id": "pr-14-005"
  "section_id": "pr-sec-14"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIV&oldid=3702262"
    "source_sequence": 5
  "source_text": "Non debbe pertanto mai levare il pensiero da questo esercizio della guerra, e nella pace vi si deve più esercitare, che nella guerra; il che può fare in due modi, l’uno con l’opere, l’altro con la mente."
  "translation_ja": "したがってこの営みから決して心を離さず、戦時よりむしろ平時にこそ多く学ぶべきだ。学び方は二つある。行動によるものと、精神によるものである。"
  "translation_status": "reviewed"
- "id": "pr-14-006"
  "section_id": "pr-sec-14"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":

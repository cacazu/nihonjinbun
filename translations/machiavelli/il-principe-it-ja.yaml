    "source_sequence": 20
  "source_text": null
  "translation_ja": "もう一方の人々が地位を保つのは不可能である。〔占領時の加害を取りまとめる具体的な指示は非収録。〕著者はこれを、臣民が安心し、恩恵を受けて支配者になびくかどうかに結びつける。"
  "translation_status": "partial"

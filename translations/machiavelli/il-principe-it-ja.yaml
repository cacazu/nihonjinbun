  "translation_ja": "ニゲルを破って死なせ、東方が落ち着くと、セウェルスはローマに戻り、元老院でアルビヌスに訴えを起こした。〔敵への加害を正当化する偽装の詳細は非収録。〕その後ガリアへ赴き、彼から地位と命を奪った。"
  "translation_status": "partial"

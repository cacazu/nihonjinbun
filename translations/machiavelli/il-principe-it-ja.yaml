    "source_sequence": 9
  "source_text": null
  "translation_ja": "アカイア人の長フィロポイメンは、平和なときにも戦争についての思索を絶やさなかったと、歴史家たちにたたえられた。郊外を友人と歩くときも、折々足を止めて問いかけ、皆の意見を聞き、自分の意見には理由を添えた。〔軍の移動と交戦を想定した一連の実地演習の問いは非収録。〕こうした絶え間ない思索のおかげで、実際の指揮で不測のことが起きても、手立てがなかったためしはない、というのである。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "該当段落の原文を非収録：軍事行動に用いる地形判断・模擬演習。歴史的な論旨を記載。"
- "id": "pr-14-010"
  "section_id": "pr-sec-14"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIV&oldid=3702262"
    "source_sequence": 10
  "source_text": "Ma, quanto all’esercizio della mente, deve il Principe leggere le istorie, ed in quelle considerare le azioni degli uomini eccellenti, vedere come si sono governati nelle guerre, esaminare le cagioni delle vittorie e perdite loro, per potere queste fuggire, quelle imitare; e sopra tutto fare come ha fatto per l’addietro qualche uomo eccellente, che ha preso ad imitare, se alcuno è stato innanzi a lui lodato e glorioso, e di quello che ha tenuto sempre i gesti ed azioni appresso di sè, come si dice che Alessandro Magno imitava Achille, Cesare Alessandro, Scipione Ciro."
  "translation_ja": "精神の鍛錬としては、君主は歴史を読み、卓越した人々の行動を考え、戦争でどのように振る舞ったか、その勝敗の原因を調べ、敗因を避け、勝因にならうべきである。何より、かつて何人もの傑物がしたように、先人のうち名誉と栄光を得た人を選んで手本とし、その身振りや行いを常に身近に置くことだ。アレクサンドロスはアキレウスを、カエサルはアレクサンドロスを、スキピオはキュロスを手本としたという。"
  "translation_status": "reviewed"
- "id": "pr-14-011"
  "section_id": "pr-sec-14"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIV&oldid=3702262"
    "source_sequence": 11
  "source_text": "E qualunque legge la vita di Ciro scritta da Senofonte, riconosce dipoi nella vita di Scipione quanto quella imitazione gli fu di gloria, e quanto nella castità, affabilità, umanità, e liberalità Scipione si conformasse con quelle cose che di Ciro sono da Senofonte scritte."
  "translation_ja": "クセノポンの『キュロスの生涯』を読んだ人は、スキピオの生涯を見て、その模倣がいかに彼の名誉になったかを認めるだろう。節制、親しみやすさ、人間味、気前のよさにおいて、スキピオはクセノポンの描いたキュロスにどれほど身を合わせたことか。"
  "translation_status": "reviewed"
- "id": "pr-14-012"
  "section_id": "pr-sec-14"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIV&oldid=3702262"
    "source_sequence": 12
  "source_text": "Questi simili modi deve osservare un Principe savio, nè mai ne’ tempi pacifici stare ozioso, ma con industria farne capitale, per potersene valere nelle avversità, acciocchè quando si muta la fortuna, lo trovi parato a resistere alli suoi colpi."
  "translation_ja": "賢明な君主はこうしたやり方を守るべきだ。平時にも怠けず、熱意をもって蓄えをつくり、逆境に活用できるようにする。そうすれば運が変わって打撃を加えるとき、運がそこに見るのは、すでに抗う準備を整えた君主であろう。"
  "translation_status": "reviewed"
- "id": "pr-15-001"
  "section_id": "pr-sec-15"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XV&oldid=3702264"
    "source_sequence": 1
  "source_text": "CAPITOLO XV. Delle cose, mediante le quali gli uomini, e massimamente i Principi, sono lodati o vituperati."
  "translation_ja": "第十五章　人々、とりわけ君主が称賛され、あるいは非難される性質について"
  "translation_status": "reviewed"
- "id": "pr-15-002"
  "section_id": "pr-sec-15"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XV&oldid=3702264"
    "source_sequence": 2
  "source_text": "Resta ora a vedere quali debbano essere i modi e governi di un Principe con li sudditi e con gli amici. E perchè io so che molti di questo hanno scritto, dubito, scrivendone ancor io, non esser tenuto presontuoso, partendomi, massime nel disputare questa materia, dagli ordini degli altri."
  "translation_ja": "残るのは、君主が臣民や友にどう接し、どう振る舞うべきかである。すでに多くの人が書いたことは承知している。私まで書けば思い上がりに見えるのではないかと心配である。とりわけこの問題を論じるにあたって、私はほかの人々のやり方を離れるからだ。"
  "translation_status": "reviewed"
- "id": "pr-15-003"
  "section_id": "pr-sec-15"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XV&oldid=3702264"
    "source_sequence": 3
  "source_text": "Ma essendo l’intento mio scrivere cosa utile a chi l’intende, mi è parso più conveniente andare dietro alla verità effettuale della cosa, che all’immaginazione di essa: e molti si sono immaginate Repubbliche e Principati, che non si sono mai visti nè cognosciuti essere in vero; perchè egli è tanto discosto da come si vive, a come si doveria vivere, che colui che lascia quello che si fa per quello che si doveria fare, impara piuttosto la rovina, che la preservazione sua; perchè un uomo che voglia fare in tutte le parti professione di buono, conviene che rovini fra tanti che non sono buoni."
  "translation_ja": "しかし私の目的は、わかる人にとって役に立つものを書くことにある。そこで、物事をどう思い描くかよりも、その現実にはたらく真実を追うほうが適切だと思った。多くの人は、実際には見た人もなく、存在したためしもない共和国や君主国を思い描いてきた。だが、人はどう生きているかと、どう生きるべきかとの隔たりはたいへん大きい。なされるべきことのために、現になされていることを捨て置く者が身につけるのは、自分を救う道よりも、自分を滅ぼす道である。どんな場合にも善人であることを貫きたい人は、善人でない者がこれほど多いなかでは、滅びざるをえないからだ。"
  "translation_status": "reviewed"
- "id": "pr-15-004"
  "section_id": "pr-sec-15"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XV&oldid=3702264"
    "source_sequence": 4
  "source_text": "Onde è necessario ad un Principe, volendosi mantenere, imparare a potere essere non buono, ed usarlo e non usarlo secondo la necessità."
  "translation_ja": "したがって自分の地位を保ちたい君主は、善くない者でもありうることを学び、必要次第でその力を使いもし、使わずにもいられなければならない。"
  "translation_status": "reviewed"
- "id": "pr-15-005"
  "section_id": "pr-sec-15"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XV&oldid=3702264"
    "source_sequence": 5
  "source_text": "Lasciando adunque indietro le cose circa un Principe immaginate, e discorrendo quelle che son vere, dico, che tutti gli uomini, quando se ne parla, e massime i Principi, per esser posti più alto, sono notati di alcuna di queste qualità che arrecano loro o biasimo, o laude; e questo è che alcuno è tenuto liberale, alcuno misero, usando un termine Toscano, (perchè avaro in nostra lingua è ancor colui che per rapina desidera d’avere, e misero chiamiamo quello che troppo si astiene dall’usare il suo) alcuno è tenuto donatore, alcuno rapace; alcuno crudele, alcuno pietoso; l’uno fedífrago, l’altro fedele; l’uno effeminato e pusillanime, l’altro feroce ed animoso; l’uno umano, l’altro superbo; l’uno lascivo, l’altro casto; l’uno intero, l’altro astuto; l’uno duro, l’altro facile; l’uno grave, l’altro leggiere; l’uno religioso, l’altro incredulo, e simili."
  "translation_ja": "それゆえ君主について思い描かれたことは置き、現実を論じよう。人は誰でも評判を語られるとき、とりわけ高い場所にいる君主は、ある性質によって非難され、また称賛される。ある人は気前がよい、ある人は「しみったれ」だと言われる。これはトスカーナの言い方で、われわれの言葉で「貪欲」というのは奪ってでも得たがる者をも指すが、「しみったれ」というのは自分のものを使うのを控えすぎる者のことだ。よく人に与える者と強欲に奪う者、残酷な者と慈悲深い者、約束を破る者と忠実な者、柔弱で臆病な者と激しく勇敢な者、情に富む者と高慢な者、好色な者と貞節な者、まっすぐな者と抜け目のない者、厳格な者と柔和な者、重々しい者と軽薄な者、信心深い者と信じない者などである。"
  "translation_status": "reviewed"
- "id": "pr-15-006"
  "section_id": "pr-sec-15"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XV&oldid=3702264"
    "source_sequence": 6
  "source_text": "Io so che ciascuno confesserà, che sarebbe laudabilissima cosa un Principe trovarsi di tutte le sopraddette qualità, quelle che sono tenute buone; ma perchè non si possono avere, nè interamente osservare per le condizioni umane che non lo consentono, gli è necessario essere tanto prudente, che sappia fuggire l’infamia di quelli vizi che li torrebbono lo Stato, e da quelli che non gliene tolgano, guardarsi, se egli è possibile; ma non potendosi, si può con minor rispetto lasciare andare."
  "translation_ja": "このうち善いとされる性質を君主がみなそなえていれば、まったく称賛に値するということは、誰もが認めるだろう。だが、人の世の条件がそれを許さないから、すべてを持つことも完全に守ることもできない。そこで君主には、国を失わせるような悪徳の汚名を避けるだけの分別が要る。国を失わせない悪徳からも、できるなら身を守ればよいが、それができないなら、そこまでは遠慮せずにすませてもよい。"
  "translation_status": "reviewed"
- "id": "pr-15-007"
  "section_id": "pr-sec-15"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XV&oldid=3702264"
    "source_sequence": 7
  "source_text": "Ed ancora non si curi d’incorrere nell’infamia di quelli vizi, senza i quali possa difficilmente salvare lo Stato; perchè, se si considera bene tutto, si troverà qualche cosa che parrà virtù, e seguendola sarebbe la rovina sua; e qualcun’altra che parrà vizio, e seguendola ne risulta la sicurtà, ed il ben essere suo."
  "translation_ja": "のみならず、国を救うには欠くことが難しい悪徳なら、その汚名を受けることも気にかけるな。すべてをよく考えれば、美徳に見えながら、従うと自分を滅ぼすものがある一方、悪徳に見えながら、従うと安全と繁栄をもたらすものもあるとわかるからである。"
  "translation_status": "reviewed"
- "id": "pr-16-001"
  "section_id": "pr-sec-16"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 1
  "source_text": "CAPITOLO XVI. Della liberalità e miseria."
  "translation_ja": "第十六章　気前のよさと物惜しみについて"
  "translation_status": "reviewed"
- "id": "pr-16-002"
  "section_id": "pr-sec-16"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 2
  "source_text": "Cominciando adunque dalle prime soprascritte qualità, dico come sarebbe bene esser tenuto liberale. Nondimanco la liberalità usata in modo che tu non sia temuto, ti offende; perchè se la si usa virtuosamente e come la si deve usare, la non fia conosciuta, e non ti cadrà l’infamia del suo contrario."
  "translation_ja": "まず先に挙げた性質の初めから論じよう。気前がよいと思われるのはよいことだろう。だが、恐れられなくなるような気前のよさの示し方は、自分を傷つける。〔この箇所の底本は「恐れられないように」と読む。〕というのは、気前のよさを立派に、あるべき仕方で実践しても、それは人に知られず、反対の性質の汚名も消えないからである。"
  "translation_status": "reviewed"
- "id": "pr-16-003"
  "section_id": "pr-sec-16"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 3
  "source_text": "E però a volersi mantenere tra gli uomini il nome del liberale, è necessario non lasciare indietro alcuna qualità di sontuosità; talmentechè sempre un Principe così fatto consumerà in simili opere tutte le sue facultà, e sarà necessitato alla fine, se egli si vorrà mantenere nome del liberale, gravare i popoli straordinariamente, ed esser fiscale, e fare tutte quelle cose che si possono fare per avere danari."
  "translation_ja": "そこで世間に気前のよい人との評判を保つためには、あらゆる種類のぜいたくを惜しんではならなくなる。そのような君主は必ず、そうしたことに全財産を費やす。なおも気前がよいと言われ続けようとすれば、いずれ民衆に臨時の重い負担を課し、税をきびしく取り立て、金が手に入るとあらば何でもしなければならなくなる。"
  "translation_status": "reviewed"
- "id": "pr-16-004"
  "section_id": "pr-sec-16"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 4
  "source_text": "Il che comincerà a farlo odioso con li sudditi, e poco stimare da ciascuno, diventando povero; in modo che, avendo con questa sua liberalità offeso molti, e premiato pochi, sente ogni primo disagio, e periclita in qualunque primo pericolo; il che cognoscendo lui, e volendosene ritrarre, incorre subito nell’infamia del misero."
  "translation_ja": "その結果、臣民に憎まれ始め、貧乏になるので誰からも軽く見られる。気前のよさで多数を傷つけ、恩にあずかった者は少数にすぎず、最初のちょっとした難儀がこたえ、最初の危機で足もとが危うくなる。これに気づいて身を引こうとすれば、たちまち物惜しみの汚名を着る。"
  "translation_status": "reviewed"
- "id": "pr-16-005"
  "section_id": "pr-sec-16"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 5
  "source_text": "Un Principe adunque, non potendo usare questa virtù del liberale senza suo danno, in modo che la sia cognosciuta, deve, se egli è prudente, non si curare del nome del misero; perchè con il tempo sarà tenuto sempre più liberale."
  "translation_ja": "したがって、気前のよさという美徳を人目につくように実践しては自分が損をする以上、分別のある君主は、けちと言われても意に介さないことである。時とともにかえって、ますます気前がよいとみなされるだろう。"
  "translation_status": "reviewed"
- "id": "pr-16-006"
  "section_id": "pr-sec-16"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 6
  "source_text": "Veggendo che con la sua parsimonia le sue entrate gli bastano, può difendersi da chi gli fa guerra, può fare imprese senza gravare i popoli; talmentechè viene a usare la liberalità a tutti quelli, a chi non toglie, che sono infiniti, e miseria a tutti coloro, a chi non dà, che sono pochi. Ne’ nostri tempi noi non abbiamo veduto fare gran cose, se non a quelli che sono stati tenuti miseri, gli altri essere spenti."
  "translation_ja": "倹約によって歳入が足り、戦をしかける相手から身を守ることも、民を苦しめずに事業を行うこともできると分かるからだ。すると何も取り上げられない無数の人に対して気前よく振る舞い、与えてもらえない少数の人に対してだけ物惜しみをしたことになる。われわれの時代に大事業をなし遂げたのはけちと呼ばれた人ばかりで、それ以外は没落した。"
  "translation_status": "reviewed"
- "id": "pr-16-007"
  "section_id": "pr-sec-16"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 7
  "source_text": "Papa Iulio II come si fu servito del nome di liberale per aggiugnere al Papato, non pensò più a mantenerselo per potere far guerra al Re di Francia; e ha fatto tante guerre senza porre un dazio strasordinario, perchè alle superflue spese ha somministrato la lunga sua parsimonia. Il Re di Spagna presente, se fusse tenuto liberale, non arebbe fatto, nè vinto tante imprese."
  "translation_ja": "教皇ユリウス二世は教皇になるまでは気前のよい人との評判を利用したが、フランス王と戦うため、もはやその評判を保とうとはしなかった。あれほど戦争をしながら一度も臨時税を課さなかったのは、常々の節約が余分な出費をまかなったからである。今のスペイン王も、気前がよいと評されていたら、あれほど多くの企てを行うことも成功させることもできなかったろう。"
  "translation_status": "reviewed"
- "id": "pr-16-008"
  "section_id": "pr-sec-16"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 8
  "source_text": "Pertanto un Principe deve stimare poco, per non avere a rubare i sudditi, per poter difendersi, per non diventare povero ed abietto, per non essere forzato diventar rapace, d’incorrere nel nome di misero, perchè questo è uno di quelli vizi, che lo fanno regnare. E se alcun dicesse: Cesare con la liberalità pervenne all’Imperio; e molti altri, per essere stati ed esser tenuti liberali, sono venuti a gradi grandissimi; rispondo: o tu siei Principe fatto, o tu siei in via di acquistarlo."
  "translation_ja": "ゆえに君主は、臣民から盗まずにすみ、身を守れ、貧しく卑しめられず、強欲にもならずにすむなら、物惜しみの評判など重く見るべきでない。それはその人を統治者でいさせる悪徳の一つである。けれどもカエサルは気前のよさで権力を得たし、ほかにも気前よく振る舞い、そう評されて、非常に高い地位に上った者は多い、と言う人には、すでに君主なのか、なろうとする途上なのかを区別せよと答えよう。"
  "translation_status": "reviewed"
- "id": "pr-16-009"
  "section_id": "pr-sec-16"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 9
  "source_text": "Nel primo caso questa liberalità è dannosa; nel secondo è ben necessario esser tenuto liberale, e Cesare era un di quelli che voleva pervenire al Principato di Roma; ma, se poichè vi fu venuto, fusse sopravvissuto, e non si fusse temperato da quelle spese, arebbe distrutto quell’Imperio. E se alcuno replicasse: molti sono stati Principi, e con gli eserciti hanno fatto gran cose, che sono stati tenuti liberalissimi; ti rispondo: o il Principe spende del suo e de’ suoi sudditi, o di quello d’altri."
  "translation_ja": "前者ならこの気前のよさは有害である。後者なら気前がよいという評判がぜひとも要る。カエサルはローマの支配者になろうとする側だった。しかしその地位を得たのちも生き長らえ、支出を加減しなかったなら、帝国を滅ぼしたろう。軍を率いて大事を成し遂げた君主には、たいへん気前がよいとされた者が多いと言われれば、君主が使っているのは自分と臣民のものか、よそのものかを問おう。"
  "translation_status": "reviewed"
- "id": "pr-16-010"
  "section_id": "pr-sec-16"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 10
  "source_text": "Nel primo caso deve esser parco, nel secondo non deve lasciare indietro parte alcuna di liberalità. E quel Principe che va con gli eserciti, che si pasce di prede, di sacchi, e di taglie, e maneggia quel d’altri, gli è necessaria questa liberalità; altrimenti non sarebbe seguíto da’ soldati."
  "translation_ja": "前者なら倹約すべきであり、後者なら気前よさのどんな面も出し惜しんではならない。軍と行動し、戦利品、略奪品、身代金で食べ、他人のものを扱う君主には、この気前のよさが必要である。そうでなければ兵は後に続かない。"
  "translation_status": "reviewed"
- "id": "pr-16-011"
  "section_id": "pr-sec-16"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 11
  "source_text": "E di quello che non è tuo o de’ tuoi sudditi, si può essere più largo donatore, come fu Ciro, Cesare, e Alessandro; perchè lo spendere quel d’altri non toglie riputazione, ma te ne aggiugne; solamente lo spendere il tuo è quello che ti nuoce. E non ci è cosa che consumi sè stessa quanto la liberalità, la quale mentre che tu usi, perdi la facultà di usarla, e diventi o povero o vile, o, per fuggire la povertà, rapace e odioso."
  "translation_ja": "自分のものでも臣民のものでもない財産なら、キュロス、カエサル、アレクサンドロスのように、いっそう寛大な贈り手でいられる。他人のものを使っても評判は減らず、増すからだ。自分を傷つけるのは自分のものを使うときだけである。気前のよさほど自分自身を食い尽くすものはない。実行しながら、実行するだけの資力を失い、貧しくなるか、軽んじられるか、それとも貧困を逃れようとして強欲となり憎まれるのである。"
  "translation_status": "reviewed"
- "id": "pr-16-012"
  "section_id": "pr-sec-16"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVI&oldid=3702265"
    "source_sequence": 12
  "source_text": "E tra tutte le cose, da che un Principe si debbe guardare, è l’essere disprezzato e odioso; e la liberalità all’una e l’altra di queste cose ti conduce. Pertanto è più sapienza tenersi il nome di misero, che partorisce una infamia senza odio, che, per volere il nome di liberale, incorrere per necessità nel nome di rapace, che partorisce una infamia con odio."
  "translation_ja": "君主が用心すべきことのなかには、軽んじられることと憎まれることがある。気前のよさは、その両方に人を導く。だから物惜しみの評判を引き受けるほうが賢い。それは汚名を生んでも憎しみは生まない。気前がよいと呼ばれたくて、やむなく強欲と呼ばれることになれば、憎しみを伴う汚名を生むのだ。"
  "translation_status": "reviewed"
- "id": "pr-17-001"
  "section_id": "pr-sec-17"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 1
  "source_text": "CAPITOLO XVII. Della crudeltà e clemenzia; e se egli è meglio essere amato, che temuto."
  "translation_ja": "第十七章　残酷さと慈悲について。また、恐れられるより愛されるほうがよいか"
  "translation_status": "reviewed"
- "id": "pr-17-002"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 2
  "source_text": "Discendendo appresso alle altre qualità preallegate, dico, che ciascuno Principe deve disiderare di essere tenuto pietoso, e non crudele. Nondimanco deve avvertire di non usar male questa pietà. Era tenuto Cesare Borgia crudele; nondimanco quella sua crudeltà aveva racconcia la Romagna, unitala, e ridottala in pace e in fede. Il che se si considera bene, si vedrà quello essere stato molto più pietoso, che il Popolo Fiorentino, il quale, per fuggire il nome di crudele, lasciò distruggere Pistoia."
  "translation_ja": "先に挙げたそのほかの性質に移る。どの君主も残酷でなく慈悲深いと思われたいと願うべきだが、慈悲の使い方を誤ってはならない。チェーザレ・ボルジアは残酷だと言われた。それでも、その残酷さがロマーニャを立て直し、一つにまとめ、平和と忠誠を回復した。よく考えれば、残酷との評判を逃れたいばかりにピストイアが滅びるのを放っておいたフィレンツェの民より、彼のほうがずっと慈悲深くあったと分かる。"
  "translation_status": "reviewed"
- "id": "pr-17-003"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 3
  "source_text": "Deve pertanto un Principe non si curare dell’infamia di crudele, per tenere i sudditi suoi uniti, e in fede: perchè con pochissimi esempi sarai più pietoso, che quelli, li quali per troppa pietà lasciano seguire i disordini, onde naschino occisioni o rapine; perchè queste sogliono offendere una università intera; e quelle esecuzioni che vengono dal Principe, offendono un particolare."
  "translation_ja": "だから臣民の結束と忠誠を保つためなら、君主は残酷との汚名を気にかけるな。わずかな処罰の例で、慈悲に流されるあまり混乱を放置し、殺人や略奪を生じさせる人より、よほど慈悲深くありうる。そうした混乱は共同体全体を傷つけるが、君主の命じる処刑が傷つけるのは一個人だからである。"
  "translation_status": "reviewed"
- "id": "pr-17-004"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 4
  "source_text": "E tra tutti i Principi, al Principe nuovo è impossibile fuggire il nome di crudele, per essere gli Stati nuovi pieni di pericoli. Onde Virgilio, per la bocca di Didone, escusa l’inumanità del suo Regno, per essere quello nuovo, dicendo:"
  "translation_ja": "とりわけ新しい君主が残酷との評判を避けるのは不可能だ。新しい国には危険が満ちている。ウェルギリウスもディドの口を借りて、生まれたばかりの王国だからと、その非情をこう弁じさせている。"
  "translation_status": "reviewed"
- "id": "pr-17-005"
  "section_id": "pr-sec-17"
  "kind": "verse"
  "origin": "source"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 5
  "source_text": "Res dura, et regni novitas me talia cogunt"
  "translation_ja": "「厳しい事情と、わが国がまだ新しいことが、私にこうしたことを"
  "translation_status": "reviewed"
- "id": "pr-17-006"
  "section_id": "pr-sec-17"
  "kind": "verse"
  "origin": "source"
  "source_languages":
  - "la"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 6
  "source_text": "Moliri, et late fines custode tueri."
  "translation_ja": "企てさせ、広く国境を衛兵に守らせるのです。」"
  "translation_status": "reviewed"
- "id": "pr-17-007"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 7
  "source_text": "Nondimeno deve esser grave a credere ed al muoversi, nè si deve far paura da sè stesso, e procedere in modo temperato con prudenza ed umanità, che la troppa confidenza non lo faccia incauto, e la troppa diffidanza non lo renda intollerabile. Nasce da questo una disputa: s’egli è meglio essere amato che temuto, o temuto che amato."
  "translation_ja": "それでも人の話を信じるにも、動くにも軽率であってはならず、自分で自分をおびえさせてもならない。思慮と人間味をもって節度を保ち、信頼しすぎて不用心にならず、疑いすぎて耐えがたい人にもならないようにする。ここから論争が生まれる。恐れられるより愛されるほうがよいのか、それとも愛されるより恐れられるほうがよいのか。"
  "translation_status": "reviewed"
- "id": "pr-17-008"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 8
  "source_text": "Rispondesi, che si vorrebbe essere l’uno e l’altro; ma perchè egli è difficile, che e’ stiano insieme, è molto più sicuro l’esser temuto che amato, quando s’abbi a mancare dell’un de’ duoi."
  "translation_ja": "答えは、両方でありたいものである。だが二つを一緒にするのは難しいから、一方を欠かさねばならないなら、愛されるより恐れられるほうがはるかに確かである。"
  "translation_status": "reviewed"
- "id": "pr-17-009"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 9
  "source_text": "Perchè degli uomini si può dire questo generalmente, che sieno ingrati, volubili, simulatori, fuggitori de’ pericoli, cupidi di guadagno; e mentre fai loro bene sono tutti tuoi, ti offeriscono il sangue, la roba, la vita, ed i figliuoli, come di sopra dissi, quando il bisogno è discosto; ma, quando ti si appressa, si rivoltano."
  "translation_ja": "人間について一般にこう言えるからだ。恩知らずで、変わりやすく、うわべを繕い、危険を避け、利得を求める。あなたがよくしてくれるあいだは皆あなたのものだ。先にも述べたように、必要が遠いうちは血も財産も命も子も差し出す。だが必要が目の前にくれば、そっぽを向く。"
  "translation_status": "reviewed"
- "id": "pr-17-010"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 10
  "source_text": "E quel Principe che si è tutto fondato in sulle parole loro, trovandosi nudo di altri preparamenti, rovina; perchè l’amicizie che si acquistano con il prezzo, e non con grandezza e nobiltà d’animo, si meritano, ma non le si hanno, e a’ tempi non si possono spendere."
  "translation_ja": "言葉だけを全面的にあてにし、ほかに何も備えのない君主は滅びる。大きく高潔な心でなく、代金で得た友好は、支払いはしたとしても手には入っておらず、いざというとき使えないからだ。"
  "translation_status": "reviewed"
- "id": "pr-17-011"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 11
  "source_text": "E gli uomini hanno men rispetto di offendere uno che si facci amare, che uno che si facci temere; perchè l’amore è tenuto da un vincolo di obbligo, il quale, per essere gli uomini tristi, da ogni occasione di propria utilità è rotto; ma il timore è tenuto da una paura di pena, che non abbandona mai."
  "translation_ja": "人は、恐れさせる相手より、愛させる相手を傷つけるほうに、ためらいが少ない。愛を保つ紐は恩義であり、人には悪いところがあるため、自分の利益になる機会のたびに断たれる。しかし恐れを保つのは罰への不安で、それはけっして人を離れない。"
  "translation_status": "reviewed"
- "id": "pr-17-012"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 12
  "source_text": "Deve nondimeno il Principe farsi temere in modo, che, se non acquista l’amore, e’ fugga l’odio, perchè può molto bene stare insieme esser temuto, e non odiato; il che farà, semprechè s’astenga dalla roba de’ suoi cittadini, e de’ suoi sudditi, e dalle donne loro."
  "translation_ja": "それでも君主は、愛は得られないまでも、憎まれないように恐れさせねばならない。恐れられてしかも憎まれないことは、十分に両立する。それには市民と臣民の財産にも、その家の女性にも手を出さなければよい。"
  "translation_status": "reviewed"
- "id": "pr-17-013"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 13
  "source_text": "E quando pure gli bisognasse procedere contro al sangue di qualcuno, farlo quando vi sia giustificazione conveniente e causa manifesta; ma sopratutto astenersi dalla roba d’altri; perchè gli uomini dimenticano piuttosto la morte del padre, che la perdita del patrimonio."
  "translation_ja": "なお誰かの生命にかかわる処置が必要になるならば、相応の正当化と誰にも明らかな理由のあるときに行う。そして何より他人の財産に手を出さないことだ。人は遺産を失ったことよりも、父親が死んだことのほうを先に忘れるからである。"
  "translation_status": "reviewed"
- "id": "pr-17-014"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 14
  "source_text": "Dipoi le cagioni del torre la roba non mancano mai; e sempre colui che comincia a vivere con rapina, trova cagioni d'occupare quel d’altri, e per avverso contro al sangue sono più rare e mancano più tosto. Ma quando il Principe è con gli eserciti, e ha in governo moltitudine di soldati, allora è al tutto necessario non si curare del nome di crudele: perchè senza questo nome non si tiene un esercito unito, nè disposto ad alcuna fazione."
  "translation_ja": "しかも財産を奪う口実は絶えない。略奪で暮らし始めた者は、よその物を押さえる口実をいつも見つける。生命を奪う口実は逆に少なく、尽きるのも早い。ただし君主が軍中にあり、多数の兵を統率する場合は、残酷との評判を一向に気にしてはならない。その評判なしには軍の結束も、行動に移る備えも保てないからだ。"
  "translation_status": "reviewed"
- "id": "pr-17-015"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 15
  "source_text": "Tra le mirabili azioni di Annibale si connumera questa, che avendo un esercito grossissimo, misto d'infinite generazioni d'uomini, condotto a militare in terre d'altri, non vi surgesse mai una dissensione nè fra loro, nè contro il Principe, così nella trista, come nella sua buona fortuna."
  "translation_ja": "ハンニバルの驚嘆すべき業績には、じつに多種多様な人々からなる大軍を異国に連れて戦ったのに、逆境にも順境にも、兵相互にも指導者に対しても、一度の不和さえ起きなかったことが数えられる。"
  "translation_status": "reviewed"
- "id": "pr-17-016"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 16
  "source_text": "Il che non potè nascere da altro, che da quella sua inumana crudeltà, la quale insieme con infinite sue virtù lo fece sempre nel cospetto de’ suoi soldati venerando e terribile; e, senza quella, l'altre sue virtù a far quello effetto non gli bastavano. E gli scrittori poco considerati dall’una parte ammirano queste sue azioni, e dall’altra dannano la principale cagione di esse."
  "translation_ja": "その原因は彼の非人間的な残酷さをおいてほかにない。それが数々のすぐれた資質と相まって、兵の目に彼をつねに畏敬すべき、恐ろしい人とした。それなしにはほかの美点だけで同じ結果は得られなかった。思慮の浅い著述家は、一方でその業績に感嘆し、他方で業績の最大の原因を断罪する。"
  "translation_status": "reviewed"
- "id": "pr-17-017"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 17
  "source_text": "E che sia vero che l’altre sue virtù non gli sarieno bastate, si può considerare in Scipione, rarissimo non solamente ne’ tempi suoi, ma in tutta la memoria delle cose che si sanno, dal quale gli eserciti suoi in Ispagna si ribellarono; il che non nacque da altro, che dalla sua troppa pietà, la quale aveva dato a’ suoi soldati più licenza, che alla disciplina militare non si conveniva."
  "translation_ja": "ほかの美点だけでは足りなかったことは、スキピオを考えれば分かる。その時代ばかりでなく、知られている歴史全体でもまれな人物だったのに、スペインで自軍が反乱した。原因は慈悲が過ぎたことでしかない。軍の規律が許すべき範囲を越えて、兵に自由を与えたのだ。"
  "translation_status": "reviewed"
- "id": "pr-17-018"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 18
  "source_text": "La qual cosa gli fu da Fabio Massimo nel Senato rimproverata, chiamandolo corruttore della Romana milizia. I Locrensi essendo stati da un legato di Scipione distrutti, non furono da lui vindicati, nè l'insolenza di quel legato corretta, nascendo tutto da quella sua natura facile. Talmentechè volendolo alcuno in Senato scusare, disse come egli erano molti uomini, che sapevano meglio non errare, che correggere gli errori d'altri."
  "translation_ja": "このことでファビウス・マクシムスは元老院で彼をローマの軍を腐らせる者と呼んで非難した。スキピオ配下の将官にロクリの人々が痛めつけられても、彼は住民のためにその不正を罰することも、将官の横暴を正すこともしなかった。すべてその寛容すぎる性質から来た。元老院で彼を弁護しようとした人が、「自分が過ちを犯さないことはできても、他人の過ちを正すのは得意でない人は大勢いる」と言ったほどだ。"
  "translation_status": "reviewed"
- "id": "pr-17-019"
  "section_id": "pr-sec-17"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVII&oldid=3702266"
    "source_sequence": 19
  "source_text": "La qual natura arebbe con il tempo violato la fama e la gloria di Scipione, se egli avesse con essa perseverato nell'imperio; ma vivendo sotto il governo del Senato, questa sua qualità dannosa non solamente si nascose, ma gli fu a gloria. Conchiudo adunque, tornando all'esser temuto ed amato, che amando gli uomini a posta loro, e temendo a posta del Principe, deve un Principe savio fondarsi in su quello che è suo, non in su quello che è d’altri; e deve solamente ingegnarsi di fuggir l'odio, come è detto."
  "translation_ja": "もしその性質を保ったまま長く指揮権を握っていたら、やがてスキピオの名声と栄光を傷つけただろう。だが元老院の統治下に生きたため、この有害な性質は隠れただけでなく、彼の名誉にさえなった。恐れられること、愛されることに話を戻し、こう結論しよう。人が愛するのは自分の意思で、恐れるのは君主の意向による。それゆえ賢明な君主は他人のものでなく自分のものを土台とし、ただ憎まれないように努めるべきである。"
  "translation_status": "reviewed"
- "id": "pr-18-001"
  "section_id": "pr-sec-18"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 1
  "source_text": "CAPITOLO XVIII. In che modo i Principi debbino osservare la fede."
  "translation_ja": "第十八章　君主はどのように信義を守るべきか"
  "translation_status": "reviewed"
- "id": "pr-18-002"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 2
  "source_text": "Quanto sia laudabile in un Principe mantenere la fede, e vivere con integrità, e non con astuzia, ciascuno lo intende. Nondimeno si vede per esperienzia, ne’ nostri tempi, quelli Principi aver fatto gran cose, che della fede hanno tenuto poco conto, e che hanno saputo con astuzia aggirare i cervelli degli uomini, ed alla fine hanno superato quelli che si sono fondati in su la lealtà. Dovete adunque sapere come sono due generazioni di combattere: l’una con le leggi, l’altra con le forze."
  "translation_ja": "君主が信義を守り、策略によらず誠実に生きることがどれほど称賛に値するかは、誰でも分かる。にもかかわらず現代の経験から見えるのは、大事をなしたのが信義をさほど重んじず、巧みに人の頭を翻弄できた君主たちであり、とうとう誠実さを土台にした君主を追い越したということである。そこで、争う道には二種類、一つは法律、もう一つは力によるものがあると知ってほしい。"
  "translation_status": "reviewed"
- "id": "pr-18-003"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 3
  "source_text": "Quel primo è degli uomini; quel secondo è delle bestie; ma perchè il primo spesse volte non basta, bisogna ricorrere al secondo. Pertanto ad un Principe è necessario saper ben usare la bestia e l’uomo."
  "translation_ja": "初めの道は人間のもの、後の道は獣のものである。だがしばしば初めのものだけでは足りず、後のものに訴えねばならない。ゆえに君主は獣も人間も、ともに使いこなす心得が要る。"
  "translation_status": "reviewed"
- "id": "pr-18-004"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 4
  "source_text": "Questa parte è stata insegnata a’ Principi copertamente dagli antichi scrittori, i quali scrivono come Achille e molti altri di quelli Principi antichi furono dati a nutrire a Chirone Centauro, che sotto la sua disciplina gli custodisse; il che non vuol dire altro l’avere per precettore un mezzo bestia e mezzo uomo, se non che bisogna a un Principe sapere usare l’una e l’altra natura, e l’una senza l’altra non è durabile."
  "translation_ja": "古代の作家たちは君主にこの点を暗に教えている。アキレウスや昔の君主の多くが、ケンタウロスのケイロンに預けられ、その教えのもとで養育されたと書いているのだ。半ば獣で半ば人間の者を師とするとは、君主は二つの本性を使いこなさねばならず、片方だけでは長続きしない、という以外のことではない。"
  "translation_status": "reviewed"
- "id": "pr-18-005"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 5
  "source_text": "Essendo adunque un Principe necessitato sapere bene usare la bestia, debbe di quella pigliare la volpe e il lione; perchè il lione non si defende da’ lacci, la volpe non si defende da’ lupi. Bisogna adunque essere volpe a cognoscere i lacci, e lione a sbigottire i lupi. Coloro che stanno semplicemente in sul lione, non se ne intendono. Non può pertanto un Signore prudente, nè debbe osservare la fede, quando tale osservanzia gli torni contro, e che sono spente le cagioni che la feciono promettere."
  "translation_ja": "君主が獣をよく使わなければならないなら、獣のうち狐と獅子を選ぶべきである。獅子は罠を防げず、狐は狼を防げない。罠を見抜くには狐、狼をおびえさせるには獅子であらねばならない。ただ獅子でさえあればよいと思う者は、物が分かっていない。したがって、信義を守ることが自分の不利となり、約束した事情も消えたとき、思慮ある君主はその約束を守れないし、守るべきでもない。"
  "translation_status": "reviewed"
- "id": "pr-18-006"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 6
  "source_text": "E se gli uomini fussero tutti buoni, questo precetto non saria buono; ma perchè sono tristi, e non l’osserverebbono a te, tu ancora non l’hai da osservare a loro. Nè mai a un Principe mancheranno cagioni legittime di colorare l’inosservanza."
  "translation_ja": "すべての人が善いなら、この教えはよくないだろう。だが人は悪く、相手のほうもあなたへの約束を守らないのだから、あなたも相手に守るには及ばない。約束を守らなかったことにもっともらしい色を塗るための正当な理由に、君主が事欠くことは決してない。"
  "translation_status": "reviewed"
- "id": "pr-18-007"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 7
  "source_text": "Di questo se ne potriano dare infiniti esempi moderni, e mostrare quante paci, quante promesse siano state fatte irrite e vane per la infedeltà de’ Principi; e a quello che ha saputo meglio usare la volpe, è meglio successo. Ma è necessario questa natura saperla bene colorire, ed essere gran simulatore e dissimulatore; e sono tanto semplici gli uomini, e tanto ubbidiscono alle necessità presenti, che colui che inganna, troverà sempre chi si lascerà ingannare. Io non voglio degli esempi freschi tacerne uno."
  "translation_ja": "近い例だけでも尽きない。君主たちの背信のせいで、いかに多くの講和が破られ、いかに多くの約束が空しくなったことか。そして狐の役を巧みに使えた者ほど成功した。ただしこの性質をうまく装い、ないものをあるように見せ、あるものをないように見せるのに長けていなければならない。人々はあまりに単純で、いま目の前の必要にあまりに従順なので、欺こうとする者はいつでも欺かせてくれる相手を見つける。最近の例を一つ、黙っておきたくはない。"
  "translation_status": "reviewed"
- "id": "pr-18-008"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 8
  "source_text": "Alessandro VI non fece mai altro che ingannare uomini, nè mai pensò ad altro, e trovò soggetto di poterlo fare; e non fu mai uomo che avesse maggiore efficacia in asseverare, e che con maggiori giuramenti affermasse una cosa, e che l’osservasse meno; nondimanco gli succederono sempre gl’inganni, perchè cognosceva bene questa parte del mondo. Ad un Principe adunque non è necessario avere in fatto tutte le soprascritte qualità, ma è ben necessario parere d’averle."
  "translation_ja": "アレクサンデル六世は、人を欺く以外のことをしたことも、考えたこともなかった。そしてそうできる相手が見つかった。断言するとき彼ほど人を信じ込ませ、何かをあれほど盛大に誓い、しかもこれほど守らなかった人はいない。にもかかわらず欺きはいつも成功した。世間のこの一面をよく知っていたのである。したがって君主は、すでに述べた長所を実際にすべて持つ必要はないが、持っていると思われることはまことに必要である。"
  "translation_status": "reviewed"
- "id": "pr-18-009"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 9
  "source_text": "Anzi ardirò di dire questo, che avendole, ed osservandole sempre, sono dannose; e parendo d’averle, sono utili; come parere pietoso, fedele, umano, religioso, intero, ed essere; ma stare in modo edificato con l’animo, che bisognando, tu possa e sappi mutare il contrario."
  "translation_ja": "さらにあえてこう言おう。それらを持ち、いつも守れば有害だが、持つように見えれば有益である。慈悲深く、忠実で、人間味に富み、信心深く、正直に見えること、そして実際そうであることだ。ただし必要が生じたら、反対に転じることができ、そのすべも知っているように心をつくっておく。"
  "translation_status": "reviewed"
- "id": "pr-18-010"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 10
  "source_text": "E hassi ad intendere questo, che un Principe, e massime un Principe nuovo, non può osservare tutte quelle cose, per le quali gli uomini sono tenuti buoni, essendo spesso necessitato, per mantenere lo Stato, operare contro alla umanità, contro alla carità, contro alla religione. E però bisogna che egli abbia un animo disposto a volgersi secondo che i venti e le variazioni della fortuna gli comandano; e, come di sopra dissi, non partirsi dal bene, potendo, ma sapere entrare nel male, necessitato."
  "translation_ja": "ここで理解してほしい。君主、とくに新しく立った君主は、人が善人とみなされるための事柄をすべては守れない。国を保つため、人間らしさに、慈愛に、宗教に反して行動せざるをえないことがたびたびある。それゆえ運の風向きや変転の命じるままに向きを変えられる心を持ち、先に言ったように、可能なら善から離れず、迫られたときは悪に入るすべを知っておかねばならない。"
  "translation_status": "reviewed"
- "id": "pr-18-011"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 11
  "source_text": "Deve adunque avere un Principe gran cura, che non gli esca mai di bocca una cosa che non sia piena delle soprascritte cinque qualità, e paia, a vederlo e udirlo, tutto pietà, tutto integrità, tutto umanità, tutto religione. E non è cosa più necessaria a parere d’avere, che quest’ultima qualità; perchè gli uomini in universale giudicano più agli occhi che alle mani, perchè tocca a vedere a ciascuno, a sentire a’ pochi."
  "translation_ja": "だから君主は、先に挙げた五つの性質で満ちていない言葉を一言も口から出さないよう細心の注意を払う。見て聞く者には、慈悲のかたまり、誠実さのかたまり、人間味のかたまり、信仰のかたまりと思わせるのである。とりわけ最後の性質ほど、持つように見える必要のあるものはない。総じて人は手で触れるよりも目で見て判断する。見ることは誰にでもできるが、じかに感じ取れるのは少数だからである。"
  "translation_status": "reviewed"
- "id": "pr-18-012"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 12
  "source_text": "Ognuno vede quel che tu pari; pochi sentono quel che tu sei, e quelli pochi non ardiscono opporsi alla opinione de’ molti, che abbiano la maesta dello stato che gli difende; e nelle azioni di tutti gli uomini, e massime de’ Principi, dove non è giudizio a chi reclamare, si guarda al fine."
  "translation_ja": "誰もがあなたの見かけを見る。あなたの本当の姿に触れるのはほんの少数で、その少数は、国家の威厳に支えられた多数の意見にあえて逆らわない。すべての人の行動、とりわけ訴え出るべき裁き手のない君主の行動では、人は結末に目を向ける。"
  "translation_status": "reviewed"
- "id": "pr-18-013"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 13
  "source_text": "Facci adunque un Principe conto di vivere e mantenere lo Stato; i mezzi saranno sempre giudicati onorevoli, e da ciascuno lodati; perchè il vulgo ne va sempre preso con quello che pare, e con l’evento della cosa; e nel mondo non è se non vulgo; e gli pochi hanno luogo, quando gli assai non hanno dove appoggiarsi."
  "translation_ja": "だから君主が生き延びて国を保つことを心がければ、使った手段はいつも名誉あるものと判断され、誰もがたたえるだろう。世間の人はいつも見かけと結末に心を奪われる。そして世間はそういう人々ばかりである。少数の人に出番があるのは、多数の人がよりどころを失ったときだ。"
  "translation_status": "reviewed"
- "id": "pr-18-014"
  "section_id": "pr-sec-18"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XVIII&oldid=3702267"
    "source_sequence": 14
  "source_text": "Alcuno Principe di questi tempi, il quale non è bene nominare, non predica mai altro, che pace e fede; e l’una e l’altra, quando e’ l’avesse osservata, gli arebbe più volte tolto lo Stato, e la riputazione."
  "translation_ja": "名を明かさないほうがよい同時代のある君主は、平和と信義以外のことは口にしない。しかしその二つを本当に守っていたら、彼はとうに何度も地位と名声を失っていたろう。"
  "translation_status": "reviewed"
- "id": "pr-19-001"
  "section_id": "pr-sec-19"
  "kind": "heading"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 1
  "source_text": "CAPITOLO XIX. Che si debbe fuggire l’essere disprezzato e odiato."
  "translation_ja": "第十九章　軽蔑され、憎まれることを避けるべきこと"
  "translation_status": "reviewed"
- "id": "pr-19-002"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 2
  "source_text": "Ma perchè circa le qualità, di che di sopra si fa menzione, io ho parlato delle più importanti, l’altre voglio discorrere brevemente sotto queste generalità, che il Principe pensi, come di sopra in parte è detto, di fuggire quelle cose che lo faccino odioso o vile; e qualunque volta fuggirà questo, arà adempiuto le parti sue, e non troverà nell’altre infamie pericolo alcuno."
  "translation_ja": "先に触れた君主の性質のうち、重要なものはすでに論じた。残りについては、すでに一部を述べたとおり、憎まれ、卑しく見られるようなことを避けるという一般的な観点のもとに手短に論じたい。それを避けるかぎり君主は役目を果たしており、そのほかの悪評には何の危険も見いださないだろう。"
  "translation_status": "reviewed"
- "id": "pr-19-003"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 3
  "source_text": "Odioso lo fa soprattutto, come io dissi, lo esser rapace, ed usurpatore della roba, e delle donne de’ sudditi; di che si deve astenere. Qualunque volta alle università degli uomini non si toglie nè roba nè onore, vivono contenti, e solo s’ha a combattere con l’ambizione di pochi, la quale in molti modi e con facilità si raffrena."
  "translation_ja": "何より憎まれるのは、これも言ったように、貪欲で、臣民の財産やその家の女性を奪うことである。これには手を出してはならない。財産にも名誉にも手をつけなければ、人々はおおむね満足して暮らす。あとはわずかな者の野心を相手にすればよく、それはさまざまな手で容易に抑えられる。"
  "translation_status": "reviewed"
- "id": "pr-19-004"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 4
  "source_text": "Abietto lo fa l’esser tenuto vario, leggiero, effeminato, pusillanimo, irresoluto; di che un Principe si deve guardare come da uno scoglio, ed ingegnarsi che nelle azioni sue si riconosca grandezza, animosità, gravità, fortezza; e, circa i maneggi privati de’ sudditi, volere che la sua sentenzia sia irrevocabile, e si mantenga in tale opinione, che alcuno non pensi nè ad ingannarlo, nè ad aggirarlo."
  "translation_ja": "卑しく見られるのは、移り気、軽薄、柔弱、臆病、優柔不断と思われることである。君主はこれらを暗礁のように避け、その行いに度量、勇気、重々しさ、強さが認められるよう努めるべきだ。臣民間の私事についても、いったん下した裁定を覆さないことを旨とし、誰も欺いたり丸め込んだりしようと思わないほどの評判を保つがよい。"
  "translation_status": "reviewed"
- "id": "pr-19-005"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 5
  "source_text": "Quel Principe che dà di sè questa opinione, è riputato assai; e contro a chi è riputato assai con difficultà si congiura, e con difficultà è assaltato, purchè si intenda che sia eccellente e reverito da’ suoi. Perchè un Principe deve avere due paure: una dentro per conto de’ sudditi; l’altra di fuori per conto de’ potenti esterni."
  "translation_ja": "そう思わせる君主は大いに重んじられる。優れていて配下の人々に敬われていると知れた人物を相手にするのは、陰謀を企てるにも、攻めるにも難しい。君主が恐れるべきは二つある。一つは臣民ゆえの内の恐れ、もう一つは強力な外国勢ゆえの外の恐れである。"
  "translation_status": "reviewed"
- "id": "pr-19-006"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 6
  "source_text": "Da questa si difende con le buone arme e buoni amici; e sempre, se arà buone arme, arà buoni amici; e sempre staranno ferme le cose di dentro, quando stieno ferme quelle di fuori, se già le non fossero perturbate da una congiura; e quando pure quelle di fuori movessero, se egli è ordinato, e vissuto come io ho detto, quando non si abbandoni, sosterrà ogni impeto, come dissi che fece Nabide Spartano."
  "translation_ja": "外の脅威からは、よい軍隊とよい友が身を守る。よい軍隊さえあれば常によい友にも恵まれる。外の事柄が安定していれば、陰謀がかき乱さぬかぎり、内も安定する。外が動揺しても、私の言ったように備え、暮らしてきた君主なら、自分を見捨てないかぎり、前に述べたスパルタのナビス同様、どんな衝撃にでも耐えられる。"
  "translation_status": "reviewed"
- "id": "pr-19-007"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 7
  "source_text": "Ma circa i sudditi, quando le cose di fuori non muovino, s’ha a temere, che non congiurino segretamente; del che il Principe si assicura assai, fuggendo l’essere odiato e disprezzato, e tenendosi il popolo satisfatto di lui; il che è necessario conseguire, come di sopra si disse a lungo."
  "translation_ja": "臣民については、外に動きがないときにも、ひそかに陰謀を企てないかを恐れなければならない。この点で君主をよく守ってくれるのは、憎しみと軽蔑を避け、民衆を自分に満足させておくことだ。その必要については先に詳しく述べた。"
  "translation_status": "reviewed"
- "id": "pr-19-008"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 8
  "source_text": "Ed uno de’ più potenti rimedi che abbi un Principe contro le congiure, è non essere odiato o disprezzato dall’universale; perchè sempre chi congiura crede con la morte del Principe satisfare al popolo; ma quando ei creda offenderlo, non piglia animo a prendere simil partito; perchè le difficultà che sono dalla parte de’ congiuranti, sono infinite."
  "translation_ja": "陰謀に対する最も強い守りの一つは、広く人々に憎まれたり軽蔑されたりしていないことである。陰謀を企てる者は、君主が死ねば民は喜ぶと思うものだ。民を怒らせると考えれば、そういう決断への度胸がつかない。陰謀者の側には数えきれない困難があるからである。"
  "translation_status": "reviewed"
- "id": "pr-19-009"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 9
  "source_text": null
  "translation_ja": "経験から見れば、陰謀は多いが、成功裏に終わったものは少ない。〔暗殺の共謀が成立する条件の詳細は非収録。〕君主への密告には確かな利益が見込めるのに、黙っている側の利益は不確かで危険が多い。だから協力者の忠誠はめったに期待できない、というのが著者の論旨である。"
  "translation_status": "partial"
  "issues":
  - "kind": "source_untranscribed"
    "status": "open"
    "message_ja": "段落原文を非収録：暗殺の共謀成立条件。歴史的事実と論旨を記載。"
- "id": "pr-19-010"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 10
  "source_text": "E, per ridurre la cosa in brevi termini, dico, che dalla parte del congiurante non è, se non paura, gelosia, sospetto di pena che lo sbigottisce; ma dalla parte del Principe è la maestà del Principato, le leggi, le difese degli amici e dello Stato che lo difendono; talmentechè aggiunto a tutte queste cose la benivolenza populare, è impossibile che alcun sia sì temerario, che congiuri."
  "translation_ja": "短く言えば、陰謀者の側には恐れ、不信、処罰への疑念があって気持ちをくじく。君主の側には君主権の威厳、法律、友と国家の保護がある。そのすべてに民衆の好意まで加われば、それでも陰謀を企てるほど向こう見ずな人はまずいない。"
  "translation_status": "reviewed"
- "id": "pr-19-011"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 11
  "source_text": "Perchè per l’ordinario dove uno congiurante ha a temere innanzi alla esecuzione del male, in questo caso debbe temere ancora dappoi, avendo per nimico il popolo, seguíto l’eccesso, nè potendo per questo sperare rifugio alcuno. Di questa materia se ne potria dare infiniti esempi; ma voglio solo esser contento d’uno, seguíto alla memoria de’ padri nostri."
  "translation_ja": "ふつう陰謀者には悪事を実行する前の恐れがある。しかもこの場合、事が起こった後にも恐れねばならない。民衆を敵に回し、どこにも逃げ場を期待できないからだ。例はいくらでもあるが、父たちの記憶にある一例で満足しよう。"
  "translation_status": "reviewed"
- "id": "pr-19-012"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 12
  "source_text": "Messer Annibale Bentivogli, avolo del presente Messer Annibale, che era Principe in Bologna, essendo da’ Canneschi, che gli congiurarono contro, ammazzato, nè rimanendo di lui altri che Messer Giovanni, quale era in fasce, subito dopo tale omicidio si levò il popolo, ed ammazzò tutti i Canneschi."
  "translation_ja": "いまのアンニーバレ殿の祖父にあたり、ボローニャの君主だったアンニーバレ・ベンティヴォーリョ殿は、カンネスキ一派の陰謀で殺された。残されたのはまだ産着にくるまれたジョヴァンニ殿だけだったが、殺害の直後、民衆が立ち上がりカンネスキ派を皆殺しにした。"
  "translation_status": "reviewed"
- "id": "pr-19-013"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 13
  "source_text": "Il che nacque dalla benivolenza popolare che la casa de’ Bentivogli aveva in quei tempi in Bologna; la qual fu tanta, che non vi restando alcuno che potesse, morto Annibale, reggere lo Stato, ed avendo indizio come in Firenze era un nato de’ Bentivogli, che si teneva fino allora figliuolo di un fabbro, vennero i Bolognesi per quello in Firenze, e li dettono il governo di quella città, la quale fu governata da lui fino a tanto che Messer Giovanni pervenisse in età conveniente al governo."
  "translation_ja": "当時ボローニャでベンティヴォーリョ家に寄せられた民衆の好意のためである。それほどの好意だったので、アンニーバレの死後、地元に国を治められる人がいなかったとき、フィレンツェに、それまでは鍛冶屋の子とされてきたベンティヴォーリョの血筋の者がいると聞き、ボローニャ人はそこまで迎えに行った。彼に町の統治を託し、ジョヴァンニ殿が統治を担える年齢になるまで彼が治めた。"
  "translation_status": "reviewed"
- "id": "pr-19-014"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 14
  "source_text": "Conchiudo adunque, che un Principe deve tenere delle congiure poco conto, quando il popolo gli sia benivolo; ma quando gli sia inimico, ed abbilo in odio, deve temere di ogni cosa e di ognuno. E gli stati bene ordinati, e li Principi savi hanno con ogni diligenza pensato di non far cadere in disperazione i grandi e di satisfare al popolo, e tenerlo contento, perchè questa è una delle più importanti materie che abbia un Principe."
  "translation_ja": "だから、民衆が好意を寄せているなら、君主は陰謀などさほど意に介する必要はないと結論しよう。だが民衆が敵となり憎んでいたら、すべての物事、すべての人を恐れなければならない。よく整った国と賢明な君主は、有力者を絶望に追いやらず、民衆を満足させておくために、知恵を尽くしてきた。君主にとって最も大事な問題の一つだからである。"
  "translation_status": "reviewed"
- "id": "pr-19-015"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 15
  "source_text": "Tra i Regni bene ordinati e governati a’ nostri tempi è quello di Francia, ed in esso si trovano infinite costituzioni buone, donde ne dipende la libertà e sicurtà del Re, delle quali la prima è il Parlamento, e la sua autorità; perchè quello che ordinò quel Regno, cognoscendo l’ambizione de’ potenti e la insolenza loro, e giudicando esser necessario loro un freno in bocca che gli correggesse; e dall’altra parte cognoscendo l’odio dell’universale contro i grandi, fondato in su la paura, e volendo assicurarli, non volse che questa fusse particolar cura del Re, per torli quel carico che e’ potesse avere con i grandi, favorendo i popolari, e con i popolari, favorendo i grandi; e però constituì un giudice terzo, che fusse quello, che senza carico del Re, battesse i grandi, e favorisse i minori."
  "translation_ja": "当代のよく組織され、治められた国にフランス王国がある。王の行動の自由と安全を支えるよい制度が数多くあり、その第一が高等法院とその権限である。王国を組織した人は、有力者の野心と横暴を知り、これを正すには口にはみをかける必要があると判断した。他方、有力者への民衆の憎しみが恐れに由来することも知って、民を安心させたいと考えた。だがこれを王個人の務めにはしなかった。民に味方すれば有力者に、有力者に味方すれば民に、王が責められるからだ。そこで第三の裁き手を設け、王が責めを被らずに有力者を抑え、小さな者を助けるようにした。"
  "translation_status": "reviewed"
- "id": "pr-19-016"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 16
  "source_text": "Nè potè essere questo ordine migliore, nè più prudente, nè maggior cagione di sicurtà del Re, e del Regno. Di che si può trarre un altro notabile, che li Principi debbono le cose di carico fare sumministrare ad altri, e quelle di grazie a lor medesimi. Di nuovo conchiudo, che un Principe debbe stimare i grandi, ma non si far odiare dal popolo."
  "translation_ja": "これ以上よい、思慮のある制度も、王と王国を安全にする大きな原因も、考えられなかった。ここから別の教訓が得られる。君主は恨みを買う処置を人に託し、恩恵をもたらすものは自分の手で行うべきだ。重ねて言おう。君主は有力者を尊重しながら、民衆には憎まれないようにしなければならない。"
  "translation_status": "reviewed"
- "id": "pr-19-017"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 17
  "source_text": "Parrebbe forse a molti, che, considerata la vita e morte di molti Imperatori Romani, fussono esempi contrarii a questa mia opinione, trovando alcuno esser vissuto sempre egregiamente, e mostro grande virtù d’animo, nondimeno aver perso l’imperio, ovvero essere stato morto da’ suoi che gli hanno congiurato contro."
  "translation_ja": "多くのローマ皇帝の生涯と最期を考えると、私の意見に反する例があると思う人も多かろう。いつも立派に生き、大きな気概を示したにもかかわらず、帝権を失うか、部下が企てた陰謀に殺された人がいるからだ。"
  "translation_status": "reviewed"
- "id": "pr-19-018"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 18
  "source_text": "Volendo adunque rispondere a queste obiezioni, discorrerò le qualità di alcuni Imperatori, mostrando la cagione della lor rovina, non disforme da quello che da me si è addutto; e parte metterò in considerazione quelle cose che sono notabili a chi legge le azioni di quelli tempi."
  "translation_ja": "この異論に答えるため、何人かの皇帝の性質を考え、彼らが没落した原因が私の挙げたことと食い違わないのを示そう。当時の行いを読む人にとって見逃せないこともいくらか取り上げたい。"
  "translation_status": "reviewed"
- "id": "pr-19-019"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 19
  "source_text": "E voglio mi basti pigliare tutti quelli Imperatori, che succederono nell’Imperio da Marco Filosofo a Massimino, li quali furono Marco, Commodo suo figliuolo, Pertinace, Iuliano, Severo, Antonino, Caracalla suo figliuolo, Macrino, Eliogabalo, Alessandro, e Massimino."
  "translation_ja": "哲人皇帝マルクスからマクシミヌスまでを取り上げれば十分であろう。マルクス、その子コンモドゥス、ペルティナクス、ユリアヌス、セウェルス、アントニヌス、その子カラカラ、マクリヌス、エラガバルス、アレクサンデル、マクシミヌスである。〔アントニヌスとカラカラの並びは底本のまま。〕"
  "translation_status": "reviewed"
- "id": "pr-19-020"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 20
  "source_text": "Ed è prima da notare, che dove negli altri Principi si ha solo a contendere con l’ambizione de’ grandi e insolenza de’ popoli, gl’Imperatori Romani avevano una terza difficultà, d’avere a sopportare la crudeltà ed avarizia de’ soldati; la qual cosa era sì difficile, che la fu cagione della rovina di molti, sendo difficile satisfare a’ soldati ed a’ popoli; perchè i populi amano la quiete, e per questo amano i Principi modesti, e li soldati amano il Principe d’animo militare, e che sia insolente, e crudele, e rapace."
  "translation_ja": "まず、ほかの君主が有力者の野心と民衆の横暴だけを相手にするのに対し、ローマ皇帝には第三の難題、兵士の残酷さと貪欲に堪えることがあった。きわめて難しく、多くの者の破滅の原因となった。兵士と民衆をともに満足させるのは難しい。民衆は平穏を好むので節度ある君主を好み、兵士は軍人肌で横暴、残酷、貪欲な君主を好むからだ。"
  "translation_status": "reviewed"
- "id": "pr-19-021"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 21
  "source_text": "Le quali cose volevano che egli esercitasse ne’ popoli, per potere avere duplicato stipendio, e sfogare la loro avarizia e crudeltà; donde ne nacque che quelli Imperatori che per natura o per arte non avevano riputazione tale, che con quella tenessero l’uno e l’altro in freno, sempre rovinavano; e li più di loro, massime quelli che come uomini nuovi venivano al Principato, conosciuta la difficultà di questi duoi diversi umori, si volgevano a satisfare a’ soldati, stimando poco l’ingiuriare il popolo."
  "translation_ja": "しかも兵士たちは、君主がこうした性質を民衆に向けるのを望んだ。給金を倍にもらい、自分の貪欲と残酷さを晴らすためである。だから生来の資質にせよ働きによって得たものにせよ、両方を抑えられるだけの威信を持たない皇帝は、いつも破滅した。とくに新参者の皇帝の多くは、二つの相異なる気質を扱う難しさを知ると、民を害するのは気にかけず、兵士を満足させる側に回った。"
  "translation_status": "reviewed"
- "id": "pr-19-022"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 22
  "source_text": "Il qual partito era necessario; perchè non potendo i Principi mancare di non essere odiati da qualcuno, si debbono prima sforzare di non essere odiati dall’università; e quando non possono conseguir questo, si debbono ingegnare con ogni industria fuggire l’odio di quelle università che sono più potenti."
  "translation_ja": "これは必要な選択だった。君主は誰かに憎まれるのをまったく避けることはできないのだから、まずは人々全体に憎まれないよう努め、それを達せられないなら、最も力を持つ集団の憎しみだけは避けるよう、あらゆる努力を用いるべきである。"
  "translation_status": "reviewed"
- "id": "pr-19-023"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 23
  "source_text": "E però quelli Imperatori, che per novità avevano bisogno di favori straordinari, aderivano ai soldati più volentieri, che alli popoli; il che tornava loro nondimeno utile o no, secondo che quel Principe si sapeva mantenere riputato con loro."
  "translation_ja": "それゆえ新参者であるため格別の支持を必要とした皇帝は、民より喜んで兵に肩入れした。それが役に立ったかどうかは、皇帝が兵のなかで威信を保てたかどうかによる。"
  "translation_status": "reviewed"
- "id": "pr-19-024"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 24
  "source_text": "Da queste cagioni sopradette nacque che Marco, Pertinace, e Alessandro essendo tutti di modesta vita, amatori della giustizia, inimici della crudeltà, umani, e benigni, ebbero tutti, da Marco infuora, tristo fine; Marco solo visse e morì onoratissimo, perchè lui succedè all’Imperio per eredità, e non aveva a ricognoscer quello nè dai soldati, nè dai popoli; dipoi essendo accompagnato da molte virtù che lo facevano venerando, tenne sempre, mentre visse, l’uno ordine e l’altro dentro a’ suoi termini, e non fu mai nè odiato, nè disprezzato."
  "translation_ja": "上述の理由から、節度ある生活をし、正義を愛し、残酷さを嫌い、人間味と善意をそなえたマルクス、ペルティナクス、アレクサンデルの三人も、マルクス以外は痛ましい最期を迎えた。マルクスだけがきわめて尊ばれて生き、尊ばれて死んだ。相続によって帝位につき、兵にも民にもそれを与えられた恩はなかったからである。また、尊崇を受けるさまざまな美点を併せ持ち、生涯、双方を分にとどめ、憎まれも軽蔑されもしなかった。"
  "translation_status": "reviewed"
- "id": "pr-19-025"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 25
  "source_text": "Ma Pertinace fu creato Imperadore contro alla voglia de’ soldati, li quali, essendo usi a vivere licenziosamente sotto Commodo, non poterono sopportare quella vita onesta, alla quale Pertinace gli voleva ridurre; onde avendosi creato odio, ed a questo odio aggiunto dispregio per l’esser vecchio, rovinò ne’ primi principii della sua amministrazione."
  "translation_ja": "だがペルティナクスが帝位に就いたのは兵の意に反してであった。コンモドゥスのもとで勝手気ままな暮らしに慣れた兵士らは、ペルティナクスが取り戻させようとした折り目の正しい生活に堪えられなかった。憎しみを招き、老齢ゆえの軽蔑までこれに加わり、治世の緒についたところで破滅した。"
  "translation_status": "reviewed"
- "id": "pr-19-026"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 26
  "source_text": "Onde si deve notare che l’odio si acquista così mediante le buone opere, come le triste; e però, come io dissi di sopra, volendo un Principe mantenere lo Stato, è spesso forzato a non esser buono; perchè quando quella università, o popolo, o soldati, o grandi che sieno, della quale tu giudichi, per mantenerti, aver bisogno, è corrotta, ti convien seguire l’umor suo, e sodisfarle; e allora le buone opere ti sono inimiche."
  "translation_ja": "注意すべきは、悪行と同じく善行によっても憎しみを買うことだ。それゆえ先に言ったように、地位を保とうとする君主は、しばしば善人でいられなくなる。支配を保つのに欠かせないと判断する集団が、民衆であれ、兵であれ、有力者であれ、腐敗しているなら、その気質に従い、満足させなければならない。そういうとき善行は自分に敵する。"
  "translation_status": "reviewed"
- "id": "pr-19-027"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 27
  "source_text": "Ma vegniamo ad Alessandro, il quale fu di tanta bontà, che tra l’altre lodi che gli sono attribuite, è, che in quattordici anni, che tenne l’imperio, non fu mai morto da lui nessuno ingiudicato; nondimanco, essendo tenuto effeminato, e uomo che si lasciasse governare dalla madre, e per questo venuto in dispregio; conspirò contro di lui l’esercito, ed ammazzollo."
  "translation_ja": "アレクサンデルはたいへん善良で、帝位にあった十四年間、裁きもせずに人を殺したことが一度もない、と称賛された。それでも柔弱で母の言いなりになる男と見られ、そのため軽蔑されて、軍が陰謀を企て彼を殺した。"
  "translation_status": "reviewed"
- "id": "pr-19-028"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 28
  "source_text": "Discorrendo ora per opposito le qualità di Commodo, di Severo, di Antonino, di Caracalla, e di Massimino, gli troverete crudelissimi e rapacissimi, li quali, per satisfare a’ soldati, non perdonarono a nissuna qualità d’ingiuria che ne’ popoli si potesse commettere; e tutti, eccetto Severo, ebbero tristo fine; perchè in Severo fu tanta virtù, che, mantenendosi i soldati amici, ancorchè i popoli fossero da lui gravati, potè sempre regnare felicemente; perchè quelle sue virtù lo facevano nel cospetto de’ soldati e de’ popoli sì mirabile, che questi rimanevano in un certo modo attoniti e stupidi, e quelli altri riverenti e satisfatti."
  "translation_ja": "逆にコンモドゥス、セウェルス、アントニヌス、カラカラ、マクシミヌスを見ると、いずれもひどく残酷で貪欲であり、兵を満足させるためには民にどんな害を加えることもためらわなかった。セウェルス以外はみな悲惨な最期を迎えた。セウェルスには大きな力量があり、民には重い負担を課しながらも、兵を味方に保ってつつがなく治め続けられた。その力量が兵にも民にも驚くべきものに見え、民は呆然としてものも言えず、兵はうやうやしく満足していたのである。"
  "translation_status": "reviewed"
- "id": "pr-19-029"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_XIX&oldid=3702263"
    "source_sequence": 29
  "source_text": "E perchè le azioni di costui furono grandi in un Principe nuovo, io voglio mostrare brevemente quanto egli seppe bene usare la persona della volpe e del lione, le quali nature dico, come di sopra, esser necessario imitare ad un Principe."
  "translation_ja": "新しい君主がここまでなし遂げたのは大きなことなので、彼が狐と獅子の役をいかに巧みに務めたか、手短に示したい。先に言ったとおり、君主がまねる必要のある二つの性質である。"
  "translation_status": "reviewed"
- "id": "pr-19-030"
  "section_id": "pr-sec-19"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"

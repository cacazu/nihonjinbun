- "id": "pr-08-017"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 17
  "source_text": "E morti tutti quelli che, per essere malcontenti, lo potevano offendere, si corroborò con nuovi ordini civili e militari; in modo che in spazio di un anno che tenne il Principato, non solamente egli era sicuro nella città di Fermo, ma era diventato formidabile a tutti li suoi vicini; e sarebbe stata la sua espugnazione difficile, come quella di Agatocle, se non si fusse lasciato ingannare da Cesare Borgia, quando a Sinigaglia, come di sopra si disse, prese gli Orsini e Vitelli, dove, preso ancora lui, un anno dopo il commesso parricidio, fu insieme con Vitellozzo, il quale aveva avuto maestro delle virtù e scelleratezze sue, strangolato."
  "translation_ja": "反対しうる不満分子が命を落とすと、彼は民政と軍事の制度を新たにして力を固めた。君主となって一年のうちに、フェルモ市内で安全になったにとどまらず、近隣のどの勢力にも恐れられる存在となった。先述のセニガッリアで、チェーザレ・ボルジアがオルシーニ、ヴィテッリ両家を捕らえた際、自分まで欺かれさえしなければ、アガトクレスと同じく倒すのは難しかったろう。叔父殺しから一年、彼も捕らえられ、力量と悪事の師であったヴィテッロッツォとともに絞め殺された。"
  "translation_status": "reviewed"
- "id": "pr-08-018"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"
    "precision": "work"
    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 18
  "source_text": "Potrebbe alcuno dubitare donde nascesse che Agatocle ed alcuno simile, dopo infiniti tradimenti e crudeltà, potette vivere lungamente sicuro nella sua patria, e difendersi dagl’inimici esterni, e da suoi cittadini non gli fu mai conspirato contra; conciossiachè molti altri, mediante la crudeltà, non abbino mai possuto ancora ne’ tempi pacifici mantenere lo Stato, non che ne’ tempi dubbiosi di guerre. Credo che questo avvenga dalle crudeltà male usate o bene usate."
  "translation_ja": "ここで人は疑うかもしれない。アガトクレスやこれに類する人が、裏切りと残虐を山ほど重ねたあと、長く故郷で安全に暮らし、外敵から守り、しかも同じ市民からただの一度も陰謀を受けなかったのはなぜか。ほかの多くの人は、残酷さのために、戦争で先の見えない時期はおろか平時にも、国を保てなかったではないか。私は、残酷さにも使い方の悪いものとよいものとがあるからだと思う。"
  "translation_status": "reviewed"
- "id": "pr-08-019"
  "section_id": "pr-sec-08"
  "kind": "paragraph"
  "origin": "source"
  "source_languages":
  - "it"
  "source_locations":
  - "source_id": "src-1814-it"

    "url": "https://it.wikisource.org/w/index.php?title=Il_Principe/Capitolo_VIII&oldid=3702257"
    "source_sequence": 19
  "source_text": null
  "translation_ja": "悪について「よい」などと言ってよいならば、という留保のうえで、著者は、残虐さが繰り返されず統治が臣民の利益に向き直る場合と、初めは少なくとも時とともに残虐さが増す場合とを区別する。前者の国には、アガトクレスのように、神と人との前でなお立て直す余地があるとする。〔加害の時期を組織する具体的な助言は非収録。〕"
  "translation_status": "partial"

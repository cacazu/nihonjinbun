        "bibliographic_apparatus":
        - "unit_id": "rongo-01-007"
          "type": "footnote"
          "source_anchor": "cite_note-1"
          "text": "牛鵬濤根據郭店簡《五行》中「心」與「色」的關係認爲「賢賢易色」應理解爲「尊尚賢人，改易顔色」。牛鵬濤：《簡帛零札二則》，上海：中西書局，2012年，第199-201頁。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#cite_note-1"
        - "unit_id": "rongo-02-003"
          "type": "footnote"
          "source_anchor": "cite_note-1"
          "text": "侯乃峰根據傳世文獻與出土文獻中「恥」「止」二字相通認爲這裏的「恥」應讀爲「止」，訓爲「止度」「節度」。侯乃峰：《〈天子建州〉禮學字詞疏證三則》，《古籍研究》2013年第1期。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#cite_note-1"
        - "unit_id": "rongo-04-014"
          "type": "footnote"
          "source_anchor": "cite_note-1"
          "text": "傳世本『未』作『求』。《憲問》有『不患人之不己知，患其不能也。』，《衞靈公》有『君子病無能焉，不病人之不己知也。』，與本章語意近，《定州漢墓竹簡・論語》正作『不患無位，患所以立。不患莫己知，未爲可知也。』，得傳世本作『求』爲訛誤。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#cite_note-1"
        - "unit_id": "rongo-06-024"
          "type": "footnote"
          "source_anchor": "cite_note-1"
          "text": "袁金平、李麗珠根據出土文獻與之對應句作「君子可選」，認爲「選」優於今本「逝」。袁金平、李麗珠：《據古文字資料再論〈論語·雍也〉「君子可逝」句》，《語言科學》2019年第1期。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#cite_note-1"
        - "unit_id": "rongo-07-006"
          "type": "footnote"
          "source_anchor": "cite_note-1"
          "text": "傳世本『狎』作『據』。《禮記・緇衣》有『德易狎而難親也』，與本章語意近，《郭店楚墓竹簡・語叢三》正作『志於道，狎於德，依於仁，游於藝。』，得傳世本作『據』爲訛誤。"
          "links":
          - "label": "《禮記・緇衣》"
            "url": "https://zh.wikisource.org/wiki/%E7%A6%AE%E8%A8%98/%E7%B7%87%E8%A1%A3"
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#cite_note-1"
        - "unit_id": "rongo-07-017"
          "type": "footnote"
          "source_anchor": "cite_note-2"
          "text": "黄尚明根據「執」「埶」二字相混指出這裏的「執」應該讀爲「埶（藝）」。黄尚明：《從楚簡證「《詩》《書》執禮」的「執」應讀爲「埶」》，簡帛網，2011年10月14日。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#cite_note-2"
        - "unit_id": "rongo-08-004"
          "type": "footnote"
          "source_anchor": "cite_note-1"
          "text": "顔世鉉認爲「動容貌」應爲「謹容貌」。顔世鉉：《説「重」「堇」形訛現象與相關的古書校讀》，《先秦兩漢訛字學術研討會論文集》，清華大學，2018年7月14日-15日，第245-246頁。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#cite_note-1"
        - "unit_id": "rongo-08-007"
          "type": "footnote"
          "source_anchor": "cite_note-2"
          "text": "顔世鉉根據古文字「弘」「强」同形的關係認爲「弘」應讀爲「强」。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#cite_note-2"
        - "unit_id": "rongo-08-009"
          "type": "footnote"
          "source_anchor": "cite_note-3"
          "text": "此句之句讀頗有爭議，亦可爲「民可，使由之；不可，使知之。」"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#cite_note-3"
        - "unit_id": "rongo-08-017"
          "type": "footnote"
          "source_anchor": "cite_note-4"
          "text": "顔世鉉據此認爲「失」可能讀爲「逸」。顔世鉉：《以出土文獻的用字方法校讀傳世古書-以兩則〈論語〉的校讀爲例》《源遠流長：漢字國際學術研討會暨AEARU第三届漢字文化研討會論文集》，北京：北京大學出版社，2017年6月，第248-261頁。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#cite_note-4"
        - "unit_id": "rongo-10-018"
          "type": "footnote"
          "source_anchor": "cite_note-1"
          "text": "陳劍根據出土文獻「色」「疑」二字的寫法指出「色」爲「疑」字之誤。陳劍：《據戰國竹簡文字校讀古書兩則》，《第四屆國際中國古文字學研討會論文集—新世紀的古文字學與經典詮釋》，香港中文大學中國語言及文學系，2003年10月，第371-373頁。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#cite_note-1"
        - "unit_id": "rongo-13-018"
          "type": "footnote"
          "source_anchor": "cite_note-1"
          "text": "李鋭認爲「直躬」可能讀爲「德躬」。李鋭：《孔子「直躬」章「直」字新説》，《古文字研究》第三十五輯，北京：中華書局，2024年，第560-563頁。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#cite_note-1"
        - "unit_id": "rongo-14-036"
          "type": "footnote"
          "source_anchor": "cite_note-1"
          "text": "吴昊亨根據楚簡中有「直」表示{德}的現象認爲「以直報怨」應讀爲「以德報怨」。吴昊亨：《戰國楚第竹簡多字記録一詞現象研究》，吉林大學博士學位論文，2023年，第267-268頁。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#cite_note-1"
        - "unit_id": "rongo-16-011"
          "type": "footnote"
          "source_anchor": "cite_note-1"
          "text": "蔡偉認爲「求」爲「成」字之訛。蔡偉：《據安大簡〈仲尼曰〉校〈論語〉一則》，復旦大學出土文獻與古文字研究中心，2022年8月31日。"
          "links": []
          "license": "CC-BY-SA-4.0"
          "source_url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#cite_note-1"
        - "unit_id": "rongo-20-002"
          "type": "footnote"
          "source_anchor": "cite_note-1"
          "text": "傳世本『貪』作『有司』二字，據侯乃峯《據新出楚簡校讀〈論語〉一則》改。"
          "links":
          - "label": "侯乃峯《據新出楚簡校讀〈論語〉一則》"
            "url": "http://www.fdgwz.org.cn/Web/Show/2177"
          "license": "CC-BY-SA-4.0"

  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-13-018-source-note-002-text"
  "section_id": "rongo-chapter-13"
  "kind": "note_body"
  "origin": "source"
  "source_text": "李鋭認爲「直躬」可能讀爲「德躬」。李鋭：《孔子「直躬」章「直」字新説》，《古文字研究》第三十五輯，北京：中華書局，2024年，第560-563頁。"
  "source_languages":

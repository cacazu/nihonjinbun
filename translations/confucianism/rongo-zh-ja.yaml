- "id": "rongo-20-003"
  "section_id": "rongo-chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不知命，無以爲君子也；不知禮，無以立也；不知言，無以知人也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-20"
    "precision": "block"
    "anchor": "二十之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%A0%AF%E6%9B%B0%E7%AC%AC%E4%BA%8C%E5%8D%81&oldid=2175814#%E4%BA%8C%E5%8D%81%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「天命を知らなければ、立派な人にはなれない。礼を知らなければ、自分を立てることができない。言葉を理解しなければ、人を知ることができない。」"
  "translation_status": "draft"
- "id": "rongo-22-001"
  "section_id": "rongo-appendix-22"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子知道之易也，易易云者，三日。子曰：「此道之美也，莫之御也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-22"
    "precision": "block"
    "anchor": "論語"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%9F%A5%E9%81%93%E7%AC%AC%E4%BA%8C%E5%8D%81%E4%BA%8C&oldid=8215407#%E8%AB%96%E8%AA%9E"
  "translation_ja": "孔子は、道の行いやすさを知り、「行いやすい、行いやすい」と三日の間言っていた。孔子は言った。「この道のすばらしさは、何ものもとどめられない。」"
  "translation_status": "draft"
- "id": "rongo-22-001-tn-001-text"
  "section_id": "rongo-appendix-22"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本が『知道第二十二』として掲げる短い断片で、通常伝わる二十篇の本文とは区別して収録した。『易易云者、三日』の句切りや意味には不確かなところがあり、ここでは底本の字面から読める意味を示した。"
  "translation_status": "draft"
- "id": "rongo-22-001-tn-002-text"
  "section_id": "rongo-appendix-22"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "末尾の『莫之御』は、とどめるものがないと読んだ。実践する者がいないという別の読みもあり、解釈は定まっていない。"
  "translation_status": "draft"

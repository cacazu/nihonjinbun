- "id": "rongo-12-001"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "顏淵問「仁」。子曰：「克己復禮爲仁。一日克己復禮，天下歸仁焉，爲仁由己，而由人乎哉？」顏淵曰：「請問其目。」子曰：「非禮勿視，非禮勿聽，非禮勿言，非禮勿動。」顏淵曰：「回雖不敏，請事斯語矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E4%B8%80"
  "translation_ja": "顔淵が仁について尋ねた。孔子は言った。「自分の欲に打ち勝って礼へ立ち返ることが、仁だ。一日でもそれができれば、天下の人々はその仁を認めるだろう。仁を行うのは自分自身だ。ほかの人次第だろうか。」顔淵が「具体的にはどうすればよいでしょう」と尋ねると、孔子は答えた。「礼にかなわないものを見ず、聞かず、礼にかなわないことを言わず、行わないことだ。」顔淵は言った。「私は鈍い者ですが、そのお言葉を実行させてください。」"
  "translation_status": "draft"
- "id": "rongo-12-002"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "仲弓問「仁」。子曰：「出門如見大賓，使民如承大祭，己所不欲，勿施於人。在邦無怨，在家無怨。」仲弓曰：「雍雖不敏，請事斯語矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E4%BA%8C"
  "translation_ja": "仲弓が仁について尋ねた。孔子は言った。「外へ出たら大切な賓客に会うようにし、民に仕事をさせるときは大祭を務めるようにしなさい。自分が望まないことは、人にしないことだ。国に仕えても、家に仕えても、恨みを残さないようにする。」仲弓は言った。「私は鈍い者ですが、そのお言葉を実行させてください。」"
  "translation_status": "draft"
- "id": "rongo-12-003"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "司馬牛問「仁」。子曰：「仁者，其言也訒。」曰：「其言也訒，斯謂之『仁』已乎？」子曰：「爲之難，言之得無訒乎！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E4%B8%89"
  "translation_ja": "司馬牛が仁について尋ねた。孔子は言った。「仁のある人は、軽々しく口を開かない。」「軽々しく口を開かないだけで、仁と言えるのでしょうか。」孔子は答えた。「実行するのは難しいのだ。言葉にするとき、慎重にならずにいられるだろうか。」"
  "translation_status": "draft"
- "id": "rongo-12-004"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "司馬牛問「君子」。子曰：「君子不憂不懼。」曰：「不憂不懼，斯謂之『君子』已乎？」子曰：「內省不疚，夫何憂何懼！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%9B%9B"
  "translation_ja": "司馬牛が立派な人について尋ねた。孔子は言った。「立派な人は、思い悩まず、恐れない。」「思い悩まず恐れないだけで、立派な人と呼べるのでしょうか。」孔子は答えた。「自分の内を省みて、やましいところがなければ、何を思い悩み、何を恐れることがあろう。」"
  "translation_status": "draft"
- "id": "rongo-12-005"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "司馬牛憂曰：「人皆有兄弟，我獨亡！」子夏曰：「商聞之矣：『死生有命，富貴在天』君子敬而無失，與人恭而有禮，四海之內，皆兄弟也，君子何患乎無兄弟也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E4%BA%94"
  "translation_ja": "司馬牛は心配して言った。「人にはみな兄弟がいるのに、私だけにはいない。」子夏は言った。「私はこう聞いている。『生死には定めがあり、富や地位は天にある。』立派な人がつつしみを保って過ちを犯さず、人に敬意をもって礼儀正しく接すれば、世界の中の人々はみな兄弟だ。立派な人が、どうして兄弟のいないことを心配するのか。」"
  "translation_status": "draft"
- "id": "rongo-12-006"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張問「明」。子曰：「浸潤之譖，膚受之愬，不行焉，可謂明也已矣。浸潤之譖，膚受之愬，不行焉，可謂遠也已矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%85%AD"
  "translation_ja": "子張が、物事を明らかに見分けることについて尋ねた。孔子は言った。「じわじわと染み込む悪口や、肌で受けたように切実に訴える中傷に惑わされなければ、明らかに見分ける力があると言える。それらに惑わされないなら、遠くまで見通す力があるとも言える。」"
  "translation_status": "draft"
- "id": "rongo-12-007"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢問「政」。子曰：「足食，足兵，民信之矣。」子貢曰：「必不得已而去，於斯三者何先？」曰：「去兵。」子貢曰：「必不得已而去，於斯二者何先？」曰：「去食。自古皆有死，民無信不立。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E4%B8%83"
  "translation_ja": "子貢が政治について尋ねた。孔子は言った。「食べ物を十分にし、軍備を十分にし、民の信頼を得ることだ。」子貢が「やむを得ず一つ捨てるなら、三つのうち何を先に捨てますか」と尋ねると、「軍備を捨てる」と答えた。「残る二つから、さらに一つ捨てなければならないなら、何を先に捨てますか。」「食べ物を捨てる。昔から、人には誰でも死がある。だが、民の信頼がなければ、国は成り立たない。」"
  "translation_status": "draft"
- "id": "rongo-12-008"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "棘子成曰：「君子質而已矣，何以文爲？」子貢曰：「惜乎，夫子之說，君子也，駟不及舌！文猶質也，質猶文也；虎豹之鞹，猶犬羊之鞹。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%85%AB"
  "translation_ja": "棘子成が言った。「立派な人は、中身があればそれでよい。飾りや教養が何の役に立つのか。」子貢は言った。「惜しいですね。立派な人について、そんなことをおっしゃるとは。四頭立ての馬車でも、口から出た言葉には追いつけません。形は中身と同じくらい大切で、中身も形と同じくらい大切です。毛を取り去った虎や豹の皮は、犬や羊の皮と変わらなくなります。」"
  "translation_status": "draft"
- "id": "rongo-12-009"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "哀公問於有若曰：「年饑，用不足，如之何？」有若對曰：「盍徹乎？」曰：「二，吾猶不足，如之何其徹也？」對曰：「百姓足，君孰與不足？百姓不足，君孰與足！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E4%B9%9D"
  "translation_ja": "哀公が有若に尋ねた。「凶作で、国の支出をまかなえない。どうしたらよいか。」有若は答えた。「なぜ十分の一の税になさらないのですか。」「十分の二を取っても足りないのだ。どうして十分の一にできよう。」有若は答えた。「民の暮らしが十分なら、君主だけが不足することがあるでしょうか。民の暮らしが不足しているのに、君主だけが十分でいられるでしょうか。」"
  "translation_status": "draft"
- "id": "rongo-12-010"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張問「崇德，辨惑。」子曰：「主忠信，徙義：崇德也。愛之欲其生，惡之欲其死；既欲其生，又欲其死：是惑也。」（誠不以富，亦祇以異。）"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%8D%81"
  "translation_ja": |-
    子張が、徳を高め、惑いを見分けることについて尋ねた。孔子は言った。「誠実さと信頼を第一にし、正しいことへ進む。それが徳を高めることだ。人を愛すると生きていてほしいと思い、憎むと死んでほしいと思う。生きてほしいと思ったかと思えば、今度は死んでほしいと思う。それが惑いだ。」
    「本当に富によるのではなく、ただ、他と異なるからなのだ。」
  "translation_status": "draft"
- "id": "rongo-12-010-tn-001-text"
  "section_id": "rongo-chapter-12"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "末尾の二句は『詩経』の引用で、底本では丸括弧に入っている。前の話とのつながりには異説があり、文章が別の位置から紛れ込んだとする説もある。削らずに区別して残した。"
  "translation_status": "draft"
- "id": "rongo-12-011"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "齊景公問「政」於孔子。孔子對曰：「君君，臣臣，父父，子子。」公曰：「善哉！信如君不君，臣不臣，父不父，子不子，雖有粟，吾得而食諸？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "斉の景公が孔子に政治について尋ねた。孔子は答えた。「君主が君主らしく、臣下が臣下らしく、父が父らしく、子が子らしくあることです。」景公は言った。「よい答えだ。もし本当に君主が君主らしくなく、臣下が臣下らしくなく、父が父らしくなく、子が子らしくなければ、穀物があっても、私はそれを食べていられるだろうか。」"
  "translation_status": "draft"
- "id": "rongo-12-012"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「片言可以折獄者，其由也與！」子路無宿諾。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "孔子が言った。「わずかな言葉で訴えを決着させられるのは、由だろう。」子路は約束を翌日まで放っておかなかった。"
  "translation_status": "draft"
- "id": "rongo-12-013"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「聽訟，吾猶人也；必也使無訟乎！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "孔子が言った。「訴えを聞いて裁くことなら、私は人並みだ。だが目指すべきは、訴えが起こらないようにすることだろう。」"
  "translation_status": "draft"
- "id": "rongo-12-014"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張問「政」。子曰：「居之無倦，行之以忠。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "子張が政治について尋ねた。孔子は言った。「その役目にあって怠らず、実行するときは真心を尽くすことだ。」"
  "translation_status": "draft"
- "id": "rongo-12-015"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「博學以文，約之以禮；亦可以弗畔矣夫！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "孔子が言った。「広く文献を学び、礼によって自分を引き締めれば、道に背かずにいられるだろう。」"
  "translation_status": "draft"
- "id": "rongo-12-016"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子成人之美，不成人之惡。小人反是。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「立派な人は、人のよいところが実を結ぶよう助け、悪いところが実を結ぶようにはしない。つまらない人は、その逆をする。」"
  "translation_status": "draft"
- "id": "rongo-12-017"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季康子問「政」於孔子。孔子對曰：「『政』者，正也。子帥以正，孰敢不正？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "季康子が孔子に政治について尋ねた。孔子は答えた。「政治とは、正すことです。あなたが正しい行いで先に立てば、誰があえて正しくないことをするでしょう。」"
  "translation_status": "draft"
- "id": "rongo-12-018"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季康子患盜，問於孔子。孔子對曰：「苟子之不欲，雖賞之不竊。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "季康子が盗みの多さを心配し、孔子に尋ねた。孔子は答えた。「あなた自身がむやみに欲しがらなければ、褒美を出して盗ませようとしても、人々は盗まないでしょう。」"
  "translation_status": "draft"
- "id": "rongo-12-019"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季康子問政於孔子曰：「如殺無道，以就有道，何如？」孔子對曰：「子爲政，焉用殺？子欲善，而民善矣。君子之德，風；小人之德，草；草上之風，必偃。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "季康子が孔子に政治について尋ねた。「道に背く者を殺し、道に従う者へ近づけていくのはどうだろう。」孔子は答えた。「あなたが政治を行うのに、なぜ殺す必要があるのですか。あなたが善を望めば、民も善くなります。上に立つ人の徳は風、民の徳は草です。草の上を風が吹けば、草は必ずなびきます。」"
  "translation_status": "draft"
- "id": "rongo-12-020"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張問：「士何如斯可謂之『達』矣？」子曰：「何哉，爾所謂『達』者？」子張對曰：「在邦必聞，在家必聞。」子曰：「是『聞』也，非『達』也。夫『達』也者，質直而好義，察言而觀色，慮以下人，在邦必達，在家必達。夫『聞』也者：色取仁而行違，居之不疑。在邦必聞，在家必聞。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "子張が尋ねた。「道を志す者は、どうあれば『通達した人』と呼べますか。」孔子は言った。「お前の言う『通達した人』とは、どういう人だ。」子張は答えた。「国に仕えても必ず名が知られ、家に仕えても必ず名が知られる人です。」孔子は言った。「それは『評判の人』であって、『通達した人』ではない。通達した人は、中身がまっすぐで正しさを好み、人の言葉や表情をよく見て、へりくだることを心がける。だから国に仕えても、家に仕えても、道が通じる。評判だけの人は、顔つきでは仁を装いながら行いはそれに背き、それでも疑いなく居座っている。そういう人でも、国や家の中で名が知られることはあるのだ。」"
  "translation_status": "draft"
- "id": "rongo-12-021"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "樊遲從遊於舞雩之下曰：「敢問崇德，脩慝，辨惑？」子曰：「善哉問！先事後得，非『崇德』與？攻其惡，無攻人之惡，非『脩慝』與？一朝之忿，忘其身以及其親，非『惑』與？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "樊遅が孔子について舞雩の祭壇の下を歩いていて、尋ねた。「徳を高め、心の悪いところを改め、惑いを見分けるとは、どういうことでしょう。」孔子は言った。「よい問いだ。なすべきことを先にし、報いをあとにする。それが徳を高めることではないか。自分の悪いところを責め、人の悪いところを責めない。それが心の悪いところを改めることではないか。一時の怒りで自分の身を忘れ、親にまで災いを及ぼす。それが惑いではないか。」"
  "translation_status": "draft"
- "id": "rongo-12-022"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "樊遲問「仁」。子曰：「愛人。」問「知」。子曰：「知人。」樊遲未達，子曰：「擧直錯諸枉，能使枉者直。」樊遲退，見子夏曰：「鄉也吾見於夫子而問『知』，子曰：『擧直錯諸枉，能使枉者直』，何謂也？」子夏曰：「富哉言乎！舜有天下，選於眾，擧皋陶，不仁者遠矣。湯有天下，選於眾，擧伊尹，不仁者遠矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "樊遅が仁について尋ねると、孔子は「人を愛することだ」と言った。知恵について尋ねると、「人を知ることだ」と言った。樊遅が理解できずにいると、孔子は言った。「まっすぐな人を取り立て、曲がった人の上に置けば、曲がった人もまっすぐにできる。」樊遅は退出して子夏に会い、言った。「さきほど先生に知恵について尋ねたら、『まっすぐな人を取り立て、曲がった人の上に置けば、曲がった人もまっすぐにできる』とおっしゃった。どういう意味だろう。」子夏は答えた。「なんと豊かな意味を持つ言葉だろう。舜が天下を治めたとき、多くの人の中から皋陶を選んで取り立てると、仁のない者は遠ざかった。湯が天下を治めたとき、多くの人の中から伊尹を選んで取り立てると、仁のない者は遠ざかったのだ。」"
  "translation_status": "draft"
- "id": "rongo-12-023"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢問「友」。子曰：「忠吿而善道之，不可則止，毋自辱焉。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "子貢が友との付き合いについて尋ねた。孔子は言った。「真心を込めて忠告し、うまく導いてやりなさい。受け入れられなければ、そこでやめることだ。自分から辱めを招いてはいけない。」"
  "translation_status": "draft"
- "id": "rongo-12-024"
  "section_id": "rongo-chapter-12"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子曰：「君子以文會友，以友輔仁。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-12"
    "precision": "block"
    "anchor": "十二之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%A1%8F%E6%B7%B5%E7%AC%AC%E5%8D%81%E4%BA%8C&oldid=10602324#%E5%8D%81%E4%BA%8C%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "曾子が言った。「立派な人は、学問や文化を通して友と出会い、友を通して仁を育てる。」"
  "translation_status": "draft"
- "id": "rongo-13-001"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路問政。子曰：「先之，勞之。」請益，曰：「無倦。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%B8%80"
  "translation_ja": "子路が政治について尋ねた。孔子は言った。「人々の先に立ち、人々のために骨を折ることだ。」さらに教えを求めると、「怠らないことだ」と答えた。"
  "translation_status": "draft"
- "id": "rongo-13-002"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "仲弓爲季氏宰，問政。子曰：「先有司。赦小過。擧賢才。」曰：「焉知賢才而擧之？」曰：「擧爾所知。爾所不知，人其舍諸？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%8C"
  "translation_ja": "仲弓は季氏の家政を預かることになり、政治について尋ねた。孔子は言った。「まず、それぞれの役目を持つ者を働かせなさい。小さな過ちは許し、優れた人材を取り立てなさい。」仲弓が「優れた人をどう見つけて取り立てればよいのでしょう」と聞くと、孔子は言った。「自分の知っている人を取り立てればよい。自分の知らない人まで、ほかの人が放っておくだろうか。」"
  "translation_status": "draft"
- "id": "rongo-13-003"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路曰：「衞君待子而爲政，子將奚先？」子曰：「必也正名乎！」子路曰：「有是哉？子之迂也！奚其正？」子曰：「野哉，由也！君子於其所不知，蓋闕如也。名不正，則言不順；言不順，則事不成；事不成，則禮樂不興；禮樂不興，則刑罰不中；刑罰不中，則民無所措手足。故君子名之必可言也，言之必可行也。君子於其言，無所苟而已矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%B8%89"
  "translation_ja": "子路が言った。「衛の君主が先生をお迎えして政治を任せたら、何を先になさいますか。」孔子は答えた。「きっと、名を正すことだろう。」子路は言った。「そんなことですか。先生は遠回りですね。何を正すというのでしょう。」孔子は言った。「粗雑だな、由は。立派な人は、自分が知らないことについては、分からないままにしておくものだ。名が正しくなければ、言葉の筋が通らない。言葉の筋が通らなければ、仕事は成し遂げられない。仕事が成し遂げられなければ、礼や音楽は興らない。礼や音楽が興らなければ、刑罰が適切にならない。刑罰が適切でなければ、民は手足をどこへ置けばよいかさえ分からなくなる。だから立派な人が名づけるなら、必ず筋の通る説明ができ、説明するなら、必ず実行できなければならない。立派な人は、自分の言葉をいい加減にはしない。それだけだ。」"
  "translation_status": "draft"
- "id": "rongo-13-004"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "樊遲請學稼，子曰：「吾不如老農。」請學爲圃，曰：「吾不如老圃。」樊遲出，子曰：「小人哉，樊須也！上好禮，則民莫敢不敬；上好義，則民莫敢不服；上好信，則民莫敢不用情，夫如是，則四方之民，襁負其子而至矣，焉用稼？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%9B%9B"
  "translation_ja": "樊遅が穀物の作り方を学びたいと願い出た。孔子は言った。「私は年季の入った農夫には及ばない。」野菜の作り方を学びたいと願い出ると、「私は年季の入った菜園の作り手には及ばない」と言った。樊遅が出ていくと、孔子は言った。「樊須は、小さなところに心を向けている。上に立つ人が礼を好めば、民は敬意を欠こうとはしない。正しさを好めば、民は従わずにはいない。信頼を大切にすれば、民は真心を尽くさずにはいない。そうなれば、各地から人々が子を背負って集まってくるだろう。自分で穀物を作ることが、どうして必要なのか。」"
  "translation_status": "draft"
- "id": "rongo-13-005"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「誦詩三百，授之以政，不達。使於四方，不能專對；雖多，亦奚以爲？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%94"
  "translation_ja": "孔子が言った。「『詩経』三百篇を暗唱できても、政治を任されて仕事ができず、使者として各地へ行っても、自分で適切な受け答えができない。それでは、多く覚えていても、何の役に立つだろう。」"
  "translation_status": "draft"
- "id": "rongo-13-006"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「其身正，不令而行；其身不正，雖令不從。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%85%AD"
  "translation_ja": "孔子が言った。「上に立つ人の行いが正しければ、命令しなくても行われる。その人の行いが正しくなければ、命令しても従われない。」"
  "translation_status": "draft"
- "id": "rongo-13-007"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「魯衞之政，兄弟也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%B8%83"
  "translation_ja": "孔子が言った。「魯と衛の政治は、兄弟のようなものだ。」"
  "translation_status": "draft"
- "id": "rongo-13-008"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂衞公子荊，「善居室：始有，曰：『苟合矣；』少有，曰：『苟完矣。』富有，曰：『苟美矣。』」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%85%AB"
  "translation_ja": "孔子は、衛の公子荊の家の構え方をよいと言った。彼は少し財産ができたとき、「どうやら必要なものが集まった」と言い、もう少し増えると「どうやらそろった」と言い、豊かになっても「どうやら立派になった」と言った。"
  "translation_status": "draft"
- "id": "rongo-13-009"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子適衞，冉有僕。子曰：「庶矣哉！」冉有曰：「既庶矣，又何加焉？」曰：「富之。」曰：「既富矣，又何加焉？」曰：「教之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子が衛へ行ったとき、冉有が車を御していた。孔子は「人が多いな」と言った。冉有が「すでに人が多いなら、さらに何を加えるべきでしょうか」と尋ねると、「暮らしを豊かにすることだ」と答えた。「すでに豊かになったら、さらに何を加えますか。」「教えることだ。」"
  "translation_status": "draft"
- "id": "rongo-13-010"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「苟有用我者，期月而已可也，三年有成。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%8D%81"
  "translation_ja": "孔子が言った。「もし私を用いる人がいれば、一年でどうにか形にできるだろう。三年あれば、成果を上げられる。」"
  "translation_status": "draft"
- "id": "rongo-13-011"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「『善人爲邦百年，亦可以勝殘去殺矣。』誠哉是言也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子が言った。「『善い人たちが百年にわたって国を治めれば、残酷さに打ち勝ち、死刑をなくすこともできる。』本当に、その通りだ。」"
  "translation_status": "draft"
- "id": "rongo-13-012"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「如有王者，必世而後仁。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "孔子が言った。「王者が現れたとしても、世の中が仁に満ちるまでには、一世代は必要だろう。」"
  "translation_status": "draft"
- "id": "rongo-13-013"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「苟正其身矣，於從政乎何有？不能正其身，如正人何？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "孔子が言った。「自分自身を正せるなら、政治を行うのに何が難しいだろう。自分自身を正せないなら、どうやって人を正すつもりなのか。」"
  "translation_status": "draft"
- "id": "rongo-13-014"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "冉子退朝，子曰：「何晏也？」對曰：「有政。」子曰：「其事也！如有政，雖不吾以，吾其與聞之！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "冉子が朝の務めから帰ってきた。孔子が「なぜこんなに遅かったのか」と聞くと、「政治の仕事がありました」と答えた。孔子は言った。「家の仕事だろう。国の政治のことなら、私が用いられていなくても、話くらいは聞かされるはずだ。」"
  "translation_status": "draft"
- "id": "rongo-13-015"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "定公問：「一言而可以興邦，有諸？」孔子對曰：「言不可以若是其幾也！人之言曰：『爲君難，爲臣不易』。如知爲君之難也，不幾乎一言而興邦乎？」曰：「一言而喪邦，有諸？」孔子對曰：「言不可以若是其幾也！人之言曰：『予無樂乎爲君，唯其言而莫予違也。』如其善而莫之違也，不亦善乎？如不善而莫之違也，不幾乎一言而喪邦乎？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "定公が尋ねた。「一言で国を盛んにできることはあるだろうか。」孔子は答えた。「言葉にそれほどの効き目を期待することはできません。ただ、人は『君主であることは難しく、臣下であることも容易ではない』と言います。君主であることの難しさを本当に知れば、一言で国を盛んにすることに近づくのではないでしょうか。」定公は尋ねた。「一言で国を滅ぼすことはあるだろうか。」孔子は答えた。「言葉だけで必ずそうなるとは言えません。ただ、『君主である楽しみはほかにないが、自分の言葉に誰も逆らわないことだけは楽しい』という人がいます。その言葉がよく、誰も逆らわないなら、よいことでしょう。けれど、言葉がよくないのに誰も逆らわないなら、一言で国を滅ぼすことに近づくのではないでしょうか。」"
  "translation_status": "draft"
- "id": "rongo-13-016"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "葉公問政。子曰：「近者說，遠者來。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "葉公が政治について尋ねた。孔子は言った。「近くの人が喜び、遠くの人がやって来るようにすることです。」"
  "translation_status": "draft"
- "id": "rongo-13-017"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏爲莒父宰，問政。子曰：「無欲速，無見小利。欲速，則不達；見小利，則大事不成。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "子夏が莒父の長となり、政治について尋ねた。孔子は言った。「早く成果を出そうと焦らず、小さな利益に目を向けないことだ。速さを求めれば、かえって目的に届かない。小さな利益に目を向ければ、大きな仕事は成し遂げられない。」"
  "translation_status": "draft"
- "id": "rongo-13-018"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "葉公語孔子曰：「吾黨有德躬者，其父攘羊，而子證之。」孔子曰：「吾黨之直者異於是，父爲子隱，子爲父隱，直在其中矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "葉公が孔子に言った。「私の郷里に、徳躬という正直な男がいる。父が羊を盗むと、息子である彼がそれを証言した。」孔子は言った。「私の郷里でまっすぐだという人は、それとは違います。父は子のために隠し、子は父のために隠す。その中にこそ、まっすぐな心があります。」"
  "translation_status": "draft"
- "id": "rongo-13-018-tn-001-text"
  "section_id": "rongo-chapter-13"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は人名を『德躬』とする校訂を採る。通行本は『直躬』。親子の情と公的な正しさとの関係をめぐる、原文の主張をそのまま訳した。"
  "translation_status": "draft"
- "id": "rongo-13-018-source-note-001-text"
  "section_id": "rongo-chapter-13"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「直」"
  "source_languages":
  - "zh"
  "source_locations":

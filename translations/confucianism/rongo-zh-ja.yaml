  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-14-037"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「莫我知也夫！」子貢曰：「何爲其莫知子也？」子曰：「不怨天，不尤人，下學而上達，知我者，其天乎！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之三七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%89%E4%B8%83"
  "translation_ja": "孔子が言った。「私を知る人はいないのだな。」子貢が「どうして先生を知る人がいないのでしょう」と言うと、孔子は答えた。「天を恨まず、人を責めず、身近なことから学んで高い道へ通じていく。私を知るのは、きっと天だろう。」"
  "translation_status": "draft"
- "id": "rongo-14-038"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "公伯寮愬子路於季孫，子服景伯以吿，曰：「夫子固有惑志於公伯寮，吾力猶能肆諸市朝。」子曰：「道之將行也與，命也；道之將廢也與，命也。公伯寮其如命何？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之三八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%89%E5%85%AB"
  "translation_ja": "公伯寮が、季孫に子路の悪口を告げた。子服景伯はそれを孔子に知らせ、言った。「季孫様は、公伯寮の言葉に心を惑わされています。私には、まだあの男を処刑して市場にさらすくらいの力はあります。」孔子は言った。「道が行われるのも天命、道が廃れるのも天命だ。公伯寮に天命をどうすることができよう。」"
  "translation_status": "draft"
- "id": "rongo-14-039"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「賢者辟世，其次辟地，其次辟色，其次辟言。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之三九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%89%E4%B9%9D"
  "translation_ja": "孔子が言った。「優れた人は、道のない世を避けて隠れる。その次は、悪い土地を避ける。その次は、冷たい顔つきを避ける。その次は、ひどい言葉を避ける。」"
  "translation_status": "draft"
- "id": "rongo-14-040"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「作者七人矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之四十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%9B%9B%E5%8D%81"
  "translation_ja": "孔子が言った。「そうして立ち去った人は、七人いる。」"
  "translation_status": "draft"
- "id": "rongo-14-040-tn-001-text"
  "section_id": "rongo-chapter-14"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "七人が誰を指すかは定まっていない。前の章に続く言葉として訳した。"
  "translation_status": "draft"
- "id": "rongo-14-041"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路宿於石門。晨門曰：「奚自？」子路曰：「自孔氏。」曰：「是知其不可而爲之者與？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之四一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%9B%9B%E4%B8%80"
  "translation_ja": "子路が石門で一夜を過ごした。朝、門番が「どこから来たのか」と尋ねた。子路が「孔子のもとからだ」と答えると、門番は言った。「できないと分かっていながら、やろうとしているあの人か。」"
  "translation_status": "draft"
- "id": "rongo-14-042"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子擊磬於衞。有荷蕢而過孔氏之門者，曰：「有心哉！擊磬乎！」既而曰：「鄙哉，硜硜乎！莫己知也，斯己而已矣！『深則厲，淺則揭。』」子曰：「果哉！末之難矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之四二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%9B%9B%E4%BA%8C"
  "translation_ja": "孔子が衛で石の楽器を打っていた。かごを背負って門の前を通った人が言った。「思いのこもった音だな、この石を打つ音は。」しばらくして、さらに言った。「狭い考えだ。いつまでも固く鳴らしている。誰も自分を認めないなら、それでやめればよい。『水が深ければ衣のまま渡り、浅ければ裾をからげて渡る』というではないか。」孔子は言った。「思い切りのよい人だ。そのように割り切るだけなら、難しいことはない。」"
  "translation_status": "draft"
- "id": "rongo-14-043"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張曰：「書云：『高宗諒陰，三年不言。』何謂也？」子曰：「何必高宗，古之人皆然。君薨，百官總己以聽於冢宰，三年。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之四三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%9B%9B%E4%B8%89"
  "translation_ja": "子張が尋ねた。「『書経』に、『高宗は喪に服して、三年もの間、言葉を発しなかった』とあります。どういうことでしょう。」孔子は答えた。「高宗に限らず、昔の人はみなそうしていた。君主が亡くなると、役人たちはそれぞれの務めをまとめ、三年の間、宰相の指示を受けたのだ。」"
  "translation_status": "draft"
- "id": "rongo-14-044"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「上好禮，則民易使也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之四四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%9B%9B%E5%9B%9B"
  "translation_ja": "孔子が言った。「上に立つ人が礼を好めば、民は仕事に従いやすくなる。」"
  "translation_status": "draft"
- "id": "rongo-14-045"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路問君子。子曰：「脩己以敬。」曰：「如斯而已乎？」曰：「脩己以安人。」曰：「如斯而已乎？」曰：「脩己以安百姓。脩己以安百姓，堯舜其猶病諸！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之四五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%9B%9B%E4%BA%94"
  "translation_ja": "子路が立派な人について尋ねた。孔子は言った。「敬う心をもって自分を修める人だ。」「それだけでしょうか。」「自分を修めて、人を安らかにする人だ。」「それだけでしょうか。」「自分を修めて、広く民を安らかにする人だ。自分を修めて民を安らかにすることには、堯や舜でさえ、なお足りないと悩んだだろう。」"
  "translation_status": "draft"
- "id": "rongo-14-046"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "原壤夷俟。子曰：「幼而不孫弟，長而無述焉，老而不死，是爲賊。」以杖叩其脛。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之四六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%9B%9B%E5%85%AD"
  "translation_ja": "原壤が両脚を広げて座り、孔子を待っていた。孔子は言った。「子どものときは慎みも敬いもなく、大人になっても語り伝えるほどのことをせず、年を取ってもまだ死なない。これでは人を損なう者だ。」そして、杖でそのすねをたたいた。"
  "translation_status": "draft"
- "id": "rongo-14-047"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "闕黨童子將命。或問之曰：「益者與？」子曰：「吾見其居於位也，見其與先生並行也，非求益者也，欲速成者也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之四七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%9B%9B%E4%B8%83"
  "translation_ja": "闕の村の少年が、来客の取り次ぎをしていた。ある人が「進歩しようとしている子でしょうか」と尋ねると、孔子は言った。「あの子が大人の席に座るのを見たし、年長者と肩を並べて歩くのも見た。着実に進もうとする子ではない。早く一人前に見られたい子なのだ。」"
  "translation_status": "draft"
- "id": "rongo-15-001"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "衞靈公問陳於孔子。孔子對曰：「俎豆之事，則嘗聞之矣；軍旅之事，未之學也。」明日遂行。在陳絕糧。從者病，莫能興。子路慍見曰：「君子亦有窮乎？」子曰：「君子固窮，小人窮斯濫矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%80"
  "translation_ja": "衛の霊公が、孔子に軍の陣形を尋ねた。孔子は答えた。「祭器を扱う礼のことなら、聞いたことがあります。軍隊のことは、まだ学んでおりません。」翌日、孔子はそこを去った。陳にいたときには食糧が尽き、供の者たちは弱り果てて、立ち上がれなくなった。子路は憤った顔で孔子に会い、「立派な人でも、こんな窮地に陥るのでしょうか」と言った。孔子は答えた。「立派な人は、窮しても自分を守る。つまらない人は、窮すると何でもしてしまうのだ。」"
  "translation_status": "draft"
- "id": "rongo-15-002"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「賜也，女以予爲多學而識之者與？」對曰：「然，非與？」曰：「非也，予一以貫之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%8C"
  "translation_ja": "孔子が言った。「賜よ、お前は私を、多く学んで覚えている人だと思っているか。」子貢は答えた。「そうです。違うのでしょうか。」「違う。私は一つのもので、それらを貫いているのだ。」"
  "translation_status": "draft"
- "id": "rongo-15-003"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「由，知德者鮮矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「由よ、徳を本当に分かっている人は少ない。」"
  "translation_status": "draft"
- "id": "rongo-15-004"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「無爲而治者，其舜也與！夫何爲哉？恭己正南面而已矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%9B%9B"
  "translation_ja": "孔子が言った。「自らあれこれ手を出さずに天下を治めたのは、舜だろう。いったい何をしたのか。自分の身を慎み、南を向いて君主の席に正しく座っていただけだ。」"
  "translation_status": "draft"
- "id": "rongo-15-005"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張問行。子曰：「言忠信，行篤敬，雖蠻貊之邦行矣。言不忠信，行不篤敬，雖州里行乎哉？立，則見其參於前也；在輿，則見其倚於衡也。夫然後行。」子張書諸紳。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%94"
  "translation_ja": "子張が、世の中でどうすれば道を行えるか尋ねた。孔子は言った。「言葉が誠実で信頼でき、行いが厚く慎み深ければ、遠い異民族の国でも通じる。言葉が不誠実で、行いに厚みも慎みもなければ、近所の村の中でさえ通じるだろうか。立っているときには、その教えが目の前にあるように見え、車に乗っているときには、その教えが横木に寄りかかっているように見える。そこまで心に留めてこそ、通じるのだ。」子張はその言葉を帯に書きつけた。"
  "translation_status": "draft"
- "id": "rongo-15-006"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「直哉史魚！邦有道，如矢；邦無道，如矢。君子哉蘧伯玉！邦有道，則仕；邦無道，則可卷而懷之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%85%AD"
  "translation_ja": "孔子が言った。「まっすぐな人だ、史魚は。国に道が行われていても矢のようにまっすぐで、行われていなくても矢のようにまっすぐだ。立派な人だ、蘧伯玉は。国に道が行われていれば仕え、行われていなければ、自分の力を巻き収めて胸にしまっておける。」"
  "translation_status": "draft"
- "id": "rongo-15-007"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「可與言，而不與之言，失人；不可與言，而與之言，失言。知者不失人，亦不失言。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%83"
  "translation_ja": "孔子が言った。「話すべき人に話さなければ、その人との機会を失う。話すべきでない人に話せば、言葉を無駄にする。知恵のある人は、人を失わず、言葉も無駄にしない。」"
  "translation_status": "draft"
- "id": "rongo-15-008"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「志士仁人，無求生以害仁，有殺身以成仁。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%85%AB"
  "translation_ja": "孔子が言った。「志を持ち、仁を守る人は、生き延びるために仁を損なうことはしない。身を捨てて仁を成し遂げることはある。」"
  "translation_status": "draft"
- "id": "rongo-15-009"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢問爲仁。子曰：「工欲善其事，必先利其器。居是邦也，事其大夫之賢者，友其士之仁者。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B9%9D"
  "translation_ja": "子貢が仁の行い方を尋ねた。孔子は言った。「職人がよい仕事をしようとするなら、まず道具をよく整える。ある国に住むなら、その国の大夫の中で優れた人に仕え、士の中で仁のある人を友にすることだ。」"
  "translation_status": "draft"
- "id": "rongo-15-010"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "顏淵問爲邦。子曰：「行夏之時，乘殷之輅，服周之冕，樂則韶舞。放鄭聲，遠佞人。鄭聲淫，佞人殆。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%8D%81"
  "translation_ja": "顔淵が国の治め方を尋ねた。孔子は言った。「夏の暦を用い、殷の車に乗り、周の冠をかぶり、音楽には『韶』の舞を用いることだ。鄭の音楽を退け、口先のうまい人を遠ざけよ。鄭の音楽は節度を失わせ、口先のうまい人は危ういからだ。」"
  "translation_status": "draft"
- "id": "rongo-15-011"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「人無遠慮，必有近憂。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子が言った。「遠い先のことを考えない人には、必ず身近な心配事が起こる。」"
  "translation_status": "draft"
- "id": "rongo-15-012"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「已矣乎！吾未見好德如好色者也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "孔子が言った。「もう望めないのだろうか。美しい容姿を好むほどに徳を好む人を、私はまだ見たことがない。」"
  "translation_status": "draft"
- "id": "rongo-15-013"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「臧文仲，其竊位者與！知柳下惠之賢，而不與立也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "孔子が言った。「臧文仲は、地位を盗んでいたようなものではないか。柳下恵の優れたところを知りながら、共に朝廷に立とうとしなかった。」"
  "translation_status": "draft"
- "id": "rongo-15-014"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「躬自厚，而薄責於人，則遠怨矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "孔子が言った。「自分には厳しく求め、人を責めるのは控えめにすれば、恨みを遠ざけられる。」"
  "translation_status": "draft"
- "id": "rongo-15-015"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不曰『如之何，如之何』者，吾末如之何也已矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "孔子が言った。「『どうしたらよいか、どうしたらよいか』と自分で考えない人は、私にもどうしてやることもできない。」"
  "translation_status": "draft"
- "id": "rongo-15-016"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「群居終日，言不及義，好行小慧，難矣哉！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「一日中集まっていても、話は正しさに及ばず、小利口なことばかり好んでする。これでは、どうにも難しい。」"
  "translation_status": "draft"
- "id": "rongo-15-017"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子義以爲質，禮以行之，孫以出之，信以成之。君子哉！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "孔子が言った。「正しさを土台とし、礼にかなう形で行い、控えめに言葉にし、信頼を守って仕上げる。それこそ立派な人だ。」"
  "translation_status": "draft"
- "id": "rongo-15-018"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子病無能焉，不病人之不己知也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "孔子が言った。「立派な人は、自分に力がないことを気にかけ、人が自分を認めないことは気に病まない。」"
  "translation_status": "draft"
- "id": "rongo-15-019"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子疾沒世而名不稱焉。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "孔子が言った。「立派な人は、一生を終えても名を語られないことを悔しく思う。」"
  "translation_status": "draft"
- "id": "rongo-15-020"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子求諸己，小人求諸人。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "孔子が言った。「立派な人は自分に求め、つまらない人は人に求める。」"
  "translation_status": "draft"
- "id": "rongo-15-021"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子矜而不爭，群而不黨。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "孔子が言った。「立派な人は自分を大切に保っても争わず、人々と交わっても派閥を作らない。」"
  "translation_status": "draft"
- "id": "rongo-15-022"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子不以言擧人，不以人廢言。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "孔子が言った。「立派な人は、言葉だけで人を取り立てず、発言した人を理由に、よい言葉まで捨てはしない。」"
  "translation_status": "draft"
- "id": "rongo-15-023"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢問曰：「有一言而可以終身行之者乎？」子曰：「其恕乎！己所不欲，勿施於人。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "子貢が尋ねた。「一生実行し続けられる、一つの言葉がありますか。」孔子は答えた。「思いやりだろう。自分が望まないことを、人にしないことだ。」"
  "translation_status": "draft"
- "id": "rongo-15-024"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「吾之於人也，誰毀誰譽？如有所譽者，其有所試矣。斯民也，三代之所以直道而行也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "孔子が言った。「私は人に対して、誰をむやみにけなし、誰をむやみに褒めているだろう。褒めることがあるなら、その行いを確かめている。今の民も、夏・殷・周の三代に、まっすぐな道によって治められてきた民と変わらないのだ。」"
  "translation_status": "draft"
- "id": "rongo-15-025"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「吾猶及史之闕文也，有馬者，借人乘之。今亡矣夫！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": "孔子が言った。「私はまだ、記録官が不明な箇所を空白のまま残す時代を知っている。馬を持つ者が、人に貸して乗ってもらうこともあった。今では、それもなくなったのだな。」"
  "translation_status": "draft"
- "id": "rongo-15-025-tn-001-text"
  "section_id": "rongo-chapter-15"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "記録官の話と馬の話のつながりには異説がある。いずれも、自分に分からないことやできないことを無理に取り繕わず、人に委ねる態度の例とする解釈があるが、本文の欠損を疑う説もある。"
  "translation_status": "draft"
- "id": "rongo-15-026"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「巧言亂德，小不忍，則亂大謀。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之二六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%8C%E5%85%AD"
  "translation_ja": "孔子が言った。「巧みすぎる言葉は徳を乱す。小さなことを我慢できなければ、大きな計画を乱す。」"
  "translation_status": "draft"
- "id": "rongo-15-027"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「眾惡之，必察焉；眾好之，必察焉。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之二七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%8C%E4%B8%83"
  "translation_ja": "孔子が言った。「大勢が嫌う人でも、必ずよく調べよ。大勢が好む人でも、必ずよく調べよ。」"
  "translation_status": "draft"
- "id": "rongo-15-028"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「人能弘道，非道弘人。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之二八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%8C%E5%85%AB"
  "translation_ja": "孔子が言った。「人が道を広げるのであって、道がひとりでに人を大きくするのではない。」"
  "translation_status": "draft"
- "id": "rongo-15-029"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「過而不改，是謂過矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之二九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%BA%8C%E4%B9%9D"
  "translation_ja": "孔子が言った。「過ちを犯しても改めない。それこそ過ちというのだ。」"
  "translation_status": "draft"
- "id": "rongo-15-030"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「吾嘗終日不食，終夜不寑，以思；無益，不如學也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之三十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%89%E5%8D%81"
  "translation_ja": "孔子が言った。「以前、一日中食べず、一晩中眠らずに考えたことがある。だが、役には立たなかった。学ぶことには及ばない。」"
  "translation_status": "draft"
- "id": "rongo-15-031"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子謀道不謀食。耕也，餒在其中矣；學也，祿在其中矣。君子憂道不憂貧。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之三一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%89%E4%B8%80"
  "translation_ja": "孔子が言った。「立派な人は道を求め、食べることだけを求めない。耕していても、飢えることはある。学んでいれば、その中から俸禄につながることもある。立派な人が案じるのは道のことであり、貧しさのことではない。」"
  "translation_status": "draft"
- "id": "rongo-15-032"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「知及之，仁不能守之，雖得之，必失之。知及之，仁能守之。不莊以蒞之，則民不敬。知及之，仁能守之，莊以蒞之。動之不以禮，未善也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之三二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%89%E4%BA%8C"
  "translation_ja": "孔子が言った。「知恵で地位に届いても、仁によって守れなければ、得ても必ず失う。知恵で届き、仁で守れても、厳かな態度で民に臨まなければ、民は敬わない。知恵で届き、仁で守り、厳かに臨んでも、民を動かすときに礼によらなければ、まだ十分によくはない。」"
  "translation_status": "draft"
- "id": "rongo-15-033"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子不可小知，而可大受也。小人不可大受，而可小知也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之三三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%89%E4%B8%89"
  "translation_ja": "孔子が言った。「立派な人は、小さな仕事だけでは測れないが、大きな務めを任せられる。つまらない人には大きな務めを任せられないが、小さな仕事の能力は見て取れる。」"
  "translation_status": "draft"
- "id": "rongo-15-034"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「民之於仁也，甚於水火。水火，吾見蹈而死者矣，未見蹈仁而死者也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之三四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%89%E5%9B%9B"
  "translation_ja": "孔子が言った。「民にとって仁は、水や火よりも必要だ。水や火に踏み込んで死んだ人は見たが、仁の道を歩んで死んだ人は、まだ見たことがない。」"
  "translation_status": "draft"
- "id": "rongo-15-035"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「當仁，不讓於師。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之三五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%89%E4%BA%94"
  "translation_ja": "孔子が言った。「仁を行うべきときには、師にさえ先を譲らない。」"
  "translation_status": "draft"
- "id": "rongo-15-036"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子貞而不諒。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之三六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%89%E5%85%AD"
  "translation_ja": "孔子が言った。「立派な人は正しい筋を守るが、小さな約束にかたくなにはこだわらない。」"
  "translation_status": "draft"
- "id": "rongo-15-037"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「事君，敬其事而後其食。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之三七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%89%E4%B8%83"
  "translation_ja": "孔子が言った。「君主に仕えるときは、務めに真剣に取り組み、俸禄のことはあとにする。」"
  "translation_status": "draft"
- "id": "rongo-15-038"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「有教無類。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之三八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%89%E5%85%AB"
  "translation_ja": "孔子が言った。「教えるときは、人を分け隔てしない。」"
  "translation_status": "draft"
- "id": "rongo-15-039"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「道不同，不相爲謀。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之三九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E4%B8%89%E4%B9%9D"
  "translation_ja": "孔子が言った。「目指す道が違えば、共に計画を立てることはできない。」"
  "translation_status": "draft"
- "id": "rongo-15-040"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「辭，達而已矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之四十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%9B%9B%E5%8D%81"
  "translation_ja": "孔子が言った。「言葉は、意味が伝わればそれでよい。」"
  "translation_status": "draft"
- "id": "rongo-15-041"
  "section_id": "rongo-chapter-15"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "師冕見。及階，子曰：「階也。」及席，子曰：「席也。」皆坐，子吿之曰：「某在斯，某在斯。」師冕出，子張問曰：「與師言之道與？」子曰：「然，固相師之道也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-15"
    "precision": "block"
    "anchor": "十五之四一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%A1%9E%E9%9D%88%E5%85%AC%E7%AC%AC%E5%8D%81%E4%BA%94&oldid=2058122#%E5%8D%81%E4%BA%94%E4%B9%8B%E5%9B%9B%E4%B8%80"
  "translation_ja": "楽師の冕が訪ねてきた。階段に近づくと、孔子は「階段です」と言い、敷物に近づくと「敷物です」と言った。皆が座ると、「ここには誰それ、ここには誰それがいます」と教えた。楽師が退出したあと、子張が「楽師と話すときの作法でしょうか」と尋ねると、孔子は言った。「そうだ。目の見えない楽師を助けるときは、そうするものだ。」"
  "translation_status": "draft"
- "id": "rongo-16-001"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季氏將伐顓臾。冉有季路見於孔子曰：「季氏將有事於顓臾。」孔子曰：「求！無乃爾是過與？夫顓臾，昔者先王以爲東蒙主，且在邦域之中矣，是社稷之臣也。何以伐爲？」冉有曰：「夫子欲之，吾二臣者，皆不欲也。」孔子曰：「求！周任有言曰：『陳力就列，不能者止。』危而不持，顚而不扶，則將焉用彼相矣？且爾言過矣！虎兕出於柙，龜玉毀於櫝中，是誰之過與？」冉有曰：「今夫顓臾，固而近於費；今不取，後世必爲子孫憂。」孔子曰：「求！君子疾夫舍曰欲之，而必爲之辭。丘也，聞有國有家者，不患寡而患不均，不患貧而患不安。蓋均無貧，和無寡，安無傾。夫如是，故遠人不服，則修文德以來之。既來之，則安之。今由與求也，相夫子，遠人不服而不能來也；邦分崩離析而不能守也，而謀動干戈於邦內。吾恐季孫之憂，不在顓臾，而在蕭牆之內也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E4%B8%80"
  "translation_ja": "季氏が顓臾を攻めようとしていた。冉有と季路が孔子に会い、「季氏が顓臾に軍を向けようとしています」と言った。孔子は言った。「求よ、お前の過ちではないのか。顓臾は、昔の王が東蒙山の祭りを預けた国だ。しかも、魯の領域の中にあり、魯の国そのものに仕える臣でもある。どうして攻めるのか。」冉有は答えた。「主君がお望みなのです。私たち二人は、どちらも望んでいません。」孔子は言った。「求よ、周任の言葉に、『力を尽くしてその地位に就き、できなければ退く』とある。危ういときに支えず、倒れそうなときに助けないなら、その補佐役が何の役に立つのか。それに、お前の言い方は間違っている。虎や犀が檻から逃げ出し、亀甲や玉が箱の中で壊れたなら、それは誰の過ちなのか。」冉有は言った。「今、顓臾は守りが固く、費の邑の近くにあります。今取らなければ、のちに子孫の心配の種となります。」孔子は言った。「求よ、立派な人は、欲しいと言わずに、わざわざ言い訳を作ることを嫌う。私は、国や家を治める者は、少ないことよりも分配が公平でないことを心配し、貧しいことよりも安定しないことを心配すると聞いている。公平なら貧しさはなく、調和すれば人が少なくても困らず、安定すれば国は傾かない。だから遠くの人が従わなければ、文化と徳を磨いて来てもらい、来たら安心して暮らせるようにする。今、由と求は主君を補佐しながら、遠くの人が従わないのに招くこともできず、国が分裂し崩れかけても守れず、そのうえ国の中で武器を動かそうと考えている。私には、季孫の心配の種は顓臾ではなく、自分の屋敷の塀の内側にあると思える。」"
  "translation_status": "draft"
- "id": "rongo-16-002"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子曰：「天下有道，則禮樂征伐自天子出；天下無道，則禮樂征伐自諸侯出。自諸侯出，蓋十世希不失矣；自大夫出，五世希不失矣；陪臣執國命，三世希不失矣。天下有道，則政不在大夫。天下有道，則庶人不議。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E4%BA%8C"
  "translation_ja": "孔子が言った。「天下に道が行われていれば、礼や音楽、征伐の決定は天子から出る。道が行われていなければ、諸侯から出る。諸侯がそれを決めるようになれば、十代のうちに権力を失わない例は少ない。大夫が決めるようになれば、五代を越える例は少ない。家臣が国の命運を握れば、三代を越える例は少ない。天下に道が行われていれば、政治は大夫の手にはない。道が行われていれば、民は政治をあれこれ論じない。」"
  "translation_status": "draft"
- "id": "rongo-16-003"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子曰：「祿之去公室，五世矣。政逮於大夫，四世矣。故夫三桓之子孫，微矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「俸禄を与える権限が公室から離れて、五代になる。政治が大夫の手に移って、四代になる。だから三桓の子孫たちも、衰えてきているのだ。」"
  "translation_status": "draft"
- "id": "rongo-16-004"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子曰：「益者三友，損者三友：友直，友諒，友多聞，益矣；友便辟，友善柔，友便佞，損矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E5%9B%9B"
  "translation_ja": "孔子が言った。「自分のためになる友が三種類あり、損なう友が三種類ある。まっすぐな人、誠実な人、多くのことを知る人を友とすれば、ためになる。うまく取り入る人、表面だけ柔らかな人、口先の巧みな人を友とすれば、損なわれる。」"
  "translation_status": "draft"
- "id": "rongo-16-005"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子曰：「益者三樂，損者三樂：樂節禮樂，樂道人之善，樂多賢友，益矣；樂驕樂，樂佚遊，樂宴樂，損矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E4%BA%94"
  "translation_ja": "孔子が言った。「自分のためになる楽しみが三種類あり、損なう楽しみが三種類ある。礼や音楽によって節度を整えること、人のよいところを語ること、優れた友を多く持つことを楽しめば、ためになる。おごった快楽、怠けた遊び、宴会の楽しみにふければ、損なわれる。」"
  "translation_status": "draft"
- "id": "rongo-16-006"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子曰：「侍於君子有三愆：言未及之而言，謂之躁；言及之而不言，謂之隱；未見顏色而言，謂之瞽。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E5%85%AD"
  "translation_ja": "孔子が言った。「立派な人のそばにいるとき、三つの過ちがある。まだ話すべきときでないのに話すのは、せっかちだ。話すべきときなのに話さないのは、隠しているということだ。相手の顔つきも見ずに話すのは、目が見えていないのと同じだ。」"
  "translation_status": "draft"
- "id": "rongo-16-007"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子曰：「君子有三戒：少之時，血氣未定，戒之在色；及其壯也，血氣方剛，戒之在鬭；及其老也，血氣既衰，戒之在得。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E4%B8%83"
  "translation_ja": "孔子が言った。「立派な人が戒めることは三つある。若く、心身の勢いがまだ定まらないときは、色欲を戒める。壮年となり、心身の勢いが強くなったときは、争いを戒める。年老いて勢いが衰えたときは、物を欲しがることを戒める。」"
  "translation_status": "draft"
- "id": "rongo-16-008"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子曰：「君子有三畏：畏天命，畏大人，畏聖人之言。小人不知天命而不畏也，狎大人，侮聖人之言。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E5%85%AB"
  "translation_ja": "孔子が言った。「立派な人がおそれ敬うものは三つある。天命、地位や徳のある人、聖人の言葉だ。つまらない人は天命を知らないのでおそれず、地位や徳のある人に馴れ馴れしくし、聖人の言葉を侮る。」"
  "translation_status": "draft"
- "id": "rongo-16-009"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子曰：「生而知之者，上也；學而知之者，次也；困而學之，又其次也。困而不學，民斯爲下矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子が言った。「生まれながらに知る人が、最も上だ。学んで知る人が、その次だ。行き詰まってから学ぶ人が、さらにその次だ。行き詰まっても学ばない人は、最も下になる。」"
  "translation_status": "draft"
- "id": "rongo-16-010"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子曰：「君子有九思：視思明，聽思聰，色思溫，貌思恭，言思忠，事思敬，疑思問，忿思難，見得思義。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E5%8D%81"
  "translation_ja": "孔子が言った。「立派な人には、九つの心がけがある。見るときは明らかに見ようとし、聞くときははっきり聞こうとする。顔つきは温かく、身のこなしは慎み深くあろうとする。言葉には真心を、仕事には真剣さを求める。疑いがあれば尋ねることを考え、怒ったときは、その先の困難を考える。何かを得られそうなときは、それが正しいかを考える。」"
  "translation_status": "draft"
- "id": "rongo-16-011"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子曰：「『見善如不及，見不善如探湯。』吾見其人矣，吾聞其語矣。『隱居以求其志，行義以達其道。』吾聞其語矣，未見其人也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子が言った。「『善を見れば、まだ追いつけないかのように求め、悪を見れば、熱湯へ手を入れるように避ける。』私はそういう人を見たことがあり、その言葉も聞いたことがある。『世を離れて自分の志を求め、正しさを行って自分の道を通す。』その言葉は聞いたが、そういう人にはまだ会っていない。」"
  "translation_status": "draft"

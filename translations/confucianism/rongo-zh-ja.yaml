- "id": "rongo-16-012"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "（『誠不以富，亦祇以異。』）齊景公有馬千駟，死之日，民無德而稱焉。伯夷叔齊餓於首陽之下，民到于今稱之。其斯之謂與？"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": |-
    「本当に富によるのではなく、ただ、他と異なるからなのだ。」
    斉の景公は四千頭もの馬を持っていたが、死んだ日に、民にはたたえるべき徳が思い当たらなかった。伯夷と叔斉は首陽山のふもとで飢えたが、民は今も二人をたたえている。このことを言っているのだろうか。
  "translation_status": "draft"
- "id": "rongo-16-012-tn-001-text"
  "section_id": "rongo-chapter-16"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "冒頭の詩句は底本で丸括弧に入っており、顔淵篇第十章にもある。本文の位置や解釈に異説があるため、どちらからも削らずに残した。"
  "translation_status": "draft"
- "id": "rongo-16-013"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "陳亢問於伯魚曰：「子亦有異聞乎？」對曰：「未也。嘗獨立，鯉趨而過庭。曰：『學《詩》乎？』對曰：『未也。』『不學《詩》，無以言。』鯉退而學《詩》。他日，又獨立，鯉趨而過庭。曰：『學禮乎？』對曰：『未也。』『不學禮，無以立！』鯉退而學禮。聞斯二者。」陳亢退而喜曰：「問一得三：聞《詩》，聞禮，又聞君子之遠其子也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "陳亢が伯魚に尋ねた。「あなたは特別な教えを聞いたことがありますか。」伯魚は答えた。「ありません。以前、父が一人で立っているとき、私が庭を小走りに通ると、『詩を学んだか』と聞かれました。『まだです』と答えると、『詩を学ばなければ、言葉を交わすことができない』と言われました。それで私は退いて、詩を学びました。別の日に、また父が一人で立っているところを小走りに通ると、『礼を学んだか』と聞かれました。『まだです』と答えると、『礼を学ばなければ、自分を立てることができない』と言われました。それで退いて、礼を学びました。聞いたのは、この二つです。」陳亢は退出して喜び、言った。「一つ尋ねて、三つ分かった。詩のこと、礼のこと、そして立派な人は自分の子とも適度な距離を置くということだ。」"
  "translation_status": "draft"
- "id": "rongo-16-014"
  "section_id": "rongo-chapter-16"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "邦君之妻，君稱之曰「夫人」，夫人自稱曰「小童」；邦人稱之曰「君夫人」，稱諸異邦曰「寡小君」；異邦人稱之，亦曰「君夫人」。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-16"
    "precision": "block"
    "anchor": "十六之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%A3%E6%B0%8F%E7%AC%AC%E5%8D%81%E5%85%AD&oldid=11118099#%E5%8D%81%E5%85%AD%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "国の君主の妻を、君主は「夫人」と呼び、夫人自身は「小童」と名乗る。国の人は「君夫人」と呼び、他国の人に対して話すときは「寡小君」と呼ぶ。他国の人もまた、「君夫人」と呼ぶ。"
  "translation_status": "draft"
- "id": "rongo-16-014-tn-001-text"
  "section_id": "rongo-chapter-16"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "小童は自分を低くする呼び方、寡小君は自国の君主の妻を控えめに呼ぶ表現。ここでは当時の呼称を残した。"
  "translation_status": "draft"
- "id": "rongo-17-001"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "陽貨欲見孔子，孔子不見，歸孔子豚。孔子時其亡也，而往拜之，遇諸塗。謂孔子曰：「來，予與爾言。」曰：「懷其寶而迷其邦，可謂仁乎？」曰：「不可。」「好從事而亟失時，可謂知乎？」曰：「不可。」「日月逝矣，歲不我與。」孔子曰：「諾，吾將仕矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%B8%80"
  "translation_ja": "陽貨は孔子に会いたがったが、孔子は会わなかった。そこで陽貨は孔子に子豚を贈った。孔子は陽貨が留守のときを見計らい、礼を述べに行ったが、道で出会ってしまった。陽貨は言った。「こちらへ来なさい。話がある。自分の宝のような才能を抱えたまま、国を迷わせておくのは、仁と言えるか。」「言えません。」「政治に携わりたいと思いながら、たびたび機会を逃すのは、知恵があると言えるか。」「言えません。」「月日は過ぎていく。年齢は私たちを待ってくれないぞ。」孔子は言った。「分かりました。私も仕えるつもりです。」"
  "translation_status": "draft"
- "id": "rongo-17-002"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「性相近也，習相遠也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%BA%8C"
  "translation_ja": "孔子が言った。「生まれ持った性質は互いに近いが、身につける習慣によって遠く隔たっていく。」"
  "translation_status": "draft"
- "id": "rongo-17-003"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「唯上知與下愚不移也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「最高の知恵の持ち主と、最も愚かな者だけは、変わらない。」"
  "translation_status": "draft"
- "id": "rongo-17-004"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子之武城，聞弦歌之聲，夫子莞爾而笑，曰：「割雞焉用牛刀。」子游對曰：「昔者，偃也聞諸夫子曰：『君子學道則愛人，小人學道則易使也。』」子曰：「二三子！偃之言是也，前言戲之耳！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%9B%9B"
  "translation_ja": "孔子が武城へ行くと、弦楽器に合わせた歌声が聞こえた。孔子はにっこり笑い、「鶏を切るのに、どうして牛を切る刀を使うのか」と言った。子游は答えた。「以前、先生から『上に立つ人が道を学べば人を愛し、民が道を学べば仕事に従いやすくなる』と伺いました。」孔子は言った。「皆さん、偃の言うことが正しい。さっきのは、からかっただけだ。」"
  "translation_status": "draft"
- "id": "rongo-17-005"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "公山弗擾以費畔，召，子欲往。子路不說，曰：「末之也已，何必公山氏之之也。」子曰：「夫召我者，而豈徒哉？如有用我者，吾其爲東周乎！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%BA%94"
  "translation_ja": "公山弗擾が費の邑で反乱を起こし、孔子を招いた。孔子が行こうとすると、子路は不満を示して言った。「行くところがなければ、行かなくてもよいではありませんか。なぜ、わざわざ公山氏のところへ行くのですか。」孔子は言った。「私を招く人に、何の考えもないはずがあろうか。私を用いる人がいるなら、私は東の地で周の道をよみがえらせられるかもしれない。」"
  "translation_status": "draft"
- "id": "rongo-17-006"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張問「仁」於孔子。孔子曰：「能行五者於天下，爲仁矣。」「請問之？」曰：「恭、寬、信、敏、惠。恭則不侮，寬則得眾，信則人任焉，敏則有功，惠則足以使人。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%85%AD"
  "translation_ja": "子張が孔子に仁について尋ねた。孔子は言った。「五つのことを、どこでも行えるなら、仁だ。」「その五つを教えてください。」「慎み深さ、寛大さ、信頼、きびきび働くこと、人に恵みを与えることだ。慎み深ければ侮られず、寛大なら人々の心を得られ、信頼があれば人に任せてもらえ、きびきび働けば成果が上がり、恵みを与えれば人に働いてもらえる。」"
  "translation_status": "draft"
- "id": "rongo-17-007"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "佛肸召，子欲往。子路曰：「昔者由也聞諸夫子曰：『親於其身爲不善者，君子不入也。』佛肸以中牟畔，子之往也，如之何？」子曰：「然，有是言也。不曰堅乎？磨而不磷。不曰白乎？涅而不緇。吾豈匏瓜也哉？焉能繫而不食！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%B8%83"
  "translation_ja": "仏肸が招くと、孔子は行こうとした。子路は言った。「以前、先生から、『自分の身で悪いことをする人のところへ、立派な人は入らない』と伺いました。仏肸は中牟で反乱を起こしています。そこへ行かれるとは、どういうことでしょう。」孔子は答えた。「そうだ。そのように言った。だが、本当に堅いものは、磨いても薄くならないというではないか。本当に白いものは、黒い染料に入れても黒くならないというではないか。私は、ひょうたんだろうか。つるにつながれたまま、誰にも食べられずにいられるものか。」"
  "translation_status": "draft"
- "id": "rongo-17-008"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「由也，女聞『六言六蔽』矣乎？」對曰：「未也。」「居！吾語女。好仁不好學，其蔽也愚；好知不好學，其蔽也蕩；好信不好學，其蔽也賊；好直不好學，其蔽也絞；好勇不好學，其蔽也亂；好剛不好學，其蔽也狂。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%85%AB"
  "translation_ja": "孔子が言った。「由よ、六つのよい性質と、それぞれの落とし穴について聞いたか。」子路は「まだです」と答えた。「座りなさい。話そう。仁を好んでも学ばなければ、愚かさに陥る。知恵を好んでも学ばなければ、とりとめがなくなる。信頼を守ることを好んでも学ばなければ、人や自分を損なう。率直さを好んでも学ばなければ、きつく人を傷つける。勇気を好んでも学ばなければ、乱暴になる。強さを好んでも学ばなければ、向こう見ずになる。」"
  "translation_status": "draft"
- "id": "rongo-17-009"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「小子！何莫學夫《詩》？《詩》可以興，可以觀，可以群，可以怨；邇之事父，遠之事君；多識於鳥獸草木之名。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子が言った。「皆さん、どうして『詩経』を学ばないのか。詩は心を奮い立たせ、世のありさまを見せ、人と交わる力を育て、憤りを表すこともできる。身近には父に仕え、遠くには君主に仕える役に立つ。鳥や獣、草や木の名前も、多く覚えられる。」"
  "translation_status": "draft"
- "id": "rongo-17-010"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂伯魚曰：「女爲周南召南矣乎？人而不爲周南召南，其猶正牆面而立也與！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%8D%81"
  "translation_ja": "孔子は伯魚に言った。「お前は『周南』『召南』を学んだか。これを学ばない人は、目の前の壁に向かって立っているようなものだ。」"
  "translation_status": "draft"
- "id": "rongo-17-011"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「禮云禮云，玉帛云乎哉？樂云樂云！鐘鼓云乎哉？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子が言った。「礼だ、礼だと言うが、玉や絹の贈り物のことだけなのか。音楽だ、音楽だと言うが、鐘や太鼓のことだけなのか。」"
  "translation_status": "draft"
- "id": "rongo-17-012"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「色厲而內荏，譬諸小人，其猶穿窬之盜也與？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "孔子が言った。「顔つきは厳しくても、内心は臆病だ。卑しい者にたとえるなら、壁に穴を開けたり、塀を越えたりして入る盗人のようなものではないか。」"
  "translation_status": "draft"
- "id": "rongo-17-013"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「鄉原，德之賊也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "孔子が言った。「村で誰にでも善人ぶって見せる人は、徳を損なう者だ。」"
  "translation_status": "draft"
- "id": "rongo-17-014"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「道聽而塗說，德之棄也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "孔子が言った。「道で聞いたことを、そのまま道で言いふらすのは、徳を捨てることだ。」"
  "translation_status": "draft"
- "id": "rongo-17-015"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「鄙夫！可與事君也與哉？其未得之也，患得之；既得之，患失之。苟患失之，無所不至矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "孔子が言った。「卑しい人と、一緒に君主へ仕えることができようか。地位を得るまでは、得られないことを心配し、得てしまえば、失うことを心配する。失うことばかり心配すれば、何をするか分からない。」"
  "translation_status": "draft"
- "id": "rongo-17-016"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「古者民有三疾，今也或是之亡也。古之狂也肆，今之狂也蕩；古之矜也廉，今之矜也忿戾；古之愚也直，今之愚也詐而已矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「昔、人には三つの欠点があったが、今ではその昔の姿さえ失われたらしい。昔の気の大きい人は、のびのびとしていた。今の人は、ただでたらめだ。昔の誇り高い人は、筋目を守っていた。今の人は、怒って人に逆らうだけだ。昔の愚かな人は、まっすぐだった。今の人は、だますばかりだ。」"
  "translation_status": "draft"
- "id": "rongo-17-017"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「巧言令色，鮮矣仁。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "孔子が言った。「口先がうまく、顔つきばかり愛想よく取り繕う人に、仁の心はめったにない。」"
  "translation_status": "draft"
- "id": "rongo-17-018"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「惡紫之奪朱也，惡鄭聲之亂雅樂也，惡利口之覆邦家者。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "孔子が言った。「紫が正しい朱の色に取って代わるのを嫌う。鄭の音楽が正統な音楽を乱すのを嫌う。口のうまい者が国や家を覆すのを嫌う。」"
  "translation_status": "draft"
- "id": "rongo-17-019"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「予欲無言！」子貢曰：「子如不言，則小子何述焉？」子曰：「天何言哉？四時行焉，百物生焉，天何言哉？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "孔子が言った。「私はもう、何も言わずにいたい。」子貢は尋ねた。「先生が何もおっしゃらなければ、私たちは何を伝えればよいのでしょう。」孔子は言った。「天は何を語っているか。四季は巡り、さまざまなものが生まれている。天は何を語っているか。」"
  "translation_status": "draft"
- "id": "rongo-17-020"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孺悲欲見孔子，孔子辭以疾。將命者出戶，取瑟而歌，使之聞之。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "孺悲が孔子に会おうとしたが、孔子は病気を理由に断った。取り次ぎの者が戸口を出ると、瑟を取って歌い、孺悲に聞こえるようにした。"
  "translation_status": "draft"
- "id": "rongo-17-021"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "宰我問：「三年之喪，期已久矣！君子三年不爲禮，禮必壞；三年不爲樂，樂必崩。舊穀既沒，新穀既升，鑽燧改火，期可已矣。」子曰：「食夫稻，衣夫錦，於女安乎？」曰：「安！」「女安，則爲之！夫君子之居喪，食旨不甘，聞樂不樂，居處不安，故不爲也。今女安，則爲之！」宰我出。子曰：「予之不仁也！子生三年，然後免於父母之懷。夫三年之喪，天下之通喪也。予也，有三年之愛於其父母乎？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "宰我が尋ねた。「親の喪を三年も続けるのは長すぎます。一年でも十分です。立派な人が三年も礼を行わなければ、礼は必ず廃れます。三年も音楽を行わなければ、音楽は必ず崩れます。古い穀物が尽き、新しい穀物が実り、木をこすって起こす火も季節ごとに変わって一巡するのですから、一年で終えてよいのではありませんか。」孔子は言った。「うまい米を食べ、錦を着て、お前の心は安らかでいられるのか。」「いられます。」「安らかでいられるなら、そうしなさい。立派な人が喪に服すときは、ごちそうを食べてもおいしくなく、音楽を聞いても楽しくなく、暮らしていても落ち着かない。だから、そうしたことをしないのだ。今、お前が安らかでいられるなら、そうしなさい。」宰我が退出すると、孔子は言った。「予には仁がないな。子は生まれて三年たって、ようやく父母の懐を離れる。三年の喪は、天下に共通する喪だ。予も三年の間は、父母に愛されたのではなかったか。」"
  "translation_status": "draft"
- "id": "rongo-17-022"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「飽食終日，無所用心，難矣哉！不有博弈者乎？爲之，猶賢乎已！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "孔子が言った。「一日中腹いっぱい食べて、何にも心を使わない。それでは、どうにもならない。すごろくや碁があるではないか。ああしたものでも、何もしないよりはましだ。」"
  "translation_status": "draft"
- "id": "rongo-17-023"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路曰：「君子尙勇乎？」子曰：「君子義以爲上。君子有勇而無義爲亂，小人有勇而無義爲盜。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "子路が尋ねた。「立派な人は勇気を重んじますか。」孔子は言った。「立派な人は、正しさを第一にする。上に立つ人が勇気ばかりで正しさを欠けば、反乱を起こす。民が勇気ばかりで正しさを欠けば、盗みを働く。」"
  "translation_status": "draft"
- "id": "rongo-17-024"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢曰：「君子亦有惡乎？」子曰：「有惡，惡稱人之惡者，惡居下流而訕上者，惡勇而無禮者，惡果敢而窒者。」曰：「賜也亦有惡乎？」「惡徼以爲知者，惡不孫以爲勇者，惡訐以爲直者。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "子貢が尋ねた。「立派な人にも、嫌うものがありますか。」孔子は答えた。「ある。人の悪いところを言い立てる人、下の立場から上の人をののしる人、勇ましくても礼のない人、決断は早いが道理の通じない人を嫌う。賜にも、嫌うものがあるか。」子貢は答えた。「人の知恵をかすめ取って自分の知恵にする人、へりくだらないことを勇気だと思う人、人の秘密を暴くことを率直さだと思う人を嫌います。」"
  "translation_status": "draft"
- "id": "rongo-17-025"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「唯女子與小人爲難養也！近之則不孫，遠之則怨。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": "孔子が言った。「女たちと小人は、どうにも扱いにくい。近づければ慎みを失い、遠ざければ恨む。」"
  "translation_status": "draft"
- "id": "rongo-17-025-tn-001-text"
  "section_id": "rongo-chapter-17"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『女子』『小人』の範囲には解釈の違いがあるが、ここでは原文の区分を残した。この発言には当時の身分観・性別観が表れている。"
  "translation_status": "draft"
- "id": "rongo-17-026"
  "section_id": "rongo-chapter-17"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「年四十而見惡焉，其終也已。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-17"
    "precision": "block"
    "anchor": "十七之二六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%99%BD%E8%B2%A8%E7%AC%AC%E5%8D%81%E4%B8%83&oldid=1075085#%E5%8D%81%E4%B8%83%E4%B9%8B%E4%BA%8C%E5%85%AD"
  "translation_ja": "孔子が言った。「四十歳になっても人に嫌われるようなら、その人はもう、そのままで終わるだろう。」"
  "translation_status": "draft"
- "id": "rongo-18-001"
  "section_id": "rongo-chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "微子去之，箕子爲之奴，比干諫而死。孔子曰：「殷有三仁焉。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-18"
    "precision": "block"
    "anchor": "十八之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%BE%AE%E5%AD%90%E7%AC%AC%E5%8D%81%E5%85%AB&oldid=1311661#%E5%8D%81%E5%85%AB%E4%B9%8B%E4%B8%80"
  "translation_ja": "微子は国を去り、箕子は奴隷となり、比干は諫めて殺された。孔子は言った。「殷には、三人の仁のある人がいた。」"
  "translation_status": "draft"
- "id": "rongo-18-002"
  "section_id": "rongo-chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "柳下惠爲士師，三黜。人曰：「子未可以去乎？」曰：「直道而事人，焉往而不三黜？枉道而事人，何必去父母之邦？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-18"
    "precision": "block"
    "anchor": "十八之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%BE%AE%E5%AD%90%E7%AC%AC%E5%8D%81%E5%85%AB&oldid=1311661#%E5%8D%81%E5%85%AB%E4%B9%8B%E4%BA%8C"
  "translation_ja": "柳下恵は裁判を預かる役人となったが、三度罷免された。ある人が「もう国を去ってもよいのではありませんか」と言うと、こう答えた。「まっすぐな道で人に仕えるなら、どこへ行っても、三度罷免されないで済むだろうか。道を曲げて人に仕えるなら、わざわざ父母の国を去る必要があるだろうか。」"
  "translation_status": "draft"
- "id": "rongo-18-003"
  "section_id": "rongo-chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "齊景公待孔子，曰：「若季氏則吾不能，以季、孟之閒待之。」曰：「吾老矣，不能用也。」孔子行。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-18"
    "precision": "block"
    "anchor": "十八之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%BE%AE%E5%AD%90%E7%AC%AC%E5%8D%81%E5%85%AB&oldid=1311661#%E5%8D%81%E5%85%AB%E4%B9%8B%E4%B8%89"
  "translation_ja": "斉の景公は孔子を迎えるにあたって言った。「季氏ほどの待遇にはできないが、季氏と孟氏の中間くらいの待遇にしよう。」しかし、やがて「私は年を取った。用いることはできない」と言った。孔子は去った。"
  "translation_status": "draft"
- "id": "rongo-18-004"
  "section_id": "rongo-chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "齊人歸女樂，季桓子受之，三日不朝。孔子行。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-18"
    "precision": "block"
    "anchor": "十八之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%BE%AE%E5%AD%90%E7%AC%AC%E5%8D%81%E5%85%AB&oldid=1311661#%E5%8D%81%E5%85%AB%E4%B9%8B%E5%9B%9B"
  "translation_ja": "斉の人々が女性の楽団を贈り、季桓子はそれを受け取った。そして三日もの間、朝廷に出なかった。孔子は去った。"
  "translation_status": "draft"
- "id": "rongo-18-005"
  "section_id": "rongo-chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "楚狂接輿，歌而過孔子，曰：「鳳兮！鳳兮！何德之衰？往者不可諫，來者猶可追。已而！已而！今之從政者殆而！」孔子下，欲與之言。趨而辟之，不得與之言。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-18"
    "precision": "block"
    "anchor": "十八之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%BE%AE%E5%AD%90%E7%AC%AC%E5%8D%81%E5%85%AB&oldid=1311661#%E5%8D%81%E5%85%AB%E4%B9%8B%E4%BA%94"
  "translation_ja": "楚の、狂人と呼ばれた接輿が、歌いながら孔子の前を通った。「鳳凰よ、鳳凰よ。なんと徳が衰えたことか。過ぎたことは引き戻せないが、これからのことは、まだ間に合う。やめよ、やめよ。今、政治に携わる者は危ういのだ。」孔子は車を下りて話そうとしたが、接輿は急いで避けたので、話すことはできなかった。"
  "translation_status": "draft"
- "id": "rongo-18-006"
  "section_id": "rongo-chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "長沮、桀溺耦而耕。孔子過之，使子路問津焉。長沮曰：「夫執輿者爲誰？」子路曰：「爲孔丘。」曰：「是魯孔丘與？」曰：「是也。」曰：「是知津矣！」問於桀溺，桀溺曰：「子爲誰？」曰：「爲仲由。」曰：「是魯孔丘之徒與？」對曰：「然。」曰：「滔滔者，天下皆是也，而誰以易之？且而與其從辟人之士也，豈若從辟世之士哉？」耰而不輟。子路行以吿，夫子憮然曰：「鳥獸不可與同群！吾非斯人之徒與而誰與？天下有道，丘不與易也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-18"
    "precision": "block"
    "anchor": "十八之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%BE%AE%E5%AD%90%E7%AC%AC%E5%8D%81%E5%85%AB&oldid=1311661#%E5%8D%81%E5%85%AB%E4%B9%8B%E5%85%AD"
  "translation_ja": "長沮と桀溺が、二人で並んで畑を耕していた。孔子はそばを通り、子路に渡し場を尋ねさせた。長沮が「車の手綱を取っているのは誰だ」と尋ねた。子路が「孔丘です」と答えると、「魯の孔丘か」と聞いた。「そうです。」「それなら、渡し場くらい知っているだろう。」子路が桀溺に尋ねると、「お前は誰だ」と聞かれた。「仲由です。」「魯の孔丘の弟子か。」「そうです。」桀溺は言った。「濁流のような乱れは、天下のどこへも広がっている。誰とそれを変えるのか。それに、人を選んで避ける者についていくより、世そのものを避ける者についてきたほうがよいのではないか。」そして土をかぶせる手を止めなかった。子路が戻って伝えると、孔子は悲しげに言った。「鳥や獣と、同じ群れで暮らすわけにはいかない。私が人間たちと共にしないなら、いったい誰と共にするのか。天下に道が行われているなら、私も変えようとはしないのだ。」"
  "translation_status": "draft"
- "id": "rongo-18-007"
  "section_id": "rongo-chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路從而後，遇丈人，以杖荷蓧。子路問曰：「子見夫子乎？」丈人曰：「四體不勤，五穀不分，孰爲夫子？」植其杖而芸。子路拱而立。止子路宿，殺雞爲黍而食之，見其二子焉。明日，子路行以吿。子曰：「隱者也。」使子路反見之。至則行矣。子路曰：「不仕無義。長幼之節，不可廢也；君臣之義，如之何其廢之？欲潔其身，而亂大倫。君子之仕也，行其義也。道之不行，已知之矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-18"
    "precision": "block"
    "anchor": "十八之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%BE%AE%E5%AD%90%E7%AC%AC%E5%8D%81%E5%85%AB&oldid=1311661#%E5%8D%81%E5%85%AB%E4%B9%8B%E4%B8%83"
  "translation_ja": "子路が一行に遅れて歩いていると、杖に農具をかけて担いだ老人に出会った。子路が「先生を見かけませんでしたか」と尋ねると、老人は言った。「手足を働かせず、穀物の区別もつかない者に、何が先生だ。」そして杖を地面に立て、草を取り始めた。子路は両手を合わせ、慎んで立っていた。老人は子路を泊め、鶏を料理して黍飯を用意し、食べさせた。また、二人の息子にも会わせた。翌日、子路が追いついて話すと、孔子は「隠者だ」と言い、戻って会うように命じた。行ってみると、老人はすでに出かけていた。子路は言った。「世に仕えないのは、義に欠ける。年長者と年少者の礼は捨てられないのに、君主と臣下の義をどうして捨てるのか。自分の身を清くしようとして、人の大切な関係を乱している。立派な人が仕えるのは、なすべき義を行うためだ。道が行われないことは、もう分かっているのだ。」"
  "translation_status": "draft"
- "id": "rongo-18-008"
  "section_id": "rongo-chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "逸民：伯夷、叔齊、虞仲、夷逸、朱張、柳下惠、少連。子曰：「不降其志，不辱其身，伯夷叔齊與！」謂柳下惠、少連：「降志辱身矣。言中倫，行中慮，其斯而已矣。」謂虞仲、夷逸：「隱居放言，身中淸，廢中權。」我則異於是，無可無不可。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-18"
    "precision": "block"
    "anchor": "十八之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%BE%AE%E5%AD%90%E7%AC%AC%E5%8D%81%E5%85%AB&oldid=1311661#%E5%8D%81%E5%85%AB%E4%B9%8B%E5%85%AB"
  "translation_ja": "世から退いた人々には、伯夷、叔斉、虞仲、夷逸、朱張、柳下恵、少連がいた。孔子は言った。「志を曲げず、身を辱めなかったのは、伯夷と叔斉だろう。」柳下恵と少連については、「志を抑え、身を辱めることもあった。だが言葉は道理にかない、行いは思慮にかなっていた。そこが、あの人たちのあり方なのだ」と言った。虞仲と夷逸については、「隠れて暮らし、自由にものを言った。身は清さにかない、世を退くことも時にかなっていた」と言った。そして、「私は、それらの人とは違う。必ずこうしてよい、こうしてはいけないとは決めていない」と言った。"
  "translation_status": "draft"
- "id": "rongo-18-008-tn-001-text"
  "section_id": "rongo-chapter-18"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『放言』は、世俗にとらわれずものを言うと解した。世のことについて語るのをやめる、という別の読みもある。"
  "translation_status": "draft"
- "id": "rongo-18-009"
  "section_id": "rongo-chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大師摯適齊，亞飯干適楚，三飯繚適蔡，四飯缺適秦。鼓方叔入於河，播鼗武入於漢，少師陽、擊磬襄入於海。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-18"
    "precision": "block"
    "anchor": "十八之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%BE%AE%E5%AD%90%E7%AC%AC%E5%8D%81%E5%85%AB&oldid=1311661#%E5%8D%81%E5%85%AB%E4%B9%8B%E4%B9%9D"
  "translation_ja": "楽長の摯は斉へ行き、二度目の食事の楽を担う干は楚へ行き、三度目の繚は蔡へ行き、四度目の缺は秦へ行った。太鼓の方叔は黄河のほとりへ入り、振り鼓の武は漢水のほとりへ入った。副楽長の陽と、石の楽器を打つ襄は、海のほとりへ入った。"
  "translation_status": "draft"
- "id": "rongo-18-010"
  "section_id": "rongo-chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "周公謂魯公曰：「君子不施其親，不使大臣怨乎不以。故舊無大故，則不棄也，無求備於一人。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-18"
    "precision": "block"
    "anchor": "十八之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%BE%AE%E5%AD%90%E7%AC%AC%E5%8D%81%E5%85%AB&oldid=1311661#%E5%8D%81%E5%85%AB%E4%B9%8B%E5%8D%81"
  "translation_ja": "周公は魯公に言った。「上に立つ人は、身内を見捨てず、大臣が用いられないことを恨むようにはしない。昔からの知り合いは、大きな理由がなければ捨てないこと。一人の人に、何もかも備わっていることを求めてはいけない。」"
  "translation_status": "draft"
- "id": "rongo-18-011"
  "section_id": "rongo-chapter-18"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "周有八士：伯達、伯适、仲突、仲忽、叔夜、叔夏、季隨、季騧。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-18"
    "precision": "block"
    "anchor": "十八之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%BE%AE%E5%AD%90%E7%AC%AC%E5%8D%81%E5%85%AB&oldid=1311661#%E5%8D%81%E5%85%AB%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "周には八人の士がいた。伯達、伯适、仲突、仲忽、叔夜、叔夏、季随、季騧である。"
  "translation_status": "draft"
- "id": "rongo-19-001"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張曰：「士見危致命，見得思義，祭思敬，喪思哀，其可已矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%B8%80"
  "translation_ja": "子張が言った。「道を志す者が、危険を見れば命を差し出し、利益を見れば正しさを考え、祭りでは敬う心を考え、葬儀では悲しむ心を考える。それなら、よいと言えるだろう。」"
  "translation_status": "draft"
- "id": "rongo-19-002"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張曰：「執德不弘，信道不篤，焉能爲有？焉能爲亡？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%BA%8C"
  "translation_ja": "子張が言った。「徳を守る心に広がりがなく、道を信じる心も厚くない。それでは、その人がいても何になり、いなくても何が変わるだろう。」"
  "translation_status": "draft"
- "id": "rongo-19-003"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏之門人，問「交」於子張。子張曰：「子夏云何？」對曰：「子夏曰：『可者與之，其不可者拒之。』」子張曰：「異乎吾所聞；『君子尊賢而容眾，嘉善而矜不能。』我之大賢與，於人何所不容？我之不賢與，人將拒我，如之何其拒人也？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%B8%89"
  "translation_ja": "子夏の門人が、子張に人との交わりについて尋ねた。子張は「子夏は何と言ったか」と聞いた。門人は答えた。「『よい人とは交わり、よくない人は拒め』と言いました。」子張は言った。「私が聞いたこととは違う。『立派な人は、優れた人を敬い、多くの人を受け入れ、善いところを喜び、できない人をいたわる』と聞いた。自分が大いに優れているなら、誰を受け入れられないことがあろう。自分が優れていないなら、人のほうから拒まれるだろう。どうして、こちらから人を拒むのか。」"
  "translation_status": "draft"
- "id": "rongo-19-004"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏曰：「雖小道，必有可觀者焉，致遠恐泥，是以君子不爲也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%9B%9B"
  "translation_ja": "子夏が言った。「小さな技術や学びにも、必ず見るべきところはある。だが、遠くまで進もうとすると、それにとらわれる恐れがある。だから立派な人は、それに携わらない。」"
  "translation_status": "draft"
- "id": "rongo-19-005"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏曰：「日知其所亡，月無忘其所能，可謂好學也已矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%BA%94"
  "translation_ja": "子夏が言った。「日ごとに知らなかったことを知り、月ごとに身につけたことを忘れていないなら、学ぶことを好むと言ってよい。」"
  "translation_status": "draft"
- "id": "rongo-19-006"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏曰：「博學而篤志，切問而近思，仁在其中矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%85%AD"
  "translation_ja": "子夏が言った。「広く学び、志をしっかり保ち、切実に問い、身近なことをよく考える。仁は、その中にある。」"
  "translation_status": "draft"
- "id": "rongo-19-007"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏曰：「百工居肆以成其事，君子學以致其道。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%B8%83"
  "translation_ja": "子夏が言った。「さまざまな職人は工房にいて仕事を仕上げ、立派な人は学ぶことによって、その道を極める。」"
  "translation_status": "draft"
- "id": "rongo-19-008"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏曰：「小人之過也必文。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%85%AB"
  "translation_ja": "子夏が言った。「つまらない人は、過ちを犯すと、必ず取り繕う。」"
  "translation_status": "draft"
- "id": "rongo-19-009"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏曰：「君子有三變：望之儼然，卽之也溫，聽其言也厲。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%B9%9D"
  "translation_ja": "子夏が言った。「立派な人には三つの見え方がある。遠くから見ると厳かで、近づくと温かく、言葉を聞くと厳しい。」"
  "translation_status": "draft"
- "id": "rongo-19-010"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏曰：「君子信而後勞其民，未信則以爲厲己也。信而後諫，未信則以爲謗己也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%8D%81"
  "translation_ja": "子夏が言った。「立派な人は、民の信頼を得てから労役を命じる。信頼を得ていなければ、民は自分たちを苦しめようとしていると思う。また、君主の信頼を得てから諫める。信頼を得ていなければ、君主は自分を悪く言っていると思う。」"
  "translation_status": "draft"
- "id": "rongo-19-011"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏曰：「大德不踰閑，小德出入可也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "子夏が言った。「大切な徳の境界を踏み越えないなら、細かな行いには、多少の行き違いがあってもよい。」"
  "translation_status": "draft"
- "id": "rongo-19-012"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子游曰：「子夏之門人小子，當洒掃應對進退則可矣，抑末也；本之則無，如之何？」子夏聞之曰：「噫！言游過矣！君子之道，孰先傳焉？孰後倦焉？譬諸草木，區以別矣。君子之道，焉可誣也？有始有卒者，其惟聖人乎！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "子游が言った。「子夏の門下の若者たちは、掃除や応対、進み退く作法ならよくできる。だが、それは末端のことだ。根本がないのでは、どうだろう。」子夏はこれを聞いて言った。「ああ、言游は間違っている。立派な人の道の中で、何を先に教え、何をあとで軽んじるというのか。草や木と同じように、人にはそれぞれ違いがある。立派な人の道を、どうして実際と違うように教えられよう。初めから終わりまで、すべてを備えているのは、聖人くらいではないか。」"
  "translation_status": "draft"
- "id": "rongo-19-013"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏曰：「仕而優則學，學而優則仕。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "子夏が言った。「役人としての務めを果たし、余力があれば学ぶ。学びを身につけ、余力があれば役人として働く。」"
  "translation_status": "draft"
- "id": "rongo-19-014"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子游曰：「喪致乎哀而止。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "子游が言った。「葬儀は、悲しみを尽くすところでとどめることだ。」"
  "translation_status": "draft"
- "id": "rongo-19-015"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子游曰：「吾友張也，爲難能也，然而未仁。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "子游が言った。「友の張は、人には難しいことをやり遂げる。だが、まだ仁には至っていない。」"
  "translation_status": "draft"
- "id": "rongo-19-016"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子曰：「堂堂乎張也，難與並爲仁矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "曾子が言った。「堂々としているな、張は。だが、共に仁を行うのは難しい。」"
  "translation_status": "draft"
- "id": "rongo-19-017"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子曰：「吾聞諸夫子：『人未有自致者也，必也親喪乎！』」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "曾子が言った。「私は先生から、こう聞いた。『人が自分の心をすべて尽くすことは、なかなかない。あるとすれば、親を失ったときだろう。』」"
  "translation_status": "draft"
- "id": "rongo-19-018"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子曰：「吾聞諸夫子：『孟莊子之孝也，其他可能也，其不改父之臣，與父之政，是難能也。』」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "曾子が言った。「私は先生から、こう聞いた。『孟荘子の親孝行は、ほかの点ならまねができる。だが、父に仕えた臣下も、父の政治のやり方も変えなかったことは、なかなかできない。』」"
  "translation_status": "draft"
- "id": "rongo-19-019"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孟氏使陽膚爲士師，問於曾子。曾子曰：「上失其道，民散久矣！如得其情，則哀矜而勿喜。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "孟氏が陽膚を裁判を預かる役人にした。陽膚が曾子に教えを求めると、曾子は言った。「上の者が道を失い、民の心が離れて久しい。事件の事情が分かっても、哀れみ、いたわることだ。手柄を喜んではいけない。」"
  "translation_status": "draft"
- "id": "rongo-19-020"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢曰：「紂之不善，不如是之甚也。是以君子惡居下流，天下之惡皆歸焉。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "子貢が言った。「紂の悪事は、語られているほどひどかったわけではないだろう。だから立派な人は、悪い評判の集まる低い場所にいることを嫌う。天下の悪いことが、みなその人のせいにされてしまうからだ。」"
  "translation_status": "draft"
- "id": "rongo-19-021"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢曰：「君子之過也，如日月之食焉。過也，人皆見之；更也，人皆仰之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "子貢が言った。「立派な人の過ちは、日食や月食のようなものだ。過ちを犯すと、誰の目にも見える。それを改めると、誰もが仰ぎ見る。」"
  "translation_status": "draft"
- "id": "rongo-19-022"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "衞公孫朝問於子貢曰：「仲尼焉學？」子貢曰：「文、武之道，未墜於地，在人。賢者識其大者，不賢者識其小者，莫不有文、武之道焉。夫子焉不學？而亦何常師之有？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "衛の公孫朝が子貢に尋ねた。「仲尼は、どこで学んだのですか。」子貢は答えた。「文王と武王の道は失われず、人々の中にあります。優れた人はその大きなところを覚え、そうでない人も小さなところを覚えています。どの人にも、文王と武王の道は残っています。先生が学べない場所があるでしょうか。決まった師がいる必要もないのです。」"
  "translation_status": "draft"
- "id": "rongo-19-023"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "叔孫武叔語大夫於朝，曰：「子貢賢於仲尼。」子服景伯以吿子貢。子貢曰：「譬之宮牆，賜之牆也及肩，闚見室家之好；夫子之牆數仞，不得其門而入，不見宗廟之美、百官之富。得其門者或寡矣。夫子之云，不亦宜乎！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "叔孫武叔が朝廷で大夫たちに言った。「子貢は仲尼より優れている。」子服景伯がそれを子貢に伝えると、子貢は言った。「屋敷の塀にたとえるなら、私の塀は肩までしかないので、のぞけば家のよいところが見えます。先生の塀は何倍も高い。門を見つけて入らなければ、宗廟の美しさも、多くの建物の豊かさも見えません。その門を見つける人は、少ないのでしょう。あの方がそうおっしゃるのも、無理はありません。」"
  "translation_status": "draft"
- "id": "rongo-19-024"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "叔孫武叔毀仲尼。子貢曰：「無以爲也，仲尼不可毀也。他人之賢者，丘陵也，猶可踰也；仲尼，日月也，無得而踰焉。人雖欲自絕，其何傷於日月乎？多見其不知量也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "叔孫武叔が仲尼をけなした。子貢は言った。「そんなことをしても無駄です。仲尼は、けなして傷つけられる人ではありません。ほかの優れた人は丘や山のようで、まだ越えられます。仲尼は太陽や月のようで、越えることはできません。人が自分から目を背けても、太陽や月に何の傷がつくでしょう。ただ、自分の力を知らないことが表れるだけです。」"
  "translation_status": "draft"
- "id": "rongo-19-025"
  "section_id": "rongo-chapter-19"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "陳子禽謂子貢曰：「子爲恭也，仲尼豈賢於子乎？」子貢曰：「君子一言以爲知，一言以爲不知，言不可不愼也！夫子之不可及也，猶天之不可階而升也。夫子之得邦家者，所謂『立之斯立，道之斯行，綏之斯來，動之斯和。其生也榮，其死也哀』。如之何其可及也？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-19"
    "precision": "block"
    "anchor": "十九之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E5%BC%B5%E7%AC%AC%E5%8D%81%E4%B9%9D&oldid=1075051#%E5%8D%81%E4%B9%9D%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": "陳子禽が子貢に言った。「あなたは謙遜しているのだ。仲尼が、どうしてあなたより優れているだろう。」子貢は答えた。「立派な人でも、一言で知恵があると見なされ、一言で知恵がないと見なされます。言葉は慎重にしなくてはいけません。先生に追いつけないのは、天へ階段をかけて上れないのと同じです。もし先生が国や家を治めることになれば、『民を立たせれば立ち、導けば進み、安らかにすれば集まり、動かせば和する』という姿になるでしょう。生きている間は栄え、亡くなれば深く悲しまれる。どうして、そのような方に追いつけましょう。」"
  "translation_status": "draft"
- "id": "rongo-20-001"
  "section_id": "rongo-chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "堯曰：「咨！爾舜！天之曆數在爾躬，允執其中！四海困窮，天祿永終。」舜亦以命禹。曰：「予小子履，敢用玄牡，敢昭吿于皇皇后帝：有罪不敢赦。帝臣不蔽，簡在帝心！朕躬有罪，無以萬方；萬方有罪，罪在朕躬。」「周有大賚，善人是富。」「雖有周親，不如仁人；百姓有過，在予一人。」謹權量，審法度，脩廢官，四方之政行焉。興滅國，繼絕世，擧逸民，天下之民歸心焉。所重：民、食、喪、祭。寬則得眾，信則民任焉，敏則有功，公則說。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-20"
    "precision": "block"
    "anchor": "二十之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%A0%AF%E6%9B%B0%E7%AC%AC%E4%BA%8C%E5%8D%81&oldid=2175814#%E4%BA%8C%E5%8D%81%E4%B9%8B%E4%B8%80"
  "translation_ja": |-
    堯が言った。「ああ、舜よ。天の定めた順番は、お前の身に巡ってきた。まことに偏らない道を守れ。世界の人々が困窮するなら、天から受けた地位は永遠に終わるだろう。」舜もまた、同じ言葉で禹に命じた。
    湯は言った。「未熟な私、履が、黒い牡牛を供え、輝かしい天の帝に明らかに申し上げます。罪のある者を、勝手に許しはしません。帝に仕える賢い人々を、埋もれさせはしません。その人々は、帝の御心に明らかです。私自身に罪があれば、諸国の人々のせいにはしないでください。諸国の人々に罪があれば、その罪は私自身にあります。」
    「周では大きく贈り物を与え、善い人を豊かにした。」
    「近しい親族がいても、仁のある人には及ばない。民に過ちがあれば、責任は私一人にある。」
    重さや量を測る器具を慎重に整え、法や制度を確かめ、廃れていた役職を立て直した。それで各地の政治が行われるようになった。滅ぼされた国を復興し、絶えた家系を継がせ、埋もれた人材を取り立てたので、天下の民の心が集まった。重んじたのは、民、食糧、葬儀、祭りだった。寛大なら人々の心を得られ、信頼があれば民が身を任せ、きびきび働けば成果が上がり、公平なら人々は喜ぶ。
  "translation_status": "draft"
- "id": "rongo-20-001-tn-001-text"
  "section_id": "rongo-chapter-20"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "古代の君主の言葉と政治についての記述をつないだ章。『履』は湯の名で、話者の名を訳文で補った。後半の引用は周の政治に関わる。『帝臣不蔽、簡在帝心』は、朱熹『論語集注』の、賢者を隠さず、その人々は帝に知られているとする解釈に沿った。桀の罪を隠せないという意味に読む古注もある。"
  "translation_status": "draft"
- "id": "rongo-20-002"
  "section_id": "rongo-chapter-20"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張問於孔子曰：「何如斯可以從政矣？」子曰：「尊五美，屛四惡，斯可以從政矣。」子張曰：「何謂五美？」子曰：「君子惠而不費，勞而不怨，欲而不貪，泰而不驕，威而不猛。」子張曰：「何謂惠而不費？」子曰：「因民之所利而利之，斯不亦惠而不費乎！擇可勞而勞之，又誰怨？欲仁而得仁，又焉貪？君子無眾寡，無小大，無敢慢，斯不亦泰而不驕乎？君子正其衣冠，尊其瞻視，儼然人望而畏之，斯不亦威而不猛乎！」子張曰：「何謂四惡？」子曰：「不教而殺謂之虐；不戒視成謂之暴；慢令致期謂之賊；猶之與人也，出納之吝，謂之貪。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-20"
    "precision": "block"
    "anchor": "二十之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%A0%AF%E6%9B%B0%E7%AC%AC%E4%BA%8C%E5%8D%81&oldid=2175814#%E4%BA%8C%E5%8D%81%E4%B9%8B%E4%BA%8C"
  "translation_ja": "子張が孔子に尋ねた。「どのようであれば、政治に携われますか。」孔子は言った。「五つのよいあり方を尊び、四つの悪いあり方を退ければ、政治に携われる。」「五つのよいあり方とは何でしょう。」「上に立つ人が、恵みを与えても浪費せず、人を働かせても恨まれず、望みを持ってもむさぼらず、ゆったりしていてもおごらず、威厳があっても威圧しないことだ。」「恵みを与えても浪費しないとは、どういうことですか。」「民にとって利益になることを生かして、その利益を得させる。それなら、恵みを与えても浪費しないではないか。人にさせてよい仕事を選んで働いてもらうなら、誰が恨むだろう。仁を望んで仁を得るなら、何をむさぼるというのか。上に立つ人が、人の数の多い少ない、立場の大きい小さいにかかわらず、誰をも軽んじなければ、ゆったりしていてもおごらないではないか。衣服と冠を整え、まなざしを正し、厳かな姿を人が見て敬うなら、威厳があっても威圧しないではないか。」子張が「四つの悪いあり方とは何ですか」と尋ねると、孔子は言った。「教えずに処刑するのを虐待と言い、前もって注意せずに成果を求めるのを横暴と言い、命令を出すのは遅いのに期限だけ厳しく迫るのを害悪と言い、同じく人に与えるのに、出し入れを惜しんで渋るのを貪欲と言う。」"
  "translation_status": "draft"
- "id": "rongo-20-002-tn-001-text"

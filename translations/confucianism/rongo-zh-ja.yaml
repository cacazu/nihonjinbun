  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-03-023"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子語魯大師樂，曰：「樂其可知也。始作，翕如也。從之，純如也，皦如也，繹如也。以成。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "孔子は魯の楽長に音楽について語った。「音楽の進み方は分かる。奏で始めは、音が一斉に響き合う。そこから広がって、調和し、それぞれの音がはっきりとし、途切れずにつながっていく。そうして一曲が仕上がるのだ。」"
  "translation_status": "draft"
- "id": "rongo-03-023-source-note-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「已」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-03-024"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "儀封人請見，曰：「君子之至於斯也，吾未嘗不得見也。」從者見之。出曰：「二三子，何患於喪乎？天下之無道也久矣，天將以夫子爲木鐸。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "儀の国境の役人が面会を求めて言った。「立派な方がここへおいでになったときには、私はいつもお会いしてきました。」供の者が取り次いだ。役人は面会を終えて出てくると、弟子たちに言った。「皆さん、先生が地位を失われたことを、なぜ心配するのですか。天下に道が行われなくなって、もう久しい。天は先生を、世に教えを告げる木鐸になさろうとしているのです。」"
  "translation_status": "draft"
- "id": "rongo-03-024-tn-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "木鐸は木の舌のついた鈴で、人々に知らせを伝えるときに鳴らした。"
  "translation_status": "draft"
- "id": "rongo-03-024-source-note-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「者」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-03-025"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂韶：「盡美矣，又盡善也。」謂武：「盡美矣，未盡善也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": "孔子は『韶』の音楽について、「この上なく美しく、しかも善を尽くしている」と言った。『武』については、「この上なく美しいが、善を尽くしてはいない」と言った。"
  "translation_status": "draft"
- "id": "rongo-03-025-tn-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『韶』は舜の音楽、『武』は武王の音楽とされる。"
  "translation_status": "draft"
- "id": "rongo-03-026"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「居上不寬，爲禮不敬，臨喪不哀，吾何以觀之哉！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之二六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%BA%8C%E5%85%AD"
  "translation_ja": "孔子が言った。「人の上に立ちながら寛大でなく、礼を行いながら敬う心がなく、葬儀に臨んでも悲しまない。そのような姿の、どこを見ればよいのだろう。」"
  "translation_status": "draft"
- "id": "rongo-04-001"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「里仁爲美。擇不處仁，焉得知？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%B8%80"
  "translation_ja": "孔子が言った。「仁のあるところに身を置くのは、よいことだ。自分で選びながら、仁のあるところに住まないのなら、どうして知恵があると言えるだろう。」"
  "translation_status": "draft"
- "id": "rongo-04-002"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不仁者，不可以久處約，不可以長處樂。仁者安仁，知者利仁。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%BA%8C"
  "translation_ja": "孔子が言った。「仁のない人は、苦しい暮らしに長く耐えることも、楽しい暮らしを長く保つこともできない。仁のある人は仁に安らぎ、知恵のある人は仁のよさを知って、それに従う。」"
  "translation_status": "draft"
- "id": "rongo-04-003"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「惟仁者能好人，能惡人。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「仁のある人こそ、ふさわしく人を好み、ふさわしく人を憎むことができる。」"
  "translation_status": "draft"
- "id": "rongo-04-004"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「苟志於仁矣，無惡也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%9B%9B"
  "translation_ja": "孔子が言った。「本当に仁を志しているなら、悪を行うことはない。」"
  "translation_status": "draft"
- "id": "rongo-04-005"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「富與貴，是人之所欲也，不以其道得之，不處也。貧與賤，是人之所惡也；不以其道得之，不去也。君子去仁，惡乎成名？君子無終食之閒違仁，造次必於是，顚沛必於是。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%BA%94"
  "translation_ja": "孔子が言った。「富と高い地位は、誰もが望むものだ。だが、正しい道によって得たのでなければ、そこにはとどまらない。貧しさと低い身分は、誰もが嫌うものだ。だが、いわれなくそうなったからといって、そこから逃げ出しはしない。立派な人が仁を捨てて、どうしてその名に値するだろう。立派な人は、一食の間さえ仁から離れない。とっさの場合にも仁を守り、倒れそうな苦境でも仁を守る。」"
  "translation_status": "draft"
- "id": "rongo-04-006"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「我未見好仁者，惡不仁者。好仁者，無以尙之；惡不仁者，其爲仁矣。不使不仁者加乎其身。有能一日用其力於仁矣乎？我未見力不足者！蓋有之矣，我未之見也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%85%AD"
  "translation_ja": "孔子が言った。「私はまだ、本当に仁を好む人も、仁に背くことを心から嫌う人も見たことがない。仁を好む人は、仁より上に何も置かない。仁に背くことを嫌う人は、自ら仁を行い、仁に背くものを自分に近づけない。一日でも、その力を仁に尽くす人がいるだろうか。そうして力が足りなくなった人を、私は見たことがない。ひょっとしたらいるのかもしれないが、私はまだ見たことがない。」"
  "translation_status": "draft"
- "id": "rongo-04-007"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「人之過也，各於其黨。觀過，斯知仁矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%B8%83"
  "translation_ja": "孔子が言った。「人の過ちには、それぞれの人柄が表れる。どのような過ちを犯すかを見れば、その人に仁があるかどうかも分かる。」"
  "translation_status": "draft"
- "id": "rongo-04-008"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「朝聞道，夕死可矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%85%AB"
  "translation_ja": "孔子が言った。「朝に道を聞くことができたなら、夕方に死んでもかまわない。」"
  "translation_status": "draft"
- "id": "rongo-04-009"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「士志於道，而恥惡衣惡食者，未足與議也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子が言った。「道を志す者でありながら、粗末な衣服や食事を恥じるようでは、まだ共に道を語るには足りない。」"
  "translation_status": "draft"
- "id": "rongo-04-010"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子之於天下也，無適也，無莫也，義之與比。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%8D%81"
  "translation_ja": "孔子が言った。「立派な人は、天下の物事に対して、必ずこうする、絶対にこうしないと決めつけない。ただ、何が正しいかに従う。」"
  "translation_status": "draft"
- "id": "rongo-04-011"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子懷德，小人懷土；君子懷刑，小人懷惠。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子が言った。「立派な人は徳を心にかけ、つまらない人は住み慣れた土地に執着する。立派な人は法や規律を心にかけ、つまらない人は自分への恩恵を当てにする。」"
  "translation_status": "draft"
- "id": "rongo-04-012"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「放於利而行，多怨。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "孔子が言った。「利益を頼りに行動していると、恨みを買うことが多い。」"
  "translation_status": "draft"
- "id": "rongo-04-013"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「能以禮讓爲國乎，何有？不能以禮讓爲國，如禮何？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "孔子が言った。「礼を守り、譲り合う心で国を治められるなら、何が難しいだろう。それができないなら、礼をいったいどうするつもりなのか。」"
  "translation_status": "draft"
- "id": "rongo-04-014"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不患無位，患所以立。不患莫己知，未爲可知也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "孔子が言った。「地位がないことを気に病まず、その地位に立つだけの力があるかを気にかけよ。人に認められないことを気に病むな。まだ、認められるだけのことをしていないのだ。」"
  "translation_status": "draft"
- "id": "rongo-04-014-tn-001-text"
  "section_id": "rongo-chapter-04"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は末尾を『未爲可知也』とし、定州漢墓の竹簡に基づく校訂を採っている。広く伝わる『求爲可知也』なら、『認められるだけの人になることを求めよ』という意味になる。"
  "translation_status": "draft"
- "id": "rongo-04-014-source-note-001-text"
  "section_id": "rongo-chapter-04"
  "kind": "note_body"
  "origin": "source"
  "source_text": "傳世本『未』作『求』。《憲問》有『不患人之不己知，患其不能也。』，《衞靈公》有『君子病無能焉，不病人之不己知也。』，與本章語意近，《定州漢墓竹簡・論語》正作『不患無位，患所以立。不患莫己知，未爲可知也。』，得傳世本作『求』爲訛誤。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#cite_note-1"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-04-015"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「參乎！吾道一以貫之。」曾子曰：「唯。」子出，門人問曰：「何謂也？」曾子曰：「夫子之道，忠恕而已矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "孔子が言った。「参よ、私の道は、一つのもので貫かれている。」曾子は「はい」と答えた。孔子が出ていくと、門人たちは「どういう意味でしょうか」と尋ねた。曾子は言った。「先生の道は、自分の真心を尽くし、相手の心を思いやること。それだけです。」"
  "translation_status": "draft"
- "id": "rongo-04-016"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子喻於義，小人喻於利。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「立派な人は何が正しいかに通じ、つまらない人は何が得かに通じている。」"
  "translation_status": "draft"
- "id": "rongo-04-017"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「見賢思齊焉，見不賢而內自省也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "孔子が言った。「優れた人を見たら、自分もその人に並ぼうと思え。そうでない人を見たら、内に向かって自分を省みよ。」"
  "translation_status": "draft"
- "id": "rongo-04-018"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「事父母幾諫；見志不從，又敬而不違，勞而不怨。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "孔子が言った。「親に仕えていて、その過ちを諫めるときは穏やかにしなさい。親に聞き入れるつもりがないと分かっても、敬うことをやめず、逆らわず、心を痛めても恨んではいけない。」"
  "translation_status": "draft"
- "id": "rongo-04-019"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「父母在，不遠遊；遊必有方。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "孔子が言った。「親が生きている間は、遠くへ旅をしないこと。旅をするなら、必ず行き先をはっきりさせておくことだ。」"
  "translation_status": "draft"
- "id": "rongo-04-020"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「三年無改於父之道，可謂孝矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "孔子が言った。「三年の間、父のやり方を改めずにいられるなら、親を大切にしていると言える。」"
  "translation_status": "draft"
- "id": "rongo-04-021"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「父母之年，不可不知也。一則以喜，一則以懼。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "孔子が言った。「親の年齢は、知らずにいてはいけない。一方では長生きを喜び、一方では老いを案じるためだ。」"
  "translation_status": "draft"
- "id": "rongo-04-022"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「古者言之不出，恥躬之不逮也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "孔子が言った。「昔の人が軽々しく言葉を口にしなかったのは、自分の行いが言葉に及ばないことを恥じたからだ。」"
  "translation_status": "draft"
- "id": "rongo-04-023"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「以約失之者，鮮矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "孔子が言った。「慎ましくしていて、過ちを犯すことは少ない。」"
  "translation_status": "draft"
- "id": "rongo-04-024"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子欲訥於言而敏於行。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "孔子が言った。「立派な人は、口では控えめで、行動では素早くありたいと願う。」"
  "translation_status": "draft"
- "id": "rongo-04-025"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「德不孤，必有鄰。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": "孔子が言った。「徳のある人は孤立しない。必ず、その人に寄り添う者が現れる。」"
  "translation_status": "draft"
- "id": "rongo-04-026"
  "section_id": "rongo-chapter-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子游曰：「事君數，斯辱矣。朋友數，斯疏矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-04"
    "precision": "block"
    "anchor": "四之二六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%87%8C%E4%BB%81%E7%AC%AC%E5%9B%9B&oldid=2177314#%E5%9B%9B%E4%B9%8B%E4%BA%8C%E5%85%AD"
  "translation_ja": "子游が言った。「君主に仕えて、しつこく諫めれば辱めを受ける。友にしつこく忠告すれば、疎まれるようになる。」"
  "translation_status": "draft"
- "id": "rongo-05-001"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂公冶長，「可妻也；雖在縲絏之中，非其罪也。」以其子妻之。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%B8%80"
  "translation_ja": "孔子は公冶長について、「娘を嫁がせてもよい人だ。獄につながれていたことはあるが、本人に罪があったわけではない」と言い、自分の娘を彼に嫁がせた。"
  "translation_status": "draft"
- "id": "rongo-05-001-source-note-001-text"
  "section_id": "rongo-chapter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「紲」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%B8%80"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-05-002"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂南容，「邦有道，不廢；邦無道，免於刑戮。」以其兄之子妻之。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%8C"
  "translation_ja": "孔子は南容について、「国に道が行われていれば見捨てられることはなく、道が行われていなくても処罰や死刑を免れる人だ」と言い、兄の娘を彼に嫁がせた。"
  "translation_status": "draft"
- "id": "rongo-05-003"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂子賤：「君子哉若人！魯無君子者，斯焉取斯？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子は子賤について言った。「立派な人だ、この人は。魯に立派な人がいなかったら、どうしてこれだけのものを身につけられただろう。」"
  "translation_status": "draft"
- "id": "rongo-05-004"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢問曰：「賜也何如？」子曰：「女器也」。曰：「何器也？」曰：「瑚璉也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%9B%9B"
  "translation_ja": "子貢が尋ねた。「私は、どのような人間でしょう。」孔子は答えた。「お前は器だ。」「どんな器でしょう。」「宗廟に供え物を盛る、玉で飾った貴い器だ。」"
  "translation_status": "draft"
- "id": "rongo-05-005"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "或曰：「雍也，仁而不佞。」子曰：「焉用佞？禦人以口給，屢憎於人。不知其仁；焉用佞？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%94"
  "translation_ja": "ある人が言った。「雍は仁のある人ですが、口がうまくありません。」孔子は言った。「どうして口のうまさが必要なのか。巧みな言葉で人を言い負かせば、たびたび人に憎まれる。彼に仁があるかどうかは分からないが、口のうまさなど、どうして必要だろう。」"
  "translation_status": "draft"
- "id": "rongo-05-006"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子使漆雕開仕。對曰：「吾斯之未能信。」子說。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%85%AD"
  "translation_ja": "孔子は漆雕開に役人になるよう勧めた。漆雕開は「私はまだ、それを引き受けるだけの確信が持てません」と答えた。孔子は喜んだ。"
  "translation_status": "draft"
- "id": "rongo-05-007"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「道不行，乘桴浮於海，從我者，其由與？」子路聞之喜。子曰：「由也，好勇過我，無所取材。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%B8%83"
  "translation_ja": "孔子が言った。「道が行われないなら、いかだに乗って海へ出ようか。ついてくるのは、きっと由だろうな。」子路はそれを聞いて喜んだ。孔子は言った。「由は勇気を好む点では私に勝るが、物事をよく見極めるところが足りない。」"
  "translation_status": "draft"
- "id": "rongo-05-007-tn-001-text"
  "section_id": "rongo-chapter-05"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "末尾の『無所取材』は解釈が分かれる。『材』を判断・裁量の意味に取ったが、いかだの材木を手に入れる場所がないという冗談とする読みもある。"
  "translation_status": "draft"
- "id": "rongo-05-008"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孟武伯問：「子路仁乎？」子曰：「不知也。」又問，子曰：「由也，千乘之國，可使治其賦也；不知其仁也。」「求也何如？」子曰：「求也，千室之邑，百乘之家，可使爲之宰也；不知其仁也。」「赤也何如？」子曰：「赤也，束帶立於朝，可使與賓客言也；不知其仁也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%85%AB"
  "translation_ja": "孟武伯が尋ねた。「子路は仁のある人でしょうか。」孔子は「分かりません」と答えた。重ねて尋ねられると、こう言った。「由なら、戦車を千台出す国の軍事を任せられます。仁があるかどうかは、分かりません。」「求はどうでしょう。」「求なら、千戸の町や、戦車を百台出す家の家政を任せられます。仁があるかどうかは、分かりません。」「赤はどうでしょう。」「赤なら、礼服を整えて朝廷に立ち、賓客との応対を任せられます。仁があるかどうかは、分かりません。」"
  "translation_status": "draft"
- "id": "rongo-05-009"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂子貢曰：「女與回也孰愈？」對曰：「賜也何敢望回！回也聞一以知十，賜也聞一以知二。」子曰：「弗如也。吾與女，弗如也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子は子貢に言った。「お前と回とでは、どちらが上だと思うか。」子貢は答えた。「私がどうして回に肩を並べられましょう。回は一つ聞いて十を知りますが、私は一つ聞いて二を知るだけです。」孔子は言った。「及ばないね。私も、お前が及ばないということは認めよう。」"
  "translation_status": "draft"
- "id": "rongo-05-009-tn-001-text"
  "section_id": "rongo-chapter-05"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『吾與女、弗如也』は、ここでは子貢の自己評価に同意する言葉と取った。『私もお前も、回には及ばない』と読む説もある。"
  "translation_status": "draft"
- "id": "rongo-05-010"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "宰予晝寢。子曰：「朽木不可雕也，糞土之牆，不可杇也；於予與何誅！」子曰：「始吾於人也，聽其言而信其行；今吾於人也，聽其言而觀其行；於予與改是。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%8D%81"
  "translation_ja": "宰予が昼寝をしていた。孔子は言った。「腐った木には彫刻できない。ぼろぼろの土でできた壁には、上塗りができない。予を叱ったところで、どうなるだろう。」さらに言った。「以前、私は人の言葉を聞けば、その行いも信じていた。今は、言葉を聞いたうえで、行いを見るようになった。予のことがあって、その考えを改めたのだ。」"
  "translation_status": "draft"
- "id": "rongo-05-011"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「吾未見剛者。」或對曰：「申棖。」子曰：「棖也慾！焉得剛？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子が言った。「私はまだ、心の強い人を見たことがない。」ある人が「申棖はどうでしょう」と答えると、孔子は言った。「棖には欲が多い。どうして心が強いと言えるだろう。」"
  "translation_status": "draft"
- "id": "rongo-05-012"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢曰：「我不欲人之加諸我也，吾亦欲無加諸人。」子曰：「賜也，非爾所及也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "子貢が言った。「自分が人からされたくないことは、私も人にしないでいたいと思います。」孔子は言った。「賜よ、それはまだ、お前の到達できるところではない。」"
  "translation_status": "draft"
- "id": "rongo-05-013"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢曰：「夫子之文章，可得而聞也；夫子之言性與天道，不可得而聞也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "子貢が言った。「先生の学問や文化についてのお話は、聞くことができる。けれど、人間の生まれ持つ性質や天の道についてのお話は、なかなか聞くことができない。」"
  "translation_status": "draft"
- "id": "rongo-05-014"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路有聞，未之能行，唯恐有聞。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "子路は何かを教わると、それをまだ実行できないうちは、新たなことを教わりはしないかと気にしていた。"
  "translation_status": "draft"
- "id": "rongo-05-015"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢問曰：「孔文子，何以謂之文也？」子曰：「敏而好學，不恥下問，是以謂之文也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "子貢が尋ねた。「孔文子は、どうして『文』というおくり名を与えられたのでしょう。」孔子は言った。「聡明で学ぶことを好み、自分より下の者に尋ねることも恥じなかった。だから『文』と呼ばれたのだ。」"
  "translation_status": "draft"
- "id": "rongo-05-016"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂子產：「有君子之道四焉：其行己也恭，其事上也敬，其養民也惠，其使民也義。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子は子産について言った。「立派な人の道を、四つ備えていた。自分の振る舞いは慎み深く、目上には敬意をもって仕え、民を養うには恵みを与え、民を使うには道理に従った。」"
  "translation_status": "draft"
- "id": "rongo-05-017"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「晏平仲善與人交，久而敬之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "孔子が言った。「晏平仲は、人との付き合いがうまい。長く付き合っても、その人への敬意を失わなかった。」"
  "translation_status": "draft"
- "id": "rongo-05-018"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「臧文仲居蔡，山節藻梲。何如其知也？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "孔子が言った。「臧文仲は占い用の大亀を収める建物を造り、その柱頭に山を刻み、梁の上には水草を描いた。これで知恵があると言えるのだろうか。」"
  "translation_status": "draft"
- "id": "rongo-05-018-tn-001-text"
  "section_id": "rongo-chapter-05"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "山や水草の装飾は、身分にふさわしくない格式のものと解される。『蔡』は占いに使う大亀を指すとされる。"
  "translation_status": "draft"
- "id": "rongo-05-019"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張問曰：「令尹子文，三仕爲令尹，無喜色；三已之，無慍色。舊令尹之政，必以吿新令尹。何如？」子曰：「忠矣。」曰：「仁矣乎？」曰：「未知，焉得仁？」「崔子弒齊君，陳文子有馬十乘，棄而違之，至於他邦，則曰：『猶吾大夫崔子也！』違之，之一邦，則又曰：『猶吾大夫崔子也！』違之。何如？」子曰：「淸矣。」曰：「仁矣乎？」曰：「未知，焉得仁？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "子張が尋ねた。「令尹の子文は、三度宰相になっても喜びを顔に出さず、三度辞めさせられても恨みを顔に出しませんでした。前任としての政務のことは、必ず後任に伝えました。どう評価なさいますか。」孔子は答えた。「忠実だね。」「仁のある人でしょうか。」「それは分からない。どうして、それだけで仁があると言えるだろう。」子張はさらに尋ねた。「崔子が斉の君主を殺したとき、陳文子には四十頭もの馬がありましたが、それを捨てて国を去りました。別の国へ行っても、『ここの大夫も、わが国の崔子と同じだ』と言って去り、さらに別の国へ行っても同じことを言って去りました。どう評価なさいますか。」孔子は答えた。「潔白だね。」「仁のある人でしょうか。」「それは分からない。どうして、それだけで仁があると言えるだろう。」"
  "translation_status": "draft"
- "id": "rongo-05-020"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季文子三思而後行。子聞之曰：「再，斯可矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "季文子は、三度考えてから行動した。孔子はそれを聞いて言った。「二度で十分だろう。」"
  "translation_status": "draft"
- "id": "rongo-05-021"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「甯武子，邦有道則知；邦無道則愚。其知可及也，其愚不可及也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "孔子が言った。「甯武子は、国に道が行われているときには知恵を発揮し、道が行われていないときには愚かな者のように振る舞った。その知恵には追いつけても、その愚かさには追いつけない。」"
  "translation_status": "draft"
- "id": "rongo-05-022"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子在陳，曰：「歸與！歸與！吾黨之小子狂簡，斐然成章，不知所以裁之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "孔子は陳にいたとき、こう言った。「帰ろう。帰ろう。故郷の若者たちは志が大きく、細かなことにはとらわれない。見事な才を発揮しているが、それをどう整えたらよいかを知らない。」"
  "translation_status": "draft"
- "id": "rongo-05-023"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「伯夷、叔齊，不念舊惡，怨是用希。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "孔子が言った。「伯夷と叔斉は、人の昔の悪事をいつまでも覚えてはいなかった。そのため、恨みを受けることが少なかった。」"
  "translation_status": "draft"
- "id": "rongo-05-024"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「孰謂微生高直？或乞醯焉，乞諸其鄰而與之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "孔子が言った。「誰が微生高をまっすぐな人だと言ったのか。ある人が酢を分けてほしいと頼むと、彼は隣の家からもらってきて、その人に与えた。」"
  "translation_status": "draft"
- "id": "rongo-05-025"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「巧言、令色、足恭，左丘明恥之，丘亦恥之。匿怨而友其人，左丘明恥之，丘亦恥之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": "孔子が言った。「言葉を巧みにし、顔つきを取り繕い、うやうやしすぎる態度を取る。左丘明はそれを恥じたし、私も恥じる。恨みを隠したまま、その人と友として付き合う。左丘明はそれを恥じたし、私も恥じる。」"
  "translation_status": "draft"
- "id": "rongo-05-026"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "顏淵、季路侍。子曰：「盍各言爾志？」子路曰：「願車馬衣裘，與朋友共，敝之而無憾。」顏淵曰：「願無伐善，無施勞。」子路曰：「願聞子之志。」子曰：「老者安之，朋友信之，少者懷之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之二六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%8C%E5%85%AD"
  "translation_ja": "顔淵と季路がそばにいた。孔子が「それぞれの志を話してみないか」と言うと、子路は答えた。「車や馬、衣服や毛皮を友と共に使い、傷んでも惜しまないでいたいと思います。」顔淵は答えた。「自分の長所を誇らず、功労をひけらかさないでいたいと思います。」子路が「先生のお志も伺いたいです」と言うと、孔子は答えた。「年老いた人には安心してもらい、友には信頼してもらい、若い人には慕ってもらいたい。」"
  "translation_status": "draft"
- "id": "rongo-05-026-source-note-001-text"
  "section_id": "rongo-chapter-05"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「車馬衣輕裘」。「輕」字係後人所加。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%8C%E5%85%AD"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-05-027"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「已矣乎！吾未見能見其過，而內自訟者也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之二七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%8C%E4%B8%83"
  "translation_ja": "孔子が言った。「もう望みはないのだろうか。私はまだ、自分の過ちを見つけて、心の中で自分を責めることのできる人を見たことがない。」"
  "translation_status": "draft"
- "id": "rongo-05-028"
  "section_id": "rongo-chapter-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「十室之邑，必有忠信如丘者焉，不如丘之好學也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-05"
    "precision": "block"
    "anchor": "五之二八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AC%E5%86%B6%E9%95%B7%E7%AC%AC%E4%BA%94&oldid=973596#%E4%BA%94%E4%B9%8B%E4%BA%8C%E5%85%AB"
  "translation_ja": "孔子が言った。「十軒ほどの小さな村にも、私ほど誠実で信頼できる人は、きっといる。だが、私ほど学ぶことを好む人はいないだろう。」"
  "translation_status": "draft"
- "id": "rongo-06-001"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「雍也，可使南面。」仲弓問子桑伯子。子曰：「可也，簡。」仲弓曰：「居敬而行簡，以臨其民，不亦可乎？居簡而行簡，無乃大簡乎？」子曰：「雍之言然。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%B8%80"
  "translation_ja": "孔子が言った。「雍なら、人々を治める地位に就かせてもよい。」仲弓が子桑伯子について尋ねると、孔子は「よい人だ。煩わしくないところがよい」と答えた。仲弓は言った。「自分の心を慎み深く保ち、仕事を簡潔にして民に臨むのなら、よいのではないでしょうか。自分自身まで大ざっぱで、仕事も大ざっぱにするのでは、簡略に過ぎないでしょうか。」孔子は言った。「雍の言う通りだ。」"
  "translation_status": "draft"
- "id": "rongo-06-002"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "哀公問：「弟子孰爲好學？」孔子對曰：「有顏回者，好學；不遷怒，不貳過，不幸短命死矣！今也則亡，未聞好學者也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%8C"
  "translation_ja": "哀公が尋ねた。「弟子の中では、誰が学ぶことを好むか。」孔子が答えた。「顔回という者が、学ぶことを好みました。怒りを関係のない人へ向けず、同じ過ちを繰り返しませんでした。ところが不幸にも、若くして死んでしまいました。今はもうおりません。学ぶことを好む者がいるとは、まだ聞いていません。」"
  "translation_status": "draft"
- "id": "rongo-06-003"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子華使於齊，冉子爲其母請粟。子曰：「與之釜。」請益，曰：「與之庾。」冉子與之粟五秉。子曰：「赤之適齊也，乘肥馬，衣輕裘；吾聞之也：君子周急不繼富。」原思爲之宰，與之粟九百，辭。子曰：「毋！以與爾鄰里鄉黨乎！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%B8%89"
  "translation_ja": "子華が使者として斉へ行ったとき、冉子は子華の母のために穀物を求めた。孔子は「一釜与えなさい」と言った。さらに増やすよう頼むと、「一庾与えなさい」と言った。だが、冉子は五秉もの穀物を与えた。孔子は言った。「赤は斉へ行くのに、よく太った馬に乗り、軽く上等な毛皮を着ていった。私は、立派な人は差し迫って困っている人を助けるが、豊かな人に富をつぎ足しはしない、と聞いている。」原思が孔子の家政を預かったとき、孔子は穀物九百を与えたが、原思は辞退した。孔子は言った。「辞退しなくてよい。余るなら、隣近所や村の人たちに分けてはどうか。」"
  "translation_status": "draft"
- "id": "rongo-06-003-tn-001-text"
  "section_id": "rongo-chapter-06"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "釜・庾・秉は穀物の容量の単位。五秉は孔子が認めた量を大きく超える。後半の『九百』には、原文で単位が記されていない。"
  "translation_status": "draft"
- "id": "rongo-06-004"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂仲弓曰：「犁牛之子，騂且角；雖欲勿用，山川其舍諸？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%9B%9B"
  "translation_ja": "孔子は仲弓に言った。「まだら模様の牛から生まれた子でも、毛が赤く、角が整っていれば、供え物に用いないでおこうと思っても、山川の神々が放っておくだろうか。」"
  "translation_status": "draft"
- "id": "rongo-06-004-tn-001-text"
  "section_id": "rongo-chapter-06"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "祭りに用いる牛の条件をたとえにし、親の境遇によって子の資質を退ける必要はないと説く言葉と解される。"
  "translation_status": "draft"
- "id": "rongo-06-005"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「回也，其心三月不違仁。其餘，則日月至焉而已矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%94"
  "translation_ja": "孔子が言った。「回は、その心が三か月もの間、仁から離れない。ほかの者は、一日か一月、そこに達するだけだ。」"
  "translation_status": "draft"
- "id": "rongo-06-006"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季康子問：「仲由可使從政也與？」子曰：「由也果，於從政乎何有！」曰：「賜也可使從政也與？」曰：「賜也達，於從政乎何有！」曰：「求也可使從政也與？」曰：「求也藝，於從政乎何有！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%85%AD"
  "translation_ja": "季康子が尋ねた。「仲由に政治を任せられるでしょうか。」孔子は答えた。「由には決断力があります。政治を行うのに、何が難しいでしょう。」「賜にも政治を任せられるでしょうか。」「賜は物事に通じています。政治を行うのに、何が難しいでしょう。」「求にも政治を任せられるでしょうか。」「求にはさまざまな能力があります。政治を行うのに、何が難しいでしょう。」"
  "translation_status": "draft"
- "id": "rongo-06-007"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季氏使閔子騫爲費宰。閔子騫曰：「善爲我辭焉。如有復我者，則吾必在汶上矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%B8%83"
  "translation_ja": "季氏は閔子騫を費の町の長にしようとした。閔子騫は使者に言った。「私のために、うまくお断りしてください。もしまた迎えに来る人があれば、私はきっと汶水のほとりに移っているでしょう。」"
  "translation_status": "draft"
- "id": "rongo-06-007-tn-001-text"
  "section_id": "rongo-chapter-06"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "汶水を越えて魯を去り、斉へ逃れる意思を示した言葉と解される。"
  "translation_status": "draft"
- "id": "rongo-06-008"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "伯牛有疾，子問之，自牖執其手，曰：「亡之，命矣夫！斯人也，而有斯疾也！斯人也，而有斯疾也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%85%AB"
  "translation_ja": "伯牛が病気になった。孔子は見舞い、窓越しにその手を握って言った。「この人を失うのか。天命なのだろうか。この人が、こんな病気になるとは。この人が、こんな病気になるとは。」"
  "translation_status": "draft"
- "id": "rongo-06-009"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「賢哉回也！一簞食，一瓢飮，在陋巷，人不堪其憂，回也不改其樂。賢哉回也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子が言った。「なんと立派なのだ、回は。粗末な器に一杯の飯と、ひさごに一杯の水だけで、貧しい路地に暮らしている。ほかの人ならそのつらさに耐えられないだろうに、回は楽しみを失わない。なんと立派なのだ、回は。」"
  "translation_status": "draft"
- "id": "rongo-06-010"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "冉求曰：「非不說子之道，力不足也。」子曰：「力不足者，中道而廢；今女畫。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%8D%81"
  "translation_ja": "冉求が言った。「先生の道を好まないわけではありません。ただ、力が足りないのです。」孔子は言った。「力が足りない人は、途中で力尽きるものだ。今のお前は、初めから自分で線を引いている。」"
  "translation_status": "draft"
- "id": "rongo-06-011"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂子夏曰：「女爲君子儒，無爲小人儒。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子は子夏に言った。「立派な人として学問を身につけなさい。つまらない人のまま、知識だけを身につけてはいけない。」"
  "translation_status": "draft"
- "id": "rongo-06-011-tn-001-text"
  "section_id": "rongo-chapter-06"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の『儒』は、礼や古い文献を学び教える人を指す。君子の儒と小人の儒を対比している。"
  "translation_status": "draft"
- "id": "rongo-06-012"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子游爲武城宰。子曰：「女得人焉耳乎？」曰：「有澹臺滅明者，行不由徑；非公事，未嘗至於偃之室也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "子游が武城の長になった。孔子が「そこでよい人材を見つけたか」と尋ねると、子游は答えた。「澹台滅明という人がいます。歩くときに近道をせず、公の用事でなければ、私の部屋へ来たことがありません。」"
  "translation_status": "draft"
- "id": "rongo-06-013"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「孟之反不伐，奔而殿，將入門，策其馬，曰：『非敢後也，馬不進也。』」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "孔子が言った。「孟之反は、自分の手柄を誇らない。軍が敗走したとき、最後尾にとどまって守りを引き受けた。それなのに、城門へ入る間際に馬へむちを当て、『進んで後ろにいたのではない。馬が進まなかったのだ』と言った。」"
  "translation_status": "draft"
- "id": "rongo-06-014"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不有祝鮀之佞，而有宋朝之美，難乎免於今之世矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "孔子が言った。「祝鮀のような弁舌がなく、宋朝のような美しさだけがあるのでは、今の世で災いを免れるのは難しい。」"
  "translation_status": "draft"
- "id": "rongo-06-015"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「誰能出不由戶？何莫由斯道也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "孔子が言った。「誰が戸口を通らずに外へ出られるだろう。それなのに、どうして人はこの道を通らないのか。」"
  "translation_status": "draft"
- "id": "rongo-06-016"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「質勝文則野，文勝質則史。文質彬彬，然後君子。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「素朴さが洗練に勝ちすぎれば、野暮になる。洗練が素朴さに勝ちすぎれば、うわべばかりになる。素朴な中身と洗練された形がよく釣り合って、初めて立派な人になる。」"
  "translation_status": "draft"
- "id": "rongo-06-017"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「人之生也直，罔之生也幸而免。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "孔子が言った。「人は、まっすぐに生きるものだ。偽りのある人が生き延びているのは、運よく災いを免れているだけだ。」"
  "translation_status": "draft"
- "id": "rongo-06-018"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「知之者，不如好之者，好之者，不如樂之者。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "孔子が言った。「知っているだけの人は、それを好む人には及ばない。好む人も、それを楽しむ人には及ばない。」"
  "translation_status": "draft"
- "id": "rongo-06-019"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「中人以上，可以語上也；中人以下，不可以語上也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "孔子が言った。「理解の力が中ほどより上の人には、高い事柄を語ってよい。中ほどより下の人には、いきなり高い事柄を語ってはいけない。」"
  "translation_status": "draft"
- "id": "rongo-06-020"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "樊遲問知。子曰：「務民之義，敬鬼神而遠之，可謂知矣。」問仁。曰：「仁者先難而後獲，可謂仁矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "樊遅が知恵について尋ねた。孔子は言った。「人としてなすべきことに努め、神や霊を敬いながらも距離を置く。それを知恵があると言ってよい。」仁について尋ねると、孔子は言った。「仁のある人は、難しい務めを先にし、報いを得ることはあとにする。それを仁と言ってよい。」"
  "translation_status": "draft"
- "id": "rongo-06-021"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「知者樂水，仁者樂山。知者動，仁者靜。知者樂，仁者壽。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "孔子が言った。「知恵のある人は水を楽しみ、仁のある人は山を楽しむ。知恵のある人は動き、仁のある人は静かである。知恵のある人は楽しみ、仁のある人は長く生きる。」"
  "translation_status": "draft"
- "id": "rongo-06-022"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「齊一變，至於魯；魯一變，至於道。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "孔子が言った。「斉が一度改まれば、魯のあり方に近づく。魯が一度改まれば、道にかなうところまで行ける。」"
  "translation_status": "draft"
- "id": "rongo-06-023"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「觚不觚，觚哉！觚哉！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "孔子が言った。「觚が、觚らしくなくなっている。それでも觚なのか。觚と呼べるのか。」"
  "translation_status": "draft"
- "id": "rongo-06-023-tn-001-text"
  "section_id": "rongo-chapter-06"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "觚は酒器の名。形や用い方が本来のあり方を失っていることを嘆く言葉とされるが、具体的に何が変わったのかは定まらない。"
  "translation_status": "draft"
- "id": "rongo-06-024"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "宰我問曰：「仁者雖吿之曰：『井有仁焉。』其從之也？」子曰：「何爲其然也？君子可逝也，不可陷也。可欺也，不可罔也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "宰我が尋ねた。「仁のある人なら、『井戸の中に人がいる』と告げられたら、そのあとを追って飛び込むのでしょうか。」孔子は言った。「どうしてそんなことをするのか。立派な人を井戸まで行かせることはできても、落とし込むことはできない。もっともらしい話でだますことはできても、でたらめで惑わせることはできない。」"
  "translation_status": "draft"
- "id": "rongo-06-024-tn-001-text"
  "section_id": "rongo-chapter-06"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の『井有仁焉』の『仁』は、人の意味に取った。後半の『可逝』には『可選』という異文があり、解釈に異説がある。"
  "translation_status": "draft"
- "id": "rongo-06-024-source-note-001-text"
  "section_id": "rongo-chapter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「選」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-06-024-source-note-002-text"
  "section_id": "rongo-chapter-06"
  "kind": "note_body"
  "origin": "source"
  "source_text": "袁金平、李麗珠根據出土文獻與之對應句作「君子可選」，認爲「選」優於今本「逝」。袁金平、李麗珠：《據古文字資料再論〈論語·雍也〉「君子可逝」句》，《語言科學》2019年第1期。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#cite_note-1"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-06-025"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子博學於文，約之以禮，亦可以弗畔矣夫！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": "孔子が言った。「立派な人が広く文献を学び、礼によって自分を引き締めれば、道に背かずにいられるだろう。」"
  "translation_status": "draft"
- "id": "rongo-06-026"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子見南子，子路不說。夫子矢之曰：「予所否者，天厭之！天厭之！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之二六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%8C%E5%85%AD"
  "translation_ja": "孔子が南子に会うと、子路は不満を示した。孔子は誓って言った。「私に道に背くところがあれば、天は私を見放すだろう。天は私を見放すだろう。」"
  "translation_status": "draft"
- "id": "rongo-06-026-tn-001-text"
  "section_id": "rongo-chapter-06"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "南子は衛の霊公の夫人。当時の評判を理由に子路が面会を不満に思ったと解される。"
  "translation_status": "draft"
- "id": "rongo-06-027"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「中庸之爲德也，其至矣乎！民鮮久矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之二七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%8C%E4%B8%83"
  "translation_ja": "孔子が言った。「偏らず、ほどよい道を保つ徳は、まことに最高のものだ。人々の間では、それが少なくなって久しい。」"
  "translation_status": "draft"
- "id": "rongo-06-028"
  "section_id": "rongo-chapter-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢曰：「如有博施於民，而能濟眾，何如？可謂仁乎？」子曰：「何事於仁，必也聖乎？堯舜其猶病諸！夫仁者，己欲立而立人，己欲達而達人。能近取譬，可謂仁之方也已。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-06"
    "precision": "block"
    "anchor": "六之二八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%9B%8D%E4%B9%9F%E7%AC%AC%E5%85%AD&oldid=11118098#%E5%85%AD%E4%B9%8B%E4%BA%8C%E5%85%AB"
  "translation_ja": "子貢が言った。「もし、民に広く恵みを施し、多くの人を救える人がいたら、いかがでしょう。仁のある人と呼べますか。」孔子は言った。「仁にとどまるものか。きっと聖人と呼ぶべきだろう。堯や舜でさえ、それができないことを悩んだはずだ。仁のある人は、自分が立とうと思うときには人も立たせ、自分が道を開こうと思うときには人にも道を開く。身近な自分の気持ちから、人の気持ちを推し量る。それが仁を行う方法だと言える。」"
  "translation_status": "draft"
- "id": "rongo-07-001"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「述而不作，信而好古，竊比於我老彭。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B8%80"
  "translation_ja": "孔子が言った。「私は古い教えを伝えるのであって、新しいものを作るのではない。昔のものを信頼し、好んでいる。ひそかに、あの老彭になぞらえているのだ。」"
  "translation_status": "draft"
- "id": "rongo-07-001-tn-001-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "老彭が誰を指すかは定まっていない。古い伝承を伝えた人物の名とする説などがある。"
  "translation_status": "draft"
- "id": "rongo-07-002"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「默而識之，學而不厭，誨人不倦，何有於我哉？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%8C"
  "translation_ja": "孔子が言った。「静かに心に刻み、飽きることなく学び、疲れを覚えず人に教える。私にできることが、ほかに何かあるだろうか。」"
  "translation_status": "draft"
- "id": "rongo-07-002-tn-001-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "末尾は『このうち何が私に備わっているだろうか』と、自分を顧みる言葉に取る読みもある。"
  "translation_status": "draft"
- "id": "rongo-07-003"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「德之不脩，學之不講，聞義不能徙，不善不能改，是吾憂也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「徳を磨かないこと、学んだことをよく確かめないこと、正しいことを聞いてもそこへ進めないこと、よくないところを改められないこと。私が心配するのは、こういうことだ。」"
  "translation_status": "draft"
- "id": "rongo-07-004"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子之燕居，申申如也，夭夭如也。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%9B%9B"
  "translation_ja": "孔子が家でくつろいでいるときは、ゆったりとして、表情も和やかだった。"
  "translation_status": "draft"
- "id": "rongo-07-005"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「甚矣，吾衰也！久矣，吾不復夢見周公！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%94"
  "translation_ja": "孔子が言った。「すっかり衰えたものだ。もう長いこと、周公を夢に見ていない。」"
  "translation_status": "draft"
- "id": "rongo-07-006"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：『志於道，狎於德，依於仁，游於藝。』"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%85%AD"
  "translation_ja": "孔子が言った。「道を志し、徳に親しみ、仁をよりどころとし、さまざまな技芸に心を遊ばせることだ。」"
  "translation_status": "draft"
- "id": "rongo-07-006-tn-001-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は『狎於德』とし、徳に親しむという読みを採る。通行本の『據於德』なら、徳を足場にするという意味になる。"
  "translation_status": "draft"
- "id": "rongo-07-006-source-note-001-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "傳世本『狎』作『據』。《禮記・緇衣》有『德易狎而難親也』，與本章語意近，《郭店楚墓竹簡・語叢三》正作『志於道，狎於德，依於仁，游於藝。』，得傳世本作『據』爲訛誤。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#cite_note-1"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-07-007"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「自行束脩以上，吾未嘗無誨焉。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B8%83"
  "translation_ja": "孔子が言った。「干し肉の一束でも、礼として携えてくる人には、私は教えを惜しんだことがない。」"
  "translation_status": "draft"
- "id": "rongo-07-008"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不憤不啟；不悱不發。擧一隅，不以三隅反，則不復也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%85%AB"
  "translation_ja": "孔子が言った。「分からずに心をもどかしくさせていなければ、こちらから道を開いてはやらない。言いたいのに言葉にならずにいるのでなければ、こちらから言い表してはやらない。一つの隅を示したとき、残る三つの隅を自分で考えて返せないなら、同じことを繰り返し教えはしない。」"
  "translation_status": "draft"
- "id": "rongo-07-008-source-note-001-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「擧一隅而示之」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%85%AB"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-07-008-source-note-002-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「則吾不復也」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%85%AB"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-07-009"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子食於有喪者之側，未嘗飽也。子於是日哭，則不歌。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子は、喪中の人のそばで食事をするとき、満腹になるまで食べることはなかった。その日に人の死を悼んで泣いたなら、歌を歌わなかった。"
  "translation_status": "draft"
- "id": "rongo-07-010"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂顏淵曰：「用之則行，舍之則藏。惟我與爾有是夫！」子路曰：「子行三軍，則誰與？」子曰：「暴虎馮河，死而無悔者，吾不與也。必也臨事而懼，好謀而成者也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%8D%81"
  "translation_ja": "孔子は顔淵に言った。「用いられれば行動し、用いられなければ身を引く。これができるのは、私とお前くらいだろう。」子路が尋ねた。「先生が大軍を率いるなら、誰を伴いますか。」孔子は言った。「素手で虎に向かい、歩いて川を渡ろうとして、死んでも悔いないという人とは、一緒には行かない。事に臨んでは慎重になり、よく考えて成し遂げる人とこそ、行くだろう。」"
  "translation_status": "draft"
- "id": "rongo-07-011"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「富而可求也，雖執鞭之士，吾亦爲之；如不可求，從吾所好。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子が言った。「富が求めて得られるものなら、むちを持って人に仕える仕事でも、私はしよう。だが、求めても得られるとは限らないのなら、自分の好む道に従う。」"
  "translation_status": "draft"
- "id": "rongo-07-012"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子之所愼：齊、戰、疾。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "孔子がとりわけ慎重に向き合ったのは、祭りの前に身を清めること、戦争、病気だった。"
  "translation_status": "draft"
- "id": "rongo-07-013"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子在齊聞韶，三月不知肉味，曰：「不圖爲樂之至於斯也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "孔子は斉で『韶』の音楽を聞き、三か月もの間、肉の味を忘れるほどだった。そして言った。「音楽が、これほどの境地に達するとは思わなかった。」"
  "translation_status": "draft"
- "id": "rongo-07-014"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "冉有曰：「夫子爲衞君乎？」子貢曰：「諾，吾將問之」。入曰：「伯夷叔齊，何人也？」曰：「古之賢人也。」曰：「怨乎？」曰：「求仁而得仁，又何怨？」出，曰：「夫子不爲也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "冉有が言った。「先生は、衛の君主を支持なさるのだろうか。」子貢は「よし、私が聞いてこよう」と言って中へ入り、尋ねた。「伯夷と叔斉は、どのような人たちですか。」「昔の優れた人たちだ。」「恨みを抱いたでしょうか。」「仁を求めて仁を得たのだ。何を恨むことがあるだろう。」子貢は出てきて言った。「先生は支持なさらない。」"
  "translation_status": "draft"
- "id": "rongo-07-014-tn-001-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "衛では父子が君位を争っていた。子貢は、互いに位を譲った伯夷・叔斉への評価から、孔子の考えを読み取っている。"
  "translation_status": "draft"
- "id": "rongo-07-015"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「飯疏食，飮水，曲肱而枕之，樂亦在其中矣。不義而富且貴，於我如浮雲。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "孔子が言った。「粗末な飯を食べ、水を飲み、肘を曲げて枕にする。そんな暮らしの中にも、楽しみはある。不正なやり方で手にする富や地位など、私にとっては空に浮かぶ雲のようなものだ。」"
  "translation_status": "draft"
- "id": "rongo-07-016"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「加我數年，五十以學易，可以無大過矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「もう何年か私に与えられ、五十歳から『易』を学べるなら、大きな過ちを犯さずに済むだろう。」"
  "translation_status": "draft"
- "id": "rongo-07-016-tn-001-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "原文の『五十』や『易』には異読・異説があり、年齢や書名の解釈は一定しない。ここでは底本の字面に沿って訳した。"
  "translation_status": "draft"
- "id": "rongo-07-017"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子所雅言：「詩、書、藝禮，皆雅言也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "孔子は、『詩経』『書経』、技芸、礼について語るとき、いずれも正式な共通の言葉を用いた。"
  "translation_status": "draft"
- "id": "rongo-07-017-tn-001-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は『藝禮』とする。ここでは方以智『通雅』の、詩・書・藝・礼の四項目とする解釈を参考に区切った。通行本の『執禮』なら礼を行うときの意味になる。『雅言』は地域の方言と区別される正式な言葉と解した。"
  "translation_status": "draft"
- "id": "rongo-07-017-source-note-001-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「執」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-07-017-source-note-002-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "source"
  "source_text": "黄尚明根據「執」「埶」二字相混指出這裏的「執」應該讀爲「埶（藝）」。黄尚明：《從楚簡證「《詩》《書》執禮」的「執」應讀爲「埶」》，簡帛網，2011年10月14日。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#cite_note-2"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-07-018"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "葉公問孔子於子路，子路不對。子曰：「女奚不曰：『其爲人也，發憤忘食，樂以忘憂，不知老之將至云爾。』」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "葉公が子路に孔子のことを尋ねたが、子路は答えなかった。孔子は言った。「なぜ、こう言わなかったのか。『何かに熱中すると食事を忘れ、楽しんでいると心配事も忘れ、老いが近づいてくることさえ気づかない。そんな人です』と。」"
  "translation_status": "draft"
- "id": "rongo-07-019"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「我非生而知之者，好古，敏以求之者也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "孔子が言った。「私は、生まれつき知っている者ではない。古いものを好み、熱心に求めて知る者なのだ。」"
  "translation_status": "draft"
- "id": "rongo-07-020"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子不語：怪、力、亂、神。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "孔子は、怪しい出来事、並外れた力、世の乱れ、神霊については語らなかった。"
  "translation_status": "draft"
- "id": "rongo-07-021"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「三人行，必有我師焉。擇其善者而從之，其不善者而改之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "孔子が言った。「三人で道を歩けば、必ずその中に、私の師になる人がいる。よいところを選んで見習い、よくないところを見ては自分を改めるのだ。」"
  "translation_status": "draft"
- "id": "rongo-07-022"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「天生德於予，桓魋其如予何！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "孔子が言った。「天が私に徳を与えたのだ。桓魋に、私をどうすることができよう。」"
  "translation_status": "draft"
- "id": "rongo-07-023"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「二三子，以我爲隱乎？吾無隱乎爾！吾無行而不與二三子者，是丘也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "孔子が言った。「皆さんは、私が何かを隠していると思うか。私は何も隠していない。私の行いで、皆さんに示していないものは一つもない。それが私なのだ。」"
  "translation_status": "draft"
- "id": "rongo-07-024"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子以四教：文、行、忠、信。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "孔子は四つのことを教えた。文献や文化、実際の行い、真心を尽くすこと、信頼を守ることである。"
  "translation_status": "draft"
- "id": "rongo-07-025"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「聖人，吾不得而見之矣！得見君子者，斯可矣。」子曰：「善人，吾不得而見之矣！得見有恆者，斯可矣。亡而爲有，虛而爲盈，約而爲泰，難乎有恆矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": "孔子が言った。「聖人には会えそうにない。立派な人に会えれば、それでよい。」また言った。「善い人には会えそうにない。変わらず自分を保てる人に会えれば、それでよい。ないのにあるふりをし、空なのに満ちたふりをし、乏しいのに豊かなふりをする。そんなことでは、変わらず自分を保つのは難しい。」"
  "translation_status": "draft"
- "id": "rongo-07-026"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子釣而不綱，弋不射宿。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之二六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%8C%E5%85%AD"
  "translation_ja": "孔子は釣りはしたが、長い網で魚を一度に取ることはしなかった。糸をつけた矢で鳥を射ることはあったが、ねぐらの鳥は射なかった。"
  "translation_status": "draft"
- "id": "rongo-07-027"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「蓋有不知而作之者，我無是也。多聞，擇其善者而從之，多見而識之，知之次也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之二七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%8C%E4%B8%83"
  "translation_ja": "孔子が言った。「よく知らずに何かを作り出す人もいるらしいが、私はそうしない。多くを聞き、その中のよいものを選んで従い、多くを見て心に留める。これは、生まれながらに知ることの次に来る道だ。」"
  "translation_status": "draft"
- "id": "rongo-07-028"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "互鄉難與言。童子見，門人惑。子曰：「與其進也，不與其退也。唯何甚？人潔己以進，與其潔也，不保其往也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之二八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%8C%E5%85%AB"
  "translation_ja": "互郷の人々は、話を通じ合わせるのが難しいとされていた。そこから来た少年に孔子が会ったので、弟子たちは戸惑った。孔子は言った。「私は、この子が進んで来たことを認めるのであって、退いたあとの行いまで認めるわけではない。どうして、そんなに厳しくするのか。人が自分を清めて訪ねてきたなら、その清めた心を受け入れる。これまでの行いまで保証するわけではないのだ。」"
  "translation_status": "draft"
- "id": "rongo-07-029"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「仁遠乎哉？我欲仁，斯仁至矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之二九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%BA%8C%E4%B9%9D"
  "translation_ja": "孔子が言った。「仁は遠くにあるだろうか。私が仁を求めれば、そのとき仁はもうここにある。」"
  "translation_status": "draft"
- "id": "rongo-07-030"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "陳司敗問：「昭公知禮乎？」孔子對曰：「知禮。」孔子退，揖巫馬期而進之，曰：「吾聞君子不黨，君子亦黨乎？君取於吳爲同姓，謂之吳孟子。君而知禮，孰不知禮？」巫馬期以吿。子曰：「丘也幸，苟有過，人必知之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之三十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B8%89%E5%8D%81"
  "translation_ja": "陳の司法を預かる役人が尋ねた。「昭公は礼を知っていましたか。」孔子は「知っていました」と答えた。孔子が退くと、役人は巫馬期に礼をして近くへ招き、言った。「立派な人は身びいきをしないと聞いているが、身びいきもするのか。あの君主は呉から同じ姓の女性を妻に迎え、呉孟子と呼んでいた。それで礼を知っているなら、誰が礼を知らないというのか。」巫馬期がこれを伝えると、孔子は言った。「私は幸運だ。過ちがあれば、人が必ず気づいてくれる。」"
  "translation_status": "draft"
- "id": "rongo-07-030-tn-001-text"
  "section_id": "rongo-chapter-07"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "当時の礼では同姓の婚姻を避けた。昭公は魯の君主であり、孔子が自国の君主の過ちを直接語らなかったことが問題にされている。"
  "translation_status": "draft"
- "id": "rongo-07-031"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子與人歌而善，必使反之，而後和之。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之三一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B8%89%E4%B8%80"
  "translation_ja": "孔子は人と歌っていて、その人がうまく歌うと、必ずもう一度歌ってもらい、そのあとで声を合わせた。"
  "translation_status": "draft"
- "id": "rongo-07-032"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「文，莫吾猶人也；躬行君子，則吾未之有得！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之三二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B8%89%E4%BA%8C"
  "translation_ja": "孔子が言った。「文献や文化を学ぶことなら、私も人並みだろう。だが、立派な人の道を自分の身で行うことは、まだできていない。」"
  "translation_status": "draft"
- "id": "rongo-07-033"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「若聖與仁，則吾豈敢？抑爲之不厭，誨人不倦，則可謂云爾已矣！」公西華曰：「正唯弟子不能學也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之三三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B8%89%E4%B8%89"
  "translation_ja": "孔子が言った。「聖人であるとか、仁のある人だとか、どうして私に言えよう。ただ、それを目指すことに飽きず、人に教えることに疲れを覚えないとは、言ってもよいだろう。」公西華は言った。「まさにそこが、私たち弟子には学び取れないところなのです。」"
  "translation_status": "draft"
- "id": "rongo-07-034"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子疾病，子路請禱。子曰：「有諸？」子路對曰：「有之。誄曰：『禱爾于上下神祇。』子曰：「丘之禱久矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之三四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B8%89%E5%9B%9B"
  "translation_ja": "孔子が重い病気になり、子路は神々に祈ることを願い出た。孔子は「そういう決まりがあるのか」と尋ねた。子路は答えた。「あります。祈りの文に、『あなたのため、天と地の神々に祈る』とあります。」孔子は言った。「私なら、もう長いこと祈ってきたよ。」"
  "translation_status": "draft"
- "id": "rongo-07-035"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「奢則不孫，儉則固；與其不孫也，甯固。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之三五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B8%89%E4%BA%94"
  "translation_ja": "孔子が言った。「ぜいたくをすれば、へりくだる心を失う。倹約すれば、窮屈になる。へりくだる心を失うくらいなら、窮屈なほうがよい。」"
  "translation_status": "draft"
- "id": "rongo-07-036"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子坦蕩蕩，小人長戚戚。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之三六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B8%89%E5%85%AD"
  "translation_ja": "孔子が言った。「立派な人の心は、のびのびと広い。つまらない人は、いつまでもくよくよしている。」"
  "translation_status": "draft"
- "id": "rongo-07-037"
  "section_id": "rongo-chapter-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子溫而厲，威而不猛，恭而安。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-07"
    "precision": "block"
    "anchor": "七之三七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E8%BF%B0%E8%80%8C%E7%AC%AC%E4%B8%83&oldid=11118091#%E4%B8%83%E4%B9%8B%E4%B8%89%E4%B8%83"
  "translation_ja": "孔子は、温かみがありながら厳しく、威厳がありながら威圧せず、うやうやしくありながら自然に落ち着いていた。"
  "translation_status": "draft"
- "id": "rongo-08-001"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「泰伯，其可謂至德也已矣！三以天下讓，民無得而稱焉。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E4%B8%80"
  "translation_ja": "孔子が言った。「泰伯は、最高の徳の持ち主と言ってよい。天下を三たび譲ったが、民はその行いを知るすべもなく、たたえることさえできなかった。」"
  "translation_status": "draft"
- "id": "rongo-08-002"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「恭而無禮則勞，愼而無禮則葸，勇而無禮則亂，直而無禮則絞。君子篤於親，則民興於仁。故舊不遺，則民不偷。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E4%BA%8C"
  "translation_ja": "孔子が言った。「うやうやしくても礼がなければ、ただ疲れる。慎重でも礼がなければ、おびえるばかりになる。勇敢でも礼がなければ、乱暴になる。率直でも礼がなければ、人を傷つける。上に立つ人が身内に厚く接すれば、民の間にも仁の心が起こる。昔からの知り合いを見捨てなければ、民も薄情にならない。」"
  "translation_status": "draft"
- "id": "rongo-08-003"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子有疾，召門弟子曰：「啟予足！啟予手！詩云：『戰戰兢兢，如臨深淵，如履薄冰。』而今而後，吾知免夫！小子！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E4%B8%89"
  "translation_ja": "曾子が病気になり、弟子たちを呼んで言った。「私の足を出して見ておくれ。手も出しておくれ。『詩経』に、『おそれ慎み、深い淵に臨むように、薄い氷を踏むように』とある。皆よ、今になって初めて、私は無事に済んだと分かったのだ。」"
  "translation_status": "draft"
- "id": "rongo-08-003-tn-001-text"
  "section_id": "rongo-chapter-08"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "親から受けた身体を傷つけずに生涯を終えられることを確かめた言葉と解される。"
  "translation_status": "draft"
- "id": "rongo-08-004"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子有疾，孟敬子問之。曾子言曰：「鳥之將死，其鳴也哀，人之將死，其言也善。君子所貴乎道者三：動容貌，斯遠暴慢矣；正顏色，斯近信矣；出辭氣，斯遠鄙倍矣；籩豆之事，則有司存。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%9B%9B"
  "translation_ja": "曾子が病気になり、孟敬子が見舞いに来た。曾子は言った。「鳥は死を前にすると、鳴き声が悲しげになります。人は死を前にすると、言葉が真実になります。上に立つ人が道として重んじるべきことは三つあります。身のこなしを整え、乱暴さやおごりを遠ざけること。顔つきを正し、誠実さに近づくこと。言葉や声の調子を整え、卑しさや道理に背くことを遠ざけること。祭器の扱いなどの細かなことは、係の者がいます。」"
  "translation_status": "draft"
- "id": "rongo-08-004-source-note-001-text"
  "section_id": "rongo-chapter-08"
  "kind": "note_body"
  "origin": "source"
  "source_text": "顔世鉉認爲「動容貌」應爲「謹容貌」。顔世鉉：《説「重」「堇」形訛現象與相關的古書校讀》，《先秦兩漢訛字學術研討會論文集》，清華大學，2018年7月14日-15日，第245-246頁。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#cite_note-1"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-08-005"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子曰：「以能問於不能，以多問於寡，有若無，實若虛，犯而不校。昔者吾友，嘗從事於斯矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E4%BA%94"
  "translation_ja": "曾子が言った。「できるのに、できない人にも尋ねる。多く知っているのに、少ししか知らない人にも尋ねる。持っていても持っていないかのように、満ちていても空であるかのように振る舞う。ひどいことをされても、仕返しをしない。昔、私の友に、いつもそう努めていた人がいた。」"
  "translation_status": "draft"
- "id": "rongo-08-006"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子曰：「可以託六尺之孤，可以寄百里之命，臨大節而不可奪也。君子人與？君子人也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%85%AD"
  "translation_ja": "曾子が言った。「幼い跡継ぎを託すことができ、一国の命運を預けることができる。重大な局面に臨んでも、志を奪われない。そういう人は立派な人だろうか。まさに、立派な人である。」"
  "translation_status": "draft"
- "id": "rongo-08-007"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子曰：「士不可以不弘毅，任重而道遠。仁以爲己任，不亦重乎；死而後已，不亦遠乎。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E4%B8%83"
  "translation_ja": "曾子が言った。「道を志す者は、心を広く持ち、意志を強く保たなければならない。背負う責任は重く、進む道は遠いからだ。仁を自分の務めとするのだから、重いではないか。死ぬまでやめないのだから、遠いではないか。」"
  "translation_status": "draft"
- "id": "rongo-08-007-source-note-001-text"
  "section_id": "rongo-chapter-08"
  "kind": "note_body"
  "origin": "source"
  "source_text": "顔世鉉根據古文字「弘」「强」同形的關係認爲「弘」應讀爲「强」。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#cite_note-2"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-08-008"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「興於詩，立於禮，成於樂。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%85%AB"
  "translation_ja": "孔子が言った。「詩によって心を奮い立たせ、礼によって自分を確立し、音楽によって仕上げる。」"
  "translation_status": "draft"
- "id": "rongo-08-009"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「民可使由之，不可使知之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子が言った。「民を道に従わせることはできるが、その道を理解させることはできない。」"
  "translation_status": "draft"
- "id": "rongo-08-009-tn-001-text"
  "section_id": "rongo-chapter-08"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本の句読みに従った訳。句切りを変えて、『民が行えるなら従わせ、行えないなら理解させる』と読む説もある。"
  "translation_status": "draft"
- "id": "rongo-08-009-source-note-001-text"
  "section_id": "rongo-chapter-08"
  "kind": "note_body"
  "origin": "source"
  "source_text": "此句之句讀頗有爭議，亦可爲「民可，使由之；不可，使知之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#cite_note-3"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-08-010"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「好勇疾貧，亂也。人而不仁，疾之已甚，亂也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%8D%81"
  "translation_ja": "孔子が言った。「勇ましさを好み、貧しさをひどく嫌えば、乱れを引き起こす。仁のない人であっても、憎みすぎれば、やはり乱れを引き起こす。」"
  "translation_status": "draft"
- "id": "rongo-08-011"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「如有周公之才之美，使驕且吝，其餘不足觀也已！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子が言った。「たとえ周公のようなすばらしい才能があっても、おごり高ぶり、出し惜しみする人なら、ほかのことにはもう見るべきものがない。」"
  "translation_status": "draft"
- "id": "rongo-08-012"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「三年學，不至於穀，不易得也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "孔子が言った。「三年学んでも、俸禄を得ることに心を向けない人は、なかなか見つからない。」"
  "translation_status": "draft"
- "id": "rongo-08-012-tn-001-text"
  "section_id": "rongo-chapter-08"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『穀』は俸禄の意味に取った。文全体の解釈には異説がある。"
  "translation_status": "draft"
- "id": "rongo-08-013"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「篤信好學，守死善道。危邦不入，亂邦不居。天下有道則見，無道則隱。邦有道，貧且賤焉，恥也；邦無道，富且貴焉，恥也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "孔子が言った。「厚く信じ、学ぶことを好み、命をかけてもよい道を守る。危うい国には入らず、乱れた国にはとどまらない。天下に道が行われていれば世に出て、行われていなければ身を隠す。国に道が行われているのに、貧しく低い地位にいるのは恥だ。国に道が行われていないのに、富み高い地位にいるのも恥だ。」"
  "translation_status": "draft"
- "id": "rongo-08-014"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不在其位，不謀其政。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "孔子が言った。「その地位にいないなら、その地位の政務に口を出して策をめぐらすな。」"
  "translation_status": "draft"
- "id": "rongo-08-015"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「師摯之始，關雎之亂，洋洋乎，盈耳哉！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "孔子が言った。「楽長の摯が奏で始めるところから、『関雎』の最後の合奏まで。なんと豊かに、音が耳いっぱいに満ちることか。」"
  "translation_status": "draft"
- "id": "rongo-08-016"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「狂而不直，侗而不愿，悾悾而不信，吾不知之矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「気が大きいのに率直ではなく、ものを知らないのに実直ではなく、不器用そうなのに誠実ではない。そんな人のことは、私には分からない。」"
  "translation_status": "draft"
- "id": "rongo-08-017"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「學如不及，猶恐失之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "孔子が言った。「学ぶときは、まだ追いつけていないかのように努める。それでも、学んだものを失いはしないかと気にかけることだ。」"
  "translation_status": "draft"
- "id": "rongo-08-017-source-note-001-text"
  "section_id": "rongo-chapter-08"
  "kind": "note_body"
  "origin": "source"
  "source_text": "顔世鉉據此認爲「失」可能讀爲「逸」。顔世鉉：《以出土文獻的用字方法校讀傳世古書-以兩則〈論語〉的校讀爲例》《源遠流長：漢字國際學術研討會暨AEARU第三届漢字文化研討會論文集》，北京：北京大學出版社，2017年6月，第248-261頁。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#cite_note-4"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-08-018"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「巍巍乎，舜、禹之有天下也，而不與焉。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "孔子が言った。「なんと気高いことか。舜も禹も天下を治めながら、それを自分のものとはしなかった。」"
  "translation_status": "draft"
- "id": "rongo-08-019"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「大哉，堯之爲君也！巍巍乎，唯天爲大，唯堯則之！蕩蕩乎，民無能名焉！巍巍乎，其有成功也！煥乎，其有文章！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "孔子が言った。「なんと偉大な君主だったことか、堯は。高く大きい天だけがまことに偉大であり、堯だけがそれに倣った。その広大さを、民には言い表すこともできない。なんと立派な功績を成し遂げ、なんと輝かしい文化を築いたことか。」"
  "translation_status": "draft"
- "id": "rongo-08-020"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "舜有臣五人，而天下治。武王曰：「予有亂臣十人。」孔子曰：「『才難』，不其然乎？唐虞之際，於斯爲盛，有婦人焉，九人而已。三分天下有其二，以服事殷、周之德，其可謂至德也已矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "舜には五人の臣下がいて、天下が治まった。武王は「私には国を治める臣下が十人いる」と言った。孔子が言った。「『人材を得るのは難しい』とは、本当にそうではないか。堯や舜の時代と比べても、この周の時代に人材が最も盛んだった。それでも十人のうちには女性が一人いて、男性は九人にすぎなかった。天下の三分の二を手にしながら、なお殷に仕え続けた。周の徳は、最高の徳と言ってよいだろう。」"
  "translation_status": "draft"
- "id": "rongo-08-020-tn-001-text"
  "section_id": "rongo-chapter-08"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "人数の数え方には当時の性別観が表れている。最後の、殷に仕え続けたという話は、周の文王の行いを指す。"
  "translation_status": "draft"
- "id": "rongo-08-021"
  "section_id": "rongo-chapter-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「禹，吾無間然矣！菲飮食，而致孝乎鬼神；惡衣服，而致美乎黻冕；卑宮室，而盡力乎溝洫。禹，吾無間然矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-08"
    "precision": "block"
    "anchor": "八之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%B3%B0%E4%BC%AF%E7%AC%AC%E5%85%AB&oldid=11118097#%E5%85%AB%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "孔子が言った。「禹には、私は非難するところがない。食事は粗末でも、神や祖先を祭ることには心を尽くした。普段の衣服は粗末でも、祭りの礼服や冠は立派に整えた。住まいは質素でも、水路や溝を造ることには力を尽くした。禹には、私は非難するところがない。」"
  "translation_status": "draft"
- "id": "rongo-09-001"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子罕言利與命與仁。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%B8%80"
  "translation_ja": "孔子は、利益と天命と仁について、めったに語らなかった。"
  "translation_status": "draft"
- "id": "rongo-09-001-tn-001-text"
  "section_id": "rongo-chapter-09"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『與』を接続の語とした読み。『與』を認めるという動詞に取り、利益はめったに語らず、天命と仁を重んじた、と読む説もある。"
  "translation_status": "draft"
- "id": "rongo-09-002"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "達巷黨人曰：「大哉孔子！博學而無所成名。」子聞之，謂門弟子曰：「吾何執？執御乎？執射乎？吾執御矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%8C"
  "translation_ja": "達巷の村の人が言った。「孔子はすばらしい。広く学んでいるが、一つの専門で名を成したわけではない。」孔子はそれを聞き、弟子たちに言った。「私は何を専門にしようか。車の御しか、それとも弓か。では、車の御しを専門にしよう。」"
  "translation_status": "draft"
- "id": "rongo-09-003"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「麻冕，禮也；今也純，儉，吾從眾。拜下，禮也；今拜乎上，泰也。雖違眾，吾從下。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「麻の冠をかぶるのが礼だが、今は絹を使う。そのほうが手間を省けるので、私は皆に従う。堂の下でお辞儀をするのが礼だが、今は堂の上でしている。それはおごった態度だ。皆と違っても、私は下でお辞儀をする。」"
  "translation_status": "draft"
- "id": "rongo-09-004"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子絕四：「毋意，毋必，毋固，毋我。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%9B%9B"
  "translation_ja": "孔子は四つのことを断っていた。自分勝手に思い込まず、必ずそうでなければならないと決めつけず、かたくなにならず、自分だけを中心にしなかった。"
  "translation_status": "draft"
- "id": "rongo-09-005"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子畏於匡。曰：「文王既沒，文不在茲乎？天之將喪斯文也，後死者，不得與於斯文也。天之未喪斯文也，匡人其如予何？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%94"
  "translation_ja": "孔子は匡で危険に遭ったとき、こう言った。「文王は亡くなったが、その文化はここに受け継がれているではないか。天がこの文化を滅ぼすつもりなら、あとに生まれた私がそれを受け継ぐこともなかっただろう。天がまだ滅ぼすつもりでないなら、匡の人々に私をどうすることができよう。」"
  "translation_status": "draft"
- "id": "rongo-09-006"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大宰問於子貢曰：「夫子聖者與？何其多能也？」子貢曰：「固天縱之將聖，又多能也。」子聞之曰：「大宰知我乎！吾少也賤，故多能鄙事。君子多乎哉？不多也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%85%AD"
  "translation_ja": "大宰が子貢に尋ねた。「先生は聖人なのだろうか。どうして、あれほど多くのことができるのか。」子貢は答えた。「もともと天から聖人となる資質を与えられ、そのうえ多才でいらっしゃるのです。」孔子はこれを聞いて言った。「大宰は私を分かっているだろうか。私は若いころ身分が低かったので、雑多な仕事ができるようになったのだ。立派な人は、何でもできなければならないのか。そんなことはない。」"
  "translation_status": "draft"
- "id": "rongo-09-007"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "牢曰：「子云：『吾不試，故藝。』」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%B8%83"
  "translation_ja": "牢が言った。「先生は、『私は役職に用いられなかったので、いろいろな技芸を身につけたのだ』とおっしゃっていた。」"
  "translation_status": "draft"
- "id": "rongo-09-008"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「吾有知乎哉？無知也。有鄙夫問於我，空空如也，我扣其兩端而竭焉。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%85%AB"
  "translation_ja": "孔子が言った。「私に知恵があるだろうか。あるわけではない。ものをよく知らない人が私に尋ねてくれば、私も初めは何も分からない。それでも、事柄の両端を問い確かめて、十分に考え尽くすのだ。」"
  "translation_status": "draft"
- "id": "rongo-09-008-tn-001-text"
  "section_id": "rongo-chapter-09"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『空空如也』を、問いを受けた孔子にも初めは答えがないという意味に取った。質問する人が知識を持たない、あるいは誠実であるとする読みもある。"
  "translation_status": "draft"
- "id": "rongo-09-009"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「鳳鳥不至，河不出圖，吾已矣夫！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子が言った。「鳳凰はやって来ず、黄河から図も現れない。私の望みも、もう終わりなのだろうか。」"
  "translation_status": "draft"
- "id": "rongo-09-009-tn-001-text"
  "section_id": "rongo-chapter-09"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "鳳凰や河図は、聖人が世を治めるときの吉兆とされた。"
  "translation_status": "draft"
- "id": "rongo-09-010"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子見齊衰者，冕衣裳者，與瞽者，見之，雖少必作，過之必趨。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%8D%81"
  "translation_ja": "孔子は、喪服を着た人、礼服と冠を身につけた人、目の見えない人に会うと、相手が若くても必ず立ち上がった。その前を通るときは、必ず小走りになって敬意を示した。"
  "translation_status": "draft"
- "id": "rongo-09-011"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "顏淵喟然歎曰：「仰之彌高，鑽之彌堅，瞻之在前，忽焉在後！夫子循循然善誘人：博我以文，約我以禮。欲罷不能，既竭吾才，如有所立卓爾，雖欲從之，末由也已！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "顔淵は深くため息をついて言った。「見上げるほど高く、切り込もうとするほど堅い。前にあると思って見つめると、たちまち後ろにある。先生は、順を追って巧みに人を導かれる。文献によって私の世界を広げ、礼によって私を引き締めてくださる。やめようとしてもやめられない。自分の力を尽くしてみると、なお目の前に、ひときわ高く立つものがある。ついて行きたいと思っても、その道が見つからない。」"
  "translation_status": "draft"
- "id": "rongo-09-012"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子疾病，子路使門人爲臣。病間，曰：「久矣哉，由之行詐也！無臣而爲有臣，吾誰欺？欺天乎？且予與其死於臣之手也，無寧死於二三子之手乎！且予縱不得大葬，予死於道路乎？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "孔子が重い病気になったとき、子路は弟子たちに家臣の役をさせた。病状が少しよくなると、孔子は言った。「ずいぶん前から、由はこんな偽りを続けていたのか。家臣がいないのに、いるように見せかけて、私は誰をだますのだ。天をだますのか。それに、私は家臣の手の中で死ぬより、皆さんの手の中で死ぬほうがよい。立派な葬儀をしてもらえなくても、道端で死んだままになるわけではないだろう。」"
  "translation_status": "draft"
- "id": "rongo-09-013"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢曰：「有美玉於斯，韞櫝而藏諸？求善賈而沽諸？」子曰：「沽之哉！沽之哉！我待賈者也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "子貢が言った。「ここに美しい玉があるとします。箱に入れてしまっておきますか。それとも、よい買い手を探して売りますか。」孔子は言った。「売ろう。売ろう。私は買い手を待っているのだ。」"
  "translation_status": "draft"
- "id": "rongo-09-014"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子欲居九夷。或曰：「陋，如之何？」子曰：「君子居之，何陋之有？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "孔子は東方の異民族の土地に住もうと考えた。ある人が「文化の乏しい土地ですが、どうなさいますか」と言うと、孔子は答えた。「立派な人が住むなら、何が粗野なままであるだろう。」"
  "translation_status": "draft"
- "id": "rongo-09-015"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「吾自衞反魯，然後樂正，雅頌各得其所。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "孔子が言った。「私が衛から魯へ戻ってから、音楽が整えられ、『雅』も『頌』も、それぞれふさわしい場所を得た。」"
  "translation_status": "draft"
- "id": "rongo-09-016"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「出則事公卿，入則事父兄，喪事不敢不勉，不爲酒困，何有於我哉？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「外では公卿に仕え、家では父や兄に仕える。葬儀では力を尽くさずにはおかず、酒に飲まれないようにする。私にできることが、ほかに何かあるだろうか。」"
  "translation_status": "draft"
- "id": "rongo-09-017"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子在川上曰：「逝者如斯夫！不舍晝夜。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "孔子が川のほとりで言った。「過ぎていくものは、この流れのようだ。昼も夜も、とどまらない。」"
  "translation_status": "draft"
- "id": "rongo-09-018"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「吾未見好德如好色者也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "孔子が言った。「美しい容姿を好むほどに徳を好む人を、私はまだ見たことがない。」"
  "translation_status": "draft"
- "id": "rongo-09-019"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「譬如爲山，未成一簣，止，吾止也！譬如平地，雖覆一簣，進，吾往也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "孔子が言った。「土を盛って山を造るとしよう。あと一かごで完成するのにやめるなら、やめたのは自分だ。平らな地面に土を盛り始めるとしよう。まだ一かごをあけただけでも、進むなら、歩み出したのは自分だ。」"
  "translation_status": "draft"
- "id": "rongo-09-020"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「語之而不惰者，其回也與！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "孔子が言った。「話をしてやると、怠らずに取り組むのは、やはり回だろう。」"
  "translation_status": "draft"
- "id": "rongo-09-021"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子謂顏淵，曰：「惜乎！吾見其進也，未見其止也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "孔子は顔淵について言った。「惜しいことだ。進んでいく姿は見たが、立ち止まる姿は見たことがなかった。」"
  "translation_status": "draft"
- "id": "rongo-09-022"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「苗而不秀者，有矣夫！秀而不實者，有矣夫！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "孔子が言った。「芽は出ても、花をつけないものがある。花はつけても、実を結ばないものがある。」"
  "translation_status": "draft"
- "id": "rongo-09-023"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「後生可畏，焉知來者之不如今也？四十、五十而無聞焉，斯亦不足畏也已！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "孔子が言った。「あとから育ってくる若者は、侮れない。これからの人が今の私たちに及ばないと、どうして分かるだろう。ただ、四十歳、五十歳になっても何も聞こえてこないようなら、もう恐れるほどではないだろう。」"
  "translation_status": "draft"
- "id": "rongo-09-024"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「法語之言，能無從乎？改之爲貴。巽與之言，能無說乎？繹之爲貴。說而不繹，從而不改，吾末如之何也已矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "孔子が言った。「筋の通った厳しい言葉に、従わずにいられるだろうか。だが、大切なのは、実際に自分を改めることだ。穏やかで好意的な言葉を、喜ばずにいられるだろうか。だが、大切なのは、その意味をよく考えることだ。喜ぶだけで考えず、従うと言うだけで改めない人は、私にもどうしようもない。」"
  "translation_status": "draft"
- "id": "rongo-09-025"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「主忠信，毋友不如己者，過則勿憚改。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": "孔子が言った。「誠実さと信頼を何より大切にし、自分に及ばない人を友としないこと。過ちがあれば、ためらわずに改めることだ。」"
  "translation_status": "draft"
- "id": "rongo-09-026"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「三軍可奪帥也，匹夫不可奪志也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之二六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%8C%E5%85%AD"
  "translation_ja": "孔子が言った。「大軍から将軍を奪うことはできる。だが、一人の人間から、その志を奪うことはできない。」"
  "translation_status": "draft"
- "id": "rongo-09-027"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「衣敝縕袍，與衣狐貉者立，而不恥者，其由也與！『不忮不求，何用不臧？』子路終身誦之。子曰：「是道也，何足以臧？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之二七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%8C%E4%B8%83"
  "translation_ja": "孔子が言った。「ぼろぼろの綿入れを着て、狐やむじなの毛皮を着た人と並んでも、恥じないでいられるのは、由だろう。『人をねたまず、むやみに求めなければ、どうしてよくないことがあろう。』」子路はそれから、いつもこの詩を口ずさんでいた。孔子は言った。「その心得だけで、どうして十分に優れた人になれるだろう。」"
  "translation_status": "draft"
- "id": "rongo-09-028"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「歲寒，然後知松柏之後凋也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之二八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%8C%E5%85%AB"
  "translation_ja": "孔子が言った。「一年の寒さが厳しくなって初めて、松や柏が、ほかの木よりあとまで緑を保つことが分かる。」"
  "translation_status": "draft"
- "id": "rongo-09-028-tn-001-text"
  "section_id": "rongo-chapter-09"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "柏はここでは古代中国でいう常緑の針葉樹。日本の落葉樹のカシワではない。"
  "translation_status": "draft"
- "id": "rongo-09-029"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「知者不惑，仁者不憂，勇者不懼。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之二九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%BA%8C%E4%B9%9D"
  "translation_ja": "孔子が言った。「知恵のある人は迷わず、仁のある人は思い悩まず、勇気のある人は恐れない。」"
  "translation_status": "draft"
- "id": "rongo-09-030"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「可與共學，未可與適道；可與適道，未可與立；可與立，未可與權。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之三十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%B8%89%E5%8D%81"
  "translation_ja": "孔子が言った。「共に学べるからといって、共に道へ進めるとは限らない。共に道へ進めても、共に揺るがず立てるとは限らない。共に揺るがず立てても、時に応じて適切に判断できるとは限らない。」"
  "translation_status": "draft"
- "id": "rongo-09-031"
  "section_id": "rongo-chapter-09"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "「唐棣之華，偏其反而；豈不爾思？室是遠而」。子曰：「未之思也，夫何遠之有？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-09"
    "precision": "block"
    "anchor": "九之三一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E7%BD%95%E7%AC%AC%E4%B9%9D&oldid=2018157#%E4%B9%9D%E4%B9%8B%E4%B8%89%E4%B8%80"
  "translation_ja": "「唐棣の花が、ひらひらと揺れる。あなたを思わないことがあるだろうか。ただ、住まいが遠いのだ。」この詩について孔子は言った。「本当には思っていないのだ。本当に思っているなら、何が遠いというのか。」"
  "translation_status": "draft"
- "id": "rongo-10-001"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子於鄉黨，恂恂如也，似不能言者。其在宗廟朝廷，便便言，唯謹爾。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E4%B8%80"
  "translation_ja": "孔子は故郷の人々の間では、慎み深く、口がきけない人のように振る舞った。宗廟や朝廷では、はっきりと話したが、どこまでも慎重だった。"
  "translation_status": "draft"
- "id": "rongo-10-002"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "朝與下大夫言，侃侃如也；與上大夫言，誾誾如也。君在，踧踖如也，與與如也。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E4%BA%8C"
  "translation_ja": "朝廷で下位の大夫と話すときは、伸びやかに語り、上位の大夫と話すときは、穏やかながら筋を通して語った。君主がいるときは、つつしみながら、落ち着きを保っていた。"
  "translation_status": "draft"
- "id": "rongo-10-003"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "君召使擯，色勃如也，足躩如也。揖所與立，左右手，衣前後，襜如也。趨進，翼如也。賓退，必復命，曰：「賓不顧矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E4%B8%89"
  "translation_ja": "君主に召されて賓客の取り次ぎを命じられると、顔つきを引き締め、足取りも改まった。一緒に立つ役人へ左右に手を向けて礼をするとき、衣の前も後ろもきちんと整っていた。小走りに進む姿は、翼を広げるようだった。賓客が退出すると、必ず戻って報告し、「お客様は、もうこちらを振り返らずにお帰りになりました」と言った。"
  "translation_status": "draft"
- "id": "rongo-10-004"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "入公門，鞠躬如也，如不容。立不中門，行不履閾。過位，色勃如也，足躩如也，其言似不足者。攝齊升堂，鞠躬如也，屛氣似不息者。出，降一等，逞顏色，怡怡如也。沒階趨進，翼如也。復其位，踧踖如也。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%9B%9B"
  "translation_ja": "宮殿の門を入るときは、体が収まらないかのように身をかがめた。門の中央には立たず、敷居は踏まなかった。君主の立つ場所を通るときは、顔つきを引き締め、足取りを改め、声も出し足りないかのように控えめにした。衣の裾を持ち上げて堂へ上るときは、身をかがめ、息をしていないかのように呼吸を抑えた。退出して階段を一段下りると、表情を緩めて和やかになった。階段を下りきって小走りに進む姿は、翼を広げるようだった。自分の位置へ戻ると、またつつしみ深い態度になった。"
  "translation_status": "draft"
- "id": "rongo-10-005"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "執圭，鞠躬如也，如不勝。上如揖，下如授，勃如戰色，足蹜蹜如有循。享禮，有容色。私覿，愉愉如也。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E4%BA%94"
  "translation_ja": "圭を持つときは、その重さに耐えられないかのように身をかがめた。上に持ち上げるときは礼をするように、下ろすときは人へ渡すようにした。顔つきはおそれ慎むように引き締まり、足は何かに沿うように、小刻みに進んだ。贈り物を差し出す儀式では、穏やかな顔つきになった。私的に面会するときは、さらにくつろいで楽しげだった。"
  "translation_status": "draft"
- "id": "rongo-10-005-tn-001-text"
  "section_id": "rongo-chapter-10"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "圭は、諸侯の使者が正式な面会で持つ玉の笏。"
  "translation_status": "draft"
- "id": "rongo-10-006"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "君子不以紺緅飾，紅紫不以爲褻服；當暑，袗絺綌，必表而出之。緇衣羔裘，素衣麑裘，黃衣狐裘。褻裘長，短右袂。（必有寢衣，長一身有半。）狐貉之厚以居。去喪，無所不佩。非帷裳，必殺之。羔裘玄冠，不以弔。吉月，必朝服而朝。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%85%AD"
  "translation_ja": "孔子は、衣服の縁取りに紺や緅を用いず、普段着には紅や紫を用いなかった。暑い時期に薄手や粗織りの葛のひとえを着るときも、外へ出るときには必ず下に衣をつけた。黒い衣には子羊の毛皮、白い衣には小鹿の毛皮、黄色い衣には狐の毛皮を合わせた。普段の毛皮の衣は長めにし、右袖は短くした。寝るときの衣は必ず持っており、長さは身の丈の一倍半あった。家では狐やむじなの厚い毛皮を用いた。喪中でなければ、ふさわしい佩び物を欠かさなかった。布の幅をそのまま使う礼装の裳を除いては、必ず布を裁ち合わせて形を整えた。子羊の毛皮と黒い冠では、弔問に行かなかった。月初めの一日には、必ず朝服を着て朝廷に出た。"
  "translation_status": "draft"
- "id": "rongo-10-006-tn-001-text"
  "section_id": "rongo-chapter-10"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "紺・緅・紅・紫は当時の色名で、礼服や喪服との関係から使い分けられた。『寝るときの衣』の一文は底本で丸括弧に入っているが、本文として残した。裳の裁ち方の解釈には異説がある。"
  "translation_status": "draft"
- "id": "rongo-10-007"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "齊，必有明衣，布。齊必變食，居必遷坐。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E4%B8%83"
  "translation_ja": "祭りの前に身を清めるときは、必ず麻布の清潔な衣を用意した。その期間には普段と食事を変え、家の中でも居場所を移した。"
  "translation_status": "draft"
- "id": "rongo-10-008"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "食不厭精，膾不厭細。食饐而餲，魚餒而肉敗，不食。色惡不食，臭惡不食。失飪不食，不時不食。割不正不食，不得其醬不食。肉雖多，不使勝食氣。唯酒無量，不及亂。沽酒市脯不食。不撤薑食，不多食。祭于公，不宿肉。祭肉不出三日，出三日，不食之矣。食不語，寢不言。雖疏食菜羹瓜祭，必齊如也。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%85%AB"
  "translation_ja": "飯はよく精米したものを好み、なますは細かく切ったものを好んだ。すえて味の変わった飯、腐った魚や肉は食べなかった。色が悪いもの、においの悪いものは食べなかった。煮炊きの加減が悪いもの、時季に合わないものは食べなかった。正しく切っていない肉は食べず、それに合うたれがなければ食べなかった。肉が多くあっても、飯より多くは食べなかった。酒だけは量を決めなかったが、取り乱すほどには飲まなかった。買ってきた酒や干し肉は口にしなかった。食事にはいつも生姜を添えたが、多くは食べなかった。君主の祭りからいただいた肉は、一晩置かなかった。自分の祭りの肉も三日を越えては置かず、三日を過ぎたものは食べなかった。食事中には話さず、寝床でもしゃべらなかった。粗末な飯、野菜の汁物、瓜を供えるときであっても、必ず身を清めたときのようにつつしんだ。"
  "translation_status": "draft"
- "id": "rongo-10-008-tn-001-text"
  "section_id": "rongo-chapter-10"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "最後の『瓜祭』には異読があり、瓜を誤字と見る説や、少し取り分けて供える動作とする解釈もある。ここでは底本に残る瓜の字を訳に残した。食事の作法を伝える歴史的記述であり、現代の衛生基準を述べたものではない。"
  "translation_status": "draft"
- "id": "rongo-10-009"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "席不正不坐。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E4%B9%9D"
  "translation_ja": "敷物がきちんと敷かれていなければ、座らなかった。"
  "translation_status": "draft"
- "id": "rongo-10-010"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "鄉人飮酒，杖者出，斯出矣。鄉人儺，朝服而立於阼階。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%8D%81"
  "translation_ja": "郷里の酒宴では、杖をついた年長者たちが退出してから、自分も退出した。郷里の人々が厄払いを行うときは、朝服を着て、主人が立つ東側の階段に立った。"
  "translation_status": "draft"
- "id": "rongo-10-011"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "問人於他邦，再拜而送之。康子饋藥，拜而受之，曰：「丘未達，不敢嘗。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "他国の人へ安否を尋ねる使いを出すときは、二度礼をして送り出した。季康子から薬を贈られたときは、礼をして受け取り、「私はこの薬に通じていないので、むやみに飲むわけにはまいりません」と言った。"
  "translation_status": "draft"
- "id": "rongo-10-012"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "廄焚，子退朝，曰：「傷人乎？」不問馬。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "馬屋が焼けた。孔子は朝廷から戻ると、「けがをした人はいないか」と尋ね、馬のことは尋ねなかった。"
  "translation_status": "draft"
- "id": "rongo-10-013"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "君賜食，必正席先嘗之。君賜腥，必熟而薦之。君賜生，必畜之。侍食於君，君祭，先飯。疾，君視之，東首，加朝服拖紳。君命召，不俟駕行矣。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "君主から食べ物を賜ると、必ず敷物を正して座り、まずそれをいただいた。生肉を賜ると、必ず調理して祖先に供えた。生きた動物を賜ると、必ず飼った。君主のそばで食事をするときは、君主が供え物をしている間に、先に飯をいただいた。病気のときに君主が見舞いに来ると、頭を東へ向け、朝服を身に掛け、帯をその上へ引いた。君主から召しがあると、車の用意を待たずに出かけた。"
  "translation_status": "draft"
- "id": "rongo-10-013-tn-001-text"
  "section_id": "rongo-chapter-10"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "君主より先に飯を食べるのは、毒味の役を果たすためと解される。"
  "translation_status": "draft"
- "id": "rongo-10-014"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "入太廟，每事問。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "太廟に入ると、何事も一つずつ尋ねた。"
  "translation_status": "draft"
- "id": "rongo-10-015"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "朋友死，無所歸，曰：「於我殯。」朋友之饋，雖車馬，非祭肉，不拜。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "友が亡くなり、葬儀を引き受ける人がいなければ、「私のところで棺を安置しよう」と言った。友からの贈り物には、車や馬であっても、祭りの肉でなければ拝礼しなかった。"
  "translation_status": "draft"
- "id": "rongo-10-016"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "寢不尸，居不容。見齊衰者，雖狎必變。見冕者與瞽者，雖褻必以貌。凶服者式之。式負版者。有盛饌，必變色而作。迅雷，風烈，必變。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "寝るときは、死体のように身を固く伸ばさなかった。家でくつろぐときは、改まった顔つきをしなかった。喪服を着た人を見れば、親しい相手でも必ず態度を改めた。礼冠をつけた人や目の見えない人を見れば、普段のくつろいだ場でも、必ず顔つきで敬意を示した。喪服の人には、車の前の横木に身をかがめて礼をした。戸籍の板を背負う人にも同じように礼をした。盛大なごちそうを出されると、必ず表情を改めて立ち上がった。激しい雷や風にも、必ず態度を改めた。"
  "translation_status": "draft"
- "id": "rongo-10-017"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "升車，必正立，執綏。車中不內顧，不疾言，不親指。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "車に乗るときは、必ず体をまっすぐにして、つかまり綱を握った。車の中では、後ろを振り返らず、早口で話さず、手で直に指ささなかった。"
  "translation_status": "draft"
- "id": "rongo-10-018"
  "section_id": "rongo-chapter-10"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "疑斯擧矣，翔而後集。曰：「山梁雌雉，時哉時哉！」子路共之，三嗅而作。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "block"
    "anchor": "十之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "鳥は不審なものを感じると飛び立ち、しばらく舞ってから止まる。孔子が言った。「山の橋の雌の雉は、よい時を知っている。よい時を知っているな。」子路が雉に向かって身をかがめると、雉は三度鳴いて飛び立った。"
  "translation_status": "draft"
- "id": "rongo-10-018-tn-001-text"
  "section_id": "rongo-chapter-10"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "この章は本文と解釈の不確かな箇所が多い。冒頭は底本の『疑』に従った。末尾の『共之』『三嗅而作』は、子路が敬意を示し、雉が鳴いて飛び立ったという読みを採ったが、供え物やにおいをかぐ動作とする読みなどもある。"
  "translation_status": "draft"
- "id": "rongo-10-018-source-note-001-text"
  "section_id": "rongo-chapter-10"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「色」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#%E5%8D%81%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-10-018-source-note-002-text"
  "section_id": "rongo-chapter-10"
  "kind": "note_body"
  "origin": "source"
  "source_text": "陳劍根據出土文獻「色」「疑」二字的寫法指出「色」爲「疑」字之誤。陳劍：《據戰國竹簡文字校讀古書兩則》，《第四屆國際中國古文字學研討會論文集—新世紀的古文字學與經典詮釋》，香港中文大學中國語言及文學系，2003年10月，第371-373頁。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-10"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E9%84%89%E9%BB%A8%E7%AC%AC%E5%8D%81&oldid=11118092#cite_note-1"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-11-001"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「先進於禮樂，野人也；後進於禮樂，君子也。如用之，則吾從先進。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%B8%80"
  "translation_ja": "孔子が言った。「先に礼や音楽を身につけた人々は、素朴な田舎者だと言われ、あとから身につけた人々は、洗練された人だと言われる。だが、実際に用いるなら、私は先の人々に従う。」"
  "translation_status": "draft"
- "id": "rongo-11-002"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「從我於陳蔡者，皆不及門也。」德行：顏淵、閔子騫、冉伯牛、仲弓。言語：宰我、子貢。政事：冉有、季路。文學：子游、子夏。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%BA%8C"
  "translation_ja": "孔子が言った。「陳や蔡で私についてきた者たちも、今は誰も門下にいない。」徳のある行いでは、顔淵、閔子騫、冉伯牛、仲弓。言葉の力では、宰我、子貢。政治の仕事では、冉有、季路。文献の学びでは、子游、子夏。"
  "translation_status": "draft"
- "id": "rongo-11-003"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「回也，非助我者也！於吾言，無所不說。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「回は私を助けてくれる者ではないな。私の言葉を、何でも喜んで受け入れてしまうのだから。」"
  "translation_status": "draft"
- "id": "rongo-11-004"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「孝哉，閔子騫！人不間於其父母昆弟之言。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%9B%9B"
  "translation_ja": "孔子が言った。「なんと親孝行なのだ、閔子騫は。父母や兄弟が彼について語る言葉を、誰もとがめない。」"
  "translation_status": "draft"
- "id": "rongo-11-005"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "南容三復《白圭》，孔子以其兄之子妻之。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%BA%94"
  "translation_ja": "南容は、『白い玉』の詩を繰り返し口にしていた。孔子は兄の娘を彼に嫁がせた。"
  "translation_status": "draft"
- "id": "rongo-11-005-tn-001-text"
  "section_id": "rongo-chapter-11"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "白い玉の傷は磨いて取り除けるが、言葉の過ちは取り戻せない、と戒める詩を指す。"
  "translation_status": "draft"
- "id": "rongo-11-006"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季康子問：「弟子孰爲好學？」孔子對曰：「有顏回者好學，不幸短命死矣。今也則亡。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%85%AD"
  "translation_ja": "季康子が尋ねた。「弟子の中で、誰が学ぶことを好みますか。」孔子が答えた。「顔回という者が学ぶことを好みましたが、不幸にも若くして死んでしまいました。今はもうおりません。」"
  "translation_status": "draft"
- "id": "rongo-11-007"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "顏淵死，顏路請子之車以爲之槨。子曰：「才不才，亦各言其子也。鯉也死，有棺而無槨。吾不徒行以爲之槨，以吾從大夫之後，不可徒行也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%B8%83"
  "translation_ja": "顔淵が死んだとき、父の顔路は、外棺を作るために孔子の車を譲ってほしいと頼んだ。孔子は言った。「才があってもなくても、それぞれにとっては大切なわが子だ。私の鯉が死んだときも、棺はあったが外棺はなかった。外棺を作るために車を売って歩くことはしなかった。私も大夫の末席に連なる者なので、徒歩で出歩くわけにはいかないからだ。」"
  "translation_status": "draft"
- "id": "rongo-11-008"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "顏淵死，子曰：「噫！天喪予！天喪予！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%85%AB"
  "translation_ja": "顔淵が死んだとき、孔子は言った。「ああ、天は私を滅ぼした。天は私を滅ぼした。」"
  "translation_status": "draft"
- "id": "rongo-11-009"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "顏淵死，子哭之慟。從者曰：「子慟矣！」曰：「有慟乎？非夫人之爲慟而誰爲？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%B9%9D"
  "translation_ja": "顔淵が死んだとき、孔子は激しく泣いた。そばにいた者が「先生、あまりにも深く悲しんでいらっしゃいます」と言うと、孔子は答えた。「それほど悲しんでいるか。あの人のために深く悲しまず、誰のために悲しもうか。」"
  "translation_status": "draft"
- "id": "rongo-11-010"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "顏淵死，門人欲厚葬之。子曰：「不可。」門人厚葬之。子曰：「回也，視予猶父也，予不得視猶子也；非我也，夫二三子也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%8D%81"
  "translation_ja": "顔淵が死んだとき、門人たちは手厚い葬儀をしようとした。孔子は「それはよくない」と言ったが、門人たちは盛大に葬った。孔子は言った。「回は私を父のように思ってくれていたが、私は彼をわが子のように扱ってやれなかった。私がそうしたのではない。あの弟子たちがしたのだ。」"
  "translation_status": "draft"
- "id": "rongo-11-011"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季路問事鬼神。子曰：「未能事人，焉能事鬼？」曰：「敢問死？」曰：「未知生，焉知死？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "季路が神や霊への仕え方を尋ねた。孔子は言った。「まだ人に十分仕えることもできないのに、どうして霊に仕えられるだろう。」季路が「では、死についてお尋ねしてもよいでしょうか」と言うと、孔子は答えた。「まだ生を知らないのに、どうして死を知ることができよう。」"
  "translation_status": "draft"
- "id": "rongo-11-012"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "閔子侍側，誾誾如也；子路，行行如也；冉有、子貢，侃侃如也。子樂。「若由也，不得其死然！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "閔子がそばにいるときは、穏やかで筋の通った様子だった。子路は強く堂々とし、冉有と子貢は伸びやかだった。孔子はそれを喜んだ。ただ、こう言った。「由のようでは、穏やかな最期を迎えられないかもしれない。」"
  "translation_status": "draft"
- "id": "rongo-11-013"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "魯人爲長府。閔子騫曰：「仍舊貫，如之何？何必改作？」子曰：「夫人不言，言必有中。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "魯の人々が長府の建物を造り直そうとした。閔子騫は言った。「今までのままにしておくのは、どうでしょう。どうして、わざわざ建て替えるのでしょうか。」孔子は言った。「あの人はめったに口を開かないが、言えば必ず的を射ている。」"
  "translation_status": "draft"
- "id": "rongo-11-014"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「由之瑟，奚爲於丘之門？」門人不敬子路。子曰：「由也升堂矣，未入於室也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "孔子が言った。「由のような瑟の弾き方が、どうして私の門内でなされるのか。」それ以来、門人たちは子路を敬わなくなった。孔子は言った。「由は、すでに堂には上っている。ただ、奥の部屋へまだ入っていないだけだ。」"
  "translation_status": "draft"
- "id": "rongo-11-014-tn-001-text"
  "section_id": "rongo-chapter-11"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "瑟は弦楽器。堂から奥の部屋へ進むというたとえで、子路にも相当の到達があることを示している。"
  "translation_status": "draft"
- "id": "rongo-11-015"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢問：「師與商也孰賢？」子曰：「師也過，商也不及。」曰：「然則師愈與？」子曰：「過猶不及。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "子貢が尋ねた。「師と商では、どちらが優れていますか。」孔子は言った。「師は行き過ぎ、商は届かない。」「それなら、師のほうが上でしょうか。」「行き過ぎるのは、届かないのと同じだ。」"
  "translation_status": "draft"
- "id": "rongo-11-016"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季氏富於周公，而求也爲之聚斂而附益之。子曰：「非吾徒也！小子鳴鼓而攻之，可也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "季氏は周公よりも豊かだったのに、求はそのために税を取り立て、さらに富を増やしていた。孔子は言った。「あれはもう、私の仲間ではない。皆よ、太鼓を鳴らして、その非を責めてもよい。」"
  "translation_status": "draft"
- "id": "rongo-11-016-source-note-001-text"
  "section_id": "rongo-chapter-11"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「如」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-11-017"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "柴也愚，參也魯，師也辟，由也喭。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "柴は理解が鈍く、参は不器用で、師は偏りがあり、由は荒っぽかった。"
  "translation_status": "draft"
- "id": "rongo-11-018"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「回也其庶乎，屢空。賜不受命，而貨殖焉；億則屢中。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "孔子が言った。「回は、道にかなり近づいているだろう。暮らしはたびたび何もないほどだった。賜は運命に身を任せず、商いで財を増やす。先を読めば、たびたび当てる。」"
  "translation_status": "draft"
- "id": "rongo-11-018-tn-001-text"
  "section_id": "rongo-chapter-11"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『屢空』を生活の困窮、『不受命』を運命にそのまま従わないこととした。いずれも別の解釈がある。"
  "translation_status": "draft"
- "id": "rongo-11-019"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張問「善人」之道。子曰：「不踐跡，亦不入於室。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "子張が、善い人の道について尋ねた。孔子は言った。「先人の足跡を踏んで学ぼうとはしない。それでは、道の奥深くまでは入れない。」"
  "translation_status": "draft"
- "id": "rongo-11-020"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「論篤是與，君子者乎？色莊者乎？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "孔子が言った。「言葉が誠実そうだからといって、その人に賛成してよいだろうか。本当に立派な人なのか、それとも顔つきだけが厳かな人なのか。」"
  "translation_status": "draft"
- "id": "rongo-11-021"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路問：「聞斯行諸？」子曰：「有父兄在，如之何其聞斯行之？」冉有問：「聞斯行諸？」子曰：「聞斯行之。」公西華曰：「由也問：『聞斯行諸？』子曰：『有父兄在。』求也問：『聞斯行諸？』子曰：『聞斯行之。』赤也惑，敢問。」子曰：「求也退，故進之；由也兼人，故退之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "子路が尋ねた。「聞いてよいと思ったことは、すぐ実行してよいでしょうか。」孔子は言った。「父や兄がいるではないか。どうして聞いたまますぐに実行するのか。」冉有が同じことを尋ねると、孔子は「聞いたら実行しなさい」と答えた。公西華は言った。「由が尋ねたときは『父や兄がいる』とおっしゃり、求が尋ねたときは『実行しなさい』とおっしゃいました。私には分からないので、お尋ねします。」孔子は言った。「求は引っ込みがちなので、前へ進ませた。由は人を押しのけるほど勢いがあるので、引き止めたのだ。」"
  "translation_status": "draft"
- "id": "rongo-11-022"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子畏於匡，顏淵後。子曰：「吾以女爲死矣！」曰：「子在，回何敢死？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "孔子が匡で危険に遭ったとき、顔淵はあとから来た。孔子が「私はお前が死んだかと思った」と言うと、顔淵は答えた。「先生が生きていらっしゃるのに、私がどうして死んでしまえましょう。」"
  "translation_status": "draft"
- "id": "rongo-11-023"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季子然問：「仲由、冉求可謂大臣與？」子曰：「吾以子爲異之問，曾由與求之問？所謂大臣者，以道事君，不可則止。今由與求也，可謂具臣矣。」曰：「然則從之者與？」子曰：「弒父與君，亦不從也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "季子然が尋ねた。「仲由と冉求は、大臣と呼べるでしょうか。」孔子は言った。「何か特別なことをお尋ねかと思ったら、由と求のことでしたか。大臣というのは、道をもって君主に仕え、それができなければ退く人です。今の由と求なら、役目を果たすだけの臣下とは呼べるでしょう。」「では、主君の言うままに従う者でしょうか。」「父や君主を殺すことには、あの二人も従いません。」"
  "translation_status": "draft"
- "id": "rongo-11-024"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路使子羔爲費宰。子曰：「賊夫人之子。」子路曰：「有民人焉，有社稷焉；何必讀書，然後爲學？」子曰：「是故惡夫佞者。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "子路は子羔を費の町の長にしようとした。孔子は言った。「その若者を損なうことになる。」子路は言った。「そこには民がおり、土地と穀物の神を祭る務めがあります。どうして、書物を読んでからでなければ学びにならないのでしょう。」孔子は言った。「こういうことがあるから、口先のうまい者は嫌なのだ。」"
  "translation_status": "draft"
- "id": "rongo-11-025"
  "section_id": "rongo-chapter-11"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    子路、曾皙、冉有、公西華侍坐。子曰：「以吾一日長乎爾，毋吾以也。居則曰：『不吾知也。』如或知爾，則何以哉？」
    子路率爾而對，曰：「千乘之國，攝乎大國之閒，加之以師旅，因之以饑饉，由也爲之，比及三年，可使有勇，且知方也。」夫子哂之。
    「求，爾何如？」對曰：「方六七十，如五六十，求也爲之，比及三年，可使足民；如其禮樂，以俟君子。」
    「赤，爾何如？」對曰：「非曰能之，願學焉！宗廟之事，如會同，端章甫，願爲小相焉。」
    「點，爾何如？」鼓瑟希，鏗爾，舍瑟而作；對曰：「異乎三子者之撰。」子曰：「何傷乎？亦各言其志也。」曰：「莫春者，春服既成。冠者五六人，童子六七人。浴乎沂，風乎舞雩，詠而歸。」夫子喟然歎曰：「吾與點也！」
    三子者出，曾皙後。曾皙曰：「夫三子者之言何如？」子曰：「亦各言其志也已矣。」曰：「夫子何哂由也？」曰：「爲國以禮，其言不讓，是故哂之。」「唯求則非邦也與？」「安見方六七十，如五六十，而非邦也者？」「唯赤則非邦也與？」「宗廟會同，非諸侯而何？赤也爲之小，孰能爲之大？」
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-11"
    "precision": "block"
    "anchor": "十一之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%88%E9%80%B2%E7%AC%AC%E5%8D%81%E4%B8%80&oldid=11118105#%E5%8D%81%E4%B8%80%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": |-
    子路、曾皙、冉有、公西華が、孔子のそばに座っていた。孔子が言った。「私が少し年上だからといって、遠慮することはない。普段は『自分を認めてくれる人がいない』と言っているね。もし認めてくれる人がいたら、何をしたいか。」
    子路は、すぐさま答えた。「戦車を千台出す国が大国の間に挟まれ、軍に攻められ、そのうえ飢饉に遭っているとします。私が治めれば、三年のうちに、民に勇気を持たせ、進むべき道も知らせることができます。」孔子は微笑んだ。
    「求、お前はどうか。」冉有は答えた。「六、七十里四方か、五、六十里四方の土地を私が治めれば、三年のうちに、民の暮らしを十分にできます。礼や音楽については、優れた方にお願いしたいと思います。」
    「赤、お前はどうか。」公西華は答えた。「できると言うのではなく、学びたいのです。宗廟の儀式や諸侯の会合で、礼服と冠をつけ、下役として儀礼を助けたいと思います。」
    「点、お前はどうか。」曾皙の瑟の音がまばらになり、最後の一音が響いた。彼は瑟を置いて立ち上がり、答えた。「三人の選んだこととは違います。」孔子は言った。「何の差し支えがある。皆、それぞれの志を話せばよい。」曾皙は言った。「春の終わり、春の衣服も整ったころ、大人五、六人と少年六、七人で、沂水で水浴びをし、舞雩の祭壇で風に吹かれ、歌いながら帰りたいと思います。」孔子は深く息をつき、言った。「私は点に賛成だ。」
    三人が出ていき、曾皙があとに残った。曾皙が「三人の言葉を、どう思われますか」と尋ねると、孔子は「それぞれに志を話しただけだ」と答えた。「では、なぜ由にお笑いになったのでしょう。」「国は礼で治めるものなのに、あの言葉には譲る気持ちがなかった。だから笑ったのだ。」「求が語ったのは、国のことではないのでしょうか。」「六、七十里四方、あるいは五、六十里四方もあって、国ではないものがあるだろうか。」「赤の話も、国のことではないのでしょうか。」「宗廟の儀式や諸侯の会合が、諸侯の仕事でなくて何だろう。赤が下役を務めるというなら、いったい誰が上役を務められるだろう。」
  "translation_status": "draft"

- "id": "rongo-appendix-22"
  "parent_id": null
  "kind": "section"
  "heading_segment_ids": []
  "label_ja": "付録 知道第二十二（断片）"
  "origin": "editorial"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-toc"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%9F%A5%E9%81%93%E7%AC%AC%E4%BA%8C%E5%8D%81%E4%BA%8C&oldid=8215407"
"segments":
- "id": "rongo-01-001"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？人不知而不慍，不亦君子乎？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E4%B8%80"
  "translation_ja": "孔子が言った。「学んだことを、折にふれて繰り返し身につける。うれしいことではないか。同じ志を持つ友が遠くから訪ねてくる。楽しいことではないか。人に認められなくても腹を立てない。それこそ、立派な人ではないか。」"
  "translation_status": "draft"
- "id": "rongo-01-002"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "有子曰：「其爲人也孝弟，而好犯上者，鮮矣；不好犯上，而好作亂者，未之有也。君子務本，本立而道生；孝弟也者，其爲仁之本與？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E4%BA%8C"
  "translation_ja": "有子が言った。「親を大切にし、年長者を敬う人で、目上の人に逆らうことを好む者は少ない。目上に逆らうことを好まず、それでいて反乱を好む者など、いたためしがない。立派な人は物事の根本に力を注ぐ。根本が定まれば、進むべき道もそこから生まれる。親を大切にし、年長者を敬うことは、仁を実践する根本ではないだろうか。」"
  "translation_status": "draft"
- "id": "rongo-01-003"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「巧言令色，鮮矣仁。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「口先がうまく、顔つきばかり愛想よく取り繕う人に、仁の心はめったにない。」"
  "translation_status": "draft"
- "id": "rongo-01-004"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子曰：「吾日三省吾身：爲人謀而不忠乎？與朋友交而不信乎？傳不習乎？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%9B%9B"
  "translation_ja": "曾子が言った。「私は毎日、三つのことについて自分を振り返る。人のために考え、行動するとき、心を尽くさなかったことはないか。友と付き合うとき、誠実さを欠かなかったか。教わったことを、繰り返し学ばずに済ませてはいないか。」"
  "translation_status": "draft"
- "id": "rongo-01-005"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「道千乘之國，敬事而信，節用而愛人，使民以時。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E4%BA%94"
  "translation_ja": "孔子が言った。「戦車を千台出せるほどの国を治めるには、政務に真剣に取り組んで信頼を守り、出費を抑えて人々を大切にし、民を労役に使うのも農作業の時期を避けることだ。」"
  "translation_status": "draft"
- "id": "rongo-01-006"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「弟子入則孝，出則弟，謹而信，汎愛眾，而親仁。行有餘力，則以學文。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%85%AD"
  "translation_ja": "孔子が言った。「若者は、家では親を大切にし、外では年長者を敬い、行いを慎んで約束を守り、広く人々を愛し、仁のある人に親しむことだ。そのうえで力が余っていれば、書物や文化を学ぶとよい。」"
  "translation_status": "draft"
- "id": "rongo-01-007"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏曰：「賢賢易色；事父母，能竭其力；事君，能致其身；與朋友交，言而有信；雖曰未學，吾必謂之學已矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E4%B8%83"
  "translation_ja": "子夏が言った。「美しい容姿を好む心を、人の優れた徳を重んじる心に置き換える。親に仕えて力を尽くし、君主に仕えて身を捧げ、友と交わって言葉に責任を持つ。そのような人なら、学問をしたことがないと言われても、私はすでに学んだ人だと言おう。」"
  "translation_status": "draft"
- "id": "rongo-01-007-tn-001-text"
  "section_id": "rongo-chapter-01"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "冒頭の『賢賢易色』には、美色を好む気持ちを、賢い人の徳を好む気持ちに代えるとする読みのほか、賢い人を敬うときに顔つきを改めるとする読みなどがある。ここでは前者に沿って訳した。"
  "translation_status": "draft"
- "id": "rongo-01-007-source-note-001-text"
  "section_id": "rongo-chapter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "牛鵬濤根據郭店簡《五行》中「心」與「色」的關係認爲「賢賢易色」應理解爲「尊尚賢人，改易顔色」。牛鵬濤：《簡帛零札二則》，上海：中西書局，2012年，第199-201頁。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#cite_note-1"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-01-007-source-note-002-text"
  "section_id": "rongo-chapter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一無「已」字"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E4%B8%83"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-01-008"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子不重則不威，學則不固。主忠信，無友不如己者，過則勿憚改。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%85%AB"
  "translation_ja": "孔子が言った。「立派な人を目指すなら、軽々しく振る舞ってはいけない。重みがなければ威厳もなく、学んでも身につかない。誠実さと信頼を何より大切にし、自分に及ばない人を友としないこと。過ちがあれば、ためらわずに改めることだ。」"
  "translation_status": "draft"
- "id": "rongo-01-008-tn-001-text"
  "section_id": "rongo-chapter-01"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『自分に及ばない人を友としない』の解釈には異説がある。ここでは字面に沿い、自分を高める交わりを求める言葉として訳した。"
  "translation_status": "draft"
- "id": "rongo-01-009"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子曰：「愼終追遠，民德歸厚矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E4%B9%9D"
  "translation_ja": "曾子が言った。「身近な人の死を丁重に弔い、遠い祖先を忘れずに祭る。そうすれば、民の心も厚みのあるものになっていく。」"
  "translation_status": "draft"
- "id": "rongo-01-010"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子禽問於子貢曰：「夫子至於是邦也，必聞其政，求之與？抑與之與？」子貢曰：「夫子溫、良、恭、儉、讓以得之。夫子之求之也，其諸異乎人之求之與？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%8D%81"
  "translation_ja": "子禽が子貢に尋ねた。「先生はどの国へ行っても、必ずその国の政治についてお聞きになる。それは先生のほうから求めるのか、それとも相手が話してくれるのか。」子貢が答えた。「先生は、穏やかさ、誠実さ、敬意、慎み、謙虚さによって、話を聞く機会を得られるのだ。先生の求め方は、ほかの人の求め方とは違うのだろうね。」"
  "translation_status": "draft"
- "id": "rongo-01-011"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「父在觀其志，父沒觀其行。三年無改於父之道，可謂孝矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子が言った。「父が生きている間は、その人の志を見よ。父が亡くなってからは、その人の行いを見よ。三年の間、父のやり方を改めずにいられるなら、親を大切にしていると言える。」"
  "translation_status": "draft"
- "id": "rongo-01-011-tn-001-text"
  "section_id": "rongo-chapter-01"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "三年は当時、親の喪に服す期間とされた。父のやり方を改めないという言葉を、どのような行いについても無条件に当てはめるかどうかは、解釈が分かれる。"
  "translation_status": "draft"
- "id": "rongo-01-012"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "有子曰：「禮之用，和爲貴；先王之道，斯爲美；小大由之。有所不行，知和而和，不以禮節之，亦不可行也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "有子が言った。「礼を行うときは、調和を大切にする。昔の優れた王たちの道も、そこが美しかった。大きなことも小さなことも、この道に従う。だが、それだけではうまくいかないこともある。調和が大切だと知って、ただ仲よくすることばかり求め、礼によって節度を保たなければ、やはりうまくはいかない。」"
  "translation_status": "draft"
- "id": "rongo-01-012-source-note-001-text"
  "section_id": "rongo-chapter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一說該章的句讀應作「禮之用，和爲貴；先王之道，斯爲美。小大由之，有所不行，知和而和，不以禮節之，亦不可行也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-01-013"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "有子曰：「信近於義，言可復也；恭近於禮，遠恥辱也。因不失其親，亦可宗也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "有子が言った。「正しい道にかなう約束なら、言ったことを実行できる。礼にかなう敬い方なら、恥や屈辱を遠ざけられる。頼る相手を選ぶとき、親しむべき人を見失わなければ、その人をよりどころにできる。」"
  "translation_status": "draft"
- "id": "rongo-01-014"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子食無求飽，居無求安，敏於事而愼於言，就有道而正焉：可謂好學也已。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "孔子が言った。「立派な人は、食事で満腹になることや、住まいの快適さばかりを求めない。仕事にはきびきび取り組み、言葉には慎重で、道を身につけた人のもとへ行って自分を正す。そういう人こそ、学ぶことを好むと言える。」"
  "translation_status": "draft"
- "id": "rongo-01-014-source-note-001-text"
  "section_id": "rongo-chapter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「也已矣」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-01-015"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢曰：「貧而無諂，富而無驕，何如？」子曰：「可也。未若貧而樂，富而好禮者也」。子貢曰：「《詩》云：『如切如磋，如琢如磨。』其斯之謂與？」子曰：「賜也，始可與言《詩》已矣！吿諸往而知來者。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "子貢が言った。「貧しくてもへつらわず、豊かでもおごらない。そんな人はいかがでしょう。」孔子が言った。「よいことだ。だが、貧しくても楽しみを持ち、豊かでも礼を好む人には、まだ及ばない。」子貢が言った。「『詩経』に、『切り整え、やすりをかけ、彫り刻み、磨き上げるように』とあります。今のお話は、このことでしょうか。」孔子が言った。「賜よ、お前とはようやく『詩経』を語り合えるようになったね。一つを話せば、その先まで理解してくれる。」"
  "translation_status": "draft"
- "id": "rongo-01-015-source-note-001-text"
  "section_id": "rongo-chapter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「貧而樂道」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-01-015-source-note-002-text"
  "section_id": "rongo-chapter-01"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「吿諸往而知來者也」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-01-016"
  "section_id": "rongo-chapter-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不患人之不己知，患不知人也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-01"
    "precision": "block"
    "anchor": "一之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%B8%E8%80%8C%E7%AC%AC%E4%B8%80&oldid=11118093#%E4%B8%80%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「人が自分を理解してくれないことを気に病むな。自分が人を理解していないことを気にかけよ。」"
  "translation_status": "draft"
- "id": "rongo-02-001"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「爲政以德，譬如北辰，居其所，而眾星共之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%B8%80"
  "translation_ja": "孔子が言った。「徳によって政治を行うのは、北極星がその場所にとどまり、ほかの星々がその周りを巡るようなものだ。」"
  "translation_status": "draft"
- "id": "rongo-02-002"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「詩三百，一言以蔽之，曰思無邪。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%BA%8C"
  "translation_ja": "孔子が言った。「『詩経』の三百篇を一言でまとめるなら、『思いによこしまなところがない』ということだ。」"
  "translation_status": "draft"
- "id": "rongo-02-003"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「道之以政，齊之以刑，民免而無恥；道之以德，齊之以禮，有恥且格。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「命令で民を導き、刑罰で行いをそろえれば、民は罰を逃れようとはするが、恥を知るようにはならない。徳で導き、礼によって行いを整えれば、恥を知り、自ら正しい道へ向かうようになる。」"
  "translation_status": "draft"
- "id": "rongo-02-003-source-note-001-text"
  "section_id": "rongo-chapter-02"
  "kind": "note_body"
  "origin": "source"
  "source_text": "侯乃峰根據傳世文獻與出土文獻中「恥」「止」二字相通認爲這裏的「恥」應讀爲「止」，訓爲「止度」「節度」。侯乃峰：《〈天子建州〉禮學字詞疏證三則》，《古籍研究》2013年第1期。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#cite_note-1"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-02-004"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「吾十有五而志于學；三十而立；四十而不惑；五十而知天命；六十而耳順；七十而從心所欲，不踰矩。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%9B%9B"
  "translation_ja": "孔子が言った。「私は十五歳で学ぶことを志し、三十歳で自分の足で立ち、四十歳で迷わなくなった。五十歳で天から与えられた務めを知り、六十歳で人の言葉を素直に受け止められるようになった。七十歳になると、心の望むままにしても、道を踏み外さなくなった。」"
  "translation_status": "draft"
- "id": "rongo-02-005"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孟懿子問孝。子曰：「無違。」樊遲御，子吿之曰：「孟孫問孝於我，我對曰：『無違。』」樊遲曰：「何謂也？」子曰：「生，事之以禮；死，葬之以禮，祭之以禮。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%BA%94"
  "translation_ja": "孟懿子が、親を大切にするとはどういうことか尋ねた。孔子は「背かないことだ」と答えた。のちに樊遅が車を御していたとき、孔子はこう話した。「孟孫が私に親への孝行について尋ねたので、『背かないことだ』と答えた。」樊遅が「どういう意味ですか」と尋ねると、孔子は言った。「親が生きている間は礼をもって仕え、亡くなったら礼にかなう葬り方をし、礼をもって祭るということだ。」"
  "translation_status": "draft"
- "id": "rongo-02-006"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孟武伯問孝。子曰：「父母，唯其疾之憂。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%85%AD"
  "translation_ja": "孟武伯が親への孝行について尋ねた。孔子は言った。「親に心配をかけるのは、自分の病気だけにしておきなさい。」"
  "translation_status": "draft"
- "id": "rongo-02-006-tn-001-text"
  "section_id": "rongo-chapter-02"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『父母、唯其疾之憂』は、親に余計な心配をかけないという意味に取った。親の病気をひたすら案じるという読み方もある。"
  "translation_status": "draft"
- "id": "rongo-02-007"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子游問孝。子曰：「今之孝者，是謂能養。至於犬馬，皆能有養。不敬，何以別乎？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%B8%83"
  "translation_ja": "子游が親への孝行について尋ねた。孔子は言った。「今では、親を養えることを孝行と呼んでいる。しかし、犬や馬にも食べ物を与えて養っているではないか。敬う心がなければ、どこに違いがあるだろう。」"
  "translation_status": "draft"
- "id": "rongo-02-008"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏問孝。子曰：「色難。有事，弟子服其勞；有酒食，先生饌。曾是以爲孝乎？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%85%AB"
  "translation_ja": "子夏が親への孝行について尋ねた。孔子は言った。「難しいのは、顔つきに心を表すことだ。用事があれば若い者が骨を折り、酒や食べ物があれば年長者に食べてもらう。それだけで孝行だと言えるだろうか。」"
  "translation_status": "draft"
- "id": "rongo-02-009"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「吾與回言終日，不違如愚。退而省其私，亦足以發。回也不愚。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子が言った。「回と一日中話していても、何も逆らわず、愚かなように見える。だが、私のもとを離れてからの振る舞いを見てみると、教えを十分に生かしている。回は愚かではない。」"
  "translation_status": "draft"
- "id": "rongo-02-010"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「視其所以，觀其所由，察其所安，人焉廋哉！人焉廋哉！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%8D%81"
  "translation_ja": "孔子が言った。「その人が何をしているかを見て、どんな道をたどってそうするのかを見つめ、何に心の落ち着きを得ているのかをよく察する。そうすれば、その人はどうして自分を隠せよう。どうして隠せようか。」"
  "translation_status": "draft"
- "id": "rongo-02-011"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「溫故而知新，可以爲師矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子が言った。「以前に学んだことを温め直して、新しいことを知る。そのような人なら、人の師になれる。」"
  "translation_status": "draft"
- "id": "rongo-02-012"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子不器。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "孔子が言った。「立派な人は、一つの用途にしか使えない器ではない。」"
  "translation_status": "draft"
- "id": "rongo-02-013"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢問君子。子曰：「先行其言，而後從之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "子貢が、立派な人とはどんな人か尋ねた。孔子は言った。「言おうとすることを、まず実行する。言葉はそのあとについてくるものだ。」"
  "translation_status": "draft"
- "id": "rongo-02-014"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子周而不比，小人比而不周。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "孔子が言った。「立派な人は広く人と交わり、仲間内だけで結びつかない。つまらない人は仲間内で結びつき、広く人と交わらない。」"
  "translation_status": "draft"
- "id": "rongo-02-015"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「學而不思則罔，思而不學則殆。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "孔子が言った。「学んでも考えなければ、はっきり理解できない。考えるばかりで学ばなければ、危ういところに陥る。」"
  "translation_status": "draft"
- "id": "rongo-02-016"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「攻乎異端，斯害也已。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「道から外れた教えにばかり取り組むのは、害になるだけだ。」"
  "translation_status": "draft"
- "id": "rongo-02-016-tn-001-text"
  "section_id": "rongo-chapter-02"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『攻乎異端』の意味は確定していない。ここでは異なる教説を専ら学ぶという読みを採ったが、異説を攻撃することへの戒めとする読みなどもある。"
  "translation_status": "draft"
- "id": "rongo-02-017"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「由，誨女知之乎！知之爲知之，不知爲不知，是知也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "孔子が言った。「由よ、知るとはどういうことか教えよう。知っていることは知っているとし、知らないことは知らないとする。それが知るということだ。」"
  "translation_status": "draft"
- "id": "rongo-02-018"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張學干祿。子曰：「多聞闕疑，愼言其餘，則寡尤；多見闕殆，愼行其餘，則寡悔。言寡尤，行寡悔，祿在其中矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "子張は、役人になって俸禄を得るための学び方を知ろうとした。孔子は言った。「多く聞き、疑わしいことは保留にして、残りについても慎重に話せば、とがめられることが少なくなる。多く見て、危ういことは避け、残りについても慎重に行動すれば、後悔が少なくなる。言葉に落ち度が少なく、行いに後悔が少なければ、俸禄を得る道もその中にある。」"
  "translation_status": "draft"
- "id": "rongo-02-019"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "哀公問曰：「何爲則民服？」孔子對曰：「擧直錯諸枉，則民服；擧枉錯諸直，則民不服。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "哀公が尋ねた。「どうすれば民は従うだろうか。」孔子が答えた。「まっすぐな人を取り立て、曲がった人の上に置けば、民は従います。曲がった人を取り立て、まっすぐな人の上に置けば、民は従いません。」"
  "translation_status": "draft"
- "id": "rongo-02-020"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季康子問：「使民敬忠以勸，如之何？」子曰：「臨之以莊，則敬；孝慈，則忠；擧善而教不能，則勸。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "季康子が尋ねた。「民が敬意を持ち、忠実に働き、励むようにするには、どうすればよいか。」孔子が答えた。「あなたが厳かな態度で接すれば、民は敬います。親を大切にし、人々に慈しみを持てば、民は忠実になります。優れた人を取り立て、できない人には教えれば、民は励むようになります。」"
  "translation_status": "draft"
- "id": "rongo-02-021"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "或謂孔子曰：「子奚不爲政？」子曰：「《書》云：『孝乎惟孝，友於兄弟。』施於有政，是亦爲政，奚其爲爲政？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "ある人が孔子に言った。「なぜ政治に携わらないのですか。」孔子は答えた。「『書経』に、『親を大切にし、兄弟と仲よくする』とある。その心を政治へも及ぼすなら、これも政治を行うことではないか。なぜ、役人になることだけが政治を行うことなのだろう。」"
  "translation_status": "draft"
- "id": "rongo-02-021-tn-001-text"
  "section_id": "rongo-chapter-02"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『書経』からの引用がどこまで続くかには、句読点の付け方による違いがある。ここでは底本に従い、『兄弟と仲よくする』までを引用とした。"
  "translation_status": "draft"
- "id": "rongo-02-021-source-note-001-text"
  "section_id": "rongo-chapter-02"
  "kind": "note_body"
  "origin": "source"
  "source_text": "也有點作「《書》云：『孝乎惟孝，友於兄弟，施於有政。』」的。今本《尚書·周書·君陳篇》有「惟孝友於兄弟，克施有政」的文字，但通常認爲這是後人作的偽古文。由於原典早已失傳，此處無法判定引用究竟在何處終止。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-02-021-source-note-002-text"
  "section_id": "rongo-chapter-02"
  "kind": "note_body"
  "origin": "source"
  "source_text": "一作「是亦爲政也」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "page"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": null
  "translation_status": "pending"
  "translation_required": false
- "id": "rongo-02-022"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「人而無信，不知其可也。大車無輗，小車無軏，其何以行之哉？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "孔子が言った。「人に信頼がなければ、どうやってやっていけるのか、私には分からない。牛車にも馬車にも、くびきをつなぎ留める部品がなければ、どうして進めるだろうか。」"
  "translation_status": "draft"
- "id": "rongo-02-023"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子張問：「十世可知也？」子曰：「殷因於夏禮，所損益可知也；周因於殷禮，所損益可知也；其或繼周者，雖百世可知也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "子張が尋ねた。「十代先の王朝がどうなるか、分かるでしょうか。」孔子は言った。「殷は夏の礼を受け継いだ。何を省き、何を付け加えたかは分かる。周は殷の礼を受け継いだ。何を省き、何を付け加えたかは分かる。周を受け継ぐ王朝があるなら、百代先であっても、このように見通せるのだ。」"
  "translation_status": "draft"
- "id": "rongo-02-024"
  "section_id": "rongo-chapter-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「非其鬼而祭之，諂也。見義不爲，無勇也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-02"
    "precision": "block"
    "anchor": "二之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E7%88%B2%E6%94%BF%E7%AC%AC%E4%BA%8C&oldid=11118094#%E4%BA%8C%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "孔子が言った。「自分が祭るべきでない霊を祭るのは、へつらいだ。正しいと分かっていながら行わないのは、勇気がないのだ。」"
  "translation_status": "draft"
- "id": "rongo-03-001"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孔子謂季氏：「八佾舞於庭。是可忍也，孰不可忍也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%B8%80"
  "translation_ja": "孔子は季氏のことをこう言った。「自分の屋敷の庭で、八列もの舞を舞わせるとは。こんなことまで平気でするなら、いったい何をせずにいるだろう。」"
  "translation_status": "draft"
- "id": "rongo-03-001-tn-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "八佾は八人ずつ八列に並ぶ舞で、天子の儀礼とされた。ここでは大夫である季氏が、その形式を用いたことを非難している。"
  "translation_status": "draft"
- "id": "rongo-03-002"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "三家者，以雍徹。子曰：「『相維辟公，天子穆穆。』奚取於三家之堂？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%BA%8C"
  "translation_ja": "魯の三家は、祭りの供え物を下げるときに『雍』の歌を歌わせた。孔子は言った。「『諸侯が祭りを助け、天子は厳かに立つ』という歌だ。三家の屋敷の広間に、どこが当てはまるのだろう。」"
  "translation_status": "draft"
- "id": "rongo-03-003"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「人而不仁，如禮何？人而不仁，如樂何？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「人に仁の心がなければ、礼をどう扱えるだろう。人に仁の心がなければ、音楽をどう扱えるだろう。」"
  "translation_status": "draft"
- "id": "rongo-03-004"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "林放問禮之本。子曰：「大哉問！禮，與其奢也，寧儉；喪，與其易也，寧戚。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%9B%9B"
  "translation_ja": "林放が礼の根本を尋ねた。孔子は言った。「大切な問いだ。礼は、ぜいたくにするくらいなら質素なほうがよい。葬儀は、手際よく整えるだけなら、むしろ心から悲しむほうがよい。」"
  "translation_status": "draft"
- "id": "rongo-03-005"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「夷狄之有君，不如諸夏之亡也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%BA%94"
  "translation_ja": "孔子が言った。「東や北の異民族に君主がいても、中原の国々に君主がいない状態には及ばない。」"
  "translation_status": "draft"
- "id": "rongo-03-005-tn-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "中原の礼の文化を評価する読み方に沿った訳。異民族にも君主がいるのに中原では君臣の秩序が失われている、という嘆きと取る読みもある。『夷狄』『諸夏』は当時の文化的・政治的な区分。"
  "translation_status": "draft"
- "id": "rongo-03-006"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "季氏旅於泰山。子謂冉有曰：「女弗能救與？」對曰：「不能。」子曰：「嗚呼！曾謂泰山不如林放乎？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%85%AD"
  "translation_ja": "季氏が泰山で祭りを行った。孔子は冉有に言った。「お前には、それを止められなかったのか。」冉有が「できませんでした」と答えると、孔子は言った。「ああ、泰山の神が林放ほどにも礼を知らないとでもいうのか。」"
  "translation_status": "draft"
- "id": "rongo-03-006-tn-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "季氏の身分では行うべきでない祭りだという批判。林放はこの篇の第四章で、礼の根本を尋ねている。"
  "translation_status": "draft"
- "id": "rongo-03-007"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子無所爭，必也射乎！揖讓而升，下而飮，其爭也君子。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%B8%83"
  "translation_ja": "孔子が言った。「立派な人は争わない。どうしても競うなら、弓の競技だろう。互いに礼をし、譲り合って射場に上り、下りてから酒を飲む。その競い方にも、立派な人のあり方が表れる。」"
  "translation_status": "draft"
- "id": "rongo-03-008"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子夏問曰：「『巧笑倩兮，美目盼兮，素以爲絢兮。』何謂也？」子曰：「繪事後素。」曰：「禮後乎？」子曰：「起予者商也，始可與言《詩》已矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%85%AB"
  "translation_ja": "子夏が尋ねた。「『笑う口元は愛らしく、目元は美しい。白い素地があってこそ、彩りが映える』とは、どういう意味でしょう。」孔子が答えた。「絵の彩色は、白い素地があってこそできるということだ。」子夏が「礼も、心の素地ができたあとに来るのでしょうか」と言うと、孔子は言った。「商よ、私に気づかせてくれるのはお前だ。これで『詩経』を語り合えるね。」"
  "translation_status": "draft"
- "id": "rongo-03-008-tn-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『繪事後素』は、白い素地を先に整えてから彩色するという読みを採った。彩色のあとに白色で仕上げるという読みもある。"
  "translation_status": "draft"
- "id": "rongo-03-009"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「夏禮，吾能言之，杞不足徵也；殷禮，吾能言之，宋不足徵也。文獻不足故也，足，則吾能徵之矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子が言った。「夏の礼について、私は語ることができる。だが、杞の国にはそれを裏づけるものが足りない。殷の礼についても語れるが、宋の国には裏づけるものが足りない。文書も、伝承を知る人も不足しているからだ。それらが十分にあれば、確かめられるのだが。」"
  "translation_status": "draft"
- "id": "rongo-03-010"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「禘自既灌而往者，吾不欲觀之矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%8D%81"
  "translation_ja": "孔子が言った。「禘の祭りは、最初に酒を地へ注ぐ儀式が終わったあとは、もう見たくない。」"
  "translation_status": "draft"
- "id": "rongo-03-010-tn-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "禘は祖先を祭る大祭。この言葉が祭りのどの不適切さを指すのか、本文だけでは明示されていない。"
  "translation_status": "draft"
- "id": "rongo-03-011"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "或問「禘」之說。子曰：「不知也。知其說者之於天下也，其如示諸斯乎？」指其掌。"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "ある人が禘の祭りの意味を尋ねた。孔子は言った。「私は知らない。それを理解する人にとって、天下を治めることは、ここにあるものを見るようなものだろう。」そう言って、自分の手のひらを指さした。"
  "translation_status": "draft"
- "id": "rongo-03-012"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "祭如在，祭神如神在。子曰：「吾不與祭，如不祭。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "祖先を祭るときは、そこに祖先がいるかのようにし、神を祭るときは、そこに神がいるかのようにした。孔子は言った。「自分で祭りに加わらなければ、祭らなかったのと同じだ。」"
  "translation_status": "draft"
- "id": "rongo-03-013"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "王孫賈問曰：「『與其媚於奧，寧媚於竈。』何謂也？」子曰：「不然。獲罪於天，無所禱也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "王孫賈が尋ねた。「『部屋の奥の神に取り入るより、かまどの神に取り入るほうがよい』とは、どういう意味でしょう。」孔子は言った。「そういうものではない。天に背いて罪を得れば、祈る相手などどこにもいない。」"
  "translation_status": "draft"
- "id": "rongo-03-014"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「周監於二代，郁郁乎文哉！吾從周。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "孔子が言った。「周は、夏と殷の二つの王朝を手本にしている。その文化のなんと豊かなことか。私は周に従う。」"
  "translation_status": "draft"
- "id": "rongo-03-015"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子入太廟，每事問。或曰：「孰謂鄹人之子知禮乎？入太廟，每事問。」子聞之曰：「是禮也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "孔子は太廟に入ると、何事も一つずつ尋ねた。ある人が言った。「鄹の人の息子が礼を知っているなどと、誰が言ったのだ。太廟に入って、何でも尋ねているではないか。」孔子はそれを聞いて言った。「そうすることが、礼なのだ。」"
  "translation_status": "draft"
- "id": "rongo-03-015-tn-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "太廟は国の始祖を祭る廟。鄹の人の息子とは孔子を指す。"
  "translation_status": "draft"
- "id": "rongo-03-016"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「射不主皮，爲力不同科，古之道也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「弓の競技では、的の皮を射抜くことを第一にしない。人の力には違いがあるからだ。それが昔からの道である。」"
  "translation_status": "draft"
- "id": "rongo-03-017"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢欲去吿朔之餼羊。子曰：「賜也！爾愛其羊，我愛其禮。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "子貢は、月の初めを告げる祭りに供える生きた羊をやめようとした。孔子は言った。「賜よ、お前は羊を惜しむ。私は、その礼が失われることを惜しむのだ。」"
  "translation_status": "draft"
- "id": "rongo-03-018"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「事君盡禮，人以爲諂也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "孔子が言った。「君主に仕えるときに礼を尽くすと、人はへつらいだと思う。」"
  "translation_status": "draft"
- "id": "rongo-03-019"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "定公問：「君使臣，臣事君，如之何？」孔子對曰：「君使臣以禮，臣事君以忠。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "定公が尋ねた。「君主が臣下を使い、臣下が君主に仕えるには、どうあるべきか。」孔子が答えた。「君主は礼をもって臣下を使い、臣下は真心を尽くして君主に仕えるべきです。」"
  "translation_status": "draft"
- "id": "rongo-03-020"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「《關雎》，樂而不淫，哀而不傷。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "孔子が言った。「『関雎』の詩は、楽しみが度を越さず、悲しみも心を傷つけるほどにはならない。」"
  "translation_status": "draft"
- "id": "rongo-03-021"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "哀公問社於宰我。宰我對曰：「夏后氏以松，殷人以柏，周人以栗。曰：『使民戰栗。』」子聞之，曰：「成事不說，遂事不諫，既往不咎。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "哀公が宰我に、土地の神の祭壇に用いる木について尋ねた。宰我は答えた。「夏の王朝は松を、殷の人々は柏を、周の人々は栗を使いました。『民を戦慄させるため』だといいます。」孔子はこれを聞いて言った。「すでに済んだことは説き立てず、やり遂げられたことは諫めず、過ぎたことは責めないものだ。」"
  "translation_status": "draft"
- "id": "rongo-03-021-tn-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『栗』と『戦慄』の『慄』の音を結びつけた説明がなされている。柏はここでは古代中国でいう針葉樹で、日本のカシワとは異なる。"
  "translation_status": "draft"
- "id": "rongo-03-022"
  "section_id": "rongo-chapter-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「管仲之器小哉！」或曰：「管仲儉乎？」曰：「管氏有三歸，官事不攝，焉得儉？」「然則管仲知禮乎？」曰：「邦君樹塞門，管氏亦樹塞門。邦君爲兩君之好，有反坫，管氏亦有反坫。管氏而知禮，孰不知禮？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-03"
    "precision": "block"
    "anchor": "三之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%85%AB%E4%BD%BE%E7%AC%AC%E4%B8%89&oldid=2200702#%E4%B8%89%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "孔子が言った。「管仲の器は小さいな。」ある人が「管仲は倹約家だったのでしょうか」と尋ねた。孔子は答えた。「管氏には三帰があり、家臣たちにも仕事を兼任させていない。どうして倹約家と言えるだろう。」その人が「では、管仲は礼を知っていたのでしょうか」と尋ねると、孔子は言った。「国の君主は門の内側に目隠しの塀を設けるが、管氏も設けていた。君主がほかの君主をもてなすときには、杯を返すための台を置くが、管氏も置いていた。管氏が礼を知っているというのなら、いったい誰が礼を知らないだろう。」"
  "translation_status": "draft"
- "id": "rongo-03-022-tn-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "『三帰』が何を指すかは定まらず、台の名や三人の妻などとする説があるため、名称をそのまま残した。"
  "translation_status": "draft"
- "id": "rongo-03-022-source-note-001-text"
  "section_id": "rongo-chapter-03"
  "kind": "note_body"
  "origin": "source"
  "source_text": "部分版本兩句之間有「曰」字。"
  "source_languages":
  - "zh"
  "source_locations":

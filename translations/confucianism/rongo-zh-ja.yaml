  "translation_required": false
- "id": "rongo-13-019"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "樊遲問仁。子曰：「居處恭，執事敬，與人忠。雖之夷狄，不可棄也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "樊遅が仁について尋ねた。孔子は言った。「普段から慎み深くし、仕事には真剣に取り組み、人には真心を尽くすことだ。異民族の土地へ行っても、これらを捨ててはいけない。」"
  "translation_status": "draft"
- "id": "rongo-13-020"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢問曰：「何如斯可謂之『士』矣？」子曰：「行己有恥，使於四方，不辱君命；可謂『士』矣。」曰：「敢問其次。」曰：「宗族稱孝焉，鄉黨稱弟焉。」曰：「敢問其次。」曰：「言必信，行必果，硜硜然，小人哉，抑亦可以爲次矣。」曰：「今之從政者何如？」子曰：「噫！斗筲之人，何足算也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "子貢が尋ねた。「どのようであれば、一人前の士と呼べるでしょうか。」孔子は言った。「自分の行いに恥を知り、使者として各地へ行っても、君主の命を辱めない。それなら士と呼べる。」「その次はどうでしょう。」「一族には親孝行だと言われ、郷里では年長者を敬うと言われる人だ。」「さらにその次はどうでしょう。」「言ったことは必ず守り、始めたことは必ずやり遂げる。かたくなで器は小さいが、それでも次の段階には数えられるだろう。」「今、政治を行っている人々はいかがでしょう。」「ああ、升やかごほどの小さな器だ。数に入れるほどのこともない。」"
  "translation_status": "draft"
- "id": "rongo-13-021"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不得中行而與之，必也狂狷乎：狂者進取，狷者有所不爲也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "孔子が言った。「偏りのない道を行く人と共にできないなら、せめて志の大きい人か、自分を固く守る人と共にしたい。志の大きい人は進んで求め、自分を固く守る人には、どうしてもしないことがあるからだ。」"
  "translation_status": "draft"
- "id": "rongo-13-022"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「南人有言曰：『人而無恆，不可以作巫醫』。「善夫！『不恆其德，或承之羞』」子曰：「不占而已矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "孔子が言った。「南の人の言葉に、『人に変わらぬ心がなければ、祈祷師にも医者にもなれない』とある。よい言葉だ。『その徳を一定に保たなければ、恥を受けることもある。』」さらに言った。「占ってもらうまでもないことだ。」"
  "translation_status": "draft"
- "id": "rongo-13-022-tn-001-text"
  "section_id": "rongo-chapter-13"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "徳を一定に保つことについての句は『易』の引用。最後の言葉は、占う以前に行いを正すべきだという意味に取った。"
  "translation_status": "draft"
- "id": "rongo-13-023"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子和而不同，小人同而不和。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "孔子が言った。「立派な人は、調和しても、何でも同じにはしない。つまらない人は、何でも同じにしても、本当には調和しない。」"
  "translation_status": "draft"
- "id": "rongo-13-024"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢問曰：「鄉人皆好之，何如？」子曰：「未可也。」「鄉人皆惡之，何如？」子曰：「未可也。不如鄉人之善者好之，其不善者惡之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "子貢が尋ねた。「郷里の人みんなに好かれる人は、どうでしょう。」孔子は「それだけでは分からない」と答えた。「郷里の人みんなに嫌われる人は、どうでしょう。」「それだけでも分からない。郷里の善い人たちに好かれ、よくない人たちに嫌われるほうがよい。」"
  "translation_status": "draft"
- "id": "rongo-13-025"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子易事而難說也；說之不以道，不說也；及其使人也，器之。小人難事而易說也。說之雖不以道，說也；及其使人也，求備焉。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": "孔子が言った。「立派な人には仕えやすいが、機嫌を取るのは難しい。道に外れたやり方で喜ばせようとしても喜ばず、人を使うときには、その人の力に合った仕事を任せるからだ。つまらない人には仕えにくいが、機嫌を取るのは簡単だ。道に外れたやり方でも喜び、人を使うときには、何でもできることを求めるからだ。」"
  "translation_status": "draft"
- "id": "rongo-13-026"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子泰而不驕；小人驕而不泰。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之二六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%8C%E5%85%AD"
  "translation_ja": "孔子が言った。「立派な人は、ゆったりしていても、おごらない。つまらない人は、おごっていても、ゆったりしていない。」"
  "translation_status": "draft"
- "id": "rongo-13-027"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「剛毅木訥，近仁。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之二七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%8C%E4%B8%83"
  "translation_ja": "孔子が言った。「意志が強く、ねばり強く、飾り気がなく、口数が少ない。そうしたあり方は仁に近い。」"
  "translation_status": "draft"
- "id": "rongo-13-028"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路問曰：「何如斯可謂之『士』矣？」子曰：「切切偲偲、怡怡如也，可謂『士』矣。朋友切切偲偲，兄弟怡怡。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之二八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%8C%E5%85%AB"
  "translation_ja": "子路が尋ねた。「どのようであれば、一人前の士と呼べるでしょうか。」孔子は言った。「互いに励まし合い、和やかであることだ。友とは互いに励まし合い、兄弟とは和やかにする。それなら士と呼べる。」"
  "translation_status": "draft"
- "id": "rongo-13-029"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「善人教民七年，亦可以卽戎矣。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之二九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%BA%8C%E4%B9%9D"
  "translation_ja": "孔子が言った。「善い人が七年にわたって民を教えれば、戦いに臨ませることもできるだろう。」"
  "translation_status": "draft"
- "id": "rongo-13-030"
  "section_id": "rongo-chapter-13"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「以不教民戰，是謂棄之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-13"
    "precision": "block"
    "anchor": "十三之三十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E5%AD%90%E8%B7%AF%E7%AC%AC%E5%8D%81%E4%B8%89&oldid=11118102#%E5%8D%81%E4%B8%89%E4%B9%8B%E4%B8%89%E5%8D%81"
  "translation_ja": "孔子が言った。「教えていない民を戦わせるのは、民を見捨てるということだ。」"
  "translation_status": "draft"
- "id": "rongo-14-001"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "憲問「恥」。子曰：「邦有道，穀；邦無道，穀，恥也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%80"
  "translation_ja": "憲が恥について尋ねた。孔子は言った。「国に道が行われていても俸禄を受け取り、道が行われていなくても同じように受け取る。それは恥だ。」"
  "translation_status": "draft"
- "id": "rongo-14-002"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "「克、伐、怨、欲，不行焉，可以爲仁矣？」子曰：「可以爲難矣，仁則吾不知也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%8C"
  "translation_ja": "「人に勝とうとする心、自慢、恨み、欲を行いに表さなければ、仁と言えるでしょうか。」孔子は答えた。「難しいことを成し遂げているとは言える。だが、仁かどうかは分からない。」"
  "translation_status": "draft"
- "id": "rongo-14-003"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「士而懷居，不足以爲士矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%89"
  "translation_ja": "孔子が言った。「道を志す者が、安楽な暮らしばかり思っているなら、道を志す者とは呼べない。」"
  "translation_status": "draft"
- "id": "rongo-14-004"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「邦有道，危言危行；邦無道，危行言孫。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%9B%9B"
  "translation_ja": "孔子が言った。「国に道が行われているなら、言葉も行いもまっすぐにせよ。道が行われていないなら、行いはまっすぐにし、言葉は控えめにせよ。」"
  "translation_status": "draft"
- "id": "rongo-14-005"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「有德者必有言，有言者不必有德。仁者必有勇，勇者不必有仁。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%94"
  "translation_ja": "孔子が言った。「徳のある人には、必ずよい言葉がある。よい言葉を言う人に、必ず徳があるとは限らない。仁のある人には、必ず勇気がある。勇気のある人に、必ず仁があるとは限らない。」"
  "translation_status": "draft"
- "id": "rongo-14-006"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "南宮适問於孔子曰：「羿善射，奡盪舟，俱不得其死然。禹稷躬稼而有天下。」夫子不答。南宮适出，子曰：「君子哉若人！尙德哉若人！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%85%AD"
  "translation_ja": "南宮适が孔子に尋ねた。「羿は弓がうまく、奡は船を陸上で動かせるほどの力がありましたが、どちらも穏やかな死を迎えませんでした。禹と稷は自ら農作業に励み、天下を得ました。」孔子は答えなかった。南宮适が退出すると、孔子は言った。「立派な人だ、この人は。徳を重んじる人だ。」"
  "translation_status": "draft"
- "id": "rongo-14-007"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子而不仁者有矣夫！未有小人而仁者也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%83"
  "translation_ja": "孔子が言った。「立派な人であっても、仁に欠けることはあるだろう。だが、つまらない人のままで仁のある者は、いない。」"
  "translation_status": "draft"
- "id": "rongo-14-008"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「愛之，能勿勞乎？忠焉，能勿誨乎？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%85%AB"
  "translation_ja": "孔子が言った。「人を愛していて、その人に苦労をさせずにいられるだろうか。真心を尽くしていて、教えずにいられるだろうか。」"
  "translation_status": "draft"
- "id": "rongo-14-009"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「爲命，裨諶草創之，世叔討論之，行人子羽脩飾之，東里子產潤色之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B9%9D"
  "translation_ja": "孔子が言った。「鄭で外交の文書を作るときには、裨諶が下書きをし、世叔が検討し、外交を務める子羽が文章を整え、東里の子産が最後に磨きをかけた。」"
  "translation_status": "draft"
- "id": "rongo-14-010"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "或問子產，子曰：「惠人也。」問子西。曰：「彼哉彼哉！」問管仲。曰：「人也，奪伯氏騈邑三百，飯疏食，沒齒，無怨言。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%8D%81"
  "translation_ja": "ある人が子産について尋ねた。孔子は「人に恵みを与える人だ」と答えた。子西について尋ねると、「あの人か、あの人か」とだけ言った。管仲について尋ねると、こう答えた。「あの人は、伯氏から駢の邑の三百戸を取り上げた。伯氏は粗末な飯で暮らすことになったが、一生、恨み言を口にしなかった。」"
  "translation_status": "draft"
- "id": "rongo-14-011"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「貧而無怨，難；富而無驕，易。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之十一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%B8%80"
  "translation_ja": "孔子が言った。「貧しくて恨まないのは難しい。豊かでおごらないのは、比較的たやすい。」"
  "translation_status": "draft"
- "id": "rongo-14-012"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「孟公綽，爲趙、魏老則優，不可以爲滕、薛大夫。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之十二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%BA%8C"
  "translation_ja": "孔子が言った。「孟公綽は、趙家や魏家の家老なら十分に務まる。だが、滕や薛の国の大夫を務めることはできない。」"
  "translation_status": "draft"
- "id": "rongo-14-013"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路問成人。子曰：「若臧武仲之知，公綽之不欲，卞莊子之勇，冉求之藝，文之以禮樂，亦可以爲成人矣！」曰：「今之成人者，何必然？見利思義，見危授命，久要不忘平生之言，亦可以爲成人矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之十三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%B8%89"
  "translation_ja": "子路が、完成された人について尋ねた。孔子は言った。「臧武仲の知恵、公綽の無欲さ、卞荘子の勇気、冉求の多才さを備え、それを礼や音楽で整えれば、完成された人と呼べるだろう。」さらに言った。「だが、今、完成された人というなら、そこまで求める必要があろうか。利益を見たら正しさを考え、危険を見たら命を差し出し、長い苦境にあっても、以前に交わした言葉を忘れない。それでも完成された人と呼べるだろう。」"
  "translation_status": "draft"
- "id": "rongo-14-014"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子問公叔文子於公明賈，曰：「信乎？夫子不言不笑不取乎？」公明賈對曰：「以吿者過也！夫子時然後言，人不厭其言；樂然後笑，人不厭其笑；義然後取，人不厭其取。」子曰：「其然！豈其然乎？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之十四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%8D%81%E5%9B%9B"
  "translation_ja": "孔子は公明賈に、公叔文子のことを尋ねた。「あの人は話さず、笑わず、物を受け取らないというのは、本当ですか。」公明賈は答えた。「伝えた人が大げさにしたのです。あの方は話すべきときに話すので、人はその言葉を嫌いません。楽しいときに笑うので、人はその笑いを嫌いません。道理にかなうときに受け取るので、人はその受け取り方を嫌いません。」孔子は言った。「そうなのですか。本当にそうなのですか。」"
  "translation_status": "draft"
- "id": "rongo-14-015"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「臧武仲以防，求爲後於魯，雖曰不要君，吾不信也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之十五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%BA%94"
  "translation_ja": "孔子が言った。「臧武仲は防の邑を押さえたまま、魯に自分の後継ぎを立ててほしいと求めた。君主を脅してはいないと言っても、私は信じない。」"
  "translation_status": "draft"
- "id": "rongo-14-016"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「晉文公譎而不正，齊桓公正而不譎。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之十六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%8D%81%E5%85%AD"
  "translation_ja": "孔子が言った。「晋の文公は策略に頼って、まっすぐではなかった。斉の桓公はまっすぐで、策略に頼らなかった。」"
  "translation_status": "draft"
- "id": "rongo-14-017"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路曰：「桓公殺公子糾，召忽死之，管仲不死。」曰：「未仁乎？」子曰：「桓公九合諸侯，不以兵車，管仲之力也。如其仁！如其仁！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之十七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%B8%83"
  "translation_ja": "子路が言った。「桓公が公子糾を殺したとき、召忽は殉死しましたが、管仲は死にませんでした。仁に欠けていたのではないでしょうか。」孔子は言った。「桓公が何度も諸侯を集め、軍事力によらずにまとめられたのは、管仲の力だ。それこそ仁ではないか。それこそ仁ではないか。」"
  "translation_status": "draft"
- "id": "rongo-14-018"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢曰：「管仲非仁者與？桓公殺公子糾，不能死，又相之。」子曰：「管仲相桓公，霸諸侯，一匡天下，民到于今受其賜；微管仲，吾其被髮左衽矣！豈若匹夫匹婦之爲諒也，自經於溝瀆，而莫之知也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之十八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%8D%81%E5%85%AB"
  "translation_ja": "子貢が言った。「管仲は仁のある人ではなかったのでしょうか。桓公が公子糾を殺したときに死なず、そのうえ桓公の宰相になりました。」孔子は言った。「管仲は桓公を助けて諸侯の盟主にし、天下をまとめて正した。民は今に至るまで、その恩恵を受けている。管仲がいなければ、私たちは髪をほどき、衣を左前に合わせるようになっていただろう。どうして、小さな義理立てにこだわり、溝のそばで首をつって、誰にも知られずに終わる男女のようであればよいのか。」"
  "translation_status": "draft"
- "id": "rongo-14-018-tn-001-text"
  "section_id": "rongo-chapter-14"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "髪をほどき、衣を左前にするのは、当時の中国から見た周辺民族の習俗を指す。孔子はここで、個人的な殉死よりも広く民を守った功績を評価している。"
  "translation_status": "draft"
- "id": "rongo-14-019"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "公叔文子之臣大夫僎，與文子同升諸公。子聞之曰：「可以爲文矣！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之十九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E5%8D%81%E4%B9%9D"
  "translation_ja": "公叔文子の家臣だった僎は、大夫となり、文子と共に君主の朝廷へ上った。孔子はこれを聞いて言った。「それなら『文』というおくり名に値する。」"
  "translation_status": "draft"
- "id": "rongo-14-020"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子言衞靈公之無道也。康子曰：「夫如是，奚而不喪？」孔子曰：「仲叔圉治賓客，祝鮀治宗廟，王孫賈治軍旅。夫如是，奚其喪？」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之二十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%8C%E5%8D%81"
  "translation_ja": "孔子が衛の霊公の道に外れた行いについて話した。季康子が「それでは、どうして国が滅びないのでしょう」と尋ねると、孔子は答えた。「仲叔圉が賓客との応対を務め、祝鮀が宗廟を管理し、王孫賈が軍を治めている。それなら、どうして国が滅びるでしょう。」"
  "translation_status": "draft"
- "id": "rongo-14-021"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「其言之不怍，則爲之也難！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之二一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%8C%E4%B8%80"
  "translation_ja": "孔子が言った。「自分の言葉に恥じるところがないほど大きく出ると、それを実行するのは難しい。」"
  "translation_status": "draft"
- "id": "rongo-14-022"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "陳成子弒簡公。孔子沐浴而朝，吿於哀公曰：「陳恆弒其君，請討之。」公曰：「吿夫三子。」孔子曰：「以吾從大夫之後，不敢不吿也！君曰：『吿夫三子』者！」之三子吿，不可。孔子曰：「以吾從大夫之後，不敢不吿也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之二二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%8C%E4%BA%8C"
  "translation_ja": "陳成子が簡公を殺した。孔子は身を洗って朝廷へ行き、哀公に申し上げた。「陳恒が自分の君主を殺しました。討伐をお願いします。」哀公は「三家の人々に告げよ」と言った。孔子は言った。「私も大夫の末席に連なる者なので、申し上げずにはいられなかった。ところが君主は、『三家へ告げよ』とおっしゃるのか。」三家のもとへ行って告げたが、受け入れられなかった。孔子は言った。「私も大夫の末席に連なる者なので、申し上げずにはいられなかったのだ。」"
  "translation_status": "draft"
- "id": "rongo-14-023"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子路問事君，子曰：「勿欺也，而犯之。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之二三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%8C%E4%B8%89"
  "translation_ja": "子路が君主への仕え方を尋ねた。孔子は言った。「欺いてはいけない。だが、必要なら面と向かって逆らいなさい。」"
  "translation_status": "draft"
- "id": "rongo-14-024"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子上達，小人下達。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之二四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%8C%E5%9B%9B"
  "translation_ja": "孔子が言った。「立派な人は上へ向かって道を深め、つまらない人は下へ向かって物事に通じていく。」"
  "translation_status": "draft"
- "id": "rongo-14-025"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「古之學者爲己，今之學者爲人。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之二五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%8C%E4%BA%94"
  "translation_ja": "孔子が言った。「昔の人は、自分を育てるために学んだ。今の人は、人に見せるために学ぶ。」"
  "translation_status": "draft"
- "id": "rongo-14-026"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "蘧伯玉使人於孔子，孔子與之坐而問焉。曰：「夫子何爲？」對曰：「夫子欲寡其過而未能也。」使者出。子曰：「使乎！使乎！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之二六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%8C%E5%85%AD"
  "translation_ja": "蘧伯玉が孔子のもとへ使者を送った。孔子は使者を同席させて尋ねた。「ご主人は、何をしておられますか。」使者は答えた。「自分の過ちを少なくしたいと願っておりますが、まだ十分にできずにいます。」使者が出ていくと、孔子は言った。「よい使者だ。よい使者だ。」"
  "translation_status": "draft"
- "id": "rongo-14-027"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不在其位，不謀其政。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之二七"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%8C%E4%B8%83"
  "translation_ja": "孔子が言った。「その地位にいないなら、その地位の政務に口を出して策をめぐらすな。」"
  "translation_status": "draft"
- "id": "rongo-14-028"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "曾子曰：「君子思不出其位。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之二八"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%8C%E5%85%AB"
  "translation_ja": "曾子が言った。「立派な人は、自分の立場を越えて思いをめぐらさない。」"
  "translation_status": "draft"
- "id": "rongo-14-029"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子恥其言而過其行。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之二九"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%BA%8C%E4%B9%9D"
  "translation_ja": "孔子が言った。「立派な人は、言葉が行いを上回ることを恥じる。」"
  "translation_status": "draft"
- "id": "rongo-14-030"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「君子道者三，我無能焉：仁者不憂，知者不惑，勇者不懼。」子貢曰：「夫子自道也！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之三十"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%89%E5%8D%81"
  "translation_ja": "孔子が言った。「立派な人の道には三つあるが、私にはまだできていない。仁のある人は思い悩まず、知恵のある人は迷わず、勇気のある人は恐れない。」子貢は言った。「先生は、ご自身のことをおっしゃっているのです。」"
  "translation_status": "draft"
- "id": "rongo-14-031"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子貢方人。子曰：「賜也，賢乎哉？夫我則不暇！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之三一"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%89%E4%B8%80"
  "translation_ja": "子貢が人の優劣を比べていた。孔子は言った。「賜は、よほど立派なのだろうね。私には、そんな暇はない。」"
  "translation_status": "draft"
- "id": "rongo-14-032"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不患人之不己知，患其不能也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之三二"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%89%E4%BA%8C"
  "translation_ja": "孔子が言った。「人が自分を認めてくれないことを気に病むな。自分に力が足りないことを気にかけよ。」"
  "translation_status": "draft"
- "id": "rongo-14-033"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「不逆詐，不億不信，抑亦先覺者，是賢乎！」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之三三"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%89%E4%B8%89"
  "translation_ja": "孔子が言った。「初めから人がだますと決めつけず、不誠実だと推測もしない。それでいて、実際には早く気づける人こそ、優れているのだろう。」"
  "translation_status": "draft"
- "id": "rongo-14-034"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "微生畝謂孔子曰：「丘，何爲是栖栖者與？無乃爲佞乎？」孔子曰：「非敢爲佞也，疾固也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之三四"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%89%E5%9B%9B"
  "translation_ja": "微生畝が孔子に言った。「丘よ、どうしてそんなに忙しく世を渡り歩くのだ。口先で取り入ろうとしているのではないか。」孔子は答えた。「口先で取り入ろうとしているのではありません。かたくなに閉じこもることを嫌っているのです。」"
  "translation_status": "draft"
- "id": "rongo-14-035"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "子曰：「驥不稱其力，稱其德也。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之三五"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%89%E4%BA%94"
  "translation_ja": "孔子が言った。「名馬がたたえられるのは、その力ではない。そのよい性質なのだ。」"
  "translation_status": "draft"
- "id": "rongo-14-036"
  "section_id": "rongo-chapter-14"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "或曰：「以德報怨，何如？」子曰：「何以報德？以德報怨，以德報德。」"
  "source_languages":
  - "zh"
  "source_locations":
  - "source_id": "zh-wikisource-rongo-14"
    "precision": "block"
    "anchor": "十四之三六"
    "url": "https://zh.wikisource.org/w/index.php?title=%E8%AB%96%E8%AA%9E/%E6%86%B2%E5%95%8F%E7%AC%AC%E5%8D%81%E5%9B%9B&oldid=11118101#%E5%8D%81%E5%9B%9B%E4%B9%8B%E4%B8%89%E5%85%AD"
  "translation_ja": "ある人が言った。「恨みに恩徳で報いるのは、どうでしょう。」孔子は言った。「それなら、恩徳には何で報いるのか。恨みには徳をもって報い、恩徳にも徳をもって報いる。」"
  "translation_status": "draft"
- "id": "rongo-14-036-tn-001-text"
  "section_id": "rongo-chapter-14"
  "kind": "note_body"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "底本は後半の『以直報怨』の『直』を『德』に改めているため、問いと答えが同じ語になる。広く伝わる『直』を読む場合は、『恨みには公正さで報い、恩徳には恩徳で報いる』という意味になる。ここでは底本の校訂を訳文に示し、異文をこの注に残した。"
  "translation_status": "draft"
- "id": "rongo-14-036-source-note-001-text"
  "section_id": "rongo-chapter-14"
  "kind": "note_body"
  "origin": "source"

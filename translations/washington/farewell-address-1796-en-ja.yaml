      "source_text": "Against the insidious wiles of foreign influence (I conjure you to believe me, fellow citizens) the jealousy of a free people ought to be constantly awake, since history and experience prove that foreign influence is one of the most baneful foes of republican government. But that jealousy to be useful must be impartial; else it becomes the instrument of the very influence to be avoided, instead of a defense against it. Excessive partiality for one foreign nation and excessive dislike of another cause those whom they actuate to see danger only on one side, and serve to veil and even second the arts of influence on the other. Real patriots, who may resist the intrigues of the favorite, are liable to become suspected and odious, while its tools and dupes usurp the applause and confidence of the people to surrender their interests.",

      "source_text": "But these considerations, however powerfully they address themselves to your sensibility, are greatly outweighed by those which apply more immediately to your interest. Here every portion of our country finds the most commanding motives for carefully guarding and preserving the Union of the whole.",
      "translation_ja": "こうしたことがどれほど強く胸を打とうと、皆さんの利害にもっと直接関わる理由の方が、はるかに重いのです。そこに目を向ければ、わが国のどの地域にも、連邦全体を注意深く守り通すべき、何にもまして切実な理由があります。",

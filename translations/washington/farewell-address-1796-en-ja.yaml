          "printed_page": "16",
          "printed_page_end": "16",
          "pdf_page": 19,
          "pdf_page_end": 19,
          "source_sequence": 23
        }
      ],
      "source_text": "This spirit, unfortunately, is inseparable from our nature, having its root in the strongest passions of the human mind. It exists under different shapes in all governments, more or less stifled, controlled, or repressed; but in those of the popular form it is seen in its greatest rankness and is truly their worst enemy.",

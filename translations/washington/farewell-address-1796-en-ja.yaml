      "source_text": "As a very important source of strength and security, cherish public credit. One method of preserving it is to use it as sparingly as possible, avoiding occasions of expense by cultivating peace, but remembering also that timely disbursements to prepare for danger frequently prevent much greater disbursements to repel it; avoiding likewise the accumulation of debt, not only by shunning occasions of expense, but by vigorous exertions in time of peace to discharge the debts which unavoidable wars may have occasioned, not ungenerously throwing upon posterity the burden which we ourselves ought to bear. The execution of these maxims belongs to your representatives, but it is necessary that public opinion should cooperate. To facilitate to them the performance of their duty, it is essential that you should practically bear in mind that towards the payment of debts there must be revenue; that to have revenue there must be taxes; that no taxes can be devised which are not more or less inconvenient and unpleasant; that the intrinsic embarrassment inseparable from the selection of the proper objects (which is always a choice of difficulties) ought to be a decisive motive for a candid construction of the conduct of the government in making it, and for a spirit of acquiescence in the measures for obtaining revenue which the public exigencies may at any time dictate.",
      "translation_ja": "国の力と安全の大きな源として、国の信用を大切にしてください。それを守る一つの道は、借り入れに頼ることをなるべく控えることです。平和を育てて出費の必要を避けつつも、危険に備えた適時の支出は、実際にこれを退けるためのはるかに大きな支出をしばしば防ぐ、と覚えておきましょう。また、支出の機会を避けるだけでなく、やむをえない戦争で生じた負債は平時のうちに力を尽くして返済し、債務を積み上げないことです。私たち自身が負うべきものを、後世の人々にむごくも押しつけてはなりません。これらの方針を実行するのは皆さんの代表ですが、世論の協力も必要です。その務めを果たしやすくするため、次のことを実際の問題として心にとめてください。借金を返すには歳入が要り、歳入を得るには税が要ります。多少とも不便や不快を伴わない税は、考え出しようがありません。何に課税するかを決める仕事にはもともと避けられない難しさがあり、選べるのはつねに難しい道ばかりです。そのことこそ、政府が何を選んだかを公正に受け止め、その時々の公共の必要が求める歳入確保の施策を、進んで受け入れる十分な理由となるべきです。",

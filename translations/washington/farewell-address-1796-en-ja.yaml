      "source_text": "Of all the dispositions and habits which lead to political prosperity, religion and morality are indispensable supports. In vain would that man claim the tribute of patriotism who should labor to subvert these great pillars of human happiness, these firmest props of the duties of men and citizens. The mere politician, equally with the pious man, ought to respect and to cherish them. A volume could not trace all their connections with private and public felicity. Let it simply be asked where is the security for property, for reputation, for life, if the sense of religious obligation desert the oaths, which are the instruments of investigation in courts of justice? And let us with caution indulge the supposition that morality can be maintained without religion. Whatever may be conceded to the influence of refined education on minds of peculiar structure, reason and experience both forbid us to expect that national morality can prevail in exclusion of religious principle.",
      "translation_ja": "政治の繁栄に通じるあらゆる心構えや習慣のうち、宗教と道徳は欠かすことのできない支えです。人類の幸福を支えるこの大きな柱を、人として、また市民としての務めを支えるこの確かなよりどころを、壊そうとしながら愛国者の誉れを求めても、むなしいことです。信心深い人ばかりでなく、純粋に政治の立場から考える人も、これらを尊び、大切にすべきです。個人の幸福、社会の幸福との結びつきは、一冊の書物でも書き尽くせません。そこで一つだけ尋ねましょう。裁判所が真実を調べる手だてである宣誓から、信仰に基づく責任感が失われれば、財産や名誉や生命は何によって守られるのでしょう。道徳は宗教なしでも保てるという想定を、安易に受け入れないようにしましょう。特別な資質を備えた人の心に優れた教育が及ぼす力をどれほど認めるにせよ、国民全体の道徳が信仰の原理を抜きにして行き渡ると期待することは、理性のうえからも経験のうえからもできません。",

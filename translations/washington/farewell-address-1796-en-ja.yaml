          "pdf_page": 11,
          "pdf_page_end": 12,
          "source_sequence": 15
        }
      ],
      "source_text": "The North, in an unrestrained intercourse with the South, protected by the equal laws of a common government, finds in the productions of the latter great additional resources of maritime and commercial enterprise and precious materials of manufacturing industry. The South in the same intercourse, benefitting by the agency of the North, sees its agriculture grow and its commerce expand. Turning partly into its own channels the seamen of the North, it finds its particular navigation invigorated; and while it contributes, in different ways, to nourish and increase the general mass of the national navigation, it looks forward to the protection of a maritime strength to which itself is unequally adapted. The East, in a like intercourse with the West, already finds, and in the progressive improvement of interior communications by land and water will more and more find a valuable vent for the commodities which it brings from abroad or manufactures at home. The West derives from the East supplies requisite to its growth and comfort—and what is perhaps of still greater consequence, it must of necessity owe the secure enjoyment of indispensable outlets for its own productions to the weight, influence, and the future maritime strength of the Atlantic side of the Union, directed by an indissoluble community of interest as one nation. Any other tenure by which the West can hold this essential advantage, whether derived from its own separate strength or from an apostate and unnatural connection with any foreign power, must be intrinsically precarious.",
      "translation_ja": "北部は、共通の政府の公平な法律に守られて南部と自由に取引することで、その産物から海運と商業を営む豊かな資源を新たに得、製造業に貴重な原料を手に入れています。南部は同じ取引を通じて北部の仲立ちにあずかり、農業を育て、商業を広げています。北部の船乗りの一部を自分たちの航路に迎えて、独自の海運も活気づきます。さまざまな形で国全体の海運力を養い、大きくする一方、南部だけでは北部ほど容易に築けない海上の力に、将来守られることも期待できます。東部は同じように西部との取引によって、輸入品にも自らの製品にも有力な販路をすでに見いだしています。内陸の陸路と水路が整うにつれ、その販路はさらに広がるでしょう。西部は成長と快適な暮らしに必要な物資を東部から得ています。それにもまして大切なのは、自分たちの産物を運び出すのに欠かせない出口を安心して使えることです。これも結局、一国として切り離せない共通の利益に導かれる大西洋沿岸諸州の重み、影響力、そして将来の海上の力にかかっています。この肝心の利点を、西部だけの力にせよ、仲間を見捨てて外国と結ぶ不自然な関係にせよ、ほかのよりどころに求めるなら、もとより不安定なものにしかなりません。",
      "translation_status": "reviewed"

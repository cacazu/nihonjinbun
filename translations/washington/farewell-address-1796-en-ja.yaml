          "printed_page": "31",
          "printed_page_end": "31",
          "pdf_page": 34,
          "pdf_page_end": 34,
          "source_sequence": 51
        }
      ],
      "source_text": "The inducements of interest for observing that conduct will best be referred to your own reflections and experience. With me, a predominant motive has been to endeavor to gain time to our country to settle and mature its yet recent institutions and to progress without interruption to that degree of strength and consistency which is necessary to give it, humanly speaking, the command of its own fortunes.",
      "translation_ja": "中立を守ることがどのような利益から勧められるかは、皆さんご自身の思索と経験にお任せするのがいちばんでしょう。私にとって大きな動機の一つは、わが国のために時間を得ることでした。まだ生まれて間もない諸制度が根づき、成熟する時間、そして人間にできる範囲で自らの運命を自ら決められるだけの力と堅実さを備えるまで、妨げられずに歩みを進める時間です。",
      "translation_status": "reviewed"
    },
    {
      "id": "wa-0052",
      "section_id": "address",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "senate",
          "precision": "page",
          "printed_page": "31",
          "printed_page_end": "32",
          "pdf_page": 34,
          "pdf_page_end": 35,
          "source_sequence": 52
        }
      ],
      "source_text": "Though in reviewing the incidents of my administration I am unconscious of intentional error, I am nevertheless too sensible of my defects not to think it probable that I may have committed many errors. Whatever they may be, I fervently beseech the Almighty to avert or mitigate the evils to which they may tend. I shall also carry with me the hope that my country will never cease to view them with indulgence and that, after forty-five years of my life dedicated to its service with an upright zeal, the faults of incompetent abilities will be consigned to oblivion, as myself must soon be to the mansions of rest.",
      "translation_ja": "自分の政権下の出来事を振り返り、故意に過ちを犯した覚えはありません。とはいえ自分の至らなさをよく知っていますから、多くの過ちを犯したかもしれないと思わずにはいられません。それが何であれ、そこから生じかねない害を退け、あるいは和らげてくださるよう、全能の神に心から願います。また、祖国がいつまでも寛大な目でそれらを見てくれることを望みながら去ります。生涯の四十五年をまっすぐな熱意で祖国に捧げてきたのですから、力不足による過ちは、やがて私自身が永い安息のすまいに赴くのと同じように、忘却に委ねられますように。",
      "translation_status": "reviewed"
    },
    {
      "id": "wa-0053",
      "section_id": "address",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "senate",
          "precision": "page",
          "printed_page": "32",
          "printed_page_end": "32",
          "pdf_page": 35,
          "pdf_page_end": 35,
          "source_sequence": 53
        }
      ],
      "source_text": "Relying on its kindness in this as in other things, and actuated by that fervent love towards it which is so natural to a man who views in it the native soil of himself and his progenitors for several generations, I anticipate with pleasing expectation that retreat, in which I promise myself to realize without alloy the sweet enjoyment of partaking in the midst of my fellow citizens the benign influence of good laws under a free government—the ever favorite object of my heart, and the happy reward, as I trust, of our mutual cares, labors and dangers.",
      "translation_ja": "このことでもほかのことでも祖国の慈しみを信頼しています。自分のみならず幾代もの祖先が生まれた土地をここに見る人間として、ごく自然な、燃えるような愛情につき動かされながら、私は退いた後の暮らしを楽しみに待っています。同じ市民の一人として皆さんのただ中に暮らし、自由な政府のもとで良い法律の恵みにあずかる。その喜びを何ものにも曇らされず味わえることを、心に期しております。それはいつも私が何より切に望んだことであり、私たちが共に担った心労、働き、そして危難に対する幸いな報いでもあると信じています。",
      "translation_status": "reviewed"
    },

      "source_text": "The alternate domination of one faction over another, sharpened by the spirit of revenge natural to party dissension, which in different ages and countries has perpetrated the most horrid enormities, is itself a frightful despotism. But this leads at length to a more formal and permanent despotism. The disorders and miseries which result gradually incline the minds of men to seek security and repose in the absolute power of an individual; and sooner or later the chief of some prevailing faction, more able or more fortunate than his competitors, turns this disposition to the purposes of his own elevation on the ruins of public liberty.",
      "translation_ja": "一つの徒党がもう一つを押さえつけ、今度は相手がこちらを押さえつける。党争につきものの復讐心がこれに拍車をかけ、いつの世にも、どこの国にも、恐ろしい非道が重ねられてきました。この支配の交代は、それ自体が恐るべき専制です。しかもついには、もっと制度の整った、恒久的な専制を招きます。そこから生まれる混乱と悲惨に疲れ、人々は次第に一人の人間の絶対権力に安全と休息を求めるようになります。遅かれ早かれ、優位に立った党派の首領のうち、競争相手に才で勝るか運に恵まれた者が、この気分を利用し、国民の自由を廃墟に変えて、その上に自分の地位を築くでしょう。",

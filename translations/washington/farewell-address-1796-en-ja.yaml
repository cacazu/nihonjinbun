          "pdf_page_end": 14,
          "source_sequence": 17
        }
      ],
      "source_text": "These considerations speak a persuasive language to every reflecting and virtuous mind and exhibit the continuance of the Union as a primary object of patriotic desire. Is there a doubt whether a common government can embrace so large a sphere? Let experience solve it. To listen to mere speculation in such a case were criminal. We are authorized to hope that a proper organization of the whole, with the auxiliary agency of governments for the respective subdivisions, will afford a happy issue to the experiment. It is well worth a fair and full experiment. With such powerful and obvious motives to union affecting all parts of our country, while experience shall not have demonstrated its impracticability, there will always be reason to distrust the patriotism of those who in any quarter may endeavor to weaken its bands.",
      "translation_ja": "よく考え、国のためを思う人なら、こうした事実に心を動かされ、連邦の存続を愛国者がまず願うべきことと認めるでしょう。一つの政府がこれほど広大な範囲を治められるか、疑いがありますか。経験に答えを出させましょう。この問題で単なる憶測に耳を傾けるのは罪なことです。国全体を適切に組織し、各地域の政府がそれぞれに支えれば、この試みが実を結ぶと期待するだけの理由があります。公正に、十分に試してみる価値があります。連邦を望む理由がこれほど明白で、国のどの地域にも切実である限り、そして連邦が成り立たないと経験が立証しない限り、どこの地域であれ、そのきずなを弱めようとする人の愛国心を疑う理由は、いつもあるのです。",

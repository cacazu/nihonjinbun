          "pdf_page_end": 28,
          "source_sequence": 35
        }
      ],
      "source_text": "So likewise, a passionate attachment of one nation for another produces a variety of evils. Sympathy for the favorite nation, facilitating the illusion of an imaginary common interest in cases where no real common interest exists and infusing into one the enmities of the other, betrays the former into a participation in the quarrels and wars of the latter, without adequate inducement or justification. It leads also to concessions to the favorite nation of privileges denied to others, which is apt doubly to injure the nation making the concessions, by unnecessarily parting with what ought to have been retained and by exciting jealousy, ill will, and a disposition to retaliate in the parties from whom equal privileges are withheld. And it gives to ambitious, corrupted, or deluded citizens (who devote themselves to the favorite nation) facility to betray or sacrifice the interests of their own country without odium, sometimes even with popularity, gilding with the appearances of a virtuous sense of obligation, a commendable deference for public opinion, or a laudable zeal for public good, the base or foolish compliances of ambition, corruption, or infatuation.",
      "translation_ja": "同じように、ある国が他国に寄せる熱烈な愛着も、さまざまな害を生みます。ひいきにする国への共感から、本当は共通の利益がないところにもそれがあると思い込み、相手国の敵を自分の敵だと感じるようになります。そうなると、十分な理由も正当な根拠もないのに、相手の争いと戦争に引きずり込まれます。また、ほかの国には認めない特権をひいきの国には譲るようになります。譲る側にとっては二重の損になりがちです。手放すべきでないものを不必要に手放したうえ、同じ特権を与えられなかった諸国の嫉妬と反感、仕返ししようという気持ちを呼び起こすからです。さらに、ひいきの国のために身を捧げる、野心的な、買収された、あるいは惑わされた市民が、非難されるどころか、ときには人気まで得ながら、たやすく自国の利益を裏切り、犠牲にできます。野心や腐敗や心酔から生まれる卑しい、あるいは愚かな迎合に、立派な義務感、世論を尊重する称賛すべき態度、公共の利益のために尽くす立派な熱意という金箔をかぶせるのです。",

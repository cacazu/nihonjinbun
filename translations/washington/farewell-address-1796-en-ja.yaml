          "pdf_page": 14,
          "pdf_page_end": 15,
          "source_sequence": 18
        }
      ],
      "source_text": "In contemplating the causes which may disturb our Union, it occurs as matter of serious concern that any ground should have been furnished for characterizing parties by geographical discriminations—northern and southern—Atlantic and western; whence designing men may endeavor to excite a belief that there is a real difference of local interests and views. One of the expedients of party to acquire influence within particular districts is to misrepresent the opinions and aims of other districts. You cannot shield yourselves too much against the jealousies and heart burnings which spring from these misrepresentations. They tend to render alien to each other those who ought to be bound together by fraternal affection. The inhabitants of our western country have lately had a useful lesson on this head. They have seen in the negotiation by the executive—and in the unanimous ratification by the Senate—of the treaty with Spain, and in the universal satisfaction at that event throughout the United States, a decisive proof how unfounded were the suspicions propagated among them of a policy in the general government and in the Atlantic states unfriendly to their interests in regard to the Mississippi. They have been witnesses to the formation of two treaties, that with Great Britain and that with Spain, which secure to them everything they could desire, in respect to our foreign relations, towards confirming their prosperity. Will it not be their wisdom to rely for the preservation of these advantages on the Union by which they were procured? Will they not henceforth be deaf to those advisers, if such there are, who would sever them from their brethren and connect them with aliens?",
      "translation_ja": "連邦を揺るがしかねない原因を考えると、とりわけ気がかりなのは、北部対南部、大西洋岸対西部といった地理上の違いで党派を色分けする余地が生まれたことです。たくらみを抱く人間がそれを利用し、地方による利害や見解の違いが本当にあると思わせるかもしれません。ある地方で勢力を得ようとする党派の手口の一つは、よその地方の考えや目的を偽って伝えることです。そこから生まれる猜疑とわだかまりには、いくら用心してもしすぎることはありません。兄弟の情で結ばれるべき人々が互いをよそ者と見なすようになるからです。この点で西部の住民は最近、有益な教訓を得ました。ミシシッピ川をめぐり、連邦政府や大西洋岸の諸州が西部の利益に反する政策をとっているという疑いが、西部で広められていました。ところが、行政府がスペインとの条約を交渉し、上院が全会一致で批准し、合衆国のどこでもその知らせが喜ばれました。その疑いにどれほど根拠がなかったか、これこそ動かぬ証拠です。西部の人々は、英国との条約、スペインとの条約という二つの条約が成立するのも見届けました。繁栄を確かにするために対外関係に望みうることは、それでことごとく保障されたのです。この利点を守るにも、それを手に入れた連邦に頼るのが賢明ではありませんか。同胞から彼らを引き離し、外国の人々と結びつけようとする助言者がもしいるなら、これからはその声に耳を貸さないのではありませんか。",
      "translation_status": "reviewed"
    },
    {
      "id": "wa-0019",
      "section_id": "address",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "senate",
          "precision": "page",
          "printed_page": "12",
          "printed_page_end": "13",
          "pdf_page": 15,
          "pdf_page_end": 16,
          "source_sequence": 19
        }
      ],
      "source_text": "To the efficacy and permanency of your Union, a government for the whole is indispensable. No alliances, however strict, between the parts can be an adequate substitute. They must inevitably experience the infractions and interruptions which all alliances in all times have experienced. Sensible of this momentous truth, you have improved upon your first essay by the adoption of a Constitution of government better calculated than your former for an intimate Union and for the efficacious management of your common concerns. This government, the offspring of our own choice uninfluenced and unawed, adopted upon full investigation and mature deliberation, completely free in its principles, in the distribution of its powers uniting security with energy, and containing within itself a provision for its own amendment, has a just claim to your confidence and your support. Respect for its authority, compliance with its laws, acquiescence in its measures, are duties enjoined by the fundamental maxims of true liberty. The basis of our political systems is the right of the people to make and to alter their constitutions of government. But the Constitution which at any time exists, until changed by an explicit and authentic act of the whole people, is sacredly obligatory upon all. The very idea of the power and the right of the people to establish government presupposes the duty of every individual to obey the established government.",
      "translation_ja": "連邦が働きを果たし、長く続くためには、国全体の政府が欠かせません。各地域の間にどれほど固い同盟があっても、代わりにはなりません。いつの時代のどの同盟にもあった違約や中断は、そこでも避けられないからです。この重大な真理を理解した皆さんは、最初の試みを一歩進めました。以前の仕組みよりも緊密な連邦を築き、共通の事柄を有効に処理できる憲法を採用したのです。この政府は、他から動かされも脅かされもせず、よく調べ、十分に話し合ったうえでの私たち自身の選択から生まれました。原則において徹底して自由であり、権限の配分においては安全の保障と力強く機能することを両立させ、自らを改めるための仕組みも内に備えています。この政府には皆さんの信頼と支持を受ける正当な資格があります。その権威を敬い、法律に従い、施策を受け入れることは、真の自由の根本原則が課す務めです。わが国の政治制度は、統治のための憲法を定め、また改める国民の権利を基礎にしています。しかし現に効力のある憲法は、国民全体が明示的かつ正当な手続きで改めるまでは、すべての人が厳に守らねばなりません。国民には政府を立てる力と権利があるという考え自体が、一人ひとりにはその政府に従う務めがあることを前提にしているのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "wa-0020",
      "section_id": "address",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "senate",
          "precision": "page",
          "printed_page": "14",
          "printed_page_end": "14",
          "pdf_page": 17,
          "pdf_page_end": 17,
          "source_sequence": 20
        }
      ],
      "source_text": "All obstructions to the execution of the laws, all combinations and associations under whatever plausible character with the real design to direct, control, counteract, or awe the regular deliberation and action of the constituted authorities, are destructive of this fundamental principle and of fatal tendency. They serve to organize faction; to give it an artificial and extraordinary force; to put in the place of the delegated will of the nation the will of a party, often a small but artful and enterprising minority of the community; and, according to the alternate triumphs of different parties, to make the public administration the mirror of the ill concerted and incongruous projects of faction, rather than the organ of consistent and wholesome plans digested by common councils and modified by mutual interests. However combinations or associations of the above description may now and then answer popular ends, they are likely, in the course of time and things, to become potent engines by which cunning, ambitious, and unprincipled men will be enabled to subvert the power of the people and to usurp for themselves the reins of government, destroying afterwards the very engines which have lifted them to unjust dominion.",
      "translation_ja": "法の執行を妨げる行為はすべて、この根本原則を損ない、取り返しのつかない結果を招きかねません。どんなにもっともらしい看板を掲げても、正規の機関の審議や行動を指図し、支配し、妨げ、または威圧することが真の目的である結社や団体も同様です。それらは徒党を組織し、本来はない並外れた力をそれに与えます。国民が代表者に託した意志に代わって一党派の意志が通るようになります。その党派は、しばしば才にたけて行動的な少数者にすぎません。違った党派が交互に勝つたびに、行政は皆で相談し、互いの利害に照らして調整した一貫性のある健全な計画を実行する機関ではなく、徒党がばらばらに立てたつじつまの合わない案を映す鏡になります。そうした団体が時として人々の望むことを果たすとしても、時がたち、事が進めば、抜け目なく野心的で、節操のない人間の強力な道具になりがちです。その道具によって国民の権力を覆し、政治の手綱をわがものとし、不当に支配の座に上りつめると、自分をそこまで持ち上げた道具そのものを壊してしまうのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "wa-0021",
      "section_id": "address",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "en"
      ],
      "source_locations": [
        {
          "source_id": "senate",
          "precision": "page",
          "printed_page": "15",
          "printed_page_end": "16",
          "pdf_page": 18,
          "pdf_page_end": 19,
          "source_sequence": 21
        }
      ],
      "source_text": "Towards the preservation of your government and the permanency of your present happy state, it is requisite not only that you steadily discountenance irregular oppositions to its acknowledged authority but also that you resist with care the spirit of innovation upon its principles, however specious the pretexts. One method of assault may be to effect in the forms of the Constitution alterations which will impair the energy of the system and thus to undermine what cannot be directly overthrown. In all the changes to which you may be invited, remember that time and habit are at least as necessary to fix the true character of governments as of other human institutions, that experience is the surest standard by which to test the real tendency of the existing constitution of a country, that facility in changes upon the credit of mere hypotheses and opinion exposes to perpetual change from the endless variety of hypotheses and opinion; and remember, especially, that for the efficient management of your common interests in a country so extensive as ours, a government of as much vigor as is consistent with the perfect security of liberty is indispensable; liberty itself will find in such a government, with powers properly distributed and adjusted, its surest guardian. It is indeed little else than a name, where the government is too feeble to withstand the enterprises of faction, to confine each member of the society within the limits prescribed by the laws, and to maintain all in the secure and tranquil enjoyment of the rights of person and property.",
      "translation_ja": "皆さんの政府と、今の幸いな状態を長く保つには、正当と認められた権威に対し、定められた手続きを無視して抵抗する動きを、一貫して退けるだけでは足りません。どんなに口実がもっともらしくても、政府の根本原則をむやみに変えようとする動きにもよく注意し、抗わねばなりません。憲法の仕組みに改変を加えて制度の力をそぎ、正面からは倒せないものを内側から崩すという攻め方もあります。変更をもちかけられたら、そのつど思い出してください。政府の本来の性格が定まるには、ほかの人間の制度と少なくとも同じだけ、時間と習慣が必要です。現行の憲法が実際にどのような結果を生むかを測る最も確かな尺度は経験です。ただの仮説や意見を信じて簡単に変えていると、仮説や意見は尽きることがないのですから、いつまでも変更が続きます。なかでも覚えておいていただきたいのは、これほど広い国で共通の利益を実際に守るには、自由の安全を少しも損なわない範囲で、十分に力のある政府が欠かせないことです。権限が適切に配分され、均衡を保っていれば、自由にとってもそうした政府こそ最も頼もしい守り手です。政府が弱すぎて党派の企てを抑えられず、社会の成員一人ひとりに法の定める限度を守らせることもできず、身体や財産の権利を誰もが安心して穏やかに享受できるようにしてやれないなら、自由はほとんど名ばかりです。",
      "translation_status": "reviewed"

      "source_text": "As avenues to foreign influence in innumerable ways, such attachments are particularly alarming to the truly enlightened and independent patriot. How many opportunities do they afford to tamper with domestic factions, to practice the arts of seduction, to mislead public opinion, to influence or awe the public councils! Such an attachment of a small or weak towards a great and powerful nation dooms the former to be the satellite of the latter.",
      "translation_ja": "本当に見識があり自主的な愛国者が、こうした愛着を何より恐れるのは、そこから無数の道を通って外国の影響が入り込むからです。国内の党派を取り込み、甘言で誘い、世論を惑わし、公の審議に働きかけ、あるいは威圧する機会を、どれほどたくさん外国に与えることでしょう。小国や弱国が大国、強国にこうした愛着を抱けば、前者は後者の衛星国となる運命を免れません。",

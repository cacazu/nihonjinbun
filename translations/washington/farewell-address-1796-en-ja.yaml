      ],
      "source_text": "Observe good faith and justice towards all nations; cultivate peace and harmony with all; religion and morality enjoin this conduct, and can it be that good policy does not equally enjoin it? It will be worthy of a free, enlightened, and, at no distant period, a great nation, to give to mankind the magnanimous and too novel example of a people always guided by an exalted justice and benevolence. Who can doubt that in the course of time and things the fruits of such a plan would richly repay any temporary advantages which might be lost by a steady adherence to it? Can it be, that Providence has not connected the permanent felicity of a nation with its virtue? The experiment, at least, is recommended by every sentiment which ennobles human nature. Alas! is it rendered impossible by its vices?",
      "translation_ja": "どの国にも信義と正義を守り、すべての国と平和で円満な関係を育ててください。宗教と道徳はそう命じています。賢明な政策も、同じことを求めていないはずがあるでしょうか。自由で見識を備え、遠からず大国となる国民にふさわしいのは、いつも高い正義と善意に導かれて行動する民の、度量の大きな、そしてこれまであまりに例のなかった手本を、人類に示すことです。この方針を守り抜くために一時の利を失ったとしても、時がたてばその実りが損を補って余りあることを、疑う人があるでしょうか。神の摂理が、一国の恒久の幸福とその徳を結びつけなかったとでもいうのでしょうか。少なくとも、人の性質を気高くするあらゆる感情が、試してみるよう私たちを促しています。ああ、それを不可能にするのは、人間自身の悪徳なのでしょうか。",

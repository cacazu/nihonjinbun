          "pdf_page_end": 19,
          "source_sequence": 22
        }
      ],
      "source_text": "I have already intimated to you the danger of parties in the state, with particular reference to the founding of them on geographical discriminations. Let me now take a more comprehensive view and warn you in the most solemn manner against the baneful effects of the spirit of party, generally.",
      "translation_ja": "国内の党派の危うさは、すでに地理上の区別によって党派を作る場合について述べました。ここではもっと広い視野に立ち、党派心そのものがもたらす害について、心をこめて皆さんに警告したいと思います。",
      "translation_status": "reviewed"

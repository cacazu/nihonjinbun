          "pdf_page": 26,
          "pdf_page_end": 27,
          "source_sequence": 34
        }
      ],
      "source_text": "In the execution of such a plan nothing is more essential than that permanent, inveterate antipathies against particular nations and passionate attachments for others should be excluded and that in place of them just and amicable feelings towards all should be cultivated. The nation which indulges towards another an habitual hatred, or an habitual fondness, is in some degree a slave. It is a slave to its animosity or to its affection, either of which is sufficient to lead it astray from its duty and its interest. Antipathy in one nation against another disposes each more readily to offer insult and injury, to lay hold of slight causes of umbrage, and to be haughty and intractable when accidental or trifling occasions of dispute occur. Hence frequent collisions, obstinate, envenomed, and bloody contests. The nation, prompted by ill will and resentment, sometimes impels to war the government, contrary to the best calculations of policy. The government sometimes participates in the national propensity and adopts through passion what reason would reject; at other times, it makes the animosity of the nation subservient to projects of hostility instigated by pride, ambition and other sinister and pernicious motives. The peace often, sometimes perhaps the liberty, of nations has been the victim.",
      "translation_ja": "この方針を実行するのに何より必要なのは、特定の国に対する根深く恒常的な反感も、ほかの国に対する熱烈な愛着も退け、すべての国に公平で友好的な気持ちを育てることです。他国をいつも憎んだり、いつもひいきしたりする国民は、いくらかは奴隷です。憎しみの奴隷か、愛着の奴隷であり、いずれの感情も、その国を務めと利益の両方からそらすに足ります。一国が他国に反感を抱けば、双方とも相手を容易に侮辱し、傷つけ、ささいなことを腹立ちの種にします。偶然や取るに足りない理由で争いが起こっても、高慢で譲らない態度をとりがちです。そこから衝突が重なり、長引き、憎悪に満ち、血を流す争いが生じます。悪意と憤りに動かされた国民が、政策上どんなに得策でなくても、政府を戦争に駆り立てることがあります。政府自身が国民の感情をともにして、理性なら退ける決定を激情から下すこともあります。また政府が、虚栄、野心、その他のよこしまな有害な動機にあおられた敵対的な企てに、国民の敵意を役立てることもあります。こうして国々の平和がしばしば、ことによると自由までもが、犠牲にされてきました。",

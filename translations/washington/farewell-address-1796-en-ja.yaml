      "translation_ja": "なぜ、これほど特別な位置にある利点を捨てるのでしょう。なぜ自分の足場を離れ、外国の地に立つのでしょう。なぜヨーロッパのいずれかの地域の運命と自分の運命を織り合わせ、ヨーロッパの野心、対抗心、利害、機嫌、気まぐれの網に、自分たちの平和と繁栄を絡ませるのでしょう。",

  section: 生死は一如なり／四、深草の閑居夜雨の聲
  original: 雨の聲」で、靜かな深草の閑居に、夜更けて雨垂れの音のポトリ〳〵と落ちてくるのを聞いて居る。そこに、生ありや、死ありや。雨垂れの音を聞け、雨垂れの音を聞けである。人は、此の生死の大問題さへ解決をしたならば、世間の有らゆる一切の事、過去を思うて悲しむべきことも無く、未來を案じて憂ふべきことも無く、現在の苦悶を訴ふることも無い。常に、安穩に平和に、活潑々地の活動をなして行くことが出來るのである。
  translation: '雨の音」。静かな深草の住まいで、夜が更け、雨だれがぽとりぽとりと落ちる音を聞いている。そこに生があるだろうか、死があるだろうか。雨だれの音を聞け、雨だれの音を聞け、というのである。


    人は、この生死の大問題さえ解決すれば、この世のあらゆることについて、過去を思って悲しむことも、未来を案じて憂えることも、現在の苦しみを訴えることもなくなる。いつも安らかに、平和に、生き生きと活動していけるのである。'

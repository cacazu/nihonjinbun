  section: 大道周行／一、吾道一もつて貫く
  original: 禮などに「父召す時は諾すること無し、先生召せば諾すること無し、唯して起つ、」と書いてある。諾といふ時は、明らかに「ハイ」と返辭するのであるが、唯といふと「ハツ」と唯だ最も速かに引き受けた言葉である。ところが、此間の眞意が、ほかの弟子どもには、一向、分らなかつた。そこで、孔子が出られたあとで、門人が、曾子に問うた、「孔夫子の御言葉と貴下の御答へとは、何う云ふ意味で御座いますか」と。曾子は、「忠恕のみ」と答へて居られるが、こゝは謂ゆる「人見て法說け」の手段でやられたので、此の問答往來の有樣を、禪門公案の中で、類例を擧げて見ると、多少、會得が出來よう。一僧が有つて、趙州和尙に向ひ、「狗子、還た佛性ありやまた無しや」と訊ねると、和尙は、「有」と答へられた。すると、僧は、「旣に、有なり。甚麼としてか、却つて、這箇の皮袋に撞入す」と重ねて訊ねた。和尙は、「他の知つて故らに犯すが爲めなり」と答へられた。又た、一僧が有つて、和尙に、同じく、「狗子、還た佛性ありや也た無しや」といつて訊ねると、今度は、「無」といつて答へられた。そこで、其僧も、重ねて、「一切衆生、皆、佛性あり。狗子、什麼としてか、却つて、無なる。」と訊ねると、和尙は、
  translation: '礼』などに、「父が呼んだときには『諾』と答えない。先生が呼んだときにも『諾』と答えず、『唯』といって立ち上がる」と書かれている。「諾」の場合は、はっきり「はい」と返事をするが、「唯」は「はっ」と、ただちに、最も素早く受け入れる言葉なのだ。


    ところが、このやり取りの真意が、ほかの弟子には、まったくわからなかった。そこで孔子が退出されたあと、門人たちは曾子に、「孔先生のお言葉と、あなたのお答えは、どういう意味なのですか」と尋ねた。曾子は「誠実さと思いやり、それだけです」と答えられたが、ここでは「相手に応じて教えを説く」という方法を使っておられる。この問答のありさまを、禅の公案の似た例で示せば、少しは理解できるだろう。


    ある僧が趙州和尚に向かって、

    「犬にも、仏となる本性がありますか。それともありませんか」

    と尋ねた。和尚は、

    「ある」

    と答えられた。僧は重ねて、

    「あるのなら、どうして、この犬という皮袋の中に入り込んだのですか」

    と尋ねた。和尚は、

    「知っていながら、わざとそうしたのだ」

    と答えられた。


    また別の僧が、同じように、

    「犬にも、仏となる本性がありますか。それともありませんか」

    と尋ねた。すると今度は、

    「無」

    と答えられた。そこで、その僧も重ねて、

    「すべての生きものに仏性があるはずです。どうして犬にはないのですか」

    と尋ねると、和尚は、'

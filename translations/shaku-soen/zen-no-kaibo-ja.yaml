  section: 宗敎的善行／一、積善と陰德の二つ
  original: '一、積善と陰德の二つ


    德行とは、即ち、善い行ひである。近來、一日一善などゝ稱へて、善行を奬めつゝあることは、誠に喜ばしい次第である。總體、敎育なるものは、學と德とを併せ修めしむることを目的とするのであるが、兎もすれば、偏輕偏重して、知識を啓くことに專念し、輒もすれば、德行を修めしむることを遺亡する傾向があるが、大いに心得べきことであると思ふ。凡そ、善行は、二つに分つことが出來る。積善と隱德が、即ち是れである。而して。宗敎的善行は隱德に屬するものであつて、報酬を求むる心のない善行が隱德である。然るに、人の情として、小善も廣く傳へられんことを希ひ、大惡も人に知られざらんことを望むの弱點がある。これは甚だ宜しくない。左手に善事を行うて右手に知らしむる勿れといふ箴言もあるくらゐで、隱れたる善行は、絕對的の善行である。右手に與へて左手に受けんとする相對的善行は卑むべきものである。'
  translation: '一　積善と陰徳の二つ

    徳行とは、よい行いのことである。近ごろ「一日一善」などといって善行を勧めているのは、まことに喜ばしい。そもそも教育は、学問と徳との両方を身につけさせることを目的とする。ところが、とかく一方を軽く、他方を重く見て、知識を広げることに専念し、徳行を修めさせることを忘れがちなのは、大いに注意すべきことだと思う。

    善行は二つに分けられる。積善と隠徳である。宗教的な善行は隠徳に属する。報酬を求める心のない善行が隠徳なのである。ところが人間には、小さな善行も広く伝わってほしいと思い、大きな悪事も人に知られたくないと願う弱点がある。これは実によくない。「左手で善いことをしても、右手に知らせるな」という戒めもあるほどで、人に知られない善行は絶対的な善行である。右手で与えて左手で受け取ろうとする、見返り付きの善行は、卑しむべきものである。'

  section: 武士道を他にも及ぼせ／三 發達せざる宗敎心
  original: '三、發達せざる宗敎心


    併し乍ら、事實の之れに反することの多いのは、遺憾千萬である。現に、衲が住んでをる鎌倉は、橫濱に近いから、外國人が續々遊びに來る。ところが、商人は、外國人に對する價格を、內國人に對するよりも高くするやうである。尙ほ、諸所の輸出商が、商品を海外へ輸出するに、初めの見本よりも、一囘二回と輸出の度を重ねるに隨ひ、漸次に粗惡なるものを送るが如きは、商業道德の缺乏してをる證據ではあるまいか。たとへば、一足の足袋にしても、價格が低廉でも、直ぐに破れるやうな品は、客に對して親切といふことは出來ない。今日は、最早や、價格の低廉なものばかりを尊ばず、何品によらず、堅牢で永久的であるのが、客に對する親切となつてゐる。然るに、商人が自ら欺き、又た人を欺いて、一時を湖塗せんとするは、之れ實業家自らを侮るものでは無い。古來武人の間には、爛漫たる櫻花の如く、又た玲瓏たる富嶽の如く、武士道が發達してをるにも係らず、農工商の間には、なぜ、罪惡が瀰漫してをるか、思ふに之れは宗敎心の發達せざるに歸因するのであらう。'
  translation: '三　発達していない宗教心


    しかし、現実がこれに反することが多いのは、まことに残念である。現に私の住む鎌倉は横浜に近いので、外国人が次々に遊びに来る。ところが商人は、外国人向けの値段を、日本人向けより高くするようである。

    また各地の輸出商が海外に商品を送る際、初めの見本よりも、一回、二回と輸出を重ねるにつれて、だんだん粗悪な品を送るようなことは、商業道徳が欠けている証拠ではないか。

    たとえば一足の足袋でも、値段が安くてもすぐ破れるような品では、客に親切とはいえない。今日では、もはや安いものばかりを尊ぶのではなく、どんな品でも丈夫で長持ちすることが、客への親切となっている。

    それなのに、商人が自分を欺き、また他人を欺いて、その場を取り繕おうとするのは、実業家が自分自身を軽んじるものにほかならない。

    昔から武人の間では、満開の桜のように、また澄んで美しい富士山のように、武士道が発達している。それなのに農工商の間では、なぜ罪悪が広がっているのか。思うに、それは宗教心が発達していないことに原因があるのだろう。'
  notes:
  - 「之れ實業家自らを侮るものでは無い」は文脈上、反語「では無いか」の趣旨と解して訳した。

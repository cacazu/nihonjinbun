  section: 無邊の風月／四、此處が謂ゆる宇宙の生命
  original: 四、此處が謂ゆる宇宙の生命次ぎの句が又た面白い、「不盡の乾坤燈外の燈」、乾坤といふのは宇宙といふも同じこと、前句に對して云つたまでのことで、玆には空間的、時間的にあらはれてあって、宇宙その物から云へば、盡くること無しである。三世を通じて、現在は早や過去になり、未來は又た現在になつて轉々として盡くることなし。吾れ〳〵人間ばかりでなく、世の一切萬物悉く生死輪廻をやつて居る。死んだと思ふと生まれる。
  translation: '四　これが、いわゆる宇宙の生命


    次の句も面白い。「尽きることのない天地、灯の外の灯」である。「乾坤」は宇宙と同じ意味だ。前の句と対にして言ったもので、ここでは空間と時間という面から表されている。宇宙そのものについていえば、尽きることはない。過去・現在・未来を通じ、現在はたちまち過去になり、未来はまた現在になって、次々に移り、尽きることがない。私たち人間だけでなく、この世のあらゆるものが、生まれては死ぬ循環を続けている。死んだと思えば、また生まれる。'

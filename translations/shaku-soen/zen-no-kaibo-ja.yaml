- id: zen-056-01
  scan: 56
  section: 心は明鏡臺の如し
  original: '我が心にぞ尋ね入りぬる

    で、喜怒哀樂に妄動してゐる迷ひの心の中に、信仰は、ちやんと現はれてをる。道はちやんと存して居るのである。太宗皇帝は、

    「人は銅を以て鏡となす、我れは人を以て鏡となす」

    と云つて居られるが、實に味はひのある言葉である。他人の善惡は、直ちに、悉く、自己の教訓となるものであるが、先方が我れを憎惡し、我れに敵對するならば我れは其れを敵とせず、寧しろ彼れを愛すると共に自己を反省するがよい。其時、已に、自己に對する災禍は免れ得て居るのである。憂ひを轉じて樂みとなし得て居るのである。

    惡人を救ひやるといふことは、佛菩薩の御心である。親は不幸なる忰ほど可愛くてならぬといふが、佛菩薩も、亦た、惡人ほど、ます〳〵慈悲を垂れて救はんとなさるのである。淨土門では、彌陀如來の懷に凡夫は抱かれて居る。

    「善人すら猶ほ往生す、況んや惡人をや」

    の意味は、その邊にあるのである。

    かくの如くに、自己本心の中に、此の信念が生じたならば、「誠の心」、即ち、「欺かざる心」、尙ほ換言すれば、「宗教的眞心」である、これが自然と現はれてきて、啻に、自己一身が闇迷の苦境から脫し得るのみでなく、更に進んで、偉大なる生命を發揮するに至るのである。'
  translation: 'この歌のとおり、喜怒哀楽に振り回される迷いの心の中にも、信仰は確かに現れている。道も確かに存在している。太宗皇帝は、「人々は銅を鏡にするが、私は人を鏡にする」と述べている。実に味わいのある言葉である。他人の善い行いも悪い行いも、すべて自分への教訓となる。相手が自分を憎み、敵対してきても、こちらは敵とせず、むしろ相手を愛し、自分自身を省みるのがよい。そのとき、すでに自分に及ぶ災いを避けることができている。憂いを楽しみに変えることができているのである。

    悪人を救おうとするのが、仏や菩薩の心である。親は不幸な息子ほどかわいくてならないというが、仏や菩薩も、悪人であればあるほど、いっそう慈悲を注いで救おうとなさる。浄土の教えでは、私たち凡夫は阿弥陀如来の懐に抱かれている。「善人でさえ往生する。まして悪人はなおさらである」という言葉の意味は、このあたりにある。

    このような信念が自分の本来の心の中に生まれれば、「誠の心」、すなわち「欺かない心」、言い換えれば「宗教的な真心」が自然に現れてくる。そして、自分一人が迷いの苦境から抜け出せるだけでなく、さらに偉大な生命の力を発揮するようになるのである。'
  notes:
  - 冒頭はscan55の歌の後半。歌の訳はscan55側にまとめ、ここでは説明から続けた。

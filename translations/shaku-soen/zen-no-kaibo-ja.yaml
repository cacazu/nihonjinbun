  section: 敬神の念を起せ／三 神化し靈化せよ
  original: '即ち、祖先の恩に報ゆる所以であらうと思ふ。祖先を尊敬するのは、元來、人間の至情である。彼の西行法師が、伊勢の大廟に詣でゝ、

    何事の在しますかは知らねども

    かたじけなさに涙こぼるゝ

    と其感情を詠うて居るが、尤ものことである。'
  translation: '祖先の恩に報いることだと思います。祖先を敬うのは、もともと人間の自然な真情です。西行法師が伊勢の大廟に参拝して、

    「どのような神がおいでになるのかは知らないけれど、ありがたく、恐れ多くて、涙がこぼれる」

    とその気持ちを詠んでいますが、もっともなことです。'

  section: 自性の徹見／二、眼前口頭其儘が禪
  original: 禪は、有らゆる學問の原理を敎へるものであつて、社會學、政治學、經濟學、其他一切の學問は源を禪に發する。要するに、實際社會の眼前口頭し其儘が禪である。
  translation: 禅はあらゆる学問の原理を教えるものであり、社会学、政治学、経済学、その他すべての学問は禅を源としている。要するに、現実の社会で、目の前にあり、口に上るもの、そのままが禅なのである。
  notes: []

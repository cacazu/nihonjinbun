  section: 人生は大夢なり／二、洒々落々たれ
  original: 水鳥の行くも歸るも跡たえてされども道は忘れざりけりといふのがある。此の御歌を能く味つて貰ひたい。人、若し、一點の囚はれるところが無かつたならば、丁度、鳥の空中を翔るが如く、魚の水中を泳ぐが如く、サラ〳〵として居つて、少しも痕跡を殘さぬ。彼の水鳥が、縱橫に水上を往來して、些かも痕跡を殘さゞるのみか、決して、道を踏み外すことの無いのと同じである。
  translation: '「水鳥は、行っても帰っても跡を残さない。それでも、自分の道を忘れることはない」


    という歌がある。この歌を、よく味わってもらいたい。人が少しもとらわれずにいるなら、ちょうど鳥が空を飛び、魚が水を泳ぐように、さらさらと自在に動いて、何の跡も残さない。水鳥が自由に水上を行き来し、少しも跡を残さないばかりか、決して道を踏み外さないのと同じである。'
  notes:
  - 冒頭は前コマからの続き。

  section: 無邊の風月／二、肉眼ばかりでは見えぬ
  original: 通とか、今まの神通妙用の意味から來たものである。その外に、慧眼ともいひ、此頃流行する千里眼といふものも、其の方面の天眼通、即ち、心眼なのである。敢て禪門の修行をして悟道せずとも、それ〳〵專門〳〵の眼を透さば何んでも分つてくる。吾が宗教、禪門の立脚地から、一切を見るとき·······少し是れは極言かも知れぬが·····吾が目前に、天堂、地獄、有らゆる魔界、佛界が現はれてくるやうに見受けられる。その靈なる働きは、哲理、科學の論ではない。古人の語に、「巢知風、穴知雨」と云ふのがある。即ち、鳥や蟲の類に至つても、此の不可思議なる神通妙用は自在なのである。臺灣とか、小笠原とかいふ名は知らねども、はゝアー何の邊に低氣壓が起つた、何日頃、颱風がやつて來ると、自然に鳥には分るから、早速、巢を別處に運んで、安全を計る。又た、如何なる大雨が降つてくるにしても、穴に居を構へてをる蟻は、七日前からチヤントそれを知つて、豫め相當の防禦準備をすると云ふ有樣だ。其他、自然界を眺めて見ると、有らゆるものが、自然の妙靈によつて支配され、不可思議な働きを現はしてをる。玆に至つては、到底、理窟や學問の遠く及ばぬところである。彼の千里眼とか、透視術なども、共に、不可思議な術で、やはり、理外の理から割り出された一種の神通に相違ない。世間のことも、唯だ單に五感をのみ當てにするので無く、もう一步進んだ謂ゆる眼中の眼、即ち、心眼によつて、一つ大發見がありさうなものだと思ふ。勿論、禪そのものゝ立場に至つては、彼れ是れ論ずるの暇はないが、あまりに今の世が、哲學と云ひ、科學と云ひ、其他、何れも、物質化し過ぎた表面的學問にのみ拘んで、此の天地の大眞理を、精神的に、徹底的に、自覺すると云ふことに缺けてをる。此
  translation: '通」などと同じく、今いった不思議で自在な働きの意味から来たものだ。そのほかに「慧眼」ともいい、近ごろ流行の「千里眼」も、その方面でいう天眼通、つまり心眼なのである。必ずしも禅の修行をして悟らなくても、それぞれの専門の目を通して見れば、何でもわかってくる。


    私たちの宗教、禅の立場からすべてを見ると――これは少し極端な言い方かもしれないが――目の前に、天国も地獄も、あらゆる魔の世界も仏の世界も現れてくるように見える。


    この霊妙な働きは、哲学や科学の議論ではない。古人の言葉に、

    「巣に住むものは風を知り、穴に住むものは雨を知る」

    とある。鳥や虫でさえ、この不思議な働きを自由に備えているのだ。


    台湾や小笠原という名前は知らなくても、「あの辺に低気圧が起こった、何日ごろ台風が来る」と、鳥には自然にわかるので、さっそく巣を別の場所へ移して安全を図る。また、どんな大雨が降ってくるにしても、穴に住む蟻は、七日前からきちんとそれを知り、前もって必要な防御の準備をするという。


    そのほか、自然界を眺めてみると、すべてのものが自然の不思議な力に動かされ、驚くべき働きを示している。こうなると、理屈や学問ではとうてい及ばない。千里眼や透視術も、どちらも不思議な術であり、やはり、通常の理屈の外にある理から生じた、一種の神通に違いない。


    世間の事柄も、ただ五感だけを頼るのではなく、もう一歩進んだ「目の奥の目」、つまり心眼によって見れば、大きな発見がありそうなものだと思う。もちろん、禅そのものの立場に達すれば、あれこれ論じている暇はない。しかし今の世の中は、哲学も科学も、そのほか何もかも、あまりに物質化した表面的な学問ばかりにこだわり、この天地の大いなる真理を、精神の面から徹底して自覚することが欠けている。この'

  section: 人生は大夢なり／三、樂み春の如し
  original: 三、樂み春の如し昔者、莊子が、夢に胡蝶となつたと云ふことがあるが、思ふに、これは、胡蝶が分相應に働いて居つて、翩々と心の欲するまゝに飛び樂しむといふ寓意であつて、餘程輕快のことゝ思ふ。世は、大夢である。併し、我れ〳〵の見るのは小夢である。歐洲の戰爭、これも夢であつた。世界の太平も、亦た、夢である。步一步、夢を進めて行くならば、其の樂みは洋々として、春の如くである。大般若の疏に「久しく金剛不壞の壽命を持して福慧を增長し」といふことがある。金剛は、寶石の名で、堅と利と明の三義を含んで居る。即ち、金剛石は、非常に堅固なもので、何物も此れを破壞することが出來ない。又た、非常に銳利なものであつて、何物も此れを截斷することが出來ない。又た、寶珠の王と稱せられるだけあつて、其の光明は能く闇夜を照し得るのである。だから、佛身を譬へて、金剛不壞の身といふのである。涅槃經にも、「我れ護法の故に金剛身を得たり」といふ語がある。金剛身、即ち、身心の平安を得て、外境の爲めに動搖されることなき身であつたならば、現實の如何なる惡夢も何かあらんである。前にあつた楞嚴經の、
  translation: '三　楽しみは春のよう


    昔、荘子が夢の中で蝶になったという話がある。思うに、これは、蝶が自分にふさわしい働きをし、ひらひらと心のままに飛んで楽しむことを寓意にしたもので、ずいぶん軽やかなことだと思う。


    この世は大きな夢である。しかし、私たちが見ているのは小さな夢だ。ヨーロッパの戦争も夢だった。世界の平和もまた夢である。一歩ずつ夢を進めていくなら、その楽しみは広々として、春のようである。


    『大般若』の疏には、「長く、金剛のように壊れない命を保ち、幸福と智慧を増し育てる」という言葉がある。金剛とは宝石の名で、堅さ、鋭さ、明るさという三つの意味を含んでいる。つまり、ダイヤモンドは非常に堅固で、何ものもこれを壊せない。また、非常に鋭利で、何ものもこれを切断できない。さらに宝石の王と呼ばれるだけあって、その光は闇夜を照らすことができる。だから仏の身をたとえて、金剛のように壊れない身というのだ。『涅槃経』にも、「私は仏の教えを守ったために、金剛の身を得た」という言葉がある。金剛の身、つまり心身の安らぎを得て、外の状況に揺り動かされない身であるなら、現実のどのような悪夢も、何ほどのことがあろう。先ほどの『楞厳経』の、'
  notes:
  - 末尾は次コマへ続く。

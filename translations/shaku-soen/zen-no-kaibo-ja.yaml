  original: '五、千光祖師の慈悲


    この「無我」といふことを、尙ほ、一歩、進んで言ふと、大同情とも云ふのである。此の大同情が、社會人心の根抵とならなければ、社會の平和は得られない。同情といふことを平易に言へば、思ひ遣りで、即ち、諺「我身を抓つて人の痛さを知れ」と言ふのに外ならないと思ふ。我が宗門に、千光祖師といふ偉い御方があつた。或時、一人の困窮人が、千光祖師のとこへ遣つて來て、'
  translation: '五　千光祖師の慈悲


    この「無我」をもう一歩進めていえば、大いなる思いやりともいう。この大いなる思いやりが、社会と人心の根底にならなければ、社会の平和は得られない。同情をわかりやすくいえば思いやりであり、ことわざの、

    「自分の身をつねって、他人の痛みを知れ」

    ということにほかならないと思う。

    私たちの宗門に、千光祖師という偉い方がいた。あるとき、一人の困窮者が千光祖師のところにやって来て、'
  notes:
  - 末尾は次スキャンへ続く。

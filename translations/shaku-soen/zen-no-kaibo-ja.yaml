  section: 驢を渡し馬を渡す／四、大道、長安に透る
  original: 「墻外底」墻の外を見よ、道は縱横に通じて居る。-大道は一切處に行き渉つて居る-と答へられると、僧は、「這箇の道を問はず、大道を問ふ」と云ふ。趙州は、「大道、長安に透る」大道は、都長安まで眞直ぐに通じて居る-至道無雜、異途なし、一本筋の大道である-と答へられた。皆な斯ういふ風に日常の語を使用して、却つて、人を殺活する手段を用ひられたものである。
  translation: 「塀の外にあるものだ」と答えられた。塀の外を見なさい。道は縦横に通じている――大道は、あらゆる所に行き渡っている――というのである。僧が、「その道を尋ねているのではありません。大道を尋ねているのです」と言うと、趙州は、「大道は長安に通じている」と答えた。大道は都の長安まで真っすぐに通っている――究極の道に混じりものはなく、別の道もない。一本筋の大道である――というのである。このように、いつも日常の言葉を用いながら、人のとらわれを断ち、人を生かす手立てとしたのである。

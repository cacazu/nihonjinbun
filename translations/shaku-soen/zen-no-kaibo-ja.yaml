  section: 智情意の三修養／四 智的情的の修養
  original: 手にして耕作して居つても、又た算盤を彈いて居つても、權利義務の法律に從事して居つても、仕事そのものに就いて、品性を高めて行くといふ、一つの趣味を產み出さねばならぬ。たとへば、赳々たる武夫、國家の干城たる軍人でも、戰亂絕え間なき時代に於いても、それが必要である。磐城國岩城郡窪田村の山中にある古關址は、勿來關といつて、有名である。八幡太郞義家が、奧洲に軍を出した時、この勿來關にさしかゝると、時しも春風長閑に吹き渡つて、雲と見まがふばかりに咲き盛つた櫻花が、雪のやうに繽紛と散り、冑も花、鎧も花、身は何時しか畫中の人と爲り、逸興、頓に湧き、詩情自ら動き、吹く風を勿來の關と思へども道もせに散る山櫻かなと口吟んだ。兵馬倥傯の間にあつて、此の雅懷ある、謂ゆる英雄の胸中閑日月ありと云ふ可きである。それから、支那の三國時代のことで、彼の三國志を見られた人は知つて居られやうが、魏の曹操は、名高い英雄であるが、吳の臣、周瑜といふ豪敵を前に控えながら、赤壁で槊を橫たへつゝ、「月明らかに星稀れに、鳥鵲南に飛ぶ」と口吟して居る。その風流酒落の心を有つてゐたことは、今日でも想像が出來る。それから、文政年間の女流俳人である花讃の句に、つい戾る心で出たを夕ざくらといふのがある。如何にも優美である。つい歸る心で出たのであるが、紅雲靉靆ける夕櫻を眺めては、早く歸れなかつたといふので、其人の優しさが見える。かう云ふ風に、情的修養に一つの趣味を有つて居るのである。そこで、一幅の掛物を見て無量の感化を受けるのである。かう云ふ意味に於て、謠曲を聞いても、芝居を見ても、何等かの善い感化を受け
  translation: '手に畑を耕していても、算盤をはじいていても、権利や義務を扱う法律の仕事をしていても、その仕事そのものを通して品性を高めていく、そういう味わいを生み出さなければならない。たとえ勇ましい武人、国家を守る軍人であっても、戦乱の絶えない時代であっても、それが必要である。

    磐城国岩城郡窪田村の山中にある古い関所跡は、勿来関といって有名だ。八幡太郎義家が奥州へ出兵したとき、この勿来関にさしかかると、折しも春風がのどかに吹き渡り、雲かと見まがうほど咲き誇る桜が、雪のように乱れ散っていた。兜にも花、鎧にも花、いつしか自分が絵の中の人物のようになり、すぐれた興趣がにわかに湧き、自然に詩心が動いて、

    「吹く風よ、ここは『来るな』という名の勿来の関なのだから、来ないでくれと思うのに、道いっぱいに散っている山桜よ」

    と口ずさんだ。軍事に追われながらも、このように風雅な心を持っていた。いわゆる、英雄の胸の内には、のんびりした時が流れているというべきである。

    それから中国の三国時代のことだが、『三国志』を読んだ人は知っているだろう。魏の曹操は名高い英雄だが、呉の臣下、周瑜という強敵を目前にしながら、赤壁で長い矛を横たえ、

    「月は明るく、星はまばらに、カササギが南へ飛んでいく」

    と口ずさんでいる。その風雅で物にとらわれない心を持っていたことは、今日でも想像できる。

    また、文政年間の女性俳人、花讃の句に、

    「すぐ戻るつもりで出てきたのに、つい見とれる夕桜」

    というものがある。いかにも優美である。すぐ帰るつもりで出たのだが、紅い雲のようにたなびく夕桜を眺めては、早く帰れなかったというので、その人の優しい心が見える。このように、感情の修養に一つの味わいを持つのである。そうなれば、一幅の掛け軸を見ても、限りない感化を受ける。

    こういう意味で、謡曲を聞いても芝居を見ても、何か善い感化を受け'
  notes:
  - 和歌・漢詩・俳句は意味が伝わるよう本文中で現代語訳した。「花讃」は原著の表記。

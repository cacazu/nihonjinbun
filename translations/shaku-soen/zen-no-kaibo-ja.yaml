  section: 禪と鎌倉武士／八 膽斗の如き相模太郞
  original: 'と。春と夏の間に筑紫潟が大いに騷ぐであらうと、かう云ふことを、此時、最早や、豫言して居られる。國師が、悟りの力で知られたのではなく、蒙古の國情を能く知つてをられたからで、決して、ヂタバタするに及ばぬ、必ず天風來つて皇軍を佑けるであらうと豫言された。果して、弘安四年の六月五日に至つて、彼の通り大擧して來たのであるが、戰ひの結果は、敵軍の生きて還る者、僅かに三人といふ有樣であつた。

    尙ほ、一つ、御話したいのは、當時、博多の急報、頻りに至るや、時宗は、甲冑を着して、國師の室に至り、

    「弟子、即今、大事到來せり」

    と云ふと、國師曰く、

    「如何んが向前せん」

    時宗、威を揮つて一偈せりとある。これは「四百餘州を擧る」と言つて、小學の小供が歌ふが、其歌の根據はかう云ふところから出て居るのである。而して、時宗が大喝するや、國師曰く、

    「眞の獅子兒、能く獅子吼す。驀直に前進して囘顧する勿れ。」

    と立派に證明された。

    さうすると、時宗の旗下、長崎次郞左衛門、太宰少貳、高橋道妙、宮內平左衛門、諏訪左衛門、糟屋三郞左衛門、稻津左衛門等、一騎當千の武夫等が、次ぎから次ぎへと國師の室へ來て、一々、活きながらの引導を渡して貰ひ、勇み進んで西に向つて出馬したのである。

    世人の知る如く、鎌倉は、今ま行つて見ても、まことに猫額大のところで、北條氏時代の生活狀態は、まことに質素にして、曾て、時賴公が、大佛某と、冬の寒い深夜に、生味噌で濁酒を飮んで、天下國家の問題を論じて居つたと云ふくらゐであつた。けれども、當時の日本國民は質實剛健であつて、義勇奉公の精神に富んで居'
  translation: 'といったのである。春と夏の間に筑紫の海が大いに騒がしくなると、このときすでに予言していた。国師が悟りの力で知ったのではなく、蒙古の国情をよく知っていたからである。決してじたばたするには及ばない、必ず天の風が来て日本の軍を助けるだろう、と予言した。果たして弘安四年六月五日、先ほど述べたように大軍が押し寄せたが、戦いの結果、生きて帰った敵兵はわずか三人というありさまだった。

    もう一つ、お話ししたい。当時、博多からの急報が次々に届くと、時宗は鎧と兜をつけ、国師の部屋へ行っていった。

    「弟子の私に、今こそ一大事がやって来ました」

    国師が「どう立ち向かうか」と問うと、時宗は威勢を振るって一声を発したという。小学生が「四百余州を挙ぐる」と歌うが、その歌の根拠はこういうところにある。時宗が大喝すると、国師はいった。

    「まことの獅子の子よ、立派に獅子の声でほえた。まっすぐ前進せよ、振り返ってはならぬ」

    そうして、その境地を立派なものと認めた。

    すると時宗の配下の長崎次郎左衛門、太宰少弐、高橋道妙、宮内平左衛門、諏訪左衛門、糟屋三郎左衛門、稲津左衛門ら、一騎で千人に当たるほどの武者たちが、次々と国師の部屋を訪れた。それぞれ生きながらに引導を授かり、生死を超える覚悟を得て、勇んで西へ出陣したのである。

    よく知られているとおり、鎌倉は今行ってみても、実に猫の額ほどの土地である。北条氏時代の暮らしはきわめて質素だった。時頼公は大仏某と、冬の寒い深夜、生味噌をつまみに濁り酒を飲みながら天下国家を論じていたというほどだ。だが当時の日本国民は質実剛健で、正義と勇気をもって公に尽くす精神に富んで'
  notes:
  - 「一偈せり」は原本通り。直後の「大喝」との関係を踏まえ、訳は「一声を発した」とした。帰還者「三人」も原文の数字を保持した。
  - 冒頭は前コマから続く。
  - 末文は次コマへ続く。

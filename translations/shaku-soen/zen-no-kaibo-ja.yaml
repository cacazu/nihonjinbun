  section: 生死は一如なり／三、慧玄が這裏に生死なし
  original: 「生か死か」と訊ねたが、石霜和尙も矢張り「生とも道はず、死とも亦た道はず」と同じことを答へられた。そこで、「何んとしてか道はざる」と詰ると、これ、また、「道はず〳〵」と答へられた。これを聞いて、始めて、漸源は、大悟したと云ふことである。また、一僧があつて、關山國師に向つて、「生死事大無常迅速、請ふ道へ」此世は無常迅速であつて、生死のことは一大事である、どうか教へを垂れて下さいと云ふと、國師は、「慧玄が這裏に生死なし」と云つて、打つて〳〵打ちのめし、とう〳〵逐ひ出してしまはれた。此僧も、こゝで氣が注いたであらうよ。
  translation: '「生ですか、死ですか」

    と尋ねた。石霜和尚もやはり、

    「生とも言わない。死とも言わない」

    と、同じ答えをされた。そこで、

    「どうして言わないのですか」

    と問い詰めると、また、

    「言わない、言わない」

    と答えられた。それを聞いて、漸源は初めて深い悟りを開いたという。


    また、ある僧が関山国師に向かって、

    「生と死は重大な問題であり、無常の変化は速やかです。どうか、おっしゃってください」

    つまり、この世は絶えず速やかに移り変わり、生死は一大事です、どうか教えをお授けください、と言った。すると国師は、

    「慧玄のこの境地に、生も死もない」

    と言って、何度も何度もその僧を打ち、とうとう追い出された。その僧も、これで気がついただろう。'

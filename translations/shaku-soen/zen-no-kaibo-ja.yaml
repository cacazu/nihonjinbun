  section: 驢を渡し馬を渡す／六、喫粥し了れりや
  original: '六、喫粥し了れりや


    また、或時、一僧が趙州和尙のところへ來て、「學人乍入叢林、乞ふ、師指示せよ」私は、今囘、當僧堂に掛錫させて戴きましたが、どうか、今後、宜しく御指導を御願ひいたしますと云つて、入門の挨拶をした。すると、和尙は、「喫粥し了れりや也た未だしや」お前さん、御飯を食べたか未だかと問はれたから、「喫し了る」'
  translation: '六　もう粥を食べたか


    またあるとき、一人の僧が趙州和尚のところへ来て、「私は今、初めてこの僧堂に入りました。どうかご指導ください」と言った。「今回、こちらで修行させていただくことになりました。今後ともよろしくお願いいたします」という入門の挨拶である。すると和尚は、「もう粥を食べたか。それとも、まだか」と尋ねた。僧は、「食べ終えています」と答えた。'

  section: 夙に起き時を使へ／二、來る日も〳〵唯今日
  original: '二、來る日も〳〵唯今日


    人間の一生は、一日〳〵を、段々に繼續して行くものであるから、去年あり、今年あり、明年あり、昨日あり、今日あり、明日ありといふ次第であるが、能く考へて見れば、昨日も今日、明日も今日、明後日も今日、去年も今日、今年も今日、また來る年も今日、來る日も今日である。一日は、必らずしも、二十四時間といふ時間に限られたものでは無い。ずつと、今日〳〵を積み重ねて行くのが人間の一生である。そこで、古人の謂へる「死して後止む」と云ふところに到達する譯であるが、そこになると、筆もつ人なれば筆をもつたまゝ瞑目して其れで澤山である。鐵砲もつ人なれば鐵砲をもつたまゝで死んでしまつても、些かも遺憾なき次第である。算盤彈く人であれば算盤彈きつゝ息引きとつても本願であらうと思ふ。ところが、せめて、死ぬ時ばかりは坐禪でも組んだまゝ、確り口でも噤んで立派な死にさまなして死んで見たいと云ふやうな考へて居る者もある。滿更ら、惡い考へでは無いが、甚だ迂濶な考へと云はねばならぬ。人間といふものは己れが職分と共に斃れたら、それで立派なものである。今の若い身空を以て死ぬ時を考へて居るやうな暇は有たぬ筈である。朝から晩まで孜々矻々として、奮鬪努力し、向上して已まぬ精神を有つてゐるならば、便所で力んで居りながら、そのまゝ息引きとつても遺憾なしである。或ひは、また、一種の病氣に取り附かれ、七轉八倒、逆立ちになつて死んだとて、別に何んの遺憾もない譯である。一向の信念と云ふのは其處にある。'
  translation: '二　来る日も来る日も、ただ今日


    人間の一生は、一日一日を次々につないでいくものである。だから、去年があり、今年があり、来年がある。昨日があり、今日があり、明日がある。しかし、よく考えれば、昨日も今日、明日も今日、あさっても今日、去年も今日、今年も今日、これから来る年も今日、来る日も今日なのである。

    一日は、必ずしも二十四時間という時間だけに限られない。ずっと「今日、今日」を積み重ねていくのが人間の一生である。そこから、昔の人のいう「死んでから、初めてやむ」というところに至る。そこまでくれば、筆を持つ人なら、筆を持ったまま目を閉じて、それで十分である。銃を持つ人なら、銃を持ったまま死んでも、少しも悔いはない。そろばんをはじく人なら、そろばんをはじきながら息を引き取っても、本望だろうと思う。

    ところが、せめて死ぬときだけは、坐禅を組み、口をきちんと結んで、立派な姿で死にたい、と考えている人もいる。まったく悪い考えではないが、たいへんうかつな考えと言わなければならない。人間は、自分の務めを果たしながら倒れるなら、それで立派なのである。

    今の若い身で、死ぬときのことを考えている暇はないはずだ。朝から晩までこつこつと励み、奮闘努力して、向上をやめない精神を持っているなら、便所でいきみながら、そのまま息を引き取ったとしても悔いはない。あるいは、何かの病気にかかり、七転八倒し、逆さまになって死んだとしても、別に何の悔いもないのである。一筋の信念とは、そこにある。'
  notes:
  - 第二節の見出しはscan69末にある。本文との対応を明確にするため、ここに付した。
  - 死に方についての表現は、職分を尽くす生き方を説く著者の文脈に従った。

  section: 智情意の三修養／三 理・智・用の完全を
  original: まれて居ると思ふ。扨て、心から修養するのは、何うかと云へば、我れ〳〵の理想は、言ふまでもなく分つて居る。先づ、眞とか、善とか、美とか言ふやうなものが理想である。敎育の目的も進めて行けば、此點に來るのであつて、我が宗敎も亦た其通りで、戒·定·慧といふものを修して、理、智、用の完全を期するものである。併し、理、智、用とか、又たは、眞、善美とか云つても、決して、其心は別々にあるといふのでは無い。固より、一心の三方面に就いて、假りに、眞とか、善とか美とかいふやうな名をつけて居るのみである。されば、修養にも、智的修養があれば、情的修養もあり、又た、意的修養もある。
  translation: 'まれていると思う。

    さて、心から修養するとはどういうことか。私たちの理想は、いうまでもなくわかっている。まず真・善・美といったものが理想である。教育の目的も突き詰めればここに行き着くし、私たちの宗教も同じで、戒・定・慧、つまり戒律を守ること、心を定めること、智慧を得ることを修め、理・智・用、すなわち道理、その理解、実際の働きを完全にすることを目指す。

    しかし理・智・用、あるいは真・善・美といっても、心がそれぞれ別にあるわけではない。もともと一つの心の三つの面に、仮に真、善、美といった名をつけているだけである。それゆえ修養にも、知性の修養、感情の修養、意志の修養がある。'
  notes:
  - 冒頭は前スキャンから続く。

  section: 敬神の念を起せ／一 眞面目なる精神
  original: '敬神の念を起せ

    一、眞面目なる精神

    衲は、日露の役に從軍して、彼方此方、慰問してあるいたが、兵士の中には、朝起きると敬虔なる態度で、太陽を拜んで居る者を見たが、若い將校などは、之れを見て、太陽も地球も同じものである。何んだつて太陽などを拜むかと云つたやうなことでありましたが、さう云ふ淺薄な眼でもつて見ては不可ない。此の眞面目なる精神があればこそ、敵國に比べて、物質的に、數學的に、比較にならぬほどであるにも拘らず、あのやうな戰捷を見るに至つたのであります。固より、此の外にもいろ〳〵の原因が有つたであらうが、我れ〳〵日本人には、かゝる美なる感情が存してゐるのであります。'
  translation: '神を敬う心を起こせ

    一　真剣な心

    私は日露戦争に従軍し、各地を慰問して歩きました。そのとき、朝起きると敬虔な態度で太陽を拝む兵士を見かけました。若い将校などは、それを見て、「太陽も地球も同じものだ。なぜ太陽などを拝むのか」といっていました。しかし、そんな浅い見方をしてはいけません。この真剣な心があったからこそ、敵国と比べて物資や数量の面では比較にならないほど劣っていても、あのような勝利を得られたのです。もちろん、ほかにもさまざまな原因があったでしょうが、私たち日本人には、このような美しい感情があるのです。'
  notes: []
  sequence: 141
- id: zen-109-01
  scan: 109
  section: 敬神の念を起せ／一 眞面目なる精神
  original: '此の美なる感情があるから、太陽を拜むばかりでなく、或は山にも己が心を捧げる。之れを一知半解の相對的知識で冷笑し去るといふは不可ない。斯くの如く、敬虔熱烈な信仰があるからして、死んだ山をも動かさずには置かない。此の精神の力を看過してはならぬ。

    衲が、米國に渡る船中で、嬉しいと思つたことは、向ふに行く日本の勞働者、風態は餘り感心しなかつたが、每日、起きると太陽を拜む。衲は、之れを見て、大變嬉しく思つた。少し學問でもある日本人は、それを見て、馬鹿な眞似をしてゐる、西洋人に見られたら恥かしいぢやないかなどゝ申しますが、假令、西洋人が笑はうが、笑ふ者には勝手に笑はせて置くがよい。外形の問題ではない、精神の問題なんである。或は、その形に於ては、彼等は、もつと文明的にならねばならぬかも知れない。'
  translation: 'この美しい感情があるから、太陽を拝むだけでなく、ときには山にも自分の心を捧げるのです。それを生半可な、限られた知識で冷笑して片づけてはいけません。このような敬虔で熱烈な信仰があるからこそ、生命のない山さえ動かさずにはおかないのです。この精神の力を見過ごしてはなりません。

    私がアメリカへ渡る船でうれしく思ったことがあります。向こうへ行く日本人の労働者たちは、身なりはあまり感心しませんでしたが、毎日起きると太陽を拝んでいました。私はそれを見て大変うれしく思いました。少し学問のある日本人は、「馬鹿なまねをしている。西洋人に見られたら恥ずかしいではないか」などといいます。しかし西洋人が笑おうとも、笑う人には勝手に笑わせておけばよい。外見ではなく、精神の問題なのです。もっとも、外側の形については、彼らももっと文明的にならなければならないかもしれません。'
  notes: []
  sequence: 142
- id: zen-109-02
  scan: 109
  section: 敬神の念を起せ／二 明治天皇の御製
  original: '二、明治天皇の御製

    精神の置きどころは、こゝに無くてはならぬ。明治天皇の御製にも、

    目に見えぬ神の心に通ふこそ

    人の心の誠なりけり

    と仰せられてあるが、實に、百千萬の教訓にも優るものである。我れ〳〵は常に此心を助長して、向上せしめて行かなくてはならぬ。國の成立の原因は此心である。此の心の盛んなる國は榮え、然らざる國は衰へるのである。

    遠く例を引かないでも、現在に、最も我れと近い支那はどうであるか。あの有樣は、到底、解し得られぬところである。なまなか、一寸の理窟を覺え、徹底してない何かに被れた、芋か、大根か、天麩羅にでもしたやうな、妙な理窟を、此間に捏るのは間違つてゐる。'
  translation: '二　明治天皇の御製

    心のよりどころは、ここになければなりません。明治天皇の御製にも、

    「目に見えない神の心に通じるものこそ、人の心の誠なのだ」

    とあります。実に、無数の教訓にもまさるものです。私たちは常にこの心を育て、高めていかなければなりません。国が成り立つもとは、この心です。この心が盛んな国は栄え、そうでない国は衰えるのです。

    遠い例を挙げるまでもなく、今、私たちに最も近い中国はどうでしょう。あのありさまは、まったく理解しがたいものです。生半可に少しばかりの理屈を覚え、よく理解もしない何かにかぶれて、芋だか大根だかを天ぷらにしたような妙な理屈を、この問題についてこね回すのは間違っています。'
  notes:
  - 中国への評価や文明観は、著者の当時の立場を保持した。芋・大根・天ぷらの比喩も省略していない。
  sequence: 143

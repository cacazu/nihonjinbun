- id: zen-055-02
  scan: 55
  section: 心は明鏡臺の如し
  original: '心は、明鏡臺の如きものである。自心を欺くといふことが無かつたならば、人生の苦樂浮沈、何物か吾人の爲めに憂ひをなすものがあらうか。

    全體、人の此の「心」といふものは、刹那〳〵に遷り變つて、彼れを思ひ、此れを考へて止む時がない。その遷り變つて行く刹那〳〵には、兎角、自心の光明が覆はれて、外物の爲めに自ら欺かしめられ易いものである。

    世間の人は、宗教とか、信仰とかいへば、御經の中にあるものだ。お寺へ行かなければ得られぬものだ。僧侶に會はなければ求められないものだと思つてゐるやうであるが、それは大きな間違ひである。決して、わざ〳〵そんな處に求めなくとも自己本心の發露するところ、そこに宗教は躍如として現はれてゐるのである。

    夜もすがら佛の道を求むれば'
  translation: '心は、曇りのない鏡を載せた台のようなものである。自分の心を欺かなければ、人生の苦楽や浮き沈みのうち、何が私たちを悩ませるというのだろうか。

    そもそも人の「心」は、一瞬ごとに変化し、あれを思い、これを考えて、止まることがない。その変化の一瞬一瞬に、自分の心の光は覆われがちになり、外の事物に惑わされやすいのである。

    世間の人は、宗教や信仰というと、お経の中にあるもの、寺へ行かなければ得られないもの、僧侶に会わなければ求められないものだと思っているようだ。しかし、それは大きな間違いである。わざわざそのような場所に求めなくても、自分の本来の心が表に現れるところに、宗教は生き生きと姿を現している。

    「夜通し仏の道を求めていると、自分自身の心の奥へと、尋ね入っていた。」'
  notes:
  - 原文末尾の歌はscan56冒頭へ続く。訳では一首をこの単位にまとめた。

  section: 隱德を積め／一 隱れたる土臺石
  original: ろに力を出して居るので、立派な堅牢な家屋が立つて居るといふことに歸着する。そこで、かくの如く、道理を應用して、いろ〳〵の社會、いろ〳〵の階級、いろ〳〵の物事に持つて行つて考へると、何物でも、人事百般、すべての事について、其中に、或る人があり、或る物があつて、それが形狀には見えぬが、堅固なる力を添へて居るであらうと思はれる。今ま、眼前で、近く例を引いて見ると、庭の樹木の新綠が色冴えて、見るからに爽快を覺ゆるが、枝なり、幹なり、地上に現はれて居る部分が、長ければ長いだけ、其根が深く地中にあつて、恰も家屋の礎の如き効力を有して居るのである。かゝる事を、段々に類例して、人間社會の上で考へてみても同じで、一軒の家に取つても、やはり、一軒の家の礎となつて居る人があるだらうし、單に礎となつて居るばかりで無く、隱れて力を添へて居る人もあらうと思ふ。そんな人が、一人でも、二人でも、有れば有るほど可いので、若し、家内中、總てが左うであればその一家は、いよ〳〵、ます〳〵健全で榮える。一國にしても、一社會にしても、人々が、自分〳〵の力を十分に發揮し、そして、悠然として、力を出したやうな顏をしない人が多數に有つたならば、その國家·社會は、必ず健全であらうと思ふ。けれども、今の世の中に、そんな人が多く居るか居ないか、それは各自の判斷に任せるが、國家の上でも、社會の上でも、舞臺が大きければ、大きいだけ、建築が壯大であれば壯大であるだけ、これに礎たるところの人、その隱れて力を添へてをる人とかゞ、それだけ多くあつて、且つ、偉大な人でなければならぬ。
  translation: 'で力を発揮しているからこそ、立派で頑丈な家が立っている、ということになる。

    そこで、この道理をいろいろな社会、階層、物事に当てはめて考えると、人の営みのあらゆることに、その中にある人、ある物があって、姿こそ見えないが、しっかりした力を添えているのだろうと思われる。

    今、身近な例を目の前に求めると、庭の木々の新緑は色鮮やかで、見るからに爽快だ。だが、枝や幹など地上に現れている部分が長ければ長いだけ、その根が地中深くにあって、ちょうど家の礎石のような働きをしている。

    こうしたことを順に推し広げ、人間社会について考えてみても同じである。一軒の家にも、その家の礎になっている人がいるだろうし、それだけでなく、陰で力を添えている人もいるだろう。そうした人は一人でも二人でも、多ければ多いほどよい。もし家族全員がそうであれば、その一家はいよいよ健全に栄える。

    一つの国でも社会でも、人々が自分の力を十分に発揮しながら、悠然として、力を尽くしたという顔をしない人が大勢いたなら、その国家や社会は必ず健全だろうと思う。

    しかし、今の世にそういう人が多いか少ないかは、各自の判断に任せよう。国家でも社会でも、舞台が大きければ大きいだけ、建物が壮大なら壮大なだけ、その礎となる人、陰で力を添える人が、それだけ多く、しかも偉大な人でなければならない。'

  section: 不轉不動なれ／三 無碍自在妙の手段を
  original: '三、無碍自在妙の手段を


    云ふまでも無いことであるが、不轉不動といつたからとて、唯だヂツとして居つて動かない、束縛せられてあるものゝ如きを云ふのでは無い。若し、それであれば決して、自由の活きは得られない。轉と不轉と、動と不動とを超越してをつて、而も轉と不轉に處し、動と不動に處するので、動靜の二相を超越してをつて、動靜の二相に應じて行くのである、動中に處して動に束縛されず、靜中に處して靜に罣碍されず、動靜ともに其れに應ずること宜しきを得て、無碍自在の妙用を現ずるのである。毀譽の間に處するが如き、毀譽褒貶を超越して其れに束縛されず、而も、毀譽褒貶に應ずること宜しきを得なければならぬ。日蓮上人の如き、法然上人の如き、毀譽に超越しながら、毀譽の間に處して、その宜しきに從ひ弘法されたのである。觀'
  translation: '三　とらわれのない自在な働きを


    いうまでもないが、揺るがず動じないといっても、ただじっとして動かず、縛られたもののようになっていることではない。もしそうなら、決して自由な生きた働きは得られない。移ることと移らないこと、動くことと動かないことを超えながら、しかもその双方の中にいる。動と静という二つの姿を超えながら、その二つの姿に応じていくのである。動きの中にいて動きに縛られず、静けさの中にいて静けさに妨げられず、動静のどちらにも適切に応じ、とらわれのない自在な働きを現すのである。

    悪口や称賛の中にいるときも、評判の良し悪しを超えてそれに縛られず、しかも適切に対応しなければならない。日蓮上人や法然上人は、悪評や好評を超えながら、その中に身を置き、状況にふさわしく教えを広めたのである。観'
  notes:
  - 末尾は次スキャンへ続く。

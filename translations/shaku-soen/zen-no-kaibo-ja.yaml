- id: zen-155-01
  scan: 155
  section: 武士道を他にも及ぼせ／七 佛敎を誤解する勿れ
  original: は、とても出來ないことゝ思つて居る。けれども、佛敎には、「奇なる哉、一切衆生、如來の智慧德相を具足せり」と言つてある。一切諸法の根抵は平等である。然るに、若し、神と人を以て、長く異るものとしたならば、論理上の矛盾を來たすは云ふまでもなく、神人合一の理想の如きは、架空のものとなつて仕舞ふではあるまいか。かくの如き議論は、比較的宗敎學上のことであるから、これ以上、語らぬが、國家は殖產興業が隆盛でなければ發達せぬ。機械力を應用して、生產力を增加することも、學理を應用することも、無論必要ではあるが、更に必要なものは宗敎上より「武士道」の如き立派な道義が、商·工·農業の上に渉つて完全なる日本の道德を發達せしめなければならぬ。從來、一部の人は、佛敎を悲觀的の者のやうに取り扱ひ、未來の爲め、死後の用意の爲めに入要なものゝやうにしてをる。かくて、佛敎は厭世的なりと言はるゝに至つてゐるが、佛敎は決して斯る一方面のみの者ではない。之れも、一部の眞理を道破せるものであるけれども、厭世に對する樂世的方面がある。大乘佛敎は、主として、之れであつて、前述した如く、宗敎の信念が基礎となつて、社會上に於ける活動の原動力となるならば、之れ、謂ゆる「煩惱即菩提」なるものであるし、「娑婆即寂光土」なるものである。大乘佛敎の本意は、之れに外ならざるものである。
  translation: 'は、とてもできないと思っている。しかし、仏教では、

    「なんと不思議なことか。すべての生きものは、如来の智慧と徳を備えている」

    といっている。あらゆる存在の根底は平等なのである。それなのに、もし神と人を永遠に異なるものとするなら、論理上の矛盾を来すのはいうまでもなく、神と人とが一つになるという理想なども、架空のものになってしまうのではないか。

    こうした議論は比較宗教学の問題だから、これ以上は語らないが、国家は産業振興が盛んでなければ発展しない。機械力を応用して生産力を増やすことも、学問の理論を応用することも、もちろん必要である。しかし、さらに必要なのは、宗教から武士道のような立派な道義を引き出し、それを商業、工業、農業にまで及ぼして、日本の道徳を完全に発達させることである。

    従来、一部の人は仏教を悲観的なものとして扱い、来世のため、死後の準備のために必要なもののようにしている。そのため仏教は厭世的だといわれるようになったが、仏教は決して、そのような一つの面だけのものではない。それも真理の一部を言い表してはいるが、厭世に対して、この世を肯定し楽しむ面もある。

    大乗仏教は主にこちらの面に立つ。前に述べたように、宗教の信念が基礎となり、社会で活動する原動力となるなら、それがいわゆる「煩悩即菩提」、煩悩のあるこのあり方が、そのまま悟りであるということだ。また「娑婆即寂光土」、この苦しみの世が、そのまま静かな光に満ちた仏の国であるということだ。大乗仏教の本意は、ほかならぬここにあるのである。'

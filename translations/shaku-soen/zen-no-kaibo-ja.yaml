  section: 大なる樂觀の上に／一、千差萬別の情緒
  original: '一、千差萬別の情緒


    皎々たる光を放つて、大空に輝いてをる一輪の月に對しても、これを見る世人の心は、決して、一樣では無い。或者は、

    月見れば千々に物こそ悲しけれ

    わが身ひとつの秋にあらねど

    と咏じ、或者は、また、

    此世をば我が世とぞ思ふ望月の

    缺けたることの無しと思へば

    と詠じて、各、異つた感懷を漏らしてをる。月そのものに在つては、決して、喜怒哀樂の情が存するのでは無い。これを見る人々の心に千差萬別の情緒が湧くのである。

    面白い愉快な心を懷いて居る人が月に對したならば、月の光も面白く愉快に思はれるであらう。悲しく情けなく感じて居る人が月に對したならば、一層、悲しみを增し、淚を催すの種となるであらう。

    牀前明月光　疑是地上霜

    擧頭望山月　低頭思故鄕

    は、月に對して、故鄕を思ふの作である。

    獨上江樓思渺然　月光如水水連天

    同來翫月人何處　風景依稀似去年

    は、月光に對して、同遊の故人を思ふての作である。

    獨上高樓望八都　黑雲散盡月輪孤'
  translation: '一　さまざまな感情


    澄みきった光を放って大空に輝く、一輪の月を眺めても、それを見る人々の心は決して同じではない。ある人は、

    「月を見れば、さまざまなことが悲しく感じられる。自分一人だけに訪れた秋ではないのに。」

    と詠み、またある人は、

    「この世は自分のための世だと思う。満月に欠けたところがないように、私にも満ち足りないところは何もないのだから。」

    と詠んで、それぞれ違った思いを述べている。月そのものに喜怒哀楽があるのではない。それを見る人々の心に、さまざまな感情が湧くのである。

    楽しく愉快な気持ちの人が月を見れば、月の光も楽しく愉快に感じられるだろう。悲しく心細く思っている人が月を見れば、悲しみはいっそう増し、涙を誘うものとなるだろう。

    「寝床の前には、明るい月の光。

    地上に霜が降りたのかと思う。

    頭を上げて山にかかる月を眺め、

    頭を垂れて故郷を思う。」

    これは月を見て、故郷を思った詩である。

    「一人、川辺の楼閣に上れば、思いは遠く広がる。

    月の光は水のようで、水は空へと続いている。

    共に来て月を楽しんだあの人は、今どこにいるのか。

    風景は、ほのかに去年のままに見える。」

    これは月の光を見て、かつて共に遊んだ友を思った詩である。

    「一人、高い楼閣に上り、八方の都を望む。

    黒雲はすべて散り、月だけがぽつんと浮かぶ。

    広大な宇宙には、数え切れないほどの人がいる。

    その男たちのうち、真に志ある立派な男は何人いるのか。」'
  notes:
  - 原文末尾の漢詩はscan75へ続く。訳では四句をこの単位にまとめた。「望八都」は底本の表記に従った。

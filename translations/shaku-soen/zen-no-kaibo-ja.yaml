  section: 驢を渡し馬を渡す／六、喫粥し了れりや
  original: ハイ、最う、食べてしまひましたと答へると、和尙は、「鉢盂を洗ひ去れ」そんなら、食器を、清潔に洗つて置けと言はれた。まことに、平凡な問答であるが、此の「鉢盂を洗ひ去れ」の一句には、趙州和尙の五臟六腑が光を放つて居る。一體、學人が、五年、十年と修行を積んで居るうちに、大層偉くなつたといふ重荷を擔いで居るものである。また、悟つたにしたところで、その悟りの臭ひがコビリついて居る間は、本當の悟りでは無い。ちやうど、お粥を食べたあと、食器に滓が附着してをるやうでは不可ない、悟りも、迷ひも、一切を放下してしまはなければならぬ。そこを教へられたものである。が、此の萬事放下着の境界は容易なものでは無いよ。
  translation: 'つまり、「はい、もう食べました」という返答である。それを聞くと和尚は、「それなら鉢を洗っておけ」と言われた。食器を清潔に洗っておきなさい、というのである。

    実に平凡な問答だが、「鉢を洗っておけ」の一言には、趙州和尚の全身全霊が光を放っている。そもそも修行者は、五年、十年と修行を積むうちに、「自分はたいそう偉くなった」という重荷を背負いがちである。また、悟ったとしても、その悟りのにおいがこびりついている間は、本当の悟りではない。ちょうど粥を食べたあと、食器にかすが残っているようではいけない。悟りも迷いも、すべて手放してしまわなければならない。そのことを教えたのである。しかし、この万事を手放しきった境地に至るのは、たやすいことではない。'

  section: 不轉不動なれ／二 八風吹けども動ぜず
  original: 中道實相であつて、即ち、不轉不動の境界である。世間には、名利の爲めに、節を賣り不義を行はざる人間が果して幾人あらうか。毀譽褒貶に動かされずして、能く此れに超然たり得る者が幾人あらう。「人若し我れを呼ぶに馬を以てせば、我れは馬を以て答へん。人、若し、我れを呼ぶに牛を以てせば、我れは牛を以て答へん」といふほどの修養ある者は、指を屈するほども無からうと思ふ。日蓮宗の開祖、日蓮上人は、有らゆる迫害と誹謗を蒙りながら、胸中、何等の悶えなく、「惡言は是れ功德なり」と甘受して、極めて平和に、極めて勇猛に、爲人度生に努められた。己れの胸中に一點疾しき所がなく、善なり、正なりと信じて疑ふところが無かつたならば、世を擧つて罵るも何かあらん。孟子の謂ゆる千萬人と雖も我れ行かんで、坦々たる大道を大手を振つて行くの感があらう。これ、即ち、「八風吹けども動ぜす天邊の月」なる境界である。
  translation: '中道実相、偏りを離れた真実のあり方であり、つまり揺るがず動じない境地なのである。

    世間には、名誉や利益のために節操を売り、不義を行わずにいる人間が、いったい何人いるだろう。悪口や称賛、ほめる言葉やけなす言葉に動かされず、それを超えた立場にいられる人が何人いるだろう。「人が私を馬と呼ぶなら、私は馬として答えよう。人が私を牛と呼ぶなら、私は牛として答えよう」というほど修養のある者は、指を折って数えるほどもいないだろうと思う。

    日蓮宗の開祖、日蓮上人は、あらゆる迫害と誹謗を受けながら、胸の内には少しも苦悶なく、「悪口を受けることは功徳になる」と甘んじて受け入れ、きわめて平和に、きわめて勇猛に、人々を救うことに努めた。自分の胸の内に少しもやましいところがなく、善であり正しいと信じて疑わないなら、世間中がののしっても、何ほどのことがあろう。孟子のいう、千万人が相手でも私は進む、ということで、平らかに広がる大道を、大手を振って歩くような気持ちだろう。これが、「八風が吹いても動じない、天空の月」という境地なのである。'

  section: 智情意の三修養／三 理・智・用の完全を
  original: '三、理·智·用の完全を


    ハーバート大學の、故ゼームスといふ人は、「心といふよりも、先づ、身體に重きを置いて身體を取り亂さぬやうにせよ」と敎へて居るが、我れ〳〵の眼に淚をこぼすから悲しい氣になり、顏が緩むから可笑しい氣になるのだといふのである。それで、門下生に、平素、座禪のやうなことをさせた。即ち、姿勢を正しくして、全身の力を氣海丹田、即ち、臍の下に滿たして默考させた。そんな鹽梅で、修養といふことも、身體の上から、いろ〳〵爲ねばならぬことが澤山ある。坐るやうなことばかりで無く、冷水摩擦であるとか、海水浴であるとか或ひは、深呼吸法であるとか、擊劍とか、柔術とかで、すべて其中に修養の氣が含'
  translation: '三　理・智・用を完全に


    ハーバード大学の故ジェームズという人は、

    「心というより、まず身体を重んじ、身体を取り乱さないようにせよ」

    と教えている。私たちは目から涙をこぼすから悲しい気持ちになり、顔がほころぶからおかしい気持ちになるのだ、というのである。それで、門下生に普段から座禅のようなことをさせた。姿勢を正し、全身の力を気海丹田、つまりへその下に満たして、黙って考えさせたのである。

    このように修養についても、身体の面から行わなければならないことがたくさんある。座ることだけでなく、冷水摩擦や海水浴、深呼吸法、剣術や柔術など、すべてその中に修養の要素が含'
  notes:
  - 「ハーバート大學の、故ゼームス」はハーバード大学のウィリアム・ジェームズを指すとみられる。座禅をさせたという記述も原著の叙述に従う。
  - 末尾は次スキャンへ続く。

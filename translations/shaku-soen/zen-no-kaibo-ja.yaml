  section: 向上と向下の修行／三 向上と向下は離る可らず
  original: '三、向上と向下は離る可らず


    禪門に於ては、常に向上向下相離る可からざることを說く。禪門に於ける向上は、佛何物ぞ、我れ何物ぞと、一切萬有を超越した精神をいふのである。一切衆生悉有佛性の見地よりすれば、物と我れと毫も尊卑の別はない。無差別平等である。丹霞の天然禪師が、曾て、洛東の慧林寺に行つた時、丁度、冬の最中で、寒氣凛烈たるものがあつたから、早速、本堂から佛壇の木像を擔ぎ出して火にくべ、不作法にも股火をしてあたつて居つたのを、慧林寺の院主が見て叱りつけると、叱りつけた院主に罸が中つたといふ話があるが、丹霞の手許には、佛像だから有難いの、'
  translation: '三　向上と向下は切り離せない


    禅では、向上と向下はいつも切り離してはならないと説く。禅でいう向上とは、仏が何者か、私が何者か、と、あらゆる存在を超越した精神をいうのである。すべての生きものには仏性がある、という立場からすれば、物と自分との間に少しも尊卑の違いはない。差別なく平等である。

    丹霞の天然禅師がかつて洛陽の東の慧林寺へ行ったとき、ちょうど真冬で、寒気が厳しかった。そこでさっそく、本堂の仏壇から木の仏像を担ぎ出して火にくべ、不作法にも股を広げて火にあたっていた。それを慧林寺の院主が見てしかりつけると、しかった院主のほうに罰が当たったという話がある。しかし丹霞のところには、仏像だからありがたいとか、'
  notes:
  - 末尾は次スキャンへ続く。

  section: 禪と鎌倉武士／二、鎌倉に於ける宗教
  original: '二、鎌倉に於ける宗教


    賴山陽であつたと思ふ、何分、小供の時に讀んだのだから、言葉通りには覺えては居らぬが、鎌倉時代のことに就いて、此んな意味のことを言つて居つた。「鎌倉の武力といふものは、關八州の其れに敵する。それで、關八州は何ケ國に敵するかと云ふと、日本六十餘州に敵する。」扨て、それなら、日本全國の武力は、世界にも敵するか知らぬが、それは、今日、言ふところで無い。これは武力について言つたことであるが、當時、鎌倉に於ける宗教······宗教と云つても、今まは佛教各宗についての宗教で、鎌倉は政治に於ても新機軸を出して居るし、武力に於ても今ま言ふが如く强大なものであつた。それと同時に、佛教と云ふことに就いても、鎌倉が一新紀元を劃してをると云つてよからうと思ふ。それより遡つて、奈良朝時代の佛教とか、天朝時代の佛教と云ふものが固より有つたにも拘らず、鎌倉といふ時代に至つて、初めて、佛教中の新宗教といふものが起つたので、これは、其邊の歷史を調べてをられる人は能く承知であらうと思ふ。今ま衲が記憶から浮かんだことを名稱だけ擧げると、鎌倉時代に起つたのは、時宗

    融通念佛宗

    淨土宗

    淨土眞宗

    日蓮宗

    禪宗

    などで、其等が鎌倉時代の新宗教といつても可からうと思ふ。若し、之れを、鎌倉時代に於ける新宗教と言はゞ、その前のは舊佛教と言つても差支へないと思ふ。'
  translation: '二　鎌倉の宗教


    頼山陽だったと思う。子供のころに読んだので、正確な言葉は覚えていないが、鎌倉時代について、次のような意味のことを言っていた。

    「鎌倉の武力は、関東八か国の武力に匹敵する。では、その関東八か国は何か国に匹敵するかといえば、日本の六十余国に匹敵する。」

    それなら日本全国の武力は世界にも匹敵するかもしれないが、それは今日の話題ではない。これは武力についての話だが、当時の鎌倉における宗教――ここでは仏教の各宗派を指す――も考えてみたい。鎌倉は政治で新しい仕組みを打ち出し、武力も今述べたように強大だった。それと同時に、仏教についても、鎌倉が新しい時代を開いたといってよいと思う。

    それ以前に、奈良朝時代や天朝時代の仏教がすでにあったにもかかわらず、鎌倉という時代になって、初めて仏教の中に新しい宗教が起こった。このあたりの歴史を調べている人は、よくご存じだろう。今、記憶に浮かぶ名前だけを挙げれば、鎌倉時代に起こったものは、時宗、融通念仏宗、浄土宗、浄土真宗、日蓮宗、禅宗などである。これらを鎌倉時代の新宗教といってよいと思う。これを鎌倉時代の新宗教と呼ぶなら、その前のものを旧仏教と呼んでも差し支えないだろう。'
  notes:
  - 「天朝時代」は底本の表記を保留。前後の趣旨は、鎌倉以前の宮廷を中心とする仏教を指す。
  - 各宗の成立時期の括り方は、著者の歴史認識を保持した。

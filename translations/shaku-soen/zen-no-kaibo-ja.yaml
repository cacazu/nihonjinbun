  section: 向上と向下の修行／二 行は童子の足下を拜す
  original: '二、行は童子の足下を拜す


    進歩發達は誠に必要なことである。向上の精神がなくては、人間は、遂ひに、死物となつてしまふの外はない。併し乍ら、向上〳〵と言つて上ばかり見てをると、'
  translation: '二　行いでは子どもの足もとを拝む


    進歩発達はまことに必要である。向上する精神がなければ、人間はついには生気のないものになってしまうほかない。しかし、向上、向上といって上ばかり見ていると、'

- id: zen-174-02
  scan: 174
  section: 自性の徹見／三、八面玲瓏の眞面目
  original: '三、八面玲瓏の眞面目


    今ま禪を代表した分り易い語を求めたならば「主人公」といふ語であるが、此の主人公といふのは、つまり、佛性、眞性であつて、即ち、眞空妙有である。惠心僧都が、「差別なきの平等は惡平等、平等なきの差別は惡差別なり」と道破された如く、眞空は妙有、妙有は眞空で、此の不即不離のところが、禪の言ふ可からざる絕妙の味ひあるところである。禪は、帝國主義のやうな點、社會主義のやうな點、個人主義のやうな點、自然主義のやうな點、本能主義のやうな點、その他、いろ〳〵の形を備へてをるが、盧山の眞面目は八面玲瓏にして眞空妙有である。彼のルソーの佛國革會思想の如き、又た、無政府主義の如き、これ皆な差別なきの惡平等であつて、眞空妙有の賊である。自由平等の天地は、一切の差別階級を破壞した後でなければ到來せぬと彼等は言ふが、高所は高所で平かぢや、低所は低所で平かぢや、人間、到る所、自由平等の天地を發見し得るのである。春江潮水連海平、海中明月共潮生、ぢや。'
  translation: '三　あらゆる面から透き通る本来の姿

    禅を代表する分かりやすい言葉を求めるなら、「主人公」という言葉になる。この主人公とは、つまり仏性、真の本性のことであり、「真空妙有」である。恵心僧都が、

    「違いを認めない平等は悪い平等であり、平等を認めない違いは悪い差別である」

    と言い切ったように、真に空であることは、そのまま不可思議に存在することであり、不可思議に存在することは、真に空であることにほかならない。同一視も切り離しもできない、この関係に、禅の言葉に尽くせない絶妙な味わいがある。

    禅には、帝国主義、社会主義、個人主義、自然主義、本能主義などに似た面があり、ほかにもさまざまな姿を備えている。しかし、その本来の姿は、どの面から見ても澄み切った真空妙有なのである。

    ルソーのフランス革命思想や無政府主義などは、いずれも違いを認めない悪い平等であり、真空妙有を損なうものだ。彼らは、自由平等の世界はあらゆる差別や階級を壊したあとでなければ来ないという。しかし高い所は高い所で平らであり、低い所は低い所で平らだ。人はどこにいても、自由平等の世界を見いだせるのである。

    「春の川の満ち潮は、海へつながって一面に広がり、海上の明月は、潮とともに昇る」

    ということである。'
  notes:
  - 「主人公」は物語の主役ではなく、自分の本来の主体を指す禅語。「差別」はこの箇所では差異や区別の意。思想・階級についての評価は著者の歴史的立場を保った。
  - 底本は「佛國革會思想」。ルソーへの言及と「かくめい」のルビから、訳文は「フランス革命思想」とした。
  sequence: 254

  section: 信の一字／一、寂寥たる精神界
  original: 然るに、我國にては、斯くの如く、社會の內容根柢に於て、宗教的氣分が漂うては居らぬ。政治家は政治を語り、宗教家は宗教を口にし、實業家は經濟を云々するけれども、我れは政治家なるが故に、我れは教育家·實業家なるが故に、宗教のことは關係せぬといふ體の人が多數である。曾て、米國のブライアン氏が、日本漫遊の歸國後、語つて曰く、「日本に於て、各種の階級の人々と相會し、政治、經濟、法律、商業等の意見を交換した。併し、毫も、宗教に關する意見を耳にせざりしを遺憾とす。日本國民は、斯く宗教を無にして、社會の道德を維持し得るのであらうか、解する能はず」と批評して居る。思ふに、教育と宗教と此の兩者は大いに相提携せなければならぬもので、此事は今更ら、云ふまでも無いことである。云ふのは已に時勢後れの感がある。兎に角、宗教家と教育家は、精神的に相一致して、世運の進歩を助けなければならぬ。然るに、時としては、教育と宗教とは全然背馳し、相ひ併び立たぬ如く考へる者さへある。是くの如きは、如何に物質的に進步著しと雖も、精神界は誠に寂寥たるものである。
  translation: 'ところが日本では、社会の内側、根底に、そうした宗教的な気分が漂っていない。政治家は政治を語り、宗教家は宗教を口にし、実業家は経済を論じる。しかし、自分は政治家だから、教育者だから、実業家だから、宗教には関係しない、といった態度の人が多い。かつてアメリカのブライアン氏は、日本旅行から帰国したあと、次のように述べた。


    「日本では、さまざまな階層の人々と会い、政治、経済、法律、商業などについて意見を交換した。しかし、宗教に関する意見をまったく耳にしなかったことは残念だ。日本国民は、こんなに宗教を顧みずに、社会の道徳を保っていけるのだろうか。理解できない。」


    思うに、教育と宗教は大いに協力すべきもので、これは今さら言うまでもない。口にすること自体、時代遅れの感じさえする。ともかく、宗教家と教育者は精神の面で一致して、世の中の進歩を助けなければならない。それなのに、教育と宗教はまるで相反し、両立しないと考える人さえ、ときにはいる。これでは、物質的な進歩がどれほど著しくても、精神の世界は実に寂しいものである。'

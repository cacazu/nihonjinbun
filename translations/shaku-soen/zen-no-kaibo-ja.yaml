  section: 夙に起き時を使へ／一、一日の計は朝にある
  original: '一、一日の計は朝にある


    社會國家のために傑い仕事を成し遂げた人々の有樣を稽へて見ると、早起きと云ふことは、確かに、其等の事業を成し遂げた一つの要素である。

    今では、何事も、心なき人は、善惡を選ばず外國の風を輸入し、之れを模倣すると云ふ有樣で、遂ひには、朝寢といふ甚だ厭ふべき陋習までも眞似する傾きがあつて、書生の間にも、さう云ふやうなことが、殊更らに見習はれることが、以前は、隨分、あつたやうに思ふ。

    夙に起きると云ふことは、言はゞ一日の之れが初めなんである。古語に、

    「一年の計は、一月にあり。一月の計は、一日にあり。一日の計は、朝にあり」

    といふことが有るが、まことに其の通りである。もう一つ其の奧もあるが、其れは言はぬ方が宜からう。

    一年の間に、或る仕事を立派に仕上げると仕上げざるとは、實に、最初の出發點の如何んにあるのぢやが、それは、一寸の機會からで、其の機會を捉らへるのも、逃がすのも、亦た一寸の違ひからである。

    千里の道を行くにも、必ず、第一步から始まる。物の出來ると否なとは僅かの違ひである。滴水も、集まり蒐まつて、やがて、河となり、大海となりて、漲天の勢ひを成すといふ有樣、こんな事は、別に、言はないでも分り切つたことであるが、大いに味はふ必要があると思ふ。'
  translation: '一　一日の計画は朝にある


    社会や国家のために大きな仕事を成し遂げた人たちのあり方を考えてみると、早起きは確かに、その事業を成し遂げる要因の一つになっている。

    今では、何事につけても、思慮のない人は善悪を選ばず外国の習慣を取り入れ、まねをする。ついには、朝寝という、たいへん好ましくない悪習までまねる傾向がある。以前は学生の間でも、そのようなことがことさらに見習われる場合が、ずいぶんあったように思う。

    早く起きることは、いわば一日の出発点である。古い言葉に、「一年の計画は一月にあり、一月の計画は一日にあり、一日の計画は朝にある」とあるが、まことにそのとおりである。さらにもう一つ奥の意味もあるが、それは言わないほうがよいだろう。

    一年のうちに、ある仕事を立派に仕上げられるかどうかは、実に、最初の出発点にかかっている。それはほんのわずかな機会によるもので、その機会をつかむか逃すかも、わずかな違いなのである。

    千里の道を行くにも、必ず第一歩から始まる。物事が成るか成らないかは、わずかな違いである。一滴の水も集まりに集まれば、やがて川となり、大海となって、天にみなぎるほどの勢いをなす。このようなことは言わなくてもわかりきっているが、十分に味わう必要があると思う。'

  section: 向上と向下の修行／三 向上と向下は離る可らず
  original: 枯木の枝だから詰まらないのと云ふ尊卑輕重の差別は無い。これは、丹霞が向上の玄底を叩いて爲人の作略を示したのであるが、而かも、丹霞は、一面に、かくの如き大見識を持してをると共に、一面には、極めて行持の綿密なるものがあつたのである。丹霞の如きは、實に、「意は毘盧の頂𩕳を踏んで、行ひは童子の足下を拜する」ものである。世間日常の事の上にも、向上と向下、進歩と退歩とが常に離れず行はれねばならぬ。それ故、儒敎に於ても、或時は孟子が「舜何人ぞ我れ何人ぞ」と敎へ、或時は曾參が「日に我身を三省す」と云つた。禪門の上から見ても、向上と向下とは離る可からざるものである。知目行足といふが、目でのみ見ても、足で進まねば目的のところに達することは出來ぬ。向上の知、如何に高くても、向下の行、之れに伴はずんば、修行の上乘に達したものであると云ふことは出來ぬ。
  translation: '枯れ木の枝だからつまらない、といった尊卑や軽重の差別はない。これは丹霞が、向上の奥底を極め、人を導くための手だてを示したのである。しかも丹霞は、一方でこれほどの大きな見識を持つとともに、他方では日々の修行や行動にきわめて細やかなものがあった。丹霞こそ、まさに「志は毘盧遮那仏の頭のてっぺんを踏み越え、行いでは子どもの足もとを拝む」人だったのである。

    日常の事柄でも、向上と向下、進むことと退いて省みることは、常に離れずに行われなければならない。それゆえ儒教でも、孟子は「舜とは何者か、私とは何者か。自分にも同じことができる」と教え、曾参は「日に幾度も自分の行いを省みる」といった。禅の立場から見ても、向上と向下は切り離せないものである。「知は目、行は足」というが、目で見ているだけで、足で進まなければ、目指すところに着くことはできない。向上の知識や悟りがどんなに高くても、向下の実践が伴わなければ、修行の最上の境地に達したとはいえないのである。'
  notes:

  section: 人生は大夢なり／一、五蘊の所成の身
  original: 人生は大夢なり一、五蘊の所成の身「佛曰はく、阿難よ、想蘊盡きる者は、此人、平生、夢想消滅して、而も寤寐恒一なり。」と楞嚴經の中にある。想蘊といふのは、五蘊の一つであつて、五蘊といふのは、色蘊、受蘊、想蘊、行蘊、識蘊の五つである。蘊は、積聚の義で、色蘊といふのは、一切の質礙あるものゝ總稱である。分り易く云ふと、物質のことである。次ぎに、受蘊は、外界から受ける感觸で、即ち、外界からものを受取る心の働きである。それから想蘊は、一口に云ふと、想像である。行蘊は、遷流の義で、水の遷り流るゝが如くに、それから其れへと絕えず移り行く心の働きである。識蘊は、意識の中に
  translation: '一　五蘊が形づくる身


    『楞厳経』には、次のようにある。

    「仏はおっしゃった。阿難よ、想蘊が尽きた人は、ふだんから夢や妄想が消え去り、目覚めていても眠っていても、いつも一つの境地にある。」


    想蘊とは五蘊の一つで、五蘊とは、色蘊・受蘊・想蘊・行蘊・識蘊の五つである。「蘊」は、集まりという意味だ。色蘊とは、形を持ち場所を占めるものすべての総称で、わかりやすくいえば物質である。次の受蘊は、外界から受ける感覚、つまり外から物事を受け取る心の働きだ。想蘊は、一言でいえば想像である。行蘊は、移り流れるという意味で、水が流れていくように、あれからこれへと、絶えず移り変わる心の働きである。識蘊は、意識の中に'
  notes:
  - 末尾は次コマへ続く。

  section: 隱德を積め／一 隱れたる土臺石
  original: '隱德を積め


    一、隱れたる土臺石


    骨折損を比喩へて「緣の下の力持ち」と云つてをるが、此の言葉を能く〳〵味はつてみると、深い眞理が含まれてをるやうに思ふ。或る立派な家屋があるが、柱も閾も頗る堅固で、實に宏壯な建築である。ところで、その宏壯な建築の陰には、或るものが潜んでをる。それは何んであるかと云へば、即ち、緣の下の石で、言ひ換へれば礎であるが、其家の座敷へ通つただけでは、礎は、一寸、眼につかぬ。けれども、その家屋が、立派に、そして、堅牢に立つてをるのは、緣の下の石、即ち、礎が堅固であるからである。人に見て貰はなくとも可いといふ鹽梅であるから、從つて、人の氣に着かぬが、氣の着かぬとこ'
  translation: '隠れた善行を積め

    一　隠れた土台石


    人に認められない苦労をたとえて「縁の下の力持ち」というが、この言葉をよくよく味わってみると、深い真理が含まれているように思う。

    ある立派な家がある。柱も敷居もたいへん頑丈で、実に大きく堂々とした建築である。ところが、その壮大な建物の陰には、あるものが隠れている。それは何かといえば、縁の下の石、言い換えれば礎石である。その家の座敷へ通っただけでは、礎石はちょっと目に入らない。しかし、その家が立派に、そして堅固に立っているのは、縁の下の石、つまり礎石がしっかりしているからである。人に見てもらわなくてもよいという具合だから、人には気づかれない。しかし、その気づかれないところ'

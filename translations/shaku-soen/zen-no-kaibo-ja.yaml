  section: 向上と向下の修行／一 進歩か然らずんば退歩
  original: '向上と向下の修行


    一、進歩か然らずんば退歩


    世界の文物は、日に〳〵進步發達をしてをる。殊に、最近、二十年間といふものは、政事に、法律に、經濟に、軍事に、敎育に、有らゆる方面に非常な勢ひを以て進步發達をしてをる。世間戰亂の爲めに、一時、諸種の事業が其の發達を阻止せられた觀があるが、併し乍ら、此の戰爭によつて、一層、種々の點に於て、改良發達の必要が認められ、戰後は、列國が、其の國力の回復を計ると共に、非常な努力を以て進歩發達を企圖しつゝあるのである。進步と退步とは相對的なもので、一方が進步するに對して、他方が進步しなければ、其の進步せぬものは、唯だ進步せぬばかりでなく、それが、やがて、退歩となることは、かの汽車の走つてをる時に、窓外の物を見ると、皆な後へ〳〵と走つてをるやうに思はれると同じである。一切が進步する其中に在つて、我れのみ進歩しなければ、我れは即ち退歩するものである。進步か然らずんば退步である。我れ〳〵は一刻も油斷せず大いに世と共に進步しなければならぬ。國家は國家として進歩向上に努め、個人は個人として發達を計ることは刻下の急務であつて、殊に、歐州諸國は、戰後、大いに緊張した精神を以て努力してをるから、我が國民たる者も、これに劣らぬ緊張した精神を以て國運の發展を計らなければならぬ。'
  translation: '向上と向下の修行

    一　進歩か、それとも退歩か


    世界の文化や制度は、日に日に進歩発達している。とりわけ最近の二十年間は、政治、法律、経済、軍事、教育と、あらゆる方面で非常な勢いで進歩発達している。世の戦乱のため、一時はさまざまな事業の発展が妨げられたように見える。しかしこの戦争によって、いっそう多くの点で改良と発展の必要が認められ、戦後は各国が国力の回復を図るとともに、非常な努力をして進歩発達を目指しているのである。

    進歩と退歩は相対的なものだ。一方が進歩するのに他方が進歩しなければ、その進歩しないものは、ただ進歩しないだけでなく、それがそのまま退歩になる。走る汽車の窓から外を見ると、物がみな後ろへ後ろへ走っているように思われるのと同じである。

    すべてが進歩する中で、自分だけが進歩しなければ、自分は退歩するのである。進歩するか、そうでなければ退歩するかだ。私たちは一刻も油断せず、大いに世の中とともに進歩しなければならない。国家は国家として進歩向上に努め、個人は個人として成長を図ることが、今すぐの急務である。とくにヨーロッパ諸国は、戦後、大いに気を引き締めて努力しているのだから、日本国民も、それに劣らず引き締まった精神で国の発展を図らなければならない。'

  original: 三、道は神と共にあり孔子の「一もつて之れを貫く」の「一」は、決して、二に對するの一でもなく、三に對するの一でもない。先師、洪川和尙は、「一とは數の義にあらず。凡そ、道の體たるや、甚だ言ひ難し。其の用たるや、亦た、測られず。」
  translation: '三　道は神とともにある


    孔子の「一つのもので貫く」の「一」は、決して二に対する一でも、三に対する一でもない。亡き師、洪川和尚は、

    「一とは、数という意味ではない。道の本体は、実に言葉で表し難い。その働きもまた、測ることができない」'

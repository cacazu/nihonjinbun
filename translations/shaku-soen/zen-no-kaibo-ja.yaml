- id: zen-031-01
  scan: 31
  section: 信の一字／三、美花は汚土に生ず
  original: 國の忠とか孝とかは徹底してゐるが、胡魔化しがあると思ふ。舊道德は狭いと思はれる。忠孝を傷けてゐるものが有る。即ち、忠孝の美德を有する人にして、商業上の不德などを省みない者がある、決して、忠孝を傷けようとするのでは無いが、深く考へぬから斯ういふごとになるのである。社會問題は今後の問題である。謂ゆる權利義務の觀念盛んになり、貧富の懸隔が甚しくなり、地主對小作人、資本對勞働者等の難問題が續出しようが、今日は學問も智識も普及的になつて來た、社會的に進んで來た、心持ちの異なつた多數の人が一所になつてゐると難しくなる。この間に於て、如何にして社會の平和を保つかと云ふに、之れ、唯だ、宗教的情操信を以てするより外はない。この信が同情心ともなり、慈悲心ともなる。この信があつて、家庭の平和も保たれ、社會の平和も維持せられる。かく宗教的情操が社會に遍滿すれば、社會の心となつて、各方面の各事業は活躍して社會の幸福を受くることが出來る。
  translation: 'では忠や孝は徹底しているが、ごまかしがあるように思う。従来の道徳は狭いと思われる。忠孝を損なっているものがあるのだ。つまり、忠孝の美徳を備えていながら、商取引上の不道徳などは省みない人がいる。決して忠孝を傷つけるつもりではないが、深く考えないために、こうなるのである。


    社会問題は、これからの問題だ。権利や義務という考えが盛んになり、貧富の隔たりが大きくなって、地主と小作人、資本家と労働者の対立など、難しい問題が次々に起こるだろう。今日では学問や知識も広く普及し、社会全体に行き渡ってきた。考え方の異なる大勢の人々が一緒になっていれば、物事は難しくなる。その中で、どうすれば社会の平和を保てるのか。それには、宗教的な心情である信によるほかない。この信が同情心ともなり、慈悲の心ともなる。この信があるから、家庭の平和も社会の平和も保たれる。こうして宗教的な心情が社会全体に満ちれば、それが社会の心となり、各方面のさまざまな事業が活発に働いて、社会の幸福を享受できるのである。'
  notes:
  - 冒頭は前コマからの続き。

  section: 差別に處する難／二、差別觀念は建設思想
  original: '二、差別觀念は建設思想

    併し、人間に、平等觀念ばかりがあつて、差別觀念が無くなつてしまへば、世の中は、まるで、闇黑の中で獸が相擊つ如き雜然たる狀態に陷るものである。

    「花は紅、柳は綠」

    とは、他なし、人間の差別觀である。此の差別觀に入るには、平等思想に到達するよりも、遙かに大なる智慧を要し、遙かに多くの經驗をも積まねばならぬのである。

    蓋し、差別觀念は、平等觀念の如く破壞的性質を帶びず、建設的性質のもので、原始的の思想でないからだ。差別思想は平等思想よりも更らに進步し、更らに成熟した思想である。'
  translation: '二　違いを認める考えは、建設する思想


    しかし、人間に平等という考えばかりがあって、違いを認める考えがなくなってしまえば、この世は、真っ暗な中で獣同士がぶつかり合うような、混乱した状態になる。


    「花は紅く、柳は緑」


    とは、ほかでもない、人間がものの違いを認める見方である。この見方に至るには、平等思想へ到達するよりも、はるかに大きな智慧が必要であり、はるかに多くの経験を積まなければならない。


    なぜなら、違いを認める考えは、平等思想のような破壊的な性質ではなく、建設的な性質を持ち、初歩的な思想ではないからだ。違いを認める思想は、平等思想より、さらに進歩し、成熟した思想なのである。'

  section: 向上と向下の修行／二 行は童子の足下を拜す
  original: 得て溝の中へ落ち易い。眼は高く天を望むべきも、足は一刻も地を離るゝことは出來ぬ。我れ〳〵は進步向上を計る間に於て、常に自己の脚下を照顧することを怠つてはならぬ。今日の人々は、物質上の進步發達を望むことは
    甚しいもので、物質上の利益を得んが爲めには、奮勵努力して、一刻も空しうせざる有樣であるから、今更、此の方面に於ける進步發達を獎勵する必要は無いと云つても可いほどである。あまりに發展向上を望む結果、遂ひに道德を無視し、人道を蹂躙して恬として耻ぢぬといふ有樣である。そこで、古人も、「意は毘盧の頂𩕳を踏んで、行ひは童子の足下を拜す」と訓へられた。心は高い處を望むべきであるが、そこに達する行ひは細心の注意を拂つて人道に反せず、道義を無視せぬやうに努むべきである。「意は毘盧の頂𩕳を云々」といふ語は、禪門の修行上について云つたのであるから、これを以て直ちに處世上のことに關する敎訓として當て箝めるのは聊か妥當を缺くの嫌ひがあるが、その意を得る時んば、直ちに以て處世の箴となすことが出來ると思ふ。
  translation: 'ともすれば溝に落ちやすい。目は高く天を望むべきだが、足は一刻も地を離れることはできない。私たちは進歩向上を図る間も、常に自分の足もとを顧みることを怠ってはならない。

    今日の人々は物質的な進歩発達を非常に強く望み、物質的な利益を得るためなら奮い立って努力し、一刻も無駄にしないありさまである。だから、今さらこの方面の進歩発達を奨励する必要はないといってよいほどだ。あまりに発展向上を望む結果、ついには道徳を無視し、人道を踏みにじりながら、平然として恥じないありさまである。

    そこで昔の人も、「志は毘盧遮那仏の頭のてっぺんを踏み越えるほど高く持ち、行いでは子どもの足もとを拝むほど謙虚であれ」と教えた。心は高いところを望むべきだが、そこに達するための行いには細心の注意を払い、人道に背かず、道義を無視しないよう努めるべきである。

    「志は毘盧遮那仏の頭のてっぺんを……」という言葉は、禅の修行について述べたものだから、それをそのまま世渡りの教訓に当てはめるのは、少々妥当でないところもある。しかし、その真意をくみ取れば、日々の暮らしの戒めにできると思う。'
  notes:
  - 「頂𩕳」（ちょうねい）は頭頂のこと。
  - 冒頭は前スキャンから続く。

  section: 宗敎的善行／二、達磨大師の無功德
  original: '二、達磨大師の無功德


    梁の武帝といへば、學問に造詣深く、悟道、亦た、尋常ならざるものあり、佛心天身と呼ばれて、數百卷の著書を遺せし程の人であるが、或時、達磨大師に向ひ、「朕は、建寺、度僧、その他、有らゆる善根を施したが、これに對して、如何なる功德があるであらうか。」と尋ねられた。大師は、聞くと、言下に、「無功德」と答へられた。これは、大なる善行には報酬は無いものであることを意味するので'
  translation: '二　達磨大師の「無功徳」

    梁の武帝は学問に深く通じ、道を悟ることでも並外れていて、「仏の心を持つ天子」と呼ばれ、数百巻の著書を残したほどの人だった。その武帝があるとき達磨大師に、「私は寺を建て、僧を育てるなど、あらゆる善いことを行ってきたが、これにはどのような功徳があるだろうか」と尋ねた。大師はそれを聞くと、即座に「無功徳――功徳などない」と答えた。これは、大きな善行には報酬がないことを意味するので'
  notes:
  - 末尾の文はscan157へ続く。
  sequence: 223
- id: zen-157-01
  scan: 157
  section: 宗敎的善行／二、達磨大師の無功德
  original: ある、大師の喝破したるところは、遉に其の眞を誤らない。無功德は取りも直さず大功德である。山に比較した大と云ふのでは多寡が知れて居る。絕對無限の大は虛無に等しいもので、無限大の功德は無功德と同じい。例へば、太陽は萬物を化育する。而も、太陽は何等の報酬を求むる心がない。縱し、太陽に心なくとも、物象は爾かく語つて居る。その無限大なる善事に對しては功德として計量し得られるものが無い。即ち、無功德である。功德を求めざる善行は實に淸々しいものである。
  translation: 'ある。大師が言い切ったことは、さすがに真実を外していない。「無功徳」は、ほかでもない大功徳なのである。山と比べて大きいという程度では、たかが知れている。絶対・無限の大きさは、何もないことと等しく、無限大の功徳は無功徳と同じなのである。

    たとえば太陽は、あらゆるものを育てる。しかも太陽には、何の報酬も求める心がない。太陽に心がなくても、現象そのものがそう語っている。その無限大の善い働きには、功徳として量れるものがない。つまり無功徳である。功徳を求めない善行は、実にすがすがしい。'
  notes:
  - 冒頭はscan156から続く。

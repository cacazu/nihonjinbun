  section: 圓朝の新桃太郞
  original: 「桃太郞の話がよい」と言はれる。圓朝は怪訝な顏をして、「桃太郞の話と申しますと、あの小供に能く聞かす鬼退治の話で御座いますか」と訊き返すと、居士は、「左樣〳〵、あれ〳〵、あれは本當に面白い話であつた」と云はれるので、圓朝も呆氣にとられて默つて居ると、居士は、「私が小さい時に、母に添寢をして貰つて、よくあの話を聞かされたが、本當に面白くて、何時とはなしに睡氣を催したものだ。その面白味は今に忘れない。話下手の母がしてさへ其の通りであるから、名人の聞こえ高いお前の話なら、さぞかし面白いことであらう。早く話してくれ」と催促される。圓朝は困つてしまつた。やはり、默つてをると、居士は、「お前は桃太郞の話さへ出來んのか、それぢや名人も何もあつたものでない。大の話下手だ。歸つたら舌を切り口を結んで語ることを工夫してみよ」と云はれた。それから、圓朝は、奮勵して、切りに苦心工夫を凝らしてをつた。すると、同じく鐵舟居士について學んでをる同僚が、度び〳〵訪ねて來て、「何うだ、出來たか〳〵」と訊くので、いよ〳〵窮し、寄席の晝席、夜席に往復する車の上でも、絕えず工夫して、寢食を忘れると云ふ有樣であつた。此くの如く沈思默考すること三年に及んで、辛と一條の活路を發見した。そこで、居士を訪ねて、「先生、今日は一つ桃太郞の御話をいたましよう」と云ふと、居士は、「今日は聞きたく無い」と云はれた。其後、法會があつて、嵯峨の天龍寺の滴水和尙も來られ、圓朝も、居士に招かれ
  translation: '「桃太郎の話がよい」

    という。円朝は不思議そうな顔をして、

    「桃太郎のお話といいますと、あの、子どもによく聞かせる鬼退治のお話でございますか」

    と聞き返した。居士は、

    「そうそう、あれだ、あれだ。あれは本当に面白い話だった」

    というので、円朝もあっけに取られて黙っていると、居士は、

    「私が小さいころ、母に添い寝をしてもらい、よくあの話を聞いたが、本当に面白くて、いつの間にか眠くなったものだ。その面白さは今も忘れない。話の下手な母がしてもそうなのだから、名人の評判が高いお前の話なら、さぞ面白かろう。さあ、早く話してくれ」

    とせき立てる。円朝は困ってしまった。やはり黙っていると、居士は、

    「お前は桃太郎の話さえできないのか。それでは名人も何もあったものではない。大変な話下手だ。帰ったら、舌を切り、口を閉じたまま語るにはどうすればよいか、工夫してみよ」

    といった。それから円朝は奮い立ち、ひたすら苦心して工夫を重ねた。すると、同じく鉄舟居士に学ぶ仲間がたびたび訪ねて来て、

    「どうだ、できたか、できたか」

    と聞くので、いっそう追い詰められた。寄席の昼席や夜席へ往復する車の上でも絶えず考え、寝食を忘れるほどだった。こうして深く黙想すること三年に及び、ようやく一筋の活路を見いだした。そこで居士を訪ね、

    「先生、今日はひとつ、桃太郎のお話をいたしましょう」

    というと、居士は、

    「今日は聞きたくない」

    といった。

    その後、法会があって、嵯峨の天龍寺の滴水和尚も来られた。円朝も居士に招かれ'

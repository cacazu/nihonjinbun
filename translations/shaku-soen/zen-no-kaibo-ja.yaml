  section: 誰か言ふ弱き者と／三 大慈大悲の觀音菩薩
  original: '悲の觀音菩薩とし、自己の心外に顯現して、禮拜供養し、自分の小なる慈悲心を向上して發展させ、拔苦與樂の神通力を有してをられる觀世音菩薩のやうになり度いと力める結果である。女人には、殊の外に、慈悲同情の心の深いものがある。女人が觀音を信仰する所以も、決して、偶然ではないと云へる。

    とは云へ、弱い優しい女人ばかりが觀音を信仰するものと限つてをるのでは決して無い。古來、勇猛の士にして觀世音を信仰した者は頗る多い。聖德太子は觀音の厚い信者であらせられた。太子が靜思默考の道場とされて居つたといふ奈良の法隆寺の夢殿に、今ま安置されて居る觀音の立像は、太子の御姿を彫刻したものと言ひ傳へられてをる。これは奈良朝初期の美術品として名高い傑作である。又た、洛東淸水寺の緣起によると、同寺は、征夷大將軍阪上田村麿が、延曆年中（恒武天皇の御代）に金色八尺の千手觀音を安置し奉つて、造濶建立したものだとある。田村麿將軍は、身丈五尺五寸、胸の厚さ一尺二寸、身重二百一斤といふ偉丈夫で、鬚髯は針金の如く、膂力は衆を拔き、蝦夷地を平定された猛將である。その猛將が大慈大悲の觀音を信仰されたといふのは、一寸、不思議なやうにも思はれるか知らぬが、獨り田村麿將軍のみでなく、古來の猛將勇士が、觀音を信仰し、その尊像を肌身につけ、念持佛として出陣した例は乏しくないのである。

    勇氣と慈悲とは、ちよつと考へると、別々のものゝやうに思はれるが、決して別々のものではない。みな一つ心の現はれである。別なる二つの物が心に存するのではなく、同じ一つの心が、或る場合に勇氣となつて顯現し、或る場合に慈悲となつて顯現するに過ぎないのである。慈悲も勇氣も、雨霰落つれば同じ谷川の水である。歸するところは一つぢや。だから、勇氣に富む人は、從つて、慈悲心にも富んでをる。猛將勇士が大慈大悲の觀音を信仰したのも尤もの話である。古より勇猛の士は却つて、淚脆いものである。

    實際、また、水火刀杖の難を冐し、一命を擲つて進む犧牲的行動は、たゞ一片の'
  translation: 'の観音菩薩として自分の心の外に姿を現させ、礼拝し、供養する。そして自分の小さな慈悲を高め、発展させ、苦しみを取り除き楽しみを与える不思議な力をもつ観世音菩薩のようになろうと努める、その結果なのである。女性には、とりわけ深い慈悲や同情の心がある。女性が観音を信仰するのも、決して偶然ではないといえる。

    とはいえ、弱く優しい女性だけが観音を信仰するのではない。昔から勇猛な人物で観世音を信仰した者は、非常に多い。聖徳太子は観音を厚く信仰していた。奈良の法隆寺の夢殿は、太子が静かに思索する道場にしたといわれる。その中に今安置されている観音の立像は、太子の姿を彫ったものと伝えられている。奈良時代初期の美術品として有名な傑作である。また京都東山の清水寺の縁起によると、同寺は征夷大将軍の坂上田村麻呂が、延暦年間、桓武天皇の時代に、金色で高さ八尺の千手観音を安置し、堂宇を建てたものだという。田村麻呂将軍は、身長五尺五寸、胸の厚さ一尺二寸、体重二百一斤という立派な体格で、ひげは針金のように硬く、腕力は人並み外れ、蝦夷の地を平定した猛将だった。その猛将が、大慈大悲の観音を信仰したというのは、少し不思議に思えるかもしれない。だが、田村麻呂将軍だけでなく、昔の猛将や勇士が観音を信じ、その像を肌身につけ、身近に念じる仏として出陣した例は少なくない。

    勇気と慈悲は、一見すると別のものに思えるが、決してそうではない。どちらも一つの心の現れである。心に別々の二つのものがあるのではなく、同じ心が、あるときは勇気、あるときは慈悲として現れるだけだ。慈悲も勇気も、雨や霰が落ちれば同じ谷川の水になるのと同じで、行き着くところは一つである。だから勇気に富む人は、慈悲の心にも富んでいる。猛将や勇士が大慈大悲の観音を信仰したのも当然のことだ。昔から勇猛な人は、かえって涙もろいものである。

    実際、水や火、刀や杖の危険を冒し、命を投げ出して進む自己犠牲の行動は、ただ一片の'
  notes:
  - 寺伝、像の時代区分や人物の身体の数値は原文の叙述を保持した。
  - 末文は次コマへ続く。

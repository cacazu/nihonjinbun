  section: 自己を究明せよ／六 永久の平和と安樂
  original: '六、永久の平和と安樂

    釋尊は、かくして、自己を究明し、眞義を開發して、永久の平和と安樂を得られたのであるが、一たび慈悲の眼を開けて世間を見渡すと、此の永久の平和安樂を得ること能はず、瞬間の快樂を得んとすることのみ齷齪し、榮枯盛衰愛別離苦に貪着して惱み悶へてゐるものが、世の中に多いのが眼についた。因つて、何うかして、彼等を生老病死の苦悶から解脫せしめ、御自分と等しく涅槃を得るやうにし度いものであるとの一念を發起せられたのである。

    人は、すべて、自分さく正しく賢ければ其れで可いといふ筈のものでは無い。世間を眺めると、我利我慾の人が多いやうであるが、社會は一つの大きな家庭生活であつて、長者は幼者を慈愛し、幼者は長者に敬順し、富者は貧者を愍み、智識ある人は、無智の者を啓發して行くといふふうに、人々の間には相扶助し合つて行かねばならぬ。

    釋尊が、四民平等を主張せられたのも、かゝる社會狀態を現出して、社會をして、永久に平和安樂ならしめんとせられたその消息に外ならないのである。併し、吾人は多く惡平等に落ちざれば惡差別、惡差別に墮せざれば惡平等に陷り易いのであるが、此の邪思妄見を打破して、宇宙人生の當相を體得し、慈悲心を發起して、人間相互、動物、植物、無生物に至るまで、平安ならしめねばならぬ。

    こゝが大乘佛教の大乘佛教たる所以なんである。釋尊が四十九年間の大獅子吼は實に一切衆生をして、一味の法益に浴せしめ、一大安樂境に導かんとせられるにあつた。吾人は此の御教を信じ、行じ、證得して、眞我を發揮しなければならぬのである。眞教の發揮によつて、吾人は宇宙と一體、萬物と一如、神佛と如同することを知る。彼つて、四民平等、四海同胞の實を知り、社會の人類一大平和を將來せん'
  translation: '六　永遠の平和と安楽

    釈尊はこうして自己を究め、真の意味を明らかにし、永遠の平和と安楽を得た。しかし慈悲の目を開いて世間を見渡すと、その平和と安楽を得られず、ただ一瞬の快楽を求めてあくせくし、栄枯盛衰や愛するものとの別れの苦しみにとらわれ、悩みもだえる人が多いことに気づいた。そこで、なんとかして人々を生・老・病・死の苦悩から解き放ち、自分と同じように、迷いを離れた安らぎである涅槃を得られるようにしたい、という一念を起こしたのである。

    人は、自分さえ正しく賢ければそれでよい、というものではない。世間には自分の利益や欲望ばかりを追う人が多いようだが、社会は一つの大きな家庭である。年長者は年少者を慈しみ、年少者は年長者を敬って従い、富む者は貧しい者をいたわり、知識のある人は知識のない人を導く。そのように、人々は互いに助け合わなければならない。

    釈尊が四つの身分の平等を主張したのも、そうした社会を実現し、いつまでも平和で安楽にしようとしたからにほかならない。ところが私たちは、しばしば不適切な一律平等に陥るか、そうでなければ不当な差別に陥り、どちらかへ偏りやすい。この誤った考えや思い込みを打ち破り、宇宙と人生のありのままの姿を身をもって知り、慈悲を起こさなければならない。そして人間同士だけでなく、動物、植物、無生物に至るまで、平安にしなければならないのである。

    ここに、大乗仏教が大乗仏教である理由がある。釈尊が四十九年間、力強く教えを説いたのは、すべての生きものに分け隔てなく仏法の利益を与え、一つの大きな安楽の境地へ導くためだった。私たちは、この教えを信じ、実践し、自分の体験として確かめ、真の自己を発揮しなければならない。真の教えが現れることで、自分が宇宙と一体であり、万物と一つであり、神仏と同じであることを知る。それによって、すべての身分が平等で、世界の人々が同胞であるという真実を知り、人類社会に大きな平和をもたらそう'
  notes:

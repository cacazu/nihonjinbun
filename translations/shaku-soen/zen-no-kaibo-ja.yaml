  section: 宗敎的善行／三、一身を犧牲にして
  original: 彼の時賴が、身を雲水に窶して、諸國を遍歷し、民情を視察したのも、報酬を受けんが爲めでは無かつた。時賴は、それほどせずとも意のまゝに自己の欲求を滿たすことが出來たのである。又た、相模太郞は、元寇を殲滅して國難を救うたが、位は從五位に過ぎなかつた。北米合衆國の國祖、ワシントンは、大功業を就して、而も、自ら其の功に處らず、獨立戰爭の終りたるのち、國民議會に於て、議會はワシントンの勳功を頌した。ワシントンは之れに對して答辭を述べんが爲め起つたが、彼れの肢體は戰ぎ、唇は顫ひ、囁々として立ち竦んでしまつた。これを見たロビンソンは、ワシントンの心事を了解して、謙遜の德を稱へ、其場を取り繕つた。ワシントンほどの勇士が、その勳功を表彰されて、群集の前に連れ出されたる野孃の如く羞むだと云ふのは、畢竟、彼れが大功業に對する報酬を豫期しなかつたからである。否らずんぱ、彼れは誇らかに答辭を述べたであらう。
  translation: '北条時頼が旅の修行僧に身をやつして諸国を巡り、人々の暮らしを視察したのも、報酬を受けるためではなかった。時頼は、そんなことをしなくても、自分の欲求を思いどおりに満たせたのである。また、相模太郎は元軍を打ち破って国難を救ったが、その位は従五位にすぎなかった。

    アメリカ合衆国の建国の父ワシントンは、大事業を成し遂げながら、それを自分の手柄として誇らなかった。独立戦争が終わったのち、国民議会が彼の功績をたたえた。ワシントンは答辞を述べようと立ち上がったが、体も唇も震え、口ごもって立ちすくんでしまった。これを見たロビンソンは、その心情を察し、彼の謙遜の徳をたたえてその場を取り繕った。ワシントンほどの勇士が、功績を表彰されると、群衆の前へ連れ出された田舎娘のように恥じらったというのは、結局、自分の大事業に対する報酬を予想していなかったからである。そうでなければ、誇らしく答辞を述べただろう。'
  notes:
  - 相模太郎は北条時宗を指す。ワシントンの逸話は著者の時系列のまま訳した。

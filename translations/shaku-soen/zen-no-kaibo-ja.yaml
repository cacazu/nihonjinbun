  section: 病中の感想／四、理想的の死に方
  original: ニイチェの言つた言葉に、「我れ〳〵は常に我が體中の古いものを排斥することを以つて能事とする」と、謂ゆる新陳代謝を盛んにするといふことであらう。一種の信仰の活躍してをると云ふのもそれである。かやうにして、少しばかりでも腐つたところがない、弱いところがない、而して、懶けたところがないやうにして、始めて、人間の務めを果し得ると、衲は固く信じてをる。
  translation: ニーチェの言葉に、「私たちはいつも、体の中の古いものを排除することを務めとする」というのがある。これは、いわゆる新陳代謝を盛んにすることだろう。一種の信仰が生き生きと働くというのも、そのことである。こうして、少しでも腐ったところ、弱いところ、怠けたところがないようにして、初めて人間の務めを果たせると、私は固く信じている。
  notes:

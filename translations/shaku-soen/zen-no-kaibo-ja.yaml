  section: 獨園和尚の禪機
  original: '「お前は衲を打つて其れで氣持ちが好いのか」

    と優しく言はれるので、某は聊か張合ひ拔けがして、

    「不愉快で堪らんから打つたのだ」

    と云ふと、和尚は、

    「さうか、衲も、打たれて愉快なことは無い。お互ひに不愉快なことは止さうぢやないか」

    と言はれるので、さア、いよ〳〵、張り詰めてをつた氣が弛んでしまつた。これを見た和尚、間に髮を容れず、突然、起つて、ピシヤ〳〵と續けざまに四五掌を某の橫顏に加へ、とう〳〵緣から突き落してしまはれた。某も齡は若し、力もあり、それに初めから腕力を振ふ積りで來つたのであるが、遂ひに和尚にしてやられてしまつた。最初、和尚が、

    「衲を打つて氣持ちが好いか」

    と優しく出た時に、

    「何を糞ツ」

    とピシヤリやり得るだけの力量があれば大したものだ。或ひは、和尚よりも一枚上であつたかも知れないがナ。兎に角、某は、和尚に降伏してしまつた。今度は本當に佛門に入り、和尚の弟子となつて、頭を圓め、行ひ堅固に修行をしたといふことである。

    我が禪門で「禪機」といふことを云ふが、これは禪の大機大用をいふので、自己の本性を徹見し、宇宙絕對の大道に契合し得た、謂ゆる大悟徹底した禪者の自得せる力をいふのである。かゝる人は、一切處に於て、何等の束縛を受けないから、打てば響く如く、間に髮を容れず、緣に對し、境に應じて、自由自在の活作略が得られるのである。'
  translation: '「お前は、私を殴って、それで気持ちがよいのか」

    と優しくいわれたので、その男は少し拍子抜けして、

    「不愉快でたまらないから殴ったのだ」

    と答えた。和尚は、

    「そうか。私も殴られて愉快ではない。お互いに不愉快なことは、やめようではないか」

    という。それで男は、いよいよ張り詰めていた気が緩んでしまった。それを見た和尚は、間髪を入れず立ち上がり、ぴしゃり、ぴしゃりと続けざまに四、五発、男の頬を打ち、とうとう縁側から突き落とした。男は若く、力もあり、初めから腕力を振るうつもりで来たのだが、ついに和尚にしてやられた。

    初めに和尚が「私を殴って気持ちがよいか」と優しく出たとき、「何を、くそっ」と、ぴしゃりとやれるだけの力量があれば大したものだ。あるいは和尚より一枚上だったかもしれないがね。ともかく男は和尚に降参してしまった。今度は本当に仏門へ入り、和尚の弟子となって頭を丸め、行いを固く守って修行したという。

    禅の世界では「禅機」という。それは禅の大いなる機知と働きであり、自分の本性を徹底して見きわめ、宇宙の絶対的な大道と一つになった、いわゆる悟りを徹底した禅者が、自ら会得した力のことである。こういう人は、どこでも何の束縛も受けない。そのため打てば響くように、間を置かず、出会う相手や状況に応じ、自由自在に生きた働きを現せるのである。'
  notes: []
  sequence: 148
- id: zen-113-01
  scan: 113
  section: 暗夜に靈光を
  original: '暗夜に靈光を

    明代の大聖、王陽明の語に、

    「見聞覺知は外賊なり、情欲意識は內賊なり、只だ、能く、主人公、惺々不昧にして、獨り中堂に坐する時は、即ち、賊化して家人となる」

    といふのがある。自分は禪僧であつて、禪僧の立場としては、王陽明の言はれる通り、何處までも自主的の心になつて、心中の賊を化して家人となすといふ煩悶解決法を說きたいのであるが、併し乍ら、こんな風の說き方では、直ぐ誰れにも分るといふ譯には行かない。そこで、一般の人から煩悶解決について訊かれることがあると、

    「人力で何うしても出來ないといふところに至つたならば、その上は神佛を信仰して一切をお任せなさい。さうすれば、よいやうになるものである」

    と說き聞かせて居るが、此の神とか、佛とかいつて、それが決して自分の外に存在するものでは無い。各人が內に省みたならば、悉く、己れの心の上にある。

    「直指人心見性成佛」

    といふ達磨大師の御言葉は、此間の消息を傳へたものである。

    儒教では「天」といひ、基督教では「神」といひ、佛教では「佛」といふ、これは、みな、同じものである。實に大きなもので、宇宙に瀰漫してをつて、今ま、直ぐ、其の全體を見ようと欲しても、見られるものでは無い。併し乍ら、よく繪に描いてある雲間の龍のやうに、頭や爪がチラリ〳〵と見える如く、天といひ、神といひ、佛といふものゝ一小部分だけは、內觀自省さへすれば、チラリ〳〵と心中に認めることが出來るのである。

    このチラリ〳〵認め得るものが、良心とか、色知とか、良能とか名づけられてをるものであつて、一度び此れを認め得たならば、暗夜に光明を發見した如き感'
  translation: '暗い夜に霊妙な光を

    明代の偉大な聖人、王陽明の言葉に、こういうものがある。

    「見る、聞く、感じる、知るという働きは、外から来る賊である。感情や欲望、分別する意識は内なる賊である。ただ、心の主人である自分が、はっきりと目覚め、曇ることなく、独り家の中心に座っていれば、賊は姿を変えて家族となる」

    私は禅僧だから、その立場からは王陽明のいうように、徹底して自主的な心になり、心の中の賊を家族へ変えるという、悩みの解決法を説きたい。しかし、こんな説き方では、誰もがすぐにわかるわけにはいかない。そこで一般の人から悩みの解決を尋ねられると、

    「人の力ではどうしてもできないところまで来たら、その先は神仏を信仰し、すべてお任せなさい。そうすれば、よいようになるものです」

    と説いている。ただし、この神や仏は、決して自分の外にあるものではない。一人ひとりが内面を省みれば、すべて自分の心の中にある。

    達磨大師の「直接、人の心を指し示し、その本性を見きわめて仏となる」という言葉は、この事情を伝えたものだ。

    儒教では「天」、キリスト教では「神」、仏教では「仏」というが、これらはみな同じものなのである。実に大きく、宇宙の隅々に満ちているので、今すぐ全体を見ようとしても見られない。しかし、絵に描かれる雲間の龍の頭や爪がちらりちらりと見えるように、天、神、仏と呼ぶもののごく一部分は、内面を観察して自分を省みさえすれば、心の中にちらりちらりと認められる。

    こうして垣間見えるものが、良心や、生まれながらに善を知る良知、善を行う力である良能と名づけられている。一度これを認められれば、暗い夜に光を発見したような感じ'
  notes:
  - 原本は「色知」と印刷されるが、次コマの「良心・良知・良能」と文意から、訳では「良知」とした。神・天・仏を同一とする説明は著者の宗教観。
  - 末文は次コマへ続く。
  sequence: 149
- id: zen-114-01

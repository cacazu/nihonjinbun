  section: 智情意の三修養／二 修養法の二大別
  original: '二、修養法の二大別


    ところで、修養にいろ〳〵な遣り方があらう。身體から修養するのも一つ、又た、心から修養するのも一つ、大別すれば、この身體の修養と、精神の修養との二つに歸するのである。併し、これは、假りに分つたものであつて、大體、我れ〳〵の身體と心とは、引き分けやうがない、丁度、聲と響きとを引き分けやうとしても引き分けることが出來ないし、形狀と影とを引き分けようとしたところで、引き分けられるもので無いと同じやうに、密接なる關係どころで無く、殆んど、裏と表といつたやうな親しい間柄である。そこで、身體の修養とか、心の修養とか言ふのは、假りに分けて言ふのである。この身體と精神とは、それほど親しいものであるが、衲どもの立場から考へると、'
  translation: '二　修養法の二つの大別


    修養にはいろいろなやり方があるだろう。身体から修養するのも一つ、心から修養するのも一つで、大別すれば身体の修養と精神の修養の二つになる。

    しかしこれは仮に分けたもので、そもそも私たちの身体と心は切り離せない。声とその響きを分けようとしても分けられず、形と影を分けようとしても分けられないのと同じである。密接な関係というどころか、ほとんど裏と表のような親しい関係にある。

    そこで身体の修養、心の修養というのも、仮に分けていうのである。

    身体と精神はそれほど親しいものだが、私たちの立場から考えると、'

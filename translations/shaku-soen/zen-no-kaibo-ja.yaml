  section: 大なる樂觀の上に／四、永久不變の大道
  original: '四、永久不變の大道


    此の宗教的大精神は、各人が生まれながらに有してをるので、決して他から貰つて來たり借りて來たものはではない。固より、教へられて得られるものでも無い。人はこの大精神、大信念に坐して、人生を眺めると、人生は誠に面白い、悲觀の風なんかは更らに吹かない。なぜかと云へば、かくの如き堅固なる信念を持して世に立つと、自己の仕事は活き〳〵として萬世に傳はる。換言すれば、我れといふものが永久不滅といふことになるからである。例せば、釋迦、或ひは、孔子を觀念すると、その釋迦や孔子の面目、精神が、歷然として、今ま此處に存してをる。此の二人は、數千年前の人であるが、たとひ形骸は土に歸してをつても、大なる教へ、深き感化は、千古不滅である。楠公父子の如きも、亦た、さうである。我が國民が一たび忠といふことに思ひ及ぶと、直きに楠公父子の大精神、活面目が、今ま尙ほ儼として存在してをるのを感ずる。即ち忠といふ上に、永久の生命を保つて居られるのである。要するに、世間の、樂觀といひ、悲觀といふものは、枝葉の觀念に過ぎない。樂'
  translation: '四　永遠に変わらない大道


    この大きな宗教的精神は、一人ひとりが生まれながらに持っているのであって、他からもらったり、借りたりしたものではない。もちろん、教えられて得るものでもない。

    この大きな精神、大きな信念に腰を据えて人生を眺めれば、人生は実に面白く、悲観の風など吹かない。なぜかといえば、こうした堅固な信念を持って世に立てば、自分の仕事が生き生きと、後世へ永く伝わるからである。言い換えれば、自分という存在が永遠に滅びないことになるのである。

    例えば、釈迦や孔子を心に思い浮かべれば、その本来の姿や精神は、はっきりと今ここにある。この二人は数千年前の人であり、体は土に帰っていても、大いなる教えと深い感化は、永遠に消えない。楠木正成父子も同じである。日本の国民がひとたび忠義を思えば、楠木父子の大きな精神、生きた姿が、今なお厳然と存在しているのを感じる。つまり、忠義の上に永遠の生命を保っているのである。

    要するに、世間でいう楽観や悲観は、枝葉の考えにすぎない。'
  notes:

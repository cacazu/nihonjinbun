  section: 差別に處する難／二、差別觀念は建設思想
  original: '佛教の神は、「平等」の權化で、萬物悉く之れを神なりとし、人間も、佛も、草木國土も、皆な等しく神なりと稱へるのが、是れ佛教である。隨つて、佛教を信ずる教徒の間には、自ら大慈悲心の發起を見、勢ひ戰爭癖を懷き得られなくなる。

    斯くして、眞の平和は佛教によつて始めて世界に將來し得らるゝものとなるべきは火を睹るよりも明らかだが、唯だ、今や、佛教界に其人なく、かゝる世界的平和運動を、佛教國たる日本より開始し得られぬを遺憾とするのみだ。'
  translation: '仏教の神は「平等」の化身であり、あらゆるものをことごとく神とし、人間も仏も草木も国土も、みな等しく神だと呼ぶ。それが仏教なのである。したがって、仏教を信じる人々には、おのずと大いなる慈悲が生まれ、自然に、戦争を好む気持ちを抱けなくなる。


    こうして、真の平和は、仏教によって初めて世界にもたらせるはずだということは、火を見るより明らかだ。ただ今、仏教界に、それを担う人物がおらず、このような世界的な平和運動を、仏教国である日本から始められないことが、残念でならない。'

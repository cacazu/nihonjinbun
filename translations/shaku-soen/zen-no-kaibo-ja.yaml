  section: 武士道を他にも及ぼせ／一 武士道は日本の誇り
  original: '武士道を他にも及ぼせ


    一、武士道は日本の誇り


    我國の古來最も誇りとすべきものは何んであらうか、天然の氣候の如き、風俗の純朴なるが如き、人情の敦厚なるが如き、山水の明媚なるが如き、或は、學術、宗敎上に於ける特種の發展の如き、其他、法律上、政治上に於ても、誇りとすべきものは多々あるであらう。けれど、他から見て、これこそ日本特有のものである。これこそ實に日本の名物であると稱せらるゝものは何んであらうか。それは、衲が、今、言ふまでもなく、「武士道」であることは、疾く諸君が念頭に思ひ浮かべられてあるであらう。武士道は、日本國有の道德を發揮せるものである。外國の學者、政治家、宗敎家'
  translation: '武士道をほかにも広げよ

    一　武士道は日本の誇り


    わが国が古くから最も誇りとすべきものは何だろう。自然の気候、風俗の素朴さ、人情の厚さ、山水の美しさ、あるいは学術や宗教の特有の発展、そのほか法律や政治についても、誇るべきものは多いだろう。しかし外から見て、これこそ日本特有のもの、これこそ日本の名物だといわれるものは何だろう。それは私が今いうまでもなく、「武士道」だと、皆さんはすでに思い浮かべているだろう。

    武士道は、日本固有の道徳を発揮したものである。外国の学者や政治家、宗教家'
  notes:
  - 末尾は次スキャンへ続く。

  section: 蛙飛び込む水の音
  original: '蛙飛び込む水の音

    禪門でいふ謂ゆる「お悟り」は、これを六ケしく說けば、際限のない話であるが、一言に約していへば、つまり修養によつて心の光を發することである。

    俳人として有名な彼の松尾芭蕉は、佛頂和尚に參じて大悟徹底した人である。この佛頂和尚といふのは、俗に佛頂面といふことを云ふが、平生、ムツと怒つたやうな顏附をして居られたもので、決して、白い齒を見せなかつた和尚である。當時は水戶の鹿島の根本寺に住職してをられた。

    或日、和尚は、六祖五兵衛を伴つて、深川に芭蕉翁を訪れられた。六祖五兵衛が先きに立つて、門を入るや否や、

    「如何なるか是れ閑庭草木裏の佛法」

    と問答をしかけた。すると、翁は、'
  translation: '蛙が飛び込む水の音

    禅でいう「悟り」を難しく説けば、話は際限なく続く。しかし一言でいえば、修養によって心の光を放つことである。

    俳人として有名な松尾芭蕉は、仏頂和尚に参じ、悟りを徹底した人だった。この仏頂和尚という人は、俗に「仏頂面」という言葉があるが、いつもむっと怒ったような顔をし、決して歯を見せて笑わなかった。当時は、水戸の鹿島にある根本寺の住職だった。

    ある日、和尚は六祖五兵衛を連れて、深川の芭蕉を訪ねた。五兵衛が先に立ち、門に入るなり、

    「この静かな庭の草木の中にある仏法とは、何ですか」

    と禅問答をしかけた。すると芭蕉は、'
  notes:
  - 仏頂和尚や句の成立に関する逸話は、著者の語る形で訳した。
  sequence: 151
- id: zen-115-01

  section: 無邊の風月／五、何くも同じ秋の夕暮
  original: の眼」で、眺めたところでは斯れなんである。玆に至つては、悲觀もなければ樂觀もない。次ぎから次ぎへ、ズン〳〵と轉々して行きをる。丁度、東海道五十三次のやうぢや。人生五十とか七十とか云つて居るが、畢竟、之れなんで、「眼中の眼」をもつて「燈外の燈」に照らして見れば、「日々是れ好日」で、各自、その天職本分を盡くして行くならば、いつも春風駘蕩、感謝の念に溢れるであらう。是れが宗教の信念とでも云はうか、實に難有いところなんである。世の中の人、此頃の若い者は、「アリガタヤ」なんて、此の信仰厚き人々を笑ふけれども、爺さん、婆さんが、一心不亂に念佛三昧を修して、南無阿彌陀佛〳〵と念佛を唱へて居る其の有樣は、眞に無邪氣だ。眞から愉快だ。其人の年輩、其人の學力など、いろ〳〵の差はあらうけれども、つまる所は、玆だ。何も變つたことは無い。
  translation: 'の目」で眺めると、こうなのである。


    ここまで来れば、悲観もなければ楽観もない。次から次へ、ずんずん移っていく。ちょうど東海道五十三次のようなものだ。人生は五十年、七十年などというが、結局は、このことなのである。「目の奥の目」をもって、「灯の外の灯」に照らして見れば、「毎日がよい日」である。それぞれが自分の天職と務めを果たしていくなら、いつも春風のようにのどかで、感謝の思いに満ちるだろう。


    これを宗教上の信念とでもいおうか。実にありがたいところなのだ。世間の人、とくに近ごろの若者は、「ありがたや」などと信仰深い人々を笑う。しかし、おじいさん、おばあさんが、心を一つにして念仏に打ち込み、「南無阿弥陀仏、南無阿弥陀仏」と念仏を唱えている姿は、実に無邪気で、心から愉快だ。その人の年齢や学力などには、いろいろ違いがあるだろうが、行き着くところは、ここなのだ。何も変わったことはない。'

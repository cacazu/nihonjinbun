  section: 正法に不思議なし／四、機類に應じて導く
  original: 'あるとか、いろ〳〵の宗旨を立てゝ、相應する機類を導かれた。其他、大乘だ、小乘だ、向上門だ、向下門だ、彼相門だ、還相門だ、顯教だ、密教だ、不變眞如だ、隨緣眞如だと、種々樣々の名稱があるが、その中に何か變つた難有いことでもあるかと云ふと、これが妙不可思議な奇特事であると云つて、取り出して示すべきものは無い。何れのお經にも「最尊無上」と記してあるが、これは佛教によつて道を得た其人に取つては最尊無上であるとの意味である。

    今日、世人の多くが、禪宗とさへ云へば、直きに拂拳棒喝を事とし、口を開けば白を黑、牛を馬といつたやうな譯の分らぬ唐人の寢言みたやうなことばかり云ふのが豪いといふやうに考へ、殊に、多少でも禪をやつた者は、兎角、そんな眞似ばかりを仕たがつて、倶胝和尙は何事にも一指を堅てたとか、丹霞和尙は佛像を燒いて尻をあぶつたとか、百丈は馬祖に鼻をひねられて悟つたとか、そんな事ばかり云つて、如何にも其んな處にばかり悟りが轉つて居るやうに思つて居るやうであるが、大きな心得違ひである。學人たるものは宜しく三思三省しなければならぬ。'
  translation: 'あるとか、さまざまな宗旨を立て、それぞれにふさわしい資質を持つ人々を導いた。そのほか、大乗、小乗、超越を目指す向上門、日常へ下りて働く向下門、浄土へ往く往相門、そこから人々を救うために還る還相門、顕教、密教、不変の真理としての真如、縁に応じて働く真如など、さまざまな名称がある。しかし、その中に何か変わったありがたいものがあるかといっても、「これこそ不思議な奇跡だ」と取り出して示せるものはない。どの経典にも「この上なく尊い」とあるが、それは仏教によって道を得た、その人にとって、この上なく尊いという意味である。

    今日、多くの人は、禅宗と聞けば、すぐに払子を振り、拳を示し、棒で打ち、喝を入れるものだと思う。そして口を開けば、白を黒、牛を馬と言うような、わけのわからない寝言めいたことばかり言うのが、偉いことだと考える。特に多少なりとも禅を学んだ人は、そのようなまねをしたがる。倶胝和尚は何に対しても指を一本立てた、丹霞和尚は仏像を焼いて尻をあぶった、百丈は馬祖に鼻をひねられて悟った、などということばかり話す。そして、そのような所にばかり悟りが転がっているかのように思うらしいが、大きな心得違いである。学ぶ者は、よくよく考え、繰り返し自らを省みなければならない。'
  notes:
  - 底本の「彼相門」は文脈上「往相門」と解して訳した。
  - 「唐人の寢言」は意味不明な言葉を指す当時の表現として訳した。

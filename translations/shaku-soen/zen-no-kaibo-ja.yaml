  section: 不轉不動なれ／一 其心を大山にす可し
  original: 世間の人々は、從晝至夜、この八風のために轉動され、狂亂して、寸時も心の安らかなる時がない。それが、此の八風の爲めに動搖されず、八風に超然として、不轉不動の境界にあるのが、「其心を大山にする」ものである。如何に人生の暴風が吹き捲くつて我が乘る船を覆さんとするも、泰然自若として、雲間に魏然たる大山の如くでなければならぬ。此の境界は、平素から深く養ふところ有るに非れば能はぬところである。禪道修行の目的は、此の不轉不動の境界に至るにあつて、これが禪道終局の目的と云つてもよい。衲が、如何に不轉不動なれと云つても、八風に抵抗して其れに打ち勝てといふのでは無い。それは、到底、不可能のことであるばかりでなく、大怪我の本である。たとへば、船に乘る者が、船の動搖に伴はす吾身ばかりは動搖なからしめんとしても能はぬと同じである。だから、我が佛敎では、動は動のまゝ、轉は轉のまゝで、動轉を離れよといふ。即ち、動中に處して靜を得るのであつて、これを動靜一如といふのである。
  translation: '世間の人々は、昼から夜まで、この八風に振り回され、取り乱して、一瞬も心の安らぐときがない。それに対して、八風に揺さぶられず、それを超えたところに立って、揺るがず動じない境地にいることが、「心を大きな山のようにする」ことである。人生の暴風がどんなに吹き荒れ、自分の乗る船を覆そうとしても、泰然自若として、雲の間にそびえ立つ大山のようでなければならない。この境地は、普段から深く養っていなければ得られない。禅の修行の目的は、この揺るがず動じない境地に達することにあり、これが禅の究極の目的だといってもよい。

    私がいくら揺るがず動じるなといっても、八風に抵抗し、それに打ち勝てというのではない。それは到底できないばかりか、大けがのもとである。船に乗っている者が、船の揺れに従わず、自分の身体だけは揺れないようにしようとしてもできないのと同じだ。だから仏教では、動くものは動くまま、移るものは移るままで、動きや変化にとらわれるなという。つまり、動きの中にいて静けさを得るのであり、これを動静一如、動と静が一つだというのである。'

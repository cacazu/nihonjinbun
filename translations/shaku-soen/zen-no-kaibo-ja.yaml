  section: 禪と鎌倉武士／五 禪的修養の力が發して
  original: '五、禪的修養の力が發して

    さう云ふやうな有樣で、此の禪的修養の力が發して、武力ともなり、善政ともなり、其他、有らゆる方面に關係して、鎌倉時代に於て、我が武士道が大いに發達したのも、此の佛教の眞髓たる「禪」の道が與つて大いに力ありと云つて差支へないと思ふ。

    鎌倉の政治は何うであつたかと云ふと、勤險尙武、是れであつた。佛法各宗は何うであつたかと云ふと、前に述べた如く、直截簡明なる、

    「南無阿彌陀佛」

    「南無妙法蓮華經」

    「莫煩惱」

    是れである。此の直截簡明な安心決定の宗旨は、今の複雜なる社會生活に於ても、國家獨立の上に於ても、愈よ、益〳〵、その必要を感ずるのである。敢て、元來の宗教を崇拜するまでも無からう。

    因みに、當時の北條氏の位地を一瞥してみると、先づ、北條氏は何ういふ身分であつたかと云ふに、言ふまでもなく、彼等は、謂ゆる陪臣である。それで、時賴公なり、時宗公なり、彼の如く、外寇に對しても、又たは、內治に於ても、共に、大功を奏してをるに拘らず、其の官位は僅か一國の太守相模守で、位階は從五位で、その待遇は、今の勅任にも及ばず、彼等が寤寐にも聖恩を忘れず、殆ど、活ける神'
  translation: '五　禅の修養の力が現れて

    このように、禅による修養の力が現れ、武力にもなり、善政にもなり、あらゆる方面にかかわった。鎌倉時代に日本の武士道が大きく発達したのも、仏教の真髄である禅の道が大いに力を貸したといって差し支えないと思う。

    鎌倉の政治はどうだったかといえば、よく働き、倹約し、武を尊ぶということだった。仏教の諸宗派はどうだったかといえば、前に述べたように、率直で簡明な、

    「阿弥陀仏に帰依します」

    「妙法蓮華経に帰依します」

    「思い悩むな」

    という教えである。こうした率直で簡明な、揺るぎない心の安定を得る教えは、今の複雑な社会生活でも、国家の独立を保つうえでも、ますます必要に感じられる。必ずしも、従来の宗教をそのまま崇拝する必要まではないだろう。

    ついでに、当時の北条氏の地位を一目見ておこう。どのような身分だったかといえば、いうまでもなく陪臣だった。時頼公も時宗公も、外敵への対処でも内政でも、あれほどの功績を挙げたのに、官職はわずか一国の長官である相模守、位階は従五位だった。その待遇は、今の天皇が任命する勅任官にも及ばない。寝ても覚めても天皇の恩を忘れず、ほとんど生きた神'
  notes:
  - 原本は「八」の次の節を「五」とするため、その番号を保持した。
  - 原本の「勤險尙武」は文意から「勤倹尚武」と解して訳した。
  - 末文は次コマへ続く。
  sequence: 129
- id: zen-100-01
  scan: 100
  section: 禪と鎌倉武士／五 禪的修養の力が發して
  original: '樣の如く敬愛してをるところの天子さまにも、直接、拜謁を許されなかつた。それでも、彼等は、決して、不足と思つて居らなかつたやうである。

    加之、時宗は、戰勝の神佑、佛恩を感謝する爲めに、新たに吾が圓覺寺を創立してをる。今日、北條氏は亡びてしまつても、精神的紀念碑たる此寺は、儼として六百餘年を經ても存立して居る。古諺に、「陰德あれば陽報あり」と云ふが、明治三十七八年日露戰役の時に當つて、叡聖文武なる明治天皇は、大御心を以て、時宗の大功を追憶ましまし、破格の恩典を示させられて、從一位の贈位を賜はり、その式典を圓覺寺に於て擧げたのである。

    今日、我が六千萬の同胞が、軍人は勿論、實業家も、政事家も、誰れも、彼れも、皆が能く此の武士道的剛健勇猛の氣槪を具へて居るであらうか。將來、經濟上の戰爭に於て、果して、時宗公が外寇に對して成したる如く、痛絕快絕なる大功を立つる者があらうか。聊か疑ひなき能はずである。

    初めに述べた、奢侈、淫靡、惰慢、享樂は、實に、目下、吾が同胞の大敵である。衲が斯樣な題を出したのも、聊か、時事に感ずるところが有つてのことである。幸ひに之れが杞憂であるならば、衲の喜びとするところである。'
  translation: 'のように敬い愛していた天皇にも、直接お目にかかることは許されなかった。それでも彼らは、決して不満には思っていなかったようである。

    そのうえ時宗は、戦勝をもたらした神の助けと仏の恩に感謝するため、私の属する円覚寺を新たに創建した。今日、北条氏は滅びても、その精神の記念碑であるこの寺は、六百余年を経て厳然と存在している。古いことわざに「人知れず徳を積めば、目に見える報いがある」という。明治三十七、三十八年の日露戦争に当たり、聡明で文武に優れた明治天皇は、大いなる御心をもって時宗の功績を思い起こされ、破格の恩典として従一位を追贈された。その式典は円覚寺で行われた。

    今日、六千万の同胞は、軍人はもちろん、実業家も政治家も、誰もがこの武士道的な、たくましく勇猛な気概を備えているだろうか。将来の経済上の戦争で、時宗公が外敵に対して成し遂げたような、実に痛快な大功績を立てる者がいるだろうか。私はいくらか疑わずにはいられない。

    初めに述べたぜいたく、みだらな風潮、怠慢、享楽は、まさしく今、同胞の大敵である。私がこのような題を掲げたのも、今の世相に思うところがあったからだ。幸いにも、これが取り越し苦労だったというのであれば、私にとって喜ばしいことである。'

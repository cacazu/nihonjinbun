- id: zen-177-02
  scan: 177
  section: 菜根譚十則／二
  original: '二


    耳中常聞逆耳之言、心中常有拂心之事、纔是進德修行的砥石、若言々悅耳、事々快心、便把此生埋在鴆毒中矣。（耳中常に耳に逆ふの言を聞き、心中常に心に拂るの事あらば、纔かに是れ進德修行的の砥石なり。若し言々耳を悅ばし、事々心に快ければ、便ち此生を把りて鴆毒の中に埋在せん）昔から良藥は口に苦く、忠言は耳に逆ふといふが、平素、耳の痛い忠告諫言のみを聞かされ、また、常に心のまゝにならぬ不平のことにのみ接してをると、知らず〳〵修養を積むことが出來て、これ等のことは、つまり、德を進め行ひを磨く砥石となるものである。若し、言々、耳を悅ばしめ、事々、自己の心に快からば、自己の一生涯を鴆毒の中に投げ込み埋めてしまふやうなもので、不幸は此れより大なるものがない。鴆毒とは、鴆といふ鳥の有つてをる毒で、其鳥の羽を以つて杯酒の上を一度なすると、其れを飮んだ者は直きに死ぬると云はれて居るぢや。昔、會津の藩主、保科侯が、山崎闇齋に對つて、先生の樂みとなさるところは何事で御座るかと問うた。闇齋曰く、我れに三つの樂みがある。萬物の靈長たる人間に生まれたことが其の一、有文の世に生まれて書を讀み道を學ぶを得ることが其の二、而して第三の樂みは、樂みの最も大なるもので、卑賤に生まれて大名に生まれなかつたことで御座ると答へた。侯が、怪しみて、その理由を問ふと、大名は深宮の中に生まれ、婦人の手に長じ、御側近侍の者共からは、何も御尤、かも御尤もと、御意に叶ふやうと計り力められて、遂ひに立派な馬鹿殿にされてしまふに反し、我'
  translation: '二

    「耳には常に耳の痛い言葉を聞き、心にはいつも思いどおりにならない出来事がある。それこそが、徳を高め行いを磨く砥石となる。もし聞く言葉がみな耳に心地よく、することがみな心に快ければ、自分の一生を猛毒の中へ埋めてしまうことになる」

    昔から、良薬は口に苦く、忠告は耳に逆らうという。ふだん耳の痛い忠告やいさめばかり聞かされ、いつも思うに任せない不満なことに接していれば、知らず知らず修養を積める。そういうことは、つまり徳を高め、行いを磨く砥石になるのである。反対に、聞くこともすることもすべて自分に心地よければ、一生を鴆毒の中に投げ入れて埋めるようなもので、これほど大きな不幸はない。鴆毒とは「鴆」という鳥が持つ毒で、その羽で酒を一度なでると、飲んだ人はすぐに死ぬといわれている。

    昔、会津藩主の保科侯が山崎闇斎に、「先生の楽しみは何ですか」と尋ねた。闇斎は、「私には三つの楽しみがあります。万物の霊長である人間に生まれたのが一つ。文化のある世に生まれ、書物を読み、道を学べるのが二つ目。そして三つ目が最大の楽しみで、身分の低い者に生まれ、大名には生まれなかったことです」と答えた。

    侯が不思議に思って理由を聞くと、「大名は奥深い御殿に生まれ、女性の手で育てられる。側近たちは何でもごもっともと、ただ気に入られるように努めるので、とうとう立派な馬鹿殿にされてしまいます。それに対し、私'
  notes:
  - 末尾はscan178へ続く。鴆毒の説明は著者が紹介する伝承である。
  - 漢文と同内容の訓読は原文に両方保持し、現代語訳は同一引用として一度だけ示した。後続の評釈は省略していない。
  sequence: 260
- id: zen-178-01
  scan: 178
  section: 菜根譚十則／二
  original: 等の如き卑賤の者になると、上役からも同役からも、始終、叱言や忠告の受け通し、自然に德行を修め、才能を硏くことになると云つたといふことぢや。まことに其通りである。彼の、世間で、猥りに自由を唱へ、放任を叫ぶ徒輩は、自ら鴆毒の中に一生を埋沒せんとする手合ひである。
  translation: たちのような身分の低い者は、上役からも同僚からも、始終、叱られたり忠告されたりしてばかりなので、自然に徳を修め、才能を磨くことになるのです」と答えたという。まことにそのとおりである。世間でむやみに自由を唱え、放任を叫ぶ連中は、自分から猛毒の中に一生を埋めようとする者たちなのである。
  notes:
  - 冒頭はscan177から続く。自由・放任に対する評価は著者の見解。
  sequence: 261
- id: zen-178-02
  scan: 178
  section: 菜根譚十則／三
  original: '三


    徑路窄處、留一步與人行、滋味濃的、減三分讓人嗜、此是涉世一極安樂法、（徑路窄き處は、一步を留めて人に與へて行かしめ、滋味濃かなる的は、三分を減じて人に讓つて嗜ましむ、此れは是れ世を渉る一の極安樂法なり）徑路は、小路である。片方は深淵、片方は絕壁と謂つたやうな危險な小路は、到底二人並らんで通ることが出來ない。强いて通らうとすれば生命も亡きものにする覺悟が必要である、そこで一步を踏み留まつて、人を先きへ通してやる。滋味濃かなる的とは、滋味ある食物、即ち、美味ぢや、美味いものは我れも人も一樣に此れを欲する。そこで、たとひ、己れ一人で食ふべき食物にしろ、三分は減じて此れを他人に與へる。斯くの如く何事も、控目にして、一步を讓り三分を與へる、これを謙といひ讓といふ。謙讓もつて世を涉るは、世を渉る極安樂な方法である。武田信玄の歌に、誰れも見よ滿つればやがて虧く月の十六夜の空や人の世の中といふのがある。易經にも、「天道は盈つるを虧いで謙に益す」と云つてある。人を押し退けても自己が先きに立ち、他人の物まで橫取をしようとするが如き行爲は、遂ひに、之れ、天道に背くものであつて、一時は利益を得るこ'
  translation: '三

    「道の狭いところでは、一歩止まって人を先に通す。おいしいものは、自分の取り分を三割減らして、人に譲って味わわせる。これこそ、世の中をきわめて安楽に渡る方法である」

    「径路」は小道のことだ。一方が深い淵、もう一方が切り立った崖というような危険な小道では、とても二人並んでは通れない。無理に通ろうとすれば、命を失う覚悟がいる。そこで一歩止まり、人を先に通してやる。「滋味濃かなる的」とは、おいしい食べ物のことだ。おいしいものは、自分も他人も等しく欲しい。そこで、たとえ自分一人で食べてよいものでも、三割を減らして人に与える。このように何事も控えめに、一歩譲り、三割を与える。これが謙遜であり、譲り合いである。謙虚に譲り合って世を渡るのが、最も安楽な方法なのである。

    武田信玄の歌に、

    「誰もが見ておくがよい。満ちればすぐに欠け始める月、十六夜の空は、人の世そのものだ」

    というのがある。『易経』にも、「天の道は、満ちたものを減らし、へりくだるものを増す」とある。

    人を押しのけてでも自分が先に立ち、他人の物まで横取りしようとする行いは、結局、天の道に背く。一時は利益を得るこ'
  notes:
  - 末尾はscan179へ続く。
  - 漢文と同内容の訓読は原文に両方保持し、現代語訳は同一引用として一度だけ示した。後続の評釈は省略していない。
  sequence: 262

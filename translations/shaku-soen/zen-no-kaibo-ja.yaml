  section: 無邊の風月／三、心を中心としての問題
  original: の延壽太夫が謠ひ出す聲の中には、如何にも伊左衞門が動いてゐるやうにも思はれるし、その着衣の具合ひから、手足の舞ひがはつきり眼に見えるやうな氣がした。やはり、かう云ふところに、眞の妙味と云ふものが存在してゐるので、理窟や學說などでは、とても其の味は出ない。謂ゆる延壽太夫の如きは、其の藝に超越してゐると云ふても宜い。それだから、今の科學や哲學も、超科學、超哲學といふやうに、之れを心から會得する一歩進んだものにしたい。ワツトの蒸氣汽罐の發明や、ニユートンの引力發見を見ても、この超科學、超哲學の發現に外ならない。云はゞ吾が禪宗に於ける豁然大悟、謂ゆる大死一番の境と大なり小なり事は違つても、其の眞理にいたつては大した差は無からうかと思ふ。佛が、麻麥の苦行をせられて、雪山十二年後の大悟は、遂ひに、「奇なる哉、一切衆生は、如來の智慧德相を具有す」と呼ばしめた。即ち、山川草木悉皆成佛の眞理を發見せられた。古德、祖師方でも、或ひは桃の花の開くを見て豁然大悟せられ、鷄鳴を聽いて其の佛陀の光明を放たれたお方もある。之れ、皆な、「心」を中心としての問題に外ならぬのであつて、「無邊の風月」も、唯だ平凡の眼には、何んの價値もないが、謂ゆる悟つた眼とでも云はうか、「眼中の眼」によつて眺めたなら、必ず、「無邊の風月」-此の妙味が分るのである。
  translation: '延寿太夫の語り始める声の中に、いかにも伊左衛門が動いているように感じられ、着物の着こなしから、手足の舞う姿まで、はっきり目に見えるような気がした。


    やはり、こういうところに本当の深い味わいがあるのであって、理屈や学説などでは、とてもその味は出ない。延寿太夫のような人は、芸そのものを超えたところへ達しているといってもよい。だから、今の科学や哲学も、それを心から理解する、もう一歩進んだ「超科学」「超哲学」というものにしたいのだ。


    ワットの蒸気ボイラーの発明や、ニュートンの引力の発見を見ても、それはこの超科学、超哲学の現れにほかならない。いわば禅でいう、突然に深い悟りが開けること、今までの自分を徹底して死に切らせる境地とは、規模や事柄に違いはあっても、その真理においては、大きな違いはないと思う。


    仏が麻の実と麦を食べる苦行をされ、雪山で十二年を過ごしたのちの大悟は、ついに、

    「不思議なことだ。すべての生きものは、如来の智慧とすぐれた徳相を備えている」

    と叫ばせた。つまり、山も川も草も木も、すべて仏であるという真理を発見されたのである。昔の高僧や祖師にも、桃の花が開くのを見て深い悟りを開いた方や、鶏の鳴き声を聞いて仏の光を放たれた方がある。どれも、「心」を中心とした問題にほかならない。


    「果てしない風月」も、平凡な目には何の価値もない。しかし、悟った目とでもいおうか、「目の奥の目」で眺めれば、その「果てしない風月」の深い味わいが、必ずわかるのである。'

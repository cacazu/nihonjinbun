  section: 自己を究明せよ／五 無師獨悟の釋尊
  original: '五、無師獨悟の釋尊

    釋尊は出家されてから、苦行外道の仙人について、生老病死の苦みから解脫する道を學ばんとせられ、阿羅邏、迦蘭、欝陀羅と云つたやうな苦行派の聖者とも云ふべき仙人について修行せられたが、一體、この派の主張は、身を苦しめ、雜念を防いで、梵天に生まれると云ふのが究竟の目的であつて、頰に金火箸の如きものを貫通して路傍に立ち、通行人に之れを扶らせたり、或ひは輕業師の如く高い竿の頂上に片手で摑つたまゝブラ下つたりなどして、苦痛を忍ぶのが、永久の安樂を得るの所以であると考へてをつたのである。老子の

    「吾所以有大患者、爲吾有身、及無吾身、吾有何患、」

    と云つたやうな譯で、最後は何うしても灰身滅智の空々寂々な冷塊となるのが終まりである。

    かう云ふ主義が、決して、釋尊の意を滿たす筈はないのである。衲が、先年、印度に旅行した際にも、今ま、尙ほ、斯かる苦行外道の在るのを目擊した。ガンヂス河中に、恰も、五六月頃、水田の中に、蛙の子がウヨ〳〵してゐるやうに、水中に浸つてゐる苦行者も見えたが、さういふ有樣で、その主張の淺劣さは、遂ひに、釋尊をして、無師獨悟の方針を取らしめたのである。

    さうして、釋尊は、尼蓮禪河の東畔に靜地を卜し、六年間、端坐、遂ひに菩提樹下の大禪定によつて、曉星の輝きを見て、豁然として大悟せられたのである。

    人は、何事を爲すに當つても、仇や疎かでは、迚も、一事をさへ成し遂げ得らるるものでは無い。釋尊の如く、久しい間の難行苦行を積み、禁欲の修行もし、有らゆる誘惑と戰つて、之れに打ち勝ち、それで漸く眞正の人間が仕上がるのである。

    事の成るのは、決して成るの日に成るのでは無い。即ち、前述の如く丈夫なる身'
  translation: '五　師によらず独り悟った釈尊

    釈尊は出家後、苦行を行う仏教以外の仙人について、生・老・病・死の苦しみから解き放たれる道を学ぼうとした。阿羅邏、迦蘭、欝陀羅といった、苦行派の聖者ともいうべき仙人のもとで修行したのである。しかし、この派は身体を苦しめて雑念を防ぎ、梵天の世界に生まれることを究極の目的としていた。頬に金属の火箸のようなものを通して道端に立ち、それを通行人にいじらせたり、軽業師のように高い竿の頂を片手でつかんでぶら下がったりした。そうやって苦痛に耐えることが、永遠の安楽を得る道だと考えていたのである。老子の、

    「私に大きな患いがあるのは、身体があるからだ。身体がなくなれば、私にどんな患いがあろうか」

    というような考え方で、結局は身体も知覚も滅ぼし、空虚で静まり返った冷たい塊になるのが行き着くところだった。

    こんな主義が、釈尊を満足させるはずはなかった。私が以前インドを旅したときにも、今なおこうした苦行者がいるのを目撃した。ガンジス川の中に、ちょうど五、六月ごろの田でオタマジャクシがうようよしているように、水に浸かっている苦行者も見えた。そのようなありさまであり、その主張の浅はかさが、ついには釈尊に、師によらず自分で悟るという方針を取らせたのである。

    こうして釈尊は尼蓮禅河の東岸に静かな場所を選び、六年間、姿勢を正して座った。ついに菩提樹の下での深い禅定によって、明けの星の輝きを見て、はっと明らかな大悟を開いたのである。

    人は何をするにも、いいかげんに取り組んだのでは、一つのことさえ成し遂げられない。釈尊のように長く難行苦行を重ね、欲望を抑える修行もし、あらゆる誘惑と戦って勝ち抜き、それでようやく本当の人間ができ上がる。

    物事が成就するのは、決してその成功の日だけのことではない。つまり、前に述べたような丈夫な身体'
  notes:
  - 「扶らせたり」の字形を原本通り保持。ルビは「さぐ」で、訳は触れて動かす意に取った。
  - 苦行派への批判や釈尊の修行年数・場所の説明は、著者の叙述を保持した。

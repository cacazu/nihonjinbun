  section: 智情意の三修養／五 强き意志の力を
  original: しなければ落伍者となつて、後に殘されてしまふ。されば、我れ〳〵は、智的修養もせねばならないし、又た情的修養も貴ばねばならず、更らに意志の修養といふものに最も重きを置かねばならぬ。今ま一度、繰り返せば、智慧は頭、情は胸、さて意志は手足に當る。かう三つ揃つたところで、始めて完全な一箇の人間が成り立つので、若し手足と頭とか立派に調つても、胸が不備なら不具者であるし、頭と胸とが揃つても、手足が足りなければ進取の方法は行はれ得ない。人は、此の三修養の完成を期せねばならぬ。
  translation: 'しなければ落伍者となり、後に取り残されてしまう。

    だから私たちは、知性の修養をしなければならず、感情の修養も尊重しなければならない。さらに意志の修養を最も重んじなければならない。

    もう一度繰り返すと、知恵は頭、感情は胸、意志は手足に当たる。この三つがそろって、初めて完全な一人の人間が成り立つ。もし手足と頭が立派に整っていても、胸に不備があれば、不完全な人である。頭と胸がそろっていても、手足が足りなければ、積極的に進んでいく手だてを実行できない。人は、この三つの修養の完成を目指さなければならない。'
  notes:
  - 人の完成を身体の各部のそろい方にたとえる比喩は原著による。「不具者」はここでは人格の不完全さの比喩として訳した。
  - 冒頭は前スキャンから続く。

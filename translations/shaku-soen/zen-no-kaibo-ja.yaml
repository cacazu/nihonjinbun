- id: zen-154-01
  scan: 154
  section: 武士道を他にも及ぼせ／六 解信仰信の二門
  original: この仰信は、可ならざるでは無いが、迷信に陷ると、其實、惡龍毒蛇に勝るものあるであらう。彼の惡祈禱に由りて、病氣が全癒するものと信じて、醫藥を用ゐぬやうな者は、此害に罹つたのである。かゝる迷信は、大いに排斥せねばならぬ。ところで、佛敎には、此の解信と仰信の二門が開いてある。仰信門には念佛宗があり、謂ゆる淨土宗とか淨土眞宗とか稱するのが是れであつて、解信門とは、謂ゆる聖道門と稱するのが是れである。然るに、此の二門は、其の主とするところ異なり、聖道門は目あつて足なきが如く、淨土門は足ありて目なきが如くであつて、具足しなければ用を辨じ難い。淨土門の本領は慈悲で、聖道門の本領は智慧である。佛敎は、此の智慧と慈悲とを具足し、慈悲の裏面の敎義を根抵とし、智慧の裏面には慈悲を收めて、不離不二の妙趣がある。ところが、佛敎以外の宗敎では、神の慈悲を言ふ、智慧のことは語らないで、智慧を研くことを宗敎以外のことゝして居る。だから、科學と宗敎の衝突は、必然との結果して避くべからざる事となつて居る。ところが、佛敎では、智慧と慈悲を二つながら修め、智目行足として並行して進ませるやうに爲つてをる。これは、釋迦が初めて拵らへたものでは無く、宇宙の眞理は、一面には智慧となり、一面には慈悲となつて、發露する如く、圓滿なものである。或ひは、之れを、心理學者は智·情·意の三つに區分し、或ひは儒敎では智·仁·勇と云ひ、佛敎では戒·定·慧の三學と言つて居る。
  translation: 'この仰信は、いけないわけではないが、迷信に陥れば、実際には悪い竜や毒蛇よりも恐ろしい場合があるだろう。不適切な祈祷によって病気がすっかり治ると信じ、医薬を用いない者などは、この害を受けたのである。こうした迷信は、大いに退けなければならない。

    ところで仏教には、理解して信じる解信と、仰いで信じる仰信という、二つの入り口が開かれている。仰信の門には念仏の宗派があり、いわゆる浄土宗や浄土真宗がそれである。解信の門とは、いわゆる聖道門と呼ばれるものがそれである。

    しかし、この二つの門は重点とするところが異なる。聖道門は目があって足がないようなものであり、浄土門は足があって目がないようなものだ。両方を備えなければ、十分に働くことは難しい。

    浄土門の本領は慈悲であり、聖道門の本領は智慧である。仏教は智慧と慈悲の両方を備え、慈悲の背後にある教義を根底とし、智慧の背後には慈悲を収めて、離れず二つではないという深い意味を持つ。

    ところが仏教以外の宗教では、神の慈悲を語っても智慧のことは語らず、智慧を磨くことを宗教の外のこととしている。そのため、科学と宗教の衝突は必然の結果として、避けられないものとなっている。

    それに対して仏教では、智慧と慈悲の両方を修め、智慧を目、実践を足として、並んで進ませるようになっている。これは釈迦が初めて作ったものではない。宇宙の真理そのものが、一面では智慧となり、一面では慈悲となって現れる、完全に調和したものなのである。

    あるいはこれを、心理学者は知・情・意の三つに分け、儒教では智・仁・勇といい、仏教では戒・定・慧の三学といっている。'
  notes:
  - 他宗教・科学についての説明は、著者の仏教観からの比較・評価であり、各宗教の立場を網羅する説明ではない。
  - 原著の「必然との結果して」は「必然の結果として」の趣旨で訳した。

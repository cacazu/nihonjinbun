  section: 無邊の風月／四、此處が謂ゆる宇宙の生命
  original: まるで、井戸車の日夜回轉して尙ほ元との如し·······と同じことぢや。これを物にたとへても然うさ、塵一片でも是れがなくなることは無い。それや、形は變り、場所は異つても、其物たるや、萬世、古今、滅することもなければ、生ずることもない。絕對眞理に至つては、此處まで見拔かねばならぬ。この盡くることなき不變の眞理、始めもなく終りもなき不生不滅のところ、直きに其のまゝ、春に百花あり、秋に月あり、夏に凉風あり、冬に白雪ありで、こゝが謂ゆる宇宙の生命とも云ふべきである。此中にあつて、人生五十と說き、七十と說き、生を喜び、死を悲むとは、何んぞ其れ愚なるの甚しきやだ。宇宙の生命が同時に吾が生命と知らば、生死ありとて又た敢て悲喜することも無い。否や、生死の沙汰は無いのである。次ぎに「燈外の燈」とは、光明赫々たる眞理の燈火である。物質的燈火は、時あつて生滅するけれども、絕對眞理の燈火にあつては、謂はゆる燈外の燈で、縱三才を貫き、橫十方に廣がりわたつて、隅なく照りかゞやいてある。
  translation: 'まるで、井戸の滑車が昼夜回っても、やはり元どおりであるのと同じことだ。


    物にたとえてもそうで、塵一つでも、なくなることはない。形が変わり、場所が違っても、そのものは、いつの時代にも、消えることもなければ、生まれることもない。絶対の真理というなら、ここまで見抜かなければならない。


    この尽きることのない、不変の真理。始まりも終わりもなく、生まれることも滅びることもないところ。それが、そのまま、春にはさまざまな花が咲き、秋には月があり、夏には涼しい風が吹き、冬には白い雪が降るということだ。ここを、宇宙の生命とも呼ぶべきなのである。


    その中にあって、人生は五十年だ、七十年だと言い、生を喜び、死を悲しむとは、なんと愚かなことだろう。宇宙の生命が、そのまま自分の生命だと知れば、生死があっても、あえて悲しんだり喜んだりすることはない。いや、そもそも生死を問題にすることがなくなるのである。


    次に「灯の外の灯」とは、明るく輝く真理の灯だ。物質的な灯は、ときに生じ、ときに消える。しかし絶対の真理の灯は、灯の外の灯として、縦には天・地・人を貫き、横にはあらゆる方角へ広がって、隅々まで照らし輝いている。'

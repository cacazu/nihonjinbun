  section: 驢を渡し馬を渡す／一、如何なるか是れ石橋
  original: 趙州の石橋といつて、大層な評判であるが、何んだ、來て見ると、此んな丸木橋かと云ふのである。略彴は、獨木橋、即ち、丸木橋のことである。これは借事問といつて、事に借りて宗旨を問ふたので、趙州和尙の力量如何んを試驗せんとする希望を有つて居る。即ち、趙州和尙は大善知識として天下に其名が鳴つて居るが、來てみると、何んのことだ、老耄の凡僧ぢやないかといふのが眞意である。すると趙州和尙は、「汝、只だ略彴を見て、且らく石橋を見ず」お前の目には、丸木橋ばかり見えて、石橋が見えない。即ち、お前のやうな明盲には、目前に大人物が居つても分らんといふ答へである。實に、此答は面白い、まことに淡白りした答へであるが、中に、不可言の深意がある。禪門では、これを探竿、即ち、探り竿と云ふ。此僧、果して趙州の釣針にかゝつて來た。僧、問ふ。「如何なるが是れ石橋」然らば、本當の石橋はどんなもので御座るかと訊ねた。それに對する趙州の答へは實に樂な、自由な、解脫したものである。「驢を渡し馬を渡す」驢馬も通れば、駄馬も通る。天子も渡れば、乞食も渡る。風も吹けば、月も照る。宇宙萬象の其儘が本地の風光で、本地の風光は宇宙の大道である。森羅萬象は悉く是れによつて、各、その自性を發揮して活動してをる。此の石橋は、本地の風光を意味したものである。どうしても、本地の風光、即ち自性を徹見しなければ、本當のところは會得が出來まい。今まは唯だ文字だけについて說明をしたのであるが、趙州和尙の答へは、實にアク拔けのしたものだ。禪も、こゝまで磨き上げると、禪らしい臭みは微塵もない、圭角の取れたものである。
  translation: '趙州の石橋といえば大変な評判だが、来てみれば、なんだ、こんな丸木橋か、というのである。「略彴」は一本の木でできた橋、つまり丸木橋のことである。これは「借事問」といって、ある事柄に託して宗旨を問うたもので、趙州和尚の力量を試そうとしている。つまり、「趙州和尚は優れた指導者として天下に名を知られているが、来てみれば、なんのことはない、年老いた平凡な僧ではないか」というのが本意である。すると趙州和尚は答えた。

    「お前は丸木橋ばかりを見て、まだ石橋を見ていない。」

    お前の目には丸木橋しか見えず、石橋が見えない。つまり、お前のように目があっても見えていない者には、目の前に大人物がいてもわからない、という答えである。この答えは実に面白い。まことにあっさりしているが、言葉にできない深い意味がある。禅ではこれを「探竿」、相手を探る竿という。この僧は、果たして趙州の釣り針にかかった。

    「では、石橋とは何ですか。」

    本当の石橋とはどのようなものかと尋ねたのである。それに対する趙州の答えは、実に気負いがなく、自由で、とらわれから離れている。

    「ロバを渡し、馬を渡す。」

    ロバも通れば、荷を運ぶ馬も通る。天子も渡れば、物乞いも渡る。風も吹き、月も照る。宇宙のあらゆるものが、そのまま本来の真実の姿であり、その真実の姿が宇宙の大道である。森羅万象はすべてこれによって、それぞれの本性を発揮して活動している。この石橋は、その本来の真実の姿を意味しているのである。

    どうしても、本来の真実の姿、すなわち自分の本性を徹底して見抜かなければ、本当のところは会得できないだろう。今は言葉の上だけで説明したが、趙州和尚の答えは、実に癖が抜けきっている。禅もここまで磨き上げれば、禅らしい気負いは少しもなく、角の取れたものとなる。'

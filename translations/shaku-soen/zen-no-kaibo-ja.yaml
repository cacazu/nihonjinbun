  section: 智情意の三修養／四 智的情的の修養
  original: '四、智的情的の修養


    人間は、誰れでも生まれ落ちると同時に、智慧が開けて行く、さうすれば疑ひが同時に起つてくる。可愛い赤ン坊が、漸く口が利けるやうになると、これは何かと疑問を發する。之れ、即ち、物事を知り度いといふ心の作用を有してをる證據である。されば、西洋人も、「疑問は半ば解釋なり」と云つて居る。疑ひを多く有つてをる人は、智慧の多い人と言つて可い。學問に進んで行けば、進んで行くほど疑ひが增して行く。その疑ひを、一々、道理に照らし、解釋して行くのである。さう云ふ鹽梅で、智慧が進むと共に、一方には我が心を修養して行かねばならぬ。それが、智的修養の遣り方である。次ぎに情的修養であるが、此の情的修養は、享樂といふ意味を有つて居らねばならぬ。即ち、一つの趣味を心から產み出すのである。その情的修養の中に、いろ〳〵あるが、文學とか、美術とか、何んとか、數へれば限りが無いが、それを好奇心に供するのでは無い。例せば、朝から晩まで、鍬を'
  translation: '四　知性と感情の修養


    人間は誰でも、生まれたときから知恵が開けていく。それと同時に疑問も起こる。かわいい赤ん坊がようやく話せるようになると、「これは何か」と疑問を口にする。これは物事を知りたいという心の働きを持つ証拠である。

    だから西洋人も、「疑問を持てば、理解は半ば進んでいる」という。疑問を多く持つ人は、知恵の多い人といってよい。学問が進めば進むほど、疑問が増えていく。その疑問を一つ一つ、道理に照らして解き明かしていくのである。

    そうして知恵が進むとともに、一方では自分の心を修めていかなければならない。それが知性の修養の仕方である。次は感情の修養だが、これには楽しみ味わうという意味がなければならない。つまり、一つの豊かな味わいを心から生み出すのである。

    感情の修養には、文学や美術など、数えれば限りがないほどいろいろある。しかし、ただ好奇心を満たすためにするのではない。たとえば、朝から晩まで鍬を'
  notes:
  - 末尾は次スキャンへ続く。

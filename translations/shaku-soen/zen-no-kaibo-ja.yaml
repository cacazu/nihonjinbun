  section: 誰か言ふ弱き者と／二 電光影裏春風を斬る
  original: 'によつて起ることである。千代能の詠んだ歌に此んなのがある。

    兎に角とたくみし桶の底ぬけて

    水たまらねば月もやどらず

    大悟徹底したものでないと此んな歌は咏めない。女人は、すべて、千代能の如く、大智大勇猛心を奮起して、執金剛神の力を發揮し、水も溜らず月影も宿らぬ底の拔けた桶の如き心情のものになつて欲しいのである。さうしたならば、欲しい惜しい憎い可愛いの煩惱にも苦しめられず、佛光國師の偈にもある如き、キラリ春風を斬つて消ゆる電光の趣きある、フンワリ柔かい中に銳い强いところの有る女になれるのである。'
  translation: 'ことによって起こるのである。千代能の詠んだ歌に、こんなものがある。

    「ああでもない、こうでもないと工夫していた桶の底が抜けた。水がたまらなければ、月の影も宿らない」

    悟りを徹底した人でなければ、このような歌は詠めない。すべての女性に、千代能のように大いなる智慧と勇猛の心を奮い起こし、執金剛神の力を発揮してほしい。そして水もたまらず月影も宿らない、底の抜けた桶のように、何ものにもとらわれない心になってほしい。そうなれば、欲しい、惜しい、憎い、かわいいという煩悩にも苦しめられず、仏光国師の偈にあるような、きらりと春風を斬って消える稲妻の趣をもつ、ふんわりと柔らかな中に鋭さと強さのある女性になれるのである。'

- id: zen-180-02
  scan: 180
  section: 菜根譚十則／五
  original: '五


    家庭有個眞佛、日用有種眞道、人能誠心和氣、愉色婉言、使父母兄弟間、形骸兩釋、意氣交流、勝於調息觀心萬倍矣、（家庭に個の眞佛あり。日用に種の眞道あり。人能く誠心和氣、愉色婉言、父母兄弟の間をして、形骸兩ながら釋け、意氣交も流れしめば、調息觀心に勝ること萬倍なり。）此一章は、學人が極めて意を留めて味はねばならぬところである。全體、成佛とか得道とかいふことは、何んでも、坐禪をして、息を調へ心を觀じ、種々の工夫を積まなければ出來ないやうに世人が誤解をして居るやうに思はれるが、それは大なる誤である、何も其んな六ケ敷いものでは無い。禪では、常に、「脚下を照顧せよ」といふことを云ふが、これは、六ケ敷く考へたり、遠きに求めたりするなといふ意味であるのぢや。扨て、眞正の佛、眞正の道といふものは、家庭、即ち家の內、日用、即ち、日々出會ふ色々の世事中にチヤーンと立派に存在して居るのである。世人が、能く、誠實の心を持し、和いだ氣分を保つて、常に、愉快の顏色をなし、優しき言葉づかひをして、家族、互に思ひやり深く其間に少しの隔ても置かず、丁度、形骸が釋け合ふて一つになつた如く、氣合が流れ合うて、年中樂しく生活して行けるやうであるならば、それが、とりも直さず、眞正の佛、眞正の道である。何も、態々、座禪や調息觀心をして工夫を積むにも及ばぬどころか、それらの行ひにも勝ることが千倍萬倍であるといふのぢや。個は前にもあつた通り一個で、種は一種といふことぢや。愉色は愉快な顏色、婉言は優しき言葉である。'
  translation: '五

    「家庭には本当の仏があり、日々の暮らしには本当の道がある。誠実な心と穏やかな気持ちを持ち、明るい表情と優しい言葉で、父母や兄弟の間の隔てを解き、気持ちを通い合わせられるなら、それは呼吸を調え、心を観察する修行に万倍も勝る」

    この一章は、学ぶ者がとりわけ心に留め、よく味わわなければならない。一般の人々は、仏になることや道を得ることは、ともかく座禅をし、息を調え、心を観察し、いろいろ工夫を重ねなければできないように誤解している。しかし、それは大きな間違いである。そんなに難しいことではない。

    禅では常に「脚下を照顧せよ」、自分の足元をよく見よ、という。これは難しく考えたり、遠くに求めたりするな、という意味なのである。本当の仏、本当の道は、家庭、つまり家の中に、日用、つまり日々出会うさまざまな用事の中に、ちゃんと立派に存在している。

    誠実な心を持ち、穏やかな気持ちを保って、いつも明るい顔をし、優しい言葉を使う。家族が互いに深く思いやり、少しの隔ても置かず、体まで解け合って一つになるかのように気持ちを通わせ、いつも楽しく暮らせるなら、それこそが本当の仏、本当の道である。わざわざ座禅や、呼吸を調えて心を観る修行に取り組む必要がないどころか、そうした行いの千倍、万倍も優れているというのだ。

    「個」は前にもあったとおり、一個のこと。「種」は一種のこと。「愉色」は楽しげな顔色、「婉言」は優しい言葉である。'
  notes:
  - 漢文と同内容の訓読は原文に両方保持し、現代語訳は同一引用として一度だけ示した。後続の評釈は省略していない。
  sequence: 266
- id: zen-181-01
  scan: 181
  section: 菜根譚十則／六
  original: '六


    花居盆內、終乏生機、鳥入籠中、便減天趣、不若山間花鳥、錯集成文、翱翔自若、自是悠然會心、（花盆內に居れば、終ひに生機に乏しく、鳥籠中に入れば、便ち天趣を減ず、若かず山間の花鳥、錯り集つて文を成し、翱翔自若、自ら是れ悠然として會心なるには、）花が美しいからと云つて、此れを植木鉢の中に移したならば、自然の生々としたところが乏しくなる。鳥が愛らしいからと云つて、此れを籠の中に飼つたならば、天然の妙趣が減つてしまふ。山間の花鳥が、いろ〳〵錯り集つて、美しく文彩を成し、自在に翱翔つて呑氣に樂しんで居るのを見ると、悠然として心は無限の快味を覺える。盆內の盆は植木鉢。自若は欲するまゝ、呑氣なる形容。會心は、愉快に覺え、妙味を感ずること。'
  translation: '六

    「花を鉢の中に置けば、ついには生き生きした力が乏しくなる。鳥を籠に入れれば、自然の趣が減ってしまう。山の花や鳥が入り交じって美しい模様をなし、思うままに飛び回って、見る者の心を悠々と満足させるのには及ばない」

    花が美しいからといって植木鉢に移せば、自然の生き生きしたところが失われる。鳥が愛らしいからといって籠で飼えば、天然の妙味が減ってしまう。山の花や鳥がさまざまに入り交じって美しい彩りをなし、自由に飛び回ってのんびり楽しんでいるのを見ると、こちらもゆったりとして、限りない心地よさを味わう。

    「盆内」の盆は植木鉢。「自若」は思うまま、のんびりしている様子。「会心」は愉快に感じ、すばらしさを味わうことである。'
  notes:
  - 漢文と同内容の訓読は原文に両方保持し、現代語訳は同一引用として一度だけ示した。後続の評釈は省略していない。
  sequence: 267
- id: zen-181-02

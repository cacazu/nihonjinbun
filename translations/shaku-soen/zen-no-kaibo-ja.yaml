  section: 差別に處する難／三、亂臣賊子たる勿れ
  original: '思想に到達して亂臣賊子となり、差別を無視して理に逆へる背德漢となるには、恰も、是れ、虎を描いて、猫に類すると其の軌を一にするものだ。國家としても、國民としても、將た、又た、一私人としても、平等思想を把持して平等思想に囚はれず、差別觀を確守して差別觀の奴隷とならず、平等主義にして、而も、秩序整然、秩序嚴格にして、それで、一視同仁の主義を忘れぬものゝみが、常に强くして、常に勝利者たるを得らるゝのである。ビスマークが獨逸の國家を强くし、祖國の國民を健全ならしめんとして、國家社會主義を唱道するに躊躇しなかつたのも、その力の來するところ、實に玆にあるだらう。蘇東坡の詩にこんなのがある。

    廬山烟雨浙江潮　不到千般恨未消　到得歸來無別事

    廬山烟雨浙江潮'
  translation: '思想に達したつもりで秩序や道徳に背く者となり、違いを無視して道理に反する不道徳な人間となるのは、虎を描いたつもりが猫に似てしまうのと、まったく同じである。国家も、国民も、また個人も、平等思想を保ちながら、それにとらわれず、違いを認める見方を守りながら、その奴隷にはならないことだ。平等主義でありながら秩序は整い、秩序は厳格でありながら、誰にも等しく慈しみを向ける原則を忘れない。そういう者だけが、いつも強く、いつも勝利者でいられるのである。ビスマルクが、ドイツ国家を強くし、祖国の国民を健全にしようとして、国家社会主義を唱えることをためらわなかったのも、その力の源は、まさにここにあったのだろう。蘇東坡に、こんな詩がある。


    「廬山の煙る雨、浙江の潮。

    そこへ行かないうちは、さまざまな憧れや思いが消えない。

    行って帰ってくれば、別に変わったことはない。

    廬山の煙る雨、浙江の潮。」'

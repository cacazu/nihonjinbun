- id: zen-034-02
  scan: 34
  section: 無邊の風月／一、詩の味はふ可き點
  original: 無邊の風月一、詩の味はふ可き點無邊風月眼中眼不盡乾坤燈外燈柳暗花明十萬戶叩門處々有人應今囘は、玆に揭げた此の七言絕句について御話をしよう。此詩は、我が禪門では有名なものである。衲も、幼時から、始終、教へられて居たし、又た常に耳にしてゐたので、實は、最う、其の意味ぐらゐは會得して居らなければならぬが、其の眞意の妙味に至つては、なか〳〵分るものでは無い。大體、此の「詩」といふものは、禪門では、極く關係の深いものとしてあつて、詩即禪禪即詩といふ、謂ゆる詩禪一味といふ言葉さへあるのである。それだから
  translation: '一　詩の味わうべきところ


    「果てしない風と月を、目の奥にある目で見る。

    尽きることのない天地を、灯の外にある灯が照らす。

    柳は深く茂り、花は明るく、幾万もの家々を彩る。

    門をたたけば、どこでも答える人がいる。」


    今回は、この七言絶句についてお話ししよう。この詩は、禅の世界では有名なものだ。私も幼いころから絶えず教えられ、いつも耳にしてきたので、本当なら、もう意味ぐらいは理解していなければならない。しかし、その真意の深い味わいとなると、なかなかわかるものではない。


    そもそも「詩」というものは、禅とは非常に深い関係にある。「詩はそのまま禅であり、禅はそのまま詩である」、つまり「詩と禅は同じ味わいを持つ」という言葉さえあるのだ。だから、'
  notes:
  - 末尾は次コマへ続く。

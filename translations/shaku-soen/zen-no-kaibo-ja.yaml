  section: 禪と鎌倉武士／二、鎌倉に於ける宗教
  original: 併し、之れは、時代について言ふので、大體、鎌倉以前の佛教といふものは、すべて貴族的であつたと言つても可からうと思ふ。そんなら、鎌倉時代に起つた佛教は何うかと云ふに、貴族に關係はないことは無いが、大體から言ふと、平民宗と言つて差支へないと思ふ。舊來の佛教は、動もすると、繁文褥禮に流れて居るが、鎌倉時代に起つた佛教は頗る直截簡明である。手つ取り早い話は、鎌倉以前の佛教は、理論的、學問的の宗旨と言へる。然るに、鎌倉時代に、新たに起つた佛教なるものは、理論よりも實際を貴び、學問よりも信念に重きを置いた。例へば、日蓮上人は、天臺がいろ〳〵理論を以て解釋したるところの佛教を、即身南無妙法蓮華經として、活きた題目を唱へ出した。淨土宗も學問的に解釋しようとすれば、なか〳〵六ヶ敷いが、偏へに南無阿彌陀佛と切り出したは、即ち、法然上人の力で、勿論、南無阿彌陀佛は、今ま新たに唱へ出された譯ではないが、兎に角、新しい叫びとなつて現はれて出たことは事實である。
  translation: 'ただし、これは時代による呼び方である。大体において、鎌倉以前の仏教は、すべて貴族的だったといってよいと思う。それでは、鎌倉時代に起こった仏教はどうか。貴族と無関係ではないが、大体からいえば、庶民のための宗教と呼んで差し支えないだろう。

    以前からの仏教は、ともすれば煩雑な形式や儀礼に流れがちだが、鎌倉時代に起こった仏教は、たいへん直接的で簡明である。手短にいえば、鎌倉以前の仏教は、理論的、学問的な宗旨といえる。それに対して、鎌倉時代に新しく起こった仏教は、理論よりも実践を尊び、学問よりも信念を重視した。

    例えば日蓮上人は、天台がさまざまな理論で解釈した仏教を、この身そのまま「南無妙法蓮華経」として、生きた題目として唱え出した。浄土宗も学問的に解釈しようとすれば、たいへん難しいが、ただひたすら「南無阿弥陀仏」と打ち出したのは、法然上人の力である。もちろん、南無阿弥陀仏という言葉を、このとき新たに唱え始めたわけではない。それでも、新しい叫びとなって現れたことは事実である。'

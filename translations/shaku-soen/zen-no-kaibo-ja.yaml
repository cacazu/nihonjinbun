  section: 病中の感想／一、病中は病氣を相手
  original: '一、病中は病氣を相手


    大正五年の春であつた。衲は誤つて流行性感冒に犯され、それが遂ひに變じて肺炎になつてしまつた。ついては、諸方の會にも出席が出來ず、會員諸君をはじめ、その他の方々に一方ならぬ御心配をかけ、佛敎の言葉で言ふと、まことに不冥加で甚だ不調法なことをいたしたと恥ぢ入つたことである。ところが、其後、衲に對して、病氣中の感想は何んなであつたかと云ふやうな質問が、時々、出た。病中の感想はと、改めて御尋ねを蒙むると、ちよつと、此んな感想があつたと、まとめて御話しするやうなことは何もない。平生、衲が自分一個で考へてをることを述べると、やはり、病中は病氣を相手にしてをる、可笑しなやうな言葉ではあるが、病氣の時には病氣と親しむのである。もう少し禪宗臭く云ふと、病氣になつたら病氣になり切る。もう些つと丁寧に云ふと、病氣の時には病氣のまゝに居るといふやうな譯で、やはり、小供の時には小供のやうな心持ち、大人の時には大人のやうな心持ち、若い時には若いやうな心持ち、樂しい時には樂しいやうな心持ち、健康の時には健康のやうな心持ちに、病氣の時には、やはり、病氣に委せてをる。病氣委せと申しますが、そこは、今、ちよつと、思うて居ることを口に言ひ現はしにくいのである。'
  translation: '一　病気の間は病気を相手にする

    大正五年の春のことだった。私はうっかり流行性感冒にかかり、それがついには肺炎になってしまった。そのため各地の会合にも出席できず、会員の皆さんをはじめ、多くの方々にたいへんな心配をかけた。仏教の言葉でいえば、まことに不冥加な、罰当たりなことであり、実に不調法なことをしたと恥ずかしく思った。

    ところが、その後ときどき、病気の間に何を感じたか、と尋ねられた。改めてそう問われても、こういう感想があったと、まとめて話せることは何もない。ふだん私が個人として考えていることを述べるなら、病気の間は病気を相手にしている。変な言い方だが、病気のときは病気と親しくするのである。

    もう少し禅宗らしくいえば、病気になったら病気になりきる。もう少し丁寧にいえば、病気のときは病気のままでいる。子どものときは子どもらしい気持ち、大人のときは大人らしい気持ち、若いときは若い気持ち、楽しいときは楽しい気持ち、健康なときは健康な気持ちでいるのと同じく、病気のときは病気に任せている。「病気任せ」といっても、そのあたりは、思っていることをちょっとうまく言葉にしにくいのである。'
  notes:
  - 大正五年は1916年。病との向き合い方を述べた回想であり、治療をやめるという意味ではない。
  sequence: 241
- id: zen-167-02
  scan: 167
  section: 病中の感想／二、死にともなかつた
  original: '二、死にともなかつた


    さうして、今度の病氣の感想といふものは、これと云ふまとまつたことは無いが、唯だ何んとなく此れぐらゐの病氣では死ねないだらうと思つてゐた。なるほど、跡から聞いて見ると病中には一日に四五十通の見舞ひの電信が來たり、其他、お見'
  translation: '二　死にたくなかった

    今回の病気について、これというまとまった感想はない。ただ何となく、この程度の病気では死なないだろうと思っていた。確かに、あとで聞けば、病気の間には一日に四、五十通もの見舞い電報が届き、また、お見'
  notes:
  - 末尾はscan168へ続く。
  sequence: 242
- id: zen-168-01
  scan: 168
  section: 病中の感想／二、死にともなかつた
  original: 舞ひ下された方々が、入り代り立ち代り來て、皆な御心配下されたに拘らず、自分一人は殆ど其の當時のことは知らぬでをつた。當時お醫者さんからカンフル注射をされて、何んとかいふ藥を飮まされた、それが飮みにくいので、又た注射されて、大分、際どいところまで病氣は進んでをつたのであつたが、なるほど苦しいことは苦しいに違ひない、何か胸の上に重たい石でも載せて、上から壓すやうな心持ちがして、ちよつと、困つたが、併し、まだ、かういふことでは死ぬるものではないと思つてをつた。思つてをつたのみならず、もう少し進めて云うてみると、衲は、今度の病氣では死なぬと、自分で獨り極めてをつた。死なぬと思ふのみならず、もう少し諄々しく廣げて云つてみると、實は、死にともない。これは、古人が云つて居る、一休和尙であつたか、かういふ事を云はれた。その一休の故智を學ぶといふことではないが何うしても死にともないと思つて居つた。死を見ること歸するが如しと云ふやうなことを口にするのは、我れ〳〵の尋常底である。死ぬくらゐなことは、丁度、故郷へ歸るやうなことで、一日働いて少しく夜間に憇ふやうなものだと口で云つてをる。又た、さう決めてをる。が、たゞ、今度の病氣については、死にともないと思つた。これは、何故であるか。ちよつと、申してみると、衲が此世に生まれ出てくるには、もう胎內に居るうちからして、父母の大恩を受け、生まれ出て後も其の通りで父母の大恩は申すに及ばず、自分を敎へてくれた師匠の恩、朋友の恩、段々、推し廣めてみると、知ると、知らざるとに拘らず、此の人間お互ひの恩を受けたのでもこれは容易ならぬことゝ思ふ。間接、直接に、もつと深く考へると、天地の大恩と云つてよいのである。それに、また、いろ〳〵の意味も籠つて居るが、その大恩を受けて、漸く半人前か一人前の人間になつた。振り返つてみると、到底、自分は、獨り立ちで、今日ま
  translation: '舞いに来てくださる方々も入れ替わり立ち替わりで、みな心配してくださった。それなのに、自分だけは当時のことをほとんど知らずにいた。

    医者にカンフルを注射され、何とかいう薬を飲まされた。それが飲みにくいので、また注射をされた。病気はずいぶん危ないところまで進んでいた。確かに苦しいことは苦しく、胸に重い石でも載せて上から押されるようで、ちょっと困った。しかし、まだこんなことでは死ぬものではないと思っていた。

    そう思っただけではなく、もう少し進めていえば、今回の病気では死なないと、自分一人で決めていた。死なないと思うだけでなく、少しくどく言葉を重ねれば、実は死にたくなかった。昔の人で、一休和尚だったか、こういうことを言った人がいる。一休の例をまねるわけではないが、どうしても死にたくないと思っていた。

    「死を見ること帰るがごとし」といったことを口にするのは、私たちには日常のことだ。死ぬくらいは故郷へ帰るようなもの、一日働いて夜に少し休むようなものだと、口でもいい、自分でもそう決めている。それでも今回の病気では、死にたくないと思った。

    なぜか。少し述べるなら、私はこの世に生まれる前、胎内にいたときから両親の大きな恩を受け、生まれてからも同じだった。両親の恩はもちろん、教えてくださった師匠の恩、友人の恩がある。さらに広げて考えれば、知り合いであるかどうかに関係なく、人間同士で受けてきた恩だけでも並大抵ではない。直接・間接に、もっと深く考えれば、天地の大きな恩といってよい。

    そこにはいろいろな意味も含まれるが、その大恩を受けて、ようやく半人前か一人前の人間になった。振り返れば、決して自分一人の力で今日ま'
  notes:
  - 冒頭はscan167、末尾はscan169に続く。カンフル注射などは当時受けた医療の記述として訳した。
  sequence: 243
- id: zen-169-01
  scan: 169
  section: 病中の感想／二、死にともなかつた
  original: で來たわけでない。それが人生百歲とみて、五十歲は、まだ、つい七八年前のことで、漸く人生の半ばを過ぎて、これから少しづゝ御恩報じをしようといふ時期に推し移つてゐる。少しづゝ、いろ〳〵の恩に報答して行かなければならぬといふのに此儘、瞑目してしまつては、自分の素志に背く譯だからである。病ひの方では、此奴殺してやらうと思つたか何うか知らぬが、自分の慾張つた考から云へば、決して、今度は死にともなかつた。一日でも、一年でも、二年でも、成ることならば、慾張つて、七十も百もの齡を重ねて、以て、些かなりとも、何うぞして、佛敎道德でいふところの報恩の仕事をしたいと思つた。仕事といつても、大したことも出來まいが、志すところは、廣くいふと、天地の恩に報いたい、狹くいつても、佛敎では、四恩といつて、國王の恩、父母の恩、衆生の恩、宗敎即ち三寶の恩、我れ〳〵精神上の主たるところの大恩に報じたい。どうぞ、少くとも、一つ、自分は自分だけの仕事をして置きたい。こんなことを、病氣してをつても、慾張り根性で思つた。病中の感想といふたらば唯だ、それのみであつた。
  translation: 'で来たわけではない。人生を百年と考えれば、五十歳になったのはつい七、八年前のことだ。ようやく人生の半ばを過ぎ、これから少しずつ恩返しをしようという時期に入っている。さまざまな恩に少しずつ報いなければならないのに、このまま目を閉じてしまえば、自分のかねての志に背くことになるからである。

    病気のほうが「こいつを殺してやろう」と思ったかどうかは知らないが、私の欲張りな考えからすれば、今度は決して死にたくなかった。一日でも、一年でも、二年でも、できることなら欲張って七十歳、百歳と年を重ね、ほんの少しでも何とか、仏教道徳でいう報恩の仕事をしたいと思った。

    仕事といっても大したことはできないだろうが、志としては、広くいえば天地の恩に報いたい。狭くいっても、仏教の四恩――国王の恩、父母の恩、衆生の恩、宗教すなわち三宝の恩――という、私たちの精神を支える大恩に報いたい。どうにか少なくとも一つ、自分には自分の仕事をしておきたい。そんなことを、病気の間にも欲張って考えていた。病中の感想といえば、ただそれだけだった。'
  notes:
  - 冒頭はscan168から続く。「三宝」は仏・法・僧。
  sequence: 244
- id: zen-169-02
  scan: 169
  section: 病中の感想／三、眞似をしたくない
  original: '三、眞似をしたくない


    我が佛敎では、生死一如といふやうなことは、言はゞ尋常の茶飯といつてよい。病氣になつてから、今更らの如く、生死一如とか、生滅不二とかいふやうなことは云ふだけ野暮である。兎に角、死の覺悟といふやうなことは、宗敎家としては、最も大切な問題として、平生から考へてをらなければならぬ。けれども、衲一個の考へから云ふと、死の覺悟といふほかに、別に覺悟はないであらうと思ふ。我れ〳〵が日々夜々、其境に臨み、その事に接し、その時々、其日々、感謝の念に住して、愉快に送つて行くのが、それが、衲の安心である。若し、死ぬ時は、端坐寂然として死ぬとか、筆を取つて偈を書して死ぬとか或'
  translation: '三　まねはしたくない

    仏教では、「生も死も一つだ」ということは、いわば日々の食事のように当たり前である。病気になってから改めて「生死一如」だの「生滅不二」だのといっても、野暮なだけだ。ともかく、死の覚悟は宗教家にとって最も大切な問題として、ふだんから考えていなければならない。

    しかし私個人の考えでは、死の覚悟というほかに、特別の覚悟はないだろうと思う。日々、出会う境遇や出来事に向き合い、そのときどき、その日その日を感謝の心で楽しく送っていく。それが私の安心なのである。

    死ぬときはきちんと座り、静かに死のうとか、筆を取って偈を書いて死のうとか、あるい'
  notes:
  - 末尾はscan170へ続く。
  sequence: 245
- id: zen-170-01
  scan: 170
  section: 病中の感想／三、眞似をしたくない
  original: は、坐脫立亡して殊勝な姿をして死ぬとかいふことは、衲一個だけは考へてをらぬ。それを考へておくのもよいが、その邊のことを考へてをる暇はない。其日〳〵の自分の務め、人間として爲すべきことを爲して、其儘、息を引き取つたら、衲一箇の極樂で、即ち、大往生と思つてをる。歷代の祖師方は、各、偈を唱へたり、又た坐を組んだりして死なれたところの立派なお手本がある。あるけれども、衲は、是非共、さういふことを眞似たくはない。出來るならば、それも結構だが、わざ〳〵さういふことを眞似たくない。唯だ息を引き取る時まで、各、其日〳〵の務めをして、スーと息を引き取つたら、それで早や本望である。大悟徹底も、即ち、それであると思つてをる。故に、お釋迦さまの死にやうが何うの、祖師方の往生際が何うのと云ふやうなことは、衲には問題でない。
  translation: 'は、座ったまま、立ったままで死ぬというような立派な姿をとろうとか、私個人は考えていない。考えておくのもよいが、私にはそんなことを考えている暇がない。その日その日の自分の務め、人間としてするべきことをして、そのまま息を引き取れば、それが私の極楽であり、大往生だと思っている。

    歴代の祖師方には、偈を唱えたり、座を組んだりして亡くなった、立派な手本がある。けれども私は、どうしてもそのまねをしたいとは思わない。できるならそれも結構だが、わざわざまねはしたくない。ただ息を引き取るときまで、日々の務めを果たし、すうっと息を引き取れたら、それでもう本望である。大悟徹底というのも、それだと思っている。だから、お釈迦さまの死に方がどうだ、祖師方の最期がどうだということは、私には問題ではない。'
  notes:
  - 冒頭はscan169から続く。「坐脱立亡」は座ったまま、または立ったまま死ぬこと。
  sequence: 246
- id: zen-170-02
  scan: 170
  section: 病中の感想／四、理想的の死に方
  original: '四、理想的の死に方


    昔、有名なソクラテースが、死ぬ時に、何も哲學者染みた悟りみたやうなことを云はないで、唯、「私が某から一疋の雞を借りてをるが、これだけ返して吳れ」と云つて橫臥して死んだ。これは、衲の理想に適つてをる。わが禪の立場から云ふと、有難い顏をして、手を合せて偈でも唱へて死ぬのも宜しいが、寧ろ、何方を取るかと云へば、ソクラテースが、借りた雞を返しておいて、これでモウ世の中に借りがないから息を引き取ると云つて、スーと逝つた方が男らしい。佛さまや、神さまの往生としては何うか知らぬ、人間の往生としては、ソクラテースの方が衲の氣に入つてをる。これに、いろ〳〵理窟をつけずして、自分は、さ'
  translation: '四　理想的な死に方

    有名なソクラテスは、死ぬとき、哲学者めいた悟りの言葉など何もいわず、ただ「私はある人から鶏を一羽借りている。それだけ返してくれ」といって、横になって亡くなった。これは私の理想にかなっている。

    禅の立場からいえば、ありがたそうな顔をし、手を合わせ、偈を唱えて死ぬのもよい。しかしどちらを選ぶかといえば、ソクラテスのように、借りた鶏を返しておいてくれ、これで世の中にもう借りがないから息を引き取る、といって、すうっと逝くほうが男らしい。

    仏や神の往生としてはどうか知らないが、人間の往生としては、ソクラテスのほうが私の気に入っている。いろいろ理屈を付けず、私はそ'
  notes:
  - ソクラテスの最期の逸話は著者の叙述をそのまま訳した。末尾はscan171へ続く。
  sequence: 247
- id: zen-171-01
  scan: 171
  section: 病中の感想／四、理想的の死に方
  original: ういふ方面に大變な同情を持つてをる。病中の感想といつて約めて云つてしまへば唯だそれだけである。かういふやうな有樣である。今、此處で話をしてをりながら死んでも、それでも宜しいのである。佛敎では、常に、煩惱を排斥して悟りを求めるといふことを申すが、これを現實的に云つて見ると、唯だ古いものを捨てゝ新しいものを取るといふほどのことである。これは衲一箇の臆說かも知れぬが、古いものを捨て、新しいものを取る、別言すれば、新陳代謝する、即ち、我れ〳〵が玆に存在して生き〳〵として活動してをるのは、畢竟、新陳代謝作用の表現である。元來、此の身體は、みな、細胞から出來てをる。血も、骨も、肉も、皮も、細胞も、平たく云へば、ごく〳〵微細な蟲のやうなものが、幾つも堆く高まつて、さうして一つの身體を作つてをるのである。我れ〳〵人類が、國家を作つたり、社會を造つたりしてをるのも、丁度、この身體を造り上げてをる細胞みたやうなものである。若し、一匹の細胞が務めを怠り、小さな蟲一つが、段々、務めを離れてくると、健全な身體も、何時の間にか虛弱になつて役に立たなくなる。健全なる身體であるならば、無數の細胞が、新陳代謝を續けて、身體の中に活動してをるのである。人類社會もさうで、百年も千年も、新陳代謝が行はれず、その儘にして行つた時は、宗敎も、道德も、悉く、退歩してしまふ。細胞が怠ると、病氣になり、遂ひに死滅に歸して行くのである。故に、我れ〳〵は、先づ、體中の小さな蟲一匹として、即ち、社會の一員として此の健康を保ち、さうして、常に怠らずして、務めて以て病氣に打ち勝ち、常に健康にならなければならぬ。健康になつたたならば、更に、一層、勇氣を鼓して働かうといふのが、それが一種の宗敎的信仰であらうと思ふ。
  translation: 'ういうあり方に大いに共感している。病中の感想を短くいってしまえば、ただそれだけである。

    私はそういう心持ちでいる。今ここで話している最中に死んだとしても、それでもよい。仏教では、煩悩を退けて悟りを求めると常にいうが、それを現実の言葉でいえば、古いものを捨てて新しいものを取る、というほどのことである。

    これは私一人の考えかもしれないが、古いものを捨てて新しいものを取る、別の言い方なら新陳代謝するということだ。私たちがここに存在し、生き生きと活動しているのも、結局、新陳代謝の働きが表れているのである。

    もともとこの体は、みな細胞でできている。血も骨も肉も皮も細胞である。平たくいえば、ごく小さな虫のようなものが幾つも積み重なって、一つの体を作っている。人類が国家や社会を作っているのも、ちょうど体を作る細胞のようなものである。

    もし一匹の細胞が務めを怠り、小さな虫の一つがだんだん務めから離れていくと、健全な体もいつの間にか弱くなり、役に立たなくなる。健全な体であるなら、無数の細胞が新陳代謝を続け、体の中で活動している。

    人間社会も同じで、百年も千年も新陳代謝が行われず、そのままでいれば、宗教も道徳もすべて退歩する。細胞が怠れば病気になり、ついには死滅へ向かうのである。

    だから私たちは、まず体の中の小さな虫の一匹として、つまり社会の一員として、自分の健康を保ち、常に怠らず、努力して病気に打ち勝ち、健康でいなければならない。健康になれば、さらにいっそう勇気を出して働こうとする。それが一種の宗教的信仰なのだと思う。'
  notes:
  - 冒頭はscan170から続く。細胞を虫にたとえる説明や社会との類比は著者の表現を保ったもので、現代医学の説明として補正していない。

  section: 禪と鎌倉武士／八 膽斗の如き相模太郞
  original: 'は、皆な忽必烈の綱の中へ入つて居つた時分である。

    獨り日本が東海の一孤島として、超然として彼れの毒手を免れて居つた。若し、大蒙古を大なる鷲に譬へたら、日本は赤蜻蛉くらゐのものである。さうして、彼等が、他國を侵略するのは、唯だ、自己の封豕長蛇の欲望を滿たさんが爲めで、殊に日本に押し寄せて來たのは、彼れの黑幕たる伊太利人のマルコポールが、日本は天國のやうな黃金國で、金銀珠玉、有らゆる世界の寶が滿ち〳〵てゐるから、早く行つて御取りなさいと進言したといふことが、歷史上に見えてゐる。

    そこで、元から、初めて、使者を寄越したのは、時宗公の十九歲の文永五年で、そのとき、使者の持つてきた手紙は、一口に言ふと、信交しよう、御互ひに仲好くしようと云ふやうな手紙であるが、しまひに、我れの言ふことを肯かなければ、遂ひに干戈に訴へねばならぬが、かうなると御互ひ不幸ではないかと云ふやうな脅し文句が入つてゐたので、其時は鎌倉幕府は答へなかつた。

    其後、文永八年、更らに、趙良弼を使として再度の手紙を寄越したのであるが、時宗は、猶ほも、其の國書の文の無禮なるを怒つて、其使の、京都、並びに、鎌倉に來るを許さず、唯だ〳〵筑紫に於て、方外の聖一國師や大應國師をして、之れに應接せしめ、敵國の事情をも探らしめたのである。

    再度まで、國使を斥けられたる忽必烈は、何んで點止すべきや、扨てこそ、我が文永十一年に高麗の戰艦を合せて攻めて來た。此時、肥筑沿岸一帶の地方は、元兵の亂暴狼藉に委せられて、壹岐、對島の守護職は討死をなし、甚しきは、無辜の婦女を捕へて姦し、其上、掌に穴を穿ち、此に繩を通して軍艦の周圍に垂下げたといふことである。あゝ亦た慘ならずやと云はねばならぬ。

    その翌年、更らに、杜世忠ほか五人を使ひとして、又たしても、我國を招きに來たのである。其時に、時宗は、

    「彼れ無名の師を起して、斬殺を恣にしながら、尙ほ、厚顏にも、使ひを送るは'
  translation: 'すべてフビライの網の中に入っていた時分である。

    ただ日本だけが東海の一孤島として、毅然と、その毒手を免れていた。大蒙古を大きな鷲にたとえるなら、日本は赤トンボほどのものだった。彼らが他国を侵略するのは、ひたすら大イノシシや大蛇にも似た貪欲さを満たすためだった。とりわけ日本へ押し寄せたのは、黒幕であるイタリア人マルコ・ポーロが、日本は天国のような黄金の国で、金銀や宝玉など世界中の宝が満ちているから、早く行って手に入れなさい、と進言したためだと、歴史に記されている。

    元が初めて使者を送ったのは、時宗公十九歳の文永五年だった。その手紙は、一言でいえば、信頼して交際し、互いに仲よくしようという内容だったが、末尾には、こちらのいうことを承知しなければ、ついには武力に訴えなければならず、そうなれば双方とも不幸ではないか、という脅し文句があった。そのため鎌倉幕府は返答しなかった。

    その後、文永八年に、趙良弼を使者として再び手紙を送ってきた。しかし時宗は、その国書の無礼な文面に改めて怒り、使者が京都や鎌倉へ来ることを許さなかった。ただ筑紫で、俗世を離れた聖一国師や大応国師に応対させ、相手国の事情も探らせたのである。

    二度も使者を退けられたフビライが、どうしてじっとしていよう。そこで文永十一年に、高麗の軍艦も合わせて攻めてきた。このとき肥前・肥後、筑前・筑後の沿岸一帯は元兵の乱暴にさらされ、壱岐と対馬の守護は戦死した。ひどいことには、罪のない女性を捕えて犯し、そのうえ手のひらに穴を開け、縄を通して軍艦の周囲に垂れ下げたという。ああ、なんと惨いことか、といわなければならない。

    翌年、さらに杜世忠ほか五人を使者として、また日本に服属を求めに来た。そのとき時宗は、

    「彼らは大義名分のない戦争を起こし、ほしいままに人を斬り殺しておきながら、なおも厚かましく使者を送るとは、'
  notes:
  - マルコ・ポーロの進言や元兵の行為については、著者が伝える歴史叙述として訳した。「招き」は前後の文脈から服属要求と解した。

  section: 生死は一如なり／四、深草の閑居夜雨の聲
  original: 四、深草の閑居夜雨の聲人は生まれたからと云つて、今まで無かつたものが新たに出來たのでもなければ死んだからと云つて、今まで有つたものが急に無くなつたのでも無い。生死は瞬間の閃きに過ぎない。ピカツと電光が閃いたやうなもので、生じたのでもなく、無くしたのでもない。各人は、種々樣々の煩惱妄想を、自分の腹の中に詰め込んでをつて、人生五十だの、七十古來稀れなりだの、朝露の如しだの、夜半に嵐の吹かぬものかはなど、まことに取り越し苦勞をしてゐるが、人は力の續く限り活動して死ねば其れで本望で
  translation: '四　深草の静かな住まいに、夜の雨の音


    人が生まれたからといって、それまでなかったものが新しくできたのでもなければ、死んだからといって、それまであったものが急になくなったのでもない。生と死は、一瞬のきらめきにすぎない。ぴかっと稲妻が光ったようなもので、新たに生じたのでも、なくなったのでもない。


    人はそれぞれ、さまざまな煩悩や妄想を腹の中に詰め込み、人生は五十年だの、七十まで生きる者は昔からまれだの、朝露のようにはかないだの、夜中に嵐が吹かないとは限らないだのと、ずいぶん取り越し苦労をしている。しかし人は、力の続く限り活動して死ぬなら、それで本望'

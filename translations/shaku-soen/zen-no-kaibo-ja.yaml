  section: 武士道を他にも及ぼせ／五 偉大なる宗敎の力
  original: '五、偉大なる宗敎の力


    要するに、日本人の宗敎に對する感想は、まことに輕薄であり、冷淡である。宗敎を信ずる心がなく、唯だ利益の爲めであつて、眞に熱誠な者は尠い。日本傳道よりも、朝鮮、支那、若しくは、印度地方の傳道は、遙かに上位にありとは、耶蘇宣敎師の言ふところである。實に、我が日本の爲めに慨歎すべきことではないか。宗敎の特色とするところは、現在一世でなく、現在、及び、將來に涉りて、誠實の心を以て働くにあるのである。一時の利益に晦まされずして、永久不變の靈光を仰ぐにある。或ひは、神に對して敬虔の念を拂ふが如きも、又たは佛の無眼大悲の慈光に接して自己の貪欲、瞋恚、愚痴の煩惱を洗ひ落し、天眞の流露し來るものも、宗敎の特色とするところである。然るに、無宗敎者には、かくの如き麗はしい精神が無い。一時の利益さへ得ればあとは何うでも構はぬと云ふやうである。宗敎の普及した土地と、せざる土地とが、其の犯罪人の數が違ふといふことが、現實に證據だてられて居る。'
  translation: '五　宗教の偉大な力


    要するに、日本人の宗教に対する態度は、まことに軽薄で冷淡である。宗教を信じる心がなく、ただ利益のためだけで、真に熱誠のある者は少ない。日本よりも、朝鮮、中国、あるいはインドでの伝道のほうが、はるかに良好だとは、キリスト教宣教師のいうところである。日本のために実に嘆かわしいことではないか。

    宗教の特色は、今の一生だけでなく、現在から将来にわたり、誠実な心をもって働くことにある。一時の利益に目をくらまされず、永遠に変わらない霊妙な光を仰ぐことにある。

    あるいは神に敬虔な思いを捧げ、あるいは仏の限りない大きな慈悲の光に触れて、自分の貪り、怒り、愚かさという煩悩を洗い落とし、生まれながらの純真さがあふれ出してくることも、宗教の特色である。

    ところが、宗教を持たない者には、このような美しい精神がない。一時の利益さえ得れば、後はどうでもよいというようである。宗教が普及している土地と、普及していない土地とでは、犯罪者の数が違うということが、現実に証拠立てられている。'
  notes:
  - 無宗教者や伝道地域についての一括した評価、犯罪件数に関する主張は、原著の宗教観と時代認識を示すものとして訳した。裏付けとなる統計は本箇所には提示されていない。
  - 原著の「無眼大悲」は文脈上「無限大悲」、「持色」は「特色」の趣旨と解して訳した。

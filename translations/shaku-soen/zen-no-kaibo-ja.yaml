  section: 圓朝の新桃太郞
  original: て二三の同僚と共に席に列なつた。其時、居士は、一同に向つて、「大の話下手の圓朝が、今日は、舌を切り、口を結んで、一席、語るさうで御座いますから、御聞き下さい」と披露された。やがて、圓朝は講釋の席に案內されたが、座に上つて、待てども〳〵一人の聽衆も來ない。すると、圓朝は、この聽き手のない空室で、獨り扇を叩いて語り出したのは、苦心慘憺の末、自分で作り出した「新桃太郞」と題する講談であつた。これは、至つて臆病な桃太郞が、鬼ケ島を恐がつて、よう敵打ちに行かないといふ筋に作つたもので、圓朝は獨り興に乘じて滔々と一席辯してしまふと、今まで、閴として聲なかつた空室の四隅から、割れるやうな喝采の拍手が起ると共に隔ての襖が一時に徹せられると、そこには聽衆が充滿してをつた。居士は、「まことに上出來であつた」と賞められ、語を次いで、「併し、私では能く分らんから、幸ひ滴水和尙も見えて居るから、和尙に批評を願ふがよい」と云はれると、和尙も、亦た、「まことに結構であつた」と許されたといふことぢや。講釋は一つの技藝に過ぎない。それでも、一世の名人となるには、これほどの苦心が要る。鐵舟居士が、嚴しい手段をとつて、絕體絕命の域に至らしめたのは、獅子が其子を千仞の谷底に突き落して、奮迅の勇を養はしめるやうなもので、これを「獅子迷子の訣」と云つて、古來、禪門の師家は、皆な此の手段を用ひて居る。學人も、亦た、此の絕體絕命のところまで奮進しなければ遂ひに悟入の期はないのである。
  translation: 'て、二、三人の仲間とともに出席した。そのとき居士は、一同に向かって、

    「大変な話下手の円朝が、今日は舌を切り、口を閉じて、一席語るそうですから、お聞きください」

    と紹介した。やがて円朝は講釈の席へ案内されたが、座に上がり、待てど暮らせど、聴衆は一人も来ない。すると円朝は、この聞き手のいない空室で、一人扇をたたいて語り始めた。それは、苦心惨憺の末に自分で作った「新桃太郎」という講談だった。たいへん臆病な桃太郎が、鬼ヶ島を怖がって、敵討ちに行くことができないという筋にしたものである。円朝が一人で興に乗り、とうとうと一席を語り終えると、それまでひっそりとして声のなかった空室の四隅から、割れるような喝采の拍手が起こった。同時に隔てのふすまが一斉に取り払われ、そこには聴衆がぎっしり詰めかけていた。居士は、

    「まことに上出来だった」

    とほめ、続けて、

    「しかし、私にはよくわからない。幸い滴水和尚もお見えだから、和尚に批評していただくがよい」

    といった。すると和尚も、

    「まことに結構だった」

    と認めたという。

    講釈は一つの技芸にすぎない。それでも、一代の名人になるには、これほどの苦心が必要なのである。鉄舟居士が厳しい手段を取り、絶体絶命の境地に追い込んだのは、獅子がわが子を千仞の谷底に突き落とし、奮い立つ勇気を養わせるようなものだ。これを「獅子迷子の訣」といい、昔から禅の指導者は皆この手段を用いている。学ぶ者もまた、この絶体絶命のところまで奮い進まなければ、ついに悟りに入る機会はないのである。'
  notes:
  - 「舌を切り、口を結ぶ」「獅子迷子の訣」は、ここでは表面的な技法や依存を打ち破る禅の指導の比喩。

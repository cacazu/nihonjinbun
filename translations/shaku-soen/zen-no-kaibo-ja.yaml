  section: 隱德を積め／六 丹霞、木佛を燒く
  original: '六、丹霞、木佛を燒く


    こんなことは「無我」から起つたことで、今まの坊さんには、自分の慾のために佛や佛具を賣るのがあるが、これとは雲泥月鼈の差である。往昔、丹霞和尙といふ方があつた。頗る奇拔な和尙さんであつたが、寒い時、暖を取るに何も焚くものが無い。そこで、佛壇から佛像を取り出し、それを焚いて暖'
  translation: '六　丹霞、木の仏像を焼く


    こうしたことは「無我」から生まれたのである。今の僧侶には、自分の欲のために仏像や仏具を売る者もいるが、それとは天と地、月とスッポンほどの違いがある。

    昔、丹霞和尚という方がいた。たいへん奇抜な和尚だったが、寒いとき、暖を取るために燃やす物が何もなかった。そこで仏壇から仏像を取り出し、それを燃やして暖'

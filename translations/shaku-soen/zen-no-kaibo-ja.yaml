  section: 人生は大夢なり／三、樂み春の如し
  original: 「此人、平生、夢想消滅して、而も寤寐恒一なり」で、平生、夢想消滅して、さうして、寢ても覺めても恒一で、常に、同じ境界に居る、これが悟つた人の境界である。禪家の修行は、此の境界に到るの修行だ。
  translation: '「この人は、ふだんから夢や妄想が消え去り、目覚めていても眠っていても、いつも一つの境地にある」

    ということだ。ふだんから夢や妄想が消え、寝ても覚めても変わらず、いつも同じ境地にいる。それが悟った人の境地である。禅の修行は、この境地に達するための修行なのだ。'

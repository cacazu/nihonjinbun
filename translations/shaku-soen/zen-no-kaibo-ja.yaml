  section: 誰か言ふ弱き者と／四 慈悲心は其儘勇氣也
  original: '四、慈悲心は其儘勇氣也

    それであるから、妙法蓮華經觀世音菩薩普門品第二十五にも、

    「若し是の觀世音菩薩の名を持する者ありて、若し大火に入るも、火も燒く能はず……若し大水の漂はすところとなるも、其の名號を稱ふれば、即ち、淺きところを得べし。」

    とある。その意味たるや外では無い、大慈大悲の心さへあつて、此心を我が胸中に堅く把握してをつたならば、火の中、水の中に飛び込んでも、燒けもしなければ溺れもしない。即ち、世の爲め人の爲めならば、我身も惜しくはないといふ大安心を得て、少しも恐るゝところなく死に就くこと歸するが如しといふ大勇猛心を得らるゝものであるといふのである。慈悲の心は勇氣と全く異なつた心の作用ではない。勇氣は其のまゝ慈悲心であり、慈悲心は其まゝ勇氣である。世の爲め、人の爲めといふ大慈悲心が胸中に旺んであつたならば、大勇氣は求めずして自ら浡然として起り來るものである。故に、大慈大悲、即ち之れ大勇氣である。

    世間には、他人の苦しみに同情する慈悲心はあるが、些細の事にも恐怖を覺えて進んで難局に當る勇氣がなくて困るなどと云ふ者もあるやうであるが、慈悲心があつて勇氣が無いといふ道理はない。それは、畢竟するに、其人の慈悲同情の心が小さくして、大慈大悲でないから、勇氣が無いのである。'
  translation: '四　慈悲の心はそのまま勇気である

    だから『妙法蓮華経』の「観世音菩薩普門品」第二十五にも、こうある。

    「この観世音菩薩の名を心に保つ者は、大火の中に入っても、火はその身を焼けない。……大水に流されても、その名を唱えれば、ただちに浅いところにたどり着ける」

    その意味はほかでもない。大慈大悲の心があり、それを胸の内にしっかり保っていれば、火や水に飛び込んでも焼けず、溺れもしない。つまり、世のため、人のためなら自分の身も惜しくないという、大きく揺るぎない安心を得て、少しも恐れず、我が家へ帰るように死に赴けるほどの勇猛な心を得るということである。慈悲は、勇気とまったく別の心の働きではない。勇気はそのまま慈悲であり、慈悲はそのまま勇気である。世のため、人のためという大きな慈悲が胸の内に盛んであれば、大きな勇気は求めなくても、自然に湧き起こる。だから、大慈大悲はそのまま大勇気なのである。

    世間には、他人の苦しみに同情する慈悲はあるが、些細なことにも恐怖を感じ、進んで難局に当たる勇気がなくて困る、という人もいるようだ。しかし、慈悲があるのに勇気がないという道理はない。結局、その人の慈悲や同情の心が小さく、大慈大悲になっていないから、勇気がないのである。'
  notes:
  - 経文の省略記号は原本にある。火・水の一節について、著者は続く文で恐怖を超える心の意味を説明している。

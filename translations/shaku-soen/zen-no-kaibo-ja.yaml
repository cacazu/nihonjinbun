  section: 隱德を積め／四 佛敎の謂ゆる無我
  original: '四、佛敎の謂ゆる無我


    陰德といふことは、「隱れて善いことをすることである」と云はゞ、一言にして盡くされるが、口に言ひ易くして、實行は、なか〳〵六ケ敷い。如何なる心持ちでするかと云へば、即ち、緣の下の力持ちをするといふ心でやる。ところが、今の世の中は、報酬を得て、善いことを仕ようどころではなく、惡いことをして善いことを仕たやうに見せようとする。立派な肩書や、榮譽あり、勳位を有する地位ある人でありながら、驚くべき惡いことをするのが數多くあるとすれば、如何に學問が開けて、物質的進歩が盛んであると云つても、其實、甚だ寒心の至りに堪へぬではないか。物質的進步は、いくら進んでも、遂ひに半面の進歩たるに過ぎない。これに伴ふに、健全なる精神的進步を以てせなければならぬ。健全なる精神的進步とは、健全なる道德心の進步、健全なる宗敎思想の進歩である。羅馬末葉の歷史を見ても、希臘、印度衰亡の歷史を調べても、外面は絢爛として春の花の咲ききそふが如く榮えて見えつゝある間に、その裏面、即ち、精神的方面は、旣に腐敗しかけてあつた。外面の立派な時は、それに反して、精神界は激しく腐敗したがるものである。謂ゆる、「骸骨の上を粧うて花見かな」で、外面は綺羅を飾つて居るが、それを剝ぐと醜なる骸骨である。どうしても、陰になつて善事を行ひ、緣の下の力持ち、即ち、家屋の礎たるところの人が多くなければならぬ。陰德を積む、即ち、緣の下の力持ちをするが如き善い行ひを仕ようと思へば、どうしても「無我」といふことを考へなければならぬ。ところが、佛敎では、何んぞと云ふと、直ぐ「無我」といふことを云ふ。そんな事は、此の世智辛い生存競爭の'
  translation: '四　仏教でいう無我


    陰徳とは「人に知られず善いことをすることだ」といえば、一言で言い尽くせる。だが、口にするのは簡単でも、実行はなかなか難しい。どういう気持ちでするかといえば、縁の下の力持ちになろうという心で行うのである。ところが、今の世の中は、報酬を得て善いことをしようというどころか、悪いことをして善いことをしたように見せようとする。

    立派な肩書や栄誉があり、勲位を持つ地位のある人でありながら、驚くほど悪いことをする者が多いとすれば、どんなに学問が進み、物質的進歩が盛んだといっても、実情はまことに心細く、恐ろしい限りではないか。

    物質的進歩はどれほど進んでも、結局は半面の進歩にすぎない。それに健全な精神的進歩を伴わせなければならない。健全な精神的進歩とは、健全な道徳心の進歩、健全な宗教思想の進歩である。

    ローマ末期の歴史を見ても、ギリシャやインドが衰亡した歴史を調べても、外面は絢爛として、春の花が咲き競うように栄えて見える間に、その内側、つまり精神的な面は、すでに腐敗し始めていた。外面が立派なときは、それに反して、精神の世界は激しく腐敗しがちなものである。いわゆる、

    「骸骨の上を美しく着飾って、花見に出かけることよ」

    ということで、外側は美しく装っていても、それをはぎ取れば醜い骸骨である。どうしても、陰で善行を行い、縁の下の力持ち、つまり家の礎となる人が多くなければならない。

    陰徳を積む、つまり縁の下の力持ちになるような善行をしようと思えば、どうしても「無我」を考えなければならない。ところが、「仏教では何かというとすぐ無我という。そんなことは、この世知辛い生存競争の'
  notes:
  - 末尾は次スキャンへ続く。

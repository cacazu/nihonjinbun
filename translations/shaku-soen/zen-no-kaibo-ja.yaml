- id: zen-182-01
  scan: 182
  section: 菜根譚十則／八
  original: 鳥語蟲聲、總是傳心之訣、花英草色、無非見道之文、學者要天機淸徹、胸次玲瓏、觸物皆有會心處、（鳥語蟲聲も、總て是れ傳心の訣なり。花英草色も、見道の文に非るは無し。學者、天機淸徹、胸次玲瓏、物に觸れて皆な會心の處あらんことを要す）天地の大道といひ、宇宙の眞理といふものは、言語文字の到底盡くすところではない。故に、釋尊も、四十九年間、說法せられた後に、我れは一字を說かずと云はれた。我が禪宗では、以心傳心といつて經論によつては敎へを立てないのぢや。直ちに心を以て傳へ、代々、佛心を相傳して居るのである。こゝに佛心といつたからとて、そんな特別の心がある譯けではなく、宇宙の眞理が即ち佛心である。天地の大道が即ち佛心ぢや。此れを傳へるからと云つても、右から左へ器物を傳へるやうに行くものではない。傳はるからと云つても、各人が自得自悟する外には無いのである。然らば、如何にして自得自悟するかと云ふと、萬物を除いて悟りやうが無い。仰いで天象を眺め、伏して地理を察する。見るもの、聞くもの、悉く、佛心の發露である。宇宙の眞理の露現である。だから、鳥語蟲聲も總て是れ傳心の要訣であると云つたのぢや。花英（花びら）草色も、大道を見した文章に非るはなしぢや。天地萬物は分明に眞理を眼前に擴げて居るが、これを徹見悟了するものゝ稀れであるのは何故かといふと、人々の胸裡に煩惱妄想が充ち塞がつて居るからぢや。學者、能く、天然の心機（心作用）を淸く明らかに澄ませて、胸中を玲瓏たらしめ、見聞するところの物は皆な自己の心に會得するところがあるやうに力めねばならぬ。胸次は胸中といふに同じぢや。玲瓏は、透き通ることぢや。
  translation: '「鳥のさえずりも虫の声も、みな心を伝える秘訣である。花びらや草の色も、道を示す文章でないものはない。学ぶ者は、自然に備わる心の働きを澄み切らせ、胸の内を透き通らせ、何に触れても心に深く会得するものがあるようにしなければならない」

    天地の大道、宇宙の真理というものは、言葉や文字では到底尽くせない。だから釈尊も、四十九年間説法したあとで「私は一字も説かなかった」といわれた。禅宗では「以心伝心」といって、経典や論書によって教えを立てない。直接、心をもって伝え、代々、仏心を受け継いでいるのである。

    仏心といっても、特別な心があるわけではない。宇宙の真理、天地の大道が、そのまま仏心なのである。それを伝えるといっても、右から左へ品物を渡すようにはいかない。伝わるといっても、それぞれが自分で会得し、自分で悟るほかはない。

    では、どうして自分で悟るのか。万物を離れて悟る方法はない。仰いで天の現象を眺め、伏して大地の様子を観察する。見るもの、聞くものは、ことごとく仏心の現れであり、宇宙の真理が姿を現したものである。だから鳥の声も虫の声も、みな心を伝える要点だといったのだ。花英、つまり花びらや、草の色も、大道を表す文章でないものはない。

    天地万物は、はっきりと真理を目の前に広げている。それを見通し、悟りきる人が少ないのはなぜか。人々の心が煩悩や妄想でふさがっているからである。学ぶ者は、自然に備わる心の働きを清く明らかに澄ませ、胸の内を透き通らせて、見聞きする何からも自分の心に会得するものがあるよう努めなければならない。「胸次」は胸の内のこと。「玲瓏」は透き通ることである。'
  notes:
  - 第八則の見出しはscan181末尾。
  - 漢文と同内容の訓読は原文に両方保持し、現代語訳は同一引用として一度だけ示した。後続の評釈は省略していない。
  sequence: 270
- id: zen-182-02
  scan: 182
  section: 菜根譚十則／九
  original: '九


    人解讀有字書、不解讀無字書、知彈有絃琴、不知彈無絃琴、以跡用、不以神用、何以得琴書之趣、'
  translation: '九

    「人は文字のある書物を読むことは分かっても、文字のない書物を読むことは分からない。弦のある琴を弾くことは知っても、弦のない琴を弾くことは知らない。形の上だけで用い、その精神を働かせないなら、どうして琴や書物の本当の趣を得られるだろう」'
  notes:
  - 漢文引用の訓読はscan183へ続く。現代語訳はここにまとめて示す。
  - 漢文と同内容の訓読は原文に両方保持し、現代語訳は同一引用として一度だけ示した。後続の評釈は省略していない。
  sequence: 271
- id: zen-183-01
  scan: 183
  section: 菜根譚十則／九
  original: （人は有字の書を讀むを解して、無字の書を讀むを解せず、有絃の琴を彈ずるを知つて、無絃の琴を彈ずるを知らず、跡用を以つてして、神用を以てせず、何を以てか琴書の趣を得ん）多くの人は、文字ある書物を讀むことは知つてをるが、文字のない活書を讀むことを知つてゐない。絃ある琴は之れを彈ずるが、絃なき琴を彈ずるものは少い。と云ふのか、跡用、即ち、形體にのみ執り着いて居つて、精神を用ふるといふことが出來ないからである。かくては、如何でか眞實の琴や書の趣味を會得することが出來ようか。昔、晋の代の陶淵明は、一張の無絃琴を所持してをつて、常に此れを彈じて樂んでをつた。或人が、其の絃の無いのを怪しんで問ふと、淵明は「若し琴中の趣を知らば、何ぞ絃上の聲を弄せんや」と答へたといふことであるが、淵明の如きは、眞に無絃の琴を彈することを解せる者と云はねばならぬ。
  translation: '多くの人は、文字のある書物を読むことは知っているが、文字のない、生きた書物を読むことを知らない。弦のある琴は弾くが、弦のない琴を弾く人は少ない。なぜかといえば、跡用、つまり形だけにとらわれ、精神を働かせることができないからである。それでは、どうして琴や書物の本当の趣を会得できよう。

    昔、晋の陶淵明は、弦のない琴を一張持ち、いつもそれを弾いて楽しんでいた。ある人が弦のないのを不思議に思って尋ねると、淵明は「琴の本当の趣を知っていれば、どうして弦から出る音にこだわる必要があるだろう」と答えたという。淵明のような人こそ、本当に弦のない琴を弾くことを知っていたといわなければならない。'
  notes:
  - 冒頭の漢文訓読はscan182の引用と同内容のため、現代語訳はzen-182-02にまとめた。この単位では続く解説を全文訳した。
  sequence: 272
- id: zen-183-02
  scan: 183
  section: 菜根譚十則／十
  original: '十


    一字不識、而有詩意者、得詩家眞趣、一偈不參、而有禪味者、悟禪敎玄機、（一字識らずして、而も詩意ある者は、詩家の眞趣を得、一偈參ぜずして、而かも禪味ある者は、禪敎の玄機を悟る）眞趣は、眞趣味である。偈は、禪の妙旨を述べた韻語である。玄機は、玄々微妙な禪の機用ぢや。たとひ、一字を識らぬ無學者でも、詩の意あるものは、立派に詩家の眞趣味を解し得るものである。たとひ、一偈を參究せずとも、禪の妙味を有する者は、立派に禪の玄妙な機用（はたらき）を悟つて居るものである。徒らに文字を功妙に並べるのみが眞の詩家でも無ければ、徒らに禪語のみを弄んで得意がつて居るものが眞の禪者でもない。'
  translation: '十

    「文字を一字も知らなくても詩心のある者は、詩人の本当の趣を得ている。禅の偈を一つも究めたことがなくても、禅の味わいがある者は、その奥深い働きを悟っている」

    「真趣」は本当の趣。「偈」は禅の深い趣旨を述べる韻文。「玄機」は、奥深く微妙な禅の働きである。

    たとえ一字も読めない無学な者でも、詩心があれば、詩人の本当の趣を十分に理解できる。たとえ一つの偈も究めたことがなくても、禅の妙味があれば、禅の奥深い働きを立派に悟っているのである。巧みに文字を並べるだけの人が本当の詩人なのではないし、むやみに禅語をもてあそんで得意になっている人が本当の禅者なのでもない。'
  notes:
  - 漢文と同内容の訓読は原文に両方保持し、現代語訳は同一引用として一度だけ示した。後続の評釈は省略していない。
  sequence: 273
- id: zen-184-01
  scan: 184
  section: 快人と快馬／一、快人の一言
  original: '一、快人の一言


    「快人の一言、快馬の一鞭」といふことがある。大悟徹底して迷悟凡聖を超越した快漢の一言一句は、能く事理の肯繫に當つて、寸鐵肺肝を剜ぐる底の機用がある。恰も、俊敏なる快馬が、一鞭の下に山河百里を疾驅するが如きをいふのである。かゝる快人は、一念の間に萬念を會し、一隅を擧ぐれば三隅を知るものであるが鈍漢は苦口叮嚀に委曲を盡しても容易に眼を開くことが出來ないで、說けば語に執し、示せば道に迷つて居る。然らば、如何にして、一言下に玄旨を會する底の快人となることが出來るか、ほかでは無い、實參實究である。誠心誠意の修行である。何と云つても禪は實地の修行がないと、如何に天賦の才能があつても、師家の一言によつて心眼を豁開することは出來ぬ。師家と學人との間に證契即通の出來るやうになるには、啐啄同時と云つて鷄が卵を溫めて、將さに孵らんとする時には、雛は中から啐き、親鷄は外から啄いて、啐と啄と同時になるやうに、師は資を誘導し、資は自ら參究して、互ひに機緣の熟するを待たねばならぬ。殊に、學人の實參は、最も眞摯に最も忠實で、謂ゆる、不惜身命的でなくてはならぬ。'
  translation: '一　快人のひと言

    「快人のひと言、快馬へのひと鞭」という言葉がある。

    大きく悟りきり、迷いと悟り、凡人と聖人という区別を超えた人物の言葉は、物事の急所にぴたりと当たり、短い刃で人の心の奥をえぐるほどの働きをする。ちょうど、足の速い名馬がひと鞭で山河百里を駆け抜けるようなものである。

    こういう人物は、一つの思いの中で万の思いを理解し、一隅を示されれば残りの三隅を知る。一方、鈍い者は、懇切丁寧に詳しく説いても、容易に目が開かない。説明すれば言葉にとらわれ、道を示せばかえって迷っている。

    では、どうすればひと言で奥深い趣旨を理解する快人になれるのか。ほかでもない、実際に教えを受け、徹底して究めることである。誠心誠意の修行である。禅は実地の修行がなければ、どんな生まれつきの才能があっても、師のひと言で心の眼を開くことはできない。

    師と学ぶ者の間で、悟りがぴたりと通じるには、「啐啄同時」ということが必要である。鶏が卵を温め、いよいよかえろうとするとき、雛は内から鳴き、親鳥は外からつつく。その内と外の働きが同時になるように、師は弟子を導き、弟子は自ら究め、互いに機会の熟するのを待たねばならない。とりわけ学ぶ者の実際の修行は、きわめて真摯で忠実に、身命を惜しまないほどの覚悟でなければならない。'
  notes:
  - 底本の「肯繫」は「肯綮」（物事の急所）の意として訳した。
  sequence: 274
- id: zen-184-02
  scan: 184
  section: 快人と快馬／二、獻身的辨道
  original: '二、獻身的辨道


    近頃は、眞實修行する積りで、師家に參ずるものは甚だ稀れで、多くは、禪を一種の娯樂地のやうに考へて居る。甚だ慨はしいことである。古人は、道の爲めには、實に、惨憺たる苦心をもしたものである。二祖慧可は、'
  translation: '二　身を捧げて道を修める

    近ごろ、本当に修行するつもりで師を訪ねる者はきわめて少なく、多くは禅を一種の娯楽の場のように考えている。まことに嘆かわしい。

    昔の人は、道のために実に厳しい苦労を重ねた。二祖の慧可は'
  notes:
  - 末尾はscan185へ続く。
  sequence: 275
- id: zen-185-01
  scan: 185
  section: 快人と快馬／二、獻身的辨道
  original: 達磨を訪うて、降りしきる雪の身を埋むるのを忘れて、其の提撕を請うた。それでも、請ひが容ひれられぬ爲めに、遂ひに、吾れと吾が臂を斷ち切つて、求道の赤誠を達磨に示したといふことは、最も有名な勝躅である。趙州和尙は、六十一歲にして、初めて、求道の志を起して四方を行脚し、常に、「七歲の兒童でも、吾れに勝れた力量のあるものには、行つて敎へを請うべきである」と云つて、二十年間、毫も修行を措かなかつた。八十にして初めて趙州觀音院に住したが、住山後も尙ほ辨道を怠らず、米穀盡くれば、栗の實、椎の實を充てゝ食したと傳へられて居る。今の人に、これほどの眞劔な修行を望んでも、到底、不可能なことゝして顧るものも無いのであらふ。併し、人生の一大事が、娛樂半分で解決せられると思ふのは大なる誤で、古人のやうに、二十年三十年の辨道は出來ぬにしても、一時間でも二時間でも、誠心誠意を籠めて修行をすることが肝要である。
  translation: '達磨を訪ね、降り続く雪が身を埋めるのも忘れて、教え導いてほしいと願った。それでも聞き入れられなかったので、ついに自分で自分の腕を断ち、道を求める真心を達磨に示した、というのは、たいへん有名な故事である。

    趙州和尚は六十一歳で初めて求道の志を起こし、各地を旅して歩いた。そして常に、「七歳の子どもでも、私より優れた力量があれば、そこへ行って教えを請うべきだ」といって、二十年間、少しも修行をやめなかった。八十歳で初めて趙州の観音院に住んだが、その後も修行を怠らず、米穀がなくなれば栗や椎の実を代わりに食べたと伝えられている。

    今の人にこれほど真剣な修行を望んでも、到底不可能だとして、顧みる人もいないだろう。しかし人生の一大事が遊び半分で解決できると思うのは、大きな間違いである。昔の人のように二十年、三十年の修行はできなくても、一時間、二時間でも、誠心誠意を込めて修行することが肝心なのである。'
  notes:
  - 慧可の断臂は著者が引用する宗門の伝承として訳したもので、実践を勧める趣旨ではない。冒頭はscan184から続く。
  sequence: 276
- id: zen-185-02
  scan: 185
  section: 快人と快馬／三、啐啄同時
  original: '三、啐啄同時


    修業は眞面目でなければならぬことは前述の通りであるが、如何に眞面目でも、熱心でも、若しその進むべき道を誤つて居つたならば、轅を北にして越に趣かんとするが如き謬に陷ることが生じて來るから、大いに注意をせねばならぬ。これ、古來、禪門に於て、無師獨悟を排斥して、參師問法を重んずる所以である。百丈禪師門下の傑物と稱された潙山と五峰と雲巖と三人が、或時、百丈禪師の左右に待して居つた時、百丈禪師が、その中の潙山に向つて、「咽喉唇吻を併却して作麼生か道はん」咽喉をつめ、唇をふさいで、大道の端的を如何に說くべきかといふと、潙山は、「却つて請ふ和尙道へ」'
  translation: '三　内からの働きと外からの導きが同時になる

    修行は真面目でなければならないと、先に述べた。しかし、どんなに真面目で熱心でも、進むべき道を間違えれば、車を北へ向けながら南の越へ行こうとするような誤りに陥る。だから大いに注意しなければならない。これが、古くから禅門で、師につかず一人で悟ったとすることを退け、師を訪ねて教えを問うことを重んじる理由である。

    昔、百丈禅師の門下の傑物といわれた潙山・五峰・雲巌の三人が、あるとき百丈のそばに控えていた。百丈は潙山に向かい、「咽喉も唇も口も使わずに、どういうか」と尋ねた。つまり、喉を閉じ、唇をふさいで、大いなる道の端的な姿をどう説くか、というのである。潙山は、「それなら、和尚のほうからおっしゃってください」と'
  notes:
  - 末尾の問答はscan186へ続く。
  sequence: 277
- id: zen-186-01
  scan: 186
  section: 快人と快馬／三、啐啄同時
  original: 禪師、貴方に御尋ねしやうと思つて居るところですと逆捻を食はせた。玆に於て百丈は、「汝に向つて道ふことは辭せず、恐らくは、己後、我が兒孫を失はん」汝に說明してやつても可いが、一句を說かんとすれば、相距ること千萬里、却つて我が法、斷絕して兒孫を失ふであらうと示した。これ、實に、快人の一言で、潙山、五峰、雲巖の三人は、忽ちにして、百丈の眞面目に相見し得たのである。導くものは快人、導かるゝものは快馬、玆に初めて、大法が現成したのである。佛法滴々の大意に至つては、實に、言詮不及、意路不到であつて、之れを說明せんと欲して、千言萬語を費しても、決して、目的を達することは出來ぬ。言語は、物の一面を示し得るのみで、物事の全體を示すことは出來ぬ。併し、此の言語は、吾人の知識に依つて取扱はれるところの言語である。謂ゆる快人の言は、知識を超越して居るから、驀直に眞如の當相を把捉するのであるから片言隻語、よく甚深微妙の法を詮示し得るのである。了
  translation: '「禅師、あなたにお尋ねしようと思っていたところです」と、逆に問い返した。そこで百丈は、「お前にいうことはやぶさかではない。しかし、それでは今後、私の教えを継ぐ子孫を失うことになるだろう」といった。お前に説明してやってもよいが、ひと言を説明しようとすれば、かえって千万里も隔たり、私の法が途絶えて、後継者を失ってしまうだろう、と示したのである。

    これはまさに快人のひと言で、潙山・五峰・雲巌の三人は、一瞬にして百丈の本来の面目に出会えた。導く者は快人、導かれる者は快馬。ここに初めて、大いなる法が現実となって現れたのである。仏法の、代々伝えられる根本の意味は、実に、言葉による説明も思考の道筋も届かないものである。説明しようと千言万語を費やしても、決して目的を果たすことはできない。言葉は物事の一面を示せるだけで、その全体を示すことはできない。

    ただし、ここでいう言葉とは、私たちの知識によって扱われる言葉である。いわゆる快人の言葉は知識を超えていて、ありのままの真実の姿をまっすぐにつかむ。だから、ほんのわずかな言葉で、きわめて深く微妙な法を明らかに示せるのである。

    了'
  notes:
  - 冒頭はscan185の潙山の返答を受ける。本文はこのscanで終わる。
  sequence: 278

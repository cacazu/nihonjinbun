  section: 誰か言ふ弱き者と／一 心裏の夜叉と天人と
  original: '八百萬の神々方の宮殿にもなれば、惡鬼羅刹の住む岩屋ともなるのぢや。各人の心に慈悲の芽が萠し、道を守つて奮鬪努力する間は、是れが即ち八百萬の神々方が赫灼たる靈光を放ちたまふ時で、貪瞋痴慢の火焰が烈々として燃え上る時が、是れ即ち惡鬼羅刹の心內に跳梁する時である。

    波斯の宗教では、世の中は、善神と惡神との戰場であつて、善神のすることを、片端から惡神が壞してゆくものとされてをるが、人の心は、謂ゆる「寸善尺魔」で、一寸ほどの善事をしようとすると、一尺もある惡魔が現はれてきて妨げを爲すものである。正念と邪念とが晝夜間斷なく心の中で戰つてをる。即ち、寸善と尺魔との爭ひであつて、此の戰ひの繼續が人の一生である。その戰ひは、佛と阿修羅との戰ひもあれば、暗い神と明るい神との戰ひもある。緊那羅が唄つたり、迦樓羅が囀つたり、美しい唄聲の聞こえることもあれば、又た毒々しい摩喉羅迦の姿が心の中に現はれる時節もある。

    此頃は餘り見受けないが、十數年前までは、能く蛇使ひの見世物があつたものだ。あの毒々しい姿の蛇を、蛇使ひの女が、自由自在に使つて、それを如何にも可愛らしいものに見せてをつた。女の心に住む貪瞋癡慢の毒蛇も、若し、大慈大悲の大智大勇猛心をもつて、巧みに使つて行つたならば、かの蛇使ひの蛇の如く可愛らしいものになつてしまふ。

    女人たるもの、己が心に伏在する、夜叉や阿修羅や摩喉羅伽と戰つて、是等を征服し、乾闥婆や緊那羅や迦樓羅などの美なる音樂を我が胸中に聞かうとするには、大慈大悲の心が存するといふだけでは六ケしい。大慈大悲を、一層發展せしめて、大智となし、大勇猛心となし、以て、自身が執金剛神たるに至つて、はじめて得られるのである。だから、法華經普門品にも「觀世音菩薩は時に執金剛神の姿を現じて說法す」と說いてある。'
  translation: '八百万の神々の宮殿にもなれば、悪鬼や羅刹の住む岩屋にもなる。一人ひとりの心に慈悲の芽が出て、道を守って懸命に努めている間は、まさに神々が輝く霊妙な光を放っているときである。反対に、貪り、怒り、愚かさ、おごりの炎が激しく燃え上がるときは、悪鬼や羅刹が心の中で暴れ回っているのである。

    ペルシアの宗教では、この世は善神と悪神の戦場であり、善神のすることを悪神が片端から壊していくとされている。人の心も、いわゆる「寸善尺魔」である。一寸ほどの善いことをしようとすると、一尺もある悪魔が現れて邪魔をする。正しい思いと邪悪な思いが、昼夜途切れず心の中で戦っている。つまり、小さな善と大きな魔の争いであり、その戦いが続くのが人の一生なのだ。その戦いには、仏と阿修羅との戦いも、暗い神と明るい神との戦いもある。緊那羅が歌い、迦楼羅がさえずり、美しい歌声が聞こえることもあれば、毒々しい摩喉羅迦の姿が心に現れることもある。

    近ごろはあまり見かけないが、十数年前までは蛇使いの見世物がよくあった。あの毒々しい姿の蛇を、女性の蛇使いが自由自在に操り、いかにもかわいらしく見せていた。女性の心に住む、貪り、怒り、愚かさ、おごりという毒蛇も、大きな慈悲から出る大いなる智慧と勇猛の心で巧みに使えば、あの蛇使いの蛇のように、かわいらしいものになる。

    女性が自分の心に潜む夜叉や阿修羅や摩喉羅伽と戦って征服し、乾闥婆や緊那羅や迦楼羅の美しい音楽を胸の内に聞こうとするには、ただ大慈大悲の心があるだけでは難しい。その慈悲をさらに発展させ、大いなる智慧と勇猛な心にし、自身が執金剛神となって、初めて実現するのである。だから『法華経』の普門品にも、「観世音菩薩は、ときには執金剛神の姿を現して法を説く」とある。'

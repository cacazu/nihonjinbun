  section: 正法に不思議なし／四、機類に應じて導く
  original: '四、機類に應じて導く


    かくの如く、大悟徹底した人は、喫茶喫飯、痾尿放尿、すべてが悟らない以前と變りがない。唯だ、六根に映じ來る六境に對して、露些かも執着しないところに價値がある。丁度、磨き澄ました明鏡裏に、佛來れば佛現じ、漢來れば漢現じ、胡來れば胡現じて、しかも其の蹤跡を留めないのと一般である。これが大悟底の人の大神通である。日本曹洞宗の開山、承陽大師の御詠みになつた道歌に、水鳥の行くも歸るも跡たえてされども道は忘れざりけりといふのがあるが、全く、此の御歌に道破されて居るやうに、何んの跡をも止めずスラ〳〵と滯りなく、活潑々地に天地宇宙の眞理大道を往來し得るのである。釋尊は、大小半圓五時八教、機に應じ緣に從つて人々を導かれた。また、各宗各派の祖師方も自力教であるとか、他力教であるとか、淨土門であるとか、聖道門で'
  translation: '四　人々の資質に応じて導く


    このように、悟りを徹底した人も、お茶を飲み、ご飯を食べ、排泄することなど、すべて悟る前と変わらない。ただ、目・耳・鼻・舌・身・心の六つの感覚に映る対象に、少しも執着しないところに価値がある。それはちょうど、磨き澄ました鏡が、仏が来れば仏を映し、中国の人が来ればその人を映し、西域の人が来ればその人を映しながら、何の跡も残さないのと同じである。これが、悟った人の大きな神通力である。

    日本曹洞宗の開祖、承陽大師の道歌に、

    「水鳥が行くときも帰るときも、水面に跡は残らない。それでも、その道を忘れはしない。」

    というものがある。この歌が言い尽くしているように、何の跡も留めず、すらすらと滞りなく、生き生きと、天地宇宙の真理である大道を行き来できるのである。

    釈尊は、大乗と小乗、不完全な教えと円満な教え、五時八教といったさまざまな教えを、相手の資質や縁に応じて説き、人々を導いた。各宗各派の祖師たちも、自力の教え、他力の教え、浄土門、聖道門で'
  notes:
  - 末尾はscan83へ続く。承陽大師は道元。
  - 「大小半圓五時八教」は教えの分類をまとめた表現として訳した。

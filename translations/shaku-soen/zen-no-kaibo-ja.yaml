  original: '業鏡高懸、三十七年、一槌擊碎、大道坦然、

    と云ふので、實に立派なものである。よほど、造詣の深い力が無くては、かくの如きことを言ふことは出來ぬと思ふ。時賴公は、たとひ、不幸、短命にして死なれても、その天下後世に遺した精神的感化は、太だ偉大なもので、今日、尙ほ、世道人心の上に、活き〳〵して居る。'
  translation: '「行いのすべてを映す業の鏡が、高く懸かって三十七年。


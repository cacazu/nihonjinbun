  section: 智情意の三修養／二 修養法の二大別
  original: 心は主であつて、身體は客といつても可からうと思ふ。併しながら、これは學問と宗旨との立場によつて異なるので、彼の唯心論者から言へば、心が何處までも主であつて、唯物論者から言へば、物が何處までも主である。けれども、主と客とは、地を變へれば同じものである。少年、少女の時代は、心とか何んとか、さう云ふ深いところに入らずとも、先づ身體の方から拵へて行つたら可からうと思ふ。身體で爲したことは、必ず、心に及ぼすもので、その影響するところは頗る著しいものである。制服でも着て、行儀正しく坐ると、心も亦た正しくなる。ところが、だらしなく橫臥でもして居ると、やはり、心も又た臥てをるやうになるのである。莞爾して居ると、心まで愉快になつてくるが、若し、額に青筋を立てゝ澁り切つて居ると、心までが毒々しくなるものである。それで、往時は、「敬」といふやうな字を以て、修養法の規矩として敎へてをつた人もあつた。
  translation: '心が主であり、身体は従だといってもよいと思う。

    しかし、これは学問や宗旨の立場によって違う。唯心論者にいわせれば、どこまでも心が主であり、唯物論者にいわせれば、どこまでも物が主である。けれども主と従は、立つ場所を変えれば同じものである。

    少年少女の時代には、心がどうだという深いところに入らなくても、まず身体のほうから整えていったらよいと思う。身体で行ったことは必ず心に及び、その影響はたいへん大きいものである。

    制服などを着て行儀よく座ると、心も正しくなる。ところが、だらしなく寝そべっていると、心もまた横になっているようになる。にこにこしていると心まで愉快になるが、額に青筋を立てて苦り切っていると、心までとげとげしくなる。

    それで昔は、「敬」という字を、修養の方法の手本として教えた人もいた。'

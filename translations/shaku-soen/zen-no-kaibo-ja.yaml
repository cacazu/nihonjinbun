  section: 菜根譚十則／七
  original: '七


    談山林樂者、未必眞得山林之趣、厭名利之談者、未必盡忘名利之情、（山林の樂みを談ずる者は、未だ必ずしも眞に山林の趣を得ず、名利の談を厭ふ者は、未だ必ずしも盡く名利の情を忘れず）山林の趣味を談ずる者は、談ずるところに風雅の臭みがある、未だ眞に山林の趣味を會得したものでない。名利の談話を厭ふものは、其の厭ふところに高尙を氣取る臭みがある。未だ眞に名利の情を忘れ盡くしたものでない。'
  translation: '七

    「山林の楽しみを語る人が、必ずしも本当に山林の趣を得ているとは限らない。名誉や利益の話を嫌う人が、必ずしも名誉や利益への思いをすべて忘れているとは限らない」

    山林の趣を語る人には、語るところに風雅を気取る臭みがある。まだ本当に山林の趣を会得してはいない。名誉や利益の話を嫌う人には、嫌うところに高尚さを気取る臭みがある。まだ本当に名利への執着を忘れ尽くしてはいないのである。'
  notes:
  - 漢文と同内容の訓読は原文に両方保持し、現代語訳は同一引用として一度だけ示した。後続の評釈は省略していない。
  sequence: 268

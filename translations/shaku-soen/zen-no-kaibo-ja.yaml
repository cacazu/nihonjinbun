  section: 不轉不動なれ／二 八風吹けども動ぜず
  original: '二、八風吹けども動ぜず


    然らば、此の境界は如何にして養ふかと云ふと、大死一番して動靜を超越せねばならぬ。動靜を超越した境界で、動靜に處するのである。一度び、此の境界を手に入れたならば、人生百般の事に處して、蹉跌なく、狼狽なく、自由自在の妙用を得て、大歡喜、大安心、大決定の境地に至ることは疑ひない。人は誰れしも、寂然不動の中心點を得てゐないと、事に接し、物に觸れて、其の正しきを得るといふことが六ケ敷い。直きに怒つたり泣いたり憎んだり猜んだりして、心の平和を保ち得ることが出來ぬ。精神錯亂とか、婦人によくあるヒステリーとか云ふものは、皆な、寂然不動の中心點を失ふに原因して起るものである。常に寂然不動の中心點を得てをつて失はぬのが、佛敎深甚の理趣とするところの謂ゆる'
  translation: '二　八風が吹いても動じない


    では、この境地をどう養うかといえば、自我への執着を徹底して捨て、動と静を超えなければならない。動と静を超えた境地から、動と静の中で生きるのである。一度この境地を手に入れれば、人生のあらゆることに対して、つまずかず、うろたえず、自由自在の見事な働きができ、大きな喜び、大きな安らぎ、揺るぎない確信の境地に至ることは疑いない。

    誰でも、静かで動じない心の中心を得ていないと、事に接し物に触れて、正しい対応をすることが難しい。すぐ怒ったり、泣いたり、憎んだり、ねたんだりして、心の平和を保つことができない。精神の錯乱や、婦人によくあるヒステリーなどは、どれも静かで動じない中心を失うことが原因で起こるのである。いつもその静かな中心を得て失わないことが、仏教の深い道理とされる、いわゆる'
  notes:
  - 「大死一番」は自我への執着を徹底して断つ禅の表現。精神症状や「婦人によくあるヒステリー」の原因説明は、原著の時代的な見解であり、現代の医学的説明ではない。
  - 末尾は次スキャンへ続く。

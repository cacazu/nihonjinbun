  section: 差別に處する難／三、亂臣賊子たる勿れ
  original: '三、亂臣賊子たる勿れ

    理の顯現は、秩序である。秩序の體は差別である。人間は、全く平等觀念が無いやうでは、其人や卑屈、度す可からざる者となり、憤發も、向上も、全く、遂げ得られぬ無氣力の形骸に終つてしまうが、さればとて差別の貴むべきを知らず、秩序を壞亂して悔ひず、徒らに「我見」に囚はれて進退するのみのものとなつて仕舞へば、その人は、必ずや、人倫に反く亂臣賊子となるに至るものだ。

    曾て、歐洲耶蘇國の君主間に行はれた帝王神權說の如きは、「我見」に囚はれて差別を顚倒し、平等を無視した結果であるが、社會の秩序も蔑如し、人倫を顧みず、履を頭に載いて、是れが、即ち、平等であるとする如き過つた思想も、亦た、是れ、帝王神權說と等しく、理に逆ふ「我見」たるに過ぎぬのである。

    されば、お經の中にも、

    「理に順つて心を起せば善となり、理に逆つて心を起せば惡となる。」

    とある。靑年は、須らく、入るに容易なる平等思想に囚はれて、差別觀を忘るゝ如き者とならず、更らに進んで、平等思想の上に築き上げられたる差別觀に入り、平等體念を雜れずして能く差別に處し、「無我の愛」に入りながら、而も、能く、「唯我獨尊」の見識を支持する人となるに至るを心懸くべきだ。

    我見と唯我獨尊との間には、猫と虎との差よりも、更らに大なる差がある。平等'
  translation: '三　秩序と道徳に背く者になってはならない


    道理が現れたものが秩序であり、秩序の実体は、個々の区別である。人間に平等という考えがまったくなければ、卑屈で救いがたい人間となり、奮起も向上もまったくできない、気力のない形ばかりの人間で終わってしまう。しかし、だからといって、違いや区別を尊重すべきことを知らず、秩序を壊しても悔いず、ただ自分勝手な考えだけで行動するなら、必ずや、人の道に背く反逆者となるに至る。


    かつてヨーロッパのキリスト教国の君主たちのあいだで行われた王権神授説は、自分本位の見方にとらわれて、あるべき区別を逆さまにし、平等を無視した結果である。しかし、社会の秩序を軽んじ、人の道を顧みず、履物を頭に載せて「これが平等だ」とするような誤った考えも、王権神授説と同じく、道理に逆らう自分勝手な見方にすぎない。


    だから、お経にも、

    「道理に従って心を起こせば善となり、道理に逆らって心を起こせば悪となる」

    とある。青年は、入りやすい平等思想にとらわれて、違いを認める見方を忘れるような人になってはならない。さらに進んで、平等思想の上に築かれた、違いを認める見方へ入るべきだ。平等の根本的な考えを失わず、よく違いのある世界に対応し、「無我の愛」に生きながら、なお、自分のかけがえのない尊厳を確かに持つ人になろうと心がけなければならない。


    自分勝手な思い込みと、自分の唯一の尊厳を知ることとのあいだには、猫と虎の違いよりも、さらに大きな違いがある。平等'
  notes:
  - 末尾は次コマへ続く。

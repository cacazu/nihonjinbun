  section: 禪と鎌倉武士／八 膽斗の如き相模太郞
  original: 'とある。而かも、他の一面には、佛天に向つて、敵國降伏を祈りて、且つ、能くも、油斷をせなかつたのである。

    又た、佛光錄の中に曰く、

    「主師平朝臣、深心學般若爲保億兆民、外魔四來侵、擧國生怖畏、朝臣發勇猛出血寫大經、金剛與圓覺及諸般若部、精誠所感處、滴血化滄海、滄海渺無際、皆是佛功德、重々香水海、照見浮幢刹、諸佛坐寶蓮、常說如是經、一句與一偈、一字與一畫、悉化爲神兵、猶如天帝釋與阿修羅戰、念此般若力、皆獲於勝捷、今此日本國、亦願佛加被、諸聖神武威彼魔悉降伏、生靈皆得安、皆佛神力故、世々學般若、報佛猛力、」

    此の偈を讀んで見ても、時宗公が、人知れず如何に國家の危急存亡を念として居られたかゞ窺はれるではないか。

    龜山天皇の御製と承つて居る御歌は、

    國民の誠こゝろを盡くしてし

    後こそ吹かめ伊勢の神風

    といふのであるが、この御製にて、當時、擧國一致の精神が如何に旺盛であつたかゞ分らう。

    これより先き、弘安四年の正月に、時宗公が國師の室に參禪に行かれた時、國師は、

    「莫煩惱」

    と言はれた。即ち惱むこと勿れと言ふのである。此のくらゐの事は、公は百も承知であるが、正月早々から斯く言はれたので、時宗公は變に思はれて、其意を問はれると、禪師は答へて曰く、

    「春夏の交、博多、騷擾せん。而かも一風わづかに起りて、萬艦、掃蕩せん。願はくば、慮とする勿れ。」'
  translation: 'とある。その一方では、仏や天に敵国の降伏を祈り、しかも決して油断しなかったのである。

    また『仏光録』には、こうある。

    「軍を率いる平朝臣は、心を深くして仏の智慧を学び、すべての民を守ろうとする。

    外の魔が四方から攻め寄せ、国中が恐れおののく。

    朝臣は勇猛の心を起こし、自らの血で大いなる経を書き写した。

    『金剛経』『円覚経』、そしてさまざまな般若経を。

    そのひたむきな誠が感応するところ、滴る血は大海となる。

    大海は広々として果てがなく、すべて仏の功徳である。

    幾重にも広がる香り高い水の海が、そこに浮かぶ宝幢の仏国土を照らし出す。

    諸仏は宝の蓮華に座し、常にこのような経を説く。

    その一句、一偈、一字、一画のすべてが、神の兵に変わる。

    天の帝釈が阿修羅と戦ったときのように、この般若の力を念じれば、みな勝利を得る。

    今、この日本国も仏の加護を願う。

    諸聖の神々しい武威によって、敵の魔をことごとく降伏させ、生きとし生けるものが安らぎを得る。

    すべて仏の不思議な力によるから、世々に般若を学び、仏の偉大な力に報いよう」

    この偈を読んでも、時宗公が人知れず、どれほど国の存亡にかかわる危機を心にかけていたかがわかるではないか。

    亀山天皇の御製と伺っている歌には、

    「国民が誠の心を尽くしてこそ、その後に伊勢の神風も吹くのであろう」

    とある。この歌から、当時、国を挙げて一致する精神がどれほど盛んだったかがわかるだろう。

    それより前、弘安四年の正月、時宗公が国師の部屋へ参禅に行くと、国師は「莫煩悩」、つまり「思い悩むな」といった。このくらいのことは時宗公も百も承知だったが、正月早々にそういわれたので不思議に思い、意味を尋ねた。禅師は答えた。

    「春から夏への変わり目に、博多は騒がしくなるだろう。しかし一陣の風が起これば、無数の軍艦は一掃される。どうか心配なさるな」'
  notes:
  - 『仏光録』の漢文は返り点を除いて転記し、各句を訳した。「香水海」「浮幢刹」は仏教的な宇宙像を表す語として訳している。
  - 冒頭は前コマから続く。

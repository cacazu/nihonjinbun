  section: 驢を渡し馬を渡す／七、一領の布衫重さ七斤
  original: '七、一領の布衫重さ七斤


    すべて、宗師家が學人を接得する際には、どんな事でも、言句に上さうと思ひば自由自在に言句になつて出るが、併し、その言句たるや、常識を超えた言句であるから、天下無比である。一僧が趙州和尙に向つて、「萬法、一に歸すと、一、何れのところにか歸す」宇宙の森羅萬象は、千差萬別であるが、畢竟、一味平等の本體界たる一に歸入すると云ふことであります。然らば、此の一味平等の本體界たる一は、また、何處へ歸入いたしますかと云ふ問ひである。すると、趙州は、「我れ靑州に在りて、一領の布衫を作る、重きこと七斤」ちよつと考へると途徹もないことを答へて居られる。これ佛見法見の論量を超越して居る答へであつて、意根を坐斷して直下に趙州の奥裡に參せなければ、此間の消息は窺ひ得られぬ。'
  translation: '七　一着の布の衣、その重さ七斤


    禅の師が修行者を導くときには、どんなことでも言葉にしようと思えば、自由自在に言葉となって出てくる。しかし、それは常識を超えた言葉なので、ほかに比べるものがない。一人の僧が趙州和尚に尋ねた。

    「すべてのものが一つに帰るといいますが、その一つは、どこへ帰るのですか。」

    宇宙の森羅万象にはさまざまな違いがあるが、結局は、区別のない平等な本体である「一」に帰るという。それなら、この平等な本体である「一」は、さらにどこへ帰るのか、という問いである。すると趙州は答えた。

    「私は青州にいたとき、一着の布の衣を作った。その重さは七斤だった。」

    少し考えただけでは、とんでもないことを答えたように見える。しかしこれは、仏や教えについての見解や理屈を超えた答えである。分別する思考の根を断ち、じかに趙州の深奥へ入らなければ、この間の真意をうかがうことはできない。'

  section: 獨園和尚の禪機
  original: '獨園和尚の禪機

    京都相國寺の獨園和尚は、やんわりとした中に、なか〳〵銳い禪機を藏してをられた和尚であつた。相國寺の門前には、耶蘇教の同志社があるが、その同志社の某が、僧俗男女の問法の徒が、常に、相國寺に絕えないのを見て、癪に障つて堪らない。何んとかして老僧の面目を潰さしめ、せめて我が同志の門前だけでも追つ拂つてやりたいものであると、或日、相見を願つて、公案を授かつて歸つた。其時、會つてみると、獨園〳〵と評判は大したものだが、一向、別に變つたところの無い老僧だ。これなら腕力に訴へても、屁古ますに雜作はないと、胸中に略ぼ策略を定めて、その翌日の入室に、見解を呈する振りをしながら、いきなり和尚の橫顏をウンといふほど打つた。和尚、屹度、怒るだらう、怒つたらと待ち構へて居ると、和尚は泰然として平氣なものである。'
  translation: '独園和尚の禅の機知

    京都・相国寺の独園和尚は、柔らかな物腰の中に、非常に鋭い禅の機知を秘めた人だった。相国寺の門前には、キリスト教の同志社がある。その同志社のある人物は、僧俗、男女を問わず教えを求める人が相国寺に絶えないのを見て、腹が立って仕方がなかった。なんとか老僧の面目を潰し、せめて自分たちの仲間の門前からだけでも追い払いたいものだと思い、ある日、面会を願い出て、公案を授かって帰った。

    会ってみると、独園、独園と評判こそ高いが、別に変わったところのない老僧だ。これなら腕力に訴えても、へこませるのはわけない、と心の中でおおよその策略を立てた。そして翌日の入室で、自分の悟った見解を示すふりをしながら、突然和尚の頬を、うんとうなるほど強く殴った。和尚はきっと怒るだろう、怒ったら、と待ち構えていたが、和尚は落ち着いて、平然としていた。'
  notes:
  - 「禪機」は禅の悟りから自在に現れる働き。ここでは、後段の著者の説明に合わせ「禅の機知」と訳した。
  sequence: 147
- id: zen-112-01

  section: 智情意の三修養／一 修養は漸以て進む
  original: '智情意の三修養


    一、修養は漸以て進む


    諺に「桃栗三年柿八年」といふことがあるが、これを嚼味すると、大いに意味がある。樹木を一本植ゑても、三年なり、八年なり、經過せなければ實を結ばぬ。高いところへ登るにしても必ず低きよりせねばならぬ。又た、深きに往くには淺きところから往かねばならぬ。かゝる事は誰れでも知つて居るが、偖て、その實行となると、どうも此の心懸けを忘れて、一足飛びに頂に達しようと焦慮る。彼の水の滴りは僅少であるけれども、遂ひに大器に滿つるといふやうな譯で、雨垂れが一滴づゝ落ちるのは、實にまどろかしいが、滴々として熄まざる時は、大なる器物にも充滿するのである。'
  translation: '知・情・意の三つの修養

    一　修養は少しずつ進む


    ことわざに「桃栗三年柿八年」というが、よく味わってみると、大いに意味がある。木を一本植えても、三年なり八年なりが過ぎなければ、実を結ばない。

    高いところに登るにも、必ず低いところから始めなければならない。また、深いところへ行くには浅いところから進まなければならない。こうしたことは誰でも知っているが、いざ実行するとなると、その心構えを忘れ、一足飛びに頂上へ達しようと焦る。

    水の滴はわずかでも、ついには大きな器を満たすというのと同じだ。雨垂れが一滴ずつ落ちるのは実にまどろっこしいが、滴り続けてやまなければ、大きな器にもいっぱいになるのである。'

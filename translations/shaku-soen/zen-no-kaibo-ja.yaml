  section: 驢を渡し馬を渡す／三、又た一點あり
  original: '三、又た一點あり


    また、或時、趙州和尙が、庭を掃いて居られると、一僧があつて、和尙に向ひ、「和尙は、是れ、善知識なり。什麼としてか塵ある。」と訊ねると、和尙は、「外來底」外から來たのだ。本來具有の塵はないぞと答へられると、又た問うて曰く、「清淨の伽藍、什麼としてか塵ある」和尙、曰く、「又た一點あり」又た一つ、飛んで來た、かう云つて答へられた。汝、一箇を添へ得たの意味である。'
  translation: '三　また一つ、塵がある


    またあるとき、趙州和尚が庭を掃いていると、一人の僧が尋ねた。

    「和尚は優れた悟りの指導者なのに、どうして塵があるのですか。」

    和尚は、「外から来たものだ」と答えた。外から来たのであって、もともと備わっている塵はない、というのである。僧がまた、「清らかな寺なのに、どうして塵があるのですか」と問うと、和尚は、「また一つある」と答えた。「ほら、また一つ飛んできた。お前が一つ加えたのだ」という意味である。'

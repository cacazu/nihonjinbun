  section: 大道周行
  original: とある。されば、斯の道を得た人が、釋迦であり、孔子であり、耶蘇であり、マホメツト等であつて、其の得たところに多少の深淺優劣の別はあるかも知れぬが、大體に於て、其道を得て、初めて釋迦たり、始めて孔子たり得るのである。此の道は釋迦獨り專らにして居るのでも無く、孔子獨り之れを恣にしてをる譯のものでは無い。つまり、斯の道あるが爲めに、天地は、玆に、成立つてをる。斯道あるが爲めに、我れ〳〵は生活の眞意義といふものを此處に現はして居るのである。
  translation: と述べられている。したがって、この道を得た人こそが、釈迦であり、孔子であり、イエスであり、ムハンマドなどである。その体得の深さや優劣には多少の違いがあるかもしれないが、大きくいえば、この道を得てこそ釈迦となり、孔子となれたのである。この道は釈迦だけが独占しているのでも、孔子だけのものでもない。つまり、この道があるからこそ天地が成り立っている。この道があるからこそ、私たちは生きることの真の意味を、ここに実現しているのである。
  notes:

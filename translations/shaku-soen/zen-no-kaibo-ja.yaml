  section: 正法に不思議なし／一、晴れた日は晴れ
  original: '一、晴れた日は晴れ


    昔から、「正法に不思議なし」といつて居る。佛法には決して不思議といふものは無い。然るに、世間には、悟つた人には、何か不思議な事柄、奇特な行ひでもあるかの如くに考へて居る者もあるやうであるが、いくら悟つたからと云つて、奇術師以上の藝當を演じ得るといふ譯ではない。曇つた日は、やはり、曇つて居る。晴れた日は、やはり、晴れて居る。女は女、男は男、大人は大人、小供は小供である。佛說には、決して、世人を驚かすやうな妙智奇な事柄は說いてない。山を隔てゝ烟を見て早く是れ火なるを知り、牆を隔てゝ角を見て便ち是れ牛なるを知る底の俊發英利の漢は、平凡では無いに違ひないかも知れぬが、これとて我が'
  translation: '一　晴れた日は晴れ


    昔から「正しい仏法に不思議はない」と言われている。仏法には、決して不思議というものはない。ところが世間には、悟った人には、何か不思議なことや、並外れた行いがあるかのように考える人もいる。しかし、いくら悟ったからといって、奇術師以上の芸当ができるわけではない。曇った日はやはり曇り、晴れた日はやはり晴れている。女性は女性、男性は男性、大人は大人、子供は子供である。仏の教えには、人々を驚かせるような奇妙な事柄は説かれていない。

    山の向こうに煙を見て、すぐに火だと知り、塀の向こうに角を見て、すぐに牛だと知るような、鋭く機敏な人は、確かに非凡かもしれない。しかし、それさえ私たちの'

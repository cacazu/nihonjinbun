  section: 信の一字／一、寂寥たる精神界
  original: 信の一字一、寂寥たる精神界老衲は、玆に、信の一字について御話したいと思ふ。老衲が曾て足を海外に踏み出して行脚した際、先づ注目せられたものは、學校と寺院とであつた。大都市は勿論小かなる町村に於てすらも、巍峨たるものは寺院の殿堂、立派なるものは學校々舎であつた。而して、足をば家庭內に運ぶと、多數の家庭には、何れも、一の樂器と一卷の聖書とが備へられてゐた。是に於てか、一つの感想が起つた。即ち、彼國では、政治、教育の外に、宗教の氣分が漂うてゐると云ふことである。彼國の人は、政治家も、教育家も、實業家も、勞働者も、皆な何れも多少に拘らず宗教的興味を有つてゐる。
  translation: '一　寂しい精神の世界


    ここで私は、「信」の一字についてお話ししたい。以前、海外へ修行の旅に出たとき、まず目に留まったのは、学校と教会だった。大都市はもちろん、小さな町や村でさえ、高くそびえているのは教会の建物であり、立派なのは学校の校舎だった。そして家庭へ足を運ぶと、多くの家に、楽器と一冊の聖書が備えられていた。そのとき、こう感じた。あちらの国では、政治や教育のほかに、宗教的な気分が社会に漂っているのだ、と。政治家も教育者も、実業家も労働者も、程度の差こそあれ、みな宗教への関心を持っている。'

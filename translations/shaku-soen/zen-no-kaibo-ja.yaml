  section: 誰か言ふ弱き者と／四 慈悲心は其儘勇氣也
  original: '女人は、一般世間から、慈悲同情の心に富んでをるが、勇氣には缺けてをるとされてをる。勇氣の乏しい爲めに、事に當つて迷ひ、左往右往、周章狼敗して、他人の足手まとひになるのは女人の常である。が、これは、勇氣の原動力たる慈悲同情の心が小さくして、觀音菩薩のやうに大慈大悲の心になり得ず、小慈悲、小同情に滿足してをる傾向が女人には多いからのことである。

    女人と雖も、衷心から、大慈大悲の觀音菩薩に歸命頂禮供養し、常に心中に觀音菩薩の名號を持し得るまでになり、全く、自己を沒して他に同情同化し得るやうになれば、必らず大勇氣を生じて、凡々たる男子の遠く及ばぬ果斷決行の人となり得るであらう。'
  translation: '女性は一般に、慈悲や同情に富む一方、勇気には欠けるとされている。勇気が乏しいため、いざというときに迷って右往左往し、慌てふためいて人の足手まといになるのが、女性の常だという。しかしこれは、勇気の原動力である慈悲や同情が小さく、観音菩薩のような大慈大悲になれず、小さな慈悲や同情で満足する傾向が、女性に多いからである。

    女性であっても、心の底から大慈大悲の観音菩薩に帰依し、頭を下げて礼拝し、供養し、いつもその名を心に保てるまでになればよい。そして自分をまったく忘れ、他人に共感して一体になれるようになれば、必ず大きな勇気が生まれ、平凡な男性など遠く及ばない、きっぱりと決断し実行できる人となるだろう。'
  notes:
  - 女性についての一般化は著者自身の歴史的な見解であり、訳者の評価ではない。

- id: zen-172-02
  scan: 172
  section: 自性の徹見／一、野にも山にも一杯
  original: '一、野にも山にも一杯


    我が禪門に入つて修行せんとする者は、何は措いても、先づ、第一に、見性に努めなければならぬ。ところで、此の「性を見る」の性とは、何かといふと、人間の本性本體であつて、古今東西にわたつて不變不改のものである。野にも、山にも、畑にも、川にも、溪にも一杯である。宇宙間、處として此れの無いところはない。然るに、此れがなか〳〵見つからぬ。さあ何うして此れを見つけるか。箸を持つやうに、茶碗を持つやうに、どうして此れを捉へ得るか。「撥草參玄は、唯だ見性を圖る。即今、上人の性、何くに在りや。自性を識得すれば、方に生死を脫す。眼光落地の時、什麼生か脫せん。生死を脫得すれば'
  translation: '一　野にも山にも満ちている

    私たちの禅門に入って修行しようとする者は、何を置いても、まず見性に努めなければならない。「性を見る」というときの「性」とは、人間の本性、本体であり、昔も今も、東でも西でも変わらないものである。野にも山にも畑にも、川にも谷にも満ちている。宇宙のどこにも、これのない場所はない。

    ところが、これがなかなか見つからない。さあ、どうやって見つけるのか。箸を持つように、茶碗を持つように、どうすればこれをつかめるのか。

    「草を分けて奥深い道を訪ねるのは、ただ自己の本性を見極めるためだ。今このとき、あなたの本性はどこにあるのか。自分の本性を知れば、初めて生死を超えられる。しかし、目の光が消えて死ぬとき、どのように超えるのか。生死を超えることができれば'
  notes:
  - 「兜率の三関」の引用はscan173へ続く。「見性」は自己の本性を直接見極めること。
  sequence: 250
- id: zen-173-01
  scan: 173
  section: 自性の徹見／一、野にも山にも一杯
  original: 去處を知る。四大分離して何んの處に向つてか去る」これは、兜率の三關といつて有名な公案であるが、即今、上人の性を何うして發見するか。君は深野のきり〳〵す聲はすれども姿は見えぬで、此の上人の性は容易に捉へ得られない。自分の眼玉でもつて自分の眼玉を見ることが出來るやうにならなければ能はぬところである。若し、此の、橫に十方に亘り、竪に三世を極むる「性」を探し當てたならば、何人でも、此處に坐してをつて、沖行く白帆を止め、十萬億土の佛を持ち來り、太平洋の水を一口に飲み盡くし得る自由自在の活作用が得られる。
  translation: '行く先が分かる。身体を成す四つの要素が離れ散るとき、どこへ向かって行くのか」

    これは「兜率の三関」という有名な公案である。さあ、今このときの自分の本性を、どうやって発見するのか。

    「あなたは深い野原のキリギリス。声はするけれど、姿は見えない」

    というように、この自分の本性は容易につかめない。自分の眼で、自分の眼を見ることができるほどでなければならないのである。

    もし、横にはあらゆる方角に広がり、縦には過去・現在・未来を貫く、この「性」を探し当てれば、誰でも、ここに座ったまま沖を行く白帆を止め、十万億の仏国土の彼方の仏をここへ連れてきて、太平洋の水を一口で飲み尽くすような、自由自在の生きた働きを得られる。'
  notes:
  - 冒頭はscan172から続く。「四大」は身体を構成するとされる地・水・火・風。白帆を止める等の表現は禅的境地を示す比喩として原文を保った。
  sequence: 251
- id: zen-173-02
  scan: 173
  section: 自性の徹見／二、眼前口頭其儘が禪
  original: '二、眼前口頭其儘が禪


    凡そ、佛敎の粹はと云へば、禪であつて、禪なきは佛敎でないと云つてもよい。禪は有らゆゆる佛敎を通じて存在して居る。彼の日蓮宗の、「南無妙法蓮華經」の題目や、淨土眞宗の、「南無阿彌陀佛」の念佛や、皆な、之れ、禪三昧にほかならぬ。否や、佛敎ばかりでは無い。吾人が日常生活の上に、禪の存在せざるところ無しぢや。魚屋の擔ぎ廻る盤臺の上にも、豆腐屋の鳴らす喇叭の音にも、八百屋、米屋の店頭にも存在してをる。古歌にも、佛法は障子の引手峰の松火打袋に鶯の聲とある通り、カチリ打つ燧石にも、ガラリ開ける障子の引手にも、鶯の聲にも、峰の松、川の柳にも、禪は存在してをる。'
  translation: '二　目の前の物事、口から出る言葉、そのままが禅

    仏教の精髄は何かといえば禅であり、禅がなければ仏教ではないといってもよい。禅はあらゆる仏教に通じて存在している。日蓮宗の「南無妙法蓮華経」という題目も、浄土真宗の「南無阿弥陀仏」という念仏も、すべて禅の三昧、すなわち深く一つに打ち込む境地にほかならない。

    いや、仏教だけではない。私たちの日常生活にも、禅のないところはない。魚屋が担いで売り歩く盤台の上にも、豆腐屋のラッパの音にも、八百屋や米屋の店先にもある。古い歌に、

    「仏法は、障子の引き手、峰の松。火打ち袋に、ウグイスの声」

    とあるとおり、かちりと打つ火打ち石にも、がらりと開ける障子の引き手にも、ウグイスの声にも、峰の松や川の柳にも、禅はあるのである。'
  notes: []
  sequence: 252

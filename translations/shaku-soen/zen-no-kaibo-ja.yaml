  section: 禪と鎌倉武士／八 膽斗の如き相模太郞
  original: つたから、大いに內に恃むところがあつて、物資兵站すべて不十分、不完全なるにもかゝはらず、かくの如き大敵に當つて、痛快なる戰捷を得たといふことは、長く我れ〳〵が、後世、子孫に傳へて忘る可からざる美談である。此の意味に於て、時宗公は、僅か三十四歲で亡なつても、其の愛國護法の大精神は、今に至るまで、六千萬國民の頭腦中に活躍して居ると思ふ。
  translation: いた。そのため内に強いよりどころがあり、物資も補給も何もかも不十分で不完全だったにもかかわらず、あのような大敵に立ち向かい、胸のすく勝利を得たのである。これは私たちが長く子孫へ伝え、忘れてはならない美談である。この意味で、時宗公はわずか三十四歳で亡くなっても、国を愛し仏法を守る大精神は、今も六千万の国民の心の中に生きていると思う。

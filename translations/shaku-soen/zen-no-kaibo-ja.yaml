  section: 宗敎的善行／四、阿賭物の爲にせず
  original: て描く。其の態度の卑劣なる言語同斷で、時人に指彈されつゝ平然として意に介しない。而して、指彈する者も、亦た、月僊の畫は認めて居つた。或時、某處の遊女の賴みを受けて、衣の裏に畫を描いた。若し、氣骨のある畫家ならば、無論、描く筈は無いのであるが、月僊は、一向、頓着しない、立派に描き上げた畫を、自身、遊女が許に持參して謝金を請求した。遊女は、心あつて仕たことか知らぬが、金を足に載せて月僊の前に差し出した。月僊は難有しとばかり、その金を受け取つて歸つた。かくの如く、月僊は、耻も外聞もない有樣であつたが、その死後、月僊は、集めた金を、悉く、散じて、鰥寡孤獨を賑恤し、一厘も貯蓄しなかつたことが分り、人々、皆な、奇異の感に打たれたといふことである。思ふに、月僊の爲人を卑しみつゝ、尙ほ、賴畫者の多かつたのは、畫の出來が好かつた爲めで、良畫の出來たのは、月僊が報酬の爲めに描かなかつた爲めである。成程、畫代を受取つたには相違ないが、それは慈善の爲めに取次ぎをしたに過ぎない。是れを要するに、陰德、即ち、報酬の爲めにせざる善き行ひは、大乘敎の敎義に合つたもので、我が禪宗でも、大いに之れを奬勵して居る。而も、近來、淸廉の風、地を拂つて、報酬なきに善き行ひをする者が、少い。譬へば、彼の勞働も自己の務めとして忠實に之れに從事する時は、勞働は神聖なりとも云へやう。さり乍ら、その勞働の對價として、即ち、勞働の結果として、報酬を受けるにあらずして、單に報酬を得んが爲めにする勞働は神聖でも何んでも無い。英國の敵は英國の富そのものであると喝破した者もあるくらゐで、富は必ずしも其身其家を幸福にするものでは無い。由て、人は、陰德を、冥々裡に施し、獨自一個の故にあらずして、社會的に存ふるに越したことは無いのである。
  translation: '描いた。その態度は言語道断なほど卑しいと、世間から非難されながら、平然として気にも留めなかった。しかし非難する人々も、月僊の絵の腕は認めていた。

    あるとき、ある所の遊女に頼まれて、着物の裏に絵を描いた。気骨のある画家なら、もちろん引き受けないはずだが、月僊はまったく気にしない。立派に描き上げた絵を自分で遊女のところへ持っていき、謝礼を請求した。遊女は何か意図があったのか、金を足に載せて月僊の前へ差し出した。月僊はありがたいとばかり、その金を受け取って帰った。このように恥も外聞もない様子だったが、亡くなったあと、集めた金をすべて配って、配偶者や親、子のない孤独な人々を救い、一厘も蓄えていなかったことが分かり、人々はみな驚いたという。

    月僊の人柄を卑しみながらも絵を頼む人が多かったのは、絵の出来がよかったからだろう。そしてよい絵が描けたのは、報酬のために描いていなかったからである。確かに画料は受け取っていたが、それは慈善のために取り次いでいたにすぎない。

    要するに、陰徳、つまり報酬を目当てにしない善行は、大乗仏教の教義に合い、私たちの禅宗でも大いに奨励している。ところが近ごろは清廉な気風がすっかり失われ、報酬なしに善いことをする人が少ない。たとえば労働も、自分の務めとして忠実に取り組むなら、神聖だといえるだろう。しかし、労働への対価、すなわち働いた結果として報酬を受けるのではなく、ただ報酬を得るためだけにする労働は、神聖でも何でもない。「イギリスの敵は、イギリスの富そのものだ」と言い切った人さえいる。富は必ずしも、その人や家を幸福にするものではない。だから人は、目立たないところで陰徳を施し、自分一人のためではなく、社会とともに生きるのが何よりよいのである。'
  notes:
  - 冒頭はscan158から続く。「鰥寡孤獨」は身寄りを欠く人々を表す語。労働の価値についての判断は著者自身の見解。

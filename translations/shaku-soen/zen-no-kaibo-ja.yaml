  section: 差別に處する難／一、萬物もと是れ平等
  original: '理を解する力があると思はれる有爲の靑年が過られてしまつて、ノラクラした遊民に變じ、氣位ばかり高くつて、一向、その實の擧がらぬ危險人物となるのは、槪ね其の時期に於てゞある。

    釋尊が四十九年、三百餘會の說法を始めらるゝ最初に當つて唱道せられたところも、やはり、この平等思想で、四河海に歸すれば同一鹹味となり、四姓佛に歸すれば同一釋氏と名づくと云ふにあつたのである。

    天地宇宙は、一金萬器である。同じ一つの金が種々雜多の器物に其形を千變萬化して居るのだ。少しく思索の步を進め、尋ね究めて其の本にいたれば、必ずや、平等となる。有らゆる物質の原基が、皆な、一の電子に歸してしまうのと同じである。

    併し、平等觀念は、元と原始的の思想で、かゝる觀念に逢著するには、必ずしも骨の折れるものでは無い。孰方かと謂へば、平等思想は、元來が破壞思想であるから、これに達するには、比較的容易である。敢て、智者、天才を要するまでもなく、凡才の猶ほ之れを能くし得るところである。'
  translation: '理を理解できるはずの、有望な青年が惑わされ、ぶらぶらした怠け者になり、自尊心ばかり高くて、いっこうに実績を上げない危険人物となってしまうのは、たいてい、この時期である。


    釈尊が、四十九年にわたる三百回余りの説法を始められた、その最初に唱えたのも、この平等の思想だった。「四つの川も海に入れば同じ塩味となり、四つの身分の人々も仏に帰依すれば、みな同じく釈迦の一族と呼ばれる」というのである。


    天地宇宙は、一つの金属から無数の器を作ったようなものだ。同じ一つの金属が、その形を変えて、さまざまな器になっている。少し思索を進め、尋ね究めて根本へ至れば、必ず平等に行き着く。あらゆる物質の根源が、みな一つの電子に帰してしまうのと同じである。


    しかし、平等という考えは、もともと初歩的な思想で、そこへ行き着くのは、必ずしも骨の折れることではない。どちらかといえば、平等思想は、もともと既存のものを壊す思想だから、到達するのは比較的容易だ。あえて賢者や天才である必要もなく、平凡な人でも十分にできるのである。'
  notes:
  - 冒頭は前コマからの続き。

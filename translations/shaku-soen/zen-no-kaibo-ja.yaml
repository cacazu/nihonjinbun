  section: 智情意の三修養／一 修養は漸以て進む
  original: 恰も、それと同じ意味で、塵積つて山と爲ると云ふこともある。我れ〳〵が苟も修養しようといふ心懸けを起した以上、今ま述べたやうな心でかゝらねばならぬ。偖て、修養といふことは、此頃、何處へ往つても、心ある人は、これを口にしてゐる。すでに口にしてゐるのは、其の必要を感じたからで、言はゞ、人々、各自が自覺して來たのである。何うしても、人間は、技倆があるばかりでは不可ぬ。仕事が出來るといふばかりでは不可ぬ。少くとも人格といふやうやうなものを鍛へ上げねば不可ぬ。品性といふものを高めねば不可ぬ、そこで、此の修養である。修養とは、文字の如く、修め養ふといふことであるが、それは、一朝一夕に出來得るものでは無い。近頃、何かに就けて、長足の進歩といふことを言ふが、成程、一跨ぎに進むのは、壯快なる心地がする。けれども、修養に至つては、なか〳〵一足飛びには往かぬ。漸以て進んで行くのである。即ち、「桃栗三年柿八年」である。
  translation: 'ちょうど同じ意味で、「塵も積もれば山となる」ともいう。私たちがいやしくも修養しようという心を起こした以上、今述べたような気持ちで取り組まなければならない。

    さて近ごろは、どこへ行っても、心ある人は修養を口にする。すでに口にするというのは、その必要を感じたからであり、いわば一人一人が自覚してきたのである。

    どうしても人間は、技量があるだけではいけない。仕事ができるだけではいけない。少なくとも人格というものを鍛え上げ、品性を高めなければいけない。そこで修養が必要になる。

    修養とは、文字どおり修め養うことだが、それは一朝一夕にできるものではない。近ごろは何かにつけて長足の進歩という。なるほど、一またぎに進むのは爽快な気持ちがする。しかし修養は、なかなか一足飛びには進まない。少しずつ進んでいくのである。つまり「桃栗三年柿八年」なのだ。'

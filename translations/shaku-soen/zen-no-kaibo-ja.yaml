  section: 隱德を積め／六 丹霞、木佛を燒く
  original: まつた。ところが、寺の主事が、これを見て吃驚りし、「貴僧は飛んでも無いことをなさる。今に佛罰が當りますぞ」と云ふと、和尙は平然として、「衲は、佛を燒いて舍利を得ようと思つて居るのぢや。」と言はれた。主事は、「木佛に何んの舍利がありませうぞ。」と咎めたが、斯く咎めた主事に却つて罰が當つたと云ふことである。丹霞和尙の此の言行は、その物體以外に、立派な佛のあると云ふことを知らしめようといふ意味であつたのである。禪宗には「一休物語」などゝ云つて、奇言奇行を書いたものが有るが、普通の人が、それを眞似たならば大變である。何事も眞似は惡い。殊に、佛敎のお悟りなどの眞似は惡い。談話が、いろ〳〵雜多にわたつたが、扨て、我れ〳〵が尊崇してをるところの三千の諸佛方、或ひは、歷代の祖師方がなぜ、一切衆生を濟度せなければ、自分は正覺を取らぬといふ志を有つて、世の中に働かれたのか。なぜ、その功績が割合に世に現はれないかと云ふと、その爲された仕事が、すべて「緣の下の力持ち」、「貴き家屋の礎」であるからである。
  translation: 'まった。それを寺の主事が見てびっくりし、

    「あなたは、とんでもないことをなさる。そのうち仏罰が当たりますぞ」

    というと、和尚は平然として、

    「私は仏を焼いて、仏の遺骨である舎利を得ようと思っているのだ」

    といった。主事は、

    「木の仏像に、どうして舎利がありましょう」

    ととがめたが、こうしてとがめた主事のほうに、かえって罰が当たったという。

    丹霞和尚のこの言動は、その物体とは別に、立派な仏があるということを知らせようとしたのである。禅宗には『一休物語』などといって、奇妙な言葉や行動を書いたものがあるが、普通の人がそれをまねたら大変である。何事もまねはよくない。とりわけ、仏教の悟りなどをまねるのはよくない。

    話がいろいろな事柄に及んだが、さて、私たちが尊崇する三千の仏たちや歴代の祖師たちは、なぜ、すべての生きものを救わなければ自分は悟りを得ない、という志を持って世の中で働いたのか。なぜ、その功績がそれほど世に現れないのか。それは、なさった仕事がすべて「縁の下の力持ち」であり、「尊い家の礎」だからである。'

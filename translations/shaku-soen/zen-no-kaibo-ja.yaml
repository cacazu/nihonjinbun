  section: 不轉不動なれ／三 無碍自在妙の手段を
  original: 世音菩薩の如きも、外道、天部、人非人の其等に動ぜられざる寂然不動のところから發して、三十三身を現じ、人を利濟する活動が出來たのである。これを劔道の如き技術に應用しても、そこに妙を極むることが出來る。劔道に於ても心を止めぬといふことが大切で、心を止めるといふことは禁物である。自身の何處にも心を止めぬと共に、敵の何處にも心を止めぬ。一切のものに心を動かさずして寂然不動であれば、變化に應じて自在の働きが出來る。左を拂はねばならぬ時は左を拂ひ、右を擊たねばならぬ時は右を擊ち、無碍自在の妙手段を用ひることが出來るのである。
  translation: '世音菩薩も、仏教以外の教えを信じる者、天の神々、人間や人間でないものに動かされない、静かで揺るがないところから出発し、三十三の姿を現して人々を救う活動ができたのである。

    これを剣道のような技術に応用しても、そこで妙技を極めることができる。剣道でも、心を一か所に止めないことが大切であり、心を止めることは禁物である。自分のどこにも心を止めないとともに、相手のどこにも心を止めない。何ものにも心を揺さぶられず、静かで動じなければ、変化に応じて自在に働くことができる。左を払わなければならないときは左を払い、右を打たなければならないときは右を打ち、とらわれのない自在な妙技を使うことができるのである。'

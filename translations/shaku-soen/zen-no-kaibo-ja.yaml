  section: 圓朝の新桃太郞
  original: '圓朝の新桃太郞


    三遊亭圓朝といへば、誰れでも知つてをる通り、明治年間の講釋師の名人であつて、役者の市川團十郞と共に、日本一と併稱されたものである。講釋師と云へば一藝人に過ぎないが、併し、藝人とは云つても、今日の何々株式會社長とか、何々銀行頭取とか云はれる人たちが、到底、及びもつかぬ人格の高い立派な士君子であつた。山岡鐵舟の居士の提撕を受けて養ふところ尋常でなかつたが故である。初め、圓朝が、山岡鐵舟居士を訪問した時に、居士は、突然、圓朝に向つて、「お前は講釋師として名人の聞えが高いが、今ま此處で一席話して吳れまいか」と所望されたので、圓朝は、「何を御講釋いたしませう」と訊くと、居士は、'
  translation: '円朝の新桃太郎


    三遊亭円朝といえば、誰もが知っているとおり、明治時代の講釈の名人であり、役者の市川団十郎とともに、日本一と並び称された人である。講釈師といえば一介の芸人にすぎない。しかし芸人とはいっても、今日の何々株式会社の社長や何々銀行の頭取などと呼ばれる人々が、到底及びもつかない、人格の高い立派な人物だった。山岡鉄舟居士の指導を受け、並々ならぬ修養を積んでいたからである。

    初めて円朝が山岡鉄舟居士を訪ねたとき、居士は突然、円朝に、

    「お前は講釈師として名人の評判が高いが、今ここで一席話してくれないか」

    と頼んだ。そこで円朝が、

    「何をお話しいたしましょう」

    と尋ねると、居士は、'

  section: 生まれぬ先きの面魂
  original: 料になる。こゝに至るのが眞の修養である。禪の妙處である。一般世間の人は、五慾七情のほかに心なく、而かも、此の五慾七情は、別々の存在であると考へてゐるが、元來、これは心の影で、忽ち現じ忽ち滅する。今ま、彼奴は憎い奴だとブリ〳〵してゐる所へ、可愛いものでも突然やつて來れば、忽ちにニコ〳〵して、先きの怒は何處かへ無くなつてしまふ。五慾七情は小兒の喧嘩の如く、誠にたわいないものである。故に、我れ〳〵は、心の本體を徹見して、迷ひの煩惱を轉じて、直ちに悟りの菩提となすの心掛けを暫らくも忘れてはならぬ。
  translation: '肥料になる。この境地に至るのが真の修養であり、禅のすぐれたところである。

    世間の人は、五欲七情という欲望や感情のほかに心はなく、しかも、それぞれが別々に存在するものだと考えている。しかし、もともとそれらは心の影であり、たちまち現れ、たちまち消える。今「あいつは憎い」と怒っていても、かわいいものが突然やって来れば、すぐに笑顔になり、先ほどの怒りはどこかへ消えてしまう。五欲七情は子供のけんかのように、実にたわいのないものである。

    だから私たちは、心の本体を徹底して見抜き、迷いの煩悩をそのまま悟りの智慧へと転じようとする心がけを、少しの間も忘れてはならない。'
  notes:
  - 冒頭はscan57末の「肥料」の後半。

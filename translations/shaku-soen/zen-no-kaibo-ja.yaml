  section: 人生は大夢なり／二、洒々落々たれ
  original: 二、洒々落々たれ扨て、世間の人のいふ謂ゆる夢とは、人々が寢て居る間に起る頭腦の作用を稱するに外ならぬが、併し、此の世の現實が總て夢である。朝、臥床を出で、晩、臥床に入るまで、怒り、泣き、笑ひ、苦しんだり、悲しんだり、樂しんだりする、是等が悉く夢である。ところで、吾人は、此の苦しい悲しい辛い現實の夢に際會しても、決して、悲觀的であつてはならぬ。失望的、引つ込み思案的では不可ない。大いに樂觀的、積極的、進取的に、樂しく愉快に活動しなければならぬ。それが出來ないのは、物に執着するからである。物に執着するが故に、物に囚はれて自由の分を失ふのである。その時々に應じて、一點の囚はれる所なく、洒々落々として、恰も、天馬の空を往くが如き境界、これが即ち、大乘佛教の悟りの境界である。道元禪師の御歌と覺えて居るが、
  translation: '二　何にもとらわれず、さっぱりとしていなさい


    さて、世間でいう夢とは、眠っているあいだに起こる頭脳の働きにすぎない。しかし、この世の現実は、すべて夢なのだ。朝、寝床を出てから、夜、寝床に入るまで、怒り、泣き、笑い、苦しみ、悲しみ、楽しむ。そのすべてが夢である。


    だからといって、この苦しく、悲しく、つらい現実の夢に出会っても、決して悲観してはならない。失望したり、引っ込み思案になったりしてはいけない。大いに楽観的、積極的、進取的に、楽しく愉快に活動しなければならない。それができないのは、物事に執着するからだ。執着するからこそ、物事に縛られ、自由を失ってしまうのである。


    そのつどの状況に応じ、少しもとらわれず、さっぱりと伸びやかに、あたかも天馬が空を行くような境地。それが、大乗仏教の悟りの境地なのである。


    道元禅師の歌だったと記憶しているが、'

  section: 無邊の風月／三、心を中心としての問題
  original: 三、心を中心としての問題これも一つ思ひ浮んだから云ふて見よう。有名な山岡鐵舟の門下で、當時、名聲を上げた落語家三遊亭圓朝が、常に、十八番として演じた話がある。見やうに依つては實に面白い。落語的に云へば、一層に興味もあらうけれども、衲には、ちよつと、その眞似が出來ない。題は「心の眼」と云ふて、なか〳〵面白く仕組んである。玆に夫婦者があつて、亭主の方は未だ結婚せぬ先きから目が見えない。本來から云へば、今度、貰つた女房の顏が、どんなのか分らないのだけれども、そこが妙なもんで、亭主自身には非常に別嬪に見えた。見えたといふのが「心の眼」なんで、肉眼は、兩方とも、まるで駄目なんだ。しかし、まあ、明け暮れ一緒に暮らしてゐる女房が、如何にも美しい女で、その容姿といひ、頭の具合ひといひ、殆んど眼で見るやうな心地で自ら愛してゐた。一方、女房は、丁度、「壺阪」のお里みたやうに、盲目の亭主を大事にして、方々の醫者の手にかけたり、又た、神や佛に祈願をこめ、遂ひに、その加護によつて、うれしや兩眼とも開いた。元の眼になつた。一時は二人して喜んだものゝ、一旦、眼が開いて見れば、今まで別嬪と思つた自分の女房は不別嬪······不の字がおかしいな······鼻は曲つて、おまけに低い。口は大きく、色は黑い。頭の髪は亂れて居るといふ有樣である。亭主は、眼が開いたばかりに、此の女房が忽ち嫌やになつた。そして、遂ひに、離緣沙汰となつた。これを落語家に云はせると、面白いんだが、まア話の筋は斯ういふ風である。···話すうちにヒヨイ〳〵胸に浮ぶんだが、これは橫濱の或る處で、祝壽の式があつて、その餘興に、延壽太夫の淸元があつた。恰も、「夕霧伊左衛門」をやつたが、其
  translation: '三　心を中心とする問題


    これも一つ思い浮かんだので、話してみよう。有名な山岡鉄舟の門下にあって、当時名声を上げた落語家、三遊亭円朝が、いつも得意に演じていた噺がある。見方によっては実に面白い。落語として話せば、もっと興味深いだろうが、私にはちょっと、その真似はできない。題は「心の眼」といって、なかなか面白く仕組んである。


    ある夫婦がいて、亭主は結婚する前から目が見えない。本当のところ、新しく迎えた女房がどんな顔なのか、わからないはずなのだが、そこが不思議なもので、亭主にはたいへんな美人に見えた。「見えた」というのが心の目で、肉眼は両方とも、まったく見えない。それでも、朝晩いっしょに暮らす女房が、いかにも美しい女性で、姿かたちも髪の様子も、ほとんど目で見るような気持ちで、自然に愛していた。


    一方、女房は、ちょうど『壺阪』のお里のように、目の見えない亭主を大切にし、あちこちの医者に診せたり、神仏に祈願したりした。そしてとうとう、その加護によって、うれしいことに両目が開き、以前のように見えるようになった。一時は二人で喜んだものの、いざ目が開いてみると、今まで美人だと思っていた自分の女房は、不美人だった――「不」の字がつくのはおかしいがね。鼻は曲がったうえに低く、口は大きく、色は黒い。髪は乱れている。亭主は、目が開いたばかりに、たちまち女房が嫌になり、ついには離縁話になってしまった。


    これを落語家に話させると面白いのだが、まあ、筋はこんなふうである。


    話しているうちに、ふっと次々思い浮かぶのだが、横浜のある場所で長寿を祝う会があり、その余興に、延寿太夫の清元があった。ちょうど「夕霧伊左衛門」を演じたが、その'

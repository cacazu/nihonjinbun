  section: 宗敎的善行／四、阿賭物の爲にせず
  original: '四、阿賭物の爲にせず


    馬琴や、セキスピアの著作や、ラフヱラーの作品を見ても、名人巨匠の心がけは凡人の企及し難い點がある。馬琴の小說を讀むと、近來の思想と合はない節もあり殊に總體の調子が古めかしいとは云へ、克く人情の機微に觸れ、讀者を魅了する力を有つてをる。繪畫の如きも、新らしいものは其形は整つて居るが、これを熟視すると氣魂が無い。古名人の描いたものは、其人の精神が畫圖の中に生きて居るやうに思はれる。それも道理、古名人は、畫の爲めに畫を描くので、阿賭物の爲めには描かなかつたのである。昔、伊勢に、月僊といふ僧があつて、畫家として知られてゐた。然るに、僧侶にして畫家たるの身を以て、甚だ錢を愛し、人の畫を囑するあれば、必ず禮金を受け'
  translation: '四　金のためにはしない

    馬琴やシェイクスピアの著作、ラファエロの作品を見ても、名人・巨匠の心がけには、普通の人の及ばないところがある。馬琴の小説には近ごろの思想と合わない点があり、全体の調子も古めかしいが、人情の微妙な動きによく触れ、読者を引きつける力がある。

    絵画でも、新しい作品は形が整っているが、よく見つめると気迫がない。昔の名人が描いたものは、その人の精神が絵の中に生きているように思える。それも当然で、昔の名人は絵のために絵を描き、金のために描いたのではなかった。

    昔、伊勢に月僊という僧がいて、画家として知られていた。しかし、僧であり画家でもある身でありながら、たいへん金銭を愛し、絵を頼まれると必ず礼金を受け取って'
  notes:
  - 阿堵物は金銭のこと。末尾はscan159へ続く。
  - 底本の見出しと本文は「阿賭物」。通常の語形「阿堵物」（金銭）の意味で訳した。

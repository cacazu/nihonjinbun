  section: 禪と鎌倉武士／一、花は櫻木人は武士
  original: '一、花は櫻木人は武士


    禪といひ、鎌倉武士といひ、數百年前のことを此處へ持ち出すやうで、事は頗る古いやうであるが、しかし乍ら、衲は、聊か、現下の時局に感ずるところがある爲めに、かう云ふ題を思ひ起したのである。尙ほ、本題に入る前に、一言申しておき度いのは、此の「禪」といふことである。禪といふと、世人は、先づ、かやうに考へられるであらう。はア禪······あれは禪僧·····其處で禪宗······即ち、禪宗坊さんが來て、さうして此の廣い世間の人達、又たは、各宗諸大德方の前に於て、禪宗のことを、殊更、喋々するやうに取られるかも知れない。けれども、然うでない。實は、それを、一言、斷つて置かうと思ふのである。衲の見たところに依ると、尠くも、我が佛教各宗の眞髓ともいふところに至ると必ず禪といふものが無ければならぬ。と斯う思つて居る。此の意味に於ては、敢て今ま歷史的に成立して居るところの禪宗の禪、その中の曹洞禪とか、臨濟禪とか、相似禪とか、野狐禪とか、さう云ふ意味のことを言ふのでは無いのであつて、「禪」といふ字を借りて、佛教各宗の眞髓······其の各宗の眞髓を「禪」といふ言葉に代表せしめた積りである。かう云ふ工合に豫め考へておいて貰ひたいのである。さうして、鎌倉武士······鎌倉といふと、直きに禪を思ひ出し、禪と云ふと、直きに武士といふことを思ひ出すといふやうな關係で、これは一種の衲が聯想であるが、歷史上も、やはり、さう云ふ有樣に出來上つてをる、鎌倉武士、謂ゆる、人は武士といふと、人の中の人、たとへば、花といふと櫻を思ひ出すやうな關係で、玆に禪といふ字と、鎌倉武士といふ字は、極く親しい意味もあり、關係もあるから、旁'
  translation: '一　花なら桜、人なら武士


    禅といい、鎌倉武士といい、数百年前のことを持ち出すようで、ずいぶん古い話に見える。しかし私は、今の時局について感じることがあるため、この題を思いついたのである。

    本題に入る前に、一言述べておきたいのは、この「禅」という言葉についてである。禅と聞けば、人々はまず、「ああ、禅か。あれは禅僧で、だから禅宗のことだな」と考えるだろう。つまり、禅宗の坊さんが来て、世間の人々や各宗の高僧の前で、ことさらに自分の宗派のことをしゃべるのだと受け取られるかもしれない。しかし、そうではない。その点を、あらかじめ断っておきたい。

    私の見るところ、少なくとも仏教各宗の真髄に至れば、必ず禅というものがなければならない。この意味では、今、歴史上の一宗派として成り立っている禅宗の禅、その中の曹洞禅、臨済禅、また、見せかけの禅や誤った禅といった意味のことをいうのではない。「禅」という言葉を借りて、仏教各宗の真髄を代表させたつもりなのである。あらかじめ、そう理解していただきたい。

    さて、鎌倉武士である。鎌倉といえばすぐ禅を思い出し、禅といえばすぐ武士を思い出す。これは私の連想ではあるが、歴史の上でも、やはりそのような関係ができている。鎌倉武士、いわゆる「人は武士」といえば、人の中でも最もすぐれた人を指す。花といえば桜を思い出すのと同じような関係である。こうして「禅」と「鎌倉武士」という言葉には、たいへん親しい意味と関係があるので、そうしたこともあって、'
  notes:
  - 末尾はscan85へ続く。武士を人の典型として称える価値観は著者の意図を保持した。

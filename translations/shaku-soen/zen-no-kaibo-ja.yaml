  section: 正法に不思議なし／三、障子の引手峰の松
  original: '三、障子の引手峰の松


    之れを要するに、佛法には、何等、不思議も奇特事もあるのではない。若し、悟つたが爲めに變つた人間となつたと云ふ者があるならば、それは悟りの病ひに犯されたものである。謂ゆる「悟り了れば未悟に同じ」で、政事家は政事家、軍人は軍人、商人は商人、農夫は農夫、各、其の職分を守り、業務に勉勵して行くほかに、別段、變つたことの有るべき筈はない。一休和尙は、佛法は障子の引手峰の松火打袋に鶯の聲と詠まれて居るが、佛法の眞髓たる宇宙の大道は、障子を開け閉てするところにも峰の松風の音にも、腰に下げた火打袋にも、鶯の囀にも、鳥の姿にも、明歷々、露堂々として存在してをる。吾人の一擧手、一投足は、悉く、大道そのもので、吾人は、大道の眞唯中に自由自在に思ふまゝの活動をしてゐなければならぬ筈である。それが出來ないといふのは、外境に囚はれ、それに執着し、束縛されて、自由の分を失ふからである。若し、一切の繫縛から脫離して、安住不動須彌山の如しといふ、身心脫落の境界に達したならば、各人本來具有の天眞佛が現はれて、緣に應じ、境に從ひ、何んの苦痛もなく、スラ〳〵と自由自在の行動が出來るであらう。明治年間、曹洞宗の高德に、原坦山和尙といふのがあつた。或時、道友兩三名と共に、旅行をされたことがあるが、途中、一つの川に出會したが橋がない。そこに一人の妙齡の美人が、越さうとして越し難いため躊躇してをつた。和尙、これを見'
  translation: '三　障子の引き手、峰の松


    要するに、仏法には、何の不思議も奇跡もない。もし、悟ったために変わった人間になったという者がいるなら、それは悟りという病気にかかったのである。「悟りきれば、悟らない人と同じ」といわれるとおり、政治家は政治家、軍人は軍人、商人は商人、農夫は農夫として、それぞれの務めを守り、仕事に励むほかに、特別変わったことがあるはずはない。一休和尚は、次のように詠んでいる。

    「仏法とは、障子の引き手、峰の松、火打ち道具の袋、そしてウグイスの声。」

    仏法の真髄である宇宙の大道は、障子を開け閉めするところにも、峰の松風の音にも、腰に下げた火打ち袋にも、ウグイスのさえずりにも、鳥の姿にも、はっきりと、隠れることなく存在している。私たちの手を上げ足を運ぶ一つひとつが、すべて大道そのものである。私たちは大道の真っただ中で、自由自在に、思うまま活動しているはずなのである。

    それができないのは、外の状況にとらわれ、執着し、縛られて、自分の自由を失うからである。一切の束縛から離れ、須弥山のように安らかで動じない、身も心も執着を脱した境地に達すれば、各人に本来備わる自然のままの仏が現れる。そして、そのときの縁や状況に応じて、何の苦痛もなく、すらすらと自由自在に行動できるだろう。

    明治時代、曹洞宗の高僧に原坦山和尚という人がいた。あるとき、同じ道を学ぶ友人二、三人と旅をした。途中で川に出会ったが、橋がない。そこに若い美しい女性がいて、渡ろうにも渡れず、ためらっていた。和尚はそれを見ると、'

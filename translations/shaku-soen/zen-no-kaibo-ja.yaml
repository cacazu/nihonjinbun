  section: 驢を渡し馬を渡す／二、如何なるが是れ灌溪
  original: 「如何なるか是れ灌溪」と問ひを發したから、「劈箭急なり」と答へられた。此の灌溪の激流は强弓で射る弓よりも早いぞ、この急流の中に入ると、生死迷悟すべて押し流してしまふといふのである。雪竇の評は、趙州を賞めんが爲めに、暫く灌溪を押へたまでゞ、語に轉ぜられて優劣をつくべきでない。が、趙州の答へは圓熟して居る。古の多くの古德中に卓然たるものがあると思ふ。
  translation: '「では、灌溪とは何ですか」と問いかけたので、「矢のように速い」と答えられた。この灌溪の激流は、強い弓から放つ矢よりも速いぞ。この急流に入れば、生も死も、迷いも悟りも、すべて押し流されてしまう、というのである。

    雪竇の評は、趙州をほめるために、ひとまず灌溪を低く置いただけであり、その言葉に振り回されて優劣をつけてはならない。ただ、趙州の答えは円熟している。昔の多くの高僧の中でも、ひときわ抜きんでたところがあると思う。'
  notes:
  - 原文の「强弓で射る弓」は誤植とみられるため、訳では「強い弓から放つ矢」とした。

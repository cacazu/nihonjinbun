  section: 中澤道二翁の敎訓
  original: 「それは尤もなことで御座る。そんなら、その心得方を、今、云ふて聞かせましよう。これ、娘御、近う寄つて能く聞かつしやれ。扨て、和女の云はれるところを一通り聞くと、尤ものやうに聞こえるが、それは、皆な、世間並みの了見で、今度の嫁入りの間に合はぬ。それゆゑ、あのやうに態と嚴しく云つて工夫させました。併し、あれほどにも能く考へをつけられた。そこは感心ぢやが、扨て、そのほかに、一大事の覺悟といふのは、別のことで御座らぬ。たゞ堪忍といふことで御座る。今度の嫁入りは、唯だ、堪忍の行を勤めに行くのぢやと覺悟されるがよい。其譯は、和女も今年で二十七歲、長い間、親の家風に馴染んだ娘ぢや。それが、俄かに他の家へ行けば、心に合はぬことも多く、辛いことも多からう。長い月日のうちには、湯殿の隅や、雪隱の壁に向つて泣かれるやうなことは幾度びもあらう。そのやうな時に、平常、和女の心に何ぞ孝行らしいものか、信實らしいものを有つて居られると、自分は此れほどまでにするに、舅が聞こえぬとか、自分はこれほどまでに思うて居るのに、小姑がさうでないとか、何れ先方を怨みに思ふの心が出るに違ひない。さういふ心が出たが最後、それが修羅場の根となつて、しまひには緣の切れ小口、一生流浪せねばならぬやうなことになる。だから、そのやうな孝行ぢやの信實ぢやのといふ利口な了見はさつぱりと捨てゝしまつて、辛いことのあつた度びに、こゝが大事の辛棒どころ、この堪忍を勤めにこそ、自分は此家へ來たのだと、たゞ一筋に、堪忍の行を勤められるがよい。それが本當の生きた孝行、生きた信實ぢや。その通りにさへすれば、天下に敵なし。千秋萬歲の榮えが出來る」と嚙み碎いて敎へられた。母も、娘も、涙を流して感心して歸つた。娘もその心得で先方へ行つたから、夫婦仲は言ふに及ばず、舅姑との仲も睦じく、小舅小姑にも格別に親切にしてもらひ、三人の繼子も實の子のやうに懷いたから、家庭は風波なく、ニコ〳〵暮して、三十何年かを經つうちに、舅姑も亡くなられ、小舅小姑もそれ〳〵に緣附いて、相變らず親切にしてくれ、三人の小供も、それ〳〵成長し
  translation: '「それはもっともです。それでは、その心構えを今からいい聞かせましょう。さあ娘さん、近くへ寄って、よくお聞きなさい。あなたのいうことは、一通り聞けばもっともに聞こえるが、どれも世間並みの考えで、今度の結婚には間に合わない。だから、あのようにわざと厳しくいって、考えを深めさせたのです。しかし、よくあそこまで考えられました。それは感心です。さて、それ以外に必要な大切な覚悟は、ほかでもない、ただ堪忍ということです。今度の嫁入りは、ひたすら耐え忍ぶ修行をしに行くのだ、と覚悟するがよい。

    なぜかといえば、あなたは今年で二十七歳、長い間、親の家のやり方になじんできた娘です。それが急に他の家へ行けば、気に入らないことも、つらいことも多いでしょう。長い年月の間には、風呂場の隅や便所の壁に向かって泣くようなことも、幾度もあるでしょう。そのとき、普段から自分の心に、何か孝行らしいもの、真心らしいものを持っていると、『自分はこれほどしているのに、舅はわからず屋だ』『自分はこれほど思っているのに、小姑はそうではない』と、きっと相手を恨む心が出てきます。そういう心が出たが最後、それが争いの種となり、しまいには縁の切れるきっかけになって、一生、身の落ち着かない暮らしをしなければならなくなる。

    だから、そんな孝行だの真心だのという小ざかしい考えは、すっかり捨ててしまいなさい。つらいことがあるたびに、『ここが大事な辛抱どころ。この堪忍を実践するためにこそ、私はこの家へ来たのだ』と、ひたすら耐え忍ぶ修行に努めるのがよい。それが本当に生きた孝行、生きた真心です。そのとおりにさえすれば、天下に敵はなく、いつまでも栄えることができます。」

    このようにかみ砕いて教えた。母も娘も涙を流して感心し、帰った。娘もその心構えで嫁いだので、夫婦仲はいうまでもなく、舅姑との仲もむつまじく、夫の兄弟姉妹からも格別に親切にされ、三人の子どもも実の子のようになついた。家庭には波風が立たず、にこにこと暮らし、三十何年か過ぎるうちに舅姑も亡くなり、夫の兄弟姉妹もそれぞれ結婚して、相変わらず親切にしてくれた。三人の子どもも、それぞれ成長し'
  notes:
  - 嫁いだ女性の忍耐を重んじる家族観は、原著の歴史的価値観を保って訳した。現代の生活上の助言として示すものではない。

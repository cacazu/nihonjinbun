  section: 禪と鎌倉武士／四、確乎不拔なる中心
  original: '四、確乎不拔なる中心


    要するに、物質的戰爭に於ても、精神的戰爭に於ても、渾然として統一を成して確固不拔なる中心の有る國が、今日まで、勝つものは勝ち、勳功を奏するものは奏して居ると思ふ。國には國の中心あり、家には家の中心あり、人には人の中心があるので、凡らゆる異分子を打して一丸とし、各、精神的統一、擧國一致の、此の精神が强いか弱いか、此の精神が全く亡びたか亡びぬかによつて、殆ど、其國の盛衰興亡を、豫め想像することが出來る。而して、我國の現狀は何うかと云ふと、お互ひが平生から誇つてをる武士道、日本魂といふこの精神が、開國三千年後の今日、果して、嚴然として、金鐵の如きものが有らうか。此の五千萬なり六千萬の人間の心が、殆ど、擧つて、玆に一致して居るものであらうか、それは、一致したものが如何やうに働いてをるであらうかと云ふ實際について眺めてみると、衲には分らぬ、どうしても分らぬと云つて置くより仕方がない。世間の人々は、これ丈けの言葉で、人々箇々の常識なり、學問なりに照らして考へられたならば、此の世界に誇つて居る國は、皇統一系の國、人は忠孝一致の民族、その大和魂-武士道-と云ふ精神が、現在、如何やうに働いてをるか、衲には分らぬと云つたが、各人には必ず分つて居ることゝ思ふ。かう云ふことに基いて、衲は斯樣に古い題を選んだのである。世界戰爭の始まらぬ先き、英國の或る識者が、かういふ事を言つたと聞いてをる、英國の敵は、決して、獨逸ではない。勿論、他の國々ではない。動もすると、英國人は、英國の敵は獨逸だ〳〵と小供などに教へたのであるが、今の識者の云ふとこ'
  translation: '四　揺るぎない中心


    要するに、物質面の戦争でも精神面の戦争でも、全体が一つにまとまり、揺るぎない中心を持つ国が、今日まで、勝つべくして勝ち、功績を上げるべくして上げていると思う。

    国には国の中心があり、家には家の中心があり、人には人の中心がある。あらゆる異なる要素を打ち合わせて一つにし、それぞれ精神的に統一する。国全体が一致するこの精神が強いか弱いか、すでに滅びたか、まだ滅びていないかによって、ほとんどその国の盛衰や興亡を予想できる。

    では、日本の現状はどうか。私たちが日ごろ誇っている武士道、日本魂という精神は、建国から三千年を経た今日、果たして金や鉄のように堅固に存在しているだろうか。五千万、六千万という人々の心は、ほとんどすべてがここで一致しているのだろうか。そして、一致したものが実際にどう働いているのだろうか。その現実を眺めてみると、私にはわからない。どうしてもわからないと言っておくしかない。

    世間の人が、これだけの言葉をそれぞれの常識や学問に照らして考えれば、国は一系の皇統を保ち、人は忠義と孝行を一致させた民族であると世界に誇る、その大和魂――武士道――という精神が、現在どう働いているか、私にはわからないと言ったが、皆さんにはきっとわかると思う。このようなことから、私はこんな古い題を選んだのである。

    世界戦争が始まる前、イギリスのある識者が、こんなことを言ったと聞く。イギリスの敵は決してドイツではない。もちろん、ほかの国々でもない。ともすればイギリス人は、イギリスの敵はドイツだ、ドイツだと、子供たちにも教えたのであるが、その識者の言葉に'
  notes:
  - 末尾はscan89冒頭「ろに依れば」へ続く。訳は次コマ冒頭「よれば」とつながる。
  - 建国年数、皇統、国民精神の捉え方は、著者の当時の叙述として保持した。

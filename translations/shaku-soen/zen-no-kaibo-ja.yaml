  section: 丹霞燒佛の話
  original: '禪門では、常に向上向下相離るべからざることを說く。禪門に於ける向上は、佛何物ぞ、吾れ何者ぞと、一切萬有を超越した精神をいふのである。一切衆生悉有佛性の見地よりすれば、物と我れと毫も尊卑の別は無い。無差別平等である。

    丹霞の天然禪師が、曾て、洛東の惠林寺に行つた時、恰も冬の最中で、寒氣凛烈たるものであつたから、早速、本堂から、佛樣の木像を擔ぎ出して火にくべ、不作法にも股火をしてあたつて居つた。惠林寺の院主が、之れを見て、大いに驚き、

    「なぜ、尊い佛像を燒くのか。」

    と咎めると、丹霞は平然たるもので、杖で灰を撥きながら、

    「我れ燒いて舍利を得んと欲す。」

    と云ふ。院主が、

    「本佛、何ぞ舍利あらん。」

    木像に舍利があつて堪るものかといふと、丹霞は、

    「已に舍利なし、更に、此の兩尊を再取して之れを燒かん。」

    舍利が無ければ、序でに御脇立も燒いてしまはうと云つた。そんな事を云つたから、丹霞に罰が當るかと思へば、却つて、「院主、自ら、眉鬚墮落す」とある。却つて、院主が罰を蒙つた。

    丹霞の手許には、佛像だから有難いの、枯木の枝だから詰まらないのと云ふ尊卑輕重の差別はない。これ丹霞が向上の玄底を叩いて爲人の作略を示したのであるが、而かも、丹霞は、一面に斯くの如き大見識を持つて居つたが、その修行は極めて綿密であつて、馬祖道一に參じて、其の印可を受け、石頭大師の行者房に居つて三年間苦役したとある。丹霞の如きは、實に「意に毘盧の頂𩕳を踏んで、行ひは童子の足下を拜する」ものである。'
  translation: '禅では常に、「向上」と「向下」を切り離してはならないと説く。禅でいう「向上」とは、「仏が何だ、自分が何だ」と、存在するすべてを超える精神である。生きとし生けるものには、すべて仏性があるという立場から見れば、物と自分との間に、尊い、卑しいという差は少しもない。区別なく平等なのである。

    丹霞天然禅師が、かつて洛陽の東の恵林寺を訪ねたとき、真冬で寒さがひどかった。そこで早速、本堂から木の仏像を担ぎ出して火にくべ、行儀悪く、その火をまたぐようにして暖まっていた。寺の管理者である院主は、それを見てひどく驚き、「なぜ尊い仏像を焼くのか」ととがめた。丹霞は平然として、杖で灰をかき分けながら、「焼いて仏舎利を取り出そうと思うのだ」と言った。院主が、「木の仏像に仏舎利などあるものか」と言うと、丹霞は、「それなら、この両脇の二体も持ってきて焼こう」と言った。仏舎利がないなら、ついでに脇に立つ仏像も焼いてしまおう、というのである。

    そのようなことを言えば丹霞に罰が当たりそうだが、かえって「院主自身の眉とひげが抜け落ちた」とある。反対に、院主のほうが罰を受けたのである。

    丹霞には、仏像だからありがたい、枯れ木の枝だからつまらない、という尊卑や軽重の区別がない。これは丹霞が、あらゆる区別を超えた境地の底を示し、人を導く手立てを見せたのである。しかし丹霞は、一方で、このような大きな見識を持ちながら、その修行はきわめて丹念だった。馬祖道一に参じて悟りを認められ、石頭大師の行者の部屋で三年間、つらい仕事に励んだという。丹霞のような人は、まさしく「心の見地では毘盧遮那仏の頭上を踏むほど超越しながら、行いでは幼い子の足元をも拝む」人なのである。'
  notes:
  - 「向下」は、超越的な見地から日常の実践へ下りて働くこと。
  - 「舍利」は仏などの遺骨・遺灰。本話の表現を現代語化した。
  - 底本の「本佛」は後続の説明に即して木の仏像と解した。「頂𩕳（ちょうねい）」は頭頂。

  section: 不轉不動なれ／一 其心を大山にす可し
  original: '不轉不動なれ


    一、其心を大山にす可し


    道元禪師は、「其心を大山にすべし」といふことを仰せられてをるが、この人生といふものは、波風の荒い海の上を渡つて行くやうなもので、動もすれば暴風が吹き起り、狂瀾怒濤が吾等の船を沈沒の難に會はしめようとする。經文の中に「八風」といふ語があるが、即ち、此の人生の暴風を八つに分類したものであつて、利(利益)と、衰(衰微、衰弱)と、譽(ほめられる)と、稱(面前でほめられる)と、毀(かげで誹る)と、毀(そしる)と、苦(くるしむ)と、樂(たのしむ)とが其れである。此中の利と譽と稱と樂の四つは順風で、衰と毀と議と苦とは逆風である。'
  translation: '揺るがず、動じない心を

    一　心を大きな山のようにせよ


    道元禅師は、「その心を大きな山のようにせよ」といっている。人生というものは、波風の荒い海を渡っていくようなもので、ともすれば暴風が吹き起こり、荒れ狂う大波が私たちの船を沈めようとする。

    経文に「八風」という言葉があるが、人生のこの暴風を八つに分類したものだ。利、つまり利益を得ること、衰、つまり衰えること、誉、つまりほめられること、称、つまり面前でほめられること、毀、つまり陰で悪くいわれること、そしられること、苦しむこと、楽しむことがそれである。このうち利・誉・称・楽の四つは順風で、衰・毀・譏・苦は逆風である。'
  notes:
  - 八風の列挙では原著が「毀」を二度記す。一般に八風は利・衰・毀・譽・稱・譏・苦・樂で、訳文のまとめでは「譏」とした。

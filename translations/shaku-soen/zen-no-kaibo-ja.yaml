  section: 宗敎的善行／三、一身を犧牲にして
  original: '三、一身を犧牲にして


    書を讀んで子孫に遺す、子孫これを讀まず、金を積んで子孫に遺すも、子孫これを守らず、隱德を施して、子孫に餘慶を享けしむるに如くは無いのである。然るに今人、多くは、子孫の克く守らざる金を蓄へ、或は書を積んで遺さうとはするが、隱德を施さうとする者は至つて少ない。男爵を授くると云へば、一議に及ばず金を出す成金はあるであらうか、隱れたる善行を心懸ける者は稀れである。近來いろ〳〵の社會的事業に資財を投ずるやうな篤行も、ぼつ〳〵耳にはするが、功德なきに喜捨するものは、餘り見當らない。釋迦にしろ、基督にしろ、將た、孔子にしろ、後世、敎祖と仰がるゝ所以は、世の爲め、人の爲め、一身を犧牲に供することに依つて求め得たる宗旨の始祖であるからで、犧牲の對象は、決して、直接の報酬では無い。釋尊が、富、四海を保つ底の王者の榮耀を棄てられたのは、何も報酬を望まれたのでは無い。楠公の赤心も、報酬のために捧げたのでは無かつた。若し、さうした心懸けであれば、七たび人間に生まれて國賊を滅さうなどゝ云ふ悲壯なる言葉が發せらるゝ筈がない。否な楠公にして報酬を望んだならば、他に幾らも好い方法があつたに違ひない。'
  translation: '三　自分の身を犠牲にして

    書物を読んで子孫に残しても、子孫はそれを読まない。金をためて子孫に残しても、子孫はそれを守らない。それより、人知れず善いことをし、その余りの恵みを子孫に受けさせるほうがよい。ところが今の人は、子孫が守りきれない金を蓄え、あるいは書物を積み重ねて残そうとするが、隠徳を施そうとする人はごく少ない。

    男爵にしてやるといえば、二つ返事で金を出す成金はいるだろうが、隠れた善行を心がける人はまれである。近ごろ、いろいろな社会事業に財産を投じる立派な行いも、ぽつぽつ耳にする。しかし功徳を当てにせず喜んで寄付する人は、あまり見当たらない。

    釈迦、キリスト、孔子が後世に教祖と仰がれるのは、世のため人のために自分の身を犠牲にして求め得た教えの開祖だからである。その犠牲は、直接の報酬を引き換えに求めたものではない。

    釈尊が、天下を領する王者の富と栄華を捨てたのは、報酬を望んだからではなかった。楠公の真心も、報酬のために捧げられたのではない。もしそういうつもりだったなら、「七度人間に生まれて国賊を滅ぼそう」という悲壮な言葉が出るはずはない。それどころか、楠公が報酬を望んだなら、ほかにいくらでもよい方法があったに違いない。'
  notes:
  - 楠公は楠木正成。人物にまつわる逸話と価値判断は著者の記述に従う。

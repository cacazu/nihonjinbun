  section: 夙に起き時を使へ／四、德川家康の教訓
  original: '四、德川家康の教訓


    今ま思ひ出したが、かう云ふ話がある。或時、家康公が、自身の居間に休んで御座ると、近侍の者共が、四方八方の話をなし、頻りと金のなる木といふことを申してをる。「昔から、金の生る木と、能く、世間話に云ふが、米の生る木は見たが、金の生る木は、まだ、見たことが無い」などゝ打ち興じて居るのを、家康公が、ちらりと耳に挾まれ、「者共、面白いことを話して居る。金の生る木を知らぬとあれば、俺が教へてやらう」と筆を取り寄せて、白紙の眞中に書かれたのが、一本の棒であつた。そして、その左右に枝のやうなものを一本づゝ書かれて、右の方には正直、眞中には早起、左の方には働きといふ字を現はして、「これが金の生る木ぢや、能く見屆げて置け」と示されたと云ふことであるが、まことに味ひがあり、又た實に能く練れた言葉で'
  translation: '四　徳川家康の教訓


    今思い出したが、こんな話がある。あるとき家康公が自分の居間で休んでいると、近くに仕える者たちがさまざまな話をし、しきりに「金のなる木」のことを言っていた。

    「昔から、世間ではよく金のなる木というが、米のなる木は見たことがあっても、金のなる木はまだ見たことがない。」

    そう言って面白がっているのを、家康公がちらりと耳にして、「お前たち、面白いことを話しているな。金のなる木を知らないのなら、私が教えてやろう」と言った。筆を取り寄せ、白紙の真ん中に一本の棒を描いた。そして、その左右に枝のようなものを一本ずつ描き、右に「正直」、真ん中に「早起」、左に「働き」と書いた。

    「これが金のなる木だ。よく見ておけ。」

    そう示したという。まことに味わいがあり、また実によく練られた言葉で'
  notes:
  - 末尾はscan72冒頭へ続く。

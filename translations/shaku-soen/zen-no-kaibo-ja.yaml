- id: zen-071-01
  scan: 71
  section: 夙に起き時を使へ／三、早く起きて考へよ
  original: とは、夜と晝である。生は、過去に遡つても、未來に向つて考へてみても、謂ゆる生死一如である。生即ち死、死即ち生である。かう論ずると、生死論に及ばねばならぬが、今は理窟でないから、言ふ必要はないが、何處で何をしながら死なうが、我が職分に始終し得たならば、他人は、何んだ彼の狀はと笑はうとも、己れに於ては、遺憾なしであらうと思ふ。そこで、かゝる心掛けを有つには、どうしても、朝早く起きて、十分に之れを考へる必要がある。ところが、早起きは、なか〳〵難いもので、殊に、寒い時には、目覺めても枕を蹴つて起きるといふは、隨分、困難である。けれども、物事に成功しようと云ふ人ならば、必ず之れを實行して渝らないものが無ければならぬ。
  translation: '夜と昼のようなものなのである。生を、過去へさかのぼって考えても、未来へ向けて考えても、いわゆる生死一如である。生はそのまま死であり、死はそのまま生である。

    こう論じれば生死の議論に及ぶことになるが、今は理屈を話しているのではないので、詳しく述べる必要はない。どこで何をしながら死のうとも、自分の務めを最後まで果たせたなら、他人が「あれは何というざまだ」と笑っても、自分としては悔いがないだろうと思う。

    このような心がけを持つためには、どうしても朝早く起きて、十分に考える必要がある。ところが早起きはなかなか難しい。特に寒いときには、目が覚めても、枕を蹴ってすぐ起きるのはずいぶん困難である。それでも、物事を成功させようという人なら、必ずこれを実行し、変わらず続けるところがなければならない。'

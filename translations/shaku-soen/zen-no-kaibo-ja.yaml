  section: 驢を渡し馬を渡す／八、禾山の解打鼓
  original: '八、禾山の解打鼓


    禾山和尙が、或時、垂語して曰はれるには、

    「習學これを聞といひ、絕學これを隣といふ。此の二者を過ぐるもの、是れを眞過といふ」

    と。これは肇法師の寶藏論中にある語である。今ま、禾山和尙は、此語を引いてきて、祖師門下の直指の教へに當てられたものである。習學とは、佛道を修行することで、佛道の修行は苦界を離れて安樂の境に住する爲めである。已に苦界を離れ、安樂の境に住するを得て、も早や此れ以上學ぶことがないといふ位に至つたのが、絕學、又は、無學であるが、まだ大覺の極致でない。辛と其の附近まで至つたものである。故に、之れを隣（となり）といふ。それで、此の二つものを超越してしまつたのが眞過である。大體の意味は斯うであらうが、禾山は此語を揭げて學人を釣らんと試みたのである。すると、一僧があつて、出でゝ問ふ、

    「如何なるか是れ眞過」

    と。禾山、曰く、

    「解打鼓」

    太鼓をたゝくことを知つて居るよの意味である。禾山は、此僧が、眞過とか佛とか悟とかいふものを難有つて珍重して居る執見を打破せんが爲めに、此の何處からも齒の立てやうのない鐵饅頭を投げ出されたのである。すると、また、問ふ。

    「如何なるか是れ眞諦」

    禾山和尙は、また、

    「解打鼓」

    と同じことを答へられた。そこで、また、問ふ。

    「即心即佛は即ち問はず、如何なるか是れ非心非佛」'
  translation: '八　禾山の「太鼓を打つことなら、わかっている」


    禾山和尚が、あるとき次の言葉を示した。

    「学び修めることを『聞』といい、学ぶべきことを尽くすことを『隣』という。この二つを超えたものを『真過』という。」

    これは僧肇法師の『宝蔵論』にある言葉である。禾山和尚はこの言葉を引いて、祖師の門下で行う、心を直接に指し示す教えに当てはめた。「習学」は仏道を修行すること。仏道の修行は、苦しみの世界を離れ、安らかな境地に住むために行う。すでに苦しみを離れて安らかな境地に住み、もはやそれ以上学ぶことがないところまで来たのが「絶学」、または「無学」である。しかし、まだ大いなる悟りの極致ではなく、ようやくその近くまで来たにすぎない。そこで「隣」と呼ぶ。その二つをともに超えてしまったのが「真過」である。

    大体の意味はこのようなものだろうが、禾山は、この言葉で修行者を釣り出そうとしたのである。すると、一人の僧が進み出て、「真に超えるとは、どういうことですか」と尋ねた。禾山は答えた。

    「太鼓を打つことなら、わかっている。」

    太鼓をたたくことを知っている、という意味である。禾山は、この僧が「真過」や「仏」や「悟り」をありがたがり、大切に抱えているとらわれを打ち破ろうとして、どこからも歯の立たない鉄のまんじゅうのような答えを投げ出した。すると、僧はまた尋ねた。

    「究極の真理とは、何ですか。」

    禾山は、また「太鼓を打つことなら、わかっている」と同じ答えをした。そこで僧はまた尋ねた。

    「この心がそのまま仏である、ということは問いません。心でもなく、仏でもないとは、どういうことですか。」'
  notes:
  - 本文の小見出しは画像で「禾山」と確認。目次の「米山」とは字形が異なる。

  section: 蛙飛び込む水の音
  original: 'は、やはり、其儘に、

    「古池や蛙飛び込む水の音」

    とすると云はれた。これが今に有名な古池の句である。

    何事も、こんな具合に自由が得られてくると、すべての事に取り外しがない。常に、樂しんで業務に從事し得られるのである。それには不斷の精進努力を要するのである。'
  translation: 'は、やはり、そのままに、

    『古い池だ。そこに蛙が飛び込む、水の音』

    としよう」といった。これが今も有名な古池の句である。

    何事でも、このような自由を得られるようになると、何をしても的を外さない。いつも楽しんで仕事に取り組めるのである。それには、絶え間なく精進し、努力することが必要だ。'

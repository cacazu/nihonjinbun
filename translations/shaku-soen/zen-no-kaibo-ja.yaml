  section: 武士道を他にも及ぼせ／四 萬物の長たる所以
  original: ずると、耶蘇敎を奉ずるとは、措いて問はず、崇高なるところの信念あつてこそ、初めて他の動物に長たる所以を發揮するのである。然るに、佛敎信者の家に生まれた者が、外國へ行つて、宗敎を檢べられて、耶蘇敎信者だと答へれば、何にかの利益があらうかと考へ、漫りに耶蘇敎信者だと答へたものもあると云ふことだが、彼のラツド博士の如き、又たはハリソン博士の如き人から、「日本には、祖先敎があり。佛敎があり、尙ほ、孔子敎があり、神道があるに、如何なる事情によりて、耶蘇敎を信ずることになつたか」と尋ねられて、これに答へが出來ず、窮したものがあつたと聞いて居る。
  translation: 'るか、キリスト教を信じるかはひとまず問わない。崇高な信念があってこそ、初めてほかの動物の上に立つ理由を示せるのである。

    ところが、仏教信者の家に生まれた者が外国へ行き、宗教を尋ねられて、キリスト教徒だと答えれば何か利益があるだろうかと考え、いいかげんにキリスト教徒だと答えた者もいるという。しかしラッド博士やハリソン博士のような人から、

    「日本には祖先を崇拝する教えがあり、仏教があり、また儒教があり、神道もあるのに、どのような事情でキリスト教を信じるようになったのですか」

    と尋ねられ、答えられずに困った者があったと聞いている。'

units:
- id: front-005-01
  scan: 5
  section: 巻頭の墨蹟
  original: '前圓覺寺派管長 釋宗演老師墨蹟

    山堆屍矣河流血。白哲修羅戰何烈。

    今曉喜看撥亂兆。旭光先照芙蓉雪。

    己未元旦試筆 洪岳'
  translation: '円覚寺派の前管長、釈宗演老師の書。

    山には亡骸が積み重なり、川には血が流れる。白い肌の修羅たちの戦いは、なんと激しいことか。

    今朝は、世の乱れが治まる兆しを喜んで眺める。昇る朝日の光が、まず富士山の雪を照らしている。

    己未の年の元日、筆を執る。洪岳。'
  notes:
  - 原画像は横向き。反時計回りに90度回転し、墨蹟と左側の活字釈文を照合した。漢詩の返り点は省略。
  - 活字釈文の「白」次字は「哲」に近く見えるため「白哲」と暫定転記した。「白皙」（肌の白いこと）の異体字または誤植の可能性があり、その意味に解したが、原字の判定は未確定。
  - 「修羅」は争いに明け暮れる阿修羅になぞらえた表現。「芙蓉」はここでは富士山の雅称と解した。
  - 「己未」は著者の生存年代から1919年と推定できるが、原文では干支のみを記す。
  sequence: 1
- id: preface-006-01
  scan: 6
  section: はしがき
  original: 初祖達磨大師、其徒、道副に謂つて曰く、汝は吾が皮を得たりと。また、尼、總持に謂つて曰く、汝は吾が肉を得たりと。また、道育に謂つて曰く、汝は吾が骨を得たりと。最後に二祖神光に謂つて曰く、汝は吾が髓を得たりと。悟道の證果、固より各人各異と云ふを得べきも、禪もと兩般あるに非ず。否な、一箇の佛字を說き一箇の禪字を道ふも、共に滿面の慚惶たり。何ぞ况んや禪の解剖をや。古人曰ふ、向上の一路は千聖も不傳と。然れ共、また、許多の葛藤あり。即ち、禪は語に非ず默に非ずして、而して亦た語なり默なり。此間の消息、宜しく冷暖自知すべくして、言說すべからず。
  translation: 禅の初祖である達磨大師は、弟子の道副に「おまえは私の皮を得た」と言い、尼僧の総持には「おまえは私の肉を得た」と言った。また、道育には「おまえは私の骨を得た」と言い、最後に二祖となる神光には「おまえは私の髄を得た」と言った。悟りによって得られる境地は、もちろん人それぞれに異なると言ってよいだろう。しかし禅そのものが、二つに分かれているわけではない。いや、「仏」とひと言述べ、「禅」とひと言口にするだけでも、恥ずかしさと恐れに顔が満ちるほどなのだ。まして禅を解剖するとは、どういうことだろうか。古人は「さらに向上していく究極の道は、千人の聖者がいても伝えられない」と言った。それでいて、そこには数多くの言葉のやり取りがある。つまり禅は、言葉でもなければ沈黙でもなく、しかもまた、言葉であり沈黙でもある。この微妙なあり方は、水の冷たさや温かさを自分で確かめるように、各自が体験して知るべきもので、言葉では説明し尽くせない。
  notes:
  - 原画像006を照合。「慚惶」は恥じ恐れること。「葛藤」はここでは単なる心の迷いではなく、禅をめぐる言葉・問答のもつれを含むものとして訳した。
  - 「冷暖自知」は自らの体験によって知ること。達磨の皮・肉・骨・髄の話は本書の題名にもつながる。
  sequence: 2
- id: preface-006-02
  scan: 6
  section: はしがき
  original: 本書「禪の解剖」は、近代禪門の巨匠たる釋宗演禪師が、粥前茶後の坐談、及び、法話、若干を輯錄せるものなり。禪師が縱橫無礙の快辯は、不言々の妙諦、不說々の
  translation: 本書『禅の解剖』は、近代の禅門の大家である釈宗演禅師が、朝粥の前や茶のあとに語った談話や法話をいくつか集めたものである。禅師の何にもとらわれない自在な語りは、言わずして語る奥深い真理、説かずして説く
  notes:
  - 原画像006を照合。文は次のコマへ続く。「不言々」「不說々」は原本の表記を残し、言葉に尽くせないものを語る逆説として訳した。
  sequence: 3
- id: preface-007-01
  scan: 7
  section: はしがき
  original: '眞源、說き得て盡くさゞるなく、利刃一閃、皮を裂き、肉を切り、骨を削り、髓を剔抉して、名醫の刀を揮ふが如し。後學の初機、須らく就いて箇の無舌人の言に參ぜよ。

    昭和六年二月 編者識'
  translation: '真実の根源を、余すところなく説き明かしている。それは、鋭い刃がひらめき、皮を裂き、肉を切り、骨を削り、髄をえぐり出す、名医の手術を見るようだ。これから学ぼうとする人は、この「舌を持たない人」の言葉に向き合い、その意味を深く究めてほしい。

    1931年2月、編者記す。'
  notes:
  - 原画像007右頁を照合。前コマ末の文を受ける。「無舌人」は言葉へのとらわれを超えて語る人を指す禅的な逆説であり、身体的な説明としては訳していない。
  sequence: 4
- id: zen-020-01
  scan: 20
  section: 生死は一如なり／一、眞の意義ある生活を
  original: 一、眞の意義ある生活を我が大聖釋尊は、物質的生活に於ては、何等の不足もなかつた一國の太子として生まれてゐながら、やがて昇るべき國王の位も、最愛の妻子も、弊履の如く棄てゝ顧みず、一個の乞食沙門として、大道を求め給うた。抑も、これは何が故であつたらうか。他なし、生死の大問題を解決せんが爲めであつた。我れ〳〵の生活には、物質、亦た、缺くべからざるのであつて、生活資料として
  translation: '一　真に意味のある生活を


    私たちの偉大な聖者である釈尊は、物質的な生活では何一つ不足のない一国の王子として生まれながら、やがて就くはずの王位も、最愛の妻子も、履き古した靴のように捨てて顧みず、一人の托鉢僧となって、大いなる真理の道を求められた。そもそも、それはなぜだったのだろうか。ほかでもない、生と死という大問題を解決するためだった。


    私たちの生活にも、物質は欠かせない。生活を支えるものとして、'
  notes:
  - 末尾は次コマへ続く。
  metadata:
    printed_pages:
    - 1
    image_checked: true
  sequence: 5
- id: zen-021-01
  scan: 21
  section: 生死は一如なり／一、眞の意義ある生活を
  original: の物質は輕視することが出來ないが、併し乍ら、我れ〳〵は、物質的生活にのみ滿足して、精神的生活を閑却することは出來ない。若し、人があつて、「自分は物質的生活だけで滿足である」といふものが有つたならば、衲は、かくの如き人に對して、「お前の生活は、そこに幾らか程度の差はあるとしても、牛馬犬猫に等しいものである」と斷言するに憚らない。人間は、萬物の靈長であると自稱してをるが、それは人間自身の勝手な話であつて、牛馬犬猫は牛馬犬猫で、各、自らを以て、萬物の靈長であるとしてをるかも分らぬ。物質的生活であるならば、彼等禽獸と雖も此れを爲して居る。否な、庭に繁る植物も、春の花、秋の紅葉、その他、微細の塵一本でも、皆な、等しく、これを爲してをる。果して然らば、吾人が如何に萬物の靈長であると獨り力んでみたところで、吾人の生活と彼等の生活と、何等、選ぶところは無いぢやないか。彼等の生活に比して吾人の生活が、どれだけ勝る價値と意義とを有して居るであらうか。併し乍ら、人間には、內面的生活、換言すれば精神的生活があつて、この點が彼等の生活に比し遙かに價値あり意義ある生活たる所以である。こゝに衲のいふ精神的生活とは、世間の煩累を避け、世間を白眼視して、山林に遁るゝ如き隱遁生活を指すものでは無い。かくの如きは、衲のいふ精神的生活とは相反するものであつて、まことに無意義極まる生活である。見よ、釋尊は、生老病死の四苦(約言せば生死の二つ)に深憂を發せられ、奮然、出家して、苦行六年、豁然として大悟せらるゝや、再び、俗世間に歸つて、南船北馬、縱說竪說、三百餘會の說法に寧日なかつたでは無いか。世界は成住壞空、人間は生老病死、この四つによつて、時々刻々、流轉變化しつゝある。晨の紅顏も夕べには忽ち白骨となる。露の如く亦た電の如し。果敢ないのが現世の狀態である。
  translation: '物質を軽く見ることはできない。しかし私たちは、物質的な生活だけで満足して、精神的な生活をなおざりにすることもできない。


    もし「自分は物質的な生活だけで満足だ」という人がいるなら、私はその人に向かって、「あなたの生活は、多少の程度の違いこそあれ、牛や馬や犬や猫と同じだ」と、ためらわずに断言する。


    人間は万物の霊長を自称しているが、それは人間自身が勝手に言っているだけだ。牛や馬や犬や猫は、それぞれ自分こそ万物の霊長だと思っているかもしれない。物質的な生活なら、鳥や獣も営んでいる。いや、庭に茂る植物も、春の花も秋の紅葉も、そのほか、ほんの小さな塵一つに至るまで、みな同じように営んでいる。


    そうであるなら、私たちがどれほど「万物の霊長だ」と独りで力んでみても、私たちの生活とそれらの生活に、何の違いがあるだろう。私たちの生活には、それらよりどれほど優れた価値や意味があるというのか。


    しかし人間には、内面的な生活、言い換えれば精神的な生活がある。この点こそ、人間の生活がそれらに比べて、はるかに価値と意味を持つ理由なのである。


    ここで私のいう精神的な生活とは、世間の煩わしさを避け、世間を冷たい目で見て山林へ逃れるような隠遁生活ではない。そんな生活は、私のいう精神的な生活とは正反対で、まったく意味のないものだ。考えてみなさい。釈尊は、生・老・病・死という四つの苦しみ、まとめれば生と死という二つに深く悩まれ、奮然として出家された。そして六年の苦行を経て、突然、深い悟りを開かれると、再び世の中へ戻り、船や馬で各地を巡り、あらゆる方面から教えを説き、三百回余りの説法の会を開いて、一日として安閑と過ごされなかったではないか。


    世界には、成立し、存続し、壊れ、空になるという四段階があり、人間には、生・老・病・死がある。この四つによって、絶えず移り変わり続ける。朝には血色のよかった顔も、夕方にはたちまち白骨になる。露のように、また稲妻のように、はかない。それが現世のありさまである。'
  notes:
  - 冒頭は前コマからの続き。
  metadata:
    printed_pages:
    - 2
    - 3
    image_checked: true
  sequence: 6
- id: zen-022-01
  scan: 22
  section: 生死は一如なり／一、眞の意義ある生活を
  original: 人は、この果敢ない短生涯にあつて、無限の生命と、寂然不動の境界とを攫得し、何等の苦悶なく、常に、歡喜と勇氣とに滿ちた精神をもつて、自己の本分を盡くしてゆく、そこに精神的生活が顯現し、人間生活の眞の意義を味はふことが出來るのである。
  translation: 人は、このはかない短い生涯のうちに、限りない生命と、静かで揺るがない境地をつかみ、何の苦しみもなく、いつも喜びと勇気に満ちた心で、自分の務めを果たしていく。そこに精神的な生活が現れ、人間として生きることの本当の意味を味わえるのである。
  notes: []
  metadata:
    printed_pages:
    - 4
    - 5
    image_checked: true
  sequence: 7
- id: zen-022-02
  scan: 22
  section: 生死は一如なり／二、吾人は大生命の一部分
  original: 二、吾人は大生命の一部分扨て、吾人が「生」といふのは何を意味するものであらう。吾人の生命が即ち生である。一般世間の見解では「母の胎內から出で、此世の光に浴した時に始まり、棺に收つて地下に入るに終る。」その間をいふのであるが、衲共に於ては、そんな果敢ない生命をもつて生命とはしない。佛教の說くところに依ると、吾人の生命は、無限であり、無窮である。無始劫來から盡未來際に至つて、永久無限に相續する。無始無終、一もつて貫き、千態萬狀の中に自己を認める、これが吾人の生命である。我れ〳〵が朝から晩まで、終日、一生懸命に活動して、夜、歸つて、疲れを休める。翌朝は、更らに勇氣を盛り返して、又た一生懸命の活動をする。かくの如く、每日繰返して活動をする。これが生命の力である。かくの如く觀察したならば、宇宙間の森羅萬象は、悉く、生命の變態である。峨々として聳ゆる山、洋々として湛える海水、死物の如き岩石、翠綠滴る靑葉、空飛ぶ鳥、水に泳ぐ魚、それ等が、すべて、その儘、自己の生命であつて、從晝至夜、間斷なく活動してをるのである。して見ると、この宇宙間は、統一あり、秩序ある、連鎖の如き、網の目の如き、始めの端緖を見出し得ざると共に、終りの極處も見出し得ざる、一つの大生命の窮まりなき連續である。吾人々類は、此の大生命の一部分として、現在、此處に此のやうな相をして現はれてをるのである。
  translation: '二　私たちは大きな生命の一部分


    さて、私たちのいう「生」とは、何を意味するのだろう。私たちの生命、それが生である。世間一般では、「母の胎内から出て、この世の光を浴びたときに始まり、棺に収まって地中に入るときに終わる」、その間をいう。しかし私たちは、そのようなはかないものだけを生命とは考えない。仏教の説くところでは、私たちの生命は無限であり、果てがない。始まりをさかのぼれない遠い昔から、未来の果てまでも、永遠に途切れず続く。始めも終わりもなく、一つのものとして貫かれ、千変万化する姿の中に自己を認める。それが私たちの生命である。


    私たちは朝から晩まで、一日じゅう懸命に働き、夜には帰って疲れを休める。翌朝にはまた勇気を奮い起こして、懸命に働く。このように毎日、活動を繰り返す。それが生命の力である。


    このように見るなら、宇宙にあるすべてのものは、生命が姿を変えたものだ。高くそびえる山、広々と水をたたえる海、死物のように見える岩石、滴るように緑の濃い青葉、空を飛ぶ鳥、水を泳ぐ魚。そのすべてが、そのまま自分の生命であって、昼から夜へと、絶えず活動している。


    そう考えると、この宇宙は、統一と秩序を持ち、鎖のように、網の目のようにつながっている。その最初の端も、最後の果ても見いだせない、一つの大きな生命の限りない連続なのである。私たち人類は、その大きな生命の一部分として、今、ここに、このような姿で現れているのだ。'

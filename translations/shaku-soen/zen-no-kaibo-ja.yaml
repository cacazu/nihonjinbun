  section: 驢を渡し馬を渡す／五、雲は天に、水は瓶に
  original: '五、雲は天に、水は瓶に


    すべて、禪家の商量は、道でも橋でも石ころでも、一草一木、何んでも構はぬ、其の場にあるものを直きに捕へて宗旨を全提するので、これは禪宗の特色である。必らずしも、神とか、佛とかを借りて來なければならぬと云ふことは無い。手に委せて其場のものを應用するのである。だから、故人も、「拈じ來つて着々親し」と云つて居られる。決して、遠方に求めず、其場〳〵の事物に即して親しく拈じ行くところに禪宗の面白味があるのである。以上、述べた趙州と僧との商量で、概略、その事は明らかであらうと思ふが、李翱と藥山との商量の如きも同じく其れである。李翱は、唐代の大儒であるが、或時、藥山禪師を訪ねたことがある。丁度、藥山は讀經でもして居つたとみえて、口の中をモグ〳〵させて居つた、その樣子が、如何にも芋堀坊主らしかつたので、李翱は腹の中で輕蔑した、こんな詰らぬ坊主が藥山かと、袖振り拂つて出て行かうとすると、藥山は、ちよつと振り返つて、「汝、何ぞ耳を尊んで身を卑しむ」'
  translation: '五　雲は天に、水は瓶に


    禅の問答はすべて、道でも橋でも石ころでも、一草一木でも、何でもかまわない。その場にあるものをすぐにとらえて、教えのすべてを示す。これは禅宗の特色である。必ずしも神や仏を持ち出す必要はない。自在に、その場のものを活用するのである。だから昔の人も、「取り上げれば、どれもぴたりと身近なものだ」と言っている。遠くへ求めず、その場その場の事物に即して、親しく取り上げていくところに禅宗の面白さがある。

    以上に述べた趙州と僧の問答で、そのことはおおよそ明らかになったと思うが、李翱と薬山の問答も同じである。李翱は唐の時代の大儒学者である。あるとき薬山禅師を訪ねた。ちょうど薬山は読経でもしていたらしく、口をもぐもぐ動かしていた。その様子がいかにも田舎くさい坊主に見えたので、李翱は心の中で軽蔑した。「こんなつまらない坊主が薬山なのか」と、袖を振り払って出ていこうとした。すると薬山は、ちょっと振り返って、「お前はどうして、耳に聞いた評判を尊び、目の前のこの身を卑しめるのか」と'
  notes:
  - 末尾の引用を受ける地の文はscan63へ続く。

  original: '來ますまい」

    と云ふと、上人は、

    「それは、人民を責める必要はない。執權者それ自身が欲を去れば宜しい」

    と言はれたと云ふことである。これは、華々しい舞臺に現はれたことで無く、北條氏の善政を布いた樂屋の苦心である。

    それから、泰時から轉じて、時賴も、尊王心の深かつたことは、世人の知るところであらう。單に、尊王心が深かつたばかりで無く、國家人民、安かれかしと云ふので、最も治世に意を用ゐて居つたことも、世人周知のことであらう。

    古くから、今日まで、非凡な政治家は、隨分、有つたと思ふが、古い時代では、時賴の如き、たしかに其の一人で、稗史の傳ふるところに據れば、時賴は、一處不住の雲水に身を窶して、六十餘州を囘國して歩いて、民情を視察したと云ふことである。

    今日では、大官連が、地方へ出てくると、意氣揚々として、觀察の美名の下に、大騷ぎをさせる。然るに、時勢が違ふとは云へ、輕裝孤笻、飄然として、身を雲水に窶して、日本六十餘州の民情を視察して歩いたと云ふが如きは、何處へ出しても立派なものである。

    その時賴は、如何にして精神を修養したかと云ふに、先づ、一國の人民をして、武士道的精神を旺んならしめ、日本魂を發揮し、元氣あらしむるには、先づ以て、自分自身を鍛へねばならぬと、はじめて、此の佛法へ入つて、さうして、久しく參禪したので、最初の師は、誰れかといふと、禪宗の中でも、曹洞宗の開山たる道元禪師であつた。

    彼の道元禪師が新たに支那から御歸りになつて、都會の風塵を避けて、越前の傘松の里に庵を結んで居られた當時、時賴公は、其の道名、嘖々たるを聞いて、禪師を鎌倉に迎へて、我が館に半年餘りも御留め申しておかれた。丁度、年號から云ふ'
  translation: 'ますまい」といった。すると上人は、

    「そのことで人民を責める必要はありません。執権であるあなた自身が欲を捨てればよいのです」

    といったという。これは華々しい表舞台に現れたことではなく、北条氏が善政を行うために、舞台裏で払った苦心である。

    次に泰時から時頼へ話を移す。時頼も天皇を尊ぶ心が深かったことは、世間によく知られているだろう。そればかりでなく、国と人民が安らかであるようにと願い、世を治めることに最も心を尽くしていたのも、周知のことだろう。

    昔から今日まで、非凡な政治家はずいぶんいたと思うが、古い時代では時頼は確かにその一人である。民間の歴史物語によれば、時頼は一か所にとどまらない修行僧に姿を変え、全国六十余州を巡って、人々の暮らしを視察したという。

    今では高官たちが地方へ来ると、意気揚々として、視察という立派な名目のもとに大騒ぎをさせる。それなのに、時代が違うとはいえ、軽い身支度で一本の杖をつき、ふらりと修行僧の姿になって全国の人々の暮らしを見て歩いたというのは、どこに出しても立派なことだ。

    では、その時頼はどう精神を修養したのか。国民の武士道精神を盛んにし、日本魂を発揮させ、活力を与えるには、まず自分自身を鍛えなければならないと考え、仏道に入って長く参禅した。最初の師は誰かといえば、禅宗の中でも曹洞宗の開祖である道元禅師だった。

    道元禅師が中国から帰り、都会の騒がしさを避けて越前の傘松の里に庵を結んでいたころ、時頼公は、その道における名声が高いのを聞き、禅師を鎌倉に迎え、自分の館に半年余りもとどまっていただいた。年号でいえば、ちょうど'

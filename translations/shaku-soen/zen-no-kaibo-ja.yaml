  section: 隱德を積め／二 司馬溫公の家訓
  original: 力を出しても、世間で見てくれぬと不平らしい顏をするのが世の常である、緣の下の力持ちたることは容易にしない。扨て、仕事の中でも、慈善は、頗る結構なことであるが、慈善の名の下に、僞善といふやうなことを働いて居る人が無いでも無いやうであるが、尠くとも、かう云ふ事をしたら何ういふ報いが來るといふやうなことは皆な考へて居るであらうと思ふ。衲自身が、これ〳〵の善いことをしてをるが、世間の人は見てくれぬと云ふやうな考へが、時に、心頭に浮ぶことがある。けれども、これらは、宗敎家として濟まぬことゝ考へ直すのである。自分が左うであるから、人も左うだと思ふのは失敬であるが、敢て衲ばかりで無く、世間には其んな考へを起す人は多數にあらうと思ふ。右の手で物を遺ると、左の手に返禮を攫まうと思つて居る人がありはせぬであらうか。今更ら言ふまでもなく、隱れて善いことをするのが陰德である。陰德の文字の出所は幾らもあるやうであるが、司馬溫公の家訓の中にあるのが、最も平易で、陰德に近い言葉であらうと思ふ。それは斯うである。「金を積んで以て子孫に貽す、子孫、未だ必ずしも之れを守らず。書を讀んで以て子孫に贈る、子孫、未だ必ずしも之れを讀まず。如かず、陰德を冥々のうちに積んで、以て子孫長久の計を爲さんには。」頗る名言であらうと思ふ。此の陰德といふことが、前に述べた家屋の礎即ち、緣の下の力持ちに當て箝るのである。陰德を語るなどは、時代おくれの說のやうであるが、陰德といふやうな意味のことが、今は、社會の人々から、忘れられんとして居るでは無からうかと思ふ。或ひは、既に、忘れられて居るかも知れぬ。
  translation: '力を出しても、世間が認めてくれないと不平そうな顔をするのが世の常であり、縁の下の力持ちになるのは容易ではない。

    さて、仕事の中でも慈善はたいへん立派なことだが、慈善の名の下に偽善とでもいうことをする人がいないわけではなさそうだ。少なくとも、こういうことをしたらどんな報いが来るだろう、といったことは、誰もが考えているのではないかと思う。

    私自身、これだけ善いことをしているのに、世間の人は認めてくれない、という考えが、ときに心に浮かぶことがある。しかし、これは宗教家として許されないことだと思い直す。自分がそうだから他人もそうだと思うのは失礼だが、私だけでなく、世間にはそんな考えを起こす人が大勢いるだろう。右の手で人に物を与えながら、左の手ではお返しをつかもうと思っている人もいるのではなかろうか。

    今さらいうまでもなく、人に知られず善いことをするのが陰徳である。「陰徳」という言葉の出所はいくつもあるようだが、司馬温公の家訓にあるものが、最もわかりやすく、陰徳の意味をよく表していると思う。それはこうである。

    「金をためて子孫に残しても、子孫が必ずそれを守るとは限らない。書を読んで子孫に贈っても、子孫が必ずそれを読むとは限らない。人に知られないところで陰徳を積み、子孫が末長く栄えるための計らいとするのに及ぶものはない。」

    たいへんな名言だと思う。この陰徳こそ、先に述べた家の礎石、つまり縁の下の力持ちに当たる。陰徳を語るなど時代遅れの説のようだが、今は陰徳の意味することが、社会の人々から忘れられようとしているのではないか。あるいは、すでに忘れられているのかもしれない。'
  notes:
  - 司馬温公は司馬光。「書を讀んで以て子孫に贈る」は本書の文言に従って訳した。
  - 冒頭は前スキャンから続く。

  original: ともあらうが、何時か必ず天理の正しさに反つて、それ丈け苦痛を覺えねばならぬ時が到達するのである。
  translation: ともあるだろうが、いつか必ず、天理の正しさが現れ、それに応じた苦痛を味わわなければならない時が来るのである。

  section: 信の一字／三、美花は汚土に生ず
  original: '三、美花は汚土に生ずかくの如く、絕對的信仰の基本からして、この現實世界が、理想化、即ち、娑婆即寂光淨土といふ信仰的大光明の狀態が顯はれる。信するの一念存すれば、此の娑婆が寂光淨土といふことが出來る。この心あるが故に、煩惱ながらに道心になり、鐵を變じて黃金となし得る。煩惱即菩提、煩惱を菩提の種とすることが出來る。田の草を採つて其儘に其れを肥料にすることが出來る。佛教上の言葉で、悟りとか、大安心とか、大立命とか云ふのであるが、凡そ活きたる信仰の眼を開いて見ると、こゝに煩惱即菩提の光明を認められる。美しい花は、乾きたる土地には生えない、汚土の圃中から花も咲き、實も育つ。水に譬へて「信」を咏ぜられた古德の偈がある。菩薩淸凉月　畢竟現於空

    衆生心水淸　菩提影中現といふのである。水か、月か、一つにして二つ、二つにして一つ、一とも言へず、二ともつかず、佛心を此方に受け取れば、信の一字に外ならぬ。尙ほ、深刻に言へば、月影は濁つてゐる水にも、淸き水にも、同樣に宿つてゐる。月影は、泥水にも、如何なる水にも映る。佛の心は、罪ある者にも、如何なる者にも、其影を宿すのである。古人の歌に、世の中に惡しと思ふものぞなき罪ある身こそ猶ほあはれなる濁りたる水にも影をやどすかな月のこゝろの廣澤の池といふのがあるが、此の心持ちを能く現はして居る。商工道德の上から見ると、我'
  translation: '三　美しい花は汚れた土に生える


    このように、絶対的な信仰を土台にすると、この現実世界が理想の世界となる。つまり、この苦しみの世界が、そのまま仏の清らかな世界となるという、信仰の大きな光が現れる。信じる一念があれば、この娑婆世界がそのまま寂光浄土だといえるのだ。この心があるからこそ、煩悩はそのまま道を求める心となり、鉄を黄金に変えることができる。煩悩がそのまま悟りとなり、煩悩を悟りの種にできるのである。田の雑草を抜いて、そのまま肥料にするようなものだ。仏教では、悟り、大安心、大立命などというが、生きた信仰の目を開いて見れば、そこに煩悩がそのまま悟りになる光が見える。美しい花は、乾ききった土地には生えない。汚れた土の畑からこそ、花も咲き、実も育つのだ。


    昔の高僧に、水にたとえて「信」を詠んだ偈がある。


    「菩薩の清らかで涼しい月は、ついには空に現れる。

    人々の心という水が清らかなら、その中に悟りの影が映る。」


    水なのか、月なのか。一つであって二つ、二つであって一つ。一つとも二つとも言えない。仏の心をこちらで受け取れば、それは「信」の一字にほかならない。さらに深く言えば、月の影は、濁った水にも清らかな水にも、同じように宿っている。泥水でも、どのような水でも、月影は映る。仏の心も、罪のある者にでも、どのような者にでも、その影を宿すのである。古人の歌に、


    「世の中に、悪いものだと思うものなどない。罪ある身こそ、いっそういとおしい。」

    「濁った水にも姿を映すのだな。月の心の広さよ、この広沢の池よ。」


    というものがあるが、この心持ちをよく表している。商工業の道徳という点から見ると、日本'

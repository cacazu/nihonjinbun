    隱れて仕事をするのは、なか〳〵至難のことで、今ま斯くいふ衲が、何うかと云ふと、なか〳〵左うは行かぬのである。僅かばかりの善事をしても、僅かばかりの'
  translation: '二　司馬温公の家訓


    人に知られず仕事をするのは、なかなか難しい。今こういっている私自身はどうかというと、そうはいかないのである。ほんのわずかな善いことをしても、ほんの少しの'

  section: 中澤道二翁の敎訓
  original: また、左うしたものでもあるまい。そこは、娘御の心一つで、善くもなれば惡しくもなる。こゝは御遣りになるもよからうが、先づ、何は兎もあれ、娘御の心得が大事で御座るが、娘御は、全體、どう心得て往かうと思はれるか」と問はれたから、娘は、少し赤らみながら、手を突いて、「ハイ、私が心得と申しまして、唯今、かうと云ふ考へも浮びませぬが、先方へ參りましたならば、舅姑御を大切にして十分に孝行を盡くし、又た、小舅小姑には唯だ〳〵信實を以て接し、三人の繼子は我子の如く可愛がりましよう」と云ふと、翁は、娘の顏をジツと視て、「それは以てのほかの心得ちがひが御座る。そのやうな心得では、とても此緣は長久はしませぬ。これ母御、此の緣談は、まあ止めにせられるがよい」と云はれるから、娘も母も膽を潰してしまつた。「左樣なれば、如何心得てまゐりましたもので御座いませうか」と訊くと、翁は、「云つて聞かすは易いことだが、こゝは娘御が一生の身の落ち着きになる大事のところぢや。一通り聞いたくらゐの事では、なか〳〵間に合はぬ。まア篤と考へられて見られるがよい。母御も共々に考へて見て遣らつしやれ。その上で、いよ〳〵此うと決定つたら、又た重ねて相談に連れて御座れ」と云はれるから、「左樣なれば、歸りまして、篤と考へました上で、又た御伺ひいたしませう」其日は、それで歸つた。それから三四日經つと、又た母親に連れられて翁を訪ねた。母親は翁に向つて、「此間は、娘が心得方は甚だ善うないと仰せられましたが、どうやら其合點が行つたと娘も申しますので、今日、又た連れて上りました。何うぞ、今ま一應、お聞きなされて下さいませ」
  translation: 'そうとも限りますまい。それは娘さんの心一つで善くもなれば悪くもなる。嫁がせてもよかろうが、何はともあれ、娘さんの心構えが大事です。娘さんは、いったいどんな心構えで行こうと思っていますか」

    と尋ねた。娘は少し顔を赤らめながら、手をついて、

    「はい、私の心構えと申しましても、今はっきりした考えは浮かびませんが、先方に参りましたら、舅さま姑さまを大切にし、十分に孝行を尽くし、夫の兄弟姉妹にはひたすら真心をもって接し、三人の子どもは自分の子のようにかわいがろうと思います」

    といった。すると翁は娘の顔をじっと見て、

    「それはとんでもない心得違いです。そんな心構えでは、とてもこの縁は長続きしません。お母さん、この縁談はひとまずおやめになるのがよい」

    といったので、娘も母も肝をつぶしてしまった。

    「それでは、どんな心構えで参ればよいのでしょうか」

    と聞くと、翁は、

    「いって聞かせるのは簡単だが、これは娘さんが一生身を落ち着ける大切なことです。一通り聞いたくらいでは役に立ちません。まず、よくよく考えてみるのがよい。お母さんも一緒に考えてやってください。その上で、これだと心が決まったら、もう一度、相談に連れておいでなさい」

    という。そこで、

    「それでは帰って、よく考えた上で、またお伺いいたしましょう」

    といい、その日は帰った。

    三、四日たつと、また母に連れられて翁を訪ねた。母親は翁に、

    「先日は、娘の心構えがたいへんよくないとおっしゃいましたが、そのわけがどうやらわかったと娘も申しますので、今日また連れて参りました。どうぞ、もう一度お聞きくださいませ」'

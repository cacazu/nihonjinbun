  section: 大なる樂觀の上に／二、四苦八苦の人生
  original: '二、四苦八苦の人生


    扨て、各人には、それ〳〵欲望といふものがある。この欲望を有するといふことは、必ずしも、罪惡であると斷ずるわけに行かぬ。なぜなれば、この欲望は、これを惡用するからこそ貪慾といふ忌むべきの狀態を呈するのであるが、若し、これを善用したならば、意志の力となつて、國家、社會の爲めに、貢獻し得る事業の原動力となるからである。

    欲望にも、いろ〳〵あるが、その中でも、知識欲、生存欲、名利欲は、最たるものである。知識欲といふのは、何事に限らず、知り度いと願ふ欲望であつて、これは誰れでも自分を一寸省みると分ることであるが、例せば、嬰兒などが、おひ〳〵'
  translation: '二　四苦八苦の人生


    さて、人にはそれぞれ欲望がある。欲望を持つことを、必ずしも罪悪だと決めつけるわけにはいかない。なぜなら、欲望は悪用するからこそ、貪欲という忌まわしい状態になるのであって、よく用いれば意志の力となり、国家や社会に貢献する事業の原動力となるからである。

    欲望にもいろいろあるが、なかでも知識欲、生存欲、名利欲が主なものである。知識欲とは、どんなことでも知りたいと願う欲望である。誰でも少し自分を省みればわかることだが、例えば幼い子供が次第に'
  notes:
  - 末尾はscan76の子供の知識欲の説明へ続く。

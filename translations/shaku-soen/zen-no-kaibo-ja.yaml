  section: 隱德を積め／四 佛敎の謂ゆる無我
  original: 激しい世の中に、とても役に立つもので無い。凡そ、成功の第一義は、我れを充實しなければならぬといふ、人があるが、それは、其の一を知つて、其他を知らぬといふものである。佛敎で「無我」といふのは、小さな我れを捨てゝ、大なる我を認めよと言ふので、たとへば、家の爲めだと考へた時は、自分一箇の我れを棄て、國の爲めだと考へたら、我が家をも棄てなければならぬ。尙ほ、一層、大きく、世界の爲めだと考へたら、或は國を滅すといふことも辭せない。さうして、正義、人道、博愛の下に、驚天動地の働きをせんければならぬと言ふやうなこともある。今ま云ふ緣の下の力持ちを遣らうといふは、これ丈けでは、まだ、十分に意味が現はれぬか知らぬが、無我の我れ-さう云ふことは哲學的で六ケ敷いが、小さな我れを棄てゝしまつて、大なる我れにしたところの我れ-即ち、雜誌記者などの仕事でも左うだ。一寸見では何んでも無いやうであるが、その記事の如何んによつて、多くの讀者の心に大なる影響を及ぼすといふ大なる觀念を以て行つて居れば、これ、即ち、神佛の心を我れに體現したと云つても可いのである。
  translation: '激しい世の中で、とても役に立たない。そもそも成功するために第一に必要なのは、自我を充実させることだ」という人がある。しかしそれは、一つだけを知って、そのほかを知らないというものだ。仏教で「無我」というのは、小さな自己を捨てて、大きな自己を認めよというのである。たとえば、家のためだと考えたときは、自分一人の我を捨て、国のためだと考えたら、自分の家さえ捨てなければならない。

    さらに一段大きく、世界のためだと考えたら、場合によっては国を滅ぼすことさえいとわない。そして正義、人道、博愛の下に、世を驚かす大きな働きをしなければならない、ということもある。

    今いっている、縁の下の力持ちになろうということは、これだけではまだ十分に意味が伝わらないかもしれない。無我の我――こういうと哲学的で難しいが、小さな自己を捨て、大きな自己になったところの自己である。雑誌記者などの仕事もそうだ。一見、何でもないようだが、その記事の内容によって、多くの読者の心に大きな影響を及ぼすのだ、という大きな考えで行っていれば、神仏の心を自分に体現したといってもよいのである。'
  notes:

- id: zen-087-01
  scan: 87
  section: 禪と鎌倉武士／三、禪宗は何んであるか
  original: 'と答へられた古德もあるし、また、

    「麻三斤」

    と答へられた古德もゐるし、また、

    「乾屎橛」

    と答へられた古德もある。

    かくの如く、鎌倉時代の佛教は、何れも直截簡明を貴びて、時代人心の要求に應じて起り、他力と云はず、自力と云はず、恰も寸鐵人を殺すの概がある。此の活力あり、生命ありて、宇宙の根本に接觸し、人生の眞歸趣を指示するものを衲は禪といふのである。

    されば、佛教各宗には、孰れも禪といふ意義を備へて居らぬ宗旨は一つも無いのである。各宗それ〳〵の堂奧に入つたら、必ず、禪に歸すると思ふ。敢て、必ずしも禪宗として成り立つて居る我れ〳〵の宗派の途轍の如くならなければならぬと云ふのでは無い。

    此の前の世界的戰爭について、我れ〳〵の如き學問のない者でも、實物教育で、いろ〳〵のことを見せられた。平素、富の高さと、兵の强さを以て、內外より信ぜられて居つた國が、偖て、兵端を開いて見ると、存外、左うでも無いやうな國があるかと思へば、一方には、夕べ見た夢が、一朝、覺めたやうに、ロマノフ朝庭がモロクも覆つてしまつて、新たに無產黨共和政府が起つた。

    それから、これは、今度の戰爭によつて新たに起つたわけでは無いが、隣邦の支那はどうか。また、今度の戰爭の導火線になつた、塞耳亞は何うか。白耳義は何うか。だん〳〵其國について見ると、我れ〳〵が平時に於て考へて居つたのと、今の實際とは、餘程、思ひ違ひがあつた。

    我れ〳〵素人は勿論ではあるが、其の玄人と稱する經濟家、政治家に於ても、大變な思ひ違ひがあつたと思ふ。此の戰爭について、各國それ〳〵長所も現はし、'
  translation: '答えた昔の高僧もいる。また、「麻、三斤だ」と答えた人もいれば、「糞をぬぐう乾いた棒だ」と答えた人もいる。

    このように、鎌倉時代の仏教は、どれも直接的で簡明なことを尊び、その時代の人々の求めに応じて起こった。他力であろうと自力であろうと、短い刃物が一撃で人を倒すような、鋭い力がある。この活力と生命を備え、宇宙の根本に触れ、人生が真に帰着するところを指し示すものを、私は禅と呼ぶのである。

    したがって、仏教の各宗には、禅という意味を備えていない宗旨は一つもない。それぞれの宗派の奥深いところへ入れば、必ず禅に帰着すると思う。だからといって、必ずしも禅宗という宗派をなしている私たちと、同じやり方にならなければならない、というのではない。

    先の世界的な戦争では、私たちのように学問のない者も、実物を教材として、さまざまなことを見せられた。平時には豊かな富と強い軍隊によって内外から信頼されていた国が、戦争を始めてみれば、意外にそうでもない場合があった。その一方で、昨夜の夢から朝に目覚めるように、ロマノフ王朝がもろくも倒れ、新たに無産政党による共和政府が生まれた。

    また、これは今度の戦争によって新たに起こったことではないが、隣国の中国はどうか。今回の戦争の導火線となったセルビアはどうか。ベルギーはどうか。それぞれの国を見ていくと、平時に私たちが考えていたことと、現在の実際の姿との間には、大きな思い違いがあった。

    私たち素人はもちろんだが、専門家と称する経済家や政治家にも、大変な思い違いがあったと思う。この戦争では、各国がそれぞれ長所を現し、'
  notes:
  - 「世界的戰爭」は文脈上、第一次世界大戦。「支那」「塞耳亞」「白耳義」は中国・セルビア・ベルギーとした。
  - 「乾屎橛」は一般に、排泄後に用いる棒と解される禅語。公案そのものを通常の概念の説明に還元しないように訳した。
  - 末尾はscan88へ続く。

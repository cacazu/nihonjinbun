  original: 家庭教育や、學校教育には、殊に注意を要する點で、形や言葉の末に拘泥しては不可ない。宜しく身を以て人に示さねばならぬと思ふのである。一家の長たる主人に此の心掛けが有つたならば、別に八ケ間敷く理窟を言はいでもよい。子弟は自然に神佛を拜するやうになるのである。
  translation: 家庭教育や学校教育では、とくに気をつけるべき点です。形や言葉の細かなところにとらわれてはいけません。自分の行動で人に示すべきだと思います。一家の長である主人にこの心構えがあれば、うるさく理屈をいわなくてもよい。子どもたちは自然に神仏を拝むようになるのです。

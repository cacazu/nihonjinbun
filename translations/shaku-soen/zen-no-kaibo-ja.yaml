  section: 禪と鎌倉武士／四 確乎不拔なる中心
  original: 'ろに依れば、英國の敵は獨逸でもない、其他の國でもない。何が英國の敵かと云ふと、英國の敵は英國の富であると云ふのである。

    聞きやうによつては、如何にも矯激の言葉のやうであるが、決して、左うでない。衲に云はしむれば、今日の日本の敵は、何んであらう。敵國外患なき者は其國亡ぶ。常に、敵を假想して居らねばならぬ。今日、日本の敵は、獨逸でも、英國でも、米國でも、世界の何れの國でもない。政治界から見て、經濟界から見て、敢て血流しの戰爭する計りでなく、我れ〳〵の敵が我れ〳〵の周圍を取り卷いて居る。'
  translation: 'よれば、イギリスの敵はドイツでも、ほかの国でもない。では何が敵なのかというと、イギリスの富そのものが敵だというのである。

    聞きようによっては、いかにも極端で激しい言葉のようだが、決してそうではない。私にいわせれば、今日の日本の敵は何だろうか。「敵国も外からの災いもない国は滅びる」という。常に敵を想定していなければならない。今日、日本の敵はドイツでも、イギリスでも、アメリカでも、世界のどの国でもない。政治や経済の面から見れば、血を流す戦争をする相手だけが敵なのではなく、私たちの敵は私たちの周囲を取り巻いている。'
  notes:
  - 冒頭はscan88末「…云ふとこ」から続く。
  - 冒頭は前コマから続く。

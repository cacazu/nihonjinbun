  section: 智情意の三修養／五 强き意志の力を
  original: '五、强き意志の力を


    次ぎは意的修養であるが、これは意志の方である。換言すれば、「心の力」のことである。如何に智慧があつても、情が麗はしくても、此の意志の力といふものが無ければ、すべて無駄になつてしまふ。故に、智慧が頭であるならば、情は胸である。そして意志は恰も二本の足のやうなものである。何にか一つ善いことを爲ようといふ目的を定めたならば、千里の遠きも一歩より始まるで、外物に目を觸れず、一心不亂に進んで行くのである。それは、皆な、意志の力である。近頃、流行する腹式呼吸の如きも、每日、缺かさず遣るのは、隨分、六ヶ敷い。冷水摩擦も一ケ月や二ヶ月は出來るが、それ以上は、なか〳〵續かぬ。ところが、意志の力を以てすれば、かやうな事は、容易く續けることが出來る。此の意志的修養は、我れ〳〵に於て最も必要なことであると思ふ。一つの仕事を仕遂げようとするには、何うしても意志の力が强くなければ出來ぬ。今日、人と人、國と國と、相對してをる以上は、一箇人の意志、國家の意志、又たは社會の意志、群集的意志といふものが、堅實に鍛へ上げられなければならぬ。優勝劣敗といふ熟語は、多少の語弊があるやうであるが、確かに一つの眞理である。何うしても、人間は、努力せねばならぬのである。我れ〳〵は何處までもストラツグルせねばならぬ運命を有してをる。今の生存競爭の世の中に立つては、努力'
  translation: '五　強い意志の力を


    次は意志の修養である。言い換えれば「心の力」を養うことである。どんなに知恵があり、感情が美しくても、この意志の力がなければ、すべて無駄になってしまう。

    だから、知恵が頭であるなら、感情は胸であり、意志はちょうど二本の足のようなものだ。何か一つ善いことをしようと目的を定めたなら、千里の遠い道も一歩から始まるのであって、ほかの物に目を向けず、一心不乱に進んでいく。それはすべて意志の力である。

    近ごろ流行する腹式呼吸なども、毎日欠かさず行うのはずいぶん難しい。冷水摩擦も、一か月や二か月はできるが、それ以上はなかなか続かない。ところが意志の力を用いれば、こうしたことはたやすく続けられる。この意志の修養は、私たちにとって最も必要なことだと思う。

    一つの仕事をやり遂げるには、どうしても意志の力が強くなければできない。今日、人と人、国と国が向かい合っている以上、一個人の意志、国家の意志、社会の意志、集団の意志というものを、しっかり鍛え上げなければならない。

    「優勝劣敗」という言葉には多少の語弊もあるようだが、確かに一つの真理である。どうしても人間は努力しなければならない。私たちは、どこまでも奮闘しなければならない運命を持つ。今の生存競争の世に立つなら、努力'
  notes:
  - 末尾は次スキャンへ続く。

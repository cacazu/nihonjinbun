  section: 暗夜に靈光を
  original: 'があらう。而かも、初めは、まことに微なる光であつて、有るか無きかの燈光を遙かに望んで進むやうに、この良心・良知・良能の光を辿つて進んで行けば、やがて、後には、天・神・佛の全體を認め得られるやうになる。さうなれば、坦々として長安に通ずる大道に出られて、まことに、自由安樂の思ひがあるであらう。

    だから、自分が人事を盡くして及ばないところは、天に任せよ、神に任せよ、佛に任せよといふのは、各人が、各人の心中に潜むところの、良心、良知、良能に任せよといふ意味に外ならぬ。'
  translation: 'がするだろう。しかも初めは、実にかすかな光である。有るか無いかの灯火を遠くに見ながら進むように、この良心、良知、良能の光をたどっていけば、やがて天・神・仏の全体を認められるようになる。そうなれば、平らかに都の長安へ通じる大道に出たように、まことに自由で安らかな気持ちになるだろう。

    だから私が、人としてできることを尽くしても及ばないところは、天に任せ、神に任せ、仏に任せよというのは、それぞれ自分の心の中に潜む良心、良知、良能に任せよ、という意味にほかならない。'

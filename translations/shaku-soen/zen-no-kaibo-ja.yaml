  section: 無邊の風月／六、瑞巖和尙の自問自答
  original: 「主人公」と呼びかけ、また、自ら、「諾」ハイと答へ、重ねて、「惺々着」ハツキリ醒めて居るかと訊ね、また、自ら、「諾」ハイ醒めて居りますと答へ、更らに、「他時異日、人の瞞を受くる莫れ」と警めておいて、また、「諾々」ハイ〳〵と答へて點頭されたといふことである。即ち、一人、磐石上に坐して、終日、愚の如く靜坐工夫をせられ乍ら、かくも自問自答してをられたのである。「惺々」とは、もう徹底的にハツキリと醒めたやうに、能く萬象を照すが如くなる境界である。「着」は唯だ「惺々」の意味を强める爲めに使つたので、謂ゆる、自己も、主人公も、玆に至つては、共に惺々である。唯だ一つである。こゝに至らば、天地法界、惺々着である。而して、他を謾し、自らを謾する兩般もなければ、他の人の瞞を受くることも無いのである。醒めて居るか何うか、主人公は居るか、といふやうに始終心そのものに氣をつけて修養をつゞけて行つたならば、何時なん時、主人公と呼んでも、「諾々」と云ひ得ることが出來る。內に向つて尋ねることに於ては、玆に何んの理窟も何もさうはさむ餘地はない。天地一乾坤、唯だ主人公あつて他に何にも無い。その主人公は、自ら「諾」と答ふるではないか。「門を叩けば處々人の譍ふるあり」だ。
  translation: '「主人公」

    と呼びかけ、また自分で、

    「はい」

    と答え、重ねて、

    「しっかり目を覚ましているか」

    と問い、また自分で、

    「はい、目を覚ましています」

    と答えた。さらに、

    「これから先、いついかなるときも、人にだまされるな」

    と戒めておいて、また、

    「はい、はい」

    と答え、うなずかれたという。つまり、一人で大きな岩の上に座り、一日じゅう愚かな人のように静かに坐って修行しながら、このように自問自答しておられたのである。


    「惺々」とは、徹底してはっきりと目覚め、万物を明らかに照らすような境地をいう。「着」は、ただその意味を強めるために添えたものだ。自己も主人公も、ここまで来れば、ともに明らかに目覚めており、ただ一つなのである。ここに至れば、天地のすべてが、はっきりと目覚めている。人をだますことも、自分をだますこともなく、他人にだまされることもない。


    目覚めているか、主人公はいるか、と、いつも心そのものに気をつけて修養を続けていけば、いつどんなときに「主人公」と呼ばれても、「はい、はい」と答えることができる。


    内へ向かって尋ねることには、理屈を差し挟む余地はない。天地宇宙の全体に、ただ主人公があるだけで、ほかには何もない。その主人公は、「はい」と答えるではないか。「門をたたけば、どこでも答える人がいる」のである。'

  section: 隱德を積め／五 千光祖師の慈悲
  original: 「私は、いくら稼いでも、貧乏で困ります。私一人ならば如何なる貧乏にも堪へられますが、家には、病氣の妻と、小供がありまして、此の五六日、食ふや食はずに居りますから、どうぞ御救ひを願ひます」と云つた。千光祖師は、これを聞かれて、可哀相とは思はれたが、扨て、直ぐに金を遣るといふ貯へもないので、近く金箔を塗つた佛さんが寺にあるのに思ひ付かれて、「お前が正直に稼いでも、そんなに困窮するなら、衲が救つてやる」と快く承諾され、「佛樣の金箔を剝いで持つて行け、お前が能く剝ぐことが出來んのなら、衲が剝いでやるから、それを賣つて一時の急を凌ぐがよい」と言はれた。ところが、弟子僧は驚いて、「如何に困窮して氣の毒とは言ふものゝ、佛さまの金箔を剝げとは、何んといふことで御座います、佛罸のほども怖しいでは御座いませぬか」と祖師に向つて言ふと、祖師は、「何に、佛罸が怖しいと、今ま、こゝに佛さまが居られて、困窮人の噺を聞かれたら、決して、棄てゝは置かれず、自分の金箔が何うならうと、必ず御救ひになるに相違ない。」と言つて戒められたと云ふことである。
  translation: '「私はいくら働いても、貧乏で困っています。私一人ならどんな貧乏にも耐えられますが、家には病気の妻と子どもがいて、この五、六日は食べたり食べなかったりの暮らしです。どうかお助けください」

    といった。千光祖師はそれを聞いて気の毒に思ったが、すぐに金を与えられるような蓄えもなかった。そこで、近ごろ金箔を塗った仏像が寺にあるのを思い出し、

    「お前が正直に働いてもそんなに困っているのなら、私が助けてやろう」

    と快く承知して、

    「仏さまの金箔をはがして持って行きなさい。うまくはがせないのなら、私がはがしてやる。それを売って当座の急場をしのぐがよい」

    といった。ところが弟子の僧は驚き、

    「どんなに困っていて気の毒だとはいっても、仏さまの金箔をはがせとは、何ということでございます。仏罰も恐ろしいではありませんか」

    と祖師にいった。すると祖師は、

    「何、仏罰が恐ろしいだと。今ここに仏さまがいて、困窮者の話をお聞きになったなら、決して放ってはおかず、ご自分の金箔がどうなろうとも、きっとお救いになるに違いない」

    といって戒めたということである。'

  section: 信の一字／二、信とは何ぞや
  original: と仰せられてある。まことに、恐れ多い御教訓であつて、我れ〳〵は、恭けなく拜載して居る。凡そ、信の一字は、神にも通じ、佛にも通ずる。これ有るが爲めに、國家社會は安らけく、世界は平和である。淺草の觀音樣に參詣して、多くの人々が佛前に祈りを捧げてゐる狀を目擊すると、一種の感懷が催される。これを、一口に、迷信なり、妄信なりと難ずる人もある。勿論、その祈るところは、家內安全、息災延命、病氣平癒、所願成就と、いろ〳〵雜多であらう。併し、其の願ふと云ふ其心は、絕對的の信心である。人と人との間に於ける信とは、何れも相對的のもので、絕對的のものでは無い。父母、兄弟、朋友、皆な相對的信である。此等の間には、皆な、何れも、我執が爲の邪念が存する。朋友と雖も、互ひに信ずる程度は絕對的では無い。然るに、神佛に對して祈る一念は、毫も僞りがなく、天眞流露、全心全身を捧げてゐる。即ち、絕對である。これを迷妄として一笑に附し去るが如きは心なきことである。淺草の觀音を拜むを見て、或者は、これを偶像崇拜なりとして、これを笑ひ、これを迷信妄信なりとして斥けるかも知れぬ。されど、かく排斥する當人も、既に一種の偶像崇拜者であることを知らぬのである。其の偶像は虛名といふ偶像、利慾といふ偶像、かゝる偶像を懸命に崇拜してゐる者である。滔々たる天下、悉く、名利、名聞の偶像を拜してゐる。豈に獨り下級の宗教のみを、偶像崇拜なり、迷信妄信なりとして、一笑に附することが出來得るものか。信ずるといふ其の眞心の顯はれは、之れ、眞正なる心の表現である。信心は火に入つても燒けず、水に入つても溺れずといふ堅實强固なるところに存する。社會が平和に維持せられて行くのは、學問上に於ける智力の競爭、軍備の競爭が原因をなすのでは無く、共心戮力、能く種々の異分子が相集りて共同生活を保つところに存する。而して、其の平和を維持する眞原因は、之れ、眞心の發露に因由するの
  translation: 'と詠まれている。まことに畏れ多い教えであり、私たちはありがたく、謹んで受け止めている。


    そもそも「信」の一字は、神にも仏にも通じる。これがあるからこそ、国家や社会は安らかで、世界は平和なのである。浅草の観音様へ参詣し、大勢の人が仏前で祈りを捧げている姿を見ると、ある感慨が起こる。それを一言で、迷信だ、盲信だと非難する人もいる。もちろん、祈りの内容は、家内安全、無病長寿、病気平癒、願いの成就と、さまざまだろう。しかし、願っているその心は、絶対的な信心なのである。


    人と人とのあいだの信頼は、どれも相対的で、絶対的ではない。親、兄弟、友人との信頼は、みな相対的なものだ。そこには必ず、自分への執着から生じる、よこしまな思いがある。友人同士でも、互いに信じる程度は絶対的ではない。それに対して神仏に祈る一念には、少しも偽りがなく、飾らない本心がそのまま現れ、全身全霊を捧げている。つまり、絶対的なのだ。これを迷いとして一笑に付すのは、思いやりのないことである。


    浅草の観音を拝む人々を見て、偶像崇拝だと笑い、迷信や盲信だと退ける人もいるだろう。しかし退ける当人も、すでに一種の偶像崇拝者であることに気づいていない。その偶像とは、うわべの名声という偶像、利益や欲望という偶像だ。彼らはそうした偶像を懸命に崇拝している。世間にあふれる人々は、ことごとく名声や評判という偶像を拝んでいるのだ。それなのに、程度の低い宗教だけを取り上げて、偶像崇拝だ、迷信や盲信だと笑って済ませることができるだろうか。


    信じるという真心の現れは、正真正銘の心の表現である。信心は、火の中に入っても焼けず、水の中に入っても溺れないという、堅く揺るがないところにある。社会が平和に保たれていくのは、学問上の知力や軍備を競い合うからではない。心を合わせて力を尽くし、異なる人々が集まって共同生活を保つからである。そして、その平和を維持する本当の原因は、この真心の現れにある'

  section: 武士道を他にも及ぼせ／二 官尊民卑の弊を去れ
  original: あり、トラテスマンである。即ち、獨立自營の人、勤勉の人、熱誠なるイシテントマンを尊崇するのである。我が日本では、今日も、尙ほ、官尊民卑の弊がある。されど、現代の日本人はもはや、月給取りばかりを尊ぶ時代では無く、獨立の實業家が、大いに勢力を占むる覺悟がなければならぬ。
  translation: 'あり、トレーズマン、つまり商工業を営む人である。すなわち独立自営の人、勤勉な人、熱意のある人を尊崇するのである。

    日本には今日もなお、官を尊び民を軽んじる弊害がある。しかし現代の日本人には、もはや月給取りばかりを尊ぶ時代ではなく、独立した実業家が大いに勢力を持つのだという覚悟がなければならない。'
  notes:
  - 「イシテントマン」は原著の外来語表記。直前の「熱誠なる」と一続きの意味として「熱意のある人」と訳した。

  section: 大道周行／一、吾道一もつて貫く
  original: '大道周行

    一、吾道一もつて貫く

    子曰、參乎吾道一以貫之。曾子曰、唯。子出。門人問曰、何謂也。曾子曰、夫子道、忠恕而已矣。

    （子曰く、參や、吾道、一以て之を貫く。曾子曰く、唯。子出づ。門人問うて曰く、何んの謂ひぞや。曾子曰く、夫子の道は、忠恕のみ。）

    これは論語の里仁篇に出て居る語である。或時、孔子が、「參や」といつて呼ばれた。云ふまでもなく、孔子の道統を得たる者は、曾參一人である。その曾參に對して、「參よ、吾道は一以て之れを貫く、吾が此の大道は、唯だ、一もつて貫いてゐるぞよ。」と云はれると、それに對して、曾子は「唯」と答へられた。唯とは、曲'
  translation: '一　私の道は、一つのもので貫かれている


    孔子が言われた。「参よ、私の道は、一つのもので貫かれている。」曾子は「はい」と答えた。孔子が退出すると、門人たちは尋ねた。「どういう意味ですか。」曾子は答えた。「先生の道は、誠実さと思いやり、それだけです。」


    これは『論語』の里仁篇にある言葉だ。あるとき、孔子が「参よ」と呼ばれた。いうまでもなく、孔子の道の正しい伝承を受けたのは、曾参ただ一人である。その曾参に向かって、「参よ、私の道は一つのもので貫かれている。私のこの大いなる道は、ただ一つのものによって貫かれているのだ」と言われると、曾子は「唯」と答えられた。「唯」とは、『曲'

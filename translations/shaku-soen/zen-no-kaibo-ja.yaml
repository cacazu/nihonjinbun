  section: 無邊の風月／二、肉眼ばかりでは見えぬ
  original: 二、肉眼ばかりでは見えぬ扨て、第一句は、「無邊の風月、眼中の眼」、これは、何も、風とか月とかに限つてしまはいでも宜しい。一切萬物、山川草木、森羅萬象と見たら宜い。無邊の萬物を見るに、決して、肉眼ばかりでは見えぬ。世間の多くは直ちに五感の眼をあてにして見る。物質的文明の進歩した今日は、遠くを見るに望遠鏡、微きを見るに顯微鏡とか何んとか云ふけれども、是れは一つの程度までだ。その間に障害があつたり、遠きも微かきも其度以上になれば見ることは出來ぬ。文明のやうでも、玆に到れば役に立たぬことになる。又た科學に於ける實驗も、結構は結構だが、唯だ、五感、即ち、眼·耳·鼻·舌·身を離れては出來ぬので、科學者そのものに云はすれば、「發達せる學理、進歩せる機械に依つた實驗以外の、つまり眼に見えず、耳に聞こえぬところには、何んの眞理も秘在しては居らぬ。勿論、神や佛などと云ふものは有るもんぢやない。」など傲語するだらうが、餘程、考へねばならぬところである。哲學などでも然うだ。理の不及點、不可知點に至らば、唯だ聾の如く、啞の如くである。どうして、そこに宇宙の眞理を徹見したと云はれやうか。五感の眼、物質を眺むる眼は、唯だ其の表面的の觀察に過ぎぬ。其の眞理、換言せば、森羅萬象の形なきところ、其の絕對無限なるところに至つては、肉眼の及ぶところでは無い。その幽玄不及のところを見る「眼中の眼」は、吾が禪門の謂ゆる心眼とでも云はうか。精神的マナコで見なければ見ること能はずである。眼についても、天眼通といふものがある。これは、やつぱり、天耳通とか、宿命
  translation: '二　肉眼だけでは見えない


    さて、第一句は「果てしない風月、目の奥にある目」である。これは、何も風と月だけに限らなくてよい。山や川、草や木、あらゆるものすべてだと考えればよい。限りない万物を見るには、決して肉眼だけでは足りない。世間の人は多くの場合、すぐに五感による目を頼りにする。物質文明の進んだ今日では、遠くを見るには望遠鏡、小さいものを見るには顕微鏡などというが、それも一定の範囲までだ。途中に障害があったり、距離や小ささが限度を超えたりすれば、見ることはできない。文明が進んだようでも、そこまで来れば役に立たなくなる。


    科学の実験も、結構なことではあるが、結局は眼・耳・鼻・舌・身という五感を離れてはできない。科学者本人に言わせれば、

    「発達した理論と進歩した機械による実験以外、つまり目に見えず、耳に聞こえないところに、真理が隠れていることはない。もちろん、神や仏などというものは、あるはずがない」

    などと豪語するだろうが、これは十分に考えなければならないところだ。哲学も同じで、理性の及ばないところ、知ることのできないところへ至れば、ただ耳が聞こえず、口も利けないようになる。それでどうして、宇宙の真理を見抜いたと言えるだろうか。


    五感の目、物質を見る目は、ただ表面を観察しているにすぎない。その真理、言い換えれば、あらゆるものの形を持たない側面、絶対・無限というところへ至っては、肉眼の及ぶところではない。その奥深く、通常の認識では届かないところを見る「目の奥の目」とは、禅でいう心眼とでもいおうか。精神の目で見なければ、見ることはできないのである。


    目といえば、「天眼通」というものもある。これは「天耳通」や「宿命'

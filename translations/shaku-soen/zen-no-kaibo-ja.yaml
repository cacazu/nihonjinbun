  section: 無邊の風月／一、詩の味はふ可き點
  original: 此の言ひ難い妙處をあらはしたのが、歌や詩であつて、山の靑々たる、花の美麗なる、鳥の樹間に囀るなど、自然の風光は、理窟や說明では、到底、駄目である。そこに詩が生まれる、歌が生まれる。詩や歌の如何に妙なるかゞ分るであらう。彼の宋朝時代に出た有名なる蘇東坡が、「溪聲即是廣長舌　山色豈非淸淨身　夜來八萬四千偈　他時如何擧似人」と詠じたことも能く考へてみると、實に幽玄にして、且つ、深く自然の眞理を穿つて居る。廣長舌は、一に長廣舌ともしてあるが、今はそんなことは何方でもよい。兎に角、佛說法の巧みな事を意味したものである。溪聲は、恰も佛さまが長い舌べろを以て滔々と一大說法せられるかの如き感があると云ふのである。こゝで、ちよつと、思ひ出したが、佛さまの舌べろは其長さ頂上に達すとあつて、ズーツと鼻頭から額を過ぎて、頭の頂點まで伸びたと云ふが、若し、今ま、そんな舌を持つてゐたら、直ぐに化物視せられるであらう。併し、之れも、唯だ、佛さまの橫說堅說、自由自在な其の辯舌の卓越なることを意味し形容したものに違ひない。かう云ふ風であるから、山色の風光も、見れば見るほど、光明赫々たる淸淨身、即ち、三十三身に現ずる佛菩薩の淨き御姿の如くであると云はんばかり、水の音を聞くにつけても如來說法の妙音、山色の千態なるを見れば、又た佛身の三十三處に現ずる其の神通無礙なる法身に、何れも親しく接するが如き感あらしむるのは詩の味はふべき點なのである。それゆゑ、俳句であらうが、和歌であらうが、其の妙處に至らば、禪の境と略ぼ一致のところがある。否な、兩境密々たる關係のあることは言を俟たない。禪に於ける商量といひ、それ〳〵の偈頌といひ、言語不到のところを含味させるのだから、なか〳〵分らないのが多い。あまり餘談に移つたが、唯今、玆に揭げた詩を
  translation: 'この言い難い深みを表すものが、歌や詩なのである。山の青々とした姿、花の美しさ、木々のあいだでさえずる鳥など、自然の風景は、理屈や説明ではとうてい表せない。そこに詩が生まれ、歌が生まれる。詩や歌が、どれほど優れた働きを持つかわかるだろう。宋の時代の有名な蘇東坡が、次のように詠んだことも、よく考えれば、実に奥深く、自然の真理を深く捉えている。


    「谷川の音こそ、仏が教えを説く長く広い舌であり、

    山の姿は、仏の清らかな身ではないだろうか。

    夜のあいだに聞いた、八万四千もの教えの偈。

    これを後日、どうやって人に示したらよいのだろう。」


    「広長舌」は「長広舌」とも書くが、今はそんなことはどちらでもよい。ともかく、仏が巧みに教えを説くことを意味する。谷川の音を聞くと、仏が長い舌で、よどみなく大いに説法しておられるように感じる、というのだ。今ふと思い出したが、仏の舌は、伸ばせば頭のてっぺんまで届くという。鼻先から額を通り越して、頭頂まで伸びたというが、もし今そんな舌を持つ人がいたら、すぐ化け物扱いされるだろう。しかしこれも、仏があらゆる方面から、自由自在に説く言葉の、実に卓越したことを表した形容にすぎない。


    こうしたわけで、山の風景も、見れば見るほど、光り輝く清らかな身、つまり三十三の姿を現す仏や菩薩の清らかなお姿のように見える。水の音を聞けば、如来の説法の美しい声に、山の千変万化する姿を見れば、三十三の姿を現す仏の、何にも妨げられない自由な働きの身に、どちらも親しく接するように感じられる。そこが詩の味わうべきところなのである。


    だから、俳句でも和歌でも、その深いところに達すれば、禅の境地とほぼ一致する点がある。いや、両者が密接な関係にあることは、言うまでもない。禅での問答や検討にしても、さまざまな偈にしても、言葉では届かないところを深く味わわせるものだから、なかなかわからないものが多い。ずいぶん余談になったが、ここに掲げた詩を、'

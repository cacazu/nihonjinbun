  section: 大なる樂觀の上に／一、千差萬別の情緒
  original: 茫々宇宙人無數幾箇男兒是丈夫は、月に對し、發憤しての作である。かくの如く、同じ一つの月に對して、感ずる人々の心は、いろ〳〵さま〳〵である。即ち、一つの月を、二つにも、三つにも、二十にも、三十にも、百にも、千にも見える。が、これを、眞理の上から云つたならば、月を見れば悲しいものだと斷ずるのも、本當の月を觀たものではない。また、樂しいものだと斷ずるのも、本當の月を眺めたものでは無い。月の本體にあつては、樂しとか、悲しとかいふことの上に超然として居るのである。凡そ、吾人が、此の人生を眺めるのには、二つの見方がある。一は人生を愉快な面白いものと眺める、即ち、樂觀である。一は人生を果ない悲しいものと眺める、即ち悲觀である。樂觀の人が、月に對し、花に對し、鳥に對すると、樂しと觀ずる。悲觀の人は、之れに反して、悲しと觀ずる。が、この月・花・鳥、換言すれば、宇宙人生の本體は、樂しとか悲しとかいふことを超越して居る。悲しむのも樂しむのも決して、宇宙人生の本體を眺めたといふ譯では無い。
  translation: 'これは月を見て、奮い立った思いを詠んだ詩である。

    このように、同じ一つの月を見ても、人の心が感じるものはさまざまである。つまり、一つの月が二つにも三つにも、二十にも三十にも、百にも千にも見える。しかし真理の上からいえば、月を見れば悲しいものだと決めつけるのも、本当の月を見たのではない。また、楽しいものだと決めつけるのも、本当の月を眺めたのではない。月の本体は、楽しいとか悲しいとかいうことを超えているのである。

    そもそも、私たちが人生を眺めるには二つの見方がある。一つは、人生を愉快で面白いものと見る楽観。もう一つは、人生をはかなく悲しいものと見る悲観である。楽観する人は、月にも花にも鳥にも楽しさを見る。悲観する人は、反対に悲しさを見る。しかし、この月・花・鳥、言い換えれば宇宙や人生の本体は、楽しい、悲しいということを超越している。悲しむことも楽しむことも、それだけで宇宙や人生の本体を見たというわけではないのである。'
  notes:
  - 原文冒頭はscan74末の漢詩の後半。詩の全訳はscan74側にまとめた。

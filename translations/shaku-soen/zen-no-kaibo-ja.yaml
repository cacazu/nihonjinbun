  section: 支那及び支那の宗敎／一、尨大なる國土
  original: らず、生々止まず、今日に於て其の或る部分の如きは、世界有數の密度を有してをる。勞働力に於ても、支那苦力の如き、皆な牛馬生活をなし、一日の生活費わづかに五錢十錢にて足る有樣で、歐米人の家畜家禽以下の生活をなしつゝ、而も、その勞働力の大なることは、全く動物的と云ふも過言では無い。勞働の價値如何は別問題として、此くの如き勞働力は、他日、世界に必ず何等かの力となつて現はるゝであらう。
  translation: らず、人々は絶えず増え続け、今日では、地域によって世界有数の人口密度に達している。労働力についても、中国の苦力と呼ばれる肉体労働者はみな牛馬のような生活を送り、一日の生活費はわずか五銭、十銭で足りるというありさまである。欧米人の飼う家畜や家禽にも及ばない生活を送りながら、その労働力の大きさは、まったく動物的といっても言いすぎではない。その労働の価値をどう評価するかは別として、これほどの労働力は、いつか必ず、世界に何らかの力として現れるだろう。
  notes:
  - 冒頭はscan160から続く。「苦力」および牛馬・動物に比する記述は原文の差別的な表現を反映する。
  sequence: 230
- id: zen-161-02
  scan: 161
  section: 支那及び支那の宗敎／二、微弱なる國民
  original: '二、微弱なる國民


    併し、その小なる點をあぐれば、第一、支那人は、國民としては、まことに小である。即ち、國家の一分子としての點から見れば、皆な極端なる個人主義者として四億の人間は、四億の心を有し、一致協力、一團となつて、國家的に活動することが出來ない。國家に關しては、一向、無頓着で、統治者の楚人たると越人たるとを問はぬ。日出而耕日入息、帝力於我在何、といふ有樣である。此くの如き次第であるから、國家的施設といふものが皆な小さくなつてくる。旅行中に氣づいた一端を擧ぐれば、兵制、幣制の如きは左うである。兵制について云へば、中央政府に直屬せる國家的軍隊なく、多くは督軍、鎭守使以下の利兵であつて、部分的には働くも、國家的に働くものは無い。故に、その兵幾百萬ありとも、これを以て大なりといふことは出來ぬ。幣制の如きも、全く門外漢である、衲の短時日の旅行中に於ても、その複雜亂雜なるは看取し得られるほどで、國家的に統一されたものは無い。敎育の如きも、定めて、制度だけは明文に規定してあらうけれども、實際に於ては非常に亂雜である。宗敎も、亦た、極めて亂雜ぢや。'
  translation: '二　弱い国民

    しかし、小さい点を挙げれば、第一に、中国人は国民としては実に小さい。国家の一員という点から見ると、みな極端な個人主義者であり、四億人がそれぞれ四億の心を持っていて、一致協力して国家のために活動することができない。国家のことにはまったく無関心で、支配者が楚の人か越の人かも問わない。

    「日が昇れば耕し、日が沈めば休む。天子の力が私に何の関わりがあるだろう」

    というありさまである。そのため国家の制度や組織も、すべて小さなものになる。旅行中に気づいた一端を挙げれば、軍制や貨幣制度がそうである。

    軍制では、中央政府に直属する国家の軍隊がなく、多くは督軍や鎮守使以下の私兵である。各部分としては働いても、国家のために働くものはいない。したがって兵が何百万人いても、それを大きいとはいえない。

    貨幣制度も、この分野にはまったく門外漢の私が、短い旅行中にも気づいたほど複雑で乱雑であり、国家的に統一されていない。

    教育も、制度だけはきっと明文で定められているだろうが、実際には非常に乱雑である。宗教もまた、きわめて乱雑だ。'
  notes:
  - 底本の「利兵」は文脈上「私兵」の意として訳した。
  sequence: 231
- id: zen-162-01
  scan: 162
  section: 支那及び支那の宗敎／二、微弱なる國民
  original: 宗敎は、彼の國敎制度のやうなものを以て、その信仰の程度如何を忖度することは出來ないけれども、支那の今日の狀態は餘りに無秩序であつて、道敎、孔子敎（果して宗敎なるや否やに關しては議論があるけれども）、耶蘇敎、回々敎といふ如く、雜然として行はれ、特色ある宗敎なく、之れを信奉する支那人に確乎たる信念、明らかなる意識なく、餘りに不透明にして、殆ど、無宗敎の觀を呈してゐる。以上の如き次第であるから、支那は大と云はゞ大、小に見れば小である。不思議の國といつてもよい。
  translation: '宗教については、国教制度があるかどうかといったことだけで信仰の深さを推し量ることはできない。それでも、今の中国はあまりに無秩序である。道教、孔子教――これが宗教かどうかには議論があるが――、キリスト教、イスラム教などが雑然と行われ、特色ある宗教がなく、それを信じる中国人にも、確かな信念や明確な自覚がない。あまりにも不透明で、ほとんど無宗教のように見える。

    以上のようなわけで、中国は大きいといえば大きく、小さいと見れば小さい。不思議な国といってもよい。'
  notes: []
  sequence: 232
- id: zen-162-02
  scan: 162
  section: 支那及び支那の宗敎／三、道敎と孔子敎
  original: '三、道敎と孔子敎


    次ぎに、宗敎者としての衲の立場から、特に宗敎に關し、一步立ち入つて述べて見たいと思ふ。前述の如く、支那には、幾多の宗敎が、雜然として存在してあるが中に就いて、固有の道敎、及び、孔子敎は、支那人間に根抵深く、支那を今日に導きし主なる原因の一と稱しては不可ない。此の二敎は、同一國に生れたものであるが、根本の宗旨は、極端に相違して居る。即ち、道敎は平等敎であつて、孔子敎は差別敎であると稱して可い。一々擧證するの遑は無いが、老子の語に、大道廢有仁義、慧智出有大僞、六親不和有孝慈、國家昏亂有忠信、といふ文句がある。また、古善爲道者、非以明民、將以愚之、民之難治以其智多、以智治國國之賊、不以智治國國之福などゝ說いて居る。一言以て之れを評せば、道敎は、虛沖、恬淡、寂寞、無爲を以て宗旨となして居る有樣で、社會國家の組織、活動、生活、秩序、形式を無視し、その外に超然として、以て高見の見物をなすといふ宗旨で、眞平等惡か平等か知れ'
  translation: '三　道教と孔子教

    次に、宗教家である私の立場から、宗教についてもう一歩踏み込んで述べたい。前に述べたように、中国には多くの宗教が雑然と存在している。なかでも中国固有の道教と孔子教は、人々の間に深く根づいていて、中国を今日の状態へ導いた主な原因の一つといってもよい。

    この二つの教えは同じ国に生まれたが、根本の趣旨は極端に違う。道教は平等を説く教え、孔子教は区別を説く教えといえる。

    一つ一つ証拠を挙げる暇はないが、『老子』には、

    「大いなる道が廃れると、仁義が説かれる。知恵が現れると、大きな偽りが生まれる。身内が不和になると、親孝行や慈愛が説かれる。国家が乱れると、忠実で信義ある臣下が現れる」

    という言葉がある。また、

    「昔、よく道を実践した者は、民を利口にしようとせず、素朴で無知なままにしようとした。民を治めにくいのは知恵が多いからだ。知恵で国を治めるのは国の害となり、知恵で治めないのは国の幸いとなる」

    などと説いている。一言で評すれば、道教は心を空しくして淡泊であり、静かに、作為なく生きることを旨とする。社会・国家の組織、活動、生活、秩序、形式を顧みず、その外へ超然と立って、高みから見物するという教えである。本当の平等か悪い平等かは分から'
  notes:
  - この章の「差別」は主に差異・区別・社会的役割の違いをいう。引用の『老子』も含め、宗教への評価は著者の解釈を訳した。末尾はscan163へ続く。
  - 底本の「眞平等惡か平等か」は文字順の誤りと考え、「真の平等か悪い平等か」と解した。
  sequence: 233
- id: zen-163-01
  scan: 163
  section: 支那及び支那の宗敎／三、道敎と孔子敎
  original: ないけれども、兎に角平等敎たることは疑ひを容れぬ。時代は異なるが、儒敎は當初から、社會、國家、個性を眼中に置き、孝悌忠信と云ひ、禮樂刑政と云ひ、仁義禮智信と云ひ、人として是等の諸徳は固定的に有するものとし、禮記の如き、一言一行はみな禮に叶ふものとし、一定の形式に據らざる可からざるものとし、禮儀三千威儀八百といふ語もある。吾人の根本個性は絕對的であつて、善惡正邪は固定的にあるもので無いのに、儒敎は以上の如く說き、一身、一家、社會、國家、皆な之れを一の形式習慣を以て律しようとして居る。此の兩宗敎が、支那人に與へた利益の少くないのは勿論であるが、同時に、其の弊害も多い。前述のやうに、支那を今日の狀態に導き、國家の獨立を危とし、人民の體面を損ぜしむるに至つた主なる原因となつた。即ち、儒敎の形式禮儀を重んずる結果から生じた弊害として、徒らに虛禮に流れ、形式に囚れ、虛僞の孝子、忠臣增加し、繁文縟禮となり、遂に精神を全く沒却して、形式をのみ取れば可なりと云ふ有樣となり、葬式には必ず泣男を雇ふといふ愚なる習慣をさへ作るに至つた。支那人を腐敗せしめたことの頗る大なるは言を俟つまでも無い。同時に、道敎も、虛沖、恬淡、寂寞、無爲の本領が一轉して萬事諦め主義となり內亂外禍、皆は已むを得ざる事と諦めて無頓着となり、敢へて是が爲めに奮起健闘することを爲さず、遂ひに國民をして最も微弱なるものとなしたのである。
  translation: 'ないが、ともかく平等を説く教えであることに疑いはない。

    時代は異なるが、儒教は初めから、社会、国家、個人を念頭に置いている。孝・悌・忠・信、礼・楽・刑・政、仁・義・礼・智・信などを説き、人間にはこれらの徳が固定的に備わるものとする。『礼記』などでは、一言一行をすべて礼にかない、一定の形式に従うべきものとし、「礼儀三千、威儀八百」という言葉もある。

    私たちの根本の個性は絶対的であり、善悪や正邪が固定してあるわけではない。なのに儒教はこのように説き、個人も家庭も社会も国家も、一つの形式や習慣で律しようとする。

    この二つの宗教が中国人に与えた利益は、もちろん少なくないが、弊害も多い。前述のように、中国を今日の状態へ導き、国家の独立を危うくし、人々の体面を損なうに至らせた主な原因となった。儒教が形式や礼儀を重んじた結果、実のない儀礼に流れ、形式に縛られ、見せかけの孝行息子や忠臣が増えた。細かく煩わしい儀礼ばかりとなり、ついには精神を忘れ、形さえ整えればよいという状態になった。葬式には必ず泣き男を雇うという愚かな習慣まで生まれた。中国人を著しく腐敗させたことは、いうまでもない。

    一方、道教の、心を空しく淡泊に保ち、静かに作為なく生きるという本領は、転じて何事も諦める態度になった。内乱も外からの災いも仕方がないと諦め、無関心になって、それに対して奮起し力を尽くそうとしない。その結果、国民をきわめて弱いものにしてしまったのである。'
  notes:
  - 冒頭はscan162から続く。「礼儀三千、威儀八百」は本文の順序のまま。
  sequence: 234
- id: zen-163-02

  section: 夙に起き時を使へ／三、早く起きて考へよ
  original: '三、早く起きて考へよ


    兎に角、五十年でも百年でも、考へてみれば、一日である。昨日だの昨年だのといろ〳〵過去があるやうであるが、皆な今日であつて、無始無終である。我が宗教の立場から云ふと、元來、生だの死だのと云ふことは無いので、死と生'
  translation: '三　早く起きて考えよ


    ともかく、五十年でも百年でも、考えてみれば一日である。昨日や去年など、さまざまな過去があるようだが、どれも今日であり、始まりも終わりもない。

    私の宗教の立場からいえば、もともと生とか死とかいう区別はない。死と生とは、'

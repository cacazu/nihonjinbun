  section: 禪と鎌倉武士／三、禪宗は何んであるか
  original: '三、禪宗は何んであるか


    それに次いで起つた禪宗は、何んであるかと云ふと、これは、また、いろ〳〵唱へ方があるが、禪は極めて簡單明瞭である。即ち、「莫妄想」の三字でもよい。或ひは、また、無の一字でもよい。或ひは喝を行じ、棒を行ずるも可からう。昔、「如何なるか是れ佛」と問うた者あるに對して、「即身即佛」'
  translation: '三　禅宗とは何か


    そのあとに起こった禅宗とは何か。これにもいろいろな表し方があるが、禅はきわめて簡単明瞭である。「妄想するな」の三字でもよい。「無」の一字でもよい。あるいは、喝を入れ、棒を用いるのでもよい。昔、「仏とは何ですか」と尋ねた者に対して、「この身が、そのまま仏だ」と'
  notes:
  - 末尾の答えを受ける地の文はscan87へ続く。「無」は公案の中心語なので、否定の「ない」に限定せず保持した。

  section: 人生は大夢なり／一、五蘊の所成の身
  original: 溜め込むといつたやうなものである。世間の人は、常に、夢の世の中とか、夢の浮世とか云つて居るが、まことに、人生は一夢である。吾人の身體は、五蘊が假りに和合したものであつて、定まれる相なく、無自性不可得である。だから、「皆空」といふ。般若心經に、「觀自在菩薩、深般若波羅密多を行ずる時、五蘊皆空なりと照見す」とある。重ねて云ふが、吾人の身體は、五蘊が、一時、假りに、因緣によつて和合して成立したもので、此五蘊は、畢竟、空なものである。我れが俺れがと執着してみたところで、人生五十が通り相場で、人生七十は、古來、稀れなりと云はれて居る。况んや百年の壽命をや。故に、古人は、「人生大夢の如し」と云つて居る。全く大きな夢を見て暮すやうなものだ。
  translation: '蓄えていく、といったようなものである。


    世間ではよく、夢の世の中、夢の浮世などというが、まことに人生は一つの夢だ。私たちの身体は、五蘊が仮に集まってできたもので、決まった姿も、それ自身だけで成り立つ本質もなく、確かな実体としてつかむことができない。だから「みな空である」という。『般若心経』には、

    「観自在菩薩が、深い智慧の完成を実践されたとき、五蘊はみな空であると見抜かれた」

    とある。繰り返していうが、私たちの身体は、五蘊が一時的に、さまざまな原因や条件によって仮に集まり、成り立ったものだ。この五蘊は、究極的には空なのである。自分が、自分が、と執着してみても、人生は五十年というのが普通で、七十まで生きる者は昔からまれだといわれる。まして百年も生きられるだろうか。


    だから古人は、「人生は大きな夢のようなものだ」と言っている。まったく、大きな夢を見ながら暮らしているようなものなのである。'
  notes:
  - 冒頭は前コマからの続き。

- id: zen-116-02
  scan: 116
  section: 自己を究明せよ／一 釋尊弘教の第一聲
  original: '自己を究明せよ

    一、釋尊弘教の第一聲

    「四河、海に入りて後た河の名なし。四姓、沙門となりて、皆な、釋氏を稱す」

    これは、釋尊弘教の第一聲であつて、又た、斯くあらしめることが、釋尊傳道の本旨でもあつた。

    當時の印度に於ける社會制度は、已に知らるゝ如く、波羅門、殺帝利、毘舍、戍達羅の四種で、換言すれば、僧族、貴族、農商族、奴隷といつたやうな階級である。

    此の血族階級の弊に惱まされて、動きの取れぬやうになつてゐた印度の社會現狀を、根本的に打破して、一般民族に活氣を吹き込み、之れに慰安と活力とを與へ、印度民族の向上を圖らうといふにあつたのである。が、それは、單に、釋尊が衆生'
  translation: '自分自身を究めよ

    一　釈尊が教えを広めた第一声

    「四つの河は海へ入ると、それぞれの河の名を失う。四つの身分の人も、出家して修行者になれば、みな釈迦の一族を名のる」

    これは釈尊が教えを広めた第一声であり、また、そのような状態を実現することが、伝道の根本の目的でもあった。

    よく知られているように、当時のインドの社会制度には、バラモン、クシャトリヤ、ヴァイシャ、シュードラの四つの区分があった。いい換えれば、僧侶の階級、貴族の階級、農民や商人の階級、奴隷というような階級である。

    この血筋で決まる階級制度の害に苦しみ、身動きできなくなっていたインド社会を根本から打ち破り、一般の人々に生気を吹き込み、慰めと活力を与え、インドの人々を向上させようとしたのである。しかし、それは単に、釈尊が人々を'
  notes:
  - 身分制度の説明は著者の用語・理解に従った。「後た」は原本の表記。
  - 末文は次コマへ続く。
  sequence: 154
- id: zen-117-01
  scan: 117
  section: 自己を究明せよ／一 釋尊弘教の第一聲
  original: 'を濟度せられんとする方便で、釋尊の本懷は百尺竿頭更らに一步を進めたる、一層根本的のもので、人をして、世の中の榮枯盛衰に齷齪せず、一時的の安樂に眩惑せられず、永久の安樂平和を享けしめようとせらるゝにあつたことは申すまでも無いことである。

    釋尊が自ら、

    「我れ、一大事因緣の爲めに、世に出現す」

    と獅子吼せられたることは、明らかに此間の消息を傳へたものである。故に、佛一代四十九年間の說法を一貫して說かれたところは、「開示悟入」の道理で、人の迷執を開いて、之れに宇宙に於ける常住不變の本體を擧示し、以て人生としての本懷は何んであるかを悟らしめ、日々是れ好日の生活を送らしめんとするにあつた。

    然らば、その常住不變の本體とは、果して、何んであらうか。曰く、「我れ」である。我れとは何んであるか、佛であり、正覺であり、一切萬物である。古人の語にも、

    「心を識得すれば、大地に寸土なし」

    と云つてある。佛教は此の本心を識得するのである。禪は、眞の我れ、即ち、眞我を識得するのである。

    さうして、本心といふものは、人々個々圓成にして、動物でも、植物でも、皆な具有して居るものである。天が高きにゐて蓋ふてゐるも、地が低きにゐて萬物を戴せてゐるのも、柳の綠に染むも、花の紅なるも、皆な、悉く、本心の現はれに過ぎない。唯だ本心が、緣に觸れて、いろ〳〵の形を現じたものである。

    さうして、其の本心とは、「我れ」である。人は、須く萬物の究極するところ、悉く、皆な、「我れ」に歸し、有爲轉變の激しき此の世界にあつても、獨り常住不變のものに「我れ」あるを覺り、戒律を持して、此の正覺を生活に於ける行爲の上に顯はし、戒行を嚴にして扶律淡常、我れにある我れの眞我たり大我たる那一物'
  translation: '救うための手だてにすぎなかった。釈尊の本当の願いは、百尺の竿の先からさらに一歩を進めるように、もっと根本的なものだった。人々が世間の栄枯盛衰にあくせくせず、つかの間の安楽に惑わされず、永遠の安楽と平和を得られるようにすることだったのは、いうまでもない。

    釈尊自身が、

    「私は、ただ一つの重大な目的と縁のために、この世に現れた」

    と力強く宣言したのは、そのことを明らかに伝えている。だから釈尊の四十九年間の説法を一貫しているのは、「開き、示し、悟らせ、入らせる」という道理だった。人の迷いや執着を開き、宇宙の中にあって永遠に変わらない根本の実体を示し、人としての本当の願いが何かを悟らせ、毎日をよい日として生きられるようにすることだったのである。

    では、その永遠に変わらない根本の実体とは、いったい何か。「我れ」である。では我れとは何か。仏であり、正しい悟りであり、ありとあらゆる存在である。昔の人も、

    「心を本当に会得すれば、心と別に存在する土は、大地にほんの少しもない」

    といっている。仏教はこの本来の心を会得するのである。禅は、真の自分、すなわち真我を会得するのである。

    本来の心は、一人ひとりに完全な形で備わり、動物も植物も、みなもっている。天が高いところから覆い、地が低いところで万物を載せ、柳が緑に染まり、花が紅く咲くのも、すべて本来の心の現れにすぎない。ただ本来の心が、さまざまな縁に触れ、それぞれの形を現したのである。

    そして、その本来の心こそ「我れ」なのだ。人は、万物が究極にはすべて「我れ」に帰すること、この激しく移り変わる世界にも、ただ一つ変わらないものとして「我れ」があることを悟らなければならない。戒律を守り、この正しい悟りを日々の行いに現し、戒めを厳格に実践し、戒律を支え、変わらぬ真理を説く。そして、自分の内にある真我、大我である、その根本の一つのもの'
  notes:
  - 原本「扶律淡常」は「扶律談常」の意と解し、戒律を護持し、常住の真理を説く意として訳した。「我れ」はこの章で著者が説く真我であり、日常的な自我とは区別される。
  - 末文は次コマへ続く。
  sequence: 155
- id: zen-118-01
  scan: 118
  section: 自己を究明せよ／一 釋尊弘教の第一聲
  original: 'を顯成する工夫を積まなければならぬ。

    扨て、釋尊以前の宗教、又た、以後に於ける他宗教、殊に、基督教に於てすら、神佛を宇宙の上に超然たる存在者とし、神佛は「我れ」の外にあつて、我等も宇宙をも支配するものであるかの如く教へ、我れと宇宙と一體、萬物と自己と一如、佛我一體、神我一體といつたやうな教へは說いてゐない。イエスが、「人は神の子なり」と說いたのも、要するに、人を神の奴隷、從僕を以てしたに過ぎない。然るに、釋尊は「三界唯一心」とも「心佛及衆生是三無差別」とも云はれてある。'
  translation: 'をはっきり現すための修行を、重ねなければならない。

    さて、釈尊より前の宗教も、後のほかの宗教も、とくにキリスト教でさえ、神仏を宇宙の上に超越している存在とする。そして神仏は「我れ」の外にあり、私たちと宇宙とを支配するかのように教え、自分と宇宙は一体、万物と自己は一つ、仏と我れ、神と我れは一体だ、という教えは説いていない。イエスが「人は神の子である」と説いたのも、要するに、人間を神の奴隷、従僕として扱ったにすぎない。それに対して釈尊は、「この世界は、ただ一つの心である」とも、「心と仏と生きとし生けるもの、この三つに違いはない」とも説いている。'
  notes:
  - 他宗教、とくにキリスト教への評価は著者独自の理解であり、現代の宗教学的説明に置き換えていない。
  sequence: 156
- id: zen-118-02
  scan: 118
  section: 自己を究明せよ／二 我は天地の顯現なり
  original: '二、我は天地の顯現なり

    禪林類聚といふ書物に載つて居ることであるが、一日、馬祖道一禪師が、上堂、說法して言はれるには、

    「汝等諸人、各、自己これ佛なることを信ぜよ。是れ心、即ち、是れ佛心なることを信ぜよ。是れ心、即ち、是れ佛心なり。達磨、南天竺より來つて中華に至り、上乘一心の法を傳へて、汝等をして、開悟せしむ。」

    と。すると、一僧あり、出でゝ問ふ。

    「和尚、甚麼としてか、即心即佛と說く。」

    師、曰く、

    「小兒の啼きを止めんが爲めなり。」

    僧、曰く、

    「啼き止んでのち如何ん。」

    師、曰く、

    「心に非ず、佛に非ず。」

    と。かくの如く、我れが神であり、佛であり、宇宙であり、萬物である。我れは天地の顯現であると自覺するのが、靑年に取つても、男にも、女にも、大切なことで'
  translation: '二　我れは天地の現れである

    『禅林類聚』という書物に載っている話だが、ある日、馬祖道一禅師が説法の座に上り、こう語った。

    「皆、それぞれ自分自身が仏であると信じなさい。この心が、そのまま仏の心であると信じなさい。この心こそ、仏の心なのだ。達磨は南インドから中国へ来て、最上の教えである、この一つの心の法を伝え、お前たちに悟りを開かせるのだ」

    すると一人の僧が進み出て尋ねた。

    「和尚はなぜ、心がそのまま仏だと説くのですか」

    師は答えた。

    「幼い子の泣くのをやめさせるためだ」

    僧が「泣きやんだ後は、どうですか」と問うと、師はいった。

    「心でもなければ、仏でもない」

    このように、我れが神であり、仏であり、宇宙であり、万物なのである。我れは天地が姿を現したものだ、と自覚することは、青年にとっても、男性にも女性にも、大切なことで'
  notes:
  - 末文は次コマへ続く。
  sequence: 157
- id: zen-119-01
  scan: 119
  section: 自己を究明せよ／二 我は天地の顯現なり
  original: 'あつて、之れが、人生向上の出發點である。

    臨濟大師は、

    「隨所に主となれば立所に皆な眞なり」

    と說かれ、如何なる境遇に入つても、其の境遇を支配する主人公となりさへすれば到る處、可ならざるは無いと說かれてあるも、又た、孔子が中庸に於て、

    「富貴に素しては富貴に行ひ、貧賤に素しては貧賤に行ひ、夷狄に素しては夷狄に行ひ、君子は入るとして自得せざるなし」

    と教へられたのも、我れを知り、我れを識得した上の話で、そこまで到るには、即ち、修行が必要である。

    自分は豪いとか、自分の力を殊更らに振り蒔かいでも、修行工夫がチヤンと出來上つて、佛心に得入し、眞我を究明してあれば、一言を發せず、末席に穩坐してあつても、威は滿場に揮ひ、氣は天地を動かすの力が自然に現はれて來るのぢや。'
  translation: 'あり、人生を向上させる出発点となる。

    臨済大師は、

    「どこにいても主体となれば、立つところはすべて真実となる」

    と説いた。どんな境遇でも、その境遇に振り回されず、主人となりさえすれば、どこでもよく生きられる、というのである。また孔子が『中庸』で、

    「富み、身分が高ければ、その境遇に即して行い、貧しく身分が低ければ、その境遇に即して行う。異民族の土地にいれば、そこに即して行う。君子はどこに身を置いても、自ら納得して安らげないことがない」

    と教えたのも、本当の自分を知り、会得したうえでの話である。そこに至るためには、修行が必要だ。

    自分は偉いなどといったり、ことさらに力を振りまいたりしなくても、修行がしっかりでき上がり、仏の心に入り、真の自分を究めていれば、一言も発せず末席に静かに座っていても、威厳はその場全体に及び、その気は天地を動かすほどの力として自然に現れるのである。'
  notes:
  - 『中庸』の言葉を孔子の教えとするのは原文に従う。「夷狄」は異民族の土地と訳した。
  sequence: 158
- id: zen-119-02
  scan: 119
  section: 自己を究明せよ／三 天上天下唯我獨尊
  original: '三、天上天下唯我獨尊

    ところが、世の中を見渡すに、學問もあり、才能もあり、財產も富裕で、何に不足なく生活して行ける人たちが、存外、精神的に貧弱で、心の貧しく賤しい者が無いでもない。學問もあり、才能もありながら、動ともすると、財產とか、才能とか、學問とかの上に臨んで、是等の主人公たるべき貴い心を、却つて、是等の奴隷にして仕舞ひ易いのである。

    學問のある人、才能のある人、財產のある人の過誤は、すべて皆な其等に貪着するより起るものである。されば、是等に貪着せず、囚はれることなく、自由に是等を運用し、而して、解脫任運なる境界を得るやうにせなければならぬ。

    釋尊が初生下に於ける、

    「天上天下唯我獨尊」'
  translation: '三　天にも地にも、ただ我れが尊い

    ところが世の中を見ると、学問も才能もあり、財産も豊かで、不自由なく暮らせる人の中に、思いのほか精神が弱く、心が貧しく卑しい者もいる。学問や才能があっても、とかく財産、才能、学問に向き合うと、それらの主人であるべき尊い心を、反対にそれらの奴隷にしてしまいやすいのである。

    学問、才能、財産のある人の過ちは、すべてそれらへの執着から起こる。だから貪って執着せず、とらわれず、自由に用い、束縛から解かれて自然に生きる境地を得るようにしなければならない。

    釈尊が生まれた直後に発したという、

    「天の上にも地の上にも、ただ我れこそが尊い」'
  notes: []
  sequence: 159
- id: zen-120-01
  scan: 120
  section: 自己を究明せよ／三 天上天下唯我獨尊
  original: 'の絕叫は、決して、孤立的の唯我ではない。假我でも、小我でも、我見でもない。大我であり、眞我である。その眞我の力の顯現したところが、獨尊である。隨所に主となる力は、この獨尊なる唯我の活躍するところに現はれるのである。

    されば、吾人は、獨尊の意義を深く究明し、衣食住に貪着せず、學問、財產、才能の上に超然として、之れが主人公たり得るやう努力しなければならぬ。此の隨所に主となるには、「我れ」の問題に徹底して、始めて、現成されるのである。禪門の教ゆるところは、こゝに在るのである。'
  translation: 'という叫びは、自分だけを切り離して尊ぶという意味では決してない。仮の自我でも、小さな自我でも、自分に固執する見方でもない。大いなる自己、真の自己なのだ。その真の自己の力が現れることが、「ひとり尊い」ということなのである。どこでも主体となる力は、この独り尊い真の我れが働くところに現れる。

    だから私たちは「独尊」の意味を深く究め、衣食住に執着せず、学問、財産、才能にもとらわれず、それらの主人になれるよう努力しなければならない。どこでも主体になることは、「我れ」とは何かを徹底して究めて、初めて実現する。禅が教えるのは、このことである。'
  notes: []
  sequence: 160
- id: zen-120-02
  scan: 120
  section: 自己を究明せよ／四 生命あつての物種
  original: '四、生命あつての物種

    併し、何んと云つても、人の身に取つて最も大切なるは身體である。人は身體が健全でなければ、何に一つ出來るものでない。釋尊は、人間として、實に健全なる身體の所有者であつた。四十九年間の橫說竪說、專ら度生に盡くされし間は申すまでもなく、出家入山以來の苦行に於て、一麻一米、頰落ち、肉瘦せ、憔悴骨立すると云ふまでに苦修練行せられた。若し、釋尊にして、生來、薄弱な御身であられしならば、或ひは雪山に斃れられたかも知れん。或ひは檀特山下に屍を橫へられたも圖られない。

    けれども、釋尊の堅實なる精神力に加ふるに、健全なる身體は、內外の惡魔と戰ひ、有らゆる艱苦に堪へて、毫も撓むことなく、八十歲の長壽を保たれ、斃れて已むまで、日夕、衆生濟度のために法輪を轉ぜられ得たのは、一は、身體が健全であらせられたからである。

    世語にも「生命あつての物種」といふが、一面から云へば、人間一切は、實に、身體が生命である。勇猛精進も、やはり、健全なる身體に待たなければならぬ。

    古人には、病軀に鞭ち、虛弱の身體を引き立てゝ行道せられた勝蹟もあつて、一般に定言することは出來ないけれども、亦た、左ういふ方面についても、更らに深'
  translation: '四　命があってこそ

    しかし、何といっても、人にとって最も大切なのは身体である。身体が健全でなければ、何一つできない。釈尊は、人間として実に健全な身体の持ち主だった。四十九年間、さまざまな角度から教えを説き、ひたすら人々を救うために尽くした時期はもちろん、出家して山に入ってからの苦行では、麻の実一粒、米一粒というほどの食事で、頬はこけ、肉は落ち、やつれて骨ばかりになるまで修行した。もし生まれつき身体が弱かったなら、雪山で倒れたかもしれず、檀特山のふもとに亡骸を横たえたかもしれない。

    しかし、釈尊には堅実な精神力に加えて、健全な身体があった。内外の悪魔と戦い、あらゆる困難に耐えて、少しもひるまず八十歳の長寿を保ち、倒れて生涯を終えるまで、日夜人々を救うために教えを説き続けられた。その一つの理由は、身体が健全だったことにある。

    ことわざにも「命あっての物種」という。一面からいえば、人間にとっては実に身体が命の基盤である。勇猛に精進するにも、やはり健全な身体がなければならない。

    昔の人には、病む身体に鞭打ち、弱い身体を奮い立たせて道を実践した優れた事績もあるから、一概には断言できない。それでも、この方面についても、さらに深く'
  notes:
  - 「一麻一米」は極端な少食の苦行を示す表現。身体についての一般論は著者の主張を訳した。
  - 末文は次コマへ続く。

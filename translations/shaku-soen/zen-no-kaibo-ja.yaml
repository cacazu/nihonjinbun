  section: 差別に處する難／一、萬物もと是れ平等
  original: 差別に處する難一、萬物もと是れ平等人間は、元と、是れ、平等なものである。その間に差別のあらう筈がない。否な、佛も同じものである、即力即佛である。そればかりで無い、無情の草木國土さへ、猶ほ人間と同じものである。草木國土も、一切、成佛する。昔から今日にいたる國家の歷史について考察しても、將た、又た、個人の生涯について觀察しても、一大長足の進步を遂げんとして自覺の時代に到達すれば、既往の有らゆる囚はれから脫して、人心を直指し、その本に歸つて、平等觀念を懷くやうになるのが法だ。國家が、未だ自覺せぬうちは、無闇に外國を恐れたり、外國の文明に心醉したりなぞするが、一旦、自覺して國運興隆の機運に向へば、國を擧げて平等觀念を懷き、自國の力と外國の力との間に差別を認めず、歐の文明何かならん、神州には神州建國以來、他の窺ふを許さざる盛大の志氣があると云つたやうな調子になるものである。同時に國民各自の間にも、平等觀念が頗る旺盛になつて來て、伊太利統一の勇士、ガルバルヂーの如く、匹夫の身を以てして、一躍、將相の位置に上るものを生じ、上下貴賤の差別が撤去せられてしまうものだ。維新の風雲に乘じて身を立てた元勳連中の動機となつたものは、孰れも平等觀念である。個人の私生涯に於ても、猶ほ、且つ、同じで、二十歲前後の春機發動期に達し、是れから智情意の一と進步があらうと云ふ年頃ともなれば、國運興隆の際に於ける國家と等しく、多少、意久地ある靑年は、孰れも、皆な、平等觀念に驅られ、彼れも人なり、我れも人なりと思ふやうになるものである。僞りの多い社會主義に事
  translation: '一　すべてのものは、もともと平等


    人間は、もともと平等なものだ。そのあいだに、本質的な違いがあるはずはない。いや、仏も同じであり、この心がそのまま仏なのである。そればかりではない。心を持たない草木や国土でさえ、人間と同じものだ。草木も国土も、すべて仏となる。


    昔から今日までの国の歴史を考えても、個人の生涯を観察しても、大きな進歩を遂げようとして、自分自身に目覚める時期へ達すると、過去のあらゆるとらわれから抜け出し、人の心をまっすぐに見つめ、その根本へ帰って、平等という考えを抱くようになるものだ。


    国がまだ自覚していないうちは、むやみに外国を恐れたり、外国の文明に心酔したりする。しかし、ひとたび自覚して、国が栄える機運へ向かうと、国中が平等の考えを抱き、自国の力と外国の力のあいだに差を認めなくなる。西洋の文明など何ほどのものか、日本には建国以来、他の追随を許さない盛んな意気がある、という調子になるのである。


    同時に、国民一人一人のあいだにも平等の考えがたいへん盛んになる。イタリア統一の勇士ガリバルディのように、一介の庶民の身から、一躍、将軍や宰相の地位へ上る者が生まれ、上下貴賤の差が取り除かれてしまうものだ。維新の激動に乗じて身を立てた元勲たちを動かしたものは、みな平等という考えである。


    個人の私生活でも同じことだ。二十歳前後の、青年として目覚める時期に達し、これから知性・感情・意志が一段と進歩しようという年ごろになれば、国が興隆する時期と同じように、少しでも気概のある青年は、誰もが平等の考えに動かされ、「相手も人間、自分も人間だ」と思うようになる。偽りの多い社会主義に、物事の道'
  notes:
  - 原文の活字は「即力即佛」だが、ルビは「そくしんそくぶつ」。訳では「即心即仏」の意味を採った。
  - 本章の「差別」は、主に事物や人々の違い・区別を指す。ただし身分秩序を肯定する著者の社会観も含め、原意を変えずに訳した。
  - 末尾は次コマへ続く。

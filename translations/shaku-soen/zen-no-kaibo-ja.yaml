  section: 正法に不思議なし／三、障子の引手峰の松
  original: ると、法衣の裾を高々とからげて、その美人を引つ抱へたまゝ川を渡つて、何知らぬ顏でさつさと行つてしまつた。ところが、其晩、宿に着いてから、道友等が、「尊公は怪しからん男だ、出家の身でありながら、女を抱くとは何事か」と詰つた。すると、和尙は、フヽンと笑つて、「衲は川を越すと同時に放してしまつたが、尊公等は、まだ、女を抱いてをるのか」と云はれたさうである。これはなか〳〵味ひのある話である。坦山和尙の如きは、臨濟禪師の謂ゆる「寸絲を着けざる」境界にあるんで、美人を見れば美人と感する、醜婦を見れば醜婦と感ずる、たゞ其れだけである、そこに何等の執着もなければ悶えもないのである。
  translation: '法衣の裾を高くたくし上げ、その女性を抱えたまま川を渡り、何食わぬ顔ですたすたと行ってしまった。

    その晩、宿に着いてから、同行の友人たちは、「あなたはけしからん人だ。出家の身でありながら、女性を抱くとは何事か」と責めた。すると和尚は、ふふんと笑って、「私は川を渡ると同時に、あの人を放してしまった。あなたがたは、まだ女性を抱いているのか」と言ったそうである。

    これは実に味わい深い話である。坦山和尚のような人は、臨済禅師のいう「一本の糸すらまとわない」、何も付着させない境地にいるので、美人を見れば美人と感じ、醜い女性を見れば醜いと感じる。ただそれだけであり、そこに何の執着も、心のもだえもないのである。'

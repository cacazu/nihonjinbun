  section: 驢を渡し馬を渡す／八、禾山の解打鼓
  original: 'と。禾山は、また〳〵、

    「解打鼓」

    と同じことを答へられた。僧、また、問ふ。

    「向上の人、來るとき如何んか接せん」

    と。禾山、曰く、

    「解打鼓」

    どこまでも同じ答への一本槍である。これは、倶底和尙が、誰れが何んと訊ねても、たゞ指一本竪てられたと同じ答處で、言句を追つて廻つては、遂ひに不會である。禾山和尙の「解打鼓」は、盡大地、解打鼓のほかに出ないのである。今ま、此僧の問端は、いろ〳〵言葉は違つて居るが、意味は初問のほかに出ない。眞諦といふも、眞過と云ふも、非心非佛といふも、決して、別の意味ではない。禾山の意は、眞箇の大道は、かゝる名相とは遠くして遠い、言句について廻つてゐたのでは遂ひに不可得であるぞと示されたものである。各人は、宜しく、工夫一番するがよい。'
  translation: 'そう問われても、禾山はまた「太鼓を打つことなら、わかっている」と同じ答えをした。僧はさらに、「悟りをも超えた人が来たとき、どのように接しますか」と尋ねた。禾山は答えた。

    「太鼓を打つことなら、わかっている。」

    どこまでも同じ答え一本で通す。これは倶底和尚が、誰に何を尋ねられても、ただ指を一本立てたのと同じ趣旨である。言葉だけを追いかけていては、いつまでたってもわからない。禾山和尚の「太鼓を打つことなら、わかっている」は、大地のすべてが、その「太鼓を打つこと」のほかにはないのである。

    この僧の問いは、言葉こそいろいろと違うが、意味は最初の問いを出ていない。「真諦」といっても、「真過」といっても、「非心非仏」といっても、別の意味ではない。禾山は、本当の大道は、そのような名称や概念から遠く離れており、言葉について回っていては、ついに得られない、と示したのである。一人ひとりが、ここでしっかりと自ら取り組むのがよい。'
  notes:
  - 「倶底」は底本の表記。一般に倶胝と表記される禅僧。

  section: 誰か言ふ弱き者と／二 電光影裏春風を斬る
  original: 'び難き境地に達した。諸惡煩惱を斷ち切つて、身を以て衆善奉行の執金剛神たるに至つたのぢや。

    昔から、勝れた人間は、男ばかりが勝れてをるのでは無い。男ばかりが大智大勇猛心の發淵たる執金剛神の力を發揮して斷惡生善の行ひをしたのでは無い。女でも千代能のやうな俊逸一世に冠たるものは、みな悉く執金剛神の力を發揮してをる。陣頭に立つて三軍を叱咤した佛國のジャンダーク、或は、羅馬の愛國者ブルタスの妻など、みな、執金剛神の權化である。千代能は出家したのであるから、俗世間の生活は營まなかつたが、能く、心中の惡鬼毒蛇を征服して、生死の上に超然としてをつた點は、女ながらも、正しく執金剛神の化身である。千代能の遺してをる文章の中に、

    それ、地獄、遠きにあらず。極樂、亦た、眼前にあり。人世百歲、古來、稀れなるに、秦皇、漢武、長生を求めんとするも、徒らに千歲の笑ひをのこし、彭祖が一掬の菊水に、八百歲を露の間に保ち、東方朔が一枝の桃、三千年を瞬時に過ぐ。短かしとや言はむ。廬生が邯鄲一睡の夢、五十年の盛衰、長しとや言はむ。鐵拐、琴高、今ま何地にありや。

    といふのがある。よほど悟道の深き者でないと、斯くの如き凝滯のない心情を披瀝した文章を作り得ることは出來ない。

    女といはず男といはず、すべて人間は、兎角、凝滯し易いものである。例せば、酒を飮むにしても、はじめ飮み出した暫時は、酒を飮んでをる積りでをつても、何時の間にか酒に飮まれてしまふ。殊に、女人は、男子に比して、遙かに凝滯し易い性質を有つてをる。執着煩惱が激しいやうに思はれる。「仕事が多くて困る」とか、「舅、姑が六ケしくて不可ぬ」とか、「小姑が五月蠅くて不可ない」とか、「亭主が彼アだ此アだ」とか言ふ愚癡は、畢竟するに、女人自ら心の裡に猛威を振ふ夜叉、惡鬼、毒蛇を征伐して煩惱の執着を斷ち却つてしまふ執金剛神の力を發揮し得ない'
  translation: '難い境地へ達した。さまざまな悪や煩悩を断ち切り、自らあらゆる善を実践する執金剛神となったのである。

    昔から、人間で優れているのは男性だけではない。大いなる智慧と勇猛心の源である執金剛神の力を発揮し、悪を断ち善を生む行いをしてきたのは、男性だけではない。女性でも千代能のように一時代の頂点に立つ優れた人物は、みな執金剛神の力を発揮している。先頭に立って全軍を叱咤したフランスのジャンヌ・ダルクや、ローマの愛国者ブルータスの妻なども、その化身である。千代能は出家したから世俗の生活は営まなかったが、心の中の悪鬼や毒蛇を征服し、生死を超えた境地にあった点では、女性ながら、まさに執金剛神の化身だった。千代能の遺した文章に、次のものがある。

    「地獄は遠くにあるのではない。極楽もまた目の前にある。人が百年生きることさえ昔からまれなのに、秦の始皇帝や漢の武帝は長生きを求め、むなしく千年後までの笑いものとなった。彭祖は一すくいの菊の水によって八百年の命を保ったが、それも露ほどの間である。東方朔は一枝の桃によって三千年を一瞬に過ごした。それを短いというのだろうか。廬生が邯鄲で一眠りのうちに見た夢には、五十年の栄枯盛衰があった。それを長いというのだろうか。仙人の鉄拐や琴高は、今いったいどこにいるのか」

    よほど悟りが深くなければ、このように滞りのない心を明かした文章を書くことはできない。

    女性でも男性でも、人間はとかく心が一つのところにとらわれやすい。酒を飲む場合でも、初めのうちは自分が飲んでいるつもりでも、いつしか酒に飲まれてしまう。とくに女性は男性よりはるかにとらわれやすい性質があり、執着の煩悩が激しいように思われる。「仕事が多くて困る」「舅や姑が気難しくて困る」「小姑がうるさくて困る」「夫がああだ、こうだ」と愚痴をいうのは、結局、自分の心で猛威を振るう夜叉や悪鬼や毒蛇を退治し、煩悩への執着を断ち切る執金剛神の力を発揮できない'

  section: 正法に不思議なし／一、晴れた日は晴れ
  original: 禪家に於ては尋常茶飯事である。決して、奇特事とすべきではない。全體、この天地間に、これが奇特事で御座ると云つて、取り立てゝ云ふべきものは無いのである。奇妙である、不思議であると云つて、世間の人が騒ぐのは、その人々等の眼界が餘りに狹く、その人々等の智識が餘りに淺いからである。佛說の謂ゆる因緣の意味が徹底的に了解出來たならば、決して、奇妙も、不思議も、奇特も、不奇特も無いのである。
  translation: 禅の世界では、ごく当たり前のことである。決して特別な奇跡とすべきものではない。そもそも、この天地の間には、「これこそ奇跡です」と取り立てて言うべきものはない。世間の人が、奇妙だ、不思議だと騒ぐのは、その人たちの見える範囲があまりに狭く、知識があまりに浅いからである。仏の教えでいう因縁の意味を徹底して理解できれば、奇妙も、不思議も、特別なことも、特別でないことも、ないのである。

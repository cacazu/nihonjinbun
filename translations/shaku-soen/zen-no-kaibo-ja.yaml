  section: 禪と鎌倉武士／八 膽斗の如き相模太郞
  original: '無禮至極である」

    とて、直ちに、龍口に於て、之れを打ち斬つてしまつた。此時、已に、時宗公が弘安四年の外寇に對する方針は一決してをつたと思ふ。

    これは、決して、輕擧妄斷ではない。而して、また、他の一面には、彼我兩朝の高僧について、安心の秘要を受くる傍、敵國の事情を聽き取り、身は鎌倉の幕營に居ながら、大蒙古の狀況は、時宗公の手に取るやうに分つて居つたと思はれる。然らざれば、如何に、膽、斗の如しと雖も、あれ丈けの大英斷は出來ぬ。

    時は、弘安四年の六月五日、果然〳〵、蒙古の水師は、筑紫瀉に現はれて來た。其兵船四十餘艘、水兵十四萬と記してある、其の大軍が、一時に、大なる口を開いて一嘗めと言はんばかりに、我國に攻めて來たのである。

    勿論、その前より、時宗公は、力を盡くして、國防に留意し、戰備を怠らなかつたので、今でも博多に遺つて居るが、十四五里の間は、石壘を築き、さうして、鎭西の探題、北條實政を始め、諸國の武士の馳せ集つた軍勢が二十五萬といふので、天下は、恰も鼎の沸き立つ有樣であつた。

    畏れ多くも、龜山天皇は、身を以て國難に當らんと、伊勢の大廟に祈らせらるゝといふ有樣で、「佛光錄」はじめ、いろ〳〵の書物について見ると、蒙古來寇の其日より我が佛光國師は、每朝、楞嚴神呪を讀誦して、外敵降伏を祈られた。今、天下、臨濟宗の寺院にて、夏中、楞嚴會を營むのは、此時より始まつたのである。其他、有らゆる人を盡くして、命を天に任せて居つた有樣が、歷然として、史上に現はれて居る。

    佛光錄の中に、

    「弘安四年、虜兵百萬在博多、略不經意、但每月請老僧與諸僧下語、以法喜禪悅自樂、」'
  translation: '無礼きわまりない」といって、ただちに龍口で斬ってしまった。この時点で、時宗公の弘安四年の外敵襲来に対する方針は、すでに定まっていたと思う。

    これは決して軽はずみで、根拠のない判断ではない。他方で時宗公は、日本と相手国の高僧から、心の安定を得る奥義を教わるとともに、敵国の事情を聞き取っていた。鎌倉の幕府にいながら、大蒙古の状況は手に取るようにわかっていたと思われる。そうでなければ、いくら肝が斗ほども大きくても、あれほどの大英断はできない。

    時は弘安四年六月五日。果たして、蒙古の水軍が筑紫の海に姿を現した。軍船四十余隻、水兵十四万と記されている。その大軍が一度に、大きな口を開いてひとのみにするというように、日本へ攻めてきたのである。

    もちろん時宗公は、それ以前から国防に力を尽くし、戦いの備えを怠らなかった。今も博多に残る、十四、五里にわたる石の防壁を築き、鎮西探題の北条実政をはじめ、諸国から駆けつけた武士の軍勢は二十五万という。天下は、煮立つ大鍋のようなありさまだった。

    恐れ多くも亀山天皇は、御自身が国難を引き受けようと、伊勢の大廟に祈られた。『仏光録』などの書物によると、我が仏光国師は蒙古襲来の日から毎朝、楞厳神呪を読誦して外敵の降伏を祈った。今、全国の臨済宗寺院で夏の修行期間に楞厳会を営むのは、このときに始まる。そのほかにも、人として尽くせることを尽くし、運命を天に任せていたありさまが、歴史にはっきりと示されている。

    『仏光録』には、

    「弘安四年、敵兵百万が博多にいたが、時宗はほとんど意に介さなかった。ただ毎月、私とほかの僧たちを招いて禅の言葉を求め、仏法に触れる喜びと禅の悦びを自らの楽しみとしていた」'
  notes:
  - 兵船「四十餘艘」、兵数・距離・役職名などは原本通りであり、歴史的数値の校訂はしていない。漢文引用の返り点は省略した。
  - 「有らゆる人を盡くして」は人事を尽くす趣旨と解した。
  - 冒頭は前コマから続く。

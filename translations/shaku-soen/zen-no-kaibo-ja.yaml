  section: 大なる樂觀の上に／三、偉大なる宗教心
  original: '三、偉大なる宗教心


    四苦八苦が人生に於て免れ得ないものである以上、世の中は、まことに、不滿足に出來てをるものである。だから、悲觀する方面から見て行つたならば、儘ならぬ世の中、思ふ通りにならぬ世の中、悲しい苦しい詰らない人生である。さうして、此の悲觀的苦痛が、日夜に、我が心を責め苛なむ。かくして、悲觀の極、自然に、宗教的精神といふものが起つて來ることになるのである。この宗教的精神こそ、實に時間空間を貫いたところの大精神である。これこそ永久的精神と云ふべきものである。これを哲學的に說明せんとすると、なか〳〵六ケ敷しいが、平たく一口に言ふと、「神佛を祈れ、神佛を念ぜよ」の一言で盡きる。必ずしも佛教でなければならぬ、佛でなければならぬと狹い窮屈なことを言ふのではない。「あゝ神よ!」と渾然同化してしまふところを、云ふのである。門徒宗の信者は、南無阿彌陀佛の稱名で安心して死んで行く、加藤清正は、南無妙法蓮華經の七字の題目を旗印にして千軍萬馬の間を、無人の野を行くが如くに進んで行つた。'
  translation: '三　偉大な宗教心


    人生で四苦八苦を免れない以上、世の中は実に満足のいかないものとしてできている。だから悲観の側から見れば、ままならない世の中、思いどおりにならない世の中、悲しく、苦しく、つまらない人生である。そして、その悲観的な苦しみが昼も夜も心を責めさいなむ。こうして悲観が極まると、自然に宗教的な精神が起こってくるのである。

    この宗教的な精神こそ、時間と空間を貫く大きな精神であり、永遠の精神というべきものである。哲学的に説明しようとすれば大変難しいが、やさしく一言でいえば、「神仏に祈り、神仏を念じなさい」に尽きる。必ず仏教でなければならない、仏でなければならない、という狭く窮屈なことをいうのではない。

    「ああ、神よ！」と、すっかり一つになる、その境地をいうのである。浄土真宗の信者は、「南無阿弥陀仏」と名を唱えて、安らかな心で死んでいく。加藤清正は「南無妙法蓮華経」の七字を旗印にして、大軍の中を、誰もいない野原を行くように進んだ。'
  notes: []

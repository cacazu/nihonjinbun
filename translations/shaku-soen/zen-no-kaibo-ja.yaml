  section: 生死は一如なり／四、深草の閑居夜雨の聲
  original: 'ある、何も取り越し苦勞して色々と考へる必要は無いのである。如何に病魔に苦しめられても、如何に自由を奪はれても、自分の活動を續けて行くことさへ出來たならば、それは大自由であり大安心である。元來、生だとか死だとか云つて、深く考へ惱むべきものは無いのである。が、かやうに、生死は無いぞと、上から幾ら抑へつけても、下から〳〵と絕間なく生死が頭をもたげる。生死はないぞと理窟で會得しても、到底駄目である。生死のない境界に、自分の心を鍛鍊して至らなければならぬ。つまり、大悟徹底しなければならぬ。大悟徹底といつても、前に述べた漸源や關山國師の如き場合のみに限つたことでは無い。淨土眞宗ならば、他力的に、「無南阿彌陀佛」に成り切り、法華宗ならば、妙力的に、「南無妙法蓮華經」に成り切つてしまつた時、生が何處にあり、死が何處にあるか。共に一行三昧である。この境界に至れば、生だとか死だとか云つて、目にチラ附くものは無い。生が行きの道ならば、死は歸りの道である。道元禪師の偈に、生死可憐雲變更　迷途覺路夢中行

    只止一事醒猶記　深草閑居夜雨聲といふのがあるが、今ま、道元禪師の偈をもつて說けば、「生死憐む可し雲の變更」で、胸中に、何等、生死の滯ほるものが無い、生死を見ること浮雲の往來を見るが如くである。「迷途覺路夢中に行く」で、相對的に觀たならば、生も死も、悟りも迷ひも、有るには有るが、皆な手枕一睡の夢である。醒め來れば何物の存するものが無い。さて、かやうに、生死を透脫した境界は、「只だ一事を止めて醒めて猶ほ記す」で、悟つた身にも雨の降る日は雨の音が聞こえる。即ち、「深草の閑居夜'
  translation: 'なのだ。取り越し苦労をして、あれこれ考える必要はない。


    どれほど病気に苦しめられても、どれほど自由を奪われても、自分の活動を続けていくことさえできれば、そこには大きな自由と揺るぎない安心がある。もともと、生だの死だのと言って、深く考え悩むべきものなどないのである。


    しかし、「生も死もない」と上からいくら押さえつけても、下から下から、絶え間なく生死への思いが頭をもたげてくる。生死はないと理屈で理解しても、とうてい駄目だ。生死の区別にとらわれない境地まで、自分の心を鍛えて到達しなければならない。つまり、徹底した悟りを開く必要がある。


    徹底した悟りといっても、先ほどの漸源や関山国師のような場合だけに限らない。浄土真宗なら、阿弥陀仏の力に身を任せて「南無阿弥陀仏」そのものになりきる。法華宗なら、妙法の力によって「南無妙法蓮華経」そのものになりきる。そのとき、生がどこにあり、死がどこにあるだろう。どちらも、ただ一つの実践に心を集中しているのだ。この境地に達すれば、生だの死だのといって目の前にちらつくものはない。生が行きの道なら、死は帰りの道である。道元禅師に、次の偈がある。


    「生と死は、ああ、雲が姿を変えるようなもの。

    迷いの道も悟りの道も、夢の中を行くようなもの。

    ただ一つだけ、目覚めてもなお覚えている。

    深草の静かな住まいに聞いた、夜の雨の音を。」


    この偈に沿って説明すれば、「生と死は、雲が姿を変えるようなもの」とは、心に生死へのこだわりが何も残らず、生死を、浮き雲の往き来を見るように見ることだ。「迷いの道も悟りの道も、夢の中を行く」とは、相対的に見れば、生も死も、悟りも迷いも、あるにはあるが、どれも腕を枕にひと眠りするあいだの夢であり、目覚めてみれば何も残らないということだ。


    さて、このように生死を突き抜けた境地では、「ただ一つだけ、目覚めてもなお覚えている」。悟った身にも、雨の日には雨の音が聞こえる。つまり、「深草の静かな住まいに、夜の'

  section: 誰か言ふ弱き者と／三 大慈大悲の觀音菩薩
  original: 勇猛ばかりで出來るものでは無い。生命がけの仕事は、かうすれば自分の身は滅んでも他の大衆が利益幸福を得るといふ大慈大悲の精神から成し得られるので、單に自己一身の幸福をのみ希ふならば、何事も生命あつての物種である、一命を擲つて水火刀杖の難を冐すは、馬鹿〳〵しい極みとするであらう。田村麿將軍にしても、楠公父子にしても、天下國家を濟ひたい、晉く民衆の苦痛を除きたいといふ大慈大悲があつたからこそ、かくの如き働きが出來たのである。
  translation: 勇猛さだけではできない。命がけの働きは、こうすれば自分は滅びても大勢の人が利益と幸福を得られる、という大慈大悲の精神からこそできる。自分一人の幸福だけを願うなら、何をするにも命があってこそであり、命を投げ出して水や火、武器の危険を冒すのは、実に馬鹿げたことだと思うだろう。田村麻呂将軍も、楠木正成・正行父子も、天下国家を救いたい、広く民衆の苦しみを取り除きたいという大慈大悲があったからこそ、あのような働きができたのである。

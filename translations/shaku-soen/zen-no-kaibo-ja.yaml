  section: 夙に起き時を使へ／五、噓は惡の始まり
  original: '五、噓は惡の始まり


    嘘を吐くといふことは、一番、惡いことである。すべての惡い行ひは、此の嘘を吐くといふことから始まるのである。こんな事は、くどく言ふまでも無く、分つて居ることであるが、殺人だの、姦淫だの、强盜だの、其他の罪惡の源を訊してみると、嘘を吐くといふことが土臺になつて居るといつてよい。噓も方便などゝ云ふ誠に淺薄な考へから、一時逃れの間に合せを言ふのが、一ばん惡い。また、たとひ、罪人とまでならずとも、政治家でも、實業家でも、其他すべての階級の人が、謂ゆる權謀術數的に、一時を胡魔化さうといふ考へが動機となつて遣つた仕事は、到底、駄目である。結局のところ、正直でなければ、物事の終りを全うすることは出來ない。一國の外交などにしても、衲は、さうであらうと信ずる。外交の秘決は、嘘を吐くにあらずして、正直なところにある筈である。そこで、世間には、嘘から出た眞、眞から出た噓といふことがあるが、時には誠心誠意から出たことが、他人には嘘のやうに思はれることがある。それは嘘にして其實は嘘ならず。ところが、もと〳〵、何か心にたくらむ事があつてやる事は、表面は眞のやうに見えるが、永續はしない。'
  translation: '五　嘘は悪の始まり


    嘘をつくことは、何よりも悪いことである。すべての悪い行いは、嘘をつくことから始まる。こんなことは、くどく言うまでもなくわかっていることだが、殺人、姦淫、強盗など、さまざまな罪悪の根源を尋ねれば、嘘をつくことが土台になっているといってよい。

    「嘘も方便」などという浅はかな考えから、一時逃れの間に合わせを言うのが、いちばん悪い。また、たとえ罪人にはならなくても、政治家、実業家、そのほかどの階層の人でも、策略をめぐらせてその場をごまかそうという考えから行った仕事は、結局うまくいかない。最後まで物事をやり遂げるには、正直でなければならない。

    一国の外交でも、私は同じだと信じる。外交の秘訣は、嘘をつくことではなく、正直さにあるはずである。世の中には「嘘から出た真」「真から出た嘘」ということがある。心から誠実に述べたことが、人には嘘のように思われることもある。それは嘘に見えて、実は嘘ではない。反対に、もともと心に何かをたくらんで行うことは、表面は本当らしく見えても、長続きしないのである。'

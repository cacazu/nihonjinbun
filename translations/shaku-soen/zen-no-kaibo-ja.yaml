  original: 「上天の事は聲もなく臭ひもなし」と言はれたやうな意味で、獨立して改めず、其の物は對待的のものでは無い、嶄然として獨立して居る。凡そ、世の中のものは、皆な對待的のもので、天あれば地あり、陰あれば陽あり、山あれば川あり、男あれば女あり、皆な相對して相手方がある。今ま「物あり」と指したのは、獨立的で、改まらぬもので、昔にあつても今まにあつても變らず、此處に在つても彼處に在つても同じものである。周行して殆からず、周行は普く行はると讀んで宜しい、そんな獨立的の物であるが、その獨立的の物は、離れて何か別に一つあるかと云ふに、左うでは無い。獨立といふことを、佛教の言葉で言ひ換へると、平等的のものである。平等ではあるが、直きに差別の上に行はれてある。と云つて、相對的のものでは無い。獨立して改めず、それでは、一切の現象から離れて獨立的のものかと言へばさうでも無い。何事にも行き渡つて居る。地を這つて居る蟻の鬚のやうな小さなものにも、野原に咲いて居る名もない小さな花にも行き渡つて居る。而して、小さな花は、小さな一つの天地を造つて居る。小さな蟻は、小さな宇宙を含んで居る。テニソンは、「一輪の花を知れば、天地、及び、一切萬物を知る。」と云つて居る。やはり、普く行はれて殆からずの義であらうと思ふ。その「物」にどう云ふ名前があるかと云ふに、名はない。名が無ければ、人に示すことが出來ないから、已むを得ず、字して、即ち、名づけて「道」といふのである。
  translation: '「天の営みには、音もなく、においもない」と言われたが、それと同じような意味である。「独立して変わらない」とは、そのものが相対的なものではなく、際立って、他に頼らず存在しているということだ。


    この世のものは、みな相対的で、天があれば地があり、陰があれば陽があり、山があれば川があり、男がいれば女がいて、どれにも向かい合う相手がある。ところが今、「物がある」と指したものは、独立していて変わらない。昔でも今でも変わらず、ここにあっても、あそこにあっても、同じものなのだ。


    「あまねく行き渡って、尽きることがない」。周行は「あまねく行われる」と読めばよい。このように独立したものではあるが、では、ほかのものから離れて、何か一つ別に存在するのかというと、そうではない。「独立」を仏教の言葉で言い換えれば、平等ということだ。平等でありながら、そのまま、個々の違いの上に働いている。だからといって、相対的なものなのではない。独立して変わらないが、あらゆる現象から離れて独立しているのかといえば、それも違う。何にでも行き渡っているのだ。地面を這う蟻の触角のような小さなものにも、野原に咲く、名もない小さな花にも行き渡っている。そして、小さな花は、それだけで小さな一つの天地を作り、小さな蟻は、小さな宇宙を含んでいる。


    テニソンは、

    「一輪の花を知れば、天地と、あらゆるものを知る。」


    と言われている。これも、あまねく行き渡って尽きない、という意味だろうと思う。その「物」に、どんな名前があるのかといえば、名はない。しかし名がなければ、人に示すことができないから、やむを得ず、仮に名づけて「道」というのである。'
  notes:
  - 冒頭は前コマからの続き。

  section: 大なる樂觀の上に／二、四苦八苦の人生
  original: 智慧づくに從つて、見るもの聞くものについて色々訊ねる、初めは名を聞き、次ぎには意味を訊づねる、そんな順序で、一般の人が、初めは普通の事柄を知ることで滿足するが、だん〳〵知識が進むに從つて、學問的に知りながら、更に進んで哲學的に知りたくなり、それでも安心が出來なくなつて、遂ひには宗教界に入ることになる。名利欲といふのは、利欲と名聞欲とを一絡にして云つたもので、世間の人々が、皆な、知識は貴い、學問は大切であると叫んで居る。勿論、それに違ひはないものゝ、併し乍ら、かく叫んで居る人々の胸中を解剖してみると、その殆ど大部分が、自分の利益のため、自分の名譽のためといふことに歸するであらうと思ふ。成程、口では、社會民衆のためである、天下國家のためであると言ふ。幾分は、社會民衆のためであり、天下國家のためでもあらう。が、全然、自己といふものを閑却する譯にも行くものでない。然らば、口では如何に立派に道德者らしいことを述べて居つたところで、腹の中は、自分の名譽のため、自分の利益のためであることは明らかである。要するに、何人も、食はず飮まずには、働くことも學問することも出來ない以上、此の利欲·名聞欲は一般人の通有性ともいふべき欲望である。それから、生存欲といふのは、何時までも此世に生存してゐたい、死にたく無いといふ欲望であつて、昔は、遠く海に浮んで、不老不死の仙藥を求めた古人もあつたくらゐで、これも殆ど一般人の通有性である。如何なる貪欲漢であつても、若し生命に代へ得るといふならば、山ほど積んだ金も要らぬといふであらう。天子の貴い位も、或は擲つて顧みないかも知れない。有らゆる欲望が、此の生存欲に越すものは無からうと思ふ。或る立派な人が、臨終に際して、「あら死にともな死にともな」といふ辭世の句を吐いたといふのは頗る面白いと思ふ。人間は、誰れでも、以上の三つの大なる欲望がある。が、それは、誰れも滿足され得るものであらうか、いくら欲しい〳〵と希つても、なか〳〵思ふ通りに得られ
  translation: '物事がわかるようになると、見るもの聞くものについて、いろいろと尋ねる。初めは名前を聞き、次には意味を尋ねる。それと同じように、一般の人も、初めは普通の事柄を知ることで満足する。しかし、知識が進むにつれて学問的に知りたくなり、さらに哲学的に知りたくなる。それでも心が落ち着かず、ついには宗教の世界に入ることになる。

    名利欲とは、利益を求める欲と、名誉を求める欲をまとめていったものである。世間の人は皆、知識は尊い、学問は大切だと叫んでいる。もちろんそのとおりだが、そう叫ぶ人たちの胸の内を分析してみれば、ほとんどは自分の利益のため、自分の名誉のためということに帰着すると思う。なるほど、口では社会の人々のため、国家のためだと言う。いくらかは、社会の人々のため、国家のためでもあろう。しかし、自分というものをまったく忘れ去るわけにもいかない。そうであれば、口でどれほど立派に道徳家らしいことを述べても、胸の内では、自分の名誉のため、自分の利益のためであることは明らかだ。要するに、誰も飲まず食わずで働いたり学んだりできない以上、利益や名誉を求める欲は、人々に共通する欲望といってよい。

    次に生存欲は、いつまでもこの世に生きていたい、死にたくないという欲望である。昔には、はるかな海へ船を出して、不老不死の仙薬を求めた人もいたほどで、これもほとんどの人に共通している。どんなに貪欲な人でも、命の代わりになるなら、山ほど積んだ金もいらないと言うだろう。天子という尊い地位も、投げ捨てて顧みないかもしれない。あらゆる欲望のうち、この生存欲を超えるものはないと思う。ある立派な人が臨終に、「ああ、死にたくない、死にたくない」という辞世の句を詠んだというのは、たいへん面白い。

    人間には誰でも、以上の三つの大きな欲望がある。だが、その欲望を誰もが満たせるだろうか。いくら欲しい、欲しいと願っても、思いどおりに手に入るわけでは'
  notes:
  - 冒頭はscan75から、末尾はscan77へ続く。

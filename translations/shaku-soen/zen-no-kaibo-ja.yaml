  section: 中澤道二翁の敎訓
  original: '中澤道二翁の敎訓


    獅子迷子の訣について、今、一つ、お話をしましよう。昔、江戶の牛込邊に住んでをつた人に、藤村某といふのがあつた。當時は、心學の盛んな時分であつたから此人も中澤道二翁を信じて敎へを受けて居つた。翁は有名な心學の大家である。其人が臨終の時に、遺族に向つて、「自分が死んだ後は、中澤先生を、師とも親とも仰いで、又た、死んでゆく此の自分だと思つて、家事萬端、一々、先生の御指圖を受けよ」と遺言しておいた。家族も、其後は、遺言どほりにして居つたが、姉娘への養子も出來、跡の相續も決定つたが、妹娘は性質も十人並みで、何一つ申し分は無かつたけれど、何うしたものか二十六歲まで緣付かなかつた。辛うと二十七歲の時、或家から貰ひ度いと云つて來た。先方は舅姑もあり、小舅小姑もあり、其上に繼子が三人もある家だから、誰れにしても、一寸、六ケ敷い家だ。併し、母親が云ふには、「齡たけた娘であつて見れば、花嫁にも出られまいから、所望に會ふたを幸ひに遣つたら何うだらう」と内輪の相談も略ぼ決定つた。そこで、此れも道二先生へ御相談せねばならぬと、母親は娘を連れて先生を訪ねた。扨て、母親が、「此れなる娘も、今度、何某方から所望されまして、先方は然か〳〵斯やうな家で、あまり望んだ家でも御座いませぬが、齡とつた娘のことでありますから、何事も因緣事と諦めまして遣はし度う存じますが、如何いたしたもので御座いませう」と云ふと、翁は、「それは結構なことで御座る。併し、舅姑もあり、小舅小姑もあり、その上、繼子の三人もあると云へば、世間並みで云ふと、ちと六ケ敷い家のやうだが、いや、'
  translation: '中沢道二翁の教訓


    「獅子迷子の訣」について、もう一つお話ししよう。昔、江戸の牛込あたりに藤村某という人が住んでいた。当時は心学が盛んで、この人も中沢道二翁を信頼し、教えを受けていた。翁は心学の有名な大家である。その人は臨終に家族に向かって、

    「私が死んだ後は、中沢先生を師とも親とも仰ぎ、また死んでゆくこの私だと思って、家のあらゆる事柄について、一つ一つ先生のご指図を受けなさい」

    と遺言した。家族もその後は遺言どおりにしていた。姉娘には婿養子が決まり、家の相続も定まったが、妹娘は性質も人並みで、何一つ申し分はないのに、どうしたわけか二十六歳まで嫁ぎ先が決まらなかった。ようやく二十七歳のとき、ある家から迎えたいといって来た。先方には舅と姑もおり、夫の兄弟姉妹もおり、その上、先妻の子が三人もある家だったので、誰にとってもちょっと難しい家だった。しかし母親は、

    「年のいった娘なのだから、初婚同士の縁談は難しかろう。望まれたのを幸いに、嫁がせてはどうだろう」

    といい、内輪の相談もほぼまとまった。そこで、これも道二先生に相談しなければと、母親は娘を連れて先生を訪ねた。さて母親が、

    「この娘も、今度、あるお宅から望まれました。先方はこれこれこういう家で、あまり希望にかなう家でもございませんが、年を取った娘のことですから、何事も縁だと受け入れて嫁がせたいと思います。どうしたものでございましょう」

    というと、翁は、

    「それは結構なことです。しかし舅も姑も、夫の兄弟姉妹も、その上、先妻の子が三人もいるとなれば、世間一般にいえば少々難しい家のようだが、いや、'

  section: 武士道を他にも及ぼせ／七 佛敎を誤解する勿れ
  original: '七、佛敎を誤解する勿れ


    凡そ、佛敎では、佛陀と吾人と其の根抵が同一だと見てをるが、外敎では神と人とは全く別なものとしてある。だから、智慧を研いて、宗敎の眞味を解するが如き'
  translation: '七　仏教を誤解するな


    そもそも仏教では、仏陀と私たちとは根底が同じだと見ているが、ほかの宗教では神と人とはまったく別のものとしている。だから、智慧を磨き、宗教の本当の味わいを理解するようなこと'
  notes:

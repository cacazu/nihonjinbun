  section: 禪と鎌倉武士／六 歷史の事實に就て
  original: '六、歷史の事實に就て

    扨て、歷史の事實について話して見ようと思ふ。先づ鎌倉時代の禪に因緣ある北條氏を擧げて見ると、北條氏は九代と云ふが、二代は執權者が短命で數に入らぬくらゐで、事實に於ては七代である。北條氏が、身は陪臣から起つて天下の政柄を執つて七代まで之れを傳へたといふのは、傳へらるべきところの原因があつてゞあらうと思ふ。

    且つ、賴襄氏が、其の遺稿の中に書いて居るところに依ると、唯だ北條氏の惡いところばかり書いて、而かも、それが、禪を信じたから來た惡感化のやうに毒筆を弄して、唯だ彼の義時、高時のみを擧げて、恐れ多くも、一天萬乘の君を孤島に流し奉り、その他、悖戾な行動をしたのは、彼等が佛教を信じて、就中、禪を修めたからだと、巧みな文章を以て書いて居る。'
  translation: '六　歴史上の事実について

    さて、歴史上の事実について話してみよう。まず、鎌倉時代に禅と縁の深かった北条氏を取り上げる。北条氏は九代といわれるが、そのうち二代は執権が短命で、数に入らないほどだから、実際には七代である。北条氏は陪臣、つまり天皇から見れば臣下の家来という身分から起こり、天下の政治の実権を握って七代まで伝えた。それには、そう伝えられるだけの理由があったのだろうと思う。

    ところが頼襄氏は、遺稿の中で北条氏の悪いところばかりを書き、それも禅を信じたための悪影響であるかのように、悪意のある筆を振るっている。ただ義時と高時だけを取り上げ、恐れ多くも天皇を孤島に流し申し上げ、その他道理に背く行動をしたのは、彼らが仏教を信じ、なかでも禅を修めたためだと、巧みな文章で書いている。'
  notes:
  - 頼襄は頼山陽。執権の代数などの歴史叙述は、著者の記述に従った。
  sequence: 117
- id: zen-091-01
  scan: 91
  section: 禪と鎌倉武士／六 歷史の事實に就て
  original: 賴襄は、物知りと云はれてをるにも拘らず、大いに事實を誤つてをるのは何事ぞ。元來、義時、高時は、禪に參じた者でない。たとひ、彼等は、圓顱方袍の姿をしてゐても、眞の宗旨には門外漢であつた。人もあらうに、此の二人を、北條氏の代表的人物であるかの如くに引き出したのは、偏見も亦た甚しい。寧ろ、深く、佛教を信じ、禪を修したのは、泰時、時賴、時宗の諸公である。以下、少しく、其の事實を擧げて見ようと思ふ。兎に角、北條氏が、彼の立派な治績を擧げた裏面を窺つて見ると、泰時の如き、最も敬虔なる佛教信者である。
  translation: 頼襄は物知りといわれているのに、これほど事実を誤っているのはどういうことか。そもそも義時と高時は、禅に参じた人ではない。たとえ頭を丸めて法衣を着ていても、禅の真の教えには門外漢だった。ほかにも人物がいるのに、この二人を北条氏の代表のように取り上げたのは、ひどい偏見である。むしろ深く仏教を信じ、禅を修めたのは、泰時、時頼、時宗の諸公だった。以下、その事実を少し挙げよう。ともかく、北条氏があれほど立派な政治の実績を挙げた舞台裏を見ると、泰時などはきわめて敬虔な仏教信者だったのである。
  notes: []
  sequence: 118
- id: zen-091-02
  scan: 91
  section: 禪と鎌倉武士／七 武士道を組織的にした
  original: '七、武士道を組織的にした

    或時、泰時が、明惠上人に、治國の要を問うた時、上人は、

    「國を治むるは、病ひを治むるが如く、宜しく其の因を察せねばならぬ。公、先づ、其の欲を去るべし。欲は國を亂すの本なり」

    と云はれた。また、泰時は、上人より、

    「あるべきやうは」

    と云ふ七字の教へを受け、之れを堅く守つて、實行したので、彼れが如く立派に、政治上に於ても、立法上に於ても、其の成績を擧げることが出來たので、當時、武士道を組織的にしたのは、泰時、與つて力ありと云つてよいと思ふ。

    「あるべきやうは」

    この言葉は古臭いかも知れぬが、實に、千古の名言で、これを實行してこそ、はじめて、國家の秩序も保たれ、また、健全なる國家が形造られるのである。

    外史か何かにあつたと思ふが、泰時が明惠上人から、

    「天下を治めんとする者は、無欲といふことを守らねばならぬ」

    と諭され、扨て、

    「自己一人は之れを實行しても、民百姓が之れを守らねば如何んともすることが出'
  translation: '七　武士道を体系立てた人

    あるとき、泰時が明恵上人に国を治める要点を尋ねると、上人はいった。

    「国を治めるのは病気を治すのと同じで、まず原因を見きわめなければなりません。あなたは、まず自分の欲を捨てなさい。欲は国を乱す根本です」

    また泰時は上人から、「あるべきやうは」という七文字の教えを受けた。自分はどうあるべきか、というこの教えを固く守って実行したから、政治でも立法でも、あのような立派な成果を挙げられたのである。当時、武士道を体系立てるうえで、泰時は大きな力を果たしたといってよいと思う。

    「あるべきやうは」。古くさい言葉かもしれないが、実に時代を超えた名言である。これを実行してこそ、初めて国家の秩序が保たれ、健全な国家が形づくられる。

    『日本外史』か何かにあったと思うが、泰時が明恵上人から、

    「天下を治めようとする者は、無欲であることを守らなければならない」

    と諭されたとき、

    「私一人が実行しても、民百姓が守らなければ、どうすることもでき'

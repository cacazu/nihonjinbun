  section: 正法に不思議なし／二、百丈の獨坐大雄峰
  original: '二、百丈の獨坐大雄峰


    昔、一僧があつて、百丈懷海禪師に向つて、

    「如何なるか是れ奇特の事」

    といふ問ひを發した。絕學無爲の閑道人たる大悟底の人の上に、奇特とか不奇特といふことが御座いませうかといふ表面の意味であるが、句裏に機を藏して居る。敢て百丈和尙の虎鬚を撫でようとする意氣込みがある。すると、百丈和尙は、

    「獨坐大雄峰」

    といつて答へられた。此の百丈といふのは百丈和尙の住してをられる山の名であつて、その高さが百丈もあるといふので斯ういふ名がある。實は、大雄山といふ山の異名である。百丈和尙の答へは、奇特も何もない、衲は、此の大雄峰に獨坐してをるよといふのである。これは、百丈和尙は、大雄山の主人公であるから斯う云はれたので、釋迦如來ならば「獨坐靈鷲山」と云はれたであらう、阿彌陀如來ならば「獨坐極樂世界」と云はれたであらう。兎に角、何に食はぬ顏附きをして、「獨坐大雄峰」の一言で此僧の力量を點檢された。此僧、唯だものでは無い、「獨坐大雄峰」の一言で、百丈和尙が、兩頭の機に墮してゐないのを認め、あゝ難有いといはぬばかりに直ちに禮拜した。すると、百丈和尙は、ピシリと此僧を打たれた。これは百丈和尙の活機活用、天魔外道も窺ふに道なき態度を示されたものである。'
  translation: '二　百丈の「大雄峰に一人坐る」


    昔、一人の僧が百丈懐海禅師に、「特別にすぐれた事とは、何ですか」と尋ねた。学ぶべきことを尽くし、作為なく安らかに道を生きる、大悟した人に、特別だとか特別でないとかいうことがあるのか、というのが表向きの意味である。しかし、言葉の裏には鋭い働きが隠れている。あえて百丈和尚という虎のひげに触れようとする、挑戦的な気持ちがある。

    百丈和尚は、「大雄峰に、ただ一人坐っている」と答えた。百丈というのは、和尚が住む山の名で、高さが百丈もあることからこう呼ぶ。実は大雄山という山の別名である。和尚の答えは、「特別なことなどない。私はこの大雄峰に一人坐っているよ」という意味である。百丈和尚は大雄山の主人なので、こう言った。釈迦如来なら「霊鷲山に一人坐っている」、阿弥陀如来なら「極楽世界に一人坐っている」と言っただろう。

    ともかく、何食わぬ顔で、「大雄峰に一人坐っている」の一言によって、この僧の力量を見極めたのである。僧もただ者ではない。その一言から、百丈和尚が、二つに分ける考え方に陥っていないと認め、ああありがたい、と言わんばかりに、すぐさま礼拝した。すると百丈和尚は、この僧をぴしゃりと打った。これは百丈和尚の生きた働きであり、天魔や仏道に背く者にも、その境地をうかがうすべのない態度を示したのである。'

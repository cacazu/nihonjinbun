  section: 生死は一如なり／二、吾人は大生命の一部分
  original: だから、此れが生である、此れが死であると云ふものは、決して、無いのである。生死は全く一如である。これを生と名くるならば生でもよいが、死と名づくるならば死でもよいのである。生と名づけるならば、どこまでも生の一つであつて、死といふものは無いのである。死と名づけるならば、どこまでも死の一つであつて、生といふものは無いのである。如何なる宗教でも、また、如何なる哲學でも、此の端的を、確乎、我がものとして體得しておかなければ、決して眞箇の大安心は得られるもので無い。
  translation: 'だから、これが生だ、これが死だと区切れるものは、決してない。生と死は、まったく一つなのである。これを生と名づけるなら生でもよいし、死と名づけるなら死でもよい。生と名づけるなら、どこまでも一つの生であって、死というものはない。死と名づけるなら、どこまでも一つの死であって、生というものはない。


    どのような宗教でも、どのような哲学でも、この核心を確かに自分自身のものとして体得しなければ、本当の、揺るぎない心の安らぎは、決して得られない。'

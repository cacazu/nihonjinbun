  section: 無邊の風月／六、瑞巖和尙の自問自答
  original: 六、瑞巖和尙の自問自答結局に至つて、今までの意味を總括して居る。即ち、「門を叩けば處々人の答ふるあり」で、何も神や佛にたづねるまでも無い、吾れ、即ち、神にも佛にも變らぬ精神を具して居る。だから、自ら自身に就いて尋ねたら宜しい。外に向つて此の法をたづねんでも、內に向つてウンと承知すれば、それで可いといふまでのことに歸する。それであるから、自分自身の心に向つて、如何に〳〵と尋ねて已まなかつたならば、「無邊風月眼中眼、不盡乾坤燈外燈、柳暗花明十萬戶」の其の面白味が分つて來るのである。また、こゝに、思ひ出したが、瑞巖和尙と云へば、禪門に於ては、實に有名な和尙である。此の和尙は、平生、自身に向つて、
  translation: '六　瑞巌和尚の自問自答


    最後の句は、ここまでの意味をまとめている。「門をたたけば、どこでも答える人がいる」。神や仏に尋ねるまでもない。自分自身が、神や仏と変わらない精神を備えているのだから、自分自身に尋ねればよい。外へ向かってこの教えを求めず、内に向かって、うんと納得すればそれでよい、ということになる。


    だから、自分の心に向かって、「どうなのか、どうなのか」と問い続ければ、「果てしない風月、目の奥の目。尽きることのない天地、灯の外の灯。柳は暗く花は明るく、十万の家々を彩る」という、その面白さがわかってくるのである。


    また思い出したが、瑞巌和尚といえば、禅の世界では実に有名な和尚だ。この和尚は、ふだん、自分自身に向かって、'

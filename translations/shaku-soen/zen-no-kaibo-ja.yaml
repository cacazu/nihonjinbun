  section: 武士道を他にも及ぼせ／六 解信仰信の二門
  original: '六、解信仰信の二門


    宗敎の情想は、感謝の念にあつて、難有しと言ふのにある。神の德、佛陀の慈光に對して、難有いといふ情想あつて、爰に、初めて、猛然たる勇氣が起るのである。此心を以て、農家は農に、商家は商に、工業家は工に、いそしみ勵み努めたならば積極的の効果を得べきは必然である。けれども、此の宗敎上の信仰も惡用せられては、現在ばかりで無く、未來までもと靑年男女が痴情の果てに一蓮托生などと來ては、まことに困つたものである。凡そ、宗敎は、難有い、恭いと仰いで信ずることを得るものは、まことに幸ひであるけれども、人々、機類、萬差なるが故に、一面には解信からも入らなければならぬ。經文に斯う仰せらるゝから信ずるとか、バイブルの敎ゆるところは斯くの如き故に信ずるとか云ふのは仰信である。'
  translation: '六　理解して信じる道、仰いで信じる道


    宗教の心は感謝の念にあり、ありがたいと思うことである。神の徳、仏陀の慈悲の光に対して、ありがたいという思いがあってこそ、初めて猛烈な勇気が起こる。この心で、農家は農業に、商家は商業に、工業家は工業に、いそしみ励み努めるなら、積極的な効果を得られることは必然である。

    しかし、この宗教上の信仰も悪用されては困る。現世だけでなく来世までも一緒にと、若い男女が情愛に迷った末に、一蓮托生と称して心中するようでは、まことに困ったものである。

    そもそも宗教を、ありがたい、尊いと仰いで信じられる人は、まことに幸せである。しかし人々の性質や資質はさまざまなので、一方では、理解して信じる道からも入らなければならない。経文にこう説かれているから信じるとか、聖書がこのように教えているから信じるとかいうのは、仰いで信じる「仰信」である。'
  notes: []

  section: 誰か言ふ弱き者と／二 電光影裏春風を斬る
  original: '二、電光影裏春風を斬る

    鎌倉圓覺寺の開山である佛光國師は、宋末の禪僧で、北條時宗に迎へられて、日本に渡來されたのであるが、國師がまだ支那に居られた時のことである、北方蒙古の忽必烈が、元の大軍を率ゐて宋に攻め入つた。國師は溫州の能仁寺に難を避けてをられたが、此寺も賊兵の荒すところとなり、一人の兵が大刀を揮つて國師の頭に加へようとした。其時、國師は、端坐したまゝ泰然自若として、

    乾坤無地卓孤笻　且喜人空法亦空

    珍重大元三尺劒　電光影裏斬春風

    と一偈を唱へながら、神色共に變らなかつた。それを見た元の兵は、驚いて、國師が生死を透脫してをられる大德を禮讃しつゝ去つてしまつた。これは、全く、國師に執金剛神としての活作用があつたからのことである。大元三尺の劒を以て自分の頭に加へられても、キラリ閃く電光影裡に春風を斬るが如くに美しと感ずる、恐怖の念などの起るものでは無いと喝破されたのが此偈である。

    この佛光國師に師事した女性に如大禪尼といふ勝れた方があつた。美濃國興性寺に住し、京都の眞如寺にも關係された方ぢや。出家前の俗名を千代能と申され、當時、鎌倉幕府の執權であつた時宗公の一族なる北條顯時の女であつた。父の顯時も祖父の實時も、亦た、兄の貞顯も、殺伐な戰國時代には珍らしい學問好きの人々であつた。かの有名な金澤文庫を武州金澤に建てゝ、和漢の有らゆる書物を蒐めて以て講學の便に供されたのは、實に此の北條顯時の一家であつた。

    千代能は、かゝる一族の中に成育したのであるから、當時の女流には珍らしい學者となつて、和漢古今の學問に精通してをつたが、禪の教理にも心を注ぎ、佛光國師について、朝參暮請の苦辛を積まれたものだ。學問が群を拔いてをる上に、更に參禪によつて鍛へられたのであるから、千代能の見識は、いよ〳〵尋常婦女子の及'
  translation: '二　稲妻の光の中で春風を斬る

    鎌倉の円覚寺を開いた仏光国師は、宋末の禅僧で、北条時宗に招かれて来日した。その国師がまだ中国にいたころ、北方蒙古のフビライが元の大軍を率いて宋へ攻め込んだ。国師は温州の能仁寺へ難を避けていたが、その寺も兵に荒らされ、一人の兵士が大刀を振りかざして国師の頭に斬りかかろうとした。そのとき国師は、姿勢を正して座ったまま、少しも動じず、次の偈を唱えた。

    「天地の間に、一本の杖を立てる場所さえない。

    それでも喜ばしい、人も空なら、あらゆるものもまた空だ。

    大元の三尺の剣よ、どうぞ存分に。

    稲妻のひらめきのうちに、春風を斬るだけのこと」

    そう唱えて、心も顔色も変わらなかった。それを見た元の兵士は驚き、生死の束縛を超えている国師の大徳をたたえて、立ち去った。これはまったく、国師に執金剛神としての生きた働きがあったからである。元の三尺の剣を頭に振り下ろされても、きらりと光る稲妻の中で春風を斬るように美しいと感じ、恐怖など起こらない、といい切ったのがこの偈なのだ。

    この仏光国師に師事した女性に、如大禅尼という優れた人がいた。美濃の興性寺に住み、京都の真如寺にも関係した人である。出家前の名を千代能といい、当時の鎌倉幕府の執権、時宗公と同族の北条顕時の娘だった。父の顕時も、祖父の実時も、兄の貞顕も、殺伐とした戦乱の時代には珍しい学問好きだった。有名な金沢文庫を武蔵国の金沢に建て、日本と中国のあらゆる書物を集め、学問に役立てたのは、この北条顕時の一家である。

    千代能はそういう一族に育ったので、当時の女性としては珍しい学者となり、日本と中国の古今の学問に通じていた。さらに禅の教えにも心を注ぎ、仏光国師のもとで朝夕教えを求め、苦労を重ねた。学問が抜きん出ていたうえに、参禅によって鍛えられたので、千代能の見識は、いよいよ普通の女性には及び'

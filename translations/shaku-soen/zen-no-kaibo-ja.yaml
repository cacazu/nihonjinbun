  section: 支那及び支那の宗敎／一、尨大なる國土
  original: '一、尨大なる國土


    支那は元來、不可解の國である。故に、これを全體にわたつて、一言もつて批評し去ると云ふことは出來ぬ。即ち、支那は、觀察次第によつて、如何やうにも批評されるのである。支那を、大と稱すれば大と言ふことが出來、小と見れば小と見ることも出來る。其の大なる點を擧ぐれば、第一に其の領土である。支那の面積は四百二十四萬方里と稱せられ、我が日本の面積のわづか四萬方里なるに比ぶれば、その廣大なるや、言を俟つまでもない。第二は、此の土地の中に包有せられたる自然の天惠である。即ち、大河は縱橫に流れ、大野平原は南北に續き、五穀豐饒、交通運輸の便利開け、加ふるに、地下には無盡藏とも稱すべき鑛物が埋藏されてある。楊子江の如き、その本流、支流、及び、それに連なる湖沼の類を合すれば、その面積、優に我が本土に比す可きものでみな航運に利用され得るのである。第三は、その人民である。支那の人口については、種々の說あるも、普通、四億と稱せられ、實に世界人口の約四分の一を占めてをる。而して、實に、その數に於て大なるのみならず、四千年來の歷史と文明とを有し、多數の人物を出し、今日にいたるまで、形而上にも、幾多、感化功績を遺してをるが、形而下、即ち、物質的方面に於ても、始皇の萬里長城、煬帝の大運河の如き、稀世の遺跡を有してをる。殊に驚くべきは、その繁殖力と勞働力である。繁殖力について云はゞ、四千年來、天變地異、惡疫流行少からず、外患內亂、洪水飢饉屢々あつたにもかゝは'
  translation: '一　広大な国土

    中国はもともと、容易には理解できない国である。だから、その全体を一言で批評し尽くすことはできない。どこから観察するかによって、どのようにも評せるのである。

    中国を大きいといえば大きいといえるし、小さいと見れば小さいともいえる。大きな点を挙げれば、第一は領土である。中国の面積は四百二十四万平方里とされ、日本の面積がわずか四万平方里であるのと比べれば、その広大さはいうまでもない。

    第二は、その土地に包まれた自然の恵みである。大河が縦横に流れ、大きな平原が南北に続き、穀物は豊かに実り、交通・運輸の便も開けている。そのうえ地下には、無尽蔵ともいえる鉱物が埋まっている。長江などは本流、支流、つながる湖沼を合わせれば、その面積は優に日本の本土に匹敵し、すべて水運に利用できる。

    第三は人民である。中国の人口には諸説あるが、普通は四億といわれ、世界人口の約四分の一を占めている。単に数が多いだけでなく、四千年の歴史と文明があり、多くの人物を生んで、今日まで精神の面でもさまざまな影響と功績を残してきた。物質の面でも、始皇帝の万里の長城や煬帝の大運河のような、世にもまれな遺跡がある。

    とりわけ驚くべきは、その繁殖力と労働力である。繁殖力についていえば、四千年の間、天災や悪疫の流行も少なくなく、外国からの侵攻や内乱、洪水や飢饉もしばしばあったにもかかわ'
  notes:
  - 「支那」は当時の中国の呼称。訳文では中国とする。この章の国民性・宗教についての一般化や差別的表現は著者の時代的見解として訳し、訳者が是認するものではない。面積・人口等の数値も執筆当時の記述のまま。末尾はscan161へ続く。
  sequence: 229
- id: zen-161-01

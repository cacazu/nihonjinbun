  section: 禪と鎌倉武士／五 日本の敵は何んであるか
  original: '五、日本の敵は何んであるか

    若し、衲をして、前の識者の言を借り來つて、日本の敵は何んであるかと言はしめたならば、日本の敵は輸出の超過でも無い。輸出の超過が幾億圓などゝ浮か〳〵言つてをるのも敵か知らぬが、併し、小敵である。成金が何うの斯うのと云つて居る、それも一つの敵であらうが、併し、成金を直ちに敵と云ひ得られない。言ひ得られても、それは小敵である――小敵とても侮つては大變であるが――衲は極く單純なるところの物質主義、極端なるところの黃金崇拜、そして、それに伴ふ、淫靡、奢侈、怠惰、墮落、これは我國の强大なる敵であらうと思ふ。實に大々的强大なる敵であらうと思ふ。

    日本の國家は、此の通りにして行つたならば、間もなく亡びるかも知れぬと嘆じた學者もある。これは極言である。極言は衲共の如き者には言ひ度くない。が、併し同感である。衲は泣き言をいふのは大嫌ひであるが、今日、世上の有樣を見ては、辨慶ぢやないが泣かざるを得ない。我が國民精神の統一は如何ん、精神界の現象は如何ん。その紛々芸々たる亂麻の如き狀態を悲觀すれば、我が國民の精神上の危機と言つて宜からう。

    現に、我國には、耶蘇教もあり、佛教も固よりある。佛教にも各宗派があり、耶'
  translation: '五　日本の敵は何か

    先ほどの識者の言葉を借りて、私が日本の敵は何かといわなければならないなら、日本の敵は輸出超過でもない、と答える。輸出超過が何億円になったなどと浮かれていることも敵かもしれないが、小さな敵である。成金がどうのこうのといわれる。それも一つの敵なのだろうが、成金をすぐに敵と呼ぶことはできない。呼べたとしても、小さな敵である。小さな敵でも侮れば大変なことになるが、私は、ごく単純な物質主義、極端な金銭崇拝、そしてそれに伴うみだらな風潮、ぜいたく、怠惰、堕落こそ、日本の強大な敵だと思う。実に巨大で強力な敵だと思う。

    日本という国家は、このまま進めば間もなく滅びるかもしれない、と嘆いた学者もいる。これは極端ないい方で、私などはそういう言葉を使いたくない。だが、同感ではある。私は泣き言が大嫌いだが、今の世のありさまを見ると、弁慶ではないが泣かずにはいられない。国民精神の統一はどうなっているのか。精神の世界はどうなっているのか。その入り乱れ、もつれた麻のような状態を悲観するなら、国民の精神の危機といってよいだろう。

    実際、日本にはキリスト教があり、もちろん仏教もある。仏教にはさまざまな宗派があり、キリスト教'
  notes:
  - 末尾の「耶蘇教」はscan90にまたがる。
  - 末文は次コマへ続く。
  sequence: 115
- id: zen-090-01
  scan: 90
  section: 禪と鎌倉武士／五 日本の敵は何んであるか
  original: '蘇教にも各宗派がある。それが、直ぐに、混亂して居ると云ふのでは無い。宗派は幾ら在つても宜いが、我れ〳〵は國民の一人として考へて見ると、果して、我れ〳〵國民が、克く忠に、克く孝にの犧牲的精神を以て、事實に統一されて居るか何うか、これは統一されて居らぬといふやうなことは、衲は斷言されないが、大變、疑はしい。

    それゆゑに、我が日佛教各宗派が、禪といふ意義の下に結び付けられてをるやうに、我が國民全體が、すべて、武士道的精神に統一せんことを希望するのである。玆に、鎌倉武士といつても、鎌倉といふ猫額大の一地方を指して言ふのでは無い。鎌倉は日本全土を意味し、武士は國民全體を代表せしめた衲の考へである。併し、言葉の言ひ廻しが拙いから、左う受け取れぬかも知れぬ、そこは、察して聞いて貰ひたい。'
  translation: 'にもさまざまな宗派がある。だからといって、それがそのまま混乱だというのではない。宗派はいくらあってもよい。しかし、国民の一人として考えてみると、私たち国民は、本当に「よく忠義を尽くし、よく孝行をする」という自己犠牲の精神によって、実際に一つになっているだろうか。一つになっていないとまでは断言できないが、大変疑わしい。

    だから私は、日本の仏教の諸宗派が「禅」という意味のもとに結びついているように、国民全体もみな武士道の精神によって一つになることを望むのである。ここで鎌倉武士というのは、鎌倉という猫の額ほどの一地方だけを指すのではない。私の考えでは、鎌倉は日本全土を意味し、武士は国民全体を代表する。もっとも、いい回しが下手なので、そう受け取れないかもしれない。その点はくみ取って聞いていただきたい。'
  notes:
  - 原本の「我が日佛教」は、そのまま保持し、訳では文意から「日本の仏教」とした。
  - 冒頭は前コマから続く。
  sequence: 116
- id: zen-090-02

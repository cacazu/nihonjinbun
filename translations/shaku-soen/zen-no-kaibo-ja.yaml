  section: 誰か言ふ弱き者と／三 大慈大悲の觀音菩薩
  original: '三、大慈大悲の觀音菩薩

    觀世音菩薩ほど到る處で信仰されてをるものは少い。單に我國だけでは無い、滿洲でも、南方支那でも、臺灣でも、觀音は廣く信仰されてをる。殊に、女人とは、因緣の甚だ深いもので、觀音の信仰者には、不思議であると思ふほどに婦人が多い。

    南方支那や、臺灣では、媽姐と稱へられる佛樣が信仰されて、到る處に、媽姐の廟があるが、傳說によると、媽姐は福建省の或る大盡の娘で、一歲、旱魃甚しく、飢饉にもならうとした時、此の媽姐が一身を犠牲にして天に祈つたので、天も其の誠心に感じて、爲めに雨を降らせ、飢饉を救はれたといふことだ。この媽姐が觀世音菩薩の化身であるとして、一般の人から今以て有難がられてをるものらしい。媽姐の祭禮は、老衲も臺灣で見たが、まことに賑やかなものぢや。

    觀世音菩薩は、なぜ、かくまで廣く信仰され、殊に、女人の信仰を受けるかと云ふに、觀世音菩薩は大慈大悲の具體的化身であつて、人は、如何なる人でも、みな心の中に慈悲心を有してをるからである。さうして、人は、みな、各自心中の慈悲心を、貴い有難いものだと思つてをる。故に、これを大きくし、延長し、大慈大'
  translation: '三　大慈大悲の観音菩薩

    観世音菩薩ほど、いたるところで信仰されている存在は少ない。日本だけでなく、満洲でも中国南部でも台湾でも、観音は広く信仰されている。とくに女性とは非常に縁が深く、観音を信仰する人には、不思議に思えるほど女性が多い。

    中国南部や台湾では、媽姐と呼ばれる仏が信仰され、各地にその廟がある。伝説によると、媽姐は福建省のある富豪の娘だった。ある年、ひどい干ばつで飢饉になりかけたとき、自分の身を犠牲にして天に祈った。天もその誠実な心に感じ入り、雨を降らせて飢饉から救ったという。この媽姐を観世音菩薩の化身として、今でも人々がありがたく信仰しているらしい。媽姐の祭りは私も台湾で見たが、実ににぎやかなものだ。

    なぜ観世音菩薩はこれほど広く、とくに女性に信仰されるのか。それは観世音菩薩が大きな慈悲の心を具体的な姿にした化身であり、どんな人も心の中に慈悲をもっているからである。そして誰もが、自分の心にある慈悲を、尊くありがたいものと思っている。だから、それを大きくし、広げて、大慈大悲'
  notes:
  - 「媽姐」は原本の表記を保持。伝承は著者の紹介した内容として訳した。
  - 末文は次コマへ続く。

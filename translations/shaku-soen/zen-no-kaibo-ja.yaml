  section: 蛙飛び込む水の音
  original: '「葉々、大抵は大、小抵は小」

    と答へられた。今度は、佛頂和尚が、

    「今日のこと作麼生」

    と問はれると、翁は、

    「雨過ぎて靑苔濕ふ」

    と答へられた。和尚、また、

    「靑苔未だ生ぜず、春雨未だ來らざる時、如何ん」

    と問はれると、丁度、其時、一匹の蛙がドブンと庭の古池へ飛んだので、翁は、早速、

    「蛙飛び込む水の音」

    と答へられた。そこで、和尚は「我が道の極意を得たり」といつて印可證明を與へられたのである。

    其時、坐にゐた、其角、杉風、嵐雪等、その他の澤山の門人どもが、翁に向つて、

    「蛙飛び込む水の音で、御許しを得られましたが、頭の五文字を御附けになつたら如何ですか」

    と云ふと、翁は、

    「さらばお前たちから附けてみよ」

    と云はれたので、杉風が、先づ、

    「宵暗や蛙飛び込む水の音」

    とやつた。次ぎに嵐雪が、

    「淋しさや蛙飛び込む水の音」

    と附けた。最後に其角が、

    「山吹や蛙飛び込む水の音」

    とした。各、その力量が見えて居る。翁は大いに喜ばれて、皆な結構であるが、私'
  translation: '「葉は一枚一枚、大きいものは大きく、小さいものは小さい」

    と答えた。今度は仏頂和尚が、

    「今日のありさまは、どうか」

    と尋ねると、芭蕉は、

    「雨が過ぎ、青い苔がしっとりと濡れています」

    と答えた。和尚がさらに、

    「青い苔もまだ生えず、春雨もまだ来ないときは、どうか」

    と問うた。ちょうどそのとき、一匹の蛙が庭の古池へどぶんと飛び込んだので、芭蕉は即座に、

    「蛙が飛び込む、水の音です」

    と答えた。そこで和尚は、「我が道の奥義を得た」といい、その悟りを認める証明を与えたのである。

    その場にいた其角、杉風、嵐雪をはじめ、大勢の弟子たちが芭蕉に、

    「『蛙飛び込む水の音』でお認めになりましたが、初めの五文字をお付けになってはいかがですか」

    というと、芭蕉は「それなら、お前たちから付けてみなさい」といった。まず杉風が、

    「宵の闇だ。そこに蛙が飛び込む、水の音」

    とした。次に嵐雪が、

    「なんという寂しさだ。そこに蛙が飛び込む、水の音」

    と付けた。最後に其角が、

    「山吹の花よ。そこに蛙が飛び込む、水の音」

    とした。それぞれの力量が現れている。芭蕉は大いに喜び、「どれも結構だが、私'
  notes:
  - 末文は次コマへ続く。
  sequence: 152
- id: zen-116-01

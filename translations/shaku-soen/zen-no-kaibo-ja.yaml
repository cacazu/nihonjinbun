  original: ある。もう一つ、面白いのは、天海僧正が、家康公の「金の生る木」を見て、「金の散る木」を示された。それはやつぱり、一本の棒を引いて、二本、左右に枝をつけ、嘘吐き、短氣、悋氣と、同じく一本づゝに書き現はして示されたのであつた。何れも通俗ではあるが、眞理を道破した語である。
  translation: 'ある。

    もう一つ面白いのは、天海僧正が、家康公の「金のなる木」を見て、「金の散る木」を示したという話である。それも同じように、一本の棒を引いて左右に二本の枝をつけ、それぞれに「嘘つき」「短気」「嫉妬」と書いて見せたという。どちらも親しみやすい表現だが、真理を言い当てている。'

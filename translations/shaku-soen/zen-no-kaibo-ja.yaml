  section: 無邊の風月／六、瑞巖和尙の自問自答
  original: こゝを確り會得したならば、天日是れ一で、前に云つた、超科學とか、超哲學とかゞ現はれて來る。こゝに至つて、我れと彼れ、此處と彼處と相對するものは無くなる。物質的五感の支配を受けて、何うの斯うのと云ふ懸けはなれたものでは無い。水は冷かだ、火は熱いと、說明した丈けでは、聞くもの見るもの等の第三者には、何んの感じもないと同樣に、說明は第二義門で、末の末なるものとなつてしまふ。冷暖自知とは、玆の有樣を云つたに過ぎないのである。眞理の極致は、どうしても此處まで達しなくては不可ぬ。それで、その今まの門を叩けば、誰れが返事をするのか、誰れが答ふるのか、又た、誰れが門を叩くのか。こゝの消息にいたつては、何者も之れを犯すことはならぬ。瑞巖和尙が、惺々着といつたところは、又た、大眞理の秘在してあるものである。それ、今まの、眞理そのものには、生命ありで、無限の眞理は無限の生命を生み出す。吾等は、この無限の生命に生きて居ることを自覺して居らねばならぬ。吾等の精神は、宇宙の大精神と違つたところは無い。「釋迦何人ぞ、我れ何人ぞ」吾れは、之れ、大眞理の權化である。分身である。片割れであるとしたならば、敢て、生死に迷ひ、順逆に悶えることは馬鹿げた話である。而も、森羅萬象を、精神的眼中の眼で、眺め、盡くされるところの宇宙を、眞理の燈明で照らして見ると、何處も彼處も柳暗花明、一點の僞りなき眞理が現出してあるではないか。こんな事も我が主人公におたづねして、常に惺々着ならば、自ら諾々と答ふることも出來よう。テツキリ、ハツキリした眞理を會得して、無限の生命に生きんとするならば、やはり宗教的信念を堅く生じて、常に、修養を怠つてはならないのである。
  translation: 'ここをしっかり理解すれば、天地は一つとなり、前にいった超科学、超哲学が現れてくる。ここまで来れば、私と相手、ここそこ、と相対して隔たるものはなく、物質的な五感に支配されて、ああだこうだと論じるような、かけ離れたものでもない。


    水は冷たい、火は熱いと説明するだけでは、聞いたり見たりする第三者には何の実感もないのと同じで、説明は二次的な入口であり、末端の末端になってしまう。「冷たいか暖かいかは自分で知る」とは、このありさまをいうのである。真理の究極には、ここまで達しなければならない。


    では、その門をたたけば、誰が返事をするのか、誰が答えるのか。そして、誰が門をたたくのか。このあり方には、誰も立ち入って侵すことができない。


    瑞巌和尚の「はっきり目覚めていよ」という言葉にも、大いなる真理が秘められている。真理そのものには生命があり、無限の真理は無限の生命を生み出す。私たちは、この無限の生命に生きていることを、自覚していなければならない。私たちの精神は、宇宙の大いなる精神と少しも違わない。


    「釈迦はどのような人か。私はどのような人か。」


    自分は大いなる真理の化身であり、分身であり、その一片なのだとするなら、生死に迷い、順境や逆境に苦しむのは、愚かな話である。


    あらゆるものを、精神の「目の奥の目」で眺め、そのように見渡せる宇宙を、真理の灯で照らして見れば、どこもかしこも柳が茂り、花が明るく咲き、少しも偽りのない真理が現れているではないか。こんなことも、自分の主人公に尋ね、いつもはっきり目覚めているなら、おのずと「はい、はい」と答えられるだろう。


    明らかな真理を理解し、無限の生命に生きようとするなら、やはり宗教的な信念を堅く持ち、いつも修養を怠ってはならないのである。'
  notes:
  - 原文冒頭は「天日是れ一」。文脈に従い、訳では天地が一つになる意と解した。

  section: 信の一字／二、信とは何ぞや
  original: である。この心が轉じて、博愛となり、慈悲となり、一切の道德となる。かく相對的の信にしても、尙ほ、其の偉なる事は斯くの如しである。然るに、衲どもの云ふ信は、無限に通ずる信仰、絕對に通ずる信仰であつて、佛と凡夫と一如する信仰である。勿論、人と人との間の信も尊むべきものであるが、必ずや、ある限界がある。昔、曾參は、母子互に深く相信じてゐた。或時、人があり、母の許に到り告げて曰く、「曾參、人を殺せり」と。されど我が子を信ずることの深き其の母は、毫も之れを信ぜず、「我子は決して斯くの如き惡事を働く者にあらず」と云つて、之を斥けて顧みなかつた。然るに、其母に告ぐること三度に及んで、始めて、稍や心を動かし、其事なきかを疑つたとある。曾參母子の間に於てすら是くの如くであることを思ひ見れば、相對的の信は、或る程度に達する時は、其信の極度、限度に達して、信は消え失せるものである。セークスピアの劇中のオセロは、其妻を信じて毫も疑はざりしも、他の離間中傷、屢ば至るに從つて、漸時、疑心を生じ、遂ひに其の讒言を信ずるに至つて、美しい妻を毒刃に屠つたが、後其の眞相を知つて悔悟の情に堪へず。遂ひに自らも相果てゝしまつたと云ふ悲劇もある。かく相對的信、親子、夫婦、兄弟、朋友間の信は、ある限度に達すれば、破壞せられる。道德的信念は、ある程度までを保つけれども、決して、永久不變では無い。或人は、俺れは盜みもせぬ、放火もせぬから、これで宜からう。と、昂然たるものもあり。併し乍ら、我等の生命が、單に、母胎から出て棺に入るまでの一期であり、また、人類のみを世界と見れば、それにて宜しいかも知れぬが、此の道義は人と人との間よりほかには適用されない。過去·現在·未來に及ぼす三世一貫の力はない。之れに反して、宗教は、有らゆるものに通ずる。宗教は人にして神に通ずる、信は大慈大悲の心である。此の僞りなき心が神佛に交融するものである。明治天皇の御製「目に見えぬ神に向ひて恥ぢざるは人の心のまことなりけり」と云ふのは、此處の事である。僞りのなき心が、神明に通ずると云ふ明治天皇の御製を拜し奉るの
  translation: 'のだ。この心が姿を変えて、博愛となり、慈悲となり、あらゆる道徳となる。


    相対的な信頼でさえ、その力はこれほど大きい。しかし、私たちのいう信は、無限に通じ、絶対に通じる信仰であり、仏と凡人が一つになる信仰なのである。もちろん、人と人との信頼も尊重すべきだが、そこには必ず限界がある。昔、曾参とその母は、深く信じ合っていた。あるとき、母のところへ来て、「曾参が人を殺しました」と告げる者がいた。しかし、我が子を深く信じていた母は、少しもそれを信じず、「私の子は、決してそんな悪事をする人間ではありません」と退け、気にも留めなかった。ところが同じ知らせが三度に及ぶと、初めて少し心が動き、本当にそうしたことはないのだろうかと疑ったという。曾参の母子でさえ、そうだったと考えれば、相対的な信頼は、ある程度に達すると限界に突き当たり、消えてしまうのである。


    シェイクスピアの劇のオセロも、妻を少しも疑わず信じていたが、二人を引き離そうとする中傷が繰り返されるにつれ、しだいに疑いを抱き、ついにはその讒言を信じ、美しい妻を刃にかけて殺してしまった。その後、真相を知って後悔に耐えられず、自らも命を絶った、という悲劇がある。


    このように、親子、夫婦、兄弟、友人のあいだの相対的な信頼は、ある限度に達すると壊れてしまう。道徳的な信念は、ある程度までは保たれるが、決して永久に変わらないものではない。「俺は盗みも放火もしない。それでよいではないか」と、胸を張る人もいる。しかし、私たちの生命が、ただ母の胎内から出て棺に入るまでの一生だけであり、世界も人類だけのものと見るなら、それでよいかもしれないが、その道徳は人間同士のあいだにしか通用しない。過去・現在・未来という三つの世を、一つに貫く力はないのだ。


    それに対して宗教は、あらゆるものに通じる。宗教は、人でありながら神に通じさせるものであり、信とは大いなる慈悲の心である。この偽りのない心が、神仏と融け合うのだ。明治天皇の御製、「目に見えない神に向かっても恥じるところがないのは、人の心の誠実さである」とは、このことをいう。偽りのない心は神に通じるという、その御製を謹んで拝する'

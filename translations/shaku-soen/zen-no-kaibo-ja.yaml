- id: zen-035-01
  scan: 35
  section: 無邊の風月／一、詩の味はふ可き點
  original: 言語の及ばざるところ、是れ詩なりで、云ひつくせぬ妙處に到つては、唯だ詩によつて其れを味はうて行かねばならぬ。兎に角、詩は吟ず可くして語るべからず、獨り之れを吟じて居る間に、自然と其の妙味が出て來るのである。吾が禪の方では「與奪」と云ふ言葉を用ひる。即ち、與へて云ふ時と、奪つて云ふ時とであつて、今ま之れを奪つて云ふ時は、「一法として人に與ふる無し」で、お釋迦さまも、橫說堅說、西に東に三百餘會を重ね、五千四十餘卷の經文を御說法になつたが、揚句の果ては、「一字不說」とまで云はれた。即ち、「吾四十九年住世未曾說一字」兎の毛一本、塵一片も說いたことは無いと云はれたが、併し、之れを與へて云ふ時は、天地すべての現象、一切萬物、悉く、禪宗の藥籠中に歸すと云つて差支へない。指一本の中にも、八萬四千の法門がチャンと存してゐると斯う云ふ。併し、此んな事は、それ〳〵の眺めやう一つである。世間の事々物々は皆な相對的なんだから、上があれば下、裏があれば表、と云つた有樣である。換言すると、言語、文字ならば、末の末なるもので、吾れ〳〵の思想や才能は、其の極致に到らば、用ふるに由なく、唯だ「アツ」と云ふ其處に落在してしまふ。それだから、何事に依らず、その「アツ」といふ所に到つては、昔話ぢやないが、芭蕉の松島や、あゝ松島や、松島やに外ならぬのである。極致、眞理に至つては、何うの斯うのと解釋したり、勿論、文筆の暇はない。松島は唯だ松島で、「アヽ」の妙處は、實地に見たものでなければ知り得ることは出來ない。こゝを古人は「冷暖自知せよ」と云はれてある。何んでも第二人者になつては、決して、其の味は分らない。當人自身が直覺的單刀直入的に行かなければ不可ん。それであるから絕對無限界に至つては、論理も理窟も盡きてしまふ。唯だ默るより仕方がない。尤も、昔は、維摩居士のやうに默つた人もあつたが、默つてしまつては、又た之れ分らぬことになる。
  translation: '言葉の及ばないところ、それが詩なのである。言い尽くせない奥深いところへ至っては、ただ詩によって味わっていかなければならない。ともかく、詩は吟じるべきもので、説明すべきものではない。一人で口ずさんでいるうちに、自然とその深い味わいが生まれてくるのだ。


    禅では、「与奪」という言葉を使う。認めていう場合と、否定していう場合である。否定する立場からいえば、「人に与える教えは何一つない」。釈迦は、あらゆる方面から教えを説き、東に西に三百回余りの説法の会を重ね、五千四十余巻もの経文を説かれた。しかし、その揚げ句には、「一字も説かなかった」とまで言われた。つまり、

    「私は四十九年間、この世にあって、いまだかつて一字も説いていない」

    と、ウサギの毛一本、塵一つほども説いたことはないと言われたのである。


    しかし、認める立場からいえば、天地のあらゆる現象、すべてのものが、ことごとく禅の役に立つ手段のうちに収まる、といって差し支えない。指一本の中にも、八万四千もの教えの門が、ちゃんと存在しているというのだ。


    ただし、これは、それぞれの見方次第である。この世の物事は、すべて相対的で、上があれば下、裏があれば表がある。言い換えれば、言葉や文字は、どこまでも末端のものだ。私たちの思想や才能も、その究極へ達すれば、もう使い道がなく、ただ「あっ」という、その一点に落ち着いてしまう。だから何事でも、その「あっ」というところへ至れば、昔の話ではないが、芭蕉の、

    「松島よ、ああ松島よ、松島よ」

    にほかならない。究極の真理に達しては、ああだこうだと解釈する暇も、もちろん文章にする暇もない。松島は、ただ松島である。「ああ」というその深い感動は、実際に見た者にしかわからない。古人は、このことを「冷たいか暖かいかは、自分で知りなさい」と言っている。


    何事も、ほかの人を介していては、決してその味はわからない。当人自身が、直観によって、まっすぐ切り込んでいかなければ駄目なのだ。だから、絶対・無限の世界へ至れば、論理も理屈も尽きてしまい、黙るほかなくなる。もっとも、昔には維摩居士のように黙った人もいたが、黙ってしまうと、それはそれで、またわからなくなる。'

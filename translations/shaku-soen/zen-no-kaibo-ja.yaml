- id: zen-078-01
  scan: 78
  section: 大なる樂觀の上に／三、偉大なる宗教心
  original: 念佛であれ、題目であれ、アーメンであれ、決して、死んで行く時の氣休めに唱へるのではない。平生、一切の行爲が、原動力を、こゝに發しなければならぬ。宗教心の偉大なる點はこゝに在る。人の一生は、この宗教心といふ偉大なる信念を有せずして大事を遂行することは、到底、出來ないことである。まゝ西洋人に斯くの如き人ありと聞くが、何か事業を企てゝ、一生涯側目をふらずに進んで行く、そして、自分一代のうちに出來ねば子の代に、子の代でも出來ねば孫の代にと、目的を貫くまでは續けて行く、この堅忍不拔の精神こそ、宗教心といふ偉大なる信念に本づくのであつて、此精神が國家多難の際に發現すると、七たび生まれて國賊を亡ぼさんといふ大精神となるのである。
  translation: '念仏でも、題目でも、アーメンでも、決して死ぬときの気休めに唱えるのではない。日常のすべての行為が、ここから原動力を得なければならない。宗教心の偉大なところは、ここにある。人は一生のうちに、宗教心という大きな信念を持たずに、大事業を成し遂げることは到底できない。

    西洋人には、ときどきこのような人がいると聞く。何かの事業を計画すると、一生涯わき目もふらずに進み、自分の代でできなければ子の代に、子の代でもできなければ孫の代にと、目的を達するまで続けていく。この不屈の精神こそ、宗教心という偉大な信念に基づくものである。その精神が国家の危難に際して現れれば、七たび生まれ変わっても国家の敵を討とうとする、大きな精神となるのである。'

- id: zen-073-01
  scan: 73
  section: 夙に起き時を使へ／六、時に使はるゝ勿れ
  original: '六、時に使はるゝ勿れ


    餘談になつてしまつたが、兎に角、一番最初が大事である。人間の活動の初めは朝であるから、出來るだけ早起きをする習慣をつけねばならぬ。衲のところに居る小僧たちも、なか〳〵早起きは苦しさうであるが、ちつとくらゐ睡眠不足でも、朝は思ひ切つて起きると、追ひ〳〵習慣になつて辛くなくなる。命令を受けてやるやうでは不可ぬ。吾がものと思へば輕し笠の雪で、外見には、さも重さうに見えても、吾がものと思へば、何んでも無い。早起きは、是非、實行したいものである。どうも遲く起きると、一日、仕事に追つかけられるやうな氣がするが、五分でも十分でも、人より先きに起きると、續々と湧いてくる仕事を、此方から追つかけて愉快に一日が送れる。大分、趣きが違ふものである。故に、古德も、「汝等諸人は十二時に使はれ、我れは十二時を使つて居る」と弟子たちに示されてあるが、さうなくてはならぬ。金を使つて道樂するものは、それは金に使はれて居るのである。死金を使ふのは、實に愚なことで、他人の爲め、社會の爲めに金を活がして使ふのとは、同じ金でも人の心によつて大變な違ひが出て來るのである。時も、亦た、金である。昔から寸陰寸璧と云つて、時すなはち金といふ考へは有つたものであるが、時に使はれては駄目である。宜しく時を使はねばならぬが、それには、先づ、第一に早起きを實行して行かねばならぬのである。'
  translation: '六　時間に使われるな


    余談になったが、ともかく、いちばん最初が大切である。人間の活動は朝から始まるので、できるだけ早起きする習慣をつけなければならない。私のところにいる小僧たちも、早起きはなかなかつらそうである。それでも、少しぐらい睡眠不足でも、朝に思い切って起きれば、次第に習慣となって、つらくなくなる。命令されてするのではいけない。

    「自分のものだと思えば、笠に積もった雪さえ軽い。」

    この句のとおり、外からはいかにも重そうでも、自分のものだと思えば何でもない。早起きはぜひ実行したいものである。

    どうも遅く起きると、一日中、仕事に追われるような気がする。しかし、五分でも十分でも人より早く起きれば、次々と湧いてくる仕事を、こちらから追いかけて、愉快に一日を送れる。ずいぶん感じが違うのである。だから昔の高僧も、「お前たちは一日の時間に使われているが、私は一日の時間を使っている」と弟子たちに示した。そうでなければならない。

    金を使って道楽をする人は、実は金に使われている。金を無駄に使うのは、実に愚かなことである。他人のため、社会のために金を生かして使うのとは、同じ金でも、使う人の心によって大きな違いが出てくる。時間もまた金である。昔から「わずかな時間にも、玉のような価値がある」といい、「時は金」という考えはあった。しかし、時間に使われてはだめである。時間を使わなければならない。そのためには、何よりもまず、早起きを実行しなければならないのである。'
  notes:
  - 第六節の見出しはscan72末、本文はscan73。
  - 「十二時」は古い時刻制度で一日全体を指す。睡眠については著者の当時の主張として訳した。

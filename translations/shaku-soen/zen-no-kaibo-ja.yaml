  section: 自性の徹見／四、天何をか言はんや
  original: '四、天何をか言はんや


    禪は、本來、無言の雄辯、不言の說法である。孔子も、「天何をか言はんや、四時行はれ百物生ず、天何をか言はんや」と云つて居られる。禪の本旨は、此の舌を動'
  translation: '四　天は何を語るだろうか

    禅は本来、言葉のない雄弁であり、語らずに行う説法である。孔子も、「天は何を語るだろう。四季は巡り、あらゆるものが生まれる。天は何を語るだろう」といわれた。禅の本旨は、この舌を動'
  notes:
  - 末尾はscan175へ続く。
  sequence: 255
- id: zen-175-01
  scan: 175
  section: 自性の徹見／四、天何をか言はんや
  original: かざる說法の上にあるのぢや。哲學だ、科學だ、何んだ斯だと、いろ〳〵理窟をこねるが、それは、眞理に到達するまでのホンの道程に過ぎないもので、理窟も、段々、詮じ詰めて行くと、遂ひには宇宙の實在に入つて無言無說となつてしまふ。天地宇宙は、有らゆる一切の言說を離れて居る。それと同時に、有らゆる人々の見やう〳〵によつて如何やうにも觀られる。形而上、形而下、唯物論、唯心論、各人の勝手である。有も眞理であれば、無も亦た眞理である。宇宙は洪荒にして偏倚るところが無い。各人が各樣に見るに任せてをる。まことに、宇宙は、洪大にして無窮である。如何に該博な知識を傾倒して縱橫に論說したところで、到底、宇宙の全體は愚か、萬が一にも當らない。さりながら、たとひ、宇宙の全體では無いにしても、その一部分は、日々夜々、吾人の讀みつゝあるものである。柳は綠、花は紅、山高く、水長しと、吾人は絕えず宇宙の一部は讀んでをるのであるが、如何に此れを讀んでも、論じても、宇宙の眞理そのものは、關せず焉と知らぬ顏をしてをる。彼の蒼々たる天に向つて、如何に賞めても罵つても、嬉しさうな顏もせねば怒つた顏もせぬ。たゞ天地の間に蠢動する人と呼ばれる動物のみが、泣いたり笑つたり怒つたりするのである。天は公平無視で偏倚るところが無い。大觀すれば、科學だ宗敎だ哲學だとゴタ〳〵言ふのは、赤ん坊が垂れたり放つたりするやうなもので寧ろ、眞理の汚點である。
  translation: 'かさない説法にあるのだ。

    哲学だ、科学だ、何だかんだと理屈をこねるが、それは真理に到達するまでの道筋にすぎない。理屈も突き詰めていくと、ついには宇宙の実在に入り、言葉も説明もなくなる。

    天地宇宙は、あらゆる言葉を離れている。同時に、人それぞれの見方によって、どうにでも見える。形而上、形而下、唯物論、唯心論、各人の自由である。有も真理であり、無もまた真理である。宇宙は果てしなく広がって偏るところがなく、人々がそれぞれの見方で見るに任せている。

    本当に、宇宙は広大で限りがない。どれほど豊かな知識を注いで縦横に論じても、宇宙全体どころか、その万分の一にも届かない。それでも、宇宙のすべてではないにせよ、その一部分は私たちが日々読み続けている。

    柳は緑、花は紅、山は高く、水は長く流れる。そのように私たちは絶えず宇宙の一部分を読んでいる。しかし、どれほど読んでも論じても、宇宙の真理そのものは、関係ないという顔で知らんぷりをしている。

    あの青々とした空に向かって、どんなに褒めても罵っても、うれしそうな顔もしなければ、怒った顔もしない。ただ天地の間でうごめく、人間という動物だけが、泣いたり笑ったり怒ったりする。天は公平で、偏るところがない。大きく眺めれば、科学だ宗教だ哲学だとごたごたいっているのは、赤ん坊がおしっこやおならをするようなもので、むしろ真理の汚点なのである。'
  notes:
  - 冒頭はscan174から続く。末尾の排泄への比喩も原文の語調を保った。
  sequence: 256
- id: zen-176-01
  scan: 176
  section: 菜根譚十則／序
  original: 支那宋代の儒者に、汪信民といふ人があつて、「人、常に、菜根を咬み得れば、則ち、百事做すべし」といふことを云つた。その語に本いて「菜根譚」と名づけ、練心處世の要訣を說いたものが、明代の洪自誠である。洪自誠の傳記は詳らかでないが、唯だ、該書によつて窺ふと、儒敎、道敎、佛敎の三敎に出入して、能く三敎の精華を發揮し、言々、世態人情に通じて委曲を悉さゞるなく、句々、玄に入り微を穿つて、謂ゆる百煉千磨の寸鐵、光芒の陸離たるものがある。まことに修養書中の第一に推すべきものであらう。今ま其中から數則を拔いて聊か短評を試みる。
  translation: '中国・宋代の儒者に汪信民という人がいて、「人はいつも野菜の根をかんで暮らすことに耐えられれば、どんなことでも成し遂げられる」といった。その言葉に基づいて『菜根譚』と名づけ、心を練り、世に処する要点を説いたのが、明代の洪自誠である。

    洪自誠の詳しい伝記は分からない。ただ、この本からうかがうと、儒教・道教・仏教の三つに通じ、それぞれの精華を十分に発揮している。どの言葉も世のありさまや人情に通じ、細部まで語り尽くす。どの句も奥深いところに入り、微妙な点を突き、何度も鍛え磨かれた短い刃のように、鋭い光を放っている。まことに修養書の第一に推すべき本だろう。今、その中からいくつかを抜き出し、短い評を試みる。'
  notes: []
  sequence: 257
- id: zen-176-02
  scan: 176
  section: 菜根譚十則／一
  original: '一


    君子之心事、天靑日白、不可使人不知、君子之才華玉韞珠藏、不可便人易知、（君子の心事は、天靑く日白く、人をして知らざらしむ可からず、君子の才華は玉韞まれ珠藏れ、人をして知り易からしむ可からず）君子の心事、即ち、心の持ちやうは、靑天白日、一點の雲翳なきが如く、些かも包み藏すといふことがない。まことに公明正大なるものである。他人をして、あの人は一向に腹の中が分らぬと言はせるやうなことは無い。これに反し、其の有してをる才智藝能は、珠玉を大切に藏しておくが如く、深く韜み藏して、容易に人をして知らしめない。古歌に、こんなのがある。そこひなき淵やはさわく山川のあさき瀨にこそ仇波はたて底知れぬ深淵になると、仇波が一つ立たないほどに靜穩なものである。君子の才華を包み藏すことも、丁度、この通りぢや。然るに、小人といふものは、少しでも'
  translation: '一

    「君子の心は、青空や明るい太陽のように、誰にも分かるようでなければならない。君子の才能は、玉や真珠をしまっておくように、たやすく人に知られてはならない」

    君子の心、つまり心の持ち方は、雲一つない青空と太陽のように、少しも包み隠すものがない。実に公明正大である。他人に「あの人は何を考えているか、まったく分からない」といわせるようなことはない。それに対し、自分の知恵や技芸は、宝石を大切にしまっておくように、深く隠して、容易には他人に知らせない。古い歌に、こんなのがある。

    「底知れぬ深い淵が騒ぐだろうか。山川でむやみに波が立つのは、浅い瀬のほうだ」

    底知れない深い淵になると、余計な波一つ立たないほど静かである。君子が才能を包み隠すのも、このとおりだ。ところが小人というものは、少しでも'
  notes:
  - 原文は漢文とその訓読を併記する。同じ内容なので、訳文では引用の現代語訳を一度示し、その後の評釈はすべて訳した（以下各則も同じ）。末尾はscan177へ続く。
  sequence: 258
- id: zen-177-01

  section: 驢を渡し馬を渡す／一、如何なるか是れ石橋
  original: '一、如何なるか是れ石橋


    趙州從諗禪師といふのは、澤山の古德の中でも特に傑出して居る人である。趙州は地名であつて、地名が名となつたので、臨濟でも、洞山でも、其他の古德が多く左うである。この趙州和尙の住せられた觀音院は、趙州城の東にあつて、彼の有名な石橋を去ること十里とある。支那の一里は、我國の六町であるから、十里といつても、我國の一里餘りである。この石橋は、天臺山の石橋と、南嶽の石橋と、それに、此の趙州の石橋を併せて三石橋と稱せられて、天下に有名なものである。或時、一僧が訪れて、「久しく趙州の石橋と響く、到り來れば只だ略彴を見る」'
  translation: '一　石橋とは何か


    趙州従諗禅師は、多くの昔の高僧の中でも、特に傑出した人である。「趙州」は地名で、それが呼び名となった。臨済、洞山など、ほかの高僧も多くは同様である。この趙州和尚が住んだ観音院は趙州城の東にあり、名高い石橋から十里の所にあったという。中国の一里は日本の六町なので、十里といっても日本では一里余りである。天台山の石橋、南岳の石橋、そしてこの趙州の石橋を合わせて三石橋と呼び、天下に名高かった。あるとき、一人の僧が訪れて言った。

    「以前から趙州の石橋の評判を聞いていましたが、来てみると、ただの丸木橋ですね。」'

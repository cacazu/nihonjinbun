- id: zen-153-01
  scan: 153
  section: 武士道を他にも及ぼせ／五 偉大なる宗敎の力
  original: これは消極的の結果であるが、若し、積極的に言ふならば、無宗敎者には、卑劣な手段を取つて、一時を糊塗し、人を欺くといふやうな者が多いが、これに反して宗敎信者には、そんな卑劣な者はゐないし、これを君國に對する感想上から言へば上天皇陛下に盡くし奉る忠誠は言ふまでも無く、高く神に對し、佛に對しても、正義の爲めには、自己を犠牲にするも、誓つて戰はざる可からずといふ決心を有するのである。見よ、天下を蓆卷したところの豪傑、織田信長でさへ、石山寺に立て籠つた一向宗徒の爲めには、力屈したではないか、これ命を佛陀の前に捧げたる一大決心を有うした一向宗徒の力に由るのである。だから、家康は、その抗す可からざるを見て淨土宗や天臺宗徒と結び、自己勢力中のものと仕ようとした。實に、宗敎の偉大なる力のあることが分るであらう。
  translation: 'これは悪を抑えるという消極的な結果だが、積極的な面をいえば、宗教を持たない者には、卑劣な手段でその場を取り繕い、人を欺く者が多い。それに反して、宗教を信じる者には、そんな卑劣な者はいない。また、君主と国家に対する思いからいえば、天皇陛下に尽くす忠誠はいうまでもなく、さらに神に対し、仏に対しても、正義のためには自分を犠牲にしてでも必ず戦わなければならない、という決心を持っている。

    見よ、天下を席巻した豪傑の織田信長でさえ、石山寺に立てこもった一向宗の信徒に対しては、力を尽くしても屈したではないか。これは命を仏陀に捧げるという大きな決心を持った一向宗信徒の力によるのである。だから家康は、それに抗しがたいと見て、浄土宗や天台宗の信徒と結び、自分の勢力の内に取り込もうとした。実に宗教に偉大な力があることがわかるだろう。'
  notes:
  - 「石山寺」は原著の表記。文脈上は一向宗の拠点であった石山本願寺を指すとみられる。宗派と政治権力の関係の評価は原著に従う。

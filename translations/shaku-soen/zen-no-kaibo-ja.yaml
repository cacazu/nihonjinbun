  section: 驢を渡し馬を渡す／二、如何なるが是れ灌溪
  original: '二、如何なるが是れ灌溪


    達磨大師が二祖を接得された時も左うであつたが、黃檗でも、臨濟でも、德山でも、雲門でも、皆な其の手段は孤危險峻で、實に側へも寄り付かぬほど手嚴しかつた。併し、これは、殊更らに宗旨を惜しんでの故ではない。修行者に、自發的に、十分力を現はさせるには、是れでなければ不可ないからである。頭を撫で、手を引くやうなことをしては、却つて、學人の爲めにならぬ。突き落し〳〵、叩いて〳〵叩きつけると、學人は奮激し〳〵、自ら鞭ちて油斷なく修行し、師家の手を借らずして力を現はしてくるやうになる。師家は之れを待つて居るのである。斯くの如き次第ではあるが、趙州には少しも孤危の風が見えぬ。德山の棒を行じ臨濟の喝を行ずる如きとは違つて、唯だ言句を以て人を殺活する。ところで、それが、また、痛棒より痛く、熱喝よりも熱して居る。だから、雪竇和尙も、「海に入つては還つて須らく巨鼇を釣るべし。笑ふに堪へたり同時の灌溪老。」と賞讃してをる。大海に飛び込んでは鰯や海老が相手ではない。巨鼇が相手である。鮒も目高も餘さず救ひ取らうとするのが、阿彌陀佛の本願であつて、賢い者より馬鹿が大切であるさうなが、禪宗は是れと正反對である。先づ優れた者を相手にしようとする。かくの如く佛教は廣汎で、いろ〳〵な方面が開かれて居る。趙州は目高や鮒が相手ではない。灌溪和尙は、臨濟下の人である。或時、一僧があつて、和尙に向ひ、「久しく灌溪と響く、到來するに及んで、只だ箇の温麻池を見る。」温麻池とは、麻を温すだけの小さな池といふので、眞意は前の趙州和尙に對する問ひと同じである。すると、灌溪は、「汝、温麻池を見て、且らく灌溪を見ず」と答へると、僧は、'
  translation: '二　灌溪とは何か


    達磨大師が二祖を導いたときもそうだったが、黄檗、臨済、徳山、雲門などの指導法は、どれも険しい崖のようで、そばにも近づけないほど手厳しかった。しかし、わざと教えを出し惜しみしたのではない。修行者が自発的に十分な力を出すには、それでなければいけなかったのである。頭をなで、手を引くようにしては、かえって修行者のためにならない。何度も突き落とし、打って、打って、打ちつけると、修行者は奮い立ち、自らを励まし、油断なく修行して、師の手を借りずに力を発揮するようになる。師はそれを待っているのである。

    そうはいっても、趙州にはそのような険しい様子が少しも見えない。徳山の棒や臨済の喝とは違い、ただ言葉によって、人のとらわれを断ち、その人を生かす。しかも、それが痛烈な棒打ちよりも痛く、激しい喝よりも熱を帯びている。だから雪竇和尚も、「海に入ったなら、巨大な海亀を釣らなければならない。同時代の灌溪老人は、笑うべきものだ」とたたえている。大海に飛び込む以上、イワシやエビが相手ではない。大きな海亀が相手なのである。

    フナもメダカも残らずすくい取ろうとするのが阿弥陀仏の本願であり、賢い者より愚かな者こそ大切なのだというが、禅宗は正反対である。まず優れた者を相手にしようとする。このように仏教は広く、さまざまな方面が開かれている。趙州はメダカやフナを相手にしているのではない。

    灌溪和尚は臨済の系統の人である。あるとき一人の僧が、和尚に向かって言った。

    「以前から灌溪の評判を聞いていましたが、来てみれば、ただの麻を浸す池ですね。」

    「温麻池」とは、麻を浸すだけの小さな池という意味で、問いの本意は先ほどの趙州和尚への問いと同じである。すると灌溪は、「お前は麻を浸す池を見て、まだ灌溪を見ていない」と答えた。そこで僧は、'
  notes:
  - 灌溪は人の呼び名であると同時に、谷川を表す語として問答に用いられる。
  - 修行者への身体的な処遇は著者の歴史的な記述に従って訳した。

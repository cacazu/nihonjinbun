  section: 大道周行／一、花も蟻も一小天地
  original: '大體、道といふものは、我れ〳〵は、平生、屢ば口にして居るが、扨て、如何なるものが道であるかと考へてみると、茫たり漠たりで、何を指して道といふか、捕へ難いのである。さういふ有樣であるが、先づ、一二、古人の「道」に對ずる言葉を擧げて見ると、老子の語に、有物混成、先天地生、寂兮寥兮、獨立而不改、周行不殆、可以爲天下母、吾不知其名、字之曰道、强爲之名曰大、大曰逝、逝曰遠、遠曰反、故道大天大地大王亦大、域中有四大、而王處一焉、人法地、地法天、天法道、道法自然、

    （物有り混成す、天地に先ちて生ず、寂たり寥たり、獨立して改めず、周行して殆からず、以て天下の母たる可し、吾れ其名を知らず、之れを字して道と曰ふ、强いて之れが名を爲して大と曰ふ、大を逝と曰ふ、逝を遠と曰ふ、遠を反と曰ふ、故に道大なり、天大なり、地大なり、王亦た大なり、域中に四大あり、而して王は一に處る、人は地に法り、地は天に法り、天は道に法り、道は自然に法る、）

    とあるが、これは、なか〳〵面白いところである。まだ名がないから、「物」といふ。物といつても、「心」といふものがあつて、その心に對して、心以外のものを「物」といふ風に、相對的の名稱では無い。今、こゝで云ふ物とは、或物といふより仕方がない。まだ神とも佛とも、本當の名が附いて居らぬ。かういふ言葉の意味は、修養のある人には、自分の頭に、自ら槪念が現はれてくるであらう。物あり混成す、一切の物が混成して居る。天地に先つて生ず、大抵、我れ〳〵が見聞覺知して居るところの物は、天地始つて以來の現象で、此の現象は、即ち、天地分れてのちの現象であるが、此處に謂ゆる物といふは、然らず。天地に先つて生ずるとして見ると、どう云ふものであらうか。人が眼を欹つて見ようと思つても、一向、音も沙汰もないから、寂たり寥たり、極くヒツソリとして居る。孔子も或る場合に'
  translation: 'そもそも私たちは、ふだん何度も「道」を口にする。しかし、何が道なのかと考えてみると、漠然として、何を指して道というのか、つかみにくい。そうしたものなのだが、まず、道についての古人の言葉を一つ二つ挙げてみよう。老子には、次の言葉がある。


    「渾然と一つに成り立つものがあり、天地より先に生まれた。静まり返り、何もないようでありながら、ほかに依存せず存在して変わることがない。あまねく行き渡って、尽きることがなく、天下の母とすることができる。私はその名を知らない。仮に『道』と呼び、強いて名づければ『大』という。大きいとは、どこまでも行くこと。行くとは、遠くに至ること。遠くに至るとは、また帰ってくることである。だから、道は大きく、天は大きく、地は大きく、王もまた大きい。この世界に四つの大なるものがあり、王はその一つを占める。人は地に従い、地は天に従い、天は道に従い、道は、おのずからそうあることに従う。」


    これは、なかなか面白いところだ。まだ名がないので「物」という。物といっても、「心」があって、それに対して、心以外のものを物と呼ぶような、相対的な名称ではない。ここでいう物とは、「あるもの」としか言いようがない。神とも仏とも、まだ本当の名がついていないのだ。こうした言葉の意味は、修養を積んだ人なら、自分の心におのずと、その観念が浮かんでくるだろう。


    「渾然と成り立つものがある」とは、あらゆるものが一つに成り立っているということだ。「天地より先に生まれる」。私たちが見聞きし、感じ、知っているものは、たいてい天地の始まり以後の現象、つまり天地が分かれたあとの現象である。しかし、ここでいう物は、そうではない。天地より先に生まれるとすれば、それはどんなものだろうか。目を凝らして見ようとしても、音も知らせもまったくないので、「静まり返り、ひっそりとしている」という。孔子も、ある場合に、'

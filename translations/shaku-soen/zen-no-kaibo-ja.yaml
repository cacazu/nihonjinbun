  section: 菜根譚十則／一
  original: 自己の才能を他人に誇らうとする。其癖、心事は容易に他人をして窺はしめない。だから、交はれば交はるほど、情味が索然として、厭氣がさす。これが、君子と小人との相異る所以である。
  translation: 自分の才能を他人に誇ろうとする。そのくせ、自分の心の内は容易にのぞかせない。だから付き合えば付き合うほど、味わいがなくなって、嫌になる。ここが君子と小人の違うところである。

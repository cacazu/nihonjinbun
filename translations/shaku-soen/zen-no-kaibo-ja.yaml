  section: 武士道を他にも及ぼせ／二 官尊民卑の弊を去れ
  original: '二、官尊民卑の弊を去れ


    今や、我國が、商業、農業、工業とも大いに發達して來たにもかゝはらず、商業家の道德、農業家の道德、工業家の道德は、これを武士道と體照して大いに遜色がないと云ふ譯に行かぬ。古來、我國では、百姓といひ、商人といひ、一層、これを輕侮した語になると、土百姓といひ、素町人といつた。かくの如き言葉は、農商工の道が發達しなかつた證據である。自分は、素町人であるから人を欺いても構はない。自分は土百姓であるから、禮儀作法を知らないでも構はない。自分は職人であるから、不品行でも構はないと、自ら侮り、以て、人からも輕侮せらるゝは困るではないか。彼等は、かくの如く、恬として耻ぢざる行動をしたのが、今日に至るも、その餘習尙ほ去らざるのである。今日、學校に在るものゝ理想とするところは、將來、幾何かの月給を取らうとするもので、官吏でなければ會社員とならうとする。米國は之れと違つて、オフイサ、即ち、官吏なるものは、傭人といふ意味で、御役人樣とか、官吏樣などと崇めるものは無く、其の尊ぶところは、マーチヤントで'
  translation: '二　官を尊び民を軽んじる弊害を除け


    今や日本では、商業、農業、工業とも大いに発達してきた。それにもかかわらず、商業家、農業家、工業家の道徳は、武士道と比べて大きく見劣りしない、というわけにはいかない。

    昔から日本では「百姓」「商人」といい、それをいっそう見下す言葉では「土百姓」「素町人」といった。このような言葉は、農・商・工それぞれの道が発達しなかった証拠である。自分は素町人だから人を欺いても構わない、自分は土百姓だから礼儀作法を知らなくても構わない、自分は職人だから品行が悪くても構わないと、自分を軽んじ、そのため人からも軽蔑されるのでは困るではないか。

    彼らがこのように平然と恥じない行動をしてきた、その名残が今日もまだ消えていない。今、学校にいる者が理想とするのは、将来いくらかの月給を取ることで、官吏でなければ会社員になろうとする。

    アメリカはそれと違い、オフィサー、つまり官吏は雇われ人という意味であり、「お役人さま」「官吏さま」などとあがめる者はいない。尊ばれているのは、マーチャント、つまり商人で'
  notes:
  - 末尾は次スキャンへ続く。

  section: 生死は一如なり／三、慧玄が這裏に生死なし
  original: 三、慧玄が這裏に生死なし昔、漸源が師匠の道吾和尙のお伴をして或家へ葬式に行つた。其時、漸源が棺を叩いて、「生か死か」と問ひを發した。道吾和尙は、「生とも道はず、死とも道はず」と云はれた。生だの死だのと言へば、もう好肉上に瘡をつける。それが、漸源には分らぬので、葬式が濟んで歸る途中、漸源は、どうしても師匠に其れを言はせようと氣を苛立てゝ、「道はずんば和尙を打たん」と詰め寄つたが、和尙は、「打つことは即ち打つに任す、道ふことは即ち道はず」と云つて、何んとしても應ぜない。何か或るものが有つて、それを隱して殊更らに云はないのでは無い。漸源は、とう〳〵師匠の頭をポカリと打つたが、遂ひに和尙は云はなかつた。其後、漸源は、石霜和尙のところへ行つて、前の問答を繰り返して、
  translation: '三　慧玄のこの境地に、生も死もない


    昔、漸源が師の道吾和尚に付き添って、ある家の葬式へ行った。そのとき漸源は、棺をたたいて、

    「生ですか、死ですか」

    と尋ねた。道吾和尚は、

    「生とも言わない。死とも言わない」

    と答えられた。生だの死だのと言えば、傷のない肉にわざわざ傷をつけることになる。それが漸源にはわからなかった。葬式を終えた帰り道、どうしても師に言わせようといらだって、

    「言わないなら、和尚を殴ります」

    と詰め寄った。ところが和尚は、

    「殴るのなら、好きに殴るがよい。だが、言うことは言わない」

    と、どうしても応じない。何かがあって、それを隠し、わざと言わないのではない。漸源はとうとう師の頭をぽかりと殴ったが、それでも和尚は言われなかった。


    その後、漸源は石霜和尚のところへ行き、前の問答を繰り返して、'

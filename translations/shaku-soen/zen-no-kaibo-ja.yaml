  section: 驢を渡し馬を渡す／五、雲は天に、水は瓶に
  original: と言はれた。すると、李翱も元來が馬鹿でない、再び、坐に歸り、禮をなして問うて言ふには、「佛法ギリ〳〵の道理は如何ん」藥山は手を一上一下して、「會すや」分るかと言はれたが、李翱には、一向、分らないので、「會せず」分りませんと云ふと、藥山は間に髪を入れず、「雲は靑天に在り、水は瓶に在り」と云はれた。まつたく、雲は蒼空に在り、水は瓶の中に在る。併し、早合點して、禪宗は其身其儘であるなどと思ふと大きな間違ひである。こゝは各人の工夫を要するところである。李翱は其れを聞くと、言下に大悟した。そして、偈を述べて曰ふには、鍊得身形似鶴形千株松下兩函經我來問道無餘說雲在靑霽水在瓶
  translation: '言われた。李翱も、もともと愚かな人ではない。再び席に戻り、礼をして尋ねた。

    「仏法の究極の道理とは、どのようなものですか。」

    薬山は手を一つ上げ、一つ下げて、「わかるか」と言った。李翱にはまったくわからなかったので、「わかりません」と答えた。すると薬山は間髪を入れず、「雲は青空にあり、水は瓶の中にある」と言われた。

    まったく、雲は青空にあり、水は瓶の中にある。しかし、早合点して、禅宗とは、今の自分のままでよいということだ、などと思ったら大間違いである。ここは一人ひとりが自ら取り組まなければならないところである。李翱はこの言葉を聞くや、その場で大悟し、次の詩を述べた。

    「修練を積んだその体は、鶴の姿に似ている。

    幾千もの松の下には、二箱の経典。

    私が来て道を尋ねても、ほかに言葉はない。

    雲は青い晴れ空にあり、水は瓶の中にある。」'
  notes:
  - 漢詩末句の空を表す字は底本画像では「霽」と読めるため、原文を保持した。

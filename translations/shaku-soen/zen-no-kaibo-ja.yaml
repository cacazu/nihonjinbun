  section: 無邊の風月／五、何くも同じ秋の夕暮
  original: 五、何くも同じ秋の夕暮第三句目に移るんだが、もう之れからは、前の二句を受けて分り易き形容に止まるのである。「柳暗花明十萬戶」。十萬戶といふのも、別段、十萬と定つたわけのものでは無い。唯だ廣い世界を指したもので、何處も彼處もとの意味である。「見渡せば、何くも同じ秋の夕暮」か、「柳櫻をこきまぜて、都ぞ春の錦なりけり」で、どこもかしこも秋になれば紅葉の錦、春になれば、柳は綠を、花は紅を競ふ有樣、自ら天地自然の情趣を感得することが出來るのである。昔も今も、柳は綠花は紅ゐで、而も春風駘蕩、少しも變つたところは無い。前句に云つた「眼中
  translation: '五　どこも同じ秋の夕暮れ


    第三句へ移ろう。ここからは、前の二句を受けて、わかりやすく描写しているだけだ。「柳は暗く茂り、花は明るく、十万の家々を彩る」。十万戸といっても、きっかり十万と決まっているわけではない。ただ広い世界を指し、どこもかしこも、という意味である。


    「見渡せば、どこも同じ秋の夕暮れ」

    あるいは、

    「柳と桜が入り交じって、都はまるで春の錦のようだ」

    ということだ。どこでも、秋には紅葉が錦をなし、春には柳が緑を、花が紅を競う。そのありさまに、自然と天地の趣が感じ取れる。昔も今も、柳は緑、花は紅で、春風はのどかに吹き、少しも変わらない。前の句でいった「目の奥'

  original: 'と、寶治元年の八月頃と思ふ。寶治元年の八月から翌年三月頃まで居られ、時賴公は弟子の禮を執り、菩薩戒を授かつたのである。

    あら磯の波もえ寄せぬ高岩に

    かきもつくべき法ならばこそ

    これは、時賴が參ずるについて、禪師が、見性成佛を詠みて御示しになつた道歌である。

    これが、抑も始めで、それから、半年餘りで、禪師は越前に御歸りになつたが、丁度、その時分、多分、寬元四年頃であつたらう、請はずして來たられた大覺禪師（蘭溪道隆）、これは鎌倉建長寺の開山である、この大覺禪師が見えると、時賴公は、其の道名を聞いて、鎌倉郡大船村に常樂寺といふ寺が今までも有るが、そこへ御迎ひして、次ぎに、遂ひに建長寺を創建して開山とし、親しく師の鉗鎚を受けられた。

    それのみならず、東福寺の開山、聖一國師（辨圓圓爾）に參禪せられたので、當時、國師は、宋國徑山無準和尙の法を傳へて歸朝せられて居つたのである。殊に、時賴公は、文應元年に來朝せられた兀庵禪師に參じて、遂ひに大悟徹底せられた。それを、聖一國師が、兀庵の韻を次いで證明された偈がある。今、覺えて居るやうだから、偈頌だけ言はう。

    大機大用大根人　鼻孔遼天獨露身

    凛々威風行關外　五湖四海一天眞

    と云ふのである。

    是れ程の肉身の菩薩でも、不幸、短命であつて、春秋わづかに三十七にして、此世を去られたのが、弘長三年十月二十三日であつた。その臨終の偈といふのを、山陽なども、其著、外史に書いて居るから、世人は旣に承知であらうと思ふが、それは、'
  translation: '宝治元年の八月ごろだったと思う。その八月から翌年の三月ごろまで滞在し、時頼公は弟子としての礼を尽くして、菩薩の戒めを授かったのである。

    「荒磯の波さえ寄せつけない高い岩のような仏の法に、もし取りつけるものなら、しがみつこうものを」

    これは時頼の参禅に際して、禅師が、自分の本性を見きわめ仏となることを詠んで示した道歌である。

    これがそもそもの始まりだった。半年余りの後、禅師は越前へ帰ったが、ちょうどそのころ、たぶん寛元四年ごろだったろう、招かれずに来日した大覚禅師、蘭渓道隆が現れた。鎌倉の建長寺を開いた人である。時頼公はその道における名声を聞き、今も鎌倉郡大船村にある常楽寺へ迎えた。その後、ついに建長寺を創建して開山に据え、自ら師の厳しい指導を受けた。

    そればかりでなく、東福寺の開祖、聖一国師、弁円円爾にも参禅した。当時、国師は宋の径山の無準和尚から法を受け継いで帰国していた。とりわけ時頼公は、文応元年に来日した兀庵禅師に参じ、ついに徹底した悟りを開いた。聖一国師が兀庵の詩と同じ韻を用いて、その悟りを認めた偈がある。今も覚えているようだから、その詩だけを述べよう。

    「大いなる機知と働き、大いなる資質を備えた人。

    鼻先ははるか天に届くほどに、独り真の姿を現している。

    凜々たる威風をもって関門の外へ歩み出る。

    五湖四海、世界のどこも、ただ一つの自然な真実である」

    これほどの生身の菩薩であっても、不幸にも短命で、わずか三十七歳で世を去った。弘長三年十月二十三日のことだった。その臨終の偈は、頼山陽なども『日本外史』に書いているので、すでにご存じだろうと思う。それは、'

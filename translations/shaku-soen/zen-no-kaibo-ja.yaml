- id: zen-047-01
  scan: 47
  section: 差別に處する難／二、差別觀念は建設思想
  original: '天地宇宙は、一つの大きな網の如きもので、また、一大連鎖であるとも觀られ得るが、その一つ〳〵の網の目、若くは單鎖に相當するものが、是れ、即ち、差別である。網のあるうちは、網の目の結節を無くしてしまふ譯には行かず、連鎖のあるうちは鎖の連結を無くしてしまふ譯には行かぬが如く、天地宇宙の有るうちは、差別を無くする譯に行くものでは無い。否な、微小の差別が亂れても、それが直ちに宇宙全體の組織の上に、大影響を與へることになる。

    社會組織の上に於ても、やはり、それと同じである。差別を全く無くしてしまへば、社會そのものも亦た無くなつてしまはねばならなくなる。社會は無差別では到底存立し得らるゝもので無い。人倫道德の社會に缺くべからざる所以は實に玆にある。

    履は足に穿くべきもので、冠は頭に戴くべきものである。履を頭に戴き、冠を足に穿いて、それで、社會の利益幸福を增進しようとしても、到底、出來るもので無いものである。また、これは、決して、平等思想でもない。差別を顚倒して、更らに一層、その差別に囚はれたものである。

    褞袍は寢衣にするか、或は、家に寛居いでゐる時に着るべきもので、苟くも禮儀を保つべき宴會の席上などへ着て出るべきもので無い。然るに、强いて褞袍を着けて禮儀を保つべき宴會に出席したり、弔意を表すべき葬式に列して强いて笑つたりするのは、これを稱して平等思想であるとは謂へ得ぬ。否な、斯くの如きは、却つて平等を無視する「我見」に囚はれて、其の奴隷となつたものである。

    眞の平等思想は、全く、「我見」を離れた「無我の愛」であるべき筈のものだ。

    耶蘇教が切りに博愛を唱道し、世界の同胞は悉く是れ兄弟姉妹で、共に等しく神の子であると說きながら、耶蘇教國民に、兎角、戰爭好きの聲が多く、十字軍以下多くの戰爭が、神の名によつて行はれ、遂ひに、先きほど歐洲戰爭を釀すまでに至つたのも、耶蘇教の神は「我見」の大なるもので、「平等」の權化で無いからだ。'
  translation: '天地宇宙は、大きな一つの網のようなものであり、大きな鎖の連なりとも見られる。その一つ一つの網目や鎖の輪に当たるものが、つまり、個々の違いである。網があるかぎり、その結び目をなくしてしまうわけにはいかない。鎖の連なりがあるかぎり、その連結をなくすわけにはいかない。それと同じく、天地宇宙があるかぎり、違いをなくすわけにはいかないのだ。いや、ごく小さな区別が乱れても、それがただちに、宇宙全体の組織へ大きな影響を及ぼす。


    社会の仕組みも同じである。違いをまったくなくしてしまえば、社会そのものもなくならざるを得ない。社会は、何の区別もなしには、とうてい成り立たない。人の道や道徳が社会に欠かせない理由は、まさにここにある。


    履物は足に履き、冠は頭にかぶるものだ。履物を頭に載せ、冠を足に履いて、それで社会の利益や幸福を増そうとしても、とうていできるものではない。また、これは決して平等思想でもない。違いを逆さまにして、かえってその違いに、いっそうとらわれたのである。


    どてらは、寝巻きにするか、家でくつろぐときに着るものだ。礼儀を守るべき宴席へ着て出るものではない。それなのに、わざわざどてらを着て正式な宴会に出席したり、弔意を示すべき葬式に参列して、わざと笑ったりするのを、平等思想とはいえない。いや、そういう人は、かえって平等を無視する、自分勝手な考えにとらわれ、その奴隷になっているのである。


    本当の平等思想とは、自分への執着から生じる見方を完全に離れた、「無我の愛」であるはずだ。


    キリスト教は、しきりに博愛を唱え、世界の人々はみな兄弟姉妹で、等しく神の子だと説く。それなのに、キリスト教国の人々には、どうかすると戦争を好む声が多く、十字軍をはじめ多くの戦争が神の名によって行われ、ついには先のヨーロッパ戦争を引き起こすまでになった。それも、キリスト教の神が、自己への執着を大きくしたもので、「平等」の化身ではないからだ。'

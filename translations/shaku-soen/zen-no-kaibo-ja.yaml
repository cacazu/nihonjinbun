  section: 武士道を他にも及ぼせ／一 武士道は日本の誇り
  original: の如きも、武士道は日本固有の特性として許してゐる。單に之れを許してゐるばかりで無く、武士道に關する著書が頻々として現はれ、外國語に譯されるのでも、如何に外國人が之れを尊崇し、珍重するかゞ知れるであらう。かく我國の武士道が發揮されることは、日本人の大いに誇りとすべきことである。併し乍ら、他の方面を觀察すると、何うであらうか。武士道といふ一種の高尙なる道義的觀念のあるやうに、他に商業道とか、工業道とか、農業道と名づくるものがあるか-此語は、或ひは、多少の語弊があるかも知れないが-武士道に對してこれ等が竝行してゐるかと云ふに、衲は、之れに對して然りと答ふるに躊躇せざるを得ない。
  translation: 'なども、武士道を日本固有の特性として認めている。単に認めるだけでなく、武士道の本が次々に現れ、外国語にも訳されている。そのことからも、外国人がどれほど武士道を尊び、大切にしているかがわかるだろう。

    このように日本の武士道が発揮されることは、日本人の大いに誇りとすべきことである。しかし、ほかの方面を見るとどうだろう。武士道という一種の高尚な道徳観があるように、ほかに商業道、工業道、農業道と名づけるものがあるだろうか。この言葉には多少の語弊があるかもしれないが、武士道と並び立つものがあるかといえば、私はそうだと答えることをためらわざるを得ない。'

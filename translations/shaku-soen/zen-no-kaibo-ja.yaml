- id: zen-126-01
  scan: 126
  section: 隱德を積め／三 誠拙和尙と五百兩
  original: 鎌倉圓覺寺の誠拙和尙は、近世の高僧であるが、同寺、現在の山門は、この御方の建立なされたのである。其頃の札差で、海津傳兵衛といふ人があつたが、圓覺寺山門の建立に當つて、五百兩を寄附した。その當時の五百兩は、大金である。けれども、誠拙和尙は、唯だ、簡單に、「然うか」と言はれただけであつた。傳兵衛は五百兩といふ大金を寄附したのであるから、切めて、一言の御禮でも聞き度いと思つた。「和尙さま、たとひ、いくら金のある者でも、五百兩は大金であります。それを御寄附申したのですから、一言、難有うぐらゐは仰せになつても可いでは御座いませぬか」傳兵衛が此う云ふと、和尙は、「何に、禮を言へと云ふのか、お前が功德を積むのに、なぜ、衲が禮を言はねばならんのぢや。」此の一言に、傳兵衛は深く感じ入つて、ます〳〵和尙に歸依したと云ふことである。たとひ、如何なる善事をなしたからとて、報酬を望んで行つたものは、善事と云へぬ。然るに、今日は、さうは行かぬ。殊に、直接、營利的事業に從事して居ると、尙ほ以て、さう行かぬ。總べての方面を觀察すると、世の中は、何んでも、權利、義務、責任、報酬で、何か仕事をすれば、報酬は附いて廻るべきものとなつて居る。それは當然のことではあるが、それ以上に、無報酬的があるといふことを忘れてはならぬ。これが、敎育界、政治界、宗敎界、その他、すべての方面にわたつて、今ま述べたところの、無功德、無報酬といふことを樂しむやうにならねばならぬ。
  translation: '鎌倉の円覚寺の誠拙和尚は近世の高僧であり、この寺の今の山門は、この方が建てたものである。当時の札差に海津伝兵衛という人がいて、円覚寺の山門建立に五百両を寄付した。当時の五百両は大金である。しかし誠拙和尚は、ただ簡単に、

    「そうか」

    といっただけだった。伝兵衛は五百両もの大金を寄付したのだから、せめて一言、お礼でも聞きたいと思った。

    「和尚さま、どんなに金のある者でも五百両は大金でございます。それを寄付したのですから、一言、ありがとうくらいはおっしゃってもよいではありませんか。」

    伝兵衛がこういうと、和尚は、

    「何、お礼をいえというのか。お前が功徳を積むのに、どうして私が礼をいわなければならないのだ。」

    この一言に伝兵衛は深く感じ入り、いっそう和尚に帰依したという。

    どのような善行をしたとしても、報酬を望んで行ったものは善行とはいえない。しかし今日では、そうはいかない。とくに直接、営利事業に従事していると、なおさらそうはいかない。あらゆる方面を見ると、世の中は何でも権利、義務、責任、報酬ということで、何か仕事をすれば報酬がついてくるはずだ、となっている。それは当然のことだが、その上に、報酬を求めない働きがあることも忘れてはならない。

    教育界、政治界、宗教界、そのほかすべての方面で、今述べた、功徳も報酬も求めないということを楽しむようにならなければならない。'
  notes:
  - 札差は、旗本・御家人の俸禄米の受け取りや売却などを請け負った商人。

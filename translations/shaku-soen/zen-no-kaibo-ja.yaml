  section: 中澤道二翁の敎訓
  original: て、總領には嫁をとり、その次ぎは他へ養子にやつたが、何れも〳〵孝行ぞろひで母親を殊の外に大切にしてくれ、家も、ます〳〵繁昌して、後には眞の樂隱居となつたが、時々、若い時に、道二翁から受けた親切な敎訓を思ひ出して、淚ながらに人々にも話して感謝してゐたと云ふことである。何んと面白い話ではないか。當今の輕薄なる婦女子は心肝に銘じて聞くがよい。翁が二度までも娘の言葉を跳ねつけられたのは、娘が有つてをる間に合せの孝行、信實を、全然、奪へ取つて、絕對絕命の域に陷れられたので、これが「獅子迷子の訣」である。
  translation: 'て、長男には嫁を迎え、次の子は他家へ養子に出したが、みな孝行者で、母親をたいそう大切にした。家もますます繁盛し、後には本当に気楽な隠居暮らしとなった。それでも、ときどき若いころ道二翁から受けた親切な教訓を思い出し、涙ながらに人々にも語って感謝していたという。

    なんと興味深い話ではないか。今どきの軽薄な女性たちは、胸に深く刻んで聞くがよい。翁が二度までも娘の言葉を退けたのは、娘の持つ間に合わせの孝行や真心をすっかり取り上げ、絶体絶命の境地に追い込んだのであり、これが「獅子迷子の訣」なのである。'

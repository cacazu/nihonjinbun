  section: 禪と鎌倉武士／八 膽斗の如き相模太郞
  original: '八、膽斗の如き相模太郞

    扨て、此後に出たのは、誰れかと云ふと、今日の兒童走卒でも、能く知つてをる、彼の有名な相模太郞、即ち、時宗公である。賴襄は「膽、斗の如し」と言つた。解剖したわけでは無いが、時宗公の膽玉は水斗の如く大きいと言つてをるが、今、書物について調べて見ると、時宗公が執權職になつたのは、年齡わづかに十九歲であつた。

    この十九歲の齡に初めて蒙古から使者を寄越したのである。それから、三十四歲の時に、蒙古初度の來襲を受け、三十二歲、即ち、弘安四年、再度の大擧來襲を引き受けて、敢然として起つて、國家を双肩に荷ひ、一喝、外寇を掃蕩して、武士道を千歲に扶樹し、我が皇國を泰山の安きに置いたことは、眞に、是れ、空前絕後の壯擧と云はねばならぬ。

    此の奇蹟に似たることは、彼の國の史乘にも見えてをるが、是れより先き、彼の蒙古は、國號を改めて元と稱し、時の元首、忽必烈は、これも世人の知る通り世界に名を得たる英雄で、英雄英雄を生むで、其親は成吉斯汗と申し、これも有名な英雄である。

    此の忽必烈は、當時、非常な勢力を有して、天下を蹂躪し、即ち、東は太平洋、北は北海道、それから西の方へ至りては、歐羅巴の獨澳の或る地點までも勢力範圍が達して居り、南は印度亞剌比亞を包み、さうして、亞細亞の八九分、歐州の大半'
  translation: '八　升ほども肝の大きい相模太郎

    さて、その後に現れたのは誰かといえば、今の子どもや身分の低い者までよく知っている、有名な相模太郎、すなわち時宗公である。頼襄は「肝は斗のようだ」といった。解剖したわけではないが、時宗公の肝っ玉は水をくむ升のように大きいというのである。書物で調べると、時宗公が執権になったのは、わずか十九歳だった。

    その十九歳のとき、初めて蒙古から使者が来た。それから三十四歳のときに蒙古の最初の襲来を受け、三十二歳、すなわち弘安四年に、二度目の大規模な襲来を迎えた。敢然と立ち上がり、国家を両肩に担い、一喝して外敵を払いのけ、武士道を千年先まで支えるものとし、皇国日本を泰山のように揺るぎない安泰に置いたことは、まさに空前絶後の壮挙といわなければならない。

    この奇跡のようなことは、相手国の歴史書にも記されている。それ以前、蒙古は国号を元と改めていた。その元首フビライは、よく知られているとおり世界に名をはせた英雄だった。英雄は英雄を生むというが、その親はチンギス・ハンといい、これも有名な英雄である。

    フビライは当時、非常に大きな勢力をもち、天下を踏みにじっていた。東は太平洋、北は北海道、西はヨーロッパのドイツやオーストリアのある地点にまで勢力が及び、南はインドとアラビアを含んでいた。アジアの八、九割と、ヨーロッパの大半は'
  notes:
  - 初回襲来時を「三十四歳」、その後の再襲来時を「三十二歳」とする不整合は原本にもあるため、そのまま訳した。フビライとチンギス・ハンの関係や勢力範囲も、著者の叙述を再現し、史実の校訂は行っていない。
  - 末文は次コマへ続く。

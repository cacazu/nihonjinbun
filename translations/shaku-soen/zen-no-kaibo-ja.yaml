- id: zen-179-02
  scan: 179
  section: 菜根譚十則／四
  original: '四


    葢世功勞、當不得一個矜字、彌天罪過、當不得一個悔字、（世を葢ふの功勞も、一個の矜の字に當り得ず、天に彌るの罪過も、一個の悔の字に當り得ず）世を葢ふの功勞とは、世間を葢ひかぶせるほどの大功勞ぢや。天下萬世から仰ぎ慕はるゝほどの大功勳を樹てた人でも、若し、其の功勞を矜るといふやうな心が生じたならば、早や其の功勳は水の泡と消えてしまふのである。これを「一個の矜の字に當り得ず」と謂つたのぢや。何故かと云ふと、すべて、世の中の事業といふものは、大きくなれば大きくなるほど、一人の力では出來得るものではない。「一將功成りて萬骨枯る」とは、古人の痛歎であるが、まつたく其通りで、如何なる明君でも、如何なる名將でも、これを輔佐する賢臣や勇卒が無かつたならば、決して、大功は樹て得らるゝものではない。それを、自分一人で成し遂げた氣になつて、高慢の鼻を高くすると、折角の大功勳も此の矜の一字によつて忽ち消えてしまふのぢや。功勞があれば有るだけ、愼まねばならぬのは一個の矜の字である。天に彌るの罪過とは、天一面に覆ひ塞がるほどの罪惡ぢや。神人共に之を惡み、天地も共に之れを容れずといふ程の大なる罪惡でも、一度び自己の衷心から悔ひ改めて、飜然、正しきに復れば、最う其の罪惡は消滅して終ふのである。これを「一個の悔の字に當り得ず」といつたのぢや。何故かと云ふと、凡て善とか惡とか謂ふものは、其の本づくところが此の一心であつて、一心、惡に向へば、如何なる大惡も犯さゞるなしぢや、一旦、飜然として惡を悔悟する時、凡ての罪惡は消え去つ'
  translation: '四

    「世を覆うほどの功績も、『誇る』という一字には勝てない。天を覆うほどの罪も、『悔いる』という一字には勝てない」

    「世を覆う功労」とは、世間を覆い尽くすほどの大きな功績である。世界中から、いつの世にも仰ぎ慕われるような手柄を立てた人でも、もしそれを誇る心が生じれば、その功績はたちまち水の泡と消える。これを「矜の一字には勝てない」といったのだ。

    なぜか。世の事業は、大きくなればなるほど一人の力では成し遂げられない。「一人の将軍が功を成す陰で、万の兵士の骨が朽ちる」とは古人の痛切な嘆きだが、まったくそのとおりである。どれほど優れた君主や名将でも、助ける賢臣や勇敢な兵がいなければ、決して大きな功績は立てられない。それなのに、自分一人で成し遂げた気になって鼻を高くすれば、せっかくの手柄も「誇る」の一字によって消えてしまう。功績があればあるほど慎むべきなのは、この「矜」の一字である。

    「天に満ちる罪」とは、天一面を覆い塞ぐほどの罪悪である。神も人も憎み、天地も許さないほどの大罪でも、一度心の底から悔い改め、きっぱりと正しい道へ戻れば、もうその罪悪は消えてしまう。これを「悔の一字には勝てない」といったのだ。

    なぜか。善も悪も、その根本はこの一つの心にある。心が悪へ向かえば、どんな大悪も犯さないものはない。しかし一度、心を翻して悪を悔い悟れば、あらゆる罪悪は消え去っ'
  notes:
  - 末尾はscan180へ続く。悔悟による罪の消滅は著者の宗教的・倫理的主張であり、現実の被害や責任がなくなるという訳者の判断ではない。
  - 漢文と同内容の訓読は原文に両方保持し、現代語訳は同一引用として一度だけ示した。後続の評釈は省略していない。
  sequence: 264

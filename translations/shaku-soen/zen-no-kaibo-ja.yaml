  section: 支那及び支那の宗敎／四、支邦の佛敎
  original: '四、支邦の佛敎


    佛敎は、印度に於ては古いが、支那では、後漢の明帝の時に、始めて、傳來した新宗敎である（前漢の哀帝の元壽年間に渡來したと云ふ說もあるが、玆には暫らく歷史的考證は避ける）即ち、永平年代に、明帝が靈夢を感じ、博士秦景等に命じて大月氏國に佛法を求めたところ、恰も好し、大月氏國から迦葉摩騰、竺法蘭の二人、'
  translation: '四　中国の仏教

    仏教はインドでは古いが、中国では後漢の明帝のとき初めて伝来した新しい宗教である。前漢の哀帝の元寿年間に渡来したという説もあるが、ここでは歴史的な考証はひとまず避ける。永平年間、明帝が霊夢を見て、博士の秦景らに大月氏国へ仏法を求めに行かせたところ、ちょうど大月氏国から来た迦葉摩騰と竺法蘭という二人が'
  notes:
  - 末尾はscan164へ続く。中国伝来の経緯は著者の叙述に従う。
  sequence: 235
- id: zen-164-01
  scan: 164
  section: 支那及び支那の宗敎／四、支邦の佛敎
  original: 佛經を白馬に乘せて來るのに會つた。是に於て、洛陽に白馬寺を建てゝ彼等を迎へたのである。其後、各朝、相繼ぎ、佛敎も之に伴うて、榮枯盛衰を經、現時に於ては、僅かに其の形骸を止めて居るに過ぎない狀態になつて居る。元來佛敎は、各派に分れて居るも其の本來の面目は、差別即平等、平等即差別であつて、一面から見れば超世間なるも、一面より云へば入世間である。前者を眞諦と云ひ、後者を俗諦と呼ぶ。要するに、平等差別の換言葉である。即ち、佛敎は安心立命を人間以上に求め、而して、一々、その行はるゝ國々の狀態に適應して、社會の發達を助くる宗敎である。故に、支那に入るや、一時は、此の兩者を凌いで非常の勢ひを以て傳播し、其後、二宗三武の排佛等の迫害に會つたが、その都度、反撥して、却つて、盛大となつた。而して、玆に、注目すべきことは、佛敎は、幸か不幸か、始めから國王貴族の間に信奉せられて勢力を得、國王貴族が盛んになれば之も盛んとなり、衰ふれば之れも衰へ、盛衰を共にせし觀があつたが、淸朝を以て國王及貴族は終りを告げたから、同時に佛敎も衰へ、以て今日に至つたのである。是れ土に依つて起つものは、土に依つて倒るの例であつて、是れ亦た止むを得ないことである。
  translation: '仏典を白馬に載せてやって来るのに出会った。そこで洛陽に白馬寺を建て、二人を迎えたのである。その後、王朝が次々に交代するにつれ、仏教も盛衰を重ね、現在ではわずかに形だけを残す状態になっている。

    そもそも仏教は諸派に分かれていても、その本来の姿は「差別即平等、平等即差別」、すなわち違いのあるままで平等、平等でありながら違いがあるということである。一面では世間を超越し、他面では世間に入っていく。前者を真諦、後者を俗諦と呼ぶ。要するに平等と差別の言い換えである。仏教は、心の安らぎと生きる基盤を人間を超えたところに求めながら、それぞれの国の状況に適応して社会の発達を助ける宗教なのである。

    だから中国に入ると、一時は儒教と道教をしのぎ、非常な勢いで広がった。その後、二宗三武の廃仏などの迫害を受けたが、そのたびにはね返し、かえって盛大になった。ここで注目すべきなのは、仏教が幸か不幸か、初めから国王や貴族に信奉されて勢力を得たことである。国王や貴族が栄えれば仏教も栄え、衰えれば仏教も衰えるというふうに、盛衰を共にした観がある。清朝を最後に国王と貴族の時代が終わったため、仏教も同時に衰え、今日に至った。これは、土によって立つものは土によって倒れる、という一例であり、やむをえないことでもある。'
  notes:
  - 冒頭はscan163から続く。「二宗三武」は底本の記載に従った。
  sequence: 236
- id: zen-164-02

  section: 信の一字／二、信とは何ぞや
  original: 二、信とは何ぞや扨て、信は、今更ら解釋するまでもない。されど、信とは何ぞやと各個人に尋ねたならば、如何あらう。神佛にお祈りすることなりと、かう云ふと、世の中には、我れ〳〵は神佛に祈るほど老耄れては居ないと答ふる人もあらうが、信とは眞實僞りなき心である。本心眞心である。之れを佛心佛性と云つてもよい。明治天皇の御製に、目に見えぬ神にむかひて慚ぢざるは人の心のまことなりけり
  translation: '二　信とは何か


    さて、信は今さら説明するまでもない。しかし、「信とは何ですか」と、一人一人に尋ねてみたら、どうだろう。「神仏に祈ることです」と言えば、「私たちは、神仏に祈るほど老いぼれてはいない」と答える人もいるだろう。だが信とは、真実で偽りのない心である。本心、真心であり、仏の心、仏の性質と呼んでもよい。明治天皇の御製に、


    「目に見えない神に向かっても恥じるところがないのは、人の心の誠実さである」'

  section: 支那及び支那の宗敎／五、現時の儒・道・佛
  original: 五、現時の儒·道·佛支那人の一部特別なる方面に勢力を有する耶蘇敎及び回々敎は暫く措き、今ま支那民間に、最も一般的に行はるゝ此の三宗敎の狀況を見るに、第一に、儒敎は、全く、記誦辭章の學問の如くなりて、一流の人士の間に行はれ。第二に、道敎は、二三流の間に行はれてゐるが、唯だ吉凶禍福に就いて依賴し、不老不死を希ひて、以て、飽くまでも現世の肉體的、物質的の慾望を滿足せんことを祈禱する手段となつて、福利を恣にして、人間の享樂を十分にする方便となり、老子時代の本旨とは全く異つて來た。娘々廟、關帝廟のやうなものを到る處に
  translation: '五　現在の儒教・道教・仏教

    中国人のある特別な層に勢力を持つキリスト教とイスラム教はひとまず置き、民間で最も一般的に行われているこの三宗教の様子を見よう。

    第一に、儒教は、ほとんど暗記と文章作りの学問のようになって、上層の人々の間で行われている。

    第二に、道教は二流・三流の人々の間に行われるが、ただ吉凶や禍福について頼り、不老不死を願って、徹底して現世の肉体的・物質的欲望を満たそうと祈る手段となっている。幸福や利益を思うままに得て、人間の享楽を十分にするための方法となり、老子の時代の本旨とはまったく違ってきた。娘々廟や関帝廟のようなものを、至るところに'
  notes:
  - 原文の「一流」「二三流」という階層的評価も著者の見方として訳した。末尾はscan165へ続く。
  sequence: 237
- id: zen-165-01
  scan: 165
  section: 支那及び支那の宗敎／五、現時の儒・道・佛
  original: 造つて居る。第三に、佛敎は、歸依者たり保護者たる國王亡び、僅かに山林に餘喘を保つの振はざる狀態であるが、衲の見るところを以てすれば、江蘇、浙江、福建地方の如き尙ほ、盛んに行はれ、數に於ても、其の實質に於ても、之れを他の宗敎に比すれば立派である。其の古のやうに盛んで無いのは、前述の如く保護者の無いのと、元來、人類救濟のものであるに係らず、今日の支那では、全く社會と沒交渉たるかのやうな觀を呈するからである。佛敎は、今日、支那に於て、斯くの如く、不振の狀態にあるが、衲は、支那將來の宗敎として、最も適應するものは、佛敎以外には無いと信ずるものである。佛敎は決して貴族的では無い。現に佛が山を出で、最初、宣言せられし語に、「四河海に歸すれば皆な同一鹹味なり、四姓（婆羅門、刹帝利、毘沙、須陀、英人は之をカストと稱す）佛に歸すれば同じく佛子」とある。支那の將來は、此の主旨を基礎とし、一般民心を根本とし、平等即差別の敎理を中心として、以て國家の隆昌を計らねばならぬと思ふ。
  translation: '造っている。

    第三に、仏教は、帰依者であり保護者であった国王が滅び、山林でかろうじて命脈を保つ不振な状態にある。しかし私の見るところ、江蘇・浙江・福建地方などではなお盛んで、数の点でも内容の点でも、ほかの宗教に比べて立派である。昔ほど盛んでないのは、前に述べたように保護者がいなくなったことと、本来は人類救済のためのものなのに、今の中国では社会とまったく関わらないかのように見えるためである。

    仏教は今、中国でこのように不振だが、中国の将来の宗教として最も適しているものは仏教以外にないと、私は信じている。仏教は決して貴族的なものではない。実際、仏が山を下りて最初に宣言された言葉には、

    「四つの川も海に入れば、同じ塩味になる。四つの身分――バラモン、クシャトリヤ、ヴァイシャ、シュードラ。イギリス人はこれをカーストという――も、仏に帰依すれば同じ仏の子である」

    とある。中国の将来は、この趣旨を基礎として、広く民衆の心を根本に置き、差異と平等が一つであるという教えを中心に、国家の繁栄を図らなければならないと思う。'
  notes:
  - 冒頭はscan164から続く。仏の発言とされる文は著者の引用に従う。
  sequence: 238
- id: zen-165-02
  scan: 165
  section: 支那及び支那の宗敎／六、支那の國狀と宗敎
  original: '六、支那の國狀と宗敎


    支那の將來は何れは統一せらるゝであらう。さうして、鞏固な立憲的中央政府を樹立し、以て、內には國民の安固を計り、外には、外侮を禦がねばならぬ。それにしても、我が明治大帝の如く、彼のワシントンの如き、有德の人でなければ、此の大業を成すことは出來まい。が、要するに時日の問題である。必ずや、かくの如き大人物が出現して國家を泰山の安きに置くことであらう。それには、是非共、立派な宗敎の援助を得るの必要がある。さうしてこの宗敎は前述のやうに、平等即差別眞諦俗諦、絕對相對、皆な之れを兼有する廣大深遠な佛敎でなければならぬ。こゝに平等即差別の敎理を、極めて簡單に說明する二偈がある。'
  translation: '六　中国の国情と宗教

    中国はいずれ統一されるだろう。そして堅固な立憲的中央政府を樹立し、内には国民の安定を図り、外には外国からの侮りを防がなければならない。この大事業は、わが明治大帝やワシントンのように徳のある人でなければ成し遂げられまい。しかし、要するに時間の問題である。必ずそのような大人物が現れ、国を泰山のような安定した状態に置くだろう。そのためには、ぜひ立派な宗教の援助を得る必要がある。そして、その宗教は、前述のように平等と差別、真諦と俗諦、絶対と相対をすべて併せ持つ、広大で奥深い仏教でなければならない。ここに、平等と差別が一つであるという教えを、ごく簡単に説明する二つの偈がある。'
  notes: []
  sequence: 239
- id: zen-166-01
  scan: 166
  section: 支那及び支那の宗敎／六、支那の國狀と宗敎
  original: 身是菩提樹、心如明鏡臺、時々勤拂拭、莫使惹塵埃、と。之れに反して、菩提本非樹、明鏡亦非臺、本來無一物、何處惹塵埃、と。一は平等であつて、一は差別、互ひに相表裏して、その面目を、此の短偈中に說破し終れるものである。終りに、日支兩國の國交について云はゞ、我が國民は、且く利權獲得に熱することを止め、善隣支那に對して、政治家は政治上より、經濟家は經濟上より、宗敎家は宗敎上から、各、その分に應じて、先づ何物かを與へ、以て其の發達を援助せなければならぬ。取らんと欲せば先づ與へよの語がある。恰も、與へるの前提の觀をなす者があるやも知れぬが、今は左うでない。我國は、須らく、世界の大勢、日支兩國の現狀から見て、取ることは之れを忘れ、先づ何物かを與へねばならぬ。與へて以て彼れを援助せなければならぬ。我が國民は、餘りに、利權問題等、支那より取るに急なる嫌ひは無いであらうか。衲は、此の見地からして、現在及び將來に亘つて、生命ある宗敎を以て、支那人に與ふるところあらんと欲するものである。
  translation: '「この身は悟りの樹、心は明鏡の台のようなもの。いつも努めて磨き、塵やほこりを付けてはならない」

    これに対して、

    「悟りはもともと樹ではなく、明鏡にも台はない。本来、一つの物もないのだから、どこに塵やほこりが付くだろう」

    という。一つは平等を、もう一つは差別を説き、互いに表裏となって、その本質をこの短い偈の中に言い尽くしている。

    最後に日中両国の関係についていえば、日本国民はしばらく利権の獲得に熱中することをやめ、よき隣国である中国に対し、政治家は政治から、経済家は経済から、宗教家は宗教から、それぞれの分に応じて、まず何かを与え、その発達を助けなければならない。「取ろうと思うなら、まず与えよ」という言葉がある。それを与えることの前提と見る人もいるかもしれないが、今いっているのはそういうことではない。日本は世界の大勢と日中両国の現状から考えて、取ることを忘れ、まず何かを与えなければならない。与えることで相手を助けなければならない。日本国民には、利権問題などで中国から取ることをあまりにも急ぎすぎるところはないだろうか。私はこの見地から、現在と将来にわたって、生きた宗教を通じ、中国の人々に何かを与えたいと願うのである。'
  notes:
  - 二つの偈は一般に神秀・慧能に帰せられる。原文は「一は平等、一は差別」と並べるのみで、順番を明示していない。

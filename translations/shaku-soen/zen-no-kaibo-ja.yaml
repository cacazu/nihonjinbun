  section: 歸省禪師の脚下點檢
  original: '浮山の圓鑑和尙と天衣山の義懷和尙と、此の二人がまだ修行中のことである。汝州葉縣廣教院の歸省禪師の家風が頗る嚴冷枯淡であると聞き、その爐鞴に投ぜんと寒中風雪を犯して訪ねて行つた。かくて、旦過寮で坐禪をして居ると、そこへ禪師が歸つて來られ、大いに呵責すると共に、頭から水を注ぎかけられた。この豪い劍幕に、他の雲水は膽を潰して歸つてしまつたが、此の二人だけは、ビシヨ濡れになつたまゝで、依然として坐禪をして居つた。そこで、

    「汝等、去らずんば、我れ、汝等を打せん」

    と云つて痛棒を與へられたが、それでも二人は動く色がなかつた。その不惜身命の修行振りを見屆けられて、

    「汝等兩箇參禪を要す、今日より掛錫隨身せよ」

    と云つて參學を許された。よほど志氣の堅固なもので無いと、大概は、この寒中行水に吃驚して逃げてしまつたさうな。かゝる事をされたのは、禪師が彼等修行者の脚下を點檢されたのである。'
  translation: '浮山の円鑑和尚と、天衣山の義懐和尚、この二人がまだ修行していたころのことである。汝州葉県の広教院にいる帰省禅師の指導は、非常に厳格で飾り気がないと聞き、その厳しい鍛錬に身を投じようと、真冬の風雪を冒して訪ねていった。

    旅の僧が泊まる旦過寮で坐禅していると、禅師が帰ってきて、ひどく叱りつけたうえ、頭から水を浴びせた。その激しい剣幕に、ほかの修行僧は肝をつぶして帰ってしまったが、この二人だけは、びしょ濡れのまま坐禅を続けていた。そこで禅師は、「出ていかないなら、お前たちを打つぞ」と言って、厳しく棒で打った。それでも二人は動こうとしなかった。

    身命を惜しまないその修行ぶりを確かめると、禅師は、「お前たちは二人とも、本当に禅を学びたいのだな。今日からここに留まり、私について修行せよ」と言って、入門を許した。よほど志の固い者でないと、たいていは、この真冬の水浴びに驚いて逃げてしまったそうである。このようなことをしたのは、禅師が修行者の足元、つまりその覚悟の確かさを点検したのである。'
  notes:
  - 水を浴びせ、棒で打つ場面は底本の歴史的叙述として訳した。

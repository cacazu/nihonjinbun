  section: 誰か言ふ弱き者と／一 心裏の夜叉と天人と
  original: '誰か言ふ弱き者と

    一、心裏の夜叉と天人と

    沙翁の云つた「弱き者よ汝の名は女なり」といふ語は有名であるが、老衲は「强き者よ汝の名は女なり」と云ひ度いのぢや。何となれば、弱いところが女の强いところであるからぢや。昔から、女の髮の毛一本で大きな象もつなげるといふが、古來、英雄豪傑を掌上に飜弄し、一國一城も爲めに傾いたといふ例は、歷史に數多いことである。併し乍ら、老衲は、世の謂ゆる妖婦、毒婦を强いといつて讃美するものでは無い。老衲の讃美する强い女は、執金剛神の働きある女である。世間一般の婦人に、老衲は、是非これを心掛けてもらひ度いのぢや。

    執金剛神とは、よく寺院の二王門に安置されてあるが、これは天界の力士ともいふべきもので、斷惡生善の神である。換言すれば、人道の權化とも見るべきであつて、古來の英傑は皆な此の執金剛神としての働きがある。

    お經の中には、天人（天界の有情）だの、天女（女性の天人）だの、或は、夜叉であるとか、惡鬼であるとか、いろ〳〵さま〴〵の名前が散見してをるが、世間の人達は、一體、そんなものが何處に居るのであらうと怪むであらうが、何處に居る彼處に居るといふべきものでは無い。皆な、各人が心の中に居るのである。女の心の中にも、いろ〳〵のものが住んでをる。

    動物のやうで動物でもなく、神樣のやうで神樣でもないところの天龍も、惡鬼のやうな夜叉も、天上界の音樂師である乾闥婆も、爭鬪を事として日を暮らしてをる阿修羅も、妙な聲を出して囀づる天上界の靈鳥なる迦樓羅も、天界の唄子である緊那羅も、大蛇のやうな摩喉羅迦も、みな女の心のうちに住んでをる。

    彼の八百萬の神々方も、高天原にばかり在られるのではない。自分たちの心が、'
  translation: '誰が女性を弱い者というのか

    一　心の中の夜叉と天人

    シェークスピアの「弱き者よ、汝の名は女なり」という言葉は有名だが、私は「強き者よ、汝の名は女なり」といいたい。というのも、弱いところこそ女性の強いところだからである。昔から、女性の髪の毛一本で大きな象もつなげるという。英雄豪傑を手のひらの上で操り、そのために国や城さえ傾いた例は、歴史に数多い。しかし私は、世にいう妖婦や毒婦を、強いからといって褒めたたえるのではない。私がたたえる強い女性とは、執金剛神の働きをもつ女性である。世の女性たちには、ぜひこのことを心にかけてもらいたい。

    執金剛神は、よく寺の仁王門に安置されている。天界の力士とでもいうべき存在で、悪を断ち、善を生む神である。いい換えれば、人の道の化身ともいえる。昔からの英傑は、みなこの執金剛神としての働きをもっている。

    お経には、天人、つまり天界の生きものや、女性の天人である天女、あるいは夜叉や悪鬼など、さまざまな名が出てくる。世間の人は、いったいそんなものがどこにいるのかと不思議に思うだろう。しかし、あそこにいる、ここにいるというものではない。すべて一人ひとりの心の中にいるのだ。女性の心にも、さまざまなものが住んでいる。

    動物のようで動物でもなく、神のようで神でもない天龍も、悪鬼のような夜叉も、天上の音楽家である乾闥婆も、争うことに日を費やす阿修羅も、不思議な声でさえずる天上の霊鳥、迦楼羅も、天界の歌い手である緊那羅も、大蛇のような摩喉羅迦も、みな女性の心の中にいる。

    八百万の神々も、高天原だけにいるのではない。私たち自身の心が、'
  notes:

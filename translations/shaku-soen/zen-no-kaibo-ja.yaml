  section: 大道周行／一、吾道一もつて貫く
  original: 「伊に業識性あるが爲めなり」と答へられた。これは、禪門で有名な六ヶ敷い公案で、此の一無字の公案を、古來、幾多の英雄豪傑が、皆な血の涙を流して研究し、立派な人になつて居る。その一則である。問うた坊さんは、始めから理窟を持つてゐる。佛は一切衆生悉く佛性ありと言はれたのに、なぜ、狗にだけは佛性が御座らぬかと、無といふ字を、虛無、または、滅無の意味に誤解した。こんな事では、とても禪宗の眞意は分らぬ。此の坊さんは、唯だ普通の學問的の理窟で解して、無といふのは、狗子に佛性が無いと受けたのであらう。その位の坊さんで有つたから、趙州は、再び、「彼れに業滅性あるが爲めなり」と答へられた。業滅とは、平たく云へば、迷ひの心である。これを教相的に解釋するならば、餘程の言葉を費さなければならぬが、今は要がない。かう云ふことは、文字や、言語の表面からは、とても其の眞意は分らぬ。分らぬが、其の問答往來の樣子が能く似て居る。「一以て貫く」「唯」と受けた。それは、孔子と曾子との間には通じて居る。門人等には、さつぱり、分らなかつた。そこで、問うたら、曾子は、「忠恕のみ」と答へられた。これは曾子の力である。併し、忠恕といふことも大事ではあるが、「一貫」といふことに就ては、「忠恕」と世間で解して居るくらゐの意味では、未だ盡きない。先づ、文意は、まことに見易い言葉であるが、扨て、その孔子の眞意を推測つてみると、なか〳〵深遠微妙である。
  translation: '「それには、迷いの心があるからだ」

    と答えられた。


    これは禅で有名な、難しい公案である。この「無」の一字をめぐる公案に、古来、多くの英雄や豪傑が、血の涙を流して取り組み、立派な人物になっている。その一つの例だ。質問した僧は、初めから理屈を抱えている。仏は、すべての生きものに仏性があると言われたのに、なぜ犬にだけはないのか、と。「無」という字を、何もない、あるいは消えてなくなる、という意味に誤解したのだ。そんなことでは、禅の本当の意味は、とてもわからない。この僧は、普通の学問上の理屈で理解し、「無」とは犬に仏性がないということだと受け取ったのだろう。その程度の僧だったから、趙州は重ねて、「それには迷いの心があるからだ」と答えられた。「業識」は、わかりやすくいえば、迷いの心である。これを教義の分類に沿って説明するなら、ずいぶん言葉を費やさなければならないが、今は必要ない。


    こういうことは、文字や言葉の表面からでは、とても本当の意味がわからない。わからないけれども、その問答のやり取りの様子は、よく似ている。

    「一つのもので貫かれている。」

    「はい。」

    と受け止めた。孔子と曾子のあいだでは、これで通じている。しかし、門人たちには、さっぱりわからなかった。そこで尋ねると、曾子は、

    「誠実さと思いやり、それだけです」

    と答えられた。これは曾子の力量である。しかし、誠実さと思いやりも大切ではあるが、「一つに貫く」ということは、世間で理解している程度の「誠実さと思いやり」では、まだ言い尽くせない。言葉の意味そのものは非常にわかりやすいが、さて、その孔子の真意を推し量ってみると、実に奥深く微妙なのである。'
  notes:
  - 冒頭は前コマからの続き。
  - 冒頭は「業識」だが、途中の再引用と説明では原文が「業滅」となっている。訳語は冒頭に合わせ、迷いの心を意味する「業識」とした。

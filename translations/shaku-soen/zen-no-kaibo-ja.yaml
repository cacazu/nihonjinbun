  section: 大なる樂觀の上に／四、永久不變の大道
  original: 觀悲觀を超越して、そこに、始めて、永久不滅の大道を認めることが出來る。彼の朝咲いて午を待たず萎れてしまふ朝顏の花は、まことに短い壽命のやうではあるが、朝顏の本體から云へば、六七月の頃から秋の末まで花は咲いてをる。半歲に近い永い壽命と見ることが出來る。更らに深く考へると、今年の種は去年の種から生じ、去年の種は一昨年の種から生じてをる。過去に際限がなく、未來に際限がなく連綿として續いてをる。決して、果ない一生ではない。人の一生も、形體の上から云へば短い壽命ではあらうが、本體から眺めると無始無終である、而して、この本體たる宇宙の大精神を人格化したものが佛であり神である。吾人は、この大精神、大信念を手に入れて、そこに立脚すると、前途洋々として春の海の如き、平和な愉快な希望に生き〳〵として一生を終ることが出來るのである。諸君は、宜しく、小なる樂觀悲觀を超越して、大なる眞の樂觀の上に安住するやうに努力せられんことを祈つて已まぬ次第である。
  translation: '楽観や悲観を超えたところに、初めて永遠に滅びない大道を認めることができる。

    朝に咲き、昼を待たずにしおれる朝顔の花は、実に短い命のようである。しかし、朝顔の本体からいえば、六月、七月ごろから秋の終わりまで咲いている。半年に近い、長い命と見ることもできる。さらに深く考えれば、今年の種は去年の種から生まれ、去年の種は一昨年の種から生まれている。過去にも未来にも際限なく、連綿と続いている。決してはかない一生ではない。

    人の一生も、形の上からいえば短い命だろうが、本体から眺めれば、始まりも終わりもない。そして、この本体である宇宙の大きな精神を人格化したものが、仏であり神である。私たちがこの大きな精神、大きな信念を手に入れ、そこに立脚すれば、前途は春の海のように広々と開け、平和で愉快な希望に、生き生きと一生を送ることができる。

    皆さんが、小さな楽観や悲観を超えて、大きな、真の楽観の上に安らかに住むよう努めてくださることを、願ってやまない。'

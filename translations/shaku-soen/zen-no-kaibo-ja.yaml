  section: 敬神の念を起せ／三 神化し靈化せよ
  original: '三、神化し靈化せよ

    祖先崇拜や、偶像崇拜などは、野蠻時代の遺風であつて、今日の世の中に、そんな事をいふのは愚鈍だと貶す人もあるかは知らんが、それは大いに間違つてゐる。親を大事にする心ある者ならば、期せずして祖先を大切にする。

    此心は、即ち上皇祖皇宗に事へまつる所以であつて、親を敬ひ、祖先を重んずるの精神のない者は、皇祖皇宗を崇拜する所以を辨へぬ者である。祖先を拜むなどは實に開けないことだと笑ふが如きは、實に憐むべき淺見である。

    或は、又た、木像や何かを拜むのは、愚の至りだと冷笑するかも知れんが、木を拜するのでは無い、又た金を拜むのでも無い、金も木をも、乃至は、糞土をも、光明赫々たるものに純化し、靈化するのである。是れ、即ち、精神の力、言ひ換ふれば、信仰の力である。

    單に、木を木と見、土を土と觀、金を金と看、水を水と視るのは、謂ゆる物質的學者の見解である。木をも、土をも、金をも、水をも、神化し、佛化し、靈化するは、信仰心である。

    こゝを見なければ、單に、物と物と見るだけで、それ以上、何等、感覺なきは、眞の信仰に至つたものでは無いと思ふ。

    我れ〳〵が、今日、かくの如く世の中に立つて行けるのは、親のお蔭、また祖先の賜で、社會的に考へると、偏へに、先人、努力の賜に外ならない。我れ〳〵は、此の賜を、最善の力を竭くして、より善きものと爲して、子孫に傳へるのが、'
  translation: '三　神聖なもの、霊的なものにせよ

    祖先崇拝や偶像崇拝は野蛮な時代の名残であり、今の世にそんなことをいうのは愚かだ、とけなす人もいるかもしれません。しかし、それは大きな間違いです。親を大切にする心がある人なら、意識せずとも祖先を大切にします。

    この心こそ、上に立つ皇室の祖先や歴代の天皇にお仕えする根拠です。親を敬い、祖先を重んじる心のない者には、皇室の祖先を崇拝する意味もわかりません。祖先を拝むなど遅れたことだと笑うのは、実に気の毒なほど浅い見方です。

    木像などを拝むのは愚の極みだ、と冷笑するかもしれません。しかし木を拝むのでも、金属を拝むのでもありません。金属も木も、それどころか汚れた土さえも、光り輝くものへと純化し、霊的な存在とするのです。それが精神の力、いい換えれば信仰の力です。

    木をただ木と見、土を土、金属を金属、水を水と見るのは、いわゆる物質の側から考える学者の見方です。木も土も金属も水も、神聖なもの、仏の現れ、霊的なものとするのが信仰心なのです。

    この点を見ず、物をただ物として見るだけで、その先に何も感じないのであれば、真の信仰には至っていないと思います。

    私たちが今日、こうして世の中で生きていけるのは、親のおかげであり、祖先からの贈り物です。社会の面から考えれば、まったく先人たちの努力のたまものにほかなりません。その贈り物を、力の限り尽くしてさらによいものにし、子孫へ伝えることが、'
  notes:
  - 原文の「物と物と見る」は文意に従い「物をただ物として見る」とした。
  - 末文は次コマへ続く。
  sequence: 145

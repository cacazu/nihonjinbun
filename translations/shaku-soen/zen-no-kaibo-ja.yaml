  section: 大なる樂觀の上に／二、四苦八苦の人生
  original: ない。即ち、是等の欲望は容易に達せられるものでは無いのである。欲望が達せられないとしたならば、必然的に限りなき苦痛が生じてくる。釋尊は、之れを、人生の四苦八苦と教へられて居る。四苦といふのは、生·老·病·死の四つで、この四苦に、哀別離苦(愛する者に別れねばならぬ苦み)怨憎會苦(仲の惡い者と一緒に居なければならぬ苦み)求不得苦(願ひ求むることが遂げられぬ苦)憂悲惱苦(思ひ惱む苦み)と、この四つの苦みを加へて八苦といふのである。この四苦八苦は、人生に於て、到底、免れ得ないところのものである。
  translation: ない。これらの欲望は、簡単に満たせるものではないのである。欲望が満たされなければ、必然的に限りない苦しみが生まれる。釈尊はこれを人生の四苦八苦と教えた。四苦とは、生・老・病・死の四つである。これに、愛する者と別れなければならない「哀別離苦」、仲の悪い者と一緒にいなければならない「怨憎会苦」、願い求めてもかなえられない「求不得苦」、思い悩む「憂悲悩苦」を加えて、八苦という。この四苦八苦は、人生において、どうしても免れることのできないものである。

  section: 生まれぬ先きの面魂
  original: 昔、六祖大師が、大瘦嶺で、「不思善不思惡、那箇か、是れ、明上座、父母未生以前本來の面目」と示された一句によつて、明上座は、豁然として大悟したと云ふことである。白隱禪師は、生れぬ先きの面魂を持つて來いと云はれた。生まれぬ先きの面魂、何處に善があるか、何處に惡があるか。換言すれば、我れ〳〵は、常に、相對差別の境に頭出頭沒して、迷ひとか悟りとか、是とか非とか、頭を二つに分けてをるから、惜しい、欲しい、可愛い、憎いの煩惱妄想が競ひ起るのである。一度、絕對無差別の境に歸入せんか、自他彼此の邪見は立ちどころに無くなつてしまふ。これは禪宗で云ふ所で、之れを他宗で云へば、南無阿彌陀佛と一心に稱へる時、南無妙法蓮華經と渾身これに成り切つた時、そこに何んの煩惱があるか、妄想があるか。要するに、聖道門といひ、淨土門と云ふも、玄關の違ひだけで、奧に入つて見れば、皆な同じ座敷に通るのである。唯だ淨土門は情を以て導くから平易に聞こえ、聖道門は智を以て導くから六づかしく聞こえるまでゞある。淨土門で云へば、唱ふれば佛も我れもなかりけり南無阿彌陀佛、南無阿彌陀佛といふまで立ち到らねばならぬ。禪宗で云へば、通心徹心、自他一如になり切らねばならぬ。いくら理窟で煩惱は無いぞ〳〵と抑へつけてゐても、下から〳〵と頭を持ち上げて來る。石で抑へて居る間はよいが、少し隙間を見出すと、忽ち、雜草は生へ繁るものである。故に、大徹大悟を以て、根こそぎ引き拔かねばならぬ。田の草を取りて踏み込む肥料かな今まで害をなせし田の草も、根こそぎ引き拔いて踏み込めば、却つて、之れが肥
  translation: '昔、六祖大師が大庾嶺で、「善を考えず、悪も考えない、そのとき、明上座よ、父母が生まれる以前からの、あなた本来の姿とはどれか」と示した。この一句によって、明上座は一挙に大悟したという。白隠禅師は、「生まれる前の顔つきを持ってこい」と言われた。

    生まれる前の顔つきに、どこに善があり、どこに悪があるだろう。言い換えれば、私たちはいつも相対的な区別の世界に浮き沈みして、迷いと悟り、正と誤と、物事を二つに分けている。そのため、惜しい、欲しい、かわいい、憎いという煩悩や妄想が競って起こるのである。ひとたび絶対で区別のない境地に帰れば、自分と他人、あちらとこちらを分ける誤った見方は、たちまち消えてしまう。

    これは禅宗の表現だが、ほかの宗派の言葉でいえば、一心に「南無阿弥陀仏」と唱えるとき、全身で「南無妙法蓮華経」そのものになりきるとき、そこに何の煩悩や妄想があるだろう。要するに、聖道門も浄土門も玄関が違うだけで、奥へ入れば、同じ座敷に通じている。ただ、浄土門は情によって導くからやさしく聞こえ、聖道門は智によって導くから難しく聞こえるだけである。浄土門の言葉でいえば、

    「唱えていると、仏も自分もなくなっていた。ただ、南無阿弥陀仏、南無阿弥陀仏。」

    というところまで至らなければならない。禅宗ならば、心の底まで徹し、自他の区別のない境地になりきらなければならない。いくら理屈で「煩悩などない、ない」と押さえつけても、下から下から頭を持ち上げてくる。石で押さえている間はよいが、少しでも隙間ができれば、雑草はすぐに生い茂る。だから、徹底した悟りによって、根こそぎ引き抜かなければならない。

    「田の雑草も、抜き取って土に踏み込めば肥料になる。」

    今まで害を及ぼしていた田の雑草も、根こそぎ引き抜いて踏み込めば、かえってそれが'
  notes:
  - 末尾の「肥料」はscan58へまたがる。
  - 底本は「大瘦嶺」（ルビは「だいそうれい」）。六祖と明上座の問答という文脈から大庾嶺を指すと解して訳した。

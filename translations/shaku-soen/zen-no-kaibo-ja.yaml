  section: 中澤道二翁の敎訓
  original: と云つて、更に娘に向ひ、「これ娘、そなたの考へを、今一應、先生に申し上げて見やれ」と云はれて、娘は亦た手を突き、「此間、舅姑御へ孝行をしようの、小舅小姑へ親切を盡しませうの、又た三人の繼子は可愛がつて遣りませうのと申しましたのは、どうやら私の心に隔てもあるやうで、仕なくもよいことを、仕方なしにすると云ふやうに聞こえますかとも存じます。そこで、先生が、惡いと仰せになつたのであらうと、夜前も母樣と話をいたしました。これからは、左樣な了見は、さつぱり捨てまして、唯だ舅姑
    御は私が本當の父樣だと信じ、小舅小姑は私が本當の兄弟と思ひ、三人の繼子も繼子と思ひませず、身腹やつた本當の子だと思ひましよう。左樣心得ましては如何で御座いませう」と云ふと、翁は大きに怒つて、「それは、また、言語同斷な惡い了見ぢや。女の身として、そのやうな利口な了見を持つて居られては、何處へ嫁入りせられても、尻のすわる時は御座らぬ。これや、此間の了見よりは、又た一層、惡うなつた。舅姑御を本當の親と思ふの、小舅小姑を本當の兄弟だと思ふの、又た、三人の繼子を我が產んだ本當の子だと思ふのそれや、皆な當座の出來合ひ了見と云ふもので、何れ末まで屆かぬもんぢや。これ母御、どうでも此の緣談は止めにせられるが可い。娘御のあの心得では、何れ長久はしませんから」と云はれたから、親子とも、今度は、いよ〳〵膽を潰して、暫らく言葉もなかつたが、稍やあつて、淚を流しながら、「扨て〳〵御親切、有難う存じます。併し乍ら、此上は、とても、我れ〳〵が考へには及びませぬことで御座いますから、何うか御示しを願ひ度う御座います」と幾重にも賴み入つた。すると、翁は、莞爾と笑ひながら、
  translation: 'といい、娘に向かって、

    「さあ、お前の考えを、もう一度先生に申し上げてごらん」

    と促した。娘はまた手をつき、

    「先日、舅さま姑さまに孝行しよう、夫の兄弟姉妹に親切を尽くそう、三人の子どもをかわいがってあげようと申しましたのは、どうやら私の心に隔てがあって、しなくてもよいことを、仕方なしにするように聞こえたのかとも思います。それで先生は悪いとおっしゃったのだろうと、昨夜も母と話しました。これからはそういう考えをすっかり捨て、舅さま姑さまを本当の親だと信じ、夫の兄弟姉妹を本当のきょうだいだと思い、三人の子どもも継子とは思わず、自分が産んだ本当の子だと思うことにします。そういう心構えではいかがでしょうか」

    というと、翁は大いに怒り、

    「それはまた、言語道断の悪い考えだ。女の身でそんな小ざかしい考えを持っていたら、どこへ嫁いでも腰の落ち着くことはない。先日の考えより、さらに悪くなった。舅姑を本当の親と思うとか、夫の兄弟姉妹を本当のきょうだいと思うとか、三人の子を自分が産んだ本当の子と思うとか、それはみな、その場しのぎの考えというものだ。いずれ、最後までは続かない。お母さん、どうしてもこの縁談はおやめになるのがよい。娘さんのあの心構えでは、いずれ長続きしませんから」

    といった。親子は今度こそすっかり驚き、しばらく言葉もなかったが、ややあって涙を流しながら、

    「本当にご親切、ありがとうございます。しかし、これ以上はとても私たちの考えが及びません。どうかお教えいただきとうございます」

    と幾重にも頼み込んだ。すると翁は、にっこり笑って、'

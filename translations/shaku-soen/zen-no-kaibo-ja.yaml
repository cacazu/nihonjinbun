  original: るやうになければならぬ。尙ほ、義太夫でも、流行歌でも、聞きやうによつては、情味の修養になる。西洋の家庭を見ると、必ず、樂器が具へてあるし、卓上には、宗敎の書籍とか、又たは文學上の書籍が置いてある。それだけを見ても、家庭の中に、情的修養の準備が出來てゐると云ふことが分るであらう。
  translation: 'るようにならなければならない。義太夫でも流行歌でも、聞き方によっては、感情を豊かにする修養になる。

    西洋の家庭を見ると、必ず楽器が備えてあり、机の上には宗教の本や文学の本が置いてある。それだけを見ても、家庭の中に感情を養う用意ができているとわかるだろう。'

- id: zen-054-01
  scan: 54
  section: 大道周行／三、道は神と共にあり
  original: と云ふて御座る。こゝに一とあるのは、數字上の意義では無い。暫く、道といふものを體と用との二つに分ける。體用といふものは、必らず、何事にもある。今ま道體といふものから言ふと、孟子は「曰く言ひ難し」と申されたが、言ひ難しどころではない、實に、言語、文字、想像、分別といふやうなことは、すつかり立ち超えて居るから、如何なる人と雖も、此處に一言も挾むことは出來ぬ。謂ゆる「止々不須說、我法妙難思議」で、此儘、大道は顯はれて居ると云ふより外はない。これは〳〵とばかり花の吉野山松島や、あゝ松島や、松島やのほかは無い。それでも道體に遠ざかつて居るが、かう云ふより仕方はないのだ。然るに、その大道の作用といふものに至つては、實に、千變萬化、變現極りない所のものであるから、なか〳〵目の子算用で推し量ることが出來ない。今日、科學とか、サイエンスとか言つて居るのは、その部分〳〵について、唯だ或る程度までの道理を明めて行くだけで、其の用といふものは、實に、限りない所のものである。かういふ工合に、之れを考へて來るといふと、我れ〳〵は、やはり、其中に宿されてあると言つてもよい。又た、主觀的に考ふれば、其物と共に起き、物と共に寢ね、其物と共に、常住、活動して居ると言つてもよい。老子は、そんな鹽梅に申されて居る。又た、バイブルの中にも、「太初に道あり、道は神と共にあり、神は道なり、道は神なり」ともあつたやうに覺えてをる。それが、佛教とか、禪とか云ふものに這入つて見ると、佛の一代の說教も、また、祖師の千七百の公案も、つまり、道といふものゝ甚深微妙なることを示されたに外ならぬ。三祖、僧璨大師の言葉によると、「至道は無難なり、唯だ揀擇を嫌ふ、但だ憎愛なければ洞然として明白なり、毫釐も差あれば天地懸隔す」
  translation: 'と言っておられる。ここの「一」は、数の上での意味ではない。ひとまず、道を、本体と働きという二つに分けてみよう。本体と働きは、必ずどんなものにもある。今、その道の本体からいえば、孟子は「言い難い」と言われたが、言い難いどころではない。言葉も文字も、想像も判断も、すっかり超えているので、誰であっても、ここに一言も差し挟めない。いわゆる、

    「やめよう、やめよう、説くには及ばない。私の教えは妙なるもので、思い計ることは難しい」

    である。このまま大いなる道が現れている、と言うほかはない。


    「これは、これは、と言うばかり。花に包まれた吉野山。」

    「松島よ、ああ松島よ、松島よ。」


    と言うほかはない。それでも道の本体から遠ざかってしまうが、そう言うより仕方がないのだ。一方、その大いなる道の働きは、実に千変万化し、姿を変えて現れることに限りがない。だから、ざっと見積もって推し量ることなど、なかなかできない。


    今日、科学、サイエンスなどと言われているものは、それぞれの部分について、ある程度までの道理を明らかにしていくだけであり、道の働きそのものは、実に限りのないものなのである。


    こんなふうに考えてくると、私たちは、やはりその中に宿っていると言ってもよい。また、自分の側から考えれば、そのものとともに起き、そのものとともに眠り、そのものとともに、いつも活動している、と言ってもよい。老子は、そのような具合に語っている。また、聖書にも、

    「初めに道があった。道は神とともにあり、神は道であり、道は神である」

    とあったように覚えている。


    それを仏教や禅の世界に入って見れば、仏が一生にわたって説かれた教えも、祖師たちの千七百の公案も、結局、道というものの、深く微妙なところを示されたものにほかならない。禅の第三祖、僧璨大師の言葉では、

    「この上ない道は難しくない。ただ、あれこれ選り好みすることを嫌うだけだ。憎しみや愛着がなければ、すっきりと明らかになる。だが、ほんのわずかでもずれがあれば、天と地ほどに隔たってしまう。」'
  notes:
  - 末尾の引用を受ける「とある。」以下は次コマ55へ続く。

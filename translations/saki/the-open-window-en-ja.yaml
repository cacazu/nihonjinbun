        "original_unit_id": "ow-p019"
    "translation_ja": |-
      夫人は陽気にしゃべり続けた。猟のこと、鳥が少ないこと、冬になれば鴨はどうだろうかということ。フラムトンには何もかもが、ただただ恐ろしかった。必死になって、もう少しぞっとしない話題に変えようとしたが、いくらか話がそれた程度だった。こちらの話に、夫人はろくに注意を払っていない。それに、彼を通り越して、開いた窓とその向こうの芝生のほうへと、しきりに目をやっていた。よりによってあの悲しい出来事のあった日に訪ねて来てしまうとは、なんとも運の悪い偶然だった。

  "section_id": "gorin-sui-s038"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    此一書の内を一ケ條〳〵と稽古して敵と戰ひ、次第〳〵と道の利を得て、不斷心に罹、いそぐ心なくして、折々手に觸れては德を覺え、何れの人共打合、其心を知つて、
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "190–192"
  "translation_ja": |-
    この一書を一条ずつ稽古し、相手と向き合ううち、少しずつ道理が分かってくる。たえず心にかけながらも先を急がず、おりおり実際に手にするときに稽古の実りを感じ、いろいろな人と打ち合って、その心を知ってゆく。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-38"
- "id": "gorin-sui-s038-p004"
  "section_id": "gorin-sui-s038"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    千里の敵も一足づゝ運ぶなり。緩々と思ひ、此法を行ふ事武士の役也と心得て、今日は昨日の我に勝ち、あすは下手に勝ち、後は上手に勝と思ひ、此書物の如くにして、少しも脇の道へ心のゆかざる樣に思ふべし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "190–192"
  "translation_ja": |-
    千里の先の敵に向かうにも、歩みは一歩ずつだ。気を長く持ち、この道を行くのが武士の務めと心得る。今日は昨日の自分に勝ち、明日は自分より未熟な者に勝ち、その先で自分より巧みな者に勝つ。そう思ってこの書のとおりに進み、少しも心をわき道にそらさないようにすることだ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-38"
- "id": "gorin-sui-s038-p005"
  "section_id": "gorin-sui-s038"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    縱ひ何程の敵に打勝ても、習ひに背く事に於ては、實の道に有べからず。此利心にうかびては、一身を以て數十人にも勝心の辨へ有べし。然る上は劍術の智力にて、大分一分の兵法をも得道すべし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "190–192"
  "translation_ja": |-
    どれほどの敵に勝とうと、学んだ道に背いているなら、それはまことの道ではない。この理が自分の心に浮かぶようになれば、一人で数十人に勝つという、その心も分かるはずだ。そうなったうえで、剣術で養った知恵の力によって、大勢の兵法にも一人の兵法にも通じることができる。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-38"
- "id": "gorin-sui-s038-p006"
  "section_id": "gorin-sui-s038"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    千日の稽古を鍛とし、萬日の稽古を錬とす。能々吟味有べきもの也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "190–192"
  "translation_ja": |-
    千日の稽古を「鍛」とし、万日の稽古を「錬」とする。その意味をよくよく考えてほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-38"
- "id": "gorin-sui-s038-p007"
  "section_id": "gorin-sui-s038"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    正保二年五月十三日　新免武藏
    寺尾孫之丞殿
    寛文七年二月五日　寺尾夢世勝延　花押
    山本源助殿
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "190–192"
  "translation_ja": |-
    正保二年五月十三日、新免武蔵より寺尾孫之丞殿へ。
    寛文七年二月五日、寺尾夢世勝延（花押）より山本源助殿へ。
  "translation_status": "reviewed"
  "source_alignment":

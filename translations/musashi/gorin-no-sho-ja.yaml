  "section_id": "gorin-sui-s004"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    目の付樣は大きに廣く付る目也。觀見二ツの事、觀の目つよく、見の目よはく、遠き所を近く見、近き所を遠く見る事、兵法の專也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "171–172"
  "translation_ja": |-
    目を向ける範囲は、大きく広く取る。「観」と「見」という二つの見方がある。全体をとらえる「観」の働きを強くし、目の前のものを見る「見」の働きを控えめにする。遠くを近くにあるように、近くを遠くにあるように見ることが、兵法では肝要だ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-4"
- "id": "gorin-sui-s004-p002"
  "section_id": "gorin-sui-s004"
  "kind": "paragraph"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "【編注】この箇所では、具体的な技法の記述を省略しています。"
  "translation_status": "reviewed"
- "id": "gorin-sui-s004-p003"
  "section_id": "gorin-sui-s004"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    此目付ちいさき兵法にも、大きなる兵法にも、同じ事也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "171–172"
  "translation_ja": |-
    このものの見方は、一人の兵法にも、大勢を扱う兵法にも共通する。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-4"
- "id": "gorin-sui-s004-p004"
  "section_id": "gorin-sui-s004"

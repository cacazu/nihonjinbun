  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    太刀の構へを専らにする所、ひが事也。世の中に構のあらん事は敵のなき時の事なるべし。其子細は、昔よりの例、今の世の法などとして法例をたつる事は勝負の道には有べからず。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "225–226"
  "translation_ja": |-
    太刀の構えばかりを大事にするのは間違いである。決まった構えが成り立つのは、目の前に相手がいないときのことだろう。昔からのしきたりや今の世の決まりを持ち出し、それを動かせない規則として立てるようなことは、勝負の道にはありえないからだ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-406"
- "id": "gorin-fu-s006-p002"
  "section_id": "gorin-fu-s006"
  "kind": "paragraph"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "【編注】この箇所では、具体的な技法の記述を省略しています。"
  "translation_status": "reviewed"
- "id": "gorin-fu-s006-p003"
  "section_id": "gorin-fu-s006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    物毎に構と云事はゆるかぬ所を用る心也。或は城をかまゆる、或は陣をかまゆるなどは、人にしかけられてもつよくうごかぬ心、是常の儀也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "225–226"
  "translation_ja": |-
    何ごとにも「構える」とは、揺るがないことを重んじる言葉である。城を構える、陣を構えるというときには、相手が仕掛けてきても、しっかりとして動かない。それが普通の意味だ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-406"
- "id": "gorin-fu-s006-p004"
  "section_id": "gorin-fu-s006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法勝負の道に於ては、何事も先手先手と心懸る事也。かまゆると云心は先手を待心也。能々工夫有べし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "225–226"
  "translation_ja": |-
    勝負の道では、何ごとも自分から先に、と心がける。「構える」という考えは、相手が先に出るのを待つ心である。よく考えてほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-406"
- "id": "gorin-fu-s006-p005"
  "section_id": "gorin-fu-s006"
  "kind": "paragraph"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "【編注】この箇所では、具体的な技法の記述を省略しています。"
  "translation_status": "reviewed"
- "id": "gorin-fu-s006-p006"
  "section_id": "gorin-fu-s006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    然る故に我道に有構無構といひて、構は有りて構は無きと云所也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "225–226"
  "translation_ja": |-
    だから私の道では「有構無構」という。構えはある。だが、決まった構えはない、ということだ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-406"

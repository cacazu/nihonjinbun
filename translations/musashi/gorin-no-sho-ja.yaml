  "source_text": |-
    道具以下にも、かたわけてすく事有べからず。あまりたる事はたらぬと同じ事也。人まねをせずとも、我身に随ひ武道具は手にあふ様に有べし。将卒共に物にすき物を嫌ふ事悪し、工夫肝要也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "162–164"
  "translation_ja": |-
    道具にしても、どれか一つをひいきにしてはいけない。過ぎることは、足りないことと同じだ。人のまねをせず、自分に合う、手になじむ武具を持つべきである。将も兵も、好き嫌いに偏るのはよくない。よく考え、工夫することが大事である。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-108"
- "id": "gorin-chi-s010-heading"
  "section_id": "gorin-chi-s010"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    兵法の拍子の事
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "164–168"
  "translation_ja": "物事の拍子と九つの心得"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-109"
- "id": "gorin-chi-s010-omission"
  "section_id": "gorin-chi-s010"
  "kind": "paragraph"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "【編注】この節では、具体的な技法の記述を一部省略しています。"
  "translation_status": "reviewed"
- "id": "gorin-chi-s010-p001"
  "section_id": "gorin-chi-s010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    物毎に付拍子は有る物なれ共、とりわけ兵法の拍子鍛錬なくては及がたき所也。世の中の拍子あらはれて有事、乱舞の道れい人管絃の拍子など、是皆能あふ所のろくなる拍子也。武芸の道にわたつて、弓を射鉄砲を放馬に乗る事迄も、拍子調子は有り。諸芸諸能に至ても、拍子をそむく事は有るべからず。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "164–168"
  "translation_ja": |-
    何事にも拍子があるが、とりわけ兵法の拍子は、鍛錬なしには身につけにくい。拍子が外に現れてよくわかるのは、舞や謡、楽人の管弦などである。それらは息が合い、調子の整った拍子である。武芸でも弓や鉄砲から乗馬まで、拍子と調子がある。ほかのあらゆる芸や技においても、拍子を外してはならない。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-109"
- "id": "gorin-chi-s010-p002"
  "section_id": "gorin-chi-s010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    又空なる事に於ても拍子は有り。武士の身の上にして奉公に身をしあぐる拍子、しさぐる拍子、筈のあふ筈のちがふ拍子有。或は商の道、分限になる拍子、分限にても其たゆる拍子、道々に付けて拍子の相違有事也。物毎のさかゆる拍子おとろふる拍子、能々分別すべし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "164–168"
  "translation_ja": |-
    目に見えない物事にも拍子がある。武士の身の上では、奉公で立身する拍子も、立場が悪くなる拍子もあり、見込みに合う拍子も外れる拍子もある。商いで財を築く拍子も、財を築いた者が没落する拍子もある。それぞれの道で拍子は異なる。何事にも、栄える拍子と衰える拍子がある。よく見分けてほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-109"
- "id": "gorin-chi-s010-p003"
  "section_id": "gorin-chi-s010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法の拍子に於て様々有事也。先あふ拍子を知つて、ちがふ拍子を辨へ、大小遅速の拍子の中にも、あたる拍子を知り、間の拍子を知り、背く拍子を知る事、兵法の専也。此背く拍子辨へ得ずしては、兵法たしかならざる事也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "164–168"
  "translation_ja": |-
    兵法にもさまざまな拍子がある。まず合う拍子を知って、合わない拍子を見分ける。大きさや速さの異なる拍子の中で、しっくりくる拍子、合間に生まれる拍子、逆らう拍子を知るのが大切である。この逆らう拍子を見分けられないうちは、兵法は身についたとはいえない。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-109"
- "id": "gorin-chi-s010-p004"
  "section_id": "gorin-chi-s010"
  "kind": "paragraph"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "【編注】この箇所では、具体的な技法の記述を省略しています。"
  "translation_status": "reviewed"
- "id": "gorin-chi-s010-p005"
  "section_id": "gorin-chi-s010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    何れの巻にも拍子の事を専書記也。其書付の吟味をして、能々鍛錬すべきもの也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "164–168"
  "translation_ja": |-
    どの巻にも拍子のことをとりわけ書き記した。書いたことを吟味し、よくよく鍛錬すべきである。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-109"
- "id": "gorin-chi-s010-p006"
  "section_id": "gorin-chi-s010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    右一流の兵法の道、朝な〳〵夕な〳〵勤め行ふによつて、自ら広き心になつて、多分一分の兵法として、世に伝ふる所、初て書顕す事、地水火風空是五巻也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "164–168"
  "translation_ja": |-
    この流派の兵法の道に朝な夕な励んだことで、自分の心もおのずと広くなった。大勢にも一人にも通じる兵法として世に伝えることを、初めて書き表したのが、地・水・火・風・空のこの五巻である。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-109"
- "id": "gorin-chi-s010-p007"
  "section_id": "gorin-chi-s010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    我兵法を学ばんと思ふ人は、道を行ふ法有り。第一によこしまになき事を思ふ所。第二に道の鍛錬する所。第三に諸芸にさわる所。第四に諸職の道を知る事。第五に物毎の損徳を辨ゆる事。第六に諸事目利を仕覚る事。第七に目に見えぬ所をさとつて知る事。第八にわづかなる事にも気を付る事。第九に役に立ぬ事をせざる事。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "164–168"
  "translation_ja": |-
    私の兵法を学ぼうとする人には、道を歩むための心得がある。第一、よこしまな考えを持たない。第二、自分の道を鍛える。第三、さまざまな芸に触れる。第四、さまざまな職の道を知る。第五、物事の損得を見分ける。第六、あらゆることの良し悪しを見抜く目を養う。第七、目には見えないところを察して知る。第八、ごく小さなことにも気を配る。第九、役に立たないことはしない。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-109"
- "id": "gorin-chi-s010-p008"
  "section_id": "gorin-chi-s010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    大形如此理を心に懸て、兵法の道鍛錬すべき也。此道に限て、直なる所を広く見立ざれば、兵法の達者とは成がたし。此法を学び得ては、一身にして二十三十の敵にも負べき道にあらず。先気に兵法をたへさず、直なる道を勤ては、手にて打勝、目に見る事も人に勝ち、又鍛錬を以て総体自由なれば、身よりも人に勝ち、又此道になれたるなれば、心を以ても人に勝ち、此所に至ては、いかにとして人にまくる道有んや。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "164–168"
  "translation_ja": |-
    おおむねこのような道理を心にかけて、兵法の道を鍛えるべきである。この道では、まっすぐな筋を広く見通さなければ、兵法の達人にはなりにくい。この法を身につければ、一人で二十人、三十人を相手にしても負ける道ではないという。兵法を絶えず心に置き、まっすぐな道に励めば、技でも、ものを見る目でも、人にまさる。鍛錬によって全身が自在になれば身の働きでまさり、この道に親しめば心でもまさる。そこまで至って、どうして人に負けることがあろうか。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-109"
- "id": "gorin-chi-s010-p009"
  "section_id": "gorin-chi-s010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    又大きなる兵法にしては、善人をもつ事に勝、人数を遣ふ事に勝、身を正しく行ふ道に勝、国を治る事に勝、民をやしなふ事に勝、世の例法をおこなふに勝。何れの道に於ても、人に負ざる所を知りて、身をたすけ名をたすくる所、是兵法の道也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "164–168"
  "translation_ja": |-
    広い意味での兵法では、よい人を得ること、人を使うこと、身を正しく保つこと、国を治めること、民の暮らしを支えること、世の決まりを行うことに秀でる。どの道でも、人に劣らないところを知り、身を支え、名を保つ。それが兵法の道である。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-109"
- "id": "gorin-chi-s010-p010"
  "section_id": "gorin-chi-s010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    正保二歳五月十二日　新免武蔵　寺尾孫之丞殿。寛文七年二月五日　寺尾夢世勝延［花押］　山本源介殿。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "164–168"
  "translation_ja": |-
    正保二年（1645年）五月十二日、新免武蔵から寺尾孫之丞殿へ。寛文七年（1667年）二月五日、寺尾夢世勝延（花押）から山本源介殿へ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-109"
- "id": "gorin-sui-heading"
  "section_id": "gorin-sui"
  "kind": "heading"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "水の巻"
  "translation_status": "reviewed"
- "id": "gorin-sui-s001-heading"
  "section_id": "gorin-sui-s001"
  "kind": "heading"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "水を手本とする"
  "translation_status": "reviewed"
- "id": "gorin-sui-s001-p001"
  "section_id": "gorin-sui-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法二天一流の心、水を本として利方の法を行ふによつて、水の卷として一流の太刀筋、此書に書顯すもの也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "168–169"
  "translation_ja": |-
    二天一流の兵法は、水を手本とし、物事の理にかなった仕方でそれを行う。そこで、この流派の太刀の道筋を記すのを「水の巻」とする。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-1"
- "id": "gorin-sui-s001-p002"
  "section_id": "gorin-sui-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    此道いづれもこまやかに心の儘には書分がたし。縱ことばつゞかざると云ふ共、利は自ら聞ゆべし。此書に書付たる所へ、こと〴〵一字々々にて思案すべし。大形に思ひては、道のちがふ事多かるべし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "168–169"
  "translation_ja": |-
    この道のどれ一つをとっても、私の心にあるとおり、細かいところまで書き分けるのは難しい。たとえ言葉がうまくつながらなくても、言おうとする道理はおのずと伝わるだろう。本書に記したことは、どれも一字ずつ考えてほしい。おおよそで済ませれば、取り違えるところが多くなる。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-1"
- "id": "gorin-sui-s001-p003"
  "section_id": "gorin-sui-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法の利に於て一人と、一人との勝負の樣に書付たる所なり共、萬人と萬人との合戰の利に心得、大きに見立所肝要也。此道に限つて少なり共、道を見違へ、道の迷ひ有りては、惡道へ落るもの也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "168–169"
  "translation_ja": |-
    兵法の理を一人と一人の勝負として書いた箇所も、万人と万人が戦うときの理として受け取り、大きく見てほしい。ことにこの道では、少しでも道を見誤って迷えば、悪い道に落ちてしまう。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-1"
- "id": "gorin-sui-s001-p004"
  "section_id": "gorin-sui-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    此書付計を見て兵法の道には及事に非ず。此書に書付たるを我身にとつて、書付を見ると思はず、ならふと思はず、にせものにせずして、則ち我心より見出したる利にして、常に其身になつて能々工夫すべし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "168–169"
  "translation_ja": |-
    書き付けを眺めるだけでは、兵法の道には届かない。ここに書いたことを、自分自身に引きつけてほしい。文章を読んでいるつもりでも、人に習っているつもりでもいけない。うわべのまねにせず、自分の心から見いだした道理とし、いつも自分がその場に身を置いて、よく工夫することだ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-1"
- "id": "gorin-sui-s002-heading"
  "section_id": "gorin-sui-s002"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    兵法心持の事
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "169–170"
  "translation_ja": "常の心"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-2"
- "id": "gorin-sui-s002-p001"
  "section_id": "gorin-sui-s002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法の道に於て、心の持樣は常の心に替る事なかれ。常にも兵法の時にも少も替らずして、心を廣く直にして、きつくひつぱらず、少もたるまず、心のかたよらぬ樣に心をまん中におきて、心を靜にゆるがせて、其ゆるぎのせつなも、ゆるぎやまぬ樣に、能々吟味すべし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "169–170"
  "translation_ja": |-
    兵法を行うときも、心の持ち方をふだんと変えてはいけない。平時にも兵法のときにも、心は広く、素直に。張りつめさせず、少しもたるませず、どちらかへ偏らないよう真ん中に置く。心を静かに揺り動かし、その動きが一瞬も途切れないとはどういうことか、よく確かめることだ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-2"
- "id": "gorin-sui-s002-p002"
  "section_id": "gorin-sui-s002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    靜なる時も心は靜ならず、何とはやき時も心は少もはやからず、心は體につれず、體は心につれず、心に用心して身は用心せず、心のたらぬ事なくして、心を少もあやまらさず、すへの心はよわく共、そこの心をつよく、心を人に見分られざる樣にして、小身なるものは心に大きなる事を殘らず知り、大身なるものは心に小さき事を能知りて、大身も小身も心を直にして、我身のひいきをせざる樣に、心を持事肝要也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "169–170"
  "translation_ja": |-
    周囲が静かなときも、心まで動きを失ってはならない。どれほど事が急でも、心までせき立てられてはならない。心は体に引きずられず、体も心に振り回されない。心では用心しても、身はこわばらせない。注意に欠けたところや判断の過ちがないようにする。表に出る心は柔らかくても、心の底は強く、人にその内を見透かされないようにする。小柄な者は大きなもののありようを余さず知り、大柄な者は小さなもののありようをよく知る。どちらも心をまっすぐにして、自分だけをひいきしないことが肝心だ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-2"
- "id": "gorin-sui-s002-p003"
  "section_id": "gorin-sui-s002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    心の内にこらす廣くして、廣き所へ智慧を置べき也。智慧も心もひたとみがく事專也。智慧をとぎ、天下の利非を辨へ、物毎の善惡を知り、萬の藝能、其道〳〵をわたり、世間の人に少しもだまされざる樣にして後、兵法の智慧となる心也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "169–170"
  "translation_ja": |-
    心の内を濁らせず、広くして、その広いところに知恵を置く。知恵も心もひたすら磨くことだ。知恵を研ぎ澄ませ、世の中の是非を見分け、それぞれの物事の善悪を知る。さまざまな芸や技の道に足を運び、世の人にだまされなくなって、はじめてそれが兵法の知恵になる。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-2"
- "id": "gorin-sui-s002-p004"
  "section_id": "gorin-sui-s002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法の智慧に於て、とりわきちがふ事有もの也。戰の場、萬事せはき時なれ共、兵法の道理をきはめ、うごきなき心、能々吟味すべし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "169–170"
  "translation_ja": |-
    ただし、兵法の知恵には、ほかの知恵と際立って違うところがある。戦場で何もかもがせわしいときにあっても、兵法の道理をきわめ、揺るがない。その心をよくよく確かめなさい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-2"

- "id": "gorin-ka-s024-p001"
  "section_id": "gorin-ka-s024"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    新たになるとは敵我戦ふ時もつるる心になつてはかゆかざる時我気を振捨て物毎をあたらしくはじむる心に思ひて其拍子を受て勝を弁ふる所なり
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "214"
  "translation_ja": |-
    「新たになる」とは、敵と自分との争いがもつれ、先へ進まなくなったとき、それまでの気分を振り捨てて、何もかも初めから始めるつもりになることだ。その新しい調子をつかんで、勝ちに至る道を見分ける。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-24"
- "id": "gorin-ka-s024-p002"
  "section_id": "gorin-ka-s024"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    新になる事は何時も敵と我きしむ心になると思はば其儘心を替て各別の利を以て勝べき也大分の兵法に於ても新たになると云所弁ふる事肝要也兵法の智力にては忽ち見ゆる所也能々吟味有べし
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "214"
  "translation_ja": |-
    相手と自分との気持ちがきしみ合うと感じたら、その場で心を改め、まったく別の道理によって勝つ。これが「新たになる」ということだ。大軍の兵法でも、この意味を知ることが肝心である。兵法の知恵があれば、たちどころに見えてくる。よく吟味してほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-24"

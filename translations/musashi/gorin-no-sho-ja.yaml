  "source_text": |-
    兵法二ツの字の利を知事
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "161–162"
  "translation_ja": "「兵法」という言葉の意味"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-107"
- "id": "gorin-chi-s008-p001"
  "section_id": "gorin-chi-s008"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    此道に於て、太刀を振得たる者を兵法者と世に言伝へたり。武芸の道に至て、弓を能く射れば射手と云、鉄砲を得たる者は鉄砲打と云、鎗を遣ひ得ては鎗遣と云ひ、長刀を覚えては長刀遣と云ふ。然るに於ては、太刀の道を覚えたる者を太刀遣脇差遣といはん事也。弓鉄砲鎗長刀、皆是武家の道具なれば、いづれも兵法の道也。然共太刀よりして兵法と云事道理也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "161–162"
  "translation_ja": |-
    世の中では、太刀の扱いに熟達した者を兵法者と呼び伝えてきた。武芸には、弓に巧みな者を射手、鉄砲をよくする者を鉄砲打ち、槍を使いこなす者を槍遣い、長刀を身につけた者を長刀遣いと呼ぶ習いがある。この例にならえば、太刀の道を身につけた者は太刀遣い、脇差遣いと呼びそうなものだ。弓も鉄砲も槍も長刀も、すべて武家の道具であって、いずれも兵法の道に含まれる。それでも太刀の道を特に兵法と呼ぶのには、理由がある。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-107"
- "id": "gorin-chi-s008-p002"
  "section_id": "gorin-chi-s008"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    太刀の徳よりして世を納め身を納る事なれば、太刀は道法のおわる所也。太刀の徳を得ては、一人して十人に勝事也。一人にして十人に勝なれば、百人して千人に勝、千人にして万人に勝。然るによつて我一流の兵法に、一人も万人も同じ事にして、武士の法を残らず兵法と云所也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "161–162"
  "translation_ja": |-
    太刀の徳によって世を治め、自分自身を治めるのだから、太刀はこの道の行き着くところである。太刀の徳を体得すれば、一人で十人に勝つ。一人が十人に勝つという道理なら、百人が千人に、千人が万人に勝つことになる。だから、わが流派では一人にも万人にも共通するものとして、武士の道を残らず兵法と呼ぶのである。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-107"
- "id": "gorin-chi-s008-p003"
  "section_id": "gorin-chi-s008"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    道に於て儒者仏者数寄者しつけ者乱舞者、此等の事は武士の道にはなし。其道に有らざると云ふ共、道を広く知れば物事に出あふ事なり。何れも人間に於て我道〳〵を能みがく事肝要也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "161–162"
  "translation_ja": |-
    儒学を修める者、仏の道を歩む者、茶の湯をたしなむ者、礼法の心得がある者、舞や謡をする者。こうした道は武士の道そのものではない。自分の道でなくても、広くものの道を知れば、いろいろなことに応じられる。どんな人にも、まずそれぞれの道をよく磨くことが大事である。
  "translation_status": "reviewed"
  "source_alignment":

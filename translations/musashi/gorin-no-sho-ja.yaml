  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    世の中人の物をしならふ事、へいぜいもうけつ、かはしつ、ぬけつ、くゞりつしならへば、心道にひかされて、人にまはさるゝ心有。
  "source_languages":
  - "ja"
  "source_locations":

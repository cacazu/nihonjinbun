  "section_id": "gorin-ka-s026"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    将卒を知るとはいづれも戦に及ぶ時わが思ふ道に至てはたえず此法を行ひ兵法の智力を得て我敵たるものをば皆我卒なりと思ひとつてなしたき様になすべしと心得敵を自由にまはさんと思ふ所我は将也敵は卒也工夫有べし
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "215"
  "translation_ja": |-
    「将卒を知る」とは、どんな戦いでも、自分が求める道に達したなら、絶えずその法を行うことだ。兵法の知恵と力を得て、敵である者たちを「皆、自分の兵なのだ」ととらえる。思うように動かせると心得、敵を自在に動かそうと思う。そのとき自分が将で、敵は兵卒である。工夫してほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-26"

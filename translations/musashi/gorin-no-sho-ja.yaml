  "translation_ja": "風の巻の結びと奥書"
  "translation_status": "reviewed"
- "id": "gorin-fu-s011-p001"
  "section_id": "gorin-fu-s011"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    右他流の兵法を九ケ条として、風の巻に有増書付る所、一々流々口より奥に至るまで、さだかに書顕すべき事なれ共、わざと何流の何の大事共名を書しるさず。其故は一流一流の見たて、其道々々のいひわけ、人により心に任せて、それぞれの存分有ものなれば、同じ流にも少々の替るものなれば、後々までの為にながれ筋共書のせず。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "233–234"
  "translation_ja": |-
    以上、他流の兵法を九か条に分け、「風の巻」にあらましを書いた。本来なら、流派ごとに入り口から奥に至るまでを明らかにすべきところだが、何流の何という大事な教え、といった名はわざと書かなかった。流派ごとにものの見方があり、それぞれの道にそれぞれの言い分がある。人にもおのおの考えがあり、同じ流派の中にも少しずつ違いがある。だから後々のことを思って、どの流派の系統かも書き載せなかった。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-411"
- "id": "gorin-fu-s011-p002"
  "section_id": "gorin-fu-s011"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    他流の大体九ツに云分て、世の中の道、人の直なる道理より見せば、長さにかたつき、短きを理にし、強き弱きもかたつき、あらきこまかなると云事も、皆へんなる道なれば、他流の口奥と顕はさず共、皆人の知るべき儀也。我一流に於て、太刀に奥口なし、構に極りなし。唯心を以て其徳を辨ふる事、是兵法の肝心也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "233–234"
  "translation_ja": |-
    他流の大筋を九つに分け、世の常の道、人としてまっすぐな道理に照らしてみた。長さにこだわること、短さにばかり理を求めること、強弱のどちらかに偏ること、荒さや細かさを重んじすぎること。どれも一方に偏った道である。どの流派の入り口や奥の教えか、と名指ししなくても、だれにでもわかるはずだ。私の流派では、太刀に奥も入り口もなく、構えにも決まりはない。ただ自分の心でその働きを見きわめる。それが兵法の肝心なところである。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-411"
- "id": "gorin-fu-s011-p003"
  "section_id": "gorin-fu-s011"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    正保二年五月十二日　新免武蔵
    寺尾孫之丞殿
    寛文七年二月五日　寺尾夢世勝延　花押
    山本源介殿
  "source_languages":

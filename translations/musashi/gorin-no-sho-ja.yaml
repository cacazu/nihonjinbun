  "kind": "heading"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "結びと奥書"
  "translation_status": "reviewed"
- "id": "gorin-ka-s029-p001"
  "section_id": "gorin-ka-s029"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    右書付る所一流剣術の場にしてたえず思ひよる事のみ云顕し置もの也今初て此利を書記物なればあとさきと書まぎるる心有てこまやかに云わけがたし乍㆑去此道を学ぶべき人の為には心しるしに成るべきもの也
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "216–217"
  "translation_ja": |-
    ここに書きつけたのは、私の流儀で剣術に当たるとき、絶えず心に浮かぶことだけである。この理を書き記すのは初めてなので、書く順序が前後して、細かなところまで説き分けにくい。それでも、この道を学ぼうとする人にとって、心の目じるしにはなるはずだ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-29"
- "id": "gorin-ka-s029-p002"
  "section_id": "gorin-ka-s029"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    我若年より以来兵法の道に心をかけて剣術一通りの事にも手をからし身をからし色々様々の心に成り他の流々をも尋見るに或は口にていひかこつけ或は手にてこまかなるわざをし人目によき様に見すると云ても一ツも実の心に有べからず勿論かやうの事しならひても身をきかせならひ心をきかせつくる事と思へ共皆是道のやまひとなりて後々までもうせがたくして兵法の直道世にくちて道のすたる基也
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "216–217"
  "translation_ja": |-
    私は若いころから兵法の道に心をかけ、剣術の一つ一つに手を使い尽くし、身を使い尽くし、さまざまな心のありようを経験してきた。他の流派をたずねてみると、言葉でもっともらしく言い立てたり、手先で細かな技を演じたりして、人目によく映るように見せる。しかし、そこには少しもまことの心はない。そのようなことを習えば、体の働きを利かせ、心の働きを鋭くできると思うだろう。だが、どれもこの道の病となり、あとあとまで抜けがたい。正しい兵法が世に朽ち、道がすたれるもとはここにある。
  "translation_status": "reviewed"
  "source_alignment":

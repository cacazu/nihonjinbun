  "section_id": "gorin-fu-s005"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    太刀の数余多にして人に伝ふる事、道をうり物にしたてて、太刀数多くしりたるを初心のものに深く思はせん為成べし。兵法に嫌ふ心也。其故は、人をきる事色々あると思ふ所まよふ心也。世の中に於て人をきる事替る道なし。知る者も知らざる者も女童子も、打たゝききると云道は多くなき所也。若かはりては、つくぞなくぞと云外はなし。先きる所の道なれば、数の多かるべき子細にあらず。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "223–225"
  "translation_ja": |-
    太刀の型の数を増やして伝えるのは、道を売り物に仕立て、多くの型を知っているのを見て初心者に奥が深いと思わせるためだろう。兵法ではこういう心を嫌う。人を斬るのにいろいろな別の道があると思うこと自体が迷いなのだ。世の中に、人を斬るということに変わった道はない。知っている者にも知らない者にも、女や子どもにも、打つ、たたく、斬るということにそう多くの違いはない。別の名を挙げても、突く、薙ぐというくらいだ。もともと斬ることをいうのだから、いくつも数え立てるわけはない。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-405"

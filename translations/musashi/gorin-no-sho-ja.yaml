  "section_id": "gorin-sui-s004"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    箇樣の事いそがしき時、俄には辨へがたし。此書付を覺え、常住此目付になりて、何事にも目付の替らざる所、能々吟味有べきもの也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "171–172"
  "translation_ja": |-
    こうしたことは、忙しくなってから急に身につくものではない。ここに書いたことを覚え、いつもこの目で見るようにして、何が起きても見方が変わらないところを、よく確かめてほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-4"

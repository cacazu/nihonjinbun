  "section_id": "gorin-chi-s007"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    箇様之義今委しく書顕すに及ばず。一を以て万を知るべし。兵法の道行ひ得ては、一ツも見えずと云事なし。能々吟味有べき也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "159–161"
  "translation_ja": |-
    これらについて、ここで詳しく書くまでもない。一つから万を知るべきである。兵法の道を行い、身につければ、まったく見通せないということはない。よくよく考えてほしい。
  "translation_status": "reviewed"
  "source_alignment":

  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "170–171"
  "translation_ja": "身のありよう"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-3"
- "id": "gorin-sui-s003-omission"
  "section_id": "gorin-sui-s003"
  "kind": "paragraph"
  "origin": "translator"
  "source_text": null

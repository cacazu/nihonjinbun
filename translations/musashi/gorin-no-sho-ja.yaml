- "id": "gorin-fu-s009-p004"
  "section_id": "gorin-fu-s009"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    能々分別すべし。大分の兵法にしても、はやくいそぐ心悪し。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "229–231"
  "translation_ja": |-
    よく考えてほしい。大勢の兵法でも、ひたすら先を急ぐ心はよくない。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-409"
- "id": "gorin-fu-s009-p005"
  "section_id": "gorin-fu-s009"
  "kind": "paragraph"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "【編注】この箇所では、具体的な技法の記述を省略しています。"

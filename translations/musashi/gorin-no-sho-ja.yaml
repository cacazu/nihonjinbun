  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    我兵法に於て、足に替る事なし。常の道をあゆむが如し。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "228–229"
  "translation_ja": |-
    私の兵法では足どりをことさらに変えることはない。いつもの道を歩くのと同じである。
  "translation_status": "reviewed"
  "source_alignment":

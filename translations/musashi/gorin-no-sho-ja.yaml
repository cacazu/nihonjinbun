  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    長き太刀好む身にしては其云わけは有ものなれ共、夫は其身ひとりの理也。世の中の実の道より見る時は、道理なき事也。長き太刀もたずして短き太刀にては必まくべき事歟。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "219–220"
  "translation_ja": |-
    長い太刀を好む当人には、それなりの言い分はあろう。だが、それはその人ひとりにとっての理である。広く世の実際に照らせば、道理はない。長い太刀を持たず、短い太刀なら必ず負けるとでもいうのか。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-402"
- "id": "gorin-fu-s002-p004"
  "section_id": "gorin-fu-s002"

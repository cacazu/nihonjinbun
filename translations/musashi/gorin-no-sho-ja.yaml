- "id": "gorin-fu-s002-p005"
  "section_id": "gorin-fu-s002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    人により小刀なるものも有、其身により長かたなさす事ならざる身も有。昔より大は小をかふへると云へば、むさと長きをきらふには非ず。長きとかたよる心を嫌ふ儀也。大分の兵法にして長太刀は大人数也。短きは小人数也。小人数と大人数にて合戦はなるまじきものか。小人数にて大人数に勝たる例多し。我一流に於て左やうにかたつくせまき心嫌ふ事也。能々吟味有べし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "219–220"
  "translation_ja": |-
    人によっては小刀を帯びる者もいれば、長い刀を差すことのできない者もいる。昔から「大は小を兼ねる」というのだから、むやみに長いものを嫌っているわけではない。私が嫌うのは、長いほうにばかり心が傾くことだ。大勢の兵法にたとえるなら、長い太刀は大軍、短い太刀は小勢である。小勢では大軍と戦にならないとでもいうのか。小勢が大軍に勝った例はいくらもある。私の流派が嫌うのは、一方に偏る、そうした狭い心である。よく吟味してほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-402"

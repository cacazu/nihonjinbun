  "section_id": "gorin-ka-s027"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    束をはなすと云に色々心有事也無刀にて勝心有又太刀にてかたざる心有さまざま心のゆく所書付るに非ず能々鍛錬すべし
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "216"
  "translation_ja": |-
    「つかを放す」には、いろいろな意味がある。刀を持たずに勝つという心もあれば、刀で勝つのではないという心もある。そこから思いがさまざまに行き着く先は、書き尽くせるものではない。よく鍛錬してほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-27"

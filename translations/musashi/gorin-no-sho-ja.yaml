  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    足のふみ様に浮足、飛足、はぬる足、ふみつむる足、からす足などゝ云て、色々さつそくをふむ事有。是皆我兵法より見ては不足に思ふ所也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "228–229"
  "translation_ja": |-
    足どりにも「浮き足」「飛び足」「はねる足」「踏みつめる足」「からす足」などと名前をつけて、さまざまな足拍子を踏む流派がある。私の兵法から見ると、こうしたものにはどれも足りないところがある。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-408"

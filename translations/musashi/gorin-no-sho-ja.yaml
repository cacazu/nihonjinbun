    三ツの先一ツは我方より敵へかかるせんけんの先と云ふ也又一ツは敵より我方へかかる時の先是はたいの先と云也又一ツは我もかかり敵もかかりあふ時の先体々の先と云是三ツの先也
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "195–197"
  "translation_ja": |-
    「先」には三つある。こちらから相手に向かうときの先を「けんの先」という。相手がこちらに向かってくるときの先を「たいの先」という。こちらと相手がともに動くときの先を「体々の先」という。これが三つの先である。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-3"
- "id": "gorin-ka-s003-p002"
  "section_id": "gorin-ka-s003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    何れの戦ひ始にも此三ツの先より外はなし先の次第を以て勝事を得るものなれば先と云事兵法の第一也此先の子細様々は有りと云へ共其時の利を先とし敵の心を見我兵法の智恵を以て勝事なればこまやかに書分る事に非ず
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "195–197"
  "translation_ja": |-
    どんな戦いの始まりも、この三つのほかにはない。先のありようで勝ちが決まるから、兵法ではこれを第一とする。細かく言えばいろいろな場合がある。だが、その場の道理を第一にし、相手の心を見て、自分の兵法の知恵をもって勝つのだから、細部まで書き分けることはできない。
  "translation_status": "reviewed"
  "source_alignment":

- "id": "gorin-fu-s009-p006"
  "section_id": "gorin-fu-s009"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    人のむさとはやき事などにはそむくと云て、静になり、人につかざる所肝要也。此心の工夫鍛錬有べき事也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "229–231"
  "translation_ja": |-
    人がむやみに急ぐときには「そむく」といって、自分は静かになり、人につられないことが肝心である。この心をよく工夫し、鍛錬してほしい。
  "translation_status": "reviewed"
  "source_alignment":

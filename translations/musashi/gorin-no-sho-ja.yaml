    "precision": "page"
    "printed_page": "199–200"
  "translation_ja": |-
    船旅なら、渡りどころを知り、自分の船の力を知り、日々の天候を見きわめる。他の船が出なくても、今がよいと見れば、ある時は斜めからの風を利用し、ある時は追い風に乗る。たとえ風が変わっても、残り二里、三里なら櫓や舵を使って港に着けると心得て、船を操り、渡りきる。その心をつかみ、人として世を渡るときにも、一大事に臨んだら「ここを渡ろう」と決める心がなくてはならない。
  "translation_status": "reviewed"

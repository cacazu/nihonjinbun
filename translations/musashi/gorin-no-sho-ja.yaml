  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    大分の兵法にしてもつよき人数を持、合戦に於てつよくかたんと思へば、敵もつよき人を持、戦もつよくせんと思ふ。それはいづれも同じ事也。物毎に勝と云事、道理なくしては勝事あたはず。我道に於ては少も無理なる事を思はず、兵法の智力を以て如何様にも勝所を得る心也。能々工夫有べし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "220–222"
  "translation_ja": |-
    大勢の兵法でも、こちらが強い兵をそろえ、力強く勝とうと思えば、相手もまた強い兵をそろえて力を尽くそうと思う。その点はどちらも同じだ。何にせよ、勝つのに道理がなくては勝てない。私の道では理に合わないことを少しもあてにせず、兵法によって養った知恵で、どんな場合にも勝つところを見いだそうとする。よく工夫してほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-403"

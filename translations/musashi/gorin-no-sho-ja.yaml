    兵法他流の道を知る事
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "218–219"
  "translation_ja": "他流の道を知る"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-401"
- "id": "gorin-fu-s001-p001"
  "section_id": "gorin-fu-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    他の兵法の流々を書付、風の巻として此巻に顕す所也。他流の道を知らずしては我一の道慥に辨へがたく、他の兵法を尋見るに、大きなる太刀をとつて強き事を専らにして其わざをなすながれと有。或は小太刀と云ひて短き太刀を以て道を勤るながれと有。或は太刀かず多くたゝみ、太刀の構を以ておもてと云ひ、奥として道をつたふる流も有。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "218–219"
  "translation_ja": |-
    他の兵法の流派について書き記し、「風の巻」としてここに示す。他流の道を知らなければ、自分の流派の道も確かにはわからない。他の兵法を見てみると、大きな太刀を取り、強さを何より大事にする流派もある。小太刀といって短い太刀で修業する流派もある。多くの型を組み、太刀の構えに「表」と「奥」の別を設けて教えを伝える流派もある。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-401"
- "id": "gorin-fu-s001-p002"
  "section_id": "gorin-fu-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    是皆実の道に非る事、此巻の奥に慥に書顕し、善悪理非を知らする也。我一流の道理、各別の儀也。他の流、芸にわたつて身すぎの為にして、色をかざり花をさかせ、うりものにこしらへたるによつて、実の道に非る事歟。亦世の中の兵法、剣術斗にちひさく見たてて、太刀をふり習ひ、身をきかせて手のかるる所を以て、勝事を辨へたるものか。何れも慥なる道に非ず。他流の不足成所、一々此書に書顕す也。能々吟味して二刀一流の利を辨ふべきもの也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "218–219"
  "translation_ja": |-
    これらがどれも真の道ではないわけを、この巻の先で明らかにし、何がよくて何が悪く、どこに理があり、どこにないかを示そう。私の流派がよりどころとする理は、それとは別である。他流が真の道から外れるのは、芸を暮らしの糧にしようとして、色を飾り、花を咲かせ、売り物に仕立てるからではないか。また世間では兵法を狭く剣術だけのことと考える。太刀の素振りを習って体がよく動き、手が軽く働くようになっただけで、勝つとはどういうことかがわかったといえるだろうか。どちらも確かな道ではない。他流に欠けている点を、この書で一つずつ明らかにする。よく吟味して、二刀一流の理を見きわめてほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-401"
- "id": "gorin-fu-s002-heading"
  "section_id": "gorin-fu-s002"
  "kind": "heading"
  "origin": "source"

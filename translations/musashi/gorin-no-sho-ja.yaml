  "source_text": |-
    打あいの利の事
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "190"
  "translation_ja": "打ち合いの理"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-35"
- "id": "gorin-sui-s035-p001"
  "section_id": "gorin-sui-s035"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    此の打あいの利と云事にて、兵法太刀にての勝利を辨ふる所也。こまかに書しるすに非ず。能稽古有りて、勝所を知るべきもの也。大形兵法の實の道をあらはす太刀也。口傳。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "190"
  "translation_ja": |-
    ここで「打ち合いの理」というのは、太刀を用いる兵法で勝ちを得る道理をわきまえることだ。これは細かく書き記すことではない。よく稽古をして、何が勝ちをもたらすのかを知るべきである。およそ兵法のまことの道を表した太刀である。口伝。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-35"
- "id": "gorin-sui-s036-heading"
  "section_id": "gorin-sui-s036"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    一ツの打と云事
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "190"
  "translation_ja": "「一つの打」という考え"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-36"
- "id": "gorin-sui-s036-p001"
  "section_id": "gorin-sui-s036"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    此一ツの打と云心をもつて、慥に勝所を得る事也。兵法能學ばざれば、心得がたし。此儀能鍛煉すれば、兵法心の儘になつて、思ふ儘に勝道也。能々稽古すべし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "190"
  "translation_ja": |-
    この「一つの打」という考えによって、勝ちを確かなものにする。兵法をよく学ばなければ、ここは理解しにくい。このことを十分に練れば、兵法が意のままになり、思うとおりに勝つ道が開ける。よくよく稽古してほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-36"
- "id": "gorin-sui-s037-heading"
  "section_id": "gorin-sui-s037"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    直通の位と云事
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "190"
  "translation_ja": "直通の境地"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-37"
- "id": "gorin-sui-s037-p001"
  "section_id": "gorin-sui-s037"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    直通の心、二刀一流の實の道をうけて傳ふる所也。能々鍛錬して、此兵法に身を爲す事肝要なり。口傳。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "190"
  "translation_ja": |-
    「直通」の心とは、二刀一流のまことの道を受け取り、そのまま伝えてゆくことである。よく鍛錬し、自分自身がこの兵法を体現するところまで至るのが肝心だ。口伝。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-37"

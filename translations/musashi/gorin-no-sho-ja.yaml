  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    岩尾の身と云事兵法を得道して忽ち岩尾の如くに成て万事あたらざる所うごかざる所口伝
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "216"
  "translation_ja": |-
    「巌の身」とは、兵法の道を会得して、たちまち大岩のようになることだ。何もこれに当たることができず、何ものにも動かされない境地である。ここは口伝とする。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-28"

- "id": "gorin-ku-s001-p001"
  "section_id": "gorin-ku-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    二刀一流の兵法の道、空の巻として書顕はす事。空と云心は、物毎のなき所、しれざる事を空と見たつる也。勿論空はなき也。有所を知りて無所を知る、是則空也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "234–236"
  "translation_ja": |-
    二刀一流の兵法の道を、ここでは「空の巻」として書き記す。空という言葉は、ものがないところ、知ることのできないことを指す。空は、いうまでもなく「ない」ことである。何があるかを知り、そこから何がないかを知る。それが空である。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ku-501"
- "id": "gorin-ku-s001-p002"
  "section_id": "gorin-ku-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    世の中に於てあしく見れば、物を辨へざる所を空と見る所、実の空には非ず、皆迷ふ心也。此兵法の道に於ても、武士として道を行ふに、士の法を知らざる所、空には非ずして、色々迷有りて、せんかたなき所を空と云なれ共、是実の空にはあらざる也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "234–236"
  "translation_ja": |-
    世の中では、見方を誤って、物事をわきまえられないことを空と見なすことがある。それは本当の空ではなく、どれも心の迷いである。兵法でも、武士として道を歩むのに、武士の心得を知らないのは空ではない。あれこれ迷って、どうしてよいかわからなくなった状態を空という人もいるが、それは本当の空ではない。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ku-501"
- "id": "gorin-ku-s001-p003"
  "section_id": "gorin-ku-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    武士は兵法の道を慥に覚え、其外武芸を能つとめ、武士の行ふ道少しもくらからず、心の迷ふ所なく、朝々時々におこたらず、心意二ツの心をみがき、観見二ツの眼をとき、少もくもりなく、迷ひの雲の晴たる所こそ、実の空と知るべき也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "234–236"
  "translation_ja": |-
    武士は兵法の道を確かに身につけ、ほかの武芸にもよく励む。自分が歩む道に暗いところを残さず、心を迷わせず、朝ごと、時ごとに怠らず、心と意という二つの働きを磨き、観る眼と見る眼の二つを研ぎ澄ます。わずかな曇りもなく、迷いの雲が晴れたところこそ、本当の空である。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ku-501"
- "id": "gorin-ku-s001-p004"
  "section_id": "gorin-ku-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    実の道を知らざる間は、仏法によらず、世法によらず、おのれおのれは慥なる道と思ひよき事と思へ共、心の直道よりして、世の大かねにあはせて見る時は、其身々々の心のひいき、其目々々のひずみによつて、実の道にはそむくもの也。其心をしつて直なる所を本とし、実の心を道として、兵法を広く行ひ、正しく明らかに大きなる所を思ひとつて、空を道とし道を空と見るべき也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "234–236"
  "translation_ja": |-
    本当の道を知らないうちは、仏の教えであれ、世の決まりごとであれ、自分の道は確かで、していることは正しいと思う。けれども、心をまっすぐにして、世の中の広い尺度に照らしてみると、人それぞれのひいきや、ものを見る目のゆがみのために、本当の道には背いているものである。そのことを自覚し、まっすぐなものを土台に、偽りのない心を道として、兵法を広く実践する。正しく、明らかに、大きなところをとらえ、空を道とし、道を空と見るべきである。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ku-501"
- "id": "gorin-ku-s001-p005"
  "section_id": "gorin-ku-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    空有善無悪。智は有也、利は有也、道は有也、心は空也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "234–236"
  "translation_ja": |-
    空には善があって、悪はない。知恵はある。道理の働きはある。道はある。心は空である。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ku-501"

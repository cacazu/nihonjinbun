- "id": "gorin-ka-s025-p001"
  "section_id": "gorin-ka-s025"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    鼠頭午首と云ふは敵と戦のうちに互にこまかなる所を思ひ合てもつるる心になる時兵法の道を常に鼠頭午首鼠頭午首と思ひていかにもこまかなる内に俄に大きなる心にして大小にかはる事兵法一ツの心だて也
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "215"
  "translation_ja": |-
    「鼠頭午首」とは、敵と戦ううちに双方が細かなところにとらわれて、もつれてきたときの心得である。ふだんから「鼠頭午首、鼠頭午首」と心に置き、ごく細かなことに取り組んでいるさなかにも、ぱっと大きな心に切り替える。大きくも小さくもなれるのが、兵法の一つの心構えだ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-25"
- "id": "gorin-ka-s025-p002"
  "section_id": "gorin-ka-s025"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    平生人の心も鼠頭午首と思ふべき所武士の肝心也兵法大分小分にしても此心をはなるべからず此事能々吟味有るべきもの也
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "215"
  "translation_ja": |-
    ふだんの人の心も「鼠頭午首」であると思うことが、武士にとって肝心だ。大軍の兵法でも、一人の兵法でも、この心を忘れてはならない。よくよく吟味してほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-25"
- "id": "gorin-ka-s026-heading"
  "section_id": "gorin-ka-s026"

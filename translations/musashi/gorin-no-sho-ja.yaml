    "precision": "page"
    "printed_page": "222–223"
  "translation_ja": |-
    人が何かを習うとき、ふだんから受ける、かわす、抜ける、くぐるといったことばかりを身につけると、心までその習慣に引かれて、人に振り回されるようになる。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-404"
- "id": "gorin-fu-s004-p004"
  "section_id": "gorin-fu-s004"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法の道直にただしき所なれば、正理を以て人を追回し人をしたがふる心肝要也。能く吟味有べし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "222–223"
  "translation_ja": |-
    兵法の道はまっすぐで正しいものである。だから、正しい道理に従って人を追い、従わせる心が肝要なのだ。よく吟味してほしい。
  "translation_status": "reviewed"

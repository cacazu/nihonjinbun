  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    其ごとくとりわけて目を付んとしては、まぎるゝ心有て、兵法のやまひといふ物になるなり。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "226–228"
  "translation_ja": |-
    そうやって一つの所だけに目を向けようとすると、かえって心が乱れてしまう。これが兵法でいう病なのである。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-407"
- "id": "gorin-fu-s007-p003"
  "section_id": "gorin-fu-s007"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    其子細は、鞠をける人は鞠に能目を付ね共、ひんすりをけ、おいまりをし、なかしてもけ、まはりてもける事、物になるると云所あれば、慥に目に見るに及ばず。又ほうかなどするもののわざにも、其道になれては、戸びらを鼻にたて、刀を幾腰もたまなどにとる事、是皆慥に目付とはなけれ共、不断手にふれぬれば、おのづから見ゆる所也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "226–228"
  "translation_ja": |-
    そのわけは蹴鞠をする人を見ればわかる。鞠をじっと見つめなくても、「びんずり」を蹴り、「追い鞠」をし、流しても、回りながらでも蹴る。そのわざに慣れれば、いちいち目で確かめなくてもよいのだ。放下（ほうか）という曲芸をする人も、芸に慣れると、鼻の上に戸板を立てたり、何本もの刀を玉のようにお手玉に取ったりする。どれも、ここを見ると決めているわけではない。いつも手に触れているので、おのずと見えるようになるのだ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-407"
- "id": "gorin-fu-s007-p004"
  "section_id": "gorin-fu-s007"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法の道に於ても、其敵々々としなれ、人の心の軽重を覚え、道を行得ては、太刀の遠近遅速迄も皆見ゆる儀也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "226–228"
  "translation_ja": |-
    兵法でも、いろいろな相手と経験を重ね、人の心の軽さ重さがわかり、この道が自分のものになると、太刀の遠い近い、遅い速いということまで、おのずと見える。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-407"
- "id": "gorin-fu-s007-p005"
  "section_id": "gorin-fu-s007"
  "kind": "paragraph"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "【編注】この箇所では、具体的な技法の記述を省略しています。"
  "translation_status": "reviewed"
- "id": "gorin-fu-s007-p006"
  "section_id": "gorin-fu-s007"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    大小兵法に於て、ちひさく目を付る事なし。前にもしるす如く、濃にちひさく目を付るによつて、大きなる事をとりわすれ、まよふ心出きて、慥なる勝をぬかすもの也。此利能々吟味して鍛煉有べき也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "226–228"
  "translation_ja": |-
    大勢の兵法でも、一人の兵法でも、目を向ける先を狭くしない。前にも書いたとおり、一点ばかりを凝視すると、大事なことをすっかり忘れ、迷いが生じ、確かだったはずの勝ちまで取り逃がす。この道理をよく吟味し、鍛錬してほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-407"

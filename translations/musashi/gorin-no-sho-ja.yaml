  "section_id": "gorin-ka-s009"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    敵になると云は我身を敵になり替て思ふべきと云所也世の中を見るにぬすみなどして家の内へ取籠る様なるものをも敵を強く思なすもの也敵になりて思へば世の中の人を皆相手としにげこみてせんかたなき心也取籠るものは雉子也打果しに入る人は鷹也能々工夫有べし
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "203–204"
  "translation_ja": |-
    「敵になる」とは、自分が敵に入れ替わったつもりで考えることだ。世間では、盗みを働いて家に立てこもった者などを、手ごわい相手だと思いがちだ。だがその者の身になれば、世間の人すべてを敵に回して逃げ込んで、もうどうしようもない気持ちでいる。立てこもる者は雉で、討ち取りに入る者は鷹なのだ。よく考えてほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-9"
- "id": "gorin-ka-s009-p002"
  "section_id": "gorin-ka-s009"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    大きなる兵法にしても敵といへば強く思ひて大事にかくるもの也よき人数をもち兵法の道理を能知り敵に勝と云所を能うけては気遣すべき道に非ず一分の兵法も敵になりて思ふべし兵法能心得て道理強く其道達者なるものに於ては必ずまくると思ふ所也能々吟味すべし
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "203–204"
  "translation_ja": |-
    大軍の兵法でも、「敵」と呼ぶだけで強いもののように思い、ことを重く見てしまう。だが、よい兵を持ち、兵法の道理をよく知り、勝てる筋道をつかんでいれば、気をもむには及ばない。一人の兵法でも、敵の身になって考えるとよい。兵法を心得、道理に通じ、この道に熟達した人を向こうに回せば、敵のほうこそ「負ける」と思うものだ。よくよく吟味してほしい。
  "translation_status": "reviewed"
  "source_alignment":

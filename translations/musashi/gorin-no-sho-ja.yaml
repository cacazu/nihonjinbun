  "translation_status": "reviewed"
- "id": "gorin-ka-s001-p004"
  "section_id": "gorin-ka-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    殊に六具かためてなどの利にちひさき事思ひ出る事に非ず更ば命をばかりの打合に於て一人して五人十人共戦ひ其勝道を慥に知る事我道の兵法也然るによつて一人して十人に勝ち千人を以て万人に勝つ道理何の差別有んや能々吟味有べし
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "192–194"
  "translation_ja": |-
    まして具足を一式着込んだ場で、どうしてそんな小さな利を思い出せよう。命がかかった勝負で、一人で五人、十人を相手にし、勝つ道を確かに知る。それが私の兵法だ。一人が十人に勝つのと、千人が一万人に勝つのと、その道理のどこが違うのか。よくよく考えてほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-1"
- "id": "gorin-ka-s001-p005"
  "section_id": "gorin-ka-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    去ながら常々の稽古の時千人万人を集め此道し習ふ事成事に非ず
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "192–194"
  "translation_ja": |-
    とはいえ、いつもの稽古で千人、万人もの人を集めて、この道を習うわけにはいかない。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-1"

- "id": "gorin-sui-s003-p001"
  "section_id": "gorin-sui-s003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    身のかゝり、顔はうつむかず、あをのかず、かたむかず、ひずまず、目をみださず、ひたいにしはをよせず、まゆあいにしわをよせて、目の玉のうごかざる樣にして、またゝきせぬ樣に思ひて、目を少しすくめる樣にして、うらやかに見ゆるかを、鼻すぢ直にして、少しおとがひを出す心也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "170–171"
  "translation_ja": |-
    身の置き方について。顔はうつむけず、仰向けず、傾けず、ゆがめない。視線を乱さず、額にしわを寄せず、眉の間にしわを寄せる。目玉をあちこち動かさず、まばたきもしないつもりで目を少し細め、表情は穏やかに見えるようにする。鼻筋をまっすぐにし、あごを少し前へ出す気持ちでいる。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-3"
- "id": "gorin-sui-s003-p002"
  "section_id": "gorin-sui-s003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    首はうしろのすじを直に、うなじに力を入れて、肩より總身はひとしく覺へ、兩の肩をさげ、脊すぢをろくに、尻を出さず、ひざより足先まで力を入て、腰のかゞまざる樣に腹をはり、
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "170–171"
  "translation_ja": |-
    首の後ろをまっすぐにし、うなじに力を入れ、肩から下の体全体を偏りなく感じ取る。両肩を下げ、背筋をまっすぐにし、尻を突き出さない。膝から足先まで力を通し、腰が曲がらないように腹を張る。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-3"
- "id": "gorin-sui-s003-p003"
  "section_id": "gorin-sui-s003"
  "kind": "paragraph"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "【編注】この箇所では、具体的な技法の記述を省略しています。"
  "translation_status": "reviewed"
- "id": "gorin-sui-s003-p004"
  "section_id": "gorin-sui-s003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    總て兵法の身に於て、常の身を兵法の身とし、兵法の身を常の身とする事肝要なり。能々吟味すべし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "170–171"
  "translation_ja": |-
    結局、ふだんの身のありようを兵法のときのものとし、兵法のときの身のありようをふだんのものとすることが肝心だ。よく確かめてほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-3"
- "id": "gorin-sui-s004-heading"

  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "220–222"
  "translation_ja": |-
    太刀に「強い太刀」「弱い太刀」という区別があってよいものではない。強さを意識して振るう太刀は荒い。荒いだけでは勝てない。
  "translation_status": "reviewed"

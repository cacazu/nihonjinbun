  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    短き太刀斗にて勝んと思ふ所、実の道に非ず。昔より太刀、かたなと云て、長きと短きと云ふ事を顕し置也。世の中に強力なる者は大きなる太刀をもかろく振なれば、むりに短きを好む可にあらず。其故は長きを用て鎗長太刀をも持物也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "222–223"
  "translation_ja": |-
    短い太刀だけで勝とうというのは真の道ではない。昔から「太刀」と「かたな」といい、長いものと短いものとをいい分けてきた。世には大きな太刀も軽々と振るほど力のある人がいて、何も無理に短いものを好む理由はない。長いものを使う人は、槍やなぎなたも持つものなのだ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-404"

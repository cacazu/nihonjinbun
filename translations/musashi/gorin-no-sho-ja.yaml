  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "171–172"
  "translation_ja": "「観」と「見」"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "sui-4"
- "id": "gorin-sui-s004-omission"
  "section_id": "gorin-sui-s004"
  "kind": "paragraph"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "【編注】この節では、具体的な技法の記述を一部省略しています。"

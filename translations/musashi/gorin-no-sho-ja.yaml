  "section_id": "gorin-chi-s007"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    二刀と云出す所、武士は将卒共にぢきに二刀を腰に付る役也、昔は太刀刀と云、今は刀脇差と云。武士たる者の此両腰を持事、こまかに書顕すに及ばず。我朝に於てしるもしらぬも腰におぶ事武士の道也。此二つの利をしらしめん為に、二刀一流と云也。鎗長刀よりしては、外の物と云て武道具の内也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "159–161"
  "translation_ja": |-
    「二刀」と呼ぶのは、武士なら将も兵も、自ら二振りを腰に帯びるのが習いだからである。昔は太刀と刀といい、今は刀と脇差という。武士がこの二振りを帯びることについて、細かく書くまでもない。この国では、よく心得ている者もそうでない者も、腰に帯びるのが武士の習わしである。この二つの意義を知ってもらうために、二刀一流という。槍や長刀などは、これらとは別に、ほかの武具に数える。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-106"

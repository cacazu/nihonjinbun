- "id": "gorin-chi-s001-p001"
  "section_id": "gorin-chi-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法の道二天一流と号し、数年鍛錬の事初て書物に書き顕はさんと思ふ。時に寛永二十年十月上旬の頃、九州肥後の地巌殿山に上り、天を拝し観音を礼し仏前に向ひ、生国播磨の武士新免武蔵藤原玄信、年つもりて六十。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "146–148"
  "translation_ja": |-
    私の兵法の道を二天一流と名づけ、長年鍛錬してきたことを、初めて書物にしようと思う。寛永二十年（1643年）十月の初め、九州の肥後にある巌殿山に登り、天を拝み、観音に礼をして仏前に向かう。私は播磨に生まれた武士、新免武蔵藤原玄信。齢は六十である。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-001"
- "id": "gorin-chi-s001-p002"
  "section_id": "gorin-chi-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    我若年のむかしより、兵法の道に心をかけ、十三歳にして初て勝負を為す。その相手新当流の有馬喜兵衛といふ兵法者に打勝ち、十六歳にして但馬国秋山といふ強力の兵法者に打ち勝ち、廿一歳にして都に上り、天下の兵法者に逢ひて、数度の勝負を決すといへども、勝利を得ずといふことなし。その後国々所々に至り、諸流の兵法者に行逢ひ六十余度まで勝負すといへども、一度もその利を失はず、その程年十三より二十八九までのことなり。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "146–148"
  "translation_ja": |-
    幼いころから兵法に心を向け、十三歳で初めて勝負をした。相手は新当流の有馬喜兵衛という兵法者で、私が勝った。十六歳では但馬の国の秋山という強い兵法者に勝ち、二十一歳で都に上って諸国の兵法者と出会い、何度も勝負して一度も負けなかった。それから各地を巡り、さまざまな流派の兵法者を相手に六十余度も勝負をしたが、一度も勝ちを失わなかった。十三歳から二十八、九歳までのことである。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-001"
- "id": "gorin-chi-s001-p003"
  "section_id": "gorin-chi-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    三十を越えて跡をおもひ見るに、兵法至極して勝つにはあらず、おのづから道の器用ありて、天理を離れざるが故か、又は他流の兵法不足なる所にや。その後猶も深き道理を得んと朝鍛夕錬して見れば、おのづから兵法の道にあふこと、我五十歳のころなり。それより以来は尋ね入るべき道なくして、光陰をおくる。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "146–148"
  "translation_ja": |-
    三十を過ぎて、それまでを振り返った。私は兵法を極めたから勝てたのではない。生まれつきこの道に向いていて、おのずと道理を外さずにいたのか。それとも、ほかの流派に足りないところがあったのか。その後も、もっと深く道理を知ろうと、朝に夕に鍛え続けた。おのずと兵法の道にかなうようになったのは、五十歳のころである。それ以来、さらに探し入るべき道はないまま、歳月を送ってきた。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-001"
- "id": "gorin-chi-s001-p004"
  "section_id": "gorin-chi-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法の利にまかせて、諸芸諸能の道となせば、万事に於て我に師匠なし。今この書を作るといへども、仏法儒道の古語をもからず、軍記軍法の古きことをも用ゐず、この一流の見立実の心をあらはすこと、天道と観世音とを鏡として十月十日の夜寅の一点に筆を把りて書き初るものなり。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "146–148"
  "translation_ja": |-
    兵法で得た道理をさまざまな芸や技に通じさせるので、何事についても私には師匠がいない。この書を書くにあたって、仏教や儒学の古い言い回しを借りず、昔の軍記や軍法の先例も用いない。二天一流の見方と真意を表すため、天の道理と観世音を鏡とし、十月十日の夜、寅の刻の初めに筆を執る。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-001"
- "id": "gorin-chi-s002-heading"
  "section_id": "gorin-chi-s002"
  "kind": "heading"
  "origin": "translator"
  "source_text": null
  "source_languages": []
  "source_locations": []
  "translation_ja": "地の巻の序"
  "translation_status": "reviewed"
- "id": "gorin-chi-s002-p001"
  "section_id": "gorin-chi-s002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    夫兵法と云事武家の法也、将たる者はとりわき此法を行なひ、卒たる者も此道を知るべき事なり。今世の中に兵法の道慥に辨まへたるといふ武士なし。先道を顕して有は、仏法として人をたすくる道、又儒道として文の道を糾し、医者といひて諸病を治する道、或は歌道者とて和歌の道ををしへ、或は数寄者弓法者、其外諸芸諸能までも思ひ思ひに稽古し、こころこころにすくものなり、兵法の道にはすく人まれ也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "148–150"
  "translation_ja": |-
    兵法とは武家の道である。とりわけ将たる者はこれを実践し、兵の一人ひとりも心得ておくべきだ。ところが今、兵法を確かにわきまえた武士は見当たらない。世に知られた道には、仏教のように人を救う道、儒学のように学問の筋道を確かめる道、医者のように病を治す道がある。和歌を教える人もいれば、茶や弓を究める人もいる。そのほかの芸や技にも、人はそれぞれに稽古し、心の向くものを好む。ところが、兵法の道を好む人はまれである。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-101"
- "id": "gorin-chi-s002-p002"
  "section_id": "gorin-chi-s002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    先武士は文武二道と云ひて、二ツの道を嗜む事是道也。縦此道ぶきようなり共、武士たるものはおのれおのれが分際程は兵の法をばつとむべき事也。大形武士の思ふ心をはかるに、武士は只死ぬると云ふ道を嗜む事と覚ゆる程の儀也。死する道に於ては、武士ばかりに限らず、出家にても女にても百姓以下に至るまで、義理を知り恥を思ひ死するべきを思ひきる事は、其差別なきものなり。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "148–150"
  "translation_ja": |-
    武士には文武二道といって、学問と武芸の両方をたしなむ道がある。この道に不器用でも、武士であれば自分の立場に応じて兵法に励むべきだ。世の武士の心づもりを見ていると、武士ならただ死を覚悟していればよいと考えているように思われる。しかし、死を覚悟することは武士に限らない。僧であれ、女であれ、農民やそれより下とされた身分の者であれ、義理を知り恥を思い、死をも覚悟するのに隔たりはない。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-101"
- "id": "gorin-chi-s002-p003"
  "section_id": "gorin-chi-s002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    武士の兵法をおこなふ道は、何事に於ても人にすぐるゝところを本とし、或は一身の切合にかち或は数人の戦に勝、主君の為我身の為、名をあげ身をたてんと思ふ、是兵法の徳をもつてなり。又世の中に兵法の道をならひても、実の時の役にはたつまじきと思ふ心あるべし。其儀に於ては何時にても役に立様に稽古し、万事に至り役に立やうに教る事、是兵法の実の道也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "148–150"
  "translation_ja": |-
    武士が兵法を行う道は、何事にも人にまさるところを土台とする。一人での勝負や数人の戦いに勝ち、主君のため、自分のために、名をあげて身を立てようとする。それが兵法の効用によるものだ。世間には、兵法を習ってもいざというときに役に立たないと考える人もいるだろう。だからこそ、いつでも役立つように稽古し、何事にも役立つように教える。それが兵法の本当の道である。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-101"
- "id": "gorin-chi-s003-heading"
  "section_id": "gorin-chi-s003"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    兵法の道と云事
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "150–152"
  "translation_ja": "兵法の道とは何か"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-102"
- "id": "gorin-chi-s003-p001"
  "section_id": "gorin-chi-s003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    漢土和朝迄も此道を行なふ者を兵法の達者と云伝へたり。武士として此法を学ばずと云事有べからず。近代兵法者と云て世を渡る者、是は剣術一通の事也。常陸国かしまかんとりの社人共、明神の伝へとして流々をたてて、国々を廻り人に伝ゆる事、近き頃の儀也。古しへより十能七芸と有うちに利方と云て芸にわたると云へ共、利方と云出すより、剣術一通にかぎるべからず。剣術一へんの利までにては剣術も知りがたし、勿論兵の法には叶べからず。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "150–152"
  "translation_ja": |-
    中国でも日本でも、この道を行う者を兵法の達人と呼んできた。武士でありながらこの法を学ばないということは、あってはならない。近ごろ兵法者を名乗って生計を立てる者は、剣術一筋の人たちである。常陸国の鹿島の神社や、香取の神社に仕える者が神の伝えとして流派を立て、諸国を巡って教えるようになったのも、近ごろのことである。昔から十能七芸といわれるさまざまなたしなみの一つに「利方」があり、芸の一つとされてきた。しかし物事にかなう方法をいうなら、剣術だけに限るわけにはいかない。剣術の一面の効用だけを知っても、剣術そのものすらわかりにくい。まして兵法には及ばない。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-102"
- "id": "gorin-chi-s003-p002"
  "section_id": "gorin-chi-s003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    世の中を見るに、諸芸をうり物にしたて、我身をうり物のやうに思ひ、諸道具につけてもうり物にこしらゆる心、花実の二ツにして、花よりも実のすくなき所也。とりわき此兵法の道に、色をかざり花をさかせて術をてらひ、或は一道場或は二道場などと云て、此道を教へ此道を習ひて利を得んと思ふ事、誰か云ふ、なまへいはう大疵のもと、まこと成べし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "150–152"
  "translation_ja": |-
    世の中を見ると、諸芸を売り物にし、自分自身を商品と考え、道具まで売り物に仕立てようとする。花と実でいうなら、花の見栄えに比べて実が少ないのだ。とりわけ兵法の道では、色を飾り、花を咲かせるように術をひけらかし、一つ目の道場だ、二つ目の道場だといって、この道を教えるにも習うにも、利益を得ようとする。「生兵法は大けがのもと」と誰かが言ったが、本当のことだろう。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-102"
- "id": "gorin-chi-s003-p003"
  "section_id": "gorin-chi-s003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    凡人の世を渡る事、士農工商とて四ツの道也。一ツには農の道、農人は色々の農具を設け、四季転変の心得いとまなくして春秋を送る事、是農の道也。二ツにはあきないの道、酒を作るものは夫々の道具をもとめ、其善悪の利を得て渡世をおくる、いづれもあきないの道、其身々々のかせぎ、其利を以て世を渡る也、是商の道。三ツには士の道、武士に於てはさまざまの兵具をこしらへ、兵具しなじなの徳を辨へたらんこそ武士の道なるべけれ。兵具をもたしなまず、其具々の利をも覚ざる事、武家は少々たしなみのあさきもの歟。四ツには工の道、大工の道に於ては種々様々の道具をたくみこしらへ、其具々を能つかひ覚え、すみかねを以て其さしづをただし、いとまもなくそのわざをして世を渡る。是士農工商四ツの道也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "150–152"
  "translation_ja": |-
    人が暮らしを立てるのに、士・農・工・商という四つの道がある。第一は農である。農民はさまざまな農具を用意し、四季の移り変わりに絶えず気を配って一年を送る。第二は商いである。酒を造る人は必要な道具を求め、それぞれの良し悪しや利点を見きわめて暮らしを立てる。各人が自分の仕事で稼ぎ、その利益で世を渡る。第三は武士の道である。さまざまな武具を整え、それぞれの特質を知るのが武士の務めだ。それに心得がなく、何に役立つかもわからないのでは、たしなみが浅いというものだろう。第四は工である。大工はさまざまな道具を工夫して作り、その扱いを身につけ、差し金で図面を確かめ、休む間もなく技をふるって生計を立てる。これが士農工商の四つの道である。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-102"
- "id": "gorin-chi-s003-p004"
  "section_id": "gorin-chi-s003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法を大工の道にたへて云あらはす也。大工にたとゆる事、家といふ事につけての儀也。公家武家四家、其家のやぶれ、家のつづくと云事、其流其風其家などゝ云へば、家と云より大工の道にたとへたり。大工は大きにたくむと書なれば、兵法の道大きなるたくみによつて、大工に云なぞらへて書顕す也。兵の法を学ばんと思はゞ、此書を思案して、師ははり、弟子は糸と成て、たえず稽古有るべき事也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "150–152"
  "translation_ja": |-
    兵法は大工の仕事になぞらえて説明する。「家」という言葉から借りたたとえである。公家、武家、名門の家々といい、家が没落する、家が続くといい、流儀や気風、家柄も語る。この「家」から、大工の道になぞらえた。「大工」と書いて「大きにたくむ」と読める。兵法もまた大きな企てを組み立てる道なので、大工にたとえて述べる。兵法を学びたいと思うなら、この書をよく考え、師は針、弟子は糸となって、絶えず稽古することである。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-102"
- "id": "gorin-chi-s004-heading"
  "section_id": "gorin-chi-s004"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    兵法の道大工にたとへたる事
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "153–154"
  "translation_ja": "兵法の道を大工にたとえる"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-103"
- "id": "gorin-chi-s004-p001"
  "section_id": "gorin-chi-s004"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    大将は大工の統領として、天下のかねを辨へ、其国のかねを糺し、其家のかねを知る事、統領の道也。大工の統領は堂塔伽藍のすみかねを覚え、くうでんろうかくのさしづを知り、人々をつかひ家々を取立る事。大工の統領も武家の統領も同じ事也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "153–154"
  "translation_ja": |-
    大将は大工の棟梁にあたる。天下を測る尺度をわきまえ、その国の基準を確かめ、その家の規矩を知る。これが棟梁の道である。大工の棟梁は、堂や塔をはじめ寺院の建物を測る規矩を心得、宮殿や楼閣の図面を読み、人に仕事を割り振って建物を建てる。大工の棟梁も、武家の頭領も、その点では同じである。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-103"
- "id": "gorin-chi-s004-p002"
  "section_id": "gorin-chi-s004"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    家を立るに木配りをする事。直にして節もなく見つきのよきを表の柱とし、少し節有り共直につよきをうちの柱とし、たとひかよはくとも節なき木の見ざまよきをば敷居鴨居戸障子と、夫々に遣ひ、節有り共ゆがみたり共強き木をば其家の強み〳〵を見分て、能吟味して遣ふに於ては、其家久しくくづれがたし。又材木のうちにしても節多くゆがみて弱きをば、あししろ共なし、後には薪共なすべき也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "153–154"
  "translation_ja": |-
    家を建てるには、まず木をどこに使うか決める。まっすぐで節がなく、見栄えのする木は表の柱に、少し節があってもまっすぐで強い木は内側の柱にする。弱くても節がなく見た目のよい木なら、敷居や鴨居、戸や障子に回す。節や曲がりがあっても丈夫な木は、家のどこに強さが要るかを見きわめ、よく吟味して使う。そうすれば、家は長くもち、たやすくは崩れない。節が多く、曲がって弱い木も、足場に使い、そのあと薪にできる。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-103"
- "id": "gorin-chi-s004-p003"
  "section_id": "gorin-chi-s004"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    統領に於て大工を遣ふ事、其上中下を知り、或はとこまわり或は戸障子或は敷居鴨居天井以下、夫々に遣ひて、あしきは根太をはらせ、猶悪きにはくさびをけづらせ、人を見分て遣へば、其はか行て手際よきもの也。果敢の行き手際よきを云ふ所、物毎をゆるさゞる事、たいゆう知事、気の上中下を知る事、いさみを付ると云事、むたいを知るといふ事、箇様の事共統領の心持に有事也。兵法の利かくのごとし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "153–154"
  "translation_ja": |-
    棟梁が大工に仕事を割り振るには、腕前の違いを知り、床の間、戸や障子、敷居や鴨居や天井と、それぞれに合う持ち場を任せる。腕の劣る者には床を支える根太を張らせ、さらに不慣れな者にはくさびを削らせる。こうして人を見きわめて任せれば、仕事はよく進み、仕上がりもよい。仕事の進み具合と手際を見て、何事にも手を抜かせず、人の力量と気持ちの状態を知り、やる気を引き出し、無理のあるところを見きわめる。こうしたことはみな棟梁の心得である。兵法の道理もこれと同じである。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-103"
- "id": "gorin-chi-s005-heading"
  "section_id": "gorin-chi-s005"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    兵法の道
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "154–155"
  "translation_ja": "職人の仕事"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-104"
- "id": "gorin-chi-s005-p001"
  "section_id": "gorin-chi-s005"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    士卒たる者は大工にして、手づから其道具をとぎ、色々のせめ道具をこしらへ、大工の箱に入て持、統領云付る所をうけ、柱かうりゃう共てうのにてけづり、とこだなをもかんなにてけづり、すかし物ほり物をもして、よくかねを糺し、すみ〴〵めんどう迄も手際能く仕立る所、大工の法也。大工のわざ手にかけて能くしおぼへ、すみかねを能知りて後は、統領となる者也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "154–155"
  "translation_ja": |-
    兵卒は、大工でいえば現場の職人にあたる。自分の手で道具を研ぎ、いろいろな細工道具を整え、箱に入れて携える。棟梁の指図を受け、柱や梁を手斧で削り、床の間の棚を鉋で仕上げ、透かし彫りや彫刻を施す。寸法と角度を確かめ、細部や角の面取りまで手際よく仕立てる。それが大工の仕事である。手を動かして技を覚え、規矩をよく知った後に、棟梁となる。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-104"
- "id": "gorin-chi-s005-p002"
  "section_id": "gorin-chi-s005"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    大工のたしなみ、能きるゝ道具を持、透々にとぐ事肝要也。其道具をとつてみづし書棚机卓、又はあんとんまないた鍋のふた迄も、達者にする所大工の専なり。士卒たる者このごとく也。能々吟味有べし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "154–155"
  "translation_ja": |-
    大工のたしなみは、よく切れる道具を持ち、刃を十分に研ぐことにある。その道具を手に、厨子や本棚、机や台から、行灯、まな板、鍋の蓋に至るまで、じょうずに作り上げるのが大工の本分である。兵卒も同じである。このことをよく考えてほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-104"
- "id": "gorin-chi-s005-p003"
  "section_id": "gorin-chi-s005"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    大工のたしなみ、ひずまざる事、とめをあはする事、かんなにて能くけづる事、すりみがかゝざる事、後にひすかざる事肝要也。此道を学ばんと思はゞ、書顕す所のこと〴〵に心を入て、能吟味有べきもの也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "154–155"
  "translation_ja": |-
    大工は、ものをゆがませない。継ぎ目をきちんと合わせ、鉋でよく削り、すり磨きで仕上げをごまかさず、後になって反らせない。こうしたところが大事である。この道を学びたいなら、書き表したことの一つひとつに心を入れ、よく吟味してほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-104"
- "id": "gorin-chi-s006-heading"
  "section_id": "gorin-chi-s006"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    此兵法の書五巻に仕立る事
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "155–158"
  "translation_ja": "この書を五巻に仕立てること"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-105"
- "id": "gorin-chi-s006-p001"
  "section_id": "gorin-chi-s006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    五ツの道を分ち、一まき一まきにして其利を知らしめんが為に、地水火風空として、五巻に書顕す也。地の巻に於ては兵法の道の大体、我一流の見立、剣術一通にしてはまことの道を得がたし。大きなる所よりちいさき所を知り、浅きより深きに至る、直なる道の地形を引ならすによつて、初を地の巻と名付也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "155–158"
  "translation_ja": |-
    道を五つに分け、一巻ずつ、その道理を知ってもらうため、地・水・火・風・空の五巻に書き表す。「地の巻」では、兵法の道の大筋と、わが流派の見方を示す。剣術だけでは、本当の道はつかみにくい。大きなところから小さなところを知り、浅いところから深いところへ至る。まっすぐな道を敷くため地面をならす。そこで最初を「地の巻」と名づける。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-105"
- "id": "gorin-chi-s006-p002"
  "section_id": "gorin-chi-s006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    第二水の巻、水を本として心も水になる也。水は方円のうつわものに随ひ、一滴と也、さう海となる。水に碧潭の色有り、清き所を用ひて一流の事を此巻に書顕す也。剣術一通の理さだかに見分け、一人の敵に自由に勝時は、世界の人に皆勝所也、人に勝と云心は、千万の敵にも同意也。将たる者の兵法、ちいさきを大きになす事、尺のかたを以て大仏をたつるに同じ、箇様の義こまやかには書分がたし。一を以て万を知る事、兵法の利也。一流の事此水の巻に書しるす也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "155–158"
  "translation_ja": |-
    第二は「水の巻」。水を手本にして、心も水になる。水は四角にも丸にも、器の形に沿う。一滴にもなれば、広い海にもなる。深い淵には青く澄んだ水の色がある。その清らかさを借りて、わが流派をこの巻に書き表す。剣術の道理をはっきり見分け、一人の相手に自在に勝てるなら、世のどの相手にも勝てるということになる。人に勝つ道理は、相手が千万でも変わらない。将の兵法は、小から大を組み立てるもので、一尺の模型から大仏を造るのに似ている。こうしたことは、細かく書き分けにくい。一つから万を知るのが兵法の道理である。わが流派のことを、この「水の巻」に書き記す。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-105"
- "id": "gorin-chi-s006-p003"
  "section_id": "gorin-chi-s006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    第三火の巻、此巻に戦の事を書記也。火は大小となり、けやけき心有によつて、合戦の事を書く也。合戦の道、一人と一人との戦ひも、万と万との戦ひも同じ道也。心を大きなる事になし、心を小さくなして、能く吟味して見るべし。大きなる所は見えやすし、小さき所は見えがたし。其子細、大人数の事は即座にもとをりがたし、一人の事は心一つにてかわる事はやきによつて、小さき所知る事得がたし、能吟味有べし。此火の巻の事、はやき間のことなるによつて、日々に手馴、常の如く思ひ、心のかわらぬ所兵法の肝要也。然るによつて戦勝負の所を火の巻に書顕す也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "155–158"
  "translation_ja": |-
    第三は「火の巻」。この巻には戦いのことを書く。火は大きくも小さくもなり、勢いが激しい。それで合戦について書くのである。合戦の道理は、一人と一人の勝負も、一万と一万の戦いも同じ筋に立つ。見方を大きくしたり小さくしたりして、どちらもよく吟味する。大きな動きは見えやすく、小さな動きは見えにくい。大人数の動きはすぐには変わらないが、一人なら心一つでたちまち変わる。だから小さなことほど見きわめにくい。この点はよく考えてほしい。「火の巻」が扱うのは、短い間に起きることである。ふだんから慣れ親しみ、いつものことと思えるほどにして、心がいつもと変わらないことが兵法では大切だ。そこで戦いと勝負のことを「火の巻」に書き表す。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-105"
- "id": "gorin-chi-s006-p004"
  "section_id": "gorin-chi-s006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    第四風の巻、此巻を風の巻としるす事、我一流の事にはあらず、世の中の兵法其流々の事を書載する所也。風と云に於ては、昔の風、今の風、其家々の風などゝあれば、世間の兵法其流々のしわざをさだかに書顕す、是風也。他の事を能知らずしては、自のわきまへ成がたし。道々事々をおこなふに、外道と云ふ心有り。日々に其道を勤むると云ふ共、心のそむけば其身のよき道と思ふ共、直なる所より見れば、実の道には有らず。実の道をきはめざれば、少心のゆがみに付て後には大きにゆがむもの也。吟味すべし。他の兵法剣術ばかりと世に思ふ事尤也。我兵法の利わざに於ても各別の儀也。世間の兵法を知しめん為に、風の巻として他流の事を書顕す也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "155–158"
  "translation_ja": |-
    第四は「風の巻」。ここに書くのはわが流派のことではなく、世にあるほかの流派のことである。「風」とは昔の風、今の風、家々の風というような、ものの流儀をいう。それぞれの流派のあり方をはっきり書き表すのが、この巻である。他をよく知らなければ、自分のことも正しくはわからない。どんな道や仕事にも、本筋から外れることがある。日々その道に励んでいても、心が道に背けば、自分ではよい道だと思っていても、まっすぐな尺度で見れば本当の道ではない。真の道を究めなければ、心のわずかなゆがみが、のちには大きなゆがみになる。よく吟味してほしい。他流の兵法は剣術ばかりだと世間が考えるのももっともである。わが流派の道理と技は、それとは別のものである。世間の兵法を知ってもらうため、他流について「風の巻」に書き表す。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-105"
- "id": "gorin-chi-s006-p005"
  "section_id": "gorin-chi-s006"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    第五空の巻、此巻空と書顕す事、空と云ひ出すよりしては、何をか奥と云、何をか口といはん。道理を得ては道理をはなれ、兵法の道におのれと自由ありて、おのれと奇特をす、時にあひてはひやうしを知り、自ら打自あたる、是皆空の道也。おのずと実の道に入る事を空の巻にして、書とゞむるもの也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "155–158"
  "translation_ja": |-
    第五は「空の巻」。「空」という以上、何を奥といい、何を入口と呼べるだろう。道理を身につけてからは、道理そのものにとらわれない。兵法の道におのずと自由を得て、おのずとすぐれた働きが生まれる。その時に応じて拍子を知り、打つことも当たることもおのずと起こる。それがみな空の道である。おのずから本当の道に入ることを、「空の巻」として書き留める。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "chi-105"

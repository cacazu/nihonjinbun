    "original_unit_id": "ka-29"
- "id": "gorin-ka-s029-p003"
  "section_id": "gorin-ka-s029"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    剣術実の道になつて敵と戦ひ勝事此法と聊替事有べからず我兵法の智力を得て直なる所を行ふに於ては勝事うたがひ有べからざるもの也
  "source_languages":
  - "ja"
  "source_locations":

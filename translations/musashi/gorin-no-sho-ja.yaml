    "precision": "page"
    "printed_page": "233–234"
  "translation_ja": |-
    正保二年（一六四五）五月十二日　新免武蔵より、寺尾孫之丞殿へ。
    寛文七年（一六六七）二月五日　寺尾夢世勝延（花押）より、山本源介殿へ。
  "translation_status": "reviewed"

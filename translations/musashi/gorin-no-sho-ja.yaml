  "source_text": |-
    二刀一流の兵法戦の事を火に思ひとつて戦勝負の事を火の巻として此巻に書顕す也
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "192–194"
  "translation_ja": |-
    二刀一流の兵法のうち、戦いのことは火になぞらえた。そこでこの「火の巻」に、戦いと勝負のことを書き表す。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-1"
- "id": "gorin-ka-s001-p002"
  "section_id": "gorin-ka-s001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    先世間の人毎に兵法の利をちひさく思ひなして或は指先にて手くび五寸三寸の利を知り或は扇を取てひぢより先の先後の勝を弁へ又はしないなどにてわつかのはやき利を覚え手をきかせ習ひ足をきかせ習ひ少の利の早き所を専とする事也
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "192–194"
  "translation_ja": |-
    世間の人は、とかく兵法の理を小さなことにしてしまう。指先や手首のわずかな動きに利を求め、扇を手に、肘から先の動きの早い遅いで勝負を論じる。あるいは竹刀でほんの少し人にまさる速さを覚える。そうして手足を利かせる稽古をし、わずかな速さを何より大事にしている。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "ka-1"
- "id": "gorin-ka-s001-p003"
  "section_id": "gorin-ka-s001"

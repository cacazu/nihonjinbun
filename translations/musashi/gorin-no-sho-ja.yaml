    "original_unit_id": "fu-409"
- "id": "gorin-fu-s010-heading"
  "section_id": "gorin-fu-s010"
  "kind": "heading"
  "origin": "source"
  "source_text": |-
    他流に奥表と云事
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "231–232"
  "translation_ja": "教えに「奥」と「表」はあるか"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-410"
- "id": "gorin-fu-s010-p001"
  "section_id": "gorin-fu-s010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法の事に於て、何れを表といひ何れを奥と云ん。芸によりことにふれて、極意秘伝などゝいひて奥口あれ共、敵と打合時の理に於ては、表にて戦ひ奥をもつてきると云事に非ず。我兵法のおしへ様は、始て道を学ぶ人には其わざのなりよき所をさせならはせ、合点の早くゆく理を先に教へ、心の及がたき事をば、其人の心をほどくる所を見分て、次第次第に深き所の理を後に教る心也。され共大形は其事に対したる事様を覚えさするによつて、奥口と云所なき事也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "231–232"
  "translation_ja": |-
    兵法では、どこまでを「表」といい、どこからを「奥」というのだろう。芸によっては、極意だ、秘伝だといって、入り口と奥とを分ける。だが相手と打ち合う場で、表の教えで戦い、奥の教えで斬るというわけではない。私の教え方はこうだ。初めて学ぶ人には、やさしくできることをさせて慣らし、すぐに納得できる道理を先に教える。すぐには理解の及ばないことは、その人の心で結び目がほどけてくるころを見きわめてから、少しずつ深い道理を教える。おおよそ、その人が出会った事柄に応じて、ふさわしいことを覚えさせるのだから、奥も入り口もない。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-410"
- "id": "gorin-fu-s010-p002"
  "section_id": "gorin-fu-s010"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    されば世の中に山の奥を尋るに、猶奥へ行んと思へば、又口に出るもの也。何事の道に於ても、奥の出合所も有、口を出してよき事も有。此戦の理に於て、何をかかくし何をか顕さん。然によつて我道を伝るに、誓紙罰文などと云事を好まず。此道を学ぶ人の智力をうかゞひ、直なる道を教へ、兵法の五道六道の悪しき所をすてさせ、おのづから武士の法の実の道に入、うたがひなき心になす事、我兵法の教への道也。能々鍛錬有べし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "231–232"
  "translation_ja": |-
    山の奥をたずねて、なお奥へ行こうとすると、また山の入り口に出るものだ。どんな道でも、奥にあるものと出合うこともあれば、入り口のことを出すのがよいときもある。戦いの道理について、いったい何を隠し、何を明かすというのか。だから私は道を伝えるのに、誓いを立てる書状や、背けば罰を受けると書いた文書を好まない。学ぶ人の理解する力を見て、まっすぐな道を教え、兵法のあれこれの脇道の悪いところを捨てさせる。その人がおのずから武士の本当の道に入り、疑いのない心を持てるようにする。それが私の兵法の教え方である。よく鍛錬してほしい。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-410"
- "id": "gorin-fu-s011-heading"
  "section_id": "gorin-fu-s011"
  "kind": "heading"

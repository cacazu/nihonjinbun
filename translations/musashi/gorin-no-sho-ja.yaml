  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    我兵法の直道世界に於て誰か得ん又何れか極めんと慥に思ひ取つて朝鍛夕錬して磨きおほせて後独自由を得自ら奇特を得通力不思議有所是兵として法をおこのふ息也
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "192–194"
  "translation_ja": |-
    「この世で、私の兵法のまっすぐな道を誰が会得し、誰が極めるのか」と、わが身に引き受けて決心する。朝に鍛え、夕に練り、磨き抜けば、独りで自在にはたらけるようになる。おのずと並外れた力がそなわり、不思議なはたらきさえ現れる。それが武士として兵法を行う息づかいである。
  "translation_status": "reviewed"
  "source_alignment":

  "translation_ja": "【編注】この節では、具体的な技法の記述を一部省略しています。"
  "translation_status": "reviewed"
- "id": "gorin-fu-s009-p001"
  "section_id": "gorin-fu-s009"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    兵法のはやきと云所、実の道に非ず。はやきと云事は、物毎の拍子の間にあはざるによつて、はやきおそきと云ふ心也。其道上手になりては、はやく見えざるもの也。縦人にはや道と云て、四十里五十里行ものも有。是も朝より晩迄はやくはしるにてはなし。道のぶかんなるものは、一日はしる様なれ共、はかゆかざるもの也。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "229–231"
  "translation_ja": |-
    兵法では速ければよいというのは真の道ではない。何にでも拍子があり、その間に合わないからこそ「速い」とか「遅い」とかいう。その道が上手になると、速くは見えないものだ。たとえば人には、早道といって四十里、五十里を行く者がいる。そういう人も朝から晩まで速く走っているわけではない。道を行くのに不慣れな人は、一日じゅう走っているようでいて、さっぱりはかどらない。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-409"
- "id": "gorin-fu-s009-p002"
  "section_id": "gorin-fu-s009"
  "kind": "paragraph"
  "origin": "source"
  "source_text": |-
    乱舞の道に、上手の謡ふうたひに下手のつけてうたへば、後る心有て、いそがしきもの也。又鼓太鼓に老松をうつに、静なる位なれ共、下手は是にもおくれさきたつ心有。高砂は急なる位なれ共、はやきと云事悪し。はやきはこけると云て間に合ず。勿論おそきも悪し。是も上手のする事は緩々と見えて、間のぬけざる所也。諸事しつけたるもののする事はいそがしく見えざるもの也。此たとへを以て道の理を知るべし。殊に兵法の道に於て、はやきと云事悪し。其子細は是も所によりて、沼ふけなどにて身足共に早くゆきがたし。
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-992019"
    "precision": "page"
    "printed_page": "229–231"
  "translation_ja": |-
    能の謡でも、上手な人について下手な人が謡うと、遅れまいとしてあわただしくなる。鼓や太鼓で「老松」を打つときはおだやかな調子なのに、下手な人はそこでも遅れたり先走ったりする。「高砂」は急な調子だが、ただ速いのはよくない。「速いのはこける」というように、拍子の間に合わなくなる。もちろん遅いのもよくない。上手な人がすると、ゆったりと見えて、間が抜けることがない。何であれ、ふだんからやり慣れた人の仕事はせわしなく見えないものだ。これらのたとえから、この道の理を知ってほしい。とくに兵法では、速さだけをよいとするのはいけない。土地によっては、深い沼のように、体も足も速くは運べないところがあるからだ。
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-992019"
    "original_unit_id": "fu-409"

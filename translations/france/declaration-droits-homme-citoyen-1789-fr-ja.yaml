  source_text: DÉCLARATION DES DROITS DE L’HOMME ET DU CITOYEN.
  translation_ja: 人間と市民の権利の宣言
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '[1]'
    pdf_page: 7

- id: ddhc-a09-text
  section_id: ddhc-a09
  kind: paragraph
  origin: source
  source_text: Tout homme étant présumé innocent jusqu’à ce qu’il ait été déclaré coupable, s’il est jugé indispensable de l’arrêter, toute rigueur qui ne seroit pas nécessaire pour s’assurer de sa personne, doit être séverement réprimée par la loi.
  translation_ja: 誰もが有罪と宣告されるまでは無罪と推定される。したがって、逮捕が不可欠だと判断された場合でも、身柄を確保するために必要な限度を超えた厳しい扱いは、法律によって厳しく取り締まらなければならない。

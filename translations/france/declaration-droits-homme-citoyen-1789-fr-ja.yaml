- id: ddhc-a17-text
  section_id: ddhc-a17
  kind: paragraph
  origin: source
  source_text: La propriété étant un droit inviolable et sacré, nul ne peut en être privé, si ce n’est lorsque la nécessité publique, légalement constatée, l’exige évidemment, et sous la condition d’une juste et préalable indemnité.
  translation_ja: 所有権は侵すことのできない神聖な権利であるから、誰もこれを奪われることはない。ただし、公の必要が法律に従って認められ、その必要が明らかにこれを要求する場合に限り、正当な補償をあらかじめ行うことを条件として、所有権を奪うことができる。
  source_languages:
  - fr

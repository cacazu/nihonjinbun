- id: ddhc-a11-text
  section_id: ddhc-a11
  kind: paragraph
  origin: source
  source_text: 'La libre communication des pensées et des opinions est un des droits les plus précieux de l’homme : tout citoyen peut donc parler, écrire, imprimer librement ; sauf à répondre de l’abus de cette liberté dans les cas déterminés par la loi.'
  translation_ja: 思想と意見を自由に伝え合うことは、人間の最も貴重な権利の一つである。したがって、どの市民も自由に語り、書き、印刷することができる。ただし、この自由を濫用したときには、法律の定める場合にその責任を負う。

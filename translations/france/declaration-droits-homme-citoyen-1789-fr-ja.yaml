  translation_status: reviewed
- id: ddhc-a07-text
  section_id: ddhc-a07
  kind: paragraph
  origin: source
  source_text: 'Nul homme ne peut être accusé, arrêté, ni détenu que dans les cas déterminés par la loi, et selon les formes qu’elle a prescrites. Ceux qui sollicitent, expédient, exécutent ou font exécuter des ordres arbitraires, doivent être punis : mais tout citoyen appellé ou saisi en vertu de la loi, doit obéir à l’instant ; il se rend coupable par la résistance.'
  translation_ja: 法律が定める場合に、法律が定めた手続に従うのでなければ、誰も訴追され、逮捕され、拘禁されることはない。恣意的な命令を求めた者、発した者、執行した者、または執行させた者は、処罰されなければならない。ただし、法律に基づいて出頭を命じられ、または身柄を拘束された市民は、誰であれ即座に従わなければならない。これに抵抗すれば、自ら罪を犯すことになる。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791

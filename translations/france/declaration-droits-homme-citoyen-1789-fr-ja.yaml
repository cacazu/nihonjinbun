- id: ddhc-a01-text
  section_id: ddhc-a01
  kind: paragraph
  origin: source
  source_text: Les hommes naissent et demeurent libres et égaux en droits. Les distinctions sociales ne peuvent être fondées que sur l’utilité commune.
  translation_ja: 人は、生まれながらに自由で、権利において平等であり、その後もそうあり続ける。社会における区別は、共通の利益だけを根拠とすることができる。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '2'
    pdf_page: 8
    url: https://archive.org/details/constitutionfran00fran/page/n7/mode/1up
    source_sequence: 4
  source_alignment:
  - source_id: dijon-causse-1791
    original_unit_id: causse-ddhc-a01-text
  translation_status: reviewed
- id: ddhc-a02-heading
  section_id: ddhc-a02
  kind: heading
  origin: source
  source_text: II.
  translation_ja: 第2条
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '2'
    pdf_page: 8
    url: https://archive.org/details/constitutionfran00fran/page/n7/mode/1up
    source_sequence: 5
  source_alignment:
  - source_id: dijon-causse-1791
    original_unit_id: causse-ddhc-a02-heading
  translation_status: reviewed
- id: ddhc-a02-text
  section_id: ddhc-a02
  kind: paragraph
  origin: source
  source_text: Le but de toute association politique est la conservation des droits naturels et imprescriptibles de l’homme. Ces droits sont la liberté, la propriété, la sûreté et la résistance à l’oppression.
  translation_ja: すべての政治的結合の目的は、人間が生まれながらに持ち、時効によっても失われない権利を守ることにある。それは自由、所有、身の安全、そして抑圧に抵抗する権利である。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '2'
    pdf_page: 8
    url: https://archive.org/details/constitutionfran00fran/page/n7/mode/1up
    source_sequence: 6
  source_alignment:
  - source_id: dijon-causse-1791
    original_unit_id: causse-ddhc-a02-text
  translation_status: reviewed
- id: ddhc-a03-heading
  section_id: ddhc-a03
  kind: heading
  origin: source
  source_text: III.
  translation_ja: 第3条
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '2'
    pdf_page: 8
    url: https://archive.org/details/constitutionfran00fran/page/n7/mode/1up
    source_sequence: 7
  source_alignment:
  - source_id: dijon-causse-1791

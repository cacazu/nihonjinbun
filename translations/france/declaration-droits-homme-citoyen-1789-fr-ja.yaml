- id: ddhc-a08-text
  section_id: ddhc-a08
  kind: paragraph
  origin: source
  source_text: La loi ne doit établir que des peines strictement et évidemment nécessaires, et nul ne peut être puni qu’en vertu d’une loi établie et promulguée antérieurement au délit, et légalement appliquée.
  translation_ja: 法律が定めてよい刑罰は、厳密にいって、かつ明らかに必要なものに限られる。犯罪に先立って制定・公布された法律を適法に適用するのでなければ、誰も処罰することはできない。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '3'

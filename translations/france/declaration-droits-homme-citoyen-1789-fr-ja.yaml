- id: ddhc-preamble-01
  section_id: ddhc-preamble
  kind: paragraph
  origin: source
  source_text: Les Représentans du peuple français, constitués en Assemblée nationale, considérant que l’ignorance, l’oubli ou le mépris des droits de l’homme sont les seules causes des malheurs publics et de la corruption des gouvernemens, ont résolu d’exposer, dans une déclaration solemnelle, les droits naturels, inaliénables et sacrés de l’homme, afin que cette déclaration, constamment présente à tous les membres du corps social, leur rappelle sans cesse leurs droits et leurs devoirs ; afin que les actes du pouvoir législatif, et ceux du pouvoir exécutif, pouvant être à chaque instant comparés avec le but de toute institution politique, en soient plus respectés ; afin que les réclamations des citoyens, fondées désormais sur des principes simples et incontestables, tournent toujours au maintien de la Constitution et au bonheur de tous.
  translation_ja: 国民議会を構成するフランス人民の代表は、人間の権利が知られず、忘れられ、あるいは軽んじられていることだけが、社会の不幸と政府の腐敗を招くと考え、厳粛な宣言のうちに、人間が生まれながらに持つ、譲り渡すことのできない神聖な権利を明らかにすることを決議した。この宣言が社会のすべての構成員の心にいつもあり、一人ひとりにその権利と義務を絶えず思い起こさせるためである。また、立法権の行為も行政権の行為も、あらゆる政治制度がめざす目的といつでも照らし合わせることができ、それによってこれらの行為がいっそう尊重されるためである。そして市民の訴えが、今後は明快で異論の余地のない原則に基づき、つねに憲法の維持とすべての人の幸福に役立つためである。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '[1]'
    pdf_page: 7
    url: https://archive.org/details/constitutionfran00fran/page/n6/mode/1up
    source_sequence: 1
  source_alignment:
  - source_id: dijon-causse-1791
    original_unit_id: causse-ddhc-preamble-01
  translation_status: reviewed
- id: ddhc-preamble-02
  section_id: ddhc-preamble
  kind: paragraph
  origin: source
  source_text: En conséquence, l’Assemblée nationale reconnoît et déclare, en présence et sous les auspices de l’Être suprême, les droits suivans de l’homme et du citoyen.
  translation_ja: よって国民議会は、至高の存在の前で、その庇護のもとに、人間と市民の次の権利を認め、宣言する。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '[1]'
    pdf_page: 7
    url: https://archive.org/details/constitutionfran00fran/page/n6/mode/1up

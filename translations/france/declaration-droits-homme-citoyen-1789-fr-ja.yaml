- id: ddhc-a12-text
  section_id: ddhc-a12
  kind: paragraph
  origin: source
  source_text: 'La garantie des droits de l’homme et du citoyen nécessite une force publique : cette force est donc instituée pour l’avantage de tous, et non pour l’utilité particuliere de ceux auxquels elle est confiée.'
  translation_ja: 人間と市民の権利を保障するには、公の強制力が必要である。この力が設けられるのは、すべての人の利益のためであり、その行使を委ねられた者だけの利益のためではない。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791

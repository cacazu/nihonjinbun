- id: ddhc-a13-text
  section_id: ddhc-a13
  kind: paragraph
  origin: source
  source_text: Pour l’entretien de la force publique, et pour les dépenses d’administration, une contribution commune est indispensable ; elle doit être également répartie entre tous les citoyens, en raison de leurs facultés.
  translation_ja: この公の強制力を維持し、行政の費用をまかなうには、共同の負担が欠かせない。この負担は、すべての市民の間で、それぞれの負担能力に応じて、公平に配分しなければならない。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791

  section_id: ddhc-a01
  kind: heading
  origin: source
  source_text: Article premier.
  translation_ja: 第1条
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '2'
    pdf_page: 8
    url: https://archive.org/details/constitutionfran00fran/page/n7/mode/1up

- id: ddhc-a14-text
  section_id: ddhc-a14
  kind: paragraph
  origin: source
  source_text: Tous les citoyens ont le droit de constater par eux-mêmes, ou par leurs représentans, la nécessité de la contribution publique, de la consentir librement, d’en suivre l’emploi, et d’en déterminer la quotité, l’assiette, le recouvrement et la durée.
  translation_ja: すべての市民は、自ら、または代表者を通じて、租税の必要性を確かめ、課税に自由に同意し、その使途を見届ける権利を持つ。また、税額、課税標準、徴収のしかた、課税の期間を定める権利を持つ。

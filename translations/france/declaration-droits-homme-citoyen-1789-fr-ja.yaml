- id: ddhc-a03-text
  section_id: ddhc-a03
  kind: paragraph
  origin: source
  source_text: Le principe de toute souveraineté réside essentiellement dans la nation. Nul corps, nul individu ne peut exercer d’autorité qui n’en émane expressément.
  translation_ja: あらゆる主権の根源は、そもそも国民にある。いかなる団体も、いかなる個人も、国民から明示的に発するものでなければ、何の権限も行使できない。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '2'
    pdf_page: 8
    url: https://archive.org/details/constitutionfran00fran/page/n7/mode/1up
    source_sequence: 8
  source_alignment:
  - source_id: dijon-causse-1791
    original_unit_id: causse-ddhc-a03-text
  translation_status: reviewed
- id: ddhc-a04-heading
  section_id: ddhc-a04
  kind: heading
  origin: source
  source_text: IV.
  translation_ja: 第4条
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '2'
    pdf_page: 8
    url: https://archive.org/details/constitutionfran00fran/page/n7/mode/1up
    source_sequence: 9
  source_alignment:
  - source_id: dijon-causse-1791
    original_unit_id: causse-ddhc-a04-heading
  translation_status: reviewed
- id: ddhc-a04-text
  section_id: ddhc-a04
  kind: paragraph
  origin: source
  source_text: 'La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui : ainsi l’exercice des droits naturels de chaque homme n’a de bornes que celles qui assurent aux autres membres de la société, la jouissance de ces mêmes droits. Ces bornes ne peuvent être déterminées que par la loi.'
  translation_ja: 自由とは、他人に害を及ぼさないことならすべてできることである。したがって、一人ひとりが生まれながらの権利を行使するにあたっての制約は、社会の他の人々にも同じ権利を享受できるようにするためのものに限られる。その制約を定めることができるのは法律だけである。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '2'
    pdf_page: 8
    url: https://archive.org/details/constitutionfran00fran/page/n7/mode/1up
    source_sequence: 10
  source_alignment:
  - source_id: dijon-causse-1791
    original_unit_id: causse-ddhc-a04-text
  translation_status: reviewed
- id: ddhc-a05-heading
  section_id: ddhc-a05
  kind: heading
  origin: source
  source_text: V.
  translation_ja: 第5条
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '2'
    pdf_page: 8
    url: https://archive.org/details/constitutionfran00fran/page/n7/mode/1up
    source_sequence: 11
  source_alignment:
  - source_id: dijon-causse-1791
    original_unit_id: causse-ddhc-a05-heading
  translation_status: reviewed
- id: ddhc-a05-text
  section_id: ddhc-a05
  kind: paragraph
  origin: source
  source_text: La loi n’a le droit de défendre que les actions nuisibles à la société Tout ce qui n’est pas défendu par la loi ne peut être empêché, et nul ne peut être contraint à faire ce qu’elle n’ordonne pas.
  translation_ja: 法律が禁じてよいのは、社会に害を及ぼす行為だけである。法律が禁じていないことは妨げてはならず、法律が命じていないことは誰にも強制できない。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '2'
    pdf_page: 8
    url: https://archive.org/details/constitutionfran00fran/page/n7/mode/1up
    source_sequence: 12
    printed_page_end: '3'
    pdf_page_end: 9
  source_alignment:
  - source_id: dijon-causse-1791
    original_unit_id: causse-ddhc-a05-text
  translation_status: reviewed
- id: ddhc-a06-heading
  section_id: ddhc-a06
  kind: heading
  origin: source
  source_text: VI.
  translation_ja: 第6条
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '3'
    pdf_page: 9
    url: https://archive.org/details/constitutionfran00fran/page/n8/mode/1up
    source_sequence: 13
  source_alignment:
  - source_id: dijon-causse-1791
    original_unit_id: causse-ddhc-a06-heading
  translation_status: reviewed
- id: ddhc-a06-text
  section_id: ddhc-a06
  kind: paragraph
  origin: source
  source_text: La loi est l’expression de la volonté générale. Tous les citoyens ont droit de concourir personnellement, ou par leurs représentans, à sa formation. Elle doit être la même pour tous, soit qu’elle protege, soit qu’elle punisse. Tous les citoyens étant égaux à ses yeux, sont également admissibles à toutes dignités, places et emplois publics, selon leur capacité, et sans autre distinction que celle de leurs vertus et de leurs talens.
  translation_ja: 法律は一般意志の表明である。すべての市民は、自ら、あるいは代表者を通じて、法律の制定に加わる権利を持つ。法律は、人を保護するときも処罰するときも、すべての人にとって同じでなければならない。すべての市民は法律の前に平等であり、その能力に応じて、あらゆる栄職、地位、公の職務に等しく就く資格がある。その人の徳と才能のほかに、区別を設けてはならない。
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '3'
    pdf_page: 9
    url: https://archive.org/details/constitutionfran00fran/page/n8/mode/1up
    source_sequence: 14
  source_alignment:
  - source_id: dijon-causse-1791
    original_unit_id: causse-ddhc-a06-text
  translation_status: reviewed
- id: ddhc-a07-heading
  section_id: ddhc-a07
  kind: heading
  origin: source
  source_text: VII.
  translation_ja: 第7条
  source_languages:
  - fr
  source_locations:
  - source_id: dijon-causse-1791
    precision: page
    printed_page: '3'
    pdf_page: 9
    url: https://archive.org/details/constitutionfran00fran/page/n8/mode/1up
    source_sequence: 15

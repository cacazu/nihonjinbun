  "translation_ja": "会沢正志に至っては、特に書物を著して、堂々と宣長の説に反論した。正志は東湖と並ぶ水戸派の優れた学者であるが、世間は東湖ほどには知らない。名は安、字は伯民、通称は恒蔵、正志斎と号した。宣長が亡くなったころ、ちょうど成人した。生まれつき学問を好み、東湖の父幽谷の門に入り、その高弟となった。彰考館の写字生から身を起こし、ついに彰考館総裁となり、後にはさまざまな職に転じた。常に東湖らと国事に奔走し、文久3年に亡くなった。82歳であった。著作には『孝経考』1巻、『読直毘霊』1巻、『読葛花』1巻、『新論』2巻、『正志斎雑録』1巻などがある。常に水戸流の神道を信奉しており、その説に、「天地が分かれ、初めて人々が生まれてから、天の子孫が四海に君臨し、一つの姓が代々続き、いまだ一人として皇位を狙う者がなく、今日に至ったのは、どうして偶然であろうか。君臣の義は天地の大義であり、父子の親愛は天下の至恩である。大いなる義と深い恩が天地の間に並び立ち、次第に浸透し蓄積して、人々の心に行き渡り、永く変わらない。これが帝王の天地を治め、万民を統べる大きな資源である。昔、皇祖が初めて大きな基礎を築いた。位は天位、徳は天徳であり、それによって天の事業を営んだ。大小の事柄の一つとして天に属さないものはない。徳を玉に、明智を鏡に、威厳を剣になぞらえ"

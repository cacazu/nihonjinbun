  "translation_ja": "さらに、その道とは何かを述べなければならない。宣長はまず「道」という文字を解して、「美知（みち）は御路（みち）であり、知（ち）というのがもとの語である。今も山路（やまぢ）・野路（のぢ）・舟路（ふなぢ）・通い路などの路を、知（ち）とだけいうことから分かる。それに美（み）を添えて美知（みち）というのであ"
  "translation_status": "reviewed"

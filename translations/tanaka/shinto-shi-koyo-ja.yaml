  "translation_ja": "これらの宗教的神道が民間に勢力を広げると同時に、中流以上の社会では、本居・平田の一派の神道が大きな勢力を占め、明治維新の大事業とともに神仏習合の弊害を打ち破り、大いに固有の大道を明らかにした。このとき明治天皇は大詔を発し、「今や天運がめぐり、あらゆる制度が一新された。政治と教化を明らかにし、神ながらの大道を宣揚するべきである」と仰せになった。続いて教部省は三箇条の教則を頒布した。第一条、敬神愛国の趣旨を体得すること。第二条、天理人道を明らかにすること。第三条、天皇を敬い、その意を体して、朝廷の旨を遵守すること。この三つである。当時はまだあらゆることが緒につかず、制度もさまざまに変化したが、明治15年に神官と教導職の兼務が禁じられた。そのため、従来宗教的な傾向を持っていた教派は、それぞれ別派として独立し、固有の大道に基づいて宗教界で大きく活動しようとするに至った。伊勢では大宮司田中頼庸が本官を辞して神宮教の管長となり、出雲大社を中心とする大社教も独立した。黒住教はすでに明治9年に独立していたが、前に述べた長谷川角行が唱え始めた富士講は、明治になると二派に分かれ、一つは実行教、一つは扶桑教となった。別に平山省斎は大成教を起こし、芳村正秉は神習教を立てた。下山応助が唱えた、御嶽神社を信仰の中心とする御嶽教は、もとは大成教に属し"
  "translation_status": "partial"

  "source_text": "天明七年、紀伊侯より政治經濟の事を問はれ、先きに著はせる玉匣と共に、新に候の爲に「秘本玉匣」を著はして奉れり。是れより、屢〻和歌山に赴き、紀伊侯の爲に道を講じ、內にありては門人日に進み、厚く之れが教育に從事せり。かくて寛政十年に至り、「古事記傳」全く成りぬ。彼れ自ら曰はく、「古事記傳」も、當月十三日全部四十四卷、卒業。草稿本書立申候。明和四年より書はじめ、三十二年にして終申候。命の程を危く存候處、皇神の御めぐみにかゝり、先存命仕りて生涯の願望成就仕、大悅の至に存候儀に御座候。(與荒木田久老書)と。實に「古事記傳」四十四卷の洪著は、宣長終生の大業、研究考覈、苦辛慘憺、博く諸書に渉り、深く群籍を獵り、識見卓拔、實に古道學の寶典たるに足る。かく宣長、苦辛慘憺、研究考覈せしかば、その博學宏才、實に天下を驚倒せしめたり。享和元年九月二十九日歿す。年七十二。著はす所、五十部、百三十餘卷に達せり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 21
    "url": "https://dl.ndl.go.jp/pid/943545/1/22"
    "printed_page": "34"
    "printed_page_end": "35"
  "translation_ja": "天明7年、紀伊侯から政治と経済について尋ねられ、先に著した『玉匣』とともに、新たに侯のために『秘本玉匣』を著して献上した。それからたびたび和歌山へ赴き、紀伊侯のために道を講じた。地元では門人が日ごとに増え、厚く教育に努めた。こうして寛政10年に、『古事記伝』がすべて完成した。宣長は、「『古事記伝』も、今月13日に全44巻を完成し、草稿を書き上げました。明和4年に書き始め、32年かかって終えました。寿命がもつか心配しておりましたが、皇神の恵みにより、まずは存命のうちに生涯の願望を成就でき、たいへん喜んでおります」（荒木田久老への書簡）と述べている。実に『古事記伝』44巻の大著は、宣長の生涯の大事業であった。研究と考証に苦労を重ね、広く多くの書物を調べ、深く諸文献を探究し、識見は抜きんでていて、まさに古道学の宝典と呼ぶに十分である。こうして宣長は苦労を重ねて研究と考証を行ったので、その博学と大才は天下を驚嘆させた。享和元年9月29日に亡くなり、72歳であった。著作は50部、130余巻に達した。"

  "translation_ja": "正志の後を受けて栗田寛がいる。やはり水戸の出身で、文科大学教授、文学博士であった。明治30年1月26日に亡くなり、65歳であった。その説では、「天地開闢の初め、まだ文字がないとき、皇祖があり、天神があった。皇祖の行うこと、天神のいうことに、万民が従い、それを経由し、それを守っ"

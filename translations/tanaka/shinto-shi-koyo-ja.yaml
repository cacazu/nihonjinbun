- "id": "ssk-p0009-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "家社會の秩序を保存せんことを務むるの結果、忠孝仁義の說に、深遠なる理由を說き得たり。而して今や我が國にありては、人智の發達と共に、固有の神道の形式着色を變ずるの必要を生じたるに當り、儒教盛に傳來せらる。著しく神道に影響し、之れが形式着色に一層の發展を促したる、爭ふべからざるの事實也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 8
    "url": "https://dl.ndl.go.jp/pid/943545/1/9"
    "printed_page": "8"
    "printed_page_end": "9"
  "translation_ja": "家社会の秩序を保とうと努めた結果、忠・孝・仁・義の説に深い理由を説くことができた。そして日本で、人知の発達とともに固有の神道の形式や色彩を変える必要が生じたとき、儒教が盛んに伝わってきた。それが神道に著しい影響を与え、その形式や色彩をいっそう発展させたことは、争えない事実である。"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"
    "original_unit_id": "943545_0000009"
    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "家社會の秩序を保存せんことを務むるの結果、忠孝仁義の說に、深遠なる理由を說き得たり。而して今や我が國にありては、人智の發達と共に、固有の神道の形式着色を變ずるの必要を生じたるに當り、儒〓盛に傳來せらる。著しく神道に影響し、之れが形式着色に一層の發展を促したる、爭ふべからざるの事實也。かく儒〓は、神道の發展に貢獻せる所初より少からざりしも、尋いで輸入せられたる佛〓は、之れが發展を一時沮礙せる所ありき。但し此の年代を以つて輸入せられたる佛〓は、深遠な欽明天皇十三年には異論ありる哲學的學說に富み、恰も發達し來れる當時の文明の空氣を呼吸せる急進派或は高襟者流の嗜好に投ぜるのみならず、之れを傳ふるに百濟は王、「是の法は諸法の中に於いて最も殊に勝れたり、解し難く入り難し、周公孔子も尙知ること能はず、此の法能く無量無邊の福徳果報を生じ、乃至:無上菩提を成辨す。譬へば人の意に隨ふ實を懷いて用ひ盡すべき所に逐佛教の影響편 つて情のまゝなるが如し。此の妙法の寳も亦復然り。祈め願つて情にしたがひ乏しき所なし」(日本書紀)と云ひ、且天竺以東の諸國皆之れを禮するの語を附加し、釋迦佛像及び經論等を奉る。先きに輸入せられたる儒〓の崇拜する所のものは天なりと雖も、その天や頗る漠として殆んど拘はる所なし。是れ神道と能く調和し得る所以也。然るに此の佛〓は崇拜すべき對象佛を有せり。而してたとひ神を祭らずとも、能く佛に祈願すれば、無量無邊の福德果報を生じ來るとす。是に於いてか、新奇を好むの人士は、爭ふて佛に歸し、亦神道を奉ぜざるに至れり。是れ神道の發達が著しく沮礙を蒙りたる所以也。當時熱心なる佛〓の信徒たりし、厩戶皇子及び蘇我馬子等は、物部中臣等の神道家を壓倒し、盛に佛〓を興隆せしも、皇子皇位に即かずして薨じ給ひ、蘇我氏亦滅びて、朝廷にも、〓心なる佛〓家を見ざるのみならず、却つて崇佛政治の反動として心を神道に傾けたる政治家の出づる神道史綱要九朝廷の態度"

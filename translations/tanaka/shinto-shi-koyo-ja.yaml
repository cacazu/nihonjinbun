  "source_text": "ぬ。快活的現世的感情の如き、希臘人の間にも大いに之れを認め得べく、發展的膨脹的性格の如き、羅馬人の間にも著しく之れを認め得べし。而かも彼れ等國民は、至中至正にましましたる天照大神の如き、偉大なる人格神を有せざりしが爲に、不幸にも之れを偏して有せしのみならず、その引續ける國運の沈替と共にその偏せるものをも殆んど之れを銷磨し去れり。獨り我が國民はかゝる精神の精を體し華を集め給ひ、所謂かゝる精神の權化とも稱しまつるべき天照大神其の他種々の神聖を有し、それら神聖の行ひ給ひ、示し給ひし事蹟は、一々國民に偉大なる印象を與へ、政治と云はず、宗教と云はず、道徳と云はず、あらゆる國民行爲の規範となり國民依つて以つて云爲し、依つて以つて行動し、益々我が國民的精神を發揮し、我が國家をして啻に亡滅の厄に超然たらしむるのみならず、却つて愈々之れを興隆し、愈々之れを發展し、我が皇運をして天壤と與に無窮ならしむ。かく古來の神聖の事蹟より由來せる國民の云爲行動の根柢となり、規範となる所のものを呼んで神道と云ふ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 6
    "url": "https://dl.ndl.go.jp/pid/943545/1/7"
    "printed_page": "4"
    "printed_page_end": "5"
  "translation_ja": "た。現世的で快活な感情は、ギリシア人の間にも大いに認められ、発展し拡大する性格は、ローマ人の間にも著しく認められる。しかし、それらの国民には、この上なく中正であった天照大神のような偉大な人格神がいなかったため、不幸にもそれらの精神を偏った形で持っていただけでなく、その後の国運の衰えとともに、その偏った精神さえほとんど失ってしまった。ひとり日本の国民だけは、このような精神の精髄を体現し、その華を集められ、いわばその精神の権化と申し上げるべき天照大神、その他のさまざまな神聖な存在を持っている。それらの神聖な存在が行い、示された事績は、一つひとつ国民に大きな印象を与え、政治、宗教、道徳を問わず、国民のあらゆる行動の規範となった。国民はそれに従って言動し、ますます日本の国民的精神を発揮した。それによって、国家を滅亡の災厄から超然とさせるだけでなく、いっそう盛んにし、発展させ、皇室の運命を天地とともに限りなく続かせるのである。このように古来の神聖な存在の事績に由来し、国民の言動の根底となり、規範となるものを、神道と呼ぶ。"

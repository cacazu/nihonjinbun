- "id": "ssk-p0019-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "めて多し。享保中に江戶に遊びて聲名あり。特に內命ありて侍臣某をして從遊せしめて、古書を校せしめ給ふ。居ること數年にして疾を得て京に歸らる。已にして伏見奉行北條遠江守をして、內命を傳へて銀若干を賜ふ。大人嘗て國學校を創立する志ありて。上書して執事に啓するに未だ報あらずして歿せり。其志は遂げざれども、其言は傳ふべし。（玉襷）と。又、曰はく、此翁の著書は、（春滿は著はす所少かさりしも其の大部分は終焉に臨み）故ありて一門人をして皆焚かしめぬ。世に傳れる物少けれども、すべて吾が古學の規則は、此翁に相立初申候(入學問答)と。以つて春滿は嚴格なる意味に於ける古道學の祖となすべき也。彼れ常に曰はく學びの道は、天の下の大路なれば、己ひとり立らむが如くほこるべからず。學ぶ人も師の教なりとてあながちに泥むべからず。(春葉集序と。此の訓陶を受く、その門下豈に偉器なからむや。果して賀茂の眞淵その門に出でぬ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 18
    "url": "https://dl.ndl.go.jp/pid/943545/1/19"
    "printed_page": "28"
    "printed_page_end": "29"
  "translation_ja": "多かった。享保年間に江戸へ出て名声を得た。特に内命があり、侍臣某を従わせて古書を校訂させられた。数年滞在した後、病気になって京都へ帰った。やがて伏見奉行北条遠江守を通じて内命が伝えられ、いくらかの銀を賜った。先生はかつて国学の学校を創立する志があり、上書して執政に申し出たが、返答を得ないうちに亡くなった。その志は遂げられなかったが、その言葉は伝えるべきである」（『玉襷』）。また、「この翁の著書は、事情があって一人の門人にすべて焼かせた〔春満の著作は少なくなかったが、その大部分は臨終に際して焼かれた〕。世に伝わるものは少ないけれども、すべてわが古学の規則は、この翁によって初めて立てられた」（『入学問答』）ともいう。これによって春満は、厳密な意味で古道学の祖とすべきである。春満はいつも、「学問の道は天下の大通りであるから、自分一人が立っているように誇ってはならない。学ぶ者も、師の教えだからといって、むやみに拘泥してはならない」（『春葉集』序）といっていた。この教えを受けた門下に、どうして優れた器が出ないことがあろうか。果たして賀茂真淵がその門から出た。"

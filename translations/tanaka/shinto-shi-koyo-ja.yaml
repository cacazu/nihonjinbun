    "text": "もちにて、荷田の翁に見えそめられしとぞ。(玉襷)と。爾來、荷田の學風を慕ひつゝありしが、遂に享保十八年京師に上り、その門に入りぬ。時に年三十七。荷田門に在學する四年、その篤き〓授を受けしが、偶、春滿歿せしを以つて、元文二年〓に歸り、翌年江戶に出で、玆に初めて古道の學を唱道せり。篤胤曰はく、是は、荷田翁の上を一層高く見解を爲し、始めて古の道を明らかに知らんとするには、코漢意佛意を〓く捨果ざれば、其眞を得がたく、歌を詠も、古言を解釋するにも、凡て古道を明らむべき梯なる由を言ひハシダテサ:誨され候。(入學問答) 60徂徠已に死し、鳩巢亦逝き、東涯新に物故し、さしも旺盛を極めたりし儒林、巨星の連沒に遇ひ、轉た寂寥の觀なき能はず。此の時に膺り、眞淵、千代田城下に高く標榜して古道の學を唱ふ。名聲忽ち遠近を風靡し、俊才爭ふてその門に輻輳す。延享の三年、田安侯召して古學の博士となしぬ。德川伯爵家の「悠然公略傳」に曰はく、賀茂眞淵を徵し侍臣となす。給するに禀米を以つてす。歌書を捜索し日々講論す。啓發する所あり。眞淵國學に長じ、最も萬葉に善し、古風の學者今に至り仰いで泰斗と爲す。(賀茂眞淵翁全集)と0眞淵、田安侯に仕ふること前後十四年、入つては侯に侍し、出でゝは著書に從事し、門人を〓化せしかば、古道大いに起り、藤原宇萬伎、楫取魚、彥、本居宣長、荒木田久老、加藤千蔭等の人才を出しぬ。中に就いて本居宣長を出藍の器となす。宣長は、伊勢松坂の人。享保十五年を以つて生る。父は三四右衞門定利母は村田氏。家初め北畠氏に仕へしが、後下りて商賈となり、定利の當時二個の支店を江戶に置き、巨萬の富を致したりき。然るに幾ばくならずして家道衰へぬ。元文五年定利歿す。時に宣長年僅に十一。義兄三神道史綱要田安侯召して古學の博士本居宣長"

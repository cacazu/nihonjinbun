    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "日本大學〓育學講師東洋大學〓育學講師文學士田中義能先生著新洋裝全冊ま家庭〓育學定價金壹圓四拾錢典寶ノ育〓庭家及校學刊郵稅十二錢+「萬朝報」評家庭教育以て學校教育社會教育などゝ共に一に論述したるものやがて此家庭教育學なり、個の特立したる教育學たらしめんとして、節を分つこと八更に之を二十九章八十九節に分ち宗庭之を系統的〓育の意義由來目的より始めて結婚右舷船舶股收出產哺乳子才决明消防管官情書免育山の任家の数至るまで、極めて微に入り細に亘りて詳述し學げられたる項目の數のろにても四百数十の多きに及び、述論なりすして、死に 。有者に一番衆の、加ふるに口語調評者は此書を一般家庭の珍として推奬するに吝なるものにあらざるなり「東京日日新聞」評兒童の成長後如何なる人物となるかは兒童の遺傳、養如何に關係する所多し自ら一世に卓越せる額官を帶び高位にあるものと雖も其子にして性癖、境通等に基くと雖も亦家庭の教廿二子思能なんなのいちょふとかしらんもの世界にしてるかりなに當間がくてる-新ななかするに對するとをしてもの影響の電池の的「尊心して法律をの人論す子を持つ父母たるもの一讀すべき良書たり布製全一册最科學的〓育學新郵稅定價金壹圓八拾錢金十二錢著者〓量「 系統的西洋教育史」を公にせし人なり此の書は西洋に發達せる思想と教育とを〓東京朝日新聞評究し之を骨肉として更に東体線に日本國有の題題と〓育さん研究し之を精神として「六的〓育學を組成せるものにて、體系の整然たると、議論の穩健なるとは此の書の特色なり哲學雜誌評文學士田中義能氏は篤學の教育家にしては〓育學は純粹に學なりとい27歐洲人の教育學が歐洲國民的彩色の基になれる教育學てある樣最も變當なる學說を持し且つ唱へて居る人である。又氏手、本邦に於ける〓育學も只西洋輪入でなく、其れに國民的精神を着色することを忘れてはならぬといふ意見を持つて居る。是等の意見を本として出來上つたものが則ち本著科學的教育學である。本書は注意の能く行屆いた、諸方面の問題に普くふれて所謂まめに手際に出來て居る本である。行文は最も流暢思想は太だ穩健洗練の文字中に健全の常識が貫いて居るのは氏の特色である。體者は必ずや此に由つて數育學の智識を新にし、且つ豐かならしむることあるを思ふ。田神京東會株社式同文館町保神表"

    "url": "https://dl.ndl.go.jp/pid/943545/1/24"
    "printed_page": "38"
    "printed_page_end": "39"
  "translation_ja": "ことなく、天下は穏やかに治まり、皇位はますます遠く長く伝わってきた。だから、あの外国の名称に倣っていうなら、これこそこの上なく優れた大きな道である。真の道であるからこそ、道という言葉も、道という事立てもないのに、道があったのである」（『直毘霊』）とある。こうして宣長は、日本の上古には大道が厳然と行われていたが、あえてそれを道とは呼ばず、後に外国の文物が輸入され、道という文字の用い方を知って、初めて日本の大道を神の道と名付けたとする（『私淑言』）。それでは、中国やインドの思想を混ぜない、日本固有の大道とは、そもそもどのようなものか。それこそ宣長が全力を挙げて主張した大いなる道である。「この道は、『古事記』『書紀』の二典に記された神代・上代のさまざまな事績の上に備わっている」（『初山踏』）という。さらに次のように述べている。"

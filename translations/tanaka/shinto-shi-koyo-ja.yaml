    "url": "https://dl.ndl.go.jp/pid/943545/1/20"
    "printed_page": "30"
    "printed_page_end": "31"
  "translation_ja": "持ちで、荷田翁に初めてお会いになったという」（『玉襷』）。それ以来、荷田の学風を慕っていたが、ついに享保18年に京都へ上り、その門に入った。37歳のときである。荷田の門で4年間学び、厚い指導を受けたが、春満が亡くなったため、元文2年に故郷へ帰り、翌年江戸へ出て、そこで初めて古道の学を唱えた。篤胤は、「この人は荷田翁より一段高く理解し、初めて古の道を明らかに知ろうとするには、漢意と仏意をすっかり捨て去らなければ真実を得にくく、歌を詠むことも古語を解釈することも、すべて古道を明らかにする事柄であると教えられた」（『入学問答』）という。徂徠はすでに亡くなり、鳩巣も世を去り、東涯も新たに死去して、あれほど盛んだった儒学界は巨星の相次ぐ没落に遭い、寂しさを感じさせずにはいなかった。そのとき真淵は、千代田城下で高く旗を掲げて古道の学を唱えた。名声はたちまち遠近に広まり、優れた人材が争って門下に集まった。延享3年、田安侯は真淵を召し、古学の博士とした。徳川伯爵家の「悠然公略伝」には、「賀茂真淵を招いて侍臣とし、米を俸禄として与えた。歌書を探し求め、日々講論して、啓発するところがあった。真淵は国学に優れ、最も『万葉集』に長じていた。古風を学ぶ者は今に至るまで泰斗として仰いでいる」（『賀茂真淵翁全集』）とある。真淵は田安侯に前後14年間仕え、内では侯に付き従い、外では著作に従事して門人を教化したので、古道の学は大いに興り、藤原宇万伎、楫取魚彦、本居宣長、荒木田久老、加藤千蔭らの人材が出た。その中でも本居宣長は、師を越える器とされる。"

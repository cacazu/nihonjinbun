    "description_ja": "原コマ9「祈」の小字ルビは「ヰノ」と見えるが確読困難。補作せず留保。"
  - "source_id": "ndl-943545"
    "segment_ids":
    - "ssk-p0010-001"
    "description_ja": "訓点の原字配列はdiplomatic異同に保存。原画像の微細字形で判読保留：先祭鎭の右小仮名は「イハヒシヅメテ」に見えるが未確定。應右はシ、議右はス、事右はヲ。"
  - "source_id": "ndl-943545"
    "segment_ids":
    - "ssk-p0010-001"
    "description_ja": "訓点の原字配列はdiplomatic異同に保存。原画像の微細字形で判読保留：公卿百官から意までの返り点は小さく、以直下に二が判読可能だが再確認推奨。／敬奉に付く二の正確な基字は画像では敬の左下にも見え、奉に付した位置は要再確認。"
  - "source_id": "ndl-943545"
    "segment_ids":
    - "ssk-p0012-001"
    "description_ja": "訓点の原字配列はdiplomatic異同に保存。原画像の微細字形で判読保留：娶二に対応する一は判読不明。本文字形とルビは翻訳担当の原寸12-ruby画像照合に委ねる。"
  - "source_id": "ndl-943545"
    "segment_ids":
    - "ssk-p0018-001"
    "description_ja": "原画像に「精粕」とある。通常の「糟粕」へ原文を改変せず、文意を残滓と訳した。"
  - "source_id": "ndl-943545"
    "segment_ids":
    - "ssk-p0023-003"
    "description_ja": "原画像切出し23-left.jpgでは「震且書」「鳴乎」と読める。一般的な語「震旦」「嗚呼」へ無断改変せず、訳は文脈上の中国の書物・愚かさに従った。字形には留保。"
  - "source_id": "ndl-943545"
    "segment_ids":
    - "ssk-p0036-002"
    "description_ja": "欄外見出しは「水道流」。本文が水戸派を論じることから訳は水戸流とした。"
  - "source_id": "ndl-943545"
    "segment_ids":
    - "ssk-p0038-003"
    "description_ja": "原刊「授教」を保持し、職名の文脈から訳は教授とした。"
  - "source_id": "ndl-943545"
    "segment_ids":
    - "ssk-p0040-001"
    "description_ja": "欄外見出し「文次郞」と本文「文治郞」の表記差を保持。"
  - "source_id": "ndl-943545"
    "segment_ids":
    - "ssk-p0040-006"
    "description_ja": "詔文「宣明治教」の初字は独立画像転記で宣と確認。通行文に合わせて宜へ改めず、原刊の字を保持した。訳は訓「シク」に従って「べき」とした。"
  - "source_id": "ndl-943545"
    "segment_ids":
    - "ssk-p0042-005"
    "description_ja": "原画像は「篤胤は本居の先導者となつて」と読める。両者の学問上の前後関係に反するように見えるが、訳で主語関係を修復せず、原文どおりとした。原刊誤記の可能性は残る。"
  - "source_id": "ndl-943545"
    "segment_ids":
    - "ssk-p0043-011"
    "description_ja": "小活字評文は拡大画像を再照合して復元。「憂慮と不快とに捉はれ」等の細字は独立校閲で再点検を要する。"

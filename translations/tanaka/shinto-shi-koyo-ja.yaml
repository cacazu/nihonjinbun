  "source_text": "宗忠と殆んど同時に井上正鐵あり。正鐵は武藏の人、寛政二年を以つて生る。長じて白河家の門に入り遂に一家を成せしかば、信徒日に集る。新說世を惑はすの嫌疑により、伊豆の三宅島に流さる。島民その教を奉ず。嘉永二年二月島中に歿す。年六十。明治維新の後、その信徒等相議して禊教を立せり。幕末の宗教的神道を唱へたるものに、尙川手文治郎あり。竹澤寛三郞あり。又記する所あるを要す。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"

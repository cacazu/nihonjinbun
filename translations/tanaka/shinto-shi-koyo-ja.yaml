  "source_text": "隆正、通稱仲衞、葵園·如意園·佐紀の屋などの號を有せり。姓は藤原、初め野々口と稱し、後、大國と改む。寛政四年江戶に生る。父は秀馨と云ひ津和野藩士たり。文化三年、篤胤の門に入りしも幾ばくならずして父命じて昌平黌に學ばしむ。乃ち業を古賀精里に受けり。己にして以爲らく、我が皇國に生れ皇學を修めずして漢籍を學ぶ、可ならんや。須らく皇學を修め後漢籍に及ぼすべきなりと。文化七年昌平黌を辭し、四方に遊學せり。已にして父老い家を嗣き藩の大納戶武具役となりぬ。會、同僚私をなすものあり。隆正禍の及ばんことを虞れ、乃ち亡命す。以後身を專ら學業に委ね、造詣甚だ深し。天保七年播磨の小野藩に聘せられ、歸正館を起し一藩の子弟を教育せり。當時一儒「駁本居翁書」なるものを著はし宣長の說を攻擊す。隆正乃ち門人鈴木重胤の請に從ひ「憐駁者」を著はし、更に之れを反駁せり。曰はく、ある儒生外國の聖賢を虛譽するあまり、「駁本居翁書」と題せる書を筆"
  "source_languages":

  "source_text": "くその卓見に服し、敬慕措かず。遂にその門に入らんとす。而かも紹介を托するものなし。人あり、村田春門の宣長が門人たるを告ぐ。乃ち春門を介して入門せんことを求む。春門快諾、書を松坂に致して、信友の名簿を送り、且つその志を告ぐ。時に享和元年にして恰も宣長の歿せる後たり。嗣子大平信友の志に感じ、名簿を靈前に供へ門人に列す。當時信友年二十九、已に著書に着手し、以後年として殆んど二三種の稿を脫せざるはなかりき。文政四年に至り、病により仕を辭し、是れより全く學者の生活に入り、日夜書齋に蟄居し、社交を絕ち、書籍堆積の間に端坐し、深更に至るも筆を措かず。專ら著書研學に從事し、嚴寒酷暑と雖も一日も之れを廢せず。吾人此れ等の點に於いて遙に英吉利のスペンサーを聯想す。殊に信友が攝生の道を重んぜしは、全くスペンサーと一致せり。信友甞て杉田玄伯に攝生の道を問ふ。玄伯七不可を書して答ふ。七不可とは何ぞ、曰はく、「昨日非不可恨悔明日是不可慮念。飮與食不可過度非正物不可苟食。無事時不可服藥。賴壯實不可過房勤動作不可好安」と。信友之れを得て深く喜び、能く之れを守りたりと云ふ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 29
    "url": "https://dl.ndl.go.jp/pid/943545/1/30"
    "printed_page": "50"
    "printed_page_end": "51"
  "translation_ja": "くその卓見に感服し、敬慕してやまなかった。ついに門下へ入ろうとしたが、紹介を頼める人がいなかった。ある人が、村田春門が宣長の門人だと教えた。そこで春門を介して入門を求めた。春門は快諾して松坂へ手紙を送り、信友の名簿と志を伝えた。享和元年、ちょうど宣長が亡くなった後であった。嗣子の大平は信友の志に感動し、名簿を霊前に供えて門人に列した。当時信友は29歳で、すでに著述に着手しており、それ以後は、ほとんど毎年2、3種の原稿を完成した。文政4年に病気で職を辞し、それからまったく学者としての生活に入った。昼夜書斎に閉じこもり、交際を断ち、書物の山の中に端座して、夜更けになっても筆を置かなかった。専ら著作と研究に従事し、厳しい寒さや暑さにも、一日もやめなかった。こうした点で、はるかイギリスのスペンサーを連想させる。特に信友が養生を重んじたことは、スペンサーとまったく一致する。信友はかつて杉田玄伯に養生の道を尋ねた。玄伯は「七不可」を書いて答えた。七不可とは、「昨日の過ちを恨み悔いてはならない。明日のことを思い煩ってはならない。飲食は度を越してはならない。まともでない物をむやみに食べてはならない。異常のないときに薬を飲んではならない。壮健さを頼んで房事を過度にしてはならない。よく身体を動かし、安逸を好んではならない」というものである。信友はこれを得て深く喜び、よく守ったという。"
  "translation_status": "reviewed"

  "source_text": "かりて立てるものは、山崎闇齋その人也。谷重遠曰はく、「伊勢流『日本紀』に口傳なし。只字面を談ずるのみ。埀加後に卜部の說を聞き、其の傑れる者を擧げ、之れを信守に訂す。信守反つて腹立て聽かず。又、伊勢の明說を擧げて、之れを吉川惟足に質す。惟足亦絶然たり。各〻自ら賛して他人の說を聞かず。是れ其の弊、久し矣。埀加社の神道、大いに諸說に勝るものは、他なし。偏主なき也。忌部流之れを石手帶刀に聞き、卜部流之れを祝吾に聞き、復之れを土津に質す。伊勢流之れを信守及び大宮司精長に聞き、加茂說之れを梨木(祐之)に聞き、諸家の秘を集むる此の如し。實に千金の義也」秦山集)と。かく集大成を務めたる闇齋の說果して如何。彼れ曰はく、「唯一之神道と云事は、異邦の教を習合せざるのみを云に非ず。天人唯一之道と云名目也。天地と人と全く一と云事也」と。以つて我が神道哲學の根柢を得來り、而して實踐哲學の方面に於いては、日神の道なるものを說けり。即ち彼れは日神即ち天照大神を以つて、至大至高の德を有し、全く天御中主尊と同じ德を保ち給ふと雖も、而かも人體を有し給ふ。是れ此の大神が、人類萬世の師表となられ給ふ所以也となし、而して此の道は人々の具有する所なりとし、曰はく、「道と云は、人々の心に備はりたる天然也、人は天の下の神物と云も是故也。其道を備へても、自ら知らざれば詮すべなし」(天津神籬磐境極秘書)と。已に道は人々具有すと雖も、自ら知らざれば詮すべなし。是に於いてか教を要す。故に又曰はく、「神道は天人唯一にして、道は日神の道、教は猿田彥の導き給ふ處、土金の教天人を貫く敬の至り也」(同上)と。かくて彼れは宋儒の說を取り來りて其の神道を說けり。"

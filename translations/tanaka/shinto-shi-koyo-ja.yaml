  "source_text": "ことなく、天下は穩に治まりて、天津日嗣いや遠長に傳はり來坐せり、さればかの異國の名にならひていはゞ、是ぞ上もなき優れたる大き道にして、實の道なるが故に、道てふ言なく、道てふことなけれど、道ありしなりけり。(直毘靈)と。かくて、彼れは我が上古に大道は嚴として行はれしと雖も、而かも敢へて之れを道と稱せず。後、彼れの文物輸入せられ、道なる文字の用ひらるゝ場合を知り、初めて我が大道に名くるに神の道を以つてせりとなせり私淑言)。然らば則ち、支那·印度の思想を混入せざる我が固有の大道なるものは、抑も如何なるものぞ。是れ宣長の全力を擧げて主張せる所の大いなる道也。彼れは曰はく、此道は、『古事記』·『書紀』の二典に記されたる、神代·上代の、もろ〳〵の事跡のうへに備はりたり。(初山踏)と。更に曰はく、"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"

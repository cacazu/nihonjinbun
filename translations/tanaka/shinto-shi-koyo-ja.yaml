    "text": "=らるゝ天御中主神は無限遍在にましませば、至る所として、此の神のまします所ならざるはなし。從つて平田篤亂は此の大神はしも、無始より座しませば、最第一の神に座すこと申すも更にて、其の御功德の廣く大きなること、稱へ申すべき詞もなしと知るべしと說ける也。此の大神の高大無邊なる御德は、高皇產靈神、神皇產靈神二神によりて顯現せらる。從つて森羅萬象の生々發展、皆此の二神の恩賴によらざるはなし。以上三神は、大宇宙、大自然を本體とせらるゝ神にましませば、勿論我が國のみの神にましまさず。實に世界的にまします也。神道は此の三神を淵源とす。以つて神道の本質の普遍的なるを知るべし。古傳は更に進んでアシカビヒコヂノ蓋し現當世界の萬物の最初の神也。可美章牙彥勇神のなりませるを傳ふ。それより種々の神聖を經て天照大神の出現を仰ぐに至る。天照大神は伊弉諸伊弉冊二神の貴子にましまして、人身を有し給ひ、而して能く天御中主神の高大無邊なる御德を備へ給ふ。故に古傳は光華天照大神明彩六合の內に照徹しましませりと傳ふ。所謂人道としての神道、實に大神にま創る。大神は耶蘇基督の如く、その生、その死の悲慘なるなし。釋迦牟尼の如く六年の苦修練行、五十年の宣〓說法なし。孔子、ソクラテースの如く不過なし。是れ大神の云爲行動、終始一貫、理想的の中正にあるが故也。實に大神の御德は、至中至正、至大至高、孔子の門人は、夫子は日月の如しと云へり。大神の御德は實に天日也。天照と云ひ、大日孁貴と云ふ。偉なる哉。天照大神の御德は、以下諸神聖に傳はり、天下の百姓に及ぶ。玆に秩序的統一的思想、現世的快活的感情、發展的膨脹的性格となる。之れを我が國民的精神と云ふ。かゝる思想、かゝる感情、かゝる性格は、天御中主神の御德を蒙れる世界人類普く有せざるべからざる所の者たり。從つて秩序的統一的思想の如き、支那國民も著しく之れを有せり。而かも彼れにありては、古代に於いて已に禪讓放伐の如き擧によりて、殆んどその根本を破壞し畢り神道史綱要〓我が國民的精神"

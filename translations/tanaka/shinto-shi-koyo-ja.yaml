  "source_text": "の國とせるには反對し、之れを北極の上空なりとし、又太陽なりと主張せり。次に宣長は夜見國を以つて支那の黄泉と同一視し、死して靈魂の赴く所と解せり。然るに篤胤は、人の靈魂の赴く所は幽冥にして、古傳の夜見國は月球なりとなしぬ。かくて篤胤は、太陽は高天原にして、天照大神之れを統治し、地球は皇孫命の統治せらるゝ御國也。月球は即ち夜見國にして、素盞鳴尊の統治せらるゝ所となしぬ。以つて彼れは宣長の未だ手を附けざりし、西洋天文の說を取り來りて茲に地動說をも唱へぬ。曰はく、天つ日は高く上に位を定めて動き轉ることなく、地は元よりのまゝに漂旋り、月泉は地の底に成りて、もと地に漂ひ旋れる物なるけにや、斷れ離れて後もその如く、地に屬て旋ること今の現に見るが如し。これ等のことすべて神の產靈の奇く妙なる理によりて然るなれば、更に人の小き智をもて、とかく測識るべき限にあらず。(靈能眞柱)ど。かくして彼れは當時一部の學者の間に漸く盛に行はれ來れる西洋の學理を應用して、その學說を構成し、而して是れ皆我が眞の古傳なりとなしぬ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 27
    "url": "https://dl.ndl.go.jp/pid/943545/1/28"
    "printed_page": "46"
    "printed_page_end": "47"
  "translation_ja": "の国としたことには反対し、北極の上空だとし、また太陽であると主張した。次に宣長は夜見国を中国の黄泉と同一視し、死後に魂が赴くところと理解した。しかし篤胤は、人の魂が赴くところは幽冥であり、古い伝承の夜見国は月であるとした。こうして篤胤は、太陽は高天原で、天照大神が統治し、地球は皇孫命が統治する国であり、月は夜見国で、素盞鳴尊が統治するところだとした。そのため、宣長がまだ手を付けなかった西洋天文学の説を取り入れ、地動説も唱えた。「天の太陽は高いところに位置を定め、動き回ることはない。地はもとからのまま漂い巡り、月泉（つきよみ）は地の底にできて、もともと地とともに漂い巡るものであったためか、切り離された後も同じように地に付いて回ることは、今現実に見るとおりである。これらはすべて、神の産霊の不思議で微妙な理によってそうなっているので、到底人の小さな知恵であれこれ測り知れるものではない」（『霊能真柱』）という。こうして篤胤は、当時一部の学者の間で次第に盛んになっていた西洋の学理を応用して学説を構成し、それをすべて日本の真の古伝であるとした。"
  "translation_status": "reviewed"

- "id": "ssk-p0021-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "定治家を嗣ぐ。寳曆元年定治亦歿す。宣長乃ち家を嗣ぐことゝなりぬ。時に年二十二。當時宣長が一家の狀態を見るに、江戶の支店は已に閉ぢ家產としては親戚小津氏に托したる四百金の利子あるのみ。宣長の母以爲らく、跡つぐ彌四郞（宣長の幼名）あきなひのすぢにはうとくて、たゞ書を讀むことをのみ好めば、今より後商人となるとも事ゆかじ。又家の資も隱居家(小津氏)の店衰へぬればゆくさきうしろめたし。若かの店事あらむにはわれ等何を以つてか世を渡らむ。かねて其心づかひせではあるべからず。然れば彌四郎は、京に上りて學問をしくすしにならんこそよからめ。(家の昔物語)と。宣長乃ち寳曆二年を以つて京師に上り、儒堀景山の門に入り、先づ儒學を修め、同四年典藥武川幸順に就き初めて醫學を學べり。かくて宣長偶、契沖の「百人一首改觀抄」、「古今餘材抄」、「勢語臆斷等の書に接し、茲に古學研究の志を起しぬ。宣長年二十八、松坂に歸り、醫を開業せり。當時彼れ又眞淵の「冠辭考」を得、益々古學神道研究の志を深うし、更に「冠辭考」を熟讀するや、愈、眞淵に接せんの希望を起しぬ。乃ち記して曰はく、かへす〳〵讀み味ふほどに、いよ〳〵心ざし深くなりつゝ此大人をしたふ心、日にそへてせちなりし。(玉勝間)と。偶〻眞淵松坂に來るに會し、初めて刺を通ずるを得たり。眞淵一たび見て宣長の偉器たるを認め、胸襟を開いて之れと道を語り、江戶に歸るや、門弟子を集めて宴を設け、賢才を得たるを祝したりと云ふ。勿論、宣長、江戶に出でゝ眞淵に朝夕親炙する能はざりしと雖も、爾來、文書を以つて盛に交通し、眞淵の指導の下に熱心研究に從事し、一方に於いては終生の大業たる「古事記傳」を編纂すると同時に、「直日靈」、葛花、「馭戎慨言、「玉匣」等幾多有益なる著書を公にせり。"
  "source_languages":

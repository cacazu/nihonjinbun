  "source_text": "篤胤、資性豪悍不屈、甞て道を說き道を學ぶものは、人の信ずると信ぜぬとに少しも心を殘さず獨立獨行眞の道を學ぶと云へり。されは、宣長が歿後の門人となり、深く宣長を尊崇せりと雖ども、その學說は、純粹に之れを紹述せるにあらず。今茲にその主なるものを述ぶれば、神道創世の說に於いて、彼れは高皇產靈·神皇產靈二神天地を鎔造せられたりと云ふ宣長の說を遵奉せりと雖も、宣長が高天原を虛空の上"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 26
    "url": "https://dl.ndl.go.jp/pid/943545/1/27"
    "printed_page": "44"
    "printed_page_end": "45"
  "translation_ja": "篤胤は生来、豪胆で不屈であり、かつて、道を説き学ぶ者は、人が信じるか信じないかを少しも気にせず、独立独行で真の道を学ぶといっている。したがって、宣長の死後の門人となり、深く宣長を尊崇していたが、その学説をそのまま継承して述べたわけではない。主なものを述べると、神道の創世説において、高皇産霊・神皇産霊の二神が天地を造ったという宣長の説には従ったが、宣長が高天原を虚空の上"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"

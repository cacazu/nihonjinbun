  "source_text": "て違ふことなきを道と云ひ、教と云ふ。と。かくて彼れは水戶流の特色を帶びて、儒教によりて、神道を說けり。而かも勿論神道を主とせるものにして、「朱髯綠眼の非類」など往々極端の言をなせりと雖も、又「後世學者狹隘の見を懷き、同を合せ、異を兼ぬること能はず」と云ひ、偏狹徒らに他を排斥するを歎せり。以つて其の志の存する所を知るべし。"

    "text": "324.-456序凡そ現代の現象を正確に忠實に理解せんには先づ須らく其の由來を詳にせざるべからず。蓋し現代の現象は、今日忽焉として出で來れるものにあらざれば也。されば苟も我が固有の大道、即ち神道に對し、正確、忠實なる〓究を行はんと欲するものは、亦、應にそが史的〓究を行はざるべからず予や不敏、敢へて自ら揣らず、此の方面の〓究に從事する、年あり。茲に從來〓究せる所の神道變遷の〓"

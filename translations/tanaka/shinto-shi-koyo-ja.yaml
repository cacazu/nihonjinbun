  "source_text": "惟足と同時に度會延佳あり。「神道と云は、上一人より下萬民まで行ふ旦暮の道なり。天神地神より相傳の中極の道を根として行ふ時は、日用の間、神道ならずと云事なし。さして是は神道なりと一々指南に及べき道にはあらず」(大神宮神道或問)と云ひ、又、「中極の道を神道と云事なれば、中道を修行し、正直の御教を信じて、本心に任し、又正しきに從ふて以つて淸淨と爲、惡に隨ふて以つて不淨とすとの神記を恐れて、起居動靜に、心の塵を去り、黑心なく、丹心を以つて、淸淨齋愼、左物を右に移さず、右物を左に移さず、左を左とし、右を右とせよとの御教を守りて、天下の主にてましまさば、天下萬民をあはれみ給ひて、君上の御職分をつくし給ひ、諸臣下は右の御教を守りて忠をつくし、君につかへたてまつり、一國一家上下も、亦かくの如く、父子、夫婦、兄弟、朋友も、彼の御教を守りて、父子、夫婦、兄弟、朋友のすべき道をつくし、士農工商までも、かの御教に順ひて、其の職をつとむるを、左を左とし、右を右とすと申すなり」(同上)と說き、盛に一家の神道を講ぜり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 15
    "url": "https://dl.ndl.go.jp/pid/943545/1/16"
    "printed_page": "22"
    "printed_page_end": "23"
  "translation_ja": "惟足と同時代に度会延佳がいた。「神道とは、上は天皇お一人から下は万民までが行う、朝夕の道である。天神地神から伝わった中極の道を根本として行えば、日常の生活の中に神道でないことはない。特に、これが神道だと一つひとつ指し示すような道ではない」（『大神宮神道或問』）といい、また、「中極の道を神道というのだから、中道を修行し、正直の教えを信じて本心に任せる。また、正しいことに従うのを清浄とし、悪に従うのを不浄とするという神記を畏れ、日常のあらゆる動作において心の塵を去り、悪心なく、真心によって清らかに身を慎み、左の物を右へ移さず、右の物を左へ移さず、左を左とし、右を右とせよという教えを守る。天下の主であるなら、天下の万民を慈しみ、君主としての職分を尽くされる。諸々の臣下はこの教えを守り、忠義を尽くして君主に仕える。一国一家の上下も同じであり、父子・夫婦・兄弟・友人も、この教えを守り、それぞれがなすべき道を尽くす。士農工商に至るまで、その教えに従って自分の職務に励むことを、左を左とし、右を右とするというのである」（同上）と説き、盛んに独自の神道を講じた。"

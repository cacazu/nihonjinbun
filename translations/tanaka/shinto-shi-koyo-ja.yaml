- "id": "ssk-p0023-004"
  "section_id": "main-text"
  "kind": "note_body"
  "origin": "source"
  "source_text": "沼田順義字は道意。樂水と號す。上野の人。夙に儒を學び、更に醫を修めり。壯年明を失ひ、檢校となる。盛に宣長の說を駁せり。嘉永二年十二月十七日歿す。年五十八。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 22
    "url": "https://dl.ndl.go.jp/pid/943545/1/23"
    "printed_page": "36"
    "printed_page_end": "37"
  "translation_ja": "沼田順義、字は道意、号は楽水。上野の人。早くから儒学を学び、さらに医学を修めた。壮年に視力を失い、検校となった。盛んに宣長の説に反論した。嘉永2年12月17日に亡くなり、58歳であった。"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"
    "original_unit_id": "943545_0000023"
    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "〓ウマシミ:り。『古事記』に味御路、『日本紀』に可怜御路とある、是れ神代の古言なり。されば知と云ふも、美知と云ふも同じ事にて、共に通路の意のみにて、其外の義は、上古は更になかりしなり。(私叔言)と。誠に宣長の言の如く、我が上古には凡べての事象に就いて、一般に理論的研究を行ふの風存せざりしを以つて、美知なる語に就いても、具體的なる通路てふ意義の外、抽象的なる道義の觀念は存せざりし也。されば宣長亦曰はく、古の大御世には、道といふ言擧も、コトアグさらになかりき。(直毘靈)ど。然れども人若し宣長がかく道てふ言擧もなかりきと云へるを以つて、直に彼れが上古に於ける道なるものゝ存在を認めざるものとなさば、是れ宣長を誣ふる沼田順義字は道意。樂水と號す。上野の人。夙に儘もの也。彼の沼を學び、更に醫を修めり。壯年明を失ひ、檢校となる。盛に宣長の說を歌せり。嘉永二年十二月十七日歿す。田樂水が、右の年五十八。道てふ言論宣長の言を評して、\"こはきたなき震且書ちふからぶみが中にも、とりわきて鳴乎なるを7のこどものいひ出づる、『老子』となむいへる書のことの葉に似かよひて、民をうまれのまゝにおかんとする妄說なり。それものありてのちにこそ名ちふこともあんなれ。たとひ神代に道ちふ言擧はあらじとも、道ちふ事はなからずやは。(級長戶風)と。かく彼れは宣長が道といふ言擧もなかりきと云へるを、甚しく非難せりと雖も、而かも其の結論の同一に歸せるは、非難の正鵠を失せるものにあらずや。彼の樂水の物ありて然る後名ありとせるは、吾人其の理たるを認む。而かも是れ決して宣長の論據を動かすに足らず。蓋し、宣長が上古に道てふ言擧もなかりきとせるは、樂水の解せるが如く、道なしとせるに非れば也。之れを彼れの言に徵せよ。曰はく、皇國の古は、さる言痛き〓も何もなかりしかど、下が下まで亂るゝ神道史綱要〓"

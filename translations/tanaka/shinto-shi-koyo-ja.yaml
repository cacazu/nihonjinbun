  "translation_ja": "以上が宣長の神道説の概要である。その説は、嫡子春庭、養子大平、門人服部中庸、斎藤彦麿、植松有信、渡辺重名、鈴木朖、城戸千楯、村田春門、藤井高尚らによって盛んに提唱された。特に本居大平は、養子内遠、加納諸平、足代弘訓ら千人余りの門下を育て、まばゆい光彩を放った。なお、宣長の死後に門人となり、国学界で傑出した者が二人いる。平田篤胤と伴信友である。これから少し、この二人について述べよう。"

- "id": "ssk-p0038-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "し、天の仁を體し、天の明に則り、天の威を奮ひ、以つて萬邦に照臨せらる。(新論)と。而して曰はく、神聖既に神道を以つて教を設く。民心を緝收する所以のもの、專ら一より出づ。固より成規あり。而して天に事へ先を祀るの意、之れを後世に傳ふ。民、本に報い、始に反るの義を知る。(同上)と。かくて彼れは、堯舜周孔の道、天祖の彜訓と大いに同じと說けり。是に於いてか、彼れは、佛教を罵りて「神明の邦を變じて、以つて身毒の國となし、中原の赤子を駈りて、以つて西戎の徒屬となす」と云ひ、儒佛的神道を嘲りて、「儒佛を剽竊してその言を緣飾し、以つて口を糊するの資となす」と云ひ、而して我が宣長を攻擊しては、曰はく、本居の翁、數千歲の後に生れ、開闢以來一人も云へることなき無稽の妄說を造言し、數千歲知るものなくして、是を知りたるは己一人のみなりしと思へるか。然らば開闢以來天地闇夜にして、本居に至て始て明なりと云はんか。數千歲本居の道なしと雖も、世道人心に於いて一も闕けたることなかりしに、今新に一箇の道を作り出して何の用をかなさんや。上古より人々離れ得ざるは天下の公道也。古より知るものなく是を離れ居りて害もなかりしを、獨、智を以つて作り出して、數千載の公道と相反するは一己の私言也。(讀直日靈)と。蓋し宣長は力を極めて儒教を排斥せるもの、而して正志は神儒一致を說き、大いに堯舜周孔を尊敬祖述せるもの。その說の一致せざる素よりその所也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 37
    "url": "https://dl.ndl.go.jp/pid/943545/1/38"
    "printed_page": "66"
    "printed_page_end": "67"
  "translation_ja": "、天の仁を体現し、天の明智に則り、天の威厳を奮って、万国を照らし治められた」（『新論』）という。また、「神聖な方々はすでに神道によって教えを設けた。民の心をまとめる方法は、専ら一つの根源から出ており、もとから定まった規則がある。そして天に仕え、祖先を祭る意味を後世に伝えた。民は根本に報い、始めに立ち返る義を知る」（同上）という。こうして、堯・舜・周公・孔子の道は、皇祖の変わらぬ教えと大いに同じだと説いた。そこで仏教を罵って、「神明の国を変えてインドの国とし、中原の民を駆り立てて西方の夷狄の徒とする」といい、儒仏的神道を嘲って、「儒教と仏教から盗んで言葉を飾り、それで口を養う手段とする」という。そして宣長を攻撃して、「本居翁は数千年後に生まれ、開闢以来誰もいったことのない、根拠のない妄説を作り、数千年間誰も知らず、それを知ったのは自分一人だけだと思っているのか。それなら、開闢以来天地は闇夜で、本居に至って初めて明るくなったというのか。数千年、本居の道がなくても、世の道徳と人心には何一つ欠けることがなかったのに、今新しく一つの道を作って、何の役に立てようというのか。上古から人々が離れられないものは、天下の公道である。昔から誰も知らず、それを離れていても害がなかったものを、一人だけ知恵によって作り出し、数千年来の公道と反するのは、一個人の私言である」（『読直日霊』）という。宣長は全力で儒教を排斥し、正志は神儒一致を説いて、堯・舜・周公・孔子を大いに尊び継承したのだから、その説が一致しないのは当然である。"

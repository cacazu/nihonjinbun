  "source_text": "記して、わが神代の古傳說を蔑如せり。門人鈴木重胤之を憤り、辨ぜんことを請ふ。世にかゝる惑の人おほかりと見ゆれば、さる人々にも見せまほしくて、重胤が請にまかせぬるこの「憐駁者」なり。(憐駁者)と。已にして居を京師にトし、帷を下して諸生に教授す。名けて報本學舍と云ふ。是れより諸方の求めに應じて學を講じ、名、關西に振ふ。津和野藩主龜井侯、隆正の博學を嘉みし、諭して藩籍に復せしむ。隆正之れに從ひ、津和野と江戶とに往來し、皇典を以つて藩の子弟を教授せり。明治四年八月十七日東京津和野藩邸に歿す。年八十。著はす所、「本學擧要」二卷、「本教神理說」一卷、「神代校異傳五卷、「憐駁者」二卷、「歌學入門」一卷、「眞誥眞釋」二卷、「古傳通解」九卷、「昇降運轉」一卷、その他數十部あり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 32
    "url": "https://dl.ndl.go.jp/pid/943545/1/33"
    "printed_page": "56"
    "printed_page_end": "57"
  "translation_ja": "記し、日本の神代の古い伝説を軽んじた。門人鈴木重胤が憤り、弁明してほしいと願った。世にはこのように惑う人が多いようなので、そうした人にも見せたいと思い、重胤の願いに従って作ったのが、この『憐駁者』である」（『憐駁者』）という。その後、京都に居を定め、塾を開いて学生に教えた。報本学舎と名付けた。それから各地の求めに応じて学問を講じ、名声は関西に広まった。津和野藩主亀井侯は隆正の博学を喜び、諭して藩籍に復帰させた。隆正は従い、津和野と江戸を往来して、皇典によって藩の子弟を教育した。明治4年8月17日、東京の津和野藩邸で亡くなり、80歳であった。著作には『本学挙要』2巻、『本教神理説』1巻、『神代校異伝』5巻、『憐駁者』2巻、『歌学入門』1巻、『真誥真釈』2巻、『古伝通解』9巻、『昇降運転』1巻、その他数十部がある。"

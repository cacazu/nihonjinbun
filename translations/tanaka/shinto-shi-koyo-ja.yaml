- "id": "ssk-p0018-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "謂陰陽五行家の說、圓頓四教儀の解、唐宋諸儒の精粕にあらずんば、則ち胎金兩部の餘瀝、鑿空鑽穴の妄說にあらずんば、則ち無證不稽の私言。曰はく秘曰はく訣、古賢の眞傳何くにかある。或は蘊或は奧、今人の僞造是れ多しとの誹を免れず。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 17
    "url": "https://dl.ndl.go.jp/pid/943545/1/18"
    "printed_page": "26"
    "printed_page_end": "27"
  "translation_ja": "ところの、「陰陽五行家の説、円頓四教儀の解釈、唐宋の儒者の残滓でなければ、胎蔵・金剛両部の残りかすである。空疎な理屈を穿つ妄説でなければ、証拠も根拠もない私言である。秘伝だ、秘訣だというが、古の賢人の真の伝えはどこにあるのか。深奥だ、奥義だというものの、今の人が偽造したものが多い」という非難を免れない。"
  "translation_status": "partial"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"
    "original_unit_id": "943545_0000018"
    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "云謂陰陽五行家の說、圓頓四〓儀の解、唐宋儲儒の糟粕にあらずんば、則ち胎金兩部の餘瀝、鑿空鑽穴の妄說にあらずんは、則ち無證不稽の私言。曰はく秘曰はく訣、古賢の眞傳何くにかある。或は蘊或は奧、今人の僞造是れ多しとの誹を免れず。此の間にありて統を直に古代に接し、我が固有の神道の正脉を承けて起れるものあり。之を復古神道の一派となす。復古神道の起れるは、正しく古語學の勃興にあり。古語學の勃興は、近畿の二大古語學者によりてその端を發せらる。二大古語學者とは即ち下河邊長流及び契沖是也。長流は大和の人、宇多に生る。本姓小崎氏、母の姓を冐し下河邊氏を稱す。通稱彥六。名は具平、後長流と改む。夙に古語を研究し、造詣甚た深かりき。德川光圀、招きしも應ぜず。乃ち紙筆を與へて「萬葉」の注を求む。果さずして貞享三年六月三日歿す。行年六十三。圓珠庵の契沖は浪華の人、本姓は下川、字は空心。幼にして出家せり。統を古代に接す下河邊長流學儒佛を兼ね、博覽多識、長流と同じく夙に我が古語を研究し、發明せる所多かりき。德川光圀の囑により『萬葉代匠記』を著はし、其他多くの著書をなして斯學に貢献せる所尠からざりき。元祿十四年歿す。年六十二。長流契沖の斯學に致せる功大は則ち大なりと雖も而かも、彼れ等は要するに語學者也。神道學者にはあらず。所謂古道學者とは謂ふべからざる也。初めて古道としての神道を建設したるものは、荷田春滿その人也。春滿、幼名鶴丸。長じて信盛と云ひ、後春滿と改む。稻荷山の神官、荷田宿禰信詮の嫡子也。夙に國學に志し、社務を弟信名に讓り、學者を求めて四方に遊學し。元祿十二年江戶に出で修學十四年。遂に京師に歸り、盛に復古の學を唱へぬ。篤胤記して曰はく、偖その學業の詳なる趣は、幼より學を好み、篤く皇道復古の學に志して、國史、律令、古文、古歌及び諸家の記傳に至るまで、該博通ぜざる所なし。然れども師尙する所なく、而して其自得發明する所極神道史綱要〓荷田春滿"

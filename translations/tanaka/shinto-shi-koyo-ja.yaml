- "id": "ssk-p0008-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "て、子々孫々無窮に傳ふるが如く、又、無窮に傳ふる所のもの也。唯夫れ身體を被ふ所の衣服冠冕は、時代の要求に應じて變遷するが如く、神道の根本の實際界に現はるヽ所、即ち神道の形式着色は、時代と共に種々に變遷するを免れざる也。吾人之れよりその變遷に就いて聊か述ぶる所あるべし。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 7
    "url": "https://dl.ndl.go.jp/pid/943545/1/8"
    "printed_page": "6"
    "printed_page_end": "7"
  "translation_ja": "で、子々孫々に限りなく伝えるように、同じく限りなく伝えるものである。ただし、身体を覆う衣服や冠が時代の要求に応じて変わるように、神道の根本が実生活に現れる仕方、すなわち神道の形式や色彩は、時代とともにさまざまに変化することを免れない。これから、その変遷について少し述べよう。"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"
    "original_unit_id": "943545_0000008"
    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "て、子々孫々無窮に傳ふるが如く、又、無窮に傳ふる所のもの也。唯夫れ身體を被ふ所の衣服冠冕は、時代の要求に應じて變遷するが如く、神道の根本の實際界に現はるヽ所、即ち神道の形式着色は、時代と共に種々に變遷するを免れざる也。吾人之れよりその變遷に就いて聊か述ぶる所あるべし。西洋にては已に古代に論理學の如きの研究を見たりと雖ども、我が古代は言擧せぬを以て國風とせしかば、神道にも特に言論を立てざりき。而かも、神道は能く我が國民の總べての要求に應じたりしも、朝鮮·支那等との交通漸次頻煩となり、文明益〓發達し來るや、從來の形式着色にては、少年が老人の衣服を用ひんとするが如くにて、我が國民の要求を十分に滿足せしむる能はざるに至りぬ。さりとて我が國民には實際界には、豐臣秀吉の如き偉人を見しと雖も、學者には、アリストテレースの如き、カントの如き、組織的頭腦を有せる偉人出でざりき。從つて神道の根本外國思想の影響の上に一大學說を組織し、我が國民の要求を遺憾なく滿足せしむるものなかりき。是に於いてか古來比較的に傑出せる人士は、支那に發達せる學說、印度に發達せる學說、西洋に發達せる學說を取り來りて、之れを神道の根柢の幹枝とし、以つて一の完全なる神道の學說を搆成し、我が國民の總べての要求に應ぜんとせり。かくて最も初めに影響を蒙りたるものは、儒〓也。勿論、儒〓は古の聖帝堯舜の創むる所と稱す。而かも彼れ等は、匹夫を擧げて九五の尊を緒がしめて怪まず。又古の聖王湯武の唱ふる所と云ふ。而かも彼れ等は、君主を伐ちて萬乘の位を奪ひて耻ぢず。君臣の大義、上下の名分、その根本に於いて誤れり。從つて儒〓の思想は、我が神道の根本に對し、些の貢獻する所あらざりし也。唯~彼れ儒〓にありては、たとひ大義名分の根柢は喪へりと雖も、而かも一たび君となり、上となりし所謂聖人は、萬民をして大義を守らしめ、名分を正さしめ、自らの地位を維持し、國神道史綱要管需教の影"

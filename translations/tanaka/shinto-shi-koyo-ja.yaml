    "text": "ニ地を釋迦·藥師·彌陀の三尊としたりし也。而して叡山には、『古事記』に、御未줍年神、又娶天知迦流美豆比賣生子云云次、大山昨神亦名山末之大主神、x +此神者坐近淡海國之日山と云ひ、己に大山昨神鎭坐しませるも、今、玆に山王神を祭り、釋迦の垂跡を大己貴神とし、藥師の埀跡を國常立尊とし、阿彌陀の埀跡を八幡菩薩とし、合して山王權現となしぬ。斯くて此の山王神は、天台の〓義に結び付けられたり。『神社考』の錄する所によるに、山王神は行園に之れを示せりとなせり。即ち明神嘗て行園に〓げて曰はく、「我れを山王と名く。公之れを委すや。三諦即一を表する也。山王の竪の三〓は空假中也。橫の一〓は即一也。王字の橫の三〓は三諦也。竪の一〓又一也。二字三〓にして一貫の象あり、故に我れ立てゝ號となす也。一心三觀、一念三千、亦復是の如し。是を以つて我れ台〓を護持し、國家を鎭護す」と。かゝる傳に基き、山王とは、三諦一境の稱也。三と雖も而かも一。斯れを極理となす。乃ち一實の謂也と云ひ、或は、八百萬の神々は、皆此の三諦一實の妙理に基きて、無窮の化道を施し玉ふと云ふが如き、神道說を構成せり。山王神道に尋いで起りたるものを兩部習合神道となす。之れを兩部神道と云ふ。兩部神道は空海によりて創めらると稱す。然れども山王神道の最澄に於けるが如く、兩部神道が果して空海によりて創められたるものなりや否やは亦一大疑問也。かの『麗氣記』の如き、空海の作と稱し、高野山に秘書として傳はれりとせられたるも、而かも後人の僞作になれるものたるは、諸家の一致する所也。されど此の神道は、山王神道と同じく、神佛一致說の當然に將ち來たすべき結果にして、空海の如き佛〓家によりて、少くともその一端の創めらるべきは、殆んど疑の容るべきなき也。かくて吾人は此の神道も空海によりてその端を發せられ、以後眞言家によりて發展せられたるものとするもの也。而して北畠親房が、我が國は神代よりの緣起、この宗の所說に符合せりと云ひ全く兩部神道神道史綱要五無窮の化道を施し玉"

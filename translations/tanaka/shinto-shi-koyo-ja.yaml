- "id": "ssk-p0016-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "陰陽五行及び宋儒の說を取捨してその學說を構成せり。殊に注目すべきは、彼れが親房·兼良二卿と同じく三種の神器を尊重せることなり。曰はく、「事を云へば三種の靈寶、理を云へば天子の御心也。三種の靈寶は收まりて胸中にあり。胸中は三種の靈寶に現はる」(神代卷家傳聞書)と云ひ、事相より云へば、天照大神の授與せられし以前にはなきも、理より云へば己に存せしとし、曰はく、「其理は、伊弉諾·伊弉冉尊、天瓊戈を得玉ひし所より備はりて、天地自然の靈寶也。それを天照大神の受續給ひて、今三種の神器として御附屬あるぞ。事相を以て御附屬ある事、甚深微妙の義、吾國萬國の最上たる事、此一事に明白也」(同上)と云ひ、進んで「三種は鼎の三足の如し、寔に神道の肝心、王法の樞機、代々の御守りとして國土普き光也」(同上)と說きぬ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 15
    "url": "https://dl.ndl.go.jp/pid/943545/1/16"
    "printed_page": "22"
    "printed_page_end": "23"
  "translation_ja": "陰陽五行や宋代の儒者の説を取捨して学説を構成した。特に注目すべきなのは、親房と兼良と同じく三種の神器を尊重したことである。「事物としていえば三種の霊宝であり、理としていえば天子の御心である。三種の霊宝は心の中に収まり、その心は三種の霊宝に現れる」（『神代巻家伝聞書』）といい、事実の形としては、天照大神が授ける以前にはなかったが、理としてはすでに存在していたとする。そして、「その理は、伊弉諾・伊弉冉尊が天瓊戈を得られたときから備わっている、天地自然の霊宝である。それを天照大神が受け継がれ、今、三種の神器として付託されている。事物の形をもって付託されたことには、非常に深く微妙な意味がある。日本が万国の最上であることは、この一事によって明白である」（同上）といい、さらに「三種は鼎の三本の脚のようなものだ。まさに神道の要、王法の中心であり、代々の守りとして国土にあまねく及ぶ光である」（同上）と説いた。"

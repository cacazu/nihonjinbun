- "id": "ssk-p0037-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "吉凶禍福を擧げて諸れを直毘禍津日二神に附し、淸淨自然を以つて、人道の極致となす。その言頗る辯ずれども、之れを要するに、皆老莊の糟粕。その徒亦自らその說老莊に類するを嫌ひ、乃ち曰はく、「老莊の所謂自然は、猶未だ聖人の道に溺るゝを免れず。吾が所謂自然は、皆神意に本づく」と。特にその弊必ず胸臆に任じ、私智を逞くし、剛愎自ら喜ぶに至るを知らざるのみ。(弘道館記述義)と。以つて宣長等の努むる所は、私智を以つて神代を測るものとし、その學を排斥せり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 36
    "url": "https://dl.ndl.go.jp/pid/943545/1/37"
    "printed_page": "64"
    "printed_page_end": "65"
  "translation_ja": "吉凶禍福をすべて直毘・禍津日の二神に任せ、清浄自然を人の道の極致とする。その言葉はたいへん巧みだが、要するにすべて老荘の残りかすである。その仲間も、自分の説が老荘に似ているといわれるのを嫌い、『老荘のいう自然は、なお聖人の道に溺れることを免れない。私たちのいう自然は、すべて神意に基づく』という。ただ、その弊害が必ず自分の思いに任せ、私的な知恵をほしいままにし、頑固で独りよがりになることを知らないだけである」（『弘道館記述義』）という。このように、宣長らが努めるものは私的な知恵で神代を推し測ることだとして、その学問を排斥した。"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"

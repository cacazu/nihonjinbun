    "url": "https://dl.ndl.go.jp/pid/943545/1/7"
    "printed_page": "4"
    "printed_page_end": "5"
  "translation_ja": "この神道は、古代にすでに非常に強い力を持ち、当時の国民の知識・感情・意志にかかわる要求に応えていた。そこで実生活の世界では、従来日本の道徳に大きな影響を及ぼしてきた儒教が伝わる以前に、国民の道徳となっていた。また、日本の宗教界に非常に大きな力を持った仏教が伝わる以前には、国民に心の安定と生きる拠り所を与える宗教であった。そして畏れ多くも明治天皇陛下が、明治3年正月3日の勅で、「私は謹んで考える。天の神々と皇祖が国家の基礎を立て、皇統を伝え、代々の天皇がこれを受け継ぎ、その事業を継承してきた。祭祀と政治は一致し、民は心を一つにし、上では政治と教化が明らかに行われ、下では風俗が美しかった」と仰せになったように、上古から祭政一致であり、中国の王道・覇道が伝わる以前から、政治の道となっていた。そのほか、神道は国民の実生活のあらゆる方面に力を持っていた。"

- "id": "ssk-p0043-010"
  "section_id": "advertisement"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "哲學雜誌評　文學士田中義能氏は篤學の教育家にして、最も穩當なる學說を持し且つ唱へて居る人である。又氏は「教育學は純粹に學なり」といふ、歐洲人の教育學が歐洲國民的彩色の基になれる教育學である樣に、本邦に於ける教育學も只西洋輸入でなく、其れに國民的精神を着色することを忘れてはならぬといふ意見を持つて居る。是等の意見を本として出來上つたものが則ち本著科學的教育學である。本書は注意の能く行屆いた、諸方面の問題に普くふれて、所謂まめに手際に出來て居る本である。行文は最も流暢、思想は太だ穩健、洗練の文字中に健全の常識が貫いて居るのは氏の特色である。讀者は必ずや此に由つて教育學の智識を新にし、且つ豐かならしむることあるを思ふ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 42
    "url": "https://dl.ndl.go.jp/pid/943545/1/43"
  "translation_ja": "『哲学雑誌』評――文学士田中義能氏は、学問に熱心な教育家で、きわめて穏当な学説を持ち、唱えている人である。また氏は「教育学は純粋に学問である」といい、ヨーロッパ人の教育学がヨーロッパの国民的特色を基礎とするように、日本の教育学も単に西洋から輸入するのでなく、国民的精神を加えることを忘れてはならない、という意見を持つ。これらの考えを基にできたのが、本書『科学的教育学』である。本書は配慮がよく行き届き、多方面の問題に広く触れ、いわゆる丹念で手際よくできた本である。文章はきわめて流暢で、思想はたいへん堅実であり、洗練された文章を健全な常識が貫いているのが氏の特色である。読者はこれによって教育学の知識を新たにし、豊かにするだろう。"
  "translation_status": "reviewed"

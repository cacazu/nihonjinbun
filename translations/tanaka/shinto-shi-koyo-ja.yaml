- "id": "ssk-p0043-006"
  "section_id": "advertisement"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "「東京日日新聞」評　兒童の成長後如何なる人物となるかは兒童の遺傳、性癖、境遇等に基くと雖も亦家庭の教養如何に關係する所多し自ら一世に卓越せる顯官を帶び高位にあるものと雖も其子にして往々不良低能の子を養ひ自ら憂慮と不快とに捉はれつゝあるは現世甚多く實例あり是に於てか家庭教育の問題は實際問題として實に痛切ならずんばあらず本書は著者が之を救濟せんとして公にしたるもの家庭教育の意義範圍目的より說き起して結婚住居妊娠胎教に及び養護論に入りては出產飲食衣服睡眠入浴子守を論じ疾病傳染病看病法を說き智育論に入りて初步の教育家庭教育社會教育を擧げ情育論は尤も痛快に其實際を論じて救濟法に及び意育論は專ら意志の陶冶習慣の養成を說き家庭教育の印象を論じ尙餘論として母の任務家庭教師等の事を論ず子を持つ父母たるもの一讀すべき良書たり"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 42
    "url": "https://dl.ndl.go.jp/pid/943545/1/43"
  "translation_ja": "『東京日日新聞』評――子どもが成長後どのような人物になるかは、遺伝・性癖・境遇などによるが、家庭での教育にも大きく関係する。世に優れた官職に就き、高位にある人でも、その子どもが不良や低能になり、心配と不快な思いにとらわれる実例は、現在の世に非常に多い。家庭教育は実際上、まことに切実な問題である。本書は著者がこれを救おうと世に出したもので、家庭教育の意義・範囲・目的から説き起こし、結婚・住居・妊娠・胎教に及ぶ。養護論では出産・飲食・衣服・睡眠・入浴・子守を論じ、疾病・伝染病・看病法を説く。知育論では初歩の教育、家庭教育、社会教育を挙げる。情育論ではとくに痛快にその実際を論じ、救済法に及ぶ。意育論では専ら意志の陶冶と習慣の形成を説き、家庭教育の印象を論じる。余論として母の任務や家庭教師などを論じている。子を持つ父母が一読すべき良書である。"
  "translation_status": "reviewed"

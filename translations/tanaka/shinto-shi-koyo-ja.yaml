  "translation_ja": "このように儒教は、初めから神道の発展に少なからず貢献したが、その後に輸入された仏教は、一時その発展を妨げた。欽明天皇13年〔ただし、この年代には異論がある〕に輸入された仏教は、深遠な哲学的学説に富み、まさに発達しつつあった当時の文明の空気を吸う急進派や新しがり屋の好みに合っただけではない。それを伝えた百済の王は、「この教えはあらゆる教えの中で最も優れている。理解することも入門することも難しく、周公や孔子にも知ることができない。この教えは限りない幸福と徳と報いを生み、ついにはこの上ない悟りを成し遂げさせる。たとえば、思いどおりになる宝を持ち、必要な用途に応じて自由に使えるようなものである。このすばらしい教えの宝も、また同じである。祈り願えば望みどおりになり、不足するところがない」（『日本書紀』）といい、さらにインドより東の諸国はみなこれを礼拝するという言葉を加えて、釈迦仏像や経論などを献上した。先に輸入された儒教が崇拝するのは天だが、その天はきわめて漠然としていて、ほとんど拘束がない。そのため神道とよく調和できたのである。ところが仏教には、崇拝すべき対象として仏がある。そして、たとえ神を祭らなくても、仏に十分に祈れば、限りない幸福と徳と報いが生まれるとする。そこで新奇なものを好む人々は、争って仏に帰依し、神道を信奉しなくなった。これが、神道の発達が著しく妨げられた理由である。"

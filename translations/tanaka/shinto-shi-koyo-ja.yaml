- "id": "ssk-p0011-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "はかくて大佛を以つて天照大神と同一神靈の表現なりとの鞏固なる信念を懷き給ひ、皇后太子群臣を率ゐ、大佛に對して北面し、「三寳乃奴止仕奉流天皇我命盧舍那像能大前仁奏賜部止奏久」との言を宣ふに至れり。之れを承けて孝謙天皇亦厚く神佛一致の說を信じ給ひ、之れを國民に示し給ひぬ。かく當時の佛教家は最も巧妙なる方法を案出し、神佛一致の說を主張し、先づ朝廷より之れを信じ給はざるを得ざるが如くし、以つて國民に臨めり。國民亦漸く之れを信じ、先の煩悶を脫し、盛に佛教に歸せり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 10
    "url": "https://dl.ndl.go.jp/pid/943545/1/11"
    "printed_page": "12"
    "printed_page_end": "13"
  "translation_ja": "はこうして、大仏を天照大神と同じ神霊の表現であると固く信じ、皇后・太子・群臣を率いて大仏に向かって北面し、「三宝のしもべとしてお仕えする天皇が、盧舎那仏の御前に申し上げます」と宣言するに至った。これを受け、孝謙天皇も神仏一致の説を深く信じ、国民に示された。このように当時の仏教家は、たいへん巧妙な方法を考え出し、神仏一致を主張して、まず朝廷がこれを信じざるを得ないようにし、それをもって国民に臨んだのである。国民も次第にこれを信じ、先の苦悩から抜け出して、盛んに仏教に帰依した。"
  "translation_status": "reviewed"

  "translation_ja": "宣長の著書に触れる"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"
    "original_unit_id": "943545_0000026"
    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "里惣體の道理を、よく心得おくべし。其道理とは、此天地も諸神も萬物も、皆、こと〓〓く其本は、高皇產靈神、神皇產靈神と申す二神の、產靈のみたまと申すものによりて、成出來たるものにして、世々に人類の生れ出で、萬物.萬事の成出るも、皆此御靈にあらずと云ふことなLoされば神代のはじめに、伊邪那岐·伊邪那美二柱の大御神の、國土萬物、もろ〓〓の神だちを生成し給へるも、その本は皆かの二神の產靈の御靈によれるものなり。(玉匣)と。以上述べ來れるが如くにして、宣長は、道の起源は、高皇產靈神·神皇產靈神二神にありて、此の二神の御靈によりて、伊弉諾·伊弉冉二神種々に之れを發展せられ、天照大神その根元大本を示され、その他の諸神祇亦之れが種々の方面を示され、從つて道は神代の事跡に皆備はりて、不足せる所なしとなせる也。以上宣長の神道說の〓要也。其の說は彼れの嫡子春庭、養子大平、門足らざる所なし其の說は彼れの嫡子春庭、養子大平、門人服部中庸、齋藤彥麿、植松有信、渡邊重名、鈴木腺、城戶千楯、村田春門、藤井高尙等によりて盛に提唱せられたり。殊に本居大平の如きは、養子內遠、加納諸平、足代弘訓等一千餘人の門下を養成し、陸離たる光彩を發揮せり。尙宣長の歿後に門人となりて、國學界に傑出せしもの二人あり。之れを平田篤胤及び伴信友となす。吾人是れより進んで聊か此の二人に就いて述ぶべし。篤胤は、秋田の人。安永五年八月二十四日を以つて生る。父は大和田祚胤、母は那珂氏。篤胤はその第四子たり。幼名は正吉、大壑と號し、伊吹の屋と稱す。年甫めて八歲、儒學を藩儒中山靑義に受く。已にして篤胤の生母那珂氏歿し、繼母小野氏入る。篤胤年二十、乃ち郷關を脫し、絕大の志を抱いて江戶に來りぬ。苦學前後五年。偶〓松山の板倉侯の臣平田篤穩に知られ、その養嗣子となり、爾後、學業に專心することを得たり0享和元年篤胤年二十六、初めて宣長の著書に接す。之れを見て深く神道史綱要豐秋田の人宣長の著書に接す"

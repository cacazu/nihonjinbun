  "source_text": "宗教的神道は、吾人の已に述べたる中古の佛教的色釆を帶びたる山王一實神道、兩部習合神道、唯一神道の如き、尙幕末に至るまで勢力を有し來りしが、別に幕府の初期に長谷川角行なるものあり。皇國は萬國の宗國にして、富士は地球の鎭守たりとし、富士講を初めたり。されど富士講には種々の弊害ありしかば、幕府は之れを禁止したり。德川時代にありて、宗教的神道を鼓吹して其の名を知られたるものに、黑住宗忠あり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 38
    "url": "https://dl.ndl.go.jp/pid/943545/1/39"
    "printed_page": "68"
    "printed_page_end": "69"
  "translation_ja": "宗教的神道には、すでに述べた中世の仏教的色彩を帯びる山王一実神道、両部習合神道、唯一神道などがあり、なお幕末まで勢力を持ち続けていた。それとは別に、幕府初期に長谷川角行という人物がおり、日本は万国の宗主国で、富士山は地球の鎮守であるとして、富士講を始めた。しかし富士講にはさまざまな弊害があったので、幕府は禁止した。徳川時代に宗教的神道を鼓吹して名を知られた者には、黒住宗忠がいる。"

- "id": "ssk-p0029-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "申したる云云。(俗神道大意)と說き、尙、自家の神道を古道と云ひ、抑も古道と申候は、何の事もなく古の道と申すことにて、其は天皇祖神のこの天地を御造りなされ候を始め、上代の事實の上に備はり候。眞の道を聊も外國風の說を混へず、純粹なる古意古言を以つて、すなほに說明し、その事實の上にて、天皇命の天下を治め給ふ御政の本をも、人道の本をも知り候學問故、古學と申し、その道をさして古道とは申候事に候。(入學問答)と說けり。彼れが此れ等の言の示すが如く、彼れの神道說は、徹頭徹尾宣長のそれの紹述也。敷衍也。要するに篤胤の學說は、高天原及び夜見國を說くの點に於いて、幽冥を云ひ、未來を論じ、復古神道に大いに宗教的色釆を與へしの點に於いて、深く佛教を研究し、盛に破佛論を唱へしの點に於いて、熱心に諸子百家を研究し、殊に玄道を取り來りて、自家の學說構成の用に供せしの點に於いて、その他種々の點に於いて、宣長學の範圍を逸脫して、一家の見を立せしは吾人の深く注意せざるべからざる所也。就中篤胤が、天御中主神を以つて無始無終の神とし、『古事記』の『成神』を『古史成文』に『有神』に改めたるが如き、然りとなす。篤胤の門に、養子平田鐵胤、生田國秀、佐藤信淵、大國隆正、六人部是香、權田直助、矢野玄道、久保季茲等出で盛に篤胤の說を唱ふ。されど吾人は筆を轉じて伴信友に就いて述べん。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 28
    "url": "https://dl.ndl.go.jp/pid/943545/1/29"
    "printed_page": "48"
    "printed_page_end": "49"
  "translation_ja": "申したのである……」（『俗神道大意』）と説く。さらに自分の神道を古道と呼び、「そもそも古道とは、ほかでもなく古の道ということである。それは天皇祖神がこの天地をお造りになったことをはじめ、上代の事実の上に備わっている。その真の道を、少しも外国風の説を混ぜず、純粋な古の心と言葉で素直に説明し、その事実の上で、天皇が天下を治める政治の根本も、人の道の根本も知る学問であるから古学といい、その道を指して古道というのである」（『入学問答』）と説いた。これらの言葉が示すように、篤胤の神道説は、徹頭徹尾、宣長のそれを継承し敷衍したものである。要するに篤胤の学説が、高天原や夜見国を説く点、幽冥をいい来世を論じて復古神道に大きな宗教的色彩を与えた点、深く仏教を研究して盛んに排仏論を唱えた点、諸子百家を熱心に研究し、特に玄道を取り入れて自分の学説の構成に役立てた点、その他さまざまな点で、宣長の学問の範囲を越えて一家の見解を立てたことには、深く注意しなければならない。特に、天御中主神を始まりも終わりもない神とし、『古事記』の「成神」を『古史成文』では「有神」に改めたことなどがそうである。篤胤の門からは、養子の平田鉄胤、生田国秀、佐藤信淵、大国隆正、六人部是香、権田直助、矢野玄道、久保季茲らが出て、盛んに篤胤の説を唱えた。しかし、ここで筆を転じて伴信友について述べよう。"

  "source_text": "せしも是に至り又獨立せり。此れ等各派に屬せざるものは、子爵稻葉正邦を管長とし神道本局を立せり。然れども之れに屬したる禊教、神理教、金光教、天理教等は久しからずして皆獨立せり。此れ等の宗教局に於いて取扱はるゝ神道に對し、神官神職の方面は、荷田、賀茂、本居平田所謂四大人の教を奉じ、神社に奉仕し、純粹なる固有の大道即ち歷史的宗教的色彩を帶びざる椎神の大道を宣揚せんことを努力せり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 40
    "url": "https://dl.ndl.go.jp/pid/943545/1/41"
    "printed_page": "72"
    "printed_page_end": "72"
  "translation_ja": "ていたが、このとき独立した。これら各派に属さないものは、子爵稲葉正邦を管長として神道本局を立てた。しかし、それに属していた禊教・神理教・金光教・天理教なども、ほどなくすべて独立した。これら宗教局で取り扱われる神道に対し、神官・神職の方面では、荷田・賀茂・本居・平田のいわゆる四大人の教えを奉じ、神社に奉仕し、純粋な固有の大道、すなわち歴史的な宗教的色彩を帯びない神ながらの大道を宣揚しようと努めた。"

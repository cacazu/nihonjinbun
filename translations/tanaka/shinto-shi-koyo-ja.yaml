- "id": "ssk-p0023-003"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "然れども人若し宣長がかく道てふ言擧もなかりきと云へるを以つて、直に彼れが上古に於ける道なるものゝ存在を認めざるものとなさば、是れ宣長を誣ふるもの也。彼の沼田樂水が、右の宣長の言を評して、\"こはきたなき震且書ちふからぶみが中にも、とりわきて鳴乎なるををのこどものいひ出づる、『老子』となむいへる書のことの葉に似かよひて、民をうまれのまゝにおかんとする妄說なり。それものありてのちにこそ名ちふこともあんなれ。たとひ神代に道ちふ言擧はあらじとも、道ちふ事はなからずやは。(級長戶風)と。かく彼れは宣長が道といふ言擧もなかりきと云へるを、甚しく非難せりと雖も、而かも其の結論の同一に歸せるは、非難の正鵠を失せるものにあらずや。彼の樂水の物ありて然る後名ありとせるは、吾人其の理たるを認む。而かも是れ決して宣長の論據を動かすに足らず。蓋し、宣長が上古に道てふ言擧もなかりきとせるは、樂水の解せるが如く、道なしとせるに非れば也。之れを彼れの言に徵せよ。曰はく、皇國の古は、さる言痛き教も何もなかりしかど、下が下まで亂るゝ"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 22
    "url": "https://dl.ndl.go.jp/pid/943545/1/23"
    "printed_page": "36"
    "printed_page_end": "37"
  "translation_ja": "しかし、宣長がこのように道という言挙げもなかったといったことから、ただちに、上古の道の存在を認めていないとするならば、それは宣長を誣いることになる。沼田楽水は宣長のこの言葉を評して、「これは汚らわしい震旦書という中国の書物の中でも、とりわけ愚かな男どもがいい出した『老子』という書の言葉に似て、民を生まれたままの状態に置こうとする妄説である。物があってからこそ名があるのだ。たとえ神代に道という言挙げがなくても、道という事柄がなかったわけではあるまい」（『級長戸風』）という。このように楽水は、宣長が道という言挙げもなかったといったことをひどく非難したが、その結論が同じところに帰着するのは、非難が的を外しているのではないか。楽水が物があってから名があるとするのは、そのとおりだと認める。しかしそれは、決して宣長の論拠を揺るがすに足りない。宣長が上古には道という言挙げもなかったとするのは、楽水の理解とは違い、道がなかったとするのではないからである。宣長自身の言葉で確かめよう。「皇国の古代には、そのような口うるさい教えなど何もなかったが、最も下の民に至るまで乱れる"
  "translation_status": "partial"

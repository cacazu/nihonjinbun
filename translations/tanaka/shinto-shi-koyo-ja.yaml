- "id": "ssk-p0025-003"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "而して說いて曰はく、そも此道はいかなる道ぞと尋ぬるに、天地、おのづからなる道にもあらず、人の作れる道にもあらず、此道はしも、可畏きや、高御產巢日神の御靈によりて、神祖伊邪那岐大神、伊邪那美大神の始めたまひて、天照大御神の受たまひ、たもちたまひ、傳へたまふ道なり。故是以神の道とは申すぞかし。(直毘靈)と。彼の樂水の如きは亦之れを攻擊して曰はく、道は天津理のまゝなるものならば、そのまゝ天御中主尊の御心なり。故天御中主尊の御靈によりてなれりといはむにはさるべきを、高御產巢日神の御靈よりなれりといへるは、いたき誣言なりけり。高皇產靈尊は、現身の神にてわたらせ給ふなり。(級長戶風)と。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 24
    "url": "https://dl.ndl.go.jp/pid/943545/1/25"
    "printed_page": "40"
    "printed_page_end": "41"
  "translation_ja": "そして、「そもそもこの道はどのような道かと尋ねると、天地が自然に成り立つ道でもなく、人が作った道でもない。この道は、畏れ多くも高御産巣日神の御霊によって、神祖伊邪那岐大神と伊邪那美大神が始められ、天照大御神が受け、保ち、伝えられる道である。それゆえ神の道というのである」（『直毘霊』）と説く。楽水のような者は、またこれを攻撃して、「道が天地自然の理のままであるなら、それはそのまま天御中主尊の御心である。だから天御中主尊の御霊によって成ったというならばよいが、高御産巣日神の御霊から成ったというのは、ひどい虚言である。高皇産霊尊は現身の神でいらっしゃる」（『級長戸風』）という。"

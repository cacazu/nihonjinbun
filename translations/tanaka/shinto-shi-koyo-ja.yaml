    "text": "覽天賜文學士本居宣長之哲學田中義能先生著覽天賜@覽天賜@文學士『大阪毎日新聞評』田中義能氏の「平田篤胤之哲學」は、平田篤胤之哲學だ國家と宗教の論の思想の超凡を證せらる的に批評眼を開き宗教〓に至つて殊に生面がある。家-儒佛を超脫して日本的獨自の思想を發揮した-篤胤を活描し來つた著者の勞を多として、此書を推薦す。田中氏の此書は統的思想的に論じたものは記者は未だ見なかつた殆ど初めて位なものであらう。田中義能先生著多方面に能く篤胤の思想を解剖してある。其他になほ百尺竿頭〓一歩ありたいと思ふ處があるが是ま朱子學古學等議家の學說に就いての述作はあるが、@信仰對象論の如き、「神はわが神なりわれは神の人なり」と言つたのなどは最もそ爲胤は本居の先導者さなって開いた獨白的皇學論を一層積極神道國學の人傑を思想上哲學上より評傳した書としては、? -學界思想界の爲に郵洋裝上製全一冊定此書の標榜する所に背かぬ。稅價皇學家をこれほどに系十金此偉大な思想二貳錢圓但道學派の哲學を明にせんとしたり。考證頗る之を努め所論穩健······能く其時代と人との面影を說き得たるを見る。『萬朝報評』本居實長が神道哲學の鼓吹者として將た國學者として、胤之哲學を著して、其熱誠をこめたる忠君愛國說の、やがて維新の鴻業に及ぼせる影響も亦甚だ大ならずんばあらず。著者置に平田篤今又此偉人を說き、學說は勿論進んでその學統に屬する多數學者の諸說をも叙し、所謂復古神我國思想史上の大立物たるは言はずもがな。郵洋裝上製全一冊定價金貳圓拾錢稅十二錢-一ーー-ー神道史綱要神道大意本居宣長之哲學神道本義神道哲學變遷史神道哲學要義平田篤胤之哲學家庭〓育學最新科學的〓育學系統的西洋〓育史田中義能著述目錄新新旣既既既既旣既既刊刊刊刊刊刊刊刊刊刊(國本ナシ) (残本ナシ) (残本ナシ)全全全全全全全全全全ー一一-ー一一一ーー冊冊冊冊冊冊冊冊冊冊座口替所賣發振二店書堂京東田神京東番〇七"

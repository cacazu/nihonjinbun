  "source_text": "熟ら宇宙の現象を觀るに、其の活動は、皆一定の方向に行はれ、盲目的機械的に活動せるものにあらざるが如し。請ふ靜に之れを觀察せよ。日月の運行、四時の循環、百物の生る、皆秩序もあり、統一もあるを知るべし。その他宇宙の美的性質、經濟的構成、是れ皆大生命の顯現、所謂天地の公道の存在を語れるものにあらずや。我が古傳は此の大生命を造化の三神と稱す。曰はく、天御中主神、高皇產靈神、神皇產靈神と。而して天御中主神は高天原即ち天の眞中にまし〳〵て、一切現象の本源にましますと云ふ。蓋し天とは此の大宇宙の謂にして、此の大宇宙を本體とせ"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 4
    "url": "https://dl.ndl.go.jp/pid/943545/1/5"
    "printed_page": "序2"
    "printed_page_end": "1"
  "translation_ja": "宇宙の現象をよく見ると、その活動はすべて一定の方向に進み、盲目的、機械的に活動しているのではないようである。どうか静かに観察してほしい。太陽と月の運行、四季の循環、あらゆる物の生成には、いずれも秩序と統一があると分かるだろう。そのほか、宇宙の美的な性質や経済的な構成も、すべて大いなる生命の現れであり、いわゆる天地に通じる道の存在を語っているのではないか。わが国の古い伝承は、この大いなる生命を造化の三神と呼ぶ。天御中主神、高皇産霊神、神皇産霊神である。そして天御中主神は、高天原、すなわち天の真ん中におられ、あらゆる現象の根源であるという。天とは、この大宇宙をいうのであり、この大宇宙を本体とさ"

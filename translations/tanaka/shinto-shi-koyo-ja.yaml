  "source_text": "佛教的神道の中に就いて、最初のものは山王一實神道也。山王一實神道は僧最澄によりて創めらると稱す。勿論吾人は彼れが後世謂ふ所の山王一實神道を說きたりと謂ふにはあらず。唯〻その端を發したりと謂ふのみ。抑も山王神は元來支那天台山の鎭守也。最澄之れを又叡山に移し祭れるものゝ如し。之れを移すに就いては、「按ずるに日吉神號は、傳教小比叡峯に於いて三光の日輪を見る。釋迦·藥師·彌陀の像を現ず。教その名を問ふ。神告げて曰はく、竪の三點に橫の一點を加ふ。橫の三點に竪の一點を添ふ。言ひ已てその光空に昇つて去る。教、文字に之れを見るに、竪の三點に橫の一點を山字となす。橫の三點に竪の一點を王字となす。高大不動なるものは山也。三才に經緯たるものは王也。是れより遂に崇んで號して山王と曰ふ」(本朝神社考)と云ふが如き說を作り、山王神の本"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 10
    "url": "https://dl.ndl.go.jp/pid/943545/1/11"
    "printed_page": "12"
    "printed_page_end": "13"
  "translation_ja": "仏教的神道のうち、最初のものは山王一実神道である。山王一実神道は僧最澄が始めたといわれる。もちろん、最澄が後世にいう山王一実神道を説いたというのではなく、ただその端緒を開いたというのである。そもそも山王神は、もともと中国の天台山の鎮守である。最澄がこれを比叡山にも移して祭ったようである。その移転については、「考えるに、日吉の神号について、伝教大師は小比叡峰で三光の日輪を見た。それは釈迦・薬師・阿弥陀の姿を現した。伝教がその名を尋ねると、神は『縦の三点に横の一点を加え、横の三点に縦の一点を添える』と告げた。そういうと光は空へ昇って去った。伝教がこれを文字として考えると、縦の三点に横の一点を加えるのは山の字、横の三点に縦の一点を加えるのは王の字である。高大で動かないものが山であり、天地人の三才を縦横に治めるものが王である。そこで尊んで山王と号した」（『本朝神社考』）というような説を作り、山王神の本"

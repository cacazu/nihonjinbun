    "printed_page_end": "序1"
  "translation_ja": "現代の現象を正確に、忠実に理解するには、まずその由来を詳しく明らかにしなければならない。現代の現象は、今日突然に現れたものではないからである。したがって、わが国固有の大道、すなわち神道を正確に、忠実に研究しようとする者は、その歴史も研究しなければならない。私は才に乏しいながら、あえて身の程を顧みず、この方面の研究に長年従事してきた。ここに、これまで研究してきた神道の変遷の概"

- "id": "ssk-p0010-002"
  "section_id": "main-text"
  "kind": "heading"
  "origin": "source"
  "source_text": "國民の煩悶"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"

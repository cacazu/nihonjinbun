    "printed_page_end": "71"
  "translation_ja": "文治郎は備中大谷の人である。人柄はまことに誠実で、42歳のとき重病を患い、一心に神に祈って治癒した。そこでますます信念を強め、ついに神託を受け、天地金乃神を立てて天地の主宰神とし、忠孝と人倫の教えを説いた。これを金光教という。明治16年10月10日に亡くなった。"

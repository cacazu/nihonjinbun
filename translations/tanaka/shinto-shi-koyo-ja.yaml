  "source_variants":
  - "kind": "ocr"
    "text": "명此神道家の說をいやしめ笑ふは、ヾ名のみぞ神道には有ける。されば世の儒者などの、此神道家の說を聞て、神道といふ物は、近き世に作れる事なりとて、いやしめ笑ふは、げにことはりなり。(初山踏)と。かくて宣長は固有の大道を以つて、世の所謂神道なるものとは、全く異るものにして、專ら『記』·『紀』二典に記されたる事跡の上に備はるものとなせり。而して說いて曰はく、そも此道はいかなる道ぞと尋ぬるに、天地、おのづからなる道にもあらず、人の作れる道にもあらず、此道はしも、可畏きや、高御產巢日カムロギ神の御靈によりて、神祖伊邪那岐大神、伊邪那美大神の始めたまひて、天照大御神の受たまひ、たもちたまひ、傳へたまふ道なり。故是以神の道とは申すぞかし。(直毘靈)と。彼の樂水の如きは亦之れを攻擊して曰はく、道は天津理のまゝなるものならば、そのまゝ天御中主尊の御心なり。國史の成跡神の道の意義〓故天御中主尊の御靈によりてなれりといはむにはさるべきを、高御產シヒゴト巢日神の御靈よりなれりといへるは、いたき誣言なりけり。高皇產靈尊は、現身の神にてわたらせ給ふなり。(級長戶風)と。之れは是れ儒〓的天の見解を以つて、宣長の說を駁せるもの。到底俗に所謂水掛論に了らんのみ。蓋し儒〓には多く天を以つて、天帝若くは上帝に解し、之れを萬物の主宰者とす。此の天を以つて、我が天御中主神に配す。絕對的に不可なりと云ふべからざるものあるに似たり。而かも宣長は爾かく解せざる也。彼れは吾人の已に述べたるが如く天御中主神を以つて單に「天眞中に坐々て、世中の字斯たる神(古事記傳)と解し、唯〓宇宙の大綱を取り、其の秩序を維持せらるゝの神とのみ解し、從つて森羅萬象の生々發展するは、產靈二神の御靈によるものとせり。是れ神道の由て來る所を此の二神に歸せる所以也。故に更に曰はく、まことの道の趣を、あら〓〓申さむには、まづ第一に、此世の中の神道史網要四三天と天御中圭得"

  "translation_ja": "私は別の機会にこれを世に紹介したいと思うが、ここではその学説の一端を示そう。重胤は大道について、「祭りを厳かにし、政治を正しくし、天下を整えることこそ、皇祖天神が皇御孫命に授けられた、皇位の職分である。このほかに道はなく、このほかに教えはない。まことに神ながらの大道とはこれである」（『祝詞講義』）という。したがって儒教や仏教は私的な道、私的な教えで、誰も真に実行できない道であるが、この大道は誰でも行うことができ、また行わなければならない道だとした。さらにその大道を、「皇祖天神の定めに従い、わずかな間も離れてはならない道であり、君主は君主、臣は臣、父は父、子は子としてあるべき当然の道をいう。孝徳天皇の『紀』に、『惟神とは、神の道に従い、また自ら神の道を持つことをいう』とあるように、皇祖天神の定めはすなわち天下公正の大道であり、神道に従うとは、これに則ることをいう」（同上）と説明する。そしてさらに詳しく、「天皇であれば、皇祖天神から授けられた委任のままに、天と国の社の神々を祭り、天下の民を慈しみ重んじて万国を治めることを、神ながらの行いと申し上げるべきである。臣下であれば、天皇の行いに背かず、清く明るい心で仕え、政治を助けて天下を安泰にするべきである。また、皇位を限りなく伝えられる間には、たまたま神代の定めに背かれることも、絶対にないとはいえない。もしそういうことがあれば、臣としての道によって諫め申し上げ、君主を君主としてあるべき姿にすることが、臣下の神ながらの美徳というべきである。民としては、何につけても上の御意向に従い、それぞれ神から与えられた家業を守り、衣食住の糧とし、身を修め、徳を行い、世のため、人のために功徳を立てて、助け合い、救い合い、自分を捨てて他人を立て、神ながらの政治が少しでも安らかであるように、ひとときも忘れてはならない。このようにすれば、父子に親愛があり、夫婦に愛敬があって、人の道の極みが、"

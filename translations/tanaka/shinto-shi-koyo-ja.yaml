    "printed_page_end": "53"
  "translation_ja": "信友は天神地祇について、「『神祇令』に『天神地祇はすべて神祇官が通常の定めによって祭る』『天皇が即位するときは、天神地祇をすべて祭る』とある。天神とは天上におられる神、また天からこの国土へ降りておられる神をいう。その天地の八百万の神々の中で、特に由縁のある神々を各国に社を定めて祭られたことは、政治の根本であり、太古からの皇朝の大道である」（『神社私考』）という。このように、諸国に神社を建てて天神地祇を祭ることを皇朝の大道とし、これらの神々についてさまざまな研究を行った。"

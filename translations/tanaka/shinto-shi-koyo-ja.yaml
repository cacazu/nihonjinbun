  "source_variants":
  - "kind": "ocr"
    "text": "六吉凶禍福を擧げて諸れを直里福津日二神に附し、〓淨自然を以つて、人道の極致となす。その言頗る辯ずれども、之れを要するに、皆老莊の糟粕。その徒亦自らその說老莊に類するを嫌ひ、乃ち曰はく、「老莊の所謂自然は、猶未だ聖人の道に溺るゝを免れず。吾が所謂自然は、皆神意に本づく」と。特にその弊必ず胸臆に任じ、私智を逞くし、剛復自ら喜ぶに至るを知らざるのみ。(弘道館記述義)と。以つて宣長等の努むる所は、私智を以つて神代を測るものとし、その學を排斥せり。若し夫れ會澤正志に至りては、特に書を著はして、堂々宣長の說を反駁辯論せり。正志は、東湖と相並び、水戶派の學者の錚々たるものなれども、世、東湖の如く、之れを知らず。正志名は安、字は伯民、通稱恒藏、正志齋と號す。宣長の歿せる當時正に成年に達せり。生れて學を好み、東湖の父幽谷の門に入り、その高第弟子たりき。彰考館寫宇生より、そ會澤正志身を起し、遂に彰考館總裁となり、後種々の職に轉ぜり。常に東湖等と國事に奔走し、文久三年を以つて歿しぬ。年八十二。著書、『孝經考』卷、『讀直毘靈』一度、『讀葛花』一種、『新論』二卷、『正志齋雜錄』一卷等あり。彼れは常に水戶流の神道を信奉せり。その說に曰はく、夫れ天地剖判始めて人民ありてより、天胤四海に君臨し、一姓歷々未だ甞て一人の敢へて天位を覬覦せるものあらず。以つて今日に至るものは、豈に其れ偶然ならんや。夫れ君臣の義は、天地の大義也。父子の親は天下の至恩也。義の大なる者、恩の至れるものと、天地の間に並び立ち、漸漬積累、人心に沿決し、久遠にして變ぜず。此れ帝王、天地を經緯し、億兆を綱紀する所以の大資也。昔は、天祖肇めて鴻基を建つ。位は即ち天位、德は即ち天德、以つて天業を經綸す。細大の事一も天に非るものなし。德を玉に比し、明を鏡に比し、威を劔に比神道史綱要奎"

  "source_text": "かゝる神道は、古代に於いて已に非常なる勢力を有し、當時の國民の知識的·感情的意志的要求に應じたりし也。故にそが實際界に現はれては、從來、我が國民の道德界に非常なる影響を及ぼしたる儒教の傳來前に於ける我が國民の道德となりし也。又、我が國民の宗教界に甚大なる勢力を有したる佛教の傳來前に於ける、我が國民を安心立命せしめし所の宗教たりし也。而して恐くも、明治天皇陛下が、明治三年正月三日、勅を下して、朕、恭惟、天神天祖、立極埀統、列聖相承、繼之述之、祭政一致、億兆同心、治教明于上、風俗美于下。と宣はせたるが如く、上古より祭政一致にして、支那王覇の道の傳來せるより以前に、巳に政治の道となりし也。その他、神道は、我が國民の實際的生活の總べての方面に勢力を有せし也。"
  "source_languages":

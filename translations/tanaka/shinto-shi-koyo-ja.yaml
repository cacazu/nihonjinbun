  "source_variants":
  - "kind": "ocr"
    "text": "圖その學に服し、直に名簿を松坂に送り、その門人たらんことを求む。會宣長歿せしを以つて茲に所謂歿後の門人となりき。是れより全く一身を國學に委ね、研鑽年久しく、遂に欝然一家をなせり。先づ『呵妄書』を著はして、大宰春臺を罵倒し、『鬼神新論』を著はして、儒者を叱斥し、而して後『古史徵』·『古史成文」·『靈能眞柱』等を公にして、進んで積極的に復古神道を天下に唱ふ。天下負笈の士集り來りて其の門に投ず。文政六年著書數部を提げて京師に入り、之れを禁裡及び仙洞に献ず。茲にその著書は天覽叡感の四字を冠し、一層の光輝を放つに至れり。かくて當時有力なりし吉田家は、篤胤を聘して神官の〓授たらしめ、神祇伯白川の資敬王は、篤胤を擢んじて學師の重職に任じぬ。是に至り篤胤の盛名赫々天下に鳴る。秋田藩見て大いに喜び、その歸藩を求む。是れより秋田藩士となれり。既にして篤胤の熱心なる敬神尊王の說は、動もすれば幕府成立の基礎を危くせんとするの虞あり。戰々兢々家康の業を失墜せんこ盛名天下に鳴るとを恐るゝ當路の吏、遂に默する能はず。江戶を追ひ、國に歸らしめ、且つ將來の著書を禁ぜり。天保十四年閏九月十一日篤胤遂に秋田に歿しぬ。年六十八。束脩の門人五百五十餘人。歿後の門人一千三百餘人に及べりと云ふ。著はす所、右に擧げたるものゝ外、『古史傳』三十二卷、『古道大意』二卷、『大道或問』一卷、氣吹壓三卷、『俗神道大意』四卷、『印度藏志』二十五卷、『出定笑語』六卷、『赤縣太古傳』三卷、『西籍〓論』四卷等百有餘部あり。篤胤、資性豪悍不屈、甞て道を說き道を學ぶものは、人の信ずると信ぜぬとに少しも心を殘さず獨立獨行眞の道を學ぶと云へり。されは、宣長が歿後の門人となり、深く宣長を尊崇せりと雖ども、その學說は、純粹に之れを紹述せるにあらず。今茲にその主なるものを述ぶれば、神道創世の說に於いて、彼れは高皇產靈·神皇產靈二神天地を鎔造せられたりと云ふ宣長の說を遵奉せりと雖も、宣長が高天原を虛空の上四五神道史綱要宣長の說に盲從せ"

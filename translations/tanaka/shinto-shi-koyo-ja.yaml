    "text": "〓天明七年、紀伊侯より政治經濟の事を問はれ、先きに著はせる王匣と共に、新に候の爲に「秘本玉匣」を著はして奉れり。是れより、屢〓和歌山に赴き、紀伊侯の爲に道を講じ、內にありては門人日に進み、厚く之れが〓育に從事せり。かくて寛政十年に至り、「古事記傳」全く成りぬ。彼れ自ら曰はく、「古事記傳」も、當月十三日全部四十四卷、卒業。草稿本書立申候。明和四年より書はじめ、三十二年にして終申候。命の程を危く存候處、皇神の御めぐみにかゝり、先存命仕りて生涯の願望成就仕、大悅の至に存候儀に御座候。(與荒木田久老書)と0實に「古事記傳」四十四卷の洪著は、宣長終生の大業、〓究考覈、苦辛慘憺、博く諸書に渉り、深く群籍を獵り、識見卓拔、實に古道學の寶典たるに足る。かく宣長、苦辛慘憺、〓究考覈せしかば、「古事記傳苦辛慘憺、〓究考覈せしかば、その博學宏才、實に天下をを驚倒せしめたり。享和元年九月二十九日歿す。年七十二。著はす所、五十部、百三十餘卷に達せり。宣長は先づ神の意義を以つて、尋常に卓越せる德を有し畏るべき性能モロ〓〓を有せるものとし、古典に見ゆる天地の諸の神だちを初めて、そを祀れる社に坐す御靈をも申し、又人はさらにも云はず、鳥獸木草までも皆かゝる德を有するものは神となしぬ。從つて宣長は神に善惡ありとし、吉凶禍福も之れによりて生ずとなせり。されど彼れの主張にかゝる「神の道」の神なるものは、必ずしも鳥獸草木までも意味する神にはあらざるが如し。故に彼れ曰はく、「皇國の神道は、皇祖神の始め賜ひたもち賜ふ道なり」と。以つて彼れの神の觀念知るべき也。吾人は更に進んでその道なるものに就いて述べざるべからず。彼れは先づ道なる文字を解して曰はく、美知は御路にて、知と云ふが本語なり。今も山路·野路·舟路通ひ路などは、知とのみ云ふを以て知るべし。それに美をそへて美知と云ふな神道史綱要三五年七十二。著はす所、神の意義道の字義"

    "text": "略を記し、小册子となし、聊か斯道研究者日常の便に供せんとす。若し夫れ詳密なる〓究に至りては、予が終生の業、冀くは大方諸賢の高〓を得て、之れが大成を得んことを。大正四年七月東京に於いて著者識神道史綱要:能文學士田中義著熟ら宇宙の現象を觀るに、其の活動は、皆一定の方向に行はれ、盲目的機械的に活動せるものにあらざるが如し。請ふ靜に之れを觀察せよ。日月の運行、四時の循環、百物の生る、皆秩序もあり、統一もあるを知るんbbその他宇宙の美的性質、經濟的構成、是れ皆大生命の顯現、所謂天地の公道の存在を語れるものにあらずや。我が古傳は此の大生命を造化の三神と稱す。曰はく、天御中主神、高皇產靈神、神皇產靈神と。而して天御中主神は高天原即ち天の眞中にまし〓〓て、一切現象の本源にましますと云ふ。蓋し天とは此の大宇宙の謂にして、此の大字宙を本體とせ神道史綱要-造化の三神"

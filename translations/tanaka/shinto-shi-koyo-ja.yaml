    "printed_page": "32"
    "printed_page_end": "33"
  "translation_ja": "定治が家を継いだ。宝暦元年に定治も亡くなり、宣長が家を継ぐことになった。22歳のときである。当時の一家を見ると、江戸の支店はすでに閉じ、家産といえば、親戚の小津氏に預けた400金の利子だけであった。宣長の母は、「跡を継ぐ弥四郎〔宣長の幼名〕は商売には疎く、ただ本を読むことだけを好むので、これから商人になってもうまくいかないだろう。また、家の財産も、隠居家〔小津氏〕の店が衰えているので、先行きが心配である。もしその店に何かあったら、私たちは何によって暮らせばよいのか。前もってその備えをしなければならない。それなら弥四郎は京都に上り、学問をして医者になるのがよいだろう」（『家の昔物語』）と考えた。そこで宣長は宝暦2年に京都へ上り、儒者堀景山の門に入ってまず儒学を修め、同4年に典薬武川幸順について初めて医学を学んだ。こうして宣長は、たまたま契沖の『百人一首改観抄』『古今余材抄』『勢語臆断』などに触れ、古学を研究する志を起こした。28歳で松坂に帰り、医業を開いた。このころ真淵の『冠辞考』を入手し、古学と神道を研究する志をますます深めた。さらに『冠辞考』を熟読するにつれ、真淵に会いたいという希望を強めた。そこで、「繰り返し読み味わうほどに、ますます志が深まり、この先生を慕う心が日ごとに切実になった」（『玉勝間』）と記している。たまたま真淵が松坂を訪れたので、初めて名刺を通じて会うことができた。真淵は一度会っただけで宣長が優れた器であると認め、胸襟を開いて道を語った。江戸へ帰ると弟子を集めて宴を設け、賢才を得たことを祝ったという。もちろん宣長は、江戸へ出て朝夕真淵のそばで学ぶことはできなかったが、それ以来盛んに書簡を交わし、真淵の指導の下で熱心に研究した。一方では生涯の大事業である『古事記伝』を編纂しながら、『直日霊』『葛花』『馭戎慨言』『玉匣』など、多くの有益な著作を公にした。"

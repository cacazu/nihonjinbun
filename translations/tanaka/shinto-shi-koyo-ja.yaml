  "translation_ja": "家を継ぐ"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"
    "original_unit_id": "943545_0000032"
    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "吾去年十二月二十一日符倆、大菩薩並比咩神封云云。『類聚國史』に、天長六年五月丁酉、令僧十口轉續一切經八幡大菩薩宮寺とあるなどを始て、此後もはら菩薩號を唱られたり。(八幡考)と。而して曰はく、いかに佛道を好み給へばとて、やごとなき大神を、菩薩としも唱し給へるは如何にぞや。そも〓〓此大神は、ことに既くよりかにかく佛ざまにあへしらへ給へるまゝにて鎭りまし、又各國におつる事なく、いと數箇所同じさまに祭られ給ひ、はた亂世の武夫等に、軍神と崇まれ給へるも、いとあやしきことになむありける。(同上)と。かくて彼れは『神名帳』頭注に、「八幡三所者、一〓八幡、二ム比女神、三大帶姫命也」とあるにより、八幡大神の祭神は、應神天皇·田心姫命·端津姬命·市杵島姫命·神功皇后となしぬ。信友の學說は要するに考證的にして神道研究の材料を供するに過ぎざりき、大國隆正の如きは則ち然らざる也。八幡の祭神大國隆正隆正、通稱仲衞、葵園·如意園·佐紀の屋などの號を有せり。姓は藤原、初め野々口と稱し、後、大國と改む。寛政四年江戶に生る。父は秀馨と云ひ津和野藩士たり。文化三年、篤胤の門に入りしも幾ばくならずして父命じて昌平黌に學ばしむ。乃ち業を古賀精里に受けり。己にして以爲らく、我が皇國に生れ皇學を修めずして漢籍を學ぶ、可ならんや。須らく皇學を修め後漢籍に及ぼすべきなりと。文化七年昌平黌を辭し、四方に遊學せり。已にして父老い家を嗣き藩の大納戶武具役となりぬ。會、同僚私をなすものあり。隆正禍の及ばんことを虞れ、乃ち亡命す。以後身を專ら學業に委ね、造詣甚だ深し。天保七年播磨の小野藩に聘せられ、歸正館を起し一藩の子弟を〓育せり。當時一儒「駁本居翁書」なるものを著はし宣長の說を攻擊す。隆正乃ち門人鈴木重胤の請に從ひ「憐駁者」を著はし、更に之れを反駁せり。曰はく、ある儒生外國の聖賢を虛譽するあまり、「駁本居翁書」と題せる書を筆神道史綱要〓家を嗣ぐ「駁本居翁書」と題せる書を筆〓"

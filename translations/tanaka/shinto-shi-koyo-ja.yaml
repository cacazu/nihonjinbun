    "text": "要記して、わが神代の古傳說を蔑如せり。門人鈴木重胤之を憤り、辨ぜんことを請ふ。世にかゝる惑の人おほかりと見ゆれば、さる人々にも見せまほしくて、重胤が請にまかせぬるこの「憐駁者」なり。(憐駁者)と。已にして居を京師にトし、帷を下して諸生に〓授す。名けて報本學舍と云ふ。是れより諸方の求めに應じて學を講じ、名、關西に振ふ。津和野藩主龜井侯、隆正の博學を嘉みし、諭して藩籍に復せしむ。隆正之れに從ひ、津和野と江戶とに往來し、皇典を以つて藩の子弟を〓授せり。明治四年八月十七日東京津和野藩邸に歿す。年八十。著はす所、「本學擧要」二卷、「本〓神理說」一卷、「神代校異傳五卷、「憐駁者」二卷、「歌學入門」一卷、「眞誥眞釋」二卷、「古傳通解」九卷、「昇降運轉」一卷、その他數十部あり。隆正、先づ自己の立脚地を示して曰はく、我徒は造天地の眞說によりて、萬事を論定するにより、鬼神を有と隆正の立脚地鬼神を有と定め、天地を神造とし、治亂興廢を神の處置とす。儒學者は造天地の眞說なき國の說によりて萬事を論定するにより、鬼神を無に屬し、天地を固有とし、治亂興廢を偶然に歸す。(憐駁者)と。以つてその立脚地宣長篤胤を宗とせるものにあるを知るべし。かくて彼れは神道の本義を說きて曰はく、我が日本國の大道は、それらの小道(株)云國のふ〓)と同じからず。大本を神代に起し、中を天皇に立てゝ、それより次第をおひ、おの〓〓その君父夫をうやまひかしづき、臣子婦をあはれみをしへ、交友かたみにまことを失なはず。家職產業をつとめて身をたもち家をたもち國をたもつ。そのたもついとま〓〓に己が好むいやしからぬ業をして樂しみくらすを常とす。武臣は武備怠らずして、國をかため、文人は日本の古事を悟り、外國の事にわたり、古今を知りて、國の光をみがきいだすなり。之をわが國の國體とし神道とす。神を祭ることのあつきはこ神道史綱要毛七かく日本國の大道"

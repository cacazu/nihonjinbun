  "translation_ja": "その学問に感服し、ただちに名簿を松坂へ送って、門人になることを願った。ちょうど宣長が亡くなっていたため、いわゆる死後の門人となった。それから全身を国学に捧げ、長年の研鑽を重ね、ついに堂々たる一家を成した。まず『呵妄書』を著して太宰春台を罵倒し、『鬼神新論』を著して儒者を叱責した。その後、『古史徴』『古史成文』『霊能真柱』などを公にし、積極的に復古神道を天下へ唱えた。学問を志す者が全国から集まり、その門に入った。文政6年には著書数部を携えて京都へ入り、天皇と上皇に献上した。そこでその著書には「天覧叡感」の四字が冠され、いっそう光輝を放つようになった。こうして当時有力だった吉田家は篤胤を招いて神職の教授とし、神祇伯の白川資敬王は篤胤を抜擢して学師の重職に任じた。ここに至り、篤胤の名声は輝かしく天下に響いた。秋田藩はこれを見て大いに喜び、帰藩を求めた。それから秋田藩士となった。しかしやがて、篤胤の熱心な敬神尊王の説には、幕府成立の基礎を危うくしかねない恐れがあるとされた。家康の事業を失うことを戦々恐々としていた役人たちは、ついに黙っていられず、江戸から追放して故郷へ帰らせ、さらに今後の著述を禁じた。天保14年閏9月11日、篤胤は秋田で亡くなった。68歳であった。正式に入門した門人は550人余り、死後の門人は1,300人余りに及んだという。著作は前に挙げたもののほか、『古史伝』32巻、『古道大意』2巻、『大道或問』1巻、『気吹颫』3巻、『俗神道大意』4巻、『印度蔵志』25巻、『出定笑語』6巻、『赤県太古伝』3巻、『西籍概論』4巻など、百余部がある。"

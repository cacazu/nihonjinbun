- "id": "ssk-p0011-003"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "神佛一致の說によりて多くの國民は、皆佛に歸せりと雖も、而かも內心安ずる所を得ざるものあり。蓋し神佛の一致は種々の託宣によりて示さると雖も、我が古傳に一も事實の徵すべきなし。さればやゝ思慮あるものは、尙一種の疑惑を脫する能はざりし也。此の疑惑を脫せしめんが爲に玆に傳說を習合し、本地埀跡を說き、神道の學理を構成するの擧を見るに至りぬ。是れ佛教的神道の起れる所以也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 10
    "url": "https://dl.ndl.go.jp/pid/943545/1/11"
    "printed_page": "12"
    "printed_page_end": "13"
  "translation_ja": "神仏一致の説によって多くの国民はみな仏に帰依したが、それでも内心に安らぎを得られない者がいた。神仏の一致はさまざまな託宣によって示されるものの、日本の古い伝承には、それを証明できる事実が一つもないからである。そのため、多少思慮のある者は、なお一種の疑いから抜け出せなかった。この疑いを解くため、伝説を組み合わせ、本地垂迹を説いて、神道の学理を構成する試みが行われるようになった。こうして仏教的神道が起こったのである。"
  "translation_status": "reviewed"

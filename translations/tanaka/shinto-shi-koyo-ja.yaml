- "id": "ssk-p0023-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "り。『古事記』に味御路、『日本紀』に可怜御路とある、是れ神代の古言なり。されば知と云ふも、美知と云ふも同じ事にて、共に通路の意のみにて、其外の義は、上古は更になかりしなり。(私淑言)と。誠に宣長の言の如く、我が上古には凡べての事象に就いて、一般に理論的研究を行ふの風存せざりしを以つて、美知なる語に就いても、具體的なる通路てふ意義の外、抽象的なる道義の觀念は存せざりし也。されば宣長亦曰はく、古の大御世には、道といふ言擧も、さらになかりき。(直毘靈)ど。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 22
    "url": "https://dl.ndl.go.jp/pid/943545/1/23"
    "printed_page": "36"
    "printed_page_end": "37"
  "translation_ja": "る。『古事記』に味御路（うましみち）、『日本紀』に可怜御路（うましみち）とあるのは、神代の古い言葉である。だから知（ち）も美知（みち）も同じであり、ともに通行する路という意味だけで、上古にはそれ以外の意味はまったくなかった」（『私淑言』）という。まことに宣長のいうとおり、日本の上古には、あらゆる事象について一般に理論的研究をする風習がなかったので、美知（みち）という語にも、具体的な通路の意味のほかに、抽象的な道義の観念はなかったのである。したがって宣長は、「古の大御代には、道という言挙げもまったくなかった」（『直毘霊』）ともいっている。"

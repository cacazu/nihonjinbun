  "source_text": "東京朝日新聞評　著者は曩に「系統的西洋教育史」を公にせし人なり。此の書は西洋に發達せる思想と教育とを研究し之を骨肉として、更に東洋殊に日本固有の思想と教育とを研究し之を精神として一大系統的教育學を組成せるものにて、體系の整然たると、議論の穩健なるとは此の書の特色なり"

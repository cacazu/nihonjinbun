    "url": "https://dl.ndl.go.jp/pid/943545/1/39"
    "printed_page": "68"
    "printed_page_end": "69"
  "translation_ja": "宗忠とほぼ同時代に井上正鉄がいた。正鉄は武蔵の人で、寛政2年に生まれた。成長して白河家の門に入り、ついに一家を成したので、信徒が日ごとに集まった。新説で世を惑わすとの嫌疑により、伊豆の三宅島へ流された。島民はその教えを信奉した。嘉永2年2月に島内で亡くなり、60歳であった。明治維新の後、信徒たちが相談して禊教を立てた。幕末に宗教的神道を唱えた者には、さらに川手文治郎、竹沢寛三郎がいる。この人々についても記す必要がある。"

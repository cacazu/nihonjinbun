    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "ㅎ種の神器は、神書の肝心、王法の樞機也。何をか王法と云ふ。蓋し儒佛二〓一致の道理也。此れを除くの外、豈に異道あらんや。一致の理は亦一心に起り。心外に法なく、法外に心なし。心は即ち是れ神。法は即ち是れ道。一にして三、三にして一。故に三器は即ち一心の標幟也」(纂疏)と云ひ、旦つ曰はく、「孔丘の言に曰はく、仁者は憂へず、知者は感はず、勇者は懼れず。子思『中庸』の書に、之れを三達德と云ふ。聖人の道、大にして博しと雖も、究めて之れを言へば、此の三者に過ぎず、鏡の妍娼を照すは即ち知の用也。玉の温潤を含むは、即ち仁の德也。劍の能く剛利なるは即ち勇の義也」(纂疏)と云ひ、更に三種の神器を佛〓に比し、鏡の能く照すは般若也。玉の能く潔きは法身也。劔の能く斷ずるは解脫也」と說き、之れを一心に歸し、之れを根柢として、その神道を構成せり。要するに親房、兼良二卿は皆三種の神器を以つて其の神道說を成せり。三種の神器は我が國家の一大事實。二卿の着眼凡ならざるを見るべし。ト部兼倶一條兼良と殆んど同時にト部家には、兼倶ありて、盛に吾人の已に述べたるが如き唯一神道の學說を講究組織し、且つ當時の將軍、足利義政及びその室富子の爲に信任せられ、神祇長上たるを公認せられ、天下の神社を支配するの權を得ぬ。足利義尙尋いで立つや、又之れに神書を進講せり。賴襄曰はく、「吾れ甞て稱す。王業衰へて神道興る。何となれば即ち是れ祖宗の事也。王政盛なる時に當り、誰れか敢へて之れを口舌に騰し、以つて私說を樹てんや。之れを口舌に騰し、以つて私說を樹つるは、ト部兼倶の足利義尙に〓ふるに始まる」日本政記)と。蓋しト部家の神道は、殆んど兼倶によりて興隆せられたるものと云ひ得べき也。兼倶の歿後、ト部家には又兼倶の如き器なかりしが、獨り萩原兼從あり。ト部家の嫡傳を承けりと稱す。偶〓江戶に吉川惟足出づ。深く神道に志し、親しく萩原兼從に就いて唯一神道の秘奥を傳はれりと云ふ。惟足は、從來の唯一神道の說に、親房·兼良二卿の說を折衷し、而して神道史綱要二吉川流の神道而して"

  "source_text": "西洋にては已に古代に論理學の如きの研究を見たりと雖ども、我が古代は言擧せぬを以て國風とせしかば、神道にも特に言論を立てざりき。而かも、神道は能く我が國民の總べての要求に應じたりしも、朝鮮·支那等との交通漸次頻煩となり、文明益々發達し來るや、從來の形式着色にては、少年が老人の衣服を用ひんとするが如くにて、我が國民の要求を十分に滿足せしむる能はざるに至りぬ。さりとて我が國民には實際界には、豐臣秀吉の如き偉人を見しと雖も、學者には、アリストテレースの如き、カントの如き、組織的頭腦を有せる偉人出でざりき。從つて神道の根本の上に一大學說を組織し、我が國民の要求を遺憾なく滿足せしむるものなかりき。是に於いてか古來比較的に傑出せる人士は、支那に發達せる學說、印度に發達せる學說、西洋に發達せる學說を取り來りて、之れを神道の根柢の幹枝とし、以つて一の完全なる神道の學說を搆成し、我が國民の總べての要求に應ぜんとせり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 7
    "url": "https://dl.ndl.go.jp/pid/943545/1/8"
    "printed_page": "6"
    "printed_page_end": "7"
  "translation_ja": "西洋では、すでに古代に論理学などの研究が行われたが、日本の古代では言葉を立てて論じないことを国風としていたので、神道でも特に言論を立てなかった。それでも神道は国民のあらゆる要求に十分応えていた。しかし朝鮮や中国などとの往来が次第に頻繁になり、文明がますます発達すると、従来の形式や色彩のままでは、少年が老人の衣服を着ようとするようなもので、国民の要求を十分に満たせなくなった。だからといって日本では、実際の活動の世界に豊臣秀吉のような偉人が出たものの、学者にはアリストテレスやカントのような体系的な頭脳を持つ偉人が出なかった。したがって、神道の根本の上に大きな学説を組み立て、国民の要求を余すところなく満たす者はいなかった。そこで、古来比較的優れた人々は、中国、インド、西洋で発達した学説を取り入れ、それを神道という根に対する幹や枝として、一つの完全な神道の学説を構成し、国民のあらゆる要求に応えようとしたのである。"
  "translation_status": "reviewed"

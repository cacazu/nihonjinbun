    "text": "三はかくて大佛を以つて天照大神と同一神靈の表現なりとの鞏固なる信念四五、を懷き給ひ、皇后太子群臣を率ゐ、大佛に對して北面し、「三寳乃奴止仕3,奉流天皇羅我命處合那保雅大前七奏賜都正奏ふとの言を宣ふに至れり。之れを承けて孝謙天皇亦厚く神佛一致の說を信じ給ひ、之れを國民に示し給ひぬ。かく當時の佛〓家は最も巧妙なる方法を案出し、神佛一致の說を主張し、先づ朝廷より之れを信じ給はざるを得ざるが如くし、以つて國民に臨めり。國民亦漸く之れを信じ、先の煩悶を脫し、盛に佛〓に歸せり。神佛一致の說によりて多くの國民は、皆佛に歸せりと雖も、而かも內心安ずる所を得ざるものあり。蓋し神佛の一致は種々の託宣によりて示さると雖も、我が古傳に一も事實の徵すべきなし。さればやゝ思慮あるものは、尙一種の疑惑を脫する能はざりし也。此の疑惑を脫せしめんが爲に玆に傳說を習合し、本地埀跡を說き、神道の學理を構成するの擧を傳說の習合見るに至りぬ。是れ佛〓的神道の起れる所以也。佛〓的神道の中に就いて、最初のものは山王一實神道也。山王一實神道は僧最澄によりて創めらると稱す。勿論吾人は彼れが後世謂ふ所の山王一實神道を說きたりと謂ふにはあらず。唯〓その端を發したりと謂ふのゐ。抑も山王神は元來支那天台山の鎭守也。最澄之れを又叡山に移し祭れるものゝ如し。之れを移すに就いては、「按ずるに日吉神號は、傳〓小比叡峯に於いて三光の日輪を見る。釋迦·藥師·彌陀の像を現ず。〓その名を問ふ。神〓げて曰はく、竪の三點に橫の一點を加ふ。橫の三點に竪の一點を添ふ。言ひ已てその光空に昇つて去る。数、文字に之れを見るに、竪の三點に橫の一點を山字となす。橫の三點に竪の一點を王字となす。高大不動なるものは山也。三才に經緯たるものは王也。是れより遂に崇んで號して山王と曰ふ」(本朝神社考)と云ふが如き說を作り、山王神の本神道史綱要三佛教的神道"

  "translation_ja": "けられて立ったのが、山崎闇斎である。谷重遠は、「伊勢流の『日本紀』には口伝がなく、ただ字面を論じるだけである。垂加は後に卜部の説を聞き、その優れたものを挙げて信守に確認した。信守はかえって腹を立てて聞かなかった。また、伊勢の明快な説を挙げて吉川惟足に尋ねたが、惟足も関係を断つような態度であった。それぞれ自分を褒めて他人の説を聞かない。この弊害は長年続いている。垂加社の神道が諸説より大いに優れているのは、ほかでもない、偏った立場がないからである。忌部流を石手帯刀に聞き、卜部流を祝吾に聞き、さらに土津に尋ねる。伊勢流を信守と大宮司精長に聞き、賀茂の説を梨木祐之に聞く。このように諸家の秘伝を集めた。実に千金の価値がある」（『秦山集』）という。このように集大成に努めた闇斎の説は、果たしてどのようなものだったのか。闇斎は、「唯一の神道というのは、外国の教えを習合しないというだけの意味ではない。天と人がただ一つの道であるという名称であり、天地と人とがまったく一つだということである」という。これによって日本の神道哲学の根底を捉え、実践哲学の面では、日神の道を説いた。日神、すなわち天照大神は、この上なく大きく高い徳を持ち、天御中主尊とまったく同じ徳を備えているが、なお人の身体を持っている。それゆえ人類の永遠の模範となったのであるとした。そしてこの道は誰もが備えているとして、「道とは人々の心に備わる自然そのものである。人は天下の神物だというのも、このためである。その道を備えていても、自分で知らなければどうにもならない」（『天津神籬磐境極秘書』）という。道は誰もが備えていても、自分で知らなければどうにもならない。そこで教えが必要になる。そのため、さらに「神道は天と人がただ一つである。道は日神の道、教えは猿田彦が導かれたところであり、土金の教えは天と人を貫く敬の極致である」（同上）という。このように闇斎は宋代の儒者の説を取り入れて、神道を説いた。"

- "id": "ssk-p0014-003"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當時、戰亂の世なりしも、別に二大神道哲學者の出づるありき。即ち北畠親房及び一條兼良の二卿也。親房は特に三種の神器を重んじ、曰はく「轉輪王の世七寶具足す。福力の感ずる所たりと雖も、子孫に傳ふる璽符にあらず。夏·商·周の世、九鼎を以つて寳となす。此の鼎は乃ち夏后氏の鑄造する所也。秦·漢より以來、傳國の璽あり。始皇の制する所。李斯の書する所也。我が國の靈器に至つては、神也、又妙也。之れを傳ふるもの即ち神聖、之れを齋くもの即ち天庭。掛も畏き御宇珍子。自ら貴ぶべきは、此の理也」(神國要道篇)と云ひ、進んで曰はく、「鏡は一物をたくはへず、私の心なくして萬象を照すに是非善惡のすがたあらはれずといふとなし。そのすがたにしたがひて感應するを德とす。これ正直の本源也。玉は柔和善順を德とす。慈悲の本源也。劔は剛利決斷を德とす。知惠の本源也。この三德を翕受せずしては、天下の治らんこと、まことにかたかるべし」(神皇正統記)と。かくて彼れは神道を神國の要道とし、大いに神道を以つて天下を統治せんとせり。されど彼れの神道は要するに神佛によりてその說を成せるものなりき。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 13
    "url": "https://dl.ndl.go.jp/pid/943545/1/14"
    "printed_page": "18"
    "printed_page_end": "19"
  "translation_ja": "当時は戦乱の世であったが、別に二人の大きな神道哲学者が現れた。北畠親房と一条兼良の二卿である。親房は特に三種の神器を重んじ、「転輪王の世には七宝が備わる。福徳の力によって得られるものとはいえ、子孫に伝える皇位のしるしではない。夏・商・周の世では九鼎を宝とした。この鼎は夏后氏が鋳造したものである。秦・漢以来、伝国の璽がある。始皇帝が作らせ、李斯が文字を書いたものである。わが国の霊器は、神聖であり、また不可思議である。これを伝えるのは神聖な存在であり、これを祭るのは天の宮廷である。口にするのも畏れ多い、天下を治める尊い御子である。自ら尊ぶべきなのは、この道理である」（『神国要道篇』）という。さらに、「鏡は一物も蓄えず、私心なく万物を照らすので、是非善悪の姿が現れないものはない。その姿に従って応じることを徳とする。これが正直の根源である。玉は柔和で善順であることを徳とする。慈悲の根源である。剣は鋭く決断することを徳とする。智慧の根源である。この三つの徳を合わせ受け入れなければ、天下が治まることは、まことに難しいだろう」（『神皇正統記』）と述べた。こうして親房は神道を神国の要道とし、大いに神道によって天下を治めようとした。しかしその神道は、結局、神と仏によって説を立てたものであった。"

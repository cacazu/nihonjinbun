  "source_text": "以上宣長の神道說の概要也。其の說は彼れの嫡子春庭、養子大平、門人服部中庸、齋藤彥麿、植松有信、渡邊重名、鈴木朖、城戶千楯、村田春門、藤井高尙等によりて盛に提唱せられたり。殊に本居大平の如きは、養子內遠、加納諸平、足代弘訓等一千餘人の門下を養成し、陸離たる光彩を發揮せり。尙宣長の歿後に門人となりて、國學界に傑出せしもの二人あり。之れを平田篤胤及び伴信友となす。吾人是れより進んで聊か此の二人に就いて述ぶべし。"

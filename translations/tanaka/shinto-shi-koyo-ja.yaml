  "translation_ja": "を信じていたことから見ても、両部神道が行われるようになって、その当時すでに長い年月が経っていたことが明らかに分かる。この神道は、山王神道が天台の教理に基づくのと同じく、まったく真言の教理に基づくものである。伊弉諾・伊弉冉の二神を金剛界・胎蔵界になぞらえ、あるいは内宮を胎蔵界、外宮を金剛界とするなどして、その神道説を組み立てたのである。"

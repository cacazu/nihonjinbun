    "printed_page": "50"
    "printed_page_end": "51"
  "translation_ja": "信友は生来謙虚で、名誉や利益を求めなかった。全国の学徒がその名を聞いて訪れ、門人になりたいと願う者は非常に多かったが、みな断って、「私の学問は、人の師となるほどのものではない」といった。強く求められると、学友とした。本居大平の門人加納諸平に宛てた書簡は、その考えを示している。「生涯、学者ぶった気持ちを持たず、人にも本にも尋ねることを忘れないでください。自ら師になろうと思う気持ちが少しでもあれば、ただちに学問を損ないます。師というのは、他人が敬って呼ぶ名です。弟子といっても、教えを受ける人を呼ぶ名です。師も弟子も、自分の口からいうべき言葉ではありません。特に日本の学問は漢学などとは事情が違うので、師弟の区別はないという趣です。講習や討論の上席とか、長席とかいうべきものでしょうか。ただし、これは私の私論"

  "translation_ja": "長流は大和の人で、宇多に生まれた。本姓は小崎氏だが、母の姓を名乗って下河辺氏と称した。通称は彦六。名は具平で、後に長流と改めた。早くから古語を研究し、造詣が非常に深かった。徳川光圀が招いても応じなかった。そこで光圀は紙と筆を与え、『万葉集』の注釈を求めた。完成しないまま、貞享3年6月3日に亡くなった。享年63。円珠庵の契沖は浪華の人で、本姓は下川、字は空心である。幼くして出家した。儒学と仏教をともに学び、博覧多識で、長流と同じく早くから日本の古語を研究し、多くの新しい解明を行った。徳川光圀の依頼で『万葉代匠記』を著し、その他にも多くの著作によって、この学問に少なからず貢献した。元禄14年に亡くなり、62歳であった。長流と契沖がこの学問に尽くした功績は大きいが、結局、彼らは語学者であって神道学者ではない。いわゆる古道学者とはいえないのである。"

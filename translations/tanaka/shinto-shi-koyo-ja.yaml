    "printed_page": "10"
    "printed_page_end": "11"
  "translation_ja": "国民の苦悩"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"
    "original_unit_id": "943545_0000010"
    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "を見たり。されば、孝德天皇の朝には、蘇我石、川麿は奏して「先祭鎭神祇、敬奉神祇、竝然後應議政事」と云ひ、天皇は詔して、「公卿百官以〓白意、ヨ詔して四方に大解除を行受休祥、令榮天下」と宣ひ、天武天皇五年には、はしめらる。大解除は神道の一大儀式也。此れ等の事實に徵して、當時朝廷の態度の如何に固有の神道を維持發展せんとせらたるにあるかを見るべし。夫れ此の如く朝廷には盛に固有の神道の維持發展に努められ、別に『古事記』·日日書書』等を編纂せられ、神道思想の普及を計られぬ。而して我が國民の多數亦神道を奉ぜりと雖も、然かも我が國民には由來新を趨ひ奇を好むもの尠からず。かゝる國民は今や茲に無量無邊の福德果報を生ずと云ふ佛を見ては、之れを信ぜんと欲せざるを得ざる也。又我が國民には、文明の進歩に伴ひ、當時己に幽玄なる學說に渴仰せるものも尠からず。かゝる國民は亦佛〓によりて慰安を得んとせり。かく種々の事國民の煩悶情よりして漸次佛〓を信ぜんとせるものを生じ來れり。さたど極めて冷靜なる頭腦を有せるものにあらざるよりは、直に之れに歸し去る能はず。即ち多くは神道思想によりて鎔鑄陶冶せられたる强き精神權威の爲に容易に佛〓に入る能はず。頗る煩悶の狀に陷れり。是に於いてか神佛習合の企圖を見るに至れり。神佛習合は、我が國の諸神を以つて印度の諸佛と元來異るものにあらずとし、神佛の衝突を巧に脫せんとせるにあり。その濫觴は蓋し聖德太子の言にありと云ひ得べし。『大日本史』に曰はく「敏達帝十四年馬子疾あり、奏して佛に禱らん〓とを請ふ。帝固より佛を好まず。太子聖徳に謂ひ曰はく、我が國自ら神あり。今馬子異域の神を祭らんことを請ふ。之れを爲す如何。太子曰はく諸佛の道諸神亦敢へて違はす」(皇子列傳)と。遂に帝は馬子の請を允し給ひぬ。已にして行基出で、盛に神佛を習合し、聖武天皇を勸めて東大寺の大佛を建て、伊勢の太神宮と相對せしめぬ。天皇神道史綱要神道習合"

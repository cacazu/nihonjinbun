  "source_text": "之れは是れ儒教的天の見解を以つて、宣長の說を駁せるもの。到底俗に所謂水掛論に了らんのみ。蓋し儒教には多く天を以つて、天帝若くは上帝に解し、之れを萬物の主宰者とす。此の天を以つて、我が天御中主神に配す。絕對的に不可なりと云ふべからざるものあるに似たり。而かも宣長は爾かく解せざる也。彼れは吾人の已に述べたるが如く天御中主神を以つて單に「天眞中に坐々て、世中の宇斯たる神(古事記傳)と解し、唯〻宇宙の大綱を取り、其の秩序を維持せらるゝの神とのみ解し、從つて森羅萬象の生々發展するは、產靈二神の御靈によるものとせり。是れ神道の由て來る所を此の二神に歸せる所以也。故に更に曰はく、まことの道の趣を、あら〳〵申さむには、まづ第一に、此世の中の"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 24
    "url": "https://dl.ndl.go.jp/pid/943545/1/25"
    "printed_page": "40"
    "printed_page_end": "41"
  "translation_ja": "これは儒教的な天の見方で宣長の説に反論したものであり、結局、俗にいう水掛け論に終わるだけであろう。儒教では多く、天を天帝または上帝と解し、万物の主宰者とする。この天を日本の天御中主神に対応させることは、絶対に不可能だとはいい切れないところもあるように思われる。しかし宣長はそう解釈しない。すでに述べたように、天御中主神を単に「天の真ん中におられ、世の中の主となる神」（『古事記伝』）と解し、ただ宇宙の大綱を取り、その秩序を維持される神とのみ理解する。したがって森羅万象の生成と発展は、産霊二神の御霊によるとした。それゆえ神道の由来をこの二神に帰したのである。さらに、「真の道の趣を大まかに述べるには、まず第一に、この世の中の"

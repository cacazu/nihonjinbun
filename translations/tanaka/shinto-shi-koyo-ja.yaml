- "id": "ssk-p0043-005"
  "section_id": "advertisement"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "「萬朝報」評　家庭教育を以て學校教育社會教育などゝ共に一個の特立したる教育學たらしめんとして、之を系統的に論述したるものやがて此家庭教育學なり、篇を分つこと八更に之を二十九章八十九節に分ち家庭教育の意義由來目的より始めて、結婚住居妊娠胎教出產哺乳子守疾病看病智育情育意育母の任務家庭教師などに至るまで、極めて微に入り細に亘りて詳述し擧げられたる項目の數のみにても實に四百數十の多きに及び、述論整然として頗る要を得系統的に論述されたる此種の著書として蓋しオーソリチーたるに足らん、加ふるに口語調を採りて平易なる記述を試みたるは双手を擧げて吾人の最も歡ぶ所、評者は此書を一般家庭の寶として推奬するに吝なるものにあらざるなり"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 42
    "url": "https://dl.ndl.go.jp/pid/943545/1/43"
  "translation_ja": "『万朝報』評――家庭教育を、学校教育や社会教育などとともに独立した教育学としようと、体系的に論述したものが、この『家庭教育学』である。全8編をさらに29章89節に分け、家庭教育の意義・由来・目的から始めて、結婚・住居・妊娠・胎教・出産・哺乳・子守・疾病・看病・知育・情育・意育・母の任務・家庭教師などまで、きわめて細かく詳述している。挙げられた項目だけでも実に400数十に及ぶ。論述は整然として要点をよく押さえ、このように体系的に論じた本書は、この種の著書として、おそらく権威ある書とするに足りるだろう。さらに口語体で平易に記述しようとした点も、両手を挙げて喜びたい。評者は本書を一般家庭の貴重な書として、惜しまず推薦する。"

  "source_text": "故に成佛と云ふて成神と云はず。物にして神靈を含藏せずと云ふことなし」（名法要集）と。然れども是れ亦佛教に基ける所ならずや。かくて卜部家にては、神道の學理的方面のみならず、進んで儀式的方面も、皆佛教より取り來り、神道護摩、神道加持などの法を設けり。『鹽尻』に神道護摩の條下に曰はく、「吉田兼倶の子僧九江、吉田山下に一寺を建て神龍院と號。九江法師、此寺に始て行ひそめし法也。然れば僧こそ修すべきに今詞官等傳受して之れを修するは、實に似げなき妄作なり」と云へり。但し神龍院とは、龍女神道を弘法に傳ふ。之れ吉田家の神道の本也。故に善女龍神の名によりて名けしなりと。何れの方面より見るも唯一神道の佛教に基ける多きを見るべし。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 13
    "url": "https://dl.ndl.go.jp/pid/943545/1/14"
    "printed_page": "18"
    "printed_page_end": "19"
  "translation_ja": "だから成仏とはいっても成神とはいわない。どんな物も、神霊を内に含まないものはない」（『名法要集』）という。しかし、これもまた仏教に基づくのではないか。こうして卜部家では、神道の学理だけでなく、さらに儀式の面もすべて仏教から取り入れ、神道護摩や神道加持などの方法を設けた。『塩尻』の神道護摩の項には、「吉田兼倶の子である僧九江が、吉田山の麓に寺を建て、神龍院と号した。これは九江法師がこの寺で初めて行った法である。それならば僧こそ修すべきなのに、今、神職たちが伝授を受けてこれを修するのは、実に不似合いな妄作である」とある。ただし神龍院という名については、龍女が神道を弘法大師に伝え、これが吉田家の神道の本であるため、善女龍神の名に基づいて名付けたという。どの面から見ても、唯一神道には仏教に基づくところが多いと分かる。"

  "reader_notes_ja":
  - "1915年刊の原資料について、全45コマの画像と未改変の全文OCRを照合した現代語訳。本文72頁・序・奥付・著述目録・広告・書評を収録する。"
  - "原著の政治的・宗教的評価や原刊自身の疑わしい表記を、現代の事実認定や賛同へ改めていない。微小な漢文訓点等の未確読部分は留保を明記した。"
  - "本文は改頁をまたいで継続する場合がある。間に置かれた欄外見出し・割注は本文の語句ではない。隣接20組は段落として接続し、非隣接13組は本文継続参照を付けた。"

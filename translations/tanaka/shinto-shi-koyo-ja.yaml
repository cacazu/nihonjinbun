  "origin": "source"
  "source_text": "『大阪毎日新聞評』田中義能氏の「平田篤胤之哲學」は、神道國學の人傑を思想上哲學上より評傳した書としては、殆ど初めて位なものであらう。是まで朱子學古學等儒家の學說に就いての述作はあるが、皇學家をこれほどに系統的思想的に論じたものは記者は未だ見なかつた。篤胤は本居の先導者となつて開いた獨自的皇學論を一層積極的に批評眼を開き宗教學に至つて殊に生面がある。信仰對象論の如き、「神はわが神なりわれは神の人なり」と言つたのなどは最もその思想の超凡を證せらる。田中氏の此書は、多方面に能く篤胤の思想を解剖してある。信仰對象論の如き、此著の標榜する所に背かぬ。但だ國家と宗教の論、其他になほ百尺竿頭更一歩ありたいと思ふ處があるが――學界思想界の爲に、此偉大な思想家――儒佛を超脫して日本的獨自の思想を發揮した――篤胤を活描し來つた著者の勞を多として、此書を推薦す。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 41
    "url": "https://dl.ndl.go.jp/pid/943545/1/42"
  "translation_ja": "『大阪毎日新聞』評――田中義能氏の『平田篤胤之哲学』は、神道・国学の傑出した人物を思想・哲学の面から評伝した書としては、ほとんど最初といってよいだろう。これまで朱子学・古学など儒者の学説についての著作はあるが、皇学者をこれほど体系的に思想の面から論じたものを、記者はまだ見たことがなかった。篤胤は、本居の先導者となって開いた独自の皇学論をいっそう積極的に批評し、とりわけ宗教学では新しい面を示している。信仰対象論などで「神は私の神であり、私は神の人である」といったことは、とくにその思想の非凡さを示す。田中氏のこの書は、多方面にわたって篤胤の思想をよく分析している。信仰対象論などは、本書が掲げる目的にかなっている。ただ、国家と宗教の論など、さらにもう一歩進んでほしいと思うところもある。しかし学界・思想界のために、儒教・仏教を超えて日本独自の思想を発揮した偉大な思想家、篤胤を生き生きと描いた著者の努力を高く評価し、本書を推薦する。"

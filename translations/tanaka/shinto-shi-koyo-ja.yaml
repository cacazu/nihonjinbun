  "source_text": "天照大神の御德は、以下諸神聖に傳はり、天下の百姓に及ぶ。茲に秩序的統一的思想、現世的快活的感情、發展的膨脹的性格となる。之れを我が國民的精神と云ふ。かゝる思想、かゝる感情、かゝる性格は、天御中主神の御德を蒙れる世界人類普く有せざるべからざる所の者たり。從つて秩序的統一的思想の如き、支那國民も著しく之れを有せり。而かも彼れにありては、古代に於いて已に禪讓放伐の如き擧によりて、殆んどその根本を破壞し畢り"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 5
    "url": "https://dl.ndl.go.jp/pid/943545/1/6"
    "printed_page": "2"
    "printed_page_end": "3"
  "translation_ja": "天照大神の徳は、その下のさまざまな神聖な存在に伝わり、天下の民に及ぶ。そこから、秩序と統一を重んじる思想、現世的で快活な感情、発展し拡大する性格が生じる。これを、わが国民の精神という。このような思想、感情、性格は、天御中主神の徳を受ける世界の人類が、すべて持つべきものである。したがって、秩序と統一を重んじる思想などは、中国の国民も著しく持っていた。しかし中国では、古代にすでに禅譲や放伐といった行為によって、ほとんどその根本を破壊し終えてしまっ"
  "translation_status": "reviewed"

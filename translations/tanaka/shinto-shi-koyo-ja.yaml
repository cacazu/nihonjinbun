    "text": "天の大本を神代にたゞしてあればなりこの故に皇統連綿として萬世かはり給はず、別に大政府ありて、おづから大帝爵の國體をあらはし、遂には萬國をしたがへつべき芽を含めり。かくの如く大本かたく中道正しきにより、古へより支那の如き賊亂もなく、異言の人に國を奪れす。同言の人も亦皇位を奪ふことを得ず。(古傳通解)と。此の說誠に篤胤のそれを紹述せるものにして、能く神道の眞意を發揮せり。此の如くにして彼れは遂に一家を成せり。想ふに篤胤の神道說巳に蘭學に依れる所尠からざりしと雖も、隆正は更に甚しく之れを取りてその說を構成し、遂に蘭學習合の評を蒙るに至れり。蘭學を取り來る素より不可なしと雖も、その消化の十分ならざりしは彼れの說の缺點なりとす。隆正巳にその神道の精神を以つて〓育に從事す。門下爲に英才を出せbo就中その出藍の器を鈴木重胤及び福羽美靜となす。此の二人後共に、蘭學習合平田門に學び、前者は偉大なる學者となり、後者は有力なる實際家となれり。重胤は、淡路の人。幼名雄三郞、後勝右衞門と云ひ、或は府生と云ふ。橿通家と號す。文化九年を以つて生る。夙に學を好み、隆正の門に入り、その業を授かれり。後江戶に遊學し篤胤の學を慕ひその門に入らんとせしも未だ果ざりき。已にして遂に意を決し秋田に赴き、其の〓を請はんとせり。偶、篤胤歿せしかば直に墓前にて歿後の門人となりぬ。巳に平田門に入り攻學研鑚、才氣縱橫、嶄然として頭角を見はせり。而して彼れ性、豪放不覊小節を願みず。盛に他を誹謗し、その師と雖も憚らず。爲に平田門を除かれ、後遂に奇禍を買ひ、文久三年八月十五日刺客の爲に斃れぬ。年五十二。著はす所、「日本書紀傳」百四十四卷、「祝祠講義」三十卷、「經緯歌」一卷、「世繼草」三卷、「開闢圖」一卷等あり。殊に「日本書紀傳」及び「祝祠講義」は、頗る浩瀚なるものにして、學者の參考に資すべきもの尠からず、五九神道史綱要前者は偉大なる學者となり、後者は有力なる實際家とな鈴木重胤五九"

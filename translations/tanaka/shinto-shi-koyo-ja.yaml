  "source_text": "天照大神は伊弉諾伊弉冊二神の貴子にましまして、人身を有し給ひ、而して能く天御中主神の高大無邊なる御德を備へ給ふ。故に古傳は光華明彩六合の內に照徹しましませりと傳ふ。所謂人道としての神道、實に大神にま創る。大神は耶蘇基督の如く、その生、その死の悲慘なるなし。釋迦牟尼の如く六年の苦修練行、五十年の宣教說法なし。孔子、ソクラテースの如く不遇なし。是れ大神の云爲行動、終始一貫、理想的の中正にあるが故也。實に大神の御德は、至中至正、至大至尊、孔子の門人は、夫子は日月の如しと云へり。大神の御德は實に天日也。天照と云ひ、大日孁貴と云ふ。偉なる哉。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 5
    "url": "https://dl.ndl.go.jp/pid/943545/1/6"
    "printed_page": "2"
    "printed_page_end": "3"
  "translation_ja": "天照大神は伊弉諾・伊弉冊の二神の尊い子であり、人の身体を持ちながら、天御中主神の高大で限りない徳を十分に備えておられる。そのため古い伝承は、その輝きが天地四方にあまねく照り通ったと伝える。いわゆる人の道としての神道は、実に大神に始まるのである。大神には、イエス・キリストのような生と死の悲惨さがない。釈迦のような6年の厳しい修行、50年の布教説法もない。孔子やソクラテスのような不遇もない。それは大神の言動が終始一貫して、理想的な中正にあったからである。大神の徳は、この上なく中正であり、この上なく大きく尊い。孔子の門人は、先生は太陽と月のようだといった。大神の徳は、まさしく天の太陽そのものである。天照といい、大日孁貴という。なんと偉大なことだろう。"

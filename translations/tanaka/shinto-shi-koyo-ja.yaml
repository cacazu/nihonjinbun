    "text": "삣申したる云云。(俗神道大意)と說き、尙、自家の神道を古道と云ひ、抑も古道と申候は、何の事もなく古の道と申すことにて、其は天皇祖神のこの天地を御造りなされ候を始め、上代の事實の上に備はり候。眞の道を聊も外國風の說を混へず、純粹なる古意古言を以つて、すなほに說明し、その事實の上にて、天皇命の天下を治め給ふ御政の本をも、人道の本をも知り候學問故、古學と申し、その道をさして古道とは申候事に候。(入學問答)と說けり。彼れが此れ等の言の示すが如く、彼れの神道說は、徹頭徹尾宣長のそれの紹述也。敷衍也。要するに篤胤の學說は、高天原及び夜見國を說くの點に於いて、幽冥を云ひ、未來を論じ、復古神道に大いに宗〓的色釆を與へしの點に於いて、深く佛〓を研究し、盛に破佛論を唱へしの點に於いて、熱心に諸子彼れの神道說は、徹頭徹尾百家を研究し、殊に玄道を取り來りて、自家の學說構成の用に供せしの點に於いて、その他種々の點に於いて、宣長學の範圍を逸脫して、一家の見を立せしは吾人の深く注意せざるべからざる所也。就中篤胤が、天御中主神を以つて無始無終の神とし、『古事記』の『成神』を『古史成文』に『有神』に改めたるが如き、然りとなす。篤胤の門に、養子平田鐵胤、生田國秀、佐藤信淵、大國隆正、六人部是香、權田直助、矢野玄道、久保季茲等出で盛に篤胤の說を唱ふ。されど吾人は筆を轉じて伴信友に就いて述べん。、信友亦篤胤と同じく宣長歿後の門人也。幼名。銳、後州五郞と改む。父は山岸事負と號す。安永二年二月廿五日を以つて若狭國小濱に生る。次郞太夫惟智。母は片岡氏。信友はその第四子也。天明六年年甫めて十四、小濱藩御勘定頭伴信頭の養嗣子となり翌年江戶に來り住す。天明八年初めて藩に出仕し、爾來精勤屢〓賞賜せらる。公務の餘暇、心を國學に傾け、研鑚年あり。偶〓宣宣の『古事記傳』·「詞の玉の〓』等の書を得て、、深神道史綱要四元若狭の人"

  "translation_ja": "篤胤は神道説においては、ほとんど忠実に宣長の学問を信奉した。「この天地をお造りになった天の神、高皇産霊神と神皇産霊神が始められ、伊邪那岐・伊邪那美神が受け継いで、世にあるすべての事物の根本を始められた。また、その事物を分担して治める神々をお生みになり、その功徳を天照大御神へお伝えになった。さて、皇御孫の邇々杵尊が天降られるとき、天御祖産霊の神と天照大御神から、代々の皇御孫命が天下を治める政治のあり方をお伝えになった。こうして代々の天皇は、その委任のままに、ご自身の小賢しい判断を加えず、天地とともに世を治められるのである。この道を指して神道と"

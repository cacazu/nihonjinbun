    "text": "空因此て行はるべし。此ぞ神漏岐神漏美の詔命以て皇御孫命に事依し奉給ひし隨に、古今萬國の差別無く、天下公正に自然にして行はるゝ所の大道にして、貴賤尊卑の等差なく天下萬世に當然にして行可き所の大道なり。(祝詞講義)と。以つて彼れが神道とせる所のものゝ規模大にして、抱括的なるを見るべし。蓋し彼れは儒〓そのもの佛〓そのものとしては、之れを排斥せるも、而かも「普天の下悉く皇御孫命の皇土に非ぬはなく、萬國の聖哲悉く皇御孫命の王臣に非ぬは無ければ、萬國に行はるゝ道、即我が大道なれば、惡しきを棄捐て其善を採用むに何でふ事か有む」(祝詞講義)と云ふ主義に立ち、世界の總べての道に就き長を取り、短を補ひ以つて神道を說かんとせるもの也。是れ實に篤胤の取りし所の主義也。要するに彼れの說は、高天原を以つて太陽と解し、又は天極紫微宮と解せるが如き、その他地動說を古傳とせるが如き、篤胤の說を蹈襲せる所尠からず。從つて彼れはたとひ平田門の門人帳より省かれしと雖も、而かも事實に於いて篤胤の學派たるを失はざる也。吾人は彼れが宣長隆正の學を學び、而して深く篤胤に私淑し、篤胤の學說を取長補短し極めて雄大なる學說を構成せんと努めしの功は、明に認容するもの也。以上述べ來れるが如き、德川時代に於ける復古神道派の運動に對し別に方面を異にせる二個の神道あり。一を水戶流の神道派となし他を黑住、井上等宗〓的神道派となす。水戶流の神道は、藩祖光圀の主義によりて、藤田幽谷、其の子東湖、幽谷の門人會津正志等によりて盛に唱道せらる。其の說く所我が神道は儒〓と背馳するものにあらずとなし、宣長等を以て道〓によりて其の說を立せるものとなし、甚しく之れを排斥せり。藤田東湖は曰はく、近世古學を唱ふるもの、古言を錯綜し、舊事を網羅し、考證の力勤めたりと謂ふべし。而れどもその道を論ずるに至りては、則ち天下の神道史綱要查水道流の神道藤田東湖"

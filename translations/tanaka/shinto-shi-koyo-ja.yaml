- "id": "ssk-p0034-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "の大本を神代にたゞしてあればなりこの故に皇統連綿として萬世かはり給はず、別に大政府ありて、おづから大帝爵の國體をあらはし、遂には萬國をしたがへつべき芽を含めり。かくの如く大本かたく中道正しきにより、古へより支那の如き賊亂もなく、異言の人に國を奪れす。同言の人も亦皇位を奪ふことを得ず。(古傳通解)と。此の說誠に篤胤のそれを紹述せるものにして、能く神道の眞意を發揮せり。此の如くにして彼れは遂に一家を成せり。想ふに篤胤の神道說巳に蘭學に依れる所尠からざりしと雖も、隆正は更に甚しく之れを取りてその說を構成し、遂に蘭學習合の評を蒙るに至れり。蘭學を取り來る素より不可なしと雖も、その消化の十分ならざりしは彼れの說の缺點なりとす。隆正巳にその神道の精神を以つて教育に從事す。門下爲に英才を出せり。就中その出藍の器を鈴木重胤及び福羽美靜となす。此の二人後共に、平田門に學び、前者は偉大なる學者となり、後者は有力なる實際家となれり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 33
    "url": "https://dl.ndl.go.jp/pid/943545/1/34"
    "printed_page": "58"
    "printed_page_end": "59"
  "translation_ja": "の根本を神代に正してあるからである。そのため皇統は絶えることなく続き、万世にわたって変わらない。別に大政府があり、おのずから大帝爵の国体を現し、ついには万国を従わせる芽を含んでいる。このように根本が堅固で中心の道が正しいので、古来、中国のような反乱もなく、異なる言語の人に国を奪われることもない。同じ言語の人も、皇位を奪うことはできない」（『古伝通解』）という。この説はまことに篤胤の説を継承し、神道の真意をよく明らかにしている。このようにして隆正は一家を成した。思うに、篤胤の神道説もすでに蘭学に依拠するところが少なくなかったが、隆正はさらに多く取り入れて説を組み立て、ついには蘭学習合との評価を受けるに至った。蘭学を取り入れること自体はもちろん悪くないが、十分に消化していないことは、その説の欠点である。隆正は自分の神道の精神によって教育に従事し、門下から優れた人材を出した。特に師を越えた器は、鈴木重胤と福羽美静である。この二人は後にともに平田の門で学び、前者は偉大な学者、後者は有力な実際家となった。"

  "translation_ja": "川手文次郎"
  "translation_status": "partial"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"
    "original_unit_id": "943545_0000040"
    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "七〇文治郞は備中大谷の人。人となり至誠、年四十二、大患を病み、專心神に祈り、癒ゆるを得たり。是に於いてか益〓信念を强くし、遂に神託を受け、天地金乃神を立て、之れを天地主宰の神とし、忠孝彜倫の〓を說けり。之れを金光〓と云ふ。明治十六年十月十日を以つて逝く。寛三郞は東洋と號す。阿波の人、後姓名を改め、新田邦光と稱す。その說、造化三神を主とし、伊弉諾伊弉册二神は、天神の命を受け、國土を修理固成せらる。故に修理固成の神事は、人世の最大要義なりとし、五倫五常の如き、皆是れより出づとなせり。之れを神道修成派と云ふ。此れ等宗〓的神道の民間に勢力を布殖すると同時に、中流以上の社會には、本居、平田一派の神道偉大なる勢力を占め、明治維新の鴻業と共に、神佛習合の弊を打破し、大いに固有の大道を發揮せり。此の時に當り、明治天皇は大詔を發せられ、宣はく、〓シ:今也、天運循環、百度維新、宣明治〓以宣揚惟神之大道也。川手文次郞竹澤寛三郞明治維新と。と。尋いで〓部省は三箇條の〓則を頒布せり。曰はく、第一條敬神愛國の旨を體すべき事。第二條天理人道を明にすべき事。第三條皇上を奉體し朝旨を遵守すべき事。是れ也。當時事皆未だ緒にかず、制度種々に變遷せしが、明治十五年に至り、神官、〓導職の兼務を禁ぜしかば、從來の宗〓的傾向を有したる〓派は、玆に各〓〓派派立固有の大道に基いて宗〓界に雄飛せんとするに至れり。即ち伊勢にありては、大宮司田中賴庸本官を辭し、神宮〓の管長となり出雲大社を中心とする大社〓亦獨立せり。而して黑住〓は已に明治九年に獨立せしが、吾人の已に述べたる長谷川角行の創唱せる富士講は、明治の世となり、二派となり、一は實行〓となり、一は扶桑〓となれり。別に平山省齋は大成〓を起し、芳村正秉は神習〓を立し、下山應助の唱へたる御嶽神社を信仰の中心とせる御嶽〓は、もと大成〓に屬神道史綱要と〓曰はく、"

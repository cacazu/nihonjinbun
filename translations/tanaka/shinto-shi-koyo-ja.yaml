  "translation_ja": "こうして最初に影響を受けたのは儒教である。もちろん、儒教は古の聖帝、堯と舜が始めたものだという。しかし彼らは一介の庶民を取り立てて天子の位を継がせ、それを怪しまない。また、古の聖王、湯王と武王が唱えたものだという。しかし彼らは君主を討って帝位を奪い、それを恥じない。君臣の大義、上下の身分秩序において、その根本が誤っている。したがって儒教の思想は、わが神道の根本には少しも貢献しなかったのである。ただ儒教では、大義名分の根底は失われていたとしても、いったん君主となり、上に立ったいわゆる聖人は、万民に大義を守らせ、名分を正させ、自分の地位を維持し、国"

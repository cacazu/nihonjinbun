    "printed_page_end": "59"
  "translation_ja": "重胤は淡路の人である。幼名は雄三郎、後に勝右衛門といい、あるいは府生ともいった。橿通家と号した。文化9年に生まれた。早くから学問を好み、隆正の門に入って学業を授けられた。後に江戸へ遊学し、篤胤の学問を慕って門下へ入ろうとしたが、まだ実現しなかった。やがて決意して秋田へ赴き、教えを請おうとした。たまたま篤胤が亡くなったため、そのまま墓前で死後の門人となった。平田門に入ると学問に励み、才気は縦横で、抜きんでて頭角を現した。しかし性格は豪放で束縛を嫌い、小さな礼儀を顧みなかった。盛んに他人を批判し、師にも遠慮しなかった。そのため平田門から除名され、後には思いがけない災難を招き、文久3年8月15日に刺客によって倒れた。52歳であった。著作には『日本書紀伝』144巻、『祝祠講義』30巻、『経緯歌』1巻、『世継草』3巻、『開闢図』1巻などがある。特に『日本書紀伝』と『祝祠講義』はきわめて浩瀚で、学者の参考になる点が少なくない。"

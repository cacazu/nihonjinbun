  "translation_ja": "宗忠は備前の人で、安永9年に生まれた。生来たいへん孝行で、33歳のとき父母の死に遭い、悲しみは極まった。窮まれば通じる。ついに豁然と悟るところがあり、一派の神道を始めた。嘉永3年に亡くなり、71歳であった。後に宗忠大明神の宣下を受けた。その説は、「神国の人として生まれながら常に信心がないこと」「腹を立て、物事を苦にすること」「自分の慢心によって人を見下すこと」など七箇条の信条を示し、天照大神を主神として、きわめて熱心に神道を説いた。これを黒住教という。"

- "id": "ssk-p0012-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "地を釋迦·藥師·彌陀の三尊としたりし也。而して叡山には、『古事記』に、御年神、又娶天知迦流美豆比賣生子云云次、大山咋神亦名山末之大主神、此神者坐近淡海國之日枝山と云ひ、己に大山咋神鎭坐しませるも、今、玆に山王神を祭り、釋迦の垂跡を大己貴神とし、藥師の埀跡を國常立尊とし、阿彌陀の埀跡を八幡菩薩とし、合して山王權現となしぬ。斯くて此の山王神は、天台の教義に結び付けられたり。『神社考』の錄する所によるに、山王神は行圓に之れを示せりとなせり。即ち明神嘗て行圓に告げて曰はく、「我れを山王と名く。公之れを委すや。三諦即一を表する也。山王の竪の三畫は空假中也。橫の一畫は即一也。王字の橫の三畫は三諦也。竪の一畫又一也。二字三畫にして一貫の象あり、故に我れ立てゝ號となす也。一心三觀、一念三千、亦復是の如し。是を以つて我れ台教を護持し、國家を鎭護す」と。かゝる傳に基き、山王とは、三諦一境の稱也。三と雖も而かも一。斯れを極理となす。乃ち一實の謂也と云ひ、或は、八百萬の神々は、皆此の三諦一實の妙理に基きて、無窮の化道を施し玉ふと云ふが如き、神道說を構成せり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 11
    "url": "https://dl.ndl.go.jp/pid/943545/1/12"
    "printed_page": "14"
    "printed_page_end": "15"
  "translation_ja": "地を釈迦・薬師・阿弥陀の三尊としたのである。比叡山については、『古事記』に、「御年神が、また天知迦流美豆比売を妻として生んだ子は……次に大山咋神、またの名を山末之大主神という。この神は近淡海国の日枝山におられる」とあり、すでに大山咋神が鎮座していた。それでもここに山王神を祭り、釈迦の垂迹を大己貴神、薬師の垂迹を国常立尊、阿弥陀の垂迹を八幡菩薩として、合わせて山王権現とした。こうして山王神は天台の教義に結び付けられた。『神社考』の記録では、山王神が行円にこれを示したという。すなわち、明神はかつて行円に、「私を山王と名付ける。あなたはその意味を知っているか。三諦がそのまま一つであることを表すのだ。山の字の縦の三画は空・仮・中であり、横の一画は、それらがそのまま一つであることを示す。王の字の横の三画は三諦であり、縦の一画も一つであることを示す。この二字には、三画を一つが貫く形があるので、私はそれを号とした。一心三観、一念三千も同じである。そのため私は天台の教えを護持し、国家を鎮護する」と告げた。このような伝承に基づき、山王とは三諦が一つの境地であることの呼び名であり、三つでありながら一つであることを究極の理とする、これが一実の意味であると説き、あるいは八百万の神々はみな、この三諦一実の妙理に基づいて、限りなく衆生を教え導かれる、といった神道説を構成したのである。"

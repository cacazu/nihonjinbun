  "translation_ja": "一条兼良とほぼ同時代に、卜部家には兼倶がいて、すでに述べたような唯一神道の学説を盛んに研究し、体系化した。また、当時の将軍足利義政とその妻富子に信任され、神祇長上であることを公認されて、天下の神社を支配する権限を得た。続いて足利義尚が将軍になると、神書を進講した。頼襄は、「私はかつて、王業が衰えると神道が興るといった。なぜなら、これは皇祖の事柄だからである。天皇の政治が盛んなときに、誰があえてこれを口に論じて私説を立てようか。これを口で論じ、私説を立てるのは、卜部兼倶が足利義尚に教えたことに始まる」（『日本政記』）という。おそらく卜部家の神道は、ほとんど兼倶によって興隆したといえる。兼倶の死後、卜部家には再び兼倶のような器量の者はいなかったが、ひとり萩原兼従がおり、卜部家の正統な伝授を受けたと称した。"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"

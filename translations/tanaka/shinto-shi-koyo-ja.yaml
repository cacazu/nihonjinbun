- "id": "ssk-p0010-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "を見たり。されば、孝德天皇の朝には、蘇我石川麿は奏して「先祭鎭神祇、然後應議政事」と云ひ、天皇は詔して、「公卿百官以淸白意、敬奉神祇、竝受休祥、令榮天下」と宣ひ、天武天皇五年には、詔して四方に大解除を行はしめらる。大解除は神道の一大儀式也。此れ等の事實に徵して、當時朝廷の態度の如何に固有の神道を維持發展せんとせらたるにあるかを見るべし。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 9
    "url": "https://dl.ndl.go.jp/pid/943545/1/10"
    "printed_page": "10"
    "printed_page_end": "11"
  "translation_ja": "た。そこで孝徳天皇の時代には、蘇我石川麿が「まず神々を祭り鎮め、その後に政治を議するべきです」と奏上した。天皇は「公卿百官は清らかな心をもって神々に敬って仕え、みな吉祥を受け、天下を栄えさせよ」と詔を出し、天武天皇5年には、詔によって四方で大祓を行わせた。大祓は神道の一大儀式である。これらの事実から、当時の朝廷がいかに固有の神道を維持し、発展させようとしていたかが分かる。"
  "translation_status": "partial"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"

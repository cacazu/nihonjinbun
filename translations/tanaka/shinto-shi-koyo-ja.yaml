  "source_text": "去年十二月二十一日符偁、大菩薩並比咩神封云云。『類聚國史』に、天長六年五月丁酉、令僧十口轉續一切經八幡大菩薩宮寺とあるなどを始て、此後もはら菩薩號を唱られたり。(八幡考)と。而して曰はく、いかに佛道を好み給へばとて、やごとなき大神を、菩薩としも唱し給へるは如何にぞや。そも〳〵此大神は、ことに既くよりかにかく佛ざまにあへしらへ給へるまゝにて鎭りまし、又各國におつる事なく、いと數箇所同じさまに祭られ給ひ、はた亂世の武夫等に、軍神と崇まれ給へるも、いとあやしきことになむありける。(同上)と。かくて彼れは『神名帳』頭注に、「八幡三所者、一八幡、二比女神、三大帶姫命也」とあるにより、八幡大神の祭神は、應神天皇·田心姫命·端津姬命·市杵島姫命·神功皇后となしぬ。"
  "source_languages":
  - "ja"
  "source_locations":

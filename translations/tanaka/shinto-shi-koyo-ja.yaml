- "id": "ssk-p0026-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "惣體の道理を、よく心得おくべし。其道理とは、此天地も諸神も萬物も、皆、こと〴〵く其本は、高皇產靈神、神皇產靈神と申す二神の、產靈のみたまと申すものによりて、成出來たるものにして、世々に人類の生れ出で、萬物.萬事の成出るも、皆此御靈にあらずと云ふことなし。されば神代のはじめに、伊邪那岐·伊邪那美二柱の大御神の、國土萬物、もろ〳〵の神だちを生成し給へるも、その本は皆かの二神の產靈の御靈によれるものなり。(玉匣)と。以上述べ來れるが如くにして、宣長は、道の起源は、高皇產靈神·神皇產靈神二神にありて、此の二神の御靈によりて、伊弉諾·伊弉冉二神種々に之れを發展せられ、天照大神その根元大本を示され、その他の諸神祇亦之れが種々の方面を示され、從つて道は神代の事跡に皆備はりて、不足せる所なしとなせる也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 25
    "url": "https://dl.ndl.go.jp/pid/943545/1/26"
    "printed_page": "42"
    "printed_page_end": "43"
  "translation_ja": "全体の道理を、よく心得ておくべきである。その道理とは、この天地も、神々も、万物も、すべてもとは高皇産霊神、神皇産霊神という二神の産霊の御霊によって生まれたものであり、代々人類が生まれ、万物や万事が成り立つのも、すべてこの御霊によらないものはないということである。だから神代の初めに、伊邪那岐・伊邪那美の二柱の大神が、国土、万物、さまざまな神々を生み成されたことも、その根本は、すべてその二神の産霊の御霊によるのである」（『玉匣』）という。以上のように宣長は、道の起源は高皇産霊神・神皇産霊神の二神にあり、その御霊によって伊弉諾・伊弉冉の二神がさまざまに発展させ、天照大神が根本を示し、その他の神々もさまざまな方面を示したので、道は神代の事績にすべて備わり、不足するところはないとしたのである。"
  "translation_status": "reviewed"
  "source_alignment":

  "source_text": "文治郞は備中大谷の人。人となり至誠、年四十二、大患を病み、專心神に祈り、癒ゆるを得たり。是に於いてか益々信念を强くし、遂に神託を受け、天地金乃神を立て、之れを天地主宰の神とし、忠孝彜倫の教を說けり。之れを金光教と云ふ。明治十六年十月十日を以つて逝く。"

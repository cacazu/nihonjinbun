  "translation_ja": "これによって行われるだろう。これこそ神漏岐・神漏美の命によって皇御孫命へ委任されたままに、古今や万国の区別なく、天下に公正に、自然に行われる大道であり、貴賤尊卑の差なく、天下万世に当然行うべき大道である」（『祝詞講義』）と説く。これによって、重胤が神道とするものの規模が大きく、包括的であると分かる。重胤は儒教そのもの、仏教そのものとしては排斥するが、「天下はすべて皇御孫命の領土でないところはなく、万国の聖哲はすべて皇御孫命の臣でない者はないのだから、万国で行われる道は、すなわちわが大道である。悪いものを捨て、善いものを採用することに、何の問題があろうか」（『祝詞講義』）という立場に立ち、世界のあらゆる道から長所を取り、短所を補って神道を説こうとしたのである。これはまさしく篤胤が取った主義である。要するに重胤の説は、高天原を太陽と解したり、天極紫微宮と解したり、地動説を古伝としたりするなど、篤胤の説を踏襲したところが少なくない。したがって、たとえ平田門の門人帳から除かれても、実際には篤胤の学派であることを失わない。私は、重胤が宣長と隆正の学を学び、深く篤胤に私淑し、篤胤の学説の長所を取り短所を補って、きわめて雄大な学説を構成しようと努めた功績を、明らかに認めるのである。"

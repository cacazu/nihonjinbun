    "text": "ぬ。快活的現世的感情の如き、希臘人の間にも大いに之れを認め得べく、發展的膨脹的性格の如き、羅馬人の間にも著しく之れを認め得べし。而かも被れ等國民は、至中至正にましましたる天照大神の如き、偉大なる人格神を有せざりしが爲に、不幸にも之れを偏して有せしのみならず、その引續ける國運の沈替と共にその偏せるものをも殆んど之れを銷磨し去れり。獨り我が國民はかゝる精神の精を體し華を集め給ひ、所謂かそる精神の權化とも稱しまつるべき天照大神其の他種々の神聖を有し、れら神聖の行ひ給ひ、示し給ひし事蹟は、々國民に偉大なる印象を與へ、政治と云はず、宗〓と云はず、道徳と云はず、あらゆる國民行爲の規範となり國民依つて以つて云爲し、依つて以つて行動し、益々我が國民的精神を發揮し、我が國家をして啻に亡滅の厄に超然たらしむるのみならず、却つて愈々之れを興隆し、愈々之れを發展し、我が皇運をして天壤と與に無窮ならしむかく古來の神聖の事蹟より由來せる國民の義神道の意云爲行動の根柢となり、規範となる所のものを呼んで神道と云ふかゝる神道は、古代に於いて已に非常なる勢力を有し、當時の國民の知識的·感情的意意的要求に應じたりし也。故にそが實際界に現はれては、從來、我が國民の道德界に非常なる影響を及ぼしたる儒〓の傳來前に於ける我が國民の道德となりし也。又、我が國民の宗〓界に甚大なる勢力を有したる佛〓の傳來前に於ける、我が國民を安心立命せしめし所の宗〓たりし也。而して恐くも、明治天皇陛下が、明治三年正月三日、勅を下して、朕、恭惟、天神天祖、立極埀統、列聖相承、繼之述之、祭政一、あ、億兆同心、治〓明于上、風俗美于下。と宣はせたるが如く、上古より祭政一致にして、支那王覇の道の傳來せるより以前に、巳に政治の道となりし也。その他、神道は、我が國民の實際的生活の總べての方面に勢力を有せし也。元來、神道の根本は、吾人大和民族が此の身體髮膚を神祖より禀け得神道史綱要五カ神道の勢神道と其の變遷吾人大和民族が此の身體髮膚を神祖より禀け得五"

    "printed_page": "54"
    "printed_page_end": "55"
  "translation_ja": "昨年12月21日の符に、大菩薩と比咩神の封戸について……』とある。『類聚国史』には、『天長6年5月丁酉、僧10人に八幡大菩薩宮寺で一切経を転読させた』とある。こうした記録をはじめとして、その後は専ら菩薩号を称された」（『八幡考』）。さらに、「いかに仏道を好まれたとはいえ、尊い大神を菩薩と称したのは、どういうことだろう。そもそもこの大神は、特に早いころから何かと仏教風に扱われるままに鎮座し、また各国に漏れなく、非常に多くの場所で同じように祭られている。さらに乱世の武士たちから軍神として崇められたのも、たいへん不思議なことである」（同上）という。こうして『神名帳』の頭注に、「八幡三所とは、一に八幡、二に比女神、三に大帯姫命である」とあることから、八幡大神の祭神を応神天皇・田心姫命・端津姫命・市杵島姫命・神功皇后とした。"

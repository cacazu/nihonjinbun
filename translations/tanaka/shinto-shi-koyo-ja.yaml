  "source_variants":
  - "kind": "ocr"
    "text": "四六の國とせるには反對し、之れを北極の上空なりとし、又太陽なりと主張せり。次に宣長は夜見國を以つて支那の黄泉と同一視し、死して靈魂の赴く所と解せり。然るに篤胤は、人の靈魂の赴く所は幽冥にして、古傳の夜見國は月球なりとなしぬ。かくて篤胤は、太陽は高天原にして、天照大神之れを統治し、地球は皇孫命の統治せらるゝ御國也。月球は即ち夜見國にして、素盞鳴尊の統治せらるゝ所となしぬ。以つて彼れは宣長の未だ手を附けざりし、西洋天文の說を取り來りて茲に地動說をも唱へぬ。曰はく、天つ日は高く上に位を定めて動き轉ることなく、地は元よりのまゝタャヨヒメグに漂旋り、月泉は地の底に成りて、もと地に漂ひ旋れる物なるけにや、斷れ離れて後もその如く、地に屬て旋ること今の現に見るが如し。こ호,とれ等のことすべて神の產靈の奇く妙なる理によりて然るなれば、更に人の小き智をもて、とかく測識るべき限にあらず。(靈能眞柱)地訪說ど。かくして彼れは當時一部の學者の間に漸く盛に行はれ來れる西洋の學理を應用して、その學說を構成し、而して是れ皆我が眞の古傳なりとなしぬ。篤胤は、その神道說に於いては、殆んど忠實に宣長の學を信奉せり。曰はく、この天地を御造り遊ばしたる天つ神、高皇產靈神·神皇產靈神の始まして、伊邪那岐·伊邪那美神の御受繼あそばして、世にありとある事物の本を御始なされ、又その事物を悉に持分けしろしめす神々を御生なされて、其功德は天照大御神に御傳へあそばし、偖皇御孫通々杵尊、御天降り遊ばさるゝ時、天御祖產靈の御神、天照大御神より、皇御孫命の御代々、天の下を知し召す御政のやうを御傳へあそばし、偖御代々の天皇其の御依しのまに〓〓、己命の御さかしらを御加へあそばさず、天地と共に御世しろしめすことぢやが、斯道をさして、神道と神道史綱要恩宣長學の紹述その神道說に於いては、殆んど忠實に宣長の學を信奉せり。"

    "text": "三せしも是に至り又獨立せり。此れ等各派に屬せざるものは、子爵稻葉正邦を管長とし神道本局を立せり。然れども之れに屬したる禊〓、神理〓、金光〓、天理〓等は久しからずして皆獨立せり。此れ等の宗〓局に於いて取扱はるゝ神道に對し、神官神職の方面は、荷田、賀茂、本居平田所謂四大人の〓を奉じ、神社に奉仕し、純粹なる固有の大道即ち歷史的宗〓的色彩を帶びざる椎神の大道を宣揚せんことを努力せり。神道史綱要終大正四年七月十八日印刷大正四年七月二十二日發行大正四年七月二十八日再版發行著發作行兼者神道史綱要定價金貮拾五錢田中義能東京市四谷區鹽町三丁目四十四番地岡田榮松東京市京橋區築地二丁目五番地三生舍東京市麴町區內幸町一丁目四番地日本學術研究會東京市神田區錦町一丁目十九番地製複許不印刷者印刷所發行所大取次總統一覽、大韓國臨 ( ) 〓 - )東京市神田區表神保町三振替口座東京貳七〇番東京堂"

  "origin": "source"
  "source_text": "隆正、先づ自己の立脚地を示して曰はく、我徒は造天地の眞說によりて、萬事を論定するにより、鬼神を有と定め、天地を神造とし、治亂興廢を神の處置とす。儒學者は造天地の眞說なき國の說によりて萬事を論定するにより、鬼神を無に屬し、天地を固有とし、治亂興廢を偶然に歸す。(憐駁者)と。以つてその立脚地宣長篤胤を宗とせるものにあるを知るべし。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 32
    "url": "https://dl.ndl.go.jp/pid/943545/1/33"
    "printed_page": "56"
    "printed_page_end": "57"
  "translation_ja": "隆正はまず自分の立場を示し、「私たちは天地創造の真説によって万事を論定するので、鬼神は存在すると定め、天地は神が造ったものとし、治乱や興亡を神の処置とする。儒学者は、天地創造の真説がない国の説によって万事を論定するので、鬼神は存在しないとし、天地はもとからあるものとし、治乱や興亡を偶然に帰する」（『憐駁者』）という。このことから、宣長と篤胤を宗とする立場だったと分かる。"

    "text": "六を信ぜるに徵するに、兩部神道の行はれたるの當時己に久しかりしを明に認め得べし。此の神道は、山王神道が、天台〓理に基けると同じく、全く眞言〓理に基けるもの也。即ち伊弉諾·伊弉冉二神を金剛界·胎藏界に比し、或は內宮を胎藏界外宮を金剛界とするが如くにしてその神道說を組織せるもの也。以上述べ來りたるが如くにして、山王神道及び兩部神道は天下を風靡せしも、而かも我が國民的精神の熱烈なるもの、殊に發展的膨脹的性格に富めるものは、かゝる神道を以つては、到底自己の精神の要求を滿足する能はざる也。かの唯一神道が、吾が神道は一陰一陽不測の元、國常立尊以降天照大神に至る玄々妙々の相承也。天照大神天兒屋命に〓へ給sho爾してより以來、濁世末代の今日に至るまで、一氣の元水を汲んで、遂に三〓の一滴を甞めずと呼號し、我が固有の神道を高尙なる哲學思想を以つて莊嚴せんとして起れる、實に能くその消息を漏せるものと謂ふ唯一神道んじんされど爾かく呼號の大なるにも係らず、その構成せられたる神道は、三〓を嘗むること尠からず。試にその神道の名を見よ、唯一と云ふにあらずや。唯一の語は、『孝德天皇紀』には、帝道唯一の語ありと雖も、而かも世の學者は、一般に、『法華經』に、「唯有一乘法、無二亦無三」と云ひ、『賓積經』に、「一切諸佛、唯是一佛、說無量佛、是名神變、一切佛土、唯一佛土、說無量土、是名神變」と云へるが如きに基くものとす。蓋し事實なるべし。以つて唯一の語の佛〓に基けるものなるを知るべし。更にこの唯一神道の內容を見るに、「吾が神道は、萬物に在りて一物を留めず。所謂風波雲霧、動靜進退、晝夜隱顯、冷寒温熱、善惡の報、邪正の差、統べて吾が神明の所爲に非るはなし。故に天地の心是れ神也。諸佛の心是れ神也。鬼畜の心是れ神也。草木の心是れ神也。何ぞ況んや人倫に於いてをや。意を以つて理を成す。意を以つて言を成す。意を以つて手足を爲す。皆是れ心神の所爲也。一切の含靈、神に非ずと云ふことなし。神道史綱要モ"

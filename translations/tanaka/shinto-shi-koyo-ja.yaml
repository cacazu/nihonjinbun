  "translation_ja": "篤胤は秋田の人で、安永5年8月24日に生まれた。父は大和田祚胤、母は那珂氏。篤胤はその第四子である。幼名は正吉、大壑と号し、伊吹の屋と称した。わずか8歳で、藩儒の中山青義から儒学を学んだ。その後、生母の那珂氏が亡くなり、継母の小野氏が入った。20歳になると故郷を離れ、大きな志を抱いて江戸へ来た。前後5年間苦学した。たまたま松山の板倉侯の臣、平田篤穏に認められ、その養嗣子となり、それからは学問に専念できるようになった。享和元年、26歳のときに初めて宣長の著書に接した。それを見て、深く"

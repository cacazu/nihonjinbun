  "translation_ja": "宣長は伊勢松坂の人で、享保15年に生まれた。父は三四右衛門定利、母は村田氏。家は初め北畠氏に仕えていたが、後に商人となり、定利のころには江戸に二つの支店を置き、巨万の富を築いた。しかしほどなく家運が衰えた。元文5年、定利が亡くなった。そのとき宣長はわずか11歳であった。義兄"

- "id": "ssk-p0006-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "らるゝ天御中主神は無限遍在にましませば、至る所として、此の神のまします所ならざるはなし。從つて平田篤胤は此の大神はしも、無始より座しませば、最第一の神に座すこと申すも更にて、其の御功德の廣く大きなること、稱へ申すべき詞もなしと知るべしと說ける也。此の大神の高大無邊なる御德は、高皇產靈神、神皇產靈神二神によりて顯現せらる。從つて森羅萬象の生々發展、皆此の二神の恩賴によらざるはなし。以上三神は、大宇宙、大自然を本體とせらるゝ神にましませば、勿論我が國のみの神にましまさず。實に世界的にまします也。神道は此の三神を淵源とす。以つて神道の本質の普通的なるを知るべし。古傳は更に進んで可美葦牙彥舅神のなりませるを傳ふ。蓋し現當世界の萬物の最初の神也。それより種々の神聖を經て天照大神の出現を仰ぐに至る。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 5
    "url": "https://dl.ndl.go.jp/pid/943545/1/6"
    "printed_page": "2"
    "printed_page_end": "3"
  "translation_ja": "れる天御中主神は、無限にあまねく存在しておられるのだから、この神がおられない場所はどこにもない。そこで平田篤胤は、この大神は始まりのない昔からおられるので、最初の神であることはいうまでもなく、そのご功徳が広大であることは、称える言葉もないと心得るべきだ、と説いたのである。この大神の高大で限りない徳は、高皇産霊神と神皇産霊神の二神によって現される。したがって、森羅万象の生成と発展は、すべてこの二神の恵みによるのである。以上の三神は、大宇宙、大自然を本体とされる神なので、もちろん日本だけの神ではない。まさしく世界的な神なのである。神道はこの三神を根源とする。これによって神道の本質が普遍的なものであると分かる。古い伝承はさらに、可美葦牙彦舅神が出現したと伝える。これは、現実の世界の万物の最初の神である。それからさまざまな神聖な存在を経て、天照大神の出現を仰ぐに至る。"
  "translation_status": "reviewed"

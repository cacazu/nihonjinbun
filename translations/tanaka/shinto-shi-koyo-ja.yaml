  "source_variants":
  - "kind": "ocr"
    "text": "〓以つて萬邦に照臨し、天の仁を體し、天の明に則り、天の威を奮ひ、以つて萬邦に照臨せらる。(新論)と。而して曰はく、神聖既に神道を以つて〓を設く。民心を緝收する所以のもの、專ら一より出づ。固より成規あり。而して天に事へ先を祀るの意、之れを後世に傳ふ。民、本に報い、始に反るの義を知る。(同上) x。かくて彼れは、堯舜周孔の道、天祖の葬訓と大いに同じと說けり。是に於いてか、彼れは、佛〓を罵りて「神明の邦を變じて、以つて身毒の國となし、中原の赤子を駈りて、以つて西戎の徒屬となす」と云ひ、儒佛的神道を嘲りて、「儒佛を剽竊してその言を緣飾し、以つて口を糊するの資となす」と云ひ、而して我が宣長を攻擊しては、曰はく、本居の翁、數千歲の後に生れ、開關以來一人も云へることなき無稽の妄說を造言し、數千歲知るものなくして、是を知りたるは己一人の天の明に則り、天の威を奮ひ、堯舜の道みなりしと思へるか。然らば開闢以來天地闇夜にして、本居に至て始て明なりと云はんか。數千歲本居の道なしと雖も、世道人心に於いて一も闕けたることなかりしに、今新に一箇の道を作り出して何の用をかなさんや。上古より人々離れ得ざるは天下の公道也。古より知るものなく是を離れ居りて害もなかりしを、獨、智を以つて作り出して、數千載の公道と相反するは一己の私言也。(讀直日靈)と。蓋し宣長は力を極めて儒〓を排斥せるもの、而して正志は神儒一致を說き、大いに堯舜周孔を尊敬祖述せるもの。その說の一致せざる素よりその所也。正志を承けて栗田寬あり。亦水戶に出づ。文科大學授〓文學博士たり。明治卅年一月廿六日を以つて逝く。年六十五。その說に曰はく、天地開闢の始、未だ文字あらざるの時、天祖あり、天神あり、天祖の行ふ所、天神の言ふ所のもの、萬民從つて之に經由し、之に遵奉し神道史綱要毫栗田寬"

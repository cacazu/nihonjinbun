  "source_variants":
  - "kind": "ocr"
    "text": "층玆に聊かその學說の一斑を吾人他日之れを世に紹介せんと欲すと雖も、玆に聊かその學說の一斑を示すべし。彼れは大道を說き曰はく、祭を嚴にし政を正しくし、天下を整給ふ事はしも、皇祖天神より、皇御孫命に附與し奉給ふ天統高御座の御職にして、此餘に道なく、此餘に〓無く、實に隨在天神の大道此なり。(祝詞講義)と。以つて儒佛の如きは、私道私〓にして何人も眞に之れを實行する能はざる道なるも、此の大道は如何なるものも能く行ひ得、又行はざるべからざる道なりとし、進んでその大道を、皇祖天神の御規則に因て、須臾も離るまじき道なるが、君君たり、臣臣たり、父父たり、子子たる當然の道を云ふなり。孝德天皇御「紀」に、惟神者謂隨神道亦自有神道也と有る如く、皇祖天神の御規則即天下公正の大道にして、隨神道とは此に因准するを云ふなり。(同上)重胤の學說と說明し、而して之れを更に詳に說明して曰はく、天皇と在しては皇祖天神の授給ふ御事の依隨に、天社國社の皇神等を齋祀らせ給ひて、天下公民を撫給ひ重給ひて萬國を經綸給ふを以て隨在天神の御行業と申奉るべく、臣下と有ては天皇の行はせ給ふ御行業に違奉らず、淨く明き心を以て仕奉り、大御政を輔相ひ輔佐け仕奉+て、天下を安泰からしむべく、又大御世を無窮に傳させ給ふ中には、邂逅に神代の御規則に背はせ給ふ事も絕て無しとは申可らず。然もあらば臣の臣たる道を以て諫奏奉りて、君をして君たらしむるぞ臣下たる人の隨在天神なる美德と云可く、公民としては左にも右にも上の御趣けに因准ひ奉り、各も各も神賦の家業を守りて、衣食住の資となし、身を修め、德を行ひ、世の爲、人の爲に功德を建て相助け相救ひ、己じを棄、佗を起し、隨在天神の大御政の少しも安からむことを須臾も忘るべからず。如此く爲る時は父子親愛有り夫婦愛敬ありて人道の極み、神道史綱要츠"

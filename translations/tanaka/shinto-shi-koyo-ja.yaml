  "translation_ja": "真淵は元禄10年、遠江国敷智郡岡部に生まれた。通称は参四、後に衛士と改めた。真淵はその名である。父は岡部の新宮の禰宜、定信、母は竹山氏。幼いときに姉の夫政盛の養子となったが、後にそこを去り、浜松の本陣、梅谷甚三郎方良の養子となった。初めは徂徠派の渡辺蒙闇に学んで漢籍や詩文を修めたが、壮年になると古道の学に心を傾け、春満に会ってますますその志を深めた。篤胤はこう記している。「このころ浜松に二人の友がいた。諏訪社の大祝杉浦信濃守国顕と、五社の神主森民部少輔暉昌である。この二人はともに東麿先生の弟子であり、そのうえ国顕の妻マサキは荷田先生の姪であったので、先生が江戸へ赴くときには、この家に泊まられた。そのため、この人々の取り"

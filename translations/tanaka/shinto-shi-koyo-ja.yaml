  "source_text": "神佛習合は、我が國の諸神を以つて印度の諸佛と元來異るものにあらずとし、神佛の衝突を巧に脫せんとせるにあり。その濫觴は蓋し聖德太子の言にありと云ひ得べし。『大日本史』に曰はく「敏達帝十四年馬子疾あり、奏して佛に禱らんことを請ふ。帝固より佛を好まず。太子聖徳に謂ひ曰はく、我が國自ら神あり。今馬子異域の神を祭らんことを請ふ。之れを爲す如何。太子曰はく諸佛の道諸神亦敢へて違はず」(皇子列傳)と。遂に帝は馬子の請を允し給ひぬ。已にして行基出で、盛に神佛を習合し、聖武天皇を勸めて東大寺の大佛を建て、伊勢の太神宮と相對せしめぬ。天皇"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 9
    "url": "https://dl.ndl.go.jp/pid/943545/1/10"
    "printed_page": "10"
    "printed_page_end": "11"
  "translation_ja": "神仏習合は、日本の神々とインドの仏たちはもともと異なるものではないとして、神と仏の衝突を巧みに回避しようとするものである。その起こりは、おそらく聖徳太子の言葉にあるといえる。『大日本史』には、「敏達天皇14年、馬子が病気になり、仏に祈ることを願い出た。天皇はもともと仏を好まなかった。天皇は聖徳太子に、『わが国には自らの神がある。今、馬子は外国の神を祭ることを願っている。これを行うのはどうか』といわれた。太子は、『仏たちの道には、神々も決して背きません』と答えた」（皇子列伝）とある。ついに天皇は馬子の願いを許された。その後、行基が現れ、盛んに神と仏を習合し、聖武天皇に勧めて東大寺の大仏を建て、伊勢の太神宮と対置させた。天皇"

  "source_text": "彼れは天神地祇に就いて曰はく、『神祇令』に、「凡天神地祇者、神祇官皆依常典祭之」また「凡天皇即位總祭天神地祇」とあり。天神とは天上にまします神、また天よりこの國土に降り坐る神を稱すなり。その天地の神八百萬群神坐します中に、別に由緣ある神たちを、國々に社定めて祭給へる事、大御政の機原にして、太古より皇朝の大道なり。(神社私考)と。かく彼れは諸國に神社を建てゝ、天神地祇を祭祀するは、皇朝の大道なりとし、以つて此れ等の諸神に就いて種々の研究を行へり。"

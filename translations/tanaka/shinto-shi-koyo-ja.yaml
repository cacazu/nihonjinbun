- "id": "ssk-p0024-marginal-01"
  "section_id": "main-text"
  "kind": "heading"
  "origin": "source"
  "source_text": "最上の大道"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 23
    "url": "https://dl.ndl.go.jp/pid/943545/1/24"
    "printed_page": "38"
    "printed_page_end": "39"
  "translation_ja": "最上の大道"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"
    "original_unit_id": "943545_0000024"
    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "元ことなく、天下は穩に治まりて、天津日嗣いや遠長に傳はり來坐せり、さればかの異國の名にならひていはゞ、是ぞ上もなき優れたる大き道ニにして、實の道なるが故に、道てふ言なく、道てふことなけれど、道ありしなりけり。(直毘靈)と。かくて、彼れは我が上古に大道は嚴として行はれしと雖も、而かも敢へて之れを道と稱せず。後、彼れの文物輸入せられ、道なる文字の用ひらるゝ場合を知り、初めて我が大道に名くるに神の道を以つてせりとなせり私淑言)。然らば則ち、支那·印度の思想を混入せざる我が固有の大道なるものは、抑も如何なるものぞ。是れ宣長の全力を擧げて主張せる所の大いなる道也。彼れは曰はく、此道は、『古事記』·『書紀』の二與に記されたる、神代·上代の、もろ〓〓の事跡のうへに備はりたり。(初山踏)と。更に曰はく、最上の大道神代·上代の、もろ〓〓道は、此二典にしるされたる、神代のもろ〓〓の事跡のうへに備はりたれども、儒〓佛などの書のやうに、其道のさまを、かやう〓〓と、さして〓へたることなければ、かの儒佛の目うつしに之を見ては、道の趣、いかなるものとも知りがたく、とらへどころなきが如くなる故に、むかしより世々の物しり人も、之をえとらへず、さとらずして、或は佛道の意により、或は儒道の意にすがりて、之を說きたり。其內、昔の說は、多く佛道によりたりしを、百五六十年以來は、かの佛道によれる說の非なることをばさとりて、其佛道の意をばよくのぞきぬれども、その輩の說は、又皆儒道の意に落入て、近世の神學者流みな然なり。其中にも流々ありて、すこしづゝのかはりはあれども、大抵みな同じやうなるものにて、『神代紀』をはじめ、もろ〓〓の神典のとりさばき、たゞ陰陽八卦五行など、すべてからめきたるさだのみにして、いさゝかも古の意にかなへることなく、說くところ悉皆儒道にて、た神道史綱要元經典なし"
    "source_locations":
    - "source_id": "ndl-943545-ocr"
      "precision": "page"
      "source_sequence": 23
      "url": "https://dl.ndl.go.jp/pid/943545/1/24"
      "printed_page": "38"
      "printed_page_end": "39"

    "text": "三陰陽五行及び宋儒の說を取捨してその學說を構成せり。殊に注目すべきは、彼れが親房·兼良二卿と同じく三種の神器を尊重せることなり。曰はく、「事を云へば三種の靈賓理を云へば天子の御心也。三種の靈寶は收まりて胸中にあり。胸中は三種の靈寶に現はる」(神代卷家傳聞書)と云ひ、事相より云へば、天照大神の授與せられし以前にはなきも、理より云へば己に存せしとし、曰はく、「其理は、伊弉諾·伊弉冉尊、天瓊戈を得玉ひし所より備はりて、天地自然の靈寶也。それを天照大神の受續給ひて、今三種の神器として御附屬あるぞ。事相を以て御附屬ある事、甚深微妙の義、吾國萬國の最上たる事、此一事に明白也」(同上)と云ひ、進んで「三種は鼎の三足の如し、寔に神道の肝心、王法の樞機、代々の御守りとして國土普き光也」(同上)と說きぬ。惟足と同時に度會延佳あり。「神道と云は、上人より下萬民まで行ふ且暮の道なり。天神地神より相傳の中極の道を根として行ふ時は、日用農會延佳の間、神道ならずと云事なしさして是は神道なりと々指南に及べき道にはあらず」(大神宮神道或問)と云ひ、又、「中極の道を神道と云事なれば、三中道を修行し、正直の御〓を信じて、本心に任し、又正しきに從ふて以つて〓淨と爲、惡に隨ふて以つて不淨とすとの神記を恐れて、起居動靜キヨクイサギヨクイモホリツェシミに、心の塵を去り、黑心なく、丹心を以つて、〓淨齋愼、左物を右に移さず、右物を左に移さず、左を左とし、右を右とせよとの御〓を守りて、天下の主にてましまさば、天下萬民をあはれみ給ひて、君上の御職分をつくし給ひ、諸臣下は右の御〓を守りて忠をつくし、君につかへたてまつり、一國一家上下も、亦かくの如く、父子、夫婦、兄弟、朋友も、彼の御〓を守りて、父子、夫婦、兄弟、朋友のすべき道をつくし、士農工商までも、かの御〓に順ひて、其の職をつとむるを、左を左とし、右を右とすと申すなり」(同上)と說き、盛に一家の神道を講ぜり。延佳の神道を聞き、更に惟足の說を承け、惟足より埀加靈社の號を授神道史綱要三山崎闇齋"

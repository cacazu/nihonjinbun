  "translation_ja": "山王神道に続いて起こったものを、両部習合神道という。これを両部神道とも呼ぶ。両部神道は空海が始めたといわれる。しかし山王神道と最澄の関係と同じく、両部神道が本当に空海によって始められたのかどうかも、大きな疑問である。たとえば『麗気記』は、空海の作として高野山に秘伝の書として伝わったとされていたが、後世の人の偽作であることは、諸家の一致した見解である。それでもこの神道は、山王神道と同様に、神仏一致説が当然にもたらすはずの結果であり、空海のような仏教家によって、少なくともその一端が始められたであろうことには、ほとんど疑いを入れる余地がない。そこで私たちは、この神道も空海が端緒を開き、後に真言宗の人々が発展させたものと考える。そして北畠親房が、日本では神代以来の由来がこの宗の説と符合しているといい、まったく両部神道"

  "source_variants":
  - "kind": "ocr"
    "text": "めて多し。享保中に江戶に遊びて聲名あり。特に內命ありて侍臣某をして從遊せしめて、古書を校せしめ給ふ。居ること數年にして疾を得て京に歸らる。已にして伏見奉行北條遠江守をして、內命を傳へて銀若干を賜ふ。大人嘗て國學校を創立する志ありて。上書して執事に啓するに未だ報あらずして歿せり。其志は遂げざれども、其言は傳ふべLo (玉襷) to又、曰はく、此翁の著書春滿は著はす所少かさりしも其の大部分は終焉に臨みは、故ありて一門人をして皆焚かしめぬ。世に傳れる物少けれども、すべて吾が古學の規則は、此翁に相立初申候(入學問答)と。以つて春滿は嚴格なる意味に於ける古道學の祖となすべき也。彼れ常に曰はく學びの道は、天の下の大路なれば、己ひとり立らむが如くほこるべ國學校此翁に相立初申彼れ天の下の大路なれば、己ひとり立らむが如くほこるべからず。學ぶ人も師の〓なりとてあながちに泥むべからず。(春葉集序と。此の訓陶を受く、その門下豈に偉器なからむや。果して賀茂の眞淵その門に出でぬ。眞淵は元祿十年を以つて遠江國敷智郡岡部に生る。通稱參四。後改め1て衞士と云ふ。眞淵はその名也。父は岡部の新宮の禰宜定信、母は竹山氏幼にして姊夫政盛の養子たりしが、後去りて濱松の本陣、梅谷甚三郞方良の養子となりぬ。初め徂徠派の渡邊蒙闇に就いて漢籍詩文を修めしも、壯なるに及び心を古道の學に傾け、春滿に見えて益々その志を深くせり。篤胤記して曰はく、此のほど濱松に二人の友あり。諏訪の社の大祝杉浦信濃守國顯と、五社の神主森民部少輔暉昌となり。此二人ともに東麿大人の〓子なるに、况て國顯が妻マサキといひしは、荷田の大人の姪なりなりしかば、大人江戶に物せらるゝ時々は、此家に宿られける。故に此人々の執り神道史綱要元賀茂眞淵"

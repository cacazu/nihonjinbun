    "printed_page_end": "55"
  "translation_ja": "隆正の通称は仲衛で、葵園・如意園・佐紀の屋などの号がある。姓は藤原、初め野々口と称し、後に大国と改めた。寛政4年に江戸で生まれた。父は秀馨といい、津和野藩士であった。文化3年に篤胤の門に入ったが、ほどなく父の命で昌平黌に学び、古賀精里に教えを受けた。その後、日本に生まれながら皇学を修めずに漢籍を学んでよいのだろうか、まず皇学を修め、その後に漢籍へ進むべきだと考えた。文化7年に昌平黌を辞し、各地に遊学した。やがて父が老いたので家を継ぎ、藩の大納戸武具役となった。たまたま同僚に不正を働く者があり、隆正は災いが及ぶことを恐れて逃亡した。その後は学問に専念し、造詣が非常に深くなった。天保7年、播磨の小野藩に招かれ、帰正館を開いて藩の子弟を教育した。当時、ある儒者が『駁本居翁書』を著して宣長の説を攻撃した。隆正は門人鈴木重胤の願いに従って『憐駁者』を著し、これに反駁した。「ある儒生が外国の聖賢をむやみに称えるあまり、『駁本居翁書』と題する書を筆"

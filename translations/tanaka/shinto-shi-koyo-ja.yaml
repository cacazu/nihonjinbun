  "translation_ja": "ここで八幡大神について述べたものを少し掲げる。「八幡の本宮は、『帳』の豊前国宇佐郡に三座、いずれも大社として、八幡大菩薩宇佐宮〔大・名神〕、比売神社〔大・名神〕、大帯姫神社〔大・名神〕と並べて載せられている。この三所は同じ場所にあり、全体を八幡神、八幡宮、また八幡三所神と呼んできた。この神が古く史書に見えるのは、『続日本紀』の聖武天皇の時代に、『天平9年4月乙巳、伊勢神宮、大神社、筑紫の住吉・八幡の二社および香椎宮に使いを遣わし、幣帛を奉って、新羅の無礼な様子を告げた』とあるものである。また菩薩号を称されたことが書物に見えるのは、大同3年7月丙申の太政官符に、『国司に八幡大菩薩宮の雑物を出納させるべき件。右、大宰府の解を得るに、太政官の去る延暦18年11月5日の符に、大宰府の解には、太政官の"

    "printed_page": "68"
    "printed_page_end": "69"
  "translation_ja": "て違わないことを道といい、教えという」という。このように、水戸流の特色を持って、儒教により神道を説いた。もちろん神道を主とするものであり、「赤い髭と緑の目をした異類」など、しばしば極端な言葉を使ったが、一方で、「後世の学者は狭い見解を持ち、同じものを合わせ、異なるものを兼ねることができない」といい、偏狭になってむやみに他を排斥することを嘆いた。これによって志のあるところが分かる。"

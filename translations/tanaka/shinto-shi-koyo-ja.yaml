  - "kind": "ocr"
    "text": "吾なり。考へ玉へ云云。と以つてその人となりを見るべし。弘化三年十月十四日病んで京都に歿す。年七十四。若狹國發心寺に葬る。著はす所、『神社私考』『假字本末』『鎭魂傅』『信友隨筆』『正ト考』等百有餘部、『日本紀』等校訂せるもの五十餘部。信友は常にその書齋の床上に、シ孔子の「述而不作信而好古の書軸を揭げ、吾が意を得たりとせるものなれば、その學風亦篤胤の如きと全く相反し、終始考證是れ事とせり。從つて距厲風發の學說は信友に期すべからず。彼れは實に正確なる考證の大家なりき。吾人茲にその神道哲學に關せる事項に就いて、彼れの考證學の一斑を示さむ。彼れは天神地祇に就いて曰はく、『神祇令』に、y「凡天神地祇者、神祇官皆依常典祭之」た「凡天皇即位總祭天神地祇」とあり。天神とは天上にまします神、また天よりこの國土で;に降り坐る神を稱すなり。その天地の神八百萬群神坐します中に、ニ別述而不作考證學に由緣ある神たちを、國々に社定めて祭給へる事、大御政の機原にして、太古より皇朝の大道なり。(神社私考)と。かく彼れは諸國に神社を建てゝ、天神地祇を祭祀するは、皇朝の大道なりとし、以つて此れ等の諸神に就いて種々の研究を行へり。茲に聊か八幡大神に就いて彼れが述べし所のものを揭ぐべし。曰はく、ハ名神、八幡の本宮は、一八七に豐前國字佐郡三座メート、八幡大菩薩宇佐宮大比賣神社大名神大帶姬神社大名神と並べ載せられて、此三所同地に坐すを、惣ても八幡神と申し、八幡宮とも、又八幡三所ノ神とも申來れり。此神の古く史に見え給へるは、『續日本紀』、聖武天皇の御世に、「天平九いシニ年四月乙巳、遣使伊勢神宮·大神社筑紫住吉·八幡二社及香椎宮、奉弊以告新羅無禮之狀」とあり。又菩薩號を唱られ給へる事の書に見えたるは、大同三年七月丙申の太政官符に、應令國司出納八幡大菩薩宮雜物事右得太宰府解〓。太政官去延曆十八年十一月五日符備、府解〓、太政官神道史綱要五三大御政の機原にし皇朝の大道八幡宮のミ"

- "id": "ssk-p0010-003"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "夫れ此の如く朝廷には盛に固有の神道の維持發展に努められ、別に『古事記』『日本書紀』等を編纂せられ、神道思想の普及を計られぬ。而して我が國民の多數亦神道を奉ぜりと雖も、然かも我が國民には由來新を趨ひ奇を好むもの尠からず。かゝる國民は今や茲に無量無邊の福德果報を生ずと云ふ佛を見ては、之れを信ぜんと欲せざるを得ざる也。又我が國民には、文明の進歩に伴ひ、當時己に幽玄なる學說に渴仰せるものも尠からず。かゝる國民は亦佛教によりて慰安を得んとせり。かく種々の事情よりして漸次佛教を信ぜんとせるものを生じ來れり。たゞ極めて冷靜なる頭腦を有せるものにあらざるよりは、直に之れに歸し去る能はず。即ち多くは神道思想によりて鎔鑄陶冶せられたる强き精神權威の爲に容易に佛教に入る能はず。頗る煩悶の狀に陷れり。是に於いてか神佛習合の企圖を見るに至れり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 9
    "url": "https://dl.ndl.go.jp/pid/943545/1/10"
    "printed_page": "10"
    "printed_page_end": "11"
  "translation_ja": "このように朝廷では、固有の神道の維持と発展に盛んに努め、別に『古事記』『日本書紀』などを編纂して、神道思想の普及を図った。国民の多数も神道を信奉していたが、もともと日本の国民には、新しいものを追い、珍しいものを好む人が少なくない。このような人々は、限りない幸福と徳と報いを生むという仏を目にして、信じたいと思わずにはいられなかった。また、文明の進歩に伴い、当時すでに深遠な学説を渇望する人も少なくなかった。そのような人々も仏教によって慰めを得ようとした。こうしたさまざまな事情から、次第に仏教を信じようとする人々が生じてきた。しかし、きわめて冷静な頭脳を持つ者でなければ、ただちに仏教に帰依することはできなかった。多くの人は、神道思想によって形作られ鍛えられた強い精神的権威のために、容易に仏教へ入ることができず、ひどく苦悩したのである。そこで、神仏習合の試みが見られるようになった。"

  "source_text": "宣長は先づ神の意義を以つて、尋常に卓越せる德を有し畏るべき性能を有せるものとし、古典に見ゆる天地の諸の神だちを初めて、そを祀れる社に坐す御靈をも申し、又人はさらにも云はず、鳥獸木草までも皆かゝる德を有するものは神となしぬ。從つて宣長は神に善惡ありとし、吉凶禍福も之れによりて生ずとなせり。されど彼れの主張にかゝる「神の道」の神なるものは、必ずしも鳥獸草木までも意味する神にはあらざるが如し。故に彼れ曰はく、「皇國の神道は、皇祖神の始め賜ひたもち賜ふ道なり」と。以つて彼れの神の觀念知るべき也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 21
    "url": "https://dl.ndl.go.jp/pid/943545/1/22"
    "printed_page": "34"
    "printed_page_end": "35"
  "translation_ja": "宣長はまず神の意味を、普通より優れた徳を持ち、畏れるべき能力を持つものとした。古典に現れる天地の神々をはじめ、それを祭る社に鎮まる御霊をいい、人間はもちろん、鳥獣や草木に至るまで、すべてそのような徳を持つものを神とした。したがって宣長は神に善悪があり、吉凶禍福もそれによって生じるとした。しかし彼の主張する「神の道」の神は、必ずしも鳥獣草木までを意味する神ではないようである。そのため、「皇国の神道は、皇祖神が始められ、保たれる道である」という。これによって彼の神の観念を知ることができる。"

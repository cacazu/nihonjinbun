  "source_alignment":
  - "source_id": "ndl-943545-ocr"
    "original_unit_id": "943545_0000030"
    "description_ja": "全文テキスト配布のコマ単位。複数段組・欄外見出しが混線するため、未確認の行単位境界は指定しない。"
  "source_variants":
  - "kind": "ocr"
    "text": "종くその卓見に服し、敬慕措かず。遂にその門に入らんとす。而かも紹介を托するものなし。人あり、村田春門の宣長が門人たるを告ぐ。乃ち春門を介して入門せんことを求む。春門快諾、書を松坂に致して、信友の名簿を送り、且つその志を〓ぐ。時に享和元年にして恰も宣長の歿せる後たり。嗣子大平信友の志に感じ、名簿を靈前に供へ門人に列す。當時信友年二十九、已に著書に着手し、以後年として殆んど二三種の稿を脫せざるはなかりき。文政四年に至り、病により仕を辭し、是れより全く學者の生活に入り、日夜書齋に蟄居し、社交を絕ち、書籍堆積の間に端坐し、深更に至るも筆を措かず。專ら著書研學に從事し、嚴寒酷暑と雖も一日も之れを廢せず。吾人此れ等の點に於いて遙に英吉利のスペンサーを聯想す。殊に信友が攝生の道を重んぜしは、全くスペンサーと一致せり。信友甞て杉田玄伯に攝生の道を問ふ。玄伯七不可を書して答ふ。七不可とは何ぞ、曰はく、「昨日非不可恨悔明日是不可慮念。飮與食不致仕七不可ニンド可過度非正物不可苟〓。無事時不可服藥。賴壯實不可過房勤動作不可好安」と。信友之れを得て深く喜び、能く之れを守りたりと云ふ。信友資性謙抑にして、名利を求めず、天下負笈の徒、その名を聞き來りてその門人たらんことを請ふもの甚だ多かりしも、皆之れを謝し曰はく、「吾が學、人の師たるに足らず」と。强ひて請はヾ乃ち之れを學友となす。本居大平の門人、加納諸平に與ふる書、その意の存する所を示せり。曰はく、生涯博士だちたる心を持ち玉はず、人にも書にも問ふことをな忘れ玉ひそ。自ら師とならんと思ふ一念あれば、直ちに學事に損なり。師と稱し候は、人より恭ふ稱なり。弟子と稱すれども、〓を受くるものゝ稱なり。師と云ひ弟子と云ふも、自らの口より云ふべき詞にあらず。殊に御國の學は、漢なとゝは樣子異れば、師弟の別はなき趣なり。講習討論の上座とか、長座とか云ふべきものか。但しこれは小子が私論神道史網要五一學友"
    "source_locations":
    - "source_id": "ndl-943545-ocr"
      "precision": "page"
      "source_sequence": 29

  "source_text": "を信ぜるに徵するに、兩部神道の行はれたるの當時己に久しかりしを明に認め得べし。此の神道は、山王神道が、天台教理に基けると同じく、全く眞言教理に基けるもの也。即ち伊弉諾·伊弉冉二神を金剛界·胎藏界に比し、或は內宮を胎藏界外宮を金剛界とするが如くにしてその神道說を組織せるもの也。"

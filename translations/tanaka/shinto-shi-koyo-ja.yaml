  "source_text": "長流は大和の人、宇多に生る。本姓小崎氏、母の姓を冐し下河邊氏を稱す。通稱彥六。名は具平、後長流と改む。夙に古語を研究し、造詣甚た深かりき。德川光圀、招きしも應ぜず。乃ち紙筆を與へて「萬葉」の注を求む。果さずして貞享三年六月三日歿す。行年六十三。圓珠庵の契沖は浪華の人、本姓は下川、字は空心。幼にして出家せり。學儒佛を兼ね、博覽多識、長流と同じく夙に我が古語を研究し、發明せる所多かりき。德川光圀の囑により『萬葉代匠記』を著はし、其他多くの著書をなして斯學に貢献せる所尠からざりき。元祿十四年歿す。年六十二。長流契沖の斯學に致せる功大は則ち大なりと雖も而かも、彼れ等は要するに語學者也。神道學者にはあらず。所謂古道學者とは謂ふべからざる也。"
  "source_languages":

- "id": "ssk-p0013-003"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "以上述べ來りたるが如くにして、山王神道及び兩部神道は天下を風靡せしも、而かも我が國民的精神の熱烈なるもの、殊に發展的膨脹的性格に富めるものは、かゝる神道を以つては、到底自己の精神の要求を滿足する能はざる也。かの唯一神道が、吾が神道は一陰一陽不測の元、國常立尊以降天照大神に至る玄々妙々の相承也。天照大神天兒屋命に教へ給ふ。爾してより以來、濁世末代の今日に至るまで、一氣の元水を汲んで、遂に三教の一滴を甞めずと呼號し、我が固有の神道を高尙なる哲學思想を以つて莊嚴せんとして起れる、實に能くその消息を漏せるものと謂ふべし。されど爾かく呼號の大なるにも係らず、その構成せられたる神道は、三教を嘗むること尠からず。試にその神道の名を見よ、唯一と云ふにあらずや。唯一の語は、『孝德天皇紀』には、帝道唯一の語ありと雖も、而かも世の學者は、一般に、『法華經』に、「唯有一乘法、無二亦無三」と云ひ、『寶積經』に、「一切諸佛、唯是一佛、說無量佛、是名神變、一切佛土、唯一佛土、說無量土、是名神變」と云へるが如きに基くものとす。蓋し事實なるべし。以つて唯一の語の佛教に基けるものなるを知るべし。更にこの唯一神道の內容を見るに、「吾が神道は、萬物に在りて一物を留めず。所謂風波雲霧、動靜進退、晝夜隱顯、冷寒温熱、善惡の報、邪正の差、統べて吾が神明の所爲に非るはなし。故に天地の心是れ神也。諸佛の心是れ神也。鬼畜の心是れ神也。草木の心是れ神也。何ぞ況んや人倫に於いてをや。意を以つて理を成す。意を以つて言を成す。意を以つて手足を爲す。皆是れ心神の所爲也。一切の含靈、神に非ずと云ふことなし。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 12
    "url": "https://dl.ndl.go.jp/pid/943545/1/13"
    "printed_page": "16"
    "printed_page_end": "17"
  "translation_ja": "以上述べたように、山王神道と両部神道は天下を風靡した。しかし、日本の国民的精神が熱烈な人、特に発展し拡大する性格に富む人は、このような神道では、自分の精神の要求を到底満たせなかった。唯一神道が、「わが神道は一陰一陽の測り知れない根源であり、国常立尊から天照大神に至る、深遠で不可思議な継承である。天照大神が天児屋命に教えられた。それ以来、濁世末代の今日まで、一気の源水をくみ、三教の一滴さえ味わわなかった」と声高に唱え、日本固有の神道を高尚な哲学思想で荘厳しようとして起こったことは、まさにこの事情をよく物語っているといえる。だが、それほど大きく叫ぶにもかかわらず、実際に構成された神道は、三教を取り入れることが少なくない。その神道の名前を見てほしい。「唯一」というではないか。「唯一」の語は『孝徳天皇紀』に「帝道唯一」とあるものの、世の学者は一般に、『法華経』の「ただ一乗の法があるだけで、二もなく三もない」、あるいは『宝積経』の「あらゆる仏はただ一つの仏である。無量の仏を説くのは神変という。あらゆる仏土はただ一つの仏土である。無量の仏土を説くのは神変という」といった言葉に基づくものとする。おそらく事実であろう。これにより「唯一」の語が仏教に基づくと分かる。さらに唯一神道の内容を見ると、「わが神道は万物に存在し、一物も残さない。風・波・雲・霧、動静、進退、昼夜、隠顕、冷寒、温熱、善悪の報い、邪と正の違いは、すべてわが神明の働きでないものはない。だから天地の心は神であり、諸仏の心は神であり、鬼や獣の心も神であり、草木の心も神である。まして人間においてはいうまでもない。意によって理をなし、意によって言葉をなし、意によって手足を働かせる。すべて心神の働きである。あらゆる霊を持つものは、神でないということはない。"

- "id": "ssk-p0015-001"
  "section_id": "main-text"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "種の神器は、神書の肝心、王法の樞機也。何をか王法と云ふ。蓋し儒佛二教一致の道理也。此れを除くの外、豈に異道あらんや。一致の理は亦一心に起り。心外に法なく、法外に心なし。心は即ち是れ神。法は即ち是れ道。一にして三、三にして一。故に三器は即ち一心の標幟也」(纂疏)と云ひ、旦つ曰はく、「孔丘の言に曰はく、仁者は憂へず、知者は惑はず、勇者は懼れず。子思『中庸』の書に、之れを三達德と云ふ。聖人の道、大にして博しと雖も、究めて之れを言へば、此の三者に過ぎず、鏡の妍媸を照すは即ち知の用也。玉の温潤を含むは、即ち仁の德也。劍の能く剛利なるは即ち勇の義也」(纂疏)と云ひ、更に三種の神器を佛教に比し、鏡の能く照すは般若也。玉の能く潔きは法身也。劔の能く斷ずるは解脫也」と說き、之れを一心に歸し、之れを根柢として、その神道を構成せり。要するに親房、兼良二卿は皆三種の神器を以つて其の神道說を成せり。三種の神器は我が國家の一大事實。二卿の着眼凡ならざるを見るべし。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943545"
    "precision": "page"
    "source_sequence": 14
    "url": "https://dl.ndl.go.jp/pid/943545/1/15"
    "printed_page": "20"
    "printed_page_end": "21"
  "translation_ja": "種の神器は神書の要であり、王法の中心である。何を王法というのか。儒教と仏教の二教が一致する道理である。これを除いて、別の道があろうか。一致の理も一つの心から起こる。心の外に法はなく、法の外に心はない。心はすなわち神であり、法はすなわち道である。一つでありながら三つ、三つでありながら一つである。だから三器は一心のしるしである」（『纂疏』）といい、さらに「孔丘は、仁ある者は憂えず、知ある者は惑わず、勇ある者は恐れないといった。子思の『中庸』では、これを三達徳という。聖人の道は大きく広いが、突き詰めていえばこの三つに尽きる。鏡が美醜を照らすのは知の働き、玉が温かく潤っているのは仁の徳、剣が硬く鋭いのは勇の意味である」（『纂疏』）という。さらに三種の神器を仏教になぞらえ、「鏡がよく照らすのは般若、玉がよく清らかであるのは法身、剣がよく断つのは解脱である」と説き、これを一心に帰し、それを根底として神道を構成した。要するに親房と兼良は、どちらも三種の神器によって神道説を立てたのである。三種の神器は日本の国家の一大事実である。二人の着眼が凡庸でないことが分かる。"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943545-ocr"

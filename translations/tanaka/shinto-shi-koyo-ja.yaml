    "text": "交て違ふことなきを道と云ひ、〓と云ふ。と。かくて彼れは水戶流の特色を帶びて、儒〓によりて、神道を說けり。而かも勿論神道を主とせるものにして、「朱髯綠眼の非類」など往々極端の言をなせりと雖も、又「後世學者狹隘の見を懷き、同を合せ、異を兼ぬること能はず」と云ひ、偏狹徒らに他を排斥するを歎せり。以つて其の志の存する所を知るべし。宗〓的神道は、吾人の已に述べたる中古の佛〓的色釆を帶びたる山王一實神道、兩部習合神道、唯一神道の如き、尙幕末に至るまで勢力を有し來りしが、別に幕府の初期に長谷川角行なるものあり。皇國は萬國の宗國にして、富士は地球の鎭守たりとし、富士講を初めたり。されど富士講には種々の弊害ありしかば、幕府は之れを禁止したり。德川時代にありて、宗〓的神道を鼓吹して其の名を知られたるものに、黑住宗忠あり。宗〓的神道黑住宗忠宗忠は備前の人、安永九年を以つて生る。生れて至孝、年三十三、父母の死に遇ひ悲哀の極に達せり。窮すれば則ち通ず。遂に豁然悟る所あり、一派の神道を創む。嘉永三年歿す。年七十一、後宗忠大明神の宣下を蒙る。その說、「神國の人に生れ常に信心なき事」「腹を立、物を苦にする事、「己が慢心にて人を見下すこと」など七箇條の信條を示し、天照大神を主神とし、極めて熱心にその神道を說きたり。之れを黑住〓と云ふ。宗忠と殆んど同時に井上正鐵あり。正鐵は武藏の人、寛政二年を以つて生る。長じて白河家の門に入り遂に一家を成せしかば、信徒日に集る。新說世を惑はすの嫌疑により、伊豆の三宅島に流さる。島民その〓を奉ず。嘉永二年二月島中に歿す。年六十。明治維新の後、その信徒等相議して禊〓を立せり。幕末の宗〓的神道を唱へたるものに、尙川手文治郎あり。竹澤寛三郞あり。又記する所あるを要す。神道史網要充井上正〓竹澤寛三充"

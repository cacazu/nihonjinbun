  "translation_ja": "それから、昔からタブー（Taboo）の精神があります。これは南洋の言葉ですが、わが国の言葉なら、禁忌に当たるでしょう。神はすべて穢れを嫌われる。神に仕える人は、身を慎み清めて仕えなければならない。また、神に関わる物に、むやみに触れたりすることはできない。そうしたタブーの観念です。これらはみな、敬虔の感情の現れです。とりわけ、何か事を行うときは、神の御意思を伺って行います。これを太占といいます。「太」は称え言葉で、今日の「大日本帝国」の「大」に当たります。「占」は「まにまに」、すなわち御心のままにという意味です。神の御心はどのようなものか、このことをどうすればよいかを、みな神の御心に伺う。それは今日では占いといいます。占いとは、心を合わせるということで、心のことを昔は「裏」といいました。なぜ心を裏といったかというと、顔を「面」というのと同じ関係です。顔は誰にでも分かります。顔つきを見れば、あの人は喜んでいるな、あの人は悲観しているな、とすぐに分かる。それは表ですから、これだけは隠すわけにいかない。うれしいけれど見られてはいけないと、扇子で隠して歩くわけにはいきません。〔笑い〕顔だけは、どんなときにも出して歩かなければならず、人にすぐ見られてしまいます。どれほど喜怒を顔に出すまいと努めても駄目です。しかし、心は包まれていて、人には見えません。そこで、心を裏といったのです。神の御心は、それ以上に分かりません。そこで鹿の肩の骨を取り、適当な大きさに切って、これを樺桜という、一種の桜の木ですが、"

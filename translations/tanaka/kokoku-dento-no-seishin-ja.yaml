    "text": "かういふ具合で吾々は外來思想をみな取入れるのであります。さうして我傳統の精神を發展して來る。我傳統の精神はさういふ偉大なものでありますけれども、それを說明してそれを發表する上に於て、丁度例へて見ますと吾々の體のやうなものでありまして、吾々の體はこれ大和民族といふので、この體は西洋などから見ると、黃色人種などゝ言つて賤みますけれども、併しこの體は吾々が祖先から承け權いだところの立派な體です。有難い體です。殊に日本國民は優秀な身體を持つて居る。一體人間の偉いといふのは何が偉いのですか、體力が强いことが偉いのではありますまい。重い物を持上げるのが偉いのではありますまい。若し力が强いのが偉いならお角力さん、横綱などは日本では偉い人になる。横綱を大先生として、大動位、公爵にでもなさらなければならぬ。(笑聲)ところが體の强い丈けでは何にもなりませぬ······ならぬのではない。横綱にはなれますけれども、吾々國民がそれを崇敬する譯には行かない。さうして見ると人間の偉いのは體ではなくして精神であります。精神の偉いのは體の生理的に言ふと何に因るのかといふと、腦髓に因ると申されて居ります。今日の生理學では、髓髓に因るといふことになつて居ります。處が日本では解剖といふことは極く最近、四.五十年來でありますが、西洋では何百年と解剖して居りますから、昔の偉い人の腦髓がみな取つてあります。我國でも近來腦髓がみな取つてありまして、桂公爵の腦髓だとか、夏目漱石先生の腦髓だとか、あゝいふやうな腦髓が帝大の病院の中に保存して居ります。この間亡くなつた杉山とかいふ方の腦髓も保存することになつたとかいふことであります。西洋ではそれで昔から腦髓が保存して統計が取られてあると云ふことでありますが、その腦髓の目方の重いのが偉いといふことである。この間なくなつた杉山さんのは餘程重かつたといふことでありますが、日本でも桂公爵、夏目漱石先生の腦髓は非常に重いといふことであります。平凡な人の腦髓は輕くて偉人の腦髓は重い。西洋でもビスマークといふ人の腦髓は特別に重い。よくビスマークの頭が「毒滅」といふ梅毒の薬の看板に使はれて居りましたが、ドイツの大使館から外務省に、早速撤去して貰ひたいと抗議を申込んで來たさうであります。(笑聲)そこで外務省から內務省に通牒して內務省からあれを禁ずることになつた。あれで梅毒の「毒滅」のビスマークは止すことになつたと云ふことであります。(笑聲)さういふ具合で腦髓の重量に因つて智愚賢不肖がきまるのです。ところがどうでせう、西洋人の平均の腦髓と日本人の平均の腦髓と較べて見ますと、日本人の方が少し輕いといふのです。さうして見ると日本人の方が西洋人に劣つて居るかといふ具合に感ぜられますが、腦髓の重量といふものは、決して絕對の重量が重いのでは駄目です。詰り體に比例するのですから、若し體ごなしにして腦髓の重さだけで言つて見ると、象だの、鯨だのといふのは一番偉くなつて終ふ。(笑聲)象や鯨はあらゆる生物の中で一番重い腦髓を持つて居るけれども、どんなに重い腦髓を持つて居つてもあの大きな體にするとポツチリ"

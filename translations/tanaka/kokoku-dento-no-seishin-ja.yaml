    "text": "第二には秩序の觀念でありますが、秩序の觀念と申しますと、ものをキチンとする觀念です。これが本來日本國民には非常に强い。日々仕事をしましても仕事を終へた時には風呂に這入りませう。この風呂へ這入るといふやうなことが日本國民の一つの特色であります。このことが上代からある。昔、伊邪那岐命が黃泉の國の穢れを筑紫の小門の阿波岐原に於て譲ぎ遊ばしたといふことが傳つて居ります。これは詰り上代にさういふ風があつたことを示されて居るのであります。上代人は右のように正直でありましたから、體も綺麗にしますと同時に、精神も綺麗にしました。ですから我國には溫泉といふものが古代から非常に發達して居る。私昨年伊豫の道後の溫泉に這入つて參りましたが、傳へるところに依ると、道後の溫泉は少名民古那神が御創めになつたといふことであります。少名毘古那神といふのは出雲大社に祭つてある大國主神と御兄弟に御なり遊ばして、この大八洲を御經營なさつた御方です。勿論神代でありますが、その頃旣に伊豫の道後の溫泉を御開きになつたといふのであります。さう云ふ風に、我國には溫泉といふものが非常に大昔から發達して居ることはいろ〓〓な事實に依つて、認めることが出來ます。この前でありましたが、私が但馬の方へ行きましたら、三朝溫泉といふのはラジウムも餘程出るといふ話でありましたが、その附近の講習會に行きましたので、その溫泉に一度這入つて置きたいと申しまして、そこへ連れて行つて貰ひました。そこへ行きますと、溫泉宿は相當ありますが、そこに川がありましてその川の中で溫泉が出る。それを附近の人は皆川の中で溫泉に這入つて居る。屋根も何にもない、私はそれを見てこれは太古の風があるなと思ひました。熱海などゝといふところは、海の中に湯の出る所がある。それで熱海といふ名が出たといふのでありますが、さういふのは矢張り大昔の風習から海岸へ行つて砂で風呂を拵へて這入る。これは極めて簡單なのです。どんな人でも出來る。子供でも出來る譯です。さういふ具合に入浴しまして體"

- "id": "kds-p0016-003"
  "section_id": "chapter-kds-p0016-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "基督敎などでは能く神の愛と云ふことを申しますが、我が國にはさう云ふ風なものがないと申して居ります。併しそれは間違ひで、我が傳統の精神には慈愛の精神には富んで、上代から其範が示されて居ります。卽ち皇室に於かれましては、非常に國民を愛護せられて居るのであります。例へば伊邪那岐命が黄泉の國にお出でになりまして惡魔の爲に非常にお苦しみになり、黄泉比良坂といふところに逃げてお出でになつたが惡魔が益々追つて來ます、その時に桃の實があつて伊邪那岐命をお助けしたといふことになる桃の實が惡魔を退治するといふことは支那でもあるのでありますが、我國の昔にもあつたのであります。これは桃の實と言うても、實は實際の神樣であらうと思はれます。今日でも人の名に動物や植物の名前があつて、お梅さんとか、お虎さんとかいふ名前が女にあるでせう。「この使には梅をやれとか、この使はトラに限る」とか、かう言ふと本當の虎かと思ふが矢張り梅干でも虎でもない。お梅といふ人間、或は梅太郞といふ人間である。(笑聲)或はお虎さんである。或は寅吉である。さういふ譯で動物、植物の名前は今日でも人の名前に付けますが、上代でも神樣の名前に付いて居つたのであります。その桃の神樣が伊邪那岐命をお助けして、命は虎口をお逃がれになつた。そこで伊邪那岐命はいまし吾を助けしがごと、葦原の中つ國にあらゆる現しき靑人草の、苦瀨に落ちて苦しまん時に助けてよと仰せられた。今お前が私を助けて呉れた如く、この葦原中つ國の現しき靑人草、卽ち多くの人民が困難に際會した時にはかういふ具合に直ぐ助けてやつて吳れと、自分のことを忘れて直ぐ人民のことをお考へになる。その厚き慈愛の御心を知るべきであります。或は穀物の神樣が御殺されになつた時五穀が出來ましたら、天照大御神樣は、是の物どもは則ち顯見蒼生の食ひて活くべきものなりと言つて非常に御喜びになつた。卽ちこの五穀といふものは人民が皆食べて生活するところのもので、このものがこゝに出來たことは、實に有難いことだと言うて御喜びになつた。何でも事ある每に人民のことを御考へになる。詰り人民を公民卽ち大御寶としてこれを御愛護遊ばすといふのが皇室の御精神であります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 15
    "url": "https://dl.ndl.go.jp/pid/1092188/1/16"
  "translation_ja": "キリスト教などでは、よく神の愛といいますが、わが国にはそうしたものがないといわれます。しかし、それは間違いです。わが伝統の精神は慈愛に富み、上代からその手本が示されています。皇室は、国民をたいへん深く愛し、守っておられるのです。例えば、伊邪那岐命が黄泉の国に行かれ、悪魔のために非常に苦しみ、黄泉比良坂へ逃れてきましたが、悪魔はなおも追ってきます。そのとき桃の実があり、伊邪那岐命を助けたという。桃の実が悪魔を退治するという話は中国にもありますが、わが国の昔にもあったのです。これは桃の実といっても、実際には神であったと思われます。今日でも、人の名前に動植物の名があって、女性にお梅さん、お虎さんといった名があるでしょう。「この使いには梅をやれ」「この使いはトラに限る」といえば、本当の虎かと思うけれど、梅干しでも虎でもない。お梅という人、あるいは梅太郎という人です。〔笑い〕または、お虎さん、あるいは寅吉です。このように、今日も動植物の名を人名に付けますが、上代にも神の名に付いていたのです。その桃の神が伊邪那岐命を助け、命は危地を逃れられました。そこで伊邪那岐命は、「お前が私を助けてくれたように、葦原の中つ国の、すべての生きている人々が、苦難に陥って苦しむときには助けてやってくれ」とおっしゃいました。今、自分を助けてくれたように、葦原中つ国の多くの人民が困難に遭ったときも、すぐに助けてやってほしいと、自分を忘れて、ただちに人民をお考えになる。その深い慈愛の御心を知るべきです。また、穀物の神が殺されたとき、五穀が生まれました。天照大御神は「これらは、現世の人民が食べて生きていくべきものだ」といって、たいへん喜ばれました。つまり、五穀は人民がみな食べて生活するものだから、ここに生まれたことは本当にありがたいと喜ばれたのです。何かあるたびに、人民のことをお考えになる。人民を公民、すなわち大御宝として愛護されるのが、皇室の御精神です。"
  "translation_status": "reviewed"

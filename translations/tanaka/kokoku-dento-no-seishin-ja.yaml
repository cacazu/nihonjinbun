  "translation_ja": "まず皇室、すなわち天照大御神が始められた皇室の尊厳ですが、これは第一に、天照大御神が国民から非常に神聖な存在として認められていたということです。例えば、先ほどお話しした須佐之男命が、出雲の国に行かれました。出雲の肥の河をだんだんとさかのぼっていくと、上から箸が流れて"

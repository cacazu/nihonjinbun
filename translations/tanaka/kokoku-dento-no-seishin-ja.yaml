- "id": "kds-p0017-003"
  "section_id": "chapter-kds-p0017-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "道德上如何なる事が善で、如何なる事が惡か、卽ち善惡の標準は何れにあるかと云ふことは、大問題であります。卽ち世の中の善惡といふものを何に依つて定めますか、どういふことが一體善い行であるか、どういふことが惡い行ひであるかといふことは、何を標準にして言ひますか。西洋などに於きましては倫理學といふものを研究致しまして、人生の理想といふものを立てゝ、その理想に叶ふのが善であつて、理想に叶はないのが惡である。或は良心といふものを立て、良心の是認するものが善であつて、良心の否認するものが惡である、といふ具合に言ふ。ヘルバルトなどは直覺的判斷といふものを立てゝ、直覺的判斷の是認するものが善であつて、それが是認しないものが惡であるといふことを言ひました。かう云ふ風に善惡の標準といふことはいろ〱に立てられて居ります。併し我國に於ては善惡の標準はどこにあるか、どういふ行ひが善でどういふ行ひが惡であるか、かう言ひますとそれは直ぐ分ります。我國に於きましては前に申しました皇室の尊嚴、皇室中心といふことに依つて確立せられて居ります。卽ち之れに因つて、我國の道德は立てられて居るのでありますから、この皇室中心の思想、これに反するものは惡である。それに合致するものは善である。昔に於きましても、須佐之男命といふ神樣は天照大御神樣の御弟であらせられるのでありますけれども、高天ケ原に於て罪惡を犯せられますと、さういふ尊い御方でも皇室に對して、天照大御神様に對して失禮なことがありますと、大勢の神が須佐之男命に千位置戶と申しまして、今日で申しますと澤山の罸金であります。それから髪を拔き手足の爪を拔いたとありますが、實際髪を御拔きになつたのか爪を御拔きになつたのか傳說ですから分りませぬが、須佐之男命の口毛などが木になつたといふことが書いてありますから、或は須佐之男命の山林などの樹木をみな沒收されたのかも知れませぬ。兎に角さういふ具合にしてその罪を償はしめるといふことがあります。それから又天若日子といふのが高天ケ原から大國主命に對してこの國を天孫に獻げよといふ使ひに降りました。ところが天若日子は大國主命のお姫さんを奧さんに貰つて大國主命の養子になり、さうして自分が葦原中つ國を支配しようと考へたが、さういふことが高天原に聞えますと、直ちに高天原からの神兵に誅せられて終ひました。所謂朝敵といふものが如何に恐るべきものであるかといふことが既に上代に於てかゝる事實で示されて居ります。或は又已に述べました猿田毘古神といふのが天孫を御導きして九州にお出でになつて、今度は御自分の伊勢に御歸りになる時に、天宇受賣命といふのがお供をして伊勢の方にお出でになつた。天宇受賣命は御用が濟んで、志摩の方にお出でになつた。志摩と申しますと、今日は志摩の國と申しますが、昔は伊勢の一部でありました。その志摩といふところへお出でになつた天宇受賣命が、澤山の魚をお集めになつて、その魚に「汝たちは天つ神の御子に仕へ奉らんや否や」とお聞きに"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 16
    "url": "https://dl.ndl.go.jp/pid/1092188/1/17"
  "translation_ja": "道徳上、何が善で何が悪か、つまり善悪の基準はどこにあるかは、大問題です。世の中の善悪を何によって定めるのか。何が善い行いで、何が悪い行いなのかを、何を基準にいうのでしょうか。西洋などでは倫理学を研究し、人生の理想を立て、それにかなうものが善、かなわないものが悪とします。あるいは良心を立て、良心が認めるものは善、認めないものは悪という。ヘルバルトなどは直覚的判断を立て、それが認めるものを善、認めないものを悪といいました。このように善悪の基準はいろいろ立てられています。しかし、わが国では、善悪の基準はどこか、どのような行いが善で悪かといえば、すぐに分かります。先に述べた皇室の尊厳、皇室中心ということで確立されているのです。それに基づいて、わが国の道徳は成り立っていますから、皇室中心の思想に反するものは悪、それにかなうものは善です。昔も、須佐之男命は天照大御神の弟という尊い方でしたが、高天原で罪を犯され、皇室、天照大御神に対して失礼なことがあると、多くの神が千位置戸を課しました。今日でいう、多額の罰金です。また、髪を抜き、手足の爪を抜いたとありますが、本当に髪や爪を抜いたのかは伝説なので分かりません。須佐之男命のひげが木になったと書かれていますから、山林の樹木などをすべて没収されたのかもしれません。ともかく、そのように罪を償わせたということがあります。また、天若日子が高天原から大国主命のもとに、「この国を天孫に献上せよ」という使いとして降りました。ところが、天若日子は大国主命の姫を妻に迎えて養子となり、自分が葦原中つ国を支配しようと考えました。それが高天原に伝わると、ただちに高天原の神兵によって討たれてしまいました。いわゆる朝敵となることがどれほど恐ろしいかは、上代にすでに、こうした事実によって示されています。また、先ほどの猿田毘古神は、天孫をご案内して九州に行き、自分の住まいの伊勢へ帰るとき、天宇受売命がお供をして伊勢に来られました。天宇受売命は用事を終え、志摩の方へ行かれました。今日では志摩国といいますが、昔は伊勢の一部でした。そこへ行かれた天宇受売命は、たくさんの魚を集め、「お前たちは天つ神の御子にお仕えするか、しないか」とお尋ねに"

- "id": "kds-p0014-001"
  "section_id": "chapter-kds-p0013-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "來たので、これは何でも人間が住んで居るといふことを御考へになつて、益々上流にお出でになると、人の泣き聲が聞える。そこでその泣き聲をたどつてお出でになると、そこに歲とつた夫婦が娘を中に置いて頭を撫で手を撫でゝ泣いて居る。須佐之男命が「どうしてお前達はそんなに泣いて居るのか」と聞かれました。ところがその老夫婦卽ち足名椎、手名椎といふのが申しますのに、「實は私に女の子が八人ありましたが、年々八俣大蛇が來てその子供を一人づゝ取つて行きまして、愈々最後のこの娘を近い中に又來て取つて行かれることになります。私共はそれを非常に悲しんで泣いて居ります」かう申しました。「さうか、それは氣の毒なことであるな、就てはその娘を私の妃に呉れないか」と仰せられた。足名椎、手名椎は「場合に依つては上げても宜しうございますがあなた樣がどういふ御方であるかといふことを伺ひませんでは御返事が申上げられません···」「成程、それはさうだ、わしは天照大御神のいろせである」と仰せられた。いろせのいろといふことは、例へばいろととも申しまして、せといふのは兄、とといふのは弟、いろといふのを付けますと同母兄弟といふことになる。總て血の續いた者にはいろといふ字を付ける。昔は總ての男子からは總ての女子をいも(妹)と云ひ、又總ての女子からは總ての男子をせ(兄)と云つたのであります。それで兄弟の、弟でも矢張りせと申します。須佐之男命は天照大御神の御弟であらせられるので、同母兄弟であるから、同母兄と仰せられた。さうすると足名椎、手名椎は大いに驚きました。「さういふ尊い御方であらせられましたか、實に失禮申上げました、私の娘は直ちに差上げます」かう言つたといふ。さういふ具合で、出雲の極く山の中に住んで居る足名椎、手名椎でも、天照大御神と同母兄だと仰しやると直ぐやんごとなき御方であると云ふことが分る。新聞もなければ雜誌もない時代に、天照大御神の神聖でゐらせられることは、かくも津々浦々に響いて居つたのであります。それが卽ち皇室の尊嚴の一つの證據なのであります。"

- "id": "kds-p0011-001"
  "section_id": "chapter-kds-p0009-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "實現しなければならぬ。さういふことを考へて食べない人が多いのですから、我が日本邊りには胃病患者が非常に多いといふのです。(笑聲)胃病患者が世界第一だといふことでありますが、これは矢張り生きんが爲に食ふのだといふことを忘れて居るからでせう。さういふ譯で食べるといふことを自覺して食べると食べないとは大變違ひます。殊に食べるのにはどういふものが榮養になつて、どういふものが不消化物であるといふやうなこと、例へば饂飩一杯は牛乳一合よりも餘計の榮養があるといふことを若し知つて居りますならば、牛乳一合飮むよりかも饂飩一杯食べる。牛乳二合飮むよりも饂飩二杯食べる。お晝の代りになる。牛乳二合飮んでもお腹に應へない。さういふやうに知つて食べると食べないでは一生の間に大變違ひがある。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 10
    "url": "https://dl.ndl.go.jp/pid/1092188/1/11"
  "translation_ja": "実現しなければなりません。そう考えて食べない人が多いので、日本には胃病の患者が非常に多いというのです。〔笑い〕胃病患者が世界一多いといいますが、それも、生きるために食べることを忘れているからでしょう。このように、食べることを自覚しているかいないかでは、大きな違いがあります。とりわけ、何が栄養になり、何が消化の悪いものか。例えば、うどん一杯は牛乳一合よりも栄養が多いと知っていたなら、牛乳一合を飲むよりうどん一杯を食べる。牛乳二合よりうどん二杯を食べれば、昼食代わりになります。牛乳二合では腹の足しにならない。そうしたことを知って食べるのと知らずに食べるのとでは、一生の間に大きな違いが生じます。"
  "translation_status": "reviewed"

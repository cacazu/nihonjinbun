  "translation_ja": "第一に、敬虔の感情です。敬虔とは、すべて慎むということです。日本国民には、とりわけ神に対して慎む精神があります。どこに出ても慎む精神を、本来持っている。あえて教育などを受けなくても、そのような精神があるのです。わが国の昔は神代といって、その時代にはさまざまな神々が活動されました。いたるところに神々がおられ、人々を支配なさる。今日でいう政治家、教育家、宗教家といった方々が、昔はみな神なのです。国民は神に接するのですから、無作法なことはできません。神の支配を受け、朝から晩まで、晩から朝まで、つねに神が見守っておられる。上代はそのようなありさまでしたから、国民は一言一句をおろそかにしません。『古事記』や『日本書紀』など、昔のことを記した本をお読みになると、一つ一つの言葉がいかに敬語で成り立っているか、お気づきになるでしょう。何の神が「宣り給はく」「申し給はく」と、みなそのようになっています。これは、日本国民が本来、知らず知らず敬虔の精神に満ちていることを示しています。また、わが国の上代には、何をするにも神の御心に従って行うことになっていました。今日でも神や仏にさまざまな物を供えますが、昔から物を供えていました。それを供饌といい、何かできればそれを供える。そういう精神に富んでいるのです。つまり、神に物を差し上げ、その差し上げた物をいただく。そこで、いわゆる神人交通、神と人との交流が生まれます。神に供えた物をいただくことによって、神威に基づき、自分の行動を神聖なものにする。神の物をいただいて生きるのですから、悪い生活はできません。また、神を中心として、その供えた物を、一つの部落ならその部落の人々がいただき、協同し一致する精神を育てていく。そうした風習が、上代にはあったのです。"

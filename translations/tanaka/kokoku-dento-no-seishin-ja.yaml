- "id": "kds-p0004-001"
  "section_id": "introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "目で片一方の目が二皮目といふやうな場合が多い。そんな瞼の一皮とか二皮位のことはどうでも宜ささうなものですが、さういふところ迄細かく違つて來る。さういふ風に遺傳で、さういふ違ひがありますやうに精神の上にも亦違ひがある。父の精神をどれだけ承け繼いで居るか、母の精神をどれだけ承け繼いで居るか、その方は眼に見えませぬ。見えませぬけれども確かに承け繼ぎ方が違ふ。それが代々重なつて來ますから、遺傳に因つて人々の精神がいろ〱に變つて來る。百人居れば百人、千人居れば千人、全く同一の精神を持つて居るといふことがなくなつて來る。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 3
    "url": "https://dl.ndl.go.jp/pid/1092188/1/4"
  "translation_ja": "で、もう片方の目が二重、という場合が多いのです。まぶたが一重か二重かなど、どうでもよさそうなものですが、そんな細かなところまで違ってくる。このように遺伝による違いがあるように、精神にもまた違いがあります。父の精神をどれだけ受け継いでいるか、母の精神をどれだけ受け継いでいるかは、目には見えません。見えませんけれども、確かに受け継ぎ方が違う。それが代々重なってきますから、遺伝によって人々の精神がいろいろに変わってくる。百人いれば百人、千人いれば千人、まったく同じ精神を持っているということは、なくなるのです。"
  "translation_status": "reviewed"

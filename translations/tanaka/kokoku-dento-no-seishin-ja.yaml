  "translation_ja": "王道にはさまざまな説明がありますが、この言葉が最も明確です。「王道蕩々」は、きわめて広く、きわめて簡単であるという意味です。「無偏無党」は、一方に偏らず、党派を立てないこと、一言でいえば私心がないことです。私心がないというのは、公であることです。「公」の上の八は背くという字、下の厶は私という字で、私に背くのが公です。私に没頭するのは利己主義、個人主義で、公ではありません。それで、「ひとたび非常の事態があれば、正義と勇気をもって公に奉仕し、天地とともに尽きることのない皇運をお助けせよ」と仰せられています。この「公」も、同じ意味です。「王道平々」は、王道は難しくなく、やさしいということです。わが国の皇道も同じです。やさしく、日本国民なら誰でも実行できます。難しい試験を受けなければならないわけではありません。その辺の教育を受けていない女性でも、きちんと実行できる。「王道平々」です。「無反無側」は偏らないことで、やはり「無党無偏」と同じです。中正を守って進む。「王道正直、会其有極、帰其有極」の正直は、正しく、まっすぐで、曲がらないことです。わが国の皇道、あるいは神道は、正直を尊重します。儒教は仁、仏教は慈悲、キリスト教は愛というように区別すれば、神道は正直を尊重する。そして鏡を尊びます。神社の神前には、一般に鏡が置かれています。鏡は正直の象徴です。三種の神器の第一に鏡が挙げられますが、鏡には、偏りも党派も私心もありません。非常に美しいものが来ても、それを長く映しておこうとはしない。美しいものでも嫌なものでも、正直にそのまま映す。嫌なものだから半分だけ映してやろう、とはしません。そのように神道は正直を尊重し、王道も同じです。「正道正直、会其有極、帰其有極」の「有」は添えられた言葉です。「極」とは何か。極端といって、電気なら積極、消極、つまり正と負の極といいます。これが極端です。しかし、その両極の間に、さらに中極を認めることができます。電気でいえば、正極でも負極でもないところです。神道では、度会延佳という人が中極を説いていますが、王道もそれです。これを中道ともいいます。仏教でも中道実相といいますが、その中道とは少し意味が違うものの、まず大体そのようなものです。王道はそこにある。その中道に集まり、帰することを「有極に会し、有極に帰す」というのです。王道は、このように、わが国の伝統の精神と一致します。先に述べた禅譲放伐のようなことは、わが国には断じて受け入れられませんが、それは儒教の根本の意味ではありません。ですから、儒教の理想、根本の教えは、皇国伝統の精神を示すのに適切なのです。そこで、儒教が盛んに取り入れられてきました。"

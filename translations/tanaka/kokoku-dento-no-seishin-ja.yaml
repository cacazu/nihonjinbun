- "id": "kds-p0004-003"
  "section_id": "introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それから又教育であります。昔でも今日でも教育といふものはある。今日は西洋流に學校が澤山出來て居りますから教育も亦普及致しますが、昔に於てもそれ相當の教育は矢張り行はれて居つた。その教育の仕方、教師の人物の如何、教育の場所の設備等によつてその結果色々となり、人の精神が相違して來ます。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 3
    "url": "https://dl.ndl.go.jp/pid/1092188/1/4"
  "translation_ja": "それから教育です。昔にも今日にも教育というものはあります。今日は西洋式の学校がたくさんできていますから、教育も普及していますが、昔にも、それ相応の教育はやはり行われていました。その教育の仕方、教師がどのような人物か、教育の場の設備などによって、結果もさまざまになり、人の精神に違いが生まれます。"
  "translation_status": "reviewed"

    "text": "尙.今日は神社といふのを宮と申します。宮は今社でありますが、宮は御屋といふことであります。宮といふのは家がある場合であります。社は榮樹一本でも社になります。宮といふのは御殿といふ意味であります。それでこの宮といふのは、昔は現人神と申しまして、人格を持つておいでになる神樣のお住みになるところで、今日の出雲大社は昔は日隅と申しました。日〓宮といふのは日はひもうぎのひがみと通ずると申しましたが、やはりみですみといふのは、すにマ行の變化を付けて活用することにしたのであります。本來はすといふのであります。すといふのは今日の住すといふことであります。で、ひすのみやは「御住ひの宮」といふことであります。"

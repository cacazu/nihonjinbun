  "translation_ja": "も釣り針を返そうとしますが、魚に取られてしまったので返せません。あの時代にも、釣り針を作る職人は大勢いたようです。火遠理命は、使っていた刀を一本壊し、釣り針を作らせました。そして「あなたの釣り針をなくして申し訳ありませんが、どうかこれでお許しください」と、五百本を差し出されました。ところが、兄は「いけない」といいます。火遠理命は、それならもっと作ろうと千本作り、「これだけ作りましたから、どうかお許しください」という。それでも兄は「いけない。元の針を返せ」と無理なことをいいます。困ったことだと思い、火遠理命が心配しながら海岸を歩いておられると、塩椎の神が現れました。塩は海の潮ですから、塩椎の神は海に関わる、何でもよく知っている神です。その神が現れ、「皇太子さまは、なぜそれほど悲しんでおられるのですか」と尋ねると、火遠理命は「実は、こういうわけだ」と事情をお話しになった。塩椎の神は、「それなら、この船に乗って進むと味御路がある。その道を船でどんどん進むと、綿津見の神のところに出ます」といいます。綿津見の神は、海神、航海をつかさどる神です。今日の歴史家などは、その場所は福岡県辺りだったのだろうといいますが、太古のことなので私たちには分かりません。ともかく、塩椎の神は「綿津見の神の宮殿に行くと、その前に井戸があり、そばに湯津香木があります。そこへ行けば、何かよい方法があるでしょう」と教えてくれました。そこで火遠理命はそちらへ行かれました。すると、海神の娘である豊玉毘売の侍女が水をくみに来たので、火遠理命は「水を一杯飲ませてもらいたい」とおっしゃいました。侍女が器に水を入れて差し上げると、命はお飲みにならず、首飾りの玉をその中に入れられました。侍女が玉を取ろうとしても、くっついて取れません。そこで持ち帰って豊玉毘売に報告し、姫は父の綿津見の神に申し上げました。父はそれをご覧になり、「おお、これは皇太子さまだ」とおっしゃいました。それからすぐに中へお迎えし、たいへん手厚くもてなされました。そして、一人の姫である豊玉毘売を妃にされたのです。その後、三年ほどそこに住まわれました。ある日、火遠理命が大きなため息をつかれました。それを聞いた姫は、父の綿津見の神に、「今までため息をおつきになったことがないのに、今日はご心配があるようでため息をつかれました。どうしたのでしょう」と申し上げました。父が「皇太子さまは深く嘆息なさったそうですが、何か心配事がありますか」と尋ねると、命は「魚に釣り針を取られて困っているのだ」とお話しになりました。綿津見の神は海の神なので、すべての魚を集め、「お前たちの中に、釣り針を取った者はいないか」と尋ねました。魚たちは「近ごろ赤鯛が喉を痛めています。あれが取ったのでしょう」と答えました。綿津見の神は「では連れてこい」といい、あれこれ調べると、果たして釣り針が出てきました。綿津見の神はそれをよく洗い清めて差し上げ、「これです。持ってお帰りください」ということになりました。そのとき海神は、「あの不都合な兄を、今後のために十分懲らしめる必要があります」と教え、潮を引かせる玉と、潮を満たす玉を渡されました。火遠理命はそれを持ち帰り、潮を満たす玉で兄を溺れさせました。兄が助けを求め、「皇室のために忠実に働きますから、どうかお許しください」といったので、潮を引かせる玉で潮を退かせ、兄を救われた。それから、兄の子孫は忠実に仕えることになったという伝説です。この話でも、塩椎の神が現れると"

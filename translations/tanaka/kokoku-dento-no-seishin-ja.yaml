- "id": "kds-p0021-003"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "といふことがありますが、矢張りこの趣意であります。かういふやうな具合で、この儒敎といふものが神道、或は皇道の根本精神、卽ち皇國傳統の精神を說明するのに、非常に都合が好い。そこで和魂漢才で儒敎は我國に盛んに行はれて來たのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 20
    "url": "https://dl.ndl.go.jp/pid/1092188/1/21"
  "translation_ja": "とあるのも、同じ趣旨です。このように、儒教は、神道あるいは皇道の根本精神、つまり皇国伝統の精神を説明するのに、たいへん都合がよい。そこで、和魂漢才によって、儒教はわが国で盛んに行われるようになりました。"
  "translation_status": "reviewed"

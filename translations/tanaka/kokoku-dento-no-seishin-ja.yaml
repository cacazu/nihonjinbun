- "id": "kds-p0004-002"
  "section_id": "introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それから境遇と申しまして、その人の生活して居る外界の境遇でありますが、境遇と申しますと、或は氣候の非常に良いところ、山水の風光明媚なところ、或は砂漠みたいなところが澤山あるやうなところ、さういふ風なみな外界の狀況であります。或は又都會に生れるとか、村落に生れるとかいふやうなことに因つても亦違つて來ます。それ等はみな境遇であります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 3
    "url": "https://dl.ndl.go.jp/pid/1092188/1/4"
  "translation_ja": "それから境遇です。その人が生活している外界の環境をいいます。気候が非常によいところ、山水の景色が美しいところ、砂漠のような場所がたくさんあるところ、そうした外界の状況です。また、都会に生まれるか、村に生まれるかといったことによっても違ってきます。それらはみな境遇です。"
  "translation_status": "reviewed"

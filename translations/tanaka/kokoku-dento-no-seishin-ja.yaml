- "id": "kds-p0021-005"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "要するに和魂漢才と申しまする根本主義は、日本の國家を基にして、世界のあらゆる文化を我國に取入れるのであります。だから今日でも西洋の思想が盛んに這入りますが、それをどうしても我國にみな取入れて、皇國傳統の精神に依つて日本の文化の發展するやうにしなければなりませぬ。この頃問題となつて居ります天皇機關說といふやうなのはみな西洋のを丸呑みにした結果であります。何でも丸呑みにするのは宜しくありません。儒敎でも、佛敎でも、西洋の思想でも、丸呑みにしたら日本には當篏らない。それを皇國傳統の精神に依つて改造しなければならぬ。その改造せられたものは更にこの傳統の精神を發展する材料になります。丁度吾々が魚を食べますやうに、鯛なら鯛といふもの、日本人は鯛を喜んで食べますが、イギリス邊りでは鯛なんぞは、人間の食べるものではない、鯛は猫に食べさすものだといふので、魚の中でも最も安い魚だと云ふのであります。あの旨いものを、どうして食べないのだらうと思つて不思議に思ひますけれども、西洋の鯛は不味いかも知れませぬ。(笑聲)どういふ譯だかイギリス邊りでは鯛はあまり食べない。我國では腐つても鯛といふので、非常に鯛を尊重する。併しその鯛を煮て食べる爲めに頭からがり〱食べたら、鯛の骨は鰯の骨と違つて堅いものですから、咽に"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"

- "id": "kds-p0019-002"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "王道蕩々。無偏無黨。王道平々。無反無側。王道正直。會其有極。歸其有極。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 18
    "url": "https://dl.ndl.go.jp/pid/1092188/1/19"
  "translation_ja": "王道は広々としている。偏りも党派への私情もない。王道は平らである。逆らいも傾きもない。王道は正しくまっすぐである。その中正の基準に集まり、その中正の基準に帰する。"
  "translation_status": "reviewed"

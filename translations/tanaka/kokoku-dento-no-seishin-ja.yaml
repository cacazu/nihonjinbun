  "section_id": "chapter-kds-p0016-002"
  "kind": "heading"
  "origin": "source"
  "source_text": "第三、皇室の慈愛"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 15
    "url": "https://dl.ndl.go.jp/pid/1092188/1/16"
  "translation_ja": "第三　皇室の慈愛"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-1092188"
    "original_unit_id": "1092188_0000016:9"
  - "source_id": "ndl-1092188"

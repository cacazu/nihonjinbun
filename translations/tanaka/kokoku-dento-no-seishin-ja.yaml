    "text": "これから皇室の尊嚴といふことに就て申上げます。〓育が明治時代に西洋から日本に傳つて來ました時に、ヘルバルトの〓育學といふものが廣く行はれました。そのヘルバルトの〓育學の中に開化史的段階、或は文化史的段階、かういふものがあることは〓育學をおやりになつた方は御承知のことゝ思ひます。この開化史的段階といふのはどういふのであるかと申しますと、〓授の材料を配列しますのに、人間の一人の發達といふものは、種族の發達と並行するものであるといふ原則から成り立つて居る。卽ち一個人に就いて見ても、赤ん坊などは鼻などはペチヤンコのやうになつて居りまして、唯々眼と口とが付いて居るやうに見えますが、それが段々と成長するに從つて目許もパツチリして來ます。鼻も高くなつて來ます、眉毛も濃くなつて來ます。それで立派な顏が出來て來る。さういふ具合に一般に古代人は顏形が整つて居らぬ。文明人になる程非常に美しくなる。精神も亦小さい子供の時には猿蟹合戰とか、桃太郞の鬼ケ島征伐ー犬が團子一つ下さい、お供しませうと言つた。かういふ風な話を話すと子供に非常によく分る。それで西洋ではメルヘン(童話)と言ひまして、さういふやうなもので〓育して行かうといふのであります。それから段々と發達して來るに從つて、高尙なる材料に進み、遂には哲學などの話をしても理解されて來る。それを幼稚園などに居る四つや五つの子供に對して、宇宙がどうだ、世界の本體がどうだ、アインシユタインの相對性原理がどうだと言つても、譯は分りませぬ。何のことだかチンプンカンです。それに反して桃太郞が鬼ケ島を征伐に行かうとした。ところが犬が團子一つ下さればお供しやうと言つた、といふやうなことを話しますと、直ぐ耳を澄まして聞きます。さういふ具合に個人の發達といふものが種族の發達といふものと並行するものだと言ふ。此の原理を應用したのが、開化史的段階といふのであります。さう云ふ次第で上代に於きましては、猿がものを言つたり、兎がものを言つたりする話が興味を以て愉快に感ぜられるのです。そこで我國に於ても上代には、先刻申したところの偉い神樣が人民を〓化せられるのに、矢張りさういふ物語を以てせられたのであります。それでありますから、『古事記』や『日本書紀』の上代に書いてありますのはさういふ物語が色々入れてありまして、その中には偉大なる日本精神、偉大なる皇道の精神が養成されて來て居るのであります。それを先づ前提にして、皇室の尊嚴といふ傳統の精神が上代に旣に早く培はれて來たといふことを申上げたいのであります。"

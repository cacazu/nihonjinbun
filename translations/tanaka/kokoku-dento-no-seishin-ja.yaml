- "id": "kds-p0024-003"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "併し又或る人々はお金などは駄目である。お金などを彼れ此れ云ふのは極めて野卑なものである。人間は名譽といふものを尊ばなければならぬ。名譽は人生最も貴重なのもので、昔から人は一生、名は末代と云ひ、名譽といふものが大切なのである。かういふ風に申すのであります。成る程、名譽といふものも大切なものであります。併し又或る人々はいや名譽がいくらあつたつて貴い爵位の榮譽を辱うしても、貴い勳位を戴いても、生命がなくてはその有難さを感ずる譯には行かぬ。「命あつてのもの種」生命が大切である。かう言ふのであります。成る程生命も大切であります。百萬圓やるからお前の生命を吳れと言ひましても、百萬圓貰つて生命を上げて終つたら何にもなりません。さういふ譯で生命が大切だといふと、これも一理あると云ふことになります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 23
    "url": "https://dl.ndl.go.jp/pid/1092188/1/24"
  "translation_ja": "しかし、ある人々は、お金などは駄目だ、お金のことをあれこれいうのはきわめて卑しい、人間は名誉を尊ばねばならないといいます。名誉は人生で最も貴重なもので、昔から「人は一生、名は末代」というように、名誉こそ大切だと。確かに、名誉も大切です。しかし、別の人々は、名誉がいくらあっても、高い爵位や勲位をいただいても、命がなければありがたさを感じられない、「命あっての物種」で、生命が大切だといいます。なるほど、生命も大切です。百万円やるから命をくれといわれても、百万円もらって命を渡してしまえば、何にもならない。生命が大切だというのも、一理あることになります。"
  "translation_status": "reviewed"

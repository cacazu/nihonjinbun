- "id": "kds-p0012-001"
  "section_id": "chapter-kds-p0009-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "します。榮樹は今日は榊と書きますけれども、これは我が國で作つた字であります。さういふ樹に御神靈が御宿りになるのであります。それが社の義であります。社といふのは屋代、卽ち家の代りであります。家の代りに社といふものを建てるのです。それに神樣が御宿りになる。それが神籬といふのであります。大和に官幣大社大神神社といふのがおありでありますが、こゝなぞは神殿はないのであります、神靈は山に御宿りになつて居られます。山が神殿であります。御家は拜むところしか拵へてありませぬ。關東では、筑波山の神社も、之れと同樣と考へられます。山が神殿になる。今筑波山の山の上に奥の院といふ理窟で御家が出來て居りますが、本來は山そのものを拜んだものと申されて居ります。卽ち山そのものが社であります。屋の代りであります。それが卽ち神籬であります。それでありますから神籬といふのはいろ〱の場合があります。崇神天皇樣が天照大御神樣の御魂の御鏡と御劍とを、大和の笠縫邑に磯城、神籬を立てゝ祭りたまふといふことが書いてありますが、その時の神籬といふのは詰り社殿があつたのであります。その中に鏡と御劍を御納めになつたものと思はれます。そして豊鉏入比賣命をして御仕へせしめられました。それが伊勢の大神宮の起りであります。大神宮の御宮の造り方を御覽になりますと、あれは神明造と申します。大神宮は日本の總氏神であらせられ、皇室の御祖先の偉大なる神樣でありますから、その社殿といふものは大きなーそれこそ大きなものが出來て宜い筈でありますけれども、併しそれがさうでなくて、矢張り御神殿は森嚴で、極く小さいお屋代であります。それが上代の神籬であります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 11
    "url": "https://dl.ndl.go.jp/pid/1092188/1/12"
  "translation_ja": "ます。栄樹は今日「榊」と書きますが、これはわが国で作った字です。そのような木に神霊が宿られます。これが「社（やしろ）」の意味です。社は屋代（やしろ）、つまり家の代わりです。家の代わりに社を建て、そこに神が宿られる。それを神籬（ひもろぎ）といいます。大和に官幣大社の大神神社がありますが、ここなどには神殿がありません。神霊は山に宿っておられ、山が神殿です。建物は拝む場所だけ作ってあります。関東の筑波山の神社も、同じだと考えられます。山が神殿なのです。今は山頂に奥の院ということで建物がありますが、本来は山そのものを拝んだといわれます。つまり山そのものが社、家の代わりであり、それが神籬です。ですから、神籬にはさまざまな場合があります。崇神天皇が、天照大御神の御魂である鏡と剣を、大和の笠縫邑に磯城・神籬を立てて祭られたと書かれています。このときの神籬には、つまり社殿があったのです。その中に鏡と剣を納められたものと思われます。そして、豊鉏入比売命にお仕えさせられました。これが伊勢の大神宮の起こりです。大神宮の建築様式をご覧になると、あれを神明造といいます。大神宮は日本の総氏神で、皇室の御祖先である偉大な神ですから、社殿も、それこそ大きなものができてよいはずです。しかしそうではなく、御神殿はやはり森厳な、ごく小さい屋代です。それが上代の神籬なのです。"
  "translation_status": "reviewed"

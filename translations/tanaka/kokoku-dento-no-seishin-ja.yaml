- "id": "kds-p0024-001"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "さういふ日本人が澤山居りましたならば、日本は到底持つことが出來ない。さういふ譯でありますから吾々はこの天壤無窮の國家をどこ迄も發展することに努めなければならぬ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 23
    "url": "https://dl.ndl.go.jp/pid/1092188/1/24"
  "translation_ja": "そうした日本人が大勢いれば、日本は到底持ちこたえられません。ですから、私たちは、この天地とともに尽きることのない国家を、どこまでも発展させるよう努めなければなりません。"
  "translation_status": "reviewed"
  "source_alignment":

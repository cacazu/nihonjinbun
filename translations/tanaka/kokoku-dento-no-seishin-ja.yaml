    "url": "https://dl.ndl.go.jp/pid/1092188/1/22"
  "translation_ja": "このように、私たちは外来思想を取り入れ、伝統の精神を発展させてきます。伝統の精神は、そのように偉大なものですが、それを説明し発表することを、私たちの身体にたとえてみましょう。私たちは大和民族で、西洋などからは黄色人種といって卑しめられますが、この身体は、祖先から受け継いだ立派でありがたい身体です。とりわけ日本国民は、優秀な身体を持っています。そもそも、人間が偉いというのは、何が偉いのでしょう。体力が強いことや、重い物を持ち上げられることではないでしょう。力の強さが偉さなら、力士、横綱などが日本の偉人となり、大先生として大勲位、公爵にでもしなければなりません。〔笑い〕しかし、身体が強いだけでは何にもならない……いや、ならないわけではなく、横綱にはなれますが、国民が崇敬するわけにはいきません。そうすると、人間の偉さは身体ではなく精神です。精神の偉さは、生理学的には何によるかといえば、脳髄によるとされています。今日の生理学では、脳髄によるということになっています。日本で解剖が行われるようになったのは、ごく最近の四、五十年来ですが、西洋では何百年も行っているので、昔の偉人の脳髄が保存されています。わが国でも、近ごろは桂公爵や夏目漱石先生などの脳髄が、帝大病院に保存されています。この間亡くなった杉山という方の脳髄も、保存されることになったそうです。西洋では、昔から保存して統計を取っているそうですが、脳髄の重い人が偉いということです。先ごろ亡くなった杉山さんのものもかなり重かったそうですが、桂公爵、夏目漱石先生の脳髄も非常に重いといいます。平凡な人は軽く、偉人は重い。西洋でも、ビスマルクの脳髄は特に重い。ビスマルクの頭が「毒滅」という梅毒薬の看板によく使われていましたが、ドイツ大使館から外務省へ、すぐに撤去してほしいと抗議が来たそうです。〔笑い〕そこで外務省が内務省に通知し、内務省が禁じることになった。それで、梅毒薬「毒滅」にビスマルクを使うことは、やめたそうです。〔笑い〕そのように、脳髄の重量によって、賢さや愚かさ、優劣が決まるのです。しかし、西洋人と日本人の平均の脳髄を比べると、日本人の方が少し軽いという。そうすると日本人の方が劣るように感じられますが、脳髄の重量は、絶対的に重いだけでは駄目です。身体との比率で考えるべきで、身体を無視して脳の重さだけをいえば、象や鯨がいちばん偉くなってしまう。〔笑い〕象や鯨は、あらゆる生物の中で最も重い脳を持っていますが、どんなに重くても、あの大きな身体と比べれば、ほんのわずか"

- "id": "kds-p0009-001"
  "section_id": "introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "であります。女性の御方であつてもさういふ風に勇敢だ。敵を恐れない精神が一般にあるのであります。又須佐之男命は最も勇敢な御方でありました。出雲にお出でになつてかの有名な八俣大蛇を退治なさつたことは、諸君の御承知の通りであります。さういふものでも恐れずにそれを退治なさるといふ具合に、昔の日本國民は全體に於てこの義氣旺盛、極めて勇敢の氣象に富んで居る。後世發展して所謂大和魂となるところの基礎が上代に旣に現れて居るのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 8
    "url": "https://dl.ndl.go.jp/pid/1092188/1/9"
  "translation_ja": "です。女性でも、このように勇敢で、敵を恐れない精神が一般にあるのです。また、須佐之男命は、たいへん勇敢な方でした。出雲に行き、あの有名な八俣大蛇を退治なさったことは、皆さんもご存じのとおりです。あのようなものをも恐れず退治されるというように、昔の日本国民は全体として義気が盛んで、きわめて勇敢な気質に富んでいます。後世に発展して、いわゆる大和魂となる基礎が、上代にすでに現れているのです。"

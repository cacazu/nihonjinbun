- "id": "kds-p0018-003"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それが皇國傳統の精神はすべての外來思想を純化し、廣く之れを取り入れると云ふことであります。之れは和魂漢才と云ふ言葉がよく示して居ります。一番初に外國から參つたのが儒敎であります。儒敎は應神天皇の時に阿直岐、王仁といふのが來て之れを傳へたといふのでありますが、勿論それより先きに儒敎は傳つて居つたことゝ考へられます。それで應神天皇の時には盛に儒敎が我國に傳へられて來たのであります。その儒敎はどういふのであるかと言ひますと、申す迄もなく支那の敎へであります。支那といふ國は早くから文字が出來て、早くから學術の發達した國でありますから、儒敎といふ敎は實に論理的、普遍的で而して哲學的、倫理的、政治的、總ての方面の學術として發達して居りました。ところが我國は已に申しました通り、神ながら言擧げせぬ國で、而かも右のやうな傳統の大精神があります。けれどもその大精神を一々學理で研究して國民に示すのでない。天地正大の氣粹然として神州に鍾る。秀でゝは不二の嶽とあり、巍々として千秋に聳ゆ。注ぎては大瀛の水となり、洋々として八州を環る。發しては萬朶の櫻となり、衆芳與に儔し難し。凝りては百鍊の鐵とあり、銳利鐵を斷つべし。さういふ具合に皇國傳統の精神といふものがずつと澎湃として發達して來て居るのであります。けれどもそれを學術的に說明してはない。神ながら言擧げせぬ國、不言實行の國であるのであります。併し段々人智が發達して來ますとそれをどうも學術化したい、卽ち理窟で述べて見たいのであります。その學理で述べて見たいといふ氣分が日本人の間に大變出來て來ましたが、その時儒敎が這入つて來た。ところが儒敎といふものは支那で出來たのでありますけれども、支那の國にはさういふ傳統の精神が充分でありませぬから、所謂「禪讓放伐」と云ふことが行はれて居るのであります。卽ち堯帝は舜帝と言つて匹夫を擧げて位を繼がしめて居る。それを禪るといふのであります。或は匹夫がその君を放ち、又は伐つて位を奪ふことを放伐といふのです。周の武王がその君の紂を滅して自分が天子となる。さういふことが支那に於てはあるのであります。けれどもこれは儒敎の精神ではない。儒敎の理想ではないのです。さういふことは支那國民の風俗であるのです。儒敎の精神は王道と言ひ"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 17
    "url": "https://dl.ndl.go.jp/pid/1092188/1/18"
  "translation_ja": "皇国伝統の精神は、すべての外来思想を純化し、広く取り入れるということです。これをよく示す言葉が「和魂漢才」です。外国から最初に入ってきたのは儒教でした。応神天皇の時代に阿直岐と王仁が来て伝えたといいますが、もちろん、それ以前にも伝わっていたと考えられます。応神天皇の時代には、儒教が盛んに伝えられるようになったのです。儒教は、いうまでもなく中国の教えです。中国は早くから文字が生まれ、学術が発達した国なので、儒教はきわめて論理的、普遍的であり、哲学、倫理、政治など、あらゆる方面の学術として発達していました。一方、わが国は、先に述べたように「神ながら言挙げせぬ国」であり、しかも、そのような伝統の大精神があります。しかし、その精神を一々学理として研究し、国民に示すのではありません。「天地の正大な気が、純粋にこの神州に集まる。秀でて富士の山となり、千年の時を越えて高々とそびえる。流れ注いでは大海の水となり、広々と八洲を巡る。発しては万枝の桜となり、ほかの花々は肩を並べがたい。凝っては鍛え抜かれた鉄となり、その鋭さは鉄をも断つ」。このように、皇国伝統の精神は勢いよく発達してきたのです。しかし、それを学問的に説明してはいません。「神ながら言挙げせぬ国」、不言実行の国なのです。けれども、人の知恵が発達してくると、それを学問にし、理屈で述べてみたくなる。そうした気持ちが日本人の間に大いに生まれたとき、儒教が入ってきました。儒教は中国で生まれましたが、中国には、そのような伝統の精神が十分ではないため、いわゆる「禅譲放伐」が行われています。堯帝が、普通の身分の舜を選んで位を継がせた。これを禅譲といいます。また、普通の身分の者が君主を追放したり、討ったりして位を奪うのを放伐といいます。周の武王が、その君主である紂を滅ぼし、自分が天子になる。中国にはそういうことがあります。しかし、これは儒教の精神でも理想でもありません。中国国民の風俗なのです。儒教の精神は王道といい"

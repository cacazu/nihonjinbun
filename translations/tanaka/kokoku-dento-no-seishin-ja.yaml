- "id": "kds-p0023-003"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "維新後になりまして東洋の大國支那が、日本に對して野心を抱きました。あの李鴻章がどうも日本が近來肩を上げて來たから、今の中にやつて置かぬといけないといふので、日淸戰爭を始めたのです。ところが日淸戰爭をやりますと、それが原因になつて淸國は滅びて終ひました。その後露西亞が東洋に野心を抱きまして、遂に日露戰爭となりましたが、その結果連戰連敗、ロシヤ帝國は滅びて終つた。ロシヤは今でもありますが、あれは帝國ではありませぬ。帝國は滅びて終ひました。さういふ具合に日本に向つて戰爭を仕かけて日本を取つてやらうと思ふと、その國が滅びて終ひます。何しろ日本は皇國でありまして、偉大な傳統の精神がありますから、どうかすると外國で日本を取らうといふやうな考を起す國がありますと、その國はあぶないのであります。今日では世界の各國がウツカリ手を出すと、これは自分の國が滅びて終ふといふことを知つたらしいのであります。それはさうならなければなりませぬ。又吾々國民もその精神で進まなければなりませぬ。吾々がこの傳統の精神を發揮して居る以上は大丈夫であります。若しこの傳統の精神を失つて終つたら大變であります。丁度犬がワン〱と言はなくなり、猫がニヤ〱と言はなくなると同じであります。さういふ具合にニヤ〱と言はない猫が居ましたら、その猫は不思議な猫、さういふ具合にワン〱と鳴かない犬が居りましたら不思議な犬です。(笑聲)日本國民であつて日本の傳統の精神を持つて居ない日本人が居りましたならば、それは不思議な日本人であります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 22
    "url": "https://dl.ndl.go.jp/pid/1092188/1/23"
  "translation_ja": "維新後には、東洋の大国である中国が、日本に野心を抱きました。李鴻章は、日本が近ごろ勢力を増しているから、今のうちに手を打たねばと、日清戦争を始めたのです。しかし、日清戦争をすると、それが原因となって清国は滅びました。その後、ロシアが東洋に野心を抱き、日露戦争となりましたが、連戦連敗の結果、ロシア帝国は滅びました。ロシアは今もありますが、帝国ではありません。帝国は滅びたのです。このように、日本に戦争を仕掛け、奪おうとすると、その国が滅びてしまいます。日本は皇国であり、偉大な伝統の精神を持っているので、外国が日本を奪おうなどと考えれば、その国が危ないのです。今日では、世界の国々も、うっかり手を出せば自国が滅びると分かったらしい。それはそうでなければなりませんし、私たち国民も、その精神で進まなければなりません。伝統の精神を発揮している限りは大丈夫です。しかし、それを失えば大変です。犬がワンワンといわず、猫がニャーニャーといわなくなるのと同じです。鳴かない猫がいれば不思議な猫、鳴かない犬がいれば不思議な犬です。〔笑い〕日本国民でありながら日本の伝統の精神を持たない日本人がいれば、それは不思議な日本人なのです。"
  "translation_status": "reviewed"

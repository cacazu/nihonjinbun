  "source_text": "尙この機會に儒敎の忠孝の精神に就いて論及します。この講習會の目次で見ますと、昨日『論語』のお話があつたやうでありますが、この『論語』を御覽になると孝行といふことが盛んに說いてございます。儒敎では「孝は百行の本」と申しますが、亦こゝに書いてございます通り「孝は德の本」と申します。孝は德の基本、あらゆる道德の根本であるのであります。そこでこゝに書いてあります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 18
    "url": "https://dl.ndl.go.jp/pid/1092188/1/19"
  "translation_ja": "なお、この機会に、儒教の忠孝の精神についても述べます。この講習会の目次を見ると、昨日は『論語』のお話があったようです。『論語』をご覧になると、孝行が盛んに説かれています。儒教では「孝は百行の本」といい、また、ここに書かれているとおり「孝は徳の本」ともいいます。孝は徳の基本、あらゆる道徳の根本です。そこで、ここにこう書かれています。"

- "id": "kds-p0013-001"
  "section_id": "chapter-kds-p0009-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "さういふ具合にこの神籬磐境といふのが神社の起りであります。そしてその屋代と御屋とは後世には社を宮と言ひ、宮を社と言ふやうになつて一緒になつて終いました。けれども初めはチヤンと區別があつた譯であります。さういふわけで先きに申しましたところの、日本國民の偉大なる御方を神社に祭つて、さうしてそれに依つて吾々が日本精神を體現して吾々の日々の道を行つて行かうといふことが卽ち我國で皇道と言ひ、又神道と言ふところのものであります。さういふ道に依つて吾々が日々御飯を食べて居ますやうに、我が國民の理想を實現せんとするのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 12
    "url": "https://dl.ndl.go.jp/pid/1092188/1/13"
  "translation_ja": "このように、神籬・磐境が神社の起こりです。そして、屋代と御屋は、後世には社を宮といい、宮を社といって、一緒になってしまいました。しかし、初めは明確な区別があったのです。先に述べた、日本国民の偉大な方を神社に祭り、それによって日本精神を体現し、日々の道を歩んでいこうということが、わが国で皇道とも神道ともいうものです。その道によって、私たちが日々食事をするのと同じように、国民の理想を実現しようとするのです。"

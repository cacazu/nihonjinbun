  "source_text": "それから昔からタブー(Taboo)の精神があります。これは南洋の方の言葉でありますが、我が國の言葉で申しますと禁忌などゝいふ言葉に當りませう。總て神樣は穢れをお嫌ひになる。神樣に仕へるところの者は齋み淸めて仕へなければならぬ、又神樣に關した物に矢鱈に觸つたり觸れたりすることが出來ない、といふやうなタブーの觀念です。それ等は皆敬虔の感情といふものゝ現れであります。殊に何か事件を致しますと神樣の御意思を伺つてする。これを太占と申します。太といふのは稱辭と言ひまして、今日で言ひますと「大日本帝國」の大の字に當る。占といふことは「まに〱」といふ意味で神樣の御心がどういふのであるか、この事をどうすれば宜しいのであるか、といふことを皆神樣の御心に伺ふ。それは今日では占ひと言ひます。占ひといふことはどういふことであるかと申しますと、心を合はすといふことで、心のことを昔は裏と言ひました。何故心のことを裏と言つたかといふと、顏のことを面と云ふと同じ關係です。顏は誰にでも分ります。顏付を見ればあの人は喜んで居るなと云ふのが直ぐ分る。あの人は悲觀して居るなといふのが直ぐ分る。それは表ですからこればかりは隱す譯に行かない。嬉しい···見られてはいかんといふので扇子で隱して歩く譯には行かない。(笑聲)これだけはどんな時でも出して歩かなけれはならぬ。人に直ぐ見られて終ふ。どんなに喜怒色に現さずと努めたところが駄目です。ところが心の方は包んで居るものですから人に見えない、それで心の方を裏と言つた。神樣の御心はそれ以上分らない。そこで鹿の肩の骨を取つて適當の大きさに切つて、これを樺櫻といふ一種の櫻の種類ですが、"

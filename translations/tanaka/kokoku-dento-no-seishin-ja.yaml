    "source_sequence": 8
    "url": "https://dl.ndl.go.jp/pid/1092188/1/9"
  "translation_ja": "こうした精神が日本国民には潜在していましたが、それが次第に発展し、いわゆる皇国伝統の精神になってきます。中国に揚子江という川があります。揚子江ほどになると、川幅だけでも三里、四里もあるそうです。そのような川は、川なのか海なのか見当がつかないほどです。わが国は国が小さいので川も小さいのですが、揚子江では下流から七百五十里ほども汽船でさかのぼれるという。それで、どれほど大きな川か分かるでしょう。ほかにも、ご存じのとおり、地図を見ると、外国にはアフリカのナイル川、アメリカのミシシッピ川やアマゾン川といった、広々と流れる大河があります。その大河も、源まで行けば、ぽたりぽたりと落ちる水です。山の中の湧き水のように、ぽたりぽたりと落ちる水が、下流に来ると広大な川になる。この皇国伝統の精神も、もとはそのように潜在し、うっかりしていると気づかないほどです。しかし、それがだんだん発展し、ついに今日のような大きな精神になってきたのです。"

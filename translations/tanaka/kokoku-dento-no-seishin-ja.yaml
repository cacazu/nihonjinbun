  "section_id": "chapter-kds-p0009-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一體人間は知つてすると知らないでするといふことは、そこに非常な差があります。例へばあなた方は御飯を召上る。私も食べます。苟くも人間である以上は「私は御飯を食べません」といふ人間はありませぬ。それは御飯を食べなければパンを食べる。パンを食べなければ果物を食べる。何か食べます。だからそれを總稱して御飯と言ひます。御飯を食べない人はないでせう。ところが御飯を食べるに、今日は榮養研究といふものがよく發達して參りましたが、その榮養の研究、その他御飯を食べる目的です。さういふことを自覺して食べると食べないとは大變な違ひがある。唯無茶苦茶に食べる。一體御飯を何の爲に食べるか。さういふことを考へて居る人がありますかどうですか。昔ギリシヤのソクラテスといふ人は「吾々は食はんが爲に生きるのでなくして、生きんが爲に食ふのだ」かういふことを言ひました。簡單なことですけれども、それがチョット多くの人に分らない。食はんが爲に生きて居る人が澤山ある。嘗て茨城縣の土浦で靑年が集りまして、汁粉の食べ合ひをやらうといふことを發議したところ直に賛成がありました、二十杯食べた者には一等賞をやると云ふのであつたさうです。それで寄附などで一等賞品が澤山集まりました。愈々汁粉の食べ合ひの豫定した日が來ました。我れと思はん者は來い、といふので靑年が集りまして食べる。中には八杯食べる、九杯食べる、中々汁粉といふものは餘計食べられないものです。東京の銀座では以前に十二杯以上食べた人にはお錢は戴きません、かういふことをやつたといふのです。一杯十錢とすれば十二杯で一圓二十錢、一圓二十錢只で宜しいと云ふのであります。若い者が「俺は行つて十二杯食べてやらう」といふので行くさうでありますが、大抵七杯か八杯、十杯位で閉口して終ふ。さうすると一圓位出さなければならぬ。(笑聲)普通ならば一杯か二杯ですから十錢か二十錢で濟むのでせうが、それを無理に食べるのですから十杯位食べても十二杯食べられないものですから一圓出さなければならぬ。大變その汁粉屋は儲けたといふことです。その茨城縣の土浦では靑年が集つて食べたが、ところが中々食べられない。豪傑でも十二三杯で閉口して終う。ところが一人の者は「なにやり切れないことはない」といふので終ひには箸で咽へおし込むやうにして到頭二十杯やつたといふのです。(笑聲)それで一等賞を貰つたといふ。一等賞貰つたといふのは宜いのですけれども、一時間ばかり經ちますと眼の色が變つて來た。何だか樣子が變だといふので、それから早速お醫者さんに驅け付けるやら大騷ぎ致しましたところが、お醫者さんが來ていろ〱診斷致しますと急性腹膜炎だといふのです。それで間もなく死んで終つたといふ。詰りその靑年はこの世に二十杯の汁粉を食べに生れて來たやうなものです。(笑聲)さういふ人が往々にして世にあります。ソクラテスの言ひました通り、吾は食はんが爲に生きるのでなしに、生きんが爲に食ふのである。生きて何をするかと言へば、生きて人生の理想を"

- "id": "kds-p0016-001"
  "section_id": "chapter-kds-p0013-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "直ぐそれが皇太子樣だといふことを御承知になる。又綿津見の神といふところにお出でになると、これが又尊き皇太子樣であらせられるといふことを直ぐ知られるといふ具合に、至るところ如何に皇室の尊嚴が上代に於て徹底して居るかと云ふことがわかるのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"

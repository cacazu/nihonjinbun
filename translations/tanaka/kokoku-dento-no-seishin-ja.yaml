- "id": "kds-p0008-002"
  "section_id": "introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "この何でもキチンとするといふ觀念から、今度家に於きましても家長といふものを立て、家の秩序をキチンとさせる。西洋などの家は新たに夫婦が結婚して家を作ります。家長はありませぬ。子供が出來て、その子供が大きくなりますと各々別に結婚して家を作る。自分の兩親の家を何處迄も維持して行かうといふ考がない。これを動物に例へては具合が惡いのですけれども、チヨツト例へて見ますと、雀などが春先きになると屋根の裏に巢を懸けませう、が巢の中で卵を生んで子供を育てます。物を持つて來て喰はして子供を育てる。ずつとその子供が大きくなり、唇に黃色いのが着いて居りますが、親に付いて飛んで步きます。黃色いのが取れる頃にはどれが親だか子だか分りませぬ。西洋邊りの生活をそれに比較してはチヨツト申譯けないのですが、詰り雀の生活が西洋人の生活に似て居る。かう言へば宜いでせう。(笑聲)雀の方が似てゐるのです。ですからその家といふものはそれで一代切りです。一代切りでなくなつて來る。ところが我國に於きましては自然に、昔からずつと一軒の家には家長といふものを立てる。その家長といふものは祖先からずつと承け繼いで來る。さうして子孫に傳へて行くかういふ家といふものが直線的です。その秩序を立てゝ行く。そこで今度子孫といふものが出來て來ます。澤山の家族がありますと同じ血統の者が殖えて來ますから、澤山の家はありますけれども、それが同一の血統であるといふことになる。それを氏族と言ひます。この氏族といふものには氏の上といふものがある。或は氏の長者と言ひます。あつちにもこつちにも氏の上がありまして、その一族を統一致します。それが天皇陛下に奉仕するといふことになる。氏の上として最も大切なことは、その祖先の神靈を祭るといふことである。さういふ具合にしてキチンと秩序立つて居る。一軒の家には一軒の家で妻子一族がその家長に依つて統一されて居る。その澤山の家長が氏の上に依つてずつと統一されて居る。かういふやうな秩序の観念といふものを日本國民は潜在的に持つて居つた。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 7
    "url": "https://dl.ndl.go.jp/pid/1092188/1/8"
  "translation_ja": "何でもきちんとするというこの観念から、家でも家長を立て、家の秩序を整えます。西洋などでは、夫婦が新しく結婚して家を作ります。家長はいません。子どもが生まれ、大きくなると、それぞれ別に結婚して家を作る。自分の両親の家を、いつまでも維持していこうという考えがない。これを動物にたとえるのは具合が悪いのですが、少したとえてみると、雀などは春先になると屋根裏に巣をかけ、その巣で卵を産んで子を育てます。食べ物を持ってきて食べさせ、育てる。子が大きくなると、口元に黄色いところを残しながら、親について飛び回ります。その黄色がなくなるころには、どれが親でどれが子か分かりません。西洋の生活をこれに比べるのは少々申し訳ないのですが、つまり、雀の生活が西洋人の生活に似ている。こういえばよいでしょう。〔笑い〕雀の方が似ているのです。ですから、その家は一代限りでなくなっていく。ところが、わが国では、自然に昔から、一軒の家には家長を立てます。その家長は祖先から代々受け継ぎ、子孫へ伝えていく。このように、家が一直線につながり、秩序を立てていくのです。やがて子孫が生まれ、多くの家族ができると、同じ血統の者が増えますから、家はたくさんあっても、同じ血統でつながっていることになる。それを氏族といいます。氏族には「氏の上」、あるいは「氏の長者」がいます。あちらにもこちらにも氏の上がいて、その一族を統一します。そして天皇陛下に奉仕することになる。氏の上の最も大切な務めは、その祖先の神霊を祭ることです。そうして、きちんと秩序立っています。一軒の家では、妻子や一族が家長によって統一され、その多くの家長が氏の上によって統一されている。日本国民は、こうした秩序の観念を潜在的に持っていたのです。"

- "id": "kds-p0011-002"
  "section_id": "chapter-kds-p0009-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "今申した如く、日本國民がこの皇國傳統の精神を以てずつと進んで行くのでありますけれども、この精神の如何なるものであるかといふことを自覺して居るのと、自覺して居ないのとは一生の中に非常な相違がある。それを自覺しない爲に邪路に迷つて一生を誤るといふ人間がある。併し人間には潜在的にその傳統の精神によつて進んで行かうといふ考があるのです。ところがその道が分らない。一體世の中には先生といふものがある。學問は勿論のこと、碁を打つても、將棋を指しても、擊劍をやつても、柔道をやつても、皆先生といふものがあります。吾々はその先生を尊敬してその先生の敎へに從つてやりましたならば、その道に上達するのであります。ところで、かういふ將棋といふやうなものは、それをする人だけ、擊劍、柔道といふやうなものは、それをする人だけがその先生を尊重する。碁を打たない人は碁の大先生を見ても、「あれが本因坊か」と言つても一向尊敬の念は起らない、「あれは本因坊か、何だか肺病のやうぢやないか」なんといふやうな失敬なことをも云ふ。(笑聲)で、一向尊敬の念が起らないが、碁を打つ人には實に神樣のやうになる。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 10
    "url": "https://dl.ndl.go.jp/pid/1092188/1/11"
  "translation_ja": "今述べたように、日本国民は皇国伝統の精神をもって進んでいきますが、この精神がどのようなものか、自覚しているかいないかでは、一生の間に非常な違いがあります。それを自覚せず、誤った道に迷い、一生を誤る人もいる。しかし人間には、潜在的に、その伝統の精神によって進もうという考えがあるのです。ところが、その道が分からない。世の中には、先生というものがあります。学問はもちろん、碁、将棋、剣道、柔道、何をするにも先生がいます。先生を尊敬し、その教えに従って行えば、その道で上達します。ただし、将棋、剣道、柔道などの場合は、それをする人だけが、その先生を尊重します。碁を打たない人が碁の大先生を見ても、「あれが本因坊か」というだけで、尊敬の念は少しも起こらない。「あれが本因坊か。なんだか肺病のようではないか」などと、失礼なことまでいいます。〔笑い〕まったく尊敬しないのですが、碁を打つ人にとっては、実に神のような存在になります。"
  "translation_status": "reviewed"

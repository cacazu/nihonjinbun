- "id": "kds-p0012-003"
  "section_id": "chapter-kds-p0009-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "尙.今日は神社といふのを宮と申します。宮は今社でありますが、宮は御屋といふことであります。宮といふのは家がある場合であります。社は榮樹一本でも社になります。宮といふのは御殿といふ意味であります。それでこの宮といふのは、昔は現人神と申しまして、人格を持つておいでになる神樣のお住みになるところで、今日の出雲大社は昔は日隅宮と申しました。日隅宮といふのは日はひもろぎのひがみと通ずると申しましたが、やはりみですみといふのは、すにマ行の變化を付けて活用することにしたのであります。本來はすといふのであります。すといふのは今日の住すといふことであります。で、ひすのみやは「御住ひの宮」といふことであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 11
    "url": "https://dl.ndl.go.jp/pid/1092188/1/12"
  "translation_ja": "なお、今日では神社を「宮」といいます。宮は今は社のことですが、語の意味は「御屋」です。「宮」は建物がある場合です。社は榊一本でも社になりますが、宮は御殿という意味です。昔、現人神といった、人格を持つ神がお住みになるところを宮といい、今日の出雲大社は、昔は日隅宮と呼びました。日隅宮の「ひ」は、神籬の「ひ」が「み」に通じると述べたように、やはり「み」です。「すみ」は「す」にマ行の変化を付けて活用させたもので、もとは「す」です。「す」は、今日の「住す」ということです。ですから、「ひすのみや」は「御住まいの宮」という意味です。"

- "id": "kds-p0024-004"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "右の次第で世の中に大切なものはいろ〱ありますが、併し私をして人生最も大切なものは何かと云はしめますれば、私は國家であると斷言致します。國家が若し混亂の狀態に陷りましたならば、如何にお金がありましたところが何にもなりませぬ。國家が外國の爲に占領されたり何かしましたならば、財產の保護なんかはとても期待できませぬ。今日印度邊りの狀態を見ても分ります。又名譽と言ひましても、その國家が滅びましたならば、名譽も何にもなりませぬ。ロシヤ邊りへ行くと、帝政時代の公爵や何かゞ荷車を引つ張つて居る。荷車を引つ張つて居て私は帝政時代にはこれでも公爵だと威張つたところが何にもなりませぬ。國家が滅びたならば如何なる名譽も丸きり價値がなくなります。或は又生命と言ひましたところが、我が國家などはかういふ風にキチンとして居りますから、吾々は平穩に暮して行くことが出來るのであります。若しこれが外國から侵略を受けるといふやうな狀態であつたら吾々は、ヂツとしては居られませぬ。でありますから詰り人生の總べての價値の根源は國家にありまして、國家が堅實であつて初めてこれ等の價値は生じて來るのであります。あらゆるものゝ價値は國家が基になつて來るのでありますから、吾々はこの國家をどこ迄も發展して行かなければなりませぬ。將來は國際關係が益々複雜になつて來まして、我國なども動もすれば孤立の狀態に陷らんとするやうな形勢でありますがたとへ孤立になつても、吾々がこの傳統の精神を翳して進んで行きましたならば、世界が束になつて我國を攻め"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 23
    "url": "https://dl.ndl.go.jp/pid/1092188/1/24"
  "translation_ja": "このように、世の中には大切なものがいろいろあります。しかし、人生で最も大切なものは何かと私に問われれば、国家だと断言します。国家が混乱に陥れば、どんなにお金があっても役に立ちません。外国に占領されれば、財産の保護はとても期待できない。今日のインドなどの状態を見ても分かります。名誉も、国家が滅びれば何にもなりません。ロシアでは、帝政時代の公爵などが荷車を引いている。荷車を引きながら、私はこれでも帝政時代には公爵だったと威張っても、何にもならない。国家が滅びれば、どんな名誉も価値を失います。生命も、わが国のように国家が整っているからこそ、平穏に暮らせるのです。外国の侵略を受ける状態になれば、じっとしてはいられません。つまり、人生のすべての価値の根源は国家にあり、国家が確固としていて初めて、それらの価値が生まれます。あらゆる価値の基礎が国家なのですから、私たちは、この国家をどこまでも発展させなければなりません。将来、国際関係はますます複雑になり、わが国も、ともすれば孤立しかねない情勢です。しかし、たとえ孤立しても、伝統の精神を掲げて進めば、世界が束になってわが国を攻め"
  "translation_status": "reviewed"

- "id": "kds-p0016-005"
  "section_id": "chapter-kds-p0016-004"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "以上のやうな傳統の精神につれて、我國では事實を尊重するのであります。支那などでは、昔から理論的研究が發達したのでありますが、我國は神ながら言擧せぬ國と云ひ、事實を尊重し、實行を尊ぶのであります。ですから學校のやうなものも中々發達しませぬ。國民の敎化も全く事實に基いて、實際の事柄で行はれました。右に述べました敬神崇祖といふやうなことも、例へば神武天皇の御卽位の四年に「鳥見山といふ山に齋場を設けて、天の神を御祭りになつたのでありますが、その天つ神を御祭りになるその事柄で以て、かういふ風に神樣を崇敬しなくてはいかんぞといふことを御示しになるのであります。さうしてかう云ふ風なお祭りには、必ず祝詞といふ"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 15
    "url": "https://dl.ndl.go.jp/pid/1092188/1/16"
  "translation_ja": "以上のような伝統の精神に伴って、わが国では事実を尊重します。中国などでは、昔から理論的研究が発達しましたが、わが国は「神ながら言挙げせぬ国」といって、事実と実行を重んじます。そのため、学校のようなものもなかなか発達しません。国民を教え導くことも、まったく事実に基づき、実際の事柄を通じて行われました。先に述べた敬神崇祖にしても、例えば神武天皇は、即位四年に鳥見山という山に斎場を設け、天の神を祭られました。その祭りという事実によって、このように神を崇敬しなければならないと示されるのです。そして、こうした祭りでは、必ず祝詞という"

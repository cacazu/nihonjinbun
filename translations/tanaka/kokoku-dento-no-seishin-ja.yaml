  "source_variants":
  - "kind": "ocr"
    "text": "ところがこの皇國傳統の精神、かういふものは日本國民の悉く體現しようといふ精神でありますから、その精神の偉大なる御方は、日本國民が悉くこれを崇敬することになる。日本國民が一人殘らず尊敬するさう云ふ御方はどういふ御方であるかといふと、それは神樣として祭らるゝ御方であります。伊勢に御祭りしてあります天照大御神樣、或は橿原神宮の神武天皇樣、或は八幡宮の應神天皇樣、かういふやうな歷代の天皇樣、或は談山神社に御祭りしてある藤原鎌足公、或は護王神社に御祭りしてある和氣〓麿公、或は天滿宮に御祭りしてある菅原道實公、或は湊川神社に御祭りしてある楠木正成소、かういふ御方は皇國精神の偉大なる體現者であらせられるのであります。吾々國民は悉くそれを崇敬して、その偉大なる大精神を吾々が體現して實踐して行かうといふのであります。日本國民の神樣として祭りますのはさういふ御方であります。さういふ御方を皆神社に御祭りする。その神樣は詰り祖先の神樣で、その祖先の神樣が我國に於いては總てのものゝ主宰神としてお祭りしてあるのであります。山があれば山に山の神樣、或は川があれば川に川の神樣、總てのものにさういふ神靈がお出でになる。"

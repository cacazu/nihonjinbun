- "id": "kds-p0004-004"
  "section_id": "introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "さういふ具合で遺傳や境遇や教育といふやうなものに因つて人々の精神がいろ〱に違つて來ます。ところがその人々が唯一人で生活しない。人間は離群索居と云ふ風に、一人で他の者から離れて生活することは出來ない必ず集團生活する。その集團の第一步は家族であります。それから段々とその家が集りまして町村といふものになる。さういふやうな團體の生活をしますとその集團で又一つの精神が違つて來る。一軒の家がありますとその家の精神-昔はよく家風と申しました。新たに嫁に行きましたり養子に行きましたりしましたならば、その家の家風に従はなければならぬ。家風に反するといふので離緣といふやうな不祥なことが起るやうなことがあつたものであります。この家風といふのは卽ち家族の精神であります。その家の精神であります。それから今度町村といふ具合になりますと、又町村の精神といふものがあります。町村全體の人の働き方であります。それでその土地に這入りましたならば、その土地の風に從はなければならぬ。詰りその土地の精神を尊重しなければならぬといふことであります。それは昔から「鄕に入つては鄕に從へ」といふことであります。「鄕」といふのは詰り今日の町村といふやうなものであります。それからさういふ團體が更に大きくなりますと一つの國になります、大日本帝國、或はアメリカ、イギリス、フランスといふやうな一つの國になります。その一つの國になると又その國の精神といふものが違つて來る。アメリカなどになりますと「自由、平等、博愛」といふやうなことを尊重する。「我れに自由を與へよ、然らずんば死を與へよ」といふやうなことを申します。それをアメリカの建國以來の傳統の精神とするのであります。さう云ふ風に一つの國家を成しますと、その國家に固有の精神といふものが出來る。その精神は丁度吾々個人の間の精神が違ひますやうに、一の國家の精神と他の國家の精神とを較べますとそれが違ふ。それはその國民全體の遺傳、國民全體の境遇、國民全體の教育と云ふものによるのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 3
    "url": "https://dl.ndl.go.jp/pid/1092188/1/4"
  "translation_ja": "このように、遺伝や境遇や教育といったものによって、人々の精神はさまざまに違ってきます。しかし、人はたった一人で生活しているのではありません。人間は「離群索居」というように、ほかの人々から離れ、一人で暮らすことはできない。必ず集団生活をします。その集団の第一歩は家族です。そして、その家が次第に集まって町村となる。そうした団体生活をすると、その集団ごとに、また精神の違いが生じます。一軒の家があれば、その家の精神がある。昔はよく家風といいました。嫁に行ったり養子に入ったりすれば、その家の家風に従わなければならない。家風に反するといって、離縁という不幸なことが起こる場合もあったものです。この家風は、つまり家族の精神、その家の精神です。次に町村となると、町村にも精神があります。町村全体の人々の働き方です。それで、その土地に入ったなら、その土地の風習に従わなければならない。つまり、その土地の精神を尊重しなければならないということです。昔からいう「郷に入っては郷に従え」です。「郷」は、今日の町村のようなものです。そうした団体がさらに大きくなると、一つの国になる。大日本帝国、あるいはアメリカ、イギリス、フランスといった国です。一つの国になると、今度はその国の精神に違いが生じる。アメリカなどは「自由、平等、博愛」を尊重します。「私に自由を与えよ。さもなければ死を与えよ」といったことをいいます。それを、アメリカ建国以来の伝統の精神とするのです。このように一つの国家ができると、その国家に固有の精神が生まれる。その精神は、私たち個人の精神が互いに違うのと同じように、ある国家の精神と別の国家の精神とを比べれば違っています。それは国民全体の遺伝、国民全体の境遇、国民全体の教育によるのです。"
  "translation_status": "reviewed"

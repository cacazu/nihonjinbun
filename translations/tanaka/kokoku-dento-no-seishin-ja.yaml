- "id": "kds-p0010-001"
  "section_id": "chapter-kds-p0009-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "人に踏まれて終ふ。こゝに人が轉つて居るから踏んではいけないぞ、と言つたところが、徹底しませぬ。足の下に踏まれて蹂躪されて、臟腑も何も出て終つて動きが取れませぬ。日本國民が過去幾千年來今日の發展を遂げますのには矢張りこの傳統の精神で日本國民がずつと來て居るのです。今日でも日々現在旣に一分間、一分間歷史を作り出しつゝある。その間に矢張りこの日本精神、傳統の精神がずつと生きつゝある。その中の一人が反對の方向へ行かうと思つても行かれやしませぬ。難波大助の如き幸德秋水の如き、あゝいふ者がこの傳統の精神に反抗して行かうと思つたものですから今申した如く踏み潰されて終ふ。生存出來ませぬ。ですからして日本國民は何んでもこの傳統の精神で以て進んで行くのであります。ところが多くの人はそれを知らないでやつて居る。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 9
    "url": "https://dl.ndl.go.jp/pid/1092188/1/10"
  "translation_ja": "人に踏まれてしまう。「ここに人が倒れているから踏んではいけない」といっても、徹底しません。足の下で踏みにじられ、内臓まで出てしまい、身動きが取れなくなる。日本国民が過去数千年にわたって今日の発展を遂げたのも、この伝統の精神によって進んできたからです。今日も、日々、一分一分、新しい歴史を作り出している。その間も、この日本精神、伝統の精神が生き続けています。その中の一人が反対の方向へ行こうとしても、行けはしません。難波大助や幸徳秋水のような者は、この伝統の精神に反抗しようとしたから、今述べたように踏みつぶされてしまう。生存できません。ですから、日本国民は、何事もこの伝統の精神によって進んでいくのです。しかし、多くの人は、それを知らずに行っています。"

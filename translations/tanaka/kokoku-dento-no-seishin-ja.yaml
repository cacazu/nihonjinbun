- "id": "kds-p0009-002"
  "section_id": "introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "かういふやうな精神が潜在的に日本國民にありましたが、それが段々發展して所謂皇國傳統の精神となつて參る。丁度支那に揚子江といふ川がありますが、揚子江といふやうな川は川の幅でも三里も四里もあるといふことであります、さういふ川などになると川だか海だが見當が付かぬ位であります。我國は國が小さいから川も皆小さいのですが、揚子江邊りは下から七百五十里位も汽船で上ることが出來るといふ、以て如何に大いなる川なるかを知るべきであります。その他御承知の通り地圖で見ますと、外國にはアフリカのナイル河、アメリカのミシシツビー河、アマゾン河とかいふやうな洋々たる大河がある。その洋々たる大河も源へ行きますとポタリ〱と落ちる水です。その山の中で淸水のやうになつてポタリ〱と落ちる水が下流になつて來ると洋々たる大河になる。この皇國傳統の精神も元はさういふ具合に潜在的になつて、チヨツトウツカリして居ると氣が付かぬやうである。併しそれが段々と發展して來て遂に今日のやうな大精神となつて參つて來て居るのであります。"
  "source_languages":
  - "ja"
  "source_locations":

    "url": "https://dl.ndl.go.jp/pid/1092188/1/23"
  "translation_ja": "になってしまいます。だから象や鯨は、いつまでも象や鯨として暮らさなければならず、文化を発達させ、人類を超えることはできません。人間に捕らえられ、おいしいといわれて刺身などにされてしまう。脳が小さいので駄目なのです。では、日本人と西洋人を比べてご覧なさい。平均身長を見ても、日本人はおよそ五尺三寸、西洋人はイギリス人が五尺七寸、アメリカ人は大きくて五尺七寸五分だそうです。五尺七寸五分と五尺三寸とでは、非常に違います。東京には、アメリカの軍艦などが入港すると水兵が来ます。私は五尺三寸五分ですが、西洋人はこのように〔上を向く〕見上げるほどです。それだけ身体が大きいのですから、脳が日本人より少し重くても駄目なのです。そこで身体と比較すると、世界の人類の中で、日本人の脳が平均でいちばん重いことになる。たいしたものではありませんか。〔笑い〕そうすると、日本人は自然に、世界で優秀な民族として生まれてきたわけです。これは架空の議論ではなく、科学的に説明できます。それで、私たちは今日、五大強国になっていますが、日露戦争当時は世界の八大強国といわれました。その後、ロシアが滅び、オーストリア・ハンガリーもなくなり、ドイツが敗れたので、五大強国となった。欧州大戦のときには五大強国でしたが、ワシントン条約では三大強国となり、今日では事実上、三大強国になっています。最初は八つ。それが三つ減って五大強国、さらに少し弱い二つが抜けて三大強国となった。この順序で進めば、とうとう一大強国となるでしょう。そして、先に述べたような優秀な民族が、優秀な伝統の精神を発展させていけば、いつでも日本が残り、最後まで残るでしょう。"

  "translation_ja": "そもそも人間が、知ってすることと、知らずにすることとの間には、大きな差があります。例えば、皆さんは食事をなさいます。私も食べます。人間である以上、「私は食事をしません」という人はいません。米を食べなければパンを食べる。パンでなければ果物を食べる。何かは食べます。それらをまとめて、ご飯といいましょう。ご飯を食べない人はいないでしょう。しかし、食べるにしても、今日よく発達してきた栄養の研究や、食べる目的について自覚して食べるかどうかで、大きな違いがあります。ただむやみに食べる。一体、何のために食べるのか。そんなことを考えている人が、いるかどうか。昔、ギリシャのソクラテスは「私たちは食べるために生きるのではなく、生きるために食べるのだ」といいました。簡単なことですが、多くの人には、それがなかなか分からない。食べるために生きている人がたくさんいます。かつて、茨城県の土浦で青年たちが集まり、汁粉の食べ比べをしようと提案したところ、すぐ賛成がありました。二十杯食べた者に一等賞をやるというので、寄付などで賞品もたくさん集まったそうです。いよいよ予定の日になり、「我こそはと思う者は来い」と青年たちが集まって食べる。八杯、九杯と食べる者もいますが、汁粉はなかなか大量には食べられません。以前、東京の銀座では、十二杯以上食べた人からは代金をいただかない、ということをやったそうです。一杯十銭なら十二杯で一円二十銭、それをただにするというのです。若者たちは「俺は行って十二杯食べてやろう」と出かけますが、たいてい七、八杯、十杯くらいで音を上げる。すると、一円ほど払わなければなりません。〔笑い〕普通なら一、二杯で十銭か二十銭で済むのに、無理に十杯ほど食べても十二杯には届かず、一円出さなければならない。その汁粉屋はたいそうもうかったそうです。土浦でも青年たちは集まって食べましたが、なかなか食べられない。豪傑でも十二、三杯で音を上げる。ところが、一人が「なに、やりきれないことはない」と、しまいには箸で喉に押し込むようにして、とうとう二十杯食べたというのです。〔笑い〕それで一等賞をもらった。一等賞はよいのですが、一時間ほどすると目の色が変わってきた。様子がおかしいと、医者のところへ駆けつけるなど大騒ぎになりました。医者が来ていろいろ診察すると、急性腹膜炎だという。そして間もなく死んでしまったそうです。つまり、その青年は、この世に二十杯の汁粉を食べるために生まれてきたようなものです。〔笑い〕そういう人が、世間にはときどきいます。ソクラテスのいったとおり、私たちは食べるために生きるのではなく、生きるために食べる。そして、生きて何をするのかといえば、人生の理想を"

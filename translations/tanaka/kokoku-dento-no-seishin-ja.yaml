- "id": "kds-p0025-001"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "て來ても、吾々はこの祖國を維持し、祖國を發展することが出來るのであります。さういふ具合にどこ迄も不健全な外來の思想などに迷はないで、今日ありますところのマルキシズムとか、アナーキズム卽ち無政府主義とかその他色々の不健全な思想に迷はないで、以上申しましたやうな我國傳統の精神を高く揭げて、かういふ外來の不健全なる思想の這入る餘地がないやうにして、この天壤無窮の皇運を扶翼して行かなければなりませぬ。さうしてこゝに我國家は實に永久不變のものとなりまして、國民の福利は益々增進して行くといふことになつて參るのであります。でありますからして吾々はどこ迄もこの皇國傳統の精神を十分に膽に銘じて進んで行かなければならないと考へる次第であります。炎暑の際に長時間御靜聽を煩しまして恐縮に存じます。これを以て終りと致します。(拍手)"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 24
    "url": "https://dl.ndl.go.jp/pid/1092188/1/25"
  "translation_ja": "てきても、私たちは祖国を維持し、発展させることができるのです。そのように、不健全な外来思想に惑わされず、今日のマルクス主義やアナーキズム、つまり無政府主義、その他さまざまな不健全な思想に迷わず、以上申し上げたわが国の伝統の精神を高く掲げ、そうした外来の不健全な思想が入り込む余地をなくして、天地とともに尽きることのない皇運をお助けしなければなりません。そうすれば、わが国家は永久不変のものとなり、国民の幸福と利益はますます増進していきます。ですから、私たちは、どこまでもこの皇国伝統の精神を十分に心に刻んで、進んでいかなければならないと考えております。暑い中、長時間お聞きいただき、恐縮に存じます。これで終わりといたします。〔拍手〕"
  "translation_status": "reviewed"

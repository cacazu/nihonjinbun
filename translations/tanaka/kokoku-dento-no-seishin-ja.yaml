- "id": "kds-p0022-001"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "立ちましたら大變です。骨ぐるみ食べる譯に行きませぬ。ところが儒敎でも、佛敎でも、西洋の思想でも、これを骨ぐるみ食べましたら非常に害になる。だから吾々はその骨を取り、榮養にならぬところのもの、害になるところのものを取つて食べなければなりませぬ。殊に鯛の刺身などは持つて來いであります。鯛の刺身は骨を取つてありますから小さい子供でも食べられるやうになる。さういふ具合に外國の思想をみな取つて來て刺身のやうにして食べますと、そこで皇國傳統の精神の培養になつて、ずつとこれを發展させることが出來るのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 21
    "url": "https://dl.ndl.go.jp/pid/1092188/1/22"
  "translation_ja": "刺さったら大変です。骨ごと食べるわけにはいきません。儒教でも仏教でも西洋思想でも、骨ごと食べれば大きな害になります。骨を取り、栄養にならないもの、害になるものを取り除いて食べなければならない。鯛の刺身などは、まさに適しています。骨が取ってあるので、小さな子どもでも食べられる。そうした具合に外国思想を取り入れ、刺身のようにして食べれば、皇国伝統の精神を養い、さらに発展させることができるのです。"

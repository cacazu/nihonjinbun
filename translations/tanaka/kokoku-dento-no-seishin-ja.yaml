- "id": "kds-p0023-002"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "歷史は繰返へすものと云はれて居ります。昔から日本を滅さうと思つて外國から軍を起して來ます。弘安の役に百戰練磨の蒙古軍が攻めて來ました。ところがその蒙古卽ち元國は日本を攻めて來たが、負けて生きて歸る者が僅かに三人であつた。それが原因となつて元國は滅びて終ひました。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 22
    "url": "https://dl.ndl.go.jp/pid/1092188/1/23"
  "translation_ja": "歴史は繰り返すといいます。昔から、日本を滅ぼそうとして、外国が軍を起こして攻めてきました。弘安の役には、百戦錬磨の蒙古軍が攻めてきました。しかし、蒙古、すなわち元は、日本を攻めて敗れ、生きて帰った者はわずか三人でした。それが原因となって、元は滅びてしまいました。"
  "translation_status": "reviewed"

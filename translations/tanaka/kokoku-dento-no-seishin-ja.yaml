    "source_sequence": 19
    "url": "https://dl.ndl.go.jp/pid/1092188/1/20"
  "translation_ja": "孟懿子が孝について尋ねると、孔子は「違えてはならない」といわれた。樊遅が御者を務めていたとき、孔子は「孟孫が私に孝を尋ねたので、私は『違えてはならない』と答えた」と告げられた。樊遅が「どういう意味ですか」と尋ねると、孔子は「親が生きているときは礼に従って仕え、亡くなったら礼に従って葬り、礼に従って祭るということだ」といわれた。"

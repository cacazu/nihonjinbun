- "id": "kds-p0012-002"
  "section_id": "chapter-kds-p0009-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それから磐境といふことは磐は座といふことであります。今日でもいろ〱のものをくらと申します。倉庫の倉、馬の鞍などそれであります。總てくらといふのは物を置くところであります。こゝに机がございますがこれなども國語で言ひますとくらであります。磐といふのは天岩屋戸だの何だのと言つて、堅固の意味に盛んに使ひます。「常磐に堅磐に」とも言ひますが、常磐は常磐、堅磐は堅い磐といふ意味であります。磐境と言ひますと堅固な動かないところの境といふ意味であります。動かないところの座であります。それは神樣がそこに御鎭座なさるゝところでありますから、動かない實に堅固な座であります。かういふ譯で磐境は神籬の座になるのでありまして、神籬磐境といふのは今日の神社であります。天孫が降臨遊ばす時に高御產巢日神が天兒屋命、布刀玉命といふ神樣に仰せになりました。汝天兒屋命、太玉命、宜しく天の神籬を持ちて葦原中つ國に降りて、亦吾孫の爲に齋き奉れ。かういふことを仰せになつて居ります。これが右の次第で神社を立てゝ祭れと仰せになつたのであります。かくて敬神崇祖は最も重要な皇國傳統の精神となつたのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 11
    "url": "https://dl.ndl.go.jp/pid/1092188/1/12"
  "translation_ja": "それから磐境（いはさか）ですが、「磐」は座（くら）ということです。今日でもいろいろな物を「くら」と呼びます。倉庫の倉、馬の鞍などです。「くら」はすべて、物を置くところを指します。ここに机がありますが、これも国語でいえば「くら」です。「磐（いは）」は天岩屋戸などというように、堅固という意味で盛んに使います。「常磐に堅磐に」ともいいますが、常磐は常に変わらない磐、堅磐は堅い磐という意味です。「磐境」は、堅固で動かない境（さか）という意味です。動かない座で、神がそこに鎮座される場所ですから、実に堅固な座なのです。そのため、磐境は神籬の座となり、神籬・磐境は今日の神社に当たります。天孫が降臨なさるとき、高御産巣日神が天児屋命と布刀玉命に、「お前たち天児屋命、太玉命は、天の神籬を持って葦原の中つ国に降り、私の孫のためにも、慎み祭りなさい」とおっしゃいました。これは、今説明したように、神社を建てて祭れと命じられたのです。こうして、敬神崇祖は最も重要な皇国伝統の精神となりました。"
  "translation_status": "reviewed"

- "id": "kds-p0011-004"
  "section_id": "chapter-kds-p0009-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "さういふ神靈を御祭りするのに、上代には、神籬、磐境と申すものを用ひます。神籬といふのはいろ〱說がございますけれども、兎に角、ヒとミとは通ずるのであります。神室或は御室、詰り室であります。室といふのは今日では室と申します。昔神樣のお出でになつたところは奥まつたところでありますから室であります。須佐之男命が八田間大室にお出でになつたといふことが書いてありますが、その室は或は森であります。これは皆通ずるのであります。森といふのは今日でも鎮守の森と申しますが、總て樹のこんもりしたところです。一本の樹でも之を神籬と申しました。その樹は榮樹と申"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 10
    "url": "https://dl.ndl.go.jp/pid/1092188/1/11"
  "translation_ja": "その神霊を祭るため、上代には神籬、磐境というものを用いました。神籬についてはいろいろな説がありますが、とにかく「ひ」と「み」は通じます。神室（ひむろ）、あるいは御室（みむろ）、つまり室（むろ）です。「むろ」は、今日の「部屋」に当たります。昔、神がいらした場所は奥まったところでしたから、室なのです。須佐之男命が八田間大室に来られたと書かれていますが、その室は森でもあります。これらはみな通じます。森は、今日でも鎮守の森といいますが、木がこんもり茂ったところです。一本の木でも神籬といい、その木を栄樹と呼び"
  "translation_status": "reviewed"

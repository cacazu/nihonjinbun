- "id": "kds-p0008-003"
  "section_id": "introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "第三には義氣の旺盛であります。義に依つて行動してどんなことがあつても後へ引かぬ。正しい道に立つては後へ引かないといふ精神に日本國民は富んで居る。天照大御神のやうな女性の神樣であらせられても、須佐之男命が高天原にお出でになります時に於ては、必ずこれは異心を懷いて來るに相違ないといふので、千入の靫、百入りの靫と申しまして、澤山の矢を背中に御背負ひになりまして武裝をなさつた。さうして弓を突いて非常な勢を以て須佐之男命がお出でになる時に、「お前は何故に上つて來たのだ」と大きな聲で仰せになつたといふことである。又天宇受賣命といふのがあります。天宇受賣命といふのは、天孫が降臨遊ばす時に天の八衢といふ道の分れる所へお出でになつた。さうすると猿田毘古神がそこへ出てお出でになる。「上は高天ケ原を光し、下は葦原の中つ國を光す」と書いてありますが、それは實に眼の光がするどく、所謂眼光烱々人を射るといふ程の大きな御方で非常に勇敢な御方であつた。あゝいふ者があそこに立つて居るが何だらう、チョット行つて聞いて見よといふのでありますけれども、どの神樣も聊か躊躇の色が見えます。そこでこの天宇受賣命といふ女性の神樣-女性の神樣でも中々御强い、その天宇受賣命を御遣はしになると、天宇受賣命は「今天の神の御子が御降りにならうとする際に、その道に立つて居る者は何者だ」かういふ具合に御叫びになると、「自分は國つ神で猿田毘古神といふのであるが、天孫が御降りになるといふので御迎へに來たのである」かう言ふ次第で大變都合が好かつたの"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 7
    "url": "https://dl.ndl.go.jp/pid/1092188/1/8"
  "translation_ja": "第三は、義気が盛んなことです。正義に従って行動し、何があっても引き下がらない。正しい道に立ったなら退かないという精神に、日本国民は富んでいます。天照大御神のような女性の神でさえ、須佐之男命が高天原に来られるときには、きっと異心を抱いて来るに違いないと、千入の靫、百入の靫という、多くの矢を背負って武装されました。そして弓を突き立て、たいへんな勢いで、須佐之男命に「お前はなぜ上ってきたのか」と大声でおっしゃったということです。また、天宇受売命という神がいます。天宇受売命は、天孫が降臨なさるとき、天の八衢という道の分かれるところへ来られた。すると、そこに猿田毘古神が出ておられる。「上は高天原を照らし、下は葦原の中つ国を照らす」と書かれていますが、実に鋭い目の光を持ち、いわゆる眼光がきらきらと人を射るほどの、大きく勇敢な方でした。「あのような者が立っているが何者だろう。ちょっと行って尋ねてみよ」というのですが、どの神にも、いささかためらう様子が見えます。そこで、天宇受売命という女性の神――女性の神でも、なかなかお強い――をお遣わしになります。天宇受売命が「今、天の神の御子が降りようとなさるときに、その道に立っているのは何者か」と叫ばれると、猿田毘古神は「自分は国つ神で、猿田毘古神という。天孫がお降りになるので、お迎えに来たのだ」と答える。こういうわけで、たいへん都合がよかったの"
  "translation_status": "reviewed"

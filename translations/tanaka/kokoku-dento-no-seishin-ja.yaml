- "id": "kds-p0017-001"
  "section_id": "chapter-kds-p0016-004"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "ものを奏上する。今日もお宮でお祭りのある時には、之れを申上げますが、その祝詞の言葉には、何時でも天孫が高天ケ原から天の磐座を放ち、天の八重雲をいつのち別きにち別きて天降し依さしまつりき」と云ふやうに傳へて天孫がこの國に御降りになり、こゝに常磐に堅磐にすめら大御國を御建てになつたといふ風な事實の說明があるのであります。さういふ祝詞をお祭りの度每、多くの人が集つて居る度每に讀上げられる。それでありますからして皇室の尊嚴であるといふことがもう事實によつて敎育されて來るのであります。かう云ふ風で、我國ではすべて事實を尊重しまするので、先例舊規と云ふことがいつでも大切となつて居ります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 16
    "url": "https://dl.ndl.go.jp/pid/1092188/1/17"
  "translation_ja": "ものを奏上します。今日も神社の祭りで奏上しますが、その言葉には、つねに天孫が高天原の磐座を離れ、幾重にも重なる雲を力強く押し分けて、降臨を委ねられたということが伝えられています。天孫がこの国に降り、永遠に揺るがぬ皇国をお建てになった、という事実の説明があるのです。この祝詞が祭りのたびに、多くの人が集まるたびに読まれる。ですから、皇室の尊厳が、事実によって教育されていくのです。このように、わが国ではすべて事実を尊重するので、先例や古くからの規則が、いつでも大切にされています。"
  "translation_status": "reviewed"

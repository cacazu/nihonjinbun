- "id": "kds-p0024-002"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一體この人間の世の中で、一番貴いものは何でありませうか。人に依りますと、此の問題に對してこの世の中で最も貴いものはお金であると申します。「マネー·イズ·パワー」お金は權力である、お金は總べてものを作り出すものである。立派な家が欲しいと思ふならば、直ぐお金さへあれば立派な家が出來る。立派な自動車を作つて乘つて見たいと思へば立派な自動車を作ることが出來る。お金があれば何でも出來る、慶應義塾を創められた福澤先生は盛んにこの黄金萬能を唱へられたと云ふことであります。二人の生徒が或る時先生のところへ訪問したら、先生がその二人の生徒に對してお前には財產があるかと聞かれ、財產のある方の生徒を上座に就かしめられたといふ話があります。(笑聲)果してさうであつたかは明確でありませんが、然るに慶應の學風はお金を重じた事だけは否定出來ないのであります。それですから今日でも慶應の出身者は經濟社會に非常に進出しまして、日本の實業の方面には非常な潜勢力を有して居るのであります。とに角人生に一番大事なものはお金であると。さう云ふものが大變多數にあることは疑ふ餘地はありませぬ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 23
    "url": "https://dl.ndl.go.jp/pid/1092188/1/24"
  "translation_ja": "そもそも人間の世の中で、いちばん貴いものは何でしょうか。人によっては、お金だといいます。「マネー・イズ・パワー」、お金は力であり、あらゆるものを作り出す。立派な家が欲しければ、お金さえあればすぐにできる。立派な自動車を作って乗りたければ、それもできる。お金があれば何でもできる。慶應義塾を創立した福澤先生は、金の力は万能だと盛んに説かれたそうです。二人の生徒が訪ねたとき、先生が財産の有無を尋ね、財産のある方を上座に座らせた、という話があります。〔笑い〕本当にそうだったかは明確ではありませんが、慶應の学風がお金を重んじたことは否定できません。それで、今日も慶應出身者は経済界に大きく進出し、日本の実業界に非常に大きな潜在勢力を持っています。ともかく、人生で最も大切なのはお金だという人が、大勢いることは疑いありません。"
  "translation_status": "reviewed"

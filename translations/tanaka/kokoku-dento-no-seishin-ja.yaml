  "translation_ja": "要するに、和魂漢才の根本主義は、日本という国家を基礎として、世界のあらゆる文化を取り入れることです。今日も西洋思想が盛んに入ってきますが、それらを取り入れ、皇国伝統の精神によって、日本文化が発展するようにしなければなりません。近ごろ問題になっている天皇機関説などは、西洋のものを丸呑みにした結果です。何でも丸呑みにするのはよくありません。儒教でも仏教でも西洋思想でも、そのまま呑み込めば日本には当てはまらない。皇国伝統の精神によって改造しなければならないのです。そうして改造されたものは、さらにこの伝統の精神を発展させる材料になります。ちょうど、私たちが魚を食べるようなものです。日本人は鯛を喜んで食べますが、イギリスなどでは、鯛は人間が食べるものではなく、猫にやるものだといって、魚の中でも最も安いものだそうです。あんなにおいしいものを、なぜ食べないのだろうと不思議に思いますが、西洋の鯛はまずいのかもしれません。〔笑い〕どういうわけか、イギリスなどではあまり食べない。わが国では「腐っても鯛」といい、たいへん尊重します。しかし、煮た鯛を頭からがりがり食べれば、鯛の骨は鰯と違って硬いので、喉に"

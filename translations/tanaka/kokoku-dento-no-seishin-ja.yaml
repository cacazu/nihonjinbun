- "id": "kds-p0021-004"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それから儒敎が傳はつて來まして後に、欽明天皇十三年に佛敎が傳はつて參りましたが、佛敎は佛樣を拜む。我國は神樣を拜む。そこが一致しないところがあります。それでありますからして、佛敎が傳はりまして、それを更に政權を掌握するに利用して、蘇我氏と物部氏との爭ひになりました。併し後には所謂神佛習合、本地垂跡といふやうな說が出まして、神道と佛敎と同一である、詰り佛敎が日本化された。儒敎も日本化して、禪讓放伐などゝいふやうなことは、日本の儒敎には斷じて取らぬ。佛敎も本來印度の佛敎は、未來といふことを盛んに說くし戒律といふことを喧しく言ふ。ところが日本の佛敎は大乘佛敎と言ひまして、大乘佛敎といふものは所謂現象卽實在、娑婆卽寂光土と言ふ。娑婆と申しますとこの娑婆世界、娑婆世界が卽ち寂光の阿彌陀樣の世界だ。詰り現象卽實在、さういふ哲學であります。現象卽實在、或は煩惱卽菩提、煩惱が直ちに菩提だといふのです。菩提といふのは佛道を體得したところのものであります。さういふ具合に言ふのです。それでありますからして、日本の大乘佛敎は印度邊りに盛んに行はれる小乘佛敎とはまるで違ふ。佛敎では結婚などをしない。小乘の方ではそれを戒律として非常に喧しく言ふのですけれども、日本の佛敎は結婚する。殊に眞宗などでは盛んに結婚致します。又印度では魚を食べることは出來ないのですけれども、日本では盛んに食べる。總て佛敎が皇國傳統の精神によつて改造せられて居ります。だから等しく佛敎と申しましても、日本の佛敎は印度の佛敎とはまるきり樣子の變はつた佛敎が出來て居るのであります。之れがやはり和魂漢才でありまして、かうした佛敎が日本の文化に貢獻して居る點は大なるものがありまして、何人も之れは否定することは出來まいと思ひます。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 20
    "url": "https://dl.ndl.go.jp/pid/1092188/1/21"
  "translation_ja": "儒教が伝わった後、欽明天皇十三年に仏教が伝来しました。仏教は仏を拝み、わが国は神を拝むので、一致しないところがあります。それで、仏教が伝わると、それを政権掌握にも利用して、蘇我氏と物部氏の争いになりました。しかし後には、神仏習合、本地垂迹という説が出て、神道と仏教は同じだとするようになった。つまり、仏教が日本化されたのです。儒教も日本化され、禅譲放伐などは、日本の儒教には断じて取り入れない。仏教も、本来インドでは来世を盛んに説き、戒律を厳しく論じますが、日本の仏教は大乗仏教といって、「現象即実在」「娑婆即寂光土」と説きます。この娑婆世界が、そのまま寂光の阿弥陀仏の世界である。つまり、現象がそのまま実在だという哲学です。また「煩悩即菩提」といって、煩悩がそのまま菩提であるという。菩提とは、仏道を体得した境地です。このように説くのです。ですから、日本の大乗仏教は、インドなどで盛んに行われる小乗仏教とはまったく違います。仏教では結婚をせず、小乗では戒律として厳しく論じますが、日本の仏教では結婚する。とりわけ真宗などでは、盛んに結婚します。また、インドでは魚を食べられませんが、日本では盛んに食べる。仏教はすべて、皇国伝統の精神によって改造されているのです。同じ仏教といっても、日本では、インドとはまったく様子の違う仏教ができています。これも和魂漢才です。こうした仏教が日本文化に大きく貢献していることは、誰にも否定できないと思います。"
  "translation_status": "reviewed"

  "source_text": "第一には敬虔の感情といふのであります。敬虔といふことは總て愼しむといふことであります。日本國民は殊に神樣などに對して愼しむところの精神がある。どこに出ても愼しむ精神を本來持つて居る。敢て教育や何かを受けないでもさういふ精神がある。それでありますから、我國の昔は神代と申しまして、その時にはいろ〱の神樣が活動遊ばす。至るところに神樣が居られ、蒼生を支配なさる。今日で言ふならば政治家或は教育家、或は宗教家、さういふやうな方が昔は皆神樣なのです。それで國民が神樣に對するのでありますから、無作法なことは出來ませぬ。神樣の御支配を受ける。朝から晩迄、晩から朝迄常に神樣が照臨遊ばしておいでになる。さういふ上代の風でありますからして、國民が極めて一言一句おろそかにしませぬ。『古事記』とか『日本書紀』とかいふやうな昔の事の書いてある本を讀んで御覽になりますと、如何に言葉が一つ一つ尊敬の言葉から成つて居るかに御注意なることでありませう。何の神宣り給はく、申し給はく、皆さういふ具合になつて居ります。それは詰り本來の日本國民が知らず識らずに敬虔の精神に滿ちて居るといふことが分ります。それから我が上代に於きましては、何を致しましても神樣の御心に依つてことをするといふことになつて居ります。今日でも神樣や佛樣にいろ〱の物を上げますが、昔からものを上げたのであります。それを供饌と申しまして、何でも物が出來ましたならば、それを上げる。かういふやうな精神に富んで居るのであります。詰り神樣に物を差上げて、さうして差上げた物を戴く。そこで所謂神人交通と申しまして、神樣に差上げた物を戴くといふことに依つて、神威に基いて自分の行動を神聖にする。神樣の物を戴いて生活するのでありますから惡い生活は出來ませぬ。或は又その神樣を中心としてその差上げた物を一つの部落なら部落の者が戴きまして、共同一致の精神を進めて行くといふ風が上代にございます。"

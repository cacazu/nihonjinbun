    "text": "します。榮樹は今日は榊と書きますけれども、これは我が國で作つた字であります。さういふ樹に御神靈が御宿りになるのであります。それが社の義であります。社といふのは屋代、卽ち家の代りであります。家の代りに社といふものを建てるのです。それに神樣が御宿りになる。それが神籠といふのであります。大和に官幣大社大神神社といふのがおありでありますが、こゝなぞは神殿はないのであります、神靈は山に御宿りになつて居られます。山が神殿であります。御家は拜むところしか拵へてありませぬ。關東では、筑波山の神社も、之れと同樣と考へられます。山が神殿になる。今筑波山の山の上に奥の院といふ理窟で御家が出來て居りますが、本來は山そのものを拜んだものと申されて居ります。卽ち山そのものが社であります。屋の代りであります。それが卽ち神籬であります。それでありますから神經といふのはいろ〓〓の場合があります。崇神天皇樣が天照大御神樣の御魂の御鏡と御劍とを、大和の笠縫邑に磯城、神籬を立てゝ祭りたまふといふことが書いてありますが、その時の神籬といふのは詰り社殿があつたのであります。その中に鏡と御劍を御納めになつたものと思はれます。そして豊鉏入比賣命をして御仕へせしめられました。それが伊勢の大神宮の起りであります。大神宮の御宮の造り方を御覽になりますと、あれは神明造と申します。大神宮は日本の總氏神であらせられ、皇室の御祖先の偉大なる神樣でありますから、その社殿といふものは大きなーそれこそ大きなものが出來て宜い筈でありますけれども、併しそれがさうでなくて、矢張り御神殿は森嚴で、極く小さいお屋代であります。それが上代の神籬であります。"

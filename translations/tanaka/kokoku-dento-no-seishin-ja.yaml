  "translation_ja": "きたので、きっと人が住んでいると考え、さらに上流へ進まれると、人の泣き声が聞こえる。その声をたどると、年老いた夫婦が、娘を真ん中にして、頭や手をなでながら泣いていました。須佐之男命が「どうしてそんなに泣いているのか」とお尋ねになると、老夫婦の足名椎・手名椎は、「実は娘が八人おりましたが、毎年、八俣大蛇が来て一人ずつ取っていき、とうとう最後のこの娘も、近いうちに来て取られてしまいます。私たちはそれをたいそう悲しんで泣いております」と答えました。須佐之男命は「そうか、それは気の毒だ。では、その娘を私の妃にくれないか」とおっしゃいました。足名椎・手名椎は「場合によっては差し上げてもよいのですが、あなたがどのような方か伺わなければ、お返事できません」といいます。須佐之男命は「なるほど、それはそうだ。私は天照大御神のいろせである」とおっしゃった。「いろせ」の「いろ」は、例えば「いろと」ともいうように用います。「せ」は兄、「と」は弟で、「いろ」を付けると、同じ母から生まれた兄弟という意味になる。血のつながった者には、みな「いろ」を付けます。昔は、すべての男子からすべての女子を「いも（妹）」といい、女子から男子を「せ（兄）」といったのです。ですから、兄弟のうち弟であっても「せ」といいます。須佐之男命は天照大御神の弟ですが、同じ母の兄弟なので「同母兄」とおっしゃった。すると、足名椎・手名椎は非常に驚き、「そのような尊い方でいらっしゃいましたか。たいへん失礼いたしました。娘はただちに差し上げます」といったというのです。このように、出雲の深い山中に住む足名椎・手名椎でも、天照大御神と同母の兄弟だと聞けば、すぐに尊い方だと分かる。新聞も雑誌もない時代に、天照大御神の神聖さは、このように全国の津々浦々に伝わっていたのです。これが、皇室の尊厳の一つの証拠です。"

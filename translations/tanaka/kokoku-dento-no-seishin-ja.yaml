- "id": "kds-p0003-003"
  "section_id": "introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "生きて居る者が皆精神を持つて居りますことは言ふ迄もないことであります。殊に人間は昔から萬物の靈長とも申しまして、總ての生きたものゝ中で最も優れた最も高尙なものでございますので、その精神も亦他のものに比較することの出來ない特性、優れたところの精神を持つて居るのであります。ところがその人間の精神は各々人々の遺傳と申しまして、昔から代々傳つて來た血統といふやうなものに因つていろ〱違つて參るのです。殊に兩親があつて生れて來るのでありますが、その兩親から身體を遺傳致しますと同じやうに、精神を遺傳して來る。身體から見ましても母に似た子供、極く微細な點迄或は母に似、或は父に似る。同に兄弟であつてもその似方に因つて違ひが生じて來る。背が高いのがあるし低いのがある。目などが一番能く分る。目は一皮目、二皮目と瞼に付て言ひますが、それが兩親の一方が一皮目であり一方が二皮目であると、その子供は片一方の目が一皮"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 2
    "url": "https://dl.ndl.go.jp/pid/1092188/1/3"
  "translation_ja": "生きているものがみな精神を持っていることは、言うまでもありません。とりわけ人間は、昔から万物の霊長ともいわれ、すべての生きものの中で最も優れ、最も高尚なものですから、その精神にも、ほかのものとは比較できない特性、優れたところがあるのです。ところが、人間の精神は、それぞれの遺伝、つまり昔から代々伝わってきた血統といったものによって、さまざまに違ってきます。人間は両親があって生まれてくるのですが、その両親から身体を受け継ぐのと同じように、精神も受け継いでくる。身体を見ても、母に似た子どもがいて、ごく細かな点まで、母に似たり父に似たりする。同じ兄弟でも、その似方によって違いが生じます。背の高い者も低い者もいる。目などがいちばんよく分かります。まぶたについて一重、二重といいますが、両親の一方が一重で、もう一方が二重だと、その子どもは片方の目が一重"
  "translation_status": "reviewed"

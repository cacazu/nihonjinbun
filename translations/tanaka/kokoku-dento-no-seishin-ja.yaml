- "id": "kds-p0014-003"
  "section_id": "chapter-kds-p0013-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "尙又海幸、山幸と申す傳があります。これは水產業で生活の根柢を得るのを海の幸と申します。それから山の幸といふのは狩獵で生活の根柢を得るのを言ふのであります。ところがその火遠理命は天孫邇々藝命の御末の御子であります。邇々藝命の跡を御嗣ぎになる御方であります。昔は末子相續と申しまして、必ずしも長子が相續しない。今日では長子相續といふことに決つて居りますけれども、昔は末子で相續する場合が多いのであります。その火遠理命といふのは、末子であらせられて、皇太子に御なりになつたが或時、海佐知毘古にあらせられるその兄御子火照命と、火遠理命の山の幸とを一つ取代へて見ようではないかといふ議が御兄弟の間で起つた。そこで海の幸は鉤山の幸は弓をお取代へになつた。ところがその火遠理命は海の幸でやらうと思召して、兄御子の鉤を御借りになつてやつて御覽になつたのですけれども、どうも餘り御慣れにならぬのでその鉤を魚に御取られになつて終つた。兄御子の方も山の幸に餘り慣れて居らぬから一向狩りが出來ませぬ。そこで今度はお互に元の通りにやらうといふことになつて、兄御子が弓矢を御返しになつた。さうすると火遠理命"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 13
    "url": "https://dl.ndl.go.jp/pid/1092188/1/14"
  "translation_ja": "また、海幸・山幸という伝承があります。水産業で生活の基盤を得ることを海の幸、狩猟によって生活の基盤を得ることを山の幸といいます。火遠理命は、天孫邇々芸命の末の御子で、邇々芸命の跡を継がれる方です。昔は末子相続といって、必ずしも長子が相続しません。今日では長子相続と決まっていますが、昔は末子が相続することが多かったのです。火遠理命は末子で、皇太子になられましたが、あるとき、海佐知毘古である兄の火照命と、火遠理命の山の幸を、一度取り替えてみようという話が、兄弟の間に起こりました。そこで、海の幸の釣り針と、山の幸の弓を交換されました。火遠理命は、兄の釣り針を借りて漁をしてみられましたが、あまり慣れていなかったため、魚に針を取られてしまった。兄も山の幸に慣れていないので、さっぱり狩りができません。そこで互いに元に戻そうということになり、兄が弓矢を返されました。すると火遠理命"
  "translation_status": "reviewed"

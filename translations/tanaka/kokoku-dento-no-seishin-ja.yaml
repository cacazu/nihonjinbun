  "source_text": "第一、敬神崇祖"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 8
    "url": "https://dl.ndl.go.jp/pid/1092188/1/9"
  "translation_ja": "第一　神を敬い、祖先を崇める"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-1092188"
    "original_unit_id": "1092188_0000009:42"
  - "source_id": "ndl-1092188"

- "id": "kds-p0007-001"
  "section_id": "introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "その皮を乾かして火を燃して燒きますと骨に裂目が出來ます、その裂目がかういふ裂目が出來たらかういふ御趣意だ、かういふ裂目が出來たらかういふのだ、といふことがチヤンと傳へてある。「古語拾遺」といふ本に「上古之世。未有文字。貴賤老少。口口相傳。前言往行。存而不忘。」と書いてありますが、どんな言葉でも貴賤老少口々に相傳へて忘れないといふのであります。さういふ譯で、かういふことがあつたからかう、かうあつたからかうといふいろ〱の場合がありますけれども、それは皆チヤンと傳つて居る。それに依つて神樣の御心を判斷する。後になりますと鹿といふものは餘り居りませぬ。奥山に紅葉ふみわけ鳴く鹿の聲きく時ぞ秋はかなしきといふやうな歌があります。今日はどこへ行つても奧山で鹿が鳴きませぬ。居ないのですから鳴きやうがありませぬ。昔はそれが方々に澤山居つた。だから鹿を射つ弓矢を鹿兒弓、鹿兒矢と言つて、餘程大きな武器のやうに傳へられて居ります。兎に角後世になると鹿は少くなりました。そこで支那から龜卜と言ひまして龜の甲で占ひをする法が傳つて來て、神祇官の卜部で使はれるやうになつた。それで神樣の御心を占ふやうになつた。だから神樣の御心を伺つてするのですから國民は實に正直です。今日は惡いことをする人間が往々ありますけれども、昔はさういふ人間はない。昔は泥棒をしたり、詐欺したり、人を誤魔化したりするやうな者はない。何となれば始終神樣がそこらにお出でになつて照鑑あらせられるからであります。さう云ふ具合に敬虔の感情と云ふものが上代國民に潜在的に滿ちて居つたのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 6
    "url": "https://dl.ndl.go.jp/pid/1092188/1/7"
  "translation_ja": "その皮を乾かして火を燃やし、骨を焼くと、裂け目ができます。このような裂け目ができたらこういう御趣旨、別の裂け目ならこういう意味、ということが、きちんと伝えられている。『古語拾遺』には「上古之世。未有文字。貴賤老少。口口相傳。前言往行。存而不忘。」とあります。大昔、まだ文字がなかった時代には、身分の高い者も低い者も、老人も若者も、口から口へ伝え、先人の言葉や行いを保って忘れなかった、ということです。どんな言葉でも、みな口伝えに伝えて忘れなかったのです。こういうことがあったらこう、ああなったらこうと、さまざまな場合がありますが、それはみなきちんと伝わっている。それによって神の御心を判断します。後の時代になると、鹿はあまりいなくなります。「奥山に紅葉ふみわけ鳴く鹿の声きく時ぞ秋はかなしき」――奥山で紅葉を踏み分けて鳴く鹿の声を聞くときこそ、秋の悲しさが感じられる――という歌があります。今日では、どこへ行っても奥山で鹿は鳴きません。いないのですから、鳴きようがない。昔はあちこちにたくさんいました。だから、鹿を射る弓矢を鹿児弓、鹿児矢といって、相当に大きな武器のように伝えています。ともかく、後世には鹿が少なくなりました。そこで、中国から亀卜という、亀の甲で占う方法が伝わり、神祇官の卜部で使われるようになった。それによって神の御心を占うようになったのです。神の御心を伺って行うのですから、国民は実に正直です。今日では悪いことをする人がときどきいますが、昔にはそういう人はいない。泥棒をしたり、詐欺をしたり、人をごまかしたりする者はいない。なぜなら、絶えず神々がそこにおられ、見通しておいでになるからです。このように、上代の国民には、敬虔の感情が潜在的に満ちていたのです。"

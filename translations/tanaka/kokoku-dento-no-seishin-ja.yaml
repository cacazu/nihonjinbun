- "id": "kds-p0014-002"
  "section_id": "chapter-kds-p0013-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それから曩に申しましたやうに、天孫降臨の時に猿田毘古神が天の八衢に御迎へせられたといふのですが、今日なら天孫が降臨遊ばすといふことが、新聞や雜誌に出るのですけれども、その時代にはさういふものは一切ない。然るに天孫が降臨遊ばすといふので、猿田毘古神は伊勢に居られたのでありますが、伊勢からずつと御迎へに出て、九州に御案内せられたといふ。かゝる事實は、又、皇室の尊嚴といふことが、全國に徹底して居ることを示すのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 13
    "url": "https://dl.ndl.go.jp/pid/1092188/1/14"
  "translation_ja": "また、先に述べたように、天孫降臨の際、猿田毘古神が天の八衢でお迎えしたということです。今日なら、天孫が降臨なさることが新聞や雑誌に載りますが、当時はそうしたものは一切ありません。それでも、天孫が降臨なさるというので、猿田毘古神は、お住まいの伊勢から遠くまで迎えに出て、九州へご案内したという。こうした事実も、皇室の尊厳が全国に行き渡っていたことを示します。"

- "id": "kds-p0009-004"
  "section_id": "chapter-kds-p0009-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それがずつと發達して參りましていろ〱の方面になつて參りますが、その最も注意すべきは敬神崇祖であります。それはどういふことであるかと言ひますと、只今申しましたやうに吾々日本國民は潜在的にその傳統の精神を持つて居ります。ところがそれがチョット分りませぬ。今日は日本精神といふものが非常に發展して非常に大なる威力を持つて居るのでありますが、日本精神を知りたいと言つても今日でもチヨツト分りませぬでせう。利根川といふ川、石狩川といふ川が知りたいと思へば、そこ迄行つて見ればあゝこれが利根川か、これが石狩川かと直ぐ分る。富士山が知りたいといふならば富士山に行つて見ればこれが富士山かといふことが直ぐ分る。ところが「ハハアこれが日本精神か」といふことはどこへ行つても分りますまい。けれどもこの日本精神といふものが大切なものであります。吾々はそれを體驗して、それに依つて吾々は行動しなければならない。それをどうして體驗したら宜いか、今日は滿洲事變以來日本精神といふことが頻りと叫ばれて居りますけれども、これは今日に始つたものではありませぬ。勿論太古から皇國傳統の精神といふものが今申しましたやうに潜在的にあるのです。ところが日本國民である以上はそれを體現しなくてはこの世に生存が出來ない。大正十二年の關東大震災の時に東京は御承知の通りあゝいふことになつた。神田の方に私の以前の敎子があります。それは大きな旅館を經營して居るのですが、そこらの家はみな燒けた。その時のことをその敎子が申しますのに、私は日比谷公園の方に避難しましたと言ふ。ところがあの神田の方から日比谷公園の方にずつと何萬人といふ人がみな避難して行くのです。ドウ〱〱と避難して行くのでせう。ところがその中で一人でも僕は日比谷を止めて上野にしようといふ具合で反對に行かうと思つてもそれは行かれませぬ。さうでせう、十萬人、二十萬人の人がドウ〱〱と行くその中で一人だつて僕はこつちへ行かうと言つたつて行かれますか。そんなことをしたら突き飛ばされて"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 8
    "url": "https://dl.ndl.go.jp/pid/1092188/1/9"
  "translation_ja": "それが発達を続け、さまざまな方面に広がっていきますが、最も注意すべきものは敬神崇祖です。どういうことかといえば、先ほど申したように、私たち日本国民は、伝統の精神を潜在的に持っています。しかし、それはちょっと分かりにくい。今日、日本精神はたいへん発展し、大きな威力を持っていますが、日本精神を知りたいといっても、今日でさえ簡単には分からないでしょう。利根川や石狩川を知りたければ、そこへ行けば「ああ、これが利根川か」「これが石狩川か」とすぐ分かる。富士山を知りたければ、行って見れば「これが富士山か」とすぐ分かります。しかし、「なるほど、これが日本精神か」ということは、どこへ行っても分からないでしょう。けれども、この日本精神は大切なものです。私たちはそれを体験し、それに従って行動しなければならない。それをどう体験すればよいか。満洲事変以来、日本精神ということが盛んに叫ばれていますが、今日始まったものではありません。もちろん、太古から皇国伝統の精神が、今述べたように潜在しているのです。そして、日本国民である以上、それを体現しなくては、この世に生きていくことができない。大正十二年の関東大震災では、ご承知のとおり、東京はあのような状態になりました。神田に、私の以前の教え子がいます。大きな旅館を経営しているのですが、その辺の家はみな焼けました。そのときのことを教え子が話すには、「私は日比谷公園の方へ避難しました」という。ところが、神田から日比谷公園へ、何万人もの人がみな避難していくのです。どっと押し寄せていくのでしょう。その中で、たった一人でも「僕は日比谷をやめて上野へ行こう」と、反対に進もうとしても、行けません。そうでしょう。十万人、二十万人が押し寄せていく中で、一人だけ「僕はこっちへ行こう」といっても、行けるでしょうか。そんなことをすれば、突き飛ばされて"
  "translation_status": "reviewed"

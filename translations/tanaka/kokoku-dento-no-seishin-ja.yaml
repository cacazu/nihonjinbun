  "source_text": "第六、和魂漢才"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 17
    "url": "https://dl.ndl.go.jp/pid/1092188/1/18"
  "translation_ja": "第六　和魂漢才"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-1092188"

    "text": "も鉤を返さうとなさるのだけれども今言ふ通り鉤を取らて御終ひになつて返されませぬ。矢張りさういふ時代でもチヤンと鉤を作る製造人なんかは澤山居つたものと見えます、そこで火遠理命は御使ひになる刀を一本毀して鉤を御作らせになつた。さうして「あなたの鉤をなくして濟みませんが、どうかこれで勘辨して戴きたい」といふので五百本の鉤を作つて御返しになつた。ところが「いけない」と仰しやる。それではもつと作りませうといふので一千本作つて、「どうかこれだけ作つたから、これで勘辨して戴きたい」。ところが「いけない、元のを返せ」かう難題を仰しやる。それで困つたことになつたと思はれて、火遠理命が海岸を心配して御歩きになつた。そこへ鹽椎の神といふ神樣がお出でになつた。鹽は海の潮でありますから、鹽椎の神は矢張り海に關した神樣で、何でも能く知つて居られる神樣です。この神樣がそこへ御現れになつて「皇太子樣にはどうしてそんなに御悲みになりますか」「いや實はかうかういふ次第だ」。それならこれから此の船に乘つてお出でになると味御路といふのがあつて、れて船を乗つてくんくお出でになると絶津見の神-經理見の神は語航海を司る神で、今日の歷史家などはそれが福岡縣邊りにあつたのだらうといふことを申しますが、それは太古のことであるから吾々に分りませぬが、兎に角、綿津見の神の宮殿のところにお出でになると、前に井戶があつて、その井戶のところに湯津香木の樹があるから、そのところへお出でになると何とか良い方法がありませう、と鹽椎の神が〓へて吳れた。そこで火遠理命はその方へお出でになつた。さうするとそこへ海神の御むすめ豊玉昆賣の從婢が水をくみに來たので、火還理命が「水を一杯飮まして貰ひたい」と仰しやつた。そこで從婢がその容器に入れて上げたが、火遠理命は水を御飮みにならんで、御頸の飾の玉をその中に御入れになつた。さうすると從婢がその玉を取らうとしてもくつ付いて取れない。そこでそれを持つて歸つて豐玉昆賣に申上げた。するとお姫様がお父さんの縮津見の神に申上げた。お父さんはそれを御覽になつて「オヽこれは皇太子樣だ」かう仰せになつた。それから直ぐ中にお入れになつて非常に款待遊ばした。さうして一人のお姫様の重玉昆賣を妃殿下になさつた。それから三年ばかりそこに御住ひになつた。さうすると火遠理命が一日長大息をなさつた。お姫様がそれをお聞きになつて、お父さんの綿津見の神に仰しやつた。「今迄歎息をなさつたことがないのに今日は御心配があると見えて歎息をなさつたが、如何なものでありませう」と仰しやつたから、お父さんが「皇太子樣は非常に歎息をなさつたといふことですが、何か御心配事がありますか」とお聞きになつた。そこで「魚に鉤を取られて困つて居るのだ」とお話しになつたので、綿津見の神は海の神樣でありますから、魚の全部をお集めになつて「お前達の中に鉤を取つた者はないか」とお聞きになつた所が、諸の魚がこのごろ赤鯛が咽を痛めて居りますが、あれが取つたのでせう」と答へました。「ではそれを連れて來い」といふやうな譯で、それからそれへと探すと鉤が果して出て來ました。それをよく洗ひ〓めて、差上げて、「これです、これを持つてお歸り遊ばせ」といふやうな譯であつた。その時に海神なさつて、その不都合な兄御子を今後の爲に十分にお懲らしになることが必要でありますと、潮の干く玉と、潮の滿つる玉とをお渡しになつた。それを貰つてお歸りになり、その潮の滿つる玉を以て兄御子を溺れさした。そこで兄御子が救助を願つて、「皇室の爲に忠實に働きますからどうか勘辨して戴きたい」かう言はれたから潮の干く玉を以て潮を干さして兄御子をお救ひになつた。そこでその兄御子の御子孫は以後忠實に仕へられることになつたといふ傳說でありますが、それが既に鹽椎の神といふ神様がお現れになると"

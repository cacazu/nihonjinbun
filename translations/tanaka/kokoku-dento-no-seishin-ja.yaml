  "source_text": "なりました。すると「仕へ奉ります」と皆申しました。ところがその中に海鼠が一つ返事をしない。それで天宇受賣命が女性の持つ小さい刀を以て海鼠の口を「この口が答をせぬ口か」とお拆きになつた。それで海鼠の口が今日でも拆けて居るのだ、かういふ傳說であります。宜うございますか、これは曩に申しました通り傳說であります。これに依つて敎訓を施し、これに依つて國民を敎化せられたので、そのお積りでお聞きになり、又御覽にならなければならぬ。上代の人は實際魚がものを言ふといふことを考へた。ところが海鼠の口の拆けたのはさういふ譯だといふ具合に聞いて居る。それが信仰されて居る。さうして見るとそんな禽獸蟲魚に至る迄皇室の爲に忠節を盡すのである。況んや吾々人間に於てをやといふ觀念が、上代の國民に深く、且つ强く印象されて來て居る。それが卽ち我が傳統の精神となつて、苟くも大日本の國に居るところの者は禽獸蟲魚悉く皇室中心で、皇室の爲に盡忠報國をするものであるといふことが分つた。それでありますから、崇神天皇樣の時には曩に申しましたやうに、大和の笠縫邑に天照大御神樣を御祭りし、その次の垂仁天皇樣の時にはこれを伊勢の五十鈴川の上流に御祭りになつて今日の伊勢の大神宮樣の基が出來たのであります。さういふ具合にして段々とその皇國傳統の精神が養成され、皇室中心の思想が徹底して參つたのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 17
    "url": "https://dl.ndl.go.jp/pid/1092188/1/18"
  "translation_ja": "なりました。魚たちはみな「お仕えいたします」と答えましたが、一匹の海鼠だけが返事をしない。そこで天宇受売命は、女性の持つ小刀で、「これが返事をしない口か」と、海鼠の口を裂かれました。そのため、今でも海鼠の口は裂けているという伝説です。よろしいですか、これは先に申し上げたように伝説です。これによって教訓を与え、国民を教化したのですから、そのつもりでお聞きになり、お読みにならなければなりません。上代の人は、実際に魚が物をいうと考え、海鼠の口が裂けているのはそういうわけだと聞き、信じていました。そうすると、鳥、獣、虫、魚に至るまで皇室のために忠節を尽くすのだから、まして私たち人間はなおさらだ、という考えが、上代の国民に深く強く印象づけられます。それが伝統の精神となり、大日本の国に住むものは、鳥獣虫魚もすべて皇室を中心とし、皇室のために忠を尽くし、国に報いるのだと分かるようになった。それで、崇神天皇の時代には、先に述べたように、大和の笠縫邑に天照大御神を祭り、次の垂仁天皇の時代には、伊勢の五十鈴川の上流にお祭りして、今日の伊勢大神宮の基礎ができたのです。このようにして、皇国伝統の精神が次第に育まれ、皇室中心の思想が徹底していきました。"

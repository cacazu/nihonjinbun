- "id": "kds-p0023-001"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "のものになつて終ひます。それだからして象や鯨は永久に象や鯨で暮さなければなりません。その文化を發展せしめ人類より以上になることは出來ないのであります。人間に獲られて旨いと言つて刺身なぞにされて終ひます。それは腦髓が小さいから駄目なのであります。ところが日本人と西洋人と較べて御覽なさい。平均身長など見ましても、日本人の平均身長は大抵五尺三寸といふのであります。西洋人はイギリス人邊りが五尺七寸、アメリカ人は大きくて五尺七寸五分といふのであります。五尺七寸五分と五尺三寸とは非常な違ひであります。東京などに居ますとアメリカの軍艦などが這入りますとその水兵が來ます。私は五尺三寸五分ですが、西洋人はかうして(仰向く)見るやうです。その大きい體ですから日本人より腦髓が少し重くても駄目なのであります。そこで體に比較して見ますと、世界中の人類の中で、日本人の腦髓が平均で一番重いといふことになつて來ます。なんと偉いではありませんか。(笑聲)さうして見ると日本人は實に天然自然に世界優秀の民族として出て來て居る譯なのであります。これは決して架空な議論ではありません。科學的に說明が出來ます。それでありますから吾々が今日五大强國となつたが、日露戰爭當時は世界の八大强國だと言つた。ところがロシヤは滅びて終ひ、その後にオーストリー·ハンガリーもなくなつて終ひ、獨逸が負けましたので五大强國となつた。それが歐州戰亂の時には五大强國と言つたのですが、今度ワシントン條約の時には三大强國、今日では事實上三大强國になつた。初めは八つです。それが段々なくなつて三つ取られて五大强國、それが又二つ程弱いやうなのが取れて三大强國になつた。又今後段々この順序で進みますと、とう〱一大强國になる。處が右のやうに優秀な民族が優秀な傳統の精神を發展して來ると、何時でも日本が殘つて行きまして最後迄殘るでせう。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"

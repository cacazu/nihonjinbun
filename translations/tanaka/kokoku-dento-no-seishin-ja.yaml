  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孟懿子問孝。子曰、無違。樊遲御。子告之曰、孟孫問孝於我。我對曰。無違。樊遲曰、何謂也。子曰。生事之以禮、死葬之以禮、祭之以禮。"
  "source_languages":
  - "ja"
  "source_locations":

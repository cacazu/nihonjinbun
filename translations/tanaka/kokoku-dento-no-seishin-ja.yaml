- "id": "kds-p0011-003"
  "section_id": "chapter-kds-p0009-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "ところがこの皇國傳統の精神、かういふものは日本國民の悉く體現しようといふ精神でありますから、その精神の偉大なる御方は、日本國民が悉くこれを崇敬することになる。日本國民が一人殘らず尊敬するさう云ふ御方はどういふ御方であるかといふと、それは神樣として祭らるゝ御方であります。伊勢に御祭りしてあります天照大御神樣、或は橿原神宮の神武天皇樣、或は八幡宮の應神天皇樣、かういふやうな歷代の天皇樣、或は談山神社に御祭りしてある藤原鎌足公、或は護王神社に御祭りしてある和氣淸麿公、或は天滿宮に御祭りしてある菅原道實公、或は湊川神社に御祭りしてある楠木正成公、かういふ御方は皇國精神の偉大なる體現者であらせられるのであります。吾々國民は悉くそれを崇敬して、その偉大なる大精神を吾々が體現して實踐して行かうといふのであります。日本國民の神樣として祭りますのはさういふ御方であります。さういふ御方を皆神社に御祭りする。その神樣は詰り祖先の神樣で、その祖先の神樣が我國に於いては總てのものゝ主宰神としてお祭りしてあるのであります。山があれば山に山の神樣、或は川があれば川に川の神樣、總てのものにさういふ神靈がお出でになる。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 10
    "url": "https://dl.ndl.go.jp/pid/1092188/1/11"
  "translation_ja": "しかし、皇国伝統の精神は、日本国民すべてが体現しようとする精神ですから、その精神の偉大な方を、日本国民はみな崇敬することになります。日本国民が一人残らず尊敬するのは、どのような方か。それは、神として祭られる方です。伊勢の天照大御神、橿原神宮の神武天皇、八幡宮の応神天皇といった歴代の天皇、あるいは談山神社の藤原鎌足公、護王神社の和気清麿公、天満宮の菅原道真公、湊川神社の楠木正成公。こうした方々は、皇国精神の偉大な体現者であらせられます。私たち国民はみな、その方々を崇敬し、偉大な精神を自ら体現し、実践していこうというのです。日本国民が神として祭るのは、そのような方々です。その方々を神社に祭る。その神々は、つまり祖先の神であり、わが国では、すべての物をつかさどる神として祭られています。山には山の神、川には川の神と、すべての物にそのような神霊がおられるのです。"

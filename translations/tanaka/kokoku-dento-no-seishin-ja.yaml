  "kind": "paragraph"
  "origin": "source"
  "source_text": "孝行といふことは大事であるが、その孝行といふのはどういふのであるかと子游が聞きましたら、今の孝は能くお父さんやお母さんを養つて上げるのを孝と謂ふが、犬馬に至る迄能く養ふのである。尊敬しなければ人間の孝行にならぬではないか。"

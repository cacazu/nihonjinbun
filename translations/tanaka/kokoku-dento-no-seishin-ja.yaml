  "source_text": "それには先づ皇室、卽ち天照大御神樣に依つて肇められましたところの皇室の尊嚴、これは天照大御神樣が第一に國民から非常に神聖に認識せられておいでになつたといふことであります。例へば先刻もお話した須佐之男命が出雲の國にお出でになりました。出雲の國の肥の河の方を段々と上つてお出でになると、上から箸が流れて"

  "section_id": "chapter-kds-p0013-002"
  "kind": "heading"
  "origin": "source"
  "source_text": "第二、皇室の尊嚴"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 12
    "url": "https://dl.ndl.go.jp/pid/1092188/1/13"
  "translation_ja": "第二　皇室の尊厳"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-1092188"
    "original_unit_id": "1092188_0000013:18"
  - "source_id": "ndl-1092188"
    "original_unit_id": "1092188_0000013:19"
- "id": "kds-p0013-003"
  "section_id": "chapter-kds-p0013-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "これから皇室の尊嚴といふことに就て申上げます。教育が明治時代に西洋から日本に傳つて來ました時に、ヘルバルトの教育學といふものが廣く行はれました。そのヘルバルトの教育學の中に開化史的段階、或は文化史的段階、かういふものがあることは教育學をおやりになつた方は御承知のことゝ思ひます。この開化史的段階といふのはどういふのであるかと申しますと、敎授の材料を配列しますのに、人間の一人の發達といふものは、種族の發達と並行するものであるといふ原則から成り立つて居る。卽ち一個人に就いて見ても、赤ん坊などは鼻などはペチヤンコのやうになつて居りまして、唯々眼と口とが付いて居るやうに見えますが、それが段々と成長するに從つて目許もパツチリして來ます。鼻も高くなつて來ます、眉毛も濃くなつて來ます。それで立派な顏が出來て來る。さういふ具合に一般に古代人は顏形が整つて居らぬ。文明人になる程非常に美しくなる。精神も亦小さい子供の時には猿蟹合戰とか、桃太郞の鬼ケ島征伐ー犬が團子一つ下さい、お供しませうと言つた。かういふ風な話を話すと子供に非常によく分る。それで西洋ではメルヘン(童話)と言ひまして、さういふやうなもので教育して行かうといふのであります。それから段々と發達して來るに從つて、高尙なる材料に進み、遂には哲學などの話をしても理解されて來る。それを幼稚園などに居る四つや五つの子供に對して、宇宙がどうだ、世界の本體がどうだ、アインシユタインの相對性原理がどうだと言つても、譯は分りませぬ。何のことだかチンプンカンです。それに反して桃太郞が鬼ケ島を征伐に行かうとした。ところが犬が團子一つ下さればお供しやうと言つた、といふやうなことを話しますと、直ぐ耳を澄まして聞きます。さういふ具合に個人の發達といふものが種族の發達といふものと並行するものだと言ふ。此の原理を應用したのが、開化史的段階といふのであります。さう云ふ次第で上代に於きましては、猿がものを言つたり、兎がものを言つたりする話が興味を以て愉快に感ぜられるのです。そこで我國に於ても上代には、先刻申したところの偉い神樣が人民を敎化せられるのに、矢張りさういふ物語を以てせられたのであります。それでありますから、『古事記』や『日本書紀』の上代に書いてありますのはさういふ物語が色々入れてありまして、その中には偉大なる日本精神、偉大なる皇道の精神が養成されて來て居るのであります。それを先づ前提にして、皇室の尊嚴といふ傳統の精神が上代に旣に早く培はれて來たといふことを申上げたいのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 12
    "url": "https://dl.ndl.go.jp/pid/1092188/1/13"
  "translation_ja": "これから、皇室の尊厳について申し上げます。明治時代、西洋から日本に教育が伝わったとき、ヘルバルトの教育学が広く行われました。その教育学に、開化史的段階、あるいは文化史的段階というものがあることは、教育学を学んだ方ならご存じでしょう。これは教材を配列する際、一人の人間の発達は種族の発達と並行するという原則に立つものです。例えば、一個人を見ても、赤ん坊は鼻などがぺちゃんこで、目と口だけが付いているように見えます。それが成長につれて、目元もぱっちりし、鼻も高くなり、眉毛も濃くなって、立派な顔ができてくる。それと同じように、一般に古代人は顔形が整っておらず、文明人になるほど非常に美しくなる。精神も同様で、小さな子どもには、猿蟹合戦や、桃太郎の鬼ヶ島征伐、犬が「団子を一つください。お供しましょう」といった、という話をすると、とてもよく分かります。そこで、西洋ではメルヘン、つまり童話といって、そのようなもので教育しようとするのです。そして、発達につれて高尚な教材へ進み、ついには哲学などを話しても理解されるようになる。それを、幼稚園の四、五歳の子どもに、宇宙とは何か、世界の本体は何か、アインシュタインの相対性原理はどうかなどといっても、意味が分からない。何のことやら、ちんぷんかんぷんです。反対に、桃太郎が鬼ヶ島へ征伐に行こうとしたところ、犬が「団子を一つくだされば、お供しましょう」といった、などと話すと、すぐ耳を澄まして聞きます。このように、個人の発達は種族の発達と並行するという。この原理を応用したものが、開化史的段階です。そのため、上代には猿や兎が物をいう話が、興味深く、愉快に感じられるのです。わが国の上代でも、先ほど述べた偉大な神々が人民を教え導くため、やはりそのような物語を用いられました。ですから、『古事記』や『日本書紀』の上代の記事には、そうした物語がいろいろ取り入れられ、その中で、偉大な日本精神、偉大な皇道の精神が育まれてきたのです。まずこれを前提として、皇室の尊厳という伝統の精神が、上代からすでに培われていたことを申し上げたいと思います。"

- "id": "kds-p0020-010"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "これは『中庸』第十九章に載つて居りますが、これが孝行の根本なのです。「人」といふのは親であります。或は祖先であります。親の志を繼ぎ、親の事業、精神を承け繼いで行く。「述ぶる」といふことはそれを承け繼いで行くことであります。孝行といふものゝ根本はこゝにある。「色難し」とか「犬馬に至る迄養ふこと有り」といふのは、孔夫子がこの人は禮儀がないからかう言つてやらう、この人は短氣であるから、この人は忠臣であ"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 19
    "url": "https://dl.ndl.go.jp/pid/1092188/1/20"
  "translation_ja": "これは『中庸』第十九章にある言葉で、孝行の根本です。「人」とは親、あるいは祖先です。親の志を継ぎ、その事業や精神を受け継いでいく。「述べる」とは、受け継ぐことです。孝行の根本はここにあります。「顔色を和らげるのが難しい」「犬や馬に至るまで養いがある」というのは、孔子が、この人は礼儀を知らないからこういおう、この人は短気だから、この人は忠臣であ"

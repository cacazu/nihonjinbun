  "translation_ja": "いるのです。私たち一個人の精神が生きているように、皇国の精神そのものも生きています。「人生五十年」といいますが、私たち個人の場合は五十年か八十年、長くてもたいてい百年ほどで、その身はなくなってしまいます。しかし、皇国の精神は、不朽の生命、天地とともに尽きることのない生命を持っています。そして、永遠に発展し続けています。では、その皇国の精神はどのようなものなのでしょうか。こう考えてみると、ごく太古には、まだはっきりしていません。どのようなものかを明確に断言することはできません。そこで、それを潜在精神と名づけます。潜在精神、あるいは潜在意識とよくいいます。近ごろ、学問の分野では潜在意識とよくいいますが、意識とは精神の活動状態をいい、その言葉には、つねに活動しているという意味があります。ドイツのヘッケルという人は、生まれたばかりの赤ん坊には意識がないといっています。そういわれれば、そうも見えます。赤ん坊は無意識に活動している。これは赤ん坊に限らず、私たちのような大人でも、無意識に活動することはたびたびあります。つまり、夢中でするのです。「うっかりした」ということがよくありますが、あれは無意識、無自覚にすることです。意識というからには、自分のしていることを自分で知っていなければならない。それを意識的活動といいます。ですから、意識という言葉は、少し範囲が狭いのです。私はここで「精神」という言葉を使いました。精神なら、どんなときにもある。眠っているときには、意識はないことになります。昔、後漢に光武皇帝という皇帝がいました。中国では、皇帝といっても、昔は書生だったり、何か別のことをしていた人が皇帝になったりするのですが、光武皇帝の書生時代の友人に、厳という男がいました。ところが、光武皇帝は時機に乗じて皇帝になりました。そこで、昔の友人の厳も引き立てて、偉い役人にしようといったのです。しかし厳は風変わりな人物で、役人になって堅苦しくやっているのは嫌だ、やはり官職のない身がよいといって、どうしても役人にならない。それなら、お前の自由にさせておくということになりました。ある日、厳が光武皇帝を訪ねてきました。臣下たちを遠ざけ、いろいろな話をしました。夜になり、皇帝が「今晩は泊まっていけ」というと、厳は「うん、泊まろう」と答える。皇帝という立場の覆いをすっかり取り去り、昔の友人のままになって、皇帝が「一緒に寝よう」といい、厳が「お前のところに寝よう」というので、皇帝のそばに寝たのです。ところが厳は寝相が悪く、大の字になって、大きな足を皇帝のおなかの上に載せていました。皇帝も疲れていたので、気づいていません。すると、天文学者が一心に天文を研究していると、皇帝の星に何かが迫って害を与えている。これは大変だと、急いで宮中に出仕して報告しました。宮中の役人が驚いて、皇帝の寝所に行ってみると、厳が大きな足を載せている。〔笑い〕これだなと思い、目を覚まさせないように足を取り、脇へ引き寄せて寝かせておいた。それで天文の異常がなくなった、という話があります。そんなことが本当にあったかどうかは分かりませんが、そういうわけで、眠っているときに皇帝の上に足を載せても、それは無意識の行為です。ですから、法律上の罪にはならない。すべて、このように無意識でしたことは、法律上も道徳上も罪とは認めない。知らずにしたことだからです。私たちの精神は、眠っていても、いつでもあります。ですから、ここはやはり潜在精神という意味に捉えるのがよい。そう考えて、私は潜在精神としたのです。"

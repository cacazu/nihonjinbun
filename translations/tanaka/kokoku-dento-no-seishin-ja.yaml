- "id": "kds-p0020-008"
  "section_id": "chapter-kds-p0018-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "孟懿子といふのが孝行のことを聞いたら、孔子の言ふのには違ふことなかれ、孟懿子といふのは直ぐそれで下つて終つたところが孔夫子はもつと說明してやらうと思ひましたけれども、下つて終つたから仕方がない。外へお出でになると、樊遲といふ門人が馭者になつて孔子を乘せて行つた。そこで孔子が車の中から、樊遲に向つて仰しやるには、孟懿子が私に孝行といふことを聞いた。そこで私が「違ふことなかれ」と答へてやつた。ところが樊遲といふのは學問が進んで居りましたから、「それは何の謂ぞや」と聞き返へしたのであります、孔夫子はそこだと云はぬばかりに、「孝行には禮といふものが大切だ」と言はれた。こゝに書いてありますやうに、敬するといふこと、色難しといふこと、或は禮を以て接するといふこと、さういふやうなことをいろ〱孔子が言はれて居りますが、併し今申したやうなことは孝行の枝葉末節でありまして、その根本はどういふところにあるか、かういふことになりますと、どうしても孝行の根本は親の志を繼ぐといふところにある、親の志に反きましたならばどんなに親に御馳走をしても、どんなに親に禮儀を以て接しても、どんなに親を尊敬してもこれは孝となりませぬ。難波大助のやうなのが、どんなに親に御馳走しても、それは孝行になりませぬ。親は有難いと思ひませぬ。親の志を繼ぐといふことが孝行の大切なところであります。我が傳統の精神では、孝行の極致は此の點にあるのであります。それが又儒敎に於てチヤンと示してあります、我國の皇道に於ける孝行の大切なことが儒敎に於て示してあります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 19
    "url": "https://dl.ndl.go.jp/pid/1092188/1/20"
  "translation_ja": "孟懿子が孝行について尋ねると、孔子は「違えるな」と答えました。孟懿子はそれだけ聞いて退出してしまった。孔子はもっと説明しようと思いましたが、帰ってしまったので仕方がありません。外出の際、門人の樊遅が御者となり、孔子を車に乗せていきました。そこで孔子は車の中から樊遅に、「孟懿子が私に孝行を尋ねたので、『違えるな』と答えてやった」といいました。樊遅は学問が進んでいたので、「それはどういう意味ですか」と問い返しました。孔子は、まさにそこだといわんばかりに、「孝行では礼が大切だ」と答えられました。ここに書かれているように、敬うこと、顔色を和らげること、礼をもって接することなど、孔子はいろいろ説いています。しかし、今述べたことは、孝行の枝葉末節です。その根本はどこにあるかというと、やはり親の志を継ぐことにあります。親の志に背くなら、どんなにごちそうをし、礼儀正しく接し、尊敬しても、孝にはなりません。難波大助のような者が、どれほど親にごちそうをしても、孝行にはならず、親はありがたいと思いません。親の志を継ぐことが、孝行の大切なところです。わが伝統の精神では、孝行の極致はこの点にあります。それは儒教にも、きちんと示されています。わが国の皇道における孝行の重要な点が、儒教に示されているのです。"
  "translation_status": "reviewed"

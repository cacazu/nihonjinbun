    "text": "王道といふのはいろ〱の說明がありますけれども、この言葉が一番良く明かに說明せられて居ります。「王道蕩々」といふのは、極く廣く廣々として居りまして極く簡易といふ意味であります。「無偏無黨」といふのは一方に偏しない、黨を立てない、それを一言に言へば私がない。私がないのはどういふことであるかといふと、公であります。公のハの字は背くといふ字で、下のムの字は私といふ字、私に背くといふのが公であります。私に沒頭するのは利己主義、個人主義であつて公ではない。それで「一旦緩急アレハ義勇公ニ奉シ、天壤無窮ノ皇運ヲ扶翼スヘシ」と仰せられてあります。その公といふのと右の意味が同じであります。「王道平々」といふのは王道といふのは困難ではない、容易しいものだといふのであります。我國の皇道が亦それであります。容易しいのであります。日本國民は何人でもこれを行ふことが出來ます。むづかしい試驗などを受けねばならぬと云ふことはないのです。そこらの無敎育のおばさんでもチヤンと實行出來る。王道平々です。「無㆑反無㆑側」といふのは偏しないことで、矢張り「無㆑黨無㆑偏」と同じであります。中正を執つて行く。「王道正直會其有極歸其有極」正直は正しくして直で、眞直ぐで曲らない。一體我國の皇道又は神道といふものは正直を尊重する。儒敎は仁佛敎は慈悲、キリスト敎は愛、かういふやうな區別をして見ると、神道では正直を尊重する。鏡といふものを尊重する。神社の大前には一般に鏡が置いてある。鏡といふものは正直の象徵なのである。三種の神器の第一に鏡が擧げてありますが、鏡といふものは所謂偏なく黨なく私がない。非常に美しいものが行くと、これは長く寫して置かうといふことはない。美しいものが來ても嫌やなものが來てもチヤンとそれを正直に寫す。嫌やなものだから半分程寫してやらうといふやうなことはない。さういふ具合に神道は正直を尊重する。王道もそれであります。「正道正直會其有極歸其有極」-「有」といふのは添へた言葉でありまして、極といふのはどういふのであるか、極といふのは極端と言ひまして、電氣なら電氣は積極と消極と言ひませう。これ極端です。極端ですけれども、吾々はこの極端の中に更に中極といふものを認めることが出來る。電氣なら積極でも消極でもないところであります。神道では中極といふことを度會延佳といふ人が言つて居りますが、王道は矢張りそれです。これを中道とも言ひます。佛敎では中道實相といふことを言ひますが、その中道は少し意味が違ひますけれども、先づ大體さういふ風であります。王道はそこであります。その中道、それを有極に會し、有極に歸すと云ふのであります。王道と云ふのはかう云ふ風で、我國の傳統の精神と一致して居ります。曩に申しました禪讓放伐の如きは我國には斷じて容れられませぬけれども、それは儒敎の根本義ではないのであります。されば儒敎の理想、儒敎の根本義は皇國傳統の精神を示すのに適切であるのであります。そこで儒敎が盛んに入れられて來たのであります。"
    "source_locations":

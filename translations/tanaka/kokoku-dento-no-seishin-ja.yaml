    "text": "ゝあるのであります。吾々一個人の精神が生きて居ります通りに皇國の精神そのものが生きて居るのであります。人生五十年と言ひますが、吾々一個人のは五十年か八十年か、長くても大抵百年位、それ位で吾々の一身は失くなつて終ひますが、皇國の精神となりますと不朽の生命、天壤無窮の生命を持つて居ります。天壤無窮の生命を持つて天壤無窮に發展しつゝあります。ところがその皇國の精神といふものがどういふ風なものであらうか、かう考へますと、極く太古にはそれが未だハツキリして居らぬ。どういふものだといふことを明確に斷言することは出來ませぬ。それでありますから、それを潜在精神と名付ける。潜在精神或は潜在意識とよく申します。この頃はよく學問の方で潜在意識と言ひますが、この意識といふには精神の活動狀態と申しまして、意識といふ言葉の中には常に活動して居るといふ意味があるのです。ドイツのヘツケルといふ人は、生れたての赤ん坊は意識がないといふことを言つて居ります。まあさう言はれて見るとさうも見られる。赤ん坊は無意識に活動して居る。これは赤ん坊ばかりではない、吾々のやうに大きくなつた者でも無意識に活動することは度々あります。詰り夢中でするのです。「ウツカリした」といふやうなことがよくありますが、あれは無意識ですることです。無自覺です。意識といふことは自分ですることを自分で知つて居なければならない。それが意識的活動といふのです。でありますから意識といふ言葉は少し範圍が狹いのです。私はこゝに精神といふ字を使つた。精神と言へばどんな時でもある。眠つて居る時には意識はないことになる。昔、後漢の光武皇帝といふ皇帝がありましたが、支那では皇帝と言つても昔は書生だつたり、何かする者が皇帝になるのですから、その光武皇帝の書生時代のお友達に嚴といふ男が居つた。ところが光武皇帝が一朝風雲に乘じて皇帝になりました。そこで昔の友達の嚴といふのも引上げて偉い役人にしようと言つたのですが、その嚴といふのは一風變つた人間で、役人になつて鹿爪らしくやつて居るのは嫌だ、矢張り無冠の大夫が宜いといふのでどうしてもならぬ。それならばお前の自由にさして置くといふことであつた。一日嚴が光武皇帝を訪問に來ました。いろ〓〓と臣下のものどもを遠ざけて話をした。夜になつて「今晩泊つて行け」「ウン泊らう」といふ風で、まるで皇帝だけれどもヴエールを剝して終つて、昔のお友達の通りにやつて、「一〓に寢よう」···「お前のところに寢よう」といふので皇帝の傍へ寢たです。ところが嚴といふ男は寢相が惡いものですから、大の字になつて大きな足を皇帝のお腹の上に載せて居る。皇帝も疲れて居るのでそれを覺えて居ない。ところが天文學者が一生懸命天文を〓究して居ると、皇帝の星に何か迫害を與へて居る。これは大變だといふので、急いで宮中に出仕してそのことを申上げた。さうすると宮中の役人が驚いて皇帝のお休みになつて居るところへ行つて見ると嚴が大きな足を載せて居る。(笑聲)これだなといふので眼を醒さないやうに足を取つて脇の方へ引張つて寢かして置いた。それで天文の方の異常が取れたといふ話があります。そんなことが本當にあつたかどうですか分りませぬけれども、まあさういふ譯で、寢て居る時に皇帝の上に足をやつてもこれは無意識であります。だからして法律上の罪にならぬ。總てかう云ふ具合に無意識でしたことは、法律上からも道德上からもこれを罪と認めない。知らないでしたことであります。吾々の精神といふものは眠つて居りましても何時でもある。それでこれはどうしても潜在精神といふ意味に取つた方が宜しい。かう考へまして私は潜在精神としたのであります。"

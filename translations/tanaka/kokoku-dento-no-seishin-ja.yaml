    "url": "https://dl.ndl.go.jp/pid/1092188/1/16"
  "translation_ja": "すぐに皇太子だとお分かりになる。また、綿津見の神のところに行くと、やはり尊い皇太子だとすぐに分かる。このように、上代にはいたるところで、皇室の尊厳がどれほど徹底していたかが分かるのです。"

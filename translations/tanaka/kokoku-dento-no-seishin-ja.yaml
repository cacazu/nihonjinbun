  "translation_ja": "第二は、秩序の観念です。秩序の観念とは、物事をきちんとする考えです。これは、日本国民にはもともと非常に強い。毎日仕事をして、仕事が終わると風呂に入るでしょう。風呂に入ることは、日本国民の一つの特色です。このことは上代からあります。昔、伊邪那岐命が、黄泉の国の穢れを、筑紫の小門の阿波岐原で禊ぎ清められたと伝えられています。これは上代にそうした習慣があったことを示しています。上代の人々は、先に述べたように正直でしたから、身体をきれいにすると同時に、精神もきれいにしました。それで、わが国では温泉が古代から非常に発達しています。私は昨年、伊予の道後温泉に入ってきましたが、伝えられるところでは、道後温泉は少名毘古那神がお始めになったそうです。少名毘古那神は、出雲大社に祭られている大国主神と兄弟になられ、この大八洲を治められた方です。もちろん神代のことですが、そのころすでに伊予の道後温泉をお開きになったというのです。このように、わが国で温泉が非常に遠い昔から発達していたことは、さまざまな事実から認められます。以前、私が但馬の方へ行ったとき、三朝温泉はラジウムもかなり出るという話でした。その近くの講習会へ行ったので、その温泉に一度入っておきたいと申しまして、連れていってもらいました。そこには相当数の温泉宿がありましたが、川があって、その川の中から温泉が湧いている。近所の人たちは、みな川の中で温泉に入っています。屋根も何もありません。それを見て、太古の風習が残っているなと思いました。熱海などは、海の中に湯が出るところがある。それで熱海という名になったそうですが、そうした所では、やはり大昔からの風習として、海岸に行って砂で風呂を作り、入る。これはとても簡単です。誰にでも、子どもにでもできる。そのように入浴して身体"

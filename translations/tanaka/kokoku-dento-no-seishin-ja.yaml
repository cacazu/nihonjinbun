    "text": "道德上如何なる事が善で、如何なる事が惡か、卽ち善惡の標準は何れにあるかと云ふことは、大問題であります。卽ち世の中の善惡といふものを何に依つて定めますか、どういふことが一體善い行であるか、どういふことが惡い行ひであるかといふことは、何を標準にして言ひますか。西洋などに於きましては倫理學といふものを〓究致しまして、人生の理想といふものを立てゝ、その理想に叶ふのが善であつて、理想に叶はないのが惡である。或は良心といふものを立て、良心の是認するものが善であつて、良心の否認するものが惡である、といふ具合に言ヘルバルトなどは直覺的判斷といふものを立てゝ、直覺的判斷の是認するものが善であつて、それが是認しないものが惡であるといふことを言ひました。かう云ふ風に善惡の標準といふことはいろ〓〓に立てられて居ります。併し我國に於ては善惡の標準はどこにあるか、どういふ行ひが善でどういふ行ひが惡であるか、かう言ひますとそれは直ぐ分ります。我國に於きましては前に申しました皇室の尊嚴、皇室中心といふことに依つて確立せられて居ります。卽ち之れに因つて、我國の道德は立てられて居るのでありますから、この皇室中心の思想、これに反するものは惡である。それに合致するものは善である。昔に於きましても、須佐之男命といふ神樣は天照大御神樣の御弟であらせられるのでありますけれども、高天ケ原に於て罪惡を犯せられますと、さういふ尊い御方でも皇室に對して、天照大御神様に對して失禮なことがありますと、大勢の神が須佐之男命に千位置戶と申しまして、今日で申しますと澤山の罸金であります。それから髪を拔き手足の爪を拔いたとありますが、實際髪を御拔きになつたのか爪を御拔きになつたのか傳說ですから分りませぬが、須佐之男命の口毛などが木になつたといふことが書いてありますから、或は須彼之男命の山林などの桶末をみな淺收されたのかも知れませ兎に角さういふ具合にしてその罪を曠はしめるといふことがあります。それから又天若日子といふのが高天ケ原から大国主命に對してこの國を天孫に獻げよといふ使ひに降りました。ところが天若日子は大國主命のお姫さんを奧さんに貰つて大國主命の養子になり、さうして自分が葦原中つ國を支配しようと考へたが、さういふことが高天原に聞えますと、直ちに高天原からの神兵に誅せられて終ひました。所謂朝敵といふものが如何に恐るべきものであるかといふことが既に上代に於てかゝる事實で示されて居ります。或は又已に述べました發田毘古神といふのが天孫を御導きして九州にお出でになつて、今度は御自分の伊勢に御歸りになる時に、天宇受賣命といふのがお供をして伊勢の方にお出でになつた。天宇受賣命は御用が濟んで、志摩の方にお出でになつた。志摩と申しますと、今日は志摩の國と申しますが、昔は伊勢の一部でありました。その志摩といふところへお出でになつた天宇受賣命が、澤山の魚をお集めになつて、その魚に「汝たちは天つ神の御子に仕へ奉らんや否や」とお聞きに"

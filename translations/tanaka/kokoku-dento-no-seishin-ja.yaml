- "id": "kds-p0003-002"
  "section_id": "introduction"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "この度この講習會に私にもお伺ひして何かお話を申上げるやうにといふ御依賴に基きまして本日お伺ひ致しました。題は只今御紹介下さいました通り「皇國傳統の精神」といふ題に依つて今日午前中御清聽をお願ひしたいと考へて居る次第であります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-1092188"
    "precision": "page"
    "source_sequence": 2
    "url": "https://dl.ndl.go.jp/pid/1092188/1/3"
  "translation_ja": "このたび、この講習会に私も出向いて何かお話しするようにとのご依頼をいただき、本日伺いました。題は、ただいまご紹介いただいたとおり「皇国伝統の精神」です。この題で、今日の午前中、お聞きいただきたいと考えております。"

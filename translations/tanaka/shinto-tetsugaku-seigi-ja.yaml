  "source_text": "そこで古傳をさう解釋して見ると、それより以前の天御中主神や高皇產靈神、神皇產靈神を、どう云ふ風に解釋し奉れば、最も合理的であるかと云ふ事が問題になつて來るのである、其の當時に伊弉諾尊、伊弉冊尊、天照大神其の以下の神々がどう云ふ風に考へて御居でになつたかと云ふことを、今日に於いて攻究して見なければならぬ。"

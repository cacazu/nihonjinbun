  "translation_ja": "まず第一は、政治の系統である。神道における政治は、祭事である。政治の重要な事柄が、神々を祭ることにあったため、「祭」と「政」が同じ意味になったのだと思われる。本居宣長は、「まつりごと」の語源を「奉仕事」だと解釈している。百官有司が天皇の命を受け、それぞれの職に仕えることが天下の政治なのだから、奉仕事と呼んだのであり、「まつる」は服従という意味だとする。要するに、神道の政治は祭政一致であり、その根本は敬虔にある。敬虔とは、神を敬い祭る思いを持つ、私たちの心の態度である。古伝を見ると、前にも少し述べたとおり、天照大神が神鏡を天忍穂耳尊に授けるとき、「寝所を同じくし、御殿をともにして、この鏡を見ることを、私を見るのと同じようにしなさい」と神勅を下した。また高皇産霊神は、神籬と磐境を設けて神を祭るよう、天児屋根命と太玉命に仰せになった。神籬は今の神祠、磐境は今の神社の境内という意味である。これは、神を敬い祭ることを第一とすべきだと示したものと思われる。そのほか、神武天皇の東征のとき、弟猾は、「天つ社、国つ社の神を祭り、その後で敵を撃てば、除くことも容易でしょう」と申し上げた。東征が終わり、天下平定の事業が成ると、神武天皇は皇祖の詔に従って神籬を立て、神を祭り、続いて四年には、鳥見山の中に祭場を設け、皇祖天神を祭ったという。また物部尾輿らは、当時の天皇に、「わが国家が天下に君臨するのは、常に天地社稷と百八十の神を、春夏秋冬に祭ることを務めとしているからである」と申し上げた。さらに推古天皇は、「わが皇祖たる天皇たちが世を治められたときには、天を畏れ、地を敬い、厚く神々を祭り、広く山川を祭って、目に見えないところで天地に通じていた。それゆえ陰陽は開けて和らぎ、万物を生む働きも、ともに整った。今、私の世に、神々を祭ることを怠ってよいはずがあろうか。だから、群臣は心を尽くし、神々を拝むべきである」と命じられた。また孝徳天皇のときには、蘇我石川麻呂が、「まず神々を祭り鎮め、その後に政治を議論すべきである」と申し上げた。そのほか、祈年祭の祝詞などには、「神漏岐命・神漏美命をもって、天つ社・国つ社に、たたえの言葉を奉る」というような言葉がある。後世にも、順徳天皇の『禁秘鈔』では、「宮中の作法は、すべて神事を先に、ほかのことを後にする」とされ、『貞永式目』には、「神社を修理し、祭祀を専らにすべきこと」が定められている。こうした、ほとんど数え尽くせないほど多くの事実から、わが国の政治の根本として、上位に立つ者も下にいる者も、誰もが、神を敬い祭ることをおろそかにせず、重大なものとして考えなければならないと分かる。つまり、どこまでも、敬虔な態度を政治の根本としなければならないのである。"

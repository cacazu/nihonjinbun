  "source_text": "元來此の高皇產靈神、神皇產靈神と云ふ神に就いては神道の學者が非常に其の解釋に困つて居る、昔から困つて居る。何故困るかと云ふと、高皇產靈神、神皇產靈神は、已に揭げたやうに、『古事記』の一番初めに「天地初發の時、高天原に成りませる神の名は天之御中主神、次に高御產巢日神、次に神產巢日神」と云ふ風に書いてある。さうして後幾多の神々を經て、伊弉諾尊、伊弉册尊に至り、其の御子に天照大神がましまして、其の天照大神が高天原に在して此の豐葦原中津國の經營に從事し遊ばした際に、高皇產靈神と云ふ神が居られて御働きになつて居る。其の當時の此の神の御活動を見ると、實に勳威赫々たるものであつて、其の傳にも「天照大御神高皇產靈神の命もちて」と云ふ風に傳へてある。又或る所では「高皇產靈神天照大御神の命もちて」と云ふ工合に傳へてある。詰り天照大神と殆んど肩を竝べらるゝ位に御威勢の强かつた神である。で當時八百萬神を天安河原に集めて會議をなされ、衆議に依つて重大事件を議決されて居る。其の時の狀態を見ると、此の高皇產靈神は恰も今日の議長のやうな事を爲されて、色々の事を執り行はれて居る。而して古傳に依れば瓊々杵尊の外戚にましますのである。丁度後世藤原道長或は平清盛などが外戚に居つて、さうして政治の大權に參與して居た樣な工合に、高皇產霊神は其の當時の政治に非常なる勢力を有して御居でになつたのである。それは古傳にありありと分つて居る、而して其の當時の高皇產靈神は又の名高木神と云ふ事に傳はつて居る。そこで本居宣長、平田篤胤二翁の如きが、高皇產靈神が此の天地を鎔造せられたと云ふ事を說くに方つて、その說を聽く者共は、どうも神代の極く初めの時の高皇產靈神が、それから伊弉諾尊、伊弉册尊まで幾多の神々を經て、天照大神の御代にかくも御活動せらるゝのは、甚だ以つて妙ではないかと云ふやうな、質問を出すやうなものもあつたのである。すると、宣長、篤胤二翁は是れは神代の事であるから、さう云ふことは少しも不思議ではない。斯う云ふ事を疑問とするのは、詰り支那流で、漢意漢習に依つて疑ふのであると言ふのである。斯う云ふやうに世間の疑問とするものを皆抑へつけて、さうして高皇產靈神、神皇產靈神が天地を鎔造されたのであると云ふ風に說かれるのである。"

    "text": "朕國家の隆昌と臣民の慶福とを以て中心の欣榮とし、朕か祖宗に承〓るの大權に依り、現在及將來の臣民に對し、此の不磨の大典を宣布す。惟ふに我が祖我が宗は我が臣民祖先の協力輔翼に倚り、我が帝國を肇造し以て無窮に垂れたり。此れ我が神聖なる祖宗の威德と、竝に臣民の忠實勇武にして、國を愛し、公に殉ひ以て此の光輝ある國史の成跡を貽したるなり。朕我か臣民は、即ち祖宗の忠良なる臣民の子孫なるを回想し、其の朕か意を奉體し、朕か事を奬順し、相與に和衷協同し、益、我か帝國の光榮を中外に宣揚し、祖宗の遺業を永久に鞏固ならしむるの希望を同くし、此の負擔を分つに堪ふることを疑はさるなり。"

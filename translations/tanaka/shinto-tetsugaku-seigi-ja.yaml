- "id": "st-0132-002"
  "section_id": "chapter-12-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "即ち他の佛教や基督教は、先づ宗教として價値を有するのであるけれど、神道は、天地の公道である。それが國家の大道としては、政道として、道德として、而して宗教として價値を有するのである。つまり、人世百般の行爲の大道として價値を有するのである。此の點が佛教や基督教と比すべきものでない。かう云ふ宗教の品彙匹儔でないと云ふ所以である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 131
    "url": "https://dl.ndl.go.jp/pid/943657/1/132"
  "translation_ja": "つまり、ほかの仏教やキリスト教は、まず宗教として価値を持つが、神道は、天地に通じる公の道である。それが国家の大道として、政治の道、道徳、そして宗教として価値を持つ。人の世のあらゆる行いを導く大道として価値を持つのである。この点で、仏教やキリスト教と比べられるものではない。このような宗教と同類ではない、というのは、そのためである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "即ち他の佛〓や基督〓は、先づ宗〓として價値を有するのであるけれど、神道は、天地の公道である。それが國家の大道としては、政道として、道德として、而して宗〓として價値を有するのである。つまり、人世百般の行爲の大道として價値を有するのである。此の點が佛〓や基督〓と比すべきものでない。かう云ふ宗〓の品彙匹儔でないと云ふ所以である。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0132-003"
  "section_id": "chapter-12-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "けれども强ひて比較して見やうとすれば、こんな卑近な例で聊かその關係を示すことが出來るかも知れない。即ち神道は飯である。佛教や、基督教は酒や煙草のやうなものである。飯は國民に一日も缺くべからざるものである。飯を食する以外に、酒や煙草は、之れを飮み、之れを喫するも敢へて妨げない。けれども必らず飮み又は喫しなくてはならぬと云ふことはない。されど神道は我が國の大道で、苟くも我が國民たるものは、恰も飯を食せざるべからざるが如くに、須臾も離るべからざる大道である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 131
    "url": "https://dl.ndl.go.jp/pid/943657/1/132"
  "translation_ja": "それでも、あえて比較するなら、身近なたとえで、その関係を少し示せるかもしれない。神道は飯であり、仏教やキリスト教は、酒やたばこのようなものである。飯は、国民にとって、一日も欠かせない。飯を食べるほかに、酒を飲み、たばこを吸っても、あえて妨げはしない。しかし、必ず飲み、吸わなければならないわけではない。神道は、わが国の大道であり、いやしくも、わが国民である以上、飯を食べなければならないのと同じように、片時も離れられない大道なのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "けれども强ひて比較して見やうとすれば、こんな卑近な例で聊かその關係を示すことが出來るかも知れない。即ち神道は飯である。佛〓や、基督〓は酒や煙草のやうなものである。飯は國民に一日も缺くべからざるものである。飯を食する以外に、酒や煙草は、之れを飮み、之れを喫するも敢へて妨げない。けれども必らず飮み又は喫しなくてはならぬと云ふことはない。されど神道は我が國の大道で、苟くも我が國民たるものは、恰も飯を食せざるべからざるが如くに、須臾も離るべからざる大道である。"

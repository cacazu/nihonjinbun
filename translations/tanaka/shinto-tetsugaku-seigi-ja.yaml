  "translation_ja": "「道徳」は、今日では一般に一つの言葉となっている。しかし、研究するには、「道」と「徳」に分けてみたほうがよい。道については前に詳しく述べたから、ここでは、まず徳について少し述べよう。「徳」の字は、もともと「悳」と書いた。『説文』には、「悳とは、外では人に得、内では自分に得ることである。直と心とに従う字である」とある。その意味を考えると、自分がまず行って得るところがあり、その後で、それを人に及ぼすことをいうのである。行って、自分の内に得るものがあるためには、もとより心が清く正直でなければならない。そこで、この字は、「直」と「心」の意味を合わせて作られた。そして『礼記』などには、「徳とは、得ることである」と解釈される。音が通じ合い、意味も非常に近い字による解釈だが、きわめて適切で、よく当たっている。「得」の字は、『説文』には、「行って、取るところがあること」と解釈されている。この字で徳を解釈するのであるから、『礼記』も、徳について「徳とは、身に得ることである」とする。ところが、わが国の学者、伊藤仁斎は、『語孟字義』に「徳は、仁・義・礼・智の総称」と書いている。したがって仁斎は、『礼記』の「徳とは得ることである」という解釈について、音の近い字を借りて意味を表したのであり、本来の正しい読み方ではない、と断言する。しかし、徳は「得」で解釈するのがよいようである。荻生徂徠も、やはり、これを支持している。『弁名』に、「徳とは得であり、人がそれぞれ、道において得るところがあることをいう」と書いている。要するに、徳の意味は、徂徠の説のように、人々が道を行い、その上で、自ら得るものをいうのである。したがって、精神か身体かは、必ずしも問わない。西洋でも、徳を、多くは意志の習慣と解釈するが、これも適切である。つまり、徳とは得であり、私たちが常に道を行って得たもの、すなわち習慣なのである。徳が備われば、その後は、道を行おうという考えがなくても、おのずと道を行えるようになる。それを有徳の人という。神道でも同じで、神の道を日々、時々刻々に行っていけば、その習慣が身につき、品性を得られる。それを有徳の人というのである。有徳の人は、あえて道を行おうと苦心せずとも、その言動がおのずと道にかなう。このような人は、真の神なのである。"

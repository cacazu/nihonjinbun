  "translation_ja": "そして、天照大神が三種の神器によって政治の要点を示されたとするかどうかは別としても、ともかく、以上のように神聖で貴重な三種の神器が、天地とともに、きわまりなく伝えられることに、私たちは深遠な意味を見いだせる。いわゆる生存競争は、動かせない現象である。だから今日、世界の競争の場で優れた地位を占めるには、まず国家社会の一員として、さまざまな方面の知識を十分に発達させなければならない。しかし、その知識は、単に競争が上手になり、競争で得た結果は、その競争を続けられるだけにすぎない、というような、物質的な知識だけではいけない。それと同時に、いわゆる理性的な真の知を開かなければならない。神鏡が厳然と存在することは、まさにこの意味を含むと信じられる。真の知は貴重だが、この方面にだけ偏ると、温かな思いやりの心が乏しくなる恐れがある。そこで、情操を発達させることが、きわめて必要となる。宝器に神璽が備わっているのは、決して偶然ではない。真の知も情操も、要するに静かなものであり、天地とともにきわまりない国運を発展させようとする、大きな活動を起こす活力にはならない。そこで、さらに固い意志が必要となる。意志は心の活力であり、強く勇ましい身体を得て、初めて固い意志となる。もし固い意志を器物で示そうとするなら、鋭い剣よりも、よく示せるものがあるだろうか。私たちは、神器の中に宝剣があることを、ますます、至れり尽くせりと感じずにはいられない。"

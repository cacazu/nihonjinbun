  "translation_ja": "『日本書紀』によると、景行天皇が熊襲征伐のため周防へ来られたとき、その地方の首長、神夏磯媛は、磯津山の榊を抜き、上の枝に八握の剣、中の枝に八咫の鏡、下の枝に八坂瓊を掛け、白旗を船の舳先に立てて参上したという。また仲哀天皇の熊襲征伐のとき、岡の県主の祖先、熊鰐は、天皇がおいでになると聞き、五百枝の榊を抜いて、九尋の船の舳先に立て、上の枝に白銅の鏡、中の枝に十握の剣、下の枝に八坂瓊を掛け、周防で迎えたという。さらに、そのとき筑紫の伊覩県主の祖先、五十迹手も、天皇のおいでを聞き、五百枝の榊を抜いて船に立て、上の枝に八坂瓊、中の枝に白銅の鏡、下の枝に十握の剣を掛け、長門の引島で迎えて献上した。そのとき五十迹手は、「私があえて、これらの物を献上する理由は、天皇が八坂瓊の曲がるように、巧みに天下を治め、白銅の鏡のように、明らかに山川海原を御覧になり、この十握の剣を取り下げて、天下を平らかにしていただきたいからです」と申し上げた。すると、天皇は大いにこれを褒められたという。この言葉は、あまり信用できないとされる『神皇実録』や『天口事書』のような本にも載っているので、どうも五十迹手が考え出した言葉でもなさそうに思われる。おそらく、このような言葉が、古くからあったのではないか。ともかく、こうした思想が古くから存在したと思われる。そう見れば、天照大神の心にも、これに似た考えがあったのではないかと推察するのも、無理ではないと思う。頼山陽は、大神の徳の偉大さを推し量るのは容易ではないが、神器に即して見れば、何か言えるように思われる、と言う。天地とともにきわまりないという神勅が、後世、輝かしい事実として現れているのを見ても、その初めに、大神が神器に託して徳を表されたのではないかと想像される、というのだが、たいへん穏当な考えだと思われる。久保季茲は『三種神宝論』に、「もとより、大御神がその心に、そんな小賢しい理屈をもって授けられたのではないが、自然にその理にかなっているようだ」と言っている。当時、中国では盛んに知・仁・勇などの説が唱えられ、西洋にも、すでに真・善・美という考えがあった。そう考えれば、世界に比べるもののないわが国体の淵源を立て、雄大な神勅を下した天照大神の心に、おのずからこのような考えが生まれたのではないかと思われる。当時、貴い器物は、ほかにも多くあったに違いない。その多くの器物の中から、特にこの三種を選び出されたことには、相当に深い意味がなければならない。儒者が説くような意味は別としても、この三種を最も貴重な器物として授けられ、それがわが国の神器として、いつまでも伝えられているのは、実にありがたいことである。インドでは、転輪王の世に七宝が備わっていたという。その福徳の力に感応したものだったのだろうが、わが国の神器のように伝えられたものではない。また中国では、九鼎を宝とし、夏・殷・周がみな受け継いだが、その鼎は夏の禹王が鋳造したとされ、後世には伝わっていない。秦以来の伝国の璽は、始皇帝が作り、李斯が文字を書いたといい、漢では斬蛇剣を伝国の宝としたというが、これらも、わが国の神器と比べれば、同じには論じられない。ドイツなどにも十種の神宝というものがあるというが、もちろん、わが国の神宝とは、到底比べものにならない。ひとり、わが国にだけ、このような神器が伝わり、その光が天の日と等しいことを、実に私たち国民の光栄としなければならない。"

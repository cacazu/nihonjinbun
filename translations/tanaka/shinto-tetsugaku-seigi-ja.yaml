  "translation_ja": "このように古伝を解釈すると、それ以前の天御中主神・高皇産霊神・神皇産霊神を、どう理解するのが最も合理的か、という問題が生まれる。当時、イザナギ尊・イザナミ尊・天照大神以下の神々が、どのように考えていたのかを、今日、究めてみなくてはならない。"

    "url": "https://dl.ndl.go.jp/pid/943657/1/50"
  "translation_ja": "そもそも、高皇産霊神についての古伝は、かなりまちまちである。たとえば『旧事紀』という書は、一般には後世の偽作として信用されないと言われるが、その内容が、ともかく古い伝承であることは、多くの学者が認めている。その書には、高皇産霊神は天御中主神の男の子だと伝え、天御中主神には三人の男子がいたとしている。また『古語拾遺』にも、天御中主神には三人の男子がいて、長男が高皇産霊神、三男が神皇産霊神だという伝えがある。高皇産霊神が天照大神と同時代の神であり、しかも天御中主神の長男だったということになると、古伝の解釈は、たいへん難しい。どう解釈してよいか、まったく分からなくなってしまう。このようなところでは、先に述べたように、古伝に多くの誤りが入り込んでいると認めなくてはならない。古伝は、どうも数学のように、きちんとはできていないのである。"

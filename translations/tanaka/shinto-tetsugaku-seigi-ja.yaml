  "translation_ja": "神道道徳の実践の面を、もう少し述べてみよう。中国では、孝を根本とし、孝は、あらゆる行いの根本だという。また、「父子には親愛、君臣には義、夫婦には区別、年長者と年少者の間には順序がある」と、まず父子、次に君臣を挙げる。中国は孝を根本とする主義である。しかし、わが国は忠孝一本主義であり、君臣の道を最も大切にする。これはどういうことか。わが国では親子の関係が最も親密であり、親を尊ぶことが、非常によく行われている。そのため、親に孝行しようということになる。では、どうすれば親孝行になるか。親においしいものを食べさせ、立派な着物を着せるのも、孝行の一つである。立派な家を建ててやるのも孝行だが、それより大切なのは、親の志を継ぎ、親の精神に背かないことである。その親の志はどこにあるかというと、そのまた親、つまり祖父母の志にある。祖父母の志は曾祖父母の志である。そのように、ずっとたどっていくと、私たちの祖先の志となる。祖先の志はどうか。私たちの祖先は神々、あるいは皇族である。今日、わが国民には、藤原家の子孫が非常に多い。いわゆる五摂家はわずかだが、藤原家の流れを探せば、日本に何千、何万、何十万あるか分からない。その源をたどれば、天児屋根命に帰する。また、現在、源の姓を名乗る者、姓は源、氏は何々というように、さまざまな氏はあるが、姓は源という者が、どれほどいるか分からない。平の姓も、どれほどあるか分からない。しかし、源をたどれば、源姓の者は清和天皇、または宇多天皇に帰し、平家なら桓武天皇に帰する。神をたどれば、天児屋根命、あるいは太玉命に帰するということになる。このような祖先の神々が、皇室に忠節を尽くされたのは、いうまでもない。天児屋根命は、天孫降臨の際、最も重要な神として地上に下り、厚く忠節を尽くされた神である。その志を、今日の藤原家の系統の者は受け継がなければならない。つまり皇室に忠節を尽くし、「大君のおそばでこそ死のう。安らかには死ぬまい」という精神になる。そうして大君のおそばで死ぬなら、それが親に対する、最も大きな孝行であり、国家にとっても、大きな忠節である。すなわち、忠と孝は一本なのである。また別の面からいえば、わが国は家族主義であり、皇室と国民は、本家と分家の関係である。だから、本家のために尽くすことは、その家のために尽くすことになる。この点から見ても、忠孝一本となる。そこで、国家にひとたび非常事態が起きたとき、親が重い病気だと仮定しよう。自分が出征すれば、ほかに看病する者がいない。その場合、出征すれば親は死ぬかもしれない。出征せず親を看病するのが孝行か、出征して親を見捨てるのが孝行か。このような場合、わが国民は、親を置いてでも、国家の危急に駆けつけるべきである。これは、親への情が薄いからでも、親しみがないからでもない。親の志も、やはり、そこにある。これに似た実例は、歴史に多い。親が健康で、軍籍にあったなら、親自らが、国家の危急に駆けつける。不幸にして今は病気で行けないが、せめて自分の子を行かせよう、というのが親の精神である。その精神に背けば、かえって大変な親不孝になる。この点から見れば、国家に忠を尽くすことは、親孝行になる。つまり忠孝一本である。外国では、それができない。中国では、前にも述べたように、「ただの一人の男である紂を討ったとは聞くが、君主を殺したとは聞かない」、あるいは「天が命じて、これを討たせる」という。臣下が君主を殺すのを天命とし、天命には背けないといって、君主を殺す。したがって、忠と孝は一致できない。朱舜水という人が、水戸に来て仕えた。朱舜水の子は中国にいた。朱舜水自身は明の遺臣であり、清によって明が倒されたため、日本の力を借り、明を回復しようとした。それが国家に忠節を尽くす志であり、朱舜水は、まことに忠臣である。ところが、その子は清の俸禄を受けた。その子が親孝行をしようと思えば、どうしても、清の俸禄を受けることはできない。父と同じように、明の回復に努めなければならない。しかし、その子は親の意志に反し、明を捨て、清に仕えた。清から見れば、これは忠臣である。朱舜水は反逆者だが、その子は忠臣である。つまり、その子は清には忠臣で、親には不孝な子である。忠と孝が一致せず、一本にならない。忠孝一本は、わが国において、万世一系の皇統のもとに、初めて見られる。これが、わが神道道徳の特色なのである。"

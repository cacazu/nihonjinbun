  "translation_ja": "では、その道を何と呼ぶかといえば、惟神の道というのである。「随神の道」とも書く。この、わが国の昔の道を、神道、または神の道と呼ぶようになったのは、いつごろか。『日本書紀』には、用明天皇のときに、「天皇は仏法を信じ、神道を尊ぶ」と記されている。しかし、この文字は、『塩尻』に「神道の字を、わが国の帝紀で考えると、仏法に対していっただけであり、後世のように大げさな秘訣としたのではない」とあるとおり、決して、神道本来の意味で使われたのではない。篤胤も、『日本書紀』のこの文字を解釈して、次のように言っている。「神を祭ったり、祈ったり、祓をしたりする類の、神にお仕えすることを広くいったもので、いわゆる神事のことです。もちろん、この神事も、たどっていけば神道に関することですが、事と道は、幹と枝葉のような違いがあります。先に申し上げた神ながらの道とは、もとより大きな違いがあるのです。仏法と対にして神道とあるからといって、後世の神学者などのように、教えのことだと受け取るのは誤りです。ここでいう神道は、用明天皇が仏法をお信じになっても、神事をおろそかにはなさらなかった、という意味に軽く見ればよいのです」。このときの神道は、結局、儀式の方面を名付けたもので、根本的な内容の意味には使われていないようである。そのような儀式の方面は、知識の幼い国民の感情的な要求を満たせるが、知識が次第に発達すると、ただ神の前へ行き、祭りや祓をするだけでは、十分な満足は得られなくなる。仏教を見ても、一方では金色に輝く仏像を作り、豊富な供物を供え、金襴や緞子の袈裟や衣を着て、ものものしく、自分でも理解できないような経を読み、さまざまな儀式を行う。しかし仏教がそれだけのものなら、今日まで命脈を保ち、今日のように広がることは、到底できない。仏教は、ほかの面で、多くの人を感心させるさまざまな教理を持つ。それによって今日まで命脈を保ち、世界各地へ、あれほど広がることができたのである。神道も、祭りや祓や禊という程度の外面的なことだけでは、後世の国民を十分に満足させられない。そこで、仏教や儒教と同じように、わが国固有の大道を、理論の面から説明してほしい、ということになる。仏教の何千巻という経文も、要するに、その骨髄、根本となる真如や涅槃の説明にすぎず、あるいは、それを体現する方法を示したものだといえる。神道でも、その骨髄、根本、つまり私がこれまで説いてきたようなものを、理論の面から十分に説明することが求められる。この流れに乗り、比叡山を開いた伝教大師最澄の門下は、山王一実神道を起こした。これは、多少、神道の学理的な方面に触れている。しかし、もともと仏教の教理を基礎とするもので、決して、固有の大道を十分に示すことはできない。今日から見れば、やはり篤胤のいう神事の意味から、あまり出ていない。最澄の一派と、ほぼ同時に、弘法大師空海の一派が盛んになった。そもそも弘法大師は、今日、多くの大師がいるにもかかわらず、ただ大師といえば、すぐ弘法大師を指すほど、広い学識と大きな才能を持ち、物事の奥深い理に通じた、当時の大人物であった。それゆえ、布教のために神道を用いることが、いかに便利かを悟ったのだと思われる。最澄以上に、この点に考えを巡らすことが多かったらしい。そして門下には、多くの優れた人材がおり、彼らが集まって、いわゆる両部習合神道を作り上げた。しかし、これも林羅山が評して、「仏法を神道に合わせ、胎蔵・金剛の両界を陰陽に合わせ、ついには神仏が本来一体だとする」と述べたように、その根本は仏教から成っている。その後、卜部の一派、特に兼倶などは、このような仏教的な神道に満足せず、新たに唯一神道を立てたが、やはり仏教的な神道であることを免れない。いつまでも、神道は仏教の教義から離れられなかった。世間の人々も、あえてこれを怪しまなかった。卜部兼右の編という『神道根源』などにも、「神道は仏法以前からあった。しかし、仏法が渡来して比べてみると、おのずから同じものだったので、照らし合わせて納得した」というような次第であった。"

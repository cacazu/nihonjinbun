  "translation_ja": "また、毎年六月と十二月に行われる大祓も、半年の間に生じた、私たちの心と身体のあらゆる罪悪を洗い清め、新たに秩序ある生活を営もうとすることの結果にほかならない。すでに述べたように、わが国民は来世を考えず、祓によって常に罪や穢れを払い、新しい活動を、発展的に営もうと努めている。キリスト教などでは、罪を免れて天国に生まれようとすることを理想としている。しかし神道で罪と穢れを払うのは、現世で、ますます発展し、活動しようというのである。どこまでも現世に一つの区切りを付け、さらに新鮮な活動をしようとするのである。西洋では、日本のようには正月を祝わない。もちろんアメリカでも、大晦日には街も活気づいてにぎわい、元日になると、工場が一斉に汽笛を鳴らす。ちょうど日本で百八つの鐘をつくようにする。しかし元日になったからといって、門松が立つわけでも、年始の客が新しい着物で行き来するわけでもない。ドイツでも、正月の零時一分には、みな「プロージット、プロージット」と、日本でいえば「おめでとう」のような言葉を盛んにいうが、改まった儀式などはしない。もちろん西洋では、クリスマスを非常に重んじる。このキリスト教の祭日には、さまざまに熱狂的な騒ぎをする。しかし正月には、何もない。ところが、わが国では、元日に宮中で最も厳かな儀式が行われ、全国がこれを大祭日とし、津々浦々まで、しめ縄を張り、飾りをし、いわゆる正月着を着るなどして、正月を祝わない者はいない。正月と大晦日は、時間の上では格別の違いはない。しかし、心の状態には、大きな区別が生じる。ここで万事を新たにし、新しい生活に入って暮らそうというのである。それが正月の元日であるのは、秩序と統一を重んじる精神の現れといわなければならない。一月一日を大きな祭日として、ここに精神の新しい時代を画することは、わが国で初めて見られる。もちろん中国などにも正月はあるが、とても、わが国のようにはいかないのである。"

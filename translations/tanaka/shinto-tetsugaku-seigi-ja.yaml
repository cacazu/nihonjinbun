    "text": "一意專心、古傳をありのまゝに解釋せんと努めたる宣長の說として、應さにしかあるべきも、而かも爲に宣長は、論理的自殺に陷つたのである。即ち古傳のまゝに解せんとすれば、古傳の劈頭「天地初發の時高天原に成りませる神」とある、高天原は解せない。高天原は宣長は天と云ふ。天は地と共に葦牙の樣なものから出來たと云ふ。そこで天のない時に天の存在を說かなくてはならぬ。宣長の窮した所以である。從つて此の點に於いて、宣長學を崇敬せる飯田武卿、岡吉胤と云ふ樣な先生でさへ、「叶はず」などゝ云つて、宣長に從はなかつたのである。その位だから、平田篤胤は尙更ら從はない。即ち篤胤は先づ宣長の說を排斥し、而して自らの說を立てたのである。「此の說は信がたい」とは篤胤の宣長の說に對する言葉である。そして高天原は「大虛の上方謂ゆる北極の上空、微微垣の內を云つたのであらう」と云ひ、『緯書』たる『春秋元命包」に、「中宮天極星、その一明なる者太一の常居云々、故に北辰となす、亦紫微宮となす」などの語に基いて、高天原を北極としたのである。かくて宣長と同じく天地鎔造說を主張せる篤胤は、自家撞着を免れんとしたのである。而して後に至つて篤胤は、高天原を太陽そのものとして居る。即ち天つ日やがて所謂高天原にて天照大御神こをしろしめし、皇產靈大神また他の「天神だちも往に集ひ給ふ御國である」と云ふのである。太陽と紫微垣何等の聯絡もないのである。そして經驗的事實から見ても、あまりに突飛な說である。"

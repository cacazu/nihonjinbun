  "source_text": "而してたとひ天照大神の三種の神器を以つて政治の要諦を示されたものとするのは、別問題としても、とにかく右の如く神聖貴重なる三種の神器が、天壤と無窮に傳へらるゝに對して、吾人は深遠なる意味を懷き得るのである。所謂、生存競爭なるものは、動かすべからざる現象であるから、今日我々が世界の競爭場裡に、優勝な地位を占めんが爲には、先づ我が國家社會の一員として十分に種々の方面の知識を發達しなくてはならない。けれどもその知識は單に競爭に上手になつて、競爭し得た結果は、唯その競爭を繼續し得るに過ぎないと云ふ風な、物質的の知識ばかりではいかない。之れと同時に所謂理性的の眞智を啓發しなくてはならない。神鏡の嚴として存するのは、正しく此の意味を包含するものと信ぜらる。眞智は貴重であるけれども、此の方面にのみ偏するときは、温かき惻隱の心は乏しきに陷るの虞がある。是に於いて情操の發展が極めて必要となつて來る。寳器に神璽の備はつて居るのは、果して偶然ではないのである。眞智と云ひ、情操と云ふも、要するに、靜止的であつて、天壤無窮の國運を發展せんとする、大々的活動を誘起する所の活力とはならない。是に於いてか、更に鞏固な意志がなくてはならないことゝなる。意志は、心的活力で、强健勇武の身體を俟つて、初めて鞏固な意志となるのである。若し鞏固な意志を器物で示さんとすれば、利劒よりもよく示さるゝものがあらうか。我々は神器の中に寶劒の存することの益〻至れり盡せりと云ふ感なきを得ないのである。"
  "source_languages":
  - "ja"
  "source_locations":

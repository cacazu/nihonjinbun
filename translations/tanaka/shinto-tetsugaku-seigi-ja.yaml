  "source_text": "それから又快活的、現世的感情と云ふのは、印度國民などは、どうも厭世的の國民である。快活的でない。山の中へ引込んで生活すると云ふ風の者が多い。いつぞや來朝したタゴールなどは、最も新らしい實例である。汽車だの、電車だの、その他所謂文明なるものを詛ひ、市街の熱鬧を厭ふなどは、我が國民が御祭などを愛し、緣日に詣るを好むのとは、同日に論ぜられない。又西洋でも希臘國民などは隨分現世的であつたが、中世には澤山の厭世的國民が出て、財產を教會に寄附して隱遁するの風が大いに行はれた。現今でも佛蘭西國民などには、かゝる生活をなすものが多い。尤も我々日本國民に就いて見ると隨分厭世觀を抱いて居る者もないことはない。けれどもそれは佛教の影響を受けたり、又は其の個人の境遇等がさう云ふ事をし出來したものであつて、大多數から見ると云ふと快活的である。厭世的の憂欝的の生活をすると云ふことは、日本國民は餘りしない。厭世的傾向に富む佛教でも、日本化すると日蓮一派のやうに大いに快活的になる。念佛宗などは、餘程厭世的傾向を持つて居ると見なくてはならないけれども、肉を食ひ、妻を帶する所など、とても印度佛教として見られないやうな現象である。之れも日本化せられた結果と見てよい。それから又現世的である。未來の天國未來の極樂と云ふことは餘り念頭に置かない。勿論年を取つた者や、身體の弱い者や、何か動機を持つて居るものゝ中には、隨分さう云ふ考を有つて居る者もある。兎に角精神なり身體なりが病的の者は、天帝や、阿彌陀如來などにひどく依賴し、未來の幸福の保證を得やうとする觀念の非常に强い者もあるけれども健全なる日本國民に於いてはさう云ふ者は少い。たとひ佛教徒となつて、佛に禮し、寺院に布施するものと雖も、又たとひ基督教徒となつて、神の福音を喜び、教會に參禮するものと雖も、日本國民として健全なる以上、現世的たるを失はない。要するに日本國民の大多數は皆現世的で、現世に於いて活潑に活動するのが日本國民の特色である。"

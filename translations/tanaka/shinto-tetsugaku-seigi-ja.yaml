  "source_text": "所が神道學者はどう云ふ風に解釋して居つたかと見ると、本居宣長は、神と云ふことに就いては昔から色々說があるが首肯すべきものは、どうもない。が、自分にも未だ一向考が附かぬと言つて、何とも說を立てゝ居らぬ。その門人平田篤胤はまだ若い時神道の本を書いた、『靈能眞柱』と云ふのである。其の本に於いては神と云ふのはカビモエと云ふ言の轉略したのではないか何故かと云ふと可美葦牙彥舅神と云ふ神は成り始めに出來た神であるからそれで神と言へば此の可美葦牙彥舅神を本として言ふたものと見える。斯う云ふ工合に、可美葦牙彥舅神と云ふ神から、カビモエと云ふ解釋を取つて來て、さうして其のカビモエが轉り略かれてカミと云ふ言葉が出來たのであると云ふ解釋を下したのである。が、併し此の時には未だ非常に疑はしい、「あらざるか」と云ふやうな言葉を使つて居たけれども、後篤胤が一生の心血を濺いで『古史傳』と云ふ書を著はせる時に方つては、此の言葉は千言萬語の中で一番初めに辨へて置かなければならぬのである。斯う云ふて神と云ふ言葉は『日本書記』の初めにある所の「天地未だ剖れず、陰陽分れず、渾沌たること鷄子の如く、溟滓て牙を含めり」。此の牙と云ふのが本である。昔は之れをアシカビと訓んだけれども、それは間違ひで、又キザシとも訓むが之れも允く當らない。カビと訓まなければならぬ。で其のカビと云ふ字のカは彼の意にて物を其れと指して云ふ言葉、ビは、轉じてブとなつて加夫となり、又加牟ともなるのである。そして其のビの意味は、實に靈妙なるものを言ふのである。斯う云ふ解釋である。尙此の他に平田翁の學說を承けた美甘政和はカはカスミカゼカヲルカスカカクルなどのカでビは奇靈のビで靈妙の義とし、鈴木重胤はミと云ふ方を精靈と云ふやうな意味に解釋して居るのである。"

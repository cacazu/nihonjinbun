    "text": "で、此の神勅と同時に、三種の神器と云ふものを御傳へになつた。此の三種の神器と云ふものが、此の神勅と相共に、天照大神の後世に垂れられた所の範を示されて居るのである。一體我が國民は、天照大神の神勅に從つて、遠大なる思想を以つて秩序統一を保ち、快活的、現世的であつて、而して何處までも發展し膨脹し、天地と共に窮る所がないやうにあるべきである。さうするのに必要である爲に、此の三種の神器と云ふものが傳へられて居るのである。從つて三種の神器は、我が國に於いて最も重要なものとなつて居る。此の三種の神器に就いては、先づ其の順序が、大分昔から問題に成つて居る。天孫降臨の時の傳には、「八坂瓊曲玉、及八咫鏡、草薙劒」といふ具合に、『日本書紀』にも『古事記』にも傳はつて居るが、『古語拾遺』には、鏡劒といふ順序に成つて居るし、『書紀』の繼體天皇の所には矢張り鏡劒といふ順序に記されて居り、『神祇令』にも、鏡劒といふ風に記されて居る。斯ういふ樣な具合で、鏡が一番上であるといふ說もあるのであるが、併し此れは如何かと思はれる。元來、この三種の神器は、何れが重いといふ樣な區別の附けらるべき理由の物では無いと思はれる。唯、今擧げた鏡劒といふ傳のあるのは、璽は、陛下の御身邊に常にお置きになり、卽位の御大禮の場合などにも、璽は已に新しき陛下の御側にお置きになつてあつたもので、忌部などが奉る場合には、鏡と劒とを特に捧げたものである。其れで、此の中から重を省いて、鏡と劔とを並べて書く樣な工合に成つたものと思はれる。尤も鏡に對しては、特に天照大神が別の神救に、「此の鏡は我が御魂となして、吾が前に拜くが如くいつきまつれ。」と仰せになつて居る意味よりすれば、鏡が最も重い樣に思はれるが、三種の神器として大神の御授けになつた場合には、決して優劣をつけて御授けに成つたのでは無いと思はれる。又、『古語拾遺』などには二種の神寳と書いて有ったり「大處年の就罰」とも。天津聖乃副變にどといい言葉があに擧げた二三の例にも鏡劒といふことが書いて有るものであるから、人によると、三種の神器は二種の神器であるなどと考へるが、之れは大變な間違ひであつて前にも言つた樣に曲玉は、常に陛下の御側にお置きになる事になつて居るのであるから、右のやうな紀事には二種のみを書したものである。神器の三種であることは、『日本書紀』にも、『古事記』にも嚴として記されて有るのであるから、此の間に、一點の疑義を挿むべき餘地が無いのである。"

    "text": "でさう云ふ風に上に在はす所の者は大仁慈を以つて下に御臨みになり、かゝる憲法までも欽定になるのである。下たる者は如何にすべきか。斯う申して見ると、下たる者の行ふべき道は、神代に於いて、思兼神の如き偉い神が出られて、而して常に我が天祖に御事へ遊ばして、謀略を御廻らしになつたと云ふやうな事蹟もある。又大國主神と云ふ有力な神があつたが、此の神は八百萬神を率ゐて、さうして永く皇孫の爲に御事へになつたのである。又天照大神は天兒屋根命、天太玉命に詔して汝二神又同じく宮中に侍ひて能く防護を爲せと云ふことを仰せになつて居る。そこで天兒屋根命と天太玉命を諸々の神達と皇孫尊に附けて御下しになつたのである。二神は皇居の中に侍ひて、能く御防護をなさつたのである。又武甕槌神、經津主神と云ふ神が御出でになつたが、此の二神の如きは天祖に從はれて我が國家の爲に、我が皇室の爲に勇戰奮鬪遊ばしたのである。而して後世に於いては此の神を以つて、武神として祭るのである。云ふ工合にかゝる神々が皆忠誠を以つて此の國家、皇室に事へて御居でになる。であるから後世になつて儒〓などが這入つて來て「堯舜は天下を官にす」と言ひ、又「天下生れて尊き者はない」なんと言ひ、或は「天下は天下の天下で一人の天下ではない」などと云ふやうなことを〓へて居る。又「大德は命を受く」と言つて、大いなる德のある者が命を受けて天子となる。何人でも德さへあれば天命を受けて天子となると言つて居る。而して支那の湯王や、武王が、其の君を放伐したのを辯解して、「有夏罪多し。天命じて之れを殛せしむ。」と云ひ、或は又「夏氏罪あり。予れ上帝を畏る。敢へて正さずんばあらず。」と云ひ、「或は商の罪貫盈す。天命じて之れを誅せしむ。予れ天に順はざれば厥の罪惟鈞し。」と云ふ。斯う云ふ風な辯解は昔から支那では言つて居るのである。だから孟子のやうな賢人でさへ、「臣として其の君を弑す。可ならんか」と詰らるゝや、仁仁賊ふもの之れを賊と云ひ、義を賊ふもの、之れを殘と云ふ。殘賊の人之れを一夫と謂ふ。一夫の紂を誅するを聞く。未だ君を弑するを聞かず。」と云つて居る。勿論之れに對して、後漢の王充は、「刺孟」を著はし、宋の司馬光は、「疑孟」を著はして、孟子を非難したのであるけれど、併し支那人の大多數は、孟子の樣な考を持つて居つて、君の臣を視ること土芥の如くする時は、臣の君を視ること寇讎の如くす」と云ふ風に考へて居るのである。輓近支那人の愛親覺羅氏に對した態度は事實に之れを證明して居るのである。だから支那の歷史を見ると伏義以來姓を變ふるもの三十、弑を以つて書する者二百と言はれて居る。こんなに支那では澤山の弑虐も行はれ、纂奪も行はれたのである。支那の儒〓の中にはさう云ふ風な危險思想を包含して居るのである。併し其の危險思想を有する儒〓が我が國に這入つて來ても、而かも我が國民は少しも是れが感化を受けない。之れが爲にビクともしないのである。而して我が國民の秩序的統一的思想は益、反抗的に發展して來て居るのである。大伴氏に傳はつたと云ふ所の「海行かばみづく屍、山行かば草むす屍、大君の幣にこそ死なめ、のどには死なじ。」と云ふ精神は、永久に我が臣民の腦中を離れないのである。如何なる危險思想が這入つて來ても、それに抵抗し得るのである。「君のため世のため何かおしからん、捨てゝ甲斐ある命なりせば。と云ふ風な歌となつて、皆此れ我が秩序的統一的の精神を流露して、容易に他の外來の思想の爲に障碍を受けないで、何處までも我が君國の爲に一身を犠牲にして少しも顧みない。斯う云ふ精神と云ふものが、昔から我が國民の間に勢力を持つて居るのである。"

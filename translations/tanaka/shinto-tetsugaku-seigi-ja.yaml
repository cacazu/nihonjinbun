  "translation_ja": "天御中主神・高皇産霊神・神皇産霊神の徳は、広大で限りなく、言葉では表せないほどである。それだけでなく、人の身体を持っておられないため、私たちは仰ぎ拝んで、その教えを十分に受けることができない。ところが、天照大神は人の身体を持ち、三神の広大無限の徳を、人格として備えておられる。つまり、わが国の秩序と統一を重んじる思想、現世的で快活な感情、発展し膨張する性格の精華の、さらに精華というべきものを持っておられる。もちろん、天照大神について古伝はさまざまにあるが、それらは当時のきわめて未熟な文学によって伝えられているため、古伝から大神の偉大な徳を十分にうかがうことはできない。しかし、伝わっているものを見ても、おおよそ、その一端を知ることはできる。『日本書紀』には、「その光り輝く美しさは、天地四方の内を照らし尽くす」と伝わっている。これを見ても、大神の身体がどれほど麗しく美しく、その徳が偉大であったかを想像できる。さらに大神は、皇孫の瓊々杵尊をこの国に下すとき、こう神勅を下された。「葦原千五百秋の瑞穂の国は、わが子孫が王となるべき地である。皇孫よ、そこへ行って治めなさい。さあ、行きなさい。皇位の栄えは、天地とともに、きわまりなく続くであろう」。この神勅でも、瑞穂国は自分の子孫が王となるべき地だと断定し、皇位の栄えは天地とともに、きわまりないはずだと仰せになっている。これを中国と比べれば、堯帝が舜に位を伝えるとき、「ああ、舜よ。天の定めた帝位の順序は、お前の身にある。誠実に、その中正の道を守りなさい。天下の民が困窮すれば、天から授かった禄は、永く終わるであろう」と言った。堯はこれを舜に伝え、舜はこれを禹に伝えたというが、そこには「天下が困窮する」「天禄が永く終わる」とある。ところが、わが国の神勅には「皇位の栄え」とあり、「天地とともに、きわまりない」とある。この時代に、天照大神の雄大な構想がいかに遠大で、ほかに比べるものがなかったかが分かる。そして、ここが神道の根本なのである。"

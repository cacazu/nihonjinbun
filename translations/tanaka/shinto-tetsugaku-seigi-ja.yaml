    "text": "斯くして忠孝と云ふものを最も重んずるから、茲で「家」と云ふ觀念が非常に强くなつて來る。其の「家」は詰り一個の家でない。祖先の「家」である、祖先に承けて子孫に傳ふる「家」であると云ふ觀念が强い。所謂家族主義と云ふものが、神道に行はれるのである。西洋にも是れは昔はあつたのであるが、今日はもう影も止めない。彼れ等はスウヰート、ホームと云つて愉快な家庭を作ることを希望する。けれども我が國のやうな意味の家族を作ることを考へないのである。從つて西洋の家庭には家長と云ふものがない。又「家」を後世に傳ふることをしない。財產は相續するけれども、家督を相續することはしないのである。所が我が國では「家」と云ふものを非常に重んじて、遠く祖先から承けて永く子孫に傳ふべきものであるとするので、斯う云ふ道德は實踐的方面から述べると、種々樣々の現象となつて、我が國固有の道德を爲すのであるが、其の最も大事なものは、皇室を中心として行くことにある。總べての道德が皇室を無視しては道德とならないことである。是れが大事な所である。他の國では皇室を無視して道德となる場合がある。例へば支那では〓朝を覆へす時に方つて、清朝に反抗して而して我れは國家の爲に働くのであると言つて居る。愛國者であると大呼して居る。又西洋では例へば佛蘭西のルイ十六世の如きは、佛蘭西の議會に於いて其の罪狀を議せられたのである。さうして彼れは遂に死刑を宣告せられたのである。佛蘭西の議會の議員は、國王に對して死刑を宣告して居るのである。而して彼れ等議會の議員は矢張り國家に對して忠節を盡して居ると考へて居るのである。即ち外國に於いては皇室を離れて道德が成立つのである。然るに我が國に於いては、皇室を離れては道德は全然成立たないのである。皇室を中心として道德が成る、皇室を無視した行動に出れば有ゆる道德は皆不道德になつてしまふ。是れが我が國道德の特色である。皇室を中心とし忠、良なる臣民となつて、天祖の神勅に隨つて、天壤無窮の皇運を扶翼して行くことが、我が國の道德の極致である。此の極致を十分に發揮せんが爲には神劔が輝いて居る。國家に危害を與へんとする者があつたならば我々は神劒の神威を蒙つて之れに抵抗せねばならぬ。無論我が國民は一方に於いて神鏡の示す所に依つて知識を磨いて決して無暴な亂暴な事をしてはならない。又一方に於いては神璽の趣意に依つて、慈愛の精神を發揮せねばならぬ。そして又實際に、支那人が東方の君子國と謂つたやうに仁愛の精神に富んで居る。けれども天壤無窮の皇運を扶翼せんが爲に、一旦緩急ある場合には、有ゆる惡魔を討征して我が國家を泰山の安きに置き、其の無限の發展を計ると云ふ事が、我が神道道德の極致であるのである。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"

- "id": "st-0068-003"
  "section_id": "chapter-06-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "豊雲野神以下七柱の神は、皆此の國土の發展に隨つて其の主神の發展をなさる其の度々に出でられた神に、當時の狀を以つて御名を奉つたものである.國土を申すと斯の如く凝結して來て、御神を申せば斯の如く具體的になつて來られた。此の時代を受けて。更に御出になつた所の神は即ち七代神の最後の神である所の伊弉諾、伊弉册の二神である。此の二神はもう全く人身を有して御居でになつた所の神で、即ち人としての御神であるのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 67
    "url": "https://dl.ndl.go.jp/pid/943657/1/68"
  "translation_ja": "豊雲野神以下の七柱は、みな、この国土の発展につれて、その主神が発展するたびに現れた神に、当時の状態から名を捧げたものである。国土についていえば、このように凝結してきて、神についていえば、このように具体的になってきた。その時代を受け、さらに現れたのが、七代神の最後の神、伊弉諾・伊弉冊の二神である。この二神は、すでに完全に人の身体を持っておられた神であり、人としての神なのである。"
  "translation_status": "reviewed"

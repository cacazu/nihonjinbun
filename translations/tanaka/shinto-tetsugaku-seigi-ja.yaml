    "text": "かくて神道には宗〓的性質を有する儀式と云ふものが行はれる。かゝる儀式は、即ち宗〓的意識の發表である。從つてかゝる儀式は種々の國民に依つて、種々の特性を有つて居る。彼の希臘國·民の儀式は非常に快活的である。歡樂的である。印度あたりの儀式は甚だ憂欝的である。沈靜的である。然るに我々は我が國民の國民的精神と云ふものを以つて、秩序的統一的思想、快活的現世的感情、發展的膨脹的性格としたのであるが、斯う云ふ特性が、自ら我が國の儀式に於いて現はれて來るのである。抑も神道の儀式には祓禊と云ふことがある。祓と云ふことに就いては、賀茂眞淵は、「祓は「古事記』に伊弉諾尊が黃泉に至りまして穢れ給へるを、〓め給はんとて、筑紫の橘の小門にして、天御身に著ませる物を、悉く脫ぎ棄て給ふをいふ。穢れたるを拂ひやらふ由なり」と解釋して居る。詰り祓と云ふものの淵源は伊弉諾尊が筑紫の阿波岐原に於いてなされたのにあるのである。是れは我が國民が秩序を尊んで、物のキチンとして行く事を好むの一例である。祓は穢れたものを拂ひ遠けてしまふ所の意味を有つて居る.それから直接に身體を被ひ淨めるのを談と云ふ。禊は身滌である。身體を淨めるのである。身體を淨めると云ふことは、軈て又精神を淨め、精神の穢を祓ふことと思はれて居つたのである。〓潔を好んで身體を洗ふ。さうして又精神を洗ふ。斯う云ふ風なことは我が古代の秩序を重んずると云ふ立派な精神の發露である。けれども中古にはそれが極端になつて來て、奴僕などが病氣になると、それを道路に棄てるやうなことがあつた。何故かと云ふと、死ぬと云ふことが穢れになるから、其の穢れに觸れない爲に病氣の中に捨てゝしまふことがあつて、弘仁四年六月一日には太政官符を以つて、斯う云ふ事を禁ぜられたと云ふことがある。それは〓潔を尊び、穢れを忌むと云ふことが極端に馳せたのである。併し斯う云ふ宗〓的の意識が矢張り國民的精神の發露を示すのである。"

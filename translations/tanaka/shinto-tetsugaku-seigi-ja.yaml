  "source_text": "篤胤は曰はく、「何を以て此の神天地を造り賜へることゝを知るぞとなれば、日神月神の御託宣によりて知らるゝなり。そは、顯宗天皇の御『紀』に三年二月阿閉臣事代任那に使されしとき、月神人に著て詔く、我祖高皇產靈神は天地を造りましゝ御功あり。民地を奉るべし。我は月神なり、もし請はしのまゝに獻らば、我福へてむと詔り賜ひき、事代これに由りて京に還り、具に奏しき。歌の荒樔田を奉り賜ひて壹伎縣主先祖押見宿禰をして侍祠らしめきと見え、また四月に日神人に著て阿閉臣事代に詔く、磐余の田を我祖高皇產靈神に獻れと詔給ひき。日神のこの御託宣に產靈神の天地を造り給へる御功のことを詔へることのなきは、月神の御さとし言にゆづりて省かれたるものなり。事代かくと奏しゝかば神の乞しのまゝに田四十丁を獻り賜ひて對馬下縣直をして侍祠らしめきと有を以て知るべく、又この二柱の神の御名の義と神代の事實の上にて著明しけれどもどうも其の證據が天地を造らるゝと云ふやうな大事件の證據としては、甚だ薄弱である。で、何か其の他に證據があれば兎も角もだけれどどうもそれがないから、其の點には本居、平田二翁も非常に困られたやうに思はれる。一體此の天御中主神や高皇產靈神、神皇產靈神に對する本居、平田、其の他の神道學者の見解が、甚だ不明瞭である。何だか薄い紙を通して見るやうな譯で細かい所がどうしても判きりしない。或る物を間に置いて、向を見るやうな工合である。そこで判きりした答を得やうとすると云ふと、古傳がないから分らないと言はれて居る。傳へが無いから知られない。「傳なければ知るべからず、」斯う云ふ工合に傳說の中に隱れられてしまふ。甚だどうも遺憾であると思ふ。"

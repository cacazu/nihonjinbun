  "section_id": "chapter-07-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "勿論、三貴子の此の邊の傳には、多少の誤謬の入つて居るは、何人も認めざるを得ないが、月讀尊を抹殺せんとする說には著者は左袒しない。著者は月讀尊には、他の二貴子と同じ樣に、澤山の傳說があつたのであらうが、『記』『紀』の出來た時には、已に古傳から遺脫されたものではないかと思ふのである。即ち三貴子の說を主張するのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 76
    "url": "https://dl.ndl.go.jp/pid/943657/1/77"
  "translation_ja": "もちろん、三貴子をめぐるこのあたりの伝えに、多少の誤りが含まれていることは、誰もが認めざるをえない。しかし、月読尊を抹消しようとする説には、著者は賛成しない。月読尊にも、ほかの二貴子と同じように、多くの伝説があったのだろうが、『古事記』『日本書紀』ができたときには、すでに古伝から脱落していたのではないかと思うのである。つまり、三貴子の説を主張するのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "勿論、三貴子の此の邊の傳には、多少の誤謬の入つて居るは、何人も認めざるを得ないが、月讀尊を抹殺せんとする說には著者は左祖しない。著者は月讀尊には、他の二貴子と同じ樣に、澤山の傳說があつたのであらうが、『記』『紀』の出來た時には、已に古傳から遺脫されたものではないかと思ふのである。即ち三貴子の說を主張するのである。"

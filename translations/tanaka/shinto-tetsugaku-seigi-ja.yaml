  "translation_ja": "しかし、仏教的な神道を嫌う風潮は次第に強まり、ついに伊勢の度会延佳のような人が現れ、盛んに神道から仏教を追い出そうとした。ただ、自身の思想はきわめて乏しく、もっぱら儒教によって説を立てようと努めた。このように、神道という文字が、適切な内容を得なかった時期は長い。それで、林羅山や太宰春台のような学者でさえ、なお神道は中国の古代にすでにあったものだと信じていた。林羅山は、徳川義直に代わって『神祇宝典』に序を書き、その結びに、「聖人は神道によって教えを設け、天下が服する」という『易』の言葉を用いている。太宰春台も、「今の人が、神道をわが国の道と思い、儒教や仏教と並べて一つの道と考えるのは、大きな誤りです。神道は、もと聖人の道の中にあるのです」と言っている。しかし、『易』の神道と、わが国固有の大道とは、決して同じものではない。伊勢貞丈が『神道独語』で、「物事は、名は同じでも、実体が異なることがある」と言い切ったとおりである。平田篤胤は、さらに鋭く、これを論じている。少し挙げると、次のようになる。「『易』の文に『天の神道』というのは、『四季が違わない』とあるように、春夏秋冬の季節を違えず、風が吹き、雨が降り、万物が生じることを、自然の神道という意味でいったのです。同じ『易』に、『陰陽の、測り知れない働きを神という』とある、その神の字の意味です。わが国でいう神のように、はっきり実在する神を指して、その神の営みをいう意味ではありません。だから、天の字と神の字の間に、『これ』と読む『之』の字を置いて、『天之神道』と書き、自然の神道という意味で申したのです」。まったくそのとおりで、神道が中国にあったというのは、適切ではない。徳川時代の輝かしい文芸復興とともに、神道も大いに興った。伊勢の度会延佳と同じころ、江戸に吉川惟足、京都に山崎闇斎が現れ、盛んに神道を提唱した。しかし、みな儒教か仏教に基づくもので、固有の大道を十分に示したものではなかった。固有の大道を十分に示し、神道という文字が、その内容を十分に持つに至ったのは、荷田春満・賀茂真淵・本居宣長・平田篤胤という、いわゆる四大人が現れた後だったのである。それ以後、神道は、真の内容を持って、世に行われるようになったのである。"

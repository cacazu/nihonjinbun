- "id": "st-0024-001"
  "section_id": "chapter-01-section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "哲學は右のやうな次第で、百般事物の根本原理の研究をするものである。百般事物と云ふからにはその研究事項が如何に廣汎であるかゞ想像される。だから之れを研究せんとするには先づ以つて之れを正確に分類して、どんな風に研究すべきであるかを定めなくてはならない。希臘の哲學者、プラートンの哲學は、辯證法、物理學、倫理學のやうに分れ、辯證法にては論理學、形而上學を研究し、物理學で精神界物質界等を研究し、倫理學で以つて人生を研究したものである。近世の學者ベーコンも亦哲學を三つとし、之れを天然哲學、人生哲學神學に分つたのである。天然哲學の中には、自然科學や、形而上學を含み人生哲學には倫理學や、政治學を入れ、神學は、天然神學、天啓神學に分つたのである.處が輓近の學者になつて、此の哲學の分類は益々複雜になつて來た。が我々は之れを認識哲學、自然哲學、人生哲學の三つに分つを最もよからうと思ふ。で自然哲學で世界觀を定め、人生哲學で人世觀を研究するのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 23
    "url": "https://dl.ndl.go.jp/pid/943657/1/24"
  "translation_ja": "以上のように、哲学は、あらゆる事物の根本原理を研究するものである。あらゆる事物というのだから、その研究範囲がどれほど広いか想像できるだろう。したがって、研究するには、まず正確に分類し、どのように研究すべきかを定めなくてはならない。ギリシャの哲学者プラトンの哲学は、弁証法・物理学・倫理学に分かれ、弁証法では論理学と形而上学を、物理学では精神界や物質界などを、倫理学では人生を研究した。近世の学者ベーコンも哲学を三つに分け、自然哲学・人生哲学・神学とした。自然哲学には自然科学や形而上学を、人生哲学には倫理学や政治学を含め、神学は自然神学と啓示神学に分けた。ところが近ごろの学者になると、哲学の分類はいよいよ複雑になってきた。しかし私は、これを認識哲学・自然哲学・人生哲学の三つに分けるのが最もよいと思う。そして、自然哲学で世界観を定め、人生哲学で人生観を研究するのである。"
  "translation_status": "reviewed"

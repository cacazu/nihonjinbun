  "translation_ja": "この禊のときに成り出た神について、『神道五部書』という本がある。伊勢の外宮に伝わったというものだが、いずれにせよ、後世の偽書とされている。この五部書の中に『御鎮坐次第記』というものがあり、次のような文句がある。「伊弉諾尊が左の目を洗われ、それによって生まれた神の名は、天照荒魂と申す。またの名は、瀬織津比咩神である」。さらに、その次には、「伊弉諾尊が右の目を洗われ、それによって生まれた神の名は、気吹戸主神、すなわち大神の分神である。ゆえに、またの名を大神の荒魂と申す」とある。この本は信用できないが、ある古伝にこのような伝えがあったものが、『古事記』に入り、三貴子の伝えができたのではないかと思われる。それで平田篤胤は、五部書は偽書といっても、一概に退けるべきものではないとする。とりわけ『御鎮座伝記』に伝えるようなことは、よく真実の趣旨に合い、決して後世の人が言い出せるような説ではなく、『日本書紀』や『古事記』の誤りさえ正し明らかにできる、たいへん優れた伝えだとして、次のように述べている。「『日本書紀』『古事記』に、鼻を洗われたとき速須佐之男尊が生まれたとある伝えは、速佐須良比売神が生まれた伝えを誤ったものである。『御鎮坐伝記』にこの伝えが残っているのは、たいへん喜ばしく、この上ない賜物である」。鼻を洗ったときに素盞鳴尊が生まれたと伝えてあるが、それは速佐須良比売神なのだというのである。そう見ると、伊弉諾尊が左の目を洗ったときに生まれた神は瀬織津比売神、右の目を洗ったときに生まれた神は気吹戸主神、鼻を洗ったときに生まれた神は速佐須良比売神ということになる。そうすると、決して三貴子がこのときに生まれたことにはならない。『御鎮坐伝記』だけを証拠として言うわけにはいかないが、それでも、この三貴子という神々が、伊弉諾・伊弉冊二尊がそろっておられる時代に誕生せず、伊弉諾尊お一人のときに誕生したという古伝は、どちらから見ても、正しい古伝とは考えられないのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "此の禊の時に成つた神と云ふのに就いて、『神道五部書』と云ふ本がある。是れは伊勢の外宮に傳つたと云ふのであるが、何れにしろ、是れは後世の僞書と云ふことになつて居る。此の『五部書』の中に『御鎭坐次第記』と言ふのがある。其の中に斯う云ふ文句がある。「伊弉諾尊左の眼を洗ひ給ふ。因つて以つて生れ給ふ。神の御名は天照荒魂と申す。亦の名は瀨識津比咩の神なり」と云ふ傳があるが、尙ほ其の次に又「伊弉諾尊が右の眼を洗ひ給ひて、因つて以つて生れ給ふ神の御名は、氣吹戶主神、即ち大神の分神に坐す。故亦の名は、大神の荒魂と申す。」斯う云ふことがある。此の本は信用が出來ないのであるけれども、或る古傳に斯う云ふやうな傳へがあつたのが、『古事記』の中に這入つて、その三貴子の傳が出來たのではないかと思はれる。それで平田篤胤は『五部書』は、僞書と云ふも、一〓に排斥すべきものでない。殊に『御鎭座傳記』に傳ふるが如きは、よく官の旨し行なく次めて從人の言は山づまじき設にて「御淫『古車記へ正し明むべき最も妙なる傳であるとなして次のやうに言つて居る『御紀、』「古車記」に御きを徒分給イ時に通道依之男尊の生まるも傳は、食神の生りませる傳を誤れるにて『御鎭坐傳記』に此の傳の殘れるはいとも〓〓歡ばしく、此上なき賜物になむありける」と。鼻を洗はれたときに素盞鳴尊が生れられたと傳へてあるが、それは速佐須良比賣、神であると云ふのである。して見ると、伊弉諾尊が左の眼を御洗ひになつた時に御出來になつた神の御名は瀨織津比會神天主の眼を御津ひになろた時に御出來にろた神の御名は主神、鼻を御洗ひになつた時に御出來になつた神が速佐須良比賣神であると云ふことになる。さうすると、決して三貴子が此の時に御出來になつたと云ふことにはならない。是れは徹頭徹尾『御鎭坐傳記』を證據として言ふ譯には行きませぬが、併しどうも此の三貴子と申す神々が、伊弉諾、伊弉冊二尊のお揃ひに御居でになる時代に御降誕にならないで、伊弉諾尊御一神の時に御降誕になつたと云ふ古傳は、どつちから見ても、正しい古傳とは考へられないのである。"

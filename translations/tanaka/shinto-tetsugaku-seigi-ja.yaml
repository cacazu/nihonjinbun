- "id": "st-0136-002"
  "section_id": "chapter-12-section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "維新以來、西洋文明が沛然として我が國に入つて來たものであるから、已に述べた通り、西洋文明の酒や煙草に醉つて來て、初めに云つたやうに頭をさがし廻はつて居る連中が、大分出來た樣に思はれる。我が固有の大道を忘れて、徒らに道を遠きに求めて居る人が大分あるやうに思はれる。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 135
    "url": "https://dl.ndl.go.jp/pid/943657/1/136"
  "translation_ja": "維新以来、西洋文明が、勢いよくわが国に流れ込んだ。そのため、すでに述べたように、西洋文明という酒やたばこに酔い、冒頭で述べた、頭を探し回る人々のようになった者が、かなり増えたように思われる。わが国固有の大道を忘れ、いたずらに、遠くに道を求める人が、かなりいるように思われる。"
  "translation_status": "reviewed"
- "id": "st-0136-003"
  "section_id": "chapter-12-section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "米國の土人、南洋の土人若くは印度人などは、皆西洋の文明を入れて、其の西洋の文明に呑まれてしまつたのである。我が國民はどうであるか。之れを歷史に見るに、我が國民は昔から印度の思想が這入つて來ても、支那の思想が這入つて來ても、皆之れを神道に於いて同化して來たのである。かくて今や西洋の思想が這入つて來たのを十分に同化して所謂第三の日本と云ふものを築き上げつゝあるのである。神道は決して佛教や基督教のやうな一つの宗教でないのであるから、彼れ等のやうに互に相排斥して遂には兄弟墻にせめぐ樣な戰爭を起すなどと云ふ不都合なことはしないのであ る。神道は包括的でさう云ふものを皆同化して行くものである。而して神道は實に進步的である。神道は決して、現世を超越した未來、現世と隔離した未來を求むるのではない。かう云ふ未來を求むる教は、とかく保守的に流れる。けれど神道は、勿論或る意味の未來を追求するも、その未來は現世に相即した未來、發展したる現世である。元來神道には一切經と云ふやうな經文がない。又基督教のやうに聖書がない。斯う云ふ經典や聖書があると、それ以外に出づることが出來ない。併し神道は事實の道である。天御中主神、天照大神の御德を受けて居る神々が、云爲行動せらるゝ所は皆神道となるのであるから、神道は最も時代に適切なる所の道である。基督教などが動、もすれば先きに述べた樣に信教の自由と云ふことを擔いで、國家が神道を保護すると言つて不平に思ふけれども、併し國家は憲法第二十八條に於いて安寧秩序を妨げず臣民たるの義務に背かざる限りに於いて信教の自由を許して居るのであるから、此の固有の大道たる神道に背いたならば、さう云ふ排他的の性質を以つて神道を排擊しやうとしたならば、詰り天に向いて唾を吐くやうなもので、自身を國外に放逐して吳れよと云ふことになつて來るのである。神道は皇祖皇宗の遺訓である。祖先の遺風である。要するに我が國の大道である。苟くも我が國民たる所の者は一日も之れを離るゝことの出來ない所の大道である。而して我が國民を天壤無窮の發展に導く所の大道である。かゝる大道の存在を忘れて、徒らに道を西洋に求むるは、彼の頭を失つた所のものと選ぶなきものである。我々は十分に、此の大道を學理的に研究し、國民をして十分に之れを體認せしめ、大いに之れが發展を計らなくてはならぬ。"

  "translation_ja": "科学については先にも触れたが、もう少し述べてみよう。今日、「科学」という言葉は非常によく使われ、科学万能とさえいわれるほどである。少し学問をすると、すぐ科学と言う。口ではよく言うが、科学とは何かを説明せよと言われると、すぐには答えられない人も少なくない。では科学とは何か。私たちは、さまざまなありさまを見て、それを知りたいと思うが、常識では満足できない。そこで常識から一歩進み、研究しようとする。それが科学である。先に述べたように、海辺の漁師は常識で判断するが、天文台の先生は天文学によって判断する。これが科学である。電車が縦横に走る。電車を作るのは、電気工学という科学である。常識でいい加減に作ったのでは、いつまでたっても動かない。トンネルを掘るのは土木工学である。常識で適当にやれと言って掘ったら、間違って、両方から掘り進んだ穴が行き違ってしまう。少しも食い違わないのは、科学を応用するからである。こういう科学は何かといえば、それほど難しいものではない。私たちの普通の知識を整理したものにすぎない。ここに事実というものがある。雨が降る、水が流れる、腹が減る、頭が痛む、眠くなる、子どもが生まれる、鳥が鳴く。これらは、すべて事実である。たくさんの事実の中から、同じ種類の事実をできるだけ多く集め、実験し、観察し、統計によって調べ、そこから得た知識に秩序を与えて、統一的に組み立てたもの、それが科学である。たとえば、人が怒る、泣く、注意を向ける、同情する。これらは、すべて人の心に関する事実である。これをたくさん集め、その状態や法則を研究して生まれるのが、心理学という科学である。雨が降る、雷が鳴る、水が凍る、火が燃えるといった物理的事実がある。それらを集め、その状態や法則を研究したものが、物理学という科学である。水は冷たくなると凍り、熱すると蒸発する。これは事実である。水は凍るというが、ひとつ実験してみようと、零度にしてみると、なるほど凍る。熱してみると、やはり蒸発する。これが実験である。しかし、実験できないものもある。地球が動くというが、これを一度止めて、それから回してみるということはできない。日食を人工的に作ってみることもできない。こうしたことは、観察によるほかない。観察とは、あるものに注意を向けることだ。たとえば、時計の打つ音を聞いていても、意識していなければ分からないが、注意して数えれば何時か分かる。これは耳で聞く場合だが、見る場合でも聞く場合でも、よく注意を向ければ、やはり観察である。このように、同じ種類の事実について実験や観察をし、さらに統計を取る。こうして確かな知識を得るのであるが、それがばらばらではいけない。観察・実験・統計の結果を一つ一つ分類し、体系的に、秩序よく総合しなければならない。これが科学である。科学というとたいへん難しそうだが、それほど難しいものではない。では、その科学と哲学はどう違うのか。心理学・物理学・医学があり、医学の中にも解剖学・内科学・外科学など、数えきれないほどの区別がある。しかし要するに、それらは私たちの目が届き、耳で聞けるところにしか及ばない。たとえば、水が凍る、湯が沸くといった事実について述べるだけで、人間とは何なのか、そうしたものが実際に存在するのか、それとも空想ではないか、といったことには、一切関わらない。それを科学よりさらにさかのぼり、水が水である理由、人が人である理由を研究する。それが哲学である。同じ事柄を見ても、哲学は一歩進んでいる。西洋には、哲学を「科学の科学」と呼ぶ人もいる。あらゆる現象を、一歩さかのぼって研究するのである。常識では満足できない私たちは、研究する人そのもの、研究されるものそのもの、その因果関係や時間・空間などを、すべて存在すると仮定して研究する科学だけでも、満足できない。ここで、哲学へ踏み込むのである。"

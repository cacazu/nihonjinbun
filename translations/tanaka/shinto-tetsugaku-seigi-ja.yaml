  "source_text": "要するに我々は、三種の神器によりて知を磨くも皮相の知に止まらず、進んで眞智を磨くに神鏡を理想とし温平たる情操を陶冶するには神璽を理想とし盤根錯節に遇つても聊か凝滯する所なきは神劍を理想とし造次顛沛、修養是れ努め、以つて自己の人格を高上せしめ、天壤無窮の國運發展てふ我が國民的大理想の實現に從事すべきを示されて居るものと解し得るのである。"

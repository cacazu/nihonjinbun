- "id": "st-0066-003"
  "section_id": "chapter-06-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "今述べた所の國常立神は、此の國土の元靈にまし〳〵て以後六代相續いて出でられたる神々と共に神世七代とせらる。神世とは神代と書けるも同一にて、神代は通俗には神武天皇以前を云ふも、普通は大己貴命が幽世顯世を分ちしにより、その以前を神代とし、以後を人代とするのである。此處は更に溯りて諾冊二神以前を神代としたのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 65
    "url": "https://dl.ndl.go.jp/pid/943657/1/66"
  "translation_ja": "今述べた国常立神は、この国土の元霊であり、その後、六代にわたって続いて現れた神々とともに、神世七代とされる。「神世」は「神代」と書いても同じである。神代とは、世間では神武天皇以前をいうが、普通は、大己貴命が幽世と顕世を分けたことから、それ以前を神代、それ以後を人代とする。ここでは、さらにさかのぼり、伊弉諾・伊弉冊の二神より前を神代としたのである。"
  "translation_status": "reviewed"
  "source_variants":

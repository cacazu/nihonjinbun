  "source_text": "それから又特に上に在る所の者は、慈愛を以つて下に臨まなければならぬと云ふ事が、神道の一つの要點になつて居る。卽ち伊弉諾尊が黄泉軍の爲に進擊せられた時に方つて桃子が能く伊弉諾尊を助けて、さうして黃泉軍を擊退した。其の時に伊弉諾尊が桃子に意富加牟豆美命と云ふ名を賜はり、さうして勅命を御下しになつて「汝吾を助けしがごと葦原中國の有ゆる宇都志伎靑人草の苦瀨に落ちて患しまん時に助けてよ」と云ふことを仰せになつて居る。即ち是れ常に蒼生を慈しみ愛し給ふと云ふことを念とせられて居るからして、さう云ふ御言葉が出るのである。又天照大神は保食神が素盞鳴命の爲に殺され給つた時に、其の身體から五穀の出たことを御聞きになつて大いに御喜びになり、「是の物どもは、うつくしき靑人草の食ひて活くべきものである」と云ふ風に仰せになつた。是れは詰り天照大神が蒼生を大いに愛撫なされたと云ふことの一端が現はれて居るのである。故井上毅氏の說の通り大國主命の國土を領せられたるは、古傳に「ウシハケル葦原の中つ國」と傳へ、天孫には「我が御子のシラサン國」と傳へてある。ウシハクは占領の意で、シラスは愛撫を以つて治めらるゝの義である。建國の當初から斯う云ふ工合であるから、古代の神聖の云爲行動し給ひし事實を以つて、規範とし君臨し給ふ我が歷代の天皇は、又厚く神祇を尊敬し給ふと同時に、深く萬民を慈しみ給ふを常と遊されたのである。で文武天皇は「此の食國天下を調へ賜ひ平げ賜ひ天下の公民を惠み賜ひ撫で賜はんとなもかむながら思ほしめさく」と詔勅の中に仰せられて居る。又後鳥羽天皇御製には、「夜を寒み閨の衾のさゆるにも、藁屋の風を思ひこそやれ」。伏見天皇御製には、「いたづらに安き吾が身ぞ恥づかしき、苦しむ民の心思へば」。詰り神道の政治の要道は上に在はす所の者は、著しく慈愛の心を以つて下に御臨みになると云ふ事である。是れは近く明治天皇の御製にも出て居る。例へば、「古の文見る度に思ふかなおのが治むる國は如何にと」。「照るにつけ曇るにつけて思ふかな我民草の上は如何にと」。斯う云ふ御製の御趣意は、歷代の天皇によりて常に發表せられた所である。又斯う云ふ事績は中〻尠くない。即ち神道の政治に於いては、上に在す者が慈愛を以つて下に臨まれると云ふことが大切であると云ふやうに現はれて居る。けれども茲に一寸申上げて置かなければならぬのは、上に在はす所の者は斯く蒼生を慈み、仁慈を重んじ給ふが、併し一旦我が秩序的、統一的思想其の他國民的精神に反抗する者があつたならば、其の場合には如何なる者と雖も直ちに之れを罰せられると云ふ事である。伊弉諾尊が三貴子の一人に在はす素盞鳴尊を御追放遊ばしたことや、又高皇產靈神が天若彥を誅し給つたことなどは、其の一の事蹟である。斯う云ふ風に我が神道の慈悲、我が神道の愛と云ふものは、盲目的の愛でない。基督教で言ふ所の愛などとは非常に違ふ。又支那などで云ふ所の兼愛などとも非常に違ふ。何でも盲目的に愛すると云ふのでない。基督教などに於いては「汝の敵を愛せよ」と云ふことがある。敵を愛するならば戰爭と云ふやうなことは出來ないことになつて來る。然るに今日基督教徒のやつて居る所を見ると云ふと、敵を少しも愛さない。愛さない所ぢやない。中々どうも慘虐に取扱つて居ると云ふ譯である。神道に於いては慈悲仁愛と云ふものを尊んで、苟も上に在る所の者は必ずそれがなければならぬと云ふことにして居るけれども、我が國民的精神に反抗する者があつたならば、直にそれを處罰するに躊躇しないのである。そこが上位に在る所の者の行ふ道である。さう云ふ風にして政治は、行はれ來つたのである。"

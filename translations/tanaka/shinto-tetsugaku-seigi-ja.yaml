  "translation_ja": "以上、「神」の意味を述べたので、進んで、わが国の伝説の最初に現れる造化の三神について述べようと思う。神道哲学の立場から、この三神をどのように解釈すればよいか、という問題である。前にも述べたように、この世界はどのようにできたのだろうかと問い、考えてみると、どうしても、誰かによって造られたに違いない、と考える人が出てくる。中国には、次のような話が伝わっている。「昔、天地はまだ分かれず、鶏卵のように混沌としていた。その中に盤古という者が生まれ、一万八千年を経て天地が開けた。日は甲子、年は甲寅で、清らかで軽いものは昇って天となり、濁って重いものは下って地となった。盤古はその中にいた」というのである。そのほか、盤古の夫婦が陰陽の始まりであるとも伝え、盤古の後に天皇氏・地皇氏・人皇氏の三皇があり、これが天・地・人の始まりだとも伝えている。また、ユダヤの古い伝承にも、神が七日間で世界を造ったという話がある。ギリシャでは、哲学によって、世界は水からできていると説く。このように、どの国民も世界の始まりについて何らかの考えを得て、その知識欲を満たそうと努めている。では、わが国民はどうか。伝説を見ると、『古事記』は冒頭に、「天地が初めて開けたとき、高天原に現れた神の名は、天之御中主神」と伝えている。こうして造化の三神が現れ、国土がまだ若く、クラゲのようであったとき、葦の芽が伸び上がるようなものから、一柱の神が現れた。それが宇麻志阿斯訶備比古遅神だと記されている。また『日本書紀』には、「天地が開けた初め、国土は、魚が水の上に遊び浮かぶように漂っていた。そのとき天地の間に一つのものが生まれた。形は葦の芽のようであった。それが神と化し、国常立尊と呼ばれた」といったことがある。さらに、別の伝えには、「天地が初めて分かれたとき、一つのものが空の中にあった。その姿は言い表せない。その中に自然と神が現れ、国常立尊と呼ばれた」とある。このように、天地は初め、どうやってできたのかという問題が、人々の頭を悩ませ、そこからさまざまな伝説が起こるのである。わが国の古い伝承では、以上のように、『日本書紀』は国常立尊を最初とするように記し、『古事記』は天御中主神を最初とする。中世の『日本書紀』が広く読まれた時代には、天御中主神と国常立尊は同一の神だと理解されていた。しかし本居宣長による『古事記』研究の後は、別の神だとする見方が一般になってきたのである。"

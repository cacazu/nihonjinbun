  "source_text": "三貴子の中で第一番目は即ち天照大神である。天照大神は日の神とも申し、又大日靈貴尊、天照大日靈尊とも申すのである。で、此の神は昔から女神であると云ふことになつて居るが、日出の帆足と云ふ人は、此の神は男の神であると言つて居る。其の說に、「聖德太子が天照皇を以つて婦人としたのである。それは高霏爾靈の御名に依つたのである。靈の字の和訓女と通ずるからである。是れは一の權宜の言葉であつて、唯、其の私を濟されたるに過ぎないのである。所が『古事記』や『日本紀』などが皆其の謬を傳へて少しも正さない。從つて此の『古事記』『日本紀』は古傳の典據とせらるゝ所であるけれども、未だ其の道を徴するに足りないのである」と言つて、天照皇を男の神であると言ふのであるが、併し此の說が一種奇體な說であつて、何れの說に見ても、又何れの古傳に徴しても、天照大神は女の神であると云ふことは爭はれないのである。"

  "source_text": "古傳は已に述べた通り神代に出來たのであるけれども、併し是れが又それから後に色々傳へられる中に、誤謬を含んで來て幾多の間違を生じて來て居る。是れは爭ふべからざる事實である。如何なる學者も是れは是認する。たとへば七代神に就いても、七代か五代になつたり、三代になりたり色々になつて居る。それから又『日本書紀』には國狹槌尊と云ふのが、國常立尊の次に出て居るが、『古事紀」には國狹槌尊と云ふのはない。それから先きに申しました御食津神を殺されたのは、『日本書紀』と『古事記』とに依つて、一方は素盞嗚尊とし、一方は月讀命としてある。それを根據として、篤胤の如きは月讀尊と素盞鳴尊とを同一の神と主張して居るのである。さう云ふやうな例を擧げて來れば幾らでもある。であるから其の古傳が徹頭徹尾一字一句違はないと云ふことは言へない。段々傳へる中に幾多の誤謬が這入つて來た。それは印刷術も起らず、文字もなかつたから-假りに無かつたと斷定して置く。これには色々議論のあるのである-隨つてそれを正確に傳へる事は到底出來ない。それは語部と云ふものがあつたと言ふが、併しそれも口から耳に傳へるのであるから、どうしても正確に傳へ得る事は出來ない。そこで幾多の誤謬が這入つて居る。其の誤謬は取捨選擇をしなくてはならない。そこで今の『古事紀』の一番初めの「獨り神成坐して身を隱したまひき」と云ふのは、書紀の所謂造化三神の傳の所には全然ないのであるから、これは誤謬であると看做して、「天地未だ生らざりし時高天原に神ましき。天御中主神、次に高皇產靈神、神皇產靈神」と、斯う云ふ事にして解釋して行けば、初めて此の天御中主神と云ふ神が無始無終の神であると云ふことが解釋の出來るのである。で篤胤の見解も、詰りは其處になくてはならぬ。篤胤の前後の說を綜合すると、さうなつて來なくてはならぬ。それでなければ論理に合はない。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 44
    "url": "https://dl.ndl.go.jp/pid/943657/1/45"
  "translation_ja": "古伝は、すでに述べたように神代にできたが、その後、さまざまに伝えられるうち、誤りを含み、多くの間違いが生じてきた。これは否定できない事実で、どの学者も認める。たとえば、七代の神についても、七代だったり五代だったり三代だったりと、まちまちである。また、『日本書紀』では、国常立尊の次に国狭槌尊が現れるが、『古事記』には国狭槌尊は出てこない。先に述べた食物の神を殺した神についても、『日本書紀』と『古事記』とでは、一方をスサノオ尊、他方をツクヨミ命としている。それを根拠に、篤胤などは月読尊とスサノオ尊を同一の神だと主張している。このような例は、いくらでも挙げられる。だから、古伝が最初から最後まで、一字一句違わずに伝わったとは言えない。伝えられるうち、多くの誤りが入り込んだ。当時は印刷術も起こらず、文字もなかったからである。文字については、いろいろ議論があるが、ここでは、ひとまず、なかったと断定しておく。したがって、正確に伝えることは、とてもできない。語り部がいたと言うが、それも口から耳へ伝えるのだから、どうしても正確には伝えられない。そのため、多くの誤りが含まれており、それを取捨選択しなくてはならない。今の『古事記』の最初にある「独り神として現れ、身を隠した」という句は、『日本書紀』の、いわゆる造化の三神の伝えにはまったくないのだから、これを誤りと見て、「天地がまだ生まれていなかったとき、高天原に神がいた。天御中主神、次に高皇産霊神、神皇産霊神」と解釈していけば、初めて天御中主神を、始まりも終わりもない神として理解できる。篤胤の見解も、結局はそこに至らなくてはならない。篤胤の前後の説を総合すると、そうならなくてはならず、そうでなければ論理に合わないのである。"

  "source_text": "三貴子に就いては、古傳が實に樣々になつて居るのである。が、要するに三貴子が御出來になると云ふと、伊弉諾、伊弉冊二尊は、此の國土經營のことは一切三貴子に御託しになつて、伊弉冊尊は黄泉國に御歸りになり、伊弉諾尊は日之少宮に御退きになつたのである。抑も三貴子と申すのは天照大神と月讀命及び素盞鳴尊の三神を申すのであるが『古事記』に依ると、伊弉諾尊が筑紫の阿波岐原で、禊をされた時に、眼を御洗ひになつた。左の眼を御洗ひになつた時に、天照大神を御生みになり、右の眼を御洗ひになつた時に、月讀命を御生みになり、鼻を御洗ひになつた時に、素盞鳴尊を御生みになつた、斯う云ふことになつて居るのである。併しながら、此の事に就いて前に一言したやうな工合に、吾々はどうも神道の立脚地より、此の古傳を採るのは、甚だ如何であらうかと思ふのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 74
    "url": "https://dl.ndl.go.jp/pid/943657/1/75"
  "translation_ja": "三貴子については、古伝は実にさまざまである。しかし、要するに三貴子が生まれると、伊弉諾・伊弉冊二尊は、国土経営のすべてを三貴子に託し、伊弉冊尊は黄泉国へ帰り、伊弉諾尊は日之少宮へ退かれた。そもそも三貴子とは、天照大神・月読命・素盞鳴尊の三神をいう。『古事記』によると、伊弉諾尊が筑紫の阿波岐原で禊をされたとき、目を洗われた。左の目を洗ったときに天照大神、右の目を洗ったときに月読命、鼻を洗ったときに素盞鳴尊を生んだ、ということになっている。しかし、このことについては、前に少し述べたように、神道の立場から、この古伝を採用するのは、たいへん疑問だと私たちは思うのである。"
  "translation_status": "reviewed"

  "translation_ja": "祓と禊が、秩序と統一の精神から生まれたように、快活で現世を重んじる精神を著しく表す儀式は、神楽である。『大日本史』には、「音楽の起こりは、おそらく伊弉諾尊が伊弉冊尊と『あなにえや』と歌を交わされたことに始まり、天鈿女命に至って、歌と舞が初めて整い、祭祀に音楽を用いることは、ここに起こったのである」と書かれている。斎藤彦麿という人が、神楽について書いたものを見ると、「天照大神が天の石屋の戸を閉め、こもられたとき、天宇受売命が日陰のかずらをたすきとし、手に笹の葉を持ち、乳房をあらわにして、滑稽な演技をしたことが、『古事記』『日本書紀』にある。これが始まりで、朝廷には内侍所の御神楽がある。これは身分の低い者には、のぞいて見ることもできないから、詳しくは知らない。その趣は、そこで歌われる歌が世に伝わっているものの、節回しは身分の低い者には分からない。いま、諸神社で行う神楽は、猿楽の狂言のようであり、壬生寺の踊りに等しい」と書いてある。『神道名目類聚抄』には、この内侍所の御神楽について、「御神楽は、十二月の吉日を選び、内侍所で奏される。一条院の御代から行われ、隔年だったものを、長保年間から毎年行われるようになった。また、内侍所の修理などで、神を移した後には、三夜の御神楽がある」と書かれている。このように、神楽は昔から、わが国で行われてきた。それは、快活で現世を重んじる感情を、最もよく表すものと思われる。そのほか、『持統天皇紀』には、「公卿と百官が並び、順々に拝んで、手を打つ」とある。神前で手を打つことを儀式とするのも、ほかの国では、あまり聞かないことであり、わが国の、現世を重んじる快活な感情が、こうした点にも現れたものと思われる。また、祈年祭は、古来、毎年二月四日に、大神宮をはじめ三千百三十二座の神霊を祭り、豊年を祈る祭りである。その精神に至っては、まったく、わが国民の発展し膨張する性格を表すものと思われる。それは、祈年祭の祝詞に明白に書かれている。どこまでも発展し、どこまでも膨張するというのである。そのほか、神道では祈祷をし、いわゆる祭りをする。祭りは、中国の言葉で祭祀という。祀は祭と同じ意味で、祭はすなわち「際」、神と人が接する意味だという。わが国の「まつり」は、すでに述べたとおり、服従の意味であり、一説には、待つという意味ともいう。要するに、祭りは、私たちの胸にある、神々への敬虔な態度を表すことにほかならない。ただ、この祭祀には、祈り、感謝、あるいは根本に報い、始めを顧みるという意味が含まれている。天の石屋の戸の祭りは、祈りである。今上陛下が先年行われた即位の大礼でも、その中に大嘗祭がある。大嘗祭は、つまり新嘗祭の一種で、天皇陛下が在位中に一度行われる、最も大きな新嘗祭である。新嘗祭は、神への感謝の意味を持つ。そのほか、どの祭祀にも、神に祈り、神に感謝する意味がある。これは、やはり私たちのいう宗教的なものである。しかし、決して仏教やキリスト教のような宗教的なものではない。仏教やキリスト教でも祈るが、その根本の趣旨は、死後、天国に生まれることを祈るのである。それ以外のことは、彼らの教理の立て方から見れば、その祈りにおいては無意味になる。現世を穢土とし、富める者は天国に生まれられないといっておきながら、商売繁盛を祈れば、矛盾といわなければならない。戦勝も同じである。戦勝などは、明らかに修羅道に落ちる罪であり、「汝の敵を愛せよ」という教義に反するといわなければならない。それだけでなく、ヨーロッパの大戦争では、イギリスの国王は、天帝に戦争の勝利を祈られただろうが、ドイツの皇帝もまた、ドイツの勝利を祈られただろう。キリスト教では神は唯一神だというから、一つの神が、イギリスからはイギリスが勝つように、ドイツからはドイツが勝つようにと祈られるのである。神は、どちらを勝たせればよいのかということになり、たいへん迷惑するだろうと思われる。ところが、神道で祈るときには、そのような不都合は起こらない。神道の神は、わが国民を守ってくださる神々、私たちの祖宗の神々である。その祖宗の神々に祈ること、戦勝を祈ることは、当然なのである。キリスト教徒などは、何かとあれこれいうが、その議論は、まったく当たっていない。また世間では、日本は信教の自由を認めているのに、朝廷が官幣社、国幣社といって神社を祭るのは、少し矛盾するではないか、といいがちである。しかし、これは、神道を彼らと同じような宗教と見るから、そのような間違いが生じる。もちろん神道にも、いわゆる神道十三派といって、宗教と見られる教派はある。しかし、国家も、それは宗教局で扱い、その教師を国家の官吏とせず、その教院がどれほど大きくても官国幣社とはせず、神社局で扱うものとは、まったく区別している。二つを混同してはならない。純神道は、決して、仏教やキリスト教などの仲間に入るものではない。キリスト教徒などが、疑いの目で見る必要はないのである。神道は、キリスト教や仏教のような宗教の立場から見れば、宗教以上である。「以上」というと語弊があるかもしれないが、「大きい」といえば適切だろう。これらの宗教より、さらに大きな道なのである。これらの宗教は、前にも述べたように、非常に疑い深い性質を持つ。ユダヤの神は、「お前は、私の目の前で、私のほかに何者も神としてはならない」といっている。そうならば、陰で拝むのはよいかもしれないが、目の前で、ほかの何者も神としてはならないという、非常に嫉妬深い神である。仏教やキリスト教は、すべて疑い深いため、仏教でも、ほかの宗派を激しく排撃し、いわゆる不倶戴天の敵として見る。仏教は同じ釈迦の教えなのだから、十三宗五十八派に分かれず、ともに一つになって、これを仏陀宗とすればよいと思う。仏教は和合を説き、慈悲を説き、来世の極楽を説いて教えるのだから、この世の事柄は、思いやりをもって仲よく進めてよさそうなものである。ところが、非常に排他的である。神道はそうではない。仏教でもキリスト教でも、あえてとがめない。わが国の仏教徒が、肉を食べ、酒を飲み、家族生活を営むのは、インド仏教の本旨からいえば、戒律を破る放埒な行いともいえるだろう。しかし、これは、仏教がわが国に入り、わが国民性に同化した結果であり、それによって、よく今日まで命脈を保てたのである。このように神道は、これらが自分に同化してくれば、とがめない。とがめないどころではない。同化した仏教は神道といえ、同化したキリスト教は神道といえる。つまり神道化したものなのである。要するに神道は、仏教やキリスト教以上のものである。対等なら、互いに排斥もしようが、それ以上のものだから、仏教とキリスト教が互いを敵視するようなことはない。"

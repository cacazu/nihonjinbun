    "source_sequence": 131
    "url": "https://dl.ndl.go.jp/pid/943657/1/132"
  "translation_ja": "神道は、神を敬い、祖先を崇める道である。皇祖皇宗の遺訓を守る道である。天御中主神や産霊神を敬うのも、つまり、私たちの大いなる祖先、世界の大いなる祖先としてのことであり、宇宙の本体、生命を生み、発展させる根源の神としてのことである。要するに、神道は、神を敬い、祖先を崇める道である。したがって、わが国の教育、とくに初等教育では、その考えを十分に行き渡らせなければならない。そのため、生徒を引率して神社に参拝させることも、きわめて必要である。こうした敬神崇祖の教育に、あれこれ異論を唱えても、何の価値もない議論なのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "神道は、敬神崇祖の道である。皇祖皇宗の遺訓を遵守するの道である.天御中主神を崇敬するも亦、產靈神を崇敬するも、つまり我々の大祖世界の大祖としてやある。宇宙の本體で、生々發展の元始の神としてヾある。要するに神道は敬神崇祖の道である。從つて我が國の〓育、殊に初等〓育に於いては、大いに敬神崇祖の觀念を徹底せしめなくてはならぬ。之れが爲に生徒を引卒して神社に參拜せしむるも極めて必要である。かゝる敬神崇祖の〓育に、彼れ此れ異論を唱ふるも、何等の價値のない議論である。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0132-005"
  "section_id": "chapter-12-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "試に思へ。我が國普通教育の本旨は何れにあるかと。勿論そは種々の方面より第二の國民の陶冶にある事は言を俟たない。けれどもその根柢は、道德教育、國民教育にあるは、昭々として法令の示す所である。而して道德教育は何に準據して行ふべきであるか。儒教か、あらず。佛教か、あらず。基督教か、あらず。實に教育に關する勅語である。而して國民教育は、何を標準として行ふべきか。是れ亦帝國憲法なること辯を待たずして明白である。帝國憲法は、已に述べた通り、明治天皇が、發布の際に、皇祖皇宗の遺訓を明徴にし、典憲を成立し、條章を昭示すと云ふ御聖旨を宣ひたるによりて、皇祖皇宗の遺訓なることは彰明較著である。又、教育勅語が、皇祖皇宗の遺訓にして、祖先の遺風なる事は、本文に宣ふ所である。果して然らば、此の憲法此の勅語、拳々服膺せしめ、道德教育、國民教育を十分に行はんが爲には先づ皇祖皇宗及び祖先を崇敬せしめなくてはならない。父母の教訓を十分に守る孝子は、必ずやその父母を崇敬する者でなくてはならぬ。主人の命令を忠實に奉ずる僕婢は、決してその主人を侮蔑するものに見出されない。理は之れと同じく、皇祖皇宗を崇敬せずして、單にその遺訓のみを遵守尊奉すると云ふも誰れか信ぜんやであ る。祖先を崇敬せずして、單にその遺風のみを顯彰すと云ふも誰れか信ぜんやである。されば苟くも我が國民たるものは、十分なる赤誠を以つて皇祖皇宗及び祖先を崇敬しなくてはならないのである。十分なる赤誠を以つて皇祖皇宗及び祖先を崇敬せんとするには、我が國固有の神社を崇敬祭祀すべきである。實に神社は、往古より我が國民が、十分なる赤誠を以つて皇祖皇宗及び祖先を崇敬祭祀せんが爲に造りたる所のものである。だから我が國の普通教育を徹底的に行ひ、道徳教育、國民教育の十分なる效果を擧げんには、是非とも敬神崇祖の觀念を普及せしめなくてはならない。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"

  "translation_ja": "同じ日本人といっても、理性に傾く人もいれば、感情に傾く人も、意志に傾く人もいる。そのため、日本固有の伝説の研究にも、武士道的、心学的、純粋に歴史的、神話学的というような、さまざまな区別が生まれる。しかし私たちは、神道としての研究、なかでも惟神神道としての研究が、知・感情・意志に関わる私たちの求めに最もよく応じると認めて、神道の方面から研究を進めたい。そして、それを、神道哲学の完全で体系的な組織の根底に据えたいのである。"

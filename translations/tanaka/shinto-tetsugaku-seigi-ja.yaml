  "source_text": "尙、是れに就いて西洋の說を少し考へて見ると西洋でライブニッツと云ふ人が、希臘のデモクリトスと云ふ人の原子論即ち宇宙と云ふものは小さい原子から出來て居るのであると云ふ說に基いて、ごく神秘的な單子の說と云ふものを唱へた。ライブニッツの說で見ると云ふと、此の單子と云ふものは極く神靈的のものであつて、永久に活動して居る。詰り無始無終の活動である。斯う云ふ風に見るのである。此の說で見ると云ふと、此の單子其の物を神皇產靈神と見て、さうして其の單子の無始無終の活動其ものを高皇產靈神と見る。斯う云ふやうに見れば、矢張りさう云ふ說とも似通つて來るのである。詰り私の主張は宣長篤胤二翁の說と同じやうに、萬物の出來て來るのは此の高皇產靈神神皇產靈神の御德に依ると云ふのであるけれども、其の意義が違つて居るので宣長篤胤二翁などは、此の高皇產靈神、神皇產靈神が萬物を造られた、萬物を鎔造せられた、或は御產みになつたと言はれる。けれども古傳に依つて見るに、伊弉諾尊伊弉册尊が色々の神々を產まれたと云ふやうなことは書いてあるけれども、此の高皇產靈神、神皇產靈神が色々の神々を產まれ、又色々の物を造られたと云ふやうなことは、一つも現はれて居ない。であるから詰り斯う云ふやうな說は、二翁などの一種の解釋と見て宜しい。二翁などの一家の言と見て宜しいのである。宣長、篤胤二翁は、前に述べたやうに、此の高皇產靈神、神皇產靈神が漸次萬物を造られたと言ふ。其の證據は前に揚げた顯宗天皇『紀』の阿閉臣事代の受けた託宣である。けれども若し天地鎔造の證據になるやうな託宣ならば、阿閉臣事代と云ふやうな、あまり尊くもない官吏に御下しにならないで、もつと立派な方に其の託宣の下さるべき筈であらうと思ふ。又さう云ふ大事な託宣であるならば、何も任那の國に出かけて往く時などに御下しにならないで、朝廷に奉仕して居る間に御下しになつたら宜しからうと思ふ。"

  "section_id": "chapter-06-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "然るに篤胤の門人に下總國の高岡康則と云ふ人があつたが、此人は西洋の創造說を參酌して、さうして是れ等の神々に就いて、「康則畏み〳〵も按ふるに、國土の初めと神々の初めとの形に當て負せ奉るべきものではない」と云つて居る。著者は、國土の初めと神々の初めとの形に當てゝ、仰せ奉つた御名であると云ふのであるけれども、康則はさうではないと云ふ。是れは「直に產靈の大神の伊弉諾、伊弉冊二柱の神を作り出で給はんとして、彼の國土となるべきものの初め、詰り初泥砂泥爲して居る其の泥の極く精しきものを取つて伊弉諾尊と伊弉冊尊との御形像を造り初め給へるを云ふのである。即ち產靈神が此の伊弉諾尊、伊弉冊尊を御造りになり、その御造になるによりて神體の出來るまに〳〵その御名を申上たのが即ち七代の神の御名である。」斯う云ふ工合に言つて居るのである。そこで篤胤は、此の高岡康則の說を以つて、是れはどうも委しい考であつて、如何にもさう云ふ工合に聞える。此の說には從ふべきであると言つて、康則の說を是認して居る。是れはとりもなほさず西洋の神がアダム、イブを造つて、さうしてそれに息を吹込んだと云ふやうな說があるのでさう云ふ說に依つて立てたものと思はれる。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 69
    "url": "https://dl.ndl.go.jp/pid/943657/1/70"
  "translation_ja": "ところが、篤胤の門人に、下総国の高岡康則という人がいた。この人は、西洋の創造説を参考にして、この神々について、「康則、畏れながらよく考えるに、国土の初めと神々の初めの形に当てて捧げた名ではない」と言っている。著者は、国土と神々の初めの形に当てて捧げた名だと言うのだが、康則はそうではないと言う。「産霊大神が、伊弉諾・伊弉冊の二柱の神を造り出そうとして、国土となるものの初め、つまり初めの泥ができている、その泥のごく精妙なものを取り、二尊の姿を造り始められたことをいうのである。産霊神が二尊を造り、その身体ができるにつれて名を申し上げたのが、七代の神の名なのである」。このように述べている。篤胤は、この高岡康則の説を、詳しく考えられたもので、いかにもそのとおりに聞こえ、この説に従うべきだと言って、是認している。これはまさしく、西洋の神がアダムとイブを造り、息を吹き込んだというような説に基づいて、立てたものと思われる。"
  "translation_status": "reviewed"

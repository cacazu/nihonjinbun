  "source_text": "吾々が日常見る所の、机なら机、本なら本、時計なら時計、何でも其の一つの道具が出來るのは、吾々が造るのである。人間が造るのである。獨りでに出來ると云ふ事はどうもないやうである。それは獨りでに出來ると言へば言へない事もないやうなこともあるけれども、併し多くの吾々の必需品は、家屋にしても、衣服にしても、其の他の日常の調度品でも、皆誰れかゞ造るのである。斯う云ふ考を起して進んで見ると、矢張り此の天地も誰れかゞ造るのではないかと云ふ工合になつて來る。是れは誰れかゞ造つたに違ひないと云ふやうになつて來る。そこで以つて基督教では、神が七日間に之れを造つたのであると云ふやうな說を傳へて居る。我が神道に於いてもさう云ふ考が學者の中に起つて來る。そこで『古事記』や『日本書紀』をさう云ふ眼を以つて解釋して行かうと云ふ學者が出て來る。即ち本居平田二翁などは、其れである。本居宣長は此の世界を以つて高皇產靈神、神皇產靈神が造られたのである。即ち此の天地を初め、有りと有らゆる萬物は皆高皇產靈神、神皇產靈神が造られたのである。斯う云ふ具合に言つて居られる。けれども古傳を調べて見ると云ふと、伊弉諾尊伊弉冊尊が國を產み、島を產み、山を產み、河を產み、日の神を產み、月の神を產むと云ふやうなことは、皆書いてあるけれども、高皇產靈神、神皇產靈神が天地を造り、而して萬物を造られたと云ふやうなことは、一つも無い。全く無い。然るにどうもそこに高皇產靈神、神皇產靈神が天地を造られたと唱へるのには、何か其の證據がなければならぬ。そこで其の證據として本居宣長や、平田篤胤は、日神月神の託宣なるものを擧げて居られる。"

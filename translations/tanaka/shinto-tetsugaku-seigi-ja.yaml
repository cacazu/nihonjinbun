  "kind": "paragraph"
  "origin": "source"
  "source_text": "我が固有の傳說は、その端を神の觀念を以つて發して居る。而して或る意味より云へば、我が傳說は今日に於いて活躍し、無限の生命を以つて發展し、その內容は全く神の活動の歷史とも云はるゝのであるから、傳說を根柢として研究する所の神道哲學の研究は、先づその神なるものゝ解決より初めなければならぬ。そこで神と云ふ言葉はどう云ふ意味を有つて居るのであるか。と云ふ問題になつて來ると、昔から學者の間に色々の解釋の仕方がある。或は神を以つて鏡若くは鑑と云ふ風な言葉の約りとして解釋しやうとする學者がある。例へば忌部正通と云ふ人は、カミはカムガミの略語であつて、カヾミと云ふのも詰り此のカンガミから出て來て居るのである。そして其の意味は神慮は明鏡の萬物を照すが如くに、一法を捨てず、一塵を受けないのであると云ふ樣に解釋して居るそれから僧契沖は之れを以つて、鏡の略語として居る。カガミの中のガの字の畧されたのであると主張するのである。それから谷川士清と云ふ人は、之れを以て明見のアの字の省かれたのであると解釋して、神明の照臨ましますから斯う云ふ名が出たのであると云ふ意味に解釋したのである。さう云ふ風に國語學者の方から解釋を下して居るのと同樣に、又支那流の解釋を下さうとして居る者もある。即ち支那流と云ふのは、支那では德は得なり、仁は人なり、義は宜なり、天は顛なりと云ふ風に、音の近きものを以つて解釋して行かうと云ふのである。斯う云ふ樣な解釋を取つて來て、さうして神の言葉を解釋して見やうと云ふのが、儒者の方の說である。其の一二の例を言ふて見ると、貝原益軒は「神は上なり」と言つて居る。さうして、カガミのガの字を畧されたと云ふ說があるが、それがわるいと云ふことは『直指抄』と云ふ本にも見えて居る、鏡の未だ出來ない時、旣に神の名はあつたのである、此の上の字の正訓を取らないで、鏡を取つて附會する、すべて斯う云ふことは僻事であると云ふのが、益軒の說である。それから伊勢貞丈も亦此の解釋を取つて、神をカミと言ふは上である。尊ぶべきものなる故、上に在します名にて、カミと云ふのである。斯う云ふ解釋を取つて居る。それから新井白石のも亦此の類の見方である。白石の說で見ると、神と云ふのは人である。我が國の俗、何でも尊ぶ所の人を呼んで神と云ふのである。古今の言葉は同じであるから、此の神と云ふのは尊稱の意味に取れる。今の文字を借りて用ひるものだから、或る時には神と記し、或る時には上と記すやうな別が出來た。昔は唯、何れにもカミと言つたのである。斯う云ふ學者の說は、皆神と云ふ字を上と云ふ意味で解釋して行かうと云ふのである。"

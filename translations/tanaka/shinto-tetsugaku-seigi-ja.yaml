- "id": "st-0063-001"
  "section_id": "chapter-05-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "本居宣長は、天は即ち高天原であると解釋し、進んで高天原を解し「高とは是れも天を云ふ稱にて、たヾ高き意に用ひたのとは、いさゝか違つて居る、日の枕詞に高光と云ふも天照と同じ意高御座も天の御座と云ふので虛空を高とのである。原とは廣く平らなる處を云ふ。海原、野原、河原、葦原などの樣である。そこで天を天原とは云ふのである。それに高と云ふ言葉を添へて、高天原とは、此の國土より云ふ事である」と說き、更に進んで「天は虛空の上にあつて、天神だちのまします御國である」と云ひ、尙「天は即ち高天原なれば、實形ある事云ふも更なり、仰ぎ見て見えざるは、たド遠き故に眼の及ばないからである」と說いて居る。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 62
    "url": "https://dl.ndl.go.jp/pid/943657/1/63"
  "translation_ja": "本居宣長は、天は高天原であると解釈し、さらに高天原を解いて、こう説いている。「高とは、これも天をいう呼び名で、ただ高いという意味に用いたものとは、少し違う。日の枕詞である高光も、天照と同じ意味であり、高御座も天の御座という意味なので、空を高と呼んだのである。原とは、広く平らなところをいう。海原・野原・河原・葦原などと同じである。そこで天を天原といい、それに高という言葉を添えた高天原は、この国土から見ていう呼び名である」。さらに、「天は空の上にあり、天神たちのおられる御国である」といい、また、「天は高天原なのだから、実際の形があることは言うまでもない。仰いでも見えないのは、ただ遠くて目が届かないからである」と説いている。"
  "translation_status": "reviewed"

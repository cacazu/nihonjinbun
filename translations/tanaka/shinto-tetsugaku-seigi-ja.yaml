- "id": "st-0076-003"
  "section_id": "chapter-07-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "『日本書紀』の一書には、伊弉諾尊敕して、「月讀尊は滄海原の潮の八百重を治せ」と宣はつたと傳へ又一書には「素盞鳴尊は滄海原を馭せ」と敕せられたと傳へ『古事記』も亦建速須佐之男命にのりたまはく、「汝命は海原を知らせと事依たまひき」と傳へて皆同一の所を知らせと傳へて居る樣である。又保食神即ち大氣津比賣を殺し給ひし神を『書紀』は月夜見尊とし『古事記』は、須佐之男命として居る。その他、月夜見の夜見は黄泉にて、黄泉は須佐之男命の趣き給ひし所と傳へて居るのである。こんなことから、本居宣長は、此の二神は一神ならずやと疑つたのである。その門人服部中庸は、師宣長の說より一步を進め、「須佐之男命と申すは、月讀命の一名なるがまぎれて別神の如く云つたから、彼れと此れと二つになつた。が元來一神である」と、その著『三大考』に說いて居る。平田篤胤は、更に語勢を强めて之れを一神として居る。蓋し篤胤は、『書紀』に「日月既生」などゝあるを以つて、日神、月神とし、天照大神を以つて太陽の主宰神とし、素盞鳴尊を以つて月球の主宰神と主張したものだから、當然の結論として二貴神說に逢着したのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 75
    "url": "https://dl.ndl.go.jp/pid/943657/1/76"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 76
    "url": "https://dl.ndl.go.jp/pid/943657/1/77"
  "translation_ja": "『日本書紀』のある一書には、伊弉諾尊が「月読尊は、広い海原の、幾重にも重なる潮を治めよ」と命じたとあり、別の一書には、「素盞鳴尊は海原を治めよ」と命じたとある。『古事記』にも、建速須佐之男命に、「汝は海原を治めよ」と命じたとあり、どれも同じところを治めよと伝えているようである。また、保食神、つまり大気津比売を殺した神を、『日本書紀』は月夜見尊とし、『古事記』は須佐之男命としている。そのほか、月夜見の「夜見」は黄泉であり、黄泉は須佐之男命が向かったところだと伝えている。このようなことから、本居宣長は、この二神は一柱の神ではないかと疑った。その門人、服部中庸は、師の説をさらに一歩進め、「須佐之男命というのは月読命の別名だが、それが紛れて別の神のように言われたため、二つになった。しかし、もとは一柱の神である」と、著書『三大考』に説いている。平田篤胤は、さらに強い言い方で、これを一柱の神としている。篤胤は、『日本書紀』に「日月がすでに生まれた」などとあることから、日の神・月の神と考え、天照大神を太陽の主宰神、素盞鳴尊を月の主宰神と主張した。そのため、当然の結論として、二貴神説に行き着いたのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "『日本書紀』の一書には、伊弉諾尊敕して、「月讀尊は滄海原の潮の八百重を治せし宜はったと傳ヘ又一書には宗素時付は得生産『古事記』も亦建速須佐之男命にのりたまはく、「汝命は海原を知らせと事依たまひき」と傳へて皆同一の所を知らせと傳へて居る樣である。又保食神即ち大氣津比賣を殺し給ひし神を『書紀』は月夜見尊とし『古事記』は、須佐之男命として居る。その他、月夜見の夜見は黄泉にて、黄泉は須佐之男命の趣き給ひし所と傳へて居るのである。こんなことから、本居宣長は、此の二神は一神ならずやと疑つたのである。その門人服部中庸は、師宣長の說より一步を進め、「須佐之男命と申すは、月讀命の一名なるがまぎれて別神の如く云つたから、彼れと此れと二つになつた。が元來一神である」と、その著『三大考』に說いて居る。平田篤胤は、更に語勢を强めて之れを一神として居る。蓋し篤胤は、『書紀』に「日月既生」などゝあるを以つて、日神、月神とし、天照大神を以つて太陽の主宰神とし、素盞鳴尊を以つて月球の主宰神と主張したものだから、當然の結論として二貴神說に逢着したのである。"

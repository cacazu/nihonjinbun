  - "kind": "ocr"
    "text": "希臘のアリストテレースの言葉の通り、「人は社會的生物」であつて先天的に社會を爲して生活して行くと云ふ傾を有つて居るのである。それでハイドと云ふ人なども言つて居る。「人間は自ら社交的の生物であつて、社會を離れては人間は既に人間でない。若し自ら喜んで一人で居るものがあるとしたならば、其のものは猛獸か、さもなくば神である。人間が他人との關係に依つて出來てくる所の總べてのものを人間から取り去つてしまふならば、是れ同情とか、愛とか、信仰とか、感謝とか、勇氣とか云ふやうなものを、一切取り去つてしまふので、詰り人間は正しく禽獸の中に這入つて行くものである」。斯う云ふやうな見解は西洋人の見解であるが、誠に正しい見解であつて、人はどうしても共同生活と云ふものを離れては生活することは出來ない。共同生活に依つて初めて我々は此の世に生れ、此の世に成長し、此の世に生存することが出來るのである。さう云ふ共同生活をすると云ふと、一個人の我儘勝手の行と云ふものは許されない。朝、起きる時には起きなくてはならぬ。夜、寢る時には寢なくてはならぬ。御飯を食べる時には食べなくてはならぬ。禮服を着る時には、之れを着なくてはならぬ。共同生活を爲して居る所の各人が各〓個々別々の生活を爲すと云ふことは許されないのである。共同生活と云ふものに我儘放題を許されないと云ふのは、詰りそこに何か人の據らなければならぬ所のものがあるからである。共同生活には我々の行を律して行く所のものが出來てくるからである。其のものは要するに一個の家で言へば家風と云ふものになり、又一〓で言へば〓風と云ふものになり、學校などで言へば、校風と云ふものになり、國家に就いて言へば國風と云ふやうなものになつて來るのである。であるから人が養子に行き、又は嫁に行つて、其の家の家風に服從しないと云ふと、其の家に居ることは出來ないやうになる。又他の〓に行つて、其の〓の風に從はなかつたならば、其の〓に生活する事は出來ない。〓に入つては〓に從はなければならぬ。一つの學校に入學したならば、其の學校の校風に從はなければならぬ。其の學校の校風に反抗するならば、直に退學されてしまふ。一つの國民となれば、其の國家の國風と云ふものに從はなければならぬ。其の國風に反抗すれば、其の國家の一員となつて生存する事は出來ないのである。斯う云ふ國風と云ふものは、何れの國にもあるのである。さうして其の國風は何れの國に於いても奬勵發達することを努められて居る。若し其の國家の特殊の國風と云ふ者が衰へて來たならば其の國家は其の時に其の存在の理由を喪失するのである。手短に云へば滅亡するのである。歷史に就いて見ても、昔スバルタと云ふ國が希臘にありて非常に强い國であつた。甞ては波斯侵入の百萬の軍隊を、僅かに三千の兵を以つて邀へ擊つと云ふ風に强い國であつた。是れと云ふも詰りスパルタの國風が極めて健實であつて、勇壯であつたからである。けれども一朝此の國風衰へて、彼れ等國民は皆利己のみを事とすると云ふ風になつて來た時には羅馬の僅かな軍隊の馬蹄の下に蹂躙されてしまつたのである。其の羅馬と云ふ國も亦その固有の剛健質實な國風を維持して居る際には、非常に隆盛に赴いて、羅馬人は「羅馬の滅亡は世界の滅亡である」と誇つたのである。けれども後殖民地より澤山の金銀財寶を吸收して、さうして國民が奢修贅澤に流れて、昔からの勤儉質實なる國風と云ふものを失つてしまふと、直に北方の蕃族の爲に蹂躙されてしまつたのである。さう云ふ工合に國風と云ふものは、其の國家と非常に密接なる關係を有つて居るのである。そこで獨逸が世界の大亂を惹起して、さうして世界の列强を相手にして久しく屈しなかつたと云ふのは、詰り獨逸國民が十八世紀の頃からして、此の獨逸の國風と云ふものの養成に努めて、或は國史を奬勵して愛國心を養ひ或は身體の鍛鍊を努め以つて國家的〓育を興隆し、獨逸國風を作つた爲である。獨逸が世界の强國を相手にして、頑强に戰爭したのは、決して彼れ等が基督〓徒であるからではなくして、此の獨逸の國風、即ち獨逸の國民的精神を有して居たからである。けれどもそれはあまりに粗製品であつた。爲に獨逸もとう〓〓あの始末になつたのてある。我が國に於ては斯う云ふ國風と云ふものは、獨逸が十八世紀から作り出したやうな、又羅馬に甞て在つて幾くもなくして羅馬國民が之れを失つたやうな、或はスパルタ國民が之れを有して居つて、而して暫時にして失つたやうな、極めて薄弱なる淺薄なる國風でないのである。我が國に於いては建國以前からして、此の國風即ち一般に謂ふ所の國體なるものが存立して居つて、さうしてそれに依つて建國もせられそれに依つて國家も維持發展されて來たのである。其の國風或は國體と云ふものは何であるかと云ふと、即ち神道の發現である。神の道の發現である。此の神道は我が國民の有して居る所の國民的精神の精を體し華を集められて居る所の神々が云爲行動せられた其の跡に依りて養成せられ、發展せられて行く所のものである。而して此の國風即ち國體の最も根柢を築き上げられたのは已に述べた通りに天照大神である。天照大神は天壤無窮の神勅を御下しになると同時に又三種の神器を御下しになつたと云ふことも前に述べて置いた。そして此の三種の神器を御授けになつた所の御趣意は、我々には分らない。併し賴山陽の說のやうな工合に、我々が此の事績に就いて考へて見ると、深遠なる意味が其の間に具つて居るやうに思はれる。此の事も前に述べて置いた。更に一步を進めて論ずると、我が國民の有して居る國風の要素、卽ち國民的精神と云ふものを、前に三種に分つて述べたが其の國民的精神の秩序的、統一的思想の發達の極致は、此の神鏡に依りて示され、現世的、快活的感情の發達の極致は神璽に依りて示され、發展的、膨脹的性格の發達の極致は神劍に依つて示されて居るやうに思はれる。其の極致と云ふものは遂に歸して一となるのである。此の極致の歸して一となつた所のものが即ち大極致と云ふべきものである。其の大極致と云ふものは即ち神勅に示れて居る所の天照大神の御精神である。天照大神の御精神と云ふのはどうかと云ふと、即ち天壤無窮の國運發展と云ふ事である。何處迄も發展である。無限の發展である。天地と窮りなく發展するのである。發展の上に更に發展すると云ふのが、此の天照大神の大御精神である。それであるから歷代の天皇は此の天祖天照大神の始め給ひ、又行ひ給ひ、示し賜つた所の洪範に依つて、さうして政治を爲して御居でになるし、又歷代の臣民は八百萬の神々が天祖の御〓に從つて云爲行動して來た其の事績に從つて云爲行動して、さうして此の大極致大理想に向つて進んで居るのである。此處が神道の神道たる所以である。"

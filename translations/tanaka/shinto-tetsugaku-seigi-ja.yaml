- "id": "st-0131-005"
  "section_id": "chapter-12-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "神道は偉大いなる道德である。勿論、佛教も、基督教も、倫理的要素を包含して、道徳として幾多の價値を有して居るも、神道には及ばない。元來、道徳は人と人との關係で、君臣、父子、夫婦、兄弟、朋友等の關係を律する所のものである。處が、天の父を重しとし、君臣父子の關係を輕ろしとし、或は妻子の鍾愛を絕たなくてはならぬ。又は阿彌陀如來の前には、神棚、注連繩等をも認めないと云ふ風な主義になつて來るとその道德も徹底しない。少くとも國民道徳としては徹底しない.そこで國家が運命を賭して戰爭して居る際に非戰論を唱へたりなど、とんだ事をし出すのである。社會主義的思想も、やゝもすればかゝる思想の間に養成せらるゝのである。而して道德はどこまでも實行を尊ぶので、如何に名論卓說でも實行せらなければ何等の價値はない。眞に机上の空論である。神道はどこまでも國家主義で進み、家族本位で進み、忠孝一本主義で進むのであるから、道德としても、きび〳〵と徹底して行くのである。即ち道德としても實に偉大なものである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 130
    "url": "https://dl.ndl.go.jp/pid/943657/1/131"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 131
    "url": "https://dl.ndl.go.jp/pid/943657/1/132"
  "translation_ja": "神道は、偉大な道徳である。もちろん、仏教もキリスト教も、倫理的な要素を含み、道徳として多くの価値を持つが、神道には及ばない。もともと道徳は、人と人との関係、君臣、父子、夫婦、兄弟、友人などの関係を律するものである。ところが、天の父を重んじ、君臣や父子の関係を軽んじ、あるいは妻子への愛情を断たなければならない、または阿弥陀如来の前では、神棚やしめ縄も認めない、という主義になると、その道徳も徹底しない。少なくとも国民の道徳としては、徹底しない。そこで、国家が運命をかけて戦争をしているときに、非戦論を唱えるなど、とんでもないことをしだす。社会主義的な思想も、そうした考えの中で養われがちである。また、道徳は、どこまでも実行を尊ぶ。どれほど優れた議論や説でも、実行されなければ何の価値もなく、まさに机上の空論である。神道は、どこまでも国家主義、家族本位、忠孝一本主義で進むため、道徳としても、生き生きと徹底していく。道徳としても、まことに偉大なのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "神道は偉大いなる道德である。勿論、佛〓も、基督〓も、倫理的要素を包含して、道徳として幾多の價値を有して居るも、神道には及ばない。元來、道徳は人と人との關係で、君臣、父子、夫婦、兄弟、朋友等の關係を律する所のものである。處が、天の父を重しとし、君臣父子の關係を輕ろしとし、或は妻子の〓愛を絕たなくてはならぬ。又は阿彌陀如來の前には、神棚、注連繩等をも認めないと云ふ風な主義になつて來るとその道德も徹底しない。少くとも國民道徳としては徹底しない.そこで國家が運命を賭して戰爭して居る際に非戰論を唱へたりなど、とんだ事をし出すのである。社會主義的思想も、やゝもすればかゝる思想の間に養成せらるゝのである。而して道德はどこまでも實行を尊ぶので、如何に名論卓說でも實行せらなければ何等の價値はない。眞に机上の空論である。神道はどこまでも國家主義で進み、家族本位で進み、忠孝一本主義で進むのであるから、道德としても、きび〓〓と徹底して行くのである。即ち道德としても實に偉大なものである。"

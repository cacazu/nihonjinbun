    "url": "https://dl.ndl.go.jp/pid/943657/1/53"
  "translation_ja": "これをわが国の古伝に当てはめると、天御中主神はいわゆる太極であり、絶対である。その絶対の属性が、高皇産霊神と神皇産霊神なのだと解釈される。しかし、私はもう少し違う解釈を立てている。高皇産霊神という神の働きは、絶えず活動することである。一方、神皇産霊神という神は、その活動をするもの自体なのである。たとえば風というものを考えてみよう。風は動くものだが、風そのものは何かといえば、空気である。空気の振動が風になる。だから、空気を神皇産霊神とすれば、その動きが高皇産霊神であり、全体が天御中主神なのである。動くところがなければ、空気の存在はなかなか認められない。しかし、動かなくても空気は存在している。たとえでは本当の意味を十分に表すことは到底できないが、まずはこのように見ればよい。また、水にたとえると、いっそう適切である。海に波が立つというが、その波になっているのは海の水である。水を離れて、波だけを見ることはできない。その意味で、波というものは、水と波という二つの側面からできている。波は絶えず活動するもので、それが高皇産霊神、その水自体が神皇産霊神である。そして天御中主神とは、その波、その水自体をいうのである。波から水を離すことも、水から波を離すことも、ともにできない。つまり、同一のものだと見るのである。目の前に万物が現れているのは、高皇産霊神と神皇産霊神による。この二神によって、万物は次々に生まれ、変化していく。万物が生まれ変化していく、その神徳を、高皇産霊神とも、神皇産霊神ともいう。しかし、その根本は天御中主神である。だから、天御中主神を一つの別個のものとして切り離すことも、高皇産霊神・神皇産霊神を別個のものとして切り離すこともできない。天御中主神といえば、同時に高皇産霊神・神皇産霊神もその中に含まれてくる。こういう関係なのである。"

  "source_text": "抑も日本の哲學には、旣に述べた通り、支那の思想が這入つて、日本の思想となつたものもあるし、印度の思想が這入つて、日本の思想となつたものもある。而して其の間に立つて我が國固有の思想の發展したものも大いにあるのである。隨つて日本の哲學と云ふものは、頗ぶる複雑な哲學となつて居るのである。けれども、英國の哲學が、如何に種々に變化しても、而かも經驗說を以つて其の思想を一貫し、大陸の哲學が如何に幾多の波瀾を有して居つても、常に合理說に傾き、以つて其の特色を發揮して居る工合に、日本の哲學も亦動かすべからざる固有の思想を持つて居つて、有らゆる外國の思想を日本に同化するに於いても、常に其の特色を發揮して居るのである。而して其の特色の最も純粹に發達して來て一大系統を爲すものは、神道哲學であるのである。それに次いで武士道哲學心學哲學と云ふやうなものがあるのである。それから外國の思想を取つて來て、日本で同化した所の哲學には、無論儒教哲學、佛教哲學、道教哲學と云ふやうなものがあるのである。之れを表にして見ると云ふと、左の通りである。"

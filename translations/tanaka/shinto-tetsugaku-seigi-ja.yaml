  "translation_ja": "要するに、難解な文字を並べ立てることは、一部の人の好みには合うかもしれないが、真理とは関係がない。そのことは、こうした西洋哲学を見ても理解できると思う。"
  "translation_status": "reviewed"
  "source_variants":

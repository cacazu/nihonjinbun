  "source_text": "一體、高皇產靈神に就いては、古傳が隨分色々になつて居る。例へば『舊事紀』と云ふ本、此の本は一般に後世の僞物として信用されないと言ふけれども、併し其の內容は兎に角古い傳であるに相違ないと云ふことに、多くの學者によりて信ぜられて居るが、此の本などにも、高皇產靈神は天御中主神の男子であると云ふ風に傳へて、天御中主神には三人の男子があつたと傳へてある。又『古語拾遺』には、天御中主神には三男があつた。其の長男が高皇產靈神で、第三男が神皇產靈神であると云ふ傳もある。で高皇產靈神は天照大神と同時の神であつて、而して又天御中主神の長男で御居でになつたと云ふことになると、どうも古傳の解釋が非常に難かしい。どう解釋して宜いかさつぱり分らないやうになつて來る。斯う云ふ所に就いては、已に述べたやうに古傳にどうしても幾多の誤謬が這入つて居ると云ふことを認めなければならぬ。古傳はどうも數學的にはキチンと行つて居らぬ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"

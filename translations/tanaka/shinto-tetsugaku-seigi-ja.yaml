- "id": "st-0020-003"
  "section_id": "chapter-01-section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "傳說は當時の哲學と云つても當時の傳說と、今日の哲學とを比べて見ると大いに違つて居る。其の違つて居る點を述べて見れば、次の樣である。傳說と今日の哲學とは其の包含する所の智識の程度に於いて著しき差異のあるのは、殊更に云ふ必要もないがその他に傳說には餘程想像が這入つて居る。今日の哲學は理論理窟に走つて居る。傳說の方は太古に成れるものだから何ういふ人によつて作られたかといふことが明かでない。即ち其の民族全體で作つたものと解釋される。哲學は、素より、民族の經過した時代精神を根柢とするのであるけれど、外觀一個人の產物であるかの樣である。そこで哲學では誰れ某れと名が付いて居る。西洋ではアリストテレースの哲學、カントの哲學、スペンサーの哲學とか、日本では伊藤仁齋の哲學荻生徂徠の哲學、本居宣長の哲學、平田篤胤の哲學だといふやうに、皆其人の名が付けられる。傳說には誰れの傳說と云ふ事はない。先づ大體の區別はこんなものである。其れで傳說が發達して來ると種々になつて來る。即ち、"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 19
    "url": "https://dl.ndl.go.jp/pid/943657/1/20"
  "translation_ja": "伝説は当時の哲学だといっても、昔の伝説と現代の哲学を比べれば、大いに違う。違う点を述べれば、次のようになる。含まれる知識の程度に著しい違いがあることは、ことさらに言うまでもないが、それ以外にも、伝説には想像がかなり入り込んでいる。現代の哲学は、理論や理屈を追究している。伝説は太古にできたものなので、誰が作ったかがはっきりしない。つまり、その民族全体で作ったものと理解される。哲学も、もとより、その民族が経験してきた時代の精神を土台にするが、外から見ると、一個人の産物のようである。そのため、哲学には誰それという名がついている。西洋ならアリストテレス、カント、スペンサーの哲学、日本なら伊藤仁斎、荻生徂徠、本居宣長、平田篤胤の哲学というように、皆その人の名がつく。伝説には、誰の伝説ということはない。おおよその区別は、まずこのようなものである。そして伝説が発達すると、さまざまなものになってくる。すなわち、"
  "translation_status": "reviewed"

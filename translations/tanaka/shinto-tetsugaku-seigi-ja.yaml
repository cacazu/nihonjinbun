    "text": "所で熟々今日我が國民に就いて研究して見ると云ふと、第一章に於いても已に述べた通り、我が國民が昔から我が國の歷史的、地理的の關係からして、得來つた所の國民的精神と云ふものがある。其の國民的精神を分解して見ると云ふと秩序的、統一的思想に富んで居るのである。快活的、現世的感情に富んで居るのである。發展的、膨脹的性格に富んで居るのである。秩序的、統一的思想と云ふのは、我々が此の世に處して行く上に於いて總べて秩序を重んじ、統一を尊ぶ所の精神である。何れの國民と雖も秩序や統一は尊ぶのであるが、我が國民は特別に此の點に重きを置いて居るのである。例へば支那に就いて見ても、支那國民は矢張り秩序を重んじ、統一を尊んで居る。けれども我が國の樣な工合に尊ばないのであるから、隨つて秩序の根本である所のものが成立つて居らない。我が國に於いては一軒の家には家長と云ふものがあつて、さうして其の家を引締めて行くのである。けれども外の國に於いては、我が國の家と云ふやうなものを餘り見ることが出來ない。我が國の家は家長が治めて行くのであつて、又其の家長を相續することを家督の相續と言ふ。此の家督相續と云ふことが又我が國に於いては極めて大事なことになつて居る。けれども外國ではさう云ふことが餘り大事なことにならぬ。別して西洋などになつて來ては、家督の相續と云ふものは今日見ることが出來ない全く無いのである。家と云ふものは所謂男女同權であつて、夫婦と云ふものが對立して居るのである。子供があつても、それが成年以上になれば、矢張り又親と對立するやうになつて來る。處が、我が國では、同一血族のものが、同一家長の下に温かい團結をなして居るのである。だから我が國に於いては、家を尊ぶのである。其の家の觀念が大きくなれば又國家になる。隨つて國家の主權者、即ち天皇陛下と云ふものは、一軒の家で言へば家長と同じやうに、國民の中心になつて、國民の崇敬の對象となられて居る。支那などに於いても忠だの孝だのと言ふけれども、併し君に對して纂奪弑逆と云ふやうなことを行ふのである。秩序の根本と云ふものを失つて居るからさう云ふことになつて來る。西洋に於いてもさう云ふ工合に、秩序統一と云ふやうなことは重んじて居るけれども併しそれが徹底して居らない。云ふと或は斯う云ふ者があるかも知れない。今日我が議會に於いて、政府と議會とが非常に爭論するのはどう云ふ譯か、それでも秩序統一を重んじて居るかと云ふ質問が起るかも知れぬ。併し是れは昔の政府に於いても、內大臣だの、左大臣だの右大臣だの太政大臣だのと云ふものがあつて、政治を行つて居つたので、其の左大臣や右大臣と云ふ人には、權力の衝突などは始終あつた。今日は立法、司法、行政と云ふ工合に分れて居つて、さうして行政部、立法部司法部と云ふ工合になつて居る。其の立法部と行政部と衝突したり、爭論したりするのは、等しく皆國政を十分に行ひ秩序統一を十分にしやうと云ふ努力に過ぎない。天皇陛下に對しては等しく忠實に働いて居るのである。であるから一旦敵國外患の生じた場合に於いては、直に議會に於いても全會一致、國內に於いても擧國一致と云ふことになつて來るのである。又御大禮とか御大喪に關する時には、如何に爭論して居つても、直に一致してしまふ。是れが即ち我が國民が秩序統一と云ふ精神を今日に於いても十分に發揮して居る證左である。要するに我が國では秩序統一の根本に、神聖なる天皇陛下を頂いて居るのである。西洋などで神を以つて主とし、上とし、皇帝も人民も均しく神の支配を受くべきものである。即ち神に對しては同輩である。此の世の父よりは、天の父を大事とし、此の世の主よりは、天の主を大事にすると云ふ考では、とても我が國のやうな秩序統一は出來ない。又支那や米國のやうに國民がてんでに民を主とし、民を根本としては、とても徹底的の統一は出來ないのである。勿論、我が國でも歷代の陛下は民を愛せられ、民の心を以つて心とせられて居るけれども、外國の樣に、人民自身が民主主義を主張してはだめである。人民は多いのである。多い人民が主では、どんな方法を取つても到底理想的の統一は出來こない。"

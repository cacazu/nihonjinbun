    "text": "要するに我々は、三種の神器によりて知を磨くも皮相の知に止まらず、進んで民智をめぐに神録を理想とし温手た〓情操を同治すとに神郡を通過根建節に処つても赫が凝滯すき所ならは神劍を理屈しと意次期徒修め、以つて自己の人格を高上せしめ、天壤無窮の國運發展てふ我が國民的大理想の實現に從事すべきを示されて居るものと解し得るのである。"

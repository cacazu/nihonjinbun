  "translation_ja": "そこで私たちは、わが国の哲学の研究に取り組もうと思う。こうして、わが国の哲学と言うと、次のように論じる人がいる。今日、文化はきわめて栄え、学術も大いに振興した。その結果、哲学も盛んになったが、日本固有の哲学だとか、わが国の神道哲学などと言うのは、たいへんおかしなことである。日本には、もともと哲学というものが存在しない。仮に哲学のようなものがあっても、それはすべて中国やインドから輸入したものであり、日本固有のものではない。日本の哲学はインド思想や中国思想の系統に属し、日本独自の思想の系統はない、と主張するのである。しかし、よく考えてみれば、哲学は先にも述べたように、人間が自然に受ける外界からの刺激と、その知的欲求から生まれたものである。人間は哲学によって宇宙の真理を発見し、精神の求めを満たそうとする。こうして哲学は文明の根底となり、文化の発展の源となる。したがって、古くから国民として発達し、独自の文化を進めてきた民族なら、何らかの形で哲学が発達していないことはない。古来、東洋に国を立て、早くから文化を発達させてきたわが帝国に、固有の哲学がないなどと言うのは、あまりに考えの足りない話だと思う。もちろん、論理学・認識論・自然科学などを基礎に立てたものでなければ、断じて哲学ではないと言うのであれば、「日本に哲学はない」と言ってもよいだろう。しかし、その立場を貫けば、西洋の哲学でも、古代や中世のものは、ほとんど哲学としての価値を持たなくなる。ところが、ただ万物の根本は水だと主張したタレスを西洋哲学の始祖とし、宇宙の本体は無極だと唱えたアナクシマンドロスを、その開祖の一人とする。そして、そこに論理学・認識論・自然科学が含まれているかどうかは問わない。それなのに「古来、日本に哲学はない」などと言うのは、はなはだしい矛盾ではないか。試みに、昔からわが国に現れた学者や思想家の学説を、詳しく調べてみるがよい。西洋でいう唯物論・唯心論・神秘論・唯理論・楽天主義・厭世主義などに当たるものを、どれも指摘できるではないか。仮に一歩譲って、わが国の哲学思想が中国やインドの思想の影響を受けて成立したとしても、ギリシャ哲学もエジプトやフェニキア、そのほか西アジアの思想の影響を受け、近世ドイツ哲学もイギリスやインドの思想の影響を少なからず受けているではないか。だから、日本の哲学が中国やインドの思想に負うところがあっても、日本の哲学であることには、何の差し支えもない。もともと、世界の原理には東西の別がなく、人生の真理には自他の違いがないはずである。それを普遍的で、永遠に一つだと呼ぶことができる。このように真理に国境はなく、原理に時代の違いはないが、その真理が、区別のある個々の世界に映し出され、その原理が現実の世界に現れるときには、風俗や習慣の影響を受け、土地や気候に左右され、国民固有の性向に制約される。そのため東西や国々の間に著しい違いが生じ、学問として現れるとき、一つの特色を帯びるのは、まことに自然な成り行きである。そして、わが国民は古くから、日本人として一種の特色を持つ、いわゆる日本固有の哲学、すなわち神道哲学を生み出してきた。この日本固有の哲学思想が、国民一般の思想の基礎となり、精神の根底となってきたのである。西洋哲学がいくら整理され、発達していても、そのまま輸入して、国民の求めを十分に満たすことはできない。ただし、中国の哲学でもよく、インドの哲学でもよく、西洋の哲学も、もとより悪くはない。いずれも、この固有の思想を基礎に据え、この思想を根底にして組み立てられてこそ、初めてわが国家・社会の求めを満たすことができる。それは、そのものが日本の哲学となるからである。こうして、昔から中国の哲学も日本に入って日本の哲学となり、インドの哲学も日本に入って日本の哲学となって、わが国の文明の進歩と国運の発展に貢献し、今日に至ったのである。今や、発達した西洋哲学が、波のように勢いよくわが国へ入ってきている。私たちは、数千年にわたり練り上げてきた固有の思想を研究し、それを基礎に西洋哲学を日本化し、これを用いて、新たに大きな哲学体系を組み立てなくてはならない。これこそ国民の大きな任務である。ただ、彼らの飲み残しをすすり、かすをなめるようなあり方は、私たちが取るべきものではない。"

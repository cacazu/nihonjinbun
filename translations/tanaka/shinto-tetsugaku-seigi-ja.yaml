- "id": "st-0069-004"
  "section_id": "chapter-06-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "處が、伊勢の神主である所の度會延佳と云ふ人は、是れと少しく趣を異にして、「天地人の始まる、其の形は違つて居るけれども、其の理は違ふことはない」。斯う云ふ說からして、詰り天地の出來るのを、人の出來るのと同じやうに解釋して行かうと云ふのである。天地の成ると、人の出來るのとは、形は違ふけれども、道理に違はないと云ふので、人の出來る道理を以つて、天地の出來ることを解釋して行かうと云ふである。そこで國常立尊から阿夜訶志古泥尊まで九つの神を、人身の九ヶ月の懷胎に象つて、十ヶ月目には男か女か體が現はれるから、若し男ならば伊弉諾尊であるし女ならば伊弉冊尊であると云ふのである。一體國常立尊から、阿夜訶志古泥尊までは、未だ形を現はされない所の神である。即ち懷胎中の神である。さうして伊弉諾、伊弉冊二尊は、男女の形體の現はれ給へる所、明かに出產せられたものと認むべきである。斯う云ふ風に解釋して居る。平田篤胤も亦、此の度會延佳と同じやうな考を以つて伊弉諾、伊弉册二尊の御身の、段々と成り整ひませる趣より、此の二神前の四代の神々の御名は出來たのであると云つて居る。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 68
    "url": "https://dl.ndl.go.jp/pid/943657/1/69"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 69
    "url": "https://dl.ndl.go.jp/pid/943657/1/70"
  "translation_ja": "ところが、伊勢の神主である度会延佳は、これとは少し趣を異にし、「天地人が始まるとき、その形は違うが、その理は違わない」という説から、天地のできることを、人のできることと同じように解釈しようとする。天地ができることと、人ができることは、形は違っても、道理は違わないとして、人ができる道理によって、天地ができることを解釈しようとするのである。そこで、国常立尊から阿夜訶志古泥尊までの九柱の神を、人の身体が九か月間、胎内に宿ることになぞらえる。十か月目に男か女か、その身体が現れるから、男なら伊弉諾尊、女なら伊弉冊尊であるという。国常立尊から阿夜訶志古泥尊までは、まだ姿を現していない神、つまり胎内にいる神である。そして伊弉諾・伊弉冊二尊は、男女の姿が現れ、明らかに生まれ出たものと認めるべきだ、と解釈している。平田篤胤も、度会延佳と同じような考えから、伊弉諾・伊弉冊二尊の身体が次第に整うありさまによって、この二神より前の四代の神々の名ができた、と言っている。"
  "translation_status": "reviewed"

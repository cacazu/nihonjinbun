  "translation_ja": "この節では、底本の神名と配役を保って訳した。底本は、一日に千人を殺すのがイザナギ尊、千五百人を産むのがイザナミ尊と記し、保食神を殺す神をスサノオ尊としている。これらは、原画像にも同じ記述がある。"

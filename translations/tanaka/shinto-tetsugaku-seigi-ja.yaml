  "translation_ja": "篤胤は、こう述べている。「この神が天地を造ったことは、何によって分かるのかといえば、日の神と月の神の託宣によって知られる。『日本書紀』の顕宗天皇の巻には、三年二月、阿閉臣事代が任那へ遣わされたとき、月の神が人に乗り移り、『わが祖先の高皇産霊神には、天地を造った功績がある。民の土地を献上せよ。私は月の神である。願いどおりに献上すれば、福を与えよう』と告げたとある。事代は都へ戻り、詳しく報告した。そこで歌の荒樔田を献上し、壱岐県主の先祖の押見宿禰に祭らせた。また四月には、日の神が人に乗り移って事代に告げ、『磐余の田を、わが祖先の高皇産霊神へ献上せよ』と言った。日の神の託宣に、産霊神が天地を造った功績を述べていないのは、月の神の教えに譲って省いたのである。事代がこう報告すると、神の望みどおり田四十町を献上し、対馬の下県直に祭らせた、とあることから分かる。また、この二柱の神名の意味と、神代の事実の上にも明らかである」というのである。しかし、この証拠は、天地を造ったという大事件の証拠としては、はなはだ弱い。ほかに証拠があるならともかく、どうもないので、この点では宣長も篤胤も、非常に困ったように思われる。そもそも、天御中主神・高皇産霊神・神皇産霊神について、本居・平田、そのほかの神道学者の見解は、たいへん不明瞭である。薄い紙越しに見るようで、細かいところがどうしてもはっきりしない。間に何かを置いて、その向こうを見るようなものだ。そこで明確な答えを得ようとすると、古い伝えがないから分からないと言われる。伝えがないので知られない、「伝えがなければ知ることはできない」と、伝説の中へ隠れてしまう。まことに残念なことだと思う。"

  "section_id": "chapter-05-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "先づ古傳の初めに傳へてある所の三神は右のやうに解釋し奉るのである。さて此の天地の最初に當り、古傳は狀貌葦牙に類する所の一つのものゝ成れるを傳ふ。此のものによりて成りませる神は、即ち可美葦牙彥舅神であると云ふ。此の神をどう云ふ風に解釋し奉るかと云ふのが、茲に先づ提起せらるゝ所の問題である。此の可美葦牙彥舅神と云ふ神は、宣長などの說に依つて見ると云ふと、此の天地が初めの時に葦牙のやうになつて出來たと云ふ。で其の葦牙の如きものを可美葦牙彥舅神と申したのであると云ふ解釋である。即ち高皇產靈神、神皇產靈神が可美葦牙彥舅神と云ふやうな神を御產みになつてそれから天地が出來て來たのであると云ふ意味に取つて居る。けれども私は前に申したやうに、高皇產靈神、神皇產靈神に依つて此の宇宙が出來て居るのであるが、元來宇宙と云ふものは、一種の星雲的のものであると見らるゝのである。抑も星雲說と云ふのは、獨逸のカントと佛蘭西のラプラースと云ふ兩人が、別々に考へ出した所の說である。それでカント、ラプラースの說と云ふ風になつて傳つて居るのである。此の說を參考し、つら〳〵宇宙の本質を考ふるに、宇宙は全く星雲的のものであつて、それが始終運動して居る。さうして其の中に或る太陽系と云ふ樣なものが出來てくる。さうすると他の太陽系と云ふやうなものは既に出來てしまつて居る。或は又既に滅亡しつゝあるのもある。詰り宇宙は無限の太陽系であつて、それが常に生滅起沒して居るのであると云ふやうに說明せらるゝのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 60
    "url": "https://dl.ndl.go.jp/pid/943657/1/61"
  "translation_ja": "まず、古伝の初めに伝えられている三神は、以上のように解釈するのである。さて、天地の最初に当たり、古伝は、姿が葦の芽に似た一つのものができたと伝えている。このものによって成り出た神が、可美葦牙彦舅神であるという。この神をどう解釈するかが、ここでまず提起される問題である。宣長などの説では、天地の初めに、葦の芽のようなものができてきて、その葦の芽のようなものを可美葦牙彦舅神と申し上げた、と解釈する。つまり、高皇産霊神・神皇産霊神が可美葦牙彦舅神という神を生み、そこから天地ができてきたという意味に取っている。しかし私は、前に述べたように、高皇産霊神・神皇産霊神によって宇宙が成り立っているが、もともと宇宙は一種の星雲のようなものだと考える。そもそも星雲説は、ドイツのカントとフランスのラプラスが、それぞれ別に考え出した説である。それで、カント・ラプラスの説と呼ばれて伝わっている。この説を参考に、宇宙の本質をよく考えてみると、宇宙はまったく星雲のようなもので、絶えず運動している。その中に、ある太陽系ができてくる。そのとき、ほかの太陽系はすでにできあがっているし、また、すでに滅亡しつつあるものもある。つまり宇宙には無数の太陽系があり、それらが絶えず生まれたり滅びたり、現れたり消えたりしている、と説明されるのである。"
  "translation_status": "reviewed"

    "text": "神道は偉大な政治の道である。實に世界無比の國體を根柢とする偉大な政治の道である。如何に佛〓や基督〓があせつてもかう云ふ政治道となることは出來ない。元來佛〓の立て方は、家を出なくてはならぬ。在家の信徒も無論あるけれど、理想の佛〓家となつて、眞に佛〓を信奉するものは、是非とも出家しなくてはならぬ。妻を帶びてはならぬ。魚肉を食つてはならぬ。金錢に執着してはならぬ。かくて家族を根本とし市町村を根本とし、府縣郡を根本とする政治とは一致し得ない。眞の佛〓は世界的である。個人的である。非國家的である。基督〓も亦之れと同樣である。舊〓などではやはり出家的生活を理想とし、世界的である。國境を認めない。國家主義の政治とは、本來の性質を異にして居る。勿論、今日の佛〓、基督〓は、その本性質を離れて多少國家主義になつて居るけれども、理想的に云へばさうは行かないのである。處が神道は、本質として國家的である。我が國民と共に發展する所の大道である。"

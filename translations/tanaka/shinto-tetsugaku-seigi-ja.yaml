  "translation_ja": "また篤胤は、古伝では高皇産霊神・神皇産霊神を二神と伝えるのに、宣長が、二神のようだが実は一神ではないかと疑ったことを批判する。そして自らは、高皇産霊神は男神、神皇産霊神は女神であり、前者は産霊の外の働きを、後者は内の働きをつかさどる、と解釈する。この男女二柱の大神が多くの神々を生んだのは、男女それぞれの産霊の力が互いに芽生え合う、不思議な徳によるのであって、決して夫婦の営みによるのではない。それが産霊の大きな徳であり、この二神の徳によって、神々ばかりでなく、あらゆる物体、さらには天地までも造り出した、と言うのである。そして、産霊神が天地を造ったことについて、外国の学問を学び損なった学者や、学問もないのに生意気な人々は、自分がこの世に生まれたことさえ産霊神によると知らず、天地万物を生み造ったという話を、日本だけの昔話として聞き流す者が多い、と言う。しかし、これは日本だけの説ではなく、どの国にも伝えがある。中国では元始天尊、インドでは大梵天王と呼び、その趣旨は、わが国の古伝と少しも違わない。したがって、釈迦も達磨も、猫もイタチも、すべてこの大神の産霊によってできたものなのは、論じるまでもない。決して、中国やインドの末流の学問に惑わされ、この大神をおろそかにしてはならない、と篤胤は説く。さらに篤胤は、インドより、はるか西にも多くの国があり、それぞれ、天の神が天地をはじめ、あらゆるものを造ったという伝えを持つと言って、わが国の古伝の産霊神を、天帝・梵天・造物主と同じものだと解釈した。しかし高皇産霊神が、高木神として天孫降臨の際に活動した神と同一だとすれば、そこがどうも奇妙に聞こえてくる。"

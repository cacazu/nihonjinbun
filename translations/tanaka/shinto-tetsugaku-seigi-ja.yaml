  "source_text": "又かの神武天皇が即位の四年に皇祖の神靈を祭られた事跡の如きに於いて益、神々を崇敬すべきことが徹底せられて來た。それから後歷代神祇崇敬祖先崇拜と云ふことは、皇室に於いて奬勵せられ、又我々の祖先の行ひ來つた所のものである。世間では、神道は單純に道德であつて、神道の神と云ふのも基督教の神などと違つて道徳的の神である。詰り人である。斯う云ふ風に說いて、神道に於いて神祇を崇拜するのは、唯、報本反始に過ぎないのであると言ふけれども、我々が祖先に對して崇敬するのは、決して單に倫理的の崇敬ではなからうと思ふ。之れを例に擧げて見ると、二重橋の外に楠正成公の銅像がある。あの銅像は歷史家が攻究して造つたのであるから、容貌は勿論、公の在世の時の服裝から、器物、馬の狀態等總べてが當時の物に據つてある。詰り公の生寫しである。人としての公を其の儘に寫してある。けれども我々が公の銅像の前に行つた時の精神狀態と、それから湊川神社に參拜して社前に手を打つて頭を下げる時の精神狀態とが、どうであるか。我々はどうも之れを同一と見ることは出來ない。公の銅像の前に行けば之れを偉人として仰ぐことが出來る。その生前の勳功を追想することが出來る。けれども湊川神社の前に行けば、之れを神として崇拜するのである。その神社の神靈は、神祕的に且つ直覺的に吾人の奥深き心裡に、强き印象を投ぜらるゝのである。「何事のおはしますかは知らねども、かたじけなさに淚こぼるゝ」の感なきを得ないのである。この心理狀態を銅像の前に生ぜしめやうとするのは、それは無理である。公の銅像に對しては正しく人としての楠公を髣髴するのである。公は偉人である。斯う云ふ風な人であつた。割に丈は低い人であつた。又力も大して無ささうである。けれども我々祖先の一大偉人である。斯う云ふ風に我々は偉人としての正成公を見るのである。處が湊川神社に參拜する時には、正成公が丈が低かつたとか、高かつたとか、顏が優しかつたか、恐ろしかつたかと云ふやうな觀念は露程も起らない。正成公の神靈に對して我々は崇拜するのである。我々は茲に深き靈感を感ずるのである。そこが詰り神道の偉大な宗教としての性質を有して居る所である。それで神道はさう云ふ宗教的の性質を有つて居る。"

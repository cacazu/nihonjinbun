  "translation_ja": "いよいよ七代を経て、第七代に伊弉諾・伊弉冊の二尊が現れた。二尊は天津神の詔を受け、この国土を整え固めることになっているとは、すでに述べた。しかし、それもまた問題であり、その天津神とはどういう神かが、まず最初に起こる疑問である。これに対して、二尊より前に現れた神だと言うのだが、今述べてきたように、それらが観念上の神々だとすれば、二尊にどうやって、この国土を整え固めるよう勅命を下したのかが疑問になる。そして、天瓊矛を授けたというが、これはやはり、二尊が神秘的な詔を受け、矛も授かったと解釈するほかないと思う。二尊は天瓊矛を持ってこの国に来られ、天浮橋に立ち、ゆっくりとその矛で探ったと伝えられている。その天浮橋についても、さまざまな説がある。『釈紀』所引の私記では、「天浮橋とは、天地開闢のとき、島々がまだできず、浮いた脂がつながるところもないような状態であった。それで、浮橋の上に立つと申し上げたのである」と、きわめて漠然とした解釈を与えている。ところが平田篤胤は、こう解釈している。「浮橋といっても、今の橋のように、こちらから向こう岸に架けるという意味で、天と地の間に架かっている橋をいうのではない。また、天と地をつなぐ帯のようなものでもない。そのように考える人もいるが、ただ神の考えによって造り出され、事あるときにはそれに乗って空を飛行されたもので、今日のものでいえば、船のようなものである」。そして、これを浮かべて乗り、往来するものだから、浮橋といったのだと解釈している。これに反し、近代の学者、敷田年治は、「空に浮かんで架かる橋である。そのような橋があったことは、『丹後風土記』や『播磨風土記』などに見える」と言っている。しかし、どうも船のようなものだと思われる。橋といっても、決して一方から一方に架けた橋という意味ではないと思う。"

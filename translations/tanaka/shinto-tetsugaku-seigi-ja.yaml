    "text": "三貴子に就いては、古傳が實に樣々になつて居るのである。が、要するに三貴子が御出來になると云ふと、伊弉諾、伊弉冊二尊は、此の國土經營のことは一切三貴子に御託しになつて、伊弉冊尊は黄泉國に御歸りになり、伊弉諾尊は日之少宮に御退きになつたのである。抑も三貴子と申すのは天照大神と月讀命及び素盞鳴尊の三神を申すのであるが『古事記』に依ると、伊弉諾尊が筑紫の阿波岐原で、裸をされた時に、眼を御洗ひになつた。左の眼を御洗ひになつた時に、天照大神を御生みになり、右の眼を御洗ひになつた時に、月讀命を御生みになり、鼻を御洗ひになつた時に、素葢鳴尊を御生みになつた、斯う云ふことになつて居るのである。併しながら、此の事に就いて前に一言したやうな工合に、吾々はどうも神道の立脚地より、此の古傳を採るのは、甚だ如何であらうかと思ふのである。"

  "source_text": "天御中主神、高皇產靈神、神皇產靈神の御德は宏大無限、言葉を以つて之れを現はすべきものが無い位である。のみならず、人身を有して御居でにならぬから、我々はそれを仰ぎ奉り、以つて其の御教を十分に受くることが出來ないのである。然るに天照大神は人身を有つて御居でになつて、而して天御中主神、高皇產靈神、神皇產靈神の宏大無限なる德を人格化して具有せらる。即ち我が秩序的、統一的思想、現世的、快活的感情、發展的、膨脹的、性格の精華の更に精華なるものを有せらる。勿論天照大神に就いて古傳は種々あるけれども、其の古傳は當時の極めて未熟なる文學を以つて傳へられて居るのであるから、天照大神の偉大なる御德を古傳によつて十分に窺ふことは出來ない。併し其の傳つて居る所の物を見ても、略、其の一斑を窺ふことが出來る。即ち『書紀』に、「光華明彩、六合の內に照徹す」と云ふ風に傳へてある。之れを以つて見ても如何に大神の玉體が麗はしく、美くしく、其の御徳の偉大に在はしましたかと云ふことが想像されるのである。而して更に大神は皇孫瓊々杵尊を此の國に御降しになる時に方つて「葦原千五百秋之瑞穗國、是吾子孫可王之地也。宜爾皇孫就而治焉。行矣。寶祚之隆當與天壤無窮者矣」と云ふ神勅を御下しになつて居る。此の神勅に依つて見ても、此の瑞穗國は吾が子孫の王たるべきの地であると斷定され、さうして寶祚の隆なること當に天壤と窮り無かるべしと仰せられて居る。之れを支那などで言つて見ると堯帝が位を舜に傳ふる時に方つて「咨爾舜天之曆數在爾躬。允執其中四海困窮天祿永終」と言つた。堯は之れを以つて舜に傳へ、舜は之れを以つて禹に傳へたと云ふことで在るが、「四海困窮」とある。「天祿永く終へん」とある。然るに我が國のは、「寶祚の隆」とある「天壤と窮り無かるべし」とある。實に此の時代に於いて、天照大神の御雄圖の如何に遠大であつて、他に比較すべきものが無いと云ふことが分る。而してこゝが神道の根本である。"

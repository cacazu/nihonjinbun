  "source_text": "それから又日本國民は、どこ迄も發展し、どこ迄も膨脹して行くと云ふ性格を具へて居る。之れを歷史に見れば最も彰明較著である。國運の日に發展し、膨脹して止まないのも全く此の性格の爲である。勿論外國人でも、さう云ふやうな性格を有つては居る。殊に昔の羅馬人、今の獨逸人などは、かゝる性格を著しく有して居る。だから能く人が世界を統一するものは、日本人か、獨逸人であると云ふのである。けれども羅馬人にしても、獨逸人にしても秩序的、統一的思想が如何にも乏しい。羅馬は王政を行ひて遂に國王を放逐し、共和政を行ひて國內爭鬪絕ゆるなく、日本國民の樣に、他の秩序的、統一的思想、快活的、現世的感情を有して、而して此の發展的、膨脹的性格を有つて居る國民は、殆んど見る事が出來ない。我が國民は斯う云ふ思想感情を有つて居つて、而して發展的膨脹的である。是れは我が國家の發展し膨脹し來つた徑路に見ても分る。昔は我が國の勢力と云ふものは、近畿から東海、中國、九州方面にしか及んで居なかつたのだ、がだん〳〵と遠隔の地に及んで、遂に北海道、樺太西は朝鮮、南滿、南は琉球、臺灣、南洋の遠きまでも及ぶと云ふ樣に、漸次發展膨脹して來て居る。又思想の上から見ても彼の新年の祝の儀式などに於いては、是れが十分に發現されて居る。其の他日本人の爲すこと、することが、常に發展的、膨脹的である。其の性格の流露である。詰り是れが日本國民の國民的精神である。で我が國の神々と云ふのは、此の國民的精神の精を體し、華を集めて居らるゝ所の御方である。であるから我が國の神々は八百萬と云ふ工合に實に澤山在はすけれども、それは決して希臘の多くの神のやうに、雜然不統一に在はすのではない。皆嚴然たる系統の地位を有して御居でになる。又印度の十六羅漢とか五百羅漢とか、其の他澤山の佛菩薩のやうに、厭世的、保守的のものでなくして、實に快活的、發展的に在はすのである。で我が國の神々はさう云ふ工合に、我が國民的精神の精を體し、華を集めて居られるのであるが、其の中に就いて殊に偉大なる神は即ち天照大神であるのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"

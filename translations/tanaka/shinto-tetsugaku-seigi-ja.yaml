    "text": "此の島々を生れたと云ふのが後世神道學者の非常に迷ふて居る所である。本居平田二翁の如きは、徹頭徹尾此の島それ自らを御生みになつたものとして居るのである。が著者は決して是れは島を御產みになつたものではないと見るのである。此の御生みになつたと云ふことも、必ずしも是れは後世人が子供を生むやうな工合に、二神が御生みになつた譯ではないと思はれる。何となれば、斯う云ふ工合に都合よく一々御生みになると云ふことも、甚だ如何かと思はれる。勿論神の事は神祕的であると言へば、それまでであるけれども、併し十分〓究の眼を以つて見ると云ふと、御生みになつたと云ふことも、必ずしも後世の通りの譯ではないと思ふ。此の島々と云ふのは、私は是れは島々の主宰の神々であるとするのである。伊弉諾、伊弉冊二尊が天津神の詔を受けて、此の國を修理經營されるのに就いては、當時多くの島々を、悉く一々自ら修理經營されると云ふことは、到底出來ないので、そこで各島々の主宰の神を先づ御定めになつたものと解せられる。其の主宰の神であると云ふのに就いては其の理由として、第一に伊豫之二名島と云ふのは篤胤が、彌二並島と云ふ意味であると解釋して居るが、さう云ふ風に二つに並んだ島である。現に四國はさう云ふ風になつて居る。其の形に依つて、其の主宰神の御名を奉つたものと思はれる。それから伊豫之二名島にしても、隱伎之三子島にしても、之れに皆又の御名と云ふのがある。其の又の御名と云ふのを見ると、其の御名は比古と言つたり、比賣と言つたりするのがある。それから又號と云ふのもある。例へば大倭豐秋津島、又の御名は天御虛空豐秋津根別と云ふ。別と云ふのは宣長の解釋に依つて見ると、吾君兄と云ふ意味であつて、國造や稻置などの類を云ひ、國々處々に居つて、其の地方を治める人を謂つたものである。即ち地方の長官を別と云ふ。さうして見ると、四國の長官を何々の別と謂ひ、或は九州の長官を何々の別と謂ふのである。斯う云ふ工合に別と云ふ名前があるのを見ても、大倭豐秋津島を天御虛空豐秋津根別と謂ふ、乃ち天御虛空豐豐秋津根別と云ふ長官が、此の島を支配されたものと、斯う見れば宜いのである。且又別と云ふのは、代々の皇子の御名に澤山ある。孝靈天皇の皇子に日子刺肩別と申すがあり。開化天皇の皇子に建豐波豆羅和氣と申すがあり。垂仁天皇の皇子には、別の附く御方が六人ある。景行天皇の皇子には、別の附く御方が二十三人ある。之れによりて見ると伊弉諾、伊弉冊尊の御定めになつた地方の長官に比古、比賣、和氣と申上る神々のあるのは、怪むに足らない。かう云ふ次第で矢張り主宰神を申上げた者と思はれるのである。それからさうすると、又、神の御名に島とか國とか言ふのは、甚だどうも可笑しい。神の御名に隱岐及又の名大之望許呂則るお筑業國又の自白別のは可笑しいと云ふやうに聞えるけれども、併し後世でも丹波守とか、丹後守とか云ふのを見れば、强ち可笑しいこともない。著者の祖先には、田中淡路、田中丹波と云ふのがある。その他一般に松平伊豫淺野藝州、斯う云ふ工合に國の名が名前となつて居る者は澤山ある。又古傳に見ても、「古語拾遺」に、「生島は是れ大州洲の御要今の生島の本の齋きやも所なることひ「吾車起に依っての『古語拾遺』の通りの傳がある。『神名式』にも一神祇官の西院に坐す生島の巫の祭る神二座」とある。そして貞觀元年の正月生島神、足島神に並に從四位上を授け奉られ、尋いで其の二月に、正四位下を授けられたと云ふことがある。之れによつて見ても、神の御名を、島だの國だのと申しても、不思議はないと云ふことがわかる。であるから此の島々をお生みになつたと云ふのは詰り此れ等を御經營なさるに就いて先づ以つて其の主宰神を御定めになつたことを申したのであるとするのである。"

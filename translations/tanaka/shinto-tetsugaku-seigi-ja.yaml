  "translation_ja": "さて、天之常立神は、この国土以外の世界の元霊である神なのである。わが神道は、天御中主神の大道、天地の公道として、宇宙全般に行われるものだが、この国土以外の世界とは直接の関係が少ないため、天之常立神の系統についての伝説は、まったくないのである。"

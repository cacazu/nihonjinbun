  "translation_ja": "このようなわけで、天照大神の徳は、まず天地とともにきわまりないという神勅や、三種の神器を授けたという古伝から、うかがうことができる。天照大神には、釈迦牟尼のように六年間山に入って苦行し、五千余巻の経文を説いたという事績は、少しもない。また、イエス・キリストのように、あちこちをさまよう生活を送り、悲惨な最期を遂げたという事績もない。孔子のように、政治家となったり教師となったりして、門人を集めて教えを説いたという事実もない。またソクラテスのように、人家の軒下に立ち、一世の堕落した風俗を改めようとして、ついにその犠牲となり、毒を飲んで死ななければならなかったという事績もない。それでも天照大神は、わが国民にとって、これら外国に現れた偉大な人物より、さらに、さらに偉大なのである。なぜ、それほど偉大なのか。そもそも人間は、ある道に志す者なら、その道の達人を、非常に偉い人と見る。これは、古今東西に見られる現象である。たとえば碁を打つ者は、六段や七段の人を、実に偉い人だと思う。剣術をする者は、二級にもなった人を、非凡で偉い人だと思う。相撲取りは、大関や横綱を、非常に偉いと思っている。音楽をする者は、音楽の大家を見て、非常に偉いと思う。このように、それぞれの道の達人を、神のように尊敬するのである。たとえば普通の力士なら、横綱の下駄をそろえたり、風呂で背中を流したりするのは、何でもない。場合によっては、その人が入った湯さえ飲むというほどである。その道の人は、達人を非常に偉いと思うが、道の外にいる者から見れば、あまり偉いとも感じない。碁を打たない者なら、本因坊だ、八段だ、七段だといっても、「何だ、本因坊が何だ、八段が何だ」と言うだろう。剣術をしない者は、「二級だからどうした、三級だからどうした」と思い、格別偉いとも思わない。「竹の先をカチカチ打ち合って、名人も何もあるものか」と言う。相撲に興味がない者は、「横綱を張るのに一万円を出すなんて、ばかばかしい。その金で、何かもうかる商売でも始めればよいではないか。この寒いのに裸になり、十貫目もある綱を巻いて得意になっている。気が狂ったようなものだ」と言う。何でも、そのとおりである。その道にいない者から見れば、ほとんど何の価値もない。だから、インド人種、あるいはそれに似た思想を持つ者、より適切にいえば、仏教の思想や信仰を持つ人には、仏教が偉大な教えに思われる。それで、仏はすばらしい偉人に思われる。ユダヤ人、あるいはユダヤ的な思想を持つ者、より適切にいえば、キリスト教の思想や信仰を持つ人には、キリスト教が偉大な教えに思われ、キリストがたいへんな偉人に思われる。しかし、仏教やキリスト教に、興味も信仰も持たない者から見れば、「釈迦が何だ。親の命を聞かず、国が滅ぶのも顧みず、気違いじみたことをして平気でいる。イエスが何だ。むやみに天国を空想し、社会党的な世界主義によって、人々を邪道へ導こうとする」などと言うだろう。それと同じように、熱心な仏教徒やキリスト教徒、また西洋哲学に心酔する者から見れば、わが天照大神は、きわめて平凡で、何の価値もない人のように見えるかもしれない。しかし、私たち日本国民には、今述べたような、日本の国民的精神がある。もちろん、その精神が大きい者も小さい者もいる。碁にたとえれば、まったくのざる碁の者もいれば、初段を相手に井目、つまり九子を置く者も、八子、七子、三子を置く者もいるだろう。それと同じく、国民的精神にも深浅や厚薄はあるが、日本国民である以上、ほぼ誰もが、ある程度はこの精神を持つ。その精神を持つ者の目から見ると、この精神を、ほかに比べるものがないほど偉大に備えた天照大神を、実に偉大な方だと感じずにはいられない。そこで天照大神は、私たちが最も重んじる神となっておられる。その徳を何と呼べばよいか、名付ける言葉もないほどである。昔、中国の孔子の門人は、孔子を「先生は日月のようだ」と呼んだという。わが国民も、天照大神をどう申し上げればよいか分からず、その徳の広大さを仮に天の日にたとえて、天照大御神、大日霊貴尊、あるいは日の神と申し上げたと思われる。インド的、ユダヤ的、あるいは欧米的な思想を持つ人には、きわめて平凡に見える天照大神が、わが国では、永遠の手本として仰がれ、神道の淵源をなした神なのである。同時に、わが皇室の祖先でもある。神道の人生観は、この天照大神によって示されている。大神は、すべてにおいて私たちの手本となる神であり、その行いは、私たちの日常の行為の規範となる。神道の淵源は、実に、この天照大神にあるのである。もちろん、当時は文学がなく、その事績は十分に伝わっていない。しかし、伝わっているものの中には、珠玉のものがある。すでに述べた、天地とともにきわまりないという神勅は、世界に比べるもののない国体の淵源となり、神道の骨髄、根本となっている。また、三種の神器は、その道徳的な意味をひとまず措いても、皇統が一系であることの由来となる、深遠な意味を持つ。特に、宝鏡を天忍穂耳尊に授けるとき、「わが子よ、この宝鏡を見ることを、私を見るのと同じようにし、寝所を同じくし、御殿をともにして、祭る鏡としなさい」と仰せになっている。この神勅は、現代の国民道徳と神道の重要な部分である、祖先崇敬の淵源である。また、この命と同時に、大神は高天原で治める斎庭の稲穂を授けた。これは新嘗祭のためのものであるとともに、わが国民が一日も欠くことのできないものであり、保食神に関する伝えとともに、祭祀と仁政の淵源である。そのほか大神は、穀物の栽培、養蚕、織物などの手本を示している。また、素盞鳴尊が天に上ったときには、大いに武備を整え、身には十握の剣、九握の剣、八握の剣を帯び、背に矢入れを負い、手に弓矢を握り、自ら防いだと伝えられる。これは、大神が武備にも細かな注意を払ったことを明らかにするものである。このような古伝は、まだ多くあるが、今述べたような一種の偏見を持つ人は、ほとんど何の価値も認めないかもしれない。しかし、正統な日本人の血が血管に流れるわが国民であれば、釈迦・キリスト・ソクラテスほどの聖人にも、なお説きえなかった尊厳な大道を示した天照大神の徳を仰ぎ、人類永遠の手本として尊び慕わない者はいない。こうして、伊勢大神宮の威光は、天地とともに、きわまりないことを知るべきである。"

- "id": "st-0016-002"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "想ふに輓近の我が學界、思想の研究盛に行はれ文化運動頻りに高調せられ、實に空古の偉觀を呈して居る。けれど深くその眞相を觀察すれば、遺憾ながら、西洋文化の翻譯と云はなくてはならぬ。西洋思想の模倣と云はなくてはならぬ。勿論陸海軍備の制度、殖產興業の組織、其の他文學科學等の學術技藝、之れを模倣し、之れを翻譯する敢へて不可なきのみならず、大いに之れを奬勵しても可なりである。唯、夫れ我が國家成立の根本思想に至つては、斷じて我が固有獨自のものによらなくてはならぬ。之れをも模倣するに至つては我が國民は永久に歐米を師としなくてはならぬ。永久に歐米の後塵を拜さなくてはならないのである。是れ豈に大和魂を有する我が國民の堪へ得る所であらうか。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 15
    "url": "https://dl.ndl.go.jp/pid/943657/1/16"
  "translation_ja": "近ごろのわが学界を思うと、思想の研究は盛んに行われ、文化運動がしきりに唱えられ、まことに前例のない壮観を見せている。しかし、その実情を深く観察すると、残念ながら、西洋文化の翻訳、西洋思想の模倣と言わなくてはならない。もちろん、陸海軍の制度や産業振興の仕組み、そのほか文学・科学などの学術や技芸を模倣し、翻訳することは、決して悪くないばかりか、大いに奨励してもよい。ただし、わが国の成立の根本にある思想に至っては、断じて、わが国固有の独自のものに基づかなくてはならない。この根本思想までも模倣するようでは、国民は永久に欧米を師とし、永久に欧米の後を追わなくてはならなくなる。大和魂を持つわが国民に、そのようなことが耐えられるだろうか。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "想ふに輓近の我が學界、思想の研究盛に行は、れ文化運動頻りに高調せられ、實に空古の偉觀を呈して居る。けれど深くその眞相を觀察すれば、遺憾ながら、西洋文化の翻譯と云はなくてはならぬ。西洋思想の模倣と云はなくてはならぬ。勿論陸海軍備の制度、殖產興業の組織、其の他文學科學等の學術技藝、之れを模倣し、之れを翻譯する敢へて不可なきのみならず、大いに之れを奬勵しても可なりである。唯、夫れ我が國家成立の根本思想に至つては、斷じて我が固有獨自のものによらなくてはならぬ。之れをも模倣するに至つては我が國民は永久に歐米を師としなくてはならぬ。永久に歐米の後塵を拜さなくてはならないので、ある。是れ豈に大和魂を有する我が國民の堪へ得る所であらうか。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0016-003"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "以上の諸點から我々は大いに神道哲學を研究し、之れを神髓とし、西洋文化を日本化して之れを皮肉とする、我が國民獨自の人生觀·世界觀を開拓するを必要とするのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 15
    "url": "https://dl.ndl.go.jp/pid/943657/1/16"
  "translation_ja": "以上の点から、私たちは神道哲学を大いに研究して、その真髄を自らの精神とし、西洋文化を日本化して、その肉体とするような、わが国民独自の人生観・世界観を切り開く必要があるのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "以上の諸點から我々は大いに神道哲學を〓究し、之れを神髓とし、西洋文化を日本化して之れを皮肉とする、我が國民獨自の人生觀·世界觀を開拓するを必要とするのである。"

- "id": "st-0131-003"
  "section_id": "chapter-12-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "以上述べ來つた所で、世間の神道を、「やれ宗教だ」「やれ道徳だ」として取り扱ふことの間違つて居ることが、明になつたらうと思ふ。元來、世間で云ふ宗教、即ち佛教や基督教は已に述べた通り、神道と根本的性質を異にして居るのである。神道は彼れ等の品彙匹儔を超越して居るのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 130
    "url": "https://dl.ndl.go.jp/pid/943657/1/131"
  "translation_ja": "以上に述べたことから、世間で、神道を、宗教だ、道徳だと扱うことの間違いは明らかになったと思う。もともと、世間のいう宗教、すなわち仏教やキリスト教は、すでに述べたとおり、神道とは根本的な性質が異なる。神道は、それらと同じ種類のものという枠を超えているのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "以上述べ來つた所で、世間の神道を、「やれ宗〓だ」「やれ道徳だ」として取り扱ふことの間違つて居ることが、明になつたらうと思ふ。元來、世間で云ふ宗〓、即ち佛〓や基督〓は已に述べた通り、神道と根本的性質を異にして居るのである。神道は彼れ等の品彙匹儔を超越して居るのである。"

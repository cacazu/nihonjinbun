- "id": "st-0007-002"
  "section_id": "reading-guide"
  "kind": "list_item"
  "origin": "source"
  "source_text": "一曰はく社家神道、曰はく復古神道、曰はく古神道。世、神道と稱するもの甚だ多し著者の主張は純神道也。純なる我が固有の大道也。已に純也。是れ特に形容詞を冠せざる所以也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 6
    "url": "https://dl.ndl.go.jp/pid/943657/1/7"
  "translation_ja": "一、社家神道、復古神道、古神道など、世間で神道と呼ばれるものはたいへん多い。著者が主張するのは純神道である。純粋な、わが国固有の大道である。すでに純粋なのだから、特に形容する言葉を冠しない。"
  "translation_status": "reviewed"
- "id": "st-0007-003"
  "section_id": "reading-guide"
  "kind": "list_item"
  "origin": "source"
  "source_text": "一本書は小册子にして、僅に著者の研究の一部を收むるに過ぎざりしを憾みとす。然れども著者は、全卷を通じて著者の神道に對する信念を、可及的徹底的に發表したるを信ずるもの也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 6
    "url": "https://dl.ndl.go.jp/pid/943657/1/7"
  "translation_ja": "一、本書は小冊子で、著者の研究の一部を収めるにとどまったのは残念である。しかし全巻を通じ、神道に対する著者の信念を、できるだけ徹底して述べたものと信じている。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "一本書は小册子にして、僅に著者の〓究の一部を收むるに過ぎざりしを憾みとす。然れども著者は、全卷を通じて著者の神道に對する信念を、可及的徹底的に發表したるを信ずるもの也。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0007-004"
  "section_id": "reading-guide"
  "kind": "list_item"
  "origin": "source"
  "source_text": "一著者の曩日の著『神道本義』亦然るも、彼れは神道の實際的方面を主とし、此れは學理的方面を主とせり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 6
    "url": "https://dl.ndl.go.jp/pid/943657/1/7"
  "translation_ja": "一、著者の以前の著書『神道本義』も同じ立場にあるが、そちらは神道の実際的な面を主とし、本書は理論の面を主としている。"
  "translation_status": "reviewed"
- "id": "st-0008-001"
  "section_id": "reading-guide"
  "kind": "list_item"
  "origin": "source"
  "source_text": "一本書は學理的方面を主とするも、文章は成るべく平易に、通俗に、且つ簡潔ならんことに努めたり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 7
    "url": "https://dl.ndl.go.jp/pid/943657/1/8"
  "translation_ja": "一、本書は理論の面を主としているが、文章はできるだけ平易で、一般にも分かりやすく、しかも簡潔になるよう努めた。"
  "translation_status": "reviewed"
- "id": "st-0008-002"
  "section_id": "reading-guide"
  "kind": "list_item"
  "origin": "source"
  "source_text": "一本書は文章を簡潔にせんが爲に、敬語は多く省略に從ひたり。而かも叙述の態度は、徹頭徹尾敬虔的ならんことを期したるは勿論也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 7
    "url": "https://dl.ndl.go.jp/pid/943657/1/8"
  "translation_ja": "一、文章を簡潔にするため、敬語は多くを省略した。ただし、叙述の態度は終始一貫して敬虔であるよう心がけたことは、いうまでもない。"
  "translation_status": "reviewed"
- "id": "st-0008-003"
  "section_id": "reading-guide"
  "kind": "list_item"
  "origin": "source"
  "source_text": "一本書の校正は、大いに努めたるも、尙魯魚の誤り、往々にしてあるべきを虞る。讀者の諒恕を希ふて止まざる也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 7
    "url": "https://dl.ndl.go.jp/pid/943657/1/8"
  "translation_ja": "一、本書の校正には十分努めたが、それでも文字の取り違えなどの誤りが、ときおり残っているのではないかと心配している。読者のご容赦を願ってやまない。"
  "translation_status": "reviewed"
- "id": "st-0008-004"
  "section_id": "reading-guide"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "大正七年三月十九日著者又識"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 7
    "url": "https://dl.ndl.go.jp/pid/943657/1/8"
  "translation_ja": "大正七年（一九一八年）三月十九日。著者、重ねて記す。"
  "translation_status": "reviewed"

  "source_text": "で、此の第七代の伊弉諾尊、伊弉册尊に至つて、此の國土も、もう十分に完成して居る。けれども尙、修理固成を要するのは、勿論である、二神の經營を俟つのは云ふまでもない。そこで伊弉諾、伊弉冊の二神は天津神の命に從つて、此の國土を修理固成せられると云ふことになるのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 67
    "url": "https://dl.ndl.go.jp/pid/943657/1/68"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 68
    "url": "https://dl.ndl.go.jp/pid/943657/1/69"
  "translation_ja": "この第七代の伊弉諾尊・伊弉冊尊に至って、国土もすでに十分に完成していた。しかし、なお整え固める必要があり、二神の経営を待つのは、もちろんのことである。そこで二神は、天津神の命に従い、この国土を整え固めたということになるのである。"
  "translation_status": "reviewed"

- "id": "st-0067-002"
  "section_id": "chapter-06-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それから今度は四代目、角杙神活杙神が出られた。此の二神の御名は總べて物の僅に成り初めて、例へば尾だの頭だの手だの足だのと云ふもゝ分ちが未だ出來ない所のものを都怒と云ふのである。久比と云ふのは、物の初めて萠し生る意味である。であるから詰り都怒具比と云ふのは、神の御形の生り初め給へる義に申上げたので活杙と申すのは其の生り初めた御形が活き動き初めらるゝ形に申上げたのである。未だ形は何とも分らないけれども、御動なさつて居る場合に申す所の御名であるとは、宣長の解釋であるが、篤胤も亦、「角具比、活具比とはかの初土砂土の稍固まるべき芽を含みたるほどに成り坐る義を以つて、其時の趣と成り坐る神の御身の成れる狀とを兼て負せ奉れる御名なるべし」と述べて居る。詰り一言で言へば角杙活杙と申す神は先きに述べた宇比地、須比智が段々固つて來て、一つの神と成りませる御體の狀態に就いて申上げた名前である。斯う解釋するのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 66
    "url": "https://dl.ndl.go.jp/pid/943657/1/67"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 67
    "url": "https://dl.ndl.go.jp/pid/943657/1/68"
  "translation_ja": "今度は第四代の、角杙神と活杙神が現れた。この二神の名については、物がわずかにでき始め、たとえば尾や頭、手や足といった区別がまだできないものを「つの」といい、「くひ」は、物が初めて芽生えるという意味である。だから、「つのぐひ」は、神の姿が初めて生じたという意味で申し上げた名である。「いくぐひ」は、その生まれ始めた姿が、生きて動き始めるありさまから申し上げた。まだどんな形か分からないが、動いておられる場合の名だ、というのが宣長の解釈である。篤胤もまた、「角具比・活具比とは、あの初めの泥土が、少しずつ固まる芽を含むほどになったという意味から、その時代のありさまと、神として成り出る身体の状態とを兼ねて捧げた名だろう」と述べている。つまり一言でいえば、角杙・活杙という神は、先に述べた宇比地・須比智が次第に固まってきて、一柱の神として成り出る身体の状態に即して申し上げた名なのである。このように解釈するのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "それから今度は四代目、角代神活代神が出られた。此の二神の御名は總べて物の僅に成り初めて、例へば尾だの頭だの手だの足だのと云ふもゝ分ちが未だ出來ない所のものを都怒と云ふのである。久比と云ふのは、物の初めて萠し生る意味である。であるから詰り都怒具比と云ふのは、神の御形の生り初め給へる義に中上げたので港代と申すのは其の生り初めや新形が治き動きゝ形に申上げたのである。未だ形は何とも分らないけれども、御動なさつて居る場合に申す所の御名であるとは、宣長の解釋であるが、篤胤も亦、「角具比、活具比としたがの初主砂主の補固まるべき芽を含みたるとどり成ミ義を以時の趣と成り坐る神の御身の成れる狀とを兼て負せ奉れる御名なるべし」と述べて居る。詰り一言で言へば角代活杙と申す神は先きに述べた宇比地、須比智が段々固つて來て、一つの神と成りませる御體の狀態に就いて申上げた名前である。斯う解釋するのである。"

    "text": "それから山崎闇齋派の神道家に玉木葦齋と云ふ人がある。此の人は、古傳に七代一代、一代七代と云ふことがある。此の七代の神は、もと國常立尊の大氣元靈より化生し給ひ、國土成り定まり、諾冊二尊氣化し給へば、上へ說きのぼせば國常立尊の御一代に約まり、下へ說き下せば諸、冊二尊に約まるのである」。斯ふ云ふ工合に解釋して居る。即ち此の玉木葦齋の說に依つて見ると、陰陽五行の精髓が妙合して、さうして茲に諾、冊二尊を化生し給へるものであるから、七代と云ふは、此の諾、冊二尊の御出になる道筋を、神格化したのに過ぎないのである。であるから七代は一代であると云ふのであると云ふ風に解釋して居る。で、親房、葦齋などと申す學者の如きは、陰陽五行に附會して、さうして之れを二代、若くは一代に約めてしまはふと、企てたのである。"

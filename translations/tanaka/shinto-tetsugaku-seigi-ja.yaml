  "translation_ja": "私たちが日ごろ目にする机、本、時計など、どんな道具でも、それができるのは人間が造るからである。ひとりでにできるということは、どうもないようだ。ひとりでにできると言えなくもないものもあるかもしれないが、家屋や衣服、日常の調度品など、多くの必需品は、すべて誰かが造る。こう考えていくと、この天地も、やはり誰かが造ったのではないか、造ったに違いない、ということになる。そこでキリスト教では、神が七日間で天地を造ったという説を伝える。神道でも、学者の中に同じような考えが起こり、『古事記』や『日本書紀』を、その見方で解釈しようとする人が現れる。本居・平田の二人などが、それである。本居宣長は、この世界は高皇産霊神・神皇産霊神が造ったもので、天地をはじめ、あらゆる万物は皆、この二神が造ったのだと言っている。しかし、古い伝承を調べると、イザナギ尊・イザナミ尊が国を生み、島を生み、山や川、日の神、月の神を生んだということは、すべて記されているが、高皇産霊神・神皇産霊神が天地や万物を造ったという記述は一つもない。まったくないのである。それでも、この二神が天地を造ったと唱えるには、何か証拠がなくてはならない。そこで宣長や篤胤は、その証拠として、日の神と月の神の託宣を挙げている。"

  "translation_ja": "わが国の古代にも、すでに神という観念があった。そのころ、わが国には、すでにさまざまな神々が現れていた。イザナギ・イザナミの二神や、天照大神などの神々が、古代にいらっしゃったのである。同時に、この時代には、無知で道理に暗い下層の人々も、かなり大勢いた。『古事記』や『神代紀』を見ると、昔の人は皆、神のように見え、神代には神ばかりいたように思われる。学者の中にも、そう考える人がいるようだ。神武天皇が東征に出たとき、釣りをしている漁師に出会い、その者が「私は国つ神の何々です」と言う。釣りをしている者も神である。このように、神代のものは何でも皆、神だと考える人もいる。しかし、どうもそうではないらしい。いわゆる神代にも、普通の人々は大勢いた。その証拠に、イザナギ・イザナミの話では、イザナギ尊が、一日に千人を殺すと言い、イザナミ尊は千五百人を産むと言っている。そうすると、差し引き五百人ずつ増えていく計算である。そのほか、天照大神の言葉にも、「青人草」という語がいろいろと出てくる。たとえば、保食神がスサノオ尊に殺されたとき、その体から五穀が出た。天照大神はそれを見て、「これは青人草が食べて生きるべきものだ」と言い、たいへん喜んだ。また、イザナミ尊が黄泉の軍勢を率いてイザナギ尊を攻めたとき、イザナギ尊は桃の実に助けられた。そこでイザナギ尊は大いに感心し、桃の実に、「おまえは、よく私を助けてくれた。この葦原の中つ国の青人草が、苦難に陥って悩むときには、私を助けたように助けてくれ」と言った。このような記述から、そのとき青人草と呼ばれる者が大勢いたと分かる。青人草とは、神代の、いわゆる神ではない人々のことであり、当時は大勢いたのである。その人々から見れば、イザナギ・イザナミ尊や天照大神は、まことに、かけ離れて尊く、優れ、偉大な方々だった。この偉大で優れ、尊い方々を、当時の人々が広く敬い、「お上」として従ったのは当然であり、神とするに至ったのも、自然な順序である。同時に、当時の神々自身も、その権威・崇高さ・偉大さによって、人々の頭となり、長となり、つかさとなり、支配者・統治者となり、さらに主権者となって、ついには自ら神と名乗ったのだと思われる。神の起源は、このようなものであるが、さらに進むと、天地や山川にも霊的な存在を認め、それを主宰する神とするに至った。要するに、神道の神とは、人々の中で優れ、偉大で、尊く、上に位置する方々、また、人々がそのように考えている方々をいう。その結果、神は本来、形のある存在であるはずだが、そう考えられた神には、形のない神も存在しうる。だから、過去に存在した神も、やはり神として尊び、現在の人についても神と言うのである。そして先に述べたように、伝説では、古代の人々は知識も徳も、すべての点で劣っていたので、たとえば狼や虎、狐のようなものでも、ある場合に、自分ではどうにもできないと見れば、すぐ神としたのである。"

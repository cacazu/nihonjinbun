  "source_text": "『日本書紀』の景行天皇の時に、天皇が熊襲征伐の爲に、周防にお出でに成つた時、その地方の頭の神夏磯媛が磯津山の賢木を拔き取つて、上の枝には八握の劍をかけ中の枝には八咫の鏡をかけ、下の枝には八坂瓊をかけて白旗を船の舳に立てゝ參向したといふ事があるし、仲哀天皇の熊襲征伐の時には、岡の縣主の祖、熊鰐が、天皇の御出でになるのを聞いて、五百枝の賢木を拔き取つて九尋の船の舳に立て上の枝には白銅の鏡をかけ中の枝には十握の劒をかけ下の枝には八坂瓊をかけ、周防に參迎へたといふ事がある。なほ其の時には筑紫の伊覩縣主の祖、五十迹手も亦、天皇の出でますを聞いて五百枝の賢木を拔きとつて之れを船に立て、上の枝には八坂瓊を取りかけ、中の枝には白銅の鏡をかけ、下の枝には十握の劒をかけ長門の引島に迎へて、之れを獻つたのである。其の時五十迹手の言葉に「臣敢えて此の物を獻る所以のものは、天皇、八坂瓊の曲れるが如くに、たえに天の下しろしめせ、又、白銅の鏡の如くに、明かに山川海原を見そなはせ、此の十握の劒をとりひさげて天の下を平けたまへ」と申上げた。すると、天皇は大いに之れを御賞美なさつたといふ事である。此の言葉は、其の外に餘り信用は出來ないとしてあるが『神皇實錄』『天口事書』といふ風な本にも戴つて居るので、如何も五十迹手が考へた言葉でも無いやうに思はれる。多分、斯ういふ言葉が、古くから有つたものでは無いかと思はれるのである。とにかくかゝる思想がふるくから存在したものと思はれる。さうして見ると、天照大神の御心の中に、或は之れに類した御考が有つたので無いかと思ふのも、無理な推察ではないと思ふ。賴山陽は、天照大神の御德の偉大なることは、窺測することは容易に出來ないけれども、之れを神器に就いて見れば何とか言へる樣に思はれる。天壤無窮の神勅の後世に赫々たる事實と成つて表はれて居るのを以つて見ても、其の始に、天照大神が神器に託して其の德を表はされたのでは無いかといふことが想像せられるといふ風に言つて居るが甚だ穩健な考のやうに思はれる。久保季茲といふ人は『三種神寶論』といふ書に「もとより大御神の御心にさる小賢しき理窟を以つて授け給へるには非ざれども、自然に其の理にかなふめり。」と言つて居るが、當時支那では、頻りに知仁勇などの說が唱へられ、西洋では眞善美といふやうな考が已に有つたのであるからして、さうして見ると、世界無比の我が國體の淵源をたてられ、雄大な神勅を下し給はつた天照大神の御心に、自ら斯かる御考が出來たのでは無いかと思はれる。當時、貴い器物は他にまだ澤山あつたに相違ないが、其の澤山な器物の中から特別に此の三種を御選び出されたといふのには、餘程深い意味が無くてはならない。儒者の說くやうな意味は別として置いても、此の三種を最も貴重な器物として御授けに成つて、其れが、我が國の神器として萬世に傳へられて居るといふのは、實に有難いことである。印度では、轉輪王の世に七寶が具足して居たといふ事である。福力の感ずる所で有つたのであらうけれども、我が國の神器の樣に、傳へられた所のものではない。又、支那では、九鼎を以つて寶として夏殷周皆相傳へて居つたけれども、其の鼎は夏の禹王の鑄造した所といふのであつて、後世には傳らない。秦より以來傳國の璽といふのがあつて始皇の製する所で、李斯の書いたのであるといふし、又漢では斬蛇劒を傳國の寳としたといふが之れ又、我が國の神器に比較せば、同日に論ぜらるべきものでない。獨逸などでも十種の神寶といふ樣な物が有るといふ事であるけれども、勿論、我が國の神寶とは到底比較には成らないのである。獨り我が國にのみ斯かる神器が傳はつて、其の光天日と相ひとしいのは、實に、我々國民の光榮としなくてはならない。"

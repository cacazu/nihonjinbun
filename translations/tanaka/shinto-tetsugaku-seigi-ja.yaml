- "id": "st-0112-003"
  "section_id": "chapter-10-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "神道は宗教と見るべきものだか。どうか。此の問題は以前からの大問題である。之れ對して著者は、已に久しく著書に、雜誌に、講演に、著者の動かすべからざる解決と信ずる解決を與へて置いたが、今日尙疑ふ人もあるやうであるから、茲に聊か之れついて述ぶることゝする。元來此の問題を明確にするには、先づ宗教の意味を定めなくてはならぬ。處が、世間では多く宗教と云ふものの言葉もきめないで彼れ此れ云ふのだから、その斷定は確實に行かない。その上、神道と云ふものについても、明確な概念を持つて居ないのだから恰も鯨尺と曲尺とを二人が有つて居つて、さうして伸縮不定のゴム線の長さを計らんとする樣なものである。各〻勝手な事を云ふに過ぎない。であるから先づ神道と云ふものを一定してかからなくてはならない。よし神道と云ふ假りに長さが一定して居ても宗教と云ふ尺度がきまらんと云ふと鯨尺を持つて居る者は、此の絲の長さは八寸だと云ふ。曲尺を持つて居る者はイヤ一尺だと云ふ。計つて見るに正しく八寸しかないと言ふ。そんなことがあるものか、計つて見ると正しく一尺あるぢやないか。ナーニそんなことはない八寸だ。イヤそんなことはない一尺だ。等しく同長の絲であつても、標準が間違ふと云ふとさう云ふやうなものだ。何時まで議論して居つても解決の時期はない。神道に對してもたとひ之れを萬人同樣に解しても、宗教と云ふものの考を先づ定めないで、色々な考を有つて居つて、神道は宗教である。イヤ宗教でないと爭ふのは、鯨尺と曲尺とで計つて居つて、さうして議論して居るやうなものである。何時まで經つても解決の時期は無いのである。であるから神道は、以上述べ來つたやうなものとして、茲には進んで宗教と云ふものの概念を定めることが必要になつて來る。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 111
    "url": "https://dl.ndl.go.jp/pid/943657/1/112"
  "translation_ja": "神道は宗教と見るべきものか、どうか。この問題は、以前からの大問題である。これに対して私は、すでに長年、著書や雑誌、講演で、自分では動かしようのない解決と信じる答えを示してきた。しかし、今日なお疑う人もあるようなので、ここで少し述べることにする。もともと、この問題を明確にするには、まず宗教の意味を定めなければならない。ところが世間では、多くの場合、宗教という言葉の意味も決めずにあれこれいうため、確実な結論にならない。その上、神道についても明確な概念を持たないのだから、二人がそれぞれ鯨尺と曲尺を持ち、伸び縮みして長さの定まらないゴムひもを測ろうとするようなものである。各自、勝手なことをいうにすぎない。だから、まず神道というものを定めてかからなければならない。仮に、神道というひもの長さが一定していても、宗教という尺度が決まっていなければ、鯨尺を持つ者は、このひもは八寸だといい、曲尺を持つ者は、いや一尺だという。測れば確かに八寸しかない、そんなはずはない、測れば確かに一尺あるではないか、いや八寸だ、いや一尺だと争う。同じ長さのひもでも、標準が違えば、このようなことになる。いつまで議論しても解決しない。神道を誰もが同じように理解していても、宗教についての考えを先に定めず、それぞれ違う考えを持ったまま、神道は宗教だ、いや宗教ではないと争うのは、鯨尺と曲尺で測りながら議論するようなものである。いつまでたっても解決しない。だから、神道は以上に述べてきたものとした上で、ここではさらに、宗教というものの概念を定める必要がある。"
  "translation_status": "reviewed"

- "id": "st-0004-002"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "明治維新を去る未だ久しからざりし時、某れの中學校に、漢文教師あり。英吉利を讀みてエイキツリと云ふ。一生問ふ。「イギリスと讀むにあらずや」と。教師聲を勵まして曰はく、「咄!沒分曉漢!僕は正に先師より、しかく教はりたり」と。近世、吉川惟足、度會延佳、山崎闇齋等の諸老先生、盛に祕傳なるものを唱へて以來、神道の研究には傳統の說を墨守するの風を生じたり。後荷田、賀茂、本居平田四大人相承けて出で、熱心に神道の哲學的研究を行ひ、傳統の弊を除きたりと雖も、教權的態度は、むしろその著しきを思はしむるものありき。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 3
    "url": "https://dl.ndl.go.jp/pid/943657/1/4"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 4
    "url": "https://dl.ndl.go.jp/pid/943657/1/5"
  "translation_ja": "明治維新からまだそれほど年月がたっていなかったころ、ある中学校に漢文の教師がいた。「英吉利」を「エイキツリ」と読むので、一人の生徒が「イギリスと読むのではありませんか」と尋ねた。教師は声を荒らげ、「こら、物の道理の分からぬやつめ。私は亡くなった先生から、まさしくそう教わったのだ」と言った。近世、吉川惟足、度会延佳、山崎闇斎らの先生方が盛んに秘伝というものを唱えて以来、神道の研究には伝統の説をかたくなに守る風潮が生まれた。その後、荷田・賀茂・本居・平田の四大人が相次いで現れ、熱心に神道の哲学的研究を行って伝統に伴う弊害を取り除いたとはいえ、教説の権威を絶対視する態度は、かえって著しくなったと思わせるところがあった。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "明治維新を去る未だ久しからざりし時、某れの中學校に、漢文〓師あり。英吉利を讀みてエイキツリと云ふ。一生問ふ。。「イギリスと讀むにあらずや」と。〓師聲を勵まして曰はく、「咄!沒分曉漢!僕は正に先師より、しかく〓はりたり」と。近世、吉川惟足、度會延佳、山崎闇齋等の諸老先生、盛に祕傳なるものを唱へて以來、神道の〓究には傳統の說を墨守するの風を生じたり。後荷田、賀茂、本居平田四大人相承けて出で、熱心に神道の哲學的〓究を行ひ、傳統の弊を除きたりと雖も、〓權的態度は、むしろその著しきを思はしむるものありき。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0005-001"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "予や不敏、敢へて自ら揣らず、夙に、由來西洋に發達せる思想と教育とを研究し、之れを骨肉とし、日本固有の思想と教育とを研究し、之れを精神とし、以つて一の學的系統を組織し、我が國民教育に貢獻せんことを期せり。而して日本固有の思想の研究は、予をして神道の研究に入らしめぬ。是れ予が學生の當時より教育學と神道との二者を並せ研究し來れる所以也。茲に二者と云ふ。予を以つて見れば二者はもと二ならず。一也。即ち教育學にして、帝國憲法、教育勅語その他神道の根柢たるものに基かざれば、その研究せられたる教育も、我が國にありては、空論たるを免れず。神道にして、教育學的立脚地より研究せられざれば、到底世に徹底的指導を與ふる能はずして、亦空論たらんのみ。予が神道と教育學との研究に從事せる偶然にあらざる也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 4
    "url": "https://dl.ndl.go.jp/pid/943657/1/5"
  "translation_ja": "私は不才ながら、あえて身の程も顧みず、早くから西洋で発達した思想と教育を研究して、それを骨肉とし、日本固有の思想と教育を研究して、それを精神として、一つの学問体系を組み立て、わが国の国民教育に貢献したいと考えてきた。日本固有の思想の研究が、私を神道の研究へ導いた。学生時代から教育学と神道の両方を研究してきたのは、このためである。ここでは二つと言ったが、私の考えでは、もともと二つではなく一つなのである。教育学が帝国憲法や教育勅語など、神道の根底をなすものに基づかなければ、その教育研究はわが国では空論になるのを免れない。また神道も、教育学の立場から研究されなければ、社会に徹底した指導を与えることができず、やはり空論に終わるだけだ。私が神道と教育学の研究に従事してきたのは、偶然ではない。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "予や不敏、敢へて自ら揣らず、夙に、由來西洋に發達せる思想と〓育とを研究し、之れを骨肉とし、日本固有の思想と〓育とを研究し、之れを精神とし、以つて一の學的系統を組織し、我が國民〓育に貢獻せんことを期せり。而して日本固有の思想の〓究は、予をして神道の〓究に入らしめぬ。是れ予が學生の當時より〓育學と神道との二者を並せ〓究し來れる所以也。茲に二者と云ふ。予を以つて見れば二者はもと二ならず。一也。即ち〓育學にして、帝國憲法、〓育勅語その他神道の根柢たるものに基かざれば、その研究せられたる〓育も、我が國にありては、空論たるを免れず。神道にして、〓育學的立脚地より研究せられざれば、到底世に徹底的指導を與ふる能はずして、亦空論たらんのみ。予が神道と〓育學との研究に從事せる偶然にあらざる也。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0005-002"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "已に神道の研究に從事するに當りて、先づ感ぜるは、從來多くの學者の研究的態度の墨守的教權的たること是れ也。若し神道をして佛耶二教の如き、單純なる一宗教たらしめば、かくても必ずしも不可なかるべし。而かも予の如く、之れを以つて學術の根柢とし、進んで現代文明の空氣を呼吸せる靑年を指導せんとするには、決してその可なるを見る能はず。かくて予は神道研究に於いて不敏ながら聊か新しき試みを企てたり。名けて神道哲學と云ふ。神道に向つて可及的科學的研究を行はんとするもの也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 4
    "url": "https://dl.ndl.go.jp/pid/943657/1/5"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 5
    "url": "https://dl.ndl.go.jp/pid/943657/1/6"
  "translation_ja": "神道の研究を始めて、まず感じたのは、従来の多くの学者が、伝来の説を守り、教説の権威を絶対視する態度で研究していたことだった。仮に神道が、仏教やキリスト教のような、一つの宗教にすぎないのであれば、それでも必ずしも悪くはないだろう。しかし私のように、神道を学問の根底に据え、さらに現代文明の中に生きる青年を指導しようとするには、決してそれでよいとは思えない。そこで私は、不才ながら、神道研究に少し新しい試みを企てた。それを神道哲学と名づける。神道を、できるだけ科学的に研究しようとするものである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "已に神道の〓究に從事するに當りて、先づ感ぜるは、從來多くの學者の研究的態度の墨守的〓權的たること是れ也。若し神道をして佛耶二〓の如き、單純なる一宗〓たらしめば、かくても必ずしも不可なかるべし。而かも予の如く、之れを以つて學術の根柢とし、進んで現代文明の空氣を呼吸せる靑年を指導せんとするには、決してその可なるを見る能はず。かくて予は神道〓究に於いて不敏ながら聊か新しき試みを企てたり。名けて神道哲學と云ふ。神道に向つて可及的科學的研究を行はんとするもの也。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0006-001"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "本書は素より區々たる小册子。而してその稿の大部分は、已に十餘年前に成れるものにして、甞て國學院大學に於いて講ぜる事もありき。今や江湖の特志諸賢より、その上梓を求めらるゝこと屢々なるを以つて、即ち凾底より出だし、修正改補、敢へて之れを印刷に附することゝなせり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 5
    "url": "https://dl.ndl.go.jp/pid/943657/1/6"
  "translation_ja": "本書は、もとよりささやかな小冊子である。原稿の大部分はすでに十数年前にできており、かつて国学院大学で講義したこともあった。近ごろ、その刊行を求める声が、関心を寄せる世間の方々からしばしば届くようになったので、箱の底から取り出し、修正と補足を加え、思い切って印刷することにした。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "本書は素より區々たる小册子。而してその稿の大部分は。已に十餘年前に成れるものにして、甞て國學院大學に於いて講ぜる事もありき。今や江湖の特志諸賢より、その上梓を求めらるゝこと屢〓なるを以つて、即ち凾底より出だし、修正改補、敢へて之れを印刷に附することゝなせり。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0006-002"
  "section_id": "preface"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "今や歐露の風雲愈々急にして、東洋の天地亦益々多事ならんとす。此の時に當り、此の書を公にす。聊か我が國固有の思想の發展に資し、我が國民向上の信念に貢獻する所あらば予の光榮とする所也。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 5
    "url": "https://dl.ndl.go.jp/pid/943657/1/6"
  "translation_ja": "今、ヨーロッパとロシアの情勢はいよいよ切迫し、東洋もまた、ますます多事多難になろうとしている。この時に当たり、本書を世に送る。わが国固有の思想の発展をいくらかでも助け、国民の向上を願う信念に貢献できるところがあれば、私にとって光栄である。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "今や歐露の風雲愈〓急にして、東洋の天地亦益〓多事ならんとす。此の時に當り、此の書を公にす。聊か我が國固有の思想の發展に資し、我が國民向上の信念に貢獻する所あらば予の光榮とする所也。"

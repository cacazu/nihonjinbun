    "text": "皇朕れ謹み畏み皇祖皇宗の神靈に詰け白さく、皇朕れ天壤無窮の宏謨に循ひ、惟神の寳祚を承繼し、舊圖を保持して敢て失墜すること無し。顧みるに世局の進運に膺り人文の發達に隨ひ、宜く皇祖皇宗の遺訓を明徴にし、典憲を成立し、條章を昭示し、內は以て子孫の率由する所と爲し、外は以て臣民翼贊の道を廣め、永遠に遵行せしめ、益〓國家の丕基を鞏固にし、八洲民生の慶福を增進すべし。玆に皇室典範及憲法を制定す。惟ふに此れ皆皇祖皇宗の後裔に貽したまへる統治の洪範を紹述するに外ならず。而して朕が躬に逮て時と倶に擧行することを得るは、洵に皇祖皇宗及我が皇考の威靈に倚藉するに由らさるは無し。皇朕れ仰て皇祖皇宗及皇考の神祐を禱り、併せて朕が現在及將來の臣民に率先し、此の憲章を履行して愆らざらむことを誓ふ"

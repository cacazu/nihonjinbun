  "source_text": "又平田篤胤は、古傳に此の高皇產靈神、神皇產靈神は二神であると傳はつて居るのを、宣長が是れは二神のやうであるが、實は一神ではないかと疑つて居る事を駁擊して、自らは高皇產靈神は男神に在はして、神皇產靈神は女神に在はす。而して高皇產靈神は產靈の外事を掌られ、神皇產靈神は產靈の內事を掌らるゝのである。斯う云ふやうに解釋して居る。さうして此の二柱の男女の大神が諸々の神達を產み給へるのは、唯、其の男女の產靈の互に萠し合ふ奇しき御德に依つて產み爲し給へるので、決して夫婦の道に依られるのではない。是れが產靈の大いなる御德である。此の二神の御德に依つて、諸々の神ばかりでない、有ゆる物體、更には天地をさへに造り出されたのである。斯う言ふて居る。而して、此の產靈神が天地を造られたと云ふことに就いては、外國の學問などを惡くしそこなつた學者ども又其の學問がない者でも生意氣な連中は、自分が此の世に生れて來たのは、詰り此の產靈神に依るのであると云ふことさへも知らないので、此の產靈神が天地萬物を產み造られたと云ふことを言ふと、日本の國ばかりの昔語りのやうに聞き流して居る連中も多い。けれども是れは此の國限りの說ではなくして、何處の國にも無論其の傳がある。支那では其の名を元始天尊と言ひ、印度では太梵天王と申す。其の旨が皇國の古傳に少しも違はない。であるから釋迦も達磨も猫も鼬も皆此の大神の產靈に成れる物なるに論はない。ゆめゆめ支那や印度の末學に惑はされて此の大神を疎かにしてはならない。斯う篤胤は說いて居る。さうして篤胤は尙、歩を進めて、天竺より遙か西の方にも澤山の國があつて、其の國々もそれぞれに天津神が天地を初め萬の物を御造りなされたと云ふ傳が各々あると云ふ風に言つて、さうして我が古傳の產靈神を以つて、此の天帝梵天、造物主と同一であると解釋して來たのである。けれども高皇產靈神があの高木神として、天孫降臨の際に活動遊ばした所の神と同一の神であるとすると、どうもそこが妙に聞えて來る。"

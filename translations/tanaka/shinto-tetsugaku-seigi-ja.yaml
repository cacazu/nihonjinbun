  "source_text": "天御中主神を絕對其のものに解釋することは幾多の學者の執つて居る所であるから、その說き方に於いての外は、格別事新しい說ではないのである。が、高皇產靈、神皇產靈二神に對しては、私が十餘年前から講じて居る私の解釋が從來見ない所の解釋-少くとも私が今まで神道を研究した上に於いて、他の學者の唱へた事を見ない所の說である。勿論今日では大分賛成者もあるやうであるが、要するに私が創めて考へた說であると信ずるのである。其の說はどう云ふのかと云ふと、此の高皇產靈神、神皇產靈神と云ふ神を以つて、天御中主神と同一の神に在して、二神は天御中主神の顯現にましますと云ふのである。勿論斯う云ふ說に就いては、鈴木重胤と云ふ學者が「此の二柱の神は天御中主尊の荒魂和魂に在し給へるものと推し測り奉らる」と云ふことを言つて居られる。即ち荒魂和魂を以つて解釋されて居らるゝ。私の說の類似の說を求むれば、先づ此の說であらうと思ふ。けれども此の說とも亦私のは違ふのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 47
    "url": "https://dl.ndl.go.jp/pid/943657/1/48"
  "translation_ja": "天御中主神を絶対そのものと解釈するのは、多くの学者が取っている立場なので、その説き方を除けば、格別新しい説ではない。しかし、高皇産霊神・神皇産霊神の二神について、私が十数年前から講義している解釈は、従来見られないものである。少なくとも、私がこれまで神道を研究してきた限りでは、ほかの学者が唱えたのを見たことのない説だ。もちろん、今日ではかなり賛同者もいるようだが、要するに、私が初めて考えた説だと信じている。それは、高皇産霊神・神皇産霊神は天御中主神と同一の神であり、この二神は天御中主神の現れである、という説である。これに関しては、鈴木重胤という学者が、「この二柱の神は、天御中主尊の荒魂と和魂でいらっしゃるものと推し量られる」と述べている。荒魂・和魂で解釈するのである。私の説に似たものを求めれば、まずこの説だろうと思う。しかし、私の説は、これとも違うのである。"

  "translation_ja": "また、特に上に立つ者は、慈愛をもって下の者に臨まなければならないということが、神道の一つの要点となっている。伊弉諾尊が黄泉の軍に攻められたとき、桃の実がよく尊を助け、黄泉の軍を退けた。そのとき尊は、桃の実に意富加牟豆美命という名を与え、「お前が私を助けたように、葦原中国の、あらゆる現世の青人草が、苦境に落ちて苦しむとき、助けておくれ」と命じた。常に民を慈しみ愛そうという思いを抱いておられるから、このような言葉が出るのである。また天照大神は、保食神が素盞鳴命に殺されたとき、その身体から五穀が生じたと聞いて大いに喜び、「これらは、いとしい青人草が食べて生きるためのものである」と仰せになった。これには、大神が民を大いに愛し、いたわった、その一端が現れている。故井上毅氏の説のとおり、大国主命が国土を治めたことは、古伝に「ウシハケル葦原の中つ国」とあり、天孫については「わが御子のシラサン国」とある。「ウシハク」は占領の意味であり、「シラス」は、愛し、いたわって治める意味である。建国の初めから、こうであったため、古代の神聖たちの言動や行動を手本として君臨する歴代の天皇も、厚く神々を尊ぶとともに、深く万民を慈しむことを常とされた。文武天皇は、詔勅の中で、「この、私の治める天下を整え、平らかにし、天下の民を恵み、いたわろうと、神ながらに思う」と仰せになっている。また、後鳥羽天皇の御製には、「夜が寒く、寝所の布団さえ冷えるにつけ、藁屋を吹き抜ける風に、思いを寄せずにはいられない」とあり、伏見天皇の御製には、「苦しむ民の心を思えば、何事もなく、安らかにいるわが身が恥ずかしい」とある。神道の政治の大切な道は、上に立つ者が、深い慈愛の心をもって下に臨むことなのである。これは、近くは明治天皇の御製にも現れている。たとえば、「昔の書物を見るたびに思う。自分が治める国は、どうであろうかと」。「晴れるにつけ、曇るにつけ、わが民草の暮らしはどうであろうかと思う」。このような御製の心は、歴代の天皇が常に表してきたものであり、そのような事績も、決して少なくない。神道の政治では、上に立つ者が慈愛をもって下に臨むことが大切だと示されている。ただ、ここで一言、述べておかなければならない。上に立つ者は、このように民を慈しみ、仁慈を重んじるが、ひとたび秩序と統一の思想、そのほか国民的精神に反抗する者があれば、誰であっても、ただちに罰するのである。伊弉諾尊が、三貴子の一柱である素盞鳴尊を追放したこと、高皇産霊神が天若彦を誅したことなどが、その事績である。このように、わが神道の慈悲や愛は、盲目的な愛ではない。キリスト教でいう愛や、中国などでいう兼愛とは、大いに異なる。何でも盲目的に愛するのではない。キリスト教などには、「汝の敵を愛せよ」という教えがある。敵を愛するのなら、戦争はできないことになる。しかし、今日のキリスト教徒の行いを見ると、敵を少しも愛していない。愛さないどころか、ずいぶん残虐に扱っている。神道では、慈悲と仁愛を尊び、上に立つ者には、必ずそれがなければならないとするが、国民的精神に反抗する者があれば、ただちに処罰することをためらわない。それが上位に立つ者の行う道であり、そのように政治は行われてきたのである。"

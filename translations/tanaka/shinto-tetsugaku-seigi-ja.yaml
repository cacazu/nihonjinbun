  "source_text": "右の次第で神道に於いては祈禱もし、又報本反始の意も捧げて、大いに祭祀を盛にすることが大事である。お祭り騒ぎと云ふことを能く言ふが、お祭りと云ふことは、賑かであると云ふことを意味して居る。此の賑かな所が我が國民の特色である。神祇を祀るに悲しいやうな儀式をしない。賑かにしてさうして我が國民の現世的、快活的感情の滿足を得て居るのである。是れが神道の宗教的方面の特色である。要するに人間は智識、感情、意志の三方面の精神活動を具へて居るものである。其の知的要求に於いては、先きに述べたやうに、色々政治、法律、經濟と云ふやうな現象となつて出來て來て、さうして吾々の要求を滿足して居る。所が情的方面に於いては、神道は宗教となつて我々國民の宗教的意識に滿足を與へて居るのである。それで神道は更に道德となつて現はれて、我が國民の意志的要求に滿足を與へて居るのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 124
    "url": "https://dl.ndl.go.jp/pid/943657/1/125"
  "translation_ja": "以上のようなわけで、神道では、祈りもし、根本に報い、始めを顧みる思いも捧げて、祭祀を盛んにすることが大切である。「お祭り騒ぎ」とよくいうが、お祭りは、にぎやかであることを意味する。このにぎやかさが、わが国民の特色である。神々を祭るのに、悲しげな儀式はしない。にぎやかにして、現世を重んじる快活な感情の満足を得ているのである。これが神道の宗教的な面の特色である。要するに、人間には、知識、感情、意志という三方面の精神活動が備わっている。知的な要求には、すでに述べたように、政治、法律、経済といったさまざまな現象が生じて、私たちの要求を満たす。感情の面では、神道は宗教となって、国民の宗教的意識に満足を与える。そして、神道はさらに道徳となって現れ、国民の意志の要求に満足を与えるのである。"

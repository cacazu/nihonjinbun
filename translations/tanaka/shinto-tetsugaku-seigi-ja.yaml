- "id": "st-0015-002"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "けれどもブラグマチズムの哲學は、實際上まだ知に偏するやうに思はれる。此の點が神道哲學と十分に一致し得ない。神道哲學は此の點から云へば、主知說(インテレクチュアリズム)又は主理說(ラシヨナリズム)と云ふが如き、理性或は認識に重きを置くばかりでなく、感情にも意志にも重きを置くつまり人間そのものを立脚地とするヒューマニズム(人本主義)であると云つたがよいかと思ふ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 14
    "url": "https://dl.ndl.go.jp/pid/943657/1/15"
  "translation_ja": "しかし、プラグマティズムの哲学は、実際にはまだ知に偏っているように思われる。この点で、神道哲学とは十分に一致しない。神道哲学は、こうした見方からいえば、主知説（インテレクチュアリズム）や主理説（ラショナリズム）のように理性や認識を重んじるだけでなく、感情も意志も重んじる。つまり、人間そのものを足場とするヒューマニズム（人本主義）だと言ったほうがよいかと思う。"
  "translation_status": "reviewed"

  "section_id": "chapter-05-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一意專心、古傳をありのまゝに解釋せんと努めたる宣長の說として、應さにしかあるべきも、而かも爲に宣長は、論理的自殺に陷つたのである。即ち古傳のまゝに解せんとすれば、古傳の劈頭「天地初發の時高天原に成りませる神」とある、高天原は解せない。高天原は宣長は天と云ふ。天は地と共に葦牙の樣なものから出來たと云ふ。そこで天のない時に天の存在を說かなくてはならぬ。宣長の窮した所以である。從つて此の點に於いて、宣長學を崇敬せる飯田武卿、岡吉胤と云ふ樣な先生でさへ、「叶はず」などゝ云つて、宣長に從はなかつたのである。その位だから、平田篤胤は尙更ら從はない。即ち篤胤は先づ宣長の說を排斥し、而して自らの說を立てたのである。「此の說は信がたい」とは篤胤の宣長の說に對する言葉である。そして高天原は「大虛の上方謂ゆる北極の上空、紫微垣の內を云つたのであらう」と云ひ、『緯書』たる『春秋元命包』に、「中宮天極星、その一明なる者太一の常居云々、故に北辰となす、亦紫微宮となす」などの語に基いて、高天原を北極としたのである。かくて宣長と同じく天地鎔造說を主張せる篤胤は、自家撞着を免れんとしたのである。而して後に至つて篤胤は、高天原を太陽そのものとして居る。即ち天つ日やがて所謂高天原にて天照大御神こそしろしめし、皇產靈大神また他の「天神だちも往に集ひ給ふ御國である」と云ふのである。太陽と紫微垣何等の聯絡もないのである。そして經驗的事實から見ても、あまりに突飛な說である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 62
    "url": "https://dl.ndl.go.jp/pid/943657/1/63"
  "translation_ja": "一心に古伝をありのまま解釈しようと努めた宣長の説としては、そうなるのも当然だが、そのために宣長は、論理的な自殺に陥ったのである。古伝のままに解釈しようとすると、その冒頭の「天地が初めて開けたとき、高天原に成り出た神」とある、その高天原が解釈できない。宣長は高天原を天だと言う。天は地とともに、葦の芽のようなものからできたという。それでは、天がないときに、天が存在したと説かなければならない。宣長が行き詰まった理由はここにある。だから、この点では、宣長の学問を尊んでいた飯田武郷や岡吉胤のような先生でさえ、「かなわない」などと言って、宣長に従わなかった。それほどなのだから、平田篤胤はなおさら従わない。篤胤は、まず宣長の説を退け、自分の説を立てたのである。「この説は信じがたい」とは、宣長の説に対する篤胤の言葉である。そして高天原は、「大空の上方、いわゆる北極の上空、紫微垣の内を言ったのだろう」と述べた。緯書である『春秋元命包』の、「中宮の天極星、その一つの明るい星は、太一が常にいるところである。……ゆえに北辰とし、また紫微宮とする」といった語句に基づき、高天原を北極としたのである。こうして、宣長と同じく天地鋳造説を主張する篤胤は、自己矛盾を免れようとした。そして後には、篤胤は高天原を太陽そのものとしている。「天津日こそ、いわゆる高天原であり、天照大御神が治められ、皇産霊大神や、ほかの天神たちも行き集われる御国である」と言うのである。太陽と紫微垣には、何のつながりもない。そして、経験上の事実から見ても、あまりに突飛な説である。"
  "translation_status": "reviewed"
  "source_variants":

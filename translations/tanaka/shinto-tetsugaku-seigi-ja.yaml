  "translation_ja": "では、その道とは何かといえば、これまで述べてきたとおりである。しかし、これを道徳の立場から見ると、私たちの日々の行いの標準は、真心にある。本居宣長は、こういっている。「道は、必ずしも学問によって知るものではない。生まれながらの真心こそが、道なのである」。では、その真心とは何か。宣長はさらに、「真心とは、産霊神の御霊によって、生まれながらに備わった、そのままの心をいう」と述べる。つまり、私たちは、産霊神、すなわち天御中主神から真心を受けて生まれている。真心は先天的なもので、神の分霊であり、あるいは神そのものであるから、それに従って行えば、それがそのまま神道になるのである。君臣、父子、夫婦、兄弟、友人の道も、みな真心から生まれる。それに従って行えば、臣下が君主に対しては忠となり、子が親に対しては孝となり、妻が夫に対しては貞となり、弟や妹が兄や姉に対しては悌となり、友人の間では信となる。たとえ忠や孝を尽くし、夫婦が仲よくし、兄弟が友愛を守っても、真心がなければ形式に流れ、徹底しない。表面的で、上滑りになる。それでは、神道の道徳ではない。中国の道徳には、形式が多くて困る。たとえば、君臣には義があり、夫婦には区別があるという。だから、ついには「君主が君主らしくなければ、臣下も臣下らしくしない」という言葉が出てくる。「三度いさめて聞き入れられなければ、去る」ということも起こる。夫婦には区別があるなどというから、夫婦が十分に仲よくできず、おのずと疎遠になる傾向がある。しかし、わが国では、真心をもって相手に向き合うので、君臣の間でも、「君主が君主らしくなければ、臣下も臣下らしくしない」などとはいわない。「君主が君主らしくなくても、臣下は臣下としてある」。つまり、臣下は、どこまでも臣下としての道を踏んでいかなければならない。「大君のおそばでこそ死のう。安らかには死ぬまい」。命を捧げて大君のために尽くすのが、神道の道徳である。また、夫は妻を愛し、貞節を重んじるべきであるが、妻もまた、どこまでも貞節を尊ぶことを、神道は重んじる。これは、大国主神が旅立たれるとき、須勢理毘売命の述べられた言葉に伝わっている。これを見ても、古来、妻である者が、いかに貞操を重んじたかが分かる。このように神道では、真心をもって君主に仕え、親に仕え、夫に仕える。どこまでも真心を貫くのである。"

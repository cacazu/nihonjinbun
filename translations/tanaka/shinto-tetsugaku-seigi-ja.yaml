    "url": "https://dl.ndl.go.jp/pid/943657/1/44"
  "translation_ja": "ところが、天御中主神・高皇産霊神・神皇産霊神については、ほとんど名が伝わるばかりで、そのほかに事績といえるものは、ほぼ伝わっていない。だから、この神々の性質や行いは、こうだっただろうという研究によって定めるほかない。その中でも、最も合理的だと信じられる説に基づくより、仕方がないのである。"

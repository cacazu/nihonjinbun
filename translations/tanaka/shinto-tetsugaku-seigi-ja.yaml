    "url": "https://dl.ndl.go.jp/pid/943657/1/133"
  "translation_ja": "考えてみるがよい。わが国の普通教育の本旨は、どこにあるか。もちろん、さまざまな面から、次代の国民を育てることにあるのは、いうまでもない。しかし、その根底が、道徳教育と国民教育にあることは、法令が明らかに示している。では、道徳教育は何をよりどころに行うべきか。儒教か、違う。仏教か、違う。キリスト教か、違う。まことに、教育に関する勅語である。また国民教育は、何を標準として行うべきか。これも、帝国憲法であることは、説明を待たず明白である。帝国憲法については、すでに述べたように、明治天皇が発布の際、「皇祖皇宗の遺訓を明らかにし、基本の法を定め、その条文を明示する」という意を述べられたことから、皇祖皇宗の遺訓であることは、きわめて明らかである。また教育勅語が、皇祖皇宗の遺訓であり、祖先の遺風であることは、その本文に述べられている。そうであるなら、この憲法、この勅語を常に心にとどめて守らせ、道徳教育と国民教育を十分に行うには、まず、皇祖皇宗と祖先を敬わせなければならない。父母の教訓を十分に守る孝行な子は、必ず、その父母を敬う者でなければならない。主人の命令に忠実に従う召使いは、決して、その主人を侮る者の中には見られない。理屈は、これと同じである。皇祖皇宗を敬わず、その遺訓だけを守り尊ぶといっても、誰が信じるだろう。祖先を敬わず、その遺風だけをたたえるといっても、誰が信じるだろう。だから、いやしくも、わが国民である以上、十分な真心をもって、皇祖皇宗と祖先を敬わなければならない。そのように敬うには、わが国固有の神社を敬い、祭るべきである。神社こそ、古来、わが国民が、十分な真心をもって、皇祖皇宗と祖先を敬い祭るために造ったものなのである。だから、わが国の普通教育を徹底し、道徳教育と国民教育の十分な効果を上げるには、ぜひとも、神を敬い、祖先を崇める考えを普及させなければならない。"

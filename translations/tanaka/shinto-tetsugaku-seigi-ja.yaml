  "source_text": "神道政治の要諦は、「天を以つて主となし、民を以つて本となす、民の厭ふ所は天必ず之を廢し、民の歸する所は、天必ず之れを佑く」と云ふが如き支那流の民本主義でもなければ、西洋流の自由民權的民主主義でもない。何ぞ況んや歐洲專制の土地人民を帝王の私有物とするが如きものならんやである。勿論、已に述べた通り、我が神道政治に民本的思想のあるのは事實だけれど、此れは恐れ多くも、皇祖皇宗の統治の洪範であつて、臣民の云ふべき者ではない。恰も父母が「白金も黃金も玉も何せむに、まされる賓子にしかめやも」と云ひ、子寶と云つて之れを愛育するに、子たるもの父母に對し、自ら「我れは父母の寳ではないかもつと〳〵我れに權利を與へ、美食を供し、美衣を着せよ」などゝ要求してよいか。如何。臣民が自ら民本主義と云ふは、理まさに是れと同一である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 110
    "url": "https://dl.ndl.go.jp/pid/943657/1/111"
  "translation_ja": "神道の政治の要点は、「天を主とし、民を本とする。民が嫌うものは、天が必ず廃し、民が帰服するものは、天が必ず助ける」というような、中国流の民本主義でもなければ、西洋流の、自由民権を掲げる民主主義でもない。まして、ヨーロッパの専制政治のように、土地と人民を帝王の私有物とするものでもない。もちろん、すでに述べたとおり、わが神道の政治に民を本とする思想があるのは事実だが、これは、恐れ多くも皇祖皇宗の統治の大きな規範であって、臣民が口にすべきことではない。たとえば父母が、「銀も金も玉も、何になろう。これらより優れた宝である子に、どうして及ぼうか」といい、子は宝だといって、慈しみ育てる。そのとき、子のほうから父母に、「私は父母の宝ではないか。もっと私に権利を与え、おいしいものを食べさせ、美しい服を着せてくれ」などと要求してよいだろうか。どうだろう。臣民が自ら民本主義を唱えるのは、理屈からいえば、まさにこれと同じなのである。"
  "translation_status": "reviewed"

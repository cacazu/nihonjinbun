  "translation_ja": "三貴子の第一は、天照大神である。日の神とも、大日霊貴尊、天照大日霊尊とも申し上げる。この神は昔から女神とされているが、日出の帆足という人は、男神だと言っている。その説では、「聖徳太子が天照皇を女性としたのであり、それは高霏爾霊、たかひるめ、という名によったのである。霊の字の和訓は、女の『め』に通じるからである。これは、一時の都合による言葉で、ただ自分の私情を遂げたにすぎない。ところが『古事記』や『日本紀』などは、みな、その誤りを伝えて、少しも正さない。だから両書は、古伝の典拠とされてはいても、まだその道を確かめるには足りない」と言って、天照皇を男神とする。しかし、この説は一種風変わりな説であり、どの説を見ても、どの古伝に照らしても、天照大神が女神であることは争えないのである。"

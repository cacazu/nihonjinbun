    "text": "祓と禊が秩序統一の精神から出たやうに快活的現世的の精神の著しく發表された儀式は神樂である。『大日本史』には「樂の起るのは蓋し伊弉諾尊が伊弉册尊と妍哉の詠を御交はしになつた所に始つて、天鈿女命に至つて、歌調舞曲が始めて備はつて、祭祀に樂を用ふることはこゝに起つたのである」と書いてある。齋藤彥麿と云ふ人が神樂に就いて書いて居るのを見るに、「天照大神が天の石屋門をらして籠り締ひし時に大字愛食命が日陸かづくを以つて御としを持つて胸乳をあらはし、俳優し給ふ事『記』『紀』にあり。是れ始めにて朝廷、內侍所の御神樂あり。こは下賤の人の窺い見ること能はねば、委しくは知らず、されど其のおもぶきは其の時に唄ふ歌、世にあれど、音節は下賤のしる所にあらす。今諸神社にて行ふ神樂は、猿樂の狂言の如く、壬生寺の躍りにひとし」と。斯う云ふ工合に書いてある。『神道名目類聚抄』には、此の內侍所の御神樂と云ふことに就いて、「御神樂は十二月吉日を撰で內侍所に御神樂を奏せらる。一條院の御宇より行はれ、隔年に行はれけるを、長保年中より每年に行ひ給ふなり。又內侍所の御修理などありて、遷座の後に三個夜の御神樂あり」と書いてある。神樂はかう云ふ工合に昔から我が國に行はれて居るのである。それが快活的現世的感情を最も能く發表して居るものと思はれる。その他『持統天皇紀』には「公卿百寮羅列遞拜して拍手す」と云ふことがある。神前に於いて拍手することを以つて儀式とする事も、外の國にあまり聞かない所で、我が國の現世的快活的感情が、斯う云ふ點にも發表して來たものと思はれる。それから祈年祭は古來毎年二月四日大神宮を初め、三千一百三十二座の神靈を祀りて豐年ならんことを祈る祭であるが、併し其の精神に至つては、全く我が國民の發展的膨脹的性格を發表したものと思はれる。それは其の祈年祭の祝詞に明白に書いてある。何處までも發展し、何處までも膨脹すると云ふのである。その他神道に於いては、祈禱をする。所謂御祭りをする。祭りとは、支那の言葉で祭祀と云ふのである、祀は祭と同義で、祭は即ち際で、神人相接するの義と云ふ。我が國語の「まつり」は、已に述べた通り、服從の義である、一說には待の義とも云ふ。要するに祭は、吾人の胸中の神祇に對する敬虔的態度の發表に外ならないのである。併し此の祭祀に就いて見ると、祈禱又は感謝、又は所謂報本反始の意味を包含して居る。天石屋門の御祭は祈禱である。今上陛下の先年行はせられた御即位の御大禮でも、中に大甞祭と云ふものが行はれて居る。大甞祭は詰り新甞祭の一種であつて、天皇陛下が御在位中一度行はれる所の最も大いなる新甞祭である。此の新甞祭は神に對して感謝する意味である。其の他何れの祭祀に就いて見ても、神に祈り又神に謝すると云ふやうな意味を有つて居るのである。是れはどうしても矢張り吾人の所謂宗〓的であるのである。併し是れは決して佛〓や、基督〓のやうな宗〓的ではない。佛〓や基督〓に於いても祈禱をするけれども、その根本的の趣意は、死後天國に生れることを祈るのである。其の他のことは彼れ等の〓理の立てかたから見ると、彼れ等の祈禱に於いては無意味になる。現世を穢土とし、富めるものは天國に生れられないと云ふて置いて、商賣繁昌を祈れば、矛盾と云はねばならぬ。戰勝でもさうである。戰勝などは、明に修羅道に陷る罪である。「汝の敵を愛せよ」と云ふ〓義に反するものと云はなくてはならない。のみならず、歐洲大戰亂に英吉利の國王は、天帝に向つて、戰爭に勝つことを祈られたであらうが、獨逸の皇帝も亦獨逸が戰爭に勝つことを祈られたであらう。さうして見ると基督〓では神は唯一神と云ふのであるから、一つの神が英吉利からは英吉利が勝つやうに祈られ、獨逸からは獨逸が勝つやうに祈られるのである。神は何方に勝たしたら宜いかと云ふことになつて、甚だ迷惑されることであらうと思はれる。所が神道の方で祈るのは、そんな不都合が起つて來ない。神道の神は我が國民を護つて下さる神々である。我々祖宗の神々である。其の祖宗の神々に對して祈をするのは-戰勝を祈るのは當然のことである。基督〓徒などが動もすれば何か彼れ是れ言ふけれども、甚だ其の議論が當らない。其の他世間で動もすると、日本では信〓の自由を許して居るではないか。然るに朝廷からして官幣社だの、國幣社だのと言つて、神社を御祭りになると云ふことは一寸矛盾である。斯う言ふけれども、是れは神道を彼れ等と同じやうな宗〓と見るから、さう云ふやうな間違が起つて來るのである。勿論神道にも、例の神道十三派と云つて宗〓と見らるゝ〓派があるのはあるけれども、それは國家も宗〓局で取り扱ひ、決してその〓師を國家の官吏とせず、その〓院を如何に大なりとも、官國幣社とせず、全然神社局にて取扱ふものと區別して居るのである。二者は混合してはならない。決して純神道は彼れ等佛〓や基督〓などの仲間入りをするやうなものではないのである。基督〓徒などが猜疑の眼を以つて見る必要のないものである。神道は耶蘇〓や佛〓のやうな宗〓の立脚地から見ると、宗〓以上である。以上と云つては語弊があるかもしれぬが、大きいと云へば適切だらう。彼れ等宗〓よりは、更に更に大きい道である。彼れ等の宗〓は前にも述べたやうに非常に猜疑的な性質を以つて居る。猶太の神は「汝我が眼の前に我れの外何者をも神とすべからず」と言つて居る。さうすれば蔭で拜むなら宜いかも知れないが、我が眼の前に我れの外何者をも神とすることは出來ないと言ふ、非常な嫉妬に富んで居る神である。總べて佛〓や基督〓は猜疑に富んで居るから、佛〓でも他の宗派を非常に排撃する。所謂不倶戴天の仇として他宗派を見る。佛〓は同じ釋迦の〓であるから、十三宗五十八派と言つて分れないでも、一緒になつて是れが佛陀宗だと云ふことにしたら宜からうと思ふ。佛〓は和合を說き慈悲を說き、未來の極樂を說いて〓へて行くのであるから、此の世の事は同情で和合して行つて宜ささうなものである、所がそれが非常に排他的である。神道は然らず。神道は佛〓でも敢へて答めない。基督〓でも敢へて答めない。我が國の佛〓徒が肉を食ひ、酒を飮み、家族的生活をなすを見て、印度佛〓の本旨より云へば破戒濫行とも云ふべけれど、而かも是れ佛〓が我が國に入りて、我が國民性に同化したるの結果であつて是れでよくその命脉を今日に保ち得たのである。こんな工合に神道は彼れ等が我れに同化して來れば答めない。答めない所ではない。同化した佛〓は神道と云へる。同化した基督〓は神道と云へる。即ち神道化したものである。詰り神道は彼れ等佛〓や、基督〓以上のものである。對等のものなら互に排斥もしやうが、以上のものであるから、佛基兩〓が相敵視するやうなことはない。"

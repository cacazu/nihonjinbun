    "text": "前節に述べた通り、我々が色々のことを知りたいと云ふ强い欲求を以つて居る、そこで直に常識に訴へて之れが解譯を求むるのである。さてその常識とか哲學とかいふことは、普通新聞にも何でも出て居るから、斯う云ふ語はよく解つて居るやうであるが、實際はちよと解らないのである。一體哲學とか、常識とか、理想とか、聯想とか云ふ語は普通の人も常に用ひて居るが、其の意味はといふとちよと解らない。時に理想とか聯想とか云ふ題が中等〓員の國語漢文檢定試驗等に出るが、何うも色々の答案が出るさうである。聯想とは聯は聯絡の聯なり、想は思想の想なり故に此方の想を先方へ聯るなりと云ふやうに解釋をする。國語の學者は『古事記』や『土佐日記』のやうな古いものばかりでなく、今日の國語も知らなくてはならない。國語の學者に限らず、今日の人は勿論今日の語をよく知る必要がある。今は國語の御話をして居るのではないからこんな事は閑話休題にしませう。さて常識とは英語のコンモンセンスを譯したものでコンモンが常、センスが識なのである。普通の意識-意識、これは我々の普通の心の働き、普通と云ふのは一般の人が皆持つて居る、例へば「誰某れが死んだ、何所そこの太郞兵衞が死んだ」、「そりや可哀想だ」といふ、それが普通の意識と云ふものゝ働きで常識の働きであるが、夫れを若し「彼奴が死んだと、そりやいひ事をした」などと云ふものがあるが、これは一般普通の場合にては、普通の意識の働きではない。よく人が「常識で判斷し玉へ」と云ふが、是れは普通の人の持つて居る心の働きで判斷せよといふことである。マア月を見る。月を見るといふと中に黑い物がある。「アリヤ何だらう」、「何ツ兎が餅を搗いて居るのだ」、「さうか大きな兎だな」といふ。これは幼稚な解釋ではあるが、やはり常識である。常識の程度が低いばかりである。「オイ君此の小刀はなぜコンナに錆たのだらう」。「それは床の下に落ちて居たから腐つたのだ。」と解釋する。鐵の小刀の腐つたと云ふのもヤハリかゝる常識の解釋である。漁夫がよく明日は風だとか雨だとかを當てる、之れは必要に迫られて天候を見るのである。これらは皆彼れ等が常識で見るのであるが。其の常識は科學や哲學と何ういふ區別があるかと云ふに、漁夫が天候を見て大〓間違はない。けれども此の漁夫を山國につれて來て、明日の天氣は何うだと問ふ。彼れ等の判斷は中々當らない。當らないのは道理、夫れは彼れ等の住める海濱の地理に依つて、風がどうとか、あの山に雲が何うとか、其の土地にあるものに就いて、永年の經驗の結果が遂によく當る事になるので、山國へ來て見ると四方八方に山ばかりで當てにして居た山がないので、當ることが出來ない。然るに東京の天文臺の先生をつれてくると、どんな山國へ來てやつて見ても大抵當る。西洋へ連れて行つても支那へつれて行つても大抵間違はない。常識と云ふ方は往々間違がある。天文臺の先生の方は常識でなく科學で判定するのであるから間違が少くない。無いとは言はぬが先づ少ない。丁度同じ天氣を見るにしても、漁夫が見るのと、天文臺の先生が見るのと違ふが如く常識で見るのと科學で研究するのとは違ふ。一體我々は常識で判斷する丈では滿足が出來ぬ。お月樣の中に兎が餅を搗て居るでは滿足が出來ぬ。鐵の小刀が腐敗するでは滿足が出來ぬ。これを研究して見るのが科學である。科學とは此の宇宙の事物の現象に關する智識で、つまり哲學の初步で、更に一步を進めたものが哲學である。科學は哲學の門戶で、哲學は科學の堂奧である。さりとて哲學が深遠と云ふ譯ではない。手近な門戶から入れば手近な堂奧に上られる次第である。"

  "translation_ja": "このように、宣長の説であれ、篤胤の説であれ、それを初めから終わりまで守り通すことは、神道の趣旨に反する。神道はどこまでも進歩するものであって、そのように保守的なものではない。キリスト教などにはバイブルがあり、その中から一歩も外へ出ることができないという。後世になると、さらに細かな規定や条項を作り、それに異説を唱えれば、すぐに異教徒として破門されてしまう。また仏教は、それぞれの宗派で、祖師が説いた教義から外へ出ることができない。もし外れれば、異安心、異端として破門されてしまう。このように、歴史的宗教は一般に、旧来の説を守るものである。神道はこれらとは違う。神道はきわめて進歩的なものである。だから、宣長・篤胤両翁の説も、一つ一つすべてを信じるわけにはいかない。私たちは、両翁がそれぞれの説を立てたのと同じように、今、こうした説を立てていくのである。世間には、神道を非常に素朴なものとして、幼稚な意味に解釈しても、それでよいではないかと言う人がある。神道は日本のもの、昔のものだから、どうせ今日の考えと一致するはずはない。それはそれとして置いておいて、差し支えないではないか、と言う人がある。しかし、古伝の初めのほうは、ただ神の名だけが伝わっており、その神名の中に、限りなく深い意味が含まれている。その意味は、それぞれの時代の最も進歩した知識によって、ようやく解釈できるのである。これが、進歩的な神道の一つの特色である。また、一部の人々が信じるように、天照大神の当時の社会は、それほど野蛮で未開だったわけではない。世間には、神代といえば、きわめて野蛮で未開の時代のように思う人があって困る。ちょうど都会の者が地方を田舎田舎と呼び、都会に比べてひどく未開だと思っても、事実は想像と大いに違い、地方、とりわけその中心地の文明は、さほど都会に劣らないのと同じである。古代の文明も、さまざまな事実について考えてみれば、意外に開けている。もちろん、物質面は今日とずいぶん異なるが、それさえも、大正の現代と維新前との差のほうが、維新前と古代との差より大きいのではないかと思われる。とりわけ精神的な文明となれば、その差はたいへん小さくなる。また、単に時代から考えても、わが国の神代は、ギリシャでいえば、すでに文明がかなり発達した時期に相当するし、中国でいえば周の時代、つまり文明がずいぶん開けた時代に当たっている。その時代に日本だけが、たとえ交通が十分でなかったとしても、それほど野蛮で未開の状態にいたはずはない。そのような時代に、なお野蛮で未開の状態にとどまるような劣等な人種なら、今日でもやはり、南洋の土人のような状態、アメリカ先住民やアイヌ民族のような状態に残っていなければならない。ところが今日は、中国以上に進み、世界の多くの強国と肩を並べるほど、文明の域に達している。このような文明は、五百年や千年でできるものではない。人は、維新以来、長足の進歩を遂げたと言う。確かに、長足の進歩を遂げた。世界の一つの奇跡というべきほどの進歩を遂げたのである。しかし、その維新以来の進歩も、素養がなくてできるものではない。その素養があるからこそ、この進歩ができている。少しも不思議ではない。日本の歴史を十分に調べれば、この進歩はむしろ当然なのである。だから、神代という時代は、それほど野蛮で未開の時代ではなかった。当時の神々が作った、いわゆる古伝には、もちろん、ごく素朴な思想も含まれているだろうが、また高尚な思想も含まれている、と私たちは推察する。したがって、高皇産霊神・神皇産霊神をこのように解釈するのである。当時の名だけしか伝わっていないのだから、当時の古伝の真意がどこにあったかを、私たちが正確に断定することは難しい。しかし、おおよそこのような思想だったのだろうと思うのである。"

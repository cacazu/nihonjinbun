  "translation_ja": "さらに日本国民は、どこまでも発展し、膨張していく性格を備えている。歴史を見れば、これは最も明白である。国運が日々発展し、膨張してやまないのも、まったくこの性格による。もちろん、外国人にもそのような性格はある。特に、昔のローマ人や、今のドイツ人などは、それを著しく持っている。だから人はよく、世界を統一するのは日本人かドイツ人だと言う。しかし、ローマ人もドイツ人も、秩序と統一を重んじる思想が、いかにも乏しい。ローマは王政を行って、ついには国王を追い出し、共和政を行って、国内の争いが絶えなかった。日本国民のように、秩序と統一を重んじる思想、快活で現世的な感情を持ち、その上で、発展し膨張する性格を持つ国民は、ほとんど見られない。わが国民は、このような思想と感情を持ち、しかも発展的、膨張的である。これは、わが国家が発展し膨張してきた道筋を見ても分かる。昔、わが国の勢力は、近畿から東海・中国・九州方面にしか及んでいなかった。それが次第に遠くへ及び、ついに北海道、樺太、西は朝鮮、南満州、南は琉球、台湾、遠く南洋にまで及ぶというように、徐々に発展し膨張してきた。また、思想の面でも、新年の祝いの儀式などには、この性格が十分に現れている。そのほか、日本人のなすこと、することは、常に発展的、膨張的であり、その性格が表に現れたものである。これが、日本国民の国民的精神なのである。そして、わが国の神々は、その国民的精神の精髄を体現し、精華を集めておられる。だから、神々は八百万というほど、実に多くおられるが、ギリシャの多くの神のように、雑然として統一がないのではない。みな、厳然とした系統上の地位を持っておられる。また、インドの十六羅漢や五百羅漢、そのほか多くの仏菩薩のように、厭世的、保守的ではなく、実に快活で発展的なのである。このように、わが国の神々は、国民的精神の精髄を体現し、精華を集めておられるが、その中でも、とりわけ偉大な神が、天照大神なのである。"

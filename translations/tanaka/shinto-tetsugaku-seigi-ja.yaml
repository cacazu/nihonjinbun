  "translation_ja": "さらに、この点について西洋の説を少し考えてみよう。西洋のライプニッツは、ギリシャのデモクリトスの原子論、つまり宇宙は小さな原子からできているという説に基づいて、ごく神秘的な単子の説を唱えた。ライプニッツの説によれば、単子はきわめて霊的なもので、永遠に活動している。つまり、始まりも終わりもない活動をする、と見るのである。この説に照らせば、単子そのものを神皇産霊神と見て、その単子の始まりも終わりもない活動自体を、高皇産霊神と見ることになる。このように見れば、やはりその説とも似てくる。つまり、私の主張も、宣長・篤胤の両翁の説と同じく、万物ができてくるのは高皇産霊神・神皇産霊神の徳によるとするのだが、その意味が違っている。宣長・篤胤の両翁などは、この二神が万物を造った、万物を鋳造した、あるいは生んだと言われる。しかし古伝を見ると、伊弉諾尊・伊弉冊尊がさまざまな神々を生んだとは書いてあるが、高皇産霊神・神皇産霊神がさまざまな神々を生み、また、さまざまなものを造ったということは、一つも現れていない。だから、このような説は両翁の独自の解釈、一家の説と見てよいのである。宣長・篤胤の両翁は、前にも述べたように、この二神が次第に万物を造ったと言う。その証拠は、先に挙げた『日本書紀』顕宗天皇紀の、阿閉臣事代が受けた託宣である。しかし、もし天地を鋳造した証拠になるような託宣ならば、阿閉臣事代という、さほど身分も高くない官吏に下されず、もっと立派な方に下されるはずだと思う。また、それほど大事な託宣ならば、任那の国に出かけていくときなどに下されず、朝廷に仕えている間に下されたらよかっただろうと思う。"

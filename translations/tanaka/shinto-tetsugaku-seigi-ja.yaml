- "id": "st-0018-001"
  "section_id": "chapter-01-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "更に眼を轉じて、哲學と云ふ文字を見るに、元來哲學はフヰロソフヰーと云ふ語の譯字である。而してフヰロソフヰー(Philosophy)と云ふ字は、もと希臘語のフヰロソフヰアから來て居るのである。フヰロソフヰアは、愛智識(love of wisdom)を意味して居るのである。蓋し我々人類は已に述べた通り、知識に對して自然的欲求を有して居ることは爭はれない。だから希臘の昔に哲學なる言葉の成立に種々の歷史があつたにしても、要するに知識を愛すると云ふ考がその根本であつたのは明白である。而して物を求めこれに執著するのは愛で、事物の眞相を知るのは智識である。だから哲學と云ふものは何でもむづかしいものではない、我々の日々接する事物の眞相を知りたいとする學問、これが哲學である。哲學はむづかしいものではなく普通のものであつて、誰れにも解るものである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 17
    "url": "https://dl.ndl.go.jp/pid/943657/1/18"
  "translation_ja": "さらに、「哲学」という言葉に目を向けてみよう。もともと哲学は、フィロソフィー（Philosophy）の訳語である。そしてフィロソフィーは、もとはギリシャ語のフィロソフィアから来ている。フィロソフィアは、知を愛すること（love of wisdom）を意味する。すでに述べたように、人間が知識に対する自然な欲求を持つことは否定できない。したがって、古代ギリシャで哲学という言葉が成立するまでに、さまざまな歴史があったにせよ、その根本に知識を愛する思いがあったことは明らかである。物を求め、それに心を寄せるのが愛であり、物事の真実の姿を知るのが知識である。だから哲学は、何も難しいものではない。私たちが日々接する物事の本当の姿を知ろうとする学問、それが哲学である。哲学は難しい特別なものではなく、ごく普通のもので、誰にも分かるものなのである。"

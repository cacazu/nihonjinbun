  "translation_ja": "この神勅と同時に、三種の神器を伝えられた。この三種の神器は、神勅とともに、天照大神が後世に残された手本を示している。そもそも、わが国民は大神の神勅に従い、遠大な思想をもって秩序と統一を保ち、快活で現世的に、どこまでも発展し膨張して、天地とともに、きわまりないようにあるべきである。そのために必要なものとして、三種の神器が伝えられている。だから三種の神器は、わが国で最も重要なものとなっている。これについては、まず、その順序が昔からかなり問題となっている。天孫降臨の伝えでは、『日本書紀』にも『古事記』にも、八坂瓊の曲玉、八咫鏡、草薙剣という順で伝わっている。しかし、『古語拾遺』は鏡・剣の順であり、『日本書紀』の継体天皇のところも、『神祇令』も、鏡・剣の順に記されている。そのため、鏡が第一だという説もあるが、これは疑問だと思う。もともと三種の神器には、どれが重いかといった区別を付ける理由はないはずである。ただ、今挙げたように鏡・剣という伝えがあるのは、璽は常に陛下の身辺に置かれ、即位の御大礼の場合なども、すでに新しい陛下のそばに置かれており、忌部などが奉るときには、鏡と剣を特に捧げたからである。それで、その中から璽を省き、鏡と剣を並べて書くようになったと思われる。もっとも、鏡については、天照大神が別の神勅で、「この鏡を私の御魂とし、私の前で拝むように、祭りなさい」と仰せになったことからすれば、鏡が最も重いように思われる。しかし、三種の神器として授けられた場合には、決して優劣を付けて授けられたのではないと思う。また、『古語拾遺』などには二種の神宝とあり、「大殿祭の祝詞」にも「天津璽乃剣鏡」といった言葉があり、そのほか、先に挙げた二、三の例にも鏡・剣と書いてあるので、人によっては三種の神器は二種なのだと考える。しかし、これは大きな間違いである。前にも言ったように、曲玉は常に陛下のそばに置かれることになっているため、そのような記事には二種だけを書いたのである。神器が三種であることは、『日本書紀』にも『古事記』にも厳然と記されているのだから、ここに少しも疑いを挟む余地はないのである。"

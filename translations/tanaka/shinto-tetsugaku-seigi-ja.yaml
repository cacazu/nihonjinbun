  "source_text": "それで天照大神は今申したやうな色々の御名があつて、皆是れが太陽に關係して居るものであるから、前にも述べて置いた樣に、本居宣長を初めとして幾多の學者が天照大神は即ち太陽であると云ふ考を抱いて居る者が尠くない。併し天照大神は決して太陽ではない。平田篤胤は、天照大神が太陽であると云ふ說が不合理であると云ふので、太陽の主宰神が天照大神であると主張して居るけれども、併し是れも當らない。一體宇宙の萬物が悉く精神を具へ、生命を有つて居つて、人間と同じやうに活動をし、又人間以上の能力を有して居ると云ふ考は、昔の人に一般に在つたものである。であるから希臘人などは星を人間と同樣に見て、生きて居るものとして居る。斯う云ふ考は今日でも尙、未開の民族には見ることが出來るのである。斯う云ふ風に星にしても、又其の他の動物にしても、植物にしても、或は又風とか雨とか地震とか云ふやうなものにしても、皆之れを生きたものと見る。其の中で最も烈しい所のもの、又最も人類に影響のあるもの、又最も人類の注意を惹く所のものは太陽である。太陽は、旱天幾日も經續すると云ふやうな事があると、草木も枯らしてしまふし、獸畜も燒殺してしまふやうな勢を有つて居る。又春などに於いて暖かな日光は、我々の健康に非常に効果を及ぼして來るし、又その力に依つて五穀も實るし、萬物も發育して來るのであるから、斯う云ふ偉大な勢力を有する太陽と云ふものを見て、之れを神として崇拜するやうになつて來るのは、どうも自然に起る所であらうと思はれる。佛蘭西のルツソーが「地球は人類の小さい島である、我れ等の日々に最も强く目擊する所のものは太陽である。此の太陽は、我々が眼を外に向くれば自然に先づ之れに觸るゝ所の目的物となるのである。であるから總べての野蠻人の哲學と云ふものは、地球の空想的の區分と太陽の神性とを說くに外ならないのである」と云ふことを言つて居る。斯う云ふ風に太陽と云ふものは、總べての人の注意を惹き、又其の崇拜物となる事が出來るのである。我が國に於いても、昔、靑人草と云つて、澤山の人民が居つたのであるから、其の人民の間に太陽崇拜と云ふ事が行はれたことは事實であらうと思ふ。其の時に方つて天照大神が御出になつたのである。其の德廣大無限にして、他に比較すべき所のものもない。そこで從來太陽崇拜をして居つた所の下層人民は直に此の天照大神を太陽と同一に見る樣になつたものと思はれる。そこで古傳の或る部分に於いては、天照大神は恰も太陽であるかのやうに傳へられて居るのは、少しも怪むに足りないのである。"

  "translation_ja": "私が考えるには、まず、伝説とは何かを調べなくてはならない。神道では伝説を重んじるが、その伝説とは、そもそもどのようなものなのか。宣長も篤胤も、盛んに古伝、古伝と言う。古伝は大切である。しかし、その意味を十分に調べなくてはならない。本居・平田の二人のように、神道を神代に限ると主張する学者から見れば、古伝は特に大切である。しかし私たちの考えでは、神道の神は決して神代だけに限られない。神代の神と同じ形と内容を持つ神が、その後にも存在する。たとえば、神代の武甕槌神や経津主神は、武神として尊い神であるが、それと同じように、楠木正成公や乃木大将も、武神として尊い。武甕槌神・経津主神が、その当時の朝廷に献身的に働いたなら、楠木正成公も乃木将軍も、献身的に働いた。私たちは香取や鹿島に社を建てて、それらの神々を祭ると同時に、楠木正成公にも湊川に社を建てて祭る。乃木将軍も、東京や各地で社を建てて祭られている。このように神道の神を広く捉えれば、古代の伝説は、本居・平田が言うように、絶対的な重みを持つものではなくなる。古伝説がすべてで、一にも古伝、二にも古伝というように、古伝だけを特別に尊ぶわけにはいかない。古伝説より後の伝説、つまり国の歴史そのものも、同じように大切になる。明治天皇は戊申詔書で、国史に残る実績は、太陽や星のように明らかであると述べているが、その歴史上の実績が、たいへん重大となる。国史も、神道にとって重要な権威であり、欠かせない根拠になる。古伝説と同じように尊ぶべきものである。いわゆる古伝説、すなわち『古事記』や『神代紀』に記されたものの大部分は、私の考えでは、イザナギ尊・イザナミ尊・天照大神の時代にできたのだと思う。本居・平田の説では、古伝は神々からの伝えであり、天御中主神・高皇産霊神・神皇産霊神から伝えられたものだと言う。そして篤胤は、天御中主神を、老子のいう道と同じ、あるいは『易』の太極と同じだと解釈し、始めも終わりもない神だとする。それでは、老子の道のような神が、私たちのように人格を持ち、古い伝えを伝えた、ということになってしまう。これは確かに問題だと思う。そこで私は、古伝は、結局、イザナギ尊・イザナミ尊・天照大神のころにでき、それ以前については、その時代の神々が、こうした神々がいたのだと考え、伝えたものだと解釈する。そうしなければ、どうも説明がつかない。ことに、歴史の立場だけから考える人は、天御中主神はどうだった、高皇産霊神はどうだったと言うが、これは歴史的には、とても考えの及ぶはずのものではない。「人は天地の後に生まれて、天地の初めを知る」と言うが、それは哲学の事柄であって、決して歴史によって知れるものではない。歴史で知れるのは、いわゆる有史以来のことだと言われる。もちろん、化石などから有史以前も多少は研究できるが、有史以後に比べればわずかであり、厳密には、それを歴史とは呼べない。結局、わが国の古伝のうち、太古に関するものは、イザナギ尊・イザナミ尊・天照大神のころにできたものと見るのがよいようである。"

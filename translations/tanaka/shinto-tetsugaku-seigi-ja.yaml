  "source_text": "伊勢貞丈は例の『神道獨語』の中に、貞丈一流の說を立て、「我が君のおはします都を、天になずらへて高天原と云ふのである」と云つて居る。谷重遠はもつと痛烈に、「高天原は皇居である。高天原に神づまりますとは、天子禁闕に坐するのである。紛々たる多說皆非である」と主張したのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 63
    "url": "https://dl.ndl.go.jp/pid/943657/1/64"
  "translation_ja": "伊勢貞丈は、例の『神道独語』の中で、貞丈らしい独自の説を立て、「わが君のおられる都を、天になぞらえて高天原というのである」と言っている。谷重遠は、もっと痛烈に、「高天原は皇居である。高天原に神として鎮まるとは、天子が宮殿におられるということである。入り乱れた多くの説は、すべて誤りである」と主張した。"

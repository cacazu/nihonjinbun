  "section_id": "chapter-01-section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此の表に就いて見る通り、日本の哲學に於いて、最もよく我が國固有の思想を代表して居るものは、實に神道哲學であるのである。で、吾々は、日本固有の思想を研究せんが爲に、此の日本固有の思想を代表して居る所の、神道哲學を研究せんとして居るのである。其の神道哲學は、日本の哲學であつて、勿論日本固有の思想の上に成立して居るのである。日本固有の思想と云ふものは、上古に於いては已に述べた通りの次第で、專ら傳說として發表せられて居る。そこで其の傳說は、神道の根柢となつて居るのであるから神道哲學の研究は、先づ第一に、是非とも傳說によらなくてはならぬ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 26
    "url": "https://dl.ndl.go.jp/pid/943657/1/27"
  "translation_ja": "この図で分かるように、日本の哲学の中で、わが国固有の思想を最もよく代表するのは、まさに神道哲学である。そこで私たちは、日本固有の思想を研究するため、それを代表する神道哲学を研究しようとしている。神道哲学は日本の哲学であり、もちろん日本固有の思想の上に成立している。日本固有の思想は、太古には、すでに述べた事情から、主として伝説として表されていた。その伝説が神道の根底になっているのだから、神道哲学の研究では、何よりもまず、伝説に基づかなくてはならない。"
  "translation_status": "reviewed"

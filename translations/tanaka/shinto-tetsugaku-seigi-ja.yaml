- "id": "st-0077-002"
  "section_id": "chapter-07-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "そこで伊弉諾尊の御命によつて、天照大神は當時の宗主國たる高天原を統御遊ばし、月讀尊は天照大神の補佐として高天原にまし〳〵、さうして素盞鳴尊は天下を統御なさることになつたものと傳はつて居る。伊弉諾尊がこゝに天の下と仰せになつたのは、即ち我が豐葦原中津國を申されたのである。それであるから當然伊弉諾尊の御神意に隨つて見ると素盞鳴尊が伊弉諾尊の後を承けて豊葦原中津國の主宰神であつて、其の御子である大國主神が之れを統御され、隨つて大國主神の御子孫がズーツと我が豐葦原中津國の君主になつて居られなければならぬやうになつて來る。所が此の時に素盞鳴尊は、天下を統御することを御聽入れにならなかつた。それで素盞鳴尊は伊弉諾尊から此の國を追放されてしまはれたのである。そこで當然此の國は天照大神の統御遊ばすことになつたのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 76
    "url": "https://dl.ndl.go.jp/pid/943657/1/77"
  "translation_ja": "さて、伊弉諾尊の命により、天照大神は当時の宗主国である高天原を治め、月読尊は天照大神の補佐として高天原におられ、素盞鳴尊は天下を治めることになったと伝えられている。伊弉諾尊が、ここで天下と仰せになったのは、わが豊葦原中津国を指したのである。だから、その神意に従えば、当然、素盞鳴尊が伊弉諾尊の跡を継ぎ、豊葦原中津国の主宰神となり、その子の大国主神がこれを治め、その子孫がずっと豊葦原中津国の君主となっていなければならないことになる。ところが、このとき素盞鳴尊は、天下を治めることを承知されなかった。それで、伊弉諾尊によって、この国から追放されてしまった。そこで当然、この国は天照大神が治めることになったのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "そこで伊弉諾尊の御命によつて、天照大神は當時の宗主國たる高天原を統御遊ばし、月讀尊は天照大神の補佐として高天原にまし〓〓、さうして素盞鳴尊は天下を統御なさることになつたものと傳はつて居る。伊弉諾尊がこゝに天の下と仰せになつたのは、即ち我が豐葦原中津國を申されたのである。それであるから當然伊弉諾尊の御神意に隨つて見ると素盞嗚尊が伊弉諾尊の後を承けて豊葦原中津國の主宰神であつて、其の御子である大國主神が之れを統御され、隨つて大國主神の御子孫がズーツと我が豐葦原中津國の君主になつて居られなければならぬやうになつて來る。所が此の時に素盞鳴尊は、天下を統御することを御聽入れにならなかつた。それで素盞鳴尊は伊弉諾尊から此の國を追放されてしまはれたのである。そこで當然此の國は天照大神の統御遊ばすことになつたのである。"

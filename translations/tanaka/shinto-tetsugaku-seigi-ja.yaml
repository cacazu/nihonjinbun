  "translation_ja": "七代神の第二は、豊雲野神である。前にも少し述べたが、『日本書紀』によると、国常立神と豊雲野神の間に、国狭槌神という神がある。ところが篤胤は、『古事記』に、「大山津見神と野槌神が、山と野によって分かれて生んだ神の名は、天之狭土神、次に国之狭土神である」と伝えられていることから、『日本書紀』の国狭槌尊と、『古事記』の国之狭土神は同じ神だ、という説を主張している。ともかく、この国狭槌尊については、古伝にどうしても誤りがあるようである。著者は篤胤の説によらず、むしろ国常立尊の別の名であるとする。そもそも古代の神々には、「またの名は何々」といって、一柱の神にいくつもの名がある例が多い。著者はそのように考えていたので、篤胤の説に賛成しなかった。ところが後年、鈴木重胤の説を見ると、やはり同じように説かれていた。それで、著者の考えのほうが、ますますよいように思った。要するに、国常立神は国之常立尊とも、国狭槌尊とも、国狭立尊ともいうのだと思われる。『旧事紀』の「神代系紀」には、「国常立尊は、また国狭立尊といい、また国狭槌尊という」と書いてある。『旧事紀』は必ずしも正確な古典とはいえないが、そのような本にこう書いてあるところを見ると、やはり昔、そのような古伝もあったように思われる。どうも、そう解釈するほうが正しいと思うのである。さて、豊雲野神のときには、この国土が次第に発達してきたと見える。豊雲野神についての宣長の解釈を見ると、「くも」は「くむ・くみ・くひこり」などに通じ、物が集まり凝り固まる意味と、物が生まれ始める意味を兼ねるという。そして、この二つの意味も、おのずから通じ合うとしている。つまり、豊雲野神は、物が凝り集まることと、芽生えることとの二つの意味を兼ねている。そう見ると、豊雲野という名には、たいへん面白い意味がある。「くも」とは、今述べた星雲のようなものが凝り集まり、固まってくることである。それに加えて、芽生える、でき始めるという意味がある。だから「くも」とは、星雲のようなものが群れ集まり、国土になるものが初めて芽生えたという意味で言い、「野」はそのものを指したのである。国土が次第に凝固して固まってきて、このような形にできあがった、その時代の元霊を、豊雲野神と申し上げた。宣長の解釈によって、このような説が成り立つ。この点では、まさにこうであろうと思われる。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "七代神の第二は豐雲野神である。前にもちよつと述べて置いたが『日本書紀」に依ると云ふと郎の國會立神と巡雲野神くの間に國狹植神と云ふの所が篤胤は、『古事記』に「大山津見神と野槌神とが山野に因つて持ち別けて生みませる神の御名は天之狭土神、次に國之狹土神」と云ふことが傳へてある。それで『日木書紀』に傳へて居る國狹槌尊と『古事紀』に傳へてある國之狹土神とか同一神である。斯う云ふ說を主張して居る。兎に角此の國狹槌尊と云ふのには、古傳にどうしても誤謬があるやうである。著者は此の篤胤の說に依らないで、寧ろ是れは國常立尊の一の御名であるとするのである。一體古代の神々には「又の御名は何々」と言つて、一つの神の御名が幾つもあるのが澤山ある。云ふ風に著者は考へて居つたので、篤胤の說に賛成しなかつたのである。處が後年鈴木重胤の說を見ると云ふと、矢張りさう云ふ風になつて居るのである。で、是れは矢張り著者の考の方が益、良いやうに思つた。要するに國常立神は國之常立尊とも申し、國狹槌尊とも申し國狹立尊とも申すものと思はれる。『舊事紀』『神代系紀』に依ると、「國常立尊は亦は國狹立尊と申し亦は國狹槌尊と申す」と云ふことが書いてある。『舊事紀』は必らずしも正確なる古典と云ふ譯には行かないが、併し斯う云ふ本に斯う云ふことを書いてある所を見ると、矢張りこんなやうな古傳も昔に在つたやうに思はれる。どうもさう解釋した方が正しいやうに思はれるのである。それで此の豊雲野神の時に至つては、段々此の國土が發達して來たものと見える。此の豐雲野神に對する宣長の解釋を見るニエムム久毛は久年久美久比時雅などと温つて物の集まり際る意て物の始り萠す意を兼ねて居る。此の二つの意又自から通へりとして居る。詰り豐雲野神は物の凝り集まるのと、萠すのと、二つの意を兼ねて居るのである。さうして見ると豊雲野と云ふのには甚だ面白い意味がある。クモと云ふのは今申した星雲的のものが凝り集まる-凝固して來る。さうしてそこへ持つて行つて萠す意がある。出來始まる意味を持つて居る。であるからクモとは星雲的のやうな物が群り集つて、さうして國土ととなるべき初め萠しなる由を以つて言ふたので野と云ふのは其の物を指して言ふのである。詰り國土が段々と凝固して固つて來て、さうして此の物がこう云ふ風な工合に御出來になつた所のその時代の元靈を、豊雲野神と斯う申上げたのである。宣長の解釋によつて、かう云ふ說が成立つて來るのである。此の點に於いて正にかうであらうと思はれる。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0067-001"
  "section_id": "chapter-06-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それから第三に御出になつた神は宇比地邇神、須比智邇神の二神である。此の神の御出になつた時に方つては、此の國土は益〻發展して來たものと思はれる。それで宇は浮の意である。須は沈の意である。比地は泥であると云ふのが眞淵の說であるが、誠にさうであらうと思ふ。で此の混純たる所のものが段々と進化して來て、さうして重い所の物は沈み輕い所の物は浮ぶ。さうして其の沈んだ比智即ち泥土は凝固まつて、段々國土となつて來たのである、斯う云ふ時代の神を宇比地邇神、須比智邇神と申したのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 66
    "url": "https://dl.ndl.go.jp/pid/943657/1/67"
  "translation_ja": "次に、第三に現れたのは、宇比地邇神と須比智邇神の二神である。この神々が現れたとき、国土はますます発展してきたと思われる。「宇」は浮く意味、「須」は沈む意味である。「比地」は泥をいう、というのが真淵の説だが、まったくそのとおりだと思う。この混沌としたものが次第に進化し、重いものは沈み、軽いものは浮く。そして沈んだ「比智」、つまり泥土が固まり、次第に国土となってきた。その時代の神を、宇比地邇神・須比智邇神と申し上げたのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "それから第三に御出になつた神は宇比地通神、須比智通神の二神である。此の神の御出になつた時に方つては、此の國土は益〓發展して來たものと思はれる。それで宇は浮の意である。須は沈の意である。比地は泥であると云ふのが眞淵の說であるが、誠にさうであらうと思ふ。で此の混純たる所のものが段々と進化して來て、さうして重い所の物は沈み輕い所の物は浮ぶ。さうして其の沈んだ比各即ち泥土は凝固まつて、段々國主となつて來たのである、斯う云ふ時代の神を宇比地通神、須比智通神と申したのである。"

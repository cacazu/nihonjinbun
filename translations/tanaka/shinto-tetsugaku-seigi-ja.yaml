    "text": "右のやうな工合で、〓育勅語は、皇祖皇宗の遺訓たる帝國憲法と同じく、神道である。神の道を示されたものである。かゝる〓育勅語を新領土の民に說くには、幾多の不便を感ずると云ふものがある。殊に祖先の遺風とか、克く忠に克く孝にとか云ふ御言葉の解釋は困難であると云ふ者がある。けれども是れも吾輩が已に論じた樣に新領土の民も、我が民族の養子と看做し、否我が國民たらしめて、之れを同化せしめなくてはならぬ。決して之れを劣等な人種の如くして待遇すべきでない。苟くも我が帝國の臣民たる以上は、新附の民として夢にも侮蔑的區別を附してはならぬ。是れ即ち帝國古來の國是であつて、祖先の遺風である。從つてどこまでも新領土の民をして、皇祖皇宗の遺訓、即ち神の遺訓を體認せしめなくてはならぬ。かくて彼れ等に十分に〓育勅語を拳々服膺せしめ、遂に理想を實現せしめなくてはならないのである。"

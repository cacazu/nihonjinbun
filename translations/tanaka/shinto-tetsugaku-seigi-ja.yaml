  "translation_ja": "次に、天照大神が三種の神器を瓊々杵命に授けたことについて、北畠親房卿は『神皇正統記』に、こう述べている。「三種の神器が世に伝わることは、日・月・星が天にあるのと同じである。鏡は日の本体、玉は月の精、剣は星の気である。深い伝授があるのだろうか。……鏡は何一つ自らの内に蓄えず、私心なく万物を映すので、是非善悪の姿が現れないことはない。その姿に応じて映すことを徳とする。これは正直の本源である。玉は柔らかく穏やかで、よく従うことを徳とし、慈悲の本源である。剣は鋭く決断することを徳とし、知恵の本源である。この三つの徳を受け入れなければ、天下を治めることは、まことに難しいだろう」。このように三種の神器を大いに尊び、さらに「この国は、三種の本体を眼目とし、福を生む田とする」と述べ、国民が行うべき大道の根本としている。続いて一条兼良卿も、三種の神器を大いに尊び、著書『日本書紀纂疏』に、「三種の神器は、神書の最も大切なところであり、王法のかなめである」と言う。また、「鏡が美醜を映すのは知の働きであり、玉が温かく潤うのは仁の徳であり、剣が鋭いのは勇の意味である」と述べ、三種の神器が知・仁・勇の根本を示すとし、鏡は実に三器を代表するものとする。その説では、「三器には優劣がないが、その生まれた順をたどれば、鏡は第二の時にある。また、真榊の中の枝に掛けるのは、神明の中道を根本とするからである」と言い、鏡を挙げるときは、剣と璽もおのずから、その中に含まれるとしている。このように中古の学者は、三種の神器に、正直・慈悲・知恵、あるいは知・仁・勇という意味があると説いたため、徳川時代にも、多くの学者がさまざまな方面から同じように説いている。たとえば山鹿素行は、『中朝事実』で盛んに三種の神器の教訓を説き、こう述べる。「玉は温かな仁の徳、鏡は物事を究める知、剣は決断の勇を表すものである。そのかたどるところ、表すところは、みな天神の至誠である。このときには、まだ三徳という名はなかったが、おのずからその名の意味は存在し、それに当たる神器も備わっていた。神器が備わっているだけでなく、それによって成し遂げる働きがあるのである。最も畏れるべきことである。ひそかに考えると、三器は天神の働きを成す器であり、三徳を完全に備えている。聖なる君主がこれを用い、内には自分の心を照らし、外には政治と教化を治めるのは、神代からの遺命である」。神道の学者は、とりわけ盛んにこうした説を主張している。たとえば、度会延佳は『陽復記』に、「この三種の神宝は、知・仁・勇の三徳を表したという古い伝えがあるので、孔子の道は、わが国の神道と等しい道と思われる」と説く。吉川惟足も、『神代之巻惟足抄』に、「事柄としていえば三種の神宝、理としていえば天子の御心である。三種の神宝は胸の内に収まり、胸の内は三種の神宝に現れる」と述べ、三種は儒道の知・仁・勇に当たるとする。さらに、「三種は鼎の三本の足のようなもので、まことに神道の最も大切なところ、王法のかなめであり、代々のお守りとして、国土を広く照らす光である」と説く。玉木葦斎も『藻塩草』に、「三種の宝物は、もとより国を伝える重宝、徳の手本、道の道具であり、神々が受け継ぎ、歴代の天皇が伝え、心の持ち方のかなめや修身の方法から、民を養い天下を治める道までを、物に表して示されたものである。神国の大本、神道の秘要である。天地の理、人倫の道は、すべてこの三種の外に出ることがなく、実に日月とともに掛かり、天地とともに朽ちない、万代に変わらぬ道の器なのである」と説いている。果たして三種の神器が、これらの学者のいうように、知・仁・勇の三つの普遍的な徳の教えを含むかどうかは、もちろん問題である。知・仁・勇の教えなどは、天照大神のころ、もとよりわが国にはなかったのだから、ここへ持ち込むのは、こじつけだとの批判を免れないだろう。しかし、こう考えることも、まったく根拠がないとはいえない。"

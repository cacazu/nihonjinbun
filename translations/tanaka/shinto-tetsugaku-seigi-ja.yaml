- "id": "st-0068-002"
  "section_id": "chapter-06-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "第六代の神は淤母陀琉神阿夜訶志古泥神と申す二柱の神である、之れに對して宣長の考證によりて解釋を下せば、かう云ふ工合である。淤母陀琉と申すのは『書紀』に於いては面足と記されて居るのであるが、其の意味は面と云ふのは即ち御顔である。御顏が段々と足りて來て不足な所がないやうに備はつて御出でになる。御顔の備はれるを擧げて其の他の手足なども皆十分に備はつて來られたことを示す御名前である。阿夜訶志古泥と申すのは、淤母陀琉神の御面の十分に備はつて來られるのを仰ぎ奉ると云ふと、畏み敬ふ所の意が起つて來る。其の畏み敬ふ所の意を以つて、阿夜訶志古泥神と申上げたのである."
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 67
    "url": "https://dl.ndl.go.jp/pid/943657/1/68"
  "translation_ja": "第六代は、淤母陀琉神と阿夜訶志古泥神という二柱の神である。これを宣長の考証によって解釈すると、次のようになる。「おもだる」は、『日本書紀』では「面足」と記されている。「面」は顔を意味する。顔が次第に整い、不足するところがないように備わってくる。顔が整ったことを挙げて、そのほかの手足なども、みな十分に整ってきたことを示す名である。「あやかしこね」というのは、淤母陀琉神の顔が十分に整ってきたのを仰ぎ見ると、畏れ敬う気持ちが起こる、その畏れ敬う意味から、阿夜訶志古泥神と申し上げたのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "第六代の神は淡母氏硫神阿夜詞憲古死神と申す二柱の神である、之れに對して宣長の考證によりて解釋を下せば、かう云ふ工合である。淤母陀琉と申すのは『書紀』に於いては面足と記されて居るのであるが、其の意味は面と云ふのは即ち御顔である。御顏が段々と足りて來て不足な所がないやうに備はつて御出でになる。御顔の備はれるを擧げて其の他の手足なども皆十分に備はつて來られたことを示す御名前である。阿夜訶志古泥と申すのは、游母陀琉神の御面の十分に備はつて來られるのを仰ぎ奉ると云ふと、畏み敬ふ所の意が起つて來る。其の畏み敬ふ所の意を以つて、阿夜訶志古泥神と申上げたのである."

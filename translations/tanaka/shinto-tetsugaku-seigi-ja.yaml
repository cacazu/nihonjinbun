  "translation_ja": "古伝を素朴で、きわめて幼稚なものとして解釈していけば、本居宣長のような解釈もできる。そもそも宣長の解釈には、全体を通じて、今日いうところの神話的な解釈が多い。この神話的な解釈をすることが、神道にとって最も有益なのかどうかは、大いに考えるべき問題だと思う。この点について私は、神話的な解釈はどこまでも、神道で採るべき解釈ではないと思う。もちろん、すでに述べたとおり、私は宣長の学説を非常に尊敬している。その学説に啓発されたことも多い。宣長を神道界の大学者として大いに尊敬し、その説から多くの教えを受けたことを、私は公言してはばからない。しかし、その説を初めから終わりまで、すべてよいものとして守り通すことは、学問に忠実な者のすべきことではないと思う。宣長の説であれ、篤胤の説であれ、よくないところは大いに改めるべきであろう。また、それを改めることが、先輩の学者たちに対して忠実な、学者の態度なのだと思われる。両翁の言葉を見ても、そうせよと書いてある。「後世、自分などの説によくないところを認めたなら、よい新たな説を唱えよ」とある。私たちが新説を唱えるのは、決して先輩に礼を欠くことではなく、大いに礼を厚くすることなのだと思う。さて、宣長の説を見ると、すべてを神話的に解釈しようとする傾向がある。例を挙げると、天照大神・月読尊・素盞鳴尊について、まず、その誕生を、宣長は『古事記』の伝えに従って説明している。伊弉諾尊が筑紫の阿波岐原で禊をされたとき、左の目から天照大神、右の目から月読尊、鼻から素盞鳴尊が生まれたという説を採っておられる。しかし、これはどうも不合理な説である。また、天照大神は太陽そのもの、天津日そのものである、というのが翁の解釈である。それに反対すると、たいへん畏れ多くもわが皇室の祖先であられる天照大御神が天津日であることをわきまえず、そのような議論をするのは、やはり漢意・漢習だ、というふうに言われる。しかし、これは非常に間違っている。そこで篤胤は、天照大神を天津日そのものとする解釈はよくないとして、天津日を主宰する神である、と改めた。ところが、その篤胤の説は、実は宣長の門人、服部中庸の説であり、中庸の『三大考』という本に書かれている。そして、その『三大考』は『古事記伝』第十七巻の付録となっている。宣長は『三大考』の末尾に跋を書き、これはよい説であり、この説によって初めて天・地・泉の解釈もすっかり明らかになった、と言っている。その『三大考』の説は、天照大神は天津日の主宰神であるという説である。ところが宣長は、天津日そのものだと言う。そうすると、『三大考』の末尾に跋を書かれる以上、宣長が『古事記伝』や『葛花』、『玉くしげ』、そのほかさまざまな本で、天津日が天照大神であるとしている説は、根本から崩れてくる。つまり宣長は、この場合、いわゆる論理的な自殺をすることになる。これを見ても、この点に関する宣長の説が、まだたいへん不十分であることの証拠になる。このように宣長は、まず天照大神が伊弉諾尊の目から生まれたという説を採り、日の神、月の神という言葉から、すぐに天照大神を日そのものと考えている。古伝はそう解釈しなければ、ほかに解釈の方法がないのなら、やむをえない。しかし、私たちは『日本書紀』によって、よりよく解釈できる。『日本書紀』を見ると、伊弉諾尊と伊弉冊尊がともに相談し、天下の主となる者を生もうとして、天照大神・月読尊・素盞鳴尊を生んだと、その正伝に書いてある。その説によれば、天照大神が目から生まれたという説を採らなくてもよいではないか。そして『古事記』より『日本書紀』のほうが朝廷の正史とされているのだから、古伝としては両書に軽重がないにしても、『書紀』によるほうが、むしろ自然だと思う。『日本書紀』に従い、伊弉諾尊と伊弉冊尊がともにおられたとき、天照大神を生んだという説を採れば、伊弉諾尊がお一人でおられたとき、その目から生まれたという、難しい解釈を採らなくてもよいのである。どうも宣長の説には、そのような傾向がある。そして、今の天津日という呼び方も、天照大神が光り輝き、その徳が非常に高く大きいので、私たちは大神を何と申し上げればよいか、言い表せない。そこで天津日と申し、太陽が四海を照らすように、その徳が高大であるとして、日の神とも、天照大神とも、天照大御神ともいうのである。こう考えれば、少しも難しいことはない。中国でも、孔子の門人が、孔子の徳がきわめて高大であるのをたたえ、「先生は日月である」と言っている。孔子が日月そのものだというのではなく、日月にたとえて言ったのである。このように解釈すれば、その点に何の困難もない。それを、日の神、月の神とあるからといって、すぐに結び付け、太陽がわが万世一系の皇統の、最初の祖先神であると説く。そして、それにあれこれ言うのは皇室に対して失礼だと言うのは、宣長のためにも、私たちはまったく採らない説である。"

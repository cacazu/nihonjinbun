    "text": "今少し神道道德の實踐的方面に就いて述べて見ると、一體支那では孝を以つて本として居る。孝は百行の本であると言つて居る。又、「父子親あり、君臣義あり、夫婦別あり長幼序あり」と言つて、先づ父子、それから君臣-支那は孝本主義である。けれども我が國のは忠孝一本主義である。即ち君臣の道を最も大事にするのである。それはどう云ふのかと云ふと、詰り我が國は親子の關係が最も親密である。親を尊ぶ事が非常に能く行はれて居る。であるから親に孝行をしやうと云ふことになつて來る。それではどうしたら親に孝行になるか。親に旨い物を食べさすことも、立派な着物を着せるのも、孝行の一つである。立派な家を作つてやることも孝行であるがそれよりも大事なことは、親の志を繼いで行く、親の精神に背かないことが最も大事である。其の親の志はどう云ふ所にあるかと云ふと、それは親の其の親、即ち祖父母の志である。祖父母の志は曾祖父母の志である。さう云ふ工合にズツと尋ねて見ると、吾々の祖先の志になる。祖先の志はどうであるかと云ふと、我々の祖先は神々であるか、或は皇族である。藤原家の者が今日我が國民には非常に澤山ある。所謂五攝家と云ふのは僅かであるが、藤原家の流を探したならば、日本に何千あるか、何萬あるか、何拾萬あるか分らない。其の源を尋ねて見れば天兒屋根命に歸して來るのである。又現在源姓を名乘つて居る者-姓は源、氏は何某などと-色々の氏はあるけれども姓は源と云ふのが何人あるか分らない。又姓は平氏と云ふのも幾らあるか分らない。併し其の源を尋ねて見ると源姓の者は〓和天皇に歸するか、又字多天皇に歸する。或は平家ならば桓武天皇に歸して行く。神ならば天兒屋根命に歸して行く、又は太玉命に歸して行くと云ふ工合になる。かう云ふ祖先の神々が皇室に忠節を盡されたことは言ふ迄もない。天兒屋根命は天孫降臨の際に最も重要な神として御降りになつて、最も忠節をお盡しになつた神である。其の志を今日藤原家の系統の者は承け繼がなければならぬ。即ち皇室に忠節を盡さねばならぬ。「大君の邊にこそ死なめのどには死なじ」と云ふ精神になつて來る。さうして大君の邊に死んだならば、それが親に最も大いなる孝行である。而して國家に取つて大いなる忠節である。即ち忠孝一本である。又一方から言つて我が國は家族主義である。皇室と國民とは宗家と別家の關係である。であるから宗家の爲に盡すことは其の家の爲に盡すことになる。さう云ふ點から見ても忠孝一本と云ふことになつて來る。そこで國家に一旦緩急があつた場合に、親が非常に大病であると假定する。若し自分が出征すれば外に看病する者がない。其の場合に出征すれば親は死ぬるかもしれぬ。出征しないで親を看病するのが孝行であるか出征して親を見棄てゝ置くのが孝行であるか。斯う云ふ場合に我が國民たる者は、須く親を棄てゝも國家の急に赴くべきである。是れは親に對して感情が薄いからでないので、親に對して親みがないからでないので、親の志が矢張り其處に在る。之れに類した實例は歷史に澤山ある。若し親が健全であつたならば、而して身が軍籍に在つたならば、親自から國家の急に赴くのである。不幸にして今病氣で行かれない。少くとも自分の子をやると云ふのは、親の精神である。若し親の精神に背けば、却つて大不孝である。此の點から見て、國家に忠を盡すのは詰り親に孝行になる。即ち忠孝一本である。外國に於いてはそれが出來ない。支那に就いて見ると、支那では此の前も述べたやうに「一夫の紂を誅するを聞く、未だ君を弑するを聞かない」。或は「天命じて之れを誅せしむ」と言ふ。詰り臣が其の君を殺すのが天命だとして居る。天命に背く事は出來ないと言つて其の君を弑するのである。從つて忠と孝とは一致することが出來ない。朱舜水と云ふ人が水戶に來て事人代。朱舜水の子は支那に居つて、朱舜水其の人は明の遣臣で、〓朝の爲に明が覆へされたから、日本の力を借りて明朝を恢復しやうと云ふの志、即ち國家に忠節なる所以で、朱舜水は實に忠臣である。所が其の子は〓朝の粟を食んだのである。して見ると其の子が親に孝行しやうと思へば、どうしても〓朝の粟を食むことは出來ない。矢張り父と同じやうに明朝の恢復を努めねばならぬ。然るに子は親の意志に反して、明朝をすてゝ、〓朝に仕へたのである。〓朝から見ると是れは忠臣である。朱舜水は亂臣賊子であるが、其の子は忠臣である。即ち其の子は〓朝に忠臣であつて、親には不孝兒である。忠孝が一致しない。忠孝一本でない。忠孝一本と云ふことは、我が國に於いて、萬世一系の皇統の下に於いて、初めて之れを見ることが出來る。即ち我が神道道德の特色である。"

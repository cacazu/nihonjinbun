  "source_text": "平田篤胤は天御中主神を以つて已に述べた通り、老子の謂ふ所の道、それから又『易』で謂ふ太極、『禮記』で謂ふ太一等と等しいもので、無始無終の神であるとして居る。要するに此の天御中主神と云ふものを絕對其のもの、即ち宇宙の本體と云ふ風に解釋するのは、多くの神道學者に於いて一致して居る所である。已に絕對其のものに解釋するのであるから、此の神は、生れられることもなければ、又滅せられることもない。即ち生滅と云ふことがないのである。其の質も增さるることもなければ、又減せられることもない。常住不變であつて、而して又一般普遍である。無盡であつて無限である。何かの原因又は條件によつて出來るものでもなく、變化せられるものでもない。そして又なんらの制限を受くるものでもない。從つて宇宙のあらゆるものを包含し、あらゆるものゝ原因となり、あらゆるものゝ條件となるべきものである。さう云ふのが此の天御中主神を說明すべき言葉である。であるから天御中主と云ふ言葉は、本居宣長の解釋に依つて見ると「天の御中に在まして、主(大人)たる神である」と云ふのである。詰り此の天と云ふのは、通常謂ふ所の宇宙を言ふのである。範圍の無限なる大宇宙を云ふのである。尤も後世之れに就いて、種々の意味を附けられて居る樣であるけれど、當時の天は、宇宙そのものである。從つて天と云ふのは無限である.(其の無限其のものを體として、此の神は御居でになる。だから此の神は、宇宙至る所に存在ましますのである。既に宇宙は無限であるから、何處でも此の無限の宇宙から言つて見ると云ふと御中であるのである。元來中と云ふことは中心と云ふことである。中心と云ふことは、何方へも距離の同じと云ふことである。所が、それが無限なんであるから、何の點でも其の點から上下左右にでも同距離である。つまりそこが直に中心になる。限りがあれば其の兩端の中を中心としなければならぬけれども、限りがないのであるから、何處でも或る點が直に中心となる。その中心が即ち天御中主神の無限の御體の中心となるのである。之れを吾々の身體に就いて見ても、若し指の尖に負傷でもすると、そこがひどくいたむ。そのいたむ所に吾々の全精神は存在するのである。併し身體の他の部分に、より大いなる事件あれば、全精神は、それに來り、又指の尖の負傷は念頭に殘らない。けれども餘地あれば直に亦復り來る。此の精神の身體の一部より他の部に移るには、殆んど何等の時間を要せざるが如く、實に間髮をいれないのである。唯、吾々の精神身體は不完全にして缺點多き、とても天御中主神に比較し得べきものでないけれど、もともと天御中主神の一部分として生存するものなれば、その性質に於いてしかく異るものでない。されば天御中主神の宇宙に於ける略、吾々の精神身體の關係を以つて類推し奉るべきである。從つて天御中主神の御全精神は宇宙至る所にましますと申すのである。天御中主神をさう云ふ風に解釋し奉るのであるから、隨つて本居宣長のやうに、此の神を此の世界以外に存在せらるゝ一つの神、即ち西洋で謂ふ所の「ゴッド」と云ふ風には解釋しないのである。平田篤胤などの說も、或る所では老子の道と同じやうに解釋されて居るけれども、又或る所に於いては本居流の說を奉じて此の神を世界外に置いて、さうして宇宙を創造せられた神であると見て、宇宙創造說と云ふものを組織しやうと云ふ計畫があつたのである。けれども神道の意味から見ると云ふと、さう云ふ風に解釋するのはどうかと思はれるのである。少くとも私はそれに賛成しない。本居平田二翁は、私は斯道の先輩大家として衷心の尊敬を致すのであるけれども、その說は、一から十まで、全部盲目的に服從することは出來ない。右の點などもその一つである。そこで私は先づ天御中主神は此の絕對其の物を申すのであると云ふ風に解釋して、それから更に進んで高皇產靈神、神皇產靈神の二神に就いて述べて、益々天御中主神の御德を明にしやうと思ふのである。"

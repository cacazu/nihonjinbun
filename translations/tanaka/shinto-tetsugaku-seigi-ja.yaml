  "source_text": "さう云ふ工合に言ふと、或は我が國の昔からの血筋を引いて居る所の國民、即ち大和民族と云ふものは確にさうであらうが、併し今日のやうに、朝鮮を併合し、臺灣を領土とし、樺太を支配する時代に於いては、此の我が皇化に浴しない所の朝鮮人、臺灣人殊に生蕃と云ふやうな者は、どうして神道に依つて治められるか。斯う云ふて批難する者があらう。けれども、我が此の神道には、偉大なる同化力と云ふものを有つて居るのである。であるから古代に於いて業に已に朝鮮人及び支那人は、多數我が國に歸化して來たのである。其の歸化した所のものはどうであるかと云ふと多くは皆大和民族に同化し了り相當な地位も身分も有して、我が君國の爲に忠勤をはげみ、神道を實踐したのである。其の一例を擧げると、『日本書紀』垂仁天皇の所に、斯う云ふ事實が一つ擧つて居る。「九十年春二月天皇田道間守に命じて常世國に遣はして、非時の香菓を求めしむ今の橘と謂ふ是れなり」と云ふ事が書いてある。此の田道間守と云ふのは即ち新羅王の子の天日槍の玄孫である。天日槍は歸化人である。此の歸化人の天日槍の玄孫が田道間守である。其の田道間守が天皇の詔を奉じて常世國に行つた。常世國と云ふのは何れ朝鮮若は支那の邊で、彼れの能く知つて居る所だらうと思ふ。そこで非時の香菓のあることも能く承知して居つた。それを天皇に申上げたものと思はれる。それで天皇からさう云ふ物を取つて來いと云ふ勅命が下つたものと見える。所が天皇は即位九十九年の七月遂に御崩れになつた。其の明年の春三月に田道間守が常世國から歸つて來た。非時の香菓を以つて天皇に奉らんとしたのである。所が天皇は御崩れになつたことを聞いて、大いに悲歎した。「臣命を天朝に受けて遠く異域に行つたのである。萬里の波濤を踏み、遙に弱水を渡つて行つたのである。常世の國は神仙の祕區であつて、俗人の至る所でない。此れを以つて往來に自ら十年を費したのである。臣はどうして當時再び無事に波濤を凌いで本土に還ることを思ひ設けやう。幸に聖帝の神靈に賴つて僅に還ることを得たのである。而るに天皇既に崩御まし〳〵て、今は復命することも出來ない。臣生くと雖も何の益かあらむ。」と云つて歎き即ち天皇の山陵に向つて哭泣して自ら死んだのである。群臣之れを聞いて流涕した。田道間守は是れ三宅連の始祖である。斯う云ふことが傳はつて居る。田道間守は即ち新羅人の子孫であつて、而して天皇に忠誠なことは、殆んど乃木將軍に似て居るのである。かう云ふ事は我が大和民族には固有の大道があつて、その大道は非常な同化力を有し、此の固有の大道の感化を受くれば、自ら大道に歸してしまふと云ふことを證明して居るのである。併し之れに就いては歷史家に依ると、田道間守は新羅王の子の天日槍の玄孫であると云ふのであるが、天日槍と云ふのは、もと〳〵日本人ぢやないかと言ふ人もある。けれども、其處の所は疑問であるが、確かに新羅王の子天日槍と書いてあるから、朝鮮人と見て差支なからうと思ふ。が、こんな疑問のでなく、純粹の朝鮮人が矢張り斯うである。それは薩摩國に伊集院村と云ふのがある。其の村に一部落があるが、其の部落は島津侯が朝鮮征伐の時に、朝鮮の陶工を少しばかり連れて來たのである。それを伊集院村に置いたのである。所がだん〳〵とその子孫が殖えて今日では戶數が數百を數ふるやうになつて居ると云ふ。それで其の中から日清の役、日露の役に澤山從軍して、金鵄勳章などを貰つた者も尠くないと云ふ。即ち是れなどは純粹な朝鮮人であるが、我が國に住し、我が皇化に浴し、我が國の大道の感化を受けて、我が國民的精神を斯の如く體認する事が出來たのである。其の通りに朝鮮の國民と雖も、臺灣の生蕃と雖も、將來漸次我が大道の感化を受けて、此の大道を奉ずることが出來るやうになるのである。"

  "source_text": "第四節產靈神の眞意義"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 51
    "url": "https://dl.ndl.go.jp/pid/943657/1/52"
  "translation_ja": "第四節　産霊神の真の意味"
  "translation_status": "reviewed"
- "id": "st-0052-002"
  "section_id": "chapter-04-section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "之れを我が古傳に持つて來ると云ふと、天御中主神は所謂太極で、所謂絕對である。其の絕對の屬性が高皇產靈神と神皇產靈神と云ふ風に解釋せらるゝのである。けれども私は今少しく別の解釋を立てゝ居るのである。それは高皇產靈神と云ふ神の御働きは常に活動せられて御居でになる。所が神皇產靈神と云ふ神は、其の働かれる其の物である。例へば茲に風と云ふものがあるとすると、風と云ふものは動くものである。併し風其の物は何かと云ふと所謂空氣である。空氣の振動が即ち風になる。であるから空氣を神皇產靈神とすると、動く所が高皇產靈神である。さうしてその全體が天御中主神である、どうも動く所がなければ、空氣の存在はちよつと認められない。併し動かなくても空氣は存在して居るのである。譬と云ふものは、本當の意味を十分に現はすことは到底出來ないが、先づさう云ふ風に見れば宜い。又水に譬へて見ると、もつと適切である。海に浪が立つて居ると云ふが、其の浪になつて居るのは海の水である。水を離れて浪だけを見やうと云ふことは出來ない。さう云ふ譯で浪と云ふものは、水と浪と兩方面から出來て居る。浪は常に活動して居るものである。そのものが高皇產靈神で、其の水其の物が神皇產靈神である。而して天御中主神と云ふのは、其の浪其の水そのものを云ふのである。そして浪から水を離すと云ふことも、水から浪を離すと云ふことも、共に出來ないのである。詰り同一體のものである。斯う見るのである。で、萬物が眼前に提出されて居るのは、此の高皇產靈神と神皇產靈神とに依るので此の二神に依つて萬物が生々化々して行くのである。萬物の生々化々して行く所の神德を高皇產靈神と言ひ、又神皇產靈神と云ふのである。けれども元は天御中主神である。それであるから天御中主神と云ふものを一つ別個のものとして離して見ることは出來ないし、又高皇產靈神、神皇產靈神を一つ別個のものとして離して見ることは出來ない。天御中主神と云へば、同時に高皇產靈神、神皇產靈神は中に包含されて來る。斯う云ふ譯になつて居るのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"

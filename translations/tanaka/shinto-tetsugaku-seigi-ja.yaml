  "translation_ja": "では、神道の学者はどう解釈していたのか。本居宣長は、神という言葉には昔からさまざまな説があるが、納得できるものはどうもない、しかし自分にも、まだまったく考えがつかないと言って、特に説を立てていない。その門人の平田篤胤は、まだ若いころ、『霊能真柱』という神道の書を書いた。その中で、「神」は「カビモエ」という言葉が音を変え、省略されたものではないかとする。なぜかといえば、可美葦牙彦舅神という神は、物事が成り始めたときに現れた神だから、「神」といえば、この可美葦牙彦舅神をもとに言ったように見える、というのである。このように、可美葦牙彦舅神という神から「カビモエ」という解釈を取り出し、それが音を変え、縮まって、「カミ」ができたと説明した。ただし、このときはまだ疑いが強く、「ではなかろうか」といった言い方をしていた。ところが後に、生涯の心血を注いで『古史伝』を著すに当たっては、この言葉こそ、あらゆる言葉の中で最初に理解しておかなくてはならないと述べる。そして「神」のもとは、『日本書紀』の冒頭にある「天地がまだ分かれず、陰陽も分かれず、鶏卵のように混沌とし、ほの暗い中に芽を含んでいた」という、その「牙（芽）」だとする。昔はこれを「アシカビ」と読んだが、それは誤りであり、「キザシ」と読むのも十分には当たらない。「カビ」と読まなくてはならない、というのである。この「カビ」の「カ」は、「彼」の意味で、物をそれと指して言う言葉である。「ビ」は転じて「ブ」となり、「加夫」となり、さらに「加牟」にもなる。そして「ビ」の意味は、まことに霊妙なものをいう。このような解釈である。そのほか、平田の学説を受け継いだ美甘政和は、「カ」は「カスミ・カゼ・カヲル・カスカ・カクル」などの「カ」であり、「ビ」は「奇霊（クシビ）」の「ビ」で、霊妙という意味だとする。鈴木重胤は「ミ」のほうを、精霊というような意味に解釈している。"

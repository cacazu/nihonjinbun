  "source_text": "併ながら吾々が此の七代神に就いて考へて見ると云ふと、決して此の古傳の七代神は、陰陽五行に配して解釋し奉るべきものでもない。又人間の身體に比して、解釋し奉るべきものでもないのである。又西洋のアダム、イブの說に附會して、解釋し奉るべきものでもない。此の七代神は、矢張り古傳に在るやうに、是れより前の神々と同じやうに、世界の最初-即ち今日で謂ふ地球の大初からして、伊弉諾、伊弉册二尊と云ふ人身を有して御居でになる神が、古代に御出でになつたのであるが、其の永い〳〵間の各時期に-當時古傳が思想して居つた所の各場合に、斯の如き神を立て申上げたのである。さうして斯の如き神が段々と御出になつて、此の國土の最初の國常立尊から、ズーツと伊弉諾伊弉冊二尊まで繼續して參つたのである、詰り、伊弉諾、伊弉冊尊に至る間の系圖なんである。其の系圖は、是れだけの神々を經て、さうして伊弉諾、伊弉冊二尊に至つたのである。即ち伊弉諾、伊弉冊尊が、此の國土の主神として御出になつたのである。此の國土の主神として御出になつたのには、國常立尊からして、斯の如き代々を經て、此の二尊に至つたのであると云ふことを、神道に於いて傳へて居るのである。斯う解釋し奉るのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 69
    "url": "https://dl.ndl.go.jp/pid/943657/1/70"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 70
    "url": "https://dl.ndl.go.jp/pid/943657/1/71"
  "translation_ja": "しかし、私たちが七代神について考えると、古伝の七代神は、決して陰陽五行に配して解釈すべきものでも、人間の身体にたとえて解釈すべきものでもない。また、西洋のアダムとイブの説に結び付けて解釈すべきものでもない。七代神は、やはり古伝にあるように、それ以前の神々と同じく、世界の最初、つまり今日いう地球の大初から、古代に人の身体を持つ伊弉諾・伊弉冊の二尊が現れるまでの、長い長い間の、それぞれの時期に立てられた神なのである。当時の古伝が思い描いていた各段階に、このような神を立てて申し上げたのだ。こうした神々が次第に現れ、この国土の最初の国常立尊から、ずっと二尊まで続いてきた。つまり、伊弉諾・伊弉冊尊に至るまでの系図なのである。その系図では、これだけの神々を経て、二尊に至った。二尊が、この国土の主神として現れたのである。国土の主神として現れるまでには、国常立尊から、このような代々を経て二尊に至った、ということを、神道では伝えている。このように解釈するのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "併ながら吾々が此の七代神に就いて考へて見ると云ふと、決して此の古傳の七代神は、陰陽五行に配して解釋し奉るべきものでもない。又人間の身體に比して、解釋し奉るべきものでもないのである。又西洋のアダム、イブの說に附會して、解釋し奉るべきものでもない。此の七代神は、矢張り古傳に在るやうに、是れより前の神々と同じやうに、世界の最初-即ち今日で謂ふ地球の大初からして、伊弉諾、伊弉册二尊と云ふ人身を有して御居でになる神が、古代に御出でになつたのであるが、其の永い〓〓間の各時期に-當時古傳が思想して居つた所の各場合に、斯の如き神を立て申上げたのである。さうして斯の如き神が段々と御出になつて、此の國土の最初の國常立尊から、ズーツと伊弉諾伊弉冊二尊まで繼續して參つたのである、詰り、伊弉諾、伊弉冊尊に至に間の系圖なんである。其の系圖は、是れだけの神々を經て、さうして伊弉諾、伊弉冊二尊に至つたのである。即ち伊弉諾、伊弉冊尊が、此の國土の主神として御出になつたのである。此の國土の主神として御出になつたのには、國常立尊からして、斯の如き代々を經て、此の二尊に至つたのであると云ふことを、神道に於いて傳へて居るのである。斯う解釋し奉るのである。"

  "translation_ja": "アメリカや南洋の先住民、あるいはインド人などは、みな西洋文明を取り入れ、その文明に、のみ込まれてしまった。わが国民は、どうか。歴史を見ると、昔からインドの思想が入ってきても、中国の思想が入ってきても、みな神道において同化してきた。そうして、いま入ってきた西洋の思想も十分に同化し、いわゆる第三の日本を築き上げつつある。神道は、仏教やキリスト教のような一つの宗教ではないのだから、それらのように互いを排斥し、ついには兄弟が内輪で争うような戦争を起こす、という不都合はしない。神道は包括的で、そのようなものを、みな同化していく。そして、神道は、まことに進歩的である。神道は、現世を超越し、現世から隔てられた来世を求めるのではない。そのような来世を求める教えは、保守的に流れがちである。しかし神道は、もちろん、ある意味での未来を求めるが、その未来は、現世と一体になった未来、発展した現世である。もともと神道には、一切経のような経文がなく、キリスト教のような聖書もない。そのような経典や聖書があれば、その外に出ることができない。しかし神道は、事実の道である。天御中主神や天照大神の徳を受けた神々が行動するところは、すべて神道となるのだから、神道は、時代に最も適した道なのである。キリスト教などは、ともすれば、先に述べたように、信教の自由を持ち出し、国家が神道を保護するといって不満を抱く。しかし国家は、憲法第二十八条で、安寧秩序を妨げず、臣民の義務に背かない限りで、信教の自由を認めている。この固有の大道である神道に背き、その排他的な性質をもって神道を排撃しようとすれば、天に向かって唾を吐くようなもので、自分を国外に追放してくれということになる。神道は、皇祖皇宗の遺訓であり、祖先の遺風である。要するに、わが国の大道である。わが国民である以上、一日も離れられない大道であり、国民を、天地とともに尽きることのない発展へ導く大道である。このような大道の存在を忘れ、いたずらに西洋に道を求めるのは、あの、頭を失った者と同じである。私たちは、この大道を十分に学理的に研究し、国民に深く体得させ、大いに発展させていかなければならない。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "米國の土人、南洋の土人若くは印度人などは、皆西洋の文明を入れて、其の西洋の文明に呑まれてしまつたのである。我が國民はどうであるか。之れを歷史に見るに、我が國民は昔から印度の思想が這入つて來ても、支那の思想が這入つて來ても、皆之れを神道に於いて同化して來たのである。かくて今や西洋の思想が這入つて來たのを十分に同化して所謂第三の日本と云ふものを築き上げつゝあるのである。神道は決して佛〓や基督〓のやうな一つの宗〓でないのであるから、彼れ等のやうに互に相排斥して遂には兄弟墻にせめぐ樣な戰爭を起すなどと云ふ不都合なことはしないのであ る。神道は包括的でさう云ふものを皆同化して行くものである。而して神道は實に進步的である。神道は決して、現世を超越した未來、現世と隔離した未來を求むるのではない。かう云ふ未來を求むる〓は、とかく保守的に流れる。けれど神道は、勿論或る意味の未來を追求するも、その未來は現世に相即した未來、發展したる現世である。元來神道には一切經と云ふやうな經文がない。又基督〓のやうに聖書がない。斯う云ふ經典や聖書があると、それ以外に出づることが出來ない。併し神道は事實の道である。天御中主神、天照大神の御德を受けて居る神々が、云爲行動せらるゝ所は皆神道となるのであるから、神道は最も時代に適切なる所の道である。基督〓などが動、もすれば先きに述べた樣に信〓の自由と云ふことを擔いで、國家が神道を保護すると言つて不平に思ふけれども、併し國家は憲法第二十八條に於いて安寧秩序を妨げず臣民たるの義務に背かざる限りに於いて信〓の自由を許して居るのであるから、此の固有の大道たる神道に背いたならば、さう云ふ排他的の性質を以つて神道を排擊しやうとしたならば、詰り天に向いて唾を吐くやうなもので、自身を國外に放逐して吳れよと云ふことになつて來るのである。神道は皇祖皇宗の遺訓である。祖先の遺風である。要するに我が國の大道である。苟くも我が國民たる所の者は一日も之れを離るゝことの出來ない所の大道である。而して我が國民を天壤無窮の發展に導く所の大道である。かゝる大道の存在を忘れて、徒らに道を西洋に求むるは、彼の頭を失つた所のものと選ぶなきものである。我々は十分に、此の大道を學理的に研究し、國民をして十分に之れを體認せしめ、大いに之れが發展を計らなくてはならぬ。"

  "source_text": "所が天御中主神や高皇產靈神、神皇產靈神に就いては、殆んど御名が傳はつて居るのみである。其の他に殆んで御事蹟と云ふやうなものが傳つて居らない。それであるから此の神々の性質、此の神々の御行ひ等は、吾々が斯くあつたであらうと云ふ研究を以つて決定するより外はないのである。其の中でもつて最も合理的であると信ずべきものに據るより外に仕方がないのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"

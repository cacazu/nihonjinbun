  "source_text": "尙、それから六月と十二月とに年々行はれる大祓も、半年間に起つた所の有ゆる我々の精神及び身體の罪惡を洗滌して、新たなる秩序的生活をやつて行かうと云ふ結果に過ぎない。先きに已に述べたやうに我が國民は來世と云ふことを考へないで、祓と云ふものに依つて常に罪穢を祓つてさうして新たなる活動を發展的にやつて行かうと云ふことを努めて居る。基督教などでは罪を免かれて天國に生れて行かうと云ふことを理想としてやつて居る。けれども我が神道に於いては、其の罪を拂ひ、穢を拂ふのは更に現世に於いて益發展し活動して行かうと云ふのである。どこ迄も現世にさう云ふ一段落を附けて、更に新鮮なる活動をして行かうと云ふのである。西洋では正月と云ふことを日本のやうに祝はない。勿論米國でも大晦日には市內も活氣づいて賑つて居つて、元日になると各工場で一齊に汽笛を鳴らす。丁度日本で百八の鐘を撞くやうな工合にやる。けれども、元日になつたからと言つて門松が立つて居るでもなし、年始客が新しい着物を着て往來するでもない。獨逸でも正月には○時一分と云ふ時に皆んなブローヂツト、プローヂツトと言つて、日本で言へばお目出度うと云ふやうなことを盛に言ふけれども、改たまつた儀式などもしないのである。勿論西洋ではクリスマスと云ふものを非常に重んずる。此の基督教の祭日を重んじて、其の時に色々な熱狂的な騷をするのである。けれども正月には何の事もない。所が我が國に於いては、正月の元日に、宮中に於いては最も嚴かなる儀式を行はれ、全國之れを大祭日として津々浦々に到る迄、注連を張つたり、かざりをしたり、さうして所謂正月衣を着たりして此のお正月を祝さないものはない。正月と大晦日とは格別時間の上からの差異はないのである。けれども、精神狀態に於いて偉大なる區別が出來る。詰り玆に萬事を新たにして、更に新生活に入つて生活をして行かうと云ふのである。而してそれが正月の元日と云ふので、秩序を重んじ統一を重んずる精神の發露と言はなければならぬ。一月一日と云ふものを大いなる祭日として、さうして茲に精神の一新紀元を劃すると云ふことは、我が國に初めて之れを見ることが出來る。無論支那などでも正月はあるけれども、迚も我が國のやうには行かないのである。"

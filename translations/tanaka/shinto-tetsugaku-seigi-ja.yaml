  "translation_ja": "神道は、神の道である。その神々について大要を述べたので、今度は神々の道について述べなければならない。そのためには、そもそも「道」という観念が何を意味するかを、まず明らかにする必要がある。道という言葉について、本居宣長の説では、「ち」がもとの言葉であり、今でも山路・野路・船路・通路など、みな「ち」とだけ言っている。それに「み」という褒める言葉を添え、「みち」という言葉ができたのだという。いずれにせよ、昔の「みち」は、私たちが日々通る道路以外の意味には使われていなかった。ところが、後世、漢字が入ってくると、「道」の字を日本語に訳す際に、「みち」を当てた。そこで「みち」という言葉の中に、「道」の字の意味が入り、それまで持たなかった、中国の「道」の意味を含むようになった。では、中国の「道」はどんな意味か。『説文』に、「道とは、行くところの道である」と説明されているように、昔はただ道路の意味に使われていたと見える。その後、中国の聖人や君子たちは、日月の運行や四季の巡りという自然現象、つまり天然のありさまを見て、ちょうど人間が外を歩くとき、一定の道を通っていくように、定まって現れていると考えたのだと思われる。人間が外を歩くとき、道を外れれば、よその家の台所へ飛び込んだり、溝に落ち込んだりする。道を歩いていれば安全である。道を歩かなければ、人に小言を言われたり、さまざまな障害に出会ったりして、目的地へ行くことができない。それと同じく、自然現象も、人が道路を歩くように、きちんと進んでいくものだと考えたのだろう。そこで、「陰となり、陽となる、これを道という」などと述べ、陰陽が交代していくことを道だと言った。また、「満ちてあふれ出すのは、天の道である」という言葉もある。物は一杯になれば、あふれる。一杯になるまではあふれないが、一杯になればあふれる。茶碗に水を入れれば、何度やっても、一杯になればあふれる。人間が外を歩くのと同じく、きちんと定まっている。このように見て、「満ちれば、必ず損なわれる。これが天の道である」などと言ったのである。こうして自然現象が起こっていくには、必ず一定の道筋があると見て、それを天の道と呼んだ。その天の道が、このように行われているのと同じく、さらに人間にまで及ぼしてみると、人間の日々の行いも、一定の道筋をたどっている。日常、人と接する間にも、一定の道筋があると見たのである。そこで、「父は慈しみ、子は敬う。兄は弟に親しみ、弟は兄を敬う。天がわが民に与えた常の道である」と言い、これを自然の道だと見た。また、「忠実で信義を守り、誠実で敬い深いことは、天の道である」と言い、君主に忠義を尽くし、友に信義を守り、人に厚く接し、敬うことを、天の道とした。このように、次第に意味を広げてきたのだと思われる。だから中国の董仲舒は、「道の大きな根源は、天から出る」と言っている。道は、結局、天から出ている。「満ちてあふれ出すのは、天の道である」、または「満ちれば必ず損なわれる。天の道である」というように、人間の道も天に基づき、天の道と同じように行われる。自然現象が本性に従って活動するように、人間も本性に従って行う。それは人間が自然に、先天的に得たものなのだと見たのである。そこで中国では、「本性に従うことを、道という」という言葉が生まれた。先天的な人の本性に従っていくことが、道なのである。中国の「道」の字には、このような意味が含まれている。人間が日常生活を送る上で、必ず守っていかなければならないものを、道と呼ぶ。道は身近にあり、ほんのひとときも離れられないもの、離れることのできるものなら、道ではないというのである。"

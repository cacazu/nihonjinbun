  "translation_ja": "哲学と宗教にはどのような違いがあって、それぞれの名がついているのだろうか。宗教とは、結局、私たちを超えるもの、すなわち人間以上のものを認め、それに従い、安心して暮らしていくあり方をいう。それと哲学をどう区別するかといえば、どちらも、もとは同じ伝説から出たものだから、厳密には区別できない。しかし今日の学者は、次のように区別している。まず、成立させた主体が違うという。宗教を築いた者と、哲学を築いた者が違い、宗教は民族的にできたのに対し、哲学は一人の人が唱えたものだというのである。宗教ではヨーロッパのキリスト教、ユダヤのユダヤ教、インドの仏教などと言うのに対し、哲学では誰それの哲学と言う、という区別である。しかし、これもあまり当たらない。仏教は釈迦、キリスト教はキリスト、ペルシャの宗教はゾロアスター、イスラム教はムハンマドというように、やはり一人の人が始めている。哲学で誰それというのと同じことである。また、宗教には神秘的な傾きがあり、想像的で、詩的でもあるのに対し、哲学は方法を備え、体系的で、全体を統括するものだ、というのも学者の立てる区別である。これは大まかな区別であり、もともと両方とも伝説から来ているのだから、はっきり分けることはできない。ヘーゲルの哲学とキリスト教のような宗教なら、このように区別できるが、仏教などには当てはまらない。仏教には神秘的な面もあれば、哲学的な面もある。もともと、宗教も哲学も、ともに世界観・人生観を立て、人間の精神的欲求を満たそうとする点では、少しも違わない。ただ、知の方面へ傾く人は哲学に満足を求め、感情や意志の傾向が強い人は、宗教に帰依して慰めを得ようとするのである。こういうわけで、動物と植物を根本から区別できないのと同じように、宗教と哲学も、根本からは区別できない。そこで今は、ただ、その傾きによって区別するだけなのである。"

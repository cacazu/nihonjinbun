  "translation_ja": "そういうと、わが国の古くからの血筋を引く国民、つまり大和民族については、確かにそうだろうが、今日のように、朝鮮を併合し、台湾を領土とし、樺太を支配する時代に、日本の天皇の教化を受けていない朝鮮人や台湾人、とりわけ当時「生蕃」と呼ばれた先住民を、どうして神道によって治められるのか、と批判する者があるだろう。しかし、わが神道には、偉大な同化力がある。だから、古代に、すでに朝鮮人や中国人は、多数わが国に帰化してきた。その帰化した人々は、どうなったかというと、多くは大和民族にすっかり同化し、それぞれの地位や身分も得て、君主と国家のために忠勤に励み、神道を実践した。その一例として、『日本書紀』の垂仁天皇の条には、次のような事実が挙げられている。「九十年の春二月、天皇は田道間守に命じ、常世国に遣わして、非時の香菓、今いう橘を求めさせた」と書かれている。この田道間守は、新羅王の子、天日槍の玄孫である。天日槍は帰化人である。その帰化人の天日槍の玄孫が、田道間守なのである。その田道間守が、天皇の命を受けて常世国に行った。常世国は、おそらく朝鮮か中国のあたりで、彼がよく知っていた所だろうと思う。そこで、非時の香菓があることもよく承知しており、それを天皇に申し上げたのだと思われる。それで、天皇から、そのようなものを取ってくるようにという勅命が下ったのであろう。ところが天皇は、即位九十九年の七月、ついに崩御された。その翌年の春三月、田道間守は常世国から帰り、非時の香菓を天皇に奉ろうとした。しかし天皇が崩御されたと聞き、大いに悲しみ嘆いた。「私は天皇の命を受け、遠く異国へ行きました。万里の波を越え、はるかに弱水を渡って行ったのです。常世国は、神仙の住む秘境で、普通の人が行ける所ではありません。そのため、往復に、いつしか十年を費やしました。あのとき、私が再び無事に波を越え、本土に帰れるなどと、どうして予想できたでしょう。幸い、聖帝の神霊に頼って、ようやく帰ることができました。それなのに、天皇はすでに崩御され、今は、復命することもできません。生きていても、私に何の役に立つことがありましょう」。そう嘆いて、天皇の御陵に向かって泣き、自ら命を絶った。群臣は、これを聞いて涙を流した。田道間守は、三宅連の始祖である。このように伝えられている。田道間守は新羅人の子孫だが、その天皇への忠誠は、ほとんど乃木将軍に似ている。このような事実は、わが大和民族には固有の大道があり、その道には非常な同化力があって、その感化を受ければ、おのずと、この道に帰することを証明しているのである。ただ、田道間守は新羅王の子、天日槍の玄孫とされるが、歴史家には、天日槍はもともと日本人ではなかったか、という人もある。その点は疑問ではあるが、確かに新羅王の子、天日槍と書かれているから、朝鮮人と見て差し支えないと思う。しかし、このような疑問のない、純粋な朝鮮人でも、同じなのである。薩摩国に伊集院村という村があり、その中に一つの集落がある。島津侯は、朝鮮征伐のとき、朝鮮の陶工を少人数連れてきて、伊集院村に住まわせた。その子孫が次第に増え、今日では数百戸に上るという。その中から、日清・日露の戦争に多数が従軍し、金鵄勲章などを受けた者も少なくないという。この人々は純粋な朝鮮人であるが、わが国に住み、天皇の教化を受け、わが国の大道の感化を受けて、わが国民的精神をこのように体得できたのである。同じように、朝鮮の国民も、台湾の先住民も、将来は次第に、わが大道の感化を受け、その道を奉じられるようになるのである。"

  "source_text": "さう云ふ工合にして、此の伊弉諾、伊弉冊二神は國土の各地方に主宰神を御定めになり、それから河海山川にもそれ〳〵主宰神を御定めになり、さうして着々と國土經營の業を進め給つたのであるけれども、併し此の國土を十分に完全に經營遊ばす事は、到底此の二神の永く現世に御止りになつて、なさる譯には參らないのである。そこで以つて二神は二神についで此の天下の主神たるべき神を定めやう、二神の跡を繼いで、天下を統御する神を定めやうと云ふ事を御協議遊ばして、さうして玆に三貴子と云ふものを御生みになつたのである。即ち此の三貴子が御出來になつてからと云ふものは此の伊弉諾、伊弉册二尊の時代は去つて、今度は三貴子の御活動の時代に這入つて行くのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 73
    "url": "https://dl.ndl.go.jp/pid/943657/1/74"
  "translation_ja": "このようにして、伊弉諾・伊弉冊二神は、国土の各地方に主宰神を定め、さらに河海山川にも、それぞれ主宰神を定めて、着々と国土経営の事業を進めていった。しかし、この国土を完全に経営するために、二神がいつまでも現世にとどまって事業を行うわけには、到底いかない。そこで二神は、自分たちに続いて天下の主神となる神、跡を継いで天下を治める神を定めようと相談し、ここに三貴子を生んだのである。三貴子が生まれると、伊弉諾・伊弉冊二尊の時代は終わり、今度は三貴子が活動する時代に入っていくのである。"

  "source_text": "以上神と云ふ意義を說いたから、進んで我が傳說の一番初めにある造化三神に就いて述べやうと思ふ。神道哲學の方面からは此の三神をどう云ふ風に解釋し奉れば宜しいかと云ふ問題である。前にも述べたやうに、此の世界と云ふものが、どう云ふ風にして出來たのであらうか、斯う云ふ問題を提起して考へて見ると云ふと、どうしても此の世界は、誰れかに依つて造られたに違ひない。或る人々は斯う考へて來るのである。それで支那では斯う云ふやうな事が傳へてある。「古、天地が未だ分れないで、混沌たる事が雞子のやうであつて、盤古氏と云ふ者が其の中に生れ出で、一萬八千歲にしてさうして天地が開けた。日は甲子、年は甲寅、清輕なるものは昇つて天となり、濁つて重い物は降つて地となり、盤古が其の中に在つたのである」と云ふ風な事が傳へてある。其の他盤古氏夫妻は陰陽の初めであると云ふ事も傳へてある。それから又盤古氏の後に天皇氏地皇氏人皇氏の三皇があつた。是れ即ち天地人の初めである。斯う云ふ事も傳へて居るし、又猶太の古傳にも神が世界を七日間に造られたと云ふやうな事も傳へられて居るし、又希臘へ行くと哲學でもつて、世界は水から出來て居るのであると云ふやうな事を言つて居る。斯う云ふやうに何れの國民でも世界の初めと云ふことに就いて、何とか其處に或る一つの考を得て、そしてその知識慾を滿足させやうと云ふ事を努めて居る。所で我が國民はどうであるかと言ふと、我が傳說に就いて見ると『古事記』には劈頭第一に「天地初發の時高天原に成りませる神の名は天之御中主神」斯う云ふ風に傳へてある。かくして造化の三神が成りまして國が稚くて海月の樣であつた時に葦牙の萌騰るやうなものに依つて神が一つ出られた。それは宇麻志阿斯訶備比古遲神と云ふのであると云ふやうなことが書いてある。又『日本書紀』を見ると「開闢の初洲壤浮漂すること譬へば游ぶ魚の水の上に浮ぶが如し。時に天地の中に一つの物生れり、狀葦牙の如し。便ち化りませる神を國常立尊と號す」と云ふやうなことがあり、尙『一書』には、「天地初めて判るる時一つの物虛の中に在り。狀貌言ひ難し、其の中に自ら化ませる神あり國常立尊と號す」と云ふやうな事が書いてある。斯う云ふやうな工合に、天地の初がどう云ふ風にして出來たか知らんと云ふことは色々人の頭を苦しめるので、そこで又色々の傳說が起つて來るのである。我が古傳に於いては、右のやうに『日本書記』では國常立尊が初めのやうに書いてある。『古事記』では天御中主神が初めのやうになつて居る。で、中古の、『日本書紀』の多く行はれた時代には、天御中主神と國常立尊とは同一の神であると云ふ意味にして居つたけれども、本居宣長に依つて『古事記』が研究されてから、矢張り別の神であると云ふことに一般になつて來た。"

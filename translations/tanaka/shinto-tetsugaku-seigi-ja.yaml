  "source_text": "要するに、天御中主神、高皇產靈神、神皇產靈神の至つて廣く、至つて大きく、至つて高く、至つて遠く、至つて眞、至つて善、至つて美なる御徳を享受せられて、此の國に御出になつた神々は、自ら歷史的、地理的關係の下に、偉大なる我が國民的精神を得たまひて、我が國民の儀表となられ、神として國民を指導開發せられたのである。即ち天照大神の直系にまします歷代の天皇は現人神として、秩序統一の根本となられ、崇敬渴仰の中心となられ、發展膨脹の源流となられて居るのである。かゝる萬世無窮の天皇を中心とし、恰も太陽を中心とし、多くの天體の活動するやうに歷代の多數の忠良なる我が國民は、天御中主神、高皇產靈神、神皇產靈神より亨受したる神德を發揮して、又神として盛に活動して、さうして神道を振興し、神道を發展し、以つて無限の將來に及ぶのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 91
    "url": "https://dl.ndl.go.jp/pid/943657/1/92"
  "translation_ja": "要するに、天御中主神・高皇産霊神・神皇産霊神の、至って広く、大きく、高く、遠く、真であり、善であり、美である徳を受け、この国に現れた神々は、おのずから歴史と地理の関係の下で、偉大な国民的精神を得た。そして、国民の手本となり、神として国民を導き、その力を開かせたのである。天照大神の直系にあたる歴代の天皇は、現人神として秩序と統一の根本、崇敬と渇仰の中心、発展と膨張の源流となっておられる。このように永遠に続く天皇を中心に、ちょうど太陽を中心として多くの天体が活動するように、歴代の多くの忠良な国民は、三神から受けた神徳を発揮し、自らも神として盛んに活動する。そして神道を興し、発展させ、限りない未来へ及んでいくのである。"

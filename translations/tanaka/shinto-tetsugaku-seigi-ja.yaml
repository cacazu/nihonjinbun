  "translation_ja": "また別の面から見れば、私たちには、生まれつき物事を知りたいという思いがある。物事を究めてみたいと思う。分からないことがあると、奥歯に物が挟まったような気持ちになるものだ。たとえば新聞に分からないことがあれば、辞書を引いたり人に尋ねたりする。「ねえ君、この間、新聞にこういうことが出ていたが、あれは何だい」と、すぐに聞いてみる。子どもが「お父さん、あれは何、これは何」と次々に尋ねる。これはどれも、物を知りたいからである。中国の朱熹という人は、四歳のとき、空を指して父に「これは何」と尋ねた。父が「天だ」と答えると、「天の上には何があるの」と聞いた。それで父は「不思議なことを尋ねる子だ」と言ったという。一般に人は、先ほど述べた山川草木が存在する根源や、鳥獣・虫・魚が存在する理由、その原因を知りたがるものである。私たちは親に孝行し、君主に忠節を尽くさなければならない。これは当たり前だとされるが、なぜ親に孝行し、君主に忠節を尽くさなければならないのかを究めたがる。このように天地の万物に驚きを覚え、そうなる理由を知りたいと思って、初めて研究してみる気になる。それはこういうわけだ、ああいうわけだと、自分で説明できるか、あるいは説明してくれる人がいて、初めて満足する。こうして私たちは哲学に入っていくのである。だからアリストテレスは、「古今を通じて、人は驚きによって哲学を志すものだ」と言っているのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "それから一方から見ると、我々は生れつき物を知りたいと云ふ考がある。物を究めて見たいと思ふ。解らない事でもあると奧齒に物が挿まつて居る樣な氣持がするものである。假令ば新聞に何か解らないものがあると字引を引くとか人に聞いて見るとかして見る、「オイ君此間新聞に斯ういふことがあつたが、ありや何だ」とすぐに聞いて見る。子供が「お父さんありや何だ、これは何だ」と矢鱈に物を聞く。これは皆物を知り度いからである。支那の朱熹と云ふ人。此の人が、四つの時に天を指し、父に向つて「これは何だ」と云ふ、父が「天だ」と云ふと「天の上には何物があるか」と聞いた。すると父は「奇妙なことを問ふ子だ」といふたといふことがある。凡べて人と云ふものは、以上述べたやうな山川草木の存在する根元、禽獸蟲魚の存在する所以、其の原因を知りたがるものである。我々は親に孝行をしなければならぬ、君には忠節を盡さねばならぬこれは當り前であるが、何故に親には孝行、君には忠節を盡さねばならぬかと云ふことを究めたがる。かう云ふ工合に天地萬象について驚異の念を起し、その然る所以を知らんとする考を生じ、夫れで始めて〓究して見る氣になる。これは斯うとかあゝとか自ら說明が出來るか。又は說明してくれる人があれば始めて滿足する。かくて我々は哲學に這入つて行くのである。だからアリストテレースは、吾今を通じて人は驚異によりて、哲學に志すものだ」と云つて居るのである。"

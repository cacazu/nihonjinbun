  "source_text": "さう云ふ工合で宣長の說でも、篤胤の說でも、徹頭徹尾之れを墨守すると云ふことは、神道の趣意に反する。神道は何處までも進歩的であつて、さう云ふ保守的のものでない。基督教などはバイブルと云ふものがあつて、此のバイブルの中から一步も外へ出ることが出來ないと云ふ。後世になるとバイブルより更に進んで細かい規定を設け、個條を作り之れに異說を唱ふれば、直に異教徒として、破門されてしまふ。或は佛教は、其の各宗派に於いて、その祖師の說ける教義から出ることは出來ない。若し出れば異安心、異端として破門されてしまふ。こんな工合に、歷史的宗教は、一般に墨守的である。神道はこんなものとは違ふ。神道は極めて進歩的のものである。さう云ふ譯であるから宣長、篤胤二翁の說に於いても、どうも一々それを信ずる譯には行かない。隨つて我々は宣長、篤胤二翁がさう云ふやうな說を立てたと同樣に、我々は今斯う云ふやうな說を立てゝ行くのである。どうかすると世間に神道を以つて極く朴素的のものにして、幼稚な意味で解釋しても、それで宜いではないかと言ふ人がある。神道は日本のものだから、昔のものだから、どうせ今日の考と一致する筈はない。だからそれは、それで、それとして置いて差支ないではないかと云ふやうなことを言ふ人がある。併し古傳の最初の邊は單に神名のみ傳はつて居るのであつて、その神名の中に無限の深長な意味が、包含せられて居る。その意味はその時代〳〵の最も進步した知識で僅に解釋し得るのである。是れ神道の進歩的の一の特色である。又一部の人々の信ずるやうに、此の天照大神の當時の社會と云ふものは、そんなに野蠻未開のものではない。どうも世間の人は神代と言へば極めて野蠻未開の時代のやうに思ふ人があつて困る。丁度都會のものが、地方を田舍〳〵と呼び、都會に比して甚しく未開の如くに思ふけれど、事實は想像と大いに異り、地方殊にその中心地の文明は、さまで都會に劣るものでない。是れと同樣に古代の文明も、色々の事實に就いて考へて見ると云ふと、それは意想外に開けて居る。勿論、物質的方面に於いては、今日と餘程異つて居るけれど、而かもそれとても、大正の現代と維新前との差の方が維新前と古代との差よりも大ではなからうかと思はれる。殊に精神的文明となるとその差と云ふものは、甚だ少くなつて來る。又單に時代から考へて見ても、我が國の神代と云ふものは、希臘に比較して見ても、もう希臘の文明の餘程發達した時期に相當して居るし、支那に比較して見ても、支那の周の時代に當つて居るのであるから、餘程支那の文明の開けた時代である。其の時代に日本のみが假令ひ交通が十分に行かないと言つても、さう〳〵野蠻未開の狀態に居る筈はない。そんな時代に、尙、且つ野蠻未開の狀態に居るやうな劣等な人種ならば矢張り今日と雖も、南洋の土人見たやうな狀態に居らなければならぬ。亞米利加印度人や、アイヌ種族のやうな狀態に殘らねばならぬ。所が今日は支那以上に進んで居るし、又世界の多くの强國と肩を竝べて行く位に文明の域に達して居るのである。是れは中々五百年や千年でもつて斯う云ふ文明ができて來るものではない。人は維新以來長足の進歩を爲したと云ふ。それは慥に長足の進歩をしたのである。慥に世界の一つの奇跡と云ふべき長足の進步をしたのである。けれども其の維新以來の長足の進歩と云ふものは素養がなくて出來るものではない。其の素養があればこそ此の進歩と云ふものが出來て居る。決して怪むに足りない。日本の歷史を十分調べて見ると此の進步は寧ろ當然である。であるから神代と云ふ時代が、そんなに野蠻未開の時代ではなかつたのである。隨つて其の當時の神々の作られた所の所謂古傳と云ふものには、勿論極く朴素的の思想も這入つては居らうけれども、又高尙な思想も這入つて居るものと吾々は推察するのである。隨つて此の高皇產靈神神皇產靈神をさう云ふ風に解釋し奉つて、當時御名前だけしか傳はつて居ないのであるからして、當時の古傳の眞意が何れにあつたかと云ふことは、正確に吾々が斷定することは難かしいけれども併し大體斯う云ふ風な思想であつたものであらうと思ふのである。"

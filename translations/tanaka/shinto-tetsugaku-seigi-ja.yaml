  "source_text": "天照大神に次いで、三貴子として、月讀尊、素盞鳴尊と云ふ重要な神々のましましたのは、已に述べた通りである。月讀尊に就いては、古傳が餘り傳はつて居らぬが、要するに天照大神の御補佐にまし〳〵たものと思はれる。素盞鳴尊に就いては、種々の古傳がある。それから素盞鳴尊の御子の大國主神と云ふ神が、天下經營の業に從事せられ、神道の各方面に著大な影響を遺され、又大國魂神として大神神として、神道に於いて一つの重要な神に在すのである、それから尙、天つ神の系統の神として、瓊々杵尊、武甕槌神、經津主神、天兒屋命、天太玉命、天鈿女命など重要な神々の澤山にましますのである。かゝる神々を總稱して八百萬神と申し奉るのである。而して天照大神の正統の神は、神日本磐余彥尊卽ち神武天皇に至り、以下現人神として歷代の天皇に及ぶのである。かゝる神道の神々の中で、殊に重要な神々に關し、詳細に之れを講述するは、極めて必要のことであるけれども、本書のやうな小册子では、それは出來ないのである。"

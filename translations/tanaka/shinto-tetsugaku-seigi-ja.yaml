  "translation_ja": "わが国固有の伝説は、神という観念から始まっている。ある意味では、その伝説は今も生きて働き、限りない生命を持って発展している。その内容は、すべて神々の活動の歴史だとも言える。したがって、伝説を根底として研究する神道哲学は、まず神とは何かを明らかにするところから始めなくてはならない。そこで、「神」という言葉はどのような意味を持つのかが問題となるが、昔から学者の間にはさまざまな解釈がある。たとえば、「神」は「鏡」や「鑑」という言葉が縮まったものだと解釈する学者がいる。忌部正通は、「カミ」は「カムガミ」の略であり、「カガミ」も、結局この「カンガミ」から出たものだとする。その意味は、神の心は明鏡が万物を映すように、何一つ見落とさず、わずかな塵も受けない、というように説明している。また僧の契沖は、「カミ」は「カガミ」の略で、「ガ」が省かれたものだと主張する。谷川士清は「明見（アカミ）」の「ア」が省かれたものと解釈し、神が明らかに照らして見守ることから、この名が生じたという意味に理解している。国語の学者が、このような解釈をする一方で、中国風の解釈を試みる者もいる。中国風というのは、中国では「徳は得なり」「仁は人なり」「義は宜なり」「天は顛なり」というように、音の近い言葉によって意味を説明するからである。この方法を取り入れて、「神」という言葉を解釈しようとするのが儒学者の説である。一、二の例を挙げると、貝原益軒は「神は上なり」と言っている。「カガミ」の「ガ」を略したという説が誤りであることは、『直指抄』にも見えるという。鏡がまだできないころから、すでに神の名はあった。「上」という字の正しい訓を取らず、鏡に結びつけてこじつけるのは、すべて間違いだというのが益軒の説である。伊勢貞丈もこの解釈を取り、「神をカミと言うのは、上という意味だ。尊ぶべきものだから、上にいらっしゃるという名で、カミと呼ぶ」と説明している。新井白石も、同じ種類の見方をする。白石の説では、神とは人である。日本の習慣では、およそ尊ぶべき人を神と呼ぶ。古今の言葉は同じだから、この「神」は尊称の意味に取れる。後に漢字を借りて書くようになったので、神と記したり、上と記したりする違いが生じたが、昔は、どちらもただカミと言ったのである。これらの学者の説は、いずれも神を「上」の意味で解釈しようとするものだ。"

  "source_text": "右のやうな譯で、天御中主神、高皇產靈神、神皇產靈神の御德に依つて、茲に葦牙のやうなものが出來て來たのである。其の葦牙のやうなものに對して可美葦牙彥舅神と云ふ御名を奉つたのである。其の葦牙の出來たのは、即ち吾々の住んで居る所謂世界の初めて其處に出來てきた所のものである。段々それが發展して今日我々の所謂太陽系となるのである。であるから太陽系の最初に出來た所の神を可美葦牙彥舅神と申したのである。斯う解釋するのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 61
    "url": "https://dl.ndl.go.jp/pid/943657/1/62"
  "translation_ja": "このように、天御中主神・高皇産霊神・神皇産霊神の徳によって、ここに葦の芽のようなものができてきた。その葦の芽のようなものに、可美葦牙彦舅神という名を捧げたのである。その葦の芽ができたのは、私たちが住む、いわゆる世界が、そこに初めてできたということである。それが次第に発展して、今日、私たちがいう太陽系になる。だから、太陽系の最初に成り出た神を、可美葦牙彦舅神と申し上げた。このように解釈するのである。"
  "translation_status": "reviewed"
- "id": "st-0062-002"

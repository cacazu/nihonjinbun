  "source_text": "託宣と云ふものはさう云ふものだから、本居、平田二翁がさう云ふやうな託宣を唯一の證據として、高皇產靈神、神皇產靈神が天地萬物を造られたと云ふことを主張されてもそれには餘りに其の證據が薄弱であると思ふ。そんな譯で、本居、平田二翁のやうな工合に、高皇產靈神、神皇產靈神が天地萬物を造られたと云ふのでなくして、高皇產靈神、神皇產靈神の神德の發現が、即ち世界の萬物である。此の森羅萬象を斯う云ふ風に吾々は解釋するのである。元來古傳では、唯天御中主神、高皇產靈神、神皇產靈神が在したと云ふ傳が主なる點であつて、其の天御中主神、高皇產靈神、神皇產靈神と云ふものには何等の御事業と云ふものが傳つて居らない。勿論それは高皇產靈神を今の天照大神の時の高皇產靈神と同一神であるとすれば、此の神には澤山な御事業が傳つて居るけれども、併し吾々の眼からすれば、古傳の解釋上どうしても別の神としなければならぬ、で之れを別の神とする以上は、古傳に於いて何等御事業が傳つて居らない。傳つて居らないとする以上、詰り高皇產靈神、神皇產靈神が天地を造り、又萬物を產まれたと云ふ解釋は本居、平田二翁の一家の言であるのである。それと同じやうに吾々は又吾々のやうに解釋することが出來るのである。唯、何れが最も能く神道の本旨を發揮するかと云ふことが問題である。神道の本旨に適へば其の說は取るべき學說であらうと思ふ。"

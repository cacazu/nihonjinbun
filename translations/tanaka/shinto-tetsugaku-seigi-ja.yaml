- "id": "st-0135-003"
  "section_id": "chapter-12-section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "神道は教育の根柢である。我が國の教育は何によりて行はるゝかと云はゞ、云ふ迄もなく教育勅語である事は、子供でも知つて居る所である。而して已に述べた通り、教育勅語に示されて居る所は、皇祖皇宗の遺訓である。祖先の遺風を顯彰すべき方法である。皇祖皇宗は即ち神であるから、その遺訓は神の遺訓である。神の道である。祖先は、又神として我々國民の祀る所である。その遺風は、神の遺風である。神の道である。此の故に神道は教育の根柢である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 134
    "url": "https://dl.ndl.go.jp/pid/943657/1/135"
  "translation_ja": "神道は、教育の根底である。わが国の教育は何に基づいて行われるかといえば、いうまでもなく教育勅語であることは、子供でも知っている。そして、すでに述べたとおり、教育勅語に示されているのは、皇祖皇宗の遺訓であり、祖先の遺風を明らかにし、たたえるべき方法である。皇祖皇宗は神であるから、その遺訓は神の遺訓、神の道である。祖先もまた、神として、私たち国民が祭るものである。その遺風は、神の遺風、神の道である。このため、神道は、教育の根底なのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "神道は〓育の根柢である。我が國の〓育は何によりて行はるゝかと云はじ、云ふ迄もなく〓育勅語である事は、子供でも知つて居る所である。而して已に述べた通り、〓育勅語に示されて居る所は、皇祖皇宗の遺訓である。祖先の遺風を顯彰すべき方法である。皇祖皇宗は即ち神であるから、その遺訓は神の遺訓である。神の道である。祖先は、又神として我々國民の祀る所である。その遺風は、神の遺風である。神の道である。此の故に神道は〓育の根柢である。"

  "source_text": "そこで我が國の古代に於いても、既に神と云ふ觀念が存在して居る。所が此の時代に方つて已に我が國には色々の神々が出られた。即ち伊弉諾伊弉冊の二神、天照大神と云ふ樣な色々の神々が古代に御居でになつた。之れと同時に此の時代に無智蒙味な下級の人民も、中々澤山あつた。一體『古事紀』や、『神代紀』を見ると、昔の人は皆神のやうに見られて居る。神代には神樣ばかりのやうに思はれて居る。又學者などでも、さう云ふ風に考へて居る人もあるやうである。神武天皇が東征に御出でになる時、釣を垂れて居る漁人に過はれた。臣は國津神某と云ふ。釣をして居るのも神である。斯う云ふ風に、何んでもかでも神代のものは皆神であると考へる人もある。けれども、どうもさうでないやうである。矢張り所謂神代と云ふ時代にも普通の人民は澤山居つた。其の證據には伊弉諾伊弉册の尊の所で、伊弉諾尊が一日に一千人を殺すと仰せになつたが、伊弉冊尊は千五百人を產むと仰せになつて居る。さうすると都合五百人宛餘計出來て行く勘定である。其の他天照大神の詔の中にも、色々靑人草と云ふ言葉がある。例へば保食神が素盞鳴尊に殺された時に、保食神の體から五穀が出た。天照大神はそれを見られて、「こは靑人草の食ひて生くべきものである」と言はれて、非常に御喜びになつた。それから又伊弉册尊が黃泉軍を率ゐて伊弉諾尊を御攻擊になる時に、伊弉諾尊は桃子に御助けられになつた。そこで伊弉諾尊が大いに感心遊ばして、桃子に、「御前は能く吾を助けて吳れた。此の葦原の中つ國の靑人草が、苦瀨に落ちて患しまん時に、又吾を助けた如くに助けて吳れ」と仰になつた。こんな次第で其の時に靑人草なるものが澤山居つたと云ふ事が分る。詰り靑人草と云ふのは、神代に於いて所謂神でない所の人民で、當時それが澤山居つた。靑人草所謂人民から見ると云ふと伊弉諾、伊弉册尊や天照大神の如きは、實にどうも飛び離れて尊い御方である。飛び離れて勝れた御方である。飛び離れて偉い御方である。偉い御方、勝れた御方、尊い御方である所の御方を、其の當時の靑人草が一般に崇敬し、之れをお上として之れに歸服したのは當然である。そして之れを神とするに至つたのも自然の順序である。此れと同時に當時の神々御自身にも、その權威、その崇高、その偉大によりて、當時の靑人草の頭となり、長となり、司となり、之れが支配者となり、之れが統御者となり、進んでは之れが主權者となり、遂に自ら神と仰せになつたものと思はれる。神の起源は、かう云ふ風であるが、之れより更に進みては、天地山川に靈的存在を認め、之れを主神とするに至つたのである。詰りさう云ふ譯で我が神道に於ける所の神と云ふのは、人々の勝れた偉い尊い方で、上に位せられる所の御方々、又爾かく、人々の考へて居る所の御方々を言ふのである。その結果として神は當然その本質は有形のものたるべきも、又爾かく考へられたる神に至りては、無形の神も亦存在せられ得べきである。であるから過去に存在ましました神も、矢張り神として尊敬し、又現在の人に就いても、矢張り神と言ふのである。それで先きに述べた樣に、傳說に於いては、古代人が自分の知識が非常に劣つて居るし、又德も劣つて居る。總べての點が劣つて居るものだから、それで例へば狼の如きでも、或は虎の樣なものでも、狐のやうなものでも、自分が或る場合にはどうもする事も出來ない樣な場合には、それを直ぐ神としたものである。"

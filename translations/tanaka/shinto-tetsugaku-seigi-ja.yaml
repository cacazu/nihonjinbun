  "source_text": "そこで私は斯う云ふ說を主張しやうとするのである。即ち此の古傳の一番初にある所の高皇產靈神と、それから後の高皇產靈神又の名は高木神と云ふ神とは全然別の神である。斯う見るのである。で、天照大神の時に御働きになつて御居でになる高皇產靈神と云ふのは、實際に人身を有して御居でになり、御子の神々も澤山御あり遊ばし、さうして當時の一大政治家で御居でになつた所の神である。所が其の神の勢力が非常に廣大であつたものだからして丁度天照大神の御徳が廣大であつたからして、それを直に後世日の神として、太陽其の物であるかのやうに解釋するやうになつて來たのと同じやうに、此の高皇產靈神と云ふ神の御德が廣大であつたものであるから、其の神を以つて直に此の宇宙の根本の神の御名を捧げたのである。詰り天御中主神の御德を二つに分つて、其の一方の德に高皇產靈神の御名を捧げ、他の一方の德に高皇產靈神と相對せる神皇產靈神の御名に捧げたものと解釋するのである。で、此の高皇產靈神が古傳に二通りに出て居るけれども、是れは前後全く別の神であると言ふのである。さう云ふ譯で私は高皇產靈神、神皇產霊神は天御中主神と御一體に在す神であると云ふことを主張せんとするのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"

  "source_text": "今若し宗教と云ふものを。世の成立宗教、卽ち佛教や基督教と云ふやうなものを標準として見る。さうして見ると先づ佛教や基督教の通有して居る所の特色を調べて見なければならぬ。之れを調ぶるに、彼れ等は先づ其の信仰して居る所の對象と云ふものを有つて居る。其の對象と云ふものが、基督教では神と言ひ、佛教では佛と云ふけれども、佛と言ひ神と言ふ名前は、日本語でさう云ふ區別をするのであつて、又彼れ等の國の言葉が違ふので、ゴツドと言ひブツダと言ふ。是れは英語とか印度語とか言語の上の差で、何れも英語で云へばゴツドである。どちらも和譯すれば神である。唯、通常ゴツドは譯して神と云ひ、ブツダは譯さないで原語のまゝに佛又はホトケ譯すれば覺或は覺者となると云ふに過ぎないのである。さてその對象たる神はどう云ふものかと見ると、それは兎に角人格的である。さうして又それが、其の主なるものは歷史的のものでなくして詰り想像的のものである。基督教のゴツドと云ふものは、何も此の世に出て生活をして居つたと云ふものではない.又佛教の佛にしても、或る種の者は釋迦の如く、淨梵王の太子であつたと言ふのである。けれども、併し我が國の佛教徒の多くが信じて居る所の阿彌陀と云ふものは一種の想像的のものである。其の他藥師と云ひ、觀世音と云ふ樣なものは皆想像的のもののやうに思はれる。釋迦より以前に過去七佛と云ふものがあつたと云ふのであるが、それなども想像に過ぎないやうに思はれる。さう云ふ風に想像的の神を描いて、それが未來と云ふものを支配して居ると云ふのが通有性である。基督教の神は天國にあつて天國を支配して居つて、佛教の阿彌陀は十萬億土に居つて極樂の主と云ふ風に考へるのである。此の現世界と云ふものを、極めて劣等なものに見て、未來を理想的の世界とするのである。で此の現世界を示すには穢れた世とか、汚き世とか、種々樣々に嫌な言葉を以つて、厭世的觀念を鼓吹し、さうして未來の天國と云ふものを光榮ある世界、理想的の世界と云ふ風に說くのである。隨つて此の世に於いて澤山子供を產んで、財產を澤山作つて、さうして、世俗的に盛に活動することは、彼れ等に於いは大いに排斥するのである。されば基督教では富める者の天國に生れるのは駱駝が針の孔を通るよりも難かしいと言ふて居る。又佛教などでも金銀財寶如何に澤山積み立てたとても、臨終の際に何の役に立つかと言ふのである。詰り此の汚れた世を早く捨てゝさうして彼岸に到ることを理想とするのである。隨つて教會にて祈禱もするし、寺院に參詣もする。さう云ふやうなことは皆所謂後生大事と云ふ觀念から來るのである。その結果として基督教などに於いては此の世の父の命に從はないでも、天の父の命に從へば宜しい。此の世の君の命には從はないでも天の主に從へば宜しい。斯う云ふ風に教へるのである。又佛教などに於いても此の世の父の命には背いても差支ない。佛果を十分に得れば、それが大いなる孝行であると言ふのである。であるから佛教の始祖釋迦は父の淨梵王からして如何に出家を思ひ止まるやうにと云ふ命令があつても、其の命令に應じなかつた。甚だしきに至つては、淨梵王が山の中に居つて嘸食物に不自由であらうと云ふので食物や衣服などを澤山釋迦の所へ持たしてやつたら、釋迦は之れを直に父の所へ突き返へした。平田篤胤は、どうも之れを突き返したのは餘りにひどい。假令自分が食はないとしたらば、川の中へ捨てゝも宜いから、親の志をうけ、頂戴しましたと云つてやつたら宜いぢやないかと云つて居る。か樣に佛教では家を捨て妻を捨て親を捨て子を捨て有ゆる物を捨てゝ、さうして山の中へ這入つて行くのが最も偉い行のやうにして居るのである。詰り斯う云ふ風に見て見ると云ふと、佛教にしても、基督教にしても、何れも國境と云ふ樣なものは、殆んど認めないのである。從つて國家と云ふ者を殆んど認めない。そこが彼れ等の世界教たる所以で、又世界の何れの國へ行つても布教せらるゝ所以である。詰り世界の人種といふ者を本に置いて立てた所の教である。或る一つの國家の教として作つた者ではない、そこで立教の本國たる印度が亡びても、猶太が滅びても、一切おかまひなしである。我々から見ると如何にも情けない。氣の毒に思はれる。我が神道では本國の亡ぶるのを見ると云ふやうな事は、夢にも我慢はできない。世間では宗教と云ふものゝ實例を求めると云ふと直に佛教を擧げ、基督教を擧げる。で宗教が今言ふたやうな特色を有つて居る所の佛教や基督教に限られて居るものとしたならば、神道は決して宗教でないのである。神道は未來に於いてさう云ふやうな想像的の神の存在を說かないのである。勿論例外はある。神道に於いても、多少未來を說くのもあるが其の代り又佛教や、基督教に於いても必ずしも未來を說かないで、現在を主として、其の說を立して居るのもある。今日の基督教では或は、基督教の神と云ふものは決してそんな想像的の神でないのである。宇宙の根本原理を神と言ふのである。神は道理であるなどゝ言ふのがある。又佛教にても、佛教は世間を離れたものではない。此の現社會に於いて時々刻々に活用の出來る所の宗教である。現社會を離れるものではないと說くものもある。が併しそれは何れも例外と見るべきである。佛教、基督教は、一般から云へば未來に重きを置いて居るやうに思はれる。神道は、來世は言はないのである。何處までも現世を主とするのである。そして佛教には極めて陰欝の氣が漂うて居る。勿論佛教も澤山宗派があるから、悉くはさうと云へないが、大體から言うて見ると、どうも陰欝の氣が漂うて居る。厭世的と云ふ風な傾向がある。又基督教もさうである。勿論今日の基督教は絕對に厭世的とも言へないが、併し元來の基督教にはさう云ふ傾向がある。であるから羅馬時代に於いては財產などは皆無くして山の中へ隱遁的生活をした者が澤山あつた。佛蘭西あたりの學校では寄宿舍を設けて此の世との交通を絕つと云ふやうなことをして居つたのである。それから又神道は生々主義である。何處までも子供を澤山產み活潑に社會に活動すると云ふ主義である。佛教や、基督教の方では、結婚をするけれども、一體から言へば結婚すべきではない。結婚してはならない教への立て方である所謂聖僧と云ふやうな者は結婚しない.基督教の偉い教徒と云ふ者は結婚しない。結婚しないのが非常に偉いとなつて居る。皆總べての人を偉くすると云ふのが彼れ等の理想でなくてはならぬ。佛教や基督教の道と云ふものは偉い佛教徒、偉い基督教徒にするのが彼れ等の理想であらうと思ふ。偉い基督教徒や偉い佛教徒になつて來ると子供は無いから、尤もモルモン主義には子供が澤山あるけれども、モルモン主義は、多數の基督教徒からは是認せられて居らない。かう云ふ次第で偉い佛教徒、偉い基督教徒は、結婚せず、子孫もないのであるから社會の人が皆偉い佛教徒、偉い基督教徒になつて來ると、子孫の種は絕えてしまふ。そこで國は滅びてしまふ。それが神道には大禁物である。神道は生々主義である。であるから正當に結婚し、正當に子孫の繁榮を計り、一家を振興し、進んで國家を振興すると云ふのが神道の主義である。けれどもそれが爲に品性を野卑にすると云ふやうなことは大いに戒めて居るのである。それから、此の基督教にしても佛教にしても極めて排他的である。基督教で見ると云ふと、他の者を異端として排斥する。佛教でも其の通りで、例へば日蓮宗の如きは眞言亡國、律國賊、念佛無間、禪天魔等と云つて非常に他を排斥する。けれども神道はさう云ふ事をしない。尤も中には神道にも排他的の傾向を有つて居るものも多少あるけれども神道は元來が包括的である。佛教でも基督教でも何でも構はない。彼れ等が神道に調和して來て、神道に反對して來なければ、之れを神道の中へ入れてゆくと云ふ風である。さうするとそこが神道に固定したものがない證據だと世間の人は言ふけれども、併しそれは、固定したものがない證據でなくして、神道が非常に大いなる道であることを示す證據である。勿論神道の中にも隨分佛教や基督教を攻擊するのがある。併しそれは彼れ等の間違つて居ることを攻擊するのであつて、決して彼れ等を容れないのではない。彼れ等の短所を改めて來れば神道は、直に之れを容れるのである。所謂信教の自由は、神道の聖典とも云ふべき憲法に於いて是認してあるのである。で佛教の如きは、我が國に這入つて來たのである。這入つて來たのであるが併し、原始佛教は我が神道と非常に矛盾し非常に撞着して居る。神道は是れが改革を促したのである。佛教は此の神道に促がされて、之れを改めた。かくて原始佛教は殆んど跡を絕つたのである、今日の佛教は多くは日本的の佛教である。第一妻をもち肉を食ふと云ふ樣な淨土眞宗の如きものは、他に殆んど見る事の出來ないのである。外の佛教から見ると可笑しなものである。それは神道化したのであつて、其の結果日本に斯くの如く容れられて居るのである。甞て、神棚の事などで問題になつたが、あれは本願寺の當時の當局が狹量なので、歷代本願寺は皇室に密接な血緣を有し、比較的に神道の本旨を奉じて居るのである。それで我が日本に命脈を保ち得て居るのである。神道化して來れば佛教でもズン〳〵神道は容れるのである。であるから基督教でも又、神道化して來ればズン〳〵容れることが出來る。即ち神道は佛教や基督教の如く極端なる排他的でないのである。それから基督教の如きは反政府的である。政治に反抗する傾向を有つて居る。世間では能く基督教に侵略教と云ふやうな文字を當てゝ居る。歐羅巴などに於いてはルーテル新教などは、當局者に最も反抗して國家に非常なる爭亂を惹起し、宗教戰爭と云ふ悲慘な戰爭をした。一體宗教戰爭と云ふものは言葉からして頗る矛盾である。宗教と云ふものは、敵を愛せよと云ふのである。然るに戰爭をすると云ふことは甚だ矛盾である。然るに到る處國家に反抗する。彼れ等は反政治的の傾向を有つて居る。所が神道はさう云ふことはない。神道は我が國家の政治そのものである。政治即ち神道と云ふのである。さう云ふやうな相違が神道と他の宗教とには在る。神道と宗教とはかく色々の方面に於いて異つて居るから、若し宗教と云ふものを今日の成立宗教に限つて、而して佛教や基督教を以つて其の代表者とするならば、神道は斷じて宗教ではない。斯う云ふ結論が出來るのである。"

- "id": "st-0106-004"
  "section_id": "chapter-09-section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "斯う仰せになつて居る。即ち此の憲法と云ふものは、詰り皇祖皇宗の後裔に貽し賜つた所の統治の洪範、大いなる法則に過ぎない。即ち明治天皇が憲法を御制定になつたのであるけれども、明治天皇が之れを新に御作りになつたのではない。皆皇祖皇宗の御遺訓である。皇祖皇宗の御遺訓を明徵にせられたに過ぎない。皇祖皇宗と云ふのは即ち吾々の申す所の神々である。詰り神の遺訓である。神の範である。即ち神の道である。此の故に憲法は神道の最も重要なる經典であると云へる。勿論すべての皇祖皇宗の遺訓は神道の經典と云ふべきもので、教育勅語も皇祖皇宗の遺訓で、その重要な經典と云はるゝけれど、憲法はその最も重要なる經典であると云へる。而して此の大典を御發布になると云ふことは、矢張り明治天皇が神道に依つて臣民を御慈愛遊ばす所の御精神が發揮して居るのである。それは當時明治天皇が御發布になつた勅語に、"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 105
    "url": "https://dl.ndl.go.jp/pid/943657/1/106"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 106
    "url": "https://dl.ndl.go.jp/pid/943657/1/107"
  "translation_ja": "このように仰せになっている。つまり、この憲法は、皇祖皇宗が後の子孫に残された統治の大きな規範、法則にほかならない。明治天皇が憲法を制定されたのであるが、新しく作られたのではない。すべて皇祖皇宗の遺訓であり、それを明らかにされたにすぎない。皇祖皇宗とは、私たちのいう神々である。つまり、神の遺訓であり、神の規範であり、神の道なのである。だから、憲法は神道の最も重要な経典といえる。もちろん、皇祖皇宗の遺訓はすべて神道の経典と呼ぶべきもので、教育勅語も皇祖皇宗の遺訓であり、その重要な経典といわれるが、憲法はその中でも最も重要な経典といえる。そして、この大典を発布されたことには、やはり明治天皇が神道に従って臣民を慈しむ、その精神が発揮されている。それは、当時の発布の勅語に、次のようにある。"
  "translation_status": "reviewed"

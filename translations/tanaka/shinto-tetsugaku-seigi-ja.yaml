  "translation_ja": "前節で述べたように、私たちは、さまざまなことを知りたいという強い欲求を持っている。そこで、すぐに常識に頼って説明を求める。さて、常識や哲学という言葉は、新聞など、どこにでも出てくるから、よく分かっているように思えるが、実際には案外分からないものである。哲学・常識・理想・連想などという言葉は、普通の人もいつも使っているが、その意味となると、ちょっと分からない。「理想」や「連想」といった題が、中等教員の国語漢文の検定試験などに出ることがあるが、いろいろな答案が出るそうだ。「連想の『連』は連絡の連、『想』は思想の想、だから、こちらの思いを向こうへつなぐことだ」といった説明をする。国語の学者は、『古事記』や『土佐日記』のような古いものだけでなく、今の国語も知らなくてはならない。国語の学者に限らず、現代の人は、もちろん現代の言葉をよく知る必要がある。ただ、今は国語の話をしているのではないので、この話は脇へ置こう。常識とは、英語のコモンセンスを訳したもので、コモンが「常」、センスが「識」に当たる。普通の意識、つまり私たちの普通の心の働きである。「普通」とは、一般の人が皆持っているということだ。たとえば「あの人が亡くなった、どこそこの太郎兵衛が亡くなった」と聞いて、「それはお気の毒だ」と言う。それが普通の意識の働き、常識の働きである。ところが「あいつが死んだって、それはよかった」などと言う人もいるが、これは一般の場合には、普通の意識の働きではない。よく「常識で判断したまえ」と言うが、それは、普通の人が持っている心の働きで判断せよ、ということである。たとえば月を見る。月の中に黒いものがある。「あれは何だろう」「うさぎが餅をついているのだ」「そうか、大きなうさぎだな」と言う。幼稚な説明ではあるが、やはり常識であり、ただ常識の程度が低いだけなのである。「ねえ君、この小刀は、なぜこんなにさびたのだろう」「床の下に落ちていたから腐ったのだ」と説明する。鉄の小刀が腐ったと言うのも、同じような常識による説明である。漁師が、明日は風だ、雨だとよく言い当てるのは、必要に迫られて天候を見るからである。これらは皆、常識で見ているのだが、その常識は科学や哲学とどう違うのか。漁師の天候の判断は、たいてい間違わない。しかし、その漁師を山国へ連れてきて、明日の天気はどうかと尋ねても、なかなか当たらない。当たらないのは当然である。漁師は、自分が住む海辺の地形に即して、風がどうだ、あの山の雲がどうだと、土地の様子について長年経験を積んだから、よく当たるようになったのである。山国へ来れば、四方八方が山ばかりで、目安にしていた山もないから、当てられない。ところが東京の天文台の先生を連れてくると、どんな山国でもたいてい当たる。西洋でも中国でも、たいてい間違わない。常識には、ときおり間違いがある。天文台の先生は常識ではなく科学で判断するので、間違いが少ない。間違いがないとは言わないが、まず少ない。同じ天気を見るにも、漁師と天文台の先生では違うように、常識で見ることと科学で研究することは違うのである。そもそも、私たちは常識による判断だけでは満足できない。月の中でうさぎが餅をついている、鉄の小刀が腐敗する、というだけでは満足できない。それを研究してみるのが科学である。科学とは、この宇宙の事物の現象に関する知識であり、いわば哲学の初歩である。さらに一歩進んだものが哲学である。科学は哲学へ入る門で、哲学は科学の奥の間である。だからといって、哲学が深遠だというのではない。身近な門から入れば、身近な奥の間へ上がれる、ということである。"

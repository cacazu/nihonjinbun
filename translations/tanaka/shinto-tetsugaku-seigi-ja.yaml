  "translation_ja": "それでは、わが国の「みち」という言葉には、中国の「道」の字が入ってくるまで、このような観念がなかったとすれば、儒学者が言ってきたように、わが国の上古の人々は鳥や獣と同じで、人の道をまったく理解しなかったのかどうかが問題になる。本居宣長は、「昔の大御代には、道という言葉を、わざわざ言い立てることさえなかった」と言っている。では、上古には道というものが一切なかったのかといえば、宣長は「まったくそうではない」とする。「皇国の昔には、道という議論はなかったが、道という事実はあった」というのが、翁の主張である。まったくそのとおりで、わが国の古代には、こうした意味での「道」という言葉はなかった。今日、西洋でいう本務や義務という言葉も、もちろん、なかった。しかし、私たちが実際に行う道という事実、本務に当たる事実は、十分に存在していた。ただ、その事実に「道」という名を付けるようになったのは、「道」の字が入ってきた後なのである。その言葉がなかったからといって、一派の学者がいうように、上古の人々が鳥や獣のようだったことは、決してなかったのである。"

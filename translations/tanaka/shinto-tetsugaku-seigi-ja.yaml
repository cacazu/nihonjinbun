- "id": "st-0016-001"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "或は宗教的感情に厚い人の中には、人は信念によつて動くのである。信念は感情に立脚する。神道の徹底は人の感情に訴へて然る後得らるゝので神道の哲學的研究の如きは無益であると主張するのである。勿論人は感情の動物とも云はるゝ位に、感情によつて動く場合も多いが、併し人の活動の淵源である信念は、單に感情ばかりから出來るのではない。之れには人の有する觀念槪念が餘程關係を持つて居る。で、我々は神道の哲學的研究を行ひ、人の精神の全方面から、日本哲學の神髓を發揮せんと務むるのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 15
    "url": "https://dl.ndl.go.jp/pid/943657/1/16"
  "translation_ja": "あるいは、宗教的感情の厚い人の中には、「人は信念によって動く。信念は感情に基づく。神道を十分に理解させるには人の感情に訴えてこそ実現できるので、神道を哲学的に研究することなど無益だ」と主張する人もいる。もちろん、人は感情の動物とさえいわれるほど、感情によって動くことが多い。しかし、人間の活動の源となる信念は、感情だけからできるのではない。その人が持つ観念や概念も大きく関係している。そこで私たちは神道を哲学的に研究し、人間の精神のあらゆる面から、日本哲学の真髄を明らかにしようと努めるのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "或は宗〓的感情に厚い人の中には、人は信念によつて動くのである。信念は感情に立脚する。神道の徹底は人の感情に訴へて然る後得らるゝので神道の哲學的研究の如きは無益であると主張するのである。勿論人は感情の動物とも云はるゝ位に、感情によつて動く場合も多いが、併し人の活動の淵源である信念は、單に感情ばかりから出來るのではない。之れには人の有する觀念〓〓念が餘程關係を持つて居る。て、我々は神道の哲學的〓究を行ひ、人の精神の全方面から、日本哲學の神髓を發揮せんと務むるのである。"

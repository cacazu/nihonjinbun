- "id": "st-0107-002"
  "section_id": "chapter-09-section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "朕國家の隆昌と臣民の慶福とを以て中心の欣榮とし、朕か祖宗に承くるの大權に依り、現在及將來の臣民に對し、此の不磨の大典を宣布す。惟ふに我が祖我が宗は我が臣民祖先の協力輔翼に倚り、我が帝國を肇造し以て無窮に垂れたり。此れ我が神聖なる祖宗の威德と、竝に臣民の忠實勇武にして、國を愛し、公に殉ひ以て此の光輝ある國史の成跡を貽したるなり。朕我か臣民は、即ち祖宗の忠良なる臣民の子孫なるを回想し、其の朕か意を奉體し、朕か事を奬順し、相與に和衷協同し、益、我か帝國の光榮を中外に宣揚し、祖宗の遺業を永久に鞏固ならしむるの希望を同くし、此の負擔を分つに堪ふることを疑はさるなり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 106
    "url": "https://dl.ndl.go.jp/pid/943657/1/107"
  "translation_ja": "「私は、国家の繁栄と臣民の幸福を、心からの喜び、誉れとし、祖宗から受け継いだ大権により、現在および将来の臣民に対し、この永遠に変わることのない大典を公布する。思うに、わが祖宗は、臣民の祖先の協力と補佐によって、わが帝国を建て、永遠に続くものとした。これは、わが神聖な祖宗の威徳と、臣民の忠実さと勇武、国を愛し、公のために命を捧げたことによって、この輝かしい国の歴史の実績を残したのである。私は、わが臣民が、祖宗に仕えた忠実で善良な臣民の子孫であることを思う。臣民が私の意を受けとめ、わが事業を助け進め、ともに心を合わせて協力し、ますます帝国の栄光を国内外に広め、祖宗の遺業を永久に揺るがぬものにする、その願いをともにし、この責任を分かち合えることを疑わない」。"
  "translation_status": "reviewed"
  "source_variants":

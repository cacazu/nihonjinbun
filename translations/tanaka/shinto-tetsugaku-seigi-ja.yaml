  "translation_ja": "この主張には、確かに一理あるようで、軽く考えると、なるほどと感心しそうになる。しかし、いったん退いて深く考えると、その根底に、一つの誤った見方が潜んでいると分かる。もともと、こうした人々から見ると、わが国の歴史には、多くの帰化人がいて、重要な役割を果たし、その多くが私たちの祖先となっている。だから、同じ民族、同じ血族などというのは、おもしろくない、ということが、その考えの出発点らしく思われる。もちろん、すでに述べた新羅人の子孫、田道間守は三宅連の祖となり、中国人の阿知使臣は、履仲天皇に仕えて蔵人となり、その子孫の坂上田村麿は征夷大将軍となって、功績が当代第一となったのは、有名な事実である。しかし、このような人々も、大和民族であることに差し支えはない。個人の家でも養子を迎えるが、わが国の系図では、養子は実子と、ほとんど区別がない。大和民族という大きな家族が、帰化人を養子にしたのである。大和民族に同化させ、その骨となり、肉となるようにしたのである。骨肉の親族は、同じ血族である。決して帰化人を、よそから来た客として扱ったのではない。アメリカのドイツ系の人々が、いつまでもドイツ系として、アメリカ人になりながらドイツ語を学び、ひとたびドイツに非常事態があれば、あらゆる手段でドイツのために尽くすのとは、同じには論じられない。わが民族は、帰化人を骨肉の一部にするまでやまないのである。同じように、新領土の朝鮮人も台湾人も、もちろん急にはできないが、長い年月のうちには、大和民族に受け入れ、すっかり同化させ、同じ血族にしてしまわなければならない。将来、わが帝国が、どれほど発展しても、この建国以来の国是は、変えるべきではない。インドを征服されたイギリス王は、インド皇帝となり、インド国民を、インド国民のまま統治されているようである。しかし、わが大和民族は、熊襲を受け入れ、蝦夷を受け入れ、しかも今日では、その痕跡を、ほとんど残していない。ロシアやオーストリア＝ハンガリーのように、ほとんど永久に人種の争いが絶えないことは、わが民族の選ぶところではない。大和民族は、どこまでも、その勢力の下に入る者を同化し、大和民族である栄誉に浴させ、神道の治める国民とするまでやまないのである。イギリスがインドに臨むような態度で、わが勢力の下に入る者に臨めば、たとえ急速に国力が発展しても、いつかは、アレクサンドロス大王の国家やローマ帝国のような運命に出会うことは、明らかな道理である。そして、それは断じて、わが帝国の建国以来の国是ではない。だから私は、今日の時勢、とくにロシアの失敗の歴史などを目の前に見せつけられる時勢において、祖先を敬う考えを、ますます徹底させる必要を痛感するのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "此の主張は、慥に一理あるやうで、輕卒に考へると成程と感心するやうであるが、退いて深く考へて見ると、一の謬見が、その根柢に潜んで居ることが認めらるるのである。元來、右の種類の人から見ると、我が歷史上には、幾多の歸化人があつて、それが幾多重要な役前を演じて居つて、そしてそれが澤山我々の祖先になつて居る。だから同一民族、同一血族などゝ云ふことが面白くないのであると云ふのが、その思想の出發點のやうに思はれる。勿論已に述べた新羅人の子孫に田道間守ありて。三宅連の祖となり、支那人の阿知使臣は、履仲天皇に仕へて藏人となり、子孫坂上田村麿に至りて征夷大將軍となり、功勳一世に冠たりしは、有名な事實である。けれどもかゝるは大和民族たるに差支へないのである。個人の家にても養子と云ふことをする、養子は、我が國の系圖では實子と殆んど區別ないのである。大和民族と云ふ大きな家族が、歸化人を養子にしたのである。大和民族に同化せしめたのである。大和民族の骨となり肉とならしめたのである。骨肉の親は同一血族である.斷じて歸化人を客分としたのでない。亞米利加の獨逸種が、いつまでも獨逸種として、亞米利加人となりながら、獨逸語を練習し、一朝獨逸の急あるや、百方獨逸の爲に盡すと云ふのとは、同日に云はれない。我が民族は、歸化人を骨肉化せしめなくては止まないのである。此れと同樣に、新領土の朝鮮人でも、臺灣人でも、勿論急速には行かないが、永年の內には、之れを大和民族に包容し、全然、同化し去つて之れを同一血族として仕舞はなくてはならないのである。將來、我が帝國が、どんなに發展しても、此の建國以來の國是は變更さるべきでないのである。印度を征服されたる英吉利王は、印度皇帝となつて、印度國民を、印度國民として統治せられて居るやうである。けれども我が大和民族は、熊襲を包容し、蝦夷を包容し、而かも殆んど之れが何等の根跡を今日に殘さないのである。露西亞や、墺地利匈牙利のやうに、いつまでも殆んど永久的に人種の爭の絕えないのは、我が民族の取る所でないのである。我が大和民族は、どこまでも我が勢力の下に歸するものを同化して、大和民族たるの光榮に浴せしめなくては止まないのである。我が神道治下の國民たらしめなくては止まないのである。英吉利の印度に臨むが如き態度を以つて、我が勢力に歸するものに臨まばたとひ、急速に國力の發展を見ても、いつかは、恰も歷山大王の國家、羅馬の帝國の如き運命に際會するは、見易きの道理である。而してかゝるは斷じて我が帝國の建國以來の國是でないのである。此の故に、吾輩は、今日の時勢に於いて、殊に露西亞の失敗の歷史などを眼前に、見せつけらるゝ時勢に於いて、痛切に祖先崇敬の觀念の益〓徹底を計るの必要を認むるのである。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0135-002"
  "section_id": "chapter-12-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "且つ夫れ、論者は、萬世一系の皇統を尊重し、益皇室の尊嚴を維持せんことを努むるを主張するも、祖先崇敬を無視し、或は少くとも之れをあまり重く見ないとして、その主張が可能であると思へるか。萬世一系の皇統を擁護せんとする國體の精華と、祖先崇敬とは、因となり果となり、密接不離の關係のあるのである。此の點、吾輩は猛省を求めて止まないものである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 134
    "url": "https://dl.ndl.go.jp/pid/943657/1/135"
  "translation_ja": "さらに、論者は、万世一系の皇統を尊重し、皇室の尊厳を、ますます維持することに努めるべきだと主張する。しかし、祖先を敬うことを無視し、あるいは少なくとも、あまり重く見ずに、その主張が実現できると思うのか。万世一系の皇統を守ろうとする国体の精華と、祖先を敬うこととは、互いに原因となり、結果となる、切り離せない密接な関係にある。この点について、私は、深い反省を求めてやまないのである。"
  "translation_status": "reviewed"

  "source_text": "さて祓と云ふものは後世になると云ふと色々に變化して來て、頗る煩瑣的、形式的のものとなつて來た。本居宣長は之れを歎きて「罪あるも、穢あるも、その重さ輕さに隨つて、同じく波良閇するは上代の法なり。然るを漢國の制をのみ專らならひ用ひらるゝ世になりて、上代のならはしは、何事もかはりて、此の波良閇の法もすたれゆきつるなり」と云ひ續べて近き世に神道者と云ふものの仕業を見るに佛教徒の佛をまつるわざを羨み做ひて、行ふ事のみ多くなれるを憤慨し、「何の祓、それの祓とて讀む文の、世にこれかれあるは、皆祓と云ふことの態を辨へざる後の世の人の作れるもので唯、例の唐めきたる事をのみ言ひて古の意詞ではない。祓には殊によしなき事のみである」と云つて居る。"

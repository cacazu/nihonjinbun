  "translation_ja": "しかし、明治天皇の時代に至って、初めて憲法というものが発布された。その憲法に基づいて、さまざまな法律も作られるようになった。この憲法を、一種の法律と見て、法律と同じように考えている者は、世間に多い。しかし、その実質をいえば、憲法は神道のきわめて重要な一つの典籍なのである。もし神道にバイブルがあるとすれば、経典があるとすれば、憲法は、その最も重要なバイブル、最も主要な経典である。なぜかというと、憲法発布にあたり、明治天皇は皇祖皇宗に告文を述べられた。その告文には、次のように書かれている。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "が、それが明治天皇の時に至つて、初めて憲法と云ふものを御發布になつた。其の憲法と云ふものに基いて、又色々の法律と云ふものも出來て來るやうになつた。が併し此の憲法と云ふものを一種の法律であると見て、法律のやうにして考へて居る者は、世間多く見る所であるが、併し此の憲法は其の實を言つて見ると、神道の最も大いなる一つの典籍である。若し神道にバイブルがあるとしたならば、若し神道に經典があるとしたならば憲法は最も重なるバイブルである、最も主なる經典である。何故かと云ふと、憲法御發布の際に方つて、明治天皇は皇祖皇宗に對して御告文を御述べになつた。其の御〓文にどう書いてあるかと云ふと、"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0106-003"
  "section_id": "chapter-09-section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "皇朕れ謹み畏み皇祖皇宗の神靈に誥け白さく、皇朕れ天壤無窮の宏謨に循ひ、惟神の寳祚を承繼し、舊圖を保持して敢て失墜すること無し。顧みるに世局の進運に膺り人文の發達に隨ひ、宜く皇祖皇宗の遺訓を明徴にし、典憲を成立し、條章を昭示し、內は以て子孫の率由する所と爲し、外は以て臣民翼贊の道を廣め、永遠に遵行せしめ、益〻國家の丕基を鞏固にし、八洲民生の慶福を增進すべし。玆に皇室典範及憲法を制定す。惟ふに此れ皆皇祖皇宗の後裔に貽したまへる統治の洪範を紹述するに外ならず。而して朕が躬に逮て時と倶に擧行することを得るは、洵に皇祖皇宗及我が皇考の威靈に倚藉するに由らさるは無し。皇朕れ仰て皇祖皇宗及皇考の神祐を禱り、併せて朕が現在及將來の臣民に率先し、此の憲章を履行して愆らざらむことを誓ふ"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 105
    "url": "https://dl.ndl.go.jp/pid/943657/1/106"
  "translation_ja": "「私、天皇は、謹んで畏れつつ、皇祖皇宗の神霊に申し上げる。私は、天地とともに尽きることのない大きな計画に従い、神ながらの皇位を継承し、古来の国のあり方を守って、決して失わせることがなかった。思うに、世の中の進歩に応じ、人文の発達に従って、皇祖皇宗の遺訓を明らかにし、国の基本となる法を定め、その条文を明示すべきである。内に向かっては、子孫が従う手本とし、外に向かっては、臣民が国を助け支える道を広め、永遠に守り行わせ、ますます国家の大きな基礎を固め、日本の民の幸福を増進すべきである。ここに皇室典範と憲法を制定する。思うに、これはすべて、皇祖皇宗が後の子孫に残された統治の大きな規範を受け継ぎ、述べることにほかならない。そして、私の代になって、時勢に応じ、これを実行できるのは、まことに皇祖皇宗と、わが父帝の威霊に頼ることによるものである。私は、皇祖皇宗と父帝を仰ぎ、その加護を祈るとともに、現在および将来の臣民に率先して、この憲章を誤りなく実行することを誓う」。"
  "translation_status": "reviewed"
  "source_variants":

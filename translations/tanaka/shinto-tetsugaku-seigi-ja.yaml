    "text": "主觀的に其の感情が吾々の方面にあるが、又客觀的に、此の森羅萬象が斯う云ふ工合に秩序整然として出來て居る。春夏秋冬は時を違へずして循環して行く。又吾々の體に就いて見ても、不要な物は漸次に除かれ、有用な物は益〓發達させられて行く。例へば人間も以前は尻尾を有つて居つたのだと云ふ。所が其の尾が今はない。何故尾がないかと言へば、詰り吾々に必要がない。犬や猫には色々の點に於いて尾が必要なんである。犬などは尾を動かす事に依つて感情を發表する。喜ぶ時には尾を振る。恐れて居る時には尾を下げる。さう云ふ工合に必要である。馬などの尾と云ふものは、蠅などの來るのを追拂ふ一つの必要なる道具なんである。又外見を飾る道具にもなつて居る。彼れ等には斯う云ふやうな必要があるけれども、人間は着物を着るから尾の必要はない。蠅が止つた所が之れを尾で追ふと云ふ必要もない。又尾を以つて表情の道具にすると云ふ必要もない。さうすると何方から見ても、尾と云ふものは不必要になつて來る。そこで段々世界の經濟的構成に依つて、尾がなくなつて來る。けれども今日吾々が尾が無いのを見て、人間には昔から尾がない、祖先以來尾がなかつたものだなどと言ふと、是れは大いに耻を搔く。何となれば比較解剖學に依つて解剖されると、ちやんと證據が出て來る。即ち腰の廻りに或る筋肉がある。其の筋肉は不必要な筋肉である。何の爲に存在するかと、專門家が調べると、まがうかたなく以前に尾があつた時に、其の尾を動かす爲の筋肉であるんである。それが幸か不幸か殘つて居る。それが證據である。どうしても仕方がない。それから又耳を動かす筋肉もある。昔は耳を動かした。所が今の人間は、東西南北何方へでも首を廻す事も出來れば、體を廻す事も出來るから、敢へて耳を動かす必要はない。馬などは體が大きくて、自由に後に向くと云ふやうな事が出來ないから、耳を動かすのである。所が人間に於いてはさう云ふ必要がないから、耳を動かす筋肉は殘つて居ても、耳を動かさない。ヒヨツとすると動かす人があるが、それは例外である。其の他皮膚を動かす筋肉も殘つて居ると云ふ。どうも困つたものだ。昔の人間は皮膚を動かして、蠅などが止ると馬の樣にピリ〓〓つと動かして、之れを追つたものだ。所が現今は着物を着て居るから蠅が止つても苦痛を感じないから、皮膚を動かす必要がない。それで其の筋肉が段々と退步して來る。之れに反して腦だの四肢だのと云ふ風なものは、巧妙に發達して來るのである。さう云ふ風に必要のものは益、發展して行くし、不必要のものは益〓衰へて來る。詰り是れは一種の經濟此の自然に一つの經濟と云ふものが行はれて居る。それから又他の方面から見ると云ふと、宇宙には色々の星などがあつて、始終循環して居る。どうも無限に斯うある星などが循環するならば衝突もしさうなものである。何時ぞや西洋で、來年の何月何日かに、地球が或る星に衝突して、粉碎されて仕舞ふ。從つて地上のあらゆるものも滅びてしまふ。だから財產などを殘して置いても仕方がない。皆んな使つて榮耀榮華をして置かないと、折角溜めた金が無益になつてしまふと云ふので、散々榮耀榮華をして、來年の何月何日かを待つたと云ふことである。所が其の日になつて見ると、一向地球が衝突しない。金は使つてしまつたので、非常に困つたと云ふ事があつた。さう云ふやうな譯で、地球が衝突するとか何とか云ふけれども、一向衝突もしないで、キチン〓〓と循環して行く。總べての力と云ふものが皆衝突しないで行く。之れを以つて見ると云ふと、何か此の點にも人間以上の或るものがあつて、さうして斯う云ふ風にされるものではないかと云ふ考がどうしても誰れにでも起らざるを得ない。其處に、茲に神と云ふ人間以上の者が在しますのである。斯う云ふ風な考、詰り一方からは主觀的に自分の心に或る一種の實在の感情を有つて居るのとそれから又客觀的には森羅萬象を見て、どうも是れは人間以上のものがあつて、斯う云ふ工合にされるのではないかと云ふ感じが起つて來る。斯う云ふ感じが殊に今日のやうに學問の發達しない古代に於いては强いのである。であるから古代には斯う云ふ觀念が非常に一般に行はれて居る。"

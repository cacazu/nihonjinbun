- "id": "st-0076-001"
  "section_id": "chapter-07-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "さう云ふ譯で著者は、『日本書紀』の初めに傳へてある所の伊弉諾、伊弉冊の二尊で、此の三貴子を御生みになつた。即ち天照大神、月讀尊、素盞鳴尊を御生みになつたものと主張するのである。何も『日本書紀の正傳』に斯う傳へてあるものを、それを强つて斥けて伊弉諾尊御一神で御生みになつたと云ふ說を採らなければならぬと云ふ理由は、少しも無いのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 75
    "url": "https://dl.ndl.go.jp/pid/943657/1/76"
  "translation_ja": "こういうわけで著者は、『日本書紀』の初めに伝えられるとおり、伊弉諾・伊弉冊の二尊が三貴子、つまり天照大神・月読尊・素盞鳴尊を生んだ、と主張するのである。『日本書紀』の正伝にこう伝わっているものを、わざわざ退け、伊弉諾尊お一人で生んだという説を採らなければならない理由は、少しもない。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "さう云ふ譯で著者は、『日本書紀』の初めに傳へてある所の伊弉諾、伊弉冊の二尊で、此の三貴子を御生みになつた。即ち天照大神、月讀尊、盞盞鳴尊を御生みになつたものと主張するのである。何も『日本書紀の正傳』に斯う傳へてあるものを、それを强つて斥けて伊弉諾尊御一神で御生みになつたと云ふ說を採らなければならぬとふ理由は、少しも無いのである。"

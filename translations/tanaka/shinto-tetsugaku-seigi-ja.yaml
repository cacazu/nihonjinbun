  "source_text": "支那では「易に太極あり是れ兩儀を生ず」と云つて居る。即ち太極が分れて陰陽となると言ひ。又『老子』には、「一、二を生じ、二三を生じ、三、萬物を生ず」とも說いてある。即ち一と云ふものから陰陽と云ふやうなものが出來て、それから天地人が始つて來ると云ふ風に解してある。又『易』には、「大なる哉乾元、萬物資つて始まる。大なる哉坤元萬物資つて生ず」と云ふ言葉があるが、始まると言ひ、生ずと言ふ。是れは餘程そこに意味があるやうである。で乾及び坤、或は陰及び陽、之れに依つて萬物が出來て來る。斯う云ふやうに見られる。それで陰と云ふのは消極的で、陽と云ふのは積極的であつて、共に太極と云ふものの属性と云ふべきである。支那の周茂叔と云ふ人は、「太極動いて陽を生ず。動極つて靜になり、靜にして陰を生ず。靜極つて動に復す。一動一靜互に其の根を爲す」と言つて居る。詰り太極が動くと云ふと陽になり、動いて極端に達すると靜になり、陰が出來て來る。靜が極まると云ふと又動になつて來る。動靜、靜動と始終循環して居る。斯う云ふ具合に動靜が循環して、萬物が出來て來ると言ふのである。即ち本は一つの太極で、それが或は陰となり、或は陽となり、さうして萬物が茲に出來て來るのである。斯う解釋して居る。所が朱子と云ふ人は理氣の說と云ふものを立てた。理が太極であつて、氣が陰陽であるとし、理は形而上で、氣は形而下であるとしたのである。斯う言ふと茲で二元と云つて二つの根本になつて來る。即ち理と氣と云ふものを別々に見て居るのである。さうなると云ふと、理と氣と先後の論が起るのである。理が初めにあつたのか、氣が初めにあつたのかと云ふことになつて來る。斯う云ふ議論になつて來ると、どうも朱子の考が餘り面白くないのである。矢張り陰陽と云ふものを以つて太極の二の屬性であると云ふ工合に解釋するのが宜からうと思はれる。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"

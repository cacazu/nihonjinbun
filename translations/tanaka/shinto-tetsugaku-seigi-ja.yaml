  - "kind": "ocr"
    "text": "されど佛〓的神道を嫌忌するの風は、漸次その勢を强くし、遂に伊勢の度會延佳の如き起りて盛に神道より佛〓を驅逐せんことを企てた。されどその自らの思想は極めて貧弱で、一に儒〓によりてその說をなさんと努めた。神道の文字が適切にその內容を得なかつたのは此の如く久しい間である。されば林羅山、大宰春臺のやうな學者でも。尙、且つ神道は已に支那の古代にあつたものだと信じて居た。されば林羅山は。德川義直に代りて『神祇寶典』に序を書いて、その言を結ぶに、「聖人神道を以つて〓を設けて、天下服す」と云ふ『易』の語を以つてして居る。大宰春臺も亦、「今の人、神道を我國の道と思ひ、儒佛とならべて是を一つの道と心得候こと大なる誤にて候、神道はもと聖人の道の中に有之候」と云つて居るが、併し『易』の神道と我が固有の大道とは決して同一のものでない。故に伊勢貞丈は、「凡、事物名は同じくして、實ことなることあるものなり」と『神道獨語』で道破して居る通りである。平田篤胤は、更に痛切に之れを論じて居る。それを少しく擧げて見ると、『易』の文に「天の神道」と云つたは、「四時不貳」とある如く、春夏秋冬の季候を貳はず、風吹き、雨降り、萬物の生出る所を以つて、天然の神道と云ふ心に云ひ、同じ『易』の文に「陰陽不測、之を神と謂ふとある神字の義で御座る。御國の謂ゆる神の如く、しやんと實物の神をさして、其神のなさるゝ神といふ義ではない、夫故に天の字と神の字の間へ、コレを訓む之の字を置て、「天之神道」と書き、天然の神道と云意に申したもので御座る」と云つて居る。誠にさうで、神道が支那にあつたと云ふのは、當を得て居らない。德川時代の燦然たる文藝復興と共に神道も大いに起り伊勢の度會延佳と同時に江戶に吉川惟足出で、京都に山崎闇齋出で、盛に神道を提唱したのである。が、皆或は儒〓に依り、或は佛〓に依つたもので、固有の大道を十分に發揮したものではないのである。固有の大道を十分に發揮して、神道と云ふ文字が神道の內容を十分に有するに至つたのは、荷田春滿、賀茂眞淵、本居宣長、平田篤胤の所謂四大人を俟つて後であつたのである。それから以後神道と云ふものが、神道の眞內容を有つて、世に行はれるやうになつて來たのである。"

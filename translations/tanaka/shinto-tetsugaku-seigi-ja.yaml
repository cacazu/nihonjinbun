  "translation_ja": "このように、上に立つ者は、大きな仁慈をもって下に臨み、このような憲法までも定められる。では、下にいる者は、どうすべきか。そう考えると、神代には、思兼神のような優れた神が現れ、常に天祖に仕えて策をめぐらしたという事績もある。また、大国主神という有力な神は、八百万の神を率い、長く皇孫のために仕えた。また天照大神は、天児屋根命と天太玉命に、「お前たち二柱も、ともに宮中に仕えて、よくお守りしなさい」と命じた。そこで、天児屋根命と天太玉命を、多くの神々と皇孫尊に付き添わせて地上へ下されたのである。二柱は皇居の中に仕えて、よく守られた。また、武甕槌神と経津主神という神が現れ、この二柱は、天祖に従い、わが国家と皇室のために勇敢に戦われた。そのため、後世にはこの神々を武神として祭るのである。このように、神々はみな忠誠をもって、この国家と皇室に仕えておられる。後世、儒教などが入ってきて、「堯・舜は天下を公のものとした」といい、「天下に、生まれながら尊い者はいない」といい、あるいは「天下は天下の人々のもので、一人の天下ではない」などと教えている。また「大徳のある者は天命を受ける」といい、徳の大きな者が天命を受けて天子になる、誰でも徳さえあれば天命を受けて天子になるといっている。そして、中国の湯王や武王が、その君主を追放し、討ち滅ぼしたことを弁解し、「夏には罪が多い。天が命じて、これを殺させる」といい、また「夏王朝には罪がある。私は上帝を畏れる。あえて正さずにはいられない」といい、あるいは「商の罪は、いっぱいに満ちた。天が命じて、これを討たせる。私が天に従わなければ、私の罪も同じになる」といっている。こうした弁解は、昔から中国でいわれているのである。そのため、孟子のような賢人でさえ、「臣下がその君主を殺してよいのか」と問い詰められると、「仁を損なう者を賊といい、義を損なう者を残という。残賊の人は、ただの一人の男という。私は、一人の男である紂を討ったとは聞くが、君主を殺したとは聞かない」といっている。もちろん、これに対して、後漢の王充は『刺孟』を、宋の司馬光は『疑孟』を書いて孟子を非難した。しかし、中国人の大多数は孟子のような考えを持ち、「君主が臣下を土や芥のように扱うときは、臣下は君主を敵として見る」と考えている。近年、中国人が、清の皇室である愛親覚羅氏に対して取った態度が、それを事実で証明している。だから中国の歴史を見ると、伏羲以来、王朝の姓を変えたものが三十、君主殺しとして記される者が二百といわれている。このように、中国では多くの君主殺しも、簒奪も行われた。中国の儒教には、そのような危険思想が含まれているのである。しかし、その危険思想を持つ儒教がわが国に入ってきても、わが国民は少しも感化を受けず、びくともしない。そして、わが国民の秩序と統一の思想は、それに対抗する形で、ますます発展してきた。大伴氏に伝わったという「海へ行けば水に漬かる屍、山へ行けば草むす屍となろうとも、大君のおそばでこそ死のう。安らかには死ぬまい」という精神は、永久にわが臣民の心を離れない。どのような危険思想が入ってきても、抵抗できるのである。「君のため、世のために、何を惜しもう。捨ててこそ価値のある命ならば」という歌に現れるように、誰もが、この秩序と統一の精神を表し、容易にほかの外来思想に妨げられず、どこまでも君主と国家のために、一身を犠牲にして顧みない。このような精神が、昔から、わが国民の間に力を持っているのである。"

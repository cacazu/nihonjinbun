  "section_id": "chapter-05-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "そこで鈴木重胤は、「故大人等の說等は、甚委しからず」と云ひ、自らは、「高天原はしも、現身の眼して見るときは、眇茫にして、空しきものなれども、隱身の神等のかんづまり、うしはき坐す神域で天地萬物の出自である」と『神代眞言』に說いて居る。橘守部も亦高天原と云ふからに必ずしも蒼空の上のいと〳〵高い處と思ふは拘泥のであると斷じ、そして面白い見解を述べて居る。即ち「天は現し世の人の目に見えぬ隈を云ひて黃泉と界して居る。要するに天も黃泉も幽冥の中のひとつづゝの名で此の世の間の外に出でない。近くいはゞ上下左右身體をつゝみて只手に障らぬのみである。遠くいはゞ所謂六合の間に充ちて只目にふれぬばかりである。しか目の及ばぬ間に天黃泉幽の別あつて神に就いては天と云ひ鬼については黃泉と云ひ此の二つを相攝て幽と云ふのである。」「天と云ふも、高天原と云ふもつまり此の國の外ならぬことを知るべきである」と論結して居るのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 62
    "url": "https://dl.ndl.go.jp/pid/943657/1/63"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 63
    "url": "https://dl.ndl.go.jp/pid/943657/1/64"
  "translation_ja": "そこで鈴木重胤は、「亡くなった先生方の説は、あまり詳しくない」と言い、自身は『神代真言』で、「高天原は、生身の目で見ると、ぼんやりと何もないもののようだが、姿の見えない神々が鎮まり、治めておられる神域であり、天地万物の生まれ出るところである」と説いている。橘守部も、高天原というからといって、必ず青空の上の、はるかに高いところだと思うのは、言葉にとらわれた考えだと断じ、面白い見解を述べている。つまり、「天とは、この世の人の目に見えないところをいい、黄泉とは境を分けている。要するに天も黄泉も、幽冥の中のそれぞれの名であり、この世の外に出るものではない。近くでは、上下左右から身体を包み、ただ手に触れないだけである。遠くでは、いわゆる天地四方の間に満ちて、ただ目に触れないだけである。その目の届かないところに、天・黄泉・幽の別があり、神については天といい、死者の霊については黄泉といい、この二つを合わせて幽というのである」。そして、「天といっても、高天原といっても、結局この国の外ではないと知るべきである」と結論している。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "そこで鈴木重胤は、故故人等の說等は、甚委しからず」と云ひ、自らは、「高天原はしも、現身の眼して見るときは、眇茫にして、空しきものなれども、隱身の神等のかんづまり、うしはき坐す神域で天地萬物の出自である」と『神代眞言』に說いて居る橋ず仰も來百天原云ふふからに必ずしも者交の上のいとしし高い處拘泥のである」と斷じ、そして面白い見解を述べて居る。即ち「天は現し世の人の目に見えぬ隈を云ひて、黃泉と界して居る。要するに天も黃泉も幽冥の中のひとつづゝの名で、此の世の間の外に出でない。近くいはド上下左右身體をつゝみて、只手に障らぬのみである。遠くいはゞ所謂六合の間に充ちて、只目にふれぬばかりである。しか目の及ばぬ間に、、黃泉、幽の別あつて、神に就いては、天と云び鬼については、泉泉と云ひ此の二つを相攝て幽と云ふのである「天と云ふも、高天原と云ふも、つまり此の國の外ならぬことを知るべきである」と論結して居るのである。"

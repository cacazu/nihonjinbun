- "id": "st-0020-002"
  "section_id": "chapter-01-section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "夫れで科學と云ふものは、我々が一般の常識では滿足が出來なくて一々を究めて何處へでも應用の出來る研究をして見たいと云ふので、研究して出來るのである。所が上古に於いては科學も又これから這入つて行く哲學も極めて單純なもので、それが所謂傳說によつて現はれて居る。元來この傳說と云ふものは當時の民族の文化の精華を集めたものである。尤も其の哲學科學と云つても、今日のそれらと比べて同じとは云はれぬ。つまり傳說は當時の文明の精華が悉く集まつて居るのである。言ひ換ゆれば傳說は當時の哲學である、科學である、歷史である、道德である、宗教であるといふ樣にあらゆる物が包含されて居るのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 19
    "url": "https://dl.ndl.go.jp/pid/943657/1/20"
  "translation_ja": "このように、科学は、普通の常識では満足できず、一つ一つを究めて、どこででも応用できる研究をしたいと考え、その研究から生まれる。ところが太古には、科学も、そこから入っていく哲学も、きわめて単純で、それがいわゆる伝説として現れている。もともと、この伝説というものは、当時の民族の文化の精華を集めたものである。もちろん、その哲学や科学が、現代のそれらと同じだとは言えない。つまり、伝説には、当時の文明の精華がことごとく集まっているのである。言い換えれば、伝説には当時の哲学・科学・歴史・道徳・宗教といった、あらゆるものが含まれている。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "夫れで科學と云ふものは、我々が一般の常識では滿足が出來なくて一一ををめて何處へでも應用の出來る研究をして見たいと云ふので、〓究して出來るのである。所が上古に於いては科學も又これから這入つて行く哲學も極めて單純なもので、それが所謂傳說によつて現はれて居る。元來この傳說と云ふものは當時の民族の文化の精華を集めたのもである。尤も其の哲學科學と云つても、今日のそれらと比べて同じとは云はれぬ。つまり傳說は當時の文明の精華が悉く集まつて居るのである。言ひ換ゆれば傳說は當時の哲學である、科學である、歷史である、道德である、宗〓であるといふ樣にあるらゆ物が包含されて居るのである。"

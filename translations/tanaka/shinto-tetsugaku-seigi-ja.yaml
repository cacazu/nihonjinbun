  "source_text": "神道は、神の道である。その神々の事を大要述べたから、今度は神々の道の事に就いて述べなければならぬ。それに就いては、道と云ふ觀念は一體どう云ふ事を意味して居るのであるか、先づ之れを明にしなければならぬ。道と云ふ言葉は本居宣長の說に依つて見ると、知と云ふのが本の言葉であつて、今でも山路、野路、船路、通路など皆チとばかり言つて居る。それに美と云ふ稱める言葉を添へて、美知と云ふ言葉が出來て居るのであると云ふのである。何れにしても美知と云ふ昔の言葉は唯、吾々が日々通行する所の道路の意味の外には使はれて居らなかつた。所が後世漢字が這入つて來るやうになつて漢字の道の字を日本語に譯す時に、此の美知と云ふのに當嵌めた。そこで以つて此の美知と云ふ言葉の中へ、道の字の意味が這入つて來る樣になつた。詰り美知と云ふ言葉が、今迄有つて居なかつた支那の道の字の意味を、其の中へ包含するやうになつた。それで、支那の道の字の意味はどう云ふのであるかと云ふと、『說文』に「道、行く所の道なり」と云ふ說明が與へられてあるやうに、昔は唯、道路の意義に使つて居つたものと見える。それから支那の聖人とか、君子とか云ふやうな人々は、日月の運行、四時の循環と云ふやうな自然現象即ち天然の有樣を見て、どうも是れが人間が丁度外を歩くのに、一定の道を執つて行くやうな工合に、定つて現象して居るのであると見たものと思はれる。人間が外を步くのに道を外れれば他所の家の臺所などへ飛び込んだり、又は溝の中へ落ち込んだりしなければならぬ。道を歩きさへすれば安全である。道を歩かないと云ふと、人から小言を言はれたり、何かして色々の故障に出くはして、目的の地へ行く事が出來ない。さう云ふ工合に此の天然現象も矢張りキチン〳〵と、人が道路を歩くやうに進行して行くものであると思つたものと思はれる。そこで「一陰一陽之れを道と謂ふ」などゝ云つて陰陽の交代して行く所が道であると言ひ又「盈て蕩は天の道なり」と云ふ言葉もある。物が一杯になれば溢れてしまふ。一杯になるまでは溢れないけれども、一杯になれば溢れる。茶碗へ水を入れるのに、何遍入れても一杯になれば溢れる。丁度人間が外を歩くのと同じ事である。ちやんと極つて居る。さう云ふ風に見て又「盈れば必ず毀つ天の道なり」などゝ云つたものである。かう云ふ工合に天然現象が現象して行くのには、一定の道筋と云ふものが必ず在ると見た。さうして之れを天の道だと云ふ。所が其の天の道がさう云ふ風に行はれて居ると共に、更に之れを人間に及ぼして見ると、人間が日々行つて行くのは、矢張り一定の道筋を經て居る。日常、人に接する間に於いて、一定の道筋を經て居ると見たのである。そこで「父字ひ、子祇む。兄友に弟恭、天惟、我が民に與ふ彝なり」と云ひ、之れを天然の道であると見たものである。或は「忠信篤敬、天の道なり」と云ひ、君に忠義を盡し、朋友に信義を守り、又人に接して篤く、又敬しんで居ると云ふことは、是れは天の道である。斯う云ふ風に段々及ぼして來たものと思はれる。であるから支那の董仲舒と云ふ人は「道の大原天に出づ」と言つて居る。道と云ふものは詰り天に出て居る。「盈て蕩くは天の道なり、」或は、「盈れば必ず毀つ天の道なり」と云ふやうな工合に、人間の道も天に基いて、天道と同じ樣に行はれるのである。即ち自然現象が本性に從つて活動して居るやうに、人間も本性に從つて行ふ。そこが人間の天然に得た所のものである。先天的に得て居るものである。斯う見たのである。そこで支那では「性に率ふ、之れを道と謂ふ」と云ふ言葉が起つて來る。先天的である所の人の本性に率つて行くのが即ち道である。で支那の道の字には斯う云ふ意味が含まれて居る。人間が日常生活する上に於いて必らず守つて行かなければならぬものを道と云ふのである。道は近きにあるのである。須臾も離るべからざるものである。離るべきものは、道ではないのであると言ふのである。"

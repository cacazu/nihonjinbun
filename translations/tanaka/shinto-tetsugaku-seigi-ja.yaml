  "translation_ja": "以上の「神」という言葉の解釈をまとめると、神には、おおよそ三つの見方があると分かる。政治の立場から見れば、益軒や貞丈のように、「上」という字で解釈し、上にいらっしゃる人だと説明する。宗教の立場から見れば、やはり平田流の、霊妙なものという意味になる。道徳の立場から見れば、忌部正通の一派のように、神は鏡のように万物を照らし、私たちの心の善いことも悪いことも、すぐ神に映るのだとする。神がそのように照らして見守っているのだから、いつも善いことをし、悪いことをしてはならない、という解釈がついてくる。しかし神道は、政治・宗教・道徳というような、一つの方面だけに限られた道ではない。だから、ある一面を中心として「神」を解釈しようとすると、非常に難しくなる。近ごろは、モンゴル語などを研究し、「カミ」の語源をそこに求める人もいる。しかし神という観念は、西洋の学者が、人間に先天的にある、つまり生まれつき備わっていると言うほどのもので、世界のどこに住み、どの人種に属していても、その存在が認められる。もちろん、非常に発達したものと、きわめて幼いものとの違いはあるが、何らかの神のような観念を持たない人種は、まずないと言ってよいだろう。こうして「神」に当たる言葉は、さまざまな人種に共通してあり、生まれつきのものともいわれるほど古い言葉である。そのため、今日の国語研究者がいろいろな方面から研究しても、「神」という言葉を正しく説明するのは、なかなか困難だと思われる。十分に納得できる解釈を得るのは難しいだろう。ただ、「神は上である」という説は採用すべきものに思える。この「神」と「上」は同じだという解釈は、語源の研究というわけではない。語源ならば、「カミ」がどんな根本から出たかまで、さかのぼらなくてはならない。しかし、ひとまず「神」は「上」と同じだとする説が、最も穏当だと思う。つまり、上にいらっしゃるものを神と呼ぶのである。今日でも朝廷を「オカミ」といい、長官を「カミ」という。昔も伊予守・武蔵守などと言った。「頭」「長」「守」は皆同じ意味で、ただ漢字を当てたために違う字を書くが、「カミ」ということでは同じだろう。これに反対して、「神」と「上」には音の高低、いわゆるアクセントの違いがあるから、同じではないと言う人もいる。なるほど、日本語では垣・柿・牡蠣はどれもカキだが、アクセントが違う。「カキを食べました」と牡蠣のアクセントで言えば、柿を食べたと思う人はいない。逆に柿のアクセントで言えば、牡蠣だと思う人はいない。よく挙げられる橋・端・箸も、どれもハシだが、音の高低で意味が変わる。「神」と「上」にも、鎌と釜のような違いがあるというのである。確かに鎌と釜は違い、神と紙も違う。しかし「神」と「上」には区別がないように思う。そこで私は、まず、わが国の神の意味は「上」から来ていると解釈したい。そして、先に挙げた忌部正通流や平田篤胤流の説も、この意味に含めて、上にいらっしゃる方は、おのずと霊妙な徳を備え、おのずと下にいる者を照らし見守る、と説明すればよいと思う。今日の事実を見ても、長官などは、やはり部下より優れている。もちろん、長官にも凡人がいる場合はあるが、それは例外で、一般には、長官になる人には学問の素養が豊かにあり、徳も高い。だから部下が、このくらいのことをしても長官には分からないだろうと、ごまかそうとしても、長官はよく見抜く。これが、照らして見守るということである。部下から見ると、まるで神のように思える。優れた人と比べると、知恵が足りないだけで、これほど違うものかと思うほど、愚かな人は同じことをするにも遠回りし、たいへんな時間・労力・費用をかける。ところが賢い人は、すぐにやってしまう。数学などでもよく分かる。大きな川の向こうに、大きな木が一本あるとしよう。その木の高さは何尺あるか、こちらから測ってみよと言われても、普通の人にはできない。できても、いろいろな苦労がいる。しかし数学に優れた人は、平気でやってしまう。何丈何尺あると答え、疑って実際に測ると、確かにそのとおりである。数学を知らない人には、まるで神のように思える。このように、あらゆる方面で優れた人が神になるのである。これは知識の面で見たが、道徳の面でも、たとえば、朝早く起き、堅い忍耐をもって働き、慈愛の心に富む人などは、普通の人からは神のように見える。普通の人には及ばない。乃木大将などが、その一例である。学問という点では、乃木大将の学問は、それほどではないと思われる。軍人ではあるが、軍略や戦略となると、若い中佐や大佐で、海外で大いに研究して帰ってきた人に比べれば、大将のものは古く、比較にならないかもしれない。それでも乃木大将が、大きな価値を持ち、一般の人々から尊崇されるのは、結局、その人格が優れているからである。人格は誰にも、等しく備わっているが、その人格には、はなはだしい優劣がある。優れた人格は神と同じ、いや、神そのものである。乃木大将は、生きているうちから、国民に神として尊ばれていた。要するに、どの面から見ても、上に位置するものが神であり、上に位置する者は徳が優れている。その徳が優れたものこそ神なのである。わが国の伝説には、狐も狸も狼も、皆、神となっている。しかし、こうしたものは、当時の下層の人々が、その力には人間が到底及ばないところがあると見て、神としたのである。当時すでに神であった方々までが、そのようなものを神としたわけではない。神道で神というのは、結局、上にいらっしゃるものを神というのである。"

  "source_text": "それでは其の道とはどう云ふものであるかと云へば、それは今まで述べて來た通りであるが、併し之れを道德の立脚地に立つて見ると、詰り我々の日常行ふ所の標準は眞心に在る。本居宣長は之れを斯う言つて居る。「道は必ずしも學問して知ることにあらず、生れながらの眞心ぞ道にはありける」。では其の眞心とはどう云ふものかと云ふと、更に宣長は、「眞心とは產靈神の御靈によりて備へ持て生れつるまゝの心を云ふ」と言のである。即ち眞心と云ふものを我々は產靈神-天御中主神から受けて生れて居る。眞心は先天的の者で神の分靈である。或は神その者であるから、之れに依つて行へば、それが、とりもなほさず神道であるのである。君臣の道も、父子の道も、夫婦の道も、兄弟の道も、朋友の道も、皆眞心から出て來るのである。之れに依つて行へば臣が君に對しては忠となり、子が親に對しては孝となり、妻が夫に對しては貞となり、弟妹が兄姉に對しては悌となり、朋友の間には信となるのである。假令忠を盡しても、孝を盡しても、夫婦相和して、兄弟が友を守つても、眞心がなかつたならば、それは形式に流れてしまふ。徹底的に行かない。皮相である。上スベリである。是れでは神道の道德でない事になる。支那の道徳には形式が多くて困る。例へば君臣義あり、夫婦別ありと言つて居る。であるから遂には「君君たらざれば臣臣たらず」と云ふ言葉も出て來る。「三度諫めて聽かれざれば則ち去る」と云ふ事も起つて居る。夫婦別ありなどと云ふから、夫婦の間が十分に相和することが出來ない、自ら疎くなるやうな傾がある。けれども我が國に於いては眞心を以つて之れに對して行くのであるから、君臣間に於いても「君君たらざれば臣臣たらず」などとは言はない。「君君たらずとも臣臣たり。」即ち臣は何處までも臣としての道を踏んで行かねばならぬ。「大君の邊にこそ死なめのどには死なじ」死を以つて大君の爲に盡すのが神道の道德である。又夫は妻を愛すべきである貞節を重んずべきであるが、妻も亦何處までも貞節を尊ぶと云ふことを、神道に於いては重んずるのである。是れは大國主神が旅立たれる時に須勢理毘賣命が仰せになつた言葉に傳つて居る。之れを見ても如何に古來妻たるものが貞操と云ふことを重んじたかと云ふことが分つて居る。さう云ふ工合に神道に於いては眞心を以つて君に事へ、眞心を以つて親に事へ、夫に事へる、何處までも眞心を以つて押し通すのである。"

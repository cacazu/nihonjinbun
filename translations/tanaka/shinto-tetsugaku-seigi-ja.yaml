  "translation_ja": "天照大神には、今述べたように、さまざまな名がある。それらがみな太陽と関係するため、前にも述べたとおり、本居宣長をはじめ、多くの学者が、天照大神は太陽であると考えている。しかし、天照大神は、決して太陽ではない。平田篤胤は、大神を太陽そのものとする説は不合理だとして、太陽の主宰神が天照大神だと主張しているが、これも当たらない。そもそも宇宙の万物が、すべて精神と生命を持ち、人間と同じように活動し、また人間以上の能力を持つという考えは、昔の人に一般に見られたものである。だから、ギリシャ人などは星を人間と同じように見て、生きているものとしている。このような考えは、今日でも、なお未開の民族に見ることができる。星も、そのほかの動物も植物も、また風や雨や地震なども、みな生きたものと見る。その中でも、最も激しく、最も人類に影響を与え、最も注意を引くものは太陽である。太陽は、日照りが何日も続けば、草木を枯らし、家畜を焼き殺すほどの勢いを持っている。また、春の暖かな日光は、私たちの健康に大きな効果をもたらし、その力で穀物が実り、万物も育ってくる。このような偉大な勢力を持つ太陽を見て、神として崇拝するようになるのは、自然に起こることだと思われる。フランスのルソーは、こう述べている。「地球は人類の小さな島であり、私たちが日々、最も強く目にするものは太陽である。私たちが外へ目を向けると、太陽は自然に、まず目に触れる対象となる。だから、すべての野蛮人の哲学は、地球を空想によって区分することと、太陽の神性を説くことにほかならない」。このように太陽は、すべての人の注意を引き、その崇拝の対象となることができる。わが国にも昔、青人草と呼ばれる多くの人民がいたのだから、その人々の間で太陽崇拝が行われていたのは、事実だろうと思う。そのときに、天照大神が現れたのである。その徳は広大で限りなく、ほかに比べるものもない。そこで、それまで太陽を崇拝していた下層の人々は、すぐに天照大神を太陽と同じものと見るようになったと思われる。だから古伝のある部分で、天照大神がまるで太陽であるかのように伝えられているのは、少しも不思議ではないのである。"

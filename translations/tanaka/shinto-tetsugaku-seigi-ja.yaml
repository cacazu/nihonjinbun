  "source_text": "要するに產靈神は、天御中主神の發現にましますので、森々羅列の萬象盡くその御德の發現である。殊に人類は、二神の御徳により自發的にその神德を發揮するの能力を有し居るが故に、他の生物に比して優秀なる地位を得て、所謂萬物の靈長たる事を得るのである。而して人類中にありて我が國民は地理的歷史的關係の爲に、此の神德を惟神的に能く發揮し得來つたのである。我々は益〻之れが發展を計り、國民をして盡く神たらしめなくてはならぬ。教育勅語に「咸その德を一にせんことを庶幾ふ」と宣ひたるも、亦かゝる聖旨と思はれる。是に至つて上下皆神にして、神國神道の名實、相備はり世界の人民、何等の威嚇をも加へないで、赤子の慈母を慕ふやうに、何等の壓力をも與へないで、靑草の春風に靡くやうに、我が陛下の大恩澤を慕ひ來り、我が皇室の大稜威に靡き、國威の伸張、國運の發展理想的の境に達するのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 59
    "url": "https://dl.ndl.go.jp/pid/943657/1/60"
  "translation_ja": "要するに、産霊神は天御中主神の現れであり、あらゆる現象は、ことごとくその徳の現れである。とりわけ人類は、二神の徳によって、自発的にその神徳を発揮する能力を持つため、ほかの生物より優れた地位を得て、いわゆる万物の霊長となることができる。そして人類の中でも、わが国民は、地理と歴史の関係から、この神徳を神ながらのあり方で、よく発揮してきた。私たちは、ますますこれを発展させ、国民すべてを神としなければならない。教育勅語で「皆、その徳を一つにすることを願う」と仰せになったのも、また、このような御心だと思われる。こうなれば、上も下も皆が神となり、神国・神道という名と実体がともに備わる。世界の人々は、何の威嚇も加えられず、赤子が慈母を慕うように、何の圧力も与えられず、青草が春風になびくように、わが陛下の大きな恩恵を慕って来る。そしてわが皇室の大いなる威光になびき、国威の伸張、国運の発展は、理想の境地に達するのである。"

  "translation_ja": "そもそも託宣は、当時、さまざまなことに利用された。もちろん、信じるべき託宣も少なくなかったのだろうが、信用できないものも多い。たとえば、行基が奈良に東大寺を建てるとき、日本にこのような大仏を建てることを神々はどうお考えになるだろうかと、聖武天皇もたいそう心配された。そこで天平十三年、行基は自ら勅使となって伊勢大神宮に参り、仏舎利一粒を捧げ、七日間参籠した。すると満願の日の夜、天照大神が扉を開き、行基に託宣を下された。その託宣はこういうものである。「実相真如の日輪は、生死の長い夜を照らし払い、本来変わることのない月輪は、煩悩の迷いの雲を払い破る。私は今、めったに出会えない大願に出会い、渡し場で船を得たようである。また、得がたい宝珠を受け取った。暗闇で炎を得たようである。師よ、その舎利を持って、飯高の郷に埋め納めなさい」。こう言われたという伝えだが、天照大神が行基を「師」と呼び、先生として仰がれるのもおかしいし、仏教の言葉で託宣を下されたというのも、たいへんおかしい。それから、いよいよ東大寺が建立され、大仏ができると、今度は宇佐八幡宮の八幡大神が、天平勝宝元年十一月、東大寺へ参拝したいと託宣を下された。そこで朝廷は、迎神使として特に参議の石川年足と侍従の藤原魚名を任命し、宇佐八幡大神を迎えた。天皇・太上天皇・太后も百官を率い、大神にお供をして行幸され、僧五千人を招き、仏を礼拝し、経を読ませるという大騒ぎになったことがある。これなども、ずいぶん妙な託宣だと思われる。考えてみれば、奈良は当時の東京、つまり首府である。そこに大仏ができたという大評判があるので、きっと宇佐八幡宮に仕える巫女や神職などが、一度この大仏に参拝し、奈良見物もしたいということで、何かうまい方法はないだろうかと相談した結果ではなかったかと思われる。そのほか、誰でも知っている弓削道鏡に対する託宣など、この種の託宣は非常に多い。それゆえ、弘仁三年九月の官符について、一条兼良卿は『樵談治要』に、次のように記している。「怪異のことを聖人は語らず、妖言の罪は法制上、軽いものではない。神の託宣は、明らかにそのしるしが現れたことでなければ、国司が言上してはならないと定められている。これは、巫女や神職などが行うことだからである」。これを見ても、当時、託宣がどれほど濫用されていたかが分かる。"

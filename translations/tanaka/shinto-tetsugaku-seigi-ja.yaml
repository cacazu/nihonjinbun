  "source_text": "次に天照大神が、三種の神器を瓊々杵命に御授けに成つたのについて、北畠親房卿は『神皇正統紀』に「三種の神器世に傳ふこと、日、月、星の天にあるに同じ。鏡は日の體なり。玉は月の精なり。劒は星の氣なり。ふかきならひあるべきにや云云。鏡は一物をたくはへず。私の心なくして萬象を照すに是非善惡のすがたあらはれずといふ事なし。其の姿に從ひて感應するを德とす。これ正直の本源なり。玉は柔和善順を德とす。慈悲の本源なり。劍は剛利決斷を德とす。智惠の本源なり。此の三徳を翁受けずしては、天下の治まらんこと、まことに難かるべし。」と云ひ、三種の神器を大いに尊重し、尙、「此の國は三種の正體をもつて眼目とし福田とす」と云つて三種の神器を、我が國民の行ふべき大道の根柢となして居る。之れに次いで一條兼良卿も三種の神器を大いに尊重し、その著、『日本書紀纂疏』に「三種の神器は神書の肝心、王法の樞機なり」と云ひ尙、「鏡の妍媸を照すは知の用なり、玉の溫潤を含むは則ち仁の德なり、劍のよく剛利なるは勇の義なり」と云ひ、以つて三種の神器は、知仁勇の根本義を示すものとし、而して、鏡は實に三器を代表する物として居る。其の說に、「三器の物たる優劣なしと雖、その出生の次第を原れば鏡は第二時にあり又眞坂木の中枝に懸くるは、神明中道を以つて宗とする故なり」と云ひ、鏡を擧げる時は劒璽も自ら其の中にあるものとして居る。斯ういふ風に中古の學者は、三種の神器に、正直慈悲、智惠とか、知仁勇とかいふ意味の有るものとして說いたものであるからして、德川時代になつても多くの學者が、種々の方面からさういふ風に說いて居る。例へば山鹿素行の如きは『中朝事實』に於いて盛に三種の神器の教訓を說いて、「玉は以つて溫仁の德を表はすべく、鏡は以つて致格の知を表はすべく、劍は以つて決斷の勇を表はすべきである。其の象るところ其の形はすところ、皆天神の至誠である。此の時未だ三德の名はなかつたがおのづから其の名の義は存し又その神器も備はつて居る。唯、神器の備はつて居るばかりでなく、この神器の成功があるのである。最も畏るべきの甚しきである。竊に考ふるに、三器は、天神の功器、三徳の全備である。聖主之れを用ひて、內は其の容心に鑒み外は其の治教を制するのは、乃ち神代の遺敕である」と述べて居る。神道の學者は殊に盛に斯ういふ說を主張して居る。例へば、度會延佳といふ人は其の著『陽復記』に「此の三種の神寶は、智仁勇の三徳をあらはしたると、古き傳へあるにぞ、孔子の道は我が國の神道にひとしき道と思はるゝ」と說いて居るし、吉川惟足も、『神代之卷惟足抄』に「事を言へば、三種の神寶、理を言へば天子の御心なり。三種の神寶は、收まりて胸中にあり。胸中は三種の神寶にあらはる。』といひ、三種は儒道の知仁勇に當るなりとし、更に進んで、「三種は鼎の三足の如し。寔に神道の肝心、王法の樞機、代々の御守として國土普き光なり。」と說いて居る。玉木葦齋も、『藻鹽草』に「三種の寳物は、固より傳國の御重、德の則、道の具にして神々相承け、皇々相傳へて。心術の要、修身の方より、蒼生を養ひ天下を馭め給ふ道を物に表して示し給ふ。神國の大本、神道の祕要。凡そ天地の理、人倫の道、この三種の外に出づる事なく、實に日月と倶に懸り、天壤と朽ちざる萬代不易の道の器にて在坐す。」と說いて居る。果して三種の神器が、此れ等の學者の云つて居るやうに、知仁勇の三達德の教などを含んで居るか如何かといふ事は、勿論問題である。知仁勇の教などは、天照大神の頃には、我が國には素より無かつたのであるから、こゝに持つて來るのは、附會の謗は到底免れまい。併し斯う考へるのも全然根據の無い事とは言へない。"

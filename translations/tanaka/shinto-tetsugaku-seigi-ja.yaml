  "source_text": "吾人が考へて見るに、第一是れは傳說と云ふことを一つ調べて見なければならぬ。神道に於いては傳說と云ふことを尊ぶのであるが、其の傳說と云ふのは一體どう云ふものであるか。本居宣長にしても平田篤胤にしても、盛んに古傳々々と云ふことを言はれる。古傳は大事である。けれども、併し古傳の意味を十分に調べて見なくてはならぬ。本居、平田二翁のやうな工合に神道を以つて神代に限られて居ると主張する學者から見ると、古傳が殊に大事である。けれども吾々のやうに、神道の神と云ふものは、決して神代の神に限られないのである。神代の神と同一の形式と內容とを以つて、それより以後に神があるのである。即ち神代に於ける例へば武甕槌神、經津主神は武神として尊い神である。尊い神であるけれども、矢張りそれと同じやうに、楠正成公乃木大將も武神として尊いのである。武甕槌神、經津主神が其の當時の朝廷に、獻身的に御働きになつたならば、楠正成公も乃木將軍も獻身的に御働きになつた。而して吾々は一方に香取鹿島に御宮を建てゝ此の神々を祭ると同時に、又楠正成公も湊川に御宮を建てゝ祀るのである。乃木將軍も亦東京にも地方にも御宮を建てゝ祀らるゝのである。神道の神と云ふものを斯う云ふ工合に擴張して見ると古代の傳說と云ふものが、本居平田二翁の言はるゝやうな工合に絕對的に重いものではない。さう云ふ工合に古傳說萬能、一にも古傳、二にも古傳と云ふやうな工合に、古傳のみを非常に尊重する譯には行かない。古傳說より後の傳說即ち國史其の者も、矢張り大事になつて來る。明治天皇が國史の成跡は炳として日星の如しと戊申詔書に仰せになつて居るが、其の國史の成跡と云ふ者が非常に重大になつて來る。國史は矢張り神道の一つの重大な權威、肝要な典據となる。古傳說と同じやうに尊重すべき者である。所謂古傳說、即ち『古事記』や『神代紀』に書いてある所のものは、私の考ふるのには、その大部分は、伊弉諾尊、伊弉冊尊、天照大神の御時代に出來たものであると思ふ。本居、平田二翁の說に依つて見ると、古傳は神々からの傳であつて、天御中主神、高皇產靈神、神皇產靈神から傳へられた所の傳である。斯う言はれるのである。而して平田篤胤は天御中主神を以つて、老子の謂ふ所の道と同じである。或は『易』の太極などと同じである。斯ういふ風に解釋して居られるのである。さうして始めもなければ終りもない神である。斯う解釋して居られる。さうすると老子の所謂道と云ふやうな、さう云ふ神樣が、吾々見たやうに人格を有つて、さうして古傳を傳へられたと云ふことになる。これは慥に問題であらうと思ふ、で、どうしても是れは古傳と云ふものは、詰り伊弉諾尊、伊弉册尊、天照大神頃に出來て、それより以前の事は伊弉諾尊、伊弉冊尊や天照大神の時代に御考へなさつて、斯う云ふ神々が御居でになつたのであると云ふことで、御傳へになつたものと解釋し奉るのである。さう解釋しませんと云ふと、どうも解釋が附かぬ。殊に純歷史家などは歷史的に天御中主神はどうだの、高皇產靈神はどうだのと云ふことを申すけれども、是れは歷史的に迚も考の附く筈のものではない。「人は天地の後に生れて天地の初を知る」と云ふけれども、是れは哲學的のことであつて、決して歷史的に知り得べきものでない。歷史の知り得るのは所謂有史以來と云はれて居る。勿論、化石や何かで有史以前のことも、多少研究せらるゝが、有史以後のことに比ぶれば僅かなことで、又嚴格な意味では之れは歷史とは云へない。で詰り我が國の古傳の太古に關する所のものは、伊弉諾尊、伊弉冊尊、天照大神の頃になつた所のものである。斯う見るのが宜しいやうである。"

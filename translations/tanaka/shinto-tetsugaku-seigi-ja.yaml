  "translation_ja": "では、天御中主神はどのような神なのか。すでに述べたように、篤胤は老子の道などと同じだといい、中世の学者には、国常立尊と同一視して、いわゆる実在そのものを指すと解釈する人も多い。しかし、まず篤胤と同じように、始まりも終わりもない神だとしなければ、説明がつかない。篤胤は、そのような神とするため、『古事記』の「天地が初めて開けたとき、高天原に現れた神の名は天御中主神、次に高皇産霊神、次に神皇産霊神。皆、独り神として現れ、身を隠した」という文を、自分の古伝研究の書『古史成文』では、「天地がまだ生まれていなかったとき、高天原に神がいた」と書き改めている。「天地が初めて開けたとき」を、『日本書紀』の別の伝えに基づき、「天地がまだ生まれていなかったとき」とし、「高天原に現れた神」を「高天原に神がいた」とするのである。「有神焉」、つまり、そこに神がいたという表現は、そのまま始まりも終わりもないことを意味する。しかし、「独り神として現れ、身を隠した」の部分には、手をつけなかった。そこが奇妙なのである。「独り神として現れ、身を隠した」と言う場合、「現れ」という語は、前の「現れた神の名は」と対応している。独りで現れ、そして身を隠したというのは、結局、亡くなり、肉体を離れた神霊として生きるようになった、と解釈すべきである。もちろん「身を隠した」の句は、「隠れた身でいらっしゃった」とも読めるが、いずれにしても問題がある。ともかく、「独り神として現れ」は「現れた神の名は」と対応するのだから、後者から「現れた」を削って「高天原に神がいた」とするなら、今度は前者の「現れ」も削らなくてはならない。そして、ただ「天地がまだ生まれていなかったとき、高天原に神がいた。天御中主神、次に高皇産霊神、次に神皇産霊神」と言い切っておかなくてはならない。"

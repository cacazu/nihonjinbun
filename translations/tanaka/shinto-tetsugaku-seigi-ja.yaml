  "translation_ja": "こうして、神道では、宗教的な性質を持つ儀式が行われる。このような儀式は、宗教的意識の表現である。したがって、国民によって、それぞれの特性を持つ。ギリシャ国民の儀式は、非常に快活で、喜びを楽しむものである。インドあたりの儀式は、はなはだ憂鬱で、静かに落ち着いたものである。これに対して、私たちは、わが国民の精神を、秩序と統一を重んじる思想、快活で現世を重んじる感情、発展し膨張する性格とした。このような特性は、おのずと、わが国の儀式にも現れる。そもそも神道の儀式には、祓と禊がある。祓について、賀茂真淵は、「祓とは、『古事記』で、伊弉諾尊が黄泉に行かれ、穢れたのを清めようと、筑紫の橘の小門で、身体に着けたものを、ことごとく脱ぎ捨てられたことをいう。穢れたものを払い除ける意味である」と解釈している。つまり、祓の起源は、伊弉諾尊が筑紫の阿波岐原で行われたことにある。これは、わが国民が秩序を尊び、物事がきちんと進むのを好む一例である。祓は、穢れたものを払い、遠ざけてしまう意味を持つ。また、直接、身体を洗い清めることを、禊という。禊は「身滌」、身体を清めることである。身体を清めることは、やがて精神を清め、その穢れを払うこととも考えられていた。清潔を好んで身体を洗い、また精神を洗う。これは、古代のわが国の、秩序を重んじる立派な精神の現れである。しかし中古には、それが極端になり、召使いなどが病気になると、道路に捨てることもあった。なぜかというと、死が穢れになるため、その穢れに触れないよう、病気のうちに捨ててしまうことがあり、弘仁四年六月一日には、太政官符によって、こうしたことが禁じられたという。これは、清潔を尊び、穢れを忌むことが極端に走ったのである。しかし、このような宗教的意識も、やはり国民的精神の現れを示す。"

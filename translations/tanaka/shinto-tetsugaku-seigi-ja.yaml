- "id": "st-0132-004"
  "section_id": "chapter-12-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "神道は、敬神崇祖の道である。皇祖皇宗の遺訓を遵守するの道である.天御中主神を崇敬するも亦、產靈神を崇敬するも、つまり我々の大祖世界の大祖としてゞある。宇宙の本體で、生々發展の元始の神としてヾある。要するに神道は敬神崇祖の道である。從つて我が國の教育、殊に初等教育に於いては、大いに敬神崇祖の觀念を徹底せしめなくてはならぬ。之れが爲に生徒を引率して神社に參拜せしむるも極めて必要である。かゝる敬神崇祖の教育に、彼れ此れ異論を唱ふるも、何等の價値のない議論である。"
  "source_languages":
  - "ja"
  "source_locations":

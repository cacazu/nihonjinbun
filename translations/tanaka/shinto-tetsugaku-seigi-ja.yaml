  "source_text": "そこで我々は我が國に於ける哲學の研究に從事しやうと思ふのである。か樣に我々が我が國の哲學と云ふと、一部の人士は論じて方今文運は極めて隆盛で、學術も極めて振興して來た。其の結果として哲學も亦盛に起つて來たけれども、我が日本固有の哲學とか、我が國の神道哲學などと云ふことは、甚だ可笑しなものである。日本には由來哲學と云ふものは存在しないのである。偶、哲學のやうなものが存在して居るとしても、是れは皆支那、印度より輸入して來たものであつて、日本固有のものではないのである。即ち日本の哲學と云ふものは、印度思想系、支那思想系に屬せるものであつて、日本固有の思想系と云ふものはないのである、と主張するのである。けれども能く考へて見ると云ふと、哲學と云ふものは、先きに述べた通り、元來人類が自然に受くる所の外界の刺戟と、其の知的欲求とに基いて起つて來たものである。人類は之れに依つて宇宙の眞理を發見し、之れに依つて其の精神の要求を滿足させやうとするのである。斯くて哲學は文明の根柢となり、開化の源泉となるものである。だから苟も古より國民的の發達を遂げ、國民的文化に進んで居る人類種族には、何等かの形式の、哲學の發達を見ないと云ふことはないのである。古來東洋に立國して、文化の夙に發達して居る我が帝國に、固有の哲學がないなどと云ふのは、餘りに考へのない話であらうと思はる。素より論理學や、認識論自然科學等の如きものゝ基礎の上に立てられたものでなければ、斷じて哲學でないと云ふならば、それは「日本に哲學は無い」と云ふても、宜しからうと思はれる。が併し此の立脚地から論じて行くと云ふと、西洋の哲學と云つても、古代や中世に於けるものは、殆んど其の哲學たるの價値を有さないのである。然るに僅に萬有の根本は水であると主張した所の、ターレスを以つて西洋の哲學の鼻祖とし、宇宙の本體は無極であると唱へた所の、アナクシマンドロスを其の宗とし、又それらの哲學に、論理學や認識論や、自然科學の這入つて居ると、否とを問はないのである。さうして見ると「古來日本に哲學はない」などと云ふのは、甚だしい撞着ではないか。試みに古來我が國民中に出た所の學者、思想家の學說に就いて、仔細に調べて見よ。西洋で所謂唯物論とか、唯心論とか、神祕論とか、唯理論とか、樂天主義とか、厭世主義とか云ふやうなものは、皆之れを指摘することが出來るではないか。吾々は假りに一步を讓つて斯かる我が國の哲學思想は、支那や印度の思想の影響を蒙つて成立したものとするも、而かも彼の希臘の哲學も、亦埃及やフェニキヤ、其の他西亞細亞地方の思想の影響を受けて居り、獨逸の近世の哲學も、英國や印度の思想の影響を受けて居ることが、尠くないではないか。だから我が國の哲學が、支那や印度の思想に負ふ所があつても、我が國の哲學たるに於いて、何等の係はる所はないのである。元來世界の原理は、東西の別なく、人世の眞理は彼我の差はない筈のものである。即ち之れを稱して普遍的であつて萬古一であると、云ふことが出來るのである。斯く眞理に國境なく原理に時代がないのであるけれども、而かも其の眞理が差別界に寫象せられ、其の原理が實際界に顯現せらるゝに至りては、或は風俗習慣の影響を蒙むり、或は土地氣候の勢力の爲に支配せられ、或は國民固有の性向の爲に制限せられ、東西彼我の間に、著しい差異を來し、學として現はれ來る場合に、一個の特色を帶びて來るのは、誠に自然の勢ひである。而して我が國民は、古來日本國民として一種の特色を有して居る、所謂日本固有の哲學即ち神道哲學を產み出して來たのである。此の日本固有の哲學の思想は、我が一般の國民の思想の基礎となり、我が一般の國民の精神の根柢と成り來るのである。西洋の哲學が整頓して居ると云つても、西洋の哲學が發達して居ると云つても、直にこれを輸入して、我が國民の要求を十分に滿足せしむることは出來ないのである。けれども、支那の哲學でも宜しい、印度の哲學でも宜しい、西洋の哲學でも素より不可はないのである。苟くも斯の思想の基礎の上に立てられ、斯の思想の根柢の上に組織せられたならば、初めて我が國家社會の要求を滿足せしむることが出來るのである。是れと云ふも其のものが、即ち日本の哲學であるからである。斯う云ふ筆法で昔から支那の哲學も這入つて來て日本の哲學となり、印度の哲學も這入つて來て日本の哲學となり、我が文明の進步に貢獻し、國運の發展に寄與して、今日に及んだのである。今や西洋の發達したる哲學が、澎湃として我が國に侵入して來て居るのである。吾々は須らく上下幾千年陶冶し來つた所の我が固有の思想の研究を行ひ、之れを基礎として此の西洋哲學を日本化し、之れを利用して、新たに一大哲學系統を組織すべきである。是れが抑々我が國民の一大任務である。徒らに彼れ等の餘瀝を歔り、彼れ等の糟粕を甞めて居ると云ふのは、吾々の取るべき所ではないのである。"

- "id": "st-0135-004"
  "section_id": "chapter-12-section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "右のやうな工合で、教育勅語は、皇祖皇宗の遺訓たる帝國憲法と同じく、神道である。神の道を示されたものである。かゝる教育勅語を新領土の民に說くには、幾多の不便を感ずると云ふものがある。殊に祖先の遺風とか、克く忠に克く孝にとか云ふ御言葉の解釋は困難であると云ふ者がある。けれども是れも吾輩が已に論じた樣に新領土の民も、我が民族の養子と看做し、否我が國民たらしめて、之れを同化せしめなくてはならぬ。決して之れを劣等な人種の如くして待遇すべきでない。苟くも我が帝國の臣民たる以上は、新附の民として夢にも侮蔑的區別を附してはならぬ。是れ即ち帝國古來の國是であつて、祖先の遺風である。從つてどこまでも新領土の民をして、皇祖皇宗の遺訓、即ち神の遺訓を體認せしめなくてはならぬ。かくて彼れ等に十分に教育勅語を拳々服膺せしめ、遂に理想を實現せしめなくてはならないのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 134
    "url": "https://dl.ndl.go.jp/pid/943657/1/135"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 135
    "url": "https://dl.ndl.go.jp/pid/943657/1/136"
  "translation_ja": "このように、教育勅語は、皇祖皇宗の遺訓である帝国憲法と同じく、神道であり、神の道を示されたものである。この教育勅語を新領土の民に説くには、多くの不便を感じるという者がある。とくに、「祖先の遺風」や「よく忠に、よく孝に」という言葉の解釈が難しいという者がある。しかし、これも、私がすでに論じたように、新領土の民を、わが民族の養子と見なし、いや、わが国民として、同化させなければならない。決して、劣った人種のように扱うべきではない。わが帝国の臣民である以上、新しく従った民だからといって、夢にも侮蔑的な区別を付けてはならない。これが、帝国の古来の国是であり、祖先の遺風である。したがって、どこまでも新領土の民に、皇祖皇宗の遺訓、つまり神の遺訓を体得させなければならない。そうして、十分に教育勅語を心にとどめ、守らせ、ついに理想を実現させなければならないのである。"
  "translation_status": "reviewed"
  "source_variants":

  "source_text": "斯う云ふ神の觀念の起つて來ると云ふものは先きに述べた通りに先天的と西洋で言ふやうな工合に、自ら吾々に起つて來る所のものである。それは吾々が斯うして日常大騷をして生活をして、精神が常に外物に向つて轉々として行つて居る時には、吾々は一向平氣で居るけれども、併し吾々が極く暗い晩などに於いて、學校その他の廣い建物などに往くと云ふと、何となく或る一種の存在物があつて、さうして神祕的に吾々に或る威力を加へるかのやうに感ずる。云ふ樣な感情が人間に在る。膽だめしなどもこんな事から行はれるのである。こんな感情は、實際多くの人の經驗して居る所である。即ち今迄の吾々の過去の經驗に就いて考へて見ると云ふと、斯うしてバタバタ日常の生活に追はれて居る時には何ともないけれども、病氣になつて一室に閉籠つて寢て居るとか、暗夜中に知らない途を辿つて居るとか云ふやうな、或る機會に於いて、吾々が眼に於いて見る事の出來ない、耳に於いて聽く事の出來ない、或る一大威力があつて、吾々に其の威力を加へて居るやうに感ずる事があるのである。之れを西洋では實在の感情と云つて居る。實際に在るものの存在を感ずるのである。家があると思つても、山があると思つても、河があると思つても、冥想の裡へ這入ると家も見えなければ、河も見えない。總べてのものが見えない。此處に立派な金銀財寶があると思つても、冥想して居る間に金銀財寳の存在を認めることは出來ない。けれどもさう云ふものでなしに、ちやんと必ず實在する或るものがあつて、それが威力を吾々に與へて居るのであると云ふ感情、さう云ふ感情が吾々に有る。"

  "source_text": "で均しく日本人と云つても、或は理性に偏して居る者もあるし、感情に偏して居る者もあるし、意志に偏して居る者もあるからして、此の日本固有の傳說の研究にも、或は武士道的とか、心學的とか、或は純粹なる歷史的とか、神話學的とか云ふ風な、いろいろの區別も起つて來るのである。けれども吾々は此の神道的研究、殊に惟神神道的研究が、最も吾々の知的要求、感情的要求、意志的要求に應じて居るものと認めて、神道的方面の研究を行ひ、さうして、神道哲學の、完全なる系統的組織の根柢としたいのである。"

- "id": "st-0065-005"
  "section_id": "chapter-05-section-03"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "中古には、一般に『日本書紀』が行はれたものであるから、『日本書紀』の卷頭に傳へらるゝ國常立神は、中古の學者の研究の第一の對象となり多くは之れを天御中主神と同一に見て實在そのものに解釋せんとしたのである。それで卜部兼直と云ふ人の作つたと云ふ『神道大意』と云ふ本では、「國常立尊は無形の形、無名の名、之れを虛無大元尊と名く」と云ふ風に云つて、此の虛無、大元より一大千界が成り、森々羅列、草木瓦石、禽獸魚鼈、悉く出來てきたのである。斯う云ふ工合に解釋して居る。で、之れを吉川惟足と云ふ神道家が解釋して、「國とは世界の本體である。常とは萬古不易の稱である。立とは不易の理を立てゝ萬物を建立する仕方である。尊とは尊み重んずるの心である。例へば御事と云ふやうな譯である。此の國常立尊と申すのは、普通の神ではない。天地に先立つて、天地を定め、陰陽に起つて陰陽になる、全體を假りに名けて神と申したのである。其の神の御名を表はさば國常立尊と申すのである」。斯う云ふ風に說明して居るのである。詰り此の說明は儒教や佛教等に依つて出來たものである。そして之れを天御中主神と同一に見やうとするのであるのであるが、併し私は此の神は要するに此の國土の主神に在して、此の國土を維持し發展せらるゝ所の元靈に對してかゝる御名を申上げたものと認めねばならぬと主張するのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 64
    "url": "https://dl.ndl.go.jp/pid/943657/1/65"
  "translation_ja": "中古には、一般に『日本書紀』が広く読まれていたので、その巻頭に伝えられる国常立神は、中古の学者が研究する第一の対象となった。多くの学者は、これを天御中主神と同じものと見て、実在そのものだと解釈しようとした。それで、卜部兼直という人が作ったという『神道大意』では、「国常立尊は、形のない形、名のない名であり、これを虚無大元尊と名付ける」と言い、この虚無大元から一大千界が成り、草木や瓦石、鳥獣や魚や亀まで、あらゆるものが、ことごとくできてきたと解釈している。これを神道家の吉川惟足は、次のように解釈する。「国とは世界の本体である。常とは、万古に変わらないものの呼び名である。立とは、不変の理を立てて、万物を成り立たせるあり方である。尊とは、尊び重んじる心をいう。たとえば『御事』というような意味である。この国常立尊は、普通の神ではない。天地に先立って天地を定め、陰陽に起こって陰陽となる、その全体を仮に名付けて神と申し上げたのである。その神の名を表すなら、国常立尊と申し上げるのである」。こう説明している。結局、この説明は、儒教や仏教などによってできたものである。そして、これを天御中主神と同じものと見ようとするのだが、私は、この神は要するに、この国土の主神であり、国土を維持し発展させる元霊に、この名を申し上げたものと認めなければならない、と主張するのである。"
  "translation_status": "reviewed"

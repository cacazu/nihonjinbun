  "section_id": "chapter-01-section-01"
  "kind": "heading"
  "origin": "source"
  "source_text": "第一節神道哲學研究の必要"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 11
    "url": "https://dl.ndl.go.jp/pid/943657/1/12"
  "translation_ja": "第一節　神道哲学研究の必要"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "第一節神道哲學〓究の必要"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0012-003"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "人生には色々と矛盾するやうな事があり、撞着するやうな事がある。例へば科學と宗教と云ふ風なものや、經濟と美術と云ふ風なものは、種々の點で矛盾し、種々の場合に撞着して居る。その他自由と强制と云ふやうなことや、保守と進步と云ふやうな矛盾撞着は一々枚擧するに遑ない程である。けれども我々は此の間に處して、その調和を求め、その統一を得て、人生そのものを解決し、所謂人生觀を立て、進んで世界觀をも定めんとするのである。之れが人生一般の傾向で、古往今來常に見らるゝ所の現象である。かかる方面の研究を行ひ、以つて人生觀·世界觀を立するのを哲學的研究と云ひ、その成果を哲學と云ふのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 11
    "url": "https://dl.ndl.go.jp/pid/943657/1/12"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 12
    "url": "https://dl.ndl.go.jp/pid/943657/1/13"
  "translation_ja": "人生には、さまざまな矛盾や衝突がある。たとえば科学と宗教、経済と美術のようなものは、いろいろな点で矛盾し、いろいろな場合に衝突している。そのほか、自由と強制、保守と進歩など、矛盾や衝突は一つ一つ挙げきれないほどある。しかし私たちは、その間にあって調和と統一を求め、人生そのものの問題を解決し、いわゆる人生観を立て、さらに世界観をも定めようとする。これは昔も今も変わらず見られる、人生一般の傾向である。こうした方面を研究して人生観・世界観を立てることを哲学的研究といい、その成果を哲学という。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "人生には色々と矛盾するやうな事があり、撞着するやうな事がある。例へば科學と宗〓と云ふ風なものや、經濟と美術と云ふ風なものは、種々の點で矛盾し、種々の場合に撞着して居る。その他自由と强制と云ふやうなことや、保守と進步と云ふやうな矛盾撞着は一々枚擧するに遑ない程である。けれども我々は此の間に處して、その調和を求め、その統一を得て、人生そのものを解決し、所謂人生觀を立て、進んで世界觀をも定めんとするのである。之れが人生一般の傾向で、古往今來常に見らるゝ所の現象である。かかる方面の研究を行ひ、以つて人生觀·世界觀を立するのを哲學的研究と云ひ、その成果を哲學と云ふのである。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0013-001"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "ゼームスは、人は生れながらに哲學者である。之れを哲學として意識して居るか否かは別問題であるが、何人でも何等かの哲學を有し、それによつてその行動を律し以つて世に處して行かないものはないと云つて居る。眞にその通りで、我々の日々の行動は、一から十まで盡く我々の體有して居る哲學觀によつて支配せられて居るのである。從つて其の時代に勢力ある哲學說は、自ら時代思潮を左右し、その國家社會に大影響を及ぼすのである。彼の啓蒙學派の哲學は、佛國の思想界に深刻な影響を與へ、遂にかの慘憺たる大革命を醞釀したのである。又、フィヒテとかへーゲルとか云ふ學者の哲學が、近代獨逸の國家觀念に影響し、歐洲近代史の一偉觀である獨逸帝國の勃興に與つて大いなる力を有したのは爭はれない。更に最近に於いて、露西亞帝國や獨逸帝國が、相尋いで土崩瓦解したのも、マルクスその他の唯物哲學の深甚なる影響の爲だと見ても、大した差支はあるまいと思はれる。退いて之れを我が國に見ても我が國家の空古の大改革であつた維新の宏大な事業の完成にも、江戶時代の中期頃から急速に開展して來た、神道哲學の、著しい影響のあつた事は、少しく國史の眞相に觸れたものゝ、何人も首肯する所である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 12
    "url": "https://dl.ndl.go.jp/pid/943657/1/13"
  "translation_ja": "ジェームズは、人は生まれながらに哲学者であると言っている。それを哲学として意識しているかどうかは別として、誰もが何らかの哲学を持ち、それによって行動を律し、世の中で暮らしているというのだ。まったくそのとおりで、私たちの日々の行動は、一から十まで、身につけている哲学上の考えに支配されている。したがって、その時代に力を持つ哲学説は、おのずと時代の思想の流れを左右し、国家や社会に大きな影響を及ぼす。啓蒙学派の哲学はフランスの思想界に深い影響を与え、ついに、あの惨憺たる大革命を生み出すに至った。また、フィヒテやヘーゲルらの哲学が近代ドイツの国家観に影響し、ヨーロッパ近代史の一大景観をなすドイツ帝国の興隆に、大きな力となったことは否定できない。さらに最近、ロシア帝国とドイツ帝国が相次いで崩壊したのも、マルクスらの唯物論哲学による深い影響のためと見て、さほど差し支えないと思われる。ひるがえってわが国を見ても、国家にとって前例のない大改革だった維新の大事業が完成するに当たって、江戸時代の中ごろから急速に発展してきた神道哲学の著しい影響があったことは、日本の歴史の実情に少しでも触れた者なら、誰もが認めるところである。"
  "translation_status": "reviewed"
- "id": "st-0013-002"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "今や時代思潮の動搖は、世界的の事實である。而して近時メツキリ地位を高めて、世界の檜舞臺に乘り出した我が帝國は、政治、經濟等の方面から、風俗、習慣などに至るまて、世界の影響を免れることはどうしても出來ないやうになつて來た。從つて我が國の思想界も亦歐米の時代思潮動搖の弊を受け、國家社會に對する我が國民の信念動もすれば混亂の狀態に陷らんとするのである。されば我々は此の際大いに神道哲學の研究を行ひ、思想の根本を培養し、國民をして種々擡頭して來る所謂新しき思想に對して、誤る所がない樣にするは、現下緊切の急務と信ずるのである。然るに世人はどうかすると神道と云ふ名を聞いた丈けでやれ頑迷だやれ偏狹な愛國心の鼓吹だなどゝ云ふのである。けれどかゝるは自己の淺薄な皮相的批判者であることを表白するに過ぎないのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 12
    "url": "https://dl.ndl.go.jp/pid/943657/1/13"
  "translation_ja": "今、時代の思想が揺れ動いているのは、世界共通の事実である。近ごろ著しく地位を高め、世界の表舞台に乗り出したわが帝国は、政治・経済から風俗・習慣に至るまで、どうしても世界の影響を免れられなくなってきた。それゆえ、わが国の思想界も欧米の思想の動揺に伴う弊害を受け、国家や社会に対する国民の信念は、ともすれば混乱に陥りかねない。そこで私は、この機会に神道哲学を大いに研究して思想の根を育て、次々に台頭する、いわゆる新思想に国民が向き合う際、判断を誤らないようにすることが、今の切実な急務であると信じる。しかし世間の人は、ともすれば神道という名を聞いただけで、やれ頑迷だ、やれ偏狭な愛国心をあおるものだと言う。だが、それは自分が浅薄で表面的な批評をする者だと告白しているにすぎない。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "今や時代思潮の動搖は、世界的の事實である。而して近時メツキリ地位を高めて、世界の檜舞臺に乘り出した我が帝國は、政治、經濟等の方面から、風俗、習慣などに至るまて、世界の影響を免れることはどうしても出來ないやうになつて來な從つて我が國の思想界も亦歐米の時代思潮動搖の弊を受け、國家社會に對する我が國民の信念動もすれば混亂の狀態に陷らんとするのである。されば我々は此の際大いに神道哲學の〓究を行ひ、思想の根本を培養し、國民をして種々擡頭して來る所謂新しき思想に對して、誤る所がない樣にするは、現下緊切の急務と信ずるのである。然るに世人はどうかすると神道と云ふ名を聞いた丈けでやれ頑迷だやれ偏狹な愛國心の鼓吹だなどゝ云ふのである。けれどかゝるは自己の淺薄な皮相的批判者であることを表白するに過ぎないのである。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0014-001"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "勿論多數の神道家の中には、前世紀の頭腦を以つで偏狹な議論を試むるものがないとも限られない。が、しかし、神道家と雖も、明治·大正の教育を受けたものである。東洋の新興文明國の環境に生活するものである。例外はいさ知らず。その全般の頭腦が頑迷偏狹たるべき理由が何れにあるか。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 13
    "url": "https://dl.ndl.go.jp/pid/943657/1/14"
  "translation_ja": "もちろん、多くの神道家の中には、一世紀前のような頭で偏狭な議論をする人がいないとも限らない。しかし神道家といっても、明治・大正の教育を受けた人々である。東洋の新しい文明国という環境に生きる人々である。例外はともかく、その全体が頑迷で偏狭であるはずだという理由が、いったいどこにあるだろうか。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "勿論多數の神道家の中には、前世紀の頭腦を以つで偏狹な議論を試むるものがないとも限られない。が、しかし、神道家と雖も、明治·大正の〓育を受けたものである。東洋の新興文明國の環境に生活するものである。例外はいさ知らず。その全般の頭腦が頑迷偏狹たるべき理由が何れにあるか。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0014-002"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "或は云はん。神道そのものが古代のもので、現代とはかけ離れたものである。それを現代に鼓吹するのは時代錯誤である。西洋哲學の滔々天下に行はるゝ今日、陳腐な神道說又開くに堪へないと。かゝる淺薄な議論をするものがあればこそ我々は益々神道の哲學的研究を行ひ、彼れ等を自覺せしむるの必要を認むるのである。今日彼れ等の謳歌する西洋哲學でも、果して皆斬新なものであるか。二千年前のプラトーンやアリストテレースの學說が屢々反復せらるゝのはどうしたものか。之れに對して我が神道の極めて進步的であるのを知らないのではないか。元來神道と云ふのは、讀んで字の如く、神の道てある。神は古代に勿論出でられて居るが、同樣に現代にも出てられ、將來も亦出でらるべき所のものである。從つてその道は日に新で、又日日に新なる性質を有するのである。即ち創造に次ぐに創造を以つてし、不斷の創造の行はるゝ所の道てある。神道は陳腐ならんと欲するも、得べからざるの道である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 13
    "url": "https://dl.ndl.go.jp/pid/943657/1/14"
  "translation_ja": "あるいは、こう言う人もいるだろう。「神道そのものが古代のもので、現代とはかけ離れている。それを現代に広めようとするのは時代錯誤だ。西洋哲学が天下に広く行き渡る今日、陳腐な神道説など聞くに堪えない」と。このような浅薄な議論をする人がいるからこそ、私たちは、いっそう神道の哲学的研究を行い、彼ら自身に気づかせる必要を認めるのである。今日、彼らがほめたたえる西洋哲学も、果たしてどれも斬新なのだろうか。二千年前のプラトンやアリストテレスの学説が、たびたび繰り返されるのはどうしたことか。それに対して、わが神道がきわめて進歩的であることを知らないのではないか。もともと神道とは、文字どおり神の道である。神は、もちろん古代にも現れたが、同じように現代にも現れ、将来にもまた現れるものである。したがって、その道は日ごとに新しく、日々新しくなる性質を持つ。つまり、創造の後に創造が続き、絶えず創造が行われる道である。神道は、陳腐になろうとしても、なれない道なのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "或は云はん。神道そのものが古代のもので、現代とはかけ離れたものである。それを現代に鼓吹するのは時代錯誤である。西洋哲學の滔々天下に行はるゝ今日、陳腐な神道說又開くに堪へないと。かゝる淺薄な議論をするものがあればこそ我々は益〓神道の哲學的研究を行ひ、彼れ等を自覺せしむるの必要を認むるのである。今日彼れ等の謳歌する西洋哲學でも、果して皆斬新なものであるか。二千年前のプラトーンやアリストテレースの學說が屢〓反復せらるゝのはどうしたものか。之れに對して我が神道の極めて進步的であるのを知らないのではないか。元來神道と云ふのは、讀んで字の如く、神の道てある。神は古代に勿論出でられて居るが、同樣に現代にも出てられ、將來も亦出でらるべき所のものである。從つてその道は日に新で、又日日に新なる性質を有するのである。即ち創造に次ぐに創造を以つてし、不斷の創造の行はるゝ所の道てある。神道は陳腐ならんと欲するも、得べからざるの道である。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0014-003"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "神道の門外者は又或は非難して曰はく、歐米の學說は極めて幽玄深遠であるが、神道のそれは皮相淺薄である。皮相淺薄の學說は、以つて現代を指導するに足らないと。勿論佶屈贅牙な文字を臚列したのを見て、驚いて幽玄深遠な學說と云ふならば、神道は幽玄でもなければ、深遠でもない。けれどもかゝる意味の幽玄とか深遠とか云ふのは、一の遊戯と見て差支へない。遊戯は遊戯で、眞理とは沒交渉である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 13
    "url": "https://dl.ndl.go.jp/pid/943657/1/14"
  "translation_ja": "神道の外にいる人は、またこう非難することがある。「欧米の学説はきわめて奥深いが、神道の学説は表面的で浅い。浅薄な学説では現代を導くことはできない」と。もちろん、難解な文字を並べ立てたものを見て驚き、それを奥深い学説と言うのであれば、神道は奥深くも深遠でもない。しかし、そのような意味での奥深さや深遠さは、一種の言葉遊びと見て差し支えない。言葉遊びは言葉遊びであり、真理とは関係がない。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "神道の門外者は又或は非難して曰はく、歐米の學說は極めて幽玄深遠であるが、神道のそれは皮相淺薄である。皮相淺薄の學說は、以つて現代を指導するに足らないと。勿論信屈贅牙な文字を臚列したのを見て、驚いて幽玄深遠な學說と云ふならば、神道は幽玄でもなければ、深遠でもない。けれどもかゝる意味の幽玄とか深遠とか云ふのは、一の遊〓と見て差支へない。遊〓は遊〓で、眞理とは沒交渉である。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
  - "kind": "ocr"
    "text": "神道の門外者は又或は非難して曰はく、歐米の學說は極めて幽玄深遠であるが、神道のそれは皮相淺薄である。皮相淺薄の學說は、以つて現代を指導するに足らないと。勿論信屈贅牙な文字を臚列したのを見て、驚いて幽玄深遠な學說と云ふならば、神道は幽玄でもなければ、深遠でもない。けれどもかゝる意味の幽玄とか深遠とか云ふのは、一の遊戯と見て差支へない。遊戯は遊戯で、眞理とは沒交渉である。"

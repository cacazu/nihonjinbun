  "source_text": "高天原については、此の外に或は印度だとか、南洋だとか、朝鮮だとか種々の說があるが、併し著者の見る所では、勿論古傳が高天原と天とを同義につかつて居ることは事實である。唯、その天の說である。すべて言葉と云ふものは、空間的には、同じ事物でも、國々にて言ひ方が違ふのである。又時間的には、同じ名辭でも、時代によつて內容が異るものである。從つて現代の意味を以つて、古代の言葉を解すると往々に失敗するのである。そこで天について、著者は先づ第一に天御中主神の處では之れを宇宙と解すべきものであるとしたのである。茲に天之常立尊と國之常立尊と並立さるゝ場合には、天は、此の國土、今日で云ふ地球以外の世界を云つたものである。而して此の以後に頻出する所の天又は高天原は、神々の常にまします處を云ふのであると解釋するのである。從つて德川時代の學者が、我々の胸中を高天原であると解したのも、不都合はない。我々が、產靈神より禀受せる神靈の宿る所と見るからである。要するに全般を通じて、天又は高天原は神明の神留りまします處と解釋すべきであらうと思はれる。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 63
    "url": "https://dl.ndl.go.jp/pid/943657/1/64"
  "translation_ja": "高天原については、このほか、インドだとか南洋だとか朝鮮だとか、さまざまな説がある。しかし、著者の見るところでは、もちろん古伝が高天原と天を同じ意味に使っていることは事実である。問題は、その天の意味である。言葉というものは、場所からいえば、同じ物事でも国ごとに言い方が違う。また、時代からいえば、同じ言葉でも、時代によって内容が異なる。したがって、現代の意味で古代の言葉を解釈すると、しばしば失敗する。そこで著者は、天について、まず天御中主神のところでは、宇宙と解釈すべきだとした。ここで天之常立尊と国之常立尊が並び立つ場合の天は、この国土、今日いう地球以外の世界を指したのである。そして、これ以後、しばしば出てくる天や高天原は、神々が常におられるところをいう、と解釈する。したがって、徳川時代の学者が、私たちの胸の中を高天原と解釈したのも、差し支えない。私たちが産霊神から授かった神霊の宿るところと見るからである。要するに、全体を通じて、天または高天原は、神明が鎮まっておられるところと解釈すべきだと思われる。"

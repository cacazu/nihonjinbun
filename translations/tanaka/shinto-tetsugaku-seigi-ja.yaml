  "source_text": "が、それが明治天皇の時に至つて、初めて憲法と云ふものを御發布になつた。其の憲法と云ふものに基いて、又色々の法律と云ふものも出來て來るやうになつた。が併し此の憲法と云ふものを一種の法律であると見て、法律のやうにして考へて居る者は、世間多く見る所であるが、併し此の憲法は其の實を言つて見ると、神道の最も大いなる一つの典籍である。若し神道にバイブルがあるとしたならば、若し神道に經典があるとしたならば憲法は最も重なるバイブルである、最も主なる經典である。何故かと云ふと、憲法御發布の際に方つて、明治天皇は皇祖皇宗に對して御告文を御述べになつた。其の御告文にどう書いてあるかと云ふと、"

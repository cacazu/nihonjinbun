  "source_text": "で、世間の學者は動もすれば、神道は皇祖の御勅命のまに〳〵天下を治す所の道である。であるから道を行ふことは君とあるべき人の務であつて、もの學ぶ者の業ではないと云ふことを主張する者がある。是れは本居宣長等の主張であるが斯う云ふ考は神道と云ふものを狹き意味の上に解して上にある者が下に臨まれる所の種々樣々の仕方が即ち神の道であると解釋したものと思はれる。さう云ふ風な見方をして、神道を以つて政治の道であると云ふ風に見る人がある。けれども又或る人は、神道は立派な宗教である。偉大なる宗教である、有ゆる宗教を統一する所の大宗教であると云ふ風に主張する人もあるのである。けれども又或る人に依ると、神道が宗教などと云ふのは飛んでもないことである。神道は詰り我が國の國民道德であつて、一種の道徳に過ぎないのである。道徳と云ふものは元來人と人との關係を律する所のものである。神道に於ける所の神と云ふのは、詰り人なのである。決して基督教などに云ふ所の神などとは、意味が違つて居る。であるから神道で神社に行つて神を拜んだからと言つて、之れを以つて神道を宗教などと云ふのは大變な誤解であると云ふ風に說いて、さうして神道を宗教であると云ふ事に甚く反對する人がある。斯う云ふやうな考は何れも皆一方面の理は含んで居る。けれどもそれがすつかり十分でさうして完全であると云ふ譯には行かない。熟ら考へて見ると云ふと、上古神聖の有せられて居つた所の偉大なる國民的精神の秩序的、統一的思想と云ふものが現はれては、茲に宇宙無比の國家と云ふものが出來て、さうして政治の大道と云ふものが發達して來たのであ る。又其の神聖の有せられて居つた所の現世的、快活的感情と云ふものが顯現されて來ると、茲に生々主義、現世主義の偉大なる宗教-今日の歷史的宗教を超越した偉大なる宗教と云ふものが出來て來るのである。又其の發展的、膨脹的性格が顯現せられて來ると云ふと、茲に剛健質實なる所の道德と云ふものが成立つて來るのである。で、彼の神器の我が國に嚴として存在して居ると云ふのは、詰り此の政治、宗教、道德の各方面を示されたものと見て差支ないのである。此の政治、宗教、道德と云ふものは人間社會の有ゆる活動を包括網羅して居る所のものである。我々の活動は千差萬別であるけれども、詳かに觀察して見ると云ふと、政治的の系統に屬して居るか、或は宗教的系統に屬して居るか、さもなくば道徳的系統に屬して居るのである。勿論其の外に法律と云ふものもある。經濟と云ふものもあるけれども、さう云ふやうなものは矢張り政治的の中に包含することが出來る。其の他色々の生業を營んで一家を治めて行く、家族を養つて行くと云ふやうなことも矢張り政治的の中に包含することが出來る。一家の政治である。家政である。が併し又他の方面から見ると、それが宗教にも、道德にも、關係して居る。さう云ふやうな譯であるからして、詰り政治、宗教、道德と云ふものは、人世百般の活動を包含することが出來る。唯、之れにもう一つ教育的の系統を含ましめれば、含ましめることが出來る。卽ち其の政治、宗教、道德さう云ふ百般の活動をするやうに我々の後繼民族を養つて行く所の活動、それを一つ區別すれば或は此の以外に區別することも出來る。けれども是れはむしろ此の三大系統そのものゝ維持發展の一大方法と見るがよいのである。之れなくしては三大系統は存在を失ふのであるから.で之れをやはり三大系統その者と見て置く。要するに斯う云ふ三大系統を包含して居るのである。であるからして其の神道は實に廣大である。實に無限である。苟も國民の云爲行動の規範となり、根柢となる所のものは皆此の神道の中に包含されて居るのである。それで尙此の神道の內容を十分に明かにせんが爲には、此の三大系統に就いて一々述べて行く必要があるのである。"

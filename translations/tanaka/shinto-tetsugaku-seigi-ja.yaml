  "translation_ja": "託宣とはそういうものだから、本居・平田の両翁が、このような託宣だけを証拠として、高皇産霊神・神皇産霊神が天地万物を造ったと主張されても、その証拠はあまりに弱いと思う。そういうわけで、私たちは、両翁のようにこの二神が天地万物を造ったと考えず、その神徳が現れたものが世界の万物であると、森羅万象を解釈するのである。もともと古伝では、天御中主神・高皇産霊神・神皇産霊神が存在したということが主な点で、この三神には何の事業も伝わっていない。もちろん、その高皇産霊神を、天照大神の時代の高皇産霊神と同じ神だとすれば、その神には多くの事業が伝わっている。しかし、私たちの目からすれば、古伝の解釈上、どうしても別の神としなければならない。別の神とする以上、古伝には何の事業も伝わっていないのである。伝わっていない以上、高皇産霊神・神皇産霊神が天地を造り、万物を生んだという解釈は、本居・平田両翁の一家の説なのである。それと同じように、私たちもまた、自分たちのように解釈することができる。ただ、どちらが最もよく神道の本旨を明らかにするかが問題である。神道の本旨にかなっていれば、その説は採用すべき学説だと思う。"

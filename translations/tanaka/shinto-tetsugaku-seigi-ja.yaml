  "section_id": "chapter-06-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "七代神の第二は豐雲野神である。前にもちよつと述べて置いたが『日本書紀」に依ると云ふと此の國常立神と豐雲野神との間に國狹槌神と云ふのがある。所が篤胤は、『古事記』に「大山津見神と野槌神とが山野に因つて持ち別けて生みませる神の御名は天之狭土神、次に國之狹土神」と云ふことが傳へてある。それで『日本書紀』に傳へて居る國狹槌尊と『古事紀』に傳へてある國之狹土神とか同一神である。斯う云ふ說を主張して居る。兎に角此の國狹槌尊と云ふのには、古傳にどうしても誤謬があるやうである。著者は此の篤胤の說に依らないで、寧ろ是れは國常立尊の一の御名であるとするのである。一體古代の神々には「又の御名は何々」と言つて、一つの神の御名が幾つもあるのが澤山ある。さう云ふ風に著者は考へて居つたので、篤胤の說に賛成しなかつたのである。處が後年鈴木重胤の說を見ると云ふと、矢張りさう云ふ風になつて居るのである。で、是れは矢張り著者の考の方が益、良いやうに思つた。要するに國常立神は國之常立尊とも申し、國狹槌尊とも申し國狹立尊とも申すものと思はれる。『舊事紀』『神代系紀』に依ると、「國常立尊は亦は國狹立尊と申し亦は國狹槌尊と申す」と云ふことが書いてある。『舊事紀』は必らずしも正確なる古典と云ふ譯には行かないが、併し斯う云ふ本に斯う云ふことを書いてある所を見ると、矢張りこんなやうな古傳も昔に在つたやうに思はれる。どうもさう解釋した方が正しいやうに思はれるのである。それで此の豊雲野神の時に至つては、段々此の國土が發達して來たものと見える。此の豐雲野神に對する宣長の解釋を見ると云ふと久毛は久牟久美久比許理などと通つて物の集まり凝る意でさうして物の始り萠す意を兼ねて居る。此の二つの意又自から通へりとして居る。詰り豐雲野神は物の凝り集まるのと、萠すのと、二つの意を兼ねて居るのである。さうして見ると豊雲野と云ふのには甚だ面白い意味がある。クモと云ふのは今申した星雲的のものが凝り集まる-凝固して來る。さうしてそこへ持つて行つて萠す意がある。出來始まる意味を持つて居る。であるからクモとは星雲的のやうな物が群り集つて、さうして國土ととなるべき初め萠しなる由を以つて言ふたので野と云ふのは其の物を指して言ふのである。詰り國土が段々と凝固して固つて來て、さうして此の物がこう云ふ風な工合に御出來になつた所のその時代の元靈を、豊雲野神と斯う申上げたのである。宣長の解釋によつて、かう云ふ說が成立つて來るのである。此の點に於いて正にかうであらうと思はれる。"

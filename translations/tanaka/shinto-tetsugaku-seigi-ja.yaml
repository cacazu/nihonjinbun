  "translation_ja": "要するに、私たちは三種の神器から、次のように示されていると解釈できる。知を磨いても、表面的な知にとどまらず、さらに真の知を磨くために神鏡を理想とする。温かく穏やかな情操を養うために、神璽を理想とする。入り組んだ難題に出会っても、少しも立ち止まらないために、神剣を理想とする。そして、あわただしいときも、つまずき倒れるときも、ひたすら修養に努め、自分の人格を高め、天地とともにきわまりない国運の発展という、わが国民の大理想を実現することに従事すべきなのである。"

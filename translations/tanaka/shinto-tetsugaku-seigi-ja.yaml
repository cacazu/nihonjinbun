    "text": "で、斯う云ふ神の言葉の解釋を引括めて見ると、神に對し、略、三種の見方があると云ふことが、了解せられるのである。即ち政治的見解を下して見ると、益軒や貞丈の樣に、上の字を以つて解釋するのである。上に在ます人であると云ふ風に說いて來るのである。又宗〓的見解を下して見ると、どうしても平田流の靈妙なるものと云ふ風の意味になる。又道德的見解を下して見ると、忌部正通一派のやうに、神は鏡の如く萬物を照されるもので、吾々の心の善い事惡い事直に皆神に映るのである。神はさう云ふ風に照臨在すのであるから、吾々は常に善い事をして惡い事をしてはならぬ。斯う云ふ解釋が附いて來るけれども、神道はさう云ふ工合に、政治的とか、宗〓的とか、道德的とか云ふ風な、一方面に限られた道でないのである。であるから斯う云ふ風に、一方面を主として神の言葉を解釋しやうと云ふ事は非常に困難な事になつて來る。近來は蒙古語などを〓究して、カミの語原を之れに求めんとする人もあるのである。けれども神と云ふ觀念、は西洋の學者などが、人間に先天的に有るものだ、詰り生れ付に斯う云ふ觀念があるものだと云ふやうな工合に、世界何處に住つても、どんな人種について見ても、其の觀念の存在を認めることが出來るのである。勿論非常に發達して居るのと、極めて幼稚なものとの別はあるけれども、どんな人種についても、何か或る種の神と云ふ樣な觀念を有つて居ない人種は、先づ無いと言つて宜からうと思はれる。さう云ふ工合に神と云ふ言葉は、一般の人種が有つて居るのであつて、さうして又生れ付とも言はれる位に古い言葉である。であるから、今日から國語の〓究家が色々の方面から〓究しても、中々神と云ふ言葉について正しい解釋を得る事は困難であらうと思はれる。從つて到底感服の出來るやうな解釋は難かしいかと思はれる。唯、神は上であると云ふ說は、取るべきであるやうに思はれる。此の神と上とが同一であると云ふ解釋は、語源の〓究と云ふ譯ではない。語源と云ふと、それはカミと云ふ言葉は、どう云ふ根本から出たのかと云ふ風に、遡つて行かなければならぬ。けれども先づ神と云ふ言葉は、上と同じである、斯う云ふ說が最も穩當であらうと思はれる。隨つて此の上と云ふ解釋は、上に在ます所のものを以つて、神と云ふのである。で今日でも朝廷のことをオカミと云ふし又長官の事をカミと云ふ。昔でも伊豫守、武藏守と云ふやうな事も言つて居る。頭、長、守と云ふ字は、皆同一の意味で、唯〓漢字を當嵌めたから、色々の字を書くやうなもので、加美と云ふ事に付いては、同一であらうと思ふ。所が或は斯う云ふ說に反對する者もあつて、此の神と上とは音に上下がある、所謂アクセントが違ふ。だからして同一ではないと云ふのである、成程日本語には、垣と柿と牡蠣、皆カキと言ふけれども、それはアクセントが違つて居る。私はカキを喰べました」と言へば、柿を喰べたと思ふ者はない。又私は「カキを喰べました」と言へば、牡蠣だと思ふ者はない。人の能く言ふ橋、端、著皆同じハシだけれども音に上下がある。それに依つて意味が違つて來る。で、此の神と上との差は、猶、鎌と釜との差の樣な違があると云ふのである。成程鎌と釜とは違ふ。神と紙とも違ふ。けれども神と上とは區別は無いやうに思はれる。そこで私は先づ我が國の神の意義は、此の上から來て居るのであると解釋して、さうして前にあつた所の忌部正通流の說や、平田篤胤流の說は、矢張此の意味の中に含めて上に在ます所の者は自ら靈妙なる德を有して居られる。さうして又自ら部下を照臨なさる。斯う解釋したら宜からうと思ふ。今日の事實に就いて見ても、どうしても今の長官とか云ふ者は、其の部下の者よりか偉い。勿論、長官にも凡人があることもあるが、それは例外で、一般には長官になつて來ると云ふと、學問の素養も澤山あらうし、又其の德も高い。隨つて部下の者が、此の位の事はしても、長官は知りはすまいと思つて、胡麻化さうと思つても、長官は能くそれを見拔く。是れは即ち照臨するのである。で、部下の者から見ると云ふと、まるで神樣のやうに見える。すべて勝れた人に比較すると智惠が足りないと斯うも違ふものか知らんと思ふ樣に、愚かな者は同じ事をしても、廻り遠くて、非常な時間と、勞力と、そして經費とをかけてする。所が悧口な者は直ぐそれをやる。數學などでも能く分る。例へば此處に大きな河があつて河の向に大きな木が一本あるとする。さうすると其の樹の高さは何尺あるか、此方から計つて見ろと言ふ。すると普通の者には出來ない。出來ても色々の苦辛がいる。所が數學に長じて居る者は、そんな事は平氣でしてしまふ。何丈何尺ある。疑つて實地に就いて計つて見ると確に其の通り。數學を知らない者から見ると云ふと、まるで神樣のやうに思はれる。斯う云ふ樣に總べての方面に勝れた人が神になるのである。それは智識の方について見たけれども、道徳の方面から見ても、例へば朝早く起きて、さうして堅忍不拔で働いて、慈愛心に富んで居ると云ふ樣な事は、どうも普通の人から見ると神樣のやうに思はれる、普通の人は及ばない。乃木大將の如きは其の一例である、乃木大將は學問の點から言つて見れば、大將の學問と云ふものは、大したことはないと思はれる。軍人であるけれども、軍略とか戰略とか云ふやうな事になつて來ては、矢張り若手の中佐大佐と云ふやうな人で、洋行でもして大いに〓究して歸つて來た人に較べて見ると、乃木大將のは舊式であつて、比較にはならぬかも知れぬ。然るに乃木大將が乃木大將として大いなる價値を有し、一般の尊崇を受けらるゝと云ふのは。詰り彼の大將の人格の勝れた所である。人格は皆誰れでも有つて居る、萬人同樣に有つて居るのだけれども、併し其の人格に非常に優劣がある。勝れた人格は神と同じ、寧ろ、神なりである。乃木大將は生ながらにして國民から神と尊崇されて居つた。詰りどの點に就いて見ても、上に位する所の者は神であつて、又上に位して居る者は其の德が勝れて居る。其の德が勝れて居る所の者は神なんである。我が傳說の中には、狐も狸も狼も皆神となつて居る。併し是れなどは其の當時の下級人民が、さう云ふものの力が迚も人間の力の及ばない所のものがあると見て、さうしてそれを神としたのである。當時既に神神たる方々は、決してさう云ふものを神とされた譯のものではない。神道に於いて神と云ふのは、詰り上に在ます所のものを神と云ふのである。"

  "source_text": "此の禊の時に成つた神と云ふのに就いて、『神道五部書』と云ふ本がある。是れは伊勢の外宮に傳つたと云ふのであるが、何れにしろ、是れは後世の僞書と云ふことになつて居る。此の『五部書』の中に『御鎭坐次第記』と言ふのがある。其の中に斯う云ふ文句がある。「伊弉諾尊左の眼を洗ひ給ふ。因つて以つて生れ給ふ。神の御名は天照荒魂と申す。亦の名は瀨識津比咩の神なり」と云ふ傳があるが、尙ほ其の次に又「伊弉諾尊が右の眼を洗ひ給ひて、因つて以つて生れ給ふ神の御名は、氣吹戶主神、即ち大神の分神に坐す。故亦の名は、大神の荒魂と申す。」斯う云ふことがある。此の本は信用が出來ないのであるけれども、或る古傳に斯う云ふやうな傳へがあつたのが、『古事記』の中に這入つて、その三貴子の傳が出來たのではないかと思はれる。それで平田篤胤は『五部書』は、僞書と云ふも、一概に排斥すべきものでない。殊に『御鎭座傳記』に傳ふるが如きは、よく實の旨に符ひて決めて後人の言ひ出づまじき說にて『御紀』『古事記』の謬をさへ正し明むべき最も妙なる傳であるとなして次のやうに言つて居る「『御紀』『古事記』に御鼻を洗ひ給ふ時に速須佐之男尊の生りませる傳は、速佐須良比賣神の生りませる傳を誤れるにて『御鎭坐傳記』に此の傳の殘れるはいとも〳〵歡ばしく、此上なき賜物になむありける」と。鼻を洗はれたときに素盞鳴尊が生れられたと傳へてあるが、それは速佐須良比賣、神であると云ふのである。して見ると、伊弉諾尊が左の眼を御洗ひになつた時に御出來になつた神の御名は瀨織津比賣神である。右の眼を御洗ひになつた時に御出來になつた神の御名は氣吹戶主神、鼻を御洗ひになつた時に御出來になつた神が速佐須良比賣神であると云ふことになる。さうすると、決して三貴子が此の時に御出來になつたと云ふことにはならない。是れは徹頭徹尾『御鎭坐傳記』を證據として言ふ譯には行きませぬが、併しどうも此の三貴子と申す神々が、伊弉諾、伊弉冊二尊のお揃ひに御居でになる時代に御降誕にならないで、伊弉諾尊御一神の時に御降誕になつたと云ふ古傳は、どつちから見ても、正しい古傳とは考へられないのである。"

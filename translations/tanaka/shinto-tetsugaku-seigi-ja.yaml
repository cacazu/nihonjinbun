  "translation_ja": "また、神武天皇が即位四年に、皇祖の神霊を祭られた事績などによって、神々を敬うべきことが、ますます徹底していった。その後、代々、神々を敬い、祖先を崇拝することは、皇室で奨励され、私たちの祖先も行ってきた。世間では、神道は単なる道徳であり、神道の神も、キリスト教の神などとは違って、道徳的な神、つまり人である、と説き、神道で神々を崇拝するのは、ただ、根本に報い、始めを顧みることにすぎないという。しかし、私たちが祖先を敬うのは、決して、単なる倫理的な尊敬ではないと思う。一例を挙げると、二重橋の外に、楠正成公の銅像がある。あの銅像は、歴史家が研究して作ったものだから、顔かたちはもちろん、生前の服装、道具、馬の様子など、すべて当時のものに基づいている。いわば、正成公の生き写しであり、人としての正成公を、そのまま写している。しかし、その銅像の前に立つときと、湊川神社に参拝し、社前で手を打ち、頭を下げるときとで、私たちの心の状態はどうだろう。同じとは見られない。銅像の前では、正成公を偉人として仰ぎ、生前の功績を思い起こすことができる。しかし、湊川神社の前では、神として崇拝するのである。その神社の神霊は、神秘的に、また直覚的に、私たちの心の奥深くに強い印象を与える。「どのような方がおいでになるのかは知らないけれど、ありがたさに涙がこぼれる」という思いにならずにはいられない。この心の状態を、銅像の前で起こそうとするのは無理である。銅像に対しては、まさしく人としての楠公を思い浮かべる。公は偉人であり、このような人だった、比較的背が低かった、力もそれほどなさそうだが、私たちの祖先の中の大偉人だ、というように、偉人としての正成公を見るのである。ところが湊川神社に参拝するときには、正成公の背が低かったか高かったか、顔が優しかったか恐ろしかったかなどという考えは、少しも起こらない。正成公の神霊を崇拝し、ここに深い霊感を感じるのである。そこに、神道が偉大な宗教としての性質を持つ点がある。神道には、そのような宗教的な性質があるのである。"

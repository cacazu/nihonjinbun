  "translation_ja": "第八節　神道哲学と伝説の研究"
  "translation_status": "reviewed"
- "id": "st-0027-004"
  "section_id": "chapter-01-section-08"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "我が國の傳說の研究は又是れが種々の方面から出來るのである。即ち神道的方面、武士道的方面、心學的方面、神話學的方面、純歷史的方面、先づ此の位である。神道的方面は傳說を神道として研究し、以つて人の知的、情的、意志的要求に應じやうとするのである。然るに此の方面の中には、更に多少の偏する所があるのを免れない。そこで惟神神道的の研究、佛教神道的の研究。儒教神道的の研究と云ふ風に分れて來る。又武士道的の研究法からは、從來の我が武士的階級に、最も適するやうに研究してあつて、心學的研究方面からは、我が商賈に從事して居る者に、特に其の行爲の規範となるやうに研究されて居るのである。けれども、此の武士道的、及び心學的の研究は、何れも人の意志的要求を滿足せしめんとするのであつて、殊に一方に偏して居るのである。次に傳說を、世界の各國に在る所の神話と同一に見て之れに科學的研究を施さうとするものがある。之れが神話學的の研究で、又純粹なる歷史的研究を以つて、傳說に臨まんとするものがある。併し此の二つは、共に主として人の知的要求を滿足せしめんとするのであつて、亦十分とは云はれない。で今之れを表示して見ると左の通りになる。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"

  "translation_ja": "第二節　天之常立神と高天原"
  "translation_status": "reviewed"
- "id": "st-0062-003"
  "section_id": "chapter-05-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "已に太陽系と云はるゝ此の世界が成ると云ふと、當然我々の住んでる此の國土と、此の國土以外の世界とを區別することが出來る。そこで一元的の可美葦牙彥舅神に次いで、天之常立神、國之常立神(國之常立尊は、又「之」を省き國常立尊とも云ふ)の出現を見ることゝなつた。此の場合に天は國と對立する關係になつて居る。從つて我々は茲に天の意義を闡明しなくてはならぬ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 61
    "url": "https://dl.ndl.go.jp/pid/943657/1/62"
  "translation_ja": "太陽系と呼ばれるこの世界ができれば、当然、私たちが住むこの国土と、それ以外の世界とを区別できる。そこで、一元的な可美葦牙彦舅神に続き、天之常立神・国之常立神が現れることになった。国之常立尊は、「之」を省いて国常立尊ともいう。この場合、天は国と対立する関係になっている。したがって、私たちはここで、天の意味を明らかにしなければならない。"
  "translation_status": "reviewed"
- "id": "st-0062-004"

    "text": "斯う云ふ譯で、天照大神の御德は、先づ天壤無窮の神勅、三種の神器の授與と云ふ風な古傳に依つて窺ふことが出來る。で、天照大神には、釋迦年尼のやうに六年の間山に入つて苦行をして、さうして五千餘卷の經文を說いたと云ふやうな事蹟はつゆ程もないのである。又耶蘇基督のやうに、彼方此方に浮浪的の生活をして、さうして悲慘な末路を爲したやうな事蹟は無いのである。又孔子のやうに、或は政治家となり、或は〓師となつて、門人を集めて〓を垂れたと云ふ事實もない。又ソクラテースのやうに、人家の軒下に立つて一世の墮落せる風俗を革めんが爲に、遂に其の犠牲となつて、毒を仰いで死なねばならぬと云ふやうな事蹟もないのである。しかも天照大神は我が國民に取つて、此れ等他國に現はれた偉大なる人物よりも更に更に偉大である。何故に斯く天照大神が偉大であるか。一體人間は其の道に志ある者は、其の道の達人を以つて、非常に偉い者と見るのである。是れは古今東西を通じて見得らるゝ所の現象である。之れを例を擧げて見ると碁打ちは碁の六段とか七段とか云ふ人は實に偉い人だと思ふ。擊劍をする者はその二級にもなつて居る人は非凡な豪い人だと思ふ、相撲取は大關、横綱と云ふ人は非常に偉いと思つて居る。音樂をやる者は音樂の大家を見て非常な偉い者と思ふ、斯う云ふ風に、各〓其の道の達人を以つて神のやうに尊敬するのである。例へば普通の力士で見ると、彼れ等は橫綱の下駄を揃へたり、湯に入つて背中を流したりするのは何でもない、或る場合にはさう云ふ人の入つた湯でも飮むと云ふ位である。其の道の人は其の道の達人を非常に偉いと思ふ。けれども其の道以外の者から見ると、餘り偉いとも感じない。例へば基を打たない者から見ると、彼れは本因坊だとか、八段だとか七段だとか言つても、「ナンダ本因坊がナンだ、八段がナンダ」と言ふであらう。擊劍をやらぬ人から見れば「二級の人がどうだ、三級がどうした」と思つて格別偉くも思はない。ナンダ竹の先をカチ〓〓やつて、名人も何もあつたものぢやないと言ふ。其の道に趣味を有たない者は、ナンダ橫綱を張るのに一萬圓を出すなんて、馬鹿々々しい。其の金で何か儲かる商賣でも始めたら宜いではないか。此の寒いのに裸體になつて、十貫目もある綱を卷き付けて得意になつて居る。氣狂い見たやうなものだと言ふ。何でも其の通りである。何でも其の道でない人から見ると、殆んど何等の價値もない。であるから印度人種、若くは印度人種と類した思想を有するもの、或は適切に云へば、佛〓的思想若くは信仰を有して居る人には、佛〓は偉い〓のやうに思はれる。從つて佛はスバラシイ偉人に思はれる。猶太人、若くは猶太人的思想を有するもの、或は適切に云へば、基督〓的思想、若くは信仰を有して居る人には、基督〓は偉い〓のやうに思はれる。從つて基督は大した偉人に思はれる。けれども、佛〓や、基督〓に對して、趣味も信仰も持たぬものから見ると、釋迦何するものぞ。親の命を聽かず、國の亡ぶるのも顧みず、氣狂いじみだ事をして平氣で居る。耶蘇何するものぞ。徒らに天國を空想し、社會黨的世界主義を以つて、世人を邪道に導かんとすなどゝ云ふであらう。之れと同じ樣に、熱心なる佛陀、基督の門徒、若くは西洋哲學の心醉者より見れば、我が天照大神は、極めて平凡な人である。何等の價値の無い人のやうに見えるかもしれない。けれども我々日本國民から見ると、我々日本國民は今述べたやうな日本の國民的精神と云ふものを有つて居るのである。勿論此の國民的精神は或は大なる者があり或は小なる者がある。碁で譬へて見ると、から笊碁碁あらふし、初段に井目の者もあらふし、八目の者、七目の者、三目の者もあるであらふ。さう云ふやうに、我が國民的精神の淺深厚薄はあるけれども、日本國民である以上は、大抵或る程度の此の精神を有つて居ない者はない。斯う云ふ精神を有つて居る者の眼から見ると、此の精神の實に偉大なるものを有つて居られる比較すべきものが無い位偉大なものを有つて居られる天照大神は、實に偉大な御方であるとの感が起らざるを得ない。そこで天照大神は、我々の最も重んずる所の神となられて在はすのである。であるから實に天照大神の御德は何と名づけ奉つて宜いか、名け奉る言葉が無い位である。昔支那の孔子の門人は、孔子を呼んで「夫子は日月の如し」と言つたと云ふことであるが、實に我が國民は天照大神を如何に申上げて宜いか分らないので、そこで天照大神の御德の廣大なのを假りに天日に比して、天照大御神と申し、若くは大日雲貴尊と申し、若くは日の神と申したものと思はれる。印度人的の思想、或は猶太人的の思想、若くは歐米人的の思想を有つて居る人から見ると、極めて平凡に見える所の此の天照大神が我が國に於いては實に萬世の師表と仰がれる神に在はして此の神道の淵源を成された所の神に在はすのである。而して同時に我が皇室の御祖先に在はすのである。神道の人生觀は、此の天照大神に依つて示されて居るのである。天照大神は總べて我々の儀表に在はす神である、天照大神の御行ひになつたことは我々日常の行爲の規範となるのである。即ち神道の淵源は實に此の天照大神に在るのである。勿論當時文學がなくして十分に天照大神の御事蹟が傳つて居ない。併しこの傳つて居るものゝ中には金玉のものがあるのである。我々の已に述べた天壤無窮の神勅の如き、世界無比の國體の淵源となり、神道の骨髓根本となつて居るのである。又三種の神器の深遠なる意味-道德上の意味を暫らく措いても-皇統一系の緣由となる深遠なる意味を有し、殊に寳鏡を天忍穂耳尊に授けらるゝ時に當り「吾が兒此の寳鏡を視まさんこと、當さに吾を視るが如くし、床を同くし、殿を共にし、以つて齋の鏡となすべし」と宣はつて居る。此の神勅は現代の國民道德、神道の重要な部分である祖先崇敬の淵源である。此の勅命と同時に、大神は高天原にきこしめす齋庭の穂を給ふ。是れ新甞祭の料なると同時に、我が國民に一日も缺くべからざるものである。保食神に關する傳と共に祭祀と仁政との淵源である。その他大神は、種穀、養蠶、紐織等の事の範を示されて居る。尙素盞鳴尊上天○時には、大夫武備を設けられ、躬には十握劒、九握劒、八握劒又背上に靱を負ひ、手に弓箭を握り親ら防き給ふと傳へてあるのは、大神が武備にも細心の注意を拂はれたのを明にするものである。かう云ふ風な古傳はまだ澤山あるが、今云つたやうな一種の僻見を持つて居る人には、殆んど何等の價値を認めないかも知れない。が、正統の日本人の血の血管に流れて居る我が國民は、釋迦、基督、ソクラテースの聖を以つても、尙、說き得なかつた尊嚴なる大道を示されたる此の天照大神の御德を仰ぎ、人類萬世の儀表として崇敬渴仰しないものはないのである。かくて伊勢の大神宮の稜威は、天壤と共に窮りなきを知るべきである。"

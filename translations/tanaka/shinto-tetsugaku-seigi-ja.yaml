    "text": "で、古傳を朴素的に、極めて幼稚なものゝやうに解釋して行くと云ふと、それは本居宣長のやうな解釋も出來る。一體に宣長の解釋は、全體を通じて一種の神話的、今日謂ふ所の神話的の解釋が多い。此の神話的の解釋をすると云ふことが、神道に於いて最も有益であるか、どうかと云ふことは、是れは大いに考ふべきであらうと思ふ。それに就いて私は何處までも神話的の解釋と云ふものは、神道に於いて取るべき解釋ではないと思ふ。勿論私は已に述べた通り宣長の學說に就いては、非常に尊敬を拂つて居る。宣長の學說に於いて啓發されたことも澤山ある。私は宣長は神道界の一大學者として大いに尊敬し、其の說に依つて幾多の〓を受けたと云ふことを、私は公言して憚らないのである。けれども又其の說が徹頭徹尾皆善なるものとして、之れを墨守すると云ふことは學に忠なるものゝすべき所でないのであると思ふ。宣長の說と雖も篤胤の說と雖も。宜しくない所は大いに改むべきことであらうと思ふ。又之れを改めるのが、即ち此れ等の先輩學者に對して忠實なる學者の態度であらうと思はれる。又此れ等二翁の言葉に依つて見ると、さうせよと云ふことが書いてある。「後世に於いて自分などの說に於いて宜しくないと云ふことを認めたならばよき新たなる說を唱へよ」、と云ふことが書いてある。吾々がそれを唱へるのは、決して先輩に對して禮を缺く所以でなくして、大いに禮を厚うする所以であうらと思ふ。そこで此の宣長の說に依つて見ると、總べてを神話的に解釋しやうと云ふ傾向がある。其の例を擧げて見ると例へば天照大神、月讀尊及び素盞鳴尊の事に就いて、第一に此の三神の御生れになつた事を、宣長は『古事記』の傳に依つて、伊弉諾尊が筑紫の阿波岐原に於いて禊を遊ばした時に、左の眼から天照大神が御生れになり、右の眼から月讀尊が御生れになり、鼻から素盞鳴尊が御生れになつたと云ふ說を取つて居られる。けれども是れはどうも不合理な說である。それから天照大神は太陽其の者である。天津日其のものであると云ふのが翁の解釋である。それに若し反對すると云ふと、いとも畏し我が皇室の御祖先に在はす天照大御神が天津日に在はすことを辨へで、さう云ふことを議論するのは、是れ亦漢意漢習であると云ふ風に言はれる。けれども是れは非常に間違つて居る。そこで篤胤は太陽が天津日であると云ふ解釋はどうも宜しくないと云ふので、天津日の主宰の神である。斯う云ふ工合に改めた。所が焉んぞ知らん其の篤胤の說は宣長の門人の服部中庸の說なので、中庸の『三大考』と云ふ本の中に書いてある。而して其の『三大考』は『古事記傳』の第十七卷の附錄になつて居る。宣長は其の『三大考』の末に跋を書いて、此の說は良い說である。此の說に依つて初めて天、地、泉の解釋もすつかり明白になつて來たと言つて居る。さうして其の『三大考』の說は、天照大神は天津日の主宰神であると云ふ說である。然るに宣長は天津日其のものであると云ふ。さうすると今の『三大考』の末に跋を書かれる以上は、宣長が『古事記傳』に於いて、或は『葛花』と云ふ本に於いて、或は『玉くしげ』と云ふ本に於いて、其の他色々の本に於いて天津日が即ち天照大神であると云ふてある說は、根本から崩れて來る。即ち宣長は此の場合に於いて、所謂論理的の自殺と云ふものをすることになる。之れを以つて見ても宣長の說が未だ此の點に於いては甚だ不十分であると云ふ證據になる。さう云ふ工合に宣長は先づ天照大神が伊弉諾尊の眼から御生れになつたと云ふ說を取り、而して日の神とか月の神とか云ふ言葉に依つて、直に天照大神を日其ものに取つて居る。それで若し古傳をさう云ふ具合に解釋しなければ、それより外に解釋の仕方がないとするならば已むを得ない。併し我々は『日本書紀』によりて、よりよく之れを解し得るのである。『日本書紀』に依つて見ると伊弉諾尊、伊弉册尊が相共に議して、天下に主たる所の者を產まうと云ふので、そこで天照大神、月讀尊及び素盞鳴尊を御產みになつたと云ふことが、その正傳に書いてある。其の說に依れば何も天照大神は眼からお產まれになつたと云ふ事を取らなくても宜いではないか。而して『古事記』よりは『日本書紀』の方が朝廷の正史とせられて居るのであるから古傳としては、二書の間に輕重がないにしても、『書紀』の方に依るのが寧ろ自然であらうと思ふ。さうして『日本書紀』に依つて伊弉諾尊、伊弉冊尊が同時に御居でになる時に、天照大神を產まれたと云ふ說を取れば、何も伊弉諾尊御一人丈け居ませる時、その眼から產れたと云ふやうな難かしい解釋を取らなくても宜いのである。どうも宣長の說にはさう云ふ傾向がある。而して今の天津日と云ふのも、是れは天照大神が光華明彩に在はして、御德が非常に高大であるから、吾々は、大神を何と申上げてよいか、ちよつと申上げることが出來ない。そこで之れを天津日と申して恰も太陽の四海に照臨するやうに御德が高大であると云ふので、そこで日の神と言ひ、或は天照大神と言ひ、天照大御神と言ふのである。斯う言へば少つとも難かしいことはない。支那に於いても孔子の門人が孔子を見て、其の德の極めて高大であるのを賛して。夫子は日月なり」と云ふことを言つて居る。即ち孔子が日月そのものと云ふのではなくて、日月に譬へてかう云つたのである。斯う云ふ風に解釋すれば、少しも其の點は困難でない。それを日の神、月の神とあるからと云つて、直にそれを引き付け、さうして太陽が我が萬世一系の皇統の一番初めの御先祖の神である。斯う云ふ風に說いて、それに對して彼れ是れ言ふのは皇室に對して失禮であると云ふ風に言ふのは、吾々は宣長の爲に全く取らない說である。"

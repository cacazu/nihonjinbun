- "id": "st-0131-004"
  "section_id": "chapter-12-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "神道は偉大な政治の道である。實に世界無比の國體を根柢とする偉大な政治の道である。如何に佛教や基督教があせつてもかう云ふ政治道となることは出來ない。元來佛教の立て方は、家を出なくてはならぬ。在家の信徒も無論あるけれど、理想の佛教家となつて、眞に佛教を信奉するものは、是非とも出家しなくてはならぬ。妻を帶びてはならぬ。魚肉を食つてはならぬ。金錢に執着してはならぬ。かくて家族を根本とし市町村を根本とし、府縣郡を根本とする政治とは一致し得ない。眞の佛教は世界的である。個人的である。非國家的である。基督教も亦之れと同樣である。舊教などではやはり出家的生活を理想とし、世界的である。國境を認めない。國家主義の政治とは、本來の性質を異にして居る。勿論、今日の佛教、基督教は、その本性質を離れて多少國家主義になつて居るけれども、理想的に云へばさうは行かないのである。處が神道は、本質として國家的である。我が國民と共に發展する所の大道である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 130
    "url": "https://dl.ndl.go.jp/pid/943657/1/131"
  "translation_ja": "神道は、偉大な政治の道である。まことに、世界に類のない国体を根底とする、偉大な政治の道である。仏教やキリスト教が、どれほどあせっても、そのような政治の道にはなれない。もともと仏教の立て方では、家を出なければならない。在家の信徒も、もちろんいるが、理想の仏教者となり、真に仏教を信奉する者は、ぜひとも出家しなければならない。妻を持ってはならず、魚や肉を食べてはならず、金銭に執着してはならない。そうしては、家族を根本とし、市町村、府県や郡を根本とする政治とは、一致できない。真の仏教は、世界的であり、個人的であり、国家を基礎としない。キリスト教も同じである。旧教などでは、やはり出家の生活を理想とし、世界的であり、国境を認めない。国家主義の政治とは、本来の性質が異なる。もちろん、今日の仏教とキリスト教は、本来の性質を離れ、多少は国家主義になっているが、理想をいえば、そうはいかないのである。これに対して神道は、本質的に国家に根ざす。わが国民とともに発展する大道なのである。"
  "translation_status": "reviewed"
  "source_variants":

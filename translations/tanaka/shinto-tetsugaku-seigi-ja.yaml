  "translation_ja": "このように仰せになっている。国家の繁栄と臣民の幸福を、心からの喜び、誉れとする、と仰せになっているのである。つまり、神道によってこの大典を発布され、この大典が皇祖皇宗の遺訓であり、神道の趣旨であることは、明らかなのである。"

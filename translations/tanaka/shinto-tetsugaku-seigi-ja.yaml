- "id": "st-0111-002"
  "section_id": "chapter-09-section-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "民本とか、君本とか、民主とか君主とか云ふのは外國の事で、我が君民上下の關係は、義は君民と云ふのであるけれど、情は父子の親で結び付けられてあるのである。「世治り民安かれと祈るこそ我身につきぬ思ひなりけれ」、「とこしへに民安かれと祈るかなわが世を守れ伊勢の大神」と詠ぜられ、「山はさけ海はあせなむ世なりとも君に二心我れあらめやも」「君が世を思ふ心の一筋に我が身ありとは思はざりけれ」と詠ぜる。君民の關係躍如として言外に溢れて居る。君の御心は明鏡である。民の心を寫して少しも凝滯する所なく、臣民に臨ませ給ふ。臣民の心亦明鏡である。一塵一法を止めずして、陛下の御心を體して仕へる明鏡、明鏡に對す。神、神を治むるのである神、神によつて治めらるゝのである。治者と、被治者。父子の親。君民の和、神道政治の要諦、至れり盡せりでる。實に我が國體の精華で理想的のものである。得て名づくべきものがないのである。何等の謬見ぞ。敢へて此の間に民本主義の如き、民主主義の如き、非國民的文字を弄せんとはする。我が健全なる國民は、先づ此の根本的謬見を打破し神道政治を發揮しなくてはならぬ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 110
    "url": "https://dl.ndl.go.jp/pid/943657/1/111"
  "translation_ja": "民を本とするか、君主を本とするか、民主か、君主かというのは、外国の事柄である。わが国の君主と民、上と下の関係は、公の関係では君民というが、情の上では、父子の親愛で結ばれているのである。「世が治まり、民が安らかであるよう祈ることこそ、わが身に尽きることのない思いである」、「いつまでも民が安らかであるようにと祈る。伊勢の大神よ、わが世をお守りください」と詠まれ、また、「山が裂け、海が干上がる世になろうとも、君に二心を抱くことなどあろうか」、「君の御代を思う、その一筋の心で、自分の身があることさえ思わなかった」と詠まれる。君民の関係が、生き生きと、言葉の外にまであふれ出ている。君主の心は、曇りのない鏡である。民の心を映し、少しも滞りなく、臣民に臨まれる。臣民の心もまた、曇りのない鏡である。わずかな曇りもとどめず、陛下の心を受けとめて仕える。明鏡と明鏡とが向かい合う。神が神を治めるのである。神が神によって治められるのである。治める者と、治められる者。父子の親愛。君民の調和。神道の政治の要点は、これで十分に尽くされている。まことに、わが国体の精華であり、理想的なものである。これにふさわしい名を付けることもできない。何という誤った考えであろう。この間に、あえて民本主義や民主主義のような、非国民的な言葉を持ち込もうとするとは。わが健全な国民は、まず、この根本的な誤りを打ち破り、神道の政治を発揮しなければならない。"
  "translation_status": "reviewed"

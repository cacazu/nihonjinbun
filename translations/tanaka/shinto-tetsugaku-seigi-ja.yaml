- "id": "st-0133-002"
  "section_id": "chapter-12-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一體、さう云ふ風の人士は、我が國が發展して、朝鮮も領土とし、臺灣の土人も國民となると云ふ樣な時代に於いては、大和民族、同一血族と云ふが如き考で、祖先を祭ると云ふやうな事が通ぜなくなる。つまり、天孫人種とか、大和民族とか云ふ思想は、前世紀までの話で、今日の時勢には不適切だ。天照大神は、我が國の建國者で崇拜すべきである。萬世一系の皇統は、神聖にして臣民たるものゝ、夢にも覬覦するを許さない。唯、やたらに祖先崇敬と云ふのは、右の次第で宜しくない、發展的の日本國民は、皇室の尊嚴を益〻維持すると同時に、祖先崇拜の如きを斥けて、あらゆる民族を包容し、世界的の大國家を實現するやうに努めなくてはならぬと云ふ風に主張するのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 132
    "url": "https://dl.ndl.go.jp/pid/943657/1/133"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 133
    "url": "https://dl.ndl.go.jp/pid/943657/1/134"
  "translation_ja": "こうした人々は、わが国が発展し、朝鮮を領土とし、台湾の住民も国民となる時代には、大和民族、同じ血族という考えで祖先を祭ることは、通じなくなる、という。つまり、天孫の人種、大和民族などという思想は、前世紀までの話で、今日の時勢には不適切だとする。天照大神は、わが国の建国者として崇拝すべきであり、万世一系の皇統は神聖で、臣民が夢にも、それをうかがい望むことは許さない。ただ、むやみに祖先を敬うというのは、右の理由からよくない。発展する日本国民は、皇室の尊厳をますます維持すると同時に、祖先崇拝のようなものを退け、あらゆる民族を受け入れ、世界的な大国家の実現に努めなければならない、と主張するのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "一體、さう云ふ風の人士は、我が國が發展して、朝鮮も領土とし、臺灣の土人も國民となると云ふ樣な時代に於いては、大和民族、同一血族と云ふが如き考で、祖先を祭ると云ふやうな事が通ぜなくなる。つまり、天孫人種とか、大和民族とか云ふ思想は、前世紀までの話で、今日の時勢には不適切だ。天照大神は、我が國の建國者で崇拜すべきである。萬世一系の皇統は、神聖にして臣民たるものゝ、夢にも覬覦するを許さない。唯、やたらに祖先崇敬と云ふのは、右の次第で宜しくない、發展的の日本國民は、皇室の尊嚴を益〓維持すると同時に、祖先崇拜の如きを斥けて、あらゆる民族を包容し、世界的の大國家を實現するやうに努めなくてはならぬと云ふ風に主張するのである。"

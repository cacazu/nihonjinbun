    "url": "https://dl.ndl.go.jp/pid/943657/1/28"
  "translation_ja": "わが国の伝説は、さまざまな方面から研究できる。神道の方面、武士道の方面、心学の方面、神話学の方面、純粋な歴史研究の方面、まずはこのくらいである。神道の方面では、伝説を神道として研究し、人間の知的な求め、感情の求め、意志の求めに応じようとする。しかし、この方面にも、多少の偏りがあることは免れない。そのため、惟神神道としての研究、仏教神道としての研究、儒教神道としての研究に分かれてくる。また、武士道の研究法では、従来の武士階級に最も適するように研究されており、心学の方面では、商業に従事する人々にとって、特にその行動の規範となるように研究されている。しかし、この武士道と心学の研究は、どちらも人間の意志の求めを満たそうとするもので、とりわけ一方に偏っている。次に、伝説を世界各国の神話と同じものと見て、科学的に研究しようとする立場がある。これが神話学による研究である。また、純粋な歴史研究として伝説に向き合おうとする立場もある。しかし、この二つは、どちらも主として人間の知的な求めを満たそうとするもので、やはり十分とは言えない。これを図にすれば、次のようになる。"
  "translation_status": "reviewed"

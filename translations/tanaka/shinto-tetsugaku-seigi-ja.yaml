  "source_text": "で我が國の美知と云ふ言葉には、支那の道と云ふ字が這入つて來る迄は、こんな觀念がなかつたのであるとしたならば、儒教の學者が言ひ來つて居るやうに、我が國に於いては上古の人間は禽獸と同じであつて、人道と云ふものを全く解さなかつたものであるか、どうかと云ふのが問題である。本居宣長は、「古の大御代には道と云ふ言擧も更に無かりき」と言つて居る。それでは上古には道と云ふものは一切無かつたのであるかと言へば、宣長は、「大いに然らず」として居る。「皇國の古は道と云ふ言論はなかつたけれども、道と云ふ事實はあつたのである」と云ふのは、翁の主張である。誠に其の通りであつて、我が國に於いては古代道と云ふ風な言葉は無い。或は今日西洋で謂ふ所の本務とか、義務とか云ふ言葉も勿論無かつたのである。併し吾々が實際に於いて行ふ所の道と云ふ事實、本務なる事實は、優に十分に存在して居つたのである。唯其の事實に道と云ふ名を附するやうになつたのは、道と云ふ字の輸入後のことである。道と云ふ言葉が無かつたからと言つて、決して一派の學者が言ふやうに、上古は禽獸のやうなものでは斷じてなかつたのである。"

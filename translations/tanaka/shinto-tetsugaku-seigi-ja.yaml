  "kind": "paragraph"
  "origin": "source"
  "source_text": "されど吾々は神道哲學が、ブラグマチズム若くはヒューマニズムそのものと云ふのではない。東洋哲學は、東洋哲學の特色を有し、日本哲學は日本哲學の特色を有して居るから、神道哲學を直にブラグマチズム若くはヒューマニズムとは云へない。唯、比類を西洋哲學に求むればかく云はれると云ふに止まる。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 14
    "url": "https://dl.ndl.go.jp/pid/943657/1/15"
  "translation_ja": "とはいえ、私たちは、神道哲学がプラグマティズムやヒューマニズムそのものだと言っているのではない。東洋哲学には東洋哲学の特色があり、日本哲学には日本哲学の特色があるのだから、神道哲学をそのままプラグマティズムやヒューマニズムと呼ぶことはできない。ただ、西洋哲学に似たものを求めれば、そう言えるというにとどまる。"
  "translation_status": "reviewed"
- "id": "st-0015-004"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "之れを要するに、佶屈聱牙なる文字を臚列するは、一部のものゝ嗜好には投すべきも、眞理と沒交涉であるは、かゝる西洋哲學に見ても、體得せらるゝことゝ思はれる。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 14
    "url": "https://dl.ndl.go.jp/pid/943657/1/15"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 15

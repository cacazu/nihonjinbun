  "translation_ja": "そもそも日本の哲学には、すでに述べたように、中国の思想が入って日本の思想となったものもあれば、インドの思想が入って日本の思想となったものもある。また、その間に立って、わが国固有の思想が発展したものも大いにある。したがって、日本哲学は、たいへん複雑なものとなっている。しかし、イギリス哲学がいかにさまざまに変化しても、経験論がその思想を貫き、大陸の哲学がいかに多くの変動を経ても、常に合理論へ傾いて特色を示すように、日本哲学も、動かしがたい固有の思想を持っている。あらゆる外国の思想を日本へ取り入れ、同化させる場合にも、いつもその特色を発揮しているのである。そして、その特色が最も純粋に発達して、大きな体系をなすのが神道哲学である。それに次ぐものとして、武士道哲学、心学哲学がある。また、外国から思想を取り入れ、日本で同化した哲学には、もちろん儒教哲学・仏教哲学・道教哲学などがある。これを図にすると、次のとおりである。"

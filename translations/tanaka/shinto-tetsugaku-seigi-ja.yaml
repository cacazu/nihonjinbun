  "translation_ja": "もともと、高皇産霊神・神皇産霊神の解釈には、神道の学者は昔からたいへん困っている。なぜかといえば、すでに挙げたように、『古事記』の冒頭には、「天地が初めて開けたとき、高天原に現れた神の名は天之御中主神、次に高御産巣日神、次に神産巣日神」と記されている。その後、多くの神々を経て、イザナギ尊・イザナミ尊に至り、その子として天照大神がいる。そして天照大神が高天原にいて、豊葦原の中つ国の統治に当たった際、高皇産霊神という神がいて、働いている。当時の活動を見ると、まことに功績も威勢も輝かしく、伝承には「天照大御神・高皇産霊神の命によって」とあり、別の箇所では「高皇産霊神・天照大御神の命によって」とある。つまり、天照大神と、ほとんど肩を並べるほど力の強い神だった。当時は、八百万の神を天の安河原へ集めて会議し、皆の意見で重大な事柄を決めている。その様子を見ると、高皇産霊神は、ちょうど今の議長のような役割を果たし、いろいろなことを取り仕切っている。古い伝えによれば、ニニギ尊の母方の親族である。後世の藤原道長や平清盛が、天皇の母方の親族として政治の大権に関わったのと同じように、高皇産霊神も、当時の政治に非常に大きな力を持っていた。それは古伝から、ありありと分かる。そして当時の高皇産霊神は、別名を高木神と伝えられている。そこで、宣長や篤胤が高皇産霊神による天地の創造を説くと、それを聞く人々の中には、神代のごく初めの高皇産霊神が、イザナギ尊・イザナミ尊まで多くの神々を経て、さらに天照大神の時代にも、これほど活躍しているのは、たいへん不思議ではないか、と質問する者があった。すると二人は、神代のことだから少しも不思議ではない、このようなことを疑うのは、結局、中国流の考えや習慣にとらわれているからだ、と言う。このように世間の疑問をすべて抑え込み、高皇産霊神・神皇産霊神が天地を造ったのだと説くのである。"

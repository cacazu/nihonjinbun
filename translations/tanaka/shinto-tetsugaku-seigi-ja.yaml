  "source_text": "一體託宣と云ふものは其の當時色々に利用されたものである。勿論其の託宣は信ずべき託宣も少からぬのであらうけれども、又信用すべからざるものも澤山ある。例へば行基が東大寺を奈良に建てる時に於いて、どうも日本にさう云ふやうな大佛を建てると云ふことは、神慮如何であらうと云ふので、聖武天皇も非常に御心配なされた。そこで行基が天平十三年自ら勅使となり伊勢大神宮に詣り、佛舍利一粒を捧げ、七日間參籠をした。すると其の滿願の日の夜を以つて、天照大神が扉を御開きになつて、さうして行基に對して託宣を御下しになつた。その託宣はこう云ふのである。「實相眞如の日輪は、生死の長夜を照却し、本有常住の月輪は、煩惱の迷雲を攘破す。我れ今遭ひ難き大願に逢ひ、渡りに船を得たるが如し。又得がたき寳珠を受く。暗に焔を得たるが如し。師其れ舍利を持して、飯高の鄕に藏埋せよ」。と云ふ事を仰せになつたと云ふ傳であるが、どうも天照大神が行基を師と言つて先生と仰がるゝことも可笑しいし、又天照大神が佛語で託宣を御下しになつたと云ふことも甚だ可笑しいことである。それから又愈、東大寺の建立が出來て大佛が出來ると云ふと今度は宇佐八幡宮の八幡大神が天平勝寶元年十一月を以つて、東大寺へ參拜したいと云ふ託宣を御下しになつた、それで愈朝廷から迎神使として特に參議石川年足侍從藤原魚名を御任命になつて、さうして宇佐八幡大神を御迎へになり、天皇、太上天皇、太后も百官を率ゐて大神の御伴をして行幸せられ、僧五千を請し、佛に禮し、經を讀ましめらるゝと云ふやうな大騷になつたことがある。是れなども甚だ妙な託宣だと思はれる。考へて見るに奈良と云ふのは當時の東京である。首府である。其處へ大佛が出來たと云ふ大評判があるので、屹度宇佐八幡宮に奉仕して居る巫祝などが一度此の大佛に參拜し、奈良見物もしたいと云ふやうな譯で、それには何とか旨い方法はなからうかと云ふやうなことで、斯う云ふ者共が相談した結果ではなからうかと思はれる。其の他誰れでも知つて居る所の弓削道鏡に對する託宣、こんな託宣が非常に澤山ある。それであるから弘仁三年九月の官符に、「恠異の事は、聖人語らず、妖言の罪は法制輕きにあらず、神宣は著るしく其のしるしあらはれたる事にあらずば國司言上すべからざる由定められ侍り、こは御こ神なぎなどのするわざなるによりて也。」『樵談治要』に一條兼良卿が記されて居るが、これを以つて見ても、如何に當時託宣と云ふものが濫用されて居つたかと云ふことが分る。"

- "id": "st-0014-004"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "抑も我が國が世界に比較すべきなき國家を組織し、特有の文化を有せるは爭ふべからざる事實である。而してかゝる事實の存在は必ずそれに十分なる理由がなくてはならぬ。根據がなくてはならぬ。此の理由又は根據は即ち我が神道なることは、我が國民なると或は外人なるとを問はず、少しく徹底的に我が國家を研究せるものゝ。容易に首肯する所のものである。況んや之れを輓近歐米殊に米國に盛に唱道せらるゝプラグマチズム(實用主義)に見よ。「眞理は必ず實際上の効果を有するものでなくてはならぬ」と說き、徒らに佶屈聱牙なる文字を臚列するを避け、實際上の應用を尊び、思想上の遊戯を排斥して居るではないか。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 13
    "url": "https://dl.ndl.go.jp/pid/943657/1/14"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 14
    "url": "https://dl.ndl.go.jp/pid/943657/1/15"
  "translation_ja": "そもそも、わが国が世界に比べるもののない国家を組織し、独自の文化を持っていることは、否定できない事実である。そのような事実がある以上、それに十分な理由や根拠がなくてはならない。この理由、あるいは根拠こそが神道であることは、日本人か外国人かを問わず、わが国を少しでも徹底して研究した者なら、たやすく認めるところである。まして、近ごろ欧米、ことにアメリカで盛んに唱えられているプラグマティズム（実用主義）を見れば、なおさらである。これは「真理は、必ず実際の効果を持つものでなくてはならない」と説き、いたずらに難解な文字を並べることを避け、実際の応用を重んじて、思想の上の遊戯を退けているではないか。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "抑も我が國が世界に比較すべきなき國家を組織し、特有の文化を有せるは爭ふべからざる事實である。而してかゝる事實の存在は必ずそれに十分なる理由がなくてはならぬ。根據がなくてはならぬ。此の理由又は根據は即ち我が神道なることは、我が國民なると或は外人なるとを問はず、少しく徹底的に我が國家を研究せるものゝ。容易に首肯する所のものである。況んや之れを輓近歐米殊に米國に盛に唱道せらるゝプラグマチズム(實用主義)に見よ。「眞理は必ず實際上の効果を有するものでなくてはならぬ」と說き、徒らに佶屈警牙なる文字を臚列するを避け、實際上の應用を尊び、思想上の遊戯を排斥して居るではないか。"
    "description_ja": "完稿後見直しで原画像コマ14・15を再確認し、難字のOCR誤認を補正。"
- "id": "st-0015-001"
  "section_id": "chapter-01-section-01"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "實際神道は或る點からは、ブラグマチズムである。希臘のアリストレースとか、獨逸のヘーゲルとかのやうに、所謂佶屈贅牙な文字て、深遠な學說を說くを好まないのは、プラグマチズムである。今シラーの說を見るに人間の知と行とに關しては四つの見方がある。その一は知を先に見て行は之れに從ふとする。即ち行ふには前に知ることが必要であるとする。ソクラテースの見方である。その二は知と行とは別である。知は人間以上に純なるものに進み、遂に神となる。人間の實用的知識の如きは劣等のものであるとする。アリストレースの見方である。その三は亦知と行とを別とする。即ち異つた精神作用から發する。併し行即ち意志の働が貴いとする。カントの說である。その四は第一の說の反對で、行を先に見て、知を後に見るのである。即ちすべて實行から實際的知識が發達し、理論的知識は之れに從つて發達して來ると云ふのである。之れがプラグマチズムの見方である。神道亦事實を貴ぶのである。實行を尊重するのである。要は實行にある。百千の知があつたとて、實行に價値のないものは、無用のものとするのである。此の點當に神道哲學はブラグマチズムの哲學と云つてもよい。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 14
    "url": "https://dl.ndl.go.jp/pid/943657/1/15"
  "translation_ja": "実際、ある面から見れば、神道はプラグマティズムである。ギリシャのアリストテレスやドイツのヘーゲルのように、いわゆる難解な文字を使って深遠な学説を説くことを好まない点は、プラグマティズムに通じる。今、シラーの説を見ると、人間の知と行について、四つの見方がある。第一は、知を先に置き、行はそれに従うとする。つまり、行うには、まず知ることが必要だとするソクラテスの見方である。第二は、知と行を別のものとし、知は人間を超えた純粋なものへと進み、ついには神となる、人間の実用的な知識などは劣ったものだとする、アリストテレスの見方である。第三も、知と行を別のものとし、異なる精神作用から生じるとする。ただし、行、すなわち意志の働きを貴いとする。これがカントの説である。第四は、第一の説と反対で、行を先に、知を後に置く。すべて実行から実際的な知識が発達し、理論的な知識はそれに従って発達してくるというのだ。これがプラグマティズムの見方である。神道もまた事実を重んじ、実行を尊ぶ。要は実行にある。どれほど多くの知識があっても、実行に価値をもたらさないものは無用とする。この点からは、神道哲学をプラグマティズムの哲学と言ってもよい。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "實際神道は或る點からは、ブラグマチズムである。希臘のアリストレースとか、獨逸のヘーゲルとかのやうに、所謂信屈贅牙な文字て、深遠な學說を說くを好まないのは、プラグマチズムである。今シラーの說を見るに人間の知と行とに關しては四つの見方がある。その一は知を先に見て行は之れに從ふとする。即ち行ふには前に知ることが必要であるとする。ソクラテースの見方である。その二は知と行とは別である。知は人間以上に純なるものに進み、遂に神となる。人間の實用的知識の如きは劣等のものであるとする。アリストレースの見方である。その三は亦知と行とを別とする。即ち異つた精神作用から發する。併し行即ち意志の働が貴いとする。カントの說である。その四は第一の說の反對で、行を先に見て、知を後に見るのである。即ちすべて實行から實際的知識が發達し、理論的知識は之れに從つて發達して來ると云ふのである。之れがプラグマチズムの見方である。神道亦事實を貴ぶのである。實行を尊重するのである。要は實行にある。百千の知があつたとて、實行に價値のないものは、無用のものとするのである。此の點當に神道哲學はブラグマチズムの哲學と云つてもよい。"

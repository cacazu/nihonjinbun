  "translation_ja": "こうした神の観念は、先に述べたように、西洋で先天的と言うような形で、私たちの内に自然に起こってくるものである。日々忙しく暮らし、心がいつも外の物事へと次々に向いているときは、私たちは平気でいる。しかし、たとえば真っ暗な晩に学校などの広い建物へ行くと、何となくある種の存在があって、神秘的に、こちらへ何かの力を加えてくるように感じる。そのような感情が人間にはある。肝試しなども、こうしたところから行われるのである。この感情は、実際、多くの人が経験している。過去の経験を思い返してみると、ばたばたと日々の暮らしに追われているときは何でもないのに、病気で一室に閉じこもって寝ていたり、暗い夜に知らない道をたどっていたりすると、目には見えず、耳にも聞こえない大きな力があって、それが私たちに働きかけているように感じることがある。これを西洋では「実在の感情」と呼んでいる。実際に存在するものの存在を感じるのである。家がある、山がある、川があると思っても、瞑想に入れば、家も川も見えない。すべてのものが見えなくなる。ここに立派な金銀財宝があると思っても、瞑想している間には、その存在を認めることはできない。しかし、それらとは別に、確かに実在する何ものかがあって、私たちに力を及ぼしているという感情、そのような感情が私たちにはある。"

  "translation_ja": "すでに述べたように、篤胤は天御中主神を、老子の道、『易』の太極、『礼記』の太一などと同じもので、始まりも終わりもない神だとしている。要するに、天御中主神を絶対そのもの、すなわち宇宙の本体と解釈する点では、多くの神道学者が一致する。絶対そのものと解釈する以上、この神は生まれることも滅びることもなく、生滅ということがない。その本質も、増えも減りもしない。常にあって変わらず、あらゆるところに及ぶ。尽きることも限りもなく、何かの原因や条件によってできたものでも、変えられるものでもない。また、いかなる制約も受けない。したがって、宇宙のすべてを含み、すべての原因となり、すべての条件となるものである。これが、天御中主神を説明する言葉である。「天御中主」という名は、宣長の解釈では、「天の御中にいて、主、すなわち大人である神」という意味である。ここで「天」とは、通常いう宇宙、果てしない大宇宙を指す。後世にはさまざまな意味が付けられたようだが、当時の天は宇宙そのものであり、したがって無限である。この神は、その無限そのものを体として存在する。それゆえ、宇宙の至るところにいるのである。宇宙は無限だから、そのどこもが「御中」となる。中とは、もともと中心ということであり、どの方向へも距離が等しいということである。ところが宇宙は無限なので、どの点から見ても、上下左右へ同じ距離となり、そこがそのまま中心になる。限りがあれば両端の中間を中心としなくてはならないが、限りがないので、どんな点も、そのまま中心になる。その中心が、天御中主神の無限の体の中心となるのである。私たちの体で考えてみても、指先をけがすれば、そこがひどく痛み、その痛むところに、私たちの精神全体が集まる。しかし、体の別の部分に、もっと大きな出来事が起これば、精神はすべてそちらへ向かい、指先のけがは意識に残らない。それでも余裕ができれば、すぐ指先へ戻る。このように、精神が体の一部から他の部分へ移るには、ほとんど時間を要せず、まったく間を置かないように見える。私たちの精神や身体は不完全で欠点も多く、天御中主神と比べられるものではない。しかし、もともと天御中主神の一部分として生きるものだから、その性質が、それほど違うわけではない。そこで、宇宙における天御中主神のあり方も、おおよそ私たちの精神と身体の関係から類推すべきであり、その精神全体が宇宙のあらゆるところにあると言うのである。このように解釈するのだから、宣長のように、この神を世界の外に存在する一柱の神、西洋でいう「ゴッド」のようには理解しない。篤胤の説も、あるところでは老子の道と同じように説明するが、別のところでは宣長流の説に従い、この神を世界の外に置き、宇宙を創造した神と見て、宇宙創造説を組み立てようとする構想があった。しかし、神道の意味から見て、そのような解釈はいかがなものかと思う。少なくとも、私は賛成しない。宣長も篤胤も、この道の先輩、大家として心から尊敬するが、その説に一から十まで、すべて盲目的に従うことはできない。今の点も、その一例である。そこで私は、まず天御中主神を絶対そのものと解釈し、さらに高皇産霊神・神皇産霊神の二神へと進んで、天御中主神の徳を、いっそう明らかにしようと思う。"

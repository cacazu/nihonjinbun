  "translation_ja": |-
    日本哲学は、次の二系統に分かれる。
    日本固有の思想が発展したもの――神道哲学・武士道哲学・心学哲学。神道哲学は、惟神神道哲学・仏教的神道哲学・儒教的神道哲学に分かれる。

    "url": "https://dl.ndl.go.jp/pid/943657/1/52"
  "translation_ja": "中国では、「易には太極があり、そこから両儀が生まれる」と言う。太極が分かれて陰と陽になるのである。また『老子』には、「一が二を生み、二が三を生み、三が万物を生む」とある。一というものから陰陽が生まれ、そこから天・地・人が始まる、と解釈している。また『易』には、「偉大なるかな乾の根源、万物はこれによって始まる。偉大なるかな坤の根源、万物はこれによって生まれる」という言葉がある。「始まる」と「生まれる」という違いには、かなりの意味があるようだ。乾と坤、あるいは陰と陽によって万物ができてくる、と見るのである。陰は消極的、陽は積極的で、ともに太極の属性と言うべきものである。中国の周茂叔は、「太極は動いて陽を生む。動きが極まると静まり、静まって陰を生む。静まりが極まると、また動きに戻る。一つの動き、一つの静まりは、互いに根となる」と言う。太極が動けば陽となり、動きが極まると静まって陰が生まれる。静まりが極まれば、また動き出す。動と静、静と動が、絶えず巡る。このように動静が循環し、万物が生まれるというのだ。もとは一つの太極が、あるときは陰、あるときは陽となり、こうして万物ができてくる、と解釈するのである。ところが朱子は、理気の説を立てた。理が太極で、気が陰陽であり、理は形而上、気は形而下だとする。こうすると二元、つまり二つの根本を認めることになる。理と気を別々に見ているのである。そうなれば、理と気のどちらが先かという議論が起こる。理が最初にあったのか、気が最初にあったのか、ということになる。このような議論になると、どうも朱子の考えは、あまりよいとは思えない。やはり、陰陽を太極の二つの属性と解釈するほうがよいと思う。"
  "translation_status": "reviewed"
- "id": "st-0052-001"
  "section_id": "chapter-04-section-04"

  "translation_ja": "こうして、忠と孝を最も重んじるため、「家」という観念が、非常に強くなる。その家は、ただの一個の家ではなく、祖先の家であり、祖先から受け継ぎ、子孫に伝える家であるという観念が強い。いわゆる家族主義が、神道に行われるのである。西洋にも昔はあったが、今日では、もはや影もとどめない。西洋の人々は、スイートホームといって、楽しい家庭を作ることを望む。しかし、わが国のような意味での家族を作ることは考えない。そのため、西洋の家庭には家長がなく、家を後世に伝えない。財産は相続しても、家督は相続しないのである。これに対して、わが国では家を非常に重んじ、遠く祖先から受け継ぎ、長く子孫へ伝えるべきものとする。この道徳を実践の面から述べれば、さまざまな現象となって、わが国固有の道徳を形作るが、その最も大切な点は、皇室を中心とすることである。あらゆる道徳が、皇室を無視しては道徳にならない。ここが大切である。他国では、皇室を無視して道徳になる場合がある。たとえば中国で、清を倒すときには、清に反抗しながら、自分は国家のために働くといい、愛国者だと叫んでいる。また西洋では、たとえばフランスのルイ十六世は、フランスの議会で罪状を審議され、ついに死刑を宣告された。議員たちは、国王に死刑を宣告しながら、やはり国家に忠節を尽くしていると考える。つまり外国では、皇室を離れて道徳が成り立つ。しかし、わが国では、皇室を離れれば、道徳はまったく成り立たない。皇室を中心に道徳が成立し、皇室を無視した行動に出れば、あらゆる道徳が、みな不道徳になる。これが、わが国の道徳の特色である。皇室を中心とし、忠実で善良な臣民となり、天祖の神勅に従って、天地とともに尽きることのない皇運を助け支えていくことが、わが国の道徳の極致である。この極致を十分に発揮するために、神剣が輝いている。国家に危害を与えようとする者があれば、私たちは、神剣の神威を受けて抵抗しなければならない。もちろん一方では、神鏡の示すところに従い、知識を磨き、決して無謀で乱暴なことをしてはならない。また一方では、神璽の趣旨に従って、慈愛の精神を発揮しなければならない。実際、中国人が、東方の君子の国といったように、私たちは仁愛の精神に富んでいる。しかし、天地とともに尽きることのない皇運を助け支えるため、ひとたび非常事態となれば、あらゆる悪魔を討ち、国家を泰山のように安定させ、その無限の発展を図る。これが、わが神道道徳の極致なのである。"

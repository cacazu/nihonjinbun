  "translation_ja": "主観の側では、このような感情が私たちの内にあるが、客観の側を見ると、天地のあらゆるものが、このように秩序正しくできている。春夏秋冬は時を違えずに巡る。私たちの体を見ても、不要なものは次第に取り除かれ、役立つものは、いっそう発達していく。たとえば、人間も昔は尾を持っていたというが、今はない。なぜないかといえば、結局、私たちには必要がないからである。犬や猫には、いろいろな点で尾が必要だ。犬などは尾を動かして感情を表す。喜べば尾を振り、恐れていれば下げる。そのように必要なのである。馬の尾も、ハエなどを追い払うための道具として必要であり、外見を飾る道具にもなっている。それらの動物には、こうした必要があるが、人間は服を着るので、尾は要らない。ハエが止まっても、尾で追う必要はないし、尾を使って表情を示す必要もない。どの面から見ても、尾は不要となる。そこで、世界のむだを省く仕組みによって、次第に尾がなくなってきた。しかし、今、尾がないからといって、人間には昔から尾がなく、祖先以来なかったものだなどと言えば、大いに恥をかく。比較解剖学によって調べれば、確かな証拠が出てくるからである。腰の周りには、ある筋肉がある。今は不要な筋肉である。何のためにあるのか、専門家が調べると、まぎれもなく、昔、尾があったときに、それを動かした筋肉なのである。それが幸か不幸か残っている。これが証拠なのだから、どうしようもない。また、耳を動かす筋肉もある。昔は耳を動かした。しかし今の人間は、どの方角へでも首や体を回せるから、あえて耳を動かす必要はない。馬などは体が大きく、自由に後ろを向くことができないので、耳を動かす。人間にはその必要がないため、筋肉は残っていても、耳を動かさない。時には動かせる人もいるが、それは例外である。そのほか、皮膚を動かす筋肉も残っているという。どうも困ったものだ。昔の人間は、ハエなどが止まると、馬のように皮膚をぴくぴく動かして追ったものだ。しかし今は服を着ており、ハエが止まっても苦痛を感じないので、皮膚を動かす必要がなく、その筋肉は次第に衰えていく。それに対し、脳や手足などは、巧みに発達してくる。このように、必要なものはいっそう発達し、不要なものはいっそう衰える。結局、自然の中で、一種の節約、むだを省く働きが行われているのである。また、別の面から見れば、宇宙には多くの星があって、絶えず巡っている。これほど限りなく星々が巡れば、衝突もしそうなものである。いつだったか、西洋で、翌年のある月日に地球がある星と衝突して砕け、地上のあらゆるものも滅びてしまう、という話があった。財産を残しておいても仕方がない、すべて使ってぜいたくをしておかなくては、せっかく蓄えた金が無益になると言って、さんざんぜいたくをして、その日を待ったという。しかし、その日になっても地球は少しも衝突せず、金は使い果たしてしまったので、たいへん困った、ということがあった。そのようなわけで、地球が衝突するなどと言っても、いっこうに衝突せず、きちんと巡っていく。あらゆる力が、互いに衝突せずに働いている。これを見ると、ここにも何か人間を超えるものがあって、このようにしているのではないか、という考えが、誰の心にも起こらずにはいない。そこに、神という人間を超える存在があるのである。一方では、主観的に自分の心にある種の実在の感情を持ち、また他方では、客観的に万物を見て、どうも人間を超えるものがあって、このようにしているのではないかという感情が生まれる。こうした感情は、とりわけ、今日ほど学問の発達していない古代には強かった。それゆえ古代には、この観念が、たいへん広く行き渡っていたのである。"

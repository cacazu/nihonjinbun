  "translation_ja": "さて、今日のわが国民について、よく研究してみると、第一章ですでに述べたように、わが国の歴史と地理の関係から、昔から培ってきた国民的精神というものがある。それを分けて見ると、秩序と統一を重んじる思想に富み、快活で現世的な感情に富み、発展し膨張する性格に富んでいる。秩序と統一を重んじる思想とは、私たちがこの世で生きる上で、すべてに秩序を重んじ、統一を尊ぶ精神である。どの国民も秩序や統一を尊ぶが、わが国民は特に、この点に重きを置いている。たとえば中国を見ても、その国民も秩序を重んじ、統一を尊んでいる。しかし、わが国のようには尊んでいないので、秩序の根本となるものが成り立っていない。わが国では、一軒の家に家長がいて、その家を引き締めていく。しかし、ほかの国では、わが国の「家」のようなものは、あまり見られない。わが国の家は家長が治め、その家長を継ぐことを、家督の相続という。この家督相続も、わが国ではきわめて大事なこととされているが、外国では、それほど大事ではない。とりわけ西洋では、今日、家督の相続は見られない。まったくないのである。家はいわゆる男女同権で、夫と妻が対等に立っている。子供も、成人すれば、やはり親と対等に立つようになる。ところが、わが国では、同じ血族の者が、同じ家長の下で温かく団結している。だから、わが国では家を尊ぶのである。その家の観念が大きくなれば、国家になる。したがって国家の主権者、すなわち天皇陛下は、一軒の家でいえば家長と同じように、国民の中心となり、崇敬の対象となっておられる。中国などでも忠や孝を説くが、君主に対して簒奪や弑逆を行う。秩序の根本を失っているから、そうなるのである。西洋も、秩序と統一を重んじてはいるが、徹底していない。こう言うと、次のように言う人がいるかもしれない。今日、わが議会で、政府と議会が激しく争論するのはなぜか、それでも秩序と統一を重んじているのか、と。しかし、昔の政府でも、内大臣・左大臣・右大臣・太政大臣などが政治を行い、左大臣や右大臣の間で、権力の衝突などは絶えずあった。今日は立法・司法・行政に分かれ、行政部・立法部・司法部となっている。立法部と行政部が衝突し、争論するのは、どちらも国政を十分に行い、秩序と統一を十分にしようとする努力にすぎない。天皇陛下に対しては、等しく忠実に働いている。だから、いったん敵国による外患が生じれば、すぐ議会でも全会一致、国内でも挙国一致となるのである。また、御大礼や御大喪のときには、どれほど争論していても、すぐに一致する。これこそ、わが国民が、今日も秩序と統一の精神を十分に発揮している証拠である。要するに、わが国では、秩序と統一の根本に、神聖な天皇陛下をいただいている。西洋などでは、神を主とし、上に立つものとし、皇帝も人民も、等しく神の支配を受けるべきものとする。つまり、神に対しては同輩である。この世の父より天の父を、この世の主より天の主を大事にする考えでは、とても、わが国のような秩序と統一はできない。また、中国やアメリカのように、国民がてんでに民を主とし、民を根本としては、徹底した統一はできない。もちろん、わが国でも歴代の陛下は民を愛し、民の心を自分の心とされているが、外国のように人民自身が民主主義を主張してはだめである。人民は多い。多くの人民が主では、どのような方法を採っても、理想的な統一は到底できないのである。"

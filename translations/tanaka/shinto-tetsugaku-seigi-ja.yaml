- "id": "st-0021-004"
  "section_id": "chapter-01-section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "哲學と宗教とは、どんな差があつてそんな名がついて居るのかと云ふと、宗教は詰り我々が或る我々以上のもの、即ち人間よりも、より以上のものを認識して、これに依從し、安心し生活して行く狀態を云ふのである。それが哲學と何ういふ區別があるかと云ふに、本は同樣に傳說から出たものであるから嚴密に區別することは出來ぬ。が今日世間の學者は斯ういふ風に區別して居る。即ち成立の主體が違うと云ふて居る。宗教の建設者と、哲學の建設者とが違う。宗教の方は民族的に出來て居る。哲學の方は一人の人が唱へて居る。宗教の方は歐羅巴の耶蘇教とか、猶太の猶太教とか、印度の佛教とか云つて居るが哲學の方は誰れ某れの哲學と云ふて居る、斯ういふ區別を立てる。けれどもこれも餘り當らぬものである。佛教は釋迦とか、耶蘇教は基督とか、波斯教はゾロアスターとか、マホメツト教はマホメットとか云ふやうに矢張り一人の人が創めて居る。哲學の誰れ某れといふのと同じ事である。宗教の方は神祕的の傾がある、それから又想像的である。夫れから又詩的である。哲學の方は方法的である。それから系統的で、統括的である。と云ふのが、又學者の區別である。これは大體に於いて區別したもので、もと二つながら傳說から來て居るので劃然と區別することは出來ぬ。ヘーゲルと云ふ人の哲學や、基督の如き宗教では、こう云ふ風に區別も出來るが、佛教などでは當て箝らない、神祕的の處もあるが、又哲學的の處もある。元來宗教でも、哲學でも、共に世界觀、人生觀を立て以つて我々人類 の精神的欲求を滿足せしめやうとする點に於いては、毫も異る點はない。唯、知的方面に傾いて居る人は哲學を取りて、その滿足を得んとし、情意的傾向に强い人は、宗教に歸してその慰安を得んとして居るのである。コー云ふ次第であるから動物と植物とが、根本的に區別せられないやうに、宗教と哲學とも根本的の區別は出來ない。で、今は唯々其の傾きを以つて區別するだげのことである。"

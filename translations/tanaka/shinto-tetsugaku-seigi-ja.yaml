  "translation_ja": "このように、天体は生滅し、現れたり消えたりしている。つまり、活動しているのである。高皇産霊神の徳によって、宇宙のすべてのものは、常に活動している。人間が生まれると、そこに一つのものができ、死ぬと、そこにあったものが滅したように見えるが、別の面から見れば、また現れたのである。消えたといえば、なくなったようだが、それがまた生まれたことになる。そのように、生まれたり死んだりしている。これは個人について見た場合だが、範囲を広げて民族全体について見ると、その民族全体もまた、生滅し、現れたり消えたりしている。あらゆる物事が、みなそうしているのである。たとえば机のようなものは、いつまでも存在しているように見えるが、やはり生滅している。このようにできあがった机も、永久に存在するように見えながら、いつの間にか腐ったり壊れたりして、ついには消えてしまう。消えたかと思うと、また別のところに現れてくる。こうしたものが、すべてまったくなくなってしまうことはない。天御中主神の徳は、増すことも減ることもないのだから、まったくなくなることはないのである。全宇宙には、東西南北も上下左右も、どこまでも限りがない。無限である。無限の活動によって、無限に生滅し、現れたり消えたりしている。そこが、天御中主神・高皇産霊神・神皇産霊神の徳であり、その本性なのだと見るのである。"
  "translation_status": "reviewed"

  "translation_ja": "次に、快活で現世的な感情についていえば、インドの国民などは、どうも厭世的で、快活ではない。山の中に引きこもって暮らすような者が多い。以前来朝したタゴールなどは、最も新しい実例である。汽車や電車、そのほか、いわゆる文明をのろい、市街のにぎわいを嫌うことなどは、祭りを愛し、縁日に参ることを好むわが国民とは、同じには論じられない。また西洋でも、ギリシャの国民などは、ずいぶん現世的だったが、中世には多くの厭世的な人々が現れ、財産を教会に寄付して隠遁する風が、大いに行われた。現在でも、フランスの国民などには、そのように暮らす者が多い。もっとも、日本国民にも、厭世観を抱く者がいないわけではない。しかし、それは仏教の影響を受けたか、個人の境遇などが、そうさせたのであって、大多数は快活である。厭世的で憂鬱な生活を、日本国民はあまりしない。厭世的な傾向に富む仏教でも、日本化すると、日蓮の一派のように、大いに快活になる。念仏宗などには、かなり厭世的な傾向があると見なければならないが、肉を食べ、妻を持つことなどは、とてもインド仏教とは見られない現象である。これも、日本化した結果と見てよい。また、現世的でもある。未来の天国や極楽を、あまり念頭に置かない。もちろん、年を取った者や身体の弱い者、何かきっかけのある者の中には、かなりそのような考えを持つ者もいる。精神や身体が病的な者には、天帝や阿弥陀如来などにひどく頼り、未来の幸福の保証を得たいという思いが強い者もいるが、健全な日本国民には、そうした者は少ない。たとえ仏教徒となって仏を拝み、寺院に布施する者でも、またキリスト教徒となって神の福音を喜び、教会に参る者でも、日本国民として健全である以上、現世的であることを失わない。要するに、日本国民の大多数はみな現世的であり、現世で活発に活動することが、日本国民の特色なのである。"

- "id": "st-0016-005"
  "section_id": "chapter-01-section-02"
  "kind": "heading"
  "origin": "source"
  "source_text": "第二節哲學とは何ぞや"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 15
    "url": "https://dl.ndl.go.jp/pid/943657/1/16"
  "translation_ja": "第二節　哲学とは何か"
  "translation_status": "reviewed"
- "id": "st-0016-006"
  "section_id": "chapter-01-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "神道哲學と云ふと、先づ第一に起る問題は「哲學とは何ぞや」と云ふのである。ホツブスは此の問題を解釋して、「哲學は、原因によつて物體を說明する學問だ」と云つて居る。ユーベルウエツヒは、「哲學は諸原理の科學である」と云ひ、スペンサーは「哲學は完全に組織せられた智識てある」と云ひ、先年我が國に來た米國のラツドと云ふ學者は、もつと詳はしく解釋して、「哲學は、終局の實在に關して、種々の科學で、假定したり又は設定したりした、もろもろの原理の進步的合理的體系である」と云つて居る。學問も澤山あるが、哲學位色々の學者によつて、色々に解釋せらるゝ學問はたんとないと思はれる。そこで著者は哲學の起源から說いて、その意義を明にしやうと思ふ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 15
    "url": "https://dl.ndl.go.jp/pid/943657/1/16"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 16
    "url": "https://dl.ndl.go.jp/pid/943657/1/17"
  "translation_ja": "神道哲学というと、まず第一に起こる問題は、「哲学とは何か」ということである。ホッブズはこの問題を説明して、「哲学は、原因によって物体を説明する学問だ」と言っている。ユーベルヴェークは「哲学は諸原理の科学である」と言い、スペンサーは「哲学は完全に組織された知識である」と言う。先年わが国を訪れたアメリカのラッドという学者は、さらに詳しく、「哲学は、究極の実在に関して、さまざまな科学が仮定したり設定したりした、もろもろの原理を、発展的・合理的に体系づけたものである」と説明している。学問は多いが、哲学ほど、多くの学者によってさまざまに解釈される学問は、それほどないと思われる。そこで私は、哲学の起源から説き、その意味を明らかにしようと思う。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "神道哲學と云ふと、先づ第一に起る問題は「哲學とは何ぞや」と云ふのである。ホツブスは此の問題を解釋して、「哲學は、原因によつて物體を說明する學問だ」と云つて居る。ユーベルウエツヒは、「哲學は諸原理の科學である」と云ひ、スペンサーは「哲學は完全に組織せられた智識てある」と云ひ、先年我が國に來た米國のラツドと云ふ學者は、もつと詳はしく解釋して、「哲學は、終局の實在に關して、種々の科學で、假定したり又は設定したりした、もろ〓〓の原理の進步的合理的體系である」と云つて居る。學問も澤山あるが、哲學位色々の學者によつて、色々に解釋せらるゝ學問はたんとないと思はれる。そこで著者は哲學の起源から說いて、その意義を明にしやうと思ふ。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0017-001"
  "section_id": "chapter-01-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "天には日月星辰が、萬古に變幻し、東西南北に出沒して窮極する所がない。地には河海山嶽が、或は奔流し、或は起伏して居る。人はその間に生れ或は社會をなし、或は國家をなして居る。萬象實に複雜である。而して此の間に君臣父子の關係の生ずる所以、夫婦昆弟の關係の生ずる所以、その他、禽獸の活動する所以、魚鼈の游泳する所以、旦に之れと應接し、夕に之れと進退するも、一念の注意至るなければ、何等の奇なく、何等の妙もないが一たび想を彼れに走せ、退いて深く自ら省みて見ると云ふと、一體何う云ふ譯でかう云ふ樣になるのであるかと云ふやうな、色々の疑問が起つて來る。ひとつ此の解釋をして見やうと思ふのが即ち哲學なのである。哲學と云ふものは、人の思ふ通りそんなに深遠高尙のものでなく、當り前のことの考察であつて、何人でも一種の哲學觀は有して居るのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 16
    "url": "https://dl.ndl.go.jp/pid/943657/1/17"
  "translation_ja": "天では、太陽・月・星が、はるかな昔から姿を変え、東西南北に現れたり沈んだりして、尽きることがない。地には川や海、山々があり、あるものは激しく流れ、あるものは高く低く連なっている。人はその間に生まれ、社会をつくり、国家をつくる。万物のありようは、実に複雑である。そうした中で、君臣や親子の関係が生まれるのはなぜか、夫婦や兄弟の関係が生まれるのはなぜか、また、鳥や獣はなぜ活動し、魚や亀はなぜ泳ぐのか。朝から晩まで、そうしたものと関わって暮らしていても、少しも注意を向けなければ、不思議も驚きも感じない。しかし一度それらに思いを向け、立ち止まって深く考えてみると、いったいどういうわけでこうなるのかと、さまざまな疑問が湧いてくる。ひとつ、その説明を試みようと思うのが、哲学なのである。哲学は、人が思うほど深遠で高尚なものではない。ごく当たり前のことを考察するものであって、誰もが一種の哲学的な考えを持っているのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "天には日月星辰が、萬古に變幻し、東西南北に出沒して窮極する所がない。地には河海山嶽が、或は奔流し、或は起伏して居る。人はその間に生れ或は社會をなし、或は國家をなして居る。萬象實に複雜である。而して此の間に君臣父子の關係の生ずる所以、夫婦昆弟の關係の生ずる所以、その他、禽獸の活動する所以、魚鼈の游泳する所以、且に之れと應接し、夕に之れと進退するも、一念の注意至るなければ、何等の奇なく、何等の妙もないが一たび想を彼れに走せ、退いて深く自ら省みて見ると云ふと、一體何う云ふ譯でかう云ふ樣になるのであるかと云ふやうな、色々の疑問が起つて來る。ひとつ此の解釋をして見やうと思ふのが即.ち哲學なのである。哲學と云ふものは、人の思ふ通りそんなに深遠高尙のものでなく、當り前のことの考察であつて、何人でも一種の哲學觀は有して居るのである。"
    "description_ja": "指定OCR列の原形。原画像で読解してsource_textを補正。"
- "id": "st-0017-002"
  "section_id": "chapter-01-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それから一方から見ると、我々は生れつき物を知りたいと云ふ考がある。物を究めて見たいと思ふ。解らない事でもあると奧齒に物が挿まつて居る樣な氣持がするものである。假令ば新聞に何か解らないものがあると字引を引くとか人に聞いて見るとかして見る、「オイ君此間新聞に斯ういふことがあつたが、ありや何だ」とすぐに聞いて見る。子供が「お父さんありや何だ、これは何だ」と矢鱈に物を聞く。これは皆物を知り度いからである。支那の朱熹と云ふ人。此の人が、四つの時に天を指し、父に向つて「これは何だ」と云ふ、父が「天だ」と云ふと「天の上には何物があるか」と聞いた。すると父は「奇妙なことを問ふ子だ」といふたといふことがある。凡べて人と云ふものは、以上述べたやうな山川草木の存在する根元、禽獸蟲魚の存在する所以、其の原因を知りたがるものである。我々は親に孝行をしなければならぬ、君には忠節を盡さねばならぬこれは當り前であるが、何故に親には孝行、君には忠節を盡さねばならぬかと云ふことを究めたがる。かう云ふ工合に天地萬象について驚異の念を起し、その然る所以を知らんとする考を生じ、夫れで始めて研究して見る氣になる。これは斯うとかあゝとか自ら說明が出來るか。又は說明してくれる人があれば始めて滿足する。かくて我々は哲學に這入つて行くのである。だからアリストテレースは、「古今を通じて人は驚異によりて、哲學に志すものだ」と云つて居るのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"

- "id": "st-0023-001"
  "section_id": "chapter-01-section-05"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "そこで哲學と云ふものは、科學で以つて研究せられた、もろもろの原理原則を材料として、世界人生の根本原理を考究せんとする所のものである。で、ヴントは「哲學は特殊科學によりて與へられた一般の知識を少しも矛盾しないやうに一つの體系に組織した科學で、古今東西に施してもとらない所のものだ」と云つて居る。シヂウィックと云ふ人もコンナことを云つて居る。即ち「哲學と云ふものは、色々の科學や、色々の秩序系統ある思想の原理、方法及び重要な結論を共に比較したり、考究したりして、出來る丈け高等な統一の組織を得やうとする研究である」と云つて居る。要するに一言で云へば、哲學は宇宙や人生に於ける根本原理の研究に外ならないのである。"

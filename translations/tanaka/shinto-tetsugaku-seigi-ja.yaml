  "translation_ja": "いま、宗教というものを、世に成立している宗教、つまり仏教やキリスト教のようなものを標準として考えてみる。そうすれば、まず、仏教とキリスト教が共通して持つ特色を調べなければならない。調べてみると、これらには、まず信仰の対象がある。キリスト教では神、仏教では仏と呼ぶが、仏と神という名は、日本語でそのように区別しているのであり、また、それぞれの国の言葉が違うため、ゴッド、ブッダという。これは、英語とインドの言語という言葉の違いで、どちらも英語でいえばゴッドであり、日本語に訳せば神である。ただ通常は、ゴッドを神と訳し、ブッダは訳さず、原語のまま、仏、またはホトケといい、訳せば「覚」、あるいは「覚者」となる、というだけなのである。さて、その対象である神は、どのようなものか。ともかく人格的なものであり、しかも主なものは、歴史上の存在ではなく、想像上のものである。キリスト教のゴッドは、この世に現れ、生活していたものではない。また、仏教の仏にも、釈迦のように浄梵王の太子だったというものもあるが、わが国の仏教徒の多くが信じる阿弥陀は、一種の想像上の存在である。そのほか、薬師や観世音などは、みな想像上のものと思われる。釈迦以前には過去七仏があったといわれるが、それも想像にすぎないように思われる。そのように、想像上の神を描き、その神が来世を支配すると考えることが、共通の特徴である。キリスト教の神は天国にあって天国を支配し、仏教の阿弥陀は十万億土のかなたにあって極楽の主である、と考える。この現世を、きわめて劣ったものと見て、来世を理想の世界とするのである。だから、この現世を表すには、穢れた世、汚い世など、さまざまな嫌な言葉を使い、厭世的な観念を鼓吹する。そして、来世の天国を、光栄ある世界、理想の世界と説く。したがって、この世で多くの子を産み、多くの財産を作り、世俗の中で盛んに活動することを、大いに排斥するのである。キリスト教では、富める者が天国に生まれるのは、ラクダが針の穴を通るより難しいという。また仏教でも、金銀財宝をどれほど多く積み上げても、臨終のときに何の役に立つのかという。つまり、この汚れた世を早く捨て、彼岸に至ることを理想とする。そのために教会で祈り、寺院に参詣する。そうしたことは、みな、いわゆる後生を大事にするという観念から生じる。その結果、キリスト教などでは、この世の父の命には従わなくても、天の父の命に従えばよい、この世の君主の命には従わなくても、天の主に従えばよい、と教える。また仏教でも、この世の父の命に背いても差し支えない。十分に悟りを得れば、それが大きな孝行だという。だから仏教の始祖、釈迦は、父の浄梵王が、どれほど出家を思いとどまるよう命じても、その命令に従わなかった。ひどいことには、浄梵王が、山の中では、さぞ食べ物に不自由しているだろうと、食べ物や衣服をたくさん持たせてやると、釈迦は、すぐに父のもとへ突き返した。平田篤胤は、これを突き返したのは、あまりにひどい、たとえ自分が食べないとしても、川に捨ててもよいから、親の思いを受けて、「頂戴しました」と伝えればよいではないか、といっている。このように仏教では、家を捨て、妻を捨て、親を捨て、子を捨て、あらゆるものを捨て、山の中へ入っていくのを、最も優れた修行のようにしている。こう見てくると、仏教もキリスト教も、国境というものを、ほとんど認めないのである。したがって、国家というものも、ほとんど認めない。そこが、これらの世界宗教たるゆえんであり、また世界のどの国でも布教できるゆえんである。つまり、世界の人々を基礎に立てた教えであり、ある一国の教えとして作られたのではない。そこで、教えが起こった本国のインドが滅びても、ユダヤが滅びても、少しも構わない。私たちから見れば、何とも情けなく、気の毒に思われる。わが神道では、本国が滅びるのを見るなどということは、夢にも我慢できない。世間では、宗教の実例を求めると、すぐ仏教やキリスト教を挙げる。宗教が、いま述べたような特色を持つ仏教やキリスト教に限られるなら、神道は決して宗教ではない。神道は、来世にそのような想像上の神が存在するとは説かないのである。もちろん例外はある。神道でも多少は来世を説くものがあるが、反対に仏教やキリスト教にも、必ずしも来世を説かず、現世を主として教えを立てるものがある。今日のキリスト教には、神は決してそのような想像上の神ではなく、宇宙の根本原理を神といい、神は道理である、などというものもある。また仏教にも、仏教は世間から離れたものではなく、この現実の社会で、時々刻々に活用できる宗教であり、現実の社会から離れない、と説くものもある。しかし、これらは、いずれも例外と見るべきである。仏教とキリスト教は、一般にいえば、来世を重んじているように思われる。神道は来世をいわず、どこまでも現世を主とする。また仏教には、きわめて陰鬱な気分が漂っている。もちろん宗派が多いから、すべてがそうとはいえないが、全体として見れば、どうも陰鬱な気分があり、厭世的な傾向がある。キリスト教もそうである。もちろん今日のキリスト教を、全面的に厭世的とはいえないが、もともとのキリスト教には、そのような傾向がある。そのためローマ時代には、財産をすべて手放し、山中で隠遁生活をした者が多かった。フランスあたりの学校では、寄宿舎を設け、この世との交わりを絶つようなことをしていたのである。それに対して、神道は生命を生み続ける主義であり、どこまでも多くの子を産み、社会で活発に活動する主義である。仏教やキリスト教でも結婚はするが、教え全体からいえば、結婚すべきではない、結婚してはならない、という立て方である。いわゆる聖僧は結婚せず、優れたキリスト教徒も結婚しない。結婚しないことが、非常に優れているとされる。彼らの理想は、すべての人を優れたものにすることでなければならない。仏教とキリスト教の道は、人々を優れた仏教徒、優れたキリスト教徒にすることを理想とするのだと思う。ところが、そうなれば子供がいなくなる。もっとも、モルモン主義には多くの子供があるが、モルモン主義は、多くのキリスト教徒から認められていない。このように、優れた仏教徒、キリスト教徒は結婚せず、子孫もないのだから、社会の人がみな、そうした信徒になれば、子孫は絶えてしまう。そして国は滅びる。それは神道では、大いに禁じるところである。神道は生命を生み続ける主義である。だから正しく結婚し、正しく子孫の繁栄を図り、家を振興し、さらに国家を振興するのが、神道の主義である。ただし、そのために品性を卑しくすることは、大いに戒めている。また、キリスト教も仏教も、きわめて排他的である。キリスト教は、ほかの者を異端として排斥する。仏教も同じで、たとえば日蓮宗は、真言は国を滅ぼし、律は国の賊、念仏は無間地獄に落ち、禅は天魔の教えである、などといって、激しくほかを排斥する。しかし、神道はそのようなことをしない。もちろん神道の中にも、排他的な傾向を持つものは多少あるが、神道はもともと包括的である。仏教でもキリスト教でも何でもよい。それが神道と調和し、神道に反対しなければ、神道の中に取り入れていく。すると、世間の人は、それこそ神道に定まったものがない証拠だという。しかし、それは定まったものがない証拠ではなく、神道が非常に大きな道であることを示す証拠である。もちろん神道にも、仏教やキリスト教を攻撃するものはある。しかし、誤っている点を攻撃するのであって、決してこれらを受け入れないのではない。欠点を改めてくれば、神道はすぐ受け入れる。いわゆる信教の自由は、神道の聖典ともいうべき憲法で認められている。仏教はわが国に入ってきたが、原始仏教は、わが神道と大いに矛盾し、衝突した。神道は、その改革を促したのである。仏教は、それに促されて改め、その結果、原始仏教は、ほとんど跡を絶った。今日の仏教の多くは、日本的な仏教である。まず、妻を持ち、肉を食べる浄土真宗のようなものは、ほかでは、ほとんど見られない。ほかの仏教から見れば、おかしなものである。それは神道化したのであって、その結果、日本にこのように受け入れられている。かつて神棚のことなどで問題になったが、あれは当時の本願寺の当局者が狭量だったのである。本願寺は代々、皇室と密接な血縁があり、比較的よく神道の本旨を奉じている。そのため、日本で命脈を保てている。神道化してくれば、仏教も、神道はどんどん受け入れる。だから、キリスト教も神道化してくれば、どんどん受け入れられる。つまり神道は、仏教やキリスト教のように、極端に排他的ではない。また、キリスト教は反政府的であり、政治に反抗する傾向を持つ。世間ではよく、キリスト教に「侵略教」という言葉を当てている。ヨーロッパでは、ルター派の新教などは、当局に激しく反抗し、国家に大きな争乱を起こし、宗教戦争という悲惨な戦争をした。そもそも宗教戦争というものは、言葉からして、はなはだ矛盾している。宗教は敵を愛せよというのに、戦争をするのは、はなはだ矛盾している。ところが、至る所で国家に反抗する。これらには反政治的な傾向がある。しかし神道には、そのようなことはない。神道は、わが国家の政治そのものである。政治すなわち神道というのである。このような違いが、神道とほかの宗教にはある。さまざまな面で異なるのだから、もし宗教を、今日成立している宗教に限り、仏教とキリスト教を代表とするならば、神道は断じて宗教ではない、という結論になるのである。"

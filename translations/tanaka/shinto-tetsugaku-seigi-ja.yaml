  "source_text": "道德と云ふことは、今日一般には一つの言葉になつて居る。けれども、併しそれを研究して見るのには、道と德とに分つて見た方が宜いのである。道のことは、前に詳しく述べて置いたから、茲には德と云ふ方に就いて先づ少しく述べて見やう。德の字は元來悳に作られたものである。『說文』には、「悳、外、人に得、內、己に得る也。直、心に从ふ」と書いてある。今其の義を按ずるに、己れ先づ行ふて得る所あり、然る後之れを人に及ぼすを謂へるのである。已に行ふて內に得ることがあらうとするには、心が素より廉直でなくてはならない。そこでその字が直と心との會意よりできたものである。そして『禮記』などには「德は得なり」と解釋してある、要するに音相通じ、義亦頗る近いもので解釋したのであるが、最も適切なる解釋で、能く當つて居る。得の字は、『說文』には、「得、行いて取る所ある也」と解してある。此の字で德を解すのであるから、德も亦『禮記』には、「德は身に得る也」として居る。然るに我が國の學者伊藤仁齋は、「德は仁義禮智の總名」と『語孟字義』と云ふ本に書いて居る。從つて仁齋は『禮記』の「德は得也」の解を以つて音の近きものを假りて其の義を發して居るが、本、正訓でないと斷言して居る。が、德の解釋は得がよいやうである。荻生徂徠の如きは、やはり之れに左袒して居る。彼れは『辨名』と云ふ本で、「德は得であつて、人各〻道に得る所あるを謂ふ」と書いて居る。德の意義は要するに徂徠の說の如く、人々道を行ふて、其の上に於いて自ら得る所のものを云ふのである。從つて精神と身體とは、必ずしも問ふ所でないのである。西洋でも德の字を解して多く意志の習慣として居るが、かう云つても適切である。詰り德は得であつて吾々が道を常に行ふて得た所のもの、即ち習慣と言ふものである。で、德が出來ると云ふと、それから後は吾々が道を行はふと云ふ考がないでも、自ら道を行ふことが出來るやうになつて來る。それを有德の人と言ふ。神道に於いてもその通りで、神の道を日々刻々に行つて行くと、其の習慣が附く。品性を得ることが出來る。それを有德家と言ふのである。有德家は、敢へて道を行はんと苦心せずともその言動自ら道に合ふのである。かゝる人は眞の神なのである。"

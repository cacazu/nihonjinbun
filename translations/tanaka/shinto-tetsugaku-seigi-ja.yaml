- "id": "st-0134-001"
  "section_id": "chapter-12-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "此の主張は、慥に一理あるやうで、輕卒に考へると成程と感心するやうであるが、退いて深く考へて見ると、一の謬見が、その根柢に潜んで居ることが認めらるるのである。元來、右の種類の人から見ると、我が歷史上には、幾多の歸化人があつて、それが幾多重要な役柄を演じて居つて、そしてそれが澤山我々の祖先になつて居る。だから同一民族、同一血族などゝ云ふことが面白くないのであると云ふのが、その思想の出發點のやうに思はれる。勿論已に述べた新羅人の子孫に田道間守ありて。三宅連の祖となり、支那人の阿知使臣は、履仲天皇に仕へて藏人となり、子孫坂上田村麿に至りて征夷大將軍となり、功勳一世に冠たりしは、有名な事實である。けれどもかゝるは大和民族たるに差支へないのである。個人の家にても養子と云ふことをする、養子は、我が國の系圖では實子と殆んど區別ないのである。大和民族と云ふ大きな家族が、歸化人を養子にしたのである。大和民族に同化せしめたのである。大和民族の骨となり肉とならしめたのである。骨肉の親は同一血族である.斷じて歸化人を客分としたのでない。亞米利加の獨逸種が、いつまでも獨逸種として、亞米利加人となりながら、獨逸語を練習し、一朝獨逸の急あるや、百方獨逸の爲に盡すと云ふのとは、同日に云はれない。我が民族は、歸化人を骨肉化せしめなくては止まないのである。此れと同樣に、新領土の朝鮮人でも、臺灣人でも、勿論急速には行かないが、永年の內には、之れを大和民族に包容し、全然、同化し去つて之れを同一血族として仕舞はなくてはならないのである。將來、我が帝國が、どんなに發展しても、此の建國以來の國是は變更さるべきでないのである。印度を征服されたる英吉利王は、印度皇帝となつて、印度國民を、印度國民として統治せられて居るやうである。けれども我が大和民族は、熊襲を包容し、蝦夷を包容し、而かも殆んど之れが何等の根跡を今日に殘さないのである。露西亞や、墺地利匈牙利のやうに、いつまでも殆んど永久的に人種の爭の絕えないのは、我が民族の取る所でないのである。我が大和民族は、どこまでも我が勢力の下に歸するものを同化して、大和民族たるの光榮に浴せしめなくては止まないのである。我が神道治下の國民たらしめなくては止まないのである。英吉利の印度に臨むが如き態度を以つて、我が勢力に歸するものに臨まばたとひ、急速に國力の發展を見ても、いつかは、恰も歷山大王の國家、羅馬の帝國の如き運命に際會するは、見易きの道理である。而してかゝるは斷じて我が帝國の建國以來の國是でないのである。此の故に、吾輩は、今日の時勢に於いて、殊に露西亞の失敗の歷史などを眼前に、見せつけらるゝ時勢に於いて、痛切に祖先崇敬の觀念の益〻徹底を計るの必要を認むるのである。"

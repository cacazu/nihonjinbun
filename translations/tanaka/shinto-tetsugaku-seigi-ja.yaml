  "source_text": "でその道は、何と云ふかと云へば卽ち、惟神の道と云ふのである。「隨神の道」とも書くのである。此の我が國の昔の道を神道、又は神の道と云ふやうになつたのは何時頃であるかと云ふと、『書紀』には用明天皇の時に「天皇佛法を信じ、神道を尊ぶ」と錄せられて居る。併し此の文字は『鹽尻』と云ふ本に「神道の字我が帝紀を考ふるに佛法に對して云へるのみ、後の世の如くこと〴〵しく秘訣とするが如きに非ず」と書いてある通り、決して眞の神道の意に用ひられたのではない。篤胤も亦『書紀』の此の神道の文字を解して「神を祭つたり、神を禱つたり、又祓などの類總べて神に仕へまつる事をひろく申したもので所謂神事の事でござる。尤もこの神事も云ひもて行けば神道の事ながら事と道とは幹と枝葉の如くで、右申たる神ながらの道とは、大きに本來の差別あることでござる。佛法と相對して神道とあればとて、後世の神學者などの云ふ如く、教の事ぢやと心得るは非で、御座る。唯、此に所謂神道とは、用明天皇は佛法を御信じ遊ばしたけれども、神事のことも疎には遊ばされなんだと云ふ意に輕く見るが宜しいで御座る。」と云ふ風に云つて居る。で、此の時の神道と云ふのは、詰り神道の儀式的方面に名けたもので、根本的內容の意味に使はれたものではないやうである。さう云ふやうな儀式的方面は、智識の幼稚な國民の感情の要求を滿足させることは出來るけれども、人の智識が段々發達して來ると云ふと、唯神の前に行つて御祭りをしたり祓をしたりするやうな事だけでは十分なる滿足は出來ないやうになる。佛教に就いて見ても佛教は一方に於いては、金色燦爛たる佛像を作つたり、豊富なる御供物を備へたり、金襴、緞子の袈裟、衣を着けたり、勿體らしく自らも解し得ないやうな御經を讀んだり、色々な儀式をするけれども、佛教があれだけのものであつたならば、佛教と云ふものは到底今日まで命脈を保つことは出來ない。又今日のやうに擴がることは出來ない。所が佛教は他方に於いて多くの人に、感心せしむるやうな色々の教理と云ふものを有つて居る。それで以つてあゝ云ふ工合に今日までその命脈を維持し、あんなに世界の各地に擴がる事が出來たのである。神道も唯、御祭りをするとか、祓をするとか、禊をするとか云ふ位な外面的のことだけでは、とても十分に後世の國民に滿足を與ふることが出來ない。そこで以つて佛教や儒教と同じやうに、我が國の固有の大道を理論的方面から說明して欲しいと云ふことになつて來る。佛教の幾千卷の經文も要するに、その骨髓根本となつて居る眞如、涅槃の說明に過ぎない。或は之れを體現する方法を示したに過ぎないと云へる。神道の骨髓根本、即ち私の上來說いて來たやうな所のものを、十分に理論的方面から說明したものを要求するやうになつて來る。此の潮流に乘じて叡山を開いた所の傳教大師最澄門下のものは、山王一實神道と云ふものを起した。此の山王一實神道と云ふのは、多少神道の學理的方面に觸れて居るのである。けれどももと〳〵佛教の教理を基礎としたものであつて、決して固有の大道を發揮することは出來ない。今日から見ると矢張り篤胤の所謂神事の意味の外にあまり出て居らないのである。最澄の一派と略、同時に弘法大師空海の一派が隆盛を極めた。一體弘法大師と云ふ人は、今日大師と云へば澤山あるにも係らず、直に弘法大師とせらるゝ位に博學宏才で能く事理の幽に徹して居つて當時に於ける一大人物であつたのであるから、その布教の上に神道を利用することの如何に便宜多いかと云ふことを悟つたものと思はれる。從つて最澄以上に此の點に考慮を廻らすことが多かつたらしい。そしてその門下に所謂濟々たる多士で、此れ等の人物が集つて茲に兩部習合神道と云ものを作り上げたのである。併し此の兩部習合神道も、林羅山が評して「佛法を以つて神道に合し、胎藏金剛兩界を以つて陰陽に合す遂に以つて神佛本地一體と爲す」と云ふ說を立てたやうに、根本的の方面は佛教から成つて居る。それから後卜部一派殊に兼倶と云ふ人などは、斯う云ふ佛教的神道に滿足しないで、新たに神道を起して唯一神道と云ふものを立てたけれども、矢張り是れも佛教的神道たるを免れない。いつまでも〳〵神道は佛教の教義より離るゝことが出來なかつた。そこで世人も敢へて之れを怪まなかつた。卜部兼右の編と云ふ『神道根源』などには、「神道は佛法已前より有之、然に佛法渡て見合すれば、自と同じ物なる故に、引合て得心也」と云ふやうな次第であつた。"

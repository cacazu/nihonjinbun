  - "kind": "ocr"
    "text": "今若し宗〓と云ふものを。世の成立宗〓、卽ち佛〓や基督〓と云ふやうなものを標準として見る。さうして見ると先づ佛〓や基督〓の通有して居る所の特色を調べて見なければならぬ。之れを調ぶるに、彼れ等は先づ其の信仰して居る所の對象と云ふものを有つて居る。其の對象と云ふものが、基督〓では神と言ひ、佛〓では佛と云ふけれども、佛と言ひ神と言ふ名前は、日本語でさう云ふ區別をするのであつて、又彼れ等の國の言葉が違ふので、ゴツドと言ひブツダと言ふ。是れは英語とか印度語とか言語の上の差で、何れも英語で云へばゴツドである。どちらも和譯すれば神である。唯、通常ゴツドは譯して神と云ひ、ブツダは輝ないで原語のまこに佛又はキトク譯すれば盛載は受者となそこ過ぎないのである。さてその對象たる神はどう云ふものかと見ると、それは兎に角人格的である。さうして又それが、其の主なるものは歷史的のものでなくして詰り想像的のものである。基督〓のゴツドと云ふものは、何も此の世に出て生活をして居つたと云ふものではない.又佛〓の佛にしても、或る種の者は釋迦の如く、淨梵王の太子であつたと言ふのである。けれども、併し我が國の佛〓徒の多くが信じて居る所の阿彌陀と云ふものは一種の想像的のものである。其の他藥師と云ひ、觀世音と云ふ樣なものは皆想像的のもののやうに思はれる。釋迦より以前に過去七佛と云ふものがあつたと云ふのであるが、それなども想像に過ぎないやうに思はれる。さう云ふ風に想像的の神を描いて、それが未來と云ふものを支配して居ると云ふのが通有性である。基督〓の神は天國にあつて天國を支配して居つて、佛〓の阿彌陀は十萬億土に居つて極樂の主と云ふ風に考へるのである。此の現世界と云ふものを、極めて劣等なものに見て、未來を理想的の世界とするのである。で此の現世界を示すには穢れた世とか、汚き世とか、種々樣々に嫌な言葉を以つて、厭世的觀念を鼓吹し、さうして未來の天國と云ふものを光榮ある世界、理想的の世界と云ふ風に說くのである。隨つて此の世に於いて澤山子供を產んで、財產を澤山作つて、さうして、世俗的に盛に活動することは、彼れ等に於いは大いに排斥するのである。されば基督〓では富める者の天國に生れるのは駱駝が針の孔を通るよりも難かしいと言ふて居る。又佛〓などでも金銀財寶如何に澤山積み立てたとても、臨終の際に何の役に立つかと言ふのである。詰り此の汚れた世を早く捨てゝさうして彼岸に到ることを理想とするのである。隨つて〓會にて祈禱もするし、寺院に參詣もする。さう云ふやうなことは皆所謂後生大事と云ふ觀念から來るのである。その結果として基督〓などに於いては此の世の父の命に從はないでも、天の父の命に從へば宜しい。此の世の君の命には從はないでも天の主に從へば宜しい。斯う云ふ風に〓へるのである。又佛〓などに於いても此の世の父の命には背いても差支ない。佛果を十分に得れば、それが大いなる孝行であると言ふのである。であるから佛〓の始祖釋迦は父の淨梵王からして如何に出家を思ひ止まるやうにと云ふ命令があつても、其の命令に應じなかつた。甚だしきに至つては、淨梵王が山の中に居つて嘸食物に不自由であらうと云ふので食物や衣服などを澤山釋迦の所へ持たしてやつたら、釋迦は之れを直に父の所へ突き返へした。平田篤胤は、どうも之れを突き返したのは餘りにひどい。假令自分が食はないとしたらば、川の中へ捨てゝも宜いから、親の志をうけ、頂戴しましたと云つてやつたら宜いぢやないかと云つて居る。か樣に佛〓では家を捨て妻を捨て親を捨て子を捨て有ゆる物を捨てゝ、さうして山の中へ這入つて行くのが最も偉い行のやうにして居るのである。詰り斯う云ふ風に見て見ると云ふと、佛〓にしても、基督〓にしても、何れも國境と云ふ樣なものは、殆んど認めないのである。從つて國家と云ふ者を殆んど認めない。そこが彼れ等の世界〓たる所以で、又世界の何れの國へ行つても布〓せらるゝ所以である。詰り世界の人種といふ者を本に置いて立てた所の〓である。或る一つの國家の〓として作つた者ではない、そこで立〓の本國たる印度が亡びても、猶太が滅びても、一切おかまひなしである。我々から見ると如何にも情けない。氣の毒に思はれる。我が神道では本國の亡ぶるのを見ると云ふやうな事は、夢にも我慢はできない。世間では宗〓と云ふものゝ實例を求めると云ふと直に佛〓を擧げ、基督〓を擧げる。で宗〓が今言ふたやうな特色を有つて居る所の佛〓や基督〓に限られて居るものとしたならば、神道は決して宗〓でないのである。神道は未來に於いてさう云ふやうな想像的の神の存在を說かないのである。勿論例外はある。神道に於いても、多少未來を說くのもあるが其の代り又佛〓や、基督〓に於いても必ずしも未來を說かないで、現在を主として、其の說を立して居るのもある。今日の基督〓では或は、基督〓の神と云ふものは決してそんな想像的の神でないのである。宇宙の根本原理を神と言ふのである。神は道理であるなどゝ言ふのがある。又佛〓にても、佛〓は世間を離れたものではない。此の現社會に於いて時々刻々に活用の出來る所の宗〓である。現社會を離れるものではないと說くものもある。が併しそれは何れも例外と見るべきである。佛〓、基督〓は、一般から云へば未來に重きを置いて居るやうに思はれる。神道は、來世は言はないのである。何處までも現世を主とするのである。そして佛〓には極めて陰欝の氣が漂うて居る。勿論佛〓も澤山宗派があるから、悉くはさうと云へないが、大體から言うて見ると、どうも陰欝の氣が漂うて居る。厭世的と云ふ風な傾向がある。又基督〓もさうである。勿論今日の基督〓は絕對に厭世的とも言へないが、併し元來の基督〓にはさう云ふ傾向がある。であるから羅馬時代に於いては財產などは皆無くして山の中へ隱遁的生活をした者が澤山あつた。佛蘭西あたりの學校では寄宿舍を設けて此の世との交通を絕つと云ふやうなことをして居つたのである。それから又神道は生々主義である。何處までも子供を澤山產み活潑に社會に活動すると云ふ主義である。佛〓や、基督〓の方では、結婚をするけれども、一體から言へば結婚すべきではない。結婚してはならない〓への立て方である所謂聖僧と云ふやうな者は結婚しない.基督〓の偉い〓徒と云ふ者は結婚しない。結婚しないのが非常に偉いとなつて居る。皆總べての人を偉くすると云ふのが彼れ等の理想でなくてはならぬ。佛〓や基督〓の道と云ふものは偉い佛〓徒、偉い基督〓徒にするのが彼れ等の理想であらうと思ふ。偉い基督〓徒や偉い佛〓徒になつて來ると子供は無いから、尤もモルモン主義には子供が澤山あるけれども、モルモン主義は、多數の基督〓徒からは是認せられて居らない。かう云ふ次第で偉い佛〓徒、偉い基督〓徒は、結婚せず、子孫もないのであるから社會の人が皆偉い佛〓徒、偉い基督〓徒になつて來ると、子孫の種は絕えてしまふ。そこで國は滅びてしまふ。それが神道には大禁物である。神道は生々主義である。であるから正當に結婚し、正當に子孫の繁榮を計り、一家を振興し、進んで國家を振興すると云ふのが神道の主義である。けれどもそれが爲に品性を野卑にすると云ふやうなことは大いに戒めて居るのである。それから、此の基督〓にしても佛〓にしても極めて排他的である。基督〓で見ると云ふと、他の者を異端として排斥する。佛〓でも其の通りで、例へば日蓮宗の如きは眞言亡國、律國賊、念佛無間、禪天魔等と云つて非常に他を排示する。けれども神道はさう云ふ事をしない。尤も中には神道にも排他的の傾向を有つて居るものも多少あるけれども神道は元來が包括的である。佛〓でも基督〓でも何でも構はない。彼れ等が神道に調和して來て、神道に反對して來なければ、之れを神道の中へ入れてゆくと云ふ風である。さうするとそこが神道に固定したものがない證據だと世間の人は言ふけれども、併しそれは、固定したものがない證據でなくして、神道が非常に大いなる道であることを示す證據である。勿論神道の中にも隨分佛〓や基督〓を攻擊するのがある。併しそれは彼れ等の間違つて居ることを攻擊するのであつて、決して彼れ等を容れないのではない。彼れ等の短所を改めて來れば神道は、直に之れを容れるのである。所謂信〓の自由は、神道の聖典とも云ふべき憲法に於いて是認してあるのである。で佛〓の如きは、我が國に這入つて來たのである。這入つて來たのであるが併し、原始佛〓は我が神道と非常に矛盾し非常に撞着して居る。神道は是れが改革を促したのである。佛〓は此の神道に促がされて、之れを改めた。かくて原始佛〓は殆んど跡を絕つたのである、今日の佛〓は多くは日本的の佛〓である。第一妻をもち肉を食ふと云ふ樣な淨土眞宗の如きものは、他に殆んど見る事の出來ないのである。外の佛〓から見ると可笑しなものである。それは神道化したのであつて、其の結果日本に斯くの如く容れられて居るのである。甞て、神棚の事などで問題になつたが、あれは本願寺の當時の當局が狹量なので、歷代本願寺は皇室に密接な血緣を有し、比較的に神道の本旨を奉じて居るのである。それで我が日本に命脈を保ち得て居るのである。神道化して來れば佛〓でもズン〓〓神道は容れるのである。であるから基督〓でも又、神道化して來ればズン〓〓容れることが出來る。即ち神道は佛〓や基督〓の如く極端なる排他的でないのである。それから基督〓の如きは反政府的である。政治に反抗する傾向を有つて居る。世間では能く基督〓に侵略〓と云ふやうな文字を當てゝ居る。歐羅巴などに於いてはルーテル新〓などは、當局者に最も反抗して國家に非常なる爭亂を惹起し、宗〓戰爭と云ふ悲慘な戰爭をした。一體宗〓戰爭と云ふものは言葉からして頗る矛盾である。宗〓と云ふものは、敵を愛せよと云ふのである。然るに戰爭をすると云ふことは甚だ矛盾である。然るに到る處國家に反抗する。彼れ等は反政治的の傾向を有つて居る。所が神道はさう云ふことはない。神道は我が國家の政治そのものである。政治即ち神道と云ふのである。さう云ふやうな相違が神道と他の宗〓とには在る。神道と宗〓とはかく色々の方面に於いて異つて居るから、若し宗〓と云ふものを今日の成立宗〓に限つて、而して佛〓や基督〓を以つて其の代表者とするならば、神道は斷じて宗〓ではない。斯う云ふ結論が出來るのである。"

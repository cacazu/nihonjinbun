  "translation_ja": "そこで私は、次の説を主張しようと思う。すなわち、古伝のいちばん初めに現れる高皇産霊神と、その後に現れる、別名を高木神という高皇産霊神とは、まったく別の神だと見るのである。天照大神の時代に働いた高皇産霊神は、実際に人の身体を持ち、多くの子である神々を持った、当時の大政治家だった。その勢力が非常に大きかったため、天照大神の徳が広大だったことから、後世、日の神とし、太陽そのもののように解釈するようになったのと同じように、高皇産霊神も、その徳が広大だったため、その名をそのまま宇宙の根本の神に捧げたのである。つまり、天御中主神の徳を二つに分け、一方の徳に高皇産霊神の名を、他方には、それと対になる神皇産霊神の名を捧げたと解釈する。古伝に高皇産霊神が二通りに現れるが、前と後では、まったく別の神だというのだ。こうして私は、高皇産霊神・神皇産霊神は、天御中主神と一体の神であると主張したいのである。"
  "translation_status": "reviewed"
- "id": "st-0051-001"
  "section_id": "chapter-04-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "斯う云ふと基督教などで云ふ所の三位一體と云ふ說と似て居るぢやないかと云ふやうな議論も起るかも知れぬ。けれども、基督教の三位一體と云ふのは、神と神の子とそれから精靈と云ふものが同一であると云ふてあぶなく多神教たるを免れた說なので、私の此の主張とは大變に違ふのである。それではどう云ふ風に此の三神が一體であると云ふことを說くかと云ふにその說は、ちよつと支那學の說に比較するとよく理解るやうである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 50
    "url": "https://dl.ndl.go.jp/pid/943657/1/51"
  "translation_ja": "こう言うと、キリスト教などでいう三位一体説に似ているではないか、という議論が起こるかもしれない。しかし、キリスト教の三位一体は、神と神の子と聖霊が同一だと言うことで、かろうじて多神教であることを免れた説なので、私の主張とは大いに違う。では、どういう意味で三神は一体なのか。その説は、中国の学説と比べてみると、分かりやすいようである。"
  "translation_status": "reviewed"
  "source_variants":

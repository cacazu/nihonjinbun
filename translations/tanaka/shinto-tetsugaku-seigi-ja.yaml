- "id": "st-0038-001"
  "section_id": "chapter-02-section-06"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "けれども今日にては我が神道に於いては、さう云ふ古代の靑人草が信じて居つた樣なものを、神とするのではない。我が神道に於いて神とするのは、もつと合理的な神である。で若し『古事記』や『日本書紀』にさう云ふ動物等が神となつて居るならば、其のものは詰り或る神の神靈を表象するものであると解釋すれば差支なからうと思はれる。其の神靈を表象すると言ふのは、例へば西洋では死と云ふのに鎌を以て表象とし、望を示すに錨を以つてし、勇氣を示すに獅子を以つてし、狡猾を示すに狐を以つてし、謙遜を示すに鳩を以つてし、魂を示すに蝶々を以つてし、罪惡を示すに蛇を以つてすると云ふやうな事がある。矢張りさう云ふやうに解釋すれば差支なからうと思はれる。例へば稻荷神社には狐が必ず附いて居る。それは狐が稻荷神社ではなくして、狐は稻荷神社の御使である(別に理由もあるが)。或は稻荷神社の御愛獸である。斯う解釋して行けば差支なからうと思はれる。それは傳說の解釋の仕方である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 37
    "url": "https://dl.ndl.go.jp/pid/943657/1/38"
  "translation_ja": "しかし、今日の神道では、古代の人々が信じていたようなものを、そのまま神とするのではない。神道で神とするのは、もっと理にかなった神である。もし『古事記』や『日本書紀』で、そのような動物などが神となっているなら、それは、ある神の霊を象徴するものだと解釈すればよいと思う。神霊を象徴するというのは、たとえば西洋で、死を鎌で表し、希望を錨で、勇気を獅子で、ずる賢さを狐で、謙遜を鳩で、魂を蝶で、罪悪を蛇で表すようなことである。それと同じように解釈すれば、差し支えないだろう。たとえば、稲荷神社には必ず狐が伴うが、狐そのものが稲荷の神なのではなく、稲荷神社の使いなのである。別の理由もあるが、あるいは、その神に愛される獣である。このように解釈していけばよいと思う。これは、伝説をどう解釈するかということである。"
  "translation_status": "reviewed"

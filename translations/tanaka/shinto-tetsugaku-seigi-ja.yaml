  "translation_ja": "この島々を生んだということが、後世の神道学者の非常に迷っているところである。本居・平田両翁などは、徹頭徹尾、島そのものを生んだのだとしている。しかし著者は、決して島を生んだのではないと見る。この「生んだ」ということも、必ずしも後世の人が子供を生むように、二神が生んだのではないと思われる。なぜなら、このように都合よく、一つ一つ生むということも、たいへん疑わしいからである。もちろん、神のことは神秘的だと言えば、それまでだが、十分に研究の目で見ると、「生んだ」ということも、必ずしも後世と同じではないと思う。この島々とは、私は、それぞれの島を主宰する神々だとする。伊弉諾・伊弉冊二尊が天津神の詔を受け、この国を整え経営するに当たり、当時の多くの島々を、ことごとく一つ一つ自ら整え経営することは、到底できない。そこで、各島を主宰する神を、まず定められたと解釈できる。それが主宰の神であるという理由として、まず伊予之二名島について、篤胤は「いよいよ二つ並んだ島」という意味だと解釈している。そうした、二つに並んだ島なのである。現に四国は、そのような形をしている。その形に基づいて、主宰神の名を捧げたと思われる。また、伊予之二名島にも隠伎之三子島にも、みな「またの名」がある。その別名を見ると、「ひこ」や「ひめ」と呼ばれるものがある。また「わけ」という呼び名もある。たとえば、大倭豊秋津島の別名は、天御虚空豊秋津根別という。「わけ」は、宣長の解釈では「わが君、兄」という意味で、国造や稲置などの類、国々の各地にいて、その地方を治める人をいったものである。つまり、地方の長官を「わけ」という。そうすると、四国の長官を何々の別といい、九州の長官を何々の別というのである。このように「わけ」という名があることからも、大倭豊秋津島を天御虚空豊秋津根別というのは、その名の長官が、この島を治めたのだと見ればよい。また、「わけ」は、代々の皇子の名にも多い。孝霊天皇の皇子には日子刺肩別、開化天皇の皇子には建豊波豆羅和気という方がいる。垂仁天皇の皇子には、「わけ」の付く方が六人、景行天皇の皇子には二十三人いる。これによれば、伊弉諾・伊弉冊尊が定めた地方の長官に、比古・比売・和気と呼ばれる神々があるのは、不思議ではない。このような次第で、やはり主宰神を申し上げたものと思われる。そうすると今度は、神の名に島や国というのは、ずいぶんおかしい、隠岐島の別名を天之忍許呂別、筑紫国の別名を白日別と呼ぶのはおかしい、と聞こえるかもしれない。しかし後世にも、丹波守や丹後守などという例を見れば、あながちおかしくはない。著者の祖先には、田中淡路や田中丹波という者がいる。そのほか、松平伊予、浅野芸州など、国の名が名前になっている者は多い。また古伝を見ても、『古語拾遺』には、「生島は大八洲の御霊であり、今の生島の巫が祭っているものである」とあり、『旧事紀』にも同じ伝えがある。『神名式』にも、「神祇官の西院に鎮座する、生島の巫が祭る神、二座」とある。そして貞観元年正月、生島神と足島神に、ともに従四位上を授け、続く二月には正四位下を授けたという。これを見ても、神の名を島や国と申し上げても、不思議ではないことが分かる。だから、島々を生んだというのは、これらの島々を経営するに当たって、まず、その主宰神を定めたことをいったのであると考える。"

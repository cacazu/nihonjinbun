  "translation_ja": "しかし、私たちが考えるに、宗教は、仏教やキリスト教に限られない。では、宗教とはどのようなものか。セネカは、「宗教とは、神を知り、それに倣うものである」といい、カントは、「宗教とは、私たちの義務のすべてが、神の意志から出たものと認めることである」といい、ハクスリーは、「宗教とは、倫理的な理想を尊び、その理想を人生で実現しようと努める願いである」といっている。このように、宗教とは何かについて、学者の間には、さまざまな学説があって定まらない。そこで、おおよそのところをいえば、宗教とは、私たちが、自分たちより上のものと信じるものを対象とし、それを敬い、それに従って、日々の行動を営むものだと解釈できる。したがって、私たちより上のものを対象として敬い、心の安らぎを得、それに従って行動することが、いわゆる信仰なのである。信仰には、その対象を構成し、認識する知的な要素と、それによって心の安らぎを得る感情の要素と、それに従って行動する意志の要素が含まれている。その信仰の対象を作る部分を宗教的知識といい、後の部分を宗教的感情、意志といい、その全体を宗教的意識という。この宗教的意識は、どの国民も必ず持つものである。もちろん、文明が非常に進歩した国民では、その意識も進歩し、文明の進んでいない国民では、その意識も幼い。また、この意識は、各国民の特性によって色づけられて現れるから、国ごとにさまざまな違いを帯びる。しかし、どの国民も必ず宗教的意識を持つことは、さまざまな方面の事実から証明できる。この宗教的意識が作り出す宗教は、そのため、それぞれの国民や民族に適したものになる。したがって、その意識から作られる信仰の対象も、民族によって違う。ユダヤ人が信じるヤハウェは、やはり当時のユダヤ人の宗教的意識によって作られ、それに一致したものである。また、アラビア人の信じるアッラーという神は、アラビア人の宗教的意識に一致したものである。同じように、わが日本国民にも、その精神に最も適した宗教が、おのずと起こらざるをえない。そこで、古代の人々は、当時のきわめて偉大な方々であり、いわゆる国民的精神の精髄を体現し、その華を集めた方々である伊弉諾尊、伊弉冊尊、天照大神、大国主神などの神々を、当時の人々より上のものと認めた。これらを神とし、その神々に従い、神々の恵みによって、日々の行動を営んだのである。ところが、天照大神などの神々もまた、自分たちより上のものを認められた。それが、天御中主神、高皇産霊神、神皇産霊神などの神々である。これらは、天照大神など、当時の神々が、より上の神々とされたものである。こうした多くの神々に対して、わが国民の宗教的感情と意志は満足を得ていた。儒教や仏教が入る前には、このような純粋な宗教が、もっぱら国民の上から下まで行われていた。したがって、この神々の崇拝は、天照大神が神鏡を授けられたときの言葉や、皇孫を地上に下されたときに高皇産霊神が述べられた、神籬・磐境についての言葉によって、盛んに行われるようになった。そして、このような宗教的意識は、ますます養われてきた。"

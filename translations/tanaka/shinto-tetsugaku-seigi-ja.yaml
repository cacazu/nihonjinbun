  "translation_ja": "天照大神に続き、三貴子として月読尊・素盞鳴尊という重要な神々がおられたことは、すでに述べたとおりである。月読尊については、古伝があまり伝わっていないが、要するに、天照大神を補佐したと思われる。素盞鳴尊については、さまざまな古伝がある。また、その子の大国主神は、天下経営の事業に従事し、神道の各方面に大きな影響を残した。大国魂神として、また大神神、おおみわのかみ、として、神道の重要な神である。さらに、天津神の系統の神として、瓊々杵尊・武甕槌神・経津主神・天児屋命・天太玉命・天鈿女命など、多くの重要な神々がおられる。こうした神々を総称して、八百万神と申し上げる。そして天照大神の正統の神は、神日本磐余彦尊、すなわち神武天皇に至り、それ以後は、現人神として歴代の天皇に及ぶのである。これら神道の神々の中でも、特に重要な神々について詳しく講じるのは、きわめて必要なことだが、このような小冊子では、それはできない。"
  "translation_status": "reviewed"

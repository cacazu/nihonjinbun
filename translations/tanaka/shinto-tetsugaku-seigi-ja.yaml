  "source_text": "で、段々と斯う云ふ工合にして國土が發達して其の主神も發展して御居でになる。さうすると云ふと茲に第五代目の意富斗能地神大斗乃辨神の二神が御出になつた。此の意富斗能地、大斗乃辨と申すオホと云ふことは稱へる言葉である。美稱である。そして此の二柱神の御名は、彼の國となるべき所のものが段々凝り成つて來て國所の成れる所に、それに男女の尊稱を附けたいのである。斯う云ふ工合にして國土が段々と發展して來、又國土を經營統御遊ばす所の神も大いに發展して來られた。此の時に方つて御出になつた所の神が第六代の神である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 67
    "url": "https://dl.ndl.go.jp/pid/943657/1/68"
  "translation_ja": "このように国土は次第に発達し、その主神も発展していく。すると、第五代の意富斗能地神・大斗乃辨神の二神が現れた。この意富斗能地・大斗乃辨の「おほ」は、たたえる言葉、美称である。そして、この二神の名は、国となるものが次第に凝り固まって、国土が成り立ったところに、男女の尊称を付けただけである。このように国土は次第に発展し、国土を経営し統御する神も、大いに発展してきた。そのときに現れた神が、第六代の神である。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "で、段々と斯う云ふ工合にして國土が發達して其の主神も發展して御居でになる。ううすると云ふと姓に第五代目の窓宮斗能地神大才乃辨神の二神が出になつた。此の意當斗他地、大才万辨と申すオホと云ふことは稱へる言葉である。美稱である。そして此の二柱神の御名は、彼の國となるべき所のものが段々疑り受つて來て圖所の成れる所に、それにカ之の尊さを附けたいのである。斯う云ふ工合にして國土が段々と發展して來、又國土を經營統御遊ばす所の神も大いに發展して來られた。此の時に方つて御出になつた所の神が第六代の神である。"

  "translation_ja": "世間の学者には、ともすれば、神道は皇祖の勅命のままに天下を治める道であり、だから、その道を行うのは君主となる人の務めで、学問をする者の仕事ではない、と主張する者がいる。これは本居宣長などの主張でもあるが、そうした考えは、神道を狭い意味に解釈し、上に立つ者が下の者に臨む、さまざまな方法が、神の道なのだと捉えたものと思われる。そのように、神道を政治の道と見る人がいる。しかし、ある人は、神道は立派な宗教、偉大な宗教、すべての宗教を統一する大宗教だと主張する。また別の人は、神道を宗教などというのは、とんでもないことであり、神道は、わが国の国民道徳、一種の道徳にすぎない、と言う。道徳は、もともと人と人の関係を律するものであり、神道の神は、要するに人なのであって、キリスト教などでいう神とは意味が違う。だから神社へ行って神を拝んだからといって、それをもって神道を宗教と呼ぶのは、大きな誤解だと説き、神道を宗教とすることに強く反対する人もいる。こうした考えは、どれも一面の理を含んでいる。しかし、それだけで十分で、完全だというわけにはいかない。よく考えれば、上古の神聖たちが持っていた偉大な国民的精神のうち、秩序と統一を重んじる思想が現れて、ここに宇宙に比べるもののない国家ができ、政治の大道が発達したのである。また、その現世的で快活な感情が現れると、ここに生々主義、現世主義の偉大な宗教、つまり今日の歴史的宗教を超える偉大な宗教が生まれる。そして、発展し膨張する性格が現れると、剛健で質実な道徳が成り立つ。あの神器が、わが国に厳然と存在することは、結局、この政治・宗教・道徳の各方面を示したものと見てよいのである。この三つは、人間社会のあらゆる活動を含んでいる。私たちの活動は千差万別だが、詳しく見れば、政治の系統、宗教の系統、あるいは道徳の系統に属している。もちろん、そのほかに法律や経済もあるが、それらは政治の中に含められる。また、さまざまな生業を営み、一家を治め、家族を養うことも、政治の中に含められる。一家の政治、家政である。しかし、別の面から見れば、それは宗教や道徳にも関係している。このように、政治・宗教・道徳は、人生のあらゆる活動を含むことができる。さらに、教育の系統を加えることもできる。政治・宗教・道徳にわたる、さまざまな活動を行えるよう、後継の民族を育てる活動を、一つ分けて、この三つの外に置くこともできよう。しかし、これはむしろ、三大系統そのものを維持し発展させる、大きな方法と見ればよい。教育がなければ、三大系統は存在を失うのだから、やはり三大系統そのものと見ておく。要するに、神道は、この三大系統を含んでいる。だから実に広大であり、無限である。国民の言動や行動の規範となり、根底となるものは、すべて神道の中に含まれる。そこで、神道の内容を、さらに十分に明らかにするためには、この三大系統を、一つずつ述べていく必要があるのである。"

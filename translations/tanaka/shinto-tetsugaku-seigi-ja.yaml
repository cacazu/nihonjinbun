- "id": "st-0021-002"
  "section_id": "chapter-01-section-04"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "斯ういふ工合になるやうである。然ういふ釋で傳說と云ふものが、發達して來ると、知的方面、即ち我々が色々の事物を知りたい、研究したいと云ふ方面が發達し來ると哲學となり、科學となり、情意的方面即ち我々が安心立命を求めたり、良心の滿足を求めたりする感情意志といふ方面が發達して來ると、宗教となり、道德となるのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 20
    "url": "https://dl.ndl.go.jp/pid/943657/1/21"
  "translation_ja": "このような形になるようである。伝説が発達して、知の方面、つまり、さまざまな事物を知りたい、研究したいという方面が発達すると、哲学や科学となる。感情と意志の方面、つまり、安心して生きるよりどころを求め、良心の満足を求める方面が発達すると、宗教や道徳となるのである。"
  "translation_status": "reviewed"

  "source_text": "其の天浮橋の上に立つて、矛を以つて御探りになると、其の滴りが滴つて固まつて一つの島となつた。それを自凝島と曰ふと云ふ風に古傳に傳はつて居る、自凝島と云ふのは詰り自ら凝り固つた所の島と云ふ『釋紀』にある通りの意味であるから、別に其れを二神が御產みになつたと云ふ譯ではない·チヤンと自然に其處に島が出來たのである-即ち靄か霧などのたてこめた中より、其處に島のありたるを御發見なさつたのを、さう傳へたのであらうと思はれる。そこで二神は此の自凝島に御下りになつて愈、此の國の修理固成の業を御始めになつたのである。そこで古傳に依ると云ふと、諾册二尊は先づ第一に、淡道之穗之狹別島を產まれ、それから伊豫之二名島、それから隱伎之三子島、それから筑紫島、伊伎島、津島、佐渡島、大倭豊秋津島と云ふやうな大八島、並に其の他の小島を澤山御生みになつたと云ふことになつて居る。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 71
    "url": "https://dl.ndl.go.jp/pid/943657/1/72"
  "translation_ja": "その天浮橋に立って矛で探ると、矛の先から滴が落ちて固まり、一つの島になった。それを自凝島という、と古伝には伝えられている。自凝島とは、『釈紀』にもあるとおり、自ら凝り固まった島という意味なのだから、別に二神が生んだわけではない。自然に、そこに島ができていたのである。つまり、もやや霧が立ち込める中から、そこに島があるのを発見されたことを、そのように伝えたのだと思われる。そこで二神は自凝島に下り、いよいよこの国を整え固める事業を始めた。古伝によれば、二尊はまず、淡道之穂之狭別島を生み、次に伊予之二名島、隠伎之三子島、筑紫島、伊伎島、津島、佐渡島、大倭豊秋津島という大八島と、そのほか多くの小島を生んだことになっている。"

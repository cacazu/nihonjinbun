  "source_text": "科學、これに就いては已に先きに論及したが、今少し述べて見やう。科學と云ふ言葉は今日非常に用ひられて居て、實に科學萬能と云ふ位である。少し學問すると、すぐ科學と云ふ。口ではよく云ふが科學といふものゝ說明はといふと是れも亦一寸其の答の出來ない者が少くない。さて科學と云ふものは何んなものかと云ふと、我々の色々の狀態を見てそれを知りたい、それを知るには常識では滿足が出來ない。で常識から一歩進んで、これを研究せんとする。それが科學なのである。丁度先きに述べた通り海濱の漁夫は常識で判斷するけれども、天文臺の先生は天文學でやる。即ちこれが科學。電車が縱橫に動く。これは電氣工學と云ふ科學で、電車を作る。それを常識でいゝ加減に作つたなら、いつかな動きはしない。隧道を穿つ。これは土木工學、それを常識でいゝ加減にやれと云ふので掘つたなら、間違つて行き違ひとなつて終う。夫れが一寸も間違はないのは科學の應用である。コー云ふ科學は何ういふものかと云ふに、然うむづかしいものではない。我々の普通の智識を整頓したまでヾある。事實と云ふものが茲にある。雨が降る、水が流れる、腹が減る、頭痛がする、眠たい、子供が生れる、鳥が鳴く、これ皆事實である。此の澤山な事實の中、一類の事實を成るべく澤山集めて來て、それを實驗し、觀察し、統計に訴へて、然して得た處の智識を秩序を立て、それを統一的に組織したもの。これが科學である。假令ば人が怒る、人が泣く、人が注意する、人が同情する。これは皆人の心に關した事實である。これを色々澤山集めて來て、その狀態や法則を研究して出來るのは心理學と云ふ科學、雨が降る、雷が鳴る、水が氷る、火が燃ると云ふやうに物理的の事實がある。それを集めてその狀態や法則を研究したものが物理學と云ふ科學而して水は冷くなれば氷る、熱すれば蒸發する、これは事實、水は氷るといふが一つ實驗して見やうといふので、零度にして見ると成程氷る、熱して見ると矢張蒸發する、これが實驗である。然し又實驗して見ることの出來ないものがある。地球が運轉すると云ふがこれを一つ止めて置いて、そして回轉さして見ると云ふやうな事は出來ない。日蝕を人工的に作つて見やうと云ふことは出來ない、かう云ふことは觀察でやるより外はない。觀察、これは或る物に注意して見る。例へば時計の鳴る音を聞いても無意識で居れば解らぬが、注意して數へて見れば何時といふ事が解る。これは聞くのであるが、見ても聞いても、それをよく注意する、やつぱり觀察である。我々はかやうに一類の事實を實驗したり、觀察したりする、それから統計を取つて見る。コー云ふ風にして大いに確實な智識を得るのであるけれども、これもばらばらではいかぬ。その觀察したり、實驗したり、統計したりした結果を一々分類して系統的に秩序よく綜合しなければならぬ、これが即ち科學である。科學と云ふと非常にむづかしいやうだが然うむづかしい者ではない。其の科學と哲學とは何ういふ別があるか。心理學、物理學、醫學、それからこの醫學と云ふ中にも解剖學もあるし、內科學、外科學と色々あつて、千差萬別數へきれぬ程あるが、要するに我々の目の屆く處、耳で聞く處だけしか及ぼして居らぬ。假令ば、水が氷る、湯が沸く、然ういふ事實に就いて云ふ丈で、さう云ふ人間は何ういふものか、然う云ふものが實際に存して居るか、或は空想ではないかと云ふ樣な、そんな事には一切構はぬ。それを科學より更に遡つて、水の水たる所以、人の人たる所以、さう云ふ風に研究する、これが哲學である、同じ事を見ても哲學の方は一步進んで居る。西洋にては哲學の事を科學の科學と云ふ人もあるのである。凡べての現象を一步遡つて研究して居るのである。常識を以つて滿足することの出來ない我々は、研究する人そのもの、研究せらるゝものそのもの、その因果の關係とか、時間や空間、そんなものを全くあるものと假定してその研究をなして居る科學を以つては、滿足が出來ない。茲に哲學に突入するのである。"

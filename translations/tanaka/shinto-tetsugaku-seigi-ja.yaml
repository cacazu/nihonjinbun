  "source_text": "けれども我々が考へて見るに、宗教と云ふものは、佛教や基督教に限られて居るものではない。それでは宗教とはどんなものか。セネカは、「宗教とは神を知りて、之れに做ふものである」と云ひ、カントは「宗教とは、すべて我々の義務が、神意より出たのであると認むることである」と云ひ、ハツクスレーは「宗教とは、倫理的理想を尊敬し、その理想を人生に於いて實現せんことを努むる願望である」と云つて居る。こんな工合に宗教とは如何なるものかと云へば、學者の間に、種々の學說があつて一定しない。そこで先づ大體の處を以つて云へば、宗教と云ふものは、我々が我々よりも、より以上のものと信じて居るものを對象として、それを崇敬し、それに依從して、さうして動靜云爲する所のものであると解釋せらるゝ。隨つて我々よりも、より以上のものを對象として崇敬し、安心し、依從して動靜云爲して居る所のものが所謂信仰と云ふものである。信仰と云ふものは、其の信仰の對象になるものを構成し、之れを認識する所の智的要素とそれからそれに依つて我々が安心する所の情的要素と、それに依つて依從して動靜云爲する所の意志的要素と云ふものを包含して居る。其の信仰の對象を作る所のものを宗教的知識と言ひ、後のものを宗教的感情及び意志と言ひ、其の全體を包含するものを宗教的意識と言ふのである。此の宗教的意識なるものは、如何なる國民と雖も必らず之れを有して居るものである。勿論國民に依つて、非常に文明の進步した國民は其の意識も亦進步して居るし文明の進步しない國民はその意識も無論幼稚である。そして此の意識は、又その國民の特性を以つて着色せられて、現はるゝのであるから各國種々の差異を帶びて來るのである。が併し何れの國民と雖も必らず此の宗教的意識と云ふものを有つて居るのであることは、色々の方面の事實に依つて證明することが出來るのである。此の宗教的意識に依つて作り出される所の宗教と云ふものはさう云ふ譯で各、その國民、その民族と云ふものに適應した所のものになる。隨つてその意識から作り出されて來る所の信仰の對象となるものが、其の民族に依つて違つて來る。彼の猶太人の信仰して居る所のヤーヴェと云ふのは、矢張り當時の猶太人の宗教的意識に依つて作られ、猶太人の宗教的意識に一致して居る所のものである。又アラビヤ人の信仰して居るアルラーと云ふ神は、アラビヤ人の宗教的意識に一致して居る所のものである。さう云ふ工合で我が日本國民には、日本國民の精神に最も適當した所の宗教と云ふものが、自ら起つて來らざるを得ない。そこで我が古代に於いて色々の人々は其の當時の極めて偉大なる御方であつた、所謂國民的精神の精を體し、華を集められた方々である所の伊弉諾尊、伊弉册尊、天照大神、大國主神と云ふ神々を其の當時の人々よりも、より以上のものと認めた。即ち之れを神として、さうして此の神々に依從し、此の神々の恩賴に依つて動靜云爲することが出來たのである。所が此の天照大神其の他の神々も、亦其の神々よりも、より以上のものを認められたのである。其の神々は則ち天御中主神、高皇產靈神、神皇產靈神等の神々である。此れ等の神々は、天照大神其の他の當時の神々が、より以上の神々とせられた所の神々である。斯う云ふ種々の神々に對して、我が國民の宗教的感情、意志の滿足と云ふものは行はれて居つたのである。儒教や佛教の輸入前に於いては、純粹の斯う云ふ宗教が、專ら國民上下の間に行はれて居つたのである。隨つて斯う云ふ神々の崇拜と云ふものが、天照大神が神鏡を御授けになる時に仰せになつた御言葉や、それから又皇孫を御降しになる時に高皇產靈神の宣はれた神籬、磐境の御言葉に依つて盛に行はるゝやうになつて來た。さうして斯う云ふ宗教的意識は益、養成されて來た。"

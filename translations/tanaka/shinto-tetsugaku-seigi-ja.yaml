  "source_text": "愈〻七代を經て、七代目に伊弉諾、伊弉冊二尊が御出になつたのである。伊弉諾、伊弉冊二尊は、天津神の詔を受けて、此の國土を修理固成なさると云ふことになつて居ることは、巳に述べた所である。が、それが又問題で、先づ其の天津神と云ふのはどう云ふ神であるかと云ふことが最初に起つて來る問題である。それに對して、それは伊弉諾、伊弉冊二尊より前に御出になつた所の神である。斯う云ふのであるけれども、今述べて來たやうに、此れ等の神々は理想の神々であるとすると、伊弉諾、伊弉册二尊に、どう云ふ風にして此の國土を修理固成せしめられるやうな御勅命を下さつたかと云ふことが疑問である。さうして天瓊矛を御授けになつたと言ふけれども、是れは矢張り伊弉諾、伊弉册二尊が神祕的の詔を受けて、矛をも御授かりになつたものと解釋する外はないと思ふのである。此の伊弉諾、伊弉册二尊が、天瓊矛を持つて此の國に御出でになつて、さうして天浮橋に立つて徐ろに其の瓊矛を以つて御探りになつたと云ふことが傳はつて居る。其の天浮橋と云ふことに就いても、亦色々の說がある。『釋紀』の私記によると「天浮橋と云ふのは天地開闢の當時、洲島が未だ成らない、浮脂の根係る所がないやうな工合である。それであるから浮橋の上に立つと申したのである。」斯う云ふ風に極めて糢糊たる解釋を與へて居るのである。所が平田篤胤は是れは「浮橋と言つても今の橋のやうに、此方から彼方の岸に懸けるやうな橋の意味で、天と地との中間に懸つて居る橋と云ふやうな意味ではない。又天と地とを連續して居る帶のやうなものでもない。そんなに考へる人もあるけれど、唯、神の御量を以つて造り出で給ひて、事とある節は、それに乘りて虛空を飛行されたもので、今日のもので云へば、船のやうなものである。」と解釋して居り、さうして、之れを浮漂はし乘して往來するものであるから浮橋と云つたのであると解釋して居る。之れに反して近代の學者敷田年治は又「空に浮て架れる橋である。こんな橋のあつたことは、『丹後風土記』、『播磨風土記』などに見えて居る」と云つて居る。が、だうも船の如き物であらうと思はれる。橋と言つても、決して一方がら一方に懸けてある橋の意味ではないと思はれる。"

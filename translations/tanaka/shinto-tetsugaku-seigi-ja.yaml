    "text": "そこで天御中主神と云ふ神はどう云ふ神にましますかと云ふことになつて來ると、是れは已に述べた通り、平田篤胤は老子の道などと同じと云ひ、又中古の學者には大分國常立尊と一緒に見て、之れを吾々の所謂實在其のものを指すやうに解釋して居る者もある。がどうしても是れは先づ篤胤と同じやうに、無始無終の神であると云ふことにしなければ解釋が附かぬ。始めもなければ終りもない。篤胤はさう云ふ神にしやうと云ふので、それで『古事紀』の「天地初發の時高天原に成りませる神の名は天御中主神、次に高皇產靈神、次に神皇產靈神、みな獨ラ神成少しと身を際くし給ひきどあるのを「古虎皮文と云ふ目研究の本に於いて、「天地未だ生らざりし時、高天原に神ましき」と書き「天地初發の時」を『書紀』の一書によりて「天地未だ生らざりし時」と改め、「高天原に成りませる神」と云ふのを「高天原に神ましき」として居る。「有神焉」の語は、直に無始無終を意味して來るのである。けれども、獨り神成坐して身を隱し給ひき)と云ふのはどうもされなかつた。そこが妙である。「獨り神成坐して身を隱し給ひき」と云ふことになつて來ると、「獨神成坐して」と云ふのは、前の「成りませる神の名は」と照應して居るので、獨りに出られて、さうして身を隱し給ひきと云ふのは、詰り御崩れになつた-肉體を離れての神靈となつて御生活なさると云ふ風に解釋すべきである。勿論身を隱しねひなは、國身にましこ〓とも讀まるゝが、れれにし問題である。兎に角「獨神成坐して」と云ふのは「成りませる神の名は」に照應して居るのである。であるから「高天原に成りませる神の名は」、を「成りませる」を削つて「高天原に神ましき」とする事になると、今度は「獨神成坐して身を隱し給ひき」の「成坐して」を削つてしまはなければならぬ。さうして唯、「天地未だ生らざりし時、高天原に神ましき。天御中主神。次に高皇產靈神、次に神皇產靈神」と言ひ切つてしまつて置かなくてはならぬ。"

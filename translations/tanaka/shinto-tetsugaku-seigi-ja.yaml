- "id": "st-0133-001"
  "section_id": "chapter-12-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "處が、基督教徒の方面から、とかく敬神崇祖に反對の議論の出るのは今更ら珍らしくはないが、熱烈なる忠君愛國家を以つて自ら任じて居る人士に、妙な考から、祖先崇敬に反對し、我が固有の家族主義の國體に疑義を挿むものがあるには、吾輩、甚だ以つて遺憾とするのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 132
    "url": "https://dl.ndl.go.jp/pid/943657/1/133"
  "translation_ja": "ところが、キリスト教徒の側から、何かと敬神崇祖に反対する議論が出るのは、今さら珍しくないが、自ら熱烈な忠君愛国者と任じる人々に、妙な考えから祖先を敬うことに反対し、わが国固有の家族主義の国体に疑いを挟む者があるのは、私には、はなはだ遺憾なのである。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "處が、基督〓徒の方面から、とかく敬神崇祖に反對の議論の出るのは今更ら珍らしくはないが、熱烈なる忠君愛國家を以つて自ら任じて居る人士に、妙な考から、祖先崇敬に反對し、我が固有の家族主義の國體に疑義を挿むものがあるには、吾輩、甚だ以つて遺憾とするのである。"

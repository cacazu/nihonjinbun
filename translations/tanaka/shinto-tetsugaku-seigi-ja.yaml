  "translation_ja": "そこで哲学とは、科学が研究したもろもろの原理・原則を材料に、世界と人生の根本原理を究めようとするものである。ヴントは、「哲学は、個々の科学から与えられた一般的な知識を、少しも矛盾しないように一つの体系へ組み立てた科学であり、いつの時代、どこの場所に当てはめても食い違わないものだ」と言っている。シジウィックも、同じようなことを言う。すなわち、「哲学とは、さまざまな科学や、秩序立ったさまざまな思想の原理・方法・重要な結論を、互いに比較し、考究することで、できるだけ高度な統一の体系を得ようとする研究である」という。要するに一言で言えば、哲学は宇宙や人生の根本原理の研究にほかならない。"
  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "そこで哲學と云ふものは、科學で以つて研究せられた、もろ〓〓の原理原則を材料として、世界人生の根本原理を考究せんとする所のものである。で、ヴントは「哲學は特殊科學によりて與へられた一般の知識を少しも矛盾しないやうに一つの體系に組織した科學で、古今東西に施してもとらない所のものだ」と云つて居る。シヂウィックと云ふ人もコンナことを云つて居る。即ち「哲學と云ふものは、色々の科學や、色々の秩序系統ある思想の原理、方法及び重要な結論を共に比較したり、考究したりして、出來る丈け高等な統一の組織を得やうとする研究である」と云つて居る。要するに一言で云へば、哲學は宇宙や人生に於ける根本原理の研究に外ならないのである。"

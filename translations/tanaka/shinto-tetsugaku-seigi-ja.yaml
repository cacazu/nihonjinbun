  "source_text": "先づ其の第一には政治系統である。此の神道に於ける政治は卽ち祭事である。政治の緊要な事件は、神祇を祭祀するにあれば祭と政と同義となつたものと思はれる。本居宣長は、「まつりごと」の語原を解して奉仕事なるべしとし、百官有司が、天皇の大命をうけたまはりて各、その職をつかへまつることが天下の政治なれば、奉仕事と云つたものである。而してまつるは服從の意義である」と解せるのである。要するに神道政治は、祭政一致で、其の根本は敬虔と云ふことにある。敬虔と云ふのは、敬神祭祀の觀念を有して居る所の我々の胸中の態度を言ふのである。で古傳に依つて之れを見るに、前にもちよつと述べた通り、昔天照大神が神鏡を天忍穂耳尊に授けらるゝ時に方り「床を同じくし、殿を共にして此の鏡を見る事吾れを視るが如くにせよ」と云ふやうな神勅を御下しになつた。それから又高皇產靈神は神籬磐境を以つて、神を祀れと云ふことを天兒屋根命、太玉命に仰せになつて居る。神籬は今の神祠で、磐境は今の神社の境内の義である。斯う云ふやうなことは、詰り敬神、祭祀を第一義とすることを示されたものと思はれる。其の他神武天皇の東征の時に方つては、弟猾は「天つ社國つ社の神を祭りて然る後虜を擊たば、則ち除ひ易けむ」と奏した。それから東征が終つて天下平定の業が成ると、神武天皇は皇祖の詔に從つて神籬を樹てゝ神を御祭りになり、尋いで四年には詔して靈畤を鳥見山の中に立てゝ皇祖天神を御祭りになつたと云ふ事がある。それから物部尾與等は其の當時天皇に「我が國家の天下に王たるは恒に天地社稷百八十神を以つて春夏秋冬に祭ることを事と爲す」と云ふことを申上げて居る。それから又推古天皇は勅して、「我が皇祖天皇等、世を宰め給へるや天に跼り地に蹐して敦く神祇を禮き周く山川を祠り幽に乾坤に通す。是を以つて陰陽開け和ぎ、造化共に調へり。今朕が世に方つて神祇を祭祀する事豈に怠る事あらんや。故群臣爲に心を竭くし宜しく神祇を拜すべし」と仰せになつて居る。又孝德天皇の時には蘇我石川麻呂が申上げて「先づ神祇を祭り鎭めて然る後に政事を議すべきである」と云ふことを申上げて居るし其の他祈年祭の祝詞などには「神漏岐命神漏美命もちて天社國社と稱辭意奉る」と云ふやうな言葉がある。後世になつても、順德天皇の『禁祕鈔』には、「凡そ禁中の作法は、神事を先にし、他事を後にす」とせられ、『貞永式目』には、「神社を修理し、祭祀を專にすべき事」を規定してある。斯う云ふやうな殆んど枚擧に遑ない位多くの事實と云ふものは、我が國の政治の根本と云ふものが、上に位せらるゝものとなく、又下に居る者となく、如何なる者でも此の敬神祭祀と云ふことを疎そかにしてはならない。之れを以つて重大なるものと考へて行かなければならぬ。卽ち敬虔の態度と云ふものを以つてどこまでも政治の根本として行かねばならぬと云ふことが分る。"

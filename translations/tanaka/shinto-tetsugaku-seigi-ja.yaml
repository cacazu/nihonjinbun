  "translation_ja": "ギリシャのアリストテレスの言葉どおり、「人は社会的な生き物」であり、生まれながらに、社会を作って暮らす傾向を持っている。ハイドという人なども、こう言っている。「人間は、生来、社会的な生き物であり、社会を離れれば、もはや人間ではない。自ら好んで独りでいる者があるとすれば、それは猛獣か、そうでなければ神である。人間から、他人との関係によってできるすべてを取り去れば、同情や愛、信仰、感謝、勇気などを、すべて取り去ることになり、人間は、まさしく鳥や獣の中へ入っていく」。これは西洋人の見解だが、まったく正しい。人は、どうしても共同生活を離れては暮らせない。共同生活によって初めて、この世に生まれ、育ち、生きることができる。共同生活をする以上、個人のわがまま勝手な行動は許されない。朝、起きるときには起き、夜、寝るときには寝、食事のときには食べ、礼服を着るときには着なければならない。共同生活をする各人が、それぞれ別々に暮らすことは許されない。共同生活で、わがまま放題が許されないのは、そこに何か、人がよりどころとすべきものがあるからである。共同生活には、私たちの行いを律するものが生まれる。それは、一つの家でいえば家風、村でいえば郷風、学校でいえば校風、国家でいえば国風というものになる。だから、養子や嫁として他家へ入り、その家風に従わなければ、その家にはいられなくなる。ほかの村へ行き、その土地の風習に従わなければ、そこで暮らすことはできない。郷に入れば郷に従わなければならない。一つの学校に入れば、その校風に従う必要があり、反抗すれば、すぐ退学させられてしまう。一国の国民となれば、その国の国風に従わなければならず、反抗すれば、その国家の一員として生きることはできない。国風はどの国にもあり、どの国も、その奨励と発達に努めている。もし、その国家固有の国風が衰えれば、その国家は存在理由を失う。手短にいえば、滅亡するのである。歴史を見ても、昔、ギリシャにはスパルタという、非常に強い国があった。かつては、侵入するペルシャの百万の軍隊を、わずか三千の兵で迎え撃つほど強かった。これは、国風がきわめて堅実で、勇壮だったからである。しかし、ひとたびその国風が衰え、国民がみな自分の利益だけを求めるようになると、ローマのわずかな軍隊の馬蹄の下に踏みにじられた。そのローマも、固有の剛健で質実な国風を保っている間は、たいへん栄え、ローマ人は「ローマの滅亡は、世界の滅亡である」と誇った。しかし、その後、植民地から多くの金銀財宝を集め、国民がぜいたくに流れ、昔からの勤倹で質実な国風を失うと、すぐ北方の異民族に踏みにじられた。このように、国風は国家と非常に密接な関係を持つ。そこで、ドイツが世界の大戦乱を起こし、世界の列強を相手に、長く屈しなかったのは、ドイツ国民が十八世紀ごろから国風の養成に努め、国史を奨励して愛国心を養い、身体の鍛錬に努め、国家的な教育を興し、ドイツの国風を作ったからである。世界の強国を相手に、頑強に戦ったのは、決して彼らがキリスト教徒だったからではなく、その国風、すなわち国民的精神を持っていたからである。しかし、それは、あまりに粗く作られたものだった。そのためにドイツも、ついに、あのような始末となった。わが国の国風は、ドイツが十八世紀から作り出したようなもの、ローマにかつてあって、ほどなく失われたもの、スパルタが持ち、しばらくして失ったもののような、きわめて弱く浅い国風ではない。わが国では、建国以前から、この国風、すなわち一般にいう国体が存在し、それによって建国され、国家が維持され、発展してきた。その国風、国体とは何かといえば、神道、神の道の現れである。この神道は、国民的精神の精髄を体現し、その精華を集めた神々の、言動や行動の跡によって養われ、発展していくものである。そして、この国風、国体の根底を最も深く築いたのは、すでに述べたとおり、天照大神である。大神が、天地とともにきわまりないという神勅とともに、三種の神器を下したことも、前に述べた。神器を授けた趣旨は、私たちには分からない。しかし、頼山陽の説のように、その事績について考えると、そこには深遠な意味が備わっていると思われる。このことも、前に述べた。さらに一歩進めて論じれば、国風の要素、すなわち国民的精神を、前に三つに分けて述べたが、秩序と統一を重んじる思想が発達した極致は神鏡で、現世的で快活な感情が発達した極致は神璽で、発展し膨張する性格が発達した極致は神剣で、それぞれ示されているように思われる。その極致は、ついには一つに帰着する。その一つになったものこそ、大極致というべきものである。その大極致は、神勅に示された天照大神の精神である。大神の精神とは何かといえば、天地とともにきわまりない、国運の発展である。どこまでも発展し、無限に発展し、天地とともに、きわまりなく発展する。発展の上に、さらに発展することが、大神の大いなる精神なのである。だから歴代の天皇は、天祖天照大神が始め、行い、示した大きな手本に従って政治を行い、歴代の臣民は、八百万の神々が天祖の教えに従って言動し行動してきた事績に従って、この大極致、大理想へ向かって進んでいる。ここに、神道が神道である理由があるのである。"

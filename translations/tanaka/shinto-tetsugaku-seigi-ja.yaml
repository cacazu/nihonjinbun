  "source_text": "斯う云ふ風に天體と云ふものは生滅起沒して居るのである。即ち活動して居るのである。高皇產靈神の御徳に依つて、常に宇宙の物は總べてが活動して居る。人間が生れると云ふのは、一つそこに出來てくるやうで、そして死ぬると云ふことは、其のあつたものが滅したやうに見えるけれども、一方から見れば、又起つたのである。沒したと言へばそれは無くなつたやうである。けれども、それが又生れたと云ふことになる。さう云ふ工合に生れたり死んだりして居るのである。是れは一個人に就いて見るのであるけれども、それを大きくして民族全體に就いて見ると云ふと、其の民族全體が亦生滅起沒して居るのである。あらゆる事物が皆生滅起沒して居るのである。机なら机、斯う云ふやうなものは何時迄も存在して居るやうに見えるけれども、是れも矢張り生滅起沒をやつて居る。こんな工合に出來て居る机は、永久に存在するやうに見えるけれども、是れが何時の間にか腐つたり、壞れたりして遂に沒してしまふ。沒したかと思へばそれが又他に現はれて來るのである。總べて全然斯う云ふものがなくなつてしまふと云ふことはない。即ち天御中主神の御德と云ふものは、增すこともなければ減ずることもないと云ふ譯であるから、全然無くなると云ふことはない。即ち全宇宙と云ふものが、東西南北も、上下左右も、何處までも限りがない。無限である。無限の活動で無限に生滅起沒して居るのであ る。そこが即ち天御中主神、高皇產靈神、神皇產靈神の御德である。即ち其の本性である。斯う見るのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"

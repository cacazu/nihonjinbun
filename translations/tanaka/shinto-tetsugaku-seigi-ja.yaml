  "source_text": "第七節「神」に對する吾人の主張"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 37
    "url": "https://dl.ndl.go.jp/pid/943657/1/38"
  "translation_ja": "第七節　「神」についての私たちの主張"
  "translation_status": "reviewed"
- "id": "st-0038-003"
  "section_id": "chapter-02-section-07"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "兎に角神道の神と云のは、皇祖皇宗、及び皇祖皇宗の神とせられた所の者、又は吾々國民が一般に神とする所のものである。であるから本居宣長や平田篤胤は神と云ふものを、神代に限られ、神の道と云ふのは、神代の神の道であるかのやうに解かれて居る。で賀茂眞淵にしても、上代の道、又は神代の道として、神道は上代の神の行はれたる道、斯う云ふ工合に解釋して居る。尙宣長は、吾々の行ふべき事は、神代の神々の事蹟に何もかもある。足らない事はない。斯う云ふ工合に言つて居られる。斯う云ふ學者は皆神道の神と云ふものを、神代にのみ求められて居るのであるけれども、是れは私は宜しくないと思ふ。私は神代以後の人であつても勝れた者、偉い者、尊い者は、皆神であると、斯う見る。詰り吾々のさう考へて居る者、それが神道の神である。であるからある意味から云へば、あらゆる國民は皆神であるとも云はれる。とに角、我が傳說は無限の生命を有するものであつて、神も亦神代人代の別なく無限に出でらるるのである。斯う解釋する。隨つて神道と云ふものが、本居、平田二翁の考より非常に廣くなつて來る。和氣清麿公にしても、菅原道眞公にしても、楠正成公にしても、皆神であ る。和氣清麿公の言葉は神の御言葉である。和氣清麿公の行はれた事は神の御行ひである。菅原道眞公の言葉は神の御言葉である。菅原道眞公の行ひは神の御行ひである斯う云ふ風になつて來るのである。此の事は、此れ等の大人物が、皆人の上にあつて、吾々國民に偉大な事業をなして遺され、遂に皆神として祀られて居られるによりて明白である。然るに多くの學者想ふて茲に至らず。神を以つて徒らに古代に限らんとするのである。是れ生々發展の神道を保守固陋の者とせんとするのである。誤れるも甚しと謂ふべきである。是れ吾人の年來大聲疾呼その非を叫んで、右の如き神に對する一家の見を主張する所以である。否吾人は、是れを以つて正確に神道の神を解せるものと堅く信ずるのである。これで先づ大體神道の神の何たるかを解釋したと思ふのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 37
    "url": "https://dl.ndl.go.jp/pid/943657/1/38"
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 38
    "url": "https://dl.ndl.go.jp/pid/943657/1/39"
  "translation_ja": "ともかく、神道の神とは、皇室の祖先や歴代天皇、そして、その方々が神としたもの、また、国民が広く神と認めるものである。本居宣長や平田篤胤は、神を神代に限り、神の道も、神代の神の道であるかのように説明している。賀茂真淵も、上代の道、あるいは神代の道として、神道を古代の神が行った道と解釈する。宣長はさらに、私たちが行うべきことは、神代の神々の事績に何もかも含まれ、足りないことはないと言っている。これらの学者は皆、神道の神を神代にだけ求めているが、私は、それはよくないと思う。神代以後の人でも、優れた人、偉大な人、尊い人は、すべて神だと見る。結局、私たちがそのように考えるものが、神道の神なのである。だから、ある意味では、国民はすべて神だとも言える。いずれにせよ、わが国の伝説は限りない生命を持ち、神も、神代と人の世の区別なく、限りなく現れるものだと解釈するのである。そうすれば、神道は、本居・平田の二人の考えより、はるかに広いものとなる。和気清麻呂公も、菅原道真公も、楠木正成公も、皆、神である。和気清麻呂公の言葉は神の言葉であり、その行いは神の行いである。菅原道真公の言葉も神の言葉であり、その行いも神の行いである、ということになる。これは、それらの偉大な人物が、皆、人の上に立ち、国民のために偉大な事業を成し遂げて残し、ついには神として祭られていることから明らかである。ところが、多くの学者は、ここまで考えず、神をただ古代に限定しようとする。それは、生き生きと発展する神道を、古い考えに固執するものにしてしまおうとすることである。はなはだしい誤りと言わなくてはならない。私が長年、声を大にして、その誤りを訴え、以上のような神についての見解を主張してきたのは、このためである。いや、私は、これこそ神道の神を正確に理解したものだと固く信じている。これで、ひとまず、神道の神とは何かを、おおよそ説明できたと思う。"
  "translation_status": "reviewed"

- "id": "st-0069-002"
  "section_id": "chapter-06-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "で、七代の神に就いては、大體以上述べたやうな次第である。が、此の神々に對する神道學者の說は、古來種々になつて居るのである。北畠親房は國常立尊は即ち天御中主神であつて。さうして五行の德を有して御居でになる神である。斯う申して、國常立尊と伊弉諾、伊弉冊二尊との間の五代の神を木火土金水の五行に配當したのである。さうして云はれるのに、「此の諸の神は實には國常立尊の一身に在はすのである。此の五代の神と云ふのは、國常立尊の一身である。五行の德、各々神と表はれ給ふ。之れを六代とも數へらる。二世三世の次第を立つべきでない」。斯ふ云ふ風に解釋をされて居る。其の解釋に隨ふと云ふと、詰り國常立尊から直に伊弉諾尊、伊弉冊尊に至るのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 68
    "url": "https://dl.ndl.go.jp/pid/943657/1/69"
  "translation_ja": "七代の神については、おおよそ以上のような次第である。しかし、この神々に対する神道学者の説は、古来さまざまである。北畠親房は、国常立尊は天御中主神であり、五行の徳を持っておられる神だと述べ、国常立尊と伊弉諾・伊弉冊二尊の間の五代の神を、木・火・土・金・水の五行に割り当てた。そして、「これらの神々は、実際には国常立尊の一身である。この五代の神とは、国常立尊の一身なのである。五行の徳が、それぞれ神として現れられた。これを六代とも数えられるが、二世、三世という順序を立てるべきではない」と解釈している。この解釈に従えば、結局、国常立尊から、ただちに伊弉諾尊・伊弉冊尊へと至るのである。"
  "translation_status": "reviewed"
- "id": "st-0069-003"
  "section_id": "chapter-06-section-02"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それから山崎闇齋派の神道家に玉木葦齋と云ふ人がある。此の人は、古傳に「七代一代、一代七代と云ふことがある。此の七代の神は、もと國常立尊の大氣元靈より化生し給ひ、國土成り定まり、諾冊二尊氣化し給へば、上へ說きのぼせば國常立尊の御一代に約まり、下へ說き下せば諾、冊二尊に約まるのである」。斯ふ云ふ工合に解釋して居る。即ち此の玉木葦齋の說に依つて見ると、陰陽五行の精髓が妙合して、さうして茲に諾、冊二尊を化生し給へるものであるから、七代と云ふは、此の諾、冊二尊の御出になる道筋を、神格化したのに過ぎないのである。であるから七代は一代であると云ふのであると云ふ風に解釋して居る。で、親房、葦齋などと申す學者の如きは、陰陽五行に附會して、さうして之れを二代、若くは一代に約めてしまはふと、企てたのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943657"
    "precision": "page"
    "source_sequence": 68
    "url": "https://dl.ndl.go.jp/pid/943657/1/69"
  "translation_ja": "次に、山崎闇斎派の神道家に、玉木葦斎という人がいる。この人は、古伝の「七代一代、一代七代」という言葉を取り上げ、こう解釈している。「この七代の神は、もと国常立尊の大気元霊から生まれ、国土ができて定まり、伊弉諾・伊弉冊の二尊が気の働きから生まれたのだから、上へさかのぼって説けば、国常立尊の一代にまとめられ、下へ説き進めれば、伊弉諾・伊弉冊二尊にまとめられる」。葦斎の説によれば、陰陽五行の精髄が妙に合わさって、ここに二尊が生まれたのであるから、七代とは、この二尊が現れるまでの道筋を神格化したにすぎない。だから、七代は一代なのだ、という解釈である。親房や葦斎のような学者は、陰陽五行に結び付け、これを二代、あるいは一代にまとめてしまおうとしたのである。"
  "translation_status": "reviewed"

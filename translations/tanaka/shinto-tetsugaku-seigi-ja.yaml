  "translation_ja": "さて、祓は、後世になるとさまざまに変わり、たいへん煩雑で、形式的なものになった。本居宣長は、これを嘆き、「罪があっても、穢れがあっても、その重さ、軽さに応じ、同じように祓うのが古代の法である。ところが、中国の制度ばかりをもっぱら学び用いる世になると、古代の習わしは何もかも変わり、この祓の法も、すたれていった」と述べ、さらに、近年の神道家という者たちの行いを見ると、仏教徒が仏を祭るやり方をうらやんでまねることばかり多くなった、と憤慨する。そして、「何の祓、それの祓といって読む文章が、世にあれこれあるが、みな、祓ということのあり方をわきまえない、後世の人の作ったものである。ただ、いつもの中国風のことばかり述べ、古い時代の趣旨と言葉ではない。祓においては、とりわけ無用なことばかりである」といっている。"

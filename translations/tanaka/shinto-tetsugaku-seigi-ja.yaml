  "source_text": "と仰せになつて居る。即ち國家の隆昌と臣民の慶福とを以つて中心の欣榮とすると云ふ工合に仰せになつて居る。即ち是れは神道に依つて此の大典を發布せられ、而して此の大典が皇祖皇宗の遺訓で、神道の御趣意であると云ふことが明かである。"
  "source_languages":

    "source_sequence": 31
  "translation_ja": "こう申し上げると、またある論者はこう言うでしょう。ある論者「君の言うことは少し違う。君は教育勅語を、神道の根本を示されたもの、日本固有の大道を示されたものだと言うが、教育勅語は神道勅語ではない。教育勅語ではないか。それは君の曲解だ。」これに対しては、私は論じることがあります。少なくとも三点、論じることがあるのです。"

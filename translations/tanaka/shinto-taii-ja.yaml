- "id": "std-p0007-002"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "詰り村田春海の如きは我が國の大道を知るべき地位に在り乍ら徒らに外の方に向つて求めて、內に大道のある事に氣が附かなかつた人である。併し獨り是れは春海計りではない。昔から斯う云ふ人が大分あつたのです。山崎闇齋先生の門下の淺見綱齋とか佐藤直方とか云ふ樣な人も矢張山崎闇齋先生が神道を奉じたら去つて仕舞つたと云ふ事である。詰り是れなども我が國に固有の大道のあつた事を知らなかつた人と云はなければならない。勿論山崎闇齋先生には多少の批難は免れない。牽强附會な所のないではないけれども、是れは猶克く研究すべきである。然るに彼れ佐藤淺見の輩らは其處に氣が附かないのである。徒らに外に向つて道を求めて居るのである。昔は自分の頭を無くして、ハテ頭が無くなつた何處へ行つたらうと大騒をした揚句やう〳〵頸の上にあつたのに氣が附いたと云ふ狼狽者があつたと云ふ事でありますが、私は此の譬喻が村田春海一流の人物に最も適切なるものであらうと"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "10"
    "printed_page_end": "11"
    "url": "https://dl.ndl.go.jp/pid/943543/1/7"
    "source_sequence": 6
  "translation_ja": "つまり村田春海のような人は、日本の大いなる道を知るべき立場にいながら、むやみに外にばかり求め、内に大いなる道があることに気づかなかった人です。しかし、これは春海だけではありません。昔からこういう人は相当いました。山崎闇斎先生の門下の浅見綱斎や佐藤直方なども、山崎闇斎先生が神道を奉じると、やはりそのもとを去ってしまったということです。つまり、この人たちも日本に固有の大いなる道があったことを知らなかった人といわなければなりません。もちろん山崎闇斎先生にも、多少の非難は避けられません。無理なこじつけがないわけではありませんが、それでもなお、よく研究すべきです。ところが佐藤や浅見らは、そこに気づかず、むやみに外へ道を求めているのです。昔、自分の頭がなくなったと思い、「さて、頭がなくなった。どこへ行ったのだろう」と大騒ぎした末に、ようやく首の上にあったことに気づいた慌て者がいたそうです。私はこのたとえが、村田春海と同類の人物には最も適切なものだろうと"
  "translation_status": "reviewed"

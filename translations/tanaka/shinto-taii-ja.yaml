- "id": "std-p0010-003"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "兎に角神と云ふものは、吾々が唯之れを概括して云へば、神と云ふのは上と云ふかみの觀念と、靈妙と云ふ觀念と、それからして優れて居るシュビーリオルと云ふ觀念、照臨と云ふ觀念、斯う云ふ特性、斯う云ふアツトリビュートを持つて居る所のものが神であると、かう私は信ずるのである。それ"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "16"
    "printed_page_end": "17"
    "url": "https://dl.ndl.go.jp/pid/943543/1/10"
    "source_sequence": 9
  "translation_ja": "とにかく、神についてまとめていうなら、「上」という「かみ」の観念、霊妙という観念、そして優れている、つまりスーペリアという観念、上から照らして見守るという観念、そうした特性、アトリビュートを持つものが神だと、私は信じます。それ"
  "translation_status": "reviewed"

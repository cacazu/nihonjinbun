- "id": "std-p0009-003"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "そこで神道は神の道である。それでありますからして之れを十分に說くには先づ神と道との兩方面から說いて行かなければならぬ。でありますけれども之れを十分に說くには大變な問題になつて來ますから、茲では簡單に申します。此の神と云ふものに就いて、神とは何ぞや、神の觀念は如何と云ふ。此の問題は昔から色々の學者が色々に頭を惱めて居るのでございます。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "14"
    "printed_page_end": "15"
    "url": "https://dl.ndl.go.jp/pid/943543/1/9"
    "source_sequence": 8
  "translation_ja": "さて、神道は神の道です。ですから、これを十分に説くには、まず神と道の両面から説明しなければなりません。しかし、十分に説こうとすると大変に大きな問題となるので、ここでは簡単に申し上げます。この神というものについて、神とは何か、神の観念とはどういうものか。この問題は昔から、さまざまな学者がいろいろと頭を悩ませてきたものです。"

- "id": "std-p0002-004"
  "section_id": "main-std-p0002-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "一時世を騷がしました社會主義のやうなものも、多くの靑年男女を蠱毒しました本能主義自然主義のやうなものも、皆西洋の文明に心醉し所謂西洋化した結果に外ならないのであります。洋服を着靴を穿ち手眞似口眞似まで出來る丈け西洋人をまねんとして遂に精神までも西洋人にならんとした結果に外ならないのであります。恰も牛乳を飮んでそして牛にならんと努むるやうなものであります。牛乳を飮むからとて精神までも牛となつてはなさけないではありませんか。西洋文明が如何によいからと"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "1"
    "url": "https://dl.ndl.go.jp/pid/943543/1/2"
    "source_sequence": 1
  "translation_ja": "一時、世間を騒がせた社会主義のようなものも、多くの青年男女を毒した本能主義や自然主義のようなものも、みな西洋の文明に心酔し、いわゆる西洋化した結果にほかなりません。洋服を着て靴を履き、身ぶりや口まねまで、できるだけ西洋人をまねようとして、ついには精神までも西洋人になろうとした結果にほかなりません。まるで牛乳を飲んで、そのうえ牛になろうと努めるようなものです。牛乳を飲むからといって精神までも牛になっては、情けないではありませんか。西洋文明がいかによいからといっ"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943543"
    "original_unit_id": "943543_0000002:8"
  - "source_id": "ndl-943543"
    "original_unit_id": "943543_0000002:7"
  - "source_id": "ndl-943543"
    "original_unit_id": "943543_0000002:4"

  "translation_ja": "今日のようにさまざまな思想や信仰が行われる社会と時代では、すでにお話しした日本の大道、すなわち神道を、以前と同じような示し方で依然として示していたのでは、国民に十分理解させることはとても難しいのです。要するに、歴史上の事実や断片的な言葉だけを挙げて、これが神道であると言ったところで、それによって国民に確固たる思想や信仰を作り、さまざまな危険な思想や信仰に抵抗させることは困難です。畏れ多くも現人神でいらっしゃった先帝陛下は、このことを深くご心配になり、この勅語をお与えになって、神道をお示しになったのです。しかし、こう申し上げると、儒教を信じる人はこう言うでしょう。儒教を信じる人「教育勅語は神道の本旨を示されたものだと言うが、それは大きな誤解だ。これは儒教の要旨を示されたものだ。」それももっともなことなのです。また、ある人「いや、そうではない。仏教の意味を説かれたのだ。」別の人「いや、そうではない。キリスト教の教えを説かれたものだ。」と、それぞれ自分の信じる方面に引き寄せて解釈を"

- "id": "std-p0009-001"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "れる方もあるかも知れぬ。併し是れは大變な誤解で、毫釐の差之れを千里に失すと昔から云つて居ります。譬へて見ればかの停車場に於いて少しも東西南北を知らない所の老爺さん老婆さんが滊車に乘るとする。若し東へ行く積りで一步過つて西行線の列車に乘つたら何うでありませうか。唯、乘る時の一步の誤りである。然るに其の翌日に於いては何うであるかと云ふと自分の目的地とはまるで反對な、自分の目的地とは數百里を隔つた方角に行く樣になつて居る。唯、初の一步の違ひから、初の少しの考へ違ひで斯くの如き差が出來るのである。毫釐の差之れを千里に失すとは此處である。私は此の問題に就いてはいつでもいつでも度會延佳氏の管見の說を反復したいのであります。即ち延佳氏は玉串を持ち神語を唱へたりする事などは、祭庭—祭りの庭の儀式であるが、是れも亦神道の一事にして最も重しとする所である。即ち神道の最も重大なる一部である。けれども此の事ばかりを神道と思ふのは天を管から覗いて見た樣なものであると云ふ說を主張するのであります。一體世間には佛道だの、儒道だの、其他、ナンの道、カンの道など申して、種々樣々の道を說くのですが此れ等は神道に比べて見ると極めて、狹小なもので、とても比較にならない樣なものであります。さう云ふ工合に神道と云ふ者は極めて宏大なものであります。それでは其の神道は何んなものであるか。もう少し十分な說明をして貰ひたい。斯う云ふ問題が起るでありませう。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "14"
    "printed_page_end": "15"
    "url": "https://dl.ndl.go.jp/pid/943543/1/9"
    "source_sequence": 8
  "translation_ja": "れる方もいるかもしれません。しかし、これは大変な誤解です。昔から「ごくわずかな違いが、千里の誤りになる」といいます。例えば、駅で東西南北がまるで分からないおじいさんやおばあさんが、汽車に乗るとしましょう。東に行くつもりで一歩間違え、西行きの列車に乗ったらどうでしょうか。乗るときには、ただ一歩の誤りです。しかし翌日には、自分の目的地とはまるで反対の、何百里も離れた方角に行ってしまっています。最初の一歩の違い、初めの少しの思い違いから、これほどの差ができるのです。「ごくわずかな違いが、千里の誤りになる」とは、このことです。この問題について、私はいつでも度会延佳氏の管見の説を繰り返し述べたいと思います。すなわち延佳氏は、玉串を持って神語を唱えるなどのことは、祭庭、つまり祭りの場での儀式であり、これも神道の営みの一つとして最も重くみるべきもの、つまり神道のきわめて重大な一部分だとしています。しかし、それだけを神道だと思うのは、管から空をのぞき見たようなものだ、と主張するのです。そもそも世間では、仏道や儒道、そのほか何々の道と、さまざまな道を説きますが、これらは神道と比べれば非常に狭く小さく、とても比較にならないようなものです。そのように、神道とはきわめて広大なものです。では、その神道とはどういうものか。もう少し十分に説明してほしい。そういう問いが出てくるでしょう。"
  "translation_status": "reviewed"

  "source_text": "著者は有名なる神道哲學專攻の士であるから、讀者は宣長の著書五十部百三十餘卷の書を讀破せずとも本書を一讀すれば宣長の哲學-否復古神道諸家の哲學を遺憾なく知ることは出來やう。先年著者が公にした『平田篤胤の哲學』が識者間に重ぜられた一事に徵するも亦本書の價値を知に充分と思ふ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/43"
    "source_sequence": 42
  "translation_ja": "著者は神道哲学を専攻する有名な学者なので、読者は宣長の著書50部130余巻を読破しなくても、本書を一読すれば宣長の哲学、いや復古神道の諸家の哲学を十分に知ることができよう。先年、著者が公刊した『平田篤胤の哲学』が識者の間で重んじられたことだけからも、本書の価値は十分に分かると思う。"
  "translation_status": "reviewed"

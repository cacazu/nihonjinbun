- "id": "std-p0012-002"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それで徳川家康公がさう云ふ樣な事をし、或は又楠正成公が湊川に戰死するに當つて七たび生れて君國に報ずると云つた。さう云ふ樣な事、或は又菅原道眞公が遺訓に國學の要とする所は和魂漢才にありと云ひ、其の他忠孝一致の道を說いて居る、此の和魂漢才の語も後人の附會と申しますが、とに角道眞公一代の事蹟はかゝる語で能く示さるゝのであります。かゝる道眞公の說いたもの、行つた事、是れ等は皆吾々の日常行爲の好摸範となる所のものである。そして是れが又神道の一部分を爲すのである。或は又和氣の清麿公が彼の勢ひ天皇を凌ぎ奉つた惡僧道鏡の威嚇を恐れず、宇佐八幡宮の神託なりとて、我が國家は開闢以來君臣の分が定まつて居つて未だ臣を以つて君とした例しが無い。天つ日嗣は必ず皇緒を立てよ。若し天位を窺窬する無道の者があつたならば速かに之れを除いて處するに嚴罰を以つてせよと、憚る所なく道鏡の前に直言した事などは最も神道の眞隨で是れ亦其の一部分である。其の他柿本人麿公の歌の能く示せる彼の眞心と云ふ者が神道の根抵となつて居るのであつて、是れ等は全く神道を事實の上に示した所のものである。神道には別に經典が無い、バイブルが無いけれどもかう云ふ事實が一々存在して居るのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "20"
    "printed_page_end": "21"
    "url": "https://dl.ndl.go.jp/pid/943543/1/12"
    "source_sequence": 11
  "translation_ja": "徳川家康公がそのようなことをしたこと、楠正成公が湊川で戦死するにあたって、七たび生まれて君主と国家に報いると言ったこと。また菅原道真公が遺訓に、国学が重んじるのは和魂漢才、日本の精神と中国の学才であると述べ、そのほか忠と孝は一つであるという道を説いたこと。この「和魂漢才」という言葉も後世の人のこじつけだといいますが、とにかく道真公の生涯の事績は、こういう言葉でよく表されます。このように道真公が説き、行ったことは、みな私たちの日常の行いのよい模範となるもので、これも神道の一部分をなします。また和気清麿公は、天皇をもしのぐ勢いのあった悪僧道鏡の威嚇を恐れず、宇佐八幡宮の神託だとして、「わが国は国の始まり以来、君臣の区別が定まっており、まだ臣下を君主にした例はない。皇位を継ぐ者には必ず皇統の子孫を立てよ。もし皇位をうかがう無道の者がいれば、すぐにこれを除き、厳罰に処せよ」と、はばかることなく道鏡の前で直言しました。こうしたことは神道の真髄をよく表し、これもその一部分です。そのほか、柿本人麿公の歌によく示されている真心が、神道の根底となっています。これらはまったく、神道を実際の事実の上に示したものです。神道には特に経典も聖書もありませんが、こういう事実が一つ一つ存在しているのです。"
  "translation_status": "reviewed"

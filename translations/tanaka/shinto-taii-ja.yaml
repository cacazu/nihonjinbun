    "source_sequence": 2
  "translation_ja": "先年、『欧人の見たる神道』という論文を書いて送ってきたフランスのダルヴィエルラ伯爵は、次のように書いています。「私はヨーロッパで、日本の留学生や学者、あるいは外交家といった人々に会う機会を得るたびに、必ず神道の話をしたが、そのつど冷淡で無頓着な答えか、あるいは風をとらえ雲をつかむような答えに"

  - "kind": "ocr"
    "text": "『神風』(九〇號)評其の內容を見るに、著者たる田中先生は、目下國學院大學の講師にして、其の述ぶる所の本書に執りては、平田翁の經歷·性行·學統より學說·對異·統括の各篇、即ち平田翁の世界·人生等に關する一代の學說を、系統的組織的に說述したるものにして、平田翁は何人も知る處の我國屈指の熱心なる神道家にして、其の熱心なる言論は、自餘のものを燒棄せずんば止まざるの〓あり。其の神道を尊で儒佛を排し有らゆる異學を排して餘力を遺さゞる處は翁としての特長なり。されば其の見識あり、氣慨あり、毫も他に一步を讓らず、所謂權威ある學者の說として、又一派の神道家として、之を研究したらんには、其の得る所多大ならんとす。宜しく神道家たるもの一書を購ふて座右に置かれよ。『東京朝日新聞』(八三九一號)評實にや神道は皇國の大道にして、他の宗〓の如く經典學說あるに非ずと雖も、建國當時より萬古不滅の大綱として、國民の精髓を支配し來れるもの也。吾が平田篤胤の〓は、本居宣長の學說の後を承け、此の大本に據り、異端の〓を斥け忠君愛國の實踐哲學を皷吹せる者にて、其說往々にして稍極端に走り、間々牽會の箇所なきに非ずと雖も、斯道の根本を確立せし點に於て、日本神道史中の大立物たるに背かず。又一代の經歷に於ても、一世の模範たる可きの人なり。本書は-翁を研究せんとする人には好古の參考書なるべし。學哲之胤篤田平『大阪每日新聞』(九四〇一號)評國學院講師田中義能氏の「平田篤胤之哲學」は、神道國學の人傑を思想上哲學上より評傳した書としては、殆ど初めて位なものであらう。是まで朱子學古學等儒家の學說に就いての述作はあるが、皇學家をこれほどに系統的思想的に論じたものは記者は未だ見なかつた。篤胤は本居の先導者となつて開いた獨自的皇學論を一層積極的に批評眼を開き、宗〓觀に至つて殊に生面がある。「神はわが神なりわれは神の人なり」と言つたのなどは最もその思想の超凡を證せらる。田中氏の此書は、多方面に能く篤胤の思想を解剖してある。信仰對象論の如き、此書の標榜する所に背かぬ。但だ國家と宗〓の論、其他になほ百尺竿頭今一步ありたいと思ふ處があるが-學界思想界の爲に、此偉大な思想家儒佛を超脫して日本的獨自の思想を發揮した-篤胤を活描し來つた著者の勞を多として、此書を推薦す。『養德』(八卷十二號)評平田翁の學說を充分批評發揮して餘薀なきのみならず、且組織的に叙述せられたるは、近來比類なき著述と云ふべし。今や世上一般哲學と云へば歐西傳來の學說を祖述するのみにて、我日本には哲學と稱すべきものなしなどと云へるに際し、本書の出づるあり、我斯道界に一大明燈を得たるのみならず、我國體の精華を發揮するに於て効補はずんばあらず。響反の論世"

- "id": "std-p0032-002"
  "section_id": "main-std-p0032-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "斯く申しますると又或る論者は斯う申しませう。君の云ふのは少し違ふ。君は教育勅語を以つて神道の根本を示されたものだ。我が國固有の大道を示されたものだと、斯う云ふけれども、教育勅語は神道勅語ではない。教育勅語ではないか。それは君の曲解であると斯う申しませう。是れに對しては私は辯ずる所がある。少なくとも三點の辯ずる所があるのです。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"

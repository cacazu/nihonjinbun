    "source_sequence": 42
  "translation_ja": "アリストテレスやカントといった大思想家の思想や学説を知りたくても、今日のような忙しい時代には、膨大な著書を一つ一つ読むわけにはいかない。そこで西洋には以前から、こうした大思想家の評伝がいろいろあり、その思想・学説を容易に知ることができる。しかしわが国には、この種のものが非常に少ない。近頃は文化の進歩につれてようやく多少は刊行され、学界への貢献も小さくないが、主に儒教の思想家に限られるように見えるのは残念である。ところが、國學院大学講師の文学士田中義能氏は、熱心に教育の理論を研究し実践に携わる一方、わが国固有の学問の思想家も研究し、すでに『平田篤胤の哲学』を公刊し、今また大部の『本居宣長の哲学』を完成させた。本書を見ると、宣長の思想を中心に、春満、真淵、大平、内遠ら、その学統に関係する学者の学説も体系的・組織的に論じ、復古神道派の学説を実に行き届いた形で紹介している。叙述には著者得意の明快な文章を用いている。引用・論証は広く、議論は鋭い。確かに近頃の優れた著作というべきである。思想界の混乱がますますひどくなろうとする時、本書が公刊されたことは、社会の教化のために大いに喜ぶべきことだ。私たちはあえて本書を読者に推薦する。"
  "translation_status": "reviewed"

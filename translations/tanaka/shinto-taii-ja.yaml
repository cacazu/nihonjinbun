  "source_text": "國學院講師田中義能氏の「平田篤胤之哲學」は、神道國學の人傑を思想上哲學上より評傳した書としては、殆ど初めて位なものであらう。是まで朱子學古學等儒家の學說に就いての述作はあるが、皇學家をこれほどに系統的思想的に論じたものは記者は未だ見なかつた。篤胤は本居の先導者となつて開いた獨自的皇學論を一層積極的に批評眼を開き、宗教觀に至つて殊に生面がある。「神はわが神なりわれは神の人なり」と言つたのなどは最もその思想の超凡を證せらる。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/46"
    "source_sequence": 45
  "translation_ja": "國學院講師田中義能氏の『平田篤胤の哲学』は、神道・国学の傑出した人物を思想・哲学の面から評伝した本としては、ほとんど最初のものだろう。これまで朱子学や古学など、儒家の学説を扱った著作はあるが、皇学者をこれほど体系的・思想的に論じたものは、記者はまだ見たことがなかった。篤胤は、本居が先導者となって開いた独自の皇学論を、さらに積極的な批判の目で捉え、宗教観では特に新しい面を示している。「神はわが神であり、私は神の人である」といった言葉などは、その思想が凡人を超えていることを最もよく示す。"
  "translation_status": "reviewed"
- "id": "std-p0046-008"
  "section_id": "ads-scan-46"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "田中氏の此書は、多方面に能く篤胤の思想を解剖してある。信仰對象論の如き、此書の標榜する所に背かぬ。但だ國家と宗教の論、其他になほ百尺竿頭今一步ありたいと思ふ處があるが-學界思想界の爲に、此偉大な思想家儒佛を超脫して日本的獨自の思想を發揮した-篤胤を活描し來つた著者の勞を多として、此書を推薦す。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/46"
    "source_sequence": 45
  "translation_ja": "田中氏の本書は、多方面から篤胤の思想をよく分析している。信仰対象論などは、本書が掲げる趣旨にかなっている。ただ国家と宗教の議論などには、なお一段進んでほしいと思うところもある。しかし学界・思想界のために、この偉大な思想家――儒教と仏教を超え、日本独自の思想を発揮した――篤胤を生き生きと描き出した著者の労をたたえ、本書を推薦する。"
  "translation_status": "reviewed"

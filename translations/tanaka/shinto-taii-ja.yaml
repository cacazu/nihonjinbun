  "translation_ja": "時代順に記述しているものの、年代そのものより、思想と事実のつながりを重視している。したがって、発展の過程に沿って記述した教育学といえるだろう。これが著者の目指したところであり、本書は見事に成功している。教育上有用な参考書であることはいうまでもない。"
  "translation_status": "reviewed"

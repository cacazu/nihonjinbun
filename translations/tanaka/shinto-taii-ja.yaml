  "source_text": "今日の樣な種々の思想信仰の行はれます社會と時代には、已に申しました樣な我が國の大道即ち神道を從來のやうな發表の仕方で依然發表して居ましては、とても十分に國民に徹底せしむることは、むづかしいのであります。要するに歷史的の事實や、斷片的の言葉のみを擧げて、是れが神道であると云つた所で之れに因つて國民に鞏固なる思想信仰を作り、國民をして種々危險なる思想信仰に抵抗せしむることは困難であります。畏れ多くも現人神にまし〳〵た先帝陛下は深く此事を御軫念遊ばして、此の勅語を賜はり、神道を示されたのであります。併し斯う申しますると云ふと、儒教を信じまする人は教育勅語は神道の本旨を示されたものであると云ふけれども、それは大なる誤解である。是れは儒教の要旨を示されたものである。斯う云ふでありませう。それも尤もであるのです。又或る人は、いやさうではない、佛教の意味を說かれたのである。いやさうぢやない、基督教の教を說かれたものだと。各々自分の信じて居る方面に引いて解釋を"

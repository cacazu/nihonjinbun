  "translation_ja": "ただ「上」という中にも、さまざまな上下があります。一国の君主もいれば、一県の長官もいます。一郡の長も、一市一村の長も、あるいは一つの集落の長もいます。これらはみな「上」であり、神です。一集落の長でも上ですし、一軒の家についていえば、その家の主人は上です。その主人の妻は「おかみさん」です。おかみさんもまた、優れているという神の特性を一つ持っています。ただ、その度合いが低いのです。程度が低いのです。ですから、おかみさんの言葉や行いは、一家の中で自分より下にいる者には影響しますが、それ以上にはなかなか及びません。これに対して、一国の最も偉大な人、例えば柿本人麿公、和気清麿公、菅原道真公、楠正成公、徳川家康公などになると、非常に高い程度の優越した地位を持つ神です。こういう神が尊い神なので、私たちはあの人麿神社に参拝して、人麿公が歌を詠んだように、真心からの歌を詠んだように、自分もそうしたい、あのような人になりたいと思います。また、あの護王神社に参拝して"

  "source_text": "さて、曩に私は神に上下があると云ふ事を申して置ました。一軒の家の御上さんも神であれば、一國の君主も神樣である。それで東照宮とか、湊川神社とか、天滿宮とか云ふ樣な神樣は尊い神である。尊い神であるけれども、併し其の最も尊いのは天祖天照大神を初として此の御歷代の皇統の方々の神樣であります。それで此の天祖天照大神を初として御歷代の神々の示されたものが即ち神道のプリンシパルパートになつて居る。其の要部となつて居るのである。然らば其の一斑は何う云ふものであるかと云ふと、天照大神が皇孫を此の國に降さるる時に三種の神器を下さつて、其の時に天壤無窮の神勅を授けられたのであるが、是れが神道の根本となつて居る。それから後に崇神天皇が即位の四年に、惟れ我が皇祖諸々の天皇だち宸極に光臨せられたのは豈に一身の爲で在うか、さうではない。蓋し人神を司牧し天下を經綸せられん爲である。故に能く世々玄功を闡め時に至德を流かれたのである。今朕大道を奉承して萬民を愛育し、如何にしてか皇祖の跡に遵ひ、永く無窮の祚を保たん。其れ群卿百僚爾の忠貞を竭して並"

- "id": "std-p0027-001"
  "section_id": "main-std-p0026-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "が如き勢を以つて西洋の文明が這入つて來ました。で、維新の當時朝廷に於かれてはどうかと申しますと。天皇は南殿に出御せられて五ヶ條の御誓文を宣せられた。其の五ヶ條の御誓文中第四條には舊來の陋習を破り天地の公道に基くべしと、斯う宣はせられて居る。第五條には知識を世界に求め大に皇基を振起すべしと、斯う宣はせられて居る。所がどうも之れを誤解した。第四條の舊來の陋習を破り之れは誠に結構な事である。從來幕府の政策、鎻國的の政策の結果として國民が非常に保守的になり退嬰的になり因循姑息的になつて居る。此の陋習を破り天地の公道に基いて行ふべきを示されて居る。斯ういふ譯である。又、知識を世界に求める、どうしても今日は世界最新の知識を持つて居らなくてはならぬ。知識はどうしても古くては駄目である。それゆゑに知識を世界に求め大に日本の皇基を振起しなくてはならぬ。斯ういふ仰せなんです。實に和魂漢才の趣旨を示されて居る仰せである。それを維新以來一般世人が誤解して仕舞つて皆上の方の舊來の陋習を破ることだけを考へて後の方は拔きにして仕舞つた。又知識を世界に求めといふ方ばかりを主として、何でもかでも西洋の文明を學んだ。即ち西洋心醉といふ狀態を呈して來たのである。それで舊來の陋習を破るのであるから昔の風は何でもイカぬ。斯ういふ風になつて來ましたから政治も昔の政治ではイカぬ。之れから民主政にしなくてはならぬなどゝ飛んでもないことを言出して主權は何れにあるか。つまり國民にあるのであると云ふやうな事を云ひ出して來た。それから又人間には天賦人權と云ふものがある。外から侵すことの出來ぬ天賦人權と云ふものがあると云ひ出した。天賦人權は宜いですけれどもそれを矢鱈に振廻して生半可の自由呼はりをし、何でもかでも自由ぢやなんと云つて却つて安寧秩序を害し、往々にして甚だ不自由な結果を生ずるやうなことをして居る。政治の方もさういふ工合であるが、更に宗教の方面を見ると基督教は文明國民の奉ずる文明教だから今日文明國民と交通す"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"

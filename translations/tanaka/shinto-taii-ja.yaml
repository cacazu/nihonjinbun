- "id": "std-p0019-001"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "ります。此の神道と云ふ文字を平田篤胤翁は解して神を祭り、神を禱り、又祓などの類凡て神に仕へまつるわざをひろく申したものと解釋されてありますが、誠にその通りで全く神道といふ言葉を宗教的の意味に使つたものと考へられますそれから其の後平安朝初期に出でたる最澄が始めて唱へたと云ふ山王一實神道、或は空海が創めたといふ兩部習合神道さういふ風の神道は全く宗教的であります。それから後の卜部家の唯一神道、是れも宗教的であります、それから近代の奇傑でありました所の黑住宗忠氏、之れも矢張り天照大神を最上神として明かに一派の宗教を立し、訓誡七ケ條の第一に於いて、神國の人に生れ常に信心なき事を誡め、千辛萬苦して熱烈な宗教的信仰を皷吹されて居ります。近世大分斯ういふ熱烈な宗教家が出られまして神道といふものは宗教である。斯ういふ風に考へる人が澤山出來て來ました。けれども此の神道は全く宗教である、徹頭徹尾宗教であるといふ考も餘り宜い考ではないと思ひます。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "34"
    "printed_page_end": "35"
    "url": "https://dl.ndl.go.jp/pid/943543/1/19"
    "source_sequence": 18
  "translation_ja": "ます。この「神道」という文字について、平田篤胤翁は、神を祭り、神に祈り、また祓など、神にお仕えする行い全般を広く指すものと解釈しています。まことにそのとおりで、「神道」という言葉は、まったく宗教的な意味で使われていると考えられます。その後、平安時代初期の最澄が初めて唱えたという山王一実神道や、空海が始めたという両部習合神道は、まったく宗教的なものです。さらに後の卜部家の唯一神道も宗教的です。それから、近代の傑出した人物である黒住宗忠氏も、やはり天照大神を最高神として、明らかに一派の宗教を立てました。「訓誡七か条」の第一条で、神国の人に生まれながら常に信心を持たないことを戒め、さまざまな苦難を重ねて、熱烈な宗教的信仰を鼓舞しました。近世には、このような熱烈な宗教家が大勢現れ、神道とは宗教であると考える人が多くなりました。しかし、神道はまったく宗教であり、どこまでも宗教なのだという考えも、あまりよい考えではないと思います。"

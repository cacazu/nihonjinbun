  "source_text": "時代の順序に依つて記載するものゝ、年代よりも、思想及び事實の連絡に重きを置けり。故に之れを發展的に記載せし教育學なりと云ふ事を得ん。之れ著者の企てたる所にして、本書亦能く成功せり。教育上有用なる參考書たる勿論なり。"
  "source_languages":

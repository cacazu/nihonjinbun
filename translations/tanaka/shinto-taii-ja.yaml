  "source_text": "之れを西洋に就いて見ますると云ふと昔羅馬にバヂリウスと云ふ人があつた。此の人は誠に質朴な基督教信者であつたが、其の人が或る時當時の羅馬皇帝バレンチヤヌス陛下から使者を受けて、其の皇帝の使者の前に立つことゝなつた。そして皇帝の使者がバヂリウスに云ふには、其の方は帝の信ぜらるゝ所の教理を信じなければ罸せられるぞと、斯う云つた。所がバヂリウスは之れに答へて、それはもう罸せられても仕方がございませぬ。が、併し何う云ふ罸を下さる。使者が云ふには其の罸と云ふのは御前の財產をすつかり沒收せられるのである。するとバヂリウスは一向平氣でそれは宜しうございます。私の財產と申した所が此の着て居る着物一枚限りでございますから、之れを取られた所で少しも差支はございません。使者は、御前そんな事を云ふと國外へ放逐されるぞ。いやそれも宜しうございます。一體神樣と云ふものは何れの所へ行つても御在でになるものですから、國外へでも何處へでも參りませう。使者もたまり兼ねて御前そんな事を云ふと死刑に處せられるぞ。宜しうございます死刑にして戴きませう。私はうまれつき馬鹿でございまして、殉教者と云つて教の爲に身を犠牲にする丈けの知惠が"

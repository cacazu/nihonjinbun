    "text": "無いと云ふ事を常に悲んで居つたのでございます。それに此の病身でございまして何時迄永らへて居りました所で仕方がありませぬから、何うか早速死刑にして戴きたい。さうすれば殉〓者の仲間入も出來るのでありますから是の位有難い事はございませぬ。是れがバヂリウスの云つた言葉でございます。而かも此の事は西洋では立派な事だとして傳へられて居るのでございます。何うです日本民族に於いてさう云ふ事が云へませうか."

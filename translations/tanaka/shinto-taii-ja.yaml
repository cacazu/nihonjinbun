- "id": "std-p0011-001"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "で兎に角今日あらびと神などと申しまして今日現存して居る所の人でも神と云ふ事は出來るのである。それから過去に於いて吾々の祖先の內今云つた樣な特性の內の一つなり二つなり或は悉く持つて居る樣なものを神と云ふのである。それであるからして西洋で唯一神と唱へて居るあゝ云ふアブストラクトの樣な神でなくして、即ち詩人や哲學者や宗教家が勝手に造り出したのでなくして、日本の神は人格を備へて居る所の神である。餘程西洋とは神の考が違つて居るのであります。で、斯う云ふ神の行はれた事、云はれた事が道となつて、所謂神の道となるのである。勿論優勝である優れて居ると云ふ其の優れ方には程度があります。デグリーがあります。コンパラチーヴであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "18"
    "printed_page_end": "19"
    "url": "https://dl.ndl.go.jp/pid/943543/1/11"
    "source_sequence": 10
  "translation_ja": "で、今日でも「現人神」などといって、今生きている人を神と呼ぶことができます。また過去に生きた私たちの祖先のうち、今述べた特性を一つ、二つ、あるいはすべて備えたものを神といいます。ですから、西洋で唯一神と呼ぶ、あのような抽象的な神ではありません。つまり詩人や哲学者や宗教家が勝手に作り出したものではなく、日本の神は人格を備えた神なのです。神についての考えは、西洋とはよほど違います。そして、こうした神の行ったことや語ったことが道となり、いわゆる神の道となります。もちろん、優越している、優れているといっても、その優れ方には程度があります。度合いがあります。相対的なものなのです。"
  "translation_status": "reviewed"

    "text": "10文學士田中義能著平田篤胤之哲學菊判洋裝上製全一册紙數五八二頁定價金貳圓覽天賜本書は畏くも天皇陛下皇后陛下の叡覽を忝うし奉る發行所東京市神田區錦町一ノ十九覽天賜天皇下日本學術研究會『萬朝報』(五八三一號)評平田篤胤は本居宣長の學說を承けて神道の正義を鼓吹し、我邦國民的特性の發揮は即ち神道の體得にありとなし、盛に儒佛の二道を罵倒して自己學說の主張に其全生涯を傾注したる熱誠の國學者なり。著者今國民〓育に資する所あらんとして此書を著はし、四編十六章に分ちて學說を論じ、經歷を傳へ、一々典據出所を明にして尨然たる大册をなす。名は哲學と謂へども要するに篤胤の研究なり。所論穩健にして而も公平、加ふるに考證甚努めたるは、充分に著者が篤學なる研究的態度を認むるに足る。吾人は双手を擧げて斯の如き眞面目なる研究の世に公にせらるゝを歡迎す。『報知新聞』(一一七三四號)評讀過良く先生の先生たる處を窺ふを得べし。是非一讀すべき好著也々嘖評好"

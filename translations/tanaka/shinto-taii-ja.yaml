    "text": "殊にです、最も甚だしいのは西紀一千七百九十二年に於ける佛蘭西の國會の態度であるのです.此の西紀一千七百九十二年の佛蘭西國會に於いては何うでありましたか。國王を數ヶ月間も牢獄の中へ入れて置いて、さうして遂に之れを國會の前に引出して來て是より此の國王が有罪であるか無罪であるかを決し、有罪であるとしたならば其の所罸を國民に諮るべきや否やを決し、而して其の所罸法は如何なる刑罸を之れに加ふべきかを議會に於いて諮つたのであります。所が其の議會に於いては······佛蘭西の國會に於いては、國王は有罪であると決定したのであります。國民に諮るの必要は無いと決定したのであります。國王を死刑に處すべしと決定したのでありまず。其の國王を死刑に處すると云ふ投票、其の投票は實に佛蘭西國民の勤王心の何の位の程度にあるかと云ふ事を試驗する所の投票である。盤根錯節には遇ずんば何を以つて利器を別たんと云ふ事がありますが、其の點から云ふと此の投票は實に勤王心を試驗する所の大いなる機會であつたのであります。此の投票の結果總數七百二十一票の中で二十六票の多數を以つて國王を死刑にしろと云ふ事に決定したのであります。我が國民であつたならば斯くの如き事は夢想する事も出來ないのであります。此の點が即ち根本の違つて居る所以であります。勿論此の多數の內には暴徒から迫害を受けて國王を死刑に處すべしと投票しなければ殺すぞと强迫せられた者もありませう。殺すと云はれたつて構はないではありませぬか。和氣の〓麿公は何うでありましたか。惡僧道鏡の爲に既に殺されやうとしたではありませぬか。殺されたつて構はない。我が君國の爲には一身を犠牲にすると云ふのが日本國民の特徵である。佛蘭西國民はさうではない。君國よりも一身の方が大事なのである。君國の存亡よりも自分が殺される方が恐いのである。そこで斯樣な亂暴も敢へてするのである。"

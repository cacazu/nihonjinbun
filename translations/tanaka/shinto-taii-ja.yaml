  "source_text": "べて來ましたやうに神道は政治·宗教·道德を以つて其の主要なる內容を組織する要素だと考へるのであります。で、我が帝國が御承知の通り世界無比の國體を有し、萬世一系の皇統を戴いて、さうして建國以來國威が益揚り、國光が益輝いて行く、此の所以はどういふ譯であるかと考へますると、或る人は斯う言ひます。それは昔此の國が野蠻未開の時代であつたので極めて獸的な行ひをして居つた所が儒教といふ立派な教が這入つて、五倫五常の道を教へ、さうして無比の國體を有することが出來たのであると申して居る學者がある。又、或人は佛教が傳はつて來たからであると申します。で、つまり儒教や佛教の御蔭である。斯ういふ論者がございます。併し儒教の本國はどうであるか。常にダイナスチー(Dynasty)を變へるではありませんか。革命の國ではありませんか。佛教の本國も其の通りです。我が日本の國體が世界無比で、我が日本の皇統が萬世一系でありますのは、實に我が國固有の大道が、單に政道でなく、單に宗教でなく、單に道德でなく、詰り神道其ものゝ中には政治も宗教も道德もあるのでありますからです。元來神道なるものは實に偉大なる道でありまして、之れを發けば天地六合に瀰漫し、之を收むれば人道の細微をも穿つ所のものであります。斯う云ふ譯で神道は單に政治でなく、單に宗教でなく、單に道德でないのであります。それでありますからして儒教が渡つて來る。さうすると堯舜の禪讓や、或は湯武の放伐の如きを極力排斥し、又佛教が渡つて來ると、小乘佛教の極めて消極的で極めて厭世的であるものは直に其の跡を絕たしめ、能く積極的で、現世的なる大乘佛教を利用し之れを同化し去つたのであります。が併し道は人によつて存するのでありますからして、かく外教を利用し、同化するには、我が國民が健全で、我が大道を十分に體認し、如何なものでも利用し、同化する力を有さなくてはなりません。"

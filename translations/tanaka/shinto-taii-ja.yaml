    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/46"
    "source_sequence": 45
  "translation_ja": "まことに神道は皇国の大道であり、他の宗教のような経典や学説があるわけではないが、建国当初から永遠に滅びない大綱として、国民の精神の核心を支配してきたものである。わが平田篤胤の教えは、本居宣長の学説を受け継ぎ、この大本に立って異端の教えを退け、忠君愛国の実践哲学を唱えたものだ。その説はしばしばやや極端に走り、時にはこじつけもあるが、この道の根本を確立した点で、日本神道史上の大人物というにふさわしい。また、その生涯の歩みも、世の模範となるべき人である。本書は――翁を研究しようとする人にとって、古い事柄を学ぶための参考書となるだろう。"
  "translation_status": "reviewed"

  "translation_ja": "夫婦は互いに和やかに」ということは、儒教ばかりでなく、仏教でもキリスト教でも言うでしょう。しかし、帝国憲法と外国の憲法は同じだと言っても、文字は同じかもしれませんが、精密な目を持つ者、精密な観察眼を持つ者は、日本の帝国憲法と外国の憲法が、最も重要な冒頭の第一条ですでに違っていることに気づくのです。その第一条には何と書いてあるか。「大日本帝国は、万世一系の天皇がこれを統治する」と規定されています。世界には国がたくさんあり、憲法もたくさん施行されていますが、その多くの国、多くの憲法の中で、このようなことを規定している憲法がどこにあるでしょうか。わが憲法はわが帝国統治の大きな模範であり、神道そのものを示した一つの形です。このような憲法は、どこの国にも見ることができません。これこそ、わが憲法と外国の憲法とが根本的に違うところです。それと同様に、教育勅語にも言葉には多少似たところがあるかもしれませんが、その精神の根本では大いに違っています。世の中の近視眼的な人々は、この根本の精神を見抜けません。もし精密な目で見たならば、教育勅語についても必ずその根本が異なることを見抜けるだろうと思います。この根本こそ、わが帝国の大道なのです。"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "のであると云ふ意味で、殊に此の荷田春滿翁の歌は最も克く神道の本意を明らかにして居るものである。斯う云ふ次第で私は教育勅語は我が國民の悉く行はなければならぬ道である。即ち是れが神の道である。我が帝國固有の大道である。と斯う云ふ風に結論したいのであります。"

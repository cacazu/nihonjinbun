- "id": "std-p0033-001"
  "section_id": "main-std-p0032-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "當りては大いに異つた點がありませう。けれども教育其の物に至つてはそんな區別はないのである。教育は人を人とし、國民を國民として施すべきものである。決して農業教育、商業教育、工業教育と云ふ樣な特別な教育は無い。教授に於いて區別があるけれども、教育其の物に區別は無いのであります。夫れ故に教育勅語には苟くも我が國民である以上は農業家でも工業家でも商業家でも、或は又政治家でも、法律家でも學者でも總べて皆必ず斯の道に依つて行かなくてはならないと云ふ事を示されたのである。是れが抑教育勅語の御精神であるのです。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "62"
    "printed_page_end": "63"
    "url": "https://dl.ndl.go.jp/pid/943543/1/33"
    "source_sequence": 32
  "translation_ja": "当たっては、大きく異なる点があるでしょう。しかし、教育そのものには、そのような区別はありません。教育は、人を人として、国民を国民として行うべきものです。農業教育、商業教育、工業教育というような特別な教育があるわけではありません。教授する内容には区別がありますが、教育そのものには区別はないのです。したがって教育勅語は、いやしくも日本の国民である以上、農業家でも工業家でも商業家でも、また政治家でも法律家でも学者でも、すべての人が必ずこの道に従わなければならない、とお示しになったのです。これが、そもそも教育勅語の御精神なのです。"

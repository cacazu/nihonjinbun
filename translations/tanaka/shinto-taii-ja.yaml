- "id": "std-p0010-002"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "是れに就いては本居宣長翁の言葉に、凡べて神とは古への御文等に見えたる大地の諸々の神達を始めて、それを祠れる社にまします御靈をも申し、又人は更にも云はず、鳥でも獸でも草でも木でも海でも山でも何でもかでも尋常でない優れた德のある所のものは皆神である。本居宣長翁は斯う云つて居る。それから又平田篤胤翁は、神はかびと同じ事である、かびのかは彼の意にて物をそれと指て云ふことで、びは靈妙なるものを云ふ語である。即ち神は尊くして侵すべからさる一種靈妙なるものである。是れが平田翁の說である。其の門人の鈴木重胤翁此の人も同じやうな說を唱へて居る。斯う云ふ樣な說は凡べて神道學者の間に信ぜられて居るのでございます。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "16"
    "printed_page_end": "17"
    "url": "https://dl.ndl.go.jp/pid/943543/1/10"
    "source_sequence": 9
  "translation_ja": "これについて本居宣長翁は、およそ神とは、昔の文献に見える大地のさまざまな神々をはじめ、それを祭る社にいらっしゃる御霊のこともいい、また、人はいうまでもなく、鳥でも獣でも草でも木でも海でも山でも、何であっても、尋常ではない優れた力のあるものはみな神である、と述べています。それから平田篤胤翁は、「神」は「かび」と同じで、「かび」の「か」は「彼」の意味で、ものをそれと指していう言葉であり、「び」は霊妙なものを表す言葉である、と述べています。つまり神とは、尊く、侵すことのできない、一種霊妙なものだというのが平田翁の説です。その弟子の鈴木重胤翁も、同じような説を唱えています。こういう説は、神道学者の間で広く信じられているのです。"
  "translation_status": "reviewed"

  "source_text": "實にや鈴の舍一代の偉業は今更之を呶々するの要を見ずと雖も、その精神を研究し、その遺業を祖述せんは、また容易の業にあらず。著者專ら我國固有の、大道を正し、我國民教育の學理と實際との上に貢献する所あらんことを期し之を哲學の見地よりして評論するものなり。先きの「平田篤胤之哲學」と併せ見るあらば、自ら「實踐哲學に於ける忠君愛國の說、綱常彝倫の教」は闡明にせられむ。その研究の飽まで眞面目にして、偉人宣長を系統的に解釋せんことを努められたる、眞に著者を俟つて初めて得たるものといふべし。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/42"
    "source_sequence": 41
  "translation_ja": "確かに、鈴の舎〔本居宣長〕の生涯の偉業について、今さらくどくど述べる必要はない。しかし、その精神を研究し、遺した学問を受け継いで述べることは、容易ではない。著者は、わが国固有の大道を明らかにし、国民教育の理論と実践に貢献したいと願って、哲学の立場からこれを論評している。先の『平田篤胤の哲学』と併せて読めば、「実践哲学における忠君愛国の説、人倫の常道についての教え」は、おのずと明らかになるだろう。その研究はどこまでも真摯であり、偉人宣長を体系的に解釈しようと努めた成果は、まさにこの著者を待って初めて得られたものといえる。"
  "translation_status": "reviewed"

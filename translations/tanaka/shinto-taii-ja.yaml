  "source_text": "云ふのは成程事實かも知れない。けれども外國にもさう云ふ例は幾らもある。伯夷叔齊の如きは武王の紂を討つに臨んで馬を叩いて諫めて臣として君を伐つ忠と云ふべきかと、かう云つて諫めた。又遂に周が天下を取つて仕舞つてからは首陽山に隱れ周の粟を食はずと云つて蕨を食つて居つたが遂に餓死して仕舞つた。或は又レオニダス、是れはスパルタの王であるが僅に三千計りの兵を率ゐてペルシヤ二百萬の侵入軍を支へて、遂にスパルタ雅典の國家を全うしたではないか。さうして自分の身體は國家のために犠牲にしたではないか。是れ等は皆君の云ふ神道と同じではないか。又ネルソンと云ふ人は何うであるか。ナポレオンが彼の隆々たる勢ひを以つて佛蘭西の主權者となり、佛蘭西·西班牙の聯合艦隊を以つて英吉利を一擧に取ひしがうと掛つた時に、ネルソンは之れをトラフアルガーの一戰で打破つた。其の破り方が一樣でない。彼れは先づ戰の初に當つて將士に訓令して何と云つたか即ち英吉利の軍艦は······英吉利の海軍は如何なる場合に於いても人道を重んじなければならぬ。一度び敵が白旗を揭げたならば之れに發砲しては可かぬと云ふ事を嚴命した。而して其の例を自ら示さんが爲に敵の旗艦が白旗を揭げて進んで來たので、其の發砲を止めた所が、豈に圖らんや敵はネルソンを狙擊したのである。其の狙擊の一彈にネルソンは斃れたのである。詰り彼れの所謂人道を重んじて彼れの所謂人道の犧牲になつたのであります。外國にも斯う云ふ立派な人を見出す事が出來るではないかと云ふ問題が起る。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "22"
    "printed_page_end": "23"
    "url": "https://dl.ndl.go.jp/pid/943543/1/13"
    "source_sequence": 12
  "translation_ja": "いうことは、なるほど事実かもしれない。しかし、外国にもそういう例はいくらでもある。伯夷・叔斉は、武王が紂を討とうとしたとき、馬をたたいて引き止め、『臣下として君主を討つのを、忠といえるのか』と諫めた。また、ついに周が天下を取ってしまうと、首陽山に隠れ、周の粟は食べないと言ってワラビを食べ、ついには餓死した。あるいはレオニダスはスパルタの王だが、わずか三千ほどの兵を率いて、ペルシア二百万の侵入軍を食い止め、ついにはスパルタとアテネという国家を守りぬいたではないか。そして自分の身を国家のために犠牲にしたではないか。これらはみな、あなたのいう神道と同じではないか。またネルソンはどうか。ナポレオンが盛んな勢いでフランスの主権者となり、フランスとスペインの連合艦隊によってイギリスを一挙に打ち破ろうとしたとき、ネルソンはトラファルガーの一戦でこれを打ち破った。その勝ち方も尋常ではなかった。彼は戦いの初めに将兵へ何と訓令したか。イギリスの軍艦は――イギリスの海軍は、いかなる場合にも人道を重んじなければならない、敵が一度白旗を掲げたら、それに発砲してはならないと厳命した。そして自らその模範を示そうと、敵の旗艦が白旗を掲げて進んできたので発砲を止めると、意外にも敵はネルソンを狙撃した。その一発でネルソンは倒れた。つまり、彼のいう人道を重んじ、その人道の犠牲になったのである。外国にも、こういう立派な人物が見つかるではないか」。こういう問題が出てきます。"
  "translation_status": "reviewed"

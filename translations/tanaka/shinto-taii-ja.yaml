- "id": "std-p0013-002"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それは成程立派である。立派ではあるけれども私は此の行ひの精神、行ひの根本と云ふものが我が國の人の行つた根本の精神とは大變に違つて居ると思ふのである。又、我が國にも隨分惡い者が少なくなかつた。けれども支那の樣に萬乘の君主を放伐して自ら君主となると云ふ樣な、所謂湯武の放伐と云ふ樣な事は無いのである。王莽が漢の皇位を奪ひ、或は魏の曹孫が後漢の皇位を脅し、或は又西洋で云へばピピンがフランク國を奪つてフランクの王位に即"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "22"
    "printed_page_end": "23"
    "url": "https://dl.ndl.go.jp/pid/943543/1/13"
    "source_sequence": 12
  "translation_ja": "それは確かに立派です。しかし立派ではあっても、私は、その行いを支える精神や根本が、日本人の行為の根本精神とは大変違っていると思うのです。また日本にも、悪い者はずいぶんいました。しかし中国のように、大国の君主を追放して討ち、自分が君主になる、いわゆる湯王や武王による君主追放・討伐のようなことはありません。王莽が漢の皇位を奪い、魏の曹孫が後漢の皇位を脅かし、また西洋でいえば、ピピンがフランク国を奪ってフランクの王位に就"

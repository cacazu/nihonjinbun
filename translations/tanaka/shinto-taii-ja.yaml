    "text": "の結果として最も神聖なる〓育に從事する者でも、矢張り其の風潮に促されて來た。將來の日本國民を作る〓育家が徒に輕兆浮薄に流れ西洋心醉主義ともいふべきものを以つて〓育に從事するやうになつて來た。其の結果たるや實に智者を待たずして明かなる狀態になつて來た。さう云ふ有樣で實に當時の日本の社會の狀態は甚だ寒心すべき現象を呈して來た。それをば九重の上より御覽遊ばして、先帝陛下は大いに宸襟を惱まさせれて斯ういふ風な〓育を施して居つたならば、將來の國民はどうなるだらうか。斯ういふ事を大いに御軫稔遊ばして.それで今より廿五年前即ち明治二十三年の十月三十日に彼の〓育勅語を御發布になつた次第である。彼の〓育勅語が一たび出て今まで百鬼晝行の此の社會の混亂は一大燈明臺を得たのである。今まで混亂して居つた〓育界は玆に一大指南車を得たのである。即ち此の〓育に關する勅語は燈明臺となり指南車となて〓育界を指導して行くやうになつて來たのであります。"

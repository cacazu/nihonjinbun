    "text": "『東京朝日新聞』(九二三八號)評本居宣長の世界、人生に關する一代の學說を系統的組織的に述べたる書にし故に一面より見れば我て、併せて其學統に屬する學者の學說をも叙述せり。邦に於ける復古神道派の哲學を綜說せるものと謂ふべく、祖宗の遺訓を闡發せる皇道即ち神道派の世道人心の上に及ばせる功績は此書出でたるがためにいよ〓〓顯著なるべし。『讀賣新聞』(一二五八二號)評田中義能氏さきに「平田篤胤之哲學」を著はす、本居は即ち平田の師事せし所、著者の近業ある所以なり、思ふに著者が復古神道派の哲學に忠ならんとする精神は、此の二書によりて十二分に江湖に知られたりと謂ふ可し。『萬朝報』(六七三六號)評本居宣長が神道哲學の鼓吹者として將た國學者として、我國思想史上の大立物たるは言はずもがな。其熱誠をこめたる忠君愛國說の、やがて維新の鴻業に及ぼせる影響も亦甚だ大ならずんばあらず。著者曩に平田篤胤之哲學を著して、今又此偉人を說き、學說は勿論進んでその學統に屬する多數學者の諸說をも叙し、所謂復古神道學派の哲學を明にせんとしたり。考證頗る之を努め所論穩健。大體に於て能く其時代と人との面影を說き得たるを見る。學哲之長宣居本『神風』(一二三號)評我が神道學者として造詣深き文學士田中義能氏は、前に平田篤胤之哲學を刊行せられ斯道界に一大貢獻を與へられたる事は遍く世人の敬慕する處なるが今囘更に本居宣長之哲學てふ一書を公にせられたり天明寬政の交該博なる學、卓拔なる識を以て我が神道哲學を攻究し、復古神道を天下に唱へ、以て固有の大道を喚起し、奮然として思想界に一大革新を大成せしめられたる我思想史上の大偉人本居大人は、愈氏によりて完全なる哲學的研究を試みられたり。而も熱誠にして朴直なる著者が、非凡の研鑽は史家の本領たる公平を旨として、終始一貫し、史材蘊奧、文彩燦然として、通讀百遍敢て倦まず、讀者をして自ら襟を正さしむる者あり。蓋し之大人の遺德なると共に、著者が常に我が學界の重鎭として、夙に我が國民〓育の學理と實際との上に貢獻せらるゝの深きによるなるべし。吾人は茲に一言して氏の研究を社會に紹介し、國民垂〓の勞を多とする所以也『神社協會雜誌』(第十一年第五號)評その精神を<實にや鈴の舍一代の偉業は今更之を呶々するの要を見ずと雖も、研究し、その遺業を祖述せんは、また容易の業にあらず。著者專ら我國固有の、大道を正し、我國民〓育の學理と實際との上に貢献する所あらんことを期し之を哲學の見地よりして評論するものなり。先きの「平田篤胤之哲學」と併せ見るあらば、自ら「實踐哲學に於ける忠君愛國の說、綱常彝倫の〓」は闡明にせられむ。その研究の飽まで眞面目にして、偉人宣長を系統的に解釋せんことを努められたる、眞に著者を俟つて初めて得たるものといふべし。五反の論世響"

  "translation_ja": "ないことを、いつも悲しんでいました。それにこの病弱な身ですから、いつまでも生き長らえたところで仕方がありません。どうか早速、死刑にしていただきたい。そうすれば殉教者の仲間入りもできるのですから、これほどありがたいことはありません。」これがバヂリウスの言った言葉です。しかも西洋では、このことが立派なこととして伝えられているのです。どうでしょう、日本民族にこのようなことが言えるでしょうか。"

  "source_text": "て、實に普遍的の道であるのである。勿論神道は天御中主神の御德が天照大神と申す偉大なる御神を通して發揮せられて、茲に其の政治、宗教、道德等各方面の實踐的大道の淵源を有する所の道である。從つて天照大神及びその以下の神々の道としては、我が國民と特殊の關係を有つて居るけれども、天御中主神の道として見る塲合に於いては、世界有ゆる所に行はるゝ所の道である。宇宙間の森羅萬象悉く之れに包含せらるゝ所の道である。今暫らく下つて天照大神及びその以下の神々の道として見るに、神道は吾々の已に色々述べて來たやうに、我が國民固有の道である。そして其の道は勿論種々の神々によりて示され、明治大神とましますべき、先帝陛下によりても、軍人に賜はりたる勅諭、戊申詔書等種々の御言によりて示されあるも、最もよくその要旨を示されたるは、教育勅語であるは、已に詳述したるが如くである。コー云ふ性質を有する神道は、遂には全く人類社會に普遍たるべきものであると云ふことがわかるのである。獨逸國民は獨逸皇帝は世界に王たるべき者であると考へて居る。而して獨逸の世界統一は世界の幸福であると彼れ等は主張して居るのである。彼れ等は斯う云ふやうな觀念の下に、今日の戰爭をやつて居るのである。けれども我が日本は、平田翁が言はれた通りに世界の最も勝れた國である。そして世界の王たるべき所の國であると思ふのである。是れは決して彼れ等獨逸人のやうに自負的に言ふのでなく、事實に於いて言ふのである。一體我が國が維新の際には、未だ十分に外國と交通しないものであつたから、我が國情は外國人に分らない。日本人と云ふものを非常に馬鹿にしたものである。當時橫濱に外人の居留地があつたが、其の公園に建札をして曰はく。「犬及び日本人此の中に入るべからず。」斯う云ふ工合に日本人を馬鹿にして居つたのである。然るに今日に於いては、犬よりも以下と認めて居つた所の日本と、英吉利とは同盟を結んで居る。又露西亞に於いては、日露同盟の必要なることを識者の間に唱へられて居るのである。斯う云ふ工合になつて來る"

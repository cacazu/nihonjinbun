- "id": "std-p0004-001"
  "section_id": "main-std-p0002-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "のみ接し、未だ曾て一回も明瞭なる答に接したことはない。」斯ういふ事をダルヴィエルラ伯が書いて居らるゝが其の通りであらうと思ひます。從來さういふ傾があるのであります。神道といふものに就いて一體に無智である。實際自分が實行して居ながらも無智である。そこで忠孝ランプ論だの、祭祀祈禱反對論だの、間違つた考を懷くものも多く出てくるのであります。では一體神道といふのはどういふものかと云ふ一大問題が起つて來るのであります。是に於いて私は神道の大意を說いて之れが解決を試みて見やうと思ひます。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "4"
    "printed_page_end": "5"
    "url": "https://dl.ndl.go.jp/pid/943543/1/4"
    "source_sequence": 3
  "translation_ja": "しか接したことがなく、まだ一度も明瞭な答えを聞いたことがない。」ダルヴィエルラ伯はこう書いていますが、そのとおりだろうと思います。以前から、そういう傾向があるのです。神道というものについて、全般に無知なのです。実際に自分が実行していながら、それを知らない。そこで忠孝ランプ論や祭祀・祈禱反対論など、間違った考えを抱く人も多く出てきます。では、いったい神道とはどういうものなのかという大きな問題が起こってきます。そこで私は神道の大意を説き、この問題の解決を試みてみようと思います。"
  "translation_status": "reviewed"

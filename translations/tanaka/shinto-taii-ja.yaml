- "id": "std-p0012-001"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "は和氣の清麿公が忠誠を盡した如く吾々も君國に對して忠誠を盡したいと思ふ。又天滿宮に詣つては菅原道眞公の如く君國に盡したいと思ひ、湊川神社に詣つては正成公の如く忠勤を勵みたいと思ふ。或は又東照宮に詣つては徳川家康公の「人の一生は重き荷を負ふて遠き道を行くが如し」と教を垂れられた事を思ひ起して其の人を追慕する。勿論此の遺訓は家康公が云つたものか何うかと云ふ事は歷史家の問題であるが、少なくとも德川家康公は之れを自身に實行した所の人物であると思ふ。此の實行が即ち吾々の摸範になるのである。是れが爲に吾々は東照宮の東照宮として尊き所以を見るのであります。つまりかう云ふ風な事が皆神道の一部分を爲して居るのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "20"
    "printed_page_end": "21"
    "url": "https://dl.ndl.go.jp/pid/943543/1/12"
    "source_sequence": 11
  "translation_ja": "は、和気清麿公が忠誠を尽くしたように、自分たちも君主と国家に忠誠を尽くしたいと思います。また天満宮に参拝しては、菅原道真公のように君主と国家に尽くしたいと思い、湊川神社に参拝しては、正成公のように忠勤に励みたいと思います。また東照宮に参拝しては、徳川家康公が「人の一生は、重い荷を背負って遠い道を行くようなものだ」と教えを残したことを思い出し、その人を慕います。もちろん、この遺訓が家康公の言ったものかどうかは歴史家の問題ですが、少なくとも徳川家康公は、それを自分自身で実行した人物だと思います。この実行が、私たちの模範となるのです。そこに私たちは、東照宮が東照宮として尊い理由を見いだします。つまり、こういうことがすべて神道の一部分をなしているのです。"

- "id": "std-p0006-001"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "て見る事の出來ない金甌無缺の帝國を維持し且つ發展して行くのであると、斯う私は信ずるのでございます。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "8"
    "printed_page_end": "9"
    "url": "https://dl.ndl.go.jp/pid/943543/1/6"
    "source_sequence": 5
  "translation_ja": "見られない金甌無欠の帝国を維持し、発展させていくことができるのだと、私は信じています。"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943543"
    "original_unit_id": "943543_0000006:0"
  - "source_id": "ndl-943543"

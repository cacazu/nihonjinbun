    "source_sequence": 42
  "translation_ja": "ある人は、神道には宗教と呼ぶほどの価値がないという。なるほど、日本の神道には聖書やコーランや各種の仏典のような完備した経典はないかもしれない。しかし、復古神道家の宇宙説、創世説、神祇説に宗教的、また哲学的価値がないといえるだろうか。復古神道に見いだされるさまざまな哲学は、実に外来文明の影響を受けない純粋な日本民族の宇宙観・神霊観である。これを研究する価値がないとして一笑に付す者がいるなら、その人は自分の属する民族の思想の発展を無視した人といってよいと思う。"

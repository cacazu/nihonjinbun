- "id": "std-p0040-008"
  "section_id": "ads-scan-40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "從來の教育學の家庭教育に關する注意尠なきのみか家庭教育も學校教育も極めて雜駁なる研究の裡に委せらるゝを憾み教育の始期を母胎教育に始まるとして家庭教育に於ける一切の注意及び學理を極めて精細に學理及び實驗の兩面より叙述又丁寧にして然も根柢ある事實の興味を旨とし言文一致體を採れるまで注意到れり家庭何人も讀んで益を得ること多し"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/40"
    "source_sequence": 39
  "translation_ja": "従来の教育学では家庭教育への注意が少ないばかりか、家庭教育も学校教育もきわめて雑駁な研究に委ねられていることを遺憾とし、教育は胎内にいる時から始まるとして、家庭教育におけるあらゆる注意事項と学理を、理論と実験の両面からきわめて細かく述べている。また、丁寧で、しかも根拠ある事実の面白さを大切にし、言文一致体を採用するところまで配慮が行き届いている。家庭の誰が読んでも、多くの利益を得られる。"
  "translation_status": "reviewed"

- "id": "std-p0021-001"
  "section_id": "main-std-p0020-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "のだ。腹の方を撫でた者は大變ゴツ〳〵塗り方の下手な壁のやうなものだ。と斯ういふ風な解釋をするのであります。どうも前にも述べた學者の說は之れに類似した說ではないかと思はれます。神道と申すものは儒道、佛道その他道と云ふものゝ中で範圍の極めて大きいものであります。平田篤胤翁が『古道大意』で何の學問がイツチ大きいぞと云ふにチト自分勝手のやうなれども、御國即ち我が國の學問程大きなものはないでござると申され、又『入學問答』といふ本に皇國の學問程高大なるものは無しと言はれて居ります。其の通りで神道は範圍の大きなもので中々百千萬の象どころではありません。で、たとひ一代の大學者でも、時勢、境遇或は時代の知識の程度と云ふものを脫することは出來ません。如何に大學者でも時代の知識より抜け出ることは出來ません。時代の最高の知識を集めた人がその時代の大學者で、それより以上に飛出すことは出來ません。かういふ時勢、境遇、時代の知識と云ふ雲が掛つて居るものですから、たとひ大學者でもかくも廣大なる神道はすつかり見ることが出來ないのであります。所が今日は大正の大御世になりまして文物粲然として發達して來ましたものですから、時勢、境遇も急速に變化し、時代の知識の程度も非常に進んで來て參りました。昔の北畠親房·一條兼良山崎闇齋·本居宣長等の大先生だちの時代とは大變知識の程度が進んで參りました。普通の人でも其の當時の豪らい人位の知識は持つて居ると云ふやうに今日は大變知識の程度が發達して來ました。斯ういふ發達して來た所の知識、之れを基礎として研究して見ますならば、比較的正確な判斷を得られます。さう云ふ判斷で見ますと神道は政治である、道德である、宗教であるなどいふ風な一の見解を與へるのは前世紀の議論と言つて宜からうと思ふのでございます。"

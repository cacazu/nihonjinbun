- "id": "std-p0040-010"
  "section_id": "ads-scan-40"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "學校教育としての教育學の書は乏しからざるも家庭教育を科學的に研究した者の少いのは遺憾である何となれば教育の基礎は家庭にあるものであるから此の教育が完全に行はれなければ學校教育も充分なるを得ないからである、文學士田中義能君は篤學の士である、其の大學院にある頃より斯道に關する歐米大家の著書は勿論和漢古今の斷片零墨までも渉獵せられ、且之を自己愛兒養育の實驗に徵し本書を大成せらる叙述序あり說明懇切を極め實に我國に於ける此種の著書の白眉といふべきである故に愛兒の教育に苦心せらるゝ父母及將來賢夫良妻たらんとせらるる兄姉及教育家は之を熱讀せられなば多大なる利益を得らるゝことは疑ありませぬ"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/40"
    "source_sequence": 39
  "translation_ja": "学校教育を扱う教育学の本は少なくないが、家庭教育を科学的に研究したものが少ないのは残念である。教育の基礎は家庭にあり、家庭教育が完全に行われなければ学校教育も十分なものにはならないからだ。文学士田中義能君は、学問に打ち込む人である。大学院にいた頃から、この分野の欧米の大家の著書はもちろん、日本と中国の古今の断片的な記述まで広く読み、自分の愛児を育てた実際の経験と照らし合わせて、本書を完成させた。叙述には順序があり、説明はきわめて親切で、実にわが国のこの種の著書の中で最も優れたものというべきである。だから愛児の教育に苦心する父母、将来よい夫・よい妻になろうとする若い皆さん、そして教育者が熟読すれば、多大な利益を得られることは疑いありません。"
  "translation_status": "reviewed"

  "kind": "paragraph"
  "origin": "source"
  "source_text": "兒童の成長後如何なる人物となるかは兒童の遺傳、性癖、境遇等に基くと雖も亦家庭の教養如何に關係する所多し自ら一世に卓越せる顯官を帶び高位にあるものと雖も其子にして往々不良低能の子を養ひ自ら憂慮と不快とに捕はれつゝあるは現世幾多の實例あり是に於てか家庭教育の問題は實際問題として蓋し痛切ならずんばあらず本書は著者が之を救濟せんとて公にしたるもの家庭教育の意義並に目的より說き起して根柢論たる結婚住居姙娠胎教に及び養護論に入りては出產飮食衣服睡眠入浴子守を論じ疾病傳染病看病法を說き智育論に入りて初歩の教育家庭教育社會教育を擧げ情育論に於ては愉快に其實情を論じて救濟法に及び意育論には意志の陶冶習慣の養成を說き家庭教育の印象を論じ尙餘論として母の任務家庭教師等の事を論ず子を持つ父母たるものゝ一讀すべき良書たり"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/40"
    "source_sequence": 39
  "translation_ja": "子供が成長後にどのような人物になるかは、遺伝、性質、境遇などによるとはいえ、家庭でどう育てられるかにも大きく関係する。自分は世に抜きん出た高官で高い地位にある人でも、しばしば素行の悪い、あるいは知的能力の低い子供を育て、心配と不快な思いにとらわれている例は、今の世にも数多い。だから家庭教育は、現実の問題として切実なのである。本書は著者がこの問題を救おうと公刊したものだ。家庭教育の意義と目的から説き始め、基礎論として結婚、住居、妊娠、胎教に及ぶ。養護論では出産、飲食、衣服、睡眠、入浴、子守を論じ、疾病、伝染病、看病法を説く。知育論では初歩の教育、家庭教育、社会教育を取り上げ、情操教育論では、その実情を愉快に論じて救済法にも及ぶ。意志の教育論では意志の陶冶や習慣の形成を説き、家庭教育が与える印象を論じ、さらに補論として母の役割、家庭教師などを論じる。子供を持つ父母が一読すべき良書である。"
  "translation_status": "reviewed"

  "source_text": "凡そ生きて居る物は何でも生存競爭して居るのであります。例へば其處に蟬が一匹啼いて居るとしますと、それを雀が行つて取らうとして居る、其の蟬を取らうとして居る雀を鷹が取らうとして居る。すると又其の雀を取らうとして居る鷹を獵師が取らうとして居る。斯う云ふ樣な工合に此の世に生きとし生ける物は總べて生存競爭をして居る。且つ此の生存競爭は生きとし生ける物の中に最も高等なる所の人類に於いても絕えないのである。けれども此の人類の生存競爭と云ふものは上に國家と云ふものがありますからして、其の生存競爭は太古の野蠻的の如く、或は下等動物の樣な野蠻的の競爭はしない。極めて高等なる競爭をして居るのである。併し此の國家其のものになつて來ると云ふと、上に制するものが無いので萬國公法などと云ふものがあつても其の勢力は極めて微弱である。一度權力の平均を失したらなば其の勢力は極めて微弱である。さう云ふ工合であるからして國家と國家との生存競爭と云ふものは極めて激烈である。極めて慘酷である。昔から斯う云ふ風に國家と國家とは互ひに生存競爭をして居つた。而かも極めて慘酷なる極めて劇烈なる生存競爭をやつて來たのであります。それでありまするからして世界の各國が興亡實に限りが無いのである。實に修羅的の競爭と云つて宜い。斯う云ふ樣な修羅的の劇烈なる競爭をやつて來て居る所の國家の中に介在して我が此の大日本帝國は、幾千年の間少しも土地を外國に奪はれもしない、所謂金甌無缺の帝國を維持して來たと云ふのは何う云ふ譯でありませうか。是れが一大疑問である。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"

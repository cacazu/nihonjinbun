- "id": "std-p0004-003"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "抑も我が國が上下幾千年東海の表に國を爲して寸土も外國の爲に侵されず實に正確なる意味に於けるところの金甌無缺の帝國を維持し來り、國威日に揚り、月に盛に、國運年と共に益々發展して行くと云ふ所以は何處にありますでせうか。試みに地球儀に就いて見ます。試みに世界の地圖に就いて見ます。世界に多くの國の羅列して居る事と云ふものは實に數ふるに遑なき程であります。斯う云ふ世界の各國がです。太古からして今日に至る迄果して同じ現今の狀態を維持して來たものでありませうか。是れが維持して來たものでない事は誰れにでも解りませう。若し是れが太古から此の儘遺つて來て居るものであると云ふものでありましたならば、少し其の者に反問して見れば分ります。昔、彼斯の二百萬の軍隊を引受けて戰爭した所の雅典、スパルタの國は今日は何處に在るか。或は又世界を征服せんとした所のアレキサンドル大王の領圖は今日何處にあるか。或は又地中海を自分の家の如くに考へて居つた所の羅馬帝國は今日何處にあるかと。勿論斯う云ふ國家の占めて居つた所の土地は依然として遺つて居るけれども、其の國家其のものは既に亡びて二千年。昔の夢となつて居るではありませぬか。斯くの如く國家は常に盛衰興亡して來て居る。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "4"
    "printed_page_end": "5"
    "url": "https://dl.ndl.go.jp/pid/943543/1/4"
    "source_sequence": 3
  "translation_ja": "そもそも日本が、はるかな数千年の間、東海のほとりに国を築き、わずかな土地も外国に侵されることなく、まさしく金甌無欠、すなわち国土に欠けたところのない帝国を維持し、国威が日ごと月ごとに高まり、国運が年とともにますます発展していく理由は、どこにあるのでしょうか。試しに地球儀を見てみましょう。世界地図を見てみましょう。世界には、数えきれないほど多くの国が並んでいます。これら世界の国々は、太古から今日まで、本当に今と同じ状態を維持してきたのでしょうか。維持してきたのではないことは、誰にでも分かるでしょう。もし太古からこのまま残ってきたのだという人があれば、少し問い返してみれば分かります。昔、ペルシアの二百万の軍隊を相手に戦ったアテネやスパルタという国は、今どこにあるのか。世界を征服しようとしたアレキサンドル大王の領土は、今どこにあるのか。地中海を自分の家のように考えていたローマ帝国は、今どこにあるのか、と。もちろん、これらの国家が占めていた土地は今も残っています。しかし、その国家自体は滅びてすでに二千年、昔の夢になっているではありませんか。このように国家は、絶えず栄えたり衰えたり、興ったり滅びたりしてきたのです。"
  "translation_status": "reviewed"

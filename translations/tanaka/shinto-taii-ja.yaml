  "source_text": "此の唯上と云ふ內にも色々上下がある。一國の君主もあるし、或は又一縣の長官もある。一郡の長もあれば、一市一村の長もある。或は又一部落の長もある。是れ皆上である。神である。一部落の長でも上であるし一軒の家に就いても其の家の主人は上である。其の又主人の妻は御上さんである。お上さんも一つの優れて居る所の神の特性を持つて居る。唯其のデグリーが低いのです。程度が低いのです。それであるからしてお上さんの言葉、或はお上さんの行つた事は一家の御自分以下の者に影響を及ぼして行きますけれども、それ以上には中々及ぼさない。是に反して一國の最も豪い者、例へば柿本人麿公とか、和氣の清麿公、菅原道眞公、楠正成公、德川家康公だとか云ふ人々になると大變なデグリー、非常な程度の優越なる地位を持つて居る神である。かう云ふ神が尊い神であるので、吾々が彼の人麿神社に詣つては人麿公の歌を詠つた樣に、眞のま心の歌を詠つた樣に、自分もやりたい、あゝ云ふ人になりたいと思ふ。又彼の護王神社へ詣つて"

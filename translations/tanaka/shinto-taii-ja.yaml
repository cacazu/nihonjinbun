- "id": "std-p0016-002"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それからして又私はもつと甚だしい例を擧げて見やうと思ふ。それは宗教界の大立者であり基督教徒に於いては神樣の樣に崇敬されて居る所のルーテル、宗教改革家のルーテルであります。彼のルーテルは宗教改革を始めまするより以前に羅馬へ行つた事がある。羅馬へ行つて羅馬の大會堂に參詣した。其の時に彼れは何う云つたか。あゝ吾れは何うも不幸である。未だ己の御父さん御母さんが生きて在らつしやるが實に殘念だ。死んで居つて吳れゝば宜かつたと云つて悲しんだ。之れを聞いた人は吃驚して一體それは何う云ふ譯かと尋ねると。ルーテルの云ふには、イヤ此の大會堂に詣つて祈禱をすると云ふと兩親が死んで地獄に入つて居るのを救ふ事が出來るのである。今兩親が死んで居つて吳れゝば其れを救ふ事が出來たのに殘念であると云つて悲しんだ。先づ第一に兩親が地獄に居るものと考ふると云ふ事が大變な間違ひであると思ふ。が、是れは一步讓るとして、父母が死んで居つて吳れゝば宜いと云ふ事を口にすると云ふ事は實に驚き入つた事であると思ふ。併し乍らルーテルは親に孝行であると考へて斯う云つたのである。親に孝、君に忠、其の忠孝の言葉の中に含んで居る內容······形式に於いて假令同じであつても······其の內容、其の根柢に於いて東西甚しく異なつて居ると云ふのは此の點であると思ふのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"

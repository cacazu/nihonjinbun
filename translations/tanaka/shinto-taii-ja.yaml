  "source_text": "平田篤胤は本居宣長の學說を承けて神道の正義を鼓吹し、我邦國民的特性の發揮は即ち神道の體得にありとなし、盛に儒佛の二道を罵倒して自己學說の主張に其全生涯を傾注したる熱誠の國學者なり。著者今國民教育に資する所あらんとして此書を著はし、四編十六章に分ちて學說を論じ、經歷を傳へ、一々典據出所を明にして尨然たる大册をなす。名は哲學と謂へども要するに篤胤の研究なり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/45"
    "source_sequence": 44
  "translation_ja": "平田篤胤は本居宣長の学説を受け継いで神道の正しい教えを広め、わが国民の特性を発揮することは、すなわち神道を身につけることだとした。儒教と仏教を盛んに罵倒し、自説を主張することに生涯を傾けた熱烈な国学者である。著者は今、国民教育に役立てようと本書を著し、4編16章に分けて学説を論じ、経歴を伝え、一つ一つ典拠と出所を明らかにして、大部の一冊にまとめた。題名は哲学であるが、要するに篤胤の研究である。"
  "translation_status": "reviewed"

  "translation_status": "reviewed"
  "source_variants":
  - "kind": "ocr"
    "text": "帝日本大學〓育學講師東洋大學〓育學講師文學士新家庭〓育學刊日本大學〓育學講師東洋大學〓育學講師文學士田中義能先生著新洋裝全一冊家庭〓育學定價金壹圓四拾錢刊郵稅十二錢萬朝報」評家庭教育以て學校教育社會教育などゝ共に一個の特立したる教育學たらしめんとして、之を系統的に論述したるものそがて此家庭教育學なり、篇を分つこと八更に之を二十九章八十九節に分ち家庭教育の意義由來目的より始めて結婚住居姙娠胎〓出產哺乳子守疾病看病智育情育意育母の任務家庭教師などに至るまで極めて微に入り細に亘りて詳述し擧げられたる項目の數のみにても實に四百數十の多きに及び、述論整然として頗る要を得系統的に論述されたる此種の著書として蓋しオーソリチーたるに足らん加ふるに口語調を採りて平易なる記述を試みたるは双手を擧げて吾人の最も歡ぶ所、評者は此書を一般家庭の珍として推奨するに吝かなるものにあらざるなり「東京日日新聞」許兒童の成長後如何なる人物となるかは兒童の遺傳、性癖、境遇等に基くと雖も亦家庭の〓養如何に關係する所多し自ら一世に卓越せる顯官を帶び高位にあるものと雖も其子にして往々不良低能の子を養ひ自ら憂慮と不快とに捕はれつゝあるは現世幾多の實例あり是に於てか家庭教育の問題は實際問題として蓋し痛切ならずんばあらず本書は著者か之を救濟せんとて公にしたるもの家庭〓育の意義並に目的より說き起して根柢論たる結婚住居姙娠胎〓に及び養護論に入りては出產飮食衣服睡眠入浴子守を論じ疾病傳染病看病法を說き智育論に入りて初歩の〓育家庭〓育社會資金杯信息は予以後に其所命にしています家庭教育の印象を論じ尙餘論として母の任務家庭教師等の事を論ず子を持つ父母たるものゝ一讀すべき良書たり「國民新聞」評從來の教育學の家庭〓育に關する注意尠なきのみか家庭教育も學校教育も極めて雜〓なる〓究の裡に委せらるゝを憾み教育の始期を母胎教育に始まるとして家庭〓育に於ける切の後なおかんとでも思いとの興味を旨とし言文一致體を採れるまで注意到れり家庭何人も讀んで益を得ること多し「靑年及靑年團」評いのは遠郷である何これれ數會の基礎は家隆にあるのであるから此學校教育としての教育學の書は乏しからざるも家庭教育を科學的に〓究した者のが完全に行はれなければ學校教育も充分なるを得ない0らである、文學士田中義能君は篤學の士である、其の大學院にある頃より期道に關する歐米大學の著書は勿論和漢古今の斷片零墨までも渉獵せられ、且之を自己愛兒養育の實驗に徵し本書を大成せらる叙述序あり說明懇切を極し實に我國に於ける此種の著書の白眉といふべきである故に愛兒の〓育に苦心せらるゝ父母及將來賢夫良妻たらんとせらるる兄姉及教育家は之を熱讀せられなば多大なる利益を得らるゝことは疑ありませぬ文學士田神京東家會株社式同館文町保神表"

- "id": "std-p0047-010"
  "section_id": "ads-scan-47"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "平田篤胤は我神道史上の偉人として德川時代の思想界に一大異彩を放てるものなり、本書は其世界人生に關する學說を系統的組織に論述せるものにして或意味より云へば、神道哲學と西洋哲學との比較研究とも見るを得べく、全卷を總叙·學說·對異·統括の四編に分つ。行文明快にして論理の整然たる事、著者の態度の敬虔にして且公平なる事、引證該博而も著者特創の識見にも乏しからざる事等は最も著しき點なり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/47"
    "source_sequence": 46
  "translation_ja": "平田篤胤は神道史上の偉人として、徳川時代の思想界に大きな異彩を放った人物である。本書はその世界・人生についての学説を、体系的・組織的に論述したもので、ある意味では神道哲学と西洋哲学の比較研究とも見られる。全巻を総叙・学説・対異・総括の4編に分ける。文章が明快で論理が整然としていること、著者の態度が敬虔で公平であること、引用・論証が広範で、しかも著者独創の見識にも富むことなどが、最も際立つ点である。"
  "translation_status": "reviewed"
- "id": "std-p0047-011"
  "section_id": "ads-scan-47"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "近來に於ける大著として之を世人に推薦するに憚からざるなり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/47"
    "source_sequence": 46
  "translation_ja": "近頃の大著として、本書を世の人々に推薦することをためらわない。"
  "translation_status": "reviewed"

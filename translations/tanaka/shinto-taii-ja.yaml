    "source_sequence": 28
  "translation_ja": "結果、最も神聖な教育に従事する者さえ、やはりその風潮に動かされてきました。将来の日本国民を育てる教育者が、むやみに軽薄な傾向に流れ、西洋心酔主義ともいうべきものによって教育に従事するようになりました。その結果は、知恵のある人を待つまでもなく、実に明らかなものとなりました。そのようなありさまで、当時の日本社会は、実にひどく心配すべき状態を呈してきたのです。それを宮中からご覧になった先帝陛下は、大いにお心を悩ませられ、このような教育を施していたら将来の国民はどうなるだろうか、と深くご心配になりました。それで今から二十五年前、すなわち明治二十三年十月三十日に、あの教育勅語をお出しになったのです。教育勅語がひとたび出て、それまで百鬼が昼間から横行していたこの混乱した社会は、大きな灯台を得たのでした。それまで混乱していた教育界は、ここに大きな道しるべを得たのです。つまり、この教育に関する勅語が灯台となり、道しるべとなって、教育界を導いていくようになったのです。"

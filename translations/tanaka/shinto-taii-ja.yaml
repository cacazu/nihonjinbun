  "translation_ja": "と、日仏同盟もできるでしょうし、長い間にはアメリカとも同盟するようになるでしょう。そして、これが進めば世界の連邦――世界の同盟が成立し、すべての戦争が跡を絶つことになるだろうと思われます。その時、連邦の盟主となるべき者は誰でしょうか。それは、血統も優れ、国力も強く、人格も優れた者でなければならないと思います。そのような資格を持つのは、世界に国は多くても、わが天皇陛下、わが大日本帝国のほかにはないだろうと思います。陛下が世界の盟主となられることは、必ずしも空想ではないと思います。いつかは実現するに違いありません。その場合、神道は世界全体に行われる大道となります。すなわち神道は、日本の発展とともにますます発展し、ついには世界の至る所で行われる大道となるのです。この意味でも、神道は普遍的だと言うのです。わが帝国の国民は、朝夕いつもこのような大道を身をもって理解し、自ら実行し、ますます広め、日本の国運の発展を図らなければなりません。日本国民は、華やかなメリンスのような外国の道に惑わされず、立派な黒縮緬のような、自分たち固有の大道を身につけなければならないと思います。つまり、華やかなメリンスのようなものがいくらあっても、そちらに目を移さず、自分たち固有の大道を守り、日々、理想の実現へ向けて一歩ずつ進むべきです。これが大日本帝国の国民の天職であり、義務であり、私たち本来の務めだというのです。ですから、もしこの大道を誤解して、これはただ手を打つ道だとか、占いをする道だなどと言い、あるいは日本の道は偏狭で姑息で、頑迷な、最も卑しむべき道だなどと言って、不都合な主義思想にとらわれる者がいるなら、その者こそ私たちの敵だというのです。日本国民が最も恐れるべき敵は、ドイツではありません。アメリカでもありません。まさに、そのような者たちです。「獅子身中の虫」とは、これらの者たちのことです。もし日本国民が、ますます自分たちの大道を身をもって理解し、この明るく輝く国の光を世界中に輝かせたなら、アメリカも私たちの親しい"

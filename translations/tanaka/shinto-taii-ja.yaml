- "id": "std-p0031-001"
  "section_id": "main-std-p0026-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "夫婦相和しと云ふ事は儒教ばかりでなく佛教でも基督教でも申しませう。併し帝國憲法と外國憲法と同じであると云ふが、字は同じであるかも知れぬが精密なる眼を持つて居るもの、精密なる觀察眼を持つて居るものは日本帝國憲法と外國憲法とは一番重要な劈頭第一に於いて既に違つて居ることに氣が附くのである。即ち其の第一條には何と書いてあるか、大日本帝國は萬世一系の天皇之れを統治す」と規定されてある。世界に國は澤山あるけれども、世界に澤山憲法は布いてあるけれども、其の澤山の國、澤山の憲法中何處の憲法と雖も斯くの如き事を規定して居る事がありませうか。我が憲法は我が帝國統治の洪範、神道それ自身の一の發表で、かゝる憲法は何れの國に就いても見ることは出來ないのである。是れが抑々我が憲法と外國憲法と根本的に違つて居る所である。それと同じ樣に教育勅語に於いても其の言葉には多少似た所があるかも知れないが、其の精神の根本に於いては大變に違つて居る。世の近眼者流は此の根本の精神を見拔く事が出來ない。若し精密なる眼を以つて見たならば教育勅語に於いても必ず其の根本の異つて居る事を見抜く事が出來るであらうと思ふ。此の根本が即ち我が帝國の大道であるのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"

  "source_text": "我が神道學者として造詣深き文學士田中義能氏は、前に平田篤胤之哲學を刊行せられ斯道界に一大貢獻を與へられたる事は遍く世人の敬慕する處なるが今囘更に本居宣長之哲學てふ一書を公にせられたり天明寬政の交該博なる學、卓拔なる識を以て我が神道哲學を攻究し、復古神道を天下に唱へ、以て固有の大道を喚起し、奮然として思想界に一大革新を大成せしめられたる我思想史上の大偉人本居大人は、愈氏によりて完全なる哲學的研究を試みられたり。而も熱誠にして朴直なる著者が、非凡の研鑽は史家の本領たる公平を旨として、終始一貫し、史材蘊奧、文彩燦然として、通讀百遍敢て倦まず、讀者をして自ら襟を正さしむる者あり。蓋し之大人の遺德なると共に、著者が常に我が學界の重鎭として、夙に我が國民教育の學理と實際との上に貢獻せらるゝの深きによるなるべし。吾人は茲に一言して氏の研究を社會に紹介し、國民垂教の勞を多とする所以也"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/42"
    "source_sequence": 41
  "translation_ja": "神道学に深い造詣を持つ文学士田中義能氏が、先に『平田篤胤の哲学』を刊行して、この分野に大きく貢献したことは、広く世の人々が敬慕しているところだが、今回さらに『本居宣長の哲学』という一書を公刊した。天明・寛政の頃、広い学識と卓越した見識で神道哲学を深く研究し、復古神道を天下に唱え、固有の大道を呼び起こし、奮然として思想界に大革新を成し遂げた思想史上の大偉人、本居大人について、氏はいよいよ完全な哲学的研究を試みた。しかも、熱心で実直な著者の非凡な研究は、歴史家の本分である公平さを一貫して旨としている。史料は奥深く、文章は鮮やかで、百回通読しても飽きず、読者におのずと襟を正させるものがある。これは大人の残した徳によるとともに、著者が常に学界の重鎮として、早くから国民教育の理論と実践に深く貢献してきたからでもあろう。私たちはここに一言を述べて氏の研究を社会に紹介し、国民に教えを垂れるその労を大いにたたえる。"
  "translation_status": "reviewed"

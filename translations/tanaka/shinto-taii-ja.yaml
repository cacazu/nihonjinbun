    "text": "だんだんと述べ來まして、ほゞ神道なるものを大體明かにしたと思ひます。今眼を放つて社界の狀態を見ますと、學術は時々刻々に發達し、文明は年に月に進步して、社會の思想も色々に變遷して來るのであります。此の時に當つて世の輕跳俘薄の輩は、此の如く徒らに西洋の文明に心醉し、意氣揚々として得意の色をあらはし、顧みて神道を嘲り、神道は古陋なものである.神道は卑屈なものである。神道は陳腐なものである。神道は淺薄なものであると言ひ、而してその禮典儀式を蔑視するのである。勿論神道家なる者も實に多數あるのであるから、其の多數の神道家の中には、或は古陋な說を有する人もあるかも知れぬ。或は卑屈な說を唱へる者もあるかも知れぬ。或は陳腐な說を以つて金科玉條として居る者もあるかも知れぬ。或は淺薄なる頭腦を以つて社會に立つ者もないとも限らない。けれども之れを以つて直に神道がさう云ふものであると言つたならば是れは詰り一羽の鳥の頭の白いのを見付けて、鳥の頭は白いものであると斷定を下すのと同一で、何人も其の非論理の言を笑はざるを得ないだろうと思ふ。神道は古來神々の云爲行動に基く所の事實の道であるのである。而して古來の神々は、最も偉大なる神聖にましませば、神道なるものも一部の論者の言ふやうに、極めて狹い所の道でなく、已に述べたやうに、天地の公道であつ"

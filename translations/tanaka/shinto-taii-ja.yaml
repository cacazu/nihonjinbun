  "source_text": "或人は神道を稱して宗教と云ふ程の價値はないと云ふ。成程日本の神道にはバイブルやコーランや諸種の佛典のやうな、完備した經典はないかも知れぬが、然し復古神道家の宇宙說、創世說、神祇說に宗教的將た哲學的價値がないと云ふことが出來やうか。復古神道に於て發見する諸種の哲學は實に外來文明の影響を受けぬ純粹なる日本民族の宇宙觀、神靈觀である。若し之を何等研究の價値なしとして一笑に附し去るものがあるならば、其の人は實に自分自身の屬して居る民族的思想の發展を無視した人と云ふて好からうと思ふ。"

- "id": "std-p0017-001"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "ありますけれども、前から申述べました樣に、家康公とか正成公とか道眞公とか、清麿公とか、或は又人麿公とか云ふ樣な人々が示した所の一言一行、是れが悉く神道の典籍となつて居るのでございます。昔の學者は神道は天地を以つて書籍と爲し日月を以つて證明と爲す。と云ひましたが、その言葉の出所は暫らく置き實に立派な言葉である。是れが即ち神道である。我が固有の大道であるのであります。詰り事實即ち大道である。事實が大道を證明して居るのであります。平田篤胤翁は斯う云つて居る。一體誠の道と申すものは事實の上にちやんと備はつて居るのである。世の學者等は兎角教の書でなければ道は得られぬ事のやうに心得て居りまするけれども、それは大變間違つて居る。事實がちやんとあるならば教は必ずしも要らないのである。道の實事がないから教は起るのである。是れは篤胤翁の說であるが實に其の通りであると思ひます。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "30"
    "printed_page_end": "31"
    "url": "https://dl.ndl.go.jp/pid/943543/1/17"
    "source_sequence": 16
  "translation_ja": "先ほどから述べてきたように、家康公、正成公、道真公、清麿公、あるいは人麿公といった人々の示した一言一行が、すべて神道の典籍となっているのです。昔の学者は「神道は天地を書物とし、太陽と月をその証明とする」と言いました。その言葉の出所はひとまず置くとして、実に立派な言葉です。これが神道であり、わが国固有の大道なのです。つまり、事実そのものが大道です。事実が大道を証明しているのです。平田篤胤翁は、次のように言っています。「そもそも本当の道というものは、事実の上にきちんと備わっている。世の学者たちは、とかく教えを記した書物でなければ道を得られないと思っているが、それは大きな間違いだ。事実がきちんとあるならば、教えは必ずしもいらない。道の実践がないから、教えが起こるのである。」これは篤胤翁の説ですが、実にそのとおりだと思います。"

  "translation_ja": "るには文明の宗教を奉じなければならない、といったことを盛んに言い出しました。何でもかんでもキリスト教でなければならない。またキリスト教を信じる者は偶像を崇拝できない、写真に向かってお辞儀はできない、などという不都合な連中が現れるようになりました。これは御誓文の前半ばかり取り上げてきた弊害です。また道徳の面はどうかというと、道徳は快楽主義に限る、人生は快楽、これに越したものはないなどと言って、快楽主義や幸福主義といった方面ばかりを重く見るようになり、実に大変なことになってきました。いわゆる風俗が退廃し、道義がすっかり失われ、紳士も堕落し、青年も堕落し、社会も堕落して、どうも不都合な状態になってきたのです。なぜそうなるかというと、結局、この五箇条の御誓文の「これまでの悪い習慣を破り、天地の公正な道理に基づくべきである」ということを考えていないからです。天地の公正な道理とは、昔にも今にも通じて誤りがなく、国内でも国外でも実行して道理に背かない大道でなければなりません。これ以上の天地の公正な道理はありません。これ以上のものはないのです。しかし、そこに気づかず、むやみに外国へ目を向けているから、このような状態になってくるのです。「大いに皇室による統治の基礎を奮い立たせるべきである」、つまり知識を世界に求めるのは、その基礎を奮い立たせることが目的なのです。むやみに外国の知識ばかりを求めるのではありません。知識ばかり求めても何にもなりません。人生は無味乾燥なものではありません。そのような知識だけで人間は生活できるものではないのです。その知識を求める理由は、さらにその奥に、大いに皇室による統治の基礎を奮い立たせ、国民の真の生活を味わわなければならないということがあるからです。そのことを忘れてしまっています。肝心なことを忘れているのです。そういうわけで、一にも西洋、二にも西洋。政治であれ宗教であれ道徳であれ、すべて西洋主義でなければならない、ということになってきました。西洋文明に心酔し、それをほとんど丸のみにした結果、日本国民は実にひどく混乱した状態になってきました。学者であろうと政治家であろうと、実に言葉では表せない状態になりました。つまり先ほど言ったように、風俗は退廃し、道義はすっかり失われ、堕落に堕落を重ね、いわゆる百鬼が昼間から横行するようなありさまを現しました。このような状態が生じたので、その"

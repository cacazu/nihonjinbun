  "translation_ja": "本居宣長が神道哲学の提唱者、また国学者として、わが国の思想史上の大人物であることはいうまでもない。熱意を込めたその忠君愛国説が、やがて維新の大事業に及ぼした影響も非常に大きい。著者は先に『平田篤胤の哲学』を著し、今またこの偉人を取り上げ、その学説はもちろん、さらにその学統に属する多数の学者の諸説をも記述し、いわゆる復古神道学派の哲学を明らかにしようとした。考証に大いに努め、議論は穏健である。全体として、その時代と人物の姿をよく描き出している。"

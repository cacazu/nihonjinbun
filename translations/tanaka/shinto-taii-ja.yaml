- "id": "std-p0008-001"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "思ひます。實に我が國に大道の存在する事は恰も天に日輪の懸かつて居るが如きもので、斯くの如く明らかで、斯くの如く明瞭々たる大道が存在して居るのに、是れには一向氣が附かずして徒らに外に求めると云ふのは、猶自分の頭が無くなつたと云つて騷いで居るのと同じ事だらうと思ふのです。平田篤胤翁の父上は篤胤翁に向つて、若し孔子が日本の國に生れたならば決して儒教は說かないで我が神道を說いたに違ひない。我が國固有の大道を說いたに違ひない。それ故に其の方も此の方面に向つて研究しろと云ふ事を教へられたと云ふ事である。成る程さうであらうと思ふ。若し孟子が—支那の孟子が我が國に來て見ましたならば、村田春海一流の人物を評して所謂喬木を下つて幽谷に入る者とは是れ等の事であるかと云ふであらうと思ふ。高い所の地位を下つて態々薄暗い谷底に入る者とは是れ等の事だらうと孟子は笑つたに相違ない。けれども吾々日本民族に於いては斯くの如き輩を默過して笑つて濟ます譯には行かぬ。何うしても斯う云ふ連中から先づ以つて我が帝國の大道の存在を明らかにさせないと我が將來の國家を如何せんと斯う私は信ずるのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "12"
    "printed_page_end": "13"
    "url": "https://dl.ndl.go.jp/pid/943543/1/8"
    "source_sequence": 7
  "translation_ja": "思います。実に、日本に大いなる道があることは、空に太陽がかかっているようなもので、これほど明らかで、これほど明々白々とした道があるのに、それには少しも気づかず、むやみに外に求めるのは、自分の頭がなくなったと騒ぐのと同じことだと思います。平田篤胤翁の父上は、篤胤翁に「もし孔子が日本に生まれたなら、決して儒教を説かず、日本の神道を説いたに違いない。日本固有の大いなる道を説いたに違いない。だから、お前もこの方面を研究しなさい」と教えたそうです。なるほど、そのとおりだろうと思います。もし孟子が、あの中国の孟子が日本に来たなら、村田春海と同類の人々を評して、「いわゆる高い木を下りて深い谷に入る者とは、この人たちのことか」と言うでしょう。高いところから下りて、わざわざ薄暗い谷底に入る者とはこの人たちのことかと、孟子は笑ったに違いありません。しかし私たち日本民族は、そうした人々を見過ごして、笑って済ませるわけにはいきません。どうしてもまず、そういう人々にこそ、わが帝国の大いなる道の存在を明らかにさせなければ、日本の将来をどうするのかと、私は考えるのです。"

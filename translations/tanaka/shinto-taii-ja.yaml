- "id": "std-p0018-001"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "に天下を安ぜん。亦可いではないかと云ふ御詔勅を下された。次の代の垂仁天皇も先帝を御稱賛遊ばして克く神祇を崇奉されて仁政を布かれた。茲を以つて人民富み榮え天下太平であつた。けれども今朕の世に當つて神祇を祭祀することに懈る事が在ては濟まないと云ふ事を詔勅の中に宣はせられたのである。又文武天皇は、あきらけききよきなほきまことの心を以ていやすゝみにすゝみてたゆみおこたる事なくつとめしまりてつかへまつれ、と云ふ事を百僚有司に對して勅せられたのである。斯う云ふ事は御歷代に擧げ來つて實に遑の無い程澤山あるのでございます。斯う云ふ所が即ち神道其の者を示されたのであります。斯う云ふ神道は古來或は政道であるとか、或は宗教であるとか、或は道德であるとか、色々に解釋せられたのであります。神道を政道と解されました學者は、北畠親房卿及本居宣長翁であります。親房卿は『神皇實錄』、『神皇系圖』『天口事書』など申す所謂三部の書などの說を承けまして天照大神が八坂瓊の勾玉の如くにたへに天の下治しめせ、白銅鏡の如くに分明に山川海原をみそなはせ、この靈劔をとりひさげて、天の下むけたまへと云ふ三句の要道を示されたとして、神道には色々複雜な言も事もあるが、外のものは皆枝葉である。根本は此の三句に基いて天皇の天下を治め給ふ政治の道である。だから此の政治の道が即ち神道である。斯ういふ風の解釋でございます。それから本居翁の考はどうでかるかと申しますと、親房卿と立脚地が違つて居ります。けれども其の結論は同じであります。道を行ふことは君とある人の勤めである、物を學ぶ者の業にはあらずと。斯ういふのが本居翁の說で、道を行ふのは國家の君主たる方の勤めである、物を學ぶ學者杯が行ふものでないと明かに神道といふものを政治道に解釋せられて居ります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "32"
    "printed_page_end": "33"
    "url": "https://dl.ndl.go.jp/pid/943543/1/18"
    "source_sequence": 17
  "translation_ja": "天下を安らかにしよう。それもよいことではないか」という詔勅を下されました。次の垂仁天皇も、先帝がよく神々を崇敬して仁政を敷かれ、そのために人民が豊かに栄え、天下が太平であったと称賛されました。しかし、今、自分の治世において神々を祭ることを怠ってはならないと、詔勅の中でお述べになりました。また文武天皇は、「明るく清く、素直で誠実な心をもって、ますます努め励み、たゆまず怠らず、身を慎んでお仕えせよ」と、百官役人に命じられました。こうした例は、歴代について挙げれば、実に数えきれないほどあります。このようなところに、神道そのものが示されているのです。この神道は、古来、あるいは政治の道、あるいは宗教、あるいは道徳と、さまざまに解釈されてきました。神道を政治の道と解釈された学者は、北畠親房卿と本居宣長翁です。親房卿は、『神皇実録』『神皇系図』『天口事書』という、いわゆる三部の書などの説を受けて、天照大神が「八坂瓊の勾玉のように、妙なるあり方で天下を治めよ。白銅の鏡のように、はっきりと山川海原を見渡せ。この霊剣を手に取り、天下を服従させよ」という三句の大切な道を示された、としました。そして、神道にはさまざまな複雑な言葉や事柄があるが、それ以外のものはみな枝葉であり、根本はこの三句に基づいて天皇が天下を治められる政治の道である、したがってこの政治の道こそ神道である、と解釈したのです。本居翁の考えはどうかといいますと、親房卿とは立脚点が違います。しかし結論は同じです。「道を行うことは君主である人の務めであって、学問をする者の仕事ではない」というのが本居翁の説です。道を行うのは国家の君主たる方の務めであり、学問をする学者などが行うものではないと、明らかに神道を政治の道と解釈されています。"

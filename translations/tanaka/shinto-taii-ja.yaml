- "id": "std-p0008-002"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "斯う述べて來ますると云ふと、讀者諸君の中には、そんな大道と云ふものがあると云ふ事は未だ克く聞かないが一體其の大道と云ふのは何んなものであるか、我が帝國の大道とは何んなものであるか。斯う云ふ質問が出て來ます。私は此の質問に對しては神の道である。と斯う答へる。世に神道と申して居る神の道である。神の道である。私が斯樣に申しますると、或は諸君の中に斯う云ふ考を抱かれる方があるかも知れない。日本の固有の大道は神の道である。神道であると云つたが、それならば例の神社の前で手を拍いたり或は祝詞を讀んだり玉串を上げたりするのが大道であるか。そんな大道なればとつくに知つて居る。そんな大道なれば信仰しなくとも宜い。又そんな事のために態々勿體らしく下らぬ話をして貰はぬでも宜い。そんな事なら止して貰はふと。斯う云ふ樣な御考を持た"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "12"
    "printed_page_end": "13"
    "url": "https://dl.ndl.go.jp/pid/943543/1/8"
    "source_sequence": 7
  "translation_ja": "こう述べてくると、読者の皆さんの中から、「そんな大いなる道があるとは、まだよく聞いたことがないが、いったいその道とはどういうものか。わが帝国の大いなる道とは、どういうものか」という質問が出てきます。私はこれに「神の道です」と答えます。世に神道と呼んでいる、神の道です。神の道なのです。こう申し上げると、皆さんの中には次のように考える方がいるかもしれません。「日本固有の大いなる道は、神の道、神道だというが、それなら、あの神社の前で手をたたいたり、祝詞を読んだり、玉串を供えたりするのが、その道なのか。そんな道ならとっくに知っている。そんな道なら信仰しなくてもよい。また、そんなことのために、わざわざもったいぶって、つまらない話をしてもらわなくてもよい。それならやめてもらおう」と。こういうお考えを持た"

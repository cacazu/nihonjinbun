- "id": "std-p0049-011"
  "section_id": "ads-scan-49"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "著者は曩に「系統的西洋教育史」を公にせし人なり。此の書は西洋に發達せる思想と教育とを研究し之を骨肉として更に東洋殊に日本固有の思想と教育とを研究し之を精神として一大系統的教育學を組成せるものにて、體系の整然たると、議論の穩健なるとは此の書の特色なり。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/49"
    "source_sequence": 48
  "translation_ja": "著者は先に『系統的西洋教育史』を公刊した人である。本書は、西洋で発達した思想と教育を研究して、それを骨肉とし、さらに東洋、特に日本固有の思想と教育を研究して、それを精神として、一大体系的教育学を組み立てたものだ。体系が整然としていることと、議論が穏健であることが、本書の特色である。"
  "translation_status": "reviewed"

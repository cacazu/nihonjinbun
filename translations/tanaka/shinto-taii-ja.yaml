    "text": "は和氣の〓麿公が忠誠を盡した如く吾々も君國に對して忠誠を盡したいと思ふ。又天滿宮に詣つては菅原道眞公の如く君國に盡したいと思ひ、湊川神社に詣つては正成公の如く忠勤を勵みたいと思ふ。或は又東照宮に詣つては徳川家康公の「人の一生は重き荷を負ふて遠き道を行くが如し」と〓を垂れられた事を思ひ起して其の人を追慕する。勿論此の遺訓は家康公が云つたものか何うかと云ふ事は歷史家の問題であるが、少なくとも德川家康公は之れを自身に實行した所の人物であると思ふ。此の實行が即ち吾々の摸範になるのである。是れが爲に吾々は東照宮の東照宮として尊き所以を見るのであります。つまりかう云ふ風な事が皆神道の一部分を爲して居るのであります。"

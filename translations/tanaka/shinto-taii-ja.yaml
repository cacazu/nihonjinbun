    "text": "ります。此の神道と云ふ文字を平田篤胤翁は解して神を祭り、神を禱り、又祓などの類凡て神に仕へまつるわざをひろく申したものと解釋されてありますが、誠にその通りで全く神道といふ言葉を宗〓的の意味に使つたものと考へられますそれから其の後平安朝初期に出でたる最澄が始めて唱へたと云ふ山王一實神道、或は空海が創めたといふ兩部習合神道ざういふ風の神道は全く宗〓的であります。それから後のト部家の唯一神道、是れも宗〓的であります、それから近代の奇傑でありました所の黑住宗忠氏、之れも矢張り天照大神を最上神として明かに一派の宗〓を立し、訓誠七ケ條の第一に於いて、神國の人に生れ常に信心なき事を誠め、千辛萬苦して熱烈な宗〓的信仰を皷吹されて居ります。近世大分斯ういふ熱烈な宗〓家が出られまして神道といふものは宗〓である。斯ういふ風に考へる人が澤山出來て來ました。けれども此の神道は全く宗〓である、徹頭徹尾宗〓であるといふ考も餘り宜い考ではないと思ひます。"

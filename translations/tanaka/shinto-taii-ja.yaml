- "id": "std-p0020-001"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "に書いてあります。此の考も矢張り今日から申せば倫理であります。勿論山崎先生や、平田翁の說には宗教的方面も少くないのでありますが、その主とする所は倫理であります。德教であります。今日の學者にも國學神道を研究する人には神道は宗教では決してない、神道は倫理である、道德であるといふ說が大變行はれて居ります。其の說はどういふのだと申しますと、神道に說く所は人と人との關係に限られて居る。元來宗教は人と神との關係より成立し、倫理は人と人との關係より成立するものである。神道は全く人と人との關係を說くのであつて、神道で神といふのは決して吾々の頭の上に入らせられる神でない。即ち神といふのは高い所にまします神でない。唯々純粹なる上たる人で、神樣を拜むと云ふも全く倫理的崇拜である。決して宗教的の崇拜でない。斯ういふ解釋であります。でありますけれども吾々が菅原道眞といふ一個の歷史的人物に對して倫理的態度で感謝の意を表し、倫理的御辭儀をするのと、天滿天神として、天滿宮として崇拜するのと、其の間が同一でありませうか。是れは智者を俟たないで分ることであります。さうです、決して同一でないです。で、神道は倫理であるといふ考は少しく誤つて居る考であらうと思はれます。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "36"
    "printed_page_end": "37"
    "url": "https://dl.ndl.go.jp/pid/943543/1/20"
    "source_sequence": 19
  "translation_ja": "に書かれています。この考えも、今日の言葉でいえば倫理です。もちろん、山崎先生や平田翁の説には宗教的な面も少なくありませんが、中心となるのは倫理、徳の教えです。今日の学者でも、国学や神道を研究する人々の間では、神道は決して宗教ではなく、倫理であり、道徳であるという説が盛んです。その説は、次のようなものです。神道が説くのは、人と人との関係に限られている。もともと宗教は人と神との関係から成り立ち、倫理は人と人との関係から成り立つ。神道はまったく人と人との関係を説くものであり、そこでいう神は、私たちの頭上にいらっしゃる神ではない。つまり、高いところにおられる神ではなく、ただ純粋に上位に立つ人なのであって、神様を拝むといっても、まったく倫理的な崇拝であり、決して宗教的な崇拝ではない、という解釈です。しかし、私たちが菅原道真という一人の歴史上の人物に対して、倫理的な態度で感謝の気持ちを表し、倫理的なお辞儀をすることと、天満天神として、天満宮として崇拝することとは、同じでしょうか。これは賢者を待つまでもなく分かることです。そうです。決して同じではありません。ですから、神道は倫理であるという考えは、少し誤っているのではないかと思われます。"
  "translation_status": "reviewed"

    "text": "私は是れに就いて最も適當なる一人の代表的の人物を茲に擧げて見やうと思ふ。それは誰れであるかと申しますれば、彼の遠江の國に出られたる賀茂眞淵翁の門人の一人、縣居門四天王の隨一と稱へられたる村田春海其の人であります。此の人は何う申して居りましたか。彼の言葉に、我が國の道とする所のものは周公孔子の道である。周公〓孔の道を舍いて別に道を我が太古に取る。吾れ未だ之れを聞かざるなり。吾れは未だ斯う云ふ事を聞いた事はない。それであるからして和字は我が字ではない、漢字を借りて我が音に充てたのである。衣服冠冕-此の着て居る所の着物や冠は皆唐の制度である。百官有司皆唐の制を學んで居る。今日ならば西洋の制を學ぶと云ふのでせう。律だの令だの格だの式だの是れ皆唐の制を學んだのである。博士は明經·文章-天文·陰陽それから律算音音諸科の博士がある。併し和學博士とか歌學博士、即ち我が日本の學問の博士、日本の歌の學問の博士と云ふものは無い。勿論和歌博士と云ふ事があつたけれど"
    "description_ja": "NDL全文テキストJSONの対応ブロックを未改変で連結。画像照合後の本文と異なる。"
- "id": "std-p0007-001"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "も、是れは大江匡房が戯れに云つたので和歌博士が實際あつたのではない。和學歌學と云ふものは古へは無いのである。和學者と云ふ者は何う云ふものであるかと云ふと、儒者であつて本朝の典故だの言葉だのに達して居るのが和學者である。又、歌學者と云ふのは儒者にして歌を作る者である。吾が儕ら·····春海自身が云ふのです·····吾が儕ら腐陋と雖も儒者である。即ち儒者にして歌を作つて居るものである。斯くの如く本朝の制度文物皆既に周公孔子の遺法を奉じて居る。さうして又佛教を信ずる者が一方に多い。一體此の日本に於いては若い時には儒教を信じ、年を取つては佛教を信ずると云ふのが中古以來一般の風習である。之れに依つて考へて見ると云ふと儒にあらざれば即ち佛である。此の二つの道を除いて道と云ふものは無いのである。此の二つの道を除いて別に道を立てると云ふ事は吾れ未だ之れを聽かないのである。かう云ふのが村田春海の道に對する議論である。彼は眞淵翁門下四天王の一人である。さうして其の議論は實に斯くの如くであるのです。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "10"
    "printed_page_end": "11"
    "url": "https://dl.ndl.go.jp/pid/943543/1/7"
    "source_sequence": 6
  "translation_ja": "も、それは大江匡房が戯れに言ったもので、和歌博士という役職が実際にあったのではありません。和学や歌学というものは、昔はなかったのです。和学者とはどういう者かというと、儒者であって、日本の典故や言葉によく通じている者のことです。また歌学者とは、儒者であって歌を作る者のことです。「私たちは」――これは春海自身の言葉ですが――「私たちは古くさく見識も乏しいとはいえ、儒者です」。つまり儒者として歌を作っている者なのです。このように、日本の制度や文物はみな、すでに周公・孔子の残した制度に従っています。そして、一方では仏教を信じる者も多い。日本では、若いときは儒教を信じ、年を取ると仏教を信じるのが、中古以来、一般の風習です。これから考えれば、儒教でなければ仏教です。この二つの道を除いて、道というものはありません。この二つの道を除いて別に道を立てるということは、私はまだ聞いたことがない、というのです。これが村田春海の道についての議論です。彼は真淵翁の門下四天王の一人ですが、その議論は実にこのとおりなのです。"
  "translation_status": "reviewed"

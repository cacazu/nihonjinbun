  "translation_ja": "ような勢いで、西洋の文明が入ってきました。それでは維新当時、朝廷はどうであったかというと、天皇は南殿にお出ましになり、五箇条の御誓文をお示しになりました。その第四条では「これまでの悪い習慣を破り、天地の公正な道理に基づくべきである」と、第五条では「知識を世界に求め、大いに皇室による統治の基礎を奮い立たせるべきである」とお示しになっています。ところが、どうもこれが誤解されました。第四条の「これまでの悪い習慣を破り」というのは、まことに結構なことです。これまでの幕府の政策、鎖国的な政策の結果、国民は非常に保守的になり、消極的になり、古い習慣にとらわれてその場しのぎになっていました。その悪習を破り、天地の公正な道理に基づいて行うべきことを示されている、というわけです。また、知識を世界に求める。今日では、どうしても世界の最新の知識を持たなければなりません。知識は古くてはどうしても駄目です。だから知識を世界に求め、大いに日本の皇室による統治の基礎を奮い立たせなければならない、というお言葉なのです。まさに和魂漢才の趣旨を示されたお言葉です。それを維新以来、世間一般の人々が誤解して、みな前半の「これまでの悪い習慣を破る」ことだけを考え、後半を抜きにしてしまいました。また「知識を世界に求める」という点ばかりを重く見て、何でもかんでも西洋文明を学びました。つまり、西洋に心酔する状態になってきたのです。それで、これまでの悪い習慣を破るのだから、昔のやり方は何でも駄目だ、ということになり、政治も昔の政治では駄目だ、これからは民主政にしなければならない、などというとんでもないことを言い出し、主権はどこにあるのか、つまり国民にあるのだ、といったことを言い出しました。また人間には天賦人権というものがある、外部から侵すことのできない、生まれながらの人権がある、と言い出しました。天賦人権はよいのですが、それをむやみに振り回し、中途半端な理解で自由を叫び、何でもかんでも自由だなどと言って、かえって安寧秩序を害し、しばしばひどく不自由な結果を生むようなことをしています。政治の面もそのような具合ですが、さらに宗教の面を見ると、キリスト教は文明国の人々が奉じる文明の宗教なのだから、今日、文明国の人々と交流す"

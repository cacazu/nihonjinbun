- "id": "std-p0032-003"
  "section_id": "main-std-p0032-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "で、其の第一に於きましては、我が國に於いては昔から始終其の當時々々の天皇陛下があらびど神として即ち神樣として尊崇せられて居るのである。吾々は神樣であると尊敬して居るのであります。吾が國民は皆然りである。教育勅語は其の神樣の御教である。神樣の御言葉である以上は、其の示されてある所の道は神の道でありませう。第二には、勅語には斯道は皇祖皇宗の遺訓と申されてあります。皇祖皇宗と申すのは何う云ふ御方であるか。即ち是れは天照大神を初として御歷代の天皇方である。而して御歷代の天皇方は吾々の謂ふ所の神である。吾々は皆之れを神と祀つて居るのであります。故に皇祖皇宗の遺訓は即ち神の御訓である。即ち神の道である。即ち皇祖皇宗の遺訓と申されたのは神の道と云ふのと同義異語である。故に神の道と云ふのに決して差支はないのであります。それから第三に教育と云ふものに就いて見ます。教育と申しますものは、或る特殊の人間に施す所のものではないのでございます。勿論今日教育と云ふものを工業教育とか商業教育とか農業教育とか色々な部に別けて居りますけれども、是れは學術の上の區別である。教育其の物の區別ではないのであります。でありまするからして勅語を下さるに就いても、工業教育勅語、商業教育勅語、農業教育勅語と云ふ樣に斯樣な澤山な勅語を下さる必要は無いのであります。何故かと申すと、物を教へる場合には農業も教へませう、商業も教へませう、工業も教へませう、其の智識技藝を授くるに"

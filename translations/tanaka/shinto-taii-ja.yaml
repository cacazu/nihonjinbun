  "translation_ja": |-
    これを西洋について見ると、昔ローマにバヂリウスという人がいました。この人はまことに質朴なキリスト教徒でしたが、ある時、当時のローマ皇帝バレンチヤヌス陛下から使者を迎え、その使者の前に立つことになりました。
    皇帝の使者「お前は、皇帝が信じておられる教理を信じなければ、罰せられるぞ。」
    バヂリウス「それはもう、罰せられても仕方がありません。しかし、どのような罰をお与えになるのですか。」
    使者「その罰とは、お前の財産をすべて没収されることだ。」
    バヂリウスは少しも動じずに答えました。
    バヂリウス「それは結構です。私の財産といっても、この着ている着物一枚だけですから、これを取られても少しも差し支えありません。」
    使者「お前、そんなことを言うと国外へ追放されるぞ。」
    バヂリウス「いや、それも結構です。そもそも神様はどこへ行ってもいらっしゃるのですから、国外でもどこへでも参りましょう。」
    使者もたまりかねて言いました。
    使者「お前、そんなことを言うと死刑にされるぞ。」

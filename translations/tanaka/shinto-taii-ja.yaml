  "translation_ja": "まず第一に、日本では昔からいつも、その時々の天皇陛下が現人神として、つまり神として尊び敬われています。私たちは神であるとして尊敬しているのです。日本の国民はみなそうです。教育勅語は、その神の教えです。神のお言葉である以上、そこに示されている道は神の道でしょう。第二に、勅語では「この道は皇祖皇宗の遺訓」とおっしゃっています。皇祖皇宗とはどのような方々でしょうか。それは天照大神をはじめ、歴代の天皇方です。そして歴代の天皇方は、私たちのいう神です。私たちはみな、これらの方々を神として祭っているのです。したがって、皇祖皇宗の遺訓とは、神の教えであり、すなわち神の道です。つまり「皇祖皇宗の遺訓」とおっしゃったのは、「神の道」と言葉は違っても同じ意味なのです。ですから、神の道と言っても、決して差し支えはありません。それから第三に、教育というものについて見てみます。教育は、ある特別な人間だけに施すものではありません。もちろん今日では、教育を工業教育、商業教育、農業教育など、さまざまな部門に分けていますが、これは学術上の区別であり、教育そのものの区別ではありません。ですから勅語をお下しになるにも、工業教育勅語、商業教育勅語、農業教育勅語というように、これほど多くの勅語をお下しになる必要はないのです。なぜかというと、物事を教える場合には、農業も教えるでしょうし、商業も、工業も教えるでしょう。その知識や技術を授けるに"

- "id": "std-p0003-002"
  "section_id": "main-std-p0002-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "けれども退いて之れを考へて見ますと云ふと之れには抑も故があるのであります。一體我が國民には我が國固有の大道である神道なるものを自覺しないものが多いのであります。從つて只外の方面にのみ考を向けて居つて、自分が實際神道の道に適つたことをして居ても、即ち日々神道を實行して居ても、而もそれが神道であるといふ事に氣が付かないのであります。そこで道を更に遠きに求むるのであります。さう云ふ人々は今申したやうに遂には邪教に心醉して仕舞ふのであります。けれど多くの國民は格別邪教にも入りませんで、日々神道を實行して居ながらも、殆んど不注意にして其の事を考へないで過して居るのであります。で、突然人から神道とは何ぞやといふやうな問題を提出せられると大いにマゴ付くのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "2"
    "printed_page_end": "3"
    "url": "https://dl.ndl.go.jp/pid/943543/1/3"
    "source_sequence": 2
  "translation_ja": "けれども、一歩退いて考えてみると、これにはそもそも理由があります。私たちの国民には、日本固有の大いなる道である神道を自覚していない人が多いのです。そのため、ただ外にばかり考えを向け、自分が実際に神道にかなうことをしていても、つまり日々神道を実行していても、それが神道だということに気づきません。そこで道をさらに遠くに求めるのです。そういう人々は、今申し上げたように、ついには邪教に心酔してしまいます。しかし多くの国民は、特に邪教に入るわけでもなく、日々神道を実行しながら、ほとんど気にもとめず、そのことを考えないまま過ごしています。そこで突然、人から「神道とは何か」というような問題を出されると、大いにまごつくのです。"

- "id": "std-p0006-002"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "然るに此の大道と申しますものは何う云ふ物に表はしてあるか、斯う申すと云ふと、或は基督教のバイブルとか或は佛教の經典とか或は儒教の四書五經の如くに其の道を書き記したものは少しも無いのである。無いものでありますからして世間の人は、佛教が入つて來る、儒教が入つて來る基督教が入つて來る、直ちに是れは立派な教であると云ふて其の方に向ふ。さうして我が國固有の大道ある事を忘れて仕舞ふのであります。勿論學問をした事のない何も知らない無智の人間がさう云ふものに向つて走つて行くのは止むを得ぬとしましても、學者が少なくとも我が國體、我が大道と云ふものに就いて多少智識を有して居る所の者迄が其の方に向つて走つて行くと云ふのは、實に其の愚憐むべきであります。斯く云ふ憐むべき學者、憐れむべき人物と云ふものは今日計りではない昔からあるのです。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "8"
    "printed_page_end": "9"
    "url": "https://dl.ndl.go.jp/pid/943543/1/6"
    "source_sequence": 5
  "translation_ja": "ところで、この大いなる道はどのようなものに表されているのでしょうか。そう問われると、キリスト教の聖書や仏教の経典、儒教の四書五経のように、その道を書き記したものは、少しもないのです。そのようなものがないために、世間の人は仏教が入ってくる、儒教が入ってくる、キリスト教が入ってくると、すぐにこれは立派な教えだといって、そちらに向かいます。そして、日本固有の大いなる道があることを忘れてしまうのです。もちろん、学問をしたことがなく何も知らない無知な人間が、そちらに走っていくのはやむをえないとしても、学者、それも少なくとも日本の国体や大いなる道について多少の知識がある者までもが、そちらに走っていくのは、その愚かさを実に哀れむべきことです。このような哀れむべき学者や人物は、今日だけでなく昔からいるのです。"
  "translation_status": "reviewed"

  "translation_ja": "時の神勅や、高皇産霊尊の「あまつひもろぎ」「あまついはさか」の神勅、その他に祭祀が行われ、禊、祓、神楽など、さまざまな儀式が昔から行われてきました。こうした儀式を研究すると、どうしても宗教的儀式、つまり私たちの民族の宗教的感情の表現としか見られません。ですから、黒住宗忠氏や井上正鉄氏のような、熱烈で強い宗教心を持つ人には、どうしても神道は宗教に見えるのです。もちろん、神道は仏教やキリスト教のような偏狭な宗教ではなく、それらを超越した宗教です。しかし、いずれにせよ、神道は宗教とも見えるのです。次に山崎闇斎先生や平田篤胤翁、そのほか今日でも道徳的な面を重んじる学者は、神道はまったく道徳であると解釈します。なるほど、そのような目で見れば、古い伝承の伝える神々の行為は、一つ一つが私たちの日常の行為の規範を示したものだと解釈されます。また、神道で行う崇拝、神様を拝むことについても、道徳的な方面から見る人には、ただ根本の恩に報い、始まりに立ち返るための行いだと見えるのでしょう。このように、神道は道徳であると映るのです。こうした次第ですから、神道は道徳だ、倫理だと言うのは誤りではありません。しかし、これは先ほど述べたように、象に触れて臼のようだ、蛇のようだ、壁のようだと言ったことが間違いではないのと同じで、そのように言ったこと自体を間違いだとは断言できません。実際に、ある部分は蛇のようであり、ある部分は臼のようであり、ある部分は壁のようだからです。決して間違いではありません。しかし、その考えは部分的であり、偏った見方だと言わなければなりません。そこで、大正の明るい御代に、これほど盛んに発達した学問を応用して神道を研究してみると、その起源から見ても、その根拠から見ても、神道の性質として、政治、宗教、道徳という三大系統が、その三大要素をなしているように思われるのです。もちろん、このような"

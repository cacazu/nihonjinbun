- "id": "std-p0033-002"
  "section_id": "main-std-p0032-001"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "所が我が國に於いては我が國民の祖先は神である。さうして吾々は神の遺體を有つて居るのである。獨り身體のみならず精神も神の精神の分靈である。一部分である。即ち吾々は吾が身其の儘の神である。少なくともくにつ神と云ふ言葉のある以上は吾々は神と云ふ事が出來るのである。其のくにつ神なる吾々國民……神の遺體を有つて居る吾々國民の行ふべき道は即ち神の道である。私は此の點から見ても矢張り教育勅語は神の道を示されたものであると、斯う云ふのであります。故に神の道は唯神社の前で手を拍き祝詞を唱へる丈けではない、是れも其の道の一部分を示すものであると云ふのである。最も重要なる所の一部分を示すのであると云ふのである。ではあるが全體としての神の道は我が帝國の國民たる者の悉く行はなければならぬものである。つまり世間では神の道を以つてむつかしい祝詞を讀んだりなんどする一種特別の道であるかと考ふる人が御座いますが前々から申します通り一部分を以つて全體とするので大變な誤解であるのであります。で、荷田春滿……四大人の一人たる所の荷田春滿翁も「世の中に神の道とて道あらば、人の外なる人や學ばむ」と詠まれたのであります。世の中に眞正なる人の道があつたならばそれは神の道である。此の神の道の外に人の行ふべき道はあるものではない。神の道は即ち人の道で、人の道は即ち神の道。即ち斯道は人の行ふべき嵩高なも"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "62"
    "printed_page_end": "63"
    "url": "https://dl.ndl.go.jp/pid/943543/1/33"
    "source_sequence": 32
  "translation_ja": "ところが、日本では国民の祖先は神です。そして私たちは、神から受け継いだ身体を持っています。身体だけでなく、精神も神の精神から分かれた霊であり、その一部分です。つまり私たちは、その身のままで神なのです。少なくとも「くにつ神」という言葉がある以上、私たちは神だということができます。その「くにつ神」である私たち国民――神から受け継いだ身体を持つ私たち国民の行うべき道は、すなわち神の道です。私はこの点から見ても、やはり教育勅語は神の道をお示しになったものだというのです。したがって神の道は、ただ神社の前で手を打ち、祝詞を唱えることだけではありません。それもこの道の一部分を示すものだというのです。最も重要な一部分を示すものだというのです。しかし、全体としての神の道は、わが帝国の国民である者すべてが行わなければならないものです。世間には、神の道とは難しい祝詞を読んだりする一種特別な道なのかと考える人がいますが、前から申し上げているとおり、それは一部分を全体とする大変な誤解です。そこで、荷田春満――国学の四大人の一人である荷田春満翁も、「世の中に、神の道という別の道があるのなら、人間以外の人が学ぶのだろうか」と詠まれたのです。世の中に真の人の道があるなら、それが神の道です。この神の道のほかに、人の行うべき道があるのではありません。神の道はすなわち人の道であり、人の道はすなわち神の道です。つまり、この道は人が行うべき崇高なもの"

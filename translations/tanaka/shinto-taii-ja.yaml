  "translation_ja": "先ほどから述べてきたように、神道は政治・宗教・道徳を、その主要な内容を構成する要素としていると考えるのです。さて、わが帝国はご承知のとおり、世界に並ぶもののない国体を持ち、万世一系の皇統をいただき、建国以来、国の威勢はますます上がり、国の栄光はますます輝いています。これはなぜかと考えると、ある人はこう言います。昔、この国が野蛮で未開の時代には、きわめて獣じみた行いをしていたところへ、儒教という立派な教えが入ってきて、五倫五常の道を教え、それによって比類のない国体を持つことができたのだ、という学者がいます。また、ある人は、仏教が伝わってきたからだと言います。つまり儒教や仏教のおかげだ、という論者がいるのです。しかし、儒教の本国はどうでしょうか。いつもダイナスチー、つまり王朝を変えるではありませんか。革命の国ではありませんか。仏教の本国も同じです。日本の国体が世界に並ぶものがなく、その皇統が万世一系であるのは、まさに日本固有の大道が、単なる政治の道でも、単なる宗教でも、単なる道徳でもなく、つまり神道そのものの中に政治も宗教も道徳もあるからです。もともと神道は実に偉大な道であって、これを広げれば天地のあらゆるところに満ち渡り、これを収めれば人の道の細かなところまでも貫くものです。このようなわけで、神道は単なる政治でも、単なる宗教でも、単なる道徳でもないのです。ですから儒教が伝わってくると、堯や舜の禅譲、あるいは湯王や武王の放伐といったことを極力排斥し、また仏教が伝わってくると、小乗仏教のきわめて消極的できわめて厭世的なものは、すぐにその跡を絶たせ、積極的で現世的な大乗仏教をよく利用し、同化してしまったのです。しかし、道は人によって存在するのですから、このように外国の教えを利用し、同化するには、日本の国民が健全で、日本の大道を十分に身につけて理解し、どのようなものでも利用し同化する力を持たなければなりません。"

  "source_text": "先年『歐人の見たる神道』と云ふ論文を書いて寄越した佛蘭西の伯爵ダルヴィエルラ氏は斯ういふ事を書いて居ります。「余は歐洲に於いて日本の留學生、學者、若くは外交家、さういふ人々に會見する機會を得た毎に談必ず神道に及びたれども、毎々冷淡無頓着若くは風を捉へ雲を摑むやうな答に"
  "source_languages":

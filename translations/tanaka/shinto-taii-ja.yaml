- "id": "std-p0031-002"
  "section_id": "main-std-p0026-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "彼の神社の前に行つて手を拍いたり、祝詞を唱へたりするのは、此の我が帝國の大道が胸中一杯になつて、其の溢れた一部分が手を拍いたり祝詞を唱へたりする事になるのであります。唯手を拍いたり祝詞を讀む事が神道であると云ふならばそれは大變な誤解であるのでございます。夫れ故に我が國民は此の教育勅語に示された所の根本の精神を體認して之れを實際に行つて參りましたならば、外の道は何も要らないのであります。外に信ずる所は要らないのであります。我が先帝陛下は此の我が國の思想界の混亂して居るのを大變に御心配なさつて此の教育勅語を降し賜はつて我が帝國の大道の根柢を示されたのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "58"
    "printed_page_end": "59"
    "url": "https://dl.ndl.go.jp/pid/943543/1/31"
    "source_sequence": 30
  "translation_ja": "神社の前へ行って手を打ったり、祝詞を唱えたりするのは、このわが帝国の大道が胸いっぱいに満ち、そのあふれた一部分が、手を打ったり祝詞を唱えたりすることになるのです。ただ手を打ったり祝詞を読むことが神道だと言うならば、それは大きな誤解です。ですから、日本の国民がこの教育勅語に示された根本の精神を身につけて理解し、それを実行していけば、ほかの道は何もいらないのです。ほかに信じるものはいらないのです。先帝陛下は、この日本の思想界が混乱していることを大変ご心配になり、この教育勅語をお下しになって、わが帝国の大道の根底をお示しになったのです。"

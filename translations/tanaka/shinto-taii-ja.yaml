- "id": "std-p0005-003"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "私が此の疑問を解決するには是れは詰り我が國には古來我が國固有の大道が行はれて居るからである。此の一言を以つてするのであります。勿論地理的關係や、その他種々の關係もありましたでしやうけれどその歸する所は詰り世界の各國に於いて絕えて見る事の出來ない所の固有の大道が行はれて居るからして、それで世界の各國に絕え"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "6"
    "printed_page_end": "7"
    "url": "https://dl.ndl.go.jp/pid/943543/1/5"
    "source_sequence": 4
  "translation_ja": "私はこの疑問を、「それは結局、日本では古来、日本固有の大いなる道が行われているからだ」という一言で解こうと思います。もちろん地理的な事情や、そのほかさまざまな事情もあったでしょう。しかし帰するところは、世界のどの国にもまったく見られない固有の大いなる道が行われているからこそ、世界各国にはまったく"

- "id": "std-p0047-007"
  "section_id": "ads-scan-47"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "本書は神道哲學の研鑽を以て夙に嘖々の聞えある田中文學士が、一代の碩學平田篤胤の學說について、公平なる史的烱眼と明確なる哲學的論定とによつて而も系統的組織的に叙述せられたるもの、解說極めて精緻、議論頗る明快、確に卓拔なる平田翁の學說を紹介し得て餘す所なし。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/47"
    "source_sequence": 46
  "translation_ja": "本書は、神道哲学の研究で早くから高い評価を得ている田中文学士が、一代の碩学、平田篤胤の学説を、公平な歴史的洞察と明確な哲学的判断に基づき、しかも体系的・組織的に述べたものだ。解説はきわめて精密で、議論は非常に明快であり、卓越した平田翁の学説を、確かに余すところなく紹介している。"
  "translation_status": "reviewed"
- "id": "std-p0047-008"
  "section_id": "ads-scan-47"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "今や歐西哲學と相須つて國民思想研究の要ある時に此著あり。前古無比の我が國體の精華を發揮すると共に國家の根底を固くし、大に學界を裨益するものあらむ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/47"
    "source_sequence": 46
  "translation_ja": "西洋哲学と相まって国民思想を研究する必要がある今、本書が刊行された。かつて例のないわが国体の精華を発揮するとともに、国家の基礎を固め、学界に大いに役立つものがあるだろう。"
  "translation_status": "reviewed"
- "id": "std-p0047-009"
  "section_id": "ads-scan-47"
  "kind": "heading"
  "origin": "source"
  "source_text": "『東京日々新聞』（一一八一七號）評"

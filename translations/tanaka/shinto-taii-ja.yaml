  "source_text": "それで以上述べて來ましたやうな見解で神道の性質を示し、神道の性質は斯の如きものであるといふのは、たとひ幾多の眞理を含んで居りましても、偏見たるは免れません。で、私は若し人があつて徹頭徹尾神道は宗教である、神道は倫理である、神道は政治である斯う申したならばどうしても是れは偏見と言はなければならないのであります。彼の象であります。象とは少し變な例で御座いますが昔から能く申す例で申しますが、盲目の者が集つて象はどういふものであるかといふて撫でる。足の方を撫でた者は象は臼見たやうなものだ。鼻を撫でた者は大變大きな蛇見たやうなも"

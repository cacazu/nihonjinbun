  "source_text": "平田翁の學說を充分批評發揮して餘薀なきのみならず、且組織的に叙述せられたるは、近來比類なき著述と云ふべし。今や世上一般哲學と云へば歐西傳來の學說を祖述するのみにて、我日本には哲學と稱すべきものなしなどと云へるに際し、本書の出づるあり、我斯道界に一大明燈を得たるのみならず、我國體の精華を發揮するに於て効補はずんばあらず。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/46"
    "source_sequence": 45
  "translation_ja": "平田翁の学説を十分に批評し、その意義を余すところなく明らかにしたばかりでなく、組織的に叙述した点で、近頃比類のない著作といえる。今、世間で哲学といえば西洋から伝わった学説を解説するだけで、日本には哲学と呼べるものがないなどといわれる時に、本書が刊行された。この道の世界に大きな明かりを得ただけでなく、わが国体の精華を発揮するうえでも、必ず役立つものである。"
  "translation_status": "reviewed"

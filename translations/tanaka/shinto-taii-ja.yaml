- "id": "std-p0023-003"
  "section_id": "main-std-p0023-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "で、其の理由を更に深く考へて見ますと、我が國に於きましては國史の示します通り上古には「神居帝座其の殿を與にし、君と神と一體にして、祭祀國政相分れず」と云ふ有樣でありまして、神と君と一體、祭と政と不二なのでありました。そこで親房卿が神道を神國政治の要道であると解釋されたも尤もの次第であります。或は本居翁が道は天皇の天下を治めさせ給ふ正大公共の道なるを一己の私のものにして自ら狹く說きなしてたゞ巫覡などの業の如く、或は怪しき業を行ひなどして、それを神道となのるのはいとも〳〵淺ましくかなしきことなりと言つて居られるのは尤もの次第であります。即ち道は天皇が天下を治めさせ給ふ正大公共の道とは先に申しました翁の語も歸する所同一で一己の私のものでない。天下の政道であるといふのが翁の說であります。翁は即ち神道を政治の道と解せられたのであります。けれども之れが決して誤りでないのであります。それから其の次に我が神典に傳つて居ります通りに、天照大神が寳鏡を授け給ひ"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "42"
    "printed_page_end": "43"
    "url": "https://dl.ndl.go.jp/pid/943543/1/23"
    "source_sequence": 22
  "translation_ja": "その理由をさらに深く考えてみると、わが国では国史が示すとおり、上古には「神が天皇の座におられ、御殿をともにし、君主と神とが一体で、祭祀と政治とが分かれていない」という状態で、神と君主が一体、祭りと政治が一つだったのです。ですから、親房卿が神道を神国の政治の大切な道と解釈されたのも、もっともなことです。また本居翁が、「道とは、天皇が天下をお治めになる、公明正大で万人に共通する道である。それを一人の私的なものにして、自分から狭く説き、ただ巫女や巫者のわざのようにしたり、奇怪なわざを行ったりして、それを神道と名乗るのは、まことにまことに浅ましく悲しいことである」と言われたのも、もっともなことです。つまり、道は天皇が天下をお治めになる公明正大な万人共通の道であるというのは、先ほど述べた翁の言葉と帰するところは同じで、一人の私的なものではなく、天下の政治の道であるというのが翁の説です。翁は神道を政治の道と解釈されたのです。しかし、それは決して誤りではありません。次に、わが国の神典に伝えられているとおり、天照大神が宝鏡をお授けになった"

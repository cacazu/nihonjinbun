  "translation_ja": "内容を見ると、著者の田中先生は現在國學院大学の講師で、本書では平田翁の経歴、人柄・行動、学統から、学説、異説との対比、総括の各編にわたり、すなわち翁が生涯に説いた世界・人生などに関する学説を、体系的・組織的に叙述している。平田翁は誰もが知るとおり、わが国屈指の熱心な神道家で、その熱烈な言論には、ほかのものを焼き尽くさずにはやまない勢いがある。神道を尊んで儒教・仏教を排し、あらゆる異なる学説を力の限り退けるのは、翁の特色である。それゆえ独自の見識と気概があり、他に一歩も譲らない。いわゆる権威ある学者の説として、また一派をなす神道家として研究すれば、得るところは多大であろう。神道家はぜひ本書を買い求め、座右に置かれるとよい。"
  "translation_status": "reviewed"

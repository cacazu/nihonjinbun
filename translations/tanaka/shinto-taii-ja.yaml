- "id": "std-p0038-001"
  "section_id": "main-std-p0034-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "友であります。獨逸も吾々に畏服して來るのであります。吾々は決して此れ等を恐るゝの必要は全くないのであります。唯、獨り恐るべきものは今申した所の獅子身中の蟲であります。獅子は最も强い動物である。獅子一度び吼ゆれば百獸の腦が裂けると云ふ事であります。其の位强い獅子でもお腹の中に入つて來た眞田蟲或は蛔蟲などのやうな譯もない蟲には閉口する。さう云ふ蟲の爲には病氣を惹起して殺されて仕舞ふ。あれ程の獅子見た樣な强い動物でも小さい蟲の爲には殺されて仕舞ふのであります。我が國民は實に强き陸海軍を持つて居る。世界無敵とも云ふべき陸海軍を持つて居る。實に我が國民の元氣は他に當るべきものは無いのであります。けれども此の獅子身中の蟲の爲には害を受けないとは限りませぬ。それで吾々は此の獅子身中の蟲は何うしても撲滅しなければならぬ。之れを撲滅して、我が大道を宣揚し、我が皇威を八紘に輝かし、我が國光を宇內に遍からしむるは、我が國民の天職で、我が國民の努めざるべからざる本務であると思ひます。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "72"
    "printed_page_end": "73"
    "url": "https://dl.ndl.go.jp/pid/943543/1/38"
    "source_sequence": 37
  "translation_ja": "友です。ドイツも、私たちを恐れ敬い、服するようになるのです。私たちには、これらの国を恐れる必要はまったくありません。ただ一つ恐れるべきものは、いま述べた「獅子身中の虫」です。獅子は最も強い動物です。獅子が一度ほえると、あらゆる獣の脳が裂けると言われます。それほど強い獅子でも、腹の中に入ってきたサナダムシや回虫のような、何でもない虫には手を焼きます。そのような虫によって病気を起こし、殺されてしまいます。あれほどの、獅子のような強い動物でも、小さな虫のために殺されてしまうのです。日本国民は、実に強い陸海軍を持っています。世界に敵なしと言ってよい陸海軍を持っています。日本国民の活力には、ほかに匹敵するものがありません。しかし、この「獅子身中の虫」によって害を受けないとは限りません。だから私たちは、この「獅子身中の虫」をどうしても撲滅しなければなりません。それを撲滅して、日本の大道を広め、天皇の威光を世界中に輝かせ、日本の国の光をあまねく行き渡らせることは、日本国民の天職であり、日本国民が努めなければならない本来の務めだと思います。"
  "translation_status": "reviewed"

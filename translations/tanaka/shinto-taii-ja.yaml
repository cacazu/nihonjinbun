- "id": "std-p0034-003"
  "section_id": "main-std-p0034-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "以上述べて來ました樣な工合で、教育勅語は即ち神道の要旨を示されたものである。即ち皇祖皇宗の遺訓を以つて我が國民の守らなければならぬ所の道を示されたものである。決して教育勅語に於いては支那の孔子の遺訓を守れとか、又是れは孔子の遺訓であるとは教へられてない。釋迦の遺訓であるとは教へられてない。基督の遺訓であるとは教へられて無いのである。勿論吾々が孔子の遺訓釋迦の遺訓を奉じた所で憲法第二十八條に信教の自由を許されてありますからして、決して我が法律には觸れないのであります。けれども我が憲法が之れを許して居るからと云ふて、陛下の聖旨に背いて外のものに無中になつて、それで差支へないでありませうか。それで我が國民の責務が濟みませうか。斯う云ふ風な寬大な憲法を我が國民に與へられた陛下の聖旨に對して差支へないでありませうか。此の點は深く考を要すべきであると思ひます。一體吾が國民には斯くの如く立派な帝國の大道が行はれて居るのであります。吾が固有の大道が吾々の祖先からして今日に傳はつて來て居るのであります。然るにです。外國から新に傳はつて來た所の教に無中になると云ふのは、丁度之れを例へて見ますると小さい小供が……小さい二つか三つ位の赤兒に着物を着せやうと云ふ時に今斜子の黑紋附或は縮緬の黑紋附を着せやうとする。所が其の側に唐縮緬の派手な着物があると、小供は其の立派な黑紋附を棄てゝ派手な唐縮緬を着ると云ふて、何うしても肯かない。無智なる孩提の兒、三歲の童兒、何も知らない、物の道理を辨ずる事の出來ない三歲の童"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "64"
    "printed_page_end": "65"
    "url": "https://dl.ndl.go.jp/pid/943543/1/34"
    "source_sequence": 33
  "translation_ja": "以上述べてきたように、教育勅語は神道の要旨をお示しになったものです。すなわち、皇祖皇宗の遺訓によって、日本国民が守らなければならない道を示されたのです。教育勅語では決して、中国の孔子の遺訓を守れとも、これは孔子の遺訓であるとも教えられていません。釈迦の遺訓であるとも、キリストの遺訓であるとも教えられていないのです。もちろん、私たちが孔子や釈迦の遺訓を信奉したところで、憲法第二十八条で信教の自由が認められていますから、日本の法律には決して触れません。しかし、憲法がそれを許しているからといって、陛下の御心に背き、ほかのものに夢中になって、それで差し支えないのでしょうか。それで日本国民の責務を果たしたことになるのでしょうか。このような寛大な憲法を日本国民に与えてくださった陛下の御心に対して、それでよいのでしょうか。この点は深く考えるべきだと思います。そもそも、日本国民の間には、このように立派な帝国の大道が行われているのです。私たち固有の大道が、祖先から今日まで伝わってきているのです。それなのに、外国から新しく伝わってきた教えに夢中になるというのは、たとえてみれば、小さな子供――二つか三つぐらいの幼児に着物を着せようとして、斜子織の黒紋付や縮緬の黒紋付を着せようとするようなものです。そばに唐縮緬の派手な着物があると、子供は立派な黒紋付を捨て、派手な唐縮緬を着ると言って、どうしても承知しません。無知な幼子、三歳の子供、何も知らず、物の道理をわきまえることのできない三歳の子供"
  "translation_status": "reviewed"

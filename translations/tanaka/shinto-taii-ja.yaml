- "id": "std-p0006-003"
  "section_id": "main-std-p0004-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "私は是れに就いて最も適當なる一人の代表的の人物を茲に擧げて見やうと思ふ。それは誰れであるかと申しますれば、彼の遠江の國に出られたる賀茂眞淵翁の門人の一人、縣居門四天王の隨一と稱へられたる村田春海其の人であります。此の人は何う申して居りましたか。彼の言葉に、我が國の道とする所のものは周公孔子の道である。周公孔子の道を舍いて別に道を我が太古に取る。吾れ未だ之れを聞かざるなり。吾れは未だ斯う云ふ事を聞いた事はない。それであるからして和字は我が字ではない、漢字を借りて我が音に充てたのである。衣服冠冕—此の着て居る所の着物や冠は皆唐の制度である。百官有司皆唐の制を學んで居る。今日ならば西洋の制を學ぶと云ふのでせう。律だの令だの格だの式だの是れ皆唐の制を學んだのである。博士は明經文章天文陰陽それから律算音諸科の博士がある。併し和學博士とか歌學博士、即ち我が日本の學問の博士、日本の歌の學問の博士と云ふものは無い。勿論和歌博士と云ふ事があつたけれど"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "8"
    "printed_page_end": "9"
    "url": "https://dl.ndl.go.jp/pid/943543/1/6"
    "source_sequence": 5
  "translation_ja": "これについて、最も適切な代表的人物を一人、ここに挙げてみたいと思います。それは誰かというと、遠江国に生まれた賀茂真淵翁の弟子の一人で、県居門四天王の筆頭と称えられた村田春海、その人です。この人はどう述べていたでしょうか。彼の言葉では、日本で道とするものは周公・孔子の道であり、周公・孔子の道を捨てて、別に道を日本の太古に求めることは「私はまだ聞いたことがない」、そういうことはまだ聞いたことがない、というのです。そして、和字は私たち独自の文字ではなく、漢字を借りて日本語の音にあてたものです。衣服や冠、つまり身につけている着物や冠は、すべて唐の制度です。あらゆる官職や役人は、みな唐の制度を学んでいます。今日なら、西洋の制度を学ぶというのでしょう。律・令・格・式も、みな唐の制度を学んだものです。博士には、明経・文章・天文・陰陽、それから律・算・音などの学科の博士があります。しかし、和学博士や歌学博士、つまり日本の学問の博士や日本の歌を研究する博士はありません。もちろん「和歌博士」という言葉はありましたけれど"
  "translation_status": "reviewed"

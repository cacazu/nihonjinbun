  "origin": "source"
  "source_text": "著者は國學院大學の講師で、曩に神道哲學に關する二三の著書あり。最近には『平田篤胤之哲學』を公にして、我國固有の道學を闡明し、今又本著を發表するに至つた。內容は總叙に於て經歷を揭げ、性行を叙し、其學風より著書のことに及び、更に學統を詮索しては、復古神道の發展、學祖春滿、學父眞淵をあげ、本論に入りて世界論、原理論、政治論、宗教論、學問論、異端論等を詳にし、其學派を論じては、本居春庭、本居大平、服部中庸、齋藤彥麿、門派の巨擘、歿後の門人等に言及し、尙ほ統括には宣長學の反動、諸家との比較、批評等を紹介す。引證該博、細叙精記、讀む者をして肯ぜしめずんば竭まざらんとす。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/41"
    "source_sequence": 40
  "translation_ja": "著者は國學院大学の講師で、以前に神道哲学に関する二、三の著書がある。最近では『平田篤胤の哲学』を公刊して、わが国固有の道についての学問を明らかにし、今また本書を発表した。内容は、総叙で経歴と人柄・行動を述べ、その学風から著書に及ぶ。さらに学問上の系譜を探り、復古神道の発展、学祖の春満、学父の真淵を取り上げる。本論では世界論、原理論、政治論、宗教論、学問論、異端論などを詳述する。学派については、本居春庭、本居大平、服部中庸、斎藤彦麿、門派の大家、死後の門人などに言及する。さらに総括では、宣長学に対する反動、諸家との比較、批評などを紹介する。引用・論証は広範で、細かく丁寧に記述されており、読む者を納得させずにはおかない勢いである。"
  "translation_status": "reviewed"

- "id": "std-p0035-002"
  "section_id": "main-std-p0034-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "だんだんと述べ來まして、ほゞ神道なるものを大體明かにしたと思ひます。今眼を放つて社界の狀態を見ますと、學術は時々刻々に發達し、文明は年に月に進步して、社會の思想も色々に變遷して來るのであります。此の時に當つて世の輕跳俘薄の輩は、此の如く徒らに西洋の文明に心醉し、意氣揚々として得意の色をあらはし、顧みて神道を嘲り、神道は古陋なものである。神道は卑屈なものである。神道は陳腐なものである。神道は淺薄なものであると言ひ、而してその禮典儀式を蔑視するのである。勿論神道家なる者も實に多數あるのであるから、其の多數の神道家の中には、或は古陋な說を有する人もあるかも知れぬ。或は卑屈な說を唱へる者もあるかも知れぬ。或は陳腐な說を以つて金科玉條として居る者もあるかも知れぬ。或は淺薄なる頭腦を以つて社會に立つ者もないとも限らない。けれども之れを以つて直に神道がさう云ふものであると言つたならば是れは詰り一羽の鳥の頭の白いのを見付けて、鳥の頭は白いものであると斷定を下すのと同一で、何人も其の非論理の言を笑はざるを得ないだろうと思ふ。神道は古來神々の云爲行動に基く所の事實の道であるのである。而して古來の神々は、最も偉大なる神聖にましませば、神道なるものも一部の論者の言ふやうに、極めて狹い所の道でなく、已に述べたやうに、天地の公道であつ"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "66"
    "printed_page_end": "67"
    "url": "https://dl.ndl.go.jp/pid/943543/1/35"
    "source_sequence": 34
  "translation_ja": "ここまで順を追って述べてきて、神道というものをおおよそ明らかにできたと思います。いま広く社会の状態を見渡すと、学術は刻一刻と発達し、文明は年ごと月ごとに進歩し、社会の思想もさまざまに移り変わってきています。このような時に、世の軽薄な者たちは、むやみに西洋文明に心酔し、意気揚々と得意な顔を見せ、その一方で神道をあざけり、神道は古くさく、卑屈で、陳腐で、浅薄なものだと言って、その礼典や儀式を蔑視するのです。もちろん神道家という人も実に多いのですから、その中には、古くさい説を持つ人もいるかもしれません。卑屈な説を唱える人も、陳腐な説を絶対のよりどころとしている人もいるかもしれません。浅薄な頭脳で社会に立つ人も、いないとは限りません。しかし、それをもって直ちに神道はそういうものだと言うなら、それは頭の白い鳥を一羽見つけて、鳥の頭は白いものだと断定するのと同じです。誰もが、その非論理的な言葉を笑わずにはいられないだろうと思います。神道は、昔からの神々の言動に基づく、事実の道なのです。そして、古来の神々は最も偉大で神聖な存在でいらっしゃるのですから、神道も、一部の論者が言うような極めて狭い道ではなく、すでに述べたように、天地に共通する道であっ"

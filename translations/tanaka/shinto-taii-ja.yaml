    "text": "て、之れを學び、之れに做ひ、只管西洋人を崇拜し、彼れ等の口より出た言葉は、一にも二も金科玉條とし、如何なる金言金句も我が祖先のものは陳腐聽くに堪へないなどゝ云ひ徹頭徹尾西洋人たらんことを努め、世の一部の人士亦大いにかゝる徒輩を歡迎し、そのより多く西洋人らしき、學者、宗〓家などを理想的の人とするのは實に慨又歎の至りであります。殊に近頃以つて奇怪なるは、忠孝ランプ論なのであります。是れは忠孝は支那のもので、恰も日本にランプがなかつたやうに、なかつたものであると云ふのでありますがよくもゝーこんな無燃砲なことを類張りだしたものであります更に甚だしいのは、敬神崇祖の神道に反抗し、祭祀祈禱の儀典に妨害を加へんとするのであります。實に私は彼れ等が我が大日本帝國の臣民であるかを疑はざるを得ないのであります。彼れ等の血管に祖先より嫡々傳へ來れる温かき血液の流れて居るかを怪まざるを得ないのであります。"
    "description_ja": "NDL全文テキストJSONの対応ブロックを未改変で連結。画像照合後の本文と異なる。"

- "id": "std-p0014-001"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "いた事、或は又ナポレオンが一法律學者の息子を以つて佛蘭西全國の帝王となつた事、斯う云ふ樣な事は日本には無いのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "24"
    "printed_page_end": "25"
    "url": "https://dl.ndl.go.jp/pid/943543/1/14"
    "source_sequence": 13
  "translation_ja": "いたこと、また、ナポレオンが一法律家の息子の身でフランス全土の帝王となったこと、このようなことは日本にはないのです。"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943543"
    "original_unit_id": "943543_0000014:1"
  - "source_id": "ndl-943543"
    "original_unit_id": "943543_0000014:2"
- "id": "std-p0014-002"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "殊にです、最も甚だしいのは西紀一千七百九十二年に於ける佛蘭西の國會の態度であるのです。此の西紀一千七百九十二年の佛蘭西國會に於いては何うでありましたか。國王を數ヶ月間も牢獄の中へ入れて置いて、さうして遂に之れを國會の前に引出して來て是より此の國王が有罪であるか無罪であるかを決し、有罪であるとしたならば其の所罸を國民に諮るべきや否やを決し、而して其の所罸法は如何なる刑罸を之れに加ふべきかを議會に於いて諮つたのであります。所が其の議會に於いては······佛蘭西の國會に於いては、國王は有罪であると決定したのであります。國民に諮るの必要は無いと決定したのであります。國王を死刑に處すべしと決定したのであります。其の國王を死刑に處すると云ふ投票、其の投票は實に佛蘭西國民の勤王心の何の位の程度にあるかと云ふ事を試驗する所の投票である。盤根錯節には遇ずんば何を以つて利器を別たんと云ふ事がありますが、其の點から云ふと此の投票は實に勤王心を試驗する所の大いなる機會であつたのであります。此の投票の結果總數七百二十一票の中で二十六票の多數を以つて國王を死刑にしろと云ふ事に決定したのであります。我が國民であつたならば斯くの如き事は夢想する事も出來ないのであります。此の點が即ち根本の違つて居る所以であります。勿論此の多數の內には暴徒から迫害を受けて國王を死刑に處すべしと投票しなければ殺すぞと强迫せられた者もありませう。殺すと云はれたつて構はないではありませぬか。和氣の清麿公は何うでありましたか。惡僧道鏡の爲に既に殺されやうとしたではありませぬか。殺されたつて構はない。我が君國の爲には一身を犠牲にすると云ふのが日本國民の特徵である。佛蘭西國民はさうではない。君國よりも一身の方が大事なのである。君國の存亡よりも自分が殺される方が恐いのである。そこで斯樣な亂暴も敢へてするのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "24"
    "printed_page_end": "25"
    "url": "https://dl.ndl.go.jp/pid/943543/1/14"
    "source_sequence": 13
  "translation_ja": "とりわけ甚だしいのは、西暦1792年におけるフランスの国会の態度です。この1792年のフランス国会では、どうだったでしょうか。国王を数か月も牢獄に入れておき、ついに国会の前へ引き出して、この国王が有罪か無罪かを決め、有罪ならばその処罰を国民に諮るべきかどうかを決め、さらにどのような刑罰を加えるかを議会に諮ったのです。そこで議会は――フランスの国会は――国王は有罪であると決めたのです。国民に諮る必要はないと決めたのです。国王を死刑に処すべきだと決めたのです。国王を死刑にするというその投票は、実にフランス国民がどの程度の勤王の心を持っているかを試す投票でした。「複雑に絡んだ根や節に出会わなければ、どうして刃物の切れ味を見分けられようか」という言葉がありますが、その意味では、この投票はまさに勤王の心を試す大きな機会だったのです。この投票の結果、総数721票のうち、26票の差の多数決で国王を死刑にすることに決まりました。わが国民ならば、このようなことは夢想することさえできません。ここに、根本が違っている理由があるのです。もちろん、この多数派の中には暴徒に迫害され、国王を死刑にすべきだと投票しなければ殺すぞ、と脅された者もあったでしょう。殺すと言われても構わないではありませんか。和気清麿公はどうだったでしょうか。悪僧道鏡のために、今にも殺されようとしたではありませんか。殺されても構わない。わが君主と国家のためには一身を犠牲にするというのが、日本国民の特徴です。フランス国民はそうではない。君主や国家よりも自分の身の方が大事なのです。君主と国家の存亡よりも、自分が殺される方が恐ろしいのです。そこで、このような乱暴なこともあえて行うのです。"

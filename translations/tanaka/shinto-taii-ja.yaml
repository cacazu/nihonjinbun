  "translation_ja": "『古語拾遺』に「聞くところによれば、上古の世にはまだ文字がなく、身分の高い者も低い者も、老人も若者も、口から口へと伝え、先人の言葉と行いを保ち、忘れなかった」とあるとおり、忘れることのないわが国民が、実に記憶力の最も豊かなわが国民が、忘れずに伝えてきた伝説です。その伝説は『古事記』や『日本書紀』という本になって、確実に伝わってきました。もちろん、このような伝説は外国ではミス（myth）またはミソロヂー（mythology）という言葉で表され、詳しさや精密さの違いはありますが、たいていの国に存在しています。この伝説は、当時のあらゆる文化の精華を集めたものです。つまり、その当時の文明の要点を、すべて神話の中に含んでいたといわれています。今日の心理学者の説によれば、人間の精神活動には知識、感情、意志があります。この三つが別々に存在するのではなく、精神活動が知的、感情的、意志的という三つの面を持っているのです。したがって、世の文化もこの三つの大きな方面に分けることができます。そこで、伝説の中にある上古の文化を、知的系統、感情的系統、意志的系統の三つに分けられます。知的な方面とは何かといえば、政治的系統です。感情的な方面は宗教的系統、意志的な方面は道徳的系統です。したがって、当時の文化の精華を含んでいる伝説には、この三大系統がすべて含まれています。しかし外国では、民族がたえず集まったり散らばったり、いわゆる離合集散を繰り返し、国家も興ったり滅びたりして、いわゆる興亡存滅を繰り返しています。そのほかにもさまざまな事情があったため、伝説はほとんど消えてしまい、後の学者が考えた政治、道徳、宗教がそれにすっかり代わって、今日、広く行われるようになりました。ところが、わが国は外国とは事情が違い、当時の大政治家、大宗教家、大道徳家であった神々の子孫が、君主として永くこの国を治め、その神々の分かれた一族や末の一族が、永く臣民として君主に仕えるという国体です。ですから、人種は変わりません。国体も変わりません。外国のように人種が離合集散し、国家"

  "source_text": "るには文明教を奉ぜねばならぬ。そんなことを盛に言出して來た。ナンでもカンでも基督教でなくてはならぬ。又基督教を信ずるものは偶像を崇拜する事は出來ない。寫眞に向つて御辭儀は出來ないといふやうな不都合な奴輩を出す樣になつて來た。是れは御誓文の上の方ばかり採つて來た弊害である。それから又道德の方面はどうかといふと、道德は快樂主義に限る。人生快樂是れに越したことはないなんと云つて、快樂主義とか、幸福主義とかいふ方面ばかり主として實に大變な事になつて來た。所謂風俗頽敗道義地を拂うて、紳士も墮落し、靑年も墮落し、社會も墮落し、ドーも不都合の狀態を呈して來た、それがどういふ譯かといふと、詰り此の五ヶ條の御誓文に舊來の陋習を破り天地の公道に基くべしと云ふことを考へて居らぬ。天地の公道といふのは古今に通じて謬らない、中外に施して悖らない大道でなくてはならぬ。是れ以上の天地の公道はない。是れ以上の天地の公道はないのだ。けれどもそこに氣が付かないで徒らに外國の方に眼を走せて居るからさういふ狀態を呈して來る。大に皇基を振起すべし、即ち知識を世界に求むるのは此の皇基を振起するのが目的である。徒らに外國の知識を求むるばかりでない。知識ばかり求めても何もならぬ。乾燥無味な人世ではない。そんな知識ばかりで人間は生活が出來るものではない。其の知識を求むる所以のものは更に其の奧に大に皇基を振起して國民の眞生活を味はなくてはならないからである。其の事は忘れて仕舞つて居る。肝腎なことを忘れて居る。さういふ譯で一にも西洋、二にも西洋。政治でござれ、宗教でござれ、道德でござれ、悉く西洋主義でなければならぬと云ふ事になつて來た。西洋の文明に心醉してそれを殆んど丸呑にした結果として實に日本國民は非常な混亂な狀態を呈して來た。學者であらうが、政治家であらうが、實に名狀すべからざる狀態になつて來た。即ち今申した風俗頽敗道義地を拂うて、墮落に重ぬるに墮落を以つてし、かの百鬼晝行といふ有樣を現出した、斯ういふ狀態を現出したので其"

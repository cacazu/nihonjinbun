    "text": "元田中義能先生著(目下品切)文學士全布製一錢圓冊系統的西洋〓育史定價金貳郵稅金十二萬朝報評西洋各國に於ける、かて此一系統的西洋教育史」教育的事實及び運論を歷史的に〓究し、也邦文教育史としては兩三氏の著譯なきに非ざれど、之を系統的に記述せるもの、或はや簡約に過ぎ、用ひ或は晦澁に失して多少の遺憾なきを得ざりき。本書は特に意を這般の缺陷を補足するに且つ處々丁寧なる、註解を爽むなど、讀近來の好述作たるを失はざるべし。丁曾論倫理講演集評時代の順序に依つて記載するものゝ、年代よりも、思想及び事實の連絡に重き理會を置けり故に之ん發展的に記でし教言學なりと云ふ事を得ん。之れ著者の企てたる所にして、本書亦能く成功せ〓育上有用なる參考書たる勿論なり文學士田中義能先生著布製全一最科學的〓育學定價金壹圓八拾錢新郵稅金十二錢效東京朝日新聞評著者は曩に「系統的西洋教育史」を公にせし人なり。此の書は西洋に發達せる思想と教育とを研究し之を骨肉として更に東洋殊に日本固有の思想と教育とを研究し之を精神として一大系統的教育學を組成せるものにて、體系の整然たると、議論の穩健なるとは此の書の特色なり。哲學雜誌評文學士田中義能氏は篤學の教育家にして、ある又氏は教育學は純粹に學なりといへど、最も穩當なる學說を持し且つ唱へて居る人で歐洲人の教育學が歐洲國民的彩色の基になれる教育學である樣に本邦に於ける教育學も、只西洋輸入でなく、其れに國民的精神を着色することを忘れてはならぬといふ意見を持つて居る。是等の意見を本として出來上つたものが則ち本著科學的〓育學である。本書は注意の能く行屆いた、諸方面の問題に普くふれて、所謂まめに手際に出來て居る本である行文は最も流暢思想は太だ穩健帝先練の女字中に健全の常識が貰いて居るのは氏の特色である。讀者は必ずや此に由つて教育學の智識を新にし且つ豐かならしむることあるを思ふ。兌發田神京東舘文同番五三一座口替振育〓〓著新の讀必家"

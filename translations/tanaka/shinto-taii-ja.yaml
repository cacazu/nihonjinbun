  - "kind": "ocr"
    "text": "し時の神勅及び高皇產靈尊の「あまつひもろぎ」「あまついはさか」の神勅の如き、其の他祭祀が行はれ、或は禊とか祓とか神樂とか色々昔から行はれた儀式です。斯ういふ風な儀式を研究して見ますとどうしても宗〓的儀式、即ち吾々民族の宗〓的感情の發表としか見られない。それでありますからして黑住宗忠氏の如く或は井上正鐵氏の如くあゝいふ風な熱烈な宗〓心の强い人であると、どうしても神道は宗〓に見えるのであります。勿論神道は佛〓や基督〓の樣な偏狹な宗〓ではなく、此れ等を超越した宗〓なのであります。が何れにしても神道は宗〓とも見えるのであります。それから山崎闇齋先生や平田篤胤翁やその他今日でも道德的方面を重んずる學者は、神道は全く道德であると解するのであります。成程さういふ眼を以つて見ると古傳の傳へまする神々の行爲は一々我々の日常の行爲の規範を示されたものと解せられ、それから又此の神道に行ひまする崇拜です。神樣を拜むのです。之れも道德的方面の人が見ますと、唯々本に報い始に反る所以である。斯ういふ風に神道は道德であると眼に映じて來るのでございませう。コー云ふ次第でありますから神道は、道德である、倫理であるといふのは誤りでないのでございますが併し之れは先に申しますやうに象を撫でゝ白のやうなものである、蛇のやうなものである、壁のやうなものである。斯う申したのも間違ひでないのと同じでありまして、斯う申したのが間違ひとは斷言せられないのであります。實際或る所は蛇のやうでありますし、或る所は白のやうでありますし、或る所は壁のやうであるからであります。決して間違ひではありません。けれども其の考はどうも部分的であつて偏見と言はなければなりませぬ。それで大正の昭代、かくも盛に發達して來た其の學問を應用してさうして此の神道といふものを研究して見ますと、どうしても此の神道といふものは、その起源から見ましても、その典據から見ましても神道の性質は政治·宗〓·道德といふ三大系統が即ち三大要素を成して居るやうに思はるゝのであります。勿論斯う"

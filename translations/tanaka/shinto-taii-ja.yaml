- "id": "std-p0035-001"
  "section_id": "main-std-p0034-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "兒が斜子の黑紋附を棄てヽメリンスの華やかなるを取るのは止むを得ぬ止むを得ぬけれども堂々たる有髯の男子。堂々たる大丈夫が少なくとも事理を解し得る所の人々が、斜子の黑紋附が其處にあるに、それを棄てヽメリンスの着物を喜んで着ると云ふのは實に憐れな話ではありませぬか。先に述べました村田春海等は此の一流であると思ふ。西洋文明の潮流は社會主義とか、本能主義とか、自然主義とか、誤れる基督教などを益々輸入し來つて春海等よりは一層惡人物を愈々多く作ると思ふ。勿論憲法第二十八條は條件附でありますから、極端になれば、制裁は加へられませうが、何れにしても實に慨嘆に堪えない次第であります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "66"
    "printed_page_end": "67"
    "url": "https://dl.ndl.go.jp/pid/943543/1/35"
    "source_sequence": 34
  "translation_ja": "が、斜子織の黒紋付を捨てて華やかなメリンスを選ぶのは、仕方がありません。仕方がありませんが、堂々と髭を生やした男子、堂々たる一人前の男、少なくとも物事の道理を理解できる人々が、斜子織の黒紋付がそこにあるのに、それを捨て、メリンスの着物を喜んで着るというのは、実に哀れな話ではありませんか。先ほど述べた村田春海らは、このたぐいだと思います。西洋文明の流れは、社会主義、本能主義、自然主義、誤ったキリスト教などをますます輸入し、春海らよりもいっそう悪い人物を、さらに多く生み出すと思います。もちろん憲法第二十八条は条件付きですから、極端になれば制裁は加えられるでしょうが、いずれにしても、実に嘆かわしくてなりません。"

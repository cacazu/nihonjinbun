  "source_text": "家庭教育以て學校教育社會教育などゝ共に一個の特立したる教育學たらしめんとして、之を系統的に論述したるものそが此家庭教育學なり、篇を分つこと八更に之を二十九章八十九節に分ち家庭教育の意義由來目的より始めて結婚住居姙娠胎教出產哺乳子守疾病看病智育情育意育母の任務家庭教師などに至るまで極めて微に入り細に亘りて詳述し擧げられたる項目の數のみにても實に四百數十の多きに及び、述論整然として頗る要を得系統的に論述されたる此種の著書として蓋しオーソリチーたるに足らん、加ふるに口語調を採りて平易なる記述を試みたるは双手を擧げて吾人の最も歡ぶ所、評者は此書を一般家庭の珍として推奨するに吝かなるものにあらざるなり"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/40"
    "source_sequence": 39
  "translation_ja": "家庭教育を、学校教育や社会教育などと並ぶ独立した教育学として確立しようと、体系的に論じたのが、この『家庭教育学』である。全8編をさらに29章89節に分け、家庭教育の意義・由来・目的から始め、結婚、住居、妊娠、胎教、出産、授乳、子守、病気、看病、知育、情操教育、意志の教育、母の役割、家庭教師などに至るまで、非常に細かく詳述している。取り上げた項目だけでも実に四百数十に及ぶ。議論は整然として要点を押さえ、この種の体系的な著書として権威あるものとするに十分であろう。加えて、口語体による平易な記述を試みたことは、私たちが両手を挙げて最も歓迎するところである。評者は、本書を一般家庭の貴重な一冊として、ためらうことなく推薦する。"
  "translation_status": "reviewed"

- "id": "std-p0049-005"
  "section_id": "ads-scan-49"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "西洋各國に於ける、教育的事實及び理論を歷史的に研究し、之を系統的に記述せるもの、やがて此「系統的西洋教育史」也。邦文教育史としては兩三氏の著譯なきに非ざれど、或は簡約に過ぎ、或は晦澁に失して多少の遺憾なきを得ざりき。本書は特に意を這般の缺陷を補足するに用ひ、また書中の固有名詞には大抵英獨佛三樣の原語を附し、且つ處々丁寧なる、註解を挾むなど、讀者の便宜を計りたること少からず。近來の好述作たるを失はざるべし。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/49"
    "source_sequence": 48
  "translation_ja": "西洋各国の教育上の事実と理論を歴史的に研究し、体系的に記述したのが、この『系統的西洋教育史』である。日本語で書かれた教育史には二、三の人の著作・翻訳もあるが、簡略すぎたり、難解であったりして、多少の不満が残った。本書は特に、こうした不十分な点を補うことに意を用いている。また、本文中の固有名詞には、たいてい英語・ドイツ語・フランス語の三種類の原語を添え、ところどころ丁寧な注解を挟むなど、読者の便宜を数多く図っている。近頃の好著というべきだろう。"
  "translation_status": "reviewed"

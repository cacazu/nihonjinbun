    "text": "思ひます。實に我が國に大道の存在する事は恰も天に日輪の懸かつて居るが如きもので、斯くの如く明らかで、斯くの如く明〓々たる大道が存在して居るのに、是れには一向氣が附かずして徒らに外に求めると云ふのは、猶自分の頭が無くなつたと云つて騷いで居るのと同じ事だらうと思ふのです.平田篤胤翁の父上は篤胤翁に向つて、若し孔子が日本の國に生れたならば決して儒〓は說かないで我が神道を說いたに違ひない。我が國固有の大道を說いたに違ひない。それ故に。其の方も此の方面に向つて研究しろと云ふ事を〓へられたと云ふ事である。成る程さうであらうと思ふ。若し孟子が-支那の孟子が我が國に來て見ましたならば、村田春海一流の人物を評して所謂喬木を下つて幽谷に入る者とは是れ等の事であるかと云ふであらうと思ふ。高い所の地位を下つて態々薄暗い谷底に入る者とは是れ等の事だらうと孟子は笑つたに相違ない。けれども吾々日本民族に於いては斯くの如き輩を默過して笑つて濟ます譯には行かぬ。何うしても斯う云ふ連中から先づ以つて我が帝國の大道の存在を明らかにさせないと我が將來の國家を如何せんと斯う私は信ずるのであります。"

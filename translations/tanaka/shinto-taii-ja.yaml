  "source_text": "アリストートルとか、カントとか、大思想家の思想や學說を知りたいと思ふに、今日のやうに忙しい時代には、とてもこんな大思想家の浩瀚な著書を一々讀む譯には行かない。そこで西洋には、以前からこんな大思想家の評傳が、色々出來て居て、容易にその思想學說を知ることが出來る。けれど我が國には此の種のものが甚だ乏しい。近來漸く文運の進步に伴ひ、多少かゝる種類のものも出て、學界に貢献せる所が少くない。只憾むらくは主として儒教の思想家に限らるゝの觀あることである。處が、國學院大學講師文學士田中義能氏、熱心教育の學理を研究しその實際に從事すると同時に、我が國固有の學の思想家の研究に從事し、曩に已に『平田篤胤之哲學』を公にし、今又茲に新に、尨然たる『本居宣長之哲學』を大成した。就て此の書を見るに、宣長の思想を中心とし、春滿眞淵及び大平內遠等、その學統に關する學者の學說をも、系統的組織的に論述し、能く復古神道派の學說を紹介して至れり盡せりと謂ふべきである。而して之れを論述するに、著者得意の明快なる文章を以つてして居る。引證は該博で、議論は痛切。慥に近來の好著述と謂ふべきである。我が思想界の混亂益々甚しからんとするに當り本書の公刊を見たるは、風教の爲に大に賀すべきである。吾人は敢へて此の書を讀者に推薦するものである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"

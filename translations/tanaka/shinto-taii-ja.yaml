    "source_sequence": 4
  "translation_ja": "およそ生きているものは、何でも生存競争をしています。例えば、そこにセミが一匹鳴いているとすると、それをスズメが捕らえようとしています。そのセミを捕らえようとするスズメを、タカが捕らえようとしています。するとまた、そのスズメを捕らえようとするタカを、猟師が捕らえようとしています。このように、この世の生きとし生けるものは、すべて生存競争をしています。そしてこの生存競争は、生きものの中で最も高等な人類においても絶えません。ただし人類の生存競争には、その上に国家というものがあるので、太古の野蛮なあり方や下等動物のような野蛮な競争はせず、きわめて高等な競争をしています。しかし国家そのものとなると、その上で制するものがありません。そのため、国際法などがあっても、その力はきわめて弱いのです。一度、勢力の均衡が崩れれば、その力はきわめて弱いものです。そういうわけで、国家どうしの生存競争は非常に激しく、非常に残酷です。昔から国家は互いに生存競争をしてきました。しかも、きわめて残酷で激烈な生存競争をしてきたのです。ですから、世界各国の興亡は、実に果てしなく続いてきました。まさに修羅のような競争といってよいでしょう。このような修羅のごとき激しい競争をしてきた国家の間にあって、私たちの大日本帝国が、数千年にわたり少しも土地を外国に奪われず、いわゆる金甌無欠の帝国を維持してきたのは、どういうわけでしょうか。これが一つの大きな疑問です。"
  "translation_status": "reviewed"

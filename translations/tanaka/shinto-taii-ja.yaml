  "translation_ja": "のだ」と言います。腹に触れた人は、「ひどくごつごつした、塗り方の下手な壁のようなものだ」と言います。このような解釈をするのです。先ほど述べた学者たちの説も、これに似た説ではないかと思います。神道は、儒道、仏道、その他「道」と呼ばれるものの中でも、極めて範囲の大きいものです。平田篤胤翁は『古道大意』で、「どの学問が一番大きいかといえば、少し身びいきのようだが、御国、つまりわが国の学問ほど大きいものはない」と言い、また『入学問答』という本でも、「皇国の学問ほど広大なものはない」と言っています。そのとおりで、神道の範囲は大きく、百、千、万の象どころではありません。ところが、たとえその時代の大学者でも、時勢、境遇、その時代の知識の程度を超えることはできません。どんな大学者も、時代の知識から抜け出すことはできないのです。その時代の最高の知識を集めた人が、その時代の大学者なのであって、それ以上に飛び出すことはできません。こうした時勢、境遇、時代の知識という雲がかかっているため、大学者でも、これほど広大な神道の全体を見ることはできないのです。しかし、今日では大正の大御世となり、文物が輝かしく発達してきたため、時勢や境遇も急速に変化し、知識の水準も非常に進んできました。昔の北畠親房、一条兼良、山崎闇斎、本居宣長などの大先生たちの時代に比べて、知識の水準は大いに進みました。普通の人でも、その当時の優れた人ほどの知識を持っているというように、今日では知識の水準が大いに発達しています。このように発達した知識を基礎にして研究すれば、比較的正確な判断ができます。そのような判断から見れば、神道は政治だ、道徳だ、宗教だといった、一つだけの見解を与えるのは、前世紀の議論と言ってよいと思うのです。"

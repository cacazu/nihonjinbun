  "translation_ja": "であるという意味で、とりわけこの荷田春満翁の歌は、神道の本来の意味をよく明らかにしています。こうしたわけで私は、教育勅語に示されたのは日本国民すべてが行わなければならない道であり、それこそが神の道、わが帝国固有の大道である、と結論したいのです。"

  "translation_ja": "下すのです。しかし、このように教育勅語を、儒教の要旨であるとか、仏教の意味であるとか、キリスト教の教えを説かれたものだとか、勝手なことを言うのは、わが帝国憲法は西洋の憲法の翻訳だと言うのと同じでしょう。そもそも、わが帝国憲法が西洋の憲法の翻訳物であり同じものだと言うのは、日本人も西洋人も鼻は一つ、目は二つついている、鼻は縦についており、目はやはり横についている、不思議にも日本人も西洋人も同じだ、という議論と同じことだと思います。もちろん西洋人も日本人も鼻は縦についています。鼻が横についている者は見かけません。また、目が縦についている者はいません。目と鼻を比べれば、西洋人ばかりでなく、中国人も日本人と同じだと言えるでしょう。しかし、このように日本人と中国人が同じで、日本人と西洋人が同じであったならば、明治の二大戦争、すなわち日本と清国、日本とロシアとの戦争で、人口が多く、面積が広く、国が豊かで、兵器がきわめて優れ、軍隊の数が多い、この清国、このロシアが、なぜ人口が少なく、面積が狭く、兵隊の数が少なく、資金力に乏しい日本に負けたのでしょうか。同じように鼻が縦につき、目が横についている者ならば、つまり同じ人間であったならば、数学の法則に従って数の多いほうが勝たなければならないはずです。ところがそうならないのは、つまり、兵器や軍人の数、人口や面積といったもののほかに、そうしたものとは比較できない、ある特別なものがあるために、このような結果が生じるのだと思います。すなわち、日本固有の大道が日本の人々の間で行われているから、つまり世界に並ぶもののない大道が行われているから、このような結果が生じるのです。どれほどの強国であっても、これに向かってはひるまずにはいられません。教育勅語は、この大道を示されたものだと私は思います。つまり、教育勅語で説かれた意味には、もちろん儒教にも似たところがあるでしょう。「父母に孝行し、兄弟には仲よくし、"

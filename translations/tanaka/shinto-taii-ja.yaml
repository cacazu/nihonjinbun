  "source_text": "下すのであります。併し斯う云ふ風に教育勅語を以つて或は儒教の要旨であるとか、佛教の意味であるとか、或は基督教の教を說かれたのであるとか、斯う云ふ樣に勝手な事を云ふのは、我が帝國憲法は、是れは西洋の憲法の飜譯であると云ふのと同じであるのでありませう。一體我が帝國憲法が西洋の憲法の飜譯物である、同一物であると斯う申すのは日本人も西洋人も鼻は一つだ、眼は二つ着いて居る。所が鼻は縱に着いて居る、眼は矢張り橫に着いて居る、不思議に日本人も西洋人も同じ事である。斯う云ふ議論と同じ事だと思ふのでございます。勿論西洋人も日本人も鼻は縱に着いて居る。鼻の橫に着いて居る者は見えない。又眼の縱に着いて居る者は無い。眼と鼻と比較したら西洋人ばかりではない、支那人も日本人と同一であると云へませう。けれども斯くの如く日本人と支那人は同一である。日本人と西洋人と同一でありましたならば、明治の二大戰役即ち我が日本と淸國、我が日本と露國との戰爭に於いて、人口の多い、面積の廣い、國の富んだ、兵器の極めて優れて居る、軍隊の數の多い、此の淸國、此の露國が何故に人口の少ない、面積の狹い、兵隊の數の少ない、金力に乏しい此の日本に負けたのでありませうか。同じ鼻が縱に着き眼が橫に着いて居るものならば、即ち同一人間であつたならば數學上の法則に從つて數字の多い方が勝たなければならぬ譯である。然るにさう行かないと云ふものは、即ち此の兵器或は軍人の數、或は人口、或は面積、さう云ふものゝ外にさう云ふ物とは比較する事の出來ない一種特別なものがあるからして斯う云ふ結果を生ずるのであると思ふ。即ち我が固有の大道と云ふものが我が國人の間に行はれて居るからして、詰り世界に並びのない所の大道が行はれて居るからして斯う云ふ結果を生ずるのである。如何なる强國と雖も是れに向つては辟易せざるを得ないのであります。教育勅語は此の大道を示されたものであると私は思ふのであります。詰り教育勅語に於いて說かれた意味は勿論儒教に於いても之れに似た所がありませう。父母に孝に兄弟に友に"

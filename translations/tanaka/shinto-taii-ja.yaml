- "id": "std-p0023-001"
  "section_id": "main-std-p0021-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "が興亡存滅することは曾て無いのであります。それでありますからして、傳說、それが生きて居りまして長へに民族の上に勢力を持つて居るのであります。で、此の民族といふものゝ固有の道徳でも政治でも宗教でも悉く此の傳說から發達して來たのでございます。それを名付けて吾々は神道と申すのであります。神道はかゝる性質を持つて居るものであります。ですからして政治的思想に富んで居るものが見ますれば神道は政治であると解し、非常に宗教的感情の熱烈なる人から見ますると神道は宗教であるとし、盛に宗教として之れを唱道するのであります。道德的意志に偏した人から見ますれば神道は道德である、何處迄も倫理であるといふのであります。斯ういふ說は皆眞理を含んで居りますが皆、偏見、斯ういふことが出來るのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "42"
    "printed_page_end": "43"
    "url": "https://dl.ndl.go.jp/pid/943543/1/23"
    "source_sequence": 22
  "translation_ja": "が興ったり滅びたりすることは、かつてないのです。そのため、伝説が生き続け、いつまでも民族の上に力を持ち続けています。そして、この民族に固有の道徳も政治も宗教も、すべてこの伝説から発達してきたのです。これを私たちは神道と呼びます。神道はこのような性質を持っています。ですから、政治的な思想の豊かな人が見れば、神道は政治であると解釈し、宗教的感情の非常に熱烈な人が見れば、神道は宗教であるとして、盛んに宗教として唱え広めるのです。道徳的意志に偏った人が見れば、神道は道徳であり、どこまでも倫理であると言います。こうした説はみな真理を含んでいますが、みな偏った見方だと言うことができます。"

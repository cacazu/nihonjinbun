  - "source_id": "ndl-943543"
    "original_unit_id": "943543_0000002:15"
  "source_variants":
  - "kind": "ocr"
    "text": "時世を騷がしました、社會主義のやうなものも、多くの靑年男女を盡毒しました本能主義、自然主義のやうなものも、皆西洋の文明に心醉し、所謂西洋化した結果に外ならないのであります。洋服を着、靴を穿ち、手眞似口眞假まで出來る丈け西洋人をまねんとして、遂に精神までも西洋人にならんとした結果に外ならないのであります。恰も牛乳を飮んで、そして牛にならんと努むるやうなものであります。牛乳を飮むからとて精神までも牛となつては、なさけないではありませんか。西洋文明が如何によいからと"
    "description_ja": "NDL全文テキストJSONの対応ブロックを未改変で連結。画像照合後の本文と異なる。"
- "id": "std-p0003-001"
  "section_id": "main-std-p0002-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "て、之れを學び、之れに做ひ、只管西洋人を崇拜し、彼れ等の口より出た言葉は、一にも二も金科玉條とし、如何なる金言金句も我が祖先のものは陳腐聽くに堪へないなどゝ云ひ徹頭徹尾西洋人たらんことを努め、世の一部の人士亦大いにかゝる徒輩を歡迎し、そのより多く西洋人らしき、學者、宗教家などを理想的の人とするのは實に慨又歎の至りであります。殊に近頃以つて奇怪なるは、忠孝ランプ論なのであります。是れは忠孝は支那のもので、恰も日本にランプがなかつたやうに、なかつたものであると云ふのでありますがよくもマアこんな無鐵砲なことを頬張りだしたものであります。更に甚だしいのは、敬神崇祖の神道に反抗し、祭祀祈禱の儀典に妨害を加へんとするのであります。實に私は彼れ等が我が大日本帝國の臣民であるかを疑はざるを得ないのであります。彼れ等の血管に祖先より嫡々傳へ來れる温かき血液の流れて居るかを怪まざるを得ないのであります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "2"
    "printed_page_end": "3"
    "url": "https://dl.ndl.go.jp/pid/943543/1/3"
    "source_sequence": 2
  "translation_ja": "て、それを学び、それにならい、ひたすら西洋人を崇拝し、彼らの口から出た言葉は何でも絶対に正しいものとし、どのような金言や名句でも私たちの祖先のものは古くさくて聞くに堪えないなどと言って、徹底して西洋人になることに努める。そして世間の一部の人々もそういう連中を大いに歓迎し、より西洋人らしい学者や宗教家などを理想の人物とするのは、実に嘆かわしい限りです。とりわけ近頃、奇怪なのは「忠孝ランプ論」です。これは、忠孝は中国のもので、日本にランプがなかったのと同じように、日本にはもともとなかったものだというのですが、よくもまあこんな無鉄砲なことを平然と言い出したものです。さらにひどいのは、神を敬い祖先を尊ぶ神道に反抗し、祭祀や祈禱の儀式を妨害しようとすることです。私は、彼らが本当に大日本帝国の臣民なのか疑わずにはいられません。彼らの血管に、祖先から代々受け継いだ温かい血が流れているのか、怪しまざるをえないのです。"
  "translation_status": "reviewed"

    "text": "『靑年及靑年團』(第三卷第五號)評アリストートルとか、カントとか、大思想家の思想や學說を知りたいと思ふに、今日のやうに忙しい時代には、とてもこんな大思想家の浩瀚な著書を一そこで西洋には、以前からこんな大思想家の評傳が、々讀む譯には行かない。色々出來て居て、容易にその思想學說を知ることが出來る。けれど我が國には此の種のものが甚だ乏しい近來漸く文運の進步に伴ひ、多少かゝる種類のものも出て、學界に貢献せる所が少くない只憾むらくは主として儒〓の思想家に限らるゝの觀あることである處が、國學院大學講師文學士田中義能氏、〓心〓育の學理を研究しその實際に從事すると同時に、我が國固有の學の思想家の研究に從事し、曩に已に『平田篤胤之哲學』を公にし、今又茲に新に、尨然たる『本居宣長之哲學』を大成した。就て此の書を見るに、宣長の思想を中心とし、春滿眞淵及び大平內遠等、その學統に關する學者の學說をも系統的組織的に論述し能く復古神道派の學說を紹介して至れり盡せりと謂ふべきである而して之れを論述するに著者得意の明快なる文章を以あるは、つてして居る風〓の爲に大に賀すべきである。我が思想界の混亂益々甚しからんとするに當り引證は該博で議論は痛切吾人は敢へて此の書を讀君に推薦する慥に近來の好著述と謂ふべきで本書の公刊を見たるものである『東京每日新聞』(一三二七五號)評吾國に固有なる哲學あり、之れを和道哲學と云ひ、鈴之屋大人は方にこれが研究に一生を捧げたる人。の著者として疾くに著者に此の著なかるべからざりしなり和道哲學の研究者として、兼ねて平田篤胤之哲學宣長の著書五十部百三十餘卷此の中より著者の所謂和道哲學の眞髓を抽出せるの勞は、之を多とせざるべからず學哲之長宣居本『二六新報』(四八九六號)評吾國の神道なるものが佛教の輸入と共に、一種の變態を來して終に佛教的神道となり、盛に佛教諸家に利用された事は歷史の明かに示す所である。是は後に唯一神道となりて稍々面目を改めたけれども、尙ほ本來の面目を發揮する能はずして、唐宋諸儒の精粕、胎金兩部の餘瀝を殘さない譯に行かなかつた。此の間にありて系脉を直に古代に取り、我が固有の神道を主張し得た者は實に復古神道の諸家である。復古神道の學父とも云ふべき人は加茂眞淵で、眞淵の正脈を受け繼いで復古神道を大成するに至つた人は實に本居宣長である。或人は神道を稱して宗〓と云ふ程の價値はないと云ふ。成程日本の神道にはバイプルやコーランや諸種の佛典のやうな、完備した經典はないかも知れぬが、然し復古神道家の宇宙說、創世說、神祇說に宗〓的將た哲學的價値がないと云ふことが出來やうか。復古神道に於て發見する諸種の哲學は實に外來文明の影響を受けぬ純粹なる日本民族の宇宙觀、神靈觀である。若し之を何等研究の價値なしとして一笑に附し去るものがあるならば、其の人は實に自分自身の屬して居る民族的思想の發展を無視した人と云ふて好からうと思ふ。吾人の曾て有した、物質的文明が決して世界の他の國の文明に劣つて居なかつたやうに、吾人の祖先が有した宗〓的哲學的、將道德的思想は決して基督教の其れにも佛教の其れにも劣つては居なかつな人類思想發展の徑路は何れの國人も皆な一樣な筈である。宣長の『古事記傳』に現はれた世界論原理論の學說が今日の學說と比較して果して何れだけの優劣があるか其れは知らぬ。唯吾人は宣長を透して日本民族の思想が何の邊まで發展したかを知れば其れで好いのである。宣長の有した政治論、宗〓論其は今日より見れば陳腐なものであつたかもしれぬが、けれども吾人は其の陳腐なるものの中に、何れ程の眞理を含むで居たかを檢して、國民の思想の今日に至る迄には何の程度の發展的徑路を辿つて來たかを〓究すればそれで好い。著者は有名なる神道哲學專攻の士であるから、讀者は宣長の著書五十部百三十餘卷の書を讀破せずとも本書を一讀すれば宣長の哲學-否復古神道諸家の哲學を遺憾なく知ることは出來やう。先年著者が公にした『平田篤胤の哲學』が識者間に重ぜられた一事に徵するも亦本書の價値を知に充分と思ふ。値價の書本"

- "id": "std-p0038-002"
  "section_id": "main-std-p0034-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "述べて茲に來り、讀者は略〻我が國固有の大道即ち神道なるものゝ意味を了解せられたであらうと思ひます。神道は決して同じ宗教內にてさへも、派を立て、黨を結び、相容れないやうな佛教や基督教などゝ肩をならべる如き狹少な道でなく、かゝるものに超然とした大道で、我が國民、進んでは世界人類も、遵奉すべき高大な道であることが大體了解せられたであらうと思ひます。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "72"
    "printed_page_end": "73"
    "url": "https://dl.ndl.go.jp/pid/943543/1/38"
    "source_sequence": 37
  "translation_ja": "ここまで述べてきて、読者の皆さんには、日本固有の大道、すなわち神道というものの意味がおおよそお分かりになっただろうと思います。神道は、同じ宗教の中でさえ宗派を立て、党派を結び、互いに受け入れないような仏教やキリスト教などと肩を並べるような狭い道ではありません。それらを超越した大道であり、日本国民、さらには世界の人類も従い守るべき、高く大きな道であることが、おおよそお分かりになっただろうと思います。"

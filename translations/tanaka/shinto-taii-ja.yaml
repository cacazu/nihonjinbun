  "translation_ja": "考えは、昔にも多少はありました。外宮の権禰宜であった度会延佳神主なども、その一人です。この方は後世から大いに非難され、学説も人物も非難されました。しかし、非難が多いだけ、それだけ優れた見識もあります。氏は先ほど述べたとおり、私たちと同じ考えを持っていました。その思想を度会清在という学者が、『陽復記衍義』という本で説明しています。それはどのような説かといいますと、「今は神道者という名があるので、その人々も、われこそ神道者だと腕を振り上げ、得意げに騒ぎ回っている。しかし、これほどおかしなことはない。この国に生まれ、この国の着物を着、この国の食物を食べて暮らし、上には君主や父をいただき、下には妻子や家臣、召使いを持って、父子の間では親愛を、君臣の間では義を、夫婦の間では区別を守り、あるいは長幼の順序を守り、あるいは信義を守る。このように国民が行うならば、その国民はみな神道者である。神道者というものが別にあるわけではない。この道を行っていくならば、国民全体が神主である。これこそ、左を左とし、右を右とすることである」というものです。少し説明しますと、この「左左右右」は『神道五部書』に書かれた言葉で、左と右を取り違えたり、ごちゃごちゃにしたりせず、正しくせよという意味です。このようにすることこそ、左を左とし、右を右とする道であり、「天御中主尊と天照大神がこの御国を定められて以来、連綿と絶えることのない神道である。神主が神事を行うことだけを神道だと言うから、神道はひどく奇妙なものになってきた」というのです。このようなことが、度会清在という学者の『陽復記衍義』に書かれています。これ以外の度会氏の説もよく考えてみると、要するに、神道は宗教であると同時に倫理であるという解釈だと思われます。しかし、私は、政治に従事して国家を治めるには、もちろん道徳も必要だと考えます。政治も道徳を離れては価値がありません。したがって、道徳と政治を切り離すことはできません。けれども私は、政治家は政治家として、別に政治的活動という特殊な活動を行うものと考え、人間社会の現象には、宗教や道徳と並ぶ政治というものの存在を認め、そして、"

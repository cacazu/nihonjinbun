  "translation_ja": |-
    それから、さらに甚だしい例を挙げてみようと思います。それは宗教界の大人物で、キリスト教徒から神様のように崇敬されているルーテル、宗教改革家のルーテルです。ルーテルは宗教改革を始める以前に、ローマへ行ったことがあります。そしてローマの大会堂へ参詣しました。その時に、彼は何と言ったでしょうか。
    ルーテル「ああ、私はなんと不幸なのだろう。まだ父も母も生きておられるが、実に残念だ。死んでいてくれればよかったのに。」
    こう言って悲しんだのです。これを聞いた人は驚きました。
    聞いた人「いったい、それはどういうわけですか。」
    ルーテル「いや、この大会堂に参って祈ると、両親が死んで地獄にいるのを救うことができるのだ。今、両親が死んでいてくれたなら救えたのに、残念だ。」
    そう言って悲しんだのです。まず第一に、両親が地獄にいるものと考えることが、大変な間違いだと思います。しかし、それは一歩譲るとしても、父母が死んでいてくれればよいということを口にするのは、実に驚くべきことだと思います。それでもルーテルは、それが親孝行になると考えて、こう言ったのです。親に孝、君主に忠という、その忠孝という言葉に含まれる内容は――形式はたとえ同じでも――その内容、その根底では、東西で甚だしく異なるというのは、この点だと思うのです。

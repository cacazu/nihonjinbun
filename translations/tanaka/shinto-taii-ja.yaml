    "text": "然るに此の大道と申しますものは何う云ふ物に表はしてあるか、斯う申すと云ふと、或は基督〓のパイブルとか或は佛〓の經典とか或は儒〓の四書五經の如くに其の道を書き記したものは少しも無いのである。無いものでありますからして世間の人は、佛〓が入つて來る、儒〓が入つて來る基督〓が入つて來る、直ちに是れは立派な〓であると云ふて其の方に向こ。さうして我が國固有の大道ある事を忘れて仕舞ふのであります。勿論學問をした事のない何も知らない無智の人間がさう云ふものに向つて走つて行くのは止むを得ぬとしましても、學者が少なくとも我が國體、我が大道と云ふものに就いて多少智識を有して居る所の者迄が其の方に向つて走つて行くと云ふのは、實に其の愚憐むべきであります。斯く云ふ憐むべき學者、憐れむべき人物と云ふものは今日計りではない昔からあるのです。"

  - "kind": "ocr"
    "text": "西『東亞之光』(五卷一號)著者の苦心-著者は篤胤の哲學を叙述せんとして、先づ其學說と親密の關係ある篤鼠の性格に注目してゐる。而して篤胤の性格を合理的に叙述するの目的を以て著者は先づ筆を家庭の歴史より起し、篤胤の幼時に於ける家庭教育を攻察し、彼か一家の擧げて淺見流の學風を奉ぜることを注意し、淺見流の〓育主義は闇齋の學を承けて、更に尊王盡忠の義を發揮せんとするものなるを說いて彼が後年の生命たる復古神道に趨いた所以を明かならしめて居る。著者は此等の經歷境過に就て叙すると共に、又篤胤の性行を說いて精に入つて居る。即ち篤胤の豪悍不屈獨立獨行の精神、精力の絕倫なること、信心の深きこと、及其交友を說き又元和偃武の際に於ける文運復興の當時勢を論じて、其哲學及學風の由つて起る所以の徑路を明かにして居る。平田の治聞博識-で其學問の複雜多面なることは類ひまれである。國學儒學に通じて居るは言ふまでもなく、神道を說き、易を論じ、又釋迦を論じ、佛說經文を批評し、禪を述べ、老子を講じ······書甚だ多くして說く所日本支那印度に亘り、又蘭學のことに及んで居る。著者は此の如く多方面なる篤胤の思想學說を組織するに、世界論、原理論、宗教論及倫理說、教育論の五段を以つてし、先づ創世說國土の發展に關する傳說より說き起して、日本眞神道の解說に移つて居る。而して著者が就中其宗〓論に重きを置いたのは神道神學者としての篤胤をあらはすに甚だ利ろしい點である。本書の價値-近世神道は、神道史上最も光彩ある部分である。然るに篤胤の哲學は、近世神道を〓究するに就て先づ人の知らんと欲する所である。本書は篤胤の哲學を說いて、其學風神道哲學史上に占むべき地位、並に古道に對する篤胤の考を表はし「何事も神代の傳へと事實とに考へて理あることは得默せず考の及ばん限りは云はん」とする篤胤の學說と精神とを善く顯はして居る。本書は著者が多年の心血を注ぐの餘り成れるもので一時的に起る射利的發作の仕事でない。故に本書に著者の學殖と共に善く其眞面目なる著者の人格をあらはして居る。學哲之胤篤田平『神社協會雜誌』(八年十一號)本書は神道哲學の研鑽を以て夙に噴々の聞えある田中文學士が、一代の碩學平田篤胤の學說について、公平なる史的烱眼と明確なる哲學的論定とによつて而も系統的組織的に叙述せられたるもの、解說極めて精緻、議論頗る明快、確に卓拔なる平田翁の學說を紹介し得て餘す所なし。今や歐西哲學と相須つて國民思想研究の要ある時に此著あり。前古無比の我が國體の精華を發揮すると共に國家の根底を固くし、大に學界を稗益するものあらむ。『東京日々新聞』(一一八一七號)評平田篤胤は我神道史上の偉人として德川時代の思想界に一大異彩を放てるものなり、本書は其世界人生に關する學說を系統的組織に論述せるものにして或意味より云へば、神道哲學と西洋哲學との比較研究とも見るを得べく、全卷を總叙·學說·對異·統括の四編に分つ。行文明快にして論理の整然たる事、著者の態度の敬虔にして且公平なる事、引證該博而も著者特創の識見にも乏しからざる事等は最も著しき點なり。近來に於ける大著として之を世人に推薦するに憚からざるなり。三五値價の書本"

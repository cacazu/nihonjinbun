- "id": "std-p0019-002"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "それから第三番目はどういふ考かといふと神道は即ち德教である、倫理である、神道は倫理でなければならない。斯ういふ說が大分ございます。此の說は今日始つた說ではない。倫理とは昔は多く申しませんでしたが、倫理のやうに考へたのは昔からの說です。彼の山崎闇齋先生、それから平田篤胤翁、あゝいふ方の說の大部分は矢張り此の說に屬するものと思はれます。といふのは山齋崎闇先生は神道は天人唯一にして、道は日神の道、教は猿田彥神の導き玉ふ處、土金の教、天人を貫く、敬みの至りなりなど申され、その說は牽强附會のやうに思はれます。勿論牽强附會でも何でも兎に角山崎闇齋先生は神道を倫理として、德教として立てゝ行かうといふ考であるのでありました。それから平田篤胤翁は斯ういふ說であります。抑も我が皇神の道の趣きは清淨を本として、汚穢を惡む、君親には忠實に仕へ、妻子を惠みて、子孫を多く生殖し、親族を睦び和し、朋友には信を專らとし、奴婢を憐れみ、家の榮えん事を思ふぞ、神ながら御傳へ坐せる眞の道なるといふ事が『玉襷』といふ本"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "34"
    "printed_page_end": "35"
    "url": "https://dl.ndl.go.jp/pid/943543/1/19"
    "source_sequence": 18
  "translation_ja": "第三には、どのような考えがあるかというと、神道は徳の教えであり、倫理である、神道は倫理でなければならないという説が数多くあります。この説は今日始まったものではありません。昔は「倫理」とはあまり言いませんでしたが、倫理のように考える説は昔からありました。山崎闇斎先生や平田篤胤翁といった方々の説の大部分も、この説に属すると思われます。というのも、山崎闇斎先生は、「神道は天と人がただ一つであり、道は日神の道、教えは猿田彦神のお導きになるところである。土金の教えは天と人を貫く、慎み敬うことの極致である」などと言っていますが、その説はこじつけのように思われます。もちろん、こじつけであろうと何であろうと、ともかく山崎闇斎先生は、神道を倫理として、徳の教えとして立てていこうと考えていたのです。平田篤胤翁は、次のように説いています。「そもそも、わが皇神の道の趣旨は、清浄を根本として汚れを嫌い、君主と親には忠実に仕え、妻子を慈しみ、子孫を多くもうけ、親族とは仲よく和らぎ、友にはひたすら信義を守り、召使いを憐れみ、家の繁栄を願うことである。これこそ、神のままに伝えてこられた真の道である。」こうしたことが、『玉襷』という本"

  "source_text": "是れに就いては玉木葦齋と云ふ人の說がある。是れは山崎闇齋先生の所謂神道を說いたのでありますけれども、其の神に就いての說は極めて穩健であると思ふ。是れは新井白石とか伊勢貞丈とか云ふ人々と同じ意見である。それは何う云ふ意見かと申しますると、神の訓即ち讀み方を鏡の訓かゞみのがを取つてかみとしたのであるとも云ひ、或はかんが見るをつゞめてかみとしたのであるとも云ひ、或はあかきみゆると云ふのがつゞまつてかみとなつたのであるとも云ひ、言語の方面から解釋を付ける人があるけれども是れは何うも面白くない。詰り神と云ふのは神の尊くおはして何とも名け奉るものがないのである。たゞ戴き尙めて上と云ふかみである。上が即ち神で上と神とは同一である。斯う云ふ風な見解である。何うも此の神と云ふ言葉が上と云ふ言葉から來たと云ふのが多くの學者の唱ふる所である。併し純粹に上と云ふばかりでなくして、それともう一つ尋常でない一種靈妙であると云ふ考へが其の中に入つて居るのである。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "16"
    "printed_page_end": "17"
    "url": "https://dl.ndl.go.jp/pid/943543/1/10"
    "source_sequence": 9
  "translation_ja": "これについては、玉木葦斎という人の説があります。この人は山崎闇斎先生のいわゆる神道を説いた人ですが、その神についての説は、きわめて穏健だと思います。それは新井白石や伊勢貞丈といった人々と同じ意見です。どういう意見かというと、神の訓、つまり読み方について、「鏡」の読みである「かがみ」から「が」を取って「かみ」としたとか、「かんが見る」を縮めて「かみ」としたとか、「あかきみゆる」が縮まって「かみ」になったとか、言葉の側から解釈する人がいますが、それはどうも適切ではないというのです。要するに、神は尊くて、何ともお呼び申し上げる言葉がないので、ただ仰ぎ尊んで「上」という意味の「かみ」と申し上げる。上がすなわち神であり、上と神は同じである、という見解です。どうやら「神」という言葉は「上」という言葉から来たというのが、多くの学者の唱えるところです。ただし、単に「上」というだけでなく、そこにはもう一つ、尋常ではなく、一種霊妙なものであるという考えが含まれています。"
  "translation_status": "reviewed"

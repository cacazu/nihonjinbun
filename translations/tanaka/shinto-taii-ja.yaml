- "id": "std-p0025-001"
  "section_id": "main-std-p0023-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "いふ風の考は昔にも多少あつたのであります。彼の外宮の權禰宜でございました度會延佳神主などもその一人であります。あの方は後世から非常に非難されました。學說に對しても、人物に對しても、非難されました。けれども非難の多い丈け卓見もあります。氏は前に述べました通り吾々と同樣の考を有されて居りました。その思想を度會清在と申す學者が『陽復記衍義』と云ふ本に說明して居ります。どういふ說であるかといふと今や神道者と云ふ名があるものだから其の人だちも我れこそ神道者なりと臂を怒らし揚々として騒ぎ廻つて居るけれども、此の位可笑しい事はない。此の國に生れて此の國の着物を着、此の國の食を喰つて生活をして居りながら、上に君や父を頂き下に妻子臣僕を帶びて、父子親を行ひ、君臣義を行ひ、夫婦別を行ひ、或は序を行ひ、或は信を行ふ。斯ういふ風に國民が行ふならば、此の國民は悉く神道者である。何も神道者といふものが別にあるものでない。此の道を行つて行くなれば國民全體が神主である。之れが即ち左を左とし右を右とするのである。ちよとこの左左右右とは『神道五部書』に書いてあつて、左と右と交換しないやうに、ゴチャ〳〵にしないやうに、正しくせよと云ふ語であります。で、かくするのは左を左とし右を右とするの道であつて「天御中主尊·天照大神が此の御國を定められてより此の方連綿と絕えない神道である。神主が神事を行ふのみを以つて神道であるといふからして神道は極めて變てこなものになつて來た。斯ういふのが度會清在と申す學者の『陽復記衍義』に書いてあるのでございますが、此の外度會氏の說を能く考へて見ますと、詰り神道は宗教で、同時に倫理である。斯ういふ風な解釋と思はれますが、併し私は政治に從事して國家の政を行ふには勿論道德もなければいかぬ。政治も道德を離れては政治の價値が無い、それで道德と政治は離れることは出來ない。けれ共私は政治家は政治家として別に政治的活動として特殊の活動をなすものとして、人類社會の現象には、宗教·道徳と相對した政治と云ふものヽ存在を認め、さつきから述"

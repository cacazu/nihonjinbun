- "id": "std-p0015-001"
  "section_id": "main-std-p0011-003"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "私は茲迄述べて來て、我が國民と外國民とは根本の思想に於いて違つて居ると云ふ事は十分申し明したと思ふのであります。けれどももう少し此の事に就いて述べて見たい。彼の支那の賢人と云はれて居る孟子は何う云ふ事を云つたか、臣として君を伐つ忠と云ふべきかと云ふ問に對して、仁を賊ふ者之れを賊と云ふのである。義を賊ふ者之れを殘と云ふのである。殘賊の人之れを一夫と云ふのである。一夫の紂を誅することを聞いて居るが、未だ君を弑したのを聞かないのである。斯う云ふ答をして居る。克くも斯う云ふ詭辯を弄する事か出來たものである。晋の桓温は。男子芳を百世に流す能はずんば亦當に臭を萬年に遺すべしと云つた。臭は臭名である、惡名である。斯くの如き言葉は決して我が國民の口に出來ぬ所であります。又、してはならない所であります。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "26"
    "printed_page_end": "27"
    "url": "https://dl.ndl.go.jp/pid/943543/1/15"
    "source_sequence": 14
  "translation_ja": "ここまで述べてきて、わが国民と外国の国民とは根本の思想が違うということを、十分に説明できたと思います。しかし、もう少しこのことについて述べてみたいと思います。中国の賢人といわれる孟子は、どんなことを言ったでしょうか。臣下として君主を討つのは忠と言えるか、という問いに対し、孟子は「仁を損なう者を賊といい、義を損なう者を残という。残賊の人を一人の男という。一人の男である紂を誅殺したとは聞いているが、君主を殺したとはまだ聞いていない」と答えています。よくもこんな詭弁を弄することができたものです。晋の桓温は「男子たるもの、よい名を百代の後まで伝えられないならば、せめて悪い名を万年の後まで残すべきだ」と言いました。この「臭」とは悪い評判、悪名のことです。このような言葉は、決してわが国民の口から出るものではありません。また、口にしてはならないものです。"

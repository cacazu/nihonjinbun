  "translation_ja": "さて、私は先ほど、神には上下があると申しました。一軒の家のお上さんも神であれば、一国の君主も神様です。東照宮、湊川神社、天満宮といった神様は、尊い神です。しかし、最も尊いのは、天祖天照大神をはじめとする歴代の皇統の方々の神様です。したがって、天祖天照大神をはじめ、歴代の神々の示されたことが、神道の主要な部分、要部となっているのです。その一例はどのようなものかといえば、天照大神が皇孫をこの国に降された時に三種の神器をお授けになり、天壌無窮の神勅をお与えになったことが、神道の根本となっています。その後、崇神天皇は即位4年に、「わが皇祖である歴代の天皇が皇位にお就きになったのは、ご自身一人のためであろうか。そうではない。人と神を導き治め、天下を整え治めるためである。それゆえ、代々大いなる功績を明らかにし、その時々に最高の徳を広く行き渡らせたのである。今、私は大道を受け継いで万民を愛し育てているが、どのようにして皇祖の跡に従い、永遠に皇位を保つことができようか。群卿百官は、それぞれ忠誠を尽くし、ともに"

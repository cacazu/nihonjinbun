  "source_text": "實にや神道は皇國の大道にして、他の宗教の如く經典學說あるに非ずと雖も、建國當時より萬古不滅の大綱として、國民の精髓を支配し來れるもの也。吾が平田篤胤の教は、本居宣長の學說の後を承け、此の大本に據り、異端の教を斥け忠君愛國の實踐哲學を皷吹せる者にて、其說往々にして稍極端に走り、間々牽會の箇所なきに非ずと雖も、斯道の根本を確立せし點に於て、日本神道史中の大立物たるに背かず。又一代の經歷に於ても、一世の模範たる可きの人なり。本書は-翁を研究せんとする人には好古の參考書なるべし。"
  "source_languages":

- "id": "std-p0049-013"
  "section_id": "ads-scan-49"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "文學士田中義能氏は篤學の教育家にして、最も穩當なる學說を持し且つ唱へて居る人である。又氏は教育學は純粹に學なりといへど、歐洲人の教育學が歐洲國民的彩色の基になれる教育學である樣に、本邦に於ける教育學も、只西洋輸入でなく、其れに國民的精神を着色することを忘れてはならぬといふ意見を持つて居る。是等の意見を本として出來上つたものが則ち本著科學的教育學である。本書は注意の能く行屆いた、諸方面の問題に普くふれて、所謂まめに手際に出來て居る本である。行文は最も流暢、思想は太だ穩健、洗練の文字中に健全の常識が貫いて居るのは氏の特色である。讀者は必ずや此に由つて教育學の智識を新にし、且つ豐かならしむることあるを思ふ。"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "url": "https://dl.ndl.go.jp/pid/943543/1/49"
    "source_sequence": 48
  "translation_ja": "文学士田中義能氏は学問に励む教育者であり、非常に穏当な学説を持ち、唱えている人である。また氏は、教育学が純粋な学問であるとはいえ、ヨーロッパの教育学がその国民的な特色を基としているように、日本の教育学も単に西洋から輸入するのではなく、国民的精神を加えることを忘れてはならないという意見を持っている。こうした考えを基に出来上がったのが、本書『科学的教育学』である。本書は注意がよく行き届き、さまざまな方面の問題に広く触れ、いわば細やかで手際よく出来た本である。文章は非常に流暢で、思想はきわめて穏健であり、洗練された文章の中に健全な常識が貫かれているのは氏の特色である。読者は本書によって必ず教育学の知識を新たにし、豊かにすることができると思う。"
  "translation_status": "reviewed"

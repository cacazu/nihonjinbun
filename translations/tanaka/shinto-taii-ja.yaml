    "text": "『古語拾遺』に、蓋し聞く、上古の世、未だ文字あらず、貴賤老少口々に相傳へ、前言往行存して忘れずとあります通り、忘れない我が國民が、實に記億力に最も富んで居る我が國民が、忘れないで傳へて來た傳說でございます。其の傳說は『古事記』とか『日本書紀』とかいふ本になりまして確實に傳はつて來たので、勿論斯ういふ傳說は外國ではミス(3355)又はミソロヂー(mythology)といふ言葉で以つて示して繁簡精粗はありますが、大抵の國には之れが存在して居ります。此の傳說は當時のあらゆる文化の精華を集めたものであります。即ち其の當時のシビリゼーシヨンの要點を悉くミスの中に包含して居つたものと云はるゝのであります。で、今日の心理學者の說に依つて見ますと人間の精神活動には知識·感情·意志といふものがあります。此の三者は別々にあるのではなくて、詰り精神活動が智的·情的·意志的の三方面を有して居るのであります。從つて世の文化なるものは亦此の三大方面に別つことが出來ます。されば傳說の中にある上古の文化を知的系統情的系統·意志的系統、斯ういふ風の三つに別つ事が出來ます。それで知的方面は何であるかと云へば政治的系統であります。情的方面は宗〓的系統であります。意志的方面は道德的系統でございます。從つて當時の文化の精華を包含して居る所の傳說には此の三大系統が皆含まれて居るのであります。然るに外國では民族が始終集つたり散つたり所謂集散離合をやりまして、國家が興つたり亡びたり所謂興亡存滅を常にやつて居ります。其の他種々の事情がありましたる爲に傳說は殆んど消えて仕舞つて、後の學者が考へた政治道德·宗〓といふものが、すつかり之れに代つて今日廣く行はれる樣になつて來ました。所が我が國は外國とは其の趣が違つて、當時の大政治家で、大宗〓家で、大道德家でありました所の神々の子孫は、君主として長へに此の國に臨まれ、其の神々の支族或は末族のものは長へに臣民として君主に仕へる。斯ういふ國體であります。ですから人種が變はりませぬ。國體が變りませぬ。外國のやうに人種が集散離合し、國家"

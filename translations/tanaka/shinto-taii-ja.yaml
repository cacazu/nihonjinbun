  "source_variants":
  - "kind": "ocr"
    "text": "ニ國學院大學講師文學士田中義能著最本居宣長之哲學新刊菊判總クロース上製全一册紙數六百十六頁定價金貳圓拾錢郵稅金拾貳錢覽天賜本書は畏くも天皇陛下皇后陛下の叡覽を忝うし奉る發行所東京市神田區錦町一ノ十九本書は畏くも皇陛下后陛下天皇の叡覽を忝うし奉る發行所東京市神田區錦町一ノ十九振替口座東京一〇五六六番日本學術研究會『時事新報』(一〇二八五號)評著者は國學院大學の講師で、曩に神道哲學に關する一一三の著書あり。最近には『平田篤胤之哲學』を公にして、我國固有の道學を闡明し、今又本著を發表するに至つた。內容は總叙に於て經歷を揭げ、性行を叙し、其學風より著書のことに及び、更に學統を詮索しては、復古神道の發展、學祖春滿、學父眞淵をあげ、本論に入りて世界論、原理論、政治論、宗〓論、學問論、異端論等を詳にし、其學派を論じては、本居春庭、本居大平、服部中庸、齋藤彥麿、門派の巨擘、歿後の門人等に言及し、尙ほ統括には宣長學の反動、諸家との比較、批評等を紹介す。引證該博、細叙精記、讀む者をして肯ぜしめずんば竭まざらんとす。『大阪每日新聞』(一〇三一〇號)評公平なる哲學的見地より古事記傳其他の著書に著はれたる本居宣長が世界人世に關する一代の學說を批評紹介するが本書の目的にして所謂復古神道なるものゝ內容を闡明するに委曲を盡せる著者の努力は我が學界の爲に大に多とせざるを得ず。々噴評好"

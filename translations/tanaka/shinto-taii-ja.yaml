  "source_text": "所が維新以後非常に西洋の文明が這入つて來ました。恰も河を決する"
  "source_languages":
  - "ja"
  "source_locations":
  - "source_id": "ndl-943543"
    "precision": "page"
    "printed_page": "48"
    "printed_page_end": "49"
    "url": "https://dl.ndl.go.jp/pid/943543/1/26"
    "source_sequence": 25
  "translation_ja": "ところが維新以後、西洋の文明が非常に多く入ってきました。まるで川の堤防が決壊する"
  "translation_status": "reviewed"
  "source_alignment":
  - "source_id": "ndl-943543"
    "original_unit_id": "943543_0000026:40"
  - "source_id": "ndl-943543"

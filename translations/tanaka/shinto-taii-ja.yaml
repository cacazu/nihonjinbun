  "translation_ja": "本書の価値――近世神道は、神道史上で最も輝かしい部分である。そして篤胤の哲学は、近世神道を研究する際、まず知りたいと思うものだ。本書は篤胤の哲学を説き、その学風、神道哲学史上に占めるべき位置、古道に対する考えを示している。「何事も神代からの伝承と事実に照らして考え、理にかなうことは黙っておれず、考えの及ぶ限りは述べよう」とする篤胤の学説と精神をよく表している。本書は著者が長年心血を注いだ末に成ったもので、一時的な利益目当ての衝動による仕事ではない。だから本書には、著者の学識とともに、その真摯な人格がよく表れている。"
  "translation_status": "reviewed"

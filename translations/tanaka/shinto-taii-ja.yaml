- "id": "std-p0037-001"
  "section_id": "main-std-p0034-002"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "と、日佛同盟も出來て來るであらうし、永い中には米國とも同盟をするやうになつて來るであらう。さうして之れが進んで行くと茲に世界の聯邦……世界の同盟が出來て、一切の戰爭などは跡を絕つてしまふことになるであらうと思はれる。此の時に方つて聯邦の盟主たるべきものは誰れであるか。それは系統も勝れて居り、國力も强く、人格も勝れた者でなければなるまいと思ふ。さう云ふ資格を有せらるる者は、世界に國多しと雖も、我が天皇陛下我が大日本帝國の外にはなからうと思ふ。我が陛下が世界の盟主となられる事は、必ずしも空想ではなからうと思ふ。何時かは實現されて來るのであるに相違ない。其の塲合に神道は即ち全然世界に行はれる大道となつて來る。即ち神道は日本國の發展と共に益々發展して、遂に世界至る處に行はれる所の大道となるのである。此の意味に於ても神道は普遍的であると言ふのである。我が帝國國民は旦に夕に常にかゝる大道を體認躬行し、益々之れを宣揚し、我が國運の發展を計らなくつてはならないのである。我が國民は華やかなメリンスのやうな外の道に迷はないで、我が立派なる黑縮緬の樣な固有の大道を身體に着けなくてはならぬと思ふ。詰り華やかなメリンスの樣なものが幾らあつても其の方に眼を移さず、我が固有の大道を守つて、日々理想の實現に向つて一歩々々進んで行くべきである。是れが我が大日本帝國々民の天職である。義務である。吾々の本務である。斯う云ふのであります。で、若し人あつて此の大道を誤解して、唯是れは手を拍く道である、或は卜ひをする道であるなどゝ云ひ、或は日本の道は偏僻姑息なり、頑迷なる最も卑しむべき道であるなどヽ云ひ、不都合な主義思想に捉はるゝ者があるならば其の者が吾々の敵であると云ふのであります。吾々日本國民の最も恐るべき敵は獨逸ではないのであります。米國ではないのであります。實にかゝる輩であります。即ち獅子身中の蟲とは此の輩の事であります。若し我が國民にして益々我が大道を體認して此の煌々たる國光を八紘に輝やかしたならば、米國も吾々の親"

  "translation_ja": "て、実に普遍的な道なのです。もちろん神道は、天御中主神の御徳が天照大神という偉大な神を通して発揮され、そこに政治、宗教、道徳など、各方面で実践する大道の源を持つ道です。したがって、天照大神とそれ以下の神々の道としては、日本国民と特別な関係を持っています。しかし、天御中主神の道として見れば、世界のあらゆる所に行われる道です。宇宙の森羅万象が、すべてその中に含まれる道です。ここでいったん範囲を下げ、天照大神とそれ以下の神々の道として見ると、神道はこれまでさまざまに述べてきたように、日本国民固有の道です。その道はもちろん、さまざまな神々によって示され、明治大神でいらっしゃるべき先帝陛下によっても、軍人に賜った勅諭や戊申詔書など、さまざまなお言葉によって示されています。しかし、その要旨を最もよくお示しになったのは教育勅語であることは、すでに詳しく述べたとおりです。このような性質を持つ神道は、最後には人類社会全体に行き渡るべきものだということが分かります。ドイツ国民は、ドイツ皇帝は世界の王となるべき者だと考えています。そして、ドイツが世界を統一することは世界の幸福である、と主張しています。彼らは、そのような考えのもとで、現在の戦争を行っているのです。しかし、わが日本こそ、平田翁が言われたとおり、世界で最も優れた国です。そして、世界の王となるべき国だと思うのです。これは、彼らドイツ人のように自慢して言うのではなく、事実として言うのです。そもそも明治維新のころ、日本はまだ外国と十分に交流していなかったので、外国人には日本の事情が分かりませんでした。日本人をひどく馬鹿にしたものでした。当時、横浜には外国人居留地がありましたが、その公園には「犬および日本人は、この中に入ってはならない」と立札を掲げていました。このように日本人を馬鹿にしていたのです。それなのに今日では、犬よりも下だと見ていた日本と、イギリスが同盟を結んでいます。またロシアでは、識者の間で日露同盟の必要が唱えられています。このようになってくる"

          "kind": "diplomatic",
          "text": "Ce que je viens de dire de la transplantation de la censure dans les temps modernes, s'applique à bien d'autres parties de l'organisation sociale, sur lesquelles on nous cite l'antiquité plus fréquemment encore, et avec bien plus d'emphase. Telle est l'éducation, par exemple; que ne nous dit-on pas sur la nécessité de permettre que le gouvernement s'empare des générations naissantes pour les façonner à son gré, et de quelles citations érudites n'appuie-t-on pas cette théorie! Les Perses, les Égyptiens, et la Gaule, et la Grèce, et l'Italie, viennent tour à tour figurer à nos regards. Eh! Messieurs, nous ne sommes ni des Perses, soumis à un despote, ni des Égyptiens subjugués par des prêtres, ni des Gaulois pouvant être sacrifiés par leurs druides, ni enfin des Grecs et des Romains que leur part à l'autorité sociale consolait de l'asservissement privé. Nous sommes des modernes, qui voulons jouir chacun de nos droits, développer chacun nos facultés comme bon nous semble, sans nuire à autrui; veiller sur le développement de ces facultés dans les enfants que le nature confie à nôtre affection, d'autant plus éclairée qu'elle est plus vive, et n'ayant besoin de l'autorité que pour tenir d'elle les moyens généraux d'instruction qu'elle peut rassembler, comme les voyageurs acceptent d'elle les grands chemins sans être dirigés par elle dans la route qu'ils veulent suivre. La religion aussi est exposée à ces souvenirs des autres siècles. De braves défenseurs de l'unité de doctrine nous citent les lois des anciens contre les dieux étrangers, et appuient les droits de l'église catholique de l'exemple des Athéniens qui firent périr Socrate pour avoir ébranlé le polythéisme, et de celui d'Auguste qui voulait qu'on restât fidèle au culte de ses pères, ce qui fit que, peu de temps après, on livra aux bêtes les premiers chrétiens.",

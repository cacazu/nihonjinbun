      "source_text": "Que le pouvoir s'y résigne donc; il nous faut de la liberté, et nous l'aurons; mais comme la liberté qu'il nous faut est différente de celle des anciens, il faut à cette liberté une autre organisation que celle qui pourrait convenir a la liberté antique; dans celle-ci, plus l'homme consacrait de temps et de force a l'exercice de ses droits politiques, plus il se croyait libre; dans l'espèce de liberté dont nous sommes susceptibles, plus l'exercice de nos droits politiques nous laissera de temps pour nos intérêts privés, plus la liberté nous sera précieuse.",

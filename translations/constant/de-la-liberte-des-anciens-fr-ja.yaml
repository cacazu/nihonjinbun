    {
      "id": "constant-0019",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 19
        }
      ],
      "source_text": "Toutes les républiques anciennes étaient renfermées dans des limites étroites. La plus peuplée, la plus puissante, la plus considérable d'entre elles, n'était pas égale en étendue au plus petit des états modernes. Par une suite inévitable de leur peu d'étendue, l'esprit de ces républiques était belliqueux, chaque peuple froissait continuellement ses voisins ou était froissé par eux. Poussés ainsi par la nécessité, les uns contre les autres, ils se combattaient ou se menaçaient sans cesse. Ceux qui ne voulaient pas être conquérants ne pouvaient déposer les armes sous peine d'être conquis. Tous achetaient leur sûreté, leur indépendance, leur existence entière, au prix de la guerre. Elle était l'intérêt constant, l'occupation presque habituelle des états libres de l'antiquité. Enfin, et par un résultat également nécessaire de cette manière d'être, tous ces états avaient des esclaves. Les professions mécaniques, et même, chez quelques nations, les professions industrielles, étaient confiées à des mains chargées de fers.",
      "translation_ja": "古代の共和国はどれも狭い国境の内にありました。いちばん人口が多く、強く、重きをなした共和国でも、近代の最小の国に広さで及びませんでした。狭さの避けがたい結果として、これらの共和国には好戦的な気風があり、どの民も絶えず隣の民とぶつかるか、向こうからぶつかられるかしていました。こうして否応なく互いに押しつけられ、戦うか脅し合うかし続けました。自分は征服者になりたくなくても、武器を置けば征服されます。どの国民も安全と独立と自分たちの存在そのものを、戦争という代価で買いました。戦争こそ古代の自由な国家の変わらぬ関心事であり、日常の仕事に近いものでした。最後に、こうした暮らし方のやはり避けがたい結果として、これらの国にはすべて奴隷がいました。手仕事は、国によっては産業の仕事までもが、鎖につながれた手に任されていました。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0020",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [

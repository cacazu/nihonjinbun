          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 50
        }
      ],
      "source_text": "L'ostracisme d'Athènes reposait sur l'hypothèse que la société a toute autorité sur ses membres. Dans cette hypothèse, il pouvait se justifier, et dans un petit état, où l'influence d'un individu fort de son crédit, de sa clientelle, de sa gloire, balançait souvent la puissance de la masse, l'ostracisme pouvait avoir une apparence d'utilité. Mais parmi nous, les individus ont des droits que la société doit respecter, et l'influence individuelle est, comme je l'ai déjà observé, tellement perdue dans une multitude d'influences égales ou supérieures, que toute vexation, motivée sur la nécessité de diminuer cette influence, est inutile et par conséquent injuste. Nul n'a le droit d'exiler un citoyen, s'il n'est pas condamné légalement par un tribunal régulier, d'après une loi formelle qui attache la peine de l'exil à l'action dont il est coupable. Nul n'a le droit d'arracher le citoyen à sa patrie, le propriétaire à ses biens, le négociant à son commerce, l'époux à son épouse, le père à ses enfants, l'écrivain à ses méditations studieuses, le vieillard à ses habitudes. Tout exil politique est un attentat politique. Tout exil prononcé par une assemblée pour de prétendus motifs de salut public, est un crime de cette assemblée contre le salut public qui n'est jamais que dans le respect des lois, dans l'observance des formes, et dans le maintien des garanties.",
      "translation_ja": "アテネの陶片追放の根底には、社会はその成員に対してあらゆる権限をもつ、という仮定がありました。その仮定のもとでなら正当化もできたでしょう。また小国では、信用と支持者と名声に支えられた一個人の勢力がしばしば大勢の力とつり合ったので、陶片追放は一見役にも立ちそうでした。けれども私たちの社会では、個人には社会が尊重しなければならない権利があります。また個人の影響力は、先ほど申したように、それと等しいかそれ以上に強い無数の影響のうちにほとんど埋もれています。それを減らす必要があるという名目で誰かを苦しめるのはむだであり、したがって不正です。市民が犯した行為には追放刑を科すと明文の法律が定め、それにもとづいて正規の裁判所が適法に判決を下したのでなければ、誰にもその人を追放する権利はありません。市民を祖国から、所有者を財産から、商人を商売から、夫を妻から、父を子どもから、文筆家を勤勉な思索から、年老いた人を長年の習慣から、引き離す権利は誰にもありません。政治上の理由による追放はすべて、政治上の暴挙です。公共の安全という名目で議会が言い渡す追放はすべて、ほかならぬその議会が公共の安全に対して犯す罪です。公共の安全は、法の尊重、手続きの遵守、権利の保障の維持のうちにしかないからです。",

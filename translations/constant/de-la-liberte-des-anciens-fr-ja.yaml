      "source_text": "Ce que je viens de dire de la transplantation de la censure dans les temps modernes, s'applique à bien d'autres parties de l'organisation sociale, sur lesquelles on nous cite l'antiquité plus fréquemment encore, et avec bien plus d'emphase. Telle est l'éducation, par exemple; que ne nous dit-on pas sur la nécessité de permettre que le gouvernement s'empare des générations naissantes pour les façonner à son gré, et de quelles citations érudites n'appuie-t-on pas cette théorie! Les Perses, les Égyptiens, et la Gaule, et la Grèce, et l'Italie, viennent tour à tour figurer à nos regards. Eh! Messieurs, nous ne sommes ni des Perses, soumis à un despote, ni des Égyptiens subjugués par des prêtres, ni des Gaulois pouvant être sacrifiés par leurs druides, ni enfin des Grecs et des Romains que leur part à l'autorité sociale consolait de l'asservissement privé. Nous sommes des modernes, qui voulons jouir chacun de nos droits, développer chacun nos facultés comme bon nous semble, sans nuire à autrui; veiller sur le développement de ces facultés dans les enfants que la nature confie à nôtre affection, d'autant plus éclairée qu'elle est plus vive, et n'ayant besoin de l'autorité que pour tenir d'elle les moyens généraux d'instruction qu'elle peut rassembler, comme les voyageurs acceptent d'elle les grands chemins sans être dirigés par elle dans la route qu'ils veulent suivre. La religion aussi est exposée à ces souvenirs des autres siècles. De braves défenseurs de l'unité de doctrine nous citent les lois des anciens contre les dieux étrangers, et appuient les droits de l'église catholique de l'exemple des Athéniens qui firent périr Socrate pour avoir ébranlé le polythéisme, et de celui d'Auguste qui voulait qu'on restât fidèle au culte de ses pères, ce qui fit que, peu de temps après, on livra aux bêtes les premiers chrétiens.",
      "translation_ja": "いま述べた監察制度の現代への移植の話は、社会のしくみのほかの多くの部分にも当てはまります。そこでは古代を引くことがさらに多く、口調はいっそう大仰です。たとえば教育です。政府が生まれてくる世代をその手につかみ、望みどおりに形づくることを許さねばならぬと、どれだけのことを聞かされてきたでしょう。その説を裏づけようと、どれほど博学な引用を披露されてきたことか。ペルシア人、エジプト人、ガリア、ギリシア、イタリアと、次々に私たちの目の前に並べられます。ですが皆さん、私たちは専制君主に服するペルシア人でも、祭司に屈したエジプト人でも、ドルイド僧に生贄にされかねないガリア人でもありません。ましてや、共同体の権力にあずかることで私生活の隷属を慰めていたギリシア人やローマ人でもありません。私たちは近代人です。誰かを損なうことなく、自分の権利をそれぞれに享受し、思うままに自分の力を伸ばしたい。自然が私たちの愛情にゆだねた子どもたちについても、その力の育ちようを見守ってやりたい。その愛情は深いほどいっそうよく見通せるのです。私たちが公権力を必要とするのは、そこがとりまとめることのできる一般的な教育手段を提供してもらうためだけです。旅人は国の整えた街道は使っても、行く先まで指図されはしないのと同じことです。宗教にもまた昔の世紀の記憶が持ち込まれます。教義の統一を守るけなげな人々は、外国の神々を禁じた古代の法律を挙げ、アテネ人は多神教を揺るがしたからとソクラテスを死に追いやったとか、アウグストゥスは人々が父祖の信仰に忠実であることを望んだとかいう例で、カトリック教会の権利を裏づけます。後の例のゆきついた先は、ほどなく初期のキリスト教徒が猛獣の餌食にされたということなのですが。",

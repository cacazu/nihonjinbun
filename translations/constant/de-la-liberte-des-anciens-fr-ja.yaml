      "source_text": "Aussi, voyez comme une nation grandit à la première institution qui lui rend l'exercice régulier de la liberté politique. Voyez nos concitoyens de toutes les classes, de toutes les professions, sortant de la sphère de leurs travaux habituels et de leur industrie privée, se trouver soudain au niveau des fonctions importantes que la constitution leur confie, choisir avec discernement, résister avec énergie, déconcerter la ruse, braver la menace, résister noblement à la séduction. Voyez le patriotisme pur, profond et sincère, triomphant dans nos villes et vivifiant jusqu'à nos hameaux, traversant nos ateliers, ranimant nos campagnes, pénétrant du sentiment de nos droits et de la nécessité des garanties l'esprit juste et droit du cultivateur utile et du négociant industrieux, qui, savants dans l'histoire des maux qu'ils ont subis, et non moins éclairés sur les remèdes qu'exigent ces maux, embrassent d'un regard la France entière, et, dispensateurs de la reconnaissance nationale, récompensent par leurs suffrages, après trente années, la fidélité aux principes dans la personne du plus illustre des défenseurs de la liberté *).",

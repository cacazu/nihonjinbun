    {
      "id": "constant-0032",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 32
        }
      ],
      "source_text": "Cependant, comme plusieurs des autres circonstances qui décidaient du caractère des nations anciennes existaient aussi a Athènes; comme il y avait une population esclave, et que le territoire était fort reserré, nous y trouvons des vestiges de la liberté propre aux anciens. Le peuple fait les lois, examine la conduite des magistrats, somme Périclès de rendre ses comptes, condamne à mort les généraux qui avaient commandé au combat des Arginuses. En même temps, l'ostracisme, arbitraire légal et vanté par tous les législateurs de l'époque; l'ostracisme, qui nous paraît et doit nous paraître une révoltante iniquité, prouve que l'individu était encore bien plus asservi à la suprématie du corps social à Athènes, qu'il ne l'est de nos jours dans aucun état libre de l'Europe.",
      "translation_ja": "とはいえ、古代の諸民族の性格を決めた他の事情のいくつかはアテネにもありました。奴隷がおり、領土もごく狭かったので、そこにはやはり古代特有の自由の跡が見つかります。人民が法律を作り、公職者の行状を調べ、ペリクレスに会計報告を迫り、アルギヌサイの海戦で指揮を執った将軍たちに死刑を宣告しました。それと同時に、陶片追放という、法に認められ当時の立法者がこぞって称賛した恣意的処分がありました。私たちには憤るべき不正に思えますし、そう思えて当然のこの制度こそ、アテネの個人が、今日ヨーロッパにあるどの自由な国の個人よりも、なおはるかに共同体の至上の権威に服していた証拠です。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0033",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 33
        }
      ],
      "source_text": "Il résulte de ce que je viens d'exposer, que nous ne pouvons plus jouir de la liberté des anciens, qui se composait de la participation active et constante au pouvoir collectif. Notre liberté à nous, doit se composer de la jouissance paisible de l'indépendance privée. La part que dans l'antiquité chacun prenait à la souveraineté nationale n'était point, comme de nos jours, une supposition abstraite. La volonté de chacun avait une influence réelle: l'exercice de cette volonté était un plaisir vif et répété. En conséquence, les anciens étaient disposés à faire beaucoup de sacrifices pour la conservation de leurs droits politiques et de leur part dans l'administration de l'État. Chacun sentant avec orgueil tout ce que valait son suffrage, trouvait dans cette conscience de son importance personnelle, un ample dédommagement.",
      "translation_ja": "以上からわかるのは、共同の権力に絶えず活発に参加することから成っていた古代人の自由を、私たちはもはや享受できないということです。私たちにとって自由は、私生活における独立を安らかに享受することにあります。古代には一人ひとりが国の主権にあずかるといっても、今日のような抽象上の仮定ではありませんでした。各人の意志が実際にものをいい、その意志を働かせることは、繰り返し味わえる鮮やかな喜びでした。だから古代人は、政治的権利を守り、国家の運営に携わる地位を保つためには、多くの犠牲をいといませんでした。誰もが自分の一票の重みを誇らしく感じ、自分がこれだけものをいうという自覚から、犠牲に十二分に見合うものを得ていたのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0034",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 34
        }
      ],
      "source_text": "Ce dédommagement n'existe plus aujourd'hui pour nous. Perdu dans la multitude, l'individu n'aperçoit presque jamais l'influence qu'il exerce. Jamais sa volonté ne s'empreint sur l'ensemble, rien ne constate à ses propres yeux sa coopération. L'exercice des droits politiques ne nous offre donc plus qu'une partie des jouissances que les anciens y trouvaient, et en même temps les progrès de la civilisation, la tendance commerciale de l'époque, la communication des peuples entre eux, ont multiplié et varié à l'infini les moyens de bonheur particulier.",
      "translation_ja": "今日、私たちにはその埋め合わせがありません。大勢に紛れる一人の人間は、自分の及ぼす影響をまず目にしません。自分の意志の刻印が全体に現れることはなく、自分も力を添えたのだとはっきり自分の目で確かめられるものはありません。ですから政治的権利を行使しても、古代人の得ていた喜びのほんの一部しか得られません。その一方で、文明の進歩、時代が商業へ向かう傾向、諸民族の間の交流は、個人として幸福になる手段を限りなく増やし、その形を多彩にしました。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0035",
      "section_id": "lecture",

      "source_text": "Les dépositaires de l'autorité ne manquent pas de nous y exhorter. Ils sont si disposés à nous épargner toute espèce de peine, excepté celle d'obéir et de payer! Ils nous diront: Quel est au fond le but de vos efforts, le motif de vos travaux, l'objet de toutes vos espérances? N'est-ce-pas le bonheur? Eh bien, ce bonheur, laissez-nous faire, et nous vous le donnerons. Non, Messieurs, ne laissons pas faire; quelque touchant que ce soit un intérêt si tendre, prions l'autorité de rester dans ses limites; qu'elle se borne à être juste. Nous nous chargerons d'être heureux.",

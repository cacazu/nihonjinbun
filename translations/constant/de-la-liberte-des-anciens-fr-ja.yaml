          "text": "Cette vérité, Messieurs, semble d'abord superflue à établir. Plusieurs gouvernements de nos jours ne paraissent guères enclins à imiter les républiques de l'antiquité. Cependant quelque peu de goût qu'ils aient pour les institutions républicaines, il y a de certains usages républicains pour lesquels ils éprouvent je ne sais quelle affection. Il est fâcheux que ce soit précisément celles qui permettent de bannir, d'exiler, de dépouiller. Je me souviens qu'en en 1802, on glissa dans une loi sur les tribunaux spéciaux un article qui introduisait en France l'ostracisme grec; et Dieu sait combien d'éloquents orateurs, pour faire admettre cet article, qui cependant fut retiré, nous parlèrent de la liberté d'Athènes, et de tous les sacrifices que les individus devaient faire pour conserver cette liberté! De même, à une époque bien plus récente, lorsque des autorités craintives essayaient d'une main timide de diriger les élections a leur gré, un journal qui n'est pourtant point entaché de républicanisme, proposa de faire revivre la censure romaine pour écarter les candidats dangereux.",

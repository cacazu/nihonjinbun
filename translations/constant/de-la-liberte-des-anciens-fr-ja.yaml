          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 40
        }
      ],
      "source_text": "L'abbé de Mably, comme Rousseau et comme beaucoup d'autres, avait, d'après les anciens, pris l'autorité du corps social pour la liberté, et tous les moyens lui paraissaient bons pour étendre l'action de cette autorité sur cette partie récalcitrante de l'existence humaine, dont il déplorait l'indépendance. Le regret qu'il exprime partout dans ses ouvrages, c'est que la loi ne puisse atteindre que les actions. Il aurait voulu qu'elle atteignît les pensées, les impressions les plus passagères; qu'elle poursuivît l'homme sans relâche et sans lui laisser un asile où il pût échapper à son pouvoir. A peine apercevait-il, n'importe chez quel peuple, une mesure vexatoire, qu'il pensait avoir fait une découverte et qu'il la proposait pour modèle: il détestait la liberté individuelle comme on déteste un ennemi personnel; et, dès qu'il rencontrait dans l'histoire une nation qui en était bien complètement privée, n'eût-elle point de liberté politique, il ne pouvait s'empêcher de l'admirer. II s'extasiait sur les Égyptiens, parce que, disait-il, tout chez eux était réglé par la loi, jusqu'aux délassements, jusqu'aux besoins: tout pliait sous l'empire du législateur; tous les moments de la journée étaient remplis par quelque devoir; l'amour même était sujet à cette intervention respectée, et c'était la loi qui tour-à-tour ouvrait et fermait la couche nuptiale.",
      "translation_ja": "マブリ師はルソーやほかの多くの人と同じく、古代人にならって、共同体の権威を自由と取り違えました。人の生にはこの権威に従おうとしない部分があり、それが独立しているのを嘆いた彼には、そこに権威の力を広げるなら、どんな手段もよく見えました。彼が著書の至るところで惜しむのは、法の手が行為にしか届かないことです。人の思いに、その場限りの印象にまで及んでほしかった。人をたえず追い、その力から逃げ込める場所などどこにも残さずにほしかった。いずこの民族であろうと、人を苦しめる措置を見つけると、掘り出し物をした気になり、お手本として薦めずにいられませんでした。個人の自由を、自分の仇敵のように憎みました。個人の自由をすっかり奪われた国民を歴史の中で見つけようものなら、そこに政治的自由さえなくとも、感心せずにいられませんでした。古代エジプト人にはすっかり心酔しました。彼に言わせれば、そこでは気晴らしから人の欲求に至るまですべてが法で決められ、すべてが立法者の支配に服し、一日のどの時刻も何かの務めで埋まっていました。愛でさえも人々が恭しく従うこの干渉を受け、夫婦の寝床をあるとき開き、あるとき閉じるのも法だったからです。",

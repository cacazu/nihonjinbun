          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 21
        }
      ],
      "source_text": "Cette différence en amène une autre. La guerre est antérieure au commerce; car la guerre et le commerce ne sont que deux moyens différents d'atteindre le même but, celui de posséder ce que l'on désire. Le commerce n'est qu'un hommage rendu à la force du possesseur par l'aspirant à la possession. C'est une tentative pour obtenir de gré à gré ce qu'on n'espère plus conquérir par la violence. Un homme qui serait toujours le plus fort n'aurait jamais l'idée du commerce. C'est l'expérience qui, en lui prouvant que la guerre, c'est-a-dire, l'emploi de sa force contre la force d'autrui, l'expose à diverses résistances et à divers échecs, le porte à recourir au commerce, c'est-à-dire, à un moyen plus doux et plus sûr d'engager l'intérêt d'un autre à consentir à ce qui convient à son intérêt. La guerre est l'impulsion, le commerce est le calcul. Mais par la même il doit venir une époque où le commerce remplace la guerre. Nous sommes arrivés a cette époque.",
      "translation_ja": "この違いはもう一つの違いを生みます。戦争が商業に先立ったのは、どちらも欲しいものを手に入れるという同じ目的に至る、別々の手段でしかないからです。商業とは、手に入れたい側が持ち主の力に敬意を表すことにほかなりません。暴力で奪い取れるとはもう望めないものを、双方の合意で得る試みです。いつも自分が強いとわかっている者なら、商取引など思いつきもしないでしょう。戦争、すなわち自分の力を他人の力に向けることを試すうちに、さまざまな抵抗にあい、さまざまな敗北を喫することがわかってきます。人を商業へと導くのはこの経験です。相手の利害に訴えて、自分の利益にもかなうことに同意してもらう、もっと穏やかで確実な手段に向かわせるのです。戦争が衝動なら、商業は計算です。だからこそ、戦争が商業に席を譲る時が来るはずです。私たちはその時代に到達しました。",
      "translation_status": "reviewed"
    },

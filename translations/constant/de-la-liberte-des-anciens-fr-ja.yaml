      ],
      "source_text": "L'indépendance individuelle est le premier besoin des modernes: en conséquence, il ne faut jamais leur en demander le sacrifice pour établir la liberté politique.",
      "translation_ja": "近代人が第一に必要とするのは個人の独立です。したがって、政治的自由をうち立てるためにその独立を犠牲にせよなどとは、決して求めてはなりません。",

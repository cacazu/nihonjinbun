      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 17
        }
      ],
      "source_text": "Je dois ici, Messieurs, m'arrêter un instant pour prévenir une objection que l'on pourrait me faire. Il y a dans l'antiquité une république où l'asservissement de l'existence individuelle au corps collectif n'est pas aussi complet que je viens de le décrire. Cette république est la plus célèbre de toutes; vous devinez que je veux parler d'Athènes. J'y reviendrai plus tard, et en convenant de la vérité du fait, je vous en exposerai la cause. Nous verrons pourquoi de tous les états anciens, Athènes est celui qui a ressemblé le plus aux modernes. Partout ailleurs, la juridiction sociale était illimitée. Les anciens, comme le dit Condorcet, n'avaient aucune notion des droits individuels. Les hommes n'étaient, pour ainsi dire, que des machines dont la loi réglait les ressorts et dirigeait les rouages. Le même assujettissement caractérisait les beaux siècles de la république romaine; l'individu s'était en quelque sorte perdu dans la nation, le citoyen dans la cité.",
      "translation_ja": "皆さん、ここで少し立ち止まり、予想される反論に先に答えておきましょう。古代にも、個人生活の共同体への従属が、私の申し上げたほど徹底していない共和国が一つあります。しかもそれは、何よりも有名な共和国です。アテネを指していることはお察しでしょう。この点にはのちほど戻り、事実を認めたうえで、その理由をお話しします。なぜ古代のあらゆる国家のうちで、アテネがいちばん近代に似ていたのかがわかるでしょう。それ以外のどこでも、社会の支配権には限界がありませんでした。コンドルセが言うとおり、古代人には個人の権利という観念がまったくなかった。人間は、法がばねを調節し歯車を動かす機械にすぎないといってよいほどでした。ローマ共和国の全盛時代を特徴づけたのも同じ服従です。いわば個人は国民の中に、市民は都市国家の中に溶けてしまっていたのです。",
      "translation_status": "reviewed"

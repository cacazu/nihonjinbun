      ],
      "source_text": "Cependant, l'intérêt de la vérité doit l'emporter sur des considérations que rendent si puissantes l'éclat d'un talent prodigieux et l'autorité d'une immense renommée. Ce n'est d'ailleurs point à Rousseau, comme on le verra, que l'on doit principalement attribuer l'erreur que je vais combattre: elle appartient bien plus à l'un de ses successeurs, moins éloquent, mais non moins austère et mille fois plus exagéré. Ce dernier, l'abbé de Mably, peut être regardé comme le représentant du système qui, conformément aux maximes de la liberté antique, veut que les citoyens soient complètement assujettis pour que la nation soit souveraine, et que l'individu soit esclave pour que le peuple soit libre.",
      "translation_ja": "とはいえ、どんなに非凡な才能の輝きに、どんなに大きな名声の威光に心ひかれようと、真理を大事にする気持ちがそれにまさらなくてはなりません。おわかりになるように、私が反駁したい誤りの主たる責任は、そもそもルソーにあるのではありません。むしろ、雄弁では彼に劣りますが、堅苦しさでは引けを取らず、極端な点では千倍も上を行く後継者にあるのです。マブリ師のことです。彼こそ、古代の自由の原理に従い、国民が主権者であるためには市民は完全に従属し、人民が自由であるためには個人は奴隷でなければならない、という体系の代表者と見てよいでしょう。",

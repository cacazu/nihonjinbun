      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 38
        }
      ],
      "source_text": "Mais ces hommes avaient puisé plusieurs de leurs théories dans les ouvrages de deux philosophes qui ne s'étaient pas douté eux-mêmes des modifications apportées par deux mille ans aux dispositions du genre humain. J'examinerai peut-être une fois le système du plus illustre de ces philosophes, de Jean-Jacques Rousseau, et je montrerai qu'en transportant dans nos temps modernes une étendue de pouvoir social, de souveraineté collective qui appartenait à d'autres siècles, ce génie sublime qu'animait l'amour le plus pur de la liberté, a fourni néanmoins de funestes prétextes à plus d'un genre de tyrannie. Sans doute, en relevant ce que je considère comme une méprise importante à dévoiler, je serai circonspect dans ma réfutation, et respectueux dans mon blâme. J'éviterai, certes, de me joindre aux détracteurs d'un grand homme. Quand le hasard fait qu'en apparence je me rencontre avec eux sur un seul point, je suis en défiance de moi-même; et, pour me consoler de paraître un instant de leur avis sur une question unique et partielle, j'ai besoin de désavouer et de flétrir autant qu'il est en moi ces prétendus auxiliaires.",
      "translation_ja": "しかしこの人々は、自分たちの理論のいくつかを、二千年の歳月が人類の性向にどれほどの変化をもたらしたかを自分でも思い及ばなかった、二人の哲学者の著書から汲みました。いつか、そのうち最も名高いジャン＝ジャック・ルソーの思想体系を検討することもあるでしょう。そのときには、これほど崇高な天才が、誰よりも純粋に自由を愛してやまなかったのに、別の時代に属する共同体の権力、集団の主権を、かつてと同じ広さのまま近代に移したために、何種類もの暴政に不幸な口実を与えたことを示したいと思います。明るみに出しておくことが大切だと私が考える誤りを指摘するにあたっては、もちろん、反論は慎重に、批判には敬意をこめます。偉人をおとしめる人々の仲間に加わるつもりなどありません。たまたま一点でだけ意見が合うように見えるときでさえ、私は自分のほうを疑います。一部分にかかわるただ一つの問いで、一瞬でも同じ意見に見えた自分を慰めるには、この頼みもしない味方たちとは無縁だと断り、力の限り彼らを非難せずにいられません。",
      "translation_status": "reviewed"

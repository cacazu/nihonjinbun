          "source_sequence": 1
        }
      ],
      "source_text": "De la liberté des Anciens comparée à celle des Modernes",
      "translation_ja": "古代人の自由と近代人の自由",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0002",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 2
        }
      ],
      "source_text": "Discours prononcé à l'Athénée royal de Paris",
      "translation_ja": "パリの王立アテネウムでの講演",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0003",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 3
        }
      ],
      "source_text": "Messieurs,",
      "translation_ja": "皆さん。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0004",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 4
        }
      ],
      "source_text": "JE me propose de vous soumettre quelques distinctions, encore assez neuves, entre deux genres de liberté, dont les différences sont restées jusqu'à ce jour inaperçues, ou du moins, trop peu remarquées. L'une est la liberté dont l'exercice était si cher aux peuples anciens; l'autre celle dont la jouissance est particulièrement précieuse aux nations modernes. Cette recherche sera intéressante, si je ne me trompe, sous un double rapport.",
      "translation_ja": "今日は、これまで違いに気づかれず、少なくとも十分には注目されてこなかった二種類の自由について、まだ耳慣れない区別をいくつかお話ししたいと思います。一方は、その行使を古代の人々がたいそう大切にした自由です。他方は、それを享受することが近代の諸国民にとりわけ貴重な自由です。私の見当違いでなければ、この考察には二つの点で意味があります。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0005",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 5
        }
      ],
      "source_text": "Premièrement, la confusion de ces deux espèces de liberté a été parmi nous, durant des époques trop célèbres de notre révolution, la cause de beaucoup de maux. La France s'est vue fatiguer d'essais inutiles, dont les auteurs, irrités par leur peu de succès, ont essayé de la contraindre à jouir du bien qu'elle ne voulait pas, et lui ont disputé le bien qu'elle voulait.",
      "translation_ja": "第一に、私たちの革命の、あまりにもよく知られた時期に、この二種類の自由の混同が実に多くの災いを招いたからです。フランスは、むだな試みに疲れ果てました。試みた人々は成果の上がらないのに腹を立て、この国が望まない幸福を無理に味わわせようとし、望んでいる幸福のほうは与えまいとしました。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0006",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 6
        }
      ],
      "source_text": "En second lieu, appelés par notre heureuse révolution (je l'appelle heureuse, malgré ses excès, parce que je fixe mes regards sur ses résultats) à jouir des bienfaits d'un gouvernement représentatif, il est curieux et utile de rechercher pourquoi ce gouvernement, le seul à l'abri duquel nous puissions aujourd'hui trouver quelque liberté et quelque repos, a été presque entièrement inconnu aux nations libres de l'antiquité.",
      "translation_ja": "第二に、この幸いな革命により、私たちは代議政治の恩恵にあずかるようになりました。行き過ぎがあってもなお幸いと言うのは、私がその結果に目を向けているからです。今日私たちがいくらかの自由と安らぎを得られるのは、この政治のもとでしかないのに、なぜ古代の自由な諸国民にはほとんど知られていなかったのか。これは興味深いばかりでなく、考えてみる値打ちのある問いです。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0007",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 7
        }
      ],
      "source_text": "Je sais que l'on a prétendu en démêler des traces chez quelques peuples anciens, dans la république de Lacédémone, par exemple, et chez nos ancêtres les Gaulois; mais c'est à tort.",
      "translation_ja": "むろん、古代でもいくつかの民族にはその跡があった、たとえばラケダイモンの共和国にも、私たちの祖先であるガリア人の間にもあった、と唱える人がいるのは承知しています。けれども、それは誤りです。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0008",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 8
        }
      ],
      "source_text": "Le gouvernement de Lacédémone était une aristocratie monacale, et nullement un gouvernement représentatif. La puissance des rois était limitée; mais elle l'était par les éphores, et non par des hommes investis d'une mission semblable à celle que l'élection confère de nos jours aux défenseurs de nos libertés. Les éphores, sans doute, après avoir été institués par les rois, furent nommés par le peuple. Mais ils n'étaient que cinq. Leur autorité était religieuse autant que politique; ils avaient part à l'administration même du gouvernement, c'est-à-dire, au pouvoir exécutif; et par là, leur prérogative, comme celle de presque tous les magistrats populaires dans les anciennes républiques, loin d'être simplement une barrière contre la tyrannie, devenait quelquefois elle-même une tyrannie insupportable.",
      "translation_ja": "ラケダイモンの政治は修道院さながらの貴族政で、代議政とはおよそ違うものでした。王たちの権力には制限がありました。しかし、それを制限したのは監督官であって、今日、私たちの自由を守る人々が選挙によって授かるような使命を帯びた者ではありません。確かに監督官は、もとは王が設けた職で、のちには人民が選びました。けれども人数はわずか五人です。政治上の権威と同じほど宗教上の権威をもち、政務の執行そのもの、つまり行政権にもあずかりました。古代の共和国で人民から出たほとんどすべての公職者と同じく、こうした特権は、暴政に対する歯止めどころか、それ自体が耐えがたい暴政になることさえありました。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0009",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 9
        }
      ],
      "source_text": "Le régime des Gaulois, qui ressemblait assez à celui qu'un certain parti voudrait nous rendre, était à la fois théocratique et guerrier. Les prêtres jouissaient d'un pouvoir sans bornes. La classe militaire, ou la noblesse, possédait des privilèges bien insolents et bien oppressifs. Le peuple était sans droits et sans garanties.",
      "translation_ja": "ガリア人の制度は、ある一派が私たちのもとに復活させたがっているものによく似ており、神権政治であると同時に武人の政治でもありました。祭司の権力には際限がなく、武人階級すなわち貴族には、じつに横柄で圧政的な特権がありました。人民には権利も、その保障もありませんでした。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0010",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 10
        }
      ],
      "source_text": "A Rome, les tribuns avaient, jusqu'à un certain point, une mission représentative. Ils étaient les organes de ces plébéiens que l'oligarchie, qui, dans tous les siècles, est la même, avait soumis, en renversant les rois, à un si dur esclavage. Le peuple exerçait toutefois directement une grande partie des droits politiques. Il s'assemblait pour voter les lois, pour juger les patriciens mis en accusation: il n'y avait donc que de faibles vestiges du système représentatif à Rome.",
      "translation_ja": "ローマでは、護民官の使命はある程度まで人民を代表することにありました。寡頭支配者は、いつの時代にも変わらないもので、王を倒すと平民に過酷な隷属を強いました。その平民の声を伝えるのが護民官でした。しかし人民みずから政治的権利の多くを直接に行使しました。集会を開き、法律を採決し、告発された貴族を裁いたのです。ですからローマにも、代議制の跡はかすかにしかありません。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0011",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 11
        }
      ],
      "source_text": "Ce système est une découverte des modernes, et vous verrez, Messieurs, que l'état de l'espèce humaine dans l'antiquité ne permettait pas à une institution de cette nature de s'y introduire ou de s'y établir. Les peuples anciens ne pouvaient ni en sentir la nécessité, ni en apprécier les avantages. Leur organisation sociale les conduisait à désirer une liberté toute différente de celle que ce système nous assure.",
      "translation_ja": "この制度を見いだしたのは近代人です。皆さんもこれからおわかりになるように、古代における人類のあり方は、こうした制度の導入も定着も許しませんでした。古代の人々はその必要を感じることも、その利点を認めることもできませんでした。その社会のしくみに導かれて彼らが求めたのは、この制度が私たちに保障するのとはまるで別の自由だったのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0012",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 12
        }
      ],
      "source_text": "C'est à vous démontrer cette vérité que la lecture de ce soir sera consacrée.",
      "translation_ja": "今晩の講演は、このことを明らかにするために充てたいと思います。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0013",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 13
        }
      ],
      "source_text": "Demandez-vous d'abord, Messieurs, ce que, de nos jours, un Anglais, un Français, un habitant des États-Unis de l'Amérique, entendent par le mot de liberté.",
      "translation_ja": "まず皆さん、今日、イギリス人やフランス人、あるいはアメリカ合衆国に住む人は、自由という言葉で何を考えているか、自分に問うてみてください。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0014",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 14
        }
      ],
      "source_text": "C'est pour chacun le droit de n'être soumis qu'aux lois, de ne pouvoir être ni arrêté, ni détenu, ni mis à mort, ni maltraité d'aucune manière, par l'effet de la volonté arbitraire d'un ou de plusieurs individus: C'est pour chacun le droit de dire son opinion, de choisir son industrie, et de l'exercer, de disposer de sa propriété, d'en abuser même; d'aller, de venir sans en obtenir la permission, et sans rendre compte de ses motifs ou de ses démarches. C'est, pour chacun, le droit de se réunir à d'autres individus, soit pour conférer sur ses intérêts, soit pour professer le culte que lui et ses associés préfèrent, soit simplement pour remplir ses jours ou ses heures d'une manière plus conforme à ses inclinations, à ses fantaisies. Enfin, c'est le droit, pour chacun, d'influer sur l'administration du Gouvernement, soit par la nomination de tous ou de certains fonctionnaires, soit par des représentations, des pétitions, des demandes, que l'autorité est plus ou moins obligée de prendre en considération. Comparez maintenant à cette liberté celle des anciens.",
      "translation_ja": "一人ひとりが、法にだけ従えばよく、一人あるいは数人の勝手な意志で逮捕されず、拘禁されず、殺されず、いかなる仕方でも虐げられない権利です。自分の意見を述べ、仕事を選んで営み、自分の財産を処分し、たとえそれを浪費してもよく、許可を求めず、理由や行動を釈明することもなく行き来する権利です。自分たちの利害について相談するためであれ、ともに望む信仰を実践するためであれ、ただ自分の好みや気まぐれに合った仕方で一日やそのひとときを過ごすためであれ、他の人々と集まる権利です。最後に、すべて、あるいは一部の公職者を選ぶことを通じて、また、当局にも多少なりとも考慮する義務がある意見の申し立てや請願や要求を通じて、政治の運営に影響を及ぼす権利です。では、古代人の自由とこの自由とを比べてみてください。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0015",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 15
        }
      ],
      "source_text": "Celle-ci consistait à exercer collectivement, mais directement, plusieurs parties de la souveraineté toute entière, à délibérer, sur la place publique, de la guerre et de la paix, à conclure avec les étrangers des traités d'alliance, à voter les lois, à prononcer les jugements, à examiner les comptes, les actes, la gestion des magistrats, à les faire comparaître devant tout le peuple, à les mettre en accusation, à les condamner ou à les absoudre; mais en même temps que c'était là ce que les anciens nommaient liberté, ils admettaient comme compatible avec cette liberté collective l'assujettissement complet de l'individu à l'autorité de l'ensemble. Vous ne trouvez chez eux presque aucune des jouissances que nous venons de voir faisant partie de la liberté chez les modernes. Toutes les actions privées sont soumises à une surveillance sévère. Rien n'est accordé à l'indépendance individuelle, ni sous le rapport des opinions, ni sous celui de l'industrie, ni surtout sous le rapport de la religion. La faculté de choisir son culte, faculté que nous regardons comme l'un de nos droits les plus précieux, aurait paru aux anciens un crime et un sacrilège. Dans les choses qui nous semblent les plus utiles, l'autorité du corps social s'interpose et gêne la volonté des individus; Terpandre ne peut chez les Spartiates ajouter une corde à sa lyre sans que les éphores ne s'offensent. Dans les relations les plus domestiques, l'autorité intervient encore. Le jeune Lacédémonien ne peut visiter librement sa nouvelle épouse. A Rome, les censeurs portent un oeil scrutateur dans l'intérieur des familles. Les lois règlent les moeurs, et comme les moeurs tiennent à tout, il n'y a rien que les lois ne règlent.",
      "translation_ja": "古代の自由とは、主権全体に含まれるいくつもの権能を、皆が一緒に、しかも直接に行使することでした。広場で戦争と平和を審議し、他国と同盟を結び、法律を採決し、判決を下し、公職者の会計、行為、政務の処理を調べ、全人民の前に呼び出し、訴追して有罪とも無罪とも決する。それが自由と呼ばれた一方で、個人が全体の権威にすっかり服することは、この集団の自由と両立すると考えられていました。近代人にとって自由の中身をなすと先ほど申し上げた楽しみは、古代にはほとんど見当たりません。私生活の行為はすべて厳しく監視されます。意見にも、生業にも、とりわけ宗教にも、個人の独立が認められる余地はない。信仰を選ぶ自由は、私たちには何より貴重な権利の一つですが、古代人の目には犯罪であり冒瀆であったでしょう。私たちにはこのうえなく有益に思える事柄にまで共同体の権威が割って入り、個人の意志を妨げます。スパルタでは、テルパンドロスが竪琴に弦を一本足すだけで監督官の機嫌を損ねます。家庭のいちばん私的な関係にも権威は口を出します。ラケダイモンの若者は新妻を自由に訪ねることもできません。ローマでは監察官が家庭の奥にまで目を光らせます。法は風俗を規制し、風俗は何にでも関係するので、法の規制しないものは何一つないのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0016",
      "section_id": "lecture",

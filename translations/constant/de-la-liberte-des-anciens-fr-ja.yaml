      "source_text": "Sparte, qui réunissait des formes républicaines au même asservissement des individus, excitait dans l'esprit de ce philosophe un enthousiasme plus vif encore. Ce vaste couvent lui paraissait l'idéal d'une parfaite république. Il avait pour Athènes un profond mépris, et il aurait dit volontiers de cette nation, la première de la Grèce, ce qu'un académicien grand seigneur disait de l'Académie française: \"Quel épouvantable despotisme! tout le monde y fait ce qu'il veut\". Je dois ajouter que ce grand seigneur parlait de l'Académie telle qu'elle était il y a trente ans.",
      "translation_ja": "スパルタは、同じ個人の隷属に共和政の形まで備えていたので、この哲学者の心にさらに熱烈な賛嘆を呼びました。この広大な修道院こそ、完全な共和国の理想像に見えたのです。アテネのことは心底軽蔑していました。ギリシアで第一のこの国について、おそらくある大貴族の学士院会員がフランス学士院について言ったとおりに言いたかったことでしょう。「何というひどい専制だ。みんな好きなことをしているではないか」。もっとも、この大貴族が言ったのは三十年前の学士院のことだと、ひと言つけ加えておかねばなりません。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0042",
      "section_id": "lecture",

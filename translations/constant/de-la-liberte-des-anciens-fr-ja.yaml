      "source_text": "Je ne veux point dire qu'il n'y ait pas eu chez les anciens des peuples commerçants. Mais ces peuples faisaient en quelque sorte exception à la règle générale. Les bornes d'une lecture ne me permettent pas de vous indiquer tous les obstacles qui s'opposaient alors aux progrès du commerce; vous les connaissez d'ailleurs aussi bien que moi: je n'en rapporterai qu'un seul. L'ignorance de la boussole forçait les marins de l'antiquité à ne perdre les côtes de vue que le moins qu'il leur était possible. Traverser les Colonnes d'Hercule, c'est-à-dire, passer le détroit de Gibraltar, était considéré comme l'entreprise la plus hardie. Les Phéniciens et les Carthaginois, les plus habiles des navigateurs, ne l'osèrent que fort tard, et leur exemple resta longtemps sans être imité. A Athènes, dont nous parlerons bientôt, l'intérêt maritime était d'environ 60 pour %, pendant que l'intérêt ordinaire n'était que de douze, tant l'idée d'une navigation lointaine impliquait celle du danger.",
      "translation_ja": "古代に商業を営む民がなかった、と言うつもりはありません。ただ、こうした民はいわば通則の例外でした。一回の講演では、当時の商業の発達を阻んだものをすべて挙げられませんし、それは皆さんも私と同じによくご存じです。一つだけ挙げましょう。羅針盤を知らなかったため、古代の船乗りはできるだけ岸を見失わずに航海しなければなりませんでした。ヘラクレスの柱を越えること、つまりジブラルタル海峡を通ることは、何よりも大胆な企てとされました。航海にいちばん長けていたフェニキア人もカルタゴ人も、ずいぶん後になってようやくそれを試み、長いあいだ後に続く者はありませんでした。後ほどお話しするアテネでは、通常の利率がわずか一二パーセントだったのに、海上貸付の利率は六〇パーセントほどでした。それほど遠い海への航海には、危険という考えがつきまとったのです。",
      "translation_status": "reviewed"

          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 28
        }
      ],
      "source_text": "Troisièmement, le commerce ne laisse pas, comme la guerre, dans la vie de l'homme des intervalles d'inactivité. L'exercice perpétuel des droits politiques, la discussion journalière des affaires de l'État, les dissensions, les conciliabules, tout le cortège et tout le mouvement des factions, agitations nécessaires, remplissage obligé, si j'ose employer ce terme, dans la vie des peuples libres de l'antiquité, qui auraient langui, sans cette ressource, sous le poids d'une inaction douloureuse, n'offriraient que trouble et que fatigue aux nations modernes, où chaque individu occupé de ses spéculations, de ses entreprises, des jouissances qu'il obtient ou qu'il espère, ne veut en être détourné que momentanément et le moins qu'il est possible.",
      "translation_ja": "第三に、商業は戦争と違い、人の生活に何もしない時期を残しません。政治的権利を休みなく行使し、日々国事を論じ、対立し、ひそかに集まり、派閥争いの騒ぎが大勢を巻き込んで続く。これは古代の自由な人々の暮らしにはどうしても要る刺激で、あえて言えば欠かせない暇つぶしでした。これがなければ、苦痛な無為の重みに気力をなくしたことでしょう。けれども近代の人々にとって、それは混乱や疲労にしかなりません。一人ひとりが自分の取引や企て、すでに手にした楽しみやこれから得たい楽しみにかかりきりで、そこから引き離されるのは、たまのこと、それもなるべく短い時間にしたいのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0029",

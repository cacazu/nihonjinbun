      "source_text": "Le commerce rend l'action de l'arbitraire sur notre existence plus vexatoire qu'autrefois, parce que nos spéculations étant plus variées, l'arbitraire doit se multiplier pour les atteindre; mais le commerce rend aussi l'action de l'arbitraire plus facile a éluder, parce qu'il change la nature de la propriété, qui devient par ce changement presque insaisissable. Le commerce donne à la propriété une qualité nouvelle, la circulation: sans circulation, la propriété n'est qu'un usufruit; l'autorité peut toujours influer sur l'usufruit, car elle peut enlever la jouissance; mais la circulation met un obstacle invisible et invincible à cette action du pouvoir social.",

          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 43
        }
      ],
      "source_text": "Les hommes qui se trouvèrent portés par le flot des événements à la tête de notre révolution, étaient, par une suite nécessaire de l'éducation qu'ils avaient reçue, imbus des opinions antiques, et devenues fausses, qu'avaient mises en honneur les philosophes dont j'ai parlé. La métaphysique de Rousseau, au milieu de laquelle paraissaient tout-à-coup comme des éclairs des vérités sublimes et des passages d'une éloquence entraînante, l'austérité de Mably, son intolérance, sa haine contre toutes les passions humaines, son avidité de les asservir toutes, ses principes exagérés sur la compétence de la loi, la différence de ce qu'il recommandait et de ce qui avait existé, ses déclamations contre les richesses et même contre la propriété; toutes ces choses devaient charmer des hommes échauffés par une victoire récente, et qui, conquérants de la puissance légale, étaient bien aises d'étendre cette puissance sur tous les objets. C'était pour eux une autorité précieuse que celle de deux écrivains qui, désintéressés dans la question et prononçant anathème contre le despotisme des hommes, avaient rédigé en axiome le texte de la loi. Ils voulurent donc exercer la force publique comme ils avaient appris de leurs guides qu'elle avait été jadis exercée dans les états libres. Ils crurent que tout devait encore céder devant la volonté collective et que toutes les restrictions aux droits individuels seraient amplement compensées par la participation au pouvoir social.",
      "translation_ja": "事の成り行きに押されて私たちの革命の先頭に立った人々には、その受けた教育の必然の結果として、先ほどの哲学者たちがもてはやした、古代には通じても今では誤りとなった考え方が染み込んでいました。ルソーの形而上学、そのさなかに稲妻のように不意にひらめく崇高な真理と抗いがたい雄弁。マブリの厳格さと偏狭さ、人間のあらゆる情念を憎んでそのすべてを屈服させようとする熱、法の及ぶ範囲についての極端な原則、勧めるものがこれまであったものとすっかり違うこと、富に対する、さらには財産をもつことそのものに対する大仰な非難。これらすべてが、勝利を得たばかりで興奮し、法の権力を握ってその力を万事に及ぼしたい人々の心をとらえずにはいませんでした。自分に利害がかからず、人による専制には破門を宣告しながら、法の言葉を公理に仕立ててくれたこの二人の著述家は、革命の指導者たちには貴重な権威でした。そこで彼らは、昔の自由国家では公権力がこのように行使されたと師から教わったとおりに、公権力をふるおうとしました。あらゆるものが今なお集団の意志に譲らなければならず、個人の権利がいかに制限されても、共同体の権力に参加できることで十分に埋め合わせがつく、と信じたのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0044",

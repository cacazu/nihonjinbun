      "source_text": "La censure romaine supposait comme l'ostracisme un pouvoir discrétionnaire. Dans une république dont tous les citoyens, maintenus par la pauvreté dans une simplicité extrême de moeurs, habitaient la même ville, n'exerçaient aucune profession qui détournât leur attention des affaires de l'État, et se trouvaient ainsi constamment spectateurs et juges de l'usage du pouvoir public, la censure pouvait d'une part avoir plus d'influence; et de l'autre, l'arbitraire des censeurs était contenu par une espèce de surveillance morale exercée contre eux. Mais aussitôt que l'étendue de la république, la complication des relations sociales et les raffinements de la civilisation, eurent enlevé à cette institution ce qui lui servait à la fois de base et de limite, la censure dégénéra même à Rome. Ce n'était donc pas la censure qui avait crée les bonnes moeurs; c'était la simplicité des moeurs qui constituait la puissance et l'efficacité de la censure.",
      "translation_ja": "ローマの監察制度も、陶片追放と同じく裁量権を前提にしていました。貧しさゆえにすべての市民がきわめて質素に暮らし、同じ都市に住み、注意を国事からそらすような職業に従事せず、そのため公権力の使い方を絶えず見ながら判断する立場にあった共和国では、一方で監察は今よりずっと影響を及ぼせました。他方で監察官の恣意も、いわば周囲の道徳的な監視によって抑えられていたのです。けれども共和国の拡大、社会関係の複雑化、文明の洗練によって、その制度の足場であると同時に歯止めでもあったものが取り払われるや、ローマでさえ監察は堕落しました。監察が良い風俗を作ったのではありません。風俗が素朴だったからこそ、監察には力があり、効き目があったのです。",
      "translation_status": "reviewed"
    },

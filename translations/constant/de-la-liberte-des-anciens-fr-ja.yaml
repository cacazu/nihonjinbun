      "source_text": "Il s'ensuit que nous devons être bien plus attachés que les anciens à notre indépendance individuelle; car les anciens, lorsqu'ils sacrifiaient cette indépendance aux droits politiques, sacrifiaient moins pour obtenir plus; tandis qu'en faisant le même sacrifice, nous donnerions plus pour obtenir moins.",

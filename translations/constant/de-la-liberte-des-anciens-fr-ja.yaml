      "source_text": "En second lieu, l'abolition de l'esclavage a enlevé à la population libre tout le loisir qui résultait pour elle de ce que des esclaves étaient chargés de la plupart des travaux. Sans la population esclave d'Athènes, 20.000 Athéniens n'auraient pas pu délibérer chaque jour sur la place publique.",

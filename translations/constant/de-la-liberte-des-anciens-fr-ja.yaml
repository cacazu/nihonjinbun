      "source_text": "Si je suis parvenu, Messieurs, à vous faire partager la conviction que dans mon opinion ces faits doivent produire, vous reconnaîtrez avec moi la vérité des principes suivants.",
      "translation_ja": "皆さん、これらの事実から引き出すべきだと私が思う確信を共有していただけたなら、次の原則が正しいことにも同意していただけるでしょう。",

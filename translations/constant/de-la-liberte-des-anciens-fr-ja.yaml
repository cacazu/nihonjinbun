          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 42
        }
      ],
      "source_text": "Montesquieu, doué d'un esprit plus observateur parce qu'il avait une tête moins ardente, n'est pas tombé tout-à-fait dans les mêmes erreurs. Il a été frappé des différences que j'ai rapportées: mais il n'en a pas démêlé la cause véritable. Les politiques grecs qui vivaient sous le gouvernement populaire ne reconnaissaient, dit-il, d'autre force que celle de la vertu. Ceux d'aujourd'hui ne nous parlent que de manufactures, de commerce, de finances, de richesses et de luxe même. Il attribue cette différence à la république et à la monarchie: il faut l'attribuer à l'esprit opposé des temps anciens et des temps modernes. Citoyens des républiques, sujets des monarchies, tous veulent des jouissances, et nul ne peut, dans l'état actuel des sociétés, ne pas en vouloir. Le peuple le plus attaché de nos jours à sa liberté, avant l'affranchissement de la France, était aussi le peuple le plus attaché à toutes les jouissances de la vie; et il tenait à sa liberté surtout parce qu'il y voyait la garantie des jouissances qu'il chérissait. Autrefois, là où il y avait liberté, l'on pouvait supporter les privations: maintenant partout où il y a privations, il faut l'esclavage pour qu'on s'y résigne. Il serait plus possible aujourd'hui de faire d'un peuple d'esclaves un peuple de Spartiates, que de former des Spartiates par la liberté.",
      "translation_ja": "モンテスキューは、いくらか頭が冷静だっただけ観察眼も鋭く、まったく同じ過ちに陥ったわけではありません。私がお話しした違いに心を留めましたが、その真の原因は見きわめませんでした。民衆政のもとに生きたギリシアの政治家たちは徳にしか力を認めなかったのに、今日の政治家は製造業、商業、財政、富や奢侈のことまで、そんなことしか私たちに語らない、と彼は言います。その違いを共和政と君主政の違いに帰していますが、古代と近代の時代精神が相反していることに帰すべきです。共和国の市民であれ君主国の臣民であれ、誰もが暮らしの楽しみを望みますし、今日の社会のあり方では望まずにいることはできません。フランスが自由を得る以前、近代において最も自由を大切にした民は、同時に生活のあらゆる楽しみを最も大切にする民でもありました。自由を愛したのも、愛する楽しみを保障してくれると考えたからにほかなりません。昔は自由さえあれば窮乏に耐えられました。今では窮乏に甘んじさせるには、どこでも隷属を強いなくてはなりません。今の時代には、人々を自由によってスパルタ人に仕立てるより、奴隷の民をスパルタ人に仕立てるほうがまだ見込みがあるでしょう。",

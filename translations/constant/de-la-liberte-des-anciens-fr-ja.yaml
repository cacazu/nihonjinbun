          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 44
        }
      ],
      "source_text": "Vous savez, Messieurs, ce qui en est résulté. Des institutions libres, appuyées sur la connaissance de l'esprit du siècle, auraient pu subsister. L'édifice renouvelé des anciens s'est écroulé, malgré beaucoup d'efforts et beaucoup d'actes héroïques qui ont droit a l'admiration. C'est que le pouvoir social blessait en tout sens l'indépendance individuelle sans en détruire le besoin. La nation ne trouvait point qu'une part idéale à une souveraineté abstraite valût les sacrifices qu'on lui commandait. On lui répétait vainement avec Rousseau: les lois de la liberté sont mille fois plus austères que n'est dur le joug des tyrans. Elle ne voulait pas de ces lois austères, et dans sa lassitude, elle croyait quelquefois que le joug des tyrans serait préférable. L'expérience est venue et l'a détrompée. Elle a vu que l'arbitraire des hommes était pire encore que les plus mauvaises lois. Mais les lois aussi doivent avoir leurs limites.",
      "translation_ja": "その結果は皆さんがご存じです。時代の精神をくみ取った自由な制度なら、生き続けることができたでしょう。古代から借りて建て直した建物は、あれだけ多くの努力にも、称賛に値するあれだけの英雄的行為にもかかわらず、崩れました。共同体の権力が、個人の独立を求める気持ちを消し去れないまま、あらゆる面からその独立を傷つけたからです。抽象的な主権を観念の上でいくらか分けてもらうことが、命じられる犠牲に見合うとは、国民には思えませんでした。「暴君のくびきがどれほど重くとも、自由の法はその千倍も厳しい」と、ルソーの言葉をいくら聞かせてもむだでした。国民はそんな厳しい法など望まず、疲れ果てて、ときには暴君のくびきのほうがましだとすら思いました。やがて経験が来て、その思い違いを正しました。人の気まぐれによる支配はどんな悪法よりなお悪いとわかったのです。しかし、法にもまた限界はなくてはなりません。",
      "translation_status": "reviewed"
    },

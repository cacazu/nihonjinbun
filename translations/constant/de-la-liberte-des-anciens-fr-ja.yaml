          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 54
        }
      ],
      "source_text": "Défions-nous donc, Messieurs, de cette admiration pour certaines réminiscences antiques. Puisque nous vivons dans les temps modernes je veux la liberté convenable aux temps modernes; et puisque nous vivons sous des monarchies, je supplie humblement ces monarchies de ne pas emprunter aux républiques anciennes des moyens de nous opprimer.",
      "translation_ja": "ですから皆さん、そうした古代の記憶への陶酔には気をつけましょう。近代を生きる以上、私が欲しいのは近代にふさわしい自由です。また私たちは君主国で暮らしているのですから、私たちを抑圧する手段を古代の共和国から借りてくださるなと、君主国の皆様に謹んでお願いするしだいです。",

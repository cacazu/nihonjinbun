        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 29
        }
      ],
      "source_text": "Enfin, le commerce inspire aux hommes un vif amour pour l'indépendance individuelle. Le commerce subvient à leurs besoins, satisfait à leurs désirs, sans l'intervention de l'autorité. Cette intervention est presque toujours, et je ne sais pourquoi je dis presque, cette intervention est toujours un dérangement et une gêne. Toutes les fois que le pouvoir collectif veut se mêler des spéculations particulières, il vexe les spéculateurs. Toutes les fois que les gouvernements prétendent faire nos affaires, ils les font plus mal et plus dispendieusement que nous.",
      "translation_ja": "最後に、商業は個人の独立を強く愛する気持ちを人に吹き込みます。商業は、公権力の干渉を待たずに、人の必要を満たし、望みをかなえます。公権力の介入はほとんどいつも、いや、なぜ「ほとんど」などと申したのでしょう、いつの場合にも、仕事をかき乱す邪魔立てです。共同体の権力が個人の取引に口を挟みたがるたび、当事者は迷惑をこうむります。政府が私たちの仕事を引き受けようとすると、いつでも私たちよりまずい仕事に、もっと多くの費用をかけるのです。",
      "translation_status": "reviewed"
    },
    {

          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 48
        }
      ],
      "source_text": "Cette vérité, Messieurs, semble d'abord superflue à établir. Plusieurs gouvernements de nos jours ne paraissent guères enclins à imiter les républiques de l'antiquité. Cependant quelque peu de goût qu'ils aient pour les institutions républicaines, il y a de certains usages républicains pour lesquels ils éprouvent je ne sais quelle affection. Il est fâcheux que ce soit précisément celles qui permettent de bannir, d'exiler, de dépouiller. Je me souviens qu'en 1802, on glissa dans une loi sur les tribunaux spéciaux un article qui introduisait en France l'ostracisme grec; et Dieu sait combien d'éloquents orateurs, pour faire admettre cet article, qui cependant fut retiré, nous parlèrent de la liberté d'Athènes, et de tous les sacrifices que les individus devaient faire pour conserver cette liberté! De même, à une époque bien plus récente, lorsque des autorités craintives essayaient d'une main timide de diriger les élections a leur gré, un journal qui n'est pourtant point entaché de républicanisme, proposa de faire revivre la censure romaine pour écarter les candidats dangereux.",
      "translation_ja": "皆さん、一見、こんなことはことさら証明するまでもなさそうです。現代の政府の多くに古代の共和国をまねる気など、およそなさそうに見えます。ところが共和制の制度一般がいかにお好みでなくても、その慣行のいくつかには、どういうわけか愛着をお持ちなのです。困ったことには、それがきまって、人を国から放逐し、追放し、財産を奪うことのできる慣行なのです。私が覚えているのは一八〇二年、特別裁判所に関する法律に、ギリシアの陶片追放をフランスに導入する一箇条がそっと忍び込まされたことです。結局は撤回されたこの箇条を通すために、いったい何人の雄弁家が、アテネの自由だの、それを守るために個人が払わねばならぬあらゆる犠牲だのを語ってくれたことでしょう。もっと近ごろにも、当局がおずおずと手を伸ばし、自分たちの望むように選挙を動かそうとした折、共和主義に染まってなどいない新聞が、危険な候補を締め出すためにローマの監察官制度を復活させようと提案したものです。",
      "translation_status": "reviewed",

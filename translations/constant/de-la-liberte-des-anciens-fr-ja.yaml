      "source_text": "De plus, si je pouvais me livrer à une digression qui malheureusement serait trop longue, je vous montrerais, Messieurs, par le détail des moeurs, des habitudes, du mode de trafiquer des peuples commerçants de l'antiquité avec les autres peuples, que leur commerce même était, pour ainsi dire, imprégné de l'esprit de l'époque, de l'atmosphère de guerre et d'hostilité qui les entourait. Le commerce alors était un accident heureux, c'est aujourd'hui l'état ordinaire, le but unique, la tendance universelle, la vie véritable des nations. Elles veulent le repos, avec le repos l'aisance, et comme source de l'aisance, l'industrie. La guerre est chaque jour un moyen plus inefficace de remplir leurs voeux. Ses chances n'offrent plus ni aux individus, ni aux nations des bénéfices qui égalent les résultats du travail paisible et des échanges réguliers. Chez les anciens, une guerre heureuse ajoutait en esclaves, en tributs, en terres partagées, à la richesse publique et particulière. Chez les modernes, une guerre heureuse coûte infailliblement plus qu'elle ne vaut.",
      "translation_ja": "もう少し脱線できればよいのですが、残念ながら長くなりすぎます。それができれば、古代の商業民族の風俗や習慣、他の民族との取引のしかたを詳しく取り上げて、その商業そのものにさえ時代の精神、すなわち周囲を満たす戦争と敵意の空気が染み込んでいたことを、皆さんにお見せするでしょう。当時の商業は幸運な例外でした。今日は諸国民のふだんのあり方、もっぱらの目標、あまねく見られる志向であり、まさにその生活そのものです。諸国民が欲するのは安らぎであり、安らぎとともに暮らしのゆとりであり、ゆとりの源となる生産の営みです。戦争は日ごとに、その望みを満たすには役に立たなくなります。戦争で見込める利益は、個人にとっても国民にとっても、もはや平和な労働と規則正しい交換の成果に及びません。古代では戦勝によって、奴隷や貢納や分配された土地という形で、公私の富が増えました。近代では、たとえ勝っても戦争の代価は必ず獲得したものの値打ちを上回ります。",

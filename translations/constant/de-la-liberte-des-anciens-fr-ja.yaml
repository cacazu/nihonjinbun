      ],
      "source_text": "1° L'étendue d'un pays diminue d'autant l'importance politique qui échoit en partage à chaque individu. Le républicain le plus obscur de Rome ou de Sparte était une puissance. Il n'en est pas de même du simple citoyen de la Grande-Bretagne ou des États-Unis. Son influence personnelle est un élément imperceptible de la volonté sociale qui imprime au gouvernement sa direction.",
      "translation_ja": "第一に、国土が広ければ、その分だけ、個々人の取り分となる政治上の重みは小さくなります。ローマやスパルタでは、最も無名の共和国市民も一つの勢力でした。イギリスや合衆国の普通の市民はそうではありません。一個人の影響力など、政府の進む方向を決める社会全体の意志のうちでは、見分けもつかない一要素にすぎません。",

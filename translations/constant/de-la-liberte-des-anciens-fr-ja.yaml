      "source_text": "L'argent, dit un auteur français, est l'arme la plus dangereuse du despotisme, mais il est en même temps son frein le plus puissant; le crédit est soumis à l'opinion; la force est inutile; l'argent se cache ou s'enfuit; toutes les opérations de l'État sont suspendues. Le crédit n'avait pas la même influence chez les anciens; leurs gouvernements étaient plus forts que les particuliers; les particuliers sont plus forts que les pouvoirs politiques de nos jours; la richesse est une puissance plus disponible dans tous les instants, plus applicable a tous les intérêts, et par conséquent bien plus réelle et mieux obéie; le pouvoir menace, la richesse récompense: on échappe au pouvoir en le trompant; pour obtenir les faveurs de la richesse, il faut la servir: celle-ci doit l'emporter.",

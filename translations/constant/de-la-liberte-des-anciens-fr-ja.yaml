      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 57
        }
      ],
      "source_text": "Cette réserve de l'autorité, qui est dans ses devoirs stricts, est également dans ses intérêts bien entendus; car si la liberté qui convient aux modernes est différente de celle qui convenait aux anciens, le despotisme qui était possible chez les anciens n'est plus possible chez les modernes. De ce que nous sommes souvent plus distraits de la liberté politique qu'ils ne pouvaient l'être, et dans notre état ordinaire moins passionnés pour elle, il peut s'ensuivre que nous négligions quelquefois trop, et toujours à tort, les garanties qu'elle nous assure; mais en même temps, comme nous tenons beaucoup plus à la liberté individuelle que les anciens, nous la défendrons, si elle est attaquée, avec beaucoup plus d'adresse et de persistance; et nous avons pour la défendre des moyens que les anciens n'avaient pas.",

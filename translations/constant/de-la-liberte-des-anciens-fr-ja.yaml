      "translation_ja": "そもそも、楽しみがそれを守る保障から切り離されたら、その楽しみで幸福になれるでしょうか。政治的自由を捨ててしまえば、どこにそうした保障が見つかるでしょうか。皆さん、それを放棄するのは、住むのは二階だけだからといって、砂の上に土台のない家を建てようとする人と同じくらい、正気を欠いたことです。",

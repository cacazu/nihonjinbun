    {
      "id": "constant-0031",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 31
        }
      ],
      "source_text": "Athènes, comme, je l'ai déjà reconnu, était, de toutes les républiques grecques, la plus commerçante: aussi accordait-elle à ses citoyens infiniment plus de liberté individuelle que Rome et que Sparte. Si je pouvais entrer dans des détails historiques, je vous ferais voir que le commerce avait fait disparaître de chez les Athéniens plusieurs des différences qui distinguent les peuples anciens des peuples modernes. L'esprit des commerçants d'Athènes était pareil a celui des commerçants de nos jours. Xénophon nous apprend que, durant la guerre du Péloponnèse, ils sortaient leurs capitaux du continent de l'Attique et les envoyaient dans les îles de l'Archipel. Le commerce avait créé chez eux la circulation. Nous remarquons dans Isocrate des traces de l'usage des lettres-de-change. Aussi, observez, combien leurs moeurs ressemblent aux nôtres. Dans leurs relations avec les femmes, vous verrez, je cite encore Xénophon, les époux satisfaits quand la paix et une amitié décente règnent dans l'intérieur du ménage, tenir compte à l'épouse trop fragile de la tyrannie de la nature, fermer les yeux sur l'irrésistible pouvoir des passions, pardonner la première faiblesse et oublier la seconde. Dans leurs rapports avec les étrangers l'on les verra prodiguer les droits de cité à quiconque, se transportant chez eux avec sa famille, établit un métier ou une fabrique; enfin on sera frappé de leur amour excessif pour l'indépendance individuelle. A Lacédémone, dit un philosophe, les citoyens accourent lorsque le magistrat les appelle; mais un Athénien serait au désespoir qu'on le crût dépendant d'un magistrat.",
      "translation_ja": "すでに認めたとおり、ギリシアの共和国のうち、アテネほど商業が盛んなところはなく、それゆえローマやスパルタに比べてはるかに多くの個人的自由を市民に認めました。詳しい史実に立ち入る時間があれば、古代と近代の人々を分ける違いのいくつかが、アテネ人のもとでは商業のおかげで消えていたことをお示しできるでしょう。アテネの商人の考え方は、今の商人とそっくりでした。クセノポンによれば、ペロポネソス戦争中、商人はアッティカ本土から資金を引き揚げ、エーゲ海の島々に送りました。商業は彼らのもとに資産の流通を生みました。イソクラテスにも為替手形の使用をうかがわせる記述があります。また、その風習が私たちのものとよく似ていることにも注目してください。女性との関係を見ると、これはまたクセノポンの話ですが、夫たちは家庭に平穏と節度ある愛情があれば満足し、誘惑に弱い妻がいても人の性に抗しがたい面があることを酌み、情念の力には目をつぶり、一度の過ちは許し、二度目は忘れてやります。外国人との関係を見れば、家族とともに移り住んで仕事を始めたり工場を設けたりする人には、惜しげもなく市民権を与えます。最後に目をみはるのが、個人の独立に対する並外れた愛着です。ある哲学者によれば、ラケダイモンでは役人が呼ぶと市民が駆けつけますが、アテネ人は、自分が役人の言いなりだなどと思われたら絶望するというのです。",

      "source_text": "D'ailleurs, Messieurs, est-il donc si vrai que le bonheur, de quelque genre qu'il puisse être, soit le but unique de l'espèce humaine? En ce cas, notre carrière serait bien étroite et notre destination bien peu relevée. Il n' est pas un de nous qui, s'il voulait descendre, restreindre ses facultés morales, rabaisser ses désirs, abjurer l'activité, la gloire, les émotions généreuses et profondes, ne pût s'abrutir et être heureux, Non, Messieurs, j'en atteste cette partie meilleure de notre nature, cette noble inquiétude qui nous poursuit et qui nous tourmente, cette ardeur d'étendre nos lumières et de développer nos facultés; ce n'est pas au bonheur seul, c'est au perfectionnement que notre destin nous appelle; et la liberté politique est le plus puissant, le plus énergique moyen de perfectionnement que le ciel nous ait donné.",
      "translation_ja": "それに、皆さん、どんな種類の幸福であれ、幸福が人類の唯一の目的だというのは、それほど確かなことでしょうか。そうだとすれば、私たちが進む道はあまりに狭く、その使命はまことに低いものです。身を落とし、精神の力を縮め、望みを低くし、活動することも、栄誉も、気高く深い感情も捨てさえすれば、誰だって愚鈍になり、幸福になることぐらいできるではありませんか。いいえ、皆さん、私たちの本性のうちのより良い部分にかけて申します。私たちを追い立て悩ませるあの気高い落ち着かなさ、知識を広げ、もてる力を伸ばそうとするあの熱意にかけて申します。私たちの運命が呼びかけているのは、幸福だけでなく、自己をいっそう高めることなのです。そして、私たち自身を高めるために天が与えてくれた手段の中で、政治的自由ほど強力で、力に満ちたものはありません。",

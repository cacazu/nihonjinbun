      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 37
        }
      ],
      "source_text": "J'ai dit en commençant que, faute d'avoir aperçu ces différences, des hommes bien intentionnés d'ailleurs, avaient causé des maux infinis durant notre longue et orageuse révolution. A Dieu ne plaise que je leur adresse des reproches trop sévères: leur erreur même était excusable. On ne saurait lire les belles pages de l'antiquité, l'on ne se retrace point les actions de ses grands hommes sans ressentir je ne sais quelle émotion d'un genre particulier que ne fait éprouver rien de ce qui est moderne. Les vieux éléments d'une nature antérieure, pour ainsi dire, à la nôtre, semblent se réveiller en nous à ces souvenirs. II est difficile de ne pas regretter ces temps où les facultés de l'homme se développaient dans une direction tracée d'avance, mais dans une carrière si vaste, tellement fortes de leurs propres forces, et avec un tel sentiment d'énergie et de dignité; et lorsqu'on se livre à ces regrets, il est impossible de ne pas vouloir imiter ce qu'on regrette. Cette impression était profonde, surtout lorsque nous vivions sous des gouvernements abusifs, qui, sans être forts, étaient vexatoires, absurdes en principes, misérables en action; gouvernements qui avaient pour ressort l'arbitraire, pour but le rapetissement de l'espèce humaine, et que certains hommes osent nous vanter encore aujourd'hui, comme si nous pouvions oublier jamais que nous avons été témoins et victimes de leur obstination, de leur impuissance et de leur renversement. Le but de nos réformateurs fut noble et généreux. Qui d'entre nous n'a pas senti son coeur battre d'espérance à l'entrée de la route qu'ils semblaient ouvrir? Et malheur encore à présent à qui n'éprouve pas le besoin de déclarer que reconnaître quelques erreurs commises par nos premiers guides, ce n'est pas flétrir leur mémoire ni désavouer des opinions que les amis de l'humanité ont professées d'âge en âge.",
      "translation_ja": "初めに申しましたように、こうした違いに気づかなかったため、志そのものは善良だった人々が、長く荒れ狂った私たちの革命の間に、限りない災いを引き起こしました。どうか私が彼らをあまりに厳しく責めることのないように。その誤りにも無理のないところがありました。古代の美しい文章を読み、偉人たちの行いを思い描いて、近代の何ものからも受けない、何とも言いようのない独特な感動をおぼえずにはいられません。こうした記憶に触れると、私たちの本性よりさらに古い本性の名残のようなものが、内に目を覚ますようです。人間の能力はあらかじめ引かれた方向にこそ展開しましたが、その駆けめぐる天地の広さ、自分の力そのものから得る強さ、みなぎる活力と気品への自覚は、いかばかりだったか。あの時代を惜しまずにはいられず、その思いに浸れば、惜しむものをまねてみたくなるのも当然です。こうした印象は、とりわけ私たちが、強くもないのに人を苦しめ、原則は不条理で、実行することは見るに堪えない、権力を濫用する政府の下にいたときに深いものでした。気まぐれが政治の原動力で、人間を卑小にすることが目的だった政府です。その頑迷さと無力さ、そしてその崩壊を、私たち自身が目にし、わが身で経験したことなどいつか忘れてしまえるかのように、今日なおその政府を褒めたたえてみせる人々までいます。私たちの改革者の目的は高潔で、広い心に発するものでした。彼らが開いてくれると思えた道の入り口で、誰が希望に胸を躍らせなかったでしょう。最初に私たちを導いた人々の誤りをいくつか認めることは、その名を汚すことでも、世々の人類の友が唱えてきた考えを捨てることでもありません。そのことを今なおはっきり言っておく必要を感じない人は、不幸というほかありません。",

        }
      ],
      "source_text": "Loin donc, Messieurs, de renoncer à aucune des deux espèces de liberté dont je vous ai parlé, il faut, je l'ai démontré, apprendre à les combiner l'une avec l'autre. Les institutions, comme le dit le célèbre auteur de l'Histoire des républiques du moyen âge, doivent accomplir les destinées de l'espèce humaine; elles atteignent d'autant mieux leur but qu'elles élèvent le plus grand nombre possible de citoyens à la plus haute dignité morale.",
      "translation_ja": "ですから皆さん、これまでお話しした二種類の自由は、どちらかを手放すどころか、互いに結びつけるすべを学ばねばなりません。その必要はもうお示ししたとおりです。『中世共和国史』の名高い著者が言うように、諸制度は人類の使命を成就するものでなくてはなりません。できるだけ多くの市民を最も高い道徳的な品位に引き上げるほど、制度はその目的をよく果たすのです。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0072",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 72
        }
      ],
      "source_text": "L'oeuvre du législateur n'est point complète quand il a seulement rendu le peuple tranquille. Lors même que ce peuple est content, il reste encore beaucoup à faire. Il faut que les institutions achèvent l'éducation morale des citoyens. En respectant leurs droits individuels, en ménageant leur indépendance, en ne troublant point leurs occupations, elles doivent pourtant consacrer leur influence sur la chose publique, les appeler à concourir, par leurs déterminations et par leurs suffrages, à l'exercice du pouvoir, leur garantir un droit de contrôle et de surveillance par la manifestation de leurs opinions, et les formant de la sorte par la pratique à ces fonctions élevées, leur donner à la fois et le désir et la faculté de s'en acquitter.",
      "translation_ja": "立法者の仕事は、人民をただ平穏にしただけでは完成しません。人民が満足していてさえ、まだなすべきことは多くあります。制度は市民の道徳教育を完成させなければならないのです。個人の権利を尊重し、独立を大切にし、仕事を妨げず、それでもなお、公の事柄に市民の影響力が及ぶことを確かなものとしなければなりません。市民がみずからの決定と投票によって権力の行使に加わるよう促し、意見を表明してその行使を点検し監視する権利を保障すること。そして、こうして実践を通じてそれらの高い責務を果たせるよう育て、その責務を担いたいという意欲と担えるだけの力を、ともに与えることです。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0073",
      "section_id": "lecture",
      "kind": "note_body",

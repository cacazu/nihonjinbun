          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 16
        }
      ],
      "source_text": "Ainsi chez les anciens, l'individu, souverain presque habituellement dans les affaires publiques, est esclave dans tous les rapports privés. Comme citoyen, il décide de la paix et de la guerre; comme particulier, il est circonscrit, observé, réprimé dans tous ses mouvements; comme portion du corps collectif, il interroge, destitue, condamne, dépouille, exile, frappe de mort ses magistrats ou ses supérieurs; comme soumis au corps collectif, il peut à son tour être privé de son état, dépouillé de ses dignités, banni, mis à mort, par la volonté discrétionnaire de l'ensemble dont il fait partie. Chez les modernes, au contraire, l'individu, indépendant dans sa vie privée, n'est même dans les états les plus libres, souverain qu'en apparence. Sa souveraineté est restreinte, presque toujours suspendue; et si, à des époques fixes, mais rares, durant les quelles il est encore entouré de précautions et d'entraves, il exerce cette souveraineté, ce n'est jamais que pour l'abdiquer.",
      "translation_ja": "こうして古代の個人は、公の場ではほとんどいつも主権者なのに、私的な関係では何につけても奴隷でした。市民としては戦争と平和を決めるのに、私人としては一挙一動にわたり行動を制限され、見張られ、押さえつけられる。集団の一員として、公職者や自分より上に立つ者を問いただし、罷免し、有罪とし、財産を奪い、追放し、死刑にする。その集団に従う者としては、今度は自分が、みずから属する全体の一存で、身分も名誉も奪われ、追放され、死刑にされかねない。これに対して近代の個人は、私生活では独立していても、最も自由な国でさえ、主権者というのは形の上だけです。その主権は限られ、ほとんどいつも行使を休止しています。あらかじめ定められた、ごくたまにしかない時期になお数々の用心や束縛に囲まれながら主権を行使しても、それはその主権を手放すためでしかありません。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0017",
      "section_id": "lecture",
      "kind": "paragraph",

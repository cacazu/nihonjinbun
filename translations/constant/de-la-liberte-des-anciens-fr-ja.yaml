      "source_text": "Il s'ensuit qu'aucune des institutions nombreuses et trop vantées qui, dans les républiques anciennes, gênaient la liberté individuelle, n'est point admissible dans les temps modernes.",
      "translation_ja": "してみれば、古代の共和国で個人の自由を妨げていた、あまりに高く買われすぎているあまたの制度は、どれ一つとして近代に認められてはなりません。",

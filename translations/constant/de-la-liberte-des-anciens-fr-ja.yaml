      ],
      "source_text": "Le but des anciens était le partage du pouvoir social entre tous les citoyens d'une même patrie: c'était là ce qu'ils nommaient liberté. Le but des modernes est la sécurité dans les jouissances privées; et ils nomment liberté les garanties accordées par les institutions à ces jouissances.",

          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 20
        }
      ],
      "source_text": "Le monde moderne nous offre un spectacle complètement opposé. Les moindres états de nos jours sont incomparablement plus vastes que Sparte ou que Rome durant cinq siècles. La division même de l'Europe en plusieurs états, est, grâce aux progrès des lumières, plutôt apparente que réelle. Tandis que chaque peuple, autrefois, formait une famille isolée, ennemie née des autres familles, une masse d'hommes existe maintenant sous différents noms, et sous divers modes d'organisation sociale, mais homogène de sa nature. Elle est assez forte pour n'avoir rien à craindre des hordes barbares. Elle est assez éclairée pour que la guerre lui soit à charge. Sa tendance uniforme est vers la paix.",
      "translation_ja": "近代世界に目を移せば、光景は正反対です。今の最小の国家でも、スパルタや最初の五世紀間のローマより比べものにならないほど広い。そもそもヨーロッパが複数の国に分かれていること自体、知の進歩のおかげで、実質よりも外見上のこととなっています。かつて各国の民は、孤立し、よその家族には生まれながらの敵という、一つの家族を形づくっていました。今や、名も社会のしくみもさまざまながら、その性質を同じくする一つの大きな人の集まりがあります。それは十分に強いので、いわゆる蛮族の群れを恐れる必要がなく、十分に啓発されているので、戦争を重荷と感じます。その全体が同じように平和へと向かっています。",

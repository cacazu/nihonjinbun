      "source_text": "De là vient, Messieurs, la nécessité du système représentatif. Le système représentatif n'est autre chose qu'une organisation à l'aide de laquelle une nation se décharge sur quelques individus de ce qu'elle ne peut ou ne veut pas faire elle-même. Les individus pauvres font eux-mêmes leurs affaires: les hommes riches prennent des intendants. C'est l'histoire des nations anciennes et des nations modernes. Le système représentatif est une procuration donnée à un certain nombre d'hommes par la masse du peuple, qui veut que ses intérêts soient défendus, et qui néanmoins n'a pas le temps de les défendre toujours lui-même. Mais a moins d'être insensés, les hommes riches qui ont des intendants examinent avec attention et sévérité si ces intendants font leur devoir, s'ils ne sont ni négligents ni corruptibles, ni incapables; et pour juger de la gestion de ces mandataires, les commettants qui ont de la prudence se mettent bien au fait des affaires dont ils leur confient l'administration. De même, les peuples qui, dans le but de jouir de la liberté qui leur convient, recourent au système représentatif, doivent exercer une surveillance active et constante sur leur représentants, et se réserver, à des époques qui ne soient pas séparées par de trop longs intervalles, le droit de les écarter s'ils ont trompé leurs voeux, et de révoquer les pouvoirs dont ils auraient abusé.",
      "translation_ja": "ここに、皆さん、代議制が必要となる理由があります。代議制とは、国民が自分ではできないこと、あるいはすることを望まないことを、何人かに代わってしてもらうしくみにほかなりません。貧しい人は自分の用事は自分でし、富んだ人は財産の管理人を雇います。これはそのまま古代と近代の諸国民の話です。代議制は、利益を守ってもらいたいがいつでも自分で守っているだけの時間はない人々が、何人かに渡す委任状です。しかし管理人を置く金持ちも、よほど愚かでないかぎり、その人が職務を果たしているか、怠けてはいないか、買収に応じはしないか、仕事をする力を欠いてはいないか、注意深く厳しく調べます。任された人の仕事ぶりを判断するために、思慮のある依頼主なら、管理を任せた事業を自分でもよく知っておきます。同じように、自分たちにふさわしい自由を享受したくて代議制を用いる国民は、代表者を活発に、休みなく監視しなければなりません。また、あまり長くない間隔で機会を設け、代表者が期待を裏切れば退け、権限を濫用すれば委任を取り消す権利を自分たちの手に留めておかねばなりません。",

      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 55
        }
      ],
      "source_text": "La liberté individuelle, je le répète, voilà la véritable liberté moderne. La liberté politique en est la garantie; la liberté politique est par conséquent indispensable. Mais demander aux peuples de nos jours de sacrifier comme ceux d'autrefois la totalité de leur liberté individuelle à la liberté politique, c'est le plus sûr moyen de les détacher de l'une et quand on y serait parvenu, on ne tarderait pas à leur ravir l'autre.",
      "translation_ja": "繰り返しますが、個人の自由こそ、近代の本当の自由です。その保障となるのが政治的自由です。だから政治的自由は欠かせません。ところが、昔の民にならって、政治的自由のため個人の自由を残らず犠牲にせよと今の国民に求めるのは、彼らの気持ちを政治的自由から引き離すのに何より確実なやり方です。ひとたびそれに成功すれば、もう一方の自由を奪い取るのにさほど間はかかりません。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0056",
      "section_id": "lecture",
      "kind": "paragraph",
      "origin": "source",
      "source_languages": [
        "fr"
      ],
      "source_locations": [
        {
          "source_id": "augustana-1820",
          "precision": "work",
          "source_sequence": 56
        }
      ],
      "source_text": "Vous voyez, Messieurs, que mes observations ne tendent nullement à diminuer le prix de la liberté politique. Je ne tire point des faits que j'ai remis sous vos yeux les conséquences que quelques hommes en tirent. De ce que les anciens ont été libres, et de ce que nous ne pouvons plus être libres comme les anciens, ils en concluent que nous sommes destinés à être esclaves. Ils voudraient constituer le nouvel état social avec un petit nombre d'éléments qu'ils disent seuls appropriés à la situation du monde actuel. Ces éléments sont des préjugés pour effrayer les hommes, de l'égoïsme pour les corrompre, de la frivolité pour les étourdir, des plaisirs grossiers pour les dégrader, du despotisme pour les conduire; et, il le faut bien, des connaissances positives et des sciences exactes pour servir plus adroitement le despotisme. Il serait bizarre que tel fût le résultat de quarante siècles durant lesquels l'espèce humaine a conquis plus de moyens moraux et physiques: je ne puis le penser. Je tire des différences qui nous distinguent de l'antiquité des conséquences tout opposées. Ce n'est point la garantie qu'il faut affaiblir, c'est la jouissance qu'il faut étendre. Ce n'est point a la liberté politique que je veux renoncer; c'est la liberté civile que je réclame, avec d'autres formes de liberté politique. Les gouvernements n'ont pas plus qu'autrefois le droit de s'arroger un pouvoir illégitime. Mais les gouvernements qui partent d'une source légitime ont de moins qu'autrefois le droit d'exercer sur les individus une suprématie arbitraire. Nous possédons encore aujourd'hui les droits que nous eûmes de tout temps, ces droits éternels à consentir les lois, a délibérer sur nos intérêts, à être partie intégrante du corps social dont nous sommes membres. Mais les gouvernements ont de nouveaux devoirs; les progrès de la civilisation, les changements opérés par les siècles, commandent à l'autorité plus de respect pour les habitudes, pour les affections, pour l'indépendance des individus. Elle doit porter sur tous ces objets une main plus prudente et plus légère.",
      "translation_ja": "おわかりのように皆さん、私の考察は、政治的自由の値打ちを少しでも下げようというものではありません。これまで皆さんにお目にかけた事実から、私は一部の論者と同じ結論を引き出すわけではないのです。彼らは、古代人は自由だったのに、私たちはもう古代人と同じようには自由になれない、ゆえに私たちは奴隷になるのが定めだ、といいます。わずかばかりの材料だけで新しい社会を築こうとし、それらだけが今の世界にふさわしいのだといいます。その材料とは、人を怖じけさせるための偏見、堕落させるための利己心、目をくらませるための軽薄さ、品位を落とすための卑しい快楽、指図してやるための専制、そして、なるほどこれはどうしても要りますが、専制にもっと巧みに仕えるための実証的な知識と精密科学です。人類が精神的にも物質的にも、以前より多くの手段を手にした四千年の歴史の帰結がこれだとしたら、何とも奇妙です。私にはそうは思えません。私たちを古代から分ける違いから、私が導く結論は正反対です。保障を弱めるのではなく、享受できるものを広げなければなりません。私が望むのは政治的自由を捨てることではない。異なる形の政治的自由とともに、市民としての私生活の自由を求めているのです。政府は、正当でない権力を自分のものとする権利を、昔も今ももちません。それどころか、正当な根拠から生まれた政府でさえ、個人に対して恣意的な支配力をふるう権利は昔よりなお少ない。法に同意すること、自分たちの利害について審議すること、自分の属する共同体になくてはならない一部であること。いつの世にも私たちがもってきたこれら不変の権利を、私たちは今ももっています。他方、政府には新たな義務があります。文明の進歩と幾世紀もの変化は、人々の習慣、愛情、独立をこれまで以上に尊重するよう公権力に命じています。こうしたものに触れるなら、今まで以上に慎重に、軽く手を添えるのでなければなりません。",
      "translation_status": "reviewed"
    },
    {
      "id": "constant-0057",

      "source_text": "En France, une institution aussi arbitraire que la censure serait à la fois inefficace et intolérable: dans l'état présent de la société, les moeurs se composent de nuances fines, ondoyantes, insaisissables, qui se dénatureraient de mille manières, si l'on tentait de leur donner plus de précision. L'opinion seule peut les atteindre; elle seule peut les juger, parce qu'elle est de même nature. Elle se soulèverait contre toute autorité positive qui voudrait lui donner plus de précision. Si le gouvernement d'un peuple moderne voulait, comme les censeurs de Rome, flétrir un citoyen par une décision discrétionnaire, la nation entière réclamerait contre cet arrêt en ne ratifiant pas les décisions de l'autorité.",
      "translation_ja": "フランスでは、監察ほど恣意的な制度は何の役にも立たないばかりか、耐えがたいものでしょう。今日の社会の風俗は、絶えずゆれ動く、とらえどころのない微妙な陰影で成っています。もっと輪郭をくっきりさせようとすれば、千通りにも本来の姿をゆがめてしまいます。それをとらえ、裁くことができるのは、世論だけです。世論もまた、同じ性質をもつからです。世論にもっときっちりした形を与えようとする公の権力に対しては、世論自身が反発するでしょう。近代の政府がローマの監察官のように、一存で一市民に汚名を着せようとしても、国民全体が当局の決定を追認しないことによって、その裁定に異議を唱えるでしょう。",

        original_unit_id: gz-c07-021-print
    translation_status: reviewed
    translation_ja: それでも、家族の精神も政治の精神も、それだけではこの仕事を果たせない。もっと高く、人の魂のさらに深いところに届く、別の精神を助けとする必要がある。宗教の精神の助けである。宗教だけに備わる特徴は、すべての人に語りかけ、どの人にも話を聞いてもらうものを持つことだ。偉い人にも身分の低い人にも、幸せな人にも不幸な人にも、社会のどんな階層にも、どの分野にも、苦もなく上がり、降りていく。キリスト教の組織のすばらしい特徴の一つは、聖職者が社会全体に広がり、そこに住んでいることだ。わら屋根の家のそばにも宮殿のそばにも暮らし、最もつつましい境遇の人とも、最上の境遇の人とも、日ごろから親しく接し、貧苦にある者にも栄華にある者にも、助言し、慰める。その力と広がりそのものが原因になって、濫用と過ちを犯したことはある。それでもこの守りの力は、何世紀ものあいだ、人間の道徳的な尊厳と、何より大事な人類の利益のために、他のどんな力にもまして見守り、はたらいてきた。宗教そのもののためにも、かつて宗教をゆがめ、その立場を危うくした濫用がよみがえることを、誰にもまして望まない。だが正直に言えば、今はほとんどそれを恐れていない。宗教から独立した政府と、人間の思想の自由という原則は、近代社会において決定的に勝った。今も退けるべき敵があり、耐えるべき闘いがあって、これからも続くだろう。だが、勝利は確かだ。制度も風習も、その時代の強い情念も、彼らの味方である。考えと事実の、社会全体を支配する流れも彼らの味方だ。さまざまな違い、障害、危険を乗り越え、ロンドンやパリでも、ローマ、マドリード、トリノ、ベルリン、ウィーンでも、いたるところで同じ向きへ進み、突き進んでいる。近代社会は、宗教を恐れてはならず、その自然な影響力を、むきになって争うべきではない。それは子どもじみた怖がり方であり、重大な誤りだ。あなたがたの前には、途方もなく大きく、熱を帯びた大衆がいる。あなたがたは、大衆にはたらきかけ、啓発し、導き、抑え、落ち着かせる手段が足りないと嘆く。徴税官と憲兵を通じてしかほとんど接することがなく、大衆は、いかさま師や扇動者のうそとあおりにも、自分たちの情念の盲目さと激しさにも、無防備のままさらされていると嘆く。ところが、その大衆の中のいたるところに、まさに人々の信仰を導き、貧苦を慰め、義務を教え、希望を開くことを使命とし、たえず自分の仕事としている人々がいる。ほかではもう見つからない道徳のはたらきかけを、その人たちは大衆にしている。それでもあなたがたは、その影響力を快く受け入れないのか。その人たちの仕事に、急いで力を貸そうとしないのか。あなたがたがほとんど入っていけず、あなたがたの敵、社会秩序の敵が入り込んで絶えず土台を切り崩す、まさにその場所で、あなたがたの仕事を強く支えうる人たちだというのに。
  - id: gz-c07-022
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: 'J''en conviens: une condition est attachée au bon vouloir et à l''efficacité politique de l''esprit religieux; il veut du respect, du respect vrai, et de la liberté. Je reconnaîtrai même que, dans ses craintes et dans ses désirs, il est quelquefois ombrageux, susceptible, exigeant; qu''il tombe même quelquefois dans le courant des idées fausses, qu''il a mission de combattre. Je ferai, aussi largement qu''on le voudra, la part des injustices à subir, des précautions à prendre, et je dirai après comme auparavant: Ne disputez pas aigrement avec la religion; ne redoutez pas les influences religieuses, les libertés religieuses; laissez-les s''exercer et se déployer grandement, puissamment; elles vous apporteront en définitive plus de paix que de lutte, plus de secours que d''embarras.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n154/mode/1up
        source_sequence: 230
        printed_page: '147'
        printed_page_end: '148'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-022-print
    translation_status: reviewed
    translation_ja: たしかに、宗教の精神が好意をもって協力し、政治のうえでも実効を上げるには、一つ条件がある。宗教の精神は敬意、本当の敬意と、自由を求める。恐れや願いがあるとき、疑い深くなり、傷つきやすくなり、多くを求めすぎることがあるのも認めよう。闘うべき、誤った考えの流れに入り込むことさえある。甘受すべき不正と、必要な用心を、望むだけたくさん認めたうえで、それでも私は、今までと同じように言う。宗教とむきになって争わないでほしい。宗教の影響も自由も恐れないでほしい。それらが大きく、力強くはたらき、広がるままにしてほしい。最後には、闘いより平和を、厄介ごとより助けを、多くもたらすだろう。
  - id: gz-c07-023
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Un jour, quand nous serons près de la nécessité d'agir, lumière indispensable à qui veut faire plus que poser les principes d'action, il y aura à rechercher par quels moyens pratiques l'esprit de famille, l'esprit politique et l'esprit religieux peuvent être convenablement affermis et développés dans notre pays. Aujourd'hui, je n'ajoute qu'un mot. On ne traite pas avec les grandes puissances morales comme avec des auxiliaires soldés et suspects; elles existent par elles-mêmes, avec leurs mérites et leurs défauts naturels, avec leurs bienfaits et leurs dangers. Il faut les accepter telles qu'elles sont, sans s'y asservir, mais sans prétendre se les asservir, sans leur livrer toutes choses, mais sans leur marchander incessamment leur part. L'esprit religieux, l'esprit de famille, l'esprit politique sont, plus que jamais, dans notre société, des esprits nécessaires et tutélaires. Ni la paix sociale, ni la stabilité, ni la liberté ne peuvent se passer de leur concours. Recherchez ce concours avec sincérité; recevez-le de bonne grâce, et résignez-vous à en payer le prix. Pas plus que les individus, les sociétés ne sont affranchies d'effort et de sacrifice pour les biens dont il leur est donné de jouir.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n155/mode/1up
        source_sequence: 231
        printed_page: '148'
        printed_page_end: '149'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-023-print
    translation_status: reviewed
    translation_ja: いずれ、行動する必要が差し迫る日が来る。行動の原則を示すだけでなく、その先まで行くには、その切迫が、なくてはならない手がかりとなる。そのときには、家族の精神、政治の精神、宗教の精神をわが国でしっかりと支え、育てるための、実際の手段を探らなくてはならない。今日は一言だけ加えよう。大きな道徳の力を、金で雇った、信用できない援軍のように扱ってはならない。それぞれの長所と生来の欠点、恩恵と危険を伴いながら、おのずから存在するものなのだ。あるがままに受け入れなければならない。それに従属してはならないが、それを従属させようとしてもいけない。何もかも渡さなくてもよいが、その取り分を絶えず渋ってもならない。宗教の精神と家族の精神と政治の精神は、今こそわれわれの社会に欠かせない、社会を守る精神である。社会の平和も、安定も、自由も、協力なしには得られない。誠実にその協力を求め、快く受け入れ、その代償を払うことを覚悟してほしい。社会も一人ひとりの人間も、享受できる恵みのために、努力と犠牲を免れるわけではない。

      - source_id: masson-paris-1849
        original_unit_id: gz-c07-019-print
    translation_status: reviewed
    translation_ja: 家族の精神の次には、政治の精神から、フランスは今日、最も多くを期待できる。だから一層大切に育てるべきである。政治の精神の本質は、社会の事柄について、自らも持ち分を引き受け、定められた手続のなかで、暴力を使わずに役割を果たそうと望み、そのやり方を心得ることにある。政治の精神が発達するほど、人間には、物事をあるがままに、正確な姿で見る必要と習慣がしみ込む。事実でなく自分の望むものを見て、事実も同じように都合よく、願いに応じて姿を変えるはずだとばかりに、自分から事実について錯覚することは、政治生活にまだ不慣れな人間や人民の根本の弱さであり、最も有害な誤りの源である。あるものをあるがままに見ることは、政治の精神の第一の、優れた特徴だ。そこから、同じほど優れた、もう一つの特徴が生じる。あるものだけを見ることを学ぶと、可能なことだけを望むことも学ぶ。事実を正確に評価すれば、意図や要求にも節度が生まれる。政治の精神は、自分自身にうそをつかないので、慎重になり、穏健になる。物事の真の姿をよく知ることほど、節度に導くものはない。事実の重みがすべて、天秤の片方の皿だけに載ることはめったにないからだ。こうして政治の精神は、道徳によらずとも分別によって、自然に、その根本の法であり最大の長所である、権利の尊重に至る。これが社会の安定の唯一の土台である。権利の外には力しかなく、力は本来、移ろいやすく不安定だからだ。権利の尊重は、権利のふつうの源である法律の尊重を前提とするか、これを生む。そして法律を尊重すれば、法律をつくり、適用する権力への尊重も強まる。何が現実にあるか、何が可能か、何が権利で、何が法律で、どの権力が合法か。政治の精神が絶えず気にかけ、いつも探し、尊重する習慣を身につけるのは、これらのことだ。こうして、人々の関係を安定させる道徳上の原理と、国家の統治の権威を支える道徳上の原理とを、保つか、取り戻す。
  - id: gz-c07-020
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Plus l'esprit de famille et l'esprit politique grandiront aux dépens de l'égoïsme viager et de l'esprit révolutionnaire, plus la société française se sentira pacifiée et raffermie sur ses fondements.

  - id: gz-c03-001
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Je ne veux parler qu'avec respect du gouvernement républicain. En soi, c'est une noble forme de gouvernement. Elle a suscité de grandes vertus. Elle a présidé à la destinée et à la gloire de grands peuples.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n40/mode/1up
        source_sequence: 45
        printed_page: '33'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-001-print
    translation_status: reviewed
    translation_ja: 共和政の政府について語るとき、私は敬意を失いたくない。それ自体として気高い政体である。大きな徳を呼び起こし、偉大な人民の運命と栄光を導いてきた。
  - id: gz-c03-002
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Mais le gouvernement républicain est chargé de la même mission, tenu aux mêmes devoirs que tout autre gouvernement. Il ne peut réclamer, à cause de son nom, ni dispense, ni privilège. Il faut qu'il satisfasse aux besoins, soit permanents, soit actuels, de la société qu'il est appelé à régir.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n40/mode/1up
        source_sequence: 46
        printed_page: '33'
        printed_page_end: '34'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-002-print
    translation_status: reviewed
    translation_ja: だが共和政の政府にも、どの政府とも同じ使命が課され、同じ義務がある。その名を理由に、義務を免れたり、特権を得たりすることはできない。治めるべき社会にとって、いつの時代にも欠かせないものと、いま必要なものの両方を満たさなければならない。
  - id: gz-c03-003
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Le besoin permanent de toute société, le premier besoin de la France actuelle, c'est le besoin de la paix au sein de la société elle-même.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n41/mode/1up
        source_sequence: 47
        printed_page: '34'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-003-print
    translation_status: reviewed
    translation_ja: どんな社会にもいつも欠かせないもの、そして今のフランスに何よりも欠かせないものは、社会そのもののうちの平和である。
  - id: gz-c03-004
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: On parle beaucoup d'unité, de fraternité sociale. Mots sublimes qui doivent être des faits et non pas nous faire oublier les faits. Rien ne perd plus certainement les peuples que de se payer de mots et d'apparences.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n41/mode/1up
        source_sequence: 48
        printed_page: '34'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-004-print
    translation_status: reviewed
    translation_ja: 社会の結束と友愛が、盛んに語られる。崇高な言葉である。だが、そういう言葉は事実にならなければならず、事実を忘れさせてはならない。言葉や見せかけに満足することほど、確実に人民を滅ぼすものはない。
  - id: gz-c03-005
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Pendant que les mots d'unité et de fraternité sociale retentissent au milieu de nous, la guerre sociale y retentit aussi, flagrante ou imminente, terrible par les maux qu'elle fait souffrir et par ceux qu'elle fait prévoir.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n41/mode/1up
        source_sequence: 49
        printed_page: '34'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-005-print
    translation_status: reviewed
    translation_ja: われわれの間で社会の結束や友愛という言葉が響きわたるかたわら、社会の戦いもまた響きわたっている。すでにあからさまに現れ、あるいは今にも起きようとしている。それが人々に与えている苦しみも、それが予告する苦しみも、恐ろしい。
  - id: gz-c03-006
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Je ne veux pas appuyer sur cette plaie si douloureuse. Pourtant, il faut qu'on la sente et qu'on la sonde, pour la guérir. C'est une ancienne plaie. La lutte des diverses classes de notre société a rempli notre histoire. La révolution de 1789 en a été la plus générale et la plus puissante explosion. Noblesse et tiers état, aristocratie et démocratie, bourgeois et ouvriers, propriétaires et prolétaires, autant de formes, autant de phases diverses de la lutte sociale qui nous travaille depuis si longtemps. Et c'est au moment où nous nous vantons de toucher à l'apogée de la civilisation, c'est au bruit des plus humaines paroles qui puissent sortir de la bouche des hommes, que cette lutte renaît plus violente, plus farouche que jamais!
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n42/mode/1up
        source_sequence: 50
        printed_page: '35'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-006-print
    translation_status: reviewed
    translation_ja: これほど痛む傷を、わざわざ押したくはない。だが治すには、痛みを感じ、どれほど深いかを調べなければならない。古くからの傷である。わが社会のさまざまな階級の闘いが、わが国の歴史を埋めつくしてきた。一七八九年の革命は、その闘いが最も広く、最も激しく爆発したものだ。貴族と第三身分、貴族勢力と民主勢力、ブルジョワと労働者、所有者と無産者。どれも、長いあいだ私たちを揺さぶってきた社会の闘いの、さまざまな形、さまざまな段階だ。そしてわれわれが、文明の頂点に手が届くと自負するまさにそのとき、人の口から出うる最も人道的な言葉が響くなかで、この闘いはかつてないほど激しく荒々しくよみがえる。
  - id: gz-c03-007
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: C'est un fléau, c'est une honte que notre temps ne peut accepter. La paix intérieure, la paix entre toutes les classes de citoyens, la paix sociale! c'est le besoin suprême de la France, c'est le cri de salut.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n42/mode/1up
        source_sequence: 51
        printed_page: '35'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-007-print
    translation_status: reviewed
    translation_ja: これは災いであり、恥である。われわれの時代はこれを甘受できない。内なる平和を、市民のあらゆる階級のあいだの平和を、社会の平和を。フランスに何より必要なのはそれであり、救いを求める声はそれを叫んでいる。
  - id: gz-c03-008
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: La République démocratique nous la donnera-t-elle?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n43/mode/1up
        source_sequence: 52
        printed_page: '36'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-008-print
    translation_status: reviewed
    translation_ja: 民主共和国は、その平和をもたらすだろうか。
  - id: gz-c03-009
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Elle n'a pas bien débuté à cet égard. A peine née, elle a subi et rendu la guerre civile. C'est pour elle un grand malheur. Les gouvernements ont beaucoup de peine à sortir de ce qui fut leur berceau. La République démocratique y parviendra-t-elle? avec du temps, rétablirait-elle la paix sociale?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n43/mode/1up
        source_sequence: 53
        printed_page: '36'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-009-print
    translation_status: reviewed
    translation_ja: その点で、出だしはよくなかった。生まれたばかりで、内戦に巻き込まれ、自らも戦い返した。共和国にとって大きな不幸だ。どんな政府も、自分が生まれたときの状況から抜け出すには、たいへんな苦労をする。民主共和国は抜け出せるだろうか。時がたてば、社会の平和を取り戻せるのだろうか。
  - id: gz-c03-010
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Un fait me frappe et m'inquiète beaucoup; c'est l'ardeur que la République a mise à se nommer expressément et officiellement démocratique.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n43/mode/1up
        source_sequence: 54
        printed_page: '36'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-010-print
    translation_status: reviewed
    translation_ja: 私の目を引き、たいへん心配させることが一つある。共和国がわざわざ、しかも公式に、民主的と名乗ろうとしたあの熱意である。
  - id: gz-c03-011
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: 'Les États-Unis d''Amérique sont, dans le monde, le modèle de la république et de la démocratie. Ont-ils jamais songé à s''intituler: République démocratique?'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n43/mode/1up
        source_sequence: 55
        printed_page: '36'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-011-print
    translation_status: reviewed
    translation_ja: アメリカ合衆国は、世界で共和政と民主主義の手本である。自らを「民主共和国」と名乗ろうと思ったことが、一度でもあっただろうか。
  - id: gz-c03-012
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Je ne m'étonne point qu'ils n'y aient pas songé. Il n'y avait chez eux point de lutte entre l'aristocratie et la démocratie, entre une société ancienne aristocratique et une société nouvelle démocratique. Bien loin de là; les chefs de la société des États-Unis, les descendants des premiers colons, la plupart des principaux planteurs dans les campagnes et des principaux négociants dans les villes, l'aristocratie naturelle et nationale du pays, étaient à la tête de la révolution et de la république; ils la voulaient, ils la soutenaient, ils s'y dévouaient avec plus d'énergie et de constance qu'une grande partie du peuple. La conquête de l'indépendance et la fondation de la république n'ont point été, aux États-Unis, l'œuvre et la victoire de certaines classes contre d'autres classes; toutes les classes y ont concouru, sous la conduite des plus élevées, des plus riches, des plus éclairées, qui, plus d'une fois, ont eu grand'peine à rallier les volontés et à soutenir le courage de la population.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n43/mode/1up
        source_sequence: 56
        printed_page: '36'
        printed_page_end: '37'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-012-print
    translation_status: reviewed
    translation_ja: そう思わなかったのは不思議ではない。あの国には、貴族勢力と民主勢力の闘いも、古い貴族社会と新しい民主社会の闘いもなかった。全く逆である。最初の入植者の子孫、農村の主だった農園主や都市の主だった商人の大半、つまりあの国で自然に育った、国を代表する上層の人々が、アメリカ社会を率い、革命と共和政の先頭に立っていた。彼らこそそれを望み、支え、民衆の多くよりも気力と粘りを持って、これに身を捧げた。アメリカでは、独立を勝ち取り共和国を建てることは、特定の階級が他の階級に対して成し遂げ、勝ち取ったものではなかった。あらゆる階級が、最も地位が高く、最も富み、最も知識のある階級に導かれて力を合わせた。その指導層は、住民の意志を一つにまとめ、勇気を支えるため、何度も大変な苦労をしたのである。
  - id: gz-c03-013
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: 'Quand il y avait des officiers à choisir pour les corps de troupes qui se formaient dans les divers États, Washington adressait partout cette recommandation: « Prenez des gentlemen; ce sont les plus sûrs, comme les plus capables. »'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n45/mode/1up
        source_sequence: 57
        printed_page: '38'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-013-print
    translation_status: reviewed
    translation_ja: 各州で編成される部隊の将校を選ぶ必要があるとき、ワシントンは、どこにでもこう勧めた。「紳士を選びなさい。彼らが最も頼もしく、また最も有能だ。」
  - id: gz-c03-014
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Plus qu'aucun autre, le gouvernement républicain a besoin du concours de toutes les classes de citoyens. Si la masse de la population ne l'adopte pas chaudement, il est sans racines; si les classes élevées le repoussent ou le délaissent, il est sans repos. Et dans l'un et l'autre cas, pour vivre, il est réduit à opprimer. Précisément parce que, dans l'ordre politique, les pouvoirs républicains sont faibles et précaires, il faut qu'ils puisent, dans les dispositions de l'ordre social, beaucoup de force morale. Quelles sont les républiques qui ont longtemps et honorablement vécu, résistant aux défauts et aux orages naturels de leurs institutions? Celles-là seules chez qui l'esprit républicain a été vrai et général; qui ont obtenu à la fois, d'une part, le dévouement et la confiance du peuple, de l'autre, l'appui décidé des classes qui, par leur situation acquise, par leur fortune, par leur éducation, par leurs habitudes, apportent dans les affaires publiques le plus d'autorité naturelle, d'indépendance tranquille, de lumières et de loisir. A ces conditions seulement la République s'établit et dure, car à ces conditions seulement elle gouverne sans troubler la paix sociale, et sans condamner le pouvoir à la déplorable alternative d'être désorganisé par l'anarchie ou tendu jusqu'à la tyrannie.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n45/mode/1up
        source_sequence: 58
        printed_page: '38'
        printed_page_end: '39'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-014-print
    translation_status: reviewed
    translation_ja: 共和政の政府は、ほかのどんな政府よりも、市民のあらゆる階級の協力を必要とする。住民の大多数が心から受け入れなければ、政府は根を張れない。上層の階級が拒んだり見捨てたりすれば、政府に安らぎはない。どちらの場合にも、生き延びるためには、圧制に訴えるほかなくなる。政治の秩序において共和政の権力は弱く、不安定だからこそ、社会の秩序が備えているものから、大きな精神的な力をくみ取らなければならない。制度におのずとつきまとう欠点と嵐に耐え、長く名誉ある存続を遂げた共和国はどれだったか。共和政の精神が本物で、社会に広く行き渡っていた国だけである。一方で人民の献身と信頼を得、他方で、すでに得た地位、財産、教育、習慣ゆえに、公の事柄に、人が自然に認める権威、動じない独立心、知識とゆとりを最も多く持ち込める階級の、断固とした支持を得た国だけである。共和国が根を下ろし長続きするのは、この条件を満たしたときだけだ。それでこそ社会の平和を乱さずに治められ、権力は、無政府状態にばらばらにされるか、圧制にまで強められるかという、嘆かわしい二者択一に追い込まれずにすむ。
  - id: gz-c03-015
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: 'Les États-Unis d''Amérique ont eu ce bonheur. Il manque à la République française. Elle en convient; que dis-je! elle le proclame, elle en fait gloire. Que veulent dire aujourd''hui, parmi nous, ces mots République démocratique invoqués, adoptés comme le nom officiel, comme le symbole du gouvernement? C''est l''écho d''un ancien cri de guerre sociale: cri qui s''élève et se répète, de nos jours, à tous les étages de la société; prononcé avec colère contre certaines classes par d''autres classes qui, à leur tour, l''entendent avec effroi retentir contre elles-mêmes. Démocrates au-dessus, Aristocrates au-dessous. Tour à tour menaçants et menacés, envieux et enviés. Continuels et choquants changements de rôle, d''attitude, de langage. Déplorable confusion d''idées et de sentiments contraires. La guerre dans le chaos.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n46/mode/1up
        source_sequence: 59
        printed_page: '39'
        printed_page_end: '40'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-015-print
    translation_status: reviewed
    translation_ja: アメリカ合衆国はこの幸運に恵まれた。フランス共和国は恵まれていない。共和国自身がそれを認めている。いや、それどころか、公言し、誇っている。今日のわれわれが唱え、政府の公式の名、政府を象徴する言葉として採り入れた「民主共和国」とは、何を意味するのか。社会の戦いを告げた、古い叫びのこだまである。その叫びは今日、社会のいたるところで上がり、繰り返される。ある階級が別の階級に向けて怒りをこめて発すれば、今度は自分たちに向かって響くのを、恐れながら聞く。上の者に向かっては民主派、下の者に向かっては貴族派。交互に脅す側となり、脅される側となり、ねたむ側となり、ねたまれる側となる。役割も態度も言葉も、絶えず、目にあまるほど入れ替わる。相反する考えと感情が、嘆かわしく混ざり合う。混沌のなかの戦争である。
  - id: gz-c03-016
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: 'J''entends la réponse: « Cette guerre a été un fait, le fait dominant de notre histoire, de notre société, de notre révolution. On ne cache point, on ne tait point des faits pareils. Celui-ci a enfin trouvé son terme et sa loi. Ce n''est point la guerre que nous proclamons en nous intitulant République démocratique; c''est la victoire, la victoire de la démocratie. La démocratie a vaincu; elle reste seule sur le champ de bataille; elle lève sa visière; elle se nomme et prend possession de sa conquête. »'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n47/mode/1up
        source_sequence: 60
        printed_page: '40'
        printed_page_end: '41'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-016-print
    translation_status: reviewed
    translation_ja: こんな答えが聞こえる。「この戦いは事実であった。われわれの歴史を、社会を、革命を支配した事実である。そういう事実は隠せないし、黙って済ませることもできない。ついにこの戦いには終わりが来て、決着がついた。民主共和国を名乗ることでわれわれが告げているのは、戦いではなく、勝利、民主主義の勝利である。民主主義は勝った。戦場にただ一人残り、兜の面を上げ、名を名乗って、勝ち取ったものを手にするのだ。」
  - id: gz-c03-017
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Illusion ou hypocrisie! savez-vous comment un gouvernement, démocratique ou autre, proclame et prouve sa victoire quand elle est réelle et définitive? En rétablissant la paix. A ce signe seul, vous aurez vaincu. Est-ce que la paix règne en France? Est-ce qu'elle s'approche? Est-ce que les divers éléments de la société, de gré ou de force, satisfaits ou résignés, croient vraiment à la paix, et viennent se calmer et se ranger sous la main de la République démocratique? Entendez les interprétations qui se donnent, les commentaires qui s'élèvent de toutes parts sur ces mots dont vous avez fait le drapeau du gouvernement républicain; voyez les faits qui éclatent ou qui grondent partout, à la suite de ces commentaires. Est-ce là de la paix? Y a-t-il là, je ne dis pas même la réalité, mais seulement l'apparence d'une de ces victoires fortes et sages qui compriment, du moins pour un temps, les luttes sociales, et assurent aux nations une longue trêve?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n48/mode/1up
        source_sequence: 61
        printed_page: '41'
        printed_page_end: '42'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-017-print
    translation_status: reviewed
    translation_ja: 思い込みか、偽善か。民主的であれ何であれ、政府の勝利が本物で決定的なとき、政府はどうやって勝利を宣言し、証明するか、ご存じだろうか。平和を取り戻すことによってである。それだけが勝利のしるしだ。いまフランスには平和があるか。平和は近づいているか。社会をつくるさまざまな勢力は、自ら望むにせよ、強いられるにせよ、納得してでも、あきらめてでも、ほんとうに平和を信じ、民主共和国のもとで落ち着き、その手に身を委ねようとしているか。あなたがたが共和政府の旗印としたこの言葉に、方々でどんな解釈が与えられ、どんな声が上がっているか、聞いてみるがよい。そのあとで、どこでも何が起き、何が起ころうとしているか、見てほしい。これが平和なのだろうか。しばらくのあいだでも社会の闘いを抑え、諸国民に長い休戦を保障する、力と知恵のある勝利がいくつかあるが、これがそういう勝利の実体、いや、ほんの見かけだけでも持っているだろうか。
  - id: gz-c03-018
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Il y a des faits si immenses, si éclatants qu'aucun pouvoir ni aucun mensonge humain n'est en état de les cacher. Dites, tant qu'il vous plaira, que le jour de la fraternité est venu, que la démocratie, telle que vous l'établissez, met un terme à toute hostilité, à toute lutte de classes, assimile et unit tous les citoyens. La vérité, la vérité terrible, luit au-dessus de ces vaines paroles. Partout les intérêts, les passions, les prétentions, les situations, les classes diverses sont aux prises, avec tout l'emportement d'espérances ou de craintes sans limites. C'est évidemment dans le chaos de la guerre sociale que la République démocratique, dès ses premiers pas, par ses premiers actes, est près de se plonger et de nous plonger.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n49/mode/1up
        source_sequence: 62
        printed_page: '42'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-018-print
    translation_status: reviewed
    translation_ja: あまりにも大きく、あまりにもはっきりしていて、人間のどんな力にも、どんなうそにも隠せない事実がある。友愛の日が来た、あなたがたが打ち立てる民主主義はあらゆる敵意、階級間のあらゆる闘いに終止符を打ち、市民をみな同じ仲間として一つにする、と好きなだけ言うがよい。そのむなしい言葉の上に、真実、恐るべき真実が光っている。どこでもさまざまな利害、情念、要求、境遇、階級が、際限のない希望や恐怖に駆られてぶつかり合っている。民主共和国は、歩み始めて早々、最初にしたことによって、自分自身を、そしてわれわれを、社会の戦いの混沌へ投げ込もうとしている。それは明らかである。
  - id: gz-c03-019
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Nous donne-t-elle du moins des armes pour nous en défendre? Nous ouvre-t-elle des issues pour en sortir?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n49/mode/1up
        source_sequence: 63
        printed_page: '42'
        printed_page_end: '43'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-019-print
    translation_status: reviewed
    translation_ja: せめてそれから身を守る武器を与えてくれるだろうか。そこから抜け出す道を開いてくれるだろうか。
  - id: gz-c03-020
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Je vais au delà de son nom. Je regarde aux idées politiques qu'elle proclame et qu'elle rédige en lois de l'État. Mon inquiétude, loin de diminuer, s'accroît. De même que, sur le drapeau de la République démocratique, j'ai retrouvé la guerre sociale, de même, dans sa constitution, je retrouve le despotisme révolutionnaire. Point de pouvoirs distincts et assez forts par eux-mêmes pour se contrôler et se contenir réciproquement. Point de solides remparts à l'abri desquels les droits et les intérêts divers se puissent établir. Nulle organisation de garanties, nul contre-poids de forces au centre de l'État et au sommet du gouvernement. Rien qu'un moteur et des rouages, un maître et des agents. Partout les libertés individuelles des citoyens seules en présence de la volonté unique de la majorité numérique de la nation. Partout le principe du despotisme en face du droit de l'insurrection.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n50/mode/1up
        source_sequence: 64
        printed_page: '43'
        printed_page_end: '44'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-020-print
    translation_status: reviewed
    translation_ja: 名だけでなく、その中身を見よう。共和国が掲げ、国の法律に書き込んだ政治の考えを見る。不安は減るどころか、ますます大きくなる。民主共和国の旗に社会の戦いを見いだしたのと同じく、その憲法には革命の専制が見つかる。互いに監視し抑え合えるだけの、自前の力を持つ別々の権力はない。多様な権利と利害がその陰に身を置き、確立できるような堅固なとりではない。国家の中心、政府の頂点には、保障の仕組みも、釣り合いを取る力もない。一つの原動力と歯車、一人の主人と手先があるだけだ。いたるところで、市民一人ひとりの自由は、国民のうちで数にまさる者たちの一つの意志に、単独で向き合っている。いたるところで、専制の原理が、反乱を起こす権利と向かい合っている。
  - id: gz-c03-021
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Telle est, dans l'ordre social, la position que prend la République démocratique; tel, dans l'ordre politique, le gouvernement qu'elle construit.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n51/mode/1up
        source_sequence: 65
        printed_page: '44'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-021-print
    translation_status: reviewed
    translation_ja: 社会の秩序のなかで民主共和国が取る立場は、こういうものだ。政治の秩序のなかで築く政府は、こういうものだ。
  - id: gz-c03-022
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Que peut-il sortir de là?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n51/mode/1up
        source_sequence: 66
        printed_page: '44'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-022-print
    translation_status: reviewed
    translation_ja: そこから何が生まれうるだろう。
  - id: gz-c03-023
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Certainement ni la paix, ni la liberté.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n51/mode/1up
        source_sequence: 67
        printed_page: '44'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-023-print
    translation_status: reviewed
    translation_ja: 確かに平和でも、自由でもない。
  - id: gz-c03-024
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: 'Quand la République a été proclamée, au milieu de l''inquiétude générale et profonde, un sentiment s''est manifesté: « Attendons. Peut-être la République sera autre qu''elle n''a été. Que l''expérience se fasse; qu''elle ne soit point troublée par la violence. Nous verrons. » Ainsi ont pensé de bons citoyens.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n51/mode/1up
        source_sequence: 68
        printed_page: '44'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-024-print
    translation_status: reviewed
    translation_ja: 共和国が宣言されたとき、広く深い不安のなかで、一つの気持ちが現れた。「待とうではないか。共和国は昔とは違うかもしれない。試みに機会を与えよう。暴力がそれを妨げてはならない。どうなるか見よう。」立派な市民たちはこう考えた。
  - id: gz-c03-025
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Ils ont tenu parole. De leur part du moins, aucun trouble n'a ébranlé la République; aucun obstacle ne lui a été suscité.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n51/mode/1up
        source_sequence: 69
        printed_page: '44'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-025-print
    translation_status: reviewed
    translation_ja: 彼らは言葉を守った。少なくとも彼らの側から、共和国を揺るがす騒ぎは一つも起きなかったし、共和国の行く手に障害を置くこともなかった。
  - id: gz-c03-026
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: La même idée a prévalu en Europe. Par sagesse sans doute, non par aucun espoir bienveillant. Mais peu importent les motifs de l'Europe; son attitude est calme; aucun acte, aucun danger venu du dehors ne trouble la République française dans son essai d'établissement.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n52/mode/1up
        source_sequence: 70
        printed_page: '45'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-026-print
    translation_status: reviewed
    translation_ja: 同じ考えがヨーロッパでも広く受け入れられた。好意からの期待ではなく、おそらく賢明な判断からだろう。だが、ヨーロッパが何を考えているかはどうでもよい。その態度は穏やかで、外からのどんな行動も、どんな危険も、根を下ろそうとするフランス共和国を妨げていない。
  - id: gz-c03-027
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: 'De son côté, c''est justice de le reconnaître, la République a fait des efforts pour être autre que ne le craint le sentiment public. Elle a respecté la foi des hommes. Elle a défendu, à la dernière heure, il est vrai, mais enfin elle a défendu la vie de la société. Elle n''a pas rompu la paix européenne. Elle n''a pas renoncé à la probité publique. Efforts méritoires qui honorent des hommes et attestent l''instinct général du pays. Efforts impuissants qui ralentissent, mais qui n''arrêtent point le mouvement de l''État sur une pente funeste. Les hommes qui voudraient l''arrêter ne prennent pied nulle part. A chaque instant, à chaque pas, ils glissent, ils descendent. Ils sont dans l''ornière révolutionnaire; ils se débattent pour ne pas s''y enfoncer; mais ils ne savent, ou n''osent, ou ne peuvent en sortir. Un jour, quand on y regardera librement et sérieusement, on sera épouvanté de tout ce qu''ils ont livré ou perdu, et du peu d''effet de leur résistance. Il est vrai: la République ne fait pas tout ce qu''elle a fait jadis; mais elle n''est point autre qu''elle n''a été. Qu''il s''agisse d''organisation sociale ou d''institutions politiques, des conditions de l''ordre ou des garanties de la liberté, elle ne sait pas mieux ni autre chose que ce qu''elle savait il y a cinquante ans. Ce sont les mêmes idées, les mêmes tentatives, souvent les mêmes formes, les mêmes paroles. Spectacle étrange! la République se redoute elle-même et voudrait se transformer; elle ne sait que se copier.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n52/mode/1up
        source_sequence: 71
        printed_page: '45'
        printed_page_end: '46'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-027-print
    translation_status: reviewed
    translation_ja: 共和国自身も、世間が恐れるようなものにならないよう、努力した。それは公正に認めなければならない。人々の信仰を尊重した。土壇場ではあったが、ともかく社会の命を守った。ヨーロッパの平和を破らず、公の誠実さも捨てなかった。これらは、取り組んだ人々の名誉となり、国全体の健全な直感を示す、立派な努力である。だがその努力には力がなく、国が破滅につながる坂を下る動きを遅らせはしても、止められない。止めたい人たちは、どこにも足場を見つけられない。一瞬ごとに、一歩ごとに、足を滑らせ、下に落ちていく。彼らは革命が残したわだちの中にいる。沈み込むまいともがいてはいるが、抜け出す方法を知らないか、抜け出す勇気がないか、抜け出す力がないかである。いつか自由に、真剣にこのことを調べるとき、彼らが明け渡し、失ったものの多さと、抵抗の効果の乏しさに、人々はぞっとするだろう。確かに、共和国が昔したことを、今もすべてしているわけではない。だが、昔と別のものでもない。社会をどう組織するか、どういう政治制度をつくるか、秩序に何が要るか、自由をどう保障するか。そのどれについても、五十年前に知っていたよりよいことも、何か別のことも知らない。同じ考え、同じ試み、しばしば同じ形、同じ言葉である。奇妙な光景だ。共和国は自分自身を恐れて、生まれ変わりたいと思いながら、自分をまねることしかできない。
  - id: gz-c03-028
    section_id: gz-c03
    kind: paragraph
    origin: source
    source_text: Combien de temps, pour réussir ou pour échouer, durera encore l'épreuve? Nul ne le sait. Mais jusqu'ici la France a évidemment droit de craindre que ses intérêts suprêmes, la paix sociale et la liberté politique, ne soient mis, ou laissés, par la République démocratique, dans un immense péril.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n53/mode/1up
        source_sequence: 72
        printed_page: '46'
        printed_page_end: '47'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c03-028-print
    translation_status: reviewed
    translation_ja: 成功するにせよ失敗するにせよ、この試みはあとどれだけ続くのか。誰にもわからない。しかし今までのところ、フランスの最も大事な利益である社会の平和と政治の自由が、民主共和国によって大変な危険に投げ込まれるか、そこに置き去りにされるのではないかと、フランスが恐れるのは、明らかにもっともなことだ。
  - id: gz-c04-heading
    section_id: gz-c04
    kind: heading
    origin: source
    source_text: CHAPITRE QUATRIÈME.
    source_languages:
      - fr
    source_locations:

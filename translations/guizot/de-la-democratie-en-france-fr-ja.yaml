  - id: gz-c08-001
    section_id: gz-c08
    kind: paragraph
    origin: source
    source_text: 'Que la France ne se fasse point d''illusion: toutes les expériences qu''elle tentera, toutes les révolutions qu''elle fera, ou qu''elle laissera faire, ne la soustrairont point à ces conditions nécessaires, inévitables, de la paix sociale et du bon gouvernement. Elle peut les méconnaître et souffrir, souffrir sans mesure et sans terme, en les méconnaissant; elle ne peut les abolir.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n160/mode/1up
        source_sequence: 234
        printed_page: '153'
        printed_page_end: '154'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c08-001-print
    translation_status: reviewed
    translation_ja: フランスは思い違いをしてはならない。どんな試みをし、どんな革命を起こし、あるいは起こるままにしても、社会の平和とよい統治のために必要な、避けがたいこれらの条件からは、逃れられない。その条件を無視することはできる。そして、無視して、際限も終わりもない苦しみを味わうことはできる。だが、条件を廃止することはできない。
  - id: gz-c08-002
    section_id: gz-c08
    kind: paragraph
    origin: source
    source_text: Nous avons essayé de toutes choses, de la république, de l'empire, de la monarchie constitutionnelle. Nous recommençons nos essais. A quoi nous en prendre de leur mauvais sort? De nos jours, sous nos yeux, dans trois des plus grands États du monde, ces trois mêmes gouvernements, la monarchie constitutionnelle en Angleterre, l'empire en Russie, la république dans l'Amérique du Nord, durent et prospèrent. Aurions-nous le privilège de toutes les impossibilités?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n161/mode/1up
        source_sequence: 235
        printed_page: '154'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c08-002-print
    translation_status: reviewed
    translation_ja: われわれはあらゆるものを試した。共和政、帝政、立憲王政。そしてまた試し始めている。これらの試みが不運に終わるのは、何のせいなのか。いまこの目の前で、世界でも有数の三つの大国において、まさにこの三つの政府が長く続き、繁栄している。イングランドの立憲王政、ロシアの帝政、北アメリカの共和政だ。何もかもうまくいかない特権でも、われわれだけが持っているのだろうか。
  - id: gz-c08-003
    section_id: gz-c08
    kind: paragraph
    origin: source
    source_text: Oui, tant que nous resterons dans le chaos où nous sommes plongés, au nom et par le culte idolâtre de la démocratie; tant que nous ne verrons dans la société que la démocratie, comme si elle y était seule; tant que nous ne chercherons, dans le gouvernement, que la domination de la démocratie, comme si elle avait seule le droit et le pouvoir de gouverner.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n161/mode/1up
        source_sequence: 236
        printed_page: '154'
        printed_page_end: '155'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c08-003-print
    translation_status: reviewed
    translation_ja: そうである。民主主義の名のもと、その偶像崇拝によって投げ込まれた混沌に、われわれがとどまるかぎりは。社会のなかで、まるでほかに何もないかのように、民主主義しか見なくなるかぎりは。まるで治める権利と力を持つのは民主勢力だけだとでもいうように、政府に民主勢力の支配しか求めないかぎりは。
  - id: gz-c08-004
    section_id: gz-c08
    kind: paragraph
    origin: source
    source_text: A ce prix, la république comme la monarchie constitutionnelle, l'empire comme la république, tout gouvernement régulier et durable est impossible.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n162/mode/1up
        source_sequence: 237
        printed_page: '155'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c08-004-print
    translation_status: reviewed
    translation_ja: このままでは、共和政も立憲王政も、帝政も共和政と同じく、秩序立って長く続く政府は、一つとして成り立たない。
  - id: gz-c08-005
    section_id: gz-c08
    kind: paragraph
    origin: source
    source_text: Et la liberté, la liberté légale et forte, est aussi impossible que le gouvernement durable et régulier.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n162/mode/1up
        source_sequence: 238
        printed_page: '155'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c08-005-print
    translation_status: reviewed
    translation_ja: そして自由も、法律によって守られ、力のある自由も、秩序立って長く続く政府と同じく、成り立たない。
  - id: gz-c08-006
    section_id: gz-c08
    kind: paragraph
    origin: source
    source_text: Le monde a vu des sociétés, de grandes sociétés, réduites à cette condition déplorable; incapables de supporter toute liberté légale et forte, tout gouvernement régulier et durable; condamnées à d'interminables et stériles oscillations politiques; tantôt telle ou telle forme d'anarchie, tantôt telle ou telle forme de despotisme. Je ne conçois pas, pour les cœurs un peu fiers, une plus douloureuse destinée que d'appartenir à de tels temps. Il ne reste plus alors qu'à s'enfermer dans les soins de la vie domestique et dans les perspectives de la vie religieuse. Les joies et les sacrifices, les travaux et les gloires de la vie publique n'existent plus.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n162/mode/1up
        source_sequence: 239
        printed_page: '155'
        printed_page_end: '156'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c08-006-print
    translation_status: reviewed
    translation_ja: 世界は、こうした嘆かわしい状態に陥った社会を、大きな社会をいくつも見てきた。法律によって守られる力のある自由にも、秩序立って長く続く政府にも耐えられず、終わりのない不毛な政治の揺れにさらされ、あるときはこの形あの形の無政府状態に、あるときはこの形あの形の専制に陥る。少しでも誇りのある心の持ち主にとって、そのような時代に属することほど、苦しい運命はないと思う。そのとき残るのは、家庭の仕事と宗教の生が開く展望の中に、身を閉じ込めることだけである。公の生活の喜びと犠牲、労苦と栄光は、もう存在しない。
  - id: gz-c08-007
    section_id: gz-c08
    kind: paragraph
    origin: source
    source_text: 'Tel n''est point, grâce à Dieu, l''état de la France: tel ne sera point le dernier mot de notre longue et glorieuse civilisation, de tant d''efforts, de tant de conquêtes, de tant d''espérances, de tant de souffrances. La société française est pleine de force et de vie. Elle n''a pas fait de si grandes choses pour descendre, au nom de l''égalité, jusqu''au plus bas niveau. Elle possède en elle-même les éléments d''une bonne organisation politique. Elle a des classes nombreuses de citoyens éclairés, considérables, déjà placés ou prompts à s''élever à la hauteur des affaires de leur pays. Son sol est couvert d''une population intelligente et laborieuse qui déteste l''anarchie et ne demande qu''à vivre et à travailler en paix. Les vertus abondent dans les familles et les bons sentiments dans les cœurs. Nous avons de quoi lutter contre le mal qui nous dévore. Mais le mal est immense. Il n''y a point de termes pour le qualifier, point de mesure pour le mesurer. Les souffrances et les hontes qu''il nous inflige sont peu de chose auprès de celles qu''il nous prépare, s''il se prolonge. Et qui dira qu''il ne saurait se prolonger quand toutes les passions des pervers, toutes les folies des insensés, toutes les faiblesses des honnêtes gens concourent à le fomenter? Que toutes les forces saines de la France s''unissent donc pour le combattre. Ce n''est pas trop, et il ne faut pas que ce soit trop tard. Unies dans l''œuvre, elles plieront plus d''une fois sous le fardeau, et la France aura encore besoin que Dieu la protège pour se sauver.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n163/mode/1up
        source_sequence: 240
        printed_page: '156'
        printed_page_end: '157'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c08-007-print
    translation_status: reviewed
    translation_ja: ありがたいことに、フランスはそのような状態にはない。われわれの長く輝かしい文明、数え切れない努力と成果、希望と苦しみが、そんな結末を迎えることはない。フランス社会は力と生命に満ちている。平等の名のもとに一番低いところまで落ちるために、これほど大きなことをしてきたのではない。すぐれた政治の組織に必要な要素は、自らの内に持つ。知識があり、人々に重きを置かれる市民の層が厚い。すでに国の事柄を担える地位にあるか、すぐにそこまで昇れる人々である。全国に、知恵があり、勤勉で、無政府状態を嫌い、平和のうちに暮らして働くことだけを望む人々がいる。家庭には徳が、心には立派な気持ちが、豊かにある。われわれには、自分たちをむしばむ病と闘う力がある。だが病は大きい。言葉では言い尽くせず、程度も測れない。この病が長引くなら、この先もたらす苦しみや恥に比べれば、これまで与えられた苦しみと恥は、わずかなものである。よこしまな者の情念、分別のない者の愚行、善良な者の弱さが、ことごとく一緒になって病を育てるのに、長引くはずはないと誰に言えよう。ならばフランスの健全な力はすべて、手を結び、この病と闘ってほしい。それでやりすぎではない。手遅れにしてはならない。力を合わせて仕事にかかっても、幾度も重荷にひざを屈するだろう。フランスが自らを救うためには、そのうえで、神に守ってもらうことが必要なのである。

  - id: gz-c07-title
    section_id: gz-c07
    kind: heading
    origin: source
    source_text: Conditions morales de la paix sociale en France.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n136/mode/1up
        source_sequence: 208
        printed_page: '129'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-title-print
    translation_status: reviewed
    translation_ja: フランスにおける社会の平和の道徳的条件
  - id: gz-c07-001
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Les conditions politiques que je viens d'indiquer sont indispensables pour rétablir en France la paix sociale; mais elles n'y suffisent point.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n136/mode/1up
        source_sequence: 209
        printed_page: '129'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-001-print
    translation_status: reviewed
    translation_ja: いま示した政治的条件は、フランスに社会の平和を取り戻すのに欠かせない。だが、それだけでは足りない。
  - id: gz-c07-002
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: C'est trop peu, pour une telle œuvre, que la bonne organisation des pouvoirs. Il y faut, de la part des peuples eux-mêmes, une certaine mesure de sagesse et de vertu. On se trompe grossièrement quand on croit à la puissance souveraine de la mécanique politique. La liberté humaine joue un grand rôle dans les affaires sociales, et c'est des hommes que dépend en définitive le succès des institutions.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n136/mode/1up
        source_sequence: 210
        printed_page: '129'
        printed_page_end: '130'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-002-print
    translation_status: reviewed
    translation_ja: このような仕事には、権力をうまく組織するだけではとても足りない。人民自身の側にも、ある程度の知恵と徳がなければならない。政治の仕組みがすべてを決める力を持つと思うのは、大きな誤りだ。社会のことには人間の自由が大きな役割を果たし、突き詰めれば、制度がうまくはたらくかは、人間にかかっている。
  - id: gz-c07-003
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: On parle beaucoup du christianisme et de l'Évangile, on prononce souvent le nom de Jésus-Christ. A Dieu ne plaise que j'arrête longtemps ma pensée sur ces profanations, mélange hideux de cynisme et d'hypocrisie! J'élèverai une seule question. Si la société française était sérieusement, effectivement chrétienne, quel spectacle offrirait-elle aujourd'hui au milieu des cruels problèmes qui la tourmentent?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n137/mode/1up
        source_sequence: 211
        printed_page: '130'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-003-print
    translation_status: reviewed
    translation_ja: キリスト教や福音がよく語られ、イエス・キリストの名がしばしば唱えられる。厚かましさと偽善が醜く混ざりあったこの冒瀆に、私が長く考えをとどめることのないよう、神に願いたい。ただ一つだけ質問しよう。フランス社会が心から、現実にキリスト教の社会であったなら、今日、この社会を苦しめるむごい問題のただなかで、どんな光景が見えるだろうか。
  - id: gz-c07-004
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Les riches, les grands de la terre s'appliqueraient avec dévouement et persévérance à soulager les misères des autres hommes. Leurs relations avec les classes pauvres seraient incessamment actives, affectueuses, moralement et matériellement bienfaisantes; les associations, les fondations, les œuvres de charité iraient luttant partout contre les souffrances et les périls de la condition humaine.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n137/mode/1up
        source_sequence: 212
        printed_page: '130'
        printed_page_end: '131'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-004-print
    translation_status: reviewed
    translation_ja: 富める者、地上で高い地位にある者は、ほかの人々の苦しみをやわらげようと、身を捧げ、根気強く努めるだろう。貧しい階級と絶えず進んで、愛情を持って関わり、精神的にも物質的にも役に立つだろう。さまざまな団体、財団、慈善事業が、いたるところで人間の境遇の苦しみや危険に立ち向かうだろう。
  - id: gz-c07-005
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Les pauvres, de leur côté, les petits de la terre, seraient soumis aux volontés de Dieu et aux lois de la société; ils chercheraient dans le travail régulier et assidu, la satisfaction de leurs besoins; dans une conduite morale et prévoyante, l'amélioration de leur sort; dans l'avenir promis ailleurs à l'homme, leur consolation et leur espoir.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n138/mode/1up
        source_sequence: 213
        printed_page: '131'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-005-print
    translation_status: reviewed
    translation_ja: 一方、貧しい者、地上の小さな者たちは、神の意志と社会の法に従うだろう。規則正しく、まめに働くことに必要を満たす道を、道徳にかなって先を考えて行動することに境遇を良くする道を、この世の先に人間に約束された未来に慰めと希望を、求めるだろう。
  - id: gz-c07-006
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Ce sont là les vertus chrétiennes, elles s'appellent la foi, la charité et l'espérance.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n138/mode/1up
        source_sequence: 214
        printed_page: '131'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-006-print
    translation_status: reviewed
    translation_ja: これがキリスト教の徳であり、信仰、愛、希望という。
  - id: gz-c07-007
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Est-ce à cela qu'on s'adresse? Est-ce là ce qu'on s'efforce de ranimer dans le cœur des peuples?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n138/mode/1up
        source_sequence: 215
        printed_page: '131'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-007-print
    translation_status: reviewed
    translation_ja: 人々が訴えているのは、これなのか。人民の心のうちによみがえらせようとしているのは、これなのか。
  - id: gz-c07-008
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: 'Je doute que, malgré son audace, le mensonge, qui essaie d''exploiter les mots chrétiens, puisse aller jusqu''à dire: Oui. Et s''il l''osait, je suis sûr que, malgré la crédulité publique, il rencontrerait un démenti universel.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n139/mode/1up
        source_sequence: 216
        printed_page: '132'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-008-print
    translation_status: reviewed
    translation_ja: キリスト教の言葉を利用しようとするうそは、いかに大胆であっても、「そうだ」と言うところまで行けるか、私は疑う。あえてそう主張しても、世間がどれほど信じやすかろうと、誰からも否定されることは確かだ。
  - id: gz-c07-009
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: 'Si c''est mensonge, qu''on y renonce; si c''est aveuglement, qu''on se désabuse: le christianisme ne se laissera point ainsi déformer et dégrader; il n''y a rien de plus anti-chrétien que les idées, le langage, l''influence des réformateurs actuels de l''ordre social. Si le communisme et le socialisme prévalaient, la foi chrétienne périrait. Si la foi chrétienne était plus puissante, le communisme et le socialisme ne seraient bientôt plus que d''obscures folies.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n139/mode/1up
        source_sequence: 217
        printed_page: '132'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-009-print
    translation_status: reviewed
    translation_ja: うそなら、やめるがよい。目が曇っているのなら、思い違いを改めるがよい。キリスト教は、そのように姿を変えられ、おとしめられるがままにはならない。今の社会秩序の改革者たちの考え、言葉、影響ほど、キリスト教に逆らうものはない。共産主義と社会主義が勝てば、キリスト教の信仰は滅びる。キリスト教の信仰が今より力強ければ、共産主義と社会主義は、じきに、人目を引かない愚かな考えにすぎなくなる。
  - id: gz-c07-010
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Je veux être pleinement juste, et en attaquant des idées qui sont la honte et le fléau de notre temps, je veux reconnaître ce qu'elles peuvent renfermer de moralement trompeur, et quels prétextes, ou quels instincts honnêtes peuvent égarer ceux qui les soutiennent et ceux qui les accueillent.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n139/mode/1up
        source_sequence: 218
        printed_page: '132'
        printed_page_end: '133'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-010-print
    translation_status: reviewed
    translation_ja: あくまで公正でありたい。われわれの時代の恥であり災いである考えを攻撃すると同時に、その考えの内に、道徳の面で人を惑わす何があるのか、そしてどんな口実や、どんなまっとうな本能が、それを支持する人や受け入れる人を迷わせうるのかも、認めたい。
  - id: gz-c07-011
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Il y a un sentiment, en lui-même noble et beau, qui a joué et qui joue encore aujourd'hui, dans nos sociétés et dans les perturbations auxquelles elles sont en proie, un rôle considérable. Ce sentiment, c'est l'enthousiasme pour l'humanité, l'enthousiasme de la confiance, de la sympathie et de l'espérance.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n140/mode/1up
        source_sequence: 219
        printed_page: '133'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-011-print
    translation_status: reviewed
    translation_ja: それ自体は気高く美しい気持ちが一つあり、これまでにも今も、社会のなかで、また社会を襲う混乱のなかで、大きな役割を果たしてきた。それは人類への熱い思い、信頼と共感と希望に満ちた熱意である。
  - id: gz-c07-012
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Ce sentiment était dominant, souverain chez nous en 1789; il a fait l'irrésistible élan de cette époque. Il n'y avait point de bien qu'on ne pensât de l'humanité, point de succès qu'on ne voulût et qu'on n'espérât pour elle; la foi et l'espérance dans l'homme remplaçaient la foi et l'espérance en Dieu.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n140/mode/1up
        source_sequence: 220
        printed_page: '133'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-012-print
    translation_status: reviewed
    translation_ja: この気持ちが一七八九年のわが国では何よりも強く、すべてを支配していた。この気持ちがあの時代を、抑えようもない力で前へ押し出した。人類についてよいことなら何でも信じ、人類の成功なら何でも望み、何でも期待した。神への信仰と希望は、人間への信仰と希望に取って代わられた。
  - id: gz-c07-013
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: L'épreuve ne s'est pas fait attendre. L'idole n'y a pas longtemps résisté. La confiance a été bientôt convaincue de présomption. La sympathie a abouti à la guerre sociale et à l'échafaud. Les espérances satisfaites ont paru peu de chose comparées à celles qui se sont évanouies comme des chimères. Jamais l'expérience n'est venue si rapide et si grande à la rencontre de l'orgueil.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n140/mode/1up
        source_sequence: 221
        printed_page: '133'
        printed_page_end: '134'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-013-print
    translation_status: reviewed
    translation_ja: 試練はすぐに来た。偶像は長く持ちこたえられなかった。信頼はじきに、思い上がりだったことが明らかになった。共感は社会の戦いと断頭台に行き着いた。かなえられた希望は、空想のように消えた希望に比べて、わずかなものに見えた。これほどすぐに、これほど大きな経験がやって来て、思い上がりとぶつかったことはない。
  - id: gz-c07-014
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: 'C''est pourtant à ce même sentiment que s''adressent aujourd''hui les nouveaux réformateurs de l''ordre social; c''est ce même enthousiasme idolâtre pour l''humanité qu''ils invoquent. En même temps qu''ils enlèvent à l''homme ses plus sublimes élans et ses plus hautes perspectives, ils exaltent sans limites sa nature et sa puissance: ils l''abaissent honteusement, car ils ne lui promettent rien que sur la terre; mais là ils croient aveuglément en lui, ils espèrent tout de lui et pour lui.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n141/mode/1up
        source_sequence: 222
        printed_page: '134'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-014-print
    translation_status: reviewed
    translation_ja: にもかかわらず、今日、社会秩序を新たに改革しようとする者たちが訴えるのは、同じ感情である。引き合いに出すのは、人類を偶像としてあがめる、この同じ熱意だ。人間から、最も崇高な衝動と、最も高い展望を奪う一方で、人間の本性とその力を際限なくほめたたえる。地上で得られるもの以外は何も約束しないという点では、人間を恥ずかしいほどおとしめる。だが地上では、人間を盲目的に信じ、人間にすべてを期待し、人間のためにはすべてを望む。
  - id: gz-c07-015
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Et ce qu'il y a de plus triste à leur dire, c'est que cette idolâtrie insensée est leur seule excuse, la seule de leurs idées qui soit d'une origine un peu haute et garde quelque valeur morale. S'ils n'avaient pas une foi aveugle dans l'homme, s'ils n'étaient pas les serviles adorateurs de l'humanité, ils ne seraient que les propagateurs d'un matérialisme avide, brutal et effréné.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n141/mode/1up
        source_sequence: 223
        printed_page: '134'
        printed_page_end: '135'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-015-print
    translation_status: reviewed
    translation_ja: 彼らにとって最も残念な話は、この正気を失った偶像崇拝が、彼らを弁護できる唯一のものであり、その考えのうち、いくらかなりとも気高いところから出て、道徳上の価値をいくらか残す、ただ一つのものだということだ。もし人間を盲信せず、卑屈なまでに人類をあがめる者でもなければ、貪欲で粗暴で歯止めのない唯物論を広めるだけの人々である。
  - id: gz-c07-016
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: '« Si l''homme se vante, dit Pascal, je l''abaisse; s''il s''abaisse, je le vante: » paroles admirables qu''il faut répéter et pratiquer sans cesse. Certainement l''homme mérite qu''on le respecte et qu''on l''aime, et qu''on espère beaucoup de lui, et qu''on aspire à beaucoup pour lui. A ceux qui méconnaîtraient la grandeur de sa nature et de sa destinée, à lui-même, s''il venait à l''oublier, je dirais avec Pascal: «Si l''homme s''abaisse, je le vante. » Mais à ceux qui encensent l''homme, qui se promettent de lui toutes choses et lui promettent toutes choses à lui-même, qui, poussés par l''orgueil, poussent l''homme dans l''orgueil, oubliant et lui faisant oublier les misères de sa nature, et les lois suprêmes auxquelles il est tenu, et les appuis dont il ne peut se passer, à ceux-là je dis aussi avec Pascal: « Si l''homme se vante, je l''abaisse. » Et les faits, les faits récents, éclatants, irrésistibles, le leur disent bien plus haut que moi.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n142/mode/1up
        source_sequence: 224
        printed_page: '135'
        printed_page_end: '136'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c07-016-print
    translation_status: reviewed
    translation_ja: 「人間が得意になるなら、私はこれを低くする。自らを低くするなら、私はこれをほめる」とパスカルは言う。すばらしい言葉だ。絶えず繰り返し、実践しなければならない。人間はたしかに、尊敬され、愛され、多くを期待され、人々がそのために大きな望みを抱くに値する。人間の本性と運命の大きさを見誤る者に、人間自身がそれを忘れるなら人間自身にも、パスカルとともに言おう。「人間が自らを低くするなら、私はこれをほめる。」しかし人間をむやみにたたえ、人間から得られると自分にあらゆるものを約束し、人間に対してもあらゆるものを約束する者がいる。思い上がりに駆られ、人間をも思い上がらせ、その本性の哀れさと、従うべき最高の法、なしではいられない支えを忘れ、人間にも忘れさせる。その者たちにも、パスカルとともに私は言う。「人間が得意になるなら、私はこれを低くする。」そして事実、ごく最近の、明白で、退けようのない事実が、私よりもずっと大きな声で、それを彼らに語っている。
  - id: gz-c07-017
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: 'On ne ramènera point la France à 1789. On ne la relancera point dans cet enthousiasme de confiance et d''espérance présomptueuse qui la possédait alors. Enthousiasme vrai et général à cette époque, spontané comme la jeunesse, excusable comme l''inexpérience, mais qui ne serait aujourd''hui qu''une excitation factice et fausse, un voile sans consistance jeté sur de mauvaises passions et sur des rêveries insensées qu''il ne couvrirait même pas. Par quelle incurable arrogance repousserions-nous les leçons que Dieu prodigue devant nous depuis soixante ans? Il ne nous demande point de désespérer de nous-mêmes et de l''humanité, de renoncer à ses progrès, à son avenir, à une profonde et tendre sympathie pour elle, pour ses douleurs comme pour ses gloires. Il nous défend d''en faire une idole. Il nous commande de la voir telle qu''elle est, sans adulation comme sans froideur, et de l''aimer et de la servir selon les lois qu''il a lui-même établies. Je n''ai certes nulle envie d''éteindre ce que notre temps conserve de chaleur morale, ni de jeter encore du doute et de l''indifférence dans des cœurs déjà si tièdes et si incertains. Mais qu''on ne s''y trompe point: ce n''est pas en rebroussant chemin vers la révolution que la France marchera confiante et animée; il n''y a là que des sources taries où notre société fatiguée n''ira point se désaltérer et se rafraîchir. Vous vous plaignez de sa langueur; vous voudriez voir renaître dans son sein cette foi, cette énergie morale qui font la grandeur des nations. Ne demandez point cela à l''esprit révolutionnaire; il est incapable de nous le rendre; il a du bruit, non du mouvement à nous offrir. Il peut encore consumer; il n''éclaire et n''échauffe point. Au lieu de ranimer les croyances, il répand le doute et la perplexité. Certainement la France a besoin d''être moralement relevée et raffermie; elle a besoin de reprendre foi et attachement à des principes fixes et généralement avoués. Mais l''esprit révolutionnaire ne peut rien pour une telle œuvre; ses apparitions, ses évocations, ses prédictions, ses souvenirs, son langage l''entravent et la retardent au lieu de l''accomplir. C''est à d''autres puissances morales, à d''autres esprits qu''est réservé cet honneur.'
    source_languages:
      - fr

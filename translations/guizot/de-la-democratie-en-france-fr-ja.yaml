        original_unit_id: gz-c07-020-print
    translation_status: reviewed
    translation_ja: 家族の精神と政治の精神が、自分一代にしか目を向けない利己心と革命の精神を後退させて大きくなるほど、フランス社会は、平和を取り戻し、足元がしっかりしたことを実感するだろう。
  - id: gz-c07-021
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: 'Pourtant, ni l''esprit de famille, ni l''esprit politique ne suffiraient à la tâche. Il leur faut le secours d''un autre esprit plus haut et qui pénètre encore plus avant dans les âmes: le secours de l''esprit religieux. C''est le propre de la religion, et de la religion seule, qu''elle a de quoi parler à tous les hommes et se faire entendre de tous, des grands comme des petits, des heureux comme des malheureux, et qu''elle monte ou descend sans effort dans tous les rangs, dans toutes les régions de la société. Et c''est l''un des traits admirables de l''organisation chrétienne que ses ministres sont répandus et présents dans la société tout entière, vivant à côté des chaumières comme des palais, en contact habituel et intime avec les conditions les plus humbles et avec les plus élevées, conseillers et consolateurs de toutes les misères et de toutes les grandeurs. Puissance tutélaire, qui, malgré les abus et les fautes où sa force même et son étendue l''ont entraînée, a, depuis tant de siècles, veillé et agi plus qu''aucune autre pour la dignité morale et les plus chers intérêts de l''humanité. Moins que personne, je voudrais, pour la cause de la religion elle-même, voir renaître les abus qui l''ont altérée ou compromise; mais j''avoue que je ne le crains guère aujourd''hui. Les principes du gouvernement laïque et de la liberté de la pensée humaine ont définitivement triomphé dans la société moderne. Ils ont encore, ils auront toujours des ennemis à repousser, des luttes à soutenir; mais leur victoire est assurée. Ils ont en leur faveur les institutions, les mœurs, les passions dominantes, et ce cours général et souverain des idées et des faits qui, à travers toutes les diversités, tous les obstacles, tous les périls, marche et se précipite partout dans le même sens, à Rome, à Madrid, à Turin, à Berlin, à Vienne, comme à Londres et à Paris. Que les sociétés modernes ne craignent pas la religion et ne lui disputent pas aigrement son influence naturelle; ce serait une terreur puérile et une funeste erreur. Vous êtes en présence d''une multitude immense, ardente. Vous vous plaignez que les moyens vous manquent pour agir sur elle, pour l''éclairer, la diriger, la contenir, la calmer, que vous n''entrez guère en rapport avec elle que par les percepteurs et les gendarmes, qu''elle est livrée sans défense aux mensonges et aux excitations des charlatans et des démagogues, à l''aveuglement et à l''emportement de ses propres passions. Vous avez partout, au milieu de cette multitude, des hommes qui ont précisément pour mission, pour occupation constante, de la diriger dans ses croyances, de la consoler dans ses misères, de lui inculquer le devoir, de lui ouvrir l''espérance; qui exercent sur elle cette action morale que vous ne trouvez plus ailleurs. Et vous n''accepteriez pas de bonne grâce l''influence de ces hommes! vous ne vous empresseriez pas de les seconder dans leur œuvre, eux qui peuvent vous seconder si puissamment dans la vôtre, précisément là où vous pénétrez si peu, et où vos ennemis, les ennemis de l''ordre social, entrent et sapent incessamment!'
    source_languages:
      - fr

    translation_status: reviewed
    translation_ja: 第四章
  - id: gz-c04-title
    section_id: gz-c04
    kind: heading
    origin: source
    source_text: De la République sociale.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n58/mode/1up
        source_sequence: 74
        printed_page: '51'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-title-print
    translation_status: reviewed
    translation_ja: 社会共和国について
  - id: gz-c04-001
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: La République sociale promet de résoudre le problème.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n58/mode/1up
        source_sequence: 75
        printed_page: '51'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-001-print
    translation_status: reviewed
    translation_ja: 社会共和国は、この問題を解決すると約束する。
  - id: gz-c04-002
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: « Tous les systèmes, tous les gouvernements ont été tentés, dit-elle, et reconnus impuissants. Mes idées seules sont nouvelles et n'ont pas encore été mises à l'épreuve. Mon jour est venu. »
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n58/mode/1up
        source_sequence: 76
        printed_page: '51'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-002-print
    translation_status: reviewed
    translation_ja: 「あらゆる制度、あらゆる政府が試され、どれも無力だとわかった」と社会共和国は言う。「私の考えだけが新しく、まだ試されていない。私の時が来たのだ。」
  - id: gz-c04-003
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Les idées de la République sociale ne sont point nouvelles. Le monde les connaît depuis qu'il existe. Il les a vues surgir au milieu de toutes les grandes crises morales et sociales, en Orient comme en Occident, dans l'antiquité comme dans les temps modernes. Les deuxième et troisième siècles en Afrique et spécialement en Egypte, pendant le travail de la propagation du christianisme, le moyen âge dans sa fermentation confuse et orageuse, le seizième siècle, en Allemagne, dans le cours de la réforme religieuse, le dix-septième, en Angleterre, au milieu de la révolution politique, ont eu leurs socialistes et leurs communistes, pensant, parlant et agissant comme ceux de nos jours. C'est une face de l'humanité qui apparaît, dans son histoire, à toutes ces époques où, par le bouillonnement universel, toutes choses sont poussées à la surface et admises à se montrer.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n59/mode/1up
        source_sequence: 77
        printed_page: '52'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-003-print
    translation_status: reviewed
    translation_ja: 社会共和国の考えは、新しくなどない。世界は、世界が生まれたときからそれを知っている。東洋でも西洋でも、古代でも近代でも、精神と社会の大きな危機には必ずその考えが現れた。キリスト教が広がっていった二世紀、三世紀のアフリカ、とりわけエジプト。入り乱れ、荒々しく沸き立った中世。宗教改革のさなかの十六世紀ドイツ、政治革命のさなかの十七世紀イングランド。それぞれに、今日の社会主義者や共産主義者と同じように考え、語り、行動する者がいた。それは、何もかもが一斉に沸き立ち、あらゆるものが表へと押し上げられて、姿を見せることを許される時代に、そのつど歴史に現れてきた、人類の一つの顔なのである。
  - id: gz-c04-004
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: 'Jusqu''ici, il est vrai, ces idées ne s''étaient produites que sur une petite échelle, obscurément, honteusement, presque aussitôt repoussées qu''entrevues. Aujourd''hui, elles montent hardiment sur la grande scène, et se déploient avec toutes leurs prétentions devant tout le public. Que ceci arrive par l''effet de leur propre force, ou par la faute du public lui-même, ou par des causes inhérentes à l''état actuel de la société, peu importe: puisque la République sociale parle haut, il faut qu''elle soit regardée en face et interrogée à fond.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n59/mode/1up
        source_sequence: 78
        printed_page: '52'
        printed_page_end: '53'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-004-print
    translation_status: reviewed
    translation_ja: 確かにこれまで、こうした考えは、小さな規模で、世に知られず、恥じるかのように現れた。それも、姿がちらりと見えたかと思うと、ほとんどすぐに退けられてきた。今日では、臆せず大舞台に上がり、あらゆる要求を観衆の前に広げてみせる。それが考えそのものの力によるのか、世間の側の落ち度によるのか、それとも今日の社会に固有の原因があるのかは、どうでもよい。社会共和国が声高に語る以上、正面から見て、徹底的に問いたださなければならない。
  - id: gz-c04-005
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: 'Je voudrais supprimer tous les détours, écarter tous les voiles, et aller droit au cœur de l''idole. Cela se peut: car de même que tous les efforts de la République sociale tendent à un même but, de même toutes ses idées partent d''une idée fondamentale qui les contient et les enfante toutes.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n60/mode/1up
        source_sequence: 79
        printed_page: '53'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-005-print
    translation_status: reviewed
    translation_ja: あらゆる回り道をやめ、覆いをことごとく取り払い、偶像の核心に直行したい。それは可能だ。社会共和国がどんな努力をしても行き着く先は一つであるように、そのあらゆる考えを含み、それらをすべて生む根本の考えも一つだからである。
  - id: gz-c04-006
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Cette idée fondamentale se montre, ou se cache, dans le langage de tous les chefs de la République sociale, quoiqu'ils n'en conviennent pas tous, que peut-être même plusieurs croient qu'ils n'y croient point. M. Proudhon me paraît, de tous, celui qui sait le mieux ce qu'il pense et ce qu'il veut, l'esprit le plus ferme et le plus conséquent dans ses détestables rêves.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n60/mode/1up
        source_sequence: 80
        printed_page: '53'
        printed_page_end: '54'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-006-print
    translation_status: reviewed
    translation_ja: 根本の考えは、社会共和国の指導者なら誰の言葉にも、はっきり、あるいは隠れて現れる。誰もがそれを認めるわけではなく、本気で信じてはいないと自分で思っている者も、おそらく幾人かはいるだろう。私には、誰よりも自分が何を考え何を望んでいるかを知り、その忌まわしい夢のなかで、いちばん腰が据わり、筋を通しているのはプルードン氏に見える。
  - id: gz-c04-007
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Pas si ferme pourtant, ni si conséquent qu'il paraît, et probablement qu'il croit l'être. Il n'a point dit, et je doute qu'il ait vu jusqu'où va son idée. La voici, dans sa nudité et sa rigueur.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n61/mode/1up
        source_sequence: 81
        printed_page: '54'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-007-print
    translation_status: reviewed
    translation_ja: とはいえ、見かけほど、おそらく彼が自分で思うほどには、腰が据わっても、筋が通ってもいない。自分の考えがどこまで行き着くかを口にしたことはなく、そこまで見ていたかも疑わしい。その考えを、飾りも手加減もなしに示そう。
  - id: gz-c04-008
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Tous les hommes ont droit, le même droit, un droit égal au bonheur.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n61/mode/1up
        source_sequence: 82
        printed_page: '54'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-008-print
    translation_status: reviewed
    translation_ja: すべての人間が幸福になる権利を持つ。誰もが同じ権利を、平等な権利を持つ。
  - id: gz-c04-009
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Le bonheur, c'est la jouissance, sans autre limite que le besoin et la faculté, de tous les biens existants ou possibles en ce monde, soit des biens naturels et primitifs que le monde contient, soit des biens progressivement créés par l'intelligence et le travail de l'homme.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n61/mode/1up
        source_sequence: 83
        printed_page: '54'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-009-print
    translation_status: reviewed
    translation_ja: 幸福とは、必要と能力以外に限界を設けず、この世にある、あるいはありうるあらゆる富を享受することだ。世界にもとから備わる自然の富も、人間の知性と労働がしだいに生み出した富も含まれる。
  - id: gz-c04-010
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Quelques-uns, la plupart de ces biens, les plus essentiels et les plus féconds, sont devenus la jouissance exclusive de certains hommes, de certaines familles, de certaines classes.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n62/mode/1up
        source_sequence: 84
        printed_page: '55'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-010-print
    translation_status: reviewed
    translation_ja: ところが、その富の一部、いや大部分、しかも最も欠かすことができず、最も実りを生む富を、特定の人、家族、階級だけが享受するようになった。
  - id: gz-c04-011
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: C'est la conséquence inévitable du fait que ces biens, ou les moyens de se les procurer, sont la propriété spéciale et perpétuelle de certains hommes, de certaines familles, de certaines classes.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n62/mode/1up
        source_sequence: 85
        printed_page: '55'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-011-print
    translation_status: reviewed
    translation_ja: これは、そうした富や、それを手に入れる手段が、特定の人、家族、階級だけの永久の所有になっているという事実から、避けようもなく生じる。
  - id: gz-c04-012
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Une telle confiscation, au profit de quelques-uns, d'une partie du trésor humain, est essentiellement contraire au droit. Au droit des hommes de la même génération qui devraient tous en jouir. Au droit des générations successives, car chacune de ces générations, à mesure qu'elles entrent dans la vie, doit trouver les biens de la vie également accessibles, et en jouir à son tour comme ses prédécesseurs.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n62/mode/1up
        source_sequence: 86
        printed_page: '55'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-012-print
    translation_status: reviewed
    translation_ja: 少数の利益のために人類の財産の一部をこのように取り上げるのは、根本から権利に反する。それをみな享受するはずの、同じ世代の人々の権利に反する。そして続いてくる世代の権利にも反する。どの世代も、この世に生まれてくるとき、暮らしを支える富に同じように手が届き、先の世代と同じように、今度は自分たちがそれを享受できるはずだからだ。
  - id: gz-c04-013
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Donc il faut détruire l'appropriation spéciale et perpétuelle des biens qui donnent le bonheur, et des moyens de se procurer ces biens, pour en assurer la jouissance universelle et l'égale répartition entre tous les hommes et toutes les générations d'hommes.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n62/mode/1up
        source_sequence: 87
        printed_page: '55'
        printed_page_end: '56'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-013-print
    translation_status: reviewed
    translation_ja: したがって、幸福をもたらす富と、その富を手に入れる手段を、特定の人だけの永久の所有物にする仕組みを壊さなければならない。そうすれば、誰もがそれを享受でき、すべての人、すべての世代に平等に分けられる。
  - id: gz-c04-014
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Comment abolir la propriété? Comment la transformer, du moins, de telle sorte que, dans ses effets sociaux et permanents, elle soit comme abolie?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n63/mode/1up
        source_sequence: 88
        printed_page: '56'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-014-print
    translation_status: reviewed
    translation_ja: どうやって所有を廃止するのか。あるいはせめて、社会への持続的な影響においては、廃止したのと同じになるよう、どうやって所有の仕組みを変えるのか。
  - id: gz-c04-015
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: 'Ici les chefs de la République sociale diffèrent beaucoup entre eux. Les uns recommandent des moyens lents et doux; les autres poussent aux moyens prompts et décisifs. Les uns ont recours à des moyens politiques: par exemple, à une certaine organisation de la vie et du travail en commun. Les autres s''efforcent d''inventer des moyens économiques et financiers: par exemple, un certain ensemble de mesures destinées à détruire peu à peu le revenu net de la propriété, terre ou capital, et à rendre ainsi la propriété elle-même inutile et illusoire. Mais tous ces moyens partent du même dessein et tendent au même effet: l''abolition ou l''annulation de la propriété individuelle, domestique et héréditaire, et des institutions sociales ou politiques qui ont la propriété individuelle, domestique et héréditaire pour fondement.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n63/mode/1up
        source_sequence: 89
        printed_page: '56'
        printed_page_end: '57'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-015-print
    translation_status: reviewed
    translation_ja: ここで社会共和国の指導者どうしの考えは大きく違う。ゆっくり穏やかに進めるやり方を勧める者もいれば、素早く決着をつける方法を押す者もいる。政治の手段に頼り、たとえば暮らしと労働を共同で営む、ある仕組みをつくろうとする者もいる。経済や金融の手段を考え出そうとする者もいる。たとえば土地であれ資本であれ、所有による純収入を少しずつなくし、所有そのものを無用で名ばかりのものにする、一連の措置である。しかしこれらの手段は、どれも同じ意図から出て、同じ結果を目指す。すなわち、個人や家族による所有、相続される所有と、それらを土台とする社会または政治の制度を、廃止するか無効にすることである。
  - id: gz-c04-016
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: A travers la diversité, l'obscurité, l'indécision, les contradictions des idées qui circulent dans la République sociale, c'est là l'origine et le terme, l'alpha et l'oméga de toutes ces idées; c'est là le but qu'on poursuit et qu'on se flatte d'atteindre.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n64/mode/1up
        source_sequence: 90
        printed_page: '57'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-016-print
    translation_status: reviewed
    translation_ja: 社会共和国のなかを飛び交う考えはさまざまで、あいまいで、定まらず、互いに矛盾もする。それをすべて貫く始まりと終わり、アルファとオメガは、ここにある。目指しているのも、到達できると思っているのも、ここである。
  - id: gz-c04-017
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Voici ce qu'oublient M. Proudhon et ses amis.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n64/mode/1up
        source_sequence: 91
        printed_page: '57'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-017-print
    translation_status: reviewed
    translation_ja: プルードン氏とその仲間が忘れているのは、次のことだ。
  - id: gz-c04-018
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: 'L''homme, ce n''est pas seulement les êtres individuels qu''on appelle les hommes; c''est le genre humain, qui a une vie d''ensemble, et une destinée générale et progressive: caractère distinctif de la créature humaine seule au sein de la création.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n64/mode/1up
        source_sequence: 92
        printed_page: '57'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-018-print
    translation_status: reviewed
    translation_ja: 人間とは、人間と呼ばれる個々の存在だけをいうのではない。全体としての生命を持ち、全体として一つの道をたどって発展する運命を持つ、人類のことである。被造物のなかで人間だけに備わる特徴だ。
  - id: gz-c04-019
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: A quoi tient ce caractère?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n65/mode/1up
        source_sequence: 93
        printed_page: '58'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-019-print
    translation_status: reviewed
    translation_ja: この特徴はどこから来るのか。
  - id: gz-c04-020
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: A ce que les individus humains ne sont pas isolés ni bornés à eux-mêmes, et au point qu'ils occupent dans l'espace et dans le temps. Ils tiennent les uns aux autres, ils agissent les uns sur les autres par des liens et par des moyens qui n'ont pas besoin de leur présence personnelle et qui leur survivent. En sorte que les générations successives des hommes sont liées entre elles et s'enchaînent en se succédant.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n65/mode/1up
        source_sequence: 94
        printed_page: '58'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-020-print
    translation_status: reviewed
    translation_ja: 一人ひとりの人間が孤立せず、自分の身と、自分が時間や空間のなかで占める一点に閉じこもっていないことから来る。人々は互いにつながり、互いにはたらきかける。そのつながりや手段には、本人がそこにいる必要はなく、本人の死後も残る。こうして人間の世代は、入れ替わりながら互いに結びつき、連なっていく。
  - id: gz-c04-021
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: L'unité permanente qui s'établit et le développement progressif qui s'opère par cette tradition incessante des hommes aux hommes et des générations aux générations, c'est là le genre humain; c'est son originalité et sa grandeur; c'est un des traits qui marquent l'homme pour la souveraineté dans ce monde, et pour l'immortalité au delà de ce monde.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n65/mode/1up
        source_sequence: 95
        printed_page: '58'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-021-print
    translation_status: reviewed
    translation_ja: 人から人へ、世代から世代へと絶えず受け継がれることで、揺るぎない一体性が生まれ、発展がしだいに進む。これが人類であり、そこに固有の性格と偉大さがある。この世で主となり、この世を越えて不滅となるべきものとして人間を際立たせる特徴の一つだ。
  - id: gz-c04-022
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: C'est de là que dérivent et par là que se fondent la famille et l'État, la propriété et l'hérédité, la patrie, l'histoire, la gloire, tous les faits et tous les sentiments qui constituent la vie étendue et perpétuelle de l'humanité au milieu de l'apparition si bornée et de la disparition si rapide des individus humains.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n66/mode/1up
        source_sequence: 96
        printed_page: '59'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-022-print
    translation_status: reviewed
    translation_ja: 家族と国家、所有と相続、祖国、歴史、栄光は、そこから生まれ、そこに基礎を置く。ごく限られた時間だけ姿を現し、たちまち消えていく一人ひとりの人間のあいだで、人類全体に広がり、絶えることのない生命をつくる事実と感情も、すべてそこから生まれる。
  - id: gz-c04-023
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: La République sociale supprime tout cela. Elle ne voit dans les hommes que des êtres isolés et éphémères qui ne paraissent dans la vie et sur cette terre, théâtre de la vie, que pour y prendre leur subsistance et leur plaisir, chacun pour son compte seul, au même titre et sans autre fin.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n66/mode/1up
        source_sequence: 97
        printed_page: '59'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-023-print
    translation_status: reviewed
    translation_ja: 社会共和国は、これらすべてを取り除く。人間を、孤立してはかなく消える存在としか見ない。その存在が、生命の舞台であるこの地上に現れて生きるのは、ただ一人ひとりが、自分だけのため、同じ資格で、暮らしの糧と楽しみを手に入れるためで、それ以外の目的はないという。
  - id: gz-c04-024
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: C'est précisément la condition des animaux. Parmi eux, point de lien, point d'action qui survive aux individus et s'étende à tous. Point d'appropriation permanente, point de transmission héréditaire, point d'ensemble ni de progrès dans la vie de l'espèce; rien que des individus qui paraissent et passent, prenant en passant leur part des biens de la terre et des plaisirs de la vie, dans la mesure de leur besoin et de leur force qui font leur droit.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n66/mode/1up
        source_sequence: 98
        printed_page: '59'
        printed_page_end: '60'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-024-print
    translation_status: reviewed
    translation_ja: それは、まさに動物が置かれた条件だ。動物には、個体の死後も続き、全体に及ぶ結びつきやはたらきがない。持ち物を永続して所有することも、次の代に相続させることもない。種全体にわたる生活も、その生活の進歩もない。ただ個体が現れては過ぎ去る。その間、必要と力の及ぶかぎりで、地上の富とこの世の楽しみから、自分の取り分を取る。その必要と力が、彼らの権利をつくる。
  - id: gz-c04-025
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Ainsi, pour assurer à tous les individus humains la répartition égale et incessamment mobile des biens et des plaisirs de la vie, la République sociale fait descendre les hommes au rang des animaux; elle abolit le genre humain.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n67/mode/1up
        source_sequence: 99
        printed_page: '60'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-025-print
    translation_status: reviewed
    translation_ja: こうして、暮らしの富と楽しみを人間一人ひとりに平等に、絶えず配り直して保障しようとして、社会共和国は人間を動物の位まで引き下げる。人類というものを廃止するのである。
  - id: gz-c04-026
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Elle abolit bien plus encore.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n67/mode/1up
        source_sequence: 100
        printed_page: '60'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-026-print
    translation_status: reviewed
    translation_ja: 社会共和国が廃止するのは、それだけではない。
  - id: gz-c04-027
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: C'est l'impérissable instinct de l'homme que Dieu préside à sa destinée et qu'elle ne s'accomplit pas tout entière en ce monde. Naturellement, universellement, au-dessus de lui et au delà de cette vie, l'homme voit Dieu et l'invoque, comme soutien dans le présent, comme espérance dans l'avenir.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n67/mode/1up
        source_sequence: 101
        printed_page: '60'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-027-print
    translation_status: reviewed
    translation_ja: 神が人間の運命をつかさどり、その運命はこの世のうちだけでは完結しないと、人間には本能でわかる。この本能は消えることがない。人間は自然に、どこにおいても、自分より高いところに、この生を越えたところに神を見いだし、今の支え、先々の希望として、神を呼び求める。
  - id: gz-c04-028
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Pour les docteurs de la République sociale, Dieu est un pouvoir inconnu, imaginaire, sur qui les pouvoirs visibles et réels, les puissants de la terre, se déchargent de leur propre responsabilité dans la destinée des hommes. En reportant ainsi, vers un autre maître et une autre vie, les regards de ceux qui souffrent, ils les disposent à se résigner à leurs souffrances, et s'assurent à eux-mêmes le maintien de leurs usurpations. Dieu, c'est le mal, car c'est le nom qui fait que les hommes acceptent le mal. Pour bannir le mal de la terre, il faut bannir Dieu de l'esprit humain. Seuls alors en présence de leurs maîtres terrestres, et réduits à la vie terrestre, les hommes voudront absolument les jouissances de cette vie et la répartition égale de ces jouissances. Et, dès que ceux à qui elles manquent les voudront réellement, ils les auront, car ils sont les plus forts.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n68/mode/1up
        source_sequence: 102
        printed_page: '61'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-028-print
    translation_status: reviewed
    translation_ja: 社会共和国の論客にとって、神とは、正体のわからない架空の権力である。目に見える実際の権力、地上の権力者が、人々の運命について自分が負うべき責任を押しつける相手だ。このように苦しむ者の目を別の主人と別の生へ向け、その苦しみに甘んじるよう仕向ければ、権力者は奪ったものを保てる。神とは悪である。その名が人間に悪を受け入れさせるからだ。地上から悪を追い払うには、人間の心から神を追い払わなくてはならない。そうなってはじめて、地上の主人とだけ向き合い、地上の生しか持たなくなった人々は、今の生の楽しみと、その楽しみの平等な分配を、何としても欲するだろう。現にその楽しみを得られない者たちが本気で求めさえすれば、手に入る。彼らのほうが強いからだ。
  - id: gz-c04-029
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Ainsi, Dieu et le genre humain disparaissent ensemble; et, à leur place, restent des animaux qu'on appelle encore des hommes, plus intelligents et plus puissants que les autres animaux, mais de même condition, de même destinée, et, comme eux, prenant en passant leur part des biens de la terre et des plaisirs de la vie, dans la mesure de leur besoin et de leur force qui font leur droit.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n68/mode/1up
        source_sequence: 103
        printed_page: '61'
        printed_page_end: '62'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-029-print
    translation_status: reviewed
    translation_ja: こうして神と人類が一緒に消え、代わりに残るのは、なお人間と呼ばれる動物たちだ。ほかの動物より賢く、力があっても、置かれる条件も運命も同じである。ほかの動物と同様、生きている間に、必要と力の及ぶかぎりで、地上の富とこの世の楽しみから自分の取り分を取る。その必要と力が彼らの権利をつくる。
  - id: gz-c04-030
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Voilà la philosophie de la République sociale, et par conséquent la base de sa politique. Voilà d'où elle émane et où elle conduit.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n69/mode/1up
        source_sequence: 104
        printed_page: '62'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-030-print
    translation_status: reviewed
    translation_ja: これが社会共和国の哲学であり、したがってその政治の基礎である。ここから出発し、ここへ至る。
  - id: gz-c04-031
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Je ferais injure, en insistant, au bon sens et à l'honneur humain. Il suffit de montrer. C'est la dégradation de l'homme et la destruction de la société.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n69/mode/1up
        source_sequence: 105
        printed_page: '62'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-031-print
    translation_status: reviewed
    translation_ja: これ以上力をこめて論じることは、人間の分別と名誉に対する侮辱だろう。示すだけで足りる。それは、人間をおとしめ、社会を壊すものである。
  - id: gz-c04-032
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: 'Non-seulement de notre société actuelle, mais de toute société humaine: car toute société repose sur les fondements que la République sociale renverse. Ce n''est point d''une invasion de l''édifice social par des nouveaux venus, Barbares ou non, c''est de la ruine de cet édifice qu''il s''agit. Que M. Proudhon, s''il disposait en maître de la société actuelle et de tous les biens qu''elle renferme, en changeât, comme il lui plairait, la distribution et les possesseurs, ce serait beaucoup d''iniquité et de souffrance; ce ne serait pas la mort même de la société. Mais, s''il prétendait donner pour lois, à la société nouvelle, les idées qu''il dresse, comme des machines de guerre, contre la société d''aujourd''hui, la société nouvelle périrait infailliblement. Au lieu d''un État et d''un peuple, il n''y aurait plus qu''un chaos d''hommes, sans lien et sans repos. Et pour sortir de ce chaos, il faudrait absolument sortir, à force d''inconséquences, des idées de la République sociale, et rentrer dans les conditions naturelles de l''ordre social.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n69/mode/1up
        source_sequence: 106
        printed_page: '62'
        printed_page_end: '63'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-032-print
    translation_status: reviewed
    translation_ja: 今のわれわれの社会ばかりでなく、人間のあらゆる社会を壊すのである。どんな社会も、社会共和国がひっくり返す土台の上に立っているからだ。問題は、未開の者と呼ばれようがどうであろうが、新しく来た者たちが社会という建物に侵入することではない。その建物そのものが崩れることだ。今の社会とそこにある富のすべてをプルードン氏が好きなようにできるとして、分け方と所有者を思いのままに変えても、多くの不正と苦しみをもたらしはするが、社会そのものの死にはならない。だが、今日の社会に攻めかかる兵器のように持ち出した考えを、新しい社会の法にしようとするなら、新しい社会は間違いなく滅びる。国家や人民の代わりに残るのは、結びつきも安らぎもない、人間の混沌だけだ。この混沌から脱するには、いくつもの矛盾を犯してでも、社会共和国の考えを捨て、社会の秩序が成り立つ自然の条件に戻るしかない。
  - id: gz-c04-033
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: La République sociale est à la fois odieuse et impossible. C'est la plus absurde en même temps que la plus perverse des chimères.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n70/mode/1up
        source_sequence: 107
        printed_page: '63'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-033-print
    translation_status: reviewed
    translation_ja: 社会共和国は忌まわしく、しかも実現できない。これほどばかげた、これほどよこしまな空想はない。
  - id: gz-c04-034
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Mais que ceci ne nous rassure point. Rien n'est plus dangereux que ce qui est en même temps fort et impossible. La République sociale a de la force. Comment n'en aurait-elle pas? Usant avec ardeur de toutes les libertés publiques, elle répand, elle propage sans relâche, dans les rangs les plus pressés de la société, ses idées et ses promesses. Elle trouve là des populations faciles à tromper, faciles à embraser. Elle leur offre des droits au service de leurs intérêts. Elle évoque leurs passions au nom de la justice et de la vérité. Car, il serait puéril de le méconnaître, les idées de la République sociale ont, pour beaucoup d'esprits, le caractère et l'empire de la vérité. Dans des questions si complexes et si vives, la moindre lueur de vérité suffit pour éblouir la vue et pour enflammer le cœur des hommes. Ils accueillent, ils adoptent aussitôt, avec transport, les plus grossières, les plus fatales erreurs; le fanatisme s'allume en même temps que l'égoïsme se déploie; les dévouements sincères s'associent aux passions brutales; et dans la fermentation terrible qui éclate alors, c'est le mal qui domine; ce qui s'y mêle de bien ne fait que servir au mal de voile et d'instrument.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n71/mode/1up
        source_sequence: 108
        printed_page: '64'
        printed_page_end: '65'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-034-print
    translation_status: reviewed
    translation_ja: だが、だからといって安心してはならない。力がありながら実現できないものほど、危険なものはない。社会共和国には力がある。ないはずがあるだろうか。公に認められたあらゆる自由を熱心に使い、社会で最も人数の多い層に、自らの考えと約束をたえず広める。そこには、だましやすく、火をつけやすい人々がいる。彼らには、自分たちの利益のために使える権利を示し、正義と真実の名において、その情念を呼び起こす。というのも、幼稚な考えでこれを見逃してはならないが、多くの人にとって、社会共和国の考えは真実に見え、真実と同じ力を持つからだ。これほど複雑で切実な問題では、わずかに真実がのぞくだけで、人間の目はくらみ、心に火がつく。するとたちまち、人々は熱狂して、最も粗雑で、最も有害な誤りを迎え入れ、自分のものにする。狂信が燃え上がると同時に利己心が力を振るい、心からの献身が粗暴な情念と結びつく。そのとき起こる恐ろしい沸き立ちのなかで、力をふるうのは悪である。そこに混じる善は、悪を隠す覆いと、悪が使う道具になるだけだ。
  - id: gz-c04-035
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: 'Nous n''avons pas le droit de nous en plaindre, car c''est nous-mêmes qui alimentons incessamment le foyer de l''incendie; c''est nous qui prêtons à la République sociale sa principale force. C''est le chaos de nos idées et de nos mœurs politiques, ce chaos caché tantôt sous le mot démocratie, tantôt sous le mot égalité, tantôt sous le mot peuple, qui lui ouvre toutes les portes et abat devant elle tous les remparts de la société. On dit que la démocratie est tout; les hommes de la République sociale répondent: « La démocratie, c''est nous. » On proclame confusément l''égalité absolue des droits et le droit souverain du nombre; les hommes de la République sociale se présentent et disent: « Comptez-nous. » La perpétuelle confusion, dans notre propre politique, dans nos idées, dans notre langage, du vrai et du faux, du bien et du mal, du possible et du chimérique, c''est là ce qui nous énerve pour la défense, et ce qui donne à la République sociale, pour l''attaque, une confiance, une arrogance, un crédit que, par elle-même, elle ne posséderait point.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n72/mode/1up
        source_sequence: 109
        printed_page: '65'
        printed_page_end: '66'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-035-print
    translation_status: reviewed
    translation_ja: それに不満を言う資格は、われわれにはない。火の元にたえず燃料を与えるのが、われわれ自身だからだ。社会共和国にとって最大の力を貸しているのは、われわれである。われわれの政治の考えと風習の混沌が、ときには民主主義、ときには平等、ときには人民という言葉の陰に隠れている。その混沌が、社会共和国のため、あらゆる扉を開き、社会を守るあらゆる壁を倒す。民主主義がすべてだと言えば、社会共和国の人々は「民主主義とはわれわれだ」と答える。権利は絶対に平等だ、数の多い者に主権があると、何も区別せずに唱えれば、社会共和国の人々が出てきて「われわれを数えよ」と言う。われわれ自身の政治、考え、言葉のなかで、真実とうそ、善と悪、可能なことと空想とが、たえず混同されている。守る側のわれわれの力をそぎ、攻める側の社会共和国には、もともとありもしなかった自信、傲慢さ、世間からの信用を与えるのは、この混同である。
  - id: gz-c04-036
    section_id: gz-c04
    kind: paragraph
    origin: source
    source_text: Que cette confusion se dissipe; que nous entrions enfin dans cette époque de maturité où les peuples libres voient les choses comme elles sont réellement, assignent aux divers éléments de la société leur juste mesure, aux mots leur vrai sens, et règlent leurs idées comme leurs affaires avec cette tempérance ferme qui écarte toutes les fantaisies, admet toutes les nécessités, respecte tous les droits, ménage tous les intérêts, et réprime toutes les usurpations, celles d'en bas comme celles d'en haut, celles du fanatisme comme celles de l'égoïsme. Quand nous en serons là, la République sociale ne disparaîtra point; nous n'aurons pas supprimé ses efforts et ses dangers; elle puise son ambition et sa force à des sources que personne ne peut tarir. Mais, dominée par les forces d'ensemble et d'ordre de la société, elle sera incessamment combattue et vaincue dans ce qu'elle a d'absurde et de pervers, tout en prenant progressivement sa place et sa part dans cet immense et redoutable développement de l'humanité tout entière qui s'accomplit de nos jours.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n73/mode/1up
        source_sequence: 110
        printed_page: '66'
        printed_page_end: '67'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c04-036-print
    translation_status: reviewed
    translation_ja: この混乱を晴らしてほしい。自由な人民がものごとをあるがままに見て、社会のさまざまな要素にふさわしい重みを、言葉には真の意味を与える、あの成熟の時代に、ようやく入ってほしい。あらゆる思いつきを退け、必要なものをみな受け入れ、あらゆる権利を尊重し、あらゆる利害に気を配り、下からでも上からでも、狂信からでも利己心からでも、権利を奪う行いはことごとく抑える、確かな節度をもって、考えと行動をともに整えてほしい。そこまで来ても、社会共和国は消えない。その活動もその危険も、なくせたことにはならない。野心と力をくみ出す泉を、誰も枯らせはしないからである。だが社会の結束と秩序の力はそれを抑える。そのばかげた考えや邪悪な行いは、たえず抵抗にあい、打ち負かされる。その一方で社会共和国も、今日進みつつある人類全体の途方もなく大きな、おそるべき発展のなかで、自らの持ち場と役割を、しだいに得ていくだろう。
  - id: gz-c05-heading
    section_id: gz-c05
    kind: heading
    origin: source
    source_text: CHAPITRE CINQUIÈME.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n78/mode/1up
        source_sequence: 111
        printed_page: '71'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-heading-print
    translation_status: reviewed
    translation_ja: 第五章
  - id: gz-c05-title
    section_id: gz-c05
    kind: heading
    origin: source
    source_text: Quels sont les éléments réels et essentiels de la société en France ?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n78/mode/1up
        source_sequence: 112
        printed_page: '71'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-title-print
    translation_status: reviewed
    translation_ja: フランス社会を現に成り立たせる、欠かせない要素は何か
  - id: gz-c05-001
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Le premier pas à faire pour sortir de ce chaos où nous nous perdons, c'est de reconnaître et d'accepter franchement les éléments, tous les éléments réels et essentiels de la société, telle qu'elle est faite aujourd'hui en France.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n78/mode/1up
        source_sequence: 113
        printed_page: '71'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-001-print
    translation_status: reviewed
    translation_ja: われわれが道を失っているこの混沌から出る第一歩は、いまのフランス社会がどうできているかを見て、それを現に成り立たせる欠かせない要素を、すべて率直に認め、受け入れることである。
  - id: gz-c05-002
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: C'est parce que nous méconnaissons ces éléments, ou parce que nous leur refusons ce qui leur est dû, que nous restons ou que nous retombons sans cesse dans le chaos.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n79/mode/1up
        source_sequence: 114
        printed_page: '72'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-002-print
    translation_status: reviewed
    translation_ja: これらの要素を見誤るか、当然認められるべきものを認めないからこそ、われわれは混沌にとどまるか、たえず混沌へと戻るのである。
  - id: gz-c05-003
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: On peut torturer une société, peut-être même la détruire; on ne peut pas l'organiser ni la faire vivre contre ce qu'elle est réellement, en ne tenant pas compte des faits essentiels qui la constituent ou en leur faisant violence.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n79/mode/1up
        source_sequence: 115
        printed_page: '72'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-003-print
    translation_status: reviewed
    translation_ja: 社会を痛めつけることはできる。壊すことさえできるかもしれない。しかし、社会を成り立たせる肝心な事実を無視したり、力でねじ曲げたりして、社会の実際の姿に反したまま、これを組織し、存続させることはできない。
  - id: gz-c05-004
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Je regarde d'abord à ce qui fait la base de la société française, comme de toute société, à l'ordre civil.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n79/mode/1up
        source_sequence: 116
        printed_page: '72'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-004-print
    translation_status: reviewed
    translation_ja: まずフランス社会の、またどんな社会でもその土台となる、市民生活の秩序を見よう。
  - id: gz-c05-005
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: 'La famille; la propriété, dans tous ses genres, terre, capital ou salaire; le travail sous toutes ses formes, individuel ou collectif, intellectuel ou manuel; les situations que font aux hommes et les rapports qu''amènent entre eux la famille, la propriété et le travail: c''est là la société civile.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n79/mode/1up
        source_sequence: 117
        printed_page: '72'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-005-print
    translation_status: reviewed
    translation_ja: 家族。土地、資本、賃金といったあらゆる種類の所有。個人で行うものも共同で行うものも、頭を使うものも手を使うものも含め、あらゆる形の労働。そして家族、所有、労働が人々にもたらす境遇と、それゆえに人々のあいだに生まれる関係。これが市民社会である。
  - id: gz-c05-006
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Le fait essentiel et caractéristique de la société civile en France, c'est l'unité de lois et l'égalité de droits.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n80/mode/1up
        source_sequence: 118
        printed_page: '73'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-006-print
    translation_status: reviewed
    translation_ja: フランスの市民社会を成り立たせ、その特徴をなす事実は、法が一つで、権利が平等なことだ。
  - id: gz-c05-007
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Toutes les familles, toutes les propriétés, tous les travaux sont régis par les mêmes lois et possèdent ou confèrent les mêmes droits civils.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n80/mode/1up
        source_sequence: 119
        printed_page: '73'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-007-print
    translation_status: reviewed
    translation_ja: どの家族、どの所有、どの労働も、同じ法律に従い、同じ市民としての権利を持つか、与える。
  - id: gz-c05-008
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Point de privilèges, c'est-à-dire point de lois ni de droits civils particuliers pour telles ou telles familles, telles ou telles propriétés, tels ou tels travaux.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n80/mode/1up
        source_sequence: 120
        printed_page: '73'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-008-print
    translation_status: reviewed
    translation_ja: 特権はない。つまり、特定の家族、特定の所有、特定の労働だけにあてはまる法律も、市民としての特別な権利もない。
  - id: gz-c05-009
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: C'est un fait nouveau et immense dans l'histoire des sociétés humaines.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n80/mode/1up
        source_sequence: 121
        printed_page: '73'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-009-print
    translation_status: reviewed
    translation_ja: これは、人間の社会の歴史で新しい、途方もなく大きな事実である。
  - id: gz-c05-010
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Au milieu de ce fait cependant, au sein de cette unité et de cette égalité civile, existent évidemment des diversités et des inégalités nombreuses, considérables, que l'unité de lois et l'égalité de droits civils ne préviennent et ne détruisent point.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n80/mode/1up
        source_sequence: 122
        printed_page: '73'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-010-print
    translation_status: reviewed
    translation_ja: だがこの事実のもとで、つまり法の統一と市民の権利の平等のただなかで、多くの目立った違いと不平等が、明らかに存在する。法が一つで、市民の権利が平等でも、それを防ぐことも、なくすこともできない。
  - id: gz-c05-011
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Dans la propriété, foncière ou immobilière, terre ou capital, il y a des riches et des pauvres. Il y a la grande, la moyenne et la petite propriété.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n81/mode/1up
        source_sequence: 123
        printed_page: '74'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-011-print
    translation_status: reviewed
    translation_ja: 所有には、土地財産であれ不動産であれ、土地であれ資本であれ、富める者も貧しい者もいる。大きな所有、中くらいの所有、小さな所有がある。
  - id: gz-c05-012
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Que les grands propriétaires soient moins nombreux et moins riches, que les moyens et les petits propriétaires soient plus nombreux et plus puissants qu'ils n'étaient autrefois ou qu'ils ne sont ailleurs, cela n'empêche pas que la différence ne soit réelle, et assez grande pour créer, dans l'ordre civil, des situations sociales profondément diverses et inégales.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n81/mode/1up
        source_sequence: 124
        printed_page: '74'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-012-print
    translation_status: reviewed
    translation_ja: 大所有者が昔やよその国ほど多くなく、豊かでもなく、中小の所有者がより多く、より力を持つとしても、違いは現実にある。それも、市民生活の秩序の中に、根本から異なる、不平等な社会的境遇を生むのに十分なほど、大きな違いである。
  - id: gz-c05-013
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Je passe des situations fondées sur la propriété à celles qui se fondent sur le travail, sur tous les genres de travail, depuis le travail intellectuel le plus élevé jusqu'au travail manuel le plus vulgaire. Là aussi je rencontre le même fait. Là aussi la diversité et l'inégalité naissent et se maintiennent au sein des lois identiques et des droits égaux.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n81/mode/1up
        source_sequence: 125
        printed_page: '74'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-013-print
    translation_status: reviewed
    translation_ja: 所有を土台とする境遇から、労働を土台とする境遇に移ろう。最も高度な知的労働から、ごくありふれた手仕事まで、あらゆる種類の労働がある。ここでも、同じ事実に行き当たる。法律が同じで権利が等しいなかで、違いと不平等は生まれ、続いている。
  - id: gz-c05-014
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Dans les professions qu'on appelle libérales et qui vivent d'intelligence et de science, parmi les avocats, les médecins, les savants et les lettrés de toute sorte, quelques-uns s'élèvent au premier rang, attirent à eux les affaires et les succès, acquièrent le renom, la richesse, l'influence; d'autres suffisent laborieusement aux nécessités de leur famille et aux convenances de leur position; beaucoup d'autres végètent obscurément dans un malaise oisif.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n82/mode/1up
        source_sequence: 126
        printed_page: '75'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-014-print
    translation_status: reviewed
    translation_ja: 知性と学問で生計を立てる、いわゆる自由職の人々、たとえば弁護士や医師、学者やあらゆる種類の文筆家のうち、第一級の地位まで上がり、仕事も成功も引き寄せて、名声、富、影響力を得る者はわずかである。苦労しながら家族に必要なものや自分の地位にふさわしい暮らしをまかなう者もいる。多くは、仕事もなく暮らし向きも悪いまま、人に知られず日々を過ごす。
  - id: gz-c05-015
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Un fait mérite même d'être remarqué. Depuis que toutes les professions sont également accessibles à tous, depuis que le travail est libre et régi pour tous par les mêmes lois, le nombre des hommes qui, dans les professions libérales, s'élèvent au premier rang, n'est pas sensiblement augmenté. Il ne paraît pas qu'il y ait aujourd'hui plus de grands jurisconsultes, de grands médecins, de savants et de lettrés du premier ordre qu'il n'y en avait jadis. Ce sont les existences de second ordre et la multitude obscure et oisive qui se sont multipliées; comme si la Providence ne permettait pas aux lois humaines d'influer, dans l'ordre intellectuel, sur l'étendue et la magnificence de ses dons.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n82/mode/1up
        source_sequence: 127
        printed_page: '75'
        printed_page_end: '76'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-015-print
    translation_status: reviewed
    translation_ja: ここで一つ、注目すべき事実がある。あらゆる職業が誰にでも等しく開かれ、労働は自由で、すべての人に同じ法律が適用されるようになった。それ以来、自由職で第一級の地位に上がる人の数は、目立って増えてはいない。偉大な法律家や医師、第一級の学者や文筆家が、昔よりも多いとは思われない。増えたのは、二番手の人々と、人に知られず仕事もない大勢の人々である。知性の世界で摂理が与えるものの広さや豊かさには、人間の法律が手を出すことを、その摂理が許さないとでもいうようだ。
  - id: gz-c05-016
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Dans les autres professions, là où le travail est surtout matériel et manuel, là aussi il y a des situations diverses et inégales. Les uns, par l'intelligence et la bonne conduite, se créent un capital et entrent dans la voie de l'aisance et du progrès. Les autres, ou bornés, ou paresseux, ou déréglés, restent dans la condition étroite et précaire des existences fondées uniquement sur le salaire.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n83/mode/1up
        source_sequence: 128
        printed_page: '76'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-016-print
    translation_status: reviewed
    translation_ja: ほかの職業、主として物を扱い、手を使う仕事でも、境遇はさまざまで不平等だ。知恵とまっとうな行いで自分の資本をつくり、ゆとりある暮らしと向上への道に入る者もいる。知恵が足りず、怠け、あるいは節度を欠くために、賃金だけに頼って暮らす、窮屈で先の見えない境涯にとどまる者もいる。
  - id: gz-c05-017
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Ainsi dans toute l'étendue de notre société civile, au sein du travail comme au sein de la propriété, les diversités et l'inégalité des situations se produisent ou se maintiennent, et coexistent avec l'unité de lois et l'égalité de droits.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n83/mode/1up
        source_sequence: 129
        printed_page: '76'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-017-print
    translation_status: reviewed
    translation_ja: このように、市民社会の隅々まで、所有のなかでも労働のなかでも、境遇の違いと不平等が生まれ、あるいは残っており、法の統一と権利の平等とが同時に存在している。
  - id: gz-c05-018
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: 'Comment en serait-il autrement? Qu''on examine toutes les sociétés humaines de tous les lieux et de tous les temps: à travers la variété de leur organisation, de leur gouvernement, de leur étendue, de leur durée, des genres et des degrés de leur civilisation, on trouvera, dans toutes, trois types de situation sociale, toujours les mêmes au fond, quoique sous des formes très-diverses, et diversement distribués:'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n83/mode/1up
        source_sequence: 130
        printed_page: '76'
        printed_page_end: '77'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-018-print
    translation_status: reviewed
    translation_ja: どうして別の姿になりえよう。あらゆる土地と時代の人間社会を調べてみてほしい。組織や政府、大きさや存続の長さ、文明の種類や水準がいかに違っても、どの社会にも、三つの型の社会的境遇が見つかる。形やその分布はさまざまでも、根本ではどこでも同じである。
  - id: gz-c05-019
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Des hommes vivant du revenu de leurs propriétés, foncières ou mobilières, terres ou capitaux, sans chercher à les accroître par leur propre travail;
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n84/mode/1up
        source_sequence: 131
        printed_page: '77'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-019-print
    translation_status: reviewed
    translation_ja: 土地であれ動産であれ、土地や資本を所有し、その収入で暮らし、自らの労働でそれを増やそうとはしない人々。
  - id: gz-c05-020
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Des hommes appliqués à exploiter et à accroître, par leur propre travail, les propriétés, foncières ou mobilières, terres ou capitaux de tout genre qu'ils possèdent;
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n84/mode/1up
        source_sequence: 132
        printed_page: '77'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-020-print
    translation_status: reviewed
    translation_ja: 土地であれ動産であれ、自分の持つ土地やあらゆる種類の資本を、自らの労働で活用し、増やすことに努める人々。
  - id: gz-c05-021
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Des hommes vivant de leur travail, sans terres ni capitaux.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n84/mode/1up
        source_sequence: 133
        printed_page: '77'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-021-print
    translation_status: reviewed
    translation_ja: 土地も資本も持たず、働いて暮らす人々。
  - id: gz-c05-022
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Ces diversités, ces inégalités dans la situation sociale des hommes ne sont point des faits accidentels ou spéciaux à tel ou tel temps, à tel ou tel pays; ce sont des faits universels qui se produisent naturellement dans toute société humaine, au milieu des circonstances et sous l'empire des lois les plus différentes.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n85/mode/1up
        source_sequence: 134
        printed_page: '78'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-022-print
    translation_status: reviewed
    translation_ja: 人間の社会的境遇に見られるこれらの違い、不平等は、偶然の事実でも、特定の時代や国だけの事実でもない。どんな人間社会にも、状況や法律がどんなに違っても自然に生まれる、普遍的な事実である。
  - id: gz-c05-023
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Et plus on y regardera de près, plus on se convaincra que ces faits sont dans une intime liaison et dans une profonde harmonie d'une part avec la nature de l'homme qu'il nous appartient de connaître, de l'autre avec les mystères de sa destinée qu'il nous est donné seulement d'entrevoir.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n85/mode/1up
        source_sequence: 135
        printed_page: '78'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-023-print
    translation_status: reviewed
    translation_ja: よく見れば見るほど確信するのは、これらの事実が、一方では、われわれが理解すべき人間の本性に、他方では、私たちにかすかに見えるだけの人間の運命の神秘に、深く結びつき、どちらにもよく調和していることだ。
  - id: gz-c05-024
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: 'Ce n''est pas tout: indépendamment de ces diversités, de ces inégalités entre les individus, propriétaires et travailleurs, d''autres diversités, d''autres inégalités existent entre les genres mêmes de propriété et de travail; différences non moins réelles, quoique moins apparentes, et que l''unité des lois et l''égalité des droits civils ne détruisent pas davantage.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n85/mode/1up
        source_sequence: 136
        printed_page: '78'
        printed_page_end: '79'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-024-print
    translation_status: reviewed
    translation_ja: それだけではない。個々の所有者や労働者の間に、こうした違い、不平等があるだけではなく、所有や労働の種類そのものにも、別の違いと不平等がある。目につきにくいとはいえ、同じほど現実の違いである。法の統一と市民の権利の平等は、これもまたなくしはしない。
  - id: gz-c05-025
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: La propriété mobilière, le capital, a pris et continue de prendre, dans nos sociétés modernes, une extension et une importance toujours croissantes. C'est évidemment au profit de son développement que se fait de nos jours le progrès de la civilisation; juste retour des immenses services que la propriété mobilière, en se développant, a rendus à la civilisation.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n86/mode/1up
        source_sequence: 137
        printed_page: '79'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-025-print
    translation_status: reviewed
    translation_ja: 動産、つまり資本は、近代社会のうちで、しだいに広がり、重要さを増し、今もその動きは続いている。今日、文明が進歩することで、その発展が促されていることは明らかだ。これは、動産が発展の過程で文明に計り知れないほど貢献したことへの、正当な報いである。
  - id: gz-c05-026
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: On ne se contente pas de cela; on essaie, on s'efforce constamment d'assimiler de plus en plus la propriété foncière à la propriété mobilière, la terre au capital; de rendre l'une aussi disponible, aussi divisible, aussi mobile, aussi commode à posséder et à exploiter que l'est en effet l'autre. Toutes les innovations, directes ou indirectes, qu'on propose dans le régime de la propriété foncière, ont ce but patent ou détourné.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n86/mode/1up
        source_sequence: 138
        printed_page: '79'
        printed_page_end: '80'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-026-print
    translation_status: reviewed
    translation_ja: 人々はそれだけでは満足しない。土地の所有を動産の所有に、土地を資本にますます近づけようと、絶えず努めている。動産と同じように、土地を自由に処分でき、分割しやすく、移しやすく、所有も活用もしやすくしようとする。土地所有の制度について提案される、直接あるいは間接の改革はすべて、表立っていようといまいと、ここを目指している。
  - id: gz-c05-027
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Cependant au milieu de ce mouvement, si favorable à la propriété mobilière, la propriété foncière n'en demeure pas moins, non-seulement la plus considérable en France, mais toujours la première dans le jugement et dans le désir des hommes. Ceux qui la possèdent s'adonnent de plus en plus à en jouir. Ceux qui ne la possèdent pas se montrent de plus en plus ardents à l'acquérir. Les grands propriétaires reprennent goût à vivre dans leurs terres. Les bourgeois arrivés à l'aisance placent à la campagne leur repos. Les paysans ne songent qu'à ajouter un champ à leur champ. En même temps que la propriété mobilière se développe avec faveur, la propriété foncière est plus recherchée et plus goûtée que jamais.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n87/mode/1up
        source_sequence: 139
        printed_page: '80'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-027-print
    translation_status: reviewed
    translation_ja: しかし、これほど動産に有利な動きのなかにあっても、土地の所有は、フランスで最も大きな部分を占めるだけでなく、人々の評価でも欲しがる気持ちのうちでも、依然として第一にある。土地を持つ者はますますそれを楽しむようになり、持たない者は、ますます熱心に手に入れようとする。大土地所有者は自分の領地で暮らす楽しみを取り戻す。暮らしにゆとりを得たブルジョワは、安らぎを農村に求める。農民は自分の畑にもう一枚、畑を足すことばかり考える。動産が盛んに発展すると同時に、土地の所有はいっそう強く求められ、好まれるのである。
  - id: gz-c05-028
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: On peut prédire sans crainte que, si, comme je l'espère bien, l'ordre social triomphe de ses ennemis, insensés ou pervers, les attaques dont la propriété foncière est aujourd'hui l'objet, et les périls dont on la menace, tourneront au profit de sa prépondérance dans la société.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n87/mode/1up
        source_sequence: 140
        printed_page: '80'
        printed_page_end: '81'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-028-print
    translation_status: reviewed
    translation_ja: 恐れずに言ってよい。社会の秩序が、私が強く望むとおり、愚かであれ悪意があれ、その敵に打ち勝つなら、土地の所有がいま攻撃にさらされ、危険を突きつけられていることは、かえって社会における土地の所有の優位を強めるだろう。
  - id: gz-c05-029
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: D'où vient cette prépondérance? Prend-elle sa source uniquement dans ce fait que la terre est, de toutes les propriétés, la plus sûre, la moins variable, celle qui résiste et survit le mieux aux perturbations et aux misères sociales?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n88/mode/1up
        source_sequence: 141
        printed_page: '81'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-029-print
    translation_status: reviewed
    translation_ja: この優位はどこから来るのか。あらゆる財産のうち、土地がいちばん確かで、変動が少なく、社会の混乱や貧困に最もよく耐えて残るという、それだけの事実から来るのか。
  - id: gz-c05-030
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Ce motif, le premier qui s'offre à l'esprit, est réel et puissant; mais il s'en faut bien que ce soit le seul. D'autres motifs encore, des instincts plus intimes, et dont l'empire est grand sur l'homme, même à son insu, assurent à la propriété foncière la prépondérance sociale, et la lui font recouvrer quand elle est momentanément ébranlée ou affaiblie.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n88/mode/1up
        source_sequence: 142
        printed_page: '81'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-030-print
    translation_status: reviewed
    translation_ja: まず思いつくのは、その理由である。なるほど確かな、大きな理由だが、それだけではまったくない。もっと奥にある本能ともいうべき理由がほかにあり、人が自分で気づかないときでさえ、人に大いに作用する。それが土地の所有の社会的優位を支え、一時的に揺らぎ、弱まったときにも、優位を取り戻させる。
  - id: gz-c05-031
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: 'Parmi ces instincts, j''en indiquerai seulement deux: à mon avis les plus puissants. Et je me bornerai à les indiquer; j''irais trop loin si j''en voulais sonder la profondeur.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n88/mode/1up
        source_sequence: 143
        printed_page: '81'
        printed_page_end: '82'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-031-print
    translation_status: reviewed
    translation_ja: そのような本能のうち、私が最も強いと思う二つだけを挙げよう。挙げるだけにしておく。どれほど深いかを探ろうとすれば、本題からあまりに遠くなるからだ。
  - id: gz-c05-032
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: La propriété mobilière, le capital, peut donner à l'homme la richesse. La propriété foncière, la terre, lui donne bien autre chose encore. Elle lui donne une part dans le domaine du monde. Elle unit sa vie à la vie de toute la création. La richesse mobilière est un instrument à la disposition de l'homme, qui s'en sert pour satisfaire à ses besoins, à ses plaisirs, à ses volontés. La propriété foncière est l'établissement de l'homme au milieu et au-dessus de la nature. Outre ses besoins, ses plaisirs, ses volontés, elle satisfait en lui à une multitude de penchants divers et profonds. Elle crée, pour la famille, la patrie domestique, avec toutes les sympathies qui s'y rattachent dans le présent, toutes les perspectives qu'elle ouvre dans l'avenir.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n89/mode/1up
        source_sequence: 144
        printed_page: '82'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-032-print
    translation_status: reviewed
    translation_ja: 動産、つまり資本は、人に富を与えうる。土地の所有、つまり土地は、それとはずいぶん違うものをも与える。世界という領域の一部を人に与え、人の暮らしを創造された自然全体の命と結ぶ。動産の富は、人が自由に使える道具である。人はそれを、必要を満たし、楽しみを得、意志を遂げるために使う。土地の所有とは、人が自然の中にあって、しかも自然の上に立って、根を下ろすことだ。必要や楽しみ、意志に加えて、人間のさまざまな奥深い性向を満足させる。家族にとっては、家庭という小さな祖国をつくる。現在そこから生まれる親しみも、それが未来に開く眺めも、すべてそこに備わっている。
  - id: gz-c05-033
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: En même temps qu'elle répond ainsi, plus complètement que toute autre, à la nature de l'homme, la propriété foncière est aussi celle qui place sa vie et son activité dans la situation la plus morale, celle qui le contient le plus sûrement dans un sentiment juste de ce qu'il est et de ce qu'il peut. Dans presque toutes les autres professions, industrielles, commerciales, savantes, le succès dépend ou paraît dépendre uniquement de l'homme lui-même, de son habileté, de son savoir-faire, de sa prévoyance, de sa vigilance. Dans la vie agricole, l'homme est sans cesse en présence de Dieu et de son pouvoir. Autant qu'ailleurs l'activité, l'habileté, la prévoyance, la vigilance de l'homme lui-même sont nécessaires au succès de son travail. Elles y sont aussi évidemment insuffisantes que nécessaires. C'est Dieu qui dispose des saisons, de la température, du soleil, de la pluie, de tous ces phénomènes de la nature qui décident du sort des travaux de l'homme sur le sol qu'il cultive. Il n'y a point d'orgueil qui résiste, point de savoir-faire qui échappe à cette dépendance. Et ce n'est pas seulement un sentiment de modestie sur ce qu'il peut lui-même dans sa propre destinée qui est par là inculqué à l'homme; il apprend aussi la tranquillité et la patience. Il ne saurait se figurer qu'à force d'inventions et de mouvements, en courant sans relâche après le succès, il finira par l'atteindre. Quand il a fait ce qui dépend de lui pour exploiter et féconder la terre, il faut qu'il attende et qu'il se résigne. Plus on pénètre dans la situation que font à l'homme la propriété et la vie territoriales, plus on découvre tout ce qu'il y a de salutaire, pour sa raison et pour sa disposition morale, dans les enseignements et dans les influences qu'il en reçoit.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n89/mode/1up
        source_sequence: 145
        printed_page: '82'
        printed_page_end: '84'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-033-print
    translation_status: reviewed
    translation_ja: このようにほかのどの所有よりも人間の本性を満たす一方で、土地の所有は、人の暮らしと活動を、最も道徳的な境遇に置く。自分が何者で、何ができるかを正しくわきまえるよう、最も確かに人を導く。工業、商業、学問など、ほとんどすべての職業では、成功は、本人の力量、要領、見通し、注意だけにかかっているか、少なくともそう見える。農業の暮らしでは、人は絶えず神とその力を前にしている。ほかの仕事と同じように、自らまめに働き、技を磨き、先を見て、注意を払わなければ、仕事はうまくいかない。だが、それが必要なのと同じほど明らかに、それだけでは足りない。耕す地で人の仕事の行く末を決める、季節、気温、日差し、雨、自然のあらゆる現象を動かすのは、神である。どんな思い上がりもそれには抗えず、どんな手際のよさも、それに頼らずにはいられない。こうして人が教えられるのは、自分の運命について自分に何ができるかを謙虚に見きわめることだけではない。落ち着いて待つこと、辛抱することも学ぶ。工夫を重ね、動き回り、休みなく成功を追えば、いつかはつかめるなどとは、思えない。土地を耕して実らせるため、自分にできるだけのことをしたら、待ち、結果を受け入れなければならない。土地を持ち、土地とともに暮らすことが人に与える境遇を深く見ていくほど、そこから受ける教えや影響が、人の理性と心がけにとって、いかに有益かがわかる。
  - id: gz-c05-034
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Les hommes ne se rendent pas compte de ces faits, mais ils en ont le sentiment instinctif; et cet instinct contribue puissamment à l'estime particulière qu'ils font évidemment de la propriété foncière et à la prépondérance qu'elle obtient. Cette prépondérance est un fait naturel, légitime, salutaire, que, dans un grand pays surtout, la société tout entière a un immense intérêt à reconnaître et à respecter.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n91/mode/1up
        source_sequence: 146
        printed_page: '84'
        printed_page_end: '85'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-034-print
    translation_status: reviewed
    translation_ja: 人々はこれらの事実をはっきりとは知らないが、本能で感じている。その本能が、土地の所有をはっきりと別格に尊び、土地の所有に優位を与えることに、大きくはたらいている。この優位は自然で、正当で、有益な事実である。とりわけ大国では、社会全体がこれを認め、尊重することで、大きな利益を得る。
  - id: gz-c05-035
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Ce que je viens de constater dans la sphère de la propriété, je le constaterai également dans la sphère du travail. C'est la gloire de la civilisation moderne d'avoir compris et mis en lumière la valeur morale et l'importance sociale du travail, de lui avoir restitué l'estime et le rang qui lui appartiennent. Si j'avais à rechercher quel a été le mal le plus profond, le vice le plus funeste de cette ancienne société qui a dominé en France jusqu'au seizième siècle, je dirais sans hésiter que c'est le mépris du travail. Le mépris du travail, l'orgueil de l'oisiveté sont des signes certains, ou que la société est sous l'empire de la force brutale, ou qu'elle marche à la décadence. Le travail est la loi que Dieu a imposée à l'homme. C'est par le travail qu'il développe et perfectionne toutes choses autour de lui, qu'il se développe et se perfectionne lui-même. C'est le travail qui est devenu, entre les nations, le gage le plus assuré de la paix. C'est le respect et la liberté du travail qui, malgré tant de raisons de sollicitude, peuvent nous faire beaucoup espérer de l'avenir des sociétés humaines.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n92/mode/1up
        source_sequence: 147
        printed_page: '85'
        printed_page_end: '86'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-035-print
    translation_status: reviewed
    translation_ja: 所有の分野でいま確かめたことを、労働の分野でも同じように確かめよう。労働の道徳上の価値と社会上の重要さを理解し、明らかにし、労働にふさわしい尊敬と地位を取り戻させたことは、近代文明の栄光である。十六世紀までフランスを支配した旧い社会の、最も深い病、最も有害な悪徳は何だったかと問われれば、迷わず労働を見下したことだと答える。労働への軽蔑と、働かないことを誇る心は、社会がむき出しの力に支配されているか、衰退へ向かっているかの、確かなしるしである。労働は神が人間に課した法だ。人間は労働によって、まわりのすべてを発展させ、よりよいものにし、自分自身も発展させ、よりよくなる。国家間で、平和の最も確かな保証となったのも、労働である。心配の種がこれほど多くても、人間社会の未来に多くを望ませてくれるのは、労働への敬意と、働く自由である。
  - id: gz-c05-036
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Par quelle fatalité le mot travail, si glorieux pour la civilisation moderne, est-il aujourd'hui, parmi nous, un cri de guerre, une source de désastres?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n93/mode/1up
        source_sequence: 148
        printed_page: '86'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-036-print
    translation_status: reviewed
    translation_ja: 近代文明の輝かしい功績であるはずの「労働」という言葉が、今日のわれわれのもとでは、なぜ悲運にも、戦いの叫び、災いの源となっているのか。
  - id: gz-c05-037
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: C'est que ce mot couvre un grand, un déplorable mensonge. Ce n'est point du travail, de ses intérêts et de ses droits qu'il s'agit dans l'agitation suscitée en son nom. Ce n'est point en faveur du travail que se fait et que tournerait cette guerre qui le prend pour drapeau. Elle est dirigée au contraire, elle tournerait infailliblement contre le travail lui-même. Elle ne peut que le ruiner et l'avilir.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n93/mode/1up
        source_sequence: 149
        printed_page: '86'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-037-print
    translation_status: reviewed
    translation_ja: この言葉が、大きな、嘆かわしいうそを覆い隠しているからだ。労働の名であおられる騒動で問題なのは、労働そのものでも、その利益や権利でもない。労働を旗印とする戦いは、労働のために戦われているのではなく、その結果も労働のためにはならない。逆に、ねらいは労働そのものに向けられ、結果も間違いなく労働に不利となる。労働を滅ぼし、おとしめるだけである。
  - id: gz-c05-038
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: 'Comme la famille, comme la propriété, comme toutes choses en ce monde, le travail a ses lois naturelles et générales. La diversité et l''inégalité entre les travaux, entre les travailleurs, entre les résultats du travail, sont au nombre de ces lois. Le travail intellectuel est supérieur au travail manuel. Descartes en éclairant la France, Colbert en fondant sa prospérité, font un travail supérieur à celui des ouvriers qui impriment les œuvres de Descartes ou qui vivent dans les manufactures protégées par Colbert. Et, parmi ces ouvriers, ceux qui sont intelligents, moraux, laborieux, acquièrent légitimement, par leur travail, une situation supérieure à celle où languissent ceux qui sont peu intelligents, paresseux, licencieux. La variété des tâches et des missions humaines est infinie: le travail est partout dans ce monde, dans la maison du père de famille qui élève ses enfants et administre ses affaires, dans le cabinet de l''homme d''État qui prend part au gouvernement de son pays, du magistrat qui lui rend la justice, du savant qui l''instruit, du poëte qui le charme, dans les champs, sur les mers, sur les routes, dans les ateliers. Et partout, entre tous les genres de travail, dans toutes les classes de travailleurs, la diversité et l''inégalité naissent et se perpétuent: inégalité de grandeur intellectuelle, de mérite moral, d''importance sociale, de valeur matérielle. Ce sont là les lois naturelles, primitives, universelles, du travail, telles qu''elles découlent de la nature et de la condition de l''homme, c''est-à-dire telles que les a instituées la sagesse de Dieu.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n94/mode/1up
        source_sequence: 150
        printed_page: '87'
        printed_page_end: '88'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-038-print
    translation_status: reviewed
    translation_ja: 家族や所有と同じく、この世のあらゆる事柄と同じく、労働にも自然で一般的な法則がある。仕事と仕事のあいだ、働く者と働く者のあいだ、成果と成果のあいだに違いと不平等があるのは、そうした法則の一つだ。知的労働は手仕事より上にある。フランスの人々を啓発したデカルト、フランスの繁栄の土台を築いたコルベールの仕事は、デカルトの著作を印刷する職工や、コルベールに保護された工場で働いて生計を立てる労働者の仕事より上にある。そしてその労働者のなかでも、知性があり、行いが正しく、勤勉な者は、知恵に乏しく、怠惰で、放縦な者が抜け出せずにいる境遇より上の境遇を、自分の労働で正当に手にする。人間の仕事と役目は、限りなく多様だ。労働はこの世のどこにもある。子を育て、家の事柄を切り盛りする父親の家庭に、国を治める仕事にたずさわる政治家の執務室に、正義を行う裁判官の部屋に、知識を与える学者の部屋に、人の心を喜ばせる詩人の部屋に、畑に、海に、道に、工房にある。どこでも、あらゆる仕事のあいだ、働く者のあらゆる階層のなかで、違いと不平等が生まれ、残り続ける。知性の大きさ、道徳上の値打ち、社会への重要さ、物としての価値の不平等である。これらは、人間の本性と境遇から出てくる労働の法則、自然で、もとからあって、どこでも通用する法則である。言いかえれば、神の知恵が定めた法則である。
  - id: gz-c05-039
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: C'est contre ces lois que se fait la guerre dont nous sommes les témoins. C'est cette hiérarchie féconde, établie dans la sphère du travail par les décrets de la volonté divine et par les actes de la liberté humaine, qu'il s'agit d'abolir pour y substituer quoi? L'abaissement et la ruine du travail par le nivellement des travaux et des travailleurs. Regardez de près au sens que porte habituellement le mot travail dans le langage de cette guerre antisociale. On ne dit pas que le travail matériel et manuel soit le seul travail véritable. On rend même de temps en temps au travail purement intellectuel de pompeux hommages. Mais on oublie, on laisse dans l'ombre la plupart des travaux variés qui s'accomplissent à tous les degrés de l'échelle sociale; c'est du seul travail matériel qu'on se préoccupe, c'est celui-là qu'on présente incessamment comme le travail par excellence, celui devant lequel s'effacent tous les autres. On parle enfin de manière à faire naître et à entretenir, dans l'esprit des ouvriers adonnés au travail matériel, le sentiment que c'est leur travail seul qui mérite ce nom et en possède les droits. Ainsi, d'une part, on abaisse le niveau des choses; de l'autre, on enfle l'orgueil des hommes. Et, quand il s'agit des hommes eux-mêmes, quand on parle non plus du travail, mais des travailleurs, on procède de la même façon, toujours par voie d'abaissement. C'est à la qualité abstraite d'ouvrier, indépendamment du mérite individuel, qu'on attache tous les droits du travail. C'est ainsi le travail le plus commun, le dernier dans l'échelle, qu'on prend pour base et pour règle, lui subordonnant, c'est-à-dire lui sacrifiant tous les degrés supérieurs, et abolissant partout la diversité et l'inégalité au profit de ce qu'il y a de moindre et de plus bas.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n95/mode/1up
        source_sequence: 151
        printed_page: '88'
        printed_page_end: '90'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-039-print
    translation_status: reviewed
    translation_ja: われわれが目にしている戦いは、これらの法則に向けられている。神が意志によって定め、人間が自由に行動して築いてきた、この実り豊かな労働の序列をなくして、何と取り替えようというのか。仕事と働く者を一律にすることで、労働をおとしめ、滅ぼすことではないか。この反社会的な戦いで、「労働」という言葉が通常どんな意味で使われるかを、よく見てほしい。物を扱う手仕事だけが、本当の労働だとは言わない。ときには純粋に知的な労働にも、おおげさな賛辞を贈る。しかし、社会のあらゆる段階で行われるさまざまな労働の大半は忘れられ、人目につかないままにされる。関心を向けるのは物を扱う仕事だけで、それこそ最高の労働、ほかのどの労働もその前ではかすむものだと、言い立て続ける。ついには物を扱う労働にたずさわる人々の心に、自分たちの仕事だけが労働と呼ばれるに値し、労働が持つ権利を持つのだという気持ちを起こし、それを養うようなものの言い方をする。こうして一方では仕事の水準を下げ、他方では人々のうぬぼれをふくらませる。労働でなく働く者の話になるときにも、同じように運び、やはり引き下げる。個々の値打ちとは無関係に、ただ労働者という、抽象的な身分に、労働のすべての権利を結びつけるのである。こうして、最もありふれた、序列の一番下の仕事を土台と基準にし、それより上のあらゆる段階をこれに従わせる。つまり上のものを犠牲にし、最も小さく、最も低いもののために、どこでも違いと不平等を廃止するのである。
  - id: gz-c05-040
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Est-ce là servir, est-ce là seulement comprendre la cause du travail? Est-ce là avancer, ou seulement persévérer dans cette voie glorieuse de notre civilisation où le travail a grandi et reconquis son rang? N'est-ce pas, au contraire, mutiler, avilir, compromettre le travail, et lui enlever ses beaux titres et ses vrais droits pour y substituer des prétentions absurdes et basses malgré leur insolence? N'est-ce pas enfin méconnaître grossièrement et torturer violemment, dans la sphère du travail, les faits naturels, les éléments réels et essentiels de notre société civile, qui, en se fondant sur l'unité des lois et l'égalité des droits, n'a certes pas prétendu abolir la variété des mérites et des destinées, loi mystérieuse de Dieu dans ce monde et résultat indomptable de la liberté de l'homme?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n97/mode/1up
        source_sequence: 152
        printed_page: '90'
        printed_page_end: '91'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-040-print
    translation_status: reviewed
    translation_ja: これが労働に尽くすことだろうか。そもそも労働を理解することだろうか。労働が発展して地位を取り戻した、近代文明のあの輝かしい道を進むことだろうか。その道を歩み続けることとさえ言えるだろうか。それどころか、労働を傷つけ、おとしめ、危ういところに置き、名誉ある資格と本来の権利を奪って、思い上がっているくせにばかげて卑しい要求に取り替えることではないか。ひいては労働の分野で、われわれの市民社会を現に成り立たせてきた自然の事実と、欠かせない本来の要素を、ひどく見誤り、力ずくでねじ曲げることではないか。この社会が、法の統一と権利の平等を足場にしたからといって、人々の値打ちと運命の多様さまで、決して廃止しようとしたのではない。それは、この世にある神の神秘の法則であり、人間の自由が生み、人間にも抑えきれない結果なのである。
  - id: gz-c05-041
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Je quitte la société civile. J'entre dans la société politique, celle que forment entre les hommes leurs intérêts, leurs idées, leurs sentiments dans leurs rapports avec le gouvernement de l'État. Là aussi je veux reconnaître avec précision quels sont aujourd'hui en France les éléments réels et essentiels de la société.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n98/mode/1up
        source_sequence: 153
        printed_page: '91'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-041-print
    translation_status: reviewed
    translation_ja: 市民社会を離れ、政治社会に入ろう。人々の利害、考え、感情が、国家の政府との関係を通じて人々のあいだにつくる社会である。ここでも、いまフランスで社会を現に成り立たせている、欠かせない要素は何か、正確に知りたい。
  - id: gz-c05-042
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Dans un pays libre ou qui travaille à le devenir, les éléments de la société politique sont les partis politiques. Je prends le mot parti dans son acception la plus étendue et la plus élevée.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n98/mode/1up
        source_sequence: 154
        printed_page: '91'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-042-print
    translation_status: reviewed
    translation_ja: 自由な国や、自由になろうと努める国では、政治社会を成り立たせる要素は政党である。私は「党派」という言葉を、最も広く、高い意味で使う。
  - id: gz-c05-043
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: 'Légalement, il n''y a aujourd''hui en France point d''autres partis que les partis inhérents à tout régime constitutionnel: le parti du gouvernement et celui de l''opposition. Il n''y a point de légitimistes. Il n''y a point d''orléanistes. La République existe. Elle interdit toute attaque contre le principe de son existence. C''est le droit de tout gouvernement établi. Je ne le conteste point et n''entends point y déroger.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n98/mode/1up
        source_sequence: 155
        printed_page: '91'
        printed_page_end: '92'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-043-print
    translation_status: reviewed
    translation_ja: 法のうえでは、フランスにあるのはいま、どの立憲体制にもつきものの、政府を支持する党派と反対する党派だけだ。正統王朝派はいない。オルレアン派もいない。共和国が存在し、自分の存在の原理を攻撃することを、一切禁じている。それは、すでに成立したどんな政府にもある権利だ。私はこれを争わないし、例外を設けるつもりもない。
  - id: gz-c05-044
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Mais il y a des faits si profonds que les lois qui leur interdisent de paraître ne les détruisent point, même quand elles sont obéies. Il y a des partis qui ont pris leur origine et poussé leurs racines si avant dans la société qu'ils ne meurent point, même quand ils se taisent.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n99/mode/1up
        source_sequence: 156
        printed_page: '92'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-044-print
    translation_status: reviewed
    translation_ja: しかし、あまりに深く根づいていて、表に出るのを法律が禁じても、その法律が守られていてさえ、なくならない事実がある。社会のあまりに深いところで生まれ、そこまで根を伸ばしたために、黙っていても死なない党派がある。
  - id: gz-c05-045
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Le parti légitimiste est autre chose qu'un parti dynastique, autre chose même qu'un parti monarchique. En même temps qu'il est attaché à un principe et à un nom propre, il tient, par lui-même et pour son propre compte, une grande place dans l'histoire, une grande place sur le sol de la patrie. Il représente ce qui reste des éléments qui ont longtemps dominé dans l'ancienne société française. Société féconde et puissamment progressive, car c'est dans son sein que s'est formée et qu'a grandi, à travers les siècles, toute cette France qui a éclaté, en 1789, avec tant de force, d'ambition et de gloire. La révolution française a pu détruire l'ancienne société française; elle n'a pu en anéantir les éléments. Ils ont survécu à tous les coups; ils ont reparu au milieu de toutes les ruines. Et non-seulement ils subsistent encore; non-seulement ils sont présents et considérables dans la France nouvelle; mais évidemment, de jour en jour, de crise en crise, ils acceptent plus décidément, plus complètement, l'ordre social et le régime politique que la France a cherchés. Et, à mesure qu'ils les acceptent, ils y entrent et s'y relèvent, se transformant sans se désavouer.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n99/mode/1up
        source_sequence: 157
        printed_page: '92'
        printed_page_end: '93'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-045-print
    translation_status: reviewed
    translation_ja: 正統王朝派は、ただある王家を支持する党派とも、王政を支持する党派とも違う。ある原理と、ある固有の名に結びつく一方で、それ自身の力と資格で、祖国の歴史の中でも、国土の上でも、大きな場所を占めている。旧いフランス社会を長く支配した要素のうちで、残っているものを代表する。旧い社会は実り豊かで、大きな力を持って発展した。何世紀もの間に、その社会のうちで生まれ育ったのが、一七八九年にあれほどの力、野心、栄光とともに噴き出した、あのフランス全体だからだ。フランス革命は、旧いフランス社会を壊すことはできても、その構成要素を消し去れなかった。どんな打撃にも耐え、どの廃墟のなかからも再び姿を現した。それらは今も残り、新しいフランスで現に大きな意味を持っているばかりでない。日を追うごとに、危機を経るごとに、フランスが求めてきた社会の秩序と政治の体制を、いっそう断固と、いっそう完全に受け入れているのは明らかだ。受け入れるにつれて、その秩序と体制に入って立ち直る。変わりながら、自分自身を否定はしない。
  - id: gz-c05-046
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Et le parti qui a voulu fonder la monarchie de 1830 et qui l'a soutenue plus de dix-sept ans, pense-t-on qu'il ait disparu dans la tempête qui a renversé son édifice? On l'a appelé le parti de la bourgeoisie, des classes moyennes. C'est en effet ce qu'il était, ce qu'il est encore aujourd'hui. L'ascendant des classes moyennes, incessamment alimentées et recrutées par la population tout entière, est, depuis 1789, le fait caractéristique de notre histoire. Non-seulement elles ont conquis cet ascendant, elles l'ont aussi justifié. A travers les graves erreurs où elles sont tombées et qu'elles ont payées si cher, elles ont possédé et déployé ce qui fait, en définitive, la force et la grandeur des nations. A toutes les époques, pour tous les besoins de l'État, pour la guerre comme pour la paix, dans toutes les carrières sociales, elles ont amplement fourni des hommes, des générations d'hommes capables, actifs, dévoués, qui ont bien servi la patrie. Et lorsqu'elles ont été amenées, en 1830, à fonder une monarchie nouvelle, les classes moyennes ont porté, dans cette difficile entreprise, un esprit de justice et de sincérité politique dont aucun événement ne peut leur enlever l'honneur. En dépit de toutes les passions, de tous les périls qui les assaillaient, en dépit de leurs propres passions, elles ont sérieusement voulu et pratiqué l'ordre constitutionnel; elles ont effectivement respecté et maintenu, au dedans et pour tous, la liberté, la liberté à la fois légale et vive, au dehors et partout, la paix, la paix active et prospère.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n101/mode/1up
        source_sequence: 158
        printed_page: '94'
        printed_page_end: '95'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-046-print
    translation_status: reviewed
    translation_ja: では、一八三〇年の王政を築こうとし、十七年以上もそれを支えた党派は、自分たちの建物を倒した嵐のなかで姿を消したと、人は思うのだろうか。ブルジョワジーの、中間階級の党派だと言われた。実際そうだったし、いまもそうである。国民全体からたえず人を迎え、厚みを増してきた中間階級の勢いは、一七八九年からのわが国の歴史を特徴づける事実だ。中間階級はその優位を勝ち得ただけでなく、それにふさわしいことを示した。大きな過ちを犯し、高い代償も払ったが、そのなかにあっても、突き詰めれば国々の力と偉大さをつくるものを持ち、発揮してきた。あらゆる時代に、国が必要とすることなら、戦争であれ平和であれ、社会のあらゆる分野で、能力があり、よく動き、献身して祖国に尽くした人々を、何世代にもわたって十分に送り出した。そして一八三〇年、新しい王政を築くことになったとき、この難しい事業に公正と政治上の誠実さを持ち込んだ。その功績はどんな出来事にも奪えない。襲いかかる情念や危険にも、自らの情念にもかかわらず、彼らは真剣に立憲秩序を求め、実行した。国内ではすべての人に、法にかなうと同時に生き生きとした自由を、国外ではどこでも、活動と繁栄を伴う平和を、実際に尊重し、守った。
  - id: gz-c05-047
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: 'Je ne suis point de ceux qui méconnaissent et méprisent la puissance des affections dans l''ordre politique. Je n''admire point, comme de grands esprits et des âmes fortes, les hommes qui disent: « Nous ne tenons point à telle ou telle famille; nous ne faisons nul cas des noms propres; nous prenons ou nous délaissons les personnes selon les nécessités et les intérêts. » Il y a, selon moi, dans ce langage et dans ce qu''il couvre, bien plus d''ignorance et d''impuissance politique que de hauteur d''esprit et de sagesse. Il est très-vrai cependant que ce seraient des partis politiques bien faibles, bien vains, que ceux qui ne s''attacheraient qu''à des noms propres et ne puiseraient leur force que dans les affections que les personnes peuvent inspirer. Mais pense-t-on que le parti légitimiste et le parti de la monarchie de 1830 soient des partis de cette nature? N''est-il pas évident au contraire que ce sont des partis issus du cours général des faits bien plus que de l''attachement aux personnes, des partis sociaux en même temps que politiques, et qui correspondent aux éléments les plus profonds et les plus vivaces de la société en France?'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n102/mode/1up
        source_sequence: 159
        printed_page: '95'
        printed_page_end: '96'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-047-print
    translation_status: reviewed
    translation_ja: 私は、政治の秩序において人の愛着が持つ力を見誤り、軽蔑する者の一人ではない。「この家やあの家にこだわらない。固有の名など問題にしない。必要と利害に応じて、人を選びもすれば見捨てもする」と言う人々を、見識が高く心が強いとして称賛する気はない。私には、そう言う言葉にも、その裏に隠れているものにも、精神の気高さや知恵より、政治についての無知と無力のほうが、ずっと多く見える。とはいえ、ある固有の名だけに結びつき、人に抱く愛着からしか力をくみ取れないなら、いかにも弱く、むなしい政党であるのは確かだ。しかし、正統王朝派と一八三〇年の王政を支持した党派が、そのようなものだと本当に思うのか。むしろ、個人への愛着よりも、起きた事実全体の成り行きから生まれ、政治の党派であると同時に社会の党派でもあること、フランス社会に最も深く根づき、最もしぶとく生きる要素に対応していることは、明らかではないか。
  - id: gz-c05-048
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Autour de ces grands partis flotte la masse de la population, tenant à l'un ou à l'autre par ses intérêts, par ses habitudes, par ses instincts honnêtes et sensés, mais sans adhésion forte ni solide, incessamment assaillie et travaillée par les communistes, les socialistes et toutes leurs nuances. Ceux-ci ne sont point des partis politiques, car ce n'est point un principe, un système spécial d'organisation politique qu'ils poursuivent et veulent fonder. Attaquer, détruire toutes les influences, tous les liens, moraux ou matériels, qui rattachent aux classes politiques, anciennes ou nouvelles, la population qui vit du travail de ses mains; séparer profondément cette population ici des propriétaires, là des capitalistes, ailleurs des ministres de la religion, ailleurs des pouvoirs établis, quels qu'ils soient; l'attirer à eux et la dominer, au nom de ses misères et de ses appétits, c'est là tout leur effort, toute leur œuvre. Un seul nom leur convient, le nom de partis anarchiques. Ce n'est pas tel ou tel gouvernement, c'est l'anarchie, l'anarchie seule qu'ils fomentent au sein du peuple. Un fait cependant est frappant. Sincères ou pervers, utopistes aveugles ou anarchistes volontaires, tous ces perturbateurs de l'ordre social sont républicains. Non pas qu'ils aiment ou supportent mieux le gouvernement républicain que tout autre. Républicain ou monarchique, tout gouvernement régulier et efficace leur est également antipathique. Mais ils espèrent, sous la République, des armes plus fortes pour eux, des digues moins fortes contre eux. C'est là le secret de leur préférence.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n103/mode/1up
        source_sequence: 160
        printed_page: '96'
        printed_page_end: '98'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-048-print
    translation_status: reviewed
    translation_ja: これらの大きな党派のまわりを、住民の大多数が漂っている。利害や習慣や、まっとうで分別のある本能によって、どちらかに結びついてはいるが、強く固く支持してはいない。共産主義者や社会主義者と、そこから枝分かれしたあらゆる派に、絶えず攻め立てられ、働きかけを受けている。後者は政治の党派ではない。政治を組織するための特定の原理や仕組みを求め、これを打ち立てようとしているのではないからだ。手を使って働き暮らす人々を、新旧の政治階級とつなぐ、精神的あるいは物質的な影響と結びつきを、すべて攻撃し、壊す。あるところでは所有者から、別のところでは資本家から、また別のところでは聖職者から、あるいは既存の権力が何であれそれから、人々を深く引き離す。その人々の貧苦と欲望を掲げて自分たちのもとへ引き寄せ、従わせる。それが彼らの努力、彼らの仕事のすべてである。「無政府派」のほかに、ふさわしい名はない。彼らが人民のうちにあおるのは、この政府、あの政府ではなく、無政府状態、ただそれだけである。だが、目を引く事実が一つある。誠実であれ邪悪であれ、盲目の空想家であれ意志を持った無政府主義者であれ、この社会秩序を乱す人々はみな共和派なのである。ほかより共和政の政府が好きなわけでも、耐えやすいわけでもない。共和政でも王政でも、秩序立って実効のある政府はいずれも気に入らない。ただ共和国のもとでは、自分たちの武器はより強くなり、自分たちを抑える堤はより弱くなると期待する。それが共和国を選ぶ理由である。
  - id: gz-c05-049
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: 'Je parcours en tous sens la société française; je cherche et je constate partout ses éléments réels, essentiels. J''arrive par toutes les voies au même résultat: je reconnais partout, dans l''ordre politique comme dans l''ordre civil, des diversités, des inégalités profondes. Et ni, dans l''ordre civil, l''unité de lois et l''égalité de droits, ni, dans l''ordre politique, le gouvernement républicain ne peuvent détruire ces diversités, ces inégalités. Elles se perpétuent ou se reproduisent au sein de toutes les législations, sous l''empire de tous les gouvernements.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n105/mode/1up
        source_sequence: 161
        printed_page: '98'
        printed_page_end: '99'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-049-print
    translation_status: reviewed
    translation_ja: フランス社会をあらゆる方向から調べ、それを現に成り立たせている、欠かせない要素を隅々で探し、確かめる。どの道をたどっても同じ結論に着く。政治の秩序でも市民生活の秩序でも、どこでも大きな違いと不平等が見つかる。市民生活で法が一つであり権利が平等であっても、政治が共和政であっても、違いと不平等をなくせはしない。どんな立法のもとでも、どんな政府の支配のもとでも、それは残るか、また生まれる。
  - id: gz-c05-050
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Ce n'est point là une opinion, un raisonnement, une conjecture; ce sont les faits.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n106/mode/1up
        source_sequence: 162
        printed_page: '99'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-050-print
    translation_status: reviewed
    translation_ja: これは意見でも、理屈でも、推測でもない。事実である。
  - id: gz-c05-051
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Quel est le sens, quelle est la portée de ces faits? Y retrouverions-nous les anciennes classifications de la société? Les anciennes dénominations de la politique y seraient-elles applicables? Y aurait-il là une aristocratie en présence d'une démocratie? ou bien une noblesse, une bourgeoisie et la multitude? Ces diversités, ces inégalités des situations sociales et politiques formeraient-elles, tendraient-elles à former une société hiérarchiquement classée, analogue à celles qu'a déjà vues le monde?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n106/mode/1up
        source_sequence: 163
        printed_page: '99'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-051-print
    translation_status: reviewed
    translation_ja: こうした事実は何を意味し、どこまで及ぶのか。そこに、かつての社会の区分がふたたび見つかるだろうか。古い政治の呼び名はあてはまるだろうか。貴族勢力に民主勢力が向き合っているのだろうか。それとも、貴族、ブルジョワジー、大衆の三つがあるのだろうか。社会的、政治的な境遇に見られるこうした違い、不平等は、かつて世界が見たのと似た、序列をもつ階級社会を、形づくっているのか。そこへ向かっているのだろうか。
  - id: gz-c05-052
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: Non certainement. Les mots aristocratie, démocratie, noblesse, bourgeoisie, hiérarchie ne correspondent point exactement aux faits qui constituent aujourd'hui la société française, n'expriment point ces faits avec vérité.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n106/mode/1up
        source_sequence: 164
        printed_page: '99'
        printed_page_end: '100'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-052-print
    translation_status: reviewed
    translation_ja: 決してそうではない。貴族勢力、民主勢力、貴族、ブルジョワジー、序列といった言葉は、いまのフランス社会を成り立たせる事実に、ぴったりとは対応しない。実際の姿を言い表すものではない。
  - id: gz-c05-053
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: N'y a-t-il, en revanche, dans cette société, que des citoyens égaux entre eux, point de classes réellement diverses, ou seulement des diversités, des inégalités, sans importance politique? Rien qu'une grande et uniforme démocratie, qui cherche sa satisfaction dans la République, au risque de ne trouver que dans le despotisme son repos?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n107/mode/1up
        source_sequence: 165
        printed_page: '100'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-053-print
    translation_status: reviewed
    translation_ja: では反対に、この社会には互いに平等な市民がいるだけで、現実に異なる階級はないのか。それとも違いと不平等はあっても、政治には何の意味もないのか。大きく一様な民主社会が一つあるだけで、それが自分を満足させるものを共和国に探し、安らぎだけは専制のなかにしか見いだせない、という危険にさらされるのか。
  - id: gz-c05-054
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: 'Pas davantage: l''une et l''autre assertion méconnaîtraient également l''état vrai de notre société. Il faut secouer le joug des mots et voir les faits tels qu''ils sont réellement. La France est à la fois très-nouvelle et pleine de passé. Sous l''empire des principes d''unité et d''égalité qui président à son organisation, elle renferme des conditions sociales et des situations politiques profondément diverses et inégales. Il n''y a point de classification hiérarchique, mais il y a des classes différentes. Il n''y a point d''aristocratie proprement dite, mais il y a autre chose que de la démocratie. Les éléments réels, essentiels et distincts de la société française, tels que je viens de les décrire, peuvent se combattre et s''énerver; ils ne sauraient se détruire et s''annuler les uns les autres; ils résistent, ils survivent à toutes les luttes où ils s''engagent, à toutes les misères qu''ils s''imposent mutuellement. Leur existence est un fait qu''il n''est pas en leur pouvoir d''abolir. Qu''ils acceptent donc pleinement ce fait. Qu''ils vivent ensemble et en paix. La liberté comme le repos, la dignité comme la prospérité, la grandeur comme la sécurité de la France sont à ce prix.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n107/mode/1up
        source_sequence: 166
        printed_page: '100'
        printed_page_end: '101'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-054-print
    translation_status: reviewed
    translation_ja: それも違う。どちらの主張も、社会の現実を同じように見誤っている。言葉のくびきを振り払い、事実をあるがままに見なければならない。フランスはきわめて新しく、同時に過去に満ちている。その組織を導く統一と平等の原則のもとで、社会的な境遇も政治的な立場も、根本から異なり、不平等である。序列をつける区分はないが、異なる階級はある。厳密な意味での貴族勢力はないが、民主勢力以外のものはある。いま述べた、フランス社会を現実に成り立たせる、欠くことのできない互いに異なる要素は、互いに闘い、力をそぐことはできても、壊し合って互いを消すことはできない。自ら身を投じたあらゆる闘いにも、互いに課したあらゆる苦しみにも耐え、生き残る。それぞれが存在するのは事実で、誰にも廃止できない。ならば、その事実を全面的に認めてほしい。共に、平和に暮らしてほしい。自由も安らぎも、尊厳も繁栄も、偉大さも安全も、フランスが得るにはそれしかない。
  - id: gz-c05-055
    section_id: gz-c05
    kind: paragraph
    origin: source
    source_text: A quelles conditions cette paix peut-elle s'établir?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n108/mode/1up
        source_sequence: 167
        printed_page: '101'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c05-055-print
    translation_status: reviewed
    translation_ja: どんな条件で、この平和を築けるだろうか。
  - id: gz-c06-heading
    section_id: gz-c06
    kind: heading
    origin: source
    source_text: CHAPITRE SIXIÈME.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n112/mode/1up
        source_sequence: 168
        printed_page: '105'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-heading-print
    translation_status: reviewed
    translation_ja: 第六章
  - id: gz-c06-title
    section_id: gz-c06
    kind: heading
    origin: source
    source_text: Conditions politiques de la paix sociale en France.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n112/mode/1up
        source_sequence: 169
        printed_page: '105'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-title-print
    translation_status: reviewed
    translation_ja: フランスにおける社会の平和の政治的条件
  - id: gz-c06-001
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Quand on aura bien décidément reconnu et admis que les classes diverses qui existent parmi nous, et les partis politiques qui leur correspondent, sont des éléments naturels, profonds, de la société française, on aura fait un grand pas vers la paix sociale.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n112/mode/1up
        source_sequence: 170
        printed_page: '105'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-001-print
    translation_status: reviewed
    translation_ja: われわれのあいだにあるさまざまな階級と、それぞれに対応する政治の党派が、フランス社会に自然に、深く根づいた要素だと、はっきり認め、受け入れたとき、社会の平和へ大きく一歩を踏み出したことになる。
  - id: gz-c06-002
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Cette paix est impossible tant que les classes diverses, les grands partis politiques que renferme notre société, nourrissent l'espoir de s'annuler mutuellement et de posséder seuls l'empire. C'est là, depuis 1789, le mal qui nous travaille et nous bouleverse périodiquement. Tantôt les éléments démocratiques ont prétendu extirper l'élément aristocratique; tantôt l'élément aristocratique a tenté d'étouffer les éléments démocratiques et de ressaisir la domination. Les constitutions, les lois, la pratique du gouvernement ont été dirigées tour à tour, comme des machines de guerre, vers l'un ou l'autre dessein. Guerre à mort dans laquelle ni l'un ni l'autre des combattants ne croyait pouvoir vivre si son rival restait debout devant lui.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n113/mode/1up
        source_sequence: 171
        printed_page: '106'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-002-print
    translation_status: reviewed
    translation_ja: 社会のさまざまな階級や、大きな政治の党派が、互いを消し去って自分だけで支配したいという望みを抱えているかぎり、平和は不可能だ。一七八九年以来、われわれを悩ませ、繰り返し大きな混乱に陥れてきた病が、これである。あるときは民主勢力が貴族勢力を根こそぎにしようとした。あるときは貴族勢力が民主勢力を抑えつけ、支配を取り戻そうとした。憲法も法律も、政府の日々のやり方も、一方の意図、次には他方の意図を実現するために、兵器のように向けられた。相手が目の前に立っているうちは、自分は生きていけないと、どちらの陣営も考える、死ぬまでの戦いだった。
  - id: gz-c06-003
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: L'empereur Napoléon a suspendu cette guerre. Il a rallié les anciennes classes dominantes, les nouvelles classes prépondérantes; et, soit par la sécurité qu'il leur procurait, soit par le mouvement où il les entraînait, soit par le joug qu'il leur imposait, il a rétabli et maintenu entre elles la paix.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n113/mode/1up
        source_sequence: 172
        printed_page: '106'
        printed_page_end: '107'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-003-print
    translation_status: reviewed
    translation_ja: 皇帝ナポレオンはこの戦いを中断させた。かつての支配階級と、新たに優位を得た階級とを、自分のもとに集めた。安全を与え、物事を動かすなかに引き込み、あるいはくびきをはめ、その間に平和を取り戻し、保った。
  - id: gz-c06-004
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: 'Après lui, de 1814 à 1830, et de 1830 à 1848, la guerre a recommencé. Un grand progrès a été accompli: la liberté a été réelle; l''ancien élément aristocratique et l''élément démocratique se sont déployés sans s''opprimer mutuellement. Mais ils ne se sont point acceptés l''un l''autre; ils ont ardemment travaillé à s''exclure.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n114/mode/1up
        source_sequence: 173
        printed_page: '107'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-004-print
    translation_status: reviewed
    translation_ja: 彼のあと、一八一四年から一八三〇年、一八三〇年から一八四八年にかけ、戦いは再び始まった。大きな前進はあった。自由は実際に存在した。旧来の貴族勢力と民主勢力は、互いを圧迫せずに活動した。だが互いを受け入れず、相手を締め出そうと熱心に努めた。
  - id: gz-c06-005
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Et maintenant un troisième combattant est entré dans l'arène. L'élément démocratique s'est divisé. Contre les classes moyennes on dresse les classes ouvrières, contre la bourgeoisie le peuple. Et cette nouvelle guerre est aussi une guerre à mort, car le nouveau prétendant est aussi arrogant, aussi exclusif que les autres ont jamais pu l'être. Le peuple, dit-on, a seul droit à l'empire; et nul rival, ancien ou récent, noble ou bourgeois, ne peut être admis à le partager avec lui.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n114/mode/1up
        source_sequence: 174
        printed_page: '107'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-005-print
    translation_status: reviewed
    translation_ja: そして今、第三の戦い手が闘技場に入ってきた。民主勢力が分かれたのである。中間階級に対して労働者階級を、ブルジョワジーに対して民衆を、立ち上がらせる。この新しい戦いもまた、死ぬまでの戦いである。新しい要求者は、ほかのどの要求者にも劣らず傲慢で、排他的だからだ。支配する権利は人民だけにあり、競う者は旧勢力であれ新勢力であれ、貴族であれブルジョワであれ、その権利を分け持つことは許されない、と言う。
  - id: gz-c06-006
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Il faut que toute prétention semblable disparaisse, non de la part d'un seul, mais de la part de tous les prétendants. Il faut que les grands éléments de notre société, l'ancienne aristocratie, les classes moyennes, le peuple, renoncent à l'espoir de s'exclure et de s'annuler mutuellement. Qu'ils luttent entre eux d'influence; que chacun maintienne sa position et ses droits; qu'ils tentent même de les étendre; c'est la vie politique. Mais qu'ils cessent toute hostilité radicale; qu'ils se résignent à vivre ensemble et côte à côte, dans le gouvernement comme dans la société civile. C'est la première condition politique de la paix sociale.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n115/mode/1up
        source_sequence: 175
        printed_page: '108'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-006-print
    translation_status: reviewed
    translation_ja: こうした要求は、一方だけでなく、支配を求めるすべての側から消えなければならない。わが社会の大きな要素である旧来の貴族勢力、中間階級、民衆が、互いを締め出し、消し去る望みを捨てなければならない。影響力を互いに争うのはよい。それぞれが自分の地位や権利を守るのも、もっと拡大しようとするのもよい。それが政治の営みだからだ。しかし、根っこからの敵対はすべてやめ、市民社会においても政府においても、隣り合って生きることを受け入れなければならない。それが、社会の平和にとって第一の政治的条件である。
  - id: gz-c06-007
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Comment cette condition peut-elle être accomplie? Comment les divers éléments de notre société peuvent-ils être amenés à s'accepter mutuellement et à jouer ensemble leur rôle dans le gouvernement du pays?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n115/mode/1up
        source_sequence: 176
        printed_page: '108'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-007-print
    translation_status: reviewed
    translation_ja: この条件は、どうすれば満たせるのか。社会のさまざまな要素を、どうやって互いに受け入れさせ、国の統治のなかで、一緒に役割を果たすよう導けるのか。
  - id: gz-c06-008
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Par une organisation de ce gouvernement où ils trouvent tous leur place et leur part, qui leur donne, à tous en même temps, des satisfactions et des limites.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n115/mode/1up
        source_sequence: 177
        printed_page: '108'
        printed_page_end: '109'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-008-print
    translation_status: reviewed
    translation_ja: それには、どの勢力にも居場所と持ち分があり、すべてが同時に、要望をかなえる機会と、越えてはならない限界とを与えられるように、政府を組織することだ。
  - id: gz-c06-009
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: 'Je rencontre ici l''idée la plus fausse, la plus funeste peut-être de toutes celles qui circulent de nos jours en matière d''organisation politique. C''est celle-ci: « L''unité nationale entraîne l''unité politique. Il n''y a qu''un peuple. Il ne peut exister, au nom et à la tête du peuple, qu''un seul pouvoir. »'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n116/mode/1up
        source_sequence: 178
        printed_page: '109'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-009-print
    translation_status: reviewed
    translation_ja: ここで、今日の政治の組織について交わされる考えのなかで、最も誤りが大きく、おそらく最も有害なものに出会う。それはこういう考えである。「国民が一つなら、政治も一つでなければならない。人民は一つしかない。その人民の名において、人民の上に立てる権力は、一つしかありえない。」
  - id: gz-c06-010
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: 'C''est l''idée révolutionnaire et despotique par excellence. C''est la Convention et Louis XIV disant pareillement: « L''État, c''est moi. »'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n116/mode/1up
        source_sequence: 179
        printed_page: '109'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-010-print
    translation_status: reviewed
    translation_ja: これほど典型的な革命と専制の考えはない。国民公会とルイ十四世が、同じように「国家とは私だ」と言うのである。
  - id: gz-c06-011
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Mensonge aussi bien que tyrannie. Un peuple n'est point une immense addition d'hommes, tant de milliers, tant de millions, comptés dans un certain espace de terre, et tous contenus et représentés dans un chiffre unique qu'on appelle tantôt un Roi, tantôt une Assemblée. Un peuple est un grand corps organisé, formé par l'union, au sein d'une même patrie, de certains éléments sociaux qui se forment et s'organisent eux-mêmes naturellement, en vertu des lois primitives de Dieu et des actes libres de l'homme. La diversité de ces éléments est, on vient de le voir, un des faits essentiels qui résultent de ces lois. Elle repousse absolument cette unité fausse et tyrannique qu'on prétend établir au centre du gouvernement, pour représenter la société où elle n'est pas.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n116/mode/1up
        source_sequence: 180
        printed_page: '109'
        printed_page_end: '110'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-011-print
    translation_status: reviewed
    translation_ja: 圧制であると同時に、うそである。人民とは、ある領土で数えられる何千、何百万という人間を足し上げ、そのすべてを一つの数に収め、その数一つで代表させ、ときには王、ときには議会と呼ぶようなものではない。人民とは、大きく組織された身体である。神が最初に定めた法則と人間の自由な行動によって、おのずと生まれ、形を整えたいくつかの社会の要素が、一つの祖国のもとで結びついてできる。いま見たように、要素の多様さは、その法則から生じる根本の事実の一つだ。社会の実際の姿から離れたところで、社会を代表させるため、政府の中心に偽りの、圧制的な一体性を築こうとしても、要素の多様さはそれを断固として拒む。
  - id: gz-c06-012
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Quoi donc! faut-il que tous les éléments de la société, tous les groupes qui se forment naturellement dans son sein, les classes, les professions, les opinions diverses, soient reproduits et représentés, au sommet de l'État, par autant de pouvoirs qui leur correspondent?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n117/mode/1up
        source_sequence: 181
        printed_page: '110'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-012-print
    translation_status: reviewed
    translation_ja: では、どういうことか。社会のあらゆる要素、その中に自然に形づくられるすべての集団、さまざまな階級、職業、意見を、国家の頂点にそのまま再現し、一つひとつに対応する別々の権力で代表させなければならないのか。
  - id: gz-c06-013
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: 'Non certainement: la société n''est point une fédération de professions, de classes, d''opinions, qui traitent ensemble, par leurs mandataires distincts, les affaires qui leur sont communes. Pas plus qu''elle n''est une masse uniforme d''éléments identiques qui n''envoient leurs représentants au centre de l''État que parce qu''ils ne sauraient s''y rendre tous eux-mêmes, et pour se réduire à un nombre qui puisse se réunir dans un même lieu et délibérer en commun. L''unité sociale veut qu''il n''y ait qu''un gouvernement. La diversité des éléments sociaux veut que ce gouvernement ne soit pas un pouvoir unique.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n117/mode/1up
        source_sequence: 182
        printed_page: '110'
        printed_page_end: '111'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-013-print
    translation_status: reviewed
    translation_ja: もちろん違う。社会は、職業や階級や意見の連合ではない。それぞれが別々の代理を立て、共通の事柄を一緒に処理するわけではない。かといって、同じ要素が一様に集まっただけでもない。全員が自ら国の中心に行くことはできず、同じ場所に集まって審議できる人数に減らすためだけに、代表を送るのではない。社会が一つである以上、政府は一つでなければならない。だが、社会をつくる要素が多様である以上、その政府がたった一つの権力であってはならない。
  - id: gz-c06-014
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Il s'opère naturellement, au sein de la société et entre les innombrables associations particulières qu'elle renferme, familles, professions, classes, opinions, un travail de rapprochement et de concentration qui, réunissant successivement toutes les petites associations dans des associations plus étendues, finit par réduire ce grand nombre d'éléments spéciaux et divers à un petit nombre d'éléments principaux et essentiels qui contiennent et représentent tous les autres.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n118/mode/1up
        source_sequence: 183
        printed_page: '111'
        printed_page_end: '112'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-014-print
    translation_status: reviewed
    translation_ja: 社会のうちには、家族、職業、階級、意見という、数え切れない個々のまとまりがある。そのあいだで、おのずと、互いに近づき、一つに集まる動きが起きる。小さなまとまりが次々に、より大きなまとまりに集まっていく。しまいには、数多くのさまざまな個別の要素は、ほかのすべてを含み、代表する、少数の主要で欠かせない要素になる。
  - id: gz-c06-015
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Je ne dis point, et je ne pense point, que ces éléments principaux de la société doivent être tous distinctement représentés, dans le gouvernement de l'État, par des pouvoirs spéciaux. Je dis seulement que leur diversité repousse l'unité du pouvoir central.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n119/mode/1up
        source_sequence: 184
        printed_page: '112'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-015-print
    translation_status: reviewed
    translation_ja: 社会のこうした主要な要素を、国家の政府の中で、一つひとつ別の権力で代表させなければならないとは、言わないし、思いもしない。ただ、それらが多様である以上、中央の権力を一つにすることはできない、と言うだけである。
  - id: gz-c06-016
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: 'Voici une réponse qu''on croit péremptoire: Les éléments divers de la société se retrouvent, dit-on, par le fait des élections libres, dans le sein de l''assemblée unique qui représente le peuple entier. Et là, par le fait de la discussion libre, ils se manifestent, soutiennent leurs idées, leurs intérêts, leurs droits, et exercent sur les résolutions de l''assemblée, et par conséquent dans le gouvernement de l''État, l''influence qui leur appartient.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n119/mode/1up
        source_sequence: 185
        printed_page: '112'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-016-print
    translation_status: reviewed
    translation_ja: 反論の一つを挙げよう。決め手になると考えられているものだ。自由な選挙を行えば、社会のさまざまな要素は、人民全体を代表するただ一つの議会の中に現れるという。そしてそこでは、自由に討議できるので、自分たちの姿を示し、自分たちの考え、利害、権利を支える。議会の決定に、従ってまた国の統治に、それぞれが持つべき影響力を及ぼすのだという。
  - id: gz-c06-017
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: 'Ainsi, envers les éléments sociaux les plus divers, les plus considérables, les plus essentiels, on croit s''être acquitté et avoir fait pour eux tout ce qui leur est dû, quand on leur a dit: « Faites-vous élire; puis, dites votre avis et tâchez de le faire prévaloir. » L''élection et la discussion, c''est là toute la base qui doit soutenir l''édifice social; cela suffit à la garantie de tous les intérêts, de tous les droits, de toutes les libertés.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n120/mode/1up
        source_sequence: 186
        printed_page: '113'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-017-print
    translation_status: reviewed
    translation_ja: こうして、もっともさまざまで、重要で、欠かすことのできない社会の要素にも、「選挙で選ばれなさい。それから考えを述べ、それを通そうと努めなさい」と言っておけば、責任を果たし、与えるべきものをすべて与えたと思っている。選挙と討議こそが社会という建物を支える土台のすべてであり、それであらゆる利害、あらゆる権利、あらゆる自由を保障するのに十分だというのである。
  - id: gz-c06-018
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Étrange ignorance de la nature humaine, de la société humaine et de la France!
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n120/mode/1up
        source_sequence: 187
        printed_page: '113'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-018-print
    translation_status: reviewed
    translation_ja: 人間の本性、人間の社会、そしてフランスを、何と奇妙なほど知らないことか。
  - id: gz-c06-019
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Je poserai une seule question. Il y a, dans la société, des intérêts de stabilité et de conservation, des intérêts de mouvement et de progrès. Si vous vouliez donner, aux intérêts de mouvement et de progrès, une garantie efficace, iriez-vous demander cette garantie aux éléments sociaux en qui dominent les intérêts de stabilité et de conservation? Non sans doute. Vous remettriez aux intérêts de mouvement et de progrès le soin de se protéger eux-mêmes, et vous auriez raison. Tous les intérêts divers ont le même besoin et le même droit. Il n'y a, pour tous, de sûreté que dans leur propre pouvoir, c'est-à-dire dans un pouvoir de nature et de position analogue à la leur. Si le sort des intérêts de stabilité et de conservation est remis tout entier aux chances de l'élection d'une assemblée unique, et de la discussion dans une assemblée unique qui décide seule et définitivement des choses, tenez pour certain qu'à un jour donné, tôt ou tard, après je ne sais combien d'oscillations entre diverses tyrannies, ces intérêts seront sacrifiés et perdus.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n120/mode/1up
        source_sequence: 188
        printed_page: '113'
        printed_page_end: '114'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-019-print
    translation_status: reviewed
    translation_ja: 質問を一つだけしよう。社会には、安定と維持を求める利害と、変化と進歩を求める利害がある。変化と進歩を求める利害に実効のある保障を与えたいとき、その保障を、安定と維持への利害が勝っている社会の勢力に求めるだろうか。もちろん求めない。変化と進歩を望む勢力が、自分たちで守れるようにするだろう。それで正しい。ほかのどの利害にも、同じ必要と権利がある。どの利害も、自らの力、つまり性質も立場も自らに似た権力のなかでしか、安全ではない。安定と維持を望む利害の行方を、たった一つの議会を選ぶ選挙のなりゆきと、物事をそれだけで最終的に決める議会での討議のなりゆきに、すべて預けてしまえば、早晩、いつか、どれほどの数の専制のあいだを揺れ動いたすえかはわからないが、こうした利害が犠牲となり、失われるのは間違いない。
  - id: gz-c06-020
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Il est absurde de demander le principe de stabilité dans le gouvernement aux éléments mobiles de la société. Il faut que les éléments permanents comme les éléments mobiles de la société trouvent, dans le gouvernement, des pouvoirs qui leur soient analogues et soient leur garantie. La diversité des pouvoirs est également indispensable à la conservation et à la liberté.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n121/mode/1up
        source_sequence: 189
        printed_page: '114'
        printed_page_end: '115'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-020-print
    translation_status: reviewed
    translation_ja: 社会のうちで動きやすい部分に、政府の安定の原理を求めるのは、ばかげている。社会のなかで動いていく要素も、持続する要素も、政府のうちに、自分たちに似て、自分たちを保障する権力を見つけられなければならない。権力が複数あることは、存続にも自由にも等しく欠かせない。
  - id: gz-c06-021
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Je ne saurais trop m'étonner que cette vérité soit contestée. Ceux qui la contestent ont fait eux-mêmes un grand pas dans la voie qui y conduit. Après avoir établi au sommet de l'État l'unité du pouvoir, ils ont admis, en descendant, la division des pouvoirs, à raison de la diversité des fonctions. Ils ont soigneusement séparé le pouvoir législatif, le pouvoir exécutif, le pouvoir administratif, le pouvoir judiciaire; rendant ainsi hommage à la nécessité de donner, par la distinction et la différente constitution de ces pouvoirs, des garanties aux intérêts différents qu'ils sont chargés de régir. Comment ne voient-ils pas que cette nécessité remonte plus haut, et que la diversité des intérêts généraux de la société et des devoirs du pouvoir suprême exige absolument la diversité des pouvoirs au sommet de l'Etat, aussi bien que la division des pouvoirs dans les régions secondaires du gouvernement?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n122/mode/1up
        source_sequence: 190
        printed_page: '115'
        printed_page_end: '116'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-021-print
    translation_status: reviewed
    translation_ja: この真理が疑われるとは、いくら驚いても足りない。これに異議を唱える人々も、自分たちで、この真理に至る道を大きく一歩進んでいる。国家の頂点に一つだけの権力を置きながら、下に降りると、仕事が違うので権力を分けた。立法権、執行権、行政権、司法権を、注意深く分けた。こうした権力を区別し、それぞれ異なった形にすることで、各権力が扱う別々の利害を保障する必要を、こうして認めたのである。どうして、この必要がもっと上まで及ぶのが見えないのか。社会全体の利害も、最高の権力の義務も、多様である。だから政府の下の部分で権力を分けるのと同じように、国家の頂点にも異なる権力を置くことが、どうしても必要なのだ。
  - id: gz-c06-022
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Mais, pour que la diversité des pouvoirs soit réelle et efficace, il ne suffit pas qu'ils aient chacun, dans le gouvernement, une place et un nom distincts; il faut encore qu'ils soient tous fortement constitués, tous capables de remplir effectivement la place qu'ils occupent et de la bien garder.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n123/mode/1up
        source_sequence: 191
        printed_page: '116'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-022-print
    translation_status: reviewed
    translation_ja: しかし、権力が複数あることを実質のある、実効のあるものにするには、政府のなかでそれぞれに別々の地位と名前があるだけでは足りない。どの権力も強固につくられ、占める地位にふさわしい仕事を実際に果たし、その地位をしっかり守れるのでなければならない。
  - id: gz-c06-023
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: On a coutume aujourd'hui de chercher l'harmonie des pouvoirs et la garantie contre leurs excès dans leur faiblesse. On a peur de tous les pouvoirs. On s'applique à les énerver tous tour à tour, craignant qu'ils ne se détruisent mutuellement ou qu'ils n'empiètent sur la liberté.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n123/mode/1up
        source_sequence: 192
        printed_page: '116'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-023-print
    translation_status: reviewed
    translation_ja: 今日では、権力どうしの調和も、それぞれが行きすぎるときの備えも、その弱さに求めるのが普通である。どの権力も恐れる。互いを壊したり、自由を侵したりしないようにと、かわるがわる、すべての権力の力をそぐのに努める。
  - id: gz-c06-024
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: C'est une erreur énorme. Tout pouvoir faible est un pouvoir condamné à la mort ou à l'usurpation. Si des pouvoirs faibles sont en présence, ou bien l'un deviendra fort aux dépens des autres, et ce sera la tyrannie; ou bien ils s'entraveront, ils s'annuleront les uns les autres, et ce sera l'anarchie.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n123/mode/1up
        source_sequence: 193
        printed_page: '116'
        printed_page_end: '117'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-024-print
    translation_status: reviewed
    translation_ja: 大きな間違いだ。弱い権力はみな、死ぬか、ほかの権力を横取りするかに追いつめられる。弱い権力どうしが向き合うと、一つがほかを犠牲にして強くなるか、互いを邪魔し、互いを無力にするかだ。前者なら圧制となり、後者なら無政府状態となる。
  - id: gz-c06-025
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Qu'est-ce qui a fait la force et la fortune de la monarchie constitutionnelle en Angleterre?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n124/mode/1up
        source_sequence: 194
        printed_page: '117'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-025-print
    translation_status: reviewed
    translation_ja: 何がイングランドの立憲王政を強くし、栄えさせたのか。
  - id: gz-c06-026
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: C'est que la royauté et l'aristocratie anglaises étaient primitivement fortes, et que les communes anglaises sont devenues fortes en conquérant successivement, sur l'aristocratie et la royauté, les droits qu'elles possèdent aujourd'hui. Des trois pouvoirs constitutionnels, deux restent grands et posés sur de profondes racines; le troisième a grandi et s'est profondément enraciné par degrés. Ils sont tous capables de se défendre les uns des autres et de suffire chacun à sa mission.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n124/mode/1up
        source_sequence: 195
        printed_page: '117'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-026-print
    translation_status: reviewed
    translation_ja: イングランドの王権と貴族勢力がもともと強く、庶民院も、今日持っている権利を貴族勢力と王権から次々に勝ち取って、強くなったことだ。立憲体制の三つの権力のうち、二つは大きなままで、深い根に支えられている。第三の権力は徐々に大きくなり、深く根を伸ばした。いずれも互いから自分を守り、自らの使命を果たす力がある。
  - id: gz-c06-027
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: 'Quand la monarchie constitutionnelle a été sérieusement tentée en France, ses plus fermes partisans ont voulu: pour la royauté, une base ancienne et historique; pour la chambre des pairs, l''hérédité; pour la chambre des députés, l''élection directe. Nullement pour obéir à des théories ou à des exemples, mais pour que les grands pouvoirs publics fussent des pouvoirs vrais, des êtres efficaces et vivaces, non pas des mots ou des fantômes.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n124/mode/1up
        source_sequence: 196
        printed_page: '117'
        printed_page_end: '118'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-027-print
    translation_status: reviewed
    translation_ja: フランスで立憲王政が本気で試されたとき、最も断固とした支持者たちはこう望んだ。王権には古く歴史のある土台を、貴族院には世襲制を、代議院には直接選挙を。理論に従ったり前例に倣ったりしたためではない。主要な公的権力は、本当の権力であって、言葉や幻ではなく、確かに働く力と生命を持つものとなるべきだと考えたからである。
  - id: gz-c06-028
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Aux États-Unis, malgré la différence des situations, des mœurs, des institutions, des noms, Washington, Hamilton, Jefferson, Madison, en fondant une République, ont reconnu et pratiqué les mêmes principes. Eux aussi ils ont voulu, au sommet de l'État, des pouvoirs divers. Et pour que la diversité fût réelle, ils ont donné aux pouvoirs divers, aux deux chambres et au président, des origines diverses, aussi diverses que le permettaient les institutions générales et que l'étaient les fonctions.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n125/mode/1up
        source_sequence: 197
        printed_page: '118'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-028-print
    translation_status: reviewed
    translation_ja: アメリカ合衆国では、境遇も風俗も制度も名前も違うのに、ワシントン、ハミルトン、ジェファソン、マディソンは、共和国を築くとき、同じ原則を認め、実践した。彼らも国家の頂点に異なる権力を望んだ。そして違いを実質のあるものにするため、別々の権力、すなわち二院と大統領に、それぞれ異なる成り立ちを与えた。国全体の制度が許し、各々の役割が違っているのと同じくらい、成り立ちも違うものにした。
  - id: gz-c06-029
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: La diversité d'origine et de nature est l'une des conditions essentielles de la force intrinsèque et réelle des pouvoirs, qui est elle-même l'indispensable condition de leur harmonie et de la paix sociale.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n125/mode/1up
        source_sequence: 198
        printed_page: '118'
        printed_page_end: '119'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-029-print
    translation_status: reviewed
    translation_ja: 成り立ちと性質が異なることは、権力が内に備える実際の強さに欠かせない条件の一つである。そしてその強さが、権力どうしの調和と社会の平和に欠かせない条件なのだ。
  - id: gz-c06-030
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Et ce n'est pas seulement au sommet de l'État et dans le gouvernement central, c'est sur toute la face du pays, dans la conduite de ses affaires locales comme de ses affaires générales, que ces principes doivent présider à l'organisation du pouvoir. On parle beaucoup de la centralisation, de l'unité administrative. Elle a rendu d'immenses services à la France. Nous garderons beaucoup de ses formes, de ses règles, de ses maximes, de ses œuvres; mais le temps de sa souveraineté est passé. Elle ne suffit plus aujourd'hui aux besoins dominants, aux périls pressants de notre société. Ce n'est pas au centre seul, c'est partout qu'est aujourd'hui la lutte. Partout attaquées, il faut que la propriété, la famille, toutes les bases de la société soient partout fortement défendues. Et c'est trop peu pour les défendre que des fonctionnaires et des ordres venus du centre, même soutenus par des soldats. Il faut que partout les propriétaires, les chefs de famille, les gardiens naturels de la société soient mis en devoir et en mesure de soutenir sa cause en faisant ses affaires, qu'ils aient leur part, une part effective d'action et de responsabilité, dans le maniement de ses intérêts locaux comme de ses intérêts généraux, dans son administration comme dans son gouvernement. Partout le pouvoir central doit tenir le drapeau de l'ordre social; nulle part il ne peut à lui seul en porter tout le fardeau.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n126/mode/1up
        source_sequence: 199
        printed_page: '119'
        printed_page_end: '120'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-030-print
    translation_status: reviewed
    translation_ja: これらの原則が権力の組織を導かなければならないのは、国の頂点や中央政府においてだけではない。国じゅうのいたるところで、国全体の事柄と同じように、地方の事柄を運ぶときにも必要なのだ。中央集権、行政の統一がよく話題にのぼる。この制度は、フランスに計り知れないほど貢献した。そのさまざまな形、規則、原則、仕事の成果の多くは、われわれも守るだろう。だが、それがすべてを支配した時代は終わった。今ではもう、社会が最も必要とすることにも、差し迫った危険にも、それだけでは応えきれない。今日、戦いは真ん中だけでなく、どこにでもある。所有、家族をはじめ、社会の基礎がいたるところで攻撃にさらされている以上、どこでもしっかり守らなければならない。兵士の支えがあるとしても、中央から送られる役人と命令だけでは、とうてい守りきれない。いたるところで、所有者、家族の長といった社会を自然に守る人たちが、社会の事柄を自分で担うことで社会を支えるように、義務と手段を与えられなければならない。国全体の利害でも地方の利害でも、政府の統治でも行政でも、実際に行動し、責任を負う持ち分を与えられるべきだ。中央の権力は、どこでも社会秩序の旗を掲げなければならない。だが、その重荷のすべてを、一人で背負えるところはどこにもない。
  - id: gz-c06-031
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Je parle toujours dans l'hypothèse que c'est à une société libre que je m'adresse et d'un gouvernement libre qu'il s'agit; c'est sous les gouvernements libres que la paix sociale exige toutes ces conditions; évidemment elles ne s'appliquent point au régime du pouvoir absolu.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n127/mode/1up
        source_sequence: 200
        printed_page: '120'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-031-print
    translation_status: reviewed
    translation_ja: 私はつねに、自由な社会に向けて語り、自由な政府を論じているという前提で話している。社会の平和のためにこれらの条件がすべて必要なのは、自由な政府のもとである。いうまでもなく、絶対権力の体制にはあてはまらない。
  - id: gz-c06-032
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Mais le pouvoir absolu a lui-même ses conditions aussi bien que la liberté. Il s'en faut beaucoup qu'il soit possible partout où il serait accepté, et il ne suffit pas de le désirer pour l'obtenir.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n128/mode/1up
        source_sequence: 201
        printed_page: '121'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-032-print
    translation_status: reviewed
    translation_ja: しかし自由と同じように、絶対権力も、それが成り立つ条件を持つ。それを人々が受け入れそうなところならどこでも可能だとは、とても言えない。手に入れたいと望むだけでは足りない。
  - id: gz-c06-033
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: 'Que les amis de la liberté ne l''oublient jamais: les peuples préfèrent le pouvoir absolu à l''anarchie. Car pour les sociétés comme pour les gouvernements, comme pour les individus, le premier besoin, l''instinct souverain, c''est de vivre. La société peut vivre sous le pouvoir absolu; l''anarchie, si elle dure, la tue.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n128/mode/1up
        source_sequence: 202
        printed_page: '121'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-033-print
    translation_status: reviewed
    translation_ja: 自由を愛する人々は、決して忘れてはならない。人民は無政府状態より絶対権力を選ぶ。社会も政府も、一人ひとりの人間も、第一に必要なのは生きることであり、これは他を圧する本能だからだ。社会は絶対権力のもとで生きられる。無政府状態が続けば、死ぬ。
  - id: gz-c06-034
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: C'est un honteux spectacle que la facilité, je pourrais dire l'empressement avec lequel les peuples jettent leurs libertés dans le gouffre de l'anarchie pour essayer de le combler. Je ne connais rien de plus triste à regarder que cet abandon soudain de tant de droits réclamés et exercés avec tant de bruit. Pour ne pas désespérer à cette vue de l'homme et de l'avenir, il faut se recueillir et retremper son âme à ces sources hautes où s'entretiennent les convictions profondes et les longues espérances.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n128/mode/1up
        source_sequence: 203
        printed_page: '121'
        printed_page_end: '122'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-034-print
    translation_status: reviewed
    translation_ja: 人民が無政府状態の深い穴を埋めようと、自らの自由をそこへ放り込む。そのためらいのなさ、むしろ熱心さは、恥ずべき光景だ。かくも騒々しく要求され、行使されてきた多くの権利が、突然捨てられるのを見るほど、悲しいことを私は知らない。その光景に人間と未来への希望を失わないためには、心を静め、深い確信と長く続く希望を養う、あの高い泉に魂を浸し直す必要がある。
  - id: gz-c06-035
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: Que la France, quel que soit son péril, ne compte pas sur le pouvoir absolu pour la sauver; il ne répondrait pas à sa confiance. Il trouvait, dans l'ancienne société française, des principes de tempérance et de durée, il avait, sous l'empereur Napoléon, des principes de force qui lui manqueraient aujourd'hui. La tyrannie populaire, la dictature militaire peuvent être des expédients d'un jour, non des gouvernements. Les institutions libres sont maintenant nécessaires à la paix sociale aussi bien qu'à la dignité des personnes; et le pouvoir, quel qu'il soit, républicain ou monarchique, n'a rien de mieux à faire que d'apprendre à s'en servir, car il n'a plus d'autre instrument ni d'autre appui.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n129/mode/1up
        source_sequence: 204
        printed_page: '122'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-035-print
    translation_status: reviewed
    translation_ja: どれほどの危険があろうと、フランスは、絶対権力が救ってくれると期待してはならない。その期待には応えられないだろう。旧いフランス社会には、絶対権力を節度あるものにし、長続きさせる原理があった。皇帝ナポレオンのもとでは、それに力を与えた原理があった。今日では、どちらも望めない。民衆の圧制も、軍の独裁も、一時しのぎにはなりえても、政府にはなれない。自由な制度は、今では一人ひとりの尊厳と同じように、社会の平和にも必要である。共和政であれ王政であれ、権力にとって何より大切なのは、そのような制度を使いこなすことだ。ほかに道具も支えも、もはやないからである。
  - id: gz-c06-036
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: 'Si quelques esprits étaient tentés de chercher ailleurs le repos, qu''ils renoncent à cette tentation: quel que soit son avenir, la France n''échappera pas à la nécessité du gouvernement constitutionnel; elle est condamnée, pour se sauver, à en surmonter toutes les difficultés, à en remplir toutes les conditions.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n130/mode/1up
        source_sequence: 205
        printed_page: '123'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-036-print
    translation_status: reviewed
    translation_ja: 安らぎをほかに求めたくなる人もいるなら、その誘惑は捨てるがよい。将来どうなろうと、フランスが立憲政府を必要とすることは変わらない。フランスが生き延びるには、その難しさを一つ残らず乗り越え、その条件を一つ残らず満たさなければならない。
  - id: gz-c06-037
    section_id: gz-c06
    kind: paragraph
    origin: source
    source_text: 'Il n''y a qu''un moyen de suffire à cette tâche, moyen unique et impérieux. Que tous les éléments de stabilité, toutes les forces conservatrices de l''ordre social en France s''unissent intimement et agissent constamment en commun. On ne supprimera pas plus la démocratie dans la société que la liberté dans le gouvernement. Ce mouvement immense qui pénètre et fermente partout au sein des nations, qui va provoquant sans cesse toutes les classes, tous les hommes à penser, à désirer, à prétendre, à agir, à se déployer en tous sens, ce mouvement ne sera point étouffé. C''est un fait qu''il faut accepter, soit qu''il plaise ou qu''il déplaise, qu''il enflamme ou qu''il épouvante. Ne pouvant le supprimer, il faut le contenir et le régler; car, s''il n''est contenu et réglé, il ruinera la civilisation et fera la honte comme le malheur de l''humanité. Pour contenir et régler la démocratie, il faut qu''elle soit beaucoup dans l''État et qu''elle n''y soit pas tout; qu''elle puisse toujours monter elle-même et jamais faire descendre ce qui n''est pas elle; qu''elle trouve partout des issues et rencontre partout des barrières. C''est un fleuve à la fois fécond et impur, dont les eaux ne sont bienfaisantes que si elles s''apaisent et s''épurent en se répandant. Un peuple qui a été grand dans un petit coin de terre, et républicain avec gloire en face de la gloire monarchique de Louis XIV, le peuple hollandais a conquis et maintient sa patrie contre l''Océan en ouvrant partout des canaux et en élevant partout des digues. Que les canaux ne soient jamais fermés, que les digues ne soient jamais entamées; c''est le travail incessant de tous les Hollandais, c''est le secret de leur succès et de leur durée. Que toutes les forces conservatrices de la société en France s''instruisent à cet exemple: qu''elles s''unissent étroitement, qu''elles veillent ensemble et sans relâche pour accueillir et contenir à la fois le flot montant de la démocratie. C''est de leur union permanente, de leur action commune et efficace que dépend le salut, le salut de tout et de tous. Si les éléments conservateurs de la société française savent s''unir et se constituer fortement, si l''esprit politique dompte en eux l''esprit de parti, la France et la démocratie elle-même, au sein de la France, seront sauvées. Si les éléments conservateurs demeurent désunis et désorganisés, la démocratie perdra la France, et se perdra elle-même en la perdant.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n130/mode/1up
        source_sequence: 206
        printed_page: '123'
        printed_page_end: '125'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c06-037-print
    translation_status: reviewed
    translation_ja: この仕事を果たす手段は一つしかない。ほかに代わりがなく、どうしても必要な手段だ。フランスに安定をもたらすあらゆる勢力、社会秩序を守るあらゆる力が、しっかりと結びつき、つねに一緒に行動しなければならない。政府から自由をなくせないのと同じように、社会から民主主義をなくすことはできない。諸国民のうちにあまねく入り、沸き立ち、どの階級、どの人にも、考え、望み、要求し、行動し、あらゆる方向に力を伸ばせと絶えず呼びかける、この大きな動きは、押し殺されはしない。気に入ろうが入るまいが、心を燃え立たせようがおびえさせようが、認めなければならない事実だ。なくせないなら、抑えて秩序を与えなければならない。そうでなければ、文明を滅ぼし、人類の不幸となるばかりか、恥にもなる。民主主義を抑え、秩序を与えるには、国のうちで大きなものであっても、すべてであってはならない。自らはつねに伸びることができても、自分と異なるものを引き下ろせてはならない。いたるところで出口を見つけ、いたるところで障壁にも出会うようでなくてはならない。民主主義は、実りをもたらすが濁りも帯びた川である。その水は、広がるにつれて静まり澄むときにだけ、恵みをもたらす。小さな土地で偉大となり、ルイ十四世の輝かしい王政に向き合いながら、共和国として栄光を得た人民がいる。オランダの人民だ。いたるところで水路を開き、いたるところで堤を築くことで、大洋に抗して祖国を勝ち取り、保っている。水路をけっしてふさがず、堤をけっして傷つけない。これがすべてのオランダ人が休まずしている仕事であり、成功し長く続くことの秘密である。フランス社会を守るあらゆる勢力も、この手本から学ぶがよい。固く結びつき、ともに休まず見守り、民主主義のせり上がる波を受け入れると同時に抑えてほしい。あらゆるものとあらゆる人が救われるかどうかは、彼らがいつまでも団結し、共同で実効のある行動をとるかどうかにかかっている。フランス社会を守る勢力が、団結して強い形をとることを知り、政治の精神がその内にある党派心を抑えるなら、フランスは救われ、そのフランスのうちで民主主義そのものも救われる。守る勢力が分裂し、まとまりを持たないままなら、民主主義はフランスを滅ぼし、フランスを滅ぼすことで、自らも滅びるだろう。
  - id: gz-c07-heading
    section_id: gz-c07
    kind: heading
    origin: source

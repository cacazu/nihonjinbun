    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n6/mode/1up
        source_sequence: 2
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-front-author-print
    translation_status: reviewed
    translation_ja: ギゾー著
  - id: gz-front-001
    section_id: gz-front
    kind: paragraph
    origin: source
    source_text: J'ose croire qu'on ne trouvera rien dans cet écrit, absolument rien, qui porte l'empreinte de ma situation personnelle. En présence de si grandes choses, quiconque ne s'oublierait pas soi-même mériterait d'être à jamais oublié. Je n'ai pensé qu'à la situation de mon pays. Plus j'y pense, plus je demeure convaincu que son grand mal, le mal qui est au fond de tous ses maux, qui mine et détruit ses gouvernements et ses libertés, sa dignité et son bonheur, c'est le mal que j'attaque, l'idolâtrie démocratique.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n8/mode/1up
        source_sequence: 3
        printed_page: '1'
        printed_page_end: '2'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-front-001-print
    translation_status: reviewed
    translation_ja: この一文には、私個人の境遇が影を落としたところなど、一つも、まったく一つもないと信じたい。これほど重大なことを前にして、なお自分のことを忘れられない者は、いつまでも人から忘れられて当然だ。私が考えたのは、祖国の置かれた状況だけである。考えれば考えるほど、祖国の大きな病、あらゆる病の根にあり、その政府と自由、尊厳と幸福をむしばんで壊す病とは、私がここで攻撃する病、すなわち民主主義の偶像崇拝だという確信が深まる。
  - id: gz-front-002
    section_id: gz-front
    kind: paragraph
    origin: source
    source_text: L'avènement de M. Louis-Napoléon Bonaparte à la présidence de la République sera-t-il, contre ce mal, un remède efficace? L'avenir nous l'apprendra. Ce que je dis aujourd'hui, après l'élection de M. Louis-Napoléon Bonaparte, je le dirais également, sans y rien changer, si le général Cavaignac avait été élu. Ce n'est à aucun nom propre que s'adressent les grandes vérités sociales; c'est à la société elle-même.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n9/mode/1up
        source_sequence: 4
        printed_page: '2'
        printed_page_end: '3'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-front-002-print
    translation_status: reviewed
    translation_ja: ルイ＝ナポレオン・ボナパルト氏の共和国大統領就任は、この病に効く薬となるだろうか。それはこれからわかる。ルイ＝ナポレオン・ボナパルト氏の当選後の今日、私が述べることは、カヴェニャック将軍が当選していたとしても、一言も変わらないだろう。社会の大きな真理が向けられるのは、誰か特定の名を持つ人物ではない。社会そのものである。
  - id: gz-c01-heading
    section_id: gz-c01
    kind: heading
    origin: source
    source_text: CHAPITRE PREMIER.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n14/mode/1up
        source_sequence: 5
        printed_page: '7'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-heading-print
    translation_status: reviewed
    translation_ja: 第一章
  - id: gz-c01-title
    section_id: gz-c01
    kind: heading
    origin: source
    source_text: D’où vient le mal.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n14/mode/1up
        source_sequence: 6
        printed_page: '7'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-title-print
    translation_status: reviewed
    translation_ja: 病はどこから来るのか
  - id: gz-c01-001
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Mirabeau, Barnave, Napoléon, La Fayette, morts dans leur lit ou sur l'échafaud, dans la patrie ou dans l'exil, à des jours très-éloignés et très-divers, sont tous morts avec un même sentiment, un sentiment profondément triste. Ils ont cru leurs espérances déçues, leurs œuvres détruites. Ils ont douté du succès de leur cause et de l'avenir.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n14/mode/1up
        source_sequence: 7
        printed_page: '7'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-001-print
    translation_status: reviewed
    translation_ja: ミラボー、バルナーヴ、ナポレオン、ラファイエット。寝床で死んだ者もいれば、断頭台で死んだ者もいる。祖国で死んだ者もいれば、亡命先で死んだ者もいる。最期の時も事情もさまざまだが、みな同じ思い、深い悲しみを抱いて死んだ。望みは裏切られ、成し遂げたことは壊されたと彼らは思った。自分が身を捧げた大義が勝つことも、その先のことも、信じきれなかった。
  - id: gz-c01-002
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Le roi Louis-Philippe a régné plus de dix-sept ans. J'ai eu l'honneur d'être plus de onze ans son ministre. Si demain Dieu nous appelait à lui, quitterions-nous cette terre bien tranquilles sur le sort et l'ordre constitutionnel de notre patrie?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n15/mode/1up
        source_sequence: 8
        printed_page: '8'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-002-print
    translation_status: reviewed
    translation_ja: 国王ルイ＝フィリップは十七年余り在位した。私は十一年余り、その大臣を務める栄誉を得た。もし明日、神が私たちをお召しになるなら、私たちは祖国の行く末と立憲秩序について、心から安心してこの世を去れるだろうか。
  - id: gz-c01-003
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: La révolution française est-elle donc destinée à n'enfanter que des doutes et des mécomptes, à n'entasser que des ruines sur ses triomphes?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n15/mode/1up
        source_sequence: 9
        printed_page: '8'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-003-print
    translation_status: reviewed
    translation_ja: それではフランス革命は、疑いと失望ばかりを生み、自らの勝利の上に廃墟ばかりを積み重ねる運命なのだろうか。
  - id: gz-c01-004
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Oui, tant que la France souffrira que, dans ses idées, dans ses institutions, dans le gouvernement de ses affaires, ce qui est vrai et ce qui est faux, ce qui est honnête et ce qui est pervers, ce qui est possible et ce qui est chimérique, ce qui est salutaire et ce qui est funeste demeurent mêlés et confondus.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n15/mode/1up
        source_sequence: 10
        printed_page: '8'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-004-print
    translation_status: reviewed
    translation_ja: そのとおりだ。フランスの考え方、制度、国の政務において、真実とうそ、正直さと邪悪さ、実現できることと空想、有益なことと有害なことが、入り混じって区別もつかないままでいるのを、フランスが許すかぎりは。
  - id: gz-c01-005
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Un peuple qui a fait une révolution n'en surmonte les périls et n'en recueille les fruits que lorsqu'il porte lui-même, sur les principes, les intérêts, les passions, les mots qui ont présidé à cette révolution, la sentence du jugement dernier « séparant le bon grain de l'ivraie et le froment de cette paille destinée au feu. »
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n15/mode/1up
        source_sequence: 11
        printed_page: '8'
        printed_page_end: '9'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-005-print
    translation_status: reviewed
    translation_ja: 革命を起こした人民が、その危険を乗り越えて実りを手にできるのは、革命を導いた主義、利害、情念、言葉に対し、自ら最後の審判の裁きを下すときだけだ。「よい穀粒を毒麦から、実った麦を焼かれる運命のわらから分ける」のである。
  - id: gz-c01-006
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Tant que ce jugement n'est pas rendu, c'est le chaos. Et le chaos, s'il se prolongeait au sein d'un peuple, ce serait la mort.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n16/mode/1up
        source_sequence: 12
        printed_page: '9'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-006-print
    translation_status: reviewed
    translation_ja: この裁きが下らないうちは、混沌である。一つの人民のうちにその混沌が長く続けば、行き着く先は死である。
  - id: gz-c01-007
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: 'Le chaos se cache aujourd''hui sous un mot: Démocratie.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n16/mode/1up
        source_sequence: 13
        printed_page: '9'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-007-print
    translation_status: reviewed
    translation_ja: 今日、混沌は一つの言葉の陰に隠れている。民主主義だ。
  - id: gz-c01-008
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: C'est le mot souverain, universel. Tous les partis l'invoquent et veulent se l'approprier comme un talisman.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n16/mode/1up
        source_sequence: 14
        printed_page: '9'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-008-print
    translation_status: reviewed
    translation_ja: 何にでも通用し、あたりを支配する言葉である。どの党派もこれを唱え、お守りのように自分だけのものにしたがる。
  - id: gz-c01-009
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: 'Les monarchistes ont dit: « Notre monarchie est une monarchie démocratique. C''est par là qu''elle diffère essentiellement de l''ancienne monarchie et qu''elle convient à la société nouvelle. »'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n16/mode/1up
        source_sequence: 15
        printed_page: '9'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-009-print
    translation_status: reviewed
    translation_ja: 王政派は言った。「われわれの王政は民主的な王政だ。そこが旧来の王政と根本から違う。だから新しい社会にふさわしい。」
  - id: gz-c01-010
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: 'Les républicains disent: « La République, c''est la démocratie se gouvernant elle-même. Ce gouvernement seul est en harmonie avec une société démocratique, avec ses principes, ses sentiments, ses intérêts. »'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n17/mode/1up
        source_sequence: 16
        printed_page: '10'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-010-print
    translation_status: reviewed
    translation_ja: 共和派は言う。「共和国とは、民主社会が自らを治めることだ。この政府だけが、民主社会と、その原則、気持ち、利害にかなっている。」
  - id: gz-c01-011
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Les socialistes, les communistes, les montagnards veulent que la République soit une démocratie pure, absolue. C'est pour eux la condition de sa légitimité.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n17/mode/1up
        source_sequence: 17
        printed_page: '10'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-011-print
    translation_status: reviewed
    translation_ja: 社会主義者、共産主義者、山岳派は、共和国が純粋で絶対的な民主政であることを求める。それが彼らにとって、共和国が正当であるための条件だ。
  - id: gz-c01-012
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Tel est l'empire du mot démocratie que nul gouvernement, nul parti n'ose vivre, et ne croit le pouvoir, sans inscrire ce mot sur son drapeau, et que ceux-là se croient les plus forts qui portent ce drapeau plus haut et plus loin.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n17/mode/1up
        source_sequence: 18
        printed_page: '10'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-012-print
    translation_status: reviewed
    translation_ja: 民主主義という言葉の威力はこれほどだ。どの政府も、どの党派も、自分の旗にこの言葉を書かなければ、生きていく勇気もなく、生きていけるとも思わない。この旗をいちばん高く掲げ、いちばん遠くへ運ぶ者たちは、自分たちこそいちばん強いと思っている。
  - id: gz-c01-013
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Idée fatale, qui soulève ou fomente incessamment la guerre au milieu de nous, la guerre sociale!
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n17/mode/1up
        source_sequence: 19
        printed_page: '10'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-013-print
    translation_status: reviewed
    translation_ja: 災いを招く考えだ。われわれのあいだに戦いを、社会の戦いを、絶えず起こし、あおり立てる。
  - id: gz-c01-014
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: C'est cette idée qu'il faut extirper. La paix sociale est à ce prix. Et avec la paix sociale, la liberté, la sécurité, la prospérité, la dignité, tous les biens, moraux et matériels, qu'elle peut seule garantir.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n18/mode/1up
        source_sequence: 20
        printed_page: '11'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-014-print
    translation_status: reviewed
    translation_ja: 根こそぎ取り除くべきなのは、この考えだ。社会の平和を手にするには、それしかない。そして平和とともに、平和だけが保障できる自由、安全、繁栄、尊厳、精神と物質のあらゆる恵みが得られる。
  - id: gz-c01-015
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Voici à quelles sources le mot démocratie puise sa puissance.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n18/mode/1up
        source_sequence: 21
        printed_page: '11'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-015-print
    translation_status: reviewed
    translation_ja: 民主主義という言葉は、次のようなところから力を得ている。
  - id: gz-c01-016
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: C'est le drapeau de toutes les espérances, de toutes les ambitions sociales de l'humanité, pures ou impures, nobles ou basses, sensées ou insensées, possibles ou chimériques.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n18/mode/1up
        source_sequence: 22
        printed_page: '11'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-016-print
    translation_status: reviewed
    translation_ja: それは、人類が社会に抱くあらゆる希望と野心の旗印である。純粋であれ不純であれ、気高くても卑しくても、分別があってもなくても、実現できても空想にすぎなくても、すべての希望と野心の旗印だ。
  - id: gz-c01-017
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: C'est la gloire de l'homme d'être ambitieux. Seul ici-bas entre tous les êtres, il ne se résigne point au mal; il aspire incessamment au bien. Pour ses semblables comme pour lui-même. Il respecte, il aime l'humanité. Il veut guérir les misères dont elle souffre; il veut redresser les injustices qu'elle subit.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n18/mode/1up
        source_sequence: 23
        printed_page: '11'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-017-print
    translation_status: reviewed
    translation_ja: より高いものを求めるのは、人間の誇りである。この世のあらゆる生き物のうち、人間だけが悪に甘んじず、つねに善にあこがれる。自分のためにも、自分と同じ人間のためにも。人類を尊び、人類を愛する。その苦しみを癒やし、その身に降りかかる不正を正そうとする。
  - id: gz-c01-018
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: 'Mais l''homme est imparfait autant qu''ambitieux. Dans sa lutte ardente et constante pour abolir le mal et pour atteindre au bien, à côté de tout bon penchant marche un mauvais penchant qui le serre de près et lui dispute le pas: le besoin de justice et le besoin de vengeance; l''esprit de liberté, l''esprit de tyrannie; le désir de s''élever et l''envie d''abaisser ce qui est élevé; l''amour ardent de la vérité et la témérité présomptueuse de l''intelligence. On peut sonder toute la nature humaine; on trouvera partout le même mélange, le même péril.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n19/mode/1up
        source_sequence: 24
        printed_page: '12'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-018-print
    translation_status: reviewed
    translation_ja: だが人間は、望みが大きいぶんだけ不完全でもある。悪をなくし、善へと至ろうとする絶え間ない熱い闘いでは、善い性向のそばを悪い性向が歩き、ぴたりとついて離れず、先を争う。正義を求める気持ちと復讐を求める気持ち、自由の精神と圧制の精神、自分が高みに上がりたい願いと高みにいる者を引きずり下ろしたい欲、真実を熱愛する心と、知性の思い上がった向こう見ず。人間の本性をどこまで探っても、この混じり合いと危険は、どこにでも見つかる。
  - id: gz-c01-019
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Pour tous ces instincts parallèles et contraires, pour tous confusément, les mauvais comme les bons, le mot démocratie a des perspectives et des promesses infinies. Il pousse à toutes les pentes, il parle à toutes les passions du cœur de l'homme, aux plus morales et aux plus immorales, aux plus généreuses et aux plus honteuses, aux plus douces et aux plus dures, aux plus bienfaisantes et aux plus destructives. Aux unes il offre tout haut, aux autres il fait, à voix basse, entrevoir leur satisfaction.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n19/mode/1up
        source_sequence: 25
        printed_page: '12'
        printed_page_end: '13'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-019-print
    translation_status: reviewed
    translation_ja: 並んでいて互いに相反するこれらの衝動のすべてに、善悪の区別もせず、民主主義という言葉は、どこまでも広い展望と約束を与える。人間をどんな方角へも押しやり、心のあらゆる情念に語りかける。最も道徳的なものにも最も不道徳なものにも、最も気高いものにも最も恥ずべきものにも、最も穏やかなものにも最も荒々しいものにも、最も人のためになるものにも最も破壊的なものにも。ある情念には、それを満たせると声高に約束し、別の情念には、声をひそめてその見込みをほのめかす。
  - id: gz-c01-020
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Voilà le secret de sa force.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n20/mode/1up
        source_sequence: 26
        printed_page: '13'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-020-print
    translation_status: reviewed
    translation_ja: これが、この言葉の力の秘密である。
  - id: gz-c01-021
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: J'ai tort de dire le secret. Le mot démocratie n'est pas nouveau, et de tout temps il a dit ce qu'il dit aujourd'hui. Voici ce qui est nouveau et propre à notre temps. Le mot démocratie est maintenant prononcé tous les jours, à toute heure, partout; et il est partout et sans cesse entendu de tous les hommes. Cet appel redoutable à ce qu'il y a de plus puissant, en bien et en mal, dans l'homme et dans la société, ne retentissait autrefois que passagèrement, localement, dans certaines classes, unies à d'autres classes au sein d'une même patrie, mais profondément diverses, distinctes, limitées. Elles vivaient éloignées les unes des autres, obscures les unes pour les autres. Maintenant il n'y a plus qu'une société; et dans cette société il n'y a plus de hautes barrières, plus de longues distances, plus d'obscurités mutuelles. Fausse ou vraie, fatale ou salutaire, quand une idée sociale s'élève, elle pénètre, elle agit partout et toujours. C'est un flambeau qui ne s'éteint jamais. C'est une voix qui ne s'arrête et ne se tait nulle part. L'universalité et la publicité incessante, tel est désormais le caractère de toutes les grandes provocations adressées, de tous les grands mouvements imprimés aux hommes. C'est là un de ces faits accomplis et souverains qui entrent sans doute dans les desseins de Dieu sur l'humanité.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n20/mode/1up
        source_sequence: 27
        printed_page: '13'
        printed_page_end: '14'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-021-print
    translation_status: reviewed
    translation_ja: 秘密というのは言いすぎだった。民主主義という言葉は新しくない。それが今日語ることは、いつの時代にも語ってきた。新しく、いまの時代に特有なのは次のことだ。いまや民主主義という言葉は、毎日、どの時刻にも、どこででも口にされる。そして、どこででも、誰の耳にも、途切れることなく届く。人間と社会のうちで、善にも悪にも最も大きな力を持つものに向けたこの恐るべき呼びかけは、昔は一時的に、限られた土地の限られた階層にしか響かなかった。そうした階層は一つの祖国のうちでほかの階層と結びつきながらも、互いに大きく異なり、区別され、はっきりした境を持っていた。離れて暮らし、互いのことが見えなかった。いまでは社会は一つしかない。その社会には、高い壁も、長い隔たりも、互いに相手がわからないということも、もうない。誤っていようと正しかろうと、災いをもたらそうと救いとなろうと、一つの社会的な考えが現れれば、いつでもどこにでも入り込み、作用する。消えることのないたいまつ、どこでも立ち止まったり押し黙ったりしない声である。あまねく行き渡り、絶えず人の目に触れることが、これからは、人間に向けられるあらゆる大きな呼びかけ、人間を動かすあらゆる大きな運動の特徴である。これは、すでに起こり、抗うことのできない事実の一つであって、きっと神が人類について持つ計画のうちにあるのだろう。
  - id: gz-c01-022
    section_id: gz-c01
    kind: paragraph
    origin: source
    source_text: Au sein d'un tel fait, l'empire du mot démocratie n'est point un accident local, passager. C'est le développement, d'autres diraient le déchaînement de la nature humaine tout entière, sur toute la ligne et à toutes les profondeurs de la société. Et par conséquent la lutte flagrante, générale, continue, inévitable, de ses bons et de ses mauvais penchants, de ses vertus et de ses vices, de toutes ses passions et de toutes ses forces pour perfectionner et pour corrompre, pour élever et pour abaisser, pour créer et pour détruire. C'est là désormais l'état social, la condition permanente de notre nation.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n21/mode/1up
        source_sequence: 28
        printed_page: '14'
        printed_page_end: '15'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c01-022-print
    translation_status: reviewed
    translation_ja: このような事実のもとでは、民主主義という言葉の支配は、一地方に起きた一時の偶然ではない。人間の本性が、そのまま全体として、社会の隅々に、あらゆる深さにわたって発現することだ。解き放たれて荒れ狂うのだ、と言う人もいるだろう。したがって、善い性向と悪い性向、徳と悪徳、あらゆる情念とあらゆる力が、物事をよりよくしようと、また腐らせようと、高めようと、また引き下ろそうと、つくり出そうと、また壊そうと、あからさまに、隅々で、絶えず、避けがたく闘うことだ。これがこれからの社会のありさまであり、わが国が恒常的に置かれる状況である。
  - id: gz-c02-heading
    section_id: gz-c02
    kind: heading
    origin: source
    source_text: CHAPITRE DEUXIÈME.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n26/mode/1up
        source_sequence: 29
        printed_page: '19'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-heading-print
    translation_status: reviewed
    translation_ja: 第二章
  - id: gz-c02-title
    section_id: gz-c02
    kind: heading
    origin: source
    source_text: Du gouvernement dans la démocratie.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n26/mode/1up
        source_sequence: 30
        printed_page: '19'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-title-print
    translation_status: reviewed
    translation_ja: 民主社会における政府について
  - id: gz-c02-001
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: Il y a des hommes que cette lutte n'inquiète point. Ils ont pleine confiance dans la nature humaine. Selon eux, laissée à elle-même, elle va au bien. Tous les maux de la société viennent des gouvernements qui corrompent l'homme en le violentant ou en le trompant. La liberté, la liberté en toutes choses et pour tous. Presque toujours elle suffira à éclairer ou à contenir les volontés, à prévenir le mal ou à le guérir. A côté de la liberté, un peu de gouvernement, le moins possible, pour réprimer le désordre extrême et matériel.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n26/mode/1up
        source_sequence: 31
        printed_page: '19'
        printed_page_end: '20'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-001-print
    translation_status: reviewed
    translation_ja: この闘いを心配しない人たちがいる。彼らは人間の本性をすっかり信頼している。放っておけば、人間の本性は善に向かうと考える。社会の悪はすべて、暴力や欺きによって人間を腐らせる政府から来る。大切なのは自由、あらゆる事柄について、すべての人に自由を与えることだ。ほとんどいつも、自由さえあれば、人々の意志を導き、抑え、悪を防ぎ、正すことができる。自由のかたわらには、現に目に見えるひどい混乱を抑えるために、ほんの少し、できるかぎりわずかな政府があればよい。
  - id: gz-c02-002
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: D'autres ont, pour se rassurer contre le triomphe du mal dans l'homme et dans la société, un moyen plus décisif. Il n'y a, disent-ils, point de mal naturel et nécessaire, car nul penchant humain n'est mauvais en soi; il ne devient tel que parce qu'il n'atteint pas le but auquel il aspire. C'est un courant qui déborde, ne pouvant couler. Que la société soit organisée de telle sorte que tous les instincts de l'homme y trouvent chacun sa place et sa satisfaction; le mal disparaîtra; la lutte cessera; et toutes les forces humaines concourront harmonieusement au bien social.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n27/mode/1up
        source_sequence: 32
        printed_page: '20'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-002-print
    translation_status: reviewed
    translation_ja: 別の人たちは、人間と社会のなかで悪が勝たないようにするために、もっと決定的な手段を持っている。生まれつきの、避けようのない悪などない、と彼らは言う。人の性向には、それ自体で悪いものは一つもなく、目指すものに届かないために悪に変わるだけなのだ。水が流れる先を失い、あふれ出すようなものだ。人間の本能の一つひとつに居場所と満足が得られるよう、社会を組織すればよい。そうすれば、悪は姿を消し、闘いは終わり、人間のあらゆる力が調和して、社会全体の善のためにはたらくだろう。
  - id: gz-c02-003
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: Les premiers méconnaissent l'homme; les seconds méconnaissent l'homme et nient Dieu.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n27/mode/1up
        source_sequence: 33
        printed_page: '20'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-003-print
    translation_status: reviewed
    translation_ja: 前の人々は人間を見誤っている。後の人々は人間を見誤り、神を否定している。
  - id: gz-c02-004
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: Que tout homme descende en lui-même et s'observe attentivement. Pour peu qu'il sache regarder et qu'il consente à voir, il sera profondément troublé de la guerre incessante que se livrent en lui les bons et les mauvais penchants, la raison et le caprice, le devoir et la passion, le bien et le mal, pour les appeler par leur nom. On contemple avec anxiété les agitations, les chances extérieures de la vie humaine. Que serait-ce si on assistait aux agitations, aux chances intérieures de l'âme humaine? C'est là qu'il faut voir combien en un jour, en une heure, il peut se rencontrer de périls, de pièges, d'ennemis, de combats, de victoires et de revers! Je ne dis pas cela pour décourager l'homme ni pour humilier sa liberté. Il est appelé à vaincre dans cette lutte de la vie, et c'est à sa liberté qu'appartient l'honneur de vaincre. Mais la victoire est impossible pour lui, et sa défaite est certaine s'il n'a une idée juste et un sentiment profond de ses dangers, de ses faiblesses et des secours dont il a besoin. Il y a une immense ignorance de la nature de l'homme et de sa condition à croire que, laissée à elle-même, la liberté humaine va au bien et peut y suffire. C'est l'erreur de l'orgueil; erreur qui énerve du même coup l'ordre moral et l'ordre politique, le gouvernement intérieur de l'homme et le gouvernement général de la société.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n28/mode/1up
        source_sequence: 34
        printed_page: '21'
        printed_page_end: '22'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-004-print
    translation_status: reviewed
    translation_ja: 誰もが自分の内面に降りていき、注意深く観察してほしい。少しでも見方を知り、見る勇気があるなら、自分のうちで絶えず戦われる戦争に、深く動揺するだろう。善い性向と悪い性向、理性と気まぐれ、義務と情念。名をはっきり言えば、善と悪の戦争である。私たちは人の一生を揺るがす外の動きや浮き沈みを、不安な思いでながめる。だが魂のうちの動きや浮き沈みを目の当たりにしたら、どうだろう。一日、一時間のうちに、どれほどの危険、わな、敵、戦い、勝利、敗北に出会いうるか、そこでこそ見て取れる。私は人間の気をくじくためにも、人間の自由をおとしめるためにも、こんなことを言うのではない。人間は人生の闘いに勝つよう求められており、その勝利の栄誉は人間の自由に属する。しかし、自分の危険と弱さ、必要とする助けについて正しく知り、深く感じ取らなければ、勝利はありえず、敗北は避けられない。放っておけば人の自由は善へ向かい、自由だけで足りると信じるのは、人間の本性とその置かれた条件について、途方もなく無知である。思い上がりから来る誤りだ。道徳の秩序も政治の秩序も、人間が自分の内面を治める力も社会全体を治める力も、この誤りによって一度に弱まる。
  - id: gz-c02-005
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: Car la lutte est la même, et le péril aussi pressant, et le secours aussi nécessaire dans la société que dans l'homme. Beaucoup de ceux qui vivent aujourd'hui ont eu cette destinée de voir, plusieurs fois dans le cours de leur vie, l'édifice social près de se dissoudre, et ses appuis, ses liens manquant de toutes parts. Sur quelle immense étendue, avec quelle effroyable rapidité ont éclaté, à chaque épreuve semblable, toutes les causes de guerre et de mort sociale qui fermentent incessamment au milieu de nous! Qui n'a tressailli à cette révélation soudaine des abîmes sur lesquels vit la société, et des frêles barrières qui l'en séparent, et des légions destructives qui en sortent dès qu'ils s'entr'ouvrent? Pour moi, j'ai assisté, jour par jour, heure par heure, à la plus pure, à la plus sage, à la plus douce, à la plus courte de ces secousses redoutables; j'ai vu, en juillet 1830, dans les rues et dans les palais, à la porte des conseils nationaux et au sein des réunions populaires, cette société livrée à elle-même qui faisait ou regardait faire la révolution. Et en même temps que j'admirais tant de sentiments généreux, tant d'actes d'intelligence forte, de vertu dévouée et de modération héroïque, je frissonnais en voyant s'élever et grossir, de minute en minute, un vaste flot d'idées insensées, de passions brutales, de velléités perverses, de fantaisies terribles près de se répandre et de tout submerger, sur un sol qu'aucune digue ne défendait plus. La société venait de repousser victorieusement la ruine de ses lois et de son honneur, et elle était sur le point de tomber en ruines elle-même au milieu de sa victoire. C'est à cette lumière que j'ai appris les conditions vitales de l'ordre social et la nécessité de la résistance pour le salut.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n29/mode/1up
        source_sequence: 35
        printed_page: '22'
        printed_page_end: '24'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-005-print
    translation_status: reviewed
    translation_ja: 人間のうちにも社会のうちにも、同じ闘いがある。危険は同じように差し迫り、助けも同じように欠かせない。いま生きている人の多くは、一生のあいだに何度も、社会という建物が崩れかけ、支えるものも結びつけるものも、いたるところで失われるのを見てきた。こんな試練があるたびに、われわれのただなかでたえずくすぶっていた戦いと社会の死の種が、どれほど広い範囲に、どれほど恐ろしい速さで噴き出したことか。社会が深淵の上に暮らし、それとのあいだを隔てるのはもろい柵しかなく、口が開きかけたとたんに破壊の勢力が大挙して出てくる。この光景がにわかに目の前に現れたとき、身震いしなかった者がいるだろうか。私はこうした恐ろしい激動のうち、最も純粋で、最も賢明で、最も穏やかで、最も短かったものを、一日ずつ、一時間ずつこの目で見た。一八三〇年七月、通りでも宮殿でも、国の評議の場の入口でも民衆の集会でも、自分の力だけに委ねられた社会が、革命を起こし、あるいは革命が起こるのを見ていた。気高い心情、知性の力、献身的な徳、英雄的な節度が、どれほど多くの行動に現れたかに感嘆する一方で、正気を失った考え、粗暴な情念、邪悪な欲望、恐ろしい気まぐれの大波が刻一刻と起こり、ふくれ上がるのを見て、私は震えた。もはやどんな堤にも守られていない地に、その大波は今にもあふれ出し、すべてを水没させようとしていた。社会は自らの法律と名誉を滅ぼそうとする力を撃退したばかりなのに、勝利のただなかで、自分自身が廃墟になる寸前だった。このことを目の当たりにして、社会の秩序を生かす条件を、そして社会が助かるには抵抗が必要なことを、私は知った。
  - id: gz-c02-006
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: Résister, non-seulement au mal, mais au principe du mal, non-seulement au désordre, mais aux passions et aux idées qui enfantent le désordre, c'est la mission essentielle, c'est le premier devoir de tout gouvernement. Et plus la démocratie a d'empire, plus il importe que le gouvernement garde son vrai caractère et joue son vrai rôle dans la lutte dont la société devient le théâtre. Pourquoi tant de sociétés démocratiques, quelques unes si brillantes, ont-elles si promptement péri? Parce qu'elles n'ont pas souffert qu'au milieu d'elles le gouvernement fît son devoir et son métier. Elles ont fait plus que le réduire à la faiblesse; elles l'ont condamné au mensonge. C'est la triste condition des gouvernements démocratiques que, chargés de réprimer le désordre, on les veut complaisants et flatteurs pour les causes du désordre. On leur demande d'arrêter le mal quand il éclate, et on leur commande de l'encenser tant qu'il couve. Je ne connais rien de plus déplorable que ces pouvoirs qui, dans la lutte des bons et des mauvais principes, des bonnes et des mauvaises passions, plient eux-mêmes à chaque instant le genou devant les mauvaises passions et les mauvais principes, et puis essaient de se redresser pour combattre leurs excès. Vous ne voulez pas des excès; réprouvez-les dans leur source. Vous voulez la liberté, le développement large et glorieux de l'humanité; vous avez raison. Connaissez donc les conditions, prévoyez les conséquences de ce grand fait. Ne vous aveuglez pas sur les périls, sur les combats qu'il fera éclater. Et dans ces combats et ces périls, n'exigez pas de vos chefs qu'ils soient hypocrites ou faibles devant l'ennemi; ne leur imposez pas le culte des idoles, fussiez-vous vous-mêmes les idoles; permettez-leur, enjoignez-leur de n'adorer, de ne servir que le vrai Dieu.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n31/mode/1up
        source_sequence: 36
        printed_page: '24'
        printed_page_end: '26'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-006-print
    translation_status: reviewed
    translation_ja: 悪に抵抗するだけでなく悪の根に抵抗すること、混乱に抵抗するだけでなく混乱を生む情念と考えに抵抗すること。これはどの政府にも課された根本の使命であり、第一の義務だ。民主主義の及ぼす力が強くなるほど、社会を舞台に展開する闘いのなかで、政府が本来の性格を保ち、本来の役割を果たすことが重要になる。華々しく栄えたものさえある多くの民主社会が、なぜこれほどたちまち滅びたのか。社会の中で政府が義務を果たし、本来の仕事をすることを、社会が許さなかったからだ。政府を無力にしただけでなく、うそをつくよう強いたのである。混乱を抑える責任を負いながら、混乱の原因には調子を合わせ、こびへつらうよう求められる。これが民主政の政府の悲しい境遇だ。悪が噴き出すと、それを止めろと迫られ、くすぶっているあいだは、それを称賛せよと命じられる。善い原則と悪い原則が、善い情念と悪い情念が争っているとき、絶えず悪い情念や悪い原則に自ら膝を屈し、やがてその行きすぎに立ち向かおうと、立ち上がるような権力ほど、嘆かわしいものを知らない。行きすぎを望まないのであれば、源でそれを退けよ。自由を、広く輝かしい人類の発展を望むのは正しい。ならば、この大事な事実が成り立つ条件を知り、何をもたらすかを見通してほしい。そこから起こる危険や闘いに目をつぶってはいけない。そして、その危険や闘いに直面して、指導者に、敵の前で偽善的になったり弱腰になったりすることを求めないでほしい。たとえあなたがた自身が偶像であっても、偶像崇拝を押しつけてはならない。真の神だけをあがめ、真の神だけに仕えることを、認め、求めてほしい。
  - id: gz-c02-007
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: Je pourrais me donner le plaisir de rappeler ici les noms et la mémoire de tant de pouvoirs qui sont tombés honteusement pour s'être lâchement asservis ou prêtés aux erreurs et aux passions des démocraties qu'ils avaient mission de gouverner. J'aime mieux citer ceux qui ont glorieusement vécu en leur résistant. J'ai plus de goût à prouver la vérité par l'exemple des sages et de leurs succès que par celui des insensés et de leurs revers.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n33/mode/1up
        source_sequence: 37
        printed_page: '26'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-007-print
    translation_status: reviewed
    translation_ja: 治めるべき民主社会の誤りや情念に卑怯にも屈し、力を貸したために、恥ずべき没落を遂げた権力は数多い。その名を挙げ、どんな権力だったかを思い起こす楽しみを、ここで味わうこともできよう。だが私はむしろ、そうしたものに逆らって、誇り高く存続した権力を挙げたい。愚かな者の失敗を例にするより、賢い者の成功を例に、真理を示すことのほうが私の好みに合っている。
  - id: gz-c02-008
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: 'La France démocratique doit beaucoup à l''empereur Napoléon. Il lui a donné deux choses d''un prix immense: au dedans, l''ordre civil solidement constitué; au dehors, l''indépendance nationale fortement établie par la gloire. A-t-elle jamais eu un gouvernement qui l''ait plus rudement traitée, qui ait montré, pour les idées et les passions favorites de la démocratie, moins de complaisance? Dans l''ordre politique, Napoléon ne s''est préoccupé que de relever le pouvoir, de lui rendre les conditions de sa force et de sa grandeur. Il a vu là, pour une société démocratique comme pour toute autre, un intérêt national de premier ordre, et, selon lui, le premier des intérêts.'
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n33/mode/1up
        source_sequence: 38
        printed_page: '26'
        printed_page_end: '27'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-008-print
    translation_status: reviewed
    translation_ja: 民主社会となったフランスは、皇帝ナポレオンに多くを負っている。彼は二つの、値のつけようもないものをフランスに与えた。国内では、しっかりと築かれた市民生活の秩序、国外では、栄光によって確固たるものとなった国家の独立である。フランスをこれほど手荒に扱い、民主主義が好む考えや情念にこれほど迎合しない政府が、ほかにあっただろうか。政治の秩序についてナポレオンがただ一つ気にかけたのは、権力を立て直し、強さと偉大さの条件を取り戻させることだった。そこに、ほかのどんな社会にとってもそうであるように、民主社会にとっても、第一級の国益があると見た。彼には、それが何より先に立つ利益だった。
  - id: gz-c02-009
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: Mais Napoléon était un despote. S'il a bien compris et bien servi quelques-uns des grands intérêts de la France, il en a profondément méconnu et blessé d'autres non moins sacrés. Comment aurait-il été favorable aux instincts politiques de la démocratie, lui si hostile à la liberté?
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n34/mode/1up
        source_sequence: 39
        printed_page: '27'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-009-print
    translation_status: reviewed
    translation_ja: しかしナポレオンは専制君主だった。フランスにとって大きな利益のいくつかをよく理解して、よくそれに尽くしはしたが、それに劣らず神聖な別の利益を、ひどく見損ない、傷つけた。自由にそれほど敵意を抱いた人間が、どうして民主社会の政治的な欲求に好意を持てただろう。
  - id: gz-c02-010
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: Je ne conteste point; je ne cours pas risque d'oublier que Napoléon était un despote, car je n'ai point eu à l'apprendre. Je le pensais quand il était là. Eût-il pu être autre? Eût-il pu accepter la liberté politique, et pouvions-nous alors la recevoir? Je ne décide pas cette question. Il y a des hommes, très-grands, qui conviennent à certaines crises maladives et passagères, non à l'état sain et durable de la vie des peuples. Peut-être Napoléon n'a-t-il été que l'un de ces hommes-là. Qu'il ait méconnu quelques-uns des principes vitaux de l'ordre social, quelques-uns des besoins essentiels de notre temps, personne n'en est plus convaincu que moi. Mais il a rétabli au sein de la France démocratique l'ordre et le pouvoir. Il a cru et prouvé qu'on pouvait servir et gouverner une société démocratique sans condescendre à tous ses penchants; c'est là sa grandeur.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n34/mode/1up
        source_sequence: 40
        printed_page: '27'
        printed_page_end: '28'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-010-print
    translation_status: reviewed
    translation_ja: それを否定はしない。ナポレオンが専制君主だったことを忘れる心配もない。私は後から教わったわけではないからだ。彼が権力の座にいたときから、そう思っていた。彼には別のあり方ができたのか。政治の自由を受け入れられたのか。そして当時のわれわれに、その自由を受け取れたのか。ここでは答えを出さない。たいへん偉大であっても、ある種の一時的な病的危機には適していて、人民が健全な暮らしを長く続けるには適さない人々がいる。ナポレオンも、そうした人の一人にすぎなかったのかもしれない。彼が社会の秩序を生かす原則のいくつかと、われわれの時代に欠かせないもののいくつかを見誤ったことは、私が誰よりもよく認めている。だが彼は、民主社会となったフランスのただなかに、秩序と権力を立て直した。民主社会のあらゆる性向に迎合しなくても、その社会に仕え、それを治められると信じ、実際に証明した。そこに彼の偉大さがある。
  - id: gz-c02-011
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: Washington ne ressemble point à Napoléon; celui-là n'était pas un despote. Il a fondé la liberté politique, en même temps que l'indépendance nationale de sa patrie. Il n'a fait servir la guerre qu'à la paix. Monté sans ambition au pouvoir suprême, il en est descendu sans regret, dès que le salut de sa patrie le lui a permis; il est le modèle des chefs de république démocratique. Qu'on examine sa vie, son âme, ses actes, ses pensées, ses paroles; on n'y trouvera pas, pour les passions et les idées favorites de la démocratie, une seule marque de condescendance, un seul instant de laisser-aller. Il a constamment lutté, lutté jusqu'à la fatigue et la tristesse, contre ses exigences. Nul homme n'a été plus profondément imbu de l'esprit de gouvernement, du respect de l'autorité, Il n'a jamais excédé les droits du pouvoir selon les lois de son pays; mais il a affirmé et maintenu ces droits, en principe comme en fait, aussi fermement, aussi fièrement qu'il l'eût pu faire dans un État ancien, monarchique ou aristocratique. Il était de ceux qui savent que, pas plus dans une république que dans une monarchie, pas plus dans une société démocratique que dans toute autre, on ne gouverne de bas en haut.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n35/mode/1up
        source_sequence: 41
        printed_page: '28'
        printed_page_end: '29'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-011-print
    translation_status: reviewed
    translation_ja: ワシントンはナポレオンとは似ていない。ワシントンは専制君主ではなかった。祖国の独立と同時に、政治の自由を樹立した。戦争を平和のためにしか用いなかった。野心からではなく最高の権力の座に昇り、祖国の安全がそれを許したとき、惜しむことなくその座を降りた。彼は民主共和国を率いる者の手本である。その生涯と心、行動、考え、言葉を調べてみれば、民主主義が好む情念や考えに迎合した跡も、なりゆきに任せておいた一瞬も、見つからないだろう。それらの要求に抗して、たえず、疲れ、憂うつになるまで闘った。統治の精神と権威への敬意が、彼ほど深く染みこんだ人はいなかった。彼は自国の法律が権力に認めた権利を、一度も踏み越えなかった。だが、王政や貴族政をとる古い国でそうするのに劣らないほど断固として、誇りを持って、原則のうえでも実際の行動においても、その権利を主張し、守った。王政でも共和政でも、民主社会でもどんな社会でも、下から上へと治めることはできないと知っている人々の一人だった。
  - id: gz-c02-012
    section_id: gz-c02
    kind: paragraph
    origin: source
    source_text: Les sociétés démocratiques n'ont point ce privilége que l'esprit de gouvernement y soit moins nécessaire, ni que ses conditions vitales y soient autres et moins élevées qu'ailleurs. Par une infaillible conséquence de la lutte qui s'établit infailliblement dans leur sein, le pouvoir y est incessamment appelé à se décider entre des impulsions contraires qui le sollicitent à se faire l'artisan du bien ou le complice du mal, le champion de l'ordre ou l'esclave du désordre. La fable du choix d'Hercule est son histoire de tous les jours, de tous les moments. Tout gouvernement, quels que puissent être sa forme et son nom, qui, soit par le vice de son organisation ou de sa situation, soit par la corruption ou la faiblesse de sa volonté, ne suffira pas à cette tâche inévitable, passera bientôt comme un fantôme malfaisant, ou perdra la démocratie au lieu de la fonder.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n36/mode/1up
        source_sequence: 42
        printed_page: '29'
        printed_page_end: '30'
    source_alignment:
      - source_id: masson-paris-1849
        original_unit_id: gz-c02-012-print
    translation_status: reviewed
    translation_ja: 民主社会だからといって、統治の精神がよそほど必要でないわけでも、統治が成り立つ条件がほかと違い、それほど高いものでなくてすむわけでもない。民主社会のうちに必ず起きる闘いの結果として、政府の権力はたえず正反対の力に引かれ、善を築く者か悪に手を貸す者か、秩序を守る者か混乱の奴隷かを選ぶように迫られる。ヘラクレスが道を選んだあの寓話は、政府にとって毎日、毎瞬の出来事なのである。形や名が何であろうと、組織や境遇に欠陥があるために、あるいは意志が腐り、弱いために、この避けがたい仕事を果たせない政府は、じきに災いをなす幻のように消え去るか、民主主義を築くどころか、それを滅ぼすかである。

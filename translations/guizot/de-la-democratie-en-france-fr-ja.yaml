    translation_ja: フランスを一七八九年へ引き戻すことはできない。当時フランスをとりこにした、思い上がった信頼と希望の熱狂に、もう一度投げ込むこともできない。あの時代には本物で、広く行き渡った熱意だった。若さのように自然にわき、経験のなさのように許しうるものだった。しかし、今では人為的で偽りの興奮にすぎない。悪い情念とばかげた空想の上に投げかけられる、薄くてそれすら覆えない布にすぎない。どんな救いようのない傲慢さがあれば、神が六十年間、われわれの前に惜しみなく示してきた教えを、拒みうるのか。神は、われわれ自身や人類に絶望せよとは言わない。人類の進歩や未来、人類の苦しみにも栄光にも深く寄せる、やさしい共感を捨てよとは言わない。人類を偶像にしてはならないと言うのである。おもねりも冷淡さも抜きに、人類をあるがままに見て、神自身が定めた法に従って愛し、仕えるよう命じるのである。今の時代に残る道徳の熱を消そうとも、すでにこれほど冷め、揺らいでいる心に、さらに疑いと無関心を投げ込もうとも、私はまったく思わない。だが、思い違いをしてはならない。革命に向かって引き返すことで、フランスが自信を持ち、活気づいて進めるのではない。そこには枯れた泉しかなく、疲れた社会が渇きをいやし、さわやかになるため、そこへ行くことはない。社会に活気がないことを嘆き、国々を偉大にするあの信念、あの心の力が、社会の中によみがえることを望むだろう。だが革命の精神にそれを求めてはならない。革命の精神にはそれを取り戻す力はない。騒ぎは起こせても、われわれを動かすものは与えられない。まだ焼き尽くすことはできても、照らしも温めもしない。信念をよみがえらせるどころか、疑いと戸惑いを広げる。たしかにフランスは、道徳の面で立ち直り、力を取り戻す必要がある。定まっており、広く認められる原則をもう一度信じ、そこに愛着を持つことが必要だ。だが革命の精神には、そのような仕事のためにできることが何もない。その姿、その呼びかけ、その予言、その思い出、その言葉は、仕事を成し遂げるどころか、妨げ、遅らせるだけである。この栄誉にあずかるのは、ほかの精神的な力、ほかの精神である。
  - id: gz-c07-018
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: 'L''esprit de famille, l''empire des sentiments et des mœurs domestiques, y jouera un rôle principal. La famille est, maintenant plus que jamais, le premier élément et le dernier rempart de la société. Pendant que, dans la société générale, toutes choses deviennent de plus en plus mobiles, personnelles, viagères, c''est dans la famille que demeurent indestructibles le besoin de la durée et l''instinct des sacrifices du présent à l''avenir. C''est là que se retranchent et se maintiennent, comme dans un asile tutélaire, des idées et des vertus qui font contre-poids au mouvement excessif, désordonné, inévitablement suscité dans les grands foyers de civilisation des grands États. Nos grandes villes, le tourbillon de leurs affaires et de leurs plaisirs, les tentations et les perturbations qu''elles répandent incessamment, jetteraient bientôt la société tout entière dans un état de fermentation et de relâchement déplorable si la vie domestique partout répandue sur le territoire, son activité calme, ses intérêts permanents, ses liens immuables n''opposaient à ce péril de solides barrières. C''est au sein de la vie domestique et sous son influence que se maintient plus sûrement la moralité privée, base de la moralité publique. C''est là aussi, et aujourd''hui presque uniquement là, que se développent la partie affectueuse de notre nature, l''amitié, la reconnaissance, le dévouement, les liens qui unissent les cœurs dans le rapprochement des destinées. Des temps ont été, des sociétés ont existé où ces sentiments individuels prenaient aussi leur place dans la vie publique, où les affections dévouées se combinaient avec les relations politiques. Ces temps ne sont plus et ne peuvent guère revenir. Dans nos sociétés si vastes, si compliquées, au milieu du mouvement qui les emporte, les intérêts généraux, les idées générales, les sentiments des masses et les combinaisons des partis président seuls à la vie publique. Les affections personnelles sont des liens trop délicats pour influer puissamment dans les luttes de ces moteurs impitoyables. Cependant ce n''est jamais sans un grave dommage qu''on étouffe, dans tel ou tel des champs où se déploie l''activité humaine, l''un des éléments vitaux de la nature humaine: c''est une grande beauté et une grande force de moins, dans les relations de la vie politique, que cette absence presque complète des sentiments tendres et dévoués, cette domination presque exclusive des idées abstraites et des intérêts généraux ou personnels. Il importe infiniment à la société que ces dispositions, je dirai volontiers ces passions affectueuses du cœur de l''homme aient leur sphère assurée où elles se déploient librement, et que de là elles viennent quelquefois, par quelques beaux exemples, faire acte de présence et de puissance dans cette sphère politique où elles paraissent si rarement. C''est au sein de la vie domestique et par les affections de famille que ce but social est atteint. En même temps qu''elle est un principe de stabilité et de moralité, la famille est aussi un foyer d''affection et de dévouement où ces nobles parties de notre nature trouvent des satisfactions qu''elles n''obtiendraient point ailleurs, et d''où elles peuvent, à certains jours, dans certaines circonstances, se répandre au dehors, à l''honneur comme au profit de la société.'
    source_languages:
      - fr

    translation_ja: 家族の精神、家庭の感情と風習が持つ力は、その主要な役割を担う。家族は今こそ、社会の第一の要素であり、最後のとりでである。社会全体では何もかもがますます流動的で、個人だけに属し、その一生に限られる。一方、物事が長く続くことを求める気持ちと、未来のために現在を犠牲にしようとする本能は、家庭では壊れない。思いや徳は、守られた避難所にいるように、そこに身を置き、保たれる。大国の文明の中心で避けがたく起こる、行きすぎた無秩序な動きと、釣り合いを取るのである。大都市では、仕事と楽しみが渦を巻き、誘惑と騒ぎを絶えず広げる。国土の隅々にある家庭生活、その穏やかな活動、変わらない利害、揺るがない結びつきが、堅固な壁となってこの危険に立ちはだからなければ、じきに社会全体が、嘆かわしい騒乱と緩みのなかに投げ込まれるだろう。公の道徳の土台である私生活の道徳が、最もよく保たれるのも、家庭生活のうちであり、その影響のもとである。そればかりか、われわれの本性のうち愛情にかかわる部分、友情、感謝、献身、互いの運命を近づけ心を結ぶものが育つのも、そこであり、今日ではほとんどそこだけである。こうした一人ひとりの感情が公の生活にも居場所を持ち、人に尽くす愛情が政治上の関係と結びついた時代や社会が、かつてはあった。その時代は去り、もうほとんど戻りようがない。現代の社会は広大で複雑で、激しい動きにさらされており、公の生活を導くのは全体の利害、一般的な考え、大衆の感情、党派の組み合わせだけである。個人の愛情がつくる絆はあまりに繊細であり、容赦なく動くこれらの力の争いには、大きく作用できない。しかし、人間が活動を広げるいずれかの分野で、人間の本性に欠かせない一要素を押し殺すことには、いつも大きな損失が伴う。やさしい献身の気持ちがほとんど見られず、抽象的な考えと全体の利害、あるいは個人の利害ばかりが支配することで、政治の世界の人間関係は、美しさと力の大きな部分を失っている。こういう心持ち、人間の心の愛情深い情念と呼んでもよいものが、守られた場を持ち、そこで自由に広がることは、社会にとってかぎりなく重要だ。そればかりか、ときにはそこから出て、幾つかの立派な実例によって、めったに姿を見せない政治の中で、自分の存在と力を示すことも大切である。この社会的な目的は、家庭生活のなかで、家族の愛情によって果たされる。家族は安定と道徳のよりどころであると同時に、愛情と献身の宿る場所でもある。人間の本性のこうした気高い面は、そこでほかでは得られない満足を見いだし、時と場合によっては、そこから世へ広がり、社会にとって名誉に、また利益にもなる。
  - id: gz-c07-019
    section_id: gz-c07
    kind: paragraph
    origin: source
    source_text: Après l'esprit de famille, c'est de l'esprit politique qu'aujourd'hui la France a le plus de services à attendre et doit cultiver avec plus de soin les progrès. L'esprit politique consiste essentiellement à vouloir et à savoir prendre sa part et jouer son rôle régulièrement, sans emploi de la violence, dans les affaires de la société. Plus l'esprit politique se développe, plus il inculque aux hommes le besoin et l'habitude de voir les choses comme elles sont, dans leur exacte vérité. Voir ce qu'on désire et non ce qui est, se faire complaisamment illusion à l'égard des faits, comme si les faits devaient avoir la même complaisance et se transformer au gré de notre désir, c'est la faiblesse radicale des hommes et des peuples encore nouveaux dans la vie politique, et la source des plus funestes erreurs. Voir ce qui est, c'est le premier et excellent caractère de l'esprit politique. Il en résulte cet autre caractère, non moins excellent, qu'en apprenant à ne voir que ce qui est, on apprend aussi à ne vouloir que ce qui se peut. L'exacte appréciation des faits amène la mesure dans les intentions et dans les prétentions. Véridique avec lui-même, l'esprit politique devient prudent et modéré. Rien ne dispose plus à la modération que la pleine connaissance de la vérité des choses, car il est rare qu'elle mette dans un seul bassin tout son poids. L'esprit politique s'élève ainsi naturellement, par sagesse quand ce n'est pas par moralité, à ce qui est sa loi fondamentale et son mérite essentiel, au respect du droit, base unique de la stabilité sociale; car hors du droit il n'y a que la force, qui est essentiellement variable et précaire. Et le respect du droit suppose ou enfante le respect de la loi, source habituelle du droit. Et le respect de la loi affermit le respect des pouvoirs qui font ou qui appliquent la loi. Ce qui est réel, ce qui est possible, le droit, la loi, les pouvoirs légaux, voilà quelles sont les constantes préoccupations de l'esprit politique, ce qu'il contracte l'habitude de chercher et de respecter toujours. Il maintient ou rétablit ainsi un principe moral de fixité dans les rapports des hommes, et un principe moral d'autorité dans le gouvernement des États.
    source_languages:
      - fr
    source_locations:
      - source_id: masson-paris-1849
        precision: page
        url: https://archive.org/details/democratiefrance00guiz/page/n149/mode/1up

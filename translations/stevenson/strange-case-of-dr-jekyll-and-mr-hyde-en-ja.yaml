    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-031"
    "translation_ja": "男はグラスを唇に運び、一息に飲んだ。叫び声がした。よろめき、ふらつき、テーブルをつかんでしがみつき、充血した目を見開き、口を開けてあえいだ。私が見つめていると、変化が起きたように思った。男の体がふくれるようだった。顔が急に黒くなり、目鼻立ちが溶けて別の形を取るかに見えた。次の瞬間、私ははね起きて壁際まで飛びすさり、その怪異から身をかばうように両腕を上げ、心は恐怖に呑み込まれていた。"
    "translation_status": "reviewed"
  - "id": "c09-032"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“O God!” I screamed, and “O God!” again and again; for there before my eyes—pale and shaken, and half fainting, and groping before him with his hands, like a man restored from death—there stood Henry Jekyll!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[32]"

    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c06-002"
    "translation_ja": "一月八日、アタスンは博士の家の気のおけない数人の食卓に招かれた。ラニョンもいて、主人は離れがたい三人の親友だったころのように、一人の顔に、またもう一人の顔にと、目をやっていた。十二日、さらに十四日には、戸口で弁護士は断られた。「先生は家におこもりで、どなたにもお会いになりません」とプールは言った。十五日にもう一度訪ねたが、また断られた。ここ二か月というもの、ほぼ毎日友人に会う習慣ができていたので、この孤独のぶり返しが気にこたえた。五晩目にはゲストを自宅の夕食に呼び、六晩目にはラニョン博士の家へ出かけた。"
    "translation_status": "reviewed"
  - "id": "c06-003"
    "section_id": "chapter-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There at least he was not denied admittance; but when he came in, he was shocked at the change which had taken place in the doctor’s appearance. He had his death-warrant written legibly upon his face. The rosy man had grown pale; his flesh had fallen away; he was visibly balder and older; and yet it was not so much these tokens of a swift physical decay that arrested the lawyer’s notice, as a look in the eye and quality of manner that seemed to testify to some deep-seated terror of the mind. It was unlikely that the doctor should fear death; and yet that was what Utterson was tempted to suspect. “Yes,” he thought; “he is a doctor, he must know his own state and that his days are counted; and the knowledge is more than he can bear.” And yet when Utterson remarked on his ill looks, it was with an air of great firmness that Lanyon declared himself a doomed man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[8]/p[3]"
        "line_start": 1584
        "source_sequence": 175
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"

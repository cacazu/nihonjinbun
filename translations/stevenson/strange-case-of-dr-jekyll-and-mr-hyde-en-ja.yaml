  - "id": "c09-003"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Dear Lanyon,—You are one of my oldest friends; and although we may have differed at times on scientific questions, I cannot remember, at least on my side, any break in our affection. There was never a day when, if you had said to me, ‘Jekyll, my life, my honour, my reason, depend upon you,’ I would not have sacrificed my left hand to help you. Lanyon, my life, my honour, my reason, are all at your mercy; if you fail me to-night, I am lost. You might suppose, after this preface, that I am going to ask you for something dishonourable to grant. Judge for yourself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[3]"
        "line_start": 2498
        "source_sequence": 304
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-003"
    "translation_ja": "親愛なるラニョン。君は僕のもっとも古い友人のひとりだ。学問の問題でときおり意見が違ったとはいえ、少なくとも僕の側では、友情が一度でも途切れた覚えはない。もし君が『ジキル、僕の命も名誉も正気も君にかかっている』と言ったら、君を助けるために左手一本を差し出さなかった日とてない。ラニョン、僕の命も名誉も正気も、すべて君の情けにすがっている。今夜君に見放されたら、僕は終わりだ。こんな前置きを読めば、不名誉なことを引き受けてくれと頼むつもりかと思うだろう。自分で判断してくれ。"
    "translation_status": "reviewed"
  - "id": "c09-004"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I want you to postpone all other engagements for to-night—ay, even if you were summoned to the bedside of an emperor; to take a cab, unless your carriage should be actually at the door; and with this letter in your hand for consultation, to drive straight to my house. Poole, my butler, has his orders; you will find him waiting your arrival with a locksmith. The door of my cabinet is then to be forced; and you are to go in alone; to open the glazed press (letter E) on the left hand, breaking the lock if it be shut; and to draw out, with all its contents as they stand, the fourth drawer from the top or (which is the same thing) the third from the bottom. In my extreme distress of mind, I have a morbid fear of misdirecting you; but even if I am in error, you may know the right drawer by its contents: some powders, a phial and a paper book. This drawer I beg of you to carry back with you to Cavendish Square exactly as it stands."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[4]"
        "line_start": 2509
        "source_sequence": 305
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-004"
    "translation_ja": "今夜はほかの約束をすべて繰り延べてほしい。たとえ皇帝の病床に呼ばれていてもだ。自家用馬車がちょうど戸口にいるのでない限り辻馬車を拾い、見返せるようこの手紙を手に持って、まっすぐ僕の家へ乗りつけてくれ。執事のプールには指示してある。錠前師と一緒に君の到着を待っているはずだ。そこで僕の私室の戸をこじ開けてもらい、君ひとりで入ってほしい。左手にあるＥの字の付いたガラス戸棚を開け、錠がかかっていたら壊して、上から四番目、言い換えれば下から三番目の引き出しを、中身をそっくりそのままにして抜き取ってくれ。気がひどく動転していて、指図を間違えるのではないかと病的なほど恐れている。だが僕が間違っていても、正しい引き出しは中身でわかる。粉の包みがいくつか、小瓶が一つ、紙の帳面が一冊だ。その引き出しをありのまま、キャヴェンディッシュ・スクエアの君の家へ持ち帰ってほしい。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 538
          "end": 573
          "exact": "with all its contents as they stand"
      - "side": "translation"

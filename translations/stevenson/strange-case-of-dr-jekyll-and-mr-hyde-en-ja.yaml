  - "id": "c09-009"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“P.S.—I had already sealed this up when a fresh terror struck upon my soul. It is possible that the post-office may fail me, and this letter not come into your hands until to-morrow morning. In that case, dear Lanyon, do my errand when it shall be most convenient for you in the course of the day; and once more expect my messenger at midnight. It may then already be too late; and if that night passes without event, you will know that you have seen the last of Henry Jekyll.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[9]"
        "line_start": 2558
        "source_sequence": 310
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-009"
    "translation_ja": "追伸。いったん封をしたところへ、新しい恐怖が僕の胸を打った。郵便が当てにならず、この手紙が明朝まで君の手に入らないこともありうる。その場合には、ラニョン、その日のうちのいちばん都合のよい時間に僕の用を済ませ、その晩も、やはり十二時に僕の使いを待ってくれ。そのときにはもう手遅れかもしれない。もしその夜何事も起こらずに過ぎれば、君がふたたびヘンリー・ジキルを見ることはないと知ってくれたまえ」"
    "translation_status": "reviewed"
  - "id": "c09-010"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Upon the reading of this letter, I made sure my colleague was insane; but till that was proved beyond the possibility of doubt, I felt bound to do as he requested. The less I understood of this farrago, the less I was in a position to judge of its importance; and an appeal so worded could not be set aside without a grave responsibility. I rose accordingly from table, got into a hansom, and drove straight to Jekyll’s house. The butler was awaiting my arrival; he had received by the same post as mine a registered letter of instruction, and had sent at once for a locksmith and a carpenter. The tradesmen came while we were yet speaking; and we moved in a body to old Dr. Denman’s surgical theatre, from which (as you are doubtless aware) Jekyll’s private cabinet is most conveniently entered. The door was very strong, the lock excellent; the carpenter avowed he would have great trouble and have to do much damage, if force were to be used; and the locksmith was near despair. But this last was a handy fellow, and after two hour’s work, the door stood open. The press marked E was unlocked; and I took out the drawer, had it filled up with straw and tied in a sheet, and returned with it to Cavendish Square."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[10]"
        "line_start": 2568
        "source_sequence": 311
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-010"
    "translation_ja": "この手紙を読んで、同業の友人は気が変になったと私は確信した。だが疑いの余地もなくそれが立証されるまでは、言われたようにする義務があると感じた。このごたまぜの話がわからなければわからないほど、その重大さを判断できる立場にはない。これだけの言葉で訴えられては、退けるには重大な責任がかかる。そこで私は食卓を立ち、二輪辻馬車に乗ってジキルの家へまっすぐ向かった。執事は私の来るのを待っていた。私と同じ便で指図の書留を受け取り、ただちに錠前師と大工を呼びにやったという。まだ話をしているうちに職人たちが着き、私たちは一団となって昔のデンマン博士の解剖講堂へ移った。ご承知の通り、ジキルの私室へはそこから入るのがいちばん便利なのだ。戸はひどく頑丈で、錠も立派なものだった。腕ずくならひどく難儀で、あちこちひどく傷めずにはできないと大工は打ち明け、錠前師のほうもほとんどお手上げだった。だが錠前師は腕の立つ男で、二時間の仕事ののちには戸は開いていた。Ｅと印した戸棚には鍵はかかっていなかった。私は引き出しを抜き、中に藁を詰めさせ、敷布で縛って、それを持ってキャヴェンディッシュ・スクエアに帰った。"
    "translation_status": "reviewed"
  - "id": "c09-011"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Here I proceeded to examine its contents. The powders were neatly enough made up, but not with the nicety of the dispensing chemist; so that it was plain they were of Jekyll’s private manufacture; and when I opened one of the wrappers I found what seemed to me a simple crystalline salt of a white colour. The phial, to which I next turned my attention, might have been about half full of a blood-red liquor, which was highly pungent to the sense of smell and seemed to me to contain phosphorus and some volatile ether. At the other ingredients I could make no guess. The book was an ordinary version book and contained little but a series of dates. These covered a period of many years, but I observed that the entries ceased nearly a year ago and quite abruptly. Here and there a brief remark was appended to a date, usually no more than a single word: “double” occurring perhaps six times in a total of several hundred entries; and once very early in the list and followed by several marks of exclamation, “total failure!!!” All this, though it whetted my curiosity, told me little that was definite. Here were a phial of some salt, and the record of a series of experiments that had led (like too many of Jekyll’s investigations) to no end of practical usefulness. How could the presence of these articles in my house affect either the honour, the sanity, or the life of my flighty colleague? If his messenger could go to one place, why could he not go to another? And even granting some impediment, why was this gentleman to be received by me in secret? The more I reflected the more convinced I grew that I was dealing with a case of cerebral disease; and though I dismissed my servants to bed, I loaded an old revolver, that I might be found in some posture of self-defence."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[11]"
        "line_start": 2588
        "source_sequence": 312
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-011"
    "translation_ja": "そこでさっそく中身を調べた。粉はまずまずきれいに包んであったが、調剤薬剤師が作るような手際の細やかさはなく、ジキルが自分で調製したのは明らかだった。包みを一つ開けると、白い結晶の、ありふれた塩類らしきものが出てきた。次に注目した小瓶には、およそ半分ほど、血のように赤い液が入っていた。鼻に激しくつんと来る匂いから、リンと何か揮発性のエーテルを含むように私には思われた。ほかの成分は見当もつかない。帳面はありふれた訳文用の練習帳で、中身はほとんど日付の列だけだった。それは長年にわたったが、記入は一年近く前にひどく唐突に途切れていた。ここかしこの日付に短い注記が添えてあり、たいていはたった一語だった。全部で数百の記入のうち「ダブル」と書いた箇所が六つほど、また一覧のごく初めのほうで一度、いくつも感嘆符を添えて「完全な失敗！！！」とあった。すべて好奇心をそそりはしたが、はっきりしたことはほとんど教えてくれない。ここにあるのは小瓶と何かの塩類、それに、ジキルの研究ではあまりによくあることだが、何一つ実用に結びつかなかった一連の実験の記録だった。これらの品がわが家にあるかどうかが、どうしてあの軽率な同業者の名誉や正気や命にかかわるのだろう。使いの男が一方の家に行けるなら、なぜもう一方へは行けないのか。何か差し障りがあるとしても、なぜ私がその紳士をひそかに迎えねばならぬのだろう。思えば思うほど、脳の病気を相手にしているのだという確信が強まり、召使を皆寝かせはしたものの、身を守る備えぐらいはできるよう、古い連発拳銃に弾を込めた。"
    "translation_status": "reviewed"
  - "id": "c09-012"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Twelve o’clock had scarce rung out over London, ere the knocker sounded very gently on the door. I went myself at the summons, and found a small man crouching against the pillars of the portico."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[12]"
        "line_start": 2615
        "source_sequence": 313
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-012"
    "translation_ja": "十二時の鐘がロンドンじゅうに鳴り終わるか終わらないかに、戸のノッカーがごく控えめに鳴った。自分で応じに出てみると、小さな男が玄関先の柱に身を寄せてうずくまっていた。"
    "translation_status": "reviewed"
  - "id": "c09-013"
    "section_id": "chapter-09"
    "kind": "paragraph"

  - "id": "c06-010"
    "section_id": "chapter-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I am not surprised at that,” was the reply. “Some day, Utterson, after I am dead, you may perhaps come to learn the right and wrong of this. I cannot tell you. And in the meantime, if you can sit and talk with me of other things, for God’s sake, stay and do so; but if you cannot keep clear of this accursed topic, then in God’s name, go, for I cannot bear it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[8]/p[10]"
        "line_start": 1632
        "source_sequence": 182
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap06"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c06-010"
    "translation_ja": "「少しも不思議とは思わない」と答えがあった。「いつか、アタスン、僕が死んでから、君はこの件のいきさつをすっかり知るようになるかもしれない。僕の口からは言えん。それまでは、もしここに座って何かほかの話をしてくれるのなら、どうか頼む、いてくれ。しかしこの呪わしい話題を避けていられないのなら、後生だから帰ってくれ。僕には耐えられない」"
    "translation_status": "reviewed"
  - "id": "c06-011"
    "section_id": "chapter-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As soon as he got home, Utterson sat down and wrote to Jekyll, complaining of his exclusion from the house, and asking the cause of this unhappy break with Lanyon; and the next day brought him a long answer, often very pathetically worded, and sometimes darkly mysterious in drift. The quarrel with Lanyon was incurable. “I do not blame our old friend,” Jekyll wrote, “but I share his view that we must never meet. I mean from henceforth to lead a life of extreme seclusion; you must not be surprised, nor must you doubt my friendship, if my door is often shut even to you. You must suffer me to go my own dark way. I have brought on myself a punishment and a danger that I cannot name. If I am the chief of sinners, I am the chief of sufferers also. I could not think that this earth contained a place for sufferings and terrors so unmanning; and you can do but one thing, Utterson, to lighten this destiny, and that is to respect my silence.” Utterson was amazed; the dark influence of Hyde had been withdrawn, the doctor had returned to his old tasks and amities; a week ago, the prospect had smiled with every promise of a cheerful and an honoured age; and now in a moment, friendship, and peace of mind, and the whole tenor of his life were wrecked. So great and unprepared a change pointed to madness; but in view of Lanyon’s manner and words, there must lie for it some deeper ground."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[8]/p[11]"
        "line_start": 1641
        "source_sequence": 183
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap06"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c06-011"
    "translation_ja": "帰宅するやアタスンは机に向かってジキルに手紙を書き、屋敷に入れてくれないことに不平を述べ、ラニョンとの不幸な決裂の理由を尋ねた。翌日、長い返事が来た。あちこちで言葉がひどく胸に迫り、ときどき趣旨に謎めいた暗さがあった。ラニョンとの仲違いは修復できないという。「僕は古い友を責める気はない」とジキルは書いていた。「しかし僕らは二度と顔を合わせてはならないという彼の考えに、僕も同意している。これからは極力、人と隔たって暮らすつもりだ。君にさえしばしば戸を閉ざすかもしれないが、驚かないでほしいし、僕の友情を疑いもしないでほしい。僕は僕の暗い道を行くのだ、どうかそうさせてくれ。僕は、名を明かせない罰と危険をわが身に招いた。僕が罪人のかしらならば、苦しむ者のかしらでもある。人をこれほど打ちのめす苦しみと恐怖を容れる場所が、この地上にあるとは夢にも思わなかった。この宿命を軽くするために君にできることは、アタスン、ただ一つだ。僕の沈黙を尊重してくれ」。アタスンは愕然とした。ハイドの暗い感化は去り、博士は昔の仕事に、昔の友情に帰った。一週間前には、その先に朗らかで人に敬われる老境を約束するものばかりが微笑んでいた。それが今、一瞬にして友情も、心の安らぎも、暮らし全体の筋道も破壊された。あまりに大きく、前触れのない変化は狂気を思わせたが、ラニョンの態度と言葉を考えれば、もっと深い理由が横たわっているに違いなかった。"
    "translation_status": "reviewed"
  - "id": "c06-012"
    "section_id": "chapter-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A week afterwards Dr. Lanyon took to his bed, and in something less than a fortnight he was dead. The night after the funeral, at which he had been sadly affected, Utterson locked the door of his business room, and sitting there by the light of a melancholy candle, drew out and set before him an envelope addressed by the hand and sealed with the seal of his dead friend. “PRIVATE: for the hands of G. J. Utterson ALONE, and in case of his predecease to be destroyed unread,” so it was emphatically superscribed; and the lawyer dreaded to behold the contents. “I have buried one friend to-day,” he thought: “what if this should cost me another?” And then he condemned the fear as a disloyalty, and broke the seal. Within there was another enclosure, likewise sealed, and marked upon the cover as “not to be opened till the death or disappearance of Dr. Henry Jekyll.” Utterson could not trust his eyes. Yes, it was disappearance; here again, as in the mad will which he had long ago restored to its author, here again were the idea of a disappearance and the name of Henry Jekyll bracketed. But in the will, that idea had sprung from the sinister suggestion of the man Hyde; it was set there with a purpose all too plain and horrible. Written by the hand of Lanyon, what should it mean? A great curiosity came on the trustee, to disregard the prohibition and dive at once to the bottom of these mysteries; but professional honour and faith to his dead friend were stringent obligations; and the packet slept in the inmost corner of his private safe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[8]/p[12]"
        "line_start": 1663
        "source_sequence": 184
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap06"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c06-012"
    "translation_ja": "一週間後ラニョン博士は床につき、それから二週間もたたないうちに世を去った。悲しみに深く心を揺さぶられた葬儀をすませたその夜、アタスンは執務室の戸に鍵を掛け、わびしいろうそくの光のもとに座り、死んだ友が自筆で宛名を記し、自分の印で封をした封筒を取り出して目の前に置いた。「親展。Ｇ・Ｊ・アタスンただ一人の手に。万一同人が先立った場合は未開封のまま破棄すること」。念を押した表書きはそうなっていて、弁護士は中身を見るのが怖かった。「きょう一人の友を葬った。これでもう一人の友まで失うことになったら？」。そう思ったが、その恐れを友への背信だと自ら責め、封を切った。中にもう一つ、同じように封じた包みがあり、表に「ヘンリー・ジキル博士死亡または失踪まで開封を禁ず」と書いてあった。アタスンは目を疑った。そうだ、失踪だ。とうの昔に作成者へ返したあの狂気の遺言書と同じく、ここでもまた失踪という考えとヘンリー・ジキルの名が一対になっていた。だが遺言書の方では、陰険な男ハイドの入れ知恵でもたらされた考えで、そこに盛り込まれた目的はあまりに明白で、あまりに恐ろしかった。ラニョンの手で書かれたとなると、どういう意味を持つのだろう。預かり主は禁を破ってただちに謎の底へ飛び込みたいという強い好奇心に駆られた。だが職業上の名誉と死んだ友への信義は厳しい義務を課していた。包みは個人用金庫のいちばん奥深い隅に眠った。"
    "translation_status": "reviewed"

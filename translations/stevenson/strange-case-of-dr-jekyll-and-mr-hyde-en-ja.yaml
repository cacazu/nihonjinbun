    "kind": "paragraph"
    "origin": "source"
    "source_text": "It is one thing to mortify curiosity, another to conquer it; and it may be doubted if, from that day forth, Utterson desired the society of his surviving friend with the same eagerness. He thought of him kindly; but his thoughts were disquieted and fearful. He went to call indeed; but he was perhaps relieved to be denied admittance; perhaps, in his heart, he preferred to speak with Poole upon the doorstep and surrounded by the air and sounds of the open city, rather than to be admitted into that house of voluntary bondage, and to sit and speak with its inscrutable recluse. Poole had, indeed, no very pleasant news to communicate. The doctor, it appeared, now more than ever confined himself to the cabinet over the laboratory, where he would sometimes even sleep; he was out of spirits, he had grown very silent, he did not read; it seemed as if he had something on his mind. Utterson became so used to the unvarying character of these reports, that he fell off little by little in the frequency of his visits."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[8]/p[13]"
        "line_start": 1688
        "source_sequence": 185
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap06"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c06-013"
    "translation_ja": "好奇心を抑えつけるのと、それに打ち勝つのとは別だ。それからというもの、アタスンが生き残った友の相伴を以前と同じ熱意で求めたかどうかは疑わしい。変わらず好意をこめて友を思ったが、その思いには不安と恐れがまとわりついた。確かに訪ねては行ったが、面会を断られて、むしろほっとしたのかもしれない。心の底では、自ら囚われたあの家の内に通され、得体の知れない隠者と座って話すより、戸口の段に立って、外の街の空気と物音に包まれながらプールと話すほうを選んでいたのかもしれない。もっともプールにも、あまり気持ちのよい話はなかった。博士は以前にもまして実験室の上の私室に閉じこもり、ときにはそこで眠ることさえあるらしい。気は沈み、ひどく無口になり、本も読まない。何か心にかかるものがあるように見えるという。判で押したような知らせにアタスンもすっかり慣れ、訪ねる足は少しずつ遠のいていった。"
    "translation_status": "reviewed"
  - "id": "c07-000"
    "section_id": "chapter-07"
    "kind": "heading"
    "origin": "source"
    "source_text": "INCIDENT AT THE WINDOW"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/h2"
        "line_start": 1709
        "source_sequence": 186
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-000"
    "translation_ja": "窓辺の一件"
    "translation_status": "reviewed"
  - "id": "c07-001"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It chanced on Sunday, when Mr. Utterson was on his usual walk with Mr. Enfield, that their way lay once again through the by-street; and that when they came in front of the door, both stopped to gaze on it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[1]"
        "line_start": 1711
        "source_sequence": 187
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-001"
    "translation_ja": "ある日曜日、アタスン氏がいつものようにエンフィールド氏と散歩をしていると、たまたま例の横町をもう一度通ることになった。あの扉の前まで来ると二人とも足を止め、それをじっと眺めた。"
    "translation_status": "reviewed"
  - "id": "c07-002"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” said Enfield, “that story’s at an end at least. We shall never see more of Mr. Hyde.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[2]"
        "line_start": 1717
        "source_sequence": 188
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-002"
    "translation_ja": "「まあ」とエンフィールドは言った。「ともかくあの話はおしまいですね。もうハイド氏の顔を見ることはあるまい」"
    "translation_status": "reviewed"
  - "id": "c07-003"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I hope not,” said Utterson. “Did I ever tell you that I once saw him, and shared your feeling of repulsion?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[3]"
        "line_start": 1722
        "source_sequence": 189
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-003"
    "translation_ja": "「そうあってほしいね」とアタスンは言った。「僕も一度会って、君と同じ反感を覚えた話はしたかな？」"
    "translation_status": "reviewed"
  - "id": "c07-004"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It was impossible to do the one without the other,” returned Enfield. “And by the way, what an ass you must have thought me, not to know that this was a back way to Dr. Jekyll’s! It was partly your own fault that I found it out, even when I did.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[4]"
        "line_start": 1727
        "source_sequence": 190
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-004"
    "translation_ja": "「会ってそう思わずにいるのは不可能ですよ」とエンフィールドは答えた。「それにしても、ここがジキル博士の裏口だと知らなかったとは、さぞまぬけだとお思いになったでしょうね。僕がようやく気づいたのだって、半分はあなたのせいなんですよ」"
    "translation_status": "reviewed"
  - "id": "c07-005"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“So you found it out, did you?” said Utterson. “But if that be so, we may step into the court and take a look at the windows. To tell you the truth, I am uneasy about poor Jekyll; and even outside, I feel as if the presence of a friend might do him good.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[5]"
        "line_start": 1734
        "source_sequence": 191
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-005"
    "translation_ja": "「なるほど、気づいたのか」とアタスンは言った。「それなら中庭に入って、窓の様子を眺めてもよかろう。じつを言うと僕は気の毒なジキルが心配でね。外にいるだけでも、友達がそばにいればあいつのためになるような気がするんだ」"
    "translation_status": "reviewed"
  - "id": "c07-006"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The court was very cool and a little damp, and full of premature twilight, although the sky, high up overhead, was still bright with sunset. The middle one of the three windows was half-way open; and sitting close beside it, taking the air with an infinite sadness of mien, like some disconsolate prisoner, Utterson saw Dr. Jekyll."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[6]"
        "line_start": 1741
        "source_sequence": 192
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-006"
    "translation_ja": "中庭はひんやりとして、少し湿っぽかった。頭上はるか高くでは空がまだ夕映えに明るいのに、早くも薄暮が一面に満ちていた。三つある窓の真ん中が半分ほど開き、そのすぐそばにジキル博士が座っているのがアタスンに見えた。すっかり望みを失った囚人のように、この上なく悲しげな面持ちで外気に当たっていた。"
    "translation_status": "reviewed"
  - "id": "c07-007"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What! Jekyll! Jekyll!” he cried. “I trust you are better.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[7]"
        "line_start": 1749
        "source_sequence": 193
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-007"
    "translation_ja": "「おや！　ジキル！　ジキル！」と彼は叫んだ。「少しはよくなったかね」"
    "translation_status": "reviewed"
  - "id": "c07-008"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I am very low, Utterson,” replied the doctor drearily, “very low. It will not last long, thank God.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[8]"
        "line_start": 1753
        "source_sequence": 194
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-008"
    "translation_ja": "「ひどく気が沈んでいるよ、アタスン」と博士はわびしげに答えた。「ひどくね。ありがたいことに、そう長くは続かんが」"
    "translation_status": "reviewed"
  - "id": "c07-009"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You stay too much indoors,” said the lawyer. “You should be out, whipping up the circulation like Mr. Enfield and me. (This is my cousin—Mr. Enfield—Dr. Jekyll.) Come now; get your hat and take a quick turn with us.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[9]"
        "line_start": 1758
        "source_sequence": 195
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-009"
    "translation_ja": "「家にこもりすぎるんだ」と弁護士は言った。「僕やエンフィールド君のように外へ出て、血の巡りをよくしなくちゃ。（こちらは僕のいとこのエンフィールド君。こちらがジキル博士だ。）さあ、帽子を取って来て、僕らとひとまわり、しゃきしゃき歩こうじゃないか」"
    "translation_status": "reviewed"
  - "id": "c07-010"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You are very good,” sighed the other. “I should like to very much; but no, no, no, it is quite impossible; I dare not. But indeed, Utterson, I am very glad to see you; this is really a great pleasure; I would ask you and Mr. Enfield up, but the place is really not fit.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[10]"
        "line_start": 1765
        "source_sequence": 196
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-010"
    "translation_ja": "「親切だね」と相手はため息をついた。「僕もぜひそうしたい。だが、いや、いや、いや、どうしてもできないんだ。怖くてできん。だがね、アタスン、君に会えてじつに嬉しいよ。ほんとうにありがたい。君とエンフィールドさんに上がってもらいたいが、ここはどうにも人を通せるようなところじゃない」"
    "translation_status": "reviewed"
  - "id": "c07-011"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Why, then,” said the lawyer, good-naturedly, “the best thing we can do is to stay down here and speak with you from where we are.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[11]"
        "line_start": 1772
        "source_sequence": 197
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-011"
    "translation_ja": "「だったら」と弁護士は人のよい声で言った。「僕らがここにいて、下から君と話すのが一番じゃないか」"
    "translation_status": "reviewed"
  - "id": "c07-012"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That is just what I was about to venture to propose,” returned the doctor with a smile. But the words were hardly uttered, before the smile was struck out of his face and succeeded by an expression of such abject terror and despair, as froze the very blood of the two gentlemen below. They saw it but for a glimpse for the window was instantly thrust down; but that glimpse had been sufficient, and they turned and left the court without a word. In silence, too, they traversed the by-street; and it was not until they had come into a neighbouring thoroughfare, where even upon a Sunday there were still some stirrings of life, that Mr. Utterson at last turned and looked at his companion. They were both pale; and there was an answering horror in their eyes."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[12]"
        "line_start": 1777
        "source_sequence": 198
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-012"
    "translation_ja": "「ちょうど僕も、もしよかったらそうしませんかと言い出すところだった」と博士は微笑んで答えた。だが言い終わるか終わらぬうちに、その顔から微笑が打ち消された。代わりに浮かんだのは、下にいる二人の紳士の血まで凍らせるような、なすすべもない恐怖と絶望の表情だった。すぐに窓が勢いよく下ろされたので、見えたのは一瞬に過ぎない。だがその一瞬で十分だった。二人は身をひるがえして一言もなく中庭を出た。あの横町でも二人はなお黙っていた。日曜にさえ多少の人通りのある近くの大通りに出てようやく、アタスン氏は連れのほうを向き、その顔を見た。二人とも青ざめていた。互いの目には同じ戦慄が映っていた。"
    "translation_status": "reviewed"
  - "id": "c07-013"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“God forgive us, God forgive us,” said Mr. Utterson."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[13]"
        "line_start": 1791
        "source_sequence": 199
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-013"
    "translation_ja": "「神よ、われらを赦したまえ。神よ、われらを赦したまえ」とアタスン氏は言った。"
    "translation_status": "reviewed"
  - "id": "c07-014"
    "section_id": "chapter-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But Mr. Enfield only nodded his head very seriously, and walked on once more in silence."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[9]/p[14]"
        "line_start": 1795
        "source_sequence": 200
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap07"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c07-014"
    "translation_ja": "だがエンフィールド氏はただひどく厳粛にうなずき、ふたたび黙ったまま歩きだした。"
    "translation_status": "reviewed"
  - "id": "c08-000"
    "section_id": "chapter-08"
    "kind": "heading"
    "origin": "source"
    "source_text": "THE LAST NIGHT"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/h2"
        "line_start": 1804
        "source_sequence": 201
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-000"
    "translation_ja": "最後の夜"
    "translation_status": "reviewed"
  - "id": "c08-001"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Utterson was sitting by his fireside one evening after dinner, when he was surprised to receive a visit from Poole."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[1]"
        "line_start": 1806
        "source_sequence": 202
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-001"
    "translation_ja": "ある晩、夕食のあと、アタスン氏が暖炉のそばに座っていると、思いがけなくプールの訪問を受けた。"
    "translation_status": "reviewed"
  - "id": "c08-002"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Bless me, Poole, what brings you here?” he cried; and then taking a second look at him, “What ails you?” he added; “is the doctor ill?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[2]"
        "line_start": 1811
        "source_sequence": 203
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-002"
    "translation_ja": "「これは驚いた、プール。どういう風の吹きまわしだね？」と叫んだ。それから相手をよく見て言い足した。「どうした？　博士のご病気かね？」"
    "translation_status": "reviewed"
  - "id": "c08-003"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Mr. Utterson,” said the man, “there is something wrong.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[3]"
        "line_start": 1817
        "source_sequence": 204
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-003"
    "translation_ja": "「アタスン様」と男は言った。「何かがおかしいのでございます」"
    "translation_status": "reviewed"
  - "id": "c08-004"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Take a seat, and here is a glass of wine for you,” said the lawyer. “Now, take your time, and tell me plainly what you want.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[4]"
        "line_start": 1822
        "source_sequence": 205
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-004"
    "translation_ja": "「まあ掛けたまえ。ここにぶどう酒も一杯ある」と弁護士は言った。「さあ、慌てずに、どうしてほしいのか、はっきり話してごらん」"
    "translation_status": "reviewed"
  - "id": "c08-005"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You know the doctor’s ways, sir,” replied Poole, “and how he shuts himself up. Well, he’s shut up again in the cabinet; and I don’t like it, sir—I wish I may die if I like it. Mr. Utterson, sir, I’m afraid.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[5]"
        "line_start": 1827
        "source_sequence": 206
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-005"
    "translation_ja": "「旦那様がどういうお方か、先生はご存じで」とプールは答えた。「よくお一人でこもってしまわれることも。ところが、その、また私室にこもっておいでなのです。それが私にはどうも嫌で、嫌でなければこの場で死んでもよろしゅうございます。アタスン様、私ゃ怖いのです」"
    "translation_status": "reviewed"
  - "id": "c08-006"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Now, my good man,” said the lawyer, “be explicit. What are you afraid of?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[6]"
        "line_start": 1834
        "source_sequence": 207
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-006"
    "translation_ja": "「まあまあ、プール」と弁護士は言った。「はっきり言いなさい。何が怖いんだね」"
    "translation_status": "reviewed"
  - "id": "c08-007"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I’ve been afraid for about a week,” returned Poole, doggedly disregarding the question, “and I can bear it no more.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[7]"
        "line_start": 1839
        "source_sequence": 208
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-007"
    "translation_ja": "「怖くなってもう一週間ほどにもなります」とプールは頑として問いに直接答えなかった。「もうこれ以上は辛抱できません」"
    "translation_status": "reviewed"
  - "id": "c08-008"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The man’s appearance amply bore out his words; his manner was altered for the worse; and except for the moment when he had first announced his terror, he had not once looked the lawyer in the face. Even now, he sat with the glass of wine untasted on his knee, and his eyes directed to a corner of the floor. “I can bear it no more,” he repeated."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[8]"
        "line_start": 1844
        "source_sequence": 209
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-008"
    "translation_ja": "男の姿はその言葉を十分に裏書きしていた。ふるまいには以前とは違う落ち着きのなさがあり、初めに怖いと打ち明けた一瞬をのぞいては、一度も弁護士の顔をまともに見ていない。今もぶどう酒のグラスを手つかずで膝の上に、視線を床の片隅に落として座っていた。「これ以上は辛抱できません」と繰り返した。"
    "translation_status": "reviewed"
  - "id": "c08-009"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Come,” said the lawyer, “I see you have some good reason, Poole; I see there is something seriously amiss. Try to tell me what it is.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[9]"
        "line_start": 1852
        "source_sequence": 210
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-009"
    "translation_ja": "「さあ」と弁護士は言った。「よほどの理由があると見えるね、プール。ただごとでないのはわかった。何があったか、なんとか話してごらん」"
    "translation_status": "reviewed"
  - "id": "c08-010"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I think there’s been foul play,” said Poole, hoarsely."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[10]"
        "line_start": 1858
        "source_sequence": 211
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-010"
    "translation_ja": "「誰かが何かよからぬことをしたのではないかと」とプールはしわがれた声で言った。"
    "translation_status": "reviewed"
  - "id": "c08-011"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Foul play!” cried the lawyer, a good deal frightened and rather inclined to be irritated in consequence. “What foul play! What does the man mean?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[11]"
        "line_start": 1862
        "source_sequence": 212
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-011"
    "translation_ja": "「よからぬことだって！」と弁護士は叫んだ。かなりおじけづき、そのせいでやや腹立たしくなっていた。「よからぬこととは、どんなことだ！　いったい何を言いたいんだね？」"
    "translation_status": "reviewed"
  - "id": "c08-012"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I daren’t say, sir,” was the answer; “but will you come along with me and see for yourself?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[12]"
        "line_start": 1868
        "source_sequence": 213
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-012"
    "translation_ja": "「恐ろしくて申し上げられません」と返事があった。「ただ、一緒においでになって、ご自分でお確かめ願えませんでしょうか」"
    "translation_status": "reviewed"
  - "id": "c08-013"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Utterson’s only answer was to rise and get his hat and greatcoat; but he observed with wonder the greatness of the relief that appeared upon the butler’s face, and perhaps with no less, that the wine was still untasted when he set it down to follow."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[13]"
        "line_start": 1873
        "source_sequence": 214
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-013"
    "translation_ja": "アタスン氏はただ立ち上がり、帽子と外套を取りに行くことで返事とした。だが執事の顔にこれほどまで深い安堵の色が浮かぶのを見て驚き、執事があとに従うためグラスを置いたとき、ぶどう酒がまだ手つかずなのを見て、おそらく同じくらい驚いた。"
    "translation_status": "reviewed"
  - "id": "c08-014"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was a wild, cold, seasonable night of March, with a pale moon, lying on her back as though the wind had tilted her, and flying wrack of the most diaphanous and lawny texture. The wind made talking difficult, and flecked the blood into the face. It seemed to have swept the streets unusually bare of passengers, besides; for Mr. Utterson thought he had never seen that part of London so deserted. He could have wished it otherwise; never in his life had he been conscious of so sharp a wish to see and touch his fellow-creatures; for struggle as he might, there was borne in upon his mind a crushing anticipation of calamity. The square, when they got there, was full of wind and dust, and the thin trees in the garden were lashing themselves along the railing. Poole, who had kept all the way a pace or two ahead, now pulled up in the middle of the pavement, and in spite of the biting weather, took off his hat and mopped his brow with a red pocket-handkerchief. But for all the hurry of his coming, these were not the dews of exertion that he wiped away, but the moisture of some strangling anguish; for his face was white and his voice, when he spoke, harsh and broken."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[14]"
        "line_start": 1880
        "source_sequence": 215
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-014"
    "translation_ja": "三月らしい荒れた寒い夜だった。青白い月は風に傾けられたように仰向けに寝ていて、ごく薄い透き織りの麻布を思わせるちぎれ雲が飛んでいた。風で話もうまくできず、頰は血を散らしたようにまだらに赤くなった。その風がいつになく通行人まで掃き清めたらしい。アタスン氏にはロンドンのこの辺りがこれほどひと気を失ったのを見た覚えがなかった。むしろ人がいてほしかった。自分と同じ生身の人間を見たい、触れたいとこれほど切実に思ったことは生まれて初めてだった。いくら抗っても、災いの予感が圧し潰すほどの重さで胸に迫ったからである。広場に着くと、風と埃が渦巻き、植え込みの細い木々が鉄柵に身を打ちつけていた。道すがらずっと一、二歩先を行っていたプールは舗道の真ん中で足を止め、刺すような寒さにもかかわらず帽子を脱ぎ、赤いハンカチで額をぬぐった。急いで来たとはいえ、ぬぐった露は運動の汗ではなく、喉を締めつけるような苦悶の冷や汗だった。顔は白く、口を開いたとき声はしゃがれ、途切れた。"
    "translation_status": "reviewed"
  - "id": "c08-015"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, sir,” he said, “here we are, and God grant there be nothing wrong.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[15]"
        "line_start": 1899
        "source_sequence": 216
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-015"
    "translation_ja": "「さあ、先生」と彼は言った。「着きましてございます。どうか神様、何事もございませんように」"
    "translation_status": "reviewed"
  - "id": "c08-016"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Amen, Poole,” said the lawyer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[16]"
        "line_start": 1904
        "source_sequence": 217
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-016"
    "translation_ja": "「アーメン、プール」と弁護士は言った。"
    "translation_status": "reviewed"
  - "id": "c08-017"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Thereupon the servant knocked in a very guarded manner; the door was opened on the chain; and a voice asked from within, “Is that you, Poole?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[17]"
        "line_start": 1908
        "source_sequence": 218
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-017"
    "translation_ja": "そこで召使がごく用心深く戸をたたくと、鎖を掛けたまま戸が少し開き、中から「プールさんなの？」という声がした。"
    "translation_status": "reviewed"
  - "id": "c08-018"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It’s all right,” said Poole. “Open the door.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[18]"
        "line_start": 1913
        "source_sequence": 219
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-018"
    "translation_ja": "「大丈夫だ」とプールは言った。「開けておくれ」"
    "translation_status": "reviewed"
  - "id": "c08-019"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The hall, when they entered it, was brightly lighted up; the fire was built high; and about the hearth the whole of the servants, men and women, stood huddled together like a flock of sheep. At the sight of Mr. Utterson, the housemaid broke into hysterical whimpering; and the cook, crying out “Bless God! it’s Mr. Utterson,” ran forward as if to take him in her arms."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[19]"
        "line_start": 1917
        "source_sequence": 220
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-019"
    "translation_ja": "入ってみると、広間は明るく照らされ、暖炉には高々と火が燃え上がっていた。その周りに使用人が全員、男も女も、羊の群れのように身を寄せ合って立っていた。アタスン氏の姿を見るなり、部屋係の女中はどうにも止まらぬすすり泣きを始め、料理女は「ありがたいこと！　アタスン様よ」と叫んで、抱きつかんばかりに駆け寄ってきた。"
    "translation_status": "reviewed"
  - "id": "c08-020"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What, what? Are you all here?” said the lawyer peevishly. “Very irregular, very unseemly; your master would be far from pleased.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[20]"
        "line_start": 1926
        "source_sequence": 221
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-020"
    "translation_ja": "「おや、おや。みんなここにいるのかね」と弁護士はいまいましげに言った。「まったく秩序もない、見苦しいことだ。ご主人は決してお喜びになるまい」"
    "translation_status": "reviewed"
  - "id": "c08-021"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“They’re all afraid,” said Poole."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[21]"
        "line_start": 1932
        "source_sequence": 222
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-021"
    "translation_ja": "「みんな怖がっております」とプールは言った。"
    "translation_status": "reviewed"
  - "id": "c08-022"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Blank silence followed, no one protesting; only the maid lifted her voice and now wept loudly."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[22]"
        "line_start": 1936
        "source_sequence": 223
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-022"
    "translation_ja": "あとにはただ沈黙が落ちた。異を唱える者はなく、ただ女中だけが声を張り上げ、今や大声で泣いた。"
    "translation_status": "reviewed"
  - "id": "c08-023"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Hold your tongue!” Poole said to her, with a ferocity of accent that testified to his own jangled nerves; and indeed, when the girl had so suddenly raised the note of her lamentation, they had all started and turned towards the inner door with faces of dreadful expectation. “And now,” continued the butler, addressing the knife-boy, “reach me a candle, and we’ll get this through hands at once.” And then he begged Mr. Utterson to follow him, and led the way to the back garden."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[23]"
        "line_start": 1941
        "source_sequence": 224
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-023"
    "translation_ja": "「黙りなさい！」とプールは言った。恐ろしい剣幕が、彼自身の神経の張りつめようを物語った。実際、娘の泣く調子が急に高まったとき、一同はぎくりとして、どんな恐ろしいことが起きるかと身構えた顔で揃って奥の戸を振り返ったのである。「さあ」と執事は刃物磨きの下働きの少年に言いつけた。「ろうそくを一本よこせ。さっさと片をつけよう」。それからアタスン氏にあとへ続いてくれるよう頼み、裏庭へと案内した。"
    "translation_status": "reviewed"
  - "id": "c08-024"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Now, sir,” said he, “you come as gently as you can. I want you to hear, and I don’t want you to be heard. And see here, sir, if by any chance he was to ask you in, don’t go.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[24]"
        "line_start": 1951
        "source_sequence": 225
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-024"
    "translation_ja": "「ここからは、先生」と彼は言った。「どうかできるだけ静かにおいでください。あちらの声をお聞きになって、こちらの音は聞かれずにおきたいのです。それと、先生、いいですか、万が一にも入れと向こうから言われても、お入りになってはいけません」"
    "translation_status": "reviewed"
  - "id": "c08-025"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Utterson’s nerves, at this unlooked-for termination, gave a jerk that nearly threw him from his balance; but he recollected his courage and followed the butler into the laboratory building through the surgical theatre, with its lumber of crates and bottles, to the foot of the stair. Here Poole motioned him to stand on one side and listen; while he himself, setting down the candle and making a great and obvious call on his resolution, mounted the steps and knocked with a somewhat uncertain hand on the red baize of the cabinet door."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[25]"
        "line_start": 1957
        "source_sequence": 226
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-025"
    "translation_ja": "この思いがけない結びの言葉にアタスン氏は全身の神経がぎくりとして、危うくよろめきかけた。だが気を取り直し、執事に従って実験棟に入り、木箱だの瓶だのが雑然と積まれた解剖講堂を抜け、階段の下まで来た。ここでプールは弁護士に脇へ寄って耳をすますよう身ぶりで促し、自分はろうそくを置いた。見るからに、ありったけの気力を振り絞って段を上り、いささかおぼつかぬ手で、私室の戸の赤いラシャをたたいた。"
    "translation_status": "reviewed"
  - "id": "c08-026"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Mr. Utterson, sir, asking to see you,” he called; and even as he did so, once more violently signed to the lawyer to give ear."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[26]"
        "line_start": 1967
        "source_sequence": 227
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-026"
    "translation_ja": "「旦那様、アタスン様がお目にかかりたいとおいででございます」と声をかけ、言いながらもう一度、耳をすませと弁護士に猛烈な身ぶりをした。"
    "translation_status": "reviewed"
  - "id": "c08-027"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A voice answered from within: “Tell him I cannot see anyone,” it said complainingly."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[27]"
        "line_start": 1972
        "source_sequence": 228
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-027"
    "translation_ja": "中から声が答えた。「誰にも会えないと伝えてくれ」と恨めしそうに言った。"
    "translation_status": "reviewed"
  - "id": "c08-028"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Thank you, sir,” said Poole, with a note of something like triumph in his voice; and taking up his candle, he led Mr. Utterson back across the yard and into the great kitchen, where the fire was out and the beetles were leaping on the floor."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[28]"
        "line_start": 1977
        "source_sequence": 229
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-028"
    "translation_ja": "「かしこまりました」とプールはどこか勝ち誇ったような声で言った。ろうそくを取り上げると、アタスン氏をいま一度中庭に連れ出し、大きな台所へ通した。火は消えていて、床を黒い虫が跳ね回っていた。"
    "translation_status": "reviewed"
  - "id": "c08-029"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Sir,” he said, looking Mr. Utterson in the eyes, “Was that my master’s voice?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[29]"
        "line_start": 1984
        "source_sequence": 230
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-029"
    "translation_ja": "「先生」と彼はアタスン氏の目を見つめた。「今のはうちの旦那様のお声でしたか」"
    "translation_status": "reviewed"
  - "id": "c08-030"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It seems much changed,” replied the lawyer, very pale, but giving look for look."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[30]"
        "line_start": 1989
        "source_sequence": 231
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-030"
    "translation_ja": "「ひどく変わって聞こえるね」と弁護士は真っ青だったが、相手の目を見返して答えた。"
    "translation_status": "reviewed"
  - "id": "c08-031"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Changed? Well, yes, I think so,” said the butler. “Have I been twenty years in this man’s house, to be deceived about his voice? No, sir; master’s made away with; he was made away with eight days ago, when we heard him cry out upon the name of God; and who’s in there instead of him, and why it stays there, is a thing that cries to Heaven, Mr. Utterson!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[31]"
        "line_start": 1994
        "source_sequence": 232
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-031"
    "translation_ja": "「変わった？　ええ、さようでございましょう」と執事は言った。「あのお方のお屋敷に二十年も仕えて、お声を聞き違えたりいたしましょうか。いいえ、先生。旦那様は殺されたのです。八日前、神様のお名前を叫ぶ声を私どもが聞いたとき、殺されたのでございます。では代わりにあそこにいるのは誰か、何のためにあれがあそこに居座っているのか。それこそ神様に問いただしたいことなのです、アタスン様！」"
    "translation_status": "reviewed"

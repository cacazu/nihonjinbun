          "exact": "中身をそっくりそのままにして"
  - "id": "c09-005"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That is the first part of the service: now for the second. You should be back, if you set out at once on the receipt of this, long before midnight; but I will leave you that amount of margin, not only in the fear of one of those obstacles that can neither be prevented nor foreseen, but because an hour when your servants are in bed is to be preferred for what will then remain to do. At midnight, then, I have to ask you to be alone in your consulting room, to admit with your own hand into the house a man who will present himself in my name, and to place in his hands the drawer that you will have brought with you from my cabinet. Then you will have played your part and earned my gratitude completely. Five minutes afterwards, if you insist upon an explanation, you will have understood that these arrangements are of capital importance; and that by the neglect of one of them, fantastic as they must appear, you might have charged your conscience with my death or the shipwreck of my reason."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[5]"
        "line_start": 2525
        "source_sequence": 306
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-005"
    "translation_ja": "頼みごとの前半はそれだけだ。次は後半。これを受け取ってすぐ出かけてくれれば、夜半よりずっと前に帰れるはずだが、そこまで余裕を見ておこう。予見も予防もできぬ差し障りを恐れるばかりでなく、残りの用事には君の家の者も寝た時刻のほうが好都合だからだ。そこで夜中の十二時に、君の診察室にひとりきりでいてほしい。僕の名を出して男が一人訪ねて来る。その男を君自身の手で家へ入れ、僕の私室から持ち帰った引き出しを手渡してくれ。それで君への頼みは全部だ。心から感謝するよ。その五分後、君がどうしても説明が要ると言うなら、この手はずがいかに重大か、どんなに奇怪に見えようとも、一つでも怠っていれば、僕の死か、僕の理性の破滅かを君の良心に背負い込んだかもしれないことが、わかっているだろう。"
    "translation_status": "reviewed"
  - "id": "c09-006"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Confident as I am that you will not trifle with this appeal, my heart sinks and my hand trembles at the bare thought of such a possibility. Think of me at this hour, in a strange place, labouring under a blackness of distress that no fancy can exaggerate, and yet well aware that, if you will but punctually serve me, my troubles will roll away like a story that is told. Serve me, my dear Lanyon and save"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[6]"
        "line_start": 2541
        "source_sequence": 307
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-006"
    "translation_ja": "君がこの訴えをおろそかにしないことは確信している。それでも、もしやという思いがよぎるだけで心が沈み、手が震える。この時間、見慣れぬ場所で、どんな想像力もその甚だしさを言い過ぎることのできぬ暗い苦悶に押し潰されながら、そのくせ君が時間どおり手を貸してくれさえすれば、語り終えた話のように悩みは消え去るとよく承知している僕を思ってくれ。親愛なるラニョン、どうか手を貸して救ってくれ。"
    "translation_status": "reviewed"
  - "id": "c09-007"

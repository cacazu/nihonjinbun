        "source_sequence": 333
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-032"
    "translation_ja": "「ああ、神よ！」と絶叫した。「ああ、神よ！」と幾度も、幾度も。なんと私の目の前には、青ざめ、わななき、気も絶え絶えに、死から呼び戻された人間のように両手で前をまさぐりながら、ヘンリー・ジキルが立っていたのだ！"
    "translation_status": "reviewed"
  - "id": "c09-033"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "What he told me in the next hour, I cannot bring my mind to set on paper. I saw what I saw, I heard what I heard, and my soul sickened at it; and yet now when that sight has faded from my eyes, I ask myself if I believe it, and I cannot answer. My life is shaken to its roots; sleep has left me; the deadliest terror sits by me at all hours of the day and night; and I feel that my days are numbered, and that I must die; and yet I shall die incredulous. As for the moral turpitude that man unveiled to me, even with tears of penitence, I cannot, even in memory, dwell on it without a start of horror. I will say but one thing, Utterson, and that (if you can bring your mind to credit it) will be more than enough. The creature who crept into my house that night was, on Jekyll’s own confession, known by the name of Hyde and hunted for in every corner of the land as the murderer of Carew."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[33]"
        "line_start": 2786
        "source_sequence": 334
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"

  - "id": "c02-050"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And the lawyer set out homeward with a very heavy heart. “Poor Harry Jekyll,” he thought, “my mind misgives me he is in deep waters! He was wild when he was young; a long while ago to be sure; but in the law of God, there is no statute of limitations. Ah, it must be that; the ghost of some old sin, the cancer of some concealed disgrace: punishment coming, pede claudo, years after memory has forgotten and self-love condoned the fault.” And the lawyer, scared by the thought, brooded awhile on his own past, groping in all the corners of memory, lest by chance some Jack-in-the-Box of an old iniquity should leap to light there. His past was fairly blameless; few men could read the rolls of their life with less apprehension; yet he was humbled to the dust by the many ill things he had done, and raised up again into a sober and fearful gratitude by the many he had come so near to doing yet avoided. And then by a return on his former subject, he conceived a spark of hope. “This Master Hyde, if he were studied,” thought he, “must have secrets of his own; black secrets, by the look of him; secrets compared to which poor Jekyll’s worst would be like sunshine. Things cannot continue as they are. It turns me cold to think of this creature stealing like a thief to Harry’s bedside; poor Harry, what a wakening! And the danger of it; for if this Hyde suspects the existence of the will, he may grow impatient to inherit. Ah, I must put my shoulder to the wheel—if Jekyll will but let me,” he added, “if Jekyll will only let me.” For once more he saw before his mind’s eye, as clear as transparency, the strange clauses of the will."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[50]"
        "line_start": 939
        "source_sequence": 95
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-050"
    "translation_ja": "弁護士はひどく重い心で帰途についた。「気の毒なハリー・ジキル」と思った。「あいつはよほど深みにはまり込んでいるのではないか。若いころは放埒な男だった。確かに遠い昔のことだが、神の法律には時効はない。ああ、きっとそうだ。かつて犯した罪の亡霊、ひた隠しにした恥の癌だ。本人はとうに忘れ、わが身かわいさにその過ちを大目に見て、幾年もたってから、罰は片足を引きずり、遅れてやって来る」。その考えにおびえた弁護士はしばらく自分自身の過去に思いをこらし、どこかから不意に昔の悪事がびっくり箱の人形よろしく飛び出しはしないかと、記憶の隅々をまさぐった。彼の過去にとがめだてするほどのことはおおむねなかった。彼ほど心安くわが生涯の巻物を読み返せる男は少なかった。それでも、自分のしてきた悪しきことの多さには塵の中にひれ伏す思いがし、危うく手を染めながら免れたことの多さには、畏れと慎みを伴う感謝のうちにもう一度身を起こす思いがした。そこでもとの問題に立ち返ると、一点の望みが灯った。「このハイド君こそ、調べてみたら」と思った。「自分の秘密を持っているに相違ない。あの顔つきでは真っ黒な秘密だ。気の毒なジキルのいちばんひどい秘密さえ、比べればお日さまの光に見えるようなやつだ。いつまでもこのままにはしておけない。あれが泥棒のようにハリーの枕元へ忍び寄ることを思うと、ぞっとする。気の毒なハリー、なんという目覚めだろう！　それに危険もある。あのハイドが遺言書の存在を薄々にでも知っていたら、相続が待ちきれなくなるかもしれん。ああ、僕がひと肌脱がねば。ジキルがそうさせてくれさえすれば」と彼は言い添えた。「ジキルさえ許してくれればな」。またも心の目の前に、透かし絵のようにありありと、遺言書の奇妙な条項が浮かび上がったからである。"
    "translation_status": "reviewed"

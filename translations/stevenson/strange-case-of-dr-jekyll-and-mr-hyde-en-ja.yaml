        "original_unit_id": "c10-019"
    "translation_ja": "たちまち地獄の霊が胸中に目覚め、荒れ狂った。私は歓喜に我を忘れ、抵抗のない体をめった打ちにし、一打ごとに喜びを味わった。疲れが追ってきてようやく、狂乱が最高潮に達したそのとき、冷たい恐怖の戦慄が不意に心臓を貫いた。霧が晴れた。捕まれば命はないと悟った。そうして私は乱行の場から逃げた。勝ち誇ると同時に震え、悪への欲望は満たされまた煽られ、生への執着は、琴の弦を限界まで巻き上げたように張りつめていた。ソーホーの家へ駆けて、念には念を入れるため書類を処分した。そこから街灯に照らされた通りに出たが、心はなお二つに割れた同じ恍惚の中にいた。わが罪にほれぼれし、上ずった頭で未来の犯罪をあれこれ考えながら、それでも足を速め、それでも背後に追う報復者の足音がしないかと耳を澄ませた。ハイドは歌を口ずさみながら薬を合わせ、死んだ男に向けて杯を掲げ、飲み干した。変身の苦しみが彼を引き裂き終わらないうちに、ヘンリー・ジキルは感謝と悔悟の涙を流してひざまずき、組み合わせた両手を神に差し上げていた。己を甘やかす覆いは上から下まで裂けた。私は自分の生をひと続きのものとして見た。父に手を引かれた幼い日から、身を慎んで職務に励んだ労苦の日々をたどってゆき、幾度となく、同じ現実味のなさを感じながら、今宵の呪われた恐怖に行き当たった。声に出して叫びたいほどだった。記憶が私に向けて群がらせたおぞましい光景と物音を、涙と祈りで押し殺そうとした。それでもなお、嘆願と嘆願のすきまから、私の悪事の醜い顔が魂をのぞき込んだ。この悔悟の鋭さが薄れ始めると、代わって喜びが訪れた。私がどう生きるべきかという問題は解かれたのだ。これから先、ハイドになることはかなわない。望むと望まざるとにかかわらず、私はおのれの生の善い側に閉じ込められた。ああ、それを思ってどれほど喜んだことか！　どれほど進んでへりくだり、自然の生の制限をもう一度抱きしめたことか！　幾度となく出入りしたあの戸に錠を下ろし、かかとで鍵を踏み砕いたときの決別は、なんと心からのものだったことか！"
    "translation_status": "reviewed"
  - "id": "c10-020"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The next day, came the news that the murder had not been overlooked, that the guilt of Hyde was patent to the world, and that the victim was a man high in public estimation. It was not only a crime, it had been a tragic folly. I think I was glad to know it; I think I was glad to have my better impulses thus buttressed and guarded by the terrors of the scaffold. Jekyll was now my city of refuge; let but Hyde peep out an instant, and the hands of all men would be raised to take and slay him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[20]"
        "line_start": 3197
        "source_sequence": 356

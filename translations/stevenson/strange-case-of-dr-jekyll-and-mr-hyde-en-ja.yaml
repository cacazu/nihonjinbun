    "translation_status": "reviewed"
  - "id": "c04-001"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Nearly a year later, in the month of October, 18—, London was startled by a crime of singular ferocity and rendered all the more notable by the high position of the victim. The details were few and startling. A maid servant living alone in a house not far from the river, had gone upstairs to bed about eleven. Although a fog rolled over the city in the small hours, the early part of the night was cloudless, and the lane, which the maid’s window overlooked, was brilliantly lit by the full moon. It seems she was romantically given, for she sat down upon her box, which stood immediately under the window, and fell into a dream of musing. Never (she used to say, with streaming tears, when she narrated that experience), never had she felt more at peace with all men or thought more kindly of the world. And as she so sat she became aware of an aged beautiful gentleman with white hair, drawing near along the lane; and advancing to meet him, another and very small gentleman, to whom at first she paid less attention. When they had come within speech (which was just under the maid’s eyes) the older man bowed and accosted the other with a very pretty manner of politeness. It did not seem as if the subject of his address were of great importance; indeed, from his pointing, it sometimes appeared as if he were only inquiring his way; but the moon shone on his face as he spoke, and the girl was pleased to watch it, it seemed to breathe such an innocent and old-world kindness of disposition, yet with something high too, as of a well-founded self-content. Presently her eye wandered to the other, and she was surprised to recognise in him a certain Mr. Hyde, who had once visited her master and for whom she had conceived a dislike. He had in his hand a heavy cane, with which he was trifling; but he answered never a word, and seemed to listen with an ill-contained impatience. And then all of a sudden he broke out in a great flame of anger, stamping with his foot, brandishing the cane, and carrying on (as the maid described it) like a madman. The old gentleman took a step back, with the air of one very much surprised and a trifle hurt; and at that Mr. Hyde broke out of all bounds and clubbed him to the earth. And next moment, with ape-like fury, he was trampling his victim under foot and hailing down a storm of blows, under which the bones were audibly shattered and the body jumped upon the roadway. At the horror of these sights and sounds, the maid fainted."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[1]"
        "line_start": 1097
        "source_sequence": 115
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-001"
    "translation_ja": "一年近くのち、十八――年の十月、ロンドンは異様に凶暴な犯罪に震え上がった。犠牲者が高い地位にある人物だっただけに、いっそう人目を引く事件だった。わかっていることは少ないが、どれも衝撃的だった。川から遠くない一軒の家にひとりで住んでいた女中が、十一時ごろ、寝ようと二階に上がった。夜半過ぎには霧が町を覆ったものの、宵のうちは雲一つなく、女中の窓から見下ろす小路は満月に明々と照らされていた。夢見がちな娘だったらしい。窓のすぐ下の長持に腰を下ろし、夢のようなもの思いにふけった。あれほど、あれほど誰に対しても心が穏やかで、世間がいとしく思えたことはございません、とこの夜のことを話すとき、彼女はいつも涙を流して言った。そうして座っていると、小路を通って白髪の美しい老紳士が近づいてきた。反対側から別の、ごく小柄な紳士が近づいたが、初め女中はそちらにはあまり注意を払わなかった。声が届くところまで近づくと（そこはちょうど女中の目の下だった）、年長の男は会釈し、何とも気持ちのよい礼儀正しさで相手に話しかけた。用向きはさして重要とも見えず、指でさし示す具合から、ただ道を尋ねているだけにも思われた。だが話す男の顔に月が当たり、女中はそれを見るのが嬉しかった。無邪気で昔気質な人のよさがにじみ出ており、それでいて、自分にやましいところのない人の満足に似た、気高いものも宿っている。そのうちもうひとりに目を移した女中は、かつて主人を訪ねて来て、自分が嫌な感じだと思ったハイドという男だと気づいて驚いた。重い杖を手に弄び、ただの一言も返事をせず、いらだちを抑えかねる様子で聞いていた。と思ううち、突如として烈火のごとく怒りだし、地団駄を踏み、杖を振りまわし、女中の言葉では、まるで気のふれた人のように暴れたという。老紳士はたいそう驚き、いささか傷つけられた様子で、一歩あとずさった。そうするやハイド氏はとうとう見境を失い、杖で老紳士を地面へ殴り倒した。次の瞬間には猿のように猛り狂い、倒れた相手を足で踏みにじり、打撃の雨あられを浴びせた。骨の砕け散る音が聞こえ、体が道の上に跳ねた。その目にしたもの、耳にしたものの恐ろしさに、女中は気を失った。"
    "translation_status": "reviewed"
  - "id": "c04-002"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was two o’clock when she came to herself and called for the police. The murderer was gone long ago; but there lay his victim in the middle of the lane, incredibly mangled. The stick with which the deed had been done, although it was of some rare and very tough and heavy wood, had broken in the middle under the stress of this insensate cruelty; and one splintered half had rolled in the neighbouring gutter—the other, without doubt, had been carried away by the murderer. A purse and gold watch were found upon the victim: but no cards or papers, except a sealed and stamped envelope, which he had been probably carrying to the post, and which bore the name and address of Mr. Utterson."
    "source_languages":
      - "en"
    "source_locations":

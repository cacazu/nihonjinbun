        "original_unit_id": "c10-021"
    "translation_ja": "今後の行いで過去を償おうと決めた。そして私の決意はいささかの善を実らせたと、偽りなく言える。去年の終わりの数か月、どれほど熱心に人の苦しみを和らげようと働いたかは、君自身が知っている。多くのことが他人のためになされ、私自身にとっても日々が静かに、ほとんど幸福に過ぎたのを知っている。この有益で潔白な暮らしに飽いたとも、ほんとうのところ言えない。むしろ日ごとにいよいよ深くそれを楽しんだと思う。しかし私はなお、志が二つあるという呪いのもとにあった。最初の悔恨の刃先が鈍るにつれ、あれほど長く甘やかされ、ほんの近ごろ鎖につながれた私の低い側は、好きにさせろとうなり始めた。ハイドを生き返らせようと夢にでも思ったわけではない。考えるだけで狂わんばかりに恐ろしかった。そうではなく、ふたたび良心をもてあそぶ気にさせられたのは私自身の姿のままだった。そしてついに誘惑の猛攻に屈したとき、私はただの、人知れず罪を犯す男だった。"
    "translation_status": "reviewed"
  - "id": "c10-022"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There comes an end to all things; the most capacious measure is filled at last; and this brief condescension to my evil finally destroyed the balance of my soul. And yet I was not alarmed; the fall seemed natural, like a return to the old days before I had made my discovery. It was a fine, clear, January day, wet under foot where the frost had melted, but cloudless overhead; and the Regent’s Park was full of winter chirrupings and sweet with spring odours. I sat in the sun on a bench; the animal within me licking the chops of memory; the spiritual side a little drowsed, promising subsequent penitence, but not yet moved to begin. After all, I reflected, I was like my neighbours; and then I smiled, comparing myself with other men, comparing my active good-will with the lazy cruelty of their neglect. And at the very moment of that vainglorious thought, a qualm came over me, a horrid nausea and the most deadly shuddering. These passed away, and left me faint; and then as in its turn faintness subsided, I began to be aware of a change in the temper of my thoughts, a greater boldness, a contempt of danger, a solution of the bonds of obligation. I looked down; my clothes hung formlessly on my shrunken limbs; the hand that lay on my knee was corded and hairy. I was once more Edward Hyde. A moment before I had been safe of all men’s respect, wealthy, beloved—the cloth laying for me in the dining-room at home; and now I was the common quarry of mankind, hunted, houseless, a known murderer, thrall to the gallows."

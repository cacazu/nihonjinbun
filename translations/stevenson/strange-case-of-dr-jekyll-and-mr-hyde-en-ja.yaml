    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-010"
    "translation_ja": "「私と同じお気持ちらしい」とエンフィールド氏は言った。「そう、いやな話でしょう。だってこの男はだれもつきあいたいと思わない、心底けしからんやつだった。ところが小切手を切ったほうは品行方正のお手本みたいな人で、有名人で、おまけに（だからよけいにいやなんだが）世間でいう善行を積んでるような人です。ゆすりでしょうな。立派な人間が若気の至りで何かやった、そのつけを存分に払わされている。だからあの扉のある建物を、私は〈ゆすり屋敷〉と呼んでいます。とはいえ、それでも何もかも説明がつくわけじゃありませんがね」。そう付け加えると、彼は物思いに沈んだ。"
    "translation_status": "reviewed"

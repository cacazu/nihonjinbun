        "original_unit_id": "c10-028"
    "translation_ja": "一週間ほど過ぎた。私はいま、以前の粉の最後の一包が効いているうちに、この陳述を書き終えようとしている。となれば、奇跡でも起きぬ限り、ヘンリー・ジキルが自分の頭で考え、自分の顔を（今やなんと痛ましく変わったことか！）鏡に見ることができるのは、これが最後だ。この書きものを結ぶのも、あまり遅くなってはいけない。これまで手記を破られずに済んだのは、よほどの用心とよほどの幸運が重なったためだ。書いているところを変身の苦痛に襲われたら、ハイドはこれをこなごなに引き裂くだろう。だが私がしまっていくらか時間がたってからであれば、あの驚くべき身勝手さと、目先の瞬間にしか思いが及ばぬ性質によって、猿じみた意地悪の手をまたしても免れうるだろう。じつのところ、二人を追い詰める破滅は、すでに彼を変え、押しひしいだ。今から三十分後、またも、そして永遠にあの憎むべき人格を身にまとったとき、私はどうしているかわかる。椅子に座って震えながら泣くか、極度に張りつめ、恐怖に打たれた忘我のうちに耳を澄ましながら、地上の最後の避難所であるこの部屋を行きつ戻りつし、脅威を告げるどんな音にも聞き入っているだろう。ハイドは絞首台で死ぬのか。それとも最後の瞬間に、自らを解き放つ勇気を見いだすのか。神のみぞ知る。私にはどうでもよい。私の真の死の時は今であり、この先のことは私以外の者にかかわる。ではここで私は筆を置き、告白を封じ、あの不幸なヘンリー・ジキルの生涯に終止符を打つ。"
    "translation_status": "reviewed"

  - "id": "c08-032"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That is a very strange tale, Poole; this is rather a wild tale my man,” said Mr. Utterson, biting his finger. “Suppose it were as you suppose, supposing Dr. Jekyll to have been—well, murdered, what could induce the murderer to stay? That won’t hold water; it doesn’t commend itself to reason.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[32]"
        "line_start": 2003
        "source_sequence": 233
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-032"
    "translation_ja": "「それはずいぶん妙な話だね、プール。いささか途方もない話だよ、君」とアタスン氏は指を噛みながら言った。「君の思うとおりとしてみよう。ジキル博士が、その、殺されたとしよう。どんな理由があって犯人はいつづけるのだ？　それじゃ筋が通らない。理屈に合う話じゃないよ」"
    "translation_status": "reviewed"
  - "id": "c08-033"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, Mr. Utterson, you are a hard man to satisfy, but I’ll do it yet,” said Poole. “All this last week (you must know) him, or it, whatever it is that lives in that cabinet, has been crying night and day for some sort of medicine and cannot get it to his mind. It was sometimes his way—the master’s, that is—to write his orders on a sheet of paper and throw it on the stair. We’ve had nothing else this week back; nothing but papers, and a closed door, and the very meals left there to be smuggled in when nobody was looking. Well, sir, every day, ay, and twice and thrice in the same day, there have been orders and complaints, and I have been sent flying to all the wholesale chemists in town. Every time I brought the stuff back, there would be another paper telling me to return it, because it was not pure, and another order to a different firm. This drug is wanted bitter bad, sir, whatever for.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[33]"
        "line_start": 2011
        "source_sequence": 234
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-033"
    "translation_ja": "「アタスン様、あなた様を納得させるのは容易じゃないが、まだ言うことがあります」とプールは言った。「この一週間、聞いてください、あいつだか、あれだか、あの私室に住んでいるものは、夜も昼もなんとかいう薬を欲しがって、どうしても気に入るのが手に入らないようでございます。以前にも時に、旦那様は、つまりご主人様のほうですが、ご用を紙切れに書いて階段へお投げになったものでした。この一週間はそれっきり。紙切れと、閉まった戸と、食事まで階段に置かせて、人の見ていないすきにこっそり取り込むのと、それっきりです。毎日ですよ、先生、いえ、一日に二度も三度も、注文だ、苦情だと言いつけられて、私は町じゅうの薬種問屋へすっ飛んで行かされました。品物を持ち帰るたびに、不純だから返して来いという紙がまた出て、別の店への新たな注文が来る。この薬がどういうわけか、死ぬほど欲しいらしいので」"
    "translation_status": "reviewed"
  - "id": "c08-034"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Have you any of these papers?” asked Mr. Utterson."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[34]"
        "line_start": 2027
        "source_sequence": 235
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-034"
    "translation_ja": "「その紙がどれか手もとにあるかね？」とアタスン氏は尋ねた。"
    "translation_status": "reviewed"
  - "id": "c08-035"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Poole felt in his pocket and handed out a crumpled note, which the lawyer, bending nearer to the candle, carefully examined. Its contents ran thus: “Dr. Jekyll presents his compliments to Messrs. Maw. He assures them that their last sample is impure and quite useless for his present purpose. In the year 18—, Dr. J. purchased a somewhat large quantity from Messrs. M. He now begs them to search with most sedulous care, and should any of the same quality be left, forward it to him at once. Expense is no consideration. The importance of this to Dr. J. can hardly be exaggerated.” So far the letter had run composedly enough, but here with a sudden splutter of the pen, the writer’s emotion had broken loose. “For God’s sake,” he added, “find me some of the old.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[35]"
        "line_start": 2031
        "source_sequence": 236
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-035"
    "translation_ja": "プールはポケットを探ってしわになった一筆を出した。弁護士はろうそくに顔を寄せてよく調べた。こう書いてあった。「ジキルよりモー商会御中。先般の見本は明らかに不純にして、目下の用途にはまったく役に立ちません。十八――年、小生は貴店より相当の量を購入いたしました。なにとぞ細心のご注意をもってお探しいただき、当時と同品質の品がお手もとに残っておりましたら、至急小生までお送り願います。費用は問いません。これが小生にとりいかに大切かは、いくら申し述べても足りぬほどであります」。ここまではかなり落ち着いた手紙だったが、ここで急にペンが飛沫を散らし、書き手の激情が奔出した。「後生ですから」と言い足してあった。「前の品を少しでも見つけてください」"
    "translation_status": "reviewed"
  - "id": "c08-036"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is a strange note,” said Mr. Utterson; and then sharply, “How do you come to have it open?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[36]"
        "line_start": 2045
        "source_sequence": 237
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-036"
    "translation_ja": "「奇妙な手紙だね」とアタスン氏は言った。それから鋭い声で、「どうして開いた手紙を君が持っているんだ？」"
    "translation_status": "reviewed"
  - "id": "c08-037"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“The man at Maw’s was main angry, sir, and he threw it back to me like so much dirt,” returned Poole."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[37]"
        "line_start": 2050
        "source_sequence": 238
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-037"
    "translation_ja": "「モーの店の者がたいそう腹を立てましてね、汚いごみでも捨てるように、私に投げ返したのでございます」とプールは答えた。"
    "translation_status": "reviewed"
  - "id": "c08-038"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is unquestionably the doctor’s hand, do you know?” resumed the lawyer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[38]"
        "line_start": 2055
        "source_sequence": 239
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-038"
    "translation_ja": "「これはまぎれもなく博士の字だ。わかっているのかね？」と弁護士は続けた。"
    "translation_status": "reviewed"
  - "id": "c08-039"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I thought it looked like it,” said the servant rather sulkily; and then, with another voice, “But what matters hand of write?” he said. “I’ve seen him!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[39]"
        "line_start": 2060
        "source_sequence": 240
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-039"
    "translation_ja": "「似ていると私も思いました」と召使は少しふくれたように言った。それから声を改め、「しかし、字がどうしたとおっしゃるんです？　私はこの目で見たのです！」"
    "translation_status": "reviewed"
  - "id": "c08-040"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Seen him?” repeated Mr. Utterson. “Well?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[40]"
        "line_start": 2066
        "source_sequence": 241
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-040"
    "translation_ja": "「見たって？」とアタスン氏は繰り返した。「それで？」"
    "translation_status": "reviewed"
  - "id": "c08-041"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s it!” said Poole. “It was this way. I came suddenly into the theatre from the garden. It seems he had slipped out to look for this drug or whatever it is; for the cabinet door was open, and there he was at the far end of the room digging among the crates. He looked up when I came in, gave a kind of cry, and whipped upstairs into the cabinet. It was but for one minute that I saw him, but the hair stood upon my head like quills. Sir, if that was my master, why had he a mask upon his face? If it was my master, why did he cry out like a rat, and run from me? I have served him long enough. And then...” The man paused and passed his hand over his face."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[41]"
        "line_start": 2070
        "source_sequence": 242
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-041"
    "translation_ja": "「そこなんです！」とプールは言った。「こういうわけです。私が庭からひょいと講堂へ入ってゆきました。あれは例の薬だか何だかを捜しにこっそり出ていたのでしょう。私室の戸は開いていて、やつは部屋の向こう端で木箱の間をほじくり返しておりました。私が入ると顔を上げ、妙な叫びを一つあげて、飛ぶように階段を駆け上がり、私室に入りました。見たのはほんの一瞬でしたが、頭の毛が針のように逆立ちました。先生、あれがうちの旦那様なら、どうして顔に仮面を着けていたんです？　旦那様なら、どうしてねずみみたいな声をあげて、私から逃げたんです？　こちとら長年お仕えしてきた身です。それに……」。男は言葉を切り、手で顔をぬぐった。"
    "translation_status": "reviewed"
  - "id": "c08-042"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“These are all very strange circumstances,” said Mr. Utterson, “but I think I begin to see daylight. Your master, Poole, is plainly seized with one of those maladies that both torture and deform the sufferer; hence, for aught I know, the alteration of his voice; hence the mask and the avoidance of his friends; hence his eagerness to find this drug, by means of which the poor soul retains some hope of ultimate recovery—God grant that he be not deceived! There is my explanation; it is sad enough, Poole, ay, and appalling to consider; but it is plain and natural, hangs well together, and delivers us from all exorbitant alarms.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[42]"
        "line_start": 2082
        "source_sequence": 243
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-042"
    "translation_ja": "「どれもひどく奇妙な事情だ」とアタスン氏は言った。「だが少し道が見えてきたような気がするよ。プール、君のご主人はどうやら、病人を苦しめ、しかも姿を変えてしまう病にかかられたのだ。私にはわからんが、声が変わったのもそのせいだろう。仮面をするのも、友人を避けるのもそれで説明がつく。例の薬をほしがるのも同じことさ。それによって、かわいそうに、いつかは治る望みをつないでおられるのだ。どうかその希望が誤りでないように！　これが私の説明だ、プール。十分に悲しいし、考えてみればぞっとする話だ。だが無理がなく、つじつまが合う。行き過ぎた恐怖はすべて捨てられる」"
    "translation_status": "reviewed"
  - "id": "c08-043"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Sir,” said the butler, turning to a sort of mottled pallor, “that thing was not my master, and there’s the truth. My master”—here he looked round him and began to whisper—“is a tall, fine build of a man, and this was more of a dwarf.” Utterson attempted to protest. “O, sir,” cried Poole, “do you think I do not know my master after twenty years? Do you think I do not know where his head comes to in the cabinet door, where I saw him every morning of my life? No, sir, that thing in the mask was never Dr. Jekyll—God knows what it was, but it was never Dr. Jekyll; and it is the belief of my heart that there was murder done.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[43]"
        "line_start": 2094
        "source_sequence": 244
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-043"
    "translation_ja": "「先生」と執事はまだらに血の気が引いた顔で言った。「あれはうちの旦那様じゃありません。それがほんとうです。旦那様は」と周囲を見まわして囁き声になった。「背が高く、立派な体格をしておいでです。あれはむしろ小人のようでした」。アタスンは反論しようとした。「ああ、先生」とプールは叫んだ。「二十年もして旦那様を見分けられぬとお思いですか？　来る朝も来る朝も、あの私室の戸口に立っておられる旦那様の頭が、戸のどこまで届くかを知らぬとお思いですか？　いいえ、先生。あの仮面を着けたものは断じてジキル博士じゃございません。何ものかは神のみぞ知る、けれど断じてジキル博士じゃない。人が殺されたのだと、私は胸の底からそう信じております」"
    "translation_status": "reviewed"
  - "id": "c08-044"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Poole,” replied the lawyer, “if you say that, it will become my duty to make certain. Much as I desire to spare your master’s feelings, much as I am puzzled by this note which seems to prove him to be still alive, I shall consider it my duty to break in that door.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[44]"
        "line_start": 2107
        "source_sequence": 245
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-044"
    "translation_ja": "「プール」と弁護士は答えた。「そこまで言うのなら、確かめるのは私の務めになる。ご主人のお気持ちを傷つけまいといくら願っても、ご存命の証拠と思われる手紙にいくら途方に暮れようとも、あの戸を打ち破るのが私の務めだと考えよう」"
    "translation_status": "reviewed"
  - "id": "c08-045"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ah, Mr. Utterson, that’s talking!” cried the butler."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[45]"
        "line_start": 2114
        "source_sequence": 246
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-045"
    "translation_ja": "「ああ、アタスン様、そうこなくては！」と執事は叫んだ。"
    "translation_status": "reviewed"
  - "id": "c08-046"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And now comes the second question,” resumed Utterson: “Who is going to do it?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[46]"
        "line_start": 2118
        "source_sequence": 247
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-046"
    "translation_ja": "「そこで二番目の問題だ」とアタスンは続けた。「誰がそれをやるのかね？」"
    "translation_status": "reviewed"
  - "id": "c08-047"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Why, you and me, sir,” was the undaunted reply."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[47]"
        "line_start": 2123
        "source_sequence": 248
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-047"
    "translation_ja": "「もちろん、先生とこの私で」とひるまず答えた。"
    "translation_status": "reviewed"
  - "id": "c08-048"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s very well said,” returned the lawyer; “and whatever comes of it, I shall make it my business to see you are no loser.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[48]"
        "line_start": 2127
        "source_sequence": 249
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-048"
    "translation_ja": "「よく言った」と弁護士は答えた。「そしてどんな結果になろうと、君が不利益を被らないように計らうのは私の責任だ」"
    "translation_status": "reviewed"
  - "id": "c08-049"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There is an axe in the theatre,” continued Poole; “and you might take the kitchen poker for yourself.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[49]"
        "line_start": 2133
        "source_sequence": 250
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-049"
    "translation_ja": "「講堂に斧があります」とプールは続けた。「先生はご自分用に台所の火かき棒をお持ちになるといい」"
    "translation_status": "reviewed"
  - "id": "c08-050"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The lawyer took that rude but weighty instrument into his hand, and balanced it. “Do you know, Poole,” he said, looking up, “that you and I are about to place ourselves in a position of some peril?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[50]"
        "line_start": 2138
        "source_sequence": 251
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-050"
    "translation_ja": "弁護士は粗末だがずっしりしたその道具を手に取り、重みを測った。「わかっているかね、プール」と顔を上げた。「われわれ二人はこれから、少なからぬ危険に身をさらすことになるのだが？」"
    "translation_status": "reviewed"
  - "id": "c08-051"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You may say so, sir, indeed,” returned the butler."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[51]"
        "line_start": 2144
        "source_sequence": 252
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-051"
    "translation_ja": "「まことにおっしゃるとおりでございます」と執事は答えた。"
    "translation_status": "reviewed"
  - "id": "c08-052"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It is well, then that we should be frank,” said the other. “We both think more than we have said; let us make a clean breast. This masked figure that you saw, did you recognise it?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[52]"
        "line_start": 2148
        "source_sequence": 253
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-052"
    "translation_ja": "「それなら率直に話しておくのがいい」と相手は言った。「二人ともまだ口に出していない考えがある。腹を割ろうじゃないか。君が見た仮面の人影だが、誰なのか見覚えがあったかね？」"
    "translation_status": "reviewed"
  - "id": "c08-053"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, sir, it went so quick, and the creature was so doubled up, that I could hardly swear to that,” was the answer. “But if you mean, was it Mr. Hyde?—why, yes, I think it was! You see, it was much of the same bigness; and it had the same quick, light way with it; and then who else could have got in by the laboratory door? You have not forgot, sir, that at the time of the murder he had still the key with him? But that’s not all. I don’t know, Mr. Utterson, if you ever met this Mr. Hyde?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[53]"
        "line_start": 2154
        "source_sequence": 254
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-053"
    "translation_ja": "「それは先生、あっというまでしたし、あれは身を二つに折るようにかがんでおりましたから、誰だと断言するのはむずかしいのですが」と答えがあった。「しかしハイド様だったかとお尋ねなら、ええ、そうだったと思います！　何しろ体の大きさが大方同じで、身のこなしも同じようにすばしこく、軽かった。それにあの実験室の戸からほかに誰が入れます？　先生、あの人殺しの時にもあの方がまだ鍵をお持ちだったこと、お忘れじゃございますまい。しかし、それだけではないのです。アタスン様、あのハイド様にはお会いになったことがおありでしょうか？」"
    "translation_status": "reviewed"
  - "id": "c08-054"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes,” said the lawyer, “I once spoke with him.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[54]"
        "line_start": 2164
        "source_sequence": 255
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-054"
    "translation_ja": "「ある」と弁護士は言った。「一度言葉を交わした」"
    "translation_status": "reviewed"
  - "id": "c08-055"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Then you must know as well as the rest of us that there was something queer about that gentleman—something that gave a man a turn—I don’t know rightly how to say it, sir, beyond this: that you felt in your marrow kind of cold and thin.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[55]"
        "line_start": 2168
        "source_sequence": 256
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-055"
    "translation_ja": "「なら、あのお方に何か妙なところがあって、出くわすと人がぎくりとするのは、私どもと同じようにご存じのはずです。どう申していいか、先生、ただ骨の髄まで冷えて、すうっと痩せ細るような気がした、そうとしか言いようがございません」"
    "translation_status": "reviewed"
  - "id": "c08-056"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I own I felt something of what you describe,” said Mr. Utterson."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[56]"
        "line_start": 2175
        "source_sequence": 257
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-056"
    "translation_ja": "「確かに君の言うようなものをいくらか感じたね」とアタスン氏は言った。"
    "translation_status": "reviewed"
  - "id": "c08-057"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Quite so, sir,” returned Poole. “Well, when that masked thing like a monkey jumped from among the chemicals and whipped into the cabinet, it went down my spine like ice. O, I know it’s not evidence, Mr. Utterson; I’m book-learned enough for that; but a man has his feelings, and I give you my bible-word it was Mr. Hyde!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[57]"
        "line_start": 2179
        "source_sequence": 258
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-057"
    "translation_ja": "「さようでございましょう」とプールは答えた。「あの仮面のものが猿みたいに薬品の間から跳び出して、さっと私室へ駆け込んだとき、背筋を氷が滑り下りるようでした。ええ、それが証拠にならないくらい、アタスン様、私だってものの本は読んでいます。しかし人には肌で感じるものがある。聖書にかけて申します、あれはハイド様でした！」"
    "translation_status": "reviewed"
  - "id": "c08-058"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ay, ay,” said the lawyer. “My fears incline to the same point. Evil, I fear, founded—evil was sure to come—of that connection. Ay truly, I believe you; I believe poor Harry is killed; and I believe his murderer (for what purpose, God alone can tell) is still lurking in his victim’s room. Well, let our name be vengeance. Call Bradshaw.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[58]"
        "line_start": 2187
        "source_sequence": 259
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-058"
    "translation_ja": "「うむ、うむ」と弁護士は言った。「私の恐れていることも同じ方を向いている。あのつきあいは、恐らく悪に始まった。悪を生むのは必定だったんだ。うむ、君の言うことを信じよう。気の毒なハリーは殺されたのだと思う。そして殺した男は、何のためやら神のみぞ知るが、犠牲者の部屋に今も潜んでいるのだと思う。よし、われわれは仇を討つ者だ。ブラッドショーを呼んでくれ」"
    "translation_status": "reviewed"
  - "id": "c08-059"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The footman came at the summons, very white and nervous."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[59]"
        "line_start": 2195
        "source_sequence": 260
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-059"
    "translation_ja": "呼ばれた従僕が来た。顔は真っ青で、おどおどしていた。"
    "translation_status": "reviewed"
  - "id": "c08-060"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Pull yourself together, Bradshaw,” said the lawyer. “This suspense, I know, is telling upon all of you; but it is now our intention to make an end of it. Poole, here, and I are going to force our way into the cabinet. If all is well, my shoulders are broad enough to bear the blame. Meanwhile, lest anything should really be amiss, or any malefactor seek to escape by the back, you and the boy must go round the corner with a pair of good sticks and take your post at the laboratory door. We give you ten minutes to get to your stations.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[60]"
        "line_start": 2199
        "source_sequence": 261
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-060"
    "translation_ja": "「しっかりしなさい、ブラッドショー」と弁護士は言った。「何事かわからずに待つのが全員にこたえているのは知っている。だがこれからそれにけりをつけるつもりだ。ここにいるプールと私は、あの私室に押し入る。何事もなければ私には責任を引き受けるだけの肩幅がある。一方、本当に何か異変があって、悪党が裏から逃げようとすると困る。君はあの少年と一本ずつ丈夫な棒を持って角を回り、実験室の戸口を見張ってくれ。持ち場につくまで十分間待つ」"
    "translation_status": "reviewed"
  - "id": "c08-061"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As Bradshaw left, the lawyer looked at his watch. “And now, Poole, let us get to ours,” he said; and taking the poker under his arm, led the way into the yard. The scud had banked over the moon, and it was now quite dark. The wind, which only broke in puffs and draughts into that deep well of building, tossed the light of the candle to and fro about their steps, until they came into the shelter of the theatre, where they sat down silently to wait. London hummed solemnly all around; but nearer at hand, the stillness was only broken by the sounds of a footfall moving to and fro along the cabinet floor."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[61]"
        "line_start": 2210
        "source_sequence": 262
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-061"
    "translation_ja": "ブラッドショーが去ると、弁護士は時計を見た。「さあ、プール、われわれも持ち場につこう」と言って、火かき棒を小脇に抱え、中庭へ先に立った。飛び雲が月の上に積もり、もうまったくの闇だった。井戸の底のように建物に囲まれた庭には、ときおり一吹きの風や吹き抜ける気流しか届かなかったが、それでも二人の足もとでろうそくの光が右に左に揺れた。講堂の囲いに入ると、二人は黙って腰を下ろし、待った。辺り一帯でロンドンが重々しくうなっていた。が、もっと近くでは、私室の床を行きつ戻りつする一人の足音だけが静寂を破った。"
    "translation_status": "reviewed"
  - "id": "c08-062"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“So it will walk all day, sir,” whispered Poole; “ay, and the better part of the night. Only when a new sample comes from the chemist, there’s a bit of a break. Ah, it’s an ill conscience that’s such an enemy to rest! Ah, sir, there’s blood foully shed in every step of it! But hark again, a little closer—put your heart in your ears, Mr. Utterson, and tell me, is that the doctor’s foot?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[62]"
        "line_start": 2222
        "source_sequence": 263
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-062"
    "translation_ja": "「ああやって一日じゅう歩くのです」とプールは囁いた。「ええ、夜も大半を。薬屋から新しい見本が来たときだけ、ちょっと途切れます。ああ、あれほど安らぎの仇になるのは、やましい心です！　先生、あの足の一歩一歩にむごく流された血がにじんでいます！　でももう一度、よく聞いてください。心ごと耳に集めて、アタスン様、お教えください。あれは博士の足音でございましょうか？」"
    "translation_status": "reviewed"
  - "id": "c08-063"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The steps fell lightly and oddly, with a certain swing, for all they went so slowly; it was different indeed from the heavy creaking tread of Henry Jekyll. Utterson sighed. “Is there never anything else?” he asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[63]"
        "line_start": 2231
        "source_sequence": 264
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-063"
    "translation_ja": "足音は軽く、妙な踏み方で、あれほどゆっくり運んでいるのに、どこかはずみがあった。重く床をきしませるヘンリー・ジキルの足取りとは確かに違った。アタスンはため息をついた。「ほかの音はまったくしないのかね」と尋ねた。"
    "translation_status": "reviewed"
  - "id": "c08-064"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Poole nodded. “Once,” he said. “Once I heard it weeping!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[64]"
        "line_start": 2237
        "source_sequence": 265
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-064"
    "translation_ja": "プールはうなずいた。「一度だけ」と言った。「一度、あれが泣くのを聞きました！」"
    "translation_status": "reviewed"
  - "id": "c08-065"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Weeping? how that?” said the lawyer, conscious of a sudden chill of horror."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[65]"
        "line_start": 2242
        "source_sequence": 266
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-065"
    "translation_ja": "「泣く？　どんなふうに？」と弁護士は尋ね、にわかに背筋が寒くなるのを覚えた。"
    "translation_status": "reviewed"
  - "id": "c08-066"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Weeping like a woman or a lost soul,” said the butler. “I came away with that upon my heart, that I could have wept too.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[66]"
        "line_start": 2247
        "source_sequence": 267
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-066"
    "translation_ja": "「女のように、さもなくば救われぬ魂のように泣きました」と執事は言った。「それを胸にそこを離れましたが、私も一緒に泣けそうでございました」"
    "translation_status": "reviewed"
  - "id": "c08-067"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But now the ten minutes drew to an end. Poole disinterred the axe from under a stack of packing straw; the candle was set upon the nearest table to light them to the attack; and they drew near with bated breath to where that patient foot was still going up and down, up and down, in the quiet of the night."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[67]"
        "line_start": 2252
        "source_sequence": 268
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-067"
    "translation_ja": "そうするうち、約束の十分が過ぎようとしていた。プールは積み上げた荷造り用の藁の下から斧を掘り出した。襲いかかる手もとを照らすため、ろうそくは最寄りの台の上に置いた。息を詰めた二人は、あの足音が今も、夜の静けさの中で飽くことなく行きつ戻りつ、行きつ戻りつする場所に近寄った。"
    "translation_status": "reviewed"
  - "id": "c08-068"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Jekyll,” cried Utterson, with a loud voice, “I demand to see you.” He paused a moment, but there came no reply. “I give you fair warning, our suspicions are aroused, and I must and shall see you,” he resumed; “if not by fair means, then by foul—if not of your consent, then by brute force!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[68]"
        "line_start": 2259
        "source_sequence": 269
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-068"
    "translation_ja": "「ジキル」とアタスンは大声で呼んだ。「会ってもらうぞ」。しばらく待ったが返事はなかった。「先に断っておくが、われわれは疑いを抱いている。ぜひとも君に会わなければならないし、会ってみせる」と続けた。「穏便にいかなければ手荒にだ。君の同意でできなければ、腕ずくでも！」"
    "translation_status": "reviewed"
  - "id": "c08-069"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Utterson,” said the voice, “for God’s sake, have mercy!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[69]"
        "line_start": 2267
        "source_sequence": 270
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-069"
    "translation_ja": "「アタスン」と声が言った。「後生だ、慈悲をかけてくれ！」"
    "translation_status": "reviewed"
  - "id": "c08-070"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ah, that’s not Jekyll’s voice—it’s Hyde’s!” cried Utterson. “Down with the door, Poole!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[70]"
        "line_start": 2272
        "source_sequence": 271
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-070"
    "translation_ja": "「ああ、ジキルの声ではない。ハイドだ！」とアタスンは叫んだ。「戸を打ち破れ、プール！」"
    "translation_status": "reviewed"
  - "id": "c08-071"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Poole swung the axe over his shoulder; the blow shook the building, and the red baize door leaped against the lock and hinges. A dismal screech, as of mere animal terror, rang from the cabinet. Up went the axe again, and again the panels crashed and the frame bounded; four times the blow fell; but the wood was tough and the fittings were of excellent workmanship; and it was not until the fifth, that the lock burst and the wreck of the door fell inwards on the carpet."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[71]"
        "line_start": 2277
        "source_sequence": 272
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-071"
    "translation_ja": "プールは斧を肩越しに振り上げた。一撃が建物を揺さぶり、赤いラシャの戸が錠と蝶番にぶつかって跳ねた。私室から、純然たる獣の恐怖が発するような痛ましい悲鳴が響いた。もう一度斧が上がる。また羽目板が轟き、枠が跳ねる。四度まで打撃が落ちたが、木は粘り強く、金具はすぐれた職人の手になるものだった。五度目になってようやく錠がはじけ、壊れた戸が内側の絨毯に倒れた。"
    "translation_status": "reviewed"
  - "id": "c08-072"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The besiegers, appalled by their own riot and the stillness that had succeeded, stood back a little and peered in. There lay the cabinet before their eyes in the quiet lamplight, a good fire glowing and chattering on the hearth, the kettle singing its thin strain, a drawer or two open, papers neatly set forth on the business table, and nearer the fire, the things laid out for tea; the quietest room, you would have said, and, but for the glazed presses full of chemicals, the most commonplace that night in London."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[72]"
        "line_start": 2287
        "source_sequence": 273
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-072"
    "translation_ja": "攻め手の二人は、自分たちの立てた騒音とそれに続く静けさにおじけづいて少し下がり、中をのぞいた。ランプの静かな光の中、目の前には私室があった。暖炉にはよい火が赤々とぱちぱち音を立て、やかんは細く歌い、引き出しが一つ二つ開いていて、執務机の上には書類がきちんと並び、火に近いところにはお茶の道具が用意されていた。その夜ロンドンでいちばん静かな部屋、そして薬品の詰まったガラス戸棚さえなければ、いちばんありふれた部屋だと、誰しも言ったろう。"
    "translation_status": "reviewed"
  - "id": "c08-073"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Right in the middle there lay the body of a man sorely contorted and still twitching. They drew near on tiptoe, turned it on his back and beheld the face of Edward Hyde. He was dressed in clothes far too large for him, clothes of the doctor’s bigness; the cords of his face still moved with a semblance of life, but life was quite gone; and by the crushed phial in the hand and the strong smell of kernels that hung upon the air, Utterson knew that he was looking on the body of a self-destroyer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[73]"
        "line_start": 2297
        "source_sequence": 274
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-073"
    "translation_ja": "その真ん中に男が一人、体をひどくねじ曲げ、まだぴくぴく動きながら横たわっていた。二人は抜き足で近寄り、仰向けに返すと、エドワード・ハイドの顔を認めた。身には大きすぎる服、博士の体格に合う服を着ていた。顔の筋はまだ生きているかのように動いたが、命はすっかり失われていた。手には砕けた小瓶があり、木の実の核に似た強いにおいがあたりに漂っていた。それでアタスンは自分の命を自ら絶った者の遺骸を見ているのだと知った。"
    "translation_status": "reviewed"
  - "id": "c08-074"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“We have come too late,” he said sternly, “whether to save or punish. Hyde is gone to his account; and it only remains for us to find the body of your master.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[74]"
        "line_start": 2307
        "source_sequence": 275
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-074"
    "translation_ja": "「助けるにも、罰するにも、来るのが遅すぎた」と彼は厳しい声で言った。「ハイドは裁きを受けに行った。われわれに残されたのは君のご主人のご遺体を捜すことだけだ」"
    "translation_status": "reviewed"
  - "id": "c08-075"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The far greater proportion of the building was occupied by the theatre, which filled almost the whole ground storey and was lighted from above, and by the cabinet, which formed an upper storey at one end and looked upon the court. A corridor joined the theatre to the door on the by-street; and with this the cabinet communicated separately by a second flight of stairs. There were besides a few dark closets and a spacious cellar. All these they now thoroughly examined. Each closet needed but a glance, for all were empty, and all, by the dust that fell from their doors, had stood long unopened. The cellar, indeed, was filled with crazy lumber, mostly dating from the times of the surgeon who was Jekyll’s predecessor; but even as they opened the door they were advertised of the uselessness of further search, by the fall of a perfect mat of cobweb which had for years sealed up the entrance. Nowhere was there any trace of Henry Jekyll, dead or alive."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[75]"
        "line_start": 2313
        "source_sequence": 276
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-075"
    "translation_ja": "この建物の大部分を占めるのは、階下のほぼ全部に広がり、明かりを屋根から取る講堂と、その一端で二階をなし、中庭に面した私室だった。廊下が講堂と横町の戸口を結び、私室からも別の階段が直接この廊下に通じていた。ほかには暗い物置がいくつかと、大きな地下室があった。二人はこれらをいま隅々まで調べた。物置はそれぞれひと目で済んだ。どれも空で、戸から落ちる埃から見て、長く開けられたこともなかった。なるほど地下室にはがたがたの古道具がぎっしり詰まり、その大半はジキルの前の持ち主、あの外科医の時代からの品だった。だが戸を開けると同時に、何年も入り口を封じてきた蜘蛛の巣がすっかり敷物のような塊になって落ち、それ以上捜しても無駄だとわかった。生者のものにせよ死者のものにせよ、ヘンリー・ジキルの痕跡はどこにもなかった。"
    "translation_status": "reviewed"
  - "id": "c08-076"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Poole stamped on the flags of the corridor. “He must be buried here,” he said, hearkening to the sound."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[76]"
        "line_start": 2329
        "source_sequence": 277
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-076"
    "translation_ja": "プールが廊下の敷石を踏み鳴らした。「この下に埋められたに違いありません」とその響きに耳を澄ませながら言った。"
    "translation_status": "reviewed"
  - "id": "c08-077"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Or he may have fled,” said Utterson, and he turned to examine the door in the by-street. It was locked; and lying near by on the flags, they found the key, already stained with rust."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[77]"
        "line_start": 2334
        "source_sequence": 278
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-077"
    "translation_ja": "「あるいは逃げたのかもしれない」とアタスンは言い、横町に面した戸を調べに向き直った。鍵がかかっていた。すぐそばの敷石の上に、すでに錆の浮いた鍵そのものが落ちていた。"
    "translation_status": "reviewed"
  - "id": "c08-078"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This does not look like use,” observed the lawyer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[78]"
        "line_start": 2340
        "source_sequence": 279
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-078"
    "translation_ja": "「これでは使っていたように見えないな」と弁護士は言った。"
    "translation_status": "reviewed"
  - "id": "c08-079"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Use!” echoed Poole. “Do you not see, sir, it is broken? much as if a man had stamped on it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[79]"
        "line_start": 2344
        "source_sequence": 280
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-079"
    "translation_ja": "「使っていた！」とプールは繰り返した。「折れているのがご覧になれませんか。まるで誰かが踏みつけたみたいに」"
    "translation_status": "reviewed"
  - "id": "c08-080"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ay,” continued Utterson, “and the fractures, too, are rusty.” The two men looked at each other with a scare. “This is beyond me, Poole,” said the lawyer. “Let us go back to the cabinet.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[80]"
        "line_start": 2349
        "source_sequence": 281
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-080"
    "translation_ja": "「うむ」とアタスンは続けた。「しかも折れ口も錆びている」。二人はおびえて顔を見合わせた。「私にはわからんよ、プール」と弁護士は言った。「私室へ戻ろう」"
    "translation_status": "reviewed"
  - "id": "c08-081"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They mounted the stair in silence, and still with an occasional awestruck glance at the dead body, proceeded more thoroughly to examine the contents of the cabinet. At one table, there were traces of chemical work, various measured heaps of some white salt being laid on glass saucers, as though for an experiment in which the unhappy man had been prevented."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[81]"
        "line_start": 2356
        "source_sequence": 282
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-081"
    "translation_ja": "二人は無言で階段を上り、ときどき死体に畏怖の目を向けながら、私室の中の品物をさらに念入りに調べた。ある台の上には化学の作業の跡があった。白い塩類が何山かに量り分けられ、ガラスの小皿に置いてあり、不幸な男が実験をしようとして果たせなかったかのようだった。"
    "translation_status": "reviewed"
  - "id": "c08-082"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That is the same drug that I was always bringing him,” said Poole; and even as he spoke, the kettle with a startling noise boiled over."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[82]"
        "line_start": 2364
        "source_sequence": 283
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-082"
    "translation_ja": "「あれが私がいつもお届けしたのと同じ薬です」とプールが言うか言わないかに、やかんがはっとするような音を立てて吹きこぼれた。"
    "translation_status": "reviewed"
  - "id": "c08-083"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This brought them to the fireside, where the easy-chair was drawn cosily up, and the tea things stood ready to the sitter’s elbow, the very sugar in the cup. There were several books on a shelf; one lay beside the tea things open, and Utterson was amazed to find it a copy of a pious work, for which Jekyll had several times expressed a great esteem, annotated, in his own hand with startling blasphemies."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[83]"
        "line_start": 2369
        "source_sequence": 284
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-083"
    "translation_ja": "二人は暖炉のそばに引き寄せられた。安楽椅子が居心地よく寄せられ、座る人の肘もとにお茶の道具が揃い、茶碗には砂糖まで入っていた。棚には本が数冊あった。一冊はお茶道具の横に開いてあり、アタスンはそれが、ジキルが何度も深い敬意を口にした信仰の書なのに、本人の筆で驚くべき冒瀆の文句が書き込まれているのを見て仰天した。"
    "translation_status": "reviewed"
  - "id": "c08-084"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Next, in the course of their review of the chamber, the searchers came to the cheval-glass, into whose depths they looked with an involuntary horror. But it was so turned as to show them nothing but the rosy glow playing on the roof, the fire sparkling in a hundred repetitions along the glazed front of the presses, and their own pale and fearful countenances stooping to look in."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[84]"
        "line_start": 2378
        "source_sequence": 285
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-084"
    "translation_ja": "次に室内を見まわすうち、二人の捜し手は姿見の前に来た。思わず恐れにとらわれつつ、その奥をのぞいた。だが鏡の向きのせいで見えたのは、天井にたわむれるばら色の照り返しと、戸棚のガラスの前面に幾重にもきらめき映る火影と、身をかがめてのぞき込む自分たちの青ざめた怯え顔だけだった。"
    "translation_status": "reviewed"
  - "id": "c08-085"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This glass has seen some strange things, sir,” whispered Poole."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[85]"
        "line_start": 2386
        "source_sequence": 286
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-085"
    "translation_ja": "「先生、この鏡は妙なものをいろいろ見てきたでしょうね」とプールが囁いた。"
    "translation_status": "reviewed"
  - "id": "c08-086"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And surely none stranger than itself,” echoed the lawyer in the same tones. “For what did Jekyll”—he caught himself up at the word with a start, and then conquering the weakness—“what could Jekyll want with it?” he said."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[86]"
        "line_start": 2390
        "source_sequence": 287
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-086"
    "translation_ja": "「だがこの鏡自身ほど妙なものはあるまい」と弁護士も同じようにささやき返した。「ジキルは何のためにこれを……」。その名を口にして彼ははっと言いよどんだが、弱気を抑え、「ジキルには何のためにこれが必要だったのだろう？」と言った。"
    "translation_status": "reviewed"
  - "id": "c08-087"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You may say that!” said Poole."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[87]"
        "line_start": 2397
        "source_sequence": 288
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-087"
    "translation_ja": "「おっしゃるとおりでございます！」とプールは言った。"
    "translation_status": "reviewed"
  - "id": "c08-088"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Next they turned to the business table. On the desk, among the neat array of papers, a large envelope was uppermost, and bore, in the doctor’s hand, the name of Mr. Utterson. The lawyer unsealed it, and several enclosures fell to the floor. The first was a will, drawn in the same eccentric terms as the one which he had returned six months before, to serve as a testament in case of death and as a deed of gift in case of disappearance; but in place of the name of Edward Hyde, the lawyer, with indescribable amazement read the name of Gabriel John Utterson. He looked at Poole, and then back at the paper, and last of all at the dead malefactor stretched upon the carpet."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[88]"
        "line_start": 2401
        "source_sequence": 289
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-088"
    "translation_ja": "次に向かったのは執務机だった。きちんと並べた書類のいちばん上に大きな封筒があり、博士の筆でアタスン氏の名が記してあった。弁護士が封を切ると、中から数通の書付が床に落ちた。最初は遺言書で、六か月前に返したものと同じ奇妙な条件、つまり死亡の際には遺言として、失踪の際には贈与証書として効力を持つように作ってあった。ただしエドワード・ハイドの名に代わって、弁護士が言いようもない驚きとともに読み取ったのは、ゲイブリエル・ジョン・アタスンの名だった。彼はプールを見、また書面を見、最後に絨毯の上に伸びた死せる悪人に目をやった。"
    "translation_status": "reviewed"
  - "id": "c08-089"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“My head goes round,” he said. “He has been all these days in possession; he had no cause to like me; he must have raged to see himself displaced; and he has not destroyed this document.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[89]"
        "line_start": 2413
        "source_sequence": 290
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-089"
    "translation_ja": "「頭がぐるぐる回るよ」と彼は言った。「あの男はこの何日もずっとここを占領していた。私に好意を持つ理由などなかった。自分が受取人から外されたのを見て、さぞ腹を立てたろう。それでいて、この書類を破り捨ててはいない」"
    "translation_status": "reviewed"
  - "id": "c08-090"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He caught up the next paper; it was a brief note in the doctor’s hand and dated at the top. “O Poole!” the lawyer cried, “he was alive and here this day. He cannot have been disposed of in so short a space; he must be still alive, he must have fled! And then, why fled? and how? and in that case, can we venture to declare this suicide? O, we must be careful. I foresee that we may yet involve your master in some dire catastrophe.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[90]"
        "line_start": 2419
        "source_sequence": 291
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-090"
    "translation_ja": "彼は次の書面をさっと取り上げた。博士自筆の短い手紙で、上には日付があった。「おい、プール！」と弁護士は叫んだ。「あの人はきょうここに生きていた。こんな短い間にあとかたもなく片づけられたはずはない。まだ生きている、逃げたに違いない！　ならば、なぜ逃げた？　どうやって？　そして、そういうことなら、われわれはこれを自殺と断じてよいのか？　ああ、慎重にしよう。君のご主人を何かひどい破滅に巻き込みかねんぞ」"
    "translation_status": "reviewed"
  - "id": "c08-091"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Why don’t you read it, sir?” asked Poole."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[91]"
        "line_start": 2428
        "source_sequence": 292
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-091"
    "translation_ja": "「お読みになってはいかがです、先生」とプールは尋ねた。"
    "translation_status": "reviewed"
  - "id": "c08-092"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Because I fear,” replied the lawyer solemnly. “God grant I have no cause for it!” And with that he brought the paper to his eyes and read as follows:"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[92]"
        "line_start": 2432
        "source_sequence": 293
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-092"
    "translation_ja": "「怖いのだ」と弁護士は厳粛に答えた。「どうか恐れる理由がないように！」　そう言って紙を目に近づけ、次のように読んだ。"
    "translation_status": "reviewed"
  - "id": "c08-093"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“My dear Utterson,—When this shall fall into your hands, I shall have disappeared, under what circumstances I have not the penetration to foresee, but my instinct and all the circumstances of my nameless situation tell me that the end is sure and must be early. Go then, and first read the narrative which Lanyon warned me he was to place in your hands; and if you care to hear more, turn to the confession of"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[93]"
        "line_start": 2438
        "source_sequence": 294
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-093"
    "translation_ja": "「親愛なるアタスン。これが君の手に渡るとき、僕は姿を消しているだろう。どのような事情でそうなるかを見通すほどの洞察は僕にない。だがこの名づけようもない境遇のあらゆる事情と本能とが、終わりは確実で、しかも近いと告げている。そのときはまず、ラニョンが君の手に預けると僕に予告していた手記を取って読んでくれ。なお聞く気があるなら、次いで僕の告白を開いてほしい。"
    "translation_status": "reviewed"
  - "id": "c08-094"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Your unworthy and unhappy friend,"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[94]"
        "line_start": 2447
        "source_sequence": 295
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-094"
    "translation_ja": "君の友情に値せぬ、不幸な友"
    "translation_status": "reviewed"
  - "id": "c08-095"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“HENRY JEKYLL.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[95]"
        "line_start": 2451
        "source_sequence": 296
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-095"
    "translation_ja": "ヘンリー・ジキル」"
    "translation_status": "reviewed"
  - "id": "c08-096"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There was a third enclosure?” asked Utterson."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[96]"
        "line_start": 2455
        "source_sequence": 297
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-096"
    "translation_ja": "「三つ目の同封物があったね？」とアタスンは尋ねた。"
    "translation_status": "reviewed"
  - "id": "c08-097"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Here, sir,” said Poole, and gave into his hands a considerable packet sealed in several places."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[97]"
        "line_start": 2459
        "source_sequence": 298
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-097"
    "translation_ja": "「ここに、先生」とプールは言い、何か所も封をした、かなり厚い包みをその手に渡した。"
    "translation_status": "reviewed"
  - "id": "c08-098"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The lawyer put it in his pocket. “I would say nothing of this paper. If your master has fled or is dead, we may at least save his credit. It is now ten; I must go home and read these documents in quiet; but I shall be back before midnight, when we shall send for the police.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[98]"
        "line_start": 2464
        "source_sequence": 299
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-098"
    "translation_ja": "弁護士はそれをポケットに入れた。「この書付のことは黙っておこう。ご主人が逃げたにせよ亡くなったにせよ、少なくとも名誉は守れるかもしれない。今は十時だ。私は家に帰り、落ち着いてこれらの書類を読まねばならん。十二時前には戻るから、そこで警察を呼ぶことにしよう」"
    "translation_status": "reviewed"
  - "id": "c08-099"
    "section_id": "chapter-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They went out, locking the door of the theatre behind them; and Utterson, once more leaving the servants gathered about the fire in the hall, trudged back to his office to read the two narratives in which this mystery was now to be explained."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[10]/p[99]"
        "line_start": 2471
        "source_sequence": 300
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap08"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c08-099"
    "translation_ja": "講堂を出ると、二人はその戸に鍵を掛けた。アタスンは広間でまだ火のそばに集まっている召使たちをあとに、事務所へ重い足を運んだ。今こそこの謎を解き明かす二つの手記を読むためだった。"
    "translation_status": "reviewed"
  - "id": "c09-000"

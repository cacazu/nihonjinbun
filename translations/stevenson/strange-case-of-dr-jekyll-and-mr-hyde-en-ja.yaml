        "original_unit_id": "c10-022"
    "translation_ja": "万事に終わりは来る。どんなに大きな升でもいつかは満ちる。私の悪へのこの一時の譲歩が、ついに魂の均衡を壊した。それでも私は警戒しなかった。この転落は発見以前の昔の日々に戻ったようで、自然に思われた。一月の、よく晴れた美しい日だった。霜のとけた足もとは濡れていたが、頭上に雲一つなく、リージェンツ・パークは冬の小鳥の声に満ち、春の匂いに甘く香っていた。私は日の当たるベンチに座った。内なる獣は記憶を味わって舌なめずりし、霊の側は少しまどろみ、いずれ悔い改めようと約束はするものの、今すぐ取りかかる気にはならなかった。結局のところ自分も隣人と同じようなものだ、と考えた。次いで、自分とほかの男を、自ら進んで行う親切と、彼らが怠けて人を顧みない冷たさとを比べて微笑した。そのうぬぼれた考えのまさにその瞬間、気が遠のき、おぞましい吐き気と死ぬほどの震えが襲った。それらが去ると力が抜けた。そしてそのふらつきも引くにつれ、考えの調子が変わったことに気づいた。より大きな大胆さ、危険への侮り、義務の縛めの解け去る感じ。見下ろした。服は縮んだ手足にだらしなく垂れ、膝の上の手は筋張り、毛深かった。私はふたたびエドワード・ハイドだった。ほんの一瞬前にはあらゆる人の敬意に守られ、富み、愛され、家の食堂では私のために食卓布が広げられていた。それが今や、すべての人間が追い立てる獲物、追われ、家もなく、名の知れた殺人犯で、絞首台につながれた奴隷だった。"
    "translation_status": "reviewed"
  - "id": "c10-023"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "My reason wavered, but it did not fail me utterly. I have more than once observed that in my second character, my faculties seemed sharpened to a point and my spirits more tensely elastic; thus it came about that, where Jekyll perhaps might have succumbed, Hyde rose to the importance of the moment. My drugs were in one of the presses of my cabinet; how was I to reach them? That was the problem that (crushing my temples in my hands) I set myself to solve. The laboratory door I had closed. If I sought to enter by the house, my own servants would consign me to the gallows. I saw I must employ another hand, and thought of Lanyon. How was he to be reached? how persuaded? Supposing that I escaped capture in the streets, how was I to make my way into his presence? and how should I, an unknown and displeasing visitor, prevail on the famous physician to rifle the study of his colleague, Dr. Jekyll? Then I remembered that of my original character, one part remained to me: I could write my own hand; and once I had conceived that kindling spark, the way that I must follow became lighted up from end to end."
    "source_languages":
      - "en"
    "source_locations":

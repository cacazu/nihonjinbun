    "translation_ja": "手紙の一件"
    "translation_status": "reviewed"
  - "id": "c05-001"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was late in the afternoon, when Mr. Utterson found his way to Dr. Jekyll’s door, where he was at once admitted by Poole, and carried down by the kitchen offices and across a yard which had once been a garden, to the building which was indifferently known as the laboratory or dissecting rooms. The doctor had bought the house from the heirs of a celebrated surgeon; and his own tastes being rather chemical than anatomical, had changed the destination of the block at the bottom of the garden. It was the first time that the lawyer had been received in that part of his friend’s quarters; and he eyed the dingy, windowless structure with curiosity, and gazed round with a distasteful sense of strangeness as he crossed the theatre, once crowded with eager students and now lying gaunt and silent, the tables laden with chemical apparatus, the floor strewn with crates and littered with packing straw, and the light falling dimly through the foggy cupola. At the further end, a flight of stairs mounted to a door covered with red baize; and through this, Mr. Utterson was at last received into the doctor’s cabinet. It was a large room fitted round with glass presses, furnished, among other things, with a cheval-glass and a business table, and looking out upon the court by three dusty windows barred with iron. The fire burned in the grate; a lamp was set lighted on the chimney shelf, for even in the houses the fog began to lie thickly; and there, close up to the warmth, sat Dr. Jekyll, looking deathly sick. He did not rise to meet his visitor, but held out a cold hand and bade him welcome in a changed voice."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[1]"
        "line_start": 1289
        "source_sequence": 134
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-001"
    "translation_ja": "アタスン氏がジキル博士の家の戸口にたどり着いたのは、午後も遅くなってからだった。プールはすぐに彼を入れ、台所の脇を通り、もとは庭園だった中庭を横切って、実験室とも解剖室とも呼びならわされる建物に案内した。博士はある高名な外科医の相続人から家を買い取った。自分の好みが解剖より化学に傾いていたので、庭の奥の別棟を違った用途にあてていたのである。弁護士が友人の屋敷のこちら側に通されるのは初めてだった。彼は薄汚れた窓のない建物を物珍しげに眺め、かつては熱心な学生であふれた解剖講堂を、なんとなく異様で気味が悪いと思いながら見まわして通った。今はがらんとして音もなく、台の上には化学器械が積まれ、床には木箱が散り、荷造り用の藁がこぼれ、霧のかかった丸屋根の明かり取りから薄ぼんやりと光が落ちていた。突き当たりの階段を上がると赤いラシャを張った戸があり、それを通ってようやくアタスン氏は博士の私室へ招じ入れられた。広い部屋の周りにはガラス戸棚が並び、調度には姿見や執務机などがあり、鉄格子をはめた埃っぽい三つの窓が中庭に面していた。暖炉には火が燃えていた。屋内にまで霧が濃く立ちこめ始めていたので、炉棚のランプにも明かりがついていた。その火のすぐそばに、ジキル博士が死人のような顔色で座っていた。客を迎えても立ち上がらず、冷たい手を差し出し、変わり果てた声で挨拶した。"
    "translation_status": "reviewed"
  - "id": "c05-002"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And now,” said Mr. Utterson, as soon as Poole had left them, “you have heard the news?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[2]"
        "line_start": 1314
        "source_sequence": 135
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-002"
    "translation_ja": "「さて」とプールが出てゆくなりアタスン氏は言った。「知らせは聞いたかね？」"
    "translation_status": "reviewed"
  - "id": "c05-003"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The doctor shuddered. “They were crying it in the square,” he said. “I heard them in my dining-room.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[3]"
        "line_start": 1319
        "source_sequence": 136
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-003"
    "translation_ja": "博士は身震いした。「広場で新聞売りが事件のことを叫んでいた」と言った。「食堂にいても聞こえたよ」"
    "translation_status": "reviewed"
  - "id": "c05-004"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“One word,” said the lawyer. “Carew was my client, but so are you, and I want to know what I am doing. You have not been mad enough to hide this fellow?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[4]"
        "line_start": 1324
        "source_sequence": 137
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-004"
    "translation_ja": "「一つだけ聞かせてくれ」と弁護士は言った。「カルーは僕の依頼人だった。君も僕の依頼人だ。自分がいったい何に関わろうとしているのか、知っておきたい。まさか、あいつをかくまうような無分別はしていないだろうね？」"
    "translation_status": "reviewed"
  - "id": "c05-005"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Utterson, I swear to God,” cried the doctor, “I swear to God I will never set eyes on him again. I bind my honour to you that I am done with him in this world. It is all at an end. And indeed he does not want my help; you do not know him as I do; he is safe, he is quite safe; mark my words, he will never more be heard of.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[5]"
        "line_start": 1330
        "source_sequence": 138
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-005"
    "translation_ja": "「アタスン、神に誓って」と博士は叫んだ。「神に誓って二度とあいつの顔は見ない。この世ではもうあいつと縁は切れたと、名誉をかけて君に約束する。何もかも終わったんだ。第一、あいつは僕の助けなど必要としていない。君は僕ほどあいつを知らない。あいつは安全だ、まったく安全だ。僕の言葉を覚えていたまえ、二度と消息を聞くことはないよ」"
    "translation_status": "reviewed"
  - "id": "c05-006"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The lawyer listened gloomily; he did not like his friend’s feverish manner. “You seem pretty sure of him,” said he; “and for your sake, I hope you may be right. If it came to a trial, your name might appear.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[6]"
        "line_start": 1338
        "source_sequence": 139
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-006"
    "translation_ja": "弁護士は暗い顔で聞いた。友人の熱に浮かされたような調子が気に入らなかった。「ずいぶん確信があるようだね。君のためにそれが正しいことを祈るよ。裁判にでもなったら、君の名前が出るかもしれない」"
    "translation_status": "reviewed"
  - "id": "c05-007"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I am quite sure of him,” replied Jekyll; “I have grounds for certainty that I cannot share with any one. But there is one thing on which you may advise me. I have—I have received a letter; and I am at a loss whether I should show it to the police. I should like to leave it in your hands, Utterson; you would judge wisely, I am sure; I have so great a trust in you.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[7]"
        "line_start": 1345
        "source_sequence": 140
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-007"
    "translation_ja": "「確信は十分にある」とジキルは答えた。「確かな根拠があるが、それは誰にも打ち明けられない。だが、一つだけ君に助言してもらえることがある。僕は、その、手紙を受け取ったんだ。それを警察に見せたものかどうか途方に暮れている。君に預けておきたいよ、アタスン。君ならきっと賢明な判断ができる。僕はそれだけ君を信頼している」"
    "translation_status": "reviewed"
  - "id": "c05-008"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You fear, I suppose, that it might lead to his detection?” asked the lawyer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[8]"
        "line_start": 1354
        "source_sequence": 141
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-008"
    "translation_ja": "「それで彼が見つかる手がかりになることを心配しているのかね？」と弁護士は尋ねた。"
    "translation_status": "reviewed"
  - "id": "c05-009"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No,” said the other. “I cannot say that I care what becomes of Hyde; I am quite done with him. I was thinking of my own character, which this hateful business has rather exposed.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[9]"
        "line_start": 1359
        "source_sequence": 142
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-009"
    "translation_ja": "「違う」と相手は言った。「ハイドがどうなろうが知ったことじゃない。僕と彼とはもうきっぱり切れた。考えていたのは僕自身の評判のことだ。この忌まわしい事件のためにだいぶ危うくなってしまったから」"
    "translation_status": "reviewed"
  - "id": "c05-010"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Utterson ruminated awhile; he was surprised at his friend’s selfishness, and yet relieved by it. “Well,” said he, at last, “let me see the letter.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[10]"
        "line_start": 1365
        "source_sequence": 143
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-010"
    "translation_ja": "アタスンは少し考えた。友人の身勝手さに驚いたが、それと同時にほっともした。「よろしい」ととうとう言った。「手紙を見せてくれたまえ」"
    "translation_status": "reviewed"
  - "id": "c05-011"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The letter was written in an odd, upright hand and signed “Edward Hyde”: and it signified, briefly enough, that the writer’s benefactor, Dr. Jekyll, whom he had long so unworthily repaid for a thousand generosities, need labour under no alarm for his safety, as he had means of escape on which he placed a sure dependence. The lawyer liked this letter well enough; it put a better colour on the intimacy than he had looked for; and he blamed himself for some of his past suspicions."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[11]"
        "line_start": 1371
        "source_sequence": 144
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-011"
    "translation_ja": "それは妙にまっすぐ立った文字で書かれ、エドワード・ハイドと署名してあった。ごく簡潔な文面で、筆者の恩人ジキル博士には数々の厚情を賜りながら長らくその恩に背いてきたが、自分の身の安全についてはご心配に及ばない、逃げおおせるために確かに当てにできる手段があるからだ、という趣旨だった。この手紙を弁護士は悪くないと思った。二人のつきあいに、思っていたよりも好もしい色合いを与えるものだった。それまで抱いた疑いのいくつかを、彼は自分に恥じた。"
    "translation_status": "reviewed"
  - "id": "c05-012"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Have you the envelope?” he asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[12]"
        "line_start": 1381
        "source_sequence": 145
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-012"
    "translation_ja": "「封筒はあるかね？」と尋ねた。"
    "translation_status": "reviewed"
  - "id": "c05-013"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I burned it,” replied Jekyll, “before I thought what I was about. But it bore no postmark. The note was handed in.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[13]"
        "line_start": 1385
        "source_sequence": 146
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-013"
    "translation_ja": "「燃やしてしまった」とジキルは答えた。「何をしているか考えもせずにね。消印はなかったよ。手渡しで届いたのだ」"
    "translation_status": "reviewed"
  - "id": "c05-014"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Shall I keep this and sleep upon it?” asked Utterson."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[14]"
        "line_start": 1390
        "source_sequence": 147
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-014"
    "translation_ja": "「僕がこれを預かって、一晩考えてみようか」とアタスンは言った。"
    "translation_status": "reviewed"
  - "id": "c05-015"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I wish you to judge for me entirely,” was the reply. “I have lost confidence in myself.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[15]"
        "line_start": 1394
        "source_sequence": 148
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-015"
    "translation_ja": "「すっかり君の判断に任せたいんだ」と返事があった。「僕は自分を信用できなくなった」"
    "translation_status": "reviewed"
  - "id": "c05-016"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, I shall consider,” returned the lawyer. “And now one word more: it was Hyde who dictated the terms in your will about that disappearance?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[16]"
        "line_start": 1399
        "source_sequence": 149
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-016"
    "translation_ja": "「よろしい、考えよう」と弁護士は答えた。「もう一つだけ。君の遺言書の、あの失踪に関する条項はハイドに指図されて入れたのかね」"
    "translation_status": "reviewed"
  - "id": "c05-017"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The doctor seemed seized with a qualm of faintness; he shut his mouth tight and nodded."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[17]"
        "line_start": 1405
        "source_sequence": 150
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-017"
    "translation_ja": "博士は急に気が遠くなった様子だった。口を堅く閉じ、うなずいた。"
    "translation_status": "reviewed"
  - "id": "c05-018"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I knew it,” said Utterson. “He meant to murder you. You had a fine escape.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[18]"
        "line_start": 1410
        "source_sequence": 151
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-018"
    "translation_ja": "「やっぱりな」とアタスンは言った。「やつは君を殺す気だったのだ。よく助かったよ」"
    "translation_status": "reviewed"
  - "id": "c05-019"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I have had what is far more to the purpose,” returned the doctor solemnly: “I have had a lesson—O God, Utterson, what a lesson I have had!” And he covered his face for a moment with his hands."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[19]"
        "line_start": 1415
        "source_sequence": 152
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-019"
    "translation_ja": "「僕はそれよりずっと大事なものを得たよ」と博士はおごそかに答えた。「教訓を得たんだ。ああ神よ、アタスン、なんという教訓を思い知らされたことか！」　そう言ってしばし両手で顔を覆った。"
    "translation_status": "reviewed"
  - "id": "c05-020"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On his way out, the lawyer stopped and had a word or two with Poole. “By the bye,” said he, “there was a letter handed in to-day: what was the messenger like?” But Poole was positive nothing had come except by post; “and only circulars by that,” he added."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[20]"
        "line_start": 1421
        "source_sequence": 153
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-020"
    "translation_ja": "帰りがけ、弁護士は立ち止まってプールと二言三言話をした。「そういえば、きょう手渡しで手紙があったね。どんな使いだった？」。ところがプールは、郵便のほかは何一つ届きません、と言い切った。「しかも郵便で来ましたのもただの回状でございます」と付け加えた。"
    "translation_status": "reviewed"
  - "id": "c05-021"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This news sent off the visitor with his fears renewed. Plainly the letter had come by the laboratory door; possibly, indeed, it had been written in the cabinet; and if that were so, it must be differently judged, and handled with the more caution. The newsboys, as he went, were crying themselves hoarse along the footways: “Special edition. Shocking murder of an M.P.” That was the funeral oration of one friend and client; and he could not help a certain apprehension lest the good name of another should be sucked down in the eddy of the scandal. It was, at least, a ticklish decision that he had to make; and self-reliant as he was by habit, he began to cherish a longing for advice. It was not to be had directly; but perhaps, he thought, it might be fished for."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[21]"
        "line_start": 1428
        "source_sequence": 154
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-021"
    "translation_ja": "これを聞いて客はふたたび不安を抱いて屋敷をあとにした。手紙が実験室の戸口から入ったのは明らかだった。いや、あの私室で書かれたのかもしれない。もしそうなら、評価も違ってくるし、いっそう慎重に扱わなくてはならない。彼が歩く歩道では新聞売りの少年たちが声を嗄らしていた。「号外！　国会議員、惨殺さる！」。これが一人の友人にして依頼人である男への弔辞なのだ。もう一人の名誉も醜聞の渦に引き込まれはしないかという不安を、どうにも抑えられなかった。少なくとも彼が下すべき判断はきわどかった。いつもは自分ひとりの力を頼みにする男にも、誰かに助言を仰ぎたい気持ちがわいてきた。あからさまには聞けない。だがそれとなく釣り出すことはできるかもしれぬ、と彼は考えた。"
    "translation_status": "reviewed"
  - "id": "c05-022"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Presently after, he sat on one side of his own hearth, with Mr. Guest, his head clerk, upon the other, and midway between, at a nicely calculated distance from the fire, a bottle of a particular old wine that had long dwelt unsunned in the foundations of his house. The fog still slept on the wing above the drowned city, where the lamps glimmered like carbuncles; and through the muffle and smother of these fallen clouds, the procession of the town’s life was still rolling in through the great arteries with a sound as of a mighty wind. But the room was gay with firelight. In the bottle the acids were long ago resolved; the imperial dye had softened with time, as the colour grows richer in stained windows; and the glow of hot autumn afternoons on hillside vineyards, was ready to be set free and to disperse the fogs of London. Insensibly the lawyer melted. There was no man from whom he kept fewer secrets than Mr. Guest; and he was not always sure that he kept as many as he meant. Guest had often been on business to the doctor’s; he knew Poole; he could scarce have failed to hear of Mr. Hyde’s familiarity about the house; he might draw conclusions: was it not as well, then, that he should see a letter which put that mystery to rights? and above all since Guest, being a great student and critic of handwriting, would consider the step natural and obliging? The clerk, besides, was a man of counsel; he could scarce read so strange a document without dropping a remark; and by that remark Mr. Utterson might shape his future course."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[22]"
        "line_start": 1441
        "source_sequence": 155
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-022"
    "translation_ja": "それから間もなく、彼は自宅の暖炉の片側に腰を落ち着け、反対側には事務所の主任書記ゲスト氏が座った。ちょうどその間、火から具合よく離れたところには、家の地下で長らく日の目も見ずに眠ってきた、とっておきの古酒が一本据えられていた。水没した街の上には、霧がまだ宙に浮いたまま眠り、明かりが紅玉のようにかすかに光っていた。その降りてきた雲に包まれ、押さえつけられながらも、町の暮らしの行列は、大風のような音を立てて大動脈をひたひたと流れ込んできた。だが部屋の中は火の光に明るく浮き立っていた。瓶の中では酸味がとうにこなれ、王者の紫の色合いは、彩色ガラスの窓が深みを増すように、歳月とともにまろやかになっていた。丘の斜面のぶどう畑に降った、暑い秋の午後の照り返しが、いま解き放たれてロンドンの霧を追い払おうとしていた。弁護士の心もいつとはなしにほどけた。ゲスト氏ほど彼が隠し事をしない人間はなかった。隠しているつもりのことまでつい漏らしているのではないかと思うこともあった。ゲストは仕事で博士の家へ何度も行っている。プールを知っている。ハイド氏がわが物顔であの家に出入りしていることを、聞かずにいたはずもない。独自に推測をしているかもしれぬ。ならば謎を穏当に解いてくれるこの手紙を彼に見せるほうがよくはないか。ことにゲストは筆跡研究の熱心な目利きで、自分に見せるのも自然な親切と思うに違いない。第一、意見を聞く値打ちのある男だ。あんな奇妙な書きものを読んで一言の感想も漏らさずにはいまい。その感想にならってアタスン氏は今後の針路を決められるかもしれない。"
    "translation_status": "reviewed"
  - "id": "c05-023"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is a sad business about Sir Danvers,” he said."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[23]"
        "line_start": 1465
        "source_sequence": 156
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-023"
    "translation_ja": "「サー・ダンヴァーズのことは痛ましい事件だったね」と彼は言った。"
    "translation_status": "reviewed"
  - "id": "c05-024"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes, sir, indeed. It has elicited a great deal of public feeling,” returned Guest. “The man, of course, was mad.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[24]"
        "line_start": 1469
        "source_sequence": 157
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-024"
    "translation_ja": "「ええ、まったくです。世間にも大きな反響がありました」とゲストは答えた。「もちろん犯人は気が狂っていたのでしょう」"
    "translation_status": "reviewed"
  - "id": "c05-025"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I should like to hear your views on that,” replied Utterson. “I have a document here in his handwriting; it is between ourselves, for I scarce know what to do about it; it is an ugly business at the best. But there it is; quite in your way: a murderer’s autograph.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[25]"
        "line_start": 1474
        "source_sequence": 158
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-025"
    "translation_ja": "「その点、君の見解を聞きたいな」とアタスンは言った。「ここに本人の筆跡の書類が一つある。ここだけの話だよ。私もどう扱ってよいかほとほと困っている。どう転んでも厄介な話だが、まあ見てくれ。まさに君向きのものだ。殺人犯人の自筆だよ」"
    "translation_status": "reviewed"
  - "id": "c05-026"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Guest’s eyes brightened, and he sat down at once and studied it with passion. “No sir,” he said: “not mad; but it is an odd hand.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[26]"
        "line_start": 1481
        "source_sequence": 159
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-026"
    "translation_ja": "ゲストの目が輝いた。すぐに座り直して、夢中で吟味した。「いいえ、先生」と彼は言った。「気が狂っているわけじゃない。ただし妙な筆跡です」"
    "translation_status": "reviewed"
  - "id": "c05-027"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And by all accounts a very odd writer,” added the lawyer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[27]"
        "line_start": 1487
        "source_sequence": 160
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-027"
    "translation_ja": "「書いた当人も、聞く話によると、ひどく妙な男だ」と弁護士は付け加えた。"
    "translation_status": "reviewed"
  - "id": "c05-028"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Just then the servant entered with a note."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[28]"
        "line_start": 1491
        "source_sequence": 161
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-028"
    "translation_ja": "ちょうどそのとき召使が短い手紙を持って入ってきた。"
    "translation_status": "reviewed"
  - "id": "c05-029"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Is that from Dr. Jekyll, sir?” inquired the clerk. “I thought I knew the writing. Anything private, Mr. Utterson?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[29]"
        "line_start": 1495
        "source_sequence": 162
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-029"
    "translation_ja": "「ジキル博士からではありませんか」と書記は尋ねた。「見覚えのある字だと思いまして。内々のお話でしょうか、アタスン先生？」"
    "translation_status": "reviewed"
  - "id": "c05-030"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Only an invitation to dinner. Why? Do you want to see it?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[30]"
        "line_start": 1500
        "source_sequence": 163
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-030"
    "translation_ja": "「ただの食事の招待だ。どうしてだね。見たいのか」"
    "translation_status": "reviewed"
  - "id": "c05-031"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“One moment. I thank you, sir;” and the clerk laid the two sheets of paper alongside and sedulously compared their contents. “Thank you, sir,” he said at last, returning both; “it’s a very interesting autograph.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[31]"
        "line_start": 1504
        "source_sequence": 164
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-031"
    "translation_ja": "「ほんのちょっと。ありがとうございます」。書記は二枚の紙を隣り合わせに置いて、念入りに書きつけを見比べた。「ありがとうございました」としまいに両方を返しながら言った。「とても興味のある筆跡です」"
    "translation_status": "reviewed"
  - "id": "c05-032"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was a pause, during which Mr. Utterson struggled with himself. “Why did you compare them, Guest?” he inquired suddenly."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[32]"
        "line_start": 1511
        "source_sequence": 165
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-032"
    "translation_ja": "しばらく沈黙があり、そのあいだアタスン氏は心の中で格闘した。「どうして見比べたんだね、ゲスト？」と突然尋ねた。"
    "translation_status": "reviewed"
  - "id": "c05-033"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, sir,” returned the clerk, “there’s a rather singular resemblance; the two hands are in many points identical: only differently sloped.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[33]"
        "line_start": 1516
        "source_sequence": 166
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-033"
    "translation_ja": "「それが、先生」と書記は答えた。「ちょっと不思議なほど似ております。いくつもの点で二つの筆跡はまるきり同じで、ただ字の傾きが違っているだけなんです」"
    "translation_status": "reviewed"
  - "id": "c05-034"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Rather quaint,” said Utterson."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[34]"
        "line_start": 1522
        "source_sequence": 167
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-034"
    "translation_ja": "「なかなか妙なことだ」とアタスンは言った。"
    "translation_status": "reviewed"
  - "id": "c05-035"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It is, as you say, rather quaint,” returned Guest."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[35]"
        "line_start": 1526
        "source_sequence": 168
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-035"
    "translation_ja": "「おっしゃるとおり、なかなか妙なことです」とゲストは答えた。"
    "translation_status": "reviewed"
  - "id": "c05-036"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I wouldn’t speak of this note, you know,” said the master."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[36]"
        "line_start": 1530
        "source_sequence": 169
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-036"
    "translation_ja": "「この手紙のことは口にしないでくれよ」と雇い主は言った。"
    "translation_status": "reviewed"
  - "id": "c05-037"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No, sir,” said the clerk. “I understand.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[37]"
        "line_start": 1534
        "source_sequence": 170
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-037"
    "translation_ja": "「ええ、先生」と書記は言った。「心得ております」"
    "translation_status": "reviewed"
  - "id": "c05-038"
    "section_id": "chapter-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But no sooner was Mr. Utterson alone that night, than he locked the note into his safe, where it reposed from that time forward. “What!” he thought. “Henry Jekyll forge for a murderer!” And his blood ran cold in his veins."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/p[38]"
        "line_start": 1538
        "source_sequence": 171
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c05-038"
    "translation_ja": "その晩アタスン氏は一人になるが早いか、例の手紙を金庫へしまい、鍵を掛けた。手紙は以後そこに眠ることになる。「何ということだ！」と彼は思った。「ヘンリー・ジキルが、人殺しのために手紙を偽造するとは！」　全身の血が冷たくなった。"
    "translation_status": "reviewed"
  - "id": "c06-000"
    "section_id": "chapter-06"
    "kind": "heading"
    "origin": "source"
    "source_text": "INCIDENT OF DR. LANYON"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[8]/h2"
        "line_start": 1549
        "source_sequence": 172

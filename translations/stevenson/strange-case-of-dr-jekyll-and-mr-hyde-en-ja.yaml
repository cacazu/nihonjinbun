  - "id": "c01-001"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Utterson the lawyer was a man of a rugged countenance that was never lighted by a smile; cold, scanty and embarrassed in discourse; backward in sentiment; lean, long, dusty, dreary and yet somehow lovable. At friendly meetings, and when the wine was to his taste, something eminently human beaconed from his eye; something indeed which never found its way into his talk, but which spoke not only in these silent symbols of the after-dinner face, but more often and loudly in the acts of his life. He was austere with himself; drank gin when he was alone, to mortify a taste for vintages; and though he enjoyed the theatre, had not crossed the doors of one for twenty years. But he had an approved tolerance for others; sometimes wondering, almost with envy, at the high pressure of spirits involved in their misdeeds; and in any extremity inclined to help rather than to reprove. “I incline to Cain’s heresy,” he used to say quaintly: “I let my brother go to the devil in his own way.” In this character, it was frequently his fortune to be the last reputable acquaintance and the last good influence in the lives of downgoing men. And to such as these, so long as they came about his chambers, he never marked a shade of change in his demeanour."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[1]"
        "line_start": 293
        "source_sequence": 17
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-001"
    "translation_ja": "弁護士のアタスン氏は、ごつごつした顔つきをして、その顔が微笑にぱっと明るむことなど一度もなかった。話をすると冷たく、言葉少なで、いかにも窮屈そうだった。情を表に出すたちでもない。やせて、ひょろ長く、ほこりをかぶったような陰気な男で、それでもなぜか人に好かれた。気の置けない会食で、しかもぶどう酒が口に合うときなどは、ひどく人間味のあるものが目の奥にともった。それが言葉となって出ることはなかったが、食後の顔のこんな無言のしるしばかりでなく、むしろふだんの行いにこそ、いっそうしばしば、いっそう雄弁に現れた。自分には厳しく、上等なぶどう酒を好む舌を懲らすため、一人のときはジンを飲んだ。芝居が好きなくせに、もう二十年も劇場の敷居をまたいでいなかった。だが他人に対する寛容さには定評があった。人が不始末をしでかすにもこれほどの活気が要るものかと、ときには羨望に近い思いで驚き、どんな窮地に陥った者にも、小言を言うより手を貸すほうに心が向いた。「私はカインの異端説に傾いておりましてね」と妙な調子で言うのが口癖だった。「わが兄弟が地獄へ行くなら、好きな道を行かせておきますよ」。その性分のおかげで、身を持ち崩してゆく人々にとって、最後までつきあいの残った堅気の知人も、最後まで身近にあったよい感化も、彼だということがよくあった。そういう連中が法律事務所に顔を出しつづけるかぎり、彼の応対にはいささかの変わりようも見えなかった。"
    "translation_status": "reviewed"
  - "id": "c01-002"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "No doubt the feat was easy to Mr. Utterson; for he was undemonstrative at the best, and even his friendship seemed to be founded in a similar catholicity of good-nature. It is the mark of a modest man to accept his friendly circle ready-made from the hands of opportunity; and that was the lawyer’s way. His friends were those of his own blood or those whom he had known the longest; his affections, like ivy, were the growth of time, they implied no aptness in the object. Hence, no doubt the bond that united him to Mr. Richard Enfield, his distant kinsman, the well-known man about town. It was a nut to crack for many, what these two could see in each other, or what subject they could find in common. It was reported by those who encountered them in their Sunday walks, that they said nothing, looked singularly dull and would hail with obvious relief the appearance of a friend. For all that, the two men put the greatest store by these excursions, counted them the chief jewel of each week, and not only set aside occasions of pleasure, but even resisted the calls of business, that they might enjoy them uninterrupted."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"

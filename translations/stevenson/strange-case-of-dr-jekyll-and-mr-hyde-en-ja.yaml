        "original_unit_id": "c02-011"
    "translation_ja": "「ハイド？」とラニョンは繰り返した。「いや。聞いたこともない。僕があいつと疎遠になってからの話だな」"
    "translation_status": "reviewed"
  - "id": "c02-012"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "That was the amount of information that the lawyer carried back with him to the great, dark bed on which he tossed to and fro, until the small hours of the morning began to grow large. It was a night of little ease to his toiling mind, toiling in mere darkness and besieged by questions."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[12]"
        "line_start": 669
        "source_sequence": 57
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-012"
    "translation_ja": "弁護士が持ち帰った情報はそれだけだった。大きな暗い寝台の上で、夜半過ぎの小さな時刻の数字がしだいに大きくなるまで、彼は寝返りを打ちつづけた。暗闇を手探りするばかりで、四方から問いに攻め立てられる彼の心にとって、ほとんど安らぐ暇のない夜だった。"
    "translation_status": "reviewed"
  - "id": "c02-013"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Six o’clock struck on the bells of the church that was so conveniently near to Mr. Utterson’s dwelling, and still he was digging at the problem. Hitherto it had touched him on the intellectual side alone; but now his imagination also was engaged, or rather enslaved; and as he lay and tossed in the gross darkness of the night and the curtained room, Mr. Enfield’s tale went by before his mind in a scroll of lighted pictures. He would be aware of the great field of lamps of a nocturnal city; then of the figure of a man walking swiftly; then of a child running from the doctor’s; and then these met, and that human Juggernaut trod the child down and passed on regardless of her screams. Or else he would see a room in a rich house, where his friend lay asleep, dreaming and smiling at his dreams; and then the door of that room would be opened, the curtains of the bed plucked apart, the sleeper recalled, and lo! there would stand by his side a figure to whom power was given, and even at that dead hour, he must rise and do its bidding. The figure in these two phases haunted the lawyer all night; and if at any time he dozed over, it was but to see it glide more stealthily through sleeping houses, or move the more swiftly and still the more swiftly, even to dizziness, through wider labyrinths of lamplighted city, and at every street corner crush a child and leave her screaming. And still the figure had no face by which he might know it; even in his dreams, it had no face, or one that baffled him and melted before his eyes; and thus it was that there sprang up and grew apace in the lawyer’s mind a singularly strong, almost an inordinate, curiosity to behold the features of the real Mr. Hyde. If he could but once set eyes on him, he thought the mystery would lighten and perhaps roll altogether away, as was the habit of mysterious things when well examined. He might see a reason for his friend’s strange preference or bondage (call it which you please) and even for the startling clauses of the will. At least it would be a face worth seeing: the face of a man who was without bowels of mercy: a face which had but to show itself to raise up, in the mind of the unimpressionable Enfield, a spirit of enduring hatred."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[13]"
        "line_start": 676
        "source_sequence": 58
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-013"
    "translation_ja": "アタスン氏の家のすぐそばという重宝な場所にある教会の鐘が六つ鳴ったが、まだ彼はこの問題を掘り返していた。これまではただ知性に訴えてきただけの問題が、今は想像力までを駆り出し、いや、虜にしてしまった。帳を閉じた部屋の厚い夜の闇に身をよじっていると、エンフィールド氏の話が、照らし出された絵巻となって目の前を繰り流れてゆく。夜の都会いちめんに灯火の海。次に足早に歩く一人の男の姿。次に医者のところから走ってくる子ども。二人がぶつかると、人の姿をしたあのジャガンナートの山車が子どもを踏み倒し、その悲鳴に耳も貸さず通り過ぎる。またあるときは富裕な家の一室が見える。友人は眠っていて、夢を見ては夢の中のことに微笑んでいる。と、部屋の戸が開き、寝台の帳が引き分けられ、眠っている男は呼び覚まされる。見るがいい、その枕元には力を授けられた何者かが立っていて、こんな夜更けだというのに男は起き上がり、その言いつけに従わねばならない。この二つの姿でそいつは一晩じゅう弁護士につきまとった。時おりうとうとすると、家々が寝静まる中、そいつがいよいよ密やかにすべってゆくか、ますます広がる灯火の街の迷路を、速く、ますます速く、目の回るほどの速さで駆け、曲がり角という曲がり角で子どもを踏みつけ、その悲鳴をあとに去ってゆくのが見えるだけだった。それなのに、その影には見分けのつく顔がない。夢の中ですら顔がないか、あっても見る者をまごつかせ、目の前で溶けてしまった。こうして弁護士の心に、ほんもののハイド氏の顔が見たいという、奇妙なほど強い、ほとんど度を越した好奇心がわき起こり、みるみるふくらんだ。一度でもこの目で見られれば、よく調べられた謎の常として、霧はいくらか薄れ、ことによるとすっかり晴れるかもしれない。友の奇妙な偏愛と呼ぼうと隷属と呼ぼうと、その理由が見えるかもしれず、あの驚くべき遺言の条項さえ腑に落ちるかもしれない。少なくとも一見の価値のある顔だった。腹の底に一片の慈悲もない男の顔。ひと目見ただけで、めったなことには動じないあのエンフィールドの胸に、いつまでも消えない憎しみを呼び起こした顔なのだ。"
    "translation_status": "reviewed"
  - "id": "c02-014"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "From that time forward, Mr. Utterson began to haunt the door in the by-street of shops. In the morning before office hours, at noon when business was plenty and time scarce, at night under the face of the fogged city moon, by all lights and at all hours of solitude or concourse, the lawyer was to be found on his chosen post."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[14]"
        "line_start": 709
        "source_sequence": 59
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-014"
    "translation_ja": "その日からアタスン氏は、小商店の並ぶ横町のあの戸口に足しげく通いだした。仕事前の朝、仕事山積で時間の足りない昼、霧にかすむ都の月の下の夜、どんな明かりでも、ひと気がなくても込み合っていても、弁護士の選んだ持ち場に行けば彼に会えた。"
    "translation_status": "reviewed"
  - "id": "c02-015"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“If he be Mr. Hyde,” he had thought, “I shall be Mr. Seek.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[15]"
        "line_start": 717
        "source_sequence": 60
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-015"
    "translation_ja": "「向こうが隠れるハイド氏なら」と思ったのだ。「こっちは捜すシーク氏になろう」"
    "translation_status": "reviewed"
  - "id": "c02-016"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And at last his patience was rewarded. It was a fine dry night; frost in the air; the streets as clean as a ballroom floor; the lamps, unshaken by any wind, drawing a regular pattern of light and shadow. By ten o’clock, when the shops were closed, the by-street was very solitary and, in spite of the low growl of London from all round, very silent. Small sounds carried far; domestic sounds out of the houses were clearly audible on either side of the roadway; and the rumour of the approach of any passenger preceded him by a long time. Mr. Utterson had been some minutes at his post, when he was aware of an odd light footstep drawing near. In the course of his nightly patrols, he had long grown accustomed to the quaint effect with which the footfalls of a single person, while he is still a great way off, suddenly spring out distinct from the vast hum and clatter of the city. Yet his attention had never before been so sharply and decisively arrested; and it was with a strong, superstitious prevision of success that he withdrew into the entry of the court."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[16]"
        "line_start": 722
        "source_sequence": 61
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-016"
    "translation_ja": "ついにその辛抱が報われた。空は冴え、からりと晴れ、霜の気が漂い、通りは舞踏場の床のようにきれいで、風に揺れぬ街灯が、明暗の規則正しい模様を描いていた。十時に店が閉まると、横町はひどく寂しくなった。四方でロンドンの低いうなり声がしてはいたが、町はまことに静かだった。かすかな音も遠くまで届く。道の両側から家の中の物音がはっきり聞こえ、歩いて来る者があると、その到来をはるか前に音が告げた。アタスン氏が持ち場について幾分かたったころ、妙に軽い足音が近づいてくるのに気づいた。夜ごとの巡回で、まだずっと向こうにいる一人きりの人間の足音が、都会を満たすざわめきと騒音からにわかにくっきり浮かび上がる不思議には、とうから慣れていた。それでも、これほど鋭く、きっぱりと注意をさらわれたことはない。今度こそという、ほとんど迷信めいた強い予感に突き動かされて、中庭の入り口の奥へ身を退いた。"
    "translation_status": "reviewed"
  - "id": "c02-017"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The steps drew swiftly nearer, and swelled out suddenly louder as they turned the end of the street. The lawyer, looking forth from the entry, could soon see what manner of man he had to deal with. He was small and very plainly dressed and the look of him, even at that distance, went somehow strongly against the watcher’s inclination. But he made straight for the door, crossing the roadway to save time; and as he came, he drew a key from his pocket like one approaching home."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[17]"
        "line_start": 739
        "source_sequence": 62
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-017"
    "translation_ja": "足音は見る間に近づき、通りのはずれを曲がるなり急に音を増した。入り口からのぞいていた弁護士には、ほどなく相手がどんな男か見て取れた。小柄で、身なりはいたって地味で、まだあれだけ離れているのに、見ただけで見張る者はなぜか強い反感を覚えた。男は目当ての戸口へまっすぐに進み、近道をして車道を斜めに横切りながら、わが家へ帰り着いた者のようにポケットから鍵を取り出した。"
    "translation_status": "reviewed"
  - "id": "c02-018"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Utterson stepped out and touched him on the shoulder as he passed. “Mr. Hyde, I think?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[18]"
        "line_start": 749
        "source_sequence": 63
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-018"
    "translation_ja": "アタスン氏は進み出て、行き過ぎかけた男の肩に触れた。「ハイドさんとお見受けしますが？」"
    "translation_status": "reviewed"
  - "id": "c02-019"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Hyde shrank back with a hissing intake of the breath. But his fear was only momentary; and though he did not look the lawyer in the face, he answered coolly enough: “That is my name. What do you want?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[19]"
        "line_start": 754
        "source_sequence": 64
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-019"
    "translation_ja": "ハイド氏はシッと音を立てて息を吸い、飛びのいた。だがおびえたのは一瞬で、弁護士の顔こそ見なかったものの、返事はいたって冷静だった。「いかにもハイドだが。何の用だね？」"
    "translation_status": "reviewed"
  - "id": "c02-020"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I see you are going in,” returned the lawyer. “I am an old friend of Dr. Jekyll’s—Mr. Utterson of Gaunt Street—you must have heard of my name; and meeting you so conveniently, I thought you might admit me.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[20]"
        "line_start": 760
        "source_sequence": 65
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-020"
    "translation_ja": "「お入りになるところですな」と弁護士は答えた。「私はジキル博士の古い友人でしてね、ゴーント街のアタスンです。私の名ぐらいはお聞き及びでしょう。ちょうどお会いできたので、ご一緒に入れていただけないかと」"
    "translation_status": "reviewed"
  - "id": "c02-021"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You will not find Dr. Jekyll; he is from home,” replied Mr. Hyde, blowing in the key. And then suddenly, but still without looking up, “How did you know me?” he asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[21]"
        "line_start": 767
        "source_sequence": 66
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-021"
    "translation_ja": "「ジキル博士には会えんよ。留守だ」とハイド氏は鍵にふっと息を吹き込んだ。それから唐突に、相変わらず顔を上げないまま、「なぜ私だとわかった？」と尋ねた。"
    "translation_status": "reviewed"
  - "id": "c02-022"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“On your side,” said Mr. Utterson “will you do me a favour?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[22]"
        "line_start": 773
        "source_sequence": 67
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-022"
    "translation_ja": "「ではこちらからも」とアタスン氏は言った。「一つお願いしてよろしいですか」"
    "translation_status": "reviewed"
  - "id": "c02-023"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“With pleasure,” replied the other. “What shall it be?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[23]"
        "line_start": 778
        "source_sequence": 68
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-023"
    "translation_ja": "「喜んで」と相手は答えた。「何かね？」"
    "translation_status": "reviewed"
  - "id": "c02-024"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Will you let me see your face?” asked the lawyer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[24]"
        "line_start": 782
        "source_sequence": 69
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-024"
    "translation_ja": "「お顔を見せていただけませんか」と弁護士は言った。"
    "translation_status": "reviewed"
  - "id": "c02-025"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Hyde appeared to hesitate, and then, as if upon some sudden reflection, fronted about with an air of defiance; and the pair stared at each other pretty fixedly for a few seconds. “Now I shall know you again,” said Mr. Utterson. “It may be useful.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[25]"
        "line_start": 786
        "source_sequence": 70
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-025"
    "translation_ja": "ハイド氏はためらった様子だったが、急に思い直したように挑む顔で向き直った。二人はしばらくのあいだ、まじまじと互いを見つめた。「これで次に会ってもわかります」とアタスン氏。「役に立つことがあるかもしれない」"
    "translation_status": "reviewed"
  - "id": "c02-026"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes,” returned Mr. Hyde, “it is as well we have met; and à propos, you should have my address.” And he gave a number of a street in Soho."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[26]"
        "line_start": 793
        "source_sequence": 71
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-026"
    "translation_ja": "「そうだな」とハイド氏は答えた。「会っておいて悪くはない。ついでに住所も知らせておこう」。そう言ってソーホーのある通りの番地を教えた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 58
          "end": 66
          "exact": "à propos"
      - "side": "translation"
        "kind": "emphasis"
        "span":
          "start": 29
          "end": 33
          "exact": "ついでに"
  - "id": "c02-027"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Good God!” thought Mr. Utterson, “can he, too, have been thinking of the will?” But he kept his feelings to himself and only grunted in acknowledgment of the address."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[27]"
        "line_start": 799
        "source_sequence": 72
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-027"
    "translation_ja": "「なんということだ！」とアタスン氏は思った。「こいつも遺言書のことを考えていたのか？」。だが胸の内は見せず、住所を承知したしるしにうんとうなっただけだった。"
    "translation_status": "reviewed"
  - "id": "c02-028"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And now,” said the other, “how did you know me?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[28]"
        "line_start": 805
        "source_sequence": 73
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-028"
    "translation_ja": "「で、今度は」と相手が言った。「なぜ私だとわかった？」"
    "translation_status": "reviewed"
  - "id": "c02-029"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“By description,” was the reply."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[29]"
        "line_start": 809
        "source_sequence": 74
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-029"
    "translation_ja": "「人相を聞いていたので」と答えた。"
    "translation_status": "reviewed"
  - "id": "c02-030"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Whose description?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[30]"
        "line_start": 813
        "source_sequence": 75
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-030"
    "translation_ja": "「誰から？」"
    "translation_status": "reviewed"
  - "id": "c02-031"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“We have common friends,” said Mr. Utterson."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[31]"
        "line_start": 817
        "source_sequence": 76
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-031"
    "translation_ja": "「共通の友人がおります」とアタスン氏は言った。"
    "translation_status": "reviewed"
  - "id": "c02-032"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Common friends,” echoed Mr. Hyde, a little hoarsely. “Who are they?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[32]"
        "line_start": 821
        "source_sequence": 77
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-032"
    "translation_ja": "「共通の友人」とハイド氏は少しかすれた声で繰り返した。「誰だね？」"
    "translation_status": "reviewed"
  - "id": "c02-033"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Jekyll, for instance,” said the lawyer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[33]"
        "line_start": 826
        "source_sequence": 78
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-033"
    "translation_ja": "「たとえばジキル」と弁護士は言った。"
    "translation_status": "reviewed"
  - "id": "c02-034"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“He never told you,” cried Mr. Hyde, with a flush of anger. “I did not think you would have lied.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[34]"
        "line_start": 830
        "source_sequence": 79
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-034"
    "translation_ja": "「あいつから聞いたものか」とハイド氏は怒りに顔を赤らめて叫んだ。「あんたが嘘をつく人だとは思わなかった」"
    "translation_status": "reviewed"
  - "id": "c02-035"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Come,” said Mr. Utterson, “that is not fitting language.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[35]"
        "line_start": 835
        "source_sequence": 80
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-035"
    "translation_ja": "「まあ」とアタスン氏は言った。「そういう言い方はなさるものじゃない」"
    "translation_status": "reviewed"
  - "id": "c02-036"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The other snarled aloud into a savage laugh; and the next moment, with extraordinary quickness, he had unlocked the door and disappeared into the house."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[36]"
        "line_start": 840
        "source_sequence": 81
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-036"
    "translation_ja": "相手は声を立てて唸り、それが荒々しい笑い声に変わった。次の瞬間には並外れた早業で鍵を開け、家に消えていた。"
    "translation_status": "reviewed"
  - "id": "c02-037"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The lawyer stood awhile when Mr. Hyde had left him, the picture of disquietude. Then he began slowly to mount the street, pausing every step or two and putting his hand to his brow like a man in mental perplexity. The problem he was thus debating as he walked, was one of a class that is rarely solved. Mr. Hyde was pale and dwarfish, he gave an impression of deformity without any nameable malformation, he had a displeasing smile, he had borne himself to the lawyer with a sort of murderous mixture of timidity and boldness, and he spoke with a husky, whispering and somewhat broken voice; all these were points against him, but not all of these together could explain the hitherto unknown disgust, loathing and fear with which Mr. Utterson regarded him. “There must be something else,” said the perplexed gentleman. “There is something more, if I could find a name for it. God bless me, the man seems hardly human! Something troglodytic, shall we say? or can it be the old story of Dr. Fell? or is it the mere radiance of a foul soul that thus transpires through, and transfigures, its clay continent? The last, I think; for, O my poor old Harry Jekyll, if ever I read Satan’s signature upon a face, it is on that of your new friend.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[37]"
        "line_start": 846
        "source_sequence": 82
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-037"
    "translation_ja": "ハイド氏に取り残されて、弁護士は不安を絵に描いたような姿で、しばしその場に立ち尽くした。それからゆっくりと通りを上ってゆき、一、二歩ごとに立ち止まっては、思案に余った人のように額に手をやった。こうして歩きながら考えていたのは、めったに答えの出ないたぐいの問題だった。ハイド氏は青白く、背丈はひどく低い。どこがどう歪んでいるとも指せないのに、歪みがあると感じさせた。笑い方は不愉快で、弁護士に対する態度には、おずおずしたところと大胆さとが、どこか人を殺しかねない具合に入りまじっていた。声はしわがれ、ささやくようで、やや途切れがちだった。どれも好意を抱けぬ理由にはなるが、全部合わせてもなお、アタスン氏がその男に対して覚えた、かつて知らぬほどの嫌悪と憎悪と恐怖とは説明がつかなかった。「ほかに何かあるに違いない」と困惑した紳士は口に出した。「まだ何かあるんだ、それに名をつけられたらな。なんということだ、ほとんど人間とは思えん！　穴居人じみているとでもいうのか。それとも例の、理由もなく嫌いなフェル先生の話か。いや、汚らしい魂がただ光を放ち、それを包む土の器にしみ通って、姿まで変えているのか。たぶんそれだ。ああ、気の毒なハリー・ジキル。これまでに私が人の顔にサタンの署名を読んだことがあるとすれば、それはおまえの新しい友達の顔の上だ」"
    "translation_status": "reviewed"

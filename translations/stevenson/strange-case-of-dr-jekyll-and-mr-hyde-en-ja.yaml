        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-040"
    "translation_ja": "「見てまいります、アタスン様」とプールは言いながら、客を広く天井の低い、居心地のよい玄関広間へ通した。床には石が敷かれ、田舎屋敷のしつらえにならって明るいむき出しの火が部屋を暖め、高価なオークの飾り戸棚が置いてあった。「こちらの暖炉のそばでお待ちになりますか。それとも食堂に明かりをお持ちいたしましょうか」"
    "translation_status": "reviewed"
  - "id": "c02-041"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Here, thank you,” said the lawyer, and he drew near and leaned on the tall fender. This hall, in which he was now left alone, was a pet fancy of his friend the doctor’s; and Utterson himself was wont to speak of it as the pleasantest room in London. But tonight there was a shudder in his blood; the face of Hyde sat heavy on his memory; he felt (what was rare with him) a nausea and distaste of life; and in the gloom of his spirits, he seemed to read a menace in the flickering of the firelight on the polished cabinets and the uneasy starting of the shadow on the roof. He was ashamed of his relief, when Poole presently returned to announce that Dr. Jekyll was gone out."
    "source_languages":
      - "en"
    "source_locations":

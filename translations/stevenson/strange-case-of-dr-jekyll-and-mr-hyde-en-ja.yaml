    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-033"
    "translation_ja": "それから一時間のうちに彼が語ったことは、どうしても筆にする気になれない。私はわが目で見、わが耳で聞き、それに魂は病んだ。それなのに、あの光景が目から薄れた今、私は自分にそれを信じるかと問い、答えられない。わが生は根元まで揺らいだ。眠りは去り、昼も夜も、命を削るほどの恐怖がすぐ傍らにいる。余命は数えるばかりで死なねばならぬと感じるが、それでも信じ切れぬままに死ぬだろう。あの男が悔悟の涙まで流して私に明かした道徳的な堕落ぶりについて言えば、思い出のうちにさえ、恐れに飛びすさらずには心をとどめておけない。ただ一つ言おう、アタスン。もし君がそれを信じる気になれるなら、それで十二分だ。あの夜わが家へ忍び込んだものは、ジキル自身の告白によれば、ハイドという名で知られ、カルーの殺害者として国の隅々まで捜索を受けていたのだ。"
    "translation_status": "reviewed"

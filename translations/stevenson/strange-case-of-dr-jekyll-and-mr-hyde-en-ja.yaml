  - "id": "c02-038"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Round the corner from the by-street, there was a square of ancient, handsome houses, now for the most part decayed from their high estate and let in flats and chambers to all sorts and conditions of men; map-engravers, architects, shady lawyers and the agents of obscure enterprises. One house, however, second from the corner, was still occupied entire; and at the door of this, which wore a great air of wealth and comfort, though it was now plunged in darkness except for the fanlight, Mr. Utterson stopped and knocked. A well-dressed, elderly servant opened the door."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[38]"
        "line_start": 866
        "source_sequence": 83
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-038"
    "translation_ja": "横町をひと曲がりした広場には、古い立派な家が並んでいた。今では大半がかつての格を落とし、階や部屋ごとに、地図の版を彫る職人、建築家、いかがわしい弁護士、素性の知れぬ事業の代理人など、あらゆる身分や境遇の人間に貸し出されていた。ただし角から二軒目だけはまだ一軒丸ごとで暮らす家で、今は扉の上の扇形の明かり窓をのぞけば闇に沈んでいたが、裕福で居心地のよさそうな風情があふれていた。アタスン氏はこの戸口で立ち止まり、ノックした。身ぎれいな年配の召使が開けた。"
    "translation_status": "reviewed"
  - "id": "c02-039"

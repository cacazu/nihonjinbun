        "original_unit_id": "c02-041"
    "translation_ja": "「ここでいいよ、ありがとう」と答え、弁護士は火に近づき、背の高い炉囲いに寄りかかった。ひとり残されたこの広間は友人の博士が凝りに凝った部屋で、アタスン自身もロンドンでいちばん居心地のよい部屋だとよく人に話したものだった。だが今夜は血が身内で震えていた。ハイドの顔が記憶に重くのしかかって、彼には珍しく、生きていることにむかつき、うんざりしていた。気持ちが沈むあまり、磨き込まれた戸棚にちらつく火の光や、天井でおびえたように跳ねる影の中にまで、何かの脅しを読み取る気がした。やがて戻ったプールが博士は外出中でございますと告げると、ほっとした自分が恥ずかしかった。"
    "translation_status": "reviewed"

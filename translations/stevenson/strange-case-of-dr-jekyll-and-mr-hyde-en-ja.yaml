    "translation_ja": "もっともこれはアタスン氏にとっては造作もないことだったのだろう。もともと感情を見せぬ人であり、その友情さえも、同じような、相手をえり好みしない善意の上に成り立っているらしかった。巡り合わせが用意してくれた交友の輪を、そのまま受け入れるのは控えめな人のすることで、この弁護士もそうしていた。友人といえば血縁の者か、一番長くから知っている者だった。彼の愛情は蔦と同じで、年月をかけて伸びたのであって、からみつく相手に特別な適性など求めなかった。ロンドンの社交界で名の通った遠縁のリチャード・エンフィールド氏と彼のあいだの絆も、おそらくはそうしてできた。あの二人が互いのどこを気に入っているのか、共通の話題がひとつでもあるのか、ほかの人にはなかなか解けない謎だった。日曜の散歩で二人に行き会った人の話では、黙りこくって妙に退屈そうな顔をし、友人の姿でも見ようものなら、明らかにほっとして呼びとめるという。それでいて本人たちはこの散歩を何よりも大事にして、一週間のうちの宝のひとときと心得ていた。楽しみの誘いを断るばかりか、用向きに呼ばれても応じず、だれにも邪魔させまいとした。"
    "translation_status": "reviewed"
  - "id": "c01-003"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It chanced on one of these rambles that their way led them down a by-street in a busy quarter of London. The street was small and what is called quiet, but it drove a thriving trade on the weekdays. The inhabitants were all doing well, it seemed, and all emulously hoping to do better still, and laying out the surplus of their gains in coquetry; so that the shop fronts stood along that thoroughfare with an air of invitation, like rows of smiling saleswomen. Even on Sunday, when it veiled its more florid charms and lay comparatively empty of passage, the street shone out in contrast to its dingy neighbourhood, like a fire in a forest; and with its freshly painted shutters, well-polished brasses, and general cleanliness and gaiety of note, instantly caught and pleased the eye of the passenger."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"

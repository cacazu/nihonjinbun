    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-015"
    "translation_ja": "実際、食欲などほとんどなかった。この説明のつかぬ出来事、これまでの経験の逆転は、バビロンの壁に現れた指のように、私への判決を一字一字記すようだった。私はこの二重の生が招く結末とその可能性を、かつてないほど真面目に考え始めた。私のうち、別の姿にして外に出せるほうは近ごろおおいに使われ、養われてきた。最近では、エドワード・ハイドの身長が伸びたように思えたし、その姿になった私には、以前より豊かに血潮が通うのが感じられるようだった。これが長く続けば私の本性の均衡は二度と戻らぬほど崩れ、意思で姿を変える力が失われ、エドワード・ハイドの人格が取り返しようもなく私のものとなりはしないか。その危険が見え始めた。薬の力の現れ方はいつも一様だったわけではない。私のこの道のごく初め、一度はまったく効かなかった。それからも何度かは二倍に、また一度は限りない死の危険を冒して三倍にしなければならなかった。こうしたまれな不確かさだけがそれまで私の満悦に影を落としていた。しかし今や、あの朝の出来事に照らすと、初めに難しかったのはジキルの体を脱ぐほうだったのに、近ごろはその困難が次第に、しかし明白に反対の側へ移ってきたのに気づかされた。したがってすべては一つのことを指しているようだった。私はもとの、より善い自分への手がかりを徐々に失い、第二の、より悪い自分と徐々に一体になってゆきつつある。"
    "translation_status": "reviewed"
  - "id": "c10-016"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Between these two, I now felt I had to choose. My two natures had memory in common, but all other faculties were most unequally shared between them. Jekyll (who was composite) now with the most sensitive apprehensions, now with a greedy gusto, projected and shared in the pleasures and adventures of Hyde; but Hyde was indifferent to Jekyll, or but remembered him as the mountain bandit remembers the cavern in which he conceals himself from pursuit. Jekyll had more than a father’s interest; Hyde had more than a son’s indifference. To cast in my lot with Jekyll, was to die to those appetites which I had long secretly indulged and had of late begun to pamper. To cast it in with Hyde, was to die to a thousand interests and aspirations, and to become, at a blow and forever, despised and friendless. The bargain might appear unequal; but there was still another consideration in the scales; for while Jekyll would suffer smartingly in the fires of abstinence, Hyde would be not even conscious of all that he had lost. Strange as my circumstances were, the terms of this debate are as old and commonplace as man; much the same inducements and alarms cast the die for any tempted and trembling sinner; and it fell out with me, as it falls with so vast a majority of my fellows, that I chose the better part and was found wanting in the strength to keep to it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[16]"
        "line_start": 3109
        "source_sequence": 352
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-016"
    "translation_ja": "今や二者のどちらかを選ばねばならないと感じた。二つの本性は記憶を共有していたが、その他の能力の分配はいたって不均等だった。混合体であるジキルは、ときにはひどく神経をとがらせつつ、ときには貪るように味わいつつ、ハイドの歓楽と冒険を企て、それにあずかった。だがハイドはジキルなどどうでもよく、思い出すとしても、山賊が追っ手を逃れて身を潜める洞窟を思い出すようなものだった。ジキルの気のかけ方は父親以上であり、ハイドの無関心は息子以上だった。ジキルと運命を共にするとは、長くひそかに満たし、近ごろはいよいよ甘やかしていた欲望と縁を切ることだった。ハイドと運命を共にするとは、無数の関心と志を捨て、ひと思いに、しかも永遠に、人に軽蔑され友もない者となることだった。片方が明らかに割に合わない取引に見えるかもしれない。しかし秤の皿にはもう一つ考えるべきことが載っていた。ジキルは節制の火にひりひり焼かれて苦しむが、ハイドは失ったすべてを意識することすらあるまい。私の境遇がいかに奇異でも、この議論の条件は人間と同じほど古く、ありふれている。誘惑にさらされて震える罪人が誰であれ、大同小異の誘いと恐れが賽を投げる。そして私の場合も、あまりに大多数の同胞の場合と同じことが起きた。より善いほうを選んでおきながら、その選択を守り抜く力を欠くことがわかったのだ。"
    "translation_status": "reviewed"
  - "id": "c10-017"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Yes, I preferred the elderly and discontented doctor, surrounded by friends and cherishing honest hopes; and bade a resolute farewell to the liberty, the comparative youth, the light step, leaping impulses and secret pleasures, that I had enjoyed in the disguise of Hyde. I made this choice perhaps with some unconscious reservation, for I neither gave up the house in Soho, nor destroyed the clothes of Edward Hyde, which still lay ready in my cabinet. For two months, however, I was true to my determination; for two months, I led a life of such severity as I had never before attained to, and enjoyed the compensations of an approving conscience. But time began at last to obliterate the freshness of my alarm; the praises of conscience began to grow into a thing of course; I began to be tortured with throes and longings, as of Hyde struggling after freedom; and at last, in an hour of moral weakness, I once again compounded and swallowed the transforming draught."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[17]"
        "line_start": 3130
        "source_sequence": 353
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-017"
    "translation_ja": "そうだ、私は友に囲まれ、まっとうな望みを抱く、年を取り満たされぬ博士のほうを選んだ。そしてハイドの変装のもとで味わった自由と、いくぶんの若さと、軽い足取りと、跳ね上がる衝動と、秘密の楽しみには、断乎として別れを告げた。この選択には、自分でも気づかない留保がいくらかあったかもしれない。私はソーホーの家を手放さなかったし、エドワード・ハイドの衣服も処分せず、私室にいつでも使えるよう置いておいたからだ。とはいえ二か月は決意を裏切らなかった。二か月、私は過去に到達したこともないほど厳しい生活を送り、よくやったと認める良心の報いを享受した。だがついに時が私の危惧の生々しさを消し始めた。良心の称賛は当然のこととなり始め、ハイドが自由を求めてもがくような疼きと渇望に私は苛まれ始めた。そしてついに、道義の力の弱ったひととき、私はまたしても変身の薬を調合し、飲み込んだ。"
    "translation_status": "reviewed"
  - "id": "c10-018"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I do not suppose that, when a drunkard reasons with himself upon his vice, he is once out of five hundred times affected by the dangers that he runs through his brutish, physical insensibility; neither had I, long as I had considered my position, made enough allowance for the complete moral insensibility and insensate readiness to evil, which were the leading characters of Edward Hyde. Yet it was by these that I was punished. My devil had been long caged, he came out roaring. I was conscious, even when I took the draught, of a more unbridled, a more furious propensity to ill. It must have been this, I suppose, that stirred in my soul that tempest of impatience with which I listened to the civilities of my unhappy victim; I declare, at least, before God, no man morally sane could have been guilty of that crime upon so pitiful a provocation; and that I struck in no more reasonable spirit than that in which a sick child may break a plaything. But I had voluntarily stripped myself of all those balancing instincts by which even the worst of us continues to walk with some degree of steadiness among temptations; and in my case, to be tempted, however slightly, was to fall."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[18]"
        "line_start": 3146
        "source_sequence": 354
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-018"
    "translation_ja": "酒飲みが自分の悪癖について自分に理を説くとき、獣じみた肉体の無感覚によってどんな危険を冒しているかに、五百回に一回でも心を動かされるとは思わない。同様に私はいくら長く境遇を考え合わせたとはいえ、エドワード・ハイドの最大の特徴だった、道徳の完全な無感覚と、ためらいなく悪に走る性向とを十分計算に入れなかった。ところが私に罰を下したのはまさにそれらだった。長く檻に閉じ込められていた私の悪魔は、吠えたけりながら出てきた。薬を飲んだときからもう、悪へ向かう傾きがいちだんと野放図で、激しいのを感じていた。私の不幸な犠牲者の礼儀正しい言葉を聞いたとき胸中に吹き荒れた癇癪の嵐を起こしたのも、おそらくはこれだったろう。少なくとも神の御前に申し立てる。善悪の分別を保った者なら、あれほど取るに足りぬきっかけであの罪を働けたはずはない。私が手を上げたときの心にあった理屈は、病んだ子どもがおもちゃを壊すときのそれ以上ではなかった。だがどれほど悪い人間でさえ、誘惑の中をいくらかは堅実に歩み続けられるよう釣り合いを保つ本能を、私はすべて自分から剥ぎ取っていた。私の場合、ほんのわずかな誘惑を受けることは、とりもなおさず転落することだった。"
    "translation_status": "reviewed"
  - "id": "c10-019"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Instantly the spirit of hell awoke in me and raged. With a transport of glee, I mauled the unresisting body, tasting delight from every blow; and it was not till weariness had begun to succeed, that I was suddenly, in the top fit of my delirium, struck through the heart by a cold thrill of terror. A mist dispersed; I saw my life to be forfeit; and fled from the scene of these excesses, at once glorying and trembling, my lust of evil gratified and stimulated, my love of life screwed to the topmost peg. I ran to the house in Soho, and (to make assurance doubly sure) destroyed my papers; thence I set out through the lamplit streets, in the same divided ecstasy of mind, gloating on my crime, light-headedly devising others in the future, and yet still hastening and still hearkening in my wake for the steps of the avenger. Hyde had a song upon his lips as he compounded the draught, and as he drank it, pledged the dead man. The pangs of transformation had not done tearing him, before Henry Jekyll, with streaming tears of gratitude and remorse, had fallen upon his knees and lifted his clasped hands to God. The veil of self-indulgence was rent from head to foot. I saw my life as a whole: I followed it up from the days of childhood, when I had walked with my father’s hand, and through the self-denying toils of my professional life, to arrive again and again, with the same sense of unreality, at the damned horrors of the evening. I could have screamed aloud; I sought with tears and prayers to smother down the crowd of hideous images and sounds with which my memory swarmed against me; and still, between the petitions, the ugly face of my iniquity stared into my soul. As the acuteness of this remorse began to die away, it was succeeded by a sense of joy. The problem of my conduct was solved. Hyde was thenceforth impossible; whether I would or not, I was now confined to the better part of my existence; and O, how I rejoiced to think of it! with what willing humility I embraced anew the restrictions of natural life! with what sincere renunciation I locked the door by which I had so often gone and come, and ground the key under my heel!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"

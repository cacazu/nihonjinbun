    "translation_ja": "ラニョンの家でわれに返ったとき、旧友のおびえに多少は影響されたかもしれない。よくわからない。少なくとも、あの数時間を思い返して私自身が覚えた嫌悪に比べれば、大海の一滴にすぎなかった。私は変わった。私を責めさいなむのはもはや絞首台への恐れではなく、ハイドであることへの恐怖だった。私は半ば夢の中でラニョンの断罪を聞き、半ば夢の中でわが家に戻り、寝床に入った。一日の消耗のあと、抗いようのない深い眠りに落ち、私を絞めつける悪夢さえそれを破れなかった。朝には、動揺し、弱りながらも、いくらか休まった思いで目がさめた。私の内に眠る獣を考えるだけでなお嫌悪と恐れを抱き、当然ながら前日の戦慄すべき危険も忘れてはいなかった。だがまたわが家にいて、薬も手近にあった。逃れおおせた感謝が魂にこれほど強く照り輝き、希望の明るさにほとんど匹敵するほどだった。"
    "translation_status": "reviewed"
  - "id": "c10-026"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was stepping leisurely across the court after breakfast, drinking the chill of the air with pleasure, when I was seized again with those indescribable sensations that heralded the change; and I had but the time to gain the shelter of my cabinet, before I was once again raging and freezing with the passions of Hyde. It took on this occasion a double dose to recall me to myself; and alas! six hours after, as I sat looking sadly in the fire, the pangs returned, and the drug had to be re-administered. In short, from that day forth it seemed only by a great effort as of gymnastics, and only under the immediate stimulation of the drug, that I was able to wear the countenance of Jekyll. At all hours of the day and night, I would be taken with the premonitory shudder; above all, if I slept, or even dozed for a moment in my chair, it was always as Hyde that I awakened. Under the strain of this continually impending doom and by the sleeplessness to which I now condemned myself, ay, even beyond what I had thought possible to man, I became, in my own person, a creature eaten up and emptied by fever, languidly weak both in body and mind, and solely occupied by one thought: the horror of my other self. But when I slept, or when the virtue of the medicine wore off, I would leap almost without transition (for the pangs of transformation grew daily less marked) into the possession of a fancy brimming with images of terror, a soul boiling with causeless hatreds, and a body that seemed not strong enough to contain the raging energies of life. The powers of Hyde seemed to have grown with the sickliness of Jekyll. And certainly the hate that now divided them was equal on each side. With Jekyll, it was a thing of vital instinct. He had now seen the full deformity of that creature that shared with him some of the phenomena of consciousness, and was co-heir with him to death: and beyond these links of community, which in themselves made the most poignant part of his distress, he thought of Hyde, for all his energy of life, as of something not only hellish but inorganic. This was the shocking thing; that the slime of the pit seemed to utter cries and voices; that the amorphous dust gesticulated and sinned; that what was dead, and had no shape, should usurp the offices of life. And this again, that that insurgent horror was knit to him closer than a wife, closer than an eye; lay caged in his flesh, where he heard it mutter and felt it struggle to be born; and at every hour of weakness, and in the confidence of slumber, prevailed against him, and deposed him out of life. The hatred of Hyde for Jekyll was of a different order. His terror of the gallows drove him continually to commit temporary suicide, and return to his subordinate station of a part instead of a person; but he loathed the necessity, he loathed the despondency into which Jekyll was now fallen, and he resented the dislike with which he was himself regarded. Hence the ape-like tricks that he would play me, scrawling in my own hand blasphemies on the pages of my books, burning the letters and destroying the portrait of my father; and indeed, had it not been for his fear of death, he would long ago have ruined himself in order to involve me in the ruin. But his love of life is wonderful; I go further: I, who sicken and freeze at the mere thought of him, when I recall the abjection and passion of this attachment, and when I know how he fears my power to cut him off by suicide, I find it in my heart to pity him."

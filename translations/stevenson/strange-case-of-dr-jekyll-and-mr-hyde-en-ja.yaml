      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-005"
    "translation_ja": "当時、私室に鏡はなかった。書いている今、私のそばに立つ鏡は後日、まさにこれらの変身のために取り寄せたものだ。だが夜は更けてすでに明け方に深く入り、真っ暗ではあったが、朝はまさに一日をはらもうとしていた。家の者は眠りのもっとも厳重な時刻に封じ込められていた。希望と勝利に上気した私はこの新しい姿で寝室まで出てみようと決めた。中庭を横切ると頭上の星座が、眠らぬ見張りの目がかつて捉えたことのない種族の最初の一人を不思議そうに見下ろしている、そんな気がした。わが家の中をよそ者として廊下を忍び足で抜け、寝室に入って、私は初めてエドワード・ハイドの姿を見た。"
    "translation_status": "reviewed"
  - "id": "c10-006"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I must here speak by theory alone, saying not that which I know, but that which I suppose to be most probable. The evil side of my nature, to which I had now transferred the stamping efficacy, was less robust and less developed than the good which I had just deposed. Again, in the course of my life, which had been, after all, nine tenths a life of effort, virtue and control, it had been much less exercised and much less exhausted. And hence, as I think, it came about that Edward Hyde was so much smaller, slighter and younger than Henry Jekyll. Even as good shone upon the countenance of the one, evil was written broadly and plainly on the face of the other. Evil besides (which I must still believe to be the lethal side of man) had left on that body an imprint of deformity and decay. And yet when I looked upon that ugly idol in the glass, I was conscious of no repugnance, rather of a leap of welcome. This, too, was myself. It seemed natural and human. In my eyes it bore a livelier image of the spirit, it seemed more express and single, than the imperfect and divided countenance I had been hitherto accustomed to call mine. And in so far I was doubtless right. I have observed that when I wore the semblance of Edward Hyde, none could come near to me at first without a visible misgiving of the flesh. This, as I take it, was because all human beings, as we meet them, are commingled out of good and evil: and Edward Hyde, alone in the ranks of mankind, was pure evil."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[6]"
        "line_start": 2929
        "source_sequence": 342
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-006"
    "translation_ja": "ここでは理論だけで語らねばならない。知っていることではなく、もっともありそうだと思うことを言う。私はそのとき、本性の悪の側に、肉体をかたどる力を移した。悪は、今しがたその座を追われた善ほど強くも、育ってもいなかった。しかも私の人生の十分の九は、結局のところ努力と徳と自制の人生だった。その中で、悪のほうははるかに使われることが少なく、消耗することも少なかった。だからこそエドワード・ハイドはヘンリー・ジキルよりずっと小さく、華奢で若かったのだろうと私は考える。一方の顔で善が輝くのと同じく、他方の顔には悪が大きく、明瞭に書かれていた。それに、今もなお人間のうちの死をもたらす側だと信ぜざるをえない悪は、その体に歪みと衰えの痕を残していた。それでも鏡の中の醜い偶像を見たときに感じたのは反発ではなく、むしろ迎え入れる喜びの躍動だった。これも私だった。それは自然で人間らしく見えた。それまで自分のものと呼びならわしてきた、不完全で二つに割れた顔よりも、それは魂の姿をいきいきと映し、はるかにくっきりと、一つにまとまって見えた。その限りでは間違いなく私は正しかったのだ。エドワード・ハイドの外見をまとった私のそばに初めて来るとき、目に見えて肉体がおののかぬ人間は一人もいなかった。私の見るところ、それはこの世で出会うどの人間も善と悪との混合であるのに、エドワード・ハイドだけは、人類すべてのうちただ独り、純粋な悪だったからである。"
    "translation_status": "reviewed"
  - "id": "c10-007"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I lingered but a moment at the mirror: the second and conclusive experiment had yet to be attempted; it yet remained to be seen if I had lost my identity beyond redemption and must flee before daylight from a house that was no longer mine; and hurrying back to my cabinet, I once more prepared and drank the cup, once more suffered the pangs of dissolution, and came to myself once more with the character, the stature and the face of Henry Jekyll."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[7]"
        "line_start": 2951
        "source_sequence": 343
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-007"
    "translation_ja": "鏡の前にとどまったのは一瞬だけだった。第二の、そして決定的な実験がまだ残っていた。私は取り返しようもなく元の自分を失い、もはやわが家でない家から夜明け前に逃げ出さなくてはならないのか、それを確かめるのはこれからだった。急いで私室に戻り、もう一度一杯を調えて飲み干し、もう一度ほどけ散る苦悶に耐え、もう一度ヘンリー・ジキルの性格と背丈と顔をもってわれに返った。"
    "translation_status": "reviewed"
  - "id": "c10-008"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "That night I had come to the fatal cross-roads. Had I approached my discovery in a more noble spirit, had I risked the experiment while under the empire of generous or pious aspirations, all must have been otherwise, and from these agonies of death and birth, I had come forth an angel instead of a fiend. The drug had no discriminating action; it was neither diabolical nor divine; it but shook the doors of the prisonhouse of my disposition; and like the captives of Philippi, that which stood within ran forth. At that time my virtue slumbered; my evil, kept awake by ambition, was alert and swift to seize the occasion; and the thing that was projected was Edward Hyde. Hence, although I had now two characters as well as two appearances, one was wholly evil, and the other was still the old Henry Jekyll, that incongruous compound of whose reformation and improvement I had already learned to despair. The movement was thus wholly toward the worse."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[8]"
        "line_start": 2960
        "source_sequence": 344
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-008"
    "translation_ja": "私はあの夜、運命の辻に来ていた。より高貴な心で自分の発見に近づいていたら、寛仁や信仰の志に支配されて実験に身を賭したのであったら、すべてが違っていたはずだ。この死と誕生の苦悶を経て、私は悪鬼ではなく天使となって出てきただろう。薬にえり分ける作用はなかった。悪魔のものでも神のものでもない。私の性情を閉じ込める牢獄の扉をただ揺すったので、フィリピの囚人たちのように、中にいたものが駆け出したのだ。そのとき私の徳は眠っていた。野心に目を覚まされていた悪は機敏で、すばやく機会をつかんだ。こうして外に現れたものがエドワード・ハイドだった。ゆえに私はいまや二つの外見とともに二つの性格を持つとはいえ、一方はそっくり悪で、もう一方は相変わらずのヘンリー・ジキル、その改心と向上にはもう望みを絶つようになっていた、あの相容れぬものの混合体だった。したがって変化はもっぱら悪い方に向かった。"
    "translation_status": "reviewed"
  - "id": "c10-009"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Even at that time, I had not conquered my aversion to the dryness of a life of study. I would still be merrily disposed at times; and as my pleasures were (to say the least) undignified, and I was not only well known and highly considered, but growing towards the elderly man, this incoherency of my life was daily growing more unwelcome. It was on this side that my new power tempted me until I fell in slavery. I had but to drink the cup, to doff at once the body of the noted professor, and to assume, like a thick cloak, that of Edward Hyde. I smiled at the notion; it seemed to me at the time to be humourous; and I made my preparations with the most studious care. I took and furnished that house in Soho, to which Hyde was tracked by the police; and engaged as a housekeeper a creature whom I knew well to be silent and unscrupulous. On the other side, I announced to my servants that a Mr. Hyde (whom I described) was to have full liberty and power about my house in the square; and to parry mishaps, I even called and made myself a familiar object, in my second character. I next drew up that will to which you so much objected; so that if anything befell me in the person of Dr. Jekyll, I could enter on that of Edward Hyde without pecuniary loss. And thus fortified, as I supposed, on every side, I began to profit by the strange immunities of my position."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[9]"
        "line_start": 2976
        "source_sequence": 345
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-009"
    "translation_ja": "当時に至っても私は、学究生活の味気なさへの反感を克服していなかった。折々にはまだ浮かれたい気分になった。しかも私の楽しみは、控えめに言っても品位を欠いており、私は世に名を知られ高く評価されていたばかりか、すでに老境に向かっていたので、このちぐはぐな生き方は日に日に不都合になっていった。新しい力はこの弱みにつけ込んで私を誘惑し、ついに虜にした。一杯飲みさえすれば、名のある教授の体をたちまち脱ぎ捨て、厚い外套さながらにエドワード・ハイドの体をまとうことができる。その思いつきに私は微笑した。当時は面白い冗談のように感じられた。そしてきわめて入念に準備をした。のちに警察がハイドの跡を追って訪ねたソーホーのあの家を借り、家具を入れ、口が堅く良心のとがめとは無縁とよく知る人間を家政婦に雇った。他方、広場の家の者たちには、ハイドという男に、こういう人相だと知らせた上で、屋敷でのすべての自由と権限を許すと伝えた。不慮のそごを防ぐため、その第二の人格で実際に訪問をし、見慣れた顔にさえなっておいた。次に、君があれほど反対したあの遺言書を作った。ジキル博士の身に何があっても、金銭上の損をせずエドワード・ハイドの身に移れるようにするためだった。こうして四方を固めたつもりで、私はこの境遇にともなう奇妙な免責の恩恵を享受し始めた。"
    "translation_status": "reviewed"
  - "id": "c10-010"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Men have before hired bravos to transact their crimes, while their own person and reputation sat under shelter. I was the first that ever did so for his pleasures. I was the first that could plod in the public eye with a load of genial respectability, and in a moment, like a schoolboy, strip off these lendings and spring headlong into the sea of liberty. But for me, in my impenetrable mantle, the safety was complete. Think of it—I did not even exist! Let me but escape into my laboratory door, give me but a second or two to mix and swallow the draught that I had always standing ready; and whatever he had done, Edward Hyde would pass away like the stain of breath upon a mirror; and there in his stead, quietly at home, trimming the midnight lamp in his study, a man who could afford to laugh at suspicion, would be Henry Jekyll."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[10]"
        "line_start": 2997
        "source_sequence": 346
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-010"
    "translation_ja": "自分の身と評判を安全なところに置いたまま、ならず者を雇って犯罪を任せた人間はこれまでもある。私は自分の楽しみのためにそれをした最初の者だった。人当たりのよい篤実な名士という重荷を背負い世人の目の前を律義に歩んでいたかと思うと、一瞬のうちに、学校の小僧のように借り物を脱ぎ捨て、まっさかさまに自由の海へ飛び込めるのも私が初めてだった。しかも、見通せぬ外套に包まれた私は完全に安全だった。考えてもみたまえ、私は存在すらしていなかったのだ！　実験室の戸の中へ逃げ込むことさえできればいい。いつでも手近に用意してあった薬を混ぜて飲むほんの一、二秒さえくれればよい。何をしでかしたあとでも、エドワード・ハイドは鏡にかかった息の曇りのように消え、その代わりに家で静かに書斎の夜半の灯心を整えているのは、いかなる疑いも笑い飛ばせる男、ヘンリー・ジキルだった。"
    "translation_status": "reviewed"
  - "id": "c10-011"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The pleasures which I made haste to seek in my disguise were, as I have said, undignified; I would scarce use a harder term. But in the hands of Edward Hyde, they soon began to turn toward the monstrous. When I would come back from these excursions, I was often plunged into a kind of wonder at my vicarious depravity. This familiar that I called out of my own soul, and sent forth alone to do his good pleasure, was a being inherently malign and villainous; his every act and thought centered on self; drinking pleasure with bestial avidity from any degree of torture to another; relentless like a man of stone. Henry Jekyll stood at times aghast before the acts of Edward Hyde; but the situation was apart from ordinary laws, and insidiously relaxed the grasp of conscience. It was Hyde, after all, and Hyde alone, that was guilty. Jekyll was no worse; he woke again to his good qualities seemingly unimpaired; he would even make haste, where it was possible, to undo the evil done by Hyde. And thus his conscience slumbered."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[11]"
        "line_start": 3011
        "source_sequence": 347
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-011"
    "translation_ja": "変装のもと私がいそいそと求めた快楽は、言ったとおり、品位を欠いていた。それ以上に強い言葉はほとんど使いたくない。だがエドワード・ハイドの手にかかると、じきにそれは怪物じみたものに変わりだした。こうした外出から戻るたび、私は身代わりを通しての自分の堕落ぶりに一種の驚嘆を覚えることがよくあった。己の魂から呼び出し、好きに楽しめと一人きりで送り出したこの使い魔は、生来、害意に満ちた卑劣な存在だった。行いと思念のどれもが自分だけを中心とし、他人にどんな程度であれ苦痛を与えては獣の貪欲さで喜びを飲み、石でできた人間のように容赦というものがなかった。ヘンリー・ジキルはときにエドワード・ハイドの行為を前に愕然とした。だがこの境遇は通常の法則から外れていて、知らぬ間に良心の抑えを緩めた。結局、罪があるのはハイドであり、ハイドだけなのだ。ジキルは悪くなってはいない。目覚めてふたたび善良な資質に戻れば、それらには傷のついた様子がなかった。できるところでは、ハイドがしでかした害を急いで取り除こうとさえした。こうして彼の良心は眠った。"
    "translation_status": "reviewed"
  - "id": "c10-012"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Into the details of the infamy at which I thus connived (for even now I can scarce grant that I committed it) I have no design of entering; I mean but to point out the warnings and the successive steps with which my chastisement approached. I met with one accident which, as it brought on no consequence, I shall no more than mention. An act of cruelty to a child aroused against me the anger of a passer-by, whom I recognised the other day in the person of your kinsman; the doctor and the child’s family joined him; there were moments when I feared for my life; and at last, in order to pacify their too just resentment, Edward Hyde had to bring them to the door, and pay them in a cheque drawn in the name of Henry Jekyll. But this danger was easily eliminated from the future, by opening an account at another bank in the name of Edward Hyde himself; and when, by sloping my own hand backward, I had supplied my double with a signature, I thought I sat beyond the reach of fate."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[12]"
        "line_start": 3028
        "source_sequence": 348
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-012"
    "translation_ja": "私がそのように黙認した恥ずべき行為について（今もなお、自分が働いたのだとはおいそれと認められない）、詳細に立ち入るつもりはない。ただ刑罰の近づく前兆と、その一つ一つの足取りとを示したい。一度思いがけない出来事にぶつかった。後には何の結果をも残さなかったから、触れるにとどめる。ある子どもに対する私のむごいふるまいが、通りがかりの男を怒らせた。先日、君のご親族を見てそれと気がついたあの人だ。医者と子どもの家族も加勢し、私は命も危ぶんだほどだった。まことにもっともな憤りを静めるため、しまいにエドワード・ハイドは彼らをあの戸口に連れてゆき、ヘンリー・ジキル名義の小切手で金を払わざるをえなかった。ところがこの危険も、別の銀行にエドワード・ハイド自身の口座を開くことで、将来にわたって容易に取り除けた。さらに自分の筆の傾きを逆向きにして分身に署名を与えると、私はもう運命の手も届かぬところに身を置いたと思った。"
    "translation_status": "reviewed"
  - "id": "c10-013"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Some two months before the murder of Sir Danvers, I had been out for one of my adventures, had returned at a late hour, and woke the next day in bed with somewhat odd sensations. It was in vain I looked about me; in vain I saw the decent furniture and tall proportions of my room in the square; in vain that I recognised the pattern of the bed curtains and the design of the mahogany frame; something still kept insisting that I was not where I was, that I had not wakened where I seemed to be, but in the little room in Soho where I was accustomed to sleep in the body of Edward Hyde. I smiled to myself, and in my psychological way, began lazily to inquire into the elements of this illusion, occasionally, even as I did so, dropping back into a comfortable morning doze. I was still so engaged when, in one of my more wakeful moments, my eyes fell upon my hand. Now the hand of Henry Jekyll (as you have often remarked) was professional in shape and size; it was large, firm, white and comely. But the hand which I now saw, clearly enough, in the yellow light of a mid-London morning, lying half shut on the bedclothes, was lean, corded, knuckly, of a dusky pallor and thickly shaded with a swart growth of hair. It was the hand of Edward Hyde."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[13]"
        "line_start": 3044
        "source_sequence": 349
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-013"
    "translation_ja": "サー・ダンヴァーズが殺される二か月ほど前、私は例の冒険の一つに出かけ、遅く帰り、翌日寝床で目覚めると、いくらか妙な感覚があった。あたりを見まわしても無駄だった。広場の自室の上品な家具や、天井の高い立派な造りを見ても、寝台の帳の模様やマホガニーの枠の意匠に見覚えがあっても無駄だった。それでも何かがしきりに言い張った。私は今いるところにいるのではない。目覚めたのは目に見えている場所ではない。エドワード・ハイドの姿でよく眠るソーホーの小さな部屋なのだ、と。私はひとり微笑し、いつものように心の働きをたどり、この錯覚がどこから来たかをのんびり探り始めた。そうしてはときどき心地よい朝のまどろみに戻った。なおそうしているうちに、いくらかはっきり目覚めていた一瞬、目がわが手に落ちた。ところでヘンリー・ジキルの手は、君がたびたび言ったように、形も大きさも知的な職にある者の手で、大きく、しっかりして、白く、見よかった。ところが今、ロンドンの中心の朝の黄色い光に、半ば握ったまま掛け布の上にくっきり見えている手は、痩せて筋張り、指の節が突き出て、くすんだ青白さの上に黒々と濃い毛が影を落としていた。エドワード・ハイドの手だった。"
    "translation_status": "reviewed"
  - "id": "c10-014"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I must have stared upon it for near half a minute, sunk as I was in the mere stupidity of wonder, before terror woke up in my breast as sudden and startling as the crash of cymbals; and bounding from my bed I rushed to the mirror. At the sight that met my eyes, my blood was changed into something exquisitely thin and icy. Yes, I had gone to bed Henry Jekyll, I had awakened Edward Hyde. How was this to be explained? I asked myself; and then, with another bound of terror—how was it to be remedied? It was well on in the morning; the servants were up; all my drugs were in the cabinet—a long journey down two pair of stairs, through the back passage, across the open court and through the anatomical theatre, from where I was then standing horror-struck. It might indeed be possible to cover my face; but of what use was that, when I was unable to conceal the alteration in my stature? And then with an overpowering sweetness of relief, it came back upon my mind that the servants were already used to the coming and going of my second self. I had soon dressed, as well as I was able, in clothes of my own size: had soon passed through the house, where Bradshaw stared and drew back at seeing Mr. Hyde at such an hour and in such a strange array; and ten minutes later, Dr. Jekyll had returned to his own shape and was sitting down, with a darkened brow, to make a feint of breakfasting."
    "source_languages":
      - "en"
    "source_locations":

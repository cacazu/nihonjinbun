    "translation_ja": "「では、お聞きになったことはないのですか、あの――例の扉のある場所のことは」とアタスン氏。"
    "translation_status": "reviewed"
  - "id": "c01-014"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No, sir; I had a delicacy,” was the reply. “I feel very strongly about putting questions; it partakes too much of the style of the day of judgment. You start a question, and it’s like starting a stone. You sit quietly on the top of a hill; and away the stone goes, starting others; and presently some bland old bird (the last you would have thought of) is knocked on the head in his own back garden and the family have to change their name. No sir, I make it a rule of mine: the more it looks like Queer Street, the less I ask.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[14]"
        "line_start": 467
        "source_sequence": 30
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-014"
    "translation_ja": "「ええ、そこは遠慮しました」と答えがあった。「何かと質問するのは、私はどうも感心しない。あれは最後の審判の日のやり口に似すぎている。質問をひとつ転がすのは、石をひとつ転がすのと同じです。自分は丘のてっぺんにおとなしく座っている。石は転がって別の石を動かし、そのうち、どこかの温厚なご隠居（思いもかけない相手ですよ）が自分の裏庭で頭をぶち割られて、その家族が姓を変えねばならなくなる。いや、私には決めていることがありましてね。〈厄介通り〉に入りこんだような話ほど、聞かないことにしています」"
    "translation_status": "reviewed"
  - "id": "c01-015"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“A very good rule, too,” said the lawyer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[15]"
        "line_start": 478
        "source_sequence": 31
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-015"
    "translation_ja": "「まことにけっこうな決めごとですな」と弁護士は言った。"
    "translation_status": "reviewed"
  - "id": "c01-016"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“But I have studied the place for myself,” continued Mr. Enfield. “It seems scarcely a house. There is no other door, and nobody goes in or out of that one but, once in a great while, the gentleman of my adventure. There are three windows looking on the court on the first floor; none below; the windows are always shut but they’re clean. And then there is a chimney which is generally smoking; so somebody must live there. And yet it’s not so sure; for the buildings are so packed together about the court, that it’s hard to say where one ends and another begins.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[16]"
        "line_start": 482
        "source_sequence": 32
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-016"
    "translation_ja": "「ただ、自分でここをよく観察はしましたよ」とエンフィールド氏はつづけた。「家といえるようなものには見えない。ほかに戸はひとつもないし、あの戸を出入りする者も、ごくたまに、私が出くわした例の紳士がいるだけ。中庭に面して二階に窓が三つあるが、下にはひとつもない。窓はいつも閉まっているのに、ちゃんときれいにしてある。それから煙突がひとつ、たいてい煙を出している。だれかが住んでいるにはちがいない。とはいっても確かと言いきれないのは、中庭のまわりに建物がひしめきあっていて、どこまでが一軒でどこからが次の家かわかりにくいからです」"
    "translation_status": "reviewed"
  - "id": "c01-017"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The pair walked on again for a while in silence; and then “Enfield,” said Mr. Utterson, “that’s a good rule of yours.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[17]"
        "line_start": 493
        "source_sequence": 33
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-017"
    "translation_ja": "ふたりはまた、しばらく黙って歩いた。それからアタスン氏が言った。「エンフィールド、あなたのその決めごと、いいですな」"
    "translation_status": "reviewed"
  - "id": "c01-018"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes, I think it is,” returned Enfield."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[18]"
        "line_start": 499
        "source_sequence": 34
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-018"
    "translation_ja": "「私もそう思いますね」とエンフィールドは答えた。"
    "translation_status": "reviewed"
  - "id": "c01-019"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“But for all that,” continued the lawyer, “there’s one point I want to ask. I want to ask the name of that man who walked over the child.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[19]"
        "line_start": 503
        "source_sequence": 35
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-019"
    "translation_ja": "「ですがそれはそれとして」と弁護士はつづけた。「ひとつだけお聞きしたいことがある。子どもを踏みつけていったその男の名です」"
    "translation_status": "reviewed"
  - "id": "c01-020"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” said Mr. Enfield, “I can’t see what harm it would do. It was a man of the name of Hyde.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[20]"
        "line_start": 509
        "source_sequence": 36
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-020"
    "translation_ja": "「ええ、まあ、それくらいで何の害がありましょう。ハイドという名の男でした」とエンフィールド氏は言った。"
    "translation_status": "reviewed"
  - "id": "c01-021"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Hm,” said Mr. Utterson. “What sort of a man is he to see?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[21]"
        "line_start": 514
        "source_sequence": 37
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-021"
    "translation_ja": "「ふむ」とアタスン氏。「見たところ、どんな男です？」"
    "translation_status": "reviewed"
  - "id": "c01-022"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“He is not easy to describe. There is something wrong with his appearance; something displeasing, something down-right detestable. I never saw a man I so disliked, and yet I scarce know why. He must be deformed somewhere; he gives a strong feeling of deformity, although I couldn’t specify the point. He’s an extraordinary looking man, and yet I really can name nothing out of the way. No, sir; I can make no hand of it; I can’t describe him. And it’s not want of memory; for I declare I can see him this moment.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[22]"
        "line_start": 519
        "source_sequence": 38
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-022"
    "translation_ja": "「うまく言えないんです。容貌にどこか、おかしなところがある。不愉快なところが、はっきり言えばまったくいとわしいところがある。あれほど嫌な男は見たことがない。なのに理由はよくわからない。体のどこかが歪んでいるにちがいない。そういう強い感じがするのに、どこといって指摘はできないんです。並みの風体じゃない。そう思いながら実際に普通と違うところがどこにも見つからない。だめですな、どうにも手に負えない。説明できません。覚えてないからじゃないですよ。今この瞬間にも、あいつの姿が目に浮かぶんだから」"
    "translation_status": "reviewed"
  - "id": "c01-023"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Utterson again walked some way in silence and obviously under a weight of consideration. “You are sure he used a key?” he inquired at last."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[23]"
        "line_start": 530
        "source_sequence": 39
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-023"
    "translation_ja": "アタスン氏はまたしばらく黙って歩いた。何か重い考えを胸に抱えているのが見て取れた。「たしかに、鍵を使ったんですね？」と、ようやくたずねた。"
    "translation_status": "reviewed"
  - "id": "c01-024"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“My dear sir...” began Enfield, surprised out of himself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[24]"
        "line_start": 535
        "source_sequence": 40
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-024"
    "translation_ja": "「いや、そりゃあ……」とエンフィールドは思いがけない問いにうろたえて口を開いた。"
    "translation_status": "reviewed"
  - "id": "c01-025"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes, I know,” said Utterson; “I know it must seem strange. The fact is, if I do not ask you the name of the other party, it is because I know it already. You see, Richard, your tale has gone home. If you have been inexact in any point you had better correct it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[25]"
        "line_start": 539
        "source_sequence": 41
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-025"
    "translation_ja": "「ええ、わかります」とアタスン。「さぞ妙にお聞こえでしょうね。じつは、小切手を切ったほうのお名前をうかがわないのは、すでに存じているからです。リチャード、あなたの話は、私には他人事ではなかったのです。何かなりと不正確な点があったなら、いまのうちに訂正なさったほうがいい」"
    "translation_status": "reviewed"
  - "id": "c01-026"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I think you might have warned me,” returned the other with a touch of sullenness. “But I have been pedantically exact, as you call it. The fellow had a key; and what’s more, he has it still. I saw him use it not a week ago.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[26]"
        "line_start": 546
        "source_sequence": 42
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-026"
    "translation_ja": "「そうならそうと先に言ってくださっても」と相手は少しむっとして返した。「だが、私の話はあなたのいうところの、ばかていねいなほどの正確さですよ。やつは鍵を持っていました。それどころか、まだ持っています。一週間とたたない前、私がこの目でやつがそれを使うのを見たんです」"
    "translation_status": "reviewed"
  - "id": "c01-027"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Utterson sighed deeply but said never a word; and the young man presently resumed. “Here is another lesson to say nothing,” said he. “I am ashamed of my long tongue. Let us make a bargain never to refer to this again.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[27]"
        "line_start": 553
        "source_sequence": 43
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-027"
    "translation_ja": "アタスン氏は深いため息をついたが、ひとことも言わなかった。やがて年下のほうがまた口を開いた。「黙っているにかぎるという教訓が、これでまたひとつ増えました。自分の口の軽さが恥ずかしい。もう金輪際、この件には触れっこなし、と約束しましょう」"
    "translation_status": "reviewed"
  - "id": "c01-028"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“With all my heart,” said the lawyer. “I shake hands on that, Richard.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[3]/p[28]"
        "line_start": 560
        "source_sequence": 44
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap01"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-028"
    "translation_ja": "「喜んで」と弁護士は言った。「握手をしましょう、リチャード」"
    "translation_status": "reviewed"
  - "id": "c02-000"
    "section_id": "chapter-02"
    "kind": "heading"
    "origin": "source"
    "source_text": "SEARCH FOR MR. HYDE"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/h2"
        "line_start": 569
        "source_sequence": 45
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-000"
    "translation_ja": "ハイド氏を捜して"
    "translation_status": "reviewed"
  - "id": "c02-001"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "That evening Mr. Utterson came home to his bachelor house in sombre spirits and sat down to dinner without relish. It was his custom of a Sunday, when this meal was over, to sit close by the fire, a volume of some dry divinity on his reading desk, until the clock of the neighbouring church rang out the hour of twelve, when he would go soberly and gratefully to bed. On this night however, as soon as the cloth was taken away, he took up a candle and went into his business room. There he opened his safe, took from the most private part of it a document endorsed on the envelope as Dr. Jekyll’s Will and sat down with a clouded brow to study its contents. The will was holograph, for Mr. Utterson though he took charge of it now that it was made, had refused to lend the least assistance in the making of it; it provided not only that, in case of the decease of Henry Jekyll, M.D., D.C.L., L.L.D., F.R.S., etc., all his possessions were to pass into the hands of his “friend and benefactor Edward Hyde,” but that in case of Dr. Jekyll’s “disappearance or unexplained absence for any period exceeding three calendar months,” the said Edward Hyde should step into the said Henry Jekyll’s shoes without further delay and free from any burthen or obligation beyond the payment of a few small sums to the members of the doctor’s household. This document had long been the lawyer’s eyesore. It offended him both as a lawyer and as a lover of the sane and customary sides of life, to whom the fanciful was the immodest. And hitherto it was his ignorance of Mr. Hyde that had swelled his indignation; now, by a sudden turn, it was his knowledge. It was already bad enough when the name was but a name of which he could learn no more. It was worse when it began to be clothed upon with detestable attributes; and out of the shifting, insubstantial mists that had so long baffled his eye, there leaped up the sudden, definite presentment of a fiend."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[1]"
        "line_start": 571
        "source_sequence": 46
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-001"
    "translation_ja": "その晩アタスン氏は重い気持ちで独り住まいのわが家へ帰り、食卓についても食が進まなかった。日曜日の常なら、食事のあとは暖炉のそばに陣取り、読書台には何かしら無味乾燥な神学の書を一冊載せて、近所の教会の時計が十二時を打つまで過ごし、それから慎ましく感謝を胸に床につくのだった。ところが今夜は食卓布を下げるや、ろうそくを一本持って執務室へ行った。金庫を開け、いちばん奥の人目につかぬ場所から、封筒の表に「ジキル博士の遺言書」と記した書類を取り出すと、眉を曇らせてその中身を読み直した。遺言書は自筆だった。出来上がったものを預かりはしたが、作成には一切手を貸さぬとアタスン氏が断ったからである。医学博士・民法博士・法学博士・王立協会会員その他の肩書をもつヘンリー・ジキルが死亡した場合、全財産をその「友人にして恩人たるエドワード・ハイド」に譲るというだけではない。ジキル博士が「失踪し、または理由不明のまま暦の上で三か月を超えて不在となる」ときも、エドワード・ハイドはただちにヘンリー・ジキルの権利をそっくり引き継ぎ、博士の屋敷の者たちにわずかずつ金を渡すほかには、いかなる負担も義務も負わぬというのである。この書類はかねてから弁護士には目の上のこぶだった。法律家としても腹立たしかったし、分別ある世の習いを愛し、奇矯はすなわち慎みの欠如と考える一個の人間としても腹立たしかった。これまではハイド氏について何も知らないことが怒りに油を注いでいた。ところが今や一転して、知ったことが怒りの種になった。何一つ手がかりのない、ただの名前であったころでも十分に悪かった。そこにいくつもの忌まわしい性質が肉づけされてみると、なお悪かった。長いこと目をくらましてきた、とめどもなく揺れる形のない霧から、不意に、くっきりと一匹の悪鬼の姿が立ち現れたのである。"
    "translation_status": "reviewed"
  - "id": "c02-002"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I thought it was madness,” he said, as he replaced the obnoxious paper in the safe, “and now I begin to fear it is disgrace.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[2]"
        "line_start": 600
        "source_sequence": 47
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-002"
    "translation_ja": "「気が狂ったのかと思っていたが」と彼は忌まわしい書類を金庫に戻しながら言った。「今度は不名誉な事情があるのではないかと心配になってきた」"
    "translation_status": "reviewed"
  - "id": "c02-003"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that he blew out his candle, put on a greatcoat, and set forth in the direction of Cavendish Square, that citadel of medicine, where his friend, the great Dr. Lanyon, had his house and received his crowding patients. “If anyone knows, it will be Lanyon,” he had thought."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[3]"
        "line_start": 605
        "source_sequence": 48
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-003"
    "translation_ja": "ろうそくを吹き消し、外套を羽織って、医学の本丸キャヴェンディッシュ・スクエアへと向かった。高名な友人ラニョン博士がそこに屋敷を構え、押しかける患者を診ていたのである。「誰か知っているとすればラニョンだ」と考えたのだ。"
    "translation_status": "reviewed"
  - "id": "c02-004"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The solemn butler knew and welcomed him; he was subjected to no stage of delay, but ushered direct from the door to the dining-room where Dr. Lanyon sat alone over his wine. This was a hearty, healthy, dapper, red-faced gentleman, with a shock of hair prematurely white, and a boisterous and decided manner. At sight of Mr. Utterson, he sprang up from his chair and welcomed him with both hands. The geniality, as was the way of the man, was somewhat theatrical to the eye; but it reposed on genuine feeling. For these two were old friends, old mates both at school and college, both thorough respecters of themselves and of each other, and what does not always follow, men who thoroughly enjoyed each other’s company."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[4]"
        "line_start": 612
        "source_sequence": 49
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-004"
    "translation_ja": "謹厳な執事は顔を見知っていて、彼を歓迎した。どこでも待たされることなく、玄関からまっすぐ、ラニョン博士が独りぶどう酒を楽しんでいる食堂へ通された。博士は血色のよい赤ら顔で、頑健、快活、身なりはきちんとし、年のわりに早く白くなった髪がふさふさと茂り、所作は威勢がよく、きっぱりしていた。アタスン氏を見るなり椅子から跳ね上がり、両手を差し出して迎えた。その愛想のよさは、この人の常として、はたにはいささか芝居がかって見えたが、根は真情だった。二人は学校でも大学でも机を並べた古い友人で、どちらも自分自身と相手の双方を心から尊重し、しかも、尊敬には必ずしもついて回らないことだが、一緒に過ごす時間が心から楽しかったのである。"
    "translation_status": "reviewed"
  - "id": "c02-005"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "After a little rambling talk, the lawyer led up to the subject which so disagreeably preoccupied his mind."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[5]"
        "line_start": 625
        "source_sequence": 50
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-005"
    "translation_ja": "しばらくとりとめのない話をしてから、弁護士は厭でも頭から離れない一件へと話を向けた。"
    "translation_status": "reviewed"
  - "id": "c02-006"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I suppose, Lanyon,” said he, “you and I must be the two oldest friends that Henry Jekyll has?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[6]"
        "line_start": 630
        "source_sequence": 51
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-006"
    "translation_ja": "「ねえ、ラニョン」と彼は言った。「ヘンリー・ジキルの友達の中では、君と僕がいちばん古いつきあいだろうね？」"
    "translation_status": "reviewed"
  - "id": "c02-007"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I wish the friends were younger,” chuckled Dr. Lanyon. “But I suppose we are. And what of that? I see little of him now.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[7]"
        "line_start": 635
        "source_sequence": 52
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-007"
    "translation_ja": "「友達のほうも、もうちっと若けりゃいいが」とラニョン博士はくっくっと笑った。「まあ、そうだろう。それがどうした。今はあいつにはめったに会わんよ」"
    "translation_status": "reviewed"
  - "id": "c02-008"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Indeed?” said Utterson. “I thought you had a bond of common interest.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[8]"
        "line_start": 640
        "source_sequence": 53
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-008"
    "translation_ja": "「そうなのか」とアタスン。「共通の関心で結ばれているものと思っていたが」"
    "translation_status": "reviewed"
  - "id": "c02-009"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“We had,” was the reply. “But it is more than ten years since Henry Jekyll became too fanciful for me. He began to go wrong, wrong in mind; and though of course I continue to take an interest in him for old sake’s sake, as they say, I see and I have seen devilish little of the man. Such unscientific balderdash,” added the doctor, flushing suddenly purple, “would have estranged Damon and Pythias.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[9]"
        "line_start": 645
        "source_sequence": 54
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-009"
    "translation_ja": "「結ばれていたさ。しかしヘンリー・ジキルの突飛な考えに僕がついてゆけなくなって、もう十年以上だ。あいつは狂いだしたんだ、考え方が狂いだした。むろん、俗にいう昔のよしみで今もあいつのことは気にかけているが、ここずっと、まったくと言っていいほど会っちゃおらん。あんな非科学的なたわごとを聞かされてみろ」と博士の顔は急に紫に上気した。「無二の親友デイモンとピシアスだって仲違いするぞ」"
    "translation_status": "reviewed"
  - "id": "c02-010"
    "section_id": "chapter-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This little spirit of temper was somewhat of a relief to Mr. Utterson. “They have only differed on some point of science,” he thought; and being a man of no scientific passions (except in the matter of conveyancing), he even added: “It is nothing worse than that!” He gave his friend a few seconds to recover his composure, and then approached the question he had come to put. “Did you ever come across a protégé of his—one Hyde?” he asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[4]/p[10]"
        "line_start": 654
        "source_sequence": 55
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap02"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c02-010"
    "translation_ja": "このちょっとした剣幕に、アタスン氏はいくらか安堵した。「学問上の何かで意見が違っただけだ」と考えたのである。そして学問に燃えるところのない男だから（不動産譲渡の手続きは別だが）、「その程度で済んだのか！」とまで思った。友人が平静を取り戻すのをいくらか待ってから、ここへ来たわけの質問を切り出した。「あいつが目をかけているという、ハイドとかいう男に会ったことはないかね？」"
    "translation_status": "reviewed"

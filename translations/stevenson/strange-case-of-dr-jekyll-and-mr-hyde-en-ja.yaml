        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-003"
    "translation_ja": "よく観察する人なら、あまりお気に召さぬ話題だと察したかもしれない。だが博士は陽気に受け流した。「気の毒なアタスン」と彼は言った。「君もこんな依頼人を持ったのが運の尽きだね。僕の遺言書で君ほど悩まされた男は見たことがない。強いて言えば、あの頭の固い学者馬鹿のラニョンかな、僕の学説を異端と呼んで難儀していた。ああ、あいつがいいやつなのは知ってるよ。そんな顔をするな。まったく立派なやつで、もっとつきあいたいといつも思ってる。しかし、頭の固い学者馬鹿なのは動かんよ。無知なくせに声ばかり大きい学者馬鹿だ。ラニョンほど僕を失望させた人間はいない」"
    "translation_status": "reviewed"
  - "id": "c03-004"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You know I never approved of it,” pursued Utterson, ruthlessly disregarding the fresh topic."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[4]"
        "line_start": 1004
        "source_sequence": 100
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-004"
    "translation_ja": "「僕が初めから賛成しなかったのは承知だね」と、新たな話題を情け容赦なく無視してアタスンは続けた。"
    "translation_status": "reviewed"
  - "id": "c03-005"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“My will? Yes, certainly, I know that,” said the doctor, a trifle sharply. “You have told me so.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[5]"
        "line_start": 1009
        "source_sequence": 101
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-005"
    "translation_ja": "「遺言書のことか？　ああ、むろん承知だ」と博士は少し刺のある声で言った。「そう言われたからね」"
    "translation_status": "reviewed"
  - "id": "c03-006"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, I tell you so again,” continued the lawyer. “I have been learning something of young Hyde.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[6]"
        "line_start": 1014
        "source_sequence": 102
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-006"
    "translation_ja": "「では、もう一度言っておこう」と弁護士は続けた。「このところ若いハイドのことで少し耳に入ったことがある」"
    "translation_status": "reviewed"
  - "id": "c03-007"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The large handsome face of Dr. Jekyll grew pale to the very lips, and there came a blackness about his eyes. “I do not care to hear more,” said he. “This is a matter I thought we had agreed to drop.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[7]"
        "line_start": 1019
        "source_sequence": 103
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-007"
    "translation_ja": "ジキル博士の大きな端正な顔は唇まで血の気を失い、両の目の周りに暗い影がさした。「それ以上聞きたくはないね。この話はもうよそうと二人で決めたはずだが」"
    "translation_status": "reviewed"
  - "id": "c03-008"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What I heard was abominable,” said Utterson."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[8]"
        "line_start": 1025
        "source_sequence": 104
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-008"
    "translation_ja": "「僕が耳にしたのは忌まわしい話だった」とアタスンは言った。"
    "translation_status": "reviewed"
  - "id": "c03-009"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It can make no change. You do not understand my position,” returned the doctor, with a certain incoherency of manner. “I am painfully situated, Utterson; my position is a very strange—a very strange one. It is one of those affairs that cannot be mended by talking.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[9]"
        "line_start": 1029
        "source_sequence": 105
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-009"
    "translation_ja": "「それで何が変わるものか。君には僕の置かれた立場がわからないんだ」と博士はどこか取り乱した様子で答えた。「つらい立場にいるんだ、アタスン。僕の立場はじつに奇妙な、じつに奇妙なものなんだ。話をしたからといって片づくことじゃない」"
    "translation_status": "reviewed"
  - "id": "c03-010"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Jekyll,” said Utterson, “you know me: I am a man to be trusted. Make a clean breast of this in confidence; and I make no doubt I can get you out of it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[10]"
        "line_start": 1037
        "source_sequence": 106
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-010"
    "translation_ja": "「ジキル」とアタスンは言った。「僕がどんな男か君は知ってる。僕は秘密を守るよ。ここだけの話として、腹蔵なく打ち明けてくれ。そしたらきっと僕が君をその苦境から救い出してみせる」"
    "translation_status": "reviewed"
  - "id": "c03-011"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“My good Utterson,” said the doctor, “this is very good of you, this is downright good of you, and I cannot find words to thank you in. I believe you fully; I would trust you before any man alive, ay, before myself, if I could make the choice; but indeed it isn’t what you fancy; it is not as bad as that; and just to put your good heart at rest, I will tell you one thing: the moment I choose, I can be rid of Mr. Hyde. I give you my hand upon that; and I thank you again and again; and I will just add one little word, Utterson, that I’m sure you’ll take in good part: this is a private matter, and I beg of you to let it sleep.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[11]"
        "line_start": 1043
        "source_sequence": 107
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-011"
    "translation_ja": "「親愛なるアタスン」と博士は言った。「ありがたいよ、君はほんとうに親切だ。なんと言って礼をしたらいいかわからない。君をすっかり信じている。この世の誰よりも、選べるものなら僕自身よりも君を信用する。だが、じつのところ君の思っているようなことじゃないんだ。そんなにひどいことじゃない。心配してくれる君を安心させるために、これだけは言っておこう。僕はそうしようと思ったその瞬間に、ハイド氏と手を切れるんだ。ここに手を差し出して約束する。礼は何度言っても足りない。それで、あと一言だけ、アタスン、悪く取らないでくれると思うが、これは僕ひとりの問題だ。どうかこのままそっとしておいてくれたまえ」"
    "translation_status": "reviewed"
  - "id": "c03-012"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Utterson reflected a little, looking in the fire."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[12]"
        "line_start": 1055
        "source_sequence": 108
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-012"
    "translation_ja": "アタスンは火の中を見つめてしばらく考えた。"
    "translation_status": "reviewed"
  - "id": "c03-013"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I have no doubt you are perfectly right,” he said at last, getting to his feet."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[13]"
        "line_start": 1059
        "source_sequence": 109
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-013"
    "translation_ja": "「きっと君の言うとおりなのだろう」ととうとう彼は立ち上がって言った。"
    "translation_status": "reviewed"
  - "id": "c03-014"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, but since we have touched upon this business, and for the last time I hope,” continued the doctor, “there is one point I should like you to understand. I have really a very great interest in poor Hyde. I know you have seen him; he told me so; and I fear he was rude. But I do sincerely take a great, a very great interest in that young man; and if I am taken away, Utterson, I wish you to promise me that you will bear with him and get his rights for him. I think you would, if you knew all; and it would be a weight off my mind if you would promise.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[14]"
        "line_start": 1064
        "source_sequence": 110
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-014"
    "translation_ja": "「しかし、せっかくこの問題に触れたのだから、これきりにしたいが」と博士は続けた。「一点だけわかっておいてほしい。僕はほんとうに気の毒なハイドがひどく気にかかる。君が彼と会ったのは知っている。本人から聞いた。きっと失礼を働いたろう。だが僕は心底からあの若者を気にかけている。それも並大抵のことじゃない。僕がいなくなったら、アタスン、彼を大目に見て、彼の権利がちゃんと彼のものになるよう計らってほしいと、君に約束してもらいたい。ことの一切を知っていれば、君はそうしてくれると思う。約束してくれたら僕も胸の重荷が下りるのだが」"
    "translation_status": "reviewed"
  - "id": "c03-015"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I can’t pretend that I shall ever like him,” said the lawyer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[15]"
        "line_start": 1075
        "source_sequence": 111
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-015"
    "translation_ja": "「彼を好きになる日が来るとは、とても言えないね」と弁護士は言った。"
    "translation_status": "reviewed"
  - "id": "c03-016"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I don’t ask that,” pleaded Jekyll, laying his hand upon the other’s arm; “I only ask for justice; I only ask you to help him for my sake, when I am no longer here.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[16]"
        "line_start": 1080
        "source_sequence": 112
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-016"
    "translation_ja": "「それを頼んでいるんじゃない」とジキルは相手の腕に手を置いて訴えた。「公正にしてくれと頼んでいるだけだ。僕がもうここにいなくなったら、僕に免じて彼を助けてくれと頼んでいるだけだ」"
    "translation_status": "reviewed"
  - "id": "c03-017"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Utterson heaved an irrepressible sigh. “Well,” said he, “I promise.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[17]"
        "line_start": 1086
        "source_sequence": 113
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-017"
    "translation_ja": "アタスンは抑えきれずに大きなため息をついた。「よろしい」と言った。「約束するよ」"
    "translation_status": "reviewed"
  - "id": "c04-000"
    "section_id": "chapter-04"
    "kind": "heading"
    "origin": "source"
    "source_text": "THE CAREW MURDER CASE"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"

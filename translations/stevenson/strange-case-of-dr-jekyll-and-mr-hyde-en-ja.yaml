    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-001"
    "translation_ja": "私は十八――年に裕福な家に生まれ、そのうえすぐれた才に恵まれ、生来勤勉で、世の賢く善良な人々に尊敬されるのを好んだ。したがって、誰しもそう思ったろうが、名誉ある晴れやかな前途を約束するものは何一つ欠けていなかった。実際、私のいちばん悪い欠点も、気がはやって浮かれ騒ぎを好む性質ぐらいのものだった。それで幸福を得る人はいくらでもいるのに、私は世間で頭を高く上げ、人並み以上に重々しい顔をしていたいという強烈な望みと、それとを両立させにくかった。こうして私は楽しみを隠し、人がものを思う年頃になって、周囲を眺め、自分が世の中でどれだけ進みどんな地位についたかを見きわめ始めたころには、すでに深い二重生活に身を投じていた。私が犯した程度の放埒を勲章のように見せびらかす人も多かろう。だが高い目標を自らに掲げた私は、ほとんど病的な羞恥をもってそれらを見、それらを隠した。かくて私をこういう人間にしたのは、過ちが格別下劣だったことより、むしろ志がきびしい要求を課したことだった。それによって、人の二重の本性を二分し、また成り立たせている善と悪との領域は、大半の人におけるよりもなお深い溝によって私の中で隔てられた。そんな境遇で、私は宗教の根にあって、苦悩のもっとも尽きない泉の一つをなすこの生の厳しい法則を、深く、執拗に考えずにはいられなかった。かくも徹底して二つの顔を使い分けたとはいえ、私は偽善者では少しもなかった。どちらの私も本気だった。抑制を投げ捨てて恥ずべき行為に身を沈めたときの私が、白日のもと知を進め、悲しみや苦痛を和らげようと働いたとき以上に、ほんとうの私だったわけではない。たまたま私の科学研究がひたすら神秘と超越に向かったことが、わが内なる部分どうしの絶えざる戦いの自覚にもはね返って、これを強い光で照らした。日ごとに、私の精神の両側から、すなわち道徳の側からも知性の側からも、私は一つの真理に間断なく近づいた。その一端を発見したために、私はこれほど恐ろしい破滅を運命づけられた。人間とは真に一人なのではなく、真に二人なのである。二人と私が言うのは、自分の認識がそこを越えないからだ。別の人々があとに続き、同じ道で私を追い越してゆくだろう。そして、いつか人間とは多様で、相容れず、互いに独立した住民のなす一個の国家のようなものにすぎぬとわかるのではないか。私はそう推し量ってみる。私自身はわが生涯の性質上、必ずやただ一方向に、しかもただ一方向にしか進みえなかった。私が、人間は根から二重だと見きわめたのは、道徳の側から、しかもわが身においてだった。意識を戦場として争う二つの性質の、もしどちらか一方を私と呼んでよいなら、それは私が根底からその両方であるからにほかならぬと悟った。そしてかなり早くから、私の発見の道筋がそのような奇跡のほんの糸口をさし示すより前から、それら二つの要素を引き離すという考えを愛すべき白昼の夢として、喜んで心に住まわせることを覚えていた。それぞれを別々の人格に宿らせることができれば、と私は自分に言った。人生から耐えがたいものはことごとく取り除かれる。正しからぬ者は、清廉な片割れの志と悔恨から解放されて己の道を行ける。正しき者は、他人同然のこの悪の手に恥辱や悔悟へと陥れられることなく、喜びを見いだす善行を重ね、上りゆく道を確かな足取りで安全に進める。相容れぬ木切れがこうしてひと束に縛られ、苦しみにうめく意識の胎内で、両極にある双生児が絶えずもみ合わねばならぬことこそ、人類にかかった呪いだった。では、いかにして両者は引き離されたのか。"
    "translation_status": "reviewed"
  - "id": "c10-002"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was so far in my reflections when, as I have said, a side light began to shine upon the subject from the laboratory table. I began to perceive more deeply than it has ever yet been stated, the trembling immateriality, the mistlike transience, of this seemingly so solid body in which we walk attired. Certain agents I found to have the power to shake and pluck back that fleshly vestment, even as a wind might toss the curtains of a pavilion. For two good reasons, I will not enter deeply into this scientific branch of my confession. First, because I have been made to learn that the doom and burthen of our life is bound for ever on man’s shoulders, and when the attempt is made to cast it off, it but returns upon us with more unfamiliar and more awful pressure. Second, because, as my narrative will make, alas! too evident, my discoveries were incomplete. Enough then, that I not only recognised my natural body from the mere aura and effulgence of certain of the powers that made up my spirit, but managed to compound a drug by which these powers should be dethroned from their supremacy, and a second form and countenance substituted, none the less natural to me because they were the expression, and bore the stamp, of lower elements in my soul."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[2]"
        "line_start": 2864
        "source_sequence": 338
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-002"
    "translation_ja": "思索がここまで進んだとき、先に述べたとおり、実験台のほうから、この問題を別の角度から照らす光が差し始めた。これほど確かな実体に見え、われわれがまとって歩くこの肉体は、じつは震えるほど実体がなく、霧のようにはかない。今まで誰が言い表したよりも深く、それを見通すようになった。ある種の物質には、風が天幕の垂れ幕をあおるように、その肉の衣を震わせ、引き開く力があることを見いだした。もっともな理由が二つあって、この告白の科学に属する部分には深く立ち入らない。第一に、生の宿命と重荷とは永遠に人の肩に縛りつけられており、振り落とそうとすれば、かえって以前より馴染みがたく、以前より恐ろしい重さでのしかかってくると、私は思い知らされたからである。第二に、ああ、これからの話であまりにも明らかになるように、私の発見は不完全だったからである。ここではこう言えば足りる。私は、生来の体とは私の魂をなす諸力のうちのあるものが放つ気と光輝の現れにすぎないと認めるにとどまらず、それらの力を支配の座から降ろし、代わりに第二の姿と顔立ちをもたらす薬を調合しおおせた。その姿は私の魂の低い部分を表し、その刻印を帯びてはいても、最初の姿と少しも変わらず私にとって自然なものだった。"
    "translation_status": "reviewed"
  - "id": "c10-003"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I hesitated long before I put this theory to the test of practice. I knew well that I risked death; for any drug that so potently controlled and shook the very fortress of identity, might, by the least scruple of an overdose or at the least inopportunity in the moment of exhibition, utterly blot out that immaterial tabernacle which I looked to it to change. But the temptation of a discovery so singular and profound at last overcame the suggestions of alarm. I had long since prepared my tincture; I purchased at once, from a firm of wholesale chemists, a large quantity of a particular salt which I knew, from my experiments, to be the last ingredient required; and late one accursed night, I compounded the elements, watched them boil and smoke together in the glass, and when the ebullition had subsided, with a strong glow of courage, drank off the potion."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[3]"
        "line_start": 2884
        "source_sequence": 339
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-003"
    "translation_ja": "この理論を実地に試すまでには長くためらった。命の危険を冒すのは承知していた。己という存在の砦そのものをこれほど強力に支配し揺さぶる薬は、ほんの一分量でも過ぎたり、投与の時をわずかに誤ったりすれば、私が変化させようとするこの実体なき幕屋を一挙に消し去りかねなかったからだ。だがかくも異様で深遠な発見の誘惑は、ついに不安の囁きに打ち勝った。チンキはとうに用意してあった。実験から最後に必要な成分だとわかっていたある特殊な塩類を、ただちに薬種問屋から大量に購入した。そして呪わしいある夜更け、成分を合わせてグラスの中で煮え立ち、煙を上げるのを見守った。泡立ちが収まると、勇気が熱くわき返る中、一息に薬をあおった。"
    "translation_status": "reviewed"
  - "id": "c10-004"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The most racking pangs succeeded: a grinding in the bones, deadly nausea, and a horror of the spirit that cannot be exceeded at the hour of birth or death. Then these agonies began swiftly to subside, and I came to myself as if out of a great sickness. There was something strange in my sensations, something indescribably new and, from its very novelty, incredibly sweet. I felt younger, lighter, happier in body; within I was conscious of a heady recklessness, a current of disordered sensual images running like a millrace in my fancy, a solution of the bonds of obligation, an unknown but not an innocent freedom of the soul. I knew myself, at the first breath of this new life, to be more wicked, tenfold more wicked, sold a slave to my original evil; and the thought, in that moment, braced and delighted me like wine. I stretched out my hands, exulting in the freshness of these sensations; and in the act, I was suddenly aware that I had lost in stature."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[4]"
        "line_start": 2899
        "source_sequence": 340
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap10"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-004"
    "translation_ja": "次に襲ったのは引き裂かれるような激痛だった。骨がすり潰される感じ、死ぬかと思う吐き気、誕生のときも死のときもこれ以上ではありえぬ霊の恐怖。やがてこの苦悶は急速に引き始め、私は大病からさめたかのようにわれに返った。自分の感覚には何か奇妙な、言いようもなく新しく、その新しさゆえに信じがたいほど甘美なものがあった。体は若く軽く、幸福になったと感じた。内には酔いのような無鉄砲があり、取り乱れた官能の像が水車を回す水勢のように想像の中を駆け抜け、義務の縛めは溶け、未知の、だが無垢ではない魂の自由があった。この新たな生の最初のひと息で、自分は以前より邪悪に、十倍も邪悪になり、生来の悪に奴隷として売り渡されたのだと悟った。そしてその瞬間、その考えは酒のように私を奮い立たせ、喜ばせた。この感覚の新鮮さに歓喜しつつ両手を差し伸べた。そうするうち不意に、身の丈が縮んだことに気づいた。"
    "translation_status": "reviewed"
  - "id": "c10-005"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was no mirror, at that date, in my room; that which stands beside me as I write, was brought there later on and for the very purpose of these transformations. The night however, was far gone into the morning—the morning, black as it was, was nearly ripe for the conception of the day—the inmates of my house were locked in the most rigorous hours of slumber; and I determined, flushed as I was with hope and triumph, to venture in my new shape as far as to my bedroom. I crossed the yard, wherein the constellations looked down upon me, I could have thought, with wonder, the first creature of that sort that their unsleeping vigilance had yet disclosed to them; I stole through the corridors, a stranger in my own house; and coming to my room, I saw for the first time the appearance of Edward Hyde."
    "source_languages":
      - "en"
    "source_locations":

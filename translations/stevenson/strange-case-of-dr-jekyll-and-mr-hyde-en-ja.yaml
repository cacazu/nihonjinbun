    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-004"
    "translation_ja": "ある角から二軒目、東へ向かって左手で家並みが途切れ、そこに中庭へ通じる入口があった。まさにその場所に、一棟の不吉な建物が通りへ破風を突き出していた。二階建てで、窓はひとつも見えない。一階に扉が一枚、二階には色の変わった壁が、目のない額のようにあるだけだった。どこを取っても、長らくみじめに打ち捨てられてきたしるしがあった。呼び鈴もノッカーもない扉は、塗りがふくれ、しみだらけだった。浮浪者がそのくぼみにのっそり入りこみ、鏡板でマッチをすった。子どもは段で店屋ごっこをし、学童が飾り縁で小刀の切れ味を試した。ほとんど一世代のあいだ、そうした行きずりの客を追い払う者も、その狼藉のあとを直す者も、現れなかった。"
    "translation_status": "reviewed"

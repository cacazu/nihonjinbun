    "translation_ja": "この描写を引き延ばしても無益だし、恐ろしいほど時間が尽きかけている。かつて誰もこれほどの責め苦を受けたことはない。それで足りよう。それでも、こうした苦しみにさえ慣れがもたらしたものはあった。いや、和らぎではない。ある種の心の鈍さ、絶望に身を任せるような諦めだった。今や襲ってきて、私を自分自身の顔と本性から決定的に切り離した最後の災厄さえなければ、刑罰は何年も続いたかもしれぬ。最初の実験のときから一度も買い足さずにきたあの塩類の蓄えが乏しくなりだした。新しい品を取り寄せて薬を合わせた。泡立ちが起き、最初の色の変化も起きたが、二度目の変化は起きなかった。飲んでも効き目はなかった。私がいかにロンドンじゅうをくまなく捜させたかは、プールから聞くだろう。すべては無駄だった。今は確信している。初めに仕入れた品が不純だったのだ。そして、あの薬に効力を与えていたのは、その正体の知れぬ不純物だったのだ。"
    "translation_status": "reviewed"
  - "id": "c10-028"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "About a week has passed, and I am now finishing this statement under the influence of the last of the old powders. This, then, is the last time, short of a miracle, that Henry Jekyll can think his own thoughts or see his own face (now how sadly altered!) in the glass. Nor must I delay too long to bring my writing to an end; for if my narrative has hitherto escaped destruction, it has been by a combination of great prudence and great good luck. Should the throes of change take me in the act of writing it, Hyde will tear it in pieces; but if some time shall have elapsed after I have laid it by, his wonderful selfishness and circumscription to the moment will probably save it once again from the action of his ape-like spite. And indeed the doom that is closing on us both has already changed and crushed him. Half an hour from now, when I shall again and forever reindue that hated personality, I know how I shall sit shuddering and weeping in my chair, or continue, with the most strained and fearstruck ecstasy of listening, to pace up and down this room (my last earthly refuge) and give ear to every sound of menace. Will Hyde die upon the scaffold? or will he find courage to release himself at the last moment? God knows; I am careless; this is my true hour of death, and what is to follow concerns another than myself. Here then, as I lay down the pen and proceed to seal up my confession, I bring the life of that unhappy Henry Jekyll to an end."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"

    "translation_ja": "ラニョン博士の一件"
    "translation_status": "reviewed"
  - "id": "c06-001"
    "section_id": "chapter-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Time ran on; thousands of pounds were offered in reward, for the death of Sir Danvers was resented as a public injury; but Mr. Hyde had disappeared out of the ken of the police as though he had never existed. Much of his past was unearthed, indeed, and all disreputable: tales came out of the man’s cruelty, at once so callous and violent; of his vile life, of his strange associates, of the hatred that seemed to have surrounded his career; but of his present whereabouts, not a whisper. From the time he had left the house in Soho on the morning of the murder, he was simply blotted out; and gradually, as time drew on, Mr. Utterson began to recover from the hotness of his alarm, and to grow more at quiet with himself. The death of Sir Danvers was, to his way of thinking, more than paid for by the disappearance of Mr. Hyde. Now that that evil influence had been withdrawn, a new life began for Dr. Jekyll. He came out of his seclusion, renewed relations with his friends, became once more their familiar guest and entertainer; and whilst he had always been known for charities, he was now no less distinguished for religion. He was busy, he was much in the open air, he did good; his face seemed to open and brighten, as if with an inward consciousness of service; and for more than two months, the doctor was at peace."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[8]/p[1]"
        "line_start": 1551
        "source_sequence": 173
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap06"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c06-001"
    "translation_ja": "時がたった。サー・ダンヴァーズの死に世間は自分たちが傷つけられたかのように憤り、数千ポンドの懸賞金がかかった。だがハイド氏は、もともと存在しなかったかのように警察の目の届くところから消えていた。なるほど、過去については多くが掘り起こされ、ことごとく芳しくなかった。冷酷なうえに粗暴な残虐さの話、おぞましい暮らしぶり、奇妙なつきあい、どこへ行っても身のまわりについて回ったらしい憎しみの話が出てきた。しかし現在の居場所となると、囁き一つ聞こえない。殺害のあった朝、ソーホーの家を出てからというもの、彼はまったくかき消されていた。時の過ぎるにつれ、アタスン氏は燃えさかるような不安からだんだん立ち直り、自分の心とも少しずつ折り合いがついてきた。彼の考えでは、ハイド氏が消えたことはサー・ダンヴァーズの死を償って余りがあった。悪しき感化が取り除かれると、ジキル博士には新しい暮らしが始まった。引きこもりをやめ、友人との交わりを新たにし、かつてのように親しく訪ねたり招いたりした。これまでも慈善で知られていたが、今度は信仰の点でもそれに劣らず人目を引いた。よく働き、戸外によく出、人のために尽くした。自分が役に立っていることを胸の内で感じているかのように、顔は晴れ晴れと明るくなった。二か月余り、博士には平安があった。"
    "translation_status": "reviewed"
  - "id": "c06-002"
    "section_id": "chapter-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On the 8th of January Utterson had dined at the doctor’s with a small party; Lanyon had been there; and the face of the host had looked from one to the other as in the old days when the trio were inseparable friends. On the 12th, and again on the 14th, the door was shut against the lawyer. “The doctor was confined to the house,” Poole said, “and saw no one.” On the 15th, he tried again, and was again refused; and having now been used for the last two months to see his friend almost daily, he found this return of solitude to weigh upon his spirits. The fifth night he had in Guest to dine with him; and the sixth he betook himself to Dr. Lanyon’s."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[8]/p[2]"
        "line_start": 1572
        "source_sequence": 174
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"

    "translation_ja": "朝食のあと、冷たい空気を喜んで胸に吸いながら中庭をゆっくり渡っていると、変身を告げるあの言い表しようのない感覚にまた襲われた。ようやく私室に逃げ込むだけのいとまがあって、私はまたハイドの情念に荒れ狂い、凍りついていた。このときは私を私に戻すのに倍の量が要った。ああ、その六時間後、悲しく火を見つめて座っていると、苦痛が戻り、薬を再び投じざるをえなかった。要するにその日以後、体操に似た非常な努力を払い、しかも薬がじかに効いている間だけ、私はジキルの顔をまとえたらしい。昼も夜も時を選ばず予兆の身震いが来た。とりわけ、眠った場合には、椅子でほんの一瞬まどろんだだけでも、目覚めると必ずハイドだった。絶えず頭上に迫る破滅の圧迫と、自分に課した、かつては人の身にこれほどまで可能とは思わなかった不眠のせいで、私自身の姿にある私は熱病に食い尽くされて中が空洞になった生き物となった。体も心もぐったり弱り、ただ一つの思い、もう一人の自分への戦慄に占められていた。ところが眠るか薬効が薄れるかすると、ほとんど境目を経ず（変身の苦痛は日に日にはっきりしなくなっていた）、恐怖の光景であふれる想像力、理由のない憎悪に煮え立つ魂、生命の荒れ狂う力を容れるには足りないと見える肉体へと一足飛びに移った。ジキルが病み衰えるにつれて、ハイドの力は増したようだった。いまや二人を分かつ憎しみの強さは、確かに両側で等しかった。ジキルにおいてそれは生の本能によるものだった。意識の現象の一部を共にし、死という遺産をともに継ぐあの生き物の歪みを、今や彼は余すところなく見た。この共通のつながりそのものが苦悩のいちばん痛ましいところだったが、それを別にすれば、ジキルにとってハイドは、どれほど生気に満ちていようと、地獄のものというだけでなく、いわば無生物だった。衝撃はそこにあった。地獄の穴の泥が叫び声、人語を発しているように見えたこと。形のない塵が両腕を振りまわして罪を犯したこと。死んでいて姿もないものが、生きるものの働きを奪ったこと。さらにまた、反旗を翻したその恐怖が妻より近く、片目より近く彼に結びつき、肉の檻に横たわって、つぶやく声が聞こえ、生まれ出ようともがくのが感じられたこと。そして力の衰える時ごとに、また安んじて眠るすきに彼に打ち勝ち、彼を生の座から追放したことだった。ハイドがジキルを憎む気持ちは別の種類だった。絞首台への恐怖に駆られ、絶えず一時の自殺をして、一人の人間ではなくその一部分という従属した地位に戻らねばならなかった。彼はその必要をいとい、ジキルが今沈んでいる落胆をいとい、自分が嫌われていることを恨んだ。こうして猿じみた悪戯を私に仕掛けた。私の蔵書の頁に私の筆跡で冒瀆の言葉をなぐり書きし、手紙を焼き、父の肖像を壊した。じつに、死を恐れさえしなかったら、私を破滅に巻き込むためとうの昔にわが身を滅ぼしていたろう。だが生にしがみつく彼の心は驚くばかりだ。さらに言おう。彼を考えるだけで吐き気がし、凍りつく私でさえ、その執着の卑屈さと激しさを思い返し、私が自殺によって彼を断ち切る力を持つのを彼がどれほど恐れるか知ってみると、胸の内に憐れみがわくのである。"
    "translation_status": "reviewed"
  - "id": "c10-027"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It is useless, and the time awfully fails me, to prolong this description; no one has ever suffered such torments, let that suffice; and yet even to these, habit brought—no, not alleviation—but a certain callousness of soul, a certain acquiescence of despair; and my punishment might have gone on for years, but for the last calamity which has now fallen, and which has finally severed me from my own face and nature. My provision of the salt, which had never been renewed since the date of the first experiment, began to run low. I sent out for a fresh supply and mixed the draught; the ebullition followed, and the first change of colour, not the second; I drank it and it was without efficiency. You will learn from Poole how I have had London ransacked; it was in vain; and I am now persuaded that my first supply was impure, and that it was that unknown impurity which lent efficacy to the draught."
    "source_languages":
      - "en"
    "source_locations":

        "source_sequence": 178
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap06"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c06-006"
    "translation_ja": "だがラニョンの顔色が変わり、彼は震える手を上げた。「もうジキル博士には会いたくもない。あの人の話も聞きたくない」と大きな、定まらない声で言った。「あの人とはきっぱり縁を切った。僕にとって死んだも同然の人間のことには、どうか触れないでもらいたい」"
    "translation_status": "reviewed"
  - "id": "c06-007"
    "section_id": "chapter-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Tut, tut!” said Mr. Utterson; and then after a considerable pause, “Can’t I do anything?” he inquired. “We are three very old friends, Lanyon; we shall not live to make others.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[8]/p[7]"

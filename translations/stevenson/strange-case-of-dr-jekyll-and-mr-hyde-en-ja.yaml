        "original_unit_id": "c06-003"
    "translation_ja": "そこでは少なくとも門前払いはされなかった。だが通されてみると、博士の様変わりに衝撃を受けた。顔には、誰の目にも読める字で死の宣告が記されていた。血色のよかった人は青ざめ、肉は落ち、髪は目に見えて薄くなり、老け込んでいた。けれど弁護士の注意をとらえたのは、急速な肉体の衰えのしるしというよりも、何か心の奥に深く根を張った恐怖を物語るような、その目つき、その物腰だった。博士が死を恐れるとは思いにくかったが、アタスンはやはりそうではないかと疑いかけた。「そうだ。あれは医者だ。自分の体のことはわかっているはずだし、もはや余命幾ばくもないこともわかっている。それを知ってしまったことに耐えられんのだ」。ところがアタスンが顔色の悪いのを気遣うと、ラニョンはきわめて確固とした様子で、自分は死を宣告された人間だと言った。"
    "translation_status": "reviewed"
  - "id": "c06-004"
    "section_id": "chapter-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I have had a shock,” he said, “and I shall never recover. It is a question of weeks. Well, life has been pleasant; I liked it; yes, sir, I used to like it. I sometimes think if we knew all, we should be more glad to get away.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"

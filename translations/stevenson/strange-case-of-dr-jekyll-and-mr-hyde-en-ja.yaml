    "translation_ja": "そこで服をできる限り整え、通りかかった二輪辻馬車を呼び、たまたま名を覚えていたポートランド街のホテルへ乗りつけた。私の姿を見て（衣服の覆う運命がどれほど悲劇的でも、その姿はまことに滑稽だった）、御者は笑いをこらえきれなかった。悪魔めいた激怒のひと吹きに駆られて私が歯をむき、噛み鳴らすと、笑みが相手の顔からしぼんだ。彼にとって幸いだったし、私にとってはいっそう幸いだった。もう一瞬あれば、確実に御者台から引きずり下ろしていたからだ。宿へ入る際、私はおそろしく険しい顔であたりを見まわし、従業員たちを震え上がらせた。私の前では誰一人目くばせさえせず、ひたすら腰を低くして注文を聞き、個室へ案内し、筆記具を持ってきた。命の危険にあるハイドは私にとって未知の生き物だった。度外れた怒りにわななき、今にも人を殺しかねないほど張りつめ、他人に痛みを加えたくてならなかった。だがその生き物には知恵が回った。大変な意志の力で憤怒を押さえ、重要な手紙を二通、ラニョンとプールに一通ずつしたためた。投函の確実な証拠が手に入るよう、書留にせよと指図して出させた。それから彼は一日じゅう個室の火のそばに座り、爪を噛んだ。そこで恐怖だけを相手にひとり食事を取り、給仕は彼の視線に目に見えてすくみ上がった。すっかり夜になると箱馬車の片隅に身を収めてそこを出て、町の通りをあちらこちら走らせた。「彼」と私は言う。「私」とは言えない。あの地獄の子に人間らしいものは何もなかった。恐れと憎しみしかその内に生きてはいなかった。とうとう御者が怪しみ始めたと思い、馬車を返し、寸法の合わぬ服で人目を引く格好のまま夜の通行人の間に徒歩で出ると、二つの卑しい情念は体内で嵐のように荒れた。恐怖に追われて早足になり、ひとりぶつぶつしゃべり、人気の少ない大通りをこそこそと抜け、十二時まであと何分かと数えた。一度、女が話しかけた。たしか、マッチを一箱売ろうとしたのだと思う。彼はその顔を殴った。女は逃げた。"
    "translation_status": "reviewed"
  - "id": "c10-025"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When I came to myself at Lanyon’s, the horror of my old friend perhaps affected me somewhat: I do not know; it was at least but a drop in the sea to the abhorrence with which I looked back upon these hours. A change had come over me. It was no longer the fear of the gallows, it was the horror of being Hyde that racked me. I received Lanyon’s condemnation partly in a dream; it was partly in a dream that I came home to my own house and got into bed. I slept after the prostration of the day, with a stringent and profound slumber which not even the nightmares that wrung me could avail to break. I awoke in the morning shaken, weakened, but refreshed. I still hated and feared the thought of the brute that slept within me, and I had not of course forgotten the appalling dangers of the day before; but I was once more at home, in my own house and close to my drugs; and gratitude for my escape shone so strong in my soul that it almost rivalled the brightness of hope."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"

    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c01-003"
    "translation_ja": "ある日のそうした散歩の途中、二人はたまたまロンドンのにぎやかな一画にある脇通りに入った。短い、いわゆる静かな通りで、平日には商売がひじょうに繁盛していた。住民はみな羽振りがよいらしく、互いに負けじといっそうの繁盛を夢見て、もうけの余りをおめかしにつぎこんでいた。そのため店先は、にっこりした女店員が並んでいるように、さあどうぞと客を誘う顔つきで通りに軒を連ねていた。派手な魅力を少しばかり隠し、人通りがぐっとまばらになる日曜日でさえ、その通りはくすんだ周囲から、森の中の火のように明るく浮かびあがっていた。塗りたてのよろい戸、磨きこんだ真鍮、なにもかもの清潔さと華やぎが、通行人の目をたちまちとらえて楽しませた。"
    "translation_status": "reviewed"
  - "id": "c01-004"
    "section_id": "chapter-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Two doors from one corner, on the left hand going east the line was broken by the entry of a court; and just at that point a certain sinister block of building thrust forward its gable on the street. It was two storeys high; showed no window, nothing but a door on the lower storey and a blind forehead of discoloured wall on the upper; and bore in every feature, the marks of prolonged and sordid negligence. The door, which was equipped with neither bell nor knocker, was blistered and distained. Tramps slouched into the recess and struck matches on the panels; children kept shop upon the steps; the schoolboy had tried his knife on the mouldings; and for close on a generation, no one had appeared to drive away these random visitors or to repair their ravages."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"

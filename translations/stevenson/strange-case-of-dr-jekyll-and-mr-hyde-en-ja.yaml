    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c10-020"
    "translation_ja": "翌日、殺人は人知れずには終わらず、ハイドの罪は世間に知れわたり、犠牲者は人望篤い人物だったという知らせが来た。犯罪であるばかりか、悲劇的な愚行だったのだ。それを知って私は喜んだと思う。こうして絞首台の恐怖が、わがうちの善い衝動の支えとなり、守りとなるのが嬉しかったのだと思う。今やジキルは私の逃れの町だった。ハイドが一瞬でも顔をのぞかせれば、あらゆる人の手が上がり、彼を捕らえ、殺したろう。"
    "translation_status": "reviewed"
  - "id": "c10-021"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I resolved in my future conduct to redeem the past; and I can say with honesty that my resolve was fruitful of some good. You know yourself how earnestly, in the last months of the last year, I laboured to relieve suffering; you know that much was done for others, and that the days passed quietly, almost happily for myself. Nor can I truly say that I wearied of this beneficent and innocent life; I think instead that I daily enjoyed it more completely; but I was still cursed with my duality of purpose; and as the first edge of my penitence wore off, the lower side of me, so long indulged, so recently chained down, began to growl for licence. Not that I dreamed of resuscitating Hyde; the bare idea of that would startle me to frenzy: no, it was in my own person that I was once more tempted to trifle with my conscience; and it was as an ordinary secret sinner that I at last fell before the assaults of temptation."
    "source_languages":
      - "en"

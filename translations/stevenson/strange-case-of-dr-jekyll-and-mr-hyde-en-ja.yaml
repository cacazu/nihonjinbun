    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c06-007"
    "translation_ja": "「おい、おい」とアタスン氏は言った。それからずいぶん間を置いて尋ねた。「僕にできることはないか。僕たち三人はじつに長いつきあいだ、ラニョン。生きているうちに、もうこんな友達を作る暇はないよ」"
    "translation_status": "reviewed"
  - "id": "c06-008"
    "section_id": "chapter-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Nothing can be done,” returned Lanyon; “ask himself.”"
    "source_languages":

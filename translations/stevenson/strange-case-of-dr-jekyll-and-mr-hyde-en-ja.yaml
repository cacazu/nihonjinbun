  - "id": "c03-001"
    "section_id": "chapter-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A fortnight later, by excellent good fortune, the doctor gave one of his pleasant dinners to some five or six old cronies, all intelligent, reputable men and all judges of good wine; and Mr. Utterson so contrived that he remained behind after the others had departed. This was no new arrangement, but a thing that had befallen many scores of times. Where Utterson was liked, he was liked well. Hosts loved to detain the dry lawyer, when the light-hearted and loose-tongued had already their foot on the threshold; they liked to sit a while in his unobtrusive company, practising for solitude, sobering their minds in the man’s rich silence after the expense and strain of gaiety. To this rule, Dr. Jekyll was no exception; and as he now sat on the opposite side of the fire—a large, well-made, smooth-faced man of fifty, with something of a slyish cast perhaps, but every mark of capacity and kindness—you could see by his looks that he cherished for Mr. Utterson a sincere and warm affection."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[5]/p[1]"
        "line_start": 971
        "source_sequence": 97
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap03"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c03-001"
    "translation_ja": "二週間後、まことに都合よく、博士はいつもの楽しい晩餐の席に昔なじみの友人五、六人を招いた。皆、もののわかった世評のよい紳士で、ぶどう酒の味もわかった。アタスン氏はうまく取り計らい、他の客をみな先に帰して自分だけあとに残った。別段新しい工夫ではなく、何十度となくあったことだ。アタスンは、好かれる先では深く好かれた。気楽に口軽くしゃべる客の足がもう敷居にかかっているころになると、主人たちはこの味も素っ気もない弁護士を引き留めたがった。出しゃばらない彼としばし腰を落ち着け、やがて来る独りの時に身をならし、陽気にふるまうのに力を使い気を張ったあと、その豊かな沈黙に心を鎮めるのが好きだった。ジキル博士も例外ではない。暖炉を挟んで向こうに腰かけた博士は五十の男盛り、大柄で均整がとれ、なめらかな顔には少しばかり抜け目のなさそうなところもあったが、有能さと親切さの刻印があらゆるところにあった。その表情からは、アタスン氏に対する心からの温かい愛情が見て取れた。"
    "translation_status": "reviewed"
  - "id": "c03-002"

      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-002"
    "translation_ja": "気がついて警察を呼んだときは二時だった。人殺しはとうに立ち去り、小路の真ん中には犠牲者が信じがたいほど無惨な姿で横たわっていた。凶行に使われた杖は、珍しい、ひどく粘りのある重い材でできていたのに、この無分別な残虐さに耐えかねて真ん中から折れ、ささくれた片割れがすぐそばの側溝へころがっていた。残りの半分はまぎれもなく犯人が持ち去ったのだろう。被害者の身からは財布と金時計が出てきた。名刺も書類もなかったが、たった一通、封をして切手を貼った、おそらく投函しに行く途中だったと思われる手紙があり、宛先はアタスン氏の住所氏名だった。"
    "translation_status": "reviewed"
  - "id": "c04-003"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This was brought to the lawyer the next morning, before he was out of bed; and he had no sooner seen it and been told the circumstances, than he shot out a solemn lip. “I shall say nothing till I have seen the body,” said he; “this may be very serious. Have the kindness to wait while I dress.” And with the same grave countenance he hurried through his breakfast and drove to the police station, whither the body had been carried. As soon as he came into the cell, he nodded."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[3]"
        "line_start": 1146
        "source_sequence": 117
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-003"
    "translation_ja": "翌朝、手紙はまだ床の中にいた弁護士のもとへ届けられた。一目見るなり事情を聞いた彼は、厳しい顔で唇を突き出した。「ご遺体を見るまで何も申し上げません」と言った。「きわめて重大なことかもしれません。着替えをするまで待っていただけますか」。同じ険しい面持ちで朝食をかきこみ、遺体の運ばれた警察署へ馬車で向かった。留置場に入るなり、彼はうなずいた。"
    "translation_status": "reviewed"
  - "id": "c04-004"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes,” said he, “I recognise him. I am sorry to say that this is Sir Danvers Carew.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[4]"
        "line_start": 1156
        "source_sequence": 118
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-004"
    "translation_ja": "「ええ」と彼は言った。「存じています。残念ながら、この方はサー・ダンヴァーズ・カルーです」"
    "translation_status": "reviewed"
  - "id": "c04-005"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Good God, sir,” exclaimed the officer, “is it possible?” And the next moment his eye lighted up with professional ambition. “This will make a deal of noise,” he said. “And perhaps you can help us to the man.” And he briefly narrated what the maid had seen, and showed the broken stick."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[5]"
        "line_start": 1161
        "source_sequence": 119
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-005"
    "translation_ja": "「なんと、本当ですか、先生！」と警官は叫んだ。そして次の瞬間、その目には職業上の野心が輝いた。「こいつは大騒ぎになりますな。それに先生なら、犯人にたどり着く手助けをしてくださるかもしれない」。そう言って女中が見たことをかいつまんで話し、折れた杖を見せた。"
    "translation_status": "reviewed"
  - "id": "c04-006"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Utterson had already quailed at the name of Hyde; but when the stick was laid before him, he could doubt no longer; broken and battered as it was, he recognised it for one that he had himself presented many years before to Henry Jekyll."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[6]"
        "line_start": 1169
        "source_sequence": 120
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-006"
    "translation_ja": "アタスン氏はハイドの名が出た時点でひるんでいたが、杖を目の前に出されては、もう疑いようがなかった。折れ、傷だらけになってはいても、ずっと以前に自分がヘンリー・ジキルに贈った杖と見て取れた。"
    "translation_status": "reviewed"
  - "id": "c04-007"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Is this Mr. Hyde a person of small stature?” he inquired."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[7]"
        "line_start": 1176
        "source_sequence": 121
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-007"
    "translation_ja": "「そのハイドという人は小柄な男ですか」と彼は尋ねた。"
    "translation_status": "reviewed"
  - "id": "c04-008"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Particularly small and particularly wicked-looking, is what the maid calls him,” said the officer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[8]"
        "line_start": 1180
        "source_sequence": 122
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-008"
    "translation_ja": "「飛び抜けてちっぽけで、飛び抜けて悪党面だとは、あの女中の言い草です」と警官は答えた。"
    "translation_status": "reviewed"
  - "id": "c04-009"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Utterson reflected; and then, raising his head, “If you will come with me in my cab,” he said, “I think I can take you to his house.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[9]"
        "line_start": 1185
        "source_sequence": 123
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-009"
    "translation_ja": "アタスン氏は考え込んだ。それから顔を上げて言った。「私の馬車に同乗してくだされば、その男の家へご案内できると思います」"
    "translation_status": "reviewed"
  - "id": "c04-010"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was by this time about nine in the morning, and the first fog of the season. A great chocolate-coloured pall lowered over heaven, but the wind was continually charging and routing these embattled vapours; so that as the cab crawled from street to street, Mr. Utterson beheld a marvelous number of degrees and hues of twilight; for here it would be dark like the back-end of evening; and there would be a glow of a rich, lurid brown, like the light of some strange conflagration; and here, for a moment, the fog would be quite broken up, and a haggard shaft of daylight would glance in between the swirling wreaths. The dismal quarter of Soho seen under these changing glimpses, with its muddy ways, and slatternly passengers, and its lamps, which had never been extinguished or had been kindled afresh to combat this mournful reinvasion of darkness, seemed, in the lawyer’s eyes, like a district of some city in a nightmare. The thoughts of his mind, besides, were of the gloomiest dye; and when he glanced at the companion of his drive, he was conscious of some touch of that terror of the law and the law’s officers, which may at times assail the most honest."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[10]"
        "line_start": 1191
        "source_sequence": 124
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-010"
    "translation_ja": "時刻はもう朝の九時ごろだった。今季初めての霧だった。チョコレート色の巨大な喪の覆いが空に低く垂れていたが、風が引きも切らず、陣を張った霧に襲いかかってはそれを蹴散らした。馬車が通りから通りへ這うように進むにつれ、アタスン氏は驚くほど多くの薄明の濃淡と色合いを見た。ここでは暮れきった夕方のように暗く、あそこでは何か奇妙な大火の明かりかと思う怪しく濃い褐色が燃え、別の場所では霧が一瞬すっかりちぎれ、渦巻く輪の間に痩せた日差しがひと筋さっと差し込む。移ろう光にちらちら見える陰気なソーホーの一帯、ぬかるんだ道とだらしない身なりの通行人、消されずにいたのか、悲しくもふたたび押し寄せた闇と闘うため新たに点じられたのか、その街灯までもが、弁護士の目には悪夢の中の都の一角のように映った。おまけに胸に浮かぶ考えはこの上なく暗い色に染まっていた。同じ馬車に乗った相手にちらりと目をやると、どれほど潔白な人にも時として襲いかかる、法とその執行者に対する一種の恐れを自分もわずかに感じているのがわかった。"
    "translation_status": "reviewed"
  - "id": "c04-011"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As the cab drew up before the address indicated, the fog lifted a little and showed him a dingy street, a gin palace, a low French eating house, a shop for the retail of penny numbers and twopenny salads, many ragged children huddled in the doorways, and many women of many different nationalities passing out, key in hand, to have a morning glass; and the next moment the fog settled down again upon that part, as brown as umber, and cut him off from his blackguardly surroundings. This was the home of Henry Jekyll’s favourite; of a man who was heir to a quarter of a million sterling."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[11]"
        "line_start": 1210
        "source_sequence": 125
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-011"
    "translation_ja": "教えられた番地に馬車が止まると、霧が少し上がった。薄汚れた通り、派手なジン酒場、安手のフランス料理店、一ペニーの分冊ものと二ペンスのサラダを小売りする店、戸口という戸口に固まったぼろを着た大勢の子ども、鍵を手に朝の一杯をひっかけに家から出てくる、国籍もさまざまな大勢の女が見えた。次の瞬間にはその一帯にまた暗褐色の霧が降り、周囲のさもしい景色を彼から切り離した。ここがヘンリー・ジキルの寵児のすみか、二十五万ポンドの遺産を継ぐ男の家だった。"
    "translation_status": "reviewed"
  - "id": "c04-012"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "An ivory-faced and silvery-haired old woman opened the door. She had an evil face, smoothed by hypocrisy: but her manners were excellent. Yes, she said, this was Mr. Hyde’s, but he was not at home; he had been in that night very late, but he had gone away again in less than an hour; there was nothing strange in that; his habits were very irregular, and he was often absent; for instance, it was nearly two months since she had seen him till yesterday."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[12]"
        "line_start": 1221
        "source_sequence": 126
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-012"
    "translation_ja": "象牙色の顔をした銀髪の老婆が戸を開けた。偽善でなでつけた悪相だったが、行儀は非の打ちどころがなかった。ええ、ここはハイド様のお宅でございますが、ご本人はおいでではありません、という。昨夜ごく遅くにお戻りになったが、一時間もしないうちにまたお出かけになった。それにはとりたてて変なことはない。生活ぶりはひどく不規則で、よくお留守になさる。たとえば昨日までは、二か月近くお姿を見なかったくらいだという。"
    "translation_status": "reviewed"
  - "id": "c04-013"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Very well, then, we wish to see his rooms,” said the lawyer; and when the woman began to declare it was impossible, “I had better tell you who this person is,” he added. “This is Inspector Newcomen of Scotland Yard.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[13]"
        "line_start": 1230
        "source_sequence": 127
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-013"
    "translation_ja": "「結構。では、お部屋を拝見したい」と弁護士は言った。老婆がとんでもないと言いかけると、「この方がどなたなのか申し上げておくほうがいいでしょう」と彼は付け加えた。「ロンドン警視庁のニューコメン警部です」"
    "translation_status": "reviewed"
  - "id": "c04-014"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A flash of odious joy appeared upon the woman’s face. “Ah!” said she, “he is in trouble! What has he done?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[14]"
        "line_start": 1237
        "source_sequence": 128
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-014"
    "translation_ja": "老婆の顔にいやらしい歓喜がひらめいた。「まあ！」と彼女は言った。「あの人が面倒を起こしてるんですね！　何をやらかしたんです？」"
    "translation_status": "reviewed"
  - "id": "c04-015"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Utterson and the inspector exchanged glances. “He don’t seem a very popular character,” observed the latter. “And now, my good woman, just let me and this gentleman have a look about us.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[15]"
        "line_start": 1242
        "source_sequence": 129
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-015"
    "translation_ja": "アタスン氏と警部は顔を見合わせた。「あまり人望のある人物じゃないらしい」と後者は言った。「さあ、おかみさん、私とこちらの先生にちょいと中を見せてくださいよ」"
    "translation_status": "reviewed"
  - "id": "c04-016"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In the whole extent of the house, which but for the old woman remained otherwise empty, Mr. Hyde had only used a couple of rooms; but these were furnished with luxury and good taste. A closet was filled with wine; the plate was of silver, the napery elegant; a good picture hung upon the walls, a gift (as Utterson supposed) from Henry Jekyll, who was much of a connoisseur; and the carpets were of many piles and agreeable in colour. At this moment, however, the rooms bore every mark of having been recently and hurriedly ransacked; clothes lay about the floor, with their pockets inside out; lock-fast drawers stood open; and on the hearth there lay a pile of grey ashes, as though many papers had been burned. From these embers the inspector disinterred the butt end of a green cheque book, which had resisted the action of the fire; the other half of the stick was found behind the door; and as this clinched his suspicions, the officer declared himself delighted. A visit to the bank, where several thousand pounds were found to be lying to the murderer’s credit, completed his gratification."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[16]"
        "line_start": 1248
        "source_sequence": 130
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-016"
    "translation_ja": "老婆のほかには人影もないその家はかなり広かったが、ハイド氏が使っていたのは二部屋きりだった。もっともその二部屋には金と趣味を凝らした品々があった。戸棚にぶどう酒がぎっしりと詰まり、食器は銀、食卓の布は優美だった。壁にはよい絵が掛かっていて、目利きのヘンリー・ジキルが贈ったものだろうとアタスンは思った。絨毯は毛足が豊かで、色合いも心地よかった。が、今はつい先ほど慌ただしく部屋じゅうを引っかき回した跡がありありと残っていた。ポケットを裏返した服が床に散らばり、いつもは錠の下りた引き出しが開け放たれ、暖炉には書類をいくつも燃やしたらしく灰色の燃えかすが小山をなしていた。警部が残り火の中から掘り出したのは、燃え残った緑の小切手帳の綴じもとだった。杖の片割れは戸の陰から見つかった。これで睨んだとおりだと警部は喜びを口にした。銀行へ出向き、犯人名義で数千ポンドの預金があるとわかって、彼はすっかり満足した。"
    "translation_status": "reviewed"
  - "id": "c04-017"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You may depend upon it, sir,” he told Mr. Utterson: “I have him in my hand. He must have lost his head, or he never would have left the stick or, above all, burned the cheque book. Why, money’s life to the man. We have nothing to do but wait for him at the bank, and get out the handbills.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[17]"
        "line_start": 1266
        "source_sequence": 131
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-017"
    "translation_ja": "「間違いありませんよ、先生」と彼はアタスン氏に言った。「もう手の内にあります。よほど逆上したに違いない。でなけりゃ杖は残さないし、第一、小切手帳を焼くものですか。だって、お金はあの男の命綱です。こちらの仕事は銀行で待ち受けて、人相書きを配るだけですよ」"
    "translation_status": "reviewed"
  - "id": "c04-018"
    "section_id": "chapter-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This last, however, was not so easy of accomplishment; for Mr. Hyde had numbered few familiars—even the master of the servant maid had only seen him twice; his family could nowhere be traced; he had never been photographed; and the few who could describe him differed widely, as common observers will. Only on one point were they agreed; and that was the haunting sense of unexpressed deformity with which the fugitive impressed his beholders."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[6]/p[18]"
        "line_start": 1274
        "source_sequence": 132
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap04"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c04-018"
    "translation_ja": "ところが、この最後の仕事はそう簡単にはいかなかった。ハイド氏の親しい知人はほとんどおらず、あの女中の主人でさえ二度会っただけだった。親族を捜してもどこにも手がかりはなく、写真は一度も撮らせたことがない。人相を語れる数少ない者も、世間の目撃者の常で、言うことが大きく食い違った。たった一つ、全員の話の一致する点があった。何がどうとは言い表せぬ、姿かたちのどこかが歪んでいるという、見た者にいつまでもつきまとう印象を、その逃亡者が残したことだった。"
    "translation_status": "reviewed"
  - "id": "c05-000"
    "section_id": "chapter-05"
    "kind": "heading"
    "origin": "source"
    "source_text": "INCIDENT OF THE LETTER"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[7]/h2"
        "line_start": 1287
        "source_sequence": 133
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap05"
    "source_alignment":
      - "source_id": "gutenberg-43"

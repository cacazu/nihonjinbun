    "kind": "paragraph"
    "origin": "source"
    "source_text": "On the ninth of January, now four days ago, I received by the evening delivery a registered envelope, addressed in the hand of my colleague and old school companion, Henry Jekyll. I was a good deal surprised by this; for we were by no means in the habit of correspondence; I had seen the man, dined with him, indeed, the night before; and I could imagine nothing in our intercourse that should justify formality of registration. The contents increased my wonder; for this is how the letter ran:"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[1]"
        "line_start": 2484
        "source_sequence": 302
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-001"
    "translation_ja": "今から四日前の一月九日、夕便の書留で一通の封書を受け取った。宛名は同業者で古い学友のヘンリー・ジキルの筆跡だった。これにはずいぶん驚いた。われわれにはそもそも手紙をやり取りする習慣がなく、前夜には会ったばかり、それどころか食卓まで共にしていた。私たちの間柄で、書留という仰々しさに見合う用件など何も思いつかなかった。中身は私をいよいよ驚かせた。手紙はこうだった。"
    "translation_status": "reviewed"

        "original_unit_id": "c10-014"
    "translation_ja": "驚きにただ呆けたまま三十秒近く見つめていただろう。いきなりシンバルが打ち合わされたように鮮烈に、恐怖が胸の内に目を覚ました。私は寝台から飛び起きて鏡へ駆けた。目に入ってきたものに、血がこの上なく薄く、氷のように冷たい何かに変わった。そうだ、ヘンリー・ジキルの身で床に入り、エドワード・ハイドとして目覚めたのだ。どう説明がつくのか、と自問した。次いでまた恐怖が跳ね上がった。どう取り返せばよいのか？　朝もとうに遅くなっていた。召使たちは起きていた。薬はすべて私室にある。恐れに打たれて立つ今の場所からは、二階分の階段を下り、裏の廊下を通り、吹きさらしの中庭を横切り、解剖講堂を抜ける、遠い旅路だった。なるほど顔は覆えるかもしれない。だが身の丈が変わったことを隠せなければ何になろう。そこで圧倒するほど甘い安堵とともに、召使はすでに第二の私の出入りに慣れているのを思い出した。私は大急ぎで自分の元の寸法の服をなんとか着込み、家の中を通り抜けた。あの時刻にあの妙ないでたちでハイド氏が現れたので、ブラッドショーは目を見張り、あとずさった。十分後にはジキル博士が自分の姿に戻り、額を曇らせ、朝食を取るふりをしようと食卓についていた。"
    "translation_status": "reviewed"
  - "id": "c10-015"
    "section_id": "chapter-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Small indeed was my appetite. This inexplicable incident, this reversal of my previous experience, seemed, like the Babylonian finger on the wall, to be spelling out the letters of my judgment; and I began to reflect more seriously than ever before on the issues and possibilities of my double existence. That part of me which I had the power of projecting, had lately been much exercised and nourished; it had seemed to me of late as though the body of Edward Hyde had grown in stature, as though (when I wore that form) I were conscious of a more generous tide of blood; and I began to spy a danger that, if this were much prolonged, the balance of my nature might be permanently overthrown, the power of voluntary change be forfeited, and the character of Edward Hyde become irrevocably mine. The power of the drug had not been always equally displayed. Once, very early in my career, it had totally failed me; since then I had been obliged on more than one occasion to double, and once, with infinite risk of death, to treble the amount; and these rare uncertainties had cast hitherto the sole shadow on my contentment. Now, however, and in the light of that morning’s accident, I was led to remark that whereas, in the beginning, the difficulty had been to throw off the body of Jekyll, it had of late gradually but decidedly transferred itself to the other side. All things therefore seemed to point to this; that I was slowly losing hold of my original and better self, and becoming slowly incorporated with my second and worse."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[12]/p[15]"
        "line_start": 3086
        "source_sequence": 351
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"

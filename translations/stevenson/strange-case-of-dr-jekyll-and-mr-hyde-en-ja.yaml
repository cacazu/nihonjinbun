  - "id": "c09-014"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He told me “yes” by a constrained gesture; and when I had bidden him enter, he did not obey me without a searching backward glance into the darkness of the square. There was a policeman not far off, advancing with his bull’s eye open; and at the sight, I thought my visitor started and made greater haste."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[14]"
        "line_start": 2625
        "source_sequence": 315
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-014"
    "translation_ja": "男はぎごちない身ぶりで「そうだ」と答えた。どうぞと招いても、ひとたび背後の広場の闇に探るような一瞥を投げずには入ろうとしなかった。さほど遠くないところを、巡査ががんどう提灯の覆いを開けて近づいていた。それを見ると客はびくりとして、足を早めたように思った。"
    "translation_status": "reviewed"
  - "id": "c09-015"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "These particulars struck me, I confess, disagreeably; and as I followed him into the bright light of the consulting room, I kept my hand ready on my weapon. Here, at last, I had a chance of clearly seeing him. I had never set eyes on him before, so much was certain. He was small, as I have said; I was struck besides with the shocking expression of his face, with his remarkable combination of great muscular activity and great apparent debility of constitution, and—last but not least—with the odd, subjective disturbance caused by his neighbourhood. This bore some resemblance to incipient rigour, and was accompanied by a marked sinking of the pulse. At the time, I set it down to some idiosyncratic, personal distaste, and merely wondered at the acuteness of the symptoms; but I have since had reason to believe the cause to lie much deeper in the nature of man, and to turn on some nobler hinge than the principle of hatred."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[15]"
        "line_start": 2633
        "source_sequence": 316
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-015"
    "translation_ja": "正直なところ、こうした細かな様子は私に不愉快な印象を与えた。明るく照らされた診察室へ彼のあとについていくときも、武器にいつでも手が届くようにしていた。そこでようやく相手をはっきり見られた。これまで一度も会ったことはない。それだけは確かだった。先にも述べたとおり小柄だった。そのほか、顔のおぞましい表情と、筋肉の並外れた敏活さが、一見ひどく虚弱な体質と同居する珍しさと、そして何よりも、そばにいるために自分の心身に生じる奇妙な異変とに打たれた。それは悪寒の起こりばなに少し似ていて、脈が目立って弱まるのを伴った。その時は私個人に特有の勝手な好き嫌いだと片づけ、ただ症状の鋭さに驚いた。だがのちになって、その原因は人間の本性のはるかに深くにあり、憎悪の原理よりも高貴な何ものかを軸として動くのだと信ずる理由ができた。"
    "translation_status": "reviewed"
  - "id": "c09-016"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This person (who had thus, from the first moment of his entrance, struck in me what I can only describe as a disgustful curiosity) was dressed in a fashion that would have made an ordinary person laughable; his clothes, that is to say, although they were of rich and sober fabric, were enormously too large for him in every measurement—the trousers hanging on his legs and rolled up to keep them from the ground, the waist of the coat below his haunches, and the collar sprawling wide upon his shoulders. Strange to relate, this ludicrous accoutrement was far from moving me to laughter. Rather, as there was something abnormal and misbegotten in the very essence of the creature that now faced me—something seizing, surprising and revolting—this fresh disparity seemed but to fit in with and to reinforce it; so that to my interest in the man’s nature and character, there was added a curiosity as to his origin, his life, his fortune and status in the world."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[16]"
        "line_start": 2649
        "source_sequence": 317
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-016"
    "translation_ja": "こうして入って来た瞬間から、私に嫌悪を伴う好奇心としか言えぬものを起こさせたこの人物は、並の人間なら物笑いになりそうな格好をしていた。服は上等で地味な生地でこしらえてあるものの、どこを測っても途方もなく大きすぎた。ズボンは脚にだぶだぶで、地面を引きずらぬよう裾をまくってあり、上着のくびれは腰より下に落ち、襟は肩いっぱいにだらしなく広がっていた。妙なことに、この滑稽ないでたちは私を笑わせるどころではなかった。向き合っている生き物には、その本質からしてどこか尋常でなく、生まれそこないのところがあり、それに人は不意にとらえられ、驚かされ、胸を悪くした。この新たな不釣り合いは、かえってそれに合致し、その感じを強めるだけのようだった。そのため私は男の天性や性格に対する興味の上に、その出自と暮らし、境遇と世間での身分まで知りたくなった。"
    "translation_status": "reviewed"
  - "id": "c09-017"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "These observations, though they have taken so great a space to be set down in, were yet the work of a few seconds. My visitor was, indeed, on fire with sombre excitement."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[17]"
        "line_start": 2665
        "source_sequence": 318
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-017"
    "translation_ja": "書くにはこれだけの紙幅を要した観察も、じつはほんの数秒のうちのことだった。客はそれほど暗い興奮に燃え立っていたのである。"
    "translation_status": "reviewed"
  - "id": "c09-018"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Have you got it?” he cried. “Have you got it?” And so lively was his impatience that he even laid his hand upon my arm and sought to shake me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[18]"
        "line_start": 2671
        "source_sequence": 319
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-018"
    "translation_ja": "「ありますか！」と彼は叫んだ。「ありますか！」　そのもどかしさはあまりに激しく、私の腕に手までかけて、揺さぶろうとした。"
    "translation_status": "reviewed"
  - "id": "c09-019"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I put him back, conscious at his touch of a certain icy pang along my blood. “Come, sir,” said I. “You forget that I have not yet the pleasure of your acquaintance. Be seated, if you please.” And I showed him an example, and sat down myself in my customary seat and with as fair an imitation of my ordinary manner to a patient, as the lateness of the hour, the nature of my preoccupations, and the horror I had of my visitor, would suffer me to muster."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[19]"
        "line_start": 2677
        "source_sequence": 320
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-019"
    "translation_ja": "私は彼を押し戻した。触れられたとたん、血の流れに沿って氷のような痛みが走ったのである。「まあ、あなた」と言った。「私たちはまだお近づきにもなっていないことをお忘れです。どうぞお掛けください」。自分で手本を見せ、いつもの椅子に腰を下ろした。時刻の遅さ、気にかかっている事の性質、この客に抱く恐れが許す限りではあるが、できるだけふだん患者に向かう態度をまねたのである。"
    "translation_status": "reviewed"
  - "id": "c09-020"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I beg your pardon, Dr. Lanyon,” he replied civilly enough. “What you say is very well founded; and my impatience has shown its heels to my politeness. I come here at the instance of your colleague, Dr. Henry Jekyll, on a piece of business of some moment; and I understood...” He paused and put his hand to his throat, and I could see, in spite of his collected manner, that he was wrestling against the approaches of the hysteria—“I understood, a drawer...”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[20]"
        "line_start": 2687
        "source_sequence": 321
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-020"
    "translation_ja": "「お許しください、ラニョン博士」と彼は十分丁寧に答えた。「おっしゃることはごもっともです。礼儀を置き去りにして気がせいてしまいました。私は先生のご同業、ヘンリー・ジキル博士に頼まれ、少しばかり重大な用件でここへ参りました。そして確か……」。男は口をつぐみ、手を喉に当てた。落ち着いた身ぶりの裏で、こみ上げてくる発作と闘っているのが見えた。「確か、引き出しが……」"
    "translation_status": "reviewed"
  - "id": "c09-021"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But here I took pity on my visitor’s suspense, and some perhaps on my own growing curiosity."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[21]"
        "line_start": 2697
        "source_sequence": 322
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-021"
    "translation_ja": "そこで、待ち切れぬ客が哀れになった。ひょっとすると、募るばかりの自分の好奇心にも、いくらか同情したのだろう。"
    "translation_status": "reviewed"
  - "id": "c09-022"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There it is, sir,” said I, pointing to the drawer, where it lay on the floor behind a table and still covered with the sheet."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[22]"
        "line_start": 2702
        "source_sequence": 323
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-022"
    "translation_ja": "「あそこです」と私は、テーブルの向こうの床にまだ敷布に覆われて置いてある引き出しを指さした。"
    "translation_status": "reviewed"
  - "id": "c09-023"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He sprang to it, and then paused, and laid his hand upon his heart; I could hear his teeth grate with the convulsive action of his jaws; and his face was so ghastly to see that I grew alarmed both for his life and reason."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[23]"
        "line_start": 2707
        "source_sequence": 324
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-023"
    "translation_ja": "男はそれに飛びついたが、そこで動きを止めて胸に手を当てた。顎の痙攣に歯がきしむのが聞こえた。その顔があまりに凄まじく、私は男の命も正気も心配になった。"
    "translation_status": "reviewed"
  - "id": "c09-024"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Compose yourself,” said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[24]"
        "line_start": 2713
        "source_sequence": 325
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-024"
    "translation_ja": "「お気を確かに」と私は言った。"
    "translation_status": "reviewed"
  - "id": "c09-025"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He turned a dreadful smile to me, and as if with the decision of despair, plucked away the sheet. At sight of the contents, he uttered one loud sob of such immense relief that I sat petrified. And the next moment, in a voice that was already fairly well under control, “Have you a graduated glass?” he asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[25]"
        "line_start": 2717
        "source_sequence": 326
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-025"
    "translation_ja": "彼は恐ろしい笑みを私に向け、絶望の果ての決断でもしたように敷布をむしり取った。中身をひと目見て、底知れぬ安堵をこめた大きなしゃくり声を一つ漏らしたので、座った私は石のように固まった。そして次の瞬間にはもう、相当に平静を取り戻した声で、「目盛りを刻んだグラスはありますか」と尋ねた。"
    "translation_status": "reviewed"
  - "id": "c09-026"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I rose from my place with something of an effort and gave him what he asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[26]"
        "line_start": 2725
        "source_sequence": 327
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-026"
    "translation_ja": "私はいくらか骨を折って席から立ち、求められた品を渡した。"
    "translation_status": "reviewed"
  - "id": "c09-027"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He thanked me with a smiling nod, measured out a few minims of the red tincture and added one of the powders. The mixture, which was at first of a reddish hue, began, in proportion as the crystals melted, to brighten in colour, to effervesce audibly, and to throw off small fumes of vapour. Suddenly and at the same moment, the ebullition ceased and the compound changed to a dark purple, which faded again more slowly to a watery green. My visitor, who had watched these metamorphoses with a keen eye, smiled, set down the glass upon the table, and then turned and looked upon me with an air of scrutiny."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[27]"
        "line_start": 2729
        "source_sequence": 328
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-027"
    "translation_ja": "微笑んでうなずくことで礼を言うと、男は赤いチンキを数ミニム量り取り、粉を一包加えた。初め赤みを帯びていた混合液は、結晶が溶けるにつれて色が鮮やかになり、耳に聞こえるほど泡立って、少し煙のような蒸気を放った。不意に、泡立ちがやむとまさに同時に液は濃い紫に変わり、それからもっとゆっくり薄れて水っぽい緑になった。変化を鋭い目で見守っていた客は微笑み、テーブルの上にグラスを置いて向き直り、品定めするように私を見た。"
    "translation_status": "reviewed"
  - "id": "c09-028"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And now,” said he, “to settle what remains. Will you be wise? will you be guided? will you suffer me to take this glass in my hand and to go forth from your house without further parley? or has the greed of curiosity too much command of you? Think before you answer, for it shall be done as you decide. As you decide, you shall be left as you were before, and neither richer nor wiser, unless the sense of service rendered to a man in mortal distress may be counted as a kind of riches of the soul. Or, if you shall so prefer to choose, a new province of knowledge and new avenues to fame and power shall be laid open to you, here, in this room, upon the instant; and your sight shall be blasted by a prodigy to stagger the unbelief of Satan.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[28]"
        "line_start": 2740
        "source_sequence": 329
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-028"
    "translation_ja": "「さて」と彼は言った。「あとのことを決めましょう。賢明でいらっしゃいますか？　忠告をお聞きになりますか？　私がこのグラスを持ち、これ以上言葉を交わさずあなたのお宅を出てゆくに任せてくださいますか？　それとも飽くなき好奇心に支配されすぎておいでですか？　よく考えてからお答えください。あなたのお決めのとおりにしますから。決めようによっては、何も知らず、何も得ず、以前のままでいられます。死ぬばかりの苦境にある者を助けたという気持ちを、魂の富の一種に数えない限りは。しかし、もしもう一方をお選びになるなら、たった今、この部屋で、知識の新しい領域と、名声と力への新しい道とがあなたの前に開かれ、サタンの懐疑心さえ揺るがす驚異に、あなたの目は焼かれるでしょう」"
    "translation_status": "reviewed"
  - "id": "c09-029"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Sir,” said I, affecting a coolness that I was far from truly possessing, “you speak enigmas, and you will perhaps not wonder that I hear you with no very strong impression of belief. But I have gone too far in the way of inexplicable services to pause before I see the end.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[29]"
        "line_start": 2754
        "source_sequence": 330
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-029"
    "translation_ja": "「あなた」と私はじつはおよそ持ち合わせのない冷静さを装って言った。「謎かけばかりなさるので、私が聞いてもたいして信じる気を起こせないのを、不思議にはお思いになりますまい。しかし私はすでに、説明のつかぬ骨折りを重ねてここまで来た。結末を見ずには立ち止まれません」"
    "translation_status": "reviewed"
  - "id": "c09-030"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It is well,” replied my visitor. “Lanyon, you remember your vows: what follows is under the seal of our profession. And now, you who have so long been bound to the most narrow and material views, you who have denied the virtue of transcendental medicine, you who have derided your superiors—behold!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[11]/p[30]"
        "line_start": 2761
        "source_sequence": 331
        "url": "https://gutenberg.pglaf.org/cache/epub/43/pg43-images.html"
        "anchor": "chap09"
    "source_alignment":
      - "source_id": "gutenberg-43"
        "original_unit_id": "c09-030"
    "translation_ja": "「結構です」と客は答えた。「ラニョン、誓いを覚えておいででしょう。これから先はわれわれの職業の秘密です。さあ、これほど長くこの上なく狭量で物質一辺倒の見方に縛られ、超越的医学の力を否定し、おのれにまさる者を嘲笑ってきたあなた、見るがいい！」"
    "translation_status": "reviewed"
  - "id": "c09-031"
    "section_id": "chapter-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He put the glass to his lips and drank at one gulp. A cry followed; he reeled, staggered, clutched at the table and held on, staring with injected eyes, gasping with open mouth; and as I looked there came, I thought, a change—he seemed to swell—his face became suddenly black and the features seemed to melt and alter—and the next moment, I had sprung to my feet and leaped back against the wall, my arms raised to shield me from that prodigy, my mind submerged in terror."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"

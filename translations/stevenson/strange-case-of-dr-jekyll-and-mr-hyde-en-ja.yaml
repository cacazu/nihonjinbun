        "original_unit_id": "c06-004"
    "translation_ja": "「衝撃を受けたんだ」と彼は言った。「もう立ち直れはしない。あと何週間かの問題だ。まあ、人生は楽しかったよ。僕は人生が好きだった。ああ、君、確かに昔は好きだった。すべてを知っていたなら、人はもっと喜んでこの世を去るんじゃないかと、ときどき思う」"
    "translation_status": "reviewed"
  - "id": "c06-005"
    "section_id": "chapter-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Jekyll is ill, too,” observed Utterson. “Have you seen him?”"
    "source_languages":

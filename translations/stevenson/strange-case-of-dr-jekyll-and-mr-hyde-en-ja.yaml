    "translation_ja": "「いや、こうなんです」とエンフィールド氏は答えた。「真冬の真っ暗な朝の三時ごろ、私は地の果てのようなところから帰ってくる途中でした。通った界隈には、文字通り街灯のほか何ひとつ見えない。通りをいくつ抜けても人は眠っている。通りという通りは行列でも通るようにあかあかと照らされているのに、教会堂なみにがらんとしている。そのうち、じっと耳をすませては、お巡りさんの姿がそろそろ恋しくなるという気分になりました。するといきなり、人影が二つ目に入った。一人は小柄な男で、東のほうへ、ずんずんかなりの速足で歩いてくる。もう一人は八つか十ばかりの女の子で、横合いの通りを力いっぱい走ってくる。で、案の定、二人は角でぶつかった。ぞっとするのはそこからです。そいつは平然と子どもの体を踏み越え、地べたで泣き叫ぶ子をそのまま置き去りにした。聞くだけならなんでもない。見たら地獄ですよ。人間のすることじゃない。人をひきつぶすジャガンナートの山車か何かだ。私は二声三声わめき、駆け出してその御仁のえり首をつかみ、泣きわめく子のまわりにもう人だかりのしているところへ引き戻した。男は平然として抵抗ひとつしなかった。だが一度こちらを見ましてね。その目つきの醜さに、私は走ったときのように汗が吹き出した。飛び出してきたのは女の子の家族で、間もなくその子が呼びにやられた当の医者まで来た。まあ、たいしたけがはない、驚いたほうが大きいというのが、そのお医者先生の見立てでした。これでおしまいと思うでしょう。だが妙なことがひとつありました。私はひと目でその御仁が嫌いになった。家族もそうだったが、それは当たり前です。ところが私が驚いたのは、あの医者ですよ。判で押したようなありきたりの町医者で、年も顔色もこれというところはなく、ひどいエディンバラなまりで、バグパイプほどしか情に動かないといった男だ。ところがこの医者もわれわれと同じでね、私の捕虜を見るたびに、殺してしまいたいという思いで気分が悪くなり、真っ青になるのがわかった。医者に私の気持ちがわかったのと同様、私にも医者の気持ちがわかった。殺すわけにはいかないので、その次にできる手を打った。われわれは男に言ってやった。こうなれば、おまえの名がロンドンの端から端まで臭って回るような醜聞に仕立てられるし、そうしてやるぞと。友人だの信用だのが少しでもあるなら、こちらが責任を持ってことごとくなくしてやるとね。こっちがかっかとまくしたてているあいだも、女たちを男に飛びかからせないようにするのがやっとだった。あの人たちはまるで怪鳥ハルピュイアです。あんなに憎しみに満ちた顔の輪は見たことがない。そのまんなかで男は、腹の黒いせせら笑いを浮かべ、平然としている。怖がってもいましたよ、それはわかる。だが見事な切り抜けっぷりで、まさしくサタンでしたな。『あなた方が、この事故を食いものにしようというなら、むろん私に打つ手はありません。人前で騒ぎを起こしたい紳士などいないでしょう』とやつは言う。『額をおっしゃい』。そこで、あの子の家族に百ポンド出すところまで、こっちが締め上げてやりました。ほんとうはまだ粘りたかったのでしょうが、われわれの一団には、ただではすまさないという何かがあった。とうとう降参です。さて、金を取りに行かねばならない。どこへ連れていかれたと思います？　あの扉のところですよ。男はさっと鍵を出して入り、まもなく金貨で十ポンドばかりと、残りの額のクーツ銀行宛ての小切手を持って戻った。持参人払いで、署名は、ここではとても言えない名前だ。本当はその名が話のみそなんですが、少なくともたいそう知れわたり、しばしば活字にもなる名です。金額は大きいが、署名が本物なら、それ以上も通用する。そこでひとこと、この一件はどうも眉唾じゃありませんか、実際の世の中で、朝の四時に穴蔵の戸を入って、百ポンド近い他人の小切手を手に出てくる人がいますかね、と言ってやった。ところがそいつは平気でせせら笑って、『ご安心なさい。銀行が開くまでご一緒して、自分で現金に換えます』と言う。そこで医者と、子どもの父親と、例のご当人と私で、連れだって私の部屋へ行って夜明けを待ちました。翌朝、朝飯をすませて銀行へ一同そろって出向いた。小切手は私自身が出して、偽造と思うだけの理由が十分あると言った。ところが、とんでもない。本物でしたよ」"
    "translation_status": "reviewed"

    "translation_ja": "「ジキルも具合が悪いんだ」とアタスンは言った。「会ったかね？」"
    "translation_status": "reviewed"
  - "id": "c06-006"
    "section_id": "chapter-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But Lanyon’s face changed, and he held up a trembling hand. “I wish to see or hear no more of Dr. Jekyll,” he said in a loud, unsteady voice. “I am quite done with that person; and I beg that you will spare me any allusion to one whom I regard as dead.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-43"
        "precision": "block"
        "xpath": "/html/body/div[8]/p[6]"

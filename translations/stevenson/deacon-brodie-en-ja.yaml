  kind: paragraph
  origin: source
  source_text: BRODIE.  You should have said I was in trade, and had a good business. That’s what you should have said.  That’s
    what you would have said had you been worth your salt.  But it’s blunder, blunder, outside and in [upstairs, downstairs,
    and in my lady’s chamber].  You women!  Did he see Smith?

    original_unit_id: line-2481-2485
  translation_ja: エインズリー。たった五ポンドです、旦那。五ポンド。死ぬのと同じくらい確かに、一ペニーも余計にもらっちゃいません。もっとくれとは言いましたよ。ええ、そりゃ、否定なんかしません。でもアナグマに蹴られました。それからジョーディにはひどい罵り言葉を浴びせられて、腹を切り裂いて肝を出し、それで魚を釣るって脅されました。初めからそうだったんで。かわいそうなアンドラにゃ、悪態一つに小銭一枚で十分だったんですよ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0717
  section_id: act-iii-tableau-v-scene-iv
  kind: paragraph
  origin: source
  source_text: HUNT.  Well, and why did they do it?  I saw Jemmy dance a hornpipe on the table, and booze the company all
    round, when the Deacon was gone.  What made you cross the fight, and play booty with your own man?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719

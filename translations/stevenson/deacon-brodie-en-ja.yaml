    original_unit_id: line-2155-2163
  translation_ja: ブロディ。変わったかだと？　世界がまるで別の色になった！　夜だったのが、今は真っ昼間だ。自分をまた信じられる。待っていておくれ、いいか、待つんだ。わたしは働いて働いて、今週中には、神がご覧になっているのと同じくらい確かに、おまえを幸せにしてみせる。わたしがへこたれたと思うなよ、犬ども。組合長は追いつかれてたまる男じゃない。見ていろ、まだ角をひとつ曲がって、おまえらをまいてやる。あとはせいぜい悔しがって唸るがいい！　それに、おまえ、ポル。わたしはまだ何もしてやっていない。だが神のお許しさえあれば、おまえの一生を金色に輝かせてみせる。わたしがどこにいようと、おまえの幸せにはわたしもあずかるんだ。神にかけて、きっとそれとわかって、わたしのために祈ってくれる。
  translation_status: reviewed
  source_kind: dialogue

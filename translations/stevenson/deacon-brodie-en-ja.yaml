  section_id: act-i-tableau-i-scene-ii
  kind: paragraph
  origin: source
  source_text: BRODIE.  You see, Procurator, the news is as fresh to him as it was five years ago.  He was struck down before
    he got the Deaconship, and lives his lost life in mine.
  source_languages:
  - en
  source_locations:

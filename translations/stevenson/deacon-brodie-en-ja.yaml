  kind: paragraph
  origin: source
  source_text: HUNT.  I thought I hadn’t mistook my man.  Now, you look here, Andrew Ainslie, you’re a bad lot.  I’ve evidence
    to hang you fifty times over. But the Deacon is my mark.  Will you peach, or wont you?  You blow the gaff, and I’ll pull
    you through.  You don’t, and I’ll scragg you as sure as my name’s Jerry Hunt.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719

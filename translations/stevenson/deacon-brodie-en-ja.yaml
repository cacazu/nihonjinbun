- id: db-1042
  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: MARY.  You forget, you forget what I am.  I am his sister.  I owe him a lifetime of happiness and love; I owe
    him even you.  And whatever his fault, however ruinous his disgrace, he is my brother—my own brother—and my place is still
    with him.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3437
    line_end: 3440
    source_sequence: 3437
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3437-3440
  translation_ja: メアリー。あなたはお忘れよ。わたしが何者か、お忘れなのよ。わたしはあの人の妹です。一生の幸せも愛情も、あの人にもらったの。あなたに会えたのだって、あの人のおかげよ。どんな罪があろうと、その不名誉で身を滅ぼそうと、わたしの兄です。実のお兄さまです。わたしのいるべき場所は、やっぱりあの人のそばです。
  translation_status: reviewed
  source_kind: dialogue
- id: db-1043
  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: LESLIE.  Your place is with me—is with your husband.  With me, with me; and for his sake most of all.  What
    can you do for him alone? how can you help him alone?  It wrings my heart to think how little.  But together is different.  Together
    . . . I join my strength, my will, my courage to your own, and together we may save him.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3442
    line_end: 3446
    source_sequence: 3442
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3442-3446
  translation_ja: レズリー。きみのいるべき場所は、僕のそばだ。きみの夫のそばだよ。僕と一緒に、僕と一緒にいて。ほかならぬお兄さんのためにも。きみ独りで、あの人に何ができる？　独りでどう助けられる？　独りではあまりにできることが少ないと思うと、胸が裂けそうだ。けれど、二人一緒なら話は別だ。一緒なら……僕の力も、意志も、勇気も、きみのそれと合わせられる。二人なら、あの人を救えるかもしれない。
  translation_status: reviewed
  source_kind: dialogue
- id: db-1044
  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: MARY.  All that is over.  Once I was blessed among women.  I was my father’s daughter, my brother loved me,
    I lived to be your wife.  Now . . . ! My father is dead, my brother is shamed; and you . . . O how could I face the world,
    how could I endure myself, if I preferred my happiness to your honour?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3448
    line_end: 3452
    source_sequence: 3448
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3448-3452
  translation_ja: メアリー。そんなことはみんな終わってしまったのよ。かつては女の中でも、わたしは幸せに恵まれていた。父の娘で、兄には愛されて、あなたの妻になることを夢見て生きてきた。でも、今は……！　父は亡くなり、兄は恥をさらし、あなたは……ああ、あなたの名誉より自分の幸せを選んで、世間にどう顔向けするの？　そんな自分に、どう耐えられるというの？
  translation_status: reviewed
  source_kind: dialogue
- id: db-1045
  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: LESLIE.  What is my honour but your happiness?  In what else does it consist?  Is it in denying me my heart?
    is it in visiting another’s sin upon the innocent?  Could I do that, and be my mother’s son?  Could I do that, and bear
    my father’s name?  Could I do that, and have ever been found worthy of you?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3454
    line_end: 3458
    source_sequence: 3454
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3454-3458
  translation_ja: レズリー。僕の名誉が、きみの幸せでなかったら、いったい何だろう。ほかの何に懸かっている？　自分の心を押し殺すことか？　罪のない人に、他人の罪を負わせることか？　そんなことをして、母の息子といえるだろうか？　そんなことをして、父の名を名乗れるだろうか？　そんなことをする僕を、きみにふさわしい人間だなんて、いったい誰が思ってくれる？
  translation_status: reviewed
  source_kind: dialogue
- id: db-1046
  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: MARY.  It is my duty . . . my duty.  Why will you make it so hard for me? So hard, Walter so hard!
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3460
    line_end: 3461
    source_sequence: 3460
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3460-3461
  translation_ja: メアリー。それが、わたしの務めなの……わたしの務めよ。どうしてそんなにつらくするの？　つらすぎるわ。ウォルター、つらすぎるのよ！
  translation_status: reviewed
  source_kind: dialogue
- id: db-1047
  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: LESLIE.  Do I pursue you only for your good fortune, your beauty, the credit of your friends, your family’s
    good name?  That were not love, and I love you.  I love you, dearest, I love you.  Friend, father, brother, husband .
    . . I must be all these to you.  I am a man who can love well.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3463
    line_end: 3466
    source_sequence: 3463
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3463-3466
  translation_ja: レズリー。僕は、きみが幸運だから、美しいから、世間に信用のある人たちと親しいから、一家の名に傷がないから、きみを追いかけてるのかい？　それは愛じゃない。僕はきみを愛してる。愛してるよ、大切な人、愛している。友達、父、兄、夫……僕はきみにとって、その全部になるんだ。僕は人を心から愛せる男だよ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-1048
  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: MARY.  Silence . . . in pity!  I cannot . . . O, I cannot bear it.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3468
    line_end: 3468
    source_sequence: 3468
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3468-3468
  translation_ja: メアリー。黙って……お願いだから！　もう……ああ、耐えられない。
  translation_status: reviewed
  source_kind: dialogue
- id: db-1049
  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: LESLIE.  And say it was I who had fallen.  Say I had played my neck and lost it . . . that I were pushed by
    the law to the last limits of ignominy and despair.  Whose love would sanctify my jail to me? whose pity would shine upon
    me in the dock? whose prayers would accompany me to the gallows?  Whose but yours?  Yours! . . . And you would entreat
    me—me!—to do what you shrink from even in thought, what you would die ere you attempted in deed!
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3470
    line_end: 3476
    source_sequence: 3470
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3470-3476
  translation_ja: レズリー。落ちぶれたのが僕だったとしよう。首を賭けて、失ったとしよう……法に追いつめられ、恥と絶望のどん底にいたとしようよ。誰の愛が牢獄を聖なる場所にしてくれる？　誰の哀れみが被告席の僕を照らしてくれる？　誰の祈りが絞首台までついてきてくれる？　きみ以外の誰のだろう。きみのものだ！……それなのに、きみは僕に頼むのか。僕にだよ！　考えるだけでもきみが身を引き、するくらいなら死を選ぶようなことを！
  translation_status: reviewed
  source_kind: dialogue
- id: db-1050
  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: MARY.  Walter . . . on my knees . . . no more, no more!
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3478

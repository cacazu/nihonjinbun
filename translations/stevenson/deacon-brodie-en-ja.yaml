- id: db-0775
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LESLIE.  Of course, I know.  But you see, on the very day when our engagement is announced, even the best of
    men may be susceptible.  You yourself seem not quite pleased.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2652
    line_end: 2654
    source_sequence: 2652
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2652-2654
  translation_ja: レズリー。ええ、わかっています。でも、僕たちが婚約を発表するその日に、どんなに立派な人だって、気が立つことはあるでしょう。あなたも、あまりうれしそうに見えません。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0776
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LAWSON (with great irritation).  I’m perfectly pleased.  I’m perfectly delighted.  If I werena an auld man,
    I’d be just beside mysel’ wi’ happiness.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt

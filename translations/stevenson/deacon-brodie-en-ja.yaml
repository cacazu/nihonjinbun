- id: db-0136
  section_id: act-i-tableau-i-scene-iv
  kind: paragraph
  origin: source
  source_text: 'SMITH.  Ah, Jean, if you’d cast affection’s glance on this poor but honest soger!  George Lord S. is not the
    nobleman to cut the object of his flame before the giddy throng; nor to keep her boxed up in an old mouse-trap, while
    he himself is revelling in purple splendours like these.  He didn’t know you, Jean: he was afraid to.  Do you call that
    a man?  Try a man that is.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 536
    line_end: 541
    source_sequence: 536
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-536-541
  translation_ja: スミス。ああジーン、貧しくても正直なこの兵隊に、恋のまなざしを投げてくれたらなあ！　ジョージ・Ｓ卿はね、浮ついた連中の前で愛しい女を知らん顔で通り過ぎるような貴族じゃない。それに、てめえはこんな紫衣の贅沢にふけっていながら、女のほうは古い鼠取りみたいなところに閉じ込めておく、なんてこともしない。あいつは君に知らん顔をしたんだ、ジーン。怖くて挨拶もできなかった。あれで男かね？　本物の男を試してみな。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0137
  section_id: act-i-tableau-i-scene-iv
  kind: paragraph
  origin: source

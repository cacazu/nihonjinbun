  translation_ja: ハント。だが、取り分はもらったんだろう？　おまえにいくらやる値打ちがあると踏んだのかな。ゆうべクラーク婆さんの店で一芝居打って、いくらもらった？
  translation_status: reviewed
  source_kind: dialogue
- id: db-0716
  section_id: act-iii-tableau-v-scene-iv
  kind: paragraph
  origin: source
  source_text: 'AINSLIE.  Just five pund, mister.  Five pund.  As sure’s deith it wadna be a penny mair.  No but I askit mair:
    I did that; I’ll do deny it, mister.  But Badger kickit me, an’ Geordie, he said a bad sweir, an’ made he’d cut the liver
    out o’ me, an’ catch fish wi’t.  It’s been that way frae the first: an aith an’ a bawbee was aye guid eneuch for puir
    Andra.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line

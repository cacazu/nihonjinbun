    original_unit_id: line-2500-2501
  translation_ja: エインズリー。優しい旦那さま、確かなことはわかりません。組合長はおれに、ひどく腹を立てていますんで。今夜、ジョーディから指図を受けることになってます。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0723
  section_id: act-iii-tableau-v-scene-iv
  kind: paragraph
  origin: source
  source_text: HUNT.  O, you’re to get your orders from Geordie, are you?  Now look here, Ainslie.  You know me.  I’m Hunt
    the Runner; I put Jemmy Rivers in the jug this morning; I’ve got you this evening.  I mean to wind up with the Deacon.  You
    understand?  All right.  Then just you listen.  I’m going to take these here bracelets off, and send you home to that
    celebrated bed of yours.  Only, as soon as you’ve seen the Dook you come straight round to me at Mr. Procurator-Fiscal’s,
    and let me know the Dook’s views.  One word, mind, and . . . cl’k!  It’s a bargain?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2503

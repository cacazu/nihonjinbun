  translation_ja: ブロディ。でなきゃ、ここにいるものか。家を出るときには、不在証明を家に置いてくる。わたしは病気なんだ、頭はずきずき、かんしゃくは悪魔もまっ青。今このとき、わたしは病んで床にいる。家の者はみな、かわいそうな組合長のお休みを邪魔しては大変だと、死ぬほど怖がって歩き回っているのさ。［寝室の扉は銀行のように閂をかけてある。覚えてるだろう。その一方で窓は開け放し、組合長は丘を越え、うんと遠くへ行ってるってわけだ。どう思う、わたしのことを？］
  translation_status: reviewed

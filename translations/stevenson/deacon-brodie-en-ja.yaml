- id: db-0468
  section_id: act-ii-tableau-iv-scene-iv
  kind: paragraph
  origin: source
  source_text: LAWSON.  William Brodie, mony’s the long day that I’ve believed in you; prood, prood was I to be the Deacon’s
    uncle; and a sore hearing have I had of it the day.  That’s past; that’s past like Flodden Field; it’s an auld sang noo,
    and I’m an aulder man than when I crossed your door. But mark ye this—mark ye this, William Brodie, I may be no sae guid’s
    I should be; but there’s no a saul between the east sea and the wast can lift his een to God that made him, and say I
    wranged him as ye wrang that lassie.  I bless God, William Brodie—ay, though he was like my brother—I bless God that he
    that got ye has the hand of death upon his hearing, and can win into his grave a happier man than me.  And ye speak to
    me, sir? Think shame—think shame upon your heart!
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 1652
    line_end: 1662
    source_sequence: 1652
  source_alignment:

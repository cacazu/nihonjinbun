- id: db-0912
  section_id: act-iv-tableau-vii-scene-i
  kind: paragraph
  origin: source
  source_text: 'SMITH.  All right, Humptious!  (To AINSLIE.)  You’re a nice old sort for a rag-and-bone man: can’t hold a
    bag open!  (Taking out tools.) Here they was.  Here are the bunchums, one and two; and jolly old keys was they.  Here’s
    the picklocks, crow-bars, and here’s Lord George’s pet bull’s eye, his old and valued friend, the Cracksman’s treasure!'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt

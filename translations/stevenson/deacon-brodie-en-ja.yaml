  translation_ja: エインズリー。どの仕事もおれが手を貸したからです。あの人とアナグマのムーア、それからジョーディ・スミスです。嫌だと言ってもついてこさせやがるんです。おれは気が弱くて、ときどき酒で頭がぼうっとしますから。でも何もかも知ってます、全部話します。ああ、どうか旦那さま、偉い方々にお口添えくださいますね。おれは縛り首にならないですよね……縛り首になんかなりませんよね？
  translation_status: reviewed
  source_kind: dialogue
- id: db-0715
  section_id: act-iii-tableau-v-scene-iv
  kind: paragraph
  origin: source
  source_text: HUNT.  But you shared, didn’t you?  I wonder what share they thought you worth.  How much did you get for last

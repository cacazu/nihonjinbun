    original_unit_id: line-1234-1237
  translation_ja: スミス。おれの愛しい方はどこだ？　組合長、いとしいお人、どこにいるんだい？　ジョージの腕の中へ来てくれ、ご紹介しよう。スターライト・リヴァーズ大尉！　大尉、こちらが組合長。組合長、こちらが大尉。イングランドの貴族でしてね、見聞を広める大旅行の途上にあらせられるんだ、神にかけて！
  translation_status: reviewed
  source_kind: dialogue

- id: db-0918
  section_id: act-iv-tableau-vii-scene-i
  kind: paragraph
  origin: source
  source_text: SMITH.  This morning; and he looked as if he was rehearsing for his own epitaph.  I never see such a change
    in a man.  I gave him the office for to-night; and was he grateful?  Did he weep upon my faithful bosom?  No; he smiled
    upon me like a portrait of the dear departed.  I see his ’art was far away; and it broke my own to look at him.
  source_languages:

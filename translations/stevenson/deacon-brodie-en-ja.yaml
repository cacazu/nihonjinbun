- id: db-0882
  section_id: act-iii-tableau-vi-scene-vi
  kind: paragraph
  origin: source
  source_text: BRODIE.  I might have spared him years ago; and you and my sister, and myself.  I might . . . would God I had!  (Weeping
    himself.)  Don’t weep, my good old friend; I was lost long since; don’t think of me; don’t pity me; don’t shame me with
    your pity!  I began this when I was a boy. I bound the millstone round my neck; [it is irrevocable now,] and you must
    all suffer . . . all suffer for me! . . . [for this suffering remnant of what was once a man].  O God, that I can have
    fallen to stand here as I do now.  My friend lying to save me from the gallows; my second father weeping tears of blood
    for my disgrace!  And all for what?  By what?  Because I had an open hand, because I was a selfish dog, because I loved
    this woman.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2965
    line_end: 2975
    source_sequence: 2965
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2965-2975
  translation_ja: ブロディ。何年も前に、こんな思いをさせずに済んだはずです。叔父上にも、あなたにも、妹にも、自分にも。そうできたはずが……神よ、そうしていたら！（みずからも泣きながら。）泣かないでください、大切な叔父上。わたしはとうの昔にだめになったんです。気にかけないでください。どうぞ哀れまないで。その哀れみで、恥をかかせないでください。まだ若造の頃に始めたんです。自分の首に石臼をくくりつけた。［今はもう後戻りできない。］そのために皆さんが苦しまねばならん……わたしのせいで皆さんが苦しむ！……［かつて一人の男だった、このみじめな残りかすのために。］神よ、どうしてこんなに落ちぶれて、ここに立つ身となったのでしょう。わたしを絞首台から救うため、友人は嘘をつく。第二の父は、わたしの不名誉のため血の涙を流す！　何のためにこうなったのか？　何がそうさせたのか？　気前がよかったからです。身勝手な犬だったからです。この女を愛したからです。
  translation_status: reviewed
  annotations:
  - side: source
    kind: emphasis
    span:
      start: 113
      end: 128
      exact: Weeping himself
  source_kind: dialogue

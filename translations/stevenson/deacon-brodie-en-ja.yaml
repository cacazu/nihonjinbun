- id: db-0216
  section_id: act-i-tableau-i-scene-viii
  kind: paragraph
  origin: source
  source_text: MARY.  O Willie, I am glad you did not go with them.  I have something to tell you.  If you knew how happy
    I am, you would clap your hands, Will. But come, sit you down there, and be my good big brother, and I will kneel here
    and take your hand.  We must keep close to dad, and then he will feel happiness in the air.  The poor old love, if we
    could only tell him!  But I sometimes think his heart has gone to heaven already, and takes a part in all our joys and
    sorrows; and it is only his poor body that remains here, helpless and ignorant.  Come, Will, sit you down, and ask me
    questions—or guess—that will be better, guess.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 764
    line_end: 772
    source_sequence: 764
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-764-772
  translation_ja: メアリー。まあウィリー、みんなと出かけなくてよかった。話したいことがあるの。わたしがどんなに幸せか知ったら、手をたたいて喜んでくれるわ、ウィル。でも、さあ、そこに座って優しいお兄さんになって。わたしはここにひざまずいて、手を取るから。父さんのそばにいなくちゃ。そうしたら父さんにも、あたりの幸せが感じられるわ。かわいそうな父さん。お話しできたらいいのに！　でも、ときどき思うの。父さんの心はとっくに天国へ行って、わたしたちの喜びも悲しみも一緒に感じていて、何もできず、何も知らずにここに残っているのは体だけじゃないかって。さあウィル、そこに座って、何か聞いて。それとも当ててみて。そうだわ、当ててみて。
  translation_status: reviewed
  source_kind: dialogue

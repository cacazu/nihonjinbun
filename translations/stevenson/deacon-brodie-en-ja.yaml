- id: db-0701
  section_id: act-iii-tableau-v-scene-iv
  kind: paragraph
  origin: source
  source_text: HUNT.  We’re going to have our little talk out first.  After that perhaps I’ll let you go, and perhaps I won’t.  It
    all depends on how we get along together.  Now, in a general way, Andrew, and speaking of a man as you find him, I’m all
    for peace and quietness myself.  That’s my usual game, Andrew, but when I do make a dust I’m considered by my friends
    to be rather a good hand at it.  So don’t you tread upon the worm.
  source_languages:

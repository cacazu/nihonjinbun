  translation_ja: メアリー。ね、ああしてお話しになるでしょう。兄さんのことを一言でも口にすると、聞きつけるの。何も見えないみたいでも、兄さんがどんなに父さんの面倒を見て、わたしに優しくしてくれるかは、ちゃんと分かってるみたい。組合長を思うだけで生きていらっしゃるんじゃないかしら。ほら、ついこのあいだまで、わたしも父さんと同じだったわ。いえ、ほんとうのところ、ブロディの人間はみんな組合長に夢中なんだと思う。そうでしょう、ねえ父さん？
  translation_status: reviewed
  source_kind: dialogue

  source_text: SMITH (bowing them out).  Your humble and most devoted servant, George Smith, Esquire.  And so this is the
    garding, is it?  And this is the style of horticulture?  Ha, it is!  (At the mirror.)  In that case George’s mother bids
    him bind his hair.  (Kisses his hand.)  My dearest Duchess,—(To JEAN.)  I say, Jean, there’s a good deal of difference
    between this sort of thing and the way we does it in Libberton’s Wynd.
  source_languages:
  - en

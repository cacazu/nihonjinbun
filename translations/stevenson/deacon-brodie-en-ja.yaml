  translation_ja: スミス（退場する一同にお辞儀して）。何なりとも仰せのままに。ジョージ・スミス紳士にございます。ははあ、これが庭園ってもんですかな？　園芸ってのはこういうしつらえですかい？　ははあ、そうか！（鏡の前で）それなら「母さんはジョージに髪を結えと言う」ってやつだ。（自分の手に口づけして）わがいとしの公爵夫人――。（ジーンに）なあジーン、こういうのと、リバートンズ・ウィンドでおれたちがやるのとじゃ、ずいぶんな違いだぜ。

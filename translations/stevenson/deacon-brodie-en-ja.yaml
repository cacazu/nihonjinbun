- id: db-0444
  section_id: act-ii-tableau-iv-scene-iv
  kind: paragraph
  origin: source
  source_text: LAWSON.  Ay, ay; a bit house on my land in Liberton’s Wynd.  Her man’s awa, puir body; or they tell me sae;
    and I’m concerned for her [she’s unco bonnie to be left her lane].  But it sets me brawly to be finding faut wi’ the puir
    lass, and me an elder, and should be at the plate. [There’ll be twa words about this in the Kirk Session.]  However, it’s
    nane of my business that brings me, or I should tak’ the mair shame to mysel’.  Na, sir, it’s for you; it’s your business
    keeps me frae the kirk.

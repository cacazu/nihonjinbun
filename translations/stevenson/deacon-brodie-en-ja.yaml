  translation_ja: ローソン。おまえの母さんとわしは血を分けたきょうだいだ、ウィリアム・ブロディ。それ以上は問わん。金を使い果たし、名誉を失ったのなら、主よお助けを、名誉を失ったのなら、もう仕方がない。わしが頭を下げねばな。わしがおまえを破滅させることはせん。いや、それだけではないぞ、ウィリアム。誰もが重たい罪を背負っとる。わしも人より多く背負っとるかもしれん。だがおまえ、結婚のときあの子に渡す金を半分でも用意できるなら……［〈おまえを滅ぼすくらいなら〉］……あの母さんの子のおまえのためならな……？　だめか？　半分も用意できんか？　そうか、そうか。今日は胸が痛いよ。痛いし、疲れた。わしがもう少しましな人間だったらな……だがもういい、もういい。胸が痛いよ。助けられるものなら助けてやる。神もご存じだ。［〈おまえを滅ぼすくらいなら。〉］

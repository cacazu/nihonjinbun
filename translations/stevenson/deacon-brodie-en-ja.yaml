  translation_status: reviewed
  source_kind: dialogue
- id: db-0283
  section_id: act-i-tableau-iii-scene-i
  kind: paragraph
  origin: source
  source_text: BRODIE.  Why not!  He asks me why not!  Gods, what a brain it is!  Hark ye, Badger, it’s all very well to be
    King of the Cracksmen, as you call it; but however respectable he may have the misfortune to be, one’s friend is one’s
    friend, and as such must be severely let alone.  What! shall there be no more honour among thieves than there is honesty
    among politicians?  Why, man, if under heaven there were but one poor lock unpicked, and that the lock of one whose claret
    you’ve drunk, and who has babbled of woman across your own mahogany—that lock, sir, were entirely sacred.  Sacred as the
    Kirk of Scotland; sacred as King George upon his throne; sacred as the memory of Bruce and Bannockburn.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 1072
    line_end: 1081
    source_sequence: 1072
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-1072-1081
  translation_ja: ブロディ。なぜだと！　なぜだと聞くのか！　神さま、なんという頭だ！　聞け、アナグマ。おまえの言う押し込みの王様、そりゃ結構。だが運の悪いことに相手がどれほどまっとうな人間だろうと、友は友だ。友には絶対に手を出さんものだ。何だ、政治家に正直さがないのと同じで、盗人にも義理はないとでも？　世界じゅうでまだ開けられていない錠がたった一つ。そしてそれが、こちらがボルドー酒をご馳走になり、こちらのマホガニーの卓を挟んで女の話をした仲の友の錠なら、その錠は、いいか、断じて神聖なんだ。スコットランド教会と同じほど、玉座のジョージ国王と同じほど、ブルース王とバノックバーンの戦いの記憶と同じほど神聖だ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0284
  section_id: act-i-tableau-iii-scene-i
  kind: paragraph
  origin: source
  source_text: MOORE.  Oh, rot!  I ain’t a parson, I ain’t; I never had no college education.  Business is business.  That’s
    wot’s the matter with me.

    line_end: 380
    source_sequence: 377
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-377-380
  translation_ja: ブロディ。とにかく被害に遭ったのではないね。それならもうとっくに知っている。わたしのように商売道具を扱う者の実際的な関心でもないし、検察官のように職務でお調べになるのでもない。それは確かだろう？
  translation_status: reviewed
  source_kind: dialogue
- id: db-0092
  section_id: act-i-tableau-i-scene-ii
  kind: paragraph
  origin: source
  source_text: LESLIE.  I think I can; if for no more.  It’s an interest of my own, you see, and is best described as indescribable,
    and of no manner of moment to anybody.  [It will take no hurt if we put off its discussion till a month of Sundays.]
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719

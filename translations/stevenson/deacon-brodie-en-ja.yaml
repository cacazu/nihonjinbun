- id: db-0610
  section_id: act-ii-tableau-iv-scene-ix
  kind: paragraph
  origin: source
  source_text: 'BRODIE.  Trust me.  No man forgets his vice, you dogs, or forgives it either.  It must be done: Leslie’s to-night
    and the Excise to-morrow.  It shall be done.  This settles it.  They used to fetch and carry for me, and now . . . I’ve
    licked their boots, have I?  I’m their man, their tool, their chattel.  It’s the bottom rung of the ladder of shame.  I
    sound with my foot, and there’s nothing underneath but the black emptiness of damnation.  Ah, Deacon, Deacon, and so this
    is where you’ve been travelling all these years; and it’s for this that you learned French!  The gallows . . . God help
    me, it begins to dog me like my shadow.  There’s a step to take!  And the jerk upon your spine!  How’s a man to die with
    a night-cap on?  I’ve done with this.  Over yonder, across the great ocean, is a new land, with new characters, and perhaps
    new lives.  The sun shines, and the bells ring, and it’s a place where men live gladly; and the Deacon himself can walk
    without terror, and begin again like a new-born child.  It must be good to see day again and not to fear; it must be good
    to be one’s self with all men.  Happy like a child, wise like a man, free like God’s angels . . . should I work these
    hands off and eat crusts, there were a life to make me young and good again.  And it’s only over the sea!  O man, you
    have been blind, and now your eyes are opened.  It was half a life’s nightmare, and now you are awake.  Up, Deacon, up,
    it’s hope that’s at the window!  Mary! Mary! Mary!'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2116
    line_end: 2137
    source_sequence: 2116
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2116-2137
  translation_ja: ブロディ。忘れるものか。この犬ども。人は自分の悪事を忘れはせんし、許しもしない。やらなきゃならん。今夜はレズリー、明日は物品税務所。やるとも。これで決まった。ついこの間までわたしの使い走りだった連中に、今じゃ……靴をなめてやったのか？　やつらの手下、道具、持ち物だ。恥の梯子のいちばん下の段だ。その下を足で探っても、地獄の真っ暗な虚ろしかない。ああ、組合長、組合長、何年もかかって行き着いたのがここか。フランス語まで習った果てがこれか！　絞首台……神よお助けを、自分の影みたいにつきまとい始めた。あの一歩は大変だぞ！　背骨ががくんと引かれる！　寝帽子なんかかぶって、人はどうやって死ねばいいんだ？　こんなことはもうたくさんだ。向こうの、広い海を渡った先に新しい土地がある。新しく出会う人々、もしかすると新しい人生まで。日が差し、鐘が鳴り、人が楽しく生きていく場所だ。組合長でさえ怯えずに歩き、生まれたばかりの子のようにやり直せる。怯えずにまた日の光を見るのは、さぞいいことだろうな。誰の前でも自分のままでいられるのは、さぞいいだろう。子供のように幸せで、一人前の男のように賢く、神の天使のように自由だ。……手が擦り切れるほど働いて、固いパンの耳しか食べられなくても、そこならわたしは若く、善良な人間に戻れる。海を渡るだけだ！　ああ、なんということだ、今までは何も見えていなかった。それが今こそ目が開いた。半生にわたる悪夢から、ついに目が覚めたんだ。立て、組合長、立て。窓辺に希望が来ているぞ！　メアリー！　メアリー！　メアリー！
  translation_status: reviewed

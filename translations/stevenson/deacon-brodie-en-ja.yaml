  source_text: BRODIE.  It is in vain.  I cannot leave till I have said.  There is a man; I must obey him.  If I slip my chain
    till he has done with me, the hue and cry will blaze about the country; every outport will be shut; I shall return to
    the gallows.  He is a man that will stick at nothing.

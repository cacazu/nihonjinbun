    original_unit_id: line-2503-2510
  translation_ja: ハント。そうか、ジョーディから指図を受けるんだな？　いいか、エインズリー。もうおれが誰かは知ってるな。捕吏のハントだ。今朝はジェミー・リヴァーズを牢にぶち込んだ。今晩はおまえを捕まえた。しめくくりは組合長だ。わかったか？　よし。ではよく聞け。この腕輪を外して、そのご自慢の寝床に帰してやる。ただし、〈公爵〉に会ったらすぐ、検察官殿のところにいるおれのもとに来て、〈公爵〉がどういう腹づもりか知らせるんだ。よそで一言でもしゃべってみろ、そうしたら……カクッ！　承知したか？
  translation_status: reviewed
  source_kind: dialogue
- id: db-0724
  section_id: act-iii-tableau-v-scene-iv
  kind: paragraph
  origin: source
  source_text: AINSLIE.  Never you fear that.  I’ll tak’ my bannet an’ come straucht to ye.  Eh God, I’m glad it’s nae mair
    nor that to start wi’.  An’ may the Lord bless ye, dear, kind gentleman, for your kindness.  May the Lord bless ye.
  source_languages:

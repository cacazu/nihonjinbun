  translation_ja: ブロディ。そのつもりです。あさってに。これより早くは出られません。そのときには逃げます。ああ、神が見ておいでだ。今とは違う、もっとましな人生を送れるよう努めます。あなたの友情に、流してくださった涙に……その涙に恥じない人間になれるように。それからおまえにも恥じない人間になれるようにするよ、ジーン。さあ、目隠しが落ちた。今こそ自分が見える。ああ、おまえにさえ、なんとふさわしくなかったか。

- id: db-0722
  section_id: act-iii-tableau-v-scene-iv
  kind: paragraph
  origin: source
  source_text: 'AINSLIE.  Dear, kind gentleman, I dinna rightly ken: the Deacon’s that sair angered wi’ me.  I’m to get my
    orders frae Geordie the nicht.'
  source_languages:
  - en
  source_locations:

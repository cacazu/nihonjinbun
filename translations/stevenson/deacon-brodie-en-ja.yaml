  source_text: BRODIE.  It is my purpose; the day after to-morrow.  It cannot be before. Then I will fly; and O, as God sees
    me, I will strive to make a new and a better life, and to be worthy of your friendship, and of your tears . . . your tears.  And
    to be worthy of you too, Jean; for I see now that the bandage has fallen from my eyes; I see myself, O how unworthy even
    of you.
  source_languages:
  - en
  source_locations:

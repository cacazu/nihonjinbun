  translation_ja: ブロディ。正しくもあり、間違ってもいる。おまえはできるものならやってみろとけしかけた。わたしは酔っていたし、負けん気を刺激された。で、ほとんどやり遂げた。そのうえ、卑しいまねと分かっていても、やるのが楽しかった。向こうはわたしの友だ。その日、わたしと食事をした。わたしは物語の中の男になったような気で、塀を登り、食料部屋の屋根を這って、窓台に上がった。手首をひとひねり。知ってるだろう。それで窓は開いた。地獄の穴みたいに真っ暗で、賭けに勝ったと思ったら、ひゅっと、何かが中で落ち、誰かも一緒に倒れた。ひと跳びして、打ち上げ花火のように逃げたよ。あれは、かわいそうに、友本人だった。あいつがわたしを捕まえて窓の下の夜警に渡したとしても、今のわたし以上の悪党だとは自分を思えなかったろう。
  translation_status: reviewed
  source_kind: dialogue

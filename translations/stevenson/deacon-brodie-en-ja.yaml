  translation_ja: ブロディ老人。職人の組合長ですよ、旦那――木工職人の組合長――わしの息子だ！　あの子の母親が、母親が、生きてこれを見てくれさえしたら！
  translation_status: reviewed
  source_kind: dialogue
- id: db-0076
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  You hear how he runs on.  A word about my brother and he catches it.  ’Tis as if he were awake in his
    poor blind way to all the Deacon’s care for him and all the Deacon’s kindness to me.  I believe he only lives in the thought
    of the Deacon.  There, it is not so long since I was one with him.  But indeed I think we are all Deacon-mad, we Brodies.  Are
    we not, daddie dear?
  source_languages:
  - en
  source_locations:

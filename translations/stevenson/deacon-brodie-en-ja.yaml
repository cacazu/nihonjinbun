  kind: paragraph
  origin: source
  source_text: 'LAWSON.  Hoot-toot.  A wheen nonsense: an honest man’s an honest man, and a randy thief’s a randy thief, and
    neither mair nor less.  Mary, my lamb, it’s time you were hame, and had you beauty sleep.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719

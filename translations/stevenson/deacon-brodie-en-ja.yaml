  translation_ja: メアリー。わたしにはそれで足りるかもしれない。でもあの人はそうはいかないし、それで済ませるわけにはいかないの。わたしに結婚を申し込んで、ご自分の幸せはわたしの手にあるとおっしゃるのよ。頼りない手だけれど、たとえこの胸が張り裂けても、あの人を見捨てはしないわ！　世界中の女の人の中から、あの人がわたしを選んで、頼りにしてくださったのなら、その選択に恥じないだけの勇気を、わたしもどこかから見つけてくるわ。心にあることを残らず話して、こうするのが正しいと納得させてくれるまでは、この部屋を出るなんてさせないわ。
  translation_status: reviewed
  source_kind: dialogue

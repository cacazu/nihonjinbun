  section_id: act-ii-tableau-iv-scene-iv
  kind: paragraph
  origin: source
  source_text: LAWSON.  You’re the son of my sister, William Brodie.  Mair than that I stop not to inquire.  If the siller
    is spent, and the honour tint—Lord help us, and the honour tint!—sae be it, I maun bow the head.  Ruin shallna come by
    me.  Na, and I’ll say mair, William; we have a’ our weary sins upon our backs, and maybe I have mair than mony.  But,
    man, if ye could bring half the jointure . . . [potius quam pereas] . . . for your mither’s son?  Na?  You couldna bring
    the half?  Weel, weel, it’s a sair heart I have this day, a sair heart and a weary.  If I were a better man mysel’ . .
    . but there, there, it’s a sair heart that I have gotten. And the Lord kens I’ll help ye if I can.  [Potius quam pereas.]
  source_languages:
  - en
  source_locations:

- id: db-0251
  section_id: act-i-tableau-ii-scene-ii
  kind: paragraph
  origin: source
  source_text: 'Two hundred pounds reward.  Curious thing.  One burglary after another, and these Scotch blockheads without
    a man to show for it.  Jock runs east, and Sawney cuts west; everything’s at a deadlock; and they go on calling themselves
    thief-catchers!  [By jingo, I’ll show them how we do it down South!  Well, I’ve worn out a good deal of saddle leather
    over Jemmy Rivers; but here’s for new breeches if you like.]  Let’s have another queer at the list.  (Reads.) ‘Humphrey
    Moore, otherwise Badger; aged forty, thick-set, dark, close-cropped; has been a prize-fighter; no apparent occupation.’  Badger’s
    an old friend of mine, ‘George Smith, otherwise the Dook, otherwise Jingling Geordie; red-haired and curly, slight, flash;
    an old thimble-rig; has been a stroller; suspected of smuggling; an associate of loose women.’  G. S., Esquire, is another
    of my flock.  ‘Andrew Ainslie, otherwise Slink Ainslie; aged thirty-five; thin, white-faced, lank-haired; no occupation;
    has been in trouble for reset of theft and subornation of youth; might be useful as king’s evidence.’  That’s an acquaintance
    to make.  ‘Jock Hamilton, otherwise Sweepie,’ and so on.  [’Willie M’Glashan,’ hum—yes, and so on, and so on.]  Ha! here’s
    the man I want.  ‘William Brodie, Deacon of the Wrights, about thirty; tall, slim, dark; wears his own hair; is often
    at Clarke’s, but seemingly for purposes of amusement only; [is nephew to the Procurator-Fiscal; is commercially sound,
    but has of late (it is supposed) been short of cash; has lost much at cock-fighting;] is proud, clever, of good repute,
    but is fond of adventures and secrecy, and keeps low company.’  Now, here’s what I ask myself: here’s this list of the
    family party that drop into Mother Clarke’s; it’s been in the hands of these nincompoops for weeks, and I’m the first
    to cry Queer Street!  Two well-known cracksmen, Badger and the Dook! why, there’s Jack in the Orchard at once.  This here
    topsawyer work they talk about, of course that’s a chalk above Badger and the Dook.  But how about our Mohock-tradesman?  ‘Purposes
    of amusement!’  What next?  Deacon of the Wrights? and wright in their damned lingo means a kind of carpenter, I fancy?  Why,
    damme, it’s the man’s trade!  I’ll look you up, Mr. William Brodie, Deacon of the Wrights.  As sure as my name’s Jerry
    Hunt, I wouldn’t take one-ninety-nine in gold for my chance of that ’ere two hundred!'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 927
    line_end: 961
    source_sequence: 927
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-927-961
  translation_ja: 懸賞金二百ポンド。妙な話だね。押し込みが次から次へ起きて、スコットランドの石頭ども、犯人を一人も出せない。ジョックは東へ飛び、ソーニーは西へ走り、何もかも行き詰まり。それで盗人捕りを名乗ってるんだから！　［まったく、このおれが南のやり方を見せてやるぞ！　やれやれ、ジェミー・リヴァーズを追って鞍の革をずいぶんすり減らしたが、どうです、こっちの稼ぎで新しい半ズボンでも買おうじゃないか。］もうひと目、名簿をのぞいてみよう。（読む）「ハンフリー・ムーア、別名アナグマ。四十歳。ずんぐりとし、色が黒く、髪は短く刈っている。元賞金目当ての拳闘家。はっきりした職はない」。アナグマは昔なじみだ。「ジョージ・スミス、別名〈公爵〉、別名鈴鳴らしのジョーディ。赤毛で巻き毛。細身、派手。指ぬき賭博でいかさまをした前歴あり。旅芸人をしていたことがある。密輸の疑いあり。身持ちのよくない女たちとつきあいあり」。Ｇ・Ｓ紳士もおれの羊の一匹。「アンドルー・エインズリー、別名こそこそエインズリー。三十五歳。痩せて青白く、髪はまっすぐでぺたりとしている。無職。盗品の受け取りと若者に悪事をそそのかした件で前歴あり。王の側の証人として役に立つかもしれない」。こいつとは知り合っておくことだ。「ジョック・ハミルトン、別名煙突掃除屋」、などなど。［「ウィリー・マグラシャン」、ふむ、そう、それから何やらかやら。］ああ、いたぞ。おれの探していた男だ。「ウィリアム・ブロディ、木工職人組合の長。三十歳ぐらい。背が高く、すらりとし、色は黒い。かつらは着けず、地毛のまま。クラークの店によく来るが、見たところ遊びのためだけ。［検察官の甥。商売の足もとは堅いが、近ごろ金に困っているらしい。闘鶏で大損をしている。］誇り高く、頭が切れ、評判もいいが、冒険と秘密を好み、身分の低い連中とつきあう」。さて、こういうことだ。クラーク婆さんの店に顔を出すご一家の名簿がある。とんまどもは何週間も手もとに置いてたのに、真っ先に臭いぞと叫んだのがおれだ！　札付きの押し込み二人、アナグマと〈公爵〉！　ほら、さっそく果樹園にジャックがいるじゃないか。あいつらが言うあの見事な腕前はもちろん、アナグマと〈公爵〉より一枚も二枚も上だ。じゃ、あのならず者の職人さんはどうだい？　「遊びのため」！　この次は何だ？　木工職人組合の長？　あいつらのいまいましい言葉で木工職人ってのは、何かしら大工の類だろう？　まったく、あの男の商売じゃないか！　よく調べさせてもらいますよ、ウィリアム・ブロディさん、木工職人組合の長さま。ジェリー・ハントの名にかけて、この二百ポンドが取れる見込みは、百九十九ポンドの金貨とだって引き換えないね！
  translation_status: reviewed

  kind: paragraph
  origin: source
  source_text: MARY.  It might be enough for me; but it is not, and it cannot be, enough for him.  He has asked me to be his
    wife; he tells me his happiness is in my hands—poor hands, but they shall not fail him, if my poor heart should break!  If
    he has chosen and set his hopes upon me, of all women in the world, I shall find courage somewhere to be worthy of the
    choice.  And I dare you to leave this room until you tell me all your thoughts—until you prove that this is good and right.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719

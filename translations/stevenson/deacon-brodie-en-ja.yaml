- id: db-0810
  section_id: act-iii-tableau-vi-scene-iii
  kind: paragraph
  origin: source
  source_text: 'LESLIE.  Past ten?  Ah, there’s a long night before you and me, watchmen. Heavens, what a trade!  But it will
    be something to laugh over with Mary and . . . with him?  Damn it, the delusion is too strong for me.  It’s a thing to
    be ashamed of.  ‘We Brodies’: how she says it!  ‘We Brodies and our Deacon’: what a pride she takes in it, and how good
    it sounds to me! ‘Deacon of his craft, sir, Deacon of the . . .!  (BRODIE, masked, appears without at the window, which
    he proceeds to force.)  Ha! I knew he’d come.  I was sure of it.  (He crouches near and nearer to the window, keeping
    in the shade.)  And I know you too.  I swear I know you.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt

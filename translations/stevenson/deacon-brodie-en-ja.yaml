  - source_id: gutenberg-719
    original_unit_id: line-318-322
  translation_ja: レズリー。こうして君の隣に座っていると、ほんとうにいい気分だ。そのうち、いつもこうしていられるよ。組合長への話、僕にさせてくれない？　どうしても自分で話すっていうのかい？　僕だって滔々と語れるよ、メアリー。きっと心を動かせる。他の誰かに、たとえ君にでも、自分の幸せを任せるのが、僕にはどれほど怖いことか！
  translation_status: reviewed
  source_kind: dialogue
- id: db-0073
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  He must hear of my good fortune from none but me.  And besides, you do not understand.  We are not like
    families, we Brodies.  We are so clannish, we hold so close together.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719

  source_text: HUNT (looking after them ruefully).  And these were the very parties I was looking for!  [Ah, Jerry, Jerry,
    if they knew this at the office!] Well, the market price of that ’ere two hundred is a trifle on the decline and fall.  (Looking
    L.)  Hullo!  (Slapping his thigh).  Send me victorious!  It’s king’s evidence on two legs.  (Advancing with great cordiality
    to meet AINSLIE, who enters L.)  And so your name’s Andrew Ainslie, is it?  As I was saying, you’re the very party I was
    looking for.  Ain’t it strange, now, that I should have dropped across you comfortable and promiscuous like this?

  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: LESLIE.  My wife! my wife!  Here on my heart!  It is I that must kneel . . . I that must kneel to you.
  source_languages:
  - en
  source_locations:

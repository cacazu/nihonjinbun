- id: db-0904
  section_id: act-iv-tableau-vii
  kind: paragraph
  origin: source
  source_text: 'The Stage represents the outside of the Excise Office in Chessel’s Court.  At the back, L.C., an archway opening
    on the High Street. The door of the Excise in wing, R.; the opposite side of the stage is lumbered with barrels, packing-cases,
    etc.  Moonlight; the Excise Office casts a shadow over half the stage.  A clock strikes the hour.  A round of the City
    Guard, with halberts, lanterns, etc., enters and goes out again by the arch, after having examined the fastenings of the
    great door and the lumber on the left.  Cry without in the High Street: ‘Ten by the bell, and a fine clear night.’ Then
    enter cautiously by the arch, SMITH and MOORE, with AINSLIE loaded with tools.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3041
    line_end: 3051
    source_sequence: 3041
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3041-3051
  translation_ja: 舞台はチェッセルズ・コートの物品税務所の外。奥の中央やや左に、ハイ・ストリートへ出るアーチの通路。物品税務所の戸は右の舞台袖。反対側には樽、荷造りの木箱などが雑然と積んである。月明かり。物品税務所の影が舞台の半分を覆う。時計が時を打つ。見回りの市警備隊が、鉾槍や提灯などを手に、アーチから入って来る。大戸の錠と左側の積み荷を調べて、またアーチから出て行く。ハイ・ストリートからの声。「鐘が十時を打った。よく晴れた晩だ。」次いでスミスとムーアがそっとアーチから入る。道具を山と担いだエインズリーがついてくる。
  translation_status: reviewed

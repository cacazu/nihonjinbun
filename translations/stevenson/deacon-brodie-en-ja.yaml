  kind: paragraph
  origin: source
  source_text: JEAN.  He was that soft-spoken, butter wouldna melt in his mouth; and he keept aye harp, harpin’; but after
    that let out, he got neither black nor white frae me.  Just that ae word and nae mair; and at the hinder end he just speired
    straucht out, whaur it was ye got your siller frae.

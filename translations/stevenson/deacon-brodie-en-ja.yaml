- id: db-0801
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LESLIE.  I did that.  And what’s more, I’ve sat every night in case of his return.  I promise you, Procurator,
    he shall not slip me twice. Meanwhile I’m worried and put out.  You understand how such a fancy will upset a man.  I’m
    uneasy with my friends and on bad terms with my own conscience.  I keep watching, spying, comparing, putting two and two
    together, hunting for resemblances until my head goes round.  It’s like a puzzle in a dream.  Only yesterday I thought
    I had him.  And who d’you think it was?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719

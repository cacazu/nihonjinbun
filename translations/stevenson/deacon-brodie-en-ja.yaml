  translation_ja: レズリー。ええ。そのうえ、また来るかと思って、毎晩ここで見張っています。今度は逃がしませんよ、検察官殿。それまでは気がかりで、どうにも落ち着きません。こんな考えにとらわれたら、気の休まらないのもおわかりでしょう。友人と一緒でも落ち着かないし、自分の良心とも折り合いが悪いんです。観察して、探りを入れて、比べて、あれとこれを結びつけ、似たところを探す。頭がくらくらするまでね。夢の中で謎解きをしているようです。つい昨日、これだと思った相手がいたんです。誰だと思います？
  translation_status: reviewed
  source_kind: dialogue

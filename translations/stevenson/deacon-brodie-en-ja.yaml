- id: db-1114
  section_id: act-v-tableau-viii-scene-vii
  kind: paragraph
  origin: source
  source_text: 'BRODIE (behind the table).  One moment, officer: I have a word to say before witnesses ere I go.  In all this
    there is but one man guilty; and that man is I.  None else has sinned; none else must suffer.  This poor woman (pointing
    to JEAN) I have used; she never understood.  Mr. Procurator-Fiscal, that is my dying confession.  (He snatches his hanger
    from the table, and rushes upon HUNT, who parries, and runs him through.  He reels across the stage and falls.)  The new
    life . . . the new life!  (He dies.)'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3681
    line_end: 3688
    source_sequence: 3681
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3681-3688
  translation_ja: ブロディ（卓の後ろから）。ちょっと待ってください、捕吏殿。行く前に、証人の前で一言あります。すべてのことで罪があるのは一人だけ。その男はわたしです。他には誰も罪を犯してはいません。誰も罰を受けてはなりません。この気の毒な女は（ジーンを指す）わたしが利用しました。女は何も知りませんでした。検察官殿、これがわたしの今生の告白です。（卓から短い剣をひったくり、ハントに飛びかかる。ハントは受け流し、ブロディを刺し貫く。ブロディはよろめいて舞台を横切り、倒れる。）新しい人生が……新しい人生が！（息絶える。）
  translation_status: reviewed

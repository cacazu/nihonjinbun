  translation_ja: スミス（ランタンに火をともす）。よしよし、口やかましい旦那。古代ローマの情熱に我を忘れちゃいけません。それがおまえの決まり文句だろ。道具はここに。崇高にして美なるものの見本だね。あとは仲よしの組合長が、ゆうべよりうまくやってくれることを祈るだけ。下手を打ったら、おれはこの稼業から足を洗う。それだけさ。そしたらジョージとかわいい奥さんと黒人の従僕、つつがなく暮らして、死が二人を分かつまでだ。
  translation_status: reviewed

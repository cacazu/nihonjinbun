- id: db-0807
  section_id: act-iii-tableau-vi-scene-iii
  kind: paragraph
  origin: source
  source_text: LESLIE (calling).  In good time, never fear!  (He carefully bolts and chains the door.)  The old gentleman
    seems upset.  What for, I wonder? Has he had a masked visitor?  Why not?  It’s the fashion.  Out with the lights.  (Blows
    out the candles.  The stage is only lighted by the moon through the window.)  He is sure to come one night or other.  He
    must come.  Right or wrong, I feel it in the air.  Man, but I know you, I know you somewhere.  That trick of the shoulders,
    the hang of the clothes—whose are they?  Where have I seen them?  And then, that single look of the eye, that one glance
    about the room as the window opened . . . it is almost friendly; I have caught it over the glass’s rim!  If it should
    be . . . his?  No, his it is not.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt

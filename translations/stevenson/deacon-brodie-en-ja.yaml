  translation_ja: ローソン。こらこら。馬鹿なことをぺらぺらと。正直者は正直者、ならず者の盗人はならず者の盗人。それだけの話だ。メアリー、うちのかわいい子、もう帰っておやすみ。夜更かしはその器量に毒だよ。
  translation_status: reviewed
  source_kind: dialogue

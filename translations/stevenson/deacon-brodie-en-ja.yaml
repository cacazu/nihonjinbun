  source_kind: dialogue
- id: db-0777
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LESLIE.  Well, I only fancied.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2660
    line_end: 2660
    source_sequence: 2660
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2660-2660
  translation_ja: レズリー。ええ、そう見えただけです。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0778
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LAWSON.  Ye had nae possible excuse to fancy.  Fancy?  Perfect trash and nonsense.  Look at yersel’.  Ye look
    like a ghaist, ye’re white-like, ye’re black aboot the een; and do ye find me deavin’ ye wi’ fancies?  Or William Brodie
    either?  I’ll say that for him.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2662
    line_end: 2665
    source_sequence: 2662
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2662-2665
  translation_ja: ローソン。そう見える理由なんか一つもない。そう見えたと？　くだらん、馬鹿げとる。自分を見てみなさい。幽霊みたいで、青白くて、目のまわりは真っ黒じゃないか。わしが思い込みをぺらぺらしゃべって迷惑をかけたか？　ウィリアム・ブロディも、そんなことはせんだろう？　あいつについては、それだけは言ってやれる。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0779
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LESLIE.  ’Tis not sorrow that alters my complexion; I’ve something else on hand.  Come, I’ll tell you, under
    seal.  I’ve not been in bed till daylight for a week.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2667
    line_end: 2669
    source_sequence: 2667
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2667-2669
  translation_ja: レズリー。顔色が悪いのは、悲しみのせいじゃありません。別のことをやっていましてね。では、内密にしていただけるなら。ここ一週間、夜明けまで寝床に入ってないんです。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0780
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LAWSON.  Weel, there’s nae sense in the like o’ that.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2671
    line_end: 2671
    source_sequence: 2671
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2671-2671
  translation_ja: ローソン。さあ、そんなことをしても意味がないぞ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0781
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LESLIE.  Gad, but there is though.  Why, Procurator, this is town’s business; this is a municipal affair; I’m
    a public character.  Why?  Ah, here’s a nut for the Crown Prosecutor!  I’m a bit of a party to a robbery.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2673
    line_end: 2676
    source_sequence: 2673
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2673-2676
  translation_ja: レズリー。ところが、意味があるんです。いいですか、検察官殿、町の問題なんです。市政にかかわる話ですよ。僕も公人になったというわけです。なぜかと？　国王陛下の検察官に、これは難問ですよ！　僕は少々、押し込みにかかわっていましてね。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0782
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LAWSON.  Guid guide us, man, what d’ye mean?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2678
    line_end: 2678
    source_sequence: 2678
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2678-2678
  translation_ja: ローソン。神よお導きを。おい、どういうことだ？
  translation_status: reviewed
  source_kind: dialogue
- id: db-0783
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LESLIE.  You shall hear.  A week ago to-night, I was passing through this very room without a candle on my
    way to bed, when . . . what should I see, but a masked man fumbling at that window!  How he did the Lord knows.  I suspect,
    Procurator, it was not the first he’d tried . . . for he opened it as handily as his own front door.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2680
    line_end: 2684
    source_sequence: 2680
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2680-2684
  translation_ja: レズリー。まあお聞きください。一週間前の晩、寝ようと思って、ろうそくを持たずにこの部屋を通ったときです。何が目に入ったと思います？　仮面をつけた男が、そこの窓をいじっていたんですよ。どうやったのかは神のみぞ知る、です。検察官殿、窓をそうやって開けるのは最初じゃなかったんでしょうね……自分の家の戸みたいに、いとも手際よく開けましたから。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0784
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LAWSON.  Preserve me!  Another of thae robberies!
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2686
    line_end: 2686
    source_sequence: 2686
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2686-2686
  translation_ja: ローソン。なんということだ！　例の押し込みの続きか！
  translation_status: reviewed
  source_kind: dialogue
- id: db-0785
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LESLIE.  That’s it.  And, of course, I tried to seize him.  But the rascal was too quick.  He was down and
    away in an instant.  You never saw a thing so daring and adroit.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2688
    line_end: 2690
    source_sequence: 2688
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2688-2690
  translation_ja: レズリー。そうです。もちろん、ひっ捕らえようとしました。でもやつはすばしっこくてね。さっと降りたかと思うと、もういない。あんなに度胸があって身のこなしが鮮やかなのは、見たこともありませんよ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0786
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LAWSON.  Is that a’?  Ye’re a bauld lad, I’ll say that for ye.  I’m glad it wasna waur.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2692
    line_end: 2693
    source_sequence: 2692
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2692-2693
  translation_ja: ローソン。それだけか？　度胸があるな、君も。いや、それは言っておこう。ひどいことにならなくてよかった。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0787
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LESLIE.  Yes, that’s all plain sailing.  But here’s the hitch.  Why didn’t I tell the Procurator-Fiscal?  You
    never thought of that.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2695
    line_end: 2696
    source_sequence: 2695
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2695-2696
  translation_ja: レズリー。ええ、そこまでは何でもない。けど、引っかかるのはここなんです。なぜ僕が検察官にお知らせしなかったのか。お考えになりませんでしたか。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0788
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LAWSON.  No, man.  Why?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2698
    line_end: 2698
    source_sequence: 2698
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2698-2698
  translation_ja: ローソン。考えもせんかったな。なぜだ？
  translation_status: reviewed
  source_kind: dialogue
- id: db-0789
  section_id: act-iii-tableau-vi-scene-ii
  kind: paragraph
  origin: source
  source_text: LESLIE.  Aha!  There’s the riddle.  Will you guess?  No? . . . I thought I knew the man.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2700
    line_end: 2701

  translation_ja: レズリー。二人で熱心に話していたから置いてきた。親愛なる検察官殿はいま、あの謎の押し込み事件のことで頭がいっぱいで――。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0042
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  I know!—
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 233
    line_end: 233
    source_sequence: 233
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-233-233
  translation_ja: メアリー。知ってるわ！
  translation_status: reviewed
  source_kind: dialogue
- id: db-0043
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  Still, all of him that is not magistrate and official is politician and citizen; and he has been striving
    his hardest to undermine the Deacon’s principles, and win the Deacon’s vote and interest.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 235
    line_end: 237
    source_sequence: 235
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-235-237
  translation_ja: レズリー。もっとも、役人として仕事をしていないときは政治家でもあり、市民の一人でもある。それで組合長の信念を突き崩して、票と口添えを取りつけようと懸命だったよ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0044
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  They are worth having, are they not?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 239
    line_end: 239
    source_sequence: 239
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-239-239
  translation_ja: メアリー。それだけ手に入れる値打ちのあるものじゃない？
  translation_status: reviewed
  source_kind: dialogue
- id: db-0045
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  The Procurator seems to think that having them makes the difference between winning and losing.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 241
    line_end: 242
    source_sequence: 241
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-241-242
  translation_ja: レズリー。検察官殿は、それが手に入るかどうかで勝ち負けが決まると思っているみたいだね。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0046
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  Did he say so?  You may rely upon it that he knows.  There are not many in Edinburgh who can match with
    our Will.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 244
    line_end: 245
    source_sequence: 244
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-244-245
  translation_ja: メアリー。そうおっしゃったの？　きっとよくお分かりなのね。エディンバラに、うちのウィルに並べる人なんてそうはいないわ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0047
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  There shall be as many as you please, and not one more.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 247
    line_end: 247
    source_sequence: 247
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-247-247
  translation_ja: レズリー。君がいいと言うだけはいるさ。それ以上は一人もいない。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0048
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  How I should like to have heard you!  What did uncle say?  Did he speak of the Town Council again?  Did
    he tell Will what a wonderful Bailie he would make?  O why did you come away?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 249
    line_end: 251
    source_sequence: 249
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-249-251
  translation_ja: メアリー。あなたたちの話、聞きたかったわ！　叔父さまは何て？　また市議会の話をなさった？　ウィルなら立派な市参事になれるっておっしゃったの？　ああ、どうして帰ってきちゃったの。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0049
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  I could not pretend to listen any longer.  The election is months off yet; and if it were not—if it
    were tramping upstairs this moment—drums, flags, cockades, guineas, candidates, and all!—how should I care for it?  What
    are Whig and Tory to me?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 253
    line_end: 256
    source_sequence: 253
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-253-256
  translation_ja: レズリー。もう聞くふりもできなかったんだ。選挙はまだ何か月も先だろう。それがたとえ今この瞬間、太鼓も旗も帽章も、金貨も候補者も引き連れて階段を上ってこようと、僕に何の関わりがある？　ホイッグもトーリーも知ったことか。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0050
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  O fie on you!  It is for every man to concern himself in the common weal.  Mr. Leslie—Leslie of the
    Craig!—should know that much at least.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 258
    line_end: 260
    source_sequence: 258
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-258-260
  translation_ja: メアリー。まあ、恥ずかしい！　みんなのためになることは、男なら誰でも気にかけるべきよ。レズリーさん、クレイグのレズリー家の方でしょう？　それくらいご存じのはずだわ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0051
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  And be a politician like the Deacon?  All in good time, but not now.  I hearkened while I could, and
    when I could no more I slipped out and followed my heart.  I hoped I should be welcome.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 262
    line_end: 264
    source_sequence: 262
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-262-264
  translation_ja: レズリー。それで組合長みたいな政治家に？　いずれそのうち、でも今じゃないね。聞けるうちは聞いていたけれど、もう無理だと思って抜け出し、心の向くほうへ来たんだ。歓迎してもらえると思ったよ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0052
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  I suppose you mean to be unkind.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 266
    line_end: 266
    source_sequence: 266
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-266-266
  translation_ja: メアリー。わざと意地悪を言うのね。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0053
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  Tit for tat.  Did you not ask me why I came away?  And is it usual for a young lady to say ‘Mr.’ to
    the man she means to marry?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 268
    line_end: 269
    source_sequence: 268
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-268-269
  translation_ja: レズリー。おあいこさ。どうして帰ってきたかと聞いたのは君だよ。それにお嬢さんは、結婚するつもりの相手を「レズリーさん」なんて呼ぶものなのかい？
  translation_status: reviewed
  source_kind: dialogue
- id: db-0054
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  That is for the young lady to decide, sir.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 271
    line_end: 271
    source_sequence: 271
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-271-271
  translation_ja: メアリー。それはお嬢さんの決めることですよ、あなた。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0055
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  And against that judgment there shall be no appeal?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 273
    line_end: 273
    source_sequence: 273
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-273-273
  translation_ja: レズリー。その判決に異議を申し立てることはできないんだね？
  translation_status: reviewed
  source_kind: dialogue
- id: db-0056
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  O, if you mean to argue!—
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 275
    line_end: 275
    source_sequence: 275
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-275-275
  translation_ja: メアリー。まあ、まだ言い争うつもりなら――。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0057
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  I do not mean to argue.  I am content to love and be loved.  I think I am the happiest man in the
    world.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 277
    line_end: 278
    source_sequence: 277
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-277-278
  translation_ja: レズリー。言い争うつもりはないよ。愛して、愛されて、それで十分だ。僕は世界でいちばん幸せな男だと思う。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0058
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  That is as it should be; for I am the happiest girl.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 280
    line_end: 280
    source_sequence: 280
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-280-280
  translation_ja: メアリー。そうでなくちゃ。わたしがいちばん幸せな娘なんだもの。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0059
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  Why not say the happiest wife?  I have your word, and you have mine.  Is not that enough?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 282
    line_end: 283
    source_sequence: 282
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-282-283
  translation_ja: レズリー。どうしていちばん幸せな妻と言わないの？　君は僕に誓ったし、僕も君に誓った。それで十分じゃないか。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0060
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  Have you so soon forgotten?  Did I not tell you how it must be as my brother wills?  I can do only as
    he bids me.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 285
    line_end: 286
    source_sequence: 285
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-285-286
  translation_ja: メアリー。もう忘れたの？　兄さんのお心しだいだと言ったでしょう。わたしは兄さんの言うとおりにしかできないわ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0061
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  Then you have not spoken as you promised?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 288
    line_end: 288
    source_sequence: 288
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-288-288
  translation_ja: レズリー。じゃ、約束どおりに話してくれなかったの？
  translation_status: reviewed
  source_kind: dialogue
- id: db-0062
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  I have been too happy to speak.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 290
    line_end: 290
    source_sequence: 290
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-290-290
  translation_ja: メアリー。幸せすぎて、話せなかったの。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0063
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  I am his friend.  Precious as you are, he will trust you to me. He has but to know how I love you,
    Mary, and how your life is all in your love of me, to give us his blessing with a full heart.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 292
    line_end: 294
    source_sequence: 292
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-292-294
  translation_ja: レズリー。僕はあの人の友達だ。かけがえのない君だけど、きっと僕に託してくれるよ。どんなに僕が君を愛しているか、メアリー、君がどんなに僕を愛して生きているか、それさえ分かれば、心から祝福してくれる。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0064
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  I am sure of him.  It is that which makes my happiness complete. Even to our marriage I should find
    it hard to say ‘Yes’ when he said ‘No.’
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 296
    line_end: 298
    source_sequence: 296
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-296-298
  translation_ja: メアリー。そうに決まってるわ。だからわたしは申し分なく幸せなの。わたしたちの結婚のことでも、兄さんが「だめだ」とおっしゃるのに「いいわ」と言うなんて、わたしにはなかなかできそうもないから。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0065
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  Your father is trying to speak.  I’ll wager he echoes you.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 300
    line_end: 300
    source_sequence: 300
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-300-300
  translation_ja: レズリー。お父さんが何か言おうとなさってる。きっと君と同じことをおっしゃるんだ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0066
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY (to OLD BRODIE).  My poor dearie!  Do you want to say anything to me?  No?  Is it to Mr. Leslie, then?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 302
    line_end: 303
    source_sequence: 302
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-302-303
  translation_ja: メアリー（ブロディ老人に）。ねえ、父さん。わたしに何かおっしゃりたいの？　違うの？　じゃレズリーさんに？
  translation_status: reviewed
  annotations:
  - side: source
    kind: emphasis
    span:
      start: 6
      end: 8
      exact: to
  source_kind: dialogue
- id: db-0067
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  I am listening, Mr. Brodie.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 305
    line_end: 305
    source_sequence: 305
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-305-305
  translation_ja: レズリー。伺いましょう、ブロディさん。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0068
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: MARY.  What is it, daddie?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 307
    line_end: 307
    source_sequence: 307
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-307-307
  translation_ja: メアリー。なあに、父さん。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0069
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: OLD BRODIE.  My son—the Deacon—Deacon Brodie—the first at school.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 309
    line_end: 309
    source_sequence: 309
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-309-309
  translation_ja: ブロディ老人。わしの息子――組合長――組合長ブロディ――学校では一番だった。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0070
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  I know it, Mr. Brodie.  Was I not the last in the same class? (To MARY.)  But he seems to have forgotten
    us.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 311
    line_end: 312
    source_sequence: 311
  source_alignment:

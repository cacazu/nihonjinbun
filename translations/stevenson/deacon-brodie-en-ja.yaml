  translation_ja: メアリー。わたしの幸せは、わたし自身の口から聞いてもらわなくちゃ。それにあなたには分からないのね。ブロディ家は普通の家族と違うの。一族っていう気持ちが強くて、みなでしっかり結びついてるのよ。
  translation_status: reviewed
  source_kind: dialogue

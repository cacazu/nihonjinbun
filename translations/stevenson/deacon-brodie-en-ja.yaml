  translation_ja: メアリー。ええ、ものがほとんど分からなくなってるの。何時間でもご覧のとおりじっと座って、ウィルが手を触れるか、ウィルの名が聞こえるかしないと、口もきかないし、身動きもしないのよ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0072
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: LESLIE.  It is so good to sit beside you.  By and by it will be always like this.  You will not let me speak
    to the Deacon?  You are fast set upon speaking yourself?  I could be so eloquent, Mary—I would touch him. I cannot tell
    you how I fear to trust my happiness to any one else—even to you!
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line

- id: db-0707
  section_id: act-iii-tableau-v-scene-iv
  kind: paragraph
  origin: source
  source_text: HUNT.  Artful bird!  Now since we’re getting on so cosy and so free, I’ll ask you another, Andrew.  Should
    you like to see a Bow Street Runner?  (Producing staff.)  ’Cos, if so, you’ve only got to cast your eyes on me.  Do you
    queer the red weskit, Andrew?  Pretty colour, ain’t it?  So nice and warm for the winter too.  (AINSLIE dives, HUNT collars
    him.)  No, you don’t.  Not this time.  Run away like that before we’ve finished our little conversation?  You’re a nice
    young man, you are.  Suppose we introduce our wrists into these here darbies?  Now we shall get along cosier and freer
    than ever.  Want to lie down, do you? All right! anything to oblige.
  source_languages:
  - en
  source_locations:

  kind: paragraph
  origin: source
  source_text: BRODIE.  Now for one of the Deacon’s headaches!  Rogues all, rogues all! (Goes to clothes-press, and proceeds
    to change his coat.)  On with the new coat and into the new life!  Down with the Deacon and up with the robber!  (Changing
    neck-band and ruffles.)  Eh God! how still the house is!  There’s something in hypocrisy after all.  If we were as good
    as we seem, what would the world be?  [The city has its vizard on, and we—at night we are our naked selves.  Trysts are
    keeping, bottles cracking, knives are stripping; and here is Deacon Brodie flaming forth the man of men he is!]—How still
    it is! . . . My father and Mary—Well! the day for them, the night for me; the grimy cynical night that makes all cats
    grey, and all honesties of one complexion.  Shall a man not have half a life of his own?—not eight hours out of twenty-four?  [Eight
    shall he have should he dare the pit of Tophet.]  (Takes out money.)  Where’s the blunt?  I must be cool to-night, or
    . . . steady, Deacon, you must win; damn you, you must!  You must win back the dowry that you’ve stolen, and marry your
    sister, and pay your debts, and gull the world a little longer!  (As he blows out the lights.)  The Deacon’s going to
    bed—the poor sick Deacon!  Allons!  (Throws up the window, and looks out.) Only the stars to see me! (Addressing the bed.)  Lie
    there, Deacon! sleep and be well to-morrow.  As for me, I’m a man once more till morning.  (Gets out of the window.)
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line

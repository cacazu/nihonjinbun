  translation_ja: ハント。それで、なぜそんなことをした？　組合長がいなくなったあと、ジェミーが卓の上でホーンパイプを踊って、みんなに酒をおごったのは見たがな。なぜ勝負を仕組んで、自分たちの仲間をはめたんだ？
  translation_status: reviewed
  source_kind: dialogue

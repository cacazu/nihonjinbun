  origin: source
  source_text: 'LAWSON.  Let sleeping dogs lie, Mr. Leslie; ye dinna ken what ye micht see.  And then, leave him alane, he’ll
    come nae mair.  And sitting up a’ nicht . . . it’s a factum imprestabile, as we say: a thing impossible to man.  Gang
    ye to your bed, like a guid laddie, and sleep lang and soundly, and bonnie, bonnie dreams to ye!  (Without.)  Let sleeping
    dogs lie, and gang ye to your bed.'
  source_languages:

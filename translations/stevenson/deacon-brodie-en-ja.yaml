  translation_ja: スミス。わかったよ、ハンプ大将！（エインズリーに。）骨くず拾いでもあるまいに、袋の口ひとつ開けていられねえのか！（道具を出す。）あった、あった。鍵の束が一つ、二つ。いい鍵だねえ。錠破りの道具、こじ開け棒、それからこれはジョージ卿ご愛用の片面ランタン、長年の大切なお友達、押し込み稼業の宝でございます！
  translation_status: reviewed

    original_unit_id: line-824-844
  translation_ja: ブロディ。さあ、組合長さまの頭痛のお出ましだ！　悪党ばかりだ、どいつもこいつも！（衣装箪笥へ行き、上着を替え始める。）新しい上着で、新しい暮らしへ！　組合長は引っ込め、盗人は出てこい！（襟布と袖飾りを替えながら）ああ神よ、なんと静かな家だ！　偽善もやっぱり捨てたものじゃない。見かけどおりの善人ばかりなら、世の中はどうなる？　［町は仮面をかぶっている。だがわたしたちは――夜にはむきだしの自分だ。逢引きが始まり、酒瓶が開き、刃がさやを離れる。ここに組合長ブロディが、男の中の男の姿で、火を噴いて現れるぞ！］なんと静かなことだ！……父とメアリーか。ふむ、昼はあの二人に、夜はわたしに。薄汚れ、皮肉な夜。どの猫も灰色にし、どのまっとうさも同じ色に塗りつぶす夜。男なら、人生の半分くらい自分のものにしたっていいじゃないか？　二十四時間のうち八時間さえ駄目なのか？　［地獄の底へ行く気さえあれば、八時間は自分のものだ。］（金を取り出す。）金はどこだ？　今夜は冷静にいかねば、さもないと……落ち着け、組合長。勝たねばならん、ちくしょう、勝つんだぞ！　自分で盗んだ持参金を取り戻し、妹を嫁がせ、借金を払い、もう少しだけ世間をだまし通すんだ！（明かりを吹き消しながら）組合長はお休みになる――お気の毒なご病人！　さあ行こう！（窓を跳ね上げて外を見る。）見ているのは星だけか！（寝台に向かって）そこにいろ、組合長！　眠って明日には元気になっていろ。わたしは朝まで、ひとりの男に戻るぞ。（窓から出る。）

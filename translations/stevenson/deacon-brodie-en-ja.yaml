  section_id: act-i-tableau-i-scene-ii
  kind: paragraph
  origin: source
  source_text: BRODIE.  At any rate, ’tis not the interest of a victim, or we should certainly have known of it before; nor
    a practical tool-mongering interest, like my own; nor an interest professional and official, like the Procurator’s.  You
    can answer for that, I suppose?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt

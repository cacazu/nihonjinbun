  translation_ja: ハント。いつまでも地べたに這いつくばってないで、立って男らしく答えろ。このとびきり見事な押し込みをことごとくやった、お手並みあざやかな職人は、組合長のブロディじゃないのか？
  translation_status: reviewed
  source_kind: dialogue
- id: db-0712
  section_id: act-iii-tableau-v-scene-iv
  kind: paragraph
  origin: source
  source_text: AINSLIE.  It’s him, mister; it’s him.  That’s the man.  Ye’re in the very bit.  Deacon Brodie.  I’ll can tak’
    ye to his vera door.
  source_languages:
  - en
  source_locations:

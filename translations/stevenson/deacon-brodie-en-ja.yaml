- id: db-0036
  section_id: act-i-tableau-i-scene-i
  kind: paragraph
  origin: source
  source_text: 'MARY.  And now you are impertinent!  Do you mean to go any further?  We are a fighting race, we Brodies.  Oh,
    you may laugh, sir!  But ’tis no child’s play to jest us on our Deacon, or, for that matter, on our Deacon’s chamber either.  It
    was his father’s before him: he works in it by day and sleeps in it by night; and scarce anything it contains but is the
    labour of his hands.  Do you see this table, Walter?  He made it while he was yet a ’prentice.  I remember how I used
    to sit and watch him at his work.  It would be grand, I thought, to be able to do as he did, and handle edge-tools without
    cutting my fingers, and getting my ears pulled for a meddlesome minx!  He used to give me his mallet to keep and his nails
    to hold; and didn’t I fly when he called for them! and wasn’t I proud to be ordered about with them!  And then, you know,
    there is the tall cabinet yonder; that it was that proved him the first of Edinburgh joiners, and worthy to be their Deacon
    and their head.  And the father’s chair, and the sister’s workbox, and the dear dead mother’s footstool—what are they
    all but proofs of the Deacon’s skill, and tokens of the Deacon’s care for those about him?'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 202
    line_end: 218
    source_sequence: 202
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-202-218
  translation_ja: メアリー。今度は生意気ね！　まだ続ける気？　ブロディの一族は喧嘩っ早いんですよ。まあ、笑っておいでなさい！　うちの組合長をからかうなんて、子供の遊びじゃすみませんよ。組合長の部屋のことだってそう。この部屋は元は父さんのもので、兄さんは昼はここで仕事をし、夜はここで眠る。部屋にあるものは、ほとんど兄さんの手で作った品ばかりよ。ねえウォルター、この卓が見える？　まだ見習いだったころに作ったの。座ってじっと仕事を見ていたのを覚えてるわ。兄さんみたいにできたら、刃物を使っても指を切らず、おせっかいな小娘だと耳を引っぱられもしなかったら、なんてすてきだろうって思った。兄さんは木槌を預けたり、釘を持たせたりしてくれたの。呼ばれたら飛んでいったわ。あれを取れ、これを持てと言いつけられるのが、どんなに誇らしかったことか！　それから、向こうの背の高い戸棚ね。あれで兄さんはエディンバラ随一の指物師だと認められ、みんなの頭、組合長になったのよ。父さんの椅子、妹の裁縫箱、亡くなった母さんの足台。どれも兄さんの腕前の証しで、身近な人たちを大事にしてくれたしるしじゃない？
  translation_status: reviewed
  source_kind: dialogue

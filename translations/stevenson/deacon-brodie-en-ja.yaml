- id: db-0286
  section_id: act-i-tableau-iii-scene-i
  kind: paragraph
  origin: source
  source_text: 'MOORE.  Newcastle Jemmy!  Muck: that’s my opinion of him: muck.  I’ll mop the floor up with him any day, if
    so be as you or any on ’em ’ll make it worth my while.  If not, muck!  That’s my motto.  Wot I now ses is, about that
    ’ere crib at Leslie’s, wos I right, I ses? or wos I wrong?  That’s wot’s the matter with you.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt

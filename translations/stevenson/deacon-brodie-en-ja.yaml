    original_unit_id: line-2773-2782
  translation_ja: レズリー。十時を回ったか。ああ、おたがい長い夜になりそうだな、夜警の諸君。なんて仕事だ！　だがメアリーと笑い話にできる。それに……あの人とも？　ちくしょう、思い込みが強すぎて、どうにも振り払えない。我ながら恥ずかしいことだ。「わたしたちブロディ家の者は」。あの言い方といったら！　「わたしたちブロディ家と、うちの組合長」。なんて誇らしげで、僕にはなんてすてきに響くんだろう！　「職人の組合長ですよ、旦那、あの人は木工の……！」（仮面をつけたブロディが窓の外に現れ、こじ開けにかかる。）来た！　来るとわかっていた。きっと来ると思ってたぞ。（身をかがめ、陰に隠れたまま、少しずつ窓に近づく。）おまえのことも知ってるんだ。誓って言う、おまえを知っている。
  translation_status: reviewed

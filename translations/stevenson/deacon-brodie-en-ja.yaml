- id: db-0219
  section_id: act-i-tableau-i-scene-viii
  kind: paragraph
  origin: source
  source_text: BRODIE.  Minutes are precious, Mary.  I have to work for all of us, and the clock is always busy.  They are
    waiting for me even now.  Help me with the dad’s chair.  And then to bed, and dream happy things.  And to-morrow morning
    I will hear your news—your good news; it must be good, you look so proud and glad.  But to-night it cannot be.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 780
    line_end: 784
    source_sequence: 780
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-780-784
  translation_ja: ブロディ。一分だって惜しいんだ、メアリー。みんなのために仕事をせにゃならんし、時計は止まってくれない。今だって待たせているんだ。父さんの椅子を押すのを手伝ってくれ。それから床へ行って、いい夢を見なさい。明日の朝、おまえの話を聞こう。いい知らせなんだろう。そんなに誇らしげで嬉しそうなんだから。だが今晩はだめだ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0220
  section_id: act-i-tableau-i-scene-viii
  kind: paragraph
  origin: source
  source_text: MARY.  I hate your business—I hate all business.  To think of chairs, and tables, and foot-rules, all dead
    and wooden—and cold pieces of money with the King’s ugly head on them; and here is your sister, your pretty sister, if
    you please, with something to tell, which she would not tell you for the world, and would give the world to have you guess,
    and you won’t?—Not you!  For business!  Fie, Deacon Brodie!  But I’m too happy to find fault with you.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 786
    line_end: 792
    source_sequence: 786
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-786-792
  translation_ja: メアリー。兄さんのお仕事なんて嫌い。何のお仕事だって嫌い。椅子や卓や尺の物差しなんて、どれも命のない木のかたまりじゃない。国王さまの不細工なお顔がついた、冷たい硬貨も。それなのにここには妹がいるの、それも可愛い妹がね。どうしても自分からは言いたくないのに、兄さんが当ててくれるなら何だって差し出したい話があって。それを、当ててくれないの？　だめ？　お仕事のために！　まあ、組合長ブロディともあろう方が！　だけど、わたし、兄さんを責めるには幸せすぎるわ。
  translation_status: reviewed
  source_kind: dialogue

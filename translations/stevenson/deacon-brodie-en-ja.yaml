  translation_ja: ハント。まずはひととおり話を済ませよう。それから行かせてやるかもしれないし、行かせないかもしれない。二人の話がどれだけうまくいくか次第だ。まあ、ふだんどおりなら、アンドルー、おれは何より平穏を好む男だ。いつものやり方はそうなんだがな、いざ騒ぎを起こすとなると、なかなかの腕だって仲間に言われている。だから、虫けらも踏めば牙をむくと思っておけ。

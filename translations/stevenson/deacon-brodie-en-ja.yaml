  translation_ja: レズリー。ありふれている！　ありふれているだと！　僕と話をするんですか、僕に理屈をこねるんですか、言い訳をするんですか？　ばれて、恥をさらしたあなたが、嘘つきで盗人で、僕を殺したも同然、この胸の中の心臓を殺したあなたが、まだ話すんですか！　僕はどうしたらいい？　あなたの命は僕の手の中にある。それは考えたことがありますか？　僕はどうしたらいいんだ？
  translation_status: reviewed
  source_kind: dialogue

- id: db-0277
  section_id: act-i-tableau-iii-scene-i
  kind: paragraph
  origin: source
  source_text: BRODIE.  Should I be here else?  When I leave my house I leave an alibi behind me.  I’m ill—ill with a jumping
    headache, and the fiend’s own temper.  I’m sick in bed this minute, and they’re all going about with the fear of death
    on them lest they should disturb the poor sick Deacon. [My bedroom door is barred and bolted like the bank—you remember!—and
    all the while the window’s open, and the Deacon’s over the hills and far away.  What do you think of me?]
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719

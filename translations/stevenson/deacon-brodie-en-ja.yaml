  kind: paragraph
  origin: source
  source_text: BRODIE.  What do I mean?  I mean that you and that merry-andrew shall walk out of this room and this house.  Do
    you suppose, you blockheads, that I am blind?  I’m the Deacon, am I not?  I’ve been your king and your commander.  I’ve
    led you, and fed you, and thought for you with this head.  And you think to steal a march upon a man like me?  I see you
    through and through [I know you like the clock]; I read your thoughts like print.  Brodie, you thought, has money, and
    won’t do the job. Therefore, you thought, we must rook him to the heart.  And therefore, you put up your idiot cockney.  And
    now you come round, and dictate, and think sure of your Excise?  Sure?  Are you sure I’ll let you pack with a whole skin?  By
    my soul, but I’ve a mind to pistol you like dogs.  Out of this!  Out, I say, and soil my home no more.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2027
    line_end: 2038
    source_sequence: 2027
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2027-2038
  translation_ja: ブロディ。どうする気か？　おまえとそこの道化を、この部屋から、この家から追い出す気だ。この間抜けども、わたしの目が節穴だと思うのか？　わたしは組合長だぞ、違うか？　おまえらの王であり、指揮官だった。おまえらの先頭に立ち、食わせ、この頭でおまえらの分まで考えてきた。それでこのわたしを出し抜けると思ったか？　すっかりお見通しだ。［おまえらのことは時計を読むよりよくわかる。］何を考えているか、活字を読むようにわかる。ブロディは金を持っているから仕事はやらん。じゃあ一杯食わせて、徹底的に搾り取ってやろう。そう思ったんだろう。そこであのロンドンの間抜けをけしかけた。今度はのこのこやって来て、ああしろこうしろと言って、物品税務所はものになったと思ってるのか？　本気でそう思うか？　無傷で帰してもらえると思うか？　神かけて、おまえらを犬みたいに撃ち殺してやりたいよ。出ていけ！　出ていけ、二度とわたしの家を汚すな。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0586
  section_id: act-ii-tableau-iv-scene-viii
  kind: paragraph
  origin: source
  source_text: MOORE (sitting).  Now look ’ere.  Mr. bloody Deacon Brodie, you see this ’ere chair of yours, don’t you?  Wot
    I ses to you is, here I am, I ses, and here I mean to stick.  That’s my motto.  Who the devil are you to do the high and
    mighty?  You make all you can out of us, don’t you? and when one of your plants get cross, you order us out of the ken?
    Muck!  That’s wot I think of you.  Muck!  Don’t you get coming the nob over me, Mr. Deacon Brodie, or I’ll smash you.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 2040
    line_end: 2046
    source_sequence: 2040
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-2040-2046
  translation_ja: ムーア（座る）。よく聞けよ。このくそったれのブロディ組合長さんよ、おまえんとこのこの椅子が見えるだろう？　いいか、おれはここにいて、ここを動かねえんだ。それがおれの決まり文句さ。何さまのつもりで、偉そうにしてやがる？　おれたちをさんざん利用してよ、自分の仕掛けが一つしくじったら、人のことを家から追い出すのか？　くそ食らえ！　おまえなんか、くそ食らえだ！　おれの前でお偉方ぶるなよ、ブロディ組合長殿。ぶっつぶすぞ。
  translation_status: reviewed
  annotations:
  - side: source
    kind: emphasis
    span:
      start: 7

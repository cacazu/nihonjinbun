  translation_ja: ハント。抜け目のない鳥だね！　こうしてすっかり打ち解けたんだから、次も聞こうか、アンドルー。ボウ・ストリートの捕吏をご覧になりたいかね？（捕吏の職杖を出す。）なら、おれを見てごらんなさい。赤い胴着が見えるか、アンドルー。いい色だろう？　冬にゃ、これがなかなか暖かくてね。（エインズリーが身をかがめて逃げようとし、ハントが襟首をつかむ。）おっと、そうはいかない。今度ばかりはね。このささやかなおしゃべりが済みもしないうちに駆け出すとは。まったく、いい若者だねえ。この手錠に手首を入れてみちゃどうだ？　これなら前にもまして打ち解けて、気兼ねなく話ができる。横になりたいのか？　いいとも！　ご希望とあらば何でも。
  translation_status: reviewed

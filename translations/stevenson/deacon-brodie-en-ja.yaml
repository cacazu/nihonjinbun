  source_text: The Stage represents a room in the Deacon’s house, furnished partly as a sitting-, partly as a bed-room, in
    the style of an easy burgess of about 1780.  C., a door; L. C., a second and smaller door; R. C., practicable window;
    L., alcove, supposed to contain bed; at the back, a clothes-press and a corner cupboard containing bottles, etc.  MARY
    BRODIE at needlework; OLD BRODIE, a paralytic, in wheeled chair, at the fireside, L.
  source_languages:

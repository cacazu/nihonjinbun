  kind: paragraph
  origin: source
  source_text: MARY.  O yes! his mind is wellnigh gone.  He will sit for hours as you see him, and never speak nor stir but
    at the touch of Will’s hand or the sound of Will’s name.
  source_languages:
  - en
  source_locations:

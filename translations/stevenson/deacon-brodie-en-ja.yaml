  translation_ja: エインズリー（這いつくばって）。おれじゃない、おれじゃないです。仲間が悪かったんで。悪い仲間と酒で、だめになっちまいました。ああ、旦那、弱くて、酒だの何だので芯まで腐っちまった、哀れな若造にどうかお慈悲を。優しい心をお持ちの、どうか、どうか、旦那さま。おれみたいなのを縛り首になんかしないですよね。縛り首にするほどの者じゃないんです。おれは、ろうそく虫と呼ばれてるんです！　旦那のお役に立ってみせますから、ね？　ほかのやつらを縛り首にできますよ、ね？
  translation_status: reviewed

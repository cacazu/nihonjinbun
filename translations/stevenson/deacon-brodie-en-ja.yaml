  translation_status: reviewed
  source_kind: dialogue
- id: db-0094
  section_id: act-i-tableau-i-scene-ii
  kind: paragraph
  origin: source
  source_text: LAWSON.  Ay is he!  There is no a house in Edinburgh safe.  The law is clean helpless, clean helpless!  A week
    syne it was auld Andra Simpson’s in the Lawnmarket.  Then, naething would set the catamarans but to forgather privily
    wi’ the Provost’s ain butler, and tak’ unto themselves the Provost’s ain plate.  And the day, information was laid before
    me offeecially that the limmers had made infraction, vi et clam, into Leddy Mar’get Dalziel’s, and left her leddyship
    wi’ no sae muckle’s a spune to sup her parritch wi’.  It’s unbelievable, it’s awful, it’s anti-christian!
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 390
    line_end: 398
    source_sequence: 390
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-390-398
  translation_ja: ローソン。まったくだ！　エディンバラには、無事でいられる家は一軒もない。法律はまるで役に立たん、まるで役に立たんよ！　一週間前はローンマーケットのアンドルー・シンプソン爺さんの家だ。それだけでは気がすまず、あの悪党ども、市長のところの執事本人と内々に示し合わせて、市長の銀食器をごっそりせしめおった。今日になって、マーガレット・ダルジール夫人の家へ、連中が〈強引かつひそかに〉侵入し、奥さまが粥をすする匙一本も残さなかったと、正式に報告があってな。とても信じられん、恐ろしい、神に背く所業だ！
  translation_status: reviewed
  annotations:
  - side: source
    kind: emphasis
    span:
      start: 404
      end: 414
      exact: vi et clam
  source_kind: dialogue

  translation_ja: ムーア。ニューカッスル・ジェミー！　くそだな。あいつのことをどう思うかって？　くそさ。あんたでも誰でも割に合う金を出すなら、いつだってあいつを床に叩きつけてやる。でなきゃ、くそくらえ！　そいつがおれの決まり文句さ。それで今言ってるのは、レズリーのあの家のことだ。おれが正しかったのか、間違ってたのかってんだ。それがあんたの問題だよ。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0287
  section_id: act-i-tableau-iii-scene-i
  kind: paragraph
  origin: source
  source_text: BRODIE.  You are both right and wrong.  You dared me to do it.  I was drunk; I was upon my mettle; and I as
    good as did it.  More than that, black-guardly as it was, I enjoyed the doing.  He is my friend.  He had dined with me
    that day, and I felt like a man in a story.  I climbed his wall, I crawled along his pantry roof, I mounted his window-sill.  That
    one turn of my wrist—you know it I—and the casement was open.  It was as dark as the pit, and I thought I’d won my wager,
    when, phewt! down went something inside, and down went somebody with it.  I made one leap, and was off like a rocket.  It
    was my poor friend in person; and if he’d caught and passed me on to the watchman under the window, I should have felt
    no viler rogue than I feel just now.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 1095

- id: db-0616
  section_id: act-ii-tableau-iv-scene-x
  kind: paragraph
  origin: source
  source_text: BRODIE.  Changed?  Why, the world’s a different colour!  It was night, and now it’s broad day and I trust myself
    again.  You must wait, dear, wait, and I must work and work; and before the week is out, as sure as God sees me, I’ll
    have made you happy.  O you may think me broken, hounds, but the Deacon’s not the man to be run down; trust him, he shall
    turn a corner yet, and leave you snarling!  And you, Poll, you.  I’ve done nothing for you yet; but, please God, I’ll
    make your life a life of gold; and wherever I am, I’ll have a part in your happiness, and you’ll know it, by heaven! and
    bless me.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719

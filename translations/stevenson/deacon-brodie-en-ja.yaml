- id: db-0397
  section_id: act-ii-tableau-iv-scene-i
  kind: paragraph
  origin: source
  source_text: BRODIE (solus).  My head! my head!  It’s the sickness of the grave. And those bells go on . . . go on! . .
    . inexorable as death and judgment.  [There they go; the trumpets of respectability, sounding encouragement to the world
    to do and spare not, and not to be found out. Found out!  And to those who are they toll as when a man goes to the gallows.]  Turn
    where I will are pitfalls hell-deep.  Mary and her dowry; Jean and her child—my child; the dirty scoundrel Moore; my uncle
    and his trust; perhaps the man from Bow Street.  Debt, vice, cruelty, dishonour, crime; the whole canting, lying, double-dealing,
    beastly business!  ‘My son the Deacon—Deacon of the Wrights!’  My thoughts sicken at it.  [Oh the Deacon, the Deacon!  Where’s
    a hat for the Deacon? where’s a hat for the Deacon’s headache? (searching).  This place is a piggery.  To be respectable
    and not to find one’s hat.)
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 1424
    line_end: 1436
    source_sequence: 1424
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-1424-1436
  translation_ja: ブロディ（一人）。頭が！　頭が痛い！　墓場の病だ。あの鐘は鳴りやまん……鳴りやまん！……死と最後の審判みたいに、容赦がない。［ほら、まただ。お上品ぶった連中のラッパ。世間に向かって、思うさまやれ、見つかりさえしなけりゃいい、とけしかけている。見つかるだと！　見つかった者のためには、絞首台に送られる男のためみたいに、あの鐘が鳴る。］どっちを向いても地獄の底まで落ちる穴だ。メアリーとその持参金。ジーンとあの子、あれはわたしの子だ。あの薄汚い悪党ムーア。叔父上とその信頼。おまけにボウ・ストリートの男までか。借金、放蕩、残酷、不名誉、犯罪。説教くさいおためごかし、嘘、二枚舌、何もかも腐りきっている！　「うちの息子は組合長だ。木工組合の長だぞ！」考えるだけで吐き気がする。［ああ、組合長、組合長様！　組合長の帽子はどこだ？　組合長のこの頭痛にかぶせる帽子はどこだ？（探し回る。）ここは豚小屋だな。世間に顔向けできる身で、自分の帽子も見つけられんとは。］
  translation_status: reviewed

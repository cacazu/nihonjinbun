- id: db-0472
  section_id: act-ii-tableau-iv-scene-v
  kind: paragraph
  origin: source
  source_text: BRODIE.  Sore hearing, does he say?  My hand’s wet.  But it’s victory. Shall it be go? or stay?  [I should
    show them all I can, or they may pry closer than they ought.]  Shall I have it out and be done with it?  To see Mary at
    once [to carry bastion after bastion at the charge]—there were the true safety after all!  Hurry—hurry’s the road to silence
    now. Let them once get tattling in their parlours, and it’s death to me.  For I’m in a cruel corner now.  I’m down, and
    I shall get my kicking soon and soon enough.  I began it in the lust of life, in a hey-day of mystery and adventure.  I
    felt it great to be a bolder, craftier rogue than the drowsy citizen that called himself my fellow-man.  [It was meat
    and drink to know him in the hollow of my hand, hoarding that I and mine might squander, pinching that we might wax fat.]  It
    was in the laughter of my heart that I tip-toed into his greasy privacy.  I forced the strong-box at his ear while he
    sprawled beside his wife.  He was my butt, my ape, my jumping-jack.  And now . . . O fool, fool!  [Duped by such knaves
    as are a shame to knavery, crime’s rabble, hell’s tatterdemalions!]  Shorn to the quick!  Rooked to my vitals!  And I
    must thieve for my daily bread like any crawling blackguard in the gutter.  And my sister . . . my kind, innocent sister!  She
    will come smiling to me with her poor little love-story, and I must break her heart.  Broken hearts, broken lives! . .
    . I should have died before.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 1681
    line_end: 1701
    source_sequence: 1681
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-1681-1701
  translation_ja: ブロディ。つらい話を聞かされた、と言うのか？　手が汗で濡れている。だが勝ったのだ。行くか？　それとも残るか？［話せることはすっかり話さねば。でなければ、知られては困るところまで嗅ぎつけられる。］今こそ話して、片をつけてしまうか？　すぐにメアリーに会う。［突撃して砦を一つずつ落としていくのだ。］結局、それがいちばん安全な手だ！　急げ。今は急ぐことが口を封じる道だ。あいつらに客間でぺらぺらしゃべり出されたら、わたしはおしまいだ。ひどく追い詰められてしまった。もう倒れている。蹴りが飛んでくるのもじきだ。嫌でもすぐにだ。生きることに貪欲で、謎と冒険のまっただ中にいた盛りに、始めたんだ。自分をわたしと同じ人間だと思っている、あの眠たげな町人より、大胆で抜け目のない悪党でいるのが痛快だった。［あいつを手のひらに乗せていると知るだけで、何よりの楽しみだった。あいつが蓄えた分をわたしたちで使い散らし、あいつが切り詰めた分でわたしたちは腹を肥やす。］心で笑いながら爪先で、あいつの脂ぎった内輪の暮らしに忍びこんだものだ。妻の隣で大の字になっている、その耳もとで金庫をこじ開けてやった。あいつはわたしの笑いもの、わたしの猿、糸で手足を操る人形だった。それが今は……ああ、なんという馬鹿だ！［悪党の風上にも置けぬならず者ども、犯罪者の屑、地獄のぼろ着どもに騙されるとは！］身ぐるみはがされた！　骨の髄までしゃぶられた！　今では溝べりを這うごろつき同然、その日のパンのために盗みを働かなきゃならん。妹まで……あの優しい、罪のない妹が！　笑顔で来て、ささやかな恋の話をする。わたしはその心を打ち砕かねばならんのだ。心を砕き、一生を台なしにする！……こうなる前に死んでいればよかった。
  translation_status: reviewed
  source_kind: dialogue

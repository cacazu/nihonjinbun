  section_id: act-i-tableau-ii-scene-i
  kind: paragraph
  origin: source
  source_text: HUNT.  That same, Mr. Procurator-Fiscal.  The Captain’s given me a hard hunt of it this time.  I dropped on
    his marks first at Huntingdon, but he was away North, and I had to up and after him.  I heard of him all along the York
    road, for he’s a light hand on the pad, has Jemmy, and leaves his mark.  [I missed him at York by four-and-twenty hours,
    and lost him for as much more.  Then I picked him up again at Carlisle, and we made a race of it for the Border; but he’d
    a better nag, and was best up in the road; so I had to wait till I ran him to earth in Edinburgh here and could get a
    new warrant.]  So here I am, sir.  They told me you were an active sort of gentleman, and I’m an active man myself.  And
    Sir John Fielding, Mr. Procurator-Fiscal, he’s an active gentleman, likewise, though he’s blind as a himage, and he desired
    his compliments to you, [sir, and said that between us he thought we’d do the trick].
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt

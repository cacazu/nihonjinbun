    original_unit_id: line-1652-1662
  translation_ja: ローソン。ウィリアム・ブロディ、わしは長いことおまえを信じてきた。組合長の叔父であることが、どんなに、どんなに誇らしかったことか。それが今日、こんなつらい話を聞かされるとはな。もう終わったことだ。フロドゥンの戦と同じ、過ぎ去ったことだ。今じゃ昔の歌でしかない。そしてわしは、この戸をくぐったときより年を取ったよ。だがよく聞け、よく聞くんだ、ウィリアム・ブロディ。わしも誉められた人間じゃない。だが、東の海から西の海まで、造り主なる神を仰いで、おまえがあの子にしたような仕打ちをわしから受けたと言える者は一人もおらんぞ。神に感謝するよ、ウィリアム・ブロディ。あの人はわしにとって兄弟も同然だったがな、それでも神に感謝する。おまえの父親は死の手で耳をふさがれて、わしより幸せなまま墓に入れるんだからな。それでまだわしに何か言うのか？　恥を知れ。自分の心を恥じるがいい！
  translation_status: reviewed
  source_kind: dialogue

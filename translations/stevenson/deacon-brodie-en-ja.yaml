    original_unit_id: line-2757-2767
  translation_ja: レズリー（大声で）。そのうちに。ご心配なく！（念入りに戸に閂をかけ、鎖を渡す。）ご老人、どうもご気分がすぐれないようだ。どうしたんだろう？　仮面の訪問客でも来たのかな？　ありえないことはない。はやりなんだから。さあ、明かりを消そう。（ろうそくを吹き消す。舞台を照らすのは、窓から差し込む月の光だけになる。）いつかの晩には必ず来る。来ずにはいられない。理屈はどうあれ、そんな気がする。おい、おまえを知っているぞ、どこかで知っている。肩の動かし方、服の垂れ具合。誰のだ？　どこで見たんだ？　それに、あの目つきだ。窓を開けたとき、部屋をひと目見回したあの視線……親しみさえ感じる。グラスの縁越しに、あの視線を受けたことがあるぞ。まさか……あの人か？　いや、あの人じゃない。
  translation_status: reviewed

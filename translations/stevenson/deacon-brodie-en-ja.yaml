  translation_ja: ハント。人違いじゃないと思ったよ。いいか、アンドルー・エインズリー。性根の腐ったやつだ、おまえは。五十回も縛り首にできる証拠がある。だが、おれが狙っているのは組合長だ。ちくるのか、ちくらないのか？　秘密を吐けば助けてやる。吐かなけりゃ、おれの名がジェリー・ハントであるのと同じく確実に、おまえの首をくくってやる。
  translation_status: reviewed
  source_kind: dialogue

  source_text: BRODIE.  I think I’ll go.  ‘My son the Deacon was aye regular at kirk.’ If the old man could see his son, the
    Deacon!  I think I’ll—Ay, who shall stand?  There’s the rub!  And forgiveness, too?  There’s a long word for you!  I learnt
    it all lang syne, and now . . . hell and ruin are on either hand of me, and the devil has me by the leg.  ‘My son, the
    Deacon . . . !’  Eh, God! but there’s no fool like an old fool! (Becoming conscious of the others.)  Rogues!

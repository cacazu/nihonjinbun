  translation_ja: ブロディ。助かった！　それにアリバイがある！　いや、今度こそ危なかったぞ。首くくりまであと一歩、あと一歩だった。ああ、賭けていたのはおまえの首だ。その首を守るために戦ったんだ。風のような速さで地獄の戸が閉じかける、そのすき間をすり抜けて、天国めがけて飛び出した！　助かった！　わたしを売った犬には片をつけた。他の犬どもは裏切らん。おい、アリバイは崩れないぞ！　窓の締まりはいいか？　近所の者に見られてはまずい。組合長は病気でお気の毒に、なのにこんな夜中に起きて動き回っているなんてな。ああ、居心地のいい昔ながらの家、昔ながらのこの部屋……ねずみは死んだ。全部無事だ。（ろうそくに火をつける。）先生、手が震えるのか？　みっともない！　助かったんだ、具合が悪くてぬくぬくと寝床にいたんだろう。ねずみが一匹死んだだけなのに？（短い剣を外し、卓に置く。）ああ、すれすれだった。被告席に立つ羽目になるのか？　なったとしてもだ！　口がある、頭がある、アリバイがある。アリバイは崩れない。（上着を脱ぎ、短剣を取り出す。突き刺す身振りで。）ぐさりだ！　やつはうめき声も立てずに倒れた。「彼は盾のいぼに敵を打ちつけ、打ち砕く！」（短剣を卓に置く。）アリバイ……ああ、組合長、それがおまえの命だ！……おまえのアリバイが、おまえのアリバイが。（ろうそくを手に取り、戸を振り返る。）ああ！……開いてる、開いてる、開いてるぞ！　神の裁きだ、戸が開いている！
  translation_status: reviewed

  source_text: HUNT.  Well, Mr. Procurator-Fiscal [I ain’t a rich man, and two hundred’s two hundred.  Thereby, sir], I don’t
    mind telling you I’ve had a bit of a worry at it already.  You see, Mr. Procurator-Fiscal, I had to look into a ken to-night
    about the Captain, and an old cock always likes to be sure of his walk; so I got one of your Scotch officers—him as was
    so polite as to show me round to Mr. Brodie’s—to give me full particulars about the ’ouse, and the flash companions that
    use it.  In his list I drop on the names of two old lambs of my own; and I put it to you, Mr. Procurator-Fiscal, as a
    genleman as knows the world, if what’s a black sheep in London is likely or not to be keeping school in Edinburgh?

  source_text: AINSLIE (grovelling).  It wasna me, it wasna me.  It’s bad companions; I’ve been lost wi’ bad companions an’
    the drink.  An’ O mister, ye’ll be a kind gentleman to a puir lad, an’ me sae weak, an’ fair rotten wi’ the drink an’
    that.  Ye’ve a bonnie kind heart, my dear, dear gentleman; ye wadna hang sitchan a thing as me.  I’m no fit to hang.  They
    ca’ me the Cannleworm!  An’ I’ll dae somethin’ for ye, wulln’t I?  An’ ye’ll can hang the ithers?
  source_languages:

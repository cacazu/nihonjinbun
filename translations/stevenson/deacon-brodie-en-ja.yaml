- id: db-0256
  section_id: act-i-tableau-ii-scene-iii
  kind: paragraph
  origin: source
  source_text: 'HUNT.  Lord love you, my dear, that ain’t my line of country.  Suppose you’re not married and churched a hundred
    thousand times, what odds to Jerry Hunt?  Jerry, my Pamela Prue, is a cove as might be your parent; a cove renowned for
    the ladies’ friend [and he’s dead certain to be on your side].  What I can’t get over is this: here’s this Mr. Deacon
    Brodie doing the genteel at home, and leaving a nice young ’oman like you—as a cove may say—to take it out on cold potatoes.  That’s
    what I can’t get over, Mrs. Watt.  I’m a family man myself; and I can’t get over it.'
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719

    original_unit_id: line-872-884
  translation_ja: ハント。当人です、検察官殿。今度という今度は、あの大尉を追うのに手を焼きましたよ。最初に足跡をつかんだのはハンティンドンですが、もう北へ発ってましてね、こちらも立って追わなくちゃならなかった。ヨーク街道の行く先々でやつの噂が耳に入りました。何しろジェミーは追いはぎの手際がよくて、行く先々に爪痕を残しますんで。［ヨークでは丸一日遅くて取り逃がし、さらに丸一日ばかり見失いました。それからカーライルで尻尾をつかみ、国境までは競争でした。ところが向こうは馬がいいし、道にも詳しい。そこで、このエディンバラで居所を突き止め、新しい令状が取れるまで待つことにしたんです。］それで、ここへ参りました。検察官殿はやり手だとうかがいまして、私もやり手ですから。サー・ジョン・フィールディングも、検察官殿、像みたいに目はお見えにならんが、やり手でしてね。あなたによろしくと［おっしゃって、それに、二人で力を合わせればうまくいくはずだと］。
  translation_status: reviewed
  source_kind: dialogue
- id: db-0242
  section_id: act-i-tableau-ii-scene-i
  kind: paragraph
  origin: source
  source_text: LAWSON.  Ay, he’ll be a fine man, Sir John.  Hand me owre your papers, Hunt, and you’ll have your new warrant
    quam primum.  And see here, Hunt, ye’ll aiblins have a while to yoursel’, and an active man, as ye say ye are, should
    aye be grinding grist.  We’re sair forfeuchen wi’ our burglaries.  Non constat de personâ.  We canna get a grip o’ the
    delinquents.  Here is the Hue and Cry.  Ye see there is a guid two hundred pounds for ye.
  source_languages:
  - en
  source_locations:

    line_end: 3431
    source_sequence: 3429
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3429-3431
  translation_ja: レズリー。愛しい人、神が許してくださるなら、きみがそれを知る日は決して来ないよ。何があっても、僕はすべて知ったうえで、ますますきみを愛したんだと思ってほしい。本当にきみの夫になる人間がそばにいる、独りで背負わなくていいんだと思ってほしい。
  translation_status: reviewed
  source_kind: dialogue

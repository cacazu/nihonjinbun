  source_text: AINSLIE.  Ca’ ye that mainners?  Ye’re grand gentry by your way o’t!  Eh sirs, my hench!  Ay, that was the
    Badger.  Man, but ye’ll look bonnie hangin’!  (A faint whistle.)  Lord’s sake, what’s thon?  Ay, it’ll be Hunt an’ his
    lads.  (Whistle repeated.)  Losh me, what gars him whustle, whustle?  Does he think me deaf?  (Goes up.  BRODIE enters
    from office, stands an instant, and sees him making a signal through the arch.)

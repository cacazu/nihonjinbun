  kind: paragraph
  origin: source
  source_text: 'SMITH.  Where’s my beloved?  Deakin, my beauty, where are you?  Come to the arms of George, and let him introduce
    you.  Capting Starlight Rivers! Capting, the Deakin: Deakin, the Capting.  An English nobleman on the grand tour, to open
    his mind, by the Lard!'
  source_languages:
  - en
  source_locations:

  origin: source
  source_text: AINSLIE.  I gi’ed him a han’ wi’ them a’.  It was him an’ Badger Moore, and Geordie Smith; an’ they gart me
    gang wi’ them whether or no; I’m that weak, an’ whiles I’m donner’d wi’ the drink.  But I ken a’, an’ I’ll tell a’.  And
    O kind gentleman, you’ll speak to their lordships for me, an’ I’ll no be hangit . . . I’ll no be hangit, wull I?

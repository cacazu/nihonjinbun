  source_text: MARY.  Why are you so cross with me?  Oh, Will, you have forgot your sister!  Remember, dear, that I have nobody
    but you.  It’s your own fault, Will, if you’ve taught me to come to you for kindness, for I always found it.  And I mean
    you shall be kind to me again.  I know you will, for this is my great need, and the day I’ve missed my mother sorest.  Just
    a nice look, dear, and a soft tone in your voice, to give me courage, for I can tell you nothing till I know that you’re
    my own brother once again.

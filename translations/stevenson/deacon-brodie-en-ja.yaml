  translation_ja: ブロディ。無駄です。今言った日までは動けません。ある男がいるのです。その男に従わなければ。あの男の用が済む前に鎖を抜け出したら、わたしを捕まえろという声は国じゅうに燃え広がる。どの地方の港も閉ざされ、絞首台に引き返すことになるでしょう。あの男は何でもやりかねない。

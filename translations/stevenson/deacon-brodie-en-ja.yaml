  translation_ja: ハント。おやおや、そういうのはおれのやり口じゃないさ。たとえおまえさんが十万遍も結婚して教会の祝福を受けていないとして、それがジェリー・ハントに何の関係がある？　ジェリーはね、わが慎ましきパメラ嬢よ、親でも通る男さ。ご婦人方の味方として名が通っていて［間違いなくおまえさんの側につく］。どうにも気に入らんのはね、このブロディ組合長さんが家では紳士を気取っていながら、おまえさんみたいなきれいな若い女には、その何だ、冷えたじゃがいもで我慢させているってことだ。そこがどうにも腑に落ちんのさ、ワットさん。おれも所帯持ちなんでね、見過ごせないよ。

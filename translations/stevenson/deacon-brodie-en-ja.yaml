  kind: paragraph
  origin: source
  source_text: LESLIE.  Commonplace!  Commonplace!  Do you speak to me, do you reason with me, do you make excuses?  You—a
    man found out, shamed, a liar, a thief—a man that’s killed me, killed this heart in my body; and you speak!  What am I
    to do?  I hold your life in my hand; have you thought of that?  What am I to do?
  source_languages:
  - en
  source_locations:

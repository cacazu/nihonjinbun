  source_kind: dialogue
- id: db-1038
  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: MARY.  No, no!  Keep away from me.  Don’t touch me.  I’m not fit . . . not fit to be near you.  What has he
    done?  I am his sister.  Tell me the worst.  Tell me the worst at once.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt
    line_start: 3425
    line_end: 3427
    source_sequence: 3425
  source_alignment:
  - source_id: gutenberg-719
    original_unit_id: line-3425-3427
  translation_ja: メアリー。いや、いやです！　近づかないで。触らないで。わたしには、その資格が……そばにいる資格がないの。お兄さまは何をしたの？　わたしはあの人の妹よ。どんなにひどくても、本当のことを言って。今すぐ、はっきり言ってちょうだい。
  translation_status: reviewed
  source_kind: dialogue
- id: db-1039
  section_id: act-v-tableau-viii-scene-iii
  kind: paragraph
  origin: source
  source_text: LESLIE.  That, if God wills, dear, that you shall never know.  Whatever it be, think that I knew it all, and
    only loved you better; think that your true husband is with you, and you are not to bear it alone.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt

  source_text: HUNT.  Let your bed wait, Andrew.  I want a little chat with you; just a quiet little sociable wheeze.  Just
    about our friends, you know.  About Badger Moore, and George the Dook, and Jemmy Rivers, and Deacon Brodie, Andrew.  Particularly
    Deacon Brodie.
  source_languages:

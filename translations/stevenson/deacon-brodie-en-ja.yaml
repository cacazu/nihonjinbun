  translation_ja: ブロディ。運だと！　わたしのような男に運を持ち出すんじゃない！　悪魔並みの見立てがあるとはなぜ言わん？　わたしの手合いは賭けに出るんじゃない。計画を立てるのさ、アナグマ。計画を立て、運を当てにするのはおまえみたいな畜生のほうだ。［鈴鳴らしのジョーディもそうだ。わたしたちは機会をとらえる前に、機会を作り出すのだ］。

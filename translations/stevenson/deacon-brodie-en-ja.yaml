- id: db-0711
  section_id: act-iii-tableau-v-scene-iv
  kind: paragraph
  origin: source
  source_text: HUNT.  Don’t lie crawling there, but get up and answer me like a man. Ain’t this Deacon Brodie the fine workman
    that’s been doing all these tip-topping burglaries?
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line

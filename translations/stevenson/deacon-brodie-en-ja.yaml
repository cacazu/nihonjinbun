- id: db-0916
  section_id: act-iv-tableau-vii-scene-i
  kind: paragraph
  origin: source
  source_text: SMITH (lighting lantern).  All right, old mumble-peg.  Don’t you get carried away by the fire of old Rome.  That’s
    your motto.  Here are the tools; a perfect picter of the sublime and beautiful; and all I hope is, that our friend and
    pitcher, the Deakin, will make a better job of it than he did last night.  If he don’t, I shall retire from the business—that’s
    all; and it’ll be George and his little wife and a black footman till death do us part.
  source_languages:
  - en
  source_locations:
  - source_id: gutenberg-719
    precision: line
    url: https://gutenberg.pglaf.org/cache/epub/719/pg719.txt

  - "id": "voy-379"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was a good deal astonished at this scene, because I am pretty well acquainted with the ways of French strollers, more or less artistic; and have always found them singularly pleasing. Any stroller must be dear to the right-thinking heart; if it were only as a living protest against offices and the mercantile spirit, and as something to remind us that life is not by necessity the kind of thing we generally make it. Even a German band, if you see it leaving town in the early morning for a campaign in country places, among trees and meadows, has a romantic flavour for the imagination. There is nobody, under thirty, so dead but his heart will stir a little at sight of a gypsies’ camp. ‘We are not cotton-spinners all’; or, at least, not all through. There is some life in humanity yet: and youth will now and again find a brave word to say in dispraise of riches, and throw up a situation to go strolling with a knapsack."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 379
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[301]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-379"
    "translation_ja": "私はその光景に大いに驚いた。いくらかでも芸のあるフランスの旅回りの流儀ならかなりよく知っていて、いつも並外れて人当たりがよいと感じてきたからだ。何であれ旅芸人は、まっとうに考える心にはいとしいものであるにちがいない。役所勤めと商売根性に対する生きた抗議としてだけでも、また人生が必ずしもふだんわれわれの作っている種類のものではないと思い出させる何かとしてだけでも。ドイツの街頭楽隊でさえ、早朝に町を出て木々と草地のあいだ、田舎のあちこちへの巡業に赴くのを見ると、想像をさそうロマンの香りがある。三十歳未満の人間で、放浪の一行の野営を見て心が少しも動かぬほど死んだ者はない。「われわれすべてが綿の紡績業者ではない」。少なくとも、骨の髄までそうではない。人類にはまだいくらか命が残っている。若さは時には富をけなす勇気ある言葉を見つけ、勤めを投げうって背嚢を背負う旅人になろうとする。"
    "translation_status": "reviewed"
  - "id": "voy-380"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "An Englishman has always special facilities for intercourse with French gymnasts; for England is the natural home of gymnasts. This or that fellow, in his tights and spangles, is sure to know a word or two of English, to have drunk English aff-’n-aff, and perhaps performed in an English music-hall. He is a countryman of mine by profession. He leaps, like the Belgian boating men, to the notion that I must be an athlete myself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 380
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[302]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-380"
    "translation_ja": "イギリス人にはフランスの軽業師と付き合う特別な便宜がいつもある。イングランドは軽業師の生まれながらの故郷だからだ。タイツをはき、スパンコールをつけたこの男もあの男も、きっと一語二語は英語を知り、英国ふうに「ハーフ・アンド・ハーフ」の混ぜビールを飲み、おそらく英国のミュージックホールに出た経験まである。その職業からして彼はわが同国人だ。彼はベルギーのボート仲間たちよろしく、私も運動家にちがいないという考えに飛びつく。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 240
          "end": 250
          "exact": "aff-’n-aff"
  - "id": "voy-381"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But the gymnast is not my favourite; he has little or no tincture of the artist in his composition; his soul is small and pedestrian, for the most part, since his profession makes no call upon it, and does not accustom him to high ideas. But if a man is only so much of an actor that he can stumble through a farce, he is made free of a new order of thoughts. He has something else to think about beside the money-box. He has a pride of his own, and, what is of far more importance, he has an aim before him that he can never quite attain. He has gone upon a pilgrimage that will last him his life long, because there is no end to it short of perfection. He will better upon himself a little day by day; or even if he has given up the attempt, he will always remember that once upon a time he had conceived this high ideal, that once upon a time he had fallen in love with a star. ‘’Tis better to have loved and lost.’ Although the moon should have nothing to say to Endymion, although he should settle down with Audrey and feed pigs, do you not think he would move with a better grace, and cherish higher thoughts to the end? The louts he meets at church never had a fancy above Audrey’s snood; but there is a reminiscence in Endymion’s heart that, like a spice, keeps it fresh and haughty."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 381
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[303]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-381"
    "translation_ja": "しかし軽業師は私の贔屓ではない。彼の人柄には芸術家の気配がほとんど、もしくはまったくない。多くの場合、その魂が小さく平凡なのは、職業がそれに何も要求せず、高い観念に慣らさないからだ。だがたどたどしくも一つの笑劇を演じ通せるだけの役者でありさえすれば、新しい次元の思いをわがものとして歩けるようになる。金箱のほかに考えられるものが一つある。わが誇りがあり、はるかに重要なことには、けっして達しきれぬ目的が前にある。彼は一生つづく巡礼に出ている。完全のほかには終着点がないからだ。日ごとにほんの少し昨日の自分よりうまくなるだろう。あるいは努力を断念したとしても、かつてこの高い理想を抱いたこと、かつて星に恋をしたことをいつも覚えているだろう。「愛して失ったほうがよい」。月がエンディミオンを相手にしてくれず、彼がオードリーと所帯を持って豚に餌をやるようになったとしても、その身のこなしはいっそう美しく、最後までより高い思いを胸に抱くとはお思いにならないか。教会で出会う田舎者たちはオードリーの髪紐より高い夢は見たことがない。しかしエンディミオンの胸には一つの思い出があり、香辛料のようにその心のみずみずしさと誇りを保たせる。"
    "translation_status": "reviewed"
  - "id": "voy-382"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To be even one of the outskirters of art, leaves a fine stamp on a man’s countenance. I remember once dining with a party in the inn at Château Landon. Most of them were unmistakable bagmen; others well-to-do peasantry; but there was one young fellow in a blouse, whose face stood out from among the rest surprisingly. It looked more finished; more of the spirit looked out through it; it had a living, expressive air, and you could see that his eyes took things in. My companion and I wondered greatly who and what he could be. It was fair-time in Château Landon, and when we went along to the booths, we had our question answered; for there was our friend busily fiddling for the peasants to caper to. He was a wandering violinist."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 382
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[304]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-382"
    "translation_ja": "芸術のごく外べりにいる者でさえ、顔には好ましい刻印が残る。いつかシャトー＝ランドンの宿で大勢と食事したのを思い出す。大抵はひと目でそうとわかる巡回商人で、ほかは裕福な農民だった。だが上っ張りの若者が一人いて、その顔は驚くほどほかから際立っていた。よりよく整い、そこからより多くの精神がのぞき、生き生きして表情に富み、その眼が物事をとらえるのが見て取れた。連れと私は何者で何をする人だろうとしきりにいぶかった。シャトー＝ランドンは市の季節だった。露店の方へ行くと、答えがわかった。あの友がそこで一生懸命ヴァイオリンを弾き、農民たちがその音に合わせて跳ね踊っていた。旅まわりのヴァイオリン弾きだった。"
    "translation_status": "reviewed"
  - "id": "voy-383"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A troop of strollers once came to the inn where I was staying, in the department of Seine et Marne. There was a father and mother; two daughters, brazen, blowsy hussies, who sang and acted, without an idea of how to set about either; and a dark young man, like a tutor, a recalcitrant house-painter, who sang and acted not amiss. The mother was the genius of the party, so far as genius can be spoken of with regard to such a pack of incompetent humbugs; and her husband could not find words to express his admiration for her comic countryman. ‘You should see my old woman,’ said he, and nodded his beery countenance. One night they performed in the stable-yard, with flaring lamps—a wretched exhibition, coldly looked upon by a village audience. Next night, as soon as the lamps were lighted, there came a plump of rain, and they had to sweep away their baggage as fast as possible, and make off to the barn where they harboured, cold, wet, and supperless. In the morning, a dear friend of mine, who has as warm a heart for strollers as I have myself, made a little collection, and sent it by my hands to comfort them for their disappointment. I gave it to the father; he thanked me cordially, and we drank a cup together in the kitchen, talking of roads, and audiences, and hard times."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 383
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[305]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-383"
    "translation_ja": "セーヌ＝エ＝マルヌ県で私が泊まっていた宿に、いつか旅芝居の一座が来た。父と母がいた。娘が二人、どこから手をつければよいのかの知恵もなく歌って演じる、ずうずうしくぱっとしないあばずれだった。そして家庭教師のような黒髪の若者、家の塗装職にはなじまず飛び出した男で、歌も芝居もそう悪くなかった。こういう能なしの山師集団について天才など言えるとすれば、一座の天才は母親だった。夫は、彼女が滑稽な田舎男をやる芸への感嘆を表す言葉が見つからなかった。「うちのかみさんを見てごらんなさい」と言って、ビールでゆるんだ顔でうなずいた。ある晩は厩の中庭で、風に揺れるランプの下で演じた。村の観衆に冷たく見られた情けない出し物だった。次の晩はランプをともしたとたん土砂降りが来て、できる限り早く荷物をかき集め、宿所の納屋へ引き下がらねばならなかった。寒く、濡れ、夕食抜きだった。朝、私に劣らぬほど旅芸人に心あたたかい親友が少し金を集め、失望の慰めにと私の手で届けた。父親に渡した。心から礼を言ってくれ、われわれは台所で一杯やり、街道のこと、客のこと、不景気のことを話した。"
    "translation_status": "reviewed"
  - "id": "voy-384"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When I was going, up got my old stroller, and off with his hat. ‘I am afraid,’ said he, ‘that Monsieur will think me altogether a beggar; but I have another demand to make upon him.’ I began to hate him on the spot. ‘We play again to-night,’ he went on. ‘Of course, I shall refuse to accept any more money from Monsieur and his friends, who have been already so liberal. But our programme of to-night is something truly creditable; and I cling to the idea that Monsieur will honour us with his presence.’ And then, with a shrug and a smile: ‘Monsieur understands—the vanity of an artist!’ Save the mark! The vanity of an artist! That is the kind of thing that reconciles me to life: a ragged, tippling, incompetent old rogue, with the manners of a gentleman, and the vanity of an artist, to keep up his self-respect!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 384
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[306]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-384"
    "translation_ja": "私が去ろうとすると、わが老旅役者は立ち上がり、帽子を取った。「こう申すると、私をまるで乞食だとムシューがお思いになるのではと恐れますが、もう一つお願いがあるのです」。私はその場で彼がいやになりはじめた。「今晩もやります」と彼は続けた。「むろん、すでにたいそうご厚志をいただいたムシューとお友達から、これ以上お金はお断りします。ですが今夜の出し物はほんとうに恥ずかしくないものですし、ムシューがご臨席の栄を賜るという望みを捨て切れません」。それから肩をすくめ、微笑んで、「ムシューにはおわかりですね。芸術家の虚栄ですよ！」。なんということ！　芸術家の虚栄！　こういうことが私を人生と和解させてくれる。ぼろを着た、飲んだくれで無能な老いたならず者が、紳士の礼儀と芸術家の虚栄を持っていて、おかげで自尊心を保てるとは！"
    "translation_status": "reviewed"
  - "id": "voy-385"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But the man after my own heart is M. de Vauversin. It is nearly two years since I saw him first, and indeed I hope I may see him often again. Here is his first programme, as I found it on the breakfast-table, and have kept it ever since as a relic of bright days:"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 385
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[307]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-385"
    "translation_ja": "だが私の心にぴったりの男はド・ヴォーヴェルサン氏だ。初めて会ってから二年近くになる。これからもまことに何度となく会いたいと願う。ここにあげるのは最初の番組である。朝食の卓で見つけ、明るい日々の遺品として以来ずっと保存してきた。"

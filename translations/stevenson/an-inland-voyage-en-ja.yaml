  - "id": "voy-326"
    "section_id": "ch-15"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "One other circumstance distressed me. I could bear a Miserere myself, having had a good deal of open-air exercise of late; but I wished the old people somewhere else. It was neither the right sort of music nor the right sort of divinity for men and women who have come through most accidents by this time, and probably have an opinion of their own upon the tragic element in life. A person up in years can generally do his own Miserere for himself; although I notice that such an one often prefers Jubilate Deo for his ordinary singing. On the whole, the most religious exercise for the aged is probably to recall their own experience; so many friends dead, so many hopes disappointed, so many slips and stumbles, and withal so many bright days and smiling providences; there is surely the matter of a very eloquent sermon in all this."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 326
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[253]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-326"
    "translation_ja": "ほかにひとつ、私をつらくしたことがあった。私はこのところ屋外で十分からだを動かしていたから、自分では「ミゼレーレ」にだって耐えられた。だがあの老人たちにはよそにいてほしかった。もう人生の大概の事件をくぐり抜け、おそらく生の悲劇的要素についてとうに自分の考えを持つ男女に聴かせるには、音楽としても神学としてもふさわしい種類ではなかった。年配の人はたいがい自分で自分に「憐れみたまえ」を歌える。もっとも普段の歌には「神を喜びたたえよ」を好むことが多いのも見て取れる。総じて、老いた者にとっていちばん信心深い行いは、わが経験を呼び返すことだろう。こんなに多くの友が死に、こんなに多くの望みが裏切られ、しくじりもつまずきもこんなに多かった。それでもなおこんなに多く晴れた日があり、微笑む摂理の心遣いがあった。これらすべてのうちには、まことに雄弁な説教の材料があるではないか。"
    "translation_status": "reviewed"

  - "id": "voy-172"
    "section_id": "ch-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I wonder, by-the-bye, what they call Waterloo crackers in France; perhaps Austerlitz crackers. There is a great deal in the point of view. Do you remember the Frenchman who, travelling by way of Southampton, was put down in Waterloo Station, and had to drive across Waterloo Bridge? He had a mind to go home again, it seems."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 172
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[110]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-172"
    "translation_ja": "ところでワーテルロー爆竹はフランスでは何と呼ぶのだろう。たぶんアウステルリッツ爆竹か。物はずいぶん見方によるものだ。サウサンプトン経由で旅してきたフランス人がワーテルロー駅で降ろされ、馬車でワーテルロー橋を渡らねばならなかった話をお覚えだろうか。そのまま帰ろうかと思ったそうだ。"
    "translation_status": "reviewed"
  - "id": "voy-173"
    "section_id": "ch-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Pont itself is on the river, but whereas it is ten minutes’ walk from Quartes by dry land, it is six weary kilometres by water. We left our bags at the inn, and walked to our canoes through the wet orchards unencumbered. Some of the children were there to see us off, but we were no longer the mysterious beings of the night before. A departure is much less romantic than an unexplained arrival in the golden evening. Although we might be greatly taken at a ghost’s first appearance, we should behold him vanish with comparative equanimity."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 173
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[111]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-173"
    "translation_ja": "ポンそのものも川に面するのだが、カルテから陸なら徒歩十分なのに、水を行くとうんざりする六キロもある。われわれは袋を宿に置き、雨に濡れた果樹園を身軽に歩いてカヌーのところへ行った。子供らが何人か見送りに来ていたが、われわれはもう前夜の謎めいた者どもではなかった。出立は、金色の夕べの、わけのわからぬ出現ほどには物語めいていない。幽霊が現れた瞬間は大いに心を奪われても、消えてゆくのは案外平静に見ていられるにちがいない。"
    "translation_status": "reviewed"
  - "id": "voy-174"
    "section_id": "ch-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The good folk of the inn at Pont, when we called there for the bags, were overcome with marvelling. At sight of these two dainty little boats, with a fluttering Union Jack on each, and all the varnish shining from the sponge, they began to perceive that they had entertained angels unawares. The landlady stood upon the bridge, probably lamenting she had charged so little; the son ran to and fro, and called out the neighbours to enjoy the sight; and we paddled away from quite a crowd of wrapt observers. These gentlemen pedlars, indeed! Now you see their quality too late."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 174
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[112]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-174"
    "translation_ja": "袋を取りに寄ると、ポンの宿の善良な人たちは驚きのあまりどうしようもない様子だった。いずれも英国旗をひらめかせ、海綿で拭いたばかりのニスがつやつやと光る、あの小さな二艘の優美な姿を見て、そうとは知らず天使をもてなしていたのだとはじめて気づいたらしい。女将は橋に立ち、おそらく料金が安すぎたのを嘆いていた。息子はあちらこちら駆け回って、隣近所に見物を呼びかけた。われわれはずいぶんな数のうっとりした見物人をあとに、漕ぎ去った。お客さんがた、行商の方ですね、だって！　いまさら身分がわかっても手おくれですよ。"
    "translation_status": "reviewed"
  - "id": "voy-175"
    "section_id": "ch-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The whole day was showery, with occasional drenching plumps. We were soaked to the skin, then partially dried in the sun, then soaked once more. But there were some calm intervals, and one notably, when we were skirting the forest of Mormal, a sinister name to the ear, but a place most gratifying to sight and smell. It looked solemn along the river-side, drooping its boughs into the water, and piling them up aloft into a wall of leaves. What is a forest but a city of nature’s own, full of hardy and innocuous living things, where there is nothing dead and nothing made with the hands, but the citizens themselves are the houses and public monuments? There is nothing so much alive, and yet so quiet, as a woodland; and a pair of people, swinging past in canoes, feel very small and bustling by comparison."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 175
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[113]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-175"
    "translation_ja": "一日じゅうにわか雨で、ときどきずぶ濡れにする大降りが来た。肌まで濡れ、日を浴びて半ば乾き、また濡れた。それでも凪いだ合間があった。とりわけモルマルの森のきわを通ったひとときがそうだった。耳にすれば不吉な名前だが、目にも鼻にもこのうえなく心地よいところだ。川沿いの姿は荘重だった。水に枝を垂らし、また高くそれを積み重ねて葉の壁としていた。そもそも森とは、たくましく無害な生き物が満ち、死んだものも人の手で造られたものも一つとなく、市民自身が家々であり公共の記念建造物であるような、自然そのものの都市にほかならないではないか。森ほど生気に富み、しかも静かなものはない。そのそばをカヌーでせわしく漕いで通る二人の人間は、ひきくらべて身の小ささとせわしなさを感じる。"
    "translation_status": "reviewed"
  - "id": "voy-176"
    "section_id": "ch-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And surely of all smells in the world, the smell of many trees is the sweetest and most fortifying. The sea has a rude, pistolling sort of odour, that takes you in the nostrils like snuff, and carries with it a fine sentiment of open water and tall ships; but the smell of a forest, which comes nearest to this in tonic quality, surpasses it by many degrees in the quality of softness. Again, the smell of the sea has little variety, but the smell of a forest is infinitely changeful; it varies with the hour of the day, not in strength merely, but in character; and the different sorts of trees, as you go from one zone of the wood to another, seem to live among different kinds of atmosphere. Usually the resin of the fir predominates. But some woods are more coquettish in their habits; and the breath of the forest of Mormal, as it came aboard upon us that showery afternoon, was perfumed with nothing less delicate than sweetbrier."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 176
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[114]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-176"
    "translation_ja": "それに、世のあらゆる香りのうち、多くの木々の香りほど甘く、人を力づけるものがあるだろうか。海にはいささか荒々しく、ピストルを放つような匂いがあって、嗅ぎ煙草よろしく鼻を直撃し、広々した水面と帆柱高い船を思わせるすばらしい気分を運んでくる。強壮の力ではこれに最も近い森の香りが、柔らかさではいく段も上だ。また海の匂いに変化は少ないが、森の香りは限りなく移ろう。一日の刻々に強さばかりか性質まで変わり、森の一区画から次へ入ると、木の種類ごとに違う大気の中で生きているようだ。ふつうはモミの樹脂が勝つ。だがもっとおしゃれな習いの森もある。あのにわか雨の午後、われわれの舟に届いたモルマルの森の息は、野ばらという選り抜きの繊細な香りをまとっていた。"
    "translation_status": "reviewed"
  - "id": "voy-177"
    "section_id": "ch-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I wish our way had always lain among woods. Trees are the most civil society. An old oak that has been growing where he stands since before the Reformation, taller than many spires, more stately than the greater part of mountains, and yet a living thing, liable to sicknesses and death, like you and me: is not that in itself a speaking lesson in history? But acres on acres full of such patriarchs contiguously rooted, their green tops billowing in the wind, their stalwart younglings pushing up about their knees: a whole forest, healthy and beautiful, giving colour to the light, giving perfume to the air: what is this but the most imposing piece in nature’s repertory? Heine wished to lie like Merlin under the oaks of Broceliande. I should not be satisfied with one tree; but if the wood grew together like a banyan grove, I would be buried under the tap-root of the whole; my parts should circulate from oak to oak; and my consciousness should be diffused abroad in all the forest, and give a common heart to that assembly of green spires, so that it also might rejoice in its own loveliness and dignity. I think I feel a thousand squirrels leaping from bough to bough in my vast mausoleum; and the birds and the winds merrily coursing over its uneven, leafy surface."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 177
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[115]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-177"
    "translation_ja": "私たちの道がいつも森の中にあったらよかった。木ほど礼儀のよい仲間はない。宗教改革より前から同じ場所に育ち、幾多の教会尖塔より高く、大方の山よりも堂々として、それでいて君や私のように病や死に見舞われる生き物である、一本の老樫。それだけでも、ものを言う歴史の教訓ではないか。だがその老大家たちが幾エーカーもつづいて隣り合って根を張り、緑の梢が風に波打ち、足もとには頑健な若木が押し合って伸びている。森の全体が健やかで美しく、光に色を与え、空気に香りを与える。これこそ自然が持ち合わせる演目のうち最も堂々たる一幕ではないか。ハイネはマーリンのようにブロセリアンドの樫の下に横たわりたいと言った。私は一本では満足しない。森がバニヤンの林のようにつながって生えるものなら、森全体の直根の下に埋めてもらいたい。私の体のかけらが樫から樫へめぐり、私の意識が森じゅうに広がって、緑の尖塔の群れに一つの心を与え、それがみずからの美しさと威厳を喜べるように。もう感じるような気がする。私の広大な霊廟の中を千匹のリスが枝から枝へ飛び、起伏する葉の海の表を鳥や風が楽しげに駆け抜けてゆくのを。"
    "translation_status": "reviewed"
  - "id": "voy-178"
    "section_id": "ch-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Alas! the forest of Mormal is only a little bit of a wood, and it was but for a little way that we skirted by its boundaries. And the rest of the time the rain kept coming in squirts and the wind in squalls, until one’s heart grew weary of such fitful, scolding weather. It was odd how the showers began when we had to carry the boats over a lock, and must expose our legs. They always did. This is a sort of thing that readily begets a personal feeling against nature. There seems no reason why the shower should not come five minutes before or five minutes after, unless you suppose an intention to affront you. The Cigarette had a mackintosh which put him more or less above these contrarieties. But I had to bear the brunt uncovered. I began to remember that nature was a woman. My companion, in a rosier temper, listened with great satisfaction to my Jeremiads, and ironically concurred. He instanced, as a cognate matter, the action of the tides, ‘which,’ said he, ‘was altogether designed for the confusion of canoeists, except in so far as it was calculated to minister to a barren vanity on the part of the moon.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 178
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[116]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-178"
    "translation_ja": "悲しいかな、モルマルの森はほんの小さな林で、その境に沿って行けたのはわずかの道のりだった。あとは雨が吹きつけ風があおり、気まぐれな小言のような天気に、とうとう心がうんざりした。おかしなことに、閘門を越えて船を運ぶためどうしても脚を出さなくてはならぬ時を選んで夕立が始まる。いつだってそうだった。こういうことは自然に対する個人的な恨みをたやすく生む。人を侮辱する意図を仮定しないかぎり、雨が五分先なりあとになりに来て悪いわけがない。シガレット号の主はゴム引き外套があって、こうしたいやがらせの埒外に多少なりと身を置けた。だが私には覆いがなく、矢面に立たねばならなかった。自然は女だというのを思い出しはじめた。相棒はもっとうるわしいご機嫌で、私の嘆き節をこの上なく楽しげに聴いて皮肉に相づちを打った。同類の例として彼は潮の満干を挙げた。「あれはまったく」と言う。「月の側の実りなき虚栄心を満足させるという計算があるぶんを除けば、すべてカヌー乗りを困らせるための仕掛けだよ」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 618
          "end": 627
          "exact": "Cigarette"
  - "id": "voy-179"
    "section_id": "ch-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At the last lock, some little way out of Landrecies, I refused to go any farther; and sat in a drift of rain by the side of the bank, to have a reviving pipe. A vivacious old man, whom I take to have been the devil, drew near and questioned me about our journey. In the fulness of my heart, I laid bare our plans before him. He said it was the silliest enterprise that ever he heard of. Why, did I not know, he asked me, that it was nothing but locks, locks, locks, the whole way? not to mention that, at this season of the year, we should find the Oise quite dry? ‘Get into a train, my little young man,’ said he, I and go you away home to your parents.’ I was so astounded at the man’s malice, that I could only stare at him in silence. A tree would never have spoken to me like this. At last I got out with some words. We had come from Antwerp already, I told him, which was a good long way; and we should do the rest in spite of him. Yes, I said, if there were no other reason, I would do it now, just because he had dared to say we could not. The pleasant old gentleman looked at me sneeringly, made an allusion to my canoe, and marched of, waggling his head."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 179
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[117]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-179"
    "translation_ja": "ランドルシーの少し手前、最後の閘門で私はもう一歩も動かぬと宣言し、吹き流れる雨の中、岸の端にすわって気付けの一服にした。元気はつらつの老人が近づいてきた。悪魔だったと思う。われわれの旅について質問したので、胸がいっぱいだった私は計画を洗いざらい明かした。老人はこれまで耳にした中でいちばん愚かな企てだと言った。いったい道中ずっと閘門、閘門、また閘門と、それきりだと知らんのか、と尋ねた。そのうえ今ごろならオワーズ川など干上がりきっていると。「汽車に乗りなさい、お若いの」と彼は言った。「さっさと両親のところへお帰り」。私は男の意地悪さにあっけに取られ、黙ってその顔を見るしかなかった。木ならこんな言い方はしなかったろう。ようやく言葉が出た。すでにアントウェルペンから来たので、かなりの道のりだ、あんたの言い分がどうでも残りもやりとげる、と言った。そうだ、ほかに理由がなくても、われわれにはできぬとあんたがずうずうしくも口にした、ただそれだけで、いま私はやりとげてみせる。愛すべき老紳士はせせら笑うように私を見、私のカヌーにひと言触れると、頭を振り振り去っていった。"
    "translation_status": "reviewed"
  - "id": "voy-180"
    "section_id": "ch-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was still inwardly fuming, when up came a pair of young fellows, who imagined I was the Cigarette’s servant, on a comparison, I suppose, of my bare jersey with the other’s mackintosh, and asked me many questions about my place and my master’s character. I said he was a good enough fellow, but had this absurd voyage on the head. ‘O no, no,’ said one, ‘you must not say that; it is not absurd; it is very courageous of him.’ I believe these were a couple of angels sent to give me heart again. It was truly fortifying to reproduce all the old man’s insinuations, as if they were original to me in my character of a malcontent footman, and have them brushed away like so many flies by these admirable young men."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 180
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[118]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-180"
    "translation_ja": "私はまだ腹の中が煮えくり返っていた。そこへ若者が二人やって来て、私をシガレット号の主の召使いだと思い込み、勤めの様子やご主人の人柄についていろいろ聞いた。こちらはジャージーを着たきり、むこうはゴム引きの外套、という比較の結果だろう。まあいい男だが、このばかげた船旅を思いついたのだ、と私は言った。「いや、いけない」と一人が言った。「そんなことを言っちゃいけない。ばかげてなんかいない。まったく勇敢な方だ」。この二人は私を元気づけに遣わされた天使だったと思う。自分は不平がましい従僕、あの老人の当てこすりはその私の独創だという顔で残らず繰り返し、これら立派な若者に蠅でも払うように払いのけてもらうと、まことに力が湧いた。"
    "translation_status": "reviewed"
    "annotations":

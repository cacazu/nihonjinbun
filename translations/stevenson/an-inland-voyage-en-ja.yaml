        "xpath": "/html/body/p[107]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-168"
    "translation_ja": "なるほど彼の言い方どおり、ひとりで寝る心配は、まずなかった。一家三人に寝台は一つしかない。こちら二人は一人分の寝場所で済まされてはかなわぬと断固抗議して、屋根裏に寝台が二つ入った仕切りをもらった。寝台を除く家具といえば、きっかり帽子掛けの釘三本と机が一脚。コップの水すらなかったが、ありがたいことに、窓は開いた。"
    "translation_status": "reviewed"
  - "id": "voy-169"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Some time before I fell asleep the loft was full of the sound of mighty snoring: the Gilliards, and the labourers, and the people of the inn, all at it, I suppose, with one consent. The young moon outside shone very clearly over Pont-sur-Sambre, and down upon the ale-house where all we pedlars were abed."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 169
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[108]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-169"
    "translation_ja": "私が眠りにつくかなり前から、屋根裏にはものすごいいびきが満ちていた。ジリアール一家も農夫も宿の人も、申し合わせたようにいっせいに始めたのだろう。外では若い月がポン＝シュル＝サンブルの上でひときわ澄んで輝き、われら行商人がことごとく床についた居酒屋を照らしていた。"
    "translation_status": "reviewed"

  - "id": "voy-109"
    "section_id": "ch-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When the young man was gone, we countermanded our candles, and ordered some brandy and water. The great billows had gone over our head. The Royal Nautical Sportsmen were as nice young fellows as a man would wish to see, but they were a trifle too young and a thought too nautical for us. We began to see that we were old and cynical; we liked ease and the agreeable rambling of the human mind about this and the other subject; we did not want to disgrace our native land by messing an eight, or toiling pitifully in the wake of the champion canoeist. In short, we had recourse to flight. It seemed ungrateful, but we tried to make that good on a card loaded with sincere compliments. And indeed it was no time for scruples; we seemed to feel the hot breath of the champion on our necks."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 109
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[53]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-109"
    "translation_ja": "青年が去ると、われわれは蝋燭を取り消し、ブランデーの水割りを頼んだ。大波はすでに頭上を洗い越した。王立クラブの連中は望みうるかぎりのいい青年だったが、われわれにはほんの少し若すぎて、ほんのちょっぴり舟好みに過ぎた。われわれは自分が年を取り冷笑的になっていることを認め始めた。気楽さと、人の心があれこれの題のまわりを心地よくさまようのが好きだった。エイト艇をめちゃめちゃにしたり、カヌー選手権者の航跡を情けなく漕ぎ追ったりして、故国の顔に泥を塗りたいとは思わなかった。要するに逃げることにした。恩知らずのようだが、心のこもった賛辞を名刺いっぱいに盛り込んで、そこを補おうとした。しかしためらっている暇は実際なかった。選手権者の熱い息が首筋に掛かっているようだった。"
    "translation_status": "reviewed"

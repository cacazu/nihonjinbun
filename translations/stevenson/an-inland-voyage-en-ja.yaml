  - "id": "voy-122"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "About three in the afternoon the whole establishment of the Grand Cerf accompanied us to the water’s edge. The man of the omnibus was there with haggard eyes. Poor cage-bird! Do I not remember the time when I myself haunted the station, to watch train after train carry its complement of freemen into the night, and read the names of distant places on the time-bills with indescribable longings?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 122
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[64]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-122"
    "translation_ja": "午後三時ごろ、グラン・セールの総員がわれわれを水際まで送ってきた。あの御者も、やつれた目をして来ていた。哀れな籠の鳥よ！　私にもおぼえがないものか。駅に入りびたり、何本もの汽車がひと荷ずつ自由な人間を乗せて夜の中へ運び去るのを見送り、時刻表の遠い地名を、なんとも言いがたい憧れで読んだころを。"
    "translation_status": "reviewed"

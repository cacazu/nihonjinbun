          "exact": "The"
  - "id": "voy-236"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In the morning a hawker and his wife went down the street at a foot-pace, singing to a very slow, lamentable music ‘O France, mes amours.’ It brought everybody to the door; and when our landlady called in the man to buy the words, he had not a copy of them left. She was not the first nor the second who had been taken with the song. There is something very pathetic in the love of the French people, since the war, for dismal patriotic music-making. I have watched a forester from Alsace while some one was singing ‘Les malheurs de la France,’ at a baptismal party in the neighbourhood of Fontainebleau. He arose from the table and took his son aside, close by where I was standing. ‘Listen, listen,’ he said, bearing on the boy’s shoulder, ‘and remember this, my son.’ A little after he went out into the garden suddenly, and I could hear him sobbing in the darkness."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 236
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[169]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-236"
    "translation_ja": "朝方、一人の行商人が妻とともに、ごくゆっくりもの悲しい調べに合わせて「おおフランス、わが愛よ」と歌いながら、並足で通りを下ってきた。みんなが戸口に出た。うちの女将が歌詞を買おうと男を呼び入れたときには、一枚も残っていなかった。その歌に心を奪われたのは彼女が一人目でも二人目でもなかった。あの戦争以来、フランスの人々が陰気な愛国の音楽を好むのには、痛切なものがある。フォンテーヌブロー近くの洗礼祝いで、誰かが「フランスの不幸」を歌ったとき、私はアルザス出身の森林監視人を見ていた。彼は食卓を立ち、息子を私の立っていたすぐそばに呼び寄せた。「聞きなさい、よく聞きなさい」と男の子の肩に手を置いて言った。「これを覚えておくんだよ」。ほどなく彼はふいと庭へ出ていって、闇の中ですすり泣くのが聞こえた。"
    "translation_status": "reviewed"

          "end": 432
          "exact": "Cigarette"
  - "id": "voy-294"
    "section_id": "ch-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Moy (pronounce Moÿ) was a pleasant little village, gathered round a château in a moat. The air was perfumed with hemp from neighbouring fields. At the Golden Sheep we found excellent entertainment. German shells from the siege of La Fère, Nürnberg figures, gold-fish in a bowl, and all manner of knick-knacks, embellished the public room. The landlady was a stout, plain, short-sighted, motherly body, with something not far short of a genius for cookery. She had a guess of her excellence herself. After every dish was sent in, she would come and look on at the dinner for a while, with puckered, blinking eyes. ‘C’est bon, n’est-ce pas?’ she would say; and when she had received a proper answer, she disappeared into the kitchen. That common French dish, partridge and cabbages, became a new thing in my eyes at the Golden Sheep; and many subsequent dinners have bitterly disappointed me in consequence. Sweet was our rest in the Golden Sheep at Moy."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 294
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[224]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-294"
    "translation_ja": "モイ（つづりは Moy、発音は Moÿ）は、堀に囲まれた館のまわりに集まる感じのよい小村だった。近くの畑から大麻の香りが漂っていた。「金の羊」亭ではすばらしい歓待を受けた。ラ・フェール包囲戦のドイツ軍の砲弾、ニュルンベルクの人形、鉢に泳ぐ金魚、その他もろもろの飾り物が広間を飾った。女将は太って飾り気がなく、近眼で、母親らしい人で、料理の腕には天才にほぼ届くものがあった。自分の腕前を自覚するところもあった。一皿送り出すごとにやって来て、目を細くしばたたきながら、しばらく食事の様子を見ていた。「セ・ボン、ネス・パ？　おいしいでしょう」と言い、しかるべき答えを受け取ると台所に消えた。「金の羊」亭でヤマウズラとキャベツというフランスのありふれた料理が私の目には新しいものとなった。おかげでのちに何度も食事でひどくがっかりさせられた。モイの「金の羊」亭での憩いは楽しかった。"
    "translation_status": "reviewed"

  - "id": "voy-371"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There is one more article, however, of happier import. ‘All these indulgences,’ it appeared, ‘are applicable to souls in purgatory.’ For God’s sake, ye ladies of Creil, apply them all to the souls in purgatory without delay! Burns would take no hire for his last songs, preferring to serve his country out of unmixed love. Suppose you were to imitate the exciseman, mesdames, and even if the souls in purgatory were not greatly bettered, some souls in Creil upon the Oise would find themselves none the worse either here or hereafter."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 371
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[294]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-371"
    "translation_ja": "とはいえもう一条、もっと喜ばしい趣旨のものがある。「これらの免償はすべて」とある。「煉獄の霊魂にも適用しうる」。神に免じて、クレイユのご婦人がた、さっそく全部、煉獄の霊魂に振り向けてやってください！　バーンズは晩年の歌に報酬をいっさい受けず、混じりけのない愛で祖国に奉仕するほうを選んだ。ご婦人がた、あの物品税の収税吏をまねてごらんなさい。煉獄の霊魂には大きな利益がなかったとしても、オワーズ河畔のクレイユの霊魂のいくつかは、この世でもあの世でも、そうして損をすることはないだろう。"
    "translation_status": "reviewed"
  - "id": "voy-372"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I cannot help wondering, as I transcribe these notes, whether a Protestant born and bred is in a fit state to understand these signs, and do them what justice they deserve; and I cannot help answering that he is not. They cannot look so merely ugly and mean to the faithful as they do to me. I see that as clearly as a proposition in Euclid. For these believers are neither weak nor wicked. They can put up their tablet commanding Saint Joseph for his despatch, as if he were still a village carpenter; they can ‘recite the required dizaine,’ and metaphorically pocket the indulgence, as if they had done a job for Heaven; and then they can go out and look down unabashed upon this wonderful river flowing by, and up without confusion at the pin-point stars, which are themselves great worlds full of flowing rivers greater than the Oise. I see it as plainly, I say, as a proposition in Euclid, that my Protestant mind has missed the point, and that there goes with these deformities some higher and more religious spirit than I dream."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 372
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[295]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-372"
    "translation_ja": "こうして手記を書き写していると、生まれも育ちもプロテスタントの人間に、こういうしるしを理解して相応の正当な評価をする資格があるだろうか、とつい思う。そして、ない、と答えずにはいられない。信徒にとってこれらは、私の目に映るように、ただ醜く卑しく見えるはずはない。ユークリッドの命題のようにはっきりそう見える。この信徒たちは軟弱でも邪悪でもない。いまだ村の大工であるかのように、聖ヨセフの手早さを褒める額を掲げることもできる。「決められた十回を唱え」、まるで天のためにひと仕事したように、比喩でいえば免償を懐におさめることもできる。そのあとで外に出て、かたわらを流れる驚くべきこの川を臆せず見下ろし、針の穴ほどの星々を、戸惑いも見せず見上げることもできる。星々はそれぞれ大きな世界で、オワーズよりずっと大きい川がいくつも流れているのだ。私のプロテスタントの心は肝心なところを見落としている。こうしたいびつさには、私の夢にも及ばぬ高い、もっと宗教的な精神が伴っている。これは、もう一度言うが、ユークリッドの命題のようにはっきり私に見える。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 533
          "end": 540
          "exact": "dizaine"
  - "id": "voy-373"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I wonder if other people would make the same allowances for me! Like the ladies of Creil, having recited my rosary of toleration, I look for my indulgence on the spot."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 373
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[296]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-373"
    "translation_ja": "ほかの人も私に同じだけ酌量をしてくれるだろうか！　クレイユのご婦人がたと同じ、寛容というわがロザリオを唱え終わった私は、ただちに免償がいただけるのを待っている。"
    "translation_status": "reviewed"
  - "id": "voy-374"
    "section_id": "ch-20"
    "kind": "heading"
    "origin": "source"

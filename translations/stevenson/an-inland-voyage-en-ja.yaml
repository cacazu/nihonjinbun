  - "id": "voy-362"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We made our first stage below Compiègne to Pont Sainte Maxence. I was abroad a little after six the next morning. The air was biting, and smelt of frost. In an open place a score of women wrangled together over the day’s market; and the noise of their negotiation sounded thin and querulous like that of sparrows on a winter’s morning. The rare passengers blew into their hands, and shuffled in their wooden shoes to set the blood agog. The streets were full of icy shadow, although the chimneys were smoking overhead in golden sunshine. If you wake early enough at this season of the year, you may get up in December to break your fast in June."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 362
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[285]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-362"
    "translation_ja": "コンピエーニュを下った最初の宿駅はポン＝サント＝マクサンスだった。翌朝六時を少し回って私は外に出た。空気は身を切るようで霜の匂いがした。開けた一角で二十人ほどの女たちがその日の市をめぐって言い争った。値の交渉の声は冬の朝の雀みたいに細く、不平がましく響いた。数少ない通行人は掌に息を吹き、血を呼びさまそうと木靴をすり足で運んだ。頭上では煙突が黄金の日差しに煙を上げていたけれども、通りは氷のような影で満ちていた。この季節、十分に早く目を覚ませば十二月に起き、六月に朝食をとることができる。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 2
          "exact": "We"
  - "id": "voy-363"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I found my way to the church; for there is always something to see about a church, whether living worshippers or dead men’s tombs; you find there the deadliest earnest, and the hollowest deceit; and even where it is not a piece of history, it will be certain to leak out some contemporary gossip. It was scarcely so cold in the church as it was without, but it looked colder. The white nave was positively arctic to the eye; and the tawdriness of a continental altar looked more forlorn than usual in the solitude and the bleak air. Two priests sat in the chancel, reading and waiting penitents; and out in the nave, one very old woman was engaged in her devotions. It was a wonder how she was able to pass her beads when healthy young people were breathing in their palms and slapping their chest; but though this concerned me, I was yet more dispirited by the nature of her exercises. She went from chair to chair, from altar to altar, circumnavigating the church. To each shrine she dedicated an equal number of beads and an equal length of time. Like a prudent capitalist with a somewhat cynical view of the commercial prospect, she desired to place her supplications in a great variety of heavenly securities. She would risk nothing on the credit of any single intercessor. Out of the whole company of saints and angels, not one but was to suppose himself her champion elect against the Great Assize! I could only think of it as a dull, transparent jugglery, based upon unconscious unbelief."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 363
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[286]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-363"
    "translation_ja": "私は教会に向かった。生きて礼拝している者なり、死人の墓なり、教会のあたりにはいつでも何か見るものがある。そこには死ぬほどの真剣さも、空っぽの詐欺もある。たとえひとかけの歴史でないにしても、同時代の噂ばなしのいくらかが漏れ出ることはまちがいない。教会の中は外よりはいくらか寒くなかったが、見た眼にはもっと寒かった。白い身廊など眼にはまさしく北極だった。大陸の祭壇のけばけばしさが、寂寥と寒々した空気の中では日ごろにもましてわびしかった。司祭が二人内陣にすわり、書を読みながら悔悛者を待っていた。身廊にはひとりのずいぶん老いた女が祈りに精を出していた。元気な若者さえ掌に息を吹き、胸をたたいているのに、どうやって数珠を繰れたのだろう。これは気にかかったが、その勤行の仕方にはいっそう気が滅入った。彼女は椅子から椅子、祭壇から祭壇へと教会を一周した。ひとつひとつの聖所に等しい玉数と等しい時間を割いた。商況にいささか冷笑的な見通しを持つ用心深い資本家のように、彼女は天国の各種証券に広く祈願を投じたがっていた。どれか一人の取りなし手の信用にすべてを賭すような危険は冒さない。来たる最後の大裁判において、自分こそ選ばれた彼女の擁護者だ、と考えてくれぬ者が、聖人天使の全陣容に一人だってあってはならなかった！　私には無意識の不信仰を土台にした、退屈で見え透いた手品としか思えなかった。"
    "translation_status": "reviewed"
  - "id": "voy-364"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She was as dead an old woman as ever I saw; no more than bone and parchment, curiously put together. Her eyes, with which she interrogated mine, were vacant of sense. It depends on what you call seeing, whether you might not call her blind. Perhaps she had known love: perhaps borne children, suckled them and given them pet names. But now that was all gone by, and had left her neither happier nor wiser; and the best she could do with her mornings was to come up here into the cold church and juggle for a slice of heaven. It was not without a gulp that I escaped into the streets and the keen morning air. Morning? why, how tired of it she would be before night! and if she did not sleep, how then? It is fortunate that not many of us are brought up publicly to justify our lives at the bar of threescore years and ten; fortunate that such a number are knocked opportunely on the head in what they call the flower of their years, and go away to suffer for their follies in private somewhere else. Otherwise, between sick children and discontented old folk, we might be put out of all conceit of life."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 364
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[287]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-364"
    "translation_ja": "あれほど死物めいた老婆を見たことはない。骨と羊皮紙が不思議に組み合っていたにすぎない。私の眼を問いただすその眼に意味はなかった。見ることをどう定義するかによっては、盲目と呼んでもよかっただろう。恋を知っていたかもしれない。子を産み、乳を含ませ、愛称で呼んだかもしれない。だが今はみな過ぎ去り、彼女は幸福にも賢くもなっていなかった。朝の時間でできるいちばんのことが、この冷たい教会に来て、天国の一切れを手に入れようと手品をすることだった。私はごくりと何かをのみこんで街路と鋭い朝の大気に逃れ出た。朝だって？　なんと、夜が来るまでには彼女はどれほどこの朝にうんざりしているだろう！　しかも眠れなかったら、どうなる？　われわれのうち多くの者は七十歳という法廷の柵に公然と引き出され、自分の人生を弁明させられずに済むのは幸いだ。いわゆる花の盛りに、時宜よく頭をがつんとやられ、愚行の報いはよそのどこかでひそかに受けに行く者がこれほどいるのは幸いだ。さもなければ病気の子供と不平な老人たちに挟まれて、人生について思い切り愛想を尽かすかもしれない。"
    "translation_status": "reviewed"
  - "id": "voy-365"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had need of all my cerebral hygiene during that day’s paddle: the old devotee stuck in my throat sorely. But I was soon in the seventh heaven of stupidity; and knew nothing but that somebody was paddling a canoe, while I was counting his strokes and forgetting the hundreds. I used sometimes to be afraid I should remember the hundreds; which would have made a toil of a pleasure; but the terror was chimerical, they went out of my mind by enchantment, and I knew no more than the man in the moon about my only occupation."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 365
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[288]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-365"
    "translation_ja": "その日の舟行中、私は脳の養生法を総動員する必要があった。あの信心女が喉に痛く引っかかっていたのだ。だがじきに愚鈍の第七天に達し、誰かがカヌーを漕ぎ、私が彼の櫂のひとかきひとかきを数えては百の位を忘れていることしかわからなくなった。ときおり百の位まで覚えてしまうのではと恐れた。それでは快楽が骨折りになる。だが根拠のない恐れだった。魔法のように頭から抜け、私は自分のただ一つの仕事について月の男以上には何も知らなかった。"
    "translation_status": "reviewed"
  - "id": "voy-366"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At Creil, where we stopped to lunch, we left the canoes in another floating lavatory, which, as it was high noon, was packed with washerwomen, red-handed and loud-voiced; and they and their broad jokes are about all I remember of the place. I could look up my history-books, if you were very anxious, and tell you a date or two; for it figured rather largely in the English wars. But I prefer to mention a girls’ boarding-school, which had an interest for us because it was a girls’ boarding-school, and because we imagined we had rather an interest for it. At least—there were the girls about the garden; and here were we on the river; and there was more than one handkerchief waved as we went by. It caused quite a stir in my heart; and yet how we should have wearied and despised each other, these girls and I, if we had been introduced at a croquet-party! But this is a fashion I love: to kiss the hand or wave a handkerchief to people I shall never see again, to play with possibility, and knock in a peg for fancy to hang upon. It gives the traveller a jog, reminds him that he is not a traveller everywhere, and that his journey is no more than a siesta by the way on the real march of life."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 366
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[289]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-366"
    "translation_ja": "クレイユでは昼食に止まり、カヌーをまた浮き洗濯場に置いた。真昼なので赤い手の声の大きい洗濯女でいっぱいだった。この女たちときわどい冗談以外にはほとんどこの地の記憶がない。よほどお望みなら歴史書を引いて年代を一つ二つお伝えできる。イギリスとの戦争ではかなり大きな役を演じたからだ。だがむしろ女学校の寄宿舎に触れたい。それに関心があったのは、女学校の寄宿舎だからであり、あちらにもいくらかこちらへの関心があると想像したからだ。少なくとも、むこうの庭には少女たち、こちらの川にはわれわれがいて、行き過ぎるときに振られたハンカチは一枚きりではなかった。私は胸がかなり騒いだ。それでもクロッケーの園遊会で引き合わされたら、この少女たちと私はどれだけ互いに飽き、軽蔑し合ったことだろう！　だがこれは私の好きなやり方なのだ。二度と会うまい人に投げキスをし、ハンカチを振り、可能性と戯れ、空想を掛けるための釘を一本打っておくことは。それは旅人をひじでつつき、彼がどこででも旅人であるわけではないこと、彼の旅が人生の本当の進軍途上にとるほんの昼寝にすぎぬことを思い出させる。"
    "translation_status": "reviewed"
  - "id": "voy-367"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The church at Creil was a nondescript place in the inside, splashed with gaudy lights from the windows, and picked out with medallions of the Dolorous Way. But there was one oddity, in the way of an ex voto, which pleased me hugely: a faithful model of a canal boat, swung from the vault, with a written aspiration that God should conduct the Saint Nicolas of Creil to a good haven. The thing was neatly executed, and would have made the delight of a party of boys on the waterside. But what tickled me was the gravity of the peril to be conjured. You might hang up the model of a sea-going ship, and welcome: one that is to plough a furrow round the world, and visit the tropic or the frosty poles, runs dangers that are well worth a candle and a mass. But the Saint Nicolas of Creil, which was to be tugged for some ten years by patient draught-horses, in a weedy canal, with the poplars chattering overhead, and the skipper whistling at the tiller; which was to do all its errands in green inland places, and never get out of sight of a village belfry in all its cruising; why, you would have thought if anything could be done without the intervention of Providence, it would be that! But perhaps the skipper was a humorist: or perhaps a prophet, reminding people of the seriousness of life by this preposterous token."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 367
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[290]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-367"
    "translation_ja": "クレイユの教会の内部には取り立てて特色はなく、窓からけばけばしい色の光が斑に落ち、受難の道を描く円形画があしらわれていた。ただ一つたいへん気に入った風変わりな奉納物があった。拱天井からつり下げた運河船の精密な模型で、神がクレイユの「聖ニコラ」号をよい港へと導きたもうようにとの祈願が書き添えてあった。つくりは念入りで、水辺の少年の一群などは大喜びするだろう。だが私をくすぐったのは、祓いのけようとする危険の重大さだった。外洋に出る船の模型なら、いくらでもつるすとよい。世界を一周する畝を耕し、熱帯や氷の極地を訪れる船は、ろうそく一本とミサに値する危険を冒す。ところがクレイユの「聖ニコラ」号ときたら、藻の生えた運河を、頭上にポプラがおしゃべりし、船長が舵柄で口笛を吹きながら、辛抱強い曳き馬に十年ばかり引かれつづける船だ。緑の内陸ですべての用事を足し、生涯航海しても村の鐘楼が一つも見えなくなるところには行かぬ船だ。この世に摂理の介入なくできることがあるなら、まさしくこれだと思うだろう！　だが船長はもしかするとユーモリストだったのか。あるいはこの途方もないしるしで人生の真剣さを人に思い出させる、一人の預言者だったのか。"
    "translation_status": "reviewed"

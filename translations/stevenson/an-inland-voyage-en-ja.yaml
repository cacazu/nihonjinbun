  - "id": "voy-208"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Yes,’ said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 208
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[144]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-208"
    "translation_ja": "「ええ」と私は言った。"
    "translation_status": "reviewed"
  - "id": "voy-209"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘And your friend who went by just now?’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 209
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[145]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-209"
    "translation_ja": "「それで、いま通っていらしたお友達は？」"
    "translation_status": "reviewed"
  - "id": "voy-210"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He also was unmarried."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 210
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[146]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-210"
    "translation_ja": "彼も妻帯していなかった。"
    "translation_status": "reviewed"
  - "id": "voy-211"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "O then—all was well. She could not have wives left alone at home; but since there were no wives in the question, we were doing the best we could."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 211
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[147]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-211"
    "translation_ja": "ああ、それなら何もかもうまくいく。旅に出て、奥さんたちを家に一人きりで残しておくのは困る。だがそもそも奥さんがいないのなら、われわれはできるかぎりいちばんいいことをしているのだ。"
    "translation_status": "reviewed"
  - "id": "voy-212"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘To see about one in the world,’ said the husband, ‘il n’y a que ça—there is nothing else worth while. A man, look you, who sticks in his own village like a bear,’ he went on, ‘—very well, he sees nothing. And then death is the end of all. And he has seen nothing.’"
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 212
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[148]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-212"
    "translation_ja": "「世の中を見て回る」と夫が言った。「イル・ニ・ア・ク・サ、それだけさ、値打ちのあるものは。いいかね、熊みたいに自分の村にじっとしている男には、何一つ見えやしない。そうしてしまいに死ねば一切は終わりだ。そいつは何も見なかったんだ」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 52
          "end": 67
          "exact": "il n’y a que ça"
  - "id": "voy-213"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Madame reminded her husband of an Englishman who had come up this canal in a steamer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 213
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[149]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-213"
    "translation_ja": "奥さんは夫に、この運河を汽船で上っていったイギリス人のことを思い出させた。"
    "translation_status": "reviewed"
  - "id": "voy-214"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Perhaps Mr. Moens in the Ytene,’ I suggested."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 214
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[150]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-214"
    "translation_ja": "「もしかしてアイティーン号のモーエンスさんですか」と私が尋ねた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 26
          "end": 31
          "exact": "Ytene"
  - "id": "voy-215"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘That’s it,’ assented the husband. ‘He had his wife and family with him, and servants. He came ashore at all the locks and asked the name of the villages, whether from boatmen or lock-keepers; and then he wrote, wrote them down. Oh, he wrote enormously! I suppose it was a wager.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 215
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[151]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-215"
    "translation_ja": "「そうそう」と夫がうなずいた。「奥さんや子供さんも一緒で、召使いも連れていた。どの閘門でも上陸しては、船頭にでも閘門番にでも村の名を聞いて、書く、書きつけるんだ。いや、やたらに書いたよ。あれは賭けだったんだろう」"
    "translation_status": "reviewed"
  - "id": "voy-216"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A wager was a common enough explanation for our own exploits, but it seemed an original reason for taking notes."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 216
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[152]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-216"
    "translation_ja": "賭けというのは、われわれ自身の壮挙についてもよく持ち出される説明だったが、覚え書きを取る理由としては独創的に思われた。"
    "translation_status": "reviewed"
  - "id": "voy-217"

    "source_text": "‘We’—this is not a substantive speech, but an abstract of many speeches, the impression left upon my mind after a great deal of talk; and very youthful, pleasant, natural, and patriotic it seems to me to be—‘We have gained all races, except those where we were cheated by the French.’"
    "source_languages":

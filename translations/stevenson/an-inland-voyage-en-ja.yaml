  - "id": "voy-094"
    "section_id": "ch-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Sure enough there was the slip in the corner of the basin; and at the top of it two nice-looking lads in boating clothes. The Arethusa addressed himself to these. One of them said there would be no difficulty about a night’s lodging for our boats; and the other, taking a cigarette from his lips, inquired if they were made by Searle and Son. The name was quite an introduction. Half-a-dozen other young men came out of a boat-house bearing the superscription Royal Sport Nautique, and joined in the talk. They were all very polite, voluble, and enthusiastic; and their discourse was interlarded with English boating terms, and the names of English boat-builders and English clubs. I do not know, to my shame, any spot in my native land where I should have been so warmly received by the same number of people. We were English boating-men, and the Belgian boating-men fell upon our necks. I wonder if French Huguenots were as cordially greeted by English Protestants when they came across the Channel out of great tribulation. But after all, what religion knits people so closely as a common sport?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 94
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[39]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-094"
    "translation_ja": "なるほど船溜まりの隅には斜路があり、上がったところにボート服を着た好ましい感じの青年が二人いた。アレシューザ号の主が二人に話しかけた。一人は、われわれの舟の一夜の宿など何の面倒もないだろうと言った。もう一人は煙草を口から離し、その舟はサール父子社の造りかと聞いた。その名だけでちゃんとした身元紹介になった。さらに半ダースばかりの青年が「ロイヤル・スポール・ノーティック」と銘打った艇庫から出てきて話に加わった。みなすこぶる丁寧でおしゃべり、かつ熱心だった。話にはイギリスのボート用語や、イギリスの造船家やクラブの名がふんだんに挟まった。恥ずかしいことだが、わが国で同じ人数の人からこんな温かい歓迎を受けられる場所を私は一つも思いつかない。こちらはイギリスの舟好きであり、ベルギーの舟好きはわれわれの首に取りすがらんばかりにした。大きな患難を逃れ海峡を渡ってきたフランスのユグノーは、イングランドのプロテスタントにあれほど心から迎えられただろうか。とはいっても共通のスポーツほど人を固く結びつける宗教があろうか？"
    "translation_status": "reviewed"

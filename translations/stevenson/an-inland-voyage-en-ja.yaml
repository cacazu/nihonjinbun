        "xpath": "/html/body/p[201]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-269"
    "translation_ja": "「ほら、ここだ」と宿の夫は皿を振り回して叫んだ。「ここに甜菜畑がある。いいかね。それでここにおれがいる。おれは前に出る、そうだろう？　そうだ、ちきしょう」――話の声がいよいよ高くなり、轟きわたる罵りにころがり込み、語り手は同意を求めてぎらぎらとまわりを見、みなは平和のために彼に向かってうなずいた。"
    "translation_status": "reviewed"

  - "id": "voy-265"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There is something lacking among the oaks of Fontainebleau; and when the dessert comes in at Barbizon, people look to the door for a figure that is gone."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 265
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[197]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-265"
    "translation_ja": "フォンテーヌブローの樫のあいだに何かが欠けている。バルビゾンでデザートが運ばれてくると、みんなはもういない人の姿を求めて戸口を見る。"
    "translation_status": "reviewed"
  - "id": "voy-266"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The third of our companions at Origny was no less a person than the landlady’s husband: not properly the landlord, since he worked himself in a factory during the day, and came to his own house at evening as a guest: a man worn to skin and bone by perpetual excitement, with baldish head, sharp features, and swift, shining eyes. On Saturday, describing some paltry adventure at a duck-hunt, he broke a plate into a score of fragments. Whenever he made a remark, he would look all round the table with his chin raised, and a spark of green light in either eye, seeking approval. His wife appeared now and again in the doorway of the room, where she was superintending dinner, with a ‘Henri, you forget yourself,’ or a ‘Henri, you can surely talk without making such a noise.’ Indeed, that was what the honest fellow could not do. On the most trifling matter his eyes kindled, his fist visited the table, and his voice rolled abroad in changeful thunder. I never saw such a petard of a man; I think the devil was in him. He had two favourite expressions: ‘it is logical,’ or illogical, as the case might be: and this other, thrown out with a certain bravado, as a man might unfurl a banner, at the beginning of many a long and sonorous story: ‘I am a proletarian, you see.’ Indeed, we saw it very well. God forbid that ever I should find him handling a gun in Paris streets! That will not be a good moment for the general public."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 266
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[198]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-266"
    "translation_ja": "オリニーの三人目の話し相手はほかならぬ女将の夫だった。厳密にいえば宿の主ではない。昼間はみずから工場で働き、夕方にはわが家に客として帰ってくる。絶え間のない興奮に骨と皮まで擦り減った男で、頭は幾分禿げ、目鼻立ちは鋭く、両眼はよく動いて光った。土曜の晩には鴨猟のなんでもない体験を語りながら、皿を二十片ほどに割ってのけた。ひと言言うたび顎を上げ、両目に緑の火花を散らして卓をぐるりと見回し、賛同を探した。食事の段取りをしていた妻が時折その部屋の戸口に顔を出し、「アンリ、お行儀をお忘れよ」「アンリ、そんな大声を出さなくたって話せるでしょう」と言った。ところがこの正直者には、まさにそれができなかった。何でもないことでも目が燃え、拳は卓に飛び、声は調子を変える雷となってあたりに鳴り渡った。あんな爆竹のような男は見たことがない。悪魔が入っていたと思う。好きな言い回しが二つあった。一つは「それは論理的だ」、場合によっては非論理的だ、と言う。もう一つは朗々たる長話の冒頭、旗を広げるかのようにいくぶん虚勢を込めて放つ。「おわかりでしょうが、私はプロレタリアだ」。ええ、じつによくわかった。パリの街頭で彼が銃を手にしているところに行き合わせるなど、どうか神が許したまわぬように！　一般市民にはろくな時にならぬだろう。"
    "translation_status": "reviewed"
  - "id": "voy-267"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I thought his two phrases very much represented the good and evil of his class, and to some extent of his country. It is a strong thing to say what one is, and not be ashamed of it; even although it be in doubtful taste to repeat the statement too often in one evening. I should not admire it in a duke, of course; but as times go, the trait is honourable in a workman. On the other hand, it is not at all a strong thing to put one’s reliance upon logic; and our own logic particularly, for it is generally wrong. We never know where we are to end, if once we begin following words or doctors. There is an upright stock in a man’s own heart, that is trustier than any syllogism; and the eyes, and the sympathies and appetites, know a thing or two that have never yet been stated in controversy. Reasons are as plentiful as blackberries; and, like fisticuffs, they serve impartially with all sides. Doctrines do not stand or fall by their proofs, and are only logical in so far as they are cleverly put. An able controversialist no more than an able general demonstrates the justice of his cause. But France is all gone wandering after one or two big words; it will take some time before they can be satisfied that they are no more than words, however big; and when once that is done, they will perhaps find logic less diverting."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 267
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[199]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-267"
    "translation_ja": "この二つの口癖は、彼の階級の善と悪、またある程度この国の善と悪をじつによく示す、と私は思った。自分が何であるかを言って恥じないのは、力のある態度だ。ひと晩のうちにあまりたびたび言明するのはどうかと思われるにせよ。むろん公爵がそうしても感心はしないが、現下の時勢では、労働者にあるなら名誉な性質だ。一方、論理に頼るのはちっとも心強いことではない。とりわけ自分の論理となると概して間違っている。いったん言葉や偉い先生のあとについて歩き出したら、どこにたどり着くかなど誰にもわからない。人の胸には、どんな三段論法よりも頼りになる一本のまっすぐな芯がある。目にも、共感にも欲求にも、いまだ論争で述べられたことのない何事かがわかる。理由など野いちごほどどこにでもあり、げんこつ同様、どちらの側にも公平に役立つ。学説はその論証によって立ちも滅びもせず、うまく言い表されているかぎりにおいてのみ論理的だ。腕のいい論客が自分の主張の正義を証明するわけではないのは、腕のいい将軍が自分の大義の正義を証明しないのと同じだ。だがフランスは国じゅう、大きな言葉の一つ二つに迷い歩いている。いかに大きくても言葉は言葉にすぎぬと得心するまでには、しばらくかかるだろう。ひとたびわかったら、論理もさほど面白く思われなくなるかもしれない。"
    "translation_status": "reviewed"
  - "id": "voy-268"
    "section_id": "ch-11_b"

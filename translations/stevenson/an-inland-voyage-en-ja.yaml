  - "id": "voy-139"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The Cigarette returned with good news. There were beds to be had some ten minutes’ walk from where we were, at a place called Pont. We stowed the canoes in a granary, and asked among the children for a guide. The circle at once widened round us, and our offers of reward were received in dispiriting silence. We were plainly a pair of Bluebeards to the children; they might speak to us in public places, and where they had the advantage of numbers; but it was another thing to venture off alone with two uncouth and legendary characters, who had dropped from the clouds upon their hamlet this quiet afternoon, sashed and be-knived, and with a flavour of great voyages. The owner of the granary came to our assistance, singled out one little fellow and threatened him with corporalities; or I suspect we should have had to find the way for ourselves. As it was, he was more frightened at the granary man than the strangers, having perhaps had some experience of the former. But I fancy his little heart must have been going at a fine rate; for he kept trotting at a respectful distance in front, and looking back at us with scared eyes. Not otherwise may the children of the young world have guided Jove or one of his Olympian compeers on an adventure."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 139
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[79]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-139"
    "translation_ja": "シガレット号の主はよい知らせをもたらした。今いるところから歩いて十分ほど、ポンというところに寝床があるという。カヌーを穀倉に預け、子供たちに案内役はいないか尋ねた。たちまち私たちを囲む輪が広がり、お礼をしようと言っても心細い沈黙が返ってきた。どうやら子供らにとってわれわれは青ひげ二人組なのだ。人前で、自分たちが数で勝っているときなら口もきける。だが、こののどかな午後、腰帯にナイフ、大航海のにおいをさせていきなり空から村に降ってきた、無骨な伝説の人物二人と、たったひとりで出かけるのは別の話だった。穀倉の主が助け船を出し、小さいのを一人選んで折檻をちらつかせた。さもなければ自力で道を探すはめになったろう。少年は見知らぬ二人より穀倉の主のほうが怖かった。たぶんそちらのほうには身に覚えがあったのだ。それでも小さな胸はかなりの勢いで鼓動していたにちがいない。こわごわ距離を置いて、ずっと先を小走りに行き、怯えた目でこちらを振り返ったからだ。世界が若かったころの子供たちも、冒険に出るユピテルかほかのオリュンポスの神の供をしたとき、このように道案内をしたことであろう。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 3
          "exact": "The"
      - "side": "source"

        "xpath": "/html/body/p[191]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-258"
    "translation_ja": "川べりのオリニー＝サント＝ブノワットにはランプがともり、サラダが作られていた。"
    "translation_status": "reviewed"
  - "id": "voy-259"

  - "id": "voy-190"
    "section_id": "ch-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And now, when we left the café, we were pursued and overtaken at the hotel door by no less a person than the Juge de Paix: a functionary, as far as I can make out, of the character of a Scots Sheriff-Substitute. He gave us his card and invited us to sup with him on the spot, very neatly, very gracefully, as Frenchmen can do these things. It was for the credit of Landrecies, said he; and although we knew very well how little credit we could do the place, we must have been churlish fellows to refuse an invitation so politely introduced."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 190
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[127]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-190"
    "translation_ja": "そして今しもカフェを出ると、あとから追って来てホテルの戸口でこちらに追いついたのは、ほかならぬ治安判事だった。私が察するにスコットランドの州副判事に類する役人である。彼は名刺をくれ、その場で夜食に招いてくれた。こういうことをするフランス人にふさわしく、いかにも巧みで優雅だった。ランドルシーの名誉のために、と言う。われわれがこの土地にどれほどわずかの名誉しかもたらせぬかはよく承知していたが、これほど丁寧に持ち出された招きを断るとしたら、礼儀を知らぬやつでなくて何だろう。"
    "translation_status": "reviewed"

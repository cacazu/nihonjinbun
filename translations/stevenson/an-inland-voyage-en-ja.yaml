  - "id": "voy-191"
    "section_id": "ch-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The house of the Judge was close by; it was a well-appointed bachelor’s establishment, with a curious collection of old brass warming-pans upon the walls. Some of these were most elaborately carved. It seemed a picturesque idea for a collector. You could not help thinking how many night-caps had wagged over these warming-pans in past generations; what jests may have been made, and kisses taken, while they were in service; and how often they had been uselessly paraded in the bed of death. If they could only speak, at what absurd, indecorous, and tragical scenes had they not been present!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 191
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[128]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-191"
    "translation_ja": "判事の家はすぐそばだった。よく整った独身者の住まいで、壁には古い真鍮の寝床温め器が不思議な収集品となって飾ってあった。ひどく念入りな彫りのある品も数点あった。収集家として絵心のある着想に思われた。過ぎし代々に、どれほどの寝帽子がこの温め器の上で揺れただろう、現役だったころ、そのあいだにどんな冗談が飛び交い、どんな口づけが交わされただろう、また死の床を何度むなしくあたためて回っただろう、と考えずにはいられなかった。これらがもし口をきけたら、どれだけ滑稽で、不作法で、悲劇的な場面に居合わせてきたことだろう！"
    "translation_status": "reviewed"
  - "id": "voy-192"
    "section_id": "ch-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The wine was excellent. When we made the Judge our compliments upon a bottle, ‘I do not give it you as my worst,’ said he. I wonder when Englishmen will learn these hospitable graces. They are worth learning; they set off life, and make ordinary moments ornamental."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 192
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[129]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-192"
    "translation_ja": "葡萄酒は上々だった。一本をほめると、判事は「うちで一番まずいのを選んでお出ししたわけじゃありませんよ」と言った。イギリス人はいつになったら、こういうもてなしの妙を習得するだろう。習うだけの価値がある。暮らしを引き立て、なんでもない瞬間を飾りのあるものにしてくれる。"
    "translation_status": "reviewed"
  - "id": "voy-193"
    "section_id": "ch-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There were two other Landrecienses present. One was the collector of something or other, I forget what; the other, we were told, was the principal notary of the place. So it happened that we all five more or less followed the law. At this rate, the talk was pretty certain to become technical. The Cigarette expounded the Poor Laws very magisterially. And a little later I found myself laying down the Scots Law of Illegitimacy, of which I am glad to say I know nothing. The collector and the notary, who were both married men, accused the Judge, who was a bachelor, of having started the subject. He deprecated the charge, with a conscious, pleased air, just like all the men I have ever seen, be they French or English. How strange that we should all, in our unguarded moments, rather like to be thought a bit of a rogue with the women!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 193
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[130]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-193"
    "translation_ja": "ほかにランドルシー人が二人いた。一人は何かの徴収官だったが、何の徴収だったか忘れた。もう一人は土地一番の公証人だと紹介された。というわけで五人とも、程度の差こそあれ法律に携わる身だった。こうなれば話が専門に傾くのはほとんど間違いない。シガレット号の主は救貧法をいかにも堂々と解説した。少したつと、私もスコットランドの婚外子に関する法律を得々と講じていた。ありがたいことに私はそれをまるで知らない。徴収官と公証人はいずれも妻帯者で、この話を持ち出したのは独身の判事だと責めた。判事は心当たりがあってうれしい様子でその嫌疑を否定した。これまで私の見てきた男なら、フランス人でもイギリス人でもみなあの調子である。われわれ男が誰しも油断をすれば、女にかけてはちょっとした悪党だと思われるのがまんざらでもないのは、なんと奇妙なことだろう！"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 298
          "end": 307
          "exact": "Cigarette"
  - "id": "voy-194"
    "section_id": "ch-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As the evening went on, the wine grew more to my taste; the spirits proved better than the wine; the company was genial. This was the highest water mark of popular favour on the whole cruise. After all, being in a Judge’s house, was there not something semi-official in the tribute? And so, remembering what a great country France is, we did full justice to our entertainment. Landrecies had been a long while asleep before we returned to the hotel; and the sentries on the ramparts were already looking for daybreak."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 194
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[131]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-194"
    "translation_ja": "夜が更けるほど葡萄酒は私の口に合うようになり、蒸留酒はその葡萄酒よりさらによかった。座は打ち解けていた。全航海を通じて人気の潮がいちばん高く満ちたのがここだった。何しろ判事の家なのだから、この敬意には半ば公のお墨付きがあるのではないか。そうしてフランスがいかに偉大な国か思い起こしながら、私たちはその歓待に十分報いた。ホテルへ帰ったとき、ランドルシーはすでに長いこと眠りにつき、城壁の哨兵はもう夜明けを待っていた。"
    "translation_status": "reviewed"

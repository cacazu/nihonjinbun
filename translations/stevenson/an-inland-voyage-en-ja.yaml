  - "id": "voy-196"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Next day we made a late start in the rain. The Judge politely escorted us to the end of the lock under an umbrella. We had now brought ourselves to a pitch of humility in the matter of weather, not often attained except in the Scottish Highlands. A rag of blue sky or a glimpse of sunshine set our hearts singing; and when the rain was not heavy, we counted the day almost fair."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 196
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[132]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-196"
    "translation_ja": "翌日は雨の中を遅く発った。判事は傘をさして丁寧にも閘門の端まで送ってくれた。天候についてわれわれの謙虚さは、スコットランド高地のほかではめったに到達できない境地に達していた。青空のひと切れ、ちらりとのぞく日差しだけで胸は歌い、強い雨でさえなければほぼ晴天のうちに数えた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 4
          "exact": "Next"
  - "id": "voy-197"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Long lines of barges lay one after another along the canal; many of them looking mighty spruce and shipshape in their jerkin of Archangel tar picked out with white and green. Some carried gay iron railings, and quite a parterre of flower-pots. Children played on the decks, as heedless of the rain as if they had been brought up on Loch Carron side; men fished over the gunwale, some of them under umbrellas; women did their washing; and every barge boasted its mongrel cur by way of watch-dog. Each one barked furiously at the canoes, running alongside until he had got to the end of his own ship, and so passing on the word to the dog aboard the next. We must have seen something like a hundred of these embarkations in the course of that day’s paddle, ranged one after another like the houses in a street; and from not one of them were we disappointed of this accompaniment. It was like visiting a menagerie, the Cigarette remarked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 197
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[133]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-197"
    "translation_ja": "運河には艀が幾列も、あとへあとへと長く続いていた。多くはアルハンゲリスク産のタールの上着に白と緑をあしらって、ひどく小ぎれいに船具が整っていた。華やかな鉄の手摺りと、鉢植えで花壇をそっくり一つ載せた船もある。子供らは甲板で、まるでキャロン湖畔育ちのように雨に無頓着に遊び、男は舷越しに釣り糸を垂れ、傘をさす者もあり、女は洗濯をしていた。どの艀にも番犬役の雑種犬がいるのが自慢だった。一匹残らずカヌーに向かってすさまじく吠え、自分の船の端までわれわれと並んで走ると、次の船の犬に伝言を回した。その日の舟行のあいだに、街路の家々のように次々と並ぶ船を百艘近く見ただろうが、この伴奏を期待して裏切られた船は一つもなかった。まるで動物小屋の見物だ、とシガレット号の主は言った。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 916
          "end": 925
          "exact": "Cigarette"
  - "id": "voy-198"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "These little cities by the canal side had a very odd effect upon the mind. They seemed, with their flower-pots and smoking chimneys, their washings and dinners, a rooted piece of nature in the scene; and yet if only the canal below were to open, one junk after another would hoist sail or harness horses and swim away into all parts of France; and the impromptu hamlet would separate, house by house, to the four winds. The children who played together to-day by the Sambre and Oise Canal, each at his own father’s threshold, when and where might they next meet?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 198
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[134]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-198"
    "translation_ja": "運河べりのこうした小都市はとても不思議な感覚を呼び起こした。鉢植えの花に煙を吐く煙突、洗濯物に食事。景色の中に自然と根を下ろしたものと見える。だがひとたび下流の運河が開けば、一艘また一艘と、この船たちが帆を揚げ、あるいは馬をつなぎ、フランス各地へ泳ぎ去る。即席の小集落は家一軒ごと四散してしまうのだ。今日サンブル・オワーズ運河で、それぞれ自分の父親の戸口で一緒に遊んでいた子供たちは、いつどこでまた会えるだろう？"
    "translation_status": "reviewed"
  - "id": "voy-199"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For some time past the subject of barges had occupied a great deal of our talk, and we had projected an old age on the canals of Europe. It was to be the most leisurely of progresses, now on a swift river at the tail of a steam-boat, now waiting horses for days together on some inconsiderable junction. We should be seen pottering on deck in all the dignity of years, our white beards falling into our laps. We were ever to be busied among paint-pots; so that there should be no white fresher, and no green more emerald than ours, in all the navy of the canals. There should be books in the cabin, and tobacco-jars, and some old Burgundy as red as a November sunset and as odorous as a violet in April. There should be a flageolet, whence the Cigarette, with cunning touch, should draw melting music under the stars; or perhaps, laying that aside, upraise his voice—somewhat thinner than of yore, and with here and there a quaver, or call it a natural grace-note—in rich and solemn psalmody."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 199
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[135]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-199"
    "translation_ja": "もうだいぶ前から、艀はわれわれの話の種のかなりの部分を占め、ヨーロッパの運河で送る老後をすでに描き上げていた。考えうるかぎり悠長な道行きになるはずだった。あるときは速い流れの川を汽船の尻につき、あるときはなんでもない分岐点で何日も馬を待つ。白い髭を膝に垂らし、老いの威厳をたたえて甲板でこまごまと立ち働く私たちの姿が、きっと見られることだろう。絵具の缶のあいだでたえず忙しくする。運河の全艦隊にわれわれの船より鮮やかな白も、エメラルドのような緑もないように。船室には本があり、煙草壺があり、十一月の落日のように赤く四月のすみれのように芳しい古いブルゴーニュがあることになっていた。小縦笛もある。シガレット号の主が巧みな指で星の下、とろけるような音楽を引き出す。あるいはそれを置き、昔に比べ少し細く、ところどころで震える声、いや、天然の装飾音ということにしよう、その声を張り、豊かな荘重な節で詩篇を歌うかもしれない。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 744
          "end": 753
          "exact": "Cigarette"
  - "id": "voy-200"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All this, simmering in my mind, set me wishing to go aboard one of these ideal houses of lounging. I had plenty to choose from, as I coasted one after another, and the dogs bayed at me for a vagrant. At last I saw a nice old man and his wife looking at me with some interest, so I gave them good-day and pulled up alongside. I began with a remark upon their dog, which had somewhat the look of a pointer; thence I slid into a compliment on Madame’s flowers, and thence into a word in praise of their way of life."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 200
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[136]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-200"
    "translation_ja": "こうしたことが頭の中でことこと煮えて、私はこの理想の無為の住まいに一度上がってみたくなった。一艘また一艘と横づけに通り過ぎ、放浪者めと犬に吠え立てられながら、選択肢には事欠かなかった。ついに感じのよい老人夫婦がやや興味ありげに私を見ているのを見つけ、こんにちはと挨拶して漕ぎ寄せた。ポインターに幾分似た彼らの犬を糸口にし、奥様の花をほめるところへ滑り込み、それから暮らしぶりをたたえる言葉をひとつ添えた。"
    "translation_status": "reviewed"
  - "id": "voy-201"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "If you ventured on such an experiment in England you would get a slap in the face at once. The life would be shown to be a vile one, not without a side shot at your better fortune. Now, what I like so much in France is the clear unflinching recognition by everybody of his own luck. They all know on which side their bread is buttered, and take a pleasure in showing it to others, which is surely the better part of religion. And they scorn to make a poor mouth over their poverty, which I take to be the better part of manliness. I have heard a woman in quite a better position at home, with a good bit of money in hand, refer to her own child with a horrid whine as ‘a poor man’s child.’ I would not say such a thing to the Duke of Westminster. And the French are full of this spirit of independence. Perhaps it is the result of republican institutions, as they call them. Much more likely it is because there are so few people really poor, that the whiners are not enough to keep each other in countenance."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 201
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[137]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-201"
    "translation_ja": "イングランドでこんな実験に及んだら、ただちに顔を張られるような返事を受けよう。その暮らしはいかにひどいかを示され、ついでにこちらのより恵まれた境遇へもひと刺し飛んでくる。ところがフランスで私がかくも好きなのは、誰もが自分の幸運を明瞭に、ひるまず認めることだ。自分のパンのどちら側にバターが塗ってあるかはみんな知っていて、人にも喜んで見せる。これがまさに宗教の肝心なところではないか。そして自分の貧しさを卑屈に嘆くのをよしとしない。これが男らしさの肝心なところだと私は思う。本国で、かなり恵まれ、手もとに相当な金も持っていた女が、わが子を胸の悪くなるような泣き声で「貧乏人の子ですから」と呼ぶのを聞いたことがある。私はウェストミンスター公爵相手でもそんなことは言わない。そしてフランス人には、この独立の気風が満ちている。彼らのいう共和制の諸制度の賜物かもしれない。たぶんそれよりも、ほんとうに貧しい人があまりに少なく、泣き言を言う者どうしで気を強くするほどの数にならないせいだろう。"
    "translation_status": "reviewed"
  - "id": "voy-202"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The people on the barge were delighted to hear that I admired their state. They understood perfectly well, they told me, how Monsieur envied them. Without doubt Monsieur was rich; and in that case he might make a canal boat as pretty as a villa—joli comme un château. And with that they invited me on board their own water villa. They apologised for their cabin; they had not been rich enough to make it as it ought to be."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 202
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[138]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-202"
    "translation_ja": "艀の人たちは、私がその境遇をうらやましく思うと聞いて大喜びした。ムシューが自分たちを羨むお気持ちはよくわかります、と二人は言った。きっとムシューはお金持ちだろうから、そうなら運河の船なんて別荘みたいにすてきにできる、ジョリ・コム・アン・シャトー。そう言って二人はわが水上別荘に私を招いた。船室については申し訳なさそうに、あるべき仕立てにするほど裕福ではなかったのだと断った。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 245
          "end": 266
          "exact": "joli comme un château"
  - "id": "voy-203"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘The fire should have been here, at this side,’ explained the husband. ‘Then one might have a writing-table in the middle—books—and’ (comprehensively) ‘all. It would be quite coquettish—ça serait tout-à-fait coquet.’ And he looked about him as though the improvements were already made. It was plainly not the first time that he had thus beautified his cabin in imagination; and when next he makes a bit, I should expect to see the writing-table in the middle."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 203
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[139]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-203"
    "translation_ja": "「炉はここ、こっち側につければよかった」と夫が説明した。「そうすりゃ真ん中に書き物机が置けて、本も置けるし」（一切をひっくるめるしぐさで）「何もかもさ。ずいぶんしゃれるだろうね、サ・スレ・トゥタフェ・コケ」。そしてもう改装ができたかのようにあたりを見回した。想像の中でこうやって船室を飾るのは初めてではないことがよくわかった。次にひと儲けしたら、真ん中には書き物机が置かれるものと期待したい。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 186
          "end": 214
          "exact": "ça serait tout-à-fait coquet"
  - "id": "voy-204"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Madame had three birds in a cage. They were no great thing, she explained. Fine birds were so dear. They had sought to get a Hollandais last winter in Rouen (Rouen? thought I; and is this whole mansion, with its dogs and birds and smoking chimneys, so far a traveller as that? and as homely an object among the cliffs and orchards of the Seine as on the green plains of Sambre?)—they had sought to get a Hollandais last winter in Rouen; but these cost fifteen francs apiece—picture it—fifteen francs!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 204
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[140]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-204"
    "translation_ja": "奥さんは鳥籠に三羽小鳥を飼っていた。べつに上等なものじゃないんですよ、と説明した。よい鳥はあんまり高い。去年の冬ルーアンでオランダ種を買おうとした（ルーアンだって？　と私は思った。犬も鳥も煙を吐く煙突もついたこの屋敷一式が、そんな遠くまで行く旅人なのか。サンブルの緑の平原でと同じに、セーヌの崖と果樹園の間でもしっくりなじむ眺めなのか）。去年の冬はルーアンでオランダ種を買おうとしたが、一羽十五フランもする。考えてもごらんなさい、十五フランも！"
    "translation_status": "reviewed"

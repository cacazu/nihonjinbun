  - "id": "voy-359"
    "section_id": "ch-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was one odd piece of practical metaphysics which accompanied what I may call the depth, if I must not call it the intensity, of my abstraction. What philosophers call me and not-me, ego and non ego, preoccupied me whether I would or no. There was less me and more not-me than I was accustomed to expect. I looked on upon somebody else, who managed the paddling; I was aware of somebody else’s feet against the stretcher; my own body seemed to have no more intimate relation to me than the canoe, or the river, or the river banks. Nor this alone: something inside my mind, a part of my brain, a province of my proper being, had thrown off allegiance and set up for itself, or perhaps for the somebody else who did the paddling. I had dwindled into quite a little thing in a corner of myself. I was isolated in my own skull. Thoughts presented themselves unbidden; they were not my thoughts, they were plainly some one else’s; and I considered them like a part of the landscape. I take it, in short, that I was about as near Nirvana as would be convenient in practical life; and if this be so, I make the Buddhists my sincere compliments; ’tis an agreeable state, not very consistent with mental brilliancy, not exactly profitable in a money point of view, but very calm, golden, and incurious, and one that sets a man superior to alarms. It may be best figured by supposing yourself to get dead drunk, and yet keep sober to enjoy it. I have a notion that open-air labourers must spend a large portion of their days in this ecstatic stupor, which explains their high composure and endurance. A pity to go to the expense of laudanum, when here is a better paradise for nothing!"
    "source_languages":
      - "en"
    "source_locations":

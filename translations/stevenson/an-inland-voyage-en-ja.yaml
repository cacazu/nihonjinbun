          "exact": "しかしわれらが二隻の運命を嘆かずには、ここで筆を置けない。君、運河の艀を所有しようと計画したあの日は運のよい日ではなかった。そして白昼夢を見る者のうち最も楽天的な男に、その白昼夢を打ち明けたあの日も、運のよい日ではなかった。しばらくはたしかに世界は笑顔だった。艀を手に入れ、命名を済ませ、「ケルンの一万一千人の処女」号として、気持ちのよい川、古い町の城壁の下に幾月も浮かんだ。見る者の賛美の的であった。モレの腕利きの大工、マットラ氏が職人たちの腕競べの中心にこの船を据えた。働く者には熱を、仕事には勢いをつけるため、橋のたもとの宿で甘口シャンパンがどれほど消費されたか、君も忘れてはいないだろう。財政面に長居するのは遠慮したい。「ケルンの一万一千人の処女」号は、着飾らせてもらったその同じ川で朽ちた。一度もそよ風に押されず、辛抱強い曳き馬につながれたこともない。ついに腹を立てたモレの大工が売り払った時、アレシューザ号とシガレット号も一緒に売られた。片方は杉、片方は、陸を担ぐたび身にしみたとおり、芯まで堅いイギリスの樫だった。いまこの歴史的な二艇は三色旗を揚げ、よそよそしい新しい名で知られている。"

    "translation_status": "reviewed"
  - "id": "voy-329"
    "section_id": "ch-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The most patient people grow weary at last with being continually wetted with rain; except of course in the Scottish Highlands, where there are not enough fine intervals to point the difference. That was like to be our case, the day we left Noyon. I remember nothing of the voyage; it was nothing but clay banks and willows, and rain; incessant, pitiless, beating rain; until we stopped to lunch at a little inn at Pimprez, where the canal ran very near the river. We were so sadly drenched that the landlady lit a few sticks in the chimney for our comfort; there we sat in a steam of vapour, lamenting our concerns. The husband donned a game-bag and strode out to shoot; the wife sat in a far corner watching us. I think we were worth looking at. We grumbled over the misfortune of La Fère; we forecast other La Fères in the future;—although things went better with the Cigarette for spokesman; he had more aplomb altogether than I; and a dull, positive way of approaching a landlady that carried off the india-rubber bags. Talking of La Fère put us talking of the reservists."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 329
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[255]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-329"
    "translation_ja": "どれほど辛抱強い人も、雨に濡れつづければしまいには飽きる。むろんスコットランド高地は別だ。そもそも違いがきわだつほど晴れ間がない。ノワイヨンを発った日、われわれもそうなりかけた。その日の舟行は何も覚えていない。運河が川のごく近くに寄るパンプレの小さな宿で昼食に止まるまで、ただ粘土の岸と柳と雨、絶え間なく、情け容赦なく、打ちつける雨があるばかりだった。われわれはあんまり哀れに濡れそぼっていたので、女将が慰めに暖炉で薪を二、三本燃やしてくれた。そこで湯気を立てて腰を下ろし、わが身の事情を嘆いた。夫は獲物袋を肩にし、猟に大股で出ていった。妻は遠い隅にすわり、こちらを眺めた。一見の値はあったと思う。われわれはラ・フェールの災難をぶつくさ言い、来たるべきほかのラ・フェールを予測した。もっともシガレット号の主を口上係にするとうまくいった。彼は総じて私より度胸があり、ゴム引き袋の不利も相殺してしまう、素っ気ないほどきっぱりした物腰で女将に話しかけた。ラ・フェールを話題にしたことで、話は予備役兵に移った。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 3
          "exact": "The"
      - "side": "source"

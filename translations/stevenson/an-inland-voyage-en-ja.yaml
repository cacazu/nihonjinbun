          "exact": "Via Dolorosa"
  - "id": "voy-346"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In Compiègne post-office a great packet of letters awaited us; and the authorities were, for this occasion only, so polite as to hand them over upon application."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 346
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[271]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-346"
    "translation_ja": "コンピエーニュの郵便局には手紙が大束になってわれわれを待っていて、お役所はこの一回にかぎり、請求すると親切にも渡してくれた。"
    "translation_status": "reviewed"
  - "id": "voy-347"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In some ways, our journey may be said to end with this letter-bag at Compiègne. The spell was broken. We had partly come home from that moment."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 347
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[272]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-347"
    "translation_ja": "ある意味では、このコンピエーニュの郵便袋でわれわれの旅は終わったと言ってよい。魔法は破れた。その瞬間から、われわれは幾分か帰宅していた。"
    "translation_status": "reviewed"
  - "id": "voy-348"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "No one should have any correspondence on a journey; it is bad enough to have to write; but the receipt of letters is the death of all holiday feeling."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 348
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[273]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-348"
    "translation_ja": "旅に出たら手紙のやり取りなどするものではない。書かねばならぬだけでも困る。だが受け取るとなると、休日の気分はすべて死んでしまう。"
    "translation_status": "reviewed"
  - "id": "voy-349"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Out of my country and myself I go.’ I wish to take a dive among new conditions for a while, as into another element. I have nothing to do with my friends or my affections for the time; when I came away, I left my heart at home in a desk, or sent it forward with my portmanteau to await me at my destination. After my journey is over, I shall not fail to read your admirable letters with the attention they deserve. But I have paid all this money, look you, and paddled all these strokes, for no other purpose than to be abroad; and yet you keep me at home with your perpetual communications. You tug the string, and I feel that I am a tethered bird. You pursue me all over Europe with the little vexations that I came away to avoid. There is no discharge in the war of life, I am well aware; but shall there not be so much as a week’s furlough?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 349
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[274]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-349"
    "translation_ja": "「わが国を出て、われ自身をも出て、私は行く」。別世界に身をひたすように、しばらくは新しい環境に飛びこみたい。さしあたり友人とも、愛するものとも、私は関係がない。発つ時に心はわが家の机にしまってきた。さもなくば大鞄とともに送り、行き先で私を待たせてある。旅がすめばあなたのすばらしいお手紙は、ふさわしい注意を払って必ず拝読しよう。だがいいかね、私はこれだけの金を払い、これだけ櫂を漕いだのは、ただ外にいるためなのに、あなたは絶え間なく便りを送り、私を家につなぎとめる。紐を引かれると私はつながれた鳥だと感じる。逃げ出してきたちっぽけな煩いを携えて、あなたは私をヨーロッパじゅう追い回す。人生の戦争には除隊がない、それはよくわかっている。だが一週間の休暇さえないのだろうか？"
    "translation_status": "reviewed"
  - "id": "voy-350"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We were up by six, the day we were to leave. They had taken so little note of us that I hardly thought they would have condescended on a bill. But they did, with some smart particulars too; and we paid in a civilised manner to an uninterested clerk, and went out of that hotel, with the india-rubber bags, unremarked. No one cared to know about us. It is not possible to rise before a village; but Compiègne was so grown a town, that it took its ease in the morning; and we were up and away while it was still in dressing-gown and slippers. The streets were left to people washing door-steps; nobody was in full dress but the cavaliers upon the town-hall; they were all washed with dew, spruce in their gilding, and full of intelligence and a sense of professional responsibility. Kling went they on the bells for the half-past six as we went by. I took it kind of them to make me this parting compliment; they never were in better form, not even at noon upon a Sunday."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 350
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[275]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-350"
    "translation_ja": "発つ日の朝は六時には起きた。ホテルでは私たちのことをあまりに気にもかけなかったので、勘定書きなどわざわざ作るまいかとも思った。ところが作った。しかも、ちゃっかりした請求が何項目かあった。われわれは無関心な帳場係に文明人らしく金を払い、ゴム引き袋を提げ、気づかれぬままそのホテルを出た。こちらのことなど誰も知りたがらなかった。村より早く起きるのは不可能だ。だがコンピエーニュは十分成長した町で、朝はゆっくりしていた。まだ室内着にスリッパのうちに、人のほうは起きて出てしまった。街路は戸口の石段を洗う人々に任され、盛装していたのは市庁舎の騎士たちだけだった。露に洗われ、金箔は小ぎれいにきらめき、知性と職業的責任感にあふれていた。われわれが前を通ると、彼らは六時半をちりんと鳴らした。こんな別れの挨拶をしてくれた親切を、私はありがたく思った。日曜の正午にさえ、彼らがこれ以上元気に仕事をすることはなかった。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 781
          "end": 786
          "exact": "Kling"
  - "id": "voy-351"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was no one to see us off but the early washerwomen—early and late—who were already beating the linen in their floating lavatory on the river. They were very merry and matutinal in their ways; plunged their arms boldly in, and seemed not to feel the shock. It would be dispiriting to me, this early beginning and first cold dabble of a most dispiriting day’s work. But I believe they would have been as unwilling to change days with us as we could be to change with them. They crowded to the door to watch us paddle away into the thin sunny mists upon the river; and shouted heartily after us till we were through the bridge."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 351
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[276]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-351"
    "translation_ja": "見送ってくれる人は、川に浮かぶ洗い場でもう白物をたたいている早起きの洗濯女たちのほかにはなかった。朝早くも夜遅くも働くあの人たちだ。彼女たちはたいそう朗らかでいかにも朝の者らしく、大胆に腕を水へ突っ込み、その衝撃を感じもしないようだった。私なら、ただでさえ気落ちしそうな一日の仕事の、その早すぎる始まりと初めの冷たい水で、さぞ意気が沈むだろう。だが当の彼女らは、われわれが自分の日々を彼女らのと替えたくないのと同じくらい、われわれと替えたくなかったと思う。みんな戸口に集い、川に日が差す薄靄の中をわれわれが漕ぎ去るのを眺め、橋の下を抜けるまで元気に声をかけつづけてくれた。"
    "translation_status": "reviewed"

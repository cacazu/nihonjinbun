  - "id": "voy-357"
    "section_id": "ch-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I suppose none of us recognise the great part that is played in life by eating and drinking. The appetite is so imperious that we can stomach the least interesting viands, and pass off a dinner-hour thankfully enough on bread and water; just as there are men who must read something, if it were only Bradshaw’s Guide. But there is a romance about the matter after all. Probably the table has more devotees than love; and I am sure that food is much more generally entertaining than scenery. Do you give in, as Walt Whitman would say, that you are any the less immortal for that? The true materialism is to be ashamed of what we are. To detect the flavour of an olive is no less a piece of human perfection than to find beauty in the colours of the sunset."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 357
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[281]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-357"
    "translation_ja": "飲み食いが人生で果たす大きな役割を、われわれの誰も認めているとは思えない。食欲の命じ方はあまりに強いので、われわれは面白みのかけらもない料理を腹に入れ、パンと水でもありがたく食事時を過ごせる。ちょうど、ブラッドショーの鉄道時刻表ででも、何かを読まずにいられぬ男たちがいるようなものだ。それでもやはり、この一事には夢がある。たぶん食卓には恋より信者が多い。食べ物のほうが景色よりずっと広く人を楽しませることは私が請け合う。それで君の不滅性が少しでも減ると認めるかね、とウォルト・ホイットマンなら言うだろう。ほんとうの唯物主義とは、自分がそうであるものを恥じることだ。オリーヴの風味を見きわめるのは、夕焼けの色に美を見出すのに劣らず、人間の完成の一端なのである。"
    "translation_status": "reviewed"

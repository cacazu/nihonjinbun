  - "id": "voy-354"
    "section_id": "ch-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In our earlier adventures there was generally something to do, and that quickened us. Even the showers of rain had a revivifying effect, and shook up the brain from torpor. But now, when the river no longer ran in a proper sense, only glided seaward with an even, outright, but imperceptible speed, and when the sky smiled upon us day after day without variety, we began to slip into that golden doze of the mind which follows upon much exercise in the open air. I have stupefied myself in this way more than once; indeed, I dearly love the feeling; but I never had it to the same degree as when paddling down the Oise. It was the apotheosis of stupidity."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 354
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[278]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-354"
    "translation_ja": "前のほうの冒険では、たいてい何かすることがあり、それがわれわれをいきいきさせた。にわか雨さえ人を蘇らせ、鈍った頭脳を揺り起こす効き目があった。だが今、川はもはや本来の意味で走らず、均等でまっすぐ、しかし感じ取れない速さで海へ向かって滑るだけになり、空も来る日も来る日も変化なく微笑んだ。そして私たちは戸外で十分に体を動かしたあとに来る、あの黄金色の精神のまどろみに滑り込みはじめた。こうやって自分を茫然とさせたことは一度ならずある。じっさいこの感覚が大好きだ。だがオワーズを漕ぎ下るときほどの境地に達したことはない。愚鈍の神格化であった。"
    "translation_status": "reviewed"
  - "id": "voy-355"
    "section_id": "ch-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We ceased reading entirely. Sometimes when I found a new paper, I took a particular pleasure in reading a single number of the current novel; but I never could bear more than three instalments; and even the second was a disappointment. As soon as the tale became in any way perspicuous, it lost all merit in my eyes; only a single scene, or, as is the way with these feuilletons, half a scene, without antecedent or consequence, like a piece of a dream, had the knack of fixing my interest. The less I saw of the novel, the better I liked it: a pregnant reflection. But for the most part, as I said, we neither of us read anything in the world, and employed the very little while we were awake between bed and dinner in poring upon maps. I have always been fond of maps, and can voyage in an atlas with the greatest enjoyment. The names of places are singularly inviting; the contour of coasts and rivers is enthralling to the eye; and to hit, in a map, upon some place you have heard of before, makes history a new possession. But we thumbed our charts, on these evenings, with the blankest unconcern. We cared not a fraction for this place or that. We stared at the sheet as children listen to their rattle; and read the names of towns or villages to forget them again at once. We had no romance in the matter; there was nobody so fancy-free. If you had taken the maps away while we were studying them most intently, it is a fair bet whether we might not have continued to study the table with the same delight."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 355
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[279]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-355"
    "translation_ja": "われわれはまったく読書をしなくなった。ときどき新しい新聞を見つけたときには、連載小説のただ一回分を読むのをひときわ楽しんだが、三回分を超えるととても耐えられなかった。二回目でさえ期待外れだった。筋がいくらかなりと見えれば物語は私の目にすべての長所を失った。前も後もない夢の一片のような、ただ一場面、ないしこの新聞小説によくある半場面だけに、私の関心を固定するこつがあった。小説は読まなければ読まないほど私の気に入った。含みのある省察だ。とはいえ先ほど言ったように、大部分の時間は二人ともこの世の何ひとつ読まず、夕食と寝床のあいだの起きていられるごく短い時間を地図に見入って過ごした。私は昔から地図に目がなく、地図帳の中で大いに楽しく航海できる。地名は不思議に人を誘う。海岸と川の輪郭は目を奪う。以前聞いたことのある場所に地図でばったり出会うと、歴史が新しいわがものになる。だがこの頃の夕べには、まったく無関心に図面を繰った。あの場所もこの場所も、微塵も気にならなかった。子供ががらがらの音を聞くように紙を見つめ、町や村の名を読んでは即座に忘れた。そこに何のロマンもなく、これほど空想に縛られぬ者はいなかった。いちばん熱心に地図を眺めている最中に取り上げても、同じうれしさでそのまま卓を研究しつづけたのではないか、なかなかよい賭けになろう。"
    "translation_status": "reviewed"

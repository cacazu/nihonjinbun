  - "id": "voy-095"
    "section_id": "ch-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The canoes were carried into the boat-house; they were washed down for us by the Club servants, the sails were hung out to dry, and everything made as snug and tidy as a picture. And in the meanwhile we were led upstairs by our new-found brethren, for so more than one of them stated the relationship, and made free of their lavatory. This one lent us soap, that one a towel, a third and fourth helped us to undo our bags. And all the time such questions, such assurances of respect and sympathy! I declare I never knew what glory was before."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 95
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[40]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-095"
    "translation_ja": "カヌーは艇庫に運び入れられ、クラブの世話係が洗い清めてくれ、帆は干して乾かされ、何もかも絵のようにきちんと収まった。その間にわれわれは新しく見出した兄弟たちに、じっさい一人ならずその関係をそう言ったのだが、階上に案内され、洗面所を自由に使わせてもらった。一人が石鹸を貸し、別な一人がタオルを、三人目と四人目は荷をほどくのを手助けした。しかもその間じゅう、すごい質問攻めに、敬意と共感のあふれる言葉の数々！　あの時ほど栄光の意味を知ったのは初めてだと断言する。"
    "translation_status": "reviewed"

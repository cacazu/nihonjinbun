  - "id": "voy-327"
    "section_id": "ch-15"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On the whole, I was greatly solemnised. In the little pictorial map of our whole Inland Voyage, which my fancy still preserves, and sometimes unrolls for the amusement of odd moments, Noyon cathedral figures on a most preposterous scale, and must be nearly as large as a department. I can still see the faces of the priests as if they were at my elbow, and hear Ave Maria, ora pro nobis, sounding through the church. All Noyon is blotted out for me by these superior memories; and I do not care to say more about the place. It was but a stack of brown roofs at the best, where I believe people live very reputably in a quiet way; but the shadow of the church falls upon it when the sun is low, and the five bells are heard in all quarters, telling that the organ has begun. If ever I join the Church of Rome, I shall stipulate to be Bishop of Noyon on the Oise."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 327
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[254]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-327"
    "translation_ja": "総じて言えば、私は深く厳かな気持ちにされた。わが想像力がいまも保管し、折々ひまつぶしに広げる、この内陸の旅全体を描いた小さな絵地図では、ノワイヨン大聖堂はまったく途方もない縮尺で描かれ、ほとんど一県ほどの大きさにちがいない。司祭たちの顔が今もすぐ肘先にあるように見え、「アヴェ・マリア、われらのために祈りたまえ」が教会じゅうに響くのが聞こえる。こうしたもっと雄弁な記憶がノワイヨンのほかのすべてを私には消してしまった。だからこの地についてこれ以上は語りたくない。よく言ったところで褐色の屋根の山で、そこでは人々が静かなしごく立派な暮らしを営んでいるらしい。だが日が低くなれば教会の影がその上に落ち、五つの鐘は四方で聞こえ、オルガンが始まったと告げる。いつかローマの教会に入ることがあれば、オワーズ河畔のノワイヨンの司教にしてもらうことを条件にしよう。"
    "translation_status": "reviewed"

  - "id": "voy-113"
    "section_id": "ch-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For the life of me I cannot understand it. I too have been knolled to church, and sat at good men’s feasts; but I bear no mark of it. I am as strange as a Jack Indian to their official spectacles. I might come from any part of the globe, it seems, except from where I do. My ancestors have laboured in vain, and the glorious Constitution cannot protect me in my walks abroad. It is a great thing, believe me, to present a good normal type of the nation you belong to."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 113
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[56]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-113"
    "translation_ja": "私にはどうにもわけがわからない。私だって教会の鐘に呼ばれ、善人の祝宴に列した身だが、そんな印はどこにもないらしい。お役人の眼鏡には、私はどこぞのインディアン同然の珍客と映る。この地球のどこで生まれたとも取れるが、本当に生まれた土地だけは別というわけらしい。ご先祖も無駄な苦労をしたものだし、ご立派な英国憲法も、異国を歩く私を守ってはくれない。いいかね、自分の国の人間の見本のような顔をしているというのは、大事なことだ。"
    "translation_status": "reviewed"
  - "id": "voy-114"
    "section_id": "ch-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Nobody else was asked for his papers on the way to Maubeuge; but I was; and although I clung to my rights, I had to choose at last between accepting the humiliation and being left behind by the train. I was sorry to give way; but I wanted to get to Maubeuge."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 114
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[57]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-114"
    "translation_ja": "モブージュまでの道で証明書の提示を求められた人間はほかにいなかったが、私は求められた。権利を手放すまいと粘ってはみたが、ついには恥を忍ぶか、汽車に置いていかれるかの二者択一となった。折れるのは残念だったが、モブージュまでは行きたかった。"
    "translation_status": "reviewed"
  - "id": "voy-115"
    "section_id": "ch-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Maubeuge is a fortified town, with a very good inn, the Grand Cerf. It seemed to be inhabited principally by soldiers and bagmen; at least, these were all that we saw, except the hotel servants. We had to stay there some time, for the canoes were in no hurry to follow us, and at last stuck hopelessly in the custom-house until we went back to liberate them. There was nothing to do, nothing to see. We had good meals, which was a great matter; but that was all."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 115
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[58]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-115"
    "translation_ja": "モブージュは要塞都市で、グラン・セールという申し分のない宿がある。住民はおもに兵隊と旅まわりの商人らしかった。少なくとも宿の使用人を別にすれば、われわれの見た人間はその二種類だった。カヌーがいっこうあとを追ってこず、しまいには私たちが引き取りに戻るまで、どうにも出られぬ税関の人質になっていたので、しばらくそこに足止めを食った。することはなく、見るものもない。食事はよかった。これは大事なことだが、以上でおしまい。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 56
          "end": 66
          "exact": "Grand Cerf"
  - "id": "voy-116"
    "section_id": "ch-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The Cigarette was nearly taken up upon a charge of drawing the fortifications: a feat of which he was hopelessly incapable. And besides, as I suppose each belligerent nation has a plan of the other’s fortified places already, these precautions are of the nature of shutting the stable door after the steed is away. But I have no doubt they help to keep up a good spirit at home. It is a great thing if you can persuade people that they are somehow or other partakers in a mystery. It makes them feel bigger. Even the Freemasons, who have been shown up to satiety, preserve a kind of pride; and not a grocer among them, however honest, harmless, and empty-headed he may feel himself to be at bottom, but comes home from one of their coenacula with a portentous significance for himself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 116
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[59]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-116"
    "translation_ja": "シガレット号の主は要塞を写生したかどで、もう少しで捕まるところだった。当人には逆立ちしてもできない芸当だ。それに交戦国はたがいに相手の要塞の図面ぐらいすでに持っていると思うから、こんな用心は馬に逃げられてから厩に錠を下ろすようなものだ。もっとも国内の士気を高めるのには、たしかに役立つのだろう。とにかく自分も何かの秘密にあずかっていると思いこませるのは、なかなかのものだ。人は一回り偉くなった気がする。内情をいやというほど暴き立てられたフリーメーソンでさえ一種の誇りを保っている。いかに根は自分を正直で毒にも薬にもならぬ空っぽ頭と思う食料品屋でも、ひとたびあの会食の席から戻る時には、途方もなく意味ありげな人物に、自分の目には映るのだ。"
    "translation_status": "reviewed"

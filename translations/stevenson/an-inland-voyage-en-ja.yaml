  - "id": "voy-284"
    "section_id": "ch-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Carnival notoriously cheated us at first. Finding us easy in our ways, he regretted having let us off so cheaply; and taking me aside, told me a cock-and-bull story with the moral of another five francs for the narrator. The thing was palpably absurd; but I paid up, and at once dropped all friendliness of manner, and kept him in his place as an inferior with freezing British dignity. He saw in a moment that he had gone too far, and killed a willing horse; his face fell; I am sure he would have refunded if he could only have thought of a decent pretext. He wished me to drink with him, but I would none of his drinks. He grew pathetically tender in his professions; but I walked beside him in silence or answered him in stately courtesies; and when we got to the landing-place, passed the word in English slang to the Cigarette."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 284
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[215]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-284"
    "translation_ja": "カーニバルは最初からあからさまにこちらをだました。われわれが鷹揚なのを見ると、安く手を打ちすぎたと後悔し、私を脇へ呼んでもっともらしいほら話を聞かせた。その教訓は、語り手にもう五フランやれということだった。どう見たってばかげていた。私は払ったが、たちまち愛想を引っ込め、氷のような英国流の威厳で、彼を目下の者の分際に押しとどめた。彼はやりすぎたとすぐに悟った。従順な馬まで使いつぶしてしまったのだ。たちまちしょげた。返すのに体裁のよい口実さえ思いつけば、返したにちがいない。彼は私と一杯飲もうとしたが、そんな酒は御免だった。自分の気持ちを述べるその言いようは哀れなほど情に訴えるものになったが、私は黙って隣を歩き、あるいは威厳ある礼辞で答えた。そして乗り場でシガレット号の主に、英語の隠語で一件を知らせた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 8
          "exact": "Carnival"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 823
          "end": 832
          "exact": "Cigarette"
  - "id": "voy-285"
    "section_id": "ch-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In spite of the false scent we had thrown out the day before, there must have been fifty people about the bridge. We were as pleasant as we could be with all but Carnival. We said good-bye, shaking hands with the old gentleman who knew the river and the young gentleman who had a smattering of English; but never a word for Carnival. Poor Carnival! here was a humiliation. He who had been so much identified with the canoes, who had given orders in our name, who had shown off the boats and even the boatmen like a private exhibition of his own, to be now so publicly shamed by the lions of his caravan! I never saw anybody look more crestfallen than he. He hung in the background, coming timidly forward ever and again as he thought he saw some symptom of a relenting humour, and falling hurriedly back when he encountered a cold stare. Let us hope it will be a lesson to him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 285
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[216]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-285"
    "translation_ja": "前日あれだけ偽の手がかりをまいたのに、橋のあたりには五十人いたにちがいない。われわれはカーニバル以外のだれにでも、できるかぎり感じよくふるまった。川に詳しい老紳士や少し英語のできる若紳士と握手して別れを告げても、カーニバルにはひと言もかけなかった。哀れなカーニバル！　何たる屈辱だろう。あれほどカヌーと一心同体になり、われわれの名で指図をし、自分の私設の見世物のように舟どころか舟の主まで見せびらかした彼が、今や見世物小屋の当の花形の獅子から、公然と恥をかかされるとは！　あれほどしょげ返った顔を見たことがない。うしろに控え、こちらの心が和らぎかけた徴でも見つけたと思うとおどおど前へ出かけ、冷ややかな視線と出くわせば、あわててまた引きさがった。彼の教訓になることを願おう。"
    "translation_status": "reviewed"
  - "id": "voy-286"
    "section_id": "ch-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I would not have mentioned Carnival’s peccadillo had not the thing been so uncommon in France. This, for instance, was the only case of dishonesty or even sharp practice in our whole voyage. We talk very much about our honesty in England. It is a good rule to be on your guard wherever you hear great professions about a very little piece of virtue. If the English could only hear how they are spoken of abroad, they might confine themselves for a while to remedying the fact; and perhaps even when that was done, give us fewer of their airs."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 286
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[217]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-286"
    "translation_ja": "フランスでこうしたことがこんなに珍しくなければ、カーニバルのささやかなとがをわざわざ書かなかったろう。たとえばこの航海を通じ、不正といえるものはもちろん、少々あざといだけのやり口でさえ、この一件きりだった。イングランドのわれわれは自分たちの正直さについてよくしゃべる。ごくちっぽけな徳について大変な言い立てを聞く場所では気を許すな、というのはよい規則である。外国で自分たちがどう言われているかイギリス人に聞こえさえすれば、当座は実情を改めることだけに身を入れ、ひょっとしてそれを果たしたあとでさえ、あまり偉そうな顔をしなくなるかもしれない。"
    "translation_status": "reviewed"
  - "id": "voy-287"
    "section_id": "ch-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The young ladies, the graces of Origny, were not present at our start, but when we got round to the second bridge, behold, it was black with sightseers! We were loudly cheered, and for a good way below, young lads and lasses ran along the bank still cheering. What with current and paddling, we were flashing along like swallows. It was no joke to keep up with us upon the woody shore. But the girls picked up their skirts, as if they were sure they had good ankles, and followed until their breath was out. The last to weary were the three graces and a couple of companions; and just as they too had had enough, the foremost of the three leaped upon a tree-stump and kissed her hand to the canoeists. Not Diana herself, although this was more of a Venus after all, could have done a graceful thing more gracefully. ‘Come back again!’ she cried; and all the others echoed her; and the hills about Origny repeated the words, ‘Come back.’ But the river had us round an angle in a twinkling, and we were alone with the green trees and running water."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 287
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[218]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-287"
    "translation_ja": "例の若い婦人たち、オリニーの美の女神たちは出発には居合わせなかった。だが第二の橋まで回ってくると、見よ、見物人で黒山になっていた！　大歓声が起こり、そこから下流へもかなりの道のりを、若い男女が声援を送りながら岸を追ってきた。水流に櫂を加え、われわれは燕のように飛んでいた。木の茂った岸辺でわれわれに遅れまいとするのは容易なことではない。だが娘たちはいい足首を持っている自信があるらしく裾をたくし上げ、息が切れるまで追って来た。最後まで疲れなかったのは三美神と仲間が二人。彼女らにもようやく限界が来たとき、三人の先頭の娘が切株に飛び乗り、カヌーの男たちに投げキスをした。もっともあれは結局ウェヌスに近かったが、ディアナその人でも、優美なことをあれほど優美にはできなかったろう。「また帰ってらして！」と彼女が叫んだ。ほかの娘たちが声を合わせ、オリニーを囲む丘が「帰ってらして」と繰り返した。だが川はたちまち私たちを曲がり角の向こうに運び、緑の木と流れる水のほかには誰もいなかった。"
    "translation_status": "reviewed"
  - "id": "voy-288"
    "section_id": "ch-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Come back? There is no coming back, young ladies, on the impetuous stream of life."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 288
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[219]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-288"
    "translation_ja": "帰る？　お嬢さんがた、人生の激流に、戻るということはないのです。"
    "translation_status": "reviewed"
  - "id": "voy-289"

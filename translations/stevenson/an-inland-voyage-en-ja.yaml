  - "id": "voy-156"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "While M. Hector and the son of the house were putting up the donkey, and getting all the valuables under lock and key, the landlady warmed up the remains of our beefsteak, and fried the cold potatoes in slices, and Madame Gilliard set herself to waken the boy, who had come far that day, and was peevish and dazzled by the light. He was no sooner awake than he began to prepare himself for supper by eating galette, unripe pears, and cold potatoes—with, so far as I could judge, positive benefit to his appetite."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 156
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[95]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-156"
    "translation_ja": "エクトール氏と宿の息子がロバを小屋に入れ、貴重品にみな鍵をかけているあいだ、女将はわれわれのビフテキの残りを温め、冷めたじゃがいもを薄切りにして揚げた。ジリアール夫人は坊やを起こしにかかった。その日遠くから来た坊やは明かりがまぶしそうで、むずかっていた。目が覚めるや、さっそくガレットと青い梨と冷えたじゃがいもを食べ、夕食のために腹ごしらえをはじめた。私の見たところ、それがかえって食欲増進に役立った。"
    "translation_status": "reviewed"
  - "id": "voy-157"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The landlady, fired with motherly emulation, awoke her own little girl; and the two children were confronted. Master Gilliard looked at her for a moment, very much as a dog looks at his own reflection in a mirror before he turns away. He was at that time absorbed in the galette. His mother seemed crestfallen that he should display so little inclination towards the other sex; and expressed her disappointment with some candour and a very proper reference to the influence of years."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 157
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[96]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-157"
    "translation_ja": "母親どうしの対抗心に火がついた女将は、自分の幼い娘も起こして、二人を対面させた。ジリアール家の坊ちゃんはひと目娘を見た。犬が鏡に映った自分をちらと見て顔をそむける、あんな目である。その時の彼はガレットに夢中だった。異性への傾きがこうも乏しいのを見せて、母親は肩すかしを食った様子だった。しごく率直にその落胆を口にし、年齢というものの及ぼす作用にもじつに適切な言及をした。"
    "translation_status": "reviewed"
  - "id": "voy-158"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Sure enough a time will come when he will pay more attention to the girls, and think a great deal less of his mother: let us hope she will like it as well as she seemed to fancy. But it is odd enough; the very women who profess most contempt for mankind as a sex, seem to find even its ugliest particulars rather lively and high-minded in their own sons."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 158
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[97]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-158"
    "translation_ja": "いずれきっと、坊ちゃんが娘たちにもっと心を奪われ、お母さんのことなどずっとたまにしか考えなくなる時が来る。いま彼女が思い描いているらしいのと同じほど、その時を喜ぶよう祈ろう。だが、不思議なことだ。男性という性を誰より軽蔑すると公言する女たちに限って、その性のいちばん醜い特徴さえ、自分の息子に現れれば、なかなか溌剌たる気概のあらわれと見るらしい。"
    "translation_status": "reviewed"
  - "id": "voy-159"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The little girl looked longer and with more interest, probably because she was in her own house, while he was a traveller and accustomed to strange sights. And besides there was no galette in the case with her."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 159
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[98]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-159"
    "translation_ja": "女の子は坊ちゃんをもっと長く、もっと興味深げに眺めた。おそらく女の子には自分の家の中だが、坊ちゃんのほうは旅人で、物珍しいものに慣れていたからだろう。それに女の子のほうにはガレットもなかった。"
    "translation_status": "reviewed"
  - "id": "voy-160"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All the time of supper, there was nothing spoken of but my young lord. The two parents were both absurdly fond of their child. Monsieur kept insisting on his sagacity: how he knew all the children at school by name; and when this utterly failed on trial, how he was cautious and exact to a strange degree, and if asked anything, he would sit and think—and think, and if he did not know it, ‘my faith, he wouldn’t tell you at all—foi, il ne vous le dira pas’: which is certainly a very high degree of caution. At intervals, M. Hector would appeal to his wife, with his mouth full of beefsteak, as to the little fellow’s age at such or such a time when he had said or done something memorable; and I noticed that Madame usually pooh-poohed these inquiries. She herself was not boastful in her vein; but she never had her fill of caressing the child; and she seemed to take a gentle pleasure in recalling all that was fortunate in his little existence. No schoolboy could have talked more of the holidays which were just beginning and less of the black school-time which must inevitably follow after. She showed, with a pride perhaps partly mercantile in origin, his pockets preposterously swollen with tops and whistles and string. When she called at a house in the way of business, it appeared he kept her company; and whenever a sale was made, received a sou out of the profit. Indeed they spoiled him vastly, these two good people. But they had an eye to his manners for all that, and reproved him for some little faults in breeding, which occurred from time to time during supper."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 160
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[99]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-160"
    "translation_ja": "食事じゅう、話題はわが若君ひとりであった。父母の二人とも、わが子がばかばかしいほどかわいかった。亭主はしきりにその聡明さを強調した。学校の子の名を一人残らず知っていると言い、試してみてそれがさっぱり駄目だとなると、今度は並外れて用心深く正確だと言う。何か聞かれればじっと考え、また考え、知らなければ「まったくな、ひと言だって言いやしないんだ。フォワ、イル・ヌ・ヴ・ル・ディラ・パ」。これはたしかに並外れた用心深さだ。エクトール氏はときおりビフテキを頬張ったまま、息子があんな名言を吐いた、こんなことをしてのけたのは何歳の時だったかと妻に尋ねた。夫人はたいていそれを適当にあしらうのを私は見て取った。自慢をするたちの人ではなかったが、いくら子供を撫でても飽きることがなく、その小さな一生でしあわせなことを一つ一つ思い浮かべるのが、静かな喜びであるらしかった。始まったばかりの休暇の話をあれほどし、そのあと否応なく来る暗い学校の日々の話をあれほどしないのは、どんな学童にだって無理だろう。彼女はあるいはいくらか商人気質に由来する誇らしさで、独楽と笛とひもで途方もなく膨れた坊やのポケットを見せてくれた。商用で家々を訪ねるときは一緒について来て、商談がまとまるごとに儲けの中から一スーをもらうのだそうだ。まったく善良なこの二人は、ひどく息子を甘やかしていた。それでも行儀には目を配り、食事中にときどき現れるちょっとした無作法はたしなめていた。"
    "translation_status": "reviewed"

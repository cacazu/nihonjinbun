  - "id": "voy-390"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They made a stage at one end of the salle-à-manger. And what a sight it was to see M. de Vauversin, with a cigarette in his mouth, twanging a guitar, and following Mademoiselle Ferrario’s eyes with the obedient, kindly look of a dog! The entertainment wound up with a tombola, or auction of lottery tickets: an admirable amusement, with all the excitement of gambling, and no hope of gain to make you ashamed of your eagerness; for there, all is loss; you make haste to be out of pocket; it is a competition who shall lose most money for the benefit of M. de Vauversin and Mademoiselle Ferrario."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 390
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[308]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-390"
    "translation_ja": "二人は食堂の一端に舞台をこしらえた。煙草を口にくわえ、ギターをつまびきながら、従順でやさしい犬の目つきでフェラリオ嬢の眼を追うド・ヴォーヴェルサン氏を見るのは、なんという眺めだったろう！　興行のしめくくりは福引、つまりくじ札の競りだった。賭け事の興奮はことごとくありながら、熱の入れ方を恥じさせる利得の望みはいっさいない、みごとな娯楽だ。出るのは損ばかりで、みな財布の中身を減らそうと急ぐ。ド・ヴォーヴェルサン氏とフェラリオ嬢のため、誰がいちばんたくさん金を損するかの競争なのだ。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 36
          "end": 50
          "exact": "salle-à-manger"
  - "id": "voy-391"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "M. de Vauversin is a small man, with a great head of black hair, a vivacious and engaging air, and a smile that would be delightful if he had better teeth. He was once an actor in the Châtelet; but he contracted a nervous affection from the heat and glare of the footlights, which unfitted him for the stage. At this crisis Mademoiselle Ferrario, otherwise Mademoiselle Rita of the Alcazar, agreed to share his wandering fortunes. ‘I could never forget the generosity of that lady,’ said he. He wears trousers so tight that it has long been a problem to all who knew him how he manages to get in and out of them. He sketches a little in water-colours; he writes verses; he is the most patient of fishermen, and spent long days at the bottom of the inn-garden fruitlessly dabbling a line in the clear river."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 391
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[309]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-391"
    "translation_ja": "ド・ヴォーヴェルサン氏は小男で、黒髪をたっぷり生やし、快活で人を惹く様子をしていて、歯がもう少しよければ実にすてきであろう笑顔をする。かつてはシャトレ座の役者だったが、脚光の熱とまぶしさから神経の病を患って、舞台に適さなくなった。この危機にフェラリオ嬢、別名アルカザールのリタ嬢が、彼のさすらう運命を分かち合うと承知した。「あのご婦人の寛大さは一生忘れられません」と言った。はいているズボンのぴちぴちしたこと、どうやって脱ぎ着するかは、彼を知るみなの長年の難問であった。水彩の素描を少しする。詩を書く。きわめて辛抱強い釣り人で、宿の庭のはずれ、澄んだ川に糸を遊ばせ、何の収穫もなく長い幾日を過ごした。"
    "translation_status": "reviewed"
  - "id": "voy-392"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "You should hear him recounting his experiences over a bottle of wine; such a pleasant vein of talk as he has, with a ready smile at his own mishaps, and every now and then a sudden gravity, like a man who should hear the surf roar while he was telling the perils of the deep. For it was no longer ago than last night, perhaps, that the receipts only amounted to a franc and a half, to cover three francs of railway fare and two of board and lodging. The Maire, a man worth a million of money, sat in the front seat, repeatedly applauding Mlle. Ferrario, and yet gave no more than three sous the whole evening. Local authorities look with such an evil eye upon the strolling artist. Alas! I know it well, who have been myself taken for one, and pitilessly incarcerated on the strength of the misapprehension. Once, M. de Vauversin visited a commissary of police for permission to sing. The commissary, who was smoking at his ease, politely doffed his hat upon the singer’s entrance. ‘Mr. Commissary,’ he began, ‘I am an artist.’ And on went the commissary’s hat again. No courtesy for the companions of Apollo! ‘They are as degraded as that,’ said M. de Vauversin with a sweep of his cigarette."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 392
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[310]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-392"
    "translation_ja": "葡萄酒一本を前に、経験談をする彼を聞かせたい。まことに楽しい話の運びで、わが失敗にはすぐ笑みを見せ、ときおり不意にまじめになる。大海の危険を語っているさなかに砕ける波の轟きを耳にした男のようだ。なにしろ、おそらくほんの昨夜にも、売り上げは一フラン半しかなく、そこから三フランの汽車賃と二フランの食い扶持と寝床代をまかなわねばならなかった。百万の財産のある村長は最前列にすわり、何度もフェラリオ嬢に拍手したにもかかわらず、一晩で三スーより多くは出さなかった。土地のお役人は旅芸人にそれほど意地の悪い目を向ける。ああ、私はよく知っている。自分もそれだと間違えられ、その誤解一つで容赦なく投獄されたからだ。あるときド・ヴォーヴェルサン氏は、歌う許可を得に警察の署長を訪ねた。のんびり煙草を喫していた署長は、歌い手がはいると丁寧に帽子を取った。「署長さん」と彼は切り出した。「私は芸術家です」。するとまた署長の頭に帽子が載った。アポロンの仲間に向ける礼儀などないのだ！　「芸人なんて、そこまで低い身分に見られるんですよ」とド・ヴォーヴェルサン氏は煙草でひと薙ぎしながら言った。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 586
          "end": 590
          "exact": "sous"
  - "id": "voy-393"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But what pleased me most was one outbreak of his, when we had been talking all the evening of the rubs, indignities, and pinchings of his wandering life. Some one said, it would be better to have a million of money down, and Mlle. Ferrario admitted that she would prefer that mightily. ‘Eh bien, moi non;—not I,’ cried De Vauversin, striking the table with his hand. ‘If any one is a failure in the world, is it not I? I had an art, in which I have done things well—as well as some—better perhaps than others; and now it is closed against me. I must go about the country gathering coppers and singing nonsense. Do you think I regret my life? Do you think I would rather be a fat burgess, like a calf? Not I! I have had moments when I have been applauded on the boards: I think nothing of that; but I have known in my own mind sometimes, when I had not a clap from the whole house, that I had found a true intonation, or an exact and speaking gesture; and then, messieurs, I have known what pleasure was, what it was to do a thing well, what it was to be an artist. And to know what art is, is to have an interest for ever, such as no burgess can find in his petty concerns. Tenez, messieurs, je vais vous le dire—it is like a religion.’"
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 393
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[311]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-393"
    "translation_ja": "だが私をいちばん喜ばせたのは、一晩じゅう彼の放浪生活の障害、屈辱、窮乏を話していて、不意に彼が熱をこめて言ったことだった。それより百万の現金が手に入ればいいと誰かが言い、フェラリオ嬢はそのほうがよほどいいと認めた。「ところがね、私は違う。私はね」とド・ヴォーヴェルサンが叫び、手で卓をたたいた。「この世に失敗者がいるなら、それこそ私じゃありませんか？　私には一芸があり、うまくやれたものもある。ある人たちと同じくらい、ほかの人たちよりは上手に、かもしれない。いまはその道を閉ざされている。私はこの国を回り、銅貨をかき集め、つまらない歌を歌わねばならない。自分の人生を悔いていると思いますか？　子牛のように太った町の名士になりたいとでも？　御免ですね！　舞台に立って拍手を浴びた瞬間が私にもありました。そんなことは何とも思いません。だが時として、客席から一つの拍手もなかったとき、自分の胸では、たしかに正しい抑揚を見つけた、あるいはぴたりとした、もの言う身ぶりを見つけたとわかったことがあります。そのときね皆さん、私は喜びとは何か、ひとつのことをよくやることとは何か、芸術家であることは何かを知ったのです。それに芸術というものがわかれば、ずっと尽きない関心を持つことになる。どんな町の名士にも、けちな身辺の用事には見つからない関心です。いいですか皆さん、言ってしまいましょう。それは宗教のようなものですよ」"
    "translation_status": "reviewed"

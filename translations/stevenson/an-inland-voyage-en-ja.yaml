  - "id": "voy-070"
    "section_id": "dedication"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But I cannot pause till I have lamented the fate of our two ships. That, sir, was not a fortunate day when we projected the possession of a canal barge; it was not a fortunate day when we shared our day-dream with the most hopeful of day-dreamers. For a while, indeed, the world looked smilingly. The barge was procured and christened, and as the ‘Eleven Thousand Virgins of Cologne,’ lay for some months, the admired of all admirers, in a pleasant river and under the walls of an ancient town. M. Mattras, the accomplished carpenter of Moret, had made her a centre of emulous labour; and you will not have forgotten the amount of sweet champagne consumed in the inn at the bridge end, to give zeal to the workmen and speed to the work. On the financial aspect, I would not willingly dwell. The ‘Eleven Thousand Virgins of Cologne’ rotted in the stream where she was beautified. She felt not the impulse of the breeze; she was never harnessed to the patient track-horse. And when at length she was sold, by the indignant carpenter of Moret, there were sold along with her the ‘Arethusa’ and the ‘Cigarette,’ she of cedar, she, as we knew so keenly on a portage, of solid-hearted English oak. Now these historic vessels fly the tricolor and are known by new and alien names."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 70
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[18]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-070"
    "translation_ja": "しかしわれらが二隻の運命を嘆かずには、ここで筆を置けない。君、運河の艀を所有しようと計画したあの日は運のよい日ではなかった。そして白昼夢を見る者のうち最も楽天的な男に、その白昼夢を打ち明けたあの日も、運のよい日ではなかった。しばらくはたしかに世界は笑顔だった。艀を手に入れ、命名を済ませ、「ケルンの一万一千人の処女」号として、気持ちのよい川、古い町の城壁の下に幾月も浮かんだ。見る者の賛美の的であった。モレの腕利きの大工、マットラ氏が職人たちの腕競べの中心にこの船を据えた。働く者には熱を、仕事には勢いをつけるため、橋のたもとの宿で甘口シャンパンがどれほど消費されたか、君も忘れてはいないだろう。財政面に長居するのは遠慮したい。「ケルンの一万一千人の処女」号は、着飾らせてもらったその同じ川で朽ちた。一度もそよ風に押されず、辛抱強い曳き馬につながれたこともない。ついに腹を立てたモレの大工が売り払った時、アレシューザ号とシガレット号も一緒に売られた。片方は杉、片方は、陸を担ぐたび身にしみたとおり、芯まで堅いイギリスの樫だった。いまこの歴史的な二艇は三色旗を揚げ、よそよそしい新しい名で知られている。"
    "translation_status": "reviewed"

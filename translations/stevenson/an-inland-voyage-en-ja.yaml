    "translation_status": "reviewed"
  - "id": "voy-260"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Although we came late for dinner, the company at table treated us to sparkling wine. ‘That is how we are in France,’ said one. ‘Those who sit down with us are our friends.’ And the rest applauded."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 260
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[192]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-260"
    "translation_ja": "われわれは夕食に遅れたにもかかわらず、食卓の人たちは発泡葡萄酒を振る舞ってくれた。「フランスではこうなんです」と一人が言った。「同じ食卓に着く者は友です」。あとの者たちは拍手を送った。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 8
          "exact": "Although"
  - "id": "voy-261"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They were three altogether, and an odd trio to pass the Sunday with."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 261
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[193]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-261"
    "translation_ja": "全部で三人、日曜をともに過ごすには風変わりな三人組だった。"
    "translation_status": "reviewed"
  - "id": "voy-262"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Two of them were guests like ourselves, both men of the north. One ruddy, and of a full habit of body, with copious black hair and beard, the intrepid hunter of France, who thought nothing so small, not even a lark or a minnow, but he might vindicate his prowess by its capture. For such a great, healthy man, his hair flourishing like Samson’s, his arteries running buckets of red blood, to boast of these infinitesimal exploits, produced a feeling of disproportion in the world, as when a steam-hammer is set to cracking nuts. The other was a quiet, subdued person, blond and lymphatic and sad, with something the look of a Dane: ‘Tristes têtes de Danois!’ as Gaston Lafenestre used to say."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 262
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[194]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-262"
    "translation_ja": "二人はわれわれと同じ泊まり客で、どちらも北の人だった。一人は赤ら顔で肉づきがよく、黒い髪と髭が豊かな、フランスの恐れ知らずの狩人。雲雀だろうと小魚だろうと、捕らえて腕を示すに足りぬほど小さいものなどないと思っていた。サムソンのように髪が茂り、動脈には真っ赤な血がバケツ何杯分も流れている、これほど大きく健康な男が、芥子粒ほどの武勲を自慢すると、世界の釣り合わせがおかしくなった気がした。蒸気鎚で胡桃を割るみたいだ。もう一人はおとなしく沈んだ人で、金髪に色白の気力乏しげな顔、悲しげで、どこかデンマーク人に似ていた。ガストン・ラフェネストルがよく言ったものだ、「デンマーク人の悲しげな顔よ！」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 633
          "end": 656
          "exact": "Tristes têtes de Danois"
  - "id": "voy-263"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I must not let that name go by without a word for the best of all good fellows now gone down into the dust. We shall never again see Gaston in his forest costume—he was Gaston with all the world, in affection, not in disrespect—nor hear him wake the echoes of Fontainebleau with the woodland horn. Never again shall his kind smile put peace among all races of artistic men, and make the Englishman at home in France. Never more shall the sheep, who were not more innocent at heart than he, sit all unconsciously for his industrious pencil. He died too early, at the very moment when he was beginning to put forth fresh sprouts, and blossom into something worthy of himself; and yet none who knew him will think he lived in vain. I never knew a man so little, for whom yet I had so much affection; and I find it a good test of others, how much they had learned to understand and value him. His was indeed a good influence in life while he was still among us; he had a fresh laugh, it did you good to see him; and however sad he may have been at heart, he always bore a bold and cheerful countenance, and took fortune’s worst as it were the showers of spring. But now his mother sits alone by the side of Fontainebleau woods, where he gathered mushrooms in his hardy and penurious youth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 263
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[195]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-263"
    "translation_ja": "今や塵の中に下った善友の中の善友にひと言ささげず、その名を通り過ぎるわけにはいかない。森へ出かける姿のガストンを見ることは二度とない。誰もが蔑みからでなく、親しみから彼をただガストンと呼んだ。その狩猟笛がフォンテーヌブローのこだまを呼びさますのを聞くこともない。二度とあの優しい笑顔があらゆる種類の芸術家のあいだに平和をもたらし、イギリス人をフランスでわが家のようにくつろがせることはない。彼に劣らず心無垢な羊たちが、わけも知らずにその勤勉な鉛筆のモデルを務めることもない。彼は早すぎる死を迎えた。新しい芽を出し、彼自身にふさわしく花を開きかけた、まさにその時だった。それでも彼を知った誰も、生きたことがむなしかったとは考えまい。これほどわずかしか付き合わず、これほど深く愛情を寄せた男を私はほかに知らない。人となりを測るのにも、その人がどれほど彼を理解し、その値打ちを認めるようになったかはよい試金石だと思う。まだ一緒にいたころ彼の及ぼす影響はまさに善きものだった。みずみずしい笑いを持ち、会えばそれだけでこちらは元気になった。胸のどこまで悲しかったとしても、いつも気丈で快活な顔をして、運命の最悪の仕打ちも春雨のように受け止めた。しかし今、彼の母はフォンテーヌブローの森のほとり、彼が貧しくたくましい若年の日々に茸を採ったその場所に、ひとりすわっている。"
    "translation_status": "reviewed"
  - "id": "voy-264"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Many of his pictures found their way across the Channel: besides those which were stolen, when a dastardly Yankee left him alone in London with two English pence, and perhaps twice as many words of English. If any one who reads these lines should have a scene of sheep, in the manner of Jacques, with this fine creature’s signature, let him tell himself that one of the kindest and bravest of men has lent a hand to decorate his lodging. There may be better pictures in the National Gallery; but not a painter among the generations had a better heart. Precious in the sight of the Lord of humanity, the Psalms tell us, is the death of his saints. It had need to be precious; for it is very costly, when by the stroke, a mother is left desolate, and the peace-maker, and peace-looker, of a whole society is laid in the ground with Cæsar and the Twelve Apostles."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 264
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[196]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-264"
    "translation_ja": "彼の絵は数多く海峡を渡った。卑劣なヤンキーが彼をロンドンに置き去りにし、イギリスの銅貨二ペンスと、おそらくその倍ほどの数の英単語しか彼に残さなかった際、盗まれた数々を別にしてもそうだ。これを読むどなたかがジャック風の羊の絵をお持ちで、そこにこの立派な人の署名があるなら、このうえなく親切で勇敢な男の一人がわが住まいを飾るのに手を添えたのだと思っていただきたい。国立美術館にもっとすぐれた絵はあろう。だが幾世代の画家を訪ねても、これにまさる心を持った者はない。詩篇によれば、人類の主の御目にはその聖徒の死は尊い。それは尊くなければなるまい。ひとたびその鎌が下るや、ひとりの母は寂寥の中に残され、ある集まり全体を和ませ、その顔に平和を宿した人が、カエサルや十二使徒とともに土に葬られる。あまりに高い代価であるから。"
    "translation_status": "reviewed"

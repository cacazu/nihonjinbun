  - "id": "voy-394"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Such, making some allowance for the tricks of memory and the inaccuracies of translation, was the profession of faith of M. de Vauversin. I have given him his own name, lest any other wanderer should come across him, with his guitar and cigarette, and Mademoiselle Ferrario; for should not all the world delight to honour this unfortunate and loyal follower of the Muses? May Apollo send him rimes hitherto undreamed of; may the river be no longer scanty of her silver fishes to his lure; may the cold not pinch him on long winter rides, nor the village jack-in-office affront him with unseemly manners; and may he never miss Mademoiselle Ferrario from his side, to follow with his dutiful eyes and accompany on the guitar!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 394
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[312]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-394"
    "translation_ja": "記憶がしかけるいたずらと翻訳の不正確さをいくらかご容赦いただけば、以上がド・ヴォーヴェルサン氏の信仰告白だった。ほかのさすらい人がひょっとして、ギターと煙草とフェラリオ嬢を連れた彼に出会うかもしれないので、本名を記した。なにしろ運に恵まれぬこの誠実な詩神の従者を、世界じゅうが喜んで称えてよいのではないか。アポロンよ、いまだ夢にも見なかった押韻をお恵みあれ。川がその銀の魚を彼の餌にもう惜しまぬように。冬の長い車旅に寒さが彼を責めぬように、村の小役人が似つかわしくない無礼で辱めぬように。そして彼が従順な眼で見守り、ギターで伴奏する相手のフェラリオ嬢が、いつまでも彼のそばにいますように！"
    "translation_status": "reviewed"
  - "id": "voy-395"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The marionnettes made a very dismal entertainment. They performed a piece, called Pyramus and Thisbe, in five mortal acts, and all written in Alexandrines fully as long as the performers. One marionnette was the king; another the wicked counsellor; a third, credited with exceptional beauty, represented Thisbe; and then there were guards, and obdurate fathers, and walking gentlemen. Nothing particular took place during the two or three acts that I sat out; but you will he pleased to learn that the unities were properly respected, and the whole piece, with one exception, moved in harmony with classical rules. That exception was the comic countryman, a lean marionnette in wooden shoes, who spoke in prose and in a broad patois much appreciated by the audience. He took unconstitutional liberties with the person of his sovereign; kicked his fellow-marionnettes in the mouth with his wooden shoes, and whenever none of the versifying suitors were about, made love to Thisbe on his own account in comic prose."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 395
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[313]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-395"
    "translation_ja": "操り人形はひどく陰気な見世物になった。『ピュラモスとティスベ』という芝居を、うんざりするほど長い五幕で演じた。せりふは全編、役者の背丈にゆうに匹敵する長さのアレクサンドラン詩句で書いてあった。一体が王、一体が悪い顧問官、三体目が、とりわけ美しいとの評判で、ティスベを演じた。そのほか衛兵、頑固な父親、人並みの紳士の端役などがあった。私がすわって見届けた二幕か三幕の間には、とりたてて事件は起きなかった。だが芝居の三一致はしかるべく尊重され、たった一つを例外として全作が古典の規則と調和して進んだことは、喜んでお聞きいただけよう。その例外は滑稽な田舎男で、木靴をはいた痩せた人形が、客に大受けする、ひどく訛ったお国言葉の散文でしゃべった。彼は君主の身体に対して憲法を踏み外すような勝手を働き、仲間の人形の口を木靴で蹴り、詩句でしゃべる求婚者が一人もいないときには、自分のために滑稽な散文でティスベを口説いた。"
    "translation_status": "reviewed"

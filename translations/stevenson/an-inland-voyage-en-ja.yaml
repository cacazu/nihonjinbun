      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-399"
    "translation_ja": "川の莫大な水量、その疲れを知らぬ一途さは、心をとらえて放さなかった。今や自分の行く末にこれほど確信があり、進み方は力強く楽々として、決意に満ちたおとなの男のようだった。ル・アーヴルの砂の上では、砕け波がこの川のために轟いていた。"
    "translation_status": "reviewed"
  - "id": "voy-400"
    "section_id": "ch-21"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For my own part, slipping along this moving thoroughfare in my fiddle-case of a canoe, I also was beginning to grow aweary for my ocean. To the civilised man, there must come, sooner or later, a desire for civilisation. I was weary of dipping the paddle; I was weary of living on the skirts of life; I wished to be in the thick of it once more; I wished to get to work; I wished to meet people who understood my own speech, and could meet with me on equal terms, as a man, and no longer as a curiosity."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 400
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[317]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-400"
    "translation_ja": "私もまたヴァイオリンの箱のようなカヌーでこの動く大道を滑りながら、しだいに自分の海を恋しく思いはじめていた。文明人には、早かれ遅かれ文明への欲望が訪れるにちがいない。私は櫂をひたすことに飽きていた。人生の裾で暮らすのに飽きた。もう一度そのまっただ中にいたかった。仕事にかかりたかった。私自身のことばを解し、私をもはや見世物としてでなく、一人の人間として、対等に遇してくれる人たちに会いたかった。"
    "translation_status": "reviewed"
  - "id": "voy-401"
    "section_id": "ch-21"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And so a letter at Pontoise decided us, and we drew up our keels for the last time out of that river of Oise that had faithfully piloted them, through rain and sunshine, for so long. For so many miles had this fleet and footless beast of burthen charioted our fortunes, that we turned our back upon it with a sense of separation. We had made a long détour out of the world, but now we were back in the familiar places, where life itself makes all the running, and we are carried to meet adventure without a stroke of the paddle. Now we were to return, like the voyager in the play, and see what rearrangements fortune had perfected the while in our surroundings; what surprises stood ready made for us at home; and whither and how far the world had voyaged in our absence. You may paddle all day long; but it is when you come back at nightfall, and look in at the familiar room, that you find Love or Death awaiting you beside the stove; and the most beautiful adventures are not those we go to seek."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 401
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[318]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-401"
    "translation_ja": "そうしてポントワーズで受けた一通の手紙が決心をつけた。雨の日にも晴れた日にもあれほど長く忠実に水先案内してくれたオワーズ川から、われわれは最後にわが舟の竜骨を引き上げた。足もないのに足の速いこの荷役獣は、われわれの運命を車に載せてずいぶん遠くまで運んでくれた。背を向けるときには、別れの寂しさを覚えた。世の中から長い回り道をしてきたが、いまや馴染みの場所に帰った。そこでは人生自身が走る役を引き受け、われわれは櫂をひとかきすることもなく冒険に向かって運ばれてゆく。いまや私たちは芝居の中の旅人のように帰って、その間に運命が身のまわりのどんな配置換えを仕上げたのか、わが家で何の驚きがすでに仕上がって待っているのか、留守中、世界はどこへ、どれだけ遠くまで航海したのかを見ることになる。日がな一日、櫂をとるのはあなたの自由だ。でも〈愛〉か〈死〉がストーブの傍らであなたを待っているのを見つけるのは、夕暮れに帰り、馴染みの部屋をのぞいたときだ。そして最も美しい冒険は、自分で探しに出た冒険ではない。"
    "translation_status": "reviewed"

  - "id": "voy-073"
    "section_id": "ch-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We made a great stir in Antwerp Docks. A stevedore and a lot of dock porters took up the two canoes, and ran with them for the slip. A crowd of children followed cheering. The Cigarette went off in a splash and a bubble of small breaking water. Next moment the Arethusa was after her. A steamer was coming down, men on the paddle-box shouted hoarse warnings, the stevedore and his porters were bawling from the quay. But in a stroke or two the canoes were away out in the middle of the Scheldt, and all steamers, and stevedores, and other ‘long-shore vanities were left behind."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 73
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[20]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-073"
    "translation_ja": "アントウェルペンの船渠でわれわれは大した騒ぎを巻き起こした。荷役の親方と大勢の人足が二艇のカヌーを取り上げ、進水斜面へ駆けた。子供が一団、歓声を上げてあとについた。シガレット号が水しぶきを上げ、細波を泡立たせて出ていった。次の瞬間アレシューザ号が追った。汽船が下ってきた。外輪覆いの上の男たちがしわがれ声で警告を発し、波止場では荷役の親方と人足たちが怒鳴った。だが一掻き二掻きでカヌーはスヘルデ川のまん中に出て、汽船も荷役親方も、陸勤めの虚栄やら何やらも、みんなあとに残していた。"
    "translation_status": "reviewed"

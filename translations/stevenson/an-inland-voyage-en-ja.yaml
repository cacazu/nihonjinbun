  - "id": "voy-171"
    "section_id": "ch-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In the morning, when we came downstairs, the landlady pointed out to us two pails of water behind the street-door. ‘Voilà de l’eau pour vous débarbouiller,’ says she. And so there we made a shift to wash ourselves, while Madame Gilliard brushed the family boots on the outer doorstep, and M. Hector, whistling cheerily, arranged some small goods for the day’s campaign in a portable chest of drawers, which formed a part of his baggage. Meanwhile the child was letting off Waterloo crackers all over the floor."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 171
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[109]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-171"
    "translation_ja": "朝、階下に下りると女将が表口の戸のうしろに水を入れた手桶が二つあるのを指さした。「顔をさっぱりさせるお水はそこですよ」。そこでどうにか顔を洗った。その間、ジリアール夫人は戸外の上がり段で家族の靴を磨き、エクトール氏は朗らかに口笛を吹きながら、荷物の一つである携帯用の小箪笥に、その日の戦いにそなえて小間物を並べた。坊やはといえば、床じゅうでワーテルロー爆竹を鳴らしていた。"
    "translation_status": "reviewed"

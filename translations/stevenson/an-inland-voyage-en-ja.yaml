  - "id": "voy-185"
    "section_id": "ch-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It turned out we were to see more of Landrecies than we expected; for the weather next day was simply bedlamite. It is not the place one would have chosen for a day’s rest; for it consists almost entirely of fortifications. Within the ramparts, a few blocks of houses, a long row of barracks, and a church, figure, with what countenance they may, as the town. There seems to be no trade; and a shopkeeper from whom I bought a sixpenny flint-and-steel, was so much affected that he filled my pockets with spare flints into the bargain. The only public buildings that had any interest for us were the hotel and the café. But we visited the church. There lies Marshal Clarke. But as neither of us had ever heard of that military hero, we bore the associations of the spot with fortitude."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 185
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[122]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-185"
    "translation_ja": "思ったより長くランドルシーを見るはめになった。翌日の空模様はまさしく気違い沙汰だったからだ。丸一日休むのに自分から選ぶような場所ではない。町のほとんど全部が要塞から成り立っている。城壁の内では、数区画の家、一列に長い兵舎と教会一つが、どうにか体面を繕って町を代表している。商いなどないらしい。私が六ペンスの火打ち石と火打ち金を買った店の主は大いに感激して、おまけの火打ち石を私のポケットいっぱい詰めてくれた。われわれの関心を引いた公共の建物は、ホテルとカフェだけだった。それでも教会は見物した。クラーク元帥が眠っている。だがこの武人で英雄なる人物の名を二人とも聞いたことがなかったので、この地にまつわる感慨にも立派に耐えおおせた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 613
          "end": 617
          "exact": "café"
  - "id": "voy-186"
    "section_id": "ch-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In all garrison towns, guard-calls, and réveilles, and such like, make a fine romantic interlude in civic business. Bugles, and drums, and fifes, are of themselves most excellent things in nature; and when they carry the mind to marching armies, and the picturesque vicissitudes of war, they stir up something proud in the heart. But in a shadow of a town like Landrecies, with little else moving, these points of war made a proportionate commotion. Indeed, they were the only things to remember. It was just the place to hear the round going by at night in the darkness, with the solid tramp of men marching, and the startling reverberations of the drum. It reminded you, that even this place was a point in the great warfaring system of Europe, and might on some future day be ringed about with cannon smoke and thunder, and make itself a name among strong towns."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 186
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[123]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-186"
    "translation_ja": "どんな駐屯地でも、衛兵招集や起床の合図やらが、市民の営みに物語めいた見事な幕間を挟む。らっぱ、太鼓、横笛はそれ自体が世にもすばらしいもので、まして進軍する軍隊と戦のおもむきに富む盛衰とに思いを馳せさせれば、心中ひそかな誇りを揺り起こす。だがランドルシーのような、ほかにほとんど動くもののない、町の影法師みたいな町では、こうした軍用の合図がそれだけ大きな波紋を起こした。じつのところ、覚えておくべきものはほかになかった。夜の闇の中、行進する兵たちのずしりとした足音と、ぎょっとするほど反響する太鼓を響かせて巡察が通り過ぎるのを聞くには、まさにおあつらえ向きの場所だった。こんな場所でさえも、ヨーロッパの巨大な戦争機構の一点をなし、いつかは大砲の硝煙と雷鳴に取り囲まれ、堅城として名を上げる日があるかもしれないことを、思い出させた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 40
          "end": 49
          "exact": "réveilles"
  - "id": "voy-187"
    "section_id": "ch-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The drum, at any rate, from its martial voice and notable physiological effect, nay, even from its cumbrous and comical shape, stands alone among the instruments of noise. And if it be true, as I have heard it said, that drums are covered with asses’ skin, what a picturesque irony is there in that! As if this long-suffering animal’s hide had not been sufficiently belaboured during life, now by Lyonnese costermongers, now by presumptuous Hebrew prophets, it must be stripped from his poor hinder quarters after death, stretched on a drum, and beaten night after night round the streets of every garrison town in Europe. And up the heights of Alma and Spicheren, and wherever death has his red flag a-flying, and sounds his own potent tuck upon the cannons, there also must the drummer-boy, hurrying with white face over fallen comrades, batter and bemaul this slip of skin from the loins of peaceable donkeys."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 187
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[124]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-187"
    "translation_ja": "とにかく太鼓は、雄々しい声と目立った生理的効果、いや、それどころかそのかさばった滑稽な形からして、音を立てる道具の中に比ぶものがない。聞いたところでは太鼓にはロバの皮を張るそうだが、それが本当なら、なんと絵になる皮肉ではないか！　このよく耐え忍ぶ動物の背は、生前リヨンの行商人に、また思い上がったヘブライの預言者に、さんざん打たれてなお打たれ足りないかのように、死んでから哀れな尻から皮を剝がれ、太鼓に張られ、ヨーロッパの駐屯地という駐屯地の通りじゅうを、夜ごとぶたれねばならない。アルマやシュピッヘルンの高地を駆け上がる時も、死神が赤旗をひるがえし、大砲を自分の太鼓にして猛烈に打ち鳴らすところならどこでも、若い鼓手は蒼白な顔で、倒れた戦友をまたいで道を急ぎながら、おとなしいロバの腰から取ったこのひと切れの皮をぶちのめし、ひっぱたかねばならないのだ。"
    "translation_status": "reviewed"
  - "id": "voy-188"
    "section_id": "ch-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Generally a man is never more uselessly employed than when he is at this trick of bastinadoing asses’ hide. We know what effect it has in life, and how your dull ass will not mend his pace with beating. But in this state of mummy and melancholy survival of itself, when the hollow skin reverberates to the drummer’s wrist, and each dub-a-dub goes direct to a man’s heart, and puts madness there, and that disposition of the pulses which we, in our big way of talking, nickname Heroism:—is there not something in the nature of a revenge upon the donkey’s persecutors? Of old, he might say, you drubbed me up hill and down dale, and I must endure; but now that I am dead, those dull thwacks that were scarcely audible in country lanes, have become stirring music in front of the brigade; and for every blow that you lay on my old greatcoat, you will see a comrade stumble and fall."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 188
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[125]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-188"
    "translation_ja": "概して、こうやってロバの皮を打ちすえるほど、人のしていることが役に立たない例もない。生きているうちならどんな効き目があるかはわかっている。鈍いロバはいくらぶたれても歩みを速めはしない。しかしミイラになって、わびしくも昔の自分の名残となったこの身で、うつろな皮が鼓手の手首に応えて響き、どんどこの一つ一つがまっすぐ人間の心臓に行き、そこに狂気を吹きこみ、われわれが大げさな言い方で「英雄的精神」と呼ぶ脈拍の調子を吹きこむとき、これにはロバを虐げた者への復讐に似たところがないだろうか。昔は、とロバは言うかもしれない、おまえたちは山を登るにも谷を下るにもおれをたたき、おれは耐えるしかなかった。だがいまおれが死んでみると、田舎道ではかすかにしか聞こえなかった鈍い打撃が、旅団の先頭で心をかき立てる音楽になった。そしてこの古外套に一打を加えるごとに、おまえは仲間が一人よろけて倒れるのを見るだろう。"
    "translation_status": "reviewed"
  - "id": "voy-189"
    "section_id": "ch-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Not long after the drums had passed the café, the Cigarette and the Arethusa began to grow sleepy, and set out for the hotel, which was only a door or two away. But although we had been somewhat indifferent to Landrecies, Landrecies had not been indifferent to us. All day, we learned, people had been running out between the squalls to visit our two boats. Hundreds of persons, so said report, although it fitted ill with our idea of the town—hundreds of persons had inspected them where they lay in a coal-shed. We were becoming lions in Landrecies, who had been only pedlars the night before in Pont."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 189
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[126]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-189"
    "translation_ja": "太鼓がカフェの前を通り過ぎていくらもたたず、シガレット号とアレシューザ号の主はそろって眠くなり、わずか一、二軒先のホテルへ向かった。だがわれわれはランドルシーにいささか無関心でも、ランドルシーはわれわれに無関心ではなかった。その日じゅう、人々は突風の合間に駆け出しては二艘の舟を見に行ったと聞いた。何百人もの人が、と噂は伝えた。この町についてのわれわれの印象とは合わないが、とにかく何百人もが、石炭小屋に置いてあるカヌーを見物したという。前の晩にはポンでただの行商人だったわれわれは、ランドルシーの名士になりつつあった。"
    "translation_status": "reviewed"

  - "id": "voy-360"
    "section_id": "ch-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This frame of mind was the great exploit of our voyage, take it all in all. It was the farthest piece of travel accomplished. Indeed, it lies so far from beaten paths of language, that I despair of getting the reader into sympathy with the smiling, complacent idiocy of my condition; when ideas came and went like motes in a sunbeam; when trees and church spires along the bank surged up, from time to time into my notice, like solid objects through a rolling cloudland; when the rhythmical swish of boat and paddle in the water became a cradle-song to lull my thoughts asleep; when a piece of mud on the deck was sometimes an intolerable eyesore, and sometimes quite a companion for me, and the object of pleased consideration;—and all the time, with the river running and the shores changing upon either hand, I kept counting my strokes and forgetting the hundreds, the happiest animal in France."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 360
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[284]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-360"
    "translation_ja": "ぜんたいを見渡すと、この心境こそ旅の大殊勲だった。最も遠くへ達した旅の一里塚だった。じっさいそれは言葉の踏み固めた道から遠く離れているので、私の境地のにこにこと満足しきった阿呆ぶりに読者を共鳴させようとは望みを失う。陽の筋にまうほこりのように観念が来ては去る。岸の木々と教会の尖塔が雲の国のうねりを貫く固体のように、ときおり私の注意の表にわき上がる。水をゆく舟と櫂の規則正しいさやぎが揺り籠の歌になって私の思いを寝かしつける。甲板のひとかけの泥が、あるときは耐えがたい目障りで、あるときはじつにいい連れで、楽しい考察の対象になる。その間じゅう、川は走り両側に岸は移り変わり、私はひとかきずつ数えては何百だったかを忘れる、フランスでいちばんしあわせな動物だった。"
    "translation_status": "reviewed"

  - "id": "voy-270"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The ruddy Northman told some tales of his own prowess in keeping order: notably one of a Marquis."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 270
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[202]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-270"
    "translation_ja": "赤ら顔の北国人は秩序を保つため発揮したみずからの武勇をいくつか語った。なかでも侯爵の話があった。"
    "translation_status": "reviewed"
  - "id": "voy-271"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Marquis,’ I said, ‘if you take another step I fire upon you. You have committed a dirtiness, Marquis.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 271
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[203]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-271"
    "translation_ja": "「『侯爵』と私は言ってやったんです。『もう一歩お進みになったら、あなたを撃ちますよ。汚いまねをなさった、侯爵』」"
    "translation_status": "reviewed"
  - "id": "voy-272"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Whereupon, it appeared, the Marquis touched his cap and withdrew."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 272
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[204]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-272"
    "translation_ja": "そこで侯爵は帽子に手をやって引きさがった、と聞くところではそうだった。"
    "translation_status": "reviewed"
  - "id": "voy-273"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The landlord applauded noisily. ‘It was well done,’ he said. ‘He did all that he could. He admitted he was wrong.’ And then oath upon oath. He was no marquis-lover either, but he had a sense of justice in him, this proletarian host of ours."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 273
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[205]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-273"
    "translation_ja": "宿の夫は騒々しく拍手した。「立派なもんだ」と言った。「あの侯爵は自分にできることをやった。間違っていたと認めたのだ」。それから罵言の上にまた罵言。このプロレタリアの宿の主人だって、侯爵好きではなかったが、胸には公正の感覚があった。"
    "translation_status": "reviewed"
  - "id": "voy-274"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "From the matter of hunting, the talk veered into a general comparison of Paris and the country. The proletarian beat the table like a drum in praise of Paris. ‘What is Paris? Paris is the cream of France. There are no Parisians: it is you and I and everybody who are Parisians. A man has eighty chances per cent. to get on in the world in Paris.’ And he drew a vivid sketch of the workman in a den no bigger than a dog-hutch, making articles that were to go all over the world. ‘Eh bien, quoi, c’est magnifique, ca!’ cried he."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 274
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[206]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-274"
    "translation_ja": "猟の話から、パリと田舎の全般的な比較に風が変わった。プロレタリア氏はパリをほめて食卓を太鼓のように打った。「パリとは何だ？　パリはフランスの精髄だ。パリ人なんていやしない。あなたも私も、誰も彼もがパリ人だ。パリで人が世に出る見込みは、百のうち八十ある」。そして、犬小屋ほどの広さしかない穴蔵で、世界じゅうへ行き渡る品を作る職人を、生き生きと描き出した。「ええどうです、そいつはすばらしいじゃありませんか！」と叫んだ。"
    "translation_status": "reviewed"

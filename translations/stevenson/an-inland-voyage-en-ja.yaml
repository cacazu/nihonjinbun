          "exact": "barguettes"
  - "id": "voy-219"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We had a shower or two, but light and flying. The air was clean and sweet among all these green fields and green things growing. There was not a touch of autumn in the weather. And when, at Vadencourt, we launched from a little lawn opposite a mill, the sun broke forth and set all the leaves shining in the valley of the Oise."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 219
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[154]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-219"
    "translation_ja": "一、二度にわか雨に遭ったが、軽く、さっと過ぎた。緑の畑と緑に伸びるあらゆるもののあいだで、空気は澄んで甘かった。空模様には秋の気配ひとつなかった。ヴァダンクールで、水車の向かいの小さな芝生から漕ぎ出すと、日が射してオワーズの谷じゅうの葉に光をともした。"
    "translation_status": "reviewed"
  - "id": "voy-220"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The river was swollen with the long rains. From Vadencourt all the way to Origny, it ran with ever-quickening speed, taking fresh heart at each mile, and racing as though it already smelt the sea. The water was yellow and turbulent, swung with an angry eddy among half-submerged willows, and made an angry clatter along stony shores. The course kept turning and turning in a narrow and well-timbered valley. Now the river would approach the side, and run griding along the chalky base of the hill, and show us a few open colza-fields among the trees. Now it would skirt the garden-walls of houses, where we might catch a glimpse through a doorway, and see a priest pacing in the chequered sunlight. Again, the foliage closed so thickly in front, that there seemed to be no issue; only a thicket of willows, overtopped by elms and poplars, under which the river ran flush and fleet, and where a kingfisher flew past like a piece of the blue sky. On these different manifestations the sun poured its clear and catholic looks. The shadows lay as solid on the swift surface of the stream as on the stable meadows. The light sparkled golden in the dancing poplar leaves, and brought the hills into communion with our eyes. And all the while the river never stopped running or took breath; and the reeds along the whole valley stood shivering from top to toe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 220
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[155]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-220"
    "translation_ja": "長雨で川はふくれ上がっていた。ヴァダンクールからオリニーまで、行けば行くほど流れは速さを増し、一マイルごとに新たな気力を得て、もう海のにおいを嗅いだかのように駆けた。水は黄ばんで荒れ、半ば沈んだ柳の間を怒れる渦となって旋回し、石ころの岸辺に怒った物音を立てた。狭く木の茂った谷を、流路は何度も何度も折れた。川が谷の端に寄るときは、丘の白亜質の裾をこするように走り、木々の間に開けた菜種畑がいくつか見えた。人家の庭塀をかすめるときには、くぐり戸越しに、まだらな日差しの中を歩く司祭がちらりと見えることもあった。またあるときは前方の葉があまりにみっしりと閉ざし、出口などないように見えた。ただ柳の藪にニレやポプラが高くかぶさり、その下を川が岸いっぱいに速く流れ、青空の切れ端のようにカワセミが飛んで行った。こうしたさまざまなあらわれの上に、日は澄んだまなざしを分け隔てなく注いだ。速く流れる水面にも影は動かぬ牧草地の上と同じほどしっかり寝そべっていた。光は踊るポプラの葉で金色にきらめき、丘々とわれわれの目とを親しく結んだ。しかもそのあいだじゅう、川は走るのをやめもせず、ひと息つきもせず、谷一帯の葦は頭の先から足の先まで震えながら立っていた。"
    "translation_status": "reviewed"
  - "id": "voy-221"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There should be some myth (but if there is, I know it not) founded on the shivering of the reeds. There are not many things in nature more striking to man’s eye. It is such an eloquent pantomime of terror; and to see such a number of terrified creatures taking sanctuary in every nook along the shore, is enough to infect a silly human with alarm. Perhaps they are only a-cold, and no wonder, standing waist-deep in the stream. Or perhaps they have never got accustomed to the speed and fury of the river’s flux, or the miracle of its continuous body. Pan once played upon their forefathers; and so, by the hands of his river, he still plays upon these later generations down all the valley of the Oise; and plays the same air, both sweet and shrill, to tell us of the beauty and the terror of the world."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 221
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[156]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-221"
    "translation_ja": "葦の身震いから生まれた神話が何かあるべきだ（あるとしても私は知らない）。人の目にこれ以上強い印象を与えるものは、自然界にもそう多くない。あれはなんと雄弁な恐怖の無言劇だろう。恐れた生き物がこれほど多数、岸べの隅々に逃げ込んでいるのを見ると、愚かしい人の子にまで不安がうつる。たぶん単に寒いだけかもしれない。川に腰までつかって立てば不思議はない。あるいはいまだに川の流れの速さと激しさに、絶えず一つにつづくその体の不思議に、慣れていないのか。パン神はその昔、彼らの祖先を笛にして吹いた。それゆえ今も、みずからの川の手を借りて、オワーズの谷じゅうで後代の葦を鳴らすのだ。甘くまた甲高い同じ調べを奏でて、世界の美しさと恐ろしさをわれわれに語ってきかせる。"
    "translation_status": "reviewed"
  - "id": "voy-222"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The canoe was like a leaf in the current. It took it up and shook it, and carried it masterfully away, like a Centaur carrying off a nymph. To keep some command on our direction required hard and diligent plying of the paddle. The river was in such a hurry for the sea! Every drop of water ran in a panic, like as many people in a frightened crowd. But what crowd was ever so numerous, or so single-minded? All the objects of sight went by at a dance measure; the eyesight raced with the racing river; the exigencies of every moment kept the pegs screwed so tight, that our being quivered like a well-tuned instrument; and the blood shook off its lethargy, and trotted through all the highways and byways of the veins and arteries, and in and out of the heart, as if circulation were but a holiday journey, and not the daily moil of threescore years and ten. The reeds might nod their heads in warning, and with tremulous gestures tell how the river was as cruel as it was strong and cold, and how death lurked in the eddy underneath the willows. But the reeds had to stand where they were; and those who stand still are always timid advisers. As for us, we could have shouted aloud. If this lively and beautiful river were, indeed, a thing of death’s contrivance, the old ashen rogue had famously outwitted himself with us. I was living three to the minute. I was scoring points against him every stroke of my paddle, every turn of the stream. I have rarely had better profit of my life."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 222
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[157]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-222"
    "translation_ja": "流れの中のカヌーは一枚の葉だった。流れはそれを手に取り、揺すり、ケンタウロスがニンフをさらうように力ずくで運び去った。いくらかなりと進行方向を思い通りにするには、力強く根気よく櫂を使わねばならなかった。川はあれほど海へと急いでいた！　どの水滴も、怯えた群衆の一人ひとりのように、われ先にと逃げ走った。だがどんな群衆がこれほど数多く、これほど一致して一事に向かうだろう。目にするものは残らず舞曲の拍子で過ぎ、目は駆ける川と競って駆けた。一瞬一瞬の必要に糸巻きを強く締められ、われわれの全身は音を正しく合わせた楽器のように震えた。血は眠気を払い、動脈静脈の大通りにも小路にも、心臓を出ても入っても、軽やかに速歩した。まるで循環とは七十年間日々の苦役ではなく、休日の遊山ででもあるかのようだった。葦は頭を振って戒め、震える身ぶりで川が強く冷たいのと同じだけ残酷であること、柳の下の渦に死が潜むことを語るといい。だが葦はその場に立ちつくすしかない。動かずにいる者が助言すればいつも臆病なものだ。われわれはといえば、声を放って叫べそうだった。これほど生き生きと美しい川がほんとうに死神の考案品なら、あの灰色の老悪党はわれわれに限っては、みごと自分の策におぼれたのだ。私は一分に三分ぶん生きていた。櫂をひとかきするたび、流れがひと折れするたびに、やつを相手に点を稼いだ。わが人生をこれよりよく使えたためしは、めったにない。"
    "translation_status": "reviewed"
  - "id": "voy-223"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For I think we may look upon our little private war with death somewhat in this light. If a man knows he will sooner or later be robbed upon a journey, he will have a bottle of the best in every inn, and look upon all his extravagances as so much gained upon the thieves. And above all, where instead of simply spending, he makes a profitable investment for some of his money, when it will be out of risk of loss. So every bit of brisk living, and above all when it is healthful, is just so much gained upon the wholesale filcher, death. We shall have the less in our pockets, the more in our stomach, when he cries stand and deliver. A swift stream is a favourite artifice of his, and one that brings him in a comfortable thing per annum; but when he and I come to settle our accounts, I shall whistle in his face for these hours upon the upper Oise."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 223
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[158]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-223"
    "translation_ja": "というのは死とわれわれの私的な小戦争は、こんなふうに考えられると思うからだ。旅のどこかで遅かれ早かれ追い剝ぎに遭うとわかっていたら、人はどの宿でも上等の酒を一本取って、贅沢した費用はそれだけ盗賊に勝った分と勘定するだろう。それがただの散財ではなく、金の一部を有利に投じて、もう失う心配のないところへ移すのなら、なおのことである。だから生命をきびきび使った分はことごとく、とりわけそれが健やかな場合には、すべてを盗み去る死に勝った分なのだ。奴が「止まれ、金を出せ」と叫ぶ時には、こちらのポケットの中は少なく、そのぶん腹の中は豊かだ。急流は奴の好む手口の一つで、毎年相当の実入りをもたらす。だが奴と私が帳尻を合わせるときには、オワーズ上流のこの数時間のおかげで、面と向かって口笛を吹いてやろう。"
    "translation_status": "reviewed"
  - "id": "voy-224"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Towards afternoon we got fairly drunken with the sunshine and the exhilaration of the pace. We could no longer contain ourselves and our content. The canoes were too small for us; we must be out and stretch ourselves on shore. And so in a green meadow we bestowed our limbs on the grass, and smoked deifying tobacco and proclaimed the world excellent. It was the last good hour of the day, and I dwell upon it with extreme complacency."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 224
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[159]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-224"
    "translation_ja": "午後になるころには日の光と速さの興奮に、すっかり酔っていた。自分のからだもその満ち足りた気持ちも、中に収めておけなかった。カヌーがわれわれには小さすぎた。外へ出て岸で手足を伸ばさずにいられない。そこで緑の牧草地で四肢を芝に預け、人を神にひき上げる煙草を吸い、世界はすばらしいと言い渡した。その日に残された最後のよいひとときだったから、私はこの記憶にこの上なく満足して長居する。"
    "translation_status": "reviewed"
  - "id": "voy-225"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On one side of the valley, high up on the chalky summit of the hill, a ploughman with his team appeared and disappeared at regular intervals. At each revelation he stood still for a few seconds against the sky: for all the world (as the Cigarette declared) like a toy Burns who should have just ploughed up the Mountain Daisy. He was the only living thing within view, unless we are to count the river."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 225
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[160]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-225"
    "translation_ja": "谷の片側、丘の白亜の頂の高いところで、犂を引く家畜を連れた耕作者が等しい間隔で見え隠れした。現れるたび、数秒間空を背にしてぴたりととまった。その姿は（シガレット号の主の断言したとおり）「山のデイジー」を犂で掘り返したばかりの、玩具の詩人バーンズそっくりだった。川を勘定に入れないなら、視界の中の唯一の生き物はこの男だった。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 237
          "end": 246
          "exact": "Cigarette"
  - "id": "voy-226"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On the other side of the valley a group of red roofs and a belfry showed among the foliage. Thence some inspired bell-ringer made the afternoon musical on a chime of bells. There was something very sweet and taking in the air he played; and we thought we had never heard bells speak so intelligibly, or sing so melodiously, as these. It must have been to some such measure that the spinners and the young maids sang, ‘Come away, Death,’ in the Shakespearian Illyria. There is so often a threatening note, something blatant and metallic, in the voice of bells, that I believe we have fully more pain than pleasure from hearing them; but these, as they sounded abroad, now high, now low, now with a plaintive cadence that caught the ear like the burthen of a popular song, were always moderate and tunable, and seemed to fall in with the spirit of still, rustic places, like the noise of a waterfall or the babble of a rookery in spring. I could have asked the bell-ringer for his blessing, good, sedate old man, who swung the rope so gently to the time of his meditations. I could have blessed the priest or the heritors, or whoever may be concerned with such affairs in France, who had left these sweet old bells to gladden the afternoon, and not held meetings, and made collections, and had their names repeatedly printed in the local paper, to rig up a peal of brand-new, brazen, Birmingham-hearted substitutes, who should bombard their sides to the provocation of a brand-new bell-ringer, and fill the echoes of the valley with terror and riot."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 226
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[161]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-226"
    "translation_ja": "谷のもう一方には木の葉の間に赤い屋根が集まり、鐘楼が一つのぞいていた。そこから天分ある鐘つきが、組鐘を鳴らして午後を音楽で満たした。その曲にはひどく甘く人を捉えるところがあった。これほど明瞭に話し、これほど調べよく歌う鐘は聞いたことがないと二人で思った。シェイクスピアのイリリアで、糸を紡ぐ女や若い娘が「来ませ、死よ」と歌ったのはこんな拍子にちがいない。鐘の声には、これみよがしな金属音、脅しめいた響きがしばしばあって、われわれはそれを聞いて喜ぶよりもたしかにいっそうつらい思いをする、と私は思う。けれどもこの鐘はいま高く、いま低く、時にははやり歌の繰り返し句のように耳をとらえる哀調を帯びて遠く鳴りわたり、つねにつつましく、音楽的だった。滝の音や春のミヤマガラスの群れのさざめきのように、静かな田舎の心と合っていた。私は鐘つきに祝福を願いたかった。思索の歩調に合わせ、あれほどやさしく綱を引いた、実直で落ち着いた老人よ。また、司祭なり教区の地主なり、フランスでその手のことにかかわる誰であれ、この甘い古鐘を残して午後を喜ばせてくれた人を、祝福してやりたいと思った。会合を開き、金を集め、地方紙に何度も自分の名を載せ、新任の鐘つきにけしかけられて互いの胴をやかましく打ち、谷のこだまを恐怖と騒乱に満たすような、バーミンガム製の心臓をもつ厚顔な真鍮の新品の組鐘など吊らなかった人を。"
    "translation_status": "reviewed"
  - "id": "voy-227"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At last the bells ceased, and with their note the sun withdrew. The piece was at an end; shadow and silence possessed the valley of the Oise. We took to the paddle with glad hearts, like people who have sat out a noble performance and returned to work. The river was more dangerous here; it ran swifter, the eddies were more sudden and violent. All the way down we had had our fill of difficulties. Sometimes it was a weir which could be shot, sometimes one so shallow and full of stakes that we must withdraw the boats from the water and carry them round. But the chief sort of obstacle was a consequence of the late high winds. Every two or three hundred yards a tree had fallen across the river, and usually involved more than another in its fall."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 227
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[162]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-227"
    "translation_ja": "やがて鐘はやみ、その音とともに太陽も引いた。一曲は終わり、影と静寂がオワーズの谷を領した。すぐれた演奏を最後まで聞いて仕事に戻る人たちのように、われわれは喜んで櫂を取った。川はこのあたり一段と危険だった。速さを増し、より不意をつく激しい渦があった。下り道はそれまでも難所に事欠かなかった。あるときは勢いで越せる堰、あるときは浅くて杭だらけで、水から舟を上げて担いで回らねばならぬ堰があった。だが最大の障害は、先ごろの強風のもたらしたものだった。二、三百ヤードごとに一本川を横切って木が倒れ、大概は一本ならずほかの木も巻き添えにしていた。"
    "translation_status": "reviewed"
  - "id": "voy-228"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Often there was free water at the end, and we could steer round the leafy promontory and hear the water sucking and bubbling among the twigs. Often, again, when the tree reached from bank to bank, there was room, by lying close, to shoot through underneath, canoe and all. Sometimes it was necessary to get out upon the trunk itself and pull the boats across; and sometimes, when the stream was too impetuous for this, there was nothing for it but to land and ‘carry over.’ This made a fine series of accidents in the day’s career, and kept us aware of ourselves."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 228
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[163]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-228"
    "translation_ja": "その端に水の空いたところがあって、葉の茂る岬をぐるりと回り、小枝のあいだで水が吸い込まれ泡を立てるのを聞けることは多かった。また木が両岸に届いていても、体をぴたりと伏せればカヌーごと下をくぐり抜ける余地があることも多かった。時には幹の上に降り立ち、舟を引きずり越さねばならなかった。また時には流れが急すぎて、上陸して「担ぎ越す」しかなかった。こうしてその日の行程には愉快な変事があとからあとから起こり、われわれは身を入れていなければならなかった。"
    "translation_status": "reviewed"
  - "id": "voy-229"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Shortly after our re-embarkation, while I was leading by a long way, and still full of a noble, exulting spirit in honour of the sun, the swift pace, and the church bells, the river made one of its leonine pounces round a corner, and I was aware of another fallen tree within a stone-cast. I had my backboard down in a trice, and aimed for a place where the trunk seemed high enough above the water, and the branches not too thick to let me slip below. When a man has just vowed eternal brotherhood with the universe, he is not in a temper to take great determinations coolly, and this, which might have been a very important determination for me, had not been taken under a happy star. The tree caught me about the chest, and while I was yet struggling to make less of myself and get through, the river took the matter out of my hands, and bereaved me of my boat. The Arethusa swung round broadside on, leaned over, ejected so much of me as still remained on board, and thus disencumbered, whipped under the tree, righted, and went merrily away down stream."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 229
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[164]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-229"
    "translation_ja": "再び漕ぎ出して間もなく、私ははるか先頭を行き、太陽と、快走と、教会の鐘をたたえる高揚で胸がまだいっぱいだった。川が獅子さながら角を回って躍りかかり、気づくと石を投げて届くほど先にまた倒木があった。私はたちまち背もたれ板を倒し、幹が水面から十分高く、枝もさほど込み合わず下をくぐれそうに見えるところに狙いをつけた。宇宙と永遠に兄弟であろうと誓ったばかりの人間は、重大な決断を冷静に下せる気分にはない。私にとってひどく重大となったかもしれぬこの決断にも、幸運の星は照っていなかった。木が私を胸あたりで捕らえた。体をもっと小さくして通り抜けようとまだもがいているうち、川は私の手から始末を取り上げ、わが舟を奪い去った。アレシューザ号はぐるりと横腹を向け、傾き、まだ舟に残っていた私の一部を放り出し、そうして身軽になると木の下をさっとくぐり、姿勢を戻して楽しげに下流へ行った。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 869
          "end": 877
          "exact": "Arethusa"
  - "id": "voy-230"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I do not know how long it was before I scrambled on to the tree to which I was left clinging, but it was longer than I cared about. My thoughts were of a grave and almost sombre character, but I still clung to my paddle. The stream ran away with my heels as fast as I could pull up my shoulders, and I seemed, by the weight, to have all the water of the Oise in my trousers-pockets. You can never know, till you try it, what a dead pull a river makes against a man. Death himself had me by the heels, for this was his last ambuscado, and he must now join personally in the fray. And still I held to my paddle. At last I dragged myself on to my stomach on the trunk, and lay there a breathless sop, with a mingled sense of humour and injustice. A poor figure I must have presented to Burns upon the hill-top with his team. But there was the paddle in my hand. On my tomb, if ever I have one, I mean to get these words inscribed: ‘He clung to his paddle.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 230
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[165]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-230"
    "translation_ja": "取り残されてしがみついた木に這い上がるまで、どのくらいかかったか知らない。願ったより長かったのは確かだ。頭を去来する思いは深刻で憂鬱に近かったが、それでも私は櫂を離さなかった。肩を引き上げるそばから流れはかかとをさらい、その重みからするとズボンのポケットにオワーズの水が残らず入っているようだった。人を引く川の容赦のない力は、経験しなければわからない。ほかならぬ死神が私のかかとをつかんだ。これが最後の待ち伏せであったから、今やみずから戦いに加わらねばならなかったのだ。それでも私は櫂にしがみついた。ついに幹の上に腹ばいになるまで体を引き上げ、息を切らし水を吸ったぼろきれのようになって、妙におかしく、また理不尽だと感じながら横たわった。家畜をつれた丘の上のバーンズにはさぞ情けない姿に見えたことだろう。だが私の手には櫂があった。もしいつか墓を持つなら、私はこの言葉を刻んでもらうつもりだ。「この男、櫂を離さざりき」。"
    "translation_status": "reviewed"
  - "id": "voy-231"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The Cigarette had gone past a while before; for, as I might have observed, if I had been a little less pleased with the universe at the moment, there was a clear way round the tree-top at the farther side. He had offered his services to haul me out, but as I was then already on my elbows, I had declined, and sent him down stream after the truant Arethusa. The stream was too rapid for a man to mount with one canoe, let alone two, upon his hands. So I crawled along the trunk to shore, and proceeded down the meadows by the river-side. I was so cold that my heart was sore. I had now an idea of my own why the reeds so bitterly shivered. I could have given any of them a lesson. The Cigarette remarked facetiously that he thought I was ‘taking exercise’ as I drew near, until he made out for certain that I was only twittering with cold. I had a rub down with a towel, and donned a dry suit from the india-rubber bag. But I was not my own man again for the rest of the voyage. I had a queasy sense that I wore my last dry clothes upon my body. The struggle had tired me; and perhaps, whether I knew it or not, I was a little dashed in spirit. The devouring element in the universe had leaped out against me, in this green valley quickened by a running stream. The bells were all very pretty in their way, but I had heard some of the hollow notes of Pan’s music. Would the wicked river drag me down by the heels, indeed? and look so beautiful all the time? Nature’s good-humour was only skin-deep after all."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 231
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[166]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-231"
    "translation_ja": "その少し前、シガレット号の主は通り過ぎていた。かの時私がもう少しばかり宇宙にご満悦でなかったらわかったはずだが、むこう側には梢を回るまっさらな通り道があったのだ。彼は私を引き上げようと申し出たが、もう肘の上まで体を持ち上げていたので断り、逃げたアレシューザ号を追って下流へやった。流れは速すぎて、人ひとりにカヌー二艘はおろか一艘でも手にして遡るのは無理だった。それで私は幹を這って岸へ出て、川ぞいの草地を下った。寒さで胸が痛んだ。葦がなぜひどく震えるのか、私なりの考えが今やできた。あの連中一人残らずにお手本を見せてやれたろう。シガレット号の主は私が近づくのを見て、寒さでぶるぶるしているだけだとはっきり見て取るまでは、私が「体操中」かと思ったと軽口を言った。私はタオルで体をこすり、ゴム引き袋から出した乾いた服に着替えた。だがこの船旅が終わるまで、もう本調子には戻らなかった。いま身に着けたのが最後の乾いた服だと思うと腹の底が落ち着かなかった。格闘には疲れていたし、意識していたかどうかは別にして、少し気勢をそがれたかもしれぬ。流れる川が命を吹き込むこの緑の谷で、宇宙のものを貪り食う性分が私に飛びかかってきたのだ。なるほど鐘はそれなりにたいへん美しかったが、私はパン神の音楽のうつろな音をいくつか聞いてしまった。あの性悪な川はほんとうに私のかかとをつかんで引きずりこむ気だったのか。そしてその間じゅうあんなに美しい顔をしているのか。結局、自然の上機嫌は上っ皮一枚のものにすぎなかったのだ。"
    "translation_status": "reviewed"

  - "id": "voy-155"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I suppose it was about half-past eight when this worthy, Monsieur Hector Gilliard of Maubeuge, turned up at the ale-house door in a tilt cart drawn by a donkey, and cried cheerily on the inhabitants. He was a lean, nervous flibbertigibbet of a man, with something the look of an actor, and something the look of a horse-jockey. He had evidently prospered without any of the favours of education; for he adhered with stern simplicity to the masculine gender, and in the course of the evening passed off some fancy futures in a very florid style of architecture. With him came his wife, a comely young woman with her hair tied in a yellow kerchief, and their son, a little fellow of four, in a blouse and military képi. It was notable that the child was many degrees better dressed than either of the parents. We were informed he was already at a boarding-school; but the holidays having just commenced, he was off to spend them with his parents on a cruise. An enchanting holiday occupation, was it not? to travel all day with father and mother in the tilt cart full of countless treasures; the green country rattling by on either side, and the children in all the villages contemplating him with envy and wonder? It is better fun, during the holidays, to be the son of a travelling merchant, than son and heir to the greatest cotton-spinner in creation. And as for being a reigning prince—indeed I never saw one if it was not Master Gilliard!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 155
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[94]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-155"
    "translation_ja": "この立派な人物、モブージュのムシュー・エクトール・ジリアールが、ロバの引く幌つき荷車で居酒屋の表に乗りつけ、朗らかな声で中の人たちを呼んだのは、八時半ごろだったと思う。やせて神経のよく動く、そわそわした男で、どことなく役者にも、どことなく競馬の騎手にも似ていた。教育の恩恵には何一つ浴さずに成功をおさめたのは明らかだった。なにしろ潔いほどあらゆる名詞を男性扱いにし、その晩のうちには、装飾の凝りに凝った建築美を誇る独創的な未来形までいくつかご披露に及んだからである。一緒に来たのは、髪に黄色い布を結んだ器量よしの若い妻と、仕事着風の上っ張りに軍帽をかぶった四歳の息子だった。子供のほうが両親のどちらよりも何段もよい服を着ているのが目を引いた。すでに寄宿学校に入っているが、ちょうど休みが始まったので両親と巡航の旅に出たと聞かされた。休暇の過ごし方として、なんとすてきだろう！　数えきれない宝を満載した幌馬車に乗って、終日お父さんお母さんとともに行く。緑の田野は、がたごと揺れる荷車の左右を流れ過ぎ、村々の子供たちは羨望と驚嘆をこめて自分を見るのだ。休暇のあいだは、天下一の綿紡績業者の跡取り息子でいるより、旅まわりの商人の息子でいるほうがよほど愉快だ。それに王座に着く君主というが、ジリアール家のお坊ちゃんがそうでなかったら、私はいまだ君主を見たことがない！"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"

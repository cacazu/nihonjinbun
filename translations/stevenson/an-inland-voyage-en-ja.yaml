          "exact": "Cigarette"
  - "id": "voy-307"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Meantime the heaven wept upon our heads; and the windows grew brighter as the night increased in darkness. We trudged in and out of La Fère streets; we saw shops, and private houses where people were copiously dining; we saw stables where carters’ nags had plenty of fodder and clean straw; we saw no end of reservists, who were very sorry for themselves this wet night, I doubt not, and yearned for their country homes; but had they not each man his place in La Fère barracks? And we, what had we?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 307
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[236]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-307"
    "translation_ja": "その間、天はわれらの頭上に涙を注ぎ、夜の闇が深まるほど窓は明るさを増した。ラ・フェールの通りを出たり入ったり、とぼとぼ歩いた。店があり、人々がたっぷり夕食を取っている家々があった。荷馬車引きの馬には秣もきれいな藁もふんだんにある厩があった。予備役兵が果てしなくいた。こんな雨の夜はきっとみずからをあわれみ、田舎のわが家が恋しかったろう。だが彼らには一人ずつ、ラ・フェールの兵舎に場所があるではないか。われわれには、いったい何があった？"
    "translation_status": "reviewed"
  - "id": "voy-308"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There seemed to be no other inn in the whole town. People gave us directions, which we followed as best we could, generally with the effect of bringing us out again upon the scene of our disgrace. We were very sad people indeed by the time we had gone all over La Fère; and the Cigarette had already made up his mind to lie under a poplar and sup off a loaf of bread. But right at the other end, the house next the town-gate was full of light and bustle. ‘Bazin, aubergiste, loge à pied,’ was the sign. ‘À la Croix de Malte.’ There were we received."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 308
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[237]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-308"
    "translation_ja": "町じゅうにほかの宿はないようだった。人に道を尋ねてはなるべくそのとおりに行ったが、たいていはまた不面目を被った現場に出る効果しかなかった。ラ・フェールじゅうを歩き尽くすころには、われわれはじつに悲しい人間になっていた。シガレット号の主はもうポプラの下に寝てパンひとかたまりを夕食にする覚悟を決めた。だがまさに町の反対のはずれ、町門の隣の家が明かりと活気にあふれていた。看板には「宿屋バザン、徒歩客を泊む」。「マルタ十字亭」。そこでわれわれは迎えられた。"
    "translation_status": "reviewed"

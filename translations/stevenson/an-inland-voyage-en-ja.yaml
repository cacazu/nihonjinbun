  - "id": "voy-235"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The next day was Sunday, and the church bells had little rest; indeed, I do not think I remember anywhere else so great a choice of services as were here offered to the devout. And while the bells made merry in the sunshine, all the world with his dog was out shooting among the beets and colza."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 235
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[168]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-235"
    "translation_ja": "翌日は日曜日で、教会の鐘にはほとんど暇がなかった。じつのところ信心深い者がこの土地ほど数多くの礼拝から選べたところを、ほかに覚えていない。そうして鐘が陽光の中ではしゃいでいるあいだ、世の人々は誰も彼も犬を連れ、甜菜と菜種の畑へ猟に出ていた。"
    "translation_status": "reviewed"

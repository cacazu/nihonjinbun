    "translation_ja": "オワーズ川を下り黄金の谷を抜けて"
    "translation_status": "reviewed"
  - "id": "voy-315"
    "section_id": "ch-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Below La Fère the river runs through a piece of open pastoral country; green, opulent, loved by breeders; called the Golden Valley. In wide sweeps, and with a swift and equable gallop, the ceaseless stream of water visits and makes green the fields. Kine, and horses, and little humorous donkeys, browse together in the meadows, and come down in troops to the river-side to drink. They make a strange feature in the landscape; above all when they are startled, and you see them galloping to and fro with their incongruous forms and faces. It gives a feeling as of great, unfenced pampas, and the herds of wandering nations. There were hills in the distance upon either hand; and on one side, the river sometimes bordered on the wooded spurs of Coucy and St. Gobain."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 315
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[243]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-315"
    "translation_ja": "ラ・フェールから下流へ、川は開けた牧畜地帯を走る。緑豊かで実り多く、家畜を育てる者に愛され、「黄金の谷」と呼ばれるところだ。絶え間ない水流は大きく広い弧を描き、速くむらのない駆け足で野を訪れ、緑にする。牛と馬と愛嬌のある小さなロバが一緒に牧場の草をはみ、群れをなして岸へ水を飲みにくる。景色の中でこれは風変わりな見ものになる。とくに驚いて、てんでばらばらの姿かたちであちこち駆け回るのを見る時がそうだ。囲いのない広大なパンパスと、遊牧する民族の家畜の群れを思わせる。遠くの両側に丘があり、一方では川は時にクーシーとサン＝ゴバンの樹木の茂った支脈に接した。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 5
          "exact": "Below"
  - "id": "voy-316"
    "section_id": "ch-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The artillery were practising at La Fère; and soon the cannon of heaven joined in that loud play. Two continents of cloud met and exchanged salvos overhead; while all round the horizon we could see sunshine and clear air upon the hills. What with the guns and the thunder, the herds were all frightened in the Golden Valley. We could see them tossing their heads, and running to and fro in timorous indecision; and when they had made up their minds, and the donkey followed the horse, and the cow was after the donkey, we could hear their hooves thundering abroad over the meadows. It had a martial sound, like cavalry charges. And altogether, as far as the ears are concerned, we had a very rousing battle-piece performed for our amusement."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 316
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[244]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-316"
    "translation_ja": "ラ・フェールでは砲兵が演習中で、ほどなく天上の大砲までそのやかましい遊びに加わった。雲の大陸が二つ頭上で出会い、斉射を交わし合った。ところが地平線のぐるりには、丘の上に日が照って空気が澄んでいるのが見えた。砲声と雷で黄金の谷の群れは残らず怯えた。首を振り上げ、臆して決めかね、あちらこちら走るのが見えた。やがて意を決め、馬にロバがつき、ロバに牛がついたとき、一群の蹄が広々と牧草地に雷鳴をとどろかすのが聞こえた。騎兵の突撃にも似た軍隊の響きだった。全体として、耳に関するかぎり、われわれを楽しませるために実に勇壮な戦闘場面が演奏されたのだった。"
    "translation_status": "reviewed"
  - "id": "voy-317"
    "section_id": "ch-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At last the guns and the thunder dropped off; the sun shone on the wet meadows; the air was scented with the breath of rejoicing trees and grass; and the river kept unweariedly carrying us on at its best pace. There was a manufacturing district about Chauny; and after that the banks grew so high that they hid the adjacent country, and we could see nothing but clay sides, and one willow after another. Only, here and there, we passed by a village or a ferry, and some wondering child upon the bank would stare after us until we turned the corner. I daresay we continued to paddle in that child’s dreams for many a night after."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 317
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[245]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-317"
    "translation_ja": "ついには砲声も雷もやんだ。濡れた草地に日が照り、空気は喜ぶ木々と草の息に香り、川は倦まずその最上の速さでわれわれを運びつづけた。ショーニーのあたりは工業地帯だった。それから岸がひどく高まり、周りの土地を隠して、粘土の壁と一本また一本の柳しか見えなくなった。ただあちこちに村や渡し場を通り過ぎ、岸の上の不思議そうな子供が、曲がり角を回るまでわれわれを見送った。その後も何晩となく、われわれはその子の夢の中で漕ぎつづけたのだろう。"
    "translation_status": "reviewed"
  - "id": "voy-318"
    "section_id": "ch-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Sun and shower alternated like day and night, making the hours longer by their variety. When the showers were heavy, I could feel each drop striking through my jersey to my warm skin; and the accumulation of small shocks put me nearly beside myself. I decided I should buy a mackintosh at Noyon. It is nothing to get wet; but the misery of these individual pricks of cold all over my body at the same instant of time made me flail the water with my paddle like a madman. The Cigarette was greatly amused by these ebullitions. It gave him something else to look at besides clay banks and willows."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 318
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[246]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-318"
    "translation_ja": "日差しと夕立は昼と夜のように交互に訪れ、変化が多いぶん、時間が長く感じられた。降りの強いときは雫が一つずつジャージーを貫いてあたたかい肌を打つのを感じ、小さな衝撃の積み重ねに正気を失いそうになった。ノワイヨンでゴム引きの外套を買おうと決めた。濡れるぐらいは何でもない。だがからだのあちこちを同じ瞬間に一本一本冷たく刺される苦痛に、私は狂ったように櫂で水面を打ちまくった。シガレット号の主は、この癇癪の爆発を大いに面白がった。粘土の岸と柳のほかに見るものができたわけだ。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 475
          "end": 484
          "exact": "Cigarette"
  - "id": "voy-319"
    "section_id": "ch-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All the time, the river stole away like a thief in straight places, or swung round corners with an eddy; the willows nodded, and were undermined all day long; the clay banks tumbled in; the Oise, which had been so many centuries making the Golden Valley, seemed to have changed its fancy, and be bent upon undoing its performance. What a number of things a river does, by simply following Gravity in the innocence of its heart!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 319
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[247]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-319"
    "translation_ja": "そのあいだじゅう川は直線では泥棒のように忍び去り、曲がり角には渦を巻いて回った。柳はうなずき、終日その根もとを削られた。粘土の岸は落ち崩れた。幾世紀もかけて黄金の谷を作ってきたオワーズはどうやら気が変わり、自作を取り壊すことに夢中であるらしかった。心の無垢なままただ引力にしたがうだけで、川のすることのなんとおびただしいことだろう！"
    "translation_status": "reviewed"
  - "id": "voy-320"

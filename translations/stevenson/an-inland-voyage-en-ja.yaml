    "translation_status": "reviewed"
  - "id": "voy-339"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We put up at a big, bustling hotel in Compiègne, where nobody observed our presence."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 339
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[264]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-339"
    "translation_ja": "コンピエーニュでは大きなせわしいホテルに泊まり、そこでは誰もわれわれのいることに目を留めなかった。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 2
          "exact": "We"
  - "id": "voy-340"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Reservery and general militarismus (as the Germans call it) were rampant. A camp of conical white tents without the town looked like a leaf out of a picture Bible; sword-belts decorated the walls of the cafés; and the streets kept sounding all day long with military music. It was not possible to be an Englishman and avoid a feeling of elation; for the men who followed the drums were small, and walked shabbily. Each man inclined at his own angle, and jolted to his own convenience, as he went. There was nothing of the superb gait with which a regiment of tall Highlanders moves behind its music, solemn and inevitable, like a natural phenomenon. Who that has seen it can forget the drum-major pacing in front, the drummers’ tiger-skins, the pipers’ swinging plaids, the strange elastic rhythm of the whole regiment footing it in time—and the bang of the drum, when the brasses cease, and the shrill pipes take up the martial story in their place?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 340
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[265]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-340"
    "translation_ja": "予備役稼業と、全般にわたる軍国主義（ドイツ人のいうミリタリスムス）が幅を利かせていた。町の外の白い円錐形のテントの野営地は、絵入り聖書の一ページのようだった。カフェの壁は剣帯が飾り、街路は終日軍楽を響かせた。イギリス人なら得意にならずにはいられなかった。なぜなら太鼓についてゆく兵たちは小柄で、歩きぶりがみすぼらしかったからだ。各人それぞれの角度に傾き、思い思いにがくがく進んだ。背の高いハイランド兵一個連隊が、軍楽のあとを自然現象のようにおごそかに、避けようもなく進む、あの立派な歩度はまるでなかった。一度見た者がどうして忘れられよう。前を大股で行く鼓手長、鼓手の虎の皮、バグパイプ奏者の揺れる格子縞の肩掛け、歩調を合わせて進む連隊全体のあの不思議に弾むリズム。そして金管がやみ、それに代わって甲高いバグパイプが軍の物語を取り継ぐ瞬間、どんと太鼓の一打が入るのを。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 22
          "end": 34
          "exact": "militarismus"
      - "side": "source"

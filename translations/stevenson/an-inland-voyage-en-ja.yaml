  - "id": "voy-069"
    "section_id": "dedication"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was enough that you should have shared so liberally in the rains and portages of our voyage; that you should have had so hard a paddle to recover the derelict ‘Arethusa’ on the flooded Oise; and that you should thenceforth have piloted a mere wreck of mankind to Origny Sainte-Benoîte and a supper so eagerly desired. It was perhaps more than enough, as you once somewhat piteously complained, that I should have set down all the strong language to you, and kept the appropriate reflexions for myself. I could not in decency expose you to share the disgrace of another and more public shipwreck. But now that this voyage of ours is going into a cheap edition, that peril, we shall hope, is at an end, and I may put your name on the burgee."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 69
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[17]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-069"
    "translation_ja": "この旅の雨と舟運びを君があれほど惜しみなく分かち、あふれたオワーズ川で主を失ったアレシューザ号を取り戻そうと、あれほど懸命に櫂をとり、それからというもの人間の残骸にすぎなくなったこの私をオリニー＝サント＝ブノワットへ、切に望んだ夕食へと水先案内してくれた。それでもう十分だった。一度いささか哀れっぽく君がこぼしたように、荒っぽい言葉を残らず君に振り当て、場にふさわしい省察は自分に取っておいたのは、十分どころかやりすぎたかもしれない。またぞろの、しかも衆目を集める難破の不名誉まで君に分かたせるわけには、礼儀としていかなかった。だが今度は私たちの航海記が廉価版になる。願わくばその危険は終わりと見て、ようやく小三角旗に君の名を掲げてよいだろう。"

  - "id": "voy-358"
    "section_id": "ch-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Canoeing was easy work. To dip the paddle at the proper inclination, now right, now left; to keep the head down stream; to empty the little pool that gathered in the lap of the apron; to screw up the eyes against the glittering sparkles of sun upon the water; or now and again to pass below the whistling tow-rope of the Deo Gratias of Condé, or the Four Sons of Aymon—there was not much art in that; certain silly muscles managed it between sleep and waking; and meanwhile the brain had a whole holiday, and went to sleep. We took in, at a glance, the larger features of the scene; and beheld, with half an eye, bloused fishers and dabbling washerwomen on the bank. Now and again we might be half-wakened by some church spire, by a leaping fish, or by a trail of river grass that clung about the paddle and had to be plucked off and thrown away. But these luminous intervals were only partially luminous. A little more of us was called into action, but never the whole. The central bureau of nerves, what in some moods we call Ourselves, enjoyed its holiday without disturbance, like a Government Office. The great wheels of intelligence turned idly in the head, like fly-wheels, grinding no grist. I have gone on for half an hour at a time, counting my strokes and forgetting the hundreds. I flatter myself the beasts that perish could not underbid that, as a low form of consciousness. And what a pleasure it was! What a hearty, tolerant temper did it bring about! There is nothing captious about a man who has attained to this, the one possible apotheosis in life, the Apotheosis of Stupidity; and he begins to feel dignified and longævous like a tree."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 358
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[282]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-358"
    "translation_ja": "カヌーはたやすい仕事だった。右へ左へ交互に正しい角度で櫂を入れる。舳先を下流へ向ける。波除けの布の膝のところにたまる小さな水たまりをかい出す。水に照り返す日のきらめきに目をすがめる。あるいは時折コンデの「神に感謝を」号か「エイモンの四人の息子」号の風を切る曳綱の下を通る。これにたいした技は要らない。二、三の頭の悪い筋肉が夢うつつに間に合わせ、その間頭脳はまる一日の休暇をもらって眠っていた。景色の大まかな特徴はひと目で取り込み、岸にいる上っ張りの釣り人や水をばしゃばしゃする洗濯女は半分の目で見た。時折教会の尖塔に、跳ねる魚に、櫂に絡まってむしり捨てねばならぬ水草のなびく一筋に、半ば目を覚ますこともあった。ただしこうした明晰な間奏も、明晰なのは部分的であった。われわれのもう少しだけ多くが活動を求められるが、全体では決してない。神経の中央官庁、ある気分の時〈われわれ自身〉と称するところは、政府の役所のように休暇を妨げられず享受した。知性の大輪は頭の中で弾み車のように空回りし、穀物を一粒も挽かなかった。一度に半時間も櫂のひとかきを数えながら進み、百の位の数は忘れていたものだ。低次の意識形態としては、滅ぶべきけものたちだってこれより下の値は付けられまいと自任する。しかもなんという楽しさだったろう！　なんと陽気で度量のひろい気分を連れてきてくれたことか！　生に可能な唯一の神格化たるこの境地、〈愚鈍の神格化〉に達した男は何にけちをつけるでもない。そして木のように威厳があり、長命である心地になりはじめる。"
    "translation_status": "reviewed"

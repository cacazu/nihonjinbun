    "kind": "paragraph"
    "origin": "source"
    "source_text": "I understood a great deal of the spirit of what went on. Indeed it would be difficult not to understand the Miserere, which I take to be the composition of an atheist. If it ever be a good thing to take such despondency to heart, the Miserere is the right music, and a cathedral a fit scene. So far I am at one with the Catholics:—an odd name for them, after all? But why, in God’s name, these holiday choristers? why these priests who steal wandering looks about the congregation while they feign to be at prayer? why this fat nun, who rudely arranges her procession and shakes delinquent virgins by the elbow? why this spitting, and snuffing, and forgetting of keys, and the thousand and one little misadventures that disturb a frame of mind laboriously edified with chaunts and organings? In any play-house reverend fathers may see what can be done with a little art, and how, to move high sentiments, it is necessary to drill the supernumeraries and have every stool in its proper place."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 325
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[252]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-325"
    "translation_ja": "行われていたことの精神は、大半理解できた。じっさい私には無神論者の作品に思える「ミゼレーレ」を理解せずにいるのは難しい。もしあんな落胆を胸に刻むのがよい場合があるとすれば、「ミゼレーレ」こそふさわしい音楽で、大聖堂こそふさわしい舞台だ。ここまではカトリックの方々と同意見である。それにしても、あの人たちに〈普遍〉とは妙な名前ではないか？　だが神にかけて、どうしてこの物見遊山気分の聖歌隊員が要るのか？　祈るふりをしながら会衆にちらちらと目を盗みやるこうした司祭はなぜか？　無作法に行列を整え、へまをした乙女の肘をつかんで揺する、この太った修道女はなぜか？　この唾吐き、鼻すすり、鍵の置き忘れ、聖歌とオルガンで苦心して立てた心の構えを乱す、千一もの小さなしくじりは、どうしてなのか？　尊師がたはどんな劇場に行っても、ほんの少しの技で何ができるか、高い感情を動かすには端役たちを訓練し、腰掛け一つずつをきちんと決まった位置に置く必要があることを見られるだろう。"
    "translation_status": "reviewed"

  - "id": "voy-290"
    "section_id": "ch-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And we must all set our pocket-watches by the clock of fate. There is a headlong, forthright tide, that bears away man with his fancies like a straw, and runs fast in time and space. It is full of curves like this, your winding river of the Oise; and lingers and returns in pleasant pastorals; and yet, rightly thought upon, never returns at all. For though it should revisit the same acre of meadow in the same hour, it will have made an ample sweep between-whiles; many little streams will have fallen in; many exhalations risen towards the sun; and even although it were the same acre, it will no more be the same river of Oise. And thus, O graces of Origny, although the wandering fortune of my life should carry me back again to where you await death’s whistle by the river, that will not be the old I who walks the street; and those wives and mothers, say, will those be you?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 290
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[220]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-290"
    "translation_ja": "われわれは誰もみな、懐中時計を運命の時計に合わせねばならない。向こう見ずにまっしぐらの潮があり、人をその夢想もろとも藁しべのように運び去って、時と空間を速く流れる。それはあなたがたの曲がりくねるオワーズ川よろしく、曲がり角だらけであり、好もしい田園にたゆたい、引き返しもする。だが正しく考えれば、ただの一度も戻りはしない。たとえ同じ時刻に同じ一エーカーの牧草地をまた訪れたとしても、その間に大きく弧を描いている。数多の小川が流れこみ、多くの水気が太陽に向かって立ちのぼった。たとえ同じ一エーカーでも、もはや同じオワーズ川ではない。だから、ああオリニーの三美神よ、わが生のさすらいの運命が、あなたがたの川辺で死の呼び笛を待つところへ、私を連れ戻したとしても、通りを歩くのは昔の私ではないだろう。そしてその時、妻となり母となっている人たちは、はたして昔のあなたがただろうか？"
    "translation_status": "reviewed"
  - "id": "voy-291"
    "section_id": "ch-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was never any mistake about the Oise, as a matter of fact. In these upper reaches it was still in a prodigious hurry for the sea. It ran so fast and merrily, through all the windings of its channel, that I strained my thumb, fighting with the rapids, and had to paddle all the rest of the way with one hand turned up. Sometimes it had to serve mills; and being still a little river, ran very dry and shallow in the meanwhile. We had to put our legs out of the boat, and shove ourselves off the sand of the bottom with our feet. And still it went on its way singing among the poplars, and making a green valley in the world. After a good woman, and a good book, and tobacco, there is nothing so agreeable on earth as a river. I forgave it its attempt on my life; which was after all one part owing to the unruly winds of heaven that had blown down the tree, one part to my own mismanagement, and only a third part to the river itself, and that not out of malice, but from its great preoccupation over its business of getting to the sea. A difficult business, too; for the détours it had to make are not to be counted. The geographers seem to have given up the attempt; for I found no map represent the infinite contortion of its course. A fact will say more than any of them. After we had been some hours, three if I mistake not, flitting by the trees at this smooth, break-neck gallop, when we came upon a hamlet and asked where we were, we had got no farther than four kilometres (say two miles and a half) from Origny. If it were not for the honour of the thing (in the Scots saying), we might almost as well have been standing still."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 291
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[221]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-291"
    "translation_ja": "じっさいオワーズという川については、まちがえようがなかった。この上流ではまだたいへんな勢いで海へと急いでいた。流路がどんなに折れても速く楽しげに走ったので、私は早瀬と闘ううちに親指をくじき、それから先は片方の手のひらを上にして漕がねばならなかった。時には水車を回す務めがあり、まだ小さい川だったから、その間は川床がたいそう干上がり浅くなった。舟から脚を出し、川底の砂を足で押して進まねばならなかった。なおも川はポプラのあいだで歌いながら進み、この世に一筋の緑の谷をなした。よい女とよい本と煙草を別にすれば、この地上で川ほど気持ちのよいものはない。私の命を狙ったことを赦してやった。結局三分の一は木を倒した荒々しい天の風に、三分の一は私の不手際に、残る三分の一だけが川自身に帰する。しかも悪意からではなく、海にたどり着く仕事に夢中なだけだった。それも難しい仕事だ。必要な遠回りは数えきれない。地理学者はこの企てを捨てたらしい。果てしのないひねりくねりを写した地図は見つからなかったからだ。地図のどれよりも一つの事実が多くを物語る。われわれはこの滑らかで首が折れんばかりの疾走で、木々の脇を何時間も、たしか三時間、飛ぶように過ぎた。やがて一村に来合わせ現在地を問うと、オリニーから四キロ、約二マイル半しか来ていなかった。スコットランドの言い方でいえば、その名誉を別にするなら、じっと立っていたって大して違わなかったろう。"
    "translation_status": "reviewed"
  - "id": "voy-292"
    "section_id": "ch-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We lunched on a meadow inside a parallelogram of poplars. The leaves danced and prattled in the wind all round about us. The river hurried on meanwhile, and seemed to chide at our delay. Little we cared. The river knew where it was going; not so we: the less our hurry, where we found good quarters and a pleasant theatre for a pipe. At that hour, stockbrokers were shouting in Paris Bourse for two or three per cent.; but we minded them as little as the sliding stream, and sacrificed a hecatomb of minutes to the gods of tobacco and digestion. Hurry is the resource of the faithless. Where a man can trust his own heart, and those of his friends, to-morrow is as good as to-day. And if he die in the meanwhile, why then, there he dies, and the question is solved."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 292
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[222]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-292"
    "translation_ja": "ポプラの作る平行四辺形の中の草地で昼食を取った。ぐるりとまわりで葉が風に踊り、おしゃべりした。その間も川は忙しく進み、われわれのぐずぐずするのを叱るようだった。知ったことか。川は行く先を知っていた。われわれにはわからない。居心地のよい場所と一服するに快い舞台を見つけたなら、なおのこと急ぐ理由はない。ちょうどその頃、パリの取引所では株仲買人たちが二、三パーセントを求めて叫んでいた。われわれは滑るように流れる川と同様、彼らのことも意に介さず、煙草と消化の神々に百頭の生け贄よろしくおびただしい時間を捧げた。急ぐのは信頼なき者の手段だ。自分の心と友の心を信じられるなら、明日は今日と同じくらいすばらしい。もしその間に人が死ぬなら、そこで死ぬ。それで問題は片づくのだ。"
    "translation_status": "reviewed"
  - "id": "voy-293"
    "section_id": "ch-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We had to take to the canal in the course of the afternoon; because, where it crossed the river, there was, not a bridge, but a siphon. If it had not been for an excited fellow on the bank, we should have paddled right into the siphon, and thenceforward not paddled any more. We met a man, a gentleman, on the tow-path, who was much interested in our cruise. And I was witness to a strange seizure of lying suffered by the Cigarette: who, because his knife came from Norway, narrated all sorts of adventures in that country, where he has never been. He was quite feverish at the end, and pleaded demoniacal possession."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 293
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[223]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-293"
    "translation_ja": "午後の途中、運河に移らねばならなかった。運河が川を横切るところには、橋でなく伏せ越しの水路があったからだ。岸で慌てふためいていた男がいなかったら、われわれはまっすぐその管に漕ぎ入り、それから先二度と櫂を使わなかったろう。曳舟道ではわれわれの船旅に強い興味を持つ一人の男、紳士に出会った。そして私はシガレット号の主の奇妙な嘘つき発作を目撃した。ナイフがノルウェー製だというだけで、行ったこともないかの国でのさまざまな冒険を語りだしたのである。最後にはまったく熱病に浮かされたようになり、悪魔に取り憑かれたのだと申し立てた。"
    "translation_status": "reviewed"

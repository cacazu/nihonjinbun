  - "id": "voy-111"
    "section_id": "ch-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Partly from the terror we had of our good friends the Royal Nauticals, partly from the fact that there were no fewer than fifty-five locks between Brussels and Charleroi, we concluded that we should travel by train across the frontier, boats and all. Fifty-five locks in a day’s journey was pretty well tantamount to trudging the whole distance on foot, with the canoes upon our shoulders, an object of astonishment to the trees on the canal side, and of honest derision to all right-thinking children."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 111
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[54]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-111"
    "translation_ja": "親切な王立水上スポーツクラブの面々が恐ろしいのが半分、ブリュッセルとシャルルロワのあいだに五十五も閘門があるのが半分で、私たちは舟もろとも鉄道で国境を越えようと決めた。一日の行程に閘門が五十五では、カヌーを肩に、運河の木々に目を丸くさせ、健全な分別をそなえた子供という子供に心ゆくまで笑われながら、全行程をとぼとぼ歩くも同然である。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 6
          "exact": "Partly"
  - "id": "voy-112"
    "section_id": "ch-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To pass the frontier, even in a train, is a difficult matter for the Arethusa. He is somehow or other a marked man for the official eye. Wherever he journeys, there are the officers gathered together. Treaties are solemnly signed, foreign ministers, ambassadors, and consuls sit throned in state from China to Peru, and the Union Jack flutters on all the winds of heaven. Under these safeguards, portly clergymen, school-mistresses, gentlemen in grey tweed suits, and all the ruck and rabble of British touristry pour unhindered, Murray in hand, over the railways of the Continent, and yet the slim person of the Arethusa is taken in the meshes, while these great fish go on their way rejoicing. If he travels without a passport, he is cast, without any figure about the matter, into noisome dungeons: if his papers are in order, he is suffered to go his way indeed, but not until he has been humiliated by a general incredulity. He is a born British subject, yet he has never succeeded in persuading a single official of his nationality. He flatters himself he is indifferent honest; yet he is rarely taken for anything better than a spy, and there is no absurd and disreputable means of livelihood but has been attributed to him in some heat of official or popular distrust. . . ."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 112
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[55]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-112"
    "translation_ja": "たとえ汽車に乗っていようと、アレシューザ号の主にとって国境越えは難事だ。なぜか役人の目には札付きと映るらしい。彼の赴くところ、そこに係官が集まる。条約にはいともおごそかに署名がなされ、中国からペルーまで外務大臣に大使に領事が威儀を正してすわり、天の下のどんな風にも英国旗がひるがえる。これらの保障に守られて、恰幅のいい牧師、女教師、灰色のツイードを着た紳士をはじめ、英国観光客の有象無象が、マレーの旅行案内書片手に、妨げられることもなく大陸の鉄道に繰り出す。ところがこの大魚たちが喜々として行き過ぎたあと、細身のアレシューザ号の主ひとりが網にかかる。旅券を持たずに出れば、比喩でも何でもなく、悪臭の立つ牢に放りこまれる。書類が整っていれば、なるほど行かせてはもらえるが、居合わせた者みなに疑われ、恥をかかされたあとだ。生まれながらの英国臣民なのに、自分の国籍をただ一人の役人にも納得させたためしがない。まあ人並みには正直なつもりだが、間諜よりましなものに見てもらえることはめったになく、世にばかげたうしろ暗い稼業と名のつくものは、役人や民衆に頭ごなしに疑われてひととおり背負わされた。……"
    "translation_status": "reviewed"

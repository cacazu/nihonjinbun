  - "id": "voy-309"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The room was full of noisy reservists drinking and smoking; and we were very glad indeed when the drums and bugles began to go about the streets, and one and all had to snatch shakoes and be off for the barracks."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 309
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[238]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-309"
    "translation_ja": "部屋は飲んだり吸ったりする騒々しい予備役兵でいっぱいだった。やがて太鼓とらっぱが通りを回りはじめ、みんなが軍帽をひっつかんで兵舎へ引き揚げねばならなかったとき、われわれの喜びはじつに大きかった。"
    "translation_status": "reviewed"
  - "id": "voy-310"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Bazin was a tall man, running to fat: soft-spoken, with a delicate, gentle face. We asked him to share our wine; but he excused himself, having pledged reservists all day long. This was a very different type of the workman-innkeeper from the bawling disputatious fellow at Origny. He also loved Paris, where he had worked as a decorative painter in his youth. There were such opportunities for self-instruction there, he said. And if any one has read Zola’s description of the workman’s marriage-party visiting the Louvre, they would do well to have heard Bazin by way of antidote. He had delighted in the museums in his youth. ‘One sees there little miracles of work,’ he said; ‘that is what makes a good workman; it kindles a spark.’ We asked him how he managed in La Fère. ‘I am married,’ he said, ‘and I have my pretty children. But frankly, it is no life at all. From morning to night I pledge a pack of good enough fellows who know nothing.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 310
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[239]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-310"
    "translation_ja": "バザンは背が高く、太りかけた男だった。声は柔らかく、繊細でやさしい顔をしていた。われわれの葡萄酒を一緒にと誘ったが、一日じゅう予備役兵と乾杯していたからと辞退した。オリニーの大声で議論を吹っかける男とはまったく違う種類の、職人兼宿屋だった。この人もパリが好きで、若い時分にはそこで装飾画工をしていた。独学する機会があんなにあるところだ、と言った。ゾラが、労働者の婚礼の一行がルーヴルを訪ねるのを描いたくだりを読んだ人がいれば、解毒剤にバザンの話を聞いてもらいたかった。若いころには美術館が大の楽しみだった。「人の手仕事の小さな奇蹟が見られます」と言った。「あれがよい職人を作る。火花をともすのです」。ラ・フェールではどう暮らしているのか尋ねた。「私は結婚しています」と言った。「かわいい子供たちもいます。でもはっきり言えば、まるで生きた心地はしません。朝から晩まで、悪い人じゃないが何も知らない連中を相手に、乾杯を重ねるばかりです」"
    "translation_status": "reviewed"
  - "id": "voy-311"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It faired as the night went on, and the moon came out of the clouds. We sat in front of the door, talking softly with Bazin. At the guard-house opposite, the guard was being for ever turned out, as trains of field artillery kept clanking in out of the night, or patrols of horsemen trotted by in their cloaks. Madame Bazin came out after a while; she was tired with her day’s work, I suppose; and she nestled up to her husband and laid her head upon his breast. He had his arm about her, and kept gently patting her on the shoulder. I think Bazin was right, and he was really married. Of how few people can the same be said!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 311
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[240]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-311"
    "translation_ja": "夜が更けるにつれて雨がやみ、雲から月が出た。われわれは表口の前にすわり、バザンと静かに話した。向かいの衛兵所ではひっきりなしに衛兵が呼び出された。闇から野砲の部隊ががちゃがちゃと来たり、外套を着た騎馬の巡察が速歩で通ったりしたからだ。しばらくしてバザン夫人が出てきた。一日の働きで疲れていたのだろう。夫にすり寄り、その胸に頭を載せた。夫は腕をまわし、肩をやさしく何度もたたいた。バザンの言ったことは正しかった。彼は本当に結婚しているのだ。同じことを言える人が、なんとわずかだろう！"
    "translation_status": "reviewed"
  - "id": "voy-312"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Little did the Bazins know how much they served us. We were charged for candles, for food and drink, and for the beds we slept in. But there was nothing in the bill for the husband’s pleasant talk; nor for the pretty spectacle of their married life. And there was yet another item unchanged. For these people’s politeness really set us up again in our own esteem. We had a thirst for consideration; the sense of insult was still hot in our spirits; and civil usage seemed to restore us to our position in the world."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 312
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[241]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-312"
    "translation_ja": "バザン夫妻は自分たちがどれほどのことをしてくれたか、ほとんど知らなかった。ろうそく、飲食、そしてわれわれが寝た寝台の代金は取られた。だが主人のあの楽しい話については、請求書には何もなかった。夫婦の暮らしの美しい光景についても、何もなかった。しかも代金のつかぬ一項目がもう一つあった。この人たちの礼儀正しさは、実のところ、われわれが自分をどう思うかを立て直してくれたのだ。われわれはまともに扱われることに飢えていた。侮辱された感覚はまだ精神に熱く、丁寧な扱いは世間における自分の居場所を取り戻させてくれるように思われた。"
    "translation_status": "reviewed"
  - "id": "voy-313"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "How little we pay our way in life! Although we have our purses continually in our hand, the better part of service goes still unrewarded. But I like to fancy that a grateful spirit gives as good as it gets. Perhaps the Bazins knew how much I liked them? perhaps they also were healed of some slights by the thanks that I gave them in my manner?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 313
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[242]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-313"
    "translation_ja": "人生でわれわれが正味の代金を払うことのなんと少ないことか！　いつでも手に財布を持っていながら、してもらったことのうち、いちばん大事な部分はなお報いられぬままだ。だが感謝の心は、受けたのと同じだけ返すと考えるのが私は好きだ。ひょっとしてバザン夫妻には、私がどれほど二人を好きか伝わっていたろうか。私が態度で示した礼に、二人もまた何かの冷遇の傷を癒やされたのだろうか。"
    "translation_status": "reviewed"
  - "id": "voy-314"
    "section_id": "ch-14"
    "kind": "heading"
    "origin": "source"
    "source_text": "DOWN THE OISE: THROUGH THE GOLDEN VALLEY"
    "source_languages":
      - "en"
    "source_locations":

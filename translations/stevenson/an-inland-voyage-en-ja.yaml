  - "id": "voy-206"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As I continued to admire, the apologetics died away, and the good people began to brag of their barge, and their happy condition in life, as if they had been Emperor and Empress of the Indies. It was, in the Scots phrase, a good hearing, and put me in good humour with the world. If people knew what an inspiriting thing it is to hear a man boasting, so long as he boasts of what he really has, I believe they would do it more freely and with a better grace."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 206
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[142]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-206"
    "translation_ja": "私が感心しつづけていると、弁解が消えうせ、このよい人たちはインドの皇帝皇后にでもなったように艀とわが人生の幸福を自慢しはじめた。スコットランド風にいえば耳によい話で、私は世の中が気に入って機嫌がよくなった。現に持っているものを自慢するかぎり、人の自慢話が聞く者にどれほどの元気をくれるか、みんながわかっていたら、もっと気軽に、もっとさまになるように自慢するだろうと思う。"
    "translation_status": "reviewed"
  - "id": "voy-207"
    "section_id": "ch-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They began to ask about our voyage. You should have seen how they sympathised. They seemed half ready to give up their barge and follow us. But these canaletti are only gypsies semi-domesticated. The semi-domestication came out in rather a pretty form. Suddenly Madam’s brow darkened. ‘Cependant,’ she began, and then stopped; and then began again by asking me if I were single?"
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 207
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[143]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-207"
    "translation_ja": "彼らはわれわれの旅を尋ねはじめた。どんなに親身になってくれたか、お見せしたかった。艀を捨ててついて来んばかりだった。なにしろこの運河の民ときたら、半分ばかり家庭に馴れた放浪の民なのだ。その家庭に馴れた半分がたいそうほほえましい形で顔を出した。とつぜん奥さんの額に陰がさしたのである。「けれども」と言いかけてはやめ、また口を開いて、私が独身なのか尋ねた。"
    "translation_status": "reviewed"

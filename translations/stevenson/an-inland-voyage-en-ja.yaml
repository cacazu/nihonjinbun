  - "id": "voy-398"
    "section_id": "ch-21"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Of the next two days’ sail little remains in my mind, and nothing whatever in my note-book. The river streamed on steadily through pleasant river-side landscapes. Washerwomen in blue dresses, fishers in blue blouses, diversified the green banks; and the relation of the two colours was like that of the flower and the leaf in the forget-me-not. A symphony in forget-me-not; I think Théophile Gautier might thus have characterised that two days’ panorama. The sky was blue and cloudless; and the sliding surface of the river held up, in smooth places, a mirror to the heaven and the shores. The washerwomen hailed us laughingly; and the noise of trees and water made an accompaniment to our dozing thoughts, as we fleeted down the stream."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 398
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[315]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-398"
    "translation_ja": "そこから二日間の舟旅のことは心に少ししか残らず、手帳には何ひとつない。川は心地よい川べりの景色を通ってたゆみなく流れた。青い服の洗濯女と青い上っ張りの釣り人が緑の岸に変化をつけ、その二色の関係は勿忘草の花と葉のようだった。勿忘草の交響曲。テオフィル・ゴーティエならあの二日間のパノラマをそう評したかもしれない。空は青く雲ひとつなく、なめらかに動く川面は凪いだところで空と岸べに鏡を掲げた。洗濯女たちは笑いながら声をかけてくれた。われわれが流れをすべるように下るあいだ、木々と水の音が、まどろむ思いに伴奏した。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 2
          "exact": "Of"
  - "id": "voy-399"

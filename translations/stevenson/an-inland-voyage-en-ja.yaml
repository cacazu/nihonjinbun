      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 367
          "end": 378
          "exact": "feuilletons"
  - "id": "voy-356"
    "section_id": "ch-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "About one thing we were mightily taken up, and that was eating. I think I made a god of my belly. I remember dwelling in imagination upon this or that dish till my mouth watered; and long before we got in for the night my appetite was a clamant, instant annoyance. Sometimes we paddled alongside for a while and whetted each other with gastronomical fancies as we went. Cake and sherry, a homely rejection, but not within reach upon the Oise, trotted through my head for many a mile; and once, as we were approaching Verberie, the Cigarette brought my heart into my mouth by the suggestion of oyster-patties and Sauterne."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 356
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[280]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-356"
    "translation_ja": "一つひどく身を入れたことがあり、それは食事だった。腹を自分の神にしていたと思う。これという料理を口に水がたまるまで想像の中で味わい、夜の宿へはいるはるか前から、食欲が声高に、今すぐにと要求する厄介者になっていたのを覚えている。ときには舟をしばらく並べ、おいしい物の空想で互いの食欲を研ぎながら進んだ。ケーキとシェリー酒という素朴なおやつが、オワーズでは手に入らぬだけに、何マイルも頭の中を駆け回った。あるときヴェルベリーへ近づいたころには、シガレット号の主が牡蠣のパイとソーテルヌを口にして、私の心臓を口まで飛び上がらせた。"
    "translation_status": "reviewed"

  - "id": "voy-088"
    "section_id": "ch-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It is almost unnecessary to mention that when lunch was over and we got aboard again and made sail, the wind promptly died away. The rest of the journey to Villevorde, we still spread our canvas to the unfavouring air; and with now and then a puff, and now and then a spell of paddling, drifted along from lock to lock, between the orderly trees."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 88
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[34]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-088"
    "translation_ja": "昼食が済み、また乗り込んで帆を上げた途端たちまち風がやんだことは、ほとんど言うまでもあるまい。ヴィルヴォルドまでの残りの旅、つれない空気になおも帆を張り、ときにひと吹き、ときには櫂を入れるひとときで、整然と並ぶ木々のあいだを閘門から閘門へと流れていった。"
    "translation_status": "reviewed"
  - "id": "voy-089"
    "section_id": "ch-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was a fine, green, fat landscape; or rather a mere green water-lane, going on from village to village. Things had a settled look, as in places long lived in. Crop-headed children spat upon us from the bridges as we went below, with a true conservative feeling. But even more conservative were the fishermen, intent upon their floats, who let us go by without one glance. They perched upon sterlings and buttresses and along the slope of the embankment, gently occupied. They were indifferent, like pieces of dead nature. They did not move any more than if they had been fishing in an old Dutch print. The leaves fluttered, the water lapped, but they continued in one stay like so many churches established by law. You might have trepanned every one of their innocent heads, and found no more than so much coiled fishing-line below their skulls. I do not care for your stalwart fellows in india-rubber stockings breasting up mountain torrents with a salmon rod; but I do dearly love the class of man who plies his unfruitful art, for ever and a day, by still and depopulated waters."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 89
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[35]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-089"
    "translation_ja": "緑濃く豊かな好い風景だった。いや、むしろ村から村へつづく緑の水路地にすぎなかった。ものごとには住み古した土地らしい落ち着いた様子があった。切りそろえた頭の子供たちはじつに保守的な感情のおもむくまま、橋の下を通るわれわれに唾を吐きかけた。さらに保守的だったのは釣り人だ。浮きに夢中で、ひと目もくれずこちらを通り過ぎさせた。橋脚の水除けや控え壁、あるいは堤防の斜面にちょこんと止まり、おだやかに仕事に専念していた。死んだ自然の断片のようによそに無関心だった。古いオランダの版画の中で釣りをしているのと変わらないほど、じっとしていた。葉はそよぎ、水はちゃぷちゃぷ寄せても、彼らは法律の定めた幾つもの国教会のように、不動のひと姿勢をつづけた。無邪気な頭の一つ一つを穿っても、頭蓋の下には相応の量の巻かれた釣り糸しか見つからなかったろう。ゴムの長靴下をはき、鮭釣りの竿を手に、山の急流に胸を当てて遡るたくましい連中には興味がない。だが物静かで人影のない水辺にいつの世までも座って、実り少ない技にいそしむ種類の男なら大好きだ。"
    "translation_status": "reviewed"
  - "id": "voy-090"
    "section_id": "ch-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At the last lock, just beyond Villevorde, there was a lock-mistress who spoke French comprehensibly, and told us we were still a couple of leagues from Brussels. At the same place, the rain began again. It fell in straight, parallel lines; and the surface of the canal was thrown up into an infinity of little crystal fountains. There were no beds to be had in the neighbourhood. Nothing for it but to lay the sails aside and address ourselves to steady paddling in the rain."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 90
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[36]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-090"
    "translation_ja": "ヴィルヴォルドのすぐ先の最後の閘門に、こちらにも通じるフランス語を話す女性の閘門番がいた。ブリュッセルまでまだ二リューばかりあると教えてくれた。同じ場所でまた雨が始まった。まっすぐで平行な線を描いて降り、運河の表面に小さな水晶の噴水を無数に立てた。近所で借りられる寝床はなかった。帆を片づけて、雨の中をこつこつ漕ぐしかなかった。"
    "translation_status": "reviewed"
  - "id": "voy-091"
    "section_id": "ch-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Beautiful country houses, with clocks and long lines of shuttered windows, and fine old trees standing in groves and avenues, gave a rich and sombre aspect in the rain and the deepening dusk to the shores of the canal. I seem to have seen something of the same effect in engravings: opulent landscapes, deserted and overhung with the passage of storm. And throughout we had the escort of a hooded cart, which trotted shabbily along the tow-path, and kept at an almost uniform distance in our wake."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 91
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[37]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-091"
    "translation_ja": "時計と長く並ぶ鎧戸の窓を備えた美しい田舎屋敷、木立や並木をなす立派な古木は、雨と深まる夕闇のなか、運河の岸を豊かで陰影の濃い姿にした。版画でこれに似た効果を少し見たことがある気がする。豊麗な風景が人に見捨てられ、通り過ぎる嵐におおわれている。しかも道中を通じて幌付きの荷車がお供をした。曳舟道をみすぼらしく速足で行き、われわれの後ろからほぼ一様の間隔を保った。"
    "translation_status": "reviewed"

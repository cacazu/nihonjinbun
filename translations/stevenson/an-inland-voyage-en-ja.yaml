  - "id": "voy-353"
    "section_id": "ch-18"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There is a sense in which those mists never rose from off our journey; and from that time forth they lie very densely in my note-book. As long as the Oise was a small rural river, it took us near by people’s doors, and we could hold a conversation with natives in the riparian fields. But now that it had grown so wide, the life along shore passed us by at a distance. It was the same difference as between a great public highway and a country by-path that wanders in and out of cottage gardens. We now lay in towns, where nobody troubled us with questions; we had floated into civilised life, where people pass without salutation. In sparsely inhabited places, we make all we can of each encounter; but when it comes to a city, we keep to ourselves, and never speak unless we have trodden on a man’s toes. In these waters we were no longer strange birds, and nobody supposed we had travelled farther than from the last town. I remember, when we came into L’Isle Adam, for instance, how we met dozens of pleasure-boats outing it for the afternoon, and there was nothing to distinguish the true voyager from the amateur, except, perhaps, the filthy condition of my sail. The company in one boat actually thought they recognised me for a neighbour. Was there ever anything more wounding? All the romance had come down to that. Now, on the upper Oise, where nothing sailed as a general thing but fish, a pair of canoeists could not be thus vulgarly explained away; we were strange and picturesque intruders; and out of people’s wonder sprang a sort of light and passing intimacy all along our route. There is nothing but tit-for-tat in this world, though sometimes it be a little difficult to trace: for the scores are older than we ourselves, and there has never yet been a settling-day since things were. You get entertainment pretty much in proportion as you give. As long as we were a sort of odd wanderers, to be stared at and followed like a quack doctor or a caravan, we had no want of amusement in return; but as soon as we sank into commonplace ourselves, all whom we met were similarly disenchanted. And here is one reason of a dozen, why the world is dull to dull persons."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 353
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[277]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-353"
    "translation_ja": "ある意味で、あの靄はとうとうわれわれの旅から晴れなかった。あの時から先、私の手帳にはじつに濃く立ちこめている。オワーズがまだ小さな田舎の川だったうちは、人家の戸口の近くまでわれわれを運び、岸の畑にいる土地の人と話もできた。ところがこれほど川幅が広くなった今、岸辺の生活は遠くを通り過ぎた。公の大街道と、小家の庭を縫って入り出する田舎のわき道ほどの違いだ。今やわれわれは町に泊まり、誰も質問で煩わせなかった。挨拶なしですれ違う文明生活の中へ漂い込んだのだ。人里まばらな所なら出会いは一度ごとに十分活用するが、都市になれば他人とは距離を置き、誰かのつま先を踏みでもしなければ口をきかない。この水域ではもはやわれわれは珍鳥ではなく、一つ前の町より遠くから来たと思う人はいなかった。たとえばリラダンにはいった時には、午後の遊覧に出た遊び舟何十艘にも会った。私の帆の小汚さをおそらく別にすれば、真の旅人と素人を見分けるしるしは何もなかった。一艘の一行は本当に私を隣人と見まちがえた。これほど傷つく話があろうか？　あのロマンがすっかりそこまで落ちたのだ。ところがオワーズ上流では、ふだんは魚しか舟を出さず、カヌー乗り二人はこんな俗な理由で片づけられなかった。われわれは珍しく絵になる闖入者で、人々の驚きから道すがら一種の軽い、つかのまの親しみが生まれた。この世では何事も持ちつ持たれつだ。たどるのが少々難しいことはある。貸し借りはわれわれ自身より古く、世の始まり以来まだ決算日はなかったからだ。おおかた人を楽しませた分だけ、自分も楽しませてもらえる。香具師や旅回りの見世物のようにじろじろ見られ、あとを追われる一種風変わりな旅人であったあいだは、お返しにもらった楽しみに不自由しなかった。こちらが月並みに落ち着いた途端、会う人たちにも同じように魔法が解けた。面白くない人に世界が面白くない理由は、十二もあろうが、その一つはここにある。"
    "translation_status": "reviewed"

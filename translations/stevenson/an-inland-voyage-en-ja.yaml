  - "id": "voy-269"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Here now,’ cried the landlord, brandishing a plate, ‘here is a field of beet-root. Well. Here am I then. I advance, do I not? Eh bien! sacristi,’ and the statement, waxing louder, rolls off into a reverberation of oaths, the speaker glaring about for sympathy, and everybody nodding his head to him in the name of peace."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 269

  - "id": "voy-218"
    "section_id": "ch-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Before nine next morning the two canoes were installed on a light country cart at Étreux: and we were soon following them along the side of a pleasant valley full of hop-gardens and poplars. Agreeable villages lay here and there on the slope of the hill; notably, Tupigny, with the hop-poles hanging their garlands in the very street, and the houses clustered with grapes. There was a faint enthusiasm on our passage; weavers put their heads to the windows; children cried out in ecstasy at sight of the two ‘boaties’—barguettes: and bloused pedestrians, who were acquainted with our charioteer, jested with him on the nature of his freight."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 218
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[153]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-218"
    "translation_ja": "翌朝九時前、エトルーで二艘のカヌーは軽い田舎の荷車に載せられた。まもなくわれわれはそのあとについて、ホップ畑とポプラのいっぱいある、気持ちのよい谷の脇を進んだ。丘の斜面のあちこちに好ましい村落があった。とりわけテュピニーではホップの支柱が往来の中にまで葉の花輪を垂らし、家々には葡萄が房を連ねていた。われわれの行く先にはそこはかとない熱狂が起こった。織工は窓に顔を出し、二つの「ちっちゃな舟（バルゲット）」を見た子供らは有頂天の声を上げた。仕事用の上っ張りを着た通行人のうち、わが御者の知り合いは、荷物の中身をめぐって彼に冗談を飛ばした。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 6
          "exact": "Before"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 518

  - "id": "voy-396"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This fellow’s evolutions, and the little prologue, in which the showman made a humorous eulogium of his troop, praising their indifference to applause and hisses, and their single devotion to their art, were the only circumstances in the whole affair that you could fancy would so much as raise a smile. But the villagers of Précy seemed delighted. Indeed, so long as a thing is an exhibition, and you pay to see it, it is nearly certain to amuse. If we were charged so much a head for sunsets, or if God sent round a drum before the hawthorns came in flower, what a work should we not make about their beauty! But these things, like good companions, stupid people early cease to observe: and the Abstract Bagman tittups past in his spring gig, and is positively not aware of the flowers along the lane, or the scenery of the weather overhead."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 396
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[314]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-396"
    "translation_ja": "この男の立ち回りと、興行主が一座は拍手にも野次にも無関心で、ただ芸のみに身を捧げていると滑稽な讃辞を述べた短い口上。この全興行で微笑ひとつでも誘うと想像できるのはそれだけだった。だがプレシーの村人は大喜びの様子だった。実際、何でも見世物と称し金を払って見ることになれば、ほとんど確実に面白くなる。夕焼けを見るのに一人いくらと取られたり、サンザシが花を咲かせる前に神が太鼓を叩く触れ役を回したりすれば、その美しさをわれわれはどれほど大げさに騒ぐことだろう！　だがこういうものはよい仲間と同じで、愚かな人はすぐに気に留めなくなる。そして〈巡回商人なるもの〉は、ばねつきの二輪馬車で軽快に通り過ぎ、小道の花にも頭上に広がる天候の景色にも、まったく気づいていない。"
    "translation_status": "reviewed"

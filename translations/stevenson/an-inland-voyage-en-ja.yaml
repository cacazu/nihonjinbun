        "xpath": "/html/body/p[93]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-154"
    "translation_ja": "モリエールの笑劇で、召使いたちが階下で貴族よろしく遊んでいるところに本物の貴族が踏みこむように、われわれも本物の行商人と引き合わされる運命にあった。しかもわれわれのような零落紳士にとっていっそうこたえる教訓となるように、彼は宿の者がわれわれをその一人だと思いこんだような、けちな行商人より桁違いに押し出しのある行商人だった。鼠の中に獅子が現れたか、軍艦が小舟二艘にのしかかって来るようなものだ。じつを言えば行商人なる呼び名は彼にふさわしくなかった。彼は旅まわりの商人であった。"
    "translation_status": "reviewed"

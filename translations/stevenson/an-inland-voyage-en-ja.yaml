    "translation_ja": "プレシーと操り人形"
    "translation_status": "reviewed"
  - "id": "voy-375"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We made Précy about sundown. The plain is rich with tufts of poplar. In a wide, luminous curve, the Oise lay under the hillside. A faint mist began to rise and confound the different distances together. There was not a sound audible but that of the sheep-bells in some meadows by the river, and the creaking of a cart down the long road that descends the hill. The villas in their gardens, the shops along the street, all seemed to have been deserted the day before; and I felt inclined to walk discreetly as one feels in a silent forest. All of a sudden, we came round a corner, and there, in a little green round the church, was a bevy of girls in Parisian costumes playing croquet. Their laughter, and the hollow sound of ball and mallet, made a cheery stir in the neighbourhood; and the look of these slim figures, all corseted and ribboned, produced an answerable disturbance in our hearts. We were within sniff of Paris, it seemed. And here were females of our own species playing croquet, just as if Précy had been a place in real life, instead of a stage in the fairyland of travel. For, to be frank, the peasant woman is scarcely to be counted as a woman at all, and after having passed by such a succession of people in petticoats digging and hoeing and making dinner, this company of coquettes under arms made quite a surprising feature in the landscape, and convinced us at once of being fallible males."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 375
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[297]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-375"
    "translation_ja": "プレシーには日没ごろ着いた。平野にはポプラの茂みがふんだんにある。丘のふもとにオワーズが光をたたえ、広く曲がって横たわっていた。淡い靄が立ちのぼりはじめ、遠近の差を一つに溶かしはじめた。川辺の草地のどこかで羊の鈴が鳴るのと、丘を下る長い道に荷車のきしむほか、耳に届く音はなかった。庭の中の別荘も、通りに沿う店も、すべて昨日人が去ったばかりのように見え、私は静かな森で感じるように、遠慮深く歩きたい気がした。ところが角を一つ回ると、教会を囲む小さな緑地にパリ風の服を着た娘が何人も集い、クロッケーをしていた。笑い声と、球と槌の立てる軽いうつろな音が近所を陽気にざわつかせた。みなコルセットを締めリボンをつけたほっそりした姿を見ると、われわれの胸の中にもそれに見合う騒ぎが起こった。もうパリのにおいの届く範囲にいるらしかった。そしてここには我々と同じ種族の女性がクロッケーをしている。まるでプレシーが旅というお伽の国の一駅ではなく、実生活の土地のようだった。というのも、率直に言えば農婦は女のうちにはほとんど数えられまいし、スカートをはいて土を掘り、鍬を動かし、食事を作る人々の列をこれだけ通り過ぎてから、クロッケーの槌で武装したこのおしゃれな娘たちの一隊に会うと、景色に思いがけないものが現れたようで、われわれも過ちうる男なのだと即座に納得させられたのだった。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 2
          "exact": "We"
  - "id": "voy-376"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The inn at Précy is the worst inn in France. Not even in Scotland have I found worse fare. It was kept by a brother and sister, neither of whom was out of their teens. The sister, so to speak, prepared a meal for us; and the brother, who had been tippling, came in and brought with him a tipsy butcher, to entertain us as we ate. We found pieces of loo-warm pork among the salad, and pieces of unknown yielding substance in the ragoût. The butcher entertained us with pictures of Parisian life, with which he professed himself well acquainted; the brother sitting the while on the edge of the billiard-table, toppling precariously, and sucking the stump of a cigar. In the midst of these diversions, bang went a drum past the house, and a hoarse voice began issuing a proclamation. It was a man with marionnettes announcing a performance for that evening."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 376
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[298]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-376"
    "translation_ja": "プレシーの宿はフランスで最悪の宿だ。スコットランドでさえ、これほどひどい食べ物には会わなかった。切り盛りするきょうだいは、男も女もまだ十代を出ていなかった。娘のほうが、いわば食事なるものをこしらえた。酒をきこしめしていた男のほうは、ほろ酔いの肉屋を伴ってはいって来て、われわれの食事の相手をした。サラダの中には生ぬるい豚肉の切れ端があり、煮込みの中には何かわからず押せばへこむ物体があった。肉屋はよく知っていると公言するパリの生活を描き出してわれわれをもてなした。きょうだいの男のほうはそのあいだ、玉突き台のへりに腰掛けて危なっかしく揺れ、葉巻の吸いさしをしゃぶっていた。これらの気晴らしのさなか、どんと太鼓が家の前を通り、かすれた声が布告を読み上げはじめた。その晩の公演を告げる操り人形遣いだった。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 428
          "end": 434
          "exact": "ragoût"
  - "id": "voy-377"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He had set up his caravan and lighted his candles on another part of the girls’ croquet-green, under one of those open sheds which are so common in France to shelter markets; and he and his wife, by the time we strolled up there, were trying to keep order with the audience."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 377
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[299]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-377"
    "translation_ja": "人形遣いは娘たちのクロッケー場の別の一角、市場を覆うためフランスの至るところにある、壁のない屋根小屋の一つの下に、興行の幌車を据え、ろうそくをともしていた。われわれがぶらぶら見に行ったころ、彼と妻は観衆をおとなしくさせようと四苦八苦していた。"
    "translation_status": "reviewed"
  - "id": "voy-378"
    "section_id": "ch-20"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was the most absurd contention. The show-people had set out a certain number of benches; and all who sat upon them were to pay a couple of sous for the accommodation. They were always quite full—a bumper house—as long as nothing was going forward; but let the show-woman appear with an eye to a collection, and at the first rattle of her tambourine the audience slipped off the seats, and stood round on the outside with their hands in their pockets. It certainly would have tried an angel’s temper. The showman roared from the proscenium; he had been all over France, and nowhere, nowhere, ‘not even on the borders of Germany,’ had he met with such misconduct. Such thieves and rogues and rascals, as he called them! And every now and again, the wife issued on another round, and added her shrill quota to the tirade. I remarked here, as elsewhere, how far more copious is the female mind in the material of insult. The audience laughed in high good-humour over the man’s declamations; but they bridled and cried aloud under the woman’s pungent sallies. She picked out the sore points. She had the honour of the village at her mercy. Voices answered her angrily out of the crowd, and received a smarting retort for their trouble. A couple of old ladies beside me, who had duly paid for their seats, waxed very red and indignant, and discoursed to each other audibly about the impudence of these mountebanks; but as soon as the show-woman caught a whisper of this, she was down upon them with a swoop: if mesdames could persuade their neighbours to act with common honesty, the mountebanks, she assured them, would be polite enough: mesdames had probably had their bowl of soup, and perhaps a glass of wine that evening; the mountebanks also had a taste for soup, and did not choose to have their little earnings stolen from them before their eyes. Once, things came as far as a brief personal encounter between the showman and some lads, in which the former went down as readily as one of his own marionnettes to a peal of jeering laughter."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 378
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[300]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-378"
    "translation_ja": "世にもおかしな争いだった。興行師夫婦はいくつかの腰掛けを並べ、その便にあずかってすわる者は二スーを払うことになっていた。何も起きていない間はいつも全部埋まる大入り満員なのだ。ところが集金のつもりで女房が姿を見せると、とたんにタンバリンが一度ちゃらりと鳴っただけで、観客は席からするりと抜け、ポケットに手を入れて外から取り巻いた。天使でもこたえることだろう。興行師は舞台の前から吠えた。フランスじゅうを回ったが、どこにも、どこにも、「ドイツとの国境でさえ」、こんな不届きを見たことはない。こんな盗っ人、ならず者、ろくでなしどもを、と呼んだ。時折また女房がひとまわりに出てきて、夫の長広舌に、甲高い声で加勢した。私はほかの場所でもそうだが、ここでも悪口の材料については女の頭のほうがいかに豊富であるかを見た。観衆は男の大演説にはひどく機嫌よく笑ったが、女の辛辣な攻め口にはむっとしてどなり返した。彼女は痛い所を選び出した。村の名誉は彼女の手の内にあった。群衆の中から怒った声が答えると、ご苦労の甲斐あって、ひりひりするほどの切り返しをくらった。隣にいた二人の老婦人はちゃんと席料を払っていたので、たいそう顔を赤くして憤り、この見世物師どもの厚かましさを聞こえよがしに言い合った。だがそのひと言が女房に聞こえたかと思うと、たちまち二人に襲いかかった。奥様方がお隣さんたちを説得して人並みに正直にふるまわせてくだされば、こちら見世物師は十分礼儀正しくもなりますよ、奥様方は今晩スープの一杯も、ひょっとしたら葡萄酒の一杯も召し上がったでしょう、見世物師にだってスープを好む口があり、目の前でささやかな稼ぎをかすめ取られたくはないんですよ、と請け合った。しまいには一度、興行師と若衆のあいだに短い取っ組み合いさえ起きた。男は自分の操り人形と同じほどあっけなくひっくり返り、どっと嘲笑がわいた。"
    "translation_status": "reviewed"

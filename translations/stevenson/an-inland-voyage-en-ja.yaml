  - "id": "voy-237"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The humiliation of their arms and the loss of Alsace and Lorraine made a sore pull on the endurance of this sensitive people; and their hearts are still hot, not so much against Germany as against the Empire. In what other country will you find a patriotic ditty bring all the world into the street? But affliction heightens love; and we shall never know we are Englishmen until we have lost India. Independent America is still the cross of my existence; I cannot think of Farmer George without abhorrence; and I never feel more warmly to my own land than when I see the Stars and Stripes, and remember what our empire might have been."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 237
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[170]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-237"
    "translation_ja": "軍の受けた屈辱とアルザス、ロレーヌの喪失は、この敏感な国民の忍耐を手ひどく試した。今も心は熱く燃えている。相手はドイツというより、むしろ自国の帝政なのだ。愛国歌一曲で誰も彼も通りに出てくるのは、ほかのどこの国で見られるだろう。苦難は愛を濃くする。われわれだってインドを失うまでは、自分たちがイギリス人だとはついに悟るまい。アメリカが独立国であることは今なお私の一生の十字架だ。農夫王ジョージのことを嫌悪なしには考えられない。星条旗を見て、わが帝国がどんな姿でありえたかを思い出す時ほど、自国をいとしく思うことはない。"
    "translation_status": "reviewed"
  - "id": "voy-238"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The hawker’s little book, which I purchased, was a curious mixture. Side by side with the flippant, rowdy nonsense of the Paris music-halls, there were many pastoral pieces, not without a touch of poetry, I thought, and instinct with the brave independence of the poorer class in France. There you might read how the wood-cutter gloried in his axe, and the gardener scorned to be ashamed of his spade. It was not very well written, this poetry of labour, but the pluck of the sentiment redeemed what was weak or wordy in the expression. The martial and the patriotic pieces, on the other hand, were tearful, womanish productions one and all. The poet had passed under the Caudine Forks; he sang for an army visiting the tomb of its old renown, with arms reversed; and sang not of victory, but of death. There was a number in the hawker’s collection called ‘Conscrits Français,’ which may rank among the most dissuasive war-lyrics on record. It would not be possible to fight at all in such a spirit. The bravest conscript would turn pale if such a ditty were struck up beside him on the morning of battle; and whole regiments would pile their arms to its tune."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 238
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[171]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-238"
    "translation_ja": "私が買った行商人の小冊子は、奇妙な取り合わせだった。パリのミュージックホール仕込みの軽薄で騒々しいたわごとと隣り合って、数多くの田園の歌があった。私には一抹の詩情もあり、フランスの貧しい階級の雄々しい独立心が息づいていると思えた。木こりがいかに斧を誇るか、庭師がいかに鋤を恥じることを潔しとしないかが読めた。労働を歌うこの詩は、あまり巧く書けていなかったが、言い回しの弱さや冗長さは心意気のよさが埋め合わせた。反対に軍歌と愛国歌は、一つ残らず涙もろく女々しい作だった。詩人はカウディウムのくびきの下をくぐったのだ。銃を逆さに持ち、往年の武名の墓を詣でる軍隊のために、勝利でなく死を歌ったのだ。行商人の集には「フランス徴集兵」という一曲があった。記録に残る軍歌でこれほど戦意をくじくものは、そう多くあるまい。あの気分で戦うことはいっさい不可能だ。決戦の朝隣であの歌が始まったら、最も勇敢な新兵も蒼白になるだろう。その節に合わせていくつもの連隊が銃を置くことだろう。"
    "translation_status": "reviewed"
  - "id": "voy-239"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "If Fletcher of Saltoun is in the right about the influence of national songs, you would say France was come to a poor pass. But the thing will work its own cure, and a sound-hearted and courageous people weary at length of snivelling over their disasters. Already Paul Déroulède has written some manly military verses. There is not much of the trumpet note in them, perhaps, to stir a man’s heart in his bosom; they lack the lyrical elation, and move slowly; but they are written in a grave, honourable, stoical spirit, which should carry soldiers far in a good cause. One feels as if one would like to trust Déroulède with something. It will be happy if he can so far inoculate his fellow-countrymen that they may be trusted with their own future. And in the meantime, here is an antidote to ‘French Conscripts’ and much other doleful versification."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 239
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[172]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-239"
    "translation_ja": "国民の歌の影響力についてソルトーンのフレッチャーが正しいなら、フランスもひどいところまで来た、と言いたくなる。だがこの病には自分を治す力があって、心健やかで勇敢な国民はそのうち、わが災難をめそめそ嘆くことに飽きるものだ。すでにポール・デルレードは雄々しい軍隊の詩をいくつか書いた。胸の内をかき立てるらっぱの響きは、たぶんあまりない。抒情詩の高揚を欠き、動きものろい。だが真面目で名誉を重んじ、克己心に富む精神で書かれている。正しい大義のためなら兵をずいぶん遠くまで運ぶはずだ。何かデルレードに託してみたいような気にさせられる。同国人にその精神をうまく接ぎ木し、彼ら自身の将来を彼らに託せるまでにできたら、めでたいことだ。さしあたりこれが「フランス徴集兵」をはじめ陰気な詩が氾濫することへの解毒剤だ。"
    "translation_status": "reviewed"
  - "id": "voy-240"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We had left the boats over-night in the custody of one whom we shall call Carnival. I did not properly catch his name, and perhaps that was not unfortunate for him, as I am not in a position to hand him down with honour to posterity. To this person’s premises we strolled in the course of the day, and found quite a little deputation inspecting the canoes. There was a stout gentleman with a knowledge of the river, which he seemed eager to impart. There was a very elegant young gentleman in a black coat, with a smattering of English, who led the talk at once to the Oxford and Cambridge Boat Race. And then there were three handsome girls from fifteen to twenty; and an old gentleman in a blouse, with no teeth to speak of, and a strong country accent. Quite the pick of Origny, I should suppose."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 240
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[173]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-240"
    "translation_ja": "私たちは前夜、舟を、ここではカーニバルと呼んでおくある者に預けた。名前を正しく聞き取れなかった。名誉ある後世への伝達をしてやれる立場にはないから、彼にはかえって幸運だったかもしれない。その日、われわれが彼のところへぶらぶら行くと、ちょっとした代表団がカヌーを検分していた。太った紳士がいて、川の事情に詳しく、それを聞かせたくてならぬ様子だった。黒い上着を着たこのうえなく優雅な若紳士もいて、英語をいくらか知っており、たちまち話をオックスフォードとケンブリッジの対校レースに向けた。それから十五歳から二十歳のきれいな娘が三人。上っ張りを着て、あるかなきかの歯にきつい田舎訛りの老紳士がいた。オリニーの粒ぞろいが顔を合わせたのだと思う。"
    "translation_status": "reviewed"
  - "id": "voy-241"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The Cigarette had some mysteries to perform with his rigging in the coach-house; so I was left to do the parade single-handed. I found myself very much of a hero whether I would or not. The girls were full of little shudderings over the dangers of our journey. And I thought it would be ungallant not to take my cue from the ladies. My mishap of yesterday, told in an off-hand way, produced a deep sensation. It was Othello over again, with no less than three Desdemonas and a sprinkling of sympathetic senators in the background. Never were the canoes more flattered, or flattered more adroitly."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 241
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[174]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-241"
    "translation_ja": "シガレット号の主は車庫で舟の艤装に何か秘儀を施さねばならず、私はひとりでお披露目をつとめることになった。望むと望まぬとにかかわらず、私はずいぶんな英雄だった。娘たちは私たちの旅の危険を思って小さく身震いすることしきりであった。ご婦人の出すきっかけに乗らないのは礼を失すると私は思った。昨日の災難を事もなげに話してやると、みなにひどく強い印象を残した。またしてもオセローの芝居だ。しかもデズデモーナが三人もいて、背景には同情を寄せる元老院議員がちらほらいた。カヌーがこれほどお世辞を浴びたことも、これほど巧みにお世辞を浴びたこともない。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 4
          "end": 13
          "exact": "Cigarette"
  - "id": "voy-242"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘It is like a violin,’ cried one of the girls in an ecstasy."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 242
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[175]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-242"
    "translation_ja": "「ヴァイオリンみたい！」と一人の娘はうっとりと声を上げた。"
    "translation_status": "reviewed"
  - "id": "voy-243"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘I thank you for the word, mademoiselle,’ said I. ‘All the more since there are people who call out to me that it is like a coffin.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 243
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[176]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-243"
    "translation_ja": "「そのお言葉をありがとう、お嬢さん」と私は言った。「なにしろ棺桶みたいだと声をかけてくる人もいるものですからね」"
    "translation_status": "reviewed"
  - "id": "voy-244"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Oh! but it is really like a violin. It is finished like a violin,’ she went on."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 244
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[177]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-244"
    "translation_ja": "「あら！　でもほんとうにヴァイオリンみたいよ。ヴァイオリンみたいに仕上げてあるわ」と彼女はつづけた。"
    "translation_status": "reviewed"
  - "id": "voy-245"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘And polished like a violin,’ added a senator."
    "source_languages":
      - "en"
    "source_locations":

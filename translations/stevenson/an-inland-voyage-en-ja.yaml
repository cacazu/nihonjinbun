    "translation_status": "reviewed"
  - "id": "voy-106"
    "section_id": "ch-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "durst risk a word in answer. It is but a lying cant that would represent the merchant and the banker as people disinterestedly toiling for mankind, and then most useful when they are most absorbed in their transactions; for the man is more important than his services. And when my Royal Nautical Sportsman shall have so far fallen from his hopeful youth that he cannot pluck up an enthusiasm over anything but his ledger, I venture to doubt whether he will be near so nice a fellow, and whether he would welcome, with so good a grace, a couple of drenched Englishmen paddling into Brussels in the dusk."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 106
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[50]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-106"
    "translation_ja": "除いては。商人や銀行家が私心なく人類のため働き、取引にいちばん夢中になっているとき最も有用なのだと描くのは、ただの偽善的なたわ言である。人間はその働きより大切だからだ。そしてわが王立の水上スポーツマンが有望だった青春から落ちに落ちて、自分の帳簿以外には一滴の熱中も引き出せなくなったら、はたして今ほど気持ちのよい男であろうか、夕暮れのブリュッセルにずぶ濡れで漕ぎ入ったイングランド人二人を、今ほど快く迎えてくれようか、私はあえて疑いたい。"
    "translation_status": "reviewed"
  - "id": "voy-107"
    "section_id": "ch-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When we had changed our wet clothes and drunk a glass of pale ale to the Club’s prosperity, one of their number escorted us to an hotel. He would not join us at our dinner, but he had no objection to a glass of wine. Enthusiasm is very wearing; and I begin to understand why prophets were unpopular in Judæa, where they were best known. For three stricken hours did this excellent young man sit beside us to dilate on boats and boat-races; and before he left, he was kind enough to order our bedroom candles."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 107
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[51]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-107"
    "translation_ja": "われわれが濡れた着物を換え、クラブの繁栄を祈ってペールエールを一杯飲むと、会員の一人がホテルまで案内してくれた。夕食をともにしようという誘いは受けなかったが、ワイン一杯なら異存はなかった。熱心というものはひどく人を疲れさせる。預言者がユダヤで、とくにその人柄がよく知られていた土地で、不人気だったのはなぜかがわかり始めた。まるまる三時間、この立派な青年はわれわれの傍らに座り、舟とボートレースについて詳説した。去る前にはご親切にも、われわれの寝室行きの蝋燭まで頼んでくれた。"
    "translation_status": "reviewed"
  - "id": "voy-108"
    "section_id": "ch-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We endeavoured now and again to change the subject; but the diversion did not last a moment: the Royal Nautical Sportsman bridled, shied, answered the question, and then breasted once more into the swelling tide of his subject. I call it his subject; but I think it was he who was subjected. The Arethusa, who holds all racing as a creature of the devil, found himself in a pitiful dilemma. He durst not own his ignorance for the honour of Old England, and spoke away about English clubs and English oarsmen whose fame had never before come to his ears. Several times, and, once above all, on the question of sliding-seats, he was within an ace of exposure. As for the Cigarette, who has rowed races in the heat of his blood, but now disowns these slips of his wanton youth, his case was still more desperate; for the Royal Nautical proposed that he should take an oar in one of their eights on the morrow, to compare the English with the Belgian stroke. I could see my friend perspiring in his chair whenever that particular topic came up. And there was yet another proposal which had the same effect on both of us. It appeared that the champion canoeist of Europe (as well as most other champions) was a Royal Nautical Sportsman. And if we would only wait until the Sunday, this infernal paddler would be so condescending as to accompany us on our next stage. Neither of us had the least desire to drive the coursers of the sun against Apollo."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 108
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[52]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-108"
    "translation_ja": "折にふれて話を変えようと努めたが、そらせた時間は一瞬にもならなかった。王立の水上スポーツマンは手綱を引かれたように身をそらし、横にそれ、質問に答え、それから再びふくらみ返す自分の主題の潮に胸から乗り込んだ。彼の主題と言ったが、従属させられていたのはむしろ彼のほうだと思う。競漕はすべて悪魔の所産だと考えるアレシューザの主は哀れな板挟みになった。古きイングランドの名誉のため無知を告白する勇気はなく、イングランドのクラブやそれまで名声が耳に入ったことさえない漕ぎ手について滔々と語った。幾度か、ことに移動座席の問題のときなど、もう一歩で化けの皮が剥がれるところだった。シガレットの主は若い日の血気でレースを漕いだ経験があり、いまは放埒な若さの過ちと打ち消しているのだが、その立場はなおも絶望的だった。王立の紳士は、イギリスとベルギーの漕ぎを比べるため、明日クラブのエイト艇の一つでオールをとってくれと提案したのだ。この特定の話題が出るたび、友が椅子で冷汗をかくのが見えた。そのうえわれわれ両方に同じ効果を及ぼすもう一つの提案があった。どうやらヨーロッパのカヌー選手権者は、ほかの大半の選手権者と同じく王立クラブの会員だった。そしてわれわれが日曜まで待つだけで、このいまいましい漕ぎの達人が身をかがめて次の行程に同伴してくださるという。太陽の駿馬を駆ってアポロンと競う望みは、二人のどちらにも毛ほどもなかった。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"

        "original_unit_id": "voy-268"
    "translation_ja": "会話はその日の狩りの細部から始まった。村の猟好きが一人残らず、区切りのない同じ猟場で鉄砲を撃つとなれば、作法や先着権について多くの問題が生じるに決まっている。"
    "translation_status": "reviewed"

          "exact": "Cigarette"
  - "id": "voy-330"
    "section_id": "ch-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Reservery,’ said he, ‘seems a pretty mean way to spend ones autumn holiday.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 330
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[256]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-330"
    "translation_ja": "「予備役稼業ときたら」と彼は言った。「秋の休暇の使い道としてずいぶん情けなさそうだな」"
    "translation_status": "reviewed"
  - "id": "voy-331"
    "section_id": "ch-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘About as mean,’ returned I dejectedly, ‘as canoeing.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 331
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[257]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-331"
    "translation_ja": "「まあ、カヌー漕ぎと同じくらいには」と私は意気消沈して返した。"
    "translation_status": "reviewed"
  - "id": "voy-332"
    "section_id": "ch-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘These gentlemen travel for their pleasure?’ asked the landlady, with unconscious irony."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 332
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[258]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-332"
    "translation_ja": "「お客さんがたは、お楽しみでご旅行なさってるんで？」と女将は意図せずにとんだ皮肉をきかせた。"
    "translation_status": "reviewed"
  - "id": "voy-333"
    "section_id": "ch-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was too much. The scales fell from our eyes. Another wet day, it was determined, and we put the boats into the train."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 333
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[259]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-333"
    "translation_ja": "これには参った。目からうろこが落ちた。もう一日雨だったら舟は汽車に載せると決まった。"
    "translation_status": "reviewed"
  - "id": "voy-334"
    "section_id": "ch-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The weather took the hint. That was our last wetting. The afternoon faired up: grand clouds still voyaged in the sky, but now singly, and with a depth of blue around their path; and a sunset in the daintiest rose and gold inaugurated a thick night of stars and a month of unbroken weather. At the same time, the river began to give us a better outlook into the country. The banks were not so high, the willows disappeared from along the margin, and pleasant hills stood all along its course and marked their profile on the sky."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 334
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[260]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-334"
    "translation_ja": "天候はほのめかしを解した。濡れるのはあれが最後となった。午後は晴れ上がった。壮麗な雲が相変わらず空を航行していたが、今は一つずつ離れ、その道を深い青が囲んだ。このうえなく繊細な薔薇色と金の夕映えが、星の密に散る一夜と、ひと月つづく穏やかな天候の幕を開けた。同時に川は、われわれに陸の眺めをもっと与えはじめた。岸はさほど高くなくなり、きわに続いた柳は消え、川沿いにずっと感じのよい丘が立ち、空に輪郭をしるした。"
    "translation_status": "reviewed"
  - "id": "voy-335"
    "section_id": "ch-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In a little while the canal, coming to its last lock, began to discharge its water-houses on the Oise; so that we had no lack of company to fear. Here were all our old friends; the Deo Gratias of Condé and the Four Sons of Aymon journeyed cheerily down stream along with us; we exchanged waterside pleasantries with the steersman perched among the lumber, or the driver hoarse with bawling to his horses; and the children came and looked over the side as we paddled by. We had never known all this while how much we missed them; but it gave us a fillip to see the smoke from their chimneys."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 335
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[261]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-335"
    "translation_ja": "まもなく運河が最後の閘門に達すると、例の水の家々をオワーズに吐き出しはじめた。もう道連れには事欠かない。古い友達はみないた。コンデの「神に感謝を」号と「エイモンの四人の息子」号がわれわれと一緒に快活に下流へ向かった。材木に陣取る舵取りや馬に怒鳴って声をからした御者とは岸辺の軽口をやり取りし、われわれが漕いでそばを過ぎると子供らが舷に顔をのぞかせた。これまでずっと、あの連中がいなくてどれほど寂しかったかは知らずにいた。だが煙突から上がる煙を見ると、元気がぱっと戻った。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 181
          "end": 192
          "exact": "Deo Gratias"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 210
          "end": 228
          "exact": "Four Sons of Aymon"
  - "id": "voy-336"
    "section_id": "ch-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A little below this junction we made another meeting of yet more account. For there we were joined by the Aisne, already a far-travelled river and fresh out of Champagne. Here ended the adolescence of the Oise; this was his marriage day; thenceforward he had a stately, brimming march, conscious of his own dignity and sundry dams. He became a tranquil feature in the scene. The trees and towns saw themselves in him, as in a mirror. He carried the canoes lightly on his broad breast; there was no need to work hard against an eddy: but idleness became the order of the day, and mere straightforward dipping of the paddle, now on this side, now on that, without intelligence or effort. Truly we were coming into halcyon weather upon all accounts, and were floated towards the sea like gentlemen."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 336
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[262]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-336"
    "translation_ja": "運河との合流点の少し下手で、さらに重要な出会いがあった。すでに長旅を重ねた川で、シャンパーニュから出たてのエーヌ川がそこで加わったのだ。オワーズの思春期はここに終わった。この日は彼の婚礼の日だった。ここからの彼は悠々と満ちた歩みを取り、自分の尊厳といくつもある堰とを意識していた。景色に落ち着きを与えるものとなった。木も町も鏡に映すようにその中に自分の姿を見た。広い胸は軽々とカヌーを運んだ。渦に逆らって働く必要はなく、のんびりするのが日課になった。こっちとあっちにただまっすぐ櫂を入れるだけで、知恵も力も要らなかった。まったくわれわれはいずれの点から見ても凪の季節に入り、紳士らしく浮かんで海へ運ばれたのである。"
    "translation_status": "reviewed"
  - "id": "voy-337"
    "section_id": "ch-16"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We made Compiègne as the sun was going down: a fine profile of a town above the river. Over the bridge, a regiment was parading to the drum. People loitered on the quay, some fishing, some looking idly at the stream. And as the two boats shot in along the water, we could see them pointing them out and speaking one to another. We landed at a floating lavatory, where the washerwomen were still beating the clothes."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 337
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[263]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-337"
    "translation_ja": "日が沈むところにコンピエーニュに着いた。川の上に町の美しい横顔があった。橋の上をひと連隊が太鼓に合わせて行進していた。波止場では人々がぶらぶらし、ある者は釣りをし、ある者は何するでもなく流れを見ていた。二艘の舟が水の上を滑り込んでゆくと、それを指さし互いに言葉を交わす人たちが見えた。われわれは川に浮かぶ洗い場で上陸した。洗濯女たちはまだ衣類をたたいていた。"
    "translation_status": "reviewed"
  - "id": "voy-338"

  - "id": "voy-074"
    "section_id": "ch-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The sun shone brightly; the tide was making—four jolly miles an hour; the wind blew steadily, with occasional squalls. For my part, I had never been in a canoe under sail in my life; and my first experiment out in the middle of this big river was not made without some trepidation. What would happen when the wind first caught my little canvas? I suppose it was almost as trying a venture into the regions of the unknown as to publish a first book, or to marry. But my doubts were not of long duration; and in five minutes you will not be surprised to learn that I had tied my sheet."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 74
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[21]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-074"
    "translation_ja": "日は明るく照り、潮は上げていた。時速四マイルものありがたい流れだ。風はしっかり吹き、ときおり突風になった。私はといえば、生まれてこのかた帆を張ったカヌーに乗ったことがなかった。この大河の真ん中で初めて試すのは、いくらかの胸騒ぎなしにはすまなかった。私のちっぽけな帆が最初に風をはらんだら何が起こるだろう？　未知の領域に踏み込む緊張という意味では、処女作を世に出すとか結婚するとかとほぼ同じくらいだったろうと思う。だが迷いは長くは続かなかった。五分もすると私は帆脚索を縛りつけてしまった、と明かしても驚かれはすまい。"
    "translation_status": "reviewed"
  - "id": "voy-075"
    "section_id": "ch-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I own I was a little struck by this circumstance myself; of course, in company with the rest of my fellow-men, I had always tied the sheet in a sailing-boat; but in so little and crank a concern as a canoe, and with these charging squalls, I was not prepared to find myself follow the same principle; and it inspired me with some contemptuous views of our regard for life. It is certainly easier to smoke with the sheet fastened; but I had never before weighed a comfortable pipe of tobacco against an obvious risk, and gravely elected for the comfortable pipe. It is a commonplace, that we cannot answer for ourselves before we have been tried. But it is not so common a reflection, and surely more consoling, that we usually find ourselves a great deal braver and better than we thought. I believe this is every one’s experience: but an apprehension that they may belie themselves in the future prevents mankind from trumpeting this cheerful sentiment abroad. I wish sincerely, for it would have saved me much trouble, there had been some one to put me in a good heart about life when I was younger; to tell me how dangers are most portentous on a distant sight; and how the good in a man’s spirit will not suffer itself to be overlaid, and rarely or never deserts him in the hour of need. But we are all for tootling on the sentimental flute in literature; and not a man among us will go to the head of the march to sound the heady drums."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 75
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[22]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-075"
    "translation_ja": "じつは当人はこの事実にいくらか打たれた。もちろん私はほかの人々と同じく、帆走艇ではいつも帆脚索を縛っていた。だがカヌーのように小さく不安定な舟、しかもあの猛烈な突風の中で、同じ方針を取ることになろうとは思いもしなかった。おかげで人間の命の尊重についていくらか侮蔑的な見方を抱いた。索を留めておけば煙草を吸いやすいのはたしかだ。だがそれまで一度も、愉快なパイプ一服と、目に見える危険とを天秤に掛けて、しかつめらしくパイプを取ったことはなかった。試されるまでは人は自分のことが請け合えないとは月並みな話である。だが試してみると想像よりよほど勇敢で、よほど善い人間だったと知るのが通例だ、という省察は、月並みでないうえに確かにもっと慰めとなる。これは誰にでもある経験だと私は信じるが、いつかその言葉を自ら裏切る羽目になりはしまいかという懸念から、人はこの朗らかな所感を大きく吹聴しないのだ。私がもっと若かった時、人生について元気づけてくれる人がいれば、とつくづく思う。ずいぶんいろいろな心配をせずに済んだろう。危険は遠くから見る時に最もものものしく見えるものだ、人の魂にある善はうずもれたままにはならず、必要が生じた時にその人を見放すことはほぼ、いやまったくない、そう教えてくれる人がいれば。だが文学のなかでわれわれは揃って感傷のフルートをぴいぴい吹きたがる。行進の先頭に立ち、血を酔わせる太鼓を打ち鳴らそうとする男は一人もいない。"
    "translation_status": "reviewed"
  - "id": "voy-076"
    "section_id": "ch-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was agreeable upon the river. A barge or two went past laden with hay. Reeds and willows bordered the stream; and cattle and grey venerable horses came and hung their mild heads over the embankment. Here and there was a pleasant village among trees, with a noisy shipping-yard; here and there a villa in a lawn. The wind served us well up the Scheldt and thereafter up the Rupel; and we were running pretty free when we began to sight the brickyards of Boom, lying for a long way on the right bank of the river. The left bank was still green and pastoral, with alleys of trees along the embankment, and here and there a flight of steps to serve a ferry, where perhaps there sat a woman with her elbows on her knees, or an old gentleman with a staff and silver spectacles. But Boom and its brickyards grew smokier and shabbier with every minute; until a great church with a clock, and a wooden bridge over the river, indicated the central quarters of the town."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 76
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[23]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-076"
    "translation_ja": "川の上は気持ちがよかった。干し草を積んだ艀が一隻二隻通り過ぎた。流れを縁どるのは葦と柳。牛や年老いた堂々たる灰色の馬がやって来て、堤防越しにおとなしい頭を差し出した。そこかしこ、木々の間に気持ちよさそうな村があり、騒々しい造船場があり、芝生には別荘が点々とあった。風はスヘルデを遡るにも、ついでリュペルを遡るにもよく役に立った。ボームの煉瓦工場が見えだした時にも、まだ風にかなり余裕をもってよく走っていた。工場は右岸を長々と占めた。左岸はなおも緑の田園風で、堤に沿って並木が延び、渡し場用の階段があちこちにあり、そこには肘を膝にのせた女か、杖に銀縁眼鏡の老紳士がすわっていたりした。ボームとその煉瓦工場は一分ごとに煙く、みすぼらしくなり、とうとう時計付きの大きな教会と、川を渡る木橋が町の中心部を告げた。"
    "translation_status": "reviewed"
  - "id": "voy-077"
    "section_id": "ch-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Boom is not a nice place, and is only remarkable for one thing: that the majority of the inhabitants have a private opinion that they can speak English, which is not justified by fact. This gave a kind of haziness to our intercourse. As for the Hôtel de la Navigation, I think it is the worst feature of the place. It boasts of a sanded parlour, with a bar at one end, looking on the street; and another sanded parlour, darker and colder, with an empty bird-cage and a tricolour subscription box by way of sole adornment, where we made shift to dine in the company of three uncommunicative engineer apprentices and a silent bagman. The food, as usual in Belgium, was of a nondescript occasional character; indeed I have never been able to detect anything in the nature of a meal among this pleasing people; they seem to peck and trifle with viands all day long in an amateur spirit: tentatively French, truly German, and somehow falling between the two."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 77
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[24]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-077"
    "translation_ja": "ボームは感じのよい場所ではない。特筆すべきはひとつ、住人の大半が自分は英語を話せるという、事実の裏づけのない個人的見解を持っていることである。それでわれわれの意思の疎通には一種の靄がかかった。オテル・ド・ラ・ナヴィガシオンについては、ここのいちばんいただけぬ部分だと思う。砂を撒いた広間があって、その端には通りに面した飲み台があることを誇りにしている。砂を撒いた広間がもう一つ、そちらはもっと暗くて寒く、飾りといえば空の鳥籠と三色塗りの募金箱だけで、われわれは口の重い技師見習い三人、黙りこくった旅商人一人と同席して何とか夕食にありついた。食べ物はベルギーでの例に漏れず、とりとめもなく成り行き任せのものだった。じつにこの感じのよい国民のもとでは、これが一食の膳だというものを発見できたためしがない。素人の遊び心で一日じゅうちょこちょこ肴をつついているように見える。試しぶりはフランス風、実のところはドイツ風、どうしたものか二つの間に落ちてしまう。"
    "translation_status": "reviewed"
  - "id": "voy-078"
    "section_id": "ch-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The empty bird-cage, swept and garnished, and with no trace of the old piping favourite, save where two wires had been pushed apart to hold its lump of sugar, carried with it a sort of graveyard cheer. The engineer apprentices would have nothing to say to us, nor indeed to the bagman; but talked low and sparingly to one another, or raked us in the gaslight with a gleam of spectacles. For though handsome lads, they were all (in the Scots phrase) barnacled."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 78
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[25]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-078"
    "translation_ja": "空の鳥籠は掃き清めて飾ってあり、昔囀って愛されたものの跡といえば、その角砂糖を挟むため二本の針金を押し広げた箇所だけで、墓場めいた晴れやかさがあった。技師見習いたちはわれわれとは口をききたがらず、旅商人にもまったく同じだった。仲間うちで声少なにぽつぽつ話すか、ガス灯の光を眼鏡に反射させてこちらを上から下までなめるだけだった。というのは顔立ちのよい若者ながら、そろってスコットランドで言う「フジツボつき」、つまり眼鏡を鼻に掛けていたのである。"
    "translation_status": "reviewed"
  - "id": "voy-079"
    "section_id": "ch-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was an English maid in the hotel, who had been long enough out of England to pick up all sorts of funny foreign idioms, and all sorts of curious foreign ways, which need not here be specified. She spoke to us very fluently in her jargon, asked us information as to the manners of the present day in England, and obligingly corrected us when we attempted to answer. But as we were dealing with a woman, perhaps our information was not so much thrown away as it appeared. The sex likes to pick up knowledge and yet preserve its superiority. It is good policy, and almost necessary in the circumstances. If a man finds a woman admire him, were it only for his acquaintance with geography, he will begin at once to build upon the admiration. It is only by unintermittent snubbing that the pretty ones can keep us in our place. Men, as Miss Howe or Miss Harlowe would have said, ‘are such encroachers.’ For my part, I am body and soul with the women; and after a well-married couple, there is nothing so beautiful in the world as the myth of the divine huntress. It is no use for a man to take to the woods; we know him; St. Anthony tried the same thing long ago, and had a pitiful time of it by all accounts. But there is this about some women, which overtops the best gymnosophist among men, that they suffice to themselves, and can walk in a high and cold zone without the countenance of any trousered being. I declare, although the reverse of a professed ascetic, I am more obliged to women for this ideal than I should be to the majority of them, or indeed to any but one, for a spontaneous kiss. There is nothing so encouraging as the spectacle of self-sufficiency. And when I think of the slim and lovely maidens, running the woods all night to the note of Diana’s horn; moving among the old oaks, as fancy-free as they; things of the forest and the starlight, not touched by the commotion of man’s hot and turbid life—although there are plenty other ideals that I should prefer—I find my heart beat at the thought of this one. ’Tis to fail in life, but to fail with what a grace! That is not lost which is not regretted. And where—here slips out the male—where would be much of the glory of inspiring love, if there were no contempt to overcome?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 79
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[26]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-079"
    "translation_ja": "宿にはイングランド人の女中がいて、国を離れてずいぶん経つので、おかしな異国の言い回しだの、ここでいちいち述べるに及ばぬ妙な異国の習慣だのを、何種類も身につけていた。その混じりことばでじつに流暢にわれわれに話しかけ、今のイングランドの風俗について教えを請い、答えようとするとわざわざこちらの間違いを直してくれた。けれども相手が女性だったから、私たちの知識は見たほど無駄にはならなかったのかもしれない。女性は知識を拾い集めるのを好むが、同時に自分の優位は守っていたい。それは方策として優れているし、この事情ではほとんど必要なことだ。女性が自分に感心していると気づけば、その理由がたとえ地理を知っていることだけでも、男はただちにその賞賛を土台に何かを築き始める。可愛い人たちがこちらに身のほどをわきまえさせるには、絶え間なく鼻をへし折るしかない。ハウ嬢かハーロウ嬢ならおっしゃったように、男というものは「なんてずうずうしく踏みこんでくるのでしょう」。私はといえば身も心も女性の側であり、気の合った夫婦に次いで、女神なる狩人の神話ほど世界で美しいものはないと思っている。男が森に入ってみても無駄だ。こちらは正体を知っている。聖アントニウスははるか昔に同じことをやって、どの記録によっても哀れな目に遭った。だがある種の女性には男の裸形修行者のうちいちばん立派な者をも凌駕するところがある。一身で足り、ズボンをはいた存在のいかなる後ろ盾もなく、高く冷たい圏を歩けるところである。私自身は禁欲を標榜する人間の逆だが、あえて言う。この理想のために私は女性に、彼女らの大多数、いやただ一人を除くどんな女性からも自発的な接吻をもらうより、もっと感謝している。ひとりで足りる姿ほど人を勇気づけるものはない。ディアナの角笛の音を聞いて夜通し森を走るほっそりと美しい娘たち、老樫と同じく恋の思いに煩わされずその間を移ろう娘たち、森と星明かりに属し、男の熱く濁った生活の乱れに触れられぬ者たちを思うとき、ほかにもっと選びたい理想はいくらもあるのに、この理想を思うと胸が打つ。人生に失敗することなのだとしても、何という優雅な失敗だろう！　惜しまないものは失っていない。それに、ここに男の地金がのぞくのだが、打ち勝つべき軽蔑がないとしたら、愛を呼び起こす栄光の大半はどこへ行くのだろう？"
    "translation_status": "reviewed"

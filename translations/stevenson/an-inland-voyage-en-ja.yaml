  - "id": "voy-082"
    "section_id": "ch-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The canal was busy enough. Every now and then we met or overtook a long string of boats, with great green tillers; high sterns with a window on either side of the rudder, and perhaps a jug or a flower-pot in one of the windows; a dinghy following behind; a woman busied about the day’s dinner, and a handful of children. These barges were all tied one behind the other with tow ropes, to the number of twenty-five or thirty; and the line was headed and kept in motion by a steamer of strange construction. It had neither paddle-wheel nor screw; but by some gear not rightly comprehensible to the unmechanical mind, it fetched up over its bow a small bright chain which lay along the bottom of the canal, and paying it out again over the stern, dragged itself forward, link by link, with its whole retinue of loaded skows. Until one had found out the key to the enigma, there was something solemn and uncomfortable in the progress of one of these trains, as it moved gently along the water with nothing to mark its advance but an eddy alongside dying away into the wake."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 82
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[28]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-082"
    "translation_ja": "運河は十分に忙しかった。ときおり長い数珠つなぎの舟に出会い、あるいは追い越した。大きな緑の舵柄と、高い船尾の舵の両わきの窓と、その片方にたぶん水差しか植木鉢。後ろに小舟を従え、きょうの食事をせわしく支度する女と、ひと握りの子供たち。艀はみな曳き綱で前の舟につながれ、二十五、三十隻を数えた。先頭に立って列を動かすのは不思議な仕掛けの汽船だった。外輪もスクリューもない。機械音痴にはきちんとわからない何かの歯車で、運河の底に敷いてある細い光る鎖を船首から引き上げ、船尾へまた繰り出して、一つの環、また一つの環と、荷を山積みした平底船の従者一同ごと自分を前へ引いていくのだ。謎の鍵を見つけるまでは、こうした列が進むさま、船腹わきの渦が船の跡に鎮まっていくほかには前進のしるしとてなく、水の上をすうっと進むさまには、どこか厳かな、居心地の悪いものがあった。"
    "translation_status": "reviewed"
  - "id": "voy-083"
    "section_id": "ch-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Of all the creatures of commercial enterprise, a canal barge is by far the most delightful to consider. It may spread its sails, and then you see it sailing high above the tree-tops and the windmill, sailing on the aqueduct, sailing through the green corn-lands: the most picturesque of things amphibious. Or the horse plods along at a foot-pace as if there were no such thing as business in the world; and the man dreaming at the tiller sees the same spire on the horizon all day long. It is a mystery how things ever get to their destination at this rate; and to see the barges waiting their turn at a lock, affords a fine lesson of how easily the world may be taken. There should be many contented spirits on board, for such a life is both to travel and to stay at home."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 83
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[29]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-083"
    "translation_ja": "商業という営みの造ったもののうち、眺めていて断然楽しいのは運河の艀である。帆を上げることがある。すると梢や風車の高みを越えて帆走し、水道橋の上を帆走し、青々とした穀物畑のただなかを帆走するのが目に入る。水陸両生のもののうち最も絵になるものだ。あるいは馬が、この世には商売などというものはないかのように並足でとぼとぼ行き、舵で夢見ている男は一日じゅう地平の同じ尖塔を見る。この歩みで荷がいつか目的地に着くのは謎であり、艀が閘門で順番待ちするのを見るのは、世の中をどれほど気軽に構えてよいかの立派な授業になる。船には満ち足りた魂がたくさんありそうだ。そんな暮らしは旅をすることでも、家にとどまることでもあるからだ。"
    "translation_status": "reviewed"
  - "id": "voy-084"
    "section_id": "ch-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The chimney smokes for dinner as you go along; the banks of the canal slowly unroll their scenery to contemplative eyes; the barge floats by great forests and through great cities with their public buildings and their lamps at night; and for the bargee, in his floating home, ‘travelling abed,’ it is merely as if he were listening to another man’s story or turning the leaves of a picture-book in which he had no concern. He may take his afternoon walk in some foreign country on the banks of the canal, and then come home to dinner at his own fireside."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 84
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[30]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-084"
    "translation_ja": "進んでいるあいだ、夕食のために煙突が煙る。運河の岸が、物思う眼差しの前でゆっくりと景色を繰り広げる。艀は大森林の横を浮かび過ぎ、公共の建物と夜の灯をもつ大都会の中を抜ける。浮くわが家で「寝床のまま旅行」している艀の船頭にとっては、ただ他人の身の上話を聞いているとか、自分にかかわりのない絵本のページをめくっているとか、それだけのことのようだ。午後の散歩にはどこか外国の運河べりを歩き、それからわが家に帰って自分の炉端で夕飯を取ることができる。"
    "translation_status": "reviewed"
  - "id": "voy-085"
    "section_id": "ch-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There is not enough exercise in such a life for any high measure of health; but a high measure of health is only necessary for unhealthy people. The slug of a fellow, who is never ill nor well, has a quiet time of it in life, and dies all the easier."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 85
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[31]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-085"
    "translation_ja": "そんな暮らしでは並外れた健康に十分な運動はできない。だが並外れた健康を必要とするのは、不健康な人だけだ。病気にかかることもなければ元気はつらつというわけでもないなめくじのような男は、人生を静かに過ごし、その分だけ楽に死ぬ。"
    "translation_status": "reviewed"
  - "id": "voy-086"
    "section_id": "ch-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I am sure I would rather be a bargee than occupy any position under heaven that required attendance at an office. There are few callings, I should say, where a man gives up less of his liberty in return for regular meals. The bargee is on shipboard—he is master in his own ship—he can land whenever he will—he can never be kept beating off a lee-shore a whole frosty night when the sheets are as hard as iron; and so far as I can make out, time stands as nearly still with him as is compatible with the return of bed-time or the dinner-hour. It is not easy to see why a bargee should ever die."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 86
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[32]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-086"
    "translation_ja": "事務所に通わねばならない仕事なら、この世のどんな地位よりも、私は艀の船頭のほうがいい。定まった食事と引き換えに、これほどわずかな自由だけを差し出せば済む稼業はほとんどなかろう。艀の船頭は船に乗っている。自分の船の主人である。気のむいた時にはいつでも上陸できる。帆脚索が鉄のように凍る晩じゅう、風下の岸に流されまいと間切りつづけさせられることは決してない。そして私にわかるかぎり、寝る時刻と食事時が巡ってこられる限度いっぱいまで、時間がほどよく静止している。なぜ艀の船頭などがいつか死なねばならぬのか、理解に苦しむ。"
    "translation_status": "reviewed"
  - "id": "voy-087"
    "section_id": "ch-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Half-way between Willebroek and Villevorde, in a beautiful reach of canal like a squire’s avenue, we went ashore to lunch. There were two eggs, a junk of bread, and a bottle of wine on board the Arethusa; and two eggs and an Etna cooking apparatus on board the Cigarette. The master of the latter boat smashed one of the eggs in the course of disembarkation; but observing pleasantly that it might still be cooked à la papier, he dropped it into the Etna, in its covering of Flemish newspaper. We landed in a blink of fine weather; but we had not been two minutes ashore before the wind freshened into half a gale, and the rain began to patter on our shoulders. We sat as close about the Etna as we could. The spirits burned with great ostentation; the grass caught flame every minute or two, and had to be trodden out; and before long, there were several burnt fingers of the party. But the solid quantity of cookery accomplished was out of proportion with so much display; and when we desisted, after two applications of the fire, the sound egg was little more than loo-warm; and as for à la papier, it was a cold and sordid fricassée of printer’s ink and broken egg-shell. We made shift to roast the other two, by putting them close to the burning spirits; and that with better success. And then we uncorked the bottle of wine, and sat down in a ditch with our canoe aprons over our knees. It rained smartly. Discomfort, when it is honestly uncomfortable and makes no nauseous pretensions to the contrary, is a vastly humorous business; and people well steeped and stupefied in the open air are in a good vein for laughter. From this point of view, even egg à la papier offered by way of food may pass muster as a sort of accessory to the fun. But this manner of jest, although it may be taken in good part, does not invite repetition; and from that time forward, the Etna voyaged like a gentleman in the locker of the Cigarette."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 87
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[33]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-087"
    "translation_ja": "ウィレブルークとヴィルヴォルドの中ほど、領主の館へ通じる並木道のように美しくひとすじに延びる運河の区間で、昼食のため上陸した。アレシューザ号には卵二個、パンの塊一つ、ワイン一本。シガレット号には卵二個とエトナ式の調理器があった。後者の船長は上陸作業のあいだに卵の一つを砕いたが、それでもなお「紙包み風」に料理できるとにこやかに述べ、フランドル語の新聞紙にくるんだままエトナに放り込んだ。一瞬天気がのぞいた間に陸に上がったが、岸で二分もたたないうちに風はほとんど疾風まで強まり、雨が肩をぱらぱら打ち始めた。できるだけエトナに寄り添って座った。アルコールはたいへん仰々しく燃え、一分か二分おきに草に火がついて踏み消さねばならず、間もなく一行の指はあちこち火傷した。だができた料理の実質量は、これだけの見ものに釣り合わなかった。二度火にかけて断念した時、割れていない卵は人肌にようやく届く程度。「紙包み風」のほうは、印刷インクと割れた卵の殻の冷たい卑しい煮込みだった。残る二つを燃えるアルコールのすぐそばに置いて何とか焼くと、こちらはもう少しうまくいった。そこでワインの栓を抜き、カヌーの腰覆いを膝に掛けて溝の中に腰を下ろした。雨は勢いよく降った。不快が正直に不快であり、うんざりするほど反対のふりをしないとき、それはたいへん滑稽なものだ。戸外でずぶ濡れになり、頭もぼんやりしてきた者は、笑いがよく出る具合になっている。そう見るなら、食物の代わりに出る「紙包み風」の卵さえ遊興の添え物として合格するかもしれない。とはいえこの種類の冗談は、笑って受け流せはしても、繰り返したくはならない。それからはエトナは紳士らしく、シガレット号の船倉に収まって旅をした。"
    "translation_status": "reviewed"

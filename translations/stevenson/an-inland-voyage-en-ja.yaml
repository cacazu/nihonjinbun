          "exact": "Cigarette"
  - "id": "voy-140"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A miry lane led us up from Quartes with its church and bickering windmill. The hinds were trudging homewards from the fields. A brisk little woman passed us by. She was seated across a donkey between a pair of glittering milk-cans; and, as she went, she kicked jauntily with her heels upon the donkey’s side, and scattered shrill remarks among the wayfarers. It was notable that none of the tired men took the trouble to reply. Our conductor soon led us out of the lane and across country. The sun had gone down, but the west in front of us was one lake of level gold. The path wandered a while in the open, and then passed under a trellis like a bower indefinitely prolonged. On either hand were shadowy orchards; cottages lay low among the leaves, and sent their smoke to heaven; every here and there, in an opening, appeared the great gold face of the west."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 140
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[80]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-140"
    "translation_ja": "ぬかるんだ小道が、教会とせわしく羽根を回す風車のあるカルテから、われわれを上のほうへ運んだ。農夫らが畑からとぼとぼ家へ向かっていた。小柄な女がきびきびと追い越していった。ぴかぴかの牛乳缶のあいだでロバにまたがり、陽気にかかとでその脇腹を蹴りつつ、道行く人にかん高い声であれこれ言葉をまき散らした。疲れた男たちの誰ひとり、返事をする気にならなかったのが印象に残った。じきに案内の子は、私たちを小道から野の中へ導いた。日は落ちていたが、前方の西の空は一面、たいらかな黄金の湖だった。小径はしばらく開けたところをさまよい、それから、どこまでもつづく緑陰のあずまやのようなつる棚の下に入った。左右には影を深くした果樹園。葉のあいだに低い家が伏せて天へ煙を上げ、ところどころ木々の切れ目から、西の空の大きな金色の顔が現れた。"
    "translation_status": "reviewed"
  - "id": "voy-141"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I never saw the Cigarette in such an idyllic frame of mind. He waxed positively lyrical in praise of country scenes. I was little less exhilarated myself; the mild air of the evening, the shadows, the rich lights and the silence, made a symphonious accompaniment about our walk; and we both determined to avoid towns for the future and sleep in hamlets."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 141
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[81]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-141"
    "translation_ja": "シガレット号の主がこれほど牧歌的な気分になったのは見たことがなかった。田園風景をほめる口ぶりはまさに抒情詩人だった。私も負けず劣らず心が弾んだ。夕暮れのおだやかな空気と影と豊かな光と沈黙が、われわれの歩みを取り巻いて調和のよい伴奏をつけた。そして二人とも、今後は町を避け、小村に泊まることに決めた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 16
          "end": 25
          "exact": "Cigarette"
  - "id": "voy-142"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At last the path went between two houses, and turned the party out into a wide muddy high-road, bordered, as far as the eye could reach on either hand, by an unsightly village. The houses stood well back, leaving a ribbon of waste land on either side of the road, where there were stacks of firewood, carts, barrows, rubbish-heaps, and a little doubtful grass. Away on the left, a gaunt tower stood in the middle of the street. What it had been in past ages, I know not: probably a hold in time of war; but now-a-days it bore an illegible dial-plate in its upper parts, and near the bottom an iron letter-box."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 142
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[82]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-142"
    "translation_ja": "ようやく道は二軒の家のすきまを通って、一行を広い泥んこの街道に吐き出した。左右見わたすかぎり見ばえのしない村がつらなった。家々はずっと奥まって建ち、道路の両側には帯のような空き地があった。薪の山、荷車、手押し車、ごみの山、それに草ともいえぬような草が少し。左の遠くではひょろ長い塔が通りの真ん中に立っていた。むかしは何に使ったものか知らない。たぶん戦時の砦だったのだろう。今は上のほうに判読のできぬ時計の文字盤、下のほうに鉄の郵便箱がついていた。"
    "translation_status": "reviewed"
  - "id": "voy-143"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The inn to which we had been recommended at Quartes was full, or else the landlady did not like our looks. I ought to say, that with our long, damp india-rubber bags, we presented rather a doubtful type of civilisation: like rag-and-bone men, the Cigarette imagined. ‘These gentlemen are pedlars?—Ces messieurs sont des marchands?’—asked the landlady. And then, without waiting for an answer, which I suppose she thought superfluous in so plain a case, recommended us to a butcher who lived hard by the tower, and took in travellers to lodge."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 143
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[83]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-143"
    "translation_ja": "カルテで教えられた宿は満員だった。さもなくば女将がわれわれの風采を気に入らなかった。長い湿ったゴム引き袋を提げたわれわれが、文明人としていささか怪しげな見本だったことは認めねばならない。ぼろ買いみたいだとシガレット号の主は思ったそうだ。「お客さんがた、行商の方ですね？　セ・メッシュー・ソン・デ・マルシャン？」と女将。これほど明々白々な場合には余計と考えたのだろう、答えを待たず、塔のすぐそばに住んで旅人を泊める肉屋を教えてくれた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 247
          "end": 256
          "exact": "Cigarette"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 297
          "end": 329
          "exact": "Ces messieurs sont des marchands"
  - "id": "voy-144"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Thither went we. But the butcher was flitting, and all his beds were taken down. Or else he didn’t like our look. As a parting shot, we had ‘These gentlemen are pedlars?’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 144
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[84]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-144"
    "translation_ja": "そちらへ行った。だが肉屋は引っ越しの最中で、寝台はみなばらしてあった。さもなくばこちらの風采が気に入らなかった。別れぎわにも一発、「お客さんがた、行商の方ですね？」"
    "translation_status": "reviewed"
  - "id": "voy-145"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It began to grow dark in earnest. We could no longer distinguish the faces of the people who passed us by with an inarticulate good-evening. And the householders of Pont seemed very economical with their oil; for we saw not a single window lighted in all that long village. I believe it is the longest village in the world; but I daresay in our predicament every pace counted three times over. We were much cast down when we came to the last auberge; and looking in at the dark door, asked timidly if we could sleep there for the night. A female voice assented in no very friendly tones. We clapped the bags down and found our way to chairs."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 145
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[85]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-145"
    "translation_ja": "いよいよ本格的に暗くなってきた。もぐもぐとこんばんはを言いながら通り過ぎる人の顔も、もう見分けられなかった。ポンの家の人たちは油をたいそう大切にするらしい。長い長い村じゅう一つも明かりのついた窓は見えなかった。世界一長い村だと思うが、あの窮状では一歩が三歩に勘定されたのかもしれない。最後の旅籠に来たときにはすっかりしょげて、暗い戸口をのぞきこみ、今夜ひと晩寝させてもらえませんかとおそるおそる尋ねた。さほど愛想のよくない女の声が承知した。私たちは袋をどさりと下ろし、手探りで椅子を見つけた。"
    "translation_status": "reviewed"
  - "id": "voy-146"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The place was in total darkness, save a red glow in the chinks and ventilators of the stove. But now the landlady lit a lamp to see her new guests; I suppose the darkness was what saved us another expulsion; for I cannot say she looked gratified at our appearance. We were in a large bare apartment, adorned with two allegorical prints of Music and Painting, and a copy of the law against public drunkenness. On one side, there was a bit of a bar, with some half-a-dozen bottles. Two labourers sat waiting supper, in attitudes of extreme weariness; a plain-looking lass bustled about with a sleepy child of two; and the landlady began to derange the pots upon the stove, and set some beefsteak to grill."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 146
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[86]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-146"
    "translation_ja": "ストーブの隙間と通風口に赤い火がにじむほか、あたりは真っ暗だった。そこで女将は新しい客の顔を見るためランプに火を入れた。われわれの姿がお気に召した様子とは言いがたかったから、もう一度追い払われずに済んだのは、この暗さのおかげだと思う。そこはがらんとした広い部屋で、「音楽」と「絵画」の二枚の寓意版画と、公衆の場の酩酊を禁ずる法律の写しが飾られていた。片側に小さな酒場のカウンターがあり、瓶が半ダースほど並んでいた。労働者が二人くたびれ果てた格好で夕食を待ち、器量はもうひとつの娘が眠たそうな二歳の子を抱えて動き回った。女将はストーブの鍋を動かし、ビフテキを網に載せた。"
    "translation_status": "reviewed"
  - "id": "voy-147"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘These gentlemen are pedlars?’ she asked sharply. And that was all the conversation forthcoming. We began to think we might be pedlars after all. I never knew a population with so narrow a range of conjecture as the innkeepers of Pont-sur-Sambre. But manners and bearing have not a wider currency than bank-notes. You have only to get far enough out of your beat, and all your accomplished airs will go for nothing. These Hainaulters could see no difference between us and the average pedlar. Indeed we had some grounds for reflection while the steak was getting ready, to see how perfectly they accepted us at their own valuation, and how our best politeness and best efforts at entertainment seemed to fit quite suitably with the character of packmen. At least it seemed a good account of the profession in France, that even before such judges we could not beat them at our own weapons."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 147
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[87]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-147"
    "translation_ja": "「お客さんがた、行商の方ですね？」と彼女はきつい調子で聞いた。会話はあとにも先にもこれだけ。われわれも、ほんとうに行商人なのかもしれないと思えてきた。ポン＝シュル＝サンブルの宿屋ほど想像の幅の狭いひとびとは知らない。だが物腰や立ち居振る舞いも紙幣より遠くまで通用するものではない。いつもの行動半径から十分に離れさえすれば、どんなに洗練された身のこなしも通用しなくなる。このエノーの人たちには、われわれと並の行商人との違いがまるで見えなかった。肉が焼けるあいだ、彼らがどんなに自然にみずからの見積りどおりのわれわれを受け入れ、こちらが精いっぱい礼を尽くし場を楽しませようとしたことまで荷を背負う行商人という役柄にぴたりとはまっているかを眺めていると、たしかに考えさせられた。少なくとも、自分たちの得物を使ってさえこうした審判の前では彼らに勝てなかったというのは、フランス行商界の評判を上げる話ではあった。"
    "translation_status": "reviewed"
  - "id": "voy-148"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At last we were called to table. The two hinds (and one of them looked sadly worn and white in the face, as though sick with over-work and under-feeding) supped off a single plate of some sort of bread-berry, some potatoes in their jackets, a small cup of coffee sweetened with sugar-candy, and one tumbler of swipes. The landlady, her son, and the lass aforesaid, took the same. Our meal was quite a banquet by comparison. We had some beefsteak, not so tender as it might have been, some of the potatoes, some cheese, an extra glass of the swipes, and white sugar in our coffee."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 148
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[88]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-148"
    "translation_ja": "ようやく食卓に呼ばれた。農夫二人（一人は酷使と栄養不足で病んでいるかのように、痛々しくやつれた青白い顔をしていた）の夕食は、パン粥のたぐいが一皿に、皮つきのじゃがいも、氷砂糖で甘くした小さなカップ一杯のコーヒーと、薄いビールがコップに一杯だった。女将と息子とさっきの娘も同じものを食べた。それに比べればこちらは宴席だった。いささか柔らかみに欠けるビフテキに、例のじゃがいもをいくつか、チーズ、薄いビールも一杯余分に、そしてコーヒーには白砂糖がついた。"
    "translation_status": "reviewed"
  - "id": "voy-149"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "You see what it is to be a gentleman—I beg your pardon, what it is to be a pedlar. It had not before occurred to me that a pedlar was a great man in a labourer’s ale-house; but now that I had to enact the part for an evening, I found that so it was. He has in his hedge quarters somewhat the same pre-eminency as the man who takes a private parlour in an hotel. The more you look into it, the more infinite are the class distinctions among men; and possibly, by a happy dispensation, there is no one at all at the bottom of the scale; no one but can find some superiority over somebody else, to keep up his pride withal."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 149
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[89]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-149"
    "translation_ja": "これで紳士というものの、いや失礼、行商人というものの待遇がおわかりだろう。労働者向けの居酒屋で行商人が偉い人物だとは、これまで思い及ばなかったが、ひと晩その役を演じてみると、なるほどそうであった。粗末な宿における彼の優越は、ホテルで専用の居間を取る客のそれにいくらか似ている。見れば見るほど人間どうしの階級の区別は果てしがない。あるいはありがたい天の配剤で、序列の底には誰ひとりいないのかもしれない。誰もがどこかで誰かよりは勝っていて、そこを頼りに誇りを保てるのかもしれない。"
    "translation_status": "reviewed"
  - "id": "voy-150"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We were displeased enough with our fare. Particularly the Cigarette, for I tried to make believe that I was amused with the adventure, tough beefsteak and all. According to the Lucretian maxim, our steak should have been flavoured by the look of the other people’s bread-berry. But we did not find it so in practice. You may have a head-knowledge that other people live more poorly than yourself, but it is not agreeable—I was going to say, it is against the etiquette of the universe—to sit at the same table and pick your own superior diet from among their crusts. I had not seen such a thing done since the greedy boy at school with his birthday cake. It was odious enough to witness, I could remember; and I had never thought to play the part myself. But there again you see what it is to be a pedlar."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 150
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[90]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-150"
    "translation_ja": "とはいえわれわれは食事がだいぶ不服だった。とりわけシガレット号の主は不服だった。私の方は固いビフテキもひっくるめてこの冒険を面白がっているつもりになろうとしていたからだ。ルクレティウスの格言に従えば、人のパン粥を見た分だけこちらのステーキも味がよくなるはずだった。だが実際はそうならなかった。他人が自分より貧しく暮らすことは頭で知りうる。しかし同じ食卓について、皆のパンの耳にまじって、自分だけが上等なものを選り出して食べるのは、気持ちのよいものではない。宇宙の作法に反するとさえ言おうとしたほどだ。学校の食いしん坊がひとりで誕生日のケーキを食べて以来、そんなことが行われるのを見たことはなかった。見ているだけでも十分いやだったと覚えている。まさか自分がその役をやろうとは思わなかった。だがここにも、行商人であるとはどういうことかがよく出ている。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 58
          "end": 67
          "exact": "Cigarette"
  - "id": "voy-151"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There is no doubt that the poorer classes in our country are much more charitably disposed than their superiors in wealth. And I fancy it must arise a great deal from the comparative indistinction of the easy and the not so easy in these ranks. A workman or a pedlar cannot shutter himself off from his less comfortable neighbours. If he treats himself to a luxury, he must do it in the face of a dozen who cannot. And what should more directly lead to charitable thoughts? . . . Thus the poor man, camping out in life, sees it as it is, and knows that every mouthful he puts in his belly has been wrenched out of the fingers of the hungry."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 151
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[91]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-151"
    "translation_ja": "わが国の貧しい階級のほうが、富に勝る階級よりはるかに慈善の心に富むのは疑いがない。その主たる理由は、前者では楽な暮らしとそう楽でない暮らしがさほど明確に区別されないことにあるらしい。職人にも行商人にも、自分より苦しい近所の人々とのあいだに鎧戸を下ろすことはできない。ちょっとした贅沢をしようとすれば、それのできない十人あまりの顔の前でせねばならぬ。慈しみの心にこれほど直接通じるものがあろうか。……こうして人生に野宿する貧しい男には、人生があるがままに見えている。腹に入れるひと口ひと口が、飢えた人間の指からもぎ離されたものだと知っている。"
    "translation_status": "reviewed"
  - "id": "voy-152"
    "section_id": "ch-06_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But at a certain stage of prosperity, as in a balloon ascent, the fortunate person passes through a zone of clouds, and sublunary matters are thenceforward hidden from his view. He sees nothing but the heavenly bodies, all in admirable order, and positively as good as new. He finds himself surrounded in the most touching manner by the attentions of Providence, and compares himself involuntarily with the lilies and the skylarks. He does not precisely sing, of course; but then he looks so unassuming in his open landau! If all the world dined at one table, this philosophy would meet with some rude knocks."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 152
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[92]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-152"
    "translation_ja": "だが富裕のある段階にさしかかると、果報者は気球が昇るように雲の層を通り抜け、それ以後、月より下の出来事は目に入らなくなる。見えるのは天上のものだけ。それらはみなみごとに整頓され、まるで新品同様だ。自分がこのうえなくありがたい具合に摂理の心遣いに取り巻かれているのを認め、思わず自分を野の百合や雲雀になぞらえる。もちろん、ほんとうに歌うわけではない。だが幌を開いた四輪馬車に乗った姿の、なんと慎ましく見えることか！　もし世界じゅうが一つの食卓で飯を食えば、この哲学は手荒な目に遭うにちがいない。"
    "translation_status": "reviewed"
  - "id": "voy-153"
    "section_id": "ch-06_b"
    "kind": "heading"
    "origin": "source"
    "source_text": "THE TRAVELLING MERCHANT"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 153
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/h3[2]"
        "printed_page": "51"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-153"
    "translation_ja": "旅まわりの商人"
    "translation_status": "reviewed"
  - "id": "voy-154"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Like the lackeys in Molière’s farce, when the true nobleman broke in on their high life below stairs, we were destined to be confronted with a real pedlar. To make the lesson still more poignant for fallen gentlemen like us, he was a pedlar of infinitely more consideration than the sort of scurvy fellows we were taken for: like a lion among mice, or a ship of war bearing down upon two cock-boats. Indeed, he did not deserve the name of pedlar at all: he was a travelling merchant."
    "source_languages":
      - "en"
    "source_locations":

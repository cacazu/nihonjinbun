  - "id": "voy-368"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At Creil, as at Noyon, Saint Joseph seemed a favourite saint on the score of punctuality. Day and hour can be specified; and grateful people do not fail to specify them on a votive tablet, when prayers have been punctually and neatly answered. Whenever time is a consideration, Saint Joseph is the proper intermediary. I took a sort of pleasure in observing the vogue he had in France, for the good man plays a very small part in my religion at home. Yet I could not help fearing that, where the Saint is so much commanded for exactitude, he will be expected to be very grateful for his tablet."
    "source_languages":
      - "en"
    "source_locations":

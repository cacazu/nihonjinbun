    "bilingual_ja": "一九〇四年Chatto & Windus新版（PG #534）について、標題紙・題辞・序・原目次・献辞からポントワーズで舟旅を終える段落まで、英仏語の原文と日本語を全402単位順に独立対照した。本文由来の全401単位を底本HTMLから取り直し、原図で判読した表題・二艇の舟名一単位と併せて順序と底本に一致することを確認。二十一章、四小節、二つの詩行群、マーヴェルの署名、フランス語の演目全四段落、原目次の全22参照先と両言語の正確な文字範囲、底本に明示された印刷頁ラベル23個を確認した。片方のカヌーとその乗り手の呼称、場面ごとの話者、川の比喩、歴史・宗教・芸術の言及の意味を個別に校合。原口絵と標題紙の別の装飾図の原寸JPEGを実見し、出所・図柄・印字・クレジットを確認。別作品集所載の後日談はこの版に混入させない。"
    "japanese_readthrough_ja": "対照後に日本語だけの全402単位を改めて掲載順で通読。アントウェルペンからベルギー・フランスの運河をたどるときの場面と舟の動き、宿と町の人々の会話、落水とその後、旅が観察から内省へ移る終盤の連続性を確認。調子をならして作者の声を消さず、話者の取り違え、逐語訳の不明瞭な係り受け、慣用句と語の照応を調整し、変更箇所を原文に戻って再確認した。原詩の改行、原目次にない見出し、電子版のaltと版面で読める文字の区別、図版配置を維持した。"

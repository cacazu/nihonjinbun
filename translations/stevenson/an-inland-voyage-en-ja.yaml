    "kind": "paragraph"
    "origin": "source"
    "source_text": "The great volume, the indefatigable purpose of the river, held the mind in chain. It seemed now so sure of its end, so strong and easy in its gait, like a grown man full of determination. The surf was roaring for it on the sands of Havre."
    "source_languages":

      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-368"
    "translation_ja": "クレイユでもノワイヨン同様、聖ヨセフが時間に正確なことから人気の聖人であるらしかった。日も時刻も指定できる。祈りが約束どおりきちんとかなえられると、感謝する人は奉納板に忘れずそれを明記する。期限のことが気になる時には聖ヨセフこそ適切な取り次ぎ手だ。この善人は本国での私の宗教にはひどく脇役しかつとめないので、フランスで人気を博しているのを見るのに一種の喜びを覚えた。だが聖人が時間の正確さでこれほどおほめにあずかるところでは、板を頂戴したことに聖人のほうでもよほど感謝するのが当然とされるのではないかと恐れずにはいられなかった。"
    "translation_status": "reviewed"
  - "id": "voy-369"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This is foolishness to us Protestants; and not of great importance anyway. Whether people’s gratitude for the good gifts that come to them be wisely conceived or dutifully expressed, is a secondary matter, after all, so long as they feel gratitude. The true ignorance is when a man does not know that he has received a good gift, or begins to imagine that he has got it for himself. The self-made man is the funniest windbag after all! There is a marked difference between decreeing light in chaos, and lighting the gas in a metropolitan back-parlour with a box of patent matches; and do what we will, there is always something made to our hand, if it were only our fingers."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 369
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[292]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-369"
    "translation_ja": "これはわれわれプロテスタントには愚かに映る。だがどのみちたいしたことではない。授かったよき贈り物への感謝が賢く思い描かれ、務めにかなう形で表されるかどうかは、感謝を感じてさえいるなら、結局二の次のことだ。本当の無知は、よい贈り物を受けたのにそうと知らないとき、あるいは自分で自分に手に入れたのだと思いはじめる時にある。自力で自分をつくった男なるものは結局いちばんおかしなほら吹きだ！　混沌の中に「光あれ」と命じるのと、特許マッチ一箱で大都会の奥座敷のガス灯に火をつけるのとでは、著しい違いがある。われわれが何をしようと、すでに手許にこしらえてあるものが必ず何かある。たとえそれが自分の指だけでも。"
    "translation_status": "reviewed"
  - "id": "voy-370"
    "section_id": "ch-19"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But there was something worse than foolishness placarded in Creil Church. The Association of the Living Rosary (of which I had never previously heard) is responsible for that. This Association was founded, according to the printed advertisement, by a brief of Pope Gregory Sixteenth, on the 17th of January 1832: according to a coloured bas-relief, it seems to have been founded, sometime other, by the Virgin giving one rosary to Saint Dominic, and the Infant Saviour giving another to Saint Catharine of Siena. Pope Gregory is not so imposing, but he is nearer hand. I could not distinctly make out whether the Association was entirely devotional, or had an eye to good works; at least it is highly organised: the names of fourteen matrons and misses were filled in for each week of the month as associates, with one other, generally a married woman, at the top for zélatrice: the leader of the band. Indulgences, plenary and partial, follow on the performance of the duties of the Association. ‘The partial indulgences are attached to the recitation of the rosary.’ On ‘the recitation of the required dizaine,’ a partial indulgence promptly follows. When people serve the kingdom of heaven with a pass-book in their hands, I should always be afraid lest they should carry the same commercial spirit into their dealings with their fellow-men, which would make a sad and sordid business of this life."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 370
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[293]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-370"
    "translation_ja": "だがクレイユの教会には愚かさより悪いものが掲示されていた。「生けるロザリオの会」（それまで私は聞いたこともなかった）がその責めを負う。印刷された広告によれば、この会は一八三二年一月十七日、教皇グレゴリウス十六世の小勅書によって創立された。彩色された浅浮彫によれば、どこか別の時、聖母が聖ドミニコにロザリオを一つ与え、幼子なる救い主がシエナの聖カタリナにもう一つ与えたことで創設されたらしい。教皇グレゴリウスのほうが立派さは劣るが、時代はこちらに近い。この会がまったく祈祷だけを事とするのか、善行をも狙っているのか、はっきりとはわからなかった。少なくとも組織は精巧だ。一か月の各週について夫人と娘の名が十四人、会員として記入され、筆頭にもう一人、ふつうは既婚の女性が「熱心係」、すなわち一隊の長として立てられていた。会の務めを果たすと全免償と部分免償がそれに続く。「部分免償はロザリオの祈りの唱和に付随する」。そして「定められた一連の十回の唱和」には、速やかに部分免償が付随する。通帳を手に天の国に仕える人々を見ると、私は同じ商売根性を同胞との取引にまで持ち込むのをいつも恐れる。それでは人生がもの悲しくさもしい商売になろう。"
    "translation_status": "reviewed"

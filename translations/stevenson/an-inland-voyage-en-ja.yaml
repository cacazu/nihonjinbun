  - "id": "voy-184"
    "section_id": "ch-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At Landrecies the rain still fell and the wind still blew; but we found a double-bedded room with plenty of furniture, real water-jugs with real water in them, and dinner: a real dinner, not innocent of real wine. After having been a pedlar for one night, and a butt for the elements during the whole of the next day, these comfortable circumstances fell on my heart like sunshine. There was an English fruiterer at dinner, travelling with a Belgian fruiterer; in the evening at the café, we watched our compatriot drop a good deal of money at corks; and I don’t know why, but this pleased us."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 184
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[121]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-184"
    "translation_ja": "ランドルシーでもまだ雨が降り、まだ風が吹いた。だが寝台が二つで家具も豊富な部屋があり、本物の水差しに本物の水が入っていて、夕食があった。本物の夕食で、本物の葡萄酒に無縁でもなかった。ひと晩は行商人として過ごし、その翌日はまる一日風雨のなぶりものになった身に、その心地よい境遇は陽光のように心に降りそそいだ。夕食には英国の果物商がベルギーの果物商と旅をして来合わせていた。夜、カフェでわれわれは、この同国人がコルクを使った賭け遊びにけっこうな金額をすってしまうのを見た。なぜだか、われわれはそれをうれしく思った。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"

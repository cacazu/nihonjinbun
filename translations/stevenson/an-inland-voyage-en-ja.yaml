        "original_unit_id": "voy-359"
    "translation_ja": "この放心状態の強さと言っていけないなら深さと言っておこう、それには不思議な実践形而上学が一件ついて回った。哲学者が〈私〉と〈私でないもの〉、自我と非我と呼ぶものが、好むと好まざるとにかかわらず心を占めた。ふだん期待するよりも私が少なく、私でないものが多かった。私は漕ぐ仕事をする誰か別人を傍観した。足掛けを踏ん張っているのも他人の足のようだった。自分の体は私にとって、カヌーや川や岸よりも親密なものとは思えなかった。それだけではない。私の心の内側の何か、脳の一部、正真正銘自分である領土の一州が、忠誠を放り出してひとり立ちした。あるいは漕いでいるあの他人の側についたのかもしれない。私は自分の一隅のひどく小さなものに縮まっていた。自分の頭蓋骨の中の孤独な人だった。考えが呼びもせず現れた。それは私の考えではなく明らかに他人のもので、私は風景の一部のように考察した。要するに私は、実生活上好都合なぎりぎりまで涅槃に近づいたと思う。そうだとすれば仏教徒の皆さんに心から祝辞を呈したい。快い状態である。精神のきらめきとはあまり両立せず、金銭上大いに儲かるものでもない。だがひじょうに穏やかで、金色で、何も詮索せず、不安にわずらわされずにすむものだ。自分がべろんべろんに酔いつぶれながら、なおそれを楽しむためにしらふでいると想像すれば、一番よくわかるだろう。戸外で働く者は一日のかなりの部分をこの恍惚の昏迷のうちに過ごすにちがいないと思う。これで彼らのすぐれた沈着と忍耐の説明がつく。こちらにもっとよい楽園がただであるのに、阿片チンキに金をかけるとはもったいない！"
    "translation_status": "reviewed"

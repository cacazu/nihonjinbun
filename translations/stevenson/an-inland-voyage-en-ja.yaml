  - "id": "voy-161"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On the whole, I was not much hurt at being taken for a pedlar. I might think that I ate with greater delicacy, or that my mistakes in French belonged to a different order; but it was plain that these distinctions would be thrown away upon the landlady and the two labourers. In all essential things we and the Gilliards cut very much the same figure in the ale-house kitchen. M. Hector was more at home, indeed, and took a higher tone with the world; but that was explicable on the ground of his driving a donkey-cart, while we poor bodies tramped afoot. I daresay, the rest of the company thought us dying with envy, though in no ill sense, to be as far up in the profession as the new arrival."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 161
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[100]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-161"
    "translation_ja": "総じていえば、行商人と見られたことは私にはたいして苦痛でなかった。食べ方にしてももう少し洗練されているとか、フランス語を間違うにしても種類が違うとか、自分では思うかもしれない。だが女将と農夫二人にそんな区別など猫に小判なのは明らかだった。肝心な点で、居酒屋の台所におけるわれわれとジリアール一家の見え方はほとんど同じだった。もっともエクトール氏のほうがずっと水を得た魚で、世間に対して物言いが大きかったが、哀れなわれわれがてくてく歩くところを、彼はロバの荷車で行くのだからと説明がつく。ほかの客たちは、われわれが、べつに悪意はないにしても、新来の客ほど商売で出世したいと、羨ましさに死にそうなものだと思っていたろう。"
    "translation_status": "reviewed"
  - "id": "voy-162"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And of one thing I am sure: that every one thawed and became more humanised and conversible as soon as these innocent people appeared upon the scene. I would not very readily trust the travelling merchant with any extravagant sum of money; but I am sure his heart was in the right place. In this mixed world, if you can find one or two sensible places in a man—above all, if you should find a whole family living together on such pleasant terms—you may surely be satisfied, and take the rest for granted; or, what is a great deal better, boldly make up your mind that you can do perfectly well without the rest; and that ten thousand bad traits cannot make a single good one any the less good."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 162
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[101]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-162"
    "translation_ja": "ひとつ確かなことがある。あの屈託のない一家の登場と同時に、その場のみんなはうちとけ、ずっと人間らしく、話し相手らしくなったのだ。この旅まわりの商人にべらぼうな大金を預けようとはそう簡単に思わない。だが心根は確かな人だった。この善悪の入りまじる世で、人間にひとつふたつ人情の通うところを見つけたなら、とりわけ、一家そろってあれほど気持ちよく暮らしているのを見つけたなら、まず満足してあとは信用してもよかろう。いや、もっといいのは、あとはなくともいっこうに困らず、一万の悪いところを集めても、一つのよいところのよさは少しも減らぬ、と腹を決めることだ。"
    "translation_status": "reviewed"
  - "id": "voy-163"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was getting late. M. Hector lit a stable lantern and went off to his cart for some arrangements; and my young gentleman proceeded to divest himself of the better part of his raiment, and play gymnastics on his mother’s lap, and thence on to the floor, with accompaniment of laughter."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 163
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[102]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-163"
    "translation_ja": "夜が更けた。エクトール氏は厩用の角灯に火をともすと荷車に何かの始末をつけに行き、わが若君は着物の大部分を脱ぎ捨て、笑い声を伴奏にお母さんの膝の上で体操をはじめ、そこからさらに床へと転がった。"
    "translation_status": "reviewed"
  - "id": "voy-164"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Are you going to sleep alone?’ asked the servant lass."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 164
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[103]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-164"
    "translation_ja": "「ひとりで寝るの？」と宿の娘がきいた。"
    "translation_status": "reviewed"
  - "id": "voy-165"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘There’s little fear of that,’ says Master Gilliard."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 165
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[104]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-165"
    "translation_ja": "「そんな心配はまずないね」とジリアール家の坊ちゃん。"
    "translation_status": "reviewed"
  - "id": "voy-166"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘You sleep alone at school,’ objected his mother. ‘Come, come, you must be a man.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 166
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[105]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-166"
    "translation_ja": "「学校じゃひとりで寝るでしょう」と母親が異議を唱えた。「さあさ、男の子らしくしなくちゃ」"
    "translation_status": "reviewed"
  - "id": "voy-167"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But he protested that school was a different matter from the holidays; that there were dormitories at school; and silenced the discussion with kisses: his mother smiling, no one better pleased than she."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 167
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[106]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-167"
    "translation_ja": "だが坊ちゃんは学校と休みは違う、学校には共同寝室があると抗弁し、キスを重ねてこの議論を封じた。母親はにこにこしていた。誰よりうれしいのは彼女自身だった。"
    "translation_status": "reviewed"
  - "id": "voy-168"
    "section_id": "ch-06_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There certainly was, as he phrased it, very little fear that he should sleep alone; for there was but one bed for the trio. We, on our part, had firmly protested against one man’s accommodation for two; and we had a double-bedded pen in the loft of the house, furnished, beside the beds, with exactly three hat-pegs and one table. There was not so much as a glass of water. But the window would open, by good fortune."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"

  - "id": "voy-093"
    "section_id": "ch-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The rain took off near Laeken. But the sun was already down; the air was chill; and we had scarcely a dry stitch between the pair of us. Nay, now we found ourselves near the end of the Allée Verte, and on the very threshold of Brussels, we were confronted by a serious difficulty. The shores were closely lined by canal boats waiting their turn at the lock. Nowhere was there any convenient landing-place; nowhere so much as a stable-yard to leave the canoes in for the night. We scrambled ashore and entered an estaminet where some sorry fellows were drinking with the landlord. The landlord was pretty round with us; he knew of no coach-house or stable-yard, nothing of the sort; and seeing we had come with no mind to drink, he did not conceal his impatience to be rid of us. One of the sorry fellows came to the rescue. Somewhere in the corner of the basin there was a slip, he informed us, and something else besides, not very clearly defined by him, but hopefully construed by his hearers."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 93
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[38]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-093"
    "translation_ja": "ラーケンの近くで雨はあがった。けれども日はとっくに落ち、空気は冷え、二人合わせて乾いた糸一筋ろくになかった。そればかりか、いまアレ・ヴェルト、緑の並木道のはずれ近く、ブリュッセルのまさに戸口に来て、困った問題に直面した。岸は、閘門の順番を待つ運河船で埋めつくされていた。どこにも都合よく上がれる場所がない。一晩カヌーを置かせてもらえる厩の庭すらない。這うように陸に上がり、ある居酒屋に入ると、しょぼくれた男が数人、主人と一緒に飲んでいた。主人はわれわれにずけずけ物を言った。馬車小屋だの厩の庭だのは知らない、さようなものは何も聞かない。しかもこちらが飲むつもりで来たのではないと見て取ると、さっさと厄介払いしたい様子を隠そうともしなかった。しょぼくれた中の一人が助け舟を出した。船溜まりのどこか隅に船揚げの斜路があるそうだった。そのほかにも何かある。本人がくっきり定義したのではなかったが、聞き手は希望的に解釈した。"
    "translation_status": "reviewed"
    "annotations":

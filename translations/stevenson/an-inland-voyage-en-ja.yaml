  - "id": "voy-117"
    "section_id": "ch-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It is an odd thing, how happily two people, if there are two, can live in a place where they have no acquaintance. I think the spectacle of a whole life in which you have no part paralyses personal desire. You are content to become a mere spectator. The baker stands in his door; the colonel with his three medals goes by to the café at night; the troops drum and trumpet and man the ramparts, as bold as so many lions. It would task language to say how placidly you behold all this. In a place where you have taken some root, you are provoked out of your indifference; you have a hand in the game; your friends are fighting with the army. But in a strange town, not small enough to grow too soon familiar, nor so large as to have laid itself out for travellers, you stand so far apart from the business, that you positively forget it would be possible to go nearer; you have so little human interest around you, that you do not remember yourself to be a man. Perhaps, in a very short time, you would be one no longer. Gymnosophists go into a wood, with all nature seething around them, with romance on every side; it would be much more to the purpose if they took up their abode in a dull country town, where they should see just so much of humanity as to keep them from desiring more, and only the stale externals of man’s life. These externals are as dead to us as so many formalities, and speak a dead language in our eyes and ears. They have no more meaning than an oath or a salutation. We are so much accustomed to see married couples going to church of a Sunday that we have clean forgotten what they represent; and novelists are driven to rehabilitate adultery, no less, when they wish to show us what a beautiful thing it is for a man and a woman to live for each other."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 117
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[60]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-117"
    "translation_ja": "知人の一人もいない土地に二人、ただ二人でさえあれば、どんなに楽しく暮らせるか、妙なものである。自分のまるであずかり知らぬ人生の総体を眺めていると、あれをしたいこれをしたいという気持ちがしびれるのだと思う。ただ観客でいるので満足する。パン屋は戸口に立ち、三つ勲章をつけた大佐が夕方カフェへ通り過ぎる。兵隊たちは太鼓とらっぱを鳴らし、一人ひとり獅子のように勇ましく城壁を守る。それをいかに平らな心で眺めるかは、言葉にあまる。少しでも根を下ろした土地なら無関心ではいられない。自分も勝負に一枚かんでいる。軍勢には友人たちが加わって戦っている。だが、たちまち顔なじみになるほど小さくもなく、よそ者をあてこんで町をこしらえるほど大きくもない、見知らぬ町では、騒ぎの外にはるかに離れて立つので、もっと近寄れることさえすっかり忘れる。周囲に人として心を動かすものがあまりに少ないので、自分が人間であることを思い出さない。そう長くもないうち、ほんとうにそうでなくなるかもしれぬ。裸行の苦行者は森に入るが、そこでは自然が周囲に沸き立ち、四方に冒険物語が待っている。むしろ退屈な田舎町に居を定めるほうがよほど目的にかなう。そこなら人間というものを、それ以上見たいと思わせぬのにちょうど足りるだけ、しかも人間生活の古びた上っ面だけ見ることになる。それらの外形は決まり文句と同じほどわれわれには死んだもので、目にも耳にも死語で語りかける。誓いのひと言か会釈ほどの意味しかない。夫婦が日曜に連れ立って教会に行くのを見慣れすぎて、そこに何が表されているかすっかり忘れてしまった。おかげで小説家は、ひとりの男とひとりの女がたがいのために生きることの美しさを見せたいとき、事もあろうに姦通の名誉を回復せねばならない。"
    "translation_status": "reviewed"

    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-245"
    "translation_ja": "「それにヴァイオリンみたいに磨き上げてある」と一人の元老院議員が付け足した。"
    "translation_status": "reviewed"
  - "id": "voy-246"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘One has only to stretch the cords,’ concluded another, ‘and then tum-tumty-tum’—he imitated the result with spirit."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 246
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[179]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-246"
    "translation_ja": "「あとは弦を張るだけだ」と別の一人がむすんだ。「そうすりゃタンタラタン」――結果まで勢いよくまねて聞かせた。"
    "translation_status": "reviewed"
  - "id": "voy-247"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Was not this a graceful little ovation? Where this people finds the secret of its pretty speeches, I cannot imagine; unless the secret should be no other than a sincere desire to please? But then no disgrace is attached in France to saying a thing neatly; whereas in England, to talk like a book is to give in one’s resignation to society."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 247
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[180]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-247"
    "translation_ja": "なかなか優美な小さな喝采ではないか。この国の人たちが気の利いた挨拶の秘訣をどこで得るのか、想像もできない。それとも秘訣とは、人を喜ばせたいという偽りのない気持ちにほかならないのだろうか？　とはいえフランスでは、物を巧みに言って恥になることはない。これにひきかえイングランドでは、本に書いたようなことを言うのは社交界に辞表を出すことなのだ。"
    "translation_status": "reviewed"
  - "id": "voy-248"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The old gentleman in the blouse stole into the coach-house, and somewhat irrelevantly informed the Cigarette that he was the father of the three girls and four more: quite an exploit for a Frenchman."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 248
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[181]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-248"
    "translation_ja": "例の上っ張りの老紳士がこっそり車庫へ入って、べつに話のつながりもなくシガレット号の主に、自分はあの三人の父親で、ほかに娘が四人いると知らせた。フランス人にはなかなかの偉業だ。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 99
          "end": 108
          "exact": "Cigarette"
  - "id": "voy-249"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘You are very fortunate,’ answered the Cigarette politely."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 249
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[182]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-249"
    "translation_ja": "「それはお幸せですね」とシガレット号の主は礼儀正しく答えた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 39
          "end": 48
          "exact": "Cigarette"
  - "id": "voy-250"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And the old gentleman, having apparently gained his point, stole away again."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 250
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[183]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-250"
    "translation_ja": "老紳士はこれで目的を達したらしく、またこっそり出て行った。"
    "translation_status": "reviewed"
  - "id": "voy-251"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We all got very friendly together. The girls proposed to start with us on the morrow, if you please! And, jesting apart, every one was anxious to know the hour of our departure. Now, when you are going to crawl into your canoe from a bad launch, a crowd, however friendly, is undesirable; and so we told them not before twelve, and mentally determined to be off by ten at latest."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 251
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[184]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-251"
    "translation_ja": "われわれはみなすっかり仲よくなった。娘たちは、なんと翌朝私たちと一緒に出発しようと申し出た！　冗談はともかく、一同は出発時刻を知りたがった。ところが条件の悪い船出の場でカヌーに這いこむのには、見物人の群れはどんなに友好的でもありがたくない。そこで十二時より早くはならぬと言い、心の中では遅くとも十時には出ようと決めた。"
    "translation_status": "reviewed"
  - "id": "voy-252"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Towards evening, we went abroad again to post some letters. It was cool and pleasant; the long village was quite empty, except for one or two urchins who followed us as they might have followed a menagerie; the hills and the tree-tops looked in from all sides through the clear air; and the bells were chiming for yet another service."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 252
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[185]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-252"
    "translation_ja": "夕方近く、私たちは手紙を何通か投函するため、ふたたび外へ出た。涼しくて気持ちがよかった。長い村には人の姿がすっかり消えて、動物の見世物について行くようにわれわれのあとを追うわんぱくが一人か二人いたばかり。澄んだ大気の向こうから丘と梢が四方に顔をのぞかせ、またしても次の礼拝の鐘が鳴っていた。"
    "translation_status": "reviewed"
  - "id": "voy-253"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Suddenly we sighted the three girls standing, with a fourth sister, in front of a shop on the wide selvage of the roadway. We had been very merry with them a little while ago, to be sure. But what was the etiquette of Origny? Had it been a country road, of course we should have spoken to them; but here, under the eyes of all the gossips, ought we to do even as much as bow? I consulted the Cigarette."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 253
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[186]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-253"
    "translation_ja": "とつぜん、街道の広い路肩に面した店先に例の三人と四人目の姉妹が立っていると気づいた。なるほど少し前には一緒にたいそう楽しくやった。だがオリニーの作法はどうなっている？　田舎道なら、もちろん声をかけよう。だがこの場所で、うわさ好きの人々にみな見られながら、お辞儀ぐらいはしていいものだろうか。私はシガレット号の主に相談した。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 392
          "end": 401
          "exact": "Cigarette"
  - "id": "voy-254"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Look,’ said he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 254
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[187]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-254"
    "translation_ja": "「見てごらん」と彼は言った。"
    "translation_status": "reviewed"
  - "id": "voy-255"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I looked. There were the four girls on the same spot; but now four backs were turned to us, very upright and conscious. Corporal Modesty had given the word of command, and the well-disciplined picket had gone right-about-face like a single person. They maintained this formation all the while we were in sight; but we heard them tittering among themselves, and the girl whom we had not met laughed with open mouth, and even looked over her shoulder at the enemy. I wonder was it altogether modesty after all? or in part a sort of country provocation?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 255
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[188]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-255"
    "translation_ja": "見た。四人の娘は同じところにいた。ただし今はこちらに四つの背中が、いかにも意識してぴんと伸ばして向けられていた。〈慎み〉伍長が号令をかけ、訓練の行き届いた哨戒隊はただ一人のように回れ右をしたのだ。われわれが見えている間じゅうこの隊形を保った。だが内輪でくすくす笑いが聞こえ、まだ紹介されていなかった娘は大口を開けて笑い、肩越しに敵の側をのぞきさえした。はたしてあれはすべて慎みだったのか。それとも幾分は田舎風の誘いかけでもあったのか？"
    "translation_status": "reviewed"
  - "id": "voy-256"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As we were returning to the inn, we beheld something floating in the ample field of golden evening sky, above the chalk cliffs and the trees that grow along their summit. It was too high up, too large, and too steady for a kite; and as it was dark, it could not be a star. For although a star were as black as ink and as rugged as a walnut, so amply does the sun bathe heaven with radiance, that it would sparkle like a point of light for us. The village was dotted with people with their heads in air; and the children were in a bustle all along the street and far up the straight road that climbs the hill, where we could still see them running in loose knots. It was a balloon, we learned, which had left Saint Quentin at half-past five that evening. Mighty composedly the majority of the grown people took it. But we were English, and were soon running up the hill with the best. Being travellers ourselves in a small way, we would fain have seen these other travellers alight."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 256
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[189]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-256"
    "translation_ja": "宿へ戻る途中、白亜の崖とその頂に生え並ぶ木の上、夕暮れの黄金の広い空に何か浮かんでいるのを見た。凧にしては高く、大きく、落ち着きすぎている。黒く見えるから星でもない。たとえ星そのものが墨のように黒く胡桃のようにごつごつしていても、太陽があれほど天を輝きに浸すので、われわれには光の点ときらめくはずだからだ。村には天を仰ぐ人影が点在し、子供たちは通りじゅうで騒ぎ、丘を登る一本道のずっと上まで、ばらばらのかたまりで走っているのがなお見えた。その夕方五時半にサン＝カンタンを発った気球だと聞いた。おとなの大半は驚くほど平然と受け取った。だがわれわれはイギリス人なので、まもなく人に負けじと丘を駆け上った。こちらも小規模ながら旅人であるから、あちらの旅人が降り立つところが見たかった。"
    "translation_status": "reviewed"
  - "id": "voy-257"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The spectacle was over by the time we gained the top of the hill. All the gold had withered out of the sky, and the balloon had disappeared. Whither? I ask myself; caught up into the seventh heaven? or come safely to land somewhere in that blue uneven distance, into which the roadway dipped and melted before our eyes? Probably the aeronauts were already warming themselves at a farm chimney, for they say it is cold in these unhomely regions of the air. The night fell swiftly. Roadside trees and disappointed sightseers, returning through the meadows, stood out in black against a margin of low red sunset. It was cheerfuller to face the other way, and so down the hill we went, with a full moon, the colour of a melon, swinging high above the wooded valley, and the white cliffs behind us faintly reddened by the fire of the chalk kilns."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 257
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[190]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-257"
    "translation_ja": "頂に着いた時には見世物はもう終わっていた。黄金は空からすっかり色褪せ、気球は消えていた。どこへ？　と私は自分に問う。第七天に引き上げられたのか。それとも眼前で街道が下り、やがて溶けてゆく、あの青い起伏する遠景のどこかに無事降りたのか。おそらく飛行家たちはもうどこか農家の暖炉であたたまっていたろう。人の住まぬあたりの高空は寒いというから。夜はすみやかに降りた。路傍の木々と、落胆しながら草地を帰る見物人が、低く残る赤い夕映えの縁を背景に黒く浮かんだ。反対側を向くほうが朗らかな気分になれた。そうして私たちは丘を下った。木の深い谷の上高くメロン色した満月がかかり、背後の白い崖は石灰窯の火にうっすらと赤らんでいた。"
    "translation_status": "reviewed"
  - "id": "voy-258"
    "section_id": "ch-11_a"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The lamps were lighted, and the salads were being made in Origny Sainte-Benoîte by the river."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"

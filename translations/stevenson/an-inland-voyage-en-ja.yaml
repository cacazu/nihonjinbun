  - "id": "voy-103"
    "section_id": "ch-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "These were the words. They were all employed over the frivolous mercantile concerns of Belgium during the day; but in the evening they found some hours for the serious concerns of life. I may have a wrong idea of wisdom, but I think that was a very wise remark. People connected with literature and philosophy are busy all their days in getting rid of second-hand notions and false standards. It is their profession, in the sweat of their brows, by dogged thinking, to recover their old fresh view of life, and distinguish what they really and originally like, from what they have only learned to tolerate perforce. And these Royal Nautical Sportsmen had the distinction still quite legible in their hearts. They had still those clean perceptions of what is nice and nasty, what is interesting and what is dull, which envious old gentlemen refer to as illusions. The nightmare illusion of middle age, the bear’s hug of custom gradually squeezing the life out of a man’s soul, had not yet begun for these happy-starred young Belgians. They still knew that the interest they took in their business was a trifling affair compared to their spontaneous, long-suffering affection for nautical sports. To know what you prefer, instead of humbly saying Amen to what the world tells you you ought to prefer, is to have kept your soul alive. Such a man may be generous; he may be honest in something more than the commercial sense; he may love his friends with an elective, personal sympathy, and not accept them as an adjunct of the station to which he has been called. He may be a man, in short, acting on his own instincts, keeping in his own shape that God made him in; and not a mere crank in the social engine-house, welded on principles that he does not understand, and for purposes that he does not care for."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 103
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[48]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-103"
    "translation_ja": "こういう言葉であった。昼はみなベルギーの軽佻な商業上の用向きに従事しているが、晩には人生の真剣な営みに幾時間かを見つける。私の知恵についての考えが間違っているのかもしれないが、これはじつに賢い発言だったと思う。文学や哲学に携わる者は、一生、借り物の観念やまやかしの尺度を取り去るのに忙しい。額に汗し、粘り強く考え、生活に対する昔の新鮮な視野を取り戻し、本来自分がほんとうに好きなものと、余儀なく堪え忍ぶことだけを習い覚えたものとを区別するのが彼らの職業だ。ところがこの王立の水上スポーツマンたちには、その区別がまだくっきりと心に読めた。何が快くて何が不快か、何が面白く何がつまらないか、羨み深い老人たちが幻想と呼ぶあの汚れのない知覚が、まだ残っていたのだ。中年の悪夢めいた幻想、しきたりに熊のように抱かれてじわじわ魂の息の根を絞られることは、幸運の星の下のベルギー青年にはまだ始まっていなかった。商売に持つ興味など、水上スポーツへの自発的で辛抱強い愛着に比べれば些事であることを、まだよく承知していた。何を好むべきかと世間にさとされて謙虚にアーメンと唱える代わりに、自分が何を好むか知っていることは、魂を生かしておいたということだ。そのような人なら寛大にもなれるだろうし、商取引以上の意味で誠実にもなれるだろう。友を、召し置かれた社会的身分の付属物として受け入れるのでなく、自分で選び、自分なりに感じる共感で愛することができるだろう。つまりひとりの人間であり得るのだ。神が作った本来の形を保ち、自分の本能に従って行動し、自分にわからない原則により、自分の関心のない目的のため溶接された、社会の機械室のただのクランクでない人間に。"
    "translation_status": "reviewed"
  - "id": "voy-104"
    "section_id": "ch-03"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For will any one dare to tell me that business is more entertaining than fooling among boats? He must have never seen a boat, or never seen an office, who says so. And for certain the one is a great deal better for the health. There should be nothing so much a man’s business as his amusements. Nothing but money-grubbing can be put forward to the contrary; no one but"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 104
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[49]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-104"
    "translation_ja": "いったい誰か、商売のほうが舟のまわりをぶらぶらして遊ぶより面白いなどと、あえて私に言えるだろうか。そういう人は舟を見たことがないか、事務所を見たことがないに違いない。どちらが体にいいかといえば、舟遊びのほうに決まっている。人にとって自分の楽しみほど大切な務めはあるまい。これに反対して持ち出せるものは金銭漁りしかない。あえて言い返す者などあろうか、ただひとり、"
    "translation_status": "reviewed"

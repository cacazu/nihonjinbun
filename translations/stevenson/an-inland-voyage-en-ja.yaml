  - "id": "voy-296"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We lingered in Moy a good part of the day, for we were fond of being philosophical, and scorned long journeys and early starts on principle. The place, moreover, invited to repose. People in elaborate shooting costumes sallied from the château with guns and game-bags; and this was a pleasure in itself, to remain behind while these elegant pleasure-seekers took the first of the morning. In this way, all the world may be an aristocrat, and play the duke among marquises, and the reigning monarch among dukes, if he will only outvie them in tranquillity. An imperturbable demeanour comes from perfect patience. Quiet minds cannot be perplexed or frightened, but go on in fortune or misfortune at their own private pace, like a clock during a thunderstorm."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 296
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[225]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-296"
    "translation_ja": "われわれは一日のかなりの部分をモイで悠々と過ごした。達観しているのが好きで、長すぎる旅程と朝早い出立を主義として軽蔑していたからだ。そのうえ土地が休息に誘っていた。凝った狩猟服の人々が、銃と獲物入れを持って館から繰り出した。風流な楽しみを求めるこの人たちが朝の初穂をいただくあいだ、あとに残ることがそれだけで喜びだった。こうすれば誰だって貴族になり、侯爵の群れで公爵を、公爵の群れで王位にある君主を演じられる。ただ落ち着きで他人にまさればよい。びくともしない物腰は完全な忍耐から生まれる。穏やかな心は当惑させられも、怯えさせられもしない。雷雨の最中の時計よろしく、幸運のなかでも不運のなかでも、自分だけの歩度を守って進んでゆく。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 2
          "exact": "We"
  - "id": "voy-297"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We made a very short day of it to La Fère; but the dusk was falling, and a small rain had begun before we stowed the boats. La Fère is a fortified town in a plain, and has two belts of rampart. Between the first and the second extends a region of waste land and cultivated patches. Here and there along the wayside were posters forbidding trespass in the name of military engineering. At last, a second gateway admitted us to the town itself. Lighted windows looked gladsome, whiffs of comfortable cookery came abroad upon the air. The town was full of the military reserve, out for the French Autumn Manœuvres, and the reservists walked speedily and wore their formidable great-coats. It was a fine night to be within doors over dinner, and hear the rain upon the windows."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 297
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[226]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-297"
    "translation_ja": "ラ・フェールまではごく短い一日としたが、舟をしまい終える前に夕闇が降り、小雨が降りはじめていた。ラ・フェールは平地の要塞都市で、二重の城壁をめぐらす。第一と第二のあいだに空き地と小さな耕地の入り交じる一帯がある。道のそこここに工兵当局の名で立ち入りを禁ずる貼り紙があった。ようやく二つ目の門から町本体へ入った。明かりのともる窓は楽しげに見え、気持ちをなごませる料理の匂いがときおり空気を渡ってきた。町にはフランス軍の秋季演習に駆り出された予備役兵がいっぱいで、彼らは威圧的な外套を着こんで足早に歩いた。屋内で夕食の卓に着き、窓を打つ雨を聞くには上等な夜だった。"
    "translation_status": "reviewed"
  - "id": "voy-298"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The Cigarette and I could not sufficiently congratulate each other on the prospect, for we had been told there was a capital inn at La Fère. Such a dinner as we were going to eat! such beds as we were to sleep in!—and all the while the rain raining on houseless folk over all the poplared countryside! It made our mouths water. The inn bore the name of some woodland animal, stag, or hart, or hind, I forget which. But I shall never forget how spacious and how eminently habitable it looked as we drew near. The carriage entry was lighted up, not by intention, but from the mere superfluity of fire and candle in the house. A rattle of many dishes came to our ears; we sighted a great field of table-cloth; the kitchen glowed like a forge and smelt like a garden of things to eat."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 298
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[227]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-298"
    "translation_ja": "シガレット号の主と私はこの見通しをいくら祝い合っても足りなかった。ラ・フェールにはすばらしい宿があると聞いていたからだ。さあどんな晩飯を食い、どんな寝床に寝ることか！　そのあいだじゅう、見渡すかぎりポプラの並ぶ田野では宿のない連中に雨が降るというのに！　思うだけで口に水が湧いた。宿の名は森の動物の何かで、雄鹿か牡鹿か雌鹿か、どれだったか忘れた。だが近づくわれわれの目にそれがどんなに広々と、いかにも人の居られそうに見えたかは忘れない。馬車用の通用口が明るく照らされていた。わざわざ明かりを置いたのでなく、家の中の火とろうそくがありあまってこぼれたのだ。たくさんの皿の鳴る音が届いた。広々としたテーブルクロスの野が見えた。台所は鍛冶場のように輝き、食べ物の実る庭のように匂った。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 4
          "end": 13
          "exact": "Cigarette"
  - "id": "voy-299"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Into this, the inmost shrine and physiological heart of a hostelry, with all its furnaces in action, and all its dressers charged with viands, you are now to suppose us making our triumphal entry, a pair of damp rag-and-bone men, each with a limp india-rubber bag upon his arm. I do not believe I have a sound view of that kitchen; I saw it through a sort of glory: but it seemed to me crowded with the snowy caps of cookmen, who all turned round from their saucepans and looked at us with surprise. There was no doubt about the landlady, however: there she was, heading her army, a flushed, angry woman, full of affairs. Her I asked politely—too politely, thinks the Cigarette—if we could have beds: she surveying us coldly from head to foot."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 299
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[228]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-299"
    "translation_ja": "この旅宿の奥の院、生理の上での心臓、炉という炉に火が入り、調理台という調理台にごちそうが盛られているところに、いま堂々とはいって来るわれわれを想像していただきたい。雨に濡れたぼろ買いが二人、それぞれくたくたのゴム引き袋を腕に掛けて。あの台所について私の目が正常な像をとらえたとは思わない。何か後光をまとった姿で見たのだ。だが私にはコックの雪白の帽子で立て込んで見え、みな鍋からそろって振り向いて、驚いた顔でこちらを見たように思えた。女将についてはしかし間違いようがない。軍勢の先頭に立ち、顔をほてらせ、腹立たしげに用事を山ほど抱えた女がそこにいた。この人に私は丁寧に（シガレット号の主に言わせれば丁寧すぎるほどに）寝床はあるだろうかと尋ねた。彼女は頭から足まで冷ややかにこちらを見積もった。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 668
          "end": 677
          "exact": "Cigarette"
  - "id": "voy-300"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘You will find beds in the suburb,’ she remarked. ‘We are too busy for the like of you.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 300
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[229]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-300"
    "translation_ja": "「町はずれへ行けば寝る所はありますよ」と言った。「こっちはあんたがたみたいな人の相手をしていられないの」"
    "translation_status": "reviewed"
  - "id": "voy-301"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "If we could make an entrance, change our clothes, and order a bottle of wine, I felt sure we could put things right; so said I: ‘If we cannot sleep, we may at least dine,’—and was for depositing my bag."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 301
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[230]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-301"
    "translation_ja": "中に通してもらい、着替えをして葡萄酒を一本注文できたら、事を収められる自信があった。だから私は「泊まれなくても、せめて夕食ぐらいはいただけるでしょう」と言い、袋を下ろしにかかった。"
    "translation_status": "reviewed"
  - "id": "voy-302"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "What a terrible convulsion of nature was that which followed in the landlady’s face! She made a run at us, and stamped her foot."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 302
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[231]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-302"
    "translation_ja": "あとに続いて女将の顔に起きたのは、なんというすさまじい天変地異だったろう！　彼女はわれわれに駆け寄り、地団駄を踏んだ。"
    "translation_status": "reviewed"
  - "id": "voy-303"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Out with you—out of the door!’ she screeched. ‘Sortez! sortez! sortez par la porte!’"
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 303
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[232]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-303"
    "translation_ja": "「出ていけ、戸から出ておいき！」と金切り声を上げた。「ソルテ！　ソルテ！　ソルテ・パル・ラ・ポルト！」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 48
          "end": 54
          "exact": "Sortez"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 56
          "end": 62
          "exact": "sortez"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 64
          "end": 83
          "exact": "sortez par la porte"
  - "id": "voy-304"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I do not know how it happened, but next moment we were out in the rain and darkness, and I was cursing before the carriage entry like a disappointed mendicant. Where were the boating men of Belgium? where the Judge and his good wines? and where the graces of Origny? Black, black was the night after the firelit kitchen; but what was that to the blackness in our heart? This was not the first time that I have been refused a lodging. Often and often have I planned what I should do if such a misadventure happened to me again. And nothing is easier to plan. But to put in execution, with the heart boiling at the indignity? Try it; try it only once; and tell me what you did."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 304
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[233]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-304"
    "translation_ja": "どうしてそうなったか知らないが、次の瞬間われわれは雨の闇の中にいて、私は施しを断られた乞食のように馬車口の前で悪態をついていた。ベルギーの舟友達はいずこ？　判事とよい葡萄酒はいずこ？　オリニーの三美神はいずこ？　火のともる台所を出たあとの夜は黒い、まことに黒い。だが胸の黒さに比べれば何ほどか。宿を断られたのはこれが初めてではなかった。再びその不運に出会ったらどうするか、いくどとなく算段してきた。そして算段ほど容易なものはない。だが侮辱に胸の煮えくり返っている時に実行するとなると？　やってみるがいい。たった一度でいい。そして実際どうしたか教えていただきたい。"
    "translation_status": "reviewed"
  - "id": "voy-305"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It is all very fine to talk about tramps and morality. Six hours of police surveillance (such as I have had), or one brutal rejection from an inn-door, change your views upon the subject like a course of lectures. As long as you keep in the upper regions, with all the world bowing to you as you go, social arrangements have a very handsome air; but once get under the wheels, and you wish society were at the devil. I will give most respectable men a fortnight of such a life, and then I will offer them twopence for what remains of their morality."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 305
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[234]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-305"
    "translation_ja": "浮浪者だの道徳だのと話すぶんにはけっこうなことだ。だが六時間、警察の監視下に置かれる（私にはその経験がある）とか、宿の戸口で一度むごたらしく追い払われるとかすれば、一連の講義ほど、この問題についての見方が変わる。上層にいて行く先々で世間にお辞儀をしてもらうかぎり、社会の仕組みはまことにりっぱに見える。だがいったん車輪の下に入ってみるがいい。こんな社会は悪魔にくれてやれと思う。まずまず世に重んじられる男たちの大半に、こういう暮らしを十四日与えよう。それから彼らの道徳の残り一切に二ペンスの値をつけてやろう。"
    "translation_status": "reviewed"
  - "id": "voy-306"
    "section_id": "ch-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For my part, when I was turned out of the Stag, or the Hind, or whatever it was, I would have set the temple of Diana on fire, if it had been handy. There was no crime complete enough to express my disapproval of human institutions. As for the Cigarette, I never knew a man so altered. ‘We have been taken for pedlars again,’ said he. ‘Good God, what it must be to be a pedlar in reality!’ He particularised a complaint for every joint in the landlady’s body. Timon was a philanthropist alongside of him. And then, when he was at the top of his maledictory bent, he would suddenly break away and begin whimperingly to commiserate the poor. ‘I hope to God,’ he said,—and I trust the prayer was answered,—‘that I shall never be uncivil to a pedlar.’ Was this the imperturbable Cigarette? This, this was he. O change beyond report, thought, or belief!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 306
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[235]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-306"
    "translation_ja": "私ならば、「雄鹿」亭か「雌鹿」亭かなんだかから放り出されたとき、もし手近にあったならディアナの神殿に火をかけていただろう。人間のこしらえた制度への不服を表すのに充分なほど徹底した犯罪などなかった。シガレット号の主に至っては、これほど豹変した男を知らない。「また行商人に間違われた」と言った。「神様、ほんとうの行商人であるとは何たることだろう！」。女将のからだの関節という関節に一つずつ病を割り当てて呪った。彼に比べたら、人間嫌いのタイモンも博愛家だ。そうかと思うと呪詛の絶頂にあるさなか、ふいに枝道に入り、泣き言めいた調子で貧しい人々に同情しはじめた。「神にかけて祈るね」と彼は言った。この祈りはかなえられたと信じる。「僕は一生、行商人に失礼なまねなどしない者でありたい」。これがあの、何ものにも動じぬシガレット号の主か？　これが、これがかの人だった。ああ、語るにも思うにも信じるにもあまる変貌よ！"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 244
          "end": 253
          "exact": "Cigarette"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 775

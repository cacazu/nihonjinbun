  - "id": "voy-123"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We were not clear of the fortifications before the rain began. The wind was contrary, and blew in furious gusts; nor were the aspects of nature any more clement than the doings of the sky. For we passed through a stretch of blighted country, sparsely covered with brush, but handsomely enough diversified with factory chimneys. We landed in a soiled meadow among some pollards, and there smoked a pipe in a flaw of fair weather. But the wind blew so hard, we could get little else to smoke. There were no natural objects in the neighbourhood, but some sordid workshops. A group of children headed by a tall girl stood and watched us from a little distance all the time we stayed. I heartily wonder what they thought of us."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 123
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[65]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-123"
    "translation_ja": "要塞を出きらぬうちに雨になった。風は向かい風で、猛烈な突風が来た。自然のありさまも空の仕打ちに輪をかけて冷淡だった。枯れ荒れた地を、まばらな低木と、なかなかみごとな変化を添える工場の煙突のあいだに進んだのである。頭を刈った立木のあたり、薄汚れた牧草地に上陸し、ちょっとした晴れ間に一服した。だが風が強すぎて、パイプの火がろくにつかなかった。近所には自然の景物はなく、みすぼらしい作業場があった。背の高い娘を先頭に子供の一団が少し離れて立ち、われわれがいる間じゅう見物した。私たちを何だと思ったのか、心底知りたいものだ。"
    "translation_status": "reviewed"
  - "id": "voy-124"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At Hautmont, the lock was almost impassable; the landing-place being steep and high, and the launch at a long distance. Near a dozen grimy workmen lent us a hand. They refused any reward; and, what is much better, refused it handsomely, without conveying any sense of insult. ‘It is a way we have in our countryside,’ said they. And a very becoming way it is. In Scotland, where also you will get services for nothing, the good people reject your money as if you had been trying to corrupt a voter. When people take the trouble to do dignified acts, it is worth while to take a little more, and allow the dignity to be common to all concerned. But in our brave Saxon countries, where we plod threescore years and ten in the mud, and the wind keeps singing in our ears from birth to burial, we do our good and bad with a high hand and almost offensively; and make even our alms a witness-bearing and an act of war against the wrong."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 124
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[66]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-124"
    "translation_ja": "オーモンの閘門はほとんど通れなかった。舟を上げるところは高くて急で、また水に下ろせるところはずっと先だった。煤でまっ黒な職工が十二人近く手を貸してくれた。どんなお礼も受け取らなかった。それよりずっといいのは、侮辱を受けたというそぶりもなく、気持ちのよい断り方をしたことだ。「この土地じゃ、そうするもんですよ」と言った。まことに似つかわしいやり方だ。スコットランドでもただで力を貸してもらえるが、あちらの善男善女はまるで買票でも企てたかのように金を突き返す。せっかく気高いふるまいをするのなら、もうひと手間かけてその気高さを双方のものにするだけの値打ちはある。だがわれら勇ましきサクソン人の国々では、七十年泥の中をとぼとぼ歩き、生まれてから埋められるまで耳もとに風が鳴りつづけるものだから、よいことも悪いことも高飛車に、無礼に近い流儀でやる。施し一つしても、それを信条の告白にし、不正に対する宣戦の布告にする。"
    "translation_status": "reviewed"
  - "id": "voy-125"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "After Hautmont, the sun came forth again and the wind went down; and a little paddling took us beyond the ironworks and through a delectable land. The river wound among low hills, so that sometimes the sun was at our backs, and sometimes it stood right ahead, and the river before us was one sheet of intolerable glory. On either hand, meadows and orchards bordered, with a margin of sedge and water flowers, upon the river. The hedges were of great height, woven about the trunks of hedgerow elms; and the fields, as they were often very small, looked like a series of bowers along the stream. There was never any prospect; sometimes a hill-top with its trees would look over the nearest hedgerow, just to make a middle distance for the sky; but that was all. The heaven was bare of clouds. The atmosphere, after the rain, was of enchanting purity. The river doubled among the hillocks, a shining strip of mirror glass; and the dip of the paddles set the flowers shaking along the brink."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 125
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[67]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-125"
    "translation_ja": "オーモンを過ぎると日が戻り、風も静まった。少し漕げば製鉄所を抜け、じつに好もしい土地に出た。川は低い丘のあいだをくねったので、日はあるときは背に、あるときは真正面にあり、前方の川面はまともには見ていられないほど眩しい、一面の輝きとなった。両岸の草地と果樹園は、スゲと水の花を縁どりにして川に接していた。生垣はひじょうに高く、垣に立つニレの幹に枝が編みからめられていた。畑がたいていごく小さいので、川に沿って緑のあずまやがつぎつぎと並ぶように見えた。遠望はまったくない。ときおり、木をいただく丘の頂がいちばん近い垣の向こうに顔を出し、空に中景を添えてくれる。それで全部だ。大空には雲のかけらもなかった。雨のあとの大気は心を奪う清らかさだった。小丘のあいだを川は鏡板のひと筋となって折れ曲がり、櫂をひたすと岸べの花が揺れた。"
    "translation_status": "reviewed"
  - "id": "voy-126"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In the meadows wandered black and white cattle fantastically marked. One beast, with a white head and the rest of the body glossy black, came to the edge to drink, and stood gravely twitching his ears at me as I went by, like some sort of preposterous clergyman in a play. A moment after I heard a loud plunge, and, turning my head, saw the clergyman struggling to shore. The bank had given way under his feet."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 126
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[68]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-126"
    "translation_ja": "草地では黒白の牛が、奇想天外な斑をまとって歩いていた。頭が白く、からだがつやつやのまっ黒な一頭が水を飲みに岸へ来て、私が通ると、芝居に出てくる妙ちきりんな牧師みたいに、もったいぶって耳をぴくぴくさせていた。と、すぐあとにどぶんと大きな音。首を回すと例の牧師が懸命に岸へはい上がろうとしていた。足もとの土が崩れたのだ。"
    "translation_status": "reviewed"
  - "id": "voy-127"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Besides the cattle, we saw no living things except a few birds and a great many fishermen. These sat along the edges of the meadows, sometimes with one rod, sometimes with as many as half a score. They seemed stupefied with contentment; and when we induced them to exchange a few words with us about the weather, their voices sounded quiet and far away. There was a strange diversity of opinion among them as to the kind of fish for which they set their lures; although they were all agreed in this, that the river was abundantly supplied. Where it was plain that no two of them had ever caught the same kind of fish, we could not help suspecting that perhaps not any one of them had ever caught a fish at all. I hope, since the afternoon was so lovely, that they were one and all rewarded; and that a silver booty went home in every basket for the pot. Some of my friends would cry shame on me for this; but I prefer a man, were he only an angler, to the bravest pair of gills in all God’s waters. I do not affect fishes unless when cooked in sauce; whereas an angler is an important piece of river scenery, and hence deserves some recognition among canoeists. He can always tell you where you are after a mild fashion; and his quiet presence serves to accentuate the solitude and stillness, and remind you of the glittering citizens below your boat."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 127
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[69]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-127"
    "translation_ja": "牛を別にすれば、生き物といっては鳥が少しと、釣り人が大勢いるほかには見なかった。彼らは草地のへりにすわり、竿一本のときもあれば五本ものときもある。満足のあまり茫然自失したようで、天気のことなど二言三言ことばを交わそうと誘っても、返事の声は静かで遠くから聞こえた。何を釣るつもりで餌を仕掛けているかについては妙にまちまちな説だったが、川に魚がたくさんいる、この一点には全員異存がなかった。二人として同じ種類の魚を釣ったためしがないのが歴然としてみると、ひょっとして一人として魚を釣ったためしがないのでは、と疑わずにはいられなかった。あんなにすてきな午後だったのだから、どうかだれもかれも報いられ、銀色の獲物がどの籠にも入って鍋へ帰ったようにと願う。それを聞いてけしからんと叫ぶ友もいるだろう。だが私は、ただの釣り人であれ人間ひとりのほうを、神の造られたあらゆる水に棲むいちばん立派なひと対の鰓よりも贔屓にする。ソースで料理してある場合を除けば魚好きではないが、釣り人は川景色の大事な一部分であり、それゆえカヌー乗りにはいくらかの敬意を受けてしかるべきだ。いまどこにいるのか、彼はいつでもおっとりした調子で教えてくれる。そしてその静かな姿はかえってひと気のなさと静けさをきわ立たせ、舟の下にひらめく住民たちを思い出させてくれる。"
    "translation_status": "reviewed"
  - "id": "voy-128"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The Sambre turned so industriously to and fro among his little hills, that it was past six before we drew near the lock at Quartes. There were some children on the tow-path, with whom the Cigarette fell into a chaffing talk as they ran along beside us. It was in vain that I warned him. In vain I told him, in English, that boys were the most dangerous creatures; and if once you began with them, it was safe to end in a shower of stones. For my own part, whenever anything was addressed to me, I smiled gently and shook my head as though I were an inoffensive person inadequately acquainted with French. For indeed I have had such experience at home, that I would sooner meet many wild animals than a troop of healthy urchins."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 128
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[70]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-128"
    "translation_ja": "サンブルは小さな丘のあいだでじつにせっせとあちらへこちらへ曲がるので、カルテの閘門に近づいたときは六時を回っていた。曳舟道に子供が何人かいて、こちらと並んで走る彼らを相手に、シガレット号の主が軽口をききはじめた。警告しても無駄だった。少年とは何より危険な生き物で、いったんかかわれば石の雨で終わるに決まっている、そう英語で言ってやっても無駄だった。私の方は何か話しかけられるたび、フランス語をよく解さぬ無害な人間のように、そっと微笑み首を振った。本国でたっぷり経験したので、元気な悪童の群れに出くわすくらいなら、たいていの野獣と顔を合わせるほうがましだとほんとうに思っている。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 188
          "end": 197
          "exact": "Cigarette"
  - "id": "voy-129"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But I was doing injustice to these peaceable young Hainaulters. When the Cigarette went off to make inquiries, I got out upon the bank to smoke a pipe and superintend the boats, and became at once the centre of much amiable curiosity. The children had been joined by this time by a young woman and a mild lad who had lost an arm; and this gave me more security. When I let slip my first word or so in French, a little girl nodded her head with a comical grown-up air. ‘Ah, you see,’ she said, ‘he understands well enough now; he was just making believe.’ And the little group laughed together very good-naturedly."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 129
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[71]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-129"
    "translation_ja": "しかしこの人なつこいエノーの子らに対して私は不当だった。シガレット号の主が聞きこみに出ると、私は上陸してパイプを吸い、舟の番をしたが、たちまち好意に満ちた好奇心の的になった。今では子供らに、若い女の人と、片腕をなくした物静かな若者が加わっていたので、それだけ気が楽だった。うっかりフランス語が一言二言こぼれ出ると、小さな女の子が妙におとなびた顔をしてうなずいた。「ね、わかるでしょう。この人ちゃんとわかるのよ。さっきはふりをしてただけ」。小さな一座はいかにも人のよさそうな笑い声を上げた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 73
          "end": 82
          "exact": "Cigarette"
  - "id": "voy-130"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They were much impressed when they heard we came from England; and the little girl proffered the information that England was an island ‘and a far way from here—bien loin d’ici.’"
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 130
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[72]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-130"
    "translation_ja": "われわれがイングランドから来たと聞いてみなひどく感心した。女の子が教えてくれた。イングランドは島で、「ここからずいぶん遠いの、ビヤン・ロワン・ディシ」。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 161
          "end": 176
          "exact": "bien loin d’ici"
  - "id": "voy-131"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Ay, you may say that, a far way from here,’ said the lad with one arm."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 131
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[73]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-131"
    "translation_ja": "「ああ、まったくその通りだ。ここからずいぶん遠い」と片腕の若者は言った。"
    "translation_status": "reviewed"
  - "id": "voy-132"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was as nearly home-sick as ever I was in my life; they seemed to make it such an incalculable distance to the place where I first saw the day. They admired the canoes very much. And I observed one piece of delicacy in these children, which is worthy of record. They had been deafening us for the last hundred yards with petitions for a sail; ay, and they deafened us to the same tune next morning when we came to start; but then, when the canoes were lying empty, there was no word of any such petition. Delicacy? or perhaps a bit of fear for the water in so crank a vessel? I hate cynicism a great deal worse than I do the devil; unless perhaps the two were the same thing? And yet ’tis a good tonic; the cold tub and bath-towel of the sentiments; and positively necessary to life in cases of advanced sensibility."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 132
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[74]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-132"
    "translation_ja": "私はこれまでの生涯で一、二を争うほど郷愁に迫られた。私がはじめて日の光を見た土地まで、彼らの言いようでは距離が測り知れぬほどあるのだった。カヌーにはひどく感心していた。そして私はこの子たちに、書き留めるに足る一つの心遣いを認めた。さっきから百ヤードものあいだ、一度乗せてくれと耳を聾するほどせがんだ彼らだ。翌朝出立するときにもたしかに同じ節で耳を聾した。ところがいま、カヌーが空っぽでそこにあるとき、その願いは一言も口をついて出なかった。心遣いだろうか。それとも、あんなぐらぐらした乗り物で水に出るのがちょっぴり怖かったのか。私は冷笑主義が悪魔よりずっと嫌いだ。ひょっとしてこの二つは同じものなのだろうか。けれどもそれはよい強壮剤だ。感情というものにとっての冷水浴に浴用タオルであって、感じやすさが重症に陥った人間が生きていくには、こういうものがぜひとも要る。"
    "translation_status": "reviewed"
  - "id": "voy-133"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "From the boats they turned to my costume. They could not make enough of my red sash; and my knife filled them with awe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 133
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[75]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-133"
    "translation_ja": "子供たちの関心は舟から私の身なりに移った。赤い腰帯はいくらほめてもほめ足りないらしく、ナイフには畏敬の念を抱いた。"
    "translation_status": "reviewed"
  - "id": "voy-134"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘They make them like that in England,’ said the boy with one arm. I was glad he did not know how badly we make them in England now-a-days. ‘They are for people who go away to sea,’ he added, ‘and to defend one’s life against great fish.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 134
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[76]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-134"
    "translation_ja": "「イングランドではああいうのを作るんだ」と片腕の少年は言った。今どきイングランドでどれほどひどいものを作っているか、彼が知らずにいてくれて私はうれしかった。「海へ出る人のため、それから大きな魚から命を守るためにさ」と付け加えた。"
    "translation_status": "reviewed"
  - "id": "voy-135"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I felt I was becoming a more and more romantic figure to the little group at every word. And so I suppose I was. Even my pipe, although it was an ordinary French clay pretty well ‘trousered,’ as they call it, would have a rarity in their eyes, as a thing coming from so far away. And if my feathers were not very fine in themselves, they were all from over seas. One thing in my outfit, however, tickled them out of all politeness; and that was the bemired condition of my canvas shoes. I suppose they were sure the mud at any rate was a home product. The little girl (who was the genius of the party) displayed her own sabots in competition; and I wish you could have seen how gracefully and merrily she did it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 135
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[77]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-135"
    "translation_ja": "言葉を重ねるごとに、小さな仲間の目に映る私がますます物語めいた人物になってゆくのを感じた。たぶん実際そうだったろう。私のパイプだって、ごく平凡なフランス製の土焼で、彼らの言い方ならもうだいぶ「ズボンをはいた」、つまり吸い込んで色のついた代物だったが、それほど遠くから来た品として彼らの目には珍しかったろう。私の羽飾りはそれ自体さして立派でなくとも、どれも海の向こうから来た。だが装束の一つは子供たちを笑わせて、行儀も吹っ飛んだ。帆布の靴の泥だらけな有様である。泥だけは国産だと確信していたのだろう。例の女の子（一座の才人であった）が私と張り合って自分の木靴を見せた。その身ぶりのなんとも愛らしく、楽しげなところをお目にかけたかった。"
    "translation_status": "reviewed"
  - "id": "voy-136"
    "section_id": "ch-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The young woman’s milk-can, a great amphora of hammered brass, stood some way off upon the sward. I was glad of an opportunity to divert public attention from myself, and return some of the compliments I had received. So I admired it cordially both for form and colour, telling them, and very truly, that it was as beautiful as gold. They were not surprised. The things were plainly the boast of the countryside. And the children expatiated on the costliness of these amphoræ, which sell sometimes as high as thirty francs apiece; told me how they were carried on donkeys, one on either side of the saddle, a brave caparison in themselves; and how they were to be seen all over the district, and at the larger farms in great number and of great size."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 136
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[78]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-136"
    "translation_ja": "若い女の人の牛乳缶、真鍮を打ち出した大きな両耳の壺が、少し離れて芝の上に置かれていた。衆目をわが身からそらし、いただいた賛辞のいくつかをお返しする機会を私は喜んだ。それで形も色も心からほめ、金でできたものに負けず美しいと、これは正直に言った。人々はべつに驚かなかった。それは明らかに土地の自慢の品だった。子供らはこの両耳の壺がいかに高いかを熱心に語った。一個三十フランもすることがある。ロバの鞍の両脇に一つずつ掛けると、それだけでりっぱな飾りになる。地方のどこででも見られ、大きな農場にはひときわ大きいのがいくつもある、という話だった。"
    "translation_status": "reviewed"

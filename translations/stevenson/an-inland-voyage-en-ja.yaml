  - "id": "voy-118"
    "section_id": "ch-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "One person in Maubeuge, however, showed me something more than his outside. That was the driver of the hotel omnibus: a mean enough looking little man, as well as I can remember; but with a spark of something human in his soul. He had heard of our little journey, and came to me at once in envious sympathy. How he longed to travel! he told me. How he longed to be somewhere else, and see the round world before he went into the grave! ‘Here I am,’ said he. ‘I drive to the station. Well. And then I drive back again to the hotel. And so on every day and all the week round. My God, is that life?’ I could not say I thought it was—for him. He pressed me to tell him where I had been, and where I hoped to go; and as he listened, I declare the fellow sighed. Might not this have been a brave African traveller, or gone to the Indies after Drake? But it is an evil age for the gypsily inclined among men. He who can sit squarest on a three-legged stool, he it is who has the wealth and glory."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 118
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[61]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-118"
    "translation_ja": "とはいえモブージュには一人、上っ面より先を見せてくれた人がいた。宿の乗合馬車の御者だ。記憶の限りでは風采のぱっとしない小男だったが、心には人間らしいものがひとつ火花を上げていた。われわれの小旅行のことを聞くと、羨望と共感とを抱いてすぐ私のところへ来た。どんなに旅に出たいか！　墓に入るまえにどんなにかよその土地へ行き、この丸い世界を見ておきたいか！　そう彼は語った。「ここに私がいるでしょう」と言う。「駅まで車をやる。いいでしょう。すると次は宿へ車を戻す。それを毎日、一週間じゅう。ああ神様、こんなのが生きてるってことでしょうか」。私は、とてもそうだとは言えなかった。少なくとも、彼にとっては。どこへ行ったか、これからどこへ行きたいかと彼はせきこんで聞き、私の話に耳を傾けながら、ほんとうに、ため息をついた。この男、勇敢なアフリカ探検家にだってなれたかもしれない。ドレイクのあとについてインド諸国へ渡れたかもしれない。だが放浪の血を引く者にはつらい時代だ。三本脚の腰掛けに誰よりきちんとすわっていられる男に、富と栄光は帰するのだから。"
    "translation_status": "reviewed"
  - "id": "voy-119"
    "section_id": "ch-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I wonder if my friend is still driving the omnibus for the Grand Cerf? Not very likely, I believe; for I think he was on the eve of mutiny when we passed through, and perhaps our passage determined him for good. Better a thousand times that he should be a tramp, and mend pots and pans by the wayside, and sleep under trees, and see the dawn and the sunset every day above a new horizon. I think I hear you say that it is a respectable position to drive an omnibus? Very well. What right has he who likes it not, to keep those who would like it dearly out of this respectable position? Suppose a dish were not to my taste, and you told me that it was a favourite amongst the rest of the company, what should I conclude from that? Not to finish the dish against my stomach, I suppose."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 119
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[62]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-119"
    "translation_ja": "あの友はまだグラン・セールの乗合馬車を走らせているのだろうか。まずそうではあるまい。われわれが通ったころにはもう決起の前夜と見えたし、われわれが通ったのが最後の決め手になったかもしれない。浮浪者になり、道端で鍋釜を繕い、木の下で眠り、日ごとに新しい地平線の上に夜明けと落日を見るほうが千倍よい。乗合馬車の御者は立派な職業だ、とおっしゃる声が聞こえるようだ。よろしい。ではそれが好きでない者に、その職なら大好きになれる人たちを立派な職から締め出すどんな権利があるのか。口に合わない料理が出て、ほかの同席者にはそれが大好物だと教えられたら、私はそこから何を結論すべきだろうか。胸が悪くても平らげろ、ではあるまい。"
    "translation_status": "reviewed"
  - "id": "voy-120"
    "section_id": "ch-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Respectability is a very good thing in its way, but it does not rise superior to all considerations. I would not for a moment venture to hint that it was a matter of taste; but I think I will go as far as this: that if a position is admittedly unkind, uncomfortable, unnecessary, and superfluously useless, although it were as respectable as the Church of England, the sooner a man is out of it, the better for himself, and all concerned."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 120
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[63]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-120"
    "translation_ja": "世間体というものも、それなりにたいへんよいものだが、ほかの一切に優越するわけではない。個人の好みの問題だなどと、私は一瞬たりともほのめかすつもりはない。だがここまでは言っておこう。ある境遇が、誰の目にも人に酷で、居心地悪く、要りもしなければ余計なまでに役立たずだとすれば、たとえ英国国教会ほど世に重んじられようと、そこは早く抜けるほど本人のためにも、関係するみんなのためにもよい。"
    "translation_status": "reviewed"

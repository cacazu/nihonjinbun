    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 276
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[208]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-276"
    "translation_ja": "宿の夫はまたたく間にその喉もとへ食いついた。一切は論理的であり、一切がすばらしいことを説き明かしてみせた。「なんという光景だ！　なんと目を奪う眺めだ！」。皿という皿が連発する砲撃の下、食卓の上でよろめいた。"
    "translation_status": "reviewed"
  - "id": "voy-277"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Seeking to make peace, I threw in a word in praise of the liberty of opinion in France. I could hardly have shot more amiss. There was an instant silence, and a great wagging of significant heads. They did not fancy the subject, it was plain; but they gave me to understand that the sad Northman was a martyr on account of his views. ‘Ask him a bit,’ said they. ‘Just ask him.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 277
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[209]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-277"
    "translation_ja": "仲を取り持とうと、私はフランスの意見の自由をほめる言葉をひとつ差しはさんだ。これ以上的を外しようはなかったろう。即座に沈黙がおり、人々はいわくありげにしきりに首を振った。この話題がお気に召さぬのは明らかだったが、悲しげな北国人は自分の意見のために迫害された人だとわからせてくれた。「ちょっと彼に聞いてみなさい」と皆は言った。「まあ、聞いてみなさい」"
    "translation_status": "reviewed"
  - "id": "voy-278"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Yes, sir,’ said he in his quiet way, answering me, although I had not spoken, ‘I am afraid there is less liberty of opinion in France than you may imagine.’ And with that he dropped his eyes, and seemed to consider the subject at an end."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 278
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[210]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-278"
    "translation_ja": "「ええ、ムシュー」と彼はもの静かな調子で、ものを言ってもいない私に答えた。「残念ながらフランスにはお考えほど意見の自由はありません」。それきり目を伏せ、もう話はすんだと思ったらしかった。"
    "translation_status": "reviewed"
  - "id": "voy-279"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Our curiosity was mightily excited at this. How, or why, or when, was this lymphatic bagman martyred? We concluded at once it was on some religious question, and brushed up our memories of the Inquisition, which were principally drawn from Poe’s horrid story, and the sermon in Tristram Shandy, I believe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 279
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[211]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-279"
    "translation_ja": "これにはわれわれの好奇心が大いにかき立てられた。いかにして、またなぜ、いつ、この生気の乏しい巡回商人は殉教の苦をなめたのか。われわれはただちに宗教上の問題にちがいないと決め、異端審問の記憶をさらい直した。その知識は主にポーのぞっとする物語と『トリストラム・シャンディ』中の説教に由来したと思う。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 278
          "end": 293
          "exact": "Tristram Shandy"
  - "id": "voy-280"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On the morrow we had an opportunity of going further into the question; for when we rose very early to avoid a sympathising deputation at our departure, we found the hero up before us. He was breaking his fast on white wine and raw onions, in order to keep up the character of martyr, I conclude. We had a long conversation, and made out what we wanted in spite of his reserve. But here was a truly curious circumstance. It seems possible for two Scotsmen and a Frenchman to discuss during a long half-hour, and each nationality have a different idea in view throughout. It was not till the very end that we discovered his heresy had been political, or that he suspected our mistake. The terms and spirit in which he spoke of his political beliefs were, in our eyes, suited to religious beliefs. And vice versâ."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 280
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[212]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-280"
    "translation_ja": "翌朝さらに突っこんで聞く機会があった。というのも、出立に好意の代表団を避けるべくずいぶん早起きしたのに、わが主人公はすでに起きていたからだ。白葡萄酒と生のタマネギで朝の断食を破っていた。殉教者の役柄を守るためだった、とでもいうのだろう。長く話し、彼が控えめなのにもかかわらず、知りたいことはわかった。だがここに実に不思議な事情があった。スコットランド人二人とフランス人一人がたっぷり半時間言い合って、その間じゅう両国人は別なことを考えていられるらしい。彼の異端が政治上のものであるとわれわれが発見したのも、こちらの誤解を彼が察したのも、まさに話の最後だった。彼が自分の政治信条を語る言葉も気持ちも、われわれの目には宗教上の信念にふさわしかった。逆もまた然りだった。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 800
          "end": 810
          "exact": "vice versâ"
  - "id": "voy-281"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Nothing could be more characteristic of the two countries. Politics are the religion of France; as Nanty Ewart would have said, ‘A d-d bad religion’; while we, at home, keep most of our bitterness for little differences about a hymn-book, or a Hebrew word which perhaps neither of the parties can translate. And perhaps the misconception is typical of many others that may never be cleared up: not only between people of different race, but between those of different sex."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 281
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[213]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-281"
    "translation_ja": "これほど二つの国らしさを表すこともないだろう。フランス人の宗教は政治なのだ。ナンティ・ユアートなら「く、くそいまいましい宗教だ」とでも言ったろう。こちら本国では、賛美歌集をめぐる小さな違いや、たぶんどちらの側にも訳せぬヘブライ語一語のために、わが辛辣さの大半を取っておく。この誤解は、ついぞ解けることのない他の多くの誤解の典型かもしれない。種族を異にする者のあいだだけでなく、性を異にする者のあいだにも。"
    "translation_status": "reviewed"
  - "id": "voy-282"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As for our friend’s martyrdom, he was a Communist, or perhaps only a Communard, which is a very different thing; and had lost one or more situations in consequence. I think he had also been rejected in marriage; but perhaps he had a sentimental way of considering business which deceived me. He was a mild, gentle creature, anyway; and I hope he has got a better situation, and married a more suitable wife since then."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 282
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[214]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-282"
    "translation_ja": "友人の殉教だが、彼は共産主義者、あるいは単にパリ・コミューンの支持者だった。両者はずいぶん違うものだ。それが原因で一つかそれ以上の勤め先を失った。求婚も断られたように思うが、仕事の話を情緒ゆたかに見る彼の流儀に私がだまされたのかもしれない。いずれにせよおだやかな、優しい人だった。あれからもっとよい職を得、もっと似合いの妻を娶っていてほしいものだ。"
    "translation_status": "reviewed"
  - "id": "voy-283"

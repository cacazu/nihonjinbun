  - "id": "voy-276"
    "section_id": "ch-11_b"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But the landlord was at his throat in a moment. It was all logical, he showed him; and all magnificent. ‘What a spectacle! What a glance for an eye!’ And the dishes reeled upon the table under a cannonade of blows."
    "source_languages":

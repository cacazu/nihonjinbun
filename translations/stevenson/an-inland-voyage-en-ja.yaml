  - "id": "voy-011"
    "section_id": "preface"
    "kind": "heading"
    "origin": "source"
    "source_text": "PREFACE TO THE FIRST EDITION"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 11
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/h2[1]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-011"
    "translation_ja": "初版への序"
    "translation_status": "reviewed"
  - "id": "voy-012"
    "section_id": "preface"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To equip so small a book with a preface is, I am half afraid, to sin against proportion. But a preface is more than an author can resist, for it is the reward of his labours. When the foundation stone is laid, the architect appears with his plans, and struts for an hour before the public eye. So with the writer in his preface: he may have never a word to say, but he must show himself for a moment in the portico, hat in hand, and with an urbane demeanour."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 12
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[9]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-012"
    "translation_ja": "こんな小さな本に序をつけるのは、分を越えた罪になりはしまいかと、少し気がかりである。だが作者にとって序は抗しがたいものなのだ。労作の褒美だからである。礎石が据えられると建築家は図面を手に姿を現し、しばし大衆の目の前を得意になって歩く。序における物書きも同じことだ。言うべきことはひと言もないかもしれないが、それでもひとときは玄関の列柱に帽子を手に現れ、物腰よく振る舞ってみせねばならない。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 2
          "exact": "To"
  - "id": "voy-013"
    "section_id": "preface"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It is best, in such circumstances, to represent a delicate shade of manner between humility and superiority: as if the book had been written by some one else, and you had merely run over it and inserted what was good. But for my part I have not yet learned the trick to that perfection; I am not yet able to dissemble the warmth of my sentiments towards a reader; and if I meet him on the threshold, it is to invite him in with country cordiality."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 13
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[10]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-013"
    "translation_ja": "こういう場合、謙遜と優越のあいだの繊細な色合いを帯びるのがいちばんよい。まるで本を書いたのは別人で、自分はただざっと目を通し、出来のよいところを書き足しただけだ、というふうに。だが私はまだその芸をそこまで完全には身につけていない。読者に対する気持ちの温かさをまだ装い隠すことができない。戸口で相まみえるなら、そのわけは、田舎風の心からの愛想で中へお招きしたいからだ。"
    "translation_status": "reviewed"
  - "id": "voy-014"
    "section_id": "preface"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To say truth, I had no sooner finished reading this little book in proof, than I was seized upon by a distressing apprehension. It occurred to me that I might not only be the first to read these pages, but the last as well; that I might have pioneered this very smiling tract of country all in vain, and find not a soul to follow in my steps. The more I thought, the more I disliked the notion; until the distaste grew into a sort of panic terror, and I rushed into this Preface, which is no more than an advertisement for readers."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 14
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[11]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-014"
    "translation_ja": "本当のところ、この小さな本の校正刷りを読み終わった途端、苦しい懸念にとらわれた。このページを読むのは私が最初であるばかりか最後でもあり、この晴れやかな一帯へせっかく道を開いたのに、足跡をたどる者は一人もいないのではないか。考えれば考えるほど面白くなく、その嫌な気持ちがとうとう一種の恐慌にまで育って、私はなりふり構わずこの序に飛び込んだ。これは読者募集の広告にほかならない。"
    "translation_status": "reviewed"
  - "id": "voy-015"
    "section_id": "preface"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "What am I to say for my book? Caleb and Joshua brought back from Palestine a formidable bunch of grapes; alas! my book produces naught so nourishing; and for the matter of that, we live in an age when people prefer a definition to any quantity of fruit."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 15
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[12]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-015"
    "translation_ja": "自分の本のために何を言えばいい？　カレブとヨシュアはパレスチナからすさまじく大きな葡萄の房を持ち帰った。悲しいかな、私の本はあれほど栄養のあるものは何も生み出さない。それにどのみち今という時代には、山ほどの果実より一つの定義のほうがありがたがられる。"
    "translation_status": "reviewed"
  - "id": "voy-016"
    "section_id": "preface"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I wonder, would a negative be found enticing? for, from the negative point of view, I flatter myself this volume has a certain stamp. Although it runs to considerably upwards of two hundred pages, it contains not a single reference to the imbecility of God’s universe, nor so much as a single hint that I could have made a better one myself.—I really do not know where my head can have been. I seem to have forgotten all that makes it glorious to be man.—’Tis an omission that renders the book philosophically unimportant; but I am in hopes the eccentricity may please in frivolous circles."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 16
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[13]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-016"
    "translation_ja": "否定形なら人を誘えるだろうか。というのは、否定の側から見ればこの一巻にはいささか特色がある、とひそかに自負しているからだ。たっぷり二百ページを上まわる長さなのに、神の宇宙の愚劣さに触れる箇所が一つもない。自分ならもっと立派なのが作れたというほのめかしさえ絶えてない。まったく私はどこに頭を置き忘れていたのだろう。人間であることを晴れがましくするものというものを、残らず失念したらしい。これだけ抜けていては、哲学上は重要でない本になる。ただ、この変人ぶりが軽薄なお仲間のあいだで気に入られないものかと、私は期待している。"
    "translation_status": "reviewed"
  - "id": "voy-017"
    "section_id": "preface"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To the friend who accompanied me I owe many thanks already, indeed I wish I owed him nothing else; but at this moment I feel towards him an almost exaggerated tenderness. He, at least, will become my reader:—if it were only to follow his own travels alongside of mine."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 17
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[14]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-017"
    "translation_ja": "同行してくれた友には、すでに数々の礼を言う義理がある。じつのところ、ほかには何も借りがなければよいのにと思うくらいだ。ところが今この瞬間には、度を過ごしたと思うほどの優しい気持ちを彼に覚えている。少なくとも彼は私の読者になってくれる。私の旅と並べて自分の旅をたどるためだけにでも。"
    "translation_status": "reviewed"

    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-080"
    "translation_ja": "ウィレブルーク運河にて"
    "translation_status": "reviewed"
  - "id": "voy-081"
    "section_id": "ch-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Next morning, when we set forth on the Willebroek Canal, the rain began heavy and chill. The water of the canal stood at about the drinking temperature of tea; and under this cold aspersion, the surface was covered with steam. The exhilaration of departure, and the easy motion of the boats under each stroke of the paddles, supported us through this misfortune while it lasted; and when the cloud passed and the sun came out again, our spirits went up above the range of stay-at-home humours. A good breeze rustled and shivered in the rows of trees that bordered the canal. The leaves flickered in and out of the light in tumultuous masses. It seemed sailing weather to eye and ear; but down between the banks, the wind reached us only in faint and desultory puffs. There was hardly enough to steer by. Progress was intermittent and unsatisfactory. A jocular person, of marine antecedents, hailed us from the tow-path with a ‘C’est vite, mais c’est long.’"
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 81
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[27]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-081"
    "translation_ja": "翌朝ウィレブルーク運河に乗り出すと、冷たく重い雨が降り始めた。運河の水はちょうど茶を飲むぐらいの温度に思われ、冷たいしぶきを浴びて、水面いっぱいに湯気が立った。出発の気分の浮き立ちと、櫂をひと掻きするたび素直に進む舟の動きに励まされて、降りつづく間もこの不運はしのげた。雲が過ぎてまた日が差すと、家にこもっていたら味わえないほど、気分が晴れやかになった。よい風が運河の縁の並木にざわざわ鳴り、身を震わせた。葉の大群は騒がしく光に出たり、引っ込んだりした。目にも耳にも帆走日和だったが、二つの岸の下の方では、風は弱くまばらな一吹きとなってようやくこちらに届いた。舵に利かせるのがやっとだ。進みは途切れ途切れで、物足りなかった。船乗り上がりらしいひょうきん者が曳舟道から声を掛けた。「速いのは速いが、時間がかかるねえ！」"
    "translation_status": "reviewed"

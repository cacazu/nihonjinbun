    "translation_ja": "ノワイヨン大聖堂"
    "translation_status": "reviewed"
  - "id": "voy-321"
    "section_id": "ch-15"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Noyon stands about a mile from the river, in a little plain surrounded by wooded hills, and entirely covers an eminence with its tile roofs, surmounted by a long, straight-backed cathedral with two stiff towers. As we got into the town, the tile roofs seemed to tumble uphill one upon another, in the oddest disorder; but for all their scrambling, they did not attain above the knees of the cathedral, which stood, upright and solemn, over all. As the streets drew near to this presiding genius, through the market-place under the Hôtel de Ville, they grew emptier and more composed. Blank walls and shuttered windows were turned to the great edifice, and grass grew on the white causeway. ‘Put off thy shoes from off thy feet, for the place whereon thou standest is holy ground.’ The Hôtel du Nord, nevertheless, lights its secular tapers within a stone-cast of the church; and we had the superb east-end before our eyes all morning from the window of our bedroom. I have seldom looked on the east-end of a church with more complete sympathy. As it flanges out in three wide terraces and settles down broadly on the earth, it looks like the poop of some great old battle-ship. Hollow-backed buttresses carry vases, which figure for the stern lanterns. There is a roll in the ground, and the towers just appear above the pitch of the roof, as though the good ship were bowing lazily over an Atlantic swell. At any moment it might be a hundred feet away from you, climbing the next billow. At any moment a window might open, and some old admiral thrust forth a cocked hat, and proceed to take an observation. The old admirals sail the sea no longer; the old ships of battle are all broken up, and live only in pictures; but this, that was a church before ever they were thought upon, is still a church, and makes as brave an appearance by the Oise. The cathedral and the river are probably the two oldest things for miles around; and certainly they have both a grand old age."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 321
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[248]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-321"
    "translation_ja": "ノワイヨンは川から一マイルほど、林をまとった丘に囲まれた小平野に立ち、瓦屋根でひとつの高みをまるごと覆い、その上に背筋のまっすぐ伸びた長い大聖堂が、かちりとした二本の塔を載せてそびえている。町にはいると瓦屋根はずいぶん奇妙に乱れて折り重なり、坂をころげ上がるふうに見えた。けれどいかに先を争っても、すべてのものの上に厳かに直立する大聖堂の膝より上には達していなかった。通りは市庁舎の下の市場広場を通り、この土地をつかさどる守り神に近づくにつれ、人気が失せ落ち着きを増した。のっぺりした壁と鎧戸を閉ざした窓が大建築に向かい、白い石敷き道には草が生えていた。「足の履物を脱ぎなさい。あなたの立っている所は聖なる地である」。それにもかかわらず、オテル・デュ・ノールは教会から石を投げて届くところに俗界の灯をともし、われわれは寝室の窓から朝じゅう、すばらしい東端を眼前にした。これほどくまなく心を寄せて教会の東端を見たことはめったにない。三段の広い段丘のように縁を張り出し、たっぷりと地に据わる姿は、古い大軍艦の艫に似ている。背のへこんだ控え壁に載る壺は艫の灯籠の役をする。地面はうねり、二本の塔は勾配のついた屋根の上にようやく頭を出し、さながら立派な船が大西洋のうねりにゆっくり会釈しているようだ。いつ何時、こちらから百フィート先まで離れて、次の大波に乗り上げているともしれない。いつ何時、窓が開き、古参の提督が三角帽を突き出して、高度を測りはじめるかもしれない。古い提督はもはや海を航行せず、古い戦列艦はすべて解体され、絵の中だけに生きる。だが彼らのことが思い浮かべられるより前から教会だったこの建物は、今も教会であり、オワーズのほとりで変わらず立派な姿をしている。大聖堂と川とは、おそらく何マイル四方にあるいちばん古い二つのものだ。確かにどちらも壮麗な老境にある。"
    "translation_status": "reviewed"

    "translation_ja": "この一件をシガレット号の主に話して聞かせると、「イギリスの召使いの態度について、あの二人には変わった観念があるんだね」とそっけなく言った。「だって君、閘門では僕を畜生同然に扱っていたぜ」"
    "translation_status": "reviewed"

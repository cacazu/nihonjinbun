  - "id": "voy-341"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A girl, at school in France, began to describe one of our regiments on parade to her French schoolmates; and as she went on, she told me, the recollection grew so vivid, she became so proud to be the countrywoman of such soldiers, and so sorry to be in another country, that her voice failed her and she burst into tears. I have never forgotten that girl; and I think she very nearly deserves a statue. To call her a young lady, with all its niminy associations, would be to offer her an insult. She may rest assured of one thing: although she never should marry a heroic general, never see any great or immediate result of her life, she will not have lived in vain for her native land."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 341
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[266]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-341"
    "translation_ja": "フランスに留学したある少女が、わが国の連隊の分列行進をフランスの学友に語りはじめた。本人の話では、語り進めるうちによみがえる記憶はあまりに鮮やかになり、ああいう兵士と同じ国の娘であることが誇らしく、よその国にいることがつらくなって、声が出なくなり、わっと泣き出したという。私はその子を一度も忘れたことがない。銅像にしてやってもよいくらいだと思う。気取ったお行儀をあれこれ連想させる「若い淑女」などと呼べば侮辱になる。一つのことは彼女に請け合える。英雄たる将軍と結婚することがなくとも、自分の人生に直接の大きな成果など見ることがなくとも、祖国にとって彼女の生きたことは無駄ではないだろう。"
    "translation_status": "reviewed"
  - "id": "voy-342"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But though French soldiers show to ill advantage on parade, on the march they are gay, alert, and willing like a troop of fox-hunters. I remember once seeing a company pass through the forest of Fontainebleau, on the Chailly road, between the Bas Bréau and the Reine Blanche. One fellow walked a little before the rest, and sang a loud, audacious marching song. The rest bestirred their feet, and even swung their muskets in time. A young officer on horseback had hard ado to keep his countenance at the words. You never saw anything so cheerful and spontaneous as their gait; schoolboys do not look more eagerly at hare and hounds; and you would have thought it impossible to tire such willing marchers."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 342
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[267]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-342"
    "translation_ja": "だがフランス兵は分列行進では見劣りするけれども、行軍では狐狩りの一隊のように快活で、すばしこく、よろこんで歩く。いつかフォンテーヌブローの森、バ＝ブレオーとレーヌ＝ブランシュのあいだのシャイイ街道で、一中隊が通り過ぎるのを見た。一人がほかの者より少し先に歩き、大胆不敵な行軍歌を大声で歌った。あとの連中は足をせっせと運び、拍子を取って小銃さえ振った。馬上の若い士官はその歌詞を聞いてまじめな顔を保つのに骨を折った。彼らの歩みほど陽気で自然と湧き出たものを、あなたも見たことがあるまい。「兎と猟犬」の追跡競走に出る生徒たちだって、これ以上熱心な顔はしない。これだけ進んで歩く連中を疲れさせるのは不可能に思われただろう。"
    "translation_status": "reviewed"
  - "id": "voy-343"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "My great delight in Compiègne was the town-hall. I doted upon the town-hall. It is a monument of Gothic insecurity, all turreted, and gargoyled, and slashed, and bedizened with half a score of architectural fancies. Some of the niches are gilt and painted; and in a great square panel in the centre, in black relief on a gilt ground, Louis XII. rides upon a pacing horse, with hand on hip and head thrown back. There is royal arrogance in every line of him; the stirruped foot projects insolently from the frame; the eye is hard and proud; the very horse seems to be treading with gratification over prostrate serfs, and to have the breath of the trumpet in his nostrils. So rides for ever, on the front of the town-hall, the good king Louis XII., the father of his people."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 343
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[268]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-343"
    "translation_ja": "コンピエーニュで私がたいそう喜んだのは市庁舎だった。市庁舎に私は夢中だった。ちぐはぐに落ち着かぬゴシックの記念碑で、そこここに小塔が立ち、怪獣の雨吐きがつき、刻みを入れ、五つばかりの建築上の思いつきでいかめしく飾られている。壁龕には金箔と彩色を施したものがある。中央の大きな四角いパネルには、金地に黒の浮彫で、ルイ十二世が腰に片手を当て、顔をのけぞらせて、側対歩の馬に乗っている。姿のどの線にも王者の傲慢がある。鐙に掛けた足は不遜に枠から突き出し、目は冷たく誇らしい。馬さえも平伏した農奴の上を満足げに踏んで進み、らっぱの息吹を鼻孔に宿しているようだ。このようにして市庁舎の正面を、民の父なる善王ルイ十二世はとこしえに乗り進む。"
    "translation_status": "reviewed"
  - "id": "voy-344"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Over the king’s head, in the tall centre turret, appears the dial of a clock; and high above that, three little mechanical figures, each one with a hammer in his hand, whose business it is to chime out the hours and halves and quarters for the burgesses of Compiègne. The centre figure has a gilt breast-plate; the two others wear gilt trunk-hose; and they all three have elegant, flapping hats like cavaliers. As the quarter approaches, they turn their heads and look knowingly one to the other; and then, kling go the three hammers on three little bells below. The hour follows, deep and sonorous, from the interior of the tower; and the gilded gentlemen rest from their labours with contentment."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 344
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[269]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-344"
    "translation_ja": "王の頭上、中央の高い小塔には時計の文字盤が現れる。そのさらに上に、手に手に槌を取った小さなからくり人形が三つあり、コンピエーニュの市民のため毎正時、半時、四半時を打つのが役目である。中央の人形は金箔の胸甲、ほかの二つは金箔の膨らんだ半ズボンをつけ、三人そろって騎士のような、つばの垂れる優美な帽子をかぶっている。十五分が近づくと首を回し、わかった顔をして見合わせる。それから、ちりん、三つの槌が下の三つの小鐘を打つ。時を告げる深くよく響く音が塔の内部からそれに続き、金箔の紳士たちは満足して仕事を休む。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 507
          "end": 512
          "exact": "kling"
  - "id": "voy-345"
    "section_id": "ch-17"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had a great deal of healthy pleasure from their manœuvres, and took good care to miss as few performances as possible; and I found that even the Cigarette, while he pretended to despise my enthusiasm, was more or less a devotee himself. There is something highly absurd in the exposition of such toys to the outrages of winter on a housetop. They would be more in keeping in a glass case before a Nürnberg clock. Above all, at night, when the children are abed, and even grown people are snoring under quilts, does it not seem impertinent to leave these ginger-bread figures winking and tinkling to the stars and the rolling moon? The gargoyles may fitly enough twist their ape-like heads; fitly enough may the potentate bestride his charger, like a centurion in an old German print of the Via Dolorosa; but the toys should be put away in a box among some cotton, until the sun rises, and the children are abroad again to be amused."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 345
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[270]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-345"
    "translation_ja": "私は彼らの動きからたくさん健全な楽しみをもらい、なるべく演目を見逃さぬよう注意した。私の熱狂を馬鹿にするふりをしていたシガレット号の主まで、多少なりと信者であるとわかった。こんな玩具を屋根の上で冬の乱暴にさらすとは、ひどく滑稽なことだ。ニュルンベルク時計の前のガラスケースに収まるほうが釣り合うだろう。第一、夜、子供は寝床に入り、おとなまで掛け蒲団の下でいびきをかいているときに、この生姜菓子のような人形たちが星や巡りゆく月に目配せし、チンチン鳴らすに任せておくのは出過ぎたことではないか。怪物の雨吐きが猿じみた首をひねるのはよろしい。主権者が、古いドイツの受難の道の版画に出る百人隊長のように軍馬にまたがるのもよろしい。だが玩具は、日が昇って、楽しませるべき子供がまた戸外に出てくるまでは、綿を詰めた箱にしまってやるべきだ。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 147
          "end": 156
          "exact": "Cigarette"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 792

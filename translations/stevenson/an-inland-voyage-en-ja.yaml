  - "id": "voy-322"
    "section_id": "ch-15"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The Sacristan took us to the top of one of the towers, and showed us the five bells hanging in their loft. From above, the town was a tesselated pavement of roofs and gardens; the old line of rampart was plainly traceable; and the Sacristan pointed out to us, far across the plain, in a bit of gleaming sky between two clouds, the towers of Château Coucy."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 322
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[249]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-322"
    "translation_ja": "聖具係が片方の塔の頂上まで連れていき、鐘の間に吊られた五つの鐘を見せてくれた。上から見る町は屋根と庭のモザイク舗装で、古い城壁の線をはっきりたどれた。聖具係は平野をはるかに越えて、二つの雲のあいだの光るひと切れの空にクーシー城の塔が見えると指さした。"
    "translation_status": "reviewed"
  - "id": "voy-323"
    "section_id": "ch-15"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I find I never weary of great churches. It is my favourite kind of mountain scenery. Mankind was never so happily inspired as when it made a cathedral: a thing as single and specious as a statue to the first glance, and yet, on examination, as lively and interesting as a forest in detail. The height of spires cannot be taken by trigonometry; they measure absurdly short, but how tall they are to the admiring eye! And where we have so many elegant proportions, growing one out of the other, and all together into one, it seems as if proportion transcended itself, and became something different and more imposing. I could never fathom how a man dares to lift up his voice to preach in a cathedral. What is he to say that will not be an anti-climax? For though I have heard a considerable variety of sermons, I never yet heard one that was so expressive as a cathedral. ’Tis the best preacher itself, and preaches day and night; not only telling you of man’s art and aspirations in the past, but convicting your own soul of ardent sympathies; or rather, like all good preachers, it sets you preaching to yourself;—and every man is his own doctor of divinity in the last resort."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 323
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[250]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-323"
    "translation_ja": "大きな教会を見るのに私はどうやら飽きないたちらしい。山岳風景のうち最も好きな種類だ。人類が大聖堂を造ったときほど幸いな霊感に打たれたことはない。一見すると像のように一つにまとまり、華麗に目に映る。ところが調べてみると細部は森に劣らず生き生きと面白い。尖塔の高さは三角法などでは測れない。測ればばかばかしいほど低いのに、ほれぼれと仰ぐ目にはなんと高いことか！　優美な比例がこれほど多く、一つがほかの一つから育ち、全部が一つのものへ育つと、比例はみずからを超えて、何か別の、いっそう堂々たるものになるかに見える。人がよくも大聖堂で声を上げて説教する勇気を持つものだと、私には昔から解せなかった。一体何を言えば竜頭蛇尾にならないだろう？　私はかなりさまざまな説教を聞いたが、大聖堂一つほど雄弁なものはまだ聞いたことがない。最上の説教師は建物自身で、昼も夜も説きつづける。過去の人間の技と憧れを語るだけでなく、こちらの魂にどんな熱い共感があるかを証し立ててみせる。いやむしろ、すべてのよい説教師のように、われわれが自分に向かって説教をする気にさせる。なにしろ最後はだれもが自分自身の神学博士なのだ。"
    "translation_status": "reviewed"
  - "id": "voy-324"
    "section_id": "ch-15"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As I sat outside of the hotel in the course of the afternoon, the sweet groaning thunder of the organ floated out of the church like a summons. I was not averse, liking the theatre so well, to sit out an act or two of the play, but I could never rightly make out the nature of the service I beheld. Four or five priests and as many choristers were singing Miserere before the high altar when I went in. There was no congregation but a few old women on chairs and old men kneeling on the pavement. After a while a long train of young girls, walking two and two, each with a lighted taper in her hand, and all dressed in black with a white veil, came from behind the altar, and began to descend the nave; the four first carrying a Virgin and child upon a table. The priests and choristers arose from their knees and followed after, singing ‘Ave Mary’ as they went. In this order they made the circuit of the cathedral, passing twice before me where I leaned against a pillar. The priest who seemed of most consequence was a strange, down-looking old man. He kept mumbling prayers with his lips; but as he looked upon me darkling, it did not seem as if prayer were uppermost in his heart. Two others, who bore the burthen of the chaunt, were stout, brutal, military-looking men of forty, with bold, over-fed eyes; they sang with some lustiness, and trolled forth ‘Ave Mary’ like a garrison catch. The little girls were timid and grave. As they footed slowly up the aisle, each one took a moment’s glance at the Englishman; and the big nun who played marshal fairly stared him out of countenance. As for the choristers, from first to last they misbehaved as only boys can misbehave; and cruelly marred the performance with their antics."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-534"
        "precision": "block"
        "source_sequence": 324
        "url": "https://gutenberg.pglaf.org/cache/epub/534/pg534-images.html"
        "xpath": "/html/body/p[251]"
    "source_alignment":
      - "source_id": "gutenberg-534"
        "original_unit_id": "voy-324"
    "translation_ja": "午後、ホテルの表にすわっていると、教会からオルガンの甘くうなる雷鳴が呼び声のように流れてきた。芝居好きの私だから、このまま座って一幕二幕見届けるのに異存はなかった。だが私が見たのがどんな礼拝だったかは、とうとうよくわからなかった。はいった時には司祭が四、五人とほぼ同数の聖歌隊員が主祭壇の前で「われを憐れみたまえ」を歌っていた。会衆といっても椅子にすわる老婆と石畳にひざまずく老人が数人いたきりだ。しばらくすると祭壇の裏から長い少女の列が二人ずつ歩いて現れた。一人ずつ火のついた細ろうそくを手に、みな黒衣に白いヴェールを着け、身廊をこちらへ進みはじめた。先頭の四人は台に聖母子像を載せて担いでいた。司祭と聖歌隊員はひざまずいた姿勢から立ち上がりあとに従い、歩みながら「アヴェ・マリア」を歌った。この順で大聖堂を一巡し、私が柱に寄りかかっていた前を二度通った。最も重きをなすらしい司祭はうつむきがちの妙な老人だった。唇でぶつぶつ祈りつづけたが、暗い目をしてこちらを見た様子では、胸の最も上に祈りがあったとは思われない。ほかに歌の主な部分を担う二人はがっしりと荒くれた軍人めいた四十男で、目は大胆でいかにも食べすぎたふうだった。彼らは相当な勢いで歌い、駐屯地の輪唱のように「アヴェ・マリア」を張り上げた。小さな娘たちはおずおずしてまじめだった。ゆっくり側廊を行くあいだ、一人ずつイギリス人の私に一瞬だけ目をやり、式を仕切る大柄な修道女は私がいたたまれなくなるまでじろじろ見た。聖歌隊の子らに至っては、始めから終わりまでまさしく少年にしかできぬいたずらぶりで、ふざけたしぐさが行事をひどく台なしにした。"
    "translation_status": "reviewed"

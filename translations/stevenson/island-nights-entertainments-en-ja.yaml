    "section_id": "beach-ch1"
    "kind": "heading"
    "origin": "source"
    "source_text": "CHAPTER I. A SOUTH SEA BRIDAL."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 11
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 58
        "line_end": 58
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-002"
    "translation_ja": "第一章　南海の婚礼"
    "translation_status": "reviewed"
  - "id": "beach-003"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I saw that island first when it was neither night nor morning. The moon was to the west, setting, but still broad and bright. To the east, and right amidships of the dawn, which was all pink, the daystar sparkled like a diamond. The land breeze blew in our faces, and smelt strong of wild lime and vanilla: other things besides, but these were the most plain; and the chill of it set me sneezing. I should say I had been for years on a low island near the line, living for the most part solitary among natives. Here was a fresh experience: even the tongue would be quite strange to me; and the look of these woods and mountains, and the rare smell of them, renewed my blood."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 12
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 61
        "line_end": 70
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-003"
    "translation_ja": "初めてあの島を見たのは、夜とも朝ともつかない時刻だった。月は西へ沈みかけていたが、まだ大きく明るかった。東には、一面桃色に染まった曙のど真ん中に、明星がダイヤのように光っていた。陸風が顔に吹きつけ、野生のライムとバニラがぷんと匂った。ほかにもいろんな匂いがしたが、その二つがいちばんはっきりしていた。風が冷たくて俺はくしゃみをした。断っておくが、それまで俺は何年も赤道近くの平たい島で、たいてい島の人間のなかに白人一人きりで暮らしていた。ここでは何もかも初めてだった。言葉さえまるで違うはずだった。あの森や山の姿、そこから漂う珍しい匂いを味わうと、体じゅうに新しい血が通うようだった。"
    "translation_status": "reviewed"
  - "id": "beach-004"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The captain blew out the binnacle lamp."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 13
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 72
        "line_end": 72
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-004"
    "translation_ja": "船長が羅針盤の灯りを吹き消した。"
    "translation_status": "reviewed"
  - "id": "beach-005"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There!” said he, “there goes a bit of smoke, Mr. Wiltshire, behind the break of the reef. That’s Falesá, where your station is, the last village to the east; nobody lives to windward—I don’t know why. Take my glass, and you can make the houses out.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 14
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 74
        "line_end": 77
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-005"
    "translation_ja": "「ほら」と船長が言った。「礁の切れ目の向こうに煙がひと筋、上がってるだろう、ウィルトシャーさん。あそこがあんたの商館のあるファレサーだ。いちばん東の村でね、それから風上にはどういうわけだか誰も住んでない。俺の遠眼鏡を使いな。家並みがわかるよ」"
    "translation_status": "reviewed"
  - "id": "beach-006"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I took the glass; and the shores leaped nearer, and I saw the tangle of the woods and the breach of the surf, and the brown roofs and the black insides of houses peeped among the trees."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 15
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 79
        "line_end": 81
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-006"
    "translation_ja": "遠眼鏡を取ると、岸がぐっと近くに飛び出してきた。木と木が絡んだ森、砕ける波、木の間からちらちらのぞく茶色い屋根と真っ黒な家の中が見えた。"
    "translation_status": "reviewed"
  - "id": "beach-007"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Do you catch a bit of white there to the east’ard?” the captain continued. “That’s your house. Coral built, stands high, verandah you could walk on three abreast; best station in the South Pacific. When old Adams saw it, he took and shook me by the hand. ‘I’ve dropped into a soft thing here,’ says he.—‘So you have,’ says I, ‘and time too!’ Poor Johnny! I never saw him again but the once, and then he had changed his tune—couldn’t get on with the natives, or the whites, or something; and the next time we came round there he was dead and buried. I took and put up a bit of a stick to him: ‘John Adams, obit eighteen and sixty-eight. Go thou and do likewise.’ I missed that man. I never could see much harm in Johnny.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 16
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 83
        "line_end": 93
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-007"
    "translation_ja": "「東のほうの白いところが見えるか」と船長は続けた。「あれがあんたの家だ。珊瑚造りの高台建ちで、縁廊は三人肩を並べて歩ける。南太平洋一の商館さ。アダムズのとっつぁんは、あれを見て俺の手を取って握ったよ。『こりゃえらく楽な口にありついた』って。『そうだとも、そろそろそうなっていい頃さ』と俺は言った。気の毒なジョニー！　それきり一度しか会わなかったが、その時はずいぶん口ぶりが変わってね。島の衆とうまくいかんとか、白人とうまくいかんとか、何かそんなことでさ。その次に寄ったら、もう死んで土の中だった。俺が木切れを一本立ててやったよ。『ジョン・アダムズ、千八百六十八年没。汝も行きてかくのごとくせよ』ってね。いなくなって寂しかった。ジョニーにそう悪いところなんか、俺には見つからなかったよ」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 606
          "end": 610
          "exact": "obit"
  - "id": "beach-008"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What did he die of?” I inquired."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 17
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 95
        "line_end": 95
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-008"
    "translation_ja": "「何で死んだんだい」と俺は尋ねた。"
    "translation_status": "reviewed"
  - "id": "beach-009"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Some kind of sickness,” says the captain. “It appears it took him sudden. Seems he got up in the night, and filled up on Pain-Killer and Kennedy’s Discovery. No go: he was booked beyond Kennedy. Then he had tried to open a case of gin. No go again: not strong enough. Then he must have turned to and run out on the verandah, and capsized over the rail. When they found him, the next day, he was clean crazy—carried on all the time about somebody watering his copra. Poor John!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 18
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 97
        "line_end": 103
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-009"
    "translation_ja": "「何かの病気だ」と船長が言った。「急に来たらしい。夜中に起きて、ペインキラーとケネディの万能薬をしこたま流し込んだんだそうだ。だめだよ、ケネディの薬じゃ追いつかん所まで行っちまってた。次にジンの木箱を一つ開けようとした。まただめだ、力が足りない。それで縁廊へ駆け出して、手すり越しにひっくり返ったらしい。翌日見つかった時にはすっかり気がふれててね、誰かが俺のコプラに水をかけてるって、そればっかり喚いていた。かわいそうなジョン！」"
    "translation_status": "reviewed"
  - "id": "beach-010"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Was it thought to be the island?” I asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 19
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 105
        "line_end": 105
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-010"
    "translation_ja": "「島のせいだと思われたのかい」と俺は聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-011"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, it was thought to be the island, or the trouble, or something,” he replied. “I never could hear but what it was a healthy place. Our last man, Vigours, never turned a hair. He left because of the beach—said he was afraid of Black Jack and Case and Whistling Jimmie, who was still alive at the time, but got drowned soon afterward when drunk. As for old Captain Randall, he’s been here any time since eighteen-forty, forty-five. I never could see much harm in Billy, nor much change. Seems as if he might live to be Old Kafoozleum. No, I guess it’s healthy.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 20
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 107
        "line_end": 115
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-011"
    "translation_ja": "「まあ、島のせいとか、揉め事のせいとか、何かそんなふうに言われたな」と船長は答えた。「ここは体にいい所だという話しか俺は聞かないがね。うちの前の男のヴィガーズなんか、けろっとしてた。出てったのは浜の連中のせいさ。ブラック・ジャック、ケイス、それに口笛ジミーが怖いって。その時分ジミーはまだ生きてたが、じきに酔っぱらって溺れ死んだ。ランドル船長のじいさんなんか、千八百四十年だか四十五年だか、そのあたりからずっといるよ。ビリーにも俺の見たところそう悪いところはないし、昔とそう変わってもいない。あの調子じゃカフーズレム爺さんみたいに、いつまでも生きていそうだ。いや、体にはいい所だろう」"
    "translation_status": "reviewed"
  - "id": "beach-012"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There’s a boat coming now,” said I. “She’s right in the pass; looks to be a sixteen-foot whale; two white men in the stern sheets.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 21
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 117
        "line_end": 118
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-012"
    "translation_ja": "「ボートが来るぞ」と俺は言った。「ちょうど水路の真ん中だ。十六フィートの捕鯨ボートらしい。船尾の座席に白人が二人」"
    "translation_status": "reviewed"
  - "id": "beach-013"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s the boat that drowned Whistling Jimmie!” cried the Captain; “let’s see the glass. Yes, that’s Case, sure enough, and the darkie. They’ve got a gallows bad reputation, but you know what a place the beach is for talking. My belief, that Whistling Jimmie was the worst of the trouble; and he’s gone to glory, you see. What’ll you bet they ain’t after gin? Lay you five to two they take six cases.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 22
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 120
        "line_end": 125
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-013"
    "translation_ja": "「そいつは口笛ジミーの溺れたボートだ！」と船長が叫んだ。「遠眼鏡を貸しな。ああ、確かにケイスだ、それにあの黒人だ。首に縄が似合うって評判だが、浜がどんなにおしゃべりな所か、あんたも知ってるだろう。悪さの親玉は口笛ジミーだったと俺は思うね。その本人は見てのとおり天に召された。ジンを仕入れに来たんじゃないって賭けるか？　六箱積んで帰るほうに五対二でどうだ」"
    "translation_status": "reviewed"
  - "id": "beach-014"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When these two traders came aboard I was pleased with the looks of them at once, or, rather, with the looks of both, and the speech of one. I was sick for white neighbours after my four years at the line, which I always counted years of prison; getting tabooed, and going down to the Speak House to see and get it taken off; buying gin and going on a break, and then repenting; sitting in the house at night with the lamp for company; or walking on the beach and wondering what kind of a fool to call myself for being where I was. There were no other whites upon my island, and when I sailed to the next, rough customers made the most of the society. Now to see these two when they came aboard was a pleasure. One was a negro, to be sure; but they were both rigged out smart in striped pyjamas and straw hats, and Case would have passed muster in a city. He was yellow and smallish, had a hawk’s nose to his face, pale eyes, and his beard trimmed with scissors. No man knew his country, beyond he was of English speech; and it was clear he came of a good family and was splendidly educated. He was accomplished too; played the accordion first-rate; and give him a piece of string or a cork or a pack of cards, and he could show you tricks equal to any professional. He could speak, when he chose, fit for a drawing-room; and when he chose he could blaspheme worse than a Yankee boatswain, and talk smart to sicken a Kanaka. The way he thought would pay best at the moment, that was Case’s way, and it always seemed to come natural, and like as if he was born to it. He had the courage of a lion and the cunning of a rat; and if he’s not in hell to-day, there’s no such place. I know but one good point to the man: that he was fond of his wife, and kind to her. She was a Samoa woman, and dyed her hair red, Samoa style; and when he came to die (as I have to tell of) they found one strange thing—that he had made a will, like a Christian, and the widow got the lot: all his, they said, and all Black Jack’s, and the most of Billy Randall’s in the bargain, for it was Case that kept the books. So she went off home in the schooner Manu’a, and does the lady to this day in her own place."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 23
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 127
        "line_end": 157
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-014"
    "translation_ja": "その商人二人が甲板に上がって来ると、俺はひと目で気に入った。いや、気に入ったのは二人の身なりと、片方の口のききようだ。赤道で四年も過ごしたあとで、俺は白人の隣人に飢えていた。あの四年は懲役に数えている。タブーを掛けられ、それを解いてもらいに集会小屋へ出向く。ジンを買っては羽目を外し、あとで悔やむ。夜はランプを相手に家に座るか、浜を歩き回って、こんな所にいる俺をいったい何て間抜けと呼んでやろうかと考える。俺の島にはほかに白人がいず、隣の島へ船で渡っても、付き合う相手は柄の悪い連中ばかりだった。だから二人が上がって来るのを見るのは嬉しかった。一人は確かに黒人だったが、二人とも縞のパジャマに麦わら帽といういなせな格好で、ケイスなら都会へ出したって通る男だった。黄ばんだ顔色の小柄な男で、鷹のような鼻、淡い色の目、鋏で刈りそろえた髭。国籍は、英語をしゃべるというほか誰も知らなかった。だがいい家の生まれで、立派な教育を受けているのは歴然としていた。芸も多彩だ。アコーディオンの腕は一流、一片の紐でもコルク栓でもトランプ一組でも渡せば、玄人はだしの手品を見せた。しゃべろうと思えば貴婦人の客間に通る言葉をしゃべり、その気になればアメリカの甲板長よりひどく神を罵り、カナカ人も胸を悪くするほどの毒舌を振るった。その時どのやり方がいちばん儲かるか、それがケイスのやり方で、しかもいつも自然で、生まれた時からそのために出来ていたみたいだった。獅子の度胸と鼠のずるさを持ち合わせた男だ。あいつが今地獄にいないなら、地獄なんて場所はない。たった一つ取り柄を知っている。女房が好きで、優しくしていたことだ。女房はサモアの女で、サモア流に髪を赤く染めていた。あとで話すが、ケイスが死ぬと妙なことがわかった。まっとうなキリスト者みたいに遺言を作ってあって、後家がそっくり頂戴したんだ。やつ自身の物がみんな、それにブラック・ジャックの物もみんな、ついでにビリー・ランドルの物も大半、と言われた。なにせ帳面をつけていたのはケイスだからだ。そこで女房はスクーナーのマヌア号で里へ帰り、今でも故郷で奥様然として暮らしている。"
    "translation_status": "reviewed"

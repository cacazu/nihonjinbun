        "line_end": 1540
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-276"
    "translation_ja": "『それで、誰に邪眼の話を聞いたのですか？』と私は尋ねました。"
    "translation_status": "reviewed"
  - "id": "beach-277"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“He admitted it was Case. Now, I am afraid you will think me very narrow, Mr. Wiltshire, but I must tell you I was displeased, and cannot think a trader at all a good man to advise or have an influence upon my pastors. And, besides, there had been some flying talk in the country of old Adams and his being poisoned, to which I had paid no great heed; but it came back to me at the moment."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 286
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1542
        "line_end": 1547
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-277"
    "translation_ja": "ケイスだと彼は認めました。ウィルトシャーさん、私を狭量だとお思いかもしれませんが、それは私には愉快ではありませんでした。商人が牧師に助言したり、牧師に影響を及ぼしたりするのがいいとは、とても思えません。それに、アダムズさんは毒を盛られたという噂がこのあたりに流れていました。それまでは気に留めなかったのですが、その時ふと思い出したのです。"
    "translation_status": "reviewed"
  - "id": "beach-278"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“‘And is this Case a man of a sanctified life?’ I asked."
    "source_languages":
      - "en"
    "source_locations":

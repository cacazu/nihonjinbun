  - "id": "beach-133"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Something of the sort,” said he. “It’s the worst thing of the kind I’ve heard of yet. But I’ll stand by you, Wiltshire, man to man. You come round here to-morrow about nine, and we’ll have it out with the chiefs. They’re afraid of me, or they used to be; but their heads are so big by now, I don’t know what to think. Understand me, Wiltshire; I don’t count this your quarrel,” he went on, with a great deal of resolution, “I count it all of our quarrel, I count it the White Man’s Quarrel, and I’ll stand to it through thick and thin, and there’s my hand on it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 142
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 849
        "line_end": 856
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-133"
    "translation_ja": "「まあそんなところだ」と言う。「この手の話ではこれまで聞いたうちでいちばんひどい。だが俺が味方に立つよ、ウィルトシャー。男と男だ。明日九時頃ここへ来てくれ。首長どもと決着をつけよう。俺を怖がってるはずだ。少なくとも以前はそうだった。もっとも今じゃひどくのぼせ上がってるから、どう考えたらいいものか。いいか、ウィルトシャー、これはあんた一人の争いだとは俺は思わない」ときっぱりした調子で続けた。「俺たちみんなの争いだと思う。白人のための争いだと思う。どんなことがあろうと加勢する。その誓いにほら、握手だ」"
    "translation_status": "reviewed"
  - "id": "beach-134"

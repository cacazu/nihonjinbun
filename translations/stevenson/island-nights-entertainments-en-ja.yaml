  - "id": "beach-258"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And the second thing that he would do,” said I, “if he was what I would call a man and you would call a man, Mr. Tarleton, is to bring the girl right before you or any other missionary, and to up and say: ‘I was wrong married to this wife of mine, but I think a heap of her, and now I want to be married to her right.’ Fire away, Mr. Tarleton. And I guess you’d better do it in native; it’ll please the old lady,” I said, giving her the proper name of a man’s wife upon the spot."
    "source_languages":

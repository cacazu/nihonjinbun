  - "id": "beach-417"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I think you no got any,” said she. “White man, he tell me you no got.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 426
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2379
        "line_end": 2379
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-417"
    "translation_ja": "「白い人の国には、いないと思う」とあいつ。「白い人、いないと言った」"
    "translation_status": "reviewed"
  - "id": "beach-418"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Sounds likely, don’t it?” I asked. “Why would these islands all be chock full of them and none in Europe?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 427
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2381
        "line_end": 2382
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-418"
    "translation_ja": "「へえ、そいつはいかにもありそうなこった」と俺は言った。「こっちの島々はうようよしてるのに、どうしてヨーロッパには一匹もいないんだ？」"
    "translation_status": "reviewed"
  - "id": "beach-419"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, you no got breadfruit,” said she."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 428
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2384
        "line_end": 2384
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-419"
    "translation_ja": "「だって、そっち、パンノキない」とあいつは言った。"
    "translation_status": "reviewed"
  - "id": "beach-420"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I could have torn my hair. “Now look here, old lady,” said I, “you dry up, for I’m tired of you. I’ll take the Bible, which’ll put me as straight as the mail, and that’s the last word I’ve got to say.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 429
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2386
        "line_end": 2388
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-420"
    "translation_ja": "俺は自分の髪をかきむしりたいくらいだった。「なあ、お前」と俺は言った。「もう黙ってくれ。うんざりなんだ。聖書は持っていく。そいつがあれば、俺は郵便船みたいに間違いなく着く。これで話はおしまいだ」"
    "translation_status": "reviewed"
  - "id": "beach-421"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The night fell extraordinary dark, clouds coming up with sundown and overspreading all; not a star showed; there was only an end of a moon, and that not due before the small hours. Round the village, what with the lights and the fires in the open houses, and the torches of many fishers moving on the reef, it kept as gay as an illumination; but the sea and the mountains and woods were all clean gone. I suppose it might be eight o’clock when I took the road, laden like a donkey. First there was that Bible, a book as big as your head, which I had let myself in for by my own tomfoolery. Then there was my gun, and knife, and lantern, and patent matches, all necessary. And then there was the real plant of the affair in hand, a mortal weight of gunpowder, a pair of dynamite fishing-bombs, and two or three pieces of slow match that I had hauled out of the tin cases and spliced together the best way I could; for the match was only trade stuff, and a man would be crazy that trusted it. Altogether, you see, I had the materials of a pretty good blow-up! Expense was nothing to me; I wanted that thing done right."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 430
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2390
        "line_end": 2405
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-421"
    "translation_ja": "その夜は途方もなく暗くなった。雲が日没とともにわいて、空をすっかり覆った。星も一つ見えない。月は欠け残った端っこばかりで、夜更けも過ぎなければ出てこないはずだった。村のあたりは、開け放った家々の明かりや焚き火に、礁の上を動く大勢の漁師の松明もあって、まるで祭りの灯りのようににぎやかだったが、海も山も森もきれいに消えていた。ろばのように荷物をしょって道へ出たのは、八時ごろだろう。まずあの聖書。頭ほどもある大きな本で、自分がくだらんことを言ったばかりに持ち歩く羽目になった。それから銃、ナイフ、手提げランプ、特許マッチ。これはどれもいる。そしていよいよ今度の仕事の道具だ。むやみに重い火薬、漁に使うダイナマイトの爆弾が二つ、それにブリキ缶から引っぱり出してどうにかつなぎ合わせた、ゆっくり燃える火縄が二、三本。火縄はしょせん売り物並みの品で、あんなものを信用するやつはどうかしてる。とまあ、ひと騒ぎ起こすにゃ、ずいぶん結構な道具立てだった！　金のことなんぞどうでもいい。あの仕事だけはきっちりやりたかったんだ。"
    "translation_status": "reviewed"
  - "id": "beach-422"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As long as I was in the open, and had the lamp in my house to steer by, I did well. But when I got to the path, it fell so dark I could make no headway, walking into trees and swearing there, like a man looking for the matches in his bed-room. I knew it was risky to light up, for my lantern would be visible all the way to the point of the cape, and as no one went there after dark, it would be talked about, and come to Case’s ears. But what was I to do? I had either to give the business over and lose caste with Maea, or light up, take my chance, and get through the thing the smartest I was able."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 431
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2407
        "line_end": 2415
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-422"
    "translation_ja": "広いところにいるうちは、うちのランプを目印に、順調に進んだ。だが小道に入ると真っ暗になって、さっぱり先へ進めない。寝室でマッチを探す男みたいに、木にぶつかっちゃ悪態をついていた。明かりをつけたらまずいことは分かっていた。俺のランプは岬の先まで見えるし、夜になってからそこへ行くやつなんかいないから、噂になってケイスの耳にも入る。だがどうすりゃいい？　仕事を放り出してマエアの前で面目をなくすか、それとも明かりをつけて運を天に任せ、できるだけ手早く片づけるか。その二つに一つだった。"
    "translation_status": "reviewed"
  - "id": "beach-423"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As long as I was on the path I walked hard, but when I came to the black beach I had to run. For the tide was now nearly flowed; and to get through with my powder dry between the surf and the steep hill, took all the quickness I possessed. As it was, even, the wash caught me to the knees, and I came near falling on a stone. All this time the hurry I was in, and the free air and smell of the sea, kept my spirits lively; but when I was once in the bush and began to climb the path I took it easier. The fearsomeness of the wood had been a good bit rubbed off for me by Master Case’s banjo-strings and graven images, yet I thought it was a dreary walk, and guessed, when the disciples went up there, they must be badly scared. The light of the lantern, striking among all these trunks and forked branches and twisted rope-ends of lianas, made the whole place, or all that you could see of it, a kind of a puzzle of turning shadows. They came to meet you, solid and quick like giants, and then span off and vanished; they hove up over your head like clubs, and flew away into the night like birds. The floor of the bush glimmered with dead wood, the way the match-box used to shine after you had struck a lucifer. Big, cold drops fell on me from the branches overhead like sweat. There was no wind to mention; only a little icy breath of a land-breeze that stirred nothing; and the harps were silent."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 432
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2417
        "line_end": 2436
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-423"
    "translation_ja": "小道を行くうちは急ぎ足で済んだが、黒い浜に出ると走らなきゃならなかった。もう潮が上がりきるところだったから、打ち寄せる波と切り立った丘のあいだを、火薬を濡らさず駆け抜けるのに、ありったけのすばしこさを使った。それでも波の返しに膝までさらわれて、あやうく石の上に転ぶところだった。そのあいだは急いでいたのと、潮の香のするのびのびした空気のおかげで、気分は上々だった。森に入って登り道にかかると、だいぶ歩みをゆるめた。ケイス先生のバンジョーの弦や彫り物のおかげで、この森も前ほど恐ろしくはない。それでも気の滅入る道だった。やつの信者たちがここを登っていったときには、さぞ肝をつぶしたろう。ランプの灯が幹や枝分かれしたところや、縄の端っこみたいによじれた蔓に当たると、見えるところはどこもかしこも、くるくる回る影のからくりになった。巨人みたいに大きくくっきりした影が、さっと俺に迫ってきたかと思うと、くるりと向きを変えて消える。棍棒みたいに頭の上へ持ち上がったかと思うと、鳥みたいに夜の中へ飛んでいく。森の地面では朽ち木がほの白く光っていた。昔のマッチを擦ったあとの箱が光る、あんな光だ。頭上の枝から冷たい大粒のしずくが汗のように落ちてきた。風というほどのものはなかった。ただ陸風の冷たいひと息が何も揺らさず通るだけ。竪琴は黙りこくっていた。"
    "translation_status": "reviewed"
  - "id": "beach-424"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The first landfall I made was when I got through the bush of wild cocoanuts, and came in view of the bogies on the wall. Mighty queer they looked by the shining of the lantern, with their painted faces and shell eyes, and their clothes and their hair hanging. One after another I pulled them all up and piled them in a bundle on the cellar roof, so as they might go to glory with the rest. Then I chose a place behind one of the big stones at the entrance, buried my powder and the two shells, and arranged my match along the passage. And then I had a look at the smoking head, just for good-bye. It was doing fine."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 433
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2438
        "line_end": 2446
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-424"
    "translation_ja": "最初に目印が見えたのは、野生のヤシの茂みを抜けて、塀の上の化け物どもが視界に入ったときだ。塗りたくった顔、貝殻の目、ぶら下がる衣と髪。ランプに照らされた姿ときたら、いやに奇妙だった。俺はそれを一つ残らず引っこ抜き、ほかの品と一緒にあの世へ行くよう、まとめて穴倉の屋根に積み上げた。それから入り口の大石の一つの裏を選び、火薬と二つの爆弾を埋め、通路に沿って火縄を据えた。そして煙を吐く首をひと目見た。お別れの挨拶だ。相変わらずご機嫌にやっていたよ。"
    "translation_status": "reviewed"
  - "id": "beach-425"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Cheer up,” says I. “You’re booked.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 434
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2448
        "line_end": 2448
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-425"
    "translation_ja": "「元気を出せ」と俺は言った。「お前の行き先は決まってる」"
    "translation_status": "reviewed"
  - "id": "beach-426"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was my first idea to light up and be getting homeward; for the darkness and the glimmer of the dead wood and the shadows of the lantern made me lonely. But I knew where one of the harps hung; it seemed a pity it shouldn’t go with the rest; and at the same time I couldn’t help letting on to myself that I was mortal tired of my employment, and would like best to be at home and have the door shut. I stepped out of the cellar and argued it fore and back. There was a sound of the sea far down below me on the coast; nearer hand not a leaf stirred; I might have been the only living creature this side of Cape Horn. Well, as I stood there thinking, it seemed the bush woke and became full of little noises. Little noises they were, and nothing to hurt—a bit of a crackle, a bit of a rush—but the breath jumped right out of me and my throat went as dry as a biscuit. It wasn’t Case I was afraid of, which would have been common-sense; I never thought of Case; what took me, as sharp as the colic, was the old wives’ tales, the devil-women and the man-pigs. It was the toss of a penny whether I should run: but I got a purchase on myself, and stepped out, and held up the lantern (like a fool) and looked all round."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 435
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2450
        "line_end": 2467
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-426"
    "translation_ja": "はじめは火をつけたら家へ向かうつもりだった。暗がりと朽ち木の光とランプの影のおかげで、さびしくなっていたからだ。だが竪琴の一つはどこに掛かっているか知っていた。そいつだけ道連れにしないのは惜しい。それと同時に、いまの仕事はほとほと嫌になった、家に帰って戸を閉めるのが一番いいと、腹の中じゃ認めないわけにはいかなかった。穴倉の外へ一歩出て、行くか戻るか考えた。はるか眼下の岸辺から海の音がした。手近なところでは葉っぱ一枚動かない。ホーン岬からこちら側に、生きものといっちゃ俺一人しかいないようだった。ところがそうやって立ちつくしているうち、森が目を覚まして、小さな物音でいっぱいになった気がした。何でもない小さな音だ。ぱきっと鳴ったり、さっと何かが走る音かと思えば、俺は息が詰まって、喉はビスケットみたいにからからになった。怖かったのはケイスじゃない。やつを怖がるならまだ筋が通っているが、ケイスのことは考えもしなかった。婆さんたちの昔話、女の悪魔に豚男。そいつが俺を、腹痛みたいにいきなり襲ったんだ。逃げるかどうかは銅貨の表裏みたいにきわどかった。だがどうにか踏ん張って外へ進み、ばかなことに、ランプを掲げてあたりを見まわした。"
    "translation_status": "reviewed"
  - "id": "beach-427"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In the direction of the village and the path there was nothing to be seen; but when I turned inland it’s a wonder to me I didn’t drop. There, coming right up out of the desert and the bad bush—there, sure enough, was a devil-woman, just as the way I had figured she would look. I saw the light shine on her bare arms and her bright eyes, and there went out of me a yell so big that I thought it was my death."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 436
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2469
        "line_end": 2474
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-427"
    "translation_ja": "村と小道のほうには何も見えない。だが内陸のほうへ向き直ったとき、よくもひっくり返らなかったもんだ。荒れ地と不気味な森のほうからまっすぐ上がってきたのは、ほかでもない、まさに俺が思い描いていたとおりの女の悪魔だった。むき出しの腕と光る目にランプの灯が当たるのが見えた。そのとたん、俺の口からとんでもない悲鳴が飛び出した。もう死ぬかと思ったよ。"
    "translation_status": "reviewed"
  - "id": "beach-428"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ah! No sing out!” says the devil-woman, in a kind of a high whisper. “Why you talk big voice? Put out light! Ese he come.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 437
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2476
        "line_end": 2477
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-428"
    "translation_ja": "「あっ、叫ばない！」と女の悪魔が、ささやき声を高くしたような声で言った。「なぜ大声？　明かり消して！　エセ、来る」"
    "translation_status": "reviewed"
  - "id": "beach-429"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“My God Almighty, Uma, is that you?” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 438
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2479
        "line_end": 2479
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-429"
    "translation_ja": "「おお、全能の神さま、ウマか、お前だったのか？」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-430"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ioe,” {4} says she. “I come quick. Ese here soon.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 439

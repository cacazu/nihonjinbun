    "kind": "paragraph"
    "origin": "source"
    "source_text": "That was my speech. I know how to deal with Kanakas: give them plain sense and fair dealing, and—I’ll do them that much justice—they knuckle under every time. They haven’t any real government or any real law, that’s what you’ve got to knock into their heads; and even if they had, it would be a good joke if it was to apply to a white man. It would be a strange thing if we came all this way and couldn’t do what we pleased. The mere idea has always put my monkey up, and I rapped my speech out pretty big. Then Case translated it—or made believe to, rather—and the first chief replied, and then a second, and a third, all in the same style, easy and genteel, but solemn underneath. Once a question was put to Case, and he answered it, and all hands (both chiefs and commons) laughed out aloud, and looked at me. Last of all, the puckered old fellow and the big young chief that spoke first started in to put Case through a kind of catechism. Sometimes I made out that Case was trying to fence, and they stuck to him like hounds, and the sweat ran down his face, which was no very pleasant sight to me, and at some of his answers the crowd moaned and murmured, which was a worse hearing. It’s a cruel shame I knew no native, for (as I now believe) they were asking Case about my marriage, and he must have had a tough job of it to clear his feet. But leave Case alone; he had the brains to run a parliament."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 151
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 907
        "line_end": 926
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-142"
    "translation_ja": "これが俺の弁舌だった。カナカ人の扱い方は心得ている。道理を平たく説き、公平に接すれば、まあそこだけは連中の取り柄と認めてやるが、いつだって頭を下げる。連中にはほんとの政府もほんとの法律もない。そのことを頭にたたき込まなくちゃいけない。それに仮にあったって、白人にも適用するっていうならいい笑い話だ。こんなに遠方まで来て好きなようにできないなんて、妙なことになる。その考えだけでいつも腹が煮えくり返る。俺はかなり偉そうに演説をぶっつけた。ケイスがそれを訳した。いや、訳すふりをしたと言ったほうがいい。それから一番手の首長が答え、次に二番手、三番手と、みんな同じくおおらかで上品でいて、底に厳粛なもののある口ぶりだった。一度ケイスが質問を受け、答えると、首長も平民も一同声を立てて笑い、俺を見た。最後に皺くちゃの爺さんと、最初に話した体の大きい若い首長が、ケイスに一種の問答を持ちかけた。何度か、ケイスがはぐらかそうとしているのが俺にもわかったが、相手は猟犬のように離れなかった。ケイスの顔を汗が流れた。俺には愉快な眺めではなかったし、やつの答えによっては群衆が呻き、どよめくのは、もっと不愉快な音だった。土地の言葉を知らなかったのはとんでもなく残念だ。今の俺が思うに、連中は俺の結婚についてケイスに問いただしていたので、やつは疑いを晴らして抜け出すのに骨を折ったに違いない。だがケイスに任せておけ。やつには議会ひとつ動かせるだけの頭があった。"
    "translation_status": "reviewed"
  - "id": "beach-143"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, is that all?” I asked, when a pause came."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 152
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 928
        "line_end": 928
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-143"
    "translation_ja": "「で、それで全部か」と、話が途切れたので俺は聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-144"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Come along,” says he, mopping his face; “I’ll tell you outside.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 153
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 930
        "line_end": 930
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-144"
    "translation_ja": "「おいで」と顔をぬぐいながらやつは言った。「外で話すよ」"
    "translation_status": "reviewed"
  - "id": "beach-145"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Do you mean they won’t take the taboo off?” I cried."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 154
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 932
        "line_end": 932
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-145"
    "translation_ja": "「タブーを解かないっていうのか」と俺は叫んだ。"
    "translation_status": "reviewed"
  - "id": "beach-146"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It’s something queer,” said he. “I’ll tell you outside. Better come away.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 155
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 934
        "line_end": 935
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-146"
    "translation_ja": "「妙なことなんだ」と言った。「外で話す。もう出たほうがいい」"
    "translation_status": "reviewed"
  - "id": "beach-147"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I won’t take it at their hands,” cried I. “I ain’t that kind of a man. You don’t find me turn my back on a parcel of Kanakas.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 156
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 937
        "line_end": 938
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-147"
    "translation_ja": "「そんな扱いを黙って受ける気はない」と俺は叫んだ。「俺はそんな男じゃないぞ。カナカ人の一山ぐらいで背を向けはしない」"
    "translation_status": "reviewed"
  - "id": "beach-148"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You’d better,” said Case."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 157
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 940
        "line_end": 940
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-148"
    "translation_ja": "「向けたほうがいい」とケイスは言った。"
    "translation_status": "reviewed"
  - "id": "beach-149"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He looked at me with a signal in his eye; and the five chiefs looked at me civilly enough, but kind of pointed; and the people looked at me and craned and jostled. I remembered the folks that watched my house, and how the pastor had jumped in his pulpit at the bare sight of me; and the whole business seemed so out of the way that I rose and followed Case. The crowd opened again to let us through, but wider than before, the children on the skirts running and singing out, and as we two white men walked away they all stood and watched us."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 158
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 942
        "line_end": 949
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-149"
    "translation_ja": "やつはこちらを見て、目で合図した。五人の首長は愛想よくはあったが、意味ありげに俺を見た。まわりの人々も俺を見て、首を伸ばし、押し合った。うちを見張っていた村の衆や、俺を見ただけで壇上で飛び上がった牧師のことを思い出した。何もかもあまり普通じゃないので、俺は立ってケイスについて行った。俺たちを通そうと人垣がまた割れたが、前より広く空けた。はずれにいる子供は叫んで逃げた。俺たち白人二人が歩き去るあいだ、連中はみな立って見つめていた。"
    "translation_status": "reviewed"
  - "id": "beach-150"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And now,” said I, “what is all this about?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 159
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 951
        "line_end": 951
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-150"
    "translation_ja": "「さて」と俺は言った。「こいつはいったい何のことなんだ？」"
    "translation_status": "reviewed"
  - "id": "beach-151"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“The truth is I can’t rightly make it out myself. They have a down on you,” says Case."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 160
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 953
        "line_end": 954
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-151"
    "translation_ja": "「ほんとのところ、俺自身にもよく呑み込めない。やつらはあんたを嫌ってるんだ」とケイスが言った。"
    "translation_status": "reviewed"
  - "id": "beach-152"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Taboo a man because they have a down on him!” I cried. “I never heard the like.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 161
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 956
        "line_end": 957
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-152"
    "translation_ja": "「嫌ってるからって人にタブーを掛けるのか！」と俺は叫んだ。「そんな話は聞いたことがない」"
    "translation_status": "reviewed"
  - "id": "beach-153"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It’s worse than that, you see,” said Case. “You ain’t tabooed—I told you that couldn’t be. The people won’t go near you, Wiltshire, and there’s where it is.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 162
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 959
        "line_end": 961
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-153"
    "translation_ja": "「もっと悪いんだよ、いいか」とケイス。「あんたにはタブーは掛かっていない。そりゃあり得んと言ったろう。連中があんたに近寄ろうとしないんだ、ウィルトシャー。問題はそこさ」"
    "translation_status": "reviewed"
  - "id": "beach-154"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“They won’t go near me? What do you mean by that? Why won’t they go near me?” I cried."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 163
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 963
        "line_end": 964
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-154"
    "translation_ja": "「近寄ろうとしない？　そりゃどういうことだ。なぜ俺に近寄ろうとしない？」と俺は叫んだ。"
    "translation_status": "reviewed"
  - "id": "beach-155"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Case hesitated. “Seems they’re frightened,” says he, in a low, voice."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 164
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 966
        "line_end": 966
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-155"
    "translation_ja": "ケイスはためらった。「怖がってるみたいなんだ」と声を落として言った。"
    "translation_status": "reviewed"
  - "id": "beach-156"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I stopped dead short. “Frightened?” I repeated. “Are you gone crazy, Case? What are they frightened of?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 165
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 968
        "line_end": 969
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-156"
    "translation_ja": "俺はぴたりと立ち止まった。「怖がってる？」と繰り返した。「気でもふれたのか、ケイス。何を怖がってるんだ？」"
    "translation_status": "reviewed"
  - "id": "beach-157"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I wish I could make out,” Case answered, shaking his head. “Appears like one of their tomfool superstitions. That’s what I don’t cotton to,” he said. “It’s like the business about Vigours.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 166
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 971
        "line_end": 973
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-157"
    "translation_ja": "「俺が知りたいよ」と首を振った。「あいつらの馬鹿げた迷信の一つらしい。そこがどうも気に食わない」と言った。「ヴィガーズの一件と似てる」"
    "translation_status": "reviewed"
  - "id": "beach-158"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I’d like to know what you mean by that, and I’ll trouble you to tell me,” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 167
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 975
        "line_end": 976
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-158"
    "translation_ja": "「それをどういう意味で言ってるのか、ひとつ聞かせてもらいたいね」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-159"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, you know, Vigours lit out and left all standing,” said he. “It was some superstition business—I never got the hang of it but it began to look bad before the end.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 168
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 978
        "line_end": 980
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-159"
    "translation_ja": "「知ってるだろう、ヴィガーズは何もかも置きっぱなしで飛び出した」とやつは言った。「何か迷信がらみだった。俺はとうとうわけがわからなかったが、終わりの頃には険悪になってきていた」"
    "translation_status": "reviewed"
  - "id": "beach-160"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I’ve heard a different story about that,” said I, “and I had better tell you so. I heard he ran away because of you.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 169
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 982
        "line_end": 983
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-160"
    "translation_ja": "「俺が聞いた話は違う」と俺は言った。「そう言っといたほうがいいな。あんたが原因で逃げたと聞いたぞ」"
    "translation_status": "reviewed"
  - "id": "beach-161"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“O! well, I suppose he was ashamed to tell the truth,” says Case; “I guess he thought it silly. And it’s a fact that I packed him off. ‘What would you do, old man?’ says he. ‘Get,’ says I, ‘and not think twice about it.’ I was the gladdest kind of man to see him clear away. It ain’t my notion to turn my back on a mate when he’s in a tight place, but there was that much trouble in the village that I couldn’t see where it might likely end. I was a fool to be so much about with Vigours. They cast it up to me to-day. Didn’t you hear Maea—that’s the young chief, the big one—ripping out about ‘Vika’? That was him they were after. They don’t seem to forget it, somehow.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 170
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 985
        "line_end": 994
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-161"
    "translation_ja": "「ああ、それは本当のことを言うのが恥ずかしかったんだろう」とケイスが言った。「自分でもみっともないと思ったんだろうさ。追っ払ったのが俺なのは事実だ。『お前が俺ならどうする、なあ、おい』とやつが言う。『逃げるね』と俺は言った。『しかも考え直したりはせん』。無事に去るのを見てほっとしたなんてもんじゃなかった。窮地の仲間に背を向けるのは俺の流儀じゃないが、村の揉め方が大変なもんで、どういうことになるか見当もつかなかった。ヴィガーズとあんなに一緒にいなきゃよかったんだ。今日もやつらにそれを持ち出されたよ。マエア、あの若い首長のでかいほうが、『ヴィカ』がどうのこうのとまくしたてたの、聞かなかったか？　やつらが言ってたのはヴィガーズだ。どうもあの一件を忘れないらしい」"
    "translation_status": "reviewed"
  - "id": "beach-162"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is all very well,” said I, “but it don’t tell me what’s wrong; it don’t tell me what they’re afraid of—what their idea is.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 171
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 996
        "line_end": 997
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-162"
    "translation_ja": "「そいつは大変結構」と俺は言った。「だがそれじゃどこがいけないのかわからん。何を怖がってるのか、やつらの思惑は何か、それを聞いてるんだ」"
    "translation_status": "reviewed"
  - "id": "beach-163"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, I wish I knew,” said Case. “I can’t say fairer than that.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 172
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 999
        "line_end": 999
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-163"
    "translation_ja": "「まったく、こっちが知りたいね」とケイスが言った。「それ以上正直には言えないよ」"
    "translation_status": "reviewed"
  - "id": "beach-164"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You might have asked, I think,” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 173
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1001
        "line_end": 1001
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-164"
    "translation_ja": "「聞いてみてもよかったんじゃないか」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-165"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And so I did,” says he. “But you must have seen for yourself, unless you’re blind, that the asking got the other way. I’ll go as far as I dare for another white man; but when I find I’m in the scrape myself, I think first of my own bacon. The loss of me is I’m too good-natured. And I’ll take the freedom of telling you you show a queer kind of gratitude to a man who’s got into all this mess along of your affairs.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 174
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1003
        "line_end": 1008
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-165"
    "translation_ja": "「実際聞いたんだ」とやつは言った。「だが目が節穴でないなら、途中からあべこべにこっちが聞かれる側になったのがわかったはずだ。俺だって白人仲間のためならやれるところまではやるが、自分まで渦中にあるとなれば、まず自分の身を守るさ。俺の損な性分は、人がよすぎることだ。遠慮なく言わせてもらうが、あんたの用でこんな揉め事に巻き込まれた男に対し、ずいぶん変わった感謝の示しかたをする人だ」"
    "translation_status": "reviewed"
  - "id": "beach-166"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There’s a thing I am thinking of,” said I. “You were a fool to be so much about with Vigours. One comfort, you haven’t been much about with me. I notice you’ve never been inside my house. Own up now; you had word of this before?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 175
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1010
        "line_end": 1013
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-166"
    "translation_ja": "「一つ思い当たることがある」と俺は言った。「ヴィガーズとあんなに一緒にいなきゃよかった、そう言ったな。安心しな、俺とは大して一緒にいない。俺の家には一度も足を踏み入れてないじゃないか。さあ白状しろ。前からこの話を聞いてたんだろう」"
    "translation_status": "reviewed"
  - "id": "beach-167"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It’s a fact I haven’t been,” said he. “It was an oversight, and I am sorry for it, Wiltshire. But about coming now, I’ll be quite plain.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 176
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1015
        "line_end": 1016
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-167"
    "translation_ja": "「行ってないのは確かだ」とやつは言った。「ついうっかりしていた。悪かったよ、ウィルトシャー。だが、これから行くかとなったら、はっきり言うぜ」"
    "translation_status": "reviewed"
  - "id": "beach-168"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You mean you won’t?” I asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 177
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1018
        "line_end": 1018
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-168"
    "translation_ja": "「行かない、と言う気か」と俺は聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-169"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Awfully sorry, old man, but that’s the size of it,” says Case."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 178
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1020
        "line_end": 1020
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-169"
    "translation_ja": "「えらく申し訳ない、おい、だがそういうことだ」とケイスが言った。"
    "translation_status": "reviewed"
  - "id": "beach-170"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“In short, you’re afraid?” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 179
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1022
        "line_end": 1022
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-170"
    "translation_ja": "「要するに、怖いわけだ」と俺。"
    "translation_status": "reviewed"
  - "id": "beach-171"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“In short, I’m afraid,” says he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 180
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1024
        "line_end": 1024
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-171"
    "translation_ja": "「要するに、怖いわけだ」とやつ。"
    "translation_status": "reviewed"
  - "id": "beach-172"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And I’m still to be tabooed for nothing?” I asked"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 181
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1026
        "line_end": 1026
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-172"
    "translation_ja": "「じゃあ俺は何のいわれもなくタブーを掛けられっぱなしってことか」と聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-173"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I tell you you’re not tabooed,” said he. “The Kanakas won’t go near you, that’s all. And who’s to make ’em? We traders have a lot of gall, I must say; we make these poor Kanakas take back their laws, and take up their taboos, and that, whenever it happens to suit us. But you don’t mean to say you expect a law obliging people to deal in your store whether they want to or not? You don’t mean to tell me you’ve got the gall for that? And if you had, it would be a queer thing to propose to me. I would just like to point out to you, Wiltshire, that I’m a trader myself.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 182
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1028
        "line_end": 1036
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-173"
    "translation_ja": "「タブーは掛かってないと言ってるだろう」とやつが言った。「カナカ人が近づいて来ない、それだけだ。誰に無理強いができる？　俺たち商人も図々しいよなあ。俺たちの都合がよくなれば、かわいそうなカナカどもに自分の法律を引っ込めさせたり、タブーを取り払わせたり、何だりする。だがまさか、本人が好もうが好むまいが、あんたの店で商いしろと命じる法律を期待してるんじゃないだろう？　そこまで図々しいとは言うまいね？　仮にそうだとしても、俺に持ちかけるのは妙な話だ。指摘しておくがね、ウィルトシャー、俺だって商人なんだぜ」"
    "translation_status": "reviewed"
  - "id": "beach-174"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I don’t think I would talk of gall if I was you,” said I. “Here’s about what it comes to, as well as I can make out: None of the people are to trade with me, and they’re all to trade with you. You’re to have the copra, and I’m to go to the devil and shake myself. And I don’t know any native, and you’re the only man here worth mention that speaks English, and you have the gall to up and hint to me my life’s in danger, and all you’ve got to tell me is you don’t know why!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 183
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1038
        "line_end": 1044
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-174"
    "translation_ja": "「俺があんたなら図々しさは話題にしないね」と俺は言った。「俺にわかる範囲で言えば、話は要するにこうだ。連中はひとり残らず俺と商いはせず、みんなあんたと商いをする。コプラはあんたが手に入れ、俺のほうは勝手にくたばりゃいいと。俺はここの言葉がひとつもわからない。英語を話す男で話の通じそうなのはあんた一人。それが図々しくも俺の命が危ないとほのめかしておいて、言えるのは『わけは知らん』だけか！」"
    "translation_status": "reviewed"
  - "id": "beach-175"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, it is all I have to tell you,” said he. “I don’t know—I wish I did.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 184
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1046
        "line_end": 1047
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-175"
    "translation_ja": "「ところがほんとにそれだけなんだ」とやつは言った。「知らない。俺だって知りたいよ」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 10
          "end": 12
          "exact": "is"
  - "id": "beach-176"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And so you turn your back and leave me to myself! Is that the position?” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 185
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1049
        "line_end": 1050
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-176"
    "translation_ja": "「それでこっちに背を向け、俺をひとりで放り出す！　そういう腹か」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-177"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“If you like to put it nasty,” says he. “I don’t put it so. I say merely, ‘I’m going to keep clear of you; or, if I don’t, I’ll get in danger for myself.’”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 186
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1052
        "line_end": 1054
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-177"
    "translation_ja": "「意地悪く言いたきゃな」とやつは言った。「俺はそうは言わない。俺はただこう言う。『あんたを避ける。そうしないと俺自身が危なくなる』とな」"
    "translation_status": "reviewed"
  - "id": "beach-178"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” says I, “you’re a nice kind of a white man!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 187
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1056
        "line_end": 1056
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-178"
    "translation_ja": "「まったく」と俺は言った。「ご立派な白人だこと！」"
    "translation_status": "reviewed"
  - "id": "beach-179"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“O, I understand; you’re riled,” said he. “I would be myself. I can make excuses.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 188
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1058
        "line_end": 1059
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-179"
    "translation_ja": "「ああ、わかるよ。あんたは頭に来てる」とやつ。「俺だってそうだろう。情状は酌んでやれる」"
    "translation_status": "reviewed"
  - "id": "beach-180"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“All right,” I said, “go and make excuses somewhere else. Here’s my way, there’s yours!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 189
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1061
        "line_end": 1062
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-180"
    "translation_ja": "「よろしい」と俺は言った。「ほかへ行って酌んでくれ。俺はこっちだ。あんたはそっちだ！」"
    "translation_status": "reviewed"
  - "id": "beach-181"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that we parted, and I went straight home, in a hot temper, and found Uma trying on a lot of trade goods like a baby."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 190
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1064
        "line_end": 1065
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-181"
    "translation_ja": "そう言って別れた。俺はかっかしながらまっすぐ家へ帰った。ウマが赤ん坊のように無邪気に売り物をあれこれ試着していた。"
    "translation_status": "reviewed"
  - "id": "beach-182"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Here,” I said, “you quit that foolery! Here’s a pretty mess to have made, as if I wasn’t bothered enough anyway! And I thought I told you to get dinner!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 191
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1067
        "line_end": 1069
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-182"
    "translation_ja": "「おい」と俺は言った。「そんな馬鹿なまねはやめろ！　えらく取っ散らかしてくれたな。でなくったって俺はじゅうぶん困ってるんだぞ！　飯にしておけと言ったはずだがな！」"
    "translation_status": "reviewed"
  - "id": "beach-183"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And then I believe I gave her a bit of the rough side of my tongue, as she deserved. She stood up at once, like a sentry to his officer; for I must say she was always well brought up, and had a great respect for whites."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 192
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1071
        "line_end": 1074
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-183"
    "translation_ja": "それから、まあ自業自得だが、ちょいと口汚く叱りつけたと思う。将校の前の歩哨みたいに、ウマはすぐすっくと立った。断っておくが、いつも行儀よく育ったのがわかる娘で、白人にたいそう敬意を払っていた。"
    "translation_status": "reviewed"
  - "id": "beach-184"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And now,” says I, “you belong round here, you’re bound to understand this. What am I tabooed for, anyway? Or, if I ain’t tabooed, what makes the folks afraid of me?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 193
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1076
        "line_end": 1078
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-184"
    "translation_ja": "「それはそうと」と俺は言った。「お前はここの者だ、わかるはずだ。俺はいったい何でタブーを掛けられている？　タブーじゃないとしても、なんで連中は俺を怖がるんだ？」"
    "translation_status": "reviewed"
  - "id": "beach-185"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She stood and looked at me with eyes like saucers."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 194
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1080
        "line_end": 1080
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-185"
    "translation_ja": "ウマは受け皿ほどに目を見開き、立ったまま俺を見た。"
    "translation_status": "reviewed"
  - "id": "beach-186"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You no savvy?” she gasps at last."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 195
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1082
        "line_end": 1082
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-186"
    "translation_ja": "「あなた、知らない？」とやっとのことで息をのむように言った。"
    "translation_status": "reviewed"
  - "id": "beach-187"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No,” said I. “How would you expect me to? We don’t have any such craziness where I come from.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 196
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1084
        "line_end": 1085
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-187"
    "translation_ja": "「知らん」と俺は言った。「なんで俺にわかると思う？　俺の生まれたところじゃこんな気違い沙汰はない」"
    "translation_status": "reviewed"
  - "id": "beach-188"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ese no tell you?” she asked again."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 197
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1087
        "line_end": 1087
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-188"
    "translation_ja": "「エセ、あなたに言わなかった？」ともう一度聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-189"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "(Ese was the name the natives had for Case; it may mean foreign, or extraordinary; or it might mean a mummy apple; but most like it was only his own name misheard and put in a Kanaka spelling.)"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 198
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1089
        "line_end": 1091
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-189"
    "translation_ja": "（エセは島の連中がケイスを呼ぶ名だった。「異国の」とか「風変わりな」という意味かもしれないし、パパイアかもしれない。だがいちばんありそうなのは、やつの名を聞き違えて、カナカ風に綴っただけってことだ。）"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 1
          "end": 4
          "exact": "Ese"
  - "id": "beach-190"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Not much,” said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 199
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1093
        "line_end": 1093
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-190"
    "translation_ja": "「ろくに何も言わなかった」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-191"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“D-n Ese!” she cried."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 200
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1095
        "line_end": 1095
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-191"
    "translation_ja": "「エセなんか、くたばれ！」とウマは叫んだ。"
    "translation_status": "reviewed"
  - "id": "beach-192"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "You might think it funny to hear this Kanaka girl come out with a big swear. No such thing. There was no swearing in her—no, nor anger; she was beyond anger, and meant the word simple and serious. She stood there straight as she said it. I cannot justly say that I ever saw a woman look like that before or after, and it struck me mum. Then she made a kind of an obeisance, but it was the proudest kind, and threw her hands out open."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 201
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1097
        "line_end": 1103
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-192"
    "translation_ja": "このカナカの娘が不意に大変な罵り言葉を口にしたのを聞いて、おかしいと思うかもしれない。とんでもない。ウマのうちには罵りの気持ちはこれっぽっちもない。いや、怒りすらない。怒りをとっくに通り越し、単純に、まじめに、言葉通りのことを言ったのだ。まっすぐ立ったままそう言った。あれより前にもあとにも、女があんな顔をしたのを見たとは、正直なところ言えない。俺は口がきけなくなった。やがてウマは一種のお辞儀をした。だがこれ以上はないほど誇り高いお辞儀で、開いた両手を差し出した。"
    "translation_status": "reviewed"
  - "id": "beach-193"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I ’shamed,” she said. “I think you savvy. Ese he tell me you savvy, he tell me you no mind, tell me you love me too much. Taboo belong me,” she said, touching herself on the bosom, as she had done upon our wedding-night. “Now I go ’way, taboo he go ’way too. Then you get too much copra. You like more better, I think. Tofâ, alii,” says she in the native—“Farewell, chief!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 202
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1105
        "line_end": 1110
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-193"
    "translation_ja": "「わたし、恥ずかしい」とウマが言った。「あなた知ってると思ってた。あなた知ってる、エセそう言った。あなた気にしない、わたしのことすごく好きって言った。タブー、わたしのもの」と、あの婚礼の晩のように、自分の胸に手を触れた。「いま、わたし出てく。タブーも出てく。それであなたコプラいっぱいもらえる。そのほうがいい、わたし思う。トファー、アリイ」と土地の言葉で言った。「さようなら、首長さま」だ。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 320
          "end": 324
          "exact": "Tofâ"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 326
          "end": 330
          "exact": "alii"
  - "id": "beach-194"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Hold on!” I cried. “Don’t be in such a hurry.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 203
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1112
        "line_end": 1112
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-194"
    "translation_ja": "「待ってくれ！」と俺は叫んだ。「そう急ぐな」"
    "translation_status": "reviewed"
  - "id": "beach-195"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She looked at me sidelong with a smile. “You see, you get copra,” she said, the same as you might offer candies to a child."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 204
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1114
        "line_end": 1115
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-195"
    "translation_ja": "ウマは横目に俺を見て微笑んだ。「ほら、コプラ手に入るでしょ」と、子供に飴でも差し出すふうに言った。"
    "translation_status": "reviewed"
  - "id": "beach-196"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Uma,” said I, “hear reason. I didn’t know, and that’s a fact; and Case seems to have played it pretty mean upon the pair of us. But I do know now, and I don’t mind; I love you too much. You no go ’way, you no leave me, I too much sorry.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 205
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1117
        "line_end": 1120
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-196"
    "translation_ja": "「ウマ」と俺は言った。「道理を聞いてくれ。俺は知らなかったんだ、それは事実だ。ケイスは俺たち二人にずいぶん卑劣なまねをしたようだ。だが今は知ってる、それでも気にしない。お前が大好きだから。お前、出てかない。俺を置いてかない。俺、とっても悲しい」"
    "translation_status": "reviewed"
  - "id": "beach-197"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You no love, me,” she cried, “you talk me bad words!” And she threw herself in a corner of the floor, and began to cry."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 206
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1122
        "line_end": 1123
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-197"
    "translation_ja": "「あなた、わたし好きじゃない」とウマが叫んだ。「悪い言葉、わたしに言う！」そして床の隅っこに身を投げ、泣きだした。"
    "translation_status": "reviewed"
  - "id": "beach-198"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Well, I’m no scholar, but I wasn’t born yesterday, and I thought the worst of that trouble was over. However, there she lay—her back turned, her face to the wall—and shook with sobbing like a little child, so that her feet jumped with it. It’s strange how it hits a man when he’s in love; for there’s no use mincing things—Kanaka and all, I was in love with her, or just as good. I tried to take her hand, but she would none of that. “Uma,” I said, “there’s no sense in carrying on like this. I want you stop here, I want my little wifie, I tell you true.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 207
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1125
        "line_end": 1132
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-198"
    "translation_ja": "さて、俺は学者じゃないが昨日生まれたわけでもない。このごたごたもいちばん困るところは切り抜けたと思った。それにしてもウマはそこに寝て、俺に背を向け、顔を壁へ向け、小さな子供のようにしゃくり上げて体を震わせ、そのたびに足までぴょこぴょこ跳ねるのだった。恋をしてる男には、こういうものの堪えかたがおかしなものだ。ことばを濁してもしかたない。カナカだろうと何だろうと、俺はこの娘に恋していた。あるいはそれも同然だった。俺は手を取ろうとしたが、相手にしてくれない。「ウマ」と俺は言った。「いつまでもこうしてたってしょうがない。お前ここにいてほしい。俺、小さいお嫁さん欲しい。ほんとの話」"
    "translation_status": "reviewed"
  - "id": "beach-199"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No tell me true,” she sobbed."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 208
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1134
        "line_end": 1134
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-199"
    "translation_ja": "「ほんとの話、してない」とウマはしゃくり上げた。"
    "translation_status": "reviewed"
  - "id": "beach-200"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“All right,” says I, “I’ll wait till you’re through with this.” And I sat right down beside her on the floor, and set to smooth her hair with my hand. At first she wriggled away when I touched her; then she seemed to notice me no more; then her sobs grew gradually less, and presently stopped; and the next thing I knew, she raised her face to mime."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 209
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1136
        "line_end": 1140
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-200"
    "translation_ja": "「わかった」と俺は言った。「それが済むまで待ってるよ」そのまま隣の床に腰を下ろし、手のひらで髪を撫で始めた。最初は触れると身をよじって逃げた。次には俺に気づいていないようになった。それからだんだんむせび泣く声が小さくなり、じきに止まった。気がつくと、ウマは俺の顔のほうへ顔を上げていた。"
    "translation_status": "reviewed"
  - "id": "beach-201"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You tell me true? You like me stop?” she asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 210
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1142
        "line_end": 1142
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-201"
    "translation_ja": "「ほんと言う？　わたし、いてほしい？」と聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-202"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Uma,” I said, “I would rather have you than all the copra in the South Seas,” which was a very big expression, and the strangest thing was that I meant it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 211
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1144
        "line_end": 1146
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-202"
    "translation_ja": "「ウマ」と俺は言った。「南海じゅうのコプラよりお前のほうがいい」。とてつもなく大げさな言いようで、いちばん奇妙なのは、それが本心だったことだ。"
    "translation_status": "reviewed"
  - "id": "beach-203"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She threw her arms about me, sprang close up, and pressed her face to mine in the island way of kissing, so that I was all wetted with her tears, and my heart went out to her wholly. I never had anything so near me as this little brown bit of a girl. Many things went together, and all helped to turn my head. She was pretty enough to eat; it seemed she was my only friend in that queer place; I was ashamed that I had spoken rough to her: and she was a woman, and my wife, and a kind of a baby besides that I was sorry for; and the salt of her tears was in my mouth. And I forgot Case and the natives; and I forgot that I knew nothing of the story, or only remembered it to banish the remembrance; and I forgot that I was to get no copra, and so could make no livelihood; and I forgot my employers, and the strange kind of service I was doing them, when I preferred my fancy to their business; and I forgot even that Uma was no true wife of mine, but just a maid beguiled, and that in a pretty shabby style. But that is to look too far on. I will come to that part of it next."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 212
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1148
        "line_end": 1163
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-203"
    "translation_ja": "ウマは両腕を俺に回し、ぱっと身を寄せ、島風の口づけのしかたで俺の顔に顔をぴたっと押し当てた。俺は娘の涙ですっかり濡れ、心をそっくり渡してしまった。褐色の小さなこの娘ほど身近に感じたものはそれまで何もなかった。いろんなことが重なって、どれもこれも俺をのぼせさせるのに一役買った。食べたいほどきれいだった。あの奇妙な土地で俺の味方といえばこの娘ひとりに思えた。きつい物言いをしたのを恥じていた。娘は女であり、俺の妻であり、そのうえ、かわいそうな、一種の赤ん坊でもあった。口の中にはその涙の塩気があった。俺はケイスも島の衆も忘れた。この一件のいきさつを何も知らないことも忘れた。いや、思い出すのは記憶を追い払うためくらいだった。コプラが手に入らず飯の食い上げになることも忘れた。雇い主を忘れた。会社の商売より自分の気まぐれを取り、えらく変わったご奉公をしてることも。ウマがじつは本物の俺の妻ではなく、しかもずいぶんみっともない手口で騙された娘にすぎないことさえ忘れた。だがそれでは話の先を見すぎる。それは次に話そう。"
    "translation_status": "reviewed"
  - "id": "beach-204"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was late before we thought of getting dinner. The stove was out, and gone stone-cold; but we fired up after a while, and cooked each a dish, helping and hindering each other, and making a play of it like children. I was so greedy of her nearness that I sat down to dinner with my lass upon my knee, made sure of her with one hand, and ate with the other. Ay, and more than that. She was the worst cook I suppose God made; the things she set her hand to it would have sickened an honest horse to eat of; yet I made my meal that day on Uma’s cookery, and can never call to mind to have been better pleased."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 213
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1165
        "line_end": 1173
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-204"
    "translation_ja": "食事を作ろうと思い出した時にはもう遅くなっていた。かまどの火は消え、石のように冷えきっていた。それでもしばらくして火を入れ、互いに助けたり邪魔したり、子供のように遊び半分で一品ずつ作った。俺はそばにいさせたいと欲張るあまり、食事には娘を膝にのせて腰を下ろし、片手でしっかりつかまえ、もう片手で食べた。ああ、それどころじゃない。ウマは神様がこしらえたうちでも恐らくいちばんの料理下手だった。あの子が手をかけたものを食わされたら、まっとうな馬でも胸が悪くなったろう。なのにその日は俺はウマの料理で腹を満たし、あれほど嬉しい食事を俺はほかに思い出せない。"
    "translation_status": "reviewed"
  - "id": "beach-205"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I didn’t pretend to myself, and I didn’t pretend to her. I saw I was clean gone; and if she was to make a fool of me, she must. And I suppose it was this that set her talking, for now she made sure that we were friends. A lot she told me, sitting in my lap and eating my dish, as I ate hers, from foolery—a lot about herself and her mother and Case, all which would be very tedious, and fill sheets if I set it down in Beach de Mar, but which I must give a hint of in plain English, and one thing about myself which had a very big effect on my concerns, as you are soon to hear."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 214
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1175
        "line_end": 1183
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-205"
    "translation_ja": "自分にも嘘はつかなかったし、ウマにもつかなかった。俺はすっかり参ってしまったとわかった。今後あの子が俺をいいようにあしらうなら、それはしかたない。たぶんそれでウマは話す気になったんだろう。俺たちが味方同士だと、ようやく確信したんだ。膝に座り、俺がこの子の料理を食べたのと同じくふざけて俺の料理を食べながら、いろんなことを話してくれた。自分のこと、おっ母さんのこと、ケイスのこと。南海の混じり英語をそのまま書き写したら、恐ろしく退屈なうえに何枚も紙を取るだろうから、普通の言葉であらましを記しておこう。それから俺自身についても一つ教えてくれ、そいつはもうじき話すように、俺の身の上にずいぶん大きな影響を及ぼした。"
    "translation_status": "reviewed"
  - "id": "beach-206"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It seems she was born in one of the Line Islands; had been only two or three years in these parts, where she had come with a white man, who was married to her mother and then died; and only the one year in Falesá. Before that they had been a good deal on the move, trekking about after the white man, who was one of those rolling stones that keep going round after a soft job. They talk about looking for gold at the end of a rainbow; but if a man wants an employment that’ll last him till he dies, let him start out on the soft-job hunt. There’s meat and drink in it too, and beer and skittles, for you never hear of them starving, and rarely see them sober; and as for steady sport, cock-fighting isn’t in the same county with it. Anyway, this beachcomber carried the woman and her daughter all over the shop, but mostly to out-of-the-way islands, where there were no police, and he thought, perhaps, the soft job hung out. I’ve my own view of this old party; but I was just as glad he had kept Uma clear of Apia and Papeete and these flash towns. At last he struck Fale-alii on this island, got some trade—the Lord knows how!—muddled it all away in the usual style, and died worth next to nothing, bar a bit of land at Falesá that he had got for a bad debt, which was what put it in the minds of the mother and daughter to come there and live. It seems Case encouraged them all he could, and helped to get their house built. He was very kind those days, and gave Uma trade, and there is no doubt he had his eye on her from the beginning. However, they had scarce settled, when up turned a young man, a native, and wanted to marry her. He was a small chief, and had some fine mats and old songs in his family, and was “very pretty,” Uma said; and, altogether, it was an extraordinary match for a penniless girl and an out-islander."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 215
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1185
        "line_end": 1211
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-206"
    "translation_ja": "ウマはライン諸島の一つで生まれたのだそうだ。この海域にはまだ二、三年しかいない。おっ母さんと結婚した白人に連れられて来たのだ。その男はのちに死んだ。母娘がファレサーに来てからは、たった一年だった。その前は、楽な仕事はないかと転がり回る男、いわゆる転がる石のようなその白人のあとを追い、二人はずいぶんあちこちを渡り歩いていた。虹の端に黄金を探すという話がある。しかし死ぬまで続く仕事が欲しけりゃ、ひとつ楽な仕事を探す旅に出るがいい。その道には食い物も飲み物もあり、ビールも玉倒し遊びもついてくる。なにしろその手合いが飢えたとは聞いたためしがなく、素面でいるのはめったに見ない。息の長い道楽という点じゃ闘鶏なんぞ足もとにも及ばない。とにかくこの浜の流れ者は妻と娘をどこへでも引っ張り回したが、たいがいは警察のないへんぴな島々だった。たぶんそこいらに楽な仕事が潜んでいると思っていたのだろう。この御仁について俺には俺の意見がある。もっともウマをアピアやパペーテみたいなけばけばしい町に近づけずにいてくれたのは、願ったりだった。しまいにこの島のファレ・アリイに流れ着いて、どうやったかは神のみぞ知るが、いくらか商品を手に入れ、いつもの流儀ですっかり棒に振り、持ち物らしい物といえば焦げついた貸しの代わりに手に入れたファレサーの猫の額ほどの地所だけで死んだ。それで母娘はそこへ移って暮らそうと考えたわけだ。ケイスは乗り気になるよう大いに勧め、家を建てるのにも手を貸したそうだ。当時はひどく親切にしてウマには品物までやった。初めから目をつけていたのは疑いない。ところが二人がようやく落ち着いたころ、島の若者がひとり現れて、ウマと結婚したいと言い出した。小さいながら首長で、一族は立派な織り筵や古い歌を所蔵し、「とてもきれいな人」だった、とウマは言った。何から何まで、無一文でよその島から来た娘には破格の縁談だった。"
    "translation_status": "reviewed"
  - "id": "beach-207"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At the first word of this I got downright sick with jealousy."
    "source_languages":

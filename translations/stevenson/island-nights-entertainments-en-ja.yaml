  - "id": "beach-021"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I saw one coming on the other side alone. She had been fishing; all she wore was a chemise, and it was wetted through. She was young and very slender for an island maid, with a long face, a high forehead, and a shy, strange, blindish look, between a cat’s and a baby’s."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 30
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 205
        "line_end": 208
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-021"
    "translation_ja": "向こうを一人で来る娘が見えた。魚を捕っていたらしい。着ているのは肌着一枚、それもぐっしょり濡れている。若く、島の娘にしてはたいへん細身で、面長、高い額。おずおずして、目のよく見えぬような風変わりな目つきは、猫と赤ん坊のあいの子みたいだった。"
    "translation_status": "reviewed"
  - "id": "beach-022"
    "section_id": "beach-ch1"
    "kind": "paragraph"

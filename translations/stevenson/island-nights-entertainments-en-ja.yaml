  - "id": "beach-019"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was a crowd of girls about us, and I pulled myself up and looked among them like a Bashaw. They were all dressed out for the sake of the ship being in; and the women of Falesá are a handsome lot to see. If they have a fault, they are a trifle broad in the beam; and I was just thinking so when Case touched me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 28
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 197
        "line_end": 201
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-019"
    "translation_ja": "俺たちのまわりには娘が大勢いた。俺はしゃんと胸を張り、太守にでもなったつもりで皆を見渡した。船が来たので皆着飾っていたし、ファレサーの女たちは見ていてほれぼれするような連中だ。難といえば船腹の幅が少し広いか。ちょうどそんなことを考えていると、ケイスが俺にそっと触れた。"
    "translation_status": "reviewed"
  - "id": "beach-020"
    "section_id": "beach-ch1"
    "kind": "paragraph"

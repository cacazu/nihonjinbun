  - "id": "beach-275"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“‘And I explain it, Misi,’ said Namu, ‘in this way: The country in Europe is a Popey country, and the devil of the Evil Eye may be a Catholic devil, or, at least, used to Catholic ways. So then I reasoned thus: if this sign of the cross were used in a Popey manner it would be sinful, but when it is used only to protect men from a devil, which is a thing harmless in itself, the sign too must be, as a bottle is neither good nor bad, harmless. For the sign is neither good nor bad. But if the bottle be full of gin, the gin is bad; and if the sign be made in idolatry bad, so is the idolatry.’ And, very like a native pastor, he had a text apposite about the casting out of devils."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 284
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1529
        "line_end": 1538
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-275"
    "translation_ja": "『ミシ、私はこう考えました』とナムは言いました。『そのヨーロッパの国は教皇を奉じる国です。邪眼の悪魔は、カトリックの悪魔か、少なくともカトリックのやり方に慣れた悪魔かもしれません。それで考えたのです。教皇派の流儀で十字を切るなら罪になりますが、ただ人を悪魔から守るためなら、それ自体に害がありませんから、そのしるしにも害はありません。びんそのものに善も悪もないのと同じです。十字のしるしも、それだけなら善でも悪でもありません。ただしびんがジンでいっぱいなら、そのジンは悪いものです。十字のしるしも、それが偶像を拝むためなら、悪いのはその偶像崇拝です』。そして、いかにも島の牧師らしく、悪魔を追い払うことについて、ぴったりの聖書の一節まで持ち出しました。"
    "translation_status": "reviewed"
  - "id": "beach-276"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“‘And who has been telling you about the Evil Eye?’ I asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 285

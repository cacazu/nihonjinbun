        "original_unit_id": "beach-258"
    "translation_ja": "「次にやることは」と俺は言った。「俺もあなたも男と認めるような男なら、タールトンさん、あなたかほかの宣教師のところへ娘を真っすぐ連れていって、こう言うことです。『この女房とはでたらめな結婚をしました。だが、俺にはかけがえのない女房です。今度はちゃんとこの女房と結婚したいんです』。さあ、始めてください、タールトンさん。島の言葉でやってくれるといいと思います。うちのかみさんが喜ぶから」。そう言って俺はその場で、男の妻にふさわしい呼び名を彼女に贈った。"
    "translation_status": "reviewed"

  - "id": "bottle-156"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was judged the most wise to hire a house, which they did accordingly, opposite the British Consul’s, to make a great parade of money, and themselves conspicuous with carriages and horses. This it was very easy to do, so long as they had the bottle in their possession; for Kokua was more bold than Keawe, and, whenever she had a mind, called on the imp for twenty or a hundred dollars. At this rate they soon grew to be remarked in the town; and the strangers from Hawaii, their riding and their driving, the fine holokus and the rich lace of Kokua, became the matter of much talk."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 633
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3637
        "line_end": 3645
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-156"
    "translation_ja": "家を借りるのがいちばん利口だろうと考えて、イギリス領事宅の向かいに一軒借り、富を大いに見せびらかし、馬や馬車に乗ってわざと人目を引いた。びんが手もとにあるかぎり、これはごくたやすかった。コクアはケアウェより大胆で、思いつくたびに小鬼を呼び、二十ドルでも百ドルでも出させたからだ。それで二人は間もなく町じゅうの注目を浴びた。ハワイから来たよそ者のこと、馬を乗り回したり馬車を駆ったりすること、コクアの見事なホロクと豪華なレースのことは、大した評判になった。"
    "translation_status": "reviewed"
  - "id": "bottle-157"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They got on well after the first with the Tahitian language, which is indeed like to the Hawaiian, with a change of certain letters; and as soon as they had any freedom of speech, began to push the bottle. You are to consider it was not an easy subject to introduce; it was not easy to persuade people you were in earnest, when you offered to sell them for four centimes the spring of health and riches inexhaustible. It was necessary besides to explain the dangers of the bottle; and either people disbelieved the whole thing and laughed, or they thought the more of the darker part, became overcast with gravity, and drew away from Keawe and Kokua, as from persons who had dealings with the devil. So far from gaining ground, these two began to find they were avoided in the town; the children ran away from them screaming, a thing intolerable to Kokua; Catholics crossed themselves as they went by; and all persons began with one accord to disengage themselves from their advances."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 634
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3647
        "line_end": 3660
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-157"
    "translation_ja": "初めのうちを過ぎると、タヒチの言葉もよく通じた。いくつかの文字が入れ替わるほかは、実際ハワイの言葉によく似ているのである。いくらか自由にものが言えるようになると、二人はびんを売り込もうとし始めた。ただ、持ち出しやすい話題でなかったことは察していただきたい。健康と尽きることのない富の泉を四サンチームでお売りしますと言って、本気だと人に納得させるのは楽ではない。そのうえ、びんの危険も説明する必要があった。すると人々は何もかも嘘だと笑い飛ばすか、さもなければ怖い方の話ばかりが気になって顔を曇らせ、悪魔と取引のある相手を見るように二人から離れた。話が進むどころか、二人は町で避けられていることに気づき始めた。子供たちは叫んで逃げた。それはコクアには耐えられなかった。カトリック教徒は二人が通ると十字を切り、誰も彼もが申し合わせたように、近づこうとする二人を体よくかわし始めた。"
    "translation_status": "reviewed"
  - "id": "bottle-158"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Depression fell upon their spirits. They would sit at night in their new house, after a day’s weariness, and not exchange one word, or the silence would be broken by Kokua bursting suddenly into sobs. Sometimes they would pray together; sometimes they would have the bottle out upon the floor, and sit all evening watching how the shadow hovered in the midst. At such times they would be afraid to go to rest. It was long ere slumber came to them, and, if either dozed off, it would be to wake and find the other silently weeping in the dark, or, perhaps, to wake alone, the other having fled from the house and the neighbourhood of that bottle, to pace under the bananas in the little garden, or to wander on the beach by moonlight."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 635
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3662
        "line_end": 3672
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-158"
    "translation_ja": "二人の心には憂鬱がのしかかった。一日疲れ果てて帰った夜は、新しい家に座ってひと言も交わさず、沈黙を破るといえばコクアがふいにすすり泣き出すぐらいだった。二人で祈ることもあれば、床にびんを出して、中ほどに影の漂うのをひと晩じゅう眺めていることもあった。そんなときは眠りにつくのが怖かった。寝入るまでにずいぶんかかり、やっとどちらかがうとうとして目覚めると、相手が闇の中で声を殺して泣いている。あるいは目覚めると一人きりで、もう一人は家を逃げ出し、びんから離れて、小さな庭のバナナの下を歩き回るか、月明かりの浜辺をさまよっているのだった。"
    "translation_status": "reviewed"
  - "id": "bottle-159"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "One night it was so when Kokua awoke. Keawe was gone. She felt in the bed and his place was cold. Then fear fell upon her, and she sat up in bed. A little moonshine filtered through the shutters. The room was bright, and she could spy the bottle on the floor. Outside it blew high, the great trees of the avenue cried aloud, and the fallen leaves rattled in the verandah. In the midst of this Kokua was aware of another sound; whether of a beast or of a man she could scarce tell, but it was as sad as death, and cut her to the soul. Softly she arose, set the door ajar, and looked forth into the moonlit yard. There, under the bananas, lay Keawe, his mouth in the dust, and as he lay he moaned."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 636
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3674
        "line_end": 3683
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-159"
    "translation_ja": "ある晩コクアが目を覚ますと、まさにそうだった。ケアウェがいない。寝床をまさぐると、彼の寝ていた側は冷たかった。恐ろしくなって身を起こした。鎧戸からわずかな月の光が差し込んでいた。部屋の中は見分けられるほど明るく、床にはびんが見えた。外は風が強く、並木道の大木が大きな声で鳴き、ベランダでは落ち葉ががさがさ音を立てていた。そのさなか、コクアは別の音に気づいた。獣の声か人の声か、聞き分けもつかなかったが、死のように悲しく、魂まで切り裂かれる思いがした。そっと起き、戸を少し開いて、月光に照らされた庭を見やった。バナナの下にケアウェが口を土につけて横たわり、そのままうめいていた。"
    "translation_status": "reviewed"
  - "id": "bottle-160"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was Kokua’s first thought to run forward and console him; her second potently withheld her. Keawe had borne himself before his wife like a brave man; it became her little in the hour of weakness to intrude upon his shame. With the thought she drew back into the house."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 637
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3685
        "line_end": 3688
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-160"
    "translation_ja": "コクアは真っ先に、駆け出して慰めたいと思った。しかし、次に浮かんだ考えに足を止めた。ケアウェは妻の前では勇敢に振る舞ってきた。そんな人が弱さを見せたときに、わざわざ踏み込んで恥をかかせるのは、妻のすることではない。そう思って家の中へ引っ込んだ。"
    "translation_status": "reviewed"
  - "id": "bottle-161"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Heaven!” she thought, “how careless have I been—how weak! It is he, not I, that stands in this eternal peril; it was he, not I, that took the curse upon his soul. It is for my sake, and for the love of a creature of so little worth and such poor help, that he now beholds so close to him the flames of hell—ay, and smells the smoke of it, lying without there in the wind and moonlight. Am I so dull of spirit that never till now I have surmised my duty, or have I seen it before and turned aside? But now, at least, I take up my soul in both the hands of my affection; now I say farewell to the white steps of heaven and the waiting faces of my friends. A love for a love, and let mine be equalled with Keawe’s! A soul for a soul, and be it mine to perish!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 638
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3690
        "line_end": 3700
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-161"
    "translation_ja": "「天よ！」と彼女は思った。「私はなんて迂闊だったのでしょう。なんて弱かったのでしょう！　永遠に滅びかねないのは私じゃない、あの人だ。魂に呪いを引き受けたのは私じゃない、あの人だ。私のために、これほど値打ちもなく、これほど何の助けにもならない女を愛したために、あの人は今あそこに、月明かりと風の中に身を投げ出して、すぐ目の前に地獄の炎を見ている。ええ、その煙の匂いまでも嗅いでいる。この瞬間まで務めに気づかないほど私の心は鈍かったのかしら。それとも、前に見えていたのに目をそらしたの？　でも少なくとも今、私は愛するこの両手で自分の魂を取って差し出す。天国の白い階段にも、私を待つ友達の顔にもお別れを言う。愛には愛を、私の愛もケアウェの愛と同じだけありますように！　魂には魂を、滅びるのは私でありますように！」"
    "translation_status": "reviewed"
  - "id": "bottle-162"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She was a deft woman with her hands, and was soon apparelled. She took in her hands the change—the precious centimes they kept ever at their side; for this coin is little used, and they had made provision at a Government office. When she was forth in the avenue clouds came on the wind, and the moon was blackened. The town slept, and she knew not whither to turn till she heard one coughing in the shadow of the trees."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 639
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3702
        "line_end": 3707
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-162"
    "translation_ja": "手際のいい女だったので、すぐに身支度ができた。釣り銭に用意してあった硬貨、二人がいつも手元に置いた貴重なサンチームをつかんだ。あまり使われない硬貨なので、役所で用立てておいたのだ。並木道に出ると雲が風に乗って来て、月を暗くした。町は眠り、どちらへ向かえばよいか分からなかったが、そのうち木陰で誰かが咳をするのを聞いた。"
    "translation_status": "reviewed"
  - "id": "bottle-163"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Old man,” said Kokua, “what do you here abroad in the cold night?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 640
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3709
        "line_end": 3709
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-163"
    "translation_ja": "「おじいさん」とコクアは声をかけた。「こんな寒い夜に、外で何をなさっているの」"
    "translation_status": "reviewed"
  - "id": "bottle-164"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The old man could scarce express himself for coughing, but she made out that he was old and poor, and a stranger in the island."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 641
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3711
        "line_end": 3712
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-164"
    "translation_ja": "老人は咳のためにろくに口もきけなかった。だが彼が年老いた貧しい人で、この島ではよそ者だということは聞き取れた。"
    "translation_status": "reviewed"
  - "id": "bottle-165"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Will you do me a service?” said Kokua. “As one stranger to another, and as an old man to a young woman, will you help a daughter of Hawaii?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 642
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3714
        "line_end": 3715
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-165"
    "translation_ja": "「お願いを聞いてくださらない？」とコクアは言った。「よそ者同士のよしみで、お年を召した方から若い女への情けだと思って、ハワイの娘を一人、助けてくださらない？」"
    "translation_status": "reviewed"
  - "id": "bottle-166"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ah,” said the old man. “So you are the witch from the eight islands, and even my old soul you seek to entangle. But I have heard of you, and defy your wickedness.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 643
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3717
        "line_end": 3719
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-166"
    "translation_ja": "「ああ」と老人は言った。「それではあんたがあの八つの島から来た魔女か。わしみたいな年寄りの魂まで絡め取ろうというんだな。だがあんたの噂は聞いている。その悪だくみの手には乗らんぞ」"
    "translation_status": "reviewed"
  - "id": "bottle-167"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Sit down here,” said Kokua, “and let me tell you a tale.” And she told him the story of Keawe from the beginning to the end."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 644
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3721
        "line_end": 3722
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-167"
    "translation_ja": "「ここに座って、一つお話をさせてください」とコクアは言った。そして最初から最後までケアウェの身の上を話した。"
    "translation_status": "reviewed"
  - "id": "bottle-168"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And now,” said she, “I am his wife, whom he bought with his soul’s welfare. And what should I do? If I went to him myself and offered to buy it, he would refuse. But if you go, he will sell it eagerly; I will await you here; you will buy it for four centimes, and I will buy it again for three. And the Lord strengthen a poor girl!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 645
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3724
        "line_end": 3728
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-168"
    "translation_ja": "「私はその人の妻です。あの人は魂の安泰と引き換えに私を妻にしたの」と彼女は言った。「さあ、私はどうしたらいいでしょう。自分であの人のところへ行ってびんを買うと言っても、あの人は断ってしまう。でもあなたが行けば、喜んで売るわ。私はここで待っています。あなたが四サンチームで買って、私が三サンチームで買い取ります。どうか主よ、この哀れな娘に力を！」"
    "translation_status": "reviewed"
  - "id": "bottle-169"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“If you meant falsely,” said the old man, “I think God would strike you dead.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 646
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3730
        "line_end": 3731
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-169"
    "translation_ja": "「もしその言葉に偽りがあれば」と老人は言った。「神様はあんたを打ち殺すと思うぞ」"
    "translation_status": "reviewed"
  - "id": "bottle-170"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“He would!” cried Kokua. “Be sure he would. I could not be so treacherous—God would not suffer it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 647
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3733
        "line_end": 3734
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-170"
    "translation_ja": "「きっとそうなさる！」とコクアは叫んだ。「そうなさるに決まっています。そこまで人を裏切るなんて私にはできない。神様がお許しにならない」"
    "translation_status": "reviewed"
  - "id": "bottle-171"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Give me the four centimes and await me here,” said the old man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 648
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3736
        "line_end": 3736
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-171"
    "translation_ja": "「四サンチームおくれ。ここでわしを待っていなさい」と老人は言った。"
    "translation_status": "reviewed"
  - "id": "bottle-172"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now, when Kokua stood alone in the street, her spirit died. The wind roared in the trees, and it seemed to her the rushing of the flames of hell; the shadows tossed in the light of the street lamp, and they seemed to her the snatching hands of evil ones. If she had had the strength, she must have run away, and if she had had the breath she must have screamed aloud; but, in truth, she could do neither, and stood and trembled in the avenue, like an affrighted child."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 649
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3738
        "line_end": 3744
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-172"
    "translation_ja": "通りに一人きりで立つと、コクアの気持ちはくずおれた。風が木々に吠え、それが地獄の炎のうなりに思えた。街灯の光に影が踊り、それが悪鬼どものつかみかかる手に見えた。力があれば逃げ出しただろう。息があれば大声で叫んだろう。だがじつのところ、どちらもできず、怯えた子供のように並木道に突っ立って震えていた。"
    "translation_status": "reviewed"
  - "id": "bottle-173"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Then she saw the old man returning, and he had the bottle in his hand."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 650
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3746
        "line_end": 3746
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-173"
    "translation_ja": "やがて老人が帰ってくるのが見えた。その手にびんがあった。"
    "translation_status": "reviewed"
  - "id": "bottle-174"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I have done your bidding,” said he. “I left your husband weeping like a child; to-night he will sleep easy.” And he held the bottle forth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 651
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3748
        "line_end": 3749
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-174"
    "translation_ja": "「頼まれたことはしてきたよ」と言った。「別れるとき、あんたのご亭主は子供のように泣いていた。今夜は楽に眠れるよ」。そう言ってびんを差し出した。"
    "translation_status": "reviewed"
  - "id": "bottle-175"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Before you give it me,” Kokua panted, “take the good with the evil—ask to be delivered from your cough.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 652
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3751
        "line_end": 3752
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-175"
    "translation_ja": "「渡してくださる前に」とコクアは息をはずませて言った。「悪いことと一緒に、いいことも受け取って。その咳を治してくれとお頼みなさい」"
    "translation_status": "reviewed"
  - "id": "bottle-176"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I am an old man,” replied the other, “and too near the gate of the grave to take a favour from the devil. But what is this? Why do you not take the bottle? Do you hesitate?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 653
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3754
        "line_end": 3756
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-176"
    "translation_ja": "「わしは年寄りだ。墓の門も遠くないのに悪魔の恩は受けられん」と相手は答えた。「しかし、どうした？　なぜびんを受け取らない？　ためらっているのか」"
    "translation_status": "reviewed"
  - "id": "bottle-177"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Not hesitate!” cried Kokua. “I am only weak. Give me a moment. It is my hand resists, my flesh shrinks back from the accursed thing. One moment only!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 654
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3758
        "line_end": 3760
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-177"
    "translation_ja": "「ためらってなんかいません！」とコクアは叫んだ。「弱いだけです。少し待って。手が言うことをきかない。あの呪われた物を前にして体が引いてしまうんです。ほんの少しだけ！」"
    "translation_status": "reviewed"
  - "id": "bottle-178"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The old man looked upon Kokua kindly. “Poor child!” said he, “you fear; your soul misgives you. Well, let me keep it. I am old, and can never more be happy in this world, and as for the next—”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 655
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3762
        "line_end": 3764
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-178"
    "translation_ja": "老人は優しくコクアを見た。「かわいそうに！　怖いんだね。心がひるむんだね。それならわしが持っていよう。わしは年を取った。この世でもう一度幸せになれるわけじゃなし、あの世のことなら……」"
    "translation_status": "reviewed"
  - "id": "bottle-179"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Give it me!” gasped Kokua. “There is your money. Do you think I am so base as that? Give me the bottle.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 656
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3766
        "line_end": 3767
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-179"
    "translation_ja": "「ください！」とコクアは息も絶え絶えに言った。「お金はここです。私がそんな卑怯な人間だと思うの？　びんをください」"
    "translation_status": "reviewed"
  - "id": "bottle-180"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“God bless you, child,” said the old man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 657
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3769
        "line_end": 3769
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-180"
    "translation_ja": "「神の祝福があんたにあるように」と老人は言った。"
    "translation_status": "reviewed"
  - "id": "bottle-181"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Kokua concealed the bottle under her holoku, said farewell to the old man, and walked off along the avenue, she cared not whither. For all roads were now the same to her, and led equally to hell. Sometimes she walked, and sometimes ran; sometimes she screamed out loud in the night, and sometimes lay by the wayside in the dust and wept. All that she had heard of hell came back to her; she saw the flames blaze, and she smelt the smoke, and her flesh withered on the coals."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 658
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3771
        "line_end": 3777
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-181"
    "translation_ja": "コクアはホロクの下にびんを隠し、老人に別れを告げ、並木道を歩いていった。どこへでもかまわなかった。もうどの道も彼女には同じ、等しく地獄への道だった。あるときは歩き、あるときは駆け、ときには夜に向かって声を限りに叫び、ときには道端の土に身を投げて泣いた。地獄について聞かされてきたことが残らずよみがえった。炎は燃えさかり、煙が鼻をつき、熾火の上で自分の肉が焼けしぼんだ。"
    "translation_status": "reviewed"
  - "id": "bottle-182"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Near day she came to her mind again, and returned to the house. It was even as the old man said—Keawe slumbered like a child. Kokua stood and gazed upon his face."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 659
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3779
        "line_end": 3781
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-182"
    "translation_ja": "夜明け近くになってやっと我に返り、家に帰った。まさに老人の言ったとおり、ケアウェは子供のように眠っていた。コクアは立ってその顔を見つめた。"
    "translation_status": "reviewed"
  - "id": "bottle-183"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Now, my husband,” said she, “it is your turn to sleep. When you wake it will be your turn to sing and laugh. But for poor Kokua, alas! that meant no evil—for poor Kokua no more sleep, no more singing, no more delight, whether in earth or heaven.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 660
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3783
        "line_end": 3786
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-183"
    "translation_ja": "「さあ、あなた」と彼女は言った。「今度はあなたが眠る番よ。目が覚めたら歌って笑うのもあなたの番。でも哀れなコクアには、ああ、何一つ悪いつもりのなかった哀れなコクアには、地上でも天国でも、もう眠りも歌も楽しみもない」"
    "translation_status": "reviewed"
  - "id": "bottle-184"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that she lay down in the bed by his side, and her misery was so extreme that she fell in a deep slumber instantly."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 661
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3788
        "line_end": 3789
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-184"
    "translation_ja": "そう言って夫の隣に横になった。あまりに悲惨な気持ちだったために、かえってたちまち深い眠りに落ちた。"
    "translation_status": "reviewed"
  - "id": "bottle-185"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Late in the morning her husband woke her and gave her the good news. It seemed he was silly with delight, for he paid no heed to her distress, ill though she dissembled it. The words stuck in her mouth, it mattered not; Keawe did the speaking. She ate not a bite, but who was to observe it? for Keawe cleared the dish. Kokua saw and heard him, like some strange thing in a dream; there were times when she forgot or doubted, and put her hands to her brow; to know herself doomed and hear her husband babble, seemed so monstrous."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 662
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3791
        "line_end": 3798
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-185"
    "translation_ja": "朝も遅くなってから、夫が彼女を起こし、嬉しい知らせを告げた。喜びのあまり何もわからなくなったらしく、彼女が苦しみを上手に隠せていないのに、少しも気がつかなかった。彼女は言葉が喉につかえたが、困りはしなかった。ケアウェが一人でしゃべっていた。ひと口も食べなかったが、誰が気づこう。ケアウェが皿をすっかり空にした。コクアは夢に出てくる見知らぬものでも見るように、彼を見、彼の声を聞いた。ときにはわが身のことを忘れ、あるいは疑って額に両手を当てた。自分の破滅を知りながら夫の浮かれたおしゃべりを聞くのは、あまりに途方もないことに思われた。"
    "translation_status": "reviewed"
  - "id": "bottle-186"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All the while Keawe was eating and talking, and planning the time of their return, and thanking her for saving him, and fondling her, and calling her the true helper after all. He laughed at the old man that was fool enough to buy that bottle."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 663
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3800
        "line_end": 3803
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-186"
    "translation_ja": "その間もケアウェは食べてはしゃべり、いつ帰るか相談し、自分を救ってくれた礼を言い、いとおしげに彼女に触れ、やっぱり本当の助け手はおまえだと言っていた。それから彼は、あのびんを買うほどばかだった老人を笑った。"
    "translation_status": "reviewed"
  - "id": "bottle-187"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“A worthy old man he seemed,” Keawe said. “But no one can judge by appearances. For why did the old reprobate require the bottle?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 664
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3805
        "line_end": 3806
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-187"
    "translation_ja": "「人品のよいおじいさんに見えた」とケアウェは言った。「だが人は見かけではわからない。そうだろう、あの罰当たりじじいはいったい、何がしたくてびんを欲しがったんだ？」"
    "translation_status": "reviewed"
  - "id": "bottle-188"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“My husband,” said Kokua, humbly, “his purpose may have been good.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 665
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3808
        "line_end": 3808
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-188"
    "translation_ja": "「あなた」とコクアはへりくだって言った。「よいことをなさるおつもりだったのかもしれないわ」"
    "translation_status": "reviewed"
  - "id": "bottle-189"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Keawe laughed like an angry man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 666
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3810
        "line_end": 3810
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-189"
    "translation_ja": "ケアウェは怒ったような笑い声を立てた。"
    "translation_status": "reviewed"
  - "id": "bottle-190"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Fiddle-de-dee!” cried Keawe. “An old rogue, I tell you; and an old ass to boot. For the bottle was hard enough to sell at four centimes; and at three it will be quite impossible. The margin is not broad enough, the thing begins to smell of scorching—brrr!” said he, and shuddered. “It is true I bought it myself at a cent, when I knew not there were smaller coins. I was a fool for my pains; there will never be found another: and whoever has that bottle now will carry it to the pit.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 667
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3812
        "line_end": 3818
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-190"
    "translation_ja": "「くだらん！」と叫んだ。「ろくでなしのじじいだよ。おまけに大ばかだ。四サンチームでも売るのにあれほど苦労した。三サンチームとなれば、まるきり無理だ。値を下げる余地がなさすぎる。もう焦げ臭いにおいがするぞ、ぶるぶるっ！」そう言って身震いした。「そりゃおれだって、もっと小さい硬貨があるとは知らずに一セントで買った。まったくばかな真似をした。同じばかは二人と見つかるまいよ。たった今あのびんを持っている者が、そいつを抱いて地獄の穴へ落ちるのさ」"
    "translation_status": "reviewed"
  - "id": "bottle-191"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“O my husband!” said Kokua. “Is it not a terrible thing to save oneself by the eternal ruin of another? It seems to me I could not laugh. I would be humbled. I would be filled with melancholy. I would pray for the poor holder.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 668
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3820
        "line_end": 3823
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-191"
    "translation_ja": "「ああ、あなた」とコクアは言った。「ほかの人を永遠に滅ぼして自分が助かるなんて、恐ろしいことじゃない？　私なら笑えそうにないわ。頭を垂れるわ。胸がふさいでしまうわ。今の持ち主がかわいそうで、お祈りせずにはいられないわ」"
    "translation_status": "reviewed"
  - "id": "bottle-192"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Then Keawe, because he felt the truth of what she said, grew the more angry. “Heighty-teighty!” cried he. “You may be filled with melancholy if you please. It is not the mind of a good wife. If you thought at all of me, you would sit shamed.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 669
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3825
        "line_end": 3828
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-192"
    "translation_ja": "ケアウェは妻の言葉がもっともだと感じたので、それだけいっそう腹を立てた。「おやまあ、ご立派なことだ！」と彼は叫んだ。「胸をふさぎたければ勝手にふさぐがいい。よい妻の心がけじゃないぞ。おれのことを少しでも思うなら、恥じ入ってそこに座っているはずだ」"
    "translation_status": "reviewed"
  - "id": "bottle-193"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Thereupon he went out, and Kokua was alone."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 670
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3830
        "line_end": 3830
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-193"
    "translation_ja": "そうして出て行き、コクアは一人残された。"
    "translation_status": "reviewed"
  - "id": "bottle-194"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "What chance had she to sell that bottle at two centimes? None, she perceived. And if she had any, here was her husband hurrying her away to a country where there was nothing lower than a cent. And here—on the morrow of her sacrifice—was her husband leaving her and blaming her."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 671
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3832
        "line_end": 3835
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-194"
    "translation_ja": "あのびんを二サンチームで売れる見込みがどこにあるだろう。ない、と彼女にはわかった。仮にあったとしても、夫は一セントより安い硬貨などない国に彼女をせき立てて連れ帰ろうとしていた。しかも彼女がわが身を犠牲にしたその翌日に、夫は彼女を責め、置き去りにしていったのだ。"
    "translation_status": "reviewed"
  - "id": "bottle-195"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She would not even try to profit by what time she had, but sat in the house, and now had the bottle out and viewed it with unutterable fear, and now, with loathing, hid it out of sight."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 672
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3837
        "line_end": 3839
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-195"
    "translation_ja": "残った時間を生かしてみようとさえしなかった。家に座りきりで、ときにはびんを出して言葉にできない恐れをもって見つめ、ときには嫌悪に駆られて見えないところへ隠した。"
    "translation_status": "reviewed"
  - "id": "bottle-196"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "By-and-by, Keawe came back, and would have her take a drive."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 673
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3841
        "line_end": 3841
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-196"
    "translation_ja": "しばらくしてケアウェは戻ってきて、馬車に乗って出かけようと言った。"
    "translation_status": "reviewed"
  - "id": "bottle-197"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“My husband, I am ill,” she said. “I am out of heart. Excuse me, I can take no pleasure.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 674
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3843
        "line_end": 3844
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-197"
    "translation_ja": "「あなた、私は具合が悪いの」と彼女は言った。「気力が出ないのよ。ごめんなさい。何も楽しめないの」"
    "translation_status": "reviewed"
  - "id": "bottle-198"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Then was Keawe more wroth than ever. With her, because he thought she was brooding over the case of the old man; and with himself, because he thought she was right, and was ashamed to be so happy."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 675
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3846
        "line_end": 3848
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-198"
    "translation_ja": "ケアウェはなおいっそう腹を立てた。老人のことをいつまでもくよくよしているのだと思って妻に腹を立て、妻の方が正しいと思い、自分ばかりこれほど幸せなのを恥じて、自分にも腹を立てた。"
    "translation_status": "reviewed"
  - "id": "bottle-199"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is your truth,” cried he, “and this your affection! Your husband is just saved from eternal ruin, which he encountered for the love of you—and you can take no pleasure! Kokua, you have a disloyal heart.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 676
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3850
        "line_end": 3852
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-199"
    "translation_ja": "「それがおまえの誠実さか」と彼は叫んだ。「それがおまえの愛情というものか！　夫がたった今、永遠の破滅を免れたのだぞ。おまえを愛したために引き受けた破滅をだ。それなのに何も楽しめないと言うのか！　コクア、おまえの心はおれを裏切ってる」"
    "translation_status": "reviewed"
  - "id": "bottle-200"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He went forth again furious, and wandered in the town all day. He met friends, and drank with them; they hired a carriage and drove into the country, and there drank again. All the time Keawe was ill at ease, because he was taking this pastime while his wife was sad, and because he knew in his heart that she was more right than he; and the knowledge made him drink the deeper."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 677
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3854
        "line_end": 3859
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-200"
    "translation_ja": "彼はまたもかんかんになって出て行き、町を一日歩き回った。友達に会って一緒に酒を飲み、馬車を雇って郊外へ乗り出し、そこでまた飲んだ。その間、ケアウェは気がとがめていた。妻が悲しんでいるときに自分は遊び歩いているし、心の底では妻の方が正しいとわかっていたからだ。それがわかっているので、いよいよ深酒をした。"
    "translation_status": "reviewed"
  - "id": "bottle-201"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now there was an old brutal Haole drinking with him, one that had been a boatswain of a whaler, a runaway, a digger in gold mines, a convict in prisons. He had a low mind and a foul mouth; he loved to drink and to see others drunken; and he pressed the glass upon Keawe. Soon there was no more money in the company."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 678
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3861
        "line_end": 3865
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-201"
    "translation_ja": "一緒に飲んでいる中に、年を取った粗暴なハオレが一人いた。捕鯨船の甲板長を務めたことも、船から逃げ出したことも、金鉱で働いたことも、牢獄で服役したこともある男だった。性根が卑しく、口汚く、自分が飲むのも人が酔っぱらうのを見るのも好きで、ケアウェにしきりに杯を勧めた。やがて一同、金が尽きた。"
    "translation_status": "reviewed"
  - "id": "bottle-202"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Here, you!” says the boatswain, “you are rich, you have been always saying. You have a bottle or some foolishness.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 679
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3867
        "line_end": 3868
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-202"
    "translation_ja": "「おい、おまえ」と甲板長は言った。「いつも金持ちだって言ってたじゃねえか。びんだか何だか、ばかみたいなものを持ってるってよ」"
    "translation_status": "reviewed"
  - "id": "bottle-203"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes,” says Keawe, “I am rich; I will go back and get some money from my wife, who keeps it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 680
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3870
        "line_end": 3871
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-203"
    "translation_ja": "「ああ」とケアウェは言った。「おれは金持ちだ。家に帰って女房からもらってこよう。金はあれに預けてあるんだ」"
    "translation_status": "reviewed"
  - "id": "bottle-204"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s a bad idea, mate,” said the boatswain. “Never you trust a petticoat with dollars. They’re all as false as water; you keep an eye on her.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 681
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3873
        "line_end": 3875
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-204"
    "translation_ja": "「そいつはまずいぞ、相棒」と甲板長は言った。「女なんぞに金を預けちゃいけねえ。どいつもこいつも水みたいにつかみどころがない。ようく見張っとけよ」"
    "translation_status": "reviewed"
  - "id": "bottle-205"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now, this word struck in Keawe’s mind; for he was muddled with what he had been drinking."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 682
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3877
        "line_end": 3878
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-205"
    "translation_ja": "飲んだ酒で頭が濁っていたので、この言葉がケアウェの頭にこびりついた。"
    "translation_status": "reviewed"
  - "id": "bottle-206"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I should not wonder but she was false, indeed,” thought he. “Why else should she be so cast down at my release? But I will show her I am not the man to be fooled. I will catch her in the act.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 683
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3880
        "line_end": 3882
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-206"
    "translation_ja": "「ひょっとすると本当にあれはおれを裏切ってるのかもしれない」と思った。「そうでなければ、おれが助かったのに、どうしてあんなに沈んでる？　だが、ばかにできる男じゃないことを見せてやろう。現場を押さえてやる」"
    "translation_status": "reviewed"
  - "id": "bottle-207"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Accordingly, when they were back in town, Keawe bade the boatswain wait for him at the corner, by the old calaboose, and went forward up the avenue alone to the door of his house. The night had come again; there was a light within, but never a sound; and Keawe crept about the corner, opened the back door softly, and looked in."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 684
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3884
        "line_end": 3888
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-207"
    "translation_ja": "そこで町へ戻ると、ケアウェは古い牢屋のそばの角で甲板長を待たせ、自分だけ並木道をわが家の戸口まで上っていった。また夜になっていた。家には明かりがついていたが、物音一つしない。ケアウェは足音を忍ばせて角を回り、そっと裏戸を開けて中をのぞいた。"
    "translation_status": "reviewed"
  - "id": "bottle-208"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was Kokua on the floor, the lamp at her side; before her was a milk-white bottle, with a round belly and a long neck; and as she viewed it, Kokua wrung her hands."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 685
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3890
        "line_end": 3892
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-208"
    "translation_ja": "床にはコクアが座っていた。脇にランプがあり、目の前には腹が丸く、首の長い乳白色のびんがあった。それを見つめて、コクアは両手を握り合わせ、もみしぼっていた。"
    "translation_status": "reviewed"
  - "id": "bottle-209"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A long time Keawe stood and looked in the doorway. At first he was struck stupid; and then fear fell upon him that the bargain had been made amiss, and the bottle had come back to him as it came at San Francisco; and at that his knees were loosened, and the fumes of the wine departed from his head like mists off a river in the morning. And then he had another thought; and it was a strange one, that made his cheeks to burn."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 686
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3894
        "line_end": 3899
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-209"
    "translation_ja": "長いあいだケアウェは戸口に立って見入っていた。初めは呆然とした。それから取引の仕方がまずく、サンフランシスコのときのようにびんが戻ってきたのではないかと恐ろしくなった。そう思うと膝の力が抜け、朝の川霧が晴れるように頭から酒の気が消えた。それからもう一つの考えが浮かんだ。思いも寄らぬ考えで、頬が熱く燃えた。"
    "translation_status": "reviewed"
  - "id": "bottle-210"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I must make sure of this,” thought he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 687
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3901
        "line_end": 3901
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-210"
    "translation_ja": "「どうしても確かめなければ」と彼は思った。"
    "translation_status": "reviewed"
  - "id": "bottle-211"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So he closed the door, and went softly round the corner again, and then came noisily in, as though he were but now returned. And, lo! by the time he opened the front door no bottle was to be seen; and Kokua sat in a chair and started up like one awakened out of sleep."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 688
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3903
        "line_end": 3906
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-211"
    "translation_ja": "そこで戸を閉め、またそっと角を回り、今しがた帰り着いたかのように、わざと足音を立てて入った。するとどうだろう、表戸を開けたときにはびんはどこにも見えず、コクアは椅子に座っていて、眠りをさまされた人のように跳び起きた。"
    "translation_status": "reviewed"
  - "id": "bottle-212"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I have been drinking all day and making merry,” said Keawe. “I have been with good companions, and now I only come back for money, and return to drink and carouse with them again.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 689
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3908
        "line_end": 3910
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-212"
    "translation_ja": "「おれは一日じゅう飲んで楽しく遊んできた」とケアウェは言った。「気のいい連中と一緒だった。今帰ったのは金を取りに来ただけだ。また戻ってあいつらと飲んで騒ぐんだ」"
    "translation_status": "reviewed"
  - "id": "bottle-213"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Both his face and voice were as stern as judgment, but Kokua was too troubled to observe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 690
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3912
        "line_end": 3913
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-213"
    "translation_ja": "顔つきも声も最後の審判のように厳しかった。だがコクアは取り乱していて気づかなかった。"
    "translation_status": "reviewed"
  - "id": "bottle-214"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You do well to use your own, my husband,” said she, and her words trembled."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 691
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3915
        "line_end": 3916
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-214"
    "translation_ja": "「あなたのものをあなたがお使いになるのは当然だわ」と彼女は言った。言葉が震えていた。"
    "translation_status": "reviewed"
  - "id": "bottle-215"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“O, I do well in all things,” said Keawe, and he went straight to the chest and took out money. But he looked besides in the corner where they kept the bottle, and there was no bottle there."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 692
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3918
        "line_end": 3920
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-215"
    "translation_ja": "「ああ、おれのすることは何だって当然だ」とケアウェは言って、船箪笥にまっすぐ進み、金を取り出した。ついでに、いつもびんをしまう隅をのぞいたが、びんはなかった。"
    "translation_status": "reviewed"
  - "id": "bottle-216"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At that the chest heaved upon the floor like a sea-billow, and the house span about him like a wreath of smoke, for he saw he was lost now, and there was no escape. “It is what I feared,” he thought. “It is she who has bought it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 693
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3922
        "line_end": 3925
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-216"
    "translation_ja": "その途端、床の上の箪笥が波のようにうねり、家がひと筋の煙の輪のように彼のまわりで回った。自分はもう助からない、逃げ道はないとわかったのだ。「心配したとおりだ」と彼は思った。「買ったのはあれだったんだ」"
    "translation_status": "reviewed"
  - "id": "bottle-217"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And then he came to himself a little and rose up; but the sweat streamed on his face as thick as the rain and as cold as the well-water."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 694
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3927
        "line_end": 3928
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-217"
    "translation_ja": "それから少し我に返り、立ち上がった。だが顔には雨ほどに激しく、井戸の水ほどに冷たい汗が流れていた。"
    "translation_status": "reviewed"
  - "id": "bottle-218"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Kokua,” said he, “I said to you to-day what ill became me. Now I return to carouse with my jolly companions,” and at that he laughed a little quietly. “I will take more pleasure in the cup if you forgive me.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 695
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3930
        "line_end": 3932
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-218"
    "translation_ja": "「コクア」と彼は言った。「今日は君に、言ってはならないことを言った。これから愉快な仲間と、また騒ぎに行くよ」。そこで少しだけ、低く笑った。「許してくれれば、酒がずっとおいしくなる」"
    "translation_status": "reviewed"
  - "id": "bottle-219"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She clasped his knees in a moment; she kissed his knees with flowing tears."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 696
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3934
        "line_end": 3935
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-219"
    "translation_ja": "妻はたちまち彼の膝を抱きしめ、とめどなく涙を流してその膝に口づけした。"
    "translation_status": "reviewed"
  - "id": "bottle-220"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“O,” she cried, “I asked but a kind word!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 697
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3937
        "line_end": 3937
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-220"
    "translation_ja": "「ああ」と彼女は叫んだ。「優しい言葉をひと言、それしか欲しくなかった！」"
    "translation_status": "reviewed"
  - "id": "bottle-221"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Let us never one think hardly of the other,” said Keawe, and was gone out of the house."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 698
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3939
        "line_end": 3940
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-221"
    "translation_ja": "「お互いにもう決して、相手を悪く思うまい」と言ってケアウェは家を出た。"
    "translation_status": "reviewed"
  - "id": "bottle-222"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now, the money that Keawe had taken was only some of that store of centime pieces they had laid in at their arrival. It was very sure he had no mind to be drinking. His wife had given her soul for him, now he must give his for hers; no other thought was in the world with him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 699
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3942
        "line_end": 3945
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-222"
    "translation_ja": "さて、ケアウェが取り出した金は、島に着いたときに用意しておいた一サンチーム貨のうちのほんの何枚かにすぎなかった。飲もうという気などなかったことは確かだ。妻が自分のために魂を差し出した。今度は自分が妻の魂のためにわが魂を差し出さねばならない。彼にとってこの世にはほかに考えることはなかった。"
    "translation_status": "reviewed"
  - "id": "bottle-223"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At the corner, by the old calaboose, there was the boatswain waiting."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 700
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3947
        "line_end": 3947
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-223"
    "translation_ja": "古牢のそばの角には甲板長が待っていた。"
    "translation_status": "reviewed"
  - "id": "bottle-224"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“My wife has the bottle,” said Keawe, “and, unless you help me to recover it, there can be no more money and no more liquor to-night.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 701
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3949
        "line_end": 3950
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-224"
    "translation_ja": "「びんは女房が持ってる」とケアウェは言った。「あんたが取り返す手伝いをしてくれなきゃ、今夜はもう金も酒もないよ」"
    "translation_status": "reviewed"
  - "id": "bottle-225"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You do not mean to say you are serious about that bottle?” cried the boatswain."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 702
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3952
        "line_end": 3953
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-225"
    "translation_ja": "「おいおい、まさかそのびんの話、本気だってんじゃないだろうな？」と甲板長は叫んだ。"
    "translation_status": "reviewed"
  - "id": "bottle-226"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There is the lamp,” said Keawe. “Do I look as if I was jesting?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 703
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3955
        "line_end": 3955
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-226"
    "translation_ja": "「あそこに街灯がある」とケアウェは言った。「おれが冗談を言ってる顔に見えるかい？」"
    "translation_status": "reviewed"
  - "id": "bottle-227"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That is so,” said the boatswain. “You look as serious as a ghost.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 704
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3957
        "line_end": 3957
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-227"
    "translation_ja": "「なるほど」と甲板長は言った。「幽霊みたいに真剣な顔だ」"
    "translation_status": "reviewed"
  - "id": "bottle-228"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, then,” said Keawe, “here are two centimes; you must go to my wife in the house, and offer her these for the bottle, which (if I am not much mistaken) she will give you instantly. Bring it to me here, and I will buy it back from you for one; for that is the law with this bottle, that it still must be sold for a less sum. But whatever you do, never breathe a word to her that you have come from me.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 705
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3959
        "line_end": 3964
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-228"
    "translation_ja": "「それじゃあ」とケアウェは言った。「ここに二サンチームある。うちの女房のところに行って、これでびんを買おうと言ってくれ。おれの見当がよほど外れていないかぎり、すぐに渡す。そうしたらここへ持ってきてくれ。一サンチームで買い取るよ。必ずひとつ前より安く売らなきゃならない。それがびんの決まりだ。だが何があっても、おれに言われて来たとは、女房にひと言も漏らさないでくれ」"
    "translation_status": "reviewed"
  - "id": "bottle-229"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Mate, I wonder are you making a fool of me?” asked the boatswain."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 706
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3966
        "line_end": 3966
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-229"
    "translation_ja": "「相棒、おれをからかってるんじゃねえだろうな？」と甲板長はたずねた。"
    "translation_status": "reviewed"
  - "id": "bottle-230"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It will do you no harm if I am,” returned Keawe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 707
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3968
        "line_end": 3968
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-230"
    "translation_ja": "「からかってたところで、あんたは何も損しない」とケアウェは答えた。"
    "translation_status": "reviewed"
  - "id": "bottle-231"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That is so, mate,” said the boatswain."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 708
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3970
        "line_end": 3970
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-231"
    "translation_ja": "「そりゃそうだ、相棒」と甲板長は言った。"
    "translation_status": "reviewed"
  - "id": "bottle-232"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And if you doubt me,” added Keawe, “you can try. As soon as you are clear of the house, wish to have your pocket full of money, or a bottle of the best rum, or what you please, and you will see the virtue of the thing.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 709
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3972
        "line_end": 3975
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-232"
    "translation_ja": "「疑うんだったら」とケアウェは言い添えた。「試してみるといい。家から出たらすぐ、ポケットいっぱいの金でも、上等なラム酒をひとびんでも、好きなものを願ってみろ。どんな力があるかわかる」"
    "translation_status": "reviewed"
  - "id": "bottle-233"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Very well, Kanaka,” says the boatswain. “I will try; but if you are having your fun out of me, I will take my fun out of you with a belaying pin.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 710
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3977
        "line_end": 3979
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-233"
    "translation_ja": "「よし、カナカ」と甲板長は言った。「やってみる。けどおれをだしに面白がってるんだったら、こっちも綱止め棒でおまえを殴って楽しませてもらうぜ」"
    "translation_status": "reviewed"
  - "id": "bottle-234"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So the whaler-man went off up the avenue; and Keawe stood and waited. It was near the same spot where Kokua had waited the night before; but Keawe was more resolved, and never faltered in his purpose; only his soul was bitter with despair."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 711
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3981
        "line_end": 3984
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-234"
    "translation_ja": "捕鯨船乗りは並木道を上っていった。ケアウェは立って待った。昨夜コクアが待ったのとほとんど同じ場所だった。だがケアウェの決意はもっと堅く、しようとしていることに少しもためらいはなかった。ただ、心には苦い絶望があった。"
    "translation_status": "reviewed"
  - "id": "bottle-235"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It seemed a long time he had to wait before he heard a voice singing in the darkness of the avenue. He knew the voice to be the boatswain’s; but it was strange how drunken it appeared upon a sudden."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 712
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3986
        "line_end": 3988
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-235"
    "translation_ja": "ずいぶん長く待ったかと思われたころ、暗い並木道で歌う声が聞こえた。甲板長の声だとわかったが、突然ひどく酔った声になっているのが不思議だった。"
    "translation_status": "reviewed"
  - "id": "bottle-236"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Next, the man himself came stumbling into the light of the lamp. He had the devil’s bottle buttoned in his coat; another bottle was in his hand; and even as he came in view he raised it to his mouth and drank."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 713
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3990
        "line_end": 3992
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-236"
    "translation_ja": "やがて男自身がよろめきながら街灯の光の中へ現れた。悪魔のびんは上着のボタンの内側にしまい、手には別のびんを持っていた。姿を現したとたん、そのびんを口に当てて飲んだ。"
    "translation_status": "reviewed"
  - "id": "bottle-237"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You have it,” said Keawe. “I see that.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 714
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3994
        "line_end": 3994
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-237"
    "translation_ja": "「手に入れたね」とケアウェは言った。「見ればわかる」"
    "translation_status": "reviewed"
  - "id": "bottle-238"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Hands off!” cried the boatswain, jumping back. “Take a step near me, and I’ll smash your mouth. You thought you could make a cat’s-paw of me, did you?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 715
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3996
        "line_end": 3998
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-238"
    "translation_ja": "「触るな！」と甲板長は跳びすさって叫んだ。「一歩でも近寄ったら、その口をたたき割るぞ。おれを手先に使えると思ってたんだろう、ええ？」"
    "translation_status": "reviewed"
  - "id": "bottle-239"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What do you mean?” cried Keawe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 716
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4000
        "line_end": 4000
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-239"
    "translation_ja": "「どういう意味だ！」とケアウェは叫んだ。"
    "translation_status": "reviewed"
  - "id": "bottle-240"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Mean?” cried the boatswain. “This is a pretty good bottle, this is; that’s what I mean. How I got it for two centimes I can’t make out; but I’m sure you shan’t have it for one.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 717
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4002
        "line_end": 4004
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-240"
    "translation_ja": "「どういう意味かって？」と甲板長は叫んだ。「こいつはなかなか結構なびんだって意味よ。どうして二サンチームぽっちで手に入ったか見当もつかねえが、おまえには一サンチームで渡しゃしねえ。それだけは確かだ」"
    "translation_status": "reviewed"
  - "id": "bottle-241"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You mean you won’t sell?” gasped Keawe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 718
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4006
        "line_end": 4006
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-241"
    "translation_ja": "「売らないっていうのか」とケアウェは息をのんだ。"
    "translation_status": "reviewed"
  - "id": "bottle-242"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No, sir!” cried the boatswain. “But I’ll give you a drink of the rum, if you like.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 719
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4008
        "line_end": 4009
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-242"
    "translation_ja": "「売りませんね、旦那！」と甲板長は叫んだ。「まあ、よければラム酒ならひと口おごるぜ」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 5
          "end": 8
          "exact": "sir"
  - "id": "bottle-243"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I tell you,” said Keawe, “the man who has that bottle goes to hell.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 720
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4011
        "line_end": 4011
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-243"
    "translation_ja": "「言っておくが」とケアウェは言った。「そのびんを持っている男は地獄に行くんだぞ」"
    "translation_status": "reviewed"
  - "id": "bottle-244"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I reckon I’m going anyway,” returned the sailor; “and this bottle’s the best thing to go with I’ve struck yet. No, sir!” he cried again, “this is my bottle now, and you can go and fish for another.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 721
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4013
        "line_end": 4015
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-244"
    "translation_ja": "「どうせおれは地獄行きだろうよ」と船乗りは答えた。「その道連れなら、今まで出くわしたもののうち、このびんがいちばんさ。お断りだ、旦那！」と彼はまた叫んだ。「こいつは今やおれのびんだ。別のを釣りにでも行くんだな」"
    "translation_status": "reviewed"
  - "id": "bottle-245"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Can this be true?” Keawe cried. “For your own sake, I beseech you, sell it me!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 722
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4017
        "line_end": 4018
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-245"
    "translation_ja": "「本気なのか」とケアウェは叫んだ。「あんた自身のためだ。頼むからおれに売ってくれ！」"
    "translation_status": "reviewed"
  - "id": "bottle-246"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I don’t value any of your talk,” replied the boatswain. “You thought I was a flat; now you see I’m not; and there’s an end. If you won’t have a swallow of the rum, I’ll have one myself. Here’s your health, and good-night to you!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 723
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4020
        "line_end": 4023
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-246"
    "translation_ja": "「何を言われても痛くもかゆくもねえよ」と甲板長は答えた。「おれをいいカモだと思ったんだろう。そうじゃねえとわかったろ。話はおしまいだ。ラムをひと口やる気がないなら、おれが飲む。ご健康を、そしておやすみ！」"
    "translation_status": "reviewed"
  - "id": "bottle-247"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So off he went down the avenue towards town, and there goes the bottle out of the story."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 724
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4025
        "line_end": 4026
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-247"
    "translation_ja": "そう言って男は町の方へ並木道を下っていった。びんもこれを限りに、この話から消えた。"
    "translation_status": "reviewed"
  - "id": "bottle-248"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But Keawe ran to Kokua light as the wind; and great was their joy that night; and great, since then, has been the peace of all their days in the Bright House."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 725
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4028
        "line_end": 4030
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-248"
    "translation_ja": "だがケアウェは風のように軽やかにコクアのもとへ駆けた。その夜、ふたりはどんなに喜んだことだろう。それ以来、「輝く家」でのふたりの明け暮れは、深い安らぎに満ちた。"
    "translation_status": "reviewed"
  - "id": "isle-001"
    "section_id": "isle"
    "kind": "heading"
    "origin": "source"
    "source_text": "THE ISLE OF VOICES."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 726
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4034
        "line_end": 4034
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-001"
    "translation_ja": "声の島"
    "translation_status": "reviewed"
  - "id": "isle-002"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Keola was married with Lehua, daughter of Kalamake, the wise man of Molokai, and he kept his dwelling with the father of his wife. There was no man more cunning than that prophet; he read the stars, he could divine by the bodies of the dead, and by the means of evil creatures: he could go alone into the highest parts of the mountain, into the region of the hobgoblins, and there he would lay snares to entrap the spirits of the ancient."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 727
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4037
        "line_end": 4043
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-002"
    "translation_ja": "ケオラはモロカイの賢者カラマケの娘レフアと結婚し、妻の父の家に住んでいた。この預言者より術にたけた者はいなかった。星を読み、死骸によっても魔物の助けによっても占いができた。山の頂に近い化け物たちの領分へ一人で出かけ、そこで遠い昔の人々の霊を捕らえる罠を仕掛けることさえできた。"
    "translation_status": "reviewed"
  - "id": "isle-003"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For this reason no man was more consulted in all the Kingdom of Hawaii. Prudent people bought, and sold, and married, and laid out their lives by his counsels; and the King had him twice to Kona to seek the treasures of Kamehameha. Neither was any man more feared: of his enemies, some had dwindled in sickness by the virtue of his incantations, and some had been spirited away, the life and the clay both, so that folk looked in vain for so much as a bone of their bodies. It was rumoured that he had the art or the gift of the old heroes. Men had seen him at night upon the mountains, stepping from one cliff to the next; they had seen him walking in the high forest, and his head and shoulders were above the trees."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 728
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4045
        "line_end": 4054
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-003"
    "translation_ja": "それゆえハワイ王国じゅうで、彼ほど相談を持ちかけられる人間はいなかった。分別ある人々は、物を買うにも売るにも、結婚するにも、一生をどう送るか決めるにも、彼の助言に従った。王はカメハメハの財宝を探させるために二度も彼をコナへ呼んだ。彼ほど恐れられる人間もまたいなかった。敵に回った者のうち、ある者はその呪文の力で病んでやせ細り、ある者は命も肉体もろとも神隠しに遭い、人がいくら捜しても骨のかけら一つ見つからなかった。昔の英雄たちの術か天賦の力を持つと噂された。夜の山で、崖から次の崖へ一またぎに歩く姿を見た者がいた。背の高い森を歩いていると、その頭と肩が梢を抜いていたのを見た者もいた。"
    "translation_status": "reviewed"
  - "id": "isle-004"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This Kalamake was a strange man to see. He was come of the best blood in Molokai and Maui, of a pure descent; and yet he was more white to look upon than any foreigner: his hair the colour of dry grass, and his eyes red and very blind, so that “Blind as Kalamake, that can see across to-morrow,” was a byword in the islands."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 729
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4056
        "line_end": 4060
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-004"
    "translation_ja": "このカラマケというのは見たところも不思議な男だった。モロカイとマウイの最も高貴な、混じりけのない血筋の出でありながら、肌はどの異国人よりも白かった。髪は枯草の色、目は赤く、ほとんど見えなかった。それで島々では「明日の向こうまで見えるカラマケほど目が見えぬ」という言い回しができていた。"
    "translation_status": "reviewed"
  - "id": "isle-005"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Of all these doings of his father-in-law, Keola knew a little by the common repute, a little more he suspected, and the rest he ignored. But there was one thing troubled him. Kalamake was a man that spared for nothing, whether to eat or to drink, or to wear; and for all he paid in bright new dollars. “Bright as Kalamake’s dollars,” was another saying in the Eight Isles. Yet he neither sold, nor planted, nor took hire—only now and then from his sorceries—and there was no source conceivable for so much silver coin."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 730
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4062
        "line_end": 4069
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-005"
    "translation_ja": "こうした義父の所業について、ケオラは少しは世間の評判で知っていたし、もう少しは察してもいたが、残りは何も知らなかった。ただ一つ、どうにも気になることがあった。カラマケは食べるもの、飲むもの、着るもの、何一つ金を惜しまない男で、そのすべてをぴかぴかの新しい一ドル銀貨で払った。「カラマケの銀貨のようにぴかぴか」というのも八つの島の言い回しだった。ところが物を売りもせず、作物を植えるでもなく、たまに魔術で稼ぐ以外、賃金を取るわけでもない。あれだけの銀貨がどこから来るのか、皆目見当がつかなかった。"
    "translation_status": "reviewed"
  - "id": "isle-006"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It chanced one day Keola’s wife was gone upon a visit to Kaunakakai, on the lee side of the island, and the men were forth at the sea-fishing. But Keola was an idle dog, and he lay in the verandah and watched the surf beat on the shore and the birds fly about the cliff. It was a chief thought with him always—the thought of the bright dollars. When he lay down to bed he would be wondering why they were so many, and when he woke at morn he would be wondering why they were all new; and the thing was never absent from his mind. But this day of all days he made sure in his heart of some discovery. For it seems he had observed the place where Kalamake kept his treasure, which was a lock-fast desk against the parlour wall, under the print of Kamehameha the Fifth, and a photograph of Queen Victoria with her crown; and it seems again that, no later than the night before, he found occasion to look in, and behold! the bag lay there empty. And this was the day of the steamer; he could see her smoke off Kalaupapa; and she must soon arrive with a month’s goods, tinned salmon and gin, and all manner of rare luxuries for Kalamake."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 731
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4071
        "line_end": 4086
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-006"
    "translation_ja": "たまたまある日、ケオラの妻は島の風下のカウナカカイへ人を訪ねに行き、男たちは海へ漁に出ていた。だがケオラは怠け者で、ベランダに寝そべり、波が岸に打ちつけるのや鳥が崖のまわりを飛ぶのを眺めていた。いつも彼の頭の大半を占めていたのは、あの輝く銀貨のことだった。夜、床につくとどうしてあんなにたくさんあるのかと思いつづけ、朝起きるとどうしてみんな新品なのかと思った。そのことが頭を離れるひまはなかった。だがとりわけこの日こそ、きっと何かを突き止めるぞと思っていた。というのも彼は、カラマケが宝をしまう場所を見定めておいたらしい。それは居間の壁ぎわ、カメハメハ五世の版画と、王冠をかぶったヴィクトリア女王の写真の下にある、鍵のかかる書き物机だった。そのうえほかならぬ前の晩、中をのぞく機会を得たところ、なんと袋は空っぽだったらしい。しかも今日は汽船が来る日だ。カラウパパ沖に煙が見えていた。もうじき一月ぶんの品々を積んでやって来る。サケの缶詰にジン、それにカラマケのための珍しい贅沢品があれこれと。"
    "translation_status": "reviewed"
  - "id": "isle-007"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Now if he can pay for his goods to-day,” Keola thought, “I shall know for certain that the man is a warlock, and the dollars come out of the Devil’s pocket.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 732
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4088
        "line_end": 4090
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-007"
    "translation_ja": "「これで今日、品物の代金が払えたら」とケオラは思った。「あの人が魔法使いで、銀貨は悪魔の懐から出るってことが、はっきりわかる」"
    "translation_status": "reviewed"
  - "id": "isle-008"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "While he was so thinking, there was his father-in-law behind him, looking vexed."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 733
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4092
        "line_end": 4093
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-008"
    "translation_ja": "そう考えているところへ、当の義父が浮かぬ顔でうしろにやって来た。"
    "translation_status": "reviewed"
  - "id": "isle-009"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Is that the steamer?” he asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 734
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4095
        "line_end": 4095
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-009"
    "translation_ja": "「あれは汽船か」と彼はたずねた。"
    "translation_status": "reviewed"
  - "id": "isle-010"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes,” said Keola. “She has but to call at Pelekunu, and then she will be here.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 735
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4097
        "line_end": 4098
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-010"
    "translation_ja": "「ええ」とケオラは言った。「あとはペレクヌに寄るだけで、ここへ来ます」"
    "translation_status": "reviewed"
  - "id": "isle-011"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There is no help for it then,” returned Kalamake, “and I must take you in my confidence, Keola, for the lack of anyone better. Come here within the house.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 736
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4100
        "line_end": 4102
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-011"
    "translation_ja": "「それなら致し方がない」とカラマケは答えた。「ケオラ、もう少しましな人間もいないことだし、おまえに秘密を打ち明けるとしよう。さあ家の中へ来い」"
    "translation_status": "reviewed"
  - "id": "isle-012"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So they stepped together into the parlour, which was a very fine room, papered and hung with prints, and furnished with a rocking-chair, and a table and a sofa in the European style. There was a shelf of books besides, and a family Bible in the midst of the table, and the lock-fast writing desk against the wall; so that anyone could see it was the house of a man of substance."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 737
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4104
        "line_end": 4109
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-012"
    "translation_ja": "二人して居間に入った。たいそう立派な部屋で、壁紙を張り、版画を掛け、揺り椅子に西洋式のテーブルと長椅子が置いてあった。そのうえ本を並べた棚もあり、テーブルの真ん中には家族用の聖書が、壁ぎわにはあの鍵のかかる書き物机があった。誰が見ても、財産のある人の家だと分かっただろう。"
    "translation_status": "reviewed"
  - "id": "isle-013"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Kalamake made Keola close the shutters of the windows, while he himself locked all the doors and set open the lid of the desk. From this he brought forth a pair of necklaces hung with charms and shells, a bundle of dried herbs, and the dried leaves of trees, and a green branch of palm."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 738
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4111
        "line_end": 4115
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-013"
    "translation_ja": "カラマケはケオラに窓の鎧戸を閉めさせ、自分ではドアを全部施錠し、机の蓋を開け放った。そこから、護符や貝を吊り下げた首飾りを二本、乾した薬草の束、乾した木の葉、それから青いヤシの枝を一本取り出した。"
    "translation_status": "reviewed"
  - "id": "isle-014"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What I am about,” said he, “is a thing beyond wonder. The men of old were wise; they wrought marvels, and this among the rest; but that was at night, in the dark, under the fit stars and in the desert. The same will I do here in my own house and under the plain eye of day.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 739
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4117
        "line_end": 4120
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-014"
    "translation_ja": "「これからするのは」と彼は言った。「不思議という言葉さえ及ばぬことだ。昔の人々は賢く、さまざまな奇跡をなし遂げた。その一つがこれだ。ただしあの人々がしたのは夜の暗がり、しかるべき星の下の、人もない荒野でのことだ。わしは同じことを、ここ、自分の家にいて、お天道さまがまっすぐ見ている昼間にやってのける」"
    "translation_status": "reviewed"
  - "id": "isle-015"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So saying, he put the bible under the cushion of the sofa so that it was all covered, brought out from the same place a mat of a wonderfully fine texture, and heaped the herbs and leaves on sand in a tin pan. And then he and Keola put on the necklaces and took their stand upon the opposite corners of the mat."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 740
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4122
        "line_end": 4126
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-015"
    "translation_ja": "そう言って聖書を長椅子のクッションの下にすっかり隠し、同じところから驚くほどきめ細かな織りの敷物を取り出し、ブリキ皿の砂の上に薬草と木の葉を積んだ。それから二人は首飾りを掛け、敷物の斜め向かいの角に一人ずつ立った。"
    "translation_status": "reviewed"
  - "id": "isle-016"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“The time comes,” said the warlock; “be not afraid.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 741
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4128
        "line_end": 4128
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-016"
    "translation_ja": "「時が来る。恐れるな」と魔法使いは言った。"
    "translation_status": "reviewed"
  - "id": "isle-017"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that he set flame to the herbs, and began to mutter and wave the branch of palm. At first the light was dim because of the closed shutters; but the herbs caught strongly afire, and the flames beat upon Keola, and the room glowed with the burning; and next the smoke rose and made his head swim and his eyes darken, and the sound of Kalamake muttering ran in his ears. And suddenly, to the mat on which they were standing came a snatch or twitch, that seemed to be more swift than lightning. In the same wink the room was gone and the house, the breath all beaten from Keola’s body. Volumes of light rolled upon his eyes and head, and he found himself transported to a beach of the sea under a strong sun, with a great surf roaring: he and the warlock standing there on the same mat, speechless, gasping and grasping at one another, and passing their hands before their eyes."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 742
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4130
        "line_end": 4142
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-017"
    "translation_ja": "そう言って草に火をつけ、ぶつぶつ呪文を唱えながらヤシの枝を振り始めた。初めは鎧戸を閉めたため薄暗かったが、草が勢いよく燃え上がり、炎がケオラに押し寄せ、火で部屋じゅうが赤く映えた。次に煙が上って頭はくらくらし、目の前が暗くなった。耳にはカラマケの唱える声が鳴っていた。突然、二人の立つ敷物がぐいとしゃくられ、ぴくりとはねた。稲妻よりも速いようだった。その一瞬で部屋も家も消え、ケオラは息を根こそぎ奪われた。どっと押しよせる光が頭も目ものみ込んだかと思うと、強い日ざしの降りそそぐ海辺に運ばれ、大波が轟いていた。ケオラと魔法使いは二人して同じ敷物の上に立っていた。声も出ず、あえいで互いに取りすがり、目の前で手を振っていた。"
    "translation_status": "reviewed"
  - "id": "isle-018"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What was this?” cried Keola, who came to himself the first, because he was the younger. “The pang of it was like death.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 743
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4144
        "line_end": 4145
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-018"
    "translation_ja": "「今のは何です？」と、若いぶん先に我に返ったケオラは叫んだ。「まるで死ぬような苦しさだった」"
    "translation_status": "reviewed"
  - "id": "isle-019"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It matters not,” panted Kalamake. “It is now done.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 744
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4147
        "line_end": 4147
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-019"
    "translation_ja": "「どうでもいい」とカラマケはあえぎながら言った。「もう済んだ」"
    "translation_status": "reviewed"
  - "id": "isle-020"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And, in the name of God, where are we?” cried Keola."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 745
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4149
        "line_end": 4149
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-020"
    "translation_ja": "「じゃあ、いったい全体、ここはどこです？」とケオラは叫んだ。"
    "translation_status": "reviewed"
  - "id": "isle-021"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That is not the question,” replied the sorcerer. “Being here, we have matter in our hands, and that we must attend to. Go, while I recover my breath, into the borders of the wood, and bring me the leaves of such and such a herb, and such and such a tree, which you will find to grow there plentifully—three handfuls of each. And be speedy. We must be home again before the steamer comes; it would seem strange if we had disappeared.” And he sat on the sand and panted."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 746
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4151
        "line_end": 4157
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-021"
    "translation_ja": "「それは問題ではない」と術者は答えた。「来た以上、する用がある。それをせんとな。わしが息を整えているあいだに森の際まで行き、これこれの草と、これこれの木の葉を持って来い。そこにいくらでも生えておる。両方とも三つかみずつだ。急げよ。汽船が来るまでに帰らなくてはならん。わしたちが姿を消していたら怪しまれる」。そう言うと砂に座り、息をはずませた。"
    "translation_status": "reviewed"
  - "id": "isle-022"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Keola went up the beach, which was of shining sand and coral, strewn with singular shells; and he thought in his heart—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 747
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4159
        "line_end": 4160
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-022"
    "translation_ja": "ケオラは浜を上っていった。きらめく砂と珊瑚の浜に、変わった貝が散らばっていた。彼は胸の中で思った。"
    "translation_status": "reviewed"
  - "id": "isle-023"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“How do I not know this beach? I will come here again and gather shells.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 748
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4162
        "line_end": 4163
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-023"
    "translation_ja": "「どうしてこんな浜を知らなかったんだろう。また貝を拾いに来よう」"
    "translation_status": "reviewed"
  - "id": "isle-024"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In front of him was a line of palms against the sky; not like the palms of the Eight Islands, but tall and fresh and beautiful, and hanging out withered fans like gold among the green, and he thought in his heart—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 749
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4165
        "line_end": 4167
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-024"
    "translation_ja": "行く手にはヤシ並木が空を背景に立っていた。八つの島のヤシとは違い、高くみずみずしく美しく、緑の中に金色の扇のような枯れ葉を垂らしていた。彼は胸の中で思った。"
    "translation_status": "reviewed"
  - "id": "isle-025"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It is strange I should not have found this grove. I will come here again, when it is warm, to sleep.” And he thought, “How warm it has grown suddenly!” For it was winter in Hawaii, and the day had been chill. And he thought also, “Where are the grey mountains? And where is the high cliff with the hanging forest and the wheeling birds?” And the more he considered, the less he might conceive in what quarter of the islands he was fallen."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 750
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4169
        "line_end": 4175
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-025"
    "translation_ja": "「こんな林を見つけずにいたなんておかしい。暖かいとき、またここへ昼寝に来よう」。それから「なんだって急にこんなに暖かくなったんだ」と思った。ハワイは冬で、その日は肌寒かったのだ。さらに「灰色の山はどこだ？　森が垂れ下がり、鳥が輪を描いて飛んでいる高い崖はどこだ？」とも思った。考えれば考えるほど、島々のどのあたりに降り立ったのか、想像もつかなくなった。"
    "translation_status": "reviewed"
  - "id": "isle-026"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In the border of the grove, where it met the beach, the herb was growing, but the tree further back. Now, as Keola went toward the tree, he was aware of a young woman who had nothing on her body but a belt of leaves."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 751
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4177
        "line_end": 4179
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-026"
    "translation_ja": "林が浜に接する縁には草が生えており、木はもっと奥にあった。ケオラがそちらへ歩いていくと、葉を帯のように巻いた以外は何も身につけていない若い女に気づいた。"
    "translation_status": "reviewed"
  - "id": "isle-027"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well!” thought Keola, “they are not very particular about their dress in this part of the country.” And he paused, supposing she would observe him and escape; and seeing that she still looked before her, stood and hummed aloud. Up she leaped at the sound. Her face was ashen; she looked this way and that, and her mouth gaped with the terror of her soul. But it was a strange thing that her eyes did not rest upon Keola."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 752
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4181
        "line_end": 4186
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-027"
    "translation_ja": "「おやまあ」とケオラは思った。「このあたりじゃ身なりにかまわんらしいな」。相手が自分に気づいて逃げるだろうと思って立ち止まった。まだ前を向いているので、その場で大きな声で鼻歌を歌った。音を聞いて彼女は飛び上がった。顔は灰色に青ざめ、あちらこちらを見回し、心底おびえて口をぽかんと開けていた。ところが不思議なことに、その視線はケオラを素通りした。"
    "translation_status": "reviewed"
  - "id": "isle-028"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Good day,” said he. “You need not be so frightened; I will not eat you.” And he had scarce opened his mouth before the young woman fled into the bush."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 753
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4188
        "line_end": 4190
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-028"
    "translation_ja": "「こんにちは」と彼は言った。「そんなに怖がることはない。取って食いやしないよ」。彼が口を開くか開かぬかに、若い女は藪の中へ逃げ込んだ。"
    "translation_status": "reviewed"
  - "id": "isle-029"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“These are strange manners,” thought Keola. And, not thinking what he did, ran after her."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 754
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4192
        "line_end": 4193
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-029"
    "translation_ja": "「ここは妙な作法の土地だ」とケオラは思った。そして自分が何をしているかも考えず、彼女を追いかけた。"
    "translation_status": "reviewed"
  - "id": "isle-030"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As she ran, the girl kept crying in some speech that was not practised in Hawaii, yet some of the words were the same, and he knew she kept calling and warning others. And presently he saw more people running—men, women and children, one with another, all running and crying like people at a fire. And with that he began to grow afraid himself, and returned to Kalamake bringing the leaves. Him he told what he had seen."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 755
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4195
        "line_end": 4200
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-030"
    "translation_ja": "娘は走りながら、ハワイでは使わない言葉でしきりに叫んだ。それでもいくつかは同じ言葉なので、ほかの者に呼びかけ、警告しているのはわかった。まもなくもっと大勢が駆けていくのが見えた。男も女も子供も入り交じり、火事のときのようにわめいて駆けていた。そのうちケオラ自身も怖くなって、葉を抱えてカラマケのもとへ戻り、見たことを話した。"
    "translation_status": "reviewed"
  - "id": "isle-031"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You must pay no heed,” said Kalamake. “All this is like a dream and shadows. All will disappear and be forgotten.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 756
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4202
        "line_end": 4203
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-031"
    "translation_ja": "「気にするな」とカラマケは言った。「そんなものはみんな夢や影のようなもの。消えて、忘れられてしまう」"
    "translation_status": "reviewed"
  - "id": "isle-032"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It seemed none saw me,” said Keola."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 757
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4205
        "line_end": 4205
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-032"
    "translation_ja": "「誰にも私が見えていないようでした」とケオラは言った。"
    "translation_status": "reviewed"
  - "id": "isle-033"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And none did,” replied the sorcerer. “We walk here in the broad sun invisible by reason of these charms. Yet they hear us; and therefore it is well to speak softly, as I do.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 758
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4207
        "line_end": 4209
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-033"
    "translation_ja": "「事実、誰にも見えん」と術者は答えた。「この護符のおかげで、こんな真昼の日を浴びて歩いてもわしらの姿は見えない。ただ声は聞こえる。だからわしのように小声で話すのがよい」"
    "translation_status": "reviewed"
  - "id": "isle-034"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that he made a circle round the mat with stones, and in the midst he set the leaves."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 759
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4211
        "line_end": 4212
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-034"
    "translation_ja": "そう言って石で敷物のまわりを円く囲み、その真ん中に葉を置いた。"
    "translation_status": "reviewed"
  - "id": "isle-035"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It will be your part,” said he, “to keep the leaves alight, and feed the fire slowly. While they blaze (which is but for a little moment) I must do my errand; and before the ashes blacken, the same power that brought us carries us away. Be ready now with the match; and do you call me in good time lest the flames burn out and I be left.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 760
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4214
        "line_end": 4218
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-035"
    "translation_ja": "「葉の火を絶やさず、少しずつ足していくのがおまえの役目だ」と彼は言った。「燃えているあいだに、それはほんのわずかだが、わしは用をすまさねばならん。灰が黒くなる前に、ここへ運んできたのと同じ力がわしらを連れ去る。さあマッチを構えろ。火が消えてわしだけ取り残されないように、間に合ううちに呼ぶんだぞ」"
    "translation_status": "reviewed"
  - "id": "isle-036"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As soon as the leaves caught, the sorcerer leaped like a deer out of the circle, and began to race along the beach like a hound that has been bathing. As he ran, he kept stooping to snatch shells; and it seemed to Keola that they glittered as he took them. The leaves blazed with a clear flame that consumed them swiftly; and presently Keola had but a handful left, and the sorcerer was far off, running and stopping."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 761
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4220
        "line_end": 4225
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-036"
    "translation_ja": "葉に火が移るやいなや、術者は鹿のように円の外へ飛び出し、水浴びをしたあとの猟犬のように浜を駆け出した。走りざまに何度も屈み、貝をひったくるように拾った。術者が拾うたび、貝はきらっと光るようにケオラには見えた。葉は澄んだ炎を立て、見る間に燃え尽きていく。間もなく手元にはひとつかみしか残っていないのに、術者ははるか向こうで走ったり止まったりしていた。"
    "translation_status": "reviewed"
  - "id": "isle-037"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Back!” cried Keola. “Back! The leaves are near done.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 762
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4227
        "line_end": 4227
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-037"
    "translation_ja": "「戻って！」とケオラは叫んだ。「戻って！　もう葉がありません！」"
    "translation_status": "reviewed"
  - "id": "isle-038"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At that Kalamake turned, and if he had run before, now he flew. But fast as he ran, the leaves burned faster. The flame was ready to expire when, with a great leap, he bounded on the mat. The wind of his leaping blew it out; and with that the beach was gone, and the sun and the sea, and they stood once more in the dimness of the shuttered parlour, and were once more shaken and blinded; and on the mat betwixt them lay a pile of shining dollars. Keola ran to the shutters; and there was the steamer tossing in the swell close in."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 763
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4229
        "line_end": 4236
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-038"
    "translation_ja": "そこでカラマケは向きを変えた。それまでが走る速さなら今度は飛ぶ速さだった。だが葉の燃えるのはそれより速かった。今にも炎が消えようとしたとき、彼はひと跳びで敷物に飛び乗った。飛び込んだ勢いで火が消え、それとともに浜も太陽も海も消えた。二人はまた鎧戸を閉めた居間の薄闇の中に立ち、またも揺さぶられて目がくらんでいた。そして敷物の上、二人の間には銀貨が山と輝いていた。ケオラが鎧戸へ駆け寄ると、すぐ沖で汽船がうねりに揺られていた。"
    "translation_status": "reviewed"
  - "id": "isle-039"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The same night Kalamake took his son-in-law apart, and gave him five dollars in his hand."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 764
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4238
        "line_end": 4239
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-039"
    "translation_ja": "その晩カラマケは婿を人目のないところへ呼び、五ドルを手に握らせた。"
    "translation_status": "reviewed"
  - "id": "isle-040"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Keola,” said he, “if you are a wise man (which I am doubtful of) you will think you slept this afternoon on the verandah, and dreamed as you were sleeping. I am a man of few words, and I have for my helpers people of short memories.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 765
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4241
        "line_end": 4244
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-040"
    "translation_ja": "「ケオラ」と彼は言った。「もしおまえが賢い男なら、まあそうかどうか疑わしいが、今日の午後はベランダで眠り、眠っているあいだに夢を見たのだと思うことだ。わしは口数の少ない男だ。助け手には物忘れの早い人間を使う」"
    "translation_status": "reviewed"
  - "id": "isle-041"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Never a word more said Kalamake, nor referred again to that affair. But it ran all the while in Keola’s head—if he were lazy before, he would now do nothing."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 766
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4246
        "line_end": 4248
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-041"
    "translation_ja": "カラマケはそれきり何も言わず、二度とあの一件には触れなかった。だがケオラの頭の中ではそれが絶えず駆け巡っていた。前から怠け者だった彼が、今ではまるで何もしなくなった。"
    "translation_status": "reviewed"
  - "id": "isle-042"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Why should I work,” thought he, “when I have a father-in-law who makes dollars of sea-shells?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 767
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4250
        "line_end": 4251
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-042"
    "translation_ja": "「浜辺の貝を銀貨にする義父を持っていながら」と彼は思った。「なんでおれが働かなくちゃならないんだ？」"
    "translation_status": "reviewed"
  - "id": "isle-043"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Presently his share was spent. He spent it all upon fine clothes. And then he was sorry:"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 768
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4253
        "line_end": 4254
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-043"
    "translation_ja": "ほどなく自分の取り分は使い果たした。全部そっくり晴れ着につぎ込んだのだ。そして悔やんだ。"
    "translation_status": "reviewed"
  - "id": "isle-044"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“For,” thought he, “I had done better to have bought a concertina, with which I might have entertained myself all day long.” And then he began to grow vexed with Kalamake."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 769
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4256
        "line_end": 4258
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-044"
    "translation_ja": "「だって」と彼は思った。「あの金でコンセルティーナを一つ買った方がよかった。あれなら一日じゅう弾いて遊べたのに」。そしてカラマケに腹を立てるようになった。"
    "translation_status": "reviewed"
  - "id": "isle-045"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This man has the soul of a dog,” thought he. “He can gather dollars when he pleases on the beach, and he leaves me to pine for a concertina! Let him beware: I am no child, I am as cunning as he, and hold his secret.” With that he spoke to his wife Lehua, and complained of her father’s manners."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 770
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4260
        "line_end": 4264
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-045"
    "translation_ja": "「あの男は犬みたいな了見だ」と彼は思った。「好きなときに浜で銀貨をかき集められるくせに、おれにはコンセルティーナに恋い焦がれていろというのか！　今に見ていろ。おれは子供じゃない。おれだってあいつと同じくらい抜け目がないし、秘密はこっちが握ってるんだ」。そう思うと妻のレフアに、父親のやりようへの不満をぶちまけた。"
    "translation_status": "reviewed"
  - "id": "isle-046"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I would let my father be,” said Lehua. “He is a dangerous man to cross.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 771
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4266
        "line_end": 4267
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-046"
    "translation_ja": "「私なら父のことはそっとしておくわ」とレフアは言った。「逆らうと危ない人よ」"
    "translation_status": "reviewed"
  - "id": "isle-047"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I care that for him!” cried Keola; and snapped his fingers. “I have him by the nose. I can make him do what I please.” And he told Lehua the story."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 772
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4269
        "line_end": 4271
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-047"
    "translation_ja": "「おれにとっちゃこれっぽっちのものだ！」とケオラは叫んで指を鳴らした。「こっちがあいつの鼻面を引き回すんだ。おれの言うなりにさせてやれる」。そしてレフアにあの話を聞かせた。"
    "translation_status": "reviewed"
  - "id": "isle-048"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But she shook her head."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 773
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4273
        "line_end": 4273
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-048"
    "translation_ja": "だが彼女は首を振った。"
    "translation_status": "reviewed"
  - "id": "isle-049"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You may do what you like,” said she; “but as sure as you thwart my father, you will be no more heard of. Think of this person, and that person; think of Hua, who was a noble of the House of Representatives, and went to Honolulu every year; and not a bone or a hair of him was found. Remember Kamau, and how he wasted to a thread, so that his wife lifted him with one hand. Keola, you are a baby in my father’s hands; he will take you with his thumb and finger and eat you like a shrimp.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 774
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4275
        "line_end": 4281
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-049"
    "translation_ja": "「したいようにすればいいわ」と彼女は言った。「けれど父に逆らえば、絶対、あなたの消息はそれきりとなるわ。あの人、この人のことを思いなさい。議会の貴族議員で毎年ホノルルへ行ったフアのことを。あの人の骨一本、髪一筋だって見つかった？　カマウを思い出して。糸のように痩せてしまって、おかみさんが片手で持ち上げたじゃないの。ケオラ、父の手にかかったらあなたは赤ん坊よ。人差し指と親指でつまんで、小エビみたいに食べてしまうわ」"
    "translation_status": "reviewed"
  - "id": "isle-050"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now Keola was truly afraid of Kalamake, but he was vain too; and these words of his wife’s incensed him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 775
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4283
        "line_end": 4284
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-050"
    "translation_ja": "じつを言えばケオラはカラマケを恐れていた。だが同時にうぬぼれの強い男でもあり、妻の言葉にかっとなった。"
    "translation_status": "reviewed"
  - "id": "isle-051"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Very well,” said he, “if that is what you think of me, I will show how much you are deceived.” And he went straight to where his father-in-law was sitting in the parlour."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 776
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4286
        "line_end": 4288
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-051"
    "translation_ja": "「結構」と彼は言った。「おれをそういう男だと思ってるなら、どれだけ見当違いか見せてやる」。そしてまっすぐ、義父の座っている居間へ入っていった。"
    "translation_status": "reviewed"
  - "id": "isle-052"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Kalamake,” said he, “I want a concertina.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 777
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4290
        "line_end": 4290
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-052"
    "translation_ja": "「カラマケさん。おれはコンセルティーナが欲しいんです」と彼は言った。"
    "translation_status": "reviewed"
  - "id": "isle-053"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Do you, indeed?” said Kalamake."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 778
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4292
        "line_end": 4292
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-053"
    "translation_ja": "「ほう、そうかね」とカラマケは言った。"
    "translation_status": "reviewed"
  - "id": "isle-054"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes,” said he, “and I may as well tell you plainly, I mean to have it. A man who picks up dollars on the beach can certainly afford a concertina.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 779
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4294
        "line_end": 4296
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-054"
    "translation_ja": "「そうです」とケオラは言った。「それにはっきり言っておきますが、手に入れるつもりです。浜で銀貨を拾う人なら、コンセルティーナぐらい買ってくれても困らないでしょう」"
    "translation_status": "reviewed"
  - "id": "isle-055"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I had no idea you had so much spirit,” replied the sorcerer. “I thought you were a timid, useless lad, and I cannot describe how much pleased I am to find I was mistaken. Now I begin to think I may have found an assistant and successor in my difficult business. A concertina? You shall have the best in Honolulu. And to-night, as soon as it is dark, you and I will go and find the money.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 780
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4298
        "line_end": 4303
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-055"
    "translation_ja": "「おまえがそこまで気骨のある若者とは思わなんだ」と術者は答えた。「てっきり臆病な役立たずだと思っていた。見込み違いとわかってどれほど嬉しいか、言葉にできんくらいだ。わしの難しい仕事の助手、それも後を継げる者が見つかったのかもしれんと思い始めたよ。コンセルティーナ？　ホノルルいちの品を買ってやろう。今夜、暗くなったらすぐ、おまえとわしとで金を取りに行こう」"
    "translation_status": "reviewed"
  - "id": "isle-056"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Shall we return to the beach?” asked Keola."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 781
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4305
        "line_end": 4305
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-056"
    "translation_ja": "「またあの浜へ行くんですか？」とケオラはたずねた。"
    "translation_status": "reviewed"
  - "id": "isle-057"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No, no!” replied Kalamake; “you must begin to learn more of my secrets. Last time I taught you to pick shells; this time I shall teach you to catch fish. Are you strong enough to launch Pili’s boat?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 782
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4307
        "line_end": 4309
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-057"
    "translation_ja": "「いやいや」とカラマケは答えた。「おまえには、わしの秘密をもっと覚え始めてもらわなくてはな。前回は貝の拾い方を教えた。今度は魚の取り方を教えよう。おまえはピリの舟を海に押し出せるか、力は足りるかね？」"
    "translation_status": "reviewed"
  - "id": "isle-058"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I think I am,” returned Keola. “But why should we not take your own, which is afloat already?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 783
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4311
        "line_end": 4312
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-058"
    "translation_ja": "「できると思います」とケオラは答えた。「でもご自分の舟なら、もう水に浮かんでいるじゃないですか。なぜそっちを使わないんです？」"
    "translation_status": "reviewed"
  - "id": "isle-059"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I have a reason which you will understand thoroughly before to-morrow,” said Kalamake. “Pili’s boat is the better suited for my purpose. So, if you please, let us meet there as soon as it is dark; and in the meanwhile, let us keep our own counsel, for there is no cause to let the family into our business.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 784
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4314
        "line_end": 4318
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-059"
    "translation_ja": "「わけがある。明日になる前にいやというほど分かるだろう」とカラマケは言った。「わしの目的にはピリの舟の方が向いておる。ではよかったら、暗くなると同時にそこで会おうじゃないか。それまでは二人だけの話にしておこう。家族にまで用向きを知らせる必要はない」"
    "translation_status": "reviewed"
  - "id": "isle-060"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Honey is not more sweet than was the voice of Kalamake, and Keola could scarce contain his satisfaction."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 785
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4320
        "line_end": 4321
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-060"
    "translation_ja": "蜜でもこのときのカラマケの声ほど甘くはなかった。ケオラは満足を隠しきれなかった。"
    "translation_status": "reviewed"
  - "id": "isle-061"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I might have had my concertina weeks ago,” thought he, “and there is nothing needed in this world but a little courage.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 786
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4323
        "line_end": 4324
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-061"
    "translation_ja": "「何週間も前に手に入れられたんじゃないか」と彼は思った。「この世にはほんの少しの勇気さえあればいいんだ」"
    "translation_status": "reviewed"
  - "id": "isle-062"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Presently after he spied Lehua weeping, and was half in a mind to tell her all was well."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 787
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4326
        "line_end": 4327
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-062"
    "translation_ja": "じきにレフアが泣いているのが目に入り、何もかもうまくいったと教えてやろうかという気になりかけた。"
    "translation_status": "reviewed"
  - "id": "isle-063"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“But no,” thinks he; “I shall wait till I can show her the concertina; we shall see what the chit will do then. Perhaps she will understand in the future that her husband is a man of some intelligence.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 788
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4329
        "line_end": 4331
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-063"
    "translation_ja": "「いや、よそう」と彼は思った。「コンセルティーナを見せてやれるまで待つんだ。そのときあの小娘がどう出るか見ものだぞ。これからは自分の夫がちったあ頭のいい男だとわかるかもしれん」"
    "translation_status": "reviewed"
  - "id": "isle-064"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As soon as it was dark father and son-in-law launched Pili’s boat and set the sail. There was a great sea, and it blew strong from the leeward; but the boat was swift and light and dry, and skimmed the waves. The wizard had a lantern, which he lit and held with his finger through the ring; and the two sat in the stern and smoked cigars, of which Kalamake had always a provision, and spoke like friends of magic and the great sums of money which they could make by its exercise, and what they should buy first, and what second; and Kalamake talked like a father."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 789
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4333
        "line_end": 4340
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-064"
    "translation_ja": "暗くなるなり義父と婿はピリの舟を海に出し、帆を張った。海は大きく荒れ、いつもは風下になる方角から強く吹きつけていたが、舟は速く軽く、水をかぶることもなく、波を滑っていった。魔法使いは手提げ灯に火を入れ、輪に指を通してつり下げた。二人は船尾に座り、カラマケがいつも欠かさず持っていた葉巻をふかした。魔術のこと、それを使えば稼げる大金のこと、最初に何を買い、次に何を買おうかということを、友達のように語り合った。カラマケの物言いはいかにも父親らしかった。"
    "translation_status": "reviewed"
  - "id": "isle-065"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Presently he looked all about, and above him at the stars, and back at the island, which was already three parts sunk under the sea, and he seemed to consider ripely his position."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 790
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4342
        "line_end": 4344
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-065"
    "translation_ja": "やがてカラマケは四方を見回し、頭上の星を仰ぎ、すでに四分の三ほど海に沈んだ島を振り返って、自分の位置を念入りに見定めているようだった。"
    "translation_status": "reviewed"
  - "id": "isle-066"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Look!” says he, “there is Molokai already far behind us, and Maui like a cloud; and by the bearing of these three stars I know I am come where I desire. This part of the sea is called the Sea of the Dead. It is in this place extraordinarily deep, and the floor is all covered with the bones of men, and in the holes of this part gods and goblins keep their habitation. The flow of the sea is to the north, stronger than a shark can swim, and any man who shall here be thrown out of a ship it bears away like a wild horse into the uttermost ocean. Presently he is spent and goes down, and his bones are scattered with the rest, and the gods devour his spirit.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 791
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4346
        "line_end": 4355
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-066"
    "translation_ja": "「見ろ」と彼は言った。「はやモロカイはああも遠くうしろになり、マウイは雲のようだ。あの三つの星の方角で、望んだ地点に着いたとわかる。この海域を死者の海という。ここは途方もなく深い。底には人間の骨が敷き詰められ、穴という穴には神々や物の怪が棲んでいる。潮は北へ流れる。サメの泳ぐ速さにもまさる流れだ。ここで船から投げ出された人間は、荒馬にさらわれるように海の果てへと運ばれる。やがて力尽きて沈む。その骨はほかの骨と入り交じって散り、その魂は神々に食われる」"
    "translation_status": "reviewed"
  - "id": "isle-067"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Fear came on Keola at the words, and he looked, and by the light of the stars and the lantern, the warlock seemed to change."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 792
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4357
        "line_end": 4358
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-067"
    "translation_ja": "その言葉にケオラは恐ろしくなって相手を見た。星と手提げ灯の明かりの中で、魔法使いの姿が変わるように見えた。"
    "translation_status": "reviewed"
  - "id": "isle-068"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What ails you?” cried Keola, quick and sharp."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 793
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4360
        "line_end": 4360
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-068"
    "translation_ja": "「どうしたんです？」とケオラは鋭く叫んだ。"
    "translation_status": "reviewed"
  - "id": "isle-069"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It is not I who am ailing,” said the wizard; “but there is one here very sick.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 794
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4362
        "line_end": 4363
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-069"
    "translation_ja": "「具合が悪いのはわしではない」と魔法使いは言った。「だがここに一人、ひどく具合の悪い者がおる」"
    "translation_status": "reviewed"
  - "id": "isle-070"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that he changed his grasp upon the lantern, and, behold I as he drew his finger from the ring, the finger stuck and the ring was burst, and his hand was grown to be of the bigness of three."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 795
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4365
        "line_end": 4367
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-070"
    "translation_ja": "そう言って手提げ灯を持ち替えた。するとどうだろう、輪から指を抜こうとすると指がつかえ、輪がはじけた。その手はいつもの三倍の大きさになっていた。"
    "translation_status": "reviewed"
  - "id": "isle-071"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At that sight Keola screamed and covered his face."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 796
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4369
        "line_end": 4369
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-071"
    "translation_ja": "それを見るなりケオラは悲鳴をあげ、顔をおおった。"
    "translation_status": "reviewed"
  - "id": "isle-072"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But Kalamake held up the lantern. “Look rather at my face!” said he—and his head was huge as a barrel; and still he grew and grew as a cloud grows on a mountain, and Keola sat before him screaming, and the boat raced on the great seas."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 797
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4371
        "line_end": 4374
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-072"
    "translation_ja": "だがカラマケは手提げ灯を高く掲げた。「むしろわしの顔を見ろ！」と言った。頭は樽ほど巨大だった。そして山にわく雲のように、際限もなく大きくなっていった。ケオラはその前に座って悲鳴をあげつづけ、舟は大波の上を突っ走った。"
    "translation_status": "reviewed"
  - "id": "isle-073"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And now,” said the wizard, “what do you think about that concertina? and are you sure you would not rather have a flute? No?” says he; “that is well, for I do not like my family to be changeable of purpose. But I begin to think I had better get out of this paltry boat, for my bulk swells to a very unusual degree, and if we are not the more careful, she will presently be swamped.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 798
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4376
        "line_end": 4381
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-073"
    "translation_ja": "「さて」と魔法使いは言った。「あのコンセルティーナのことを今はどう思う？　ほんとは笛の方がいいということはないかね？　ない？」と彼は言った。「それは結構。わしは身内の考えがころころ変わるのは好まんのでね。しかしそろそろわしはこのちっぽけな舟から下りた方がよさそうだ。体がいつになく大きく膨らんでおる。よほど気をつけんと、じきに舟は水びたしになる」"
    "translation_status": "reviewed"
  - "id": "isle-074"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that he threw his legs over the side. Even as he did so, the greatness of the man grew thirty-fold and forty-fold as swift as sight or thinking, so that he stood in the deep seas to the armpits, and his head and shoulders rose like a high isle, and the swell beat and burst upon his bosom, as it beats and breaks against a cliff. The boat ran still to the north, but he reached out his hand, and took the gunwale by the finger and thumb, and broke the side like a biscuit, and Keola was spilled into the sea. And the pieces of the boat the sorcerer crushed in the hollow of his hand and flung miles away into the night."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 799
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4383
        "line_end": 4391
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-074"
    "translation_ja": "そう言って舷から両脚を外へ出した。そうするそばから男の巨体は、見る間も思う間もなく三十倍、四十倍に膨れ上がった。彼は深海に脇の下まで浸かって立ち、頭と肩は高い島のようにそそり立ち、うねりが断崖に打ち寄せて砕けるように、その胸に打ち寄せて砕けた。舟はなおも北へ走った。だが彼は手を伸ばし、親指と人差し指で船縁をつまみ、ビスケットを割るように船腹を割った。ケオラは海にこぼれ落ちた。舟のかけらは手のひらで握りつぶし、何マイルも先の夜の中へ投げ捨てた。"
    "translation_status": "reviewed"
  - "id": "isle-075"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Excuse me taking the lantern,” said he; “for I have a long wade before me, and the land is far, and the bottom of the sea uneven, and I feel the bones under my toes.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 800
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4393
        "line_end": 4395
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-075"
    "translation_ja": "「明かりはわしが持っていくが勘弁してくれ」と彼は言った。「これから長らく水の中を歩かねばならん。陸は遠いし、海底はでこぼこだし、足の指に骨が当たるのでね」"
    "translation_status": "reviewed"
  - "id": "isle-076"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And he turned and went off walking with great strides; and as often as Keola sank in the trough he could see him no longer; but as often as he was heaved upon the crest, there he was striding and dwindling, and he held the lamp high over his head, and the waves broke white about him as he went."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 801
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4397
        "line_end": 4401
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-076"
    "translation_ja": "そう言って振り向くと大股に歩き去った。ケオラが波の谷に沈むたびにその姿は見えなくなったが、波頭に持ち上げられるたび、大股に進み、だんだん小さくなる男が見えた。明かりを頭上高く掲げ、歩いていくそのまわりに白く波が砕けていた。"
    "translation_status": "reviewed"
  - "id": "isle-077"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Since first the islands were fished out of the sea, there was never a man so terrified as this Keola. He swam indeed, but he swam as puppies swim when they are cast in to drown, and knew not wherefore. He could but think of the hugeness of the swelling of the warlock, of that face which was great as a mountain, of those shoulders that were broad as an isle, and of the seas that beat on them in vain. He thought, too, of the concertina, and shame took hold upon him; and of the dead men’s bones, and fear shook him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 802
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4403
        "line_end": 4410
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-077"
    "translation_ja": "はるか昔、島々が海から釣り上げられて以来、このケオラほどおびえた人間はいたためしがない。泳ぐには泳いだが、溺れさせようと水に投げ込まれた子犬の泳ぎで、何のために泳ぐのか自分でもわからなかった。脳裏を占めたのは、膨れ上がった魔法使いのとてつもない大きさ、山ほどの顔、島ほど広い肩、そこにむなしく打ちかかる海のことばかりだった。コンセルティーナのことも思って恥ずかしくなった。死者の骨のことも思って恐怖に震えた。"
    "translation_status": "reviewed"
  - "id": "isle-078"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Of a sudden he was aware of something dark against the stars that tossed, and a light below, and a brightness of the cloven sea; and he heard speech of men. He cried out aloud and a voice answered; and in a twinkling the bows of a ship hung above him on a wave like a thing balanced, and swooped down. He caught with his two hands in the chains of her, and the next moment was buried in the rushing seas, and the next hauled on board by seamen."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 803
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4412
        "line_end": 4418
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-078"
    "translation_ja": "ふいに星を背に何か黒いものが揺れるのに気づいた。その下には灯があり、割られた波が明るく輝き、人の声が聞こえた。大声で叫ぶと声が答えた。間髪を入れず一隻の船の舳先が、釣り合いを取って止まったかのように波の上、頭上に懸かり、それから舞い下りてきた。両手で船側の鎖をつかんだ。次の瞬間には奔る波に没し、その次には船乗りたちに甲板へ引き上げられていた。"
    "translation_status": "reviewed"
  - "id": "isle-079"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They gave him gin and biscuit and dry clothes, and asked him how he came where they found him, and whether the light which they had seen was the lighthouse, Lae o Ka Laau. But Keola knew white men are like children and only believe their own stories; so about himself he told them what he pleased, and as for the light (which was Kalamake’s lantern) he vowed he had seen none."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 804
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4420
        "line_end": 4425
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-079"
    "translation_ja": "船乗りたちはジンと乾パンと乾いた服をくれた。それから、どうしてあんなところにいたのか、さっき見えた明かりはラエ・オ・カ・ラアウの灯台か、とたずねた。しかしケオラは、白人は子供みたいなもので自分たちの話しか信じないと知っていた。そこで自分の身の上は好きなように作って話し、明かり（じつはカラマケの手提げ灯だった）など何も見なかったと誓った。"
    "translation_status": "reviewed"
  - "id": "isle-080"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This ship was a schooner bound for Honolulu, and then to trade in the low islands; and by a very good chance for Keola she had lost a man off the bowsprit in a squall. It was no use talking. Keola durst not stay in the Eight Islands. Word goes so quickly, and all men are so fond to talk and carry news, that if he hid in the north end of Kauai or in the south end of Kau, the wizard would have wind of it before a month, and he must perish. So he did what seemed the most prudent, and shipped sailor in the place of the man who had been drowned."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 805
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4427
        "line_end": 4434
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-080"
    "translation_ja": "この船はホノルルへ向かい、そこから低い島々へ交易に出るスクーナーだった。ケオラにとってはまことに運よく、突風の折に船首斜檣から乗員が一人落ち、欠員ができていた。考えても仕方がない。八つの島に留まる勇気はケオラにはなかった。話の伝わるのはじつに速く、誰もがおしゃべりと伝言が大好きだ。カウアイの北の果てに隠れようが、カウの南の果てに隠れようが、一月もたたぬうちに魔法使いの耳に入って、自分はきっと殺される。だから彼はいちばん利口だと思える道を選んだ。溺れた男の代わりに水夫として乗り組んだのである。"
    "translation_status": "reviewed"
  - "id": "isle-081"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In some ways the ship was a good place. The food was extraordinarily rich and plenty, with biscuits and salt beef every day, and pea-soup and puddings made of flour and suet twice a week, so that Keola grew fat. The captain also was a good man, and the crew no worse than other whites. The trouble was the mate, who was the most difficult man to please Keola had ever met with, and beat and cursed him daily, both for what he did and what he did not. The blows that he dealt were very sore, for he was strong; and the words he used were very unpalatable, for Keola was come of a good family and accustomed to respect. And what was the worst of all, whenever Keola found a chance to sleep, there was the mate awake and stirring him up with a rope’s end. Keola saw it would never do; and he made up his mind to run away."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 806
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4436
        "line_end": 4447
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-081"
    "translation_ja": "いくつかの点では、船はよい所だった。食事はめったにないほど贅沢で量もたっぷりだった。毎日乾パンと塩漬け牛肉が出て、週に二度はエンドウ豆のスープと小麦粉と牛脂で作るプディングが出た。おかげでケオラは太った。船長もよい人で、船員たちもほかの白人と比べて悪くはなかった。困るのは一等航海士だった。ケオラが会ったうちで最も気難しい男で、何かをしても、何もしなくても、毎日殴っては罵った。力が強いので殴られるとたいそう痛んだ。ケオラはよい家の生まれで敬われるのに慣れていたから、浴びせられる言葉もひどく我慢のならないものだった。何よりつらいのは、せっかく眠る隙を見つけても、航海士は決まって起きていて、ロープの端でひっぱたいて起こすことだった。ケオラは、このままでは立ち行かないと悟った。逃げようと心を決めた。"
    "translation_status": "reviewed"
  - "id": "isle-082"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They were about a month out from Honolulu when they made the land. It was a fine starry night, the sea was smooth as well as the sky fair; it blew a steady trade; and there was the island on their weather bow, a ribbon of palm trees lying flat along the sea. The captain and the mate looked at it with the night glass, and named the name of it, and talked of it, beside the wheel where Keola was steering. It seemed it was an isle where no traders came. By the captain’s way, it was an isle besides where no man dwelt; but the mate thought otherwise."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 807
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4449
        "line_end": 4456
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-082"
    "translation_ja": "ホノルルを出てひと月ばかりで陸が見えた。星の美しい夜で、空が晴れているばかりか海も穏やかだった。一定した貿易風が吹き、風上の船首寄りに島があった。細い帯のようなヤシの列が海面すれすれに横たわっていた。ケオラが舵を取る横で、船長と航海士は夜間用の望遠鏡で島を見て、その名を挙げ、あれこれ話した。商人の寄りつかない島らしかった。船長の話では住む者さえない島だったが、航海士はそうは思わなかった。"
    "translation_status": "reviewed"
  - "id": "isle-083"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I don’t give a cent for the directory,” said he, “I’ve been past here one night in the schooner Eugenie; it was just such a night as this; they were fishing with torches, and the beach was thick with lights like a town.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 808
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4458
        "line_end": 4461
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-083"
    "translation_ja": "「水路誌なんざ一セントの値打ちもねえさ」と彼は言った。「ある晩、スクーナーのウジェニー号でここを通った。ちょうどこんな晩だった。やつらは松明をともして漁をしていて、浜には町みたいに明かりがぎっしりだった」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 97

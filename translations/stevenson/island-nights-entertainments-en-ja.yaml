  - "id": "beach-136"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Altogether I was pretty well pleased with his attitude, and almost more the next day, when we met to go before the chiefs, to see him so stern and resolved. The chiefs awaited us in one of their big oval houses, which was marked out to us from a long way off by the crowd about the eaves, a hundred strong if there was one—men, women, and children. Many of the men were on their way to work and wore green wreaths, and it put me in thoughts of the 1st of May at home. This crowd opened and buzzed about the pair of us as we went in, with a sudden angry animation. Five chiefs were there; four mighty stately men, the fifth old and puckered. They sat on mats in their white kilts and jackets; they had fans in their hands, like fine ladies; and two of the younger ones wore Catholic medals, which gave me matter of reflection. Our place was set, and the mats laid for us over against these grandees, on the near side of the house; the midst was empty; the crowd, close at our backs, murmured and craned and jostled to look on, and the shadows of them tossed in front of us on the clean pebbles of the floor. I was just a hair put out by the excitement of the commons, but the quiet civil appearance of the chiefs reassured me, all the more when their spokesman began and made a long speech in a low tone of voice, sometimes waving his hand towards Case, sometimes toward me, and sometimes knocking with his knuckles on the mat. One thing was clear: there was no sign of anger in the chiefs."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 145
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 862
        "line_end": 882
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-136"
    "translation_ja": "総じて俺はやつの態度がすっかり気に入った。翌日、首長たちを訪ねようと落ち合い、いかにも厳しく決意に満ちた顔を見た時には、なおさらだったかもしれない。首長たちはあちらの大きな楕円形の家の一つで待っていた。軒先に集まった人垣から遠くでも場所がわかった。男、女、子供、ざっと百人はいた。男の多くは仕事に行く途中で、緑の葉冠をつけた姿は故郷の五月祭を思わせた。俺たちが入っていくと群衆が割れ、急に怒りのこもったざわめきが二人を取り巻いた。首長は五人。四人は堂々たる男で、五人目は皺くちゃの老人だった。白い腰布と上着で筵に座り、身分の高いご婦人方のように手に扇を持ち、若いほうの二人はカトリックの聖牌を首に掛けていた。そいつは考えさせられた。俺たちの席はこのお偉方と向かい合わせ、家の手前側に取って筵を敷いてあった。中央は空いていた。群衆がすぐ背後でひそひそ言い、首を伸ばし、押し合って見ようとした。その影が俺たちの目の前、床に敷いた清潔な小石に揺れ動いた。下々の者の興奮にはいささか面食らったが、首長たちの物静かで丁重な様子に安心した。代弁人が口を開き、小声で長い挨拶を始めると、なおさらだった。ときにはケイスへ、ときには俺へ手を振り、ときには指の節で筵をとんとん叩いた。一つははっきりしていた。首長たちには腹を立てている素振りはなかった。"
    "translation_status": "reviewed"

  - "id": "beach-130"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Case laughed, took a lantern from the store, and set out into the village. He was gone perhaps a quarter of an hour, and he looked mighty serious when he came back."

    "translation_ja": "「あれは誰だ」と俺は言った。「あの子ならいい」"
    "translation_status": "reviewed"
  - "id": "beach-023"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s Uma,” said Case, and he called her up and spoke to her in the native. I didn’t know what he said; but when he was in the midst she looked up at me quick and timid, like a child dodging a blow, then down again, and presently smiled. She had a wide mouth, the lips and the chin cut like any statue’s; and the smile came out for a moment and was gone. Then she stood with her head bent, and heard Case to an end, spoke back in the pretty Polynesian voice, looking him full in the face, heard him again in answer, and then with an obeisance started off. I had just a share of the bow, but never another shot of her eye, and there was no more word of smiling."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 32
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 212
        "line_end": 221
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-023"
    "translation_ja": "「あれはウマだ」とケイスは言い、呼び寄せて土地の言葉で話した。何を言ったのかわからない。だが話の途中で娘は、打たれそうになって身をかわす子供のように、ちらとおびえた目を俺に上げ、また伏せ、やがて微笑した。口は大きく、唇と顎の形は彫像さながらだった。笑みはひととき浮かんで、消えた。それからうつむいてケイスを最後まで聞き、今度はケイスの顔をまっすぐ見て、ポリネシアの人らしい、あのきれいな声で答えた。ケイスの返事を聞くと一礼して行ってしまった。お辞儀は俺にも少しばかり分け前が回ったが、もうちらともこちらを見ず、笑顔なんぞ跡形もなかった。"
    "translation_status": "reviewed"
  - "id": "beach-024"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I guess it’s all right,” said Case. “I guess you can have her. I’ll make it square with the old lady. You can have your pick of the lot for a plug of tobacco,” he added, sneering."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 33
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 223
        "line_end": 225
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-024"
    "translation_ja": "「まあいいだろう」とケイスが言った。「あの子はあんたのものだ。おっ母さんとは俺が話をつける。この連中なら棒煙草一本で選り取り見取りだよ」と鼻で笑って付け足した。"
    "translation_status": "reviewed"
  - "id": "beach-025"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I suppose it was the smile stuck in my memory, for I spoke back sharp. “She doesn’t look that sort,” I cried."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 34
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 227
        "line_end": 228
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-025"
    "translation_ja": "あの笑みが頭に残っていたものと見え、俺はつんけんして答えた。「そういう娘には見えないぞ」"
    "translation_status": "reviewed"
  - "id": "beach-026"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I don’t know that she is,” said Case. “I believe she’s as right as the mail. Keeps to herself, don’t go round with the gang, and that. O no, don’t you misunderstand me—Uma’s on the square.” He spoke eager, I thought, and that surprised and pleased me. “Indeed,” he went on, “I shouldn’t make so sure of getting her, only she cottoned to the cut of your jib. All you have to do is to keep dark and let me work the mother my own way; and I’ll bring the girl round to the captain’s for the marriage.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 35
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 230
        "line_end": 237
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-026"
    "translation_ja": "「あの子がそうだと言った覚えはない」とケイス。「郵便と同じくらい確かな娘だと思うよ。いつも一人で、お仲間と連れ歩いたりもしないしな。いや、誤解しないでくれよ。ウマはまともだ」妙に熱のこもった口ぶりだったのが、俺には意外で、また嬉しくもあった。「実際」と彼は続けた。「あんたの面構えをあの子が気に入らなかったら、俺もこう請け合ったりしないさ。あんたはおとなしく黙って、おっ母さんの操縦は俺の好きにさせてくれ。婚礼にあの子を船長の家へ連れていこう」"
    "translation_status": "reviewed"
  - "id": "beach-027"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I didn’t care for the word marriage, and I said so."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 36
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 239
        "line_end": 239
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-027"
    "translation_ja": "婚礼という言葉は気に入らなかった。俺はそう言った。"
    "translation_status": "reviewed"
  - "id": "beach-028"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Oh, there’s nothing to hurt in the marriage,” says he. “Black Jack’s the chaplain.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 37
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 241
        "line_end": 242
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-028"
    "translation_ja": "「なに、あの婚礼で痛い目に遭うこたあない」と言う。「司祭はブラック・ジャックさ」"
    "translation_status": "reviewed"
  - "id": "beach-029"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "By this time we had come in view of the house of these three white men; for a negro is counted a white man, and so is a Chinese! a strange idea, but common in the islands. It was a board house with a strip of rickety verandah. The store was to the front, with a counter, scales, and the poorest possible display of trade: a case or two of tinned meats; a barrel of hard bread; a few bolts of cotton stuff, not to be compared with mine; the only thing well represented being the contraband, firearms and liquor. “If these are my only rivals,” thinks I, “I should do well in Falesá.” Indeed, there was only the one way they could touch me, and that was with the guns and drink."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 38
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 244
        "line_end": 253
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-029"
    "translation_ja": "その頃には三人の白人の家が見えていた。なにしろ黒人も白人に数えるし、中国人だって白人だ！　妙な考えだが、島々では当たり前なのだ。家は板張りで、細くがたついた縁廊がついていた。表が店で、売台に秤、品ぞろえはお話にならなかった。肉の缶詰が一箱か二箱、堅パン一樽、俺のとは比べものにならない綿布が数反。しっかり取りそろえてあるのは、ご禁制の鉄砲と酒だけだった。「商売敵がこれっきりなら、ファレサーではいい暮らしができそうだ」と俺は思った。実際、こいつらが俺と張り合える品といったら鉄砲と酒しかなかった。"
    "translation_status": "reviewed"
  - "id": "beach-030"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In the back room was old Captain Randall, squatting on the floor native fashion, fat and pale, naked to the waist, grey as a badger, and his eyes set with drink. His body was covered with grey hair and crawled over by flies; one was in the corner of his eye—he never heeded; and the mosquitoes hummed about the man like bees. Any clean-minded man would have had the creature out at once and buried him; and to see him, and think he was seventy, and remember he had once commanded a ship, and come ashore in his smart togs, and talked big in bars and consulates, and sat in club verandahs, turned me sick and sober."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 39
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 255
        "line_end": 263
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-030"
    "translation_ja": "奥の部屋で年寄りのランドル船長が土地風に床にしゃがんでいた。ぶくぶくに太って青白く、上半身は裸、毛は穴熊みたいに灰色で、酔いに目が据わっていた。灰色の毛が胸腹を覆い、そこらじゅうを蠅が這っていた。目の端にも一匹いたが、気にも留めない。蚊どもが蜜蜂みたいにまわりでぶんぶん唸っていた。清潔好きの人間ならこんな生き物はつまみ出し、その場で埋めたくもなるだろう。そのざまを見ながら、この男が七十で、昔は一隻の船を指揮し、しゃれた身なりで上陸し、酒場や領事館で大言を吐き、会員制クラブの縁廊に陣取った男だと思うと、俺は吐き気といっしょに酔いがさめた。"
    "translation_status": "reviewed"
  - "id": "beach-031"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He tried to get up when I came in, but that was hopeless; so he reached me a hand instead, and stumbled out some salutation."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 40
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 265
        "line_end": 266
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-031"
    "translation_ja": "俺が入ると立とうとしたが、とても無理なので、代わりに手を差し伸べ、もつれる舌で何やら挨拶した。"
    "translation_status": "reviewed"
  - "id": "beach-032"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Papa’s {1} pretty full this morning,” observed Case. “We’ve had an epidemic here; and Captain Randall takes gin for a prophylactic—don’t you, Papa?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 41
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 268
        "line_end": 270
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-032"
    "translation_ja": "「今朝はパッパ〔原注1〕もだいぶ出来上がってるな」とケイスが言った。「このあたりで流行り病が出てね。ランドル船長は予防剤としてジンを召し上がる。そうでしょう、パッパ？」"
    "translation_status": "reviewed"
  - "id": "beach-033"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Never took such a thing in my life!” cried the captain indignantly. “Take gin for my health’s sake, Mr. Wha’s-ever-your-name—’s a precautionary measure.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 42
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 272
        "line_end": 274
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-033"
    "translation_ja": "「そんなもん生まれてこのかた飲んだことはない！」と船長は憤然と叫んだ。「ジンは健康のために飲むんだ、なんとかさん。予防措置ちゅうやつだ」"
    "translation_status": "reviewed"
  - "id": "beach-034"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s all right, Papa,” said Case. “But you’ll have to brace up. There’s going to be a marriage—Mr. Wiltshire here is going to get spliced.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 43
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 276
        "line_end": 278
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-034"
    "translation_ja": "「わかったよ、パッパ」とケイス。「だが、しゃんとしてくれよ。これから婚礼だ。こちらのウィルトシャーさんが所帯を持つんだ」"
    "translation_status": "reviewed"
  - "id": "beach-035"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The old man asked to whom."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 44
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 280
        "line_end": 280
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-035"
    "translation_ja": "老人が相手は誰だと聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-036"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“To Uma,” said Case."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 45
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 282
        "line_end": 282
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-036"
    "translation_ja": "「ウマだ」とケイス。"
    "translation_status": "reviewed"
  - "id": "beach-037"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Uma!” cried the captain. “Wha’s he want Uma for? ’s he come here for his health, anyway? Wha’ ’n hell’s he want Uma for?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 46
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 284
        "line_end": 285
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-037"
    "translation_ja": "「ウマだと！」と船長が叫んだ。「なんだってウマなんぞ欲しい？　そもそも養生にでも来たのか、こいつは？　畜生、どうしてまたウマなんか欲しがる？」"
    "translation_status": "reviewed"
  - "id": "beach-038"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Dry up, Papa,” said Case. “’Tain’t you that’s to marry her. I guess you’re not her godfather and godmother. I guess Mr. Wiltshire’s going to please himself.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 47
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 287
        "line_end": 289
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-038"
    "translation_ja": "「黙ってなよ、パッパ」とケイス。「あの子をもらうのはあんたじゃない。洗礼の名付け親を、あんた一人で父親も母親も務めたわけじゃあるまい。ウィルトシャーさんはご自分の好きになさるさ」"
    "translation_status": "reviewed"
  - "id": "beach-039"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that he made an excuse to me that he must move about the marriage, and left me alone with the poor wretch that was his partner and (to speak truth) his gull. Trade and station belonged both to Randall; Case and the negro were parasites; they crawled and fed upon him like the flies, he none the wiser. Indeed, I have no harm to say of Billy Randall beyond the fact that my gorge rose at him, and the time I now passed in his company was like a nightmare."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 48
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 291
        "line_end": 297
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-039"
    "translation_ja": "そう言うと、婚礼の支度に動かなくちゃならないと俺に断り、あの哀れな相棒、いや、ほんとはケイスのいいカモと、俺を二人きりにした。商売も商館ももともとランドルのものだった。ケイスとあの黒人は寄生虫だ。蠅ども同然にやつの上を這い回り、食い物にしているのに、当の本人は何ひとつ知らない。正直言って俺は、ビリー・ランドルを見て反吐が出そうだったほかは悪く言うつもりはない。だがそのとき二人で過ごした時間は悪夢のようだった。"
    "translation_status": "reviewed"
  - "id": "beach-040"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The room was stifling hot and full of flies; for the house was dirty and low and small, and stood in a bad place, behind the village, in the borders of the bush, and sheltered from the trade. The three men’s beds were on the floor, and a litter of pans and dishes. There was no standing furniture; Randall, when he was violent, tearing it to laths. There I sat and had a meal which was served us by Case’s wife; and there I was entertained all day by that remains of man, his tongue stumbling among low old jokes and long old stories, and his own wheezy laughter always ready, so that he had no sense of my depression. He was nipping gin all the while. Sometimes he fell asleep, and awoke again, whimpering and shivering, and every now and again he would ask me why I wanted to marry Uma. “My friend,” I was telling myself all day, “you must not come to be an old gentleman like this.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 49
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 299
        "line_end": 311
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-040"
    "translation_ja": "部屋は息が詰まるほど暑く、蠅だらけだった。家が汚いうえに天井が低く狭く、村裏の藪のきわ、貿易風も届かないまずい場所に建っていたからだ。三人の寝床は床のじか敷きで、鍋だの皿だのが散らばっていた。立てて置く家具は一つもなかった。ランドルが暴れて片っ端から板きれにしてしまうのだ。そこで俺はケイスの女房が運ぶ食事をとり、あとは一日、人間の残りかすみたいな男の相手をさせられた。もつれる舌で古くさい猥談や昔の長話をし、何かにつけて自分からぜいぜい笑うので、俺がどれほど滅入っているか、気づきもしない。ひっきりなしにジンをちびちびやっていた。ときには眠り、べそをかきながら震えて目を覚ました。そして折々、どうしてウマと結婚したいんだと俺に聞いた。「おい、お前」と俺は一日じゅう自分に言い聞かせた。「こんなご隠居になっちゃいかんぞ」"
    "translation_status": "reviewed"
  - "id": "beach-041"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It might be four in the afternoon, perhaps, when the back door was thrust slowly open, and a strange old native woman crawled into the house almost on her belly. She was swathed in black stuff to her heels; her hair was grey in swatches; her face was tattooed, which was not the practice in that island; her eyes big and bright and crazy. These she fixed upon me with a rapt expression that I saw to be part acting. She said no plain word, but smacked and mumbled with her lips, and hummed aloud, like a child over its Christmas pudding. She came straight across the house, heading for me, and, as soon as she was alongside, caught up my hand and purred and crooned over it like a great cat. From this she slipped into a kind of song."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 50
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 313
        "line_end": 323
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-041"
    "translation_ja": "午後四時頃だったろう。裏口がそろそろと押し開けられ、見知らぬ島の婆さんがほとんど腹這いで入ってきた。黒い布をかかとまですっぽり巻き、髪にはところどころ灰色の房がまじり、顔にはこの島のならわしではない入れ墨があり、大きな目がキラキラと気違いじみていた。その目をうっとりと俺に据えたが、半分は芝居だと俺にはわかった。はっきりした言葉は一つも言わず、クリスマスのプディングにありついた子供みたいに、唇をぴちゃぴちゃ、むにゃむにゃやり、声を立てて鼻歌をうたった。まっすぐ俺めがけて部屋を横切り、脇へ来るが早いか俺の手を取って、大きな猫みたいにその手に喉を鳴らし、撫でるような声を出した。それがいつしか一種の歌になった。"
    "translation_status": "reviewed"
  - "id": "beach-042"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Who the devil’s this?” cried I, for the thing startled me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 51
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 325
        "line_end": 325
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-042"
    "translation_ja": "「いったい何者だ、こりゃ！」と俺は叫んだ。びっくりしたのだ。"
    "translation_status": "reviewed"
  - "id": "beach-043"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It’s Fa’avao,” says Randall; and I saw he had hitched along the floor into the farthest corner."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 52
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 327
        "line_end": 328
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-043"
    "translation_ja": "「ファアヴァオだ」とランドルが言った。見ると床をずりずり伝っていちばん遠い隅まで退いていた。"
    "translation_status": "reviewed"
  - "id": "beach-044"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You ain’t afraid of her?” I cried."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 53
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 330
        "line_end": 330
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-044"
    "translation_ja": "「まさかこの人が怖いんじゃないだろうな」と俺は叫んだ。"
    "translation_status": "reviewed"
  - "id": "beach-045"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Me ’fraid!” cried the captain. “My dear friend, I defy her! I don’t let her put her foot in here, only I suppose ’s different to-day, for the marriage. ’s Uma’s mother.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 54
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 332
        "line_end": 334
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-045"
    "translation_ja": "「わしが怖いだと！」と船長。「いいかね、あんなのはへでもない！　ふだんならここへ一歩も入らせんよ。もっとも今日は婚礼で別なんだろうが。ウマのおっ母だもの」"
    "translation_status": "reviewed"
  - "id": "beach-046"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, suppose it is; what’s she carrying on about?” I asked, more irritated, perhaps more frightened, than I cared to show; and the captain told me she was making up a quantity of poetry in my praise because I was to marry Uma. “All right, old lady,” says I, with rather a failure of a laugh, “anything to oblige. But when you’re done with my hand, you might let me know.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 55
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 336
        "line_end": 341
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-046"
    "translation_ja": "「そうだとしても、いったい何を騒いでるんだ」と俺は聞いた。顔に出したくなかったが、腹立たしく、ひょっとすると恐ろしくもあった。船長の言うには、俺がウマをもらうので、婆さんは俺をたたえる詩をどっさり即興で作っているそうだ。「いいよ、おっ母さん」と俺は言ったが、笑いはあまりうまく出なかった。「お気のすむように。だが俺の手が済んだら、そう言ってくれるとありがたい」"
    "translation_status": "reviewed"
  - "id": "beach-047"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She did as though she understood; the song rose into a cry, and stopped; the woman crouched out of the house the same way that she came in, and must have plunged straight into the bush, for when I followed her to the door she had already vanished."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 56
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 343
        "line_end": 346
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-047"
    "translation_ja": "まるで通じたかのようだった。歌声が叫びになって途切れ、婆さんは入った時と同じように屈んで家を出た。まっすぐ藪に飛び込んだに違いない。俺があとを追って戸口まで行くと、もう消えていた。"
    "translation_status": "reviewed"
  - "id": "beach-048"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“These are rum manners,” said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 57
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 348
        "line_end": 348
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-048"
    "translation_ja": "「妙な習わしだな」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-049"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“’s a rum crowd,” said the captain, and, to my surprise, he made the sign of the cross on his bare bosom."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 58
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 350
        "line_end": 351
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-049"
    "translation_ja": "「妙な連中だからな」と船長。驚いたことに、裸の胸の上で十字を切った。"
    "translation_status": "reviewed"
  - "id": "beach-050"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Hillo!” says I, “are you a Papist?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 59
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 353
        "line_end": 353
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-050"
    "translation_ja": "「おやまあ！」と俺は言った。「あんた、ローマ教徒かい？」"
    "translation_status": "reviewed"
  - "id": "beach-051"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He repudiated the idea with contempt. “Hard-shell Baptis’,” said he. “But, my dear friend, the Papists got some good ideas too; and tha’ ’s one of ’em. You take my advice, and whenever you come across Uma or Fa’avao or Vigours, or any of that crowd, you take a leaf out o’ the priests, and do what I do. Savvy?” says he, repeated the sign, and winked his dim eye at me. “No, sir!” he broke out again, “no Papists here!” and for a long time entertained me with his religious opinions."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 60
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 355
        "line_end": 361
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-051"
    "translation_ja": "そんなものかと侮りもあらわに否定した。「こちとら生粋のバプテストだ」と言った。「だがまあ聞きなよ、ローマ教徒にも少しはいい知恵がある。これもその一つだ。悪いことは言わん。ウマかファアヴァオかヴィガーズか、あの一味の誰かと鉢合わせしたら、神父どものまねをして、わしのやる通りにしてみな。わかったか？」ともう一度十字を切り、濁った目で片目をつぶった。「とんでも、ありま、せん！」とまたやりだした。「ここにゃローマ教徒はおらん！」それから長いこと、持論の宗教談を聞かせてくれた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 375
          "end": 378
          "exact": "sir"
  - "id": "beach-052"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I must have been taken with Uma from the first, or I should certainly have fled from that house, and got into the clean air, and the clean sea, or some convenient river—though, it’s true, I was committed to Case; and, besides, I could never have held my head up in that island if I had run from a girl upon my wedding-night."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 61
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 363
        "line_end": 367
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-052"
    "translation_ja": "俺はよほど初めからウマに参っていたに違いない。でなけりゃきっとあの家から飛び出し、きれいな空気を吸いに、きれいな海か手頃な川へ浸かりに行ったはずだ。もっともケイスと約束はしたし、それに婚礼の晩に娘を怖がって逃げたとあっては、あの島でお天道様に顔向けができなくなっただろうが。"
    "translation_status": "reviewed"
  - "id": "beach-053"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The sun was down, the sky all on fire, and the lamp had been some time lighted, when Case came back with Uma and the negro. She was dressed and scented; her kilt was of fine tapa, looking richer in the folds than any silk; her bust, which was of the colour of dark honey, she wore bare only for some half a dozen necklaces of seeds and flowers; and behind her ears and in her hair she had the scarlet flowers of the hibiscus. She showed the best bearing for a bride conceivable, serious and still; and I thought shame to stand up with her in that mean house and before that grinning negro. I thought shame, I say; for the mountebank was dressed with a big paper collar, the book he made believe to read from was an odd volume of a novel, and the words of his service not fit to be set down. My conscience smote me when we joined hands; and when she got her certificate I was tempted to throw up the bargain and confess. Here is the document. It was Case that wrote it, signatures and all, in a leaf out of the ledger:—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 62
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 369
        "line_end": 383
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-053"
    "translation_ja": "陽は沈み、空は一面燃え立ち、ランプがともってもうずいぶんしてから、ケイスがウマと黒人を連れて戻った。ウマは盛装して香をまとっていた。腰に巻いた上物のタパ布は、襞のあたりなどどんな絹より豪華に見えた。濃い蜂蜜色の胸には何もつけず、ただ種や花をつないだ首飾りが五、六連。耳の後ろと髪には真紅のハイビスカスの花。真面目にしんとしていて、花嫁には考えられる限り申し分のない立ち居振る舞いだった。こんなみすぼらしい家で、にやにやした黒人の前にあの娘と並び立つのが俺は恥ずかしかった。恥ずかしかった、と俺は言う。なにせ、この道化者が着けたのは紙製の大きな襟で、読み上げるまねをした本は、端本の小説が一冊。式文の言葉ときたら書きつけるのも憚られる。二人して手を取り合った時、俺の良心はずきりと痛んだ。ウマが証書を受け取ると、取引を御破算にして何もかも打ち明けたくなった。その書面をお目にかける。帳簿から破った一枚に、署名まですべてケイスが書いたものだ。"
    "translation_status": "reviewed"
  - "id": "beach-054"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This is to certify that Uma, daughter of Fa’avao of Falesá, Island of ---, is illegally married to Mr. John Wiltshire for one week, and Mr. John Wiltshire is at liberty to send her to hell when he pleases."

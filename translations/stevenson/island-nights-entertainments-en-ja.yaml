    "translation_status": "reviewed"
  - "id": "beach-270"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, I’ll give you all the time I can spare,” says he, looking at his watch. “But I must tell you fairly, I haven’t eaten since five this morning, and, unless you can let me have something I am not likely to eat again before seven or eight to-night.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 279
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1480
        "line_end": 1483
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-270"
    "translation_ja": "「では、できるかぎりお時間を取りましょう」と彼は時計を見ながら言った。「ただ、実を申しますと、今朝五時から何も食べていません。何か食べさせていただけなければ、今晩の七時か八時まで食べられそうにないのです」"
    "translation_status": "reviewed"
  - "id": "beach-271"

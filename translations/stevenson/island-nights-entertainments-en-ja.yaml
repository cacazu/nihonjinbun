    "translation_status": "reviewed"
  - "id": "beach-279"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“He admitted he was not; for, though he did not drink, he was profligate with women, and had no religion."
    "source_languages":

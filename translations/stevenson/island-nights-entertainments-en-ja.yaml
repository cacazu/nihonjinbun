        "line_end": 1967
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-352"
    "translation_ja": "「そんな作り話を鵜呑みにしてるってのか？」と俺は聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-353"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She told me the thing was well known, and with handsome young men alone it was even common; but this was the only case where five had been slain the same day and in a company by the love of the women-devils; and it had made a great stir in the island, and she would be crazy if she doubted."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 362
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1969
        "line_end": 1972
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-353"
    "translation_ja": "よく知られた話で、男前の若者が一人でいるところなら、ありふれたことですらあるのだと、彼女は言った。ただ、男五人が同じ日にまとめて女の悪魔の恋に殺されたのは、この一件きりで、島では大騒ぎになった。疑うほうがどうかしている、と言うのだ。"
    "translation_status": "reviewed"
  - "id": "beach-354"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, anyway,” says I, “you needn’t be frightened about me. I’ve no use for the women-devils. You’re all the women I want, and all the devil too, old lady.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 363
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1974
        "line_end": 1976
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-354"
    "translation_ja": "「まあ、どっちにしても」と俺は言った。「俺の心配はいらないよ。女の悪魔には用がない。女はおまえ一人で十分だし、悪魔だっておまえ一人でたくさんだよ、かみさん」"
    "translation_status": "reviewed"
  - "id": "beach-355"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To this she answered there were other sorts, and she had seen one with her own eyes. She had gone one day alone to the next bay, and, perhaps, got too near the margin of the bad place. The boughs of the high bush overshadowed her from the cant of the hill, but she herself was outside on a flat place, very stony and growing full of young mummy-apples four and five feet high. It was a dark day in the rainy season, and now there came squalls that tore off the leaves and sent them flying, and now it was all still as in a house. It was in one of these still times that a whole gang of birds and flying foxes came pegging out of the bush like creatures frightened. Presently after she heard a rustle nearer hand, and saw, coming out of the margin of the trees, among the mummy-apples, the appearance of a lean grey old boar. It seemed to think as it came, like a person; and all of a sudden, as she looked at it coming, she was aware it was no boar but a thing that was a man with a man’s thoughts. At that she ran, and the pig after her, and as the pig ran it holla’d aloud, so that the place rang with it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 364
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1978
        "line_end": 1993
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-355"
    "translation_ja": "悪魔はほかにもいろいろいて、ウマはその一つを自分の目で見たという。ある日、ひとりで隣の入り江へ出かけ、おそらくあのよくない場所のはずれまで、近寄りすぎたのだろう。丘の斜面から奥の森の枝が張りだして影を落としていたが、ウマはその外の平らな所にいた。石だらけで、四、五フィートの若いパパイアがいっぱい生えていた。雨季の薄暗い日で、突風が葉を引きちぎって吹き散らしたかと思うと、家の中のようにしんと静まり返った。そのしんとした時に、鳥やオオコウモリが大群になって、何かにおびえたように森から飛び出してきた。まもなく手近でがさがさ音がして、木立のはずれからパパイアの間へ、やせた灰色の年老いたイノシシのようなものが出てきた。人のように、何やら考えながら近づいてくるようだった。それが来るのを見ていたら、ふいにウマにはわかった。イノシシじゃない。人間の考えを持った、人間そのものなんだと。そこでウマは逃げ出し、イノシシが追いかけた。走りながら大声で叫ぶので、あたりじゅうに響き渡ったという。"
    "translation_status": "reviewed"
  - "id": "beach-356"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I wish I had been there with my gun,” said I. “I guess that pig would have holla’d so as to surprise himself.”"
    "source_languages":

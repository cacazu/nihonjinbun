  - "id": "beach-120"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I thought awhile whether I should ask her more, but it’s a bad idea to set natives up with any notion of consulting them, so I went to Case. It was dark, and he was sitting alone, as he did mostly, smoking on the stairs."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 129
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 808
        "line_end": 811
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-120"
    "translation_ja": "もっと聞くかどうかしばらく考えた。だが島の者に相談するものだなどと思わせておくのは得策でないので、ケイスのところに行った。暗くなっていた。やつはたいていそうしているように、ひとりで階段に腰を下ろして煙草を吸っていた。"
    "translation_status": "reviewed"
  - "id": "beach-121"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Case,” said I, “here’s a queer thing. I’m tabooed.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 130
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 813
        "line_end": 813
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-121"
    "translation_ja": "「ケイス」と俺は言った。「妙な話だが、俺はタブーを掛けられている」"
    "translation_status": "reviewed"
  - "id": "beach-122"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“O, fudge!” says he; “’tain’t the practice in these islands.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 131
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 815
        "line_end": 815
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-122"
    "translation_ja": "「ばかな！」とやつは言った。「このへんの島にそんな習わしはない」"
    "translation_status": "reviewed"
  - "id": "beach-123"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That may be, or it mayn’t,” said I. “It’s the practice where I was before. You can bet I know what it’s like; and I tell it you for a fact, I’m tabooed.”"
    "source_languages":
      - "en"

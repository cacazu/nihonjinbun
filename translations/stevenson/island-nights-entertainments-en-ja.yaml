  - "id": "beach-431"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You come alone?” I asked. “You no ’fraid?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 440
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2483
        "line_end": 2483
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-431"
    "translation_ja": "「一人で来たのか？」と俺は聞いた。「怖くなかったか？」"
    "translation_status": "reviewed"
  - "id": "beach-432"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ah, too much ’fraid!” she whispered, clutching me. “I think die.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 441
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2485
        "line_end": 2485
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-432"
    "translation_ja": "「ああ、うんと怖い！」とあいつはささやいて、俺にしがみついた。「死ぬと思った」"
    "translation_status": "reviewed"
  - "id": "beach-433"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” says I, with a kind of a weak grin, “I’m not the one to laugh at you, Mrs. Wiltshire, for I’m about the worst scared man in the South Pacific myself.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 442
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2487
        "line_end": 2489
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-433"
    "translation_ja": "「まあな」と俺は弱々しく笑った。「お前を笑えた義理じゃないぞ、ウィルトシャーの奥さん。俺のほうが、南太平洋で一番びくびくしている男なんだからな」"
    "translation_status": "reviewed"
  - "id": "beach-434"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She told me in two words what brought her. I was scarce gone, it seems, when Fa’avao came in, and the old woman had met Black Jack running as hard as he was fit from our house to Case’s. Uma neither spoke nor stopped, but lit right out to come and warn me. She was so close at my heels that the lantern was her guide across the beach, and afterwards, by the glimmer of it in the trees, she got her line up hill. It was only when I had got to the top or was in the cellar that she wandered Lord knows where! and lost a sight of precious time, afraid to call out lest Case was at the heels of her, and falling in the bush, so that she was all knocked and bruised. That must have been when she got too far to the southward, and how she came to take me in the flank at last and frighten me beyond what I’ve got the words to tell of."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 443
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2491
        "line_end": 2502
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-434"
    "translation_ja": "何があって来たのか、あいつは手短に話してくれた。俺が出ていったすぐあとに、ファアヴァオがやって来たという。その婆さんは、うちからケイスのところへ、出せるかぎりの速さで駆けていくブラック・ジャックに出くわした。ウマは一言も言わず、一瞬もぐずぐずせず、飛び出して俺に知らせに来た。真後ろと言っていいところまで来ていたので、黒い浜を渡るときにはランプが頼りになり、そのあとも木々のあいだのちらつく灯をたよりに登ってきた。俺が頂上に着いたか、穴倉に入ったころになって、あいつはどこをどう迷ったものやら、まったく神さましか知らない。ケイスがすぐ後ろにいるかもしれないと思って、声を上げるのも怖くて、貴重な時間をずいぶん無駄にした。森の中で転んだので、打ち身やあざだらけだった。きっとそのとき南へ行きすぎたんだな。それで最後に俺の横手に出て、俺を口で言えないほど怖がらせることになったわけだ。"
    "translation_status": "reviewed"
  - "id": "beach-435"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Well, anything was better than a devil-woman, but I thought her yarn serious enough. Black Jack had no call to be about my house, unless he was set there to watch; and it looked to me as if my tomfool word about the paint, and perhaps some chatter of Maea’s, had got us all in a clove hitch. One thing was clear: Uma and I were here for the night; we daren’t try to go home before day, and even then it would be safer to strike round up the mountain and come in by the back of the village, or we might walk into an ambuscade. It was plain, too, that the mine should be sprung immediately, or Case might be in time to stop it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 444
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2504
        "line_end": 2512
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-435"
    "translation_ja": "まあ、女の悪魔よりは何だってましだったが、あいつの話は相当まずいと思った。ジャックがうちのあたりに来る用事なんか、見張りに置かれたのでなけりゃあるはずがない。あの塗料のことで俺が漏らしたばかな一言と、ひょっとするとマエアのおしゃべりのせいで、俺たちはみんな結び目に引っかかったように見えた。一つはっきりした。今夜はウマと俺はここにいなけりゃならない。夜が明ける前には、おっかなくて家へ帰れない。明けても山へ大きく回り、村の裏から入るほうが安全だった。さもなくば待ち伏せにまっすぐ飛び込むかもしれん。それに仕掛けは今すぐ爆発させたほうがいい。さもないと、ケイスが間に合って邪魔をするのは目に見えていた。"
    "translation_status": "reviewed"
  - "id": "beach-436"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I marched into the tunnel, Uma keeping tight hold of me, opened my lantern and lit the match. The first length of it burned like a spill of paper, and I stood stupid, watching it burn, and thinking we were going aloft with Tiapolo, which was none of my views. The second took to a better rate, though faster than I cared about; and at that I got my wits again, hauled Uma clear of the passage, blew out and dropped the lantern, and the pair of us groped our way into the bush until I thought it might be safe, and lay down together by a tree."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 445
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2514
        "line_end": 2521
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-436"
    "translation_ja": "ウマが俺にしっかりつかまったまま、俺は坑道に入り、ランプを開いて火縄に火をつけた。はじめの一切れは、火を移す紙のこよりみたいに燃えた。俺は間抜けみたいに立ちつくして、その火を見つめた。ティアポロもろとも吹き上げられると思ったが、そんなつもりはなかったからな。次の一切れに移ると少しはましな燃え方になったが、それでも俺の望むより速い。そこでやっと我に返り、ウマを通路の外へ引っぱり出し、ランプを吹き消して落とした。そして二人で手さぐりで森へ入り、ここなら安全かと思うところまで行って、木のそばに並んで伏せた。"
    "translation_status": "reviewed"
  - "id": "beach-437"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Old lady,” I said, “I won’t forget this night. You’re a trump, and that’s what’s wrong with you.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 446
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2523
        "line_end": 2524
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-437"
    "translation_ja": "「なあ、お前」と俺は言った。「俺は今夜のことを忘れやしない。お前はたいした女だよ。まったく、困るくらいにさ」"
    "translation_status": "reviewed"
  - "id": "beach-438"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She humped herself close up to me. She had run out the way she was, with nothing on her but her kilt; and she was all wet with the dews and the sea on the black beach, and shook straight on with cold and the terror of the dark and the devils."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 447
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2526
        "line_end": 2529
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-438"
    "translation_ja": "あいつは体を丸めて、ぴったり俺に寄り添った。ろくに何も着ず、腰巻き一つで飛び出してきたんだ。夜露と黒い浜の波でずぶ濡れになり、寒いのと暗がりや悪魔が怖いのとで、震えが止まらないでいた。"
    "translation_status": "reviewed"
  - "id": "beach-439"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Too much ’fraid,” was all she said."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 448
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2531
        "line_end": 2531
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-439"
    "translation_ja": "「うんと怖い」。あいつが言ったのは、それだけだった。"
    "translation_status": "reviewed"
  - "id": "beach-440"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The far side of Case’s hill goes down near as steep as a precipice into the next valley. We were on the very edge of it, and I could see the dead wood shine and hear the sea sound far below. I didn’t care about the position, which left me no retreat, but I was afraid to change. Then I saw I had made a worse mistake about the lantern, which I should have left lighted, so that I could have had a crack at Case when he stepped into the shine of it. And even if I hadn’t had the wit to do that, it seemed a senseless thing to leave the good lantern to blow up with the graven images. The thing belonged to me, after all, and was worth money, and might come in handy. If I could have trusted the match, I might have run in still and rescued it. But who was going to trust the match? You know what trade is. The stuff was good enough for Kanakas to go fishing with, where they’ve got to look lively anyway, and the most they risk is only to have their hand blown off. But for anyone that wanted to fool around a blow-up like mine that match was rubbish."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 449
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2533
        "line_end": 2547
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-440"
    "translation_ja": "ケイスの丘の向こう側は、ほとんど断崖みたいな急斜面になって、隣の谷へ落ち込んでいる。俺たちはそのきわにいた。朽ち木の光が見え、ずっと下で海の音がした。逃げ道のないこういう位置は気に入らなかったが、動くのも怖かった。そこで、ランプのことでもっとひどいしくじりをしたと気がついた。つけたままにしておけば、ケイスが明かりの中へ踏み込んだところを撃てたのだ。そこまで知恵が回らなかったにしても、まだ使えるランプをあの彫り物と一緒に吹き飛ばすとは、何とももったいない。何しろ俺の物だし、金を出して買ったのだし、何かの役にも立ちそうだった。火縄が信用できたら、まだ駆けこんで持ち出せたかもしれない。だがあの火縄を誰が信用する？　商売の品物というのは、知ってのとおりさ。カナカ人が漁に使うなら、もともと手早くやるものだし、せいぜい手を吹き飛ばされるくらいだから、あれでも結構だ。だが俺のように派手な爆発のそばでうろうろする者からすれば、あんな火縄は屑だった。"
    "translation_status": "reviewed"
  - "id": "beach-441"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Altogether the best I could do was to lie still, see my shot-gun handy, and wait for the explosion. But it was a solemn kind of a business. The blackness of the night was like solid; the only thing you could see was the nasty bogy glimmer of the dead wood, and that showed you nothing but itself; and as for sounds, I stretched my ears till I thought I could have heard the match burn in the tunnel, and that bush was as silent as a coffin. Now and then there was a bit of a crack; but whether it was near or far, whether it was Case stubbing his toes within a few yards of me, or a tree breaking miles away, I knew no more than the babe unborn."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 450
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2549
        "line_end": 2557
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-441"
    "translation_ja": "結局、俺にできる一番いいことは、動かず伏せて、散弾銃がすぐ取れるのを確かめ、爆発を待つことだった。しかしまあ、愉快なことじゃなかった。夜の闇は、固まっているかと思うほどだ。見えるのは、薄気味悪く化け物じみた朽ち木の光だけで、その光が見せてくれるのも朽ち木だけ。音といえば、耳を澄ますあまり坑道の火縄の燃える音だって聞こえる気がしたが、森は棺みたいに静かだった。ときどき、ぱきっと小さく鳴った。だが近いのか遠いのか、数ヤード先でケイスが足の指をどこかに打ちつけた音なのか、何マイルも先で木が折れた音なのか、生まれる前の赤ん坊ほどにも分からなかった。"
    "translation_status": "reviewed"
  - "id": "beach-442"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And then, all of a sudden, Vesuvius went off. It was a long time coming; but when it came (though I say it that shouldn’t) no man could ask to see a better. At first it was just a son of a gun of a row, and a spout of fire, and the wood lighted up so that you could see to read. And then the trouble began. Uma and I were half buried under a wagonful of earth, and glad it was no worse, for one of the rocks at the entrance of the tunnel was fired clean into the air, fell within a couple of fathoms of where we lay, and bounded over the edge of the hill, and went pounding down into the next valley. I saw I had rather undercalculated our distance, or over-done the dynamite and powder, which you please."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 451
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2559
        "line_end": 2568
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-442"
    "translation_ja": "そのとき、出し抜けにヴェスヴィオ火山が噴火した。ずいぶん待たされたが、いざとなれば、手前味噌で悪いけど、これ以上の見ものを望むやつはいなかったろう。はじめは、とてつもない轟音がして、火が噴き上がり、本が読めるほど森が明るくなっただけだ。厄介はそこからだった。ウマと俺は荷馬車一台分もある土に半ば埋まり、それだけで済んでよかったと思った。坑道の入り口にあった岩の一つが、もろに空中へ打ち上がり、俺たちのいた場所から二尋ばかりのところに落ち、丘の縁を跳び越して、隣の谷へごろごろと落ちていったのだ。少し距離の見積もりが甘かったか、ダイナマイトと火薬を奮発しすぎたか、どっちに取ってくれてもいい。"
    "translation_status": "reviewed"
  - "id": "beach-443"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And presently I saw I had made another slip. The noise of the thing began to die off, shaking the island; the dazzle was over; and yet the night didn’t come back the way I expected. For the whole wood was scattered with red coals and brands from the explosion; they were all round me on the flat; some had fallen below in the valley, and some stuck and flared in the tree-tops. I had no fear of fire, for these forests are too wet to kindle. But the trouble was that the place was all lit up-not very bright, but good enough to get a shot by; and the way the coals were scattered, it was just as likely Case might have the advantage as myself. I looked all round for his white face, you may be sure; but there was not a sign of him. As for Uma, the life seemed to have been knocked right out of her by the bang and blaze of it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 452
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2570
        "line_end": 2581
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-443"
    "translation_ja": "ほどなく、俺はもう一つしくじったことに気づいた。島を揺るがしたあの音はおさまりかけ、目もくらむ光も終わったのに、思っていたようには闇が戻らなかった。爆発で飛び散った真っ赤な熾火や燃えさしが、森じゅうに散らばっていたのだ。平らなところでは俺の周りにいくらもあるし、谷底に落ちたものも、梢に引っかかって炎を上げるものもあった。この森は火がつくには湿りすぎているから、山火事は心配していなかった。厄介なのは、あたり一面が照らされていることだ。たいして明るくはないが、狙って撃てるだけの明かりはある。熾火の散らばりようを見ると、むしろケイスのほうに分があってもちっともおかしくない。もちろんやつの白い顔はないかとあたりを見まわしたが、影も形もなかった。ウマといえば、あの轟音と閃光に、生気をすっかり叩き出されてしまったようだった。"
    "translation_status": "reviewed"
  - "id": "beach-444"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was one bad point in my game. One of the blessed graven images had come down all afire, hair and clothes and body, not four yards away from me. I cast a mighty noticing glance all round; there was still no Case, and I made up my mind I must get rid of that burning stick before he came, or I should be shot there like a dog."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 453
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2583
        "line_end": 2587
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-444"
    "translation_ja": "俺にとってまずいことが一つあった。あの忌々しい彫り物の一つが、髪も着物も胴体も火のついたまま、四ヤードと離れていないところに落ちていた。目を皿にしてあたりを見たが、まだケイスはいない。あの燃えた棒きれはやつが来る前に始末しなきゃ、俺はここで犬みたいに撃ち殺されるぞ、と思った。"
    "translation_status": "reviewed"
  - "id": "beach-445"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was my first idea to have crawled, and then I thought speed was the main thing, and stood half up to make a rush. The same moment from somewhere between me and the sea there came a flash and a report, and a rifle bullet screeched in my ear. I swung straight round and up with my gun, but the brute had a Winchester, and before I could as much as see him his second shot knocked me over like a nine-pin. I seemed to fly in the air, then came down by the run and lay half a minute, silly; and then I found my hands empty, and my gun had flown over my head as I fell. It makes a man mighty wide awake to be in the kind of box that I was in. I scarcely knew where I was hurt, or whether I was hurt or not, but turned right over on my face to crawl after my weapon. Unless you have tried to get about with a smashed leg you don’t know what pain is, and I let out a howl like a bullock’s."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 454
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2589
        "line_end": 2601
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-445"
    "translation_ja": "はじめは腹ばいで行くつもりだったが、速さがものをいうと思い直し、ひとっ走りしようと半分身を起こした。その瞬間、俺と海のあいだのどこかで閃光と銃声がして、ライフルの弾が耳のそばをかすめ、金切り声を上げた。俺はくるっと向き直って銃を構えたが、あの野郎はウィンチェスターを持っていた。姿が目に入るより早く、二発目で九柱戯のピンみたいに吹っ倒された。宙に飛んだような気がして、次にはまっさかさまに落ち、三十秒ばかり、頭がぼうっとしたまま横たわった。それから両手に何もないと気がついた。倒れたとき、銃は俺の頭を飛び越していったのだ。俺みたいな窮地に陥ると、いやでも目が冴える。どこをやられたか、そもそもやられたかどうかもよく分からなかったが、うつぶせにひっくり返り、武器を取りに這おうとした。脚をぐしゃぐしゃにやられて動いたことがなけりゃ、本当の痛みなんか分からんよ。俺は雄牛みたいな声で吠えた。"
    "translation_status": "reviewed"
  - "id": "beach-446"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This was the unluckiest noise that ever I made in my life. Up to then Uma had stuck to her tree like a sensible woman, knowing she would be only in the way; but as soon as she heard me sing out, she ran forward. The Winchester cracked again, and down she went."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 455
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2603
        "line_end": 2606
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-446"
    "translation_ja": "生まれてこのかた、あれほど間の悪い声を出したことはない。それまでウマは、分別のある女で、出ていっても邪魔にしかならないと知って、木から離れなかった。それが俺の叫びを聞くなり飛び出した。ウィンチェスターがまた一発鳴り、あいつはばったり倒れた。"
    "translation_status": "reviewed"
  - "id": "beach-447"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had sat up, leg and all, to stop her; but when I saw her tumble I clapped down again where I was, lay still, and felt the handle of my knife. I had been scurried and put out before. No more of that for me. He had knocked over my girl, I had got to fix him for it; and I lay there and gritted my teeth, and footed up the chances. My leg was broke, my gun was gone. Case had still ten shots in his Winchester. It looked a kind of hopeless business. But I never despaired nor thought upon despairing: that man had got to go."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 456
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2608
        "line_end": 2615
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-447"
    "translation_ja": "俺はあいつを止めようと、折れた脚もかまわず起き上がったが、転ぶのを見るや、その場にばたりと伏せ直し、じっとしてナイフの柄をまさぐった。さっきまでは慌てたり取り乱したりもしていた。もうそんなまねは御免だ。やつは俺の女を倒した。その落とし前はつけなきゃならん。俺はそこで歯を食いしばり、勝ち目を勘定した。脚は折れた、銃は失くした。ケイスのウィンチェスターには、まだ十発残っている。どうにも望みの薄い話だった。だが絶望なんかしなかったし、しようとも思わなかった。あの男を生かしちゃおけなかった。"
    "translation_status": "reviewed"
  - "id": "beach-448"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For a goodish bit not one of us let on. Then I heard Case begin to move nearer in the bush, but mighty careful. The image had burned out; there were only a few coals left here and there, and the wood was main dark, but had a kind of a low glow in it like a fire on its last legs. It was by this that I made out Case’s head looking at me over a big tuft of ferns, and at the same time the brute saw me and shouldered his Winchester. I lay quite still, and as good as looked into the barrel: it was my last chance, but I thought my heart would have come right out of its bearings. Then he fired. Lucky for me it was no shot-gun, for the bullet struck within an inch of me and knocked the dirt in my eyes."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 457
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2617
        "line_end": 2626
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-448"
    "translation_ja": "しばらくは三人とも物音ひとつ立てなかった。やがて、森の中でケイスが近づいてくる音が聞こえた。いやに用心深かった。彫り物は燃え尽き、あとはところどころに熾火が少し残るだけ。森はひどく暗かったが、消えかけた焚き火のようなかすかな明かりがあった。その明かりで、大きなシダの茂み越しに俺を見るケイスの頭が見えた。と同時にやつも俺に気づいて、ウィンチェスターを肩に当てた。俺は身じろぎもせず、ほとんど銃口をのぞき込む格好だった。あとがないと分かっちゃいたが、心臓が土台ごと飛び出しそうだったよ。そこでやつが撃った。幸い散弾銃じゃなかった。弾は俺の一インチと離れないところに当たり、はねた土が目に入った。"
    "translation_status": "reviewed"
  - "id": "beach-449"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Just you try and see if you can lie quiet, and let a man take a sitting shot at you and miss you by a hair. But I did, and lucky too. A while Case stood with the Winchester at the port-arms; then he gave a little laugh to himself, and stepped round the ferns."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 458
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2628
        "line_end": 2631
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-449"
    "translation_ja": "じっと寝ころんだまま、相手に楽々と狙いをつけさせて、紙一重で外れるに任せていられるか、試してみるといい。俺はそうしたし、運もあった。ケイスはしばらくウィンチェスターを胸の前に斜めに持って立っていたが、やがて一人でくすっと笑い、シダの茂みを回り込んできた。"
    "translation_status": "reviewed"
  - "id": "beach-450"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Laugh!” thought I. “If you had the wit of a louse you would be praying!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 459
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2633
        "line_end": 2634
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-450"
    "translation_ja": "「笑ってろ！」と俺は思った。「シラミほどの分別でもありゃ、いまごろ祈りを唱えてるところだぞ！」"
    "translation_status": "reviewed"
  - "id": "beach-451"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was all as taut as a ship’s hawser or the spring of a watch, and as soon as he came within reach of me I had him by the ankle, plucked the feet right out from under him, laid him out, and was upon the top of him, broken leg and all, before he breathed. His Winchester had gone the same road as my shot-gun; it was nothing to me—I defied him now. I’m a pretty strong man anyway, but I never knew what strength was till I got hold of Case. He was knocked out of time by the rattle he came down with, and threw up his hands together, more like a frightened woman, so that I caught both of them with my left. This wakened him up, and he fastened his teeth in my forearm like a weasel. Much I cared. My leg gave me all the pain I had any use for, and I drew my knife and got it in the place."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 460
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2636
        "line_end": 2646
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-451"
    "translation_ja": "俺は船の引き綱か時計のぜんまいみたいに張りつめていた。やつが手の届くところに来たとたん、足首をつかみ、両足をすぱっとすくって、仰向けに倒した。やつが息をつく暇もなく、脚が折れたままその上に馬乗りになった。ウィンチェスターは俺の散弾銃と同じようにすっ飛んでいった。もうこっちの知ったことじゃない。これで何をしてこようが怖くはなかった。もともと俺は力のあるほうだが、自分の力がどれだけのものか、ケイスを捕まえるまで知らなかったね。やつはどしんと落ちた拍子に気を取られ、びっくりした女みたいに両手を一度に上げたので、俺は左手で両方とも押さえた。そこで我に返ったらしく、イタチみたいに俺の腕に歯を食い込ませた。へっ、知ったことか。脚だけで痛みは間に合っていた。俺はナイフを抜き、ここぞというところへ当てた。"
    "translation_status": "reviewed"
  - "id": "beach-452"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Now,” said I, “I’ve got you; and you’re gone up, and a good job too! Do you feel the point of that? That’s for Underhill! And there’s for Adams! And now here’s for Uma, and that’s going to knock your blooming soul right out of you!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 461
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2648
        "line_end": 2651
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-452"
    "translation_ja": "「さて」と俺は言った。「お前をつかまえた。もうおしまいだ。せいせいするぜ！　切っ先が分かるか？　それはアンダーヒルの分だ！　これはアダムズの分！　次はウマの分だ、こいつで、てめえの腐った魂を叩き出してやる！」"
    "translation_status": "reviewed"
  - "id": "beach-453"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that I gave him the cold steel for all I was worth. His body kicked under me like a spring sofa; he gave a dreadful kind of a long moan, and lay still."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 462
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2653
        "line_end": 2655
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-453"
    "translation_ja": "そう言って俺は、ありったけの力で刃を突き立てた。やつの体がばね入りの長椅子みたいに俺の下ではねた。ぞっとするほど長いうめき声を一つ上げ、そのまま動かなくなった。"
    "translation_status": "reviewed"
  - "id": "beach-454"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I wonder if you’re dead? I hope so!” I thought, for my head was swimming. But I wasn’t going to take chances; I had his own example too close before me for that; and I tried to draw the knife out to give it him again. The blood came over my hands, I remember, hot as tea; and with that I fainted clean away, and fell with my head on the man’s mouth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 463
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2657
        "line_end": 2661
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-454"
    "translation_ja": "「死んだか？　死んでりゃいいが！」と俺は思った。頭がぐるぐる回っていた。だが運任せにはできなかった。やつ自身のやり方が、さっき目と鼻の先でその見本を見せたばかりだったからだ。もう一度突き立てようと、ナイフを抜きにかかった。覚えているのは、手にかかった血がお茶みたいに熱かったことだ。そこで完全に気を失い、頭がやつの口に乗る格好で倒れた。"
    "translation_status": "reviewed"
  - "id": "beach-455"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When I came to myself it was pitch dark; the cinders had burned out; there was nothing to be seen but the shine of the dead wood, and I couldn’t remember where I was nor why I was in such pain nor what I was all wetted with. Then it came back, and the first thing I attended to was to give him the knife again a half-a-dozen times up to the handle. I believe he was dead already, but it did him no harm and did me good."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 464
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2663
        "line_end": 2668
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-455"
    "translation_ja": "気がついたときは真っ暗だった。熾火は燃え尽き、朽ち木の光しか見えない。自分がどこにいるのか、どうしてこんなに痛むのか、何でずぶ濡れなのかも思い出せない。やがて何もかも戻ってきて、まずやったのは、今一度ナイフを柄まで、六度ばかり突き立てることだった。やつはとっくに死んでいたと思うが、それでやつが困るわけじゃなし、俺の気は済んだ。"
    "translation_status": "reviewed"
  - "id": "beach-456"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I bet you’re dead now,” I said, and then I called to Uma."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 465
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2670
        "line_end": 2670
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-456"
    "translation_ja": "「今度こそ死んだに決まってる」と俺は言い、それからウマを呼んだ。"
    "translation_status": "reviewed"
  - "id": "beach-457"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Nothing answered, and I made a move to go and grope for her, fouled my broken leg, and fainted again."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 466
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2672
        "line_end": 2673
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-457"
    "translation_ja": "何の返事もなかった。手さぐりで捜しに行こうと身を動かし、折れた脚を引っかけて、また気を失った。"
    "translation_status": "reviewed"
  - "id": "beach-458"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When I came to myself the second time the clouds had all cleared away, except a few that sailed there, white as cotton. The moon was up—a tropic moon. The moon at home turns a wood black, but even this old butt-end of a one showed up that forest, as green as by day. The night birds—or, rather, they’re a kind of early morning bird—sang out with their long, falling notes like nightingales. And I could see the dead man, that I was still half resting on, looking right up into the sky with his open eyes, no paler than when he was alive; and a little way off Uma tumbled on her side. I got over to her the best way I was able, and when I got there she was broad awake, and crying and sobbing to herself with no more noise than an insect. It appears she was afraid to cry out loud, because of the aitus. Altogether she was not much hurt, but scared beyond belief; she had come to her senses a long while ago, cried out to me, heard nothing in reply, made out we were both dead, and had lain there ever since, afraid to budge a finger. The ball had ploughed up her shoulder, and she had lost a main quantity of blood; but I soon had that tied up the way it ought to be with the tail of my shirt and a scarf I had on, got her head on my sound knee and my back against a trunk, and settled down to wait for morning. Uma was for neither use nor ornament, and could only clutch hold of me and shake and cry. I don’t suppose there was ever anybody worse scared, and, to do her justice, she had had a lively night of it. As for me, I was in a good bit of pain and fever, but not so bad when I sat still; and every time I looked over to Case I could have sung and whistled. Talk about meat and drink! To see that man lying there dead as a herring filled me full."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 467
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2675
        "line_end": 2699
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-458"
    "translation_ja": "二度目に気がついたとき、雲はすっかり晴れ、綿みたいに白いのがいくつか浮かんでいるだけだった。月が昇っていた。南国の月だ。故郷じゃ月が出ても森は真っ黒なのに、ここのは欠け残ったわずかばかりの古い月でさえ、森を昼間のような緑色に見せた。夜の鳥が、いや、どちらかといえば夜明け前の鳥だが、夜鳴きウグイスのように、長く尾を引いて下がる声で鳴いた。まだ俺が半分寄りかかっていた死人は、目を見開いて真上の空を仰いでいた。顔は、生きていたときより青ざめてさえいなかった。少し離れて、ウマが横倒しになっていた。なんとかそこまで近づいてみると、あいつはすっかり目が覚めていて、虫の鳴き声にもならないほどかすかな声で、一人泣きじゃくっていた。アイトゥが怖くて声を上げられなかったらしい。傷そのものは大したことはなかったが、信じられんほどおびえていた。ずっと前に意識を取り戻し、俺を呼んでも返事がないので、俺もケイスも死んだと思い込み、それっきり指一本動かせずに横たわっていた。弾は肩の肉をえぐり、ずいぶん血を流していたが、俺はシャツの裾と首に巻いていた布を使って、じきに傷をきちんと縛ってやった。けがをしていないほうの膝にあいつの頭を乗せ、俺の背中は木の幹に預け、落ち着いて朝を待つことにした。ウマは何をする力もなく、ただ俺にしがみつき、震えて泣くばかりだった。あれほど怖い思いをした人間はそういないだろうし、公平に言って、ひどい目に遭った夜だったからな。俺のほうはけっこう痛んで熱もあったが、じっと座っていればそれほどじゃない。それにケイスのほうを見れば、そのたび歌でも口笛でも出そうだった。飲み食いが何だって？　あの男が干物みたいに死んで転がっているのを見ただけで、俺は腹いっぱいだったね。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":

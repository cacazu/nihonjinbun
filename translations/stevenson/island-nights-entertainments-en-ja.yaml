        "line_end": 1489
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-272"
    "translation_ja": "せっかくすべてうまくいってるところで、つい神の名を口にして、ちょっと面食らった。宣教師もそうだろうが、窓の外を見たふりをして、俺たちに礼を言った。"
    "translation_status": "reviewed"
  - "id": "beach-273"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So we ran him up a bit of a meal. I was bound to let the old lady have a hand in it, to show off, so I deputised her to brew the tea. I don’t think I ever met such tea as she turned out. But that was not the worst, for she got round with the salt-box, which she considered an extra European touch, and turned my stew into sea-water. Altogether, Mr. Tarleton had a devil of a dinner of it; but he had plenty entertainment by the way, for all the while that we were cooking, and afterwards, when he was making believe to eat, I kept posting him up on Master Case and the beach of Falesá, and he putting questions that showed he was following close."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 282
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1491
        "line_end": 1500
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-273"
    "translation_ja": "そこでありあわせの食事を手早くこしらえた。かみさんにも出る幕があって、ちょっと腕を見せられるようにと、茶をいれてもらった。あんな茶を飲んだのは後にも先にもなかったと思う。だがひどいのはそればかりじゃない。塩入れを持って回り込んできた。いっそうヨーロッパ風になると思ったんだろう。俺の煮込みを海水に変えちまった。結局、タールトンさんはひどい昼飯にありついた。だが、退屈だけはしなかったろう。支度しているあいだじゅう、それから彼が食べるふりをしているあいだも、俺はケイス様とファレサーの浜の一件をたっぷり聞かせ、彼もよく話を追っているのがわかるような質問をしてくれた。"
    "translation_status": "reviewed"
  - "id": "beach-274"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” said he at last, “I am afraid you have a dangerous enemy. This man Case is very clever and seems really wicked. I must tell you I have had my eye on him for nearly a year, and have rather had the worst of our encounters. About the time when the last representative of your firm ran so suddenly away, I had a letter from Namu, the native pastor, begging me to come to Falesá at my earliest convenience, as his flock were all ‘adopting Catholic practices.’ I had great confidence in Namu; I fear it only shows how easily we are deceived. No one could hear him preach and not be persuaded he was a man of extraordinary parts. All our islanders easily acquire a kind of eloquence, and can roll out and illustrate, with a great deal of vigour and fancy, second-hand sermons; but Namu’s sermons are his own, and I cannot deny that I have found them means of grace. Moreover, he has a keen curiosity in secular things, does not fear work, is clever at carpentering, and has made himself so much respected among the neighbouring pastors that we call him, in a jest which is half serious, the Bishop of the East. In short, I was proud of the man; all the more puzzled by his letter, and took an occasion to come this way. The morning before my arrival, Vigours had been sent on board the Lion, and Namu was perfectly at his ease, apparently ashamed of his letter, and quite unwilling to explain it. This, of course, I could not allow, and he ended by confessing that he had been much concerned to find his people using the sign of the cross, but since he had learned the explanation his mind was satisfied. For Vigours had the Evil Eye, a common thing in a country of Europe called Italy, where men were often struck dead by that kind of devil, and it appeared the sign of the cross was a charm against its power."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 283
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1502
        "line_end": 1527
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-274"
    "translation_ja": "「さて」と、彼はとうとう口を開いた。「危険な敵をお持ちのようですね。ケイスという男はたいへん頭が切れ、しかも本当に邪悪なようです。私はもう一年近くあの男に目をつけているのですが、やり合うたびにどうもこちらが一本取られてきました。おたくの前任の方があれほど急に逃げ出した頃、島の牧師のナムから手紙をもらいました。信徒がみな『カトリックの作法を真似るようになった』ので、できるだけ早くファレサーへ来てくれというものです。私はナムを深く信頼していました。それだけ人はたやすくだまされるということでしょう。彼の説教を聞けば、並外れた才の持ち主だと誰でも納得します。島の信徒たちはすぐに一種の雄弁さを身につけ、人から借りた説教でも、ありありとたとえを交え、勢いよく語れます。ですがナムの説教は彼自身のものですし、私もそこから神の恵みを受けたことは否めません。世俗のことにも強い好奇心があり、骨惜しみをせず、大工仕事の腕もいい。近隣の牧師から深く敬われていて、私たちは半ば冗談、半ば本気で、彼を東の司教と呼んでいるほどです。要するに私は彼を誇りに思っていた。それだけに手紙が腑に落ちず、機会を見つけてこのあたりへ来ました。私が着く前の朝、ヴィガーズさんは〈ライオン〉号に乗せられていました。ナムはすっかり落ち着き、手紙を出したことを恥じている様子で、説明したがりません。もちろん私はそれでは承知できませんから、しまいにはこう打ち明けました。信徒たちが十字を切るのを見て心配していたが、わけを聞いたので安心した、というのです。ヴィガーズさんには邪眼があったからだそうです。ヨーロッパのイタリアという国にはよくあることで、その手の悪魔に急に命を取られることも多いが、十字を切れば、その力を防ぐまじないになるのだと。"
    "translation_status": "reviewed"

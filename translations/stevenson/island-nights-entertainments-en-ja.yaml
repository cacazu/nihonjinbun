    "translation_ja": "海岸を六マイルばかり行くと、ファンガ・アナアナ、「洞穴だらけの船だまり」と呼ばれる風よけの入り江がある。俺も、うちの漕ぎ手たちが進んでくれるぎりぎりまで寄って、海から見たことがある。細長い黄色い砂浜だ。その上にせり出す黒い崖には、洞穴が黒々と口を開けている。崖より上からまた大木が張り出して、つるを垂らしている。その真ん中あたりでは、大きな沢が滝になって落ちる。さて、ここを通りかかった舟に、ファレサーの若者が六人乗っていた。ウマに言わせると「みんな、とてもきれい」で、それで身を滅ぼしたのだという。風が強く、行く手から来る波も高く、岬を抜けてファンガ・アナアナの白い滝と木陰の浜が見える頃には、皆くたびれて喉が渇き、飲み水も尽きていた。一人が上陸して水を飲もうと言った。向こう見ずな連中で、いちばん若い一人を除いて皆賛成だった。ロトゥというのがその若者の名で、まことに行いのよい、しっかりした若者だった。正気じゃないぞ、と一人で反対した。そこは精霊と悪魔と死者の領分だ、生きた者は片方へ六マイル、反対へはおそらく十二マイルも行かなきゃいない、と言った。だが皆は聞いて笑い、五対一だから、漕ぎ入れて舟を浜に引き上げ、上陸した。ロトゥの話では、まったく居心地のいい所で、水もうまかったそうだ。浜を歩き回っても崖を登れそうな所はどこにもなく、皆いくらか気が楽になって、しまいには車座に座り、持ってきた食い物を食べることにした。腰を下ろすか下ろさないかのうちに、黒い洞穴の一つから、見たこともないような美女が六人出てきた。髪には花、胸は見事に美しく、首には真っ赤な種をつないだ飾りをかけていた。女たちが若者に冗談を言いかけ、若者も冗談で返した。ロトゥだけは別だ。こんな所に生きた女がいるわけがないと気づき、走って、舟底に身を投げ出し、顔を覆って祈った。この一件が続いたあいだ、ロトゥは途切れもなく祈りつづけ、仲間が戻ってきて体を起こさせるまで、ほかのことは何も知らなかった。舟はまた入り江から沖へ出た。入り江には今や誰もおらず、六人の女は影も形もない。だがロトゥがいちばん恐ろしかったのは、五人のうち一人としてさっきのことを覚えていないことだった。皆酔っぱらいみたいに、舟の中で歌い、笑い、ふざけ回った。風は強まって突風を伴い、海は並外れて荒れた。島の男なら誰だって、そんな天気には背を向けてファレサーの家に逃げ帰る。だがその五人は狂ったように帆をいっぱいに張り、波の中へ舟を突っ込ませた。ロトゥは水をかき出しにかかった。ほかの者は誰も手伝おうとせず、歌ってはしゃいで騒ぎ立て、人にはわからん妙なことを口走っては大声で笑った。それでその日の残りを、ロトゥは舟底で命からがら水をかき出して過ごした。汗と冷たい海水でびしょ濡れだったのに、誰も気にとめなかった。およそ無理だと思われたが、ひどい嵐のなかを一行は無事パパ・マルルに着いた。椰子はごうごう鳴り、実が大砲の弾さながら村の広場を飛び交っていた。その晩のうちに五人の若者は病に倒れ、まともな言葉を一つとして口にしないまま死んだ。"
    "translation_status": "reviewed"

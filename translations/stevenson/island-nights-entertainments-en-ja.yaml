  - "id": "beach-057"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A nice paper to put in a girl’s hand and see her hide away like gold. A man might easily feel cheap for less. But it was the practice in these parts, and (as I told myself) not the least the fault of us white men, but of the missionaries. If they had let the natives be, I had never needed this deception, but taken all the wives I wished, and left them when I pleased, with a clear conscience."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 66
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 396
        "line_end": 401
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-057"
    "translation_ja": "えらく立派な紙切れを娘に渡し、金貨でもしまうように大切に隠すのを見届けたものだ。これよりましなことでも、男は十分自分が卑しく感じられる。だがこのあたりじゃそれが習わしで、俺たち白人はこれっぽっちも悪くない、悪いのは宣教師だ、と俺は自分に言い聞かせた。やつらが島の衆をそっとしといてくれたなら、俺だってこんな騙しは要らず、欲しいだけ女房を取り、好きな時に別れても、良心に疚しいところなんぞなかったのだ。"
    "translation_status": "reviewed"
  - "id": "beach-058"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The more ashamed I was, the more hurry I was in to be gone; and our desires thus jumping together, I made the less remark of a change in the traders. Case had been all eagerness to keep me; now, as though he had attained a purpose, he seemed all eagerness to have me go. Uma, he said, could show me to my house, and the three bade us farewell indoors."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 67
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 403
        "line_end": 407
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-058"
    "translation_ja": "恥ずかしければ恥ずかしいほど早く立ち去りたくなった。俺の望みと先方の望みがぴたりと合ったので、商人たちの様子が変わったことにもそれほど注意を払わなかった。さっきまでケイスは俺を引き留めるのに躍起だったのに、今はまるで目的を果たしでもしたように、追い立てるのに躍起らしかった。ウマが俺の家へ案内できるそうで、三人は部屋の中で俺たちに別れを告げた。"
    "translation_status": "reviewed"
  - "id": "beach-059"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The night was nearly come; the village smelt of trees and flowers and the sea and bread-fruit-cooking; there came a fine roll of sea from the reef, and from a distance, among the woods and houses, many pretty sounds of men and children. It did me good to breathe free air; it did me good to be done with the captain and see, instead, the creature at my side. I felt for all the world as though she were some girl at home in the Old Country, and, forgetting myself for the minute, took her hand to walk with. Her fingers nestled into mine, I heard her breathe deep and quick, and all at once she caught my hand to her face and pressed it there. “You good!” she cried, and ran ahead of me, and stopped and looked back and smiled, and ran ahead of me again, thus guiding me through the edge of the bush, and by a quiet way to my own house."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 68
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 409
        "line_end": 420
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-059"
    "translation_ja": "もうじき夜だった。村には木と花と海と、料理中のパンの実の匂いがしていた。礁から気持ちよく波の轟きが流れ、離れた木立や家の間から、大人や子供の楽しげな物音がいくつも聞こえてきた。外の空気を思いきり吸えてほっとした。船長から解放され、代わりにわきのこの娘を見られてほっとした。まるで故郷の国の娘と一緒にいる気がして、俺は一瞬我を忘れ、手を取って歩いた。その指が俺の指の間にすり寄った。深く速い息遣いが聞こえた。と、いきなり俺の手を自分の顔に引き寄せ、ぴったり当てた。「あなた、いい人！」と叫び、俺の先へ駆けては立ち止まり、こちらを振り返って笑ってはまた先へ駆けた。そうやって藪のはずれを抜け、静かな道を通って俺の家まで案内してくれた。"
    "translation_status": "reviewed"
  - "id": "beach-060"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The truth is, Case had done the courting for me in style—told her I was mad to have her, and cared nothing for the consequence; and the poor soul, knowing that which I was still ignorant of, believed it, every word, and had her head nigh turned with vanity and gratitude. Now, of all this I had no guess; I was one of those most opposed to any nonsense about native women, having seen so many whites eaten up by their wives’ relatives, and made fools of in the bargain; and I told myself I must make a stand at once, and bring her to her bearings. But she looked so quaint and pretty as she ran away and then awaited me, and the thing was done so like a child or a kind dog, that the best I could do was just to follow her whenever she went on, to listen for the fall of her bare feet, and to watch in the dusk for the shining of her body. And there was another thought came in my head. She played kitten with me now when we were alone; but in the house she had carried it the way a countess might, so proud and humble. And what with her dress—for all there was so little of it, and that native enough—what with her fine tapa and fine scents, and her red flowers and seeds, that were quite as bright as jewels, only larger—it came over me she was a kind of countess really, dressed to hear great singers at a concert, and no even mate for a poor trader like myself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 69
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 422
        "line_end": 441
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-060"
    "translation_ja": "じつのところ、ケイスは俺に代わってえらく派手に口説いたのだ。俺はあの子が欲しくてたまらず、そのためならどんな目に遭おうと構わない、と。かわいそうに、あの子は俺がまだ知らないことを知っていたので、ひと言残らず真に受けて、誇らしさとありがたさとでほとんど夢中になっていた。ところが俺には察しもつかなかった。俺は島の女にかかずらう愚行には人一倍反対の男だった。女房の親類に食い尽くされた挙げ句、いい笑いものにされた白人をさんざん見てきたからだ。ここはひとつ初手から毅然として、あの子に立場をわきまえさせなくちゃ、と自分に言い聞かせた。だが駆け出しては俺を待っている姿が、なんとも風変わりでかわいらしく、まるで子供か人懐っこい犬のようで、俺にできたことといえば、進めばあとからついていき、裸足の足音に耳を澄まし、夕闇に光るその体を目で追うだけだった。もう一つ、ふと頭に浮かんだ。今では二人きりなものだから俺に子猫みたいにじゃれつくが、あの家では伯爵夫人でもこうだろうと思わせる、それほど誇り高く慎ましやかな態度だった。衣装だって、量はいかにも僅かでまったくの土地風だが、見事なタパ布、上等な香り、紅い花、宝石に劣らず輝き、しかも宝石より大粒の木の実、そういうのを思い合わせると、じつは一種の伯爵夫人で、音楽会で名歌手を聴く正装をしており、俺みたいな貧乏商人とは釣り合いが取れない気がしてきた。"
    "translation_status": "reviewed"
  - "id": "beach-061"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She was the first in the house; and while I was still without I saw a match flash and the lamplight kindle in the windows. The station was a wonderful fine place, coral built, with quite a wide verandah, and the main room high and wide. My chests and cases had been piled in, and made rather of a mess; and there, in the thick of the confusion, stood Uma by the table, awaiting me. Her shadow went all the way up behind her into the hollow of the iron roof; she stood against it bright, the lamplight shining on her skin. I stopped in the door, and she looked at me, not speaking, with eyes that were eager and yet daunted; then she touched herself on the bosom."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 70
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 443
        "line_end": 452
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-061"
    "translation_ja": "先に家に入ったのはウマだった。俺がまだ外にいるうちにマッチが光り、窓にランプの灯がともるのが見えた。商館はべらぼうに立派で、珊瑚造りにかなり広い縁廊、主室は天井が高くて広々としていた。俺の行李や荷箱が運び込まれ、山積みで、いささか乱雑だった。その混乱のまん中、卓のそばにウマが立って俺を待っていた。影は背後にすうっと伸びて鉄板屋根の裏のくぼみにまで達し、それを背に、ランプに照らされた肌が明るく際立っていた。俺は戸口で立ち止まった。ウマは期待とおじけの入りまじった目で、物も言わず俺を見た。それから自分の胸に手をやった。"
    "translation_status": "reviewed"
  - "id": "beach-062"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Me—your wifie,” she said. It had never taken me like that before; but the want of her took and shook all through me, like the wind in the luff of a sail."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 71
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 454
        "line_end": 456
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-062"
    "translation_ja": "「わたし、あなたのお嫁さん」と言った。それまでこんな目に遭ったことはない。ウマが欲しいという思いが俺を捉え、帆の風上の縁に風が当たるように、体のすみずみまで震わせた。"
    "translation_status": "reviewed"
  - "id": "beach-063"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I could not speak if I had wanted; and if I could, I would not. I was ashamed to be so much moved about a native, ashamed of the marriage too, and the certificate she had treasured in her kilt; and I turned aside and made believe to rummage among my cases. The first thing I lighted on was a case of gin, the only one that I had brought; and, partly for the girl’s sake, and partly for horror of the recollections of old Randall, took a sudden resolve. I prized the lid off. One by one I drew the bottles with a pocket corkscrew, and sent Uma out to pour the stuff from the verandah."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 72
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 458
        "line_end": 466
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-063"
    "translation_ja": "しゃべりたくても口はきけなかったろうし、きけたとしてもきかなかったろう。島の娘一人にこれほど心を動かされたのが恥ずかしい。あの婚礼も、ウマが腰布に大事にしまった証書も恥ずかしい。俺は横を向き、荷箱をあさるふりをした。まっさきにぶつかったのは唯一持ってきたジンの木箱だった。半分は娘を思って、半分はランドル老人の恐ろしい記憶から、俺は突然決心を固めた。蓋をこじ開けた。ポケットのコルク抜きで一本一本栓を抜いては、ウマに持たせて縁廊から中身をあけさせた。"
    "translation_status": "reviewed"
  - "id": "beach-064"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She came back after the last, and looked at me puzzled like."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 73
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 468
        "line_end": 468
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-064"
    "translation_ja": "最後の一本を捨てて戻ると、ウマは不思議そうに俺を見た。"
    "translation_status": "reviewed"
  - "id": "beach-065"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No good,” said I, for I was now a little better master of my tongue. “Man he drink, he no good.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 74
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 470
        "line_end": 471
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-065"
    "translation_ja": "「よくない」と俺は言った。もう少し舌が言うことをきくようになっていた。「男、酒飲む、よくない」"
    "translation_status": "reviewed"
  - "id": "beach-066"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She agreed with this, but kept considering. “Why you bring him?” she asked presently. “Suppose you no want drink, you no bring him, I think.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 75
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 473
        "line_end": 474
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-066"
    "translation_ja": "ウマもそれにはうなずいたが、まだ考え込んでいた。「なんで持って来た？」とやがて尋ねた。「飲みたくない、持ってこない、わたしそう思う」"
    "translation_status": "reviewed"
  - "id": "beach-067"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s all right,” said I. “One time I want drink too much; now no want. You see, I no savvy I get one little wifie. Suppose I drink gin, my little wifie he ’fraid.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 76
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 476
        "line_end": 478
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-067"
    "translation_ja": "「そうなんだ」と俺は言った。「前は酒飲みたい、うんと飲みたい。今いらない。ほら、俺、小さいお嫁さんもらうこと、知らなかった。俺ジン飲んだら、小さいお嫁さんこわがる」"
    "translation_status": "reviewed"
  - "id": "beach-068"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To speak to her kindly was about more than I was fit for; I had made my vow I would never let on to weakness with a native, and I had nothing for it but to stop."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 77
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 480
        "line_end": 482
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-068"
    "translation_ja": "あの子に優しく口をきくのは、これ以上はとても俺の柄ではなかった。島の娘にだらしないところは決して見せまいと誓いを立てていたので、そこで口をつぐむしかなかった。"
    "translation_status": "reviewed"
  - "id": "beach-069"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She stood looking gravely down at me where I sat by the open case. “I think you good man,” she said. And suddenly she had fallen before me on the floor. “I belong you all-e-same pig!” she cried."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 78
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 484
        "line_end": 486
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-069"
    "translation_ja": "ウマは開けた箱のそばに腰を下ろした俺を、まじめな顔で立って見下ろした。「あなた、いい人だと思う」と言った。いきなり俺の前にひれ伏した。「わたし、豚とおんなじ、あなたのもの！」と叫んだ。"
    "translation_status": "reviewed"
  - "id": "beach-070"
    "section_id": "beach-ch2"
    "kind": "heading"
    "origin": "source"
    "source_text": "CHAPTER II. THE BAN."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 79
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 490
        "line_end": 490
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-070"
    "translation_ja": "第二章　禁制"
    "translation_status": "reviewed"
  - "id": "beach-071"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I came on the verandah just before the sun rose on the morrow. My house was the last on the east; there was a cape of woods and cliffs behind that hid the sunrise. To the west, a swift cold river ran down, and beyond was the green of the village, dotted with cocoa-palms and breadfruits and houses. The shutters were some of them down and some open; I saw the mosquito bars still stretched, with shadows of people new-awakened sitting up inside; and all over the green others were stalking silent, wrapped in their many-coloured sleeping clothes like Bedouins in Bible pictures. It was mortal still and solemn and chilly, and the light of the dawn on the lagoon was like the shining of a fire."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 80
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 493
        "line_end": 502
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-071"
    "translation_ja": "翌朝、日の出の少し前に縁廊に出た。俺の家は東のはずれにあり、背後には木立と崖の岬があって日の出を隠していた。西には冷たく流れの速い川が流れ下り、向こうには村の草地が広がって、椰子やパンノキや家々が点々としていた。雨戸は下りたのもあれば開いたのもあった。まだ蚊帳が張ってあり、寝起きの人が中に起き直った影が見えた。草地のあちこちでは、聖書の絵の遊牧民みたいに色とりどりの寝衣にくるまった人が、黙って大股に歩いていた。死んだように物音もなく、おごそかで肌寒く、潟に差す暁の光は火の照り返しに似ていた。"
    "translation_status": "reviewed"
  - "id": "beach-072"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But the thing that troubled me was nearer hand. Some dozen young men and children made a piece of a half-circle, flanking my house: the river divided them, some were on the near side, some on the far, and one on a boulder in the midst; and they all sat silent, wrapped in their sheets, and stared at me and my house as straight as pointer dogs. I thought it strange as I went out. When I had bathed and come back again, and found them all there, and two or three more along with them, I thought it stranger still. What could they see to gaze at in my house, I wondered, and went in."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 81
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 504
        "line_end": 512
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-072"
    "translation_ja": "だが俺の気になったのはもっと近くだった。若い男と子供がおよそ十人あまり、家の横手を半円の一部みたいなかたちに取り巻いていた。その間を川が割って、幾人かはこちら岸、幾人かは向こう岸、一人は川の真ん中の大岩にいた。一同黙って布にくるまって座り、獲物を差す猟犬みたいにまっすぐ俺と家を見据えていた。出がけに変だなと思った。ひと泳ぎして帰ると、みんなまだいて、おまけに二、三人増えている。ますます変だと思った。俺の家に何をこうもじっと見るものがあるんだ、と不思議に思いながら中に入った。"
    "translation_status": "reviewed"
  - "id": "beach-073"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But the thought of these starers stuck in my mind, and presently I came out again. The sun was now up, but it was still behind the cape of woods. Say a quarter of an hour had come and gone. The crowd was greatly increased, the far bank of the river was lined for quite a way—perhaps thirty grown folk, and of children twice as many, some standing, some squatted on the ground, and all staring at my house. I have seen a house in a South Sea village thus surrounded, but then a trader was thrashing his wife inside, and she singing out. Here was nothing: the stove was alight, the smoke going up in a Christian manner; all was shipshape and Bristol fashion. To be sure, there was a stranger come, but they had a chance to see that stranger yesterday, and took it quiet enough. What ailed them now? I leaned my arms on the rail and stared back. Devil a wink they had in them! Now and then I could see the children chatter, but they spoke so low not even the hum of their speaking came my length. The rest were like graven images: they stared at me, dumb and sorrowful, with their bright eyes; and it came upon me things would look not much different if I were on the platform of the gallows, and these good folk had come to see me hanged."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 82
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 514
        "line_end": 531
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-073"
    "translation_ja": "だがあの見物人どものことが頭から去らず、間もなくまた出てみた。日はもう昇っていたが、木の生えた岬の後ろにいた。ざっと十五分たっていたろうか。群衆はどっと増し、川の向こう岸にはずっと先まで人が並んでいた。大人は三十人ほど、子供は倍もいた。立つのも座るのも、とにかくみんな俺の家をじっと見ていた。南海の村で家がこうして取り巻かれたのを見たことはある。だがその時は商人が中で女房をぶん殴って、女が叫んでいた。ここには何もない。かまどには火が入り、煙はいたって行儀よく立ち上り、どこもかしこもきちんと片づいている。なるほどよそ者が来たには来たが、そのよそ者は昨日もたっぷり見られたし、みんな平気だった。それが今日はどうした？　俺は手すりに両腕をもたせ、こっちからも見返してやった。畜生、あいつらまばたき一つしやしない！　ときどき子供がしゃべるのが見えたが、あんまり小声なので、話し声のぶうんという唸りすら俺のところまでは届かなかった。ほかの連中は彫像みたいに、ぴかぴかした目を俺に据え、無言の、悲しげな顔をしていた。もし俺が絞首台の上に立ち、この善男善女が俺の吊るされるところを見に来たにしても、大して違った眺めにはなるまい、と思えてきた。"
    "translation_status": "reviewed"
  - "id": "beach-074"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I felt I was getting daunted, and began to be afraid I looked it, which would never do. Up I stood, made believe to stretch myself, came down the verandah stair, and strolled towards the river. There went a short buzz from one to the other, like what you hear in theatres when the curtain goes up; and some of the nearest gave back the matter of a pace. I saw a girl lay one hand on a young man and make a gesture upward with the other; at the same time she said something in the native with a gasping voice. Three little boys sat beside my path, where, I must pass within three feet of them. Wrapped in their sheets, with their shaved heads and bits of top-knots, and queer faces, they looked like figures on a chimney-piece. Awhile they sat their ground, solemn as judges. I came up hand over fist, doing my five knots, like a man that meant business; and I thought I saw a sort of a wink and gulp in the three faces. Then one jumped up (he was the farthest off) and ran for his mammy. The other two, trying to follow suit, got foul, came to ground together bawling, wriggled right out of their sheets mother-naked, and in a moment there were all three of them scampering for their lives and singing out like pigs. The natives, who would never let a joke slip, even at a burial, laughed and let up, as short as a dog’s bark."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 83
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 533
        "line_end": 551
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-074"
    "translation_ja": "俺のほうが気おくれしてきた。顔にも出てるんじゃないかと心配になった。それじゃいけない。立ち上がって伸びをするふりをして、縁廊の段を下り、川のほうへぶらぶら歩いた。芝居で幕が上がる時みたいな、さっと短いざわめきが人々の間を伝わった。近くの連中の何人かは一歩ばかりあとずさった。娘が片手を若者に置き、もう片方で上を指すような身振りをした。同時にはっと息を呑むような声で土地の言葉を何か言った。俺の行く手には小さな男の子が三人、三フィートとは離れずに通る場所に座っていた。布にくるまり、剃った頭にちょこんと毛を残し、妙な顔をしてるのが、暖炉の棚に並んだ置物みたいだった。しばらくは判事さながらしかめつらしく踏みとどまった。俺は目的を持った男のように、五ノットの速力でずんずん近づいた。三つの顔で一斉に目がしばたたき、唾をごくりと呑んだようだった。すると一人、いちばん遠くのやつが跳ね起き、おっ母さんのところへ逃げた。残り二人も続こうとしてお互い絡み、いっしょに泣きながらひっくり返った。身をくねらせて布から丸裸で這い出すと、たちまち三人とも豚みたいに金切り声を上げ、一目散に駆けだした。葬式でも笑えるところは決して逃がさぬ島の衆は、犬が一声吠えたくらい短く笑ってやめた。"
    "translation_status": "reviewed"
  - "id": "beach-075"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They say it scares a man to be alone. No such thing. What scares him in the dark or the high bush is that he can’t make sure, and there might be an army at his elbow. What scares him worst is to be right in the midst of a crowd, and have no guess of what they’re driving at. When that laugh stopped, I stopped too. The boys had not yet made their offing, they were still on the full stretch going the one way, when I had already gone about ship and was sheering off the other. Like a fool I had come out, doing my five knots; like a fool I went back again. It must have been the funniest thing to see, and what knocked me silly, this time no one laughed; only one old woman gave a kind of pious moan, the way you have heard Dissenters in their chapels at the sermon."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 84
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 553
        "line_end": 563
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-075"
    "translation_ja": "人は一人ぼっちだと怖くなるという。そうじゃない。暗がりや深い藪で怖いのは、すぐ脇に一軍勢が潜んでいるかもしれず、それが確かめられないからだ。何より怖いのは、群衆のど真ん中にいて、連中が何を考えてるのか見当すらつかないことだ。あの笑いが止むと俺の足も止まった。子供どもがまだ十分離脱しきらず、むこうへ全力で走っているうち、俺はもう船を回し、反対へ針路を変えていた。間抜けにも五ノットで出てきて、間抜けにもまた引き返したわけだ。さぞおかしな眺めだったろう。それなのに肝を潰したことには、こんどは誰も笑わなかった。婆さん一人が信心深そうな呻きを漏らしただけだ。非国教徒が礼拝堂で説教を聞く時の、あんな声だ。"
    "translation_status": "reviewed"
  - "id": "beach-076"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I never saw such fools of Kanakas as your people here,” I said once to Uma, glancing out of the window at the starers."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 85
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 565
        "line_end": 566
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-076"
    "translation_ja": "「ここのお前んとこの連中ほど馬鹿ぞろいのカナカ人は見たことがない」と一度、窓の外の見物人に目をやりながらウマに言った。"
    "translation_status": "reviewed"
  - "id": "beach-077"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Savvy nothing,” says Uma, with a kind of disgusted air that she was good at."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 86
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 568
        "line_end": 569
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-077"
    "translation_ja": "「なんにもわからない」とウマが言った。彼女の得意な、うんざりしたような顔だった。"
    "translation_status": "reviewed"
  - "id": "beach-078"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And that was all the talk we had upon the matter, for I was put out, and Uma took the thing so much as a matter of course that I was fairly ashamed."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 87
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 571
        "line_end": 573
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-078"
    "translation_ja": "この件について二人で話したのはそれだけだった。俺は面白くなかったし、ウマはあまり当然のこととして受け止めているので、こっちがまるで恥ずかしくなったのだ。"
    "translation_status": "reviewed"
  - "id": "beach-079"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All day, off and on, now fewer and now more, the fools sat about the west end of my house and across the river, waiting for the show, whatever that was—fire to come down from heaven, I suppose, and consume me, bones and baggage. But by evening, like real islanders, they had wearied of the business, and got away, and had a dance instead in the big house of the village, where I heard them singing and clapping hands till, maybe, ten at night, and the next day it seemed they had forgotten I existed. If fire had come down from heaven or the earth opened and swallowed me, there would have been nobody to see the sport or take the lesson, or whatever you like to call it. But I was to find they hadn’t forgot either, and kept an eye lifting for phenomena over my way."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 88
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 575
        "line_end": 585
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-079"
    "translation_ja": "その日一日、間を置いては、減ったり増えたりしながら、間抜けどもは俺の家の西側や川向こうに座り、何だか知らないが見世物の始まるのを待っていた。大方、天から火が降って俺を骨も荷物もひっくるめて焼き尽くすのを待っていたんだろう。だが夕方までにはさすがに島っ子だ、もうそれにも飽きて引き揚げ、代わりに村の大会堂で踊りをやった。夜の十時頃まで歌い、手を打つ音が聞こえた。翌日には俺が存在することも忘れたようだった。天から火が降ろうが、大地が口を開けて俺を呑もうが、そいつを見物して楽しむにも、ご教訓を得るにも、何とでも言いな、一人だって立ち会いはしまい。と思いきや、連中は忘れちゃおらず、俺のところで何か異変が起きやしないか目を光らせていたのが、のちにわかった。"
    "translation_status": "reviewed"
  - "id": "beach-080"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was hard at it both these days getting my trade in order and taking stock of what Vigours had left. This was a job that made me pretty sick, and kept me from thinking on much else. Ben had taken stock the trip before—I knew I could trust Ben—but it was plain somebody had been making free in the meantime. I found I was out by what might easily cover six months’ salary and profit, and I could have kicked myself all round the village to have been such a blamed ass, sitting boozing with that Case instead of attending to my own affairs and taking stock."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 89
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 587
        "line_end": 594
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-080"
    "translation_ja": "この二日間、俺は自分の商品を整え、ヴィガーズの残した在庫を数えるのにしゃかりきだった。棚卸しをやるうちに胸くそが悪くなり、ほかのことなんぞろくに考えなくなった。前の航海でベンが棚卸しをした。ベンは信用できる、と俺は知っていた。そのあとで誰かが遠慮なく失敬したのは明々白々だった。俺の給金と取り分の半年分くらい楽に吹っ飛ぶ勘定損とわかった。自分の商売を自分で見届けて数えもせず、あのケイスとぼんやり飲んだくれるなんて、俺という大間抜けを村じゅう蹴り回してやりたかった。"
    "translation_status": "reviewed"
  - "id": "beach-081"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "However, there’s no use crying over spilt milk. It was done now, and couldn’t be undone. All I could do was to get what was left of it, and my new stuff (my own choice) in order, to go round and get after the rats and cockroaches, and to fix up that store regular Sydney style. A fine show I made of it; and the third morning when I had lit my pipe and stood in the door-way and looked in, and turned and looked far up the mountain and saw the cocoanuts waving and posted up the tons of copra, and over the village green and saw the island dandies and reckoned up the yards of print they wanted for their kilts and dresses, I felt as if I was in the right place to make a fortune, and go home again and start a public-house. There was I, sitting in that verandah, in as handsome a piece of scenery as you could find, a splendid sun, and a fine fresh healthy trade that stirred up a man’s blood like sea-bathing; and the whole thing was clean gone from me, and I was dreaming England, which is, after all, a nasty, cold, muddy hole, with not enough light to see to read by; and dreaming the looks of my public, by a cant of a broad high-road like an avenue, and with the sign on a green tree."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 90
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 596
        "line_end": 612
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-081"
    "translation_ja": "だがこぼれたミルクを嘆いたところでしょうがない。済んじまったものは元に戻らない。俺にできるのは残ったものと、自分で選んだ新しい品を整理し、そこらじゅう鼠と油虫を退治して、きっちりシドニー風の店をこしらえることだった。実に見事な店にした。三日目の朝、パイプに火をつけて戸口から中をひと目眺め、振り返って山のずっと上、椰子の木が揺れるのを見てはコプラ何トンと勘定し、村の草地のしゃれ者どもを見ては腰布や着物に更紗が何ヤード売れると勘定した。ここならひと財産つくり、故郷に帰って居酒屋を始められる、とそんな気がした。俺は縁廊に座っている。どこを探しても劣らぬみごとな景色、立派なお日様、海水浴みたいに男の血を沸かせる爽やかで健康な貿易風。その何もかもが頭からすっかり消えて、俺はイギリスの夢を見ていた。考えてもみな、イギリスなんぞ寒くて汚くて泥だらけ、本を読めるだけの明かりもないところなのにさ。並木道みたいな幅広い街道の曲がり角に立ち、緑の木に看板を下げた俺の居酒屋が夢に見えた。"
    "translation_status": "reviewed"
  - "id": "beach-082"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So much for the morning, but the day passed and the devil anyone looked near me, and from all I knew of natives in other islands I thought this strange. People laughed a little at our firm and their fine stations, and at this station of Falesá in particular; all the copra in the district wouldn’t pay for it (I had heard them say) in fifty years, which I supposed was an exaggeration. But when the day went, and no business came at all, I began to get downhearted; and, about three in the afternoon, I went out for a stroll to cheer me up. On the green I saw a white man coming with a cassock on, by which and by the face of him I knew he was a priest. He was a good-natured old soul to look at, gone a little grizzled, and so dirty you could have written with him on a piece of paper."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 91
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 614
        "line_end": 625
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-082"
    "translation_ja": "朝の話はそれでいい。ところが一日が過ぎても、誰ひとり近寄るやつもない。よその島の連中を知ってる俺にはおかしかった。うちの会社とご立派な商館を世間は少し笑いの種にしていた。とりわけこのファレサーの商館を。この地方のコプラを全部集めても五十年じゃ元は取れない、と人の言うのを聞いたことがある。俺は大げさだと思っていた。しかし時間がたっても商売が一向にないとなると、だんだんしょげてきた。午後三時頃、気晴らしに散歩に出た。草地を長い黒衣の白人がこっちへ来た。衣服といい、顔つきといい、ひと目で神父だとわかった。人のよさそうな爺さん、頭はもう少し霜降りで、その体で紙に字が書けそうなくらい汚れていた。"
    "translation_status": "reviewed"
  - "id": "beach-083"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Good day, sir,” said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 92
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 627
        "line_end": 627
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-083"
    "translation_ja": "「こんにちは、旦那」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-084"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He answered me eagerly in native."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 93
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 629
        "line_end": 629
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-084"
    "translation_ja": "神父は一所懸命、島の言葉で返事をした。"
    "translation_status": "reviewed"
  - "id": "beach-085"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Don’t you speak any English?” said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 94
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 631
        "line_end": 631
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-085"
    "translation_ja": "「英語はおできになりませんか」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-086"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“French,” says he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 95
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 633
        "line_end": 633
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-086"
    "translation_ja": "「フランス語」と彼は言った。"
    "translation_status": "reviewed"
  - "id": "beach-087"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” said I, “I’m sorry, but I can’t do anything there.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 96
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 635
        "line_end": 635
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-087"
    "translation_ja": "「じゃあ」と俺は言った。「悪いがそっちはお手上げだ」"
    "translation_status": "reviewed"
  - "id": "beach-088"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He tried me awhile in the French, and then again in native, which he seemed to think was the best chance. I made out he was after more than passing the time of day with me, but had something to communicate, and I listened the harder. I heard the names of Adams and Case and of Randall—Randall the oftenest—and the word “poison,” or something like it, and a native word that he said very often. I went home, repeating it to myself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 97
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 637
        "line_end": 643
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-088"
    "translation_ja": "しばらくフランス語でやってみて、それからまた、望みがあると見たらしい島の言葉に切り替えた。単に挨拶がしたいのではなく、何か知らせたいことがあるのだとは見て取れたので、こっちもいっそう耳を澄ました。アダムズとケイスとランドルの名が聞き取れた。いちばん度々出るのがランドルで、「ポワゾン」だか毒らしいことば、それに何度も繰り返す島言葉が一つあった。俺はそれを口の中で繰り返しながら家に帰った。"
    "translation_status": "reviewed"
  - "id": "beach-089"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What does fussy-ocky mean?” I asked of Uma, for that was as near as I could come to it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 98
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 645
        "line_end": 646
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-089"
    "translation_ja": "「ファシオキってどういう意味だ」とウマに聞いた。俺にまねできたのはいちばん近くてそれだった。"
    "translation_status": "reviewed"
  - "id": "beach-090"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Make dead,” said she."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 99
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 648
        "line_end": 648
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-090"
    "translation_ja": "「殺す」とウマは言った。"
    "translation_status": "reviewed"
  - "id": "beach-091"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“The devil it does!” says I. “Did ever you hear that Case had poisoned Johnnie Adams?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 100
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 650
        "line_end": 651
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-091"
    "translation_ja": "「そりゃたいしたもんだ！」と俺は言った。「ケイスがジョニー・アダムズに毒を盛ったって話、聞いたことあるかい」"
    "translation_status": "reviewed"
  - "id": "beach-092"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Every man he savvy that,” says Uma, scornful-like. “Give him white sand—bad sand. He got the bottle still. Suppose he give you gin, you no take him.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 101
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 653
        "line_end": 655
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-092"
    "translation_ja": "「そんなこと、誰でも知ってる」とウマはちょっと軽蔑したように言った。「白い砂をやった。悪い砂ね。まだその瓶持ってる。あの人ジンくれても、あなた飲まない」"
    "translation_status": "reviewed"
  - "id": "beach-093"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now I had heard much the same sort of story in other islands, and the same white powder always to the front, which made me think the less of it. For all that, I went over to Randall’s place to see what I could pick up, and found Case on the doorstep, cleaning a gun."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 102
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 657
        "line_end": 660
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-093"
    "translation_ja": "よその島でも似たような話はよく聞いた。きまって例の白い粉が先頭きって出てくるので、俺はその話をさほど真に受けなかった。それでも何か聞き出せるかとランドルのところへ行ってみた。ケイスが戸口の段に腰を下ろして鉄砲の手入れをしていた。"
    "translation_status": "reviewed"
  - "id": "beach-094"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Good shooting here?” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 103
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 662
        "line_end": 662
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-094"
    "translation_ja": "「ここは猟がいいのかい」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-095"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“A 1,” says he. “The bush is full of all kinds of birds. I wish copra was as plenty,” says he—I thought, slyly—“but there don’t seem anything doing.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 104
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 664
        "line_end": 666
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-095"
    "translation_ja": "「極上だ」と言う。「藪にはありとあらゆる鳥がうようよいる。コプラもそれほどあればいいけどな」と、俺には含みのある口調で言った。「どうもさっぱり動かない」"
    "translation_status": "reviewed"
  - "id": "beach-096"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I could see Black Jack in the store, serving a customer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 105
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 668
        "line_end": 668
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-096"
    "translation_ja": "店の中にはブラック・ジャックが見えて、客に品を売っていた。"
    "translation_status": "reviewed"
  - "id": "beach-097"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That looks like business, though,” said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 106
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 670
        "line_end": 670
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-097"
    "translation_ja": "「あれは商売に見えるがね」と俺が言った。"
    "translation_status": "reviewed"
  - "id": "beach-098"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s the first sale we’ve made in three weeks,” said he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 107
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 672
        "line_end": 672
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-098"
    "translation_ja": "「うちでも三週間ぶりの初商いだ」と彼が言った。"
    "translation_status": "reviewed"
  - "id": "beach-099"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You don’t tell me?” says I. “Three weeks? Well, well.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 108
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 674
        "line_end": 674
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-099"
    "translation_ja": "「ほんとかい」と俺は言った。「三週間？　こいつはどうも」"
    "translation_status": "reviewed"
  - "id": "beach-100"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“If you don’t believe me,” he cries, a little hot, “you can go and look at the copra-house. It’s half empty to this blessed hour.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 109
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 676
        "line_end": 677
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-100"
    "translation_ja": "「俺の言うことが信用できなきゃ」と少しむきになって叫んだ。「コプラ倉を見に行きゃいい。まさにこの瞬間まで半分空っぽだ」"
    "translation_status": "reviewed"
  - "id": "beach-101"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I shouldn’t be much the better for that, you see,” says I. “For all I can tell, it might have been whole empty yesterday.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 110
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 679
        "line_end": 680
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-101"
    "translation_ja": "「だがそれじゃ大してわからないね」と俺は言った。「昨日は丸ごと空だったとしても、俺にはわかりゃしない」"
    "translation_status": "reviewed"
  - "id": "beach-102"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s so,” says he, with a bit of a laugh."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 111
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 682
        "line_end": 682
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-102"
    "translation_ja": "「ごもっとも」と彼はちょっと笑った。"
    "translation_status": "reviewed"
  - "id": "beach-103"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“By-the-bye,” I said, “what sort of a party is that priest? Seems rather a friendly sort.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 112
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 684
        "line_end": 685
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-103"
    "translation_ja": "「ところで」と俺は言った。「あの神父はどういう人物だ。人なつこそうだが」"
    "translation_status": "reviewed"
  - "id": "beach-104"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At this Case laughed right out loud. “Ah!” says he, “I see what ails you now. Galuchet’s been at you.”—Father Galoshes was the name he went by most, but Case always gave it the French quirk, which was another reason we had for thinking him above the common."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 113
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 687
        "line_end": 690
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-104"
    "translation_ja": "これを聞くとケイスは大声で笑った。「ははあ！　やっとあんたの具合がわかった。ガリュシェに何か吹き込まれたな」長靴神父、つまりガロッシュ神父というあだ名がたいていは通り名だったが、ケイスはいつもフランス風のひねりを利かせて発音した。これもやつを並の男じゃないと思わせるところだった。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 103
          "end": 118
          "exact": "Father Galoshes"
  - "id": "beach-105"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes, I have seen him,” I says. “I made out he didn’t think much of your Captain Randall.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 114
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 692
        "line_end": 693
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-105"
    "translation_ja": "「ああ、会ったよ」と俺は言った。「お宅のランドル船長をあまり買っていないことはわかった」"
    "translation_status": "reviewed"
  - "id": "beach-106"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That he don’t!” says Case. “It was the trouble about poor Adams. The last day, when he lay dying, there was young Buncombe round. Ever met Buncombe?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 115
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 695
        "line_end": 697
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-106"
    "translation_ja": "「そいつは買っちゃいない！」とケイス。「あの気の毒なアダムズの一件さ。最後の日、死にかけて寝てるところに、若いバンカムが居合わせた。バンカムに会ったことは？」"
    "translation_status": "reviewed"
  - "id": "beach-107"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I told him no."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 116
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 699
        "line_end": 699
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-107"
    "translation_ja": "ない、と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-108"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“He’s a cure, is Buncombe!” laughs Case. “Well, Buncombe took it in his head that, as there was no other clergyman about, bar Kanaka pastors, we ought to call in Father Galuchet, and have the old man administered and take the sacrament. It was all the same to me, you may suppose; but I said I thought Adams was the fellow to consult. He was jawing away about watered copra and a sight of foolery. ‘Look here,’ I said, ‘you’re pretty sick. Would you like to see Galoshes?’ He sat right up on his elbow. ‘Get the priest,’ says he, ‘get the priest; don’t let me die here like a dog!’ He spoke kind of fierce and eager, but sensible enough. There was nothing to say against that, so we sent and asked Galuchet if he would come. You bet he would. He jumped in his dirty linen at the thought of it. But we had reckoned without Papa. He’s a hard-shell Baptist, is Papa; no Papists need apply. And he took and locked the door. Buncombe told him he was bigoted, and I thought he would have had a fit. ‘Bigoted!’ he says. ‘Me bigoted? Have I lived to hear it from a jackanapes like you?’ And he made for Buncombe, and I had to hold them apart; and there was Adams in the middle, gone luny again, and carrying on about copra like a born fool. It was good as the play, and I was about knocked out of time with laughing, when all of a sudden Adams sat up, clapped his hands to his chest, and went into the horrors. He died hard, did John Adams,” says Case, with a kind of a sudden sternness."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 117
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 701
        "line_end": 721
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-108"
    "translation_ja": "「面白いやつだよ、あのバンカムは！」とケイスは笑った。「そいつが妙なことを思いついてね。ほかに聖職者といえばカナカ人の牧師しかいないんだから、ガリュシェ神父を呼んで、年寄りに終油の秘跡と聖餐を授けてもらうべきだって言うのさ。わかるだろうが、俺にはどうでもよかった。ただ相談すべき相手はアダムズ本人じゃないかと言った。やつは水で濡らされたコプラだの、くだらんことをしきりにしゃべっていた。『おい』と俺は言った。『ひどく具合が悪そうだぞ。ガロッシュに会いたいか？』すると肘を突いて身を起こした。『神父を呼んでくれ。神父を呼べ。こんな所で犬みたいに死なせんでくれ！』いささか荒く切羽詰まった口ぶりだが、筋は通ってた。そう言われちゃ否やはない。人をやってガリュシェに来るかと聞いた。そりゃ来るともさ。考えただけで薄汚れた服のまま跳び上がったってね。だが俺たちはパッパを勘定に入れていなかった。パッパは生粋のバプテストだ。ローマ教徒お断りさ。扉に鍵をかけちまった。バンカムが頑迷だと言うと、発作でも起こすかと思ったね。『頑迷！　わしが頑迷だと？　お前みたいな青二才にそう呼ばれるためにわしは今日まで生きてきたのか？』そう言ってバンカムにつかみかかったんで、俺が二人を引き分けた。真ん中じゃアダムズがまた正気をなくして、生まれつきの馬鹿みたいにコプラのことを喚いてる。芝居見物に劣らぬ面白さで、俺は笑いすぎてのびちまいそうだった。すると突然アダムズが起き上がって、両手で胸を押さえ、恐ろしい発作を起こした。死にかたは苦しかったよ、あのジョン・アダムズは」とケイスは急に厳しい調子になった。"
    "translation_status": "reviewed"
  - "id": "beach-109"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And what became of the priest?” I asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 118
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 723
        "line_end": 723
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-109"
    "translation_ja": "「神父はどうしたんだ」と俺は聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-110"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“The priest?” says Case. “O! he was hammering on the door outside, and crying on the natives to come and beat it in, and singing out it was a soul he wished to save, and that. He was in a rare taking, was the priest. But what would you have? Johnny had slipped his cable; no more Johnny in the market; and the administration racket clean played out. Next thing, word came to Randall the priest was praying upon Johnny’s grave. Papa was pretty full, and got a club, and lit out straight for the place, and there was Galoshes on his knees, and a lot of natives looking on. You wouldn’t think Papa cared—that much about anything, unless it was liquor; but he and the priest stuck to it two hours, slanging each other in native, and every time Galoshes tried to kneel down Papa went for him with the club. There never were such larks in Falesá. The end of it was that Captain Randall knocked over with some kind of a fit or stroke, and the priest got in his goods after all. But he was the angriest priest you ever heard of, and complained to the chiefs about the outrage, as he called it. That was no account, for our chiefs are Protestant here; and, anyway, he had been making trouble about the drum for morning school, and they were glad to give him a wipe. Now he swears old Randall gave Adams poison or something, and when the two meet they grin at each other like baboons.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 119
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 725
        "line_end": 744
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-110"
    "translation_ja": "「神父？」とケイスは言った。「ああ！　外でどんどん戸を叩き、島の衆にこじ開けろと叫んで、俺は魂を救いたいんだ、とかなんとか喚いてた。大変な逆上ぶりだった、あの神父は。だがどうしようもないだろう？　ジョニーは錨綱を放して出港済み、もうジョニーは売り場になし、秘跡屋の商売もきれいさっぱりおしまいだ。次に、ジョニーの墓で神父が祈ってるとランドルに知らせがあった。パッパはかなり飲んでたが、棍棒を持ってまっすぐ駆けつけた。するとガロッシュが膝をつき、大勢の島の衆が見てるじゃないか。酒でもなけりゃパッパが何だろうとそんなに気にかけるとは思わないだろう。ところが二時間も神父とやり合った。土地の言葉で罵り合い、ガロッシュが膝をつこうとするたびに、パッパが棍棒を振るって飛びかかる。ファレサーであれほどのお楽しみはなかった。しまいにランドル船長が何かの発作か卒中でぶっ倒れ、とうとう神父のやつ、墓の前でひと仕事済ませちまった。だがあんなに腹を立てた神父なんてめったにいない。あの暴行が、と本人いわく、首長たちに訴えた。うちの首長はプロテスタントだから、どうということもなかったがね。そのうえこいつは朝の学校の太鼓をめぐって揉め事を起こしてたから、みんなひとつ鼻をあかせて喜んだ。今じゃアダムズに毒だか何だかを盛ったのはランドルじじいだと気張ってる。二人が出会うとヒヒみたいに互いに歯をむくよ」"
    "translation_status": "reviewed"
  - "id": "beach-111"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He told this story as natural as could be, and like a man that enjoyed the fun; though, now I come to think of it after so long, it seems rather a sickening yarn. However, Case never set up to be soft, only to be square and hearty, and a man all round; and, to tell the truth, he puzzled me entirely."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 120
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 746
        "line_end": 750
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-111"
    "translation_ja": "やつはそりゃまた自然に、面白さを心底味わった男のように語った。こんなに時がたった今考えると、むしろ胸の悪くなる話のようだが。もっともケイスは情に厚いとは売り込まなかった。ただ裏表がなくて気っ風がよく、どこから見ても男だという触れ込みだった。ほんとのところ、俺にはさっぱり底が知れなかった。"
    "translation_status": "reviewed"
  - "id": "beach-112"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I went home and asked Uma if she were a Popey, which I had made out to be the native word for Catholics."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 121
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 752
        "line_end": 753
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-112"
    "translation_ja": "家に帰り、ウマに、お前はポーピーかと聞いた。島の言葉でカトリック教徒のことをそう言う、と突き止めていたのだ。"
    "translation_status": "reviewed"
  - "id": "beach-113"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“E le ai!” says she. She always used the native when she meant “no” more than usually strong, and, indeed, there’s more of it. “No good Popey,” she added."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 122
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 755
        "line_end": 757
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-113"
    "translation_ja": "「エ・レ・アイ！」とウマは言った。ふだんよりもきっぱり「違う」と言いたい時にはいつも島言葉になり、なるほどそのほうが力がこもる。「ポーピー、よくない」と言い添えた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 1
          "end": 8
          "exact": "E le ai"
  - "id": "beach-114"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Then I asked her about Adams and the priest, and she told me much the same yarn in her own way. So that I was left not much farther on, but inclined, upon the whole, to think the bottom of the matter was the row about the sacrament, and the poisoning only talk."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 123
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 759
        "line_end": 762
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-114"
    "translation_ja": "アダムズと神父についても聞いてみると、ウマなりの言い方で大体同じ話をした。それで僅かも先へ進めたわけじゃなかったが、どうやら事の根は秘跡をめぐる喧嘩で、毒はただの噂だと考えるほうへおおむね傾いた。"
    "translation_status": "reviewed"
  - "id": "beach-115"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The next day was a Sunday, when there was no business to be looked for. Uma asked me in the morning if I was going to “pray”; I told her she bet not, and she stopped home herself with no more words. I thought this seemed unlike a native, and a native woman, and a woman that had new clothes to show off; however, it suited me to the ground, and I made the less of it. The queer thing was that I came next door to going to church after all, a thing I’m little likely to forget. I had turned out for a stroll, and heard the hymn tune up. You know how it is. If you hear folk singing, it seems to draw you; and pretty soon I found myself alongside the church. It was a little long low place, coral built, rounded off at both ends like a whale-boat, a big native roof on the top of it, windows without sashes and doorways without doors. I stuck my head into one of the windows, and the sight was so new to me—for things went quite different in the islands I was acquainted with—that I stayed and looked on. The congregation sat on the floor on mats, the women on one side, the men on the other, all rigged out to kill—the women with dresses and trade hats, the men in white jackets and shirts. The hymn was over; the pastor, a big buck Kanaka, was in the pulpit, preaching for his life; and by the way he wagged his hand, and worked his voice, and made his points, and seemed to argue with the folk, I made out he was a gun at the business. Well, he looked up suddenly and caught my eye, and I give you my word he staggered in the pulpit; his eyes bulged out of his head, his hand rose and pointed at me like as if against his will, and the sermon stopped right there."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 124
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 764
        "line_end": 787
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-115"
    "translation_ja": "翌日は日曜だから、商売は望むべくもない。朝、ウマが「お祈り」に行くかと聞いたので、そりゃ絶対ないと請け合うと、それ以上何も言わず、自分も家にとどまった。島の者らしくない、と俺は思った。島の女、しかも見せびらかす晴れ着がある女にしちゃ妙だった。けどまあ俺にはもってこいなので、深く考えなかった。不思議にも、結局ほとんど教会へ行くところだったのは俺のほうで、ありゃそうそう忘れられない。散歩に出ると賛美歌が始まるのが聞こえた。ほら、人が歌うのを聞くとなんとなく引かれるものだろう。やがて気がつくと教会のそばにいた。こぢんまりして細長くて低い珊瑚造りで、捕鯨ボートのように両端が丸く、上に島風のでかい屋根をのせ、窓に枠はなく、戸口に扉はなかった。一つの窓から頭を突っ込んだ。俺が知ってる島々じゃ様子がすっかり違ったから、物珍しくてそのまま見物した。会衆は床の筵に、女は片側、男は反対側に座り、みな精一杯におめかししていた。女はドレスと舶来の帽子、男は白い上着とシャツ。賛美歌が終わると、壇上のがっしりしたカナカ人の牧師が命がけの勢いで説教した。手の振りよう、声の抑揚、要所の締め方、会衆を相手に議論を吹っかけるような仕方を見ると、なかなかの腕利きだとわかった。ところが突然顔を上げて、俺と目が合った。すると本当だぞ、壇の中でよろめいた。目玉が飛び出し、まるで意に反して上がったようにその手が俺を指さし、説教はそれきりぷつんと途切れた。"
    "translation_status": "reviewed"
  - "id": "beach-116"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It isn’t a fine thing to say for yourself, but I ran away; and if the same kind of a shock was given me, I should run away again to-morrow. To see that palavering Kanaka struck all of a heap at the mere sight of me gave me a feeling as if the bottom had dropped out of the world. I went right home, and stayed there, and said nothing. You might think I would tell Uma, but that was against my system. You might have thought I would have gone over and consulted Case; but the truth was I was ashamed to speak of such a thing, I thought everyone would blurt out laughing in my face. So I held my tongue, and thought all the more; and the more I thought, the less I liked the business."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 125
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 789
        "line_end": 798
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-116"
    "translation_ja": "威張って言えた話じゃないが、俺は逃げた。同じようにぎょっとさせられたら、明日にだってまた逃げ出すだろう。あれほどべらべら喋っていたカナカ人が、俺をひと目見ただけであっけにとられるのを見たら、世界の底が抜け落ちたような心地がした。まっすぐ家に帰って居すわり、何も言わなかった。ウマには話すだろうと思うかもしれないが、そいつは俺の主義に反する。ケイスに相談しに行くだろうと思うかもしれないが、じつはこんな話を口にして、面と向かって皆が吹き出しやしないかと恥ずかしかった。それで舌を押さえた分だけよく考えた。考えれば考えるほど気味が悪かった。"
    "translation_status": "reviewed"
  - "id": "beach-117"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "By Monday night I got it clearly in my head I must be tabooed. A new store to stand open two days in a village and not a man or woman come to see the trade was past believing."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 126
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 800
        "line_end": 802
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-117"
    "translation_ja": "月曜の晩までに、俺はどう考えてもタブーを掛けられたに違いないと悟った。新しい店が村で二日も開いて、男も女もひとりとして品物を見にこないなんて、あるはずがない。"
    "translation_status": "reviewed"
  - "id": "beach-118"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Uma,” said I, “I think I’m tabooed.”"

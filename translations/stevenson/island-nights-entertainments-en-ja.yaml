  - "id": "beach-141"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, they don’t get much bonjour out of me,” said I. “You tell them who I am. I’m a white man, and a British subject, and no end of a big chief at home; and I’ve come here to do them good, and bring them civilisation; and no sooner have I got my trade sorted out than they go and taboo me, and no one dare come near my place! Tell them I don’t mean to fly in the face of anything legal; and if what they want’s a present, I’ll do what’s fair. I don’t blame any man looking out for himself, tell them, for that’s human nature; but if they think they’re going to come any of their native ideas over me, they’ll find themselves mistaken. And tell them plain that I demand the reason of this treatment as a white man and a British subject.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 150
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 895
        "line_end": 905
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-141"
    "translation_ja": "「よし、俺からはボンジュールの類はそうたくさん出ないぞ」と俺は言った。「俺が誰だか言ってやれ。俺は白人で英国臣民で、国じゃえらく大した首長だ。あんた方のためになることをし、文明を持ってきてやるためここへ来た。それをやっと品物を並べるが早いか俺にタブーを掛けて、誰もうちの近くへ来る勇気もない！　俺は何にせよ合法なものに逆らうつもりはない、と言ってくれ。贈り物が欲しいのなら、当然の程度には出そう。自分の得を考えるのは人情だから非難はしない、そう言ってくれ。だが俺に土地の思惑なんかを押しつけられると考えるなら、お門違いだと知るだろう。俺は白人として、英国臣民として、こういう扱いを受ける理由を要求する、はっきりそう言ってくれ」"
    "translation_status": "reviewed"

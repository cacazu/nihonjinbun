    "translation_status": "reviewed"
  - "id": "beach-358"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Well, this kind of talk put in the evening, which was the best of it; but of course it didn’t change my notion, and the next day, with my gun and a good knife, I set off upon a voyage of discovery. I made, as near as I could, for the place where I had seen Case come out; for if it was true he had some kind of establishment in the bush I reckoned I should find a path. The beginning of the desert was marked off by a wall, to call it so, for it was more of a long mound of stones. They say it reaches right across the island, but how they know it is another question, for I doubt if anyone has made the journey in a hundred years, the natives sticking chiefly to the sea and their little colonies along the coast, and that part being mortal high and steep and full of cliffs. Up to the west side of the wall, the ground has been cleared, and there are cocoa palms and mummy-apples and guavas, and lots of sensitive plants. Just across, the bush begins outright; high bush at that, trees going up like the masts of ships, and ropes of liana hanging down like a ship’s rigging, and nasty orchids growing in the forks like funguses. The ground where there was no underwood looked to be a heap of boulders. I saw many green pigeons which I might have shot, only I was there with a different idea. A number of butterflies flopped up and down along the ground like dead leaves; sometimes I would hear a bird calling, sometimes the wind overhead, and always the sea along the coast."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 367
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2001
        "line_end": 2021
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-358"
    "translation_ja": "こういう話で晩がつぶれたのは、それはそれでよかった。もちろん俺は考えを変えたわけじゃない。翌日、銃とよく切れるナイフを持って、いざ探検に出かけた。できるだけケイスが出てきたのを見た辺りを目指した。本当に藪の中に何かを構えているのなら、道があるはずだと踏んだからだ。無人地帯の入口は石の壁で仕切られていた。壁といっても、石を長く積んだ土手みたいなものだ。島を横切って反対側まで続いているというが、どうしてそれがわかるかは別の話だ。ここ百年、端から端まで通った者が一人でもいるか疑わしい。島の連中はおもに海と沿岸の小さな集落で暮らし、あの辺は恐ろしく高く険しく、崖だらけだからだ。壁の西側までは切り開かれて、椰子やパパイア、グアバ、やたらとたくさんのオジギソウが生えている。一歩向こうはもう森だ。しかも背の高い森で、木が船の帆柱のように伸び、つるは帆を操る綱のように何本も垂れ、枝の股には気味の悪いランがキノコみたいに生えていた。下草のない地面は丸石の山に見えた。緑のハトを何羽も見た。撃とうと思えば撃てたが、今日は別のつもりで来ている。何匹もの蝶が枯葉みたいに地面近くをひらひら上下した。時おり鳥の声、時おり頭上に風の音、海岸に打つ波の音だけは絶え間なかった。"
    "translation_status": "reviewed"
  - "id": "beach-359"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But the queerness of the place it’s more difficult to tell of, unless to one who has been alone in the high bush himself. The brightest kind of a day it is always dim down there. A man can see to the end of nothing; whichever way he looks the wood shuts up, one bough folding with another like the fingers of your hand; and whenever he listens he hears always something new—men talking, children laughing, the strokes of an axe a far way ahead of him, and sometimes a sort of a quick, stealthy scurry near at hand that makes him jump and look to his weapons. It’s all very well for him to tell himself that he’s alone, bar trees and birds; he can’t make out to believe it; whichever way he turns the whole place seems to be alive and looking on. Don’t think it was Uma’s yarns that put me out; I don’t value native talk a fourpenny-piece; it’s a thing that’s natural in the bush, and that’s the end of it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 368
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2023
        "line_end": 2035
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-359"
    "translation_ja": "だが、その場所がどれだけ変なところかは、一人で奥の森に入ったことのない人間に説明するのが難しい。どんな晴れた日でも、下はいつも薄暗い。どこを見渡しても見通せたためしがない。手の指を組むみたいに枝が折り重なって、どの方向も森が閉ざしている。耳を澄ませばそのたび違うものが聞こえる。男の話し声、子供の笑い声、ずっと前のほうで斧を打つ音。ときには、すぐ近くで何かが忍び足でさっと走るような音がして、とび上がって得物を確かめる。木と鳥のほかに誰もいない、自分一人だと言い聞かせるのはいいが、どうやったって信じきれない。どっちを向いても辺り一帯が生きていて、こっちを見ている気がするんだ。ウマの話で気味が悪くなったと思わないでくれ。島の連中の話なんぞ、四ペンスの値打ちもない。森ってのがそういう所なんだ。それだけだ。"
    "translation_status": "reviewed"
  - "id": "beach-360"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As I got near the top of the hill, for the ground of the wood goes up in this place steep as a ladder, the wind began to sound straight on, and the leaves to toss and switch open and let in the sun. This suited me better; it was the same noise all the time, and nothing to startle. Well, I had got to a place where there was an underwood of what they call wild cocoanut—mighty pretty with its scarlet fruit—when there came a sound of singing in the wind that I thought I had never heard the like of. It was all very fine to tell myself it was the branches; I knew better. It was all very fine to tell myself it was a bird; I knew never a bird that sang like that. It rose and swelled, and died away and swelled again; and now I thought it was like someone weeping, only prettier; and now I thought it was like harps; and there was one thing I made sure of, it was a sight too sweet to be wholesome in a place like that. You may laugh if you like; but I declare I called to mind the six young ladies that came, with their scarlet necklaces, out of the cave at Fanga-anaana, and wondered if they sang like that. We laugh at the natives and their superstitions; but see how many traders take them up, splendidly educated white men, that have been book-keepers (some of them) and clerks in the old country. It’s my belief a superstition grows up in a place like the different kind of weeds; and as I stood there and listened to that wailing I twittered in my shoes."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 369
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2037
        "line_end": 2057
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-360"
    "translation_ja": "この辺りの森の地面ははしごみたいに険しく上っている。丘のてっぺんに近づくと、風が途切れずに鳴りはじめ、葉は揺さぶられてさっと割れ、日がさし込んだ。俺にはこっちのほうがよかった。ずっと同じ音で、びっくりすることもない。さて、野生の椰子と呼ばれている、真っ赤な実がえらくきれいな低木の茂みに来た時、風にまじって、聞いたこともないような歌声がした。枝の音だと言い聞かせてはみたが、違うとわかっていた。鳥だと言い聞かせてはみたが、そんな歌い方をする鳥を知らない。音は高くふくらみ、消えかけてはまたふくらんだ。誰かが泣いているようで、それよりきれいだと思ったかと思えば、竪琴を何台も鳴らすようにも聞こえた。たしかなことが一つあった。こんな所で聞くには、まともとは思えないほど甘美な音だった。笑いたきゃ笑うといい。だが俺は、ファンガ・アナアナの洞穴から真っ赤な首飾りをつけて出てきた六人の娘を思い出して、あの女たちもこう歌うんだろうかと考えた。俺たちは島の連中とその迷信を笑うが、商人のうち何人が同じ迷信を信じるようになるか見てみろ。立派な教育を受けた白人で、中には本国で帳簿係や事務員をしていた連中もいる。俺に言わせれば、迷信も雑草と同じで、土地によって違うのが生えるものだ。立ちどまってあの泣き声を聞くうち、俺は靴の中で震え上がった。"
    "translation_status": "reviewed"
  - "id": "beach-361"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "You may call me a coward to be frightened; I thought myself brave enough to go on ahead. But I went mighty carefully, with my gun cocked, spying all about me like a hunter, fully expecting to see a handsome young woman sitting somewhere in the bush, and fully determined (if I did) to try her with a charge of duck-shot. And sure enough, I had not gone far when I met with a queer thing. The wind came on the top of the wood in a strong puff, the leaves in front of me burst open, and I saw for a second something hanging in a tree. It was gone in a wink, the puff blowing by and the leaves closing. I tell you the truth: I had made up my mind to see an aitu; and if the thing had looked like a pig or a woman, it wouldn’t have given me the same turn. The trouble was that it seemed kind of square, and the idea of a square thing that was alive and sang knocked me sick and silly. I must have stood quite a while; and I made pretty certain it was right out of the same tree that the singing came. Then I began to come to myself a bit."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 370
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2059
        "line_end": 2073
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-361"
    "translation_ja": "怖がったからには臆病者だと思ってもらってかまわないが、俺は先へ進めるだけの勇気は自分にあると思った。だが、それはそれは慎重に、銃の撃鉄を起こし、猟師みたいに周囲をうかがいながら進んだ。藪のどこかにきれいな娘が腰を下ろしているに違いないと踏んで、いたら鴨撃ちの散弾を一発お見舞いすると決めていた。案の定、いくらも行かないうちに妙なものに出くわした。森の上を強い風がさっと吹き抜け、目の前の葉がぱっと開いて、一瞬、木に何かがぶら下がっているのが見えた。風が去って葉が閉じると、たちまち見えなくなった。正直に言う。アイトゥを見る覚悟はしていた。豚か女に見えたなら、あれほど肝をつぶしはしなかっただろう。困ったのは、どうも四角く見えたことだ。四角いものが生きていて、しかも歌うなんて考えたら、気分が悪くなり、頭もまっ白になった。ずいぶん長いこと立ち尽くしていたらしいが、歌はまさに同じ木から聞こえてくると、ほぼ確信した。それから少し気を取り直してきた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 654
          "end": 658
          "exact": "aitu"
  - "id": "beach-362"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” says I, “if this is really so, if this is a place where there are square things that sing, I’m gone up anyway. Let’s have my fun for my money.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 371
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2075
        "line_end": 2077
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-362"
    "translation_ja": "「よし」と俺は言った。「本当に四角いものが歌うような所なら、どのみち俺はもうおしまいだ。どうせただじゃ済まんのだ。元を取るくらい楽しまなくちゃ損だ」"
    "translation_status": "reviewed"
  - "id": "beach-363"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But I thought I might as well take the off chance of a prayer being any good; so I plumped on my knees and prayed out loud; and all the time I was praying the strange sounds came out of the tree, and went up and down, and changed, for all the world like music, only you could see it wasn’t human—there was nothing there that you could whistle."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 372
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2079
        "line_end": 2083
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-363"
    "translation_ja": "だが、ひょっとしたらお祈りも役に立つかもしれないと、どさっと膝をついて声を出して祈った。祈っているあいだじゅう、木からは妙な音が聞こえ、上がったり下がったり変化したりした。まるで音楽だったが、人間のものじゃないのははっきりしていた。口笛で真似られる節なんか一つもなかった。"
    "translation_status": "reviewed"
  - "id": "beach-364"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As soon as I had made an end in proper style, I laid down my gun, stuck my knife between my teeth, walked right up to that tree, and began to climb. I tell you my heart was like ice. But presently, as I went up, I caught another glimpse of the thing, and that relieved me, for I thought it seemed like a box; and when I had got right up to it I near fell out of the tree with laughing."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 373
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2085
        "line_end": 2090
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-364"
    "translation_ja": "きちんと祈り終えると、銃を置き、ナイフを歯でくわえ、まっすぐその木に取りついて登りはじめた。胸の中は氷みたいだったよ。だが登るうちにそいつがまたちらりと見えて、どうやら箱らしいとわかったら、ほっとした。すぐそばまで登ってみたら、笑いすぎて木から落ちそうになった。"
    "translation_status": "reviewed"
  - "id": "beach-365"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A box it was, sure enough, and a candle-box at that, with the brand upon the side of it; and it had banjo strings stretched so as to sound when the wind blew. I believe they call the thing a Tyrolean {3} harp, whatever that may mean."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 374
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2092
        "line_end": 2095
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-365"
    "translation_ja": "まぎれもなく箱だった。おまけに、側面に商標がついた蝋燭箱だ。風が吹けば鳴るようにバンジョーの弦が張ってあった。どういう意味かは知らんが、チロルの竪琴〔原注3〕とかいうものらしい。"
    "translation_status": "reviewed"
  - "id": "beach-366"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, Mr. Case,” said I, “you’ve frightened me once, but I defy you to frighten me again,” I says, and slipped down the tree, and set out again to find my enemy’s head office, which I guessed would not be far away."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 375
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2097
        "line_end": 2099
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-366"
    "translation_ja": "「さて、ケイスさんよ」と俺は言った。「一度は脅かされたが、もう一遍できるものならやってみな」。そう言って木からするすると降り、敵の本店を探しにまた出発した。そう遠くはないだろうと踏んでいた。"
    "translation_status": "reviewed"
  - "id": "beach-367"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The undergrowth was thick in this part; I couldn’t see before my nose, and must burst my way through by main force and ply the knife as I went, slicing the cords of the lianas and slashing down whole trees at a blow. I call them trees for the bigness, but in truth they were just big weeds, and sappy to cut through like carrot. From all this crowd and kind of vegetation, I was just thinking to myself, the place might have once been cleared, when I came on my nose over a pile of stones, and saw in a moment it was some kind of a work of man. The Lord knows when it was made or when deserted, for this part of the island has lain undisturbed since long before the whites came. A few steps beyond I hit into the path I had been always looking for. It was narrow, but well beaten, and I saw that Case had plenty of disciples. It seems, indeed, it was a piece of fashionable boldness to venture up here with the trader, and a young man scarce reckoned himself grown till he had got his breech tattooed, for one thing, and seen Case’s devils for another. This is mighty like Kanakas; but, if you look at it another way, it’s mighty like white folks too."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 376
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2101
        "line_end": 2117
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-367"
    "translation_ja": "ここでは下草がびっしりで、鼻の先も見えない。力任せに突っ切りながらナイフをたえず振るい、綱のようなつるを切り、木を一振りでなぎ倒した。大きいから木と言うが、じつのところ大きな草で、汁気があってニンジンみたいに切れた。これだけ草が茂っていて、しかもこういう草が生えているなら、昔ここを切り開いた者がいるんじゃないかと思った矢先、石の山につまずいて鼻から突っ込んだ。人の手でこしらえたものに違いないとひと目でわかった。いつ作られ、いつ放っておかれたかは神様しか知らない。島のこの辺りは白人がやってくるはるか前から、人の手が入っていないのだ。その数歩先で、ずっと探していた道に出くわした。細いがよく踏み固められていて、ケイスに大勢の信者がいることがわかった。実際、あの商人と一緒に勇気を出してここへ登ってくるのがおしゃれらしい。尻に入れ墨を入れることと、ケイスの悪魔どもを見ること、この二つを済ませなきゃ、若者は一人前になった気がしないそうだ。実にカナカ人らしいと思うが、見方を変えればいかにも白人がやりそうなことでもある。"
    "translation_status": "reviewed"
  - "id": "beach-368"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A bit along the path I was brought to a clear stand, and had to rub my eyes. There was a wall in front of me, the path passing it by a gap; it was tumbledown and plainly very old, but built of big stones very well laid; and there is no native alive to-day upon that island that could dream of such a piece of building. Along all the top of it was a line of queer figures, idols or scarecrows, or what not. They had carved and painted faces ugly to view, their eyes and teeth were of shell, their hair and their bright clothes blew in the wind, and some of them worked with the tugging. There are islands up west where they make these kind of figures till to-day; but if ever they were made in this island, the practice and the very recollection of it are now long forgotten. And the singular thing was that all these bogies were as fresh as toys out of a shop."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 377
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2119
        "line_end": 2131
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-368"
    "translation_ja": "道を少し進んだところでぴたりと足が止まり、俺は目をこすった。目の前に石垣があり、道はその切れ目を通っている。崩れかけで、見るからに古いが、大きな石をきちんと組んであった。今この島に生きている者なら誰一人、こんな造りを思いつきもしないだろう。石垣の上には奇妙な人形がずらりと並んでいた。偶像だか案山子だか、よくわからないものだ。顔は彫って色をつけてあり、見るも醜い。目と歯は貝殻で、髪や鮮やかな衣が風になびき、その引っぱる力で動く人形もあった。西へ行けば今でもこういう人形を作る島はある。しかしこの島で作っていたことがあるにしても、その作り方どころか、作ったという記憶そのものが、とうの昔に忘れられている。おかしなことに、その化け物どもはどれも店から出したばかりのおもちゃみたいに真新しかった。"
    "translation_status": "reviewed"
  - "id": "beach-369"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Then it came in my mind that Case had let out to me the first day that he was a good forger of island curiosities, a thing by which so many traders turn an honest penny. And with that I saw the whole business, and how this display served the man a double purpose: first of all, to season his curiosities, and then to frighten those that came to visit him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 378
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2133
        "line_end": 2137
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-369"
    "translation_ja": "そこで思い出した。ケイスは会った初日に、島の珍品を偽造するのがうまいと俺に漏らした。そんなことでまっとうに小銭を稼ぐ商人はいくらでもいる。それで何もかも腑に落ちた。こうして並べておけば、一石二鳥だ。まず偽物に古びた味をつけられる。それから、会いに来た連中を怖がらせることができる。"
    "translation_status": "reviewed"
  - "id": "beach-370"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But I should tell you (what made the thing more curious) that all the time the Tyrolean harps were harping round me in the trees, and even while I looked, a green-and-yellow bird (that, I suppose, was building) began to tear the hair off the head of one of the figures."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 379
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2139
        "line_end": 2142
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-370"
    "translation_ja": "だが、話を一つ添えておこう。これでますます妙な眺めになる。あたりの木ではチロルの竪琴がいくつも鳴りつづけていて、俺が見ているうちに、巣でも作っていたのだろう、緑と黄色の鳥が人形の一つから髪の毛をむしりはじめた。"
    "translation_status": "reviewed"
  - "id": "beach-371"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A little farther on I found the best curiosity of the museum. The first I saw of it was a longish mound of earth with a twist to it. Digging off the earth with my hands, I found underneath tarpaulin stretched on boards, so that this was plainly the roof of a cellar. It stood right on the top of the hill, and the entrance was on the far side, between two rocks, like the entrance to a cave. I went as far in as the bend, and, looking round the corner, saw a shining face. It was big and ugly, like a pantomime mask, and the brightness of it waxed and dwindled, and at times it smoked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 380
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2144
        "line_end": 2152
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-371"
    "translation_ja": "もう少し行くと、その博物館いちばんの珍品を見つけた。初め見えたのは、曲がりのある細長い土盛りだった。手で土をどけると、下には板の上に防水布が張ってあった。どう見ても穴蔵の屋根だ。丘のてっぺんにあり、入口は向こう側の岩と岩のあいだで、洞穴の入口みたいだった。曲がり角まで中に入り、そこからのぞくと、光る顔が見えた。芝居の仮面みたいに大きく醜い面で、明るくなったり暗くなったりし、時々煙まで出した。"
    "translation_status": "reviewed"
  - "id": "beach-372"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Oho!” says I, “luminous paint!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 381
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2154
        "line_end": 2154
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-372"
    "translation_ja": "「ははあ」と俺は言った。「夜光塗料か！」"
    "translation_status": "reviewed"
  - "id": "beach-373"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And I must say I rather admired the man’s ingenuity. With a box of tools and a few mighty simple contrivances he had made out to have a devil of a temple. Any poor Kanaka brought up here in the dark, with the harps whining all round him, and shown that smoking face in the bottom of a hole, would make no kind of doubt but he had seen and heard enough devils for a lifetime. It’s easy to find out what Kanakas think. Just go back to yourself any way round from ten to fifteen years old, and there’s an average Kanaka. There are some pious, just as there are pious boys; and the most of them, like the boys again, are middling honest and yet think it rather larks to steal, and are easy scared and rather like to be so. I remember a boy I was at school with at home who played the Case business. He didn’t know anything, that boy; he couldn’t do anything; he had no luminous paint and no Tyrolean harps; he just boldly said he was a sorcerer, and frightened us out of our boots, and we loved it. And then it came in my mind how the master had once flogged that boy, and the surprise we were all in to see the sorcerer catch it and bum like anybody else. Thinks I to myself, “I must find some way of fixing it so for Master Case.” And the next moment I had my idea."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 382
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2156
        "line_end": 2173
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-373"
    "translation_ja": "あの男、よく考えたものだと、多少感心したのは確かだ。道具箱一つと、いたって簡単な仕掛けをいくつか使っただけで、とんでもない悪魔の神殿をでっち上げたんだ。暗いなか、あたりで竪琴がすすり泣くこの場所に哀れなカナカ人を連れてきて、穴の底で煙を吹く顔を見せてやれば、一生ぶんの悪魔を見も聞きもしたと信じて疑わないだろう。カナカ人が何を考えるか当てるのは簡単だ。十から十五までの自分を思い出せば、それが並のカナカ人だ。信心深い子供がいるように、信心深い者もいる。大半はやっぱり子供と一緒で、まあまあ正直だが盗みはおもしろがるし、すぐ怖がって、しかも怖がるのがわりと好きだ。国の学校にいた頃の同級生に、ケイスと同じ手を使った奴がいた。そいつは何も知らないし、何もできない。夜光塗料もチロルの竪琴も持っていない。ただ堂々と俺は魔法使いだと言い放っただけで、俺たちは腰を抜かすほど怖がって、しかも嬉しかった。そこで、先生に一度そいつが鞭で打たれたことを思い出した。魔法使いがほかの誰とも同じように、こっぴどくやられて泣きべそをかくのを見て、皆びっくり仰天したものだ。「ケイス様にも同じ目を見せてやる手を見つけなくちゃな」と思った。その次の瞬間、いい考えが浮かんだ。"
    "translation_status": "reviewed"
  - "id": "beach-374"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I went back by the path, which, when once you had found it, was quite plain and easy walking; and when I stepped out on the black sands, who should I see but Master Case himself. I cocked my gun and held it handy, and we marched up and passed without a word, each keeping the tail of his eye on the other; and no sooner had we passed than we each wheeled round like fellows drilling, and stood face to face. We had each taken the same notion in his head, you see, that the other fellow might give him the load of his gun in the stern."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 383
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2175
        "line_end": 2182
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-374"
    "translation_ja": "見つけた道を通って戻った。いったん見つけてしまえば、はっきりしていて歩きやすい道だ。黒い砂浜へ出たところで会ったのが、なんとケイス様その人だ。俺は撃鉄を起こして銃を構えやすいように持った。二人とも横目で相手を見張りながら、黙って歩いてすれ違った。すれ違うなり、二人とも教練さながらにくるっと振り向き、向かい合って止まった。二人とも同じ考えだったんだ。相手が尻に銃弾をお見舞いしてくるかもしれないとね。"
    "translation_status": "reviewed"
  - "id": "beach-375"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You’ve shot nothing,” says Case."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 384
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2184
        "line_end": 2184
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-375"
    "translation_ja": "「何も撃ってないな」とケイスが言った。"
    "translation_status": "reviewed"
  - "id": "beach-376"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I’m not on the shoot to-day,” said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 385
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2186
        "line_end": 2186
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-376"
    "translation_ja": "「今日は猟じゃないんだ」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-377"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, the devil go with you for me,” says he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 386
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2188
        "line_end": 2188
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-377"
    "translation_ja": "「そうかい。悪魔にでもお供してもらえ。俺の知ったことか」と奴は言った。"
    "translation_status": "reviewed"
  - "id": "beach-378"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“The same to you,” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 387
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2190
        "line_end": 2190
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-378"
    "translation_ja": "「あんたもな」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-379"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But we stuck just the way we were; no fear of either of us moving."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 388
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2192
        "line_end": 2192
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-379"
    "translation_ja": "だが二人ともそのまま突っ立って、どっちも動く気配はない。"
    "translation_status": "reviewed"
  - "id": "beach-380"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Case laughed. “We can’t stop here all day, though,” said he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 389
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2194
        "line_end": 2194
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-380"
    "translation_ja": "ケイスが笑った。「だが、一日じゅうここにいるわけにもいかんだろう」"
    "translation_status": "reviewed"
  - "id": "beach-381"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Don’t let me detain you,” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 390
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2196
        "line_end": 2196
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-381"
    "translation_ja": "「どうぞ遠慮なく」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-382"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He laughed again. “Look here, Wiltshire, do you think me a fool?” he asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 391
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2198
        "line_end": 2199
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-382"
    "translation_ja": "奴はまた笑った。「なあ、ウィルトシャー。俺を間抜けだと思ってるのか？」と聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-383"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“More of a knave, if you want to know,” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 392
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2201
        "line_end": 2201
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-383"
    "translation_ja": "「知りたいなら言うが、どっちかといえば悪党だと思うね」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-384"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, do you think it would better me to shoot you here, on this open beach?” said he. “Because I don’t. Folks come fishing every day. There may be a score of them up the valley now, making copra; there might be half a dozen on the hill behind you, after pigeons; they might be watching us this minute, and I shouldn’t wonder. I give you my word I don’t want to shoot you. Why should I? You don’t hinder me any. You haven’t got one pound of copra but what you made with your own hands, like a negro slave. You’re vegetating—that’s what I call it—and I don’t care where you vegetate, nor yet how long. Give me your word you don’t mean to shoot me, and I’ll give you a lead and walk away.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 393
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2203
        "line_end": 2212
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-384"
    "translation_ja": "「そうか。じゃあ、この見晴らしのいい浜であんたを撃って、俺に何か得があると思うか？」と奴は言った。「俺は思わん。釣りに来る奴は毎日いる。今も谷の奥でコプラを作ってる奴が二十人くらいいるかもしれんし、あんたの後ろの丘じゃハトを追ってる奴が五、六人いてもおかしくない。今この場を見られてるかもしれんよ。俺は驚かんな。あんたを撃つ気はないと約束する。第一、何のために？　あんたが俺の邪魔をしてるわけじゃないだろう。黒人奴隷みたいに自分で手ずから作った分のほか、コプラ一ポンド手に入ってない。俺に言わせりゃ、あんたはただ根を張ってぼうっと生きてるだけだ。どこに根を張ろうが、いつまでぼうっとしてようが、俺の知ったことか。撃つ気はないとあんたも約束してくれ。そしたら俺が先に背を向けて立ち去ろう」"
    "translation_status": "reviewed"
  - "id": "beach-385"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” said I, “You’re frank and pleasant, ain’t you? And I’ll be the same. I don’t mean to shoot you to-day. Why should I? This business is beginning; it ain’t done yet, Mr. Case. I’ve given you one turn already; I can see the marks of my knuckles on your head to this blooming hour, and I’ve more cooking for you. I’m not a paralee, like Underhill. My name ain’t Adams, and it ain’t Vigours; and I mean to show you that you’ve met your match.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 394
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2214
        "line_end": 2220
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-385"
    "translation_ja": "「まったく率直でご親切だな」と俺は言った。「じゃあこっちも同じにしよう。今日はあんたを撃つ気はない。何のために撃つ？　この件は始まったばかりだ。まだ終わってないよ、ケイスさん。一度はもう痛い目に遭わせた。今の今まであんたの額に俺の拳の跡が残ってる。そしてまだ、お楽しみを仕込んでいるところだ。俺はアンダーヒルみたいに体が利かないわけじゃない。アダムズでもないし、ヴィガーズでもない。いい相手にぶつかったもんだと、思い知らせてやる」"
    "translation_status": "reviewed"
  - "id": "beach-386"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is a silly way to talk,” said he. “This is not the talk to make me move on with.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 395
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2222
        "line_end": 2223
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-386"
    "translation_ja": "「馬鹿げた口のきき方だ」と奴は言った。「そんなことを言われちゃ、ここを動く気にはなれん」"
    "translation_status": "reviewed"
  - "id": "beach-387"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“All right,” said I, “stay where you are. I ain’t in any hurry, and you know it. I can put in a day on this beach and never mind. I ain’t got any copra to bother with. I ain’t got any luminous paint to see to.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 396
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2225
        "line_end": 2227
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-387"
    "translation_ja": "「よし、ならそこにいなよ」と俺は言った。「急がなくていいのは、あんたも知ってるだろう。この浜で一日過ごしたって、こっちはかまわん。気にかけるコプラもなけりゃ、世話する夜光塗料もない」"
    "translation_status": "reviewed"
  - "id": "beach-388"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was sorry I said that last, but it whipped out before I knew. I could see it took the wind out of his sails, and he stood and stared at me with his brow drawn up. Then I suppose he made up his mind he must get to the bottom of this."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 397
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2229
        "line_end": 2232
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-388"
    "translation_ja": "最後のは言わなきゃよかった。気がつく前に口をついて出たんだ。あいつは帆から風が抜けたみたいに、勢いを失った。眉をつり上げ、立ったまま俺をじっと見ている。それから、何のことか突き止めなきゃならないと決めたらしい。"
    "translation_status": "reviewed"
  - "id": "beach-389"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I take you at your word,” says he, and turned his back, and walked right into the devil’s bush."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 398
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2234
        "line_end": 2235
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-389"
    "translation_ja": "「あんたの言葉を信じるよ」と奴は言い、背を向けてまっすぐ悪魔の藪に入っていった。"
    "translation_status": "reviewed"
  - "id": "beach-390"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I let him go, of course, for I had passed my word. But I watched him as long as he was in sight, and after he was gone lit out for cover as lively as you would want to see, and went the rest of the way home under the bush, for I didn’t trust him sixpence-worth. One thing I saw, I had been ass enough to give him warning, and that which I meant to do I must do at once."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 399
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2237
        "line_end": 2242
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-390"
    "translation_ja": "言葉を交わした以上、もちろん行かせた。だが目に見えるかぎり奴を見張り、姿が消えると、見事なほど素早く茂みに駆け込み、あとは藪に身を隠して家まで帰った。奴を六ペンスほども信用できなかったからだ。一つわかったことがある。馬鹿にも俺は奴に警告してしまったのだ。やるつもりだったことは、もう今すぐやるしかない。"
    "translation_status": "reviewed"
  - "id": "beach-391"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "You would think I had had about enough excitement for one morning, but there was another turn waiting me. As soon as I got far enough round the cape to see my house I made out there were strangers there; a little farther, and no doubt about it. There was a couple of armed sentinels squatting at my door. I could only suppose the trouble about Uma must have come to a head, and the station been seized. For aught I could think, Uma was taken up already, and these armed men were waiting to do the like with me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 400
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2244
        "line_end": 2251
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-391"
    "translation_ja": "朝からこれだけあれば十分だろうと思うかもしれないが、もう一つ待っていた。岬をまわってうちが見えはじめるとすぐ、人が来ているのがわかった。もう少し行くと見間違いじゃない。武器を持った見張りが二人、うちの戸口でしゃがんでいた。ウマの一件がとうとうこじれて、商館を取り上げられたに違いない。それしか思い浮かばなかった。ウマはもう捕まっていて、あの武装した二人は俺も捕まえようと待っているのかもしれなかった。"
    "translation_status": "reviewed"
  - "id": "beach-392"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "However, as I came nearer, which I did at top speed, I saw there was a third native sitting on the verandah like a guest, and Uma was talking with him like a hostess. Nearer still I made out it was the big young chief, Maea, and that he was smiling away and smoking. And what was he smoking? None of your European cigarettes fit for a cat, not even the genuine big, knock-me-down native article that a fellow can really put in the time with if his pipe is broke—but a cigar, and one of my Mexicans at that, that I could swear to. At sight of this my heart started beating, and I took a wild hope in my head that the trouble was over, and Maea had come round."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 401
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2253
        "line_end": 2262
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-392"
    "translation_ja": "ところが、全速力で近づいていくと、三人目の島の男が縁廊に客みたいに座っていて、ウマは家の女主人らしく話をしている。もっと寄ると、その男は体の大きな若い首長のマエアで、にこにこ笑って煙草をふかしているとわかった。しかも何を吸っていたと思う？　猫にでもくれてやるようなヨーロッパの紙巻きじゃない。パイプが壊れても十分ゆっくり楽しめる、あの本場の、ぶっ倒れるほど太い島の煙草ですらない。葉巻だ。しかも俺のメキシコ葉巻の一本だ。誓ってもいい。それを見たら胸がどきどきして、ひょっとして揉め事は終わったんじゃないか、マエアがこちらについてくれたんじゃないかと、途方もない望みが湧いた。"
    "translation_status": "reviewed"
  - "id": "beach-393"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Uma pointed me out to him as I came up, and he met me at the head of my own stairs like a thorough gentleman."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 402
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2264
        "line_end": 2265
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-393"
    "translation_ja": "近づいた俺をウマが指さした。すると彼は、まるで申し分のない紳士のように、うちの階段の上まで迎えに出た。"
    "translation_status": "reviewed"
  - "id": "beach-394"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Vilivili,” said he, which was the best they could make of my name, “I pleased.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 403
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2267
        "line_end": 2268
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-394"
    "translation_ja": "「ヴィリヴィリ」と彼は言った。俺の名は彼らにそうとしか言えなかった。「会えてうれしい」"
    "translation_status": "reviewed"
  - "id": "beach-395"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There is no doubt when an island chief wants to be civil he can do it. I saw the way things were from the word go. There was no call for Uma to say to me: “He no ’fraid Ese now, come bring copra.” I tell you I shook hands with that Kanaka like as if he was the best white man in Europe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 404
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2270
        "line_end": 2273
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-395"
    "translation_ja": "島の首長は、礼を尽くそうと思えば、じつに見事にできる。俺にははなからどういうことかわかった。ウマが「もうエセ怖くない、コプラ持ってくる」と言うまでもなかった。俺はそのカナカ人と、ヨーロッパでいちばん立派な白人にするように握手した。ほんとだとも。"
    "translation_status": "reviewed"
  - "id": "beach-396"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The fact was, Case and he had got after the same girl; or Maea suspected it, and concluded to make hay of the trader on the chance. He had dressed himself up, got a couple of his retainers cleaned and armed to kind of make the thing more public, and, just waiting till Case was clear of the village, came round to put the whole of his business my way. He was rich as well as powerful. I suppose that man was worth fifty thousand nuts per annum. I gave him the price of the beach and a quarter cent better, and as for credit, I would have advanced him the inside of the store and the fittings besides, I was so pleased to see him. I must say he bought like a gentleman: rice and tins and biscuits enough for a week’s feast, and stuffs by the bolt. He was agreeable besides; he had plenty fun to him; and we cracked jests together, mostly through the interpreter, because he had mighty little English, and my native was still off colour. One thing I made out: he could never really have thought much harm of Uma; he could never have been really frightened, and must just have made believe from dodginess, and because he thought Case had a strong pull in the village and could help him on."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 405
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2275
        "line_end": 2291
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-396"
    "translation_ja": "実のところ、ケイスとマエアは同じ娘を追いかけていたのだ。少なくともマエアはそうにらんで、そういうことなら機に乗じて商人をひとつ出し抜いてやろうと決めた。自分は着飾り、家来二人には身なりを整えさせ、武器を持たせて、いくらか派手に人目を引くようにした。ケイスが村を離れるのを見計らって、取引をまるごと俺に回しに来たのだ。力があるだけでなく金持ちだった。一年に椰子の実五万個ぶんの財力はあったと思う。俺は浜の相場より四分の一セント色をつけた。掛け売りの話なら、店の中身から棚やら何やらまで、まるごと前貸ししてもよかった。会えてそれほど嬉しかったのだ。じつに金離れのいい客だった。米、缶詰、ビスケットは一週間宴会をやれるほど買い、布地は反で買った。そのうえ感じのいい男で、洒落っ気もあり、二人で冗談を飛ばし合った。英語はろくにしゃべらず、俺の島の言葉もまだお粗末なので、たいてい通訳を介してだった。俺にわかったことが一つある。本気でウマを悪く思っていたはずはない。そもそも本気で怖がったはずもない。ただ計算でそのふりをしたんだろう。ケイスが村であれほど顔が利くんだから、自分がのし上がるのに役立つと思ったんだ。"
    "translation_status": "reviewed"
  - "id": "beach-397"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This set me thinking that both he and I were in a tightish place. What he had done was to fly in the face of the whole village, and the thing might cost him his authority. More than that, after my talk with Case on the beach, I thought it might very well cost me my life. Case had as good as said he would pot me if ever I got any copra; he would come home to find the best business in the village had changed hands; and the best thing I thought I could do was to get in first with the potting."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 406
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2293
        "line_end": 2299
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-397"
    "translation_ja": "そこで俺もマエアも、ちょっとばかりまずい立場だと気がついた。村じゅうに真っ向から楯突いたのだから、マエアは権勢を失うかもしれない。そればかりか、浜でケイスとした話を思い返すと、俺は命を落としかねないと思った。俺がコプラを少しでも手に入れたら撃つ、と奴は言ったも同然だ。戻ってみれば村でいちばんの取引が別の手に渡っている。だったら、撃たれる前にこっちから手を打つのがいちばんだと思った。"
    "translation_status": "reviewed"
  - "id": "beach-398"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“See here, Uma,” says I, “tell him I’m sorry I made him wait, but I was up looking at Case’s Tiapolo store in the bush.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 407
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2301
        "line_end": 2302
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-398"
    "translation_ja": "「なあ、ウマ」と俺は言った。「待たせてすまなかったと伝えてくれ。藪でケイスのティアポロの店を調べていたんだ」"
    "translation_status": "reviewed"
  - "id": "beach-399"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“He want savvy if you no ’fraid?” translated Uma."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 408
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2304
        "line_end": 2304
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-399"
    "translation_ja": "「怖くなかったか、知りたいって」とウマは通訳した。"
    "translation_status": "reviewed"
  - "id": "beach-400"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I laughed out. “Not much!” says I. “Tell him the place is a blooming toy-shop! Tell him in England we give these things to the kids to play with.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 409
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2306
        "line_end": 2308
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-400"
    "translation_ja": "俺は声を出して笑った。「ちっとも！」と俺は言った。「あそこは、なんてこたぁない、おもちゃ屋みたいなもんだ！　イングランドじゃあんな物は子供にやって遊ばせる、そう言ってやれ」"
    "translation_status": "reviewed"
  - "id": "beach-401"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“He want savvy if you hear devil sing?” she asked next."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 410
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2310
        "line_end": 2310
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-401"
    "translation_ja": "「悪魔が歌うの、聞いたか知りたいって」と次に聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-402"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Look here,” I said, “I can’t do it now because I’ve got no banjo-strings in stock; but the next time the ship comes round I’ll have one of these same contraptions right here in my verandah, and he can see for himself how much devil there is to it. Tell him, as soon as I can get the strings I’ll make one for his picaninnies. The name of the concern is a Tyrolean harp; and you can tell him the name means in English that nobody but dam-fools give a cent for it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 411
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2312
        "line_end": 2318
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-402"
    "translation_ja": "「いいか」と俺は言った。「今はバンジョーの弦の在庫がないからできんが、次に船が回ってきたら、同じ仕掛けをここの縁廊に置いて、その悪魔がどれほどのものか、自分で見られるようにしてやる。弦が手に入りしだい、そっちのちびどもにも一つ作ってやる、と伝えてくれ。あれはチロルの竪琴っていう代物だ。英語でどういう意味かって？　あんな物に一セントでも払うのは大馬鹿だけだってことさ、そう言っといてくれ」"
    "translation_status": "reviewed"
  - "id": "beach-403"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This time he was so pleased he had to try his English again. “You talk true?” says he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 412
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2320
        "line_end": 2321
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-403"
    "translation_ja": "今度はよほど嬉しかったらしく、また英語を使わずにいられなかった。「それ、本当のこと言ってる？」と言う。"
    "translation_status": "reviewed"
  - "id": "beach-404"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Rather!” said I. “Talk all-e-same Bible. Bring out a Bible here, Uma, if you’ve got such a thing, and I’ll kiss it. Or, I’ll tell you what’s better still,” says I, taking a header, “ask him if he’s afraid to go up there himself by day.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 413
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2323
        "line_end": 2326
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-404"
    "translation_ja": "「もちろんだ！」と俺は言った。「聖書と同じくらい本当だ。ウマ、聖書ってものがうちにあるなら持ってきてくれ。その本に口づけして誓うよ。それとももっといい考えがある」と、思い切って言った。「昼間なら自分であそこまで行けるか、怖くないかと聞いてくれ」"
    "translation_status": "reviewed"
  - "id": "beach-405"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It appeared he wasn’t; he could venture as far as that by day and in company."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 414
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2328
        "line_end": 2329
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-405"
    "translation_ja": "怖くはないということだった。昼間で連れがいれば、そこまでは行けるそうだ。"
    "translation_status": "reviewed"
  - "id": "beach-406"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s the ticket, then!” said I. “Tell him the man’s a fraud and the place foolishness, and if he’ll go up there to-morrow he’ll see all that’s left of it. But tell him this, Uma, and mind he understands it: If he gets talking, it’s bound to come to Case, and I’m a dead man! I’m playing his game, tell him, and if he says one word my blood will be at his door and be the damnation of him here and after.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 415
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2331
        "line_end": 2336
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-406"
    "translation_ja": "「よし、それで決まりだ！」と俺は言った。「あの男はペテン師で、あの場所はくだらん仕掛けだって言ってくれ。明日あそこまで行けば、何が残っているか見られる。ただし、ウマ、これだけはよくわかるように言ってやれ。口外したら必ずケイスの耳に入る。そうなれば、俺は死人だ！　俺はあんたの側に立って勝負してるんだ。もし一言でも漏らしたら、俺の死はあんたのせいで、その罪でこの世でもあの世でも呪われる。そう伝えてくれ」"
    "translation_status": "reviewed"
  - "id": "beach-407"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She told him, and he shook hands with me up to the hilt, and, says he: “No talk. Go up to-morrow. You my friend?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 416
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2338
        "line_end": 2339
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-407"
    "translation_ja": "ウマが伝えると、彼は俺の手を力いっぱい握りしめて、こう言った。「誰にも言わない。明日、行く。あなた、友達？」"
    "translation_status": "reviewed"
  - "id": "beach-408"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No sir,” says I, “no such foolishness. I’ve come here to trade, tell him, and not to make friends. But, as to Case, I’ll send that man to glory!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 417
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2341
        "line_end": 2343
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-408"
    "translation_ja": "「いや、そんなくだらないことはなしだ」と俺は言った。「俺は商売に来たんだ。友達をつくりにじゃない、そう言ってくれ。ただ、ケイスの野郎は俺があの世へ送ってやるよ！」"
    "translation_status": "reviewed"
  - "id": "beach-409"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So off Maea went, pretty well pleased, as I could see."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 418
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2345
        "line_end": 2345
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-409"
    "translation_ja": "こうしてマエアは、俺の見たところ、いたく満足して帰っていった。"
    "translation_status": "reviewed"
  - "id": "beach-410"
    "section_id": "beach-ch5"
    "kind": "heading"
    "origin": "source"
    "source_text": "CHAPTER V. NIGHT IN THE BUSH."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 419
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2349
        "line_end": 2349
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-410"
    "translation_ja": "第五章　夜の森"
    "translation_status": "reviewed"
  - "id": "beach-411"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Well, I was committed now; Tiapolo had to be smashed up before next day, and my hands were pretty full, not only with preparations, but with argument. My house was like a mechanics’ debating society: Uma was so made up that I shouldn’t go into the bush by night, or that, if I did, I was never to come back again. You know her style of arguing: you’ve had a specimen about Queen Victoria and the devil; and I leave you to fancy if I was tired of it before dark."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 420
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2352
        "line_end": 2358
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-411"
    "translation_ja": "さて、ここまで来たら、もう後へは引けなかった。明日までにティアポロを吹き飛ばさなきゃならん。その支度だけでも手いっぱいなのに、あれこれ言い争う仕事まであった。うちはまるで職工たちの討論会さ。ウマに言わせると、夜に森へ入るなんてとんでもない、行けば俺は二度と帰ってこないと、すっかり決め込んでいる。あいつの議論の仕方は知ってるだろう。ヴィクトリア女王と悪魔の話で、一例は出したんだからな。日暮れまでに俺がどれだけうんざりしたかは、ご想像に任せるよ。"
    "translation_status": "reviewed"
  - "id": "beach-412"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At last I had a good idea. What was the use of casting my pearls before her? I thought; some of her own chopped hay would be likelier to do the business."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 421
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2360
        "line_end": 2362
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-412"
    "translation_ja": "しまいにいいことを思いついた。あいつの前に真珠を投げたって、何の役に立つ？　あいつがいつも食ってる干し草を刻んでやるほうが、よっぽど効き目がありそうだ。"
    "translation_status": "reviewed"
  - "id": "beach-413"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I’ll tell you what, then,” said I. “You fish out your Bible, and I’ll take that up along with me. That’ll make me right.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 422
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2364
        "line_end": 2365
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-413"
    "translation_ja": "「なら、こうしようじゃないか」と俺は言った。「お前の聖書を出してくれ。俺が森まで持っていく。それなら俺は大丈夫だ」"
    "translation_status": "reviewed"
  - "id": "beach-414"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She swore a Bible was no use."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 423
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2367
        "line_end": 2367
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-414"
    "translation_ja": "聖書なんか何の役にも立たないと、あいつは言い張った。"
    "translation_status": "reviewed"
  - "id": "beach-415"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s just your Kanaka ignorance,” said I. “Bring the Bible out.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 424
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2369
        "line_end": 2369
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-415"
    "translation_ja": "「そいつはお前が、ものを知らんカナカ人だからだ」と俺は言った。「聖書を持ってこい」"
    "translation_status": "reviewed"
  - "id": "beach-416"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She brought it, and I turned to the title-page, where I thought there would likely be some English, and so there was. “There!” said I. “Look at that! ‘London: Printed for the British and Foreign Bible Society, Blackfriars,’ and the date, which I can’t read, owing to its being in these X’s. There’s no devil in hell can look near the Bible Society, Blackfriars. Why, you silly!” I said, “how do you suppose we get along with our own aitus at home? All Bible Society!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 425
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2371
        "line_end": 2377
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-416"
    "translation_ja": "ウマが持ってくると、俺は扉を開いた。そこなら英語も書いてありそうだと思ったら、案の定だった。「ほら！」と俺は言った。「ここを見ろ。『ロンドン、ブラックフライアーズ、英国外国聖書協会のために印刷』だ。あとは年号、Ｘの字ばかりで俺には読めんがね。地獄の悪魔だって、ブラックフライアーズの聖書協会には近寄れんのだぞ。ばかなやつだな！」と俺。「じゃあ、俺たちの国じゃ、土地のアイトゥをどうやって追い払うと思ってるんだ？　みんな聖書協会のおかげだ！」"
    "translation_status": "reviewed"

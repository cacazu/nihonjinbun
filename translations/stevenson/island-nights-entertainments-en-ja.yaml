    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 365
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1995
        "line_end": 1996
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-356"
    "translation_ja": "「そこに俺が銃を持って居合わせたらよかったのにな」と俺は言った。「そのイノシシ、自分でびっくりするような声を上げたと思うよ」"
    "translation_status": "reviewed"
  - "id": "beach-357"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But she told me a gun was of no use with the like of these, which were the spirits of the dead."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 366
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1998
        "line_end": 1999
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-357"

        "line_start": 2481
        "line_end": 2481
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-430"
    "translation_ja": "「イオエ〔原注4〕」とあいつは言った。「急いで来た。エセ、もうすぐここ」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"

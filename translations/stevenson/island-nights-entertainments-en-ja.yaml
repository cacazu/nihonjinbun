  - "id": "beach-210"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well!” I said. “And suppose I had come round after?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 219
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1219
        "line_end": 1219
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-210"
    "translation_ja": "「まったく！」と俺は言った。「そのあとで俺が来てたらどうしたんだ？」"
    "translation_status": "reviewed"
  - "id": "beach-211"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I like you more better now,” said she. “But, suppose I marry Ioane, I one good wife. I no common Kanaka. Good girl!” says she."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 220
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1221
        "line_end": 1222
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-211"
    "translation_ja": "「いま、あなたのほうが好き」とウマは言った。「でもイオアネにもらわれたら、わたし、いい女房になってた。わたし、並のカナカじゃない。いい娘！」と言い切った。"
    "translation_status": "reviewed"
  - "id": "beach-212"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Well, I had to be pleased with that; but I promise you I didn’t care about the business one little bit. And I liked the end of that yarn no better than the beginning. For it seems this proposal of marriage was the start of all the trouble. It seems, before that, Uma and her mother had been looked down upon, of course, for kinless folk and out-islanders, but nothing to hurt; and, even when Ioane came forward, there was less trouble at first than might have been looked for. And then, all of a sudden, about six months before my coming, Ioane backed out and left that part of the island, and from that day to this Uma and her mother had found themselves alone. None called at their house, none spoke to them on the roads. If they went to church, the other women drew their mats away and left them in a clear place by themselves. It was a regular excommunication, like what you read of in the Middle Ages; and the cause or sense of it beyond guessing. It was some tala pepelo, Uma said, some lie, some calumny; and all she knew of it was that the girls who had been jealous of her luck with Ioane used to twit her with his desertion, and cry out, when they met her alone in the woods, that she would never be married. “They tell me no man he marry me. He too much ’fraid,” she said."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 221
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1224
        "line_end": 1242
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-212"
    "translation_ja": "まあ、それでよしとするしかなかった。だがこの話はちっとも気に入らなかったと断言する。そして話の終わりも初めと同じくらい気に入らなかった。そもそもこの求婚が揉め事一切の始まりだったようなのだ。それ以前もウマとおっ母さんは、当然ながら身寄りもなく、よその島から来た者として見下されていた。だが傷つくほどではなかった。イオアネが名乗りを上げた時でさえ、初めは予想されたほどの面倒はなかった。ところが俺の来る約半年前、突然イオアネは手を引き、島のこのあたりから姿を消した。それ以来今日に至るまで、ウマとおっ母さんは孤立させられた。家に訪ねて来る者はなく、道で口をきく者もない。教会へ行けばほかの女は筵を引きのけて、ぽっかりあいた場所に二人を残した。中世の本で読むような、まったくの破門だった。その理由も意味も見当がつかない。何かのタラ・ペペロ、嘘、悪口だ、とウマは言った。わかっていたのは、ウマがイオアネに好かれた幸運に嫉妬していた娘たちが、捨てられたとからかい、森でウマひとりに出会うと、お前なんか一生嫁に行けやしないと囃したことだけだった。「わたしと結婚する人いないって言う。男、みんな怖がるから」とウマは言った。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"

  - "id": "beach-015"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But of all this on that first morning I knew no more than a fly. Case used me like a gentleman and like a friend, made me welcome to Falesá, and put his services at my disposal, which was the more helpful from my ignorance of the native. All the better part of the day we sat drinking better acquaintance in the cabin, and I never heard a man talk more to the point. There was no smarter trader, and none dodgier, in the islands. I thought Falesá seemed to be the right kind of a place; and the more I drank the lighter my heart. Our last trader had fled the place at half an hour’s notice, taking a chance passage in a labour ship from up west. The captain, when he came, had found the station closed, the keys left with the native pastor, and a letter from the runaway, confessing he was fairly frightened of his life. Since then the firm had not been represented, and of course there was no cargo. The wind, besides, was fair, the captain hoped he could make his next island by dawn, with a good tide, and the business of landing my trade was gone about lively. There was no call for me to fool with it, Case said; nobody would touch my things, everyone was honest in Falesá, only about chickens or an odd knife or an odd stick of tobacco; and the best I could do was to sit quiet till the vessel left, then come straight to his house, see old Captain Randall, the father of the beach, take pot-luck, and go home to sleep when it got dark. So it was high noon, and the schooner was under way before I set my foot on shore at Falesá."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 24
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 159
        "line_end": 180
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-015"
    "translation_ja": "もっとも最初の朝には、俺はそんなことを蠅ほども知らなかった。ケイスは紳士のように、友達のように接し、ファレサーへようこそと言って、何でも力になろうと申し出た。俺は土地の言葉を知らなかったから、いっそうありがたかった。日中の大半、二人で船室に座り、飲んで親しくなったが、これほど要領よく話す男はほかに知らない。島々でこいつ以上に腕の立つ商人も、これ以上手管に長けたのもいなかった。ファレサーはなかなか結構な所らしいと思ったし、飲めば飲むほど胸が軽くなった。うちの前の商人は、逃げると決めて三十分とたたぬうちに、西の遠くの島から来た労働者運搬船にたまたま乗せてもらって消えた。船長が来てみると、商館は閉まり、鍵は島の牧師に預けられ、逃げた当人からの手紙があって、まったく命が危ないと思った、と白状してあった。それ以来、会社の代理人は不在で、もちろん積み出す荷もない。そのうえ風向きがよく、船長は夜明けに潮に乗って次の島へ着けると思ったので、俺の商い荷の陸揚げはきびきび進んだ。そんなことにかまける必要はない、とケイスが言った。誰も俺の荷物には手を出さない、ファレサーじゃみんな正直だ、まあ鶏とか、たまたまそこらにあるナイフ一本とか棒煙草一本とかは別だが。俺は船が出るまでのんびり座っていて、それからまっすぐ彼の家へ来て、浜の長老ランドル船長に会い、ある物で食事をし、暗くなったら寝に帰るのがいちばんいいという。そんなわけで俺がファレサーの陸へ足を踏み出したのは真昼で、スクーナーはもう走りだしていた。"
    "translation_status": "reviewed"
  - "id": "beach-016"
    "section_id": "beach-ch1"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had a glass or two on board; I was just off a long cruise, and the ground heaved under me like a ship’s deck. The world was like all new painted; my foot went along to music; Falesá might have been Fiddler’s Green, if there is such a place, and more’s the pity if there isn’t! It was good to foot the grass, to look aloft at the green mountains, to see the men with their green wreaths and the women in their bright dresses, red and blue. On we went, in the strong sun and the cool shadow, liking both; and all the children in the town came trotting after with their shaven heads and their brown bodies, and raising a thin kind of a cheer in our wake, like crowing poultry."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 25
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 182
        "line_end": 191
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-016"
    "translation_ja": "船で一杯か二杯やったし、長い航海を終えたばかりで、足もとの地面が甲板みたいにうねった。世の中じゅう塗り直したてのようで、足がひとりでに節を取った。ファレサーは船乗りの極楽、フィドラーズ・グリーンそのものかもしれない。そんな所があればの話だが、ないのならまったく惜しい！　草を踏むのはいい気分だ。見上げれば緑の山々、目の前には緑の葉の冠をつけた男たち、赤や青の鮮やかな服の女たち。強い日ざしにも涼しい木陰にも、それぞれいい気分で俺たちは進んだ。町じゅうの子供が剃り頭と褐色の体で小走りについてきて、俺たちのあとに鶏の時の声みたいな甲高い歓声を上げた。"
    "translation_status": "reviewed"

          "end": 976
          "exact": "tala pepelo"
  - "id": "beach-213"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The only soul that came about them after this desertion was Master Case. Even he was chary of showing himself, and turned up mostly by night; and pretty soon he began to table his cards and make up to Uma. I was still sore about Ioane, and when Case turned up in the same line of business I cut up downright rough."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 222
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1244
        "line_end": 1248
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-213"
    "translation_ja": "こうして人から見放された母娘をその後訪ねて来たのは、ケイスの旦那ただひとりだった。そのケイスでさえ、人目につくのを用心して、たいていは夜に姿を現した。じきに手の内を見せ、ウマに言い寄りだした。俺はまだイオアネのことがしゃくに障っていたので、ケイスが同じ商売に乗り込んでくると、がぜん荒っぽくなった。"
    "translation_status": "reviewed"
  - "id": "beach-214"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” I said, sneering, “and I suppose you thought Case ‘very pretty’ and ‘liked too much’?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 223
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1250
        "line_end": 1251
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-214"
    "translation_ja": "「さて」と俺はせせら笑って言った。「ケイスのことも『とてもきれいな人』だと思い、『すごく好きだった』んだろう？」"
    "translation_status": "reviewed"
  - "id": "beach-215"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Now you talk silly,” said she. “White man, he come here, I marry him all-e-same Kanaka; very well then, he marry me all-e-same white woman. Suppose he no marry, he go ’way, woman he stop. All-e-same thief, empty hand, Tonga-heart—no can love! Now you come marry me. You big heart—you no ’shamed island-girl. That thing I love you for too much. I proud.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 224
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1253
        "line_end": 1257
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-215"
    "translation_ja": "「いま馬鹿なこと言う」とウマは言った。「白い男ここへ来る、わたし、カナカの男と結婚するのと同じつもりで、その人と結婚する。だったら、白い女と結婚するのと同じように、あの人もわたしと結婚する。それがいい。結婚しないなら、男出ていく、女だけ残る。泥棒とおんなじ、手はからっぽ、トンガの心。そんなの愛せない！　あなた来た、わたしと結婚した。あなた心大きい。島の娘、恥じない。それであなた、とっても好き。誇らしい」"
    "translation_status": "reviewed"
  - "id": "beach-216"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I don’t know that ever I felt sicker all the days of my life. I laid down my fork, and I put away “the island-girl”; I didn’t seem somehow to have any use for either, and I went and walked up and down in the house, and Uma followed me with her eyes, for she was troubled, and small wonder! But troubled was no word for it with me. I so wanted, and so feared, to make a clean breast of the sweep that I had been."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 225
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1259
        "line_end": 1264
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-216"
    "translation_ja": "生まれて今日まで、あれほど胸が悪かったことがあるか知らない。フォークを置き、「島の娘」も膝から下ろした。その時はどういうわけかどちらにももう用がなかった。立って部屋を行ったり来たりした。ウマは心配になって、俺を目で追った。そりゃ当然だ。だが俺のほうは心配どころではなかった。自分がどんなろくでなしだったのか、洗いざらい白状してしまいたくて、しかも白状するのが恐ろしくてたまらなかった。"
    "translation_status": "reviewed"
  - "id": "beach-217"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And just then there came a sound of singing out of the sea; it sprang up suddenly clear and near, as the boat turned the headland, and Uma, running to the window, cried out it was “Misi” come upon his rounds."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 226
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1266
        "line_end": 1268
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-217"
    "translation_ja": "ちょうどその時、海のほうから歌声がした。ボートが岬を回ると、急に間近にはっきり響いてきた。ウマは窓へ走り、「ミシ」が巡回に来た、と叫んだ。"
    "translation_status": "reviewed"
  - "id": "beach-218"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I thought it was a strange thing I should be glad to have a missionary; but, if it was strange, it was still true."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 227
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1270
        "line_end": 1271
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-218"
    "translation_ja": "宣教師が来てくれて嬉しいなんて、不思議なことがあるもんだと思った。だが不思議だろうがほんとのことだ。"
    "translation_status": "reviewed"
  - "id": "beach-219"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Uma,” said I, “you stop here in this room, and don’t budge a foot out of it till I come back.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 228
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1273
        "line_end": 1274
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-219"
    "translation_ja": "「ウマ」と俺は言った。「お前、この部屋にいてくれ。俺が帰るまで一歩も外へ出るな」"
    "translation_status": "reviewed"
  - "id": "beach-220"
    "section_id": "beach-ch3"
    "kind": "heading"
    "origin": "source"
    "source_text": "CHAPTER III. THE MISSIONARY."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 229
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1278
        "line_end": 1278
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-220"
    "translation_ja": "第三章　宣教師"
    "translation_status": "reviewed"
  - "id": "beach-221"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As I came out on the verandah, the mission-boat was shooting for the mouth of the river. She was a long whale-boat painted white; a bit of an awning astern; a native pastor crouched on the wedge of the poop, steering; some four-and-twenty paddles flashing and dipping, true to the boat-song; and the missionary under the awning, in his white clothes, reading in a book, and set him up! It was pretty to see and hear; there’s no smarter sight in the islands than a missionary boat with a good crew and a good pipe to them; and I considered it for half a minute, with a bit of envy perhaps, and then strolled down towards the river."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 230
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1281
        "line_end": 1289
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-221"
    "translation_ja": "縁廊へ出ると、宣教団の舟は川口めがけて滑り込んでくるところだった。白く塗った細長い捕鯨ボートで、船尾にちょっとした日よけがある。船尾のとがったところには島の牧師がしゃがんで舵を取り、二十四本ばかりの櫂が舟歌にきっちり合わせて光っては水に入る。日よけの下には白服を着た宣教師が本を読んでいる。まあ、ご立派なことだ！　目にも耳にもいい眺めだった。腕のいい漕ぎ手がそろって景気よく歌う宣教団の舟ほど、島々で見事なものはない。少々うらやましかったのかもしれん。俺は三十秒ほど眺めてから、ぶらぶら川へ下りていった。"
    "translation_status": "reviewed"
  - "id": "beach-222"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "From the opposite side there was another man aiming for the same place, but he ran and got there first. It was Case; doubtless his idea was to keep me apart from the missionary, who might serve me as interpreter; but my mind was upon other things. I was thinking how he had jockeyed us about the marriage, and tried his hand on Uma before; and at the sight of him rage flew into my nostrils."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 231
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1291
        "line_end": 1296
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-222"
    "translation_ja": "向こうからも同じ場所を目指す男が一人いて、そいつは走って先に着いた。ケイスだった。通訳になってくれそうな宣教師に、俺を会わせまいと思ったに違いない。だが俺は別のことを考えていた。結婚の一件でどんなふうに俺たちをだまし、前には自分でウマを口説いていたかということだ。その顔を見たとたん、怒りで鼻息が荒くなった。"
    "translation_status": "reviewed"
  - "id": "beach-223"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Get out of that, you low, swindling thief!” I cried."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 232
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1298
        "line_end": 1298
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-223"
    "translation_ja": "「そこをどけ、下劣なぺてん師の泥棒め！」と俺は叫んだ。"
    "translation_status": "reviewed"
  - "id": "beach-224"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What’s that you say?” says he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 233
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1300
        "line_end": 1300
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-224"
    "translation_ja": "「何だと？」と奴は言った。"
    "translation_status": "reviewed"
  - "id": "beach-225"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I gave him the word again, and rammed it down with a good oath. “And if ever I catch you within six fathoms of my house,” I cried, “I’ll clap a bullet in your measly carcase.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 234
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1302
        "line_end": 1304
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-225"
    "translation_ja": "俺はもう一度同じことを言い、ののしり言葉を一つ添えて念を押した。「うちから六尋以内に近づいてみろ」と俺は叫んだ。「そのけちな体に一発ぶち込んでやる」"
    "translation_status": "reviewed"
  - "id": "beach-226"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You must do as you like about your house,” said he, “where I told you I have no thought of going; but this is a public place.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 235
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1306
        "line_end": 1307
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-226"
    "translation_ja": "「あんたの家なら好きにすりゃいいさ。行く気はないともう言ったろう」と奴は言った。「だがここは人の行き来する場所だ」"
    "translation_status": "reviewed"
  - "id": "beach-227"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It’s a place where I have private business,” said I. “I have no idea of a hound like you eavesdropping, and I give you notice to clear out.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 236
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1309
        "line_end": 1310
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-227"
    "translation_ja": "「ここで俺に内々の用があるんだ」と俺は言った。「あんたみたいな犬に立ち聞きさせる気はない。今のうちに出ていけ」"
    "translation_status": "reviewed"
  - "id": "beach-228"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I don’t take it, though,” says Case."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 237
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1312
        "line_end": 1312
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-228"
    "translation_ja": "「そう言われても聞けんね」とケイスは言った。"
    "translation_status": "reviewed"
  - "id": "beach-229"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I’ll show you, then,” said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 238
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1314
        "line_end": 1314
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-229"
    "translation_ja": "「じゃあ、わからせてやる」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-230"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“We’ll have to see about that,” said he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 239
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1316
        "line_end": 1316
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-230"
    "translation_ja": "「そりゃやってみなきゃわからんぞ」と奴は言った。"
    "translation_status": "reviewed"
  - "id": "beach-231"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He was quick with his hands, but he had neither the height nor the weight, being a flimsy creature alongside a man like me, and, besides, I was blazing to that height of wrath that I could have bit into a chisel. I gave him first the one and then the other, so that I could hear his head rattle and crack, and he went down straight."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 240
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1318
        "line_end": 1322
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-231"
    "translation_ja": "手の出は速かったが、背丈でも目方でも俺にはかなわなかった。俺と並べばひょろひょろだ。そのうえこっちは、たがねにでも噛みつけるほど腹が煮え立っていた。片方の拳を食らわせ、すぐにもう片方を食らわせると、奴の頭ががくがく揺れてごきっと鳴るのが聞こえ、まっすぐ倒れた。"
    "translation_status": "reviewed"
  - "id": "beach-232"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Have you had enough?” cried I. But he only looked up white and blank, and the blood spread upon his face like wine upon a napkin. “Have you had enough?” I cried again. “Speak up, and don’t lie malingering there, or I’ll take my feet to you.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 241
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1324
        "line_end": 1327
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-232"
    "translation_ja": "「もうたくさんか？」と俺は叫んだ。だが奴は青ざめ、ぼうっと見上げるばかりで、ナプキンに葡萄酒がしみるみたいに顔に血が広がった。「もうたくさんかと聞いてるんだ！」と俺は続けた。「起きられんふりして寝てないで、返事しろ。さもないと今度は蹴るぞ」"
    "translation_status": "reviewed"
  - "id": "beach-233"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He sat up at that, and held his head—by the look of him you could see it was spinning—and the blood poured on his pyjamas."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 242
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1329
        "line_end": 1330
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-233"
    "translation_ja": "それで奴は起き上がって頭を抱えた。その顔つきで、目が回っているとわかった。血はパジャマにしたたり落ちた。"
    "translation_status": "reviewed"
  - "id": "beach-234"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I’ve had enough for this time,” says he, and he got up staggering, and went off by the way that he had come."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 243
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1332
        "line_end": 1333
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-234"
    "translation_ja": "「今日はもうたくさんだ」と奴は言った。よろめきながら立ち上がり、来たほうへ去っていった。"
    "translation_status": "reviewed"
  - "id": "beach-235"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The boat was close in; I saw the missionary had laid his book to one side, and I smiled to myself. “He’ll know I’m a man, anyway,” thinks I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 244
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1335
        "line_end": 1336
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-235"
    "translation_ja": "舟はもう近くまで来ていた。宣教師が本を脇に置いたのが見え、俺はひとりでにやりとした。まあ、俺が男だってことはわかってもらえたろう、とね。"
    "translation_status": "reviewed"
  - "id": "beach-236"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This was the first time, in all my years in the Pacific, I had ever exchanged two words with any missionary, let alone asked one for a favour. I didn’t like the lot, no trader does; they look down upon us, and make no concealment; and, besides, they’re partly Kanakaised, and suck up with natives instead of with other white men like themselves. I had on a rig of clean striped pyjamas—for, of course, I had dressed decent to go before the chiefs; but when I saw the missionary step out of this boat in the regular uniform, white duck clothes, pith helmet, white shirt and tie, and yellow boots to his feet, I could have bunged stones at him. As he came nearer, queering me pretty curious (because of the fight, I suppose), I saw he looked mortal sick, for the truth was he had a fever on, and had just had a chill in the boat."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 245
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1338
        "line_end": 1349
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-236"
    "translation_ja": "太平洋に何年もいて、宣教師に頼みごとをするどころか、二言と口をきいたのもこれが初めてだった。俺はあの連中が嫌いだった。商人ならみんなそうだ。奴らは俺たちを見下していて、それを隠そうともしない。そのうえ半ばカナカ人みたいになって、同じ白人より、島の連中にばかり取り入る。俺はきれいな縞のパジャマを着ていた。もちろん首長たちの前に出るから、身なりはきちんとしたつもりだ。だが、宣教師が決まりきった格好で舟から上がるのを見た時は、石でも投げつけてやりたかった。白い厚地の綿服に、植物の髄で作った日よけ帽、白いシャツとネクタイ、足には黄褐色の長靴だ。俺を妙に物珍しげに眺めながら近づいてきた。たぶん喧嘩のせいだろう。そうすると、ひどく具合が悪そうなのがわかった。実際、熱があったうえ、舟の中でついさっき悪寒が来たところだった。"
    "translation_status": "reviewed"
  - "id": "beach-237"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Mr. Tarleton, I believe?” says I, for I had got his name."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 246
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1351
        "line_end": 1351
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-237"
    "translation_ja": "「タールトンさんですね？」と俺は言った。名前は聞いていた。"
    "translation_status": "reviewed"
  - "id": "beach-238"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And you, I suppose, are the new trader?” says he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 247
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1353
        "line_end": 1353
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-238"
    "translation_ja": "「あなたは新しく来た商人の方でしょうか？」と彼は言った。"
    "translation_status": "reviewed"
  - "id": "beach-239"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I want to tell you first that I don’t hold with missions,” I went on, “and that I think you and the likes of you do a sight of harm, filling up the natives with old wives’ tales and bumptiousness.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 248
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1355
        "line_end": 1357
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-239"
    "translation_ja": "「最初に言っておきますが、俺は布教なんてものに賛成しません」と俺は続けた。「あんたや同類はひどい害を及ぼしてると思う。島の連中におとぎ話を詰め込んで、自惚れさせるくらいですから」"
    "translation_status": "reviewed"
  - "id": "beach-240"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You are perfectly entitled to your opinions,” says he, looking a bit ugly, “but I have no call to hear them.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 249
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1359
        "line_end": 1360
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-240"
    "translation_ja": "「どうお考えになるかはあなたの自由です」と彼は少し険しい顔で言った。「ですが私にそれを聞く義理はありません」"
    "translation_status": "reviewed"
  - "id": "beach-241"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It so happens that you’ve got to hear them,” I said. “I’m no missionary, nor missionary lover; I’m no Kanaka, nor favourer of Kanakas—I’m just a trader; I’m just a common, low-down, God-damned white man and British subject, the sort you would like to wipe your boots on. I hope that’s plain!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 250
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1362
        "line_end": 1366
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-241"
    "translation_ja": "「あいにく聞いてもらわなくちゃ困る」と俺は言った。「俺は宣教師じゃないし、宣教師のひいきでもない。カナカ人でもカナカ人の味方でもない。ただの商人です。ありふれた、下品な、神にも見放された白人で、イギリス臣民。あんたが靴の泥をなすりつけてやりたいような奴ですよ。これでおわかりでしょうな！」"
    "translation_status": "reviewed"
  - "id": "beach-242"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Yes, my man,” said he. “It’s more plain than creditable. When you are sober, you’ll be sorry for this.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 251
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1368
        "line_end": 1369
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-242"
    "translation_ja": "「ええ、わかりましたよ」と彼は言った。「お世辞にも立派な口のきき方ではありませんね。酔いがさめたら後悔しますよ」"
    "translation_status": "reviewed"
  - "id": "beach-243"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He tried to pass on, but I stopped him with my hand. The Kanakas were beginning to growl. Guess they didn’t like my tone, for I spoke to that man as free as I would to you."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 252
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1371
        "line_end": 1373
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-243"
    "translation_ja": "そのまま通り過ぎようとするので、俺は手で止めた。カナカ人たちがうなりはじめた。俺があんたに話すみたいに遠慮なくこの人にものを言うのが、気に入らなかったんだろう。"
    "translation_status": "reviewed"
  - "id": "beach-244"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Now, you can’t say I’ve deceived you,” said I, “and I can go on. I want a service—I want two services, in fact; and, if you care to give me them, I’ll perhaps take more stock in what you call your Christianity.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 253
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1375
        "line_end": 1377
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-244"
    "translation_ja": "「これで俺にだまされたとは言われまい。だから話を続けますよ」と俺は言った。「頼みが一つ、実は二つある。聞いていただけるなら、あんたの言うキリスト教も、前より少しは見直すかもしれん」"
    "translation_status": "reviewed"
  - "id": "beach-245"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He was silent for a moment. Then he smiled. “You are rather a strange sort of man,” says he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 254
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1379
        "line_end": 1380
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-245"
    "translation_ja": "しばらく黙ってから、彼は微笑んだ。「あなたは少し変わった方ですね」"
    "translation_status": "reviewed"
  - "id": "beach-246"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I’m the sort of man God made me,” says I. “I don’t set up to be a gentleman,” I said."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 255
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1382
        "line_end": 1383
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-246"
    "translation_ja": "「神様がこしらえたとおりの男ですよ」と俺は言った。「紳士を気取るつもりはありません」"
    "translation_status": "reviewed"
  - "id": "beach-247"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I am not quite so sure,” said he. “And what can I do for you, Mr.—?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 256
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1385
        "line_end": 1385
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-247"
    "translation_ja": "「私はそう決めつけませんがね」と彼は言った。「それで、何をいたしましょう、ええと……」"
    "translation_status": "reviewed"
  - "id": "beach-248"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Wiltshire,” I says, “though I’m mostly called Welsher; but Wiltshire is the way it’s spelt, if the people on the beach could only get their tongues about it. And what do I want? Well, I’ll tell you the first thing. I’m what you call a sinner—what I call a sweep—and I want you to help me make it up to a person I’ve deceived.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 257
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1387
        "line_end": 1391
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-248"
    "translation_ja": "「ウィルトシャー」と俺は言った。「たいていウェルシャーと呼ばれてますがね。浜の連中の舌が回れば、綴りどおりウィルトシャーです。何の頼みかって？　まず一つ。俺はあんたが言うなら罪人、俺が言うなら下劣な奴です。俺がだました相手に償いをしたい。その力になってもらいたいんです」"
    "translation_status": "reviewed"
  - "id": "beach-249"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He turned and spoke to his crew in the native. “And now I am at your service,” said he, “but only for the time my crew are dining. I must be much farther down the coast before night. I was delayed at Papa-Malulu till this morning, and I have an engagement in Fale-alii to-morrow night.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 258
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1393
        "line_end": 1397
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-249"
    "translation_ja": "彼は振り返り、島の言葉で舟の者たちに話した。「ではお役に立ちましょう」と彼は言った。「ただし、皆が食事をしている間だけです。日が暮れる前に、海岸沿いをずっと先まで行かねばなりません。今朝までパパ・マルルで足止めされていまして、明日の晩にはファレ・アリイで約束があるのです」"
    "translation_status": "reviewed"
  - "id": "beach-250"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I led the way to my house in silence, and rather pleased with myself for the way I had managed the talk, for I like a man to keep his self-respect."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 259
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1399
        "line_end": 1401
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-250"
    "translation_ja": "俺は黙ってうちへ案内した。話の運び方がうまくいったので、いくらか満足だった。男なら自分の誇りは捨てないでいてほしいからな。"
    "translation_status": "reviewed"
  - "id": "beach-251"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I was sorry to see you fighting,” says he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 260
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1403
        "line_end": 1403
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-251"
    "translation_ja": "「あなたが喧嘩なさるのを見て残念に思いました」と彼は言った。"
    "translation_status": "reviewed"
  - "id": "beach-252"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“O, that’s part of the yarn I want to tell you,” I said. “That’s service number two. After you’ve heard it you’ll let me know whether you’re sorry or not.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 261
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1405
        "line_end": 1407
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-252"
    "translation_ja": "「ああ、それも話したいことの一つです」と俺は言った。「二番目の頼みですよ。聞いたあとで、まだ残念に思うかどうか教えてください」"
    "translation_status": "reviewed"
  - "id": "beach-253"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We walked right in through the store, and I was surprised to find Uma had cleared away the dinner things. This was so unlike her ways that I saw she had done it out of gratitude, and liked her the better. She and Mr. Tarleton called each other by name, and he was very civil to her seemingly. But I thought little of that; they can always find civility for a Kanaka, it’s us white men they lord it over. Besides, I didn’t want much Tarleton just them. I was going to do my pitch."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 262
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1409
        "line_end": 1415
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-253"
    "translation_ja": "店を突っ切って中に入ると、驚いたことにウマが飯の食器を片づけていた。ふだんの彼女に似合わんことだから、ありがたく思ってやったんだとわかり、いっそういとおしくなった。ウマとタールトンさんは名前で呼び合い、彼は彼女にとても丁寧だったようだ。だが俺はどうもそれを買わなかった。あの連中はカナカ人にはいつだって丁寧にできる。威張る相手は俺たち白人だ。それにそのときは、タールトンさんのことは二の次だった。こっちはいよいよ肝心の話を切り出すところだ。"
    "translation_status": "reviewed"
  - "id": "beach-254"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Uma,” said I, “give us your marriage certificate.” She looked put out. “Come,” said I, “you can trust me. Hand it up.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 263
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1417
        "line_end": 1418
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-254"
    "translation_ja": "「ウマ」と俺は言った。「婚姻証書を出してくれ」。彼女は困った顔をした。「さあ、俺を信じていいんだ。渡してくれ」"
    "translation_status": "reviewed"
  - "id": "beach-255"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She had it about her person, as usual; I believe she thought it was a pass to heaven, and if she died without having it handy she would go to hell. I couldn’t see where she put it the first time, I couldn’t see now where she took it from; it seemed to jump into her hand like that Blavatsky business in the papers. But it’s the same way with all island women, and I guess they’re taught it when young."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 264
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1420
        "line_end": 1425
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-255"
    "translation_ja": "いつものように身につけていた。あれは天国への通行証で、とっさに取り出せずに死んだら地獄へ行くと思っていたらしい。初めてしまった時もどこへ入れたか見えなかったし、今どこから出したかもわからない。新聞に出ていたブラヴァツキーのあの一件みたいに、証書が彼女の手に飛び出してきたとしか思えなかった。だが島の女はみんなそうだ。子供の時に教わるんだろう。"
    "translation_status": "reviewed"
  - "id": "beach-256"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Now,” said I, with the certificate in my hand, “I was married to this girl by Black Jack the negro. The certificate was wrote by Case, and it’s a dandy piece of literature, I promise you. Since then I’ve found that there’s a kind of cry in the place against this wife of mine, and so long as I keep her I cannot trade. Now, what would any man do in my place, if he was a man?” I said. “The first thing he would do is this, I guess.” And I took and tore up the certificate and bunged the pieces on the floor."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 265
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1427
        "line_end": 1434
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-256"
    "translation_ja": "「さて」と俺は証書を手にして言った。「俺とこの娘の結婚式をやったのは、黒人のブラック・ジャックです。証書を書いたのはケイスでね、保証しますが、ちょっとした文学の傑作ですよ。それから、この女房のことで村じゅうが悪口を言っていて、こいつと一緒にいるかぎり俺は商売ができないとわかった。さて、俺の立場なら、男としてどうするか？」と俺は言った。「まずやるのは、こういうことだろうと思います」。そう言って証書を引き裂き、切れ端を床に放り投げた。"
    "translation_status": "reviewed"

          "exact": "Eugenie"
  - "id": "isle-084"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, well,” says the captain, “its steep-to, that’s the great point; and there ain’t any outlying dangers by the chart, so we’ll just hug the lee side of it. Keep her romping full, don’t I tell you!” he cried to Keola, who was listening so hard that he forgot to steer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 809
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4463
        "line_end": 4466
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-084"
    "translation_ja": "「まあ、まあ」と船長は言った。「肝心なのは岸のすぐそばまで水深があることだ。海図では沖に危ないものもないから、風下側の岸にぴったりつけていこう。帆いっぱいに風をはらませろ、さっきから言ってるだろ！」　あんまり耳を澄まして舵を忘れていたケオラに向かって怒鳴ったのだ。"
    "translation_status": "reviewed"
  - "id": "isle-085"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And the mate cursed him, and swore that Kanaka was for no use in the world, and if he got started after him with a belaying pin, it would be a cold day for Keola."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 810
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4468
        "line_end": 4470
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-085"
    "translation_ja": "航海士も彼をののしった。カナカなんぞこの世で何の役にも立ちはしねえ、綱止め棒をひっつかんで俺が追いかけたら、おまえもただではすまねえぞ、と毒づいた。"
    "translation_status": "reviewed"
  - "id": "isle-086"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And so the captain and mate lay down on the house together, and Keola was left to himself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 811
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4472
        "line_end": 4473
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-086"
    "translation_ja": "それから船長と航海士は二人して甲板室の屋根に寝転がり、ケオラは一人きりで舵を任された。"
    "translation_status": "reviewed"
  - "id": "isle-087"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This island will do very well for me,” he thought; “if no traders deal there, the mate will never come. And as for Kalamake, it is not possible he can ever get as far as this.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 812
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4475
        "line_end": 4477
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-087"
    "translation_ja": "「この島ならおれには申し分ない」と彼は思った。「交易船が来なけりゃ航海士も来ない。カラマケだって、いくらなんでもこんな遠くまで来られるもんか」"
    "translation_status": "reviewed"
  - "id": "isle-088"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that he kept edging the schooner nearer in. He had to do this quietly, for it was the trouble with these white men, and above all with the mate, that you could never be sure of them; they would all be sleeping sound, or else pretending, and if a sail shook, they would jump to their feet and fall on you with a rope’s end. So Keola edged her up little by little, and kept all drawing. And presently the land was close on board, and the sound of the sea on the sides of it grew loud."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 813
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4479
        "line_end": 4485
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-088"
    "translation_ja": "そこでケオラはじりじりとスクーナーを岸に寄せていった。気づかれないようにやらねばならなかった。この白人たち、ことに航海士の厄介なところは、いつだって油断ができないことだった。みなぐっすり寝込んだか、さもなければそのふりをしていて、帆が一つはためこうものなら跳ね起きて、ロープの端で殴りかかってくる。ケオラはどの帆にも風をはらませたまま、少しずつ船を寄せた。やがて島は船べり近くにあり、岸に打ち寄せる海の音が大きくなった。"
    "translation_status": "reviewed"
  - "id": "isle-089"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that, the mate sat up suddenly upon the house."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 814
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4487
        "line_end": 4487
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-089"
    "translation_ja": "そのとき航海士が甲板室の上でいきなり起き直った。"
    "translation_status": "reviewed"
  - "id": "isle-090"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What are you doing?” he roars. “You’ll have the ship ashore!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 815
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4489
        "line_end": 4489
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-090"
    "translation_ja": "「何してやがる！」と彼は吠えた。「船が乗り上げちまうぞ！」"
    "translation_status": "reviewed"
  - "id": "isle-091"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And he made one bound for Keola, and Keola made another clean over the rail and plump into the starry sea. When he came up again, the schooner had payed off on her true course, and the mate stood by the wheel himself, and Keola heard him cursing. The sea was smooth under the lee of the island; it was warm besides, and Keola had his sailor’s knife, so he had no fear of sharks. A little way before him the trees stopped; there was a break in the line of the land like the mouth of a harbour; and the tide, which was then flowing, took him up and carried him through. One minute he was without, and the next within: had floated there in a wide shallow water, bright with ten thousand stars, and all about him was the ring of the land, with its string of palm trees. And he was amazed, because this was a kind of island he had never heard of."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 816
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4491
        "line_end": 4502
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-091"
    "translation_ja": "ひと跳びでケオラに飛びかかった。ケオラもひと跳び、船べりを越え、星明かりの海にどぶんと落ちた。水面に顔を出すとスクーナーは船首を風下へ振って本来の進路に戻っており、航海士自身が舵輪の脇に立っていて、悪態の声が聞こえた。島の風下の海は穏やかで、水も暖かく、船乗りナイフがあるのでサメも怖くなかった。少し行くと木の列は途切れ、陸の線に港口のような切れ目が開いていた。折からの上げ潮が彼をすくって、そこを通り抜けさせた。一瞬前は外、次の瞬間は内、今や一万の星が輝く広い浅瀬に浮かんでおり、ぐるりをヤシの連なるひと輪の陸が囲んでいた。こんな島があるとは聞いたこともなかったので、彼は驚いた。"
    "translation_status": "reviewed"
  - "id": "isle-092"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The time of Keola in that place was in two periods—the period when he was alone, and the period when he was there with the tribe. At first he sought everywhere and found no man; only some houses standing in a hamlet, and the marks of fires. But the ashes of the fires were cold and the rains had washed them away; and the winds had blown, and some of the huts were overthrown. It was here he took his dwelling, and he made a fire drill, and a shell hook, and fished and cooked his fish, and climbed after green cocoanuts, the juice of which he drank, for in all the isle there was no water. The days were long to him, and the nights terrifying. He made a lamp of cocoa-shell, and drew the oil of the ripe nuts, and made a wick of fibre; and when evening came he closed up his hut, and lit his lamp, and lay and trembled till morning. Many a time he thought in his heart he would have been better in the bottom of the sea, his bones rolling there with the others."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 817
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4504
        "line_end": 4517
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-092"
    "translation_ja": "ケオラがそこで過ごした時期は二つに分かれる。一人でいた時期と、部族の者たちといた時期である。初めのうち、隅々まで捜しても人は見つからなかった。あるのは集落に立つ数軒の家と火を焚いた跡だけだった。だが灰は冷え、雨に洗い流されていた。風も吹き荒れたとみえて、小屋のいくつかは倒れていた。ここに住まいを定め、火起こしの錐と貝殻の釣り針を作り、魚を釣って焼き、木に登って青いココヤシの実を取り、その汁を飲んだ。島のどこにも飲み水はなかったからだ。日は彼には長く、夜は恐ろしかった。ヤシの殻で灯皿を作り、熟れた実から油を搾り、繊維で芯を作った。夕暮れになると小屋を閉めきり、灯をともし、朝まで横になって震えていた。海の底にいて、ほかの骨にまじって自分の骨も転がっていた方がよかったと、何度心に思ったかわからない。"
    "translation_status": "reviewed"
  - "id": "isle-093"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All this while he kept by the inside of the island, for the huts were on the shore of the lagoon, and it was there the palms grew best, and the lagoon itself abounded with good fish. And to the outer slide he went once only, and he looked but the once at the beach of the ocean, and came away shaking. For the look of it, with its bright sand, and strewn shells, and strong sun and surf, went sore against his inclination."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 818
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4519
        "line_end": 4524
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-093"
    "translation_ja": "そのあいだずっと彼がいたのは島の内側だった。小屋は潟のほとりにあり、ヤシがいちばんよく育つのもそこだったし、潟にはうまい魚がわんさといたからだ。外側に行ったのはたった一度で、外海の浜をひと目見るなり、震えながら引き返した。輝く砂、散らばる貝、強い日ざしと砕ける波、その眺めが彼にはたまらなく厭だったのだ。"
    "translation_status": "reviewed"
  - "id": "isle-094"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It cannot be,” he thought, “and yet it is very like. And how do I know? These white men, although they pretend to know where they are sailing, must take their chance like other people. So that after all we may have sailed in a circle, and I may be quite near to Molokai, and this may be the very beach where my father-in-law gathers his dollars.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 819
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4526
        "line_end": 4530
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-094"
    "translation_ja": "「そんなはずはない」と彼は思った。「でもそっくりだ。それにどうして違うと分かる？　あの白人たちはどこを航海してるか知ってるふりをしてるが、ほかの人間みたいに運任せに違いない。ひょっとすると船はぐるりと円を描いただけで、モロカイはすぐそこ、ここは義父さんが銀貨を拾うまさにあの浜なのかもしれない」"
    "translation_status": "reviewed"
  - "id": "isle-095"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So after that he was prudent, and kept to the land side."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 820
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4532
        "line_end": 4532
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-095"
    "translation_ja": "そういうわけで、それからは用心して、外海には出ず島の内側にいた。"
    "translation_status": "reviewed"
  - "id": "isle-096"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was perhaps a month later, when the people of the place arrived—the fill of six great boats. They were a fine race of men, and spoke a tongue that sounded very different from the tongue of Hawaii, but so many of the words were the same that it was not difficult to understand. The men besides were very courteous, and the women very towardly; and they made Keola welcome, and built him a house, and gave him a wife; and what surprised him the most, he was never sent to work with the young men."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 821
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4534
        "line_end": 4540
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-096"
    "translation_ja": "ひと月ほどたったころだったろうか、土地の人々がやって来た。大きな舟六艘にいっぱいの人数だった。みな立派な体つきで、ハワイの言葉とはずいぶん違う響きの言葉を話したが、同じ単語がたくさんあって、聞き取るのは難しくなかった。男たちは大変丁寧で、女たちも愛想がよかった。みんなケオラを歓迎し、彼に家を建て、妻まで娶らせてくれた。いちばん驚いたことには、若者たちと一緒に働きにやられることが一度もなかった。"
    "translation_status": "reviewed"
  - "id": "isle-097"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And now Keola had three periods. First he had a period of being very sad, and then he had a period when he was pretty merry. Last of all came the third, when he was the most terrified man in the four oceans."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 822
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4542
        "line_end": 4544
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-097"
    "translation_ja": "さてここからはケオラに三つの時期があった。最初はとても悲しい時期。次にはかなり愉快な時期。最後の第三期になると、彼は四つの大海でいちばんおびえた男になった。"
    "translation_status": "reviewed"
  - "id": "isle-098"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The cause of the first period was the girl he had to wife. He was in doubt about the island, and he might have been in doubt about the speech, of which he had heard so little when he came there with the wizard on the mat. But about his wife there was no mistake conceivable, for she was the same girl that ran from him crying in the wood. So he had sailed all this way, and might as well have stayed in Molokai; and had left home and wife and all his friends for no other cause but to escape his enemy, and the place he had come to was that wizard’s hunting ground, and the shore where he walked invisible. It was at this period when he kept the most close to the lagoon side, and as far as he dared, abode in the cover of his hut."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 823
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4546
        "line_end": 4556
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-098"
    "translation_ja": "第一の時期のもとは、彼が妻にした娘だった。島があの島かどうかには迷いがあったし、魔法使いと敷物に乗ってきたときにはほとんど聞かなかった土地の言葉についても、迷う余地があったかもしれない。だが妻になった相手については、間違いようがなかった。あのとき森で、叫びながら自分から逃げたまさにあの娘だった。これほどの道のりを航海してきたのに、モロカイにとどまったのと同じことだったのだ。敵を逃れたい一心で家も妻も友達もすべて置いてきたのに、着いた先は当の魔法使いの猟場であり、やつが姿を消して歩く浜だった。この時期の彼は特に潟の側を離れず、できるだけ小屋の中に身を隠していた。"
    "translation_status": "reviewed"
  - "id": "isle-099"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The cause of the second period was talk he heard from his wife and the chief islanders. Keola himself said little. He was never so sure of his new friends, for he judged they were too civil to be wholesome, and since he had grown better acquainted with his father-in-law the man had grown more cautious. So he told them nothing of himself, but only his name and descent, and that he came from the Eight Islands, and what fine islands they were; and about the king’s palace in Honolulu, and how he was a chief friend of the king and the missionaries. But he put many questions and learned much. The island where he was was called the Isle of Voices; it belonged to the tribe, but they made their home upon another, three hours’ sail to the southward. There they lived and had their permanent houses, and it was a rich island, where were eggs and chickens and pigs, and ships came trading with rum and tobacco. It was there the schooner had gone after Keola deserted; there, too, the mate had died, like the fool of a white man as he was. It seems, when the ship came, it was the beginning of the sickly season in that isle, when the fish of the lagoon are poisonous, and all who eat of them swell up and die. The mate was told of it; he saw the boats preparing, because in that season the people leave that island and sail to the Isle of Voices; but he was a fool of a white man, who would believe no stories but his own, and he caught one of these fish, cooked it and ate it, and swelled up and died, which was good news to Keola. As for the Isle of Voices, it lay solitary the most part of the year; only now and then a boat’s crew came for copra, and in the bad season, when the fish at the main isle were poisonous, the tribe dwelt there in a body. It had its name from a marvel, for it seemed the seaside of it was all beset with invisible devils; day and night you heard them talking one with another in strange tongues; day and night little fires blazed up and were extinguished on the beach; and what was the cause of these doings no man might conceive. Keola asked them if it were the same in their own island where they stayed, and they told him no, not there; nor yet in any other of some hundred isles that lay all about them in that sea; but it was a thing peculiar to the Isle of Voices. They told him also that these fires and voices were ever on the seaside and in the seaward fringes of the wood, and a man might dwell by the lagoon two thousand years (if he could live so long) and never be any way troubled; and even on the seaside the devils did no harm if let alone. Only once a chief had cast a spear at one of the voices, and the same night he fell out of a cocoanut palm and was killed."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 824
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4558
        "line_end": 4595
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-099"
    "translation_ja": "第二の時期をもたらしたのは、妻や島の主だった人々の話だった。ケオラ自身はあまりしゃべらなかった。新しい友人たちを信用しきってはいなかった。親切が度を越していてかえって怪しいと思ったし、義父の人となりを深く知って以来、以前より用心深い男になっていた。そこで自分のことは何も明かさず、名と家柄、それに八つの島々から来たこと、その島々がいかに立派か、ホノルルにある王の宮殿のこと、王や宣教師たちと自分が格別の親友であること、それだけを話した。だが質問は多くし、いろいろ分かった。ここは「声の島」といい、一族の領分だが、本拠はそこから帆走で南へ三時間の別の島にあった。普段の家を構えて暮らしているのはそちらだった。卵も鶏も豚もあり、ラム酒と煙草を商いに船も寄る、豊かな島だという。ケオラが逃げたあとのスクーナーもそこへ行った。航海士はそこで死んだ。いかにもあの白人のばか者らしい死に方だった。船が着いたのは、その島で潟の魚が毒を持ち、それを食べた者は皆ふくれ上がって死ぬ、病の季節の始まりだったという。注意はされたし、皆が舟の支度をするのも見た。その季節には人々は島を出て「声の島」へ渡るのだ。だが自分の話しか信じない白人のばか者だったから、その魚を自分で一匹釣って煮て食べ、ふくれ上がって死んだ。ケオラには吉報だった。「声の島」の方は一年の大半は無人で、時折コプラを取りに舟が一艘来るくらいだったが、本島の魚が毒を持つ悪い季節だけは部族がこぞってここで暮らした。「声の島」という名はある怪異に由来した。外海に面した側は、隅から隅まで目に見えぬ悪魔に取りつかれているらしかった。昼も夜も聞いたこともない言葉で互いに話す声がし、昼も夜も浜では小さな火が燃え上がっては消えた。なぜそんなことをするのか誰にも考えつかなかった。普段住んでいる方の島でも同じなのかとケオラがたずねると、そこではないと言った。その海に散らばる百ほどの島の、ほかのどこにもない。「声の島」だけのことだった。そして火も声も現れるのはいつも外海側、せいぜい森の海側の縁までだった。潟に住めば、かりにそれだけ生きられるとして、二千年いたって何ひとつ困らない。外海側ですら、手を出さなければ悪魔は何もしない。ただ一度、ある首長が声の一つに槍を投げたことがあり、その夜ココヤシから落ちて死んだという。"
    "translation_status": "reviewed"
  - "id": "isle-100"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Keola thought a good bit with himself. He saw he would be all right when the tribe returned to the main island, and right enough where he was, if he kept by the lagoon, yet he had a mind to make things righter if he could. So he told the high chief he had once been in an isle that was pestered the same way, and the folk had found a means to cure that trouble."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 825
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4597
        "line_end": 4602
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-100"
    "translation_ja": "ケオラは独りでずいぶん考えた。部族が本島に戻ったら自分も大丈夫。ここにいるうちだって潟にいたら十分大丈夫だとはわかった。それでもできればもっと大丈夫にしておきたかった。そこで大首長に、かつてこれと同じことに悩む島にいたことがあるのだが、島民はその厄介を払う方法を見つけた、と話した。"
    "translation_status": "reviewed"
  - "id": "isle-101"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There was a tree growing in the bush there,” says he, “and it seems these devils came to get the leaves of it. So the people of the isle cut down the tree wherever it was found, and the devils came no more.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 826
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4604
        "line_end": 4606
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-101"
    "translation_ja": "「あそこの藪にはある木が生えていましてね」とケオラは言った。「どうも悪魔どもはその葉を採りに来ていたらしいんです。そこで島の人たちがどこでもその木を見つけ次第切り倒したら、悪魔どもはもう来なくなりました」"
    "translation_status": "reviewed"
  - "id": "isle-102"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They asked what kind of tree this was, and he showed them the tree of which Kalamake burned the leaves. They found it hard to believe, yet the idea tickled them. Night after night the old men debated it in their councils, but the high chief (though he was a brave man) was afraid of the matter, and reminded them daily of the chief who cast a spear against the voices and was killed, and the thought of that brought all to a stand again."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 827
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4608
        "line_end": 4614
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-102"
    "translation_ja": "どんな木かと聞かれ、カラマケが葉を燃やしたあの木を示した。にわかには信じられなかったが、その考えには大いに心をくすぐられた。来る夜も来る夜も老人たちは寄り合いで論じ合ったが、大首長は勇敢な男ながらこの一件を恐れていた。声めがけて槍を投げて死んだ首長を毎日引き合いに出すので、それを思うたびに話はまた振り出しに戻った。"
    "translation_status": "reviewed"
  - "id": "isle-103"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Though he could not yet bring about the destruction of the trees, Keola was well enough pleased, and began to look about him and take pleasure in his days; and, among other things, he was the kinder to his wife, so that the girl began to love him greatly. One day he came to the hut, and she lay on the ground lamenting."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 828
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4616
        "line_end": 4620
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-103"
    "translation_ja": "まだ木を切り払わせるまでには至らなかったが、ケオラはそれでまずまず満足だった。身のまわりに目を配り、日々を楽しむようになった。なかでも妻に前より優しくしたので、娘は夫を深く愛するようになった。ある日小屋に帰ってみると、妻は地べたに突っ伏して嘆いていた。"
    "translation_status": "reviewed"
  - "id": "isle-104"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Why,” said Keola, “what is wrong with you now?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 829
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4622
        "line_end": 4622
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-104"
    "translation_ja": "「おや」とケオラは言った。「今度はいったいどうしたんだ？」"
    "translation_status": "reviewed"
  - "id": "isle-105"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She declared it was nothing."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 830
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4624
        "line_end": 4624
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-105"
    "translation_ja": "なんでもない、と彼女は言い張った。"
    "translation_status": "reviewed"
  - "id": "isle-106"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The same night she woke him. The lamp burned very low, but he saw by her face she was in sorrow."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 831
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4626
        "line_end": 4627
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-106"
    "translation_ja": "その晩、彼女は夫を起こした。灯はかすかだったが、顔を見れば悲しんでいることはわかった。"
    "translation_status": "reviewed"
  - "id": "isle-107"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Keola,” she said, “put your ear to my mouth that I may whisper, for no one must hear us. Two days before the boats begin to be got ready, go you to the sea-side of the isle and lie in a thicket. We shall choose that place before-hand, you and I; and hide food; and every night I shall come near by there singing. So when a night comes and you do not hear me, you shall know we are clean gone out of the island, and you may come forth again in safety.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 832
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4629
        "line_end": 4635
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-107"
    "translation_ja": "「ケオラ」と彼女は言った。「ささやけるように耳を私の口につけて。誰にも聞かれてはいけないの。舟の支度が始まる二日前に、あなたは島の外海側へ行って藪に隠れなさい。先に二人で場所を決めて、食べ物も隠しておきましょう。私は毎晩その近くまで行って歌う。ある晩、私の歌が聞こえなかったら、みんながすっかり島を出ていったしるし。それからなら出てきても安全よ」"
    "translation_status": "reviewed"
  - "id": "isle-108"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The soul of Keola died within him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 833
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4637
        "line_end": 4637
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-108"
    "translation_ja": "ケオラの胸は凍りついた。"
    "translation_status": "reviewed"
  - "id": "isle-109"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What is this?” he cried. “I cannot live among devils. I will not be left behind upon this isle. I am dying to leave it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 834
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4639
        "line_end": 4640
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-109"
    "translation_ja": "「どういうことだ」と彼は叫んだ。「悪魔に交じって暮らせるものか。この島に置き去りになんかなれない。一刻も早くここを出たいんだ」"
    "translation_status": "reviewed"
  - "id": "isle-110"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You will never leave it alive, my poor Keola,” said the girl; “for to tell you the truth, my people are eaters of men; but this they keep secret. And the reason they will kill you before we leave is because in our island ships come, and Donat-Kimaran comes and talks for the French, and there is a white trader there in a house with a verandah, and a catechist. Oh, that is a fine place indeed! The trader has barrels filled with flour, and a French warship once came in the lagoon and gave everybody wine and biscuit. Ah, my poor Keola, I wish I could take you there, for great is my love to you, and it is the finest place in the seas except Papeete.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 835
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4642
        "line_end": 4651
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-110"
    "translation_ja": "「生きてここを出ることはできないわ、かわいそうなケオラ」と娘は言った。「本当のことを言うと、私の一族は人を食べるの。でもそれは秘密にしているのよ。出発の前にあなたを殺すのは、私たちの島には船が来るし、ドナ・キマランが来てフランス人の代わりに話をするし、ベランダつきの家には白人の商人が住んでいて、教理を教える人もいるからなの。まあ本当に立派なところよ！　商人のおうちには小麦粉をいっぱい詰めた樽がいくつもあるし、フランスの軍艦が潟に入って、みんなにぶどう酒と乾パンをくれたことだってあるのよ。ああ、かわいそうなケオラ、あなたを連れていけたらいいのに。私はあなたがとても好きだし、パペーテを別にすればあそこは海でいちばん立派な土地だから」"
    "translation_status": "reviewed"
  - "id": "isle-111"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So now Keola was the most terrified man in the four oceans. He had heard tell of eaters of men in the south islands, and the thing had always been a fear to him; and here it was knocking at his door. He had heard besides, by travellers, of their practices, and how when they are in a mind to eat a man, they cherish and fondle him like a mother with a favourite baby. And he saw this must be his own case; and that was why he had been housed, and fed, and wived, and liberated from all work; and why the old men and the chiefs discoursed with him like a person of weight. So he lay on his bed and railed upon his destiny; and the flesh curdled on his bones."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 836
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4653
        "line_end": 4662
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-111"
    "translation_ja": "さてこれでケオラは四つの大海でいちばんおびえた男になった。南の島々に人食いがいると聞き、前々から恐れていたものが、まさに彼の戸口をたたいていた。旅人からその習わしについても聞いたことがあった。人間を一人食べることに決めると、母親がいちばんかわいい赤ん坊にするように大事にし、ちやほやするのだという。なるほど自分がその赤ん坊なのだ。それで家をあてがわれ、食べ物を与えられ、妻をもらい、ありとあらゆる労働を免除され、老人や首長たちが身分の重い者のように話しかけてきたのだとわかった。彼は寝床に横たわり、わが運命を罵った。骨を包む肉まで縮み上がった。"
    "translation_status": "reviewed"
  - "id": "isle-112"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The next day the people of the tribe were very civil, as their way was. They were elegant speakers, and they made beautiful poetry, and jested at meals, so that a missionary must have died laughing. It was little enough Keola cared for their fine ways; all he saw was the white teeth shining in their mouths, and his gorge rose at the sight; and when they were done eating, he went and lay in the bush like a dead man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 837
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4664
        "line_end": 4669
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-112"
    "translation_ja": "翌日も一族の者たちはいつものようにいとも愛想がよかった。話しぶりは上品で、美しい詩を作り、食事どきの冗談ときたら宣教師だって笑い死にしそうだった。ケオラはその洗練された振舞いなどどうでもよかった。目に入るのはみなの口の中にきらめく白い歯だけで、それを見ると吐き気がした。食事が終わると藪へ入って、死人のように横たわった。"
    "translation_status": "reviewed"
  - "id": "isle-113"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The next day it was the same, and then his wife followed him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 838
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4671
        "line_end": 4671
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-113"
    "translation_ja": "翌日もまた同じだったが、その日は妻が追ってきた。"
    "translation_status": "reviewed"
  - "id": "isle-114"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Keola,” she said, “if you do not eat, I tell you plainly you will be killed and cooked to-morrow. Some of the old chiefs are murmuring already. They think you are fallen sick and must lose flesh.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 839
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4673
        "line_end": 4675
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-114"
    "translation_ja": "「ケオラ」と彼女は言った。「はっきり言うけど、食べなかったら明日には殺されて料理されてしまうわ。年寄りの首長はもう何人かぶつぶつ言ってる。病気でこれから肉が落ちると思っているのよ」"
    "translation_status": "reviewed"
  - "id": "isle-115"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that Keola got to his feet, and anger burned in him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 840
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4677
        "line_end": 4677
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-115"
    "translation_ja": "それを聞いてケオラは立ち上がった。怒りが腹の中で燃えていた。"
    "translation_status": "reviewed"
  - "id": "isle-116"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It is little I care one way or the other,” said he. “I am between the devil and the deep sea. Since die I must, let me die the quickest way; and since I must be eaten at the best of it, let me rather be eaten by hobgoblins than by men. Farewell,” said he, and he left her standing, and walked to the sea-side of that island."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 841
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4679
        "line_end": 4683
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-116"
    "translation_ja": "「もう、どっちに転んだって大してかまやしない」と彼は言った。「おれは悪魔と深い海の板挟みだ。どうせ死ぬならいちばん早い死に方をしよう。どう転んでも食われるのなら、人間に食われるよりも化け物に食われよう。さようなら」。そう言って妻をその場に残し、島の外海側へ歩いた。"
    "translation_status": "reviewed"
  - "id": "isle-117"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was all bare in the strong sun; there was no sign of man, only the beach was trodden, and all about him as he went, the voices talked and whispered, and the little fires sprang up and burned down. All tongues of the earth were spoken there; the French, the Dutch, the Russian, the Tamil, the Chinese. Whatever land knew sorcery, there were some of its people whispering in Keola’s ear. That beach was thick as a cried fair, yet no man seen; and as he walked he saw the shells vanish before him, and no man to pick them up. I think the devil would have been afraid to be alone in such a company; but Keola was past fear and courted death. When the fires sprang up, he charged for them like a bull. Bodiless voices called to and fro; unseen hands poured sand upon the flames; and they were gone from the beach before he reached them."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 842
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4685
        "line_end": 4696
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-117"
    "translation_ja": "強い日ざしの中、すっかりむき出しの浜だった。人影はなかった。ただし浜は踏みしだかれ、歩いていく彼のまわりでは声という声が話し、ささやき、小さな火がいくつも燃え立っては消えた。地上のあらゆる言葉がそこで話されていた。フランス語、オランダ語、ロシア語、タミル語、中国語。魔術を知る国なら、その国の者がいくらかはケオラの耳もとでささやいていた。呼び声の飛ぶ縁日のように混雑した浜なのに、人は一人も見えなかった。歩いていく目の前で貝は消えるのに、拾う人はいない。悪魔でさえ、こんな連中の中に一人でいたら怖かったろうと思う。だがケオラは怖がるところを通り越し、自ら死を招こうとしていた。火が上がるたび牡牛のようにそこへ突進した。姿のない声が呼び交わし、見えない手が炎に砂をかけた。彼がたどり着く前には、もう浜から消えていた。"
    "translation_status": "reviewed"
  - "id": "isle-118"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It is plain Kalamake is not here,” he thought, “or I must have been killed long since.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 843
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4698
        "line_end": 4699
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-118"
    "translation_ja": "「カラマケがここにいないのは明らかだ」と彼は思った。「いたらとっくにおれは殺されている」"
    "translation_status": "reviewed"
  - "id": "isle-119"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that he sat him down in the margin of the wood, for he was tired, and put his chin upon his hands. The business before his eyes continued: the beach babbled with voices, and the fires sprang up and sank, and the shells vanished and were renewed again even while he looked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 844
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4701
        "line_end": 4704
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-119"
    "translation_ja": "そのうち疲れて、森の縁に腰を下ろし、両手にあごを載せた。目の前では同じ営みがつづいていた。浜は声のおしゃべりでにぎわい、火は上がっては衰え、見ている間にも貝は消えてはまた補われた。"
    "translation_status": "reviewed"
  - "id": "isle-120"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It was a by-day when I was here before,” he thought, “for it was nothing to this.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 845
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4706
        "line_end": 4707
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-120"
    "translation_ja": "「前に来たのは暇な日だったんだ」と彼は思った。「今と比べたら何でもなかった」"
    "translation_status": "reviewed"
  - "id": "isle-121"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And his head was dizzy with the thought of these millions and millions of dollars, and all these hundreds and hundreds of persons culling them upon the beach and flying in the air higher and swifter than eagles."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 846
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4709
        "line_end": 4711
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-121"
    "translation_ja": "何百万、また何百万ものドルと、それを浜で拾い集め、鷲よりも高く速く空を飛ぶ何百人、また何百人もの人間を思うと、彼の頭はくらくらした。"
    "translation_status": "reviewed"
  - "id": "isle-122"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And to think how they have fooled me with their talk of mints,” says he, “and that money was made there, when it is clear that all the new coin in all the world is gathered on these sands! But I will know better the next time!” said he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 847
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4713
        "line_end": 4716
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-122"
    "translation_ja": "「よくも造幣所なんて話でおれをだましてくれたな。お金はそこで造るって言ったけれど、世界じゅうの新しい硬貨はみんな、この砂浜で拾うんじゃないか。次はそうはいかないぞ！」と彼はつぶやいた。"
    "translation_status": "reviewed"
  - "id": "isle-123"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And at last, he knew not very well how or when, sleep feel on Keola, and he forgot the island and all his sorrows."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 848
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4718
        "line_end": 4719
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-123"
    "translation_ja": "やがて、いつ、どう眠ったか自分でもよくわからぬまま、ケオラは眠りに落ち、島も悲しみも何もかも忘れた。"
    "translation_status": "reviewed"
  - "id": "isle-124"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Early the next day, before the sun was yet up, a bustle woke him. He awoke in fear, for he thought the tribe had caught him napping: but it was no such matter. Only, on the beach in front of him, the bodiless voices called and shouted one upon another, and it seemed they all passed and swept beside him up the coast of the island."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 849
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4721
        "line_end": 4725
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-124"
    "translation_ja": "翌朝早く、まだ日が昇らぬうちに騒がしい音で目が覚めた。部族の連中に寝込みを襲われたのかと思い、おびえて飛び起きたが、そんなことではなかった。ただ目の前の浜で姿のない声が次々と呼び、わめいていた。みな彼の脇をさっと通り過ぎ、岸に沿って島の先へ向かうようだった。"
    "translation_status": "reviewed"
  - "id": "isle-125"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What is afoot now?” thinks Keola. And it was plain to him it was something beyond ordinary, for the fires were not lighted nor the shells taken, but the bodiless voices kept posting up the beach, and hailing and dying away; and others following, and by the sound of them these wizards should be angry."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 850
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4727
        "line_end": 4731
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-125"
    "translation_ja": "「今度はいったい何事だ？」とケオラは思った。普通でない何かが起きているのは明らかだった。火はつかず、貝も拾われない。姿のない声ばかりが浜をひた走り、呼びかけては遠ざかり、また別の声がそれに続いた。声からすればこの魔法使いどもは腹を立てているに違いなかった。"
    "translation_status": "reviewed"
  - "id": "isle-126"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It is not me they are angry at,” thought Keola, “for they pass me close.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 851
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4733
        "line_end": 4734
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-126"
    "translation_ja": "「おれに腹を立ててるんじゃない」とケオラは思った。「こんなにすぐそばを通り過ぎていく」"
    "translation_status": "reviewed"
  - "id": "isle-127"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As when hounds go by, or horses in a race, or city folk coursing to a fire, and all men join and follow after, so it was now with Keola; and he knew not what he did, nor why he did it, but there, lo and behold! he was running with the voices."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 852
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4736
        "line_end": 4739
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-127"
    "translation_ja": "猟犬の一団や競走馬が通り過ぎたり、町の人が火事場へ駆けていったりすると、誰も彼もがつられてあとを追う。今のケオラもそうだった。何をしているのか、なぜそうするのかわからぬまま、どうだろう、気がつけば声と一緒に走っていた。"
    "translation_status": "reviewed"
  - "id": "isle-128"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So he turned one point of the island, and this brought him in view of a second; and there he remembered the wizard trees to have been growing by the score together in a wood. From this point there went up a hubbub of men crying not to be described; and by the sound of them, those that he ran with shaped their course for the same quarter. A little nearer, and there began to mingle with the outcry the crash of many axes. And at this a thought came at last into his mind that the high chief had consented; that the men of the tribe had set-to cutting down these trees; that word had gone about the isle from sorcerer to sorcerer, and these were all now assembling to defend their trees. Desire of strange things swept him on. He posted with the voices, crossed the beach, and came into the borders of the wood, and stood astonished. One tree had fallen, others were part hewed away. There was the tribe clustered. They were back to back, and bodies lay, and blood flowed among their feet. The hue of fear was on all their faces; their voices went up to heaven shrill as a weasel’s cry."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 853
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4741
        "line_end": 4756
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-128"
    "translation_ja": "島の岬を一つ回ると、次の岬が見渡せた。そこには魔法の木が何十本もまとまって林をなしていたのを思い出した。その岬からは形容のしようもない人間の叫喚が上がっていた。物音からすれば彼と走る者たちもそちらへ向かっていた。もう少し近づくと、叫びに交じってたくさんの斧の打ち込まれる音が響き始めた。ようやくケオラは思い当たった。大首長が承知したのだ。一族の男たちが木を切り倒しにかかり、魔法使いから魔法使いへと島じゅうに知らせが飛んで、今みな自分たちの木を守りに集まっているのだ。珍しいことを見たい思いに駆られ、彼は声と一緒に急ぎ、浜を横切り、森の際へ入って、仰天して立ち止まった。木が一本倒れ、ほかにも何本か半ばまで斧が入っていた。一族はそこにかたまっていた。背中合わせに立ち、足もとには体が倒れ、血が流れていた。恐怖の色が全員の顔をおおい、声はイタチの叫びのように甲高く天まで突き上がった。"
    "translation_status": "reviewed"
  - "id": "isle-129"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Have you seen a child when he is all alone and has a wooden sword, and fights, leaping and hewing with the empty air? Even so the man-eaters huddled back to back, and heaved up their axes, and laid on, and screamed as they laid on, and behold! no man to contend with them! only here and there Keola saw an axe swinging over against them without hands; and time and again a man of the tribe would fall before it, clove in twain or burst asunder, and his soul sped howling."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 854
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4758
        "line_end": 4764
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-129"
    "translation_ja": "子供が一人ぼっちのときに木の剣を持ち、跳ね回って空を切りつけながら戦うのを見たことがあるだろうか。まったくそれと同じように、人食いたちは背中合わせに身を寄せ、斧を振りかぶり、打ち込み、打ち込んでは悲鳴をあげた。しかも、どうだろう、戦う相手など一人も見えない！　ただそこここでケオラには、人食いたちに向かって振るう者の姿もなく斧だけが振り下ろされるのが見えた。そのたびに誰かが斧の前に倒れ、真っ二つに割られ、あるいは引き裂かれ、魂が泣き叫びながら飛び去った。"
    "translation_status": "reviewed"
  - "id": "isle-130"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For awhile Keola looked upon this prodigy like one that dreams, and then fear took him by the midst as sharp as death, that he should behold such doings. Even in that same flash the high chief of the clan espied him standing, and pointed and called out his name. Thereat the whole tribe saw him also, and their eyes flashed, and their teeth clashed."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 855
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4766
        "line_end": 4770
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-130"
    "translation_ja": "しばらくケオラは夢の中にいるようにこの怪異を見ていた。やがてこの光景に、死ぬかと思うほど鋭い恐怖を覚え、腹のあたりを締めつけられた。ちょうどその瞬間、一族の大首長がそこに立つ彼を見つけ、指をさして名前を叫んだ。一族もみな彼を見た。目がぎらつき、歯がかちかち鳴った。"
    "translation_status": "reviewed"
  - "id": "isle-131"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I am too long here,” thought Keola, and ran further out of the wood and down the beach, not caring whither."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 856
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4772
        "line_end": 4773
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-131"
    "translation_ja": "「ここに長居しすぎた」とケオラは思った。森から遠ざかり、行く先もかまわず浜を駆けた。"
    "translation_status": "reviewed"
  - "id": "isle-132"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Keola!” said, a voice close by upon the empty sand."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 857
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4775
        "line_end": 4775
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-132"
    "translation_ja": "「ケオラ！」　人のいない砂の上で、すぐそばから声がした。"
    "translation_status": "reviewed"
  - "id": "isle-133"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Lehua! is that you?” he cried, and gasped, and looked in vain for her; but by the eyesight he was stark alone."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 858
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4777
        "line_end": 4778
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-133"
    "translation_ja": "「レフア！　おまえなのか？」と彼は叫んだ。息をのみ、いくら妻の姿を探しても見つからない。目に見えるかぎり、まったくの一人だった。"
    "translation_status": "reviewed"
  - "id": "isle-134"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I saw you pass before,” the voice answered: “but you would not hear me. Quick! get the leaves and the herbs, and let us free.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 859
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4780
        "line_end": 4781
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-134"
    "translation_ja": "「さっきもあなたが通るのが見えたわ」と声が答えた。「でも呼んでも聞いてくれなかった。早く！　木の葉と薬草を取って、さあ逃げましょう」"
    "translation_status": "reviewed"
  - "id": "isle-135"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You are there with the mat?” he asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 860
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4783
        "line_end": 4783
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-135"
    "translation_ja": "「そこに敷物を持ってるのか？」と彼はたずねた。"
    "translation_status": "reviewed"
  - "id": "isle-136"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Here, at your side;” said she. And he felt her arms about him. “Quick! the leaves and the herbs, before my father can get back!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 861
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4785
        "line_end": 4786
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-136"
    "translation_ja": "「ここよ、あなたのすぐ横」と彼女は言った。妻の腕が自分を抱くのを感じた。「早く！　父が戻ってしまわないうちに、木の葉と薬草を！」"
    "translation_status": "reviewed"
  - "id": "isle-137"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So Keola ran for his life, and fetched the wizard fuel; and Lehua guided him back, and set his feet upon the mat, and made the fire. All the time of its burning, the sound of the battle towered out of the wood; the wizards and the man-eaters hard at fight; the wizards, the viewless ones, roaring out aloud like bulls upon a mountain, and the men of the tribe replying shrill and savage out of the terror of their souls. And all the time of the burning, Keola stood there and listened, and shook, and watched how the unseen hands of Lehua poured the leaves. She poured them fast, and the flame burned high, and scorched Keola’s hands; and she speeded and blew the burning with her breath. The last leaf was eaten, the flame fell, and the shock followed, and there were Keola and Lehua in the room at home."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 862
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4788
        "line_end": 4799
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-137"
    "translation_ja": "ケオラは命がけで走り、魔術の燃料を取ってきた。レフアは彼を導き戻し、敷物の上に足を置かせ、火をつけた。それが燃えるあいだじゅう、戦いの音が森からそびえ立つように上がった。魔法使いと人食いが激しく争っていた。姿の見えない魔法使いたちは山の牡牛のように声を張り上げて吠え、一族の男たちは魂の底の恐怖を甲高い荒々しい叫びにして応じた。火の燃えるあいだじゅう、ケオラはそこに立ち、耳を澄ませ、震えながら、レフアの見えない手が火に葉をくべるのを見た。彼女は次々と葉をくべ、炎は高く燃え上がってケオラの手を焦がした。彼女は急ぎ、自分の息で火をあおった。最後の一葉が食い尽くされ、炎が落ち、衝撃が走った。そしてケオラとレフアはわが家の部屋にいた。"
    "translation_status": "reviewed"
  - "id": "isle-138"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now, when Keola could see his wife at last he was mighty pleased, and he was mighty pleased to be home again in Molokai and sit down beside a bowl of poi—for they make no poi on board ships, and there was none in the Isle of Voices—and he was out of the body with pleasure to be clean escaped out of the hands of the eaters of men. But there was another matter not so clear, and Lehua and Keola talked of it all night and were troubled. There was Kalamake left upon the isle. If, by the blessing of God, he could but stick there, all were well; but should he escape and return to Molokai, it would be an ill day for his daughter and her husband. They spoke of his gift of swelling, and whether he could wade that distance in the seas. But Keola knew by this time where that island was—and that is to say, in the Low or Dangerous Archipelago. So they fetched the atlas and looked upon the distance in the map, and by what they could make of it, it seemed a far way for an old gentleman to walk. Still, it would not do to make too sure of a warlock like Kalamake, and they determined at last to take counsel of a white missionary."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 863
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4801
        "line_end": 4816
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-138"
    "translation_ja": "ようやく妻の姿が見えるとケオラはたいそう嬉しかった。モロカイの家に帰り、ポイの鉢を前に座れるのもたいそう嬉しかった。船ではポイは作らないし、「声の島」にもなかったからだ。人食いたちの手をすっかり逃れたことは、嬉しさに身が宙に浮くほどだった。だがもう一件、そうすっきりしないことが残っていて、レフアとケオラは夜どおしそのことを話して悩んだ。カラマケがまだ島に残っていたのだ。神の恵みであそこに足止めされたままなら申し分ない。だが逃げ出してモロカイへ戻ったら、娘とその夫には災難の一日となる。途方もなく膨らめる術と、それであれだけの距離を海中を歩いて来られるかどうかを話し合った。もっとも今ではケオラは、あの島がどこにあるのか知っていた。すなわち低諸島またの名を危険群島と呼ばれるところだ。そこで地図帳を取ってきて地図で道のりを見てみると、二人に読み取れるかぎりでは、年配の紳士が歩くにはずいぶん遠いようだった。しかしカラマケほどの魔法使いを甘く見るわけにもいかない。最後には白人の宣教師の知恵を借りることにした。"
    "translation_status": "reviewed"
  - "id": "isle-139"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So the first one that came by, Keola told him everything. And the missionary was very sharp on him for taking the second wife in the low island; but for all the rest, he vowed he could make neither head nor tail of it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 864
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4818
        "line_end": 4821
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-139"
    "translation_ja": "それで最初に通りかかった宣教師に、ケオラは残らず話した。宣教師は、低諸島の島で二人目の妻を持ったことについてはケオラをたいそう厳しくとがめたが、ほかはすべて、てんで訳がわからないと断言した。"
    "translation_status": "reviewed"
  - "id": "isle-140"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“However,” says he, “if you think this money of your father’s ill gotten, my advice to you would be, give some of it to the lepers and some to the missionary fund. And as for this extraordinary rigmarole, you cannot do better than keep it to yourselves.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 865
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4823
        "line_end": 4826
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-140"
    "translation_ja": "「とはいえ」と宣教師は言った。「お父上のお金の出どころがよくないと思うのでしたら、いくらかはハンセン病の患者さんたちに、いくらかは伝道基金に寄付しなさい、とお勧めします。それから、この途方もなく込み入った話は、お二人の胸の内にしまっておくのが何よりです」"
    "translation_status": "reviewed"
  - "id": "isle-141"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But he warned the police at Honolulu that, by all he could make out, Kalamake and Keola had been coining false money, and it would not be amiss to watch them."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 866
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4828
        "line_end": 4830
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-141"
    "translation_ja": "だが彼はホノルルの警察に、自分に分かったかぎりではカラマケとケオラは贋金を造っていたらしい、目をつけておいて損はなかろう、と注意しておいた。"
    "translation_status": "reviewed"
  - "id": "isle-142"
    "section_id": "isle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Keola and Lehua took his advice, and gave many dollars to the lepers and the fund. And no doubt the advice must have been good, for from that day to this, Kalamake has never more been heard of. But whether he was slain in the battle by the trees, or whether he is still kicking his heels upon the Isle of Voices, who shall say?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 867
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 4832
        "line_end": 4836
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "isle-142"
    "translation_ja": "ケオラとレフアはその助言に従い、患者たちと基金にたくさんのドルを寄付した。助言は確かに正しかったに違いない。その日から今日までカラマケの消息は二度と聞かれていないのだから。だが彼があの木々のそばの戦いで討たれたのか、それとも今なお「声の島」で手持ちぶさたに日を送っているのか。誰にわかるだろう？"
    "translation_status": "reviewed"

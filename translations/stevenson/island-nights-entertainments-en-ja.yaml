    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-130"
    "translation_ja": "ケイスは笑い、店からランタンを一つ取って村へ出かけた。いなくなっていたのは十五分ほどだろうか。帰ってきた時はえらく真剣な顔をしていた。"
    "translation_status": "reviewed"
  - "id": "beach-131"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” said he, clapping down the lantern on the verandah steps, “I would never have believed it. I don’t know where the impudence of these Kanakas ’ll go next; they seem to have lost all idea of respect for whites. What we want is a man-of-war—a German, if we could—they know how to manage Kanakas.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 140
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 841
        "line_end": 845
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-131"
    "translation_ja": "「いや」と言って縁廊の段にどんとランタンを置いた。「まさかこんなことがあるとは。あのカナカ人どもの厚かましさは、この先どこまで行くんだろう。白人に敬意を払うなんてことはすっかり忘れたようだ。軍艦が一隻必要だな。できればドイツのがいい。あいつらはカナカ人のあしらい方を心得てる」"
    "translation_status": "reviewed"

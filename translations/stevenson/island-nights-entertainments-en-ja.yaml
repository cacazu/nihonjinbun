          "exact": "aitus"
  - "id": "beach-459"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The night birds stopped after a while; and then the light began to change, the east came orange, the whole wood began to whirr with singing like a musical box, and there was the broad day."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 468
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2701
        "line_end": 2703
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-459"
    "translation_ja": "そのうち夜の鳥が鳴きやんだ。それから光が変わり始め、東の空が橙色になり、森じゅうがオルゴールみたいに鳥の歌で鳴りだした。とうとうすっかり夜が明けた。"
    "translation_status": "reviewed"
  - "id": "beach-460"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I didn’t expect Maea for a long while yet; and, indeed, I thought there was an off-chance he might go back on the whole idea and not come at all. I was the better pleased when, about an hour after daylight, I heard sticks smashing and a lot of Kanakas laughing, and singing out to keep their courage up. Uma sat up quite brisk at the first word of it; and presently we saw a party come stringing out of the path, Maea in front, and behind him a white man in a pith helmet. It was Mr. Tarleton, who had turned up late last night in Falesá, having left his boat and walked the last stage with a lantern."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 469
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2705
        "line_end": 2713
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-460"
    "translation_ja": "マエアが来るまでにはまだ間があると思っていた。ひょっとすると考えをすっかり変えて、来ないことだってありうると思ったくらいだ。それで日の出から一時間ほどしたころ、枝をばきばき折る音と、大勢のカナカ人が勇気を出すために笑ったり大声を上げたりするのが聞こえたときには、なおさらうれしかった。声がするとウマはたちまちしゃんとして起き上がった。やがて一行が小道からぞろぞろ現れた。先頭にマエア、その後ろに熱帯帽をかぶった白人がいる。タールトンさんだった。舟を降りて最後の道のりをランプを頼りに歩き、昨夜遅くファレサーに着いたのだという。"
    "translation_status": "reviewed"
  - "id": "beach-461"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They buried Case upon the field of glory, right in the hole where he had kept the smoking head. I waited till the thing was done; and Mr. Tarleton prayed, which I thought tomfoolery, but I’m bound to say he gave a pretty sick view of the dear departed’s prospects, and seemed to have his own ideas of hell. I had it out with him afterwards, told him he had scamped his duty, and what he had ought to have done was to up like a man and tell the Kanakas plainly Case was damned, and a good riddance; but I never could get him to see it my way. Then they made me a litter of poles and carried me down to the station. Mr. Tarleton set my leg, and made a regular missionary splice of it, so that I limp to this day. That done, he took down my evidence, and Uma’s, and Maea’s, wrote it all out fine, and had us sign it; and then he got the chiefs and marched over to Papa Randall’s to seize Case’s papers."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 470
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2715
        "line_end": 2727
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-461"
    "translation_ja": "一行はあの栄光の戦場の、ケイスが煙を吐く首を置いていたまさにその穴に、当のケイスを埋めた。俺はすっかり済むまで待っていた。タールトンさんがお祈りをした。俺はくだらんと思ったが、故人の行く先についてはずいぶん気の滅入る見通しを述べ、地獄というものについて独自のお考えがあるらしかったことは認めておこう。あとで俺はあの人とやり合い、務めをいいかげんに済ませたね、と言った。男なら立ち上がって、ケイスは地獄行きだ、いなくなってせいせいする、とカナカ人にはっきり言ってやるべきだったのだ。だがどうやっても、俺と同じ見方にはなってくれなかった。それからみんなが棒で担架を作って、俺を商館へ運び下ろした。タールトンさんが脚の骨を戻してくれたが、いかにも宣教師流のつなぎ方でね、俺は今でも足を引きずる。そうしたあと、俺とウマとマエアの証言を聞き取り、きれいな文章に書き上げて、俺たちに署名させた。それから首長たちを連れ、ケイスの書類を押さえにパッパ・ランドルのところへ乗り込んだ。"
    "translation_status": "reviewed"
  - "id": "beach-462"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All they found was a bit of a diary, kept for a good many years, and all about the price of copra, and chickens being stolen, and that; and the books of the business and the will I told you of in the beginning, by both of which the whole thing (stock, lock, and barrel) appeared to belong to the Samoa woman. It was I that bought her out at a mighty reasonable figure, for she was in a hurry to get home. As for Randall and the black, they had to tramp; got into some kind of a station on the Papa-malulu side; did very bad business, for the truth is neither of the pair was fit for it, and lived mostly on fish, which was the means of Randall’s death. It seems there was a nice shoal in one day, and papa went after them with the dynamite; either the match burned too fast, or papa was full, or both, but the shell went off (in the usual way) before he threw it, and where was papa’s hand? Well, there’s nothing to hurt in that; the islands up north are all full of one-handed men, like the parties in the “Arabian Nights”; but either Randall was too old, or he drank too much, and the short and the long of it was that he died. Pretty soon after, the nigger was turned out of the island for stealing from white men, and went off to the west, where he found men of his own colour, in case he liked that, and the men of his own colour took and ate him at some kind of a corroborree, and I’m sure I hope he was to their fancy!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 471
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2729
        "line_end": 2749
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-462"
    "translation_ja": "出てきたのは、ずいぶん長年つけていた取るに足らん日記、コプラの値段がどうの、ニワトリを盗まれただの、そんなことばかり。それに商売の帳簿と、はじめに話したあの遺言書だった。どちらで見ても、商売は在庫から何から丸ごとサモアの女のものらしかった。そいつをえらく手ごろな値で買い取ったのは俺だ。向こうが早く故郷へ帰りたがっていたからな。ランドルとあの黒人は出ていかざるをえなかった。パパ・マルル側でどうにか商館に入り込んだものの、実のところどっちも商売に向いちゃいないので、まるで商いにならず、大方は魚で食いつないでいた。その魚がランドルの死ぬもとになったのさ。ある日、いい魚の群れが入ってきたらしく、親父はダイナマイトを持って追った。火が早く回りすぎたか、親父が酔っぱらってたか、その両方だったか。いつものように、放り投げる前に爆弾がはじけた。さて親父の手はどこへいった？　まあ、手が一本なくなるぐらい、どうってことはない。北のほうの島なんぞ、『アラビアン・ナイト』に出てくるような片手の男だらけだ。だがランドルは年を取りすぎていたか、酒を飲みすぎていたか、ともかく死んじまった。それからまもなく、あの黒ん坊は白人から盗みを働いて島を追い出され、西へ出ていった。そこには、あいつが望むならおあつらえむきに、あいつと同じ肌の色の連中がいた。その同じ肌の色の連中が、コロボリーとかいう祭りであいつを取って食った。あいつが連中の口に合ったといいがね！"
    "translation_status": "reviewed"
  - "id": "beach-463"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So there was I, left alone in my glory at Falesá; and when the schooner came round I filled her up, and gave her a deck-cargo half as high as the house. I must say Mr. Tarleton did the right thing by us; but he took a meanish kind of a revenge."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 472
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2751
        "line_end": 2754
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-463"
    "translation_ja": "そんなわけでファレサーに残ったのは、お山の大将の俺ひとり。スクーナーが回ってきたときには船倉をいっぱいにし、甲板にも家の半分ほどの高さに荷を積んでやった。タールトンさんは俺たちによくしてくれた。そこは認める。だが、仕返しのやり方が、どうも少々意地が悪かった。"
    "translation_status": "reviewed"
  - "id": "beach-464"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Now, Mr. Wiltshire,” said he, “I’ve put you all square with everybody here. It wasn’t difficult to do, Case being gone; but I have done it, and given my pledge besides that you will deal fairly with the natives. I must ask you to keep my word.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 473
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2756
        "line_end": 2759
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-464"
    "translation_ja": "「さて、ウィルトシャーさん」とあの人は言った。「ここのみんなと、あなたのあいだにしこりが残らないようにしておきました。ケイスがいないいま、難しいことではありませんでしたが、それは私がして、それに加えて、あなたが島の人たちと公正に商売をすると私が約束したのです。私の言葉を守っていただきたい」"
    "translation_status": "reviewed"
  - "id": "beach-465"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Well, so I did. I used to be bothered about my balances, but I reasoned it out this way: We all have queerish balances; and the natives all know it, and water their copra in a proportion so that it’s fair all round; but the truth is, it did use to bother me, and, though I did well in Falesá, I was half glad when the firm moved me on to another station, where I was under no kind of a pledge and could look my balances in the face."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 474
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2761
        "line_end": 2767
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-465"
    "translation_ja": "まあ、俺は守ったよ。秤のことは気にかかっていたが、こう考えた。俺たちの秤はどれも少々怪しい。それは島の人たちも百も承知で、その分だけコプラに水を含ませてくる。それならお互いに公平というもんだ。だが本当は気になっていたし、ファレサーで商売はうまくいったけれど、会社からよその商館へ移されたときには、半ばほっとした。そこなら何の約束にも縛られず、秤を正面から眺めていられるからな。"
    "translation_status": "reviewed"
  - "id": "beach-466"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As for the old lady, you know her as well as I do. She’s only the one fault. If you don’t keep your eye lifting she would give away the roof off the station. Well, it seems it’s natural in Kanakas. She’s turned a powerful big woman now, and could throw a London bobby over her shoulder. But that’s natural in Kanakas too, and there’s no manner of doubt that she’s an A 1 wife."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 475
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2769
        "line_end": 2774
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-466"
    "translation_ja": "うちのかみさんのことは、俺と同じくらいあんたも知っている。欠点は一つきりだ。目を離すと、商館の屋根まで人にくれてやりかねん。まあ、カナカ人には生まれつきそういうところがあるらしい。今ではずいぶん大柄で力のある女になり、ロンドンの巡査だって肩越しに投げ飛ばせそうだ。だが、そいつもカナカ人には生まれつきのことだ。あいつが一等のかみさんなのは、まったく疑いようがない。"
    "translation_status": "reviewed"
  - "id": "beach-467"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Mr. Tarleton’s gone home, his trick being over. He was the best missionary I ever struck, and now, it seems, he’s parsonising down Somerset way. Well, that’s best for him; he’ll have no Kanakas there to get luny over."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 476
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2776
        "line_end": 2779
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-467"
    "translation_ja": "タールトンさんはお役目の年季が明けて、国へ帰った。俺が出会ったなかじゃ一番いい宣教師でね。いまはサマセットのほうで牧師稼業をしているらしい。まあ、あの人にはそれが一番だ。あちらなら、カナカ人のことで頭をおかしくすることもないだろう。"
    "translation_status": "reviewed"
  - "id": "beach-468"
    "section_id": "beach-ch5"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "My public-house? Not a bit of it, nor ever likely. I’m stuck here, I fancy. I don’t like to leave the kids, you see: and—there’s no use talking—they’re better here than what they would be in a white man’s country, though Ben took the eldest up to Auckland, where he’s being schooled with the best. But what bothers me is the girls. They’re only half-castes, of course; I know that as well as you do, and there’s nobody thinks less of half-castes than I do; but they’re mine, and about all I’ve got. I can’t reconcile my mind to their taking up with Kanakas, and I’d like to know where I’m to find the whites?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 477
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2781
        "line_end": 2789
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-468"
    "translation_ja": "俺が酒場をやるって話か？　てんで実現しやしないし、この先もありそうにない。俺はどうもここに根がついちまったようだ。子どもたちを置いていきたくないんだ、分かるだろう。議論しても仕方がないが、白人の国にいるより、ここにいるほうがあいつらのためだ。ベンが一番上の子をオークランドへ連れていって、あの子は向こうで一流の連中に交じって教育を受けているけれどな。俺の気にかかるのは娘たちだ。むろん混血にすぎない、あんたと同じくらい俺にもよく分かっている。混血のやつらを俺ほど低く見ている人間はいないよ。だが俺の子たちだし、俺にはあの子らくらいしかいない。カナカ人と一緒になるなんて、どうにも心が承知しない。だったら白人はどこで見つけてくればいいんだ？"
    "translation_status": "reviewed"
  - "id": "bottle-001"

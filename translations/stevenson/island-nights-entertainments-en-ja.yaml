      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-286"
    "translation_ja": "群衆から、ポリネシアの人々が奇跡を見た時の、あのどよめきが上がりました。私はといえば、あっけに取られて立ち尽くしていました。国で二十度と見た、ありふれた手品です。ですが、それをどうやって村の人に信じてもらえばいいのでしょう。ヘブライ語の代わりに手品を習っておけばよかった、そうしたら同じ手でやり返せたのに、と悔やみました。ですが、その場で黙って突っ立っているわけにもいきません。どうにか思いついた言葉も、なんとも頼りないものでした。"
    "translation_status": "reviewed"
  - "id": "beach-287"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“‘I will trouble you not to lay hands on me again,’ said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 296
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1653
        "line_end": 1653
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-287"
    "translation_ja": "『二度と私の体に手を触れないでいただきたい』と私は言いました。"
    "translation_status": "reviewed"
  - "id": "beach-288"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“‘I have no such thought,’ said he, ‘nor will I deprive you of your dollar. Here it is,’ he said, and flung it at my feet. I am told it lay where it fell three days.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 297
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1655
        "line_end": 1657
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-288"
    "translation_ja": "『そんなつもりはありませんし、あなたの一ドルを取り上げるつもりもありません。さあ、これです』と、私の足もとに投げつけました。聞いたところでは、それから三日間、銀貨は落ちたところにそのままだったそうです」"
    "translation_status": "reviewed"
  - "id": "beach-289"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I must say it was well played, said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 298
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1659
        "line_end": 1659
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-289"
    "translation_ja": "「うまくやったもんだと言うよりありませんね」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-290"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“O! he is clever,” said Mr. Tarleton, “and you can now see for yourself how dangerous. He was a party to the horrid death of the paralytic; he is accused of poisoning Adams; he drove Vigours out of the place by lies that might have led to murder; and there is no question but he has now made up his mind to rid himself of you. How he means to try we have no guess; only be sure, it’s something new. There is no end to his readiness and invention.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 299
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1661
        "line_end": 1667
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-290"
    "translation_ja": "「ええ、頭は切れます」とタールトンさんは言った。「そしていかに危険か、もうおわかりでしょう。体が麻痺していた男をむごいやり方で死なせるのに加担し、アダムズさんに毒を盛ったと言われ、ヴィガーズさんを、殺しにまでなりかねない嘘で追い出しました。今ではあなたを始末しようと決めたことも間違いありません。何を企んでいるかはわかりませんが、これまでと違うことなのは確かです。あの男はとっさの機転にも、手を考えることにも限りがありませんから」"
    "translation_status": "reviewed"
  - "id": "beach-291"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“He gives himself a sight of trouble,” says I. “And after all, what for?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 300
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1669
        "line_end": 1670
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-291"
    "translation_ja": "「えらく手間をかけますね」と俺は言った。「そもそも何のために？」"
    "translation_status": "reviewed"
  - "id": "beach-292"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Why, how many tons of copra may they make in this district?” asked the missionary."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 301
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1672
        "line_end": 1673
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-292"
    "translation_ja": "「では、このあたりでコプラは何トンほど作れますか？」と宣教師は尋ねた。"
    "translation_status": "reviewed"
  - "id": "beach-293"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I daresay as much as sixty tons,” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 302
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1675
        "line_end": 1675
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-293"
    "translation_ja": "「六十トンにはなるでしょう」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-294"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And what is the profit to the local trader?” he asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 303
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1677
        "line_end": 1677
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-294"
    "translation_ja": "「ここにいる商人の儲けは？」"
    "translation_status": "reviewed"
  - "id": "beach-295"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You may call it, three pounds,” said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 304
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1679
        "line_end": 1679
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-295"
    "translation_ja": "「まあ、一トンにつき三ポンドとしてください」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-296"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Then you can reckon for yourself how much he does it for,” said Mr. Tarleton. “But the more important thing is to defeat him. It is clear he spread some report against Uma, in order to isolate and have his wicked will of her. Failing of that, and seeing a new rival come upon the scene, he used her in a different way. Now, the first point to find out is about Namu. Uma, when people began to leave you and your mother alone, what did Namu do?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 305
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1681
        "line_end": 1687
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-296"
    "translation_ja": "「では、いくらのためにあの男がやっているのか、ご自分で計算できますね」とタールトンさんは言った。「ですが、もっと大事なのは、あの男の企みをくじくことです。ウマをひとりぼっちにして邪な望みを遂げようと、彼女について何か噂を流したのでしょう。それに失敗して、新しい商売敵が現れたのを見て、彼女を別のやり方で利用したのです。そこでまず、ナムのことを確かめましょう。ウマ、村の皆があなたとお母さんを避けだした時、ナムはどうしましたか？」"
    "translation_status": "reviewed"
  - "id": "beach-297"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Stop away all-e-same,” says Uma."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 306
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1689
        "line_end": 1689
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-297"
    "translation_ja": "「ほかの人と同じ。来ない」とウマは言った。"
    "translation_status": "reviewed"
  - "id": "beach-298"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I fear the dog has returned to his vomit,” said Mr. Tarleton. “And now what am I to do for you? I will speak to Namu, I will warn him he is observed; it will be strange if he allow anything to go on amiss when he is put upon his guard. At the same time, this precaution may fail, and then you must turn elsewhere. You have two people at hand to whom you might apply. There is, first of all, the priest, who might protect you by the Catholic interest; they are a wretchedly small body, but they count two chiefs. And then there is old Faiaso. Ah! if it had been some years ago you would have needed no one else; but his influence is much reduced, it has gone into Maea’s hands, and Maea, I fear, is one of Case’s jackals. In fine, if the worst comes to the worst, you must send up or come yourself to Fale-alii, and, though I am not due at this end of the island for a month, I will just see what can be done.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 307
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1691
        "line_end": 1703
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-298"
    "translation_ja": "「犬は自分の吐いた物のところへ戻ってしまったようですね」とタールトンさんは言った。「では、お二人のために私に何ができるでしょう。ナムと話し、見られているのだと警告しましょう。そう釘を刺されたうえで、おかしなことが進むのを放っておくとは思えません。もっとも、それでもだめなことがあります。その時はほかを頼らねばなりませんね。この近くに頼めそうな人が二人います。まず神父です。カトリックの人々の力で守ってもらえるかもしれません。人数は嘆かわしいほどわずかですが、その中に首長が二人います。それにファイアソ老人。ああ、数年前だったら、あの人一人で足りたでしょう。ですがずいぶん力を失って、その力はマエアの手に渡っています。そしてマエアは、おそらくケイスの手先の一人です。いよいよ困ったなら、ファレ・アリイに使いを出すか、ご自分でいらっしゃい。島のこちら側へ来るのはひと月先の予定ですが、私もできることを考えましょう」"
    "translation_status": "reviewed"
  - "id": "beach-299"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So Mr. Tarleton said farewell; and half an hour later the crew were singing and the paddles flashing in the missionary-boat."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 308
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1705
        "line_end": 1706
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-299"
    "translation_ja": "そう言ってタールトンさんは別れを告げた。それから半時間もすると、宣教団の舟では漕ぎ手たちが歌い、櫂がきらきら光っていた。"
    "translation_status": "reviewed"
  - "id": "beach-300"
    "section_id": "beach-ch4"
    "kind": "heading"
    "origin": "source"
    "source_text": "CHAPTER IV. DEVIL-WORK."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 309
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1710
        "line_end": 1710
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-300"
    "translation_ja": "第四章　悪魔のしわざ"
    "translation_status": "reviewed"
  - "id": "beach-301"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Near a month went by without much doing. The same night of our marriage Galoshes called round, and made himself mighty civil, and got into a habit of dropping in about dark and smoking his pipe with the family. He could talk to Uma, of course, and started to teach me native and French at the same time. He was a kind old buffer, though the dirtiest you would wish to see, and he muddled me up with foreign languages worse than the tower of Babel."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 310
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1713
        "line_end": 1719
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-301"
    "translation_ja": "たいしたこともないまま、ひと月近くが過ぎた。結婚したその晩にガロッシュが訪ねてきて、えらく愛想よくしていった。それから暗くなる頃にふらりと寄っては、うちの者と一緒にパイプをふかすのが習慣になった。もちろんウマとは話ができたし、俺には島の言葉とフランス語をいっぺんに教えはじめた。親切なじいさんだが、これほどの不潔な男もいない。その外国語のおかげで、俺の頭の中はバベルの塔どころの騒ぎじゃなくなった。"
    "translation_status": "reviewed"
  - "id": "beach-302"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "That was one employment we had, and it made me feel less lonesome; but there was no profit in the thing, for though the priest came and sat and yarned, none of his folks could be enticed into my store; and if it hadn’t been for the other occupation I struck out, there wouldn’t have been a pound of copra in the house. This was the idea: Fa’avao (Uma’s mother) had a score of bearing trees. Of course we could get no labour, being all as good as tabooed, and the two women and I turned to and made copra with our own hands. It was copra to make your mouth water when it was done—I never understood how much the natives cheated me till I had made that four hundred pounds of my own hand—and it weighed so light I felt inclined to take and water it myself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 311
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1721
        "line_end": 1731
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-302"
    "translation_ja": "こういう楽しみができて寂しさはまぎれたが、金にはならなかった。神父は来て座って四方山話をしていくが、信徒は一人だって店に来てくれない。俺が別の仕事を思いつかなかったら、うちにはコプラが一ポンドもなかっただろう。ウマの母親のファアヴァオが、実のなる椰子を二十本ばかり持っていたのだ。三人ともタブーを掛けられたも同然だから、もちろん人は雇えない。そこで女二人と俺とで、自分たちの手でコプラを作った。出来上がったのは、見ればよだれが出そうないいコプラだった。自分で四百ポンド作ってみて初めて、島の連中にどれだけごまかされていたかわかった。あんまり目方が軽いので、こっちから水をかけてやろうかと思ったくらいだ。"
    "translation_status": "reviewed"
  - "id": "beach-303"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When we were at the job a good many Kanakas used to put in the best of the day looking on, and once that nigger turned up. He stood back with the natives and laughed and did the big don and the funny dog, till I began to get riled."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 312
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1733
        "line_end": 1736
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-303"
    "translation_ja": "俺たちが仕事をしていると、カナカ人が大勢、一日の大半を見物に費やした。ある時、あの黒人野郎までやってきた。島の連中と一緒に離れた所に立ち、笑いながら、お偉方を気取ったり、おどけてみせたりする。だんだん腹が立ってきた。"
    "translation_status": "reviewed"
  - "id": "beach-304"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Here, you nigger!” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 313
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1738
        "line_end": 1738
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-304"
    "translation_ja": "「おい、そこの黒人野郎！」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-305"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I don’t address myself to you, Sah,” says the nigger. “Only speak to gen’le’um.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 314
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1740
        "line_end": 1741
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-305"
    "translation_ja": "「あんたに話しちゃおりませんよ、旦那」とその男は言った。「あたしゃ紳士としか話しませんのでね」"
    "translation_status": "reviewed"
  - "id": "beach-306"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I know,” says I, “but it happens I was addressing myself to you, Mr. Black Jack. And all I want to know is just this: did you see Case’s figurehead about a week ago?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 315
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1743
        "line_end": 1745
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-306"
    "translation_ja": "「そりゃ知ってるさ」と俺は言った。「だが、あいにくこっちがあんたに話しかけたんだ、ブラック・ジャックさんよ。聞きたいのは一つだけだ。一週間ほど前のケイスの面は見たかい？」"
    "translation_status": "reviewed"
  - "id": "beach-307"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No, Sah,” says he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 316
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1747
        "line_end": 1747
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-307"
    "translation_ja": "「いいえ、旦那」と男は言った。"
    "translation_status": "reviewed"
  - "id": "beach-308"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s all right, then,” says I; “for I’ll show you the own brother to it, only black, in the inside of about two minutes.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 317
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1749
        "line_end": 1750
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-308"
    "translation_ja": "「そいつはよかった」と俺は言った。「二分もしないうちに、あの面に生き写しの兄弟を見せてやるよ。ただし黒いのをな」"
    "translation_status": "reviewed"
  - "id": "beach-309"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And I began to walk towards him, quite slow, and my hands down; only there was trouble in my eye, if anybody took the pains to look."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 318
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1752
        "line_end": 1753
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-309"
    "translation_ja": "そう言って奴のほうへ、両手を下げて、ゆっくり歩きだした。もっとも、よく見てみれば俺の目がただごとでないのはわかったはずだ。"
    "translation_status": "reviewed"
  - "id": "beach-310"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You’re a low, obstropulous fellow, Sah,” says he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 319
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1755
        "line_end": 1755
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-310"
    "translation_ja": "「柄が悪いにもほどがある。難癖ばかりつけますね、旦那」と男は言った。"
    "translation_status": "reviewed"
  - "id": "beach-311"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You bet!” says I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 320
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1757
        "line_end": 1757
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-311"
    "translation_ja": "「おっしゃるとおり！」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-312"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "By that time he thought I was about as near as convenient, and lit out so it would have done your heart good to see him travel. And that was all I saw of that precious gang until what I am about to tell you."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 321
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1759
        "line_end": 1761
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-312"
    "translation_ja": "そのへんで、もう十分近づいたと思ったんだろう、見ていて胸がすくほどの勢いで逃げていった。あのご立派な一味はこれから話すことが起きるまで、一人も見かけなかった。"
    "translation_status": "reviewed"
  - "id": "beach-313"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was one of my chief employments these days to go pot-hunting in the woods, which I found (as Case had told me) very rich in game. I have spoken of the cape which shut up the village and my station from the east. A path went about the end of it, and led into the next bay. A strong wind blew here daily, and as the line of the barrier reef stopped at the end of the cape, a heavy surf ran on the shores of the bay. A little cliffy hill cut the valley in two parts, and stood close on the beach; and at high water the sea broke right on the face of it, so that all passage was stopped. Woody mountains hemmed the place all round; the barrier to the east was particularly steep and leafy, the lower parts of it, along the sea, falling in sheer black cliffs streaked with cinnabar; the upper part lumpy with the tops of the great trees. Some of the trees were bright green, and some red, and the sand of the beach as black as your shoes. Many birds hovered round the bay, some of them snow-white; and the flying-fox (or vampire) flew there in broad daylight, gnashing its teeth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 322
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1763
        "line_end": 1778
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-313"
    "translation_ja": "この頃よくやったのは、食うために森へ猟に行くことだった。ケイスの言ったとおり、獲物はいくらでもいた。村と俺の商館を東から遮っている岬のことは、もう話した。岬の先をまわって隣の入り江へ出る道があった。そこでは毎日強い風が吹き、外礁は岬の先で途切れているので、入り江の岸には大波が打ち寄せた。崖のような小山が谷を二つに分け、浜ぎわまでせり出している。満潮にはその正面に波がまともにぶつかって、人は通れなくなる。四方を木の茂る山に囲まれ、とりわけ東の山は険しく、葉が繁っていた。下のほうは海沿いに切り立った黒い崖が続き、辰砂そっくりの朱色の筋が走っていた。上のほうは大木の梢が盛り上がってでこぼこしていた。鮮やかな緑の木も赤い木もあって、浜の砂は靴のように真っ黒だった。入り江の上には鳥がたくさん舞い、雪のように白い鳥もいた。吸血鬼とも呼ばれるオオコウモリまでが、真っ昼間に歯をきしらせて飛んでいた。"
    "translation_status": "reviewed"
  - "id": "beach-314"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For a long while I came as far as this shooting, and went no farther. There was no sign of any path beyond, and the cocoa-palms in the front of the foot of the valley were the last this way. For the whole “eye” of the island, as natives call the windward end, lay desert. From Falesá round about to Papa-malulu, there was neither house, nor man, nor planted fruit-tree; and the reef being mostly absent, and the shores bluff, the sea beat direct among crags, and there was scarce a landing-place."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 323
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1780
        "line_end": 1786
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-314"
    "translation_ja": "長いこと猟に来てもここまでで、それより先には行かなかった。この先には道らしきものがなく、谷の口の椰子がこちら側では最後だったからだ。島の人が「目」と呼ぶ風上の端は、一帯が無人だった。ファレサーから島をぐるっとパパ・マルルまでまわっても、家も人も、人が植えた果樹もない。ほとんど礁がなく、岸が切り立っているので、波はじかに岩の間に打ち込んで、船を着けられる所もろくになかった。"
    "translation_status": "reviewed"
  - "id": "beach-315"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I should tell you that after I began to go in the woods, although no one offered to come near my store, I found people willing enough to pass the time of day with me where nobody could see them; and as I had begun to pick up native, and most of them had a word or two of English, I began to hold little odds and ends of conversation, not to much purpose to be sure, but they took off the worst of the feeling, for it’s a miserable thing to be made a leper of."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 324
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1788
        "line_end": 1794
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-315"
    "translation_ja": "そうそう、俺が森へ行きはじめても、うちの店に近寄る者はなかったが、人目のないところなら話し相手になってくれる連中がいた。俺は島の言葉をいくらか覚えたし、向こうも英語を一言二言は知っていた。そこで、まとまった話にはならんが、ちょっとした言葉のやりとりはできるようになり、いちばんつらいところはまぎれた。人からハンセン病患者さながらに避けられるってのは、みじめなもんだ。"
    "translation_status": "reviewed"
  - "id": "beach-316"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It chanced one day towards the end of the month, that I was sitting in this bay in the edge of the bush, looking east, with a Kanaka. I had given him a fill of tobacco, and we were making out to talk as best we could; indeed, he had more English than most."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 325
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1796
        "line_end": 1799
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-316"
    "translation_ja": "そのひと月も終わろうというある日、この入り江の藪のはずれにカナカ人と二人で座り、東を眺めていた。パイプ一服ぶんの煙草をやって、どうにか話をしていた。その男は、たしかにほかの連中より英語ができた。"
    "translation_status": "reviewed"
  - "id": "beach-317"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I asked him if there was no road going eastward."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 326
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1801
        "line_end": 1801
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-317"
    "translation_ja": "東へ行く道はないのかと、俺は聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-318"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“One time one road,” said he. “Now he dead.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 327
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1803
        "line_end": 1803
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-318"
    "translation_ja": "「前、道一本あった」と男は言った。「今、もう死んだ」"
    "translation_status": "reviewed"
  - "id": "beach-319"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Nobody he go there?” I asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 328
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1805
        "line_end": 1805
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-319"
    "translation_ja": "「誰もあっち行かない？」と俺は聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-320"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No good,” said he. “Too much devil he stop there.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 329
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1807
        "line_end": 1807
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-320"
    "translation_ja": "「行かないほうがいい」と男は言った。「あそこ、悪魔がいっぱいいる」"
    "translation_status": "reviewed"
  - "id": "beach-321"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Oho!” says I, “got-um plenty devil, that bush?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 330
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1809
        "line_end": 1809
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-321"
    "translation_ja": "「へえ！」と俺は言った。「あの藪、悪魔いっぱいいるか？」"
    "translation_status": "reviewed"
  - "id": "beach-322"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Man devil, woman devil; too much devil,” said my friend. “Stop there all-e-time. Man he go there, no come back.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 331
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1811
        "line_end": 1812
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-322"
    "translation_ja": "「男の悪魔、女の悪魔。いっぱいいる」とその男は言った。「いつもいる。あそこ行く人、帰ってこない」"
    "translation_status": "reviewed"
  - "id": "beach-323"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I thought if this fellow was so well posted on devils and spoke of them so free, which is not common, I had better fish for a little information about myself and Uma."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 332
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1814
        "line_end": 1816
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-323"
    "translation_ja": "悪魔のことにこれだけ詳しく、珍しく気軽にしゃべってくれる男なら、俺とウマのこともちょっと探りを入れてみようと思った。"
    "translation_status": "reviewed"
  - "id": "beach-324"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You think me one devil?” I asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 333
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1818
        "line_end": 1818
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-324"
    "translation_ja": "「俺、悪魔と思うか？」と俺は聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-325"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No think devil,” said he soothingly. “Think all-e-same fool.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 334
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1820
        "line_end": 1820
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-325"
    "translation_ja": "「悪魔と思わない」と男はなだめるように言った。「馬鹿だとは思う」"
    "translation_status": "reviewed"
  - "id": "beach-326"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Uma, she devil?” I asked again."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 335
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1822
        "line_end": 1822
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-326"
    "translation_ja": "「ウマは、悪魔か？」とまた聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-327"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No, no; no devil. Devil stop bush,” said the young man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 336
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1824
        "line_end": 1824
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-327"
    "translation_ja": "「いやいや、悪魔じゃない。悪魔、藪にいる」と若者は言った。"
    "translation_status": "reviewed"
  - "id": "beach-328"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was looking in front of me across the bay, and I saw the hanging front of the woods pushed suddenly open, and Case, with a gun in his hand, step forth into the sunshine on the black beach. He was got up in light pyjamas, near white, his gun sparkled, he looked mighty conspicuous; and the land-crabs scuttled from all round him to their holes."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 337
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1826
        "line_end": 1830
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-328"
    "translation_ja": "俺は入り江の向こうに目をやっていた。すると、垂れかぶさる森の葉が急に押し分けられ、銃を手にしたケイスが黒い浜の日なたへ出てきた。白に近い淡い色のパジャマを着て、銃はきらきら光り、いやに目立った。取り巻いていた陸ガニが、いっせいに穴へ逃げ込んだ。"
    "translation_status": "reviewed"
  - "id": "beach-329"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Hullo, my friend!” says I, “you no talk all-e-same true. Ese he go, he come back.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 338
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1832
        "line_end": 1833
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-329"
    "translation_ja": "「おい、あんた！」と俺は言った。「今の話、ほんとじゃないな。エセは行って帰ってくるぞ」"
    "translation_status": "reviewed"
  - "id": "beach-330"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ese no all-e-same; Ese Tiapolo,” says my friend; and, with a “Good-bye,” slunk off among the trees."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 339
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1835
        "line_end": 1836
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-330"
    "translation_ja": "「エセ、ほかと違う。エセはティアポロ」と男は言い、「さよなら」とだけ残して木立のあいだにこそこそ消えた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 24
          "end": 31
          "exact": "Tiapolo"
  - "id": "beach-331"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I watched Case all round the beach, where the tide was low; and let him pass me on the homeward way to Falesá. He was in deep thought, and the birds seemed to know it, trotting quite near him on the sand, or wheeling and calling in his ears. When he passed me I could see by the working of his lips that he was talking to himself, and what pleased me mightily, he had still my trade mark on his brow, I tell you the plain truth: I had a mind to give him a gunful in his ugly mug, but I thought better of it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 340
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1838
        "line_end": 1844
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-331"
    "translation_ja": "引き潮の浜をぐるりとまわるケイスを見張り、ファレサーへ帰る道で、そのまま通り過ぎさせた。深く考え込んでいた。鳥もそれを知っているらしく、砂の上をすぐそばまで小走りに寄ってきたり、耳のあたりを旋回して鳴いたりした。通り過ぎる時、唇の動きで独り言を言っているのがわかった。そして実にいいことに、額にはまだ俺の商標がついていた。ほんとのところ、あの醜い面に一発ぶち込んでやろうかと思ったが、考え直してやめた。"
    "translation_status": "reviewed"
  - "id": "beach-332"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All this time, and all the time I was following home, I kept repeating that native word, which I remembered by “Polly, put the kettle on and make us all some tea,” tea-a-pollo."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 341
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1846
        "line_end": 1848
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-332"
    "translation_ja": "そのあいだじゅう、あとをつけて家へ帰る道すがらも、あの島の言葉をくり返し唱えていた。「ポリー、やかんをかけて、みんなにお茶をいれてよ」の歌のおかげで覚えられた。お茶のティーに、ポリー。ティー・ア・ポロだ。"
    "translation_status": "reviewed"
  - "id": "beach-333"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Uma,” says I, when I got back, “what does Tiapolo mean?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 342
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1850
        "line_end": 1850
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-333"
    "translation_ja": "「ウマ」と、家へ帰って俺は聞いた。「ティアポロって何だ？」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 43
          "end": 50
          "exact": "Tiapolo"
  - "id": "beach-334"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Devil,” says she."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 343
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1852
        "line_end": 1852
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-334"
    "translation_ja": "「悪魔」とウマは言った。"
    "translation_status": "reviewed"
  - "id": "beach-335"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I thought aitu was the word for that,” I said."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 344
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1854
        "line_end": 1854
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-335"
    "translation_ja": "「それはアイトゥって言うんだと思ってたが」と俺は言った。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 11
          "end": 15
          "exact": "aitu"
  - "id": "beach-336"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Aitu ’nother kind of devil,” said she; “stop bush, eat Kanaka. Tiapolo big chief devil, stop home; all-e-same Christian devil.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 345
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1856
        "line_end": 1857
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-336"
    "translation_ja": "「アイトゥ、別の悪魔」と彼女は言った。「藪にいて、カナカ人を食べる。ティアポロは悪魔の大首長。家にいる。キリスト教の悪魔と同じ」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 1
          "end": 5
          "exact": "Aitu"
  - "id": "beach-337"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well then,” said I, “I’m no farther forward. How can Case be Tiapolo?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 346
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1859
        "line_end": 1859
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-337"
    "translation_ja": "「じゃ、ちっともわからんままだな」と俺は言った。「どうしてケイスがティアポロなんだ？」"
    "translation_status": "reviewed"
  - "id": "beach-338"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No all-e-same,” said she. “Ese belong Tiapolo; Tiapolo too much like; Ese all-e-same his son. Suppose Ese he wish something, Tiapolo he make him.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 347
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1861
        "line_end": 1863
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-338"
    "translation_ja": "「同じじゃない」とウマは言った。「エセ、ティアポロのもの。ティアポロ、エセが大好き。エセは息子みたい。エセが何かほしいと、ティアポロがしてくれる」"
    "translation_status": "reviewed"
  - "id": "beach-339"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That’s mighty convenient for Ese,” says I. “And what kind of things does he make for him?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 348
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1865
        "line_end": 1866
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-339"
    "translation_ja": "「そいつはエセにはずいぶん都合がいいな」と俺は言った。「それで、どんなことをしてくれるんだ？」"
    "translation_status": "reviewed"
  - "id": "beach-340"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Well, out came a rigmarole of all sorts of stories, many of which (like the dollar he took from Mr. Tarleton’s head) were plain enough to me, but others I could make nothing of; and the thing that most surprised the Kanakas was what surprised me least—namely, that he would go in the desert among all the aitus. Some of the boldest, however, had accompanied him, and had heard him speak with the dead and give them orders, and, safe in his protection, had returned unscathed. Some said he had a church there, where he worshipped Tiapolo, and Tiapolo appeared to him; others swore that there was no sorcery at all, that he performed his miracles by the power of prayer, and the church was no church, but a prison, in which he had confined a dangerous aitu. Namu had been in the bush with him once, and returned glorifying God for these wonders. Altogether, I began to have a glimmer of the man’s position, and the means by which he had acquired it, and, though I saw he was a tough nut to crack, I was noways cast down."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 349
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1868
        "line_end": 1882
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-340"
    "translation_ja": "さあ、出るわ出るわ、よくわからん話の数々。タールトンさんの頭から一ドル銀貨を取り出した話みたいに、俺にもわけのわかるのがいくつもあったが、さっぱり見当のつかないのもあった。カナカ人がいちばん驚いたことは、俺にはいちばん不思議でもなんでもなかった。あれだけアイトゥがいる無人地帯へ、ケイスが入っていくことだ。だが、向こう見ずな奴らは何人かついていき、ケイスが死者と話し、死者に言いつけるのを聞き、その守りのおかげで無事に戻ってきたという。あそこにはケイスの礼拝所があって、彼がティアポロを拝むと、ティアポロが姿を見せるという者もいた。まじないなど一切使わず、祈りの力で奇跡を起こすんだ、礼拝所どころか危ないアイトゥを閉じ込めた牢屋なんだと、言い張る者もいた。ナムも一度ケイスと藪へ入り、この奇跡をなさった神をほめたたえながら帰ってきたという。こうして、あの男がどんな力を持っていて、どうやって手に入れたのか、おぼろげながら見えてきた。手ごわい相手とはわかったが、気落ちはしなかった。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 305
          "end": 310
          "exact": "aitus"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 750
          "end": 754
          "exact": "aitu"
  - "id": "beach-341"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Very well,” said I, “I’ll have a look at Master Case’s place of worship myself, and we’ll see about the glorifying.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 350
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1884
        "line_end": 1885
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-341"
    "translation_ja": "「よし」と俺は言った。「ケイス様の礼拝所をこの目で見てやろう。それから何をほめたたえるか決めようじゃないか」"
    "translation_status": "reviewed"
  - "id": "beach-342"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At this Uma fell in a terrible taking; if I went in the high bush I should never return; none could go there but by the protection of Tiapolo."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 351
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1887
        "line_end": 1889
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-342"
    "translation_ja": "これにはウマがひどく取り乱した。奥の森に行ったら、俺は二度と帰ってこられない。ティアポロの守りなしに、あそこへ行ける者はいないと言うのだ。"
    "translation_status": "reviewed"
  - "id": "beach-343"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I’ll chance it on God’s,” said I. “I’m a good sort of a fellow, Uma, as fellows go, and I guess God’ll con me through.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 352
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1891
        "line_end": 1892
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-343"
    "translation_ja": "「俺は神様の守りに賭けよう」と俺は言った。「ウマ、こう見えて人並みにはまともな男だ。神様だって舵取りぐらいしちゃくれるだろうさ」"
    "translation_status": "reviewed"
  - "id": "beach-344"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She was silent for a while. “I think,” said she, mighty solemn—and then, presently—“Victoreea, he big chief?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 353
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1894
        "line_end": 1895
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-344"
    "translation_ja": "しばらく黙っていた。「考えたんだけど」とウマはいやにまじめな顔で言い、少したってから、「ヴィクトリア、大きな首長？」"
    "translation_status": "reviewed"
  - "id": "beach-345"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You bet!” said I."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 354
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1897
        "line_end": 1897
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-345"
    "translation_ja": "「そりゃもちろんだ！」と俺は言った。"
    "translation_status": "reviewed"
  - "id": "beach-346"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“He like you too much?” she asked again."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 355
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1899
        "line_end": 1899
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-346"
    "translation_ja": "「首長、あなたのこと大好き？」とまた聞いた。"
    "translation_status": "reviewed"
  - "id": "beach-347"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I told her, with a grin, I believed the old lady was rather partial to me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 356
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1901
        "line_end": 1902
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-347"
    "translation_ja": "あのおばあさんはたぶんことのほか俺がお気に入りだろうなと、俺はにやにやしながら答えた。"
    "translation_status": "reviewed"
  - "id": "beach-348"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“All right,” said she. “Victoreea he big chief, like you too much. No can help you here in Falesá; no can do—too far off. Maea he small chief—stop here. Suppose he like you—make you all right. All-e-same God and Tiapolo. God he big chief—got too much work. Tiapolo he small chief—he like too much make-see, work very hard.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 357
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1904
        "line_end": 1908
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-348"
    "translation_ja": "「ね」とウマは言った。「ヴィクトリア、大きな首長。あなた大好き。でもファレサーでは助けられない。遠すぎて、できない。マエアは小さな首長、ここにいる。あなたを好きなら、守ってくれる。神様とティアポロも同じ。神様は大きな首長、仕事が多すぎる。ティアポロは小さな首長、見せびらかすのが大好きで、よく働く」"
    "translation_status": "reviewed"
  - "id": "beach-349"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I’ll have to hand you over to Mr. Tarleton,” said I. “Your theology’s out of its bearings, Uma.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 358
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1910
        "line_end": 1911
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-349"
    "translation_ja": "「おまえはタールトンさんに預けなきゃな」と俺は言った。「ウマ、おまえの神学は方角が狂ってるよ」"
    "translation_status": "reviewed"
  - "id": "beach-350"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "However, we stuck to this business all the evening, and, with the stories she told me of the desert and its dangers, she came near frightening herself into a fit. I don’t remember half a quarter of them, of course, for I paid little heed; but two come back to me kind of clear."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 359
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1913
        "line_end": 1916
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-350"
    "translation_ja": "それでも晩じゅうこの話をした。無人地帯と、そこにどんな危ないことがあるか、ウマは話しながら、自分で自分をひきつけを起こしかねないところまで怖がらせた。聞き流していたから八分の一も覚えちゃいないが、二つだけ、わりにはっきり覚えている。"
    "translation_status": "reviewed"
  - "id": "beach-351"
    "section_id": "beach-ch4"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "About six miles up the coast there is a sheltered cove they call Fanga-anaana—“the haven full of caves.” I’ve seen it from the sea myself, as near as I could get my boys to venture in; and it’s a little strip of yellow sand. Black cliffs overhang it, full of the black mouths of caves; great trees overhang the cliffs, and dangle-down lianas; and in one place, about the middle, a big brook pours over in a cascade. Well, there was a boat going by here, with six young men of Falesá, “all very pretty,” Uma said, which was the loss of them. It blew strong, there was a heavy head sea, and by the time they opened Fanga-anaana, and saw the white cascade and the shady beach, they were all tired and thirsty, and their water had run out. One proposed to land and get a drink, and, being reckless fellows, they were all of the same mind except the youngest. Lotu was his name; he was a very good young gentleman, and very wise; and he held out that they were crazy, telling them the place was given over to spirits and devils and the dead, and there were no living folk nearer than six miles the one way, and maybe twelve the other. But they laughed at his words, and, being five to one, pulled in, beached the boat, and landed. It was a wonderful pleasant place, Lotu said, and the water excellent. They walked round the beach, but could see nowhere any way to mount the cliffs, which made them easier in their mind; and at last they sat down to make a meal on the food they had brought with them. They were scarce set, when there came out of the mouth of one of the black caves six of the most beautiful ladies ever seen: they had flowers in their hair, and the most beautiful breasts, and necklaces of scarlet seeds; and began to jest with these young gentlemen, and the young gentlemen to jest back with them, all but Lotu. As for Lotu, he saw there could be no living woman in such a place, and ran, and flung himself in the bottom of the boat, and covered his face, and prayed. All the time the business lasted Lotu made one clean break of prayer, and that was all he knew of it, until his friends came back, and made him sit up, and they put to sea again out of the bay, which was now quite desert, and no word of the six ladies. But, what frightened Lotu most, not one of the five remembered anything of what had passed, but they were all like drunken men, and sang and laughed in the boat, and skylarked. The wind freshened and came squally, and the sea rose extraordinary high; it was such weather as any man in the islands would have turned his back to and fled home to Falesá; but these five were like crazy folk, and cracked on all sail and drove their boat into the seas. Lotu went to the bailing; none of the others thought to help him, but sang and skylarked and carried on, and spoke singular things beyond a man’s comprehension, and laughed out loud when they said them. So the rest of the day Lotu bailed for his life in the bottom of the boat, and was all drenched with sweat and cold sea-water; and none heeded him. Against all expectation, they came safe in a dreadful tempest to Papa-malulu, where the palms were singing out, and the cocoa-nuts flying like cannon-balls about the village green; and the same night the five young gentlemen sickened, and spoke never a reasonable word until they died."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"

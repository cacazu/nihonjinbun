    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 288
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1551
        "line_end": 1552
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-279"
    "translation_ja": "そうではないと彼は認めました。酒こそ飲まないが、女にはだらしがなく、信仰もないそうです。"
    "translation_status": "reviewed"
  - "id": "beach-280"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“‘Then,’ said I, ‘I think the less you have to do with him the better.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 289
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1554
        "line_end": 1554
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-280"
    "translation_ja": "『それでは』と私は言いました。『付き合いはなるべく控えたほうがいいでしょう』"
    "translation_status": "reviewed"
  - "id": "beach-281"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“But it is not easy to have the last word with a man like Namu. He was ready in a moment with an illustration. ‘Misi,’ said he, ‘you have told me there were wise men, not pastors, not even holy, who knew many things useful to be taught—about trees for instance, and beasts, and to print books, and about the stones that are burned to make knives of. Such men teach you in your college, and you learn from them, but take care not to learn to be unholy. Misi, Case is my college.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 290
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1556
        "line_end": 1562
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-281"
    "translation_ja": "しかし、ナムのような男にこちらが言い勝つのは容易ではありません。彼はすぐにたとえを出しました。『ミシ、あなたはこうおっしゃいました。牧師でもなければ信心深くもないが、教わると役に立つことをよく知っている賢い人がいる。たとえば木や獣のこと、本の刷り方、火で熱して刃物をつくる石のことを知っている、と。そういう人が学校であなたに教え、あなたはその人に学びながらも、不信心までは学ばないよう気をつけます。ミシ、私にとってはケイスが学校なんです』"
    "translation_status": "reviewed"
  - "id": "beach-282"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I knew not what to say. Mr. Vigours had evidently been driven out of Falesá by the machinations of Case and with something not very unlike the collusion of my pastor. I called to mind it was Namu who had reassured me about Adams and traced the rumour to the ill-will of the priest. And I saw I must inform myself more thoroughly from an impartial source. There is an old rascal of a chief here, Faiaso, whom I dare say you saw to-day at the council; he has been all his life turbulent and sly, a great fomenter of rebellions, and a thorn in the side of the mission and the island. For all that he is very shrewd, and, except in politics or about his own misdemeanours, a teller of the truth. I went to his house, told him what I had heard, and besought him to be frank. I do not think I had ever a more painful interview. Perhaps you will understand me, Mr. Wiltshire, if I tell you that I am perfectly serious in these old wives’ tales with which you reproached me, and as anxious to do well for these islands as you can be to please and to protect your pretty wife. And you are to remember that I thought Namu a paragon, and was proud of the man as one of the first ripe fruits of the mission. And now I was informed that he had fallen in a sort of dependence upon Case. The beginning of it was not corrupt; it began, doubtless, in fear and respect, produced by trickery and pretence; but I was shocked to find that another element had been lately added, that Namu helped himself in the store, and was believed to be deep in Case’s debt. Whatever the trader said, that Namu believed with trembling. He was not alone in this; many in the village lived in a similar subjection; but Namu’s case was the most influential, it was through Namu Case had wrought most evil; and with a certain following among the chiefs, and the pastor in his pocket, the man was as good as master of the village. You know something of Vigours and Adams, but perhaps you have never heard of old Underhill, Adams’ predecessor. He was a quiet, mild old fellow, I remember, and we were told he had died suddenly: white men die very suddenly in Falesá. The truth, as I now heard it, made my blood run cold. It seems he was struck with a general palsy, all of him dead but one eye, which he continually winked. Word was started that the helpless old man was now a devil, and this vile fellow Case worked upon the natives’ fears, which he professed to share, and pretended he durst not go into the house alone. At last a grave was dug, and the living body buried at the far end of the village. Namu, my pastor, whom I had helped to educate, offered up a prayer at the hateful scene."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 291
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1564
        "line_end": 1601
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-282"
    "translation_ja": "返す言葉がありませんでした。どう見ても、ヴィガーズさんはケイスの悪だくみでファレサーを追われ、私の牧師も、共謀同然のことをしていたのです。アダムズさんの件で私を安心させ、あの噂は神父の悪意から出たものだと言ったのも、ナムだったと思い出しました。そこで、どちらにも肩入れしていない人から、もっと詳しく聞く必要があると思ったのです。ここにファイアソという、食えない老首長がいます。今日の寄り合いでご覧になったと思いますが、生まれてこのかた騒ぎ好きで抜け目がなく、反乱をたきつける名人で、宣教団にとっても島にとっても目の上のこぶです。それでも目の利く男で、政事や自分の不始末でなければ、本当のことを言います。家に伺って聞いた話を伝え、どうか腹を割って話してくれと頼みました。あれほど苦しい話し合いを経験したことはないと思います。ウィルトシャーさん、先ほどおとぎ話とおっしゃったことを私は大真面目に信じていますし、あなたがあの可愛らしい奥様を喜ばせて守りたいのと同じくらい、この島々のためによいことをしたいのです。そう言えば、おわかりいただけるかもしれません。そのうえナムを人の手本だと思い、宣教の仕事が最初に結んだ実りの一つとして誇っていたこともお忘れなく。ところが、ナムはケイスに何やら頼りきってしまったというのです。始まりには金銭が関わっていなかった。はったりやごまかしで植えつけられた恐れと敬いから始まったのでしょう。ところが近頃はもう一つ事情が加わっていて、私は愕然としました。ナムは店の品を欲しいままに持ち出し、ケイスにかなりの借りがあると思われていました。その商人が何を言っても、ナムは震え上がって信じました。彼だけではありません。村には同じように従わされている者が大勢いましたが、そのなかでもナムの影響はひときわ大きかった。ケイスが最も悪いことをしたのも、ナムを通じてです。味方につく首長もいくらかいて、牧師まで意のままになる。あの男は村を支配したも同然でした。ヴィガーズさんやアダムズさんのことは、いくらかご存じですね。ですがアダムズさんの前任の、アンダーヒル老人のことはお聞きでないかもしれません。おとなしく温厚な人だったのを覚えています。急に亡くなったと聞かされていました。ファレサーでは、白人はとても急に死にますからね。そこで初めて真相を聞かされ、私は血の気が引きました。どうやら全身が麻痺して、まばたきを繰り返す片目のほかは、体のどこも動かなかったそうです。動けない老人は悪魔になったという噂が立ち、この卑劣なケイスという男は、自分も怖いと言い、一人ではとても家に入れないふりをして、島の人々の恐怖をあおりました。とうとう村はずれに墓が掘られ、老人は生きたまま埋められました。そのおぞましい場で祈りを捧げたのが、私が育てた牧師のナムだったのです。"
    "translation_status": "reviewed"
  - "id": "beach-283"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I felt myself in a very difficult position. Perhaps it was my duty to have denounced Namu and had him deposed. Perhaps I think so now, but at the time it seemed less clear. He had a great influence, it might prove greater than mine. The natives are prone to superstition; perhaps by stirring them up I might but ingrain and spread these dangerous fancies. And Namu besides, apart from this novel and accursed influence, was a good pastor, an able man, and spiritually minded. Where should I look for a better? How was I to find as good? At that moment, with Namu’s failure fresh in my view, the work of my life appeared a mockery; hope was dead in me. I would rather repair such tools as I had than go abroad in quest of others that must certainly prove worse; and a scandal is, at the best, a thing to be avoided when humanly possible. Right or wrong, then, I determined on a quiet course. All that night I denounced and reasoned with the erring pastor, twitted him with his ignorance and want of faith, twitted him with his wretched attitude, making clean the outside of the cup and platter, callously helping at a murder, childishly flying in excitement about a few childish, unnecessary, and inconvenient gestures; and long before day I had him on his knees and bathed in the tears of what seemed a genuine repentance. On Sunday I took the pulpit in the morning, and preached from First Kings, nineteenth, on the fire, the earthquake, and the voice, distinguishing the true spiritual power, and referring with such plainness as I dared to recent events in Falesá. The effect produced was great, and it was much increased when Namu rose in his turn and confessed that he had been wanting in faith and conduct, and was convinced of sin. So far, then, all was well; but there was one unfortunate circumstance. It was nearing the time of our ‘May’ in the island, when the native contributions to the missions are received; it fell in my duty to make a notification on the subject, and this gave my enemy his chance, by which he was not slow to profit."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 292
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1603
        "line_end": 1631
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-283"
    "translation_ja": "まことに難しい立場に置かれたと思いました。ナムを告発して罷免させるべきだったかもしれません。今ならそう思うかもしれませんが、当時はそうはっきりしていませんでした。彼には大変な影響力があり、私よりも大きいかもしれなかった。島の人々は迷信に流されがちです。騒ぎ立てたところで、その危険な思い込みを根づかせ、広めるだけかもしれません。それにナムは、この忌まわしい新たな感化さえ除けば、優秀で信仰に熱心な、よい牧師でした。どこにもっとよい者がいるでしょう。同じくらいの者が、どうすれば見つかるでしょう。ナムの過ちをまざまざと見せつけられたその時、私が一生をかけた仕事は茶番のように思え、希望は消えました。よそへ出かけて代わりを探し、きっと劣る道具しか得られないくらいなら、手もとにある道具を直したいと思ったのです。不祥事が表沙汰になるのは、できることなら避けるに越したことはありません。正しいかどうかはともかく、私は事を荒立てない道を選びました。その夜じゅう、道を違えたこの牧師を責め、道理を説きました。無知と信仰のなさをあげつらい、そのみじめな態度を責めました。杯と皿の外側を清めながら、平然と人殺しに手を貸し、子供じみた、いらぬ、面倒な身振りがいくつかあっただけで、子供のように騒ぎだすとは何事か、と。夜が明けるずっと前には、彼はひざまずき、心から悔いていると見える涙にくれていました。日曜の朝、私は説教壇に上がり、列王記上十九章の火と地震と声を引いて、真の霊の力とはどういうものかを説き、ファレサーでこのほど起きたことに、できるかぎり率直にふれました。大きな反響があり、次いでナムが立ち上がり、自分には信仰も行いも足らず、はっきり罪とわかったと告白したことで、効果はいっそう大きくなりました。そこまではすべて順調でしたが、都合の悪いことが一つあったのです。島では宣教団が島の人々の献金を受ける『五月』の時期が近づいていました。そのお知らせをするのは私の役目です。敵はこれを好機とし、すぐに利用しました。"
    "translation_status": "reviewed"
  - "id": "beach-284"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“News of the whole proceedings must have been carried to Case as soon as church was over, and the same afternoon he made an occasion to meet me in the midst of the village. He came up with so much intentness and animosity that I felt it would be damaging to avoid him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"

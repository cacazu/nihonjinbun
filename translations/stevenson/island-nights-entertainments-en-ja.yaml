        "line_end": 1636
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-284"
    "translation_ja": "礼拝が終わるやいなや、一部始終がケイスの耳に入ったに違いありません。その日の午後、彼は機を見て、村の真ん中で私に会いに来ました。いかにも狙いを定め、敵意をむき出しにして近づいてくるので、避けて通れば、かえってまずいと思いました。"
    "translation_status": "reviewed"
  - "id": "beach-285"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“‘So,’ says he, in native, ‘here is the holy man. He has been preaching against me, but that was not in his heart. He has been preaching upon the love of God; but that was not in his heart, it was between his teeth. Will you know what was in his heart?’—cries he. ‘I will show it you!’ And, making a snatch at my head, he made believe to pluck out a dollar, and held it in the air."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 294
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 1638
        "line_end": 1643
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-285"
    "translation_ja": "『さあ、聖人様がいらしたぞ』と彼は島の言葉で言いました。『このお方は俺を悪く言う説教をしたが、それは腹の底から出た言葉じゃない。神の愛も説いたが、これも本心じゃない。歯の間から出ただけだ。じゃあ本当は腹の底に何があったか、知りたいか？』と叫び、『見せてやろう！』と言いました。私の頭にさっと手を伸ばして、一ドル銀貨をつまみ出したふりをし、それを空高く掲げたのです。"
    "translation_status": "reviewed"
  - "id": "beach-286"
    "section_id": "beach-ch3"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There went that rumour through the crowd with which Polynesians receive a prodigy. As for myself, I stood amazed. The thing was a common conjuring trick which I have seen performed at home a score of times; but how was I to convince the villagers of that? I wished I had learned legerdemain instead of Hebrew, that I might have paid the fellow out with his own coin. But there I was; I could not stand there silent, and the best I could find to say was weak."
    "source_languages":
      - "en"

        "line_end": 1213
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "beach-207"
    "translation_ja": "その話が出た途端、俺は嫉妬でほんとにむかむかした。"
    "translation_status": "reviewed"
  - "id": "beach-208"
    "section_id": "beach-ch2"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And you mean to say you would have married him?” I cried."

  - "id": "bottle-002"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Note.—Any student of that very unliterary product, the English drama of the early part of the century, will here recognise the name and the root idea of a piece once rendered popular by the redoubtable O. Smith. The root idea is there and identical, and yet I hope I have made it a new thing. And the fact that the tale has been designed and written for a Polynesian audience may lend it some extraneous interest nearer home.—R. L. S."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 479
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2797
        "line_end": 2803
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-002"
    "translation_ja": "作者のことば　十九世紀初めのイギリスの芝居という、およそ文学らしからぬ産物を研究した人なら、かのあなどりがたい役者Ｏ・スミスが一世を風靡した芝居の題と着想を、ここに認めることだろう。根の着想は確かに同じものだ。それでも私は、これを新しい話に仕立てたつもりでいる。また、もともとポリネシアの人々に聞いてもらおうと考え、そうして書いたという一事も、わが国の読者には、話そのものとは別に、いくらか興を添えるかもしれない。Ｒ・Ｌ・Ｓ"
    "translation_status": "reviewed"
    "attributions":
      - "voice": "author"
        "contributor_id": "rls"
        "evidence_ja": "原前書き末尾の署名 R. L. S."
  - "id": "bottle-003"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was a man of the Island of Hawaii, whom I shall call Keawe; for the truth is, he still lives, and his name must be kept secret; but the place of his birth was not far from Honaunau, where the bones of Keawe the Great lie hidden in a cave. This man was poor, brave, and active; he could read and write like a schoolmaster; he was a first-rate mariner besides, sailed for some time in the island steamers, and steered a whaleboat on the Hamakua coast. At length it came in Keawe’s mind to have a sight of the great world and foreign cities, and he shipped on a vessel bound to San Francisco."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 480
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2805
        "line_end": 2813
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-003"
    "translation_ja": "ハワイ島に一人の男がいた。ここではケアウェと呼んでおこう。じつを言えば今も健在なので、本当の名は伏せねばならないのだ。生まれたところはホナウナウから遠くない。かの大王ケアウェの骨が洞穴に隠されている土地である。この男は貧しかったが、勇気があって働き者、読み書きも学校の先生並みにできた。そのうえ腕のよい船乗りで、一時は島々をめぐる汽船に乗り組み、ハマクアの海岸では捕鯨ボートの舵を取った。やがてケアウェは広い世間や異国の町が見たくなり、サンフランシスコ行きの船に雇ってもらった。"
    "translation_status": "reviewed"
  - "id": "bottle-004"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This is a fine town, with a fine harbour, and rich people uncountable; and, in particular, there is one hill which is covered with palaces. Upon this hill Keawe was one day taking a walk with his pocket full of money, viewing the great houses upon either hand with pleasure, “What fine houses these are!” he was thinking, “and how happy must those people be who dwell in them, and take no care for the morrow!” The thought was in his mind when he came abreast of a house that was smaller than some others, but all finished and beautified like a toy; the steps of that house shone like silver, and the borders of the garden bloomed like garlands, and the windows were bright like diamond; and Keawe stopped and wondered at the excellence of all he saw. So stopping, he was aware of a man that looked forth upon him through a window so clear that Keawe could see him as you see a fish in a pool upon the reef. The man was elderly, with a bald head and a black beard; and his face was heavy with sorrow, and he bitterly sighed. And the truth of it is, that as Keawe looked in upon the man, and the man looked out upon Keawe, each envied the other."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 481
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2815
        "line_end": 2830
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-004"
    "translation_ja": "そこは立派な町で、港も立派、金持ちなど数えきれない。なかでも一面に御殿の建ち並ぶ丘が一つある。ある日ケアウェはポケットに金をじゃらつかせてこの丘を散歩し、左右に建つ大きな家を楽しく眺めていった。「なんて立派な家なんだろう。こんなところに住んで、明日の心配をしなくていい人たちは、さぞ幸せだろうな」。そう思いながら通りかかった一軒は、よその何軒かより小ぶりながら、隅まできれいに仕上げて飾りたててあり、まるで精巧なおもちゃだった。玄関の段は銀のように光り、庭の縁には花輪のように花が咲きそろい、窓はダイヤモンドのように輝く。ケアウェは立ち止まり、見るものの何もかもの美しさに見入った。すると一人の男が窓越しに自分を眺めている。いかにも澄んだ窓なので、岩礁の潮だまりにいる魚を見るように、その男がはっきり見えた。年配の男で、頭は禿げ、あごひげは黒い。顔には悲しみがよどみ、つらそうなため息をついた。じつのところ、外から男を見るケアウェも、中からケアウェを見る男も、お互いに相手が羨ましかったのである。"
    "translation_status": "reviewed"
  - "id": "bottle-005"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All of a sudden, the man smiled and nodded, and beckoned Keawe to enter, and met him at the door of the house."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 482
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2832
        "line_end": 2833
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-005"
    "translation_ja": "突然、男はにっこり笑ってうなずき、入って来いとケアウェを手招きし、玄関まで出迎えに来た。"
    "translation_status": "reviewed"
  - "id": "bottle-006"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is a fine house of mine,” said the man, and bitterly sighed. “Would you not care to view the chambers?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 483
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2835
        "line_end": 2836
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-006"
    "translation_ja": "「私の家はなかなか立派でね」と男は言い、つらそうなため息をついた。「中の部屋も見ていかないかね」"
    "translation_status": "reviewed"
  - "id": "bottle-007"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So he led Keawe all over it, from the cellar to the roof, and there was nothing there that was not perfect of its kind, and Keawe was astonished."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 484
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2838
        "line_end": 2839
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-007"
    "translation_ja": "そこで地下室から屋根まで家じゅうくまなく案内してくれた。どこを取っても、これ以上は望めないというものばかりで、ケアウェは目をみはった。"
    "translation_status": "reviewed"
  - "id": "bottle-008"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Truly,” said Keawe, “this is a beautiful house; if I lived in the like of it, I should be laughing all day long. How comes it, then, that you should be sighing?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 485
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2841
        "line_end": 2843
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-008"
    "translation_ja": "「ほんとにきれいな家ですね」とケアウェは言った。「おれがこんな家に住んでいたら一日じゅう笑って暮らす。なのになぜ、ため息をつくんです？」"
    "translation_status": "reviewed"
  - "id": "bottle-009"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There is no reason,” said the man, “why you should not have a house in all points similar to this, and finer, if you wish. You have some money, I suppose?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 486
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2845
        "line_end": 2847
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-009"
    "translation_ja": "「望むなら、君にだってこの家と何から何までそっくりな家、いや、もっといい家が手に入らん道理はない」と男は言った。「いくらか金は持っているだろう？」"
    "translation_status": "reviewed"
  - "id": "bottle-010"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I have fifty dollars,” said Keawe; “but a house like this will cost more than fifty dollars.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 487
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2849
        "line_end": 2850
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-010"
    "translation_ja": "「五十ドルあります」とケアウェは言った。「でもこんな家は、五十ドルじゃ買えないでしょう」"
    "translation_status": "reviewed"
  - "id": "bottle-011"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The man made a computation. “I am sorry you have no more,” said he, “for it may raise you trouble in the future; but it shall be yours at fifty dollars.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 488
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2852
        "line_end": 2854
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-011"
    "translation_ja": "男は勘定した。「それしかないとは残念だね」と男は言った。「あとになって君が困るかもしれないからな。だが五十ドルで君に譲ろう」"
    "translation_status": "reviewed"
  - "id": "bottle-012"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“The house?” asked Keawe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 489
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2856
        "line_end": 2856
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-012"
    "translation_ja": "「家を？」とケアウェ。"
    "translation_status": "reviewed"
  - "id": "bottle-013"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No, not the house,” replied the man; “but the bottle. For, I must tell you, although I appear to you so rich and fortunate, all my fortune, and this house itself and its garden, came out of a bottle not much bigger than a pint. This is it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 490
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2858
        "line_end": 2861
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-013"
    "translation_ja": "「いや、家じゃない」と男は答えた。「びんをだよ。というのも、君には私がさぞ裕福な果報者に見えるだろうが、私の財産はみんな、この家もその庭も、一パイントを少し上回るくらいのびんから出てきたのだ。これだよ」"
    "translation_status": "reviewed"
  - "id": "bottle-014"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And he opened a lockfast place, and took out a round-bellied bottle with a long neck; the glass of it was white like milk, with changing rainbow colours in the grain. Withinsides something obscurely moved, like a shadow and a fire."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 491
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2863
        "line_end": 2866
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-014"
    "translation_ja": "男は鍵のかかる戸を開けて、首が長く腹の丸いびんを取り出した。乳のように白いガラスの肌の奥で、虹色が次々と色を変えていた。中でぼんやりと動くものがある。影のようでも、炎のようでもあった。"
    "translation_status": "reviewed"
  - "id": "bottle-015"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is the bottle,” said the man; and, when Keawe laughed, “You do not believe me?” he added. “Try, then, for yourself. See if you can break it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 492
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2868
        "line_end": 2870
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-015"
    "translation_ja": "「これがそのびんだ」と男は言った。ケアウェが笑うと、「信じられないかね。なら、自分で試してみなさい。割れるものかどうか」"
    "translation_status": "reviewed"
  - "id": "bottle-016"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So Keawe took the bottle up and dashed it on the floor till he was weary; but it jumped on the floor like a child’s ball, and was not injured."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 493
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2872
        "line_end": 2873
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-016"
    "translation_ja": "そこでケアウェはびんをつかみ、くたびれるまで床にたたきつけた。だがびんは子供のまりのように床で弾んで、傷一つつかなかった。"
    "translation_status": "reviewed"
  - "id": "bottle-017"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is a strange thing,” said Keawe. “For by the touch of it, as well as by the look, the bottle should be of glass.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 494
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2875
        "line_end": 2876
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-017"
    "translation_ja": "「こりゃ妙だ」とケアウェは言った。「見た目ばかりか触った具合も、どうしたってガラスなのに」"
    "translation_status": "reviewed"
  - "id": "bottle-018"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Of glass it is,” replied the man, sighing more heavily than ever; “but the glass of it was tempered in the flames of hell. An imp lives in it, and that is the shadow we behold there moving: or so I suppose. If any man buy this bottle the imp is at his command; all that he desires—love, fame, money, houses like this house, ay, or a city like this city—all are his at the word uttered. Napoleon had this bottle, and by it he grew to be the king of the world; but he sold it at the last, and fell. Captain Cook had this bottle, and by it he found his way to so many islands; but he, too, sold it, and was slain upon Hawaii. For, once it is sold, the power goes and the protection; and unless a man remain content with what he has, ill will befall him.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 495
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2878
        "line_end": 2888
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-018"
    "translation_ja": "「ガラスには違いない」と男は答え、前にも増して深いため息をついた。「ただし、地獄の炎で鍛えたガラスだ。中には小鬼が一匹住んでいる。ほら、動いて見えるあの影が、まあ私の考えでは、それだ。このびんを買った人間なら誰でも、小鬼に命令できる。恋でも名誉でも金でも、この家のような家でも、そうだ、この町ほどの町一つでさえ、ひと言でみんなその人のものになる。ナポレオンはこのびんを持っていて、これで世界の王になったが、しまいに売り払って没落した。クック船長もこれを持っていて、これであれほど多くの島を見つけた。だが彼も売り払って、ハワイで殺された。いったん手放せば、力も守りも消えてしまう。もう持っているものだけで満足していないと、災いに見舞われるのだよ」"
    "translation_status": "reviewed"
  - "id": "bottle-019"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And yet you talk of selling it yourself?” Keawe said."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 496
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2890
        "line_end": 2890
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-019"
    "translation_ja": "「それなのに、ご自分で売ろうとおっしゃるんですか」とケアウェは言った。"
    "translation_status": "reviewed"
  - "id": "bottle-020"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I have all I wish, and I am growing elderly,” replied the man. “There is one thing the imp cannot do—he cannot prolong life; and, it would not be fair to conceal from you, there is a drawback to the bottle; for if a man die before he sells it, he must burn in hell forever.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 497
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2892
        "line_end": 2895
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-020"
    "translation_ja": "「望むものはみんなあるし、私はもう年を取ってきた」と男は答えた。「小鬼にもできないことが一つある。命は延ばせないのだ。それに、君に黙っていては公正でないから言っておく。このびんには難点がある。売らないうちに死んだ者は、永遠に地獄の火に焼かれねばならない」"
    "translation_status": "reviewed"
  - "id": "bottle-021"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“To be sure, that is a drawback and no mistake,” cried Keawe. “I would not meddle with the thing. I can do without a house, thank God; but there is one thing I could not be doing with one particle, and that is to be damned.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 498
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2897
        "line_end": 2900
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-021"
    "translation_ja": "「そりゃ確かに難点だ。間違いないね！」とケアウェは叫んだ。「おれならそんな物に手は出さない。ありがたいことに家ならなくてもやっていける。だが地獄に落ちるなんて、まっぴらごめんだ」"
    "translation_status": "reviewed"
  - "id": "bottle-022"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Dear me, you must not run away with things,” returned the man. “All you have to do is to use the power of the imp in moderation, and then sell it to someone else, as I do to you, and finish your life in comfort.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 499
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2902
        "line_end": 2904
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-022"
    "translation_ja": "「まあまあ、早まってはいかん」と男は返した。「小鬼の力をほどほどに使い、私が君に売るように誰かに売って、あとは楽に余生を送る。それだけのことさ」"
    "translation_status": "reviewed"
  - "id": "bottle-023"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, I observe two things,” said Keawe. “All the time you keep sighing like a maid in love, that is one; and, for the other, you sell this bottle very cheap.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 500
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2906
        "line_end": 2908
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-023"
    "translation_ja": "「けれど二つ、気にかかることがあります」とケアウェは言った。「さっきから恋に悩む娘みたいにため息ばかりついている。それが一つ。もう一つは、ずいぶん安くびんを売ることです」"
    "translation_status": "reviewed"
  - "id": "bottle-024"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I have told you already why I sigh,” said the man. “It is because I fear my health is breaking up; and, as you said yourself, to die and go to the devil is a pity for anyone. As for why I sell so cheap, I must explain to you there is a peculiarity about the bottle. Long ago, when the devil brought it first upon earth, it was extremely expensive, and was sold first of all to Prester John for many millions of dollars; but it cannot be sold at all, unless sold at a loss. If you sell it for as much as you paid for it, back it comes to you again like a homing pigeon. It follows that the price has kept falling in these centuries, and the bottle is now remarkably cheap. I bought it myself from one of my great neighbours on this hill, and the price I paid was only ninety dollars. I could sell it for as high as eighty-nine dollars and ninety-nine cents, but not a penny dearer, or back the thing must come to me. Now, about this there are two bothers. First, when you offer a bottle so singular for eighty odd dollars, people suppose you to be jesting. And second—but there is no hurry about that—and I need not go into it. Only remember it must be coined money that you sell it for.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 501
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2910
        "line_end": 2926
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-024"
    "translation_ja": "「ため息のわけはもう話したと思うがね」と男は言った。「体がいよいよ駄目になるのではないかと怖いのさ。君も言ったように、誰だって死んで悪魔に引き渡されるのはごめんだからな。安く売るわけだが、これにはびんの変わった性質を説明しなくてはならん。大昔、悪魔が初めて地上に持ってきたとき、それはとほうもなく高価で、最初の買い手、祭司王ヨハネは何百万ドルも払った。ところが、損をする値でなければどんなことがあっても売れない。自分の買い値と同じだけで売れば、伝書鳩のように舞い戻ってくる。したがって値は何世紀も下がりつづけ、今では驚くほど安くなった。私はこの丘に住む近所の有力者の一人から買ったのだが、払った値はわずか九十ドルだった。八十九ドル九十九セントまでなら売れるが、それよりびた一文でも高ければ、びんは私のところへ帰らずにいない。さて、これには二つ厄介がある。第一、これほど不思議なびんを八十何ドルかで売りに出せば、誰でも冗談を言っていると思う。第二は……まあ急ぐことでもないし、立ち入るには及ぶまい。ただし、売る代金は鋳造した硬貨でなくてはならない。これだけは忘れないでくれ」"
    "translation_status": "reviewed"
  - "id": "bottle-025"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“How am I to know that this is all true?” asked Keawe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 502
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2928
        "line_end": 2928
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-025"
    "translation_ja": "「どうすれば、今の話が本当だとわかります？」とケアウェはたずねた。"
    "translation_status": "reviewed"
  - "id": "bottle-026"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Some of it you can try at once,” replied the man. “Give me your fifty dollars, take the bottle, and wish your fifty dollars back into your pocket. If that does not happen, I pledge you my honour I will cry off the bargain and restore your money.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 503
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2930
        "line_end": 2933
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-026"
    "translation_ja": "「一部なら今すぐ試せる」と男は答えた。「私に五十ドルを渡し、びんを受け取って、五十ドルよ、ポケットに戻ってこいと願ってみたまえ。そうならなければ、売買は取り消して金を返すと、私の名誉にかけて約束しよう」"
    "translation_status": "reviewed"
  - "id": "bottle-027"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You are not deceiving me?” said Keawe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 504
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2935
        "line_end": 2935
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-027"
    "translation_ja": "「おれをだましていませんね？」とケアウェは言った。"
    "translation_status": "reviewed"
  - "id": "bottle-028"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The man bound himself with a great oath."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 505
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2937
        "line_end": 2937
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-028"
    "translation_ja": "男は厳かに誓いを立てた。"
    "translation_status": "reviewed"
  - "id": "bottle-029"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, I will risk that much,” said Keawe, “for that can do no harm.” And he paid over his money to the man, and the man handed him the bottle."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 506
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2939
        "line_end": 2940
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-029"
    "translation_ja": "「よし、それだけなら賭けてみよう」とケアウェは言った。「それで何も悪いことにはなるまい」。金を男に払い、男はびんを渡した。"
    "translation_status": "reviewed"
  - "id": "bottle-030"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Imp of the bottle,” said Keawe, “I want my fifty dollars back.” And sure enough he had scarce said the word before his pocket was as heavy as ever."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 507
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2942
        "line_end": 2944
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-030"
    "translation_ja": "「びんの小鬼」とケアウェは言った。「五十ドルを返してくれ」。なるほど、そのひと言が終わるか終わらないかに、ポケットはもとどおり重くなっていた。"
    "translation_status": "reviewed"
  - "id": "bottle-031"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“To be sure this is a wonderful bottle,” said Keawe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 508
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2946
        "line_end": 2946
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-031"
    "translation_ja": "「確かに、こりゃ不思議なびんだ」とケアウェは言った。"
    "translation_status": "reviewed"
  - "id": "bottle-032"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And now good-morning to you, my fine fellow, and the devil go with you for me!” said the man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 509
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2948
        "line_end": 2949
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-032"
    "translation_ja": "「では、お若いの、これで失礼するよ。悪魔には私でなく君についていってもらうよ！」と男は言った。"
    "translation_status": "reviewed"
  - "id": "bottle-033"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Hold on,” said Keawe, “I don’t want any more of this fun. Here, take your bottle back.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 510
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2951
        "line_end": 2952
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-033"
    "translation_ja": "「待ってくれ」とケアウェは言った。「こんなお遊びはもうたくさんだ。さあ、びんを引き取ってくれ」"
    "translation_status": "reviewed"
  - "id": "bottle-034"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You have bought it for less than I paid for it,” replied the man, rubbing his hands. “It is yours now; and, for my part, I am only concerned to see the back of you.” And with that he rang for his Chinese servant, and had Keawe shown out of the house."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 511
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2954
        "line_end": 2957
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-034"
    "translation_ja": "「君は私の買い値より安く買った」と男は手をすり合わせて答えた。「もう君のものだ。私としては、あとは君の後ろ姿を見送りたいだけだよ」。そう言うとベルを鳴らして中国人の召使いを呼び、ケアウェを玄関から送り出させた。"
    "translation_status": "reviewed"
  - "id": "bottle-035"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now, when Keawe was in the street, with the bottle under his arm, he began to think. “If all is true about this bottle, I may have made a losing bargain,” thinks he. “But perhaps the man was only fooling me.” The first thing he did was to count his money; the sum was exact—forty-nine dollars American money, and one Chili piece. “That looks like the truth,” said Keawe. “Now I will try another part.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 512
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2959
        "line_end": 2964
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-035"
    "translation_ja": "さて、びんを小脇に抱えたまま往来に立つと、ケアウェは考え始めた。「あのびんの話がみんな本当なら、おれは損な買い物をしたかもしれない」と思った。「いや、あいつはおれをからかっただけかもしれない」。手始めに金を数えた。額は一銭の違いもない。アメリカ貨で四十九ドル、それにチリの硬貨が一枚。「ここまでは本当らしい」とケアウェは言った。「もう一つ試そう」"
    "translation_status": "reviewed"
  - "id": "bottle-036"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The streets in that part of the city were as clean as a ship’s decks, and though it was noon, there were no passengers. Keawe set the bottle in the gutter and walked away. Twice he looked back, and there was the milky, round-bellied bottle where he left it. A third time he looked back, and turned a corner; but he had scarce done so, when something knocked upon his elbow, and behold! it was the long neck sticking up; and as for the round belly, it was jammed into the pocket of his pilot-coat."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 513
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2966
        "line_end": 2972
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-036"
    "translation_ja": "町のその界隈は船の甲板みたいにきれいに掃き清められ、昼日なかだのに通る人もなかった。ケアウェはびんを道端の溝に置いて歩き去った。二度振り返ったが、乳白色の腹の丸いびんは置いたところにあった。三度目に振り返り、角を曲がった。と、そのとたん、何かが肘にこつんと当たった。見ればあの長い首が突き出ていて、丸い腹は厚手の船乗り上着のポケットにすっぽりはまっていた。"
    "translation_status": "reviewed"
  - "id": "bottle-037"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And that looks like the truth,” said Keawe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 514
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2974
        "line_end": 2974
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-037"
    "translation_ja": "「これも本当らしい」とケアウェは言った。"
    "translation_status": "reviewed"
  - "id": "bottle-038"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The next thing he did was to buy a cork-screw in a shop, and go apart into a secret place in the fields. And there he tried to draw the cork, but as often as he put the screw in, out it came again, and the cork as whole as ever."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 515
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2976
        "line_end": 2979
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-038"
    "translation_ja": "次に店でコルク抜きを買い、野原の人目につかないところまで行った。そこで栓を抜こうとしたが、何度ねじを食い込ませても、抜けてくるのはねじばかりで、コルクは無傷のままだった。"
    "translation_status": "reviewed"
  - "id": "bottle-039"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is some new sort of cork,” said Keawe, and all at once he began to shake and sweat, for he was afraid of that bottle."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 516
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2981
        "line_end": 2982
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-039"
    "translation_ja": "「これは何か新式のコルクだな」とケアウェは言った。と、にわかに震えがきて汗が噴きだした。びんが恐ろしくなったのだ。"
    "translation_status": "reviewed"
  - "id": "bottle-040"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On his way back to the port-side, he saw a shop where a man sold shells and clubs from the wild islands, old heathen deities, old coined money, pictures from China and Japan, and all manner of things that sailors bring in their sea-chests. And here he had an idea. So he went in and offered the bottle for a hundred dollars. The man of the shop laughed at him at the first, and offered him five; but, indeed, it was a curious bottle—such glass was never blown in any human glassworks, so prettily the colours shone under the milky white, and so strangely the shadow hovered in the midst; so, after he had disputed awhile after the manner of his kind, the shop-man gave Keawe sixty silver dollars for the thing, and set it on a shelf in the midst of his window."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 517
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2984
        "line_end": 2994
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-040"
    "translation_ja": "港の方へ戻る途中で一軒の店を見つけた。未開の島々の貝殻や棍棒、異教の古い神像や古銭、中国や日本の絵、その他、船乗りが船箪笥に入れて持ち帰るようなものなら何でも商っている。ここで一つ思いついた。中に入って、百ドルでびんを売ろうと持ちかけたのだ。店の男は初めは鼻で笑い、五ドルなら出すと言った。しかしまことに珍しいびんではある。乳白の下に色があまりに美しく照り映え、中ほどに漂う影はいかにも不思議で、人間のガラス工房ではこんなものは吹けたためしがない。そこで同業の常としてしばらく値切り合ったあげく、店の男はケアウェに銀貨で六十ドル払い、店の飾り窓の真ん中の棚にびんを据えた。"
    "translation_status": "reviewed"
  - "id": "bottle-041"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Now,” said Keawe, “I have sold that for sixty which I bought for fifty—or, to say truth, a little less, because one of my dollars was from Chili. Now I shall know the truth upon another point.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 518
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 2996
        "line_end": 2998
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-041"
    "translation_ja": "「さて」とケアウェは言った。「五十ドルで買ったものを六十ドルで売ったぞ。ほんとはチリの一ドルが交じっていたから、買い値はもう少し安い。これでもう一つの話の真偽がわかる」"
    "translation_status": "reviewed"
  - "id": "bottle-042"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So he went back on board his ship, and, when he opened his chest, there was the bottle, and had come more quickly than himself. Now Keawe had a mate on board whose name was Lopaka."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 519
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3000
        "line_end": 3002
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-042"
    "translation_ja": "ケアウェは自分の船に戻った。船箪笥を開けてみると、びんが入っていた。本人より先に帰り着いていたのだ。さて、船にはロパカという名のケアウェの仲間がいた。"
    "translation_status": "reviewed"
  - "id": "bottle-043"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What ails you?” said Lopaka, “that you stare in your chest?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 520
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3004
        "line_end": 3004
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-043"
    "translation_ja": "「どうかしたのか」とロパカは言った。「そんなに箪笥の中を見つめて」"
    "translation_status": "reviewed"
  - "id": "bottle-044"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They were alone in the ship’s forecastle, and Keawe bound him to secrecy, and told all."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 521
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3006
        "line_end": 3007
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-044"
    "translation_ja": "船首の船員室には二人しかいなかった。ケアウェは口外しないと約束させて、洗いざらい話した。"
    "translation_status": "reviewed"
  - "id": "bottle-045"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is a very strange affair,” said Lopaka; “and I fear you will be in trouble about this bottle. But there is one point very clear—that you are sure of the trouble, and you had better have the profit in the bargain. Make up your mind what you want with it; give the order, and if it is done as you desire, I will buy the bottle myself; for I have an idea of my own to get a schooner, and go trading through the islands.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 522
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3009
        "line_end": 3014
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-045"
    "translation_ja": "「ずいぶん妙な話だな。どうも、おまえはそのびんで困ることになりそうだ」とロパカは言った。「だが一つ、はっきりしている。どうせ厄介を背負い込むなら、それに見合う得もした方がいい。びんに何をしてほしいか腹を決めて、命令してみろ。望んだとおりになったら、こんどはおれが買おう。おれにはおれの望みがある。スクーナー船を手に入れて、島から島へ商いをして回りたいんだ」"
    "translation_status": "reviewed"
  - "id": "bottle-046"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“That is not my idea,” said Keawe; “but to have a beautiful house and garden on the Kona Coast, where I was born, the sun shining in at the door, flowers in the garden, glass in the windows, pictures on the walls, and toys and fine carpets on the tables, for all the world like the house I was in this day—only a storey higher, and with balconies all about like the King’s palace; and to live there without care and make merry with my friends and relatives.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 523
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3016
        "line_end": 3022
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-046"
    "translation_ja": "「おれの望みは船じゃない」とケアウェは言った。「生まれたコナの海岸に、きれいな庭と家が欲しい。戸口から陽が差し、庭には花、窓にはガラス、壁には絵、卓には上等な敷物と小さな飾り物がある。今日訪ねたあの家とそっくりで、ただ一階ぶん高く、王様の宮殿みたいに四方にベランダがめぐらしてある。そこで心配事なしに暮らして、友達や親類と楽しく過ごしたいんだ」"
    "translation_status": "reviewed"
  - "id": "bottle-047"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” said Lopaka, “let us carry it back with us to Hawaii; and if all comes true, as you suppose, I will buy the bottle, as I said, and ask a schooner.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 524
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3024
        "line_end": 3026
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-047"
    "translation_ja": "「よし」とロパカは言った。「びんをハワイまで持って帰ろう。おまえの思ったとおり何もかも本当になったら、約束どおりおれが買って、スクーナーを一隻頼むよ」"
    "translation_status": "reviewed"
  - "id": "bottle-048"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Upon that they were agreed, and it was not long before the ship returned to Honolulu, carrying Keawe and Lopaka, and the bottle. They were scarce come ashore when they met a friend upon the beach, who began at once to condole with Keawe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 525
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3028
        "line_end": 3031
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-048"
    "translation_ja": "そう話が決まり、いくらもたたないうちに、船はケアウェとロパカとびんを乗せてホノルルに帰った。二人が上陸するかしないかに浜で友達に出会った。その友達はいきなりケアウェにお悔やみを言い始めた。"
    "translation_status": "reviewed"
  - "id": "bottle-049"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I do not know what I am to be condoled about,” said Keawe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 526
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3033
        "line_end": 3033
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-049"
    "translation_ja": "「何のお悔やみを言ってくれているのか、わからんよ」とケアウェは言った。"
    "translation_status": "reviewed"
  - "id": "bottle-050"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Is it possible you have not heard,” said the friend, “your uncle—that good old man—is dead, and your cousin—that beautiful boy—was drowned at sea?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 527
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3035
        "line_end": 3037
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-050"
    "translation_ja": "「まさか聞いてないのかい」と友達は言った。「君のおじさん、あの人のいいお年寄りが亡くなって、いとこのあのきれいな男の子も海で溺れて死んだんだよ」"
    "translation_status": "reviewed"
  - "id": "bottle-051"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Keawe was filled with sorrow, and, beginning to weep and to lament, he forgot about the bottle. But Lopaka was thinking to himself, and presently, when Keawe’s grief was a little abated, “I have been thinking,” said Lopaka. “Had not your uncle lands in Hawaii, in the district of Kau?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 528
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3039
        "line_end": 3043
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-051"
    "translation_ja": "ケアウェは悲しみでいっぱいになり、泣いて嘆いて、びんのことなど忘れてしまった。だがロパカはひそかに考えをめぐらし、ケアウェの悲しみが少し鎮まるのを待って言った。「考えてたんだが、おまえのおじさんはハワイ島のカウのあたりに土地を持っていなかったか」"
    "translation_status": "reviewed"
  - "id": "bottle-052"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No,” said Keawe, “not in Kau; they are on the mountain-side—a little way south of Hookena.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 529
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3045
        "line_end": 3046
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-052"
    "translation_ja": "「いや、カウじゃない」とケアウェは言った。「山の斜面だ。ホオケナから少し南に行ったところさ」"
    "translation_status": "reviewed"
  - "id": "bottle-053"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“These lands will now be yours?” asked Lopaka."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 530
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3048
        "line_end": 3048
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-053"
    "translation_ja": "「じゃあ今度はその土地がおまえのものになるんだね？」とロパカはたずねた。"
    "translation_status": "reviewed"
  - "id": "bottle-054"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And so they will,” says Keawe, and began again to lament for his relatives."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 531
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3050
        "line_end": 3051
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-054"
    "translation_ja": "「ああ、そうなる」とケアウェは言って、また身内の死を嘆き始めた。"
    "translation_status": "reviewed"
  - "id": "bottle-055"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No,” said Lopaka, “do not lament at present. I have a thought in my mind. How if this should be the doing of the bottle? For here is the place ready for your house.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 532
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3053
        "line_end": 3055
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-055"
    "translation_ja": "「いや、嘆くのは今ちょっと待ってくれ」とロパカは言った。「思いついたことがあるんだ。もしこれがびんの仕業だとしたらどうだ？　ほら、おまえの家を建てる場所がちゃんとできた」"
    "translation_status": "reviewed"
  - "id": "bottle-056"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“If this be so,” cried Keawe, “it is a very ill way to serve me by killing my relatives. But it may be, indeed; for it was in just such a station that I saw the house with my mind’s eye.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 533
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3057
        "line_end": 3059
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-056"
    "translation_ja": "「もしそうなら」とケアウェは叫んだ。「身内を殺してまでおれに尽くすなんて、ひどいやり方だ。けど、本当にそうかもしれない。心の目にあの家が見えたのは、まさにそんな土地だったから」"
    "translation_status": "reviewed"
  - "id": "bottle-057"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“The house, however, is not yet built,” said Lopaka."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 534
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3061
        "line_end": 3061
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-057"
    "translation_ja": "「もっとも、家はまだ建ってはいない」とロパカは言った。"
    "translation_status": "reviewed"
  - "id": "bottle-058"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No, nor like to be!” said Keawe; “for though my uncle has some coffee and ava and bananas, it will not be more than will keep me in comfort; and the rest of that land is the black lava.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 535
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3063
        "line_end": 3065
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-058"
    "translation_ja": "「建ってないし、建ちそうもない！」とケアウェは言った。「おじの畑にはコーヒーとアヴァ（カヴァ）とバナナがいくらかあるが、おれ一人が不自由なく暮らすのがせいぜいだ。あとは黒い溶岩ばかりだよ」"
    "translation_status": "reviewed"
  - "id": "bottle-059"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Let us go to the lawyer,” said Lopaka; “I have still this idea in my mind.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 536
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3067
        "line_end": 3068
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-059"
    "translation_ja": "「弁護士のところへ行こう」とロパカは言った。「おれはまだ、さっきの考えを捨てちゃいない」"
    "translation_status": "reviewed"
  - "id": "bottle-060"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now, when they came to the lawyer’s, it appeared Keawe’s uncle had grown monstrous rich in the last days, and there was a fund of money."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 537
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3070
        "line_end": 3071
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-060"
    "translation_ja": "さて弁護士のところへ行ってみると、ケアウェのおじは晩年おそろしく裕福になっていて、まとまった金を残していたとわかった。"
    "translation_status": "reviewed"
  - "id": "bottle-061"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“And here is the money for the house!” cried Lopaka."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 538
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3073
        "line_end": 3073
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-061"
    "translation_ja": "「さあ、おまえの家の建築費だ！」とロパカは叫んだ。"
    "translation_status": "reviewed"
  - "id": "bottle-062"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“If you are thinking of a new house,” said the lawyer, “here is the card of a new architect, of whom they tell me great things.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 539
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3075
        "line_end": 3076
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-062"
    "translation_ja": "「新しい家をお考えでしたら」と弁護士は言った。「ここに新進の建築家の名刺があります。たいそうな評判を聞いておりますよ」"
    "translation_status": "reviewed"
  - "id": "bottle-063"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Better and better!” cried Lopaka. “Here is all made plain for us. Let us continue to obey orders.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 540
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3078
        "line_end": 3079
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-063"
    "translation_ja": "「ますます結構！」とロパカは叫んだ。「手はずは残らず整えてある。さあ、このまま仰せに従おう」"
    "translation_status": "reviewed"
  - "id": "bottle-064"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So they went to the architect, and he had drawings of houses on his table."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 541
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3081
        "line_end": 3082
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-064"
    "translation_ja": "そこで二人は建築家を訪ねた。机の上には家の図面がいくつもあった。"
    "translation_status": "reviewed"
  - "id": "bottle-065"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You want something out of the way,” said the architect. “How do you like this?” and he handed a drawing to Keawe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 542
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3084
        "line_end": 3085
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-065"
    "translation_ja": "「何か並ではない家をお望みですね」と建築家は言った。「これはいかがでしょう」。そう言って図面を一枚、ケアウェに渡した。"
    "translation_status": "reviewed"
  - "id": "bottle-066"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now, when Keawe set eyes on the drawing, he cried out aloud, for it was the picture of his thought exactly drawn."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 543
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3087
        "line_end": 3088
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-066"
    "translation_ja": "ケアウェは図面をひと目見るなり、大きな声をあげた。心に描いたものが寸分たがわず描いてあったからだ。"
    "translation_status": "reviewed"
  - "id": "bottle-067"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I am in for this house,” thought he. “Little as I like the way it comes to me, I am in for it now, and I may as well take the good along with the evil.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 544
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3090
        "line_end": 3092
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-067"
    "translation_ja": "「どうやらこの家は、おれのものになるらしい」と彼は思った。「こんなふうに転がり込んでくるのは少しも気に入らないが、そうなると決まっているのなら、悪いこともいいことも、まとめて引き受けよう」"
    "translation_status": "reviewed"
  - "id": "bottle-068"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So he told the architect all that he wished, and how he would have that house furnished, and about the pictures on the wall and the knick-knacks on the tables; and he asked the man plainly for how much he would undertake the whole affair."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 545
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3094
        "line_end": 3097
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-068"
    "translation_ja": "そこで彼は建築家に、望みのすべてを話した。家の中をどうしつらえたいか、壁の絵から卓上の小物に至るまで話し、全部込みでいくらなら引き受けてくれるか、率直にたずねた。"
    "translation_status": "reviewed"
  - "id": "bottle-069"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The architect put many questions, and took his pen and made a computation; and when he had done he named the very sum that Keawe had inherited."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 546
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3099
        "line_end": 3101
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-069"
    "translation_ja": "建築家はいろいろと質問し、ペンを取って計算した。終えて口にした額は、まさにケアウェが相続した金額そのままだった。"
    "translation_status": "reviewed"
  - "id": "bottle-070"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Lopaka and Keawe looked at one another and nodded."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 547
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3103
        "line_end": 3103
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-070"
    "translation_ja": "ロパカとケアウェは顔を見合わせてうなずいた。"
    "translation_status": "reviewed"
  - "id": "bottle-071"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It is quite clear,” thought Keawe, “that I am to have this house, whether or no. It comes from the devil, and I fear I will get little good by that; and of one thing I am sure, I will make no more wishes as long as I have this bottle. But with the house I am saddled, and I may as well take the good along with the evil.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 548
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3105
        "line_end": 3109
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-071"
    "translation_ja": "「はっきりした」とケアウェは思った。「いやでも応でもこの家はおれのものになる。悪魔から来たもので、あまりよいことにはなるまい。一つ決めたぞ。このびんがおれの手にあるかぎり、二度と願い事はしない。だが家はもう背負い込んでしまった。悪いことと一緒に、いいことも受け取ろう」"
    "translation_status": "reviewed"
  - "id": "bottle-072"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So he made his terms with the architect, and they signed a paper; and Keawe and Lopaka took ship again and sailed to Australia; for it was concluded between them they should not interfere at all, but leave the architect and the bottle imp to build and to adorn that house at their own pleasure."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 549
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3111
        "line_end": 3115
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-072"
    "translation_ja": "彼は建築家と条件を決めて、二人は契約書に署名した。それからケアウェとロパカはまた船に乗ってオーストラリアへ向かった。自分たちからは何一つ口を挟まず、家を建てて飾るのは建築家とびんの小鬼に任せ、好きなようにさせようと、二人で取り決めていたのである。"
    "translation_status": "reviewed"
  - "id": "bottle-073"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The voyage was a good voyage, only all the time Keawe was holding in his breath, for he had sworn he would utter no more wishes, and take no more favours from the devil. The time was up when they got back. The architect told them that the house was ready, and Keawe and Lopaka took a passage in the Hall, and went down Kona way to view the house, and see if all had been done fitly according to the thought that was in Keawe’s mind."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 550
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3117
        "line_end": 3123
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-073"
    "translation_ja": "よい航海だった。ただしその間ずっと、ケアウェは息を潜めていた。もう願い事は口にしない、悪魔の恩はこれ以上受けない、と誓ったからだ。帰り着いたときには工期は過ぎていた。家は出来上がったと建築家に聞き、二人はホール号の船客となってコナの方へ向かった。家を見て、ケアウェの心に描いていたとおりに、すべて具合よくできているかどうかを確かめるためである。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 299
          "end": 303
          "exact": "Hall"
  - "id": "bottle-074"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now the house stood on the mountain side, visible to ships. Above, the forest ran up into the clouds of rain; below, the black lava fell in cliffs, where the kings of old lay buried. A garden bloomed about that house with every hue of flowers; and there was an orchard of papaia on the one hand and an orchard of breadfruit on the other, and right in front, toward the sea, a ship’s mast had been rigged up and bore a flag. As for the house, it was three storeys high, with great chambers and broad balconies on each. The windows were of glass, so excellent that it was as clear as water and as bright as day. All manner of furniture adorned the chambers. Pictures hung upon the wall in golden frames: pictures of ships, and men fighting, and of the most beautiful women, and of singular places; nowhere in the world are there pictures of so bright a colour as those Keawe found hanging in his house. As for the knick-knacks, they were extraordinary fine; chiming clocks and musical boxes, little men with nodding heads, books filled with pictures, weapons of price from all quarters of the world, and the most elegant puzzles to entertain the leisure of a solitary man. And as no one would care to live in such chambers, only to walk through and view them, the balconies were made so broad that a whole town might have lived upon them in delight; and Keawe knew not which to prefer, whether the back porch, where you got the land breeze, and looked upon the orchards and the flowers, or the front balcony, where you could drink the wind of the sea, and look down the steep wall of the mountain and see the Hall going by once a week or so between Hookena and the hills of Pele, or the schooners plying up the coast for wood and ava and bananas."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 551
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3125
        "line_end": 3149
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-074"
    "translation_ja": "家は、船からも見える山の斜面に建っていた。その上では森が雨雲の中までせり上がり、下では黒い溶岩が断崖となって切れ落ち、そこに昔の王たちが葬られていた。家のまわりの庭にはありとあらゆる色の花が咲き、一方にはパパイア畑、もう一方にはパンノキ畑があった。真正面の海に向いた側には船のマストが据えられ、旗が揚がっていた。家そのものは三階建てで、どの階にも大きな部屋と広いベランダがあった。窓はガラスで、それも水ほどに透き通り白昼のように明るい、見事な品だった。部屋にはありとあらゆる調度が並んでいた。壁には金の額に入った絵が掛かっていた。船の絵、戦う男たちの絵、この上なく美しい女たちの絵、珍しい土地の絵。ケアウェが自分の家に見いだした絵ほど色鮮やかな絵は、世界のどこにもあるまい。小物に至っては並外れて気が利いていた。時を奏でる時計やオルゴール、首を振る人形、絵の詰まった本、世界の隅々から集めた高価な武器、一人暮らしの手すさびにこの上なく洒落た知恵の輪。こんな部屋は歩いて見て回るだけで、ここで日を暮らしたいとは誰も思うまいというので、ベランダは町一つが丸ごと機嫌よく暮らせるほどの広さに造ってあった。裏手の縁で陸風に吹かれながら果樹や花を眺めるのと、表のベランダで海風を胸いっぱいに吸い、そそり立つ山肌のはるか下に、週に一度ほどホオケナとペレの丘を結ぶホール号や、木材やアヴァやバナナを求めて岸沿いに上っていくスクーナーを眺めるのと、どちらがよいか、ケアウェには決められなかった。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 1607
          "end": 1611
          "exact": "Hall"
  - "id": "bottle-075"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When they had viewed all, Keawe and Lopaka sat on the porch."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 552
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3151
        "line_end": 3151
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-075"
    "translation_ja": "すべて見て回ると、ケアウェとロパカは縁に腰を下ろした。"
    "translation_status": "reviewed"
  - "id": "bottle-076"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well,” asked Lopaka, “is it all as you designed?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 553
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3153
        "line_end": 3153
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-076"
    "translation_ja": "「それで」とロパカはたずねた。「何もかも、おまえが思い描いたとおりか」"
    "translation_status": "reviewed"
  - "id": "bottle-077"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Words cannot utter it,” said Keawe. “It is better than I dreamed, and I am sick with satisfaction.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 554
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3155
        "line_end": 3156
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-077"
    "translation_ja": "「口では言えない」とケアウェは言った。「夢に見た以上だ。満足しすぎて気が遠くなるよ」"
    "translation_status": "reviewed"
  - "id": "bottle-078"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There is but one thing to consider,” said Lopaka; “all this may be quite natural, and the bottle imp have nothing whatever to say to it. If I were to buy the bottle, and got no schooner after all, I should have put my hand in the fire for nothing. I gave you my word, I know; but yet I think you would not grudge me one more proof.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 555
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3158
        "line_end": 3162
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-078"
    "translation_ja": "「一つだけ考えておかにゃならん」とロパカは言った。「こりゃまるっきり自然の成り行きで、びんの小鬼は何の関係もないのかもしれん。おれがびんを買って、それでもスクーナーが手に入らなかったら、何にもならんのに火の中へ手を突っ込んだも同然だ。約束したことは承知してる。それでも、もう一度だけ証拠が欲しいと言ったって、おまえは嫌がらんと思うが」"
    "translation_status": "reviewed"
  - "id": "bottle-079"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I have sworn I would take no more favours,” said Keawe. “I have gone already deep enough.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 556
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3164
        "line_end": 3165
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-079"
    "translation_ja": "「これ以上、恩は受けないと誓ったんだ」とケアウェは言った。「もう十分、深みにはまった」"
    "translation_status": "reviewed"
  - "id": "bottle-080"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“This is no favour I am thinking of,” replied Lopaka. “It is only to see the imp himself. There is nothing to be gained by that, and so nothing to be ashamed of; and yet, if I once saw him, I should be sure of the whole matter. So indulge me so far, and let me see the imp; and, after that, here is the money in my hand, and I will buy it.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 557
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3167
        "line_end": 3171
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-080"
    "translation_ja": "「おれは何か恵んでもらおうというんじゃない」とロパカは答えた。「ただ小鬼そのものを見たいんだ。それで得をするわけじゃなし、恥じることもない。でも一度こいつを見さえすれば、何もかも確かだと分かる。それくらいは聞き入れて、小鬼を見せてくれ。そうしてくれたら、ほら、金はこの手にある。おれが買うよ」"
    "translation_status": "reviewed"
  - "id": "bottle-081"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“There is only one thing I am afraid of,” said Keawe. “The imp may be very ugly to view; and if you once set eyes upon him you might be very undesirous of the bottle.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 558
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3173
        "line_end": 3175
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-081"
    "translation_ja": "「一つだけ心配なんだ」とケアウェは言った。「小鬼が見るも醜い姿をしているかもしれない。一目見たら、おまえ、びんがすっかり欲しくなくなるかもしれないぞ」"
    "translation_status": "reviewed"
  - "id": "bottle-082"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I am a man of my word,” said Lopaka. “And here is the money betwixt us.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 559
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3177
        "line_end": 3178
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-082"
    "translation_ja": "「おれは言ったことを守る男だ」とロパカは言った。「ほら、金はここ、二人の間に置いておく」"
    "translation_status": "reviewed"
  - "id": "bottle-083"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Very well,” replied Keawe. “I have a curiosity myself. So come, let us have one look at you, Mr. Imp.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 560
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3180
        "line_end": 3181
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-083"
    "translation_ja": "「よろしい」とケアウェは答えた。「おれだって、どんなものか見たくはある。さあ、小鬼どの、ちょっとお顔を見せてくれ」"
    "translation_status": "reviewed"
  - "id": "bottle-084"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now as soon as that was said, the imp looked out of the bottle, and in again, swift as a lizard; and there sat Keawe and Lopaka turned to stone. The night had quite come, before either found a thought to say or voice to say it with; and then Lopaka pushed the money over and took the bottle."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 561
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3183
        "line_end": 3187
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-084"
    "translation_ja": "そう言うやいなや、小鬼はびんの外に顔を出し、トカゲのすばやさでまた引っ込んだ。ケアウェもロパカも石になったように座り込んでいた。二人のどちらかに何か言うことが思いつき、それを言う声が出たのは、すっかり夜になってからだった。そこでロパカは金を押しやって、びんを取った。"
    "translation_status": "reviewed"
  - "id": "bottle-085"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I am a man of my word,” said he, “and had need to be so, or I would not touch this bottle with my foot. Well, I shall get my schooner and a dollar or two for my pocket; and then I will be rid of this devil as fast as I can. For to tell you the plain truth, the look of him has cast me down.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 562
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3189
        "line_end": 3193
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-085"
    "translation_ja": "「おれは言ったことを守る男だ」と彼は言った。「そういう男でなかったら、こんなびん、足先でだって触るものか。まあ、スクーナーと、懐に入れる一ドルか二ドルをもらって、そうしたら一刻も早くこの悪魔を追い払うよ。本当を言えば、あの姿を見てすっかり気がめいった」"
    "translation_status": "reviewed"
  - "id": "bottle-086"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Lopaka,” said Keawe, “do not you think any worse of me than you can help; I know it is night, and the roads bad, and the pass by the tombs an ill place to go by so late, but I declare since I have seen that little face, I cannot eat or sleep or pray till it is gone from me. I will give you a lantern and a basket to put the bottle in, and any picture or fine thing in all my house that takes your fancy;—and be gone at once, and go sleep at Hookena with Nahinu.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 563
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3195
        "line_end": 3201
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-086"
    "translation_ja": "「ロパカ」とケアウェは言った。「なるべくおれを悪く思わないでくれ。夜なのも、道が悪いのも、こんなに遅く墓場のそばの峠を通るのが嫌なものなのも承知だ。だけどあの小さな顔を見てしまったら、こいつがおれのそばからいなくなるまでは、食べることも眠ることも、お祈りすることさえできない。手提げ灯と、びんを入れる籠をやる。それに家の中の絵でもきれいな品でも、好きなものを一つやる。だからすぐ出発してくれ。ホオケナのナヒヌのところに泊まるといい」"
    "translation_status": "reviewed"
  - "id": "bottle-087"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Keawe,” said Lopaka, “many a man would take this ill; above all, when I am doing you a turn so friendly, as to keep my word and buy the bottle; and for that matter, the night and the dark, and the way by the tombs, must be all tenfold more dangerous to a man with such a sin upon his conscience, and such a bottle under his arm. But for my part, I am so extremely terrified myself, I have not the heart to blame you. Here I go then; and I pray God you may be happy in your house, and I fortunate with my schooner, and both get to heaven in the end in spite of the devil and his bottle.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 564
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3203
        "line_end": 3211
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-087"
    "translation_ja": "「ケアウェ」とロパカは言った。「こんなことを言われれば、たいていの男は気を悪くするだろう。ましておれは、約束どおりびんを買って、おまえのためにひと肌脱いでいるんだ。しかも夜の闇も墓場をかすめる道も、胸にこんな罪を、小脇にこんなびんを抱えている男には十倍も危ないに違いない。けれどおれ自身あんまり恐ろしいので、おまえを責める気にはなれないよ。じゃあ、行く。おまえがこの家で幸せに、おれがスクーナーで幸運に恵まれ、悪魔もびんもものかは、しまいには二人とも天国に行けますように。神様にそう祈るよ」"
    "translation_status": "reviewed"
  - "id": "bottle-088"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So Lopaka went down the mountain; and Keawe stood in his front balcony, and listened to the clink of the horse’s shoes, and watched the lantern go shining down the path, and along the cliff of caves where the old dead are buried; and all the time he trembled and clasped his hands, and prayed for his friend, and gave glory to God that he himself was escaped out of that trouble."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 565
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3213
        "line_end": 3218
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-088"
    "translation_ja": "ロパカは山を下りていった。ケアウェは表のベランダに立って馬の蹄鉄のかちかち鳴る音を聞き、小道を下り、昔の死者たちの眠る洞穴の並んだ崖に沿って遠ざかる灯を見守った。そのあいだずっと、震えながら両手を組み、友のために祈り、自分があの難儀を逃れたことを神に感謝し、その栄光をたたえていた。"
    "translation_status": "reviewed"
  - "id": "bottle-089"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But the next day came very brightly, and that new house of his was so delightful to behold that he forgot his terrors. One day followed another, and Keawe dwelt there in perpetual joy. He had his place on the back porch; it was there he ate and lived, and read the stories in the Honolulu newspapers; but when anyone came by they would go in and view the chambers and the pictures. And the fame of the house went far and wide; it was called Ka-Hale Nui—the Great House—in all Kona; and sometimes the Bright House, for Keawe kept a Chinaman, who was all day dusting and furbishing; and the glass, and the gilt, and the fine stuffs, and the pictures, shone as bright as the morning. As for Keawe himself, he could not walk in the chambers without singing, his heart was so enlarged; and when ships sailed by upon the sea, he would fly his colours on the mast."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 566
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3220
        "line_end": 3232
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-089"
    "translation_ja": "だが翌日はじつに明るく夜が明け、新しい家は眺めるだけであまりに楽しく、彼は恐怖を忘れた。一日また一日と過ぎ、ケアウェはそこで喜びの絶えない日々を送った。裏の縁に定席があり、そこで食べ、そこで暮らし、ホノルルの新聞に載る読み物を読んだ。人が訪ねてくると一緒に中へ入って、部屋や絵を見て回った。家の評判は遠くまで伝わり、コナ一帯でカ・ハレ・ヌイ、すなわち「大邸宅」と呼ばれた。「輝く家」とも呼ばれたのは、ケアウェが雇った中国人が一日じゅう埃を払い磨き上げていて、ガラスも金箔も上等な布も絵も、朝のように明るく輝いていたからだ。ケアウェ自身は嬉しさに胸がいっぱいで、歌わずに部屋を歩くこともできなかった。沖を船が通ると、マストには旗を掲げた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 441
          "end": 452
          "exact": "Ka-Hale Nui"
  - "id": "bottle-090"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So time went by, until one day Keawe went upon a visit as far as Kailua to certain of his friends. There he was well feasted; and left as soon as he could the next morning, and rode hard, for he was impatient to behold his beautiful house; and, besides, the night then coming on was the night in which the dead of old days go abroad in the sides of Kona; and having already meddled with the devil, he was the more chary of meeting with the dead. A little beyond Honaunau, looking far ahead, he was aware of a woman bathing in the edge of the sea; and she seemed a well-grown girl, but he thought no more of it. Then he saw her white shift flutter as she put it on, and then her red holoku; and by the time he came abreast of her she was done with her toilet, and had come up from the sea, and stood by the track-side in her red holoku, and she was all freshened with the bath, and her eyes shone and were kind. Now Keawe no sooner beheld her than he drew rein."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 567
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3234
        "line_end": 3247
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-090"
    "translation_ja": "こうして時が過ぎた。ある日、ケアウェは友人たちを訪ねてカイルアまで出かけた。手厚くご馳走になり、翌朝はできるだけ早く発って、馬を飛ばした。美しいわが家を早く見たかったし、その日の晩は、昔の死者たちがコナの山腹を出歩く晩でもあった。一度悪魔にかかわった身なので、死者と出会うのはなおさら避けたかった。ホナウナウを少し行き過ぎたところで遠くを望むと、女が波打ち際で水浴びしていた。すらりと育った娘のようだと思ったきり、別に気にも留めなかった。やがて白い肌着を着るのがひらひらと見え、つづいて赤いホロクが見えた。彼が横まで来たときには娘は身支度を済ませ、海から上がって赤いホロク姿で道端に立っていた。水浴びを終えたばかりの娘はすがすがしく、その目は優しく輝いていた。ケアウェは娘を見るなり手綱を引いた。"
    "translation_status": "reviewed"
  - "id": "bottle-091"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I thought I knew everyone in this country,” said he. “How comes it that I do not know you?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 568
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3249
        "line_end": 3250
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-091"
    "translation_ja": "「この土地の人ならみんな知ってると思ってたんだが、どうして君を知らなかったんだろう」と彼は言った。"
    "translation_status": "reviewed"
  - "id": "bottle-092"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I am Kokua, daughter of Kiano,” said the girl, “and I have just returned from Oahu. Who are you?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 569
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3252
        "line_end": 3253
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-092"
    "translation_ja": "「キアノの娘のコクアよ。ちょうどオアフから帰ってきたの。あなたは誰？」"
    "translation_status": "reviewed"
  - "id": "bottle-093"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“I will tell you who I am in a little,” said Keawe, dismounting from his horse, “but not now. For I have a thought in my mind, and if you knew who I was, you might have heard of me, and would not give me a true answer. But tell me, first of all, one thing: Are you married?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 570
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3255
        "line_end": 3258
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-093"
    "translation_ja": "「誰だかはあとで教えるよ。今はまだだ」とケアウェは馬から下りて言った。「おれには考えがある。名を知ったら、君はおれの噂を聞いたことがあるかもしれない。そうしたら本当の返事をしてくれないかもしれないんだ。まず一つだけ聞かせてくれ。結婚してる？」"
    "translation_status": "reviewed"
  - "id": "bottle-094"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At this Kokua laughed out aloud. “It is you who ask questions,” she said. “Are you married yourself?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 571
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3260
        "line_end": 3261
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-094"
    "translation_ja": "それを聞いてコクアは声をあげて笑った。「質問ばかりなさるのね。ご自分は結婚なさってるの？」"
    "translation_status": "reviewed"
  - "id": "bottle-095"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Indeed, Kokua, I am not,” replied Keawe, “and never thought to be until this hour. But here is the plain truth. I have met you here at the roadside, and I saw your eyes, which are like the stars, and my heart went to you as swift as a bird. And so now, if you want none of me, say so, and I will go on to my own place; but if you think me no worse than any other young man, say so, too, and I will turn aside to your father’s for the night, and to-morrow I will talk with the good man.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 572
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3263
        "line_end": 3269
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-095"
    "translation_ja": "「いや、していないよ、コクア」とケアウェは答えた。「それに今、この時まで、しようと思ったこともない。だが本当のことを言おう。ここで君に出会い、星のような君の目を見たら、おれの心は鳥のような速さで君のもとへ飛んでいった。だからおれなんか真っ平ならそう言ってくれ。そのまま自分の家に帰るよ。ほかの若い男と比べておれもそう捨てたものじゃないと思ってくれるなら、それならそう言ってほしい。今夜はお父さんの家に寄って泊まり、明日その方と話をしよう」"
    "translation_status": "reviewed"
  - "id": "bottle-096"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Kokua said never a word, but she looked at the sea and laughed."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 573
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3271
        "line_end": 3271
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-096"
    "translation_ja": "コクアは何も言わず、ただ海を見て笑った。"
    "translation_status": "reviewed"
  - "id": "bottle-097"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Kokua,” said Keawe, “if you say nothing, I will take that for the good answer; so let us be stepping to your father’s door.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 574
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3273
        "line_end": 3274
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-097"
    "translation_ja": "「コクア」とケアウェは言った。「何も言わなければ、いい方の返事だと思うよ。さあ、お父さんの家の戸口まで歩こう」"
    "translation_status": "reviewed"
  - "id": "bottle-098"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "She went on ahead of him, still without speech; only sometimes she glanced back and glanced away again, and she kept the strings of her hat in her mouth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 575
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3276
        "line_end": 3278
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-098"
    "translation_ja": "彼女は何も言わぬまま先に立って歩いた。ただ時おりちらと振り向いてはまた目をそらし、帽子の紐をずっと口にくわえていた。"
    "translation_status": "reviewed"
  - "id": "bottle-099"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now, when they had come to the door, Kiano came out on his verandah, and cried out and welcomed Keawe by name. At that the girl looked over, for the fame of the great house had come to her ears; and, to be sure, it was a great temptation. All that evening they were very merry together; and the girl was as bold as brass under the eyes of her parents, and made a mock of Keawe, for she had a quick wit. The next day he had a word with Kiano, and found the girl alone."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 576
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3280
        "line_end": 3286
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-099"
    "translation_ja": "戸口に来ると、キアノはベランダへ出てきて、ケアウェの名を呼んで歓迎した。それを聞いて娘はちらりと彼を見た。大邸宅の評判は彼女の耳にも届いていて、なるほどそれは大いに心をひくものだった。その晩はみんなして上機嫌に過ごした。両親の目の前では娘は物怖じひとつしなかった。機転の利く娘で、ケアウェをからかってばかりいた。翌日ケアウェはキアノと言葉を交わし、それから娘が一人でいるところを見つけた。"
    "translation_status": "reviewed"
  - "id": "bottle-100"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Kokua,” said he, “you made a mock of me all the evening; and it is still time to bid me go. I would not tell you who I was, because I have so fine a house, and I feared you would think too much of that house and too little of the man that loves you. Now you know all, and if you wish to have seen the last of me, say so at once.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 577
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3288
        "line_end": 3292
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-100"
    "translation_ja": "「コクア」と彼は言った。「昨夜はずいぶんおれをからかったね。帰ってくれと言うなら、まだ間に合うよ。名を教えなかったのは、たいそう立派な家を持っているせいだ。家の方は大事に思っても、君を愛する男のことはそれほどでもない、となるのが怖かった。もう全部わかったね。会うのはこれっきりにしたいなら、今すぐ言ってくれ」"
    "translation_status": "reviewed"
  - "id": "bottle-101"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No,” said Kokua; but this time she did not laugh, nor did Keawe ask for more."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 578
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3294
        "line_end": 3295
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-101"
    "translation_ja": "「いや」とコクアは言った。今度は笑わなかった。ケアウェもそれ以上は望まなかった。"
    "translation_status": "reviewed"
  - "id": "bottle-102"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This was the wooing of Keawe; things had gone quickly; but so an arrow goes, and the ball of a rifle swifter still, and yet both may strike the target. Things had gone fast, but they had gone far also, and the thought of Keawe rang in the maiden’s head; she heard his voice in the breach of the surf upon the lava, and for this young man that she had seen but twice she would have left father and mother and her native islands. As for Keawe himself, his horse flew up the path of the mountain under the cliff of tombs, and the sound of the hoofs, and the sound of Keawe singing to himself for pleasure, echoed in the caverns of the dead. He came to the Bright House, and still he was singing. He sat and ate in the broad balcony, and the Chinaman wondered at his master, to hear how he sang between the mouthfuls. The sun went down into the sea, and the night came; and Keawe walked the balconies by lamplight, high on the mountains, and the voice of his singing startled men on ships."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 579
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3297
        "line_end": 3310
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-102"
    "translation_ja": "これがケアウェの求婚だった。話は早く進んだ。しかし矢は速く飛び、銃弾はなお速く飛ぶが、どちらも的には当たる。話は早かったが、届いたところも遠かった。娘の頭にはケアウェを思う気持ちが鳴り響き、溶岩に砕ける波にも彼の声を聞いた。たった二度会ったこの若者のためなら、父も母も生まれ故郷の島々も後にしたことだろう。さてケアウェの馬は墓穴の崖の下を山道に沿って飛ぶように駆け上がった。蹄の音と、嬉しさにケアウェがひとりで歌う声とが、死者の眠る洞穴に響いた。「輝く家」に帰り着いても歌はやまなかった。広いベランダに腰を下ろして食事をし、ひと口食べるごとに歌うので、中国人の召使いは主人を不思議に思った。日が海に沈んで夜になり、ケアウェは山の高みで灯火に照らされたベランダを歩き回った。その歌声に沖の船の人々が驚いた。"
    "translation_status": "reviewed"
  - "id": "bottle-103"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Here am I now upon my high place,” he said to himself. “Life may be no better; this is the mountain top; and all shelves about me toward the worse. For the first time I will light up the chambers, and bathe in my fine bath with the hot water and the cold, and sleep alone in the bed of my bridal chamber.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 580
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3312
        "line_end": 3316
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-103"
    "translation_ja": "「今おれは、高みにのぼりつめた」と彼は独り言を言った。「人生にこれ以上は望めまい。ここが山のてっぺんで、どちらを向いても下り坂だ。今夜は初めてどの部屋にも灯を入れよう。湯も水も出る上等な風呂につかって、婚礼の間の寝台に一人で寝よう」"
    "translation_status": "reviewed"
  - "id": "bottle-104"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So the Chinaman had word, and he must rise from sleep and light the furnaces; and as he wrought below, beside the boilers, he heard his master singing and rejoicing above him in the lighted chambers. When the water began to be hot the Chinaman cried to his master; and Keawe went into the bathroom; and the Chinaman heard him sing as he filled the marble basin; and heard him sing, and the singing broken, as he undressed; until of a sudden, the song ceased. The Chinaman listened, and listened; he called up the house to Keawe to ask if all were well, and Keawe answered him “Yes,” and bade him go to bed; but there was no more singing in the Bright House; and all night long, the Chinaman heard his master’s feet go round and round the balconies without repose."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 581
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3318
        "line_end": 3328
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-104"
    "translation_ja": "中国人は言いつけを受け、眠っていたところを起こされて、焚き口に火を入れねばならなかった。下の湯沸かしのそばで働く頭上では、明るく灯した部屋で主人が喜んで歌っていた。湯が熱くなりかけると、彼は主人に声をかけた。ケアウェが浴室に入り、大理石の浴槽に湯を張りながら歌うのが聞こえた。服を脱ぎながら歌い、歌が途切れ途切れになり、突然ぴたりとやんだ。中国人はじっと、じっと耳を澄ませた。大丈夫ですか、と上のケアウェに声をかけると、ケアウェは「ああ」と答え、寝ていいよ、と言った。しかし「輝く家」からはもう歌は聞こえなかった。中国人はひと晩じゅう、主人の足が休みなくベランダをぐるぐる回るのを聞いた。"
    "translation_status": "reviewed"
  - "id": "bottle-105"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now the truth of it was this: as Keawe undressed for his bath, he spied upon his flesh a patch like a patch of lichen on a rock, and it was then that he stopped singing. For he knew the likeness of that patch, and knew that he was fallen in the Chinese Evil. {5}"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 582
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3330
        "line_end": 3333
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-105"
    "translation_ja": "じつはこうだった。風呂に入るために服を脱いでいたケアウェは、肌の上に岩にこびりついた地衣に似た斑点を見つけた。そのとき歌がやんだのだ。彼はその斑点の姿に見覚えがあった。「中国病」と呼ばれる病に自分がかかったのだと悟ったのである。〔原注5〕"
    "translation_status": "reviewed"
  - "id": "bottle-106"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now, it is a sad thing for any man to fall into this sickness. And it would be a sad thing for anyone to leave a house so beautiful and so commodious, and depart from all his friends to the north coast of Molokai between the mighty cliff and the sea-breakers. But what was that to the case of the man Keawe, he who had met his love but yesterday, and won her but that morning, and now saw all his hopes break, in a moment, like a piece of glass?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 583
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3335
        "line_end": 3341
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-106"
    "translation_ja": "さて、この病にかかるのは誰にとっても悲しいことである。これほど美しく住み心地のいい家を離れ、友たちみなに別れを告げ、断崖と砕ける波の間にはさまれたモロカイ島の北岸に行くのも、誰にとっても悲しかろう。だがケアウェという男に起きたことに比べれば、それが何だろう。恋人に会ったのはほんの昨日、その心を得たのはやっと今朝。それなのに今、すべての望みがひと息にガラスのように砕けたのを目の当たりにしたのだ。"
    "translation_status": "reviewed"
  - "id": "bottle-107"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Awhile he sat upon the edge of the bath; then sprang, with a cry, and ran outside; and to and fro, to and fro, along the balcony, like one despairing."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 584
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3343
        "line_end": 3345
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-107"
    "translation_ja": "彼はしばらく浴槽の縁に座っていた。それから叫び声とともに跳ね起き、外に駆け出し、望みを絶たれた人のように、ベランダを行ったり来たり、また行ったり来たりした。"
    "translation_status": "reviewed"
  - "id": "bottle-108"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Very willingly could I leave Hawaii, the home of my fathers,” Keawe was thinking. “Very lightly could I leave my house, the high-placed, the many-windowed, here upon the mountains. Very bravely could I go to Molokai, to Kalaupapa by the cliffs, to live with the smitten and to sleep there, far from my fathers. But what wrong have I done, what sin lies upon my soul, that I should have encountered Kokua coming cool from the sea-water in the evening? Kokua, the soul ensnarer! Kokua, the light of my life! Her may I never wed, her may I look upon no longer, her may I no more handle with my loving hand; and it is for this, it is for you, O Kokua! that I pour my lamentations!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 585
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3347
        "line_end": 3356
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-108"
    "translation_ja": "「先祖の故郷ハワイを去るのなら、喜んで去りもしよう」とケアウェは思った。「この高い山に立ち、たくさん窓のあるわが家だって、たやすく捨てられる。モロカイへ、崖の下のカラウパパへ赴いて、同じ病の人々と暮らし、祖先の眠る土地から遠く離れてそこで眠るのだって、勇気を出してできる。だがどんな悪事を働いたというんだ。おれの魂にどんな罪があるというんだ。どうしてあの夕べ、海から涼やかに上がってきたコクアに出会わねばならなかった？　魂をとらえて放さぬコクア！　おれの命の光、コクア！　妻には決してできない。もう見ることさえできない。いとしく思うこの手で、もう触れることもできない。おれが声を尽くして嘆くのはそのためだ。ああコクア、君のためなのだ！」"
    "translation_status": "reviewed"
  - "id": "bottle-109"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now you are to observe what sort of a man Keawe was, for he might have dwelt there in the Bright House for years, and no one been the wiser of his sickness; but he reckoned nothing of that, if he must lose Kokua. And again, he might have wed Kokua even as he was; and so many would have done, because they have the souls of pigs; but Keawe loved the maid manfully, and he would do her no hurt and bring her in no danger."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 586
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3358
        "line_end": 3363
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-109"
    "translation_ja": "ここでケアウェがどんな男であったか、よく見てほしい。何年だってあの「輝く家」にいて、病を誰にも気づかれずに暮らせたかもしれない。それでもコクアを失わねばならないなら、そんな暮らしには何の値打ちもなかった。また、そのまま黙ってコクアを妻にすることもできたろう。そうする人間も多いだろう、豚のような魂の持ち主なら。しかしケアウェは娘を男らしく愛した。傷を負わせまい、危い目にも遭わせまいと思った。"
    "translation_status": "reviewed"
  - "id": "bottle-110"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A little beyond the midst of the night, there came in his mind the recollection of that bottle. He went round to the back porch, and called to memory the day when the devil had looked forth; and at the thought ice ran in his veins."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 587
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3365
        "line_end": 3368
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-110"
    "translation_ja": "真夜中を少し過ぎたころ、あのびんが心に浮かんだ。彼は裏の縁に回り、悪魔がびんから顔を出した日のことを思い出した。思っただけで血管を氷が走った。"
    "translation_status": "reviewed"
  - "id": "bottle-111"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“A dreadful thing is the bottle,” thought Keawe, “and dreadful is the imp, and it is a dreadful thing to risk the flames of hell. But what other hope have I to cure my sickness or to wed Kokua? What!” he thought, “would I beard the devil once, only to get me a house, and not face him again to win Kokua?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 588
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3370
        "line_end": 3374
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-111"
    "translation_ja": "「あのびんは恐ろしい」とケアウェは思った。「小鬼も恐ろしい。地獄の火に焼かれるかもしれない賭けに出るのも恐ろしい。だが病を治し、コクアを妻にする望みが、ほかに何かあるだろうか。なんだ」と彼は思った。「前にはたかが家を一軒手に入れるために悪魔と渡り合っておきながら、コクアを得るためにはもう一度、やつと顔を合わせることもできないというのか」"
    "translation_status": "reviewed"
  - "id": "bottle-112"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Thereupon he called to mind it was the next day the Hall went by on her return to Honolulu. “There must I go first,” he thought, “and see Lopaka. For the best hope that I have now is to find that same bottle I was so pleased to be rid of.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 589
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3376
        "line_end": 3379
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-112"
    "translation_ja": "そこで翌日は、ホノルルへ帰る途中のホール号が通る日だと思い出した。「まずあそこへ行って、ロパカに会わねば。今のおれのいちばんの望みは、あれほど喜んで厄介払いした当のびんを見つけることなんだ」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 52
          "end": 56
          "exact": "Hall"
  - "id": "bottle-113"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Never a wink could he sleep; the food stuck in his throat; but he sent a letter to Kiano, and about the time when the steamer would be coming, rode down beside the cliff of the tombs. It rained; his horse went heavily; he looked up at the black mouths of the caves, and he envied the dead that slept there and were done with trouble; and called to mind how he had galloped by the day before, and was astonished. So he came down to Hookena, and there was all the country gathered for the steamer as usual. In the shed before the store they sat and jested and passed the news; but there was no matter of speech in Keawe’s bosom, and he sat in their midst and looked without on the rain falling on the houses, and the surf beating among the rocks, and the sighs arose in his throat."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 590
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3381
        "line_end": 3391
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-113"
    "translation_ja": "一睡もできず、食べ物は喉を通らなかった。それでもキアノに手紙を送り、汽船の来るころを見計らって、墓のある崖の脇を馬で下った。雨が降っていた。馬の足は重かった。見上げると洞穴の口は黒く、彼はそこに眠り、もう悩むこともない死者を羨んだ。前の日、自分がそこを馬で駆け抜けたことを思い出して、今さらのように驚いた。そうしてホオケナへ下りると、いつもどおりあたりの住民が汽船を迎えに集まっていた。店の前の小屋に座って、冗談を交わし、見聞きしたことを伝え合っていた。だがケアウェの胸には話の種などなかった。人々の真ん中に座り、外で家々に雨が降り、岩の間に波が打ちつけるのを眺めて、喉からこみあげるため息をついた。"
    "translation_status": "reviewed"
  - "id": "bottle-114"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Keawe of the Bright House is out of spirits,” said one to another. Indeed, and so he was, and little wonder."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 591
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3393
        "line_end": 3394
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-114"
    "translation_ja": "「輝く家のケアウェは元気がないな」と人々は言い合った。そのとおりだったし、無理もなかった。"
    "translation_status": "reviewed"
  - "id": "bottle-115"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Then the Hall came, and the whaleboat carried him on board. The after-part of the ship was full of Haoles {6} who had been to visit the volcano, as their custom is; and the midst was crowded with Kanakas, and the forepart with wild bulls from Hilo and horses from Kau; but Keawe sat apart from all in his sorrow, and watched for the house of Kiano. There it sat, low upon the shore in the black rocks, and shaded by the cocoa palms, and there by the door was a red holoku, no greater than a fly, and going to and fro with a fly’s busyness. “Ah, queen of my heart,” he cried, “I’ll venture my dear soul to win you!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 592
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3396
        "line_end": 3404
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-115"
    "translation_ja": "やがてホール号が来て、捕鯨ボートが彼を本船まで運んだ。船尾には例によって火山見物に出かけてきたハオレ〔原注6〕がいっぱいで、中央にはカナカの人々がひしめき、船首にはヒロからの野牛とカウからの馬が詰め込まれていた。ケアウェは悲しみに沈んで皆から離れて座り、キアノの家が見えぬかと目を凝らした。あった。岸辺の黒い岩の間に低くうずくまり、ココヤシの木陰になっていた。戸口には蠅ほどの大きさもない赤いホロクが見え、蠅のようにせわしなく行き来していた。「ああ、おれの心の女王」と彼は叫んだ。「君を得るためなら大事な魂だって賭ける！」"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 9
          "end": 13
          "exact": "Hall"
  - "id": "bottle-116"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Soon after, darkness fell, and the cabins were lit up, and the Haoles sat and played at the cards and drank whiskey as their custom is; but Keawe walked the deck all night; and all the next day, as they steamed under the lee of Maui or of Molokai, he was still pacing to and fro like a wild animal in a menagerie."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 593
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3406
        "line_end": 3410
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-116"
    "translation_ja": "程なく日が暮れ、船室には灯がともり、ハオレたちはいつものように腰を下ろしてトランプをしたりウイスキーを飲んだりした。だがケアウェは夜どおし甲板を歩いた。翌日も一日、船がマウイやモロカイの島陰を進むあいだ、彼は見世物小屋の獣のように行ったり来たり歩きつづけた。"
    "translation_status": "reviewed"
  - "id": "bottle-117"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Towards evening they passed Diamond Head, and came to the pier of Honolulu. Keawe stepped out among the crowd and began to ask for Lopaka. It seemed he had become the owner of a schooner—none better in the islands—and was gone upon an adventure as far as Pola-Pola or Kahiki; so there was no help to be looked for from Lopaka. Keawe called to mind a friend of his, a lawyer in the town (I must not tell his name), and inquired of him. They said he was grown suddenly rich, and had a fine new house upon Waikiki shore; and this put a thought in Keawe’s head, and he called a hack and drove to the lawyer’s house."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 594
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3412
        "line_end": 3420
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-117"
    "translation_ja": "夕方にはダイヤモンドヘッドを過ぎ、ホノルルの桟橋に着いた。ケアウェは人混みに下りてロパカの行方をたずね歩いた。彼は島々でも並ぶもののないスクーナーの船主になり、遠くポラポラかカヒキまで一仕事に出かけたという。ロパカからの助けは望めなかった。ケアウェはこの町に弁護士の友達がいたのを思い出し（その名は伏せねばならない）、その友達の消息をたずねた。にわかに金持ちになってワイキキの浜に立派な新居を構えたという。それで思うところがあり、彼は辻馬車を呼んで弁護士の家へ乗りつけた。"
    "translation_status": "reviewed"
  - "id": "bottle-118"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The house was all brand new, and the trees in the garden no greater than walking-sticks, and the lawyer, when he came, had the air of a man well pleased."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 595
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3422
        "line_end": 3424
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-118"
    "translation_ja": "家はぴかぴかの新築で、庭の木はまだ杖ほどの大きさで、出てきた弁護士はいかにも満ち足りた男の顔をしていた。"
    "translation_status": "reviewed"
  - "id": "bottle-119"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What can I do to serve you?” said the lawyer."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 596
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3426
        "line_end": 3426
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-119"
    "translation_ja": "「何かお役に立てることでも」と弁護士は言った。"
    "translation_status": "reviewed"
  - "id": "bottle-120"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You are a friend of Lopaka’s,” replied Keawe, “and Lopaka purchased from me a certain piece of goods that I thought you might enable me to trace.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 597
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3428
        "line_end": 3429
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-120"
    "translation_ja": "「あなたはロパカの友人ですね」とケアウェは答えた。「ロパカが私からある品物を買ったので、あなたならその行方を追う手助けをしてくださるかもしれない、と思いまして」"
    "translation_status": "reviewed"
  - "id": "bottle-121"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The lawyer’s face became very dark. “I do not profess to misunderstand you, Mr. Keawe,” said he, “though this is an ugly business to be stirring in. You may be sure I know nothing, but yet I have a guess, and if you would apply in a certain quarter I think you might have news.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 598
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3431
        "line_end": 3434
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-121"
    "translation_ja": "弁護士の顔がにわかに曇った。「何のお話かわからないふりはしませんよ、ケアウェさん」と彼は言った。「ほじくり返して気分のいい話ではありませんがね。私自身は何も知りません。それは確かです。ただ見当はつきます。ある筋にあたってごらんなさい。何かわかるかもしれません」"
    "translation_status": "reviewed"
  - "id": "bottle-122"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And he named the name of a man, which, again, I had better not repeat. So it was for days, and Keawe went from one to another, finding everywhere new clothes and carriages, and fine new houses and men everywhere in great contentment, although, to be sure, when he hinted at his business their faces would cloud over."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 599
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3436
        "line_end": 3440
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-122"
    "translation_ja": "そしてある男の名を告げた。その名もやはりここでは言わぬがよかろう。こうして幾日も、ケアウェは一人から次の一人へと訪ね歩いた。行く先々で新しい服と馬車に出会い、立派な新築の家に迎えられ、どの男も満ち足りていた。もっとも、用向きをほのめかすと、みな顔を曇らせたが。"
    "translation_status": "reviewed"
  - "id": "bottle-123"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“No doubt I am upon the track,” thought Keawe. “These new clothes and carriages are all the gifts of the little imp, and these glad faces are the faces of men who have taken their profit and got rid of the accursed thing in safety. When I see pale cheeks and hear sighing, I shall know that I am near the bottle.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 600
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3442
        "line_end": 3446
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-123"
    "translation_ja": "「間違いなく跡をたどっている」とケアウェは思った。「新しい服も馬車も、みんな小鬼からの贈り物だ。嬉しそうな顔は、それぞれ取り分を受け取って、あの忌まわしい物を無事に手放した人間の顔だ。青ざめた頬を見、ため息を聞いたら、その時こそびんが近いとわかる」"
    "translation_status": "reviewed"
  - "id": "bottle-124"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So it befell at last that he was recommended to a Haole in Beritania Street. When he came to the door, about the hour of the evening meal, there were the usual marks of the new house, and the young garden, and the electric light shining in the windows; but when the owner came, a shock of hope and fear ran through Keawe; for here was a young man, white as a corpse, and black about the eyes, the hair shedding from his head, and such a look in his countenance as a man may have when he is waiting for the gallows."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 601
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3448
        "line_end": 3455
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-124"
    "translation_ja": "しまいに、ベリタニア通りのハオレを訪ねるように言われた。夕食どきに戸口に立ってみると、いつもと同じ徴があった。新築の家、若い木ばかりの庭、窓には電灯が輝いている。だが持ち主が出てくると、希望と恐れとが稲妻のようにケアウェを貫いた。そこにいるのは若い男なのに、死骸のように青白く、目のまわりは黒ずみ、髪は抜け落ちて、顔つきはまさに絞首台を待つ男のそれだった。"
    "translation_status": "reviewed"
  - "id": "bottle-125"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Here it is, to be sure,” thought Keawe, and so with this man he noways veiled his errand. “I am come to buy the bottle,” said he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 602
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3457
        "line_end": 3458
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-125"
    "translation_ja": "「きっとここだ」とケアウェは思った。この男には用件を隠しもしなかった。「びんを買いに来ました」と彼は言った。"
    "translation_status": "reviewed"
  - "id": "bottle-126"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At the word, the young Haole of Beritania Street reeled against the wall."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 603
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3460
        "line_end": 3460
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-126"
    "translation_ja": "その言葉に、ベリタニア通りの若いハオレはよろけて壁にもたれた。"
    "translation_status": "reviewed"
  - "id": "bottle-127"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“The bottle!” he gasped. “To buy the bottle!” Then he seemed to choke, and seizing Keawe by the arm carried him into a room and poured out wine in two glasses."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 604
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3462
        "line_end": 3464
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-127"
    "translation_ja": "「びんを！」と彼はあえいだ。「びんを買いに！」　それから喉が詰まったようになり、ケアウェの腕をつかんで一室へ引きずっていって、グラス二つにぶどう酒を注いだ。"
    "translation_status": "reviewed"
  - "id": "bottle-128"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Here is my respects,” said Keawe, who had been much about with Haoles in his time. “Yes,” he added, “I am come to buy the bottle. What is the price by now?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 605
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3466
        "line_end": 3468
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-128"
    "translation_ja": "「では、ご健康を」とケアウェは言った。ハオレとの付き合いには慣れていた。「ええ」と言葉をついだ。「びんを買いに来ました。今はいくらになっています？」"
    "translation_status": "reviewed"
  - "id": "bottle-129"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At that word the young man let his glass slip through his fingers, and looked upon Keawe like a ghost."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 606
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3470
        "line_end": 3471
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-129"
    "translation_ja": "その言葉に若者の指からグラスが滑り落ちた。彼は幽霊のような顔でケアウェを見た。"
    "translation_status": "reviewed"
  - "id": "bottle-130"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“The price,” says he; “the price! You do not know the price?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 607
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3473
        "line_end": 3473
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-130"
    "translation_ja": "「値段」と彼は言った。「値段だって！　値段を知らずに来たんですか？」"
    "translation_status": "reviewed"
  - "id": "bottle-131"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It is for that I am asking you,” returned Keawe. “But why are you so much concerned? Is there anything wrong about the price?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 608
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3475
        "line_end": 3476
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-131"
    "translation_ja": "「だからあなたにお尋ねしてるんです」とケアウェは答えた。「でもなぜそんなに気になさる？　値段が何かおかしいんですか」"
    "translation_status": "reviewed"
  - "id": "bottle-132"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It has dropped a great deal in value since your time, Mr. Keawe,” said the young man stammering."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 609
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3478
        "line_end": 3479
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-132"
    "translation_ja": "「あなたが持っていたころに比べると、ずいぶん値が下がりましたよ、ケアウェさん」と若者は言葉を詰まらせながら言った。"
    "translation_status": "reviewed"
  - "id": "bottle-133"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Well, well, I shall have the less to pay for it,” says Keawe. “How much did it cost you?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 610
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3481
        "line_end": 3482
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-133"
    "translation_ja": "「それなら、おれにはその分安く買えるわけだ」とケアウェは言った。「あなたはおいくらで？」"
    "translation_status": "reviewed"
  - "id": "bottle-134"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The young man was as white as a sheet. “Two cents,” said he."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 611
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3484
        "line_end": 3484
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-134"
    "translation_ja": "若者は敷布のように真っ白だった。「二セントです」"
    "translation_status": "reviewed"
  - "id": "bottle-135"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“What?” cried Keawe, “two cents? Why, then, you can only sell it for one. And he who buys it—” The words died upon Keawe’s tongue; he who bought it could never sell it again, the bottle and the bottle imp must abide with him until he died, and when he died must carry him to the red end of hell."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 612
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3486
        "line_end": 3490
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-135"
    "translation_ja": "「なんですって」とケアウェは叫んだ。「二セント？　なら一セントでしか売れないじゃないか。そいつを買った者は……」。ケアウェの言葉はそこで途切れた。買った者にはもう売ることは決してできない。びんとびんの小鬼はその者に死ぬまで付きまとい、死ねば地獄の燃えさかるどん底まで彼を運ばずにはおかない。"
    "translation_status": "reviewed"
  - "id": "bottle-136"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The young man of Beritania Street fell upon his knees. “For God’s sake buy it!” he cried. “You can have all my fortune in the bargain. I was mad when I bought it at that price. I had embezzled money at my store; I was lost else; I must have gone to jail.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 613
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3492
        "line_end": 3495
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-136"
    "translation_ja": "ベリタニア通りの若者は膝をついた。「後生ですから買ってください！」と叫んだ。「私の財産もそっくりおつけします。あんな値で買ったとき、私はどうかしていたんです。店の金を使い込んでしまっていたんです。そうしなければもうおしまいで、牢屋に入るほかなかったんです」"
    "translation_status": "reviewed"
  - "id": "bottle-137"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Poor creature,” said Keawe, “you would risk your soul upon so desperate an adventure, and to avoid the proper punishment of your own disgrace; and you think I could hesitate with love in front of me. Give me the bottle, and the change which I make sure you have all ready. Here is a five-cent piece.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 614
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3497
        "line_end": 3501
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-137"
    "translation_ja": "「かわいそうな人だ」とケアウェは言った。「自分のしでかした恥ずべきことの当然の罰を逃れるために、そんな望みのない賭けに魂をかけた。それなのに、愛する人のために買うおれが、ためらうと思うのか。びんをください。釣り銭もきっと用意してあるでしょう。ここに五セント玉がある」"
    "translation_status": "reviewed"
  - "id": "bottle-138"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was as Keawe supposed; the young man had the change ready in a drawer; the bottle changed hands, and Keawe’s fingers were no sooner clasped upon the stalk than he had breathed his wish to be a clean man. And, sure enough, when he got home to his room, and stripped himself before a glass, his flesh was whole like an infant’s. And here was the strange thing: he had no sooner seen this miracle, than his mind was changed within him, and he cared naught for the Chinese Evil, and little enough for Kokua; and had but the one thought, that here he was bound to the bottle imp for time and for eternity, and had no better hope but to be a cinder for ever in the flames of hell. Away ahead of him he saw them blaze with his mind’s eye, and his soul shrank, and darkness fell upon the light."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 615
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3503
        "line_end": 3514
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-138"
    "translation_ja": "ケアウェが思ったとおり、若者は引き出しに釣り銭を用意していた。びんの持ち主は変わった。ケアウェはその首をつかむなり、病の穢れのない体に戻してくれ、とひそやかに願った。なるほど、自分の部屋に帰って鏡の前で服を脱ぐと、肌は赤ん坊のように健やかだった。ところがここに不思議なことがある。奇跡を見た瞬間、彼の心は変わったのだ。あの病などどうでもよくなり、コクアさえ大して気にかからなくなって、ただ一つのことしか思えなかった。今や自分はこの世でも来世でもびんの小鬼に縛られ、地獄の炎の中で永遠に燃えさしになるほか望みはないのだと。はるか行く手で炎が燃え立つのが心の目に見えた。魂は縮みあがり、目の前の光が闇に覆われた。"
    "translation_status": "reviewed"
  - "id": "bottle-139"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When Keawe came to himself a little, he was aware it was the night when the band played at the hotel. Thither he went, because he feared to be alone; and there, among happy faces, walked to and fro, and heard the tunes go up and down, and saw Berger beat the measure, and all the while he heard the flames crackle, and saw the red fire burning in the bottomless pit. Of a sudden the band played Hiki-ao-ao; that was a song that he had sung with Kokua, and at the strain courage returned to him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 616
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3516
        "line_end": 3523
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-139"
    "translation_ja": "いくぶん我に返ると、その晩はホテルで楽隊が演奏する晩だと気づいた。一人でいるのが怖く、そこへ行った。人々の楽しそうな顔の間を行き来し、音楽の高まり低まるのを聞き、ベルガーが拍子を取るのを見ていたが、そのあいだも絶えず炎のはぜる音が聞こえ、底なしの穴に赤い火の燃えるのが見えた。ふいに楽隊が「ヒキ・アオ・アオ」を弾き出した。コクアと一緒に歌ったことのある歌だった。その節を聞くと勇気が戻ってきた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 395
          "end": 405
          "exact": "Hiki-ao-ao"
  - "id": "bottle-140"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“It is done now,” he thought, “and once more let me take the good along with the evil.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 617
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3525
        "line_end": 3526
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-140"
    "translation_ja": "「もう済んだことだ」と思った。「もう一度、悪いことと一緒にいいことも受け取ろう」"
    "translation_status": "reviewed"
  - "id": "bottle-141"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "So it befell that he returned to Hawaii by the first steamer, and as soon as it could be managed he was wedded to Kokua, and carried her up the mountain side to the Bright House."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 618
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3528
        "line_end": 3530
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-141"
    "translation_ja": "そんなわけで彼は次の汽船でハワイ島へ帰り、支度ができるやいなやコクアと結婚して、山の上の「輝く家」に連れ帰った。"
    "translation_status": "reviewed"
  - "id": "bottle-142"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now it was so with these two, that when they were together, Keawe’s heart was stilled; but so soon as he was alone he fell into a brooding horror, and heard the flames crackle, and saw the red fire burn in the bottomless pit. The girl, indeed, had come to him wholly; her heart leapt in her side at sight of him, her hand clung to his; and she was so fashioned from the hair upon her head to the nails upon her toes that none could see her without joy. She was pleasant in her nature. She had the good word always. Full of song she was, and went to and fro in the Bright House, the brightest thing in its three storeys, carolling like the birds. And Keawe beheld and heard her with delight, and then must shrink upon one side, and weep and groan to think upon the price that he had paid for her; and then he must dry his eyes, and wash his face, and go and sit with her on the broad balconies, joining in her songs, and, with a sick spirit, answering her smiles."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 619
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3532
        "line_end": 3545
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-142"
    "translation_ja": "二人でいるうちはケアウェの心も安らいだ。しかし一人になるとたちまち陰鬱な恐怖にとりつかれ、炎のはぜるのが聞こえ、底なしの穴に赤い火の燃えるのが見えた。娘の方はまことに身も心も彼のもとへ来ていた。彼を見れば胸がはずみ、その手は彼の手から離れなかった。頭のてっぺんから足の爪先まで、見て喜ばぬ者はないようにできていた。気立ては明るく、いつだって人にかける優しい言葉を持っていた。歌が中からあふれ出るような人で、鳥のように歌いながら「輝く家」を行き来し、三つの階のどこを探しても彼女ほど輝くものはなかった。ケアウェは喜んでその姿を見、その声を聞いたが、次にはものかげへ身を縮め、彼女を得るために払った代価を思って、泣いてうめかずにいられなかった。それから涙をぬぐい、顔を洗い、広いベランダに出て彼女と腰を下ろし、その歌に声を合わせ、病んだ心を抱えて微笑みに微笑みで答えねばならなかった。"
    "translation_status": "reviewed"
  - "id": "bottle-143"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There came a day when her feet began to be heavy and her songs more rare; and now it was not Keawe only that would weep apart, but each would sunder from the other and sit in opposite balconies with the whole width of the Bright House betwixt. Keawe was so sunk in his despair, he scarce observed the change, and was only glad he had more hours to sit alone and brood upon his destiny, and was not so frequently condemned to pull a smiling face on a sick heart. But one day, coming softly through the house, he heard the sound of a child sobbing, and there was Kokua rolling her face upon the balcony floor, and weeping like the lost."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 620
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3547
        "line_end": 3555
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-143"
    "translation_ja": "やがて彼女の足取りが重くなり、歌もまばらになった。今では人目を忍んで泣くのはケアウェだけではなく、二人はお互いを離れ、「輝く家」の幅いっぱいを二人の間に挟んで、反対側のベランダに座るようになった。ケアウェはあまりに深く絶望に沈んでいて、その変化にほとんど気づかなかった。一人座って運命を思いつめる時間が増え、痛む心に笑顔を貼りつける憂き目にあう回数が減ったのを喜んだだけだった。だがある日、そっと家の中を通り抜けようとしたとき、子供がしゃくりあげるような声が聞こえた。見るとコクアがベランダの床に顔を伏せ、身悶えして、絶望しきった人のように泣いていた。"
    "translation_status": "reviewed"
  - "id": "bottle-144"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You do well to weep in this house, Kokua,” he said. “And yet I would give the head off my body that you (at least) might have been happy.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 621
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3557
        "line_end": 3558
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-144"
    "translation_ja": "「この家でなら泣いてももっともだよ、コクア」と彼は言った。「それでも、せめて君だけでも幸せにできたなら、おれは首だって差し出したのに」"
    "translation_status": "reviewed"
  - "id": "bottle-145"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Happy!” she cried. “Keawe, when you lived alone in your Bright House, you were the word of the island for a happy man; laughter and song were in your mouth, and your face was as bright as the sunrise. Then you wedded poor Kokua; and the good God knows what is amiss in her—but from that day you have not smiled. Oh!” she cried, “what ails me? I thought I was pretty, and I knew I loved him. What ails me that I throw this cloud upon my husband?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 622
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3560
        "line_end": 3566
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-145"
    "translation_ja": "「幸せですって！」と彼女は叫んだ。「ケアウェ、あなたが一人で『輝く家』に住んでいたころは、幸せな人といえばあなたのことだと島じゅうが噂したわ。あなたの口には笑いと歌があり、顔は日の出のように輝いていた。それが、この哀れなコクアと結婚して、何がいけないか神様しかご存じないけれど、あの日から一度だって笑わない。ああ！」と彼女は叫んだ。「私のどこが悪いの？　自分ではきれいなつもりでいたし、この人を愛しているのだってわかっていた。夫をこんなに曇らせるなんて、私のどこが悪いの？」"
    "translation_status": "reviewed"
  - "id": "bottle-146"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Poor Kokua,” said Keawe. He sat down by her side, and sought to take her hand; but that she plucked away. “Poor Kokua,” he said, again. “My poor child—my pretty. And I had thought all this while to spare you! Well, you shall know all. Then, at least, you will pity poor Keawe; then you will understand how much he loved you in the past—that he dared hell for your possession—and how much he loves you still (the poor condemned one), that he can yet call up a smile when he beholds you.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 623
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3568
        "line_end": 3574
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-146"
    "translation_ja": "「かわいそうなコクア」とケアウェは言った。隣に腰を下ろして手を取ろうとしたが、彼女は引っ込めた。「かわいそうなコクア」ともう一度言った。「おれのかわいそうな子、きれいな子。今までずっと、君にはつらい思いをさせまいとしていたのに。いいよ、すべてを話そう。そうしたらせめて、哀れなケアウェを気の毒には思ってくれるだろう。昔どれほど君を愛して、君を得るために地獄をも恐れなかったか。今なおどれほど愛して、地獄行きの哀れな身でありながら、君を見ればまだ笑顔を浮かべられるか、わかってくれるだろう」"
    "translation_status": "reviewed"
  - "id": "bottle-147"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "With that, he told her all, even from the beginning."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 624
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3576
        "line_end": 3576
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-147"
    "translation_ja": "そうして彼は初めの初めから、何もかも彼女に話した。"
    "translation_status": "reviewed"
  - "id": "bottle-148"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You have done this for me?” she cried “Ah, well, then what do I care!”—and she clasped and wept upon him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 625
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3578
        "line_end": 3579
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-148"
    "translation_ja": "「私のためにそんなことをしてくれたの？」と彼女は叫んだ。「ああ、それなら、もう何だって構わないわ！」　彼にしがみつき、その胸で泣いた。"
    "translation_status": "reviewed"
  - "id": "bottle-149"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ah, child!” said Keawe, “and yet, when I consider of the fire of hell, I care a good deal!”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 626
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3581
        "line_end": 3582
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-149"
    "translation_ja": "「ああ、おまえ」とケアウェは言った。「だが、おれは地獄の火のことを思うと、構わないどころじゃないよ！」"
    "translation_status": "reviewed"
  - "id": "bottle-150"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Never tell me,” said she; “no man can be lost because he loved Kokua, and no other fault. I tell you, Keawe, I shall save you with these hands, or perish in your company. What! you loved me, and gave your soul, and you think I will not die to save you in return?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 627
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3584
        "line_end": 3587
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-150"
    "translation_ja": "「そんなこと言わないで」と彼女は言った。「ただコクアを愛したほかに罪のない人が、地獄に落ちるなんてことはないわ。いい、ケアウェ、私はこの両手であなたを救ってみせる。さもなければ一緒に滅びるわ。まあ、あなたは私を愛して魂を差し出したのに、私はお返しにあなたを救うために死ぬこともできないと思っているの？」"
    "translation_status": "reviewed"
  - "id": "bottle-151"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Ah, my dear! you might die a hundred times, and what difference would that make?” he cried, “except to leave me lonely till the time comes of my damnation?”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 628
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3589
        "line_end": 3591
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-151"
    "translation_ja": "「ああ、愛しい人！　君が百回死んだって何が変わる？」と彼は叫んだ。「おれが地獄へ落ちるときまで、たった一人で取り残されるだけじゃないか」"
    "translation_status": "reviewed"
  - "id": "bottle-152"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“You know nothing,” said she. “I was educated in a school in Honolulu; I am no common girl. And I tell you, I shall save my lover. What is this you say about a cent? But all the world is not American. In England they have a piece they call a farthing, which is about half a cent. Ah! sorrow!” she cried, “that makes it scarcely better, for the buyer must be lost, and we shall find none so brave as my Keawe! But, then, there is France; they have a small coin there which they call a centime, and these go five to the cent or there-about. We could not do better. Come, Keawe, let us go to the French islands; let us go to Tahiti, as fast as ships can bear us. There we have four centimes, three centimes, two centimes, one centime; four possible sales to come and go on; and two of us to push the bargain. Come, my Keawe! kiss me, and banish care. Kokua will defend you.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 629
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3593
        "line_end": 3605
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-152"
    "translation_ja": "「あなたは何もご存じないわ」と彼女は言った。「私はホノルルの学校で教育を受けたの。ただの娘じゃないわ。必ず愛する人を救ってみせます。さっきから一セントとおっしゃるけど、世界じゅうがアメリカじゃないのよ。イギリスにはファージングという硬貨があって、だいたい半セントなの。ああ、だめだわ！」と彼女は叫んだ。「それでは大してよくならない。買い手が地獄に落ちるし、うちのケアウェほど勇気のある人なんか見つからないもの。でも、そうだ、フランスがあるわ。あそこにはサンチームという小さな硬貨があるの。五枚ほどで一セントよ。それこそ申し分ないじゃないの。ねえ、ケアウェ、フランス領の島に行きましょう。船で行けるかぎり急いで、タヒチに行きましょう。そこなら四サンチーム、三サンチーム、二サンチーム、一サンチームとまだ四回は売買ができるし、売り込む私たちは二人いる。さあ、私のケアウェ、口づけして心配は追い払って。コクアがあなたを守るわ」"
    "translation_status": "reviewed"
  - "id": "bottle-153"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "“Gift of God!” he cried. “I cannot think that God will punish me for desiring aught so good! Be it as you will, then; take me where you please: I put my life and my salvation in your hands.”"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 630
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3607
        "line_end": 3609
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-153"
    "translation_ja": "「神様の贈り物だ！」と彼は叫んだ。「こんなによい人を望んだからといって、神様がおれを罰するとは思えないよ！　じゃあ君の思うようにしてくれ。どこへなりと連れていってくれ。おれの命と魂の救いは君の手に預ける」"
    "translation_status": "reviewed"
  - "id": "bottle-154"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Early the next day Kokua was about her preparations. She took Keawe’s chest that he went with sailoring; and first she put the bottle in a corner; and then packed it with the richest of their clothes and the bravest of the knick-knacks in the house. “For,” said she, “we must seem to be rich folks, or who will believe in the bottle?” All the time of her preparation she was as gay as a bird; only when she looked upon Keawe, the tears would spring in her eye, and she must run and kiss him. As for Keawe, a weight was off his soul; now that he had his secret shared, and some hope in front of him, he seemed like a new man, his feet went lightly on the earth, and his breath was good to him again. Yet was terror still at his elbow; and ever and again, as the wind blows out a taper, hope died in him, and he saw the flames toss and the red fire burn in hell."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 631
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3611
        "line_end": 3623
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-154"
    "translation_ja": "翌日早くからコクアは支度にかかった。ケアウェが航海に使っていた船箪笥を出し、まず隅にびんを入れ、それから二人のいちばん上等な服と、家の中のいちばん華やかな飾り物を詰めた。「だって私たちが金持ちに見えなくては、誰がびんを信じてくれるの？」と彼女は言った。支度のあいだじゅう彼女は鳥のように陽気で、ただケアウェを見ると涙が目にわき、走り寄って接吻せずにいられなかった。ケアウェは、心の重荷が一つ下りた気がした。秘密はもう分かち合ったし、目の前には望みもいくらかある。生まれ変わったように大地を軽く踏み、息をすることがまた気持ちよくなった。とはいえ恐怖はまだすぐ脇にいた。ときには風にろうそくが消えるように、胸のうちで希望が絶え、地獄で炎がのたうち赤く燃えるのが見えた。"
    "translation_status": "reviewed"
  - "id": "bottle-155"
    "section_id": "bottle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was given out in the country they were gone pleasuring to the States, which was thought a strange thing, and yet not so strange as the truth, if any could have guessed it. So they went to Honolulu in the Hall, and thence in the Umatilla to San Francisco with a crowd of Haoles, and at San Francisco took their passage by the mail brigantine, the Tropic Bird, for Papeete, the chief place of the French in the south islands. Thither they came, after a pleasant voyage, on a fair day of the Trade Wind, and saw the reef with the surf breaking, and Motuiti with its palms, and the schooner riding within-side, and the white houses of the town low down along the shore among green trees, and overhead the mountains and the clouds of Tahiti, the wise island."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-329"
        "precision": "line"
        "source_sequence": 632
        "url": "https://github.com/GITenberg/Island-Nights-Entertainments_329/blob/d3542fe92184abb4f7aa80f3bed4c6093ac71fe9/329-0.txt"
        "line_start": 3625
        "line_end": 3635
    "source_alignment":
      - "source_id": "gutenberg-329"
        "original_unit_id": "bottle-155"
    "translation_ja": "アメリカへ遊びに行くのだと近在には知らせてあった。それも人々には奇妙に思われたが、本当のわけを誰かが見抜いていたら、もっと奇妙に思ったろう。二人はホール号でホノルルへ行き、そこから大勢のハオレに交じってユマティラ号でサンフランシスコへ渡り、そこで郵便を運ぶブリガンティン帆船トロピック・バード号の船客となって、南の島々におけるフランス人の中心地パペーテへ向かった。楽しい航海ののち、貿易風の吹く晴れた日に二人はそこに着いた。波の砕ける珊瑚礁、ヤシの茂るモトゥイティ、礁の内側に停泊するスクーナーが目に映った。岸辺の緑の木々の間には町の白い家々が低く並び、その上には賢き島タヒチの山々と雲がそびえていた。"
    "translation_status": "reviewed"

    "translation_ja": "そこで勢いよく体を起こし、また靴と脚絆をつけ、残りのパンを割ってモデスティーヌに与え、世界のどこで目を覚ましたのかと、ぶらぶら歩き回った。イタケーに残され、女神のためにまごついたオデュッセウスでさえ、これ以上に愉快に道に迷ったことはあるまい。昔の英雄的な航海者が出会ったような、混じりけも私情もない冒険を、私は一生追い求めてきた。そして今朝、目が覚めると見知らぬジェヴォーダンの森の外れにいた。北も南も分からず、この世で最初の人間のように、周囲には何の馴染みもない。私は陸にいながら漂着者となった。白昼夢が一かけら実現したわけである。いたところは白樺の小さな林の縁で、何本かブナが混じっていた。背後では別のモミ林に接し、前ではまばらになり、木々が間隔を置いて、草地の多い浅い谷へ下っていた。四方に裸の丘の頂があり、眺めが開けたり閉じたりするにつれ近くにも遠くにも見えたが、際立って高いものはなかった。風が木立を寄せ集める。白樺の葉の黄金が、小さな秋のしるしとなって震えた。頭上には水蒸気の筋や切れ端がいっぱいで、風に空じゅう追い立てられ、飛び、消え、また現れ、軽業師のように軸を中心に回転した。荒れた天気で、ひもじくなるような寒さであった。指が冷たさで動かなくならぬうち、チョコレートを食べ、ブランデーを一口のみ、煙草を一本吸った。みなすませて荷をまとめ、荷鞍に縛りつけるころ、朝は東の敷居につま先をかけていた。小道を何歩も行かぬうちに、私からはまだ見えない太陽が、東の空に並ぶ雲の山々に、金色の光を注いだ。"
    "translation_status": "reviewed"

    "translation_ja": "「それで」と男はつけ加えた。「いったい何をして、いままでこんなところにいたんです？」"
    "translation_status": "reviewed"
  - "id": "td-105"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "What the devil, indeed! But there I was."

    "translation_status": "reviewed"
  - "id": "td-323"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "That was not the opinion of the priest and soldier at Our Lady of the Snows. But this is a different race; and perhaps the same great-heartedness that upheld them to resist, now enables them to differ in a kind spirit. For courage respects courage; but where a faith has been trodden out, we may look for a mean and narrow population. The true work of Bruce and Wallace was the union of the nations; not that they should stand apart a while longer, skirmishing upon their borders; but that, when the time came, they might unite with self-respect."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[290]"
        "line_start": 2832
        "line_end": 2839
        "source_sequence": 2832
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2948
        "line_end": 2955
        "source_sequence": 2948
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[290]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2948-2955"
    "translation_ja": "雪の聖母の司祭と軍人はそう考えなかった。だがここは人が違う。彼らの抵抗を支えたあの度量の大きさゆえに、今では意見が違っても親しく付き合えるのかもしれない。勇気は勇気に敬意を払うが、信仰が踏みにじられて根絶された土地では、卑小で度量の狭い人々を予想してよい。ブルースとウォレスの本当の功績は、国々の統合にあった。そのまましばらくは別々にいて、国境で小競り合いをするためでなく、機が熟したときに、自尊心を保って一つになれるためだった。"
    "translation_status": "reviewed"
  - "id": "td-324"

  - "id": "td-341"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "We struck at last into a wide white high-road carpeted with noiseless dust. The night had come; the moon had been shining for a long while upon the opposite mountain; when on turning a corner my donkey and I issued ourselves into her light. I had emptied out my brandy at Florac, for I could bear the stuff no longer, and replaced it with some generous and scented Volnay; and now I drank to the moon’s sacred majesty upon the road. It was but a couple of mouthfuls; yet I became thenceforth unconscious of my limbs, and my blood flowed with luxury. Even Modestine was inspired by this purified nocturnal sunshine, and bestirred her little hoofs as to a livelier measure. The road wound and descended swiftly among masses of chestnuts. Hot dust rose from our feet and flowed away. Our two shadows—mine deformed with the knapsack, hers comically bestridden by the pack—now lay before us clearly outlined on the road, and now, as we turned a corner, went off into the ghostly distance, and sailed along the mountain like clouds. From time to time a warm wind rustled down the valley, and set all the chestnuts dangling their bunches of foliage and fruit; the ear was filled with whispering music, and the shadows danced in tune. And next moment the breeze had gone by, and in all the valley nothing moved except our travelling feet. On the opposite slope, the monstrous ribs and gullies of the mountain were faintly designed in the moonshine; and high overhead, in some lone house, there burned one lighted window, one square spark of red in the huge field of sad nocturnal colouring."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[308]"
        "line_start": 2936
        "line_end": 2959
        "source_sequence": 2936
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3064
        "line_end": 3086
        "source_sequence": 3064
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[308]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3064-3086"
    "translation_ja": "ついに音のしない埃を敷きつめた、広い白い街道に出た。夜はもう来ていた。ずっと前から向こうの山を照らしていた月の光へ、角を曲がると、ロバと私も出た。フロラックでブランデーを捨てた。もうこれ以上飲めず、芳香のあるふくよかなヴォルネーに替えたのである。私はいま街道で、月の神聖なる威厳に杯を上げた。二口だけだったが、それから先は手足のことも忘れ、血の巡りにこのうえない心地よさを覚えた。モデスティーヌまでこの浄められた夜の日射しに気をよくし、前より弾む拍子で小さな蹄を動かした。道は栗の木々の間を曲がって急に下り、熱い埃が足もとから立って流れ去った。私たちの影は、私のは背嚢でいびつに、彼女のは荷が馬乗りになって滑稽に見えた。二つの影は、あるときは前方の道にくっきり横たわった。またあるときは角を曲がると、幽霊めいた遠みに離れて、雲のように山肌を流れた。ときおり暖かい風が谷を音を立てて吹き下ろし、栗の木々がみな、葉と実の房を揺らした。囁きの音楽が耳にあふれ、影はそれに合わせて踊った。次の瞬間、風は過ぎ、谷じゅうに動くものは、歩きつづける私たちの足だけだった。向こうの斜面には、山の途方もない肋骨や谷筋が、月の光に薄く描かれた。そしてずっと高いところに、ぽつんと立つどこぞの家に、明かりのともった窓が一つ、夜の沈んだ色の巨大な原の中で、四角い赤の火花を燃やしていた。"
    "translation_status": "reviewed"
  - "id": "td-342"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At a certain point, as I went downward, turning many acute angles, the moon disappeared behind the hill; and I pursued my way in great darkness, until another turning shot me without preparation into St. Germain de Calberte. The place was asleep and silent, and buried in opaque night. Only from a single open door, some lamplight escaped upon the road to show me that I was come among men’s habitations. The two last gossips of the evening, still talking by a garden wall, directed me to the inn. The landlady was getting her chicks to bed; the fire was already out, and had, not without grumbling, to be rekindled; half an hour later, and I must have gone supperless to roost."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"

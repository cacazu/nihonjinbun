        "original_unit_id": "/html/body/p[327]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3283-3290"
    "translation_ja": "サン・ジャン・デュ・ガールは大きなところで、大方がプロテスタントだ。プロテスタントの町長が、ちょっとしたことに手を貸してほしいと言ってきた。そのこと自体、この地方の特色をよく示している。セヴェンヌの若い女性は、同じ宗教で言葉が違うことを生かし、大勢イングランドに家庭教師に行く。ここにはミアレ生まれの一人がいて、ロンドンの二つの斡旋所から来た英語の回状と格闘していた。できるだけ力を貸し、自分にはじつにいいと思える助言も、自分から申し出た。"
    "translation_status": "reviewed"

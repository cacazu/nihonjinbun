        "source_sequence": 727
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[70]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-727-734"
    "translation_ja": "翌日、九月二十四日の火曜は、日記を書きあげ、背嚢を繕い終わるまでに午後二時になっていた。今後は背嚢を背負い、籠とはもう関わるまいと決めたからだ。その半時間後、メルコワールの森の縁にあるル・シェラール・レヴェックへ向かった。徒歩なら一時間半と聞いた。ロバというお荷物を抱えた人間が同じ距離を四時間で行けると考えても、高望みには当たるまいと思った。"
    "translation_status": "reviewed"
  - "id": "td-082"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All the way up the long hill from Langogne it rained and hailed alternately; the wind kept freshening steadily, although slowly; plentiful hurrying clouds—some dragging veils of straight rain-shower, others massed and luminous as though promising snow—careered out of the north and followed me along my way. I was soon out of the cultivated basin of the Allier, and away from the ploughing oxen, and such-like sights of the country. Moor, heathery marsh, tracts of rock and pines, woods of birch all jewelled with the autumn yellow, here and there a few naked cottages and bleak fields,—these were the characters of the country. Hill and valley followed valley and hill; the little green and stony cattle-tracks wandered in and out of one another, split into three or four, died away in marshy hollows, and began again sporadically on hillsides or at the borders of a wood."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[71]"
        "line_start": 800
        "line_end": 812
        "source_sequence": 800
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 736
        "line_end": 748
        "source_sequence": 736
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[71]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-736-748"
    "translation_ja": "ランゴーニュから長い坂を上るあいだじゅう、雨と雹がかわるがわる降った。風は徐々にだが着実に強まった。せわしく流れる雲が幾重にも、まっすぐ降る雨の幕を引くものもあれば、雪の前触れのように厚くかたまって光るものもあって、北から疾走し、私の行く道を追ってきた。ほどなくアリエ川流域の耕作地を抜け、犂を引く牛や、そうした田園の景色をあとにした。荒れ野、ヒースの茂る湿地、岩と松の広がり、秋の黄色を宝石のように散らした白樺林、ところどころにむき出しの家が数軒と寒々しい畑。それがこの土地の顔だった。丘と谷の次に谷と丘がつづき、草が生え石がちな細い牛道が、くっついたり離れたりし、三つ四つに分かれ、湿地の窪みで消えたかと思えば、山腹や森の縁にぽつぽつ現れた。"
    "translation_status": "reviewed"
  - "id": "td-083"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was no direct road to Cheylard, and it was no easy affair to make a passage in this uneven country and through this intermittent labyrinth of tracks. It must have been about four when I struck Sagnerousse, and went on my way rejoicing in a sure point of departure. Two hours afterwards, the dusk rapidly falling, in a lull of the wind, I issued from a fir-wood where I had long been wandering, and found, not the looked-for village, but another marish bottom among rough-and-tumble hills. For some time past I had heard the ringing of cattle-bells ahead; and now, as I came out of the skirts of the wood, I saw near upon a dozen cows and perhaps as many more black figures, which I conjectured to be children, although the mist had almost unrecognisably exaggerated their forms. These were all silently following each other round and round in a circle, now taking hands, now breaking up with chains and reverences. A dance of children appeals to very innocent and lively thoughts; but, at nightfall on the marshes, the thing was eerie and fantastic to behold. Even I, who am well enough read in Herbert Spencer, felt a sort of silence fall for an instant on my mind. The next, I was pricking Modestine forward, and guiding her like an unruly ship through the open. In a path, she went doggedly ahead of her own accord, as before a fair wind; but once on the turf or among heather, and the brute became demented. The tendency of lost travellers to go round in a circle was developed in her to the degree of passion, and it took all the steering I had in me to keep even a decently straight course through a single field."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[72]"
        "line_start": 813
        "line_end": 836
        "source_sequence": 813
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 750
        "line_end": 772
        "source_sequence": 750
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[72]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-750-772"
    "translation_ja": "シェラールにまっすぐ通じる道はない。起伏の激しい土地で、とぎれとぎれの小道の迷路を抜けるのは楽ではなかった。サニュルースに出たのは四時ごろだったろう。確かな足がかりを得て喜々として先へ進んだ。それから二時間後、夕闇が急速に迫るころ、風のやみ間に長く迷っていたモミ林を抜けた。そこにあったのは目当ての村でなく、でこぼこした丘の間の、また別の湿った窪地だった。少し前から前方で牛の鈴が聞こえ、木立の縁を出ると、十二頭ほどの牛と、おそらく同じ数の黒い影が見えた。子どもではないかと思ったが、靄が姿をほとんど見分けもつかぬほど大げさにしていた。影はみな黙って輪になってぐるぐる回り、手をつないだかと思うと、列に分かれ、お辞儀をし合う。子どもが踊るのを見れば、無邪気で生き生きした思いが浮かぶものだが、日暮れの湿地に見るそれは、不気味でこの世のものとも思えなかった。ハーバート・スペンサーを人並み以上に読んでいる私でさえ、一瞬、頭の中がしんとした。次の瞬間には、私はモデスティーヌを突き、言うことをきかない船を操るように、開けた野へ進ませていた。小道なら追い風を受けた船よろしく、ひとりで黙々と前へ進むのに、ひとたび草地やヒースの間に出ると、畜生は正気をなくした。道に迷った旅人がぐるぐる回る癖を、彼女は熱中と言っていいほどこじらせており、一つの野をまあまっすぐ抜けるだけで、舵取りの腕を出し尽くさなければならなかった。"
    "translation_status": "reviewed"
  - "id": "td-084"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "While I was thus desperately tacking through the bog, children and cattle began to disperse, until only a pair of girls remained behind. From these I sought direction on my path. The peasantry in general were but little disposed to counsel a wayfarer. One old devil simply retired into his house, and barricaded the door on my approach; and I might beat and shout myself hoarse, he turned a deaf ear. Another, having given me a direction which, as I found afterwards, I had misunderstood, complacently watched me going wrong without adding a sign. He did not care a stalk of parsley if I wandered all night upon the hills! As for these two girls, they were a pair of impudent sly sluts, with not a thought but mischief. One put out her tongue at me, the other bade me follow the cows; and they both giggled and jogged each other’s elbows. The Beast of Gévaudan ate about a hundred children of this district; I began to think of him with sympathy."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[73]"
        "line_start": 837
        "line_end": 851
        "source_sequence": 837
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 774
        "line_end": 787
        "source_sequence": 774
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[73]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-774-787"
    "translation_ja": "こうして沼地で必死に舵を切るうちに、子どもと牛は散り散りになり、娘が二人だけ残った。二人に道を尋ねた。ここの百姓は概して旅人に道を教えたがらない。ある老いぼれの悪魔は、私が近づくと家へ引っこみ、戸を閉ざしたきりで、いくら叩いて声が枯れるほど叫んでも、聞く耳を持たなかった。別の男は道を教えたものの、あとで分かったことだが、私は言葉を取り違えた。私が違うほうへ行くのを、合図一つ添えず平然と見送ったのだ。私が一晩じゅう丘をさまようかどうか、パセリ一本ほどにも気にかけなかった。さてこの娘二人も、ずうずうしく小ずるく、いたずらしか頭にない。一人は舌を出し、もう一人は牛について行けと言い、二人でくすくす笑って肘でつつき合った。ジェヴォーダンの〈獣〉はこの地方で百人ばかり子どもを食べたが、私はやつに同情しはじめた。"
    "translation_status": "reviewed"
  - "id": "td-085"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Leaving the girls, I pushed on through the bog, and got into another wood and upon a well-marked road. It grew darker and darker. Modestine, suddenly beginning to smell mischief, bettered the pace of her own accord, and from that time forward gave me no trouble. It was the first sign of intelligence I had occasion to remark in her. At the same time, the wind freshened into half a gale, and another heavy discharge of rain came flying up out of the north. At the other side of the wood I sighted some red windows in the dusk. This was the hamlet of Fouzilhic; three houses on a hillside, near a wood of birches. Here I found a delightful old man, who came a little way with me in the rain to put me safely on the road for Cheylard. He would hear of no reward; but shook his hands above his head almost as if in menace, and refused volubly and shrilly, in unmitigated patois."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

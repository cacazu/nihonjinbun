        "line_end": 864
        "source_sequence": 852
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 789
        "line_end": 801
        "source_sequence": 789
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[74]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-789-801"
    "translation_ja": "娘たちをあとに、湿地を突っ切って次の林に入り、はっきりした道に出た。あたりは暗くなる一方だった。モデスティーヌは急に危うさを嗅ぎ取ったのか、みずから足を速め、それからは私を煩わせなかった。彼女が利口なところを見せたのは、気がついた限りこれが初めてだ。そのころには風が半ば暴風に変わり、また激しい雨がひとしきり北から飛んできた。木立の向こうの闇に、赤い窓がいくつか見えた。フジリックの集落で、白樺林のそばの山腹に家が三軒あった。ここで実に感じのよい老人に会い、雨の中を少し一緒に来て、私を間違いなくシェラールへの道に乗せてくれた。お礼はどうしても聞き入れない。まるで脅しでもするように手を頭の上で振り、混じりけなしの土地言葉で、早口に甲高く辞退した。"
    "translation_status": "reviewed"

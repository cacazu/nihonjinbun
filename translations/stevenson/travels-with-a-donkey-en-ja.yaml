      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2848-2872"
    "translation_ja": "恥じたりはしない。その言いようは自然に出た統計の一片である。少数派の者の言葉だからだ。バヴィルと竜騎兵のことを思い出し、百年無残に踏みつけても、その摩擦で宗教はかえって活気づくものかと微笑んだ。アイルランドは今もカトリック、セヴェンヌは今もプロテスタントである。おびただしい法律文書も、ひと連隊の騎兵の蹄や拳銃の台尻も、犂を引く百姓一人の考えをほんの少しも変えられない。戸外で暮らす田舎の者には考えの数は多くない。だが持っているものは丈夫な草木で、迫害の中で勢いよく育つ。長い間、日盛りに汗を流して働き、夜は星々の下で過ごし、丘や森をよく歩く、正直な年かさの田舎者は、ついには宇宙の力と通い合う感覚を持ち、自分の神と親しく交わる。あの山のプリマス・ブレザレンの友のように、主を知るのである。その宗教は、論理で選びとったものではない。自分の経験の詩であり、自分の人生の歴史の哲学である。大いなる力のように、大きな輝く太陽のように、神は長い年月の間にこの素朴な男の前に現れ、ほんの些細な思いの根本、本質にまでなった。権力で教義や教条を替え、あるいは喇叭を鳴らして新しい宗教を告げてもよい。だがここには自分の考えを持ち、よいときも悪いときも頑として手放さない人がいる。男は女でなく、女は男でないのと同じ、取り消せない意味において、彼はカトリック、プロテスタント、あるいはプリマス・ブレザレンの一人なのである。過去の記憶をすべて根こそぎにできなければ、つまり決まり文句の意味ではなく、文字どおり考える心そのものを変えられなければ、自分の信仰からそれることはできないからだ。"
    "translation_status": "reviewed"

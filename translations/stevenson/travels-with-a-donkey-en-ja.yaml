        "source_sequence": 2042
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[206]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2042-2050"
    "translation_ja": "歩き出したほとんど最初から、遠くの波が砕けるような、かすかだが大きな音が耳に満ちていた。近くに滝があってその音かと思ったり、山があまりに静かなので頭が勝手にこしらえた音かと思ったりした。だが進むにつれて大きくなり、途方もなく大きな湯沸かしのしゅうしゅういう音に似てきた。同時に、山頂のほうから涼しい空気がそよそよと届きはじめた。それでようやく分かった。ロゼールの向こうの斜面に、南から強い風が吹いており、一歩ごとにその風へ近づいていたのだ。"
    "translation_status": "reviewed"
  - "id": "td-235"
    "section_id": "across-the-lozere"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Although it had been long desired, it was quite unexpectedly at last that my eyes rose above the summit. A step that seemed no way more decisive than many other steps that had preceded it—and, ‘like stout Cortez when, with eagle eyes, he stared on the Pacific,’ I took possession, in my own name, of a new quarter of the world. For behold, instead of the gross turf rampart I had been mounting for so long, a view into the hazy air of heaven, and a land of intricate blue hills below my feet."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[207]"
        "line_start": 1999
        "line_end": 2006
        "source_sequence": 1999
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2052
        "line_end": 2058
        "source_sequence": 2052
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[207]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2052-2058"
    "translation_ja": "長らく待ちこがれたのに、頂の向こうが初めて目に入ったのは、いざとなってみればまったく予想もしないときだった。それまでの何歩とも大差ないような一歩を踏み出し、「勇猛なコルテスが鷲の目で太平洋を見つめたように」、私は世界の新しい一角を、自分の名において手に入れた。何しろ、長いこと上ってきた、分厚い芝の城壁に代わり、霞む天へ眺めが開け、入り組む青い丘の国が足もとにあったのだ。"
    "translation_status": "reviewed"
  - "id": "td-236"
    "section_id": "across-the-lozere"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The Lozère lies nearly east and west, cutting Gévaudan into two unequal parts; its highest point, this Pic de Finiels, on which I was then standing, rises upwards of five thousand six hundred feet above the sea, and in clear weather commands a view over all lower Languedoc to the Mediterranean Sea. I have spoken with people who either pretended or believed that they had seen, from the Pic de Finiels, white ships sailing by Montpellier and Cette. Behind was the upland northern country through which my way had lain, peopled by a dull race, without wood, without much grandeur of hill-form, and famous in the past for little beside wolves. But in front of me, half veiled in sunny haze, lay a new Gévaudan, rich, picturesque, illustrious for stirring events. Speaking largely, I was in the Cevennes at Monastier, and during all my journey; but there is a strict and local sense in which only this confused and shaggy country at my feet has any title to the name, and in this sense the peasantry employ the word. These are the Cevennes with an emphasis: the Cevennes of the Cevennes. In that undecipherable labyrinth of hills, a war of bandits, a war of wild beasts, raged for two years between the Grand Monarch with all his troops and marshals on the one hand, and a few thousand Protestant mountaineers upon the other. A hundred and eighty years ago, the Camisards held a station even on the Lozère, where I stood; they had an organisation, arsenals, a military and religious hierarchy; their affairs were ‘the discourse of every coffee-house’ in London; England sent fleets in their support; their leaders prophesied and murdered; with colours and drums, and the singing of old French psalms, their bands sometimes affronted daylight, marched before walled cities, and dispersed the generals of the king; and sometimes at night, or in masquerade, possessed themselves of strong castles, and avenged treachery upon their allies and cruelty upon their foes. There, a hundred and eighty years ago, was the chivalrous Roland, ‘Count and Lord Roland, generalissimo of the Protestants in France,’ grave, silent, imperious, pock-marked ex-dragoon, whom a lady followed in his wanderings out of love. There was Cavalier, a baker’s apprentice with a genius for war, elected brigadier of Camisards at seventeen, to die at fifty-five the English governor of Jersey. There again was Castanet, a partisan leader in a voluminous peruke and with a taste for controversial divinity. Strange generals, who moved apart to take counsel with the God of Hosts, and fled or offered battle, set sentinels or slept in an unguarded camp, as the Spirit whispered to their hearts! And there, to follow these and other leaders, was the rank and file of prophets and disciples, bold, patient, indefatigable, hardy to run upon the mountains, cheering their rough life with psalms, eager to fight, eager to pray, listening devoutly to the oracles of brain-sick children, and mystically putting a grain of wheat among the pewter balls with which they charged their muskets."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"

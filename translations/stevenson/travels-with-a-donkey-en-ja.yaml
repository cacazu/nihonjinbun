        "line_start": 2806
        "line_end": 2816
        "source_sequence": 2806
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2918
        "line_end": 2928
        "source_sequence": 2918
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[286]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2918-2928"
    "translation_ja": "こうした丈夫で素朴な素性の人々は、述べてきたとおり、信仰を変えない。たとえリモンの神殿でのナアマンのように、表向きの服従をしても、本当の背教まではしない。勅令の文句によれば「一世紀にわたる迫害が無益だったと確信し、同情よりもやむをえぬ事情から」、ルイ十六世がやっと寛容を許す王の恩典を出したとき、カサニャスはなおプロテスタントであった。現在も一人残らずそうである。なるほど、プロテスタントでない家が一軒あるが、カトリックでもない。教会にそむき、学校教師の女を伴侶としたカトリックの教区司祭の家である。面白いことに、その行いをプロテスタントの村人はよしとしない。"
    "translation_status": "reviewed"

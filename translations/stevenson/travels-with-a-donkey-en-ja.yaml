        "line_end": 693
        "source_sequence": 692
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 614
        "line_end": 615
        "source_sequence": 614
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[60]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-614-615"
    "translation_ja": "「いいえ」と母親は言った。「これで十分きれいとは言えません。ほら、細すぎるでしょう」"
    "translation_status": "reviewed"
  - "id": "td-068"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Thus does a wise peasantry console itself under adverse physical circumstances, and, by a startling democratic process, the defects of the majority decide the type of beauty."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[61]"
        "line_start": 694

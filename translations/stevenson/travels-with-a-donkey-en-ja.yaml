  - "id": "td-340"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The road lay under chestnuts, and though I saw a hamlet or two below me in the vale, and many lone houses of the chestnut farmers, it was a very solitary march all afternoon; and the evening began early underneath the trees. But I heard the voice of a woman singing some sad, old, endless ballad not far off. It seemed to be about love and a bel amoureux, her handsome sweetheart; and I wished I could have taken up the strain and answered her, as I went on upon my invisible woodland way, weaving, like Pippa in the poem, my own thoughts with hers. What could I have told her? Little enough; and yet all the heart requires. How the world gives and takes away, and brings sweethearts near only to separate them again into distant and strange lands; but to love is the great amulet which makes the world a garden; and ‘hope, which comes to all,’ outwears the accidents of life, and reaches with tremulous hand beyond the grave and death. Easy to say: yea, but also, by God’s mercy, both easy and grateful to believe!"
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[307]"
        "line_start": 2920
        "line_end": 2935
        "source_sequence": 2920
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3048
        "line_end": 3062
        "source_sequence": 3048
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[307]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3048-3062"
    "translation_ja": "道は栗の木の下を通っていた。下の谷に集落が一つ二つ、栗を作る農夫の離れ家がいくつも見えたが、午後じゅうひどく寂しい道のりで、木の下では早くも日が暮れはじめた。だが遠くないところで、昔の、哀しい、果てしないバラッドを歌う女の声が聞こえた。恋と、見目よい恋人の歌らしい。見えない森の道を行きながら、詩の中のピッパのように私の思いを彼女の思いに織り交ぜ、その節を引き取って返歌できたらいいのに、と思った。何を語れただろう。ほんのわずかだ。だが、心の求めるものはそれで尽きる。世の中は与えては奪い、恋人たちを近づけては、見知らぬ遠い国にまた引き離す。だが愛することは、世界を庭に変える大きな護符である。そして「誰にも訪れる希望」は人生の不意の災いより長くもち、震える手を、墓や死の向こうまで差しのべる。言うのは簡単だ。そうだが、神の慈悲で、信じることもまた、たやすく、ありがたいではないか。"
    "translation_status": "reviewed"
    "annotations":

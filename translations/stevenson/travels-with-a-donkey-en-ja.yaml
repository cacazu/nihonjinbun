    "translation_ja": "小道はやがて橋でシャスザックを渡り、深い谷間を捨て、ラ・グレの山を越えにかかった。レスタンプを抜け、高地の畑やブナと白樺の林を縫って上ると、曲がり角ごとに何か新しい面白みと出会った。シャスザックの峡谷にいるときから、何マイルも遠くで大きな低音の鐘が鳴るような音が耳に留まった。上りつづけて近づくうちに音色が変わり、ついに、それは野の角笛に合わせて羊の群れを野へ連れ出す者の音だと分かった。レスタンプの狭い通りは、壁から壁まで羊でいっぱいだった。黒い羊、白い羊が春の鳥のようにいっせいに鳴き、それぞれ首の鈴で伴奏する。すべて高音の、哀れを誘う演奏会だった。もう少し上ると、枝切り鎌を持って木に上る二人の男のそばを通り、その一人がブーレの踊りの節を歌っていた。なおも上って白樺の間を縫ううち、雄鶏の鳴き声が朗らかに耳へ届き、いっしょに、高地の村の一つから笛の声が、ゆっくり物悲しい曲を奏でてきた。白髪の混じった、林檎のような頬の田舎の先生が、澄んだ秋の日射しの中、自分の小さな庭で笛を吹くのを思い浮かべた。美しく心惹かれる音の数々は、めったに味わわぬ期待で胸をいっぱいにした。この上りかけている山脈を越えさえすれば、世界の園へ下る気がしたのである。これも思い違いではなかった。雨と風と寒々しい土地には、これでおさらばした。旅の第一部はここで終わり、これら甘美な音は、次のもっと美しい旅への前奏のようであった。"

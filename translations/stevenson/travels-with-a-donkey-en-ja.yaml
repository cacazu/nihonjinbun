  - "id": "td-161"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Father Michael, a pleasant, fresh-faced, smiling man, perhaps of thirty-five, took me to the pantry, and gave me a glass of liqueur to stay me until dinner. We had some talk, or rather I should say he listened to my prattle indulgently enough, but with an abstracted air, like a spirit with a thing of clay. And truly, when I remember that I descanted principally on my appetite, and that it must have been by that time more than eighteen hours since Father Michael had so much as broken bread, I can well understand that he would find an earthly savour in my conversation. But his manner, though superior, was exquisitely gracious; and I find I have a lurking curiosity as to Father Michael’s past."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"

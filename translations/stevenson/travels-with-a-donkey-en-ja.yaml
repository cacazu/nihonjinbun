    "kind": "paragraph"
    "origin": "source"
    "source_text": "Candidly, it seemed little worthy of all this searching. A few broken ends of village, with no particular street, but a succession of open places heaped with logs and fagots; a couple of tilted crosses, a shrine to Our Lady of all Graces on the summit of a little hill; and all this, upon a rattling highland river, in the corner of a naked valley. What went ye out for to see? thought I to myself. But the place had a life of its own. I found a board, commemorating the liberalities of Cheylard for the past year, hung up, like a banner, in the diminutive and tottering church. In 1877, it appeared, the inhabitants subscribed forty-eight francs ten centimes for the ‘Work of the Propagation of the Faith.’ Some of this, I could not help hoping, would be applied to my native land. Cheylard scrapes together halfpence for the darkened souls in Edinburgh; while Balquhidder and Dunrossness bemoan the ignorance of Rome. Thus, to the high entertainment of the angels, do we pelt each other with evangelists, like schoolboys bickering in the snow."

    "translation_ja": "夜のうちに二度、ほんのひととき意識に引き戻された。一度は寝袋の下の石が当たって痛く、二度目は哀れな辛抱強いモデスティーヌがじれて、道を蹄で掻いたり踏み鳴らしたりした。頭上の星を一つ二つ、空を背にした葉のレースのような縁も見た。三度目に目を覚ました九月二十五日の水曜、世界は夜明けを生む青い光に満ちていた。風の中でもがく葉と帯を引く道が見えた。頭を回すと、モデスティーヌがブナにつながれて、まねのできない忍耐の姿で道の半分をふさいで立っていた。また目を閉じ、昨夜の経験を振り返った。嵐のような天気でも、あれほど楽に、気持ちよく過ごせたことに驚いた。何も見えぬ闇夜に目隠し同然で場所を決めさせられなければ、あの面倒な石はなかったろう。それ以外、不自由といえば、物がごちゃごちゃ入った寝袋の中で、足が角灯やペイラの『荒野の牧師たち』第二巻に当たるときだけだった。いや、そればかりでなく、少しも寒さを感じず、いつになく軽く晴れやかな気分で目が覚めたのである。"

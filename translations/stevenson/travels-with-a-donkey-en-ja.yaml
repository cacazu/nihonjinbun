      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1714-1718"
    "translation_ja": "「お聞きでしょう！」と叫んだ。「私はここで侯爵を見たのですよ、侯爵、侯爵」と、その聖なる言葉を三度も繰り返した。「ほかにも上流社会の方々や、将軍たち。ここに、お隣にはこの紳士がおいでです。いく年も軍隊にいらして、勲章を戴いた、古強者です。そしていまここで、神に身を捧げようとなさっている」"
    "translation_status": "reviewed"
  - "id": "td-202"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was by this time so thoroughly embarrassed that I pled cold feet, and made my escape from the apartment. It was a furious windy morning, with a sky much cleared, and long and potent intervals of sunshine; and I wandered until dinner in the wild country towards the east, sorely staggered and beaten upon by the gale, but rewarded with some striking views."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[183]"
        "line_start": 1700
        "line_end": 1705
        "source_sequence": 1700
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1720
        "line_end": 1725
        "source_sequence": 1720
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[183]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1720-1725"
    "translation_ja": "もうあまりにばつが悪くて、足が冷たいからと部屋を抜け出した。烈しい風の朝で、空はずいぶん晴れ、長いあいだ強く日が射すことが幾度かあった。昼食まで東の荒野を歩きまわり、強風に打たれてよろめきはしたが、いくつか印象深い眺めに報いられた。"
    "translation_status": "reviewed"
  - "id": "td-203"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At dinner the Work of the Propagation of the Faith was recommenced, and on this occasion still more distastefully to me. The priest asked me many questions as to the contemptible faith of my fathers, and received my replies with a kind of ecclesiastical titter."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

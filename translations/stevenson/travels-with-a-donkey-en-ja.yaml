    "translation_ja": "ついに人の出す音が耳に入った。哀れみとあざけりの間を奇妙に行き来する叫びだった。谷の向こうを見ると、小さな悪童が一人、牧草地で膝を両手に抱いて座り、距離のために滑稽なほど小さく見えた。だが曲者は、私がモデスティーヌを追って、樫の森から樫の森へと道を下るところを見つけ、新しい土地の挨拶に、この震える甲高い声をくれたのだ。どんな音も十分に遠ければ美しく、自然なので、これも澄んだ山の大気の中を長く伝わり、緑の谷を端から端まで越えると、耳に心地よく、樫や川と同じようにこの田園になじむものに聞こえた。"

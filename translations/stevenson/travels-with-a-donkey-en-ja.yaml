        "source_sequence": 1624
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[167]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1624-1634"
    "translation_ja": "九月二十七日の金曜の朝、コーヒーの席になって、二人はようやく私が異端だと知った。あたりの修道生活を褒めることをいくつか口にして、誤解させたのだと思う。面と向かって質問されてようやく、本当のことが知れた。純朴なアポリナリス神父も、抜け目ないミカエル神父も、私には寛大に接してくれた。善良なアイルランド人の助祭も、私の信仰上の弱点を聞くと、肩をぽんと叩いて「カトリックになって天国においでなさい」と言っただけだ。だがいま居合わせたのは別種の正統派である。この二人は、スコットランド人の中でも一番いやな連中のように辛辣で、実直で、心が狭い。いや、正直なところ、それ以上だったと思う。司祭は軍馬さながら、鼻を鳴らした。"
    "translation_status": "reviewed"

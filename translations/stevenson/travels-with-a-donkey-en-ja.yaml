      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1599-1604"
    "translation_ja": "夕食では政治を話した。私はフランスに来ると、政争でも好意と節度を失わないよう説くことにしている。イギリスの心配性の人がカルタゴを引き合いに出すように、しきりにポーランドの例を話す。司祭も指揮官も私の言うことにはことごとく同感だと請け合い、当世の風潮がいがみ合いに満ちていることを、深いため息で嘆いた。"
    "translation_status": "reviewed"
  - "id": "td-181"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Why, you cannot say anything to a man with which he does not absolutely agree,’ said I, ‘but he flies up at you in a temper.’"

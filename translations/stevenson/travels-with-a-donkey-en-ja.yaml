        "original_unit_id": "/html/body/p[323]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3252-3256"
    "translation_ja": "モデスティーヌと私は、これが最後に共にした食事だったが、サン・ピエールの頂で軽く食べた。私は石の山に腰かけ、彼女は月明かりの中、そばに立って、行儀よく私の手からパンを食べた。あわれな獣はこの食べ方のほうが食が進むのだった。私にいくらか愛情を持っていたからだ。私はじきにそれを裏切ることになった。"
    "translation_status": "reviewed"
  - "id": "td-358"

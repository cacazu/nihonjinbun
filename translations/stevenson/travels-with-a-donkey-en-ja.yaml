        "line_start": 50
        "line_end": 57
        "source_sequence": 50
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[6]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-50-57"
    "translation_ja": "この小さな本に記す旅は、私にとってじつに楽しく、幸運なものでした。出だしこそ不格好でしたが、その後は最後まで申し分なく運に恵まれました。ところで、ジョン・バニヤンのいう「この世の荒野」では、私たちは誰もが旅人です。それもみなロバを連れた旅人で、道中で得られる何よりのものは、偽りのない友です。そうした友を大勢見つけた旅人は幸せ者です。じつのところ、私たちは友を見つけに旅をするのです。友こそ人生の目的であり、報いでもあります。友がいるから自分に恥じぬ者でいられるし、ひとりでいるときは、そのぶん、ここにいない友が身近になるのです。"
    "translation_status": "reviewed"
    "source_kind": "author_dedication"
  - "id": "td-006"
    "section_id": "front"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Every book is, in an intimate sense, a circular letter to the friends of him who writes it. They alone take his meaning; they find private messages, assurances of love, and expressions of gratitude, dropped for them in every corner. The public is but a generous patron who defrays the postage. Yet though the letter is directed to all, we have an old and kindly custom of addressing it on the outside to one. Of what shall a man be proud, if he is not proud of his friends? And so, my dear Sidney Colvin, it is with pride that I sign myself affectionately yours,"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[7]"
        "line_start": 187
        "line_end": 195

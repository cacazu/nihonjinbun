        "original_unit_id": "/html/body/p[59]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-610-612"
    "translation_ja": "朝食を少し取ろうと宿に戻ると、女主人が台所で娘の髪を梳いていたので、きれいな髪ですねと褒めた。"
    "translation_status": "reviewed"
  - "id": "td-067"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Oh no,’ said the mother; ‘it is not so beautiful as it ought to be. Look, it is too fine.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[60]"

  - "id": "td-049"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But the people of the inn, in nine cases out of ten, show themselves friendly and considerate. As soon as you cross the doors you cease to be a stranger; and although these peasantry are rude and forbidding on the highway, they show a tincture of kind breeding when you share their hearth. At Bouchet, for instance, I uncorked my bottle of Beaujolais, and asked the host to join me. He would take but little."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

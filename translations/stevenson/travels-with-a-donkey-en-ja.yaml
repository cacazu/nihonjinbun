  - "id": "td-246"
    "section_id": "pont-de-montvert"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Pont de Montvert, or Greenhill Bridge, as we might say at home, is a place memorable in the story of the Camisards. It was here that the war broke out; here that those southern Covenanters slew their Archbishop Sharp. The persecution on the one hand, the febrile enthusiasm on the other, are almost equally difficult to understand in these quiet modern days, and with our easy modern beliefs and disbeliefs. The Protestants were one and all beside their right minds with zeal and sorrow. They were all prophets and prophetesses. Children at the breast would exhort their parents to good works. ‘A child of fifteen months at Quissac spoke from its mother’s arms, agitated and sobbing, distinctly and with a loud voice.’ Marshal Villars has seen a town where all the women ‘seemed possessed by the devil,’ and had trembling fits, and uttered prophecies publicly upon the streets. A prophetess of Vivarais was hanged at Montpellier because blood flowed from her eyes and nose, and she declared that she was weeping tears of blood for the misfortunes of the Protestants. And it was not only women and children. Stalwart dangerous fellows, used to swing the sickle or to wield the forest axe, were likewise shaken with strange paroxysms, and spoke oracles with sobs and streaming tears. A persecution unsurpassed in violence had lasted near a score of years, and this was the result upon the persecuted; hanging, burning, breaking on the wheel, had been in vain; the dragoons had left their hoof-marks over all the countryside; there were men rowing in the galleys, and women pining in the prisons of the Church; and not a thought was changed in the heart of any upright Protestant."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[217]"
        "line_start": 2168
        "line_end": 2192
        "source_sequence": 2168
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2227
        "line_end": 2250
        "source_sequence": 2227
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[217]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2227-2250"
    "translation_ja": "ポン・ド・モンヴェール、母国流に言えば緑が丘橋は、カミザールの歴史で忘れがたい地だ。戦が始まったのも、南国の盟約派が、自分たちのシャープ大主教にあたる人物を殺したのも、ここである。片方の迫害と、もう片方の熱に浮かされた狂信は、信じるも信じぬもおおらかな、静かなこの時代には、ほとんど同じほどに理解しがたい。プロテスタントは一人残らず、熱意と悲しみで正気を失っていた。男も女もみな預言者だった。乳飲み子がよい行いをするよう親を訓戒することもあった。「キサックでは生後十五か月の子が、母親の腕の中で、身を震わせ、しゃくり上げながら、はっきりと大きな声で物を言った」。ヴィラール元帥は、女たちがみな「悪魔に取り憑かれたように」痙攣し、往来で公然と預言する町を見た。ヴィヴァレの女預言者は、目と鼻から血を流し、プロテスタントの不幸に血の涙を流していると公言したため、モンペリエで絞首刑になった。女や子どもばかりではない。鎌を振るい、森で斧を使い慣れた、たくましい危険な男たちも、奇妙な発作に揺すぶられ、しゃくり上げ、涙を流して託宣を告げた。他に類のない暴力的な迫害が二十年近くつづき、これが迫害された者たちに生じた結果だった。絞首刑も火刑も車裂きも、何の役にも立たなかった。竜騎兵は国じゅうに蹄の跡を残した。ガレー船を漕ぐ男も、教会の牢にやつれる女もいた。それでも、心をまっすぐに持つプロテスタントは、考えを一つとして変えなかった。"
    "translation_status": "reviewed"
  - "id": "td-247"
    "section_id": "pont-de-montvert"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now the head and forefront of the persecution—after Lamoignon de Bâvile—François de Langlade du Chayla (pronounce Chéïla), Archpriest of the Cevennes and Inspector of Missions in the same country, had a house in which he sometimes dwelt in the town of Pont de Montvert. He was a conscientious person, who seems to have been intended by nature for a pirate, and now fifty-five, an age by which a man has learned all the moderation of which he is capable. A missionary in his youth in China, he there suffered martyrdom, was left for dead, and only succoured and brought back to life by the charity of a pariah. We must suppose the pariah devoid of second-sight, and not purposely malicious in this act. Such an experience, it might be thought, would have cured a man of the desire to persecute; but the human spirit is a thing strangely put together; and, having been a Christian martyr, Du Chayla became a Christian persecutor. The Work of the Propagation of the Faith went roundly forward in his hands. His house in Pont de Montvert served him as a prison. There he closed the hands of his prisoners upon live coal, and plucked out the hairs of their beards, to convince them that they were deceived in their opinions. And yet had not he himself tried and proved the inefficacy of these carnal arguments among the Buddhists in China?"
    "source_languages":
      - "en"

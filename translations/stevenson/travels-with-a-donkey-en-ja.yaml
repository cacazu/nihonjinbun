        "source_sequence": 2202
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[216]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2202-2225"
    "translation_ja": "見た目にさえ、うれしい変化があった。モナスティエを出てからきれいな女性を一人も見ていない。そこでも一人きりだった。ところが、いっしょに食卓についた三人のうち、一人は確かに美しくはなかった。この騒々しい相席の食卓にすっかり困っている、四十ほどのおどおどした気の毒な女で、私が騎士役をつとめ、ワインを注ぎ、杯を合わせ、何とか勇気づけようとしても、まるで逆効果だった。だがほかの二人はどちらも人妻で、ふつうの女性よりは美しかった。さて、クラリスは？ クラリスについて何と言えばいいのか。彼女は芸をする雌牛のように、のっそり、おとなしく、何にも頓着せず給仕していた。大きな灰色の目は、恋のものうさに浸っている。顔立ちは肉づきがいいものの、独特のくっきりしたつくりだった。口元は反り、鼻の穴はこまやかな誇りを語り、頬の線は妙に興味深い。その顔には強い感情を宿す力があり、磨けば繊細な思いも表せそうだった。これほどよいモデルを、田舎の崇拝者と田舎の物の考え方に任せたままなのは、かわいそうに思えた。美貌は少なくとも一度、社交界に触れるべきである。触れるや否や、まとわりついた重荷を振り落とし、おのれに気づき、優雅さを着まとい、歩きぶりと頭の置きどころを習い覚え、たちまち女神の正体が現れる。出てゆく前にクラリスに、心から美しいと思うと伝えた。彼女は牛乳を飲むみたいに、当惑も驚きもせず、ただ大きな目で私をじっと見つめて受け取った。その結果、私のほうが少々うろたえたことは認めよう。クラリスが英語を読めたら、体つきが顔にふさわしくなかったなどということは書けまい。コルセットの要る体だったが、年を取るにつれて少しよくなるかもしれない。"
    "translation_status": "reviewed"

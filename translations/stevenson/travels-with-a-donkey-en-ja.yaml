  - "id": "td-164"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had scarce explored my niche when Brother Ambrose returned. An English boarder, it appeared, would like to speak with me. I professed my willingness, and the friar ushered in a fresh, young, little Irishman of fifty, a deacon of the Church, arrayed in strict canonicals, and wearing on his head what, in default of knowledge, I can only call the ecclesiastical shako. He had lived seven years in retreat at a convent of nuns in Belgium, and now five at Our Lady of the Snows; he never saw an English newspaper; he spoke French imperfectly, and had he spoken it like a native, there was not much chance of conversation where he dwelt. With this, he was a man eminently sociable, greedy of news, and simple-minded like a child. If I was pleased to have a guide about the monastery, he was no less delighted to see an English face and hear an English tongue."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"

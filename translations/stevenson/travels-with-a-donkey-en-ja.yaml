      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1792-1803"
    "translation_ja": "「よう、旦那、五時だ！」という声で、九月二十八日土曜の朝、目が覚めた。部屋には透きとおるような暗さが満ち、ほかの寝台三つと、枕に五つの違った寝帽子がぼんやり見えた。だが窓の外では、丘の頂を長い帯が覆って、朝焼けの赤みを増してきた。昼の光は台地にあふれ出る寸前である。元気の出る時刻だった。穏やかな天気になりそうで、その予感はすっかり当たった。まもなくモデスティーヌと出立した。道はしばらく台地を行き、それから急斜面の村を抜けてシャスザックの谷へ下った。流れは急な岸に世間からよく隠された、緑の牧草地の間を走る。エニシダが咲いて、ところどころ集落が煙を上げていた。"
    "translation_status": "reviewed"

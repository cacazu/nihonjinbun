  - "id": "td-265"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A new road leads from Pont de Montvert to Florac by the valley of the Tarn; a smooth sandy ledge, it runs about half-way between the summit of the cliffs and the river in the bottom of the valley; and I went in and out, as I followed it, from bays of shadow into promontories of afternoon sun. This was a pass like that of Killiecrankie; a deep turning gully in the hills, with the Tarn making a wonderful hoarse uproar far below, and craggy summits standing in the sunshine high above. A thin fringe of ash-trees ran about the hill-tops, like ivy on a ruin; but on the lower slopes, and far up every glen, the Spanish chestnut-trees stood each four-square to heaven under its tented foliage. Some were planted, each on its own terrace no larger than a bed; some, trusting in their roots, found strength to grow and prosper and be straight and large upon the rapid slopes of the valley; others, where there was a margin to the river, stood marshalled in a line and mighty like cedars of Lebanon. Yet even where they grew most thickly they were not to be thought of as a wood, but as a herd of stalwart individuals; and the dome of each tree stood forth separate and large, and as it were a little hill, from among the domes of its companions. They gave forth a faint sweet perfume which pervaded the air of the afternoon; autumn had put tints of gold and tarnish in the green; and the sun so shone through and kindled the broad foliage, that each chestnut was relieved against another, not in shadow, but in light. A humble sketcher here laid down his pencil in despair."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[235]"
        "line_start": 2298
        "line_end": 2320
        "source_sequence": 2298
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2373
        "line_end": 2394
        "source_sequence": 2373
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[235]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2373-2394"
    "translation_ja": "ポン・ド・モンヴェールからフロラックへ、タルンの谷沿いに新しい道が通じる。砂まじりの滑らかな棚のようで、崖の頂と谷底の川のほぼ中ほどを通る。道をたどる私は、日陰の入り江から午後の日の突き出た岬へ、入ったり出たりした。キリークランキーに似た峡谷だった。丘を縫う深い谷で、下のはるか遠くではタルン川が驚くほどのしゃがれ声で荒れ騒ぎ、はるか上には岩の峰々が日の中に立つ。頂を一周する細いトネリコの縁取りは廃墟を這う蔦に似ていた。だが下の斜面や谷の奥の高いところには、ヨーロッパグリが一本ずつ、テントのように広がる葉の下で、天に向かってがっしりと立っていた。一株ずつ寝台ほどの狭い段に植わったものもあれば、根の力を頼みに谷の急坂で育ち、栄え、真っすぐ大きくなれるものもある。川との間に余地のあるところでは、レバノン杉のように雄大な並木になっていた。だがいちばん密に生えたところでさえ、林というより、たくましい個の群れと呼ぶべきだった。隣り合う木々の丸い屋根の中で、一つ一つの丸屋根がそれぞれ離れ、小丘ほどに大きく、盛り上がって見えた。かすかな甘い香りがして、午後の空気に行きわたった。秋が緑に金と褪せた色を重ね、陽が幅広い葉の中を射し通り、火のように輝かせたので、栗の木は一本ずつ、隣の木を背に、影でなく光で浮かび上がった。つたない写生家は、ここで絶望して鉛筆を置いた。"
    "translation_status": "reviewed"
  - "id": "td-266"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I wish I could convey a notion of the growth of these noble trees; of how they strike out boughs like the oak, and trail sprays of drooping foliage like the willow; of how they stand on upright fluted columns like the pillars of a church; or like the olive, from the most shattered bole can put out smooth and youthful shoots, and begin a new life upon the ruins of the old. Thus they partake of the nature of many different trees; and even their prickly top-knots, seen near at hand against the sky, have a certain palm-like air that impresses the imagination. But their individuality, although compounded of so many elements, is but the richer and the more original. And to look down upon a level filled with these knolls of foliage, or to see a clan of old unconquerable chestnuts cluster ‘like herded elephants’ upon the spur of a mountain, is to rise to higher thoughts of the powers that are in Nature."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[236]"
        "line_start": 2321
        "line_end": 2334
        "source_sequence": 2321
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2396
        "line_end": 2408
        "source_sequence": 2396
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[236]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2396-2408"
    "translation_ja": "この堂々たる木がどんなふうに育つか、伝えられればいいのにと思う。樫のように枝を張り、柳のように葉の茂った細枝をしなだれさせる。教会の柱のように縦溝のある柱を真っすぐに立てたり、オリーヴのように、ひどく傷んだ幹からすべらかな若芽を出して、古い命の廃墟に新しい命を始めたりもする。こうしてさまざまな木の性質を併せもち、間近で空を背にすると、いがのある梢の房にどこか椰子のような趣があって、想像力に強く訴える。その個性はいくつもの要素から成るが、だからこそ一層ゆたかで独特だ。この葉の小丘で埋まった平地を見下ろしたり、古く不屈の栗の一族が「群れをなした象」のように、山の枝尾根に集まるのを見たりすれば、自然に宿る力について、いっそう高い思いに引き上げられる。"
    "translation_status": "reviewed"
  - "id": "td-267"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Between Modestine’s laggard humour and the beauty of the scene, we made little progress all that afternoon; and at last finding the sun, although still far from setting, was already beginning to desert the narrow valley of the Tarn, I began to cast about for a place to camp in. This was not easy to find; the terraces were too narrow, and the ground, where it was unterraced, was usually too steep for a man to lie upon. I should have slipped all night, and awakened towards morning with my feet or my head in the river."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[237]"
        "line_start": 2335
        "line_end": 2342
        "source_sequence": 2335
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2410
        "line_end": 2417
        "source_sequence": 2410
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[237]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2410-2417"
    "translation_ja": "モデスティーヌがのろのろしたい気分で、景色も美しかったから、午後じゅうほとんど進まなかった。しまいには、日没にはまだ間があるのに、日がタルンの狭い谷を去りはじめたので、野営の場所を探しはじめた。簡単には見つからない。段々畑は狭すぎ、段になっていない場所は、たいてい人が横になるには急すぎた。ひと晩じゅうずり落ち、朝には足か頭を川に突っこんで目を覚ましただろう。"
    "translation_status": "reviewed"
  - "id": "td-268"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "After perhaps a mile, I saw, some sixty feet above the road, a little plateau large enough to hold my sack, and securely parapeted by the trunk of an aged and enormous chestnut. Thither, with infinite trouble, I goaded and kicked the reluctant Modestine, and there I hastened to unload her. There was only room for myself upon the plateau, and I had to go nearly as high again before I found so much as standing-room for the ass. It was on a heap of rolling stones, on an artificial terrace, certainly not five feet square in all. Here I tied her to a chestnut, and having given her corn and bread and made a pile of chestnut-leaves, of which I found her greedy, I descended once more to my own encampment."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[238]"
        "line_start": 2343
        "line_end": 2353
        "source_sequence": 2343
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2419
        "line_end": 2428
        "source_sequence": 2419
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[238]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2419-2428"
    "translation_ja": "一マイルほど歩くと、道より六十フィートばかり上に、寝袋一つを置ける小さな平場が見えた。年経た途方もなく大きな栗の幹が、頼もしい胸壁になっていた。いやがるモデスティーヌを突き、蹴り、言いようもなく苦労して上らせ、急いで荷を下ろした。平場は私でいっぱいで、ロバが立っていられるだけの余地を見つけるには、もう同じくらい上らねばならなかった。ごろ石の山、人の作った段の上で、どう見ても五フィート四方に満たなかった。ここでロバを栗の木につなぎ、穀粒とパンを与え、大好物と分かった栗の葉を山にしてやり、自分の野営地へまた下った。"
    "translation_status": "reviewed"
  - "id": "td-269"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The position was unpleasantly exposed. One or two carts went by upon the road; and as long as daylight lasted I concealed myself, for all the world like a hunted Camisard, behind my fortification of vast chestnut trunk; for I was passionately afraid of discovery and the visit of jocular persons in the night. Moreover, I saw that I must be early awake; for these chestnut gardens had been the scene of industry no further gone than on the day before. The slope was strewn with lopped branches, and here and there a great package of leaves was propped against a trunk; for even the leaves are serviceable, and the peasants use them in winter by way of fodder for their animals. I picked a meal in fear and trembling, half lying down to hide myself from the road; and I daresay I was as much concerned as if I had been a scout from Joani’s band above upon the Lozère, or from Salomon’s across the Tarn, in the old times of psalm-singing and blood. Or, indeed, perhaps more; for the Camisards had a remarkable confidence in God; and a tale comes back into my memory of how the Count of Gévaudan, riding with a party of dragoons and a notary at his saddlebow to enforce the oath of fidelity in all the country hamlets, entered a valley in the woods, and found Cavalier and his men at dinner, gaily seated on the grass, and their hats crowned with box-tree garlands, while fifteen women washed their linen in the stream. Such was a field festival in 1703; at that date Antony Watteau would be painting similar subjects."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[239]"
        "line_start": 2354
        "line_end": 2376
        "source_sequence": 2354
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2430
        "line_end": 2451
        "source_sequence": 2430
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[239]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2430-2451"
    "translation_ja": "場所はいやになるほど丸見えだった。道を荷車が一台、二台と通り、明るいあいだは、追われるカミザールさながら、巨大な栗の幹の砦に隠れた。見つかって、夜中に冗談好きの人に訪ねてこられるのが、ひたすら怖かったのである。そのうえ早めに起きなければならないと分かった。ついきのうも、この栗畑で仕事がされていたのだ。斜面には切り払われた枝が散らばり、ところどころ幹に葉の大きな束が立てかけてあった。葉さえ役に立ち、農民は冬の家畜の飼料にする。びくびくしながら食事を少しつまみ、道から見えぬよう半ば寝そべっていた。詩篇と流血の昔、この上のロゼールのジョアニの一隊か、タルンの向こうのサロモンの一隊の見張り役であったとしても、これ以上気はもめまい。いや、実際は私のほうが気にしたかもしれない。カミザールは並外れて神を信頼していた。ジェヴォーダン伯が竜騎兵を率い、鞍の前に公証人を乗せ、各集落に忠誠を誓わせようと森の谷に入ったときの話が思い出される。カヴァリエとその部下は、帽子をツゲの花輪で飾り、草に座って楽しげに食事をしていた。川では女が十五人、彼らの衣類を洗っていた。一七〇三年の野の宴である。そのころアントワーヌ・ヴァトーは、似た題材を描いていたろう。"
    "translation_status": "reviewed"
  - "id": "td-270"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This was a very different camp from that of the night before in the cool and silent pine-woods. It was warm and even stifling in the valley. The shrill song of frogs, like the tremolo note of a whistle with a pea in it, rang up from the river-side before the sun was down. In the growing dusk, faint rustlings began to run to and fro among the fallen leaves; from time to time a faint chirping or cheeping noise would fall upon my ear; and from time to time I thought I could see the movement of something swift and indistinct between the chestnuts. A profusion of large ants swarmed upon the ground; bats whisked by, and mosquitoes droned overhead. The long boughs with their bunches of leaves hung against the sky like garlands; and those immediately above and around me had somewhat the air of a trellis which should have been wrecked and half overthrown in a gale of wind."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[240]"
        "line_start": 2377

    "translation_ja": "隣の戸口には一同が勢ぞろいした。男一人、女二人、それに娘が一人。旅人を調べようと角灯を二つ持って出た。男は悪くない顔立ちだったが、油断のならない笑みを浮かべている。戸口の柱にもたれ、私が事情を話すのを聞いた。私が頼んだのはシェラールまでの案内だけだった。"

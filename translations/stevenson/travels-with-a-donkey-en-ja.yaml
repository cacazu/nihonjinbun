      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2453-2465"
    "translation_ja": "昨夜のひんやりと静かな松林の野営とは、まるで違った。谷は暖かく、息苦しいほどだった。日没前から、豆を入れた笛の震える高音のような蛙の歌が川辺から響いた。夕闇が深まると、枯れ葉の中をかすかなかさこそいう音が行ったり来たりした。ときどき、ちっちっと鳴く小さな音が耳に落ち、またときどき、栗の間に素早い、はっきりしない何かの動きが見える気がした。地面には大きな蟻が無数に群がり、蝙蝠がさっと飛び、蚊が頭上でうなった。長い枝は葉の束をつけたまま、花綱のように空を背に垂れ、すぐ頭の上やまわりを囲む枝は、暴風に壊され半ば倒れかかった棚のように見えた。"
    "translation_status": "reviewed"
  - "id": "td-271"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Sleep for a long time fled my eyelids; and just as I was beginning to feel quiet stealing over my limbs, and settling densely on my mind, a noise at my head startled me broad awake again, and, I will frankly confess it, brought my heart into my mouth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

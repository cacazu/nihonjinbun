  - "id": "td-220"
    "section_id": "a-night-among-the-pines"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "From Bleymard after dinner, although it was already late, I set out to scale a portion of the Lozère. An ill-marked stony drove-road guided me forward; and I met nearly half-a-dozen bullock-carts descending from the woods, each laden with a whole pine-tree for the winter’s firing. At the top of the woods, which do not climb very high upon this cold ridge, I struck leftward by a path among the pines, until I hit on a dell of green turf, where a streamlet made a little spout over some stones to serve me for a water-tap. ‘In a more sacred or sequestered bower . . . nor nymph nor faunus haunted.’ The trees were not old, but they grew thickly round the glade: there was no outlook, except north-eastward upon distant hill-tops, or straight upward to the sky; and the encampment felt secure and private like a room. By the time I had made my arrangements and fed Modestine, the day was already beginning to decline. I buckled myself to the knees into my sack and made a hearty meal; and as soon as the sun went down, I pulled my cap over my eyes and fell asleep."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[196]"
        "line_start": 1826
        "line_end": 1841
        "source_sequence": 1826

        "line_end": 2284
        "source_sequence": 2273
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[219]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2273-2284"
    "translation_ja": "ラングドックで生きることは耐えがたいうえ、逃げることも厳重に禁じられた。山道をよく知る騾馬追いのマシップという男は、すでにいく組もの逃亡者を無事、ジュネーヴに案内した。その男が、主に男装の女たちからなる別の一行を連れているとき、デュ・シェイラは運の尽きで、彼らを捕らえた。その次の日曜、ブジェ山のアルテファージュの森で、プロテスタントの秘密集会があった。セギエという、仲間からエスプリ・セギエ（霊のセギエ）と呼ばれる男が立ち上がった。羊毛を梳く職人で、背が高く、顔が黒く、歯はないが、預言に満ちた男だった。神の名において、服従の時は過ぎ、同胞を解き放ち司祭を滅ぼすため、武器をとらねばならないと宣言した。"
    "translation_status": "reviewed"
  - "id": "td-249"
    "section_id": "pont-de-montvert"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The next night, 24th July 1702, a sound disturbed the Inspector of Missions as he sat in his prison-house at Pont de Montvert: the voices of many men upraised in psalmody drew nearer and nearer through the town. It was ten at night; he had his court about him, priests, soldiers, and servants, to the number of twelve or fifteen; and now dreading the insolence of a conventicle below his very windows, he ordered forth his soldiers to report. But the psalm-singers were already at his door, fifty strong, led by the inspired Séguier, and breathing death. To their summons, the archpriest made answer like a stout old persecutor, and bade his garrison fire upon the mob. One Camisard (for, according to some, it was in this night’s work that they came by the name) fell at this discharge: his comrades burst in the door with hatchets and a beam of wood, overran the lower story of the house, set free the prisoners, and finding one of them in the vine, a sort of Scavenger’s Daughter of the place and period, redoubled in fury against Du Chayla, and sought by repeated assaults to carry the upper floors. But he, on his side, had given absolution to his men, and they bravely held the staircase."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

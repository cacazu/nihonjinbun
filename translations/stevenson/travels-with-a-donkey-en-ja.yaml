    "translation_ja": "タルンの谷とラ・ヴェルネードで会った人々は、この一節だけではなく、また別のことをも説明してくれた。いったん戦に身を投じるや、あれほど強情で血を流した者たちが、二十年間の苦しみを、子どもの柔和さ、聖人と農民の忍耐強さで、どうして耐えぬいたのかということも。"

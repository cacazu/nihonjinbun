  - "id": "td-048"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The auberge of Bouchet St. Nicolas was among the least pretentious I have ever visited; but I saw many more of the like upon my journey. Indeed, it was typical of these French highlands. Imagine a cottage of two stories, with a bench before the door; the stable and kitchen in a suite, so that Modestine and I could hear each other dining; furniture of the plainest, earthern floors, a single bedchamber for travellers, and that without any convenience but beds. In the kitchen cooking and eating go forward side by side, and the family sleep at night. Any one who has a fancy to wash must do so in public at the common table. The food is sometimes spare; hard fish and omelette have been my portion more than once; the wine is of the smallest, the brandy abominable to man; and the visit of a fat sow, grouting under the table and rubbing against your legs, is no impossible accompaniment to dinner."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[41]"
        "line_start": 605
        "line_end": 617
        "source_sequence": 605
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 514
        "line_end": 526
        "source_sequence": 514
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[41]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-514-526"
    "translation_ja": "ブシェ・サン・ニコラの宿は、これまで泊まったなかでもとりわけ飾り気がなかったが、このあと旅のあいだに同じようなものをまだいくつも見た。このフランスの高地では典型的な宿である。二階建ての小さな家で、戸口の前に腰掛けがあるとお考えいただきたい。厩と台所は隣り合い、私とモデスティーヌはお互いの食事の音が聞こえる。家具はいたって質素、床は土のまま、旅人用の寝室は一つきりで、寝台以外には何もない。台所では煮炊きと食事が同時に行われ、夜は一家がそこで寝る。顔でも洗いたい人がいれば、みんなのいる食卓で堂々とやるしかない。食事も粗末なときがあって、固い魚とオムレツだけあてがわれたことが一度や二度ではない。ワインはひどく薄く、ブランデーは人に飲ませる代物ではない。夕食に肥った雌豚がやって来て、卓の下を鼻で掘りまわし、脚にすり寄ってくるのも、ない話ではない。"
    "translation_status": "reviewed"

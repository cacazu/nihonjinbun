      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3104-3109"
    "translation_ja": "十月二日、木曜。目を覚ますと、雄鶏たちが華々しく鳴き、満足げな雌鶏たちがこっこっと鳴くのが聞こえた。夜を過ごした清潔で寝心地のよい部屋の窓に寄ると、深い谷に広がる栗畑に、朝の陽が射していた。まだ早い時刻で、雄鶏の声、斜めに射す光、長い影に誘われ、外に出て辺りを見てみる気になった。"

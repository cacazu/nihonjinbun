    "kind": "paragraph"
    "origin": "source"
    "source_text": "Strange was the position of this little Catholic metropolis, a thimbleful of Rome, in such a wild and contrary neighbourhood. On the one hand, the legion of Salomon overlooked it from Cassagnas; on the other, it was cut off from assistance by the legion of Roland at Mialet. The curé, Louvrelenil, although he took a panic at the arch-priest’s funeral, and so hurriedly decamped to Alais, stood well by his isolated pulpit, and thence uttered fulminations against the crimes of the Protestants. Salomon besieged the village for an hour and a half, but was beaten back. The militiamen, on guard before the curé’s door, could be heard, in the black hours, singing Protestant psalms and holding friendly talk with the insurgents. And in the morning, although not a shot had been fired, there would not be a round of powder in their flasks. Where was it gone? All handed over to the Camisards for a consideration. Untrusty guardians for an isolated priest!"
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[313]"
        "line_start": 2999
        "line_end": 3013
        "source_sequence": 2999
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3135
        "line_end": 3148
        "source_sequence": 3135
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[313]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3135-3148"
    "translation_ja": "この荒々しい敵対的な近辺に、指ぬき一杯のローマをなす小さなカトリックの中心地があるのは、奇妙な成り行きだった。片方ではサロモンの軍団がカサニャスから見下ろし、もう片方ではミアレのロランの軍団が援軍を断っている。教区司祭のルーヴルニルは、首席司祭の葬儀では狼狽してあわててアレまで逃げたものの、孤立した説教壇をよく守り、そこからプロテスタントの罪を激しく糾弾した。サロモンは一時間半、この村を包囲したが撃退された。司祭の戸口の前で警護に当たる民兵は、漆黒の時刻になると、プロテスタントの詩篇を歌い、反乱軍と親しげに話すのが聞こえた。朝には、一発の銃声もなかったのに、火薬入れは空っぽである。どこへ行ったのか。皆、見返りをもらってカミザールに渡したのだ。孤立した司祭には何とも頼りのない守り手だ！"
    "translation_status": "reviewed"

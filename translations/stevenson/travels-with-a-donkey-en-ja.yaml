        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2467
        "line_end": 2470
        "source_sequence": 2467
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[241]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2467-2470"
    "translation_ja": "いつまでも眠りが瞼を訪れなかった。ようやく静けさが手足に忍びこみ、心に深く積もりはじめたとき、頭のところで物音がして、びっくりしてすっかり目がさめた。正直に言うと、心臓が口から飛び出す思いだった。"
    "translation_status": "reviewed"
  - "id": "td-272"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was such a noise as a person would make scratching loudly with a finger-nail; it came from under the knapsack which served me for a pillow, and it was thrice repeated before I had time to sit up and turn about. Nothing was to be seen, nothing more was to be heard, but a few of these mysterious rustlings far and near, and the ceaseless accompaniment of the river and the frogs. I learned next day that the chestnut gardens are infested by rats; rustling, chirping, and scraping were probably all due to these; but the puzzle, for the moment, was insoluble, and I had to compose myself for sleep, as best I could, in wondering uncertainty about my neighbours."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[242]"
        "line_start": 2394
        "line_end": 2403
        "source_sequence": 2394
      - "source_id": "gutenberg-535-text"
        "precision": "line"

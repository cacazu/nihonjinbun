      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1575-1597"
    "translation_ja": "着くのが遅くて昼食は一人だったが、夕食でほかの客二人に会った。一人は田舎の教区司祭で、孤独と祈りの四日を堪能するために、その朝、マンド近くの自分の教区から歩いてきた。擲弾兵のような背格好、百姓のように頬は赤く、顔には丸く刻まれた皺があった。裾にひどく足を取られたとぼやくので、骨太の背を伸ばし、司祭服の裾をたくし上げ、ジェヴォーダンの寒々しい丘を大股に歩く姿が、ありありと目に浮かぶ。もう一人は四十五から五十ほど、白髪の混じった、背の低いずんぐりした男で、ツイードに短い編み上着、襟のボタン穴には勲章を示す赤いリボンをつけていた。この後者は何と言えばよいか難しい。実戦を経験して指揮官の位まで上った古参軍人で、軍営仕込みのてきぱきした物腰を少し残していた。一方、退役願いが受理されるとすぐ、雪の聖母に寄宿しに来て、そこでの生活をしばらく経験したのち、修練者としてとどまると決めたのだった。新しい生活はすでに見た目も変えはじめていた。修道士たちの静かで笑顔のある風情が少し身につき、士官でもなく、まだトラピスト会の修道士でもなく、どちらの性質も兼ねそなえていた。じつに面白い人生の節目にいる男だった。大砲と喇叭の喧騒から、墓のほとりのこの静かな国へ移るさなかである。ここでは人々は毎晩、死装束で眠り、幽霊のように合図で意思を通わせる。"
    "translation_status": "reviewed"
  - "id": "td-180"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At supper we talked politics. I make it my business, when I am in France, to preach political good-will and moderation, and to dwell on the example of Poland, much as some alarmists in England dwell on the example of Carthage. The priest and the commandant assured me of their sympathy with all I said, and made a heavy sighing over the bitterness of contemporary feeling."
    "source_languages":
      - "en"
    "source_locations":

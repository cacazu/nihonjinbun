    "translation_ja": "「朝になったら」と夫が言った。「その杖よりいい物を作ってあげましょう。ああいう畜生には何にもこたえません。『ロバのように鈍い』って言うとおりです。棍棒で気を失うまで殴ったって、どこにも行けやしませんよ」"

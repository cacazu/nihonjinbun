  - "id": "td-330"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He was the only person, in all my voyage, who saw anything hardy in so simple a proceeding; although many considered it superfluous. Only one, on the other hand, professed much delight in the idea; and that was my Plymouth Brother, who cried out, when I told him I sometimes preferred sleeping under the stars to a close and noisy ale-house, ‘Now I see that you know the Lord!’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[297]"
        "line_start": 2857
        "line_end": 2862
        "source_sequence": 2857
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2979
        "line_end": 2984
        "source_sequence": 2979
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[297]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2979-2984"
    "translation_ja": "この単純な行いを勇気のいることと見たのは、旅のあいだこの人だけだった。余計なこととは多くの人が考えたが。一方、その考えを手放しで喜んだのは一人だけで、それはあのプリマス・ブレザレンの友だった。息苦しく騒々しい酒場より、星の下で眠るほうが好きなことがあると告げると、「やっぱりあなたは主をご存じなのだ！」と叫んだ。"
    "translation_status": "reviewed"
  - "id": "td-331"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The merchant asked me for one of my cards as I was leaving, for he said I should be something to talk of in the future, and desired me to make a note of his request and reason; a desire with which I have thus complied."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[298]"
        "line_start": 2863
        "line_end": 2866
        "source_sequence": 2863
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2986
        "line_end": 2988
        "source_sequence": 2986
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[298]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2986-2988"
    "translation_ja": "別れぎわに、商人は私の名刺を一枚ほしいと言った。将来、何か話の種になるからというのである。そう頼んだことと、その理由を書き留めてくれとも言われたので、ここにその願いをかなえたしだいである。"
    "translation_status": "reviewed"
  - "id": "td-332"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A little after two I struck across the Mimente, and took a rugged path southward up a hillside covered with loose stones and tufts of heather. At the top, as is the habit of the country, the path disappeared; and I left my she-ass munching heather, and went forward alone to seek a road."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[299]"
        "line_start": 2867
        "line_end": 2871
        "source_sequence": 2867
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2990
        "line_end": 2993
        "source_sequence": 2990
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[299]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2990-2993"
    "translation_ja": "二時を少し過ぎてミマントを横切り、ごろ石とヒースの房におおわれた山腹を南へ登る、ごつごつした道を取った。頂ではこの土地のお決まりで道が消えた。雌ロバはヒースをむしゃむしゃ食べるに任せ、私は一人、先へ道を探しに出た。"
    "translation_status": "reviewed"
  - "id": "td-333"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was now on the separation of two vast water-sheds; behind me all the streams were bound for the Garonne and the Western Ocean; before me was the basin of the Rhone. Hence, as from the Lozère, you can see in clear weather the shining of the Gulf of Lyons; and perhaps from here the soldiers of Salomon may have watched for the topsails of Sir Cloudesley Shovel, and the long-promised aid from England. You may take this ridge as lying in the heart of the country of the Camisards; four of the five legions camped all round it and almost within view—Salomon and Joani to the north, Castanet and Roland to the south; and when Julien had finished his famous work, the devastation of the High Cevennes, which lasted all through October and November 1703, and during which four hundred and sixty villages and hamlets were, with fire and pickaxe, utterly subverted, a man standing on this eminence would have looked forth upon a silent, smokeless, and dispeopled land. Time and man’s activity have now repaired these ruins; Cassagnas is once more roofed and sending up domestic smoke; and in the chestnut gardens, in low and leafy corners, many a prosperous farmer returns, when the day’s work is done, to his children and bright hearth. And still it was perhaps the wildest view of all my journey. Peak upon peak, chain upon chain of hills ran surging southward, channelled and sculptured by the winter streams, feathered from head to foot with chestnuts, and here and there breaking out into a coronal of cliffs. The sun, which was still far from setting, sent a drift of misty gold across the hill-tops, but the valleys were already plunged in a profound and quiet shadow."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[300]"
        "line_start": 2872
        "line_end": 2896
        "source_sequence": 2872
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2995
        "line_end": 3018
        "source_sequence": 2995
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[300]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2995-3018"
    "translation_ja": "いま私は二つの広大な流域の分水界にいた。私の背後の水はすべてガロンヌ川と西の大洋へ、前にはローヌの流域がある。ここからもロゼールからと同じく、晴れた日にはリオン湾の輝きが見える。もしかしたらサロモンの兵たちは、クラウズリー・ショヴェル卿の船の上檣帆と、イングランドから長らく約束されていた援軍を、ここから見張ったかもしれない。この尾根をカミザールの国の真ん中と見てよい。五つの軍団のうち四つが、このまわり、ほとんど目に見える範囲に野営した。北にサロモンとジョアニ、南にカスタネとロラン。一七〇三年十月と十一月を通じ、火とつるはしで四百六十の村落をすっかり滅ぼしたジュリアンの名高い御業、上セヴェンヌの荒廃が終わったとき、この高みに立つ者なら、静まり返り、煙一筋もなく、人影のない土地を見渡したことだろう。今では年月と人の働きがこの廃墟をよみがえらせた。カサニャスはまた屋根を戴き、暮らしの煙を上げ、栗畑の、葉の茂る低い片隅では、仕事が終わると、裕福な農夫がいく人も子どもたちや明るい炉へ帰っていく。それでもおそらく、旅で一番荒々しい眺めだった。峰にまた峰、山並みにまた山並みが、うねるように南へ走り、冬の川に刻まれ彫りこまれ、頭から足まで栗の木を羽毛のようにまとい、ところどころ、断崖の王冠を突き出していた。日は沈むにはまだ遠く、霞んだ金色を丘の頂に流したが、谷はすでに、深く静かな影の中へ沈んでいた。"
    "translation_status": "reviewed"
  - "id": "td-334"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A very old shepherd, hobbling on a pair of sticks, and wearing a black cap of liberty, as if in honour of his nearness to the grave, directed me to the road for St. Germain de Calberte. There was something solemn in the isolation of this infirm and ancient creature. Where he dwelt, how he got upon this high ridge, or how he proposed to get down again, were more than I could fancy. Not far off upon my right was the famous Plan de Font Morte, where Poul with his Armenian sabre slashed down the Camisards of Séguier. This, methought, might be some Rip van Winkle of the war, who had lost his comrades, fleeing before Poul, and wandered ever since upon the mountains. It might be news to him that Cavalier had surrendered, or Roland had fallen fighting with his back against an olive. And while I was thus working on my fancy, I heard him hailing in broken tones, and saw him waving me to come back with one of his two sticks. I had already got some way past him; but, leaving Modestine once more, retraced my steps."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[301]"
        "line_start": 2897
        "line_end": 2912
        "source_sequence": 2897
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3020
        "line_end": 3034
        "source_sequence": 3020
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[301]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3020-3034"
    "translation_ja": "ひどく年老いた羊飼いが二本の杖でよろよろと歩き、死が近いのを記念するかのように、自由のしるしである黒い帽子をかぶっていた。この人がサン・ジェルマン・ド・カルベルトへの道を教えてくれた。よぼよぼの老人がただ一人でいることには、何か厳粛なものがあった。どこに住むのか、どうしてこの高い尾根に上ったか、またどうやって下りるつもりか、想像の外であった。右手のほど近くには、プールがアルメニアの軍刀でセギエのカミザールを斬り倒した、あの有名なプラン・ド・フォン・モルトがあった。この老人こそ、あの戦争のリップ・ヴァン・ウィンクルかもしれない。プールから逃げて仲間を失い、その後もずっと山をさまよった。カヴァリエが降伏したことも、ロランがオリーヴの木を背に戦って倒れたことも、この人には初耳かもしれない。そう空想を働かせていると、途切れた声が聞こえ、二本の杖の一本を振って引き返せと合図するのが見えた。もうだいぶ行きすぎていたが、またモデスティーヌを残し、来た道を取って返した。"
    "translation_status": "reviewed"
  - "id": "td-335"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Alas, it was a very commonplace affair. The old gentleman had forgot to ask the pedlar what he sold, and wished to remedy this neglect."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[302]"
        "line_start": 2913
        "line_end": 2914
        "source_sequence": 2913
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3036
        "line_end": 3037
        "source_sequence": 3036
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[302]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3036-3037"
    "translation_ja": "残念ながら、ごくありきたりの用だった。ご老人は、行商人だと思った私が何を売っているか聞き忘れ、聞き直したかっただけだ。"
    "translation_status": "reviewed"
  - "id": "td-336"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I told him sternly, ‘Nothing.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"

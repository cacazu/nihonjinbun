      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1338-1347"
    "translation_ja": "ミカエル神父は三十五くらいの、朗らかで血色がよく、笑顔をたやさない男だった。食料部屋に連れてゆき、食事まで腹をもたせるようにリキュールを一杯くれた。しばらく話した。というより、土くれを相手にする霊のような、心ここにあらずといった様子ながら、私のおしゃべりを大目に見て聞いてくれた。たしかに、私がもっぱら空腹のことをとうとうと述べ、いっぽう神父はパンひとかけ口にしてからもう十八時間以上たっていただろうことを思うと、私の話がいかにも現世くさかったろうことはよく分かる。だが超然としていながら、神父の物腰にはこの上ない優しさがあった。今でも、ミカエル神父の過去にはひそかな好奇心がある。"
    "translation_status": "reviewed"
  - "id": "td-162"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The whet administered, I was left alone for a little in the monastery garden. This is no more than the main court, laid out in sandy paths and beds of parti-coloured dahlias, and with a fountain and a black statue of the Virgin in the centre. The buildings stand around it four-square, bleak, as yet unseasoned by the years and weather, and with no other features than a belfry and a pair of slated gables. Brothers in white, brothers in brown, passed silently along the sanded alleys; and when I first came out, three hooded monks were kneeling on the terrace at their prayers. A naked hill commands the monastery upon one side, and the wood commands it on the other. It lies exposed to wind; the snow falls off and on from October to May, and sometimes lies six weeks on end; but if they stood in Eden, with a climate like heaven’s, the buildings themselves would offer the same wintry and cheerless aspect; and for my part, on this wild September day, before I was called to dinner, I felt chilly in and out."
    "source_languages":
      - "en"
    "source_locations":

      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-950-963"
    "translation_ja": "モデスティーヌを楽なようにつなぎ直し、黒パンの半分を割って夕飯にやり、半分は朝に取っておいた。それから必要なものを手の届くところに集め、濡れた靴と脚絆を脱いで防水外套にくるみ、寝袋の折り返しの下に背嚢を枕代わりに据えた。手足を袋にするりと差し入れ、赤ん坊のおくるみよろしく金具でしっかり留めた。ボローニャ・ソーセージの缶を一つ開け、板チョコレートを割った。食べ物はそれだけだった。気持ち悪く聞こえるかもしれないが、パンと肉を食べるように、一口ずつ取り合わせて食べた。この吐き気を催す取り合わせを流しこむには、水で割らないブランデーしかなかった。それ自体、吐き気を催す飲み物である。だが私は痛快なほど腹が減っていた。うまく食べ、これまでで指折りにうまい紙巻き煙草を一本吸った。それから麦わら帽子に石を入れ、毛皮の帽子の垂れを下ろして首と目を覆い、連発拳銃を手もとに置いて、羊の毛皮の奥に体をうずめた。"
    "translation_status": "reviewed"
  - "id": "td-118"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I questioned at first if I were sleepy, for I felt my heart beating faster than usual, as if with an agreeable excitement to which my mind remained a stranger. But as soon as my eyelids touched, that subtle glue leaped between them, and they would no more come separate. The wind among the trees was my lullaby. Sometimes it sounded for minutes together with a steady, even rush, not rising nor abating; and again it would swell and burst like a great crashing breaker, and the trees would patter me all over with big drops from the rain of the afternoon. Night after night, in my own bedroom in the country, I have given ear to this perturbing concert of the wind among the woods; but whether it was a difference in the trees, or the lie of the ground, or because I was myself outside and in the midst of it, the fact remains that the wind sang to a different tune among these woods of Gévaudan. I hearkened and hearkened; and meanwhile sleep took gradual possession of my body and subdued my thoughts and senses; but still my last waking effort was to listen and distinguish, and my last conscious state was one of wonder at the foreign clamour in my ears."
    "source_languages":
      - "en"

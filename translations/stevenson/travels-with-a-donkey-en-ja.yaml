  - "id": "td-086"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All seemed right at last. My thoughts began to turn upon dinner and a fireside, and my heart was agreeably softened in my bosom. Alas, and I was on the brink of new and greater miseries! Suddenly, at a single swoop, the night fell. I have been abroad in many a black night, but never in a blacker. A glimmer of rocks, a glimmer of the track where it was well beaten, a certain fleecy density, or night within night, for a tree,—this was all that I could discriminate. The sky was simply darkness overhead; even the flying clouds pursued their way invisibly to human eyesight. I could not distinguish my hand at arm’s-length from the track, nor my goad, at the same distance, from the meadows or the sky."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[75]"
        "line_start": 865
        "line_end": 875
        "source_sequence": 865
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 803
        "line_end": 812
        "source_sequence": 803
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[75]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-803-812"
    "translation_ja": "ようやく万事うまくいったと思った。心は夕飯や炉端に向かいはじめ、胸の内はいい具合にほぐれた。ああ、それが今までよりもっとひどい苦難に落ちる寸前だったとは！ 突然、夜が一気に襲ってきた。真っ暗な夜に外へ出た経験は何度もあるが、これ以上暗い夜は知らない。岩らしいほの明かり、よく踏み固められたところの道らしいほの明かり、羊の毛のように密な黒さ、闇の中の闇があれば木。それだけが見分けられた。頭上の空もただ闇で、飛び去る雲さえ人の目には見えなかった。腕を伸ばせば道と自分の手との区別もつかず、同じ距離の突き棒も牧草地や空と区別がつかなかった。"
    "translation_status": "reviewed"
  - "id": "td-087"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Soon the road that I was following split, after the fashion of the country, into three or four in a piece of rocky meadow. Since Modestine had shown such a fancy for beaten roads, I tried her instinct in this predicament. But the instinct of an ass is what might be expected from the name; in half a minute she was clambering round and round among some boulders, as lost a donkey as you would wish to see. I should have camped long before had I been properly provided; but as this was to be so short a stage, I had brought no wine, no bread for myself, and little over a pound for my lady friend. Add to this, that I and Modestine were both handsomely wetted by the showers. But now, if I could have found some water, I should have camped at once in spite of all. Water, however, being entirely absent, except in the form of rain, I determined to return to Fouzilhic, and ask a guide a little farther on my way—‘a little farther lend thy guiding hand.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[76]"
        "line_start": 876
        "line_end": 890
        "source_sequence": 876
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 814
        "line_end": 827
        "source_sequence": 814
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[76]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-814-827"
    "translation_ja": "しばらくすると、たどっていた道は岩だらけの草地で、このあたりの常として三つも四つにも分かれた。モデスティーヌはあれほど踏み固められた道が好きなので、この窮地には本能をあてにしてみた。しかしロバの本能は、呼び名から察せられるとおりである。三十秒もしないうちに大岩の間をぐるぐるよじ登り、絵に描いたような迷いロバになった。まともに備えがあれば、とっくに野営しただろう。ところが短い道程のつもりでワインもなく、自分のパンもなく、雌の相棒の分も一ポンド少々しかない。そのうえ私はもちろんモデスティーヌも、にわか雨で見事にずぶ濡れだった。だが今となっては水さえ見つかれば、ほかはどうあれ、すぐにでも野営しただろう。ところが降ってくる雨以外、水はまったくなかった。私はフジリックに戻り、もう少し先へ案内してくれる人を頼むと決めた。「もうしばしその導きの手を貸したまえ」"
    "translation_status": "reviewed"
  - "id": "td-088"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The thing was easy to decide, hard to accomplish. In this sensible roaring blackness I was sure of nothing but the direction of the wind. To this I set my face; the road had disappeared, and I went across country, now in marshy opens, now baffled by walls unscalable to Modestine, until I came once more in sight of some red windows. This time they were differently disposed. It was not Fouzilhic, but Fouzilhac, a hamlet little distant from the other in space, but worlds away in the spirit of its inhabitants. I tied Modestine to a gate, and groped forward, stumbling among rocks, plunging mid-leg in bog, until I gained the entrance of the village. In the first lighted house there was a woman who would not open to me. She could do nothing, she cried to me through the door, being alone and lame; but if I would apply at the next house, there was a man who could help me if he had a mind."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"

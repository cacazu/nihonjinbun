  - "id": "td-345"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "St. Germain de Calberte is a great parish nine leagues round about. At the period of the wars, and immediately before the devastation, it was inhabited by two hundred and seventy-five families, of which only nine were Catholic; and it took the curé seventeen September days to go from house to house on horseback for a census. But the place itself, although capital of a canton, is scarce larger than a hamlet. It lies terraced across a steep slope in the midst of mighty chestnuts. The Protestant chapel stands below upon a shoulder; in the midst of the town is the quaint old Catholic church."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[311]"
        "line_start": 2977
        "line_end": 2985
        "source_sequence": 2977
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3111
        "line_end": 3119
        "source_sequence": 3111
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[311]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3111-3119"
    "translation_ja": "サン・ジェルマン・ド・カルベルトは、周囲九リューの広い教区である。戦時中、すっかり荒らされる直前には二百七十五世帯が住み、カトリックはわずか九世帯だった。人口を調べるには、九月の十七日間、司祭が馬で一軒ずつ回らねばならなかった。だが町そのものは小郡の中心とはいえ、集落より大きいと言えるほどではない。堂々たる栗の木々のただ中、急斜面を横切る段々に町が載っている。プロテスタントの礼拝堂は下の山の肩に、町の真ん中には、古い風変わりなカトリックの教会が立っている。"
    "translation_status": "reviewed"
  - "id": "td-346"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was here that poor Du Chayla, the Christian martyr, kept his library and held a court of missionaries; here he had built his tomb, thinking to lie among a grateful population whom he had redeemed from error; and hither on the morrow of his death they brought the body, pierced with two-and-fifty wounds, to be interred. Clad in his priestly robes, he was laid out in state in the church. The curé, taking his text from Second Samuel, twentieth chapter and twelfth verse, ‘And Amasa wallowed in his blood in the highway,’ preached a rousing sermon, and exhorted his brethren to die each at his post, like their unhappy and illustrious superior. In the midst of this eloquence there came a breeze that Spirit Séguier was near at hand; and behold! all the assembly took to their horses’ heels, some east, some west, and the curé himself as far as Alais."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[312]"
        "line_start": 2986
        "line_end": 2998
        "source_sequence": 2986
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3121
        "line_end": 3133
        "source_sequence": 3121
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[312]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3121-3133"
    "translation_ja": "哀れなキリスト教の殉教者デュ・シェイラはここに蔵書を置き、宣教師をまわりに集めた。考え違いから救った人々に感謝され、そのなかで眠るものと思って、ここに墓を造っていた。死の翌日、五十二か所を刺された遺体を、埋葬のためここへ運んだ。司祭の法衣を着せ、教会に荘重に安置された。教区司祭は『サムエル記下』第二十章十二節、「アマサは街道の上で血の中に転がっていた」を題に、奮い立たせる説教をして、不幸な名高い上長と同じく、各自の持ち場で死ねと同僚たちを励ました。その堂々たる弁舌のさなか、エスプリ・セギエがすぐ近くにいるとの噂が流れるや、見よ、会衆はみな馬に飛び乗って逃げ出し、ある者は東へ、ある者は西へ、教区司祭自身はアレまで逃げていった。"
    "translation_status": "reviewed"

    "translation_ja": "私は策を誤り、家族への情を訴えた。相手は司祭と軍人、家庭の温かな絆から、境遇によって引き離された部類の男二人だったのに。"
    "translation_status": "reviewed"
  - "id": "td-191"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Your father and mother?’ cried the priest. ‘Very well; you will convert them in their turn when you go home.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[172]"
        "line_start": 1638
        "line_end": 1639
        "source_sequence": 1638
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1650
        "line_end": 1651
        "source_sequence": 1650
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[172]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1650-1651"
    "translation_ja": "「ご父君とお母さまですか？」と司祭は叫んだ。「結構。帰ったら、今度はあなたがお二人を改宗させるのです」"
    "translation_status": "reviewed"
  - "id": "td-192"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I think I see my father’s face! I would rather tackle the Gaetulian lion in his den than embark on such an enterprise against the family theologian."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[173]"
        "line_start": 1640
        "line_end": 1642
        "source_sequence": 1640
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1653
        "line_end": 1655
        "source_sequence": 1653
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[173]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1653-1655"
    "translation_ja": "父の顔が目に浮かぶ。わが家の神学者を相手にそんな企てを始めるくらいなら、ゲトゥリアの獅子に巣穴で組みつくほうを選ぶ。"
    "translation_status": "reviewed"
  - "id": "td-193"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But now the hunt was up; priest and soldier were in full cry for my conversion; and the Work of the Propagation of the Faith, for which the people of Cheylard subscribed forty-eight francs ten centimes during 1877, was being gallantly pursued against myself. It was an odd but most effective proselytising. They never sought to convince me in argument, where I might have attempted some defence; but took it for granted that I was both ashamed and terrified at my position, and urged me solely on the point of time. Now, they said, when God had led me to Our Lady of the Snows, now was the appointed hour."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[174]"
        "line_start": 1643
        "line_end": 1651
        "source_sequence": 1643
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1657
        "line_end": 1665
        "source_sequence": 1657
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[174]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1657-1665"
    "translation_ja": "だが狩りはもう始まった。司祭と軍人は私を改宗させようと声をあげて追い立てる。シェラールの人々が一八七七年に四十八フラン十サンチームを献金したあの「信仰伝播事業」が、私を相手に勇ましく遂行されていた。妙だがきわめて効果のある改宗の迫り方だった。私がいくぶん防戦できるかもしれない、議論で説き伏せようとはしなかった。私が自分の立場を恥じ、恐れているのは当然として、もっぱら時期のことだけで詰め寄った。神が雪の聖母へ導いてくださった今こそ、定めの時なのだと言った。"
    "translation_status": "reviewed"
  - "id": "td-194"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Do not be withheld by false shame,’ observed the priest, for my encouragement."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[175]"
        "line_start": 1652
        "line_end": 1653
        "source_sequence": 1652
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1667
        "line_end": 1668
        "source_sequence": 1667
    "source_alignment":

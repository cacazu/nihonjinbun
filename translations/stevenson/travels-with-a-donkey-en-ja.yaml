      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-451-464"
    "translation_ja": "その苦闘の真っ最中、突然、荷がまたも地面に落ちた。魔法のように綱がいっせいにほどけ、愛すべき持ち物が道いっぱいに広がった。荷造りは初めからやり直し、そのうえ今までよりましなやり方を考えねばならず、確かに半時間は失った。草地と石ばかりの荒れ野に出るころには、いよいよ暗くなりかけていた。どこへでも同時に通じていそうな道だった。絶望に似た心地になりかけたところへ、石の上をゆうゆうとこちらへ歩いてくる二人の影が見えた。放浪者のように一列で進むが、その足の速さには目をみはった。先頭は息子で、背は高いが体つきは不格好、暗い顔でスコットランド人らしく見える。後ろの母親は日曜一番の晴れ着で、ボンネットに見事な刺繡のリボンを巻き、その上に新品のフェルト帽を載せた。ところがペチコートをたくし上げて大股に進みながら、猥褻で罰当たりな悪態をずらりと口に並べている。"
    "translation_status": "reviewed"
  - "id": "td-044"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I hailed the son, and asked him my direction. He pointed loosely west and north-west, muttered an inaudible comment, and, without slackening his pace for an instant, stalked on, as he was going, right athwart my path. The mother followed without so much as raising her head. I shouted and shouted after them, but they continued to scale the hillside, and turned a deaf ear to my outcries. At last, leaving Modestine by herself, I was constrained to run after them, hailing the while. They stopped as I drew near, the mother still cursing; and I could see she was a handsome, motherly, respectable-looking woman. The son once more answered me roughly and inaudibly, and was for setting out again. But this time I simply collared the mother, who was nearest me, and, apologising for my violence, declared that I could not let them go until they had put me on my road. They were neither of them offended—rather mollified than otherwise; told me I had only to follow them; and then the mother asked me what I wanted by the lake at such an hour. I replied, in the Scottish manner, by inquiring if she had far to go herself. She told me, with another oath, that she had an hour and a half’s road before her. And then, without salutation, the pair strode forward again up the hillside in the gathering dusk."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[38]"
        "line_start": 561
        "line_end": 580
        "source_sequence": 561
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 466
        "line_end": 484
        "source_sequence": 466
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[38]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-466-484"
    "translation_ja": "息子に声をかけ、道を尋ねた。西から北西のほうを大ざっぱに指し、聞き取れない答えをつぶやき、歩みを一瞬も緩めず、私の行く手を真っ直ぐ横切って、そのまま大股に進んでいった。母親は頭を上げることさえせず後につづいた。私は何度も叫んだが、二人は私の声など耳に入れず、坂を登りつづけた。ついにモデスティーヌを放って、声をかけながら走って追わずにはいられなかった。私が近づくと二人は止まった。母親はまだ悪態をついていたが、見ると器量よしでいかにも母親らしく、身なりも立派な女性だった。息子はまたもぶっきらぼうに聞き取れない返事をして、立ち去ろうとした。今度は、近くにいる母親の襟首をただつかまえ、乱暴を謝り、正しい道を教えてくれるまで行かせるわけにはいかない、と宣言した。二人とも気を悪くするどころか、むしろ態度が軟らかくなり、ついて来ればいいと言った。それから母親は、こんな時刻に湖に何の用があると聞いた。私はスコットランド風に、そちらも遠くまでお出かけですかと質問で返した。彼女はまた一つ悪態をつき、まだ一時間半は歩くと答えた。そうして挨拶もなく、二人は迫りくる夕闇の中、再び大股で坂を登っていった。"
    "translation_status": "reviewed"
  - "id": "td-045"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I returned for Modestine, pushed her briskly forward, and, after a sharp ascent of twenty minutes, reached the edge of a plateau. The view, looking back on my day’s journey, was both wild and sad. Mount Mézenc and the peaks beyond St. Julien stood out in trenchant gloom against a cold glitter in the east; and the intervening field of hills had fallen together into one broad wash of shadow, except here and there the outline of a wooded sugar-loaf in black, here and there a white irregular patch to represent a cultivated farm, and here and there a blot where the Loire, the Gazeille, or the Laussonne wandered in a gorge."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[39]"
        "line_start": 581
        "line_end": 590
        "source_sequence": 581
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 486
        "line_end": 494
        "source_sequence": 486
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[39]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-486-494"
    "translation_ja": "モデスティーヌを取りに戻り、勢いよく前に進ませ、二十分急な坂を登って台地の縁に着いた。一日の道のりを振り返ると、荒々しくも物悲しい眺めだった。メザンク山とサン・ジュリアンの向こうの峰々は、東の冷ややかな輝きを背に、暗い輪郭をくっきりと刻んでいた。あいだの丘陵は広く一面にぼかされた影に溶け込み、ところどころ、樹々におおわれた円錐形の丘が黒い輪郭を現し、耕した農地が不規則な白い斑点をつくり、ロワール、ガゼイユ、またはローソンヌの流れが峡谷を縫うところに黒いしみができていた。"
    "translation_status": "reviewed"
  - "id": "td-046"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Soon we were on a high-road, and surprise seized on my mind as I beheld a village of some magnitude close at hand; for I had been told that the neighbourhood of the lake was uninhabited except by trout. The road smoked in the twilight with children driving home cattle from the fields; and a pair of mounted stride-legged women, hat and cap and all, dashed past me at a hammering trot from the canton where they had been to church and market. I asked one of the children where I was. At Bouchet St. Nicolas, he told me. Thither, about a mile south of my destination, and on the other side of a respectable summit, had these confused roads and treacherous peasantry conducted me. My shoulder was cut, so that it hurt sharply; my arm ached like toothache from perpetual beating; I gave up the lake and my design to camp, and asked for the auberge."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

    "translation_ja": "ロゼールを越える"
    "translation_status": "reviewed"
  - "id": "td-233"
    "section_id": "across-the-lozere"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The track that I had followed in the evening soon died out, and I continued to follow over a bald turf ascent a row of stone pillars, such as had conducted me across the Goulet. It was already warm. I tied my jacket on the pack, and walked in my knitted waistcoat. Modestine herself was in high spirits, and broke of her own accord, for the first time in my experience, into a jolting trot that set the oats swashing in the pocket of my coat. The view, back upon the northern Gévaudan, extended with every step; scarce a tree, scarce a house, appeared upon the fields of wild hill that ran north, east, and west, all blue and gold in the haze and sunlight of the morning. A multitude of little birds kept sweeping and twittering about my path; they perched on the stone pillars, they pecked and strutted on the turf, and I saw them circle in volleys in the blue air, and show, from time to time, translucent flickering wings between the sun and me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"

        "line_start": 2578
        "line_end": 2582
        "source_sequence": 2578
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2675
        "line_end": 2679
        "source_sequence": 2675
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[270]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2675-2679"
    "translation_ja": "タルンの支流に沿うフロラックは郡庁のある町で、古城、プラタナスの並木、風変わりな街角が多く、丘の湧き水をたたえる泉がある。そのほか、美しい女たちで名高く、アレと並ぶカミザールの国の二つの都の一つとしても知られる。"
    "translation_status": "reviewed"
  - "id": "td-302"
    "section_id": "florac"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The landlord of the inn took me, after I had eaten, to an adjoining café, where I, or rather my journey, became the topic of the afternoon. Every one had some suggestion for my guidance; and the sub-prefectorial map was fetched from the sub-prefecture itself, and much thumbed among coffee-cups and glasses of liqueur. Most of these kind advisers were Protestant, though I observed that Protestant and Catholic intermingled in a very easy manner; and it surprised me to see what a lively memory still subsisted of the religious war. Among the hills of the south-west, by Mauchline, Cumnock, or Carsphairn, in isolated farms or in the manse, serious Presbyterian people still recall the days of the great persecution, and the graves of local martyrs are still piously regarded. But in towns and among the so-called better classes, I fear that these old doings have become an idle tale. If you met a mixed company in the King’s Arms at Wigton, it is not likely that the talk would run on Covenanters. Nay, at Muirkirk of Glenluce, I found the beadle’s wife had not so much as heard of Prophet Peden. But these Cévenols were proud of their ancestors in quite another sense; the war was their chosen topic; its exploits were their own patent of nobility; and where a man or a race has had but one adventure, and that heroic, we must expect and pardon some prolixity of reference. They told me the country was still full of legends hitherto uncollected; I heard from them about Cavalier’s descendants—not direct descendants, be it understood, but only cousins or nephews—who were still prosperous people in the scene of the boy-general’s exploits; and one farmer had seen the bones of old combatants dug up into the air of an afternoon in the nineteenth century, in a field where the ancestors had fought, and the great-grandchildren were peaceably ditching."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[271]"
        "line_start": 2583
        "line_end": 2610
        "source_sequence": 2583
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2681
        "line_end": 2707
        "source_sequence": 2681
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[271]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2681-2707"
    "translation_ja": "宿の主人は食事のあと、私を隣のカフェに連れて行った。そこで私、というより私の旅は午後の話題になった。誰でも道案内の提案を持っていて、郡庁の地図が郡庁そのものから取り寄せられ、コーヒー茶碗とリキュールのグラスの間でさかんにめくられた。親切な助言者は大半がプロテスタントだったが、プロテスタントとカトリックがごく気軽に交じるのも見た。宗教戦争の記憶が今なお生き生きと残っているのには驚いた。スコットランド南西部の丘、モクリン、カムノック、カーズフェアンの近くで、人里離れた農家や牧師館では、まじめな長老派の人は今も大迫害の日々をしのび、土地の殉教者の墓も敬虔に詣でられている。だが町で、いわゆる上流の人々の間では、あの昔の出来事ももはや退屈な昔話ではなかろうか。ウィグトンのキングズ・アームズで毛色の違う人が集まっても、盟約派の話にはなりそうもない。いや、ミュアカーク・オブ・グレンルースでは教会の世話役の妻でさえ、預言者ピーデンの話を聞いたこともなかった。ところがここのセヴェンヌ人は、まるで別の意味で祖先を誇った。戦争が好きな話題で、そこでの功績がみなの貴族の証なのだ。ある人や民族がただ一つだけ、しかも英雄的な冒険を経験したなら、それを長々と語るのは当然で、大目に見るべきだ。この土地にはまだ採集されない伝説がいくらもあると聞いた。カヴァリエの子孫、むろん直系ではなく、傍系のいとこや甥筋であるが、今もあの少年将軍の活躍した地で栄えていると聞いた。ある農民は、昔の戦士たちの骨が掘り起こされ、十九世紀の午後の空気に触れるのを見たという。祖先の戦った畑で、曾孫たちが平和に溝を掘っていたのだ。"
    "translation_status": "reviewed"
  - "id": "td-303"
    "section_id": "florac"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Later in the day one of the Protestant pastors was so good as to visit me: a young man, intelligent and polite, with whom I passed an hour or two in talk. Florac, he told me, is part Protestant, part Catholic; and the difference in religion is usually doubled by a difference in politics. You may judge of my surprise, coming as I did from such a babbling purgatorial Poland of a place as Monastier, when I learned that the population lived together on very quiet terms; and there was even an exchange of hospitalities between households thus doubly separated. Black Camisard and White Camisard, militiaman and Miquelet and dragoon, Protestant prophet and Catholic cadet of the White Cross, they had all been sabring and shooting, burning, pillaging, and murdering, their hearts hot with indignant passion; and here, after a hundred and seventy years, Protestant is still Protestant, Catholic still Catholic, in mutual toleration and mild amity of life. But the race of man, like that indomitable nature whence it sprang, has medicating virtues of its own; the years and seasons bring various harvests; the sun returns after the rain; and mankind outlives secular animosities, as a single man awakens from the passions of a day. We judge our ancestors from a more divine position; and the dust being a little laid with several centuries, we can see both sides adorned with human virtues and fighting with a show of right."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[272]"
        "line_start": 2611
        "line_end": 2631
        "source_sequence": 2611
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2709
        "line_end": 2729
        "source_sequence": 2709
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[272]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2709-2729"
    "translation_ja": "その日の遅くなってから、プロテスタントの牧師の一人が、親切に私を訪ねてきた。利発で礼儀正しい若者で、一、二時間語り合った。フロラックではプロテスタントとカトリックの双方がいて、宗教が違えばふつうは政治の立場も異なるという。煉獄のようにやかましいポーランドならぬモナスティエから来た私が、住民がなんの騒ぎもなく共に暮らし、二重に隔てられた家々が互いにもてなし合うことさえあると聞いて、どれほど驚いたか想像されたい。黒カミザールと白カミザール、民兵とミクレ兵と竜騎兵、プロテスタントの預言者、カトリック白十字団の士官候補。みな義憤の熱に胸を焦がし、刀を振り、撃ち、焼き、略奪し、人を殺した。それが百七十年たったここでは、プロテスタントは今もプロテスタント、カトリックはいまもカトリックのまま、相手を認め、穏やかな友誼のうちに暮らしている。人類には、そこから生まれ出た不屈の自然と同じく、みずからを癒やす力がある。年と季節はさまざまな収穫を運び、雨のあとには日が戻る。ひとりの人が一日の激情から目を覚ますように、人間も世紀をまたぐ憎しみを乗り越えて生きる。私たちは先祖を、もう少し神に近い位置から裁く。いく世紀かして埃が少しおさまると、どちらの側にも人の徳があり、いかにも道理があるように見えるもののために戦っていた、と分かる。"
    "translation_status": "reviewed"
  - "id": "td-304"
    "section_id": "florac"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I have never thought it easy to be just, and find it daily even harder than I thought. I own I met these Protestants with a delight and a sense of coming home. I was accustomed to speak their language, in another and deeper sense of the word than that which distinguishes between French and English; for the true Babel is a divergence upon morals. And hence I could hold more free communication with the Protestants, and judge them more justly, than the Catholics. Father Apollinaris may pair off with my mountain Plymouth Brother as two guileless and devout old men; yet I ask myself if I had as ready a feeling for the virtues of the Trappist; or, had I been a Catholic, if I should have felt so warmly to the dissenter of La Vernède. With the first I was on terms of mere forbearance; but with the other, although only on a misunderstanding and by keeping on selected points, it was still possible to hold converse and exchange some honest thoughts. In this world of imperfection we gladly welcome even partial intimacies. And if we find but one to whom we can speak out of our heart freely, with whom we can walk in love and simplicity without dissimulation, we have no ground of quarrel with the world or God."
    "source_languages":
      - "en"

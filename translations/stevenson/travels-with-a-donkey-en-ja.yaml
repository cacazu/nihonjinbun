        "original_unit_id": "/html/body/p[69]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-701-708"
    "translation_ja": "昨日はロワールを渡り、今度はアリエを渡る。のちに合流するこの二つの川は、まだ若いうちにはこれほど近い。ランゴーニュの橋のたもとで、降りそうで長らく降らなかった雨が落ちてきたとき、七つか八つの女の子が、お決まりの儀式のような言葉で尋ねた。「どっからおいででいらっしゃるの？」あまりにお高くとまっているので、私は吹き出してしまった。それが彼女の胸にこたえた。どうやら敬意を払ってもらって当然と思っている子で、黙ってむっとしたまま、橋を渡ってジェヴォーダンの地へ入る私を見送っていた。"
    "translation_status": "reviewed"

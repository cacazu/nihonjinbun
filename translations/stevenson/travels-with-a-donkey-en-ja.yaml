      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1068-1078"
    "translation_ja": "宿はここでも目をみはるほど飾り気がなかった。そう貧しくもない一家の持ち物が、寝台も揺り籠も服も皿立ても穀粉箱も、教区司祭の写真まで、みな台所にあった。子どもは五人で、着いてまもなくその一人が階段の下で朝の祈りをさせられた。ほどなく六人目も出てくるところだった。気のいい一家に親切に迎えられ、私の災難を興味深く聞いてくれた。眠った林は彼らの持ち物だった。フジラックの男は悪事の塊だと言い、ぜひとも法廷に呼び出すよう勧めた。「死んでいたかもしれないんだから」というわけだ。上に浮いたクリームをすくっていない牛乳を一パイント余り飲むのを見て、ここのおかみは肝をつぶした。"
    "translation_status": "reviewed"

    "kind": "paragraph"
    "origin": "source"
    "source_text": "But the priest had not forgotten the tenor of our talk. And suddenly, in the height of his fury, the old soldier found a warning look directed on his face; the absurdity of his behaviour was brought home to him in a flash; and the storm came to an abrupt end, without another word."
    "source_languages":

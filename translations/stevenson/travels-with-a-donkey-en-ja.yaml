    "translation_ja": "「ところで」と私は言った。「ご主人はどちらに？」"
    "translation_status": "reviewed"
  - "id": "td-070"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘The master of the house is upstairs,’ she answered, ‘making you a goad.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

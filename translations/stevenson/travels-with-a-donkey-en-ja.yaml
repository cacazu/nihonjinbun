  - "id": "td-179"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had dined alone, because I arrived late; but at supper I found two other guests. One was a country parish priest, who had walked over that morning from the seat of his cure near Mende to enjoy four days of solitude and prayer. He was a grenadier in person, with the hale colour and circular wrinkles of a peasant; and as he complained much of how he had been impeded by his skirts upon the march, I have a vivid fancy portrait of him, striding along, upright, big-boned, with kilted cassock, through the bleak hills of Gévaudan. The other was a short, grizzling, thick-set man, from forty-five to fifty, dressed in tweed with a knitted spencer, and the red ribbon of a decoration in his button-hole. This last was a hard person to classify. He was an old soldier, who had seen service and risen to the rank of commandant; and he retained some of the brisk decisive manners of the camp. On the other hand, as soon as his resignation was accepted, he had come to Our Lady of the Snows as a boarder, and, after a brief experience of its ways, had decided to remain as a novice. Already the new life was beginning to modify his appearance; already he had acquired somewhat of the quiet and smiling air of the brethren; and he was as yet neither an officer nor a Trappist, but partook of the character of each. And certainly here was a man in an interesting nick of life. Out of the noise of cannon and trumpets, he was in the act of passing into this still country bordering on the grave, where men sleep nightly in their grave-clothes, and, like phantoms, communicate by signs."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

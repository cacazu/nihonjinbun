    "translation_ja": "「こんなのは思いつきもしなかったな」と彼は言い、手に取って重さをはかりながら言葉を継いだ。「五フランは下らない。賭けてもいい」"
    "translation_status": "reviewed"
  - "id": "td-053"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"

    "translation_ja": "「あなたは」と私は、めいっぱい威厳をこめて言った。「臆病者だ」"
    "translation_status": "reviewed"
  - "id": "td-114"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And with that I turned my back upon the family party, who hastened to retire within their fortifications; and the famous door was closed again, but not till I had overheard the sound of laughter. Filia barbara pater barbarior. Let me say it in the plural: the Beasts of Gévaudan."
    "source_languages":
      - "en"
      - "la"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"

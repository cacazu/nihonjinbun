    "translation_ja": "次はどこへ行くのか、夕飯には何を食べたのかと尋ね、それから何のつながりもなく、「結構」とつけ加えた。「そら、行くぞ」。そうして息子と一緒に、それ以上何も言わず、二本先の栗の木へ向かい、その枝を払いはじめた。事は望んだよりあっさりとすんだ。重々しい、立派な人で、無愛想な声も、相手を犯罪者と思ったからでなく、ただ目下の者と思ったためだ。"

        "original_unit_id": "/html/body/p[260]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2567-2569"
    "translation_ja": "「ご老人」と私は言った。「誰が主を知るかは、簡単に言えることではありません。それに私たちの知ったことではない。プロテスタントもカトリックも、石を拝む人でさえ、主を知り、主に知られることはあります。みな主がお造りになったのですから」"
    "translation_status": "reviewed"
  - "id": "td-291"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I did not know I was so good a preacher."

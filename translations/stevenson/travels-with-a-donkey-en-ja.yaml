  - "id": "td-145"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At a place called La Bastide I was directed to leave the river, and follow a road that mounted on the left among the hills of Vivarais, the modern Ardèche; for I was now come within a little way of my strange destination, the Trappist monastery of Our Lady of the Snows. The sun came out as I left the shelter of a pine-wood, and I beheld suddenly a fine wild landscape to the south. High rocky hills, as blue as sapphire, closed the view, and between these lay ridge upon ridge, heathery, craggy, the sun glittering on veins of rock, the underwood clambering in the hollows, as rude as God made them at the first. There was not a sign of man’s hand in all the prospect; and indeed not a trace of his passage, save where generation after generation had walked in twisted footpaths, in and out among the beeches, and up and down upon the channelled slopes. The mists, which had hitherto beset me, were now broken into clouds, and fled swiftly and shone brightly in the sun. I drew a long breath. It was grateful to come, after so long, upon a scene of some attraction for the human heart. I own I like definite form in what my eyes are to rest upon; and if landscapes were sold, like the sheets of characters of my boyhood, one penny plain and twopence coloured, I should go the length of twopence every day of my life."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[129]"
        "line_start": 1236
        "line_end": 1255
        "source_sequence": 1236
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1214
        "line_end": 1232
        "source_sequence": 1214
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[129]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1214-1232"
    "translation_ja": "ラ・バスティードというところで、川を離れ、ヴィヴァレ、現在のアルデシュの丘へ左に上っていく道を取れと教わった。私の変わった行き先、トラピスト会の雪の聖母修道院に、もうかなり近づいていたのだ。松林の日陰を出ると日が射してきて、突然、南にすばらしく荒々しい景色がひらけた。サファイアのように青い、岩がちの高い丘が眺めの果てを囲い、その間にいく重もの尾根が重なる。ヒースが茂り、険しい岩肌から岩脈が陽にぎらつき、窪地には低木がよじ登る。神が初めに造ったときのままの粗削りの姿であった。目に入る限り人の手の跡はなく、人が通った跡とて、いく代もいく代も、ブナの間を縫い、雨に刻まれた斜面を上り下りした曲がりくねる踏み分け道のほかはなかった。ここまでつきまとった靄はちぎれて雲となり、速く流れて陽に明るく輝いた。大きく息をついた。長いことを経て、ようやく多少とも人の心を惹きつける景色に出会えたのがありがたかった。白状すると、目を留めるものにはっきりした形があるのが好きだ。もし風景が少年時代の芝居絵のように、色なし一ペニー、色つき二ペンスで売られていたなら、毎日惜しまず二ペンスを出すところだ。"
    "translation_status": "reviewed"
  - "id": "td-146"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But if things had grown better to the south, it was still desolate and inclement near at hand. A spidery cross on every hill-top marked the neighbourhood of a religious house; and a quarter of a mile beyond, the outlook southward opening out and growing bolder with every step, a white statue of the Virgin at the corner of a young plantation directed the traveller to Our Lady of the Snows. Here, then, I struck leftward, and pursued my way, driving my secular donkey before me, and creaking in my secular boots and gaiters, towards the asylum of silence."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[130]"
        "line_start": 1256
        "line_end": 1264
        "source_sequence": 1256
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1234
        "line_end": 1241
        "source_sequence": 1234
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[130]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1234-1241"
    "translation_ja": "南の眺めはよくなったが、すぐ近くはまだ荒涼として厳しかった。細い脚を張り出したような十字架が丘の頂に一つずつ立ち、修道院が近いことを知らせていた。その先四分の一マイル、南への見晴らしが一歩ごとにひらけ、いよいよ堂々としてくるところで、新しく植えた林の角の白い聖母像が、旅人に雪の聖母のありかを示した。そこで私は左に折れ、この世俗のロバを前に追い、この世俗の靴と脚絆をきしませながら、沈黙の庵に向かって行った。"
    "translation_status": "reviewed"
  - "id": "td-147"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had not gone very far ere the wind brought to me the clanging of a bell, and somehow, I can scarce tell why, my heart sank within me at the sound. I have rarely approached anything with more unaffected terror than the monastery of Our Lady of the Snows. This it is to have had a Protestant education. And suddenly, on turning a corner, fear took hold on me from head to foot—slavish, superstitious fear; and though I did not stop in my advance, yet I went on slowly, like a man who should have passed a bourne unnoticed, and strayed into the country of the dead. For there, upon the narrow new-made road, between the stripling pines, was a mediaeval friar, fighting with a barrowful of turfs. Every Sunday of my childhood I used to study the Hermits of Marco Sadeler—enchanting prints, full of wood and field and mediaeval landscapes, as large as a county, for the imagination to go a-travelling in; and here, sure enough, was one of Marco Sadeler’s heroes. He was robed in white like any spectre, and the hood falling back, in the instancy of his contention with the barrow, disclosed a pate as bald and yellow as a skull. He might have been buried any time these thousand years, and all the lively parts of him resolved into earth and broken up with the farmer’s harrow."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[131]"
        "line_start": 1265
        "line_end": 1283
        "source_sequence": 1265
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1243
        "line_end": 1260
        "source_sequence": 1243
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[131]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1243-1260"
    "translation_ja": "さほど行かぬうち、鐘の音が風に乗って届いた。どういうものか、私にもよく分からないが、その音に心が沈んだ。雪の聖母修道院ほど、掛け値なしの恐ろしさを感じて近づいたものは滅多にない。プロテスタントの教育を受けるとこうなるのだ。角を曲がったとたん、恐怖に頭のてっぺんから足の先まで取りつかれた。卑屈な、迷信じみた恐怖である。歩くのをやめたわけではないが、知らないうちに境を越えて死者の国に迷いこんだ者のように、足はのろくなった。というのも、若い松の間の、できたばかりの細い道で、中世の修道士が一輪車いっぱいの芝土と格闘していたのだ。子どものころは日曜ごとに、マルコ・サデレルの『隠修士たち』を飽かず眺めた。心を奪う版画で、木々や野や中世の景色に満ち、想像力が旅をするには一地方まるごとの広さがあった。そこにまさしく、サデレルの主人公の一人がいた。どんな幽霊にも負けない白衣をまとい、一輪車との格闘に身を乗り出す拍子に頭巾がずり落ち、されこうべのように禿げて黄色い頭が現れた。この千年のどの時代に葬られていてもおかしくない。体の生きた部分はすべて土に還って、とうに農夫の馬鍬で砕かれていたとしてもだ。"
    "translation_status": "reviewed"
  - "id": "td-148"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was troubled besides in my mind as to etiquette. Durst I address a person who was under a vow of silence? Clearly not. But drawing near, I doffed my cap to him with a far-away superstitious reverence. He nodded back, and cheerfully addressed me. Was I going to the monastery? Who was I? An Englishman? Ah, an Irishman, then?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[132]"
        "line_start": 1284
        "line_end": 1289
        "source_sequence": 1284
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1262
        "line_end": 1266
        "source_sequence": 1262
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[132]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1262-1266"
    "translation_ja": "そのうえ礼儀作法が気がかりだった。沈黙を誓った人に声をかけてよいものだろうか。もちろんいけない。だが近寄ると、よそよそしい迷信的な畏敬の念で帽子を取った。向こうはうなずき、朗らかに話しかけてきた。修道院へ行くのか。私は何者か。イングランド人か。ああ、それじゃアイルランド人か。"
    "translation_status": "reviewed"
  - "id": "td-149"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘No,’ I said, ‘a Scotsman.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[133]"
        "line_start": 1290
        "line_end": 1290
        "source_sequence": 1290
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1268
        "line_end": 1268
        "source_sequence": 1268
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[133]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1268-1268"
    "translation_ja": "「いいえ」と私は言った。「スコットランド人です」"
    "translation_status": "reviewed"
  - "id": "td-150"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A Scotsman? Ah, he had never seen a Scotsman before. And he looked me all over, his good, honest, brawny countenance shining with interest, as a boy might look upon a lion or an alligator. From him I learned with disgust that I could not be received at Our Lady of the Snows; I might get a meal, perhaps, but that was all. And then, as our talk ran on, and it turned out that I was not a pedlar, but a literary man, who drew landscapes and was going to write a book, he changed his manner of thinking as to my reception (for I fear they respect persons even in a Trappist monastery), and told me I must be sure to ask for the Father Prior, and state my case to him in full. On second thoughts he determined to go down with me himself; he thought he could manage for me better. Might he say that I was a geographer?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[134]"
        "line_start": 1291
        "line_end": 1302
        "source_sequence": 1291
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1270
        "line_end": 1281
        "source_sequence": 1270
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[134]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1270-1281"
    "translation_ja": "スコットランド人か。ああ、いままで見たことがない。そこで、少年がライオンやワニでも見るように、興味で輝く善良な、正直そうな、たくましい顔をして、私の全身をまじまじと眺めた。雪の聖母修道院には泊めてもらえないと聞き、私はがっかりした。食事なら出るかもしれないが、それだけだという。ところが話を続けるうち、私が行商人でなく、風景を描き本を書こうとする文筆家と分かると、受け入れについて考えが変わった（トラピスト会の修道院でも、どうやら人の肩書は気にするらしい）。必ず副院長を呼んでもらい、事情を全部お話しなさいと言った。考え直して、本人が私とそこまで下りることにした。そのほうがうまく取りはからえると思ったらしい。私を地理学者と言ってもいいか、と聞いた。"
    "translation_status": "reviewed"
  - "id": "td-151"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "No; I thought, in the interests of truth, he positively might not."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[135]"
        "line_start": 1303
        "line_end": 1303
        "source_sequence": 1303
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1283
        "line_end": 1283
        "source_sequence": 1283
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[135]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1283-1283"
    "translation_ja": "いや、真実のためにも、けっしてそう言ってはいけないと思う、と答えた。"
    "translation_status": "reviewed"
  - "id": "td-152"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Very well, then’ (with disappointment), ‘an author.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[136]"

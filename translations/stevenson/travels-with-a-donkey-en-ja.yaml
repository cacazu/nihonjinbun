    "translation_ja": "「いや」と男はわずかに身を引き、前に使った言葉をまた盾にして叫んだ。「戸口から外へは出ませんよ」"
    "translation_status": "reviewed"
  - "id": "td-110"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I looked at him. I saw unaffected terror struggling on his face with unaffected shame; he was smiling pitifully and wetting his lip with his tongue, like a detected schoolboy. I drew a brief picture of my state, and asked him what I was to do."
    "source_languages":
      - "en"
    "source_locations":

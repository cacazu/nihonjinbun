        "original_unit_id": "/html/body/p[27]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-312-319"
    "translation_ja": "この思いがけぬ救いの神は、別れの前に、非情だがじつに有益な助言を授け、私の杖よりずっと身にこたえるという小枝をくれ、最後にロバ使いの本物の掛け声、仲間内だけの合言葉を教えてくれた。「プルート！」そのあいだじゅう、信じがたいといった滑稽な顔で私を眺めるので、こちらは目を合わせるのもきまり悪かった。私のロバの扱いににやにやするのだが、私だって彼の綴りや緑の燕尾服を見れば、にやにやしたかもしれない。ただこのときは、私の番ではなかった。"

      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2060-2102"
    "translation_ja": "ロゼールはほぼ東西に横たわり、ジェヴォーダンを大小二つに分けている。その最高点が、いま立つフィニエルの峰で、海抜五千六百フィートを超え、晴れた日には下ラングドックの全土を地中海まで見渡せる。フィニエルの峰からモンペリエやセットの沖を走る白い船を見たと、言い張る人か本当に信じている人と、話したことがある。背後は通ってきた北部の高地で、鈍重な人々が住み、森がなく、雄大な山の姿もろくになく、昔名高かったものといえばほぼ狼だけだ。だが目の前に、日を透かす霞を半ばかぶって、新しいジェヴォーダンが横たわる。ゆたかで絵になり、心を揺さぶる出来事で名高い土地である。広い意味では、モナスティエでも、その後の旅のあいだずっと、私はセヴェンヌにいた。だが地元には厳密な意味があり、その名に本当に値するのは、この足もとの入り組んだ草木の茂る土地だけで、農民はその意味で言葉を使う。力をこめて言うところのセヴェンヌ、セヴェンヌの中のセヴェンヌがここなのだ。読み解きようもない丘の迷路で、一方は大王とその全軍、元帥たち、もう一方は数千のプロテスタントの山の民で、山賊同士さながらの、猛獣同士さながらの戦が二年も荒れ狂った。百八十年前、カミザールは、私の立つロゼールにも一つの拠点を持っていた。組織、武器庫、軍と宗教それぞれの序列があった。その動向はロンドンの「どこのコーヒーハウスでも話の種」で、イングランドは援助に艦隊を送った。指導者たちは預言し、人を殺した。旗を掲げ、太鼓を打ち鳴らし、古フランス語の詩篇を歌って、ときには物ともしないように白昼に姿を現し、城壁のある町の前を行軍し、王の将軍たちを蹴散らした。ときには夜陰にまぎれ、あるいは変装して堅固な城を奪い、味方の裏切りにも敵の残忍さにも復讐した。そこには百八十年前、騎士道を重んじるロランがいた。「フランスのプロテスタントの総司令官、ロラン伯爵閣下」。重々しく寡黙で、威圧的な、あばたのある元竜騎兵で、一人の婦人が恋ゆえに、さすらいの彼につき従った。カヴァリエもいた。パン屋の徒弟で、戦いの天分があり、十七歳でカミザールの旅団長に選ばれ、五十五歳で英国のジャージー島総督として死んだ。また、大ぶりのかつらをかぶり、神学論争を好む遊撃隊長カスタネもいた。不思議な将軍たちだ。ひとり離れて万軍の神に助言を求め、霊が胸にささやくとおりに退いたり、戦いを挑んだり、見張りを立てたり、無防備な陣で眠ったりした。そしてこうした指導者のもとには、預言者と弟子の兵卒の列があった。勇気と忍耐があり、飽くことなく、山を駆けられる頑健さで、詩篇によって荒涼とした生活を励まし、戦うにも祈るにも熱心だった。心を病んだ子どもたちの託宣に恭しく耳を傾け、マスケット銃に込める錫合金の弾丸に、神秘の思いから小麦を一粒混ぜた。"
    "translation_status": "reviewed"
  - "id": "td-237"
    "section_id": "across-the-lozere"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had travelled hitherto through a dull district, and in the track of nothing more notable than the child-eating beast of Gévaudan, the Napoleon Bonaparte of wolves. But now I was to go down into the scene of a romantic chapter—or, better, a romantic footnote in the history of the world. What was left of all this bygone dust and heroism? I was told that Protestantism still survived in this head seat of Protestant resistance; so much the priest himself had told me in the monastery parlour. But I had yet to learn if it were a bare survival, or a lively and generous tradition. Again, if in the northern Cevennes the people are narrow in religious judgments, and more filled with zeal than charity, what was I to look for in this land of persecution and reprisal—in a land where the tyranny of the Church produced the Camisard rebellion, and the terror of the Camisards threw the Catholic peasantry into legalised revolt upon the other side, so that Camisard and Florentin skulked for each other’s lives among the mountains?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[209]"
        "line_start": 2052
        "line_end": 2067
        "source_sequence": 2052
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2104

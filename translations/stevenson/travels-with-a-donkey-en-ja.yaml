  - "id": "td-325"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘There are the wolves,’ said he; ‘and then it is known you are an Englishman. The English have always long purses, and it might very well enter into some one’s head to deal you an ill blow some night.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

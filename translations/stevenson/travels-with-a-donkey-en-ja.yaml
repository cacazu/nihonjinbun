        "original_unit_id": "/html/body/p[224]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2331-2339"
    "translation_ja": "それにしても、詩篇の伴奏で演じられた荒々しい一夜の仕業である。タルンのあの町では、詩篇にはいつも何か脅迫めいた響きがあるかと思える。だがカミザールの退去で物語は終わらない。ポン・ド・モンヴェールに限っても、まだつづきはある。セギエの活動期間は短く、血なまぐさかった。別に二人の司祭、ラドヴェーズでは父親から召使にいたる一家全員が、彼自身の手か命令で倒れた。自由だったのは一日か二日、しかもずっと兵隊に動きを抑えられていたのにである。最後は、名のある傭兵隊長プールに捕らえられたが、裁く者たちの前に、平然と姿を現した。"
    "translation_status": "reviewed"

        "original_unit_id": "/html/body/p[42]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-528-533"
    "translation_ja": "だが宿の人々は十軒に九軒まで親切で気が利く。戸口をまたげばたちまちよそ者ではなくなる。街道では無愛想で近寄りがたい百姓たちが、炉端を共にすると、感じのよい物腰を少しばかり見せる。たとえばブシェで、ボージョレの瓶を開けて主人にどうかと勧めると、ほんの少ししか取ろうとしなかった。"
    "translation_status": "reviewed"
  - "id": "td-050"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘I am an amateur of such wine, do you see?’ he said, ‘and I am capable of leaving you not enough.’"

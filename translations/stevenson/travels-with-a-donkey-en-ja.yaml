      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2625-2642"
    "translation_ja": "ラ・ヴェルネードから下流の谷は、進むにつれて、ますます気に入った。むき出しの崩れそうな丘が両側から迫り、断崖で川を閉じこめるかと思えば、谷が広がり緑になる。急坂のミラルの古城を過ぎ、胸壁をもつ、とうの昔に解体され教会と牧師館に変わった修道院を過ぎ、黒い屋根の塊、コキュレス村のそばを通った。村は葡萄畑と牧草地、赤い林檎をたわわにつけた果樹園に囲まれ、街道沿いでは道端の木から胡桃を叩き落とし、袋や籠に集めていた。谷がどんなに開けようと、丘はなお高くむき出しで、断崖の胸壁があり、ときどき尖った頂がある。タルンはまだ石の間をがらがら、山の音を立てていた。風景の絵になるところに目の利く旅回りの商人たちの話で、バイロン好みのおどろおどろしい国を予想していた。だが私のスコットランド人の目には、ほほえましく豊かな土地と見え、私のスコットランド人の体には、天気も真夏のように思えた。もっとも栗の木にはすでに秋の彩りがつき、このあたりから混じりはじめたポプラは、近づく冬を前に淡い金色に変わっていた。"
    "translation_status": "reviewed"
  - "id": "td-297"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was something in this landscape, smiling although wild, that explained to me the spirit of the Southern Covenanters. Those who took to the hills for conscience’ sake in Scotland had all gloomy and bedevilled thoughts; for once that they received God’s comfort they would be twice engaged with Satan; but the Camisards had only bright and supporting visions. They dealt much more in blood, both given and taken; yet I find no obsession of the Evil One in their records. With a light conscience, they pursued their life in these rough times and circumstances. The soul of Séguier, let us not forget, was like a garden. They knew they were on God’s side, with a knowledge that has no parallel among the Scots; for the Scots, although they might be certain of the cause, could never rest confident of the person."
    "source_languages":
      - "en"
    "source_locations":

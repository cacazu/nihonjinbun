    "origin": "source"
    "source_text": "Next morning (Thursday, 26th September) I took the road in a new order. The sack was no longer doubled, but hung at full length across the saddle, a green sausage six feet long with a tuft of blue wool hanging out of either end. It was more picturesque, it spared the donkey, and, as I began to see, it would ensure stability, blow high, blow low. But it was not without a pang that I had so decided. For although I had purchased a new cord, and made all as fast as I was able, I was yet jealously uneasy lest the flaps should tumble out and scatter my effects along the line of march."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[127]"
        "line_start": 1213
        "line_end": 1221
        "source_sequence": 1213
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1190
        "line_end": 1198
        "source_sequence": 1190
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[127]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1190-1198"
    "translation_ja": "翌朝、九月二十六日の木曜は、荷のやり方を改めて出発した。寝袋はもう二つ折りにせず、端から端までいっぱいに伸ばして鞍に渡した。長さ六フィートの緑の腸詰めで、両端から青い羊の毛の房がはみ出している。そのほうが絵になるし、ロバも楽で、どうやら風が強かろうと弱かろうと荷が安定する。ただ、こう決めるには未練もあった。新しい綱を買ってできる限りしっかり締めたものの、折り返しがまくれ、行進の道すじに持ち物がばらまかれはしないかと、用心するあまり落ち着かなかったからだ。"
    "translation_status": "reviewed"
  - "id": "td-144"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "My way lay up the bald valley of the river, along the march of Vivarais and Gévaudan. The hills of Gévaudan on the right were a little more naked, if anything, than those of Vivarais upon the left, and the former had a monopoly of a low dotty underwood that grew thickly in the gorges and died out in solitary burrs upon the shoulders and the summits. Black bricks of fir-wood were plastered here and there upon both sides, and here and there were cultivated fields. A railway ran beside the river; the only bit of railway in Gévaudan, although there are many proposals afoot and surveys being made, and even, as they tell me, a station standing ready built in Mende. A year or two hence and this may be another world. The desert is beleaguered. Now may some Languedocian Wordsworth turn the sonnet into patois: ‘Mountains and vales and floods, heard YE that whistle?’"
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[128]"
        "line_start": 1222
        "line_end": 1235
        "source_sequence": 1222
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1200
        "line_end": 1212
        "source_sequence": 1200
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[128]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1200-1212"
    "translation_ja": "行く道は川に沿って、ヴィヴァレとジェヴォーダンの境の、丸裸の谷を上っていた。右のジェヴォーダンの丘は、左のヴィヴァレのものに比べれば若干むき出しだった。そのくせ低い、点を打ったような藪は右手にしかなく、谷あいでは密生し、山の肩や頂ではいがのようにまばらになって消えた。黒い煉瓦のようなモミ林が両側にところどころ貼りつき、ところどころに耕した畑がある。川の横を鉄道が走っていた。ジェヴォーダンで唯一の鉄道区間で、計画は数多く持ち上がり測量も進み、マンドには建てて出番を待つばかりの駅さえあると聞く。一、二年先には別世界になっているかもしれない。荒野は包囲されている。ラングドックのワーズワースが出て、あのソネットを土地言葉に直すがよい。「山々よ、谷よ、奔流よ、あの汽笛を聞いたか、おまえたち？」"
    "translation_status": "reviewed"

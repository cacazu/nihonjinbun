    "translation_ja": "亭主は若いころ騾馬追いをしていて、モデスティーヌに荷を載せる段になると、商売で身につけた分別を大いに発揮した。「この荷の形は替えなきゃ」と言った。「二つに分ければよい。そうすりゃ重さを倍にできますよ」"

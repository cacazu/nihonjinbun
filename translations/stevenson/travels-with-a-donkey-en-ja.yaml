        "original_unit_id": "line-1560-1573"
    "translation_ja": "だが私の雪の聖母滞在には、別の面もあった。この季節も遅くなっては寄宿者は多くなかったが、修道院の一般客の区画には、私一人だけではなかった。その区画は門のすぐ近くで、一階には小さい食堂が一つ、上の廊下に沿って私のところと同じような小部屋がずらりと並ぶ。ばかなことに、正式な黙想客の宿代は忘れてしまったが、一日三フランから五フランの間で、たぶん三フランだったと思う。私のようにふらりと来た者は、意のままの額を志として捧げればよく、何も要求されなかった。帰りぎわ、二十フランを出すと、あまりに多いとミカエル神父が断ったことは書いておこう。なぜその額を差し出すのか説明しても、妙な名誉心から、直接は受け取らなかった。「修道院に代わって断る権利はありません」と説明した。「でも、できれば修道士の誰かに渡していただきたいのです」"
    "translation_status": "reviewed"

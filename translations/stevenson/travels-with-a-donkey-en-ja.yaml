      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-535-536"
    "translation_ja": "「こういうワインには目がないもんでね」と言う。「お客さんの分まで飲んじまいかねません」"
    "translation_status": "reviewed"
  - "id": "td-051"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In these hedge-inns the traveller is expected to eat with his own knife; unless he ask, no other will be supplied: with a glass, a whang of bread, and an iron fork, the table is completely laid. My knife was cordially admired by the landlord of Bouchet, and the spring filled him with wonder."
    "source_languages":
      - "en"
    "source_locations":

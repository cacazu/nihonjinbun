        "source_sequence": 1425
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[149]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1425-1431"
    "translation_ja": "こうしてあちらこちらと歩き回るうち、沈黙のうちにある神父や修道士に何度も出会った。たいていは雲が通り過ぎたほどにも気にしなかった。だがときに例の助祭が何か許可を求めねばならず、向こうは両手を、犬が泳ぐときの前足に似た独特な動きで許したり、ごく普通の否定の合図で断ったりした。どちらにしても伏し目がちで、もう少しで悪事を犯しそうになっている人のように、どこか悔い改める様子があった。"
    "translation_status": "reviewed"
  - "id": "td-167"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The monks, by special grace of their Abbot, were still taking two meals a day; but it was already time for their grand fast, which begins somewhere in September and lasts till Easter, and during which they eat but once in the twenty-four hours, and that at two in the afternoon, twelve hours after they have begun the toil and vigil of the day. Their meals are scanty, but even of these they eat sparingly; and though each is allowed a small carafe of wine, many refrain from this indulgence. Without doubt, the most of mankind grossly overeat themselves; our meals serve not only for support, but as a hearty and natural diversion from the labour of life. Yet, though excess may be hurtful, I should have thought this Trappist regimen defective. And I am astonished, as I look back, at the freshness of face and cheerfulness of manner of all whom I beheld. A happier nor a healthier company I should scarce suppose that I have ever seen. As a matter of fact, on this bleak upland, and with the incessant occupation of the monks, life is of an uncertain tenure, and death no infrequent visitor, at Our Lady of the Snows. This, at least, was what was told me. But if they die easily, they must live healthily in the meantime, for they seemed all firm of flesh and high in colour; and the only morbid sign that I could observe, an unusual brilliancy of eye, was one that served rather to increase the general impression of vivacity and strength."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

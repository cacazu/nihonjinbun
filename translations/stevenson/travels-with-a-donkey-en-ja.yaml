    "translation_ja": "「私たちは飛んだ」と年老いたカミザールの一人が言う。「詩篇をうたうのが聞こえると、翼でも生えたように飛んだ。生き生きと燃える熱意、われを忘れるほどの望みを胸に感じた。言葉では言い表せない気持ちだ。身をもって経験しなければ分からない。どれほど疲れていても、疲れのことはもう思わず、詩篇が耳に入るとすぐ、体が軽くなった」"
    "translation_status": "reviewed"
  - "id": "td-299"

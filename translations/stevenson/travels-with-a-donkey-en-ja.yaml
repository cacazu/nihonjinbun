  - "id": "td-315"
    "section_id": "in-the-valley-of-the-mimente"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He made no shame of it! The phrase is a piece of natural statistics; for it is the language of one in a minority. I thought with a smile of Bavile and his dragoons, and how you may ride rough-shod over a religion for a century, and leave it only the more lively for the friction. Ireland is still Catholic; the Cevennes still Protestant. It is not a basketful of law-papers, nor the hoofs and pistol-butts of a regiment of horse, that can change one tittle of a ploughman’s thoughts. Outdoor rustic people have not many ideas, but such as they have are hardy plants, and thrive flourishingly in persecution. One who has grown a long while in the sweat of laborious noons, and under the stars at night, a frequenter of hills and forests, an old honest countryman, has, in the end, a sense of communion with the powers of the universe, and amicable relations towards his God. Like my mountain Plymouth Brother, he knows the Lord. His religion does not repose upon a choice of logic; it is the poetry of the man’s experience, the philosophy of the history of his life. God, like a great power, like a great shining sun, has appeared to this simple fellow in the course of years, and become the ground and essence of his least reflections; and you may change creeds and dogmas by authority, or proclaim a new religion with the sound of trumpets, if you will; but here is a man who has his own thoughts, and will stubbornly adhere to them in good and evil. He is a Catholic, a Protestant, or a Plymouth Brother, in the same indefeasible sense that a man is not a woman, or a woman not a man. For he could not vary from his faith, unless he could eradicate all memory of the past, and, in a strict and not a conventional meaning, change his mind."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

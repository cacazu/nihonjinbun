    "source_text": "‘Hear that!’ he cried. ‘And I have seen a marquis here, a marquis, a marquis’—he repeated the holy word three times over—‘and other persons high in society; and generals. And here, at your side, is this gentleman, who has been so many years in armies—decorated, an old warrior. And here he is, ready to dedicate himself to God.’"

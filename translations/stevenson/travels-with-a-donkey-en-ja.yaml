        "line_start": 623
        "line_end": 623
        "source_sequence": 623
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[63]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-623-623"
    "translation_ja": "「主人は二階ですよ」と答えが来た。「お客さんの突き棒を作っています」"
    "translation_status": "reviewed"
  - "id": "td-071"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Blessed be the man who invented goads! Blessed the innkeeper of Bouchet St. Nicolas, who introduced me to their use! This plain wand, with an eighth of an inch of pin, was indeed a sceptre when he put it in my hands. Thenceforward Modestine was my slave. A prick, and she passed the most inviting stable door. A prick, and she broke forth into a gallant little trotlet that devoured the miles. It was not a remarkable speed, when all was said; and we took four hours to cover ten miles at the best of it. But what a heavenly change since yesterday! No more wielding of the ugly cudgel; no more flailing with an aching arm; no more broadsword exercise, but a discreet and gentlemanly fence. And what although now and then a drop of blood should appear on Modestine’s mouse-coloured wedge-like rump? I should have preferred it otherwise, indeed; but yesterday’s exploits had purged my heart of all humanity. The perverse little devil, since she would not be taken with kindness, must even go with pricking."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[64]"
        "line_start": 700
        "line_end": 715
        "source_sequence": 700
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 625
        "line_end": 639
        "source_sequence": 625
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[64]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-625-639"
    "translation_ja": "突き棒を発明した人に祝福あれ。使い方を教えてくれたブシェ・サン・ニコラの宿の主人に祝福あれ。このなんの変哲もない棒は、先に八分の一インチ針を出しただけで、私の手に渡るや王笏となった。それからというものモデスティーヌは私の奴隷だった。ちくりとやれば、どれほど招き入れたそうな厩の戸口も通りすぎる。ちくりとやれば、勇ましく小走りになり、何マイルもの道をむさぼるように行く。それでも、ものすごい速さというわけではなく、速いときでも十マイルに四時間かかった。だが昨日と比べたらなんという天国だろう。無様な棍棒を振るう必要も、痛む腕で打ちつづける必要もない。もう大剣の稽古ではなく、控えめで紳士的なフェンシングである。それでモデスティーヌの鼠色の楔形の尻に、ときおり血が一滴にじんだとしても、どうだというのか。もちろん血など出ないほうがよかった。だが昨日の奮闘で、私の胸から人の情けはすっかり抜けていた。つむじ曲がりの小悪魔が、親切では動かないのなら、ちくりとやられて行くしかあるまい。"
    "translation_status": "reviewed"
  - "id": "td-072"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was bleak and bitter cold, and, except a cavalcade of stride-legged ladies and a pair of post-runners, the road was dead solitary all the way to Pradelles. I scarce remember an incident but one. A handsome foal with a bell about his neck came charging up to us upon a stretch of common, sniffed the air martially as one about to do great deeds, and suddenly thinking otherwise in his green young heart, put about and galloped off as he had come, the bell tinkling in the wind. For a long while afterwards I saw his noble attitude as he drew up, and heard the note of his bell; and when I struck the high-road, the song of the telegraph-wires seemed to continue the same music."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[65]"
        "line_start": 716
        "line_end": 725
        "source_sequence": 716
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 641
        "line_end": 650
        "source_sequence": 641
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[65]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-641-650"
    "translation_ja": "空は寒々しく、肌を刺す冷たさだった。馬にまたがるご婦人の一団と、郵便を運ぶ二人を別にすれば、プラデルまでの道で、ほかに人っ子一人見かけなかった。一つを除けば、変わったことは思い出せない。首に鈴を下げた見事な仔馬が、入会地で私たちめがけて突進してきた。これから大事業にでも取りかかるように、勇ましく鼻を鳴らして辺りを嗅ぎ、急に未熟な若い心で思い直したか、くるりと向きを変え、風に鈴をちりちり鳴らしながら、来たとおりの勢いで駆け去った。立ち止まったときの見事な姿は長いこと目に残り、鈴の音は耳に残った。街道に出ると、電信線のうなりが同じ音楽を引き継いだように思えた。"
    "translation_status": "reviewed"
  - "id": "td-073"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Pradelles stands on a hillside, high above the Allier, surrounded by rich meadows. They were cutting aftermath on all sides, which gave the neighbourhood, this gusty autumn morning, an untimely smell of hay. On the opposite bank of the Allier the land kept mounting for miles to the horizon: a tanned and sallow autumn landscape, with black blots of fir-wood and white roads wandering through the hills. Over all this the clouds shed a uniform and purplish shadow, sad and somewhat menacing, exaggerating height and distance, and throwing into still higher relief the twisted ribbons of the highway. It was a cheerless prospect, but one stimulating to a traveller. For I was now upon the limit of Velay, and all that I beheld lay in another county—wild Gévaudan, mountainous, uncultivated, and but recently disforested from terror of the wolves."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[66]"
        "line_start": 726
        "line_end": 738
        "source_sequence": 726
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 652
        "line_end": 663
        "source_sequence": 652
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[66]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-652-663"
    "translation_ja": "プラデルはアリエ川をはるか下に見下ろす山腹に立ち、ゆたかな牧草地に囲まれている。あちこちで二番草を刈っていて、風の荒いこの秋の朝、あたりには季節外れの干し草の匂いがしていた。アリエ川の対岸では、土地は数マイル先の地平線までひたすら高くなっていた。日に焼けた黄褐色の秋景色に、モミ林が黒い斑点をつくり、白い道が丘を縫ってゆく。その上に雲は一様な紫がかった影を投げた。憂いといくらか不吉な色を帯び、高さも距離も実際より大きく見せ、帯のようにくねる街道をなおも引き立たせていた。気の晴れない眺めだが、旅人の心をそそのかす眺めであった。いま私はヴレの果てにおり、目にしているものは何もかも別の地方、荒々しいジェヴォーダンに属していた。山がちで耕されず、狼が怖いといって、近ごろようやく森を伐り払った土地である。"
    "translation_status": "reviewed"
  - "id": "td-074"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Wolves, alas, like bandits, seem to flee the traveller’s advance; and you may trudge through all our comfortable Europe, and not meet with an adventure worth the name. But here, if anywhere, a man was on the frontiers of hope. For this was the land of the ever-memorable BEAST, the Napoleon Bonaparte of wolves. What a career was his! He lived ten months at free quarters in Gévaudan and Vivarais; he ate women and children and ‘shepherdesses celebrated for their beauty’; he pursued armed horsemen; he has been seen at broad noonday chasing a post-chaise and outrider along the king’s high-road, and chaise and outrider fleeing before him at the gallop. He was placarded like a political offender, and ten thousand francs were offered for his head. And yet, when he was shot and sent to Versailles, behold! a common wolf, and even small for that. ‘Though I could reach from pole to pole,’ sang Alexander Pope; the Little Corporal shook Europe; and if all wolves had been as this wolf, they would have changed the history of man. M. Élie Berthet has made him the hero of a novel, which I have read, and do not wish to read again."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[67]"
        "line_start": 739
        "line_end": 756
        "source_sequence": 739
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 665
        "line_end": 680
        "source_sequence": 665
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[67]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-665-680"
    "translation_ja": "ああ、狼は追い剥ぎと同じで旅人が来ると逃げるらしく、居心地のいいヨーロッパを端から端まで歩いても、冒険と呼ぶに足るものに出遭わないこともある。だが、ここなら、ほかになくともここなら、望みの国の境には立っていた。ここはとこしえに語り継がれるあの〈獣〉、狼のナポレオン・ボナパルトの土地だからである。なんという一代記だろう。やつはジェヴォーダンとヴィヴァレで十か月、ただ食いで暮らした。女や子ども、「美貌で評判の羊飼いの娘たち」を食らった。武装した騎馬の男たちを追った。真っ昼間、王の街道を走る郵便馬車と騎馬の従者を追いかけ、馬車も従者も全速力で逃げる姿まで目撃された。政治犯のように触れ書きが出て、その首に一万フランがかけられた。ところが撃たれ、ヴェルサイユに送られてみれば、おや、並の狼で、しかも並より小さい。アレグザンダー・ポープは「たとえ両極にわが手が届くとしても」と詠んだ。あの〈小伍長〉はヨーロッパを揺さぶった。狼がみな、かの狼のようであったなら、人類の歴史は変わっていただろう。エリー・ベルテ氏はこれを小説の主人公にした。私は一度読んだが、また読みたいとは思わない。"
    "translation_status": "reviewed"
  - "id": "td-075"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I hurried over my lunch, and was proof against the landlady’s desire that I should visit our Lady of Pradelles, ‘who performed many miracles, although she was of wood’; and before three-quarters of an hour I was goading Modestine down the steep descent that leads to Langogne on the Allier. On both sides of the road, in big dusty fields, farmers were preparing for next spring. Every fifty yards a yoke of great-necked stolid oxen were patiently haling at the plough. I saw one of these mild formidable servants of the glebe, who took a sudden interest in Modestine and me. The furrow down which he was journeying lay at an angle to the road, and his head was solidly fixed to the yoke like those of caryatides below a ponderous cornice; but he screwed round his big honest eyes and followed us with a ruminating look, until his master bade him turn the plough and proceed to reascend the field. From all these furrowing ploughshares, from the feet of oxen, from a labourer here and there who was breaking the dry clods with a hoe, the wind carried away a thin dust like so much smoke. It was a fine, busy, breathing, rustic landscape; and as I continued to descend, the highlands of Gévaudan kept mounting in front of me against the sky."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[68]"
        "line_start": 757
        "line_end": 775
        "source_sequence": 757
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 682
        "line_end": 699
        "source_sequence": 682
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[68]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-682-699"
    "translation_ja": "昼食を急いですませ、宿の女主人が勧めるプラデルの聖母詣りも断った。「木でできているのに、奇跡をたくさん起こした」という。そのあと四十五分もしないうちに、アリエ河畔のランゴーニュへ下る急坂でモデスティーヌに突き棒を当てていた。道の両側の、ほこりの立つ大きな畑では、農夫が来春の準備をしていた。五十ヤードごとに、太い首の、物に動じぬ牛二頭が組になって、じっと辛抱強く犂を引いている。そのおとなしくも威厳のある土の下僕の一頭が、急に私とモデスティーヌに興味を示した。牛が進む畝は道と斜めに交わり、牛の頭は重い軒飾りを支える女像柱の頭のように、軛にしっかり留まっていた。それでも大きな正直そうな目をぐるりと回し、考えこむような眼差しで私たちを追った。主人が犂を返してまた畑を上れと命じるまで、そうしていた。畝を作る犂の刃から、牛の足から、ところどころの鍬で乾いた土くれを割る農夫から、風が煙のような薄い砂ぼこりをさらっていった。よく働き、息づいている、みごとな田園の風景だった。坂を下りつづけると、正面の空に向かって、ジェヴォーダンの高地がますますせり上がってきた。"
    "translation_status": "reviewed"
  - "id": "td-076"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had crossed the Loire the day before; now I was to cross the Allier; so near are these two confluents in their youth. Just at the bridge of Langogne, as the long-promised rain was beginning to fall, a lassie of some seven or eight addressed me in the sacramental phrase, ‘D’où’st-ce-que vous venez?’ She did it with so high an air that she set me laughing; and this cut her to the quick. She was evidently one who reckoned on respect, and stood looking after me in silent dudgeon, as I crossed the bridge and entered the county of Gévaudan."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":

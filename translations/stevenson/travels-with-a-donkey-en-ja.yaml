  - "id": "td-363"
    "section_id": "farewell-modestine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "One thing more I note. The phylloxera has ravaged the vineyards in this neighbourhood; and in the early morning, under some chestnuts by the river, I found a party of men working with a cider-press. I could not at first make out what they were after, and asked one fellow to explain."
    "source_languages":

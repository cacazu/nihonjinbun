  - "id": "td-130"
    "section_id": "cheylard-and-luc"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "After I had begun the morning on this delightful liquor, she having an infinity of things to arrange, I was permitted, nay requested, to make a bowl of chocolate for myself. My boots and gaiters were hung up to dry, and, seeing me trying to write my journal on my knee, the eldest daughter let down a hinged table in the chimney-corner for my convenience. Here I wrote, drank my chocolate, and finally ate an omelette before I left. The table was thick with dust; for, as they explained, it was not used except in winter weather. I had a clear look up the vent, through brown agglomerations of soot and blue vapour, to the sky; and whenever a handful of twigs was thrown on to the fire, my legs were scorched by the blaze."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"

        "original_unit_id": "/html/body/p[221]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2304-2305"
    "translation_ja": "「神の子らよ」と預言者は叫んだ。「手を休めよ。屋敷を焼こう。司祭もバアルの手先も、もろともに」"
    "translation_status": "reviewed"
  - "id": "td-251"
    "section_id": "pont-de-montvert"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The fire caught readily. Out of an upper window Du Chayla and his men lowered themselves into the garden by means of knotted sheets; some escaped across the river under the bullets of the insurgents; but the archpriest himself fell, broke his thigh, and could only crawl into the hedge. What were his reflections as this second martyrdom drew near? A poor, brave, besotted, hateful man, who had done his duty resolutely according to his light both in the Cevennes and China. He found at least one telling word to say in his defence; for when the roof fell in and the upbursting flames discovered his retreat, and they came and dragged him to the public place of the town, raging and calling him damned—‘If I be damned,’ said he, ‘why should you also damn yourselves?’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[222]"
        "line_start": 2246
        "line_end": 2257
        "source_sequence": 2246
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2307
        "line_end": 2317
        "source_sequence": 2307
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[222]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2307-2317"
    "translation_ja": "あっけなく火がついた。デュ・シェイラと手勢は、上階の窓から、結び合わせた敷布をつたって庭へ下りた。何人かは反乱軍の銃弾をかいくぐって川向こうへ逃げた。だが首席司祭は落ちて腿を折り、生垣まで這ってゆくのが精いっぱいだった。二度目の殉教が近づく中、何を思っていたのだろう。哀れに勇ましく、蒙昧で憎々しい男。セヴェンヌでも中国でも、正しいと信じるところに従って、断固として務めを果たした。少なくとも、身を弁護するうまい一言を見つけはした。屋根が落ち、噴き上がる炎で隠れ場所が知れ、怒鳴って呪われた者と呼ぶ者どもが、町の広場へ引きずり出したとき、「私が呪われているとして」と言った。「なぜ君たちまで、自分自身を呪われた者にするのだ？」"
    "translation_status": "reviewed"
  - "id": "td-252"
    "section_id": "pont-de-montvert"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Here was a good reason for the last; but in the course of his inspectorship he had given many stronger which all told in a contrary direction; and these he was now to hear. One by one, Séguier first, the Camisards drew near and stabbed him. ‘This,’ they said, ‘is for my father broken on the wheel. This for my brother in the galleys. That for my mother or my sister imprisoned in your cursed convents.’ Each gave his blow and his reason; and then all kneeled and sang psalms around the body till the dawn. With the dawn, still singing, they defiled away towards Frugères, farther up the Tarn, to pursue the work of vengeance, leaving Du Chayla’s prison-house in ruins, and his body pierced with two-and-fifty wounds upon the public place."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[223]"
        "line_start": 2258
        "line_end": 2269
        "source_sequence": 2258
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2319
        "line_end": 2329
        "source_sequence": 2319
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[223]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2319-2329"
    "translation_ja": "最後の問いには理があった。だが監察官の務めのあいだに、自分でその正反対の方向へ導く、もっと強い理由をいくつも与えたのである。いまからそれを聞く番だった。セギエを先頭に、カミザールが一人また一人近づき、突き刺した。「この一刺しは」と言った。「車裂きになった父の分。この一刺しはガレー船の兄弟の分。その一刺しは、呪われたおまえたちの修道院に閉じこめられた母、あるいは姉妹の分だ」。一人ひとりが刃を振るい、理由を述べた。それから全員が膝をつき、亡骸を囲んで夜明けまで詩篇を歌った。明けるとまだ歌いながら、復讐をつづけるため、タルン川上流のフリュジェールを目指して列をなして去った。デュ・シェイラの牢屋敷は廃墟、町の広場には五十二の刺し傷を負った遺体が残っていた。"
    "translation_status": "reviewed"
  - "id": "td-253"
    "section_id": "pont-de-montvert"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "’Tis a wild night’s work, with its accompaniment of psalms; and it seems as if a psalm must always have a sound of threatening in that town upon the Tarn. But the story does not end, even so far as concerns Pont de Montvert, with the departure of the Camisards. The career of Séguier was brief and bloody. Two more priests and a whole family at Ladevèze, from the father to the servants, fell by his hand or by his orders; and yet he was but a day or two at large, and restrained all the time by the presence of the soldiery. Taken at length by a famous soldier of fortune, Captain Poul, he appeared unmoved before his judges."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

  - "id": "td-081"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The next day (Tuesday, September 24th), it was two o’clock in the afternoon before I got my journal written up and my knapsack repaired, for I was determined to carry my knapsack in the future and have no more ado with baskets; and half an hour afterwards I set out for Le Cheylard l’Évêque, a place on the borders of the forest of Mercoire. A man, I was told, should walk there in an hour and a half; and I thought it scarce too ambitious to suppose that a man encumbered with a donkey might cover the same distance in four hours."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"

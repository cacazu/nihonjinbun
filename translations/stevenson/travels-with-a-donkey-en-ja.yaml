        "original_unit_id": "line-1349-1363"
    "translation_ja": "この食前の口開けがすむと、しばらく修道院の庭にひとり残された。庭といっても本棟の中庭にすぎず、砂を敷いた小道と色とりどりのダリアの花壇があり、中央に噴水と聖母の黒い像がある。四角く囲む建物は寒々しく、年月や風雨にまだ馴染まず、鐘楼に、石板葺きの妻屋根が二つあるほかは、何の特徴もない。白衣の修道士、茶衣の修道士が、砂の小道を黙って行き過ぎた。最初に私が出たとき、頭巾をかぶった修道士が三人、露台に膝をついて祈っていた。片側には裸の丘が修道院を見下ろし、もう片側には森が迫る。風にさらされ、雪は十月から五月まで折にふれて降り、ときに六週間ぶっ通しで積もる。だが、この建物がエデンに建ち、天上のような気候に恵まれても、それ自体が同じように冬めき、うら寂しい様子を呈するだろう。この荒れた九月の日、食事に呼ばれるまでの私は、体の内も外も寒かった。"
    "translation_status": "reviewed"
  - "id": "td-163"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When I had eaten well and heartily, Brother Ambrose, a hearty conversible Frenchman (for all those who wait on strangers have the liberty to speak), led me to a little room in that part of the building which is set apart for MM. les retraitants. It was clean and whitewashed, and furnished with strict necessaries, a crucifix, a bust of the late Pope, the Imitation in French, a book of religious meditations, and the Life of Elizabeth Seton, evangelist, it would appear, of North America and of New England in particular. As far as my experience goes, there is a fair field for some more evangelisation in these quarters; but think of Cotton Mather! I should like to give him a reading of this little work in heaven, where I hope he dwells; but perhaps he knows all that already, and much more; and perhaps he and Mrs. Seton are the dearest friends, and gladly unite their voices in the everlasting psalm. Over the table, to conclude the inventory of the room, hung a set of regulations for MM. les retraitants: what services they should attend, when they were to tell their beads or meditate, and when they were to rise and go to rest. At the foot was a notable N.B.: ‘Le temps libre est employé à l’examen de conscience, à la confession, à faire de bonnes résolutions, etc.’ To make good resolutions, indeed! You might talk as fruitfully of making the hair grow on your head."
    "source_languages":
      - "en"
      - "fr"

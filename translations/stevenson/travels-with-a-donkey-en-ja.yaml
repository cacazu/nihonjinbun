    "kind": "paragraph"
    "origin": "source"
    "source_text": "They came to the next door in force, a man, two women, and a girl, and brought a pair of lanterns to examine the wayfarer. The man was not ill-looking, but had a shifty smile. He leaned against the doorpost, and heard me state my case. All I asked was a guide as far as Cheylard."

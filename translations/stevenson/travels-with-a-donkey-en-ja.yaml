        "source_sequence": 2104
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[209]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2104-2118"
    "translation_ja": "これまで旅したのは面白みのない地方で、跡をたどるものといえば、人の子を食うジェヴォーダンの〈獣〉、狼のナポレオン・ボナパルトより名高いものはなかった。だがこれから、世界史の波瀾に富んだ一章、いや波瀾に富んだ一脚注の舞台に下りるのだ。過ぎた日の埃と英雄の振る舞いは、何を残しているだろう。このプロテスタントの抵抗の本拠に、今もプロテスタントが生き残っていると聞いていた。修道院の談話室で、あの司祭本人がそう言った。だが名ばかりの残存か、生き生きとした鷹揚な伝統かは、まだ知らなかった。また北のセヴェンヌでは信仰について人々の見方が狭く、慈愛以上に熱意に満ちていたが、この迫害と報復の土地には、何を期待すればよいだろう。教会の横暴がカミザールの反乱を生み、カミザールが植えつけた恐怖がカトリックの農民を反対陣営の公認された反乱へ駆り立て、カミザールとフロランタンが山の中で互いの命を狙い、忍び歩いたこの土地で。"
    "translation_status": "reviewed"
  - "id": "td-238"
    "section_id": "across-the-lozere"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Just on the brow of the hill, where I paused to look before me, the series of stone pillars came abruptly to an end; and only a little below, a sort of track appeared and began to go down a break-neck slope, turning like a corkscrew as it went. It led into a valley between falling hills, stubbly with rocks like a reaped field of corn, and floored farther down with green meadows. I followed the track with precipitation; the steepness of the slope, the continual agile turning of the line of the descent, and the old unwearied hope of finding something new in a new country, all conspired to lend me wings. Yet a little lower and a stream began, collecting itself together out of many fountains, and soon making a glad noise among the hills. Sometimes it would cross the track in a bit of waterfall, with a pool, in which Modestine refreshed her feet."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[210]"
        "line_start": 2068
        "line_end": 2080
        "source_sequence": 2068
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2120
        "line_end": 2131
        "source_sequence": 2120
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[210]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2120-2131"
    "translation_ja": "立ち止まって正面を眺めた丘の額で、石柱の列は突然途切れた。その少し下に小道らしいものが現れ、コルク抜きのようにくねりながら、首を折りかねない坂を下りはじめる。下へ向かう丘の間の谷に通じ、谷は刈り入れのすんだ麦畑のように岩が切り株めいて立ち、その先では底が緑の牧草地に覆われていた。私は勢いよく小道を下った。坂の急さ、せわしく俊敏に道筋が曲がりつづけること、見知らぬ土地には新しいものが見つかるという昔からの尽きぬ期待、それらが力を合わせ、私に翼を授けた。もう少し下ると水の流れが始まった。いくつもの湧き水が集まり、すぐに丘の間で楽しげな音を立てた。ときには小さな滝となって小道を横切り、滝壺の淵ではモデスティーヌが足を冷やした。"
    "translation_status": "reviewed"
  - "id": "td-239"
    "section_id": "across-the-lozere"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The whole descent is like a dream to me, so rapidly was it accomplished. I had scarcely left the summit ere the valley had closed round my path, and the sun beat upon me, walking in a stagnant lowland atmosphere. The track became a road, and went up and down in easy undulations. I passed cabin after cabin, but all seemed deserted; and I saw not a human creature, nor heard any sound except that of the stream. I was, however, in a different country from the day before. The stony skeleton of the world was here vigorously displayed to sun and air. The slopes were steep and changeful. Oak-trees clung along the hills, well grown, wealthy in leaf, and touched by the autumn with strong and luminous colours. Here and there another stream would fall in from the right or the left, down a gorge of snow-white and tumultuary boulders. The river in the bottom (for it was rapidly growing a river, collecting on all hands as it trotted on its way) here foamed a while in desperate rapids, and there lay in pools of the most enchanting sea-green shot with watery browns. As far as I have gone, I have never seen a river of so changeful and delicate a hue; crystal was not more clear, the meadows were not by half so green; and at every pool I saw I felt a thrill of longing to be out of these hot, dusty, and material garments, and bathe my naked body in the mountain air and water. All the time as I went on I never forgot it was the Sabbath; the stillness was a perpetual reminder; and I heard in spirit the church-bells clamouring all over Europe, and the psalms of a thousand churches."
    "source_languages":
      - "en"
    "source_locations":

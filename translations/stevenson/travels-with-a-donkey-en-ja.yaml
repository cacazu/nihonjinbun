        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1865
        "line_end": 1879
        "source_sequence": 1865
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[196]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1865-1879"
    "translation_ja": "ブレマールで昼食を取り、すでに遅かったが、ロゼールの一角をよじ登りに出た。跡が頼りない石だらけの牛道をたどると、木立から下りてくる牛車が六台近く、冬の薪にする松を丸ごと一本ずつ載せていた。この冷たい尾根ではさほど高くまでのぼらぬ林の、その上端で、左へ松の間の小道を取った。やがて緑の芝の窪地に出た。細い流れが石の上から小さな水の口をつくり、私の水道の役を果たした。「これほど神聖な、これほど奥まった木陰には……ニンフも牧神も通わなかった」。木は古くないが、空き地を取り巻いて密に茂る。北東には遠い丘の頂、真上には空を見られたが、ほかに眺めはなかった。野営地は一部屋のように守られ、人の目が届かなかった。支度をととのえ、モデスティーヌに食事をやり終えるころ、日はもう翳りはじめていた。寝袋に膝まで体を留めて、しっかり食べた。日が沈むとすぐ、帽子を目まで下ろして眠りこんだ。"
    "translation_status": "reviewed"
  - "id": "td-221"
    "section_id": "a-night-among-the-pines"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Night is a dead monotonous period under a roof; but in the open world it passes lightly, with its stars and dews and perfumes, and the hours are marked by changes in the face of Nature. What seems a kind of temporal death to people choked between walls and curtains, is only a light and living slumber to the man who sleeps afield. All night long he can hear Nature breathing deeply and freely; even as she takes her rest, she turns and smiles; and there is one stirring hour unknown to those who dwell in houses, when a wakeful influence goes abroad over the sleeping hemisphere, and all the outdoor world are on their feet. It is then that the cock first crows, not this time to announce the dawn, but like a cheerful watchman speeding the course of night. Cattle awake on the meadows; sheep break their fast on dewy hillsides, and change to a new lair among the ferns; and houseless men, who have lain down with the fowls, open their dim eyes and behold the beauty of the night."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[197]"
        "line_start": 1842
        "line_end": 1856
        "source_sequence": 1842
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1881
        "line_end": 1894
        "source_sequence": 1881
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[197]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1881-1894"
    "translation_ja": "屋根の下では夜は死んだように単調な時間だが、外の世界では、星や露や香りを従えて軽やかに過ぎ、自然の表情が変わるたびに、時が刻まれる。壁とカーテンにはさまれ息を詰まらせている人には、つかの間の死にも思えるものが、野に眠る人には浅く息づく眠りでしかない。一晩じゅう、自然が深く自由に呼吸するのを聞ける。自然はくつろぎながら、寝返りを打ち、微笑む。そして家に住む人の知らない一時があって、眠る半球じゅうに目覚めをうながす力が出歩き、屋外の世界はことごとく起き上がる。そのとき雄鶏が初めて鳴く。今度は夜明けを告げるのではなく、陽気な夜回りが夜の足を速めるように。牛が牧草地で目を覚まし、羊は露に濡れた斜面で朝食をとり、シダの間の新しいねぐらへ移る。そして鳥と同じ時刻に横になった宿なしの者も、ぼんやりした目を開けて、夜の美しさを目にする。"
    "translation_status": "reviewed"
  - "id": "td-222"
    "section_id": "a-night-among-the-pines"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At what inaudible summons, at what gentle touch of Nature, are all these sleepers thus recalled in the same hour to life? Do the stars rain down an influence, or do we share some thrill of mother earth below our resting bodies? Even shepherds and old country-folk, who are the deepest read in these arcana, have not a guess as to the means or purpose of this nightly resurrection. Towards two in the morning they declare the thing takes place; and neither know nor inquire further. And at least it is a pleasant incident. We are disturbed in our slumber only, like the luxurious Montaigne, ‘that we may the better and more sensibly relish it.’ We have a moment to look upon the stars. And there is a special pleasure for some minds in the reflection that we share the impulse with all outdoor creatures in our neighbourhood, that we have escaped out of the Bastille of civilisation, and are become, for the time being, a mere kindly animal and a sheep of Nature’s flock."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[198]"
        "line_start": 1857
        "line_end": 1871
        "source_sequence": 1857
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1896
        "line_end": 1909
        "source_sequence": 1896
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[198]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1896-1909"
    "translation_ja": "どんな聞こえぬ呼び声に、自然のどんなやさしい触れ方に、眠る者がことごとく同じ一時に生へ呼び戻されるのだろう。星々が何かの力を降らすのか。横たわる体の下の母なる大地に何か震えが走って、それを私たちも感じるのか。この秘事にもっとも通じた羊飼いや田舎の老人でさえ、夜ごとの復活がどうして起こるのか、何のためか見当もつかぬ。午前二時ごろに起こると断言するだけで、あとは知らず、知ろうともしない。ともかく愉快な出来事である。贅沢なモンテーニュと同じく、「よりよく、よりはっきりと味わうため」に、ほんの一度眠りを妨げられるにすぎない。星々を眺めるひとときを得る。人によっては、近辺のあらゆる外の生き物と、この衝動を分かち合うと思うことに格別の楽しみがある。文明のバスティーユ牢獄から逃げ出し、その間だけ、他意のないただの動物、自然の群れの羊一頭になったのだ。"
    "translation_status": "reviewed"
  - "id": "td-223"
    "section_id": "a-night-among-the-pines"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When that hour came to me among the pines, I wakened thirsty. My tin was standing by me half full of water. I emptied it at a draught; and feeling broad awake after this internal cold aspersion, sat upright to make a cigarette. The stars were clear, coloured, and jewel-like, but not frosty. A faint silvery vapour stood for the Milky Way. All around me the black fir-points stood upright and stock-still. By the whiteness of the pack-saddle, I could see Modestine walking round and round at the length of her tether; I could hear her steadily munching at the sward; but there was not another sound, save the indescribable quiet talk of the runnel over the stones. I lay lazily smoking and studying the colour of the sky, as we call the void of space, from where it showed a reddish grey behind the pines to where it showed a glossy blue-black between the stars. As if to be more like a pedlar, I wear a silver ring. This I could see faintly shining as I raised or lowered the cigarette; and at each whiff the inside of my hand was illuminated, and became for a second the highest light in the landscape."
    "source_languages":
      - "en"
    "source_locations":

      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-568-568"
    "translation_ja": "「おっしゃるとおりです」と私は言った。"
    "translation_status": "reviewed"
  - "id": "td-059"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘You see,’ she added to her husband, ‘I understood that.’"

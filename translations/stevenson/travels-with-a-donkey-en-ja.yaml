    "source_text": "At Pont de Montvert, on the 12th of August, he had his right hand stricken from his body, and was burned alive. And his soul was like a garden? So perhaps was the soul of Du Chayla, the Christian martyr. And perhaps if you could read in my soul, or I could read in yours, our own composure might seem little less surprising."

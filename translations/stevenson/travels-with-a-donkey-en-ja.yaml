    "translation_ja": "まごうかたなきジェヴォーダンの〈獣〉がいた。"
    "translation_status": "reviewed"
  - "id": "td-113"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Sir,’ said I, with my most commanding manners, ‘you are a coward.’"

        "original_unit_id": "line-1386-1398"
    "translation_ja": "この小さな居場所を一通り見たか見ないかで、アンブロワーズ修道士が戻ってきた。イギリスの寄宿者が私と話したがっているとのことだった。喜んで、と答えると、修道士は五十歳の若々しく小柄なアイルランド人を通した。教会の助祭で、厳格な聖職服をまとい、頭には、知識がないので「聖職者の軍帽」とでも呼ぶしかないものをかぶっていた。ベルギーの女子修道院にこもって七年、雪の聖母ですでに五年になる。イギリスの新聞を目にすることはまったくなく、フランス語も不完全で、たとえ生粋のフランス人のように話せたとしても、住んでいるところでは会話の機会はあまりない。それでいて大の人好き、世間の便りには飢え、心は子どものように素直だった。私も修道院の案内を得てうれしかったが、彼もイギリスから来た顔を見て英語を耳にすることが、同じほどにうれしかったのである。"
    "translation_status": "reviewed"
  - "id": "td-165"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He showed me his own room, where he passed his time among breviaries, Hebrew Bibles, and the Waverley Novels. Thence he led me to the cloisters, into the chapter-house, through the vestry, where the brothers’ gowns and broad straw hats were hanging up, each with his religious name upon a board—names full of legendary suavity and interest, such as Basil, Hilarion, Raphael, or Pacifique; into the library, where were all the works of Veuillot and Chateaubriand, and the Odes et Ballades, if you please, and even Molière, to say nothing of innumerable fathers and a great variety of local and general historians. Thence my good Irishman took me round the workshops, where brothers bake bread, and make cartwheels, and take photographs; where one superintends a collection of curiosities, and another a gallery of rabbits. For in a Trappist monastery each monk has an occupation of his own choice, apart from his religious duties and the general labours of the house. Each must sing in the choir, if he has a voice and ear, and join in the haymaking if he has a hand to stir; but in his private hours, although he must be occupied, he may be occupied on what he likes. Thus I was told that one brother was engaged with literature; while Father Apollinaris busies himself in making roads, and the Abbot employs himself in binding books. It is not so long since this Abbot was consecrated, by the way; and on that occasion, by a special grace, his mother was permitted to enter the chapel and witness the ceremony of consecration. A proud day for her to have a son a mitred abbot; it makes you glad to think they let her in."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":

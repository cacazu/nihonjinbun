  - "id": "td-115"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The lanterns had somewhat dazzled me, and I ploughed distressfully among stones and rubbish-heaps. All the other houses in the village were both dark and silent; and though I knocked at here and there a door, my knocking was unanswered. It was a bad business; I gave up Fouzilhac with my curses. The rain had stopped, and the wind, which still kept rising, began to dry my coat and trousers. ‘Very well,’ thought I, ‘water or no water, I must camp.’ But the first thing was to return to Modestine. I am pretty sure I was twenty minutes groping for my lady in the dark; and if it had not been for the unkindly services of the bog, into which I once more stumbled, I might have still been groping for her at the dawn. My next business was to gain the shelter of a wood, for the wind was cold as well as boisterous. How, in this well-wooded district, I should have been so long in finding one, is another of the insoluble mysteries of this day’s adventures; but I will take my oath that I put near an hour to the discovery."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[104]"
        "line_start": 967
        "line_end": 982
        "source_sequence": 967
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 917
        "line_end": 931
        "source_sequence": 917
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[104]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-917-931"
    "translation_ja": "角灯でいくらか目がくらんでいたため、石やごみの山を抜けるのに往生した。村のほかの家はみな暗く、物音一つせず、あちこち戸を叩いたが返事がなかった。いやな一件だった。フジラックには呪いの言葉を残して見切りをつけた。雨は上がり、強まりつづける風が、上着とズボンを乾かしはじめた。「よろしい、水があってもなくても、野営するしかない」と私は思った。ただ先に、モデスティーヌのところへ戻らねばならない。暗闇でお嬢さまを手探りで探すのに、間違いなく二十分はかかった。沼が意地の悪い助けをしてくれ、もう一度そこに踏みこんでいなかったら、夜明けまで探していたかもしれない。次は避難できる林を目指した。風は荒いばかりか冷たかったからだ。森の多いこの地方でどうして林一つ見つけるのにそう時間がかかったか、この日の冒険の解けない謎がまた一つある。だが見つけるのに一時間近くかけたと、誓ってもいい。"
    "translation_status": "reviewed"
  - "id": "td-116"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At last black trees began to show upon my left, and, suddenly crossing the road, made a cave of unmitigated blackness right in front. I call it a cave without exaggeration; to pass below that arch of leaves was like entering a dungeon. I felt about until my hand encountered a stout branch, and to this I tied Modestine, a haggard, drenched, desponding donkey. Then I lowered my pack, laid it along the wall on the margin of the road, and unbuckled the straps. I knew well enough where the lantern was; but where were the candles? I groped and groped among the tumbled articles, and, while I was thus groping, suddenly I touched the spirit-lamp. Salvation! This would serve my turn as well. The wind roared unwearyingly among the trees; I could hear the boughs tossing and the leaves churning through half a mile of forest; yet the scene of my encampment was not only as black as the pit, but admirably sheltered. At the second match the wick caught flame. The light was both livid and shifting; but it cut me off from the universe, and doubled the darkness of the surrounding night."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[105]"
        "line_start": 983
        "line_end": 999
        "source_sequence": 983
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 933
        "line_end": 948
        "source_sequence": 933
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[105]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-933-948"
    "translation_ja": "ついに左手に黒い木々が見えはじめた。それが急に道をまたぎ、目の前にまじりけなしの闇の洞窟をつくった。洞窟と呼ぶのは誇張でない。その葉のアーチの下に入ると、地下牢に踏みこむようだった。手探りで丈夫な枝を見つけ、そこにモデスティーヌをつないだ。やつれ、ずぶ濡れで、しょげきったロバである。それから荷を下ろし、道端の石垣に沿って横たえ、帯の金具をはずした。角灯のありかはよく分かっていた。では蝋燭はどこか。ごたごたになった品の間を何度も探るうち、突然、アルコールランプに手が触れた。助かった。これでも十分に間に合う。風は木々の中を飽きもせず唸り、枝が翻り葉が揉まれる音が半マイルの森を伝わってくる。それでもこの野営地は地獄の穴のように真っ暗なばかりか、みごとに風を防いだ。二本目のマッチで芯に火がついた。光は青白く、揺れた。だが私を宇宙から切り離し、まわりの夜を二倍も暗くした。"
    "translation_status": "reviewed"
  - "id": "td-117"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I tied Modestine more conveniently for herself, and broke up half the black bread for her supper, reserving the other half against the morning. Then I gathered what I should want within reach, took off my wet boots and gaiters, which I wrapped in my waterproof, arranged my knapsack for a pillow under the flap of my sleeping-bag, insinuated my limbs into the interior, and buckled myself in like a bambino. I opened a tin of Bologna sausage and broke a cake of chocolate, and that was all I had to eat. It may sound offensive, but I ate them together, bite by bite, by way of bread and meat. All I had to wash down this revolting mixture was neat brandy: a revolting beverage in itself. But I was rare and hungry; ate well, and smoked one of the best cigarettes in my experience. Then I put a stone in my straw hat, pulled the flap of my fur cap over my neck and eyes, put my revolver ready to my hand, and snuggled well down among the sheepskins."
    "source_languages":
      - "en"
    "source_locations":

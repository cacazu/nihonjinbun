  - "id": "td-321"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The villagers whom I saw seemed intelligent after a countrified fashion, and were all plain and dignified in manner. As a Protestant myself, I was well looked upon, and my acquaintance with history gained me further respect. For we had something not unlike a religious controversy at table, a gendarme and a merchant with whom I dined being both strangers to the place, and Catholics. The young men of the house stood round and supported me; and the whole discussion was tolerantly conducted, and surprised a man brought up among the infinitesimal and contentious differences of Scotland. The merchant, indeed, grew a little warm, and was far less pleased than some others with my historical acquirements. But the gendarme was mighty easy over it all."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[288]"
        "line_start": 2819
        "line_end": 2829
        "source_sequence": 2819
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2933
        "line_end": 2943
        "source_sequence": 2933
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[288]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2933-2943"
    "translation_ja": "会った村人は田舎風に利発で、物腰はみな飾らず、威厳があった。私自身プロテスタントなので好意をもたれ、歴史を知っているので、いっそう一目置かれた。食卓では宗教論争といってもおかしくないことがあった。いっしょに食べた憲兵と商人は、どちらもこの地の者ではなく、カトリックだったからだ。家の若者たちがまわりに立ち、私を支持した。議論は終始、寛容に行われ、針の先ほどの違いで論争の絶えないスコットランドに育った者は驚いた。なるほど商人は少し熱くなり、私の歴史の素養を、ほかの何人かほど喜びはしなかった。だが憲兵は、なにごともひどくおおらかに受け取った。"
    "translation_status": "reviewed"
  - "id": "td-322"
    "section_id": "the-heart-of-the-country"

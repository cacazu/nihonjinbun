  - "id": "td-134"
    "section_id": "cheylard-and-luc"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Alas, there were her two forelegs no better than raw beef on the inside, and blood was running from under her tail. They told me when I started, and I was ready to believe it, that before a few days I should come to love Modestine like a dog. Three days had passed, we had shared some misadventures, and my heart was still as cold as a potato towards my beast of burden. She was pretty enough to look at; but then she had given proof of dead stupidity, redeemed indeed by patience, but aggravated by flashes of sorry and ill-judged light-heartedness. And I own this new discovery seemed another point against her. What the devil was the good of a she-ass if she could not carry a sleeping-bag and a few necessaries? I saw the end of the fable rapidly approaching, when I should have to carry Modestine. Æsop was the man to know the world! I assure you I set out with heavy thoughts upon my short day’s march."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[122]"
        "line_start": 1140
        "line_end": 1153
        "source_sequence": 1140
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1106
        "line_end": 1118
        "source_sequence": 1106
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[122]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1106-1118"
    "translation_ja": "なんということだ。両の前脚の内側はまるで生の牛肉で、尻尾の下から血が流れていた。出かけるとき、何日もしないうちに犬をかわいがるようにモデスティーヌを愛するようになると聞き、そうだろうと思っていた。もう三日が過ぎ、いくつか災難を分かち合ったが、この荷役の獣に寄せる私の心はジャガイモのように冷えたままだった。見かけは十分にかわいらしい。だが根っから愚鈍なのはすでに証明済みで、辛抱強さがせめてもの取り柄だったのに、ときおり見苦しく場違いにはしゃいでは、その欠点をいっそう際立たせた。正直なところ、この新発見も、彼女にはもう一つの減点に思えた。寝袋とわずかな必需品も運べない雌ロバが、いったい何の役に立つのだ。私がモデスティーヌを担ぐという、あの寓話の結末がいよいよ迫っている。イソップこそ世間を知った男だ。短い一日の行程へ、重苦しい考えを抱えて出発したのは言うまでもない。"
    "translation_status": "reviewed"
    "source_variants":
      - "kind": "comparison"
        "text": "Alas, there were her two forelegs no better than raw beef on the inside, and blood was running from under her tail. They told me when I started, and I was ready to believe it, that before a few days I should come to love Modestine like a dog. Three days had passed, we had shared some misadventures, and my heart was still as cold as a potato towards my beast of burden. She was pretty enough to look at; but then she had given proof of dead stupidity, redeemed indeed by patience, but aggravated by flashes of sorry and ill-judged light-heartedness. And I own this new discovery seemed another point against her. What the devil was the good of a she-ass if she could not carry a sleeping-bag and a few necessaries? I saw the end of the fable rapidly approaching, when I should have to carry Modestine. AEsop was the man to know the world! I assure you I set out with heavy thoughts upon my short day's march."
        "source_locations":

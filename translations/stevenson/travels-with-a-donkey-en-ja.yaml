        "original_unit_id": "line-3231-3250"
    "translation_ja": "日の消える前に向こう側の眺めをどうしても見たいので、モデスティーヌに出せるだけの速さで急いだ。だが頂についたのは夜だった。月は高く澄んでおり、西に灰色の夕明かりが数条残るだけだった。口を開いた谷が、闇をたたえ、創られた自然の穴のように足もとに横たわっていた。だが山々の輪郭は空を背景にくっきりしていた。あれがカスタネの根城、エグアル山だった。カスタネは大胆に事を起こす行動派だった。だがカミザールの中でもこの男に触れておきたいのは、そのためばかりではない。月桂冠には薔薇が一枝まじり、多くの人を巻きこむ悲劇の中にさえ恋は道を通すことを、身をもって示したのだ。戦の真っ盛りに、山の砦で、マリエットという若く美しい娘と結婚した。たいへんな祝いになり、新郎はめでたいことを記念して、捕虜を二十五人解放した。七か月後、あざけりをこめてセヴェンヌの姫君と呼ばれたマリエットは、お上の手に落ち、ひどい目にあいそうになった。だがカスタネは実行力があり、妻を愛した。ヴァルローグを襲うと、そこで一人の婦人を人質に取り、この戦であとにも先にも一度だけ、捕虜の交換が行われた。エグアル山での星の夜がもたらした愛のしるし、二人の娘の子孫は今もいる。"
    "translation_status": "reviewed"
  - "id": "td-357"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Modestine and I—it was our last meal together—had a snack upon the top of St. Pierre, I on a heap of stones, she standing by me in the moonlight and decorously eating bread out of my hand. The poor brute would eat more heartily in this manner; for she had a sort of affection for me, which I was soon to betray."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[323]"
        "line_start": 3111
        "line_end": 3115
        "source_sequence": 3111
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3252

  - "id": "td-061"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘In the morning,’ said the husband, ‘I will make you something better than your cane. Such a beast as that feels nothing; it is in the proverb—dur comme un âne; you might beat her insensible with a cudgel, and yet you would arrive nowhere.’"

  - "id": "td-218"
    "section_id": "across-the-goulet"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Over the summit of the Goulet there was no marked road—only upright stones posted from space to space to guide the drovers. The turf underfoot was springy and well scented. I had no company but a lark or two, and met but one bullock-cart between Lestampes and Bleymard. In front of me I saw a shallow valley, and beyond that the range of the Lozère, sparsely wooded and well enough modelled in the flanks, but straight and dull in outline. There was scarce a sign of culture; only about Bleymard, the white high-road from Villefort to Mende traversed a range of meadows, set with spiry poplars, and sounding from side to side with the bells of flocks and herds."
    "source_languages":
      - "en"
    "source_locations":

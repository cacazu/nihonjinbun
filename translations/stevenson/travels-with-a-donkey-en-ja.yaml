  - "id": "td-301"
    "section_id": "florac"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On a branch of the Tarn stands Florac, the seat of a sub-prefecture, with an old castle, an alley of planes, many quaint street-corners, and a live fountain welling from the hill. It is notable, besides, for handsome women, and as one of the two capitals, Alais being the other, of the country of the Camisards."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

        "original_unit_id": "/html/body/p[175]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1667-1668"
    "translation_ja": "「いわれのない恥ずかしさで、ためらってはいけません」と、司祭は励ました。"
    "translation_status": "reviewed"
  - "id": "td-195"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For one who feels very similarly to all sects of religion, and who has never been able, even for a moment, to weigh seriously the merit of this or that creed on the eternal side of things, however much he may see to praise or blame upon the secular and temporal side, the situation thus created was both unfair and painful. I committed my second fault in tact, and tried to plead that it was all the same thing in the end, and we were all drawing near by different sides to the same kind and undiscriminating Friend and Father. That, as it seems to lay spirits, would be the only gospel worthy of the name. But different men think differently; and this revolutionary aspiration brought down the priest with all the terrors of the law. He launched into harrowing details of hell. The damned, he said—on the authority of a little book which he had read not a week before, and which, to add conviction to conviction, he had fully intended to bring along with him in his pocket—were to occupy the same attitude through all eternity in the midst of dismal tortures. And as he thus expatiated, he grew in nobility of aspect with his enthusiasm."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[176]"
        "line_start": 1654
        "line_end": 1670
        "source_sequence": 1654
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1670
        "line_end": 1686
        "source_sequence": 1670
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[176]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1670-1686"
    "translation_ja": "どの宗派にも似たような思いを抱き、現世の、つかの間の側面にはいくらでも褒めるところや責めるところが見えても、永遠の側面について、この教えとあの教えの値打ちを真剣に量ることなど一瞬でもできたためしのない者には、このような状況は公正を欠き、苦しかった。私は二度目の物の言い損ないをし、結局は同じこと、異なる道から、誰もえこひいきなさらぬ同じ優しい友、同じ父に、皆が近づいているのだと弁じようとした。聖職にない者には、それだけが福音の名に値するように思えるのだ。しかし人が違えば考えも違う。この革命的な望みを口に出すと、司祭は律法にある恐ろしさを残らず伴って降りかかってきた。地獄のありさまを、わが身が凍るほどことこまかに語り出したのである。罰を受ける者は、陰惨な責め苦のただ中で、永遠に同じ姿勢を取らねばならないと説いた。ほんの数日前に読んだ小冊子がその典拠で、念には念を入れ、ポケットに入れて持ってこようと、その気でいたものだそうだ。そうして説きつづけるうちに、熱をこめればこめるほど、人相が立派に見えてきた。"
    "translation_status": "reviewed"
  - "id": "td-196"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As a result the pair concluded that I should seek out the Prior, since the Abbot was from home, and lay my case immediately before him."

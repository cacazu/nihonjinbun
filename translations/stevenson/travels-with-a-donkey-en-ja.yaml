        "original_unit_id": "/html/body/p[7]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-59-66"
    "translation_ja": "どんな本も、内輪の意味では、書き手が友人たちに宛てて出す回状です。真意をくみとるのは友だけで、あちこちに置いてある私信や、友情の証しや、感謝の言葉を見つけるのです。世間は、郵便代を持ってくれる気前のよい後援者にすぎません。とはいえ、手紙は万人に宛てたものでも、封筒の表にはひとりの名を書くという、古くも心温まるならわしがあります。友を誇らずに、いったい何を誇ればいいのでしょう。ですから、親愛なるシドニー・コルヴィン、私は誇りをもって、心をこめて、あなたの友と署名します。"
    "translation_status": "reviewed"
    "source_kind": "author_dedication"

        "line_start": 1083
        "line_end": 1093
        "source_sequence": 1083
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[118]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1083-1093"
    "translation_ja": "朝っぱらからこの素敵な飲み物を口にし、彼女には片づける用がいくらもあったので、私はココアを一杯、自分で作ってよいと言われ、いやそれどころか、作ってくれと頼まれた。靴と脚絆を吊るして乾かしていると、膝の上で日記を書こうとするのを見て、長女が炉の隅の蝶番つきの卓を下ろしてくれた。そこで私はものを書き、ココアを飲み、しまいにはオムレツも食べてから宿を出た。卓には厚く埃が積もっていた。話によると冬にしか使わないそうだ。煙突の真下から、褐色の煤のこぶと青い煙越しに空が見えた。火に小枝がひとつかみ放りこまれるたびに、私は炎に脚を焼かれた。"
    "translation_status": "reviewed"

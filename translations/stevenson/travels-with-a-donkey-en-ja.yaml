    "translation_ja": "腹いっぱい、しっかり食べると、アンブロワーズ修道士という、気さくで話し好きなフランス人が（客の世話をする者はみな話す自由がある）、黙想に来た人々のためにあてた棟の小さな部屋へ案内してくれた。きれいに漆喰を塗り、備えつけは必要ぎりぎりのものだった。磔刑像、先代の教皇の胸像、フランス語の『キリストにならいて』、宗教の黙想の本が一冊、それに『エリザベス・シートン伝』。どうやら北米、とりわけニューイングランドに福音を伝えた人らしい。私の経験にかぎっても、このあたりにはもう少し伝道の余地が十分ある。だがコットン・マザーのことを考えてみてほしい。彼がいてくれればと願う天国で、この小著を読み聞かせてみたいものだ。もっとも、もうすっかり知っているかもしれないし、さらにずっと多くのことも知って、シートン夫人とすこぶる親しい友同士となり、永遠の詩篇に喜んで声を合わせているのかもしれない。部屋の目録を結ぶと、卓の上には黙想客の規則が掛けてあった。どの礼拝に出席し、いつ数珠を繰り、あるいは黙想し、いつ起きていつ休むか。一番下には目を引く注意書きがあった。「自由時間は良心の省察、告解、善き決意を立てること等に用いる」。善き決意を立てるとは、なるほど。頭に髪の毛を生やせと言うのも同じくらい実りがあろう。"

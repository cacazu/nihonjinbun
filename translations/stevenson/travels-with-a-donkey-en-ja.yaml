  - "id": "td-054"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He was a mild, handsome, sensible, friendly old man, astonishingly ignorant. His wife, who was not so pleasant in her manners, knew how to read, although I do not suppose she ever did so. She had a share of brains and spoke with a cutting emphasis, like one who ruled the roast."
    "source_languages":

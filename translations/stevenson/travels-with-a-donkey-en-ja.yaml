        "original_unit_id": "/html/body/p[243]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2483-2494"
    "translation_ja": "九月三十日、月曜の朝の灰色の明かりの中で、さほど遠くない石を踏む足音に目がさめた。目を開くと、今まで気づかなかった細道を、百姓が栗の木の間を行くところだった。右も左も見ず、数歩で葉の間に消えた。見つからずにすんだ！ しかしもう腰を上げてもいいころ、いや遅いくらいだった。百姓は仕事に出はじめた。何者と説明のつかない私の立場では、恐れを知らぬカミザールにとってのプール隊長の兵隊に劣らず、おそろしい人々だった。急いでモデスティーヌに食事を与え、寝袋へ戻りかけると、男と少年が一人ずつ、私の行く手を横切るように山腹を下りてきた。何やら分からぬ言葉で呼びかけられ、私も言葉にならぬが愛想のよい声を返し、脚絆をつけに急いだ。"
    "translation_status": "reviewed"

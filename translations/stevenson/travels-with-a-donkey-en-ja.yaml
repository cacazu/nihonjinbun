    "translation_ja": "正直に言って、これほど捜すだけの値打ちがあるとは思えなかった。これといった通りもなく、丸太や粗朶を積んだ空き地をところどころ挟む、ちぎれちぎれの村。傾いた十字架が二つに、小丘の上には〈すべての恵みの聖母〉の祠。それらがむき出しの谷の片隅、音を立てて流れる高地の川に沿ってあった。あなたがたは何を見に出かけたのか、と心の中でつぶやいた。だがこの地にもそれなりの暮らしがある。小さな今にも倒れそうな教会に、シェラールの前年の施しを記念する板が旗印のように掲げてあった。それによると一八七七年、住民は「信仰伝播事業」に四十八フラン十サンチームを献金したという。このうちいくらかはわが母国に回されないものかと、思わずにはいられなかった。シェラールはエディンバラの闇にある魂のために小銭をかき集め、一方バルクィダーやダンロスネスではローマの無知を嘆いている。かくして私たちは、雪の中でいがみ合う学童のように、福音伝道者を互いに投げつけ、天使たちを大いに楽しませる。"
    "translation_status": "reviewed"
  - "id": "td-128"
    "section_id": "cheylard-and-luc"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The inn was again singularly unpretentious. The whole furniture of a not ill-to-do family was in the kitchen: the beds, the cradle, the clothes, the plate-rack, the meal-chest, and the photograph of the parish priest. There were five children, one of whom was set to its morning prayers at the stair-foot soon after my arrival, and a sixth would ere long be forthcoming. I was kindly received by these good folk. They were much interested in my misadventure. The wood in which I had slept belonged to them; the man of Fouzilhac they thought a monster of iniquity, and counselled me warmly to summon him at law—‘because I might have died.’ The good wife was horror-stricken to see me drink over a pint of uncreamed milk."
    "source_languages":
      - "en"
    "source_locations":

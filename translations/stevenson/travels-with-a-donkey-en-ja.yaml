  - "id": "td-056"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And the old gentleman signified acquiescence with his head. There was no contempt on her part, and no shame on his; the facts were accepted loyally, and no more about the matter."

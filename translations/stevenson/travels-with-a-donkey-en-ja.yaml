"provenance":
  "construction_note_ja": "原文は1907年刊本の電子翻刻。各段落・引用・見出しをHTMLの実順で分け、空白を整えた。詩の改行・字下げ、イタリック、HTMLとTXTの両位置を保持。HTML版原文では上ジェヴォーダン（続き）がh3だが、後続二章の親なので部として構造化した。印刷脚注・巻末注は底本にない。"
  "independent_full_review":
    "status": "complete"
    "completed_at": "2026-11-28T10:33:36Z"
    "bilingual_ja": "凍結完稿の369単位を標題から別れの最終段落まで順に、英仏語等の原文と訳文で独立全文対照。PG #535 1907年版のHTML本文168–3169行の全要素・XPathと、TXT39–3323行の非空行を照合。献辞、五部十八章、詩五箇所二十四行、著者の発音注、版記、図版の位置を確認。Walter Crane原口絵の高解像度JPEGを直接見て、絵柄とalt、作者クレジット、画像の寸法・識別子・SHAを確認。英仏語の固有名と聖書の掛詞、モデスティーヌの歩調、宗派間の会話、歴史と旅の切り替えを校合。十月二日が水曜・木曜と重複する底本を訂正せず維持し、フランス語のletも底本のままとした。"
    "japanese_readthrough_ja": "対照パスを一旦終えて修正を反映し、原文を並べず日本語のみで全369単位を読書順に再通読。出発時の諧謔、宿の会話、修道院で改宗を勧められる場面、山中の親切と不安、カミザール史に重なる宗派の対話、ロバとの別れの語調を確認。モデスティーヌの動作主と照応、聖職者の呼び名、光や夜の風景、引用の言いさしの運びを再調整。変更箇所をソースと再確認し、詩の改行と字下げ、発音注の文字位置を再検証。"
    "draft_sha256": "7eec16123a9ef24e88990bc55e61a0aa25e6ed6edb0596bd90df6113179e8a8d"

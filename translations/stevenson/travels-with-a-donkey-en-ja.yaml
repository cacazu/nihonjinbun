    "translation_ja": "公正であることを、簡単だと思ったためしがない。思ったよりも難しいと、日ごとに知らされる。正直なところ、このプロテスタントたちと会ったときはうれしく、故郷に帰ったように感じた。その言葉を話し慣れていたからだ。フランス語と英語を分けるのとは別の、もっと深い意味での言葉である。本当のバベルとは、道徳が行き違うことだからだ。だからカトリックとよりもプロテスタントと、気兼ねなく話せ、その人たちをもっと公正に判断できた。アポリナリス神父とあの山のプリマス・ブレザレンの友は、偽りのない敬虔な老人同士で、一組にできよう。だが私はトラピストの人の美徳を、同じようにすんなり感じとっただろうか。カトリックだったなら、ラ・ヴェルネードで主流の教会に属さないあの人に、あれほど温かい心を持てただろうか。先の人とはただ大目に見合う仲だった。あとの人とは誤解があり、話すことを選びはしたが、それでも話を交わし、偽りのない思いをいくつか分け合えた。この不完全な世の中では、たとえ一部だけでも親しみが得られればうれしい。そしてたった一人でも、心の底から自由に話せ、偽りなく愛と素朴さのうちに歩める人が見つかれば、世の中にも神にも、文句を言う筋はない。"
    "translation_status": "reviewed"

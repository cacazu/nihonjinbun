    "translation_status": "reviewed"
  - "id": "td-292"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The old man assured me he thought as I did, and repeated his expressions of pleasure at meeting me. ‘We are so few,’ he said. ‘They call us Moravians here; but down in the Department of Gard, where there are also a good number, they are called Derbists, after an English pastor.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"

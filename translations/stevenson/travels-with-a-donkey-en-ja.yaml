        "line_start": 2482
        "line_end": 2486
        "source_sequence": 2482
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2573
        "line_end": 2576
        "source_sequence": 2573
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[262]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2573-2576"
    "translation_ja": "老人は、自分も同じ考えだと請け合い、私に会った喜びを、繰り返し口にした。「私たちは数があまりに少ないんです。ここでは私たちをモラヴィア派と呼びますが、南のガール県に下れば、そこにも相当数いて、イギリスの牧師から名をとってダービー派と呼ばれています」"
    "translation_status": "reviewed"
  - "id": "td-293"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I began to understand that I was figuring, in questionable taste, as a member of some sect to me unknown; but I was more pleased with the pleasure of my companion than embarrassed by my own equivocal position. Indeed, I can see no dishonesty in not avowing a difference; and especially in these high matters, where we have all a sufficient assurance that, whoever may be in the wrong, we ourselves are not completely in the right. The truth is much talked about; but this old man in a brown nightcap showed himself so simple, sweet, and friendly, that I am not unwilling to profess myself his convert. He was, as a matter of fact, a Plymouth Brother. Of what that involves in the way of doctrine I have no idea nor the time to inform myself; but I know right well that we are all embarked upon a troublesome world, the children of one Father, striving in many essential points to do and to become the same. And although it was somewhat in a mistake that he shook hands with me so often and showed himself so ready to receive my words, that was a mistake of the truth-finding sort. For charity begins blindfold; and only through a series of similar misapprehensions rises at length into a settled principle of love and patience, and a firm belief in all our fellow-men. If I deceived this good old man, in the like manner I would willingly go on to deceive others. And if ever at length, out of our separate and sad ways, we should all come together into one common house, I have a hope, to which I cling dearly, that my mountain Plymouth Brother will hasten to shake hands with me again."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[263]"
        "line_start": 2487
        "line_end": 2510
        "source_sequence": 2487
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2578
        "line_end": 2600
        "source_sequence": 2578
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[263]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2578-2600"
    "translation_ja": "無作法かもしれないが、自分のまるで知らない宗派の一員として通っていたのだと、分かりはじめた。だが自分のあやふやな立場に気をもむより、連れの喜ぶのをうれしく思った。なにしろ、違いを打ち明けないことに、私は不実を見いだせない。誰が間違っているにせよ、自分たちこそ完全に正しいわけはないと、みな十分承知しているこのような重大事では、なおさらだ。真理は口にされてばかりだが、この茶色の寝帽子をかぶった老人は、じつに純朴で、優しく親しげだったので、彼に改宗させられた者と名乗っても、一向にいやではない。実のところ彼はプリマス・ブレザレンの一人だった。教義のうえで何を意味するかは知らず、調べる暇もない。だが私たちがみな、一人の父の子として、厄介な世界に船出し、大事な多くの点で同じことをし、同じものになろうと励んでいることは、よく知っている。何度も握手し、喜んで私の言葉を受け入れたのはいくらか思い違いからだったにせよ、真実へ近づくたぐいの思い違いだった。慈愛は目をふさがれたところから始まるのであって、こうした取り違いをいくつも経てようやく、愛と忍耐を定まった原則とし、すべての同胞を固く信じるようになる。この善良な老人を欺いたというなら、同じ方法で、喜んでこれからも人を欺きたい。そしていつの日か、ばらばらの悲しい道を抜け、みなが一つの家に集まることがあれば、あの山のプリマス・ブレザレンの友が、急いでまた握手をしに来てくれるという望みを、私は大切に抱きつづける。"
    "translation_status": "reviewed"
  - "id": "td-294"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Thus, talking like Christian and Faithful by the way, he and I came down upon a hamlet by the Tarn. It was but a humble place, called La Vernède, with less than a dozen houses, and a Protestant chapel on a knoll. Here he dwelt; and here, at the inn, I ordered my breakfast. The inn was kept by an agreeable young man, a stone-breaker on the road, and his sister, a pretty and engaging girl. The village schoolmaster dropped in to speak with the stranger. And these were all Protestants—a fact which pleased me more than I should have expected; and, what pleased me still more, they seemed all upright and simple people. The Plymouth Brother hung round me with a sort of yearning interest, and returned at least thrice to make sure I was enjoying my meal. His behaviour touched me deeply at the time, and even now moves me in recollection. He feared to intrude, but he would not willingly forego one moment of my society; and he seemed never weary of shaking me by the hand."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[264]"
        "line_start": 2511
        "line_end": 2525
        "source_sequence": 2511
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2602
        "line_end": 2615
        "source_sequence": 2602
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[264]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2602-2615"
    "translation_ja": "こうして『天路歴程』のクリスチャンとフェイスフルのように、道々話しながら、二人でタルン河畔の小さな集落へ下っていった。ラ・ヴェルネードというつつましい場所で、家は十二軒にも満たず、小丘にプロテスタントの礼拝堂がある。老人はここに住んでおり、私もここの宿で朝食を頼んだ。宿をやっているのは、道路で石割りをする感じのよい若者と、かわいく愛想のよいその妹だった。村の学校の先生が、よそ者と話しに寄った。みなプロテスタントだった。自分でも思った以上にそれを喜んだが、それよりもっと喜ばしかったのは、みな実直で素朴な人らしかったことだ。プリマス・ブレザレンの老人はいかにも名残を惜しむように私のそばを離れず、食事を楽しんでいるか確かめるため、三度は戻ってきた。ふるまいにはその場で深く心を動かされ、いま思い返しても胸を打たれる。邪魔になるのを恐れながら、私といられる一瞬といえども棒に振りたくなかったのだ。私と握手しては、いつまでたっても飽きないらしかった。"
    "translation_status": "reviewed"
  - "id": "td-295"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When all the rest had drifted off to their day’s work, I sat for near half an hour with the young mistress of the house, who talked pleasantly over her seam of the chestnut harvest, and the beauties of the Tarn, and old family affections, broken up when young folk go from home, yet still subsisting. Hers, I am sure, was a sweet nature, with a country plainness and much delicacy underneath; and he who takes her to his heart will doubtless be a fortunate young man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[265]"
        "line_start": 2526
        "line_end": 2532
        "source_sequence": 2526
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2617
        "line_end": 2623
        "source_sequence": 2617
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[265]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2617-2623"
    "translation_ja": "ほかの者がみなその日の仕事へと散ってから、宿の若い女主人と半時間近く腰を据えた。縫い物の手を動かしながら、栗の取り入れや、タルンの美しさ、若者が家を去るとき一度は裂けても、なお残る昔ながらの家族の情のことなどを、心地よく話してくれた。きっと心根がやさしく、田舎の素朴さの奥にたいへん繊細なものを持っていたのだろう。彼女を心に迎える若者は、間違いなく幸せ者だ。"
    "translation_status": "reviewed"
  - "id": "td-296"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The valley below La Vernède pleased me more and more as I went forward. Now the hills approached from either hand, naked and crumbling, and walled in the river between cliffs; and now the valley widened and became green. The road led me past the old castle of Miral on a steep; past a battlemented monastery, long since broken up and turned into a church and parsonage; and past a cluster of black roofs, the village of Cocurès, sitting among vineyards, and meadows, and orchards thick with red apples, and where, along the highway, they were knocking down walnuts from the roadside trees, and gathering them in sacks and baskets. The hills, however much the vale might open, were still tall and bare, with cliffy battlements and here and there a pointed summit; and the Tarn still rattled through the stones with a mountain noise. I had been led, by bagmen of a picturesque turn of mind, to expect a horrific country after the heart of Byron; but to my Scottish eyes it seemed smiling and plentiful, as the weather still gave an impression of high summer to my Scottish body; although the chestnuts were already picked out by the autumn, and the poplars, that here began to mingle with them, had turned into pale gold against the approach of winter."
    "source_languages":
      - "en"
    "source_locations":

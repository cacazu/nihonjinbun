    "translation_ja": "下り坂の一部始終は、あまりの速さで駆けぬけたので、夢のようである。頂を離れたそばから谷が道のまわりを塞ぎ、低地のよどんだ空気の中を歩く私に、日が照りつけた。小道はいつしか道になり、ゆるやかに上ったり下ったりした。家を一軒また一軒と通りすぎたが、どれも留守らしく、人っ子一人見えず、流れの音のほかは何も聞こえなかった。だがきのうとはまったく違う国だった。この地では、世界の岩の骨組みが、陽と大気のなかにたくましくむき出しになっている。斜面は急で変化に富む。樫の木が丘にしがみついていた。よく育ち、葉を豊かに繁らせ、秋が強く光る色で触れていった。その右、または左から、雪白の大岩が乱れ立つ峡谷を伝い、ところどころ別の流れが落ちて合わさった。底の川は（道々、小走りに至るところから水を集め、たちまち川と呼べるものになったのだが）、あるところでは凄まじい早瀬でしばし泡立ち、あるところでは水を含んだ茶色が走る、心奪われる海の緑の淵に横たわっていた。私の旅したかぎり、あれほど色の移ろいやすい、繊細な川を見たことはない。水晶さえこれほど澄まず、牧草地の緑さえ半分にも及ばない。淵を見るたび、ほこりをかぶり熱く、いかにも物質めいた服を早く脱ぎすて、裸の身を山の空気と水に浸したいとうずいた。歩くあいだ、それが安息日だということは片時も忘れなかった。静けさがさかんに思い出させた。心の耳に、ヨーロッパじゅうに鳴りたてる教会の鐘と、千の教会の詩篇が聞こえた。"
    "translation_status": "reviewed"
  - "id": "td-240"
    "section_id": "across-the-lozere"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At length a human sound struck upon my ear—a cry strangely modulated between pathos and derision; and looking across the valley, I saw a little urchin sitting in a meadow, with his hands about his knees, and dwarfed to almost comical smallness by the distance. But the rogue had picked me out as I went down the road, from oak wood on to oak wood, driving Modestine; and he made me the compliments of the new country in this tremulous high-pitched salutation. And as all noises are lovely and natural at a sufficient distance, this also, coming through so much clean hill air and crossing all the green valley, sounded pleasant to my ear, and seemed a thing rustic, like the oaks or the river."
    "source_languages":
      - "en"

        "original_unit_id": "/html/body/p[181]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1706-1712"
    "translation_ja": "どうやら結局、私は、ある陽気なインドの批評家にそう呼ばれたとおり、「気まぐれなことに凝る快楽主義者」なのだろう。この修道士が語った動機に、いくらかショックを受けたのだから。別に得るものを当てにするのではなく、この生活そのもののためにこれを選んだと思いたかった。こちらがせいいっぱい心を寄せているときでさえ、善良なトラピスト会の人々といかに根深い隔たりがあったか、分かろうというものだ。だが、教区司祭にはこの論法が決定打と見えたらしい。"
    "translation_status": "reviewed"

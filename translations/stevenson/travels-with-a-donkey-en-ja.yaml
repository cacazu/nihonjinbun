    "translation_ja": "そうして一同が同意しているとき、つい口をすべらせたのが、よりによってガンベッタの穏健さを褒める一言だった。古参軍人の顔には一瞬で血がのぼり、悪い子のように両の掌で卓を叩いた。"
    "translation_status": "reviewed"

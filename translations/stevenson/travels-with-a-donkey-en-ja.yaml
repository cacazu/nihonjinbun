        "original_unit_id": "/html/body/p[99]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-901-904"
    "translation_ja": "私は男を見つめた。顔には芝居でない恐怖と、本当の恥ずかしさがせめぎ合っていた。哀れな笑みを浮かべ、悪さを見つかった生徒のように、唇を舌で湿している。私の窮状をかいつまんで述べ、いったいどうすればよいのだと尋ねた。"
    "translation_status": "reviewed"

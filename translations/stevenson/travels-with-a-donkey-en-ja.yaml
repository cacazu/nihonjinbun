  - "id": "td-243"
    "section_id": "pont-de-montvert"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "One of the first things I encountered in Pont de Montvert was, if I remember rightly, the Protestant temple; but this was but the type of other novelties. A subtle atmosphere distinguishes a town in England from a town in France, or even in Scotland. At Carlisle you can see you are in the one country; at Dumfries, thirty miles away, you are as sure that you are in the other. I should find it difficult to tell in what particulars Pont de Montvert differed from Monastier or Langogne, or even Bleymard; but the difference existed, and spoke eloquently to the eyes. The place, with its houses, its lanes, its glaring river-bed, wore an indescribable air of the South."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

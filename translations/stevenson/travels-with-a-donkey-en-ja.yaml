        "original_unit_id": "/html/body/p[292]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2960-2962"
    "translation_ja": "「狼がいます」と言った。「それにあなたがイギリス人だということは知れ渡っています。イギリス人はいつも金回りがよいから、ある晩、ひどい一撃を食わせてやろうと思いつく者がいてもおかしくない」"
    "translation_status": "reviewed"
  - "id": "td-326"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I told him I was not much afraid of such accidents; and at any rate judged it unwise to dwell upon alarms or consider small perils in the arrangement of life. Life itself, I submitted, was a far too risky business as a whole to make each additional particular of danger worth regard. ‘Something,’ said I, ‘might burst in your inside any day of the week, and there would be an end of you, if you were locked into your room with three turns of the key.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[293]"
        "line_start": 2846
        "line_end": 2852
        "source_sequence": 2846
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2964
        "line_end": 2970
        "source_sequence": 2964
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[293]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2964-2970"
    "translation_ja": "そんな災難はさほど怖くないと、私は言った。どっちみち、暮らし方を決めるのに、恐れにこだわり、ささいな危険まで勘定に入れるのは賢くないと思う。人生そのものが、全体としてあまりに危険な仕事なのだから、そのうえ小さな危険を一つずつ数えたところでしかたない。「何かが」と私は言った。「一週間のいつだって、内臓でぷつりと破裂しかねません。部屋にこもって、鍵を三度回しておいたとしても、それでおしまいですよ」"
    "translation_status": "reviewed"

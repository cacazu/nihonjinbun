    "translation_ja": "しかし彼はそんなとんでもない態度には我慢ならなかった。「いけない、いけない」と叫んだ。「改めねばなりません。あなたはここに来た、神がここに導いた。機会をつかまねばなりません」"
    "translation_status": "reviewed"
  - "id": "td-190"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I made a slip in policy; I appealed to the family affections, though I was speaking to a priest and a soldier, two classes of men circumstantially divorced from the kind and homely ties of life."
    "source_languages":
      - "en"

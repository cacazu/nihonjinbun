  - "id": "td-289"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The old man said he was delighted. ‘Hold,’ he added, striking his bosom; ‘it makes me happy here.’ There were a few who knew the Lord in these valleys, he went on to tell me; not many, but a few. ‘Many are called,’ he quoted, ‘and few chosen.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"

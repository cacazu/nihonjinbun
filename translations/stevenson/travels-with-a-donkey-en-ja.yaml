        "original_unit_id": "/html/body/p[220]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2286-2302"
    "translation_ja": "その翌晩、一七〇二年七月二十四日、伝道監察官がポン・ド・モンヴェールの牢屋敷に座っていると、ある音に心を乱された。詩篇をうたう大勢の男の張り上げた声が、町を抜け、刻々と近づいてくる。夜の十時、司祭、兵士、召使など十二人から十五人をまわりに集めていた。あろうことか自分の窓の真下で秘密集会を開く気かと恐れ、兵士を出し、様子を報告させた。だが詩篇をうたう者たちはすでに戸口にいた。五十人ばかり、神がかりのセギエに導かれ、殺気をみなぎらせていた。その呼びかけに、首席司祭は果敢な古参の迫害者らしく答え、手勢に群衆を撃てと命じた。この一斉射撃でカミザールが一人（この夜の働きで彼らがその名を得たとする説もある）倒れた。仲間は手斧と梁材で戸を破り、階下に殺到して捕虜を解き放った。その一人が「葡萄の蔓」と呼ぶ、当時その土地で用いられた「スカヴェンジャーの娘」に似た締め具にかかっているのを見つけると、デュ・シェイラに対する怒りは二倍となった。何度も襲いかかって上の階を取ろうとした。だが、向こうは部下の罪を赦しており、部下は勇敢に階段を守った。"
    "translation_status": "reviewed"

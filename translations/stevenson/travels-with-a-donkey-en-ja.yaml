  - "id": "td-348"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "That these continual stirs were once busy in St. Germain de Calberte, the imagination with difficulty receives; all is now so quiet, the pulse of human life now beats so low and still in this hamlet of the mountains. Boys followed me a great way off, like a timid sort of lion-hunters; and people turned round to have a second look, or came out of their houses, as I went by. My passage was the first event, you would have fancied, since the Camisards. There was nothing rude or forward in this observation; it was but a pleased and wondering scrutiny, like that of oxen or the human infant; yet it wearied my spirits, and soon drove me from the street."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[314]"
        "line_start": 3014
        "line_end": 3023
        "source_sequence": 3014
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3150
        "line_end": 3159
        "source_sequence": 3150
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[314]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3150-3159"
    "translation_ja": "この絶え間ない騒ぎが、いつかサン・ジェルマン・ド・カルベルトで渦巻いたとは、なかなか想像に浮かばない。今は万事があまりに静かで、この山の集落の人の暮らしは、低い静かな拍子で脈打っているのだから。少年たちは臆病な獅子狩りのように遠くからついてきて、人々は私が通ると振り返ってもう一度見たり、家から出てきたりした。私が通るまで、カミザール以来何の事件もなかったのかと思いかねない。たちの悪い、出すぎた観察ではなかった。牛か人間の赤ん坊かが、喜びと不思議のまじった目をこらすようなものだったが、気疲れして、ほどなく通りを出た。"
    "translation_status": "reviewed"
  - "id": "td-349"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I took refuge on the terraces, which are here greenly carpeted with sward, and tried to imitate with a pencil the inimitable attitudes of the chestnuts as they bear up their canopy of leaves. Ever and again a little wind went by, and the nuts dropped all around me, with a light and dull sound, upon the sward. The noise was as of a thin fall of great hailstones; but there went with it a cheerful human sentiment of an approaching harvest and farmers rejoicing in their gains. Looking up, I could see the brown nut peering through the husk, which was already gaping; and between the stems the eye embraced an amphitheatre of hill, sunlit and green with leaves."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[315]"
        "line_start": 3024
        "line_end": 3033
        "source_sequence": 3024
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3161
        "line_end": 3170
        "source_sequence": 3161
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[315]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3161-3170"
    "translation_ja": "ここの段々には芝が緑の絨毯になっていて、そこへ逃れ、栗の木が葉の天蓋を支える比類のない姿を、鉛筆で模してみた。ときおり小さな風が過ぎ、まわり一面、軽くも鈍い音をたてて、栗の実が芝に落ちた。大きな雹がまばらに降るような音だが、そこには収穫が近づき、農夫たちが実りを喜ぶという、人の暮らしの明るさが感じられた。見上げると、すでに口を開いた毬から、褐色の実がのぞいている。幹の間から、円形劇場をなすような丘々が見渡せた。日の光を浴び、葉の緑に染まっていた。"
    "translation_status": "reviewed"
  - "id": "td-350"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I have not often enjoyed a place more deeply. I moved in an atmosphere of pleasure, and felt light and quiet and content. But perhaps it was not the place alone that so disposed my spirit. Perhaps some one was thinking of me in another country; or perhaps some thought of my own had come and gone unnoticed, and yet done me good. For some thoughts, which sure would be the most beautiful, vanish before we can rightly scan their features; as though a god, travelling by our green highways, should but ope the door, give one smiling look into the house, and go again for ever. Was it Apollo, or Mercury, or Love with folded wings? Who shall say? But we go the lighter about our business, and feel peace and pleasure in our hearts."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[316]"
        "line_start": 3034
        "line_end": 3044
        "source_sequence": 3034
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3172
        "line_end": 3182
        "source_sequence": 3172
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[316]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3172-3182"
    "translation_ja": "これほど深くある場所を楽しんだことは、そう何度もない。喜びの空気の中を歩き、心は軽く、静かで、満ち足りていた。だがそんな心持ちにしてくれたのは、場所だけではなかったかもしれない。遠い国で誰かが私を思ってくれていたのかもしれない。あるいは自分でも気づかない思いが、来ては去り、それなのに益をもたらしたのかもしれない。きっと一番美しいであろう思いのなかには、面差しをろくに確かめる前に消えてしまうものがある。緑の街道を旅する神が、戸をちょっと開け、にこりと一度、家の中をのぞき、二度と戻らずに行くように。アポロンだったか、メルクリウスだったか、翼を畳んだ愛の神だったか。誰に分かろう。けれど私たちはそれから身軽に務めを果たし、胸に平安と喜びを感じる。"
    "translation_status": "reviewed"
  - "id": "td-351"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I dined with a pair of Catholics. They agreed in the condemnation of a young man, a Catholic, who had married a Protestant girl and gone over to the religion of his wife. A Protestant born they could understand and respect; indeed, they seemed to be of the mind of an old Catholic woman, who told me that same day there was no difference between the two sects, save that ‘wrong was more wrong for the Catholic,’ who had more light and guidance; but this of a man’s desertion filled them with contempt."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[317]"
        "line_start": 3045
        "line_end": 3052
        "source_sequence": 3045
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3184
        "line_end": 3190
        "source_sequence": 3184
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[317]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3184-3190"
    "translation_ja": "昼食をカトリックの二人ととった。カトリックの青年がプロテスタントの娘と結婚し、妻の宗教へ移ったことを、二人とも責めた。生まれつきのプロテスタントなら、理解もし、敬意を払うこともできる。それどころか、その日に会ったカトリックの老婆の考えに近いようだった。二つの宗派に違いはなく、光と導きをより多く受けるカトリックにとっては「同じ悪事でも罪が重い」というだけだというのだ。だが人が離反するこの場合には、二人とも侮蔑でいっぱいになった。"
    "translation_status": "reviewed"
  - "id": "td-352"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘It is a bad idea for a man to change,’ said one."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[318]"
        "line_start": 3053
        "line_end": 3053
        "source_sequence": 3053
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3192
        "line_end": 3192
        "source_sequence": 3192
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[318]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3192-3192"
    "translation_ja": "「人は信仰を変えたりしちゃいけませんよ」と一人が言った。"
    "translation_status": "reviewed"
  - "id": "td-353"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It may have been accidental, but you see how this phrase pursued me; and for myself, I believe it is the current philosophy in these parts. I have some difficulty in imagining a better. It’s not only a great flight of confidence for a man to change his creed and go out of his family for heaven’s sake; but the odds are—nay, and the hope is—that, with all this great transition in the eyes of man, he has not changed himself a hairbreadth to the eyes of God. Honour to those who do so, for the wrench is sore. But it argues something narrow, whether of strength or weakness, whether of the prophet or the fool, in those who can take a sufficient interest in such infinitesimal and human operations, or who can quit a friendship for a doubtful process of the mind. And I think I should not leave my old creed for another, changing only words for other words; but by some brave reading, embrace it in spirit and truth, and find wrong as wrong for me as for the best of other communions."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[319]"
        "line_start": 3054
        "line_end": 3068
        "source_sequence": 3054
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3194
        "line_end": 3207
        "source_sequence": 3194
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[319]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3194-3207"
    "translation_ja": "偶然かもしれないが、この言葉が私のあとをどれほどついてきたかはお分かりだろう。ここらでは通用の哲学だと、私は信じている。これよりよいものは、ちょっと想像がつかない。信条を変え、天国のために家族のもとを出るのは、よほどの自信が要るばかりではない。人の目にはこれほど大きく変わっても、おそらく、いやそうあってほしいが、神の目には髪の毛一本ほども本人は変わっていない。そうする人には敬意を。心を引き裂くほどつらいことだから。ただ、こんな細かく人間くさい手続きに、それほど興味を持てる人や、心のこんな疑わしい変化一つで友情を捨てられる人には、強さゆえにせよ弱さゆえにせよ、預言者であれ愚か者であれ、どこか狭いところがあると言わねばならない。私なら、言葉を別の言葉と取り替えるだけで、古い信条を離れて別の信条には移らないと思う。むしろ勇気を出して読み直し、霊と真理においてもとの信条を受けとめ、どんなほかの教派の立派な人にとっても悪いことは、私にとっても同じように悪いと悟りたい。"
    "translation_status": "reviewed"
  - "id": "td-354"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The phylloxera was in the neighbourhood; and instead of wine we drank at dinner a more economical juice of the grape—La Parisienne, they call it. It is made by putting the fruit whole into a cask with water; one by one the berries ferment and burst; what is drunk during the day is supplied at night in water: so, with ever another pitcher from the well, and ever another grape exploding and giving out its strength, one cask of Parisienne may last a family till spring. It is, as the reader will anticipate, a feeble beverage, but very pleasant to the taste."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[320]"
        "line_start": 3069
        "line_end": 3077
        "source_sequence": 3069
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3209
        "line_end": 3216
        "source_sequence": 3209
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[320]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3209-3216"
    "translation_ja": "このあたりはブドウネアブラムシの被害にあっていた。昼食にはワインでなく、節約のきく葡萄の汁、ラ・パリジェンヌと彼らが呼ぶものを飲んだ。実を丸ごと水と一緒に樽へ入れて作る。粒が一つずつ発酵してはじけ、昼に飲んだ分を夜に水で補う。そうして、井戸から汲んだ水を水差しでもう一杯足すたび、また一粒とはじけて味を出し、一樽のパリジェンヌで一家は春までしのげることがある。お察しのとおり薄い飲み物だが、口あたりはたいそうよい。"
    "translation_status": "reviewed"
  - "id": "td-355"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "What with dinner and coffee, it was long past three before I left St. Germain de Calberte. I went down beside the Gardon of Mialet, a great glaring watercourse devoid of water, and through St. Etienne de Vallée Française, or Val Francesque, as they used to call it; and towards evening began to ascend the hill of St. Pierre. It was a long and steep ascent. Behind me an empty carriage returning to St. Jean du Gard kept hard upon my tracks, and near the summit overtook me. The driver, like the rest of the world, was sure I was a pedlar; but, unlike others, he was sure of what I had to sell. He had noticed the blue wool which hung out of my pack at either end; and from this he had decided, beyond my power to alter his decision, that I dealt in blue-wool collars, such as decorate the neck of the French draught-horse."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[321]"
        "line_start": 3078
        "line_end": 3089
        "source_sequence": 3078
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3218
        "line_end": 3229
        "source_sequence": 3218
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[321]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3218-3229"
    "translation_ja": "昼食やコーヒーで、サン・ジェルマン・ド・カルベルトを出たときは、三時をとうに回っていた。水のない、ぎらぎらとした大きな水路、ミアレのガルドンに沿って下り、サン・テティエンヌ・ド・ヴァレ・フランセーズ、昔はヴァル・フランセスクと呼んだところを抜け、夕方にかけてサン・ピエールの山を上りはじめた。長くて急な上りだった。サン・ジャン・デュ・ガールへ戻る空の馬車がすぐ後ろについてきて、頂近くでとうとう追い抜いた。御者も世間と同じで、私が行商人だと信じて疑わなかった。それもほかと違い、何を売っているかまで、よく分かっていた。荷の両端に垂れた青い羊の毛に気づき、それで私が、フランスの荷馬の首を飾る、青い毛織りの首輪を売っていると決めこんだ。私にはその決心を変える力はなかった。"
    "translation_status": "reviewed"
  - "id": "td-356"
    "section_id": "the-last-day"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had hurried to the topmost powers of Modestine, for I dearly desired to see the view upon the other side before the day had faded. But it was night when I reached the summit; the moon was riding high and clear; and only a few grey streaks of twilight lingered in the west. A yawning valley, gulfed in blackness, lay like a hole in created nature at my feet; but the outline of the hills was sharp against the sky. There was Mount Aigoal, the stronghold of Castanet. And Castanet, not only as an active undertaking leader, deserves some mention among Camisards; for there is a spray of rose among his laurel; and he showed how, even in a public tragedy, love will have its way. In the high tide of war he married, in his mountain citadel, a young and pretty lass called Mariette. There were great rejoicings; and the bridegroom released five-and-twenty prisoners in honour of the glad event. Seven months afterwards, Mariette, the Princess of the Cevennes, as they called her in derision, fell into the hands of the authorities, where it was like to have gone hard with her. But Castanet was a man of execution, and loved his wife. He fell on Valleraugue, and got a lady there for a hostage; and for the first and last time in that war there was an exchange of prisoners. Their daughter, pledge of some starry night upon Mount Aigoal, has left descendants to this day."
    "source_languages":
      - "en"
    "source_locations":

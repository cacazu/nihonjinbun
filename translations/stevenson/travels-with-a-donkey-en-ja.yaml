    "translation_ja": "それがどんな速さであったか、言い表すにはどんな悪口でももの足りない。歩くのが駆けるより遅いように、それは歩くより同じだけ遅かった。片足を上げたまま信じられないほど長いこと待たされ、五分もすれば気力は尽き、脚という脚の筋肉が火照ってくる。しかも、すぐそばにぴったりつき、一歩ごとに彼女に歩調を合わせなければならない。数ヤード遅れたり、逆に数ヤード先へ出たりしただけで、モデスティーヌはただちに止まって草を食べはじめるからだ。ここからアレまでこれがつづくと思うと、心が折れそうだった。考えうるかぎりで、これほど退屈な旅はあるまいと思われた。いい日よりではないかと自分に言い聞かせ、煙草で不安な心をなだめようとした。だが長い長い道が丘を上り谷を下り、そこを二つの影がちっぽけな歩みで、一分に一ヤード、一歩一歩進んでいる。悪夢の中で呪文をかけられたように、目的地には一向に近づかない。その光景がまぶたに焼きついて離れなかった。"
    "translation_status": "reviewed"

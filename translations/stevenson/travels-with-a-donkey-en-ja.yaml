    "translation_ja": "彼女を私に売ったとき、アダン爺さんは泣いた。私も売ってしまったあと、彼にならいたくなった。その場には乗合馬車の御者と、気のいい若い男が四、五人いるだけだったので、私はためらわず、こみ上げる気持ちに身をまかせた。"

  - "id": "td-213"
    "section_id": "across-the-goulet"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The wind fell during dinner, and the sky remained clear; so it was under better auspices that I loaded Modestine before the monastery gate. My Irish friend accompanied me so far on the way. As we came through the wood, there was Père Apollinaire hauling his barrow; and he too quitted his labours to go with me for perhaps a hundred yards, holding my hand between both of his in front of him. I parted first from one and then from the other with unfeigned regret, but yet with the glee of the traveller who shakes off the dust of one stage before hurrying forth upon another. Then Modestine and I mounted the course of the Allier, which here led us back into Gévaudan towards its sources in the forest of Mercoire. It was but an inconsiderable burn before we left its guidance. Thence, over a hill, our way lay through a naked plateau, until we reached Chasseradès at sundown."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[190]"
        "line_start": 1738
        "line_end": 1751
        "source_sequence": 1738
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1771
        "line_end": 1783
        "source_sequence": 1771
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[190]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1771-1783"
    "translation_ja": "昼食のうちに風はやみ、空も晴れたままだった。さい先もよく、修道院の門の前でモデスティーヌに荷を載せた。アイルランド人の友は道の途中まで一緒に来てくれた。森を通ると、アポリナリス神父が一輪車を引いていた。神父も手を止め、おそらく百ヤードほどをついてきてくれた。私の手を両手で包み、ずっと自分の前で握っていた。まず一人と、それからもう一人と別れたときは、偽りなく名残が惜しかった。だが、一行程の埃を払い落とし、次の行程へ急ぐ旅人の喜びもあった。それからモデスティーヌと私はアリエ川をさかのぼった。川は私たちをジェヴォーダンに戻し、水源のあるメルコワールの森のほうへと導いた。その導きと別れるころには、ほんの小川になっていた。そこから丘を一つ越え、むき出しの台地を行き、日没にシャスラデスに着いた。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "language"
        "span":
          "start": 229
          "end": 233
          "exact": "Père"
        "language": "fr"
  - "id": "td-214"
    "section_id": "across-the-goulet"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The company in the inn kitchen that night were all men employed in survey for one of the projected railways. They were intelligent and conversible, and we decided the future of France over hot wine, until the state of the clock frightened us to rest. There were four beds in the little upstairs room; and we slept six. But I had a bed to myself, and persuaded them to leave the window open."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[191]"
        "line_start": 1752
        "line_end": 1757
        "source_sequence": 1752
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1785
        "line_end": 1790
        "source_sequence": 1785
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[191]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1785-1790"
    "translation_ja": "その夜、宿の台所にいたのは、計画中の鉄道の一つで測量に雇われた男たちばかりだった。頭がよく話し好きで、時計を見てあわてて寝床に行くまで、温かなワインを飲みながらフランスの行く末を決めた。二階の小部屋に寝台が四つ、寝るのは六人。だが私は一つを独り占めし、窓を開けておくよう皆を説得した。"
    "translation_status": "reviewed"
  - "id": "td-215"
    "section_id": "across-the-goulet"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Hé, bourgeois; il est cinq heures!’ was the cry that wakened me in the morning (Saturday, September 28th). The room was full of a transparent darkness, which dimly showed me the other three beds and the five different nightcaps on the pillows. But out of the window the dawn was growing ruddy in a long belt over the hill-tops, and day was about to flood the plateau. The hour was inspiriting; and there seemed a promise of calm weather, which was perfectly fulfilled. I was soon under way with Modestine. The road lay for a while over the plateau, and then descended through a precipitous village into the valley of the Chassezac. This stream ran among green meadows, well hidden from the world by its steep banks; the broom was in flower, and here and there was a hamlet sending up its smoke."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":

  - "id": "td-368"
    "section_id": "farewell-modestine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "For twelve days we had been fast companions; we had travelled upwards of a hundred and twenty miles, crossed several respectable ridges, and jogged along with our six legs by many a rocky and many a boggy by-road. After the first day, although sometimes I was hurt and distant in manner, I still kept my patience; and as for her, poor soul! she had come to regard me as a god. She loved to eat out of my hand. She was patient, elegant in form, the colour of an ideal mouse, and inimitably small. Her faults were those of her race and sex; her virtues were her own. Farewell, and if for ever—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[332]"
        "line_start": 3158
        "line_end": 3166
        "source_sequence": 3158
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3310
        "line_end": 3318
        "source_sequence": 3310
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[332]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3310-3318"
    "translation_ja": "十二日のあいだ、二人はかたい絆で結ばれた仲間だった。百二十マイルを超えて旅し、なかなかの尾根をいくつか越え、岩だらけの、泥だらけの無数の脇道を、六本の脚でとぼとぼ来た。初日を過ぎてからは、ときに気を悪くしてよそよそしくなっても、辛抱を失わなかった。彼女のほうは、お気の毒にも、私を神さまのように思うようになっていた。私の手から食べるのが好きだった。辛抱強く、姿は上品で、非の打ちどころのない鼠色で、比類のない小ささだった。欠点はロバであり雌であることから来ていた。美点は彼女だけのものだった。さらば、そしてとこしえの別れならば……"
    "translation_status": "reviewed"

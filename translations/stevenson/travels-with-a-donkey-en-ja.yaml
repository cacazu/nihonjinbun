    "translation_ja": "まったく、いったい何をしていたのか。だが私はそこにいた。"
    "translation_status": "reviewed"
  - "id": "td-106"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘The great thing,’ said I, ‘is to make an end of it’; and once more proposed that he should help me to find a guide."

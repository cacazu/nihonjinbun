    "translation_ja": "八月十二日、ポン・ド・モンヴェールで、彼は右手を斬り落とされ、生きたまま焼かれた。魂は庭のようだったのか。キリスト教の殉教者デュ・シェイラの魂も、そうだったかもしれない。そして私の魂の中をあなたがのぞけたなら、あるいはあなたの魂の中を私がのぞけたなら、私たち自身の平然としたありさまも、同じくらい驚くべきかもしれない。"

        "original_unit_id": "/html/body/p[184]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1727-1730"
    "translation_ja": "昼食になると、「信仰伝播事業」が再開され、今度は私にはさらに不愉快だった。司祭は私の父祖の、取るに足らない信仰について何度も質問し、私が答えると、いわば聖職者風の忍び笑いで迎えた。"
    "translation_status": "reviewed"
  - "id": "td-204"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Your sect,’ he said once; ‘for I think you will admit it would be doing it too much honour to call it a religion.’"

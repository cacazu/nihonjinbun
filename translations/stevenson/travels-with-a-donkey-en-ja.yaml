        "line_start": 496
        "line_end": 507
        "source_sequence": 496
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[40]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-496-507"
    "translation_ja": "ほどなく街道に出たが、すぐ近くにずいぶん大きな村があるのを見て驚いた。湖のまわりに住むのは鱒だけだと聞いていたからだ。薄暮の道には、野から牛を連れ帰る子どもたちが立てた砂ぼこりが漂っていた。礼拝と市で郡の中心まで出ていた女が二人、ボンネットも帽子もつけたまま馬にまたがり、蹄を鳴らして速足で私を追い越した。子どもの一人にここはどこかと尋ねた。ブシェ・サン・ニコラだと言う。目指すところの一マイルほど南、かなりの高さの峰を挟んで向こう側である。あの紛らわしい道と当てにならない百姓たちは、私をこんなところまで導いたのだ。肩は擦り切れ、ひりひり痛んだ。腕はたえず棒を振るっていたためか歯痛のようにうずいた。私は湖も野宿の計画もあきらめ、宿屋のありかを尋ねた。"
    "translation_status": "reviewed"

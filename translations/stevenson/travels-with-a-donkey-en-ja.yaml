      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-253-271"
    "translation_ja": "出だしのいざこざからようやく解放され、入会地を抜けて坂を下りはじめたとき、モナスティエの鐘が九時を打った。まだ家々の窓から見えるあいだは、ひそかな恥ずかしさと、何か笑いものになる失敗が怖くて、モデスティーヌに下手な手出しはしなかった。彼女は四つの小さな蹄で、つつましくも小ぎれいな足どりでちょこちょこ進み、時おり耳や尻尾を振った。荷の下であまりに小さく見えるので、私の心は騒いだ。浅瀬は難なく渡った。従順そのものであることは疑いようもない。対岸に着き、松林の中を道が上りはじめると、私は罪深い杖を右手に取り、おののきながらロバに当てた。モデスティーヌは三歩ほど足を速めたかと思うと、前のメヌエットに戻った。もう一度やっても同じ、三度目も同じ。私はイギリス紳士の名に恥じぬ男で、女性に手荒なまねをするのは良心に反する。私は手を止め、頭から足の先まで眺めた。哀れな獣は膝を震わせ、息づかいも苦しげで、坂道でこれ以上速くは歩けまいと誰の目にも明らかだった。神にかけて、この罪のない生き物に残酷なことはするまい。この子には自分の速さで歩かせ、私は気長についてゆこう、と思った。"
    "translation_status": "reviewed"
  - "id": "td-026"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "What that pace was, there is no word mean enough to describe; it was something as much slower than a walk as a walk is slower than a run; it kept me hanging on each foot for an incredible length of time; in five minutes it exhausted the spirit and set up a fever in all the muscles of the leg. And yet I had to keep close at hand and measure my advance exactly upon hers; for if I dropped a few yards into the rear, or went on a few yards ahead, Modestine came instantly to a halt and began to browse. The thought that this was to last from here to Alais nearly broke my heart. Of all conceivable journeys, this promised to be the most tedious. I tried to tell myself it was a lovely day; I tried to charm my foreboding spirit with tobacco; but I had a vision ever present to me of the long, long roads, up hill and down dale, and a pair of figures ever infinitesimally moving, foot by foot, a yard to the minute, and, like things enchanted in a nightmare, approaching no nearer to the goal."
    "source_languages":
      - "en"
    "source_locations":

  - "id": "td-034"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was proud of my new lore, and thought I had learned the art to perfection. And certainly Modestine did wonders for the rest of the fore-noon, and I had a breathing space to look about me. It was Sabbath; the mountain-fields were all vacant in the sunshine; and as we came down through St. Martin de Frugères, the church was crowded to the door, there were people kneeling without upon the steps, and the sound of the priest’s chanting came forth out of the dim interior. It gave me a home feeling on the spot; for I am a countryman of the Sabbath, so to speak, and all Sabbath observances, like a Scottish accent, strike in me mixed feelings, grateful and the reverse. It is only a traveller, hurrying by like a person from another planet, who can rightly enjoy the peace and beauty of the great ascetic feast. The sight of the resting country does his spirit good. There is something better than music in the wide unusual silence; and it disposes him to amiable thoughts, like the sound of a little river or the warmth of sunlight."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[28]"
        "line_start": 419
        "line_end": 434
        "source_sequence": 419
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 321
        "line_end": 335
        "source_sequence": 321
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[28]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-321-335"
    "translation_ja": "新しく学んだことが得意で、ロバ使いの術はすっかり身についたと思った。実際、午前の残りのあいだ、モデスティーヌは驚くほどよく働き、私にもあたりを見まわす余裕ができた。安息日だった。山の畑は陽の光の中、人っ子一人いない。サン・マルタン・ド・フリュジェールを下ってゆくと、教会は戸口まで人でいっぱいで、外の階段で膝をつく人もいた。薄暗い堂内から司祭の詠唱が聞こえてくる。たちまちふるさとに帰ったような気がした。いわば安息日の国の人間にとって、安息日のしきたりは、スコットランド訛りと同じく、懐かしくもあればそうでなくもある、入りまじった気持ちを呼び覚ます。別の星の人のように足早に通りすぎる旅人にしてはじめて、この大いなる節制の祝日の静けさと美しさを、十分に味わえるのだ。休みについた田園を見れば、旅人の心は安らぐ。広々とした、ふだんにない静けさには、音楽もしのぐものがある。小川のせせらぎや日射しのぬくもりのように、心を穏やかな思いへ誘うのである。"
    "translation_status": "reviewed"
  - "id": "td-035"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In this pleasant humour I came down the hill to where Goudet stands in a green end of a valley, with Château Beaufort opposite upon a rocky steep, and the stream, as clear as crystal, lying in a deep pool between them. Above and below, you may hear it wimpling over the stones, an amiable stripling of a river, which it seems absurd to call the Loire. On all sides, Goudet is shut in by mountains; rocky footpaths, practicable at best for donkeys, join it to the outer world of France; and the men and women drink and swear, in their green corner, or look up at the snow-clad peaks in winter from the threshold of their homes, in an isolation, you would think, like that of Homer’s Cyclops. But it is not so; the postman reaches Goudet with the letter-bag; the aspiring youth of Goudet are within a day’s walk of the railway at Le Puy; and here in the inn you may find an engraved portrait of the host’s nephew, Régis Senac, ‘Professor of Fencing and Champion of the two Americas,’ a distinction gained by him, along with the sum of five hundred dollars, at Tammany Hall, New York, on the 10th April 1876."

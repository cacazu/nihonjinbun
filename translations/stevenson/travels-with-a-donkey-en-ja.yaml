    "source_text": "When I awoke (Thursday, 2nd October), and, hearing a great flourishing of cocks and chuckling of contented hens, betook me to the window of the clean and comfortable room where I had slept the night, I looked forth on a sunshiny morning in a deep vale of chestnut gardens. It was still early, and the cockcrows, and the slanting lights, and the long shadows encouraged me to be out and look round me."

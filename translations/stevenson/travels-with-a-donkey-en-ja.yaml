        "original_unit_id": "line-1688-1689"
    "translation_ja": "結局、二人は院長が留守だから、私が副院長を訪ね、すぐ事情を打ち明けるべきだと決めた。"
    "translation_status": "reviewed"
  - "id": "td-197"

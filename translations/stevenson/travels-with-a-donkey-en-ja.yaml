        "original_unit_id": "line-1400-1423"
    "translation_ja": "まず自分の部屋を見せてくれた。聖務日課書とヘブライ語の聖書と、『ウェイヴァリー』ものの小説に囲まれて時を過ごす。それから回廊、集会室、祭服室へ。そこには修道士の服とつばの広い麦わら帽子が掛けてあり、それぞれ修道名を書いた板がついていた。バシレイオス、ヒラリオン、ラファエル、パシフィックといった、伝説の香りを帯び、上品で心惹かれる名である。次に図書室。ヴイヨやシャトーブリアンの全著作があり、『オードとバラード』まであるから恐れ入る。モリエールもあった。無数の教父の著作や、地方史・一般史のさまざまな歴史家は言うまでもない。それから親切なアイルランド人は作業場をひと巡りさせてくれた。兄弟たちがパンを焼き、荷車の車輪を作り、写真を撮る。一人は珍品の収集をつかさどり、もう一人は兎の飼育棚の世話をする。トラピスト会の修道院では、皆それぞれ信仰上の勤めと院全体の仕事とは別に、自分で選んだ仕事を持っている。声と耳があれば聖歌隊で歌い、動かせる手があれば干し草作りに加わらねばならないが、自分の時間には、何かしていなければならないとはいえ、することは好きに選べる。ある修道士は文学をやっていると聞いた。アポリナリス神父は道造りに打ちこみ、修道院長は本の製本をする。そういえばこの院長が祝別されてからさほどたっていない。そのとき、特別のお許しで、母親は礼拝堂に入って祝別式を見ることができた。息子が司教冠を戴く修道院長になるとは、母親にはさぞ誇らしい一日だったろう。中に入れてくれたと思うとうれしくなる。"

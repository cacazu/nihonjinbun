    "translation_ja": "「請け合います」と彼は言った。「心の中では笑う気などないのです。あなたの魂が気にかかるほかには、何も思っておりません」"
    "translation_status": "reviewed"
  - "id": "td-208"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And there ended my conversion. Honest man! he was no dangerous deceiver; but a country parson, full of zeal and faith. Long may he tread Gévaudan with his kilted skirts—a man strong to walk and strong to comfort his parishioners in death! I daresay he would beat bravely through a snowstorm where his duty called him; and it is not always the most faithful believer who makes the cunningest apostle."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"

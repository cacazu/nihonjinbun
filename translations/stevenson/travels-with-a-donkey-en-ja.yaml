    "translation_ja": "決めるのは簡単だったが、やりとげるのは難しかった。この手で触れそうな、轟々と鳴る闇の中では、頼れるのは風向きだけである。そちらに向かって進んだ。道は消え、野を横切り、開けた沼地に出たかと思えば、モデスティーヌには越せない石垣に行く手を阻まれた。そのうち赤い窓がまたいくつか見えてきた。今度の窓は並び方が違っていた。フジリックでなくフジラック、場所はほとんど離れていなくとも、人の気質ではまるで別世界の集落だった。モデスティーヌを門に結び、岩につまずき、沼に脛の半ばまで浸かりながら手探りで進み、村の入口にたどり着いた。最初に明かりの見えた家には女が一人いて、戸を開けようとしない。ひとりで脚も悪いから何もできないと、戸越しに叫んだ。だが隣の家へ行けば男がいて、その気になれば助けてくれるだろう。"
    "translation_status": "reviewed"
  - "id": "td-089"

      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1455
        "line_end": 1465
        "source_sequence": 1455
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[151]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1455-1465"
    "translation_ja": "話した相手はみなめずらしく気立てがよく、物腰にも会話にも、聖なる朗らかさとしか呼びようのないものがあった。来訪者への心得には、修道士は口数が少ないのが道理だから、世話役の言葉が短くても気に障らないように、と書いてある。その注意は要らなかったろう。客の世話役は誰も彼も無邪気なおしゃべりでいっぱいで、私がいた間は、話を始めるより切り上げるほうが難しかった。世事に通じたミカエル神父を除けば、政治から旅から私の寝袋まで、何にでも親切で健やかな興味を示し、自分の声が聞こえることも、まんざら嫌いではないようであった。"
    "translation_status": "reviewed"
  - "id": "td-169"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As for those who are restricted to silence, I can only wonder how they bear their solemn and cheerless isolation. And yet, apart from any view of mortification, I can see a certain policy, not only in the exclusion of women, but in this vow of silence. I have had some experience of lay phalansteries, of an artistic, not to say a bacchanalian character; and seen more than one association easily formed and yet more easily dispersed. With a Cistercian rule, perhaps they might have lasted longer. In the neighbourhood of women it is but a touch-and-go association that can be formed among defenceless men; the stronger electricity is sure to triumph; the dreams of boyhood, the schemes of youth, are abandoned after an interview of ten minutes, and the arts and sciences, and professional male jollity, deserted at once for two sweet eyes and a caressing accent. And next after this, the tongue is the great divider."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[152]"
        "line_start": 1472
        "line_end": 1485
        "source_sequence": 1472
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1467
        "line_end": 1480
        "source_sequence": 1467
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[152]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1467-1480"
    "translation_ja": "かたや沈黙を課された者は、あの重々しく陰気な孤立によく耐えられるものだと驚くばかりである。だが苦行という点を離れても、女性を入れないことばかりか、沈黙の誓いにも、それなりの知恵が見て取れる。私はかつて芸術家じみた、酒神祭じみたとさえ言いたくなる在俗の共同生活を多少経験した。たやすくでき、もっとたやすく解散した集まりを一つならず見た。シトー会の戒律があったら、いくらか長持ちしたかもしれない。近くに女性がいると、無防備な男どもの集まりなど、たちどころに危うくなる。より強い電気が必ず勝つ。少年期の夢や青春の計画は、十分間話しただけで放り出され、芸術も科学も、男だけで陽気に騒ぐことを職分とする暮らしも、優しい一対の瞳と甘くいたわる話し声のために、みなすぐに見捨てられる。そしてこの次に人を分かつ大物が、舌である。"
    "translation_status": "reviewed"
  - "id": "td-170"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I am almost ashamed to pursue this worldly criticism of a religious rule; but there is yet another point in which the Trappist order appeals to me as a model of wisdom. By two in the morning the clapper goes upon the bell, and so on, hour by hour, and sometimes quarter by quarter, till eight, the hour of rest; so infinitesimally is the day divided among different occupations. The man who keeps rabbits, for example, hurries from his hutches to the chapel, the chapter-room, or the refectory, all day long: every hour he has an office to sing, a duty to perform; from two, when he rises in the dark, till eight, when he returns to receive the comfortable gift of sleep, he is upon his feet and occupied with manifold and changing business. I know many persons, worth several thousands in the year, who are not so fortunate in the disposal of their lives. Into how many houses would not the note of the monastery bell, dividing the day into manageable portions, bring peace of mind and healthful activity of body! We speak of hardships, but the true hardship is to be a dull fool, and permitted to mismanage life in our own dull and foolish manner."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[153]"
        "line_start": 1486
        "line_end": 1502
        "source_sequence": 1486
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1482
        "line_end": 1498
        "source_sequence": 1482
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[153]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1482-1498"
    "translation_ja": "信仰の規律についてこんな世俗の批評を続けるのはいささか恥ずかしい。だがもう一つ、トラピスト会が知恵のお手本に思えるところがある。午前二時までには鐘の舌が最初のひと打ちをし、その後も毎時、ときには十五分ごとに、休む時刻の八時まで鳴る。一日をさまざまな仕事に、目に見えぬほど細かく割っている。たとえば兎の世話をする男は、柵を出て礼拝堂へ、集会室へ、食堂へと、一日じゅうあわただしく通う。一時間ごとに歌うべき聖務があり、果たすべき義務がある。まだ暗い二時に起きてから、八時に眠りという心地よい贈り物を受けに帰るまで、立ち働いては次々と違う仕事をこなす。年収なら数千もあるのに、そんなに恵まれた時間の使い方をしていない人を大勢知っている。一日を無理のない長さに分ける修道院の鐘の音が、どれほど多くの家に心の平安と健やかな体の動きをもたらすことか。辛い境遇というけれど、本当に辛いのは、鈍くて愚かな人間が、鈍くて愚かな自分のやり方で人生をしくじるに任されていることだ。"
    "translation_status": "reviewed"
  - "id": "td-171"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "From this point of view, we may perhaps better understand the monk’s existence. A long novitiate and every proof of constancy of mind and strength of body is required before admission to the order; but I could not find that many were discouraged. In the photographer’s studio, which figures so strangely among the outbuildings, my eye was attracted by the portrait of a young fellow in the uniform of a private of foot. This was one of the novices, who came of the age for service, and marched and drilled and mounted guard for the proper time among the garrison of Algiers. Here was a man who had surely seen both sides of life before deciding; yet as soon as he was set free from service he returned to finish his novitiate."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[154]"
        "line_start": 1503
        "line_end": 1513
        "source_sequence": 1503
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1500
        "line_end": 1510
        "source_sequence": 1500
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[154]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1500-1510"
    "translation_ja": "こう考えれば、修道士の生き方はもっとよく分かるかもしれない。会に入るには、長い修練期間を過ごし、心が不変で体が丈夫だとあらゆる形で証を立てねばならない。それでも気をくじかれた者が多いとは思えなかった。付属の建物の中にあるのがなんとも不思議な写真室で、歩兵の一兵卒の制服を着た若者の肖像が目に留まった。修練者の一人が兵役の年齢に達し、アルジェの守備隊で、定められた期間、行軍し、教練し、歩哨に立ったのだという。決める前に人生の両面をたしかに見た人である。だが兵役を終えるとすぐ、修練を終えるために帰ってきた。"
    "translation_status": "reviewed"
  - "id": "td-172"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This austere rule entitles a man to heaven as by right. When the Trappist sickens, he quits not his habit; he lies in the bed of death as he has prayed and laboured in his frugal and silent existence; and when the Liberator comes, at the very moment, even before they have carried him in his robe to lie his little last in the chapel among continual chantings, joy-bells break forth, as if for a marriage, from the slated belfry, and proclaim throughout the neighbourhood that another soul has gone to God."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[155]"
        "line_start": 1514
        "line_end": 1521
        "source_sequence": 1514
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1512
        "line_end": 1519
        "source_sequence": 1512
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[155]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1512-1519"
    "translation_ja": "この厳格な戒律のもとに生きる者は、権利とでもいうように天国へ入れる。トラピスト会の修道士は病に倒れても僧衣を脱がない。質素で静かな一生を祈り働いたそのままの姿で、死の床に横たわる。解放者が来るやいなや、喜びの鐘が石板葺きの鐘楼から、婚礼のように鳴りわたる。法衣のまま礼拝堂に運ばれ、絶え間ない詠唱の中で最後のひとときを横たわって過ごす、その前にもう鳴りはじめるのだ。そうして魂がもう一つ神のもとへ行ったと、近隣くまなく告げ知らせる。"
    "translation_status": "reviewed"
  - "id": "td-173"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At night, under the conduct of my kind Irishman, I took my place in the gallery to hear compline and Salve Regina, with which the Cistercians bring every day to a conclusion. There were none of those circumstances which strike the Protestant as childish or as tawdry in the public offices of Rome. A stern simplicity, heightened by the romance of the surroundings, spoke directly to the heart. I recall the whitewashed chapel, the hooded figures in the choir, the lights alternately occluded and revealed, the strong manly singing, the silence that ensued, the sight of cowled heads bowed in prayer, and then the clear trenchant beating of the bell, breaking in to show that the last office was over and the hour of sleep had come; and when I remember, I am not surprised that I made my escape into the court with somewhat whirling fancies, and stood like a man bewildered in the windy starry night."
    "source_languages":
      - "en"
      - "la"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[156]"
        "line_start": 1522
        "line_end": 1535
        "source_sequence": 1522
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1521
        "line_end": 1533
        "source_sequence": 1521
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[156]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1521-1533"
    "translation_ja": "夜になると、親切なアイルランド人に導かれ、階上席で、シトー会が一日の終わりに唱える終課と「サルヴェ・レジナ」を聞いた。ローマ教会の公の典礼で、プロテスタントが子どもじみているとか安ぴかだとか感じがちなところは、ここでは一つもなかった。まわりのロマンチックな趣にいよいよ引き立つ、厳しく素朴なものが、直に心に語りかけてきた。白く塗られた礼拝堂、聖歌隊席の頭巾をつけた人影、見え隠れする灯、力強い男たちの歌声、あとにつづく沈黙、頭巾の頭が祈りに垂れる光景、それから最後の聖務がすみ眠る刻限が来たことを知らせて割って入る、澄んだ歯切れのよい鐘の音。それらを思い出せば、とりとめのない思いに頭をくらくらさせながら中庭に逃げ出し、星の出た風の夜に、茫然とした者のように立ちつくしたのも不思議でない。"
    "translation_status": "reviewed"

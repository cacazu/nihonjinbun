      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-557-559"
    "translation_ja": "ご老人も頭を動かして同意を示した。妻の側に侮りはなく、夫の側にも恥じる様子はない。二人とも事実をすなおに受け入れて、話はそれきりだった。"
    "translation_status": "reviewed"
  - "id": "td-057"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was tightly cross-examined about my journey; and the lady understood in a moment, and sketched out what I should put into my book when I got home. ‘Whether people harvest or not in such or such a place; if there were forests; studies of manners; what, for example, I and the master of the house say to you; the beauties of Nature, and all that.’ And she interrogated me with a look."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[50]"
        "line_start": 645
        "line_end": 650
        "source_sequence": 645
      - "source_id": "gutenberg-535-text"
        "precision": "line"

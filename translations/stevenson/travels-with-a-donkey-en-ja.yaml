        "original_unit_id": "/html/body/p[50]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-561-566"
    "translation_ja": "旅については厳しく根掘り葉掘り訊かれた。ご婦人はすぐに事情をのみこみ、家に帰った私が本に何を書くべきか、あらましを述べた。「どこそこでは取り入れをするのか、しないのか。森はあったか。人々の暮らしぶり。たとえば、私やここの主人があなたに何て言うか。自然の美しさ。そういうことでしょう」そうして問いかける目を私に向けた。"
    "translation_status": "reviewed"
  - "id": "td-058"

      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[11]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-133-144"
    "translation_ja": "この発明の産物は六フィート四方近くあった。夜は枕に、昼は袋の両端になる二枚の三角の折り返しは、その勘定に入っていない。「袋」と呼んではいるが、それもお世辞で、実物は細長い巻物か腸詰めのようなものだった。外は緑の防水荷車布、内は青い羊の毛皮である。鞄としては大容量、寝床としては暖かく、湿気も通さない。一人なら思うさま寝返りを打てるし、詰めれば二人も入れそうだ。首まですっぽり潜り込めるので、頭は毛皮の帽子に任せた。耳に下ろす覆いがつき、鼻の下には呼吸器のように帯が通る。雨がひどいときは、防水外套と石三つ、曲がった枝で小さなテント、いや豆テントをこしらえるつもりだった。"
    "translation_status": "reviewed"
  - "id": "td-017"
    "section_id": "the-donkey-the-pack-and-the-pack-saddle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It will readily be conceived that I could not carry this huge package on my own, merely human, shoulders. It remained to choose a beast of burden. Now, a horse is a fine lady among animals, flighty, timid, delicate in eating, of tender health; he is too valuable and too restive to be left alone, so that you are chained to your brute as to a fellow galley-slave; a dangerous road puts him out of his wits; in short, he’s an uncertain and exacting ally, and adds thirty-fold to the troubles of the voyager. What I required was something cheap and small and hardy, and of a stolid and peaceful temper; and all these requisites pointed to a donkey."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[12]"
        "line_start": 259
        "line_end": 268
        "source_sequence": 259
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 146
        "line_end": 155
        "source_sequence": 146
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[12]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-146-155"
    "translation_ja": "この大荷物を、たかが人間の私一人の肩で運べなかったことは、想像に難くないだろう。荷役の獣を選ばなくてはならなかった。ところで馬は動物界のお嬢さまで、気まぐれで臆病、食べ物にうるさく体も弱い。高価すぎるうえ、じっともしていないので置き去りにできず、飼い主はガレー船の漕ぎ手が隣の奴隷につながれるように馬につながれる。危なっかしい道にかかると取り乱す。要するに、頼りにならず手間ばかりかかる相棒で、旅人の苦労を三十倍にする。私が欲しいのは安く、小さく、丈夫で、物に動じずおとなしいものだった。そう条件を並べてみると、どれもロバを指していた。"
    "translation_status": "reviewed"
  - "id": "td-018"
    "section_id": "the-donkey-the-pack-and-the-pack-saddle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There dwelt an old man in Monastier, of rather unsound intellect according to some, much followed by street-boys, and known to fame as Father Adam. Father Adam had a cart, and to draw the cart a diminutive she-ass, not much bigger than a dog, the colour of a mouse, with a kindly eye and a determined under-jaw. There was something neat and high-bred, a quakerish elegance, about the rogue that hit my fancy on the spot. Our first interview was in Monastier market-place. To prove her good temper, one child after another was set upon her back to ride, and one after another went head over heels into the air; until a want of confidence began to reign in youthful bosoms, and the experiment was discontinued from a dearth of subjects. I was already backed by a deputation of my friends; but as if this were not enough, all the buyers and sellers came round and helped me in the bargain; and the ass and I and Father Adam were the centre of a hubbub for near half an hour. At length she passed into my service for the consideration of sixty-five francs and a glass of brandy. The sack had already cost eighty francs and two glasses of beer; so that Modestine, as I instantly baptized her, was upon all accounts the cheaper article. Indeed, that was as it should be; for she was only an appurtenance of my mattress, or self-acting bedstead on four castors."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[13]"
        "line_start": 269
        "line_end": 288
        "source_sequence": 269
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 157
        "line_end": 175
        "source_sequence": 157
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[13]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-157-175"
    "translation_ja": "モナスティエには、頭がいくらか怪しいと人によっては言い、町の悪童がよく後をついて回る、アダン爺さんの名で知られた老人が住んでいた。アダン爺さんは荷車を持っていて、それを引くのは犬よりさほど大きくない、小さな雌ロバだった。毛は鼠色、目つきは優しく、下顎には意志の強さが見えた。この曲者には、小綺麗で育ちがよさそうなところ、クエーカー教徒風の飾らない気品があり、ひと目で気に入った。最初の対面はモナスティエの市場広場だった。おとなしいことを証明しようと子どもを次々と背に乗せ、乗せたそばから逆さまに宙へ放り出された。ついには子どもたちの胸に不信が広まり、被験者の不足で実験は打ち切りとなった。私はすでに友人の代表団の後押しを得ていたが、それだけでは足りないとばかりに、売り手も買い手もみな寄ってきて値段の交渉に加勢した。私とロバとアダン爺さんを真ん中に、半時間近く大騒ぎがつづいた。ついに六十五フランとブランデー一杯で、彼女は私に仕える身となった。寝袋にはすでに八十フランとビール二杯がかかっていたから、モデスティーヌとその場で洗礼名を授けた娘のほうが、どのみち安い買い物だった。いかにもそうあるべきで、彼女は私の敷き布団に付属する備品、つまり四つの車輪でひとりでに走るベッド台にすぎなかったのだから。"
    "translation_status": "reviewed"
  - "id": "td-019"
    "section_id": "the-donkey-the-pack-and-the-pack-saddle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had a last interview with Father Adam in a billiard-room at the witching hour of dawn, when I administered the brandy. He professed himself greatly touched by the separation, and declared he had often bought white bread for the donkey when he had been content with black bread for himself; but this, according to the best authorities, must have been a flight of fancy. He had a name in the village for brutally misusing the ass; yet it is certain that he shed a tear, and the tear made a clean mark down one cheek."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"

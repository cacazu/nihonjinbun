        "line_start": 2472
        "line_end": 2481
        "source_sequence": 2472
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[242]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2472-2481"
    "translation_ja": "人が爪を立て、大きな音をさせて引っかくような音で、枕にした背嚢の下から来た。身を起こし振り返る間もなく、三度つづいた。何も見えず、もう何も聞こえない。遠く近くに、あの不思議なかさこそいう音が少しして、川と蛙の絶え間ない伴奏があるきりだ。栗畑には鼠がうようよいると翌日知った。かさこそいう音も、鳴き声も、引っかく音もおそらく鼠だった。だがそのときには謎は解けず、隣人が何者か分からず、不思議に思いながら、なんとかまた眠りにつくよう気を落ち着けなければならなかった。"
    "translation_status": "reviewed"
  - "id": "td-273"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was wakened in the grey of the morning (Monday, 30th September) by the sound of foot-steps not far off upon the stones, and opening my eyes, I beheld a peasant going by among the chestnuts by a footpath that I had not hitherto observed. He turned his head neither to the right nor to the left, and disappeared in a few strides among the foliage. Here was an escape! But it was plainly more than time to be moving. The peasantry were abroad; scarce less terrible to me in my nondescript position than the soldiers of Captain Poul to an undaunted Camisard. I fed Modestine with what haste I could; but as I was returning to my sack, I saw a man and a boy come down the hillside in a direction crossing mine. They unintelligibly hailed me, and I replied with inarticulate but cheerful sounds, and hurried forward to get into my gaiters."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[243]"
        "line_start": 2404
        "line_end": 2416
        "source_sequence": 2404
      - "source_id": "gutenberg-535-text"

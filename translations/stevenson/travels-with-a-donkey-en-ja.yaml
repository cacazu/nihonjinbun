  - "id": "td-005"
    "section_id": "front"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The journey which this little book is to describe was very agreeable and fortunate for me. After an uncouth beginning, I had the best of luck to the end. But we are all travellers in what John Bunyan calls the wilderness of this world—all, too, travellers with a donkey: and the best that we find in our travels is an honest friend. He is a fortunate voyager who finds many. We travel, indeed, to find them. They are the end and the reward of life. They keep us worthy of ourselves; and when we are alone, we are only nearer to the absent."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[6]"
        "line_start": 178
        "line_end": 186
        "source_sequence": 178

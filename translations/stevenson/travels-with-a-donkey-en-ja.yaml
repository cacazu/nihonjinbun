  - "id": "td-033"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "My deus ex machinâ, before he left me, supplied some excellent, if inhumane, advice; presented me with the switch, which he declared she would feel more tenderly than my cane; and finally taught me the true cry or masonic word of donkey-drivers, ‘Proot!’ All the time, he regarded me with a comical, incredulous air, which was embarrassing to confront; and smiled over my donkey-driving, as I might have smiled over his orthography, or his green tail-coat. But it was not my turn for the moment."
    "source_languages":

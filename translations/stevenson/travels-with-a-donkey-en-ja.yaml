      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2027-2040"
    "translation_ja": "夕べたどった小道はすぐに消えた。芝の裸の坂を、グレ越えのときと同じように一列に並ぶ石柱をたどって上った。もう暖かかった。上着は荷に結び、編みの胴着で歩いた。モデスティーヌまで上機嫌で、私の知る限り初めて、ひとりでに弾む小走りになった。上着のポケットの燕麦がざらざらと動いた。ジェヴォーダン北部を振り返る眺めは、一歩ごとに広がった。北へ東へ西へ、荒々しい丘のうねりがつづくなかで、木も家もほとんどなく、朝の霞と日の光にどこも青く、黄金色だった。小鳥が数知れず道のまわりを飛び交い、さえずった。石柱にとまり、芝をついばみ、得意げに歩くかと思うと、青い空にいく群れも輪を描く。ときおり私と太陽の間で、透ける翼がひらめいた。"
    "translation_status": "reviewed"
  - "id": "td-234"
    "section_id": "across-the-lozere"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Almost from the first moment of my march, a faint large noise, like a distant surf, had filled my ears. Sometimes I was tempted to think it the voice of a neighbouring waterfall, and sometimes a subjective result of the utter stillness of the hill. But as I continued to advance, the noise increased, and became like the hissing of an enormous tea-urn, and at the same time breaths of cool air began to reach me from the direction of the summit. At length I understood. It was blowing stiffly from the south upon the other slope of the Lozère, and every step that I took I was drawing nearer to the wind."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"

  - "id": "td-032"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Et vous marchez comme ça!’ cried he; and, throwing back his head, he laughed long and heartily. I watched him, half prepared to feel offended, until he had satisfied his mirth; and then, ‘You must have no pity on these animals,’ said he; and, plucking a switch out of a thicket, he began to lace Modestine about the stern-works, uttering a cry. The rogue pricked up her ears and broke into a good round pace, which she kept up without flagging, and without exhibiting the least symptom of distress, as long as the peasant kept beside us. Her former panting and shaking had been, I regret to say, a piece of comedy."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":

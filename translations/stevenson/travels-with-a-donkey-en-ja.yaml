        "original_unit_id": "line-3258-3260"
    "translation_ja": "サン・ジャン・デュ・ガールまで長い下りで、誰にも出会わなかった。ただ荷車引きが一人、火の消えた角灯が月にきらりと光り、遠くから見えた。"
    "translation_status": "reviewed"
  - "id": "td-359"

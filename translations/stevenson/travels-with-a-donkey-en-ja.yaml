        "original_unit_id": "line-1737-1740"
    "translation_ja": "とうとう我慢ならぬほど腹が立った。向こうが自分の領分におり、まして老人とあって、私が大目に見るべき理由もあったのだが、この礼を失した扱いに抗議せずにはいられなかった。いたく面目を失ったようだった。"
    "translation_status": "reviewed"
  - "id": "td-207"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘I assure you,’ he said, ‘I have no inclination to laugh in my heart. I have no other feeling but interest in your soul.’"

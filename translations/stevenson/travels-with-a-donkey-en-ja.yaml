  - "id": "td-309"
    "section_id": "in-the-valley-of-the-mimente"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All night a strong wind blew up the valley, and the acorns fell pattering over me from the oak. Yet, on this first night of October, the air was as mild as May, and I slept with the fur thrown back."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[277]"
        "line_start": 2698
        "line_end": 2700
        "source_sequence": 2698
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2803
        "line_end": 2805
        "source_sequence": 2803
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[277]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2803-2805"
    "translation_ja": "一晩じゅう強い風が谷を吹き上り、樫から団栗が雨あられと降ってきた。それでもこの十月最初の夜の空気は五月のように穏やかで、私は毛皮をはねのけたまま眠った。"
    "translation_status": "reviewed"
  - "id": "td-310"
    "section_id": "in-the-valley-of-the-mimente"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was much disturbed by the barking of a dog, an animal that I fear more than any wolf. A dog is vastly braver, and is besides supported by the sense of duty. If you kill a wolf, you meet with encouragement and praise; but if you kill a dog, the sacred rights of property and the domestic affections come clamouring round you for redress. At the end of a fagging day, the sharp cruel note of a dog’s bark is in itself a keen annoyance; and to a tramp like myself, he represents the sedentary and respectable world in its most hostile form. There is something of the clergyman or the lawyer about this engaging animal; and if he were not amenable to stones, the boldest man would shrink from travelling afoot. I respect dogs much in the domestic circle; but on the highway, or sleeping afield, I both detest and fear them."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[278]"
        "line_start": 2701
        "line_end": 2713
        "source_sequence": 2701
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2807
        "line_end": 2818
        "source_sequence": 2807
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[278]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2807-2818"
    "translation_ja": "犬の吠え声にはおおいに悩まされた。狼よりも怖い動物である。犬のほうが断然勇気があり、そのうえ義務の意識に支えられている。狼を殺せば、よくやったと褒められるが、犬を殺せば、財産という神聖な権利や家庭の愛情が、補償しろと騒ぎながら取り巻く。くたくたに疲れた一日の終わりには、犬の吠える鋭く残酷な声だけで、ひどく癇にさわる。私のような放浪者には、定住し世間の体裁を守る者たちの、もっとも敵意ある姿を具現する。この愛嬌ある動物には、どこか聖職者か法律家のようなところがある。石で追い払えるのでなければ、どんな勇気のある者も、歩いて旅に出るのをためらうだろう。家庭で飼われている犬は大いに尊敬する。だが街道で、あるいは野で寝るときには、私は犬が嫌いで、怖い。"
    "translation_status": "reviewed"
  - "id": "td-311"
    "section_id": "in-the-valley-of-the-mimente"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was wakened next morning (Wednesday, October 2nd) by the same dog—for I knew his bark—making a charge down the bank, and then, seeing me sit up, retreating again with great alacrity. The stars were not yet quite extinguished. The heaven was of that enchanting mild grey-blue of the early morn. A still clear light began to fall, and the trees on the hillside were outlined sharply against the sky. The wind had veered more to the north, and no longer reached me in the glen; but as I was going on with my preparations, it drove a white cloud very swiftly over the hill-top; and looking up, I was surprised to see the cloud dyed with gold. In these high regions of the air, the sun was already shining as at noon. If only the clouds travelled high enough, we should see the same thing all night long. For it is always daylight in the fields of space."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[279]"
        "line_start": 2714
        "line_end": 2726
        "source_sequence": 2714
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2820
        "line_end": 2831
        "source_sequence": 2820
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[279]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2820-2831"
    "translation_ja": "翌朝、十月二日の水曜、同じ犬に（吠え声を覚えていた）起こされた。土手をこちらへ駆け下り、私が身を起こすのを見ると、たいへんな早さでまた引き返した。星はまだすっかり消えていなかった。空は朝早くの、魅惑的なやわらかい青灰色をしていた。静かに澄んだ光が射しはじめ、山腹の木々が空を背にくっきり縁どられた。風は前より北へ回り、谷底の私のところまではもう届かなかった。だが支度をするうちに、風が一筋の白い雲を丘の頂の上にはやばやと吹き流した。見上げると、雲が金色に染まっているのに驚いた。大気の高いそのあたりでは、もう昼のように陽が輝いている。雲が十分に高いところを通りさえすれば、同じものが一晩じゅう見えることになる。宇宙という野は、いつも昼なのだから。"
    "translation_status": "reviewed"
  - "id": "td-312"
    "section_id": "in-the-valley-of-the-mimente"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As I began to go up the valley, a draught of wind came down it out of the seat of the sunrise, although the clouds continued to run overhead in an almost contrary direction. A few steps farther, and I saw a whole hillside gilded with the sun; and still a little beyond, between two peaks, a centre of dazzling brilliancy appeared floating in the sky, and I was once more face to face with the big bonfire that occupies the kernel of our system."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[280]"
        "line_start": 2727
        "line_end": 2733
        "source_sequence": 2727
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2833
        "line_end": 2839
        "source_sequence": 2833
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[280]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2833-2839"
    "translation_ja": "谷を上りはじめると、日の出る方角から一陣の風が谷を吹き下ろしてきた。頭上では雲がそれとほとんど逆向きに流れつづけていたのに、である。もう何歩かで山腹じゅうが陽に金色になるのを見、さらに少し先で、二つの頂の間に目もくらむ光の中心が空に浮かんで現れた。こうしてまた、私たちの太陽系の真ん中を占める、大きな焚き火と面と向かったのだった。"
    "translation_status": "reviewed"
  - "id": "td-313"
    "section_id": "in-the-valley-of-the-mimente"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I met but one human being that forenoon, a dark military-looking wayfarer, who carried a game-bag on a baldric; but he made a remark that seems worthy of record. For when I asked him if he were Protestant or Catholic—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[281]"
        "line_start": 2734
        "line_end": 2737
        "source_sequence": 2734
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2841
        "line_end": 2844
        "source_sequence": 2841
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[281]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2841-2844"
    "translation_ja": "その午前中に会った人間は一人きりだった。軍人めいた浅黒い旅人で、肩帯から獲物袋を下げていた。記すに値する一言を残した。プロテスタントですか、カトリックですか、と私が尋ねたときのことだ。"
    "translation_status": "reviewed"
  - "id": "td-314"
    "section_id": "in-the-valley-of-the-mimente"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Oh,’ said he, ‘I make no shame of my religion. I am a Catholic.’"

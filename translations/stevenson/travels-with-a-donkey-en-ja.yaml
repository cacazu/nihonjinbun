        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2176
        "line_end": 2185
        "source_sequence": 2176
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[214]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2176-2185"
    "translation_ja": "記憶に間違いなければ、ポン・ド・モンヴェールで真っ先に出会ったものの一つは、プロテスタントの教会堂であった。だがそれは、次々に出会う新しいものの見本にすぎない。微妙な空気が、イングランドの町をフランスの町はもちろん、スコットランドの町からさえも区別する。カーライルでは一方の国にいると分かり、三十マイル離れたダンフリーズでは、もう一方にいることが同じように確かだ。ポン・ド・モンヴェールがモナスティエやランゴーニュ、さらにはブレマールとどんなところで違うか、説明は難しい。だが違いはあり、目にありありと訴えた。この地の家々、路地、照り返しのまぶしい川床には、何とも言いようのない南の趣があった。"
    "translation_status": "reviewed"
  - "id": "td-244"
    "section_id": "pont-de-montvert"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "All was Sunday bustle in the streets and in the public-house, as all had been Sabbath peace among the mountains. There must have been near a score of us at dinner by eleven before noon; and after I had eaten and drunken, and sat writing up my journal, I suppose as many more came dropping in one after another, or by twos and threes. In crossing the Lozère I had not only come among new natural features, but moved into the territory of a different race. These people, as they hurriedly despatched their viands in an intricate sword-play of knives, questioned and answered me with a degree of intelligence which excelled all that I had met, except among the railway folk at Chasseradès. They had open telling faces, and were lively both in speech and manner. They not only entered thoroughly into the spirit of my little trip, but more than one declared, if he were rich enough, he would like to set forth on such another."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[215]"
        "line_start": 2129
        "line_end": 2142
        "source_sequence": 2129
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2187
        "line_end": 2200
        "source_sequence": 2187
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[215]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2187-2200"
    "translation_ja": "山の上ではあらゆるものが安息日の平安をまとっていたが、町の通りも居酒屋も、何もかも日曜の活気でいっぱいだった。午前十一時までには二十人近くが昼食をとっていたろう。食べて飲んで日記をつけているあいだにも、一人また一人と、あるいは二人三人連れで、同じくらいの人数が入ってきたかと思う。ロゼールを越えて、目新しい土地の姿に出会ったばかりか、別の人種の領分に入ったのだ。ここの人々は食べ物を急いで片づけ、ナイフの入り組んだ剣舞を繰り広げながら、私に質問し、私の質問に答えた。その利発さは、シャスラデスの鉄道の人々を除けば、これまで出会った誰にもまさる。表情はおおらかで、顔によく気持ちが表れ、話もそぶりも生き生きしていた。私の小さな旅の精神をすっかり理解しただけでなく、金さえあれば自分も同じような旅に出たいと断言した者が、一人ならずいた。"
    "translation_status": "reviewed"
  - "id": "td-245"
    "section_id": "pont-de-montvert"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Even physically there was a pleasant change. I had not seen a pretty woman since I left Monastier, and there but one. Now of the three who sat down with me to dinner, one was certainly not beautiful—a poor timid thing of forty, quite troubled at this roaring table d’hôte, whom I squired and helped to wine, and pledged and tried generally to encourage, with quite a contrary effect; but the other two, both married, were both more handsome than the average of women. And Clarisse? What shall I say of Clarisse? She waited the table with a heavy placable nonchalance, like a performing cow; her great grey eyes were steeped in amorous languor; her features, although fleshy, were of an original and accurate design; her mouth had a curl; her nostril spoke of dainty pride; her cheek fell into strange and interesting lines. It was a face capable of strong emotion, and, with training, it offered the promise of delicate sentiment. It seemed pitiful to see so good a model left to country admirers and a country way of thought. Beauty should at least have touched society; then, in a moment, it throws off a weight that lay upon it, it becomes conscious of itself, it puts on an elegance, learns a gait and a carriage of the head, and, in a moment, patet dea. Before I left I assured Clarisse of my hearty admiration. She took it like milk, without embarrassment or wonder, merely looking at me steadily with her great eyes; and I own the result upon myself was some confusion. If Clarisse could read English, I should not dare to add that her figure was unworthy of her face. Hers was a case for stays; but that may perhaps grow better as she gets up in years."
    "source_languages":
      - "en"
      - "fr"
      - "la"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

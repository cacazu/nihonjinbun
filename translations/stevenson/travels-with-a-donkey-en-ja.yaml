        "original_unit_id": "/html/body/p[250]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2519-2525"
    "translation_ja": "ほどなく道に出、板チョコレートをかじりながら、一つの良心の問題を真剣に考えた。この一夜の宿賃を払うべきか。眠りは浅く、寝床は蟻という姿を取った蚤でいっぱい、部屋には水もなく、朝は夜明けそのものが起こしそびれた。付近に乗れる汽車があったら、逃したかもしれない。受けたもてなしに不満なのは明らかだ。物乞いに出会わぬかぎり払うまいと決めた。"
    "translation_status": "reviewed"
  - "id": "td-281"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The valley looked even lovelier by morning; and soon the road descended to the level of the river. Here, in a place where many straight and prosperous chestnuts stood together, making an aisle upon a swarded terrace, I made my morning toilette in the water of the Tarn. It was marvellously clear, thrillingly cool; the soap-suds disappeared as if by magic in the swift current, and the white boulders gave one a model for cleanliness. To wash in one of God’s rivers in the open air seems to me a sort of cheerful solemnity or semi-pagan act of worship. To dabble among dishes in a bedroom may perhaps make clean the body; but the imagination takes no share in such a cleansing. I went on with a light and peaceful heart, and sang psalms to the spiritual ear as I advanced."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[251]"
        "line_start": 2442
        "line_end": 2453
        "source_sequence": 2442
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2527
        "line_end": 2537
        "source_sequence": 2527
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[251]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2527-2537"
    "translation_ja": "朝の谷は前にもまして美しく見え、道はほどなく川と同じ高さまで下った。まっすぐ元気な栗が何本も並び、草地の段に回廊をつくるところで、タルンの水を借りて朝の身支度をした。びっくりするほど澄み、はっとするほど冷たい。石鹸の泡は速い流れに魔法のように消え、白い大岩が清潔さの手本を示してくれた。戸外で神さまの川の一つで体を洗うのは、私には、ある種の朗らかな厳粛さ、半ば異教の礼拝のように思える。寝室の器で水をはねさせれば体はきれいになるかもしれない。だがそんな清めには想像力が何ひとつあずからない。私は晴れやかに、平和な心で先へ行った。歩きながら、心の耳に詩篇を歌った。"
    "translation_status": "reviewed"

        "original_unit_id": "/html/body/p[189]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1745-1750"
    "translation_ja": "これで私を改宗させる話もおしまいになった。正直な人だ。危険な欺き手ではない。熱意と信仰にあふれた、田舎の牧者なのである。裾をたくし上げて、末永くジェヴォーダンを踏みしめて歩きたまえ。歩く力があり、教区の人々が死に臨むとき、その慰めとなる力もある人だ。務めに呼ばれれば、吹雪の中でも勇ましく踏み分けて行くだろう。もっとも信仰に篤い者が、いつももっとも巧みな使徒になるわけではない。"
    "translation_status": "reviewed"

        "line_start": 962
        "line_end": 966
        "source_sequence": 962
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 912
        "line_end": 915
        "source_sequence": 912
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[103]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-912-915"
    "translation_ja": "そう言い捨て、一家に背を向けた。彼らはあわてて砦へ引き返し、例の戸はまた閉まった。だが閉まる前に、笑い声が耳に入った。娘も野蛮なら、父はなお野蛮。ここは複数形にしておこう。ジェヴォーダンの〈獣ども〉。"
    "translation_status": "reviewed"
    "annotations":

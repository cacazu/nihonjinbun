        "original_unit_id": "line-2644-2655"
    "translation_ja": "荒々しいのにほほえましいこの風景には、南の盟約派の気性を説明してくれるものがあった。良心のためスコットランドで山に入った者は、みな陰気で悪魔に攻められる思いを抱いた。神の慰めを一度受ければ、二度はサタンとの戦いを強いられたからだ。だがカミザールには明るい、支えとなる幻しかなかった。流すほうでも流されるほうでも、はるかに血に多く関わったのに、その記録に悪魔へのとらわれは見いだせない。良心にやましさを感じず、この荒れた時代と境遇に暮らしていた。忘れてはならない、セギエの魂は庭のようだった。彼らは神の側にいると知っていた。その確信はスコットランド人には例がなく、スコットランド人は主義の正しさは信じられても、わが身の正しさには、ついぞ安んじられなかった。"
    "translation_status": "reviewed"
  - "id": "td-298"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘We flew,’ says one old Camisard, ‘when we heard the sound of psalm-singing, we flew as if with wings. We felt within us an animating ardour, a transporting desire. The feeling cannot be expressed in words. It is a thing that must have been experienced to be understood. However weary we might be, we thought no more of our weariness, and grew light so soon as the psalms fell upon our ears.’"
    "source_languages":
      - "en"
    "source_locations":

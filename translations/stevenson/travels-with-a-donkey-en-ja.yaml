      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-337-352"
    "translation_ja": "この上機嫌のまま坂を下ると、緑の谷の奥にグデがあった。向かいの岩の急斜面にはボーフォール城、二つのあいだには水晶のような流れが深い淵をなしていた。上流でも下流でも石を縫ってさらさら音を立てる、愛嬌のある川の幼子にロワールの名を負わせるのは、馬鹿げて見えるほどだ。グデは四方を山に囲まれ、せいぜいロバが通れる岩だらけの小道で、外のフランス世界とつながっている。人々は緑の片隅で酒を飲み、悪態をつき、冬は家の戸口から雪をかぶった峰々を仰ぐ。ホメロスのキュクロプスもかくやの孤絶と思うだろうが、そうではない。郵便屋は配達袋を下げてグデまでやって来るし、志のある若者にはル・ピュイの鉄道まで一日で歩ける。ここの宿には主人の甥、レジス・セナックの肖像版画まである。「剣術教師、南北両アメリカの覇者」とある。この栄誉を賞金五百ドルとともに手にしたのは、一八七六年四月十日、ニューヨークのタマニー・ホールでのことだった。"
    "translation_status": "reviewed"
  - "id": "td-036"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I hurried over my midday meal, and was early forth again. But, alas, as we climbed the interminable hill upon the other side, ‘Proot!’ seemed to have lost its virtue. I prooted like a lion, I prooted mellifluously like a sucking-dove; but Modestine would be neither softened nor intimidated. She held doggedly to her pace; nothing but a blow would move her, and that only for a second. I must follow at her heels, incessantly belabouring. A moment’s pause in this ignoble toil, and she relapsed into her own private gait. I think I never heard of any one in as mean a situation. I must reach the lake of Bouchet, where I meant to camp, before sundown, and, to have even a hope of this, I must instantly maltreat this uncomplaining animal. The sound of my own blows sickened me. Once, when I looked at her, she had a faint resemblance to a lady of my acquaintance who formerly loaded me with kindness; and this increased my horror of my cruelty."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[30]"
        "line_start": 452
        "line_end": 466
        "source_sequence": 452
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 354
        "line_end": 367
        "source_sequence": 354
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[30]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-354-367"
    "translation_ja": "あわただしく昼食をすませ、早めにまた出立した。ところが向こう側の果てしない坂を上るうち、ああ、あの「プルート！」は効き目をなくしたようだった。私は獅子のようにプルートと吠え、鳩の雛のように甘くプルートと鳴いた。だがモデスティーヌは心を動かさず、脅しにも屈しない。がんとして歩調を守り、一発打たなければ足を速めず、それもほんの一秒である。私は尻について、ひっきりなしに打たねばならなかった。さもしい作業を少し休んだとたん、彼女はひとり決めた歩幅に戻った。こんな情けない立場に落ちた人のことなど、聞いたためしがないと思う。野宿する気でいるブシェ湖に日没前に着かねばならず、わずかでもその望みを持つには、今すぐこの文句も言わない獣を手荒に扱わねばならない。自分の打つ音に胸が悪くなった。一度、彼女を見ると、かつて私にことのほか親切にしてくれた、ある知り合いの女性にかすかに似ていた。私はますます我が身の残酷さにぞっとした。"
    "translation_status": "reviewed"
  - "id": "td-037"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To make matters worse, we encountered another donkey, ranging at will upon the roadside; and this other donkey chanced to be a gentleman. He and Modestine met nickering for joy, and I had to separate the pair and beat down their young romance with a renewed and feverish bastinado. If the other donkey had had the heart of a male under his hide, he would have fallen upon me tooth and hoof; and this was a kind of consolation—he was plainly unworthy of Modestine’s affection. But the incident saddened me, as did everything that spoke of my donkey’s sex."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[31]"
        "line_start": 467
        "line_end": 474
        "source_sequence": 467
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 369
        "line_end": 376
        "source_sequence": 369
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[31]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-369-376"
    "translation_ja": "悪いことは重なるもので、道端を好きなように歩きまわる別のロバに出くわした。それがよりによって雄だった。そいつとモデスティーヌは嬉しそうに鳴き交わした。私は二頭の仲を裂き、芽生えたばかりの恋を、再びむきになって振るう棒で打ちのめすほかなかった。皮の下に男の心意気でもあれば、相手は蹄と歯で私に襲いかかっただろう。それがなかったのは慰めでもあった。明らかにモデスティーヌの好意に値しない雄だったのだ。だがロバが雌だと思い知らされるたびにそうだったように、この一件には悲しくなった。"
    "translation_status": "reviewed"
  - "id": "td-038"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was blazing hot up the valley, windless, with vehement sun upon my shoulders; and I had to labour so consistently with my stick that the sweat ran into my eyes. Every five minutes, too, the pack, the basket, and the pilot-coat would take an ugly slew to one side or the other; and I had to stop Modestine, just when I had got her to a tolerable pace of about two miles an hour, to tug, push, shoulder, and readjust the load. And at last, in the village of Ussel, saddle and all, the whole hypothec turned round and grovelled in the dust below the donkey’s belly. She, none better pleased, incontinently drew up and seemed to smile; and a party of one man, two women, and two children came up, and, standing round me in a half-circle, encouraged her by their example."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[32]"
        "line_start": 475
        "line_end": 486
        "source_sequence": 475
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 378
        "line_end": 388
        "source_sequence": 378
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[32]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-378-388"
    "translation_ja": "谷を上るうち、かんかん照りになった。風もなく、激しい日射しが肩に当たり、そのうえ絶え間なく杖を使うので、汗が目に流れ込んだ。五分に一度はまた、荷物と籠と外套が右か左へひどくずれた。やっと時速二マイルほどのまあまあの足どりにしたところでモデスティーヌを止め、荷を引いたり押したり肩で支えたりして載せ直さねばならない。ついにユセル村では、鞍もろとも荷の一式がくるりと回り、ロバの腹の下で地べたに突っ伏した。彼女は嬉しいことこのうえなく、たちまち足を止め、笑みさえ浮かべるようだった。男一人、女二人と子ども二人の一団が来て、私を半円形に取り巻いた。彼女もみんなが止まっているのを見て、ますますその気になった。"
    "translation_status": "reviewed"
  - "id": "td-039"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had the devil’s own trouble to get the thing righted; and the instant I had done so, without hesitation, it toppled and fell down upon the other side. Judge if I was hot! And yet not a hand was offered to assist me. The man, indeed, told me I ought to have a package of a different shape. I suggested, if he knew nothing better to the point in my predicament, he might hold his tongue. And the good-natured dog agreed with me smilingly. It was the most despicable fix. I must plainly content myself with the pack for Modestine, and take the following items for my own share of the portage: a cane, a quart-flask, a pilot-jacket heavily weighted in the pockets, two pounds of black bread, and an open basket full of meats and bottles. I believe I may say I am not devoid of greatness of soul; for I did not recoil from this infamous burden. I disposed it, Heaven knows how, so as to be mildly portable, and then proceeded to steer Modestine through the village. She tried, as was indeed her invariable habit, to enter every house and every courtyard in the whole length; and, encumbered as I was, without a hand to help myself, no words can render an idea of my difficulties. A priest, with six or seven others, was examining a church in process of repair, and he and his acolytes laughed loudly as they saw my plight."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[33]"
        "line_start": 487
        "line_end": 506
        "source_sequence": 487
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 390
        "line_end": 408
        "source_sequence": 390
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[33]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-390-408"
    "translation_ja": "散々苦労して載せ直したそのとたん、荷は一瞬のためらいもなく反対側へひっくり返り、落ちた。私がどれほど熱くなったか、想像してほしい。なのに手を貸す者は誰もいない。なるほど男は、違う形の荷を用意すべきだったと口を出した。この窮状にもっと役立つ知恵がないなら、黙っていてもいい、と私は提案した。気のいいやつで、笑いながらそのとおりだと言った。なんとも惨めな窮地である。モデスティーヌには寝袋だけで我慢し、残りは自分が引き受けねばならない。杖一本、四分の一ガロン入りの水筒、ポケットに重い物を詰めた外套、黒パン二ポンド、肉と瓶がどっさり入った蓋なしの籠。これほど恥ずべき荷にもひるまなかったのだから、私にも少しは度量があると言ってよいと思う。どうやったものか神のみぞ知るが、どうにか運べるように配分して、モデスティーヌを村の中へ導いた。彼女は例によって、道の端から端まで、家という家、中庭という中庭に入ろうとした。荷にまみれ、自由な手もない私がどれだけ苦労したか、言葉で伝えようがない。司祭が六、七人と修理中の教会を検分していて、私のありさまを見て供の者ともども大笑いをした。"
    "translation_status": "reviewed"
  - "id": "td-040"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I remembered having laughed myself when I had seen good men struggling with adversity in the person of a jackass, and the recollection filled me with penitence. That was in my old light days, before this trouble came upon me. God knows at least that I shall never laugh again, thought I. But oh, what a cruel thing is a farce to those engaged in it!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[34]"
        "line_start": 507
        "line_end": 512
        "source_sequence": 507
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 410
        "line_end": 414
        "source_sequence": 410
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[34]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-410-414"
    "translation_ja": "思い出してみれば、逆境が雄ロバの姿を借りて善良な人を苦しめているのを見て、私も笑ったことがある。それを思うと悔いの念でいっぱいになった。こんな災難が降ってかかる前、まだのんきだった昔のことだ。神にかけて、二度と笑うものか、と私は思った。それにしても、茶番劇は演じさせられる者にとって、なんと残酷なものだろう！"
    "translation_status": "reviewed"
  - "id": "td-041"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A little out of the village, Modestine, filled with the demon, set her heart upon a by-road, and positively refused to leave it. I dropped all my bundles, and, I am ashamed to say, struck the poor sinner twice across the face. It was pitiful to see her lift her head with shut eyes, as if waiting for another blow. I came very near crying; but I did a wiser thing than that, and sat squarely down by the roadside to consider my situation under the cheerful influence of tobacco and a nip of brandy. Modestine, in the meanwhile, munched some black bread with a contrite hypocritical air. It was plain that I must make a sacrifice to the gods of shipwreck. I threw away the empty bottle destined to carry milk; I threw away my own white bread, and, disdaining to act by general average, kept the black bread for Modestine; lastly, I threw away the cold leg of mutton and the egg-whisk, although this last was dear to my heart. Thus I found room for everything in the basket, and even stowed the boating-coat on the top. By means of an end of cord I slung it under one arm; and although the cord cut my shoulder, and the jacket hung almost to the ground, it was with a heart greatly lightened that I set forth again."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[35]"
        "line_start": 513
        "line_end": 530
        "source_sequence": 513
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 416
        "line_end": 432
        "source_sequence": 416
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[35]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-416-432"
    "translation_ja": "村を少し出たところで、悪魔に取り憑かれたモデスティーヌは脇道に未練たっぷりで、どうしても離れようとしなかった。私は荷物を全部その場に下ろし、恥ずかしいことだが、哀れな罪人の顔を二度、横ざまに打った。彼女が目を閉じたまま頭をもたげ、もう一発を待つかのような姿は、見ていられなかった。もう少しで泣くところだった。だが泣くより賢いことをした。道端にどっかり座り、煙草とひと口のブランデーに気をよくして、わが身の置かれた状況を考えた。そのあいだモデスティーヌは、しおらしいふりをして黒パンをもぐもぐやっていた。どうやら難破の神々に犠牲を捧げなくてはならない。牛乳用の空瓶を捨てた。私の白パンも捨てた。船荷の損を皆で割る海の流儀はよして、モデスティーヌの黒パンは残した。最後に冷えた羊のもも肉と、愛着のあった卵の泡立て器まで捨てた。これで何もかも籠に入り、厚手の外套さえ一番上にしまえた。綱の切れ端を使って籠を片腕の下に吊った。綱は肩に食い込み、外套は地面すれすれに垂れたが、心はずいぶん軽くなって、私はまた出発した。"
    "translation_status": "reviewed"
  - "id": "td-042"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had now an arm free to thrash Modestine, and cruelly I chastised her. If I were to reach the lakeside before dark, she must bestir her little shanks to some tune. Already the sun had gone down into a windy-looking mist; and although there were still a few streaks of gold far off to the east on the hills and the black fir-woods, all was cold and grey about our onward path. An infinity of little country by-roads led hither and thither among the fields. It was the most pointless labyrinth. I could see my destination overhead, or rather the peak that dominates it; but choose as I pleased, the roads always ended by turning away from it, and sneaking back towards the valley, or northward along the margin of the hills. The failing light, the waning colour, the naked, unhomely, stony country through which I was travelling, threw me into some despondency. I promise you, the stick was not idle; I think every decent step that Modestine took must have cost me at least two emphatic blows. There was not another sound in the neighbourhood but that of my unwearying bastinado."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[36]"
        "line_start": 531
        "line_end": 546
        "source_sequence": 531
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 434
        "line_end": 449
        "source_sequence": 434
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[36]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-434-449"
    "translation_ja": "これで片腕が空き、私はモデスティーヌを情け容赦なく打ちすえた。日が暮れる前に湖畔に着くには、彼女の細い脚をどうしてもせっせと動かしてもらわねばならなかった。日はもう風をはらんだような靄の中に落ち、ずっと東の丘や黒いモミ林にはまだ黄金の筋が数本残っていたが、行く手には冷たい灰色が広がっていた。無数の田舎道が畑の間をあちらこちらへ延びている。まったく訳の分からない迷路だった。行き先、正しくはその上にそびえる峰は頭上に見えるのだが、どの道を選んでもそのうち峰からそれ、谷へ向けて、あるいは丘の縁を北に向けて、こそこそ引き返す。光は衰え、色は薄れ、草木のない住みにくそうな石だらけの土地をゆく私は、いくらか心が沈んできた。請け合うが、杖には休む間もなかった。モデスティーヌがまともに一歩進むごとに、力いっぱい少なくとも二発は殴ったと思う。あたりには、私が飽きもせず打ちつづける音のほか、何ひとつ聞こえなかった。"
    "translation_status": "reviewed"
  - "id": "td-043"
    "section_id": "the-green-donkey-driver"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Suddenly, in the midst of my toils, the load once more bit the dust, and, as by enchantment, all the cords were simultaneously loosened, and the road scattered with my dear possessions. The packing was to begin again from the beginning; and as I had to invent a new and better system, I do not doubt but I lost half an hour. It began to be dusk in earnest as I reached a wilderness of turf and stones. It had the air of being a road which should lead everywhere at the same time; and I was falling into something not unlike despair when I saw two figures stalking towards me over the stones. They walked one behind the other like tramps, but their pace was remarkable. The son led the way, a tall, ill-made, sombre, Scottish-looking man; the mother followed, all in her Sunday’s best, with an elegantly embroidered ribbon to her cap, and a new felt hat atop, and proffering, as she strode along with kilted petticoats, a string of obscene and blasphemous oaths."
    "source_languages":
      - "en"
    "source_locations":

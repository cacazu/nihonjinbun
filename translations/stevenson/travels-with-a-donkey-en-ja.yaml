        "original_unit_id": "/html/body/p[259]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2562-2565"
    "translation_ja": "それは大変うれしいと老人は言った。「ほら」と胸を叩いてつけ加えた。「ここが喜ぶんです」。この谷にも少しばかり主を知る人がいる、と話を継いだ。多くはないが、何人かはいる。「招かれる者は多く」と引用した。「選ばれる者は少ない」"
    "translation_status": "reviewed"
  - "id": "td-290"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘My father,’ said I, ‘it is not easy to say who know the Lord; and it is none of our business. Protestants and Catholics, and even those who worship stones, may know Him and be known by Him; for He has made all.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

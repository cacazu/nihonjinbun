        "source_sequence": 1911
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[199]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1911-1926"
    "translation_ja": "松林でその時刻になると、喉が渇いて目を覚ました。そばに半分まで水を入れたブリキの容器が立っていた。一息に空にした。冷たい水を内側から浴びたおかげですっかり目がさめたので、起き直って紙巻き煙草を作った。星は澄み、色を帯び、宝石のようだったが、凍てついてはいなかった。銀色のかすかな靄が天の川である。まわりをモミの黒い尖端が囲み、まっすぐにぴくりとも動かない。荷鞍の白さでモデスティーヌがつなぎ綱いっぱいにぐるぐる回っているのが見え、たえず草をもぐもぐ食べるのも聞こえたが、ほかには細流が石の上でたてる、言いようのない静かな語らいしかなかった。ものぐさに寝たまま煙草を吸い、私たちが空と呼ぶ宇宙の空虚の色を、松の向こうの赤みがかった灰色から、星々の間の艶のある青黒さまで見つめた。私は行商人らしさを増すためとでもいうように、銀の指輪をはめている。煙草を上げ下げするたびに、かすかに光るのが見え、ひと吸いするたび手のひらが照らされて、ほんの一秒、この風景で一番の明るみになった。"
    "translation_status": "reviewed"
  - "id": "td-224"
    "section_id": "a-night-among-the-pines"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A faint wind, more like a moving coolness than a stream of air, passed down the glade from time to time; so that even in my great chamber the air was being renewed all night long. I thought with horror of the inn at Chasseradès and the congregated nightcaps; with horror of the nocturnal prowesses of clerks and students, of hot theatres and pass-keys and close rooms. I have not often enjoyed a more serene possession of myself, nor felt more independent of material aids. The outer world, from which we cower into our houses, seemed after all a gentle habitable place; and night after night a man’s bed, it seemed, was laid and waiting for him in the fields, where God keeps an open house. I thought I had rediscovered one of those truths which are revealed to savages and hid from political economists: at the least, I had discovered a new pleasure for myself. And yet even while I was exulting in my solitude I became aware of a strange lack. I wished a companion to lie near me in the starlight, silent and not moving, but ever within touch. For there is a fellowship more quiet even than solitude, and which, rightly understood, is solitude made perfect. And to live out of doors with the woman a man loves is of all lives the most complete and free."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[200]"
        "line_start": 1889
        "line_end": 1907
        "source_sequence": 1889
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1928
        "line_end": 1945
        "source_sequence": 1928
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[200]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1928-1945"
    "translation_ja": "わずかな風が、ときおり空き地を吹き抜けた。空気の流れというより、冷たさが移動するような風だった。だからこの大きな部屋でも、一晩じゅう空気が入れ替わっていた。シャスラデスの宿と寝帽子の群れを思い出してぞっとした。事務員や学生の夜の大奮闘、暑苦しい劇場、合鍵、閉めきった部屋を思ってぞっとした。これほど静かに自分を取りもどせたことも、物の助けがなくて済むと感じたことも、滅多にない。私たちが身を縮め、家へ逃げこんで避ける外の世界も、結局は穏やかで、ちゃんと暮らせる場所に思えた。毎晩、野には人間の寝床が敷かれ、来るのを待っているらしい。そこでは神が誰にでも戸を開けている。文明に染まらぬ人には明かされ、政治経済学者には隠された真理の一つを、発見し直した気分だった。それはともかく、新しい楽しみを一つ見つけたのは確かだ。ところが孤独を喜びながらも、妙なもの足りなさに気づいた。星明かりのもと、私のそばに横たわってくれる連れが欲しい。静かで動かず、いつでも手を伸ばせば触れられるほど近くにいてくれる人だ。孤独よりなお静かな交わりがある。正しく理解すれば、それは完全になった孤独である。男が愛する女と戸外で暮らすことは、あらゆる暮らしのうち、一番欠けるところがなく、自由なものだ。"
    "translation_status": "reviewed"
  - "id": "td-225"
    "section_id": "a-night-among-the-pines"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "As I thus lay, between content and longing, a faint noise stole towards me through the pines. I thought, at first, it was the crowing of cocks or the barking of dogs at some very distant farm; but steadily and gradually it took articulate shape in my ears, until I became aware that a passenger was going by upon the high-road in the valley, and singing loudly as he went. There was more of good-will than grace in his performance; but he trolled with ample lungs; and the sound of his voice took hold upon the hillside and set the air shaking in the leafy glens. I have heard people passing by night in sleeping cities; some of them sang; one, I remember, played loudly on the bagpipes. I have heard the rattle of a cart or carriage spring up suddenly after hours of stillness, and pass, for some minutes, within the range of my hearing as I lay abed. There is a romance about all who are abroad in the black hours, and with something of a thrill we try to guess their business. But here the romance was double: first, this glad passenger, lit internally with wine, who sent up his voice in music through the night; and then I, on the other hand, buckled into my sack, and smoking alone in the pine-woods between four and five thousand feet towards the stars."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[201]"
        "line_start": 1908
        "line_end": 1926
        "source_sequence": 1908
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1947
        "line_end": 1964
        "source_sequence": 1947
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[201]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1947-1964"
    "translation_ja": "満足と渇望の間でこうして横になっていると、松林を抜け、かすかな音が忍びよってきた。最初はずっと遠くの農場の雄鶏か犬かと思った。だがじょじょに、確かに意味のある音になり、谷の街道を通る者が、大声で歌いながら行くのだと分かった。上手さよりは上機嫌で歌っていたが、声量は大したもので、その声が山腹に食いつき、木の茂る谷間の空気を震わせた。夜、寝静まった町を通る人の物音を聞いたことがある。歌う人もいて、覚えている一人はバグパイプを大きく鳴らしていた。何時間も物音がしなかったあとで、荷車か馬車の音がふと湧いて、私が寝床に横たわるその耳の届くところを、数分かけて通りすぎることもあった。漆黒の時刻に外を行く人にはみな、何やら物語めいたものがある。胸を少しときめかせ、何の用だろうと想像してみる。ここでの物語は二重だった。まず、ワインに内側から照らされ、夜に歌声を上げる、この陽気な通行人。そして一方には、寝袋に金具で体をとめて、海抜四千から五千フィート、松林でひとり星に向かって煙草をふかす私である。"
    "translation_status": "reviewed"
  - "id": "td-226"
    "section_id": "a-night-among-the-pines"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When I awoke again (Sunday, 29th September), many of the stars had disappeared; only the stronger companions of the night still burned visibly overhead; and away towards the east I saw a faint haze of light upon the horizon, such as had been the Milky Way when I was last awake. Day was at hand. I lit my lantern, and by its glow-worm light put on my boots and gaiters; then I broke up some bread for Modestine, filled my can at the water-tap, and lit my spirit-lamp to boil myself some chocolate. The blue darkness lay long in the glade where I had so sweetly slumbered; but soon there was a broad streak of orange melting into gold along the mountain-tops of Vivarais. A solemn glee possessed my mind at this gradual and lovely coming in of day. I heard the runnel with delight; I looked round me for something beautiful and unexpected; but the still black pine-trees, the hollow glade, the munching ass, remained unchanged in figure. Nothing had altered but the light, and that, indeed, shed over all a spirit of life and of breathing peace, and moved me to a strange exhilaration."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[202]"
        "line_start": 1927
        "line_end": 1942
        "source_sequence": 1927
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1966
        "line_end": 1981
        "source_sequence": 1966
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[202]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1966-1981"
    "translation_ja": "九月二十九日の日曜、また目を覚ますと、星の多くは姿を消していた。夜の伴侶でも力の強いものだけが頭上に見えて燃えており、東の地平線には、前に起きたときの天の川のような、薄い光の靄がかかっていた。夜明けが近かった。角灯をともし、蛍のような光で靴と脚絆をつけ、モデスティーヌにパンを割ってやり、流れの水道で容器を満たし、ココアを煮るのにアルコールランプをつけた。甘い眠りを味わった空き地には、長く青い闇が横たわっていた。だがまもなく、金色に溶けこむ幅広い橙の筋が、ヴィヴァレの山頂につらなった。日が少しずつ、美しく入ってくるのを見て、荘厳な喜びに心を奪われた。小川の音に耳を喜ばせ、何か美しく思いがけないものはないかと見まわしたが、静かな黒松、窪んだ空き地、ものを食べるロバはみな同じ形のままだった。光のほかには何も変わっていない。しかし光こそがあたり一面に生命と息づく平安の気配を注ぎ、私を不思議な陽気さでいっぱいにした。"
    "translation_status": "reviewed"
  - "id": "td-227"
    "section_id": "a-night-among-the-pines"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I drank my water-chocolate, which was hot if it was not rich, and strolled here and there, and up and down about the glade. While I was thus delaying, a gush of steady wind, as long as a heavy sigh, poured direct out of the quarter of the morning. It was cold, and set me sneezing. The trees near at hand tossed their black plumes in its passage; and I could see the thin distant spires of pine along the edge of the hill rock slightly to and fro against the golden east. Ten minutes after, the sunlight spread at a gallop along the hillside, scattering shadows and sparkles, and the day had come completely."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

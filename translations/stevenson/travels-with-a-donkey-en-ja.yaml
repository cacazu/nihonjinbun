        "original_unit_id": "line-1831-1847"
    "translation_ja": "罰と同じく、不吉な浮かれようにも命を取られるほどでないものがある。このとき私は機嫌がよすぎて、ある冒険に引きこまれた。将来のロバ使いたちのために話しておこう。道は山腹を大きくジグザグに走るので、地図と羅針盤で近道を定め、低い木の茂みを突っ切り、上のほうで道に合流することにした。これがモデスティーヌとの一度きりの本格的な衝突になった。彼女は私の近道など御免だった。こちらへ向き直り、後ずさりし、後ろ脚で立ち上がった。いままで声が出ないと思っていたのに、夜明けの雄鶏のように、大きなしゃがれ声を華々しく響かせたのである。片手で突き棒を使い、坂があまりに急なので、もう片方の手では荷鞍を押さえねばならなかった。六度ばかり彼女は私の上にひっくり返りかけ、六度ばかり私は気がくたびれはてて、もうあきらめ、引き返して道をたどろうとしかけた。だが、これは賭けだと決め、最後までやり抜いた。また道を進むうちに、冷たい雨粒のようなものが手に落ちて、驚いて何度も雲一つない空を見上げた。だがただ額からしたたる汗だった。"
    "translation_status": "reviewed"

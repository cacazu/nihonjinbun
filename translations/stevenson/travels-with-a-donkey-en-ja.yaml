  - "id": "td-135"
    "section_id": "cheylard-and-luc"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was not only heavy thoughts about Modestine that weighted me upon the way; it was a leaden business altogether. For first, the wind blew so rudely that I had to hold on the pack with one hand from Cheylard to Luc; and second, my road lay through one of the most beggarly countries in the world. It was like the worst of the Scottish Highlands, only worse; cold, naked, and ignoble, scant of wood, scant of heather, scant of life. A road and some fences broke the unvarying waste, and the line of the road was marked by upright pillars, to serve in time of snow."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[123]"
        "line_start": 1154
        "line_end": 1162
        "source_sequence": 1154
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1120
        "line_end": 1127
        "source_sequence": 1120
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[123]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1120-1127"
    "translation_ja": "道中、重くのしかかったのはモデスティーヌについての考えだけでない。何から何まで鉛のように重かった。まず風があまりに手荒に吹くので、シェラールからリュックまで片手で荷を押さえねばならず、次に、道がこの世でも指折りのみすぼらしい土地を抜けていた。それはスコットランド高地の一番ひどいところを、なおひどくしたようだった。冷たく、むき出しで、取り柄もなく、木もヒースも生き物も乏しい。一筋の道といくつかの柵が、変わりばえのしない荒野を途中で断ち、雪のときの目印に、道沿いに柱が立っていた。"
    "translation_status": "reviewed"
  - "id": "td-136"
    "section_id": "cheylard-and-luc"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Why any one should desire to visit either Luc or Cheylard is more than my much-inventing spirit can suppose. For my part, I travel not to go anywhere, but to go. I travel for travel’s sake. The great affair is to move; to feel the needs and hitches of our life more nearly; to come down off this feather-bed of civilisation, and find the globe granite underfoot and strewn with cutting flints. Alas, as we get up in life, and are more preoccupied with our affairs, even a holiday is a thing that must be worked for. To hold a pack upon a pack-saddle against a gale out of the freezing north is no high industry, but it is one that serves to occupy and compose the mind. And when the present is so exacting, who can annoy himself about the future?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[124]"
        "line_start": 1163
        "line_end": 1174
        "source_sequence": 1163
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1129
        "line_end": 1139
        "source_sequence": 1129
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[124]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1129-1139"
    "translation_ja": "どんな人が何を好きこのんでリュックかシェラールを訪ねようと思うのか、空想のたくましい私にも見当がつかない。私の場合は、どこかに着くためではなく、道をゆくために旅をする。旅のための旅だ。肝心なのは動くこと、生活の必要やままならなさをもっとじかに感じること、文明という羽根布団から降りてみれば、足もとの地球は花崗岩で、鋭い火打石のかけらが散らばっていると知ることだ。ああ、世に出ていろいろ仕事にかまけるようになると、休暇さえ働いて勝ち取らなくてはならない。凍てつく北からの強風に逆らって荷鞍の荷を押さえるのは、たいそうな仕事ではないが、気をまぎらせ、心を落ち着かせるには用が足りる。いまこの時がこんなにも手のかかるものなら、先のことを気に病んでいられる者がいるだろうか。"
    "translation_status": "reviewed"
  - "id": "td-137"
    "section_id": "cheylard-and-luc"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I came out at length above the Allier. A more unsightly prospect at this season of the year it would be hard to fancy. Shelving hills rose round it on all sides, here dabbled with wood and fields, there rising to peaks alternately naked and hairy with pines. The colour throughout was black or ashen, and came to a point in the ruins of the castle of Luc, which pricked up impudently from below my feet, carrying on a pinnacle a tall white statue of Our Lady, which, I heard with interest, weighed fifty quintals, and was to be dedicated on the 6th of October. Through this sorry landscape trickled the Allier and a tributary of nearly equal size, which came down to join it through a broad nude valley in Vivarais. The weather had somewhat lightened, and the clouds massed in squadron; but the fierce wind still hunted them through heaven, and cast great ungainly splashes of shadow and sunlight over the scene."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[125]"
        "line_start": 1175
        "line_end": 1188
        "source_sequence": 1175
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1141
        "line_end": 1153
        "source_sequence": 1141
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[125]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1141-1153"
    "translation_ja": "やがてアリエ川を見下ろすところに出た。この季節にこれ以上見栄えのしない眺めは、そう思いつかないだろう。傾斜した丘が川を四方から囲み、ここでは木立と田畑でまだらになり、あそこでは裸の頂と松の毛むくじゃらの頂がかわるがわる立ち上がる。色はどこも黒か灰色で、そのとどめがリュック城の廃墟だった。私の足より低いところから厚かましくぬっと突き出し、尖塔の先に背の高い白い聖母像を載せている。面白いことに、重さは五十キンタルあり、十月六日に奉献されると聞いた。この陰気な景色の中をアリエ川が細々と流れ、ほとんど同じ大きさの支流が、ヴィヴァレの広くむき出しの谷を下って合流していた。多少天気は明るくなり、雲は隊をなして集まったが、荒々しい風はなお空じゅう雲を追い、大きく見苦しい日なたや日陰を、景色にまき散らした。"
    "translation_status": "reviewed"
  - "id": "td-138"
    "section_id": "cheylard-and-luc"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Luc itself was a straggling double file of houses wedged between hill and river. It had no beauty, nor was there any notable feature, save the old castle overhead with its fifty quintals of brand-new Madonna. But the inn was clean and large. The kitchen, with its two box-beds hung with clean check curtains, with its wide stone chimney, its chimney-shelf four yards long and garnished with lanterns and religious statuettes, its array of chests and pair of ticking clocks, was the very model of what a kitchen ought to be; a melodrama kitchen, suitable for bandits or noblemen in disguise. Nor was the scene disgraced by the landlady, a handsome, silent, dark old woman, clothed and hooded in black like a nun. Even the public bedroom had a character of its own, with the long deal tables and benches, where fifty might have dined, set out as for a harvest-home, and the three box-beds along the wall. In one of these, lying on straw and covered with a pair of table-napkins, did I do penance all night long in goose-flesh and chattering teeth, and sigh, from time to time as I awakened, for my sheepskin sack and the lee of some great wood."
    "source_languages":
      - "en"

    "translation_ja": "「なにしろ」と私。「人に何か言って、一から十まで相手の同意できる話でなければ、たちまちむきになって食ってかかりますよ」"
    "translation_status": "reviewed"
  - "id": "td-182"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They both declared that such a state of things was antichristian."

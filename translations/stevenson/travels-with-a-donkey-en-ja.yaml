  - "id": "td-280"
    "section_id": "in-the-valley-of-the-tarn"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was soon on the road, nibbling a cake of chocolate and seriously occupied with a case of conscience. Was I to pay for my night’s lodging? I had slept ill, the bed was full of fleas in the shape of ants, there was no water in the room, the very dawn had neglected to call me in the morning. I might have missed a train, had there been any in the neighbourhood to catch. Clearly, I was dissatisfied with my entertainment; and I decided I should not pay unless I met a beggar."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"

  - "id": "td-178"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "But there was another side to my residence at Our Lady of the Snows. At this late season there were not many boarders; and yet I was not alone in the public part of the monastery. This itself is hard by the gate, with a small dining-room on the ground-floor and a whole corridor of cells similar to mine upstairs. I have stupidly forgotten the board for a regular retraitant; but it was somewhere between three and five francs a day, and I think most probably the first. Chance visitors like myself might give what they chose as a free-will offering, but nothing was demanded. I may mention that when I was going away, Father Michael refused twenty francs as excessive. I explained the reasoning which led me to offer him so much; but even then, from a curious point of honour, he would not accept it with his own hand. ‘I have no right to refuse for the monastery,’ he explained, ‘but I should prefer if you would give it to one of the brothers.’"
    "source_languages":
      - "en"
      - "fr"
    "source_locations":

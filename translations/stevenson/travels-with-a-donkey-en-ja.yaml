    "translation_ja": "「それでそんな歩き方なんですかい！」と彼は叫び、頭をのけぞらせ、ひとしきり腹の底から笑った。腹を立てかけながら、私は彼の気がすむまで眺めていた。「こういう畜生をかわいそうがっちゃいけませんよ」と言い、藪から小枝を一本むしり取ると、掛け声とともにモデスティーヌの尻まわりをぴしぴし打ちはじめた。曲者め、耳をぴんと立て、みごとな早足になって、百姓がそばにいるあいだは、一度もへばらず、苦しげな様子をみじんも見せずに進んだ。さきほどの息切れや震えは、残念ながら、ひと芝居だったのだ。"

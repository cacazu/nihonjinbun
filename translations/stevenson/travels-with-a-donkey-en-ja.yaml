    "translation_ja": "だが司祭はそれまでの話の趣旨を忘れていなかった。怒りの頂点で古参軍人は、自分をたしなめる視線にふと気づいた。己の振る舞いのおかしさが稲光のように胸に落ちた。嵐はとたんに、あと一言もなしにおさまった。"
    "translation_status": "reviewed"
  - "id": "td-186"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was only in the morning, over our coffee (Friday, September 27th), that this couple found out I was a heretic. I suppose I had misled them by some admiring expressions as to the monastic life around us; and it was only by a point-blank question that the truth came out. I had been tolerantly used both by simple Father Apollinaris and astute Father Michael; and the good Irish deacon, when he heard of my religious weakness, had only patted me upon the shoulder and said, ‘You must be a Catholic and come to heaven.’ But I was now among a different sect of orthodox. These two men were bitter and upright and narrow, like the worst of Scotsmen, and indeed, upon my heart, I fancy they were worse. The priest snorted aloud like a battle-horse."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[167]"
        "line_start": 1617
        "line_end": 1627
        "source_sequence": 1617
      - "source_id": "gutenberg-535-text"

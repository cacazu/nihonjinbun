  - "id": "td-199"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "At this moment, whilst I was somewhat embarrassed how to answer, in came one of the monks, a little brown fellow, as lively as a grig, and with an Italian accent, who threw himself at once into the contention, but in a milder and more persuasive vein, as befitted one of these pleasant brethren. Look at him, he said. The rule was very hard; he would have dearly liked to stay in his own country, Italy—it was well known how beautiful it was, the beautiful Italy; but then there were no Trappists in Italy; and he had a soul to save; and here he was."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[180]"
        "line_start": 1678
        "line_end": 1685
        "source_sequence": 1678
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1697
        "line_end": 1704
        "source_sequence": 1697
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[180]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1697-1704"
    "translation_ja": "答えにいくらか窮しているところへ、修道士が一人入ってきた。小柄で浅黒く、コオロギのように元気で、イタリア訛りがある。すぐ論争に飛びこんできたものの、あの感じのよい兄弟の一人らしく、もっと穏やかで人の心に訴える調子だった。自分を見てくれ、と言った。会の戒律はとても厳しい。祖国イタリアにいられたらどんなによかったろう。美しいイタリアがどれほど美しいかはみな知っている。だがイタリアにはトラピスト会がなかった。自分には救わねばならない魂があり、それでここにいる。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 304
          "end": 307
          "exact": "him"
  - "id": "td-200"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I am afraid I must be at bottom, what a cheerful Indian critic has dubbed me, ‘a faddling hedonist,’ for this description of the brother’s motives gave me somewhat of a shock. I should have preferred to think he had chosen the life for its own sake, and not for ulterior purposes; and this shows how profoundly I was out of sympathy with these good Trappists, even when I was doing my best to sympathise. But to the curé the argument seemed decisive."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[181]"
        "line_start": 1686
        "line_end": 1693
        "source_sequence": 1686

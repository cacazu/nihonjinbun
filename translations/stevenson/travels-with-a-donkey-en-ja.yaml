    "kind": "paragraph"
    "origin": "source"
    "source_text": "A step or two farther I was overtaken by an old man in a brown nightcap, clear-eyed, weather-beaten, with a faint excited smile. A little girl followed him, driving two sheep and a goat; but she kept in our wake, while the old man walked beside me and talked about the morning and the valley. It was not much past six; and for healthy people who have slept enough, that is an hour of expansion and of open and trustful talk."
    "source_languages":

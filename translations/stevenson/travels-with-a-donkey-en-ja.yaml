        "source_sequence": 694
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 617
        "line_end": 619
        "source_sequence": 617
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[61]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-617-619"
    "translation_ja": "かくして賢明な農民は、生まれつきの不都合にも慰めを見いだし、目の覚めるような民主的手続きによって、多数派の欠点が美の基準を決めるのである。"
    "translation_status": "reviewed"
  - "id": "td-069"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘And where,’ said I, ‘is monsieur?’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

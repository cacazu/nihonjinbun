  - "id": "td-166"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In all these journeyings to and fro, many silent fathers and brethren fell in our way. Usually they paid no more regard to our passage than if we had been a cloud; but sometimes the good deacon had a permission to ask of them, and it was granted by a peculiar movement of the hands, almost like that of a dog’s paws in swimming, or refused by the usual negative signs, and in either case with lowered eyelids and a certain air of contrition, as of a man who was steering very close to evil."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"

    "translation_ja": "グレ山の頂を越えるところには、はっきりした道はない。ただ牛追いの目当てに立てた石が間隔をおいて並んでいた。踏む芝は弾み、よい香りがした。連れは雲雀が一羽か二羽で、レスタンプからブレマールまで出会ったのは牛車一台きりだった。目の前に浅い谷、その向こうにロゼール山塊が見えた。木はまばらだが山腹の形はなかなかよく、とはいえ輪郭はまっすぐで単調であった。耕作のしるしはほとんどない。ただブレマールのあたりで、ヴィルフォールからマンドへ通じる白い街道が、尖ったポプラの並ぶ一帯の牧草地を横切っていた。羊や牛の鳴らす鈴が端から端に響いていた。"

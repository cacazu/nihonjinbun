    "translation_ja": "リュックそのものは、丘と川の間に押しこめられた、二列にだらだら続く家並みだった。美しさはなく、頭上の古城に五十キンタルの新品の聖母が立つことを除けば、名に値する特色もない。だが、宿は清潔で広かった。格子縞の清潔なカーテンを掛けた箱型寝台が二つ、広い石造りの炉、四ヤードもある炉棚には角灯や宗教の小像が並び、いくつも長持があって、時計が二つ時を刻む。台所とはかくあるべきものという見本だった。芝居の台所で、山賊やお忍びの貴族にぴったりである。おかみもこの舞台を損ねなかった。修道女のように黒衣と黒い頭巾をまとった、無口で見栄えのする浅黒い老女だった。相部屋の寝室にしても独特の風情があった。五十人が食事をとれそうな長い松板の卓と腰掛けが、収穫祭のように並び、壁沿いに箱型寝台が三つある。私はその一つで藁に横たわり、二枚の食卓用ナプキンをかけ、鳥肌を立て歯を鳴らしてひと晩じゅう苦行をし、時おり目を覚ましては羊皮の寝袋と大きな森の風下を恋しがって、ため息をついた。"
    "translation_status": "reviewed"

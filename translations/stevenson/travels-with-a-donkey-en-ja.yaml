        "original_unit_id": "line-1433-1453"
    "translation_ja": "修道士は院長の特別のお許しでまだ一日に二度は食事をしていた。だがすでに大斎の時期であった。九月のいつかに始まって復活祭まで続き、その間は二十四時間に一度、それも午後二時にしか食べない。一日の労働と祈りを始めて十二時間たって、ようやく食事である。粗食で、そのわずかさえ節して食べる。ワインも小さな水差し一つが許されるとはいえ、享楽を慎む者は多い。世の大方がひどく食べすぎるのは疑いない。食事は生きるためばかりでなく、人生の労苦をひととき忘れさせる気のおけない、自然な楽しみでもある。それでも過食が害だとして、このトラピスト式の食事では何かが不足すると思うところだ。ところが、今振り返って、出会った者が一様に色つやのよい顔、朗らかな物腰だったことに驚く。これ以上幸せそうで、これ以上健康そうな一団を見たことがあったろうか。実際には、この寒々しい高地に、絶え間なく働く修道士のこと、雪の聖母では命も当てにならず、死がしばしば訪れる。少なくともそう聞いた。だがたやすく死ぬにしても、それまでは健康に暮らしているにちがいない。みな血色がよく、肉づきは引き締まり、私の見つけられた唯一の病的なしるし、異様に澄んだ目でさえ、全体の生気と力強さをかえって引き立てていた。"
    "translation_status": "reviewed"
  - "id": "td-168"
    "section_id": "the-monks"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Those with whom I spoke were singularly sweet-tempered, with what I can only call a holy cheerfulness in air and conversation. There is a note, in the direction to visitors, telling them not to be offended at the curt speech of those who wait upon them, since it is proper to monks to speak little. The note might have been spared; to a man the hospitallers were all brimming with innocent talk, and, in my experience of the monastery, it was easier to begin than to break off a conversation. With the exception of Father Michael, who was a man of the world, they showed themselves full of kind and healthy interest in all sorts of subjects—in politics, in voyages, in my sleeping-sack—and not without a certain pleasure in the sound of their own voices."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"

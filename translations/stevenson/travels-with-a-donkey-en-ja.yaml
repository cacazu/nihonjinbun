  - "id": "td-250"
    "section_id": "pont-de-montvert"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘Children of God,’ cried the prophet, ‘hold your hands. Let us burn the house, with the priest and the satellites of Baal.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"

      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3088-3097"
    "translation_ja": "たびたび鋭く曲がって下るうち、あるところで月が丘の向こうに隠れた。深い闇を行くうちに、もう一つ角を曲がるや、何の前触れもなくサン・ジェルマン・ド・カルベルトに飛び出した。あたりは寝しずまり、真っ暗な夜に埋もれている。開いた一つの戸からだけ、道にランプの明かりが漏れ、ようやく人の住まいの中に来たのだと知れた。その晩最後のおしゃべりの二人が、まだ庭の石垣のそばで話していて、宿を教えてくれた。おかみは子どもたちを寝かしつけていた。火はもう消えていて、ぶつぶつ言いながらおこし直さねばならなかった。あと半時間遅ければ、私は夕飯抜きで寝ることになったろう。"
    "translation_status": "reviewed"

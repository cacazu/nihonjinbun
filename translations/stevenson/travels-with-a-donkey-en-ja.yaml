  - "id": "td-361"
    "section_id": "farewell-modestine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On examination, on the morning of October 3rd, Modestine was pronounced unfit for travel. She would need at least two days’ repose, according to the ostler; but I was now eager to reach Alais for my letters; and, being in a civilised country of stage-coaches, I determined to sell my lady friend and be off by the diligence that afternoon. Our yesterday’s march, with the testimony of the driver who had pursued us up the long hill of St. Pierre, spread a favourable notion of my donkey’s capabilities. Intending purchasers were aware of an unrivalled opportunity. Before ten I had an offer of twenty-five francs; and before noon, after a desperate engagement, I sold her, saddle and all, for five-and-thirty. The pecuniary gain is not obvious, but I had bought freedom into the bargain."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[326]"
        "line_start": 3122
        "line_end": 3133
        "source_sequence": 3122
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 3270
        "line_end": 3281
        "source_sequence": 3270
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[326]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-3270-3281"
    "translation_ja": "十月三日の朝、調べてもらうと、モデスティーヌは旅に耐えないと宣告された。馬丁によれば、二日は休ませねばならない。だが私は自分宛の手紙を受け取りに、早くアレへ着きたかった。乗合馬車のある文明の地に来たのだから、このご婦人を売り、午後の馬車で発とうと決めた。昨日の道のりと、サン・ピエールの長い坂を後ろから見ていた御者の証言で、私のロバの力量は評判になった。買う気の者は、またとない機会だと知っていた。十時前に二十五フランという申し出があり、正午前、激しいひと戦のすえに、鞍ともども三十五フランで売った。金勘定のうまみは明らかでないが、その取引で私は自由まで買ったのだった。"
    "translation_status": "reviewed"
  - "id": "td-362"
    "section_id": "farewell-modestine"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "St Jean du Gard is a large place, and largely Protestant. The maire, a Protestant, asked me to help him in a small matter which is itself characteristic of the country. The young women of the Cevennes profit by the common religion and the difference of the language to go largely as governesses into England; and here was one, a native of Mialet, struggling with English circulars from two different agencies in London. I gave what help I could; and volunteered some advice, which struck me as being excellent."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[327]"

    "translation_ja": "穏やかで、男ぶりがよく、分別もあり、人なつこく、それでいて驚くほどものを知らない老人であった。妻はもう少し愛想がなかったが、字は読めた。もっとも、読書をすることはまずなかったろう。それなりに頭が切れ、一家を取り仕切る者らしく、物言いには鋭さがあった。"
    "translation_status": "reviewed"
  - "id": "td-055"

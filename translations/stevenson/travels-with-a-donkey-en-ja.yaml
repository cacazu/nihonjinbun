    "translation_ja": "「じゃ、よろしい」（落胆して）「著述家と」"
    "translation_status": "reviewed"
  - "id": "td-153"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It appeared he had been in a seminary with six young Irishmen, all priests long since, who had received newspapers and kept him informed of the state of ecclesiastical affairs in England. And he asked me eagerly after Dr. Pusey, for whose conversion the good man had continued ever since to pray night and morning."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[137]"
        "line_start": 1305
        "line_end": 1309
        "source_sequence": 1305
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1287
        "line_end": 1291
        "source_sequence": 1287
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[137]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1287-1291"
    "translation_ja": "この人は神学校で六人の若いアイルランド人と一緒にいたことがあり、みなずっと前に司祭になったのだという。彼らは新聞を受け取っていたので、イングランドの教会事情を教えてくれたそうだ。私には熱心にピュージー博士の消息を尋ねた。善良な神父はその頃からずっと、朝晩、博士が改宗するように祈りつづけたのである。"
    "translation_status": "reviewed"
  - "id": "td-154"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘I thought he was very near the truth,’ he said; ‘and he will reach it yet; there is so much virtue in prayer.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[138]"
        "line_start": 1310
        "line_end": 1311
        "source_sequence": 1310
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1293
        "line_end": 1294
        "source_sequence": 1293
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[138]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1293-1294"
    "translation_ja": "「あの方は真理のすぐそばまで来ていたと思うのです」と言った。「まだ、きっとたどり着きます。祈りにはそれだけの力がありますから」"
    "translation_status": "reviewed"
  - "id": "td-155"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "He must be a stiff, ungodly Protestant who can take anything but pleasure in this kind and hopeful story. While he was thus near the subject, the good father asked me if I were a Christian; and when he found I was not, or not after his way, he glossed it over with great good-will."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[139]"
        "line_start": 1312
        "line_end": 1316
        "source_sequence": 1312
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1296
        "line_end": 1299
        "source_sequence": 1296
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[139]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1296-1299"
    "translation_ja": "この心やさしい、希望に満ちた話を喜べないとしたら、よほど頑な、不信心なプロテスタントにちがいない。この話のついでに、気のいい神父は私がキリスト教徒か尋ねた。そうでない、少なくとも神父のいう意味ではそうでないと知ると、たいそう好意的に、そのことはさらりと流した。"
    "translation_status": "reviewed"
  - "id": "td-156"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The road which we were following, and which this stalwart father had made with his own two hands within the space of a year, came to a corner, and showed us some white buildings a little farther on beyond the wood. At the same time, the bell once more sounded abroad. We were hard upon the monastery. Father Apollinaris (for that was my companion’s name) stopped me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[140]"
        "line_start": 1317
        "line_end": 1322
        "source_sequence": 1317
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1301
        "line_end": 1306
        "source_sequence": 1301
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[140]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1301-1306"
    "translation_ja": "歩いていた道は、このたくましい神父が一年の間に両の手で造ったものだが、角にかかると、森の向こうの少し先に白い建物がいくつか見えた。同時に鐘がもう一度、野に響いた。修道院は目と鼻の先だった。アポリナリス神父、というのが連れの名だったが、そこで私を呼び止めた。"
    "translation_status": "reviewed"
  - "id": "td-157"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘I must not speak to you down there,’ he said. ‘Ask for the Brother Porter, and all will be well. But try to see me as you go out again through the wood, where I may speak to you. I am charmed to have made your acquaintance.’"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[141]"
        "line_start": 1323
        "line_end": 1326
        "source_sequence": 1323
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1308
        "line_end": 1311
        "source_sequence": 1308
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[141]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1308-1311"
    "translation_ja": "「あそこではあなたとお話ししてはいけないのです」と言った。「門番役の修道士を呼んでもらえば大丈夫です。ただ、お帰りにまた森を通るとき、できたら会いに来てください。そこならお話しできます。お知り合いになれて光栄です」"
    "translation_status": "reviewed"
  - "id": "td-158"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And then suddenly raising his arms, flapping his fingers, and crying out twice, ‘I must not speak, I must not speak!’ he ran away in front of me, and disappeared into the monastery door."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[142]"
        "line_start": 1327
        "line_end": 1329
        "source_sequence": 1327
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1313
        "line_end": 1315
        "source_sequence": 1313
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[142]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1313-1315"
    "translation_ja": "そこで急に腕を振り上げ、指をばたばた動かし、「話しちゃいけない、話しちゃいけない！」と二度叫ぶと、私の前を走って行き、修道院の戸口に消えた。"
    "translation_status": "reviewed"
  - "id": "td-159"
    "section_id": "father-apollinaris"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I own this somewhat ghastly eccentricity went a good way to revive my terrors. But where one was so good and simple, why should not all be alike? I took heart of grace, and went forward to the gate as fast as Modestine, who seemed to have a disaffection for monasteries, would permit. It was the first door, in my acquaintance of her, which she had not shown an indecent haste to enter. I summoned the place in form, though with a quaking heart. Father Michael, the Father Hospitaller, and a pair of brown-robed brothers came to the gate and spoke with me a while. I think my sack was the great attraction; it had already beguiled the heart of poor Apollinaris, who had charged me on my life to show it to the Father Prior. But whether it was my address, or the sack, or the idea speedily published among that part of the brotherhood who attend on strangers that I was not a pedlar after all, I found no difficulty as to my reception. Modestine was led away by a layman to the stables, and I and my pack were received into Our Lady of the Snows."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[143]"
        "line_start": 1330
        "line_end": 1345
        "source_sequence": 1330
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1317
        "line_end": 1331
        "source_sequence": 1317
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[143]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1317-1331"
    "translation_ja": "白状すると、このいくらか鬼気迫る奇行で、私の恐れはいささかぶり返した。だが一人があんなに善良で無邪気なら、皆同じでないとどうして言えよう。勇気を取り直し、どうも修道院が嫌いらしいモデスティーヌの許す限り急いで門に進んだ。いつもは戸口を見ればみっともないほど駆けこもうとするモデスティーヌが、ここばかりは違った。こんな戸口は彼女と出会って初めてだった。心はおののいたが、しきたりどおり門を叩いた。宿泊係のミカエル神父と茶色の僧衣の修道士が二人出てきて、しばらく話をした。一番目を引いたのは寝袋だったと思う。すでに哀れなアポリナリスの心を惑わせ、何があっても副院長に見せてくれと頼まれていたのだ。だが私の口の利き方か、寝袋か、それとも、どうやら行商人でなかったという話が、よそ者の世話をする一部の修道士の間にたちまち広まったおかげか、ともかく何の苦もなく受け入れられた。モデスティーヌは在俗の者が厩に引いていき、私と寝袋は雪の聖母修道院に迎え入れられた。"
    "translation_status": "reviewed"

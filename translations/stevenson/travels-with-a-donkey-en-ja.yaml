  - "id": "td-317"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was now drawing near to Cassagnas, a cluster of black roofs upon the hillside, in this wild valley, among chestnut gardens, and looked upon in the clear air by many rocky peaks. The road along the Mimente is yet new, nor have the mountaineers recovered their surprise when the first cart arrived at Cassagnas. But although it lay thus apart from the current of men’s business, this hamlet had already made a figure in the history of France. Hard by, in caverns of the mountain, was one of the five arsenals of the Camisards; where they laid up clothes and corn and arms against necessity, forged bayonets and sabres, and made themselves gunpowder with willow charcoal and saltpetre boiled in kettles. To the same caves, amid this multifarious industry, the sick and wounded were brought up to heal; and there they were visited by the two surgeons, Chabrier and Tavan, and secretly nursed by women of the neighbourhood."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[284]"
        "line_start": 2767
        "line_end": 2780
        "source_sequence": 2767
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2879
        "line_end": 2891
        "source_sequence": 2879
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[284]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2879-2891"
    "translation_ja": "カサニャスに近づいてきた。荒々しい谷の山腹、栗畑の間に黒い屋根が集まり、澄んだ大気の中、岩だらけの峰がいくつも見下ろしている。ミマント沿いの道はまだ新しく、初めて荷車がカサニャスに着いたときの驚きは、山の人々の間でいまだにさめない。だが世間の営みの流れから離れていながら、この集落はすでにフランスの歴史で存在を示したことがあった。すぐ近くの山の洞窟に、カミザールの五つの武器庫の一つがあったのだ。そこではいざというときのため、衣服と穀物と武器を貯え、銃剣や軍刀を鍛え、柳の炭を用い、硝石を釜で煮て、火薬も自分たちで作った。これほど多様な仕事をする同じ洞窟に、病人や負傷者も、癒やすために運び上げた。外科医のシャブリエとタヴァンが見舞いに来て、近隣の女たちがひそかに看病した。"
    "translation_status": "reviewed"
  - "id": "td-318"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Of the five legions into which the Camisards were divided, it was the oldest and the most obscure that had its magazines by Cassagnas. This was the band of Spirit Séguier; men who had joined their voices with his in the 68th Psalm as they marched down by night on the archpriest of the Cevennes. Séguier, promoted to heaven, was succeeded by Salomon Couderc, whom Cavalier treats in his memoirs as chaplain-general to the whole army of the Camisards. He was a prophet; a great reader of the heart, who admitted people to the sacrament or refused them, by ‘intensively viewing every man’ between the eyes; and had the most of the Scriptures off by rote. And this was surely happy; since in a surprise in August 1703, he lost his mule, his portfolios, and his Bible. It is only strange that they were not surprised more often and more effectually; for this legion of Cassagnas was truly patriarchal in its theory of war, and camped without sentries, leaving that duty to the angels of the God for whom they fought. This is a token, not only of their faith, but of the trackless country where they harboured. M. de Caladon, taking a stroll one fine day, walked without warning into their midst, as he might have walked into ‘a flock of sheep in a plain,’ and found some asleep and some awake and psalm-singing. A traitor had need of no recommendation to insinuate himself among their ranks, beyond ‘his faculty of singing psalms’; and even the prophet Salomon ‘took him into a particular friendship.’ Thus, among their intricate hills, the rustic troop subsisted; and history can attribute few exploits to them but sacraments and ecstasies."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[285]"
        "line_start": 2781
        "line_end": 2805
        "source_sequence": 2781
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2893
        "line_end": 2916
        "source_sequence": 2893
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[285]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2893-2916"
    "translation_ja": "カミザールの五つの軍団のうち、カサニャスのそばに貯蔵所を持ったのは、一番古く一番目立たない隊だった。エスプリ・セギエの一隊である。セヴェンヌの首席司祭のもとへ夜に下ったとき、セギエに声を合わせて第六十八詩篇を歌った人々だ。セギエが天国へ昇進すると、サロモン・クデルクが継いだ。カヴァリエは回想録で、カミザール軍全体の従軍牧師長として扱っている。預言者で、人の心を読む名人だった。目と目の間を「一人ひとり熱心に見つめ」、その人が聖餐にあずかるのを許したり拒んだりした。聖書はほとんどそらで唱えられた。まったく幸いだった。一七〇三年八月の奇襲で、騾馬も書類挟みも聖書も失ったからだ。むしろ、もっとたびたび、もっと効果的に不意をつかれなかったのが不思議である。このカサニャス軍団の戦の流儀は、まるで聖書の族長たちのものだった。見張りをつけずに宿営し、その務めは、自分たちが仕え、そのために戦う神の天使たちに任せた。彼らの信仰だけでなく、潜んでいた土地に道がなかったことの証しでもある。あるよく晴れた日、散歩をしていたカラドン氏が、「平野の羊の群れ」にでも入りこむように、前触れもなく彼らのまん中に入り、寝ている者と起きて詩篇を歌う者を見つけた。裏切り者が隊列に潜りこむのに、「詩篇を歌える」ほかには何の推薦もいらず、預言者サロモンでさえ「とりわけ親しい友にした」。こうして入り組んだ丘々で、田舎者の小隊は生きながらえた。そして歴史が彼らの手柄に数えられるものは、聖餐と法悦のほかにはほとんどない。"
    "translation_status": "reviewed"
  - "id": "td-319"
    "section_id": "the-heart-of-the-country"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "People of this tough and simple stock will not, as I have just been saying, prove variable in religion; nor will they get nearer to apostasy than a mere external conformity like that of Naaman in the house of Rimmon. When Louis XVI., in the words of the edict, ‘convinced by the uselessness of a century of persecutions, and rather from necessity than sympathy,’ granted at last a royal grace of toleration, Cassagnas was still Protestant; and to a man, it is so to this day. There is, indeed, one family that is not Protestant, but neither is it Catholic. It is that of a Catholic curé in revolt, who has taken to his bosom a schoolmistress. And his conduct, it is worth noting, is disapproved by the Protestant villagers."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

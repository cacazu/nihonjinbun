      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-538-542"
    "translation_ja": "こんな道端の宿では、旅人は自前のナイフで食べるものと見なされ、頼まないかぎり貸してはもらえない。グラスと分厚いパン一切れに、鉄のフォークを一本添えれば、食卓の支度は万端だ。私のナイフはブシェの宿の主人にいかにも気に入られ、ばねの仕掛けにはすっかり驚嘆した。"
    "translation_status": "reviewed"
  - "id": "td-052"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "‘I should never have guessed that,’ he said. ‘I would bet,’ he added, weighing it in his hand, ‘that this cost you not less than five francs.’"

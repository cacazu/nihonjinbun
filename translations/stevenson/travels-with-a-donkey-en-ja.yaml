  - "id": "td-217"
    "section_id": "across-the-goulet"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "There are other degrees of feyness, as of punishment, besides the capital; and I was now led by my good spirits into an adventure which I relate in the interest of future donkey-drivers. The road zigzagged so widely on the hillside, that I chose a short cut by map and compass, and struck through the dwarf woods to catch the road again upon a higher level. It was my one serious conflict with Modestine. She would none of my short cut; she turned in my face; she backed, she reared; she, whom I had hitherto imagined to be dumb, actually brayed with a loud hoarse flourish, like a cock crowing for the dawn. I plied the goad with one hand; with the other, so steep was the ascent, I had to hold on the pack-saddle. Half-a-dozen times she was nearly over backwards on the top of me; half-a-dozen times, from sheer weariness of spirit, I was nearly giving it up, and leading her down again to follow the road. But I took the thing as a wager, and fought it through. I was surprised, as I went on my way again, by what appeared to be chill rain-drops falling on my hand, and more than once looked up in wonder at the cloudless sky. But it was only sweat which came dropping from my brow."
    "source_languages":
      - "en"
    "source_locations":

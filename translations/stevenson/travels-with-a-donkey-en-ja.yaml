  - "id": "td-183"
    "section_id": "the-boarders"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "While we were thus agreeing, what should my tongue stumble upon but a word in praise of Gambetta’s moderation. The old soldier’s countenance was instantly suffused with blood; with the palms of his hands he beat the table like a naughty child."
    "source_languages":
      - "en"
    "source_locations":

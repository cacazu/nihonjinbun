      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-965-981"
    "translation_ja": "初めは眠いのかどうか自分でも分からなかった。頭は知らぬまま、なにか心地よい興奮があるかのように、鼓動がふだんより速かったからだ。だが瞼が合うや、目に見えない膠がその間に飛びこんで、もう離れなくなった。木々を渡る風が子守歌だった。ときには数分にわたり、高くも低くもならぬ、一定の音で吹きぬけた。またときにはふくれ上がり、砕ける大波のようにはじけて、木々から午後の雨の大きな滴が私の体じゅうにぱらぱら落ちた。田舎の自分の寝室で、森の風が奏でる心を乱す演奏に、毎晩のように耳を傾けたことがある。だが木の種類が違うのか、地形のせいか、それとも自分が外へ出て音のまっただ中にいたためか、とにかくジェヴォーダンの森では、風は違う節で歌っていた。いつまでも耳をすました。そのうち眠りがしだいに体をわがものとし、思考と感覚を屈服させた。それでも眠りに落ちる寸前まで、私は耳をすまし、音を聞き分けようとした。意識の最後にあったのは、耳にひびく異国のざわめきへの驚きだった。"
    "translation_status": "reviewed"
  - "id": "td-119"
    "section_id": "a-camp-in-the-dark"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Twice in the course of the dark hours—once when a stone galled me underneath the sack, and again when the poor patient Modestine, growing angry, pawed and stamped upon the road—I was recalled for a brief while to consciousness, and saw a star or two overhead, and the lace-like edge of the foliage against the sky. When I awoke for the third time (Wednesday, September 25th), the world was flooded with a blue light, the mother of the dawn. I saw the leaves labouring in the wind and the ribbon of the road; and, on turning my head, there was Modestine tied to a beech, and standing half across the path in an attitude of inimitable patience. I closed my eyes again, and set to thinking over the experience of the night. I was surprised to find how easy and pleasant it had been, even in this tempestuous weather. The stone which annoyed me would not have been there, had I not been forced to camp blindfold in the opaque night; and I had felt no other inconvenience, except when my feet encountered the lantern or the second volume of Peyrat’s Pastors of the Desert among the mixed contents of my sleeping-bag; nay, more, I had felt not a touch of cold, and awakened with unusually lightsome and clear sensations."

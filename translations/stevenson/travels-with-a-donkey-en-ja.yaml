        "line_start": 618
        "line_end": 623
        "source_sequence": 618
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 528
        "line_end": 533
        "source_sequence": 528
    "source_alignment":

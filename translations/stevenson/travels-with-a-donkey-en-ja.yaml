      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-579-579"
    "translation_ja": "もっといい物。何を申し出ているのか、そのときの私にはさっぱり分からなかった。"
    "translation_status": "reviewed"
  - "id": "td-063"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The sleeping-room was furnished with two beds. I had one; and I will own I was a little abashed to find a young man and his wife and child in the act of mounting into the other. This was my first experience of the sort; and if I am always to feel equally silly and extraneous, I pray God it be my last as well. I kept my eyes to myself, and know nothing of the woman except that she had beautiful arms, and seemed no whit embarrassed by my appearance. As a matter of fact, the situation was more trying to me than to the pair. A pair keep each other in countenance; it is the single gentleman who has to blush. But I could not help attributing my sentiments to the husband, and sought to conciliate his tolerance with a cup of brandy from my flask. He told me that he was a cooper of Alais travelling to St. Etienne in search of work, and that in his spare moments he followed the fatal calling of a maker of matches. Me he readily enough divined to be a brandy merchant."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[56]"
        "line_start": 661
        "line_end": 675
        "source_sequence": 661
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 581
        "line_end": 594
        "source_sequence": 581
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[56]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-581-594"
    "translation_ja": "寝室には寝台が二つあった。一つは私が使う。もう一つに若い男とその妻と子どもが乗りこもうとしているのを見て、いささかまごついたことは白状しよう。こういう経験は初めてで、決まって同じように気まずい、場違いな気分にさせられるのなら、神かけてこれを最後にしてもらいたい。目はむやみに向けなかったので、婦人については、腕が美しく、私が現れてもいささかもひるまないようだったことしか知らない。実を言うと、夫婦より私のほうが困っていた。二人連れなら互いに平気な顔でいられる。赤くならなければならないのは、連れのない紳士だ。だが夫も私と同じ気持ちだと思わずにはいられず、携えた水筒のブランデーを一杯勧め、ご寛容を買おうとした。アレの樽職人で、仕事を求めてサン・テティエンヌへ向かうところ、暇なときには命を縮めるマッチ作りをしている、と彼は言った。私のことはすぐに、ブランデー商人だと当たりをつけた。"
    "translation_status": "reviewed"
  - "id": "td-064"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I was up first in the morning (Monday, September 23rd), and hastened my toilette guiltily, so as to leave a clear field for madam, the cooper’s wife. I drank a bowl of milk, and set off to explore the neighbourhood of Bouchet. It was perishing cold, a grey, windy, wintry morning; misty clouds flew fast and low; the wind piped over the naked platform; and the only speck of colour was away behind Mount Mézenc and the eastern hills, where the sky still wore the orange of the dawn."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[57]"
        "line_start": 676
        "line_end": 682
        "source_sequence": 676
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 596
        "line_end": 602
        "source_sequence": 596
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[57]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-596-602"
    "translation_ja": "翌朝、九月二十三日の月曜は私が一番に起き、樽職人の奥方が遠慮せずにすむよう、後ろめたい気分でさっさと身支度をした。牛乳を椀に一杯飲み、ブシェの近辺を探りに出た。凍えそうな朝だった。空は灰色で、風があり、まるで冬だった。靄のような雲が低く飛び、裸の台地に風がひゅうひゅう鳴った。唯一の色は遠く、メザンク山と東の丘々の向こうに、夜明けの橙色を空がまだ残していた。"
    "translation_status": "reviewed"
  - "id": "td-065"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was five in the morning, and four thousand feet above the sea; and I had to bury my hands in my pockets and trot. People were trooping out to the labours of the field by twos and threes, and all turned round to stare upon the stranger. I had seen them coming back last night, I saw them going afield again; and there was the life of Bouchet in a nutshell."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[58]"
        "line_start": 683
        "line_end": 688
        "source_sequence": 683
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 604
        "line_end": 608
        "source_sequence": 604
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[58]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-604-608"
    "translation_ja": "朝五時、海抜四千フィート。私は手をポケットに深く突っこみ、小走りにせねばならなかった。二人、三人と連れ立って畑仕事に出る人々は、みな振り返ってよそ者をまじまじと見た。昨夜は畑から帰るのを見、今朝はまた畑へ出るのを見る。ブシェの暮らしは、つまるところそれだけである。"
    "translation_status": "reviewed"
  - "id": "td-066"
    "section_id": "i-have-a-goad"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "When I came back to the inn for a bit of breakfast, the landlady was in the kitchen combing out her daughter’s hair; and I made her my compliments upon its beauty."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"

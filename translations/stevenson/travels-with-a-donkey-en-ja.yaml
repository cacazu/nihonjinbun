        "original_unit_id": "line-2011-2018"
    "translation_ja": |-
      私たちは昔の戦の跡を旅した。
      それでも野は一面、緑であった。
      愛があった。平和があった。
      火といくさのあとに。
      剣の子らはほほえみ、通りすぎる。
      もう剣を振るうことはない。
      見よ、なんと深々と麦が実る。
      かつての戦場に。

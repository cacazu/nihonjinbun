        "original_unit_id": "/html/body/p[157]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1535-1544"
    "translation_ja": "もっとも、私は疲れていた。エリザベス・シートンの伝記という退屈な本で気持ちを鎮めると、寒さと松林に荒れ狂う風が（私の部屋は修道院の森に接する側にあった）、すぐ眠りにつかせてくれた。真夜中とも思える闇の中、実は午前二時だったが、鐘の最初のひと打ちで目が覚めた。修道士はみな礼拝堂へ急ぎ、生きながら死んだ人々が、こんな尋常でない時刻に、慰めもない一日の苦労をもう始めていた。生きながら死んだ人々、なんと身の冷える考えだろう。それから、この取りまぜの多い人生で何よりよいものをうたったフランスの歌の文句が、記憶によみがえった。"
    "translation_status": "reviewed"

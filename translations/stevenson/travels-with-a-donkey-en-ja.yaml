        "line_start": 1983
        "line_end": 1991
        "source_sequence": 1983
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[203]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1983-1991"
    "translation_ja": "水で溶いたココアは濃厚ではなかったが熱かった。それを飲み、空き地のそこここを、上り下りして歩いた。こうしてぐずぐずしていると、重いため息と同じ長さの、むらのない風が、朝の方角からまっすぐどっと吹いた。冷たくてくしゃみが出た。近くの木々は吹かれるまま黒い房を振り、丘の縁の遠い松の細い小尖塔が、黄金の東の空を背に、かすかに前後に揺れるのが見えた。十分後、陽の光が山腹を疾駆し、影と輝きをまき散らして、すっかり夜が明けた。"
    "translation_status": "reviewed"
  - "id": "td-228"
    "section_id": "a-night-among-the-pines"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I hastened to prepare my pack, and tackle the steep ascent that lay before me; but I had something on my mind. It was only a fancy; yet a fancy will sometimes be importunate. I had been most hospitably received and punctually served in my green caravanserai. The room was airy, the water excellent, and the dawn had called me to a moment. I say nothing of the tapestries or the inimitable ceiling, nor yet of the view which I commanded from the windows; but I felt I was in some one’s debt for all this liberal entertainment. And so it pleased me, in a half-laughing way, to leave pieces of money on the turf as I went along, until I had left enough for my night’s lodging. I trust they did not fall to some rich and churlish drover."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[204]"
        "line_start": 1953
        "line_end": 1963
        "source_sequence": 1953
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 1993
        "line_end": 2003
        "source_sequence": 1993
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[204]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-1993-2003"
    "translation_ja": "私は急いで荷をまとめ、目の前の急坂に取りかかろうとしたが、気がかりがあった。たかが思いつきである。だが思いつきはときに始末に負えない。緑の旅籠にはこんなに手厚く迎えられ、時に遅れず世話をしてもらった。部屋は風通しがよく、水は上等で、夜明けは一刻も違えず起こしてくれた。壁掛けや比類のない天井、窓辺から得られた眺めのことは言わずとも、この気前のよいもてなしへの借りが、誰かにあるような気がした。そこで半分は笑いながら、歩きつつ芝の上に小銭を落として、一夜の宿代になるまでそうする気になった。金持ちで無愛想な牛追いの手に渡っていなければいいのだが。"
    "translation_status": "reviewed"

      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2252-2271"
    "translation_ja": "さて、ラモワニョン・ド・バヴィルに次いで迫害の先頭を行った者、セヴェンヌの首席司祭で同じ地方の伝道監察官、フランソワ・ド・ラングラード・デュ・シェイラ（シェイラと発音する）は、ポン・ド・モンヴェールの町に、折にふれて泊まる家を持っていた。良心にかなって行動する人で、どうやら天性は海賊向きだったが、五十五歳、人間として身につけられる節度はもうみな身についたはずの年齢である。若いときは中国で宣教師となり、そこで殉教の責めにあい、死んだと思われて見捨てられ、身分の低い者の慈悲でようやく救われ、息を吹き返した。この者には予知の力がなく、助けたのも、決して悪意をもってのことではない、と考えるべきだろう。そんな経験があれば迫害したい気も失せると思うところだが、人の心は不思議なつくりをしている。キリスト教の殉教者となったデュ・シェイラは、今度はキリスト教徒として迫害する側に回った。その手にかかると「信仰伝播事業」は大いにはかどった。ポン・ド・モンヴェールの家は牢獄に使った。そこで捕虜の手に焼けた炭を握らせ、髭を一本ずつ引き抜き、考えが誤りだと納得させようとした。だが彼自身、中国の仏教徒のもとで、肉体に訴えるこうした論法が効かないと、試して知らなかったのだろうか。"
    "translation_status": "reviewed"
  - "id": "td-248"
    "section_id": "pont-de-montvert"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Not only was life made intolerable in Languedoc, but flight was rigidly forbidden. One Massip, a muleteer, and well acquainted with the mountain-paths, had already guided several troops of fugitives in safety to Geneva; and on him, with another convoy, consisting mostly of women dressed as men, Du Chayla, in an evil hour for himself, laid his hands. The Sunday following, there was a conventicle of Protestants in the woods of Altefage upon Mount Bougès; where there stood up one Séguier—Spirit Séguier, as his companions called him—a wool-carder, tall, black-faced, and toothless, but a man full of prophecy. He declared, in the name of God, that the time for submission had gone by, and they must betake themselves to arms for the deliverance of their brethren and the destruction of the priests."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[219]"

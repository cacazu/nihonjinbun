  - "id": "td-306"
    "section_id": "in-the-valley-of-the-mimente"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On Tuesday, 1st October, we left Florac late in the afternoon, a tired donkey and tired donkey-driver. A little way up the Tarnon, a covered bridge of wood introduced us into the valley of the Mimente. Steep rocky red mountains overhung the stream; great oaks and chestnuts grew upon the slopes or in stony terraces; here and there was a red field of millet or a few apple-trees studded with red apples; and the road passed hard by two black hamlets, one with an old castle atop to please the heart of the tourist."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[274]"
        "line_start": 2651
        "line_end": 2658
        "source_sequence": 2651
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2754
        "line_end": 2761
        "source_sequence": 2754
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[274]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2754-2761"
    "translation_ja": "十月一日の火曜、午後も遅くフロラックを発った。疲れたロバと、疲れたロバ使いである。タルノンを少しさかのぼると、屋根のある木の橋がミマントの谷への入口になった。赤い岩だらけの険しい山々が川へせり出し、大きな樫や栗が斜面や石造りの段に育っていた。あちこちに赤い黍畑や赤い林檎の点々とついた木が数本あり、道は黒ずんだ集落二つのすぐそばを通った。一方の集落の上には、旅行者の心を喜ばせる古城があった。"
    "translation_status": "reviewed"
  - "id": "td-307"
    "section_id": "in-the-valley-of-the-mimente"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was difficult here again to find a spot fit for my encampment. Even under the oaks and chestnuts the ground had not only a very rapid slope, but was heaped with loose stones; and where there was no timber the hills descended to the stream in a red precipice tufted with heather. The sun had left the highest peak in front of me, and the valley was full of the lowing sound of herdsmen’s horns as they recalled the flocks into the stable, when I spied a bight of meadow some way below the roadway in an angle of the river. Thither I descended, and, tying Modestine provisionally to a tree, proceeded to investigate the neighbourhood. A grey pearly evening shadow filled the glen; objects at a little distance grew indistinct and melted bafflingly into each other; and the darkness was rising steadily like an exhalation. I approached a great oak which grew in the meadow, hard by the river’s brink; when to my disgust the voices of children fell upon my ear, and I beheld a house round the angle on the other bank. I had half a mind to pack and be gone again, but the growing darkness moved me to remain. I had only to make no noise until the night was fairly come, and trust to the dawn to call me early in the morning. But it was hard to be annoyed by neighbours in such a great hotel."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[275]"
        "line_start": 2659
        "line_end": 2677
        "source_sequence": 2659
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2763
        "line_end": 2781
        "source_sequence": 2763
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[275]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2763-2781"
    "translation_ja": "ここでも野営にふさわしい場所は見つけにくかった。樫や栗の下でさえ、地面がひどく急なばかりか、ごろ石が山になっている。木のないところでは、丘がヒースの房をつけた赤い断崖になって、川へ下りていった。目の前の最高峰から日が去り、群れを畜舎に呼び戻す牧夫たちの角笛が、牛の鳴き声のように谷に満ちたころ、道からだいぶ下、川の曲がり角の窪んだところに、牧草地が目に入った。下りていき、ひとまずモデスティーヌを木につなぐと、辺りを調べてみた。灰色で真珠のような夕べの影が谷間に満ち、少し遠いものはぼんやりし、悩ましいほど互いに溶け合った。闇は息のように静かに立ちのぼっていた。牧草地に、それも川べりのすぐ近くに生える大きな樫へ近づくと、迷惑なことに子どもたちの声が聞こえ、折れ曲がった対岸に家が一軒見えた。半ばは荷物をまとめ、また出ていく気になったが、暗くなるのでとどまった。しっかり夜になるまでは音を立てず、明朝は早く起こすよう夜明けに頼るだけでよい。それにしても、こんな広い宿屋で近所迷惑にあうとは困ったことだ。"
    "translation_status": "reviewed"
  - "id": "td-308"
    "section_id": "in-the-valley-of-the-mimente"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A hollow underneath the oak was my bed. Before I had fed Modestine and arranged my sack, three stars were already brightly shining, and the others were beginning dimly to appear. I slipped down to the river, which looked very black among its rocks, to fill my can; and dined with a good appetite in the dark, for I scrupled to light a lantern while so near a house. The moon, which I had seen a pallid crescent all afternoon, faintly illuminated the summit of the hills, but not a ray fell into the bottom of the glen where I was lying. The oak rose before me like a pillar of darkness; and overhead the heartsome stars were set in the face of the night. No one knows the stars who has not slept, as the French happily put it, à la belle étoile. He may know all their names and distances and magnitudes, and yet be ignorant of what alone concerns mankind,—their serene and gladsome influence on the mind. The greater part of poetry is about the stars; and very justly, for they are themselves the most classical of poets. These same far-away worlds, sprinkled like tapers or shaken together like a diamond dust upon the sky, had looked not otherwise to Roland or Cavalier, when, in the words of the latter, they had ‘no other tent but the sky, and no other bed than my mother earth.’"
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[276]"
        "line_start": 2678
        "line_end": 2697
        "source_sequence": 2678
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 2783
        "line_end": 2801
        "source_sequence": 2783
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[276]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-2783-2801"
    "translation_ja": "樫の下の窪みが私の寝床になった。モデスティーヌの食事をすませ寝袋を整えるうちに、三つの星がもう明るく輝き、ほかの星もぼんやり現れはじめた。岩の間で真っ黒に見える川へそっと下りて、容器に水を汲んだ。家のこんなに近くでは角灯をともすのもはばかられたので、暗がりで食欲旺盛に夕食をとった。午後じゅう青白い三日月だった月は、丘の頂をほのかに照らしたが、私が横たわる谷底には一筋の光も来なかった。樫は目の前に闇の柱のように立ち、頭上には、心を元気づける星たちが夜の顔にはめこまれていた。フランス人がうまく言うように「美しい星を屋根に」眠ったことのない者は、星を知らない。星の名前も距離も大きさもみな知っていて、それでも、人間にとって肝心なこと、星が心を静め喜ばせるというその働きだけは、知らないかもしれない。詩の大半は星をうたう。まことに当を得ている。星そのものが一番古典的な詩人だからだ。蝋燭のようにすき間を空けて並び、あるいはダイヤモンドの粉のように空にふりまかれた同じ遠い世界は、ロランやカヴァリエにも今と変わらず見えただろう。カヴァリエの言葉に、「空のほかに幕屋はなく、母なる大地のほかに寝床もなかった」とあるころである。"
    "translation_status": "reviewed"

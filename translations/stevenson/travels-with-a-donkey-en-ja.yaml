        "source_sequence": 177
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[14]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-177-184"
    "translation_ja": "暁の魔の時刻、ビリヤード場でアダン爺さんと最後に会い、例のブランデーを飲ませた。別れが身にしみると打ち明け、自分は黒パンで我慢してもロバには白パンを買ってやったことがたびたびあると言い張った。だが一番あてになる筋の話では、どうもその場の作り話だったらしい。村ではロバをひどくいじめる男として知られていた。だが涙を一つ落としたのは確かで、涙は頬の片側に汚れを洗い落とした筋を残した。"
    "translation_status": "reviewed"
  - "id": "td-020"
    "section_id": "the-donkey-the-pack-and-the-pack-saddle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "By the advice of a fallacious local saddler, a leather pad was made for me with rings to fasten on my bundle; and I thoughtfully completed my kit and arranged my toilette. By way of armoury and utensils, I took a revolver, a little spirit-lamp and pan, a lantern and some halfpenny candles, a jack-knife and a large leather flask. The main cargo consisted of two entire changes of warm clothing—besides my travelling wear of country velveteen, pilot-coat, and knitted spencer—some books, and my railway-rug, which, being also in the form of a bag, made me a double castle for cold nights. The permanent larder was represented by cakes of chocolate and tins of Bologna sausage. All this, except what I carried about my person, was easily stowed into the sheepskin bag; and by good fortune I threw in my empty knapsack, rather for convenience of carriage than from any thought that I should want it on my journey. For more immediate needs I took a leg of cold mutton, a bottle of Beaujolais, an empty bottle to carry milk, an egg-beater, and a considerable quantity of black bread and white, like Father Adam, for myself and donkey, only in my scheme of things the destinations were reversed."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[15]"
        "line_start": 297
        "line_end": 313
        "source_sequence": 297
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 186
        "line_end": 202
        "source_sequence": 186
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[15]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-186-202"
    "translation_ja": "土地のあてにならぬ鞍職人の勧めで、荷を結ぶ輪金のついた革の鞍敷きを作らせ、私はよく考えて道具をそろえ、身支度を整えた。武器と道具には連発拳銃、小さなアルコールランプと鍋、角灯と半ペニーの蝋燭を数本、折りたたみナイフ、大きな革の水筒を持った。荷の大半は、防寒用の着替え一式を二組、これは旅に着ていく田舎風の綿ビロードの服、厚い防寒外套、短い編み上着とは別で、それに本を数冊と汽車用の膝掛けである。膝掛けも袋状になっていたので、寒い夜には二重の砦にこもれた。常備食は板チョコレートとボローニャ・ソーセージの缶詰だった。身につけた品を除けば、すべて羊皮の袋に難なく入った。幸い、空の背嚢も投げ込んでおいた。道中で使うとは思っておらず、そのほうが運びやすかったからだ。すぐ要るものとしては、冷えた羊のもも肉、ボージョレを一本、牛乳を入れる空瓶を一本、卵の泡立て器、それに私とロバのための黒パンと白パンをたっぷり取った。アダン爺さんと同じだが、私の計画では食べるほうが逆であった。"
    "translation_status": "reviewed"
  - "id": "td-021"
    "section_id": "the-donkey-the-pack-and-the-pack-saddle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Monastrians, of all shades of thought in politics, had agreed in threatening me with many ludicrous misadventures, and with sudden death in many surprising forms. Cold, wolves, robbers, above all the nocturnal practical joker, were daily and eloquently forced on my attention. Yet in these vaticinations, the true, patent danger was left out. Like Christian, it was from my pack I suffered by the way. Before telling my own mishaps, let me in two words relate the lesson of my experience. If the pack is well strapped at the ends, and hung at full length—not doubled, for your life—across the pack-saddle, the traveller is safe. The saddle will certainly not fit, such is the imperfection of our transitory life; it will assuredly topple and tend to overset; but there are stones on every roadside, and a man soon learns the art of correcting any tendency to overbalance with a well-adjusted stone."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[16]"
        "line_start": 314
        "line_end": 327
        "source_sequence": 314
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 204
        "line_end": 216
        "source_sequence": 204
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[16]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-204-216"
    "translation_ja": "モナスティエの住人は、どの党派の人も足並みをそろえて、私に起こるおかしな災難や、突然の死に方の意外な数々を並べ、脅した。寒さ、狼、強盗、とりわけ夜中にいたずらを仕掛ける輩について、毎日みごとな弁舌で注意を促された。だがそれだけ予言を並べながら、本当に危ない、しかも明々白々なものだけは抜けていた。『天路歴程』のクリスチャンと同じで、道中私を苦しめたのは荷物であった。私の災難を話す前に、身をもって学んだことを一言二言だけ述べておこう。荷物の両端をしっかり帯で締め、折り返すなどもってのほか、いっぱいに伸ばして荷鞍に渡して垂らせば、旅人は無事である。鞍はもちろん合わない。このつかの間の人生は、万事そううまくはいかないものだ。ぐらぐらして、まず横倒しになりかける。だが道端にはどこにも石がある。よく釣り合いを考えて石を載せ、傾きを正す術はすぐに覚えられる。"
    "translation_status": "reviewed"
  - "id": "td-022"
    "section_id": "the-donkey-the-pack-and-the-pack-saddle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "On the day of my departure I was up a little after five; by six, we began to load the donkey; and ten minutes after, my hopes were in the dust. The pad would not stay on Modestine’s back for half a moment. I returned it to its maker, with whom I had so contumelious a passage that the street outside was crowded from wall to wall with gossips looking on and listening. The pad changed hands with much vivacity; perhaps it would be more descriptive to say that we threw it at each other’s heads; and, at any rate, we were very warm and unfriendly, and spoke with a deal of freedom."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[17]"
        "line_start": 328
        "line_end": 336
        "source_sequence": 328
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 218
        "line_end": 226
        "source_sequence": 218
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[17]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-218-226"
    "translation_ja": "出発当日は五時を少し過ぎて起きた。六時までにはロバに荷をつけはじめ、その十分後には私の希望も打ち砕かれた。鞍敷きがモデスティーヌの背に束の間もとどまらなかったのだ。作った男に返しに行き、罵り合いがあまりに激しかったので、表の通りは見物や聞き耳を立てる野次馬で壁から壁まで埋まった。鞍敷きの受け渡しはじつに活発だった。頭めがけて投げ合ったといったほうがよく伝わるだろうか。ともかく双方とも頭に血が上り、和やかとはほど遠く、なかなか遠慮のない言葉が飛び交った。"
    "translation_status": "reviewed"
  - "id": "td-023"
    "section_id": "the-donkey-the-pack-and-the-pack-saddle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "I had a common donkey pack-saddle—a barde, as they call it—fitted upon Modestine; and once more loaded her with my effects. The doubled sack, my pilot-coat (for it was warm, and I was to walk in my waistcoat), a great bar of black bread, and an open basket containing the white bread, the mutton, and the bottles, were all corded together in a very elaborate system of knots, and I looked on the result with fatuous content. In such a monstrous deck-cargo, all poised above the donkey’s shoulders, with nothing below to balance, on a brand-new pack-saddle that had not yet been worn to fit the animal, and fastened with brand-new girths that might be expected to stretch and slacken by the way, even a very careless traveller should have seen disaster brewing. That elaborate system of knots, again, was the work of too many sympathisers to be very artfully designed. It is true they tightened the cords with a will; as many as three at a time would have a foot against Modestine’s quarters, and be hauling with clenched teeth; but I learned afterwards that one thoughtful person, without any exercise of force, can make a more solid job than half-a-dozen heated and enthusiastic grooms. I was then but a novice; even after the misadventure of the pad nothing could disturb my security, and I went forth from the stable door as an ox goeth to the slaughter."
    "source_languages":
      - "en"
      - "fr"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[18]"
        "line_start": 337
        "line_end": 356
        "source_sequence": 337
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 228
        "line_end": 246
        "source_sequence": 228
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[18]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-228-246"
    "translation_ja": "モデスティーヌには普通のロバ用荷鞍、土地でいうバルドをつけてもらい、もう一度、私の持ち物を載せた。二つ折りの寝袋と厚い外套（暖かいので私は胴着で歩くつもりだった）、棒のように大きな黒パン、白パンと羊肉と瓶を入れた蓋なしの籠。それらがひどく込み入った結び方で一つに縛り上げられたのを、私はおめでたくも満足して眺めていた。そんな途方もない甲板荷が、釣り合いをとる物が下に何一つなく、全部ロバの肩より高いところに載っている。荷鞍はまっさらで使いならして体に合わせてもおらず、これまたまっさらな腹帯は道中で伸びて緩むと見ていい。いくら軽率な旅人でも災難の種がまかれたと見抜くべきであった。そのうえ例の込み入った結び方は、あまりに多くの応援者の手が入っていたから、器用な出来にはなりようがなかった。みな懸命に綱を引き締めたのは確かで、一度に三人がモデスティーヌの尻に片足を突っぱり、歯を食いしばって引っぱったことすらあった。だが後になって分かった。頭を使う者が一人いれば、力も入れずに、興奮した熱心な馬丁が六人がかりでやるより、しっかり荷をくくれるのだ。そのときの私はまだ駆け出しで、鞍敷きの一件のあとでさえ太平楽な心にはさざ波一つ立たず、屠り場へ引かれる牛のように厩の戸口を出た。"
    "translation_status": "reviewed"

  - "id": "td-014"
    "section_id": "the-donkey-the-pack-and-the-pack-saddle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "In a little place called Le Monastier, in a pleasant highland valley fifteen miles from Le Puy, I spent about a month of fine days. Monastier is notable for the making of lace, for drunkenness, for freedom of language, and for unparalleled political dissension. There are adherents of each of the four French parties—Legitimists, Orleanists, Imperialists, and Republicans—in this little mountain-town; and they all hate, loathe, decry, and calumniate each other. Except for business purposes, or to give each other the lie in a tavern brawl, they have laid aside even the civility of speech. ’Tis a mere mountain Poland. In the midst of this Babylon I found myself a rallying-point; every one was anxious to be kind and helpful to the stranger. This was not merely from the natural hospitality of mountain people, nor even from the surprise with which I was regarded as a man living of his own free will in Le Monastier, when he might just as well have lived anywhere else in this big world; it arose a good deal from my projected excursion southward through the Cevennes. A traveller of my sort was a thing hitherto unheard of in that district. I was looked upon with contempt, like a man who should project a journey to the moon, but yet with a respectful interest, like one setting forth for the inclement Pole. All were ready to help in my preparations; a crowd of sympathisers supported me at the critical moment of a bargain; not a step was taken but was heralded by glasses round and celebrated by a dinner or a breakfast."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[9]"
        "line_start": 205
        "line_end": 227
        "source_sequence": 205
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 90
        "line_end": 111
        "source_sequence": 90
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[9]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-90-111"
    "translation_ja": "ル・ピュイから十五マイル、気持ちのよい高地の谷にあるル・モナスティエという小さな町で、ひと月ばかり、晴れた日々を過ごした。モナスティエの名物は、レース作りに酒浸り、遠慮のない物言い、それに比類のない政争である。この小さな山の町にはフランスの四つの党派、正統王党派、オルレアン派、帝政派、共和派の支持者がそろっていて、みな憎み、嫌い、こきおろし、ありもしない悪口を言い合っている。商売の話をするときと、酒場の喧嘩で相手を嘘つき呼ばわりするときを除けば、口を利くという最低限の礼儀まで捨ててしまった。まさに山の中のポーランドである。ところがこのバビロンのただ中で、人は私のまわりに集まった。誰もがよそ者に親切にし、力を貸そうとした。山の人に生来そなわるもてなしの心ばかりではない。こんなに広い世の中、どこに住んでもよいのに、わざわざル・モナスティエに住んでいる男だという驚きだけでもない。大きな理由は、私がセヴェンヌを抜けて南へ行く旅を計画していたことにあった。私のような旅人は、この地方では前代未聞だった。月へ旅に出ると言い出した男のように馬鹿にされながらも、一方では、酷寒の極地へ向かう者のように一目置かれ、興味をもたれた。誰もが支度に手を貸そうとし、値決めの山場には応援の一団が加勢してくれた。一歩事が進むごとに、先触れにみんなで一杯やり、夕食か朝食で祝いをしたものだ。"
    "translation_status": "reviewed"
  - "id": "td-015"
    "section_id": "the-donkey-the-pack-and-the-pack-saddle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "It was already hard upon October before I was ready to set forth, and at the high altitudes over which my road lay there was no Indian summer to be looked for. I was determined, if not to camp out, at least to have the means of camping out in my possession; for there is nothing more harassing to an easy mind than the necessity of reaching shelter by dusk, and the hospitality of a village inn is not always to be reckoned sure by those who trudge on foot. A tent, above all for a solitary traveller, is troublesome to pitch, and troublesome to strike again; and even on the march it forms a conspicuous feature in your baggage. A sleeping-sack, on the other hand, is always ready—you have only to get into it; it serves a double purpose—a bed by night, a portmanteau by day; and it does not advertise your intention of camping out to every curious passer-by. This is a huge point. If a camp is not secret, it is but a troubled resting-place; you become a public character; the convivial rustic visits your bedside after an early supper; and you must sleep with one eye open, and be up before the day. I decided on a sleeping-sack; and after repeated visits to Le Puy, and a deal of high living for myself and my advisers, a sleeping-sack was designed, constructed, and triumphantly brought home."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-535-html"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535-images.html"
        "xpath": "/html/body/p[10]"
        "line_start": 228
        "line_end": 246
        "source_sequence": 228
      - "source_id": "gutenberg-535-text"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/535/pg535.txt"
        "line_start": 113
        "line_end": 131
        "source_sequence": 113
    "source_alignment":
      - "source_id": "gutenberg-535-html"
        "original_unit_id": "/html/body/p[10]"
      - "source_id": "gutenberg-535-text"
        "original_unit_id": "line-113-131"
    "translation_ja": "出発の支度ができたときには十月も間近で、これから通る高所では、小春日和など望むべくもなかった。野宿はしないにしても、少なくともできる用意だけは持ってゆくと決めていた。のんきな者にとって、日暮れまでに宿を見つけねばならないほど心をすり減らすことはないし、歩いてゆく者には、村の宿がいつでも泊めてくれるとはかぎらない。テントは、ひとり旅ならなおさら、張るのも畳むのも面倒で、道中でさえ荷物の中で目立つ。寝袋ならすぐ使える。潜り込むだけでいい。夜は寝床、昼は旅行鞄と二役をこなし、野宿をするつもりだと物好きな通行人の一人ひとりにふれて回ることもない。これは大事な点だ。人に知られた野営地では、ゆっくり休むどころではない。こちらは一躍、世間の注目の的になる。おしゃべり好きな村人が早めに晩飯をすませて枕元を訪ねてくる。片目を開けて眠り、夜が明ける前に起きなければならない。私は寝袋に決めた。何度もル・ピュイに足を運び、私も相談役たちも大いに飲み食いしてようやく、寝袋は設計され、縫い上がり、めでたくわが家に運び込まれた。"
    "translation_status": "reviewed"
  - "id": "td-016"
    "section_id": "the-donkey-the-pack-and-the-pack-saddle"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "This child of my invention was nearly six feet square, exclusive of two triangular flaps to serve as a pillow by night and as the top and bottom of the sack by day. I call it ‘the sack,’ but it was never a sack by more than courtesy: only a sort of long roll or sausage, green waterproof cart-cloth without and blue sheep’s fur within. It was commodious as a valise, warm and dry for a bed. There was luxurious turning room for one; and at a pinch the thing might serve for two. I could bury myself in it up to the neck; for my head I trusted to a fur cap, with a hood to fold down over my ears and a band to pass under my nose like a respirator; and in case of heavy rain I proposed to make myself a little tent, or tentlet, with my waterproof coat, three stones, and a bent branch."
    "source_languages":
      - "en"
    "source_locations":

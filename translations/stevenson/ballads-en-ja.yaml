    "kind": "paragraph"
    "origin": "source"
    "source_text": "Introduction.—This tale, of which I have not consciously changed a single feature, I received from tradition. It is highly popular through all the country of the eight Tevas, the clan to which Rahéro belonged; and particularly in Taiárapu, the windward peninsula of Tahiti, where he lived. I have heard from end to end two versions; and as many as five different persons have helped me with details. There seems no reason why the tale should not be true."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 111
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[54]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-067"
    "translation_ja": "序。この物語は伝承から聞き取った。自覚しているかぎり、細かなところ一つとて変えてはいない。ラヘロの属していたテヴァの八つの地域のいたるところで、とりわけ彼の住んだタイアラプ、すなわちタヒチの風上の半島で、たいそう親しまれている話である。私は二通りの語りを初めから終わりまで聞き、細部については五人もの異なる人から助けを得た。この話が実話ではありえないと考える理由は、どうやら見あたらない。"

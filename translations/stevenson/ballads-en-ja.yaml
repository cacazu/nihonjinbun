  "reader_notes_ja":
    - "タヒチとマルケサス諸島、西ハイランドとギャロウェー、そして海の上を舞台にした五つの物語詩を収める。各篇に付された著者の解説・注も収録。"
    - "南洋を描く語り手と作中人物のものの見方は作品が書かれた時代に属する。土地の慣習や歴史をめぐる著者の留保も原注のまま訳した。"

    "source_text": |-
      Ori, my brother in the island mode,
      In every tongue and meaning much my friend,
      This story of your country and your clan,
      In your loved house, your too much honoured guest,
      I made in English. Take it, being done;
      And let me sign it with the name you gave.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 61
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[8]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-017"
    "translation_ja": |-
      オリよ、島のならわしで呼べば、わが兄弟。
      どこの言葉で、どんな意味で呼んでも、心からの友よ。
      きみの国ときみの一族のこの物語を、
      親しみ深いきみの家で、身に過ぎたもてなしを受けながら、
      私は英語の歌にした。いま出来あがった、受け取ってほしい。
      そして、きみのくれた名で署名させてほしい。
    "translation_status": "reviewed"

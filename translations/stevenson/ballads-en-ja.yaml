    "source_text": "[23a] Note 10, page 23. “Námunu-úra.” The complete name is Namunu-ura te aropa. Why it should be pronounced Námunu, dactyllically, I cannot see, but so I have always heard it. This was the clan immediately beyond the Tevas on the south coast of the island. At the date of the tale the clan organisation must have been very weak. There is no particular mention of Támatéa’s mother going to Papara, to the head chief of her own clan, which would appear her natural recourse. On the other hand, she seems to have visited various lesser chiefs among the Tevas, and these to have excused themselves solely on the danger of the enterprise. The broad distinction here drawn between Nateva and Námunu-úra is therefore not impossibly anachronistic."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 121
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[64]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-077"
    "translation_ja": "〔23a〕注一〇、二三ページ。「ナムヌ・ウラ」。完全な名はナムヌ・ウラ・テ・アロパという。なぜナムヌの第一音節を強め、あとの二つを短く読むのかは私にはわからないが、いつもそういう発音を耳にした。この氏族は島の南岸で、テヴァとすぐ隣り合っていた。物語のころは、氏族の組織がひどく弱っていたに違いない。タマテアの母なら、自分の氏族の大首長を頼ってパパラへ行くのが自然と思われるのに、ことにそうしたという話はない。その一方、テヴァの下位の首長何人かを訪ね歩いたようであり、首長たちはその企ての危険さだけを理由に断ったらしい。したがって、ここでナテヴァとナムヌ・ウラとをくっきり分けたのは、ひょっとすると時代にそぐわぬことかもしれない。"
    "translation_status": "reviewed"

    "source_text": |-
      Out over cairn and moss,
      Out over scrog and scaur,
      He ran as runs the clansman
      That bears the cross of war.
      His heart beat in his body,
      His hair clove to his face,
      When he came at last in the gloaming
      To the dead man’s brother’s place.
      The east was white with the moon,
      The west with the sun was red,
      And there, in the house-doorway,
      Stood the brother of the dead.
    "source_languages":
      - "en"
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 186
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[120]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-142"
    "translation_ja": |-
      石塚を越え、苔の湿地を越え、
      藪を抜け、岩場を越え、
      男は走った。一族に戦を報せる
      十字架を担ぐ使いのように。
      胸では心臓が打ち、
      顔には髪が貼りついていた、
      ようやく黄昏どき、死人の
      兄弟の家に着いたときには。
      東は月で白く、
      西は夕日で赤かった。
      そこに、その家の戸口に、
      死者の兄弟が立っていた。

    "translation_ja": |-
      彼らは終日、獣のようにひたむきに貪り食った。
      豚から魚へ、次には魚から果物へと向かい、
      たれの鉢を空にし、カヴァをたっぷり飲んだ。
      ついに若者は石のようにぼうっと横たわり、いちばん強い者もうとうとしはじめた。
      死のように強く、月のない夜のように盲いた眠りが、
      その手足をつなぎとめた。魂は溺れ、光は
      目から覆い隠された。老いも若きもともに正体をなくし、
      一撃で敵を倒す戦士も、巧みな舌をもつおしゃべりも、
      嫁して子をなし、産みの苦しみに慣れた女も、
      くちづけをまだ知らぬ娘も、我を忘れて地に身をのべた。
      王ヒオパと首長たちは、ひそかに広間を出た。
      日はすでに低く垂れ、北の峰々を照らしていた。
      風はなかなか衰えず、朝ほどの勢いで吹いて、
      薄闇に椰子の実を降らせ、旗布を引き裂くように、
      島の高い峰々で山の雲を引き裂いた。
      すると突然、合図ひとつで、無言の群衆が先を争い、
      死の仕事に取りかかった。男たちが足早に行き交い、
      蟻のように薪束を運んで山をなし、
      広間のまわりでその山はみるみる高くなった。
      中はしんとしたままだった。みな深く眠っていたから。
      タマテアの母はヒオパのかたわらに立ち、
      花嫁となる娘のように、恐れと喜びに身を震わせた。
      働く人々を夜が包むと、知恵者ヒオパはまず
      家をひとまわりして、すべてに目を配った。
      軒まで薪に囲まれ、戸口ももうふさがれていた。
      包囲されたその家で、八百人は眠っていた。
      ひとりのアイトが使いに出され、火を手にして戻った。
      ヒオパは受け取った。「この中には」と言った。「ひとつの国の命がある。
      見よ、わしはこの熾火に息を吹きかける。東の谷々にひと息吹きかけるのだ。
      森にも浜にも静けさが訪れる。宴の声も
      炊事の煙も絶える。人去った住まいの棟木は朽ち落ち、
      あばらになった壁は風に倒れる」

      ある夏の日、赤い荒野を
      王は馬で行った。
      蜂は羽音を立て、道のわきで
      ダイシャクシギが鳴いた。
      馬上の王は腹を立てた、
      顔は青ざめ、眉間は暗い。
      ヒースの国の王でありながら、
      ヒースの麦酒がないとはと。

        "original_unit_id": "bal-154"
    "translation_ja": |-
      さて南ではひとしきり議論があり、
      南には知恵ある男がいて、
      かつらをかぶったロンドンの殿様が〔109〕
      氏族に呼びかけた、立ち上がれと。
      騎馬の使いは馬を駆り、召集の声が
      西の海辺へ届いた、
      海とヒースの国へ、
      アッピンとマモアへ。
      藪からも岩場からもこぞって来いと
      呼びかけたのだ、
      父祖のタータンを愛する者、
      昔ながらのいくさ遊びを愛する者よ、と。

      わが家よ、その壁のなかに海がとどろく。
      この世のどんな音より、おれにいとしい音。
      人々が喝采するのを聞いた、そのどよめきも、消えるのも聞いた。
      今はわが家で貿易風が叫ぶのを聞くほうが心地よい。

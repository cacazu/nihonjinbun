        "original_unit_id": "bal-080"
    "translation_ja": "〔34〕注一三、三四ページ。「魚こそ、恋いこがれる食べ物」。タヒチ語には、魚が欲しくてたまらない、ということを表す専用の言葉がある。ついでに言っておくと、これは物語全体を通じて、私がいちばん困った点の一つだ。この宴で王も民も女も皆が一緒に食べるなど、いったいどうしてありえたのか。だが私に語ってくれた多くの人の誰一人、そのことを不思議がらなかったのだから、きっと何か自然な説明があるのだろう。"

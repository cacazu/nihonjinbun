    "translation_ja": |-
      「おれの血はヒースの上、
      おれの骨は丘の上。
      大鴉の巣では大喜びだ、
      雛どもが腹いっぱい食えると。
      おれの血は土に流れ、
      魂は空にこぼれた。
      おれを殺めたその男は
      おれの兄弟に守られて眠っている」

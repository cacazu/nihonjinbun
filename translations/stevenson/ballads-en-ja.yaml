    "translation_ja": "〔62a〕注二、六二ページ。「ルビーのように赤い」。祭司の目が赤いのは、おそらくカヴァの飲み過ぎによるものだろう。そのひげ（同ページ）は地所一つほどの値打ちと歌ってある。老人のあごひげはマルケサスの人々が最も好む頭飾りで、女の髪がいちばん高価な腰帯になったのと対をなす。概してひげが薄く、寿命も短いこの土地では、前者は今日でも相当な金額になる。"

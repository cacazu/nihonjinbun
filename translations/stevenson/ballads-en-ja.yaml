      父上に何と言えばいいのだ。
      ああ、おれが来たのを見て泣かれる
      母上に何と言えばいいのだ。
      そして、とうの昔に生きて死んだ
      情け深いキャメロン一族の皆に。
      これがお前の伝言か、
      心にまことのないわが兄弟よ」

      あんたたちを憎むのを誉れとし、その槍に倒れるのを誉れとする」
      ルアは背筋を伸ばした。「ヴァイの者よ、企みには企みを！」
      そう叫んでルアは身を返し、水が荒れ狂う階段を下っていった。
      岩から岩へ飛び移る。水辺をすみかとするセキレイが
      音の響く谷間を飛び交い、岩や泡すれすれに走るように。
      ルアは谷から躍り出て、小川の岸に跳び移り、
      まっしぐらに一族の屋根を目ざして力強く足を運んだ。
      逃げるようにかかとは速く、その背後では、通りすぎた跡を
      小石が音高くはね転がった、長い下り道をずっと。
      あえぐ息を吸いこみながら、走るあいだずっと思った。
      「ああ、ばかなルアだ、死に向かって駆けていくルア！」
      だが正しいことは正しい、とルアは思い、泡を吹き散らす風のように走った。
      「正しいことはいつまでも正しい。故郷はいつまでも故郷だ。
      かまどが煙ったら何だ？　朝までに死んだって何だ？
      あそこはおれが乳をもらい、育てられ、タヘイアが生まれたところだ」
      聖なる祭場の高みに真昼が来ていた。宴の二日目の正午だった。
      熱気と恥ずべき眠気に、人々も祭司も押しつぶされ、
      途方もない食事で重くなった体のなかを、心臓がのろのろと働いた。
      感覚を失った手足が、車輪の輻のように四方へ投げ出されていた。
      暴飲暴食で気分の悪くなった女たちは、かたわらの石をじっと見て座り、
      唇を獣のように垂れ、目は豚のようにただれていた。
      雄蜂の殺される季節には、丸屋根の蜂の巣のまわりに
      死んだ蜂、傷ついた蜂が散らばり、横たわり、よろめき、這う。
      同じように、炎のような太陽のまなざしのもと、段の段々には
      半分起きた者と眠った者が、かたまり、這い、横たわっていた。
      群れが巣分かれする時の蜂の巣のように音高く、
      おぞましい虫の大群が、宙にかかって唸っていた。

        "original_unit_id": "bal-140"
    "translation_ja": |-
      アッピンの入江のほとりで、
      海から霧が吹きつけたとき、
      一人のスチュアートが一人のキャメロンと立っていた。
      スチュアートは腹を立てていた。
      血は耳の奥で脈打ち、
      熱い血が頭にのぼり、
      海から霧が吹きつけた。
      そこにはキャメロンが死んでいた。
      「ああ、友におれは何をした。
      ああ、わが身に何をした。
      友は冷たいむくろとなり、
      おれにはあらゆる危難が降る。
      まわりには危難ばかり、
      後ろにも、前にも、危難。
      ヒースの中で死が待ち伏せる、
      アッピンでも、マモアでも。
      渡し場ごとに憎しみが待ち、浅瀬の
      一つ一つに死が待っている。
      キャメロン一族が銃に口薬を盛り、
      キャメロン一族が剣を研ぐ」

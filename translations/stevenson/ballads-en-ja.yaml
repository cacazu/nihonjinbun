    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-182"
    "translation_ja": |-
      「申し上げたことに嘘はない。
      ただ息子が怖かった。
      まだ髭もない若木の勇気を
      わしは信じきれなかった。
      だが今や拷問もむだなこと、
      火をつけたとて甲斐はない。
      ここ、この胸のうちで死ぬのだ、
      ヒースの麦酒の秘密はな」

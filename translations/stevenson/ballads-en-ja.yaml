        "original_unit_id": "bal-180"
    "translation_ja": |-
      若者にとって命はつまらぬもの、
      死など何ものでもございません。
      息子に見られながらこの名誉を
      売るだけの勇気が、わしにはありませぬ。
      王よ、息子を捕らえ、縛り上げ、
      沖の深みへ投げ入れてくだされ。
      そうすればわしがお教えします、
      守ると誓った秘密をば」

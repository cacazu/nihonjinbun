        "original_unit_id": "bal-141"
    "translation_ja": |-
      だがこの男には知恵があった。
      まだ二十歳の男だった。
      アッピンにもマモアにも、
      これほど抜け目のないスチュアートはいなかった。
      男は吹き寄せる霧を見た。
      畏ろしい死者を見た。
      すると顔に笑みがのぼり、
      頭にそっと考えが忍びこんだ。

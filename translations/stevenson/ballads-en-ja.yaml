        "original_unit_id": "bal-049"
    "translation_ja": |-
      そう言って、赤くおきた火を薪に触れさせた。
      赤みは薪の塊を走って、もぐらのようにその中に潜り、
      たちまち濃い煙が湧いた。あたかも堤が決壊するとき、
      初めは水が縁をなめ、銀の糸になってちょろちょろ越え、
      それが不意に堤をのみ、いっぺんに押し流すように、
      いま瞬く間に炎がはねあがり、夜空にぐんと伸び、
      風と組み合い、唸りを上げ、家や木をはるか下に、
      なびく松明のごとくそびえて、陸と海を照らし出した。

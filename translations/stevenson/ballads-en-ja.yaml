    "source_text": "[10b] Note 4, page 10. “Flies.” This is perhaps an anachronism. Even speaking of to-day in Tahiti, the phrase would have to be understood as referring mainly to mosquitoes, and these only in watered valleys with close woods, such as I suppose to form the surroundings of Rahéro’s homestead. Quarter of a mile away, where the air moves freely, you shall look in vain for one."

  - "id": "bal-156"
    "section_id": "ticonderoga-ii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “O, why should I dwell here
      With a weird upon my life,
      When the clansmen shout for battle
      And the war-swords clash in strife?
      I cannae joy at feast,
      I cannae sleep in bed,
      For the wonder of the word
      And the warning of the dead.
      It sings in my sleeping ears,
      It hums in my waking head,
      The name—Ticonderoga,
      The utterance of the dead.
      Then up, and with the fighting men
      To march away from here,
      Till the cry of the great war-pipe
      Shall drown it in my ear!”
    "source_languages":
      - "en"
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 200
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[133]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-156"
    "translation_ja": |-
      「おれはなぜここにとどまるのだ、
      この身にさだめを負ったまま。
      氏族の男らが戦いの声をあげ、
      いくさの剣がぶつかり合うというのに。
      宴に出ても楽しめず、
      床についても眠れぬ。
      あの言葉の不思議さと
      死者の警告が、ついてまわるのだ。
      眠るおれの耳に歌い、
      覚めたおれの頭にうなる、
      あの名、タイコンデロガ、
      死者が口にした名が。
      ならば立とう、いくさの男たちと
      ここから行軍しよう、
      大きないくさの笛の叫びが
      おれの耳であれをかき消すまで！」

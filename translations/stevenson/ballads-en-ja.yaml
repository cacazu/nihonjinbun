    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-058"
    "translation_ja": |-
      そうやって夜の薄闇に、
      （空には雲がころがり、月は呑み込まれて見えなくなっていた）
      拳をかじって歩きまわり、ラヘロは岸で怒り狂った。
      復讐。それだけは果たさねば。だがその前にすることが多かった。
      第一に、死のありかから一つの命を引き離さねばならぬ。
      復讐の根、一族の生き残った株である、わが命を。
      次には一族を改めて育て、氏族の土地を
      ふたたび人で満たす。そうラヘロは考えた。怒りの中でさえ
      思慮を失わぬ男だった。復讐し、逃れるための手だてを思った。
      舟はひそかに奪う。妻は力ずくでさらう。

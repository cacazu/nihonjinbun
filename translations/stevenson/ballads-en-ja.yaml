    "translation_ja": |-
      いにしえに神々が定めたとおり、祭司が走ったのは三日、
      血を流す場所でひとり眠った夜は二夜。
      狂乱のもたらす酔いつぶれたような眠りを、二度、澱まで飲み干した、
      聖なる木々の下、祭場の聖なる石の上で。
      灰色の頭に灯を一つともして、宴の場所に横たわり、
      聖なるバニヤンの葉が、祭司を囲んでざわめいた。
      ついに定めの夕べが段にも木にも降り、
      高い島の影が沖へ幾里も伸び、
      緑なす谷のすべてに甘露と麝香の香りがこもったとき、
      見る影もなくなった赤い眼の祭司は、薄暮の中を息せき切って帰った。
      村をよろめき通り、岸をよたよたと進み、
      薄笑いを浮かべたティキの間を、手探りでわが戸口へはい入った。

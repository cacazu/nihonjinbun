    "translation_ja": |-
      タヘイアはその頭をやさしく抱き、年老いた祭司はかたわらに立ち、
      ルビー色の目で、光の消えてゆくルアの目を見つめた。
      「タヘイア、ここでおしまいだ。ぼくはひとりの男にふさわしく死ぬ。
      救いようのない一族を救おうと、ぼくの命を投げ出した。
      見てみろ、あの腰抜けどもを！　目をしばたたくあれを見ろ。
      五十本も槍を投げ、五十のうち当たったのが一本！
      祭司よ、予言者よ、できるなら自分に予言してみろ、
      ヴァイの者がこの一族へなだれ込む、その日のその時を！
      タプの裂け谷の上手を通り、死と火を手に、
      蟻のように群れ、音もなく、戦士たちはもうこの土地いっぱいにいる」

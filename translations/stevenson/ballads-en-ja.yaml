  - "id": "bal-186"
    "section_id": "christmas-poem"
    "kind": "heading"
    "origin": "source"
    "source_text": "CHRISTMAS AT SEA"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 230
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/h3[18]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-186"
    "translation_ja": "海のクリスマス"
    "translation_status": "reviewed"
  - "id": "bal-187"
    "section_id": "christmas-poem"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The sheets were frozen hard, and they cut the naked hand;
      The decks were like a slide, where a seaman scarce could stand;
      The wind was a nor’wester, blowing squally off the sea;
      And cliffs and spouting breakers were the only things a-lee.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 231
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[157]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-187"
    "translation_ja": |-
      帆脚索はかちかちに凍りつき、素手に食いこんで皮膚を切った。
      甲板は滑り台さながら、水夫の足も定まらぬ。
      海から叩きつけるのは、息を継いでは吹きつのる北西の風、
      風下には断崖と、しぶきを噴く砕け波しかなかった。
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "small_caps"
        "span":
          "start": 0
          "end": 3
          "exact": "The"
  - "id": "bal-188"
    "section_id": "christmas-poem"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      They heard the surf a-roaring before the break of day;
      But ’twas only with the peep of light we saw how ill we lay.
      We tumbled every hand on deck instanter, with a shout,
      And we gave her the maintops’l, and stood by to go about.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 232
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[158]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-188"
    "translation_ja": |-
      夜の明ける前から、磯に波の吠えるのが聞こえていた。
      だが一筋光が差して、はじめてわかった、なんというところにいるのかが。
      声がかかるや総員、甲板に転がり出た。
      大檣の上檣帆を張り、船首を風上に回す構えを取った。
    "translation_status": "reviewed"
  - "id": "bal-189"
    "section_id": "christmas-poem"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      All day we tacked and tacked between the South Head and the North;
      All day we hauled the frozen sheets, and got no further forth;
      All day as cold as charity, in bitter pain and dread,
      For very life and nature we tacked from head to head.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 233
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[159]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-189"
    "translation_ja": |-
      一日じゅう、南の岬と北の岬のあいだを切り返し、切り返した。
      一日じゅう、凍った帆脚索を曳いたが、ちっとも沖へ出られない。
      一日じゅう、お慈悲さながらのその冷たさに、痛みと恐れをかみしめて、
      ただもう命惜しさに、岬から岬へ船を返した。
    "translation_status": "reviewed"
  - "id": "bal-190"
    "section_id": "christmas-poem"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      We gave the South a wider berth, for there the tide-race roared;
      But every tack we made we brought the North Head close aboard:
      So’s we saw the cliffs and houses, and the breakers running high,
      And the coastguard in his garden, with his glass against his eye.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 234
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[160]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-190"
    "translation_ja": |-
      南には広く間をあけた。そこには轟く早潮があった。
      だが一つ返すたび、北の岬は舷側すれすれに迫った。
      岩壁も家も、立ちあがる砕け波も、はっきり見えた。
      海岸監視の男が庭で、目に遠眼鏡を当てているのまで。
    "translation_status": "reviewed"
  - "id": "bal-191"
    "section_id": "christmas-poem"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The frost was on the village roofs as white as ocean foam;
      The good red fires were burning bright in every ’longshore home;
      The windows sparkled clear, and the chimneys volleyed out;
      And I vow we sniffed the victuals as the vessel went about.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 235
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[161]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-191"
    "translation_ja": |-
      村の屋根には海の泡ほど白い霜が降り、
      浜辺のどの家にも、ありがたい赤い火が明々と燃えていた。
      窓は澄んできらきらし、煙突はぽっぽと煙を吐く。
      船を返した拍子には、誓って言うが、ご馳走の匂いまでした。
    "translation_status": "reviewed"
  - "id": "bal-192"
    "section_id": "christmas-poem"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The bells upon the church were rung with a mighty jovial cheer;
      For it’s just that I should tell you how (of all days in the year)
      This day of our adversity was blessèd Christmas morn,
      And the house above the coastguard’s was the house where I was born.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 236
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[162]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-192"
    "translation_ja": |-
      教会の鐘が、いかにもめでたそうに、景気よく打ち鳴らされた。
      ここで言っておかなくちゃなるまい、年にあまたの日があるなかで、
      俺たちがこの難儀に遭ったのは、こともあろうに聖なるクリスマスの朝、
      そして監視の男の家の上手にあるのが、俺の生まれた家だった。
    "translation_status": "reviewed"
  - "id": "bal-193"
    "section_id": "christmas-poem"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      O well I saw the pleasant room, the pleasant faces there,
      My mother’s silver spectacles, my father’s silver hair;
      And well I saw the firelight, like a flight of homely elves,
      Go dancing round the china-plates that stand upon the shelves.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 237
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[163]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-193"
    "translation_ja": |-
      ああ、あの居心地のいい部屋が、そこにいる懐かしい顔が、目に浮かんだ。
      母さんの銀縁眼鏡、父さんの銀色の髪。
      炉の火が、家に住みつく小妖精の一群れみたいに、
      棚に立てた陶の皿をめぐって踊るのも、ありありと見えた。
    "translation_status": "reviewed"
  - "id": "bal-194"
    "section_id": "christmas-poem"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      And well I knew the talk they had, the talk that was of me,
      Of the shadow on the household and the son that went to sea;
      And O the wicked fool I seemed, in every kind of way,
      To be here and hauling frozen ropes on blessèd Christmas Day.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 238
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[164]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-194"
    "translation_ja": |-
      二人が何を語り合うかも、よくわかった。俺の話だ。
      家に落ちた影のこと、海へ出ていった息子のこと。
      ああ、どこから見たって俺はなんという罰当たりの馬鹿だ、
      この聖なるクリスマスに、こんな所で凍った綱など曳いている。
    "translation_status": "reviewed"
  - "id": "bal-195"
    "section_id": "christmas-poem"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      They lit the high sea-light, and the dark began to fall.
      “All hands to loose topgallant sails,” I heard the captain call.
      “By the Lord, she’ll never stand it,” our first mate, Jackson, cried.
      . . . “It’s the one way or the other, Mr. Jackson,” he replied.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 239
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[165]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-195"
    "translation_ja": |-
      高台の灯台に灯がともり、闇が降りはじめた。
      「総員、上檣帆の上の帆も解け！」船長の声が聞こえた。
      「とんでもない、船がもちません！」一等航海士のジャクソンが叫んだ。
      ……「これで切り抜けるか、さもなきゃおだぶつだよ、ジャクソン君」と船長は答えた。
    "translation_status": "reviewed"
  - "id": "bal-196"
    "section_id": "christmas-poem"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      She staggered to her bearings, but the sails were new and good,
      And the ship smelt up to windward just as though she understood.
      As the winter’s day was ending, in the entry of the night,
      We cleared the weary headland, and passed below the light.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 240
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[166]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-196"
    "translation_ja": |-
      船はぐらりと限度まで傾いた。だが帆は新品、頼もしかった。
      船はまるで心得てでもいるように、風を嗅ぎつけて舳先を風上へ向けた。
      冬の一日が暮れてゆき、夜の戸口にさしかかったとき、
      俺たちはあのしぶとい岬をかわし、灯台の灯の下を過ぎた。
    "translation_status": "reviewed"
  - "id": "bal-197"
    "section_id": "christmas-poem"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      And they heaved a mighty breath, every soul on board but me,
      As they saw her nose again pointing handsome out to sea;
      But all that I could think of, in the darkness and the cold,
      Was just that I was leaving home and my folks were growing old.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 241
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[167]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-197"
    "translation_ja": |-
      すると俺ひとりをのぞく乗組員のだれもが、大きく息をついた、
      舳先が再び見事に沖を指しているのを見て。
      だが闇のなか、寒さのなか、俺の胸にあったのはただひとつ。
      また故郷を離れてゆく、父さんも母さんも年を取ってゆく。
    "translation_status": "reviewed"

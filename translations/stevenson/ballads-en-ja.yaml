    "source_text": "[51a] Note 15, page 51. “The star of the dead.” Venus as a morning star. I have collected much curious evidence as to this belief. The dead retain their taste for a fish diet, enter into copartnery with living fishers, and haunt the reef and the lagoon. The conclusion attributed to the nameless lady of the legend would be reached to-day, under the like circumstances, by ninety per cent of Polynesians: and here I probably understate by one-tenth."
    "source_languages":

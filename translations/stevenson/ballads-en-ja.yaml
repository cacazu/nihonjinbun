    "section_id": "ticonderoga-intro"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      This is the tale of the man
      Who heard a word in the night
      In the land of the heathery hills,
      In the days of the feud and the fight.
      By the sides of the rainy sea,
      Where never a stranger came,
      On the awful lips of the dead,
      He heard the outlandish name.
      It sang in his sleeping ears,
      It hummed in his waking head:
      The name—Ticonderoga,
      The utterance of the dead.
    "source_languages":
      - "en"
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 182
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[117]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-138"
    "translation_ja": |-
      これは、夜ふけにひとつの言葉を
      耳にした男の物語。
      ヒース咲く丘の国で、
      氏族が争い、戦ったころ。
      雨降る海のほとり、
      よそ者など来たこともない所で、
      畏ろしい死者の唇から
      異国の名を聞いたのだ。
      それは眠る耳には歌となり、
      覚めた頭には羽音となった。
      その名は、タイコンデロガ。
      死者が口にした名だった。

    "translation_ja": |-
      太陽は三度、中天にのぼった。その間ずっと、死者のように、
      祭司は家に動かず寝ていた。頭の中には海のとどろき。
      床を踏む足音もなければ、ささやく声すらなかった。
      ただ薄笑いのティキだけが、まぶしい浜を見ていた。
      また山々に光がともり、また朝が明けた。
      すべての家が眠る中、祭司の家が目を覚ました。
      人々はそれぞれの屋根の下で身を寄せ合い、震えたが、
      赤い眼をした老祭司は、狂人のように外に駆け出した。
      村じゅうが息をのんだ。彼はまた死者の宝飾をまとっていた、
      老人の銀のあごひげ、殺された女たちの髪を。
      狂乱が四肢を震わせ、狂乱が目に輝き、
      走るたび、何度も何度も、その叫びに谷が鳴った。
      その土地をまる一日、崖から茂みへ、茂みから洞穴へ、
      狂ったように駆けめぐり、人の肉をくれと吠えた。
      まる一日、食べず、小川の水さえ口にせず、
      まる一日、人々は家にいて聴き、そして震えた。
      まる一日、人々は家で息を殺して聴き入り、
      外へ出た者は一人もいなかった。祭司を見ることは死を意味したから。

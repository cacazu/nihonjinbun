        "original_unit_id": "bal-046"
    "translation_ja": |-
      だが、彼らはわが氏族の敵だ。
      憐れみを踏みつけ、王の前に進んで礼儀正しく挨拶し、
      ラヘロを重々しくもてなした。戦う者、歌う者、
      この国で名をなした者には、おのおのふさわしい褒め言葉をかけ、
      由緒ある家柄の者とは、みな、いにしえの日々について語った。
      「なるほど」と言った。「パエアでは、食べ物は地面に腐るほどある。
      とはいえ、お客人は大勢だ。豚も狩り、探さねばならぬ。
      若者は連れだって山へフェイを取りに行き、
      町の娘たちはカヴァの鉢のまわりに集まる。
      今夜はここでおやすみなされ。明日は王も平民も祭司も、
      それぞれしかるべき順で、わしと宴の座についていただこう」
      夜通し眠らず、ヒオパの家来たちは働いた。
      豚は悲鳴をあげて屠られ、客を迎える家の材は油で磨かれ、
      床には葉が敷かれた。山あいの谷という谷では、
      月が裸の男たちの体に木の影を描いた。
      男たちは果実をもぎ、運んだ。町じゅうのいたるところ、
      椰子を燃やす火が赤く輝き、やがて土をかけて踏み固められた。
      七人のヨトワは、それぞれ氏族の手勢とこうして働き、
      八人目は人目につかぬところで若者たちと働いた。
      森の奥深く、彼らが積む薪は高くなった。
      ひとつひとつが男ひとりの荷になるほどの薪束、
      久しく乾き、火を待ちわび、にわかに炎となる薪だった。

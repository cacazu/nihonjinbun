    "translation_ja": |-
      風は吹いた、
      夜どおし南から。ラヘロは夜どおし逆らって漕ぎ、
      波の逆立つ海に舳先を向け続けた。眠っているかのように黙って、
      女は身を縮めて震えた。やがて夜明けの光がさした。
      左手に、高く長く山の島が横たわっていた。
      タイアラプの峰を越えて、日光の矢が射した。
      陸では鳥が歌いはじめていた。死んで葬られた者たちの
      霊の群れは、とうの前に土をかぶせた墓へ戻っていた。
      海の上の女に、急に勇気が出てきた。
      さっと身をひるがえし、男の顔をのぞきこんだ。
      知っている男ではなかった、同国でも同族でもない。
      生まれたままの素っ裸で、火の傷に姿を損なわれた他人。
      だが顔立ちはよく、背も高かった。従い、感嘆するほかない男だった。

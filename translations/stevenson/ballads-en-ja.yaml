    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-101"
    "translation_ja": |-
      「タヘイア、夜の穴は、人を欺くものがうごめいている。
      空のいちばん果ての精霊、あらゆる物の悪い魂。
      死者たちの魂、森の木に止まって人の首を絞める者、
      人間であるものすべてを待ち伏せし、善も悪も憎むものたちが」
    "translation_status": "reviewed"
  - "id": "bal-102"
    "section_id": "feast-ii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “Rua, behold me, kiss me, look in my eyes and read;
      Are these the eyes of a maid that would leave her lover in need?
      Brave in the eye of day, my father ruled in the fight;
      The child of his loins, Taheia, will play the man in the night.”
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 146

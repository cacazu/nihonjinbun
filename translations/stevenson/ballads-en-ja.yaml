        "original_unit_id": "bal-084"
    "translation_ja": "〔51a〕注一五、五一ページ。「死者の星」。明けの明星としての金星。この信仰については多くの興味深い証言を集めた。死者は魚を食べるのを相変わらず好み、生きた漁師と組んで仕事をし、礁や潟によく姿を見せるという。伝説に出てくる名の知れない女と同じ状況に置かれたなら、今日でもポリネシアの百人のうち九十人が、彼女と同じ結論に達するだろう。これでもおそらく私は一割ほど少なく言っている。"
    "translation_status": "reviewed"

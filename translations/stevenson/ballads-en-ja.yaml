    "translation_ja": |-
      タマテアは立ち上がった。いつも人に言われたとおりに。
      気楽に籠を担ぎ、主人に愛想よく別れを告げ、
      また、鳴りとどろく岸をまわる道を取った。
      長く歩くと、やがて目に入ったのは、美しい草地、
      椰子の幹とその影、その間にのぞく家々の屋根。
      そこに、宮の戸口に、王が王の座に座っていた。
      まわりには武装したアイトが立ち、足もとにはヨトワ〔16〕が座った。
      だが王の胸には恐れという虫がいて、恐れのために目がせわしく動いた。
      人の顔を探って謀反を疑い、言葉を吟味して嘘を探した。
      そこへタマテアがやって来た。手から籠をさげて、
      臣下の姿勢で立ち、しかるべき礼を捧げた。
      王は黙って聞き、両のまぶたを閉じた。
      胸に飼っていたのは憎しみと、卑しい者の根も葉もない恐れ。
      黙って贈り物を受け取り、持ってきた男を帰した。
      こうしてタマテアは立ち去った。日の光に背を向けて。
    "translation_status": "reviewed"
  - "id": "bal-034"
    "section_id": "rahero-i"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      And lo! as the king sat brooding, a rumour rose in the crowd;
      The yottowas nudged and whispered, the commons murmured aloud;
      Tittering fell upon all at sight of the impudent thing,
      At the sight of a gift unroyal flung in the face of a king.
      And the face of the king turned white and red with anger and shame
      In their midst; and the heart in his body was water and then was flame;
      Till of a sudden, turning, he gripped an aito hard,
      A youth that stood with his ómare, [17] one of the daily guard,
      And spat in his ear a command, and pointed and uttered a name,
      And hid in the shade of the house his impotent anger and shame.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"

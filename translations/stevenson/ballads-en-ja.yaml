    "origin": "source"
    "source_text": "[5] Note 1, page 5. “The aito,” quasi champion, or brave. One skilled in the use of some weapon, who wandered the country challenging distinguished rivals and taking part in local quarrels. It was in the natural course of his advancement to be at last employed by a chief, or king; and it would then be a part of his duties to purvey the victim for sacrifice. One of the doomed families was indicated; the aito took his weapon and went forth alone; a little behind him bearers followed with the sacrificial basket. Sometimes the victim showed fight, sometimes prevailed; more often, without doubt, he fell. But whatever body was found, the bearers indifferently took up."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 112
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[55]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-068"
    "translation_ja": "〔5〕注一、五ページ。「アイト」。ほぼ、一騎討ちの勇士、あるいは勇者のこと。ある武器の扱いに抜きんで、国じゅうを遍歴しては名のある相手に挑み、土地の争いにも加わった。順当に出世すれば、しまいには首長か王に召し抱えられた。そのときは、供犠のいけにえを調達するのも務めの一つになった。いけにえを出す定めの家々の一つが名指されると、アイトは武器を取り一人で出かけた。その少し後ろを、供犠の籠を手にした担ぎ手たちがついていった。いけにえにされる者が立ち向かうこともあり、ときには勝つこともあった。むろん、倒されるほうが多かったろう。だが、その場にどちらの死体があろうと、担ぎ手は区別せずに担いでいったのである。"

    "translation_ja": |-
      「女よ」と彼は言った。「昨夜、おまえの一族の男たちは、
      男も女も娘もろとも、おれの一族を煙で窒息させた。
      臆病者のしわざだった。この強い両手を持ったおれが、
      たったひとり命をとりとめた。今は人気のない土地へ、
      煙の立たぬ民の炉辺へ、おれとおまえ二人きりで舟を進めている。
      おまえの母の生まれる前に、今日という日の賽は投げられた。
      選ばれたのはおまえだ。夫はいくら争ってもむなしく、
      おれの両手に砕かれる。おまえは何もかもから切り離される、
      好きな場所からも人からも、家からも身内からも氏族からも。
      そして荒れ地に住み、身寄りをなくした男のために子らを産むのだ」

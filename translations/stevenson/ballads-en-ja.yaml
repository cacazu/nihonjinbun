    "translation_ja": |-
      するとキャメロンが口を開き、
      差し出された手を握り返した。
      「スコットランドに、おれを信じて
      裏切られる者があってなるものか。
      お前が殺めたのがだれであれ、
      どんな名の、どんな血筋の者であれ、
      わが剣とあの山にかけて、
      お前の争いはおれのものだ。〔103〕
      さあ中へ、おれの炉辺へ。
      家も広間もお前と分けよう。
      お前をあらゆる危難から守るのは、
      今や、おれの名誉にかかわることだ」

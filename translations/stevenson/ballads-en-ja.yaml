        "original_unit_id": "bal-173"
    "translation_ja": |-
      スコットランドに一人の王が立った。
      敵にはむごい男だった。
      戦でピクトの民を討ち、
      ノロジカを追うように追い立てた。
      赤い山の幾里にもわたり、
      逃げる者たちを追いすがり、
      小人のようなその身をそこらに散らした、
      息絶える者、すでに死んだ者の身を。

      “Life is dear to the aged,
      And honour a little thing;
      I would gladly sell the secret,”
      Quoth the Pict to the King.
      His voice was small as a sparrow’s,
      And shrill and wonderful clear:
      “I would gladly sell my secret,
      Only my son I fear.

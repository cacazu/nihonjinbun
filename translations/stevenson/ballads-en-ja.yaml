    "source_text": "Among the curiosities of human nature, this legend claims a high place. It is needless to remind the reader that the Picts were never exterminated, and form to this day a large proportion of the folk of Scotland: occupying the eastern and the central parts, from the Firth of Forth, or perhaps the Lammermoors, upon the south, to the Ord of Caithness on the north. That the blundering guess of a dull chronicler should have inspired men with imaginary loathing for their own ancestors is already strange: that it should have begotten this wild legend seems incredible. Is it possible the chronicler’s error was merely nominal? that what he told, and what the people proved themselves so ready to receive, about the Picts, was true or partly true of some anterior and perhaps Lappish savages, small of stature, black of hue, dwelling underground—possibly also the distillers of some forgotten spirit? See Mr. Campbell’s Tales of the West Highlands."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 228
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[156]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-184"
    "translation_ja": "人間の性質の不思議を挙げるなら、この伝説には指折りの席が与えられてよい。ピクト人が絶滅したことなどなく、今日に至るもスコットランド人のかなりの部分を成していることは、読者に念を押すまでもあるまい。彼らが占めるのは東部と中部、南はフォース湾、あるいはラマームーア丘陵あたりから、北はケイスネスのオード岬に至る土地である。愚鈍な年代記作者の見当違いの当て推量が、人々に自分の祖先へのいわれのない嫌悪を抱かせたというだけですでに妙なことだが、それがこの荒々しい伝説まで生み出したとは信じがたいほどだ。その年代記作者の誤りは、ただ呼び名にあったということはないだろうか。彼がピクト人について語り、人々があれほどたやすく信じた話は、実はそれ以前にいた、おそらくはラップ系の、背が低く、肌の色が黒く、地の下に住む未開の人々についてなら、ほんとうだったのか、あるいは一部ほんとうだったのかもしれない。ひょっとすると、その人々こそ今は忘れられた蒸留酒を造ったのかもしれぬ。キャンベル氏の『西ハイランド民話集』を参照されたい。"
    "translation_status": "reviewed"

    "translation_ja": |-
      見よ、王が座って思いをめぐらすと、人々の間にささやきが広がった。
      ヨトワは肘でつつき合って耳打ちし、平民ははばからずざわめいた。
      その不届きなしろものを目にして、誰もがくすくす笑いだした。
      王には似つかわしくない贈り物が、その鼻先に突きつけられたのを見て。
      人々のまんなかで、王の顔は怒りと恥に青くなり、
      赤くなった。胸の奥の心はいったん水になり、やがて火になった。
      と、いきなり身をひるがえし、一人のアイトをぐっとつかまえた。
      オマレ〔17〕を手に立っていた若者、その日の衛士の一人だった。
      耳もとへ命令を吐き、指をさして、ある名を口にした。
      家の暗がりに隠したのは、やり場のない怒りと恥だった。

    "translation_ja": "〔7〕注二、七ページ。「パイ」「ホノウラ」「アフプ」。タヒチの伝説上の人物で、三人ともタイアラプの生まれである。初めの二人については、欠けたところはあるが珍しい伝説を集めている。近いうち、別のところで読者に紹介したい。アフプについては、歌の端々のほかに、ほとんど記憶が残っていないらしい。少なくとも、島の東の要害テパリ、すなわち「海の崖」のあたりに住んでいた。山では自分しか知らない小道を歩き、近くの島から泳いでやってくる危険な求婚者たちに言い寄られた。そして私の聞き取ったところでは、土地の魚が忠義を尽くして彼女を守り、救い出したという。「アフプ・ヴェヒネ」についてもっと知りたいという私の熱心さは、タイアラプ滞在中、陽気な土地の人々に少々笑いの種を提供した。"

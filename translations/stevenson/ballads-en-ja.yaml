    "translation_ja": |-
      夜のとばりが下りかけたころ、ヒオパは浜に来た。
      着いた者を眺めて数えると、なんと八百人もいた。
      走れるようになったばかりの幼な子たちは、ぱたぱた駆けて遊び、
      少年は髭ひとつない口もとにほほえみ、娘の胸には細いふくらみ、
      女たちの手足はたくましい。男たちを育てた丈夫な母親たち。
      父親たちは物おじせずに前に出たが、王の目を少し避けたところに、
      やっと年ごろになりかけた若者や娘が輪になっていた。
      互いを求めながら、自分がこわく、王の目が気になり、
      大人らしく振る舞ってはみても、手と目とで寄り添いあい、
      くちづけのようにやさしいまなざし、ため息のように甘い笑いを交わした。
      祖父もそこに立ち、銀色の頭を上げ、
      乳の出るはずもないその胸を、乳飲み子の頼りない手が探った。
      芽ばえたばかりの恋、仲むつまじい夫婦、あどけない子供たち、
      何度となく繰り返されては新しくなる、世代の物語。
      ヒオパは人の世のありとあらゆる年ごろを一度に目にし、
      ひととき決意の揺らぐのを覚えた。

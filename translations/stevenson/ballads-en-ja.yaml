    "translation_ja": |-
      「ずいぶんいろんな名を聞いた」と彼は思った。
      「人の口にのぼる、ありとあらゆる言葉で、
      あちらでもこちらでも、ずいぶんたくさん、
      今も昔もたくさんの名を。
      膝をむきだしにするお国で
      父の家にいたころにも、
      空を飛ぶ鷲たちと
      海を泳ぐニシンの間で。
      隊長になった今もそうだ、
      帽子には立派な帽章をつけて。
      ずいぶんいろんな名を聞いた」と彼は思った。
      「だがあの名に似たものさえない」

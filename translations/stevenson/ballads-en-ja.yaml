        "xpath": "/html/body/p[87]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-103"
    "translation_ja": |-
      そう言い、そう決めて、タヘイアは身を起こし、
      星明かりにほほえんで、燕のようにすばやく去った。
      ルアは丘に立ってため息をつき、その飛ぶ姿を目で追った。
      眼下の家々には、一つ一つ戸口に灯がともっていた。
      段に座って長い夕べを過ごす人々からは、
      急に弾ける笑い声と、節を変えずにうなる歌。
      頭の上の木々では魂が静かに通っていった。〔74〕
      そして港をとりまいて、波の雷が崩れていた。
      「さらば、わが家」とルアは言った。「さらば、安らかな住みか！
      明日はおまえの谷という谷で、死の太鼓が鳴るだろう」

    "translation_ja": "〔69〕注五、六九ページ。「椰子で造った神聖な小屋」。もっとも女は誰も近づけなかった。女がどこで入れ墨をほどこされたのかを、私は知らない。おそらく共同の家か、あるいは茂みの中だったろう。何しろ女は重んじられない存在だったからだ。タヘイアの顔や体がそれで損なわれたなどと、読者に思っていただいては困る。マルケサスの入れ墨師の技は極みに達している。彼女はさながらレースを身にまとったように見えたはずだ。この上なく繊細で、模様の美しい、青みがかったレースで、その色は土地の人のあたたかみのある肌と対照をなし、同時に調和もした。「見事に入れ墨をした」マルケサスの女ほど、その人に似つかわしい装いをした女は、そう見つからないだろう。"

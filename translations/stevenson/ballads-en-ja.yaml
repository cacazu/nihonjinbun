    "source_text": "[62a] Note 2, page 62. “Ruby-red.” The priest’s eyes were probably red from the abuse of kava. His beard (ib.) is said to be worth an estate; for the beards of old men are the favourite head adornment of the Marquesans, as the hair of women formed their most costly girdle. The former, among this generally beardless and short-lived people, fetch to-day considerable sums."

    "translation_ja": |-
      ルアは眺め、いぶかった。心の中でひとりつぶやいた。
      「生きる喜びなど貧しいものだ。死ぬほうがまだいい」
      だが見よ、高い席に、穏やかな一群が
      人々と離れて座り、真剣な目を上げもせず、口もきかなかった。
      衣は乱れず、花輪をきちんと整えた女たちが、
      宴とは無縁の人の顔で、宴から遠くへ目を向けていた。
      静かな人の中でも静かに、美しい人の中でもひときわ美しく、
      名家のタヘイア、髪の豊かなタヘイアがいた。
      ルアの魂は目を覚まし、勇気がその目に火をともした。
      人を集める叫びを上げ、一族へ立ち上がれと呼びかけた。
      すぐさま、向こうの木のまだらな陰で、
      梟めいて目をしばたたく者どもが、あたふたと四つん這いになった。
      聖なる段の上では、よだれを流す者が恐れて目を覚まし、
      腰も抜けた戦士の手が、ゆらぐ槍を振りかざした。
      ルアは腕を組んだ。侮蔑に歯がのぞいた。
      上ではいくさの群れがわめき、下にルアはほほえんで立った。
      秋の葉のように数多く、四月のみぞれのように弱く、
      震える手の投げた飛び道具が、足もとに突き立ち震えた。
      タヘイアは席を飛び立ち、ルビーの眼の祭司は
      段の正面に駆け寄り、両腕を振り上げ、二人は叫んだ、
      「待て、愚か者ども、彼は知らせを運んで来たのだ！」「やめて、その人はわたしの愛する人なの！」
      見よ、段の前には、投げ矢に貫かれたルアがいた。

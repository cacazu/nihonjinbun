    "translation_ja": |-
      たまたま家臣たちが
      馬に任せて荒れ野を進むと、
      倒れた一つの石があり、
      下には虫けらどもが潜んでいた。
      手荒に隠れ場から引き出され、
      二人は一言もものを言わない。
      息子と年老いたその父親、
      小柄な種族の最後の二人。

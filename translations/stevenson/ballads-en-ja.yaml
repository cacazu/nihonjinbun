        "original_unit_id": "bal-050"
    "translation_ja": |-
      タマテアの母は両腕を広げて、
      「わが子の火葬の火よ」と叫んだ。「神が返し給うべき仇よ。
      遅かった、遅かったが、とうとうおまえをこの目で見る。
      それを見てわたしは歓喜する！　今こそ苦しみの日々は過ぎた。
      わが魂を飢えさせた渇望は、今や望みのままに飲み食いをし、
      わが子を取り囲んだ者たちが、生きながら火に焼け縮んでいる。
      十倍もありがたいことよ、長い年月を経て訪れる仇討ちは！
      おまえたちは、わたしの歌い手の声を消したね？　死にゆく耳を澄まして
      この大火の歌を聞け！　わたしを寡婦にしてひとり置き去りにしたね？
      さあ見よ、おまえたちの一族は根こそぎに、筋も骨も
      苦しむ肉も一緒くたに焼けていく。男も、母も、娘も、
      同じ屠場に積み重なり、もう、貿易風に乗って、
      おまえたちの滅びの煙が夜の星を曇らせる」
    "translation_status": "reviewed"

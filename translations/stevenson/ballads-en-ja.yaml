        "original_unit_id": "bal-054"
    "translation_ja": |-
      ラヘロは身をかがめて手で探った。妻に触れ、娘に触れた。
      だが炎の煙とカヴァとが、彼女らの意識の灯を吹き消し、
      そこに横たわるのは倒れた柱のようだった。その手が息子に触れた。
      暗くなった魂を、いなずまのように喜びが走った。
      「この子なら助けられる！」と思った。「間に合いさえすれば」
      腰から布をほどき、それで幼な子をくるみこみ、
      その荷をたくましい自分の首に、しっかりと結びつけた。

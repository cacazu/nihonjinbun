    "source_text": "[69] Note 5, page 69. “The sacred cabin of palm.” Which, however, no woman could approach. I do not know where women were tattooed; probably in the common house, or in the bush, for a woman was a creature of small account. I must guard the reader against supposing Taheia was at all disfigured; the art of the Marquesan tattooer is extreme; and she would appear to be clothed in a web of lace, inimitably delicate, exquisite in pattern, and of a bluish hue that at once contrasts and harmonises with the warm pigment of the native skin. It would be hard to find a woman more becomingly adorned than “a well-tattooed” Marquesan."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"

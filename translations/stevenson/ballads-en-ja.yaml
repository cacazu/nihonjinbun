    "kind": "paragraph"
    "origin": "source"
    "source_text": "In this ballad, I have strung together some of the more striking particularities of the Marquesas. It rests upon no authority; it is in no sense, like “Rahéro,” a native story; but a patchwork of details of manners and the impressions of a traveller. It may seem strange, when the scene is laid upon these profligate islands, to make the story hinge on love. But love is not less known in the Marquesas than elsewhere; nor is there any cause of suicide more common in the islands."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 171
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[108]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-127"
    "translation_ja": "この物語詩では、マルケサス諸島でとりわけ印象に残った事柄をいくつかつないだ。誰かから聞いた話に基づくわけではない。「ラヘロ」のような土地の物語ではまったくなく、風俗の細部と旅人の印象とを継ぎ合わせたものである。この奔放な島々を舞台にして、恋を物語のかなめにしたのは不思議に思われるかもしれない。だがマルケサスでも、よそに劣らず恋はよく知られているし、島々で恋よりよくある自死の原因もない。"

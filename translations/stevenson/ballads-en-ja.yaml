  - "id": "bal-166"
    "section_id": "ticonderoga-notes"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Introduction.—I first heard this legend of my own country from that friend of men of letters, Mr. Alfred Nutt, “there in roaring London’s central stream,” and since the ballad first saw the light of day in Scribner’s Magazine, Mr. Nutt and Lord Archibald Campbell have been in public controversy on the facts. Two clans, the Camerons and the Campbells, lay claim to this bracing story; and they do well: the man who preferred his plighted troth to the commands and menaces of the dead is an ancestor worth disputing. But the Campbells must rest content: they have the broad lands and the broad page of history; this appanage must be denied them; for between the name of Cameron and that of Campbell, the muse will never hesitate."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 210
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[141]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-166"
    "translation_ja": "序。わが国のこの伝説を初めて聞かせてくれたのは、文人たちのよき友アルフレッド・ナット氏である。場所は「轟くロンドンの流れのただなか」だった。この物語詩が初めて『スクリブナーズ・マガジン』誌に出て以来、ナット氏とアーチボルド・キャンベル卿は、その事実関係をめぐって公に論争してきた。キャメロンとキャンベル、二つの氏族がそろって、この胸のすく話はわが一族のものだと名乗りを上げている。もっともなことだ。死者の命令にも脅しにも従わず、ひとたび交わした約束を守った男なら、どちらの祖先であったか争うだけの値打ちがある。しかしキャンベル一族には今あるもので満足してもらおう。広大な領地も、歴史の広い紙面もお持ちなのだ。この分け前まで差し上げるわけにはいかない。キャメロンとキャンベル、二つの名のどちらを取るかと問われて、詩の女神がためらうことは決してないからだ。"
    "translation_status": "reviewed"

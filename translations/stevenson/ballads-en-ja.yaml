      「髪のふさふさしたタヘイア、ぼくらは愚かなことをした。
      神々がつれなく引き離したものを、一つに結んでしまった。
      なぜ身分のいやしい恋人が、タヘイアの裾に触れよう。
      タヘイアは名家の娘、ルアは土くれの子なのに」

        "original_unit_id": "bal-181"
    "translation_ja": |-
      彼らは息子を捕らえ、革紐で
      首とかかとをひとつに縛った。
      若者がひとり、つかんでぶんと振り、
      力に任せて遠くに放った。
      海はそのからだを呑んだ、
      十歳の子ほどのそのからだを。
      そして断崖には父が立った、
      小柄な民の、最後の一人。

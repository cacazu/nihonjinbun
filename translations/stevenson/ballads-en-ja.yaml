    "translation_ja": |-
      女のすぐ横へ男は身軽に舟に飛び乗った。女も
      明るく言葉をかけ、櫂と、腰をかける場所を譲った。
      いまは松明が消えて、夜は穴底のように真っ暗だった。
      ラヘロは漕ぎはじめた。口はひと言もきかなかった。
      力強く櫂を入れると、舟は水の中で歌った。
      「どうかしたの？」と女は聞いた。「なぜ松明を落としたの。
      陸に着いたらすぐ、また火をつけるのに」
      ラヘロはひと言も答えず、ただカヌーを進めた。
      女の肌が冷えた。「アッタ！　話して。あなたでしょう？
      話して！　なぜ黙っているの。なぜ横を向いているの。
      どうして沖へ舵を取るの？」息せき切ってこう叫んだ。
      暗闇で漕ぎ働いている男からは、ひと言もなかった。
      音もなく、礁の切れ目を目がけてまっすぐ舟を向け、
      たった一本の櫂を力のこもったひと漕ぎひと漕ぎに振るい、
      外海にふさわしくないその舟を、大海原へ押し進めた。
      恐怖が、座ったその場で女を石のように凍らせた。
      頼りない舟と逆巻く深みに対する恐怖だけではない。
      もっと鋭い恐れだった、夜が、闇が、物の怪の出る時刻が、
      人間を超えた力と、人間を超えた大胆さで
      カヌーを駆るそのものが怖かった。死者のことならよく知っていた。
      死者は礁に出て漁をし、人と同じく食いぶちのために働き、
      生きた漁師と取引するか、さもなくば命を奪って獲物を取る。
      死者の星〔51a〕が沈み、朝の空気が
      吹き、陸で鶏が鳴く時までは。もはや女は確信していた。
      横にいる物言わぬやつは、墓の住人なのだと。〔51b〕

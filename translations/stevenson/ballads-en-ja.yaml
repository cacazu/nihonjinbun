        "original_unit_id": "bal-174"
    "translation_ja": |-
      やがてこの国にも夏が来て、
      釣鐘形のヒースの花は赤かった。
      だがその酒の醸しようを
      語れる者は生きていなかった。
      いくつもの山のいただきの、
      まるで子供のためのような墓に、
      ヒースの酒の醸し手たちは
      死人の数に入って横たわった。

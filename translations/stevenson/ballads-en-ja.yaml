      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-161"
    "translation_ja": |-
      たそがれ時のことだった、
      将軍は幕僚とともに立ち、
      東を見、西を見た、
      とても笑う気にはなれずに。
      「遠くまで行き、多くを見た。
      勝ちも知っているし、負けも知っている。
      だがここには四方に森があり、
      越えるのが厄介な水がある。
      遠くまで行き、多くを見たが、
      これほどのものは見たことがない。
      誰かその水ぎわへ下りて
      深さを見てこねばならぬ」

  - "id": "bal-151"
    "section_id": "ticonderoga-i"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “Thrice have you seen me, brother,
      But now shall see me no more,
      Till you meet your angry fathers
      Upon the farther shore.
      Thrice have I spoken, and now,
      Before the cock be heard,
      I take my leave for ever
      With the naming of a word.
      It shall sing in your sleeping ears,
      It shall hum in your waking head,
      The name—Ticonderoga,
      And the warning of the dead.”
    "source_languages":
      - "en"
      - "sco"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 195
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[129]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-151"
    "translation_ja": |-
      「三たびお前に姿を見せた、兄弟。
      だが、もうおれを見ることはない、
      向こうの岸で怒れる先祖たちに
      お前がまみえる、その時までは。
      三たびおれは語った。今こそ、
      鶏の声の聞こえぬうちに、
      とこしえの別れを告げよう、
      ひとつの名を言い残して。
      それは眠る耳には歌となり、
      覚めた頭には羽音となろう。
      その名は、タイコンデロガ。
      死者の警告の言葉だ」

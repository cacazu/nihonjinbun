    "kind": "verse"
    "origin": "source"
    "source_text": |-
      From the bonny bells of heather
      They brewed a drink long-syne,
      Was sweeter far than honey,
      Was stronger far than wine.
      They brewed it and they drank it,
      And lay in a blessed swound
      For days and days together
      In their dwellings underground.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 216
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[145]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-172"
    "translation_ja": |-
      釣鐘なす可憐なヒースの花で、
      昔むかし、酒を醸した。
      それは蜜よりはるかに甘く、
      葡萄酒よりもはるかに強い。
      彼らは醸し、彼らは飲んだ。
      何日もまた何日も、
      地の底深い住まいのなかで
      うっとり夢見心地に寝た。

    "translation_ja": |-
      そのころ、お人よしのタマテアは、帰り道をはるか進んでいた。
      顔には近づく夜、背には死にゆく日。
      通り過ぎるのをラヘロは見て、その心は喜んだ。
      王に恥をかかせるつもりで、若者を害する気など毛頭なかった。
      道端に住む人たちはみな彼を見て、親しく声をかけた。
      ひと目で友だとわかる顔をして、町の便りを聞かせてくれたからだ。
      人がかまってくれるのも、用事が済んだのも嬉しくて、
      タマテアは太陽に背を向けて、家へと近づいた。

        "original_unit_id": "bal-100"
    "translation_ja": |-
      「愛よ、愛、いとしいルア、愛にはもっとよく見える。
      愛の腕を離れて、あなたを死にに行かせはしない。
      ほら、割れた山が谷間へまっすぐ落ちているところ、
      あそこならどんなに大胆な人狩りの男からでも隠れられる。
      その深い奥まったところには、真昼にしか陽が射さず、
      夜にもただ一度きり、月の明かりが入る。
      音といえば鳥か、ひと声叫ぶように降る雨ばかり。
      死と、死を恐れる心が、谷をまわりから囲んでいるから。
      タプの場所よ。でも神々は、絶望した者をきっとお許しになる。
      タプ、だから何？　ルアに踏み出す勇気さえあれば。
      タプ、タプ、またタプ。それぞれ正しいとわたしは知ってる。
      でもどのタプの神も、いつでもすぐ罰を下すとは限らない。
      そこに隠れていて、ルア、畏ろしい神々の腕の中に。
      木陰の、やさしい芝土の寝床で眠って。
      眠ってタヘイアの夢を見て。タヘイアはあなたのために起きている。
      陸からの風が吹いて、森が露で重くなるたびに、
      ひとり、恐ろしい夜〔72〕を越え、愛するあなたを養う食べ物を抱き、
      決して思いとどまらないタヘイアが、鳩のように道を違えず急いで行く」
    "translation_status": "reviewed"
  - "id": "bal-101"
    "section_id": "feast-ii"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      “Taheia, the pit of the night crawls with treacherous things,
      Spirits of ultimate air and the evil souls of things;
      The souls of the dead, the stranglers, that perch in the trees of the wood,
      Waiters for all things human, haters of evil and good.”
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 145
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"

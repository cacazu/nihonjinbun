    "translation_ja": |-
      一族の土地という土地に、魚もなければ果実もなく、
      いちばん深いポポイの穴も、底まで空になっていた。〔61〕
      左手の氏族も、右手の氏族も、
      彫り物をした棍棒に油を塗り、短剣をぴかぴかに磨いた。
      茂みへ入り、いちばん奥の陰に身を置いて、
      眠らぬ目で横たわった。その待ち伏せに行きあえば命はなかった。
      星の出る夕べに、朝の歌がわき起こることもしばしばだった。
      敵の国で、かまどから煙が立つころのことだ。
      帰りを案じ、耳をそばだて目をこらす者のもとへ、
      食を探しに出た若者は、夜が来ても、しばしば戻らなかったからだ。
      まず子どもたちが病み、ついで女たちが青ざめ、
      戦士の太い腕も、いくさにはもはや役に立たなかった。
      太鼓の深い響きはやみ、踊りは打ち捨てられ、
      祭司に会う者は、いまや横目で彼をうかがった。
      祭司は年配の男で、目はルビーのように赤かった。〔62a〕
      闇を恐れず、死者のおぞましさを恐れず、
      諸氏族の歌を知り、遠い昔の名を知っていた。
      胸に垂れたあごひげで、首長の領地が買えるほどだった。
      彼の住まいは、鳴りとどろく岸のすぐそば、高く建てた家、
      立派な壇の上にあり、戸口にはティキ〔62b〕が立っていた。
      一族によく尽くした彼の家には、なかいっぱいに宝があり、
      貝殻のうつろな内のように、砕ける波の音が満ちていた。
      何週間も民が死ぬに任せ、助けのしるし一つ見せず、
      油を塗った壇に座って神と心を通わせた。
      高い段にただ座って、ティキをかたわらにして、
      青い海を見つめていた、赤い眼をした鸚鵡のように。
      硫黄のように黄いろい暁が、山の高みにはね上がった。
      円い海のはてには朝の光の宝玉が、
      円い海のはてからは日の光の吹き流しがのぼった。
      それでも谷の底深くでは、日はまだ始まっていなかった。
      木立の青い薄闇で、椰子殻が赤く燃え、
      一族の女たちも男たちも、その薄闇を水浴びに出た。
      ある言葉が伝わり出した。ひと言、ひそひそ声、はっとする気配。
      胸に跳ね上がった希望、心臓をたたいた恐れ。
      「ほら、祭司は起きていない。見ろ、戸がかたく閉じてある！
      いけにえの名を告げるのだ。とうとうわしらを助けてくれるのだ」

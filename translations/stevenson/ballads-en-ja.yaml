    "translation_ja": |-
      音もなく水に入り、音もなく泳いでいった、
      高く火を掲げ、漁師が歩いている所へ。
      礁の突堤に、海が激しく砕け散る音が響いた。
      漁師の間近にラヘロは姿を現した。
      珊瑚の上でいきなり二人はもつれ合った。
      片手には男、もう片方の手には松明があった。
      火は地に落ちる暇もなく、まだ高々と燃えていた。
      漁師は強く勇敢で、頭の回転も目もすばやかった。
      力を振りしぼって争ったが、ラヘロはその力に耐えた。
      ぐいと体が動いて、命の背骨が音を立てて折れた。
      男は腕の中で力を失い、塊となって足もとに転げた。

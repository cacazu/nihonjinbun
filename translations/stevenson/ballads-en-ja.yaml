    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-164"
    "translation_ja": |-
      そして翌日の朝、
      戦いがいちばん激しくなったとき、
      キャメロンは地に倒れた、
      その夜みずから言ったとおりに。
      ヒース咲く丘を遠く離れ、
      海の島々を遠く離れ、
      あの名をもつ場所に、今も眠る。
      そうなるさだめであったとおりに。

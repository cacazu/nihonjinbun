    "origin": "source"
    "source_text": "[7] Note 2, page 7. “Pai,” “Honoura,” and “Ahupu.” Legendary persons of Tahiti, all natives of Taiárapu. Of the first two, I have collected singular although imperfect legends, which I hope soon to lay before the public in another place. Of Ahupu, except in snatches of song, little memory appears to linger. She dwelt at least about Tepari,—“the sea-cliffs,”—the eastern fastness of the isle; walked by paths known only to herself upon the mountains; was courted by dangerous suitors who came swimming from adjacent islands, and defended and rescued (as I gather) by the loyalty of native fish. My anxiety to learn more of “Ahupu Vehine” became (during my stay in Taiárapu) a cause of some diversion to that mirthful people, the inhabitants."

    "translation_ja": |-
      こう決まって、日が定まった。朝が明けるやいなや、
      カヌーが海に押し出されて、家々はもぬけの殻になった。
      氏族を呼び集める南風が強く吹き、
      礁の連なりのかぎり、轟く大波が駆け、
      島の頂には雲が、山の高さまで積み上がり、
      山の上に山が座を占めた。そのあいだを、カヌーの船団は
      緑の礁湖を滑ってゆく。乗り手は心配事など忘れ、
      平らな水を進み、夏の空気を吸い、
      雲ひとつない日の光に浮きたっている。だが左右には絶えず、
      礁で砕ける大波、峰であびせる豪雨。
      かくてヴァイアウの民は、ひねもす楽しく航海した。
      椰子の茂る岬をかすめ、人のよく住む湾を横ぎり、
      テヴァ族の町という町の前を過ぎた。快く走りながら、
      舟と舟とで冗談と笑い声と歌をやりとりした。
      どの町の人も群れをなして海辺へ出て、
      手をかざして眺め、木の高みに飛びつき、
      歓呼し、呼びかけた。それ以上は間に合わなかった。
      舟に乗った祭りの村は風に傾き、通りすぎる鳥のように
      たちまち視界から消えた。進むにつれ、飛び去る鳥の
      声さながらに、岸辺には己の歌を置いていった。
      娘たちの慕わしい笑いと、子供の喜びの声と。
      あとに残った見物人は、航跡を見つめてほほえんだ。
      テヴァ族の町々をすべて経て、最後のパパラ、
      首長の本拠、戦のときの集合地を過ぎ、
      氏族の土地の境を越え、よその民の土地へ入った。
      すると岸辺の椰子の暗がりから、煙がひと筋、
      立ちのぼり、揺れて、夕日が射す黄金のなかに消えた。
      「パエアだ」と人々は叫んだ。「パエアだぞ」。こうして船旅は終わった。

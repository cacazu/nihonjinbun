    "source_text": "[23b] Note 11, page 23. “Hiopa the king.” Hiopa was really the name of the king (chief) of Vaiau; but I could never learn that of the king of Paea—pronounce to rhyme with the Indian ayah—and I gave the name where it was most needed. This note must appear otiose indeed to readers who have never heard of either of these two gentlemen; and perhaps there is only one person in the world capable at once of reading my verses and spying the inaccuracy. For him, for Mr. Tati Salmon, hereditary high chief of the Tevas, the note is solely written: a small attention from a clansman to his chief."
    "source_languages":
      - "en"
    "source_locations":

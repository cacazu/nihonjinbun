    "translation_ja": |-
      わずかひととき。白波がしきりに打ちつける礁に
      ラヘロがひとり立っていた。裸で、焼かれてほてりながら、
      勝ったことを誰にも知られず、松明を空に掲げて。
      ただひと息つくと、すぐに漁を始めた。
      わが家の夕飯にうまいひと皿を出すことばかり考える男のように。
      女にはいったい何が見えたろう。松明を持つ男、それから
      一瞬目がかすみ、また松明を持つ男。
      その火はほとんど揺れもしなかった。「そうだとも」とラヘロは言った。
      「きっと目の迷いと思うだろう。頭に浮かんだ幻と思うだろう。
      だが早合点した者には、思いこみを育てる暇をやらなければ」
      それでしばらく、熱心な漁師よろしく、礁の上を歩いた。
      ときには立ち止まってのぞき込み、ときには魚を突いた。
      最後に呼び声を上げた。そしてカヌーが近づいたとき、
      もうその用は済んだというように、松明を海に投げた。

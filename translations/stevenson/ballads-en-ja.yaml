    "origin": "source"
    "source_text": "[78] Note 8, page 78. “The first of the victims fell.” Without doubt, this whole scene is untrue to fact. The victims were disposed of privately and some time before. And indeed I am far from claiming the credit of any high degree of accuracy for this ballad. Even in a time of famine, it is probable that Marquesan life went far more gaily than is here represented. But the melancholy of to-day lies on the writer’s mind."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-413"
        "precision": "block"
        "source_sequence": 179
        "url": "https://gutenberg.pglaf.org/cache/epub/413/pg413-images.html"
        "xpath": "/html/body/p[116]"
    "source_alignment":
      - "source_id": "gutenberg-413"
        "original_unit_id": "bal-135"
    "translation_ja": "〔78〕注八、七八ページ。「いけにえの一人目が倒れた」。この場面がそっくり事実と違うのは間違いない。いけにえは人に知られぬところで、しかもずっと前に始末された。そもそも私はこの物語詩が細部まで正確であるなどと、自分の手柄にするつもりは毛頭ない。飢饉のときでさえ、マルケサスの暮らしはここに描いたよりずっと陽気に続いていたろう。だが今日の物悲しさが、筆者の心に重くのしかかっているのである。"

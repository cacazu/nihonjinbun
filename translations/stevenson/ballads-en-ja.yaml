    "translation_ja": "〔23b〕注一一、二三ページ。「ヒオパ王」。実はヒオパはヴァイアウの王（首長）の名だった。だがパエアの王の名はどうしても聞き出せなかったので、この名をいちばん必要なところにあてた。パエアはインドの子守女を指す英語の ayah と韻を踏むように読む。このお二方のどちらについても聞いたことのない読者にしてみれば、何ともよけいな注と映るに違いない。じつのところ、私の詩を読んで、しかも間違いを見つけられる人は、世界に一人しかいないかもしれない。この注はその方、テヴァの世襲大首長タティ・サーモン氏ひとりのために書いた。氏族の一員からわが首長へ、いささかの心遣いである。"

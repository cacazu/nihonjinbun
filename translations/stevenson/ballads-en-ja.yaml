    "translation_ja": |-
      すべて王の言ったとおりにされ、園は繁り、
      その豊かさは評判になり、知らせはヴァイアウにも達した。
      ナムヌ・ウラの男たちは舟で風上遠くまで行き、
      南方、テヴァ族の町々の沖に舟をとめ、
      たっぷりの食べ物を海へ放った。すると、テヴァ族の足もとへ
      どの浜でも、寄せる波が食べ物の宝をころがしてきた。
      塩水のなかで、実りが返す泡にもまれた。
      子供らは遊びながらそれを拾い、食べて、家へも持って帰った。
      年寄りたちは見くらべ、論じ、首をひねり、冗談を交わしたが、
      客が通りかかるたびに、熱心に問いただした。
      少しずつ、人から人へ、こんな話がひろがった。
      「パエアの国じゅうに、食べ物は地面に腐るほどあって、
      豚はねずみほどいる。今じゃ海へ出るときにも、
      ナムヌ・ウラの連中は木の下で拾い物をして、
      うまいものばかり舟べりまでカヌーに積む。
      沖に出て、朝から晩まで顎を動かして食う。
      舵取りは舵を握って食い、漕ぎ手は櫂を手にぱくついて、
      しまいに腹がいっぱいになると、余りは海に投げこむってさ！」
      さて王の言葉は本当になった。餌が姿を見せるなり、
      タイアラプの豚という豚が鼻づらを空へ上げた。
      歌を唱え、血筋のつながりを数え、語り合った。
      近ごろ戦が引き裂いた島の氏族を、昔は平和が
      固く結びつけていたことを。「もう戦はよそう。
      友が友の家へ行くように、ナムヌ・ウラのもとへ急ごう」

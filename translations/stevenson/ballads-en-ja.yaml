      そのとき不意に、泡のように軽く駆けてくる足音が
      耳を打った。振り向くと、なんと、ひとりの男がすぐうしろに迫っている。
      腰帯を締め、オマレを手に、ぴたりと跡についていたのだ。
      ひと跳びで男はのしかかった。言葉ひとつ交わす間もなく、
      重みをもたせたオマレの先が落ち、タマテアは息絶えた。

        "original_unit_id": "bal-071"
    "translation_ja": "〔10b〕注四、一〇ページ。「蠅」。時代に合わない言い方かもしれない。今日のタヒチについて言うにしても、この言葉はおもに蚊を指すものと受け取らねばなるまい。それも水のある、木々が密に茂る谷に限ってのことだ。ラヘロの家のまわりはそんな土地だったろうと私は考えている。そこから四分の一マイルも離れて風通しのよいところへ出れば、一匹探そうとしても見つかりはしない。"

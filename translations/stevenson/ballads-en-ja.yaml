    "source_text": "[34] Note 13, page 34. “Fish, the food of desire.” There is a special word in the Tahitian language to signify hungering after fish. I may remark that here is one of my chief difficulties about the whole story. How did king, commons, women, and all come to eat together at this feast? But it troubled none of my numerous authorities; so there must certainly be some natural explanation."

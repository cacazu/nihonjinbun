    "translation_ja": |-
      さて饗宴の日が来た。朝になると、森は
      風にうねり、峰々はまばゆい陽のなかに揺らめき、
      椰子の実は雨あられと落ち、地面に弾んで、ころころ転がった。
      宴にはみごとな朝だった。火にはうってつけの風だった。
      ヒオパは宴の広間に皆を導いた。母に父、
      娘に乳飲み子、祭りの客のひとり残らずを。
      若葉の花環をかけ、笑顔でやってきた。たくらみなど夢にも思わず。
      三人に一頭ずつ、土のなかで柔らかく蒸した豚が
      待っていた。命の糧のフェイが、
      ひとりひとりの席に山積み。焼いたのと生のと、バナナは
      惜しげもなく積まれ、馬小屋に積んだ
      干し草や藁もかくやというほど。魚という念願の馳走〔34〕、
      いく鉢ものたれ、火に黄金色に焼けたパンの実。
      カヴァは水のようにいくらでもあった。かつて宴は数かぎりなく
      開かれたが、ヴァイアウの民のあの宴ほどのものはなかった。

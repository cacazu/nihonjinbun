    "kind": "verse"
    "origin": "source"
    "source_text": |-
      ALL night long and every night,
      When my mamma puts out the light,
      I see the people marching by,
      As plain as day, before my eye.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[14]"

        "kind": "indent"
        "span":
          "start": 29
          "end": 36
          "exact": "秋にはたき火！"
        "columns": 2
  - "id": "cv-57-heading"
    "section_id": "cv-57"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      VII
      THE GARDENER
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[64]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2047
        "source_sequence": 282
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[61]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2048
        "source_sequence": 282
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-57-heading"
    "translation_ja": "VII　庭師さん"
    "translation_status": "reviewed"
  - "id": "cv-57-01"
    "section_id": "cv-57"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      THE gardener does not love to talk,
      He makes me keep the gravel walk;
      And when he puts his tools away,
      He locks the door and takes the key.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[78]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2049
        "source_sequence": 283
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-57-01"
    "translation_ja": |-
      庭師さんはおしゃべりが嫌い。
      ぼくに、砂利道から出るなって。
      道具をしまったときには
      戸に鍵をかけ、鍵まで持っていく。
    "translation_status": "reviewed"
  - "id": "cv-57-02"
    "section_id": "cv-57"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Away behind the currant row
      Where no one else but cook may go,
      Far in the plots, I see him dig,
      Old and serious, brown and big.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[78]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2049
        "source_sequence": 284
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-57-02"
    "translation_ja": |-
      料理人のほかはだれも入れない
      すぐりの列のずっと裏、
      ずっと奥の畑で、あの人が土を掘ってるのが見える。
      年を取って、まじめで、日に焼けて、大きい。
    "translation_status": "reviewed"
  - "id": "cv-57-03"
    "section_id": "cv-57"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      He digs the flowers, green, red, and blue,
      Nor wishes to be spoken to.
      He digs the flowers and cuts the hay,
      And never seems to want to play.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[78]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2049
        "source_sequence": 285
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-57-03"
    "translation_ja": |-
      緑や赤や青の花の土を掘り、
      話しかけてほしくもないらしい。
      花の土を掘り、干し草にする草を刈り、
      ちっとも遊びたそうには見えない。
    "translation_status": "reviewed"
  - "id": "cv-57-04"
    "section_id": "cv-57"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Silly gardener! summer goes,
      And winter comes with pinching toes,
      When in the garden bare and brown
      You must lay your barrow down.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[78]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2049
        "source_sequence": 286
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-57-04"
    "translation_ja": |-
      おばかさんだね、庭師さん！　夏は去り、
      足の指をつねる冬が来る。
      むきだしで茶色になった庭で
      手押し車を置いて、仕事を休まなくちゃならなくなる。
    "translation_status": "reviewed"
  - "id": "cv-57-05"
    "section_id": "cv-57"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Well now, and while the summer stays,
      To profit by these garden days,
      O how much wiser you would be
      To play at Indian wars with me!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[78]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2049
        "source_sequence": 287
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-57-05"
    "translation_ja": |-
      だったらいま、夏がいるうちに、
      庭で過ごすこの日々を生かすなら、
      ぼくとインディアンの戦さごっこをするほうが
      どんなにかしこいでしょう！
    "translation_status": "reviewed"
  - "id": "cv-58-heading"

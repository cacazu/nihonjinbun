      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-31-02"
    "translation_ja": |-
      夜、舟に乗りこんで、ぼくは言う、
      陸にいるみんな、おやすみなさい。
      目を閉じて舟を出せば
      もうなんにも見えない、聞こえない。
    "translation_status": "reviewed"

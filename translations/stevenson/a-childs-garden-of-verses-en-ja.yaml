        "original_unit_id": "cv-04-01"
    "translation_ja": |-
      どの晩も、夜じゅうずっと、
      かあさんが灯を消すと、
      みんなが行進していくのが見える、
      昼間みたいにはっきり、目の前に。
    "translation_status": "reviewed"
  - "id": "cv-04-02"
    "section_id": "cv-04"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Armies and emperors and kings,
      All carrying different kinds of things,
      And marching in so grand a way,
      You never saw the like by day.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[14]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 617
        "source_sequence": 16
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-04-02"
    "translation_ja": |-
      軍隊が、皇帝たちが、王さまたちが、
      てんでに違うものを持って、
      それはそれは堂々と歩いていく。
      昼のあいだにゃ見られないほど。
    "translation_status": "reviewed"
  - "id": "cv-04-03"
    "section_id": "cv-04"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      So fine a show was never seen,
      At the great circus on the green;
      For every kind of beast and man
      Is marching in that caravan.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[14]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"

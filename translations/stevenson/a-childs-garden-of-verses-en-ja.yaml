        "original_unit_id": "cv-27-heading"
    "translation_ja": "XXVII　いい子と悪い子"
    "translation_status": "reviewed"
  - "id": "cv-27-01"
    "section_id": "cv-27"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      CHILDREN, you are very little,
      And your bones are very brittle;
      If you would grow great and stately,
      You must try to walk sedately.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[41]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1105
        "source_sequence": 102
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-27-01"
    "translation_ja": |-
      子どもたち、あなたたちはちびさんで、
      骨もとても折れやすい。
      大きくりっぱに育ちたいなら
      おちついて歩くよう努めなさい。
    "translation_status": "reviewed"
  - "id": "cv-27-02"
    "section_id": "cv-27"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      You must still be bright and quiet,
      And content with simple diet;
      And remain, through all bewild'ring,
      Innocent and honest children.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[41]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1105
        "source_sequence": 103
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-27-02"
    "translation_ja": |-
      いつも朗らかに、おとなしく、
      質素な食事で満足し、
      どんなに戸惑うことがあっても
      無邪気で正直な子でいなさい。
    "translation_status": "reviewed"
  - "id": "cv-27-03"
    "section_id": "cv-27"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Happy hearts and happy faces,
      Happy play in grassy places—
      That was how, in ancient ages,
      Children grew to kings and sages.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[41]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1105
        "source_sequence": 104
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-27-03"
    "translation_ja": |-
      晴れやかな心に晴れやかな顔、
      草の生えたところで楽しく遊ぶ。
      大昔はそうして子どもたちが
      王さまや賢人になったのです。
    "translation_status": "reviewed"
  - "id": "cv-27-04"
    "section_id": "cv-27"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      But the unkind and the unruly,
      And the sort who eat unduly,
      They must never hope for glory—
      Theirs is quite a different story!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[41]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1105
        "source_sequence": 105
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-27-04"
    "translation_ja": |-
      けれども不親切で手に負えない子、
      むやみに食べすぎるような子は、
      栄光を望んではなりません。
      こちらはまるで別の話！
    "translation_status": "reviewed"
  - "id": "cv-27-05"
    "section_id": "cv-27"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Cruel children, crying babies,
      All grow up as geese and gabies,
      Hated, as their age increases,
      By their nephews and their nieces.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[41]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1105
        "source_sequence": 106
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-27-05"
    "translation_ja": |-
      むごい子や泣き虫の赤ちゃんは
      育てばそろって、おばかさんのまぬけさん。
      年をとればとるほどに
      おいやめいにも嫌われる。
    "translation_status": "reviewed"

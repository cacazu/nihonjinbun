        "original_unit_id": "cv-31-01"
    "translation_ja": |-
      ぼくのベッドは小さな舟。
      乗りこむときはばあやが手を貸す。
      ぼくに船乗りの上着を着せ、きゅっと締めて
      暗いなかへ送り出す。

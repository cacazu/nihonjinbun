        "source_sequence": 171
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-41-08"
    "translation_ja": |-
      小さな心臓が太鼓のように鳴りだす。
      お化けの息がぼくの髪にかかる。
      ろうそくを囲んで曲がりくねった影が集まり
      階段を一段ずつ行進していく。
    "translation_status": "reviewed"

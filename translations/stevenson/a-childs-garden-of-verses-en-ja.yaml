  - "id": "cv-38-01"
    "section_id": "cv-38"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      LATE lies the wintry sun a-bed,
      A frosty, fiery sleepy-head;
      Blinks but an hour or two; and then,
      A blood-red orange, sets again.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[53]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1346
        "source_sequence": 148
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-38-01"
    "translation_ja": |-
      冬のお日さまは朝寝坊、
      霜のように冷たく、火のように赤い寝ぼすけだ。
      一時間か二時間まばたきしたら、
      血の色のオレンジになり、もう沈む。
    "translation_status": "reviewed"
  - "id": "cv-38-02"
    "section_id": "cv-38"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Before the stars have left the skies,
      At morning in the dark I rise;
      And shivering in my nakedness,
      By the cold candle, bathe and dress.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[53]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1346
        "source_sequence": 149
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-38-02"
    "translation_ja": |-
      お星さまが空を去らないうちに
      朝まだ暗いなか、ぼくは起きる。
      裸でぶるぶる震えつつ、
      寒々したろうそくのそばで体を洗い、服を着る。
    "translation_status": "reviewed"
  - "id": "cv-38-03"
    "section_id": "cv-38"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Close by the jolly fire I sit
      To warm my frozen bones a bit;
      Or with a reindeer-sled, explore
      The colder countries round the door.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[53]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1346
        "source_sequence": 150
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-38-03"
    "translation_ja": |-
      にぎやかな火にぴったり寄って
      こおった骨をすこしあたため、
      あるいはトナカイの橇で探険する、
      戸口のまわりの、もっと寒い国々を。
    "translation_status": "reviewed"
  - "id": "cv-38-04"
    "section_id": "cv-38"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      When to go out, my nurse doth wrap
      Me in my comforter and cap:
      The cold wind burns my face, and blows
      Its frosty pepper up my nose.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[53]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1346
        "source_sequence": 151
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-38-04"
    "translation_ja": |-
      外へ出るとき、ばあやがぼくに
      えり巻きをぐるぐる、帽子をすっぽり。
      冷たい風が顔をひりひり焼き、
      霜のこしょうを鼻に吹きこむ。
    "translation_status": "reviewed"
  - "id": "cv-38-05"
    "section_id": "cv-38"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Black are my steps on silver sod;
      Thick blows my frosty breath abroad;
      And tree and house, and hill and lake,
      Are frosted like a wedding-cake.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[53]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1346
        "source_sequence": 152
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-38-05"
    "translation_ja": |-
      銀いろの芝に、足あとは黒。
      霜のような吐く息が濃くひろがる。
      木も家も、丘も湖も、
      婚礼のケーキみたいに真っ白な砂糖がけ。
    "translation_status": "reviewed"

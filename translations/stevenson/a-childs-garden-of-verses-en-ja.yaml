        "original_unit_id": "cv-62-01"
    "translation_ja": |-
      大人だけが頭をおろす
      巨大な寝台のあった、赤い部屋。
      あなたとぼくとがしばらくのあいだ
      並んで眠った、小さな部屋。
      うぶな求婚者のぼくがあなたに
      折り目正しく結婚を申しこんだっけ。
      何より好きだった広い昼の子ども部屋、
      壁には絵が貼ってあり
      日よけには葉の模様。
      あそこで目覚めるのは楽しかった、
      葉の茂る庭が風に揺れ
      さやさや鳴るのを聞きながら。
      寝床で横になっているのも楽しかった、
      頭の上の絵を眺めて。
      セヴァストポリをめぐる戦い、
      城壁にずらりと歯をむく大砲、
      決死のはしご攻め、
      波へ突っこむ船、めえめえ鳴く羊、
      くるぶしまで水につかって
      笑いながら渡る、楽しげな子どもたち。
      そうしたものは何もかも、きれいに消えて、
      昔の牧師館は今ではもう違う。
      よそよそしい顔になり、
      知らない一家を住まわせている。
      川は水車小屋から水車小屋へ、いまも
      ぼくらが子どもだった庭を過ぎて流れてゆく。
      でも、ああ、ぼくら子どもは二度と
      水ぎわの戸口からそれを眺めはしない！
      イチイの木の下には（木はまだそこにある）
      ぼくらの声のまぼろしが空にただよう、
      いまも遊んでいるように。
      ぼくにはその呼び声が聞こえる。
      「バビロンまでは、どのくらい？」

    "translation_status": "reviewed"
  - "id": "cv-53-01"
    "section_id": "cv-53"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      ALL the names I know from nurse:
      Gardener's garters, Shepherd's purse,
      Bachelor's buttons, Lady's smock,
      And the lady Hollyhock.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[74]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1928
        "source_sequence": 258
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-53-01"
    "translation_ja": |-
      花の名はみんな、ばあやにきいた。
      庭師の靴下留め、羊飼いの財布、
      独身男のボタン、お嬢さまの肌着、
      それにタチアオイのご婦人。
    "translation_status": "reviewed"
  - "id": "cv-53-02"
    "section_id": "cv-53"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Fairy places, fairy things,
      Fairy woods where the wild bee wings,
      Tiny trees for tiny dames—
      These must all be fairy names!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[74]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1928
        "source_sequence": 259
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-53-02"
    "translation_ja": |-
      妖精の場所、妖精のもの、
      野の蜜蜂が飛ぶ妖精の森、
      小さな奥さまの、小さな木。
      きっとみんな妖精の名前だ！
    "translation_status": "reviewed"
  - "id": "cv-53-03"
    "section_id": "cv-53"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Tiny woods below whose boughs
      Shady fairies weave a house;
      Tiny tree-tops, rose or thyme,
      Where the braver fairies climb!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[74]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1928
        "source_sequence": 260
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-53-03"
    "translation_ja": |-
      小さな森、その枝の下で
      木かげの妖精たちが家を編む。
      ばらやタイムの小さな梢、
      勇ましい妖精はそこまで登る！
    "translation_status": "reviewed"
  - "id": "cv-53-04"
    "section_id": "cv-53"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Fair are grown-up people's trees,
      But the fairest woods are these;
      Where, if I were not so tall,
      I should live for good and all.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[74]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1928
        "source_sequence": 261
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-53-04"
    "translation_ja": |-
      大人たちの木もきれい。
      でもいちばんきれいな森はここ。
      ぼくがこんなに背が高くなければ
      ずうっと、ここで暮らすのに。
    "translation_status": "reviewed"
  - "id": "cv-54-heading"
    "section_id": "cv-54"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      IV
      SUMMER SUN
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[61]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1950
        "source_sequence": 262
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[58]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1951
        "source_sequence": 262
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-54-heading"
    "translation_ja": "IV　夏のお日さま"
    "translation_status": "reviewed"
  - "id": "cv-54-01"
    "section_id": "cv-54"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      GREAT is the sun, and wide he goes
      Through empty heaven without repose;
      And in the blue and glowing days
      More thick than rain he showers his rays
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[75]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1952
        "source_sequence": 263
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-54-01"
    "translation_ja": |-
      お日さまは大きく、遠くまで行く、
      がらんとひろい空をひと休みもせず。
      真っ青にかがやく日には
      雨よりもぎっしり光を降らす。
    "translation_status": "reviewed"
  - "id": "cv-54-02"
    "section_id": "cv-54"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Though closer still the blinds we pull
      To keep the shady parlour cool,
      Yet he will find a chink or two
      To slip his golden fingers through.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[75]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1952
        "source_sequence": 264
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-54-02"
    "translation_ja": |-
      かげった客間を涼しくするのに
      いくら日よけをぴっちり閉めても、
      お日さまはすきまのひとつふたつを見つけて
      金の指をするりと入れる。
    "translation_status": "reviewed"
  - "id": "cv-54-03"
    "section_id": "cv-54"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The dusty attic spider-clad
      He, through the keyhole, maketh glad;
      And through the broken edge of tiles,
      Into the laddered hayloft smiles.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[75]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1952
        "source_sequence": 265
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-54-03"
    "translation_ja": |-
      ほこりとくもの巣だらけの屋根裏を
      鍵穴ごしに楽しく照らし、
      瓦の欠け目をのぞきこんで
      はしごのかかった干し草納屋にほほえむ。
    "translation_status": "reviewed"
  - "id": "cv-54-04"
    "section_id": "cv-54"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Meantime his golden face around
      He bares to all the garden ground,
      And sheds a warm and glittering look
      Among the ivy's inmost nook.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[75]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1952
        "source_sequence": 266
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-54-04"
    "translation_ja": |-
      そのあいだにも金いろの顔を
      庭のどこにだって見せて、
      つたの茂みのいちばん奥まで
      あたたかくきらきらしたまなざしを注ぐ。
    "translation_status": "reviewed"
  - "id": "cv-54-05"
    "section_id": "cv-54"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Above the hills, along the blue,
      Round the bright air with footing true,
      To please the child, to paint the rose,
      The gardener of the World, he goes.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[75]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1952
        "source_sequence": 267
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-54-05"
    "translation_ja": |-
      丘を越え、青空をたどり、
      あかるい空を確かな足どりで回り、
      子どもを喜ばせ、ばらに色を塗るために、
      世界の庭師、お日さまは行く。
    "translation_status": "reviewed"
  - "id": "cv-55-heading"
    "section_id": "cv-55"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      V
      THE DUMB SOLDIER
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[62]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1979
        "source_sequence": 268
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[59]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1980
        "source_sequence": 268
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-55-heading"
    "translation_ja": "V　ものを言わない兵隊"
    "translation_status": "reviewed"
  - "id": "cv-55-01"
    "section_id": "cv-55"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      WHEN the grass was closely mown,
      Walking on the lawn alone,
      In the turf a hole I found
      And hid a soldier underground.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[76]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1981
        "source_sequence": 269
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-55-01"
    "translation_ja": |-
      草が短く刈られたとき、
      ぼくはひとり芝生を歩き、
      芝土にひとつ穴を見つけて
      地面の下に兵隊を隠した。
    "translation_status": "reviewed"
  - "id": "cv-55-02"
    "section_id": "cv-55"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Spring and daisies came apace;
      Grasses hide my hiding place;
      Grasses run like a green sea
      O'er the lawn up to my knee.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[76]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1981
        "source_sequence": 270
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-55-02"
    "translation_ja": |-
      春とヒナギクがたちまち来た。
      草がぼくの隠し場所を隠す。
      緑の海のように草が波うつ、
      芝生いちめん、ぼくの膝まで。
    "translation_status": "reviewed"
  - "id": "cv-55-03"
    "section_id": "cv-55"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Under grass alone he lies,
      Looking up with leaden eyes,
      Scarlet coat and pointed gun,
      To the stars and to the sun.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[76]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1981
        "source_sequence": 271
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-55-03"
    "translation_ja": |-
      草の下にひとり寝て
      鉛の目で見上げてる。
      緋色の上着、とがった鉄砲、
      見上げる先は星とお日さま。
    "translation_status": "reviewed"
  - "id": "cv-55-04"
    "section_id": "cv-55"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      When the grass is ripe like grain
      When the scythe is stoned again,
      When the lawn is shaven clear,
      Then my hole shall reappear.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[76]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1981
        "source_sequence": 272
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-55-04"
    "translation_ja": |-
      麦のように草が熟し
      大鎌がまた砥石で研がれ、
      芝がすっきり刈られたら
      ぼくの穴がまたあらわれる。
    "translation_status": "reviewed"
  - "id": "cv-55-05"
    "section_id": "cv-55"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I shall find him, never fear,
      I shall find my grenadier;
      But for all that's gone and come,
      I shall find my soldier dumb.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[76]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1981
        "source_sequence": 273
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-55-05"
    "translation_ja": |-
      だいじょうぶ、見つけるとも、
      ぼくの擲弾兵を見つけるさ。
      でもその間に何があったにせよ
      見つけた兵隊は、だんまりだ。
    "translation_status": "reviewed"
  - "id": "cv-55-06"
    "section_id": "cv-55"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      He has lived, a little thing,
      In the grassy woods of spring;
      Done, if he could tell me true,
      Just as I should like to do.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[76]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1981
        "source_sequence": 274
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-55-06"
    "translation_ja": |-
      ちいさな体であいつは暮らした、
      春の草の森の中。
      ほんとうを言えたら話すだろう、
      ぼくがしてみたいことをしたって。
    "translation_status": "reviewed"
  - "id": "cv-55-07"
    "section_id": "cv-55"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      He has seen the starry hours
      And the springing of the flowers;
      And the fairy things that pass
      In the forests of the grass.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[76]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1981
        "source_sequence": 275
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-55-07"
    "translation_ja": |-
      あいつは見た、星ふる夜と
      花がぐんぐん出てくるのを。
      草の森を通り過ぎる
      妖精めいた生きものたちを。
    "translation_status": "reviewed"
  - "id": "cv-55-08"
    "section_id": "cv-55"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      In the silence he has heard
      Talking bee and ladybird,
      And the butterfly has flown
      O'er him as he lay alone.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[76]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1981
        "source_sequence": 276
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-55-08"
    "translation_ja": |-
      しんとしたなかで聞いたんだ、
      蜜蜂とてんとう虫のおしゃべりを。
      ひとり寝ころぶあいつの上を
      ちょうちょがひらりと飛んでいった。
    "translation_status": "reviewed"
  - "id": "cv-55-09"
    "section_id": "cv-55"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Not a word will he disclose,
      Not a word of all he knows.
      I must lay him on the shelf,
      And make up the tale myself.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[76]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1981
        "source_sequence": 277
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-55-09"
    "translation_ja": |-
      ひとことだって明かさない。
      知ってることのひとつもね。
      ぼくはあいつを棚に寝かせて
      自分でお話を作らなくちゃ。
    "translation_status": "reviewed"
  - "id": "cv-56-heading"
    "section_id": "cv-56"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      VI
      AUTUMN FIRES
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[63]"

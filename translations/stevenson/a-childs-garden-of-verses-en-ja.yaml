        "source_sequence": 17
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-04-03"
    "translation_ja": |-
      広場に来る大サーカスだって
      これほどりっぱな見せものはない。
      ありとあらゆるけものや人が
      あの行列を歩いているんだ。
    "translation_status": "reviewed"
  - "id": "cv-04-04"
    "section_id": "cv-04"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      At first they move a little slow,
      But still the faster on they go,
      And still beside them close I keep
      Until we reach the town of Sleep.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[14]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 617
        "source_sequence": 18
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-04-04"
    "translation_ja": |-
      はじめは少しゆっくり進み、
      しだいにどんどん速くなる。
      ぼくもずっとすぐ横を行く、
      眠りの町に着くまで。
    "translation_status": "reviewed"

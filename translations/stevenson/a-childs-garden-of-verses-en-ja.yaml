    "translation_ja": "XXVIII　よその国の子ども"
    "translation_status": "reviewed"
  - "id": "cv-28-01"
    "section_id": "cv-28"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      LITTLE Indian, Sioux or Crow,
      Little frosty Eskimo,
      Little Turk or Japanee,
      O! don't you wish that you were me?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[42]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1134
        "source_sequence": 108
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-28-01"
    "translation_ja": |-
      スー族やクロウ族の小さなインディアン、
      凍てつく国の小さなエスキモー、
      小さなトルコの子、日本の子、
      ねえ、きみたちも、ぼくだったらいいのになって思わない？
    "translation_status": "reviewed"
  - "id": "cv-28-02"
    "section_id": "cv-28"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      You have seen the scarlet trees
      And the lions over seas;
      You have eaten ostrich eggs,
      And turned the turtles off their legs.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[42]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1134
        "source_sequence": 109
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-28-02"
    "translation_ja": |-
      海のむこうのまっ赤な木や
      ライオンをきみたちは見てきた。
      だちょうの卵を食べたことも、
      亀をころんと裏返したこともある。
    "translation_status": "reviewed"
  - "id": "cv-28-03"
    "section_id": "cv-28"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Such a life is very fine,
      But it's not so nice as mine:
      You must often, as you trod,
      Have wearied not to be abroad.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[42]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1134
        "source_sequence": 110
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-28-03"
    "translation_ja": |-
      そんな暮らしもとてもすてき、
      だけどぼくのほどすてきじゃない。
      きみたちだって歩きながら、よく
      よその国へ行けないのが、いやになったろう。
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 35
          "end": 38
          "exact": "not"
      - "side": "translation"
        "kind": "emphasis"
        "span":
          "start": 53
          "end": 57
          "exact": "行けない"
  - "id": "cv-28-04"
    "section_id": "cv-28"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      You have curious things to eat,
      I am fed on proper meat;
      You must dwell beyond the foam,
      But I am safe and live at home.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[42]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1134
        "source_sequence": 111
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-28-04"
    "translation_ja": |-
      きみたちの食べものは変わってて、
      ぼくはちゃんとしたごはんをもらう。
      きみたちが住むのは波のむこう、
      ぼくはおうちで安心して暮らす。
    "translation_status": "reviewed"
  - "id": "cv-28-05"
    "section_id": "cv-28"
    "kind": "verse"
    "origin": "source"

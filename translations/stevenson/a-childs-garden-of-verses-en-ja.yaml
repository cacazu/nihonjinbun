        "original_unit_id": "cv-42-heading"
    "translation_ja": "I　見えない遊び友だち"
    "translation_status": "reviewed"
  - "id": "cv-42-01"
    "section_id": "cv-42"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      WHEN children are playing alone on the green,
      In comes the playmate that never was seen.
      When children are happy and lonely and good,
      The Friend of the Children comes out of the wood.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[60]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1492
        "source_sequence": 179
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-42-01"
    "translation_ja": |-
      子どもが原っぱでひとり遊びをしていると、
      だれも見たことのない遊び友だちがやってくる。
      子どもが楽しそうに、ひとり、いい子にしていると、
      子どもの友が森から出てくる。
    "translation_status": "reviewed"
  - "id": "cv-42-02"
    "section_id": "cv-42"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Nobody heard him and nobody saw,
      His is a picture you never could draw,
      But he's sure to be present, abroad or at home,
      When children are happy and playing alone.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[60]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1492
        "source_sequence": 180
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-42-02"
    "translation_ja": |-
      だれも聞かなかったし、だれも見なかった。
      絵にも決して描けないその姿。
      でも外であろうと、うちであろうと、きっと来ている。
      子どもが楽しくひとり遊びをしているときは。
    "translation_status": "reviewed"
  - "id": "cv-42-03"
    "section_id": "cv-42"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      He lies in the laurels, he runs on the grass,
      He sings when you tinkle the musical glass;
      Whene'er you are happy and cannot tell why,
      The Friend of the Children is sure to be by!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[60]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1492
        "source_sequence": 181
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-42-03"
    "translation_ja": |-
      月桂樹の茂みに寝そべり、芝生の上を走る。
      きみがグラスをちりんと鳴らせば歌う。
      わけもわからずうれしくなるときはいつでも
      子どもの友が、きっとそばにいるよ！
    "translation_status": "reviewed"
  - "id": "cv-42-04"
    "section_id": "cv-42"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      He loves to be little, he hates to be big,
      'Tis he that inhabits the caves that you dig;
      'Tis he when you play with your soldiers of tin
      That sides with the Frenchmen and never can win.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[60]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1492
        "source_sequence": 182
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-42-04"
    "translation_ja": |-
      大きくなるより小さいままが好きなのさ。
      きみが掘ったほら穴に住むのはその子。
      ブリキの兵隊で遊ぶとき
      フランス軍についていつも勝てないのもその子。
    "translation_status": "reviewed"
  - "id": "cv-42-05"
    "section_id": "cv-42"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      'Tis he, when at night you go off to your bed,
      Bids you go to your sleep and not trouble your head;
      For wherever they're lying, in cupboard or shelf,
      'Tis he will take care of your playthings himself!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[60]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1492
        "source_sequence": 183
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-42-05"
    "translation_ja": |-
      夜になってきみが寝に行くとき
      もう眠っていいよ、心配しないで、と言うのもその子。
      戸棚だろうと棚の上だろうと、どこに置いたものも、
      きみのおもちゃは自分で見ていてくれるから！
    "translation_status": "reviewed"

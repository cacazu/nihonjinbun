        "columns": 2
  - "id": "cv-50-02"
    "section_id": "cv-50"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      In that forest to and fro
      I can wander, I can go;
      See the spider and the fly,
      And the ants go marching by
      Carrying parcels with their feet
      Down the green and grassy street.
      I can in the sorrel sit
      Where the ladybird alit.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[69]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1738
        "source_sequence": 227
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-50-02"
    "translation_ja": |-
      その森をあちこち歩く、
      ぶらぶら好きに歩きまわる。
      くもとはえを眺めて、
      通りを行進するありを見る。
      足で小さな荷物を運んで
      緑の草の通りを行く。
      てんとう虫が舞いおりた
      すいばの茂みに腰をおろせる。
    "translation_status": "reviewed"
  - "id": "cv-50-03"
    "section_id": "cv-50"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I can climb the jointed grass;
      And on high
      See the greater swallows pass
      In the sky,
      And the round sun rolling by
      Heeding no such things as I.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[71]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1772
        "source_sequence": 228
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-50-03"
    "translation_ja": |-
      節のある草をよじ登る。
      高いところから
      もっと大きいつばめが
      空を過ぎるのが見える。
      丸い太陽が転がってゆく、
      ぼくなんかにはお構いなし。
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "indent"
        "span":
          "start": 31
          "end": 42
          "exact": "And on high"
        "columns": 2

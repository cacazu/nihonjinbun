        "line_start": 683
        "source_sequence": 31
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-08-04"
    "translation_ja": |-
      もっと高い木があったら
      もっともっと遠くが見える。
      大きくなった川が船にまじって
      そっと海へとすべりこむとこ。
      右へ左へと道がつづいて
      妖精の国へ入っていくとこ。
      そこでは子どもはみんな五時にごはん、
      おもちゃはみんな生きている。
    "translation_status": "reviewed"

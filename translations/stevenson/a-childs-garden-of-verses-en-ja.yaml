  - "id": "cv-41-08"
    "section_id": "cv-41-06-subsection"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Now my little heart goes a-beating like a drum,
      With the breath of the Bogie in my hair;
      And all round the candle the crooked shadows come
      And go marching along up the stair.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[58]"

      XXIX
      THE SUN'S TRAVELS
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[34]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1161
        "source_sequence": 113
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[33]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1162
        "source_sequence": 113
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-29-heading"
    "translation_ja": "XXIX　お日さまの旅"
    "translation_status": "reviewed"
  - "id": "cv-29-01"
    "section_id": "cv-29"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      THE sun is not a-bed, when I
      At night upon my pillow lie;
      Still round the earth his way he takes,
      And morning after morning makes.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[43]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1163
        "source_sequence": 114
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-29-01"
    "translation_ja": |-
      ぼくが夜、枕に
      頭をのせても、お日さまは寝ない。
      地球をめぐる道をなおも進んで
      次から次へと朝をつくる。
    "translation_status": "reviewed"
  - "id": "cv-29-02"
    "section_id": "cv-29"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      While here at home, in shining day,
      We round the sunny garden play,
      Each little Indian sleepy-head
      Is being kissed and put to bed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[43]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1163
        "source_sequence": 115
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-29-02"
    "translation_ja": |-
      ここ、ぼくらのうちでは明るい昼、
      日なたの庭を走りまわるころ、
      インドの眠たい小さい子たちは
      キスされて、寝床に入れてもらってる。
    "translation_status": "reviewed"
  - "id": "cv-29-03"
    "section_id": "cv-29"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      And when at eve I rise from tea,
      Day dawns beyond the Atlantic Sea,
      And all the children in the West
      Are getting up and being dressed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[43]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1163
        "source_sequence": 116
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-29-03"
    "translation_ja": |-
      夕方のお茶をすませてぼくが席を立つと
      大西洋のむこうは夜明け。
      西の国の子どもたちはみんな
      起きて、服を着せてもらってる。
    "translation_status": "reviewed"
  - "id": "cv-30-heading"
    "section_id": "cv-30"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XXX
      THE LAMPLIGHTER
    "source_languages":
      - "en"
    "source_locations":

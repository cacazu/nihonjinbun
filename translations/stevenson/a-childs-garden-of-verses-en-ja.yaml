  - "id": "cv-31-02"
    "section_id": "cv-31"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      At night, I go on board and say
      Good night to all my friends on shore;
      I shut my eyes and sail away
      And see and hear no more.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[45]"

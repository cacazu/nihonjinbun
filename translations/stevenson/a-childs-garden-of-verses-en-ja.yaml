      IV
      PICTURE-BOOKS IN WINTER
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[51]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1586
        "source_sequence": 194
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[49]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1587
        "source_sequence": 194
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-45-heading"
    "translation_ja": "IV　冬の絵本"
    "translation_status": "reviewed"
  - "id": "cv-45-01"
    "section_id": "cv-45"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      SUMMER fading, winter comes—
      Frosty mornings, tingling thumbs,
      Window robins, winter rooks,
      And the picture story-books.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[64]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1588
        "source_sequence": 195
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-45-01"
    "translation_ja": |-
      夏は色あせ、冬が来る。
      霜の朝、じんじんする親指、
      窓べのこまどり、冬のみやまがらす、
      それから、お話の絵本。
    "translation_status": "reviewed"
  - "id": "cv-45-02"
    "section_id": "cv-45"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Water now is turned to stone
      Nurse and I can walk upon;
      Still we find the flowing brooks
      In the picture story-books.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[64]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1588
        "source_sequence": 196
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-45-02"
    "translation_ja": |-
      水はいまや石になり
      ばあやとぼくが上を歩ける。
      それでも流れる小川はあるよ、
      お話の絵本の中に。
    "translation_status": "reviewed"
  - "id": "cv-45-03"
    "section_id": "cv-45"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      All the pretty things put by,
      Wait upon the children's eye,
      Sheep and shepherds, trees and crooks,
      In the picture story-books.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[64]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1588
        "source_sequence": 197
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-45-03"
    "translation_ja": |-
      しまってあったきれいなものが
      子どもが見に来るのを待ってる。
      羊、羊飼い、木立に曲がり杖、
      お話の絵本の中に。
    "translation_status": "reviewed"
  - "id": "cv-45-04"
    "section_id": "cv-45"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      We may see how all things are,
      Seas and cities, near and far,
      And the flying fairies' looks,
      In the picture story-books.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[64]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1588
        "source_sequence": 198
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-45-04"
    "translation_ja": |-
      いろんなものの姿が見える、
      近くや遠くの海と町、
      飛んでる妖精の顔だって、
      お話の絵本の中に。
    "translation_status": "reviewed"
  - "id": "cv-45-05"
    "section_id": "cv-45"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      How am I to sing your praise,
      Happy chimney-corner days,
      Sitting safe in nursery nooks,
      Reading picture story-books?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[64]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1588
        "source_sequence": 199
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-45-05"
    "translation_ja": |-
      どう歌えばいいだろう、
      暖炉のわきの幸せな日々を。
      子ども部屋のすみで、安心して座り、
      お話の絵本を読む日々を。
    "translation_status": "reviewed"
  - "id": "cv-46-heading"
    "section_id": "cv-46"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      V
      MY TREASURES
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[52]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1615
        "source_sequence": 200
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[50]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1616
        "source_sequence": 200
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-46-heading"
    "translation_ja": "V　ぼくの宝もの"
    "translation_status": "reviewed"
  - "id": "cv-46-01"
    "section_id": "cv-46"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      THESE nuts, that I keep in the back of the nest
      Where all my lead soldiers are lying at rest,
      Were gathered in autumn by nursie and me
      In a wood with a well by the side of the sea.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[65]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1617
        "source_sequence": 201
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-46-01"
    "translation_ja": |-
      ぼくの鉛の兵隊たちが休んでいる
      巣の奥にしまってある、この木の実。
      秋にばあやとふたりで拾った、
      井戸のある、海べの森で。
    "translation_status": "reviewed"
  - "id": "cv-46-02"
    "section_id": "cv-46"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      This whistle we made (and how clearly it sounds!)
      By the side of a field at the end of the grounds.
      Of a branch of a plane, with a knife of my own,
      It was nursie who made it, and nursie alone!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[65]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1617
        "source_sequence": 202
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-46-02"
    "translation_ja": |-
      この笛はぼくたちが作った（なんて澄んだ音！）、
      屋敷のはずれの畑のかたわらで。
      すずかけの木の枝と、ぼく自身のナイフとで。
      作ったのはばあやだ、ほんとはばあやひとりなんだ！
    "translation_status": "reviewed"
  - "id": "cv-46-03"
    "section_id": "cv-46"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The stone, with the white and the yellow and grey,
      We discovered I cannot tell how far away;
      And I carried it back although weary and cold,
      For though father denies it, I'm sure it is gold.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[65]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1617
        "source_sequence": 203
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-46-03"
    "translation_ja": |-
      この白と黄色と灰色の石は
      どんなに遠くだったか、とても言えない場所で見つけた。
      くたびれて寒かったけど、ぼくが持って帰った。
      とうさんはちがうと言うけど、これはきっと金だから。
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 79
          "end": 82
          "exact": "how"
      - "side": "translation"
        "kind": "emphasis"
        "span":
          "start": 13
          "end": 17
          "exact": "どんなに"
  - "id": "cv-46-04"
    "section_id": "cv-46"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      But of all of my treasures the last is the king,
      For there's very few children possess such a thing;
      And that is a chisel, both handle and blade,
      Which a man who was really a carpenter made.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[65]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1617
        "source_sequence": 204
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-46-04"
    "translation_ja": |-
      でも宝もののなかの王さまは、最後のこれ。
      こんなものを持ってる子はめったにいない。
      それは一本ののみ、柄も刃もちゃんとあって、
      ほんものの大工さんがこしらえたのだ。
    "translation_status": "reviewed"
  - "id": "cv-47-heading"
    "section_id": "cv-47"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      VI
      BLOCK CITY
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[53]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1639
        "source_sequence": 205
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[51]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1640
        "source_sequence": 205
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-47-heading"
    "translation_ja": "VI　積み木の町"
    "translation_status": "reviewed"
  - "id": "cv-47-01"
    "section_id": "cv-47"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      WHAT are you able to build with your blocks?
      Castles and palaces, temples and docks.
      Rain may keep raining, and others go roam,
      But I can be happy and building at home.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[66]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1641
        "source_sequence": 206
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-47-01"
    "translation_ja": |-
      積み木で何を建てられる？
      お城に宮殿、お寺に船着き場。
      雨は好きなだけ降れ、ほかの子は歩きまわればいい。
      ぼくはうちで楽しく町を建てられる。
    "translation_status": "reviewed"
  - "id": "cv-47-02"
    "section_id": "cv-47"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Let the sofa be mountains, the carpet be sea,
      There I'll establish a city for me:
      A kirk and a mill and a palace beside,
      And a harbour as well where my vessels may ride.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[66]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1641
        "source_sequence": 207
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-47-02"
    "translation_ja": |-
      長椅子は山に、じゅうたんは海になあれ。
      そこにぼくの町をつくろう。
      教会と水車小屋と、その横に宮殿、
      ぼくの船が浮かぶ港もつけて。
    "translation_status": "reviewed"
  - "id": "cv-47-03"
    "section_id": "cv-47"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Great is the palace with pillar and wall,
      A sort of a tower on the top of it all,
      And steps coming down in an orderly way
      To where my toy vessels lie safe in the bay.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[66]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1641
        "source_sequence": 208
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-47-03"
    "translation_ja": |-
      大きな宮殿、柱に城壁、
      いちばん上には塔のようなもの。
      階段が一段ずつきちんとおりて
      湾にはおもちゃの船が無事に浮かぶ。
    "translation_status": "reviewed"
  - "id": "cv-47-04"
    "section_id": "cv-47"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      This one is sailing and that one is moored:
      Hark to the song of the sailors on board!
      And see on the steps of my palace, the kings
      Coming and going with presents and things!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[66]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1641
        "source_sequence": 209
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-47-04"
    "translation_ja": |-
      こっちの船は帆走中、あっちはつないである。
      ほら、船乗りたちの歌が聞こえる！
      ほら、ぼくの宮殿の階段を、王さまたちが
      贈りものやら何やら持って、行ったり来たり！
    "translation_status": "reviewed"
  - "id": "cv-47-05"
    "section_id": "cv-47"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Now I have done with it, down let it go!
      All in a moment the town is laid low.
      Block upon block lying scattered and free,
      What is there left of my town by the sea?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[66]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1641
        "source_sequence": 210
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-47-05"
    "translation_ja": |-
      もう遊んだ、さあこわれてしまえ！
      たちまち町はぺしゃんこになる。
      積み木の山がばらばら散らばり、
      海べのぼくの町は、何が残った？
    "translation_status": "reviewed"
  - "id": "cv-47-06"
    "section_id": "cv-47"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Yet as I saw it, I see it again,
      The kirk and the palace, the ships and the men,
      And as long as I live and where'er I may be,
      I'll always remember my town by the sea.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[66]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1641
        "source_sequence": 211
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-47-06"
    "translation_ja": |-
      だけど見えてたとおり、また見えるよ、
      教会も宮殿も、船も人たちも。
      生きているかぎり、どこにいようと
      海べのぼくの町はずっと覚えてる。
    "translation_status": "reviewed"
  - "id": "cv-48-heading"
    "section_id": "cv-48"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      VII
      THE LAND OF STORY-BOOKS
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[54]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1673
        "source_sequence": 212
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[52]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1674
        "source_sequence": 212
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-48-heading"
    "translation_ja": "VII　物語の本の国"
    "translation_status": "reviewed"
  - "id": "cv-48-01"
    "section_id": "cv-48"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      AT evening when the lamp is lit,
      Around the fire my parents sit;
      They sit at home and talk and sing,
      And do not play at anything.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[67]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1675
        "source_sequence": 213
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-48-01"
    "translation_ja": |-
      晩にランプがともるころ
      父と母は火を囲む。
      うちに座って、お話や歌、
      なあんにも遊びはしないんだ。
    "translation_status": "reviewed"
  - "id": "cv-48-02"
    "section_id": "cv-48"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Now, with my little gun, I crawl
      All in the dark along the wall,
      And follow round the forest track
      Away behind the sofa back.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[67]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1675
        "source_sequence": 214
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-48-02"
    "translation_ja": |-
      さて、ぼくはちいさな鉄砲を手に、
      まっくらな壁ぎわをそっとはって、
      ぐるっと森の小道をたどり、
      長椅子のずうっと向こう側へ。
    "translation_status": "reviewed"
  - "id": "cv-48-03"
    "section_id": "cv-48"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      There, in the night, where none can spy,
      All in my hunter's camp I lie,
      And play at books that I have read
      Till it is time to go to bed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[67]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1675
        "source_sequence": 215
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-48-03"
    "translation_ja": |-
      そこなら夜は、だれにも見えない。
      狩人の陣地に寝そべって
      読んだ本のお話ごっこ、
      寝る時間が来るまでずっと。
    "translation_status": "reviewed"
  - "id": "cv-48-04"
    "section_id": "cv-48"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      These are the hills, these are the woods,
      These are my starry solitudes;
      And there the river by whose brink
      The roaring lions come to drink.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[67]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1675
        "source_sequence": 216
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-48-04"
    "translation_ja": |-
      ここが丘、ここが森、
      ここは星降る、ぼくだけの荒れ野。
      あそこが川で、そのほとりへ
      吠えるライオンが水を飲みに来る。
    "translation_status": "reviewed"
  - "id": "cv-48-05"
    "section_id": "cv-48"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I see the others far away
      As if in firelit camp they lay,
      And I, like to an Indian scout,
      Around their party prowled about.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[67]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1675
        "source_sequence": 217
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-48-05"
    "translation_ja": |-
      はるかかなたに家族が見える、
      野営の火にあたっているようだ。
      ぼくはインディアンの斥候のように
      その一行のまわりを忍び歩く。
    "translation_status": "reviewed"
  - "id": "cv-48-06"
    "section_id": "cv-48"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      So, when my nurse comes in for me,
      Home I return across the sea,
      And go to bed with backward looks
      At my dear land of Story-books.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[67]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1675
        "source_sequence": 218
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-48-06"
    "translation_ja": |-
      ばあやが迎えに入ってくると
      ぼくは海を渡ってうちに戻る。
      寝床へ行くよ、何度も振り返って、
      大好きな物語の本の国を見ながら。
    "translation_status": "reviewed"
  - "id": "cv-49-heading"
    "section_id": "cv-49"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      VIII
      ARMIES IN THE FIRE
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[55]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1707
        "source_sequence": 219
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[53]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1708
        "source_sequence": 219
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-49-heading"
    "translation_ja": "VIII　暖炉の中の軍隊"
    "translation_status": "reviewed"
  - "id": "cv-49-01"
    "section_id": "cv-49"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      THE lamps now glitter down the street;
      Faintly sound the falling feet;
      And the blue even slowly falls
      About the garden trees and walls.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[68]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1709
        "source_sequence": 220
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-49-01"
    "translation_ja": |-
      いま通りの奥まで灯がまたたき、
      人の足音がかすかに響く。
      青い夕暮れがゆっくりおりて
      庭の木立と塀を包む。
    "translation_status": "reviewed"
  - "id": "cv-49-02"
    "section_id": "cv-49"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Now in the falling of the gloom
      The red fire paints the empty room:
      And warmly on the roof it looks,
      And flickers on the backs of books.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[68]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1709
        "source_sequence": 221
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-49-02"
    "translation_ja": |-
      いま薄闇がおりると、赤い火は
      だれもいない部屋に色を塗る。
      天井をあたたかく照らし
      本の背でちらちらゆれる。
    "translation_status": "reviewed"
  - "id": "cv-49-03"
    "section_id": "cv-49"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Armies march by tower and spire
      Of cities blazing, in the fire;—
      Till as I gaze with staring eyes,
      The armies fade, the lustre dies.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[68]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1709
        "source_sequence": 222
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-49-03"
    "translation_ja": |-
      火の中には燃えさかる都、その塔や尖塔の
      かたわらをいくつもの軍隊が進む。
      目を見張って眺めているうちに
      軍隊はうすれ、光も死ぬ。
    "translation_status": "reviewed"
  - "id": "cv-49-04"
    "section_id": "cv-49"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Then once again the glow returns;
      Again the phantom city burns;
      And down the red-hot valley, lo!
      The phantom armies marching go!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[68]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1709
        "source_sequence": 223
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-49-04"
    "translation_ja": |-
      するとまた火が照り返し、
      まぼろしの都がまた燃える。
      赤熱した谷をくだって、ほら、
      まぼろしの軍隊が行進していく！
    "translation_status": "reviewed"
  - "id": "cv-49-05"
    "section_id": "cv-49"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Blinking embers, tell me true
      Where are those armies marching to,
      And what the burning city is
      That crumbles in your furnaces!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[68]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1709
        "source_sequence": 224
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-49-05"
    "translation_ja": |-
      まばたきするおき火よ、ほんとを教えて。
      あの軍隊はどこへ行くの、
      きみらの炉の中で崩れ落ちる
      あの燃える都は、何ていうの！
    "translation_status": "reviewed"
  - "id": "cv-50-heading"
    "section_id": "cv-50"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      IX
      THE LITTLE LAND
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[56]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1736
        "source_sequence": 225
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[54]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1737
        "source_sequence": 225
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-50-heading"
    "translation_ja": "IX　小さな国"
    "translation_status": "reviewed"
  - "id": "cv-50-01"
    "section_id": "cv-50"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      WHEN at home alone I sit
      And am very tired of it,
      I have just to shut my eyes
      To go sailing through the skies—
      To go sailing far away
      To the pleasant Land of Play;
      To the fairy land afar
      Where the Little People are;
      Where the clover-tops are trees,
      And the rain-pools are the seas,
      And the leaves like little ships
      Sail about on tiny trips;
      And above the daisy tree
      Through the grasses,
      High o'erhead the Bumble Bee
      Hums and passes.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[69]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1738
        "source_sequence": 226
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-50-01"
    "translation_ja": |-
      うちでひとり座っていて
      もうすっかり飽きたとき、
      ぼくはただ目を閉じればいい。
      空をわたって舟で行ける。
      はるか遠くへ舟で行ける、
      楽しい遊びの国へ、
      はるか遠くのおとぎの国、
      小さい人たちが住むところへ。
      クローバーの穂先は木で、
      雨の水たまりは大海で、
      葉っぱの小舟は
      ちょっとそこまで舟旅に出る。
      ヒナギクの木よりなお高く
      草のあいだをくぐって、
      はるか頭上をマルハナバチが
      ぶうんと鳴って飛び過ぎる。
    "translation_status": "reviewed"

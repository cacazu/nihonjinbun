      さあ、おけいこの文字が読めたなら、本を置いて遊びに行こう。
      モントレーの浜べで貝がらや海藻を探し、
      風の運ぶ砂に埋もれた、大きな鯨の骨を眺め、
      ちっちゃなシギたちと、巨大な太平洋の波を眺めておいで。
    "translation_status": "reviewed"

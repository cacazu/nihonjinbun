  - "id": "cv-40-01"
    "section_id": "cv-40"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      THE coach is at the door at last;
      The eager children, mounting fast
      And kissing hands, in chorus sing:
      Good-bye, good-bye, to everything!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[56]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1406
        "source_sequence": 159
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-40-01"
    "translation_ja": |-
      とうとう馬車が戸口に来た。
      心はやる子どもらが、さっと乗り、
      投げキスしながら声を合わせる。
      さようなら、さようなら、なにもかも！
    "translation_status": "reviewed"
  - "id": "cv-40-02"
    "section_id": "cv-40"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      To house and garden, field and lawn,
      The meadow-gates we swang upon,
      To pump and stable, tree and swing,
      Good-bye, good-bye, to everything!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[56]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1406
        "source_sequence": 160
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-40-02"
    "translation_ja": |-
      家にも庭にも、畑にも芝にも、
      乗っかってゆすった牧場の門にも、
      ポンプにも馬屋にも木にもぶらんこにも、
      さようなら、さようなら、なにもかも！
    "translation_status": "reviewed"
  - "id": "cv-40-03"
    "section_id": "cv-40"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      And fare you well for evermore,
      O ladder at the hayloft door,
      O hayloft where the cobwebs cling,
      Good-bye, good-bye, to everything!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[56]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1406
        "source_sequence": 161
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-40-03"
    "translation_ja": |-
      さようなら、いついつまでも、
      干し草納屋の二階の戸口のはしごよ、
      くもの巣の張りついた干し草納屋よ。
      さようなら、さようなら、なにもかも！
    "translation_status": "reviewed"
  - "id": "cv-40-04"
    "section_id": "cv-40"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Crack goes the whip, and off we go;
      The trees and houses smaller grow;
      Last, round the woody turn we swing:
      Good-bye, good-bye, to everything!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[56]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1406
        "source_sequence": 162
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-40-04"
    "translation_ja": |-
      むちがぴしり、さあ出発。
      木立も家も小さくなる。
      最後に、林の曲がり角をぐるっと回る。
      さようなら、さようなら、なにもかも！
    "translation_status": "reviewed"

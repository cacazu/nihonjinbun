          "exact": "空を過ぎるのが見える。"
        "columns": 2
  - "id": "cv-50-04"
    "section_id": "cv-50"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Through that forest I can pass
      Till, as in a looking-glass,
      Humming fly and daisy tree
      And my tiny self I see,
      Painted very clear and neat
      On the rain-pool at my feet.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[71]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1772
        "source_sequence": 229
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-50-04"
    "translation_ja": |-
      その森を抜けていけば
      やがて、鏡に映ったように、
      羽音を立てるはえもヒナギクの木も
      ちっちゃなぼく自身も見える。
      足もとの雨の水たまりに
      すっきりくっきり描き出されて。
    "translation_status": "reviewed"
  - "id": "cv-50-05"
    "section_id": "cv-50"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Should a leaflet come to land
      Drifting near to where I stand,
      Straight I'll board that tiny boat
      Round the rain-pool sea to float.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[71]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1772
        "source_sequence": 230
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-50-05"
    "translation_ja": |-
      立っているぼくのすぐそばに
      一枚の小さな葉が漂着したら
      すぐそのちっちゃな舟に乗り、
      雨の水たまりの海をまわろう。
    "translation_status": "reviewed"
  - "id": "cv-50-06"
    "section_id": "cv-50"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Little thoughtful creatures sit
      On the grassy coasts of it;
      Little things with lovely eyes
      See me sailing with surprise.
      Some are clad in armour green—
      (These have sure to battle been!)—
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[71]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1772
        "source_sequence": 231
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-50-06"
    "translation_ja": |-
      思いふかげな小さな生きものが
      草の浜辺に腰をおろす。
      かわいい目のちっちゃなものたちが
      舟を操るぼくをびっくりして眺める。
      緑のよろいを着たのもいる。
      （きっと戦さをしてきたんだ！）
    "translation_status": "reviewed"
  - "id": "cv-50-07"
    "section_id": "cv-50"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Some are pied with ev'ry hue,
      Black and crimson, gold and blue;
      Some have wings and swift are gone;—
      But they all look kindly on.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[71]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1772
        "source_sequence": 232
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-50-07"
    "translation_ja": |-
      黒と深紅と金と青、
      ありとあらゆる色がまだらに入ったのもいる。
      羽のあるのは、さっと飛び去る。
      でもみんな親しげに見てくれる。
    "translation_status": "reviewed"
  - "id": "cv-50-08"
    "section_id": "cv-50"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      When my eyes I once again
      Open, and see all things plain:
      High bare walls, great bare floor;
      Great big knobs on drawer and door;
      Great big people perched on chairs,
      Stitching tucks and mending tears,
      Each a hill that I could climb,
      And talking nonsense all the time—
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[71]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1772
        "source_sequence": 233
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-50-08"
    "translation_ja": |-
      それからもう一度、目を
      開けると、なんでもはっきり見える。
      高いがらんとした壁、広いがらんとした床、
      引き出しや扉にはばかでかいつまみ、
      椅子にちょこんと乗ったばかでかい大人、
      ひだを縫い、ほころびを繕う。
      ひとりひとりが、ぼくも登れそうな丘で
      しじゅう、つまらないことをしゃべってる。
    "translation_status": "reviewed"
  - "id": "cv-50-09"
    "section_id": "cv-50"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      O dear me,
      That I could be
      A sailor on the rain-pool sea,
      A climber in the clover tree,
      And just come back, a sleepy-head,
      Late at night to go to bed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[71]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1772
        "source_sequence": 234
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-50-09"
    "translation_ja": |-
      ああ、どうか、
      こうなれないかな、
      雨の水たまりの海の船乗り、

    "translation_status": "reviewed"
  - "id": "cv-58-01"
    "section_id": "cv-58"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      DEAR Uncle Jim, this garden ground
      That now you smoke your pipe around,
      Has seen immortal actions done
      And valiant battles lost and won.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[79]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2078
        "source_sequence": 289
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-58-01"
    "translation_ja": |-
      ジムおじさん、この庭はね、
      いまおじさんがパイプをふかして歩くこの庭は、
      いつまでも語られる手柄が立つのも
      勇ましい戦の勝ち負けも見たんだよ。
    "translation_status": "reviewed"
  - "id": "cv-58-02"
    "section_id": "cv-58"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Here we had best on tip-toe tread,
      While I for safety march ahead,
      For this is that enchanted ground
      Where all who loiter slumber sound.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[79]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2078
        "source_sequence": 290
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-58-02"
    "translation_ja": |-
      ここではつま先で歩くほうがいい。
      用心のために、ぼくが先に立とう。
      ここが、あの魔法のかかった地面、
      ぐずぐずしてると、だれもがぐっすり眠っちゃう。
    "translation_status": "reviewed"
  - "id": "cv-58-03"
    "section_id": "cv-58"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Here is the sea, here is the sand,
      Here is simple Shepherd's Land,
      Here are the fairy hollyhocks,
      And there are Ali Baba's rocks.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[79]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2078
        "source_sequence": 291
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-58-03"
    "translation_ja": |-
      ここは海、ここは砂浜、
      ここは質朴な羊飼いの国、
      これが妖精のタチアオイ、
      あれがアリババの岩だ。
    "translation_status": "reviewed"
  - "id": "cv-58-04"
    "section_id": "cv-58"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      But yonder, see! apart and high,
      Frozen Siberia lies; where I,
      With Robert Bruce and William Tell,
      Was bound by an enchanter's spell.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[79]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2078
        "source_sequence": 292
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-58-04"
    "translation_ja": |-
      でも、ほら、あっちの離れた高みには
      氷のシベリア。あそこでぼくは
      ロバート・ブルースやウィリアム・テルと
      魔法使いの術に縛られた。
    "translation_status": "reviewed"
  - "id": "cv-58-05"
    "section_id": "cv-58"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      There, then, awhile in chains we lay,
      In wintry dungeons, far from day;
      But ris'n at length, with might and main,
      Our iron fetters burst in twain.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[79]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2078
        "source_sequence": 293
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-58-05"
    "translation_ja": |-
      そこにしばらく鎖につながれていた、
      日の光から遠い、凍てつく牢で。
      だけどとうとう立ち上がり、力に力をこめて
      鉄の足かせをふたつにちぎった。
    "translation_status": "reviewed"
  - "id": "cv-58-06"
    "section_id": "cv-58"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Then all the horns were blown in town;
      And to the ramparts clanging down,
      All the giants leaped to horse
      And charged behind us through the gorse.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[79]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2078
        "source_sequence": 294
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-58-06"
    "translation_ja": |-
      すると町じゅうの角笛が鳴り、
      がちゃがちゃ城壁にかけおりた
      巨人たちはみんな馬に飛び乗って
      ハリエニシダを分け、突進して追ってきた。
    "translation_status": "reviewed"
  - "id": "cv-58-07"
    "section_id": "cv-58"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      On we rode, the others and I,
      Over the mountains blue, and by
      The Silver River, the sounding sea,
      And the robber woods of Tartary.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[79]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2078
        "source_sequence": 295
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-58-07"
    "translation_ja": |-
      ぼくらは馬を飛ばしたよ、
      青い山々を越え、
      〈銀の川〉や、とどろく海や、
      タタールの盗賊の森を過ぎて。
    "translation_status": "reviewed"
  - "id": "cv-58-08"
    "section_id": "cv-58"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      A thousand miles we galloped fast,
      And down the witches' lane we passed,
      And rode amain, with brandished sword,
      Up to the middle, through the ford.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[79]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2078
        "source_sequence": 296
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-58-08"
    "translation_ja": |-
      千マイル、蹄を飛ばして走った。
      魔女たちの小道を駆け抜けた。
      剣を振り、大急ぎで馬をやり、
      浅瀬を腰まで水につかって渡った。
    "translation_status": "reviewed"
  - "id": "cv-58-09"
    "section_id": "cv-58"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Last we drew rein—a weary three—
      Upon the lawn, in time for tea,
      And from our steeds alighted down
      Before the gates of Babylon.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[79]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2078
        "source_sequence": 297
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-58-09"
    "translation_ja": |-
      とうとう疲れきった三人が
      芝生で手綱を引いた。お茶に間に合った。
      ぼくらが軍馬から降り立ったのは
      バビロンの門の前だった。
    "translation_status": "reviewed"

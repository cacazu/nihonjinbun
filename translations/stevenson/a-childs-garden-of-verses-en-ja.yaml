        "kind": "indent"
        "span":
          "start": 34
          "end": 46
          "exact": "灰いろの煙はそびえ立つ。"
        "columns": 2
  - "id": "cv-56-03"
    "section_id": "cv-56"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Sing a song of seasons!
      Something bright in all!
      Flowers in the summer
      Fires in the fall!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[77]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2030
        "source_sequence": 281
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-56-03"
    "translation_ja": |-
      季節の歌を歌おうよ！
      どの季節にも光るもの。
      夏には花、
      秋にはたき火！
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "indent"

        "original_unit_id": "cv-62-03"
    "translation_ja": |-
      遠いインドのあなたに、この詩を
      海を越えて送ります。
      海を隔てていても、遠いとは思わない。
      だってぼくらのだれに忘れられよう、
      インドの飾り棚や
      レイヨウの骨、アホウドリの翼、
      まだらな鳥、彩色した鳥、色とりどりの豆、
      ジャンク船に腕輪、玉に屏風、
      神々や聖なる鈴、
      ぶうんと大きな音を立てる、ねじれた巻き貝を？
      客間の床に立っていれば
      そこは飾り気のない、なじみのスコットランドの岸。
      でも椅子によじ登りさえすれば
      ほら、きらびやかな東洋があった！
      これをおとぎ話だと思って、ほら、
      昔ながらの客間にいるぼくを見て。
      頭のすぐ上にはミニーが座っている、
      あの不思議なインドの飾り棚に！
      笑顔のやさしいあなたがすわる棚は
      ぼくがひとりで届くには高すぎる。
      手をおろして、ねえミニー、受け取って、
      昔なじみのよしみに、この詩を。
    "translation_status": "reviewed"

    "translation_status": "reviewed"
  - "id": "cv-56-01"
    "section_id": "cv-56"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      IN the other gardens
      And all up the vale,
      From the autumn bonfires
      See the smoke trail!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[77]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2030
        "source_sequence": 279
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-56-01"
    "translation_ja": |-
      よその家の庭にも
      谷のずっと奥までも、
      秋のたき火から
      ほら、煙が尾を引くよ！
    "translation_status": "reviewed"

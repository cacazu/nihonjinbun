      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-31-03"
    "translation_ja": |-
      ときには寝床に荷物を持ちこむ、
      用心深い船乗りなら、そうするもの。
      ウェディングケーキをひと切れとか
      おもちゃをひとつふたつとか。
    "translation_status": "reviewed"

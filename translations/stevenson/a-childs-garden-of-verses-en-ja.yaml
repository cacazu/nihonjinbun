        "source_sequence": 117
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[34]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1181
        "source_sequence": 117
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-30-heading"
    "translation_ja": "XXX　街灯をともす人"
    "translation_status": "reviewed"
  - "id": "cv-30-01"
    "section_id": "cv-30"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      MY tea is nearly ready and the sun has left the sky;
      It's time to take the window to see Leerie going by;
      For every night at teatime and before you take your seat,
      With lantern and with ladder he comes posting up the street.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[44]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1182
        "source_sequence": 118
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-30-01"
    "translation_ja": |-
      お茶の支度はもうすぐだ。お日さまは空から消えた。
      窓ぎわに陣取って、点灯屋さんが通るのを見る時間。
      毎晩お茶のころ、みんなが席に着かないうちに
      手さげ灯とはしごを持って、通りを大急ぎでやってくる。
    "translation_status": "reviewed"
  - "id": "cv-30-02"
    "section_id": "cv-30"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Now Tom would be a driver and Maria go to sea,
      And my papa's a banker and as rich as he can be;
      But I, when I am stronger and can choose what I'm to do,
      O Leerie, I'll go round at night and light the lamps with you!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[44]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1182
        "source_sequence": 119
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-30-02"
    "translation_ja": |-
      トムは御者に、マライアは船乗りになりたい。
      ぼくのとうさんは銀行家で、このうえなくお金持ち。
      でもぼくは、もっと丈夫になって、自分で仕事を選べたら、
      ねえ点灯屋さん、夜にはいっしょに街灯をともしに回るよ！
    "translation_status": "reviewed"
  - "id": "cv-30-03"
    "section_id": "cv-30"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      For we are very lucky, with a lamp before the door,
      And Leery stops to light it as he lights so many more;
      And O! before you hurry by with ladder and with light,
      O Leerie, see a little child and nod to him to-night!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[44]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1182
        "source_sequence": 120
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-30-03"
    "translation_ja": |-
      うちは玄関の前に街灯があって、ほんとについてる。
      ほかのたくさんの灯とおんなじに、あの人が立ちどまって、ともしてくれる。
      ねえ、はしごと灯を持って、急いで行ってしまう前に、
      点灯屋さん、今夜はちっちゃな子を見つけて、うなずいてね！
    "translation_status": "reviewed"
  - "id": "cv-31-heading"
    "section_id": "cv-31"

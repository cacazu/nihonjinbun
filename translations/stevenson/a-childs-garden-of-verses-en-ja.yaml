      桜の木のてっぺんに
      だれが登った？　ちびのぼく。
      両手で幹につかまって
      遠くよその国ぐにを見わたした。
    "translation_status": "reviewed"
  - "id": "cv-08-02"
    "section_id": "cv-08"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I saw the next door garden lie,
      Adorned with flowers, before my eye,
      And many pleasant places more
      That I had never seen before.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"

      YOU too, my mother, read my rhymes
      For love of unforgotten times,
      And you may chance to hear once more
      The little feet along the floor.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[81]"

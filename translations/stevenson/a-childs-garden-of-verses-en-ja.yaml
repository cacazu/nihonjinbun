        "original_unit_id": "cv-05-01"
    "translation_ja": |-
      子どもはいつもほんとのことを言い、
      声をかけられたらお返事をし、
      食卓ではお行儀よくいたしましょう。
      せめて、できる範囲でね。
    "translation_status": "reviewed"

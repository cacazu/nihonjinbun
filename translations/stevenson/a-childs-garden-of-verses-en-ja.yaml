      アリソン・カニンガムへ
      あなたの坊やより
    "translation_status": "reviewed"
  - "id": "cv-00-01"
    "section_id": "cv-00"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      For the long nights you lay awake
      And watched for my unworthy sake:
      For your most comfortable hand
      That led me through the uneven land:
      For all the story-books you read:
      For all the pains you comforted:
      For all you pitied, all you bore,
      In sad and happy days of yore:—
      My second Mother, my first Wife,
      The angel of my infant life—
      From the sick child, now well and old,
      Take, nurse, the little book you hold!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[7]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 440
        "source_sequence": 2
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-00-01"
    "translation_ja": |-
      長い夜を幾晩も眠らずに
      こんな私のために、見守ってくれたこと。
      なにより心やすまるその手で
      でこぼこ道を導いてくれたこと。
      読んでくれた物語の本のかずかず。
      なだめてくれた痛みのかずかず。
      昔の、悲しい日にも楽しい日にも
      いたわってくれたこと、こらえてくれたこと、そのすべてに。
      私の二人目の母、私の初めての妻、
      幼い日の私の天使よ。
      あの病気の子が、元気になって年を重ねて贈ります。
      ばあや、手にしたこの小さな本を、どうぞ受け取ってください。
    "translation_status": "reviewed"

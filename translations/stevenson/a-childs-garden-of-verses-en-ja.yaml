        "original_unit_id": "cv-41-09"
    "translation_ja": |-
      手すりの柱の影、ランプの影、
      寝床へ行く子の影。
      悪さをしそうな影がみんな、どしん、どしん、どしん、
      頭の上には真っ黒な夜。
    "translation_status": "reviewed"

    "kind": "heading"
    "origin": "source"
    "source_text": "1. GOOD NIGHT"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h4[2]"

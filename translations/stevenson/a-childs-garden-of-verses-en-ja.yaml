    "kind": "verse"
    "origin": "source"
    "source_text": |-
      A CHILD should always say what's true
      And speak when he is spoken to,
      And behave mannerly at table;
      At least as far as he is able.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[15]"

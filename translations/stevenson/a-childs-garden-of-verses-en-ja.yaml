      ほこりだらけの足よ、ここまでおいで！
      ここには妖精のパンがある。
      ひっそりとしたぼくの奥の間で
      子どもたち、きょうのごちそうは
      エニシダの金いろの香りと
      松の木のかげ。
      お腹がいっぱいになったらば、
      おとぎ話を聞かせっこ。
    "translation_status": "reviewed"

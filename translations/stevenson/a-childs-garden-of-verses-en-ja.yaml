    "translation_ja": |-
      客間と台所のあかりがもれた、
      よろい戸や窓や格子のすきまから。
      ずっと高い頭の上では、あちこち動く
      何十億という星。
      あんなにたくさん、木に葉はしげらない、
      教会にも公園にも、人は集まらない。
      ぼくを見おろす星の群れほど、
      闇の中できらきら、まばたきするほどには。
      大犬も、鋤も、狩人もみんな、
      船乗りの星も、火星も、
      空にかがやき、壁ぎわのバケツには
      水と星が半分ほど入っていそう。
      とうとう見つかって、呼び声に追いかけられ、
      ぼくはあっという間に寝床にしまわれた。
      それでもあの晴れやかな光は目にまぶしく残り、
      頭の中を星がぐるぐる回っていた。

        "source_sequence": 44
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-13-02"
    "translation_ja": |-
      のこぎりひとつ、くぎを何本か、
      子ども部屋のバケツには水をくんだ。
      それにトムが「持ってこうよ、
      りんごひとつとケーキをひと切れ」。
      それだけあれば、トムもぼくも
      お茶の時間まで航海できた。
    "translation_status": "reviewed"
  - "id": "cv-13-03"
    "section_id": "cv-13"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      We sailed along for days and days,
      And had the very best of plays;
      But Tom fell out and hurt his knee,
      So there was no one left but me.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[24]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 803
        "source_sequence": 45
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-13-03"
    "translation_ja": |-
      何日も何日も帆を走らせて
      ほんとにすてきな遊びだった。
      でもトムが船から落ちて膝を打ち、
      乗ってるのはぼくひとりになった。
    "translation_status": "reviewed"

    "translation_ja": |-
      ああ、遠いよ、ミニー、
      ここからは遠い、ずうっと遠い。
      それでもあなたはもっと遠くへ行った！
      「ろうそくの消えないうちに着けるかな？」
      昔の歌は、そう続く。
      どうだろう、ひょっとしたら着けるかもしれぬ。
      だけど子どもたち、よくお聞き、
      ああ、もう二度と帰ってはこられないのだ！
      永遠の夜明けが、たしかに
      丘にも平野にも訪れて、
      星という星、ろうそくというろうそくを消すだろう、
      ぼくらがもう一度若くなるより先に。

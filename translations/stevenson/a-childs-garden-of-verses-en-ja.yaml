      庭の木をめぐって遊ぶきみを見るように、
      きみだって、ほら見えるだろう、
      この本の窓ごしに、
      遠い遠いところの、もうひとりの子が
      よその庭で遊んでいる。
      でも、できると思わないで、
      窓をとんとんたたいて呼べば
      あの子に声が届くなんて。あの子はいま
      遊ぶお仕事にすっかり夢中。
      聞こえない。こっちを向かない。
      この本の外へ誘い出されることもない。
      だって、ほんとうを言うと、ずっと前に
      あの子は大人になって去っていった。
      あの庭にいまなお残っているのは
      空気でできた子どもだけ。

  - "id": "cv-01-01"
    "section_id": "cv-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      IN winter I get up at night
      And dress by yellow candle-light.
      In summer, quite the other way,
      I have to go to bed by day.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[11]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 577
        "source_sequence": 7
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-01-01"
    "translation_ja": |-
      冬は夜のうちに起きて
      黄色いろうそくの灯で服を着る。
      夏はまるであべこべだ。
      昼のうちに寝なくちゃならない。
    "translation_status": "reviewed"
  - "id": "cv-01-02"
    "section_id": "cv-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I have to go to bed and see
      The birds still hopping on the tree,
      Or hear the grown-up people's feet
      Still going past me in the street.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[11]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 577
        "source_sequence": 8
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-01-02"
    "translation_ja": |-
      寝床に入ったぼくにまだ見える、
      木の枝でぴょんぴょんはねる鳥。
      大人の足音だって聞こえる、
      通りをこつこつ、まだ通る。
    "translation_status": "reviewed"
  - "id": "cv-01-03"
    "section_id": "cv-01"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      And does it not seem hard to you,
      When all the sky is clear and blue,
      And I should like so much to play,
      To have to go to bed by day?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[11]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 577
        "source_sequence": 9
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-01-03"
    "translation_ja": |-
      空じゅうすっきり青いのに、
      遊びたくってたまらないのに、
      昼のうちに寝なくちゃならない。
      ねえ、ひどいと思わない？
    "translation_status": "reviewed"

    "translation_ja": "三　港にて"
    "translation_status": "reviewed"
  - "id": "cv-41-11"
    "section_id": "cv-41-10-subsection"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Last, to the chamber where I lie
      My fearful footsteps patter nigh,
      And come from out the cold and gloom
      Into my warm and cheerful room.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[59]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1471
        "source_sequence": 174
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-41-11"
    "translation_ja": |-
      やっと、眠る部屋の近くへと、
      おっかなびっくり、ぱたぱたと足音。
      寒さと薄闇を抜け
      明るくあたたかな、ぼくの部屋へ。
    "translation_status": "reviewed"
  - "id": "cv-41-12"
    "section_id": "cv-41-10-subsection"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      There, safe arrived, we turn about
      To keep the coming shadows out,
      And close the happy door at last
      On all the perils that we past.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[59]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1471
        "source_sequence": 175
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-41-12"
    "translation_ja": |-
      無事に着いたぞ、くるりと向いて
      迫る影たちが入らないように、
      やっとほっとして扉を閉める。
      越えてきた危険はみんな、そのむこう。
    "translation_status": "reviewed"
  - "id": "cv-41-13"
    "section_id": "cv-41-10-subsection"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Then, when mamma goes by to bed,
      She shall come in with tip-toe tread,
      And see me lying warm and fast
      And in the Land of Nod at last.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[59]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1471
        "source_sequence": 176
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-41-13"
    "translation_ja": |-
      あとでかあさんも寝に行くとき
      抜き足さし足、のぞきに来る。
      あったかく、ぐっすり眠るぼくを見る、
      とうとう着いた、こっくりの国で。
    "translation_status": "reviewed"

        "original_unit_id": "cv-08-02"
    "translation_ja": |-
      目の前に、花で飾った
      お隣の庭がひろがっていた。
      いいところがほかにもいくつも
      いままで見たこともないところが。
    "translation_status": "reviewed"
  - "id": "cv-08-03"
    "section_id": "cv-08"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I saw the dimpling river pass
      And be the sky's blue looking-glass;
      The dusty roads go up and down
      With people tramping in to town.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"

    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-41-06"
    "translation_ja": "二　影の行進"
    "translation_status": "reviewed"
  - "id": "cv-41-07"
    "section_id": "cv-41-06-subsection"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      All round the house is the jet-black night;
      It stares through the window-pane;
      It crawls in the corners, hiding from the light,
      And it moves with the moving flame.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[58]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1453
        "source_sequence": 170
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-41-07"
    "translation_ja": |-
      家を取り巻く、漆黒の夜。
      窓ガラスごしにじっと見つめる。
      光を避けて、部屋の隅をはい、
      ほのおがゆれると、いっしょにゆれる。
    "translation_status": "reviewed"

        "precision": "block"
        "xpath": "/html/body/div[27]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 857
        "source_sequence": 56
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-16-03"
    "translation_ja": |-
      ときには艦隊を送り出し、
      シーツの波間を行ったり来たり。
      木と家を取り出しては
      町をあちらこちらに植えた。
    "translation_status": "reviewed"
  - "id": "cv-16-04"
    "section_id": "cv-16"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I was the giant great and still
      That sits upon the pillow-hill,
      And sees before him, dale and plain,
      The pleasant land of counterpane.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[27]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 857
        "source_sequence": 57
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-16-04"
    "translation_ja": |-
      ぼくは大きな静かな巨人。
      枕の丘のてっぺんに座り、
      谷も平野も見はるかす、
      掛けぶとんの楽しい国を。
    "translation_status": "reviewed"
  - "id": "cv-17-heading"
    "section_id": "cv-17"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XVII
      THE LAND OF NOD
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[22]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 885
        "source_sequence": 58
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[21]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 886
        "source_sequence": 58
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-17-heading"
    "translation_ja": "XVII　こっくりの国"
    "translation_status": "reviewed"
  - "id": "cv-17-01"
    "section_id": "cv-17"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      FROM breakfast on through all the day
      At home among my friends I stay;
      But every night I go abroad
      Afar into the land of Nod.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[29]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 887
        "source_sequence": 59
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-17-01"
    "translation_ja": |-
      朝ごはんからいちにちじゅう、
      うちでみんなといっしょにいる。
      でも夜ごとよその国へ出かける、
      遠い遠いこっくりの国へ。
    "translation_status": "reviewed"
  - "id": "cv-17-02"
    "section_id": "cv-17"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      All by myself I have to go,
      With none to tell me what to do—
      All alone beside the streams
      And up the mountain-sides of dreams.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[29]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 887
        "source_sequence": 60
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-17-02"
    "translation_ja": |-
      ぼくひとりきりで行かなくちゃ。
      どうするのか教える人もなく、
      ひとりぼっちで小川のほとりを、
      夢の山の斜面を登って。
    "translation_status": "reviewed"
  - "id": "cv-17-03"
    "section_id": "cv-17"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The strangest things are there for me,
      Both things to eat and things to see,
      And many frightening sights abroad
      Till morning in the land of Nod.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[29]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 887
        "source_sequence": 61
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-17-03"
    "translation_ja": |-
      そこでは妙なものに出会う、
      食べるものにも、見るものにも。
      それに、そこらに怖い眺めがいくつもある、
      朝が来るまで、こっくりの国には。
    "translation_status": "reviewed"
  - "id": "cv-17-04"
    "section_id": "cv-17"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Try as I like to find the way,
      I never can get back by day,
      Nor can remember plain and clear
      The curious music that I hear.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[29]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 887
        "source_sequence": 62
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-17-04"
    "translation_ja": |-
      どんなに道を探してみても
      昼間は二度とたどり着けない。
      あそこで聞く不思議な音楽も
      はっきり思い出せやしない。
    "translation_status": "reviewed"
  - "id": "cv-18-heading"
    "section_id": "cv-18"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XVIII
      MY SHADOW
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[23]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 909
        "source_sequence": 63
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[22]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 910
        "source_sequence": 63
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-18-heading"
    "translation_ja": "XVIII　ぼくの影"
    "translation_status": "reviewed"
  - "id": "cv-18-01"
    "section_id": "cv-18"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I HAVE a little shadow that goes in and out with me,
      And what can be the use of him is more than I can see.
      He is very, very like me from the heels up to the head;
      And I see him jump before me, when I jump into my bed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[30]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 911
        "source_sequence": 64
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-18-01"
    "translation_ja": |-
      ちっちゃな影がぼくといっしょに出たり入ったり。
      なんの役に立つのかは、ぼくにはさっぱりわからない。
      かかとから頭のてっぺんまで、そっくりそっくり、ぼくにそっくり。
      ベッドにぴょんと飛びこむと、ぼくより先にあいつが跳んでる。
    "translation_status": "reviewed"
  - "id": "cv-18-02"
    "section_id": "cv-18"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The funniest thing about him is the way he likes to grow—
      Not at all like proper children, which is always very slow;
      For he sometimes shoots up taller like an india-rubber ball,
      And sometimes gets so little that there's none of him at all.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[30]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 911
        "source_sequence": 65
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-18-02"
    "translation_ja": |-
      あいつのいちばんおかしいところは、背の伸びかた。
      ちゃんとした子はいつだってゆっくり育つのに、まるでちがう。
      ゴムまりみたいにぽーんと背が伸びたかと思えば、
      どんどんちっちゃくなって、影もかたちもなくなることも。
    "translation_status": "reviewed"
  - "id": "cv-18-03"
    "section_id": "cv-18"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      He hasn't got a notion of how children ought to play,
      And can only make a fool of me in every sort of way.
      He stays so close beside me, he's a coward you can see;
      I'd think shame to stick to nursie as that shadow sticks to me!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[30]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 911
        "source_sequence": 66
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-18-03"
    "translation_ja": |-
      子どもの遊びかたなんか、てんで知りもしないくせに、
      あの手この手でぼくを笑いものにすることだけはうまい。
      ぼくにぴったりくっついて、どう見たって弱虫だ。
      ぼくがあんなにばあやにくっついたら、恥ずかしくってたまらない。
    "translation_status": "reviewed"
  - "id": "cv-18-04"
    "section_id": "cv-18"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      One morning, very early, before the sun was up,
      I rose and found the shining dew on every buttercup;
      But my lazy little shadow, like an arrant sleepy-head,
      Had stayed at home behind me and was fast asleep in bed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[30]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 911
        "source_sequence": 67
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-18-04"
    "translation_ja": |-
      ある朝、とっても早く、お日さまよりも先に起きた。
      外じゃ、きんぽうげというきんぽうげに、露がきらきら。
      ところがあの怠けもの、どうしようもないお寝坊さん。
      ぼくに遅れてうちに残って、ベッドでぐっすり眠ってた。
    "translation_status": "reviewed"
  - "id": "cv-19-heading"
    "section_id": "cv-19"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XIX
      SYSTEM
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[24]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 933
        "source_sequence": 68
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[23]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 934
        "source_sequence": 68
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-19-heading"
    "translation_ja": "XIX　きまり"
    "translation_status": "reviewed"
  - "id": "cv-19-01"
    "section_id": "cv-19"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      EVERY night my prayers I say,
      And get my dinner every day;
      And every day that I've been good,
      I get an orange after food.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[31]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 935
        "source_sequence": 69
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-19-01"
    "translation_ja": |-
      ぼくは毎晩お祈りをして
      毎日ちゃんとごはんが出る。
      いい子にしていた日にはいつも
      ごはんのあとにオレンジひとつ。
    "translation_status": "reviewed"
  - "id": "cv-19-02"
    "section_id": "cv-19"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The child that is not clean and neat,
      With lots of toys and things to eat,
      He is a naughty child, I'm sure—
      Or else his dear papa is poor.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[31]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 935
        "source_sequence": 70
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-19-02"
    "translation_ja": |-
      きれいにして、おもちゃも食べものも
      たんとある、そんな子でないなら、
      きっと悪い子なんだと思う。
      でなけりゃ、大好きなとうさんが貧乏なんだ。
    "translation_status": "reviewed"
  - "id": "cv-20-heading"
    "section_id": "cv-20"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XX
      A GOOD BOY
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[25]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 947
        "source_sequence": 71
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[24]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 948
        "source_sequence": 71
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-20-heading"
    "translation_ja": "XX　いい子"
    "translation_status": "reviewed"
  - "id": "cv-20-01"
    "section_id": "cv-20"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I WOKE before the morning, I was happy all the day,
      I never said an ugly word, but smiled and stuck to play.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[32]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 949
        "source_sequence": 72
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-20-01"
    "translation_ja": |-
      朝もまだ明けないうちに起きて、いちにち楽しかった。
      いやな言葉はひとつも言わず、にこにこ遊んで過ごしたよ。
    "translation_status": "reviewed"
  - "id": "cv-20-02"
    "section_id": "cv-20"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      And now at last the sun is going down behind the wood,
      And I am very happy, for I know that I've been good.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[32]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 949
        "source_sequence": 73
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-20-02"
    "translation_ja": |-
      いまやっと、お日さまが森のむこうに沈んでく。
      ぼくはとってもうれしいんだ、いい子にしてたと知ってるから。
    "translation_status": "reviewed"
  - "id": "cv-20-03"
    "section_id": "cv-20"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      My bed is waiting cool and fresh, with linen smooth and fair,
      And I must off to sleepsin-by, and not forget my prayer.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[32]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 949
        "source_sequence": 74
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-20-03"
    "translation_ja": |-
      ひんやりきれいな寝床が待ってる。まっしろなシーツはしわひとつない。
      さあ、ねんねのお時間だ、お祈りするのも忘れずに。
    "translation_status": "reviewed"
  - "id": "cv-20-04"
    "section_id": "cv-20"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      I know that, till to-morrow I shall see the sun arise,
      No ugly dream shall fright my mind, no ugly sight my eyes,
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[32]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 949
        "source_sequence": 75
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-20-04"
    "translation_ja": |-
      明日またお日さまがのぼるまで、だいじょうぶ、
      怖い夢でぎょっとしたり、いやなものを見たりしない。
    "translation_status": "reviewed"
  - "id": "cv-20-05"
    "section_id": "cv-20"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      But slumber holds me tightly till I waken in the dawn,
      And hear the thrushes singing in the lilacs round the lawn.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[32]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 949
        "source_sequence": 76
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-20-05"
    "translation_ja": |-
      眠りはしっかりぼくを抱いてる、あかつきに目をさまして
      芝生を囲むライラックで、つぐみが歌うのを聞くまで。
    "translation_status": "reviewed"
  - "id": "cv-21-heading"
    "section_id": "cv-21"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XXI
      ESCAPE AT BEDTIME
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h2[26]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 966
        "source_sequence": 77
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/h3[25]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 967
        "source_sequence": 77
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-21-heading"
    "translation_ja": "XXI　おやすみどきの脱走"
    "translation_status": "reviewed"
  - "id": "cv-21-01"
    "section_id": "cv-21"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      THE lights from the parlour and kitchen shone out
      Through the blinds and the windows and bars;
      And high overhead and all moving about,
      There were thousands of millions of stars.
      There ne'er were such thousands of leaves on a tree,
      Nor of people in church or the Park,
      As the crowds of the stars that looked down upon me,
      And that glittered and winked in the dark.
      The Dog, and the Plough, and the Hunter, and all
      And the Star of the Sailor, and Mars,
      These shone in the sky, and the pail by the wall
      Would be half full of water and stars.
      They saw me at last, and they chased me with cries,
      And they soon had me packed into bed;
      But the glory kept shining and bright in my eyes,
      And the stars going round in my head.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[33]"

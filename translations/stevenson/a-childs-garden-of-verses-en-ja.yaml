    "kind": "verse"
    "origin": "source"
    "source_text": |-
      And sometimes things to bed I take,
      As prudent sailors have to do:
      Perhaps a slice of wedding-cake,
      Perhaps a toy or two.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[45]"

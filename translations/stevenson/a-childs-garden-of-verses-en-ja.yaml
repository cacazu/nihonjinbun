    "section_id": "cv-31"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      MY bed is a little boat;
      Nurse helps me in when I embark
      She girds me in my sailor's coat
      And starts me in the dark.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"

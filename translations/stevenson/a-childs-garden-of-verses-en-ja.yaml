    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-13-01"
    "translation_ja": |-
      階段の上で船を造った。
      奥の寝室の椅子ばっかりを集めて、
      長椅子のクッションをぎゅうぎゅうに積み、
      大波の上を帆走するんだ。
    "translation_status": "reviewed"
  - "id": "cv-13-02"
    "section_id": "cv-13"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      We took a saw and several nails,
      And water in the nursery pails;
      And Tom said, 'Let us also take
      An apple and a slice of cake;'—
      Which was enough for Tom and me
      To go a-sailing on till tea.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[24]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"

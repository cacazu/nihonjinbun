        "line_start": 1430
        "source_sequence": 164
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-41-01"
    "translation_ja": "一　おやすみ"
    "translation_status": "reviewed"
  - "id": "cv-41-02"
    "section_id": "cv-41-01-subsection"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      When the bright lamp is carried in,
      The sunless hours again begin;
      O'er all without, in field and lane,
      The haunted night returns again.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[57]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1431
        "source_sequence": 165
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-41-02"
    "translation_ja": |-
      明るいランプが運びこまれると
      日のない時間がまた始まる。
      外の野にも細道にも、あまねく
      もののけの出る夜がまた戻る。
    "translation_status": "reviewed"
  - "id": "cv-41-03"
    "section_id": "cv-41-01-subsection"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Now we behold the embers flee
      About the firelit hearth; and see
      Our faces painted as we pass,
      Like pictures, on the window-glass.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[57]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1431
        "source_sequence": 166
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-41-03"
    "translation_ja": |-
      炉火に照らされた炉辺で
      火の粉の飛ぶのが見える。そばを通れば
      窓ガラスにぼくらの顔が
      絵のように映っている。
    "translation_status": "reviewed"
  - "id": "cv-41-04"
    "section_id": "cv-41-01-subsection"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Must we to bed indeed? Well then,
      Let us arise and go like men,
      And face with an undaunted tread
      The long black passage up to bed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[57]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1431
        "source_sequence": 167
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-41-04"
    "translation_ja": |-
      ほんとにもう寝なくちゃいけない？　さあ、それなら
      男らしく立ちあがって行こう。
      ひるまず足を踏み出して
      寝床へ続く、長くて黒い廊下に向かおう。
    "translation_status": "reviewed"
  - "id": "cv-41-05"
    "section_id": "cv-41-01-subsection"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Farewell, O brother, sister, sire!
      O pleasant party round the fire!
      The songs you sing, the tales you tell,
      Till far to-morrow, fare ye well!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[57]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1431
        "source_sequence": 168
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-41-05"
    "translation_ja": |-
      さらば、兄弟、姉妹、お父さま！
      炉を囲む楽しい集いよ！
      みんなの歌も、お話も、
      はるか明日まで、ごきげんよう！
    "translation_status": "reviewed"
  - "id": "cv-41-06"
    "section_id": "cv-41-06-subsection"
    "kind": "heading"
    "origin": "source"
    "source_text": "2. SHADOW MARCH"
    "source_languages":
      - "en"
    "source_locations":

  - "id": "cv-02-01"
    "section_id": "cv-02"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      IT is very nice to think
      The world is full of meat and drink,
      With little children saying grace
      In every Christian kind of place.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[12]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 596
        "source_sequence": 11
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-02-01"
    "translation_ja": |-
      思うとなんだかうれしくなる。
      世界には食べもの、飲みものがいっぱいで、
      キリストさまを信じる国では、どこででも
      小さい子たちが食卓のお祈りをしている。
    "translation_status": "reviewed"

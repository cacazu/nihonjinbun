  - "id": "cv-32-01"
    "section_id": "cv-32"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      THE moon has a face like the clock in the hall;
      She shines on thieves on the garden wall,
      On streets and fields and harbour quays,
      And birdies asleep in the forks of the trees.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[46]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1225
        "source_sequence": 127
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-32-01"
    "translation_ja": |-
      お月さまの顔は広間の時計に似てる。
      庭の塀によじ登る泥棒や、
      通りや畑や港の波止場、
      木のまたで眠る小鳥を照らす。
    "translation_status": "reviewed"
  - "id": "cv-32-02"
    "section_id": "cv-32"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The squalling cat and the squeaking mouse,
      The howling dog by the door of the house,
      The bat that lies in bed at noon,
      All love to be out by the light of the moon.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[46]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1225
        "source_sequence": 128
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-32-02"
    "translation_ja": |-
      ぎゃあぎゃあ鳴く猫、ちゅうちゅういうねずみ、
      家の戸口で遠ぼえする犬、
      まっ昼間には寝床にいるこうもり、
      みんな月あかりに外へ出るのが大好き。
    "translation_status": "reviewed"
  - "id": "cv-32-03"
    "section_id": "cv-32"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      But all of the things that belong to the day
      Cuddle to sleep to be out of her way;
      And flowers and children close their eyes
      Till up in the morning the sun shall arise.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[46]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 1225
        "source_sequence": 129
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-32-03"
    "translation_ja": |-
      でもお昼の仲間はみんな
      お月さまの邪魔にならぬよう寄り添って眠る。
      花も子どもも目を閉じる、
      朝になってお日さまが昇るまで。
    "translation_status": "reviewed"

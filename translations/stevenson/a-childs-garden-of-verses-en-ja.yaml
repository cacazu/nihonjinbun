      東と西の出会う、忙しい大都会で
      ちいさな活字をひとつひとつ、印刷屋さんが組んだのだ。
      きみがなんにも思わず、遊ぶにはまだ小さすぎたとき、
      はるか遠くの国の人たちが、きみのことを思っていた。

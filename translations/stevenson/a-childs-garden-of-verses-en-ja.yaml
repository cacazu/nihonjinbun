    "kind": "verse"
    "origin": "source"
    "source_text": |-
      All night across the dark we steer:
      But when the day returns at last,
      Safe in my room, beside the pier,
      I find my vessel fast.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[45]"

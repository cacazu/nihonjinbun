        "columns": 2
  - "id": "cv-56-02"
    "section_id": "cv-56"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Pleasant summer over
      And all the summer flowers,
      The red fire blazes,
      The grey smoke towers.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-28722"
        "precision": "block"
        "xpath": "/html/body/div[77]"
        "url": "https://gutenberg.pglaf.org/cache/epub/28722/pg28722-images.html"
        "line_start": 2030
        "source_sequence": 280
    "source_alignment":
      - "source_id": "gutenberg-28722"
        "original_unit_id": "cv-56-02"
    "translation_ja": |-
      楽しい夏もおしまい、
      夏の花たちもおしまい。
      赤い炎は燃え立って、
      灰いろの煙はそびえ立つ。
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "indent"

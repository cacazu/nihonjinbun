        "kind": "indent"
        "span":
          "start": 12
          "end": 19
          "exact": "高いところから"
        "columns": 2
      - "side": "source"
        "kind": "indent"
        "span":
          "start": 73
          "end": 84
          "exact": "In the sky,"
        "columns": 2

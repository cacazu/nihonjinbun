- "id": "poem-xxxv-stanza-01"
  "section_id": "poem-xxxv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    The tropics vanish, and meseems that I,
    From Halkerside, from topmost Allermuir,
    Or steep Caerketton, dreaming gaze again.
    Far set in fields and woods, the town I see
    Spring gallant from the shallows of her smoke,
    Cragged, spired, and turreted, her virgin fort
    Beflagged.  About, on seaward-drooping hills,
    New folds of city glitter.  Last, the Forth
    Wheels ample waters set with sacred isles,
    And populous Fife smokes with a score of towns.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1113
    "line_end": 1122
    "source_sequence": 1113
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1113-1122"
  "translation_ja": |-
    熱帯が消え、ふたたびあの眺めを夢に見ているようだ。
    ホーカーサイドから、アラミュアの頂から、
    あるいは険しいケアケトンから。
    野と森のはるか向こうに、町が見える。
    煙の浅瀬から勇ましく立ち上がり、
    岩壁、尖塔、小塔を備え、攻略されぬ城には
    旗がはためく。海へ傾く周りの丘には
    新しい街区がきらめく。最後にフォースの海が
    聖なる島々を載せ、豊かな水を大きくめぐらせる。
    人の多いファイフでは、二十ほどの町が煙を上げる。
  "translation_status": "reviewed"

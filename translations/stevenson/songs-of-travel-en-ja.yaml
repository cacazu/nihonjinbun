- "id": "poem-viii-stanza-01"
  "section_id": "poem-viii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    To you, let snow and roses
       And golden locks belong.
    These are the world’s enslavers,
       Let these delight the throng.
    For her of duskier lustre
       Whose favour still I wear,
    The snow be in her kirtle,
       The rose be in her hair!
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 361
    "line_end": 368
    "source_sequence": 361
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-361-368"
  "translation_ja": |-
    あなたには、雪と薔薇と
    　金の巻き毛がふさわしい。
    世をとりこにするのはそれら、
    　人々を喜ばせるがいい。
    色濃く照り映えるあの人、
    　そのしるしをいまも着ける私には、
    雪は彼女のドレスに、
    　薔薇は彼女の髪のなかにあればいい！
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-viii-stanza-02"
  "section_id": "poem-viii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    The hue of highland rivers
       Careering, full and cool,
    From sable on to golden,
       From rapid on to pool—
    The hue of heather-honey,
       The hue of honey-bees,
    Shall tinge her golden shoulder,
       Shall gild her tawny knees.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 370
    "line_end": 377
    "source_sequence": 370
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-370-377"
  "translation_ja": |-
    高地の川の色、
    　冷たい水を満々とたたえてほとばしり、
    黒から金色へ、
    　早瀬から淵へと移ろう色。
    ヒースの蜜の色、
    　蜜蜂の色が、
    彼女の金色の肩を染め、
    　褐色の膝を黄金に染めるだろう。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-ix-title"
  "section_id": "poem-ix"
  "kind": "heading"
  "origin": "source"
  "source_text": "IX"
  "source_languages":
  - "en"
  "source_locations":

    "line_end": 994
    "source_sequence": 987
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-987-994"
  "translation_ja": |-
    この場所の限りない痛ましさを見るとき、
    傷ついて形を失った手足、荒廃した顔、
    罪もないのに苦しみ、鞭にも微笑む人を前にすれば、
    愚か者なら神を否む気にもなろう。
    彼は見て、ひるむ。だがもう一度まなざしを向ければ、
    見よ、苦しみの胸から美しさが湧き立つ！
    悲しみの岸辺に立つ修道女たちに気づくと、
    愚か者さえ、黙ってひれ伏す。
  "translation_status": "reviewed"
  "attributions":

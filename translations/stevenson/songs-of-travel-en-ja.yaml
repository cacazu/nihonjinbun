    "original_unit_id": "line-1544-1550"
  "translation_ja": |-
    さあ、手で触れられるこの世界に
    あなたの魂の錨を下ろそう。この身をここにつなぎ留めよう。
    いまからこの眺めを変わることなく
    あなたの目に映る絵としよう。そして時が鳴り、
    緑の眺めがその瞬間に視界から消えたなら、
    今日、夢うつつのあなたを馬が連れてきたところへ、
    最後の付き添い人たちが、死んだあなたの体を運ぶ。
  "translation_status": "reviewed"
  "attributions":

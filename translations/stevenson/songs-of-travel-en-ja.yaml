  "section_id": "poem-xxxii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    I knew a silver head was bright beyond compare,
    I knew a queen of toil with a crown of silver hair.
    Garland of valour and sorrow, of beauty and renown,
    Life, that honours the brave, crowned her himself with the crown.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1004
    "line_end": 1007
    "source_sequence": 1004
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1004-1007"
  "translation_ja": |-
    何ものにも比べがたい銀の髪の輝きを知っていた。
    銀の髪を冠に戴く、労苦の女王を知っていた。
    勇気と悲しみ、美しさと誉れの花冠。
    勇者を敬う〈生〉が、自らその冠を彼女にかぶせた。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxxii-stanza-02"
  "section_id": "poem-xxxii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    The beauties of youth are frail, but this was a jewel of age.
    Life, that delights in the brave, gave it himself for a gage.
    Fair was the crown to behold, and beauty its poorest part—
    At once the scar of the wound and the order pinned on the heart.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1009
    "line_end": 1012
    "source_sequence": 1009
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1009-1012"
  "translation_ja": |-
    若さの美はもろい。だがこれは年老いて得た宝石だ。
    勇者を喜ぶ〈生〉が、自ら証しとして与えた。
    冠は美しく見えたが、美しさはその一番ささやかな部分。
    それは傷痕であり、また胸に留めた勲章でもあった。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxxii-stanza-03"
  "section_id": "poem-xxxii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    The beauties of man are frail, and the silver lies in the dust,
    And the queen that we call to mind sleeps with the brave and the just;
    Sleeps with the weary at length; but, honoured and ever fair,
    Shines in the eye of the mind the crown of the silver hair.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1014
    "line_end": 1017
    "source_sequence": 1014
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1014-1017"
  "translation_ja": |-
    人の美はもろく、銀は土に横たわり、
    思い浮かべるあの女王は、勇敢で正しい者たちと眠る。
    ついに疲れた者らと眠る。けれども敬われ、いつまでも美しく、
    心の目には、銀の髪の冠が輝く。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

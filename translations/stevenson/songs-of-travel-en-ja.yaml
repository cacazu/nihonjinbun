- "id": "poem-xvi-stanza-01"
  "section_id": "poem-xvi"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Home no more home to me, whither must I wander?
       Hunger my driver, I go where I must.
    Cold blows the winter wind over hill and heather;
       Thick drives the rain, and my roof is in the dust.
    Loved of wise men was the shade of my roof-tree.
       The true word of welcome was spoken in the door—
    Dear days of old, with the faces in the firelight,
       Kind folks of old, you come again no more.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 564
    "line_end": 571
    "source_sequence": 564
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-564-571"
  "translation_ja": |-
    家はもうわが家ではない。どこへさすらえばいい。
    　飢えに追われ、行かねばならぬ所へ行く。
    丘とヒースを越えて冬の風は冷たく吹く。
    　雨ははげしく降り、屋根は地に落ちた。
    賢い人々は、わが屋根の陰を愛した。
    　戸口ではまことの歓迎のことばが聞けた。
    炉火に顔の浮かんだ、いとしい昔の日々、
    　昔のやさしい人たちよ、もう帰ってはこない。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xvi-stanza-02"
  "section_id": "poem-xvi"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Home was home then, my dear, full of kindly faces,
       Home was home then, my dear, happy for the child.
    Fire and the windows bright glittered on the moorland;
       Song, tuneful song, built a palace in the wild.
    Now, when day dawns on the brow of the moorland,
       Lone stands the house, and the chimney-stone is cold.
    Lone let it stand, now the friends are all departed,
       The kind hearts, the true hearts, that loved the place of old.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 573
    "line_end": 580
    "source_sequence": 573
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-573-580"
  "translation_ja": |-
    あの頃、わが家はわが家だった、いとしい人。やさしい顔に満ち、
    　あの頃、わが家はわが家だった、いとしい人。子には幸せな場所。
    荒野では火が、明るい窓がきらめき、
    　歌が、美しい調べが、荒地に宮殿を築いた。
    いま荒野の尾根に夜が明けると、
    　家はぽつんと立ち、煙突の石は冷たい。
    独りで立つがいい。友はみな去ったのだ、
    　昔この場所を愛した、やさしく誠実な心は。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xvi-stanza-03"
  "section_id": "poem-xvi"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Spring shall come, come again, calling up the moorfowl,
       Spring shall bring the sun and rain, bring the bees and flowers;
    Red shall the heather bloom over hill and valley,
       Soft flow the stream through the even-flowing hours;
    Fair the day shine as it shone on my childhood—
       Fair shine the day on the house with open door;
    Birds come and cry there and twitter in the chimney—
       But I go for ever and come again no more.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 582
    "line_end": 589
    "source_sequence": 582
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-582-589"
  "translation_ja": |-
    春は来る、また来る。野の雷鳥を呼び起こし、
    　日差しと雨を、蜂と花を連れてくる。
    ヒースは丘と谷を越えて赤く咲き、
    　穏やかに過ぎる時のなかを小川はそっと流れる。
    子どもの頃を照らしたように日が美しく輝き、
    　戸の開いた家を美しく照らす。
    鳥は来て鳴き、煙突でさえずるだろう。
    　だが私は永久に去って、二度と帰らない。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

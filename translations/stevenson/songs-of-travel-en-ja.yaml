    "original_unit_id": "line-1513-1516"
  "translation_ja": |-
    金属をよく混ぜて鋳た鐘が、たった一撃の痛みを
    隅々まで鳴り響かせ、響きを生かしてこだまさせるように、
    頭上の雷は一つの舌で語り、
    その音が山の心臓に轟いて離れなかった。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxxix-stanza-02"
  "section_id": "poem-xxxix"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Sudden the thunder was drowned—quenched was the levin light—
    And the angel-spirit of rain laughed out loud in the night.
    Loud as the maddened river raves in the cloven glen,
    Angel of rain! you laughed and leaped on the roofs of men;
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1518
    "line_end": 1521
    "source_sequence": 1518
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1518-1521"
  "translation_ja": |-
    突如、雷鳴は呑まれ、稲妻は消え、
    雨の天使の霊が夜に声高に笑った。
    裂けた谷で狂った川が喚くほどの大声で、
    雨の天使よ、あなたは笑い、人の屋根へ跳びおりた。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxxix-stanza-03"
  "section_id": "poem-xxxix"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    And the sleepers sprang in their beds, and joyed and feared as you fell.
    You struck, and my cabin quailed; the roof of it roared like a bell.
    You spoke, and at once the mountain shouted and shook with brooks.
    You ceased, and the day returned, rosy, with virgin looks.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1523
    "line_end": 1527
    "source_sequence": 1523
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1523-1527"
  "translation_ja": |-
    眠る人々は寝床で跳ね起き、降り来るあなたに喜び、怖れた。
    あなたが打てば私の小屋は震え、その屋根は鐘のように鳴り響いた。
    あなたが語るやいなや、山は叫び、小川を流して震えた。
    あなたがやむと、薔薇色の日が、けがれなき顔で戻ってきた。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxxix-stanza-04"
  "section_id": "poem-xxxix"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    And methought that beauty and terror are only one, not two;
    And the world has room for love, and death, and thunder, and dew;
    And all the sinews of hell slumber in summer air;
    And the face of God is a rock, but the face of the rock is fair.
    Beneficent streams of tears flow at the finger of pain;
    And out of the cloud that smites, beneficent rivers of rain.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1529
    "line_end": 1534
    "source_sequence": 1529
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1529-1534"
  "translation_ja": |-
    そして思った。美と恐怖は一つであって、二つではない。
    世界には愛も、死も、雷も、露も、居場所がある。
    地獄の筋という筋が、夏の空気に眠っている。
    神の顔は岩だが、岩の顔は美しい。
    痛みの指に触れられて、恵みの涙が流れ出る。
    打ちつける雲から、恵みの雨が川となって流れ出る。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

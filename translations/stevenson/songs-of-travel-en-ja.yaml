  "translation_ja": |-
    天幕もない宇宙を宿に、
    　気ままなよそ者のまま通りゆく。
    いまもわが恋人は果てしない道、
    　そして危険の輝くまなざし。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

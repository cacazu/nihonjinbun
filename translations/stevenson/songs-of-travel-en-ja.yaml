  "translation_ja": |-
    わがテンビノカはこうした人々から
    宮殿を継いだ。
    統治する権利、頭の働き、
    海に抱かれた椰子の島々も継いだ。
    剣と鞭を帯びる厳めしい人、
    支配するすべに通じた支配者は、
    必要に追われたわけでもなく、
    文字の書き方、計算のしかた、読み方を学んだ。
    低く横たわるその岸に寄る者すべてから
    学んでは、知識の蓄えを増やし、
    昔若かった頃のように、年老いても熱心に
    技を覚え、真実を学び、
    胸の内なる頁に
    時代をもっとはっきり描こうとする。
    彼の時代ですと？　ああ、そうではない。
    遠い昔のままの孤島の
    王冠を戴いたシャロットの姫さながら、
    海に隔てられ、時代を目にできない。
    ただ遠くで音を聞くばかり。
    赤道の日中の苛烈さに耐えながら、
    島の気の抜けた年代記を
    したためる。
    隷属する者が彼の誉れへの賛辞や
    椰子の町のかしましい噂を持ってくる。
    船は滅多に来ず、舟もまれで、彼は目を留める。
    王座と富が昇り、よろめくところで
    車輪が回るあの雷の音を
    遠くに聞くばかりだ。

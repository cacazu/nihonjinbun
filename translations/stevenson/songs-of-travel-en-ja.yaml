  "origin": "source"
  "source_text": |-
    In rigorous hours, when down the iron lane
    The redbreast looks in vain
    For hips and haws,
    Lo, shining flowers upon my window-pane
    The silver pencil of the winter draws.
  "source_languages":
  - "en"
  "source_locations":

  "translation_ja": |-
    なぜ平和を得々と語る？　誰もが戦士なら、
    鎧をがちゃつかせて広間へ入り、
    卓上にはいつも、抜き身のまま
    なくてはならぬ剣が横たわる。
    緑の野でも静かな通りでも、
    私たちは包囲されて眠り、包囲されて食べる。
    昼働き、夜も眠らず、
    競いあう食欲と戦う。
    薔薇は薔薇を食い、雲雀は
    雲雀を食う。座り仕事の書記は、
    午前じゅう熱心にペンを走らせ
    他人の赤ん坊を殺す。
    森や園の獣のように、
    自分の子を守り、巣を守る。

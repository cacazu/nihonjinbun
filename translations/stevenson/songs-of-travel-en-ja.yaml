- "id": "poem-xli-stanza-01"
  "section_id": "poem-xli"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    We uncommiserate pass into the night
    From the loud banquet, and departing leave
    A tremor in men’s memories, faint and sweet
    And frail as music.  Features of our face,
    The tones of the voice, the touch of the loved hand,
    Perish and vanish, one by one, from earth:
    Meanwhile, in the hall of song, the multitude
    Applauds the new performer.  One, perchance,
    One ultimate survivor lingers on,
    And smiles, and to his ancient heart recalls
    The long forgotten.  Ere the morrow die,
    He too, returning, through the curtain comes,
    And the new age forgets us and goes on.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1560
    "line_end": 1572
    "source_sequence": 1560
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1560-1572"
  "translation_ja": |-
    誰にも惜しまれず、私たちは夜へ去りゆく、
    にぎやかな宴をあとに。別れに残すのは
    人の記憶に、一つのかすかで甘い震え。
    音楽のようにもろい。私たちの顔立ち、
    声の調子、愛した手の感触は、
    一つずつ世から消え、なくなってゆく。
    その間、歌の広間では、群衆が
    新しい演者に拍手する。おそらく一人、
    最後の生き残りがとどまり、
    ほほ笑んで、老いた心に
    久しく忘れられた者を思い出す。あくる日が暮れきる前に、
    彼もまた戻ってきて、幕をくぐる。
    新しい世は私たちを忘れて先に進む。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

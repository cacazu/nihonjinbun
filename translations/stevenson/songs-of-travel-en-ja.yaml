    "original_unit_id": "line-463-476"
  "translation_ja": |-
    霜が流れる川を縛り、
    　雪が島の茂みを白く染め、
    冬の焚き木のそばで
    　ジョーンとダービーは眠り、夢を見て、目を覚ます。
    　　いまも夢の川には
    　　恋の舟が行く。
    　　聞け、櫂を落とす水音を！
    そしてまた、冬の夕べ、
    　火明かりに夢想の心が養われるころ、
    老いた恋人たちの耳には
    　恋の川が葦の間を歌いながら流れる。
    　　昔をまだ愛しておくれ、いとしい人。
    　　かつて私たちは生きた。
    　　ああ、かつて私たちは愛し合った。
  "translation_status": "reviewed"

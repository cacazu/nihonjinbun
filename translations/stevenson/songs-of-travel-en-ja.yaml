  "translation_ja": |-
    ああ、よく通ったあの場所へまた登れたら。
    古い赤土の丘は鳥の声に魅せられ、
    低地の緑の牧草地は
    草に輝く。
    幾百万の色を帯びた夕べが息絶え、
    夜が来て惑星がきらめくと、
    見よ、深い谷には
    星のように灯がともる！

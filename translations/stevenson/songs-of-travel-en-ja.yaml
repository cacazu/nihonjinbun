    "original_unit_id": "line-603-608"
  "translation_ja": |-
    雪の丘もすっかり
    葉の落ちた森も静まり、
    凍った湿地でタシギが鳴かず、
    庭じゅうが泥に呑まれたとき、
    見よ、炉端では薪が笑う。
    薔薇より美しい、見よ、火の花を！
  "translation_status": "reviewed"

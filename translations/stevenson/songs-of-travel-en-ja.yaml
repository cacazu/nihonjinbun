    園の門辺でただ一度、
    　唇を合わせ、別れた。
    空しいさだめを果たし、
    　地図にない土地を旅せねば。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

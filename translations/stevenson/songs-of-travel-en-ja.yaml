- "id": "editors-note-body"
  "section_id": "editors-note"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "The following collection of verses, written at various times and places, principally after the author’s final departure from England in 1887, was sent home by him for publication some months before his death.  He had tried them in several different orders and under several different titles, as “Songs and Notes of Travel,” “Posthumous Poems,” etc., and in the end left their naming and arrangement to the present editor, with the suggestion that they should be added as Book III. to future editions of “Underwoods.”  This suggestion it is proposed to carry out; but in the meantime, for the benefit of those who possess “Underwoods” in its original form, it has been thought desirable to publish them separately in the present volume.  They have already been included in the Edinburgh Edition of the author’s works."
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 57
    "line_end": 68
    "source_sequence": 57
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-57-68"
  "translation_ja": "次に掲げる詩の数々は、さまざまな時期、さまざまな土地で、主として著者が最後にイングランドを離れた1887年以後に書かれ、死の数か月前に出版のため本国へ送られたものである。著者はいくつもの配列を試み、「旅の歌と覚え書き」や「遺稿詩集」など、題もいくつか考えた末、命名と配列をこの編者に委ね、将来『森の下草』を改版する際に第三部として加えてはどうか、と提案した。この提案は実行に移す予定だが、それまでの間、旧来の形の『森の下草』をお持ちの方々のため、この巻に収めて別に刊行するのが望ましいと判断した。これらの詩はすでに著作集のエディンバラ版に収録されている。"
  "translation_status": "reviewed"

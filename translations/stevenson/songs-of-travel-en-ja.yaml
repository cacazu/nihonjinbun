    兵士、恋人、探検家よ、いまは鼻を乳房に押しつけている。
    私の胸を手探りするおまえは、いつか貴婦人たちの指を指輪で埋める。
    胎の扉を抜けて来たおまえは、やがて王たちの扉を打ち破る。

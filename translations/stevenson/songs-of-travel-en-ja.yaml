    十本ずつの手足の指、一つずつ貝殻のような爪、
    宝石のようにまだものを見ない目、ことばを試す舌。
    私の胸で力のない手が、やがて剣を振るうのだ！
    乳と眠りに酔って、おまえは主の日を待つ。

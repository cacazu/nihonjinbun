  "translation_status": "reviewed"
- "id": "poem-ix-stanza-01"
  "section_id": "poem-ix"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Let Beauty awake in the morn from beautiful dreams,
          Beauty awake from rest!
          Let Beauty awake
          For Beauty’s sake
    In the hour when the birds awake in the brake
          And the stars are bright in the west!
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 385
    "line_end": 390
    "source_sequence": 385
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-385-390"
  "translation_ja": |-
    朝、美しい夢から目覚めよ、美しき人。
    　　　眠りから目覚めよ！
    　　　目覚めよ、美しき人、
    　　　美のために。
    茂みの小鳥が目覚め、
    　　　西に星の明るい時に！
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-ix-stanza-02"
  "section_id": "poem-ix"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Let Beauty awake in the eve from the slumber of day,
          Awake in the crimson eve!
          In the day’s dusk end
          When the shades ascend,
    Let her wake to the kiss of a tender friend
          To render again and receive!
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 392
    "line_end": 397
    "source_sequence": 392
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-392-397"
  "translation_ja": |-
    昼のまどろみから、夕べに目覚めよ、美しき人、
    　　　紅の夕に目覚めよ！
    　　　影がせり上がり、
    　　　日が暮れはてるころ、
    やさしい友の口づけに目覚めて、
    　　　口づけを返し、また受けるように！
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

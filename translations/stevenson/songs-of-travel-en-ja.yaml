  "kind": "verse"
  "origin": "source"
  "source_text": |-
    But now I pause at whiles in what I do,
    And count the bell, and tremble lest I hear
    (My work untrimmed) the sunset gun too soon.
  "source_languages":
  - "en"
  "source_locations":

    "original_unit_id": "line-650-653"
  "translation_ja": |-
    そうやって私も笛に一節二節、吹き込んだ。
    音楽とは呼びがたくても、それしか知らなかった。
    技がなかったから音楽にはならなかったが、
    私の心を満たしていたのは凍った音楽にほかならなかった。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xix-stanza-03"
  "section_id": "poem-xix"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Chirp, chirp, I went, nor hoped a nobler strain;
    But Heaven decreed I should not pipe in vain,
    For, lo! not far from there, in secret dale,
    All silent, sat an ancient nightingale.
    My sparrow notes he heard; thereat awoke;
    And with a tide of song his silence broke.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"

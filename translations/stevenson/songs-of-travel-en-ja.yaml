  "kind": "verse"
  "origin": "source"
  "source_text": |-
    The morning drum-call on my eager ear
    Thrills unforgotten yet; the morning dew
    Lies yet undried along my field of noon.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"

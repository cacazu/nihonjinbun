  "translation_ja": |-
    けれどいまは折にふれて手を止め、
    鐘を数え、日没を告げる砲声が
    （仕事を整えぬうちに）早く来はせぬかと、ふるえる。
  "translation_status": "reviewed"
  "attributions":

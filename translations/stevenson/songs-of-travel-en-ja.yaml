    彼は来て、去った。おそらくあなたはしばらく泣き、
    　　　やがて忘れた。
    ああ、笑みを残してあなたを去った彼は
    　　　あなたを忘れない。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

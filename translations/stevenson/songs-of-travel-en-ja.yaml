- "id": "poem-xxxiv-stanza-01"
  "section_id": "poem-xxxiv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Do you remember—can we e’er forget?—
    How, in the coiled-perplexities of youth,
    In our wild climate, in our scowling town,
    We gloomed and shivered, sorrowed, sobbed and feared?
    The belching winter wind, the missile rain,
    The rare and welcome silence of the snows,
    The laggard morn, the haggard day, the night,
    The grimy spell of the nocturnal town,
    Do you remember?—Ah, could one forget!
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1066
    "line_end": 1074
    "source_sequence": 1066
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1066-1074"
  "translation_ja": |-
    覚えているか。忘れられるものか。
    若さのもつれた戸惑いのなか、
    荒れた気候、しかめ面の町で、
    沈み、震え、悲しみ、すすり泣き、怯えたものだ。
    吐き出すような冬の風、つぶてのような雨、
    まれに訪れては喜んで迎えた、雪の沈黙。
    のろい朝、やつれた昼、夜、
    夜の町の煤けた魔法。
    覚えているか。ああ、忘れられたら！
  "translation_status": "reviewed"
  "attributions":

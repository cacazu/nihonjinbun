  "translation_ja": |-
    ここでは、実りを生まない太陽が海から昇り、
    むき出しの甲板を浸し、遮るもののない目をくらませる。
    あてがわれた時のあいだ、むなしく空をめぐり、
    実りを宿さぬ海へまた飛びこむ。
    見張りをあざ笑い、
    破れる帆を帆桁からもぎ取る突風の襲撃、
    夜の凪に響く意味もない騒ぎが、
    君の眠りを乱すだろう。上下に揺れる灯のそば、
    甲虫が出て、婦人の部屋にはまったく似つかわしくない
    激しく揺れる船室で、時また時を……

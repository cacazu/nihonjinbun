- "id": "poem-vi-stanza-01"
  "section_id": "poem-vi"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    The infinite shining heavens
       Rose and I saw in the night
    Uncountable angel stars
       Showering sorrow and light.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 304
    "line_end": 307
    "source_sequence": 304
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-304-307"
  "translation_ja": |-
    かぎりなく輝く天が
    　立ち昇り、夜のなかに私は見た、
    数えきれない天使の星が
    　悲しみと光を降らせているのを。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-vi-stanza-02"
  "section_id": "poem-vi"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    I saw them distant as heaven,
       Dumb and shining and dead,
    And the idle stars of the night
       Were dearer to me than bread.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 309
    "line_end": 312
    "source_sequence": 309
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-309-312"
  "translation_ja": |-
    天のようにはるかに遠く、
    　もの言わず、輝き、死んだ星を見た。
    何をするでもない夜の星が、
    　私にはパンより愛しかった。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-vi-stanza-03"
  "section_id": "poem-vi"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Night after night in my sorrow
       The stars stood over the sea,
    Till lo!  I looked in the dusk
       And a star had come down to me.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 314
    "line_end": 317
    "source_sequence": 314
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-314-317"
  "translation_ja": |-
    悲しみに暮れる夜ごと、
    　海の上には星があった。
    やがて、見よ！　薄暮に目をやると、
    　一つの星が私のもとに降りていた。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

- "id": "poem-xxx-author-intro"
  "section_id": "poem-xxx"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "[Written in April to Kaiulani in the April of her age; and at Waikiki, within easy walk of Kaiulani’s banyan!  When she comes to my land and her father’s, and the rain beats upon the window (as I fear it will), let her look at this page; it will be like a weed gathered and pressed at home; and she will remember her own islands, and the shadow of the mighty tree; and she will hear the peacocks screaming in the dusk and the wind blowing in the palms; and she will think of her father sitting there alone.—R. L. S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 955
    "line_end": 962
    "source_sequence": 955
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-955-962"
  "translation_ja": "［四月、人生の四月にあるカイウラニに書いた。ワイキキで。カイウラニのバニヤンの木まで、歩いてすぐのところで！　私の祖国、そして彼女の父の祖国に着いて、窓に雨が打ちつけたとき（きっとそうなるのだろう）、この頁を見てほしい。ふるさとで摘んで押し葉にしておいた草のように、自分の島々を、あの大木の木陰を思い出すだろう。薄暮に孔雀が鳴き叫び、ヤシの葉に風が吹くのが聞こえるだろう。そしてあそこでひとり座っている父を思うだろう。――R・L・S］"
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

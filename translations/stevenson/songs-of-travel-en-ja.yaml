  "kind": "verse"
  "origin": "source"
  "source_text": |-
    In the highlands, in the country places,
    Where the old plain men have rosy faces,
    And the young fair maidens
    Quiet eyes;
    Where essential silence cheers and blesses,
    And for ever in the hill-recesses
    Her more lovely music
    Broods and dies.
  "source_languages":

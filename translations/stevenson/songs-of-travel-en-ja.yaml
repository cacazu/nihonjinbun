- "id": "poem-v-stanza-01"
  "section_id": "poem-v"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    She rested by the Broken Brook,
       She drank of Weary Well,
    She moved beyond my lingering look,
       Ah, whither none can tell!
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 283
    "line_end": 286
    "source_sequence": 283
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-283-286"
  "translation_ja": |-
    彼女は〈途切れ川〉のほとりで休み、
    　〈くたびれ井戸〉の水を飲んだ。
    私の見送る目の届かぬところへ行った、
    　ああ、どこへ行ったか、だれにわかろう！
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-v-stanza-02"
  "section_id": "poem-v"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    She came, she went.  In other lands,
       Perchance in fairer skies,
    Her hands shall cling with other hands,
       Her eyes to other eyes.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 288
    "line_end": 291
    "source_sequence": 288
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-288-291"
  "translation_ja": |-
    彼女は来て、去った。別の国で、
    　おそらくはもっと晴れた空の下で、
    その手は別の手を握りしめ、
    　その目は別の目を見つめるだろう。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-v-stanza-03"
  "section_id": "poem-v"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    She vanished.  In the sounding town,
       Will she remember too?
    Will she recall the eyes of brown
       As I recall the blue?
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 293
    "line_end": 296
    "source_sequence": 293
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-293-296"
  "translation_ja": |-
    彼女は消えた。にぎやかな街で、
    　彼女も思い出してくれるだろうか。
    私が青い目を思い出すように、
    　茶色の目を思い出すだろうか。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

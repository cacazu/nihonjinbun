  "source_text": |-
    Come ill or well, the cross, the crown,
       The rainbow or the thunder,
    I fling my soul and body down
       For God to plough them under.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"

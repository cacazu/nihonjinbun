- "id": "poem-xliii-stanza-01"
  "section_id": "poem-xliii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Blows the wind to-day, and the sun and the rain are flying,
       Blows the wind on the moors to-day and now,
    Where about the graves of the martyrs the whaups are crying,
       My heart remembers how!
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1617
    "line_end": 1620
    "source_sequence": 1617
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1617-1620"
  "translation_ja": |-
    今日は風が吹き、日差しと雨が飛び交う。
    　今日、このときも、風は荒野に吹く。
    殉教者の墓のまわりで、ダイシャクシギが鳴くところ、
    　その声を、私の心は覚えている！
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xliii-stanza-02"
  "section_id": "poem-xliii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Grey recumbent tombs of the dead in desert places,
       Standing stones on the vacant wine-red moor,
    Hills of sheep, and the howes of the silent vanished races,
       And winds, austere and pure:
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1622
    "line_end": 1625
    "source_sequence": 1622
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1622-1625"
  "translation_ja": |-
    人けのない場所に横たわる、死者たちの灰色の墓。
    　人影のない葡萄酒色の荒野に立つ石柱。
    羊のいる丘、今はもの言わぬ、消えた民の塚、
    　厳しく澄んだ風。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xliii-stanza-03"
  "section_id": "poem-xliii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Be it granted me to behold you again in dying,
       Hills of home! and to hear again the call;
    Hear about the graves of the martyrs the peewees crying,
       And hear no more at all.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1627
    "line_end": 1630
    "source_sequence": 1627
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1627-1630"
  "translation_ja": |-
    死ぬときにもう一度、あなたを見られるように、
    　ふるさとの丘よ！　あの声をまた聞けるように。
    殉教者の墓のまわりで鳴くタゲリの声を聞いて、
    　もうそれきり、何も聞かずにいられますように。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

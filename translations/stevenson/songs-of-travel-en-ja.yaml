    "original_unit_id": "line-722-725"
  "translation_ja": |-
    私は上り坂を踏み、下り坂を踏んだ。
    過ぎた日々には堪え忍び、事をなした。
    あらゆるものを切望し、希望に別れを告げた。
    そして、生きて、愛して、扉を閉じた。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

- "id": "poem-xliv-stanza-01"
  "section_id": "poem-xliv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    The embers of the day are red
    Beyond the murky hill.
    The kitchen smokes: the bed
    In the darkling house is spread:
    The great sky darkens overhead,
    And the great woods are shrill.
    So far have I been led,
    Lord, by Thy will:
    So far I have followed, Lord, and wondered still.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1640
    "line_end": 1648
    "source_sequence": 1640
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1640-1648"
  "translation_ja": |-
    昼の熾火が赤い、
    薄暗い丘の向こう。
    台所から煙が上り、
    暮れゆく家に床が延べてある。
    頭上には大きな空が暮れ、
    大きな森には鋭い声が響く。
    ここまで私は導かれてきた、
    主よ、御心によって。
    ここまで私は従ってきた、主よ、いまなお不思議に思いながら。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xliv-stanza-02"
  "section_id": "poem-xliv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    The breeze from the enbalmèd land
    Blows sudden toward the shore,
    And claps my cottage door.
    I hear the signal, Lord—I understand.
    The night at Thy command
    Comes.  I will eat and sleep and will not question more.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1650
    "line_end": 1655
    "source_sequence": 1650
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1650-1655"
  "translation_ja": |-
    香りのこもる陸から風が
    にわかに岸へと吹き、
    小屋の戸を打つ。
    合図が聞こえます、主よ。わかりました。
    あなたの命で夜が
    来ます。私は食べて眠り、もう問いはしません。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

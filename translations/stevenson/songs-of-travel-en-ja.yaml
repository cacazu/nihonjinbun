    "line_end": 625
    "source_sequence": 618
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-618-625"
  "translation_ja": |-
    嵐の夕暮れはいま、むなしく暮れてゆく。
    風は声高に泣き、横なぐりの雨が打つ。
    　　　ここは雨風を防ぐ家、
    　　　火が壁に色を塗る家。
    　　　外の風を聞き、
    　　　呼び声のような突風を聞く。
    「吹け、吹け」と私は叫ぶ。「頬が裂けてもむだだ！
    吹け、吹け。愛する人はもう帰った！」
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xviii-stanza-02"
  "section_id": "poem-xviii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Yon ship you chase perchance but yesternight
    Bore still the precious freight of my delight,
          That here in sheltered house
          With fire-ypainted walls,
          Now hears the wind abroad,
          Now harks the calling squalls.
    ‘Blow, blow,’ I cry, ‘in vain you rouse the sea,
    My rescued sailor shares the fire with me!’
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 627
    "line_end": 634
    "source_sequence": 627
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-627-634"
  "translation_ja": |-
    おまえが追うあの船には、昨日の夜までは
    私を喜ばせる何より貴い荷があったかもしれない。
    　　　ここは雨風を防ぐ家、
    　　　火が壁に色を塗る家。
    　　　あの人はいま外の風を聞き、
    　　　呼び声のような突風を聞く。
    「吹け、吹け」と私は叫ぶ。「海をかき立ててもむだだ。
    助かった船乗りは、私と一緒に火に当たっている！」
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

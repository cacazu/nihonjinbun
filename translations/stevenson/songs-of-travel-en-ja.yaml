  "translation_ja": |-
    森じゅうで、小川の音も鳥の声も、
    斧を打つわが音のほか何も聞こえず、
    森は真昼の衣裳、
    沈黙の栄光をまとっていた。
    島の頂から海まで、
    木はのぼり、木は垂れ、木は
    すきまを手探りするように上へ伸びた。緑は
    崖の裾も谷間も、幾尋の深さまで
    木陰に包んでいた。数知れず
    森の荒々しい柱が、
    枝の房が立っていた。
    群衆のように密に、海のように深く、
    永遠のように静かに。
    斧を下げ、頭をうしろに向け、
    つい先ほど、雇った男がこの場所から逃げ、
    もつれた話を持って帰ってきた。
    地獄の住人、死者か、
    権威を剥がされた神が、
    すぐうしろから彼をうかがい、つけてきて、
    彼がきびすを返して逃げると、勝ち誇ったという。
    私の身にはなんと違う運が巡ったことか！
    薄暗い並木の回廊を目で探り、
    姿を見せぬ影を待ちわびた。
    恥ずかしがりの妖精、青白く冷たい木の精、
    それとも古代から居残る謎の何者か。
    探すだけむだだった。美しく荘重なものたちは、
    亡き王たちのように表情もなく、
    森の静けさのなかで、静かに立ち、
    もの言わなかった。地に根ざす群衆は、
    うなずき、思いに沈み、花を開き、夢を見た。
    意味もなく、誰にも見透かされず。見るかぎり
    大地をつかみ、青空を求めるよりほか、
    技も望みも知らなかった。
    植物の王、祭司、
    若者たちのなか、私（ただ一匹の獣）は
    獣の仕事、殺しをしていた。
    しぶとい根を断ち切り、
    光を失った葉を地面にまき散らし、
    若木を束になって倒れさせた。
    もつれあう草木に押し入り、
    できた廃墟を私は小道と呼んだ。
    そこはゴルゴタだった。やがて
    雨が潤し、太陽が照り、
    種がその地を富ませたなら実を結び、
    庭と呼ばれる場所だった。そこここで
    いっそう必死で生きようとする敵を見つけ、
    緑の髪をつかんで引き抜いた。
    歯を持つ、殺し屋のオジギソウ。
    半ば意識があるかのように、それは襲撃をかわし、
    身をすくめ、枝をたたんで引いた。
    地に繋がる根をいっぱいに張り、
    引き抜く私の手をとらえて引っかいた。
    うずくまるのが見え、噛みつくのを感じた。
    その瞬間、ものを見る目が開かれた。
    森のあるがままが見えた。
    敗れた側も、勝利を収めた側も。
    命を賭けた戦いが陣列を敷くのを、
    無言の武器が切り結び、光るのを見た。
    静かな敗北、静かな攻撃、
    戦場であり、地下の墓所だった。

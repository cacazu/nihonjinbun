    "line_end": 254
    "source_sequence": 250
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-250-254"
  "translation_ja": |-
    月の落ちた夜に星がひしめくように、
    快楽が彼に群がる。だが気高い運命へ
    彼はゆく。通りすがりに手を振るばかり、
    園の門の彼女に一声かけるばかり、
    少年めいた一節を歌えば、もう顔は見えぬ。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

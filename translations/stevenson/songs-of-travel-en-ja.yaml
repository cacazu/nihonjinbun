  "translation_ja": |-
    生命のわき立つ泥のなか、私を囲んで密集し、
    茨とシダは血を流さんばかりに争った。
    鉤を持つつる草が罠をかけ、
    気乗りせぬ隣人たちを輪縄で締めた。
    緑の殺し屋はそこで繁り、勢力を伸ばし、
    締めつけて息を奪った獲物を糧に、
    這い上る蔓のうえに戯れた。
    張りあう根は土を求めて
    怯えた悪魔のように戦い、枝は
    空気を求めて必死に押しあった。
    上から、緑の征服者は
    死者の体をまたいで立った。
    森の戦場のカエサルたち、
    負けを知らぬまま、敗北する運命にあった。
    見よ、枝の股に
    蘭という腫れ物が育っている。
    柵で区切った土俵で
    認められた二人の力士が無言で押し、組むように、
    黄色いフーグリーの岸で
    囚われの者らが息を詰まらせ黙って死んだように、
    森の戦は静かに続いて
    やむことがない。無言の敵たちは
    組み、息の根を止め、もがき、抱きしめる。
    叫びも、あえぎもない。
    神よ、ここにもあなたの箕が鳴り、
    ここにも御旗がはためく。
    森と町、海と岸、
    この地まるごと、あなたの脱穀場！
    戦の太鼓も、平和の太鼓も、
    町々を間断なく轟かせ、
    生の鉄の広間という広間が
    やむことのない争いに鳴り響く。

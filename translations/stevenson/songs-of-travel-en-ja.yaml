  "translation_status": "reviewed"
- "id": "poem-xxviii-stanza-01"
  "section_id": "poem-xxviii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Since long ago, a child at home,
    I read and longed to rise and roam,
    Where’er I went, whate’er I willed,
    One promised land my fancy filled.
    Hence the long roads my home I made;
    Tossed much in ships; have often laid
    Below the uncurtained sky my head,
    Rain-deluged and wind-buffeted:
    And many a thousand hills I crossed
    And corners turned—Love’s labour lost,
    Till, Lady, to your isle of sun
    I came, not hoping; and, like one
    Snatched out of blindness, rubbed my eyes,
    And hailed my promised land with cries.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 877
    "line_end": 890
    "source_sequence": 877
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-877-890"
  "translation_ja": |-
    ずっと昔、家にいた子どものころから
    本を読み、立ち上がって遠くをさまよいたいと願った。
    どこに行っても、何を望んでも、
    約束の地が一つ、私の想像を満たしていた。
    そこで果てしない道をわが家とし、
    船でさんざん揺られ、幾度も
    幕もない空の下に頭を横たえ、
    雨を浴び、風に打たれた。
    幾千もの丘を越え、
    幾度も角を曲がった。恋の骨折り損だった。
    けれども、姫よ、あなたの陽光の島へ
    期待もせずやって来たとき、目の見えぬ闇から
    急に引き出された者のように目をこすり、
    声をあげて約束の地を迎えた。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxviii-stanza-02"
  "section_id": "poem-xxviii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Yes, Lady, here I was at last;
    Here found I all I had forecast:
    The long roll of the sapphire sea
    That keeps the land’s virginity;
    The stalwart giants of the wood
    Laden with toys and flowers and food;
    The precious forest pouring out
    To compass the whole town about;
    The town itself with streets of lawn,
    Loved of the moon, blessed by the dawn,
    Where the brown children all the day
    Keep up a ceaseless noise of play,
    Play in the sun, play in the rain,
    Nor ever quarrel or complain;—
    And late at night, in the woods of fruit,
    Hark! do you hear the passing flute?
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 892
    "line_end": 907
    "source_sequence": 892
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-892-907"
  "translation_ja": |-
    ええ、姫よ、とうとうここへ着きました。
    思い描いたものが、ここにはみなありました。
    この地のけがれなさを守る
    サファイアの海の、長いうねり。
    玩具や花や食べ物をたわわに載せた
    森のたくましい巨人たち。
    あふれ出すかけがえのない森が、
    町をぐるりと囲む。
    町には芝の道が走り、
    月に愛され、曙に祝福される。
    褐色の子どもらは一日じゅう
    やむことなく声をあげて遊ぶ。
    日差しの下でも雨のなかでも遊び、
    喧嘩ひとつせず、文句も言わない。
    そして夜更け、実のなる木立のなか、
    ほら、通り過ぎる笛の音が聞こえませんか。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxviii-stanza-03"
  "section_id": "poem-xxviii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    I threw one look to either hand,
    And knew I was in Fairyland.
    And yet one point of being so
    I lacked.  For, Lady (as you know),
    Whoever by his might of hand,
    Won entrance into Fairyland,
    Found always with admiring eyes
    A Fairy princess kind and wise.
    It was not long I waited; soon
    Upon my threshold, in broad noon,
    Gracious and helpful, wise and good,
    The Fairy Princess Moë stood. {44}
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 909
    "line_end": 920
    "source_sequence": 909
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-909-920"
  "translation_ja": |-
    左右に一度目をやっただけで、
    妖精の国にいるのだとわかった。
    それでも本当にそうだと言うには
    ひとつ足りなかった。姫よ、ご存じのとおり、
    わが手の力で
    妖精の国に入ることを許された者は、
    かならず感嘆の目で見いだすからです、
    やさしく賢い妖精の王女を。
    待ったのはわずかな時。間もなく
    真昼、私の戸口に、
    品があり親切で、賢く善良な、
    妖精の王女モエが立っていました。〔44〕
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

  "translation_ja": |-
    耳をそばだてた私に響いた朝の太鼓、
    そのときの震えをまだ忘れない。朝露も
    正午のわが畑にはまだ乾かずにいる。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

- "id": "poem-i-stanza-01"
  "section_id": "poem-i"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Give to me the life I love,
       Let the lave go by me,
    Give the jolly heaven above
       And the byway nigh me.
    Bed in the bush with stars to see,
       Bread I dip in the river—
    There’s the life for a man like me,
       There’s the life for ever.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 176
    "line_end": 183
    "source_sequence": 176
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-176-183"
  "translation_ja": |-
    好きな暮らしをこのおれに、
    　ほかは素通りするがいい、
    陽気な空を頭の上に、
    　すぐそばに脇道を。
    藪を寝床に星を見て、
    　パンは川の水に浸して。
    おれのような男にはこれだ、
    　いついつまでもこの暮らし。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-i-stanza-02"
  "section_id": "poem-i"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Let the blow fall soon or late,
       Let what will be o’er me;
    Give the face of earth around
       And the road before me.
    Wealth I seek not, hope nor love,
       Nor a friend to know me;
    All I seek, the heaven above
       And the road below me.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 185
    "line_end": 192
    "source_sequence": 185
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-185-192"
  "translation_ja": |-
    早かろうと遅かろうと、降りかかるなら来るがいい、
    　何が降ろうとかまうものか。
    大地の顔を見渡せて、
    　前に道さえあればいい。
    富も希望も恋もいらぬ、
    　おれをわかる友もいらぬ。
    望むのは頭上の空と、
    　足の下の道ばかり。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-i-stanza-03"
  "section_id": "poem-i"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Or let autumn fall on me
       Where afield I linger,
    Silencing the bird on tree,
       Biting the blue finger.
    White as meal the frosty field—
       Warm the fireside haven—
    Not to autumn will I yield,
       Not to winter even!
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 194
    "line_end": 201
    "source_sequence": 194
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-194-201"
  "translation_ja": |-
    野に逗留するおれに
    　秋が襲いかかるがいい、
    木に鳴く鳥を黙らせ、
    　青くかじかむ指に噛みつけ。
    霜の野は粉のように白く、
    　炉端のねぐらは暖かい。
    だが、おれは秋に屈しない、
    　冬にだって屈しない！
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

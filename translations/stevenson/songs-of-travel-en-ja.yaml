    "original_unit_id": "line-223-226"
  "translation_ja": |-
    ごきげんよう、そしてさらば！　立ち上がり、
    　肥えた牛はここに残し、
    異国の大地と空を画布に
    　戦いの遍歴を描こう。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-ii-stanza-03"
  "section_id": "poem-ii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    The untented Kosmos my abode,
       I pass, a wilful stranger:
    My mistress still the open road
       And the bright eyes of danger.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"

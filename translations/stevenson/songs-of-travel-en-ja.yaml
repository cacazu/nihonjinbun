- "id": "poem-xv-stanza-03"
  "section_id": "poem-xv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    O to dream, O to awake and wander
    There, and with delight to take and render,
    Through the trance of silence,
    Quiet breath;
    Lo! for there, among the flowers and grasses,
    Only the mightier movement sounds and passes;
    Only winds and rivers,
    Life and death.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 548
    "line_end": 555
    "source_sequence": 548
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-548-555"
  "translation_ja": |-
    ああ、そこで夢を見て、目覚め、さまよい、
    静けさに我を忘れながら、
    喜びをもって吸い、また吐きたい、
    静かな息を。
    見よ、あそこでは草花の間を
    より大きな営みだけが響き、通りゆく。
    風と川だけが、
    生と死だけが。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

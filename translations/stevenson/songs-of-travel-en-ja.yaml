  "origin": "source"
  "source_text": |-
    Once only by the garden gate
       Our lips we joined and parted.
    I must fulfil an empty fate
       And travel the uncharted.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"

    "line_end": 660
    "source_sequence": 655
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-655-660"
  "translation_ja": |-
    ちちっ、ちちっ、と鳴き、もっと気高い調べは期待もしなかった。
    しかし天の定めで、吹いてもむだにはならなかった。
    見よ、そう遠くない隠れ谷で、
    年老いたナイチンゲールが、静まりかえっていた。
    スズメのような私の声を聞き、それで目を覚まし、
    潮のように押し寄せる歌声で、みずからの沈黙を破った。
  "translation_status": "reviewed"

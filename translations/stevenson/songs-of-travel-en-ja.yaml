  "translation_ja": |-
    明るくことばが響くのは
    　鳴らすにふさわしい人が鳴らすとき。
    歌が美しい調べをなすのは
    　歌い手がそれを歌うとき。
    歌われ、語られ、やむことなく、
    　翼に乗って運ばれてゆく、
    歌い手が死んで、
    　作り手が土に埋められたあとも。
  "translation_status": "reviewed"

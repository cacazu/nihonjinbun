    陛下、王が愛でるものを吟遊詩人が王に贈るのは、
    竪琴と同じほど古い権利でございます。
    アポロンにかけて贈るのは私の役目、
    贈り物がふさわしいなら、受け取るのは陛下の役目。
    黄金の手に、黄金の真珠をお持ちしました。
    島の王に、海の宝石を。

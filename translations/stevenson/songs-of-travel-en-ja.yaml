  "translation_ja": |-
    彼女の国から、私の国へ行く、
    島の娘、島の薔薇。
    心は軽く、顔は明るい、
    二つの民の血を引く娘。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

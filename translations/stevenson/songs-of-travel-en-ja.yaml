- "id": "poem-xx-stanza-01"
  "section_id": "poem-xx"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    I knew thee strong and quiet like the hills;
    I knew thee apt to pity, brave to endure,
    In peace or war a Roman full equipt;
    And just I knew thee, like the fabled kings
    Who by the loud sea-shore gave judgment forth,
    From dawn to eve, bearded and few of words.
    What, what, was I to honour thee?  A child;
    A youth in ardour but a child in strength,
    Who after virtue’s golden chariot-wheels
    Runs ever panting, nor attains the goal.
    So thought I, and was sorrowful at heart.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 668
    "line_end": 678
    "source_sequence": 668
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-668-678"
  "translation_ja": |-
    あなたが丘のように強く、静かなことを知っていた。
    思いやり深く、勇敢に堪え忍び、
    平時にも戦時にもそなえ万全のローマ人のようだと知っていた。
    また、あなたが公正なのを知っていた。伝説の王たちのように。
    どよめく海辺で裁きを宣した王たち、
    夜明けから夕暮れまで、髭をたくわえ、ことば少なに。
    この私に、どうしてあなたを讃える資格があろう。ただの子どもだ。
    熱意は若者のそれでも、力はまだ子ども。
    徳の黄金の戦車を追い、その車輪のあとを
    喘ぎながら走りつづけ、決して行き着くことはない。
    そう思い、心には悲しみがあった。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xx-stanza-02"
  "section_id": "poem-xx"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Since then my steps have visited that flood
    Along whose shore the numerous footfalls cease,
    The voices and the tears of life expire.
    Thither the prints go down, the hero’s way
    Trod large upon the sand, the trembling maid’s:
    Nimrod that wound his trumpet in the wood,
    And the poor, dreaming child, hunter of flowers,
    That here his hunting closes with the great:
    So one and all go down, nor aught returns.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 680
    "line_end": 688
    "source_sequence": 680
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-680-688"
  "translation_ja": |-
    それから私はあの大河まで歩いた。
    その岸辺で無数の足音は絶え、
    生の声も涙も息を引き取る。
    足跡はそこへ下ってゆく。砂に大きく残る英雄の足跡も、
    ふるえる娘の足跡も。
    森で角笛を吹き鳴らしたニムロドも、
    花を追い、夢を見るあわれな子どもも、
    ここで偉大な者らとともに狩りを終える。
    こうしてみな下ってゆき、何ひとつ戻らない。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xx-stanza-03"
  "section_id": "poem-xx"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    For thee, for us, the sacred river waits,
    For me, the unworthy, thee, the perfect friend;
    There Blame desists, there his unfaltering dogs
    He from the chase recalls, and homeward rides;
    Yet Praise and Love pass over and go in.
    So when, beside that margin, I discard
    My more than mortal weakness, and with thee
    Through that still land unfearing I advance:
    If then at all we keep the touch of joy
    Thou shalt rejoice to find me altered—I,
    O Felix, to behold thee still unchanged.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 690
    "line_end": 700
    "source_sequence": 690
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-690-700"
  "translation_ja": |-
    あなたを、私たちを、聖なる川は待っている。
    ふさわしくない私を、申し分のない友であるあなたを。
    そこでは〈非難〉が手を引き、たゆまぬ猟犬を
    狩りから呼び戻し、馬で家路につく。
    ただ〈讃美〉と〈愛〉は対岸に渡り、その地に入る。
    だから、私が岸辺で
    人並みはずれた弱さを脱ぎ捨て、あなたとともに
    恐れずにその静かな地を進むとき、
    喜びを感じる心がまだ少しでもあるのなら、
    あなたは変わった私を見て喜び、私は、
    ああフェリクスよ、変わらぬあなたを見て喜ぶだろう。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

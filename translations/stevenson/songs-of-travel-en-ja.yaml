    "original_unit_id": "line-931-938"
  "translation_ja": |-
    陛下、〈銀の船〉、そう呼ばれた船です、
    あなたの祖先が来た、あの明るい島々では。〔45〕
    風と潮から身を休めた〈銀の船〉は、
    陛下の港、宮殿の下に錨をおろします。
    船乗りは無事に岸辺に座り、
    いそいそとした商人のように宝を数えます。
    そこに不思議な美しいもの、贈り物が一つ。
    王のお気に召したいま、二倍も貴いものです。
  "translation_status": "reviewed"
  "attributions":

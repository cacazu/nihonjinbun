    悲しい夢のなかに、立っているあなたを見る、
    　　　昔のように。
    手にした忘れられた形見も
    　　　もう役には立たない。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-iv-stanza-02"
  "section_id": "poem-iv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    No more the morning glow, no more the grace,
          Enshrines, endears.
    Cold beats the light of time upon your face
          And shows your tears.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"

  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Farewell, fair day and fading light!
    The clay-born here, with westward sight,
    Marks the huge sun now downward soar.
    Farewell.  We twain shall meet no more.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 749
    "line_end": 752
    "source_sequence": 749
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-749-752"
  "translation_ja": |-
    さらば、美しき日、消えゆく光！
    土から生まれた者はここに、西に目を向け、
    大きな太陽が下方へと翔けてゆくのを見る。
    さらば。おまえと私は二度と会わぬ。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxiv-stanza-02"
  "section_id": "poem-xxiv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Farewell.  I watch with bursting sigh
    My late contemned occasion die.
    I linger useless in my tent:
    Farewell, fair day, so foully spent!
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 754
    "line_end": 757
    "source_sequence": 754
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-754-757"
  "translation_ja": |-
    さらば。いましがた侮った好機が死ぬのを、
    こみ上げるため息とともに見送る。
    天幕に、役も果たせず私は居残る。
    さらば、美しき日よ、なんとみじめに費やしたことか！
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxiv-stanza-03"
  "section_id": "poem-xxiv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Farewell, fair day.  If any God
    At all consider this poor clod,
    He who the fair occasion sent
    Prepared and placed the impediment.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 759
    "line_end": 762
    "source_sequence": 759
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-759-762"
  "translation_ja": |-
    さらば、美しき日。もしどこかに神がいて、
    こんなあわれな土くれを少しでも顧みるなら、
    美しい機会を送ったその神こそが、
    障害を用意して置いたのだ。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxiv-stanza-04"
  "section_id": "poem-xxiv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Let him diviner vengeance take—
    Give me to sleep, give me to wake
    Girded and shod, and bid me play
    The hero in the coming day!
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 764
    "line_end": 767
    "source_sequence": 764
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-764-767"
  "translation_ja": |-
    ならば、もっと神らしい仕返しをしておくれ。
    私を眠らせ、そして
    帯を締め靴を履いて目覚めさせ、来る日には
    英雄を演じよと命じてくれ！
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

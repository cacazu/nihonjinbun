- "id": "poem-xxxi-stanza-01"
  "section_id": "poem-xxxi"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    To see the infinite pity of this place,
    The mangled limb, the devastated face,
    The innocent sufferer smiling at the rod—
    A fool were tempted to deny his God.
    He sees, he shrinks.  But if he gaze again,
    Lo, beauty springing from the breast of pain!
    He marks the sisters on the mournful shores;
    And even a fool is silent and adores.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"

  "section_id": "poem-ii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Hail and farewell!  I must arise,
       Leave here the fatted cattle,
    And paint on foreign lands and skies
       My Odyssey of battle.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"

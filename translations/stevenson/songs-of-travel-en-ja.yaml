  "origin": "source"
  "source_text": |-
    Forth from her land to mine she goes,
    The island maid, the island rose,
    Light of heart and bright of face:
    The daughter of a double race.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"

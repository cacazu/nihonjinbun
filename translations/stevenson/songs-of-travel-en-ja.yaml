- "id": "poem-xxxvii-stanza-03"
  "section_id": "poem-xxxvii-song-i"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Bride of the shark, her valour first I sing
    Who on the lone seas quickened of a King.
    She, from the shore and puny homes of men,
    Beyond the climber’s sea-discerning ken,
    Swam, led by omens; and devoid of fear,
    Beheld her monstrous paramour draw near.
    She gazed; all round her to the heavenly pale,
    The simple sea was void of isle or sail—
    Sole overhead the unsparing sun was reared—
    When the deep bubbled and the brute appeared.
    But she, secure in the decrees of fate,
    Made strong her bosom and received the mate,
    And, men declare, from that marine embrace
    Conceived the virtues of a stronger race.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1239
    "line_end": 1252
    "source_sequence": 1239
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1239-1252"
  "translation_ja": |-
    鮫の花嫁。まずその勇気を私は歌う。
    ひと気のない海で、王を身ごもった女だ。
    浜辺、人間のちっぽけな住まいをあとに、
    木登りで海を見はるかす目にも届かぬところまで、
    しるしに導かれて泳いだ。恐れもせず、
    異形の恋人が近づくのを見た。
    見渡すと、空の縁まで四方は
    ただ海で、島影ひとつ帆ひとつなく、
    頭上にはようしゃない太陽がそそり立つばかり。
    そこへ深みがあぶくを立て、けだものが姿を現した。
    けれども彼女は運命の定めに安心し、
    胸を強くして相手を受け入れた。
    人が言うには、その海の抱擁で
    いっそう強い民の資質を身ごもったという。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

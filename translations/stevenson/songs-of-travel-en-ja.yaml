  "translation_ja": |-
    女である私の身から生まれた息子よ、笛と太鼓に合わせておまえは行く、
    恋の色を、そして人生の裏側を味わいに。
    優美なものから粗野なものが、かよわいものから強いものが、
    とこしえに、女の身から男が生まれる。
  "translation_status": "reviewed"
  "attributions":

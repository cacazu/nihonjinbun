    "contributor_id": "stevenson"
- "id": "poem-xxxiv-stanza-02"
  "section_id": "poem-xxxiv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    As when the fevered sick that all night long
    Listed the wind intone, and hear at last
    The ever-welcome voice of chanticleer
    Sing in the bitter hour before the dawn,—
    With sudden ardour, these desire the day:
    So sang in the gloom of youth the bird of hope;
    So we, exulting, hearkened and desired.
    For lo! as in the palace porch of life
    We huddled with chimeras, from within—
    How sweet to hear!—the music swelled and fell,
    And through the breach of the revolving doors
    What dreams of splendour blinded us and fled!
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1076
    "line_end": 1087
    "source_sequence": 1076
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1076-1087"
  "translation_ja": |-
    熱のある病人が夜どおし
    風のうなりを聞き、ようやく
    いつも待っていた雄鶏の声が
    夜明け前のつらい時刻に鳴くのを聞き、
    急に熱く、昼を待ち望むように。
    若い日の暗がりにも希望の鳥が鳴き、
    私たちは胸を躍らせて聞き、待ち望んだ。
    見よ、人生の宮殿の入口に
    幻の獣たちと身を寄せていた私たちに、中から
    なんと心地よいことに、音楽がふくらみ、しぼんで聞こえた。
    回転扉のすきまからどんなに輝かしい夢が
    私たちの目をくらませ、そして逃げたことか！
  "translation_status": "reviewed"
  "attributions":

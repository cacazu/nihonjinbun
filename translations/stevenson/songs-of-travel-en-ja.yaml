- "id": "poem-xxxvii-stanza-04"
  "section_id": "poem-xxxvii-song-ii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Her stern descendant next I praise,
    Survivor of a thousand frays:—
    In the hall of tongues who ruled the throng;
    Led and was trusted by the strong;
    And when spears were in the wood,
    Like a tower of vantage stood:—
    Whom, not till seventy years had sped,
    Unscarred of breast, erect of head,
    Still light of step, still bright of look,
    The hunter, Death, had overtook.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1256
    "line_end": 1265
    "source_sequence": 1256
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1256-1265"
  "translation_ja": |-
    次に私は、厳めしいその子孫を讃える。
    幾千の乱戦を生き延びた者。
    言葉を交わす広間では群衆を治め、
    強者を導き、強者から信頼され、
    森に槍が立つときには、
    戦場を見おろす塔のように立った。
    七十年の歳月が過ぎるまでは、
    胸に傷もなく、頭をすっくと上げ、
    足取りはまだ軽く、顔もまだ明るく、
    猟師〈死〉も彼に追いつけなかった。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"

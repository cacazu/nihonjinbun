  "section_id": "poem-xix"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    In the belovèd hour that ushers day,
    In the pure dew, under the breaking grey,
    One bird, ere yet the woodland quires awake,
    With brief réveillé summons all the brake:
    Chirp, chirp, it goes; nor waits an answer long;
    And that small signal fills the grove with song.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 643
    "line_end": 648
    "source_sequence": 643
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-643-648"
  "translation_ja": |-
    夜明けを導く、いとしい時刻に、
    灰色の夜が明けそめ、露の清らかななか、
    森の聖歌隊が目を覚ますより先に、一羽が
    短い起床ラッパで茂みじゅうを呼び起こす。
    ちちっ、ちちっ、と鳴いて、返事はすぐに来る。
    その小さな合図が木立を歌で満たす。
  "translation_status": "reviewed"

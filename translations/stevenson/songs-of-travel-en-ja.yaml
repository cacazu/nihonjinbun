  "section_id": "poem-x"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    I know not how it is with you—
       I love the first and last,
    The whole field of the present view,
       The whole flow of the past.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"

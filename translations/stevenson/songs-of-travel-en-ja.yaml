  "translation_ja": |-
    みなに共通の運命には、めったに気づかない。
    大勢が死んでも目を向けず、悲しみもしない。
    ラッパが鳴れば、わずかの死を悼む！
    ワーテルローの小部隊が何だというのか。
    人を呑むウィルダネスでの
    わずか何百人の増減が何だというのか。
    デリーの尾根で血を流した一握りが何だというのか。
    それより、ロンドンよ、おまえの橋を踏み鳴らして
    青白い大隊が通るのを見よ。
    殺す覚悟を固め、みずからの死も甘受する者たち。
    数えるなら、兄弟の情けもないパンの戦いで
    傷つき、倒れた者をみな数えよ。
    むしろ、もっと蒸し暑い空の下で
    草木のロンドンが数々そびえ、
    増え、音もなく苦しむのを見よ。
    あるいは、あなたの静かな庭で、
    夕闇が降りるなか、満ち足りて
    ぶらつき、薔薇が咲くのを眺めてみよ。
    この薔薇を生かすために、幾千の命が失われたことか！
    一日じゅう、むごい鍬が振るわれ、
    一日じゅう、救護の手押し車が転がった。
    やさしく、親切で、快活なあなたの妻は、
    長い手袋をはめ、草取り鋤を握り、
    草木の血を浴びた。
    長かった虐殺も終わったいま、
    見よ、煙がゆるゆると輪を描いて昇るのを。
    夕べ、見よ、焚火が赤々とはぜるのを、
    罪なき死者のために。

- "id": "poem-xxv-stanza-01"
  "section_id": "poem-xxv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    God, if this were enough,
    That I see things bare to the buff
    And up to the buttocks in mire;
    That I ask nor hope nor hire,
    Nut in the husk,
    Nor dawn beyond the dusk,
    Nor life beyond death:
    God, if this were faith?
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 775
    "line_end": 782
    "source_sequence": 775
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-775-782"
  "translation_ja": |-
    神よ、もしこれで足りるなら。
    何もかも素っ裸で、
    尻まで泥に浸かっているさまを見て、
    希望も報酬も求めず、
    殻の中の実も、
    夕闇の向こうの夜明けも、
    死の向こうの生も求めぬこと、
    神よ、それが信仰だとしたら？
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxv-stanza-02"
  "section_id": "poem-xxv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Having felt thy wind in my face
    Spit sorrow and disgrace,
    Having seen thine evil doom
    In Golgotha and Khartoum,
    And the brutes, the work of thine hands,
    Fill with injustice lands
    And stain with blood the sea:
    If still in my veins the glee
    Of the black night and the sun
    And the lost battle, run:
    If, an adept,
    The iniquitous lists I still accept
    With joy, and joy to endure and be withstood,
    And still to battle and perish for a dream of good:
    God, if that were enough?
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 784
    "line_end": 798
    "source_sequence": 784
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-784-798"
  "translation_ja": |-
    あなたの風が私の顔に
    悲しみと辱めを吹きつけるのを感じ、
    ゴルゴタとハルツームに
    あなたのむごい裁きを見、
    御手が作ったけだものが
    不正で陸を満たし、
    血で海を汚すのを見ても、
    それでも私の血管を
    漆黒の夜と太陽と
    敗れた戦いの喜びが流れるなら。
    勝手を心得ながらも、
    私はなお不義に満ちた闘技場を受け入れ、
    耐えることも、抗われることも喜び、
    なお善の夢のために戦って滅びることを喜ぶなら。
    神よ、それで足りるとしたら？
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-xxv-stanza-03"
  "section_id": "poem-xxv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    If to feel, in the ink of the slough,
    And the sink of the mire,
    Veins of glory and fire
    Run through and transpierce and transpire,
    And a secret purpose of glory in every part,
    And the answering glory of battle fill my heart;
    To thrill with the joy of girded men
    To go on for ever and fail and go on again,
    And be mauled to the earth and arise,
    And contend for the shade of a word and a thing not seen with the eyes:
    With the half of a broken hope for a pillow at night
    That somehow the right is the right
    And the smooth shall bloom from the rough:
    Lord, if that were enough?
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 800
    "line_end": 814
    "source_sequence": 800
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-800-814"
  "translation_ja": |-
    泥沼の墨のような闇、
    ぬかるみの底にも、
    栄光と炎の筋が
    走り、貫き、表ににじみ出すのを感じ、
    隅々に栄光のひそかな意図を感じ、
    それに応える戦いの栄光が胸に満ちるなら。
    武具を帯びた者の喜びに震え、
    いつまでも進むこと、敗れてはまた進むこと、
    地に叩き伏せられては起き上がること、
    ことばの影と、目に見えないもののため争うことができるなら。
    砕けた希望の半分しか、夜に頭を置く枕はない。
    それでもどうにか、正しいものは正しく、
    荒々しいものから穏やかなものが咲き出るという望み。
    主よ、それで足りるとしたら？
  "translation_status": "reviewed"

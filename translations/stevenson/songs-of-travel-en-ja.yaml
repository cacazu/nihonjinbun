  "translation_ja": |-
    恥じることなく、私は狭い目的に従う。
    わが羊を養い、柵を見回り、
    狼にも他の群れにも戦を言い渡す、
    神と朝の岩場にいる
    敬虔なならず者だ。時が背を曲げるか
    敵が私を打ち破るとき、騎士となったことのない
    市井の人は踏み入れぬ所へ、
    戦の鎧をまとい、誉れの
    鳴り響く階段をのぼろう。そして勝者は
    戦に倒れた戦士と、私に声をかけてくれ。

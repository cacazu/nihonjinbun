    朝の輝きも、あの優美さも、もうあなたを
    　　　包み、いとしく見せてはくれない。
    時の光は冷たくあなたの顔を打ち、
    　　　その涙を照らし出す。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-iv-stanza-03"
  "section_id": "poem-iv"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    He came and went.  Perchance you wept a while
          And then forgot.
    Ah me! but he that left you with a smile
          Forgets you not.
  "source_languages":

- "id": "poem-xxxvii-author-intro"
  "section_id": "poem-xxxvii"
  "kind": "paragraph"
  "origin": "source"
  "source_text": "[At my departure from the island of Apemama, for which you will look in vain in most atlases, the King and I agreed, since we both set up to be in the poetical way, that we should celebrate our separation in verse. Whether or not his Majesty has been true to his bargain, the laggard posts of the Pacific may perhaps inform me in six months, perhaps not before a year.  The following lines represent my part of the contract, and it is hoped, by their pictures of strange manners, they may entertain a civilised audience.  Nothing throughout has been invented or exaggerated; the lady herein referred to as the author’s muse has confined herself to stringing into rhyme facts or legends that I saw or heard during two months’ residence upon the island.—R. L. S.]"
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 1200
    "line_end": 1210
    "source_sequence": 1200
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-1200-1210"
  "translation_ja": "［たいていの地図帳ではいくら探しても見つからないアペママ島を去るとき、王と私は、ともに詩人を気取る身だから、別れを詩で祝おうと申し合わせた。陛下が約束を果たしたかどうかは、太平洋ののろい郵便が半年もすれば知らせてくれるかもしれないし、一年は知らせが来ないかもしれない。以下の詩行は私が約束を果たしたしるしで、見慣れぬ習俗の情景が文明国の読者を楽しませてくれればと思う。全篇にわたり、作り事も誇張もない。ここで作者の詩の女神として出てくるご婦人は、私が島の二か月の滞在中に見聞きした事実や伝説を韻に連ねただけである。――R・L・S］"
  "translation_status": "reviewed"

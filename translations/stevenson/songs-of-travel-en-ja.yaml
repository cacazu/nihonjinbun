  "translation_ja": |-
    高地の奥、いなかの里では、
    飾らぬ老人たちの顔には赤みが差し、
    うら若く美しい娘たちには
    静かなまなざし。
    根源の静けさが心を励まし、祝福し、
    丘のくぼみにはいつまでも
    その静けさのいっそう美しい音楽が
    こもっては消えてゆく。

  "section_id": "poem-iii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    To the heart of youth the world is a highwayside.
    Passing for ever, he fares; and on either hand,
    Deep in the gardens golden pavilions hide,
    Nestle in orchard bloom, and far on the level land
    Call him with lighted lamp in the eventide.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 244
    "line_end": 248
    "source_sequence": 244
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-244-248"
  "translation_ja": |-
    若い心にとって世界は街道のかたわら。
    とどまらずに彼はゆく。左右には、
    庭の奥に金色のあずまやが隠れ、
    果樹園の花に抱かれて、平野のはるか先から
    夕暮れに灯をともして彼を呼ぶ。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-iii-stanza-02"
  "section_id": "poem-iii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Thick as the stars at night when the moon is down,
    Pleasures assail him.  He to his nobler fate
    Fares; and but waves a hand as he passes on,
    Cries but a wayside word to her at the garden gate,
    Sings but a boyish stave and his face is gone.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"

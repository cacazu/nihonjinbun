- "id": "poem-vii-stanza-01"
  "section_id": "poem-vii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Plain as the glistering planets shine
       When winds have cleaned the skies,
    Her love appeared, appealed for mine,
       And wantoned in her eyes.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 325
    "line_end": 328
    "source_sequence": 325
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-325-328"
  "translation_ja": |-
    風が空を洗ったあと、
    　惑星のきらめきがくっきり見えるように、
    彼女の恋は現れ、私の恋を求め、
    　その目のなかに戯れていた。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-vii-stanza-02"
  "section_id": "poem-vii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Clear as the shining tapers burned
       On Cytherea’s shrine,
    Those brimming, lustrous beauties turned,
       And called and conquered mine.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 330
    "line_end": 333
    "source_sequence": 330
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-330-333"
  "translation_ja": |-
    キュテレイアの祭壇で
    　蝋燭の炎が澄んで輝いたように、
    あふれるように輝く美しい瞳が向き直り、
    　私の瞳を呼び、征服した。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-vii-stanza-03"
  "section_id": "poem-vii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    The beacon-lamp that Hero lit
       No fairer shone on sea,
    No plainlier summoned will and wit,
       Than hers encouraged me.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 335
    "line_end": 338
    "source_sequence": 335
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-335-338"
  "translation_ja": |-
    ヘーローがともした道しるべの灯も
    　海にこれほど美しくは輝かなかった。
    意志と知恵をこれほど明らかに呼び覚ました灯はなかった、
    　私を励ました彼女の灯ほどには。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-vii-stanza-04"
  "section_id": "poem-vii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    I thrilled to feel her influence near,
       I struck my flag at sight.
    Her starry silence smote my ear
       Like sudden drums at night.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 340
    "line_end": 343
    "source_sequence": 340
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-340-343"
  "translation_ja": |-
    その力が近づくのを感じて胸は震え、
    　一目見るなり私は旗を降ろした。
    星めく彼女の沈黙がこの耳を打った、
    　夜の不意の太鼓のように。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-vii-stanza-05"
  "section_id": "poem-vii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    I ran as, at the cannon’s roar,
       The troops the ramparts man—
    As in the holy house of yore
       The willing Eli ran.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 345
    "line_end": 348
    "source_sequence": 345
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-345-348"
  "translation_ja": |-
    砲声に兵士が城壁へ駆けつけるように、
    　私は走った。
    昔、聖なる家で
    　進んでエリが駆けたように。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-vii-stanza-06"
  "section_id": "poem-vii"
  "kind": "verse"
  "origin": "source"
  "source_text": |-
    Here, lady, lo! that servant stands
       You picked from passing men,
    And should you need nor heart nor hands
       He bows and goes again.
  "source_languages":
  - "en"
  "source_locations":
  - "source_id": "gutenberg-487"
    "precision": "line"
    "url": "https://gutenberg.pglaf.org/cache/epub/487/pg487.txt"
    "line_start": 350
    "line_end": 353
    "source_sequence": 350
  "source_alignment":
  - "source_id": "gutenberg-487"
    "original_unit_id": "line-350-353"
  "translation_ja": |-
    さあ、ご婦人、ここにあなたのしもべが立っています、
    　道行く者たちからあなたが選んだ男が。
    心も手もご入り用でないのなら
    　一礼してまた去っていきます。
  "translation_status": "reviewed"
  "attributions":
  - "voice": "author"
    "contributor_id": "stevenson"
- "id": "poem-viii-title"
  "section_id": "poem-viii"
  "kind": "heading"
  "origin": "source"
  "source_text": "VIII"
  "source_languages":
  - "en"
  "source_locations":

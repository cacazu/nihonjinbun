    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4634-4636"
    "translation_ja": "オースティン。それなら大間違いでしたね。ここに伊達男オースティンなんてものはない。ただね、坊や、フェンウィック先生のお膝もとで教わったのですよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-246"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  Ah, sir, your heart was counsellor enough."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

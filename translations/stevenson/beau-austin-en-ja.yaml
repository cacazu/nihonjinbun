    "translation_status": "reviewed"
    "source_kind": "stage_direction"
  - "id": "ba-252"
    "section_id": "act-ii-scene-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Upon my word, I think the world is getting better.  We were none of us young men like that—in my time, to quote my future brother.  (He sits down before the mirror.)  Well, here ends Beau Austin.  Paris, Rome, Vienna, London—victor everywhere: and now he must leave his bones in Tunbridge Wells.  (Looks at his leg.)  Poor Dolly Musgrave! a good girl after all, and will make me a good wife; none better.  The last—of how many?—ay, and the best!  Walks like Hebe.  But still, here ends Beau Austin.  Perhaps it’s time.  Poor Dolly—was she looking poorly?  She shall have her wish.  Well, we grow older, but we grow no worse.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4657
        "line_end": 4665
        "source_sequence": 4657
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4657-4665"
    "translation_ja": |-
      オースティン。どうも世の中はよくなっているらしい。わたしの時代には、ああいう若い男は一人もいなかったな。未来の義弟の言いぐさを借りればね。（鏡の前に座る。）さて、これで伊達男オースティンもおしまいだ。パリ、ローマ、ウィーン、ロンドン。どこでも勝った男が、タンブリッジ・ウェルズに骨を埋めるのか。（自分の脚を見る。）かわいそうなドリー・マスグレーヴ！　結局、いい娘だ。いい妻になってくれるだろう。これ以上の人はない。最後の――さて何人のうちの最後だか？――ああ、そして最高の人だ！　ヘーベーのような足取り。とはいえ、伊達男オースティンもこれまでか。そろそろ潮時だろうな。かわいそうなドリー、具合が悪そうだったって？　望みは叶えてあげるよ。そうだ、われわれは年をとる、だが悪くなるわけじゃない。
    "translation_status": "reviewed"

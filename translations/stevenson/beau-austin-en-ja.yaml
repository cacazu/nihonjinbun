    "source_text": "BARBARA.  La, Miss Dorothy, I wouldn’t for the world."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4024
        "line_end": 4024
        "source_sequence": 4024
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4024-4024"
    "translation_ja": "バーバラ。まあ、ドロシーさま、何があっても手放せません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-079"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  Come, give it me.  I want it.  Thank you: you shall have my birthday pearls instead."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4026

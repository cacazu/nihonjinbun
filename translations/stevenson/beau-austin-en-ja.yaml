  - "id": "ba-047"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  La, madam, how nice!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3901
        "line_end": 3901
        "source_sequence": 3901
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3901-3901"
    "translation_ja": "バーバラ。まあ、奥さま、なんて素敵！"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-048"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  They are: As I’m a sinful woman.  And when will you be married, Barbara? and when dear Dorothy?  I hate to see old maids a-making.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3903
        "line_end": 3905
        "source_sequence": 3903
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3903-3905"
    "translation_ja": "フォスター嬢。ええとも、この罪深い身にかけて。ところでバーバラ、あなたはいつ結婚するの？　愛しいドロシーはいつかしら。独り身のまま年を取ってゆくのは見たくありません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-049"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  La, Miss Evelina, there’s no harm in an old maid."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3907
        "line_end": 3907
        "source_sequence": 3907
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3907-3907"
    "translation_ja": "バーバラ。まあ、イヴリーナさま、年を取っても独り身でいるのは、悪いことじゃありませんわ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-050"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  You speak like a fool, child: sour grapes are all very well but it’s a woman’s business to be married.  As for Dorothy, she is five-and-twenty, and she breaks my heart.  Such a match, too!  Ten thousand to her fortune, the best blood in the north, a most advantageous person, all the graces, the finest sensibility, excellent judgment, the Foster walk; and all these to go positively a-begging!  The men seem stricken with blindness.  Why, child, when I came out (and I was the dear girl’s image!) I had more swains at my feet in a fortnight than our Dorothy in—O, I cannot fathom it: it must be the girl’s own fault.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3909
        "line_end": 3917
        "source_sequence": 3909
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3909-3917"
    "translation_ja": |-
      フォスター嬢。ばかなことを言う。手に入らぬ葡萄は酸っぱいと言いたいでしょうが、女は嫁いでこそです。ドロシーはもう二十五。わたしは胸が張り裂けそうです。それもあんなに良縁の見込める娘が！　財産は一万ポンド、北部屈指の血筋、すばらしい器量、あらゆるたしなみ、繊細な感性、すぐれた判断力、フォスター家ゆずりの足取り。これだけそろって、まるで買い手がつかないなんて！　男たちの目は節穴なのかしら。ねえ、わたしが社交界に出たころなど（あの子はわたしにそっくりだったのよ！）、たった二週間で、うちのドロシーが何年かかってもかなわないほどの男たちがわたしの足もとに――いえ、もう見当もつかない。その子自身に落ち度があるに違いありません。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-051"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  Why, madam, I did think it was a case with Mr. Austin."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3919
        "line_end": 3919
        "source_sequence": 3919
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3919-3919"
    "translation_ja": "バーバラ。だって奥さま、わたしはオースティンさんとそういう仲だと思っておりました。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-052"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  With Mr. Austin? why, how very rustic!  The attentions of a gentleman like Mr. Austin, child, are not supposed to lead to matrimony. He is a feature of society: an ornament: a personage: a private gentleman by birth, but a kind of king by habit and reputation.  What woman could he marry?  Those to whom he might properly aspire are all too far below him.  I have known George Austin too long, child, and I understand that the very greatness of his success condemns him to remain unmarried.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3921
        "line_end": 3927
        "source_sequence": 3921
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3921-3927"
    "translation_ja": |-
      フォスター嬢。オースティンさんと？　まあ、なんて田舎くさい考え！　オースティンさんほどの紳士が心を遣ってくださっても、それで結婚となるわけではありません。あの方は社交界の顔、花、名士。生まれこそ一介の紳士ですが、振る舞いと世評では王のようなもの。どんな女性と結婚できましょう。望んでよいはずの女性たちでさえ、みなあの方にはあまりに釣り合わない。ジョージ・オースティンを長く存じているからこそわかります。あれほどの成功を収めたこと自体が、一生独り身でいるようあの方に命じているのです。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-053"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  Sure, madam, that must be tiresome for him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3929
        "line_end": 3929
        "source_sequence": 3929
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3929-3929"
    "translation_ja": "バーバラ。それはきっと、ご本人には退屈でございましょうね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-054"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  Some day, child, you will know better than to think so. George Austin, as I conceive him, and as he is regarded by the world, is one of the triumphs of the other sex.  I walked my first minuet with him: I wouldn’t tell you the year, child, for worlds; but it was soon after his famous rencounter with Colonel Villiers.  He had killed his man, he wore pink and silver, was most elegantly pale, and the most ravishing creature!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3931
        "line_end": 3937
        "source_sequence": 3931
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3931-3937"
    "translation_ja": |-
      フォスター嬢。そのうち、そんなことはおっしゃらなくなりますよ。わたしの見るジョージ・オースティンも、世間が認めるあの方も、男というものの上出来な見本です。わたしが初めてメヌエットを踊った相手もあの方。何年のことかなんて、何があっても教えませんがね。ヴィリアーズ大佐との有名な一戦のすぐあとでした。決闘で相手を殺したばかりで、桃色と銀の服を着て、まことに優雅に青ざめて、もう見とれるほど素敵な方でした！
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-055"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  Well, madam, I believe that: he is the most beautiful gentleman still."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3939
        "line_end": 3940
        "source_sequence": 3939
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3939-3940"
    "translation_ja": "バーバラ。ええ、奥さま、わかります。今だって、いちばん素敵な紳士でいらっしゃいますわ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"

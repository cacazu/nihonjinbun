        "source_sequence": 4135
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4135-4135"
    "translation_ja": "ドロシー。あなたにとっても死んだの。すべての男にとっても。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-104"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Dorothy, I loved you as a boy.  There is not a meadow on Edenside but is dear to me for your sake, not a cottage but recalls your goodness, not a rock nor a tree but brings back something of the best and brightest youth man ever had.  You were my teacher and my queen; I walked with you, I talked with you, I rode with you; I lived in your shadow; I saw with your eyes.  You will never know, dear Dorothy, what you were to the dull boy you bore with; you will never know with what romance you filled my life, with what devotion, with what tenderness and honour.  At night I lay awake and worshipped you; in my dreams I saw you, and you loved me; and you remember, when we told each other stories—you have not forgotten, dearest—that Princess Hawthorn that was still the heroine of mine: who was she?  I was not bold enough to tell, but she was you!  You, my virgin huntress, my Diana, my queen.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4137
        "line_end": 4149
        "source_sequence": 4137
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4137-4149"
    "translation_ja": |-
      フェンウィック。ドロシー、僕は子どものころから君を愛していた。イーデンサイドには、君の思い出ゆえに愛しくない草地が一つもない。君の親切を思い出さない小さな家も、男が持ちうるいちばん素晴らしく、輝かしい青春のひとかけらを思い出させない岩も木もない。君は僕の先生で、女王だった。一緒に歩き、話し、馬で駆けた。君の影に生き、君の目でものを見た。大事なドロシー、君が我慢して相手をしてくれた鈍い子どもにとって、君がどんな人だったか、君には一生わからないよ。僕の暮らしをどれほど夢で、献身で、愛情と誇りで満たしてくれたかも。夜には眠らず君を崇め、夢には君が現れ、僕を愛してくれた。それに、覚えてるだろう、二人で物語を作って聞かせ合ったのを。忘れてはいないだろう？　僕の話でいつも主人公だったサンザシ姫、あれは誰だったと思う？　言う勇気はなかったけれど、君だったんだ。僕の純潔な狩人、僕のダイアナ、僕の女王。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-105"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  O silence, silence—pity!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4151
        "line_end": 4151
        "source_sequence": 4151
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4151-4151"
    "translation_ja": "ドロシー。ああ、もうおっしゃらないで、お願い――どうか情けを！"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-106"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  No, dear; neither for your sake nor mine will I be silenced.  I have begun; I must go on and finish, and put fortune to the touch.  It was from you I learned honour, duty, piety, and love.  I am as you made me, and I exist but to reverence and serve you.  Why else have I come here, the length of England, my heart burning higher every mile, my very horse a clog to me? why, but to ask you for my wife?  Dorothy, you will not deny me.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4153
        "line_end": 4159
        "source_sequence": 4153
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4153-4159"
    "translation_ja": |-
      フェンウィック。いいや、君のためにも僕自身のためにも、黙るわけにはいかない。話し始めたんだから、最後まで話して、運に賭けなくちゃ。君から教わったんだ、誇り、務め、信仰、愛を。僕を作ったのは君だし、君を敬い、君に尽くすためだけに生きている。ほかに何のために、イングランドを縦断してここまで来たろう。一マイルごとに胸はいっそう燃え、馬でさえまどろっこしかった。妻になってくれと頼むためさ。ドロシー、いやとは言わないでくれ。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-107"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  You have not asked me about this broken trinket?"
    "source_languages":

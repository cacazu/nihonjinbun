      オースティン。そうは仰せになるな。わたし自身に判定するぐらいの自負はあります。世の中でわたしを変えられた人は二人だけ。あなたと、あの大事な方です。（呼び鈴を鳴らす。）では、いったんお引き取りを。身支度がすみしだい、あとから参ります。先に行って、わたしが来るとお伝えいただけますか？（メンティース入場。）

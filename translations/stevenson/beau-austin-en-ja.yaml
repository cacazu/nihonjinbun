        "source_sequence": 4254
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4254-4258"
    "translation_ja": |-
      舞台はジョージ・オースティンの化粧部屋。右に凝った化粧台と椅子。台の鏡と向かい合うように姿見。手前左に朝食の卓。左に扉。幕が開くと、伊達男は部屋着で食卓につき、手紙をもてあそんでいる。メンティースがチョコレートを泡立てている。
    "translation_status": "reviewed"

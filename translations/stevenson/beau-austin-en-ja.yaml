        "line_start": 4969
        "line_end": 4969
        "source_sequence": 4969
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4969-4969"
    "translation_ja": "バーバラ。オースティンさまです。（オースティンを部屋に通し、下がる。）"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 24
          "end": 33
          "exact": "She shows"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 41
          "end": 43
          "exact": "in"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 45
          "end": 56
          "exact": "and retires"
    "source_kind": "dialogue"
  - "id": "ba-338"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  You will do me the justice to acknowledge, Mr. Fenwick, that I have been not long delayed by my devotion to the Graces.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4971
        "line_end": 4972
        "source_sequence": 4971
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4971-4972"
    "translation_ja": "オースティン。ねえ、フェンウィックさん。わたしが美の三女神にいそしむのも、長くはかからなかったと、公平に認めてくださいますね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-339"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  So, sir, I find you in my house—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4974
        "line_end": 4974
        "source_sequence": 4974
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4974-4974"
    "translation_ja": "アンソニー。ほう、よくも僕の家にいらした――"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-340"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  And charmed to meet you again.  It went against my conscience to separate so soon.  Youth, Mr. Musgrave, is to us older men a perpetual refreshment.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4976
        "line_end": 4978
        "source_sequence": 4976
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4976-4978"
    "translation_ja": "オースティン。またお目にかかれて、たいへん嬉しいですよ。あれほど早く失礼したことが心苦しかった。若さというものはね、マスグレーヴさん、わたしたち年寄りには、いつでも気持ちを新たにしてくれるものです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-341"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  You came here, sir, I suppose, upon some errand?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4980
        "line_end": 4980
        "source_sequence": 4980
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4980-4980"
    "translation_ja": "アンソニー。何か用向きがあって、いらしたんでしょうね？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-342"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  My errand, Mr. Musgrave, is to your fair sister.  Beauty, as you know, comes before valour."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4982
        "line_end": 4983
        "source_sequence": 4982
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4982-4983"
    "translation_ja": "オースティン。用向きは、マスグレーヴさん、あなたのお美しいお姉さまにですよ。ご存じのとおり、美しさは勇敢さに先んじます。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-343"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  In my own house, and about my own sister, I presume I have the right to ask for something more explicit.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4985
        "line_end": 4986
        "source_sequence": 4985
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4985-4986"
    "translation_ja": "アンソニー。僕自身の家にいて、姉のことをもっとはっきり尋ねるくらいの権利はあるでしょう。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-344"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  The right, my dear sir, is beyond question; but it is one, as you were going on to observe, on which no gentleman insists.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4988
        "line_end": 4989
        "source_sequence": 4988
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4988-4989"
    "translation_ja": "オースティン。権利は、あなた、疑いもなくありますよ。もっとも、あなたもそうおっしゃるつもりだったでしょうが、紳士ならば権利を振りかざしたりはしません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-345"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  Anthony, my good fellow, I think we had better go."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4991
        "line_end": 4991
        "source_sequence": 4991
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4991-4991"
    "translation_ja": "フェンウィック。アンソニー、そろそろ行ったほうがいいと思うよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-346"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  I have asked a question."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4993
        "line_end": 4993
        "source_sequence": 4993
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4993-4993"
    "translation_ja": "アンソニー。僕は質問したぞ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-347"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Which I was charmed to answer, but which, on repetition, might begin to grow distasteful."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4995
        "line_end": 4996
        "source_sequence": 4995
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4995-4996"
    "translation_ja": "オースティン。お答えできて嬉しかったですよ。もう一度聞かれたら、不愉快になってくるかもしれませんがね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-348"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  In my own house—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4998
        "line_end": 4998
        "source_sequence": 4998
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4998-4998"
    "translation_ja": "アンソニー。僕自身の家で――"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-349"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  For God’s sake, Anthony!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5000
        "line_end": 5000
        "source_sequence": 5000
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5000-5000"
    "translation_ja": "フェンウィック。お願いだから、アンソニー、もうやめてくれ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-350"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  In your aunt’s house, young gentleman, I shall be careful to refrain from criticism.  I am come upon a visit to a lady: that visit I shall pay; when you desire (if it be possible that you desire it) to resume this singular conversation, select some fitter place.  Mr. Fenwick, this afternoon, may I present you to his Royal Highness?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5002
        "line_end": 5006
        "source_sequence": 5002
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5002-5006"
    "translation_ja": |-
      オースティン。ここはあなたの叔母上のお宅です、若い紳士よ。口を慎んでおきましょう。わたしはご婦人を訪ねて来た。そのお訪ねはしますよ。この変わった会話を続けたいのなら――それを本当にお望みなら――もっとふさわしい所を選びなさい。フェンウィックさん、今日の午後、殿下にご紹介してもよろしいですか？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-351"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  Why, sir, I believe you must have misconceived me.  I have no wish to offend: at least at present.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5008
        "line_end": 5009
        "source_sequence": 5008
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5008-5009"
    "translation_ja": "アンソニー。どうも僕の言い分を取り違えられたようですね。ご気分を害するつもりはありません、少なくとも今は。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-352"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Enough, sir.  I was persuaded I had heard amiss.  I trust we shall be friends."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5011
        "line_end": 5012
        "source_sequence": 5011
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5011-5012"
    "translation_ja": "オースティン。もうけっこうです。わたしが聞き違えたのだと思っていました。友人になれるといいですね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-353"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  Come, Anthony, come: here is your sister."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5014
        "line_end": 5014
        "source_sequence": 5014
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5014-5014"
    "translation_ja": "フェンウィック。さあアンソニー、行こう。お姉さんが来た。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-354"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "(As FENWICK and ANTHONY go out, C., enter DOROTHY, L.)"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5016
        "line_end": 5016
        "source_sequence": 5016
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5016-5016"
    "translation_ja": "（フェンウィックとアンソニーが中央から出ていくところへ、ドロシーが左から入る。）"
    "translation_status": "reviewed"

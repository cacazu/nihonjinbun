        "original_unit_id": "line-4007-4008"
    "translation_ja": "バーバラ。ねえ、ドロシーさま、出すぎた口かもしれませんけど、オースティンさんにおいでいただきたいです。わたし、この首飾りを着けたところをお見せしたくて。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"

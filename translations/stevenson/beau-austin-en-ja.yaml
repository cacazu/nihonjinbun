    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  Yes, indeed, Miss, that he did: the very same day he drove you in his curricle to Penshurst.  You remember, Miss, I couldn’t go.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

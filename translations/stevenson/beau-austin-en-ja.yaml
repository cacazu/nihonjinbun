          "end": 47
          "exact": "with his hand upon the bell"
    "source_kind": "dialogue"
  - "id": "ba-220"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Sir, you speak of disadvantage; think of mine.  All my life long, with all the forces of my nature, I have loved this lady.  I came here to implore her to be my wife, to be my queen; my saint she had been always!  She was too noble to deceive me.  She told me what you know.  I will not conceal that my first mood was of anger: I would have killed you like a dog.  But, Mr. Austin—bear with me awhile—I, on the threshold of my life, who have made no figure in the world, nor ever shall now, who had but one treasure, and have lost it—if I, abandoning revenge, trampling upon jealousy, can supplicate you to complete my misfortune—O Mr. Austin! you who have lived, you whose gallantry is beyond the insolence of a suspicion, you who are a man crowned and acclaimed, who are loved, and loved by such a woman—you who excel me in every point of advantage, will you suffer me to surpass you in generosity?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4511
        "line_end": 4523
        "source_sequence": 4511
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4511-4523"
    "translation_ja": |-
      フェンウィック。不利とおっしゃるなら、僕の不利もお考えください。一生をかけ、持って生まれた力のすべてをかけて、あの方を愛しました。僕の妻、僕の女王になってくださいとお願いしに来たのです。いつだって僕にとっては聖女でした！　あの方は僕を欺くには気高すぎました。あなたもご承知のことを話してくれました。はじめは怒りに駆られた、と隠しはしません。犬でも殺すようにあなたを殺していたでしょう。でも、オースティンさん――しばらく我慢して聞いてください――僕は人生の入口にいながら、世間で名をなしたことはなく、もうこれからもないでしょう。たった一つの宝を持っていたのに、それを失ったんです。それでも、その僕が、復讐を捨て、嫉妬を踏みにじって、僕の不幸にとどめを刺してくださいとあなたにすがることができるなら――ああ、オースティンさん、あなたは世を生き、色事の手際を疑うのも失礼なほどで、栄冠をかぶせられ喝采を浴びた男です。愛されている、よりによってあの方にです。どこを取っても僕より恵まれているあなたが、寛大さだけは僕に先んじられてよいのですか？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-221"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  You speak from the heart.  (Sits.)  What do you want with me?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"

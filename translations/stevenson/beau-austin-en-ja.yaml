        "source_sequence": 4026
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4026-4027"
    "translation_ja": "ドロシー。さあ、ちょうだい。欲しいの。ありがとう。かわりに、わたしが誕生日にもらった真珠をあげるわ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-080"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  Why, Dolly, I believe you’re jealous of the maid.  Foster, Foster: always a Foster trick to wear the willow in anger.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4029
        "line_end": 4030
        "source_sequence": 4029
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4029-4030"
    "translation_ja": "フォスター嬢。まあ、ドリー、自分の侍女に嫉妬しているんじゃないかしら。フォスターだわ、まったく。失恋に怒ってすねるのはいつもフォスター家のやり口ね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-081"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  I do not think, madam, that I am of a jealous habit."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4032
        "line_end": 4032
        "source_sequence": 4032
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4032-4032"
    "translation_ja": "ドロシー。わたしは、叔母さま、嫉妬深いつもりはございません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-082"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  O, the personage is your excuse!  And I can tell you, child, that when George Austin was playing Florizel to the Duchess’s Perdita, all the maids in England fell a prey to green-eyed melancholy. It was the ton, you see: not to pine for that Sylvander was to resign from good society.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4034
        "line_end": 4038
        "source_sequence": 4034
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4034-4038"
    "translation_ja": |-
      フォスター嬢。あら、あれほどのお方ですもの、言い訳は立つわよ！　ねえ、ジョージ・オースティンが、公爵夫人のパーディタを相手にフロリゼル気取りだった頃は、イングランド中の娘が、嫉妬で青ざめて落ち込んだものよ。それが上流のしきたりでしたの。あのシルヴァンダーに焦がれないなんて、立派な社交界から足を洗うも同じ。
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 220
          "end": 223
          "exact": "ton"
    "source_kind": "dialogue"
  - "id": "ba-083"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Aunt Evelina, stop; I cannot endure to hear you.  What is he after all but just Beau Austin?  What has he done—with half a century of good health, what has he done that is either memorable or worthy?  Diced and danced and set fashions; vanquished in a drawing-room, fought for a word; what else?  As if these were the meaning of life!  Do not make me think so poorly of all of us women.  Sure, we can rise to admire a better kind of man than Mr. Austin.  We are not all to be snared with the eye, dear aunt; and those that are—O!  I know not whether I more hate or pity them.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4040
        "line_end": 4048
        "source_sequence": 4040
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4040-4048"
    "translation_ja": |-
      ドロシー。もうやめて、イヴリーナ叔母さま。聞いていられないわ。結局、あの人は伊達男オースティン、それだけです。それが何だというんでしょう？　健康な体で半世紀、何か記憶に値すること、称賛に値することをしましたか？　さいころを振り、踊り、流行を作った。客間で人を言い負かし、一言をめぐって決闘。ほかには？　それが人生の意味とでもいうような！　女というものを、わたしにそこまで浅はかに思わせないでください。わたしたちだって、オースティンさんより立派な男を尊敬できるはずです。目に見えるだけのものに心を捕らわれる女ばかりではありません、叔母さま。捕らわれる女については、ああ、憎むべきか憐れむべきか、わたしにはわかりません。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-084"
    "section_id": "act-i-scene-ii"

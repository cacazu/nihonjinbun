  - "id": "ba-392"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  Is Austin going to marry you?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5193
        "line_end": 5193
        "source_sequence": 5193
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5193-5193"
    "translation_ja": "アンソニー。オースティンは姉さんと結婚するのか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-393"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  I shall never marry."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5195
        "line_end": 5195
        "source_sequence": 5195
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5195-5195"
    "translation_ja": "ドロシー。わたしは結婚しないわ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-394"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  I thought as much.  You should have come to me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5197
        "line_end": 5197
        "source_sequence": 5197
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5197-5197"
    "translation_ja": "アンソニー。やっぱりね。僕のところへ来ればよかったんだ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-395"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  I know, dear, I know; but there was nothing to come about."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5199
        "line_end": 5199
        "source_sequence": 5199
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5199-5199"
    "translation_ja": "ドロシー。わかっているわ、アンソニー。でも相談することなんてなかったのよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-396"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  It’s a lie.  You have disgraced the family.  You went to John Fenwick: see what he has made of it!  But I will have you righted: it shall be atoned in the man’s blood.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5201
        "line_end": 5203
        "source_sequence": 5201
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5201-5203"
    "translation_ja": "アンソニー。嘘だ。家の名に泥を塗ったくせに。ジョン・フェンウィックのところには行っただろ。任せて、どんなことになったか考えてみなよ！　でも僕が姉さんの汚名をそそぐ。あの男に血で償わせる。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-397"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  Anthony!  And if I had refused him?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5205
        "line_end": 5205
        "source_sequence": 5205
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5205-5205"
    "translation_ja": "ドロシー。アンソニー！　わたしがあの人を断ったとしたら？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-398"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  You? refuse George Austin?  You never had the chance."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5207
        "line_end": 5207
        "source_sequence": 5207
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5207-5207"
    "translation_ja": "アンソニー。姉さんが？　ジョージ・オースティンを断る？　そんな機会があるわけない。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-399"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  I have refused him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

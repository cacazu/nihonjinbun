    "source_kind": "dialogue"
  - "id": "ba-153"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN (with card).  Whom have we here?  Anthony Musgrave?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4303
        "line_end": 4303
        "source_sequence": 4303
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4303-4303"
    "translation_ja": "オースティン（名刺を手に）。さて、誰かな？　アンソニー・マスグレーヴ？"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 8
          "end": 17
          "exact": "with card"
    "source_kind": "dialogue"
  - "id": "ba-154"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  A fine young man, Mr. George; and with a look of the young lady, but not so gentlemanly."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4305
        "line_end": 4306
        "source_sequence": 4305
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4305-4306"
    "translation_ja": "メンティース。爽やかな若い方です、ジョージさま。お嬢さまに似ておりますが、あれほど紳士らしくはありません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-155"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  You have an eye, you have an eye.  Let him in."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4308
        "line_end": 4308
        "source_sequence": 4308
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4308-4308"
    "translation_ja": "オースティン。目が利くね、実に目が利く。お通ししてくれ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-156"
    "section_id": "act-ii-scene-ii"
    "kind": "heading"
    "origin": "source"
    "source_text": "SCENE II"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4311
        "line_end": 4311
        "source_sequence": 4311
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4311-4311"
    "translation_ja": "第二場"
    "translation_status": "reviewed"
  - "id": "ba-157"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN, MENTEITH, ANTHONY"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4314
        "line_end": 4314
        "source_sequence": 4314
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4314-4314"
    "translation_ja": "オースティン、メンティース、アンソニー。"
    "translation_status": "reviewed"
    "source_kind": "stage_direction"
  - "id": "ba-158"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  I am charmed to have this opportunity, Mr. Musgrave.  You belong to my old corps, I think?  And how does my good friend, Sir Frederick?  I had his line; but like all my old comrades, he thinks last about himself, and gives me not of his news.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4316
        "line_end": 4319
        "source_sequence": 4316
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4316-4319"
    "translation_ja": |-
      オースティン。こうしてお目にかかれて嬉しいですよ、マスグレーヴさん。たしか、わたしの古巣の連隊においでとか。わが友サー・フレデリックはお元気です？　手紙はもらいましたが、昔の戦友はみんな自分のことは後回しで、ご自分の近況は書かないものでね。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-159"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  I protest, sir, this is a very proud moment.  Your name is still remembered in the regiment.  (AUSTIN bows.)  The Colonel—he keeps his health, sir, considering his age (AUSTIN bows again, and looks at MENTEITH)—tells us young men you were a devil of a fellow in your time.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4321
        "line_end": 4324
        "source_sequence": 4321
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4321-4324"
    "translation_ja": |-
      アンソニー。いやもう、オースティンさん、こんな誇らしいことはありません。連隊では今もお名前が知られています。（オースティン、一礼。）大佐は……お年のわりにお元気です。（オースティン、もう一度一礼してメンティースを見る。）大佐は僕ら若いのに、当時のあなたはとんでもない猛者だった、とおっしゃいますよ。
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 112
          "end": 116
          "exact": "bows"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 186
          "end": 196
          "exact": "bows again"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 198
          "end": 210
          "exact": "and looks at"
    "source_kind": "dialogue"
  - "id": "ba-160"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  I believe I was—in my time.  Menteith, give Mr. Musgrave a dish of chocolate.  So, sir, we see you at the Wells.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4326
        "line_end": 4327
        "source_sequence": 4326
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4326-4327"
    "translation_ja": "オースティン。たしかに、当時はそうでしたかね。メンティース、マスグレーヴさんにチョコレートを一杯。それで、ウェルズにお着きですね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-161"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  I have but just alighted.  I had but one thought, sir: to pay my respects to Mr. Austin.  I have not yet kissed my aunt and sister.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4329
        "line_end": 4330
        "source_sequence": 4329
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4329-4330"
    "translation_ja": "アンソニー。つい今しがた着いたばかりです。一つのことしか頭にありませんでしたよ。オースティンさんにご挨拶をすること。叔母上にも姉にも、まだ挨拶のキスをしていません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-162"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  In my time—to which you refer—the ladies had come first."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4332
        "line_end": 4332
        "source_sequence": 4332
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4332-4332"
    "translation_ja": "オースティン。あなたのおっしゃるわたしの時代には、ご婦人方が先でしたね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-163"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  The women?  I take you, sir.  But then you see, a man’s relatives don’t count.  And besides, Mr. Austin, between men of the world, I am fairly running away from the sex: I am positively in flight. Little Hortense of the Opera; you know; she sent her love to you.  She’s mad about me, I think.  You never saw a creature so fond.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4334
        "line_end": 4338
        "source_sequence": 4334
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4334-4338"
    "translation_ja": |-
      アンソニー。女の人？　おっしゃることはわかります。でも親戚は勘定に入らないでしょう。それにね、オースティンさん、世間を知る男同士の話ですが、僕はいま女から逃げ出して来たようなものでね。まったく逃亡中ですよ。歌劇場のかわいいオルタンス。ご存じでしょう？　あなたによろしくと。僕に夢中らしい。あれほどぞっこんの娘は見たことがありませんよ。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-164"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Well, well, child! you are better here.  In my time—to which you have referred—I knew the lady.  Does she wear well?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4340
        "line_end": 4341
        "source_sequence": 4340
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4340-4341"
    "translation_ja": "オースティン。そうかい、坊や！　ここにいるほうがいいね。あなたの言うわたしの時代には、そのご婦人を知っていましたよ。今も若々しいですか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-165"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  I beg your pardon, sir!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4343
        "line_end": 4343
        "source_sequence": 4343
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4343-4343"
    "translation_ja": "アンソニー。なんですって？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-166"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  No offence, child, no offence.  She was a very lively creature. But you neglect your chocolate I see?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4345
        "line_end": 4346
        "source_sequence": 4345
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4345-4346"
    "translation_ja": "オースティン。お気を悪くなさらないで、坊や。じつに元気のいいお人でした。しかしチョコレートに手をおつけにならないようで？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-167"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  We don’t patronise it, Mr. Austin; we haven’t for some years: the service has quite changed since your time.  You’d be surprised.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4348
        "line_end": 4349
        "source_sequence": 4348
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4348-4349"
    "translation_ja": "アンソニー。こういうのはやらないんです、オースティンさん。もう何年も。軍隊は、あなたの時代とはまるで変わりましたよ。驚かれるでしょうね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-168"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Doubtless.  I am."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4351
        "line_end": 4351
        "source_sequence": 4351
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4351-4351"
    "translation_ja": "オースティン。きっとね。もう驚いています。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-169"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  I assure you, sir, I and Jack Bosbury of the Fifty-Second—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4353
        "line_end": 4353
        "source_sequence": 4353
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4353-4353"
    "translation_ja": "アンソニー。ほんとうですよ、僕と第五十二連隊のジャック・ボズベリーなんて――"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-170"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  The Hampshire Bosburys?—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4355
        "line_end": 4355
        "source_sequence": 4355
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4355-4355"
    "translation_ja": "オースティン。ハンプシャーのボズベリー家？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-171"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  I do not know exactly, sir.  I believe he is related."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4357
        "line_end": 4357
        "source_sequence": 4357
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4357-4357"
    "translation_ja": "アンソニー。正確には知りませんがね。親戚ではあると思いますよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-172"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Or perhaps—I remember a Mr. Bosbury, a cutter of coats.  I have the vanity to believe I formed his business.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4359
        "line_end": 4360
        "source_sequence": 4359
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4359-4360"
    "translation_ja": "オースティン。もしかすると――ボズベリーという、上着の裁断師を覚えていますよ。わたしが商売を軌道に乗せてやった、と自負していましてね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-173"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  I—I hope not, sir.  But as I was saying, I and this Jack Bosbury, and the Brummagem Bantam—a very pretty light-weight, sir—drank seven bottles of Burgundy to the three of us inside the eighty minutes. Jack, sir, was a little cut; but me and the Bantam went out and finished the evening on hot gin.  Life, sir, life!  Tom Cribb was with us.  He spoke of you, too, Tom did: said you’d given him a wrinkle for his second fight with the black man.  No, sir, I assure you, you’re not forgotten.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4362
        "line_end": 4368
        "source_sequence": 4362
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4362-4368"
    "translation_ja": |-
      アンソニー。そ、それは違うと思いたいですね。でも話の続きですが、僕とそのジャック・ボズベリーと、バーミンガムの小軍鶏――じつにいい軽量級の選手ですよ――とで、八十分もしないうちにブルゴーニュを七本、三人で空けたんです。ジャックは少々酔いましたが、僕と軍鶏は外へ出て、温めたジンでその晩を締めくくりました。これこそ人生、人生ですよ！　トム・クリブも一緒でした。トムもあなたの話をしましたよ。あの黒人の選手との二度目の試合にいい知恵を授けてもらったって。いやあ、あなたは忘れられてなんかいませんよ。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-174"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN (bows).  I am pleased to learn it.  In my time, I had an esteem for Mr. Cribb."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4370
        "line_end": 4371
        "source_sequence": 4370
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4370-4371"
    "translation_ja": "オースティン（一礼して）。それは嬉しい。当時、クリブさんを高く買っていましたから。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 8
          "end": 12
          "exact": "bows"
    "source_kind": "dialogue"
  - "id": "ba-175"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  O come, sir! but your time cannot be said to be over."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4373
        "line_end": 4373
        "source_sequence": 4373
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4373-4373"
    "translation_ja": "アンソニー。いやいや、あなたの時代が終わったなんて、とても言えないでしょうよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-176"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Menteith, you hear?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4375
        "line_end": 4375
        "source_sequence": 4375
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4375-4375"
    "translation_ja": "オースティン。メンティース、聞いたか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-177"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Yes, Mr. George."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4377
        "line_end": 4377
        "source_sequence": 4377
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4377-4377"
    "translation_ja": "メンティース。はい、ジョージさま。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-178"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  The Colonel told me that you liked to shake an elbow.  Your big main, sir, with Lord Wensleydale, is often talked about.  I hope I may have the occasion to sit down with you.  I shall count it an honour, I assure you.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4379
        "line_end": 4382
        "source_sequence": 4379
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4379-4382"
    "translation_ja": "アンソニー。大佐のお話では、さいころを振るのお好きだったとか。ウェンズリーデイル卿との大勝負は、今もよく話に出ますよ。僕も一度あなたと卓を囲む機会があればと思っています。ほんとうに光栄に思いますよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-179"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  But would your aunt, my very good friend, approve?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4384
        "line_end": 4384
        "source_sequence": 4384
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4384-4384"
    "translation_ja": "オースティン。しかし、わたしの大切な友人の、あなたの叔母さまはお許しになりますか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-180"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  Why, sir, you do not suppose I am in leading-strings?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4386
        "line_end": 4386
        "source_sequence": 4386
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4386-4386"
    "translation_ja": "アンソニー。なんですって、僕を手を引いてもらうような子どもだとお思いですか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-181"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  You forget, child: a family must hang together.  When I was young—in my time—I was alone; and what I did concerned myself.  But a youth who has—as I think you have—a family of ladies to protect, must watch his honour, child, and preserve his fortune.  You have no commands from Sir Frederick?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4388
        "line_end": 4392
        "source_sequence": 4388
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4388-4392"
    "translation_ja": |-
      オースティン。忘れてはいけませんよ、坊や。家族は支え合わねば。わたしは若いころ、わたしの時代には、独りでした。何をしようとわたし一人の問題だった。だがあなたのように、守るべき女性が家族にいる若者なら、坊や、名誉に気をつけて、財産を守らなくてはいけません。サー・フレデリックから、ご用は仰せつかっていませんか？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-182"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  None, sir, none."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4394
        "line_end": 4394
        "source_sequence": 4394
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4394-4394"
    "translation_ja": "アンソニー。いえ、何もございません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-183"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Shall I find you this noon upon the Pantiles? . . . I shall be charmed.  Commend me to your aunt and your fair sister.  Menteith?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4396
        "line_end": 4397
        "source_sequence": 4396
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4396-4397"
    "translation_ja": "オースティン。今日の昼、パンタイルズでお会いできますか？……楽しみにしています。叔母さまとお美しいお姉さまによろしく。メンティース？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-184"
    "section_id": "act-ii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Yes, Mr. George.  (Shows Anthony out.)"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4399
        "line_end": 4399
        "source_sequence": 4399
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4399-4399"
    "translation_ja": "メンティース。はい、ジョージさま。（アンソニーを送り出す。）"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":

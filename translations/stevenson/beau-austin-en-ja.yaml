        "source_sequence": 4690
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4690-4690"
    "translation_ja": "オースティン。そして、メンティース、そのワインにふさわしい奥方もだ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-262"
    "section_id": "act-ii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Mr. George, sir, she’s worthy of you."

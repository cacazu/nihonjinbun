      フォスター嬢（メンティースの案内で登場。バーバラがあとに続く）。まあ、メンティース。またお会いしましたね。ほんとうにうれしいわ。あなたに会えたからというだけでなく、伊達男がもうじきいらっしゃると分かるから。（左手に腰を下ろす。メンティースはそのそばに立つ。）
    "translation_status": "reviewed"

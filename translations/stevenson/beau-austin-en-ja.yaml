  - "id": "ba-355"
    "section_id": "act-iii-scene-vii"
    "kind": "heading"
    "origin": "source"
    "source_text": "SCENE VII"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5019
        "line_end": 5019
        "source_sequence": 5019
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5019-5019"
    "translation_ja": "第七場"
    "translation_status": "reviewed"
  - "id": "ba-356"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN, DOROTHY"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5022
        "line_end": 5022
        "source_sequence": 5022
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5022-5022"
    "translation_ja": "オースティン、ドロシー。"
    "translation_status": "reviewed"
    "source_kind": "stage_direction"
  - "id": "ba-357"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  I am told, Mr. Austin, that you wish to see me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5024
        "line_end": 5024
        "source_sequence": 5024
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5024-5024"
    "translation_ja": "ドロシー。お会いになりたいと伺いました、オースティンさん。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-358"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Madam, can you doubt of that desire? can you question my sincerity?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5026
        "line_end": 5027
        "source_sequence": 5026
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5026-5027"
    "translation_ja": "オースティン。わたしがそう願うことをお疑いですか？　本気とは思われませんか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-359"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Sir, between you and me these compliments are worse than idle: they are unkind.  Sure, we are alone!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5029
        "line_end": 5030
        "source_sequence": 5029
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5029-5030"
    "translation_ja": "ドロシー。わたしとあなたのあいだでは、そのようなお愛想は無意味なだけではありません。残酷です。二人しかいないんですよ！"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-360"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  I find you in an hour of cruelty, I fear.  Yet you have condescended to receive this poor offender; and having done so much, you will not refuse to give him audience.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5032
        "line_end": 5034
        "source_sequence": 5032
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5032-5034"
    "translation_ja": "オースティン。どうやら、冷たくあしらわれる折に来てしまったようですね。それでも哀れな罪人をお通しくださった。そこまでしてくださったなら、話を聞くことまで拒まれますまい。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-361"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  You shall have no cause, sir, to complain of me.  I listen."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5036
        "line_end": 5036
        "source_sequence": 5036
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5036-5036"
    "translation_ja": "ドロシー。わたしに何の不服もおありにならぬようにいたします。伺います。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-362"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  My fair friend, I have sent myself—a poor ambassador—to plead for your forgiveness.  I have been too long absent; too long, I would fain hope, madam, for you; too long for my honour and my love.  I am no longer, madam, in my first youth; but I may say that I am not unknown. My fortune, originally small, has not suffered from my husbandry.  I have excellent health, an excellent temper, and the purest ardour of affection for your person.  I found not on my merits, but on your indulgence.  Miss Musgrave, will you honour me with your hand in marriage?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5038
        "line_end": 5045
        "source_sequence": 5038
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5038-5045"
    "translation_ja": |-
      オースティン。美しい友よ、お許しを乞うために、自分自身を遣わしました。頼りない使いですが。あまりにも長くご無沙汰しました。あなたにとっても長すぎたと思いたい。わたしの名誉と恋にとっては、なおさら長すぎた。わたしはもはや、若さの盛りというわけにはいきません。ですが知られていないというほどでもない。もとより小さかった財産は、やりくりで減らしてもおりません。体はいたって丈夫、気性もいたって穏やか、それにあなたへの思いは熱く、純粋です。わたしの取り柄でなく、あなたのお情けにすがるのです。マスグレーヴ嬢、どうか、この手を取ってわたしの妻になってくださいませんか？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-363"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Mr. Austin, if I thought basely of marriage, I should perhaps accept your offer.  There was a time, indeed, when it would have made me proudest among women.  I was the more deceived, and have to thank you for a salutary lesson.  You chose to count me as a cipher in your rolls of conquest; for six months you left me to my fate; and you come here to-day—prompted, I doubt not, by an honourable impulse—to offer this tardy reparation.  No: it is too late.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5047
        "line_end": 5053
        "source_sequence": 5047
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5047-5053"
    "translation_ja": |-
      ドロシー。オースティンさん、もしわたしが結婚を卑しいものと考えていたなら、お申し出を受けたかもしれません。確かに、そうしていただけたら、女としてこの上なく誇らしかった時もありました。その分ひどく思い違いをしていました。よいお教えをいただいたことは、感謝しなくてはね。あなたはわたしを、征服した女の名簿の、取るに足らない一人としかお考えにならなかった。半年も、わたしは運命のままに放っておかれた。それで今日になって、おそらく名誉ある心に動かされて、こんな遅い償いを申し出られる。いいえ、もう手遅れです。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-364"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Do you refuse?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5055
        "line_end": 5055
        "source_sequence": 5055
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5055-5055"
    "translation_ja": "オースティン。お断りになるのですか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-365"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Yours is the blame: we are no longer equal.  You have robbed me of the right to marry any one but you; and do you think me, then, so poor in spirit as to accept a husband on compulsion?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5057
        "line_end": 5059
        "source_sequence": 5057
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5057-5059"
    "translation_ja": |-
      ドロシー。あなたのせいです。わたしたちは、もう対等ではありません。わたしがあなた以外の人と結婚する権利は、あなたが奪った。それでわたしが、押しつけられた夫を受け入れるほど心の貧しい人間だとお思いですか？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-366"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Dorothy, you loved me once."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5061
        "line_end": 5061
        "source_sequence": 5061
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5061-5061"
    "translation_ja": "オースティン。ドロシー、昔はわたしを愛してくれた。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-367"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Ay, you will never guess how much: you will never live to understand how ignominious a defeat that conquest was.  I loved and trusted you: I judged you by myself; think, then, of my humiliation, when, at the touch of trial, all your qualities proved false, and I beheld you the slave of the meanest vanity—selfish, untrue, base!  Think, sir, what a humbling of my pride to have been thus deceived: to have taken for my idol such a commonplace imposture as yourself; to have loved—yes, loved—such a shadow, such a mockery of man.  And now I am unworthy to be the wife of any gentleman; and you—look me in the face, George—are you worthy to be my husband?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5063
        "line_end": 5072
        "source_sequence": 5063
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5063-5072"
    "translation_ja": |-
      ドロシー。ええ、どれほどか、あなたには想像もつきません。あなたの勝利が、わたしにとってどれほど恥ずべき敗北だったか、おわかりになる日は来ないでしょう。わたしは愛し、信じました。あなたも自分と同じだと思いました。ですから、いざ試されると、あなたの美点はすべて偽物で、あなた自身が最低の虚栄心の奴隷だと見えたとき、どれほど屈辱だったか、お考えください。身勝手で、不実で、卑劣！　こんなふうに騙されたことが、わたしの誇りをどれだけ打ち砕いたか。あなたほどありふれたまがい物を、崇める相手にしたことが。こんな影、男のまがい物を、愛した――ええ、愛してしまったことが。それで、もうどんな紳士の妻にも、わたしはふさわしくない。そしてあなたは――わたしの目を見て、ジョージ――わたしの夫にふさわしいのですか？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-368"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  No, Dorothy, I am not.  I was a vain fool; I blundered away the most precious opportunity; and my regret will be lifelong.  Do me the justice to accept this full confession of my fault.  I am here to-day to own and to repair it.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5074
        "line_end": 5077
        "source_sequence": 5074
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5074-5077"
    "translation_ja": |-
      オースティン。いいえ、ドロシー、ふさわしくありません。見栄っ張りの愚か者でした。何より貴重な機会を、自分のへまで失いました。一生悔やむでしょう。どうか、わたしが非を何もかも認めたことだけはお認めください。今日はその非を認め、償うために来たのです。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-369"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  Repair it?  Sir you condescend too far."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5079
        "line_end": 5079
        "source_sequence": 5079
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5079-5079"
    "translation_ja": "ドロシー。償う？　まあ、それは恐れ多いことでございます。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-370"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  I perceive with shame how grievously I had misjudged you.  But now, Dorothy, believe me, my eyes are opened.  I plead with you, not as my equal, but as one in all ways better than myself.  I admire you, not in that trivial sense in which we men are wont to speak of women, but as God’s work: as a wise mind, a noble soul, and a most generous heart, from whose society I have all to gain, all to learn.  Dorothy, in one word, I love you.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5081
        "line_end": 5087
        "source_sequence": 5081
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5081-5087"
    "translation_ja": |-
      オースティン。あなたをあれほど見誤っていたことは、恥ずかしいかぎりです。でもドロシー、信じてください、今は目が開いたのです。対等の相手としてではなく、あらゆる点でわたしよりすぐれた方として、あなたにお願いするのです。神のお造りになったものとして敬服しています。男が女を語るときの、あの軽々しい気持ちではありません。賢明な頭、気高い魂、寛大な心をもつ方。一緒にいれば、得ることも学ぶことも、すべてわたしのほうにある。ドロシー、ひとことでいえば、あなたを愛しています。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-371"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  And what, sir, has wrought this transformation?  You knew me of old, or thought you knew me?  Is it in six months of selfish absence that your mind has changed?  When did that change begin?  A week ago?  Sure, you would have written!  To-day?  Sir, if this offer be anything more than fresh offence, I have a right to be enlightened.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5089
        "line_end": 5093
        "source_sequence": 5089
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5089-5093"
    "translation_ja": |-
      ドロシー。どんなことが、それほどあなたを変えたのでしょう？　昔からわたしをご存じだった、少なくともご存じのつもりだったでしょう。身勝手な半年の不在のうちに、気が変わったのでしょうか。いつ変わり始めたのです？　一週間まえ？　なら、手紙を書いたはずです！　今日ですか？　これが新たな侮辱以上のものだとしたら、説明を求める権利はわたしにあります。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-372"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Madam, I foresaw this question.  So be it: I respect, and I will not deceive you.  But give me, first of all, a moment for defence.  There are few men of my habits and position who would have done as I have done: sate at the feet of a young boy, accepted his lessons, gone upon his errand: fewer still, who would thus, at the crisis of a love, risk the whole fortune of the soul—love, gratitude, even respect.  Yet more than that!  For conceive how I respect you, if I, whose lifelong trade has been flattery, stand before you and make the plain confession of a truth that must not only lower me, but deeply wound yourself.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5095
        "line_end": 5103
        "source_sequence": 5095
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5095-5103"
    "translation_ja": |-
      オースティン。それをお尋ねになることは予期しました。承知しました。あなたを敬うからこそ、偽りは申しません。けれどその前に、少しだけ弁明させてください。わたしのような習慣と地位がありながら、若者のお膝もとに座り、教えを受けて、その使いとして出向く男はめったにいません。まして恋の瀬戸際で、愛も感謝も尊敬さえも、心の財産すべてを賭ける男は、さらに少ないでしょう。それだけではありません。お考えください。わたしは一生、お世辞を商売としてきました。そのわたしがあなたの前に立ち、自分の値打ちを下げるばかりか、あなた自身を深く傷つける真実を、飾らず告白する。それだけあなたを尊重しているのです。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-373"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  What means—?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5105
        "line_end": 5105
        "source_sequence": 5105
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5105-5105"
    "translation_ja": "ドロシー。どういう――？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-374"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Young Fenwick, my rival for your heart, he it was that sent me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5107
        "line_end": 5107
        "source_sequence": 5107
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5107-5107"
    "translation_ja": "オースティン。あなたの心をめぐるわたしの恋敵、フェンウィック青年が、わたしをよこしたのです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-375"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  He?  O disgrace!  He sent you!  That was what he meant?  Am I fallen so low?  Am I your common talk among men?  Did you dice for me? Did he kneel?  O John, John, how could you!  And you, Mr. Austin, whither have you brought me down? shame heaping upon shame—to what end! oh, to what end?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5109
        "line_end": 5113
        "source_sequence": 5109
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5109-5113"
    "translation_ja": |-
      ドロシー。あの人が？　ああ、なんという恥！　あの人があなたを！　あの言葉はそういう意味だったの？　わたしはそんなに落ちぶれたの？　わたしのことは男たちの世間話にでもなるの？　二人でわたしをさいころの賭けにしたの？　あの人はひざまずいたの？　ああジョン、ジョン、どうしてそんなことを！　それにオースティンさん、あなたはわたしをどこまで引きずりおろしたの？　恥に恥を重ねて、何になるの！　ああ、何になるの！
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-376"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Madam, you wound me: you look wilfully amiss.  Sure, any lady in the land might well be proud to be loved as you are loved, with such nobility as Mr. Fenwick’s, with such humility as mine.  I came, indeed, in pity, in good-nature, what you will.  (See, dearest lady, with what honesty I speak: if I win you, it shall be with the unblemished truth.) All that is gone.  Pity? it is myself I pity.  I offer you not love—I am not worthy.  I ask, I beseech of you: suffer me to wait upon you like a servant, to serve you with my rank, my name, the whole devotion of my life.  I am a gentleman—ay, in spite of my fault—an upright gentleman; and I swear to you that you shall order your life and mine at your free will.  Dorothy, at your feet, in remorse, in respect, in love—O such love as I have never felt, such love as I derided—I implore, I conjure you to be mine!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5115
        "line_end": 5127
        "source_sequence": 5115
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5115-5127"
    "translation_ja": |-
      オースティン。それはひどいお言葉です。わざと悪いほうに見ておいでです。この国のどんな女性でも、あなたのように愛されれば、誇りに思ってよいはずです。フェンウィックさんにあれほど気高く愛され、わたしにはこれほど低く身を置いて愛されているのですから。確かに、憐れみから来ました。お人よしからでも、お好きなようにおっしゃい。（ご覧ください、こんなに正直にお話ししています。もしあなたを得るなら、曇りのない真実によってです。）もうそれはありません。憐れみ？　憐れむのはわたし自身です。愛する人として受け入れてくれとは申しません。そう願える身ではないのです。お願いします、どうかお願いします。召使いのようにおそばに置いてください。わたしの身分と名、この生涯を捧げてお仕えさせてください。過ちを犯しても、わたしは正直な紳士です。あなたの生涯もわたしの生涯も、あなたのお心ひとつでお決めになれると誓います。ドロシー、あなたの足もとで、後悔と敬意と愛をもって、お願いします。こんな愛は感じたことがない、今まであざ笑っていたような愛です。どうか、どうか、妻になってください！
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-377"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  Too late! too late."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5129
        "line_end": 5129
        "source_sequence": 5129
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5129-5129"
    "translation_ja": "ドロシー。遅すぎるのよ、遅すぎるのです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-378"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  No, no, not too late: not too late for penitence, not too late for love."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5131
        "line_end": 5132
        "source_sequence": 5131
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5131-5132"
    "translation_ja": "オースティン。いいえ、遅くはありません。悔い改めるにも、愛するにも、遅くはない。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-379"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Which do you propose? that I should abuse your compassion, or reward your treachery?  George Austin, I have been your mistress, and I will never be your wife.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5134
        "line_end": 5136
        "source_sequence": 5134
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5134-5136"
    "translation_ja": "ドロシー。どちらをお勧めなのです？　わたしがあなたの同情につけ込むこと、それとも裏切りに報いること？　ジョージ・オースティン、わたしはあなたの情婦でした。妻には決してなりません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-380"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Child, dear child, I have not told you all: there is worse still: your brother knows; the boy as good as told me.  Dorothy, this is scandal at the door—O let that move you: for that, if not for my sake, for that, if not for love, trust me, trust me again.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5138
        "line_end": 5141
        "source_sequence": 5138
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5138-5141"
    "translation_ja": |-
      オースティン。ねえ、お聞きください、まだ全部はお話ししていません。もっと悪い知らせが。弟さんは知っている。ほとんど本人からそう聞いたも同じです。ドロシー、醜聞がすぐそこに来ています。どうかそれをお考えに入れて。わたしのためでなくとも、そのために。愛のためでなくとも、そのために。信じてください、もう一度信じてください。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-381"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  I am so much the more your victim: that is all, and shall that change my heart?  The sin must have its wages.  This, too, was done long ago: when you stooped to lie to me.  The shame is still mine, the fault still yours.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5143
        "line_end": 5146
        "source_sequence": 5143
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5143-5146"
    "translation_ja": |-
      ドロシー。ならば、ますますわたしはあなたの犠牲者です。それだけのこと、心変わりする理由になりますか？　罪には報いがなくてはなりません。これも、とうの昔に決まったことです。あなたが身を落とし、わたしに嘘をついたときに。恥は相変わらずわたしの、罪は相変わらずあなたのものです。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-382"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Child, child, you kill me: you will not understand.  Can you not see? the lad will force me to a duel.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5148
        "line_end": 5149
        "source_sequence": 5148
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5148-5149"
    "translation_ja": "オースティン。ドロシー、ドロシー、胸が張り裂けそうです。どうにもわかってくださらない。おわかりになりませんか、あの若者はわたしに決闘を強いるのです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-383"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  And you will kill him?  Shame after shame, threat upon threat. Marry me, or you are dishonoured; marry me, or your brother dies: and this is man’s honour!  But my honour and my pride are different.  I will encounter all misfortune sooner than degrade myself by an unfaithful marriage.  How should I kneel before the altar, and vow to reverence as my husband you, you who deceived me as my lover?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5151
        "line_end": 5156
        "source_sequence": 5151
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5151-5156"
    "translation_ja": |-
      ドロシー。それで、あなたはあの子を殺すの？　恥のうえに恥、脅しのうえに脅し。結婚しろ、さもなくば汚名を着るぞ。結婚しろ、さもなくば弟は死ぬぞ。それが男の名誉なのね！　でも、わたしの名誉と誇りは違います。偽りの結婚で身を落とすより、どんな不幸にも立ち向かうわ。恋人としてわたしを騙したあなたを夫として敬うと、祭壇にひざまずいて、どうやって誓えるでしょう？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-384"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Dorothy, you misjudge me cruelly; I have deserved it.  You will not take me for your husband; why should I wonder?  You are right.  I have indeed filled your life with calamity: the wages, ay, the wages, of my sin are heavy upon you.  But I have one more thing to ask of your pity; and O remember, child, who it is that asks it: a man guilty in your sight, void of excuse, but old, and very proud, and most unused to supplication.  Dorothy Musgrave, will you forgive George Austin?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5158
        "line_end": 5164
        "source_sequence": 5158
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5158-5164"
    "translation_ja": |-
      オースティン。ドロシー、あんまりな誤解ですが、自業自得です。わたしを夫にしない。何を驚くことがありましょう。あなたは正しい。わたしはほんとうに、あなたの生涯を災いで満たした。わたしの罪の報いが、そう、報いが、重くあなたにのしかかっている。それでもお情けにすがって、一つだけお願いしたい。ああ、お願いしているのが誰か、覚えていてください。あなたの目には罪人、弁解の余地のない男。でも年をとり、ひどく誇り高く、人にすがることには慣れていない男です。ドロシー・マスグレーヴ、ジョージ・オースティンをお許しくださいますか？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-385"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  O, George!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5166
        "line_end": 5166
        "source_sequence": 5166
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5166-5166"
    "translation_ja": "ドロシー。ああ、ジョージ！"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-386"
    "section_id": "act-iii-scene-vii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  It is the old name: that is all I ask, and more than I deserve. I shall remember, often remember, how and where it was bestowed upon me for the last time.  I thank you, Dorothy, from my heart; a heart, child, that has been too long silent, but is not too old, I thank God! not yet too old, to learn a lesson and to accept a reproof.  I will not keep you longer: I will go—I am so bankrupt in credit that I dare not ask you to believe in how much sorrow.  But, Dorothy, my acts will speak for me with more persuasion.  If it be in my power, you shall suffer no more through me: I will avoid your brother; I will leave this place, I will leave England, to-morrow; you shall be no longer tortured with the neighbourhood of your ungenerous lover.  Dorothy, farewell!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5168
        "line_end": 5178
        "source_sequence": 5168
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5168-5178"
    "translation_ja": |-
      オースティン。昔の呼び名だ。それだけで結構、それさえわたしにはもったいない。最後にその名をくださったのが、いつどこで、どんなふうだったか、思い出すでしょう、何度でも。ドロシー、心からありがとう。あまりにも長く黙っていた心ですが、教訓を学び、お叱りを受け止めるには、ありがたいことに、まだ年をとりすぎてはいません。もうお引き止めしません。わたしは帰ります。信用という財産は使い果たしたので、わたしがどれほど悲しんでいるか、信じてほしいとも言えません。でもドロシー、わたしに代わって行いが、もっとよく語ってくれるはず。できるかぎり、もうわたしのせいでは苦しませません。弟さんは避けます。明日ここを去り、イングランドを去ります。心ない恋人が近くにいる苦しみを、もう味わうことはありません。ドロシー、さようなら！
    "translation_status": "reviewed"
    "source_kind": "dialogue"

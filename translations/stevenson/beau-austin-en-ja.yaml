          "start": 47
          "end": 55
          "exact": "and door"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 57
          "end": 59
          "exact": "C."
    "source_kind": "dialogue"
  - "id": "ba-122"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  What do I care?  I loved you too.  Little he thought of that, little either of you thought of that.  His blood—I’ll have his blood!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4213
        "line_end": 4214
        "source_sequence": 4213
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4213-4214"
    "translation_ja": "フェンウィック。それが何だ？　僕だって君を愛した。あいつはそんなことを気にしなかった。君もあいつも、二人とも気にしなかった。血だ。血で償わせる！"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-123"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  You shall never know his name."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4216
        "line_end": 4216
        "source_sequence": 4216
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4216-4216"
    "translation_ja": "ドロシー。あの人の名は決して明かさないわ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-124"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Know it?  Do you think I cannot guess?  Do you think I had not heard he followed you.  Do you think I had not suffered—O suffered! George Austin is the man.  Dear shall he pay it!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4218
        "line_end": 4220
        "source_sequence": 4218
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4218-4220"
    "translation_ja": |-
      フェンウィック。明かさないだって？　見当もつかないと思うのか？　あいつが君に言い寄っていたことを聞かなかったとでも？　僕は苦しまなかったとでも？　ああ、苦しんだとも！　ジョージ・オースティンだ。高い代償を払わせる！
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-125"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY (at his feet).  Pity me; spare me, spare your Dorothy!  I love him—love him—love him!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4222
        "line_end": 4223
        "source_sequence": 4222
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4222-4223"
    "translation_ja": "ドロシー（足もとにひざまずいて）。情けを。どうか許して、あなたのドロシーを許して！　愛しているの、愛して、愛しているの！"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 9
          "end": 20
          "exact": "at his feet"
    "source_kind": "dialogue"
  - "id": "ba-126"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  Dorothy, you have robbed me of my happiness, and now you would rob me of my revenge."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4225
        "line_end": 4226
        "source_sequence": 4225
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4225-4226"
    "translation_ja": "フェンウィック。ドロシー、君は僕の幸せを奪った。それで今度は、復讐まで奪うのか。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-127"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  I know it; and shall I ask, and you not grant?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4228
        "line_end": 4228
        "source_sequence": 4228
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4228-4228"
    "translation_ja": "ドロシー。わかっているわ。それでもお願いしたら、聞いてくれないの？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-128"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK (raising her).  No, Dorothy, you shall ask nothing, nothing in vain from me.  You ask his life; I give it you, as I would give you my soul; as I would give you my life, if I had any left.  My life is done; you have taken it.  Not a hope, not an end; not even revenge.  (He sits.)  Dorothy, you see your work.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4230
        "line_end": 4234
        "source_sequence": 4230
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4230-4234"
    "translation_ja": |-
      フェンウィック（彼女を立たせて）。いや、ドロシー。君が僕にする頼みは、何ひとつ、むだにはならない。あいつの命をくれというんだね。君にあげよう。この魂をあげるように。まだ残っていれば、命も君にあげるのと同じように。僕の人生は終わったんだ。君が持っていった。望みも、目当てもない。復讐さえ。（座る。）ドロシー、君がしたことだよ。
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 9
          "end": 20
          "exact": "raising her"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 278
          "end": 285
          "exact": "He sits"
    "source_kind": "dialogue"
  - "id": "ba-129"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  O God, forgive me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4236
        "line_end": 4236
        "source_sequence": 4236
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4236-4236"
    "translation_ja": "ドロシー。ああ、神よ、わたしをお許しください。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-130"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  Ay, Dorothy, He will, as I do."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4238
        "line_end": 4238
        "source_sequence": 4238
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4238-4238"
    "translation_ja": "フェンウィック。ああ、ドロシー、きっと許してくださる。僕が許すように。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-131"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  As you do?  Do you forgive me, John?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4240
        "line_end": 4240
        "source_sequence": 4240
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4240-4240"
    "translation_ja": "ドロシー。許してくれる？　わたしを許してくれるの、ジョン？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-132"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Ay, more than that, poor soul.  I said my life was done, I was wrong; I have still a duty.  It is not in vain you taught me; I shall still prove to you that it was not in vain.  You shall soon find that I am no backward friend.  Farewell.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4242
        "line_end": 4245
        "source_sequence": 4242
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4242-4245"
    "translation_ja": |-
      フェンウィック。ああ、それ以上だよ、かわいそうに。僕の人生は終わったと言ったけど、間違っていた。まだ務めがある。君に教わったことは無駄じゃなかった。それを君に証明するよ。すぐわかるだろう、僕がいざというとき尻込みする友ではないと。失礼する。
    "translation_status": "reviewed"
    "source_kind": "dialogue"

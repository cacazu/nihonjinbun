  - "id": "ba-256"
    "section_id": "act-ii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Well, Mr. George, but I am pleased to hear it.  Miss Musgrave is a most elegant lady."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

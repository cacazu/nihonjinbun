    "origin": "source"
    "source_text": |-
      ‘I’d crowns resign
      To call her mine,
      Sweet Lass of Richmond Hill!’
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"

    "source_text": |-
      BARBARA.  Well, Miss Dorothy, perhaps it’s out of my place: but I do hope Mr. Austin will come: I should love to have him see my necklace on.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"

  - "id": "ba-337"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  Mr. Austin.  (She shows AUSTIN in, and retires.)"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"

  - "id": "ba-440"
    "section_id": "act-iv-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Madam, I hasten to present my homage."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5351
        "line_end": 5351
        "source_sequence": 5351
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5351-5351"
    "translation_ja": "オースティン。奥さま、取り急ぎご挨拶申し上げます。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-441"
    "section_id": "act-iv-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  A truce to compliments!  Menteith, your charming fellow there, has set me positively crazy.  Dear George Austin, is it true? can it be true?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5353
        "line_end": 5355
        "source_sequence": 5353
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5353-5355"
    "translation_ja": "フォスター嬢。ご挨拶はもう結構！　あなたの愛嬌のある従者さんが、もう、わたしをやきもきさせて。ねえ、ジョージ・オースティン、本当なの？　ほんとうに？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-442"
    "section_id": "act-iv-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Madam, if he has been praising your niece he has been well inspired.  If he was speaking, as I spoke an hour ago myself, I wish, Miss Foster, that he had held his tongue.  I have indeed offered myself to Miss Dorothy, and she, with the most excellent reason, has refused me.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5357
        "line_end": 5360
        "source_sequence": 5357
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5357-5360"
    "translation_ja": |-
      オースティン。奥さま、姪御さんをお褒めしたのなら、あれはよく心得ておりました。わたしが一時間前に口にしたことを言ったのなら、フォスターさん、黙っていてくれればよかった。たしかにわたしはドロシーさんに結婚を申し込みました。そしてあの方は、ごもっともな理由でお断りになりました。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-443"
    "section_id": "act-iv-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  Is it possible? why, my dear George Austin . . . then I suppose it is John Fenwick after all!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5362
        "line_end": 5363
        "source_sequence": 5362
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5362-5363"
    "translation_ja": "フォスター嬢。そんなことってあるの？　まあ、ジョージ・オースティン……。じゃ、やっぱりジョン・フェンウィックなのね！"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-444"
    "section_id": "act-iv-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Not one of us is worthy."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5365
        "line_end": 5365
        "source_sequence": 5365
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5365-5365"
    "translation_ja": "オースティン。わたしどもの誰一人、あの方にふさわしくはありません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-445"
    "section_id": "act-iv-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  This is the most amazing circumstance.  You take my breath away.  My niece refuse George Austin? why, I give you my word, I thought she had adored you.  A perfect scandal: it positively must not get abroad.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5367
        "line_end": 5370
        "source_sequence": 5367
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5367-5370"
    "translation_ja": "フォスター嬢。こんな驚いたことはないわ。息が止まりそう。わたしの姪がジョージ・オースティンを振るだなんて。だって、絶対、あなたに夢中だと思ったのに。とんだ醜聞ね。絶対に口外してはだめよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-446"
    "section_id": "act-iv-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Madam, for that young lady I have a singular regard.  Judge me as tenderly as you can, and set it down, if you must, to an old man’s vanity—for, Evelina, we are no longer in the heyday of our youth—judge me as you will: I should prefer to have it known.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5372
        "line_end": 5375
        "source_sequence": 5372
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5372-5375"
    "translation_ja": |-
      オースティン。奥さま、わたしはあの若い方を、このうえなく大切に思っております。どうかお手柔らかにお考えください。どうしてもとあらば、年寄りの見栄と思ってくださっても結構。ねえ、イヴリーナ、わたしたちはもう若さの盛りではないのだから。どうお取りになろうとも、わたしとしては、世間に知られたほうがいいのです。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-447"
    "section_id": "act-iv-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  Can you?  George Austin, you?  My youth was nothing; I was a failure; but for you? no, George, you never can, you never must be old. You are the triumph of my generation, George, and of our old friendship too.  Think of my first dance and my first partner. And to have this story—no, I could not bear to have it told of you.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5377
        "line_end": 5381
        "source_sequence": 5377
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5377-5381"
    "translation_ja": |-
      フォスター嬢。そんなことができて？　ジョージ・オースティン、あなたが？　わたしの青春なんて取るに足らなかった。わたしは失敗したけれど、あなたはどう？　いいえ、ジョージ、あなたが年寄りになれるものですか。なってはいけないわ。あなたはわたしたちの世代の誇りよ、ジョージ。昔からの友だちであるわたしにとっても。わたしの最初のダンスを思い出して、最初に踊った相手を。そしてこんな話が――いいえ、あなたがそんなふうに噂されるのを、わたしは聞いていられないわ。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-448"
    "section_id": "act-iv-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Madam, there are some ladies over whom it is a boast to have prevailed; there are others whom it is a glory to have loved.  And I am so vain, dear Evelina, that even thus I am proud to link my name with that of Dorothy Musgrave.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5383
        "line_end": 5386
        "source_sequence": 5383
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5383-5386"
    "translation_ja": |-
      オースティン。奥さま、心を射止めて自慢になる女性もおいでなら、愛したというだけで名誉になる女性もおいでです。イヴリーナ、わたしはこう見えても自惚れ屋ですから、たとえこんなかたちでも、ドロシー・マスグレーヴというお名前と並べて自分の名前が語られるのを誇りに思うのです。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-449"
    "section_id": "act-iv-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  George, you are changed.  I would not know you."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5388
        "line_end": 5388
        "source_sequence": 5388
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5388-5388"
    "translation_ja": "フォスター嬢。ジョージ、変わったのね。あなたとは思えないほどだわ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-450"
    "section_id": "act-iv-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  I scarce know myself.  But pardon me, dear friend (taking his watch), in less than four minutes our illustrious guest will descend amongst us; and I observe Mr. Fenwick, with whom I have a pressing business.  Suffer me, dear Evelina!—
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5390
        "line_end": 5393
        "source_sequence": 5390
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5390-5393"
    "translation_ja": |-
      オースティン。わたし自身にも、今の自分がよく分かりません。しかし、ごめんください、旧友よ（時計を取り出す）。もう四分もたたず、貴いお客さまがここにお出ましになります。それに、フェンウィック君が見えました。急ぎの用があるのです。どうかお許しを、イヴリーナ――。
    "translation_status": "reviewed"

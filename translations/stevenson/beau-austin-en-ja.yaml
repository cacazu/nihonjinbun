    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  And so do I.  I had a touch of . . . Foster in the blood: the family gout, dears! . . .  And you, you ungrateful nymph, had him a whole day to yourself, and not a word to tell me when you returned.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-108"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  Why should I ask?  I love you."

        "source_sequence": 3998
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3998-3998"
    "translation_ja": "ドロシー。大事なこととは思わなかったの、イヴリーナ叔母さま。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-071"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  O do not make-believe.  I am in love with him myself, and have been any time since Nelson and the Nile.  As for you, Dolly, since he went away six months ago, you have been positively in the megrims.  I shall date your loss of appetite from George Austin’s vanishing.  No, my dear, our family require entertainment: we must have wit about us, and beauty, and the bel air.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4000
        "line_end": 4005
        "source_sequence": 4000
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4000-4005"
    "translation_ja": |-
      フォスター嬢。まあ、知らん顔はおやめ。わたし自身あの方に恋をしているのよ。ネルソンがナイルで勝ったころからずっと。ドリー、あなたのほうは半年まえにあの人が去ってから、ずっとふさぎ込んでいるじゃない。食欲がなくなったのも、ジョージ・オースティンが姿を消してからと見たわ。いいこと、うちの家には楽しみが要るのです。気の利いた話、美しい人、それから上品な物腰が、近くになければね。
    "translation_status": "reviewed"

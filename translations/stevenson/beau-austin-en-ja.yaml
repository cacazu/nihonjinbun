    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4012-4013"
    "translation_ja": "バーバラ。ええ、さようです、ドロシーさま。あの方の二輪馬車でペンズハーストへおいでになった、その日に。わたしはお供できませんでしたでしょう、覚えておいでですか。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-075"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  I remember."
    "source_languages":
      - "en"
    "source_locations":

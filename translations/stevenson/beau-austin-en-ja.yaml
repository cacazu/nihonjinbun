    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  Ha! what are you crying for?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5189
        "line_end": 5189
        "source_sequence": 5189
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5189-5189"
    "translation_ja": "アンソニー。おや、何を泣いているの？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-391"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  Nothing, dear!  (Rising.)"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5191
        "line_end": 5191
        "source_sequence": 5191
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5191-5191"

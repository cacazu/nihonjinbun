      ANTHONY.  Yes, ma’am, I like my regiment: we are all gentlemen, from old Fred downwards, and all of a good family.  Indeed, so are all my friends, except one tailor sort of fellow, Bosbury.  But I’m done with him.  I assure you, Aunt Evelina, we are Corinthian to the last degree.  I wouldn’t shock you ladies for the world—
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4727
        "line_end": 4731
        "source_sequence": 4727
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4727-4731"
    "translation_ja": |-
      アンソニー。ええ、叔母上、連隊は気に入っています。フレッドの大将を筆頭に、みんな紳士で、育ちがいいんです。じっさい、僕の友人はみんなそうだ。仕立屋みたいなやつ、ボズベリー一人を除けばね。でも、あいつとはもうおしまい。間違いなく、僕らはとことん粋な遊び人です、イヴリーナ叔母上。ご婦人方をぎょっとさせる気など、毛頭ありませんが――
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-274"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  Don’t mind me, my dear; go on."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4733
        "line_end": 4733
        "source_sequence": 4733
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4733-4733"
    "translation_ja": "フォスター嬢。わたしなら気にせず、続けておくれ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-275"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  Really, ma’am, you must pardon me: I trust I understand what topics are to be avoided among females—And before my sister, too!  A girl of her age!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4735
        "line_end": 4737
        "source_sequence": 4735
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4735-4737"
    "translation_ja": "アンソニー。いや、本当に、叔母上、ご勘弁ください。女性の前でしていけない話題も心得ているつもりです。それも姉さんの前ですよ！　あの年の娘の！"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-276"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  Why, you dear, silly fellow, I’m old enough to be your mother."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4739
        "line_end": 4739
        "source_sequence": 4739
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4739-4739"
    "translation_ja": "ドロシー。まあ、ばかな子ね。わたしはあなたのお母さまでもおかしくない年じゃない。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-277"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  My dear Dolly, you do not understand; you are not a man of the world.  But, as I was going on to say, there is no more spicy regiment in the service.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4741
        "line_end": 4743
        "source_sequence": 4741
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4741-4743"
    "translation_ja": "アンソニー。ねえ、ドリーにはわからないよ。世間を知る男じゃないんだから。でも話の続きだけど、軍でうちほど刺激のある連隊はないね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-278"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  I am not surprised that it maintains its old reputation. You know, my dear (to DOROTHY), it was George Austin’s regiment.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4745
        "line_end": 4746
        "source_sequence": 4745
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4745-4746"
    "translation_ja": "フォスター嬢。昔からの評判に違わないのも、不思議じゃありません。（ドロシーに。）ほら、ジョージ・オースティンの連隊だったのですから。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 90
          "end": 92
          "exact": "to"
    "source_kind": "dialogue"
  - "id": "ba-279"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  Was it, aunt?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4748
        "line_end": 4748
        "source_sequence": 4748
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4748-4748"
    "translation_ja": "ドロシー。そうでしたの、叔母さま？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-280"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  Beau Austin?  Yes, it was; and a precious dust they make about him still—a parcel of old frumps!  That’s why I went to see him.  But he’s quite extinct: he couldn’t be Corinthian if he tried.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4750
        "line_end": 4752
        "source_sequence": 4750
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4750-4752"
    "translation_ja": |-
      アンソニー。伊達男オースティン？　そうだよ、今でもあの男のことになるとやかましいのなんの。古くさい連中ばかりさ！　そのおかげで会いに行ったんだけどね。もうすっかり昔の人だよ。どうあがいても、粋な遊び人にはなれっこない。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-281"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  I am afraid that even at your age George Austin held a very different position from the distinguished Anthony Musgrave.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4754
        "line_end": 4755
        "source_sequence": 4754
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4754-4755"
    "translation_ja": "フォスター嬢。ジョージ・オースティンがあなたの年だったころはね、高名なアンソニー・マスグレーヴとは、とても違う地位にいらしたでしょうね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-282"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  Come, ma’am, I take that unkindly.  Of course I know what you’re at: of course the old pût cut no end of a dash with the Duchess.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4757
        "line_end": 4758
        "source_sequence": 4757
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4757-4758"
    "translation_ja": "アンソニー。いや、それは意地悪ですよ、叔母上。もちろん言いたいことはわかってます。あの老いぼれ、公爵夫人のおかげで大いに名を上げましたからね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-283"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  My dear child, I was thinking of no such thing; that was immoral."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4760
        "line_end": 4761
        "source_sequence": 4760
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4760-4761"
    "translation_ja": "フォスター嬢。まあ、そういうことを思ったのではありませんよ。あれは不道徳です。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 62
          "end": 66
          "exact": "that"
    "source_kind": "dialogue"
  - "id": "ba-284"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  Then you mean that affair at Brighton: when he cut the Prince about Perdita Robinson."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4763
        "line_end": 4764
        "source_sequence": 4763
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4763-4764"
    "translation_ja": "アンソニー。じゃあブライトンでのあれですか、パーディタ・ロビンソンのことで、殿下を無視なさったとき。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-285"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  No, I had forgotten it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4766
        "line_end": 4766
        "source_sequence": 4766
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4766-4766"
    "translation_ja": "フォスター嬢。いいえ、忘れていました。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-286"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  O, well, I know—that duel!  But look here, Aunt Evelina, I don’t think you’d be much gratified after all if I were to be broke for killing my commanding officer about a quarrel at cards.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4768
        "line_end": 4770
        "source_sequence": 4768
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4768-4770"
    "translation_ja": "アンソニー。ああ、わかりました。あの決闘ですね！　でもねえ、イヴリーナ叔母上、僕がトランプのもめ事で上官を殺して、免職になったとしたら、そんなにお喜びにはならないでしょう。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-287"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Nobody asks you, Anthony, to imitate Mr. Austin.  I trust you will set yourself a better model.  But you may choose a worse.  With all his faults, and all his enemies, Mr. Austin is a pattern gentleman: You would not ask a man to be braver, and there are few so generous.  I cannot bear to hear him called in fault by one so young.  Better judges, dear, are better pleased.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4772
        "line_end": 4777
        "source_sequence": 4772
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4772-4777"
    "translation_ja": |-
      ドロシー。アンソニー、誰もオースティンさんのまねをしろとは言っていないわ。もっと立派な手本を選んでほしいくらいよ。だけど、あの人より劣る手本だっていくらでもいる。短所や敵は多くても、オースティンさんは紳士の模範です。あの人以上に勇敢であれなんて誰にも求められないし、あれほど寛大な人もめったにいない。そんな若いあなたから、あの人の欠点を言われるのは聞いていられないわ。見る目のある人は、もっとあの人をよく言います。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-288"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  Hey-day! what’s this?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4779
        "line_end": 4779
        "source_sequence": 4779
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4779-4779"
    "translation_ja": "アンソニー。おやおや、どういう風の吹き回し？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-289"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  Why, Dolly, this is April and May.  You surprise me."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4781
        "line_end": 4781
        "source_sequence": 4781
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4781-4781"
    "translation_ja": "フォスター嬢。まあ、ドリー、四月の雨から、五月の陽気に早変わりね。驚きましたよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-290"
    "section_id": "act-iii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  I am afraid, indeed, madam, that you have much to suffer from my caprice.  (She goes out, L.)
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4783
        "line_end": 4784
        "source_sequence": 4783
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4783-4784"
    "translation_ja": "ドロシー。叔母さまも、わたしの気まぐれには、さぞお困りでしょうね。（左へ退場。）"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 86
          "end": 98
          "exact": "She goes out"
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 100
          "end": 102
          "exact": "L."
    "source_kind": "dialogue"
  - "id": "ba-291"
    "section_id": "act-iii-scene-ii"
    "kind": "heading"
    "origin": "source"
    "source_text": "SCENE II"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4787
        "line_end": 4787
        "source_sequence": 4787
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4787-4787"
    "translation_ja": "第二場"
    "translation_status": "reviewed"
  - "id": "ba-292"
    "section_id": "act-iii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY, MISS FOSTER"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4790
        "line_end": 4790
        "source_sequence": 4790
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4790-4790"
    "translation_ja": "アンソニー、フォスター嬢。"
    "translation_status": "reviewed"
    "source_kind": "stage_direction"
  - "id": "ba-293"
    "section_id": "act-iii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  What is the meaning of all this, ma’am?  I don’t like it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4792
        "line_end": 4792
        "source_sequence": 4792
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4792-4792"
    "translation_ja": "アンソニー。どういう意味です、叔母上？　僕には気に入りません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-294"
    "section_id": "act-iii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  Nothing, child, that I know.  You spoke of Mr. Austin, our dear friend, like a groom; and she, like any lady of taste, took arms in his defence.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4794
        "line_end": 4796
        "source_sequence": 4794
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4794-4796"
    "translation_ja": "フォスター嬢。わたしには、何も。あなたが、わたしたちの大事な友人、オースティンさんのことを馬丁のように話したので、あの子は見る目のあるご婦人なら誰でもするように、かばったまでです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-295"
    "section_id": "act-iii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  No, ma’am, that won’t do.  I know the sex.  You mark my words, the girl has some confounded nonsense in her head, and wants looking after.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4798
        "line_end": 4800
        "source_sequence": 4798
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4798-4800"
    "translation_ja": "アンソニー。いいえ、それじゃ納得しません。女というものを僕は知っています。僕の言葉を覚えておいてください。あの娘はけしからん考えを抱いている。見張ってやる必要がありますよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-296"
    "section_id": "act-iii-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  In my presence, Anthony, I shall ask you to speak of Dorothy with greater respect.  With your permission, your sister and I will continue to direct our own affairs.  When we require the interference of so young and confident a champion, you shall know. (Curtsies, kisses her hand, and goes out, L.)
    "source_languages":
      - "en"
    "source_locations":

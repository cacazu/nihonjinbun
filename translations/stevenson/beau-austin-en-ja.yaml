    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Yet I must tell you.  Sit down.  (She picks up the necklace, and stands looking at it.  Then, breaking down.)  O John, John, it’s long since I left home.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"

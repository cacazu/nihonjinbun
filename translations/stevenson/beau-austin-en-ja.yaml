        "source_sequence": 3995
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3995-3996"
    "translation_ja": "フォスター嬢。知っていて、黙っていたの？　世間に対して大罪よ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-070"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  I did not think it mattered, Aunt Evelina."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3998

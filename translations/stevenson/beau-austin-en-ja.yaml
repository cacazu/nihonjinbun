  - "id": "ba-421"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MENTEITH.  Honoured madam, I have had the pleasure to serve Mr. George for more than thirty years.  This is a privilege—a very great privilege. I have beheld him in the first societies, moving among the first rank of personages; and none, madam, none outshone him.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5286
        "line_end": 5289
        "source_sequence": 5286
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5286-5289"
    "translation_ja": |-
      メンティース。奥さま、わたくしは三十年以上もジョージさまにお仕えする栄に浴しております。これは光栄なこと、まことに光栄なことでございます。名だたる方々の集いにあって、第一級のお歴々に伍しておいでのご主人さまを、この目で見てまいりました。奥さま、そのなかにも、ひときわ輝くあのお方にまさる方はおいでではございませんでした。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-422"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  I assure you, madam, when Mr. Menteith took me to the play, he talked so much of Mr. Austin that I couldn’t hear a word of Mr. Kean.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5291
        "line_end": 5292
        "source_sequence": 5291
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5291-5292"
    "translation_ja": "バーバラ。本当です、奥さま。メンティースさんが芝居に連れていってくださったときも、オースティンさまのお話ばかりなさるので、キーンさんの台詞がひと言も聞こえませんでした。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-423"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  Well, well, and very right.  That was the old school of service, Barbara, which you would do well to imitate.  This is a child, Menteith, that I am trying to form.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5294
        "line_end": 5296
        "source_sequence": 5294
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5294-5296"
    "translation_ja": "フォスター嬢。まあ、結構、まことに結構。昔気質の奉公人とはそういうものよ、バーバラ。あなたも見習いなさい。メンティース、この子はいまわたしがしつけているところなの。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-424"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Quite so, madam."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5298
        "line_end": 5298
        "source_sequence": 5298
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5298-5298"
    "translation_ja": "メンティース。なるほど、さようでございますか、奥さま。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-425"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  And are we soon to see our princely guest, Menteith?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5300
        "line_end": 5300
        "source_sequence": 5300
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5300-5300"
    "translation_ja": "フォスター嬢。それで、メンティース、貴いお客さまには、もうじきお目にかかれるのかしら。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-426"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MENTEITH.  His Royal Highness, madam?  I believe I may say quite so.  Mr. George will receive our gallant prince upon the Pantiles (looking at his watch) in, I should say, a matter of twelve minutes from now.  Such, madam, is Mr. George’s order of the day.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5302
        "line_end": 5305
        "source_sequence": 5302
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5302-5305"
    "translation_ja": |-
      メンティース。公爵殿下でございますか、奥さま。もうじきと申し上げてよろしいかと。ジョージさまがあのご立派な王子殿下をパンタイルズでお迎えになるのは（時計を見て）あと十二分ばかりと存じます。それが、奥さま、ジョージさまの本日のお取り決めでございます。
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 132
          "end": 152
          "exact": "looking at his watch"
    "source_kind": "dialogue"
  - "id": "ba-427"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  I beg your pardon, madam, I am sure, but are we really to see one of His Majesty’s own brothers?  That will be pure!  O madam, this is better than Carlisle.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5307
        "line_end": 5309
        "source_sequence": 5307
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5307-5309"
    "translation_ja": "バーバラ。失礼をお許しください、奥さま。でも本当に、国王陛下の弟君のお一人にお会いできるんですか？　まあ、すてき！　奥さま、カーライルよりずっといいところですね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-428"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  The wood-note wild: a loyal Cumbrian, Menteith."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5311
        "line_end": 5311
        "source_sequence": 5311
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5311-5311"
    "translation_ja": "フォスター嬢。野の鳥みたいに思ったままをさえずるの。カンバーランド生まれの忠臣よ、メンティース。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-429"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Eh?  Quite so, madam."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5313
        "line_end": 5313
        "source_sequence": 5313
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5313-5313"
    "translation_ja": "メンティース。は？　ああ、まことにさようでございますね、奥さま。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-430"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  When she has seen as much of the Royal Family as you, my good fellow, she will find it vastly less entertaining.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5315
        "line_end": 5316
        "source_sequence": 5315
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5315-5316"
    "translation_ja": "フォスター嬢。この子もあなたほど王家の方々を見慣れれば、そんなに面白いものじゃないと分かりますよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-431"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MENTEITH.  Yes, madam, indeed; In these distinguished circles, life is but a slavery.  None of the best set would relish Tunbridge without Mr. George; Tunbridge and Mr. George (if you’ll excuse my plainness, madam) are in a manner of speaking identified; and indeed it was the Dook’s desire alone that brought us here.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5318
        "line_end": 5322
        "source_sequence": 5318
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5318-5322"
    "translation_ja": |-
      メンティース。はい、奥さま、まったく仰せのとおりでございます。ああいうご立派な社交界におりますと、自由などございません。上流の方々は、ジョージさま抜きではタンブリッジを楽しまれますまい。率直に申してお許しいただけるなら、タンブリッジとジョージさまは、いわば切り離せないものなのでございます。それに実のところ、わたくしどもが参ったのも、ひとえに公爵殿下たってのご希望で。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-432"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  What? the Duke?  O dear! was it for that?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5324
        "line_end": 5324
        "source_sequence": 5324
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5324-5324"
    "translation_ja": "バーバラ。えっ、公爵さまが？　まあ！　そんなわけでいらしたの？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-433"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MENTEITH.  Though, to be sure, madam, Mr. George would always be charmed to find himself (bowing) among so many admired members of his own set.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5326
        "line_end": 5327
        "source_sequence": 5326
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5326-5327"
    "translation_ja": "メンティース。もっとも奥さま、ジョージさまも（お辞儀して）同じ社交界のご立派な方々が大勢お集まりのところへ参るのは、いつでもお喜びになるにきまっておりますが。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 90
          "end": 96
          "exact": "bowing"
    "source_kind": "dialogue"
  - "id": "ba-434"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  Upon my word, Menteith, Mr. Austin is as fortunate in his servant as his reputation."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5329
        "line_end": 5330
        "source_sequence": 5329
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5329-5330"
    "translation_ja": "フォスター嬢。まあ、メンティース、オースティンさんはご評判に恵まれているばかりでなく、従者にも恵まれていますね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-435"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MENTEITH.  Quite so, madam.  But let me observe that the opportunities I have had of acquiring a knowledge of Mr. George’s character have been positively unrivalled.  Nobody knows Mr. George like his old attendant. The goodness of that gentleman—but, madam, you will soon be equally fortunate, if, as I understand, it is to be a match.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5332
        "line_end": 5336
        "source_sequence": 5332
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5332-5336"
    "translation_ja": |-
      メンティース。まことに仰せのとおりで、奥さま。ただ、ジョージさまのお人柄をこれほど知る機会に恵まれた者は、ほかにおりますまい。長年お仕えしたこのわたくしほどジョージさまをよく存じ上げる者はおりません。まあ、あのお方のご親切ときたら――とはいえ奥さまもじきに、同じ幸運に恵まれましょうね。わたくしの承知しておりますとおり、ご縁談がまとまるのでしたら。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-436"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  I hope, Menteith, you are not taking leave of your senses. Is it possible you mean my niece?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5338
        "line_end": 5339
        "source_sequence": 5338
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5338-5339"
    "translation_ja": "フォスター嬢。メンティース、気でも違ったのではないでしょうね。まさかわたしの姪のこと？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-437"
    "section_id": "act-iv-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MENTEITH.  Madam, I have the honour to congratulate you.  I put a second curl in Mr. George’s hair on purpose.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5341
        "line_end": 5342
        "source_sequence": 5341
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5341-5342"
    "translation_ja": "メンティース。奥さま、お祝いを申し上げます。ジョージさまの髪を、わざわざ一房余計に巻いて差し上げたのでございますから。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-438"
    "section_id": "act-iv-scene-ii"
    "kind": "heading"
    "origin": "source"

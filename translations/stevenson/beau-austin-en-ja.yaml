        "line_end": 5209
        "source_sequence": 5209
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5209-5209"
    "translation_ja": "ドロシー。お断りしたのよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-400"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  Dorothy, you lie.  You would shield your lover; but this concerns not you only: it strikes my honour and my father’s honour.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5211
        "line_end": 5212
        "source_sequence": 5211
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5211-5212"
    "translation_ja": "アンソニー。ドロシー、嘘をつけ。恋人をかばいたいんだろ。でも、これはあなただけの話じゃない。僕と、父さんの名誉にかかわるんだ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-401"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  I have refused him—refused him, I tell you—refused him.  The blame is mine; are you so mad and wicked that you will not see?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5214
        "line_end": 5215
        "source_sequence": 5214
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5214-5215"
    "translation_ja": "ドロシー。断ったのよ。断ったと言っているでしょう、断ったの。悪いのはわたしよ。それもわからないほどどうかしているの？　そんなに意地悪なの？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-402"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  I see this: that man must die."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5217
        "line_end": 5217
        "source_sequence": 5217
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5217-5217"
    "translation_ja": "アンソニー。一つわかる。あの男は死なねばならない。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-403"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  He? never!  You forget, you forget whom you defy; you run upon your death."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5219
        "line_end": 5220
        "source_sequence": 5219
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5219-5220"
    "translation_ja": "ドロシー。あの人が？　そんなことないわ！　相手が誰かを忘れている。死にに行くようなものよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-404"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  Ah, my girl, you should have thought of that before.  It is too late now."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5222
        "line_end": 5223
        "source_sequence": 5222
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5222-5223"
    "translation_ja": "アンソニー。ああ、姉さん、もっと早く考えておくべきだったね。もう手遅れだ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-405"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Anthony, if I beg you—Anthony, I have tried to be a good sister; I brought you up, dear, nursed you when you were sick, fought for you, hoped for you, loved you—think of it, think of the dear past, think of our home and the happy winter nights, the castles in the fire, the long shining future, the love that was to forgive and suffer always—O you will spare, you will spare me this.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5225
        "line_end": 5230
        "source_sequence": 5225
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5225-5230"
    "translation_ja": |-
      ドロシー。アンソニー、お願いしたら？　アンソニー、わたしはよい姉でいようとしたわ。おまえを育てて、病気のときは看病して、おまえのために闘って、望みをかけて、愛しました。考えてみて、大事だった昔を。おうちのこと、楽しかった冬の夜、炉の火に見たお城、長く輝かしい未来を。どんなことも許し、どんなことも耐えるはずの愛を。ああ、お願いだから、こんなことはしないで、こんな目に遭わせないで。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-406"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  I will tell you what I will do, Dolly: I will do just what you taught me—my duty: that, and nothing else.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5232
        "line_end": 5233
        "source_sequence": 5232
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5232-5233"
    "translation_ja": "アンソニー。ドリー、どうするか言ってやる。姉さんの教えどおりにするんだ。僕の務めを果たす。それ以上のことはしない。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-407"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  O Anthony, you also, you to strike me!  Heavens, shall I kill them—I—I, that love them, kill them!  Miserable, sinful girl!  George, George, thank God, you will be far away!  O go, George, go at once!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5235
        "line_end": 5237
        "source_sequence": 5235
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5235-5237"
    "translation_ja": |-
      ドロシー。ああアンソニー、あなたまで、わたしを傷つけるのね！　どうして、二人を殺してしまうの？　二人を愛しているこのわたしが、二人を殺すの？　惨めで罪深い女！　ジョージ、ジョージ、ありがたいことに、あなたは遠くに行くのね！　ああ、行って、ジョージ、今すぐ行って！
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-408"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  He goes the coward!  Ay, is this more of your contrivance? Madam, you make me blush.  But to-day at least I know where I can find him.  This afternoon, on the Pantiles, he must dance attendance on the Duke of York.  Already he must be there; and there he is at my mercy.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5239
        "line_end": 5242
        "source_sequence": 5239
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5239-5242"
    "translation_ja": |-
      アンソニー。逃げるのか、あの臆病者！　それも姉さんの仕組んだことか？　まったく恥ずかしい。でも今日だけは、どこへ行けば会えるかわかるよ。午後、パンタイルズでヨーク公のお相手をするはずだ。もう行っているだろう。そこではあいつは僕の思うままだ。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-409"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Thank God, you are deceived: he will not fight.  He promised me that; thank God I have his promise for that.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5244
        "line_end": 5245
        "source_sequence": 5244
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5244-5245"
    "translation_ja": "ドロシー。ああ、ありがたいことに、あなたの読みは外れたわ。あの人は決闘しません。約束してくれた。神さまのおかげで、そう約束してくれたもの。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-410"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  Promise!  Do you see this? (producing necklace) the thing he bribed your maid with?  I shall dash it in his teeth before the Duke and before all Tunbridge.  Promise, you poor fool? what promise holds against a blow?  Get to your knees and pray for him; for, by the God above, if he has any blood in his body, one of us shall die before to-night.  (He goes out.)
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5247
        "line_end": 5252
        "source_sequence": 5247
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5247-5252"
    "translation_ja": |-
      アンソニー。約束か！　これが見えるかい？（首飾りを取り出して。）侍女を買収するのに使った品だ。公爵とタンブリッジ中の人の前で、あいつの顔に叩きつけてやる。約束だと、かわいそうに。殴られて守れる約束があるか？　膝をついて祈るんだな。神にかけて、あいつの体に少しでも血が通っているなら、日が暮れるまでにどっちかが死ぬ。（退場。）
    "translation_status": "reviewed"

        "original_unit_id": "line-5433-5435"
    "translation_ja": "フェンウィック。オースティンさん、僕の口からはそんなお願いまで、とてもできませんでした。いや、それどころか、立場が逆なら、僕にはあなたのまねは怖くてできそうもありません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-461"
    "section_id": "act-iv-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Child, child, you could not afford it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

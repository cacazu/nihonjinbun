    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      To these, AUSTIN.  MENTEITH falls back, and AUSTIN takes his place in front of MISS FOSTER, his attitude a counterpart of MENTEITH’S.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"

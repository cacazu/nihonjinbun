        "line_start": 4525
        "line_end": 4525
        "source_sequence": 4525
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4525-4525"
    "translation_ja": "オースティン。心からおっしゃっているのですね。（座る。）何をお望みですか？"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 37
          "end": 41
          "exact": "Sits"
    "source_kind": "dialogue"
  - "id": "ba-222"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  Marry her."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4527
        "line_end": 4527
        "source_sequence": 4527
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4527-4527"
    "translation_ja": "フェンウィック。あの方と結婚してください。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-223"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Mr. Fenwick, I am the older man.  I have seen much of life, much of society, much of love.  When I was young, it was expected of a gentleman to be ready with his hat to a lady, ready with his sword to a man; to honour his word and his king; to be courteous with his equals, generous to his dependants, helpful and trusty in friendship.  But it was not asked of us to be quixotic.  If I had married every lady by whom it is my fortune—not my merit—to have been distinguished, the Wells would scarce be spacious enough for my establishment.  You see, sir, that while I respect your emotion, I am myself conducted by experience.  And besides, Mr. Fenwick, is not love a warfare? has it not rules? have not our fair antagonists their tactics, their weapons, their place of arms? and is there not a touch of—pardon me the word! of silliness in one who, having fought, and having vanquished, sounds a parley, and capitulates to his own prisoner?  Had the lady chosen, had the fortune of war been other, ’tis like she had been Mrs. Austin.  Now I . . . You know the world.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4529
        "line_end": 4544
        "source_sequence": 4529
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4529-4544"
    "translation_ja": |-
      オースティン。フェンウィックさん、わたしのほうが年上です。人生も社交界も恋も、いろいろ見てきました。わたしが若かった頃、紳士はご婦人にはすぐ帽子を取り、男にはすぐ剣を抜けと教えられた。約束と王を重んじ、同等の人には礼節を、下で働く者には気前よく、友には手を貸し信義を尽くす。しかし、ドン・キホーテになれとは言われませんでした。わたしの手柄でもなしに、たまたま目をかけてくださったご婦人を、片っ端から妻にしていたら、ウェルズはわたしの所帯だけでいっぱいでしょうよ。おわかりでしょう、あなたの感情は尊重しますが、わたしを導くのは経験なのです。それに、フェンウィックさん、恋は戦いではありませんか。掟もあれば、相手の美しい方々にも作戦が、武器が、陣地があります。戦って勝っておきながら、休戦の合図をして、自分の捕虜に降伏するとは、少し、失礼を承知で申し上げますが、間が抜けてはいませんか。ご婦人がその気なら、戦運が逆なら、あの方はオースティン夫人になっていたかもしれません。今となっては……世間というものはおわかりでしょう。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-224"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  I know, sir, that the world contains much cowardice.  To find Mr. Austin afraid to do the right, this surprises me.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4546
        "line_end": 4547
        "source_sequence": 4546
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4546-4547"
    "translation_ja": "フェンウィック。世間に臆病が多いのは存じています。けれど、オースティンさんが正しいことをするのを怖がるとは驚きました。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-225"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Afraid, child?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4549
        "line_end": 4549
        "source_sequence": 4549
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4549-4549"
    "translation_ja": "オースティン。怖がる、ですと、坊や？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-226"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Yes, sir, afraid.  You know her, you know if she be worthy; and you answer me with—the world: the world which has been at your feet: the world which Mr. Austin knows so well how to value and is so able to rule.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4551
        "line_end": 4553
        "source_sequence": 4551
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4551-4553"
    "translation_ja": "フェンウィック。ええ。あの方をご存じだ。結婚の相手に足るかもご存じだ。それなのに、お答えは世間ですか。足もとにひれ伏してきた世間、オースティンさんが値打ちをよくわきまえ、うまく治めてこられた世間です。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-227"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  I have lived long enough, Mr. Fenwick, to recognise that the world is a great power.  It can make; but it can break.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4555
        "line_end": 4556
        "source_sequence": 4555
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4555-4556"
    "translation_ja": "オースティン。フェンウィックさん、わたしは世間が大きな力であると知るくらいには長く生きてきました。人を引き立てることもあれば、叩き潰すこともある。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-228"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Sir, suffer me: you spoke but now of friendship, and spoke warmly.  Have you forgotten Colonel Villiers?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4558
        "line_end": 4559
        "source_sequence": 4558
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4558-4559"
    "translation_ja": "フェンウィック。失礼ながら、さきほど友情を語られましたね。お熱く語られました。ヴィリアーズ大佐はお忘れですか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-229"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Mr. Fenwick, Mr. Fenwick, you forget what I have suffered."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4561
        "line_end": 4561
        "source_sequence": 4561
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4561-4561"
    "translation_ja": "オースティン。フェンウィックさん、フェンウィックさん、わたしがどれほど苦しんだかをお忘れだ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-230"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  O sir, I know you loved him.  And yet, for a random word you quarrelled; friendship was weighed in vain against the world’s code of honour; you fought, and your friend fell.  I have heard from others how he lay long in agony, and how you watched and nursed him, and it was in your embrace he died.  In God’s name have you forgotten that?  Was not this sacrifice enough? or must the world, once again, step between Mr. Austin and his generous heart?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4563
        "line_end": 4569
        "source_sequence": 4563
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4563-4569"
    "translation_ja": |-
      フェンウィック。ああ、大切な友でいらしたことは承知しています。それでも、何気ないひとことでお争いになった。世間の名誉の掟に対しては友情も軽かった。お二人は決闘し、友は倒れた。長く苦しむあの方のそばで、あなたが寝ずに看病し、最期にはあなたの腕の中で亡くなられたと、人から聞きました。お願いです、それをお忘れですか。あの犠牲で足らなかったのですか。それとも世間はまた、オースティンさんとその寛大な心のあいだに割って入るのですか？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-231"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Good God, sir, I believe you are in the right; I believe, upon my soul I believe, there is something in what you say.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4571
        "line_end": 4572
        "source_sequence": 4571
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4571-4572"
    "translation_ja": "オースティン。なんということだ、あなたが正しいと思います。ほんとうに、あなたのお話には一理ある。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-232"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  Something, Mr. Austin?  O credit me, the whole difference betwixt good and evil."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4574
        "line_end": 4575
        "source_sequence": 4574
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4574-4575"
    "translation_ja": "フェンウィック。一理ですか、オースティンさん？　ああ、信じてください。善か悪かほどの違いがあるのです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-233"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Nay, nay, but there you go too far.  There are many kinds of good: honour is a diamond cut in a thousand facets, and with the true fire in each.  Thus, and with all our differences, Mr. Fenwick, you and I can still respect, we can still admire each other.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4577
        "line_end": 4580
        "source_sequence": 4577
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4577-4580"
    "translation_ja": |-
      オースティン。いや、いや、それは言いすぎです。善にもいろいろある。名誉は千の面を刻んだダイヤモンドで、どの面からも本物の輝きを放つ。こうして意見は違ってもね、フェンウィックさん、わたしたちは、互いを今も尊敬できる、立派なものだと思えるのです。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-234"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Bear with me still, sir, if I ask you what is the end of life but to excel in generosity?  To pity the weak, to comfort the afflicted, to right where we have wronged, to be brave in reparation—these noble elements you have; for of what besides is the fabric of your dealing with Colonel Villiers?  That is man’s chivalry to man.  Yet to a suffering woman—a woman feeble, betrayed, unconsoled—you deny your clemency, you refuse your aid, you proffer injustice for atonement.  Nay, you are so disloyal to yourself that you can choose to be ungenerous and unkind. Where, sir, is the honour?  What facet of the diamond is that?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4582
        "line_end": 4590
        "source_sequence": 4582
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4582-4590"
    "translation_ja": |-
      フェンウィック。もう少し聞いてください。寛大さに秀でることのほかに、人生の目当てが何でしょう？　弱い者を憐れみ、つらい思いをしている者を慰め、犯した過ちを正し、勇気をもって償う。あなたには、その気高さがある。ヴィリアーズ大佐に親身に尽くしたのは、ほかにどんな心からでしょう？　それが男同士の騎士道です。それなのに、苦しむ女に、弱く、裏切られ、慰めもない女に、情けをかけず、手を貸さず、償うどころか、またあの人を不当に扱う。いや、あなたはご自分に背き、寛大さもやさしさも捨てるつもりです。そこに名誉がどこにあります？　それがダイヤモンドのどの面ですか？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-235"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  You forget, sir, you forget.  But go on."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4592
        "line_end": 4592
        "source_sequence": 4592
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4592-4592"
    "translation_ja": "オースティン。お忘れですよ、あなたは。だが続けて。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-236"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  O sir, not I—not I but yourself forgets: George Austin forgets George Austin.  A woman loved by him, betrayed by him, abandoned by him—that woman suffers; and a point of honour keeps him from his place at her feet.  She has played and lost, and the world is with him if he deign to exact the stakes.  Is that the Mr. Austin whom Miss Musgrave honoured with her trust?  Then, sir, how miserably was she deceived!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4594
        "line_end": 4599
        "source_sequence": 4594
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4594-4599"
    "translation_ja": |-
      フェンウィック。ああ、忘れたのは僕ではなく、あなたです。ジョージ・オースティンがジョージ・オースティンを忘れた。愛して、裏切って、捨てた女性が苦しんでいる。その足もとにひざまずくべきあなたを、名誉のおきてが引き止める。あの方は賭けをして負けた。あなたが賭け金をきっちり取り立てたって、世間は味方でしょう。それがマスグレーヴ嬢が信頼を寄せたオースティンさんですか？　ならばあの方は、なんと惨めに欺かれたのでしょう！
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-237"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Child—child—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4601
        "line_end": 4601
        "source_sequence": 4601
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4601-4601"
    "translation_ja": "オースティン。坊や、坊や――"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-238"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Mr. Austin, still bear with me, still follow me.  O sir, will you not picture that dear lady’s life?  Her years how few, her error thus irreparable, what henceforth can be her portion but remorse, the consciousness of self-abasement, the shame of knowing that her trust was ill-bestowed?  To think of it: this was a queen among women; and this—this is George Austin’s work!  Sir, let me touch your heart: let me prevail with you to feel that ’tis impossible.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4603
        "line_end": 4609
        "source_sequence": 4603
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4603-4609"
    "translation_ja": |-
      フェンウィック。オースティンさん、もう少しだけ、お聞きください。あの大切な方のこの先を、思い浮かべてくださいませんか。あんなにお若いのに。犯した間違いは取り返せない。これからあの方に残るものが、悔いと、身を落とした思いと、信じる人を誤った恥のほかにあるでしょうか。お考えください。女の中の女王だった方が、このありさまです。ジョージ・オースティンがなさったことです！　あなたの心に触れさせてください。こんなことはあってはならないと、どうか感じてください。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-239"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  I am a gentleman.  What do you ask of me?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4611
        "line_end": 4611
        "source_sequence": 4611
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4611-4611"
    "translation_ja": "オースティン。わたしは紳士です。わたしに何をせよ、と？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-240"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  To be the man she loved: to be clement where the world would have you triumph, to be of equal generosity with the vanquished, to be worthy of her sacrifice and of yourself.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4613
        "line_end": 4615
        "source_sequence": 4613
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4613-4615"
    "translation_ja": "フェンウィック。あの方が愛した男でいてください。世間が勝ち誇れというところで寛大に。負けた相手と同じだけ寛大に。そしてあの方の犠牲にふさわしく、ご自分にもふさわしい男に。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-241"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Mr. Fenwick, your reproof is harsh—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4617
        "line_end": 4617
        "source_sequence": 4617
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4617-4617"
    "translation_ja": "オースティン。フェンウィックさん、あなたのお叱りはきつい――"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-242"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK (interrupting him).  O sir, be, just be just!—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

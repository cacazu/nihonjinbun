    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Then, sir, you were vastly mistaken.  There is nothing of Beau Austin here.  I have simply, my dear child, sate at the feet of Mr. Fenwick.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

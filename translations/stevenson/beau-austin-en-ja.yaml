        "source_sequence": 4402
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4402-4402"
    "translation_ja": "第三場"
    "translation_status": "reviewed"
  - "id": "ba-186"
    "section_id": "act-ii-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN, MENTEITH, returning"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4405
        "line_end": 4405
        "source_sequence": 4405
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4405-4405"
    "translation_ja": "オースティン。メンティースが戻る。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 18
          "end": 27
          "exact": "returning"
    "source_kind": "stage_direction"
  - "id": "ba-187"
    "section_id": "act-ii-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Was I ever like that, Menteith?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4407
        "line_end": 4407
        "source_sequence": 4407
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4407-4407"
    "translation_ja": "オースティン。わたしもあんなだったか、メンティース？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-188"
    "section_id": "act-ii-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  No, Mr. George, you was always a gentleman."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4409
        "line_end": 4409
        "source_sequence": 4409
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4409-4409"
    "translation_ja": "メンティース。いいえ、ジョージさま。あなたさまはいつも紳士でいらっしゃいました。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-189"
    "section_id": "act-ii-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Youth, my good fellow, youth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4411
        "line_end": 4411
        "source_sequence": 4411
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4411-4411"
    "translation_ja": "オースティン。若ささ、ねえ、若さだよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-190"
    "section_id": "act-ii-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Quite so, Mr. George."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4413
        "line_end": 4413
        "source_sequence": 4413
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4413-4413"
    "translation_ja": "メンティース。まったくでございます、ジョージさま。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-191"
    "section_id": "act-ii-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Well, Menteith, we cannot make no mend.  We cannot play the jockey with Time.  Age is the test: of wine, Menteith, and men.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4415
        "line_end": 4416
        "source_sequence": 4415
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4415-4416"
    "translation_ja": "オースティン。まあ、メンティース、どうしようもないね。時を出し抜くわけにもいかん。歳月を経てこそ、値打ちがわかる。ワインも、人間もな。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-192"
    "section_id": "act-ii-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Me and you and the old Hermitage, Mr. George, he-he!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4418

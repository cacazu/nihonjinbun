  - "id": "ba-453"
    "section_id": "act-iv-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Mr. Fenwick, I have played and lost.  That noble lady, justly incensed at my misconduct, has condemned me.  Under the burden of such a loss, may I console myself with the esteem of Mr. Fenwick?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5402
        "line_end": 5404
        "source_sequence": 5402
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5402-5404"
    "translation_ja": |-
      オースティン。フェンウィック君、勝負に出て、負けました。あの気高い方は、わたしの振る舞いに当然お怒りになり、わたしをお裁きになった。このような痛手を負ったいま、せめてあなたの敬意を失わなかったと思って、慰めとしてもよろしいでしょうか。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-454"
    "section_id": "act-iv-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  She refused you?  Pardon me, sir, but was the fault not yours?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5406
        "line_end": 5406
        "source_sequence": 5406
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5406-5406"
    "translation_ja": "フェンウィック。お断りになったのですか？　失礼ですが、それはあなたのお落ち度ではなかったのですか。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-455"
    "section_id": "act-iv-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Perhaps to my shame, I am no novice, Mr. Fenwick; but I have never felt nor striven as to-day.  I went upon your errand; but, you may trust me, sir, before I had done I found it was my own.  Until to-day I never rightly valued her; sure, she is fit to be a queen.  I have a remorse here at my heart to which I am a stranger.  Oh! that was a brave life, that was a great heart that I have ruined.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5408
        "line_end": 5413
        "source_sequence": 5408
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5408-5413"
    "translation_ja": |-
      オースティン。恥かもしれませんが、こういうことは初めてではありませんよ、フェンウィック君。それでも、今日ほど真剣に思い、今日ほど懸命に気持ちを伝えようとしたことはありません。はじめはあなたに頼まれて出かけた。けれども信じてください、話し終えるまえに、自分自身のためにここに来たのだと悟りました。今日までわたしは、あの方の真価が分からなかった。あの方は王妃にだってふさわしい。これまで覚えたことのない悔恨が、胸にあります。ああ、わたしが台なしにしたのは、あんなにも気丈な人の人生、あんなにも立派な心だったのです。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-456"
    "section_id": "act-iv-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  Ay, sir, indeed."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5415
        "line_end": 5415
        "source_sequence": 5415
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5415-5415"
    "translation_ja": "フェンウィック。ええ、本当にそうです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-457"
    "section_id": "act-iv-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  But, sir, it is not to lament the irretrievable that I intrude myself upon your leisure.  There is something to be done, to save, at least to spare, that lady.  You did not fail to observe the brother?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5417
        "line_end": 5419
        "source_sequence": 5417
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5417-5419"
    "translation_ja": |-
      オースティン。しかし、埋め合わせのできないことを嘆こうと、あなたのお時間を割いていただいたのではありません。あの方を救うため、せめてこれ以上お心を痛めないようにするため、すべきことがあります。弟さんの様子はご覧になったでしょう。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-458"
    "section_id": "act-iv-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  No, sir, he knows all; and being both intemperate and ignorant—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5421
        "line_end": 5421
        "source_sequence": 5421
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5421-5421"
    "translation_ja": "フェンウィック。ええ、もちろん。あいつは何もかも知っています。自制がきかなくて、世間知らずときているから――。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-459"
    "section_id": "act-iv-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Surely.  I know.  I have to ask you then to find what friends you can among this company; and if you have none, to make them.  Let everybody hear the news.  Tell it (if I may offer the suggestion) with humour: how Mr. Austin, somewhat upon the wane, but still filled with sufficiency, gloriously presumed and was most ingloriously set down by a young lady from the north: the lady’s name a secret, which you will permit to be divined.  The laugh—the position of the hero—will make it circulate;—you perceive I am in earnest;—and in this way I believe our young friend will find himself forestalled.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5423
        "line_end": 5431
        "source_sequence": 5423
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5423-5431"
    "translation_ja": |-
      オースティン。ええ、分かっています。そこでお願いです。ここに集まった方々の中に、力を貸してくれる友人をできるだけ見つけてください。いなければ、作ってください。そしてみなにこの一件を知らせてください。さしでがましいようですが、面白おかしく話すのです。少々落ち目でもまだ自信満々のオースティン氏が、華々しくいい気になったあげく、北から来た若い女性にみっともなく鼻っ柱を折られた、と。ご婦人の名は秘密だが、ご想像にお任せするとおっしゃい。笑い話で、しかも主役はこのわたし。それで噂は広まります。冗談でお願いしているのではありませんよ。こうすれば、あの若い友人が騒ぎを起こす前に先手を打てるでしょう。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-460"
    "section_id": "act-iv-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Mr. Austin, I would not have dared to ask so much of you; I will go further: were the positions changed, I should fear to follow your example.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"

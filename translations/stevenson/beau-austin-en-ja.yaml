        "line_start": 3967
        "line_end": 3967
        "source_sequence": 3967
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3967-3967"
    "translation_ja": "ドロシー。さあ、叔母さま、ほんとにわかりません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-065"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  Then consider, please, and recover it as soon as you can: to a young lady in your position a good appetite is an attraction—almost a virtue.  Do you know that your brother arrives this morning?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3969
        "line_end": 3971
        "source_sequence": 3969
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3969-3971"
    "translation_ja": "フォスター嬢。ならよく考えて、早く取り戻してちょうだい。あなたの身分の若い娘にとって、食欲があるのは魅力よ。美徳にも近いわ。弟が今朝着くのを知っていますか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-066"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Dear Anthony!  Where is his letter, Aunt Evelina?  I am pleased that he should leave London and its perils, if only for a day.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3973
        "line_end": 3974
        "source_sequence": 3973
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3973-3974"
    "translation_ja": "ドロシー。アンソニーが！　お手紙はどこです、イヴリーナ叔母さま？　一日だけでも、危ないロンドンを離れてくれて嬉しいわ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-067"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  My dear, there are moments when you positively amaze. (Barbara, some pâté, if you please!)  I beg you not to be a prude.  All women, of course, are virtuous; but a prude is something I regard with abhorrence.  The Cornet is seeing life, which is exactly what he wanted. You brought him up surprisingly well; I have always admired you for it; but let us admit—as women of the world, my dear—it was no upbringing for a man.  You and that fine solemn fellow, John Fenwick, led a life that was positively no better than the Middle Ages; and between the two of you, poor Anthony (who, I am sure, was a most passive creature!) was so packed with principle and admonition that I vow and declare he reminded me of Issachar stooping between his two burdens.  It was high time for him to be done with your apron-string, my dear: he has all his wild oats to sow; and that is an occupation which it is unwise to defer too long. By the bye, have you heard the news?  The Duke of York has done us a service for which I was unprepared.  (More tea, Barbara!)  George Austin, bringing the prince in his train, is with us once more.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3976
        "line_end": 3991
        "source_sequence": 3976
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3976-3991"
    "translation_ja": |-
      フォスター嬢。あなたったら、ときどき本当に驚かせるわ。（バーバラ、パテをお願い！）どうか堅物にならないで。女はもちろん誰だって身持ちがいいもの。でも潔癖ぶる人は大嫌いです。少尉さんは世間を見ているのですよ。望んでいたとおりにね。あなたは驚くほどうまく育てた。それにはいつも感心していました。でも、世間を知る同士、認めましょうよ。あれでは男の育て方としてはどうかしら。あなたと、あの立派でしかめつらしいジョン・フェンウィックときたら、まるで中世の暮らし。それに挟まれたアンソニーときたら（どんなに従順な子だったでしょう！）、道理と訓戒を詰め込まれて、ほんとうに、荷二つの間に身をかがめたイッサカルそっくりでした。とっくにお姉さまのエプロンの紐から離れるころでしたよ。若い男の道楽を、まだ何ひとつしていないのだから。そういうことは、あまり遅らせないほうがいいの。ところで、知らせを聞いた？　ヨーク公が思いがけぬ役に立ってくださったのよ。（バーバラ、紅茶のおかわり！）ジョージ・オースティンが、殿下をお供のように従えて、また来ているの。
    "translation_status": "reviewed"
    "annotations":

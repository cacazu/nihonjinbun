  - "id": "ba-309"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  Hullo! what’s wrong?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4861
        "line_end": 4861
        "source_sequence": 4861
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4861-4861"
    "translation_ja": "アンソニー。おや、どうした？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-310"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  Nothing that I know of.  O Mr. Anthony, I don’t think there can be anything."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4863
        "line_end": 4864
        "source_sequence": 4863
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4863-4864"
    "translation_ja": "バーバラ。わたしの知るかぎり、何も。ああ、アンソニーさま、何もあるはずはないと思うんです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-311"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  Think?  Don’t think?  What’s this?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4866
        "line_end": 4866
        "source_sequence": 4866
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4866-4866"
    "translation_ja": "アンソニー。思う？　思っているだけ？　何のことだ？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-312"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  O sir!  I don’t know, and yet I don’t like it.  Here’s my beautiful necklace all broke to bits: she took it off my very neck, and gave me her birthday pearls instead; and I found it afterwards on the table, all smashed to pieces; and all she wanted it for was to take and break it.  Why that?  It frightens me, Mr. Anthony, it frightens me.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4868
        "line_end": 4872
        "source_sequence": 4868
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4868-4872"
    "translation_ja": |-
      バーバラ。ああ、わからない、でも嫌な気がするんです。見て、わたしのきれいな首飾りが、粉々です。ドロシーさまは、わたしの首から外して、かわりにご自分の誕生日の真珠をくださった。でもあとで見ると、卓の上で粉々になっていて。あんなに欲しがったのは、壊すためだけだったんです。なぜでしょう？　怖いですわ、アンソニーさま、わたし、本当に怖い。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-313"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY (with necklace).  This?  What has this trumpery to do with us?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4874
        "line_end": 4874
        "source_sequence": 4874
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4874-4874"
    "translation_ja": "アンソニー（首飾りを手に）。これが？　こんな安物が、僕らとどう関わる？"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 9
          "end": 22
          "exact": "with necklace"
    "source_kind": "dialogue"
  - "id": "ba-314"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  He gave it me: that’s why she broke it."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4876
        "line_end": 4876
        "source_sequence": 4876
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4876-4876"
    "translation_ja": "バーバラ。あの方がわたしにくださったからです。それでドロシーさまは壊したんです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-315"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  He? who?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4878
        "line_end": 4878
        "source_sequence": 4878
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4878-4878"
    "translation_ja": "アンソニー。あの方？　誰だ？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-316"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  Mr. Austin did; and I do believe I should not have taken it, Mr. Anthony, but I thought no harm, upon my word of honour.  He was always here: that was six months ago; and indeed, indeed, I thought they were to marry.  How would I think else with a born lady like Miss Dorothy?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4880
        "line_end": 4884
        "source_sequence": 4880
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4880-4884"
    "translation_ja": |-
      バーバラ。オースティンさんです。受け取ってはいけなかったんだと思います、アンソニーさま。でも悪いこととは思いませんでした。名誉にかけて。本当にいつもおいでになって。それは半年前のことです。それで、ほんとに、ほんとに、お二人は結婚なさると思っていたんです。ドロシーさまのような生まれながらの淑女なら、ほかにどう思いましょう？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-317"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  Why, Barbara, God help us all, what’s this?  You don’t mean to say that there was—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4886
        "line_end": 4887
        "source_sequence": 4886
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4886-4887"
    "translation_ja": "アンソニー。おい、バーバラ、神よお助けを、どういうことだ？　まさか、お二人に何か――"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-318"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  Here it is, as true as true: they were going for a jaunt; and Miss Foster had her gout; and I was to go with them; and he told me to make-believe I was ill; and I did; and I stayed at home; and he gave me that necklace; and they went away together; and, oh dear!  I wish I’d never been born.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4889
        "line_end": 4893
        "source_sequence": 4889
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4889-4893"
    "translation_ja": |-
      バーバラ。ありのままを申します。お二人で遠出なさる話になって、フォスターさまは痛風で、わたしがお供することになっていたんです。そしたらあの方に、具合が悪いふりをしてくれと頼まれて、そのとおりにして、宿に残って。あの方が首飾りをくださって、お二人は一緒に出かけて。ああもう、わたし、生まれてこなければよかった。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-319"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  Together? he and Dolly?  Good Lord! my sister!  And since then?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4895
        "line_end": 4895
        "source_sequence": 4895
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4895-4895"
    "translation_ja": "アンソニー。一緒に？　あいつとドリーが？　なんてことだ、僕の姉さんが！　それから？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-320"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  We haven’t seen him from that day to this, the wicked villain; and, Mr. Anthony, he hasn’t so much as written the poor dear a word.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4897
        "line_end": 4898
        "source_sequence": 4897
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4897-4898"
    "translation_ja": "バーバラ。あの日から今日まで、あのろくでなしの悪党には会っていません。それにアンソニーさま、あのかわいそうな方に、ひとことの手紙さえくださらないんです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-321"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  Bab, Bab, Bab, this is a devil of a bad business; this is a cruel bad business, Baby; cruel upon me, cruel upon all of us; a family like mine.  I’m a young man, Barbara, to have this delicate affair to manage; but, thank God, I’m Musgrave to the bone.  He bribed a servant-maid, did he?  I keep his bribe; it’s mine now; dear bought, by George!  He shall have it in his teeth.  Shot Colonel Villiers, did he? we’ll see how he faces Anthony Musgrave.  You’re a good girl, Barbara; so far you’ve served the family.  You leave this to me.  And, hark ye, dry your eyes and hold your tongue: I’ll have no scandal raised by you.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4900
        "line_end": 4908
        "source_sequence": 4900
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4900-4908"
    "translation_ja": |-
      アンソニー。バブ、バブ、バブ、これはとんでもなくまずいことだ。ひどい話だよ、ベイビー。僕にはひどい、僕らみんなにひどい。うちのような家なのに。バーバラ、僕はこんな微妙なことを始末するには若いね。けれどありがたいことに、骨の髄までマスグレーヴだ。侍女を買収したのか。わいろは僕が預かる。今は僕のものだ。高くついたな、まったく！　あいつの鼻先に突きつけてやる。ヴィリアーズ大佐を撃ったんだって？　アンソニー・マスグレーヴとどう向き合うか、見せてもらおう。バーバラ、おまえはいい娘だ。今のところは一家のために尽くしてくれたね。この件は僕に任せろ。それと聞いとけ、涙を拭いて黙ってろ。おまえに醜聞を立てさせてたまるか。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-322"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  I do hope, sir, you won’t use me against Miss Dorothy."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4910
        "line_end": 4910
        "source_sequence": 4910
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4910-4910"
    "translation_ja": "バーバラ。どうか、わたしの話をドロシーさまに不利なように使わないでください。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-323"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  That’s my affair; your business is to hold your tongue.  Miss Dorothy has made her bed and must lie on it.  Here’s Jack Fenwick.  You can go.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4912
        "line_end": 4914
        "source_sequence": 4912
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4912-4914"
    "translation_ja": "アンソニー。それは僕の問題だ。おまえの務めは口をつぐんでいること。ドロシー嬢は自分で蒔いた種だから、自分で刈り取るしかない。ジャック・フェンウィックが来た。もう行っていい。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-324"
    "section_id": "act-iii-scene-v"
    "kind": "heading"
    "origin": "source"
    "source_text": "SCENE V"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4917
        "line_end": 4917
        "source_sequence": 4917
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4917-4917"
    "translation_ja": "第五場"
    "translation_status": "reviewed"
  - "id": "ba-325"
    "section_id": "act-iii-scene-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY, FENWICK"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4920
        "line_end": 4920
        "source_sequence": 4920
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4920-4920"
    "translation_ja": "アンソニー、フェンウィック。"
    "translation_status": "reviewed"
    "source_kind": "stage_direction"
  - "id": "ba-326"
    "section_id": "act-iii-scene-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  Jack Fenwick, is that you?  Come here, my boy.  Jack, you’ve given me many a thrashing, and I deserved ’em; and I’ll not see you made a fool of now.  George Austin is a damned villain, and Dorothy Musgrave is no girl for you to marry: God help me that I should have to say it.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4922
        "line_end": 4925
        "source_sequence": 4922
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4922-4925"
    "translation_ja": |-
      アンソニー。ジャック・フェンウィック、君か？　こっちへおいで、君。ジャック、僕は何度も君にひっぱたかれたけど、もっともだったよ。だから今度は、君が笑いものにされるのを見ていられない。ジョージ・オースティンはひどい悪党だし、ドロシー・マスグレーヴは君が妻にするような娘じゃない。こんなことを言わなくちゃならないなんて、神さまお助けを。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-327"
    "section_id": "act-iii-scene-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  Good God, who told you?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4927
        "line_end": 4927
        "source_sequence": 4927
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4927-4927"
    "translation_ja": "フェンウィック。なんてことだ。誰が君に？"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 29
          "end": 32
          "exact": "you"
    "source_kind": "dialogue"
  - "id": "ba-328"
    "section_id": "act-iii-scene-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  Ay, Jack; it’s hard on me, Jack.  But you’ll stand my friend in spite of this, and you’ll take my message to the man, won’t you?  For it’s got to come to blood, Jack: there’s no way out of that.  And perhaps your poor friend will fall, Jack; think of that: like Villiers.  And all for an unworthy sister.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4929
        "line_end": 4933
        "source_sequence": 4929
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4929-4933"
    "translation_ja": |-
      アンソニー。ああ、ジャック、僕にはつらいことだよ。でも、これでも君は味方になってくれるね。あの男に僕の言葉を伝えてくれるね？　どうしたって血を見なくちゃすまない、ジャック、逃げ道はないよ。もしかしたら、このかわいそうな友達が倒れるかもしれないぞ。考えてもみろよ、ヴィリアーズみたいに。それも、値打ちのない姉のために。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-329"
    "section_id": "act-iii-scene-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Now, Anthony Musgrave, I give you fair warning; see you take it: one word more against your sister, and we quarrel.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4935
        "line_end": 4936
        "source_sequence": 4935
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4935-4936"
    "translation_ja": "フェンウィック。アンソニー・マスグレーヴ、いまのうちにはっきり言っておく。よく聞け。姉さんの悪口をもうひとこと言えば、僕が君の相手だ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-330"
    "section_id": "act-iii-scene-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  You let it slip yourself, Jack: you know yourself she’s not a virtuous girl."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4938
        "line_end": 4939
        "source_sequence": 4938
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4938-4939"
    "translation_ja": "アンソニー。君だって自分で口を滑らせたじゃないか。あれが身持ちのいい娘ではない、と知っているんだろう。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-331"
    "section_id": "act-iii-scene-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  What do you know of virtue, whose whole boast is to be vicious? How dare you draw conclusions?  Dolt and puppy! you can no more comprehend that angel’s excellencies than she can stoop to believe in your vices.  And you talk morality?  Anthony, I’m a man who has been somewhat roughly tried: take care.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4941
        "line_end": 4945
        "source_sequence": 4941
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4941-4945"
    "translation_ja": |-
      フェンウィック。不品行を得意がることしか知らない君に、品行の何がわかる？　どういう料簡で、勝手な決めつけをするんだ？　この愚か者、この若造！　君があの天使の美点を呑み込めないのは、あの人が君の不品行を信じるほど卑しくなれないのと同じだ。道徳だと？　アンソニー、僕はいささか手荒な試練に遭った男だ。気をつけたまえ。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-332"
    "section_id": "act-iii-scene-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  You don’t seem able to grasp the situation, Jack.  It’s very remarkable; I’m the girl’s natural protector; and you should buckle-to and help, like a friend of the family.  And instead of that, begad! you turn on me like all the rest.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4947
        "line_end": 4950
        "source_sequence": 4947
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4947-4950"
    "translation_ja": |-
      アンソニー。事情が呑み込めないらしいね、ジャック。なんともおかしなことだ。僕は生まれついてのあの娘の守り手だ。それで君は、家の友人として、一緒になって手を貸すべきなんだ。それなのに、まったく、ほかのみんなと同じように僕に食ってかかる。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-333"
    "section_id": "act-iii-scene-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Now mark me fairly: Mr. Austin follows at my heels; he comes to offer marriage to your sister—that is all you know, and all you shall know; and if by any misplaced insolence of yours this marriage should miscarry, you have to answer, not to Mr. Austin only, but to me.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4952
        "line_end": 4955
        "source_sequence": 4952
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4952-4955"
    "translation_ja": |-
      フェンウィック。今から言うことを、よく覚えておけ。オースティンさんがすぐあとからいらっしゃる。君のお姉さまに結婚を申し込むために。それが君の知っていることのすべてで、それ以上は知る必要もない。もし君の見当違いの無礼で、この結婚がだめになりでもしたら、オースティンさんばかりでなく、僕に対しても申し開きが要るぞ。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-334"
    "section_id": "act-iii-scene-v"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  It’s all a most discreditable business, and I don’t see how you propose to better it by cutting my throat.  Of course if he’s going to marry her, it’s a different thing; but I don’t believe he is, or he’d have asked me.  You think me a fool?  Well see they marry, or they’ll find me a dangerous fool.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4957
        "line_end": 4961
        "source_sequence": 4957
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4957-4961"
    "translation_ja": |-
      アンソニー。どれもまったく不面目な話だし、僕の喉を切ったからって、どうよくなるかわからないね。もちろん、結婚するなら別の話だ。でも、そうは思わない。そうなら、僕に話をしてくるはずだから。僕を愚か者だと思うか？　じゃあ、きちんと結婚させるんだな。さもないと危ない愚か者だとわかるぞ。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-335"
    "section_id": "act-iii-scene-vi"
    "kind": "heading"
    "origin": "source"
    "source_text": "SCENE VI"
    "source_languages":

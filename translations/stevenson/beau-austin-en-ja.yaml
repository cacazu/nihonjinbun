    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4017-4019"
    "translation_ja": |-
      フォスター嬢。わたしもよ。少しばかり、その……フォスター家の血が騒いで。ねえ、うちの家系に伝わる痛風よ！　それで、この恩知らずのお姫さまが、あの方を一日独り占めして、帰ってからわたしには何ひとつ話してくれないの。
    "translation_status": "reviewed"
    "source_kind": "dialogue"

    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  Mr. Austin, I am here to throw myself upon your mercy.  Strange as my errand is, it will seem yet more strange to you that I came prepared to accept at your hands any extremity of dishonour and not fight.  The lady whom it is my boast to serve has honoured me with her commands.  These are my law, and by these your life is sacred.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4501
        "line_end": 4505
        "source_sequence": 4501
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4501-4505"
    "translation_ja": |-
      フェンウィック。オースティンさん、あなたのお情けにすがりに来たのです。用向きもおかしいでしょうが、どんな不名誉をあなたから受けようと決闘はしない、その覚悟で来たと言えば、なおおかしく思われるでしょう。僕が誇りをもってお仕えする女性が、お命じになったことです。それが僕のおきてであり、それに従うかぎり、あなたの命には手を出せません。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-219"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Then, sir (with his hand upon the bell), his conversation becomes impossible.  You have me at too gross a disadvantage; and, as you are a gentleman and respect another, I would suggest that you retire.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4507
        "line_end": 4509
        "source_sequence": 4507
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4507-4509"
    "translation_ja": "オースティン。それでは（呼び鈴に手を置き）、話し合うことはできません。あなたはわたしをあまりにも一方的な立場に置く。あなたも紳士で、相手が紳士だと認めてくださるなら、お引き取りいただきたい。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":

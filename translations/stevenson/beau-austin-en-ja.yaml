    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  Please, Mr. Anthony, Miss Foster said I was to show your room."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4835
        "line_end": 4835
        "source_sequence": 4835
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4835-4835"
    "translation_ja": "バーバラ。アンソニーさま、フォスターさまが、お部屋へご案内するようにと。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-303"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "ANTHONY.  Ha!  Baby?  Now, you come here.  You’re a girl of sense, I know."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4837
        "line_end": 4838
        "source_sequence": 4837
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4837-4838"
    "translation_ja": "アンソニー。やあ、ベイビーか？　さあ、こっちへおいで。気の利く娘だと知っているよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-304"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  La, Mr. Anthony, I hope I’m nothing of the kind."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4840
        "line_end": 4840
        "source_sequence": 4840
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4840-4840"
    "translation_ja": "バーバラ。まあ、アンソニーさま、そんな娘ではないと思いたいですわ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-305"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  Come, come! that’s not the tone I want: I’m serious.  Does this man Austin come much about the house?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4842
        "line_end": 4843
        "source_sequence": 4842
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4842-4843"
    "translation_ja": "アンソニー。おいおい、そういう調子じゃ困る。僕は真面目だ。オースティンという男は、よくこの家に来るのか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-306"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  O Mr. Anthony, for shame!  Why don’t you ask Miss Foster?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4845
        "line_end": 4845
        "source_sequence": 4845
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4845-4845"
    "translation_ja": "バーバラ。まあ、アンソニーさま、そんなことをお尋ねになるなんて！　どうしてフォスターさまにお尋ねにならないの？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-307"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      ANTHONY.  Now I wish you to understand: I’m the head of this family. It’s my business to look after my sister’s reputation, and my aunt’s too, begad!  That’s what I’m here for: I’m their natural protector.  And what I want you, Barbara Ridley, to understand—you whose fathers have served my fathers—is just simply this: if you’ve any common gratitude, you’re bound to help me in the work.  Now Barbara, you know me, and you know my Aunt Evelina.  She’s a good enough woman; I’m the first to say so.  But who is she to take care of a young girl?  She’s ignorant of the world to that degree she believes in Beau Austin!  Now you and I, Bab, who are not so high and dry, see through and through him; we know that a man like that is no fit company for any inexperienced girl.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4847
        "line_end": 4857
        "source_sequence": 4847
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4847-4857"
    "translation_ja": |-
      アンソニー。まずわかってもらいたい。僕がこの一家の家長だ。姉さんの評判を守るのは僕の務めで、叔母上の評判もだ、まったく！　そのためにここにいる。生まれついての守り手なんだ。それで、バーバラ・リドリー、先祖代々うちに仕えてきたおまえにわかってもらいたいのは、ただこういうこと。人並みの恩義を感じているなら、僕を手伝うのが当然だ。さあ、バーバラ、僕のことも、イヴリーナ叔母上のことも、わかっているだろう。あの人は悪い人じゃない。それは僕がまっさきに認めるよ。でも、若い娘の世話ができる人か？　世間知らずもいいところで、伊達男オースティンを信じてるんだぞ！　でもバブ、僕もおまえも、あんなふうに世間離れはしていないから、あいつをすっかり見抜いている。あんな男は、世間を知らない娘の相手にふさわしくないとわかってる。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-308"
    "section_id": "act-iii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  O Mr. Anthony, don’t say that.  (Weeping.)"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4859
        "line_end": 4859
        "source_sequence": 4859
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4859-4859"
    "translation_ja": "バーバラ。ああ、アンソニーさま、そんなことをおっしゃらないで。（泣く。）"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":

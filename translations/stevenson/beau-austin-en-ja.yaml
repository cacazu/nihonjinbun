      The Stage represents the Pantiles: the alleys fronting the spectators in parallel lines.  At the back, a stand of musicians, from which the ‘Gavotte’ is repeated on muted strings.  The music continues nearly through Scene I.  Visitors walking to and fro beneath the lines.  A seat in front, L.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 5269
        "line_end": 5273
        "source_sequence": 5269
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-5269-5273"
    "translation_ja": |-
      舞台はパンタイルズ。観客に面して、何本かの遊歩道が平行に延びる。奥に楽団席があり、弱音器をつけた弦でガヴォットを繰り返す。音楽は第一場のほとんどを通して続く。訪れた人々が並木の下を行き来する。手前左に腰掛け。
    "translation_status": "reviewed"

    "source_kind": "dialogue"
  - "id": "ba-411"
    "section_id": "act-iii-scene-viii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "DOROTHY.  Anthony, Anthony! . . . O my God, George will kill him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

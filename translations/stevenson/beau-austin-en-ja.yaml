    "translation_ja": "フォスター嬢（入ってきて）。バーバラ！　あきれたものね。あれだけ作法を教えたのに、窓から身を乗り出して、通りへ呼びかけるなんて（耳がどうかしていないかぎり、確かに呼んでいたわね！）。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 13
          "end": 21
          "exact": "entering"
    "source_kind": "dialogue"
  - "id": "ba-025"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  Well, madam, just wait until you hear who it was.  I declare it was much more for Miss Dorothy and yourself than for me; and if it was a little countrified, I had a good excuse.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3816
        "line_end": 3818
        "source_sequence": 3816
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3816-3818"
    "translation_ja": "バーバラ。まあ、奥さま、誰だったかを聞いてからにしてください。わたしのためというよりは、ドロシーさまと奥さまのためでしたもの。少々田舎くさかったとしても、ちゃんと訳があるんです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-026"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  Nonsense, child!  At least, who was it?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3820
        "line_end": 3820
        "source_sequence": 3820
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3820-3820"
    "translation_ja": "フォスター嬢。くだらないことを！　で、相手はどなた？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-027"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  Miss Evelina, I was sure you would ask.  Well, what do you think?  I was looking out of window at the barber’s opposite—
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3822
        "line_end": 3823
        "source_sequence": 3822
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3822-3823"
    "translation_ja": "バーバラ。イヴリーナさま、きっとお尋ねになると思いました。まあ、聞いてくださいね。わたし、向かいの床屋を窓から見ていましたら――"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-028"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  Of which I entirely disapprove—"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3825
        "line_end": 3825
        "source_sequence": 3825
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3825-3825"
    "translation_ja": "フォスター嬢。それ自体、まことに感心いたしませんがね――"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-029"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  And first there came out two of the most beautiful—the Royal livery, madam!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3827
        "line_end": 3828
        "source_sequence": 3827
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3827-3828"
    "translation_ja": "バーバラ。最初に、そりゃもう素敵な二人が出てきたんです。王家のお仕着せでございますよ！"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-030"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  Of course, of course: the Duke of York arrived last night. I trust you did not hail the Duke’s footmen?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3830
        "line_end": 3831
        "source_sequence": 3830
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3830-3831"
    "translation_ja": "フォスター嬢。ええ、それはね。昨夜、ヨーク公がいらしたのですから。まさか公爵の従僕たちに声をかけたのではないでしょうね？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-031"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  O no, madam, it was after they were gone.  Then, who should come out—but you’ll never guess!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3833
        "line_end": 3834
        "source_sequence": 3833
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3833-3834"
    "translation_ja": "バーバラ。いいえ、奥さま、二人が行ってしまったあとですよ。それから誰が出てきたとお思いです？　当たりっこありません！"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-032"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  I shall certainly not try."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3836
        "line_end": 3836
        "source_sequence": 3836
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3836-3836"
    "translation_ja": "フォスター嬢。とても当ててみようとは思いませんよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-033"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  Mr. Menteith himself!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3838
        "line_end": 3838
        "source_sequence": 3838
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3838-3838"
    "translation_ja": "バーバラ。メンティースさんご本人です！"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-034"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  Why, child, I never heard of him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3840
        "line_end": 3840
        "source_sequence": 3840
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3840-3840"
    "translation_ja": "フォスター嬢。何を言うの、その名は聞いたこともないわ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-035"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  O madam, not the Beau’s own gentleman?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3842
        "line_end": 3842
        "source_sequence": 3842
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3842-3842"
    "translation_ja": "バーバラ。まあ、奥さま、あの伊達男のお付きの紳士をご存じないんですか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-036"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  Mr. Austin’s servant.  No?  Is it possible?  By that, George Austin must be here."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3844
        "line_end": 3845
        "source_sequence": 3844
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3844-3845"
    "translation_ja": "フォスター嬢。オースティンさんの召使い。あら？　ほんとうに？　それなら、ジョージ・オースティンがここに来ているのね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-037"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  No doubt of that, madam; they’re never far apart.  He came out feeling his chin, madam, so; and a packet of letters under his arm, so; and he had the Beau’s own walk to that degree you couldn’t tell his back from his master’s.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3847
        "line_end": 3850
        "source_sequence": 3847
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3847-3850"
    "translation_ja": |-
      バーバラ。まちがいありません、奥さま。あのお二人が遠く離れることなんてありませんから。こうやって顎をなでながら、脇に手紙の束をこう挟んで出てきましてね。あの伊達男そっくりの歩き方で、うしろからではどちらがご主人かわかりませんでしたよ。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-038"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  My dear Barbara, you too frequently forget yourself.  A young woman in your position must beware of levity.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3852
        "line_end": 3853
        "source_sequence": 3852
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3852-3853"
    "translation_ja": "フォスター嬢。ねえ、バーバラ、あなたはよくご自分の立場をお忘れになるのね。あなたのような若い娘は、軽はずみな振る舞いに気をつけなければ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-039"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  Madam, I know it; but la, what are you to make of me?  Look at the time and trouble dear Miss Dorothy was always taking—she that trained up everybody—and see what’s come of it: Barbara Ridley I was, and Barbara Ridley I am; and I don’t do with fashionable ways—I can’t do with them; and indeed, Miss Evelina, I do sometimes wish we were all back again on Edenside, and Mr. Anthony a boy again, and dear Miss Dorothy her old self, galloping the bay mare along the moor, and taking care of all of us as if she was our mother, bless her heart!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3855
        "line_end": 3862
        "source_sequence": 3855
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3855-3862"
    "translation_ja": |-
      バーバラ。奥さま、わかっております。でも、まあ、わたしをどう仕立て直せましょう。あの優しいドロシーさまが、どれほどお時間と手間をかけてくださったか。あの方はみんなを教え育てた方です。それでどうなったとお思いです？　昔もバーバラ・リドリー、今もバーバラ・リドリー。流行の作法は性に合いません。どうしても合わないんです。ほんとにね、イヴリーナさま、時々みんなでイーデンサイドへ帰れたらと思うんですよ。アンソニーさまがまた少年になって、ドロシーさまが昔のあの方に戻って、鹿毛の牝馬で荒野を駆け、母親みたいにわたしたちみんなの面倒を見てくださったら。ほんとにありがたい方でした！
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-040"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  Miss Dorothy herself, child?  Well, now you mention it, Tunbridge of late has scarcely seemed to suit her constitution.  She falls away, has not a word to throw at a dog, and is ridiculously pale. Well, now Mr. Austin has returned, after six months of infidelity to the dear Wells, we shall all, I hope, be brightened up.  Has the mail come?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3864
        "line_end": 3868
        "source_sequence": 3864
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3864-3868"
    "translation_ja": |-
      フォスター嬢。ドロシー自身が昔に戻るって？　そうね、言われてみれば、このところタンブリッジはどうもあの子の体に合わないようね。やせて、犬に声もかけないほど口数が減って、ばかみたいに青白い。でも、オースティンさんがこの馴染みの湯治場を半年も放ったらかしにして、やっと戻ったのですもの。これでみんな元気になるといいわね。郵便は来ましたか？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-041"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      BARBARA.  That it has, madam, and the sight of Mr. Menteith put it clean out of my head.  (With letters.)  Four for you, Miss Evelina, two for me, and only one for Miss Dorothy.  Miss Dorothy seems quite neglected, does she not?  Six months ago, it was a different story.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3870
        "line_end": 3873
        "source_sequence": 3870
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3870-3873"
    "translation_ja": |-
      バーバラ。来ております、奥さま。メンティースさんを見た拍子にころっと忘れておりました。（手紙を手に。）イヴリーナさまに四通、わたしに二通、ドロシーさまにはたったの一通。ドロシーさまだけ、すっかり皆さんに忘れられたみたいですね。半年前とは大違い。
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 91
          "end": 103
          "exact": "With letters"
    "source_kind": "dialogue"
  - "id": "ba-042"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  Well, and that’s true, Barbara, and I had not remarked it. I must take her seriously to task.  No young lady in her position should neglect her correspondence.  (Opening a letter.)  Here’s from that dear ridiculous boy, the Cornet, announcing his arrival for to-day.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3875
        "line_end": 3878
        "source_sequence": 3875
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3875-3878"
    "translation_ja": |-
      フォスター嬢。ほんとうね、バーバラ、気づかなかったわ。ちゃんと言い聞かせないと。あの身分の娘が手紙のやりとりを怠けてはいけません。（封を開けて。）これはあのおかしな、かわいい少尉さんから。今日着くそうよ。
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 176
          "end": 192
          "exact": "Opening a letter"
    "source_kind": "dialogue"
  - "id": "ba-043"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  O madam, will he come in his red coat?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3880
        "line_end": 3880
        "source_sequence": 3880
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3880-3880"
    "translation_ja": "バーバラ。まあ、奥さま、赤い軍服でおいでになりましょうか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-044"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  I could not conceive him missing such a chance.  Youth, child, is always vain, and Mr. Anthony is unusually young.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3882
        "line_end": 3883
        "source_sequence": 3882
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3882-3883"
    "translation_ja": "フォスター嬢。こんな機会を逃すとは思えませんよ。若いというのはね、見栄を張るものです。アンソニーさんは、ひときわお若いですし。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-045"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "BARBARA.  La, madam, he can’t help that."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3885
        "line_end": 3885
        "source_sequence": 3885
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3885-3885"
    "translation_ja": "バーバラ。まあ、奥さま、それはご本人にはどうしようもございませんわ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-046"
    "section_id": "act-i-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MISS FOSTER.  My child, I am not so sure.  Mr. Anthony is a great concern to me.  He was orphaned, to be sure, at ten years old; and ever since he has been only as it were his sister’s son.  Dorothy did everything for him: more indeed than I thought quite ladylike, but I suppose I begin to be old-fashioned.  See how she worked and slaved—yes, slaved!—for him: teaching him herself, with what pains and patience she only could reveal, and learning that she might be able; and see what he is now: a gentleman, of course, but, to be frank, a very commonplace one: not what I had hoped of Dorothy’s brother; not what I had dreamed of the heir of two families—Musgrave and Foster, child!  Well, he may now meet Mr. Austin. He requires a Mr. Austin to embellish and correct his manners.  (Opening another letter.)  Why, Barbara, Mr. John Scrope and Miss Kate Dacre are to be married!
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 3887
        "line_end": 3899
        "source_sequence": 3887
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-3887-3899"
    "translation_ja": |-
      フォスター嬢。そうかどうかしら、バーバラ。アンソニーさんのことは、わたしには大きな気がかりです。たしかに十で父母を亡くして、それからは言ってみれば、お姉さまの息子でした。ドロシーは何から何までしてやりました。淑女がするには、わたしには少々行きすぎに思われたくらい。でも、わたしが古くさいのでしょうね。あの子のために、どれだけ働いて、こき使われたか――そうですよ、こき使われたの！　みずから教え、あの人にしか出せないような根気と辛抱を見せて、教えられるよう自分でも勉強して。それで今のアンソニーはどうです。紳士には違いありません。でも、正直言ってごく平凡な紳士です。ドロシーの弟に期待したような人ではなく、マスグレーヴ家とフォスター家、いいですか、二つの家を継ぐ人に夢見たような人物ではありません。まあ、これでオースティンさんに会えるでしょう。振る舞いを飾り、正してくれるオースティンさんのような方こそ必要です。（別の手紙を開けて。）まあ、バーバラ、ジョン・スクループさんとケイト・デイカー嬢が結婚するんですって！
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"

  - "id": "ba-205"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  At the name of Miss Musgrave, my doors fly always open."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4462
        "line_end": 4462
        "source_sequence": 4462
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4462-4462"
    "translation_ja": "オースティン。マスグレーヴ嬢のお名前を聞けば、わたしの家の戸はいつでも開きます。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-206"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  I believe, sir, you are acquainted with my cousin, Richard Gaunt?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4464
        "line_end": 4465
        "source_sequence": 4464
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4464-4465"
    "translation_ja": "フェンウィック。従兄弟のリチャード・ゴーントをご存じかと思いますが？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-207"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  The county member?  An old and good friend.  But you need not go so far afield: I know your good house of Allonby Shaw since the days of the Black Knight.  We are, in fact, and at a very royal distance, cousins.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4467
        "line_end": 4470
        "source_sequence": 4467
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4467-4470"
    "translation_ja": |-
      オースティン。郡選出の議員ですね？　古くからのよい友です。ですが、遠回しな紹介は要りませんよ。アロンビー・ショーの名門は、黒騎士の時代から存じています。じつのところ、わたしたちは、王家並みに遠い血筋の話ですが、親戚なんです。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-208"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      FENWICK.  I desired, sir, from the nature of my business, that you should recognise me for a gentleman.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4472
        "line_end": 4473
        "source_sequence": 4472
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4472-4473"
    "translation_ja": "フェンウィック。お話しする用件が用件ですから、僕を一人の紳士と認めていただきたかったのです。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-209"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  The preliminary, sir, is somewhat grave."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4475
        "line_end": 4475
        "source_sequence": 4475
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4475-4475"
    "translation_ja": "オースティン。これはまあ、ずいぶん重々しい前置きですね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-210"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  My business is both grave and delicate."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4477
        "line_end": 4477
        "source_sequence": 4477
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4477-4477"
    "translation_ja": "フェンウィック。用件は重く、しかも微妙です。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-211"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  Menteith, my good fellow.  (Exit MENTEITH.)  Mr. Fenwick, honour me so far as to be seated.  (They sit.)  I await your pleasure.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4479
        "line_end": 4480
        "source_sequence": 4479
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4479-4480"
    "translation_ja": "オースティン。メンティース、ちょっと外してくれるか。（メンティース退場。）フェンウィックさん、どうぞお掛けください。（二人とも座る。）伺いましょう。"
    "translation_status": "reviewed"

  - "id": "ba-137"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN, MENTEITH"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4264
        "line_end": 4264
        "source_sequence": 4264
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4264-4264"
    "translation_ja": "オースティン、メンティース。"
    "translation_status": "reviewed"
    "source_kind": "stage_direction"
  - "id": "ba-138"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  At the barber’s, Mr. George, I had the pleasure of meeting two of the Dook’s gentlemen."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4266
        "line_end": 4267
        "source_sequence": 4266
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4266-4267"
    "translation_ja": "メンティース。ジョージさま、床屋で公爵さまのお付きのお二方にお会いしまして。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-139"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Well, and was his Royal Highness satisfied with his quarters?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4269
        "line_end": 4269
        "source_sequence": 4269
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4269-4269"
    "translation_ja": "オースティン。それで、殿下は宿をお気に召したか？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-140"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Quite so, Mr. George.  Delighted, I believe."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4271
        "line_end": 4271
        "source_sequence": 4271
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4271-4271"
    "translation_ja": "メンティース。はい、ジョージさま。いたくお喜びのご様子で。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-141"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  I am rejoiced to hear it.  I wish I could say I was as pleased with my journey, Menteith.  This is the first time I ever came to the Wells in another person’s carriage; Duke or not, it shall be the last, Menteith.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4273
        "line_end": 4276
        "source_sequence": 4273
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4273-4276"
    "translation_ja": "オースティン。それはよかった。この旅がわたしにも、そのくらい快適だったらね、メンティース。他人の馬車でウェルズに来たのは初めてだ。相手が公爵だろうとなかろうと、もうこれきりだよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-142"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Ah, Mr. George, no wonder.  And how many times have we made that journey back and forth?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4278
        "line_end": 4279
        "source_sequence": 4278
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4278-4279"
    "translation_ja": "メンティース。ああ、ジョージさま、ごもっとも。思えば、わたしどもは何度あの道を往復したことでしょう。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-143"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Enough to make us older than we look."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4281
        "line_end": 4281
        "source_sequence": 4281
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4281-4281"
    "translation_ja": "オースティン。見た目より年をとるには十分な回数さ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-144"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  To be sure, Mr. George, you do wear well."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4283
        "line_end": 4283
        "source_sequence": 4283
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4283-4283"
    "translation_ja": "メンティース。いえ、ジョージさまは本当にお若く見えますよ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-145"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  We wear well, Menteith."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4285
        "line_end": 4285
        "source_sequence": 4285
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4285-4285"
    "translation_ja": "オースティン。われわれは若く見えるよ、メンティース。"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 9
          "end": 11
          "exact": "We"
    "source_kind": "dialogue"
  - "id": "ba-146"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  I hear, Mr. George, that Miss Musgrave is of the company."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4287
        "line_end": 4287
        "source_sequence": 4287
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4287-4287"
    "translation_ja": "メンティース。ジョージさま、マスグレーヴ嬢がおいでだそうで。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-147"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Is she so?  Well, well! well, well!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4289
        "line_end": 4289
        "source_sequence": 4289
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4289-4289"
    "translation_ja": "オースティン。そうかね。そうか、そうか。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-148"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      MENTEITH.  I’ve not seen the young lady myself, Mr. George; but the barber tells me she’s looking poorly.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4291
        "line_end": 4292
        "source_sequence": 4291
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4291-4292"
    "translation_ja": "メンティース。わたしはご当人を見ておりませんが、ジョージさま、床屋の話ではお加減が悪そうだとか。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-149"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Poorly?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4294
        "line_end": 4294
        "source_sequence": 4294
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4294-4294"
    "translation_ja": "オースティン。具合が悪い？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-150"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Yes, Mr. George, poorly was his word."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4296
        "line_end": 4296
        "source_sequence": 4296
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4296-4296"
    "translation_ja": "メンティース。はい、ジョージさま、そう申しておりました。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-151"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Well, Menteith, I am truly sorry.  She is not the first."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4298
        "line_end": 4298
        "source_sequence": 4298
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4298-4298"
    "translation_ja": "オースティン。そうか、メンティース、それは本当にお気の毒だ。あの方が初めてではないがね。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-152"
    "section_id": "act-ii-scene-i"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Yes, Mr. George.  (A bell.  MENTEITH goes out, and re-enters with card.)"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4300
        "line_end": 4301
        "source_sequence": 4300
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4300-4301"
    "translation_ja": "メンティース。さようでございます、ジョージさま。（呼び鈴。メンティースが出て、名刺を持って戻る。）"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"

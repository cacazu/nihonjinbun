    "translation_ja": "フェンウィック（さえぎって）。ああ、どうか、正しいことをなさってください！"
    "translation_status": "reviewed"
    "annotations":
      - "side": "source"
        "kind": "emphasis"
        "span":
          "start": 9
          "end": 25

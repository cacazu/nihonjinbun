        "original_unit_id": "line-4696-4699"
    "translation_ja": |-
      メンティース（こらえきれず）。ジョージさま、あなたさまは、とんでもなくいいご主人でした。わたしも、とんでもなくいい召使いでした。はじめから互いを誇りに思ってきました。でも、失礼な物言いをお許しくださいますなら、ジョージさま、今日ほどあなたさまを好きになったことはございません。
    "translation_status": "reviewed"

    "source_kind": "dialogue"
  - "id": "ba-113"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  O poor Dorothy!  O poor dead Dorothy!  John, you found me breaking this: me, your Diana of the Fells, the Diana of your old romance by Edenside.  Diana—O what a name for me!  Do you see this trinket?  It is a chapter in my life.  A chapter, do I say? my whole life, for there is none to follow.  John, you must bear with me, you must help me.  I have that to tell—there is a secret—I have a secret, John—O, for God’s sake, understand.  That Diana you revered—O John, John, you must never speak of love to me again.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4176
        "line_end": 4183
        "source_sequence": 4176
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4176-4183"
    "translation_ja": |-
      ドロシー。ああ、かわいそうなドロシー！　死んでしまったドロシー！　ジョン、あなたは、わたしがこれを壊すところを見た。あなたの山のダイアナが、昔、イーデンサイドであなたが物語にしたダイアナが。ダイアナ――ああ、わたしになんという名！　この飾りが見えて？　わたしの人生の一章よ。一章ですって？　わたしの人生のすべて。次に続くものはないから。ジョン、どうか話を聞いて。助けてくれなくちゃ。言わなくてはいけないことが――秘密があるの。秘密にしてきたことがあるのよ、ジョン。ああ、お願いだから察して。あなたがあんなに敬ってくれたダイアナは――ああジョン、もう二度と、恋の話をわたしにしないで。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-114"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  What do you say?  How dare you?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4185

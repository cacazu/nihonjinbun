        "source_sequence": 4185
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4185-4185"
    "translation_ja": "フェンウィック。何を言うんだ？　よくもそんなことを！"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-115"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  John, it is the truth.  Your Diana, even she, she whom you so believed in, she who so believed in herself, came out into the world only to be broken.  I met, here at the Wells, a man—why should I tell you his name?  I met him, and I loved him.  My heart was all his own; yet he was not content with that: he must intrigue to catch me, he must bribe my maid with this.  (Throws the necklace on the table.)  Did he love me? Well, John, he said he did; and be it so!  He loved, he betrayed, and he has left me.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4187
        "line_end": 4194
        "source_sequence": 4187
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4187-4194"
    "translation_ja": |-
      ドロシー。ジョン、本当のことよ。あなたのダイアナが、あれほどあなたが信じ、あれほど自分を信じていた娘が、世に出てみると、ただ打ち砕かれるためだった。ここ、ウェルズで男に会った。その人の名前を言うこともないでしょう？　会って、好きになったの。心はすべてあの人のものだったのに、それで満足しないのね。わたしを捕らえようと策を弄し、この品で侍女を買収した。（首飾りを食卓に投げる。）愛してくれたのかですって？　ジョン、あの人はそう言ったわ。そうだったとしましょう！　愛して、裏切って、それでわたしを捨てたの。
    "translation_status": "reviewed"

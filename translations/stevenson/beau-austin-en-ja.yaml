        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4163
        "line_end": 4163
        "source_sequence": 4163
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4163-4163"
    "translation_ja": "フェンウィック。どうして聞くのさ？　僕は君を愛している。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"

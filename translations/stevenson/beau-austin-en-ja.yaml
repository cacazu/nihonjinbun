        "source_sequence": 4418
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4418-4418"
    "translation_ja": "メンティース。わたしとあなたさまと、古いエルミタージュですね、ジョージさま。へへ。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-193"
    "section_id": "act-ii-scene-iii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  And the best of these, the Hermitage.  But come: we lose our day.  Help me off with this.  (MENTEITH takes off AUSTIN’S dressing-gown; AUSTIN passes R. to dressing-table, and takes up first cravat.)
    "source_languages":
      - "en"
    "source_locations":

        "original_unit_id": "line-4964-4964"
    "translation_ja": "第六場"
    "translation_status": "reviewed"
  - "id": "ba-336"
    "section_id": "act-iii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "To these, AUSTIN, BARBARA announcing."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4967
        "line_end": 4967
        "source_sequence": 4967
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4967-4967"
    "translation_ja": "そこへオースティン。バーバラが取り次ぐ。"
    "translation_status": "reviewed"

    "source_kind": "dialogue"
  - "id": "ba-119"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      DOROTHY.  Yours is the pain; but, O John, think it is for your good. Think in England how many true maids may be waiting for your love, haw many that can bring you a whole heart, and be a noble mother to your children, while your poor Diana, at the first touch, has proved all frailty.  Go, go and be happy, and let me be patient.  I have sinned.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4203
        "line_end": 4207
        "source_sequence": 4203
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4203-4207"
    "translation_ja": |-
      ドロシー。苦しむのはあなた。でも、どうかあなたのためと思って、ジョン。イングランドには、あなたの愛を待つ誠実な娘がどれくらいいるかしら。心のすべてを捧げられ、お子さんたちの立派な母になれる人がどれくらいいるかしら。あなたのかわいそうなダイアナは、たった一度の誘惑で、こんなにもろいと知れたというのに。行って、行って幸せになって。わたしには耐えさせてちょうだい。わたしは罪を犯したの。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-120"
    "section_id": "act-i-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "FENWICK.  By God, I’ll have his blood."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

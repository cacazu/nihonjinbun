    "origin": "source"
    "source_text": |-
      FENWICK.  Mr. Austin, Dorothy Musgrave is the oldest and dearest of my friends, is the lady whom for ten years it has been my hope to make my wife.  She has shown me reason to discard that hope for another: that I may call her Mrs. Austin.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4492
        "line_end": 4495
        "source_sequence": 4492
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4492-4495"
    "translation_ja": |-
      フェンウィック。オースティンさん、ドロシー・マスグレーヴは、僕のいちばん古く、いちばん大切な友です。十年ものあいだ妻に迎えたいと願った女性です。彼女のお話を聞いて、その望みは捨て、別の望みを持つことにしました。オースティン夫人と呼べるようにと。
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-217"
    "section_id": "act-ii-scene-iv"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  In the best interests of the lady (rising) I question if you have been well inspired.  You are aware, sir, that from such interference there is but one issue: to whom shall I address my friend?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4497
        "line_end": 4499
        "source_sequence": 4497
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4497-4499"
    "translation_ja": "オースティン。あの方のためを思えば（立ち上がって）、それがよい思いつきだったか、疑問ですね。おわかりでしょう、こういう口出しの始末は一つしかない。わたしの介添人をどなたのもとに差し向ければよいのです？"
    "translation_status": "reviewed"
    "annotations":

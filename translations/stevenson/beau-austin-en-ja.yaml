      DOROTHY.  Ay, even so; I was betrayed.  The fault was mine that I forgot our innocent youth, and your honest love.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

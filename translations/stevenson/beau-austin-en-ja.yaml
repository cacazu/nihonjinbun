    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-069"
    "section_id": "act-i-scene-ii"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MISS FOSTER.  You knew, child? and did not tell?  You are a public criminal."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4675-4676"
    "translation_ja": "メンティース。おお、ジョージさま、それはおめでとうございます。マスグレーヴ嬢はたいそう気品のあるお方です。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-257"
    "section_id": "act-ii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  Ay, Mr. Menteith? and who told you the lady’s name?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4678
        "line_end": 4678
        "source_sequence": 4678
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4678-4678"
    "translation_ja": "オースティン。ほう、メンティースさん。誰が相手の名を教えたのかな？"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-258"
    "section_id": "act-ii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Mr. George, you was always a gentleman."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4680
        "line_end": 4680
        "source_sequence": 4680
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4680-4680"
    "translation_ja": "メンティース。ジョージさま、あなたさまはいつも紳士でいらっしゃいます。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-259"
    "section_id": "act-ii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      AUSTIN.  You mean I wasn’t always?  Old boy, you are in the right.  This shall be a good change for both you and me.  We have lived too long like a brace of truants: now is the time to draw about the fire.  How much is left of the old Hermitage?
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4682
        "line_end": 4685
        "source_sequence": 4682
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4682-4685"
    "translation_ja": |-
      オースティン。いつもではなかったと言いたいのか？　古い友よ、おまえの言うとおりだ。おまえにもわたしにも、よい変化になるだろう。二人でずいぶん長く、つるんで道草ばかり食ってきた。もう炉辺に腰を落ち着けるころだ。古いエルミタージュはどのくらい残っている？
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-260"
    "section_id": "act-ii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "MENTEITH.  Hard upon thirty dozen, Mr. George, and not a bad cork in the bin."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"
        "line_start": 4687
        "line_end": 4688
        "source_sequence": 4687
    "source_alignment":
      - "source_id": "gutenberg-719"
        "original_unit_id": "line-4687-4688"
    "translation_ja": "メンティース。三十ダース近くもございますよ、ジョージさま。蔵には傷んだ栓は一本もございません。"
    "translation_status": "reviewed"
    "source_kind": "dialogue"
  - "id": "ba-261"
    "section_id": "act-ii-scene-vi"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "AUSTIN.  And a mistress, Menteith, that’s worthy of that wine."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-719"
        "precision": "line"
        "url": "https://gutenberg.pglaf.org/cache/epub/719/pg719.txt"

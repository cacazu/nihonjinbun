        "original_unit_id": "pg30650-lines-9189-9193"
    "translation_ja": |-
      そこで彼は血の気のないものを追った。途中で父の姿に出会った。父は怒ってののしり、子の務めを説き、まだ間に合ううちに家へ帰れと命じた。「まだ今なら」と父は言った。「日没までに帰れる。そうすれば、何もかも許してやる」
    "translation_status": "reviewed"

        "original_unit_id": "pg30650-lines-9171-9172"
    "translation_ja": "「食べ物が体によいことは分かります」とジャック。「それでも、人が右脚に枷をはめるべきだという証拠にはなりません」"
    "translation_status": "reviewed"
  - "id": "f08-030"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Now at this the appearance of his uncle gobbled like a turkey."

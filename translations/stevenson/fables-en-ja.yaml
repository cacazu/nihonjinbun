    "translation_ja": "「あきれた図々しさだこと。私たちほどの身分の者に話しかけるなんて！」と牝馬は叫んだ。"
    "translation_status": "reviewed"
  - "id": "f14-010"
    "section_id": "fable-14"
    "kind": "paragraph"
    "origin": "source"

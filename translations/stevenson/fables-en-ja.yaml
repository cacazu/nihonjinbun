      「なあ、お前」と教理問答を教えているおじは言った。「足枷に文句を言ってはいけない。生きる値打ちを人生に与えるのは、あれひとつなのだ。われわれのように枷をつけていない者で、幸福な者も善い者も立派な者も一人だっていない。それに教えておくが、たいそう危険な物言いだぞ。鉄の枷を不平に思えば運に見放される。もし外しでもしたら、その場で雷に打たれるのだ」

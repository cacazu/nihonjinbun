    "translation_ja": |-
      二人は波打ちぎわに沿って行った。男は明日への歌を笛で奏で、歩む二人を枯れ葉が追った。やがて二人は一緒に腰を下ろした。海は露台に打ち寄せ、塔のまわりでかもめが鳴き、風が家の煙突で低くうなった。九年、二人は座った。毎年、秋が来るたびに男は言った。「今こそその時だ。今この時を支配する力が私にはある」すると王の娘は言った。「いいえ、それよりも明日への歌を吹いてちょうだい」男が吹く歌は、幾年もの時のように長かった。

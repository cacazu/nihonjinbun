    "source_text": |-
      So he went on after the bloodless thing that had escaped; and in the way he met the appearance of his mother, and she wept. "What have you done?" she cried. "What is this that you have done? O, come home (where you may be by bedtime) ere you do more ill to me and mine; for it is enough to smite my brother and your father."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"

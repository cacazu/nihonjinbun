    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9166-9166"
    "translation_ja": "「いや、とんでもない！」とジャック。「ぼくはまだ得心していません」"
    "translation_status": "reviewed"
  - "id": "f08-028"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"How!\" cried his uncle. \"Are you not warmed by the fire? Does not this food sustain you?\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 128
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"

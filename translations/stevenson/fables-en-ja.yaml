        "original_unit_id": "pg30650-lines-8701-8705"
    "translation_ja": |-
      「うむ、それはほぼ私の考えていたことだ」とスモレット船長。「作者には物語がいる。作者の欲しいのはそれだ。物語を作り、たとえばあの医者のような人物に存分に働く場をやるには、お前やハンズのような連中を登場させねばならん。だが作者が与するのは正しい側だぞ。油断せんことだ！　まだお前の話は終わっていない。一波乱あるぞ」
    "translation_status": "reviewed"
  - "id": "f01-024"
    "section_id": "fable-01"

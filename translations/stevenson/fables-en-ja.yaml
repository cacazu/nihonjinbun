    "source_text": |-
      He thought to leave the fetter where it lay, but when he turned to go, his mind was otherwise. So he stooped and put the gyve in his bosom; and the rough iron galled him as he went, and his bosom bled.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 145
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9236
        "line_end": 9238
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9236-9238"
    "translation_ja": "足枷はそこへ置いてゆこうと思ったが、背を向けると気が変わった。彼は身をかがめて枷を拾い、懐へ入れた。ざらついた鉄は歩くたびに皮膚をこすり、胸からは血が出た。"
    "translation_status": "reviewed"
  - "id": "f08-046"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Now when he was forth of the wood upon the highway, he met folk returning from the field; and those he met had no fetter on the right leg, but, behold! they had one upon the left. Jack asked them what it signified; and they said, "that was the new wear, for the old was found to be a superstition." Then he looked at them nearly; and there was a new ulcer on the left ankle, and the old one on the right was not yet healed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 146
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9240
        "line_end": 9246
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9240-9246"
    "translation_ja": |-
      森を出て街道へ差しかかると、畑仕事から帰る人たちに会った。出会う人たちの右脚に枷はなかった。だが見よ、左脚には枷がある！　どういうことかと聞くと、「古いのは迷信だと分かったので、こうするのが新しい流行なのさ」と言った。よくよく見ると、左の足首には新しいただれができ、右の古傷もまだ治っていなかった。
    "translation_status": "reviewed"
  - "id": "f08-047"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Now, may God forgive me!\" cried Jack. \"I would I were well home.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 147
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9248
        "line_end": 9248
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9248-9248"
    "translation_ja": "「ああ、神よ、お許しを！」ジャックは叫んだ。「ああ、無事に家に帰れさえすれば！」"
    "translation_status": "reviewed"
  - "id": "f08-048"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      And when he was home, there lay his uncle smitten on the head, and his father pierced through the heart, and his mother cloven through the midst. And he sat in the lone house and wept beside the bodies.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 148
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9250
        "line_end": 9252
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9250-9252"
    "translation_ja": "家に着いてみると、おじは頭を割られ、父は心臓を貫かれ、母は胴をまっぷたつにされて倒れていた。彼はひとけのない家で、なきがらのかたわらに座り、泣いた。"
    "translation_status": "reviewed"
  - "id": "f08-049"
    "section_id": "fable-08"
    "kind": "heading"
    "origin": "source"
    "source_text": "MORAL"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 149
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9254
        "line_end": 9254
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9254-9254"
    "translation_ja": "教訓"
    "translation_status": "reviewed"
  - "id": "f08-050"
    "section_id": "fable-08"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      Old is the tree and the fruit good,
      Very old and thick the wood.
      Woodman, is your courage stout?
      Beware! the root is wrapped about
      Your mother's heart, your father's bones;
      And like the mandrake comes with groans.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 150
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9256
        "line_end": 9261
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9256-9261"
    "translation_ja": |-
      木は古く、実はうまい。
      森はたいそう古く、深い。
      木こりよ、肝は据わったか？
      気をつけろ、根の絡みつくのは
      お前の母の心、お前の父の骨。
      マンドラゴラと同じ、抜けばうめくぞ。
    "translation_status": "reviewed"
  - "id": "f09-000"

        "original_unit_id": "pg30650-lines-9213-9217"
    "translation_ja": |-
      そうして、逃げた血の気のないものを追っていくと、途中で母の姿に出会った。母は泣いていた。「なんということをしたの？」と叫んだ。「お前はいったい何をしたの？　ああ、私や身内にこれ以上ひどいことをしないうちに帰っておくれ。今なら寝る時分に間に合います。私のきょうだいとお前の父を斬っただけでもう十分でしょう」
    "translation_status": "reviewed"

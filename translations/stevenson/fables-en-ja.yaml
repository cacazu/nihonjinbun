    "translation_ja": |-
      ある町に、黄色いペンキを売る医者が住んでいた。不思議な効き目のあるペンキで、頭のてっぺんからかかとまで塗りたくった者は、生涯の危険と、罪のくびきと、死の恐れとから永遠に解き放たれる。医者の広告にはそうあり、町の人々も口をそろえてそう言った。だれもが何より切に願うのは自分がきちんと塗ってもらうことで、何より楽しみにするのは他人が塗られるのを見ることだった。同じ町に、育ちはたいそうよいが少々向こう見ずな暮らしをする若者がいた。もう一人前になる年なのに、ペンキの話には耳も貸さない。「明日で十分間に合うさ」と言い、明日が来るとまた先へ延ばした。ひょっとすれば死ぬまでそうしていたかもしれない。ところが彼には同じ年頃、同じような行状の友達がいて、この青年が体にペンキを一滴もつけずに往来を歩いていると、突然、散水馬車にひかれ、ペンキひとつまとわぬ若さの盛りに命を絶たれた。友の死は若者の魂を揺さぶった。これほど真剣に塗ってほしがる人間を、私は見たことがない。その日の夕方、一家全員の立ち会いで、それにふさわしい音楽が奏でられ、本人は声をあげて泣きながら、全身くまなく三度塗り、仕上げにニスをひと塗りしてもらった。医者も感涙にむせび、これほど念の入った仕事はしたことがないと言い切った。
    "translation_status": "reviewed"

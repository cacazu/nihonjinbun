    "origin": "source"
    "source_text": |-
      IX
      THE FOUR REFORMERS
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 151
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9266
        "line_end": 9268
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9266-9268"
    "translation_ja": "九　四人の改革者"
    "translation_status": "reviewed"
  - "id": "f09-001"
    "section_id": "fable-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Four reformers met under a bramble-bush. They were all agreed the world must be changed. "We must abolish property," said one.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 152
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9271
        "line_end": 9272
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9271-9272"
    "translation_ja": "四人の改革者が茨の茂みの下に集まった。世の中を変えねばならぬことでは全員一致した。「われわれは財産制度を廃止しなければならない」と一人が言った。"
    "translation_status": "reviewed"
  - "id": "f09-002"
    "section_id": "fable-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"We must abolish marriage,\" said the second."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 153
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9274
        "line_end": 9274
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9274-9274"
    "translation_ja": "「われわれは結婚を廃止しなければならない」と二人目が言った。"
    "translation_status": "reviewed"
  - "id": "f09-003"
    "section_id": "fable-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"We must abolish God,\" said the third."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 154
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9276
        "line_end": 9276
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9276-9276"
    "translation_ja": "「われわれは神を廃止しなければならない」と三人目が言った。"
    "translation_status": "reviewed"
  - "id": "f09-004"
    "section_id": "fable-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I wish we could abolish work,\" said the fourth."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 155
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9278
        "line_end": 9278
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9278-9278"
    "translation_ja": "「労働を廃止できるといいんだが」と四人目が言った。"
    "translation_status": "reviewed"
  - "id": "f09-005"
    "section_id": "fable-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Do not let us get beyond practical politics," said the first. "The first thing is to reduce men to a common level."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 156
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9280
        "line_end": 9281
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9280-9281"
    "translation_ja": "「実行できる政策の枠を超えるのはよそう」と一人目。「まず、人間をみな同じ高さまで引き下ろすことだ」"
    "translation_status": "reviewed"
  - "id": "f09-006"
    "section_id": "fable-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"The first thing,\" said the second, \"is to give freedom to the sexes.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 157
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9283
        "line_end": 9283
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9283-9283"
    "translation_ja": "「まず」と二人目。「男女を自由にすることだ」"
    "translation_status": "reviewed"
  - "id": "f09-007"
    "section_id": "fable-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"The first thing,\" said the third, \"is to find out how to do it.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 158
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9285
        "line_end": 9285
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9285-9285"
    "translation_ja": "「まず」と三人目。「それをどうやったらいいのか突き止めることだ」"
    "translation_status": "reviewed"
  - "id": "f09-008"
    "section_id": "fable-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"The first step,\" said the first, \"is to abolish the Bible.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 159
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9287
        "line_end": 9287
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9287-9287"
    "translation_ja": "「第一歩は」と一人目。「聖書を廃止することだ」"
    "translation_status": "reviewed"
  - "id": "f09-009"
    "section_id": "fable-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"The first thing,\" said the second, \"is to abolish the laws.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 160
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9289
        "line_end": 9289
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9289-9289"
    "translation_ja": "「まず」と二人目。「法律を廃止することだ」"
    "translation_status": "reviewed"
  - "id": "f09-010"
    "section_id": "fable-09"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"The first thing,\" said the third, \"is to abolish mankind.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 161
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9291
        "line_end": 9291
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9291-9291"
    "translation_ja": "「まず」と三人目。「人類を廃止することだ」"
    "translation_status": "reviewed"
  - "id": "f10-000"
    "section_id": "fable-10"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      X
      THE MAN AND HIS FRIEND
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 162
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9296
        "line_end": 9298
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9296-9298"
    "translation_ja": "十　ある男とその友"
    "translation_status": "reviewed"
  - "id": "f10-001"
    "section_id": "fable-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A man quarrelled with his friend."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 163
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9301
        "line_end": 9301
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9301-9301"
    "translation_ja": "ある男が友達とけんかした。"
    "translation_status": "reviewed"
  - "id": "f10-002"
    "section_id": "fable-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I have been much deceived in you,\" said the man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 164
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9303
        "line_end": 9303
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9303-9303"
    "translation_ja": "「君のことはすっかり見誤っていたよ」と男は言った。"
    "translation_status": "reviewed"
  - "id": "f10-003"
    "section_id": "fable-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And the friend made a face at him and went away."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 165
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9305
        "line_end": 9305
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9305-9305"
    "translation_ja": "友達は彼にあかんべえをして、立ち去った。"
    "translation_status": "reviewed"
  - "id": "f10-004"
    "section_id": "fable-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      A little after, they both died, and came together before the great white Justice of the Peace. It began to look black for the friend, but the man for a while had a clear character and was getting in good spirits.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 166
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9307
        "line_end": 9309
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9307-9309"
    "translation_ja": "しばらくして二人とも死に、白く輝く偉大な治安判事の前へ、一緒に出た。友達の形勢はだんだん悪くなったが、男のほうはしばらくは身の潔白が保たれて、気も晴れやかになってきた。"
    "translation_status": "reviewed"
  - "id": "f10-005"
    "section_id": "fable-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I find here some record of a quarrel," said the Justice, looking in his notes. "Which of you was in the wrong?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 167
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9311
        "line_end": 9312
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9311-9312"
    "translation_ja": "「ここにけんかの記録がある」と判事は書き付けを見ながら言った。「悪かったのはどちらだ？」"
    "translation_status": "reviewed"
  - "id": "f10-006"
    "section_id": "fable-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"He was,\" said the man. \"He spoke ill of me behind my back.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 168
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9314
        "line_end": 9314
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9314-9314"
    "translation_ja": "「そいつです」と男は言った。「私の陰口を言ったのです」"
    "translation_status": "reviewed"
  - "id": "f10-007"
    "section_id": "fable-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Did he so?\" said the Justice. \"And pray how did he speak about your neighbours?\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 169
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9316
        "line_end": 9317
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9316-9317"
    "translation_ja": "「そうしたのか」と判事。「では聞くが、この者はお前の隣人たちのことはどう言っておった？」"
    "translation_status": "reviewed"
  - "id": "f10-008"
    "section_id": "fable-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"O, he had always a nasty tongue,\" said the man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 170
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9319
        "line_end": 9319
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9319-9319"
    "translation_ja": "「ああ、いつも口の悪いやつでした」と男。"
    "translation_status": "reviewed"
  - "id": "f10-009"
    "section_id": "fable-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "And you chose him for your friend?" cried the Justice. "My good fellow, we have no use here for fools."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 171
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9321
        "line_end": 9322
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9321-9322"
    "translation_ja": "「それをお前は自分の友達に選んだのか？」判事は叫んだ。「なあ君、ここでは馬鹿者に用はない」"
    "translation_status": "reviewed"
  - "id": "f10-010"
    "section_id": "fable-10"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      So the man was cast in the pit, and the friend laughed out aloud in the dark and remained to be tried on other charges.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 172
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9324
        "line_end": 9325
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9324-9325"
    "translation_ja": "そこで男は奈落へ投げ込まれ、友達は暗がりで声高く笑い、そのほかの件で裁かれるためにあとへ残った。"
    "translation_status": "reviewed"
  - "id": "f11-000"
    "section_id": "fable-11"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XI
      THE READER
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 173
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9330
        "line_end": 9332
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9330-9332"
    "translation_ja": "十一　読者"
    "translation_status": "reviewed"
  - "id": "f11-001"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I never read such an impious book,\" said the reader, throwing it on the floor."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 174
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9335
        "line_end": 9336
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9335-9336"
    "translation_ja": "「こんな不信心な本は読んだことがない」と読者は言って、本を床に投げた。"
    "translation_status": "reviewed"
  - "id": "f11-002"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "You need not hurt me," said the book; "you will only get less for me second-hand, and I did not write myself."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 175
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9338
        "line_end": 9339
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9338-9339"
    "translation_ja": "「私を傷めることはないでしょう」と本は言った。「古本として売るとき値が下がるだけですよ。それに私は自分で自分を書いたわけではない」"
    "translation_status": "reviewed"
  - "id": "f11-003"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"That is true,\" said the reader. \"My quarrel is with your author.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 176
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9341
        "line_end": 9341
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9341-9341"
    "translation_ja": "「それはそうだ」と読者。「文句があるのは君の作者なんだ」"
    "translation_status": "reviewed"
  - "id": "f11-004"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Ah, well,\" said the book, \"you need not buy his rant.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 177
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9343
        "line_end": 9343
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9343-9343"
    "translation_ja": "「ああ、では」と本。「あの人の大げさな言い分を、わざわざ買うことはないでしょう」"
    "translation_status": "reviewed"
  - "id": "f11-005"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"That is true,\" said the reader. \"But I thought him such a cheerful writer.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 178
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9345
        "line_end": 9346
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9345-9346"
    "translation_ja": "「それはそうだ」と読者。「でも、あんなに明るい作家だと思っていたのに」"
    "translation_status": "reviewed"
  - "id": "f11-006"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I find him so,\" said the book."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 179
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9348
        "line_end": 9348
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9348-9348"
    "translation_ja": "「私は明るいと思いますよ」と本。"
    "translation_status": "reviewed"
  - "id": "f11-007"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"You must be differently made from me,\" said the reader."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 180
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9350
        "line_end": 9350
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9350-9350"
    "translation_ja": "「君とぼくとは出来が違うらしい」と読者。"
    "translation_status": "reviewed"
  - "id": "f11-008"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Let me tell you a fable," said the book. "There were two men wrecked upon a desert island; one of them made believe he was at home, the other admitted----"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 181
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9352
        "line_end": 9354
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9352-9354"
    "translation_ja": "「寓話を一つ」と本は言った。「二人の男が難破して、無人島に流れ着きました。一人は家にいるつもりで暮らし、もう一人は率直に……」"
    "translation_status": "reviewed"
  - "id": "f11-009"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"O, I know your kind of fable,\" said the reader. \"They both died.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 182
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9356
        "line_end": 9356
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9356-9356"
    "translation_ja": "「ああ、君らの寓話なら分かってる」と読者。「二人とも死んだんだろう」"
    "translation_status": "reviewed"
  - "id": "f11-010"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"And so they did,\" said the book. \"No doubt of that. And everybody else.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 183
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9358
        "line_end": 9359
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9358-9359"
    "translation_ja": "「まったくそのとおり」と本。「まちがいありません。ほかのみんなもね」"
    "translation_status": "reviewed"
  - "id": "f11-011"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "That is true," said the reader. "Push it a little further for this once. And when they were all dead?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 184
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9361
        "line_end": 9362
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9361-9362"
    "translation_ja": "「それはそうだ」と読者。「今度だけは、もう少し先まで話してくれ。みんな死んだら、それから？」"
    "translation_status": "reviewed"
  - "id": "f11-012"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"They were in God's hands, the same as before,\" said the book."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 185
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9364
        "line_end": 9364
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9364-9364"
    "translation_ja": "「みんな神のみ手のうちにいました。前と同じように」と本は言った。"
    "translation_status": "reviewed"
  - "id": "f11-013"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Not much to boast of, by your account,\" cried the reader."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 186
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9366
        "line_end": 9366
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9366-9366"
    "translation_ja": "「君の話じゃ、自慢になるようなことじゃないな！」と読者は叫んだ。"
    "translation_status": "reviewed"
  - "id": "f11-014"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Who is impious now?\" said the book."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 187
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9368
        "line_end": 9368
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9368-9368"
    "translation_ja": "「さて、不信心なのはどなたかな？」と本は言った。"
    "translation_status": "reviewed"
  - "id": "f11-015"
    "section_id": "fable-11"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And the reader put him on the fire."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 188
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9370
        "line_end": 9370
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9370-9370"
    "translation_ja": "そこで読者は本を火にくべた。"
    "translation_status": "reviewed"
  - "id": "f11-016"
    "section_id": "fable-11"
    "kind": "verse"
    "origin": "source"
    "source_text": |-
      The coward crouches from the rod,
      And loathes the iron face of God.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 189
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9372
        "line_end": 9373
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9372-9373"
    "translation_ja": |-
      臆病者は鞭におびえてうずくまり、
      鉄のような神の顔を憎む。
    "translation_status": "reviewed"
  - "id": "f12-000"
    "section_id": "fable-12"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XII
      THE CITIZEN AND THE TRAVELLER
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 190
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9378
        "line_end": 9380
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9378-9380"
    "translation_ja": "十二　町の人と旅人"
    "translation_status": "reviewed"
  - "id": "f12-001"
    "section_id": "fable-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Look round you,\" said the citizen. \"This is the largest market in the world.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 191
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9383
        "line_end": 9384
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9383-9384"
    "translation_ja": "「ぐるりと見渡してください」と町の人は言った。「ここは世界でいちばん大きな市場です」"
    "translation_status": "reviewed"
  - "id": "f12-002"
    "section_id": "fable-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"O, surely not,\" said the traveller."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 192
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9386
        "line_end": 9386
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9386-9386"
    "translation_ja": "「いや、まさか」と旅人。"
    "translation_status": "reviewed"
  - "id": "f12-003"
    "section_id": "fable-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Well, perhaps not the largest,\" said the citizen, \"but much the best.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 193
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9388
        "line_end": 9388
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9388-9388"
    "translation_ja": "「まあ、いちばん大きくはないかもしれませんが」と町の人。「ずばぬけていちばんよい市場です」"
    "translation_status": "reviewed"
  - "id": "f12-004"
    "section_id": "fable-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"You are certainly wrong there,\" said the traveller. \"I can tell you....\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 194
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9390
        "line_end": 9390
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9390-9390"
    "translation_ja": "「それは断じて違いますよ」と旅人。「よろしければひとつお話し……」"
    "translation_status": "reviewed"
  - "id": "f12-005"
    "section_id": "fable-12"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "They buried the stranger at the dusk."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 195
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9392
        "line_end": 9392
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9392-9392"
    "translation_ja": "夕暮れに、彼らはそのよそ者を葬った。"
    "translation_status": "reviewed"
  - "id": "f13-000"
    "section_id": "fable-13"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XIII
      THE DISTINGUISHED STRANGER
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 196
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9397
        "line_end": 9399
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9397-9399"
    "translation_ja": "十三　高名な異邦人"
    "translation_status": "reviewed"
  - "id": "f13-001"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Once upon a time there came to this earth a visitor from a neighbouring planet. And he was met at the place of his descent by a great philosopher, who was to show him everything.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 197
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9402
        "line_end": 9404
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9402-9404"
    "translation_ja": "むかし、この地球へ隣の惑星から客が来た。降り立ったところで、何から何まで案内するはずの大哲学者が彼を出迎えた。"
    "translation_status": "reviewed"
  - "id": "f13-002"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      First of all they came through a wood, and the stranger looked upon the trees. "Whom have we here?" said he.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 198
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9406
        "line_end": 9407
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9406-9407"
    "translation_ja": "まず二人は林を通り、客は木々に目をやった。「ここにおいでなのはどなたでしょう？」と彼は言った。"
    "translation_status": "reviewed"
  - "id": "f13-003"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "These are only vegetables," said the philosopher. "They are alive, but not at all interesting."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 199
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9409
        "line_end": 9410
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9409-9410"
    "translation_ja": "「ただの植物ですよ」と哲学者。「生きてはいますが、なんら興味を引くものではない」"
    "translation_status": "reviewed"
  - "id": "f13-004"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I don't know about that," said the stranger. "They seem to have very good manners. Do they never speak?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 200
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9412
        "line_end": 9413
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9412-9413"
    "translation_ja": "「それはどうでしょう」と客。「たいそう行儀のよい方々にお見受けします。まったく物をおっしゃらないのですか？」"
    "translation_status": "reviewed"
  - "id": "f13-005"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"They lack the gift,\" said the philosopher."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 201
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9415
        "line_end": 9415
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9415-9415"
    "translation_ja": "「その能力を授かっておりません」と哲学者。"
    "translation_status": "reviewed"
  - "id": "f13-006"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Yet I think I hear them sing,\" said the other."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 202
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9417
        "line_end": 9417
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9417-9417"
    "translation_ja": "「けれど歌っているのが聞こえる気がしますが」と客。"
    "translation_status": "reviewed"
  - "id": "f13-007"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "That is only the wind among the leaves," said the philosopher. "I will explain to you the theory of winds: it is very interesting."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 203
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9419
        "line_end": 9420
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9419-9420"
    "translation_ja": "「あれは葉の間を渡る風にすぎません」と哲学者。「風の理論を説明して差し上げましょう。まことに興味深いものです」"
    "translation_status": "reviewed"
  - "id": "f13-008"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Well,\" said the stranger, \"I wish I knew what they are thinking.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 204
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9422
        "line_end": 9422
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9422-9422"
    "translation_ja": "「さあ」と客。「私としては、この方たちが何を考えているのか知りたい」"
    "translation_status": "reviewed"
  - "id": "f13-009"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"They cannot think,\" said the philosopher."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 205
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9424
        "line_end": 9424
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9424-9424"
    "translation_ja": "「考えることはできません」と哲学者。"
    "translation_status": "reviewed"
  - "id": "f13-010"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I don't know, about that," returned the stranger: and then, laying his hand upon a trunk: "I like these people," said he.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 206
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9426
        "line_end": 9427
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9426-9427"
    "translation_ja": "「それはどうでしょう」と客は答えた。それから木の幹に手を当てて言った。「私はこの方たちが好きです」"
    "translation_status": "reviewed"
  - "id": "f13-011"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"They are not people at all,\" said the philosopher. \"Come along.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 207
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9429
        "line_end": 9429
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9429-9429"
    "translation_ja": "「そもそも人間ではありませんよ」と哲学者。「さあ、こちらへ」"
    "translation_status": "reviewed"
  - "id": "f13-012"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Next they came through a meadow where there were cows."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 208
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9431
        "line_end": 9431
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9431-9431"
    "translation_ja": "次に二人は、牛のいる草地を横切った。"
    "translation_status": "reviewed"
  - "id": "f13-013"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"These are very dirty people,\" said the stranger."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 209
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9433
        "line_end": 9433
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9433-9433"
    "translation_ja": "「この方たちはずいぶん汚れている」と客は言った。"
    "translation_status": "reviewed"
  - "id": "f13-014"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "They are not people at all," said the philosopher; and he explained what a cow is in scientific words which I have forgotten.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 210
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9435
        "line_end": 9436
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9435-9436"
    "translation_ja": "「そもそも人間ではありませんよ」と哲学者。そして牛とは何であるかを、学術用語を用いて説明したが、その言葉を私は忘れてしまった。"
    "translation_status": "reviewed"
  - "id": "f13-015"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"That is all one to me,\" said the stranger. \"But why do they never look up?\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 211
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9438
        "line_end": 9439
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9438-9439"
    "translation_ja": "「私にはどうでもよいことです」と客。「けれど、なぜ一度も上を向かないのでしょう？」"
    "translation_status": "reviewed"
  - "id": "f13-016"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Because they are graminivorous," said the philosopher; "and to live upon grass, which is not highly nutritious, requires so close an attention to business that they have no time to think, or speak, or look at the scenery, or keep themselves clean."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 212
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9441
        "line_end": 9444
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9441-9444"
    "translation_ja": |-
      「草食性であるからです」と哲学者。「栄養価のさほど高くない草を食べて暮らすには、仕事によほど注意を集中しなければなりませんから、考える暇も、話す暇も、景色を見る暇も、身ぎれいにする暇もないのです」
    "translation_status": "reviewed"
  - "id": "f13-017"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Well," said the stranger, "that is one way to live, no doubt. But I prefer the people with the green heads."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 213
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9446
        "line_end": 9447
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9446-9447"
    "translation_ja": "「なるほど」と客。「それも確かに一つの生き方ですね。しかし私は緑色の頭の方たちのほうが好きです」"
    "translation_status": "reviewed"
  - "id": "f13-018"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Next they came into a city, and the streets were full of men and women."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 214
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9449
        "line_end": 9449
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9449-9449"
    "translation_ja": "次に二人は町へ入った。通りは男たちや女たちでいっぱいだった。"
    "translation_status": "reviewed"
  - "id": "f13-019"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"These are very odd people,\" said the stranger."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 215
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9451
        "line_end": 9451
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9451-9451"
    "translation_ja": "「この方たちはたいそう妙ですね」と客は言った。"
    "translation_status": "reviewed"
  - "id": "f13-020"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"They are the people of the greatest nation in the world,\" said the philosopher."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 216
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9453
        "line_end": 9454
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9453-9454"
    "translation_ja": "「世界で最も偉大な国の民です」と哲学者は言った。"
    "translation_status": "reviewed"
  - "id": "f13-021"
    "section_id": "fable-13"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Are they indeed?\" said the stranger. \"They scarcely look so.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 217
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9456
        "line_end": 9456
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9456-9456"
    "translation_ja": "「本当ですか？」と客。「どうも、そうは見えませんが」"
    "translation_status": "reviewed"
  - "id": "f14-000"
    "section_id": "fable-14"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      XIV
      THE CART-HORSES AND THE SADDLE-HORSE
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 218
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9461
        "line_end": 9463
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9461-9463"
    "translation_ja": "十四　荷馬と乗用馬"
    "translation_status": "reviewed"
  - "id": "f14-001"
    "section_id": "fable-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Two cart-horses, a gelding and a mare, were brought to Samoa, and put in the same field with a saddle-horse to run free on the island. They were rather afraid to go near him, for they saw he was a saddle-horse, and supposed he would not speak to them. Now the saddle-horse had never seen creatures so big. "These must be great chiefs," thought he, and he approached them civilly. "Lady and gentleman," said he, "I understand you are from the colonies. I offer you my affectionate compliments, and make you heartily welcome to the islands."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 219
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9466
        "line_end": 9473
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9466-9473"
    "translation_ja": |-
      二頭の荷馬、去勢馬と牝馬がサモアへ運ばれてきて、島で自由に走れるよう、一頭の乗用馬と同じ野に放たれた。二頭はその馬に近寄るのが少し恐かった。ひと目で人を乗せる馬だと分かり、自分たちなどとは口もきくまいと思ったからだ。ところが乗用馬のほうは、これほど大きな生きものを見たことがなかった。「きっと大酋長に違いない」と思い、礼儀正しく近づいた。「ご婦人、そして紳士」と彼は言った。「植民地からお越しとうかがっております。心からご挨拶を申し上げます。島々へようこそおいでくださいました」
    "translation_status": "reviewed"
  - "id": "f14-002"
    "section_id": "fable-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The colonials looked at him askance, and consulted with each other."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 220
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9475
        "line_end": 9475
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9475-9475"
    "translation_ja": "植民地から来た二頭は横目で眺め、ひそひそ相談した。"
    "translation_status": "reviewed"
  - "id": "f14-003"
    "section_id": "fable-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Who can he be?\" said the gelding."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 221
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9477
        "line_end": 9477
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9477-9477"
    "translation_ja": "「あれは何者だろう？」と去勢馬。"
    "translation_status": "reviewed"
  - "id": "f14-004"
    "section_id": "fable-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"He seems suspiciously civil,\" said the mare."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 222
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9479
        "line_end": 9479
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9479-9479"
    "translation_ja": "「怪しいほど丁重ね」と牝馬。"
    "translation_status": "reviewed"
  - "id": "f14-005"
    "section_id": "fable-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I do not think he can be much account,\" said the gelding."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 223
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9481
        "line_end": 9481
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9481-9481"
    "translation_ja": "「大した身分じゃないと思うね」と去勢馬。"
    "translation_status": "reviewed"
  - "id": "f14-006"
    "section_id": "fable-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Depend upon it he is only a Kanaka,\" said the mare."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 224
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9483
        "line_end": 9483
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9483-9483"
    "translation_ja": "「きっとただのカナカ人よ」と牝馬。"
    "translation_status": "reviewed"
  - "id": "f14-007"
    "section_id": "fable-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "Then they turned to him."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 225
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9485
        "line_end": 9485
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9485-9485"
    "translation_ja": "それから二頭は相手に向き直った。"
    "translation_status": "reviewed"
  - "id": "f14-008"
    "section_id": "fable-14"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Go to the devil!\" said the gelding."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 226
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9487
        "line_end": 9487
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-9487-9487"
    "translation_ja": "「くたばりやがれ！」と去勢馬。"

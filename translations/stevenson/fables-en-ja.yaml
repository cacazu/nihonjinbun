    "kind": "paragraph"
    "origin": "source"
    "source_text": "There was once a sick man in a burning house, to whom there entered a fireman."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 58
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8849
        "line_end": 8850
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8849-8850"
    "translation_ja": "むかし、燃えている家に病人がいて、そこへ火消しが入ってきた。"
    "translation_status": "reviewed"
  - "id": "f04-002"
    "section_id": "fable-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Do not save me,\" said the sick man. \"Save those who are strong.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 59
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8852
        "line_end": 8852
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8852-8852"
    "translation_ja": "「私を助けてはいけない」と病人は言った。「丈夫な人たちを助けなさい」"
    "translation_status": "reviewed"
  - "id": "f04-003"
    "section_id": "fable-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Will you kindly tell me why?\" inquired the fireman, for he was a civil fellow."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 60
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8854
        "line_end": 8855
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8854-8855"
    "translation_ja": "「なぜなのか、教えていただけますか」と火消しは尋ねた。礼儀正しい男だったからである。"
    "translation_status": "reviewed"
  - "id": "f04-004"
    "section_id": "fable-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Nothing could possibly be fairer," said the sick man. "The strong should be preferred in all cases, because they are of more service in the world."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 61
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8857
        "line_end": 8859
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8857-8859"
    "translation_ja": "「それより公平なことはありえません」と病人。「強い者は世の役にいっそう立つのだから、いかなる場合にも優先すべきです」"
    "translation_status": "reviewed"
  - "id": "f04-005"
    "section_id": "fable-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      The fireman pondered a while, for he was a man of some philosophy. "Granted," said he at last, as a part of the roof fell in; "but for the sake of conversation, what would you lay down as the proper service of the strong?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 62
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8861
        "line_end": 8864
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8861-8864"
    "translation_ja": "火消しはいくらか哲学の心得があったので、しばし考えた。「認めましょう」と屋根の一部が落ちてきたとき、ようやく言った。「しかし、ものの話として、強い者はどうしてこそ世の役に立つとお考えで？」"
    "translation_status": "reviewed"
  - "id": "f04-006"
    "section_id": "fable-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Nothing can possibly be easier," returned the sick man; "the proper service of the strong is to help the weak."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 63
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8866
        "line_end": 8867
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8866-8867"
    "translation_ja": "「それほど分かりきったこともありますまい」と病人。「強い者が本当に役に立つのは、弱い者を助けることによってです」"
    "translation_status": "reviewed"
  - "id": "f04-007"
    "section_id": "fable-04"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Again the fireman reflected, for there was nothing hasty about this excellent creature. "I could forgive you being sick," he said at last, as a portion of the wall fell out, "but I cannot bear your being such a fool." And with that he heaved up his fireman's axe, for he was eminently just, and clove the sick man to the bed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 64
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8869
        "line_end": 8873
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8869-8873"
    "translation_ja": |-
      火消しはまた考えた。この立派な人物には早まったところがいささかもなかったのである。「あなたが病気なのは許せる」と、壁が一部崩れ落ちたとき、ようやく口を開いた。「けれども、そんな馬鹿なのは我慢がならない」そしていかにも正義心の強い男であったから、火消しの斧を振りかぶり、病人を寝台までまっぷたつに断ち割った。
    "translation_status": "reviewed"
  - "id": "f05-000"
    "section_id": "fable-05"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      V
      THE DEVIL AND THE INNKEEPER
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 65
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8878
        "line_end": 8880
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8878-8880"
    "translation_ja": "五　悪魔と宿屋の主人"
    "translation_status": "reviewed"
  - "id": "f05-001"
    "section_id": "fable-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      Once upon a time the devil stayed at an inn, where no one knew him, for they were people whose education had been neglected. He was bent on mischief, and for a time kept everybody by the ears. But at last the innkeeper set a watch upon the devil and took him in the fact.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 66
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8883
        "line_end": 8886
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8883-8886"
    "translation_ja": |-
      むかし、悪魔がある宿に泊まった。そこではだれも悪魔とは気づかなかった。ろくな教育を受けていない連中だったからである。悪魔は悪さを働くつもりでいて、しばらくは皆をいがみ合わせておいた。だがついに宿の主人は悪魔を見張らせ、現場を押さえた。
    "translation_status": "reviewed"
  - "id": "f05-002"
    "section_id": "fable-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The innkeeper got a rope's end."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 67
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8888
        "line_end": 8888
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8888-8888"
    "translation_ja": "主人は綱の切れ端を持ってきた。"
    "translation_status": "reviewed"
  - "id": "f05-003"
    "section_id": "fable-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Now I'm going to thrash you,\" said the innkeeper."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 68
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8890
        "line_end": 8890
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8890-8890"
    "translation_ja": "「さあ、これでひっぱたいてやる」と主人は言った。"
    "translation_status": "reviewed"
  - "id": "f05-004"
    "section_id": "fable-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "You have no right to be angry with me," said the devil. "I am only the devil, and it is my nature to do wrong."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 69
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8892
        "line_end": 8893
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8892-8893"
    "translation_ja": "「お前がわしに腹を立てる筋合いはない」と悪魔は言った。「わしはただの悪魔だ。悪いことをするのが生まれつきなのだ」"
    "translation_status": "reviewed"
  - "id": "f05-005"
    "section_id": "fable-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Is that so?\" asked the innkeeper."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 70
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8895
        "line_end": 8895
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8895-8895"
    "translation_ja": "「そうなのか？」と主人。"
    "translation_status": "reviewed"
  - "id": "f05-006"
    "section_id": "fable-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Fact, I assure you,\" said the devil."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 71
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8897
        "line_end": 8897
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8897-8897"
    "translation_ja": "「まったく、そのとおりだとも」と悪魔。"
    "translation_status": "reviewed"
  - "id": "f05-007"
    "section_id": "fable-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"You really can't help doing ill?\" asked the innkeeper."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 72
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8899
        "line_end": 8899
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8899-8899"
    "translation_ja": "「ほんとに、悪さをせずにはいられないんだな？」と主人。"
    "translation_status": "reviewed"
  - "id": "f05-008"
    "section_id": "fable-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Not in the smallest,\" said the devil; \"it would be useless cruelty to thrash a thing like me.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 73
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8901
        "line_end": 8902
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8901-8902"
    "translation_ja": "「どうしようもない」と悪魔。「わしみたいなものをひっぱたくのは、むごいだけでなんの役にも立たんぞ」"
    "translation_status": "reviewed"
  - "id": "f05-009"
    "section_id": "fable-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"It would indeed,\" said the innkeeper."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 74
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8904
        "line_end": 8904
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8904-8904"
    "translation_ja": "「まったくそのとおりだ」と主人は言った。"
    "translation_status": "reviewed"
  - "id": "f05-010"
    "section_id": "fable-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "And he made a noose and hanged the devil."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 75
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8906
        "line_end": 8906
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8906-8906"
    "translation_ja": "そこで主人は綱を輪に結んで、悪魔の首をくくった。"
    "translation_status": "reviewed"
  - "id": "f05-011"
    "section_id": "fable-05"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"There!\" said the innkeeper."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 76
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8908
        "line_end": 8908
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8908-8908"
    "translation_ja": "「これでよし！」と主人は言った。"
    "translation_status": "reviewed"
  - "id": "f06-000"
    "section_id": "fable-06"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      VI
      THE PENITENT
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 77
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8913
        "line_end": 8915
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8913-8915"
    "translation_ja": "六　悔い改める少年"
    "translation_status": "reviewed"
  - "id": "f06-001"
    "section_id": "fable-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "A man met a lad weeping. \"What do you weep for?\" he asked."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 78
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8918
        "line_end": 8918
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8918-8918"
    "translation_ja": "ある男が、泣いている少年に会った。「何を泣いている？」と男は尋ねた。"
    "translation_status": "reviewed"
  - "id": "f06-002"
    "section_id": "fable-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I am weeping for my sins,\" said the lad."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 79
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8920
        "line_end": 8920
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8920-8920"
    "translation_ja": "「自分の罪を思って泣いています」と少年。"
    "translation_status": "reviewed"
  - "id": "f06-003"
    "section_id": "fable-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"You must have little to do,\" said the man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 80
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8922
        "line_end": 8922
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8922-8922"
    "translation_ja": "「よほど暇なんだな」と男。"
    "translation_status": "reviewed"
  - "id": "f06-004"
    "section_id": "fable-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      The next day they met again. Once more the lad was weeping. "Why do you weep now?" asked the man.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 81
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8924
        "line_end": 8925
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8924-8925"
    "translation_ja": "翌日、二人はまた会った。少年はやはり泣いていた。「今度はなぜ泣く？」と男は尋ねた。"
    "translation_status": "reviewed"
  - "id": "f06-005"
    "section_id": "fable-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I am weeping because I have nothing to eat,\" said the lad."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 82
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8927
        "line_end": 8927
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8927-8927"
    "translation_ja": "「食べるものが何もないので」と少年。"
    "translation_status": "reviewed"
  - "id": "f06-006"
    "section_id": "fable-06"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"I thought it would come to that,\" said the man."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 83
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8929
        "line_end": 8929
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8929-8929"
    "translation_ja": "「いずれそうなると思った」と男は言った。"
    "translation_status": "reviewed"
  - "id": "f07-000"
    "section_id": "fable-07"
    "kind": "heading"
    "origin": "source"
    "source_text": |-
      VII
      THE YELLOW PAINT
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 84
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8934
        "line_end": 8936
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8934-8936"
    "translation_ja": "七　黄色いペンキ"
    "translation_status": "reviewed"
  - "id": "f07-001"
    "section_id": "fable-07"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      In a certain city there lived a physician who sold yellow paint. This was of so singular a virtue that whoso was bedaubed with it from head to heel was set free from the dangers of life, and the bondage of sin, and the fear of death for ever. So the physician said in his prospectus; and so said all the citizens in the city; and there was nothing more urgent in men's hearts than to be properly painted themselves, and nothing they took more delight in than to see others painted. There was in the same city a young man of a very good family but of a somewhat reckless life, who had reached the age of manhood, and would have nothing to say to the paint: "To-morrow was soon enough," said he; and when the morrow came he would still put it off. So he might have continued to do until his death; only, he had a friend of about his own age and much of his own manners; and this youth, taking a walk in the public street, with not one fleck of paint upon his body, was suddenly run down by a water-cart and cut off in the heyday of his nakedness. This shook the other to the soul; so that I never beheld a man more earnest to be painted; and on the very same evening, in the presence of all his family, to appropriate music, and himself weeping aloud, he received three complete coats and a touch of varnish on the top. The physician (who was himself affected even to tears) protested he had never done a job so thorough.
    "source_languages":
      - "en"
    "source_locations":

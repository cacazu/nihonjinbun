        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8647
        "line_end": 8650
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8647-8650"
    "translation_ja": |-
      「ずいぶん綱をゆるめてもらって、好きにしているのは分かる」と船長。「だがそれで私の信念は変わらん。作者は私に敬意を払っている。骨身にそれを感じるよ。砦の戸口でお前と私が話し合ったとき、作者はどっちについていたと思うね？」
    "translation_status": "reviewed"
  - "id": "f01-014"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "And don't he respect me?" cried Silver. "Ah, you should 'a' heard me putting down my mutiny, George Merry and Morgan and that lot, no longer ago'n last chapter; you'd 'a' heard something then! You'd 'a' seen what the Author thinks o' me! But come now, do you consider yourself a virtuous chara'ter clean through?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 16
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8652
        "line_end": 8656
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8652-8656"
    "translation_ja": |-
      「おれにゃ敬意を払わねえってんですか！」シルヴァーは叫んだ。「つい前の章で、おれがジョージ・メリーやモーガン一味の反乱をどうやって鎮めたか、お聞かせしたかったね。いや、ありゃ聞きものでさ。作者がおれをどう買ってるか、分かったでしょうよ。ところで、あんたはご自分がどこを取っても徳の高い人物だとお思いで？」
    "translation_status": "reviewed"
  - "id": "f01-015"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "God forbid!" said Captain Smollett solemnly. "I am a man that tries to do his duty, and makes a mess of it as often as not. I'm not a very popular man at home, Silver, I'm afraid!" and the Captain sighed.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 17
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8658
        "line_end": 8660
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8658-8660"
    "translation_ja": "「とんでもない！」スモレット船長は厳かに言った。「私は務めを果たそうと努めて、半分はしくじる人間だ。国に帰ったところで、人望のある男とはいえんだろうよ、シルヴァー」と船長はため息をついた。"
    "translation_status": "reviewed"
  - "id": "f01-016"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Ah," says Silver. "Then how about this sequel of yours? Are you to be Cap'n Smollett just the same as ever and not very popular at home, says you? And if so, why, it's 'Treasure Island' over again, by thunder; and I'll be Long John and Pew'll be Pew, and we'll have another mutiny as like as not. Or are you to be somebody else? And if so, why, what the better are you? and what the worse am I?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 18
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8662
        "line_end": 8667
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8662-8667"
    "translation_ja": |-
      「ほう」とシルヴァー。「じゃ、あんたのおっしゃる続編はどうなります？　やっぱり以前どおりスモレット船長で、国元じゃさほど好かれもしねえ、と？　だとすりゃ、畜生、『宝島』のやり直しじゃねえですか。おれはロング・ジョンで、ピューはピュー、おおかたまた反乱だ。それともあんたは別人になるんで？　だとすりゃ、あんたは何を得する？　おれは何を損する？」
    "translation_status": "reviewed"
  - "id": "f01-017"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Why, look here, my man," returned the Captain; "I can't understand how this story comes about at all, can I? I can't see how you and I who don't exist should get to speaking here, and smoke our pipes for all the world like reality? Very well, then, who am I to pipe up with my opinions? I know the Author's on the side of good; he tells me so, it runs out of his pen as he writes. Well, that's all I need to know; I'll take my chance upon the rest."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 19
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8669
        "line_end": 8675
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8669-8675"
    "translation_ja": |-
      「まあ聞け」と船長は答えた。「そもそもこの物語がどうして出来るか、私に分かるかね？　実在しないお前と私がここで語り合い、まるで現実そのままに煙草をふかしているのはなぜか、私には分からん。ならば、私ごときが何を偉そうに意見を吹き鳴らせよう？　作者が善の側にいることは知っている。そう私に告げている。書くそばからそのペンににじみ出るんだ。分かるのはそれだけでいい。あとは運を天に任せるよ」
    "translation_status": "reviewed"
  - "id": "f01-018"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "It's a fact he seemed to be against George Merry," Silver admitted, musingly. "But George is little more'n a name at the best of it," he added, brightening. "And to get into soundings for once. What is this good? I made a mutiny, and I been a gentleman o' fortune; well, but by all stories, you ain't no such saint. I'm a man that keeps company very easy; even by your own account, you ain't, and to my certain knowledge you're a devil to haze. Which is which? Which is good and which bad? Ah, you tell me that! Here we are in stays, and you may lay to it!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 20
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8677
        "line_end": 8684
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8677-8684"
    "translation_ja": |-
      「なるほど、作者はジョージ・メリーには反対らしかったな」とシルヴァーは考えこみながら認めた。「もっともジョージなんざ、よくて名前に毛が生えた程度だがね」と顔を明るくして付け足した。「ここらで一度、底を測ってみましょうや。その善とは何です？　おれは反乱を起こしたし、海賊稼業もやってきた。だが聞いたかぎり、あんただってさほどの聖人じゃねえ。おれはだれとでも気楽につきあえる男だが、あんたはご自分でおっしゃるとおりそうじゃねえ。それに部下をしごくとなると鬼だってことは、おれがこの目で見て知ってる。さて、どっちがどっちだ。どっちが善でどっちが悪で？　言ってごらんなせえ。さあ、船首が風に向いたまんま、身動き取れねえでしょうよ！」
    "translation_status": "reviewed"
  - "id": "f01-019"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "We're none of us perfect," replied the Captain. "That's a fact of religion, my man. All I can say is, I try to do my duty; and if you try to do yours, I can't compliment you on your success."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 21
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8686
        "line_end": 8688
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8686-8688"
    "translation_ja": "「だれだって完全ではない」と船長は答えた。「それは信仰の教える事実だ。私に言えるのは、自分の務めを果たそうと努めているということだ。お前もそう努めているというなら、首尾のほどは褒められんな」"
    "translation_status": "reviewed"
  - "id": "f01-020"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"And so you was the judge, was you?\" said Silver, derisively."
    "source_languages":

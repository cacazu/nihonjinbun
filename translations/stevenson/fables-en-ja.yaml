        "line_end": 8696
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8692-8696"
    "translation_ja": |-
      「お前相手なら裁判官も絞首刑執行人も引き受けて、眉一つ動かさん」と船長。「だがそれだけじゃない。神学として正しいかは知らんが、善いものは同時に役に立つものだというのは常識だ。まあ大筋はそんなところだ、私は思想家を気取るつもりはない。さて、善良な登場人物がひとりもいなくて、物語はどこへ行き着く？」
    "translation_status": "reviewed"
  - "id": "f01-022"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"If you go to that,\" replied Silver, \"where would a story begin, if there wasn't no villains?\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 24

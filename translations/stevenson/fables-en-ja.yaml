    "translation_ja": |-
      「同じ論法でゆけば」と船長は穏やかに答えた。「重要な探究にはいっさい着手する値打ちがないことになる。結論に達するまでにこちらの命が尽きる見込みのほうが、いつだって圧倒的に大きいからだ。スポーカー君、君は人間の置かれた境遇を考えたことがないな」と船長は微笑し、首を振った。
    "translation_status": "reviewed"
  - "id": "f02-007"

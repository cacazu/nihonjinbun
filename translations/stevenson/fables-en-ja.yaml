        "original_unit_id": "pg30650-lines-9162-9164"
    "translation_ja": "「よくやった」とおじは言った。「剣を取り、わざわざいにしえの館まで来た。よい思いつき、勇気のある行いだった。しかし、これで得心がいっただろう。腕を組んで家へ帰り、夕飯を食べようじゃないか」"
    "translation_status": "reviewed"
  - "id": "f08-027"
    "section_id": "fable-08"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"O dear no!\" said Jack. \"I am not satisfied yet.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 127
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 9166

    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8759-8766"
    "translation_ja": |-
      「諸君」と船長。「そんなことをしても理屈に合わんぞ。船はあと十分で沈むんです、と君らは言うのだろう。なるほど、それがどうした？　哲学の目で眺めれば、われわれの境遇には何も新しいところはない。われわれは生まれてこのかた、いつだって、十分どころか十秒後に血管が破れるか、雷に打たれるかという瀬戸際にいたかもしれん。だからといって夕飯を食わなかったかね。いや、貯蓄銀行に金を預けることだってやめはしなかった。胸に手を当てて断言するが、私には諸君の態度が理解できん」
    "translation_status": "reviewed"
  - "id": "f02-011"
    "section_id": "fable-02"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "The men were already too far gone to pay much heed."

    "source_text": |-
      I
      THE PERSONS OF THE TALE
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 2
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8593
        "line_end": 8595
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8593-8595"
    "translation_ja": "一　物語の登場人物"
    "translation_status": "reviewed"
  - "id": "f01-001"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      After the 32nd chapter of "Treasure Island," two of the puppets strolled out to have a pipe before business should begin again, and met in an open place not far from the story.
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 3
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8598
        "line_end": 8600
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8598-8600"
    "translation_ja": "『宝島』の第三十二章が済むと、出番がまた始まるまで一服しようと、操り人形が二体ぶらぶらと外に出てきて、物語からほど遠くない空き地で出くわした。"
    "translation_status": "reviewed"
  - "id": "f01-002"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Good-morning, Cap'n,\" said the first, with a man-o'-war salute, and a beaming countenance."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 4
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8602
        "line_end": 8603
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8602-8603"
    "translation_ja": "「おはようござんす、船長」一人が海軍仕込みの敬礼をして、にこにこ顔で言った。"
    "translation_status": "reviewed"
  - "id": "f01-003"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Ah, Silver!\" grunted the other. \"You're in a bad way, Silver.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 5
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8605
        "line_end": 8605
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8605-8605"
    "translation_ja": "「おう、シルヴァーか」と相手は鼻を鳴らした。「お前も先が思いやられるな、シルヴァー」"
    "translation_status": "reviewed"
  - "id": "f01-004"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Now, Cap'n Smollett," remonstrated Silver, "dooty is dooty, as I knows, and none better; but we're off dooty now; and I can't see no call to keep up the morality business."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 6
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8607
        "line_end": 8609
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8607-8609"
    "translation_ja": |-
      「そいつはないでしょう、スモレット船長」とシルヴァーは抗議した。「お役目はお役目、そりゃだれよりおれが承知してまさ。でも今は非番だ。善だの悪だののお芝居を、ここまで持ち出すこたあないでしょう」
    "translation_status": "reviewed"
  - "id": "f01-005"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"You're a damned rogue, my man,\" said the Captain."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 7
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8611
        "line_end": 8611
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8611-8611"
    "translation_ja": "「お前はまったくの悪党だよ」と船長。"
    "translation_status": "reviewed"
  - "id": "f01-006"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Come, come, Cap'n, be just," returned the other. "There's no call to be angry with me in earnest. I'm on'y a chara'ter in a sea story. I don't really exist."
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 8
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8613
        "line_end": 8615
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8613-8615"
    "translation_ja": "「まあまあ船長、公平に願いますよ」と相手は答えた。「本気でおれに腹を立てるこたあない。おれは海の冒険物語の登場人物にすぎねえ。ほんとにいるわけじゃねえんだ」"
    "translation_status": "reviewed"
  - "id": "f01-007"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": "\"Well, I don't really exist either,\" says the Captain, \"which seems to meet that.\""
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 9
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8617
        "line_end": 8618
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8617-8618"
    "translation_ja": "「ふむ、私だってほんとにいるわけじゃない」と船長。「それで今の話にはけりがつくようだがね」"
    "translation_status": "reviewed"
  - "id": "f01-008"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I wouldn't set no limits to what a virtuous chara'ter might consider argument," responded Silver. "But I'm the villain of this tale, I am; and speaking as one sea-faring man to another, what I want to know is, what's the odds?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 10
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8620
        "line_end": 8623
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8620-8623"
    "translation_ja": "「徳の高い登場人物が何を理屈とお認めになるか、おれなんぞがここまでと線は引きませんがね」とシルヴァー。「だがおれはこの話の悪役だ。船乗り同士、腹を割って言やあ、それがどうしたってんです？」"
    "translation_status": "reviewed"
  - "id": "f01-009"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Were you never taught your catechism?" said the Captain. "Don't you know there's such a thing as an Author?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 11
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8625
        "line_end": 8626
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8625-8626"
    "translation_ja": "「教理問答は習わなかったのか」と船長は言った。「作者というものがあるのも知らんのか？」"
    "translation_status": "reviewed"
  - "id": "f01-010"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Such a thing as a Author?" returned John derisively. "And who better'n me? And the p'int is, if the Author made you, he made Long John, and he made Hands, and Pew, and George Merry--not that George is up to much, for he's little more'n a name; and he made Flint, what there is of him; and he made this here mutiny, you keep such a work about; and he had Tom Redruth shot; and--well, if that's a Author, give me Pew!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 12
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8628
        "line_end": 8633
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8628-8633"
    "translation_ja": |-
      「作者というものがあるかだって？」ジョンは鼻で笑った。「おれよりよく知ってるやつがいますかね？　肝心なのは、作者があんたを作ったのなら、このロング・ジョンも、ハンズも、ピューも、ジョージ・メリーも作ったってことだ。まあジョージは名ばかりみてえなもんで大したやつじゃねえが。フリントも、話に出てくる分だけは作った。あんたがあんなに騒ぐこの反乱を作ったのも作者だし、トム・レッドルースを撃たせたのもだ。そんなのが作者なら、おれはピューのほうを取りますね！」
    "translation_status": "reviewed"
  - "id": "f01-011"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "Don't you believe in a future state?" said Smollett. "Do you think there's nothing but the present story-paper?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 13
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8635
        "line_end": 8636
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8635-8636"
    "translation_ja": "「お前は来世を信じないのか」とスモレットは言った。「この連載雑誌が今ここにあるきりで、あとは何もないと思うのか？」"
    "translation_status": "reviewed"
  - "id": "f01-012"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I don't rightly know for that," said Silver; "and I don't see what it's got to do with it, anyway. What I know is this: if there is sich a thing as a Author, I'm his favourite chara'ter. He does me fathoms better'n he does you--fathoms, he does. And he likes doing me. He keeps me on deck mostly all the time, crutch and all; and he leaves you measling in the hold, where nobody can't see you, nor wants to, and you may lay to that! If there is a Author, by thunder, but he's on my side, and you may lay to it!"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
        "source_sequence": 14
        "url": "https://gutenberg.pglaf.org/cache/epub/30650/pg30650.txt"
        "line_start": 8638
        "line_end": 8645
    "source_alignment":
      - "source_id": "gutenberg-30650"
        "original_unit_id": "pg30650-lines-8638-8645"
    "translation_ja": |-
      「そのへんはよく分かりませんね」とシルヴァー。「どっちにせよ、何の関係があるんです？　おれが知ってるのは、作者ってもんがいるんなら、いちばんのごひいきはこのおれだってことだ。あんたを書くより何尋も深くおれが書けてる、何尋もね。おれを書くのが好きと来てる。松葉杖ごと、ほとんど出ずっぱりで甲板に置いとくじゃねえですか。あんたのほうは船倉にほったらかしでくすぶって、だれにも見えやしねえし、見たがるやつもいねえ。こいつは請け合いだ。作者がいるんなら、畜生め、ありゃおれの味方だ。賭けたっていいぜ！」
    "translation_status": "reviewed"
  - "id": "f01-013"
    "section_id": "fable-01"
    "kind": "paragraph"
    "origin": "source"
    "source_text": |-
      "I see he's giving you a long rope," said the Captain. "But that can't change a man's convictions. I know the Author respects me; I feel it in my bones: when you and I had that talk at the blockhouse door, who do you think he was for, my man?"
    "source_languages":
      - "en"
    "source_locations":
      - "source_id": "gutenberg-30650"
        "precision": "line"
